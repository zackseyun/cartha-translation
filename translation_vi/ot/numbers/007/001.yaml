revisions:
- from: 'Vào ngày Môi-se dựng xong Đền Tạm[a], ông xức dầu và biệt riêng nơi ấy ra thánh, cùng với mọi vật dụng trong đó; ông cũng làm như vậy với bàn thờ và mọi dụng cụ của bàn thờ: ông xức dầu và biệt riêng tất cả ra thánh.'
  to: Vào ngày Môi-se dựng xong Đền Tạm[a], ông xức dầu và thánh hiến nó cùng mọi vật dụng của nó, cũng như bàn thờ và mọi dụng cụ của bàn thờ; ông xức dầu và thánh hiến chúng.
  rationale: Bản sửa khôi phục cấu trúc liệt kê của tiếng Hê-bơ-rơ, không thêm hành động “làm như vậy”, và dùng “thánh hiến” để diễn đạt tự nhiên, chính xác nghĩa nghi lễ của קדשׁ. Đại từ “chúng” ở cuối giữ nguyên sự khái quát của hậu tố số nhiều, không quyết định quá mức phạm vi quy chiếu.
