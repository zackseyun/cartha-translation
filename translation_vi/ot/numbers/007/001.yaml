id: NUM.7.1
reference: Numbers 7:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: vi
  text: Vào ngày Môi-se dựng xong Đền Tạm[a], ông xức dầu và thánh hiến nó cùng mọi vật dụng của nó, cũng như bàn thờ và mọi dụng cụ của bàn thờ; ông xức dầu và thánh hiến chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Khi Môi-se đã dựng xong Đền Tạm.” Cụm thời gian tiếng Hê-bơ-rơ cũng có thể được dịch theo cách tự nhiên hơn như vậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Vào
  rationale: Trong câu này, công thức tự sự וַיְהִי chủ yếu dẫn vào mốc thời gian; tiếng Việt tự nhiên không cần dịch thành một mệnh đề riêng như “chuyện xảy ra rằng”.
- source_word: בְּיוֹם כַּלּוֹת
  choice: Vào ngày ... xong
  rationale: Giữ khá sát thành ngữ thời gian của tiếng Hê-bơ-rơ, đồng thời diễn đạt tự nhiên trong tiếng Việt; chú thích nêu cách hiểu rộng hơn là “khi ... xong”.
- source_word: לְהָקִים
  choice: dựng
  rationale: Động từ Hiphil của קום trong ngữ cảnh này nói đến việc dựng hoặc thiết lập nơi thánh; “dựng” ngắn gọn và cụ thể.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Cách gọi quen thuộc trong tiếng Việt cho nơi thánh lưu động của dân Israel, vừa dễ hiểu vừa phù hợp ngữ cảnh.
- source_word: וַיִּמְשַׁח
  choice: xức dầu
  rationale: Diễn đạt rõ hành động nghi lễ của משׁח, thay vì chỉ dùng “xức” vốn có thể không minh bạch với độc giả phổ thông.
- source_word: וַיְקַדֵּשׁ
  choice: biệt riêng ... ra thánh
  rationale: Thể hiện nghĩa nghi lễ của קדשׁ là dành riêng cho sự thánh, không gợi ý sự biến đổi đạo đức của đồ vật.
- source_word: כָּל כֵּלָיו (Đền Tạm)
  choice: mọi vật dụng trong đó
  rationale: כְּלִים ở đây bao quát các đồ đạc và vật dụng thuộc Đền Tạm; cách dịch này tự nhiên và không thu hẹp quá mức.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Tương đương chuẩn và rõ nghĩa của מִזְבֵּחַ trong tiếng Việt.
- source_word: כָּל כֵּלָיו (bàn thờ)
  choice: mọi dụng cụ của bàn thờ
  rationale: Ở lần thứ hai, từ này chỉ cụ thể các dụng cụ dùng với bàn thờ, nên “dụng cụ” chính xác hơn “vật dụng”.
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: ông xức dầu và biệt riêng tất cả ra thánh
  rationale: Đại từ số nhiều được dịch bằng “tất cả” để giữ phạm vi quy chiếu tổng hợp mà không quyết đoán thu hẹp nó chỉ vào bàn thờ và dụng cụ.
theological_decisions:
- issue: Thuật ngữ về sự thánh trong nghi lễ
  choice: biệt riêng ... ra thánh
  alternative: thánh hóa; hiến thánh
  rationale: Ngữ cảnh là việc dành các vật thuộc nơi thánh cho công dụng thánh, không phải sự biến đổi đạo đức. Cách dịch đã chọn rõ nghĩa với độc giả hiện đại và tránh sắc thái hệ phái.
- issue: Phạm vi của đại từ số nhiều בסוף הפסוק
  choice: tất cả
  alternative: chúng, chỉ bàn thờ và các dụng cụ của bàn thờ
  rationale: Hình thái số nhiều có thể quy chiếu trực tiếp đến nhóm danh từ gần nhất, nhưng trong cấu trúc lặp lại cũng có thể tóm kết toàn bộ các vật vừa nêu. “Tất cả” duy trì tính tóm kết mà không giải quyết quá mức phạm vi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Môi-se”, “Đền Tạm”, “bàn thờ” theo cách gọi Kinh Thánh quen thuộc; làm rõ nghi thức bằng “xức dầu” và “biệt riêng ... ra thánh”. Dấu hai chấm ở vế cuối thể hiện tính chất tóm kết của nguyên văn.
