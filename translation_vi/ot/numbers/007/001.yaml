    issue: Thêm cụm “ông cũng làm như vậy với bàn thờ”
    rationale: Nguyên văn nối trực tiếp “và bàn thờ cùng mọi dụng cụ của nó” vào đối tượng được xức dầu và thánh hiến. Cụm thêm này là diễn giải và có thể khiến người đọc hiểu rằng có một hành động khác, thay vì cùng một chuỗi đối tượng.
  - severity: low
    issue: “nơi ấy” thay cho đại từ chỉ Đền Tạm
    rationale: אֹתוֹ quy chiếu trực tiếp đến Đền Tạm; “nó” giữ liên kết văn bản sát hơn, còn “nơi ấy” chuyển sang cách gọi chỉ nơi chốn không cần thiết.
  - severity: low
    issue: “biệt riêng ... ra thánh” hơi gượng và lặp lại
    rationale: Dù đúng ý nghĩa cơ bản, cách nói này không phải lựa chọn tự nhiên nhất trong văn phong Kinh Thánh Việt hiện đại. “Thánh hiến” diễn đạt chuẩn xác hành động nghi lễ קדשׁ.
