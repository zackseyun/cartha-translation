base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/006.yaml
  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: vi
  text: Môi-se lấy các xe và đàn bò[a], rồi trao chúng cho người Lê-vi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng một danh từ tập hợp chỉ “bò”; các câu khác trong chương xác định đó là bò đực.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nhận
  rationale: Động từ לקח thường có nghĩa là “lấy”; trong ngữ cảnh các lễ vật vừa được dâng, “nhận” diễn đạt tự nhiên việc Môi-se tiếp nhận chúng mà không làm thay đổi ý nghĩa.
- source_word: הָעֲגָלֹת
  choice: các xe
  rationale: Danh từ עֲגָלוֹת chỉ các phương tiện có bánh dùng để chuyên chở. “Các xe” tự nhiên và đủ rõ trong tiếng Việt hiện đại; “xe bò” có thể khiến người đọc hiểu rằng nguyên văn đã xác định loại sức kéo ngay trong danh từ.
- source_word: הַבָּקָר
  choice: đàn bò
  rationale: בָּקָר là danh từ tập hợp chỉ bò. “Đàn bò” giữ sắc thái tập hợp của nguyên văn; ngữ cảnh trong chương cho biết đây là bò đực dùng để kéo xe.
- source_word: וַיִּתֵּן
  choice: trao
  rationale: נתן cơ bản là “cho”. Trong ngữ cảnh chuyển giao lễ vật cho người Lê-vi sử dụng, “trao” vừa tự nhiên vừa giữ được hành động chuyển giao, không diễn giải thành “phân bổ”.
- source_word: אוֹתָם
  choice: chúng
  rationale: Đại từ tân ngữ số nhiều quy chiếu chung đến các xe và đàn bò; “chúng” là cách tương đương tự nhiên.
- source_word: אֶל הַלְוִיִּם
  choice: cho người Lê-vi
  rationale: אֶל ở đây đánh dấu bên tiếp nhận trong việc chuyển giao. “Cho người Lê-vi” là cách nói tự nhiên trong tiếng Việt và vẫn thể hiện rõ hướng chuyển giao.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Vậy” để nối tiếp diễn tiến tường thuật; giữ “đàn bò” thay vì thu hẹp ngay thành “bò đực”. Dấu chú thích [a] được đặt sau mệnh đề có từ cần giải thích.
