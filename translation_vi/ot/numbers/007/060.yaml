  text: בַּ/יּוֹם֙ הַ/תְּשִׁיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: vi
  text: Vào ngày thứ chín, người lãnh đạo của con cháu Bên-gia-min[a] là A-bi-đan, con trai Ghi-đê-ô-ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người lãnh đạo đại diện cho con cháu Bên-gia-min.” Giới từ Hê-bơ-rơ ở đây có thể diễn tả quan hệ thuộc về hoặc sự đại diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: Ngày thứ chín
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, truyền đạt chính xác giới từ ב cùng số thứ tự bổ nghĩa cho יוֹם.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Trong Dân Số Ký 7, từ này chỉ người đứng đầu được công nhận của một bộ tộc; lựa chọn này rõ nghĩa và tránh sắc thái hoàng gia dễ gây hiểu lầm của “hoàng tử”.
- source_word: לִבְנֵי בִנְיָמִן
  choice: của dòng dõi Bên-gia-min
  rationale: “Dòng dõi Bên-gia-min” diễn đạt tự nhiên nhóm bộ tộc xuất thân từ Bên-gia-min, trong khi “các con trai của Bên-gia-min” trong tiếng Việt dễ bị hiểu hẹp là các con trực hệ. Chú thích giữ lại khả năng giới từ ל mang nghĩa đại diện.
- source_word: אֲבִידָן
  choice: A-bi-đan
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Giữ chính xác quan hệ phụ hệ trong cấu trúc tên gọi Hê-bơ-rơ.
- source_word: גִּדְעֹנִי
  choice: Ghi-đê-ô-ni
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt danh xưng bộ tộc בְנֵי בִנְיָמִן
  choice: dòng dõi Bên-gia-min
  alternative: các con trai của Bên-gia-min; người Bên-gia-min
  rationale: Trong ngữ cảnh hành chính-bộ tộc, cụm từ chỉ cộng đồng hậu duệ mang tên tổ phụ. “Dòng dõi” bảo toàn ý niệm huyết thống mà không khiến độc giả tiếng Việt hiểu nhầm đây chỉ là các con trực hệ; không thêm một cách hiểu giáo phái.
- issue: Quan hệ do giới từ ל trong לִבְנֵי בִנְיָמִן
  choice: người lãnh đạo của dòng dõi Bên-gia-min
  alternative: người lãnh đạo đại diện cho dòng dõi Bên-gia-min
  rationale: Giới từ có thể chỉ quan hệ thuộc về hoặc vai trò đại diện. Bản văn chính dùng cách nói tự nhiên nhưng chú thích nêu phương án đại diện để không xóa bỏ độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ cấu trúc liệt kê nghi lễ của phân đoạn; tên riêng được phiên âm có dấu và phân âm tiết theo thông lệ tiếng Việt.
