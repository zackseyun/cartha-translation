  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: vi
  text: 'Về tế lễ bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con một tuổi. Đó là lễ vật của A-hi-ê-xe, con trai Am-mi-sa-đai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật hiệp thông” hoặc “lễ vật an lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: Còn về lễ vật hiệp thông
  rationale: Cụm giới từ nối mục cuối trong danh sách lễ vật. “Lễ vật hiệp thông” diễn đạt tự nhiên chức năng của thuật ngữ tế tự שְׁלָמִים mà không thu hẹp nó vào một cách giải nghĩa duy nhất.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר chỉ chung gia súc thuộc loài bò, không xác định giới tính; cách dịch này tránh thêm ý “bò đực”.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con chiên đực
  rationale: אֵילִם chỉ chiên đực trưởng thành trong danh sách tế lễ.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ cụ thể dê đực; bản dịch giữ rõ giới tính.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con một tuổi
  rationale: Giữ cả loại vật và tuổi theo nghĩa đen của thành ngữ “con của một năm”, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: Dùng “đó là” phù hợp công thức tường thuật lặp lại; קָרְבָּן được dịch là “lễ vật” trong ngữ cảnh dâng hiến.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: A-hi-ê-xe, con trai A-mi-sa-đai
  rationale: Phiên âm tên riêng theo lối Việt hóa dễ đọc; בֶּן được thể hiện trực tiếp là “con trai”.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ tế tự שְׁלָמִים
  choice: lễ vật hiệp thông
  alternative: lễ vật bình an; lễ vật cầu an
  rationale: Thuật ngữ có trường nghĩa liên quan đến bình an, sự toàn vẹn và mối hiệp thông. Bản chính chọn cách gọi dễ hiểu trong ngữ cảnh tế lễ, còn chú thích bảo tồn các khả năng dịch khác mà không áp đặt một cách giải thích thần học duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Duy trì nhịp liệt kê của nguyên văn; không xác định giới tính của בָּקָר khi tiếng Hê-bơ-rơ không nêu rõ. Dấu chú thích [a] được đặt ngay sau cụm có vấn đề từ vựng.
