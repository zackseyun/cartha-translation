revisions:
- from: 'Còn về lễ vật hiệp thông: hai con bò[a], năm con chiên đực, năm con dê đực và năm con chiên con một tuổi. Đó là lễ vật của A-hi-ê-xe, con trai A-mi-sa-đai.'
  to: 'Về tế lễ bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con một tuổi. Đó là lễ vật của A-hi-ê-xe, con trai Am-mi-sa-đai.'
  rationale: Sửa thuật ngữ chính để phản ánh cả זֶבַח (“tế lễ”) và שְׁלָמִים (“bình an”), đồng thời đặt các cách dịch diễn giải hơn vào chú thích. Điều chỉnh chú thích để không thêm ý “cầu xin,” và chuẩn hóa tên Am-mi-sa-đai sát hơn với dạng Hê-bơ-rơ.
