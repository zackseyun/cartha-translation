  register: Văn phong trang trọng nhưng hiện đại, giữ cấu trúc liệt kê của bản Hê-bơ-rơ và dùng các thuật ngữ dễ hiểu. Các đơn vị cổ và hai loại vật đựng được phân biệt rõ; dấu chấm phẩy tách phần kê khai trọng lượng khỏi phần mô tả vật chứa.
