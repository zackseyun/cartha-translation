  terminology: “Lễ vật,” “mâm bạc,” “siếc-lơ của nơi thánh,” “bột mịn,” và “lễ vật ngũ cốc” đều phù hợp. “Bát bạc” phân biệt đủ với “mâm bạc” và phản ánh đúng hơn מִזְרָק mà không áp đặt một chức năng nghi lễ cụ thể ngoài văn bản.
