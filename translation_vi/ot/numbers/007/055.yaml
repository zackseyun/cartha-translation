base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông gồm một mâm bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc[b] nặng bảy mươi siếc-lơ, theo chuẩn siếc-lơ của nơi thánh[c]; cả hai đều đựng đầy bột mịn trộn với dầu để làm lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đĩa bạc”; từ Hê-bơ-rơ chỉ một vật đựng nông.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bình bạc”; đây là vật đựng dùng trong nghi thức tại nơi thánh.
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “theo siếc-lơ của nơi thánh”, tức theo tiêu chuẩn trọng lượng được dùng tại nơi thánh.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Lễ vật của ông gồm
  rationale: קָרְבָּן chỉ vật được dâng trong bối cảnh thờ phượng. “Lễ vật” tự nhiên và phù hợp ngữ cảnh; “gồm” được thêm để diễn đạt trôi chảy danh sách không có động từ trong tiếng Hê-bơ-rơ.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một mâm bạc
  rationale: קַעֲרָה là một vật đựng tương đối nông; “mâm” diễn tả hình dạng và công dụng tốt hơn “đĩa” trong danh mục vật dụng nơi thánh.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách nói tự nhiên trong tiếng Việt và diễn đạt מִשְׁקָלָהּ bằng “nặng”.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק là vật đựng dùng trong nghi lễ hiến tế. “Chậu” phân biệt nó với chiếc mâm nông đứng trước và không khiến người đọc nghĩ đến bát ăn thông thường.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Cụm từ nêu trọng lượng của chiếc chậu; thêm “nặng” làm rõ quan hệ cú pháp vốn hàm ẩn trong danh sách.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo chuẩn siếc-lơ của nơi thánh
  rationale: Cụm từ quy định tiêu chuẩn cân đo. “Theo chuẩn” truyền đạt chức năng của giới từ בְּ mà vẫn giữ thuật ngữ “siếc-lơ của nơi thánh”.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Giữ rõ đại từ chỉ hai vật đựng và chuyển mệnh đề không động từ sang cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: סֹלֶת là loại bột tinh mịn dùng làm lễ vật. “Bột mịn” chính xác mà không thêm loại ngũ cốc không được nêu rõ trong câu.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn với dầu
  rationale: Phân từ bị động mô tả bột đã được hòa trộn với dầu; cách dịch này rõ ràng và hiện đại.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong văn mạch tế lễ của Ngũ Kinh, מִנְחָה chỉ lễ vật làm từ ngũ cốc, nên cần dịch cụ thể thay vì chỉ nói chung là “lễ vật”.
