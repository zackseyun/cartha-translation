  source_fidelity: 'Bản dịch truyền đạt đầy đủ chuỗi kê khai trong tiếng Hê-bơ-rơ: lễ vật, hai vật bằng bạc với trọng lượng tương ứng theo chuẩn thánh, và việc cả hai chứa bột mịn trộn dầu dùng cho lễ vật ngũ cốc. Tuy nhiên, מִזְרָק là một bát/bình nghi lễ hơn là “chậu”; “chậu” trong tiếng Việt hiện đại thường gợi một đồ chứa lớn, dùng để rửa hoặc giặt, nên kém sát ngữ cảnh vật dụng tế tự.'
