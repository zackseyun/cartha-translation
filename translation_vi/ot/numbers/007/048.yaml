base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: vi
  text: Ngày thứ bảy, người lãnh đạo của con cháu Ép-ra-im là Ê-li-sa-ma, con trai Am-mi-hút.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người lãnh đạo đại diện cho con cháu Ép-ra-im.” Giới từ Hê-bơ-rơ có thể chỉ mối quan hệ hoặc sự đại diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Ngày thứ bảy
  rationale: Giới từ בְּ kết hợp với יוֹם và số thứ tự tạo thành cụm chỉ thời gian; cách dịch này tự nhiên và chính xác trong tiếng Việt.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Trong Dân Số 7, từ này chỉ người đứng đầu bộ tộc dâng lễ vật; “người lãnh đạo” rõ nghĩa, hiện đại và tránh sắc thái quân chủ dễ gây hiểu lầm của “thủ lĩnh” hay “hoàng tử”.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: của con cháu Ép-ra-im
  rationale: Giới từ לְ có thể chỉ quan hệ hoặc sự đại diện. “Con cháu Ép-ra-im” chuyển tải thành ngữ huyết thống Hê-bơ-rơ một cách tự nhiên hơn lối dịch sát chữ “các con trai của Ép-ra-im” trong ngữ cảnh bộ tộc.
- source_word: אֱלִישָׁמָע
  choice: Ê-li-sa-ma
  rationale: Tên riêng được phiên âm theo âm tiết để độc giả tiếng Việt dễ đọc.
- source_word: בֶּן עַמִּיהוּד
  choice: con trai Am-mi-hút
  rationale: Cấu trúc phụ hệ Hê-bơ-rơ được diễn đạt trực tiếp và tự nhiên, đồng thời giữ rõ quan hệ cha–con.
