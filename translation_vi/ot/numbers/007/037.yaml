  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đơn vị cổ “siếc-lơ” bằng lối phiên âm quen thuộc, đồng thời dùng chú thích để giải thích các vật dụng và tiêu chuẩn cân mà không làm câu chính nặng nề.
