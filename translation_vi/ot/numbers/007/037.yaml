  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông gồm có một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc[b] nặng bảy mươi siếc-lơ, theo siếc-lơ của nơi thánh[c]; cả hai đều đựng đầy bột mịn trộn với dầu để làm lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khay” hoặc “bát nông”; từ Hê-bơ-rơ קַעֲרָה chỉ một vật đựng tương đối rộng và nông.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bát dùng để rảy”; trong những ngữ cảnh khác, vật này được dùng để hắt hoặc rảy chất lỏng trong nghi lễ.
    reason: lexical_alternative
  - marker: c
    text: “Theo siếc-lơ của nơi thánh” nghĩa là theo tiêu chuẩn trọng lượng được quy định cho nơi thánh.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Lễ vật của ông
  rationale: קָרְבָּן chỉ vật được dâng lên trong việc thờ phượng; “lễ vật” tự nhiên, trang trọng và phù hợp ngữ cảnh tế lễ.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קְעָרָה có thể chỉ đĩa, khay hoặc bát nông; “đĩa” giữ nghĩa rộng về một vật đựng tương đối nông, còn phương án khác được ghi ở chú thích.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: 'Diễn đạt tự nhiên cấu trúc Hê-bơ-rơ “trọng lượng của nó: một trăm ba mươi”, đồng thời bảo toàn con số và đơn vị.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק là vật đựng dùng trong nghi lễ, đôi khi để hắt hoặc rảy huyết; “chậu” không áp đặt công dụng cụ thể trong câu chính.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Nêu rõ đây là trọng lượng của chậu, tránh cách diễn đạt tối nghĩa trong tiếng Việt.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ của nơi thánh
  rationale: Giữ sắc thái thờ phượng của הַקֹּדֶשׁ và cho thấy đây là tiêu chuẩn cân dùng tại nơi thánh.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Chỉ rõ hai vật đựng vừa kể và diễn đạt tự nhiên trạng thái chúng chứa đầy lễ vật.
- source_word: סֹלֶת
  choice: bột lọc
  rationale: סֹלֶת là loại bột mịn, tinh tuyển dùng trong tế lễ; “bột lọc” là thuật ngữ Việt ngữ gọn và trang trọng, không nhất thiết giới hạn vào một loại ngũ cốc cụ thể.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: nhồi với dầu
  rationale: Động từ בלל trong chỉ dẫn tế lễ diễn tả việc trộn kỹ bột với dầu; “nhồi với dầu” phù hợp thao tác chế biến bột và tự nhiên trong tiếng Việt.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong ngữ cảnh tư tế, מִנְחָה là lễ vật làm từ sản phẩm ngũ cốc; cách dịch này phân biệt nó với lễ vật nói chung.
