revisions:
- from: Lễ vật của ông gồm có một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc[b] nặng bảy mươi siếc-lơ, theo siếc-lơ của nơi thánh[c]; cả hai đều đựng đầy bột lọc nhồi với dầu để làm lễ vật ngũ cốc.
