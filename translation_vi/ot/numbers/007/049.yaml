revisions:
- from: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc nặng bảy mươi siếc-lơ, theo siếc-lơ nơi thánh; cả hai đều đựng đầy bột lọc nhuyễn trộn dầu để làm lễ vật ngũ cốc.
  to: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc nặng bảy mươi siếc-lơ, theo đơn vị siếc-lơ của nơi thánh; cả hai đều đầy bột mịn trộn với dầu, dùng làm lễ vật bằng ngũ cốc.
  rationale: Bản sửa giữ nguyên danh mục tế lễ và mọi số đo của nguyên văn, đồng thời làm rõ chuẩn cân của nơi thánh, dùng từ hiện đại tự nhiên hơn cho bột tinh, và chỉnh các cụm từ tiếng Việt cho trôi chảy. Chú thích được điều chỉnh để phản ánh các khả năng từ vựng của hai tên vật dụng mà không áp đặt hình dáng chính xác hơn nguyên văn cho phép.
