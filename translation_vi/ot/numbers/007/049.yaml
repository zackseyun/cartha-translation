base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc nặng bảy mươi siếc-lơ, theo đơn vị siếc-lơ của nơi thánh; cả hai đều đầy bột mịn trộn với dầu, dùng làm lễ vật bằng ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mâm” cho “đĩa”; “bát” ở phần sau cũng có thể dịch là “chậu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Lễ vật của ông gồm
  rationale: קָרְבָּן chỉ vật được dâng trong bối cảnh thờ phượng. Cách diễn đạt này tự nhiên trong tiếng Việt và dẫn vào danh mục các vật phẩm.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קְעָרָה là một vật chứa, có thể là đĩa hoặc mâm; “đĩa bạc” ngắn gọn và phù hợp với vật dụng nghi lễ.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Chuyển cấu trúc danh từ của tiếng Hê-bơ-rơ thành cách nói tự nhiên trong tiếng Việt mà vẫn giữ nguyên số đo.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק là chậu hoặc tô dùng trong nghi lễ hiến tế; “chậu” gợi đúng hơn loại vật chứa phục vụ nghi lễ.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Cụm từ xác định chuẩn cân dùng tại nơi thánh; giữ sắc thái nghi lễ mà không diễn giải quá mức thành một đơn vị hiện đại.
- source_word: סֹלֶת
  choice: bột lọc nhuyễn
  rationale: סֹלֶת chỉ loại bột tinh, được sàng lọc kỹ để dùng làm lễ vật.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn dầu
  rationale: Diễn đạt trực tiếp cách chuẩn bị bột, tự nhiên trong tiếng Việt hiện đại.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong văn cảnh tế lễ của sách Dân Số, מִנְחָה là lễ vật làm từ ngũ cốc, không chỉ là lễ vật nói chung.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và mang tính liệt kê như nguyên văn. Phiên âm “siếc-lơ” được giữ làm đơn vị cân cổ; “nơi thánh” diễn đạt chuẩn cân nghi lễ. Dùng “ông” vì câu này tiếp nối danh sách người dâng lễ vật trong ngữ cảnh rộng hơn.
