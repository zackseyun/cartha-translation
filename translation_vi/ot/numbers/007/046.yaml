  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/046.yaml
  text: one male goat for a sin offering;[a]
translation:
  language: vi
  text: một con dê đực làm lễ vật chuộc tội;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay, sát nghĩa hơn, “vì tội.” Trong ngữ cảnh tế lễ này, từ Hê-bơ-rơ thường chỉ “lễ vật chuộc tội.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ chỉ một con dê giống đực; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ rõ giới tính của con vật.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số từ được nêu rõ trong tiếng Hê-bơ-rơ, phù hợp với lối liệt kê lễ vật lặp lại trong Dân Số Ký 7.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת thường là thuật ngữ chỉ lễ vật dâng liên quan đến tội lỗi; 'làm' diễn đạt tự nhiên chức năng hoặc sự chỉ định của con vật trong danh sách.
theological_decisions:
- issue: Cách dịch חַטָּאת trong ngữ cảnh tế lễ
  choice: lễ vật chuộc tội
  alternative: vì tội
  rationale: Trong các danh sách tế lễ thuộc truyền thống tư tế, חַטָּאת thường chỉ một loại lễ vật chứ không chỉ khái niệm 'tội'. Bản dịch giữ ý nghĩa nghi lễ mà không bổ sung một cách giải thích thần học vượt quá văn bản.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, giữ cấu trúc của một mục trong danh sách lễ vật. Dấu chấm phẩy được giữ vì câu này là một phần của danh sách dài hơn.
