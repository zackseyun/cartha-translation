source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: vi
  text: 'và cho sinh tế bình an[a]: hai con bò[b], năm con cừu đực, năm con dê đực và năm con cừu non đực một tuổi. Đó là lễ vật của Pha-ghi-ên, con trai Óc-ran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sinh tế giao hảo” hoặc “sinh tế cầu an”; từ Hê-bơ-rơ chỉ một loại tế lễ gắn với sự bình an, toàn vẹn và mối tương giao.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng từ tập hợp chỉ loài bò, không nói rõ đây là bò đực hay bò cái.
    reason: lexical_clarification
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: và cho sinh tế bình an
  rationale: Cụm giới từ tiếp tục danh sách lễ vật; “sinh tế” diễn đạt זֶבַח là lễ vật được hiến tế, còn “bình an” giữ cách gọi quen thuộc của loại tế lễ שְׁלָמִים mà không thu hẹp ý nghĩa vào một cách giải thích duy nhất.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là danh từ tập hợp chỉ gia súc thuộc loài bò và ở đây không nêu rõ giới tính; vì vậy không dịch cụ thể thành “bò đực”.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con cừu đực
  rationale: אֵילִם chỉ những con cừu đực trưởng thành; cách diễn đạt này rõ ràng trong tiếng Việt hiện đại.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ dê đực, nên giữ rõ giới tính của con vật.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên đực một tuổi
  rationale: כְּבָשִׂים ở đây chỉ chiên non giống đực, còn בְּנֵי שָׁנָה xác định chúng một tuổi.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: Công thức kết thúc xác định toàn bộ danh sách vừa nêu là lễ vật của người dâng; “Đó là” tự nhiên trong lời kể tiếng Việt.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: Pha-ghi-ên, con trai Óc-ran
  rationale: Tên riêng được phiên âm sang tiếng Việt; “con trai” diễn đạt rõ quan hệ phụ hệ בֶּן.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ tế lễ שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế giao hảo; sinh tế cầu an
  rationale: Thuật ngữ có thể gợi sự bình an, toàn vẹn và mối tương giao. Bản dịch chính dùng cách gọi dễ nhận biết, còn chú thích giữ các khả năng khác thay vì quyết định một cách giải nghĩa thần học duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “sinh tế” cho loại lễ vật được hiến tế, đồng thời phân biệt tự nhiên giữa “cừu đực” trưởng thành và “chiên đực” một tuổi. Dấu chú thích được đặt đúng ngay sau các cụm từ liên quan.
