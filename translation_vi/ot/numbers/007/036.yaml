  text: בַּ/יּוֹם֙ הַ/חֲמִישִׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/036.yaml
  text: On the fifth day Shelumiel son of Zurishaddai[a], leader of the sons of Simeon,
translation:
  language: vi
  text: 'Ngày thứ năm, người lãnh đạo của con cháu Si-mê-ôn là Sê-lu-mi-ên, con trai Xu-ri-sa-đai:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Ngày thứ năm
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, giữ nguyên số thứ tự và không thêm ý “lễ cung hiến” vốn không có trong câu này.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Chỉ người đứng đầu được công nhận của chi tộc; cách dịch này rõ nghĩa trong tiếng Việt hiện đại và tránh sắc thái hoàng gia của “vương tử”.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: của con cháu Si-mê-ôn
  rationale: Giữ khá sát cấu trúc Hê-bơ-rơ “của các con trai của Si-mê-ôn”, đồng thời dùng “con cháu” để diễn đạt tự nhiên ý hậu duệ/chi tộc trong tiếng Việt.
- source_word: שְׁלֻמִיאֵל
  choice: Sê-lu-mi-ên
  rationale: Phiên âm tên riêng sang tiếng Việt theo âm tiết, không dịch nghĩa tên.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ phụ tử trong công thức tên gọi.
- source_word: צוּרִישַׁדָּי
  choice: Xu-ri-sa-đai
  rationale: Phiên âm tên riêng sang tiếng Việt theo âm tiết, không dịch nghĩa tên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc câu chưa trọn vẹn bằng dấu hai chấm vì bản Hê-bơ-rơ không có động từ và câu tiếp tục sang danh sách lễ vật ở câu sau; từ “là” được dùng như liên từ nhận diện tự nhiên trong tiếng Việt, không nhằm thêm một mệnh đề hoàn chỉnh độc lập.
