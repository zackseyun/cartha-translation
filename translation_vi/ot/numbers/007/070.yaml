  text: one male goat for a sin offering[a].
translation:
  language: vi
  text: một con dê đực làm lễ vật chuộc tội[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để làm lễ vật chuộc tội.” Từ Hê-bơ-rơ חַטָּאת có thể có nghĩa là “tội lỗi”, nhưng trong ngữ cảnh tế lễ như ở đây, từ này chỉ “lễ vật chuộc tội”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ Hê-bơ-rơ chỉ một con dê giống đực. “Con dê đực” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và vẫn giữ đúng loại sinh vật dùng làm lễ vật.
- source_word: אֶחָד
  choice: một
  rationale: Số từ này trực tiếp đếm con vật được dâng; giữ “một” phù hợp với lối liệt kê lặp lại của Dân Số Ký 7.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật liên quan đến việc xử lý tội lỗi. Giới từ לְ được diễn đạt tự nhiên bằng “làm” trong cấu trúc liệt kê mục đích sử dụng lễ vật.
theological_decisions:
- issue: Cách dịch חַטָּאת trong ngữ cảnh tế lễ
  choice: lễ vật chuộc tội
  alternative: vì tội lỗi
  rationale: Ngữ cảnh là bản kê các lễ vật, nên danh từ mang nghĩa tế lễ chứ không chỉ khái niệm trừu tượng “tội lỗi”. Cách dịch này giữ rõ chức năng của con vật mà không bổ sung một hệ thống giải thích thần học riêng.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, phù hợp với cấu trúc liệt kê của phân đoạn. Dùng “lễ vật chuộc tội” để người đọc phổ thông nhận ra đây là một loại lễ vật, đồng thời tránh thuật ngữ cổ hoặc nặng tính hệ phái.
