  yaml_path: translation/ot/numbers/007/038.yaml
  text: one gold dish[a], ten shekels[b], full of incense.
translation:
  language: vi
  text: một chén[a] bằng vàng, nặng mười siếc-lơ[b], đầy hương.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đĩa nhỏ”, “bát” hoặc, theo cách dịch truyền thống, là “muỗng”.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dịch sát là “một chén vàng, mười vàng, đầy hương”. Trong văn cảnh này, “mười vàng” là công thức trọng lượng rút gọn, được hiểu là mười siếc-lơ vàng; vì thế bản dịch bổ sung “nặng” và “siếc-lơ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: chén
  rationale: Trong danh mục lễ vật tại Đền Tạm, từ này chỉ một vật đựng nhỏ dùng trong nghi lễ. “Chén” tự nhiên trong tiếng Việt và tránh khiến người đọc hình dung một chiếc muỗng ăn.
- source_word: אַחַת
  choice: một
  rationale: Số từ bổ nghĩa cho כַּף, được dịch trực tiếp.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Chỉ vật liệu làm chiếc chén; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: עֲשָׂרָה זָהָב
  choice: nặng mười siếc-lơ
  rationale: Đây là công thức trọng lượng tỉnh lược trong văn cảnh lặp lại của Dân Số 7. Thêm “nặng” và đơn vị “siếc-lơ” để diễn đạt rõ ý hàm ẩn, còn chú thích bảo lưu hình thức sát chữ Hê-bơ-rơ.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Diễn đạt tự nhiên trạng thái chiếc chén đầy vật được chứa bên trong.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm dùng để dâng trong nghi lễ; “hương liệu” phù hợp ngữ cảnh thờ phượng và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích, phù hợp một câu trong danh mục lễ vật. Dùng “chén” thay vì “muỗng” để tránh liên tưởng đến dụng cụ ăn uống; các từ được bổ sung nhằm làm rõ công thức trọng lượng tỉnh lược đều được ghi chú.
