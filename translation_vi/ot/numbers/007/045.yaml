translation:
  language: vi
  text: một con bò đực thuộc đàn bò, một con cừu đực, một con chiên đực một tuổi, dùng làm lễ vật toàn thiêu;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: một con bò đực từ đàn bò
  rationale: Trong ngữ cảnh tế lễ, פַּר chỉ bò đực; בֶּן בָּקָר xác định đó là con vật thuộc đàn bò. Cách dịch này giữ đủ ý và cấu trúc liệt kê của tiếng Hê-bơ-rơ.
- source_word: אַיִל אֶחָד
  choice: một con cừu đực
  rationale: אַיִל là cừu đực trưởng thành; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: כֶּבֶשׂ אֶחָד
  choice: một con chiên đực
  rationale: כֶּבֶשׂ chỉ chiên non giống đực. Giữ từ “đực” để thể hiện đặc điểm được từ nguồn nêu rõ.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ chỉ tuổi của con vật; “một tuổi” là cách diễn đạt tiếng Việt ngắn gọn, tự nhiên.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; “lễ thiêu” là cách gọi súc tích, phù hợp với danh mục tế lễ.
- source_word: אֶחָד
  choice: một
  rationale: Số từ được lặp lại trước từng con vật để xác định riêng số lượng; bản dịch bảo tồn kiểu liệt kê này.
