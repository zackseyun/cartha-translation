  text: một con dê đực làm lễ vật chuộc tội;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ חַטָּאת trong tiếng Hê-bơ-rơ có thể chỉ lễ vật xử lý tội lỗi và sự ô uế về nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ Hê-bơ-rơ chỉ một con dê giống đực. Cách dịch này rõ ràng, tự nhiên trong tiếng Việt hiện đại và giữ đúng loại sinh vật dùng làm lễ vật.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số từ để phản ánh lối liệt kê lặp lại và chính xác của Dân Số Ký 7.
- source_word: לְחַטָּאת
  choice: để làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật liên quan đến việc xử lý tội lỗi hoặc sự ô uế; giới từ לְ diễn tả mục đích hoặc công dụng. Cách dịch này tự nhiên và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Ở đây chắc chắn nói đến một loại lễ vật, nhưng thuật ngữ Hê-bơ-rơ có thể nhấn mạnh việc xử lý tội lỗi hoặc thanh tẩy sự ô uế. Bản chính dùng cách gọi dễ hiểu hơn, còn chú thích giữ lại sắc thái thay thế chính đáng.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và súc tích, phù hợp với cấu trúc liệt kê lễ vật. Dấu chấm phẩy được giữ để phản ánh câu liệt kê rộng hơn trong văn mạch.
