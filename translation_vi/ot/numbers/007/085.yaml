  naturalness: Câu văn trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. “Mỗi đĩa bạc” và “mỗi chậu” phù hợp với văn cảnh bản kê.
  terminology: “Siếc-lơ”, “đĩa bạc”, “chậu”, và “nơi thánh” nhất quán với văn cảnh nghi lễ. Giữ chú thích cho cách diễn đạt thay thế của chuẩn cân là phù hợp.
