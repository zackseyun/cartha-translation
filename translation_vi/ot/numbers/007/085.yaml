  rationale: Thay “Tổng số bạc dùng làm các vật dụng” bằng “Tổng trọng lượng bạc của các vật dụng” để phản ánh trực tiếp quan hệ sở hữu trong nguyên văn và ngữ cảnh tổng trọng lượng tính bằng siếc-lơ, mà không thêm thông tin diễn giải. Các phần khác của bản dịch được giữ nguyên.
