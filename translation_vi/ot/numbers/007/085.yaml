  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: vi
  text: Mỗi đĩa bạc nặng một trăm ba mươi siếc-lơ, và mỗi chậu nặng bảy mươi siếc-lơ. Tổng trọng lượng bạc của các vật dụng là hai ngàn bốn trăm siếc-lơ, tính theo siếc-lơ của nơi thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo tiêu chuẩn siếc-lơ nơi thánh.”'
    reason: Cụm בְּשֶׁקֶל הַקֹּדֶשׁ có thể được diễn đạt như tên một chuẩn trọng lượng chuyên biệt hoặc như đơn vị siếc-lơ gắn với nơi thánh.
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: một trăm ba mươi
  rationale: Đảo trật tự số đếm theo cách nói tự nhiên của tiếng Việt, tương ứng chính xác với tổng số 130.
- source_word: הַקְּעָרָה הָאַחַת כֶּסֶף
  choice: mỗi đĩa bạc
  rationale: Trong văn cảnh bản kê lễ vật lặp lại, danh từ số ít có mạo từ đi với אֶחָד mang nghĩa phân phối, chỉ trọng lượng của từng đĩa; כֶּסֶף chỉ chất liệu bạc.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: mỗi chậu
  rationale: מִזְרָק là một loại chậu hoặc bát dùng trong nghi lễ; “chậu” rõ nghĩa và phù hợp với văn cảnh. Cấu trúc số ít được hiểu theo nghĩa phân phối như ở vế trước.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: tổng số bạc dùng làm các vật dụng
  rationale: כֹּל nêu tổng lượng bạc, còn הַכֵּלִים chỉ các đồ dùng hay vật dụng. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ đây là tổng trọng lượng bạc của các đồ vật.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: hai ngàn bốn trăm
  rationale: Cách diễn đạt số 2.400 tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: tính theo siếc-lơ của nơi thánh
  rationale: Giới từ בְּ ở đây chỉ tiêu chuẩn cân đo; “của nơi thánh” giữ sát cấu trúc sở hữu của nguyên văn và tránh diễn giải quá mức.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng thông dụng. Dùng “siếc-lơ” làm đơn vị trọng lượng phiên âm; lặp “nặng” ở hai vế để câu tiếng Việt rõ ràng, dù nguyên văn lược động từ. “Nơi thánh” giữ sắc thái nghi lễ mà không áp đặt cách hiểu hệ phái.
