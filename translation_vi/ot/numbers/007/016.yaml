  text: one male goat for a sin offering;[a]
translation:
  language: vi
  text: một con dê đực làm lễ vật chuộc tội;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ chỉ một con đực thuộc loài dê. “Con dê đực” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và giữ đúng tính cụ thể của con vật hiến tế.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số từ để phản ánh chính xác lối liệt kê và số lượng lễ vật trong Dân Số Ký 7.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ loại lễ vật liên quan đến tội lỗi; “lễ vật chuộc tội” là cách gọi rõ ràng, tự nhiên và trang trọng. Giới từ לְ được thể hiện bằng “làm” trong cấu trúc liệt kê này.
theological_decisions:
- issue: Cách gọi lễ חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Thuật ngữ Hê-bơ-rơ có thể được hiểu theo chức năng xử lý tội lỗi hoặc thanh tẩy. Bản chính dùng cách gọi quen thuộc và dễ hiểu “lễ vật chuộc tội” mà không thêm diễn giải thần học; phương án “lễ vật thanh tẩy” vẫn là một khả năng học thuật nhưng không cần đưa vào câu ngắn này.
translation_notes:
  register: Văn phong trang trọng, hiện đại và súc tích, phù hợp với cấu trúc liệt kê lễ vật. Không cần chú thích vì “con dê đực” diễn đạt trực tiếp và tự nhiên; dấu chấm phẩy được giữ để phù hợp với vị trí của câu trong danh sách.
