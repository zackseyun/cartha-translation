  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc[b] nặng bảy mươi siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh[c]; cả hai đều đựng đầy bột mịn trộn dầu để làm lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mâm bạc”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bát bạc”.
    reason: lexical_alternative
  - marker: c
    text: Nghĩa là theo tiêu chuẩn trọng lượng được dùng tại nơi thánh.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Lễ vật của ông gồm
  rationale: קָרְבָּן chỉ vật được dâng trong bối cảnh thờ phượng. “Lễ vật” tự nhiên và chính xác; thêm “gồm” giúp mở đầu danh mục trôi chảy mà không thay đổi nội dung.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קְעָרָה chỉ một vật đựng tương đối nông, có thể dịch là đĩa hoặc mâm; “đĩa bạc” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Diễn đạt trực tiếp trọng lượng theo trật tự số tự nhiên của tiếng Việt, đồng thời giữ nguyên đơn vị cổ.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק là vật đựng dùng trong nghi lễ, có thể là chậu hoặc bát. “Chậu” phân biệt nó với chiếc đĩa nông nói trước và phù hợp công dụng nghi lễ.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Bổ sung “nặng” theo cú pháp tiếng Việt để làm rõ đây là trọng lượng của chiếc chậu.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Giữ sát cách nói Hê-bơ-rơ, chỉ tiêu chuẩn cân dùng tại nơi thánh; chú thích giải nghĩa để độc giả hiện đại dễ hiểu.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Giữ sự quy chiếu rõ ràng đến hai vật đựng và diễn đạt tự nhiên rằng chúng chứa đầy vật liệu dâng lễ.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: סֹלֶת là loại bột mịn dùng trong nghi lễ dâng tế; “bột mịn” là cách dịch chính xác, dễ hiểu.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn dầu
  rationale: Phân từ bị động mô tả bột đã được trộn với dầu; tiếng Việt tự nhiên có thể lược “với” trong cụm này.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong văn mạch tư tế, מִנְחָה là lễ vật làm từ ngũ cốc, không chỉ là lễ vật nói chung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đơn vị cổ “siếc-lơ” thay vì quy đổi phỏng đoán sang đơn vị hiện đại; dùng cấu trúc liệt kê phù hợp văn bản nghi lễ.
