    rationale: “Theo siếc-lơ nơi thánh” chưa nêu rõ siếc-lơ là tiêu chuẩn cân của nơi thánh. Bản sửa làm rõ chức năng của cụm בְּשֶׁקֶל הַקֹּדֶשׁ mà không thêm thông tin ngoài văn bản.
