revisions:
- from: 'và để dâng sinh tế bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên đực một tuổi. Đó là lễ vật của Ê-li-sa-ma, con trai A-mi-hút.'
  to: 'và cho tế lễ bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên đực một tuổi. Đó là lễ vật của Ê-li-sa-ma, con trai A-mi-hút.'
  rationale: Chỉnh cụm mở đầu để tái hiện trực tiếp giới từ liên kết của tiếng Hê-bơ-rơ thay vì thêm ý “để dâng”. Chuẩn hóa thuật ngữ và chú thích theo tiếng Việt hiện đại, không làm thay đổi nội dung danh sách. Giữ “chiên đực” vì כְּבָשִׂים là danh từ giống đực, và giữ “một tuổi” cho בְּנֵי שָׁנָה.
