source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: vi
  text: 'và cho tế lễ bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên đực một tuổi. Đó là lễ vật của Ê-li-sa-ma, con trai A-mi-hút.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tế lễ thông công” hoặc “tế lễ phúc an”; từ Hê-bơ-rơ chỉ một loại tế lễ thường gắn với bữa ăn chung, diễn tả sự bình an, trọn vẹn hoặc an khang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: và để dâng sinh tế bình an
  rationale: Cụm từ mở đầu thêm một hạng mục vào danh sách lễ vật. “Sinh tế” diễn đạt זֶבַח trong bối cảnh hiến tế; “bình an” giữ mối liên hệ của שְׁלָמִים với sự bình an, toàn vẹn và hòa thuận mà không thu hẹp nghĩa vào riêng khía cạnh thông công.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là danh từ tập hợp chỉ gia súc thuộc loài bò; bản Hê-bơ-rơ không xác định giới tính, nên không dịch cụ thể thành “bò đực”.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con chiên đực
  rationale: אֵילִם chỉ chiên đực trưởng thành trong danh sách hiến tế.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ rõ dê đực, vì vậy giữ lại giới tính của con vật.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên đực một tuổi
  rationale: כְּבָשִׂים ở đây chỉ chiên non giống đực, còn thành ngữ בְּנֵי שָׁנָה có nghĩa là “một tuổi”; cách dịch giữ cả loại, giới tính và tuổi theo quy cách hiến tế.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: Mệnh đề không có động từ dùng để xác định lễ vật vừa liệt kê; “Đó là” tự nhiên trong mạch kể quá khứ của tiếng Việt.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Ê-li-sa-ma, con trai A-mi-hút
  rationale: Phiên âm tên riêng sang dạng dễ đọc trong tiếng Việt và dịch בֶּן minh nhiên là “con trai”.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ hiến tế שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công; sinh tế cầu an
  rationale: Thuật ngữ có thể gợi sự bình an, toàn vẹn và bữa ăn hiến tế được chia sẻ. “Sinh tế bình an” giữ được độ rộng ngữ nghĩa tốt hơn, còn chú thích ghi nhận các cách hiểu hợp lý khác.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ cấu trúc liệt kê rõ ràng. Dùng “con” làm loại từ tự nhiên cho từng con vật; tên riêng được phiên âm có gạch nối để người đọc phổ thông dễ phát âm.
