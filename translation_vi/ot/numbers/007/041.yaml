  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: vi
  text: 'Và về của lễ bình an[a]: hai con bò[b], năm con chiên đực, năm con dê đực và năm con chiên con đực một tuổi. Đó là lễ vật của Sê-lu-mi-ên, con trai Xu-ri-sa-đai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “của lễ hiệp thông” hoặc “của lễ phúc an”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ בָּקָר là từ chỉ chung loài bò; một số bản dịch dịch là “bò đực”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: Còn về sinh tế bình an
  rationale: Liên từ và giới từ mở đầu hạng mục tiếp theo trong danh sách. “Sinh tế” diễn đạt זֶבַח theo ngữ cảnh tế lễ; “bình an” giữ cách gọi truyền thống của שְׁלָמִים, đồng thời chú thích các khả năng khác.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là từ chỉ chung loài bò, không nhất thiết chỉ bò đực; cách dùng loại từ “con” tự nhiên trong tiếng Việt.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con chiên đực
  rationale: אֵילִים chỉ chiên đực trưởng thành trong ngữ cảnh tế lễ.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ rõ dê giống đực, nên bản dịch bảo lưu giới tính.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con đực một tuổi
  rationale: כְּבָשִׂים ở đây là chiên con giống đực, còn בְּנֵי שָׁנָה là thành ngữ chỉ độ tuổi một năm.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: Công thức tổng kết được diễn đạt tự nhiên trong lời kể tiếng Việt; קָרְבַּן là thuật ngữ khái quát “lễ vật”.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: Sê-lu-mi-ên, con trai Xu-ri-sa-đai
  rationale: Tên riêng được phiên âm sang tiếng Việt, còn בֶּן được dịch trực tiếp là “con trai” trong công thức xác định gia hệ.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ tế lễ שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế hiệp thông; sinh tế phúc lành
  rationale: Thuật ngữ Hê-bơ-rơ có trường nghĩa liên quan đến bình an, phúc lành và sự hiệp thông. Bản chính dùng cách gọi quen thuộc nhưng chú thích các khả năng để không thu hẹp ý nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ nhịp liệt kê của văn bản Hê-bơ-rơ. Các dấu chú thích [a], [b] được đặt ngay sau đúng thuật ngữ liên quan.
