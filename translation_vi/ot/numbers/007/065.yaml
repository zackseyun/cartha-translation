  source_fidelity: Bản nháp giữ đúng số lượng, loài vật, giới tính của chiên và dê, tuổi của chiên con, cùng công thức kết và quan hệ phụ hệ. Tuy nhiên, “sinh tế thù ân” không phản ánh trực tiếp, rõ ràng trường nghĩa của הַשְּׁלָמִים (bình an/an lành, trọn vẹn), và “để làm” làm câu mở đầu kém sát cấu trúc giới từ לְ.
  naturalness: “Và cho tế lễ bình an” tự nhiên, trang trọng và rõ hơn “và để làm sinh tế thù ân”. “Cừu” là từ hiện đại thông dụng; các cụm liệt kê còn lại được giữ nhịp gọn, rõ.
  terminology: Dùng “tế lễ bình an” cho זֶבַח הַשְּׁלָמִים, một cách dịch sát và có thể nhận diện được; chú thích bảo lưu các khả năng “thù ân”, “hiệp thông” và “an lành”. “Cừu đực” phản ánh chính xác אֵילִם; “cừu đực một tuổi” phản ánh כְּבָשִׂים בְּנֵי שָׁנָה mà không thêm chi tiết.
  issues:
