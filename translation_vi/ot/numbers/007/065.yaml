revisions:
- from: 'và để làm sinh tế thù ân[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con đực một tuổi. Đó là lễ vật của A-bi-đan, con trai Ghi-đê-ô-ni.'
  to: 'và cho tế lễ bình an[a]: hai con bò, năm con cừu đực, năm con dê đực và năm con cừu đực một tuổi. Đó là lễ vật của A-bi-đan, con trai Ghi-đê-ô-ni.'
  rationale: Thay thuật ngữ chính bằng “tế lễ bình an” để phản ánh trực tiếp hơn הַשְּׁלָמִים và tránh diễn giải thần học trong thân văn. Lược “để làm” để câu bám sát hơn cấu trúc nguyên ngữ. Đổi “chiên” thành “cừu” nhằm đạt cách dùng hiện đại, đồng thời vẫn bảo toàn phân biệt chiên đực và chiên con đực trong tiếng Hê-bơ-rơ. Các thông tin số lượng, giới tính, tuổi tác, tên riêng và công thức kết được giữ nguyên.
