source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: vi
  text: 'và cho tế lễ bình an[a]: hai con bò, năm con cừu đực, năm con dê đực và năm con cừu đực một tuổi. Đó là lễ vật của A-bi-đan, con trai Ghi-đê-ô-ni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tế lễ thù ân”, “tế lễ hiệp thông” hoặc “tế lễ an lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: và để làm sinh tế thù ân
  rationale: Giữ liên kết với danh sách trước bằng “và”; “sinh tế” diễn đạt זֶבַח trong bối cảnh tế lễ, còn “thù ân” là thuật ngữ tiếng Việt trang trọng, quen thuộc cho שְׁלָמִים, đồng thời chú thích bảo lưu các sắc thái bình an, hiệp thông và an lành.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là danh từ tập hợp chỉ gia súc loài bò và tại đây không nêu rõ giới tính; “hai con bò” tự nhiên và không diễn giải quá mức.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con chiên đực
  rationale: אֵילִם chỉ chiên đực; cách dịch này rõ nghĩa đối với độc giả hiện đại.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ dê đực, nên bản dịch giữ thông tin giới tính của con vật hiến tế.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con đực một tuổi
  rationale: כְּבָשִׂים ở đây là chiên con đực và בְּנֵי שָׁנָה có nghĩa thành ngữ là một tuổi; trật tự tiếng Việt được điều chỉnh cho tự nhiên.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: Công thức kết đoạn xác định toàn bộ danh sách là lễ vật của người dâng. “Đó là” phản ánh mệnh đề danh từ không có động từ chỉ thì trong tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: A-bi-đan, con trai Ghi-đê-ô-ni
  rationale: Phiên âm tên riêng sang dạng dễ đọc trong tiếng Việt và dịch rõ cấu trúc phụ hệ בֶּן.
theological_decisions:
- issue: Ý nghĩa của הַשְּׁלָמִים
  choice: sinh tế thù ân
  alternative: sinh tế bình an; sinh tế hiệp thông; sinh tế cầu an lành
  rationale: Từ Hê-bơ-rơ có trường nghĩa liên hệ đến bình an, an lành và sự hiệp thông trong bữa ăn tế lễ. Bản chính dùng thuật ngữ tế tự Việt ngữ gọn và trang trọng, còn chú thích nêu các cách hiểu chính để không khóa chặt ý nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp liệt kê của văn bản Hê-bơ-rơ. Tên riêng được phiên âm có gạch nối theo lối Việt hóa.
