base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/057.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: vi
  text: một con bò đực thuộc đàn bò[a], một con chiên đực, một con chiên con đực một tuổi, làm của lễ thiêu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen trong tiếng Hê-bơ-rơ: “một con bò đực, con của đàn bò.” Đây là thành ngữ chỉ một con bò đực thuộc đàn gia súc, cũng có thể dịch là “một con bò đực non.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: con bò đực
  rationale: Danh từ chỉ bò đực, thường là bò đực non, trong danh mục tế lễ; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: אֶחָד
  choice: một
  rationale: Số từ chỉ một con vật ở từng mục trong danh sách lễ vật.
- source_word: בֶּן בָּקָר
  choice: trong đàn
  rationale: Cụm từ theo nghĩa đen là “con của đàn bò”, nhưng dùng theo lối thành ngữ để xác định đây là gia súc thuộc đàn bò; kết hợp với “bò đực” giúp tránh lặp nặng nề.
- source_word: אַיִל
  choice: con chiên đực
  rationale: Chỉ chiên đực trưởng thành dùng trong bối cảnh tế lễ.
- source_word: כֶּבֶשׂ
  choice: con chiên con đực
  rationale: Chỉ chiên con, ở đây là con đực dùng làm sinh tế; cách dịch nêu rõ loài và giới tính.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ chỉ con vật được một tuổi hoặc đang trong năm đầu; “một tuổi” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là thuật ngữ tế lễ chỉ sinh tế được thiêu dâng; giới từ לְ nêu mục đích của các con vật.
