  source_fidelity: Bản dịch chuyển tải đầy đủ ba con vật, số lượng từng con, tuổi của chiên con và mục đích tế lễ. Tuy nhiên, לְעֹלָה chỉ rõ các con vật được dâng làm một loại lễ tế; “để làm lễ thiêu” dễ khiến “lễ” được hiểu là hành vi/nghi thức hơn là lễ vật.
