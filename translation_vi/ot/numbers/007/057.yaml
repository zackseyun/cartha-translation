translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp với dạng liệt kê lễ vật. Dùng “lễ thiêu” là thuật ngữ ngắn gọn, dễ hiểu trong tiếng Việt hiện đại; giữ dấu chấm phẩy vì câu này thuộc một danh sách dài.
