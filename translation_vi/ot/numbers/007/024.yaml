  yaml_path: translation/ot/numbers/007/024.yaml
  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: vi
  text: 'Ngày thứ ba, người lãnh đạo của con cháu Xê-bu-lun[a] là Ê-li-áp, con trai Hê-lôn.


    [a] Cũng có thể dịch: “người lãnh đạo đại diện cho con cháu Xê-bu-lun.” Giới từ Hê-bơ-rơ ở đây có thể chỉ sự thuộc về hoặc sự đại diện.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người lãnh đạo đại diện cho con cháu Xê-bu-lun.” Giới từ Hê-bơ-rơ ở đây có thể chỉ sự thuộc về hoặc sự đại diện.'
    reason: 'Bảo lưu hai cách hiểu hợp lý của giới từ ל: chỉ sự thuộc về hoặc vai trò đại diện.'
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Ngày thứ ba
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho công thức thời gian “vào ngày thứ ba”; không cần giữ giới từ thành một từ riêng.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Chỉ người đứng đầu được công nhận của một chi tộc; cách dịch này rõ nghĩa, hiện đại và tránh sắc thái hoàng gia dễ gây hiểu lầm của “hoàng tử”.
- source_word: לִבְנֵי
  choice: của con cháu
  rationale: Giữ được ý nghĩa gia tộc của בְּנֵי và hiểu giới từ ל là chỉ sự thuộc về; khả năng chỉ sự đại diện được ghi ở chú thích.
- source_word: זְבוּלֻן
  choice: Xê-bu-lun
  rationale: Phiên âm tên chi tộc sang tiếng Việt theo cách dễ đọc và gần âm Hê-bơ-rơ.
- source_word: אֱלִיאָב
  choice: Ê-li-áp
  rationale: Phiên âm tên riêng sang tiếng Việt theo cách dễ đọc và gần âm Hê-bơ-rơ.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt tự nhiên công thức phụ hệ trong danh sách tên người.
- source_word: חֵלֹן
  choice: Hê-lôn
  rationale: Phiên âm tên riêng sang tiếng Việt theo cách dễ đọc và gần âm Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu tiếng Hê-bơ-rơ không có động từ; thêm “là” để tạo câu định danh tự nhiên trong tiếng Việt mà không bổ sung nội dung mới. Dấu chú thích được đặt ngay sau cụm từ có điểm mơ hồ.
