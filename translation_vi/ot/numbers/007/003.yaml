  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: vi
  text: 'Họ đem lễ vật của mình đến trước mặt Yahweh: sáu xe có mui[a] và mười hai con bò—một xe cho mỗi hai thủ lĩnh, và một con bò cho mỗi người—rồi trình dâng chúng trước Đền Tạm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sáu cỗ xe có mui”. Cụm Hê-bơ-rơ עֶגְלֹת צָב theo cách hiểu truyền thống chỉ những xe vận tải có mui hoặc mái che.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: lễ vật của mình
  rationale: קָרְבָּן chỉ vật được đem đến để dâng trong bối cảnh thờ phượng. “Lễ vật” tự nhiên và phù hợp với nghi lễ ở đây; “của mình” quy chiếu về các thủ lĩnh là chủ thể.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: 'לִפְנֵי diễn tả vị trí hoặc sự hiện diện: “trước mặt, trước sự hiện diện của”; cách dịch này giữ được sắc thái trực tiếp của tiếng Hê-bơ-rơ.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước của Đức Chúa Trời bằng dạng phiên âm thông dụng, thay vì thay thế bằng một tước hiệu.
- source_word: עֶגְלֹת צָב
  choice: xe có mui
  rationale: עֲגָלָה là xe chở hàng; צָב theo cách hiểu truyền thống mô tả xe có mui hoặc có mái che. Cách diễn đạt này ngắn gọn, dễ hiểu và giữ chú thích về độ bất định của cụm từ.
- source_word: בָּקָר / שׁוֹר
  choice: bò đực / con bò
  rationale: בָּקָר có thể chỉ gia súc nói chung, nhưng ngữ cảnh kéo xe và danh từ số ít שׁוֹר trong mệnh đề phân phối cho thấy đây là bò dùng làm sức kéo. “Bò đực” làm rõ số lượng mười hai con; ở vế sau, “con bò” tránh lặp nặng nề.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂיאִם
  choice: cứ hai thủ lĩnh góp một xe
  rationale: 'Cụm từ có ý nghĩa phân phối: mỗi cặp thủ lĩnh tương ứng với một xe. Thêm “góp” làm rõ quan hệ trong tiếng Việt mà không thay đổi nội dung.'
- source_word: הַנְּשִׂיאִם
  choice: thủ lĩnh
  rationale: נָשִׂיא ở đây là người đứng đầu từng chi tộc. “Thủ lĩnh” chính xác và không gợi ý địa vị vua chúa.
- source_word: וְשׁוֹר לְאֶחָד
  choice: còn mỗi người góp một con bò
  rationale: Đây là cấu trúc phân phối; “mỗi người” quy chiếu về từng thủ lĩnh. “Còn” làm nổi bật sự tương ứng giữa một xe cho hai người và một con bò cho mỗi người.
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: rồi tiến dâng tất cả
  rationale: הקריב có nghĩa đem đến gần hoặc trình dâng trong bối cảnh nghi lễ. “Tiến dâng” giữ sắc thái thờ phượng nhưng không hàm ý rằng xe và bò đều bị giết làm sinh tế; “tất cả” quy về toàn bộ xe và bò.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן là nơi ngự tạm, tức đền thờ di động của Israel. “Đền Tạm” là cách gọi trang trọng, dễ hiểu và phân biệt với “Lều Hội Kiến” (אֹהֶל מוֹעֵד).
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản văn dùng trực tiếp danh riêng יְהוָה. Giữ “Yahweh” bảo toàn tính chất danh riêng và không thay thế bằng tước hiệu, đồng thời tránh chọn dạng phiên âm “Giê-hô-va” có lịch sử hình thành muộn hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dấu gạch ngang làm rõ hai tỷ lệ phân phối. “Đền Tạm” được viết hoa như tên gọi của nơi thánh trong bối cảnh này; danh riêng “Yahweh” được giữ nguyên.
