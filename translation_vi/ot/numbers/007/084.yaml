  source_fidelity: Bản dịch diễn đạt đúng thời điểm bàn thờ được xức dầu, nguồn các vật phẩm là các thủ lĩnh Y-sơ-ra-ên, và ba nhóm vật dụng đều có số lượng mười hai. Tuy nhiên, חֲנֻכַּת trước hết là “sự/lễ cung hiến”, không trực tiếp là “lễ vật”. Việc thêm “lễ vật” vào mệnh đề chính làm thu hẹp nghĩa danh từ Hê-bơ-rơ và khiến chú thích phải sửa nghĩa chính.
  naturalness: Câu sửa vẫn trang trọng, tự nhiên trong tiếng Việt hiện đại. “Từ các thủ lĩnh Y-sơ-ra-ên” phản ánh trực tiếp quan hệ nguồn gốc của מֵאֵת, không cần thêm động từ “dâng” vào cấu trúc danh ngữ của nguyên văn.
  terminology: Giữ “cung hiến”, “bàn thờ”, “xức dầu” và “thủ lĩnh Y-sơ-ra-ên”. “Đĩa”, “chậu” và “chén” là các cách gọi dễ hiểu, với chú thích bảo lưu sự bất định về hình dạng/chức năng chính xác của các dụng cụ nghi lễ. Bổ sung chú thích cho “thủ lĩnh” để phản ánh lựa chọn từ נְשִׂיאֵי.
