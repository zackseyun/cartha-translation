  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: vi
  text: 'Đây là lễ cung hiến bàn thờ vào ngày bàn thờ được xức dầu[a], từ các thủ lĩnh Y-sơ-ra-ên[b]: mười hai đĩa bạc, mười hai chậu bạc và mười hai chén vàng[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Đây là sự cung hiến bàn thờ.” Từ Hê-bơ-rơ có thể chỉ việc cung hiến; văn cảnh đang tổng kết các lễ vật đã được dâng.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các người đứng đầu” hoặc “các trưởng lãnh Y-sơ-ra-ên”. Từ Hê-bơ-rơ chỉ những người lãnh đạo các chi tộc được công nhận.
    reason: lexical_alternative
  - marker: c
    text: Tên gọi chính xác của các vật dụng này không chắc chắn; cũng có thể dịch là “mâm bạc”, “tô bạc” và “thìa vàng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Đây là lễ vật cung hiến bàn thờ
  rationale: חֲנֻכָּה chỉ sự cung hiến; trong câu tổng kết này, các vật phẩm vừa được liệt kê chính là lễ vật dùng cho việc cung hiến bàn thờ. Cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ liên hệ với ngữ cảnh.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: vào ngày bàn thờ được xức dầu
  rationale: Cụm từ có nghĩa thời gian; lặp lại “bàn thờ” giúp đại từ quy chiếu rõ ràng trong tiếng Việt.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: do các thủ lĩnh Y-sơ-ra-ên dâng
  rationale: מֵאֵת biểu thị nguồn, còn נְשִׂיאִים là những người đứng đầu các bộ tộc. Thêm “dâng” làm rõ quan hệ ngầm trong câu danh từ mà không thay đổi nội dung.
- source_word: קַעֲרֹת כֶּסֶף
  choice: đĩa bạc
  rationale: קְעָרָה là một loại vật đựng tương đối rộng, có thể là đĩa hoặc mâm; “đĩa” giúp phân biệt với loại chậu kế tiếp.
- source_word: מִזְרְקֵי כֶסֶף
  choice: chậu bạc
  rationale: מִזְרָק chỉ chậu hoặc tô dùng trong nghi lễ; “chậu” phù hợp với vật dụng thờ phượng và phân biệt với קְעָרָה.
- source_word: כַּפּוֹת זָהָב
  choice: chén vàng
  rationale: כַּף có thể chỉ vật đựng nhỏ dạng lòng bàn tay, thìa hoặc chén. Trong văn cảnh lễ vật, “chén” là cách gọi tự nhiên, nhưng hình dạng chính xác của vật dụng không hoàn toàn chắc chắn.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: mười hai
  rationale: Các dạng số từ phù hợp giống ngữ pháp của danh từ Hê-bơ-rơ; tiếng Việt đều dịch là “mười hai”.
theological_decisions:
- issue: חֲנֻכַּת có chỉ nghi thức cung hiến hay các lễ vật cung hiến
  choice: lễ vật cung hiến
  alternative: lễ cung hiến / sự cung hiến
  rationale: Văn cảnh là phần tổng kết số vật phẩm đã dâng, nên nghĩa lễ vật được hàm ý; chú thích vẫn bảo lưu cách hiểu hình thức hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cung hiến” cho nghi thức dành bàn thờ cho việc thờ phượng, “xức dầu” theo thuật ngữ Kinh Thánh thông dụng, và “thủ lĩnh” để tránh sắc thái hoàng tộc không có trong נָשִׂיא.
