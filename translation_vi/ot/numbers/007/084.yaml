  to: 'Đây là lễ cung hiến bàn thờ vào ngày bàn thờ được xức dầu[a], từ các thủ lĩnh Y-sơ-ra-ên[b]: mười hai đĩa bạc, mười hai chậu bạc và mười hai chén vàng[c].'
