base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: vi
  text: Khi Môi-se vào Lều Hội Kiến để thưa chuyện với Ngài, ông nghe tiếng đang phán với ông[a] từ phía trên nắp xá tội[b] ở trên Hòm Chứng Ngôn, từ giữa hai chê-ru-bim; rồi Ngài phán với ông.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ có thể được hiểu sát hình thái hơn là “tiếng đang được phán ra cho ông”; cách hiểu “tiếng đang phán với ông” là cách hiểu tự nhiên nhất trong văn cảnh.
    reason: lexical_alternative
  - marker: b
    text: “Nắp xá tội” là nắp của Hòm Chứng Ngôn, nơi Đức Chúa Trời phán từ giữa hai chê-ru-bim.
    reason: cultural_note
  - marker: c
    text: Nguyên văn không nêu rõ chủ thể của động từ cuối. Cũng có thể dịch là “rồi tiếng ấy phán với ông”; theo văn cảnh, chủ thể được hiểu tự nhiên nhất là Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: Khi Môi-se vào
  rationale: Cấu trúc בְּ + động từ nguyên thể diễn tả thời điểm; cách dịch này tự nhiên và giữ đúng quan hệ thời gian của câu.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Đây là danh xưng quen thuộc của nơi Đức Chúa Trời gặp và phán với Môi-se; viết hoa để thể hiện tên gọi đặc thù.
- source_word: לְדַבֵּר אִתּוֹ
  choice: để thưa chuyện với Ngài
  rationale: Động từ דבר với אֵת diễn tả việc nói với hoặc trò chuyện cùng. “Thưa chuyện” tự nhiên trong tiếng Việt và phù hợp với việc Môi-se đến trước Đức Chúa Trời, nhưng không hàm ý Môi-se là người nói trong mệnh đề cuối.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: ông nghe tiếng
  rationale: קוֹל có thể là âm thanh hoặc tiếng nói; động từ theo sau và bối cảnh mặc khải cho thấy đây là tiếng phán.
- source_word: מִדַּבֵּר
  choice: phán
  rationale: Phân từ này mô tả tiếng đang nói. “Phán” là cách nói trang trọng, tự nhiên khi chủ thể là Đức Chúa Trời; chú thích giữ lại sắc thái ngữ pháp khác có thể có.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: từ phía trên nắp xá tội
  rationale: כַּפֹּרֶת là chiếc nắp thiêng liêng của Hòm, gắn với nghi thức chuộc/xá tội. “Nắp xá tội” vừa nhận diện vật thể vừa giữ ý nghĩa tế tự của thuật ngữ.
- source_word: אֲרֹן הָעֵדֻת
  choice: Hòm Chứng Ngôn
  rationale: Cách dịch này giữ nghĩa pháp lý và làm chứng của עֵדוּת, chỉ Hòm chứa các bảng chứng ngôn, mà không tự ý thay bằng một thuật ngữ rộng hơn.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: giữa hai chê-ru-bim
  rationale: Giữ tên gọi riêng của các sinh vật trên nắp Hòm và chuyển tự số nhiều Hê-bơ-rơ quen dùng trong tiếng Việt.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: rồi Ngài phán với ông
  rationale: Động từ có chủ thể hàm ẩn. Theo ngữ cảnh, Đức Chúa Trời là Đấng phán từ giữa hai chê-ru-bim; đại từ “Ngài” diễn đạt cách hiểu tự nhiên nhất, còn chú thích ghi nhận sự không minh định về mặt ngữ pháp.
theological_decisions:
- issue: Chủ thể hàm ẩn của mệnh đề cuối וַיְדַבֵּר אֵלָיו
  choice: “Ngài” chỉ Đức Chúa Trời phán với Môi-se
  alternative: Có thể hiểu “tiếng ấy phán với ông”; một cách phân đoạn khác còn có thể khiến Môi-se được hiểu là chủ thể.
  rationale: Nguồn phát tiếng được xác định là phía trên nắp xá tội, giữa hai chê-ru-bim, nên Đức Chúa Trời là chủ thể hợp lý nhất. Tuy nhiên, vì nguyên văn không nêu danh từ làm chủ thể, chú thích bảo tồn độ mở của câu.
- issue: Sắc thái của מִדַּבֵּר khi bổ nghĩa cho הַקּוֹל
  choice: “tiếng phán” theo nghĩa chủ động
  alternative: Có thể diễn đạt sát hình thái hơn là “tiếng đang được phán ra” hoặc hiểu đây là một lối nói đặc biệt về tiếng tự cất lên.
  rationale: Nghĩa chủ động phù hợp nhất với văn cảnh Đức Chúa Trời mặc khải, nhưng hình thái Hê-bơ-rơ có nét khác thường nên không nên xóa bỏ phương án khác.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “thưa chuyện” cho lời Môi-se hướng đến Đức Chúa Trời và “phán” cho lời Đức Chúa Trời. Các danh xưng tế tự được viết hoa có chọn lọc; “chê-ru-bim” được chuyển tự thay vì diễn giải bản chất của các sinh vật này.
