  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc[b] nặng bảy mươi siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh; cả hai đều đựng đầy bột mịn đã trộn với dầu, dùng làm lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mâm”; từ Hê-bơ-rơ chỉ một vật đựng nông.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “chậu”; đây là một từ chỉ vật đựng dùng trong nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: Lễ vật của ông gồm
  rationale: קָרְבָּן trong ngữ cảnh tế tự là vật được dâng lên. Cách diễn đạt “gồm” tự nhiên trong câu liệt kê và không làm thay đổi nội dung.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קַעֲרָה chỉ một vật đựng nông, rộng; “đĩa” là từ hiện đại, dễ hiểu, còn khả năng dịch “mâm” được ghi ở chú thích.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Chuyển cấu trúc danh từ “trọng lượng của nó” thành vị ngữ tự nhiên trong tiếng Việt, đồng thời giữ nguyên con số và đơn vị.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một bát bạc
  rationale: מִזְרָק là vật đựng dùng trong nghi lễ; câu này không nói rõ chức năng rảy hay hắt, nên “bát” tránh thêm ý không có trong văn bản. Khả năng dịch “chậu” được ghi ở chú thích.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Diễn đạt rõ đây là trọng lượng của chiếc bát và song song tự nhiên với trọng lượng của chiếc đĩa.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Cụm từ chỉ tiêu chuẩn cân dùng tại nơi thánh. Bản dịch giữ liên hệ tế tự mà không diễn giải quá mức thành một đơn vị hiện đại.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Giữ sự quy chiếu rõ ràng đến hai vật đựng; “đựng đầy” tự nhiên hơn “đầy” khi nói về đĩa và bát.
- source_word: סֹלֶת
  choice: bột lọc
  rationale: סֹלֶת là loại bột mịn, tinh tuyển dùng trong lễ vật. “Bột lọc” diễn đạt việc bột đã được sàng lọc, không nên hiểu theo tên món bột năng trong một số phương ngữ.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn với dầu
  rationale: Phản ánh phân từ bị động, cho biết bột đã được trộn với dầu.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong ngữ cảnh tư tế, מִנְחָה chỉ loại lễ vật làm từ sản phẩm ngũ cốc; cách dịch này phân biệt nó với nghĩa rộng hơn là lễ vật nói chung.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và rõ ràng, phù hợp một bản liệt kê lễ vật. Dùng “siếc-lơ” để phiên âm đơn vị cổ, không quy đổi sang đơn vị hiện đại vì giá trị ở đây gắn với tiêu chuẩn nơi thánh. Các dấu chú thích [a], [b] đều được đặt ngay sau danh từ tương ứng.
