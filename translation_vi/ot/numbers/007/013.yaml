revisions:
- from: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc[b] nặng bảy mươi siếc-lơ, theo siếc-lơ nơi thánh; cả hai đều đựng đầy bột lọc trộn với dầu để làm lễ vật ngũ cốc.
  to: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc[b] nặng bảy mươi siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh; cả hai đều đựng đầy bột mịn đã trộn với dầu, dùng làm lễ vật ngũ cốc.
  rationale: Sửa “bột lọc” thành “bột mịn” để phản ánh chính xác và tự nhiên hơn סֹלֶת, tránh một nghĩa hiện đại dễ gây hiểu nhầm. Điều chỉnh cụm về siếc-lơ để làm rõ đây là tiêu chuẩn cân của nơi thánh. Các yếu tố còn lại, bao gồm các chú thích và vị trí neo chú thích, được giữ nguyên.
  reviewer_model: gpt-5.6-terra
