  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: vi
  text: Các thủ lĩnh dâng lễ cung hiến bàn thờ[a] vào ngày bàn thờ được xức dầu; các thủ lĩnh dâng lễ vật của họ trước bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát: “sự cung hiến bàn thờ.” Trong văn mạch, cụm này có thể chỉ các lễ vật được dâng nhân dịp cung hiến bàn thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: dâng
  rationale: Dạng Hiphil của קרב trong bối cảnh tế tự mang nghĩa đem đến để tiến dâng. “Dâng” tự nhiên, trang trọng và giữ được sắc thái thờ phượng trong tiếng Việt.
- source_word: הַנְּשִׂאִים / הַנְּשִׂיאִם
  choice: các thủ lĩnh
  rationale: Trong sách Dân Số, נָשִׂיא chỉ những người đứng đầu các chi tộc. “Thủ lĩnh” chính xác hơn “vua chúa” và trang trọng hơn cách gọi chung “lãnh đạo” trong ngữ cảnh này.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: lễ vật cung hiến bàn thờ
  rationale: חֲנֻכָּה về căn bản là sự cung hiến/khánh thành. Vì động từ “dâng” đòi hỏi một đối tượng có thể được tiến dâng và văn cảnh nói đến các lễ vật, bản dịch diễn đạt là “lễ vật cung hiến bàn thờ,” đồng thời không thêm chú thích vì chính văn Hebrew trong ngữ cảnh này hỗ trợ cách hiểu ấy.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: vào ngày bàn thờ được xức dầu
  rationale: Cụm nguyên mẫu với בְּ biểu thị thời điểm. Nêu lại “bàn thờ” thay cho đại từ giúp câu tiếng Việt rõ nghĩa mà không thay đổi sở chỉ.
- source_word: קָרְבָּנָם
  choice: lễ vật của mình
  rationale: קָרְבָּן là vật được đem đến dâng trong bối cảnh tế tự. “Lễ vật” vừa tự nhiên vừa giữ được sắc thái nghi lễ; “của mình” quy chiếu rõ về các thủ lĩnh.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: trước bàn thờ
  rationale: Giữ nghĩa không gian và nghi lễ thông thường của לִפְנֵי bằng một cách diễn đạt trang trọng, tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại của hành động “dâng” trong nguyên văn nhưng dùng đại từ “họ” ở mệnh đề thứ hai để câu tiếng Việt bớt nặng. Đảo cụm thời gian lên trước nhằm làm rõ rằng việc dâng lễ vật diễn ra đúng ngày bàn thờ được xức dầu.
