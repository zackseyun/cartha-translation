  source_fidelity: Bản dịch giữ đúng ba con vật, số lượng lặp lại, giới tính của chiên con, tuổi một năm, và mục đích tế lễ. Tuy nhiên, “thuộc đàn gia súc” là cách giải thích không tự nhiên cho בֶּן־בָּקָר và “lễ thiêu” dễ chỉ nghi thức hơn là lễ vật (עֹלָה).
  naturalness: “Một con bò đực trong đàn” tự nhiên và rõ hơn “một con bò đực thuộc đàn gia súc.” Cụm “dâng làm lễ vật thiêu” diễn đạt tự nhiên quan hệ của các con vật với lễ vật được dâng.
  terminology: Dùng “chiên đực” cho אַיִל, “chiên con đực” cho כֶּבֶשׂ, và “lễ vật thiêu” cho עֹלָה, bảo toàn các phân biệt từ vựng và sắc thái tế tự của câu.
