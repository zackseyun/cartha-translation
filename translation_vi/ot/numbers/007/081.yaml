translation_notes:
  register: Giữ cấu trúc liệt kê với số từ “một” được lặp lại như nguyên văn. Văn phong trang trọng nhưng hiện đại; dấu chấm phẩy phản ánh câu còn tiếp nối trong danh sách lễ vật.
