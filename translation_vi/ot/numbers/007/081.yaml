translation:
  language: vi
  text: một con bò đực trong đàn, một con chiên đực, một con chiên con đực một tuổi, dâng làm lễ vật thiêu;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: một con bò đực thuộc đàn gia súc
  rationale: פַּר là bò đực, còn בֶּן בָּקָר xác định nó thuộc loài gia súc lớn. Cách dịch này giữ cả loài, giới tính và lối liệt kê, đồng thời tránh cách dịch sát chữ thiếu tự nhiên.
- source_word: אַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל chỉ chiên đực trưởng thành dùng trong tế lễ; đây là cách gọi tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: כֶּבֶשׂ אֶחָד
  choice: một con chiên con đực
  rationale: כֶּבֶשׂ ở đây là chiên non giống đực; thêm “đực” bảo toàn sự phân biệt giới tính trong nguyên văn.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ chỉ con vật đang ở độ tuổi một năm; “một tuổi” ngắn gọn và tự nhiên trong danh mục lễ vật.
- source_word: לְעֹלָה
  choice: dùng làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; “lễ thiêu” là thuật ngữ trang trọng, dễ hiểu, phù hợp văn cảnh tế lễ.
