source:
  edition: WLC
  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: vi
  text: Bấy giờ, các thủ lãnh của Y-sơ-ra-ên, tức những người đứng đầu các gia tộc[a], dâng lễ vật. Họ là các thủ lãnh của những bộ tộc; chính họ là những người phụ trách những người đã được kiểm đếm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “nhà của các tổ phụ”, chỉ những đơn vị gia đình lớn hoặc gia tộc theo dòng tổ tiên trong dân Y-sơ-ra-ên.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “những người phụ trách những người đã đăng bộ” hoặc “những người được triệu tập để kiểm kê”. Cụm từ Hê-bơ-rơ nói đến nhóm người được ghi nhận trong cuộc kiểm kê dân số.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: dâng lễ vật
  rationale: Dạng Hiphil của קרב có nghĩa cơ bản là đem đến gần hoặc trình dâng. Trong ngữ cảnh lễ cung hiến ở Dân Số 7, “dâng lễ vật” diễn đạt tự nhiên hành động được hàm ý, dù tân ngữ không được nêu trực tiếp trong câu này.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: các thủ lãnh của Y-sơ-ra-ên
  rationale: נָשִׂיא chỉ người đứng đầu hoặc thủ lĩnh. “Thủ lãnh” trang trọng, dễ hiểu và không tạo ấn tượng rằng họ là các hoàng tử.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: những người đứng đầu các gia tộc
  rationale: Cụm từ chỉ các đơn vị thân tộc theo dòng tổ tiên. “Gia tộc” tự nhiên trong tiếng Việt và giữ được ý về cơ cấu đại gia đình hay thị tộc.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: Họ là các thủ lãnh của những bộ tộc
  rationale: מַטּוֹת theo nghĩa đen là “gậy”, nhưng tại đây là cách gọi quy ước dành cho các bộ tộc Y-sơ-ra-ên.
- source_word: הֵם הָעֹמְדִים עַל
  choice: chính họ là những người phụ trách
  rationale: עמד với עַל theo ngữ cảnh diễn tả việc đứng trên để giám sát hay chịu trách nhiệm. “Phụ trách” truyền đạt tự nhiên chức năng quyền hạn trong tiếng Việt.
- source_word: הַפְּקֻדִים
  choice: những người đã được kiểm đếm
  rationale: Từ này chỉ những người được ghi nhận trong cuộc kiểm kê dân số. “Đã được kiểm đếm” giữ nghĩa bị động và không nhấn mạnh sắc thái quân sự quá mức.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “thủ lãnh”, “gia tộc”, “bộ tộc” để diễn đạt cơ cấu xã hội của Y-sơ-ra-ên; giữ hai vế nhận diện chức vụ của các thủ lãnh. Tân ngữ “lễ vật” được nêu theo ngữ cảnh lễ cung hiến, còn sắc thái kiểm kê của הַפְּקֻדִים được bảo lưu.
