- from: 'Còn về lễ vật giao hòa[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con một tuổi. Đó là lễ vật của Ê-li-xua, con trai Sê-đêu.'
  to: 'Và cho lễ tế bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con đực một tuổi. Đó là lễ vật của Ê-li-xua, con trai Sê-đêu.'
