  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: vi
  text: 'Và cho lễ tế bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con đực một tuổi. Đó là lễ vật của Ê-li-xua, con trai Sê-đêu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lễ tế giao hòa”, “lễ tế thông công” hay “lễ tế an lành”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: Còn về lễ vật giao hòa
  rationale: Cụm giới từ tiếp tục danh mục lễ vật; “còn về” diễn đạt tự nhiên chức năng liệt kê. “Lễ vật giao hòa” giữ ý nghĩa quan hệ hòa thuận/toàn vẹn của thuật ngữ tế tự שְׁלָמִים mà không thu hẹp thành một cách giải thích duy nhất.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là danh từ tập hợp chỉ gia súc họ bò; bản Hê-bơ-rơ không xác định giới tính hay nói riêng bò thiến.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con chiên đực
  rationale: אֵילִם chỉ chiên đực trưởng thành.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ cụ thể dê đực.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con một tuổi
  rationale: כְּבָשִׂים chỉ chiên non, còn בְּנֵי שָׁנָה là thành ngữ chỉ độ tuổi một năm. Tiếng Việt không cần thêm “đực” vì hình thức từ trong câu này không buộc phải thể hiện giới tính trong bản dịch.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: זֶה là đại từ chỉ định và קָרְבַּן là lễ vật được dâng; “Đó là” phù hợp văn mạch kể chuyện tiếng Việt.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Ê-li-xua, con trai Sê-đêu
  rationale: Phiên âm tên riêng theo âm dạng Hê-bơ-rơ và diễn đạt rõ quan hệ phụ tử của בֶּן.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ tế tự שְׁלָמִים
  choice: lễ vật giao hòa
  alternative: lễ vật bình an; lễ vật thông công; lễ vật cầu an
  rationale: Thuật ngữ có trường nghĩa gồm bình an, toàn vẹn và mối giao hòa; bản dịch chính dùng cách gọi dễ hiểu nhưng ghi chú các khả năng khác để không khép kín sự đa nghĩa.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; giữ cấu trúc danh mục của nguyên văn. Dùng “con” làm loại từ tự nhiên cho các con vật và phiên âm tên riêng nhất quán theo lối Việt hóa.
