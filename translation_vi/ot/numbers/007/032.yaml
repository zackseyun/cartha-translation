  text: một chén bằng vàng, nặng mười siếc-lơ[a], đầy hương;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dịch sát là: “một chén, mười, vàng, đầy hương”; đơn vị “siếc-lơ” được bổ sung dựa trên công thức lễ vật lặp lại trong các câu chung quanh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa
  rationale: Trong danh mục lễ vật dùng tại Đền Tạm, từ này chỉ một vật đựng nhỏ chứ không phải lòng bàn tay. “Đĩa” tự nhiên trong tiếng Việt và thích hợp với vật đựng hương liệu.
- source_word: אַחַת
  choice: một
  rationale: Số từ chỉ số lượng, phù hợp với danh từ giống cái כַּף trong tiếng Hê-bơ-rơ.
- source_word: עֲשָׂרָה
  choice: nặng mười siếc-lơ
  rationale: Nguyên văn chỉ nói “mười”, nhưng công thức lễ vật lặp lại trong ngữ cảnh chung quanh cho thấy đơn vị trọng lượng được hiểu ngầm là siếc-lơ. Thêm “nặng” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Chỉ chất liệu làm nên chiếc đĩa; “bằng vàng” diễn đạt rõ quan hệ này trong tiếng Việt.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Diễn tả chiếc đĩa chứa đầy vật liệu; cách nói này tự nhiên hơn việc dịch máy móc là “đầy”.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Trong bối cảnh thờ phượng tại Đền Tạm, từ này chỉ chất thơm được dùng để dâng và đốt làm hương; “hương liệu” giữ trọng tâm ở chính chất thơm chứa trong đĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc của một mục trong danh sách lễ vật; dấu chấm phẩy cho thấy câu còn tiếp nối. Dùng “siếc-lơ” làm đơn vị trọng lượng cổ và chú thích rõ phần được bổ sung từ ngữ cảnh.
