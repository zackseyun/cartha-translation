  rationale: Thay «đĩa» bằng «chén» để phản ánh một vật chứa nhỏ trong ngữ cảnh lễ vật và để câu tiếng Việt nhất quán với «đầy». Thay «hương liệu» bằng «hương» để chỉ rõ chất hương nghi lễ (קְטֹרֶת), không thêm diễn giải. Giữ nguyên sự bổ sung có chú thích về «siếc-lơ» và giữ dấu chấm phẩy của mục liệt kê.
