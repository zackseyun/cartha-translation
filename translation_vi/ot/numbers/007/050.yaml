  language: vi
  text: một đĩa vàng[a], nặng mười siếc-lơ, đầy hương;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khay” hoặc “bát”. Một số bản dịch truyền thống dịch là “muỗng”, nhưng từ Hê-bơ-rơ này chỉ rộng hơn một vật chứa nhỏ dùng trong nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa nhỏ
  rationale: Trong ngữ cảnh các vật dụng nghi lễ tại Đền Tạm, từ này chỉ một vật chứa nhỏ, không phải “lòng bàn tay”. “Đĩa nhỏ” tự nhiên trong tiếng Việt và không gợi sai thành muỗng ăn.
- source_word: אַחַת
  choice: một
  rationale: Số từ đơn giản, phù hợp với danh từ chỉ vật chứa.
- source_word: עֲשָׂרָה
  choice: nặng mười siếc-lơ
  rationale: Nguyên văn chỉ ghi “mười”, nhưng công thức lặp lại trong Dân Số 7 cho thấy đơn vị trọng lượng siếc-lơ được hiểu ngầm; thêm “nặng” và đơn vị giúp câu rõ nghĩa trong tiếng Việt.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt tự nhiên vật liệu làm nên chiếc đĩa.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Diễn đạt trạng thái vật chứa đầy thứ được nêu tiếp theo, tự nhiên hơn cách dịch máy móc “đầy”.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm dùng để đốt trong nghi lễ thờ phượng; “hương liệu” phù hợp ngữ cảnh và tránh bị hiểu đơn thuần là cây nhang.
