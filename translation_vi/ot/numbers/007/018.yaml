base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/018.yaml
  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: vi
  text: Ngày thứ hai, Nê-tha-nên, con trai Xu-a, thủ lĩnh của Y-sa-ca, dâng lễ vật của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ chỉ nói “dâng”; cụm “lễ vật của mình” được bổ sung theo văn cảnh lặp lại của Dân Số Ký 7, trong đó mỗi thủ lĩnh chi tộc dâng một lễ vật.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Ngày thứ hai
  rationale: Cụm giới từ ב kết hợp với יוֹם và số thứ tự tạo thành một cụm chỉ thời gian; cách dịch này tự nhiên trong tiếng Việt và không thêm ý ngoài câu.
- source_word: הִקְרִיב
  choice: dâng lễ vật của mình
  rationale: Dạng Hiphil của קרב trong bối cảnh dâng hiến thường có nghĩa là đem đến hoặc dâng một lễ vật. Tân ngữ không có trong câu Hê-bơ-rơ này nhưng được hiểu rõ từ công thức lặp lại trong Dân Số Ký 7; bổ sung 'lễ vật của mình' giúp câu tiếng Việt trọn nghĩa, đồng thời được ghi rõ trong chú thích.
- source_word: נְתַנְאֵל
  choice: Nê-tha-nên
  rationale: Phiên âm tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt, bảo đảm dễ đọc đối với độc giả phổ thông.
- source_word: בֶּן צוּעָר
  choice: con trai Xu-a
  rationale: Giữ nguyên quan hệ phụ tử của cấu trúc Hê-bơ-rơ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: נְשִׂיא
  choice: thủ lĩnh
  rationale: Trong bối cảnh các chi tộc, נָשִׂיא chỉ người đứng đầu được công nhận. 'Thủ lĩnh' rõ nghĩa và tránh hàm ý hoàng tộc của từ 'hoàng tử'.
- source_word: יִשָּׂשכָר
  choice: Y-sa-ca
  rationale: Phiên âm tên chi tộc theo lối quen dùng trong Kinh Thánh tiếng Việt.
