  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se: “Một thủ lĩnh mỗi ngày, một thủ lĩnh mỗi ngày, họ sẽ dâng lễ vật của mình nhân lễ cung hiến bàn thờ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “mỗi ngày một thủ lĩnh bộ tộc.” Tiếng Hê-bơ-rơ lặp lại “một thủ lĩnh, một ngày” để nhấn mạnh thứ tự lần lượt của việc dâng lễ vật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa trình thuật tiến tới; “Rồi” diễn đạt tự nhiên trình tự, còn “phán” phù hợp khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: נָשִׂיא
  choice: thủ lĩnh
  rationale: Trong ngữ cảnh này, từ chỉ người đứng đầu các bộ tộc; “thủ lĩnh” rõ nghĩa và không gợi hàm ý quân chủ như “hoàng tử”.
- source_word: אֶחָד לַיּוֹם
  choice: mỗi ngày một
  rationale: Diễn đạt ý phân phối theo từng ngày trong tiếng Việt tự nhiên, đồng thời giữ nguyên sự lặp lại nhấn mạnh của tiếng Hê-bơ-rơ.
- source_word: יַקְרִיבוּ
  choice: họ phải dâng
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế tự mang nghĩa đem đến hoặc dâng lễ vật; “phải dâng” truyền đạt lực chỉ thị của hình thái chưa hoàn thành trong lời phán.
- source_word: קָרְבָּנָם
  choice: lễ vật của mình
  rationale: קָרְבָּן là vật được đem đến dâng cho Đức Chúa Trời; hậu tố số nhiều được diễn đạt bằng “của mình”, quy chiếu về các thủ lĩnh.
- source_word: לַחֲנֻכַּת
  choice: để cung hiến
  rationale: Danh từ חֲנֻכָּה chỉ việc khánh thành hoặc cung hiến; giới từ ל được hiểu theo mục đích trong ngữ cảnh này.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Cách gọi tiêu chuẩn, tự nhiên trong tiếng Việt đối với bàn dùng để dâng tế lễ.
theological_decisions:
- issue: Cách chuyển יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh Bốn Chữ; chuyển tự “Yahweh” bảo tồn tính chất tên riêng và không thay thế bằng một tước hiệu.
- issue: Sắc thái của חֲנֻכַּת đối với bàn thờ
  choice: cung hiến
  alternative: khánh thành; biệt riêng ra thánh
  rationale: “Cung hiến” giữ ý nghi lễ dâng bàn thờ cho công dụng thánh mà không đồng nhất hoàn toàn với thuật ngữ thánh hóa khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên phép lặp nổi bật của nguyên văn thay vì làm gọn câu; dùng “thủ lĩnh” cho người đứng đầu bộ tộc và “cung hiến” cho nghi thức dành bàn thờ vào công dụng thánh.
