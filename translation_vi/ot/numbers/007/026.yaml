    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa
  rationale: Trong danh mục vật dụng thánh, từ này chỉ một vật chứa nhỏ chứ không phải lòng bàn tay; “đĩa” tự nhiên và phù hợp với vật dùng để đựng hương liệu.
- source_word: אַחַת
  choice: một
  rationale: Số từ đơn giản bổ nghĩa cho “đĩa”, được dịch trực tiếp.
- source_word: עֲשָׂרָה
  choice: nặng mười siếc-lơ
  rationale: Nguyên văn chỉ ghi “mười”, nhưng công thức dâng lễ lặp lại trong văn cảnh trực tiếp cho thấy đây là trọng lượng tính bằng siếc-lơ; thêm “nặng” và đơn vị để câu tiếng Việt rõ nghĩa.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn tả chất liệu làm nên vật dụng; “bằng vàng” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Tính từ vị ngữ mang nghĩa “đầy”; với một vật chứa, “đựng đầy” là cách diễn đạt tự nhiên.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm dùng trong việc thờ phượng tại nơi thánh; “hương liệu” tránh khiến người đọc hiểu đây là các nén nhang thành phẩm.
