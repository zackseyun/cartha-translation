  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: vi
  text: 'và về tế lễ bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con một tuổi. Đó là lễ vật của Na-ha-sôn, con trai A-mi-na-đáp.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thông công” hoặc “lễ an lành”; từ Hê-bơ-rơ này thường chỉ một tế lễ bao gồm một bữa ăn được chia sẻ trong sự hiệp thông và bình an.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: và về sinh tế là lễ cầu an
  rationale: Các tiền tố nối mục này với danh sách lễ vật và chỉ mục đích; זֶבַח là sinh tế, còn שְׁלָמִים là thuật ngữ tế lễ thường được dịch là lễ cầu an. Cách diễn đạt này giữ tính chuyên biệt của nghi lễ mà vẫn tự nhiên trong tiếng Việt.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là danh từ tập hợp chỉ bò; nguyên văn không xác định giới tính, nên không dịch hẹp thành bò đực.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con chiên đực
  rationale: אֵילִם chỉ chiên đực trưởng thành.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתּוּדִים chỉ rõ dê giống đực.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con một tuổi
  rationale: כְּבָשִׂים chỉ chiên con, còn בְּנֵי שָׁנָה nêu tuổi là một năm; cụm này không cần thêm giới tính vì chính văn không biểu thị giới tính rõ như עַתּוּדִים.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: Mệnh đề danh từ Hê-bơ-rơ có nghĩa đen là 'đây/đó [là] lễ vật của'; 'Đó là' phù hợp với lời tổng kết trong mạch kể.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Na-ha-sôn, con trai Am-mi-na-đáp
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc, đồng thời dịch rõ quan hệ phụ tử của בֶּן.
theological_decisions:
- issue: Ý nghĩa của הַשְּׁלָמִים
  choice: lễ cầu an
  alternative: lễ thông công; lễ bình an
  rationale: Thuật ngữ có thể gợi sự bình an, an lành hoặc sự hiệp thông qua bữa ăn tế lễ. Chính văn dùng thuật ngữ nghi lễ mà không giải thích hết sắc thái, nên giữ một cách dịch ngắn gọn và ghi các khả năng khác trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sinh tế” và “lễ vật” để phân biệt זֶבַח với קָרְבָּן; giữ nhịp liệt kê rõ ràng. Mọi dấu chú thích đều xuất hiện trong chính văn.
