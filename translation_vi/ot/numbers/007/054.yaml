source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: vi
  text: Ngày thứ tám, vị lãnh đạo của con cháu Ma-na-se[a] là Ga-ma-li-ên, con trai Phê-đa-xua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Ma-na-se,” một cách gọi chi tộc, tức là con cháu hay chi tộc Ma-na-se.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Ngày thứ tám
  rationale: Cụm giới từ בַּ kết hợp với יוֹם và số thứ tự tạo thành trạng ngữ thời gian. Cách dịch này tự nhiên trong tiếng Việt và không thêm cụm “của lễ cung hiến,” vốn không có trực tiếp trong câu.
- source_word: נָשִׂיא
  choice: vị lãnh đạo
  rationale: Trong ngữ cảnh các chi tộc dâng lễ vật, từ này chỉ người đứng đầu được công nhận. “Vị lãnh đạo” rõ nghĩa, trang trọng vừa phải và tránh sắc thái hoàng gia dễ gây hiểu lầm của “hoàng tử.”
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: của con cháu Ma-na-se
  rationale: Cách dịch giữ hình ảnh gia tộc của בְּנֵי, đồng thời diễn đạt tự nhiên quan hệ giữa người lãnh đạo và cộng đồng mà ông đại diện. Chú thích giải thích rằng đây là cách gọi chi tộc.
- source_word: מְנַשֶּׁה
  choice: Ma-na-se
  rationale: Phiên âm tên riêng theo lối viết Kinh Thánh tiếng Việt quen thuộc.
- source_word: גַּמְלִיאֵל
  choice: Ga-ma-li-ên
  rationale: Phiên âm tên riêng sang tiếng Việt, giữ các âm tiết dễ đọc và dạng tên quen thuộc.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ phụ tử trong công thức ghi tên theo cha.
- source_word: פְּדָה צוּר
  choice: Phê-đa-xua
  rationale: Xử lý các thành tố Masoret như một tên riêng ghép duy nhất và phiên âm theo lối tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng. Câu Hê-bơ-rơ không có động từ; thêm “là” để câu tiếng Việt tự nhiên mà không làm thay đổi quan hệ định danh. Dấu chú thích được đặt ngay sau cụm mà chú thích giải thích.
