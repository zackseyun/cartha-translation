  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: vi
  text: Tổng số bò dùng làm lễ thiêu là mười hai con bò đực; số cừu đực là mười hai con; số chiên con một tuổi là mười hai con, cùng với lễ vật ngũ cốc đi kèm; và số dê đực dùng làm lễ chuộc tội[a] là mười hai con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể nhấn mạnh việc thanh tẩy khỏi sự ô uế cũng như việc xử lý tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: Tổng số bò
  rationale: הַבָּקָר chỉ chung loài bò, còn כָּל mở đầu phần tổng kết số lễ vật. Cách dịch này giữ sự phân biệt với cừu và dê được kể tiếp theo.
- source_word: לָעֹלָה
  choice: dùng làm lễ thiêu
  rationale: Giới từ לְ chỉ mục đích; “lễ thiêu” là thuật ngữ rõ ràng, tự nhiên cho עֹלָה, lễ vật được thiêu dâng trọn vẹn.
- source_word: פָּרִים
  choice: bò đực
  rationale: פַּר trong ngữ cảnh hiến tế chỉ bò đực; cách gọi này chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: אֵילִם
  choice: cừu đực
  rationale: Phân biệt rõ אֵיל với chiên con được nhắc ngay sau đó.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: chiên con một tuổi
  rationale: Giữ nguyên loại vật và điều kiện về tuổi của con vật hiến tế.
- source_word: וּמִנְחָתָם
  choice: cùng với lễ vật ngũ cốc đi kèm
  rationale: Trong luật hiến tế, מִנְחָה thường là lễ vật làm từ ngũ cốc. Đại từ sở hữu số nhiều được diễn đạt tự nhiên bằng “đi kèm”, quy chiếu về các con vật dùng làm lễ thiêu.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: và số dê đực
  rationale: Cụm từ chỉ rõ dê giống đực; giữ liên từ và lối liệt kê tổng số.
- source_word: לְחַטָּאת
  choice: dùng làm lễ chuộc tội
  rationale: Đây là cách gọi quen thuộc và dễ nhận biết của חַטָּאת trong luật tế lễ, trong khi sắc thái thanh tẩy được giữ lại ở chú thích.
theological_decisions:
- issue: Ý nghĩa của חַטָּאת trong luật hiến tế
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: חַטָּאת có thể nhấn mạnh cả việc xử lý tội lỗi lẫn sự thanh tẩy khỏi tình trạng ô uế. Bản chính dùng thuật ngữ quen thuộc “lễ chuộc tội”, nhưng chú thích bảo lưu cách hiểu “lễ thanh tẩy” để không xóa bỏ độ rộng nghĩa của từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc lặp “số… là mười hai con” phản ánh nhịp liệt kê của câu Hê-bơ-rơ, đồng thời tránh khiến הַבָּקָר bị hiểu là bao gồm cả cừu và dê.
