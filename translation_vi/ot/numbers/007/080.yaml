lexical_decisions:
- source_word: כַּף
  choice: đĩa
  rationale: Trong danh mục lễ vật của Đền Tạm, từ này chỉ một vật đựng nhỏ dùng để chứa hương liệu; “đĩa” tự nhiên và rõ hơn cách dịch truyền thống “thìa” trong tiếng Việt hiện đại.
- source_word: אַחַת
  choice: một
  rationale: Số từ đơn giản, phù hợp với danh từ giống cái כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: nặng mười siếc-lơ
  rationale: Cụm Hê-bơ-rơ lược bỏ đơn vị cân; công thức kiểm kê lặp lại trong chương cho thấy phải hiểu là mười siếc-lơ. Dùng “nặng” làm rõ đây là trọng lượng của vật bằng vàng, không phải mười đồng tiền vàng.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt tự nhiên chất liệu của chiếc đĩa trong tiếng Việt.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Diễn đạt tự nhiên trạng thái chiếc đĩa chứa đầy vật liệu bên trong.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Trong ngữ cảnh thờ phượng tại Đền Tạm, từ này chỉ hỗn hợp thơm dùng để xông; “hương liệu” tránh khiến người đọc hiểu thành một que hương hiện đại.
