  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “siếc-lơ” để giữ đơn vị cân cổ, có chú thích về phần được hiểu ngầm trong nguyên văn; dùng “đĩa” thay cho “thìa” để phản ánh chức năng của vật đựng.
