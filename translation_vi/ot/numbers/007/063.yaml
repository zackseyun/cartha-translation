    rationale: Cụm thành ngữ này xác định con bò là thuộc đàn bò. Có thể chuyển tự nhiên là “bò đực thuộc đàn,” không cần chú thích vì nghĩa đã được thể hiện trong bản dịch.
  - severity: low
    issue: “Dùng làm lễ thiêu” hơi kém trực tiếp đối với לְעֹלָה.
    rationale: “Để làm lễ tế thiêu” giữ rõ chức năng/mục đích của các con vật trong danh mục tế lễ.
