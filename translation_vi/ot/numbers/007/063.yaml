translation:
  language: vi
  text: một con bò đực thuộc đàn, một con chiên đực, một con chiên con đực một tuổi, để làm lễ tế thiêu;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: một con bò đực
  rationale: פַּר chỉ bò đực dùng trong tế lễ; בֶּן־בָּקָר là cách nói thuộc phạm vi đàn bò và trong tiếng Việt không cần dịch riêng vì sẽ thành dư ý hoặc thiếu tự nhiên.
- source_word: אַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל là chiên đực trưởng thành; cách dịch này chính xác, tự nhiên và phân biệt với chiên con ở mục kế tiếp.
- source_word: כֶּבֶשׂ אֶחָד
  choice: một con chiên con đực
  rationale: כֶּבֶשׂ chỉ chiên con, trong ngữ cảnh tế lễ là con đực; nêu rõ giới tính giúp phản ánh thuật ngữ Hê-bơ-rơ.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ nghĩa là con vật trong năm đầu hoặc được một tuổi; “một tuổi” là cách diễn đạt ngắn gọn, thông dụng trong danh mục tế lễ.
- source_word: לְעֹלָה
  choice: dùng làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; “lễ thiêu” là thuật ngữ ngắn gọn và tiền tố לְ được thể hiện tự nhiên bằng “dùng làm”.
- source_word: אֶחָד
  choice: một
  rationale: Giữ lại số từ được lặp trước từng con vật, theo đúng cấu trúc liệt kê của nguyên văn.
