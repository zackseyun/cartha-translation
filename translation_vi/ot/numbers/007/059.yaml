source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: vi
  text: 'Còn về tế lễ bình an[a]: hai con bò[b], năm con cừu đực, năm con dê đực và năm con chiên con một tuổi. Đây là lễ vật của Gam-li-ên, con trai Phê-đa-xua.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tế lễ thông công” hoặc “tế lễ an lành”.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ dùng danh từ tập hợp chỉ bò nuôi; theo cách dịch truyền thống: “hai con bò đực”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “Đây là lễ vật của”; mệnh đề Hê-bơ-rơ không có động từ nên không đánh dấu thì.'
    reason: source_form
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: Còn về sinh tế làm lễ vật bình an
  rationale: Giữ quan hệ tiếp nối của וּ, chức năng giới thiệu hạng mục của לְ, nghĩa hiến tế của זֶבַח và thuật ngữ tế lễ הַשְּׁלָמִים. Cách diễn đạt này tự nhiên trong tiếng Việt mà không thu hẹp thuật ngữ chỉ vào ý thông công hay an sinh.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là danh từ tập hợp chỉ bò nuôi; bản văn không xác định đây là bò đực thiến hay bò kéo, nên dùng từ rộng hơn là “bò”.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con cừu đực
  rationale: אֵילִם chỉ cừu đực trưởng thành; bản dịch nêu rõ giới tính và phân biệt với chiên con ở phần sau.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ dê đực; cách dịch hiện đại, rõ nghĩa và sát nguồn.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con một tuổi
  rationale: Giữ cả loại vật và độ tuổi được diễn đạt bằng thành ngữ Hê-bơ-rơ “con của một năm”.
- source_word: זֶה קָרְבַּן
  choice: Đây là lễ vật của
  rationale: Mệnh đề Hê-bơ-rơ không có động từ được diễn đạt tự nhiên bằng “Đây là”; קָרְבַּן là lễ vật được dâng lên.
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: Gam-li-ên, con trai Phê-đa-xua
  rationale: Phiên âm các tên riêng từ dạng Hê-bơ-rơ và dịch rõ quan hệ phụ tử của בֶּן.
theological_decisions:
- issue: Sắc thái của thuật ngữ tế lễ שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công; lễ vật an lành
  rationale: “Lễ vật bình an” duy trì thuật ngữ tế lễ quen thuộc và mối liên hệ từ nguyên với sự bình an/toàn vẹn, nhưng chú thích bảo tồn các sắc thái hợp lệ khác thay vì quyết định độc nhất về ý nghĩa thần học.
- issue: Thời tính của mệnh đề זֶה קָרְבַּן
  choice: Đây là lễ vật của
  alternative: Đó là lễ vật của
  rationale: Nguyên văn là mệnh đề danh từ không đánh dấu thì. Dùng hiện tại trong tiếng Việt bảo tồn hình thức trình bày của nguồn, dù toàn đoạn đang thuật lại một sự kiện quá khứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp liệt kê của danh mục tế lễ. Dùng “còn về” để nối với các lễ vật ở câu trước, đồng thời tránh lối văn quá cổ. Các tên riêng được phiên âm theo dạng Hê-bơ-rơ.
