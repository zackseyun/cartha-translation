  text: một con dê đực làm lễ vật chuộc tội;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ Hê-bơ-rơ chỉ con đực thuộc loài dê. “Con dê đực” rõ ràng, tự nhiên trong tiếng Việt hiện đại và giữ đúng tính cụ thể của con vật hiến tế.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số từ để phản ánh lối liệt kê và số lượng chính xác của các lễ vật trong Dân Số Ký 7.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật dâng liên quan đến tội lỗi, chứ không chỉ tội lỗi theo nghĩa trừu tượng. Cách dịch này tự nhiên và giữ được chức năng tế lễ của cụm từ.
theological_decisions:
- issue: Cách diễn đạt tên lễ חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ Hê-bơ-rơ có thể được hiểu theo chức năng xử lý tội lỗi hoặc thanh tẩy trong nghi lễ. Bản chính dùng cách gọi quen thuộc, dễ hiểu “lễ vật chuộc tội”, nhưng không thêm chi tiết về cơ chế thần học ngoài văn bản.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và mang tính kiểm kê, phù hợp với cấu trúc lặp lại của Dân Số Ký 7. Dấu chấm phẩy được giữ để cho thấy câu này thuộc một danh sách lễ vật dài hơn.
