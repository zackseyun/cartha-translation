translation:
  language: vi
  text: một con bò đực thuộc đàn, một con chiên đực, một con chiên con đực một tuổi, để dâng làm lễ thiêu;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: một con bò đực từ đàn bò
  rationale: פַּר chỉ bò đực, còn בֶּן בָּקָר là cách nói xác định con vật thuộc đàn bò. Cách dịch này tự nhiên trong tiếng Việt và giữ được cả loại vật lẫn nguồn đàn.
- source_word: אַיִל
  choice: một con chiên đực
  rationale: Đây là thuật ngữ chỉ chiên đực trưởng thành dùng trong bối cảnh tế lễ.
- source_word: כֶּבֶשׂ
  choice: một con chiên con đực
  rationale: Từ này chỉ chiên con, thường là con đực trong quy định tế lễ; nêu rõ giới tính giúp phân biệt với cách gọi chung “chiên con”.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ chỉ con vật ở độ tuổi một năm; “một tuổi” là cách diễn đạt gọn và tự nhiên.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu toàn bộ; giới từ לְ biểu thị mục đích. “Để làm lễ thiêu” phù hợp với cấu trúc liệt kê.
- source_word: אֶחָד
  choice: một
  rationale: Giữ lại số từ được lặp trước từng con vật trong bản Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp với một danh mục lễ vật. Dùng “chiên đực” và “chiên con đực” để phân biệt con trưởng thành với con một tuổi; giữ dấu chấm phẩy vì câu là một mục trong danh sách dài hơn.
