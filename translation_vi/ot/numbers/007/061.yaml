  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông là một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc[b] nặng bảy mươi siếc-lơ, theo đơn vị siếc-lơ của nơi thánh[c]; cả hai đều đầy bột mì mịn trộn với dầu, dùng cho lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mâm bạc”; từ Hê-bơ-rơ קַעֲרָה chỉ một vật đựng tương đối nông.
    reason: lexical_alternative
  - marker: b
    text: Hay “bát bạc”; từ Hê-bơ-rơ מִזְרָק chỉ một vật đựng dùng trong nghi lễ nơi thánh.
    reason: lexical_alternative
  - marker: c
    text: “Theo đơn vị siếc-lơ của nơi thánh” nghĩa là theo chuẩn trọng lượng của nơi thánh.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Lễ vật của ông gồm
  rationale: קָרְבָּן chỉ vật được dâng trong nghi lễ. “Lễ vật” rõ nghĩa trong tiếng Việt; “gồm” dẫn vào danh mục tự nhiên, dù động từ này được bổ sung để hoàn chỉnh cú pháp.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קְעָרָה là vật đựng tương đối nông; “đĩa” diễn đạt hình dạng khả dĩ và giữ văn phong kiểm kê súc tích.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Tiếng Hê-bơ-rơ nói sát nghĩa là “trọng lượng của nó [là] một trăm ba mươi”; dùng “nặng” tự nhiên hơn trong tiếng Việt mà vẫn giữ chính xác số đo.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק là vật đựng dùng trong nghi lễ tại nơi thánh. “Chậu” phân biệt với chiếc đĩa nông và phù hợp hơn một từ thuần gia dụng như “bát”.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Bổ sung “nặng” theo quan hệ cú pháp và công thức cân trọng lượng của vật dụng trong câu.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Cụm từ chỉ chuẩn trọng lượng được quy định tại nơi thánh; bản dịch giữ cách gọi cụ thể và giải thích ngắn trong chú thích.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Giữ rõ đại từ chỉ cả hai vật dụng; “đựng đầy” tự nhiên hơn “đầy” khi nói về đồ chứa.
- source_word: סֹלֶת
  choice: bột mì mịn
  rationale: סֹלֶת là loại bột tinh chế dùng trong tế lễ; “bột mì mịn” là cách nói rõ ràng đối với độc giả hiện đại.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn dầu
  rationale: Phân từ bị động diễn tả bột đã được hòa trộn với dầu; tiếng Việt có thể nói gọn và tự nhiên là “bột mì mịn trộn dầu”.
- source_word: לְמִנְחָה
  choice: để làm tế lễ ngũ cốc
  rationale: Trong ngữ cảnh tư tế, מִנְחָה là lễ dâng từ sản vật ngũ cốc chứ không phải lễ vật nói chung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc liệt kê của nguyên văn nhưng thêm “gồm” và lặp “nặng” để câu tiếng Việt sáng rõ. Phiên âm đơn vị שֶׁקֶל là “siếc-lơ” và giải thích chuẩn cân trong chú thích.
