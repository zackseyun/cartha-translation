  to: Lễ vật của ông là một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc[b] nặng bảy mươi siếc-lơ, theo đơn vị siếc-lơ của nơi thánh[c]; cả hai đều đầy bột mì mịn trộn với dầu, dùng cho lễ vật ngũ cốc.
