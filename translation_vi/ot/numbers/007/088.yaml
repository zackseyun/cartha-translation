revisions:
- from: Tổng số gia súc dùng làm sinh tế bình an[a] là hai mươi bốn con bò đực, sáu mươi con chiên đực, sáu mươi con dê đực và sáu mươi con chiên con một tuổi. Đó là lễ cung hiến bàn thờ sau khi bàn thờ được xức dầu.
  to: Tổng số bò dùng cho lễ tế bình an[a] là hai mươi bốn con bò đực, sáu mươi con chiên đực, sáu mươi con dê đực và sáu mươi con chiên con một tuổi. Đó là lễ cung hiến bàn thờ sau khi bàn thờ được xức dầu.
  rationale: Bản sửa giới hạn từ chỉ đàn vật vào đúng nghĩa “bò” của בָּקָר, thay thuật ngữ “sinh tế” bằng “lễ tế” theo lối dùng hiện đại, và điều chỉnh chú thích để bảo lưu các cách hiểu từ vựng mà không thêm ý cầu xin. Không thay đổi nội dung, số lượng, hay quan hệ thời gian của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:39:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa “gia súc” thành “bò”: בָּקָר là nhóm gia súc bovine, và tổng số được nêu ngay sau đó là hai mươi bốn bò đực. Các số lượng, giống vật, tuổi của chiên con, và mệnh đề bàn thờ được xức dầu đều được truyền đạt chính xác.'
  naturalness: “Lễ tế bình an” là cách gọi tự nhiên, hiện đại và rõ hơn “sinh tế bình an”, trong khi vẫn giữ sắc thái thuật ngữ của loại tế lễ. Câu tổng kết với “Tổng số bò dùng cho...” rõ phạm vi của danh từ tập hợp.
  terminology: Dùng nhất quán các thuật ngữ “lễ tế bình an”, “bò đực”, “chiên đực”, “dê đực”, và “chiên con một tuổi”. Chú thích thay “cầu phúc lành”, vốn có thể gợi ý hành vi cầu xin không có trong từ gốc, bằng lựa chọn trung tính hơn là “an lành”.
  issues:
  - severity: medium
    issue: “Gia súc” dịch בָּקָר quá rộng trong ngữ cảnh này.
    rationale: Trong tiếng Việt, “gia súc” có thể bao gồm cả chiên và dê, trong khi בָּקָר chỉ đàn bò; câu đang tổng kết riêng hạng mục bò trước khi liệt kê các loài khác.
  - severity: low
    issue: Chú thích “sinh tế cầu phúc lành” thêm sắc thái cầu xin.
    rationale: שְׁלָמִים có thể chỉ phúc an/an lành, nhưng bản thân thuật ngữ không nhất thiết biểu thị việc “cầu” phúc.
