source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: vi
  text: Tổng số bò dùng cho lễ tế bình an[a] là hai mươi bốn con bò đực, sáu mươi con chiên đực, sáu mươi con dê đực và sáu mươi con chiên con một tuổi. Đó là lễ cung hiến bàn thờ sau khi bàn thờ được xức dầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ tế thông công” hoặc “lễ tế an lành.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: Tổng số gia súc
  rationale: Trong câu tổng kết này, וְכֹל cùng danh từ tập hợp בְּקַר chỉ toàn bộ số gia súc thuộc nhóm lễ vật; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sinh tế bình an
  rationale: Giữ זֶבַח là “sinh tế” và dùng thuật ngữ quen thuộc “bình an” cho loại lễ שְׁלָמִים, đồng thời ghi nhận các sắc thái khác trong chú thích.
- source_word: פָּרִים
  choice: bò đực
  rationale: Chỉ những con bò đực trong bối cảnh hiến tế; nguyên văn không buộc phải thêm ý “tơ”.
- source_word: אֵילִם
  choice: chiên đực
  rationale: Cách gọi tiếng Việt hiện đại, chính xác cho cừu đực dùng làm sinh tế.
- source_word: עַתֻּדִים
  choice: dê đực
  rationale: Giữ rõ giới tính đực được từ Hê-bơ-rơ xác định.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: chiên con một tuổi
  rationale: Truyền đạt cả loại con vật lẫn độ tuổi được quy định.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: lễ cung hiến bàn thờ
  rationale: חֲנֻכָּה ở đây chỉ việc hoặc nghi lễ khánh thành, cung hiến bàn thờ; không thêm danh từ “lễ vật” vốn không được nêu trực tiếp.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: sau khi bàn thờ được xức dầu
  rationale: Dùng cấu trúc bị động để không đưa vào một chủ thể hành động không được nêu, đồng thời lặp “bàn thờ” cho rõ đại từ chỉ vật trong tiếng Việt.
theological_decisions:
- issue: Cách dịch loại sinh tế שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công; sinh tế cầu phúc lành
  rationale: “Bình an” duy trì thuật ngữ tế lễ quen thuộc nhưng không diễn giải hết các sắc thái về sự nguyên vẹn, phúc lành và mối thông công; các khả năng ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “chiên” theo cách gọi Kinh Thánh phổ biến trong tiếng Việt; cấu trúc câu được điều chỉnh thành lời tổng kết tự nhiên nhưng vẫn bảo toàn số lượng và các loại con vật của nguyên văn.
