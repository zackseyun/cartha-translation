  yaml_path: translation/ot/numbers/007/056.yaml
  text: one gold dish weighing ten shekels[a], full of incense;
translation:
  language: vi
  text: một đĩa bằng vàng nặng mười siếc-lơ[a], đựng đầy hương liệu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một đĩa bằng vàng, mười [siếc-lơ], đựng đầy hương liệu.” Tiếng Hê-bơ-rơ lược đơn vị cân nặng tại đây, nhưng trong công thức lễ vật được lặp lại này, ý nghĩa là mười siếc-lơ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa
  rationale: Trong danh mục lễ vật của Dân Số 7, từ này chỉ một vật chứa nhỏ dùng để đựng hương liệu; “đĩa” tự nhiên và tránh gợi đến chiếc thìa ăn.
- source_word: אַחַת
  choice: một
  rationale: Số từ đơn giản, phù hợp với danh từ giống cái כַּף.
- source_word: עֲשָׂרָה
  choice: mười siếc-lơ
  rationale: Bản Hê-bơ-rơ ghi “mười” nhưng lược đơn vị cân nặng; công thức lặp lại trong chương cho thấy đơn vị được hiểu là siếc-lơ.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt chất liệu làm nên chiếc đĩa.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Diễn đạt tự nhiên trạng thái chiếc đĩa chứa đầy vật được nói đến.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm được dùng để xông trong nghi lễ thờ phượng; “hương liệu” phù hợp khi nói đến vật chứa, không thu hẹp thành làn khói.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, phù hợp với một mục trong danh sách lễ vật. Giữ dấu chấm phẩy theo mạch liệt kê của ngữ cảnh.
