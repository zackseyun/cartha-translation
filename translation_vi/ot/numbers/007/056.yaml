  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung của tiếng Hê-bơ-rơ: một vật chứa bằng vàng, số lượng một, trọng lượng mười siếc-lơ được suy ra hợp lý từ công thức lặp lại trong ngữ cảnh, và chứa đầy קְטֹרֶת. Việc thêm “nặng” làm rõ quan hệ của “mười” với đơn vị cân nặng được lược trong câu mà không làm đổi nghĩa.'
