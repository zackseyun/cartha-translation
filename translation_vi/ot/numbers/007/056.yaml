  terminology: “Đĩa” phù hợp với lựa chọn nghĩa vật chứa nghi lễ của כַּף và tránh đồng nhất với thìa ăn hiện đại. “Hương liệu” diễn đạt tốt chất hương dùng trong nghi lễ (קְטֹרֶת), không nhầm với khói hương. “Siếc-lơ” là cách phiên âm có thể hiểu được trong tiếng Việt hiện đại.
