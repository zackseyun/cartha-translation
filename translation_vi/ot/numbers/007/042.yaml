  text: בַּ/יּוֹם֙ הַ/שִּׁשִּׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י גָ֑ד אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: vi
  text: 'Ngày thứ sáu, người lãnh đạo của con cháu Gát[a] là Ê-li-a-sáp, con trai Đê-u-ên[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Gát”, nghĩa là chi tộc hoặc con cháu của Gát.'
    reason: lexical_alternative
  - marker: b
    text: Tại đây, bản Hê-bơ-rơ chép tên là “Đê-u-ên”; xin so sánh những chỗ tên này xuất hiện dưới dạng “Rê-u-ên”.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: Ngày thứ sáu
  rationale: Cụm giới từ בַּיּוֹם cùng số thứ tự diễn tả thời điểm trong công thức kể chuyện; tiếng Việt tự nhiên dùng “Ngày thứ sáu”.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Trong Dân Số Ký 7, từ này chỉ người đứng đầu được công nhận của một chi tộc; “người lãnh đạo” rõ nghĩa, hiện đại và không gợi sai sắc thái hoàng gia như “hoàng tử”.
- source_word: לִבְנֵי גָד
  choice: của con cháu Gát
  rationale: לִ biểu thị quan hệ giữa người lãnh đạo và nhóm chi tộc; “con cháu Gát” giữ được hình ảnh huyết thống của nguyên văn בְנֵי mà vẫn tự nhiên trong tiếng Việt.
- source_word: אֶלְיָסָף
  choice: Ê-li-a-sáp
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc của bản Masoret.
- source_word: בֶּן
  choice: con trai
  rationale: Cách diễn đạt tự nhiên cho cấu trúc phụ danh Hê-bơ-rơ, xác định người cha.
- source_word: דְּעוּאֵל
  choice: Đê-u-ên
  rationale: Phản ánh dạng phụ âm דְּעוּאֵל trong câu này của bản Masoret; không thay bằng dạng Rê-u-ên xuất hiện ở một số chỗ liên quan.
