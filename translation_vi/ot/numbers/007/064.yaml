  text: một con dê đực làm lễ vật chuộc tội;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ Hê-bơ-rơ chỉ một con dê giống đực. “Con dê đực” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và giữ được tính cụ thể của con vật dùng làm lễ vật.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số từ được nêu rõ trong nguyên văn, phù hợp với lối liệt kê lặp lại của Dân Số Ký 7.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật dâng liên quan đến tội lỗi, không chỉ khái niệm trừu tượng “tội”. Cách dịch này diễn đạt rõ chức năng tế lễ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách gọi חַטָּאת trong hệ thống tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: “Lễ vật chuộc tội” là thuật ngữ dễ hiểu và quen thuộc với độc giả Việt, trong khi nguyên ngữ có thể nhấn mạnh cả việc xử lý tội lỗi lẫn sự thanh tẩy. Không thêm chú thích vì câu ngắn này không tự nó giải quyết toàn bộ phạm vi ý nghĩa của thuật ngữ.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và ngắn gọn, giữ cấu trúc của một mục trong danh sách lễ vật. Không dùng chú thích cho “dê đực” vì bản dịch chính đã chuyển tải đầy đủ nét nghĩa cần thiết.
