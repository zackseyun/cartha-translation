translation:
  language: vi
  text: một đĩa vàng nặng mười siếc-lơ[a], đầy hương;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ sát nghĩa là: “một đĩa vàng, mười [vàng], đầy hương”; đơn vị “siếc-lơ” được bổ sung dựa trên công thức lễ vật lặp lại trong văn cảnh này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa
  rationale: Trong ngữ cảnh lễ vật tại Đền Tạm, từ này chỉ một vật chứa nhỏ; “đĩa” tự nhiên và không khiến người đọc nghĩ đến chiếc thìa ăn.
- source_word: אַחַת
  choice: một
  rationale: Số từ đơn giản, phù hợp với danh từ giống cái כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: bằng vàng nặng mười siếc-lơ
  rationale: Nguyên văn nêu “mười” và “vàng” nhưng lược đơn vị cân; “siếc-lơ” được bổ sung theo công thức lễ vật lặp lại trong văn cảnh. Cách diễn đạt này cho thấy đây là trọng lượng của chiếc đĩa bằng vàng.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Diễn đạt tự nhiên trạng thái vật chứa đầy thứ ở sau.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm được dùng để xông trong nghi lễ thánh; “hương liệu” rõ nghĩa và phù hợp văn cảnh thờ phượng.
