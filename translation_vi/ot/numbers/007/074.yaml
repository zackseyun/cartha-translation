    text: 'Nguyên văn Hê-bơ-rơ sát nghĩa là: “một đĩa vàng, mười [vàng], đầy hương”; đơn vị “siếc-lơ” được bổ sung dựa trên công thức lễ vật lặp lại trong văn cảnh này.'
