revisions:
- from: Lễ vật của ông là một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc[b] nặng bảy mươi siếc-lơ, theo siếc-lơ nơi thánh[c]; cả hai đều đựng đầy bột mịn trộn với dầu để làm lễ vật ngũ cốc.
  to: Lễ vật của ông là một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc[b] nặng bảy mươi siếc-lơ, theo siếc-lơ của nơi thánh[c]; cả hai đều đựng đầy bột mịn trộn với dầu, dùng cho lễ vật bằng ngũ cốc.
