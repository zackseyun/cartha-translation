  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông là một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc[b] nặng bảy mươi siếc-lơ, theo siếc-lơ của nơi thánh[c]; cả hai đều đựng đầy bột mịn trộn với dầu, dùng cho lễ vật bằng ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mâm bạc”; từ Hê-bơ-rơ chỉ một vật chứa nông dùng trong danh mục lễ vật.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “chậu bạc”; đây là một vật đựng dùng trong nghi lễ.
    reason: lexical_alternative
  - marker: c
    text: Nghĩa là theo chuẩn trọng lượng được dùng tại nơi thánh.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Lễ vật của ông là
  rationale: קָרְבָּן chỉ vật được dâng trong bối cảnh thờ phượng; “lễ vật” tự nhiên, rõ nghĩa và phù hợp văn cảnh tế lễ.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קְעָרָה là một vật đựng tương đối nông, có thể gọi là đĩa hoặc mâm; “đĩa” rõ ràng và phù hợp danh mục lễ vật.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Diễn đạt tự nhiên mệnh đề Hê-bơ-rơ nói rõ trọng lượng của chiếc đĩa.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק là vật đựng dùng trong nghi lễ; “chậu” phân biệt nó với chiếc đĩa nông mà không xác định quá mức công dụng.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Bổ sung “nặng” trong tiếng Việt để làm rõ đây là trọng lượng, đúng với cấu trúc liệt kê của nguyên văn.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Giữ cách gọi đơn vị của nguyên văn và diễn đạt ý cân theo chuẩn dùng tại nơi thánh; chú thích giải thích nét văn hóa này.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Truyền đạt rõ rằng cả hai vật đựng đều chứa đầy, đồng thời tự nhiên hơn trong tiếng Việt so với “đều đầy”.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Thuật ngữ chỉ loại bột tinh dùng cho lễ vật.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn với dầu
  rationale: Phân từ bị động chỉ bột đã được hòa trộn với dầu; cách nói hiện đại và chính xác.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong văn mạch tế lễ của sách Dân Số, מִנְחָה là lễ vật làm từ sản phẩm ngũ cốc; cách dịch tránh hiểu chung chung là bất kỳ lễ vật nào.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ nhịp liệt kê của nguyên văn. Dùng “siếc-lơ” làm phiên âm đơn vị cổ và giải thích chuẩn cân của nơi thánh trong chú thích; các phương án gọi vật đựng được giữ trong chú thích vì hình dạng chính xác không hoàn toàn chắc chắn.
