  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/015.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: vi
  text: một con bò đực trong đàn, một con chiên đực, một con chiên con đực một tuổi, dâng làm lễ toàn thiêu;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: con bò đực từ đàn bò
  rationale: פַּר chỉ bò đực, còn בֶּן בָּקָר xác định đó là gia súc thuộc đàn bò. Cách dịch này giữ được cả hai yếu tố mà không dùng lối nói sát chữ thiếu tự nhiên như “con của đàn bò”.
- source_word: אַיִל
  choice: con chiên đực
  rationale: Từ này chỉ chiên đực trưởng thành và là cách gọi thích hợp trong danh sách sinh tế.
- source_word: כֶּבֶשׂ
  choice: con chiên con đực
  rationale: Trong ngữ cảnh sinh tế, כֶּבֶשׂ chỉ chiên con, ở đây là con đực; nêu rõ giới tính giúp phân biệt với chiên đực trưởng thành אַיִל.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ chỉ con vật được một tuổi hoặc đang trong năm đầu; “một tuổi” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là sinh tế được thiêu trọn; “lễ thiêu” là thuật ngữ ngắn gọn, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số đếm được lặp lại trước từng con vật, phù hợp với văn phong liệt kê của câu.
theological_decisions:
- issue: Ý nghĩa của עֹלָה
  choice: lễ thiêu
  alternative: lễ toàn thiêu
  rationale: “Lễ thiêu” truyền đạt loại sinh tế mà không thêm từ “toàn”, vốn giải thích đặc điểm nghi lễ rõ hơn nhưng không hiện diện thành phần tương ứng trực tiếp trong từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong liệt kê trang trọng, tự nhiên và dễ hiểu. Dùng “chiên đực” cho con trưởng thành và “chiên con đực” cho con non để phản ánh sự phân biệt từ vựng trong nguyên văn.
