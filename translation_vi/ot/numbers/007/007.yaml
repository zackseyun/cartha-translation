  text: אֵ֣ת שְׁתֵּ֣י הָ/עֲגָלֹ֗ת וְ/אֵת֙ אַרְבַּ֣עַת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י גֵרְשׁ֑וֹן כְּ/פִ֖י עֲבֹדָתָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/007.yaml
  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: vi
  text: Ông trao hai cỗ xe và bốn con bò cho con cháu Ghẹt-sôn, tùy theo công việc phục vụ của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: cỗ xe
  rationale: Danh từ עֲגָלָה chỉ xe dùng để chuyên chở. “Cỗ xe” tự nhiên trong tiếng Việt và phù hợp với việc vận chuyển các vật dụng của Đền Tạm.
- source_word: הַבָּקָר
  choice: bò
  rationale: בָּקָר là danh từ tập hợp chỉ gia súc thuộc loài bò. “Bò” giữ được tính không xác định giới tính của tiếng Hê-bơ-rơ; ngữ cảnh cho thấy đây là bò kéo xe.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: cho con cháu Ghẹt-sôn
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “cho các con trai/con cái của Ghẹt-sôn”; trong ngữ cảnh bộ tộc, “con cháu Ghẹt-sôn” vừa tự nhiên vừa giữ được cấu trúc thân tộc của nguyên văn.
- source_word: כְּפִי עֲבֹדָתָם
  choice: tùy theo công việc phục vụ của họ
  rationale: כְּפִי diễn tả sự phân bổ tương ứng với nhu cầu hoặc tính chất công việc; עֲבֹדָה ở đây là nhiệm vụ phục vụ liên quan đến Đền Tạm. Cách dịch này rõ nghĩa mà không thêm nội dung ngoài nguyên văn.
- source_word: נָתַן
  choice: Ông trao
  rationale: נָתַן có nghĩa cơ bản là “cho, trao”. “Trao” phù hợp với ngữ cảnh Môi-se phân phát xe và bò, đồng thời không diễn giải quá mức thành “phân công” hay “chỉ định”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” nối tự nhiên với chủ thể Môi-se trong ngữ cảnh trước. Không thêm chú thích vì các lựa chọn từ vựng tiếng Việt không cần một phương án thay thế thiết yếu để bảo toàn ý nghĩa.
