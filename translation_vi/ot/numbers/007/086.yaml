- from: mười hai đĩa vàng đựng đầy hương thơm[a], mỗi đĩa nặng mười siếc-lơ theo siếc-lơ nơi thánh; tổng số vàng của các đĩa là một trăm hai mươi siếc-lơ.
  to: Mười hai đĩa vàng đầy hương liệu[a], mỗi đĩa nặng mười siếc-lơ theo chuẩn siếc-lơ nơi thánh; tổng lượng vàng của các đĩa là một trăm hai mươi siếc-lơ.
