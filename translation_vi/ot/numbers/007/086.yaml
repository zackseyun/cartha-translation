base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: vi
  text: Mười hai đĩa vàng đầy hương liệu[a], mỗi đĩa nặng mười siếc-lơ theo chuẩn siếc-lơ nơi thánh; tổng lượng vàng của các đĩa là một trăm hai mươi siếc-lơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chảo nhỏ,” “bát” hoặc, theo truyền thống, là “thìa”; đây là những vật đựng hương liệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: đĩa
  rationale: Trong ngữ cảnh lễ vật tại Đền Tạm, từ này chỉ một vật đựng nhỏ dùng cho hương thơm. “Đĩa” tự nhiên trong tiếng Việt và phù hợp với vật có thể được đựng đầy; tránh cách dịch truyền thống “thìa,” vốn dễ gây hiểu sai về hình dạng và công dụng.
- source_word: זָהָב
  choice: vàng
  rationale: Chỉ vật liệu làm các đĩa.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: mười hai
  rationale: Số từ chỉ tổng số vật đựng.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: đựng đầy hương thơm
  rationale: Diễn đạt tự nhiên ý các đĩa đầy loại hương dùng trong nghi lễ; “hương thơm” rõ nghĩa hơn “hương” đứng riêng trong tiếng Việt hiện đại.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: mỗi đĩa nặng mười siếc-lơ
  rationale: Sự lặp lại số mười mang nghĩa phân phối, tức mỗi đĩa có trọng lượng mười siếc-lơ; “nặng” được nêu rõ theo ngữ cảnh cân đo.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Giữ công thức kỹ thuật chỉ chuẩn cân chính thức được dùng tại nơi thánh, đồng thời diễn đạt gọn và dễ hiểu.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: tổng số vàng của các đĩa
  rationale: Chuyển tự nhiên cụm từ chỉ tổng lượng vàng cấu thành các vật đựng.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: một trăm hai mươi siếc-lơ
  rationale: Nguyên văn cho số 120; đơn vị siếc-lơ được bổ sung rõ từ công thức cân đo ngay trước đó.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “siếc-lơ” để bảo tồn đơn vị cân cổ; “nơi thánh” giữ sắc thái nghi lễ của הַקֹּדֶשׁ mà không giải thích quá mức. Dấu chấm phẩy phản ánh hai mệnh đề cân đo liên kết chặt chẽ.
