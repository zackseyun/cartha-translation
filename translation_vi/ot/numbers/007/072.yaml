  text: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/072.yaml
  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: vi
  text: Ngày thứ mười một, thủ lĩnh của con cháu A-se[a] là Pa-ghi-ên, con trai Óc-ran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con cháu A-se” ở đây chỉ chi tộc A-se; người được nói đến là thủ lĩnh đại diện cho chi tộc này.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם
  choice: Ngày thứ mười một
  rationale: Cụm Hê-bơ-rơ lặp từ “ngày” theo công thức tường thuật của Dân Số Ký 7; tiếng Việt tự nhiên dùng số thứ tự và không cần giữ sự lặp từ.
- source_word: נָשִׂיא
  choice: thủ lĩnh
  rationale: Từ này chỉ người đứng đầu được công nhận của một chi tộc; “thủ lĩnh” rõ nghĩa trong bối cảnh và không gợi địa vị hoàng gia như “hoàng tử”.
- source_word: לִ/בְנֵ֣י אָשֵׁ֑ר
  choice: của con cháu A-se
  rationale: Giữ hình ảnh quan hệ huyết thống trong nguyên văn, đồng thời dùng cách nói tiếng Việt tự nhiên để chỉ chi tộc A-se.
- source_word: פַּגְעִיאֵ֖ל
  choice: Pa-ghi-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang dạng dễ đọc đối với độc giả Việt, có giữ phụ âm cuối của thành tố thần danh.
- source_word: בֶּן עָכְרָֽן
  choice: con trai Óc-ran
  rationale: Dịch trực tiếp cấu trúc phụ danh בֶּן và phiên âm tên người theo lối dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc giới thiệu thủ lĩnh theo nguyên văn, đồng thời lược sự lặp từ “ngày” vốn không tự nhiên trong tiếng Việt.
