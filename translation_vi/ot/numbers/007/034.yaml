  language: vi
  text: một con dê đực làm lễ vật chuộc tội;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “một con dê đực trong số dê làm lễ vật chuộc tội.”'
    reason: Nêu cấu trúc đầy đủ của cụm từ Hê-bơ-rơ שְׂעִיר עִזִּים, vốn được diễn đạt gọn và tự nhiên hơn trong chính văn.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ Hê-bơ-rơ theo nghĩa đen là “con có lông thuộc loài dê”, nhưng là cách nói chỉ dê đực. “Con dê đực” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và giữ đúng loại sinh vật dùng làm lễ vật.
- source_word: אֶחָד
  choice: một
  rationale: Giữ rõ số từ như nguyên văn, phù hợp với lối liệt kê có tính công thức và kiểm đếm xuyên suốt Dân Số 7.
- source_word: לְחַטָּאת
  choice: để làm lễ vật chuộc tội
  rationale: Trong văn cảnh tế lễ, חַטָּאת chỉ một loại lễ vật liên quan đến tội lỗi, chứ không chỉ khái niệm “tội”. Cách dịch này diễn đạt tự nhiên chức năng tế lễ của con vật mà không thêm diễn giải giáo lý.
theological_decisions:
- issue: Nghĩa của חַטָּאת trong văn cảnh tế lễ
  choice: lễ vật chuộc tội
  alternative: tội; lễ vật vì tội
  rationale: Văn cảnh trực tiếp là danh sách các sinh vật và vật phẩm dâng tế lễ, nên danh từ này chỉ loại lễ vật. Cách dịch giữ nghĩa nghi lễ của thuật ngữ và không áp đặt sắc thái thần học nằm ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc ngắn gọn của danh mục lễ vật; dùng “để làm” để diễn đạt tự nhiên tiền tố לְ trong ngữ cảnh này.
