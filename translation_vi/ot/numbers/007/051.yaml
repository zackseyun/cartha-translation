translation:
  language: vi
  text: một con bò đực từ đàn gia súc, một con cừu đực, một con chiên đực một tuổi, làm của lễ thiêu;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: con bò đực từ đàn gia súc
  rationale: פַּר là bò đực dùng làm sinh tế; בֶּן־בָּקָר xác định đó là con vật thuộc đàn gia súc. Cách dịch này giữ được cả hai thành tố mà vẫn tự nhiên trong tiếng Việt.
- source_word: אַיִל
  choice: con cừu đực
  rationale: Đây là từ thông dụng chỉ cừu đực trưởng thành, nhất là trong ngữ cảnh tế lễ.
- source_word: כֶּבֶשׂ
  choice: con chiên đực
  rationale: Từ này chỉ chiên non, thường là con đực trong các danh mục sinh tế; thêm “đực” làm rõ giới tính được hàm chứa trong danh từ Hê-bơ-rơ.
- source_word: בֶּן־שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ chỉ con vật được một năm tuổi; “một tuổi” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là sinh tế được thiêu trọn; “lễ thiêu” nêu rõ loại tế lễ và phù hợp với cấu trúc danh mục.
- source_word: אֶחָד
  choice: một
  rationale: Số từ được lặp lại trước từng loại con vật để xác định số lượng; bản dịch giữ nguyên sự lặp lại ấy.
