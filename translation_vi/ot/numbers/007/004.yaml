  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng wayyiqtol tiếp nối mạch kể; “bấy giờ” diễn đạt tự nhiên sự tiếp diễn, còn “phán” phù hợp khi Đức Chúa Trời là chủ thể.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Biểu đạt danh riêng YHWH theo cách gọi quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt, thay vì đồng nhất danh này với tước hiệu chung.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho người tiếp nhận lời phán.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức dẫn lời trực tiếp trong tiếng Hê-bơ-rơ được chuyển bằng “rằng” và dấu hai chấm, tránh lối dịch cứng “mà rằng” nhưng vẫn giữ chức năng dẫn nhập.
theological_decisions:
- issue: Cách thể hiện danh giao ước יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Chúa
  rationale: Giữ đây là danh riêng trong văn bản nguồn, không làm mờ thành một tước hiệu; hình thức này đã quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dấu hai chấm báo trước lời trực tiếp bắt đầu ở câu kế tiếp.
