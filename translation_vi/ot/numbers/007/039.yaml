  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: vi
  text: một con bò đực trong đàn[a], một con chiên đực, một con chiên con đực[b] một tuổi, làm lễ toàn thiêu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “một con bò đực, con của đàn bò”, một thành ngữ chỉ bò đực thuộc đàn gia súc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch đơn giản là “một con chiên con”; từ Hê-bơ-rơ ở đây thường được dùng cho chiên con đực trong bối cảnh tế lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: con bò đực
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ bò đực, có thể là bò đực còn trẻ; “con bò đực” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֶחָד
  choice: một
  rationale: Việc lặp lại số từ nhấn mạnh số lượng riêng của từng con vật và giữ nguyên cấu trúc liệt kê của tiếng Hê-bơ-rơ.
- source_word: בֶּן בָּקָר
  choice: từ đàn bò
  rationale: Nghĩa đen là “con của đàn bò/gia súc”, một thành ngữ xác định con vật thuộc loài bò; cách dịch này truyền đạt ý nghĩa mà không dịch sát đến mức gượng gạo.
- source_word: אַיִל
  choice: con chiên đực
  rationale: Đây là từ thông dụng chỉ chiên đực trưởng thành, nhất là trong danh mục tế lễ.
- source_word: כֶּבֶשׂ
  choice: con chiên con đực
  rationale: Từ này chỉ chiên con và trong ngữ cảnh tế lễ thường hàm ý con đực; bản dịch nêu rõ giới tính nhưng chú thích ghi nhận khả năng dịch đơn giản hơn.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ này diễn tả tuổi của con vật; “một tuổi” là cách nói tự nhiên, gọn rõ trong tiếng Việt.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; giới từ לְ chỉ mục đích, nên “để làm lễ thiêu” phù hợp với cấu trúc danh sách.
theological_decisions:
- issue: Cách gọi עֹלָה
  choice: lễ thiêu
  alternative: lễ toàn thiêu
  rationale: “Lễ thiêu” diễn đạt trực tiếp loại tế lễ được đốt lên và tránh đưa thêm sắc thái không được phát biểu riêng trong câu; “lễ toàn thiêu” là thuật ngữ truyền thống có thể dùng nhưng mang tính diễn giải rõ hơn.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu; giữ nhịp liệt kê cùng sự lặp lại của nguyên văn. Tất cả dấu chú thích đều được đặt ngay trong chính văn.
