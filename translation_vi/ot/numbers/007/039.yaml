  terminology: Dùng "lễ toàn thiêu" cho עֹלָה là thuật ngữ Việt ngữ chính xác, nêu rõ đặc tính của loại lễ vật mà từ Hê-bơ-rơ biểu thị, và phân biệt với các lễ khác. "Chiên đực" tương ứng אַיִל; "chiên con đực" tương ứng כֶּבֶשׂ và giữ sự phân biệt tuổi/loại con vật.
