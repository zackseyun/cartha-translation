  verdict: revise
  source_fidelity: Bản nháp giữ đúng số lượng và thứ tự các con vật. Tuy nhiên, לְעֹלָה chỉ con vật được dâng "làm lễ toàn thiêu/lễ thiêu", không tự nhiên là "để làm lễ thiêu" (cách nói này dễ gợi hành động cử hành nghi thức). Chú thích b giải thích כֶּבֶשׂ nhưng hiện neo sau "lễ thiêu", nên cần chuyển về ngay sau "chiên con đực".
