  text: một con dê đực làm lễ vật tạ tội.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ Hê-bơ-rơ chỉ một con dê giống đực; cách dịch này tự nhiên trong tiếng Việt và giữ rõ giới tính của con vật trong danh sách lễ vật.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số từ được nêu rõ trong bản Hê-bơ-rơ, phù hợp với tính chất kiểm kê của phân đoạn.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật dâng vì tội lỗi, không phải khái niệm trừu tượng về tội; giới từ לְ được diễn đạt tự nhiên bằng “làm”.
theological_decisions:
- issue: Cách hiểu חַטָּאת trong ngữ cảnh nghi lễ
  choice: lễ vật chuộc tội
  alternative: vì tội lỗi
  rationale: Ngữ cảnh là danh sách các sinh vật và lễ vật dâng tế, nên danh từ mang nghĩa nghi lễ. Cách dịch này giữ nghĩa trực tiếp của văn bản mà không đưa thêm diễn giải thần học về cơ chế chuộc tội.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, phù hợp với cấu trúc liệt kê. Dùng “con dê đực” thay cho lối diễn đạt cổ hoặc nặng tính kỹ thuật.
