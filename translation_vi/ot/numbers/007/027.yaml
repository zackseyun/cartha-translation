  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: vi
  text: một con bò đực trong đàn[a], một con chiên đực, một con chiên con đực một tuổi[b], làm lễ toàn thiêu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “một con bò đực, con của đàn gia súc.” Đây là một thành ngữ Hê-bơ-rơ chỉ con bò đực thuộc đàn bò; cũng có thể hiểu là bò đực non.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “một con chiên con đực, con của năm nó,” tức là một tuổi hoặc đang trong năm đầu tiên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: một con bò đực thuộc đàn gia súc
  rationale: פַּר chỉ bò đực; בֶּן בָּקָר theo nghĩa đen là “con của đàn gia súc”, một thành ngữ chỉ con vật thuộc loài bò. Cách dịch này tự nhiên trong tiếng Việt và không tự ý thêm nét nghĩa về độ tuổi.
- source_word: אַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל là con chiên đực trưởng thành, dùng trong ngữ cảnh tế lễ; cách dịch giữ rõ giới tính của con vật.
- source_word: כֶּבֶשׂ אֶחָד
  choice: một con chiên con đực
  rationale: כֶּבֶשׂ chỉ chiên con giống đực; “chiên con đực” bảo toàn nét nghĩa từ vựng và phù hợp với danh sách lễ vật.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “con của năm nó”, chỉ con vật một tuổi hoặc đang trong năm đầu tiên; “một tuổi” là cách diễn đạt gọn và tự nhiên.
- source_word: לְעֹלָה
  choice: dùng làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; “lễ thiêu” là thuật ngữ tiếng Việt rõ ràng, còn “dùng làm” thể hiện chức năng của các con vật trong danh sách.
