  yaml_path: translation/ot/numbers/007/068.yaml
  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: vi
  text: một đĩa bằng vàng[a], nặng mười siếc-lơ, đựng đầy hương liệu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “một đĩa vàng, mười, đựng đầy hương liệu”; đơn vị trọng lượng “siếc-lơ” được hiểu ngầm theo công thức lễ vật lặp lại trong Dân Số Ký 7.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa
  rationale: Trong bối cảnh lễ vật tại Đền Tạm, từ này chỉ một vật đựng nhỏ dùng trong nghi lễ. “Đĩa” tự nhiên hơn “thìa” trong tiếng Việt hiện đại và phù hợp với việc đựng hương liệu.
- source_word: אַחַת
  choice: một
  rationale: Số từ đơn giản, hòa hợp với danh từ giống cái כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: nặng mười siếc-lơ
  rationale: Câu Hê-bơ-rơ tỉnh lược đơn vị trọng lượng; công thức lễ vật lặp lại trong Dân Số Ký 7 cho thấy đây là trọng lượng. Bổ sung “nặng” và “siếc-lơ” để câu tiếng Việt rõ nghĩa.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Chỉ vật liệu làm nên chiếc đĩa; “bằng vàng” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Tính từ vị ngữ mô tả lượng chứa trong vật đựng; “đựng đầy” vừa tự nhiên vừa làm rõ quan hệ với chiếc đĩa.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm được dùng làm lễ vật. “Hương liệu” diễn đạt vật chất thơm dùng để đốt, không khiến người đọc hiểu đó chỉ là làn khói.
