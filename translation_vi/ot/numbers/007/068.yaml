  source_fidelity: 'Bản dịch truyền đạt đúng công thức Hê-bơ-rơ tỉnh lược: một vật đựng bằng vàng, trọng lượng mười siếc-lơ (được suy ra từ công thức lặp lại trong chương), chứa hương liệu. “Đĩa” là lựa chọn có thể chấp nhận cho כַּף trong bối cảnh nghi lễ.'
