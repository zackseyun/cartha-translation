  terminology: “Siếc-lơ” được dùng nhất quán như một đơn vị cổ và được chú thích đầy đủ. “Hương liệu” diễn đạt phù hợp קְטֹרֶת là chất hương dùng trong nghi lễ, không chỉ khói hương. Chú thích neo đúng tại “vàng”, phản ánh tính tỉnh lược của nguyên văn mà không khẳng định quá mức.
