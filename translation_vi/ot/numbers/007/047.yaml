source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: vi
  text: 'và về lễ tế bình an[a]: hai con bò, năm con cừu đực, năm con dê đực và năm con chiên một tuổi. Đó là lễ vật của Ê-li-a-sáp, con trai Đê-u-ên.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ tế hiệp thông” hoặc “lễ tế an lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: và để làm lễ vật hiệp thông
  rationale: Tiền tố וּלְ tiếp nối danh mục và chỉ mục đích; זֶבַח שְׁלָמִים là thuật ngữ tế lễ chỉ lễ vật gắn với sự bình an, toàn vẹn và mối thông công. “Lễ vật hiệp thông” tự nhiên trong tiếng Việt và không thu hẹp nghĩa vào cảm xúc bình an.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là danh từ tập hợp chỉ bò nuôi, không xác định giới tính trong câu này; “hai con bò” giữ đúng mức độ xác định của nguyên văn.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con cừu đực
  rationale: אֵילִם chỉ cừu đực trưởng thành; cách dịch này rõ ràng và phù hợp với danh mục tế lễ.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ rõ dê giống đực, nên cần bảo toàn sự phân biệt giới tính.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con một tuổi
  rationale: Cụm בְּנֵי שָׁנָה diễn tả tuổi của các chiên con; “một tuổi” là cách nói tự nhiên và chính xác.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: זֶה có tính chỉ định và קָרְבַּן là lễ vật được dâng. “Đó là” phù hợp với lời thuật kể tiếng Việt mà không làm thay đổi nội dung.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: Ê-li-a-sáp, con trai Đê-u-ên
  rationale: Phiên âm tên riêng theo âm dạng Hê-bơ-rơ và dịch trực tiếp cấu trúc phụ hệ בֶּן.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ שְׁלָמִים
  choice: lễ vật hiệp thông
  alternative: lễ vật bình an; lễ vật cầu an
  rationale: Thuật ngữ có trường nghĩa gồm bình an, toàn vẹn và thông công. Bản dịch chính dùng “hiệp thông”, đồng thời chú thích các cách hiểu hợp lệ khác để không giải quyết dứt khoát sự đa nghĩa của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; giữ nhịp liệt kê của nguyên văn. Dùng “chiên con” để phân biệt כְּבָשִׂים với אֵילִם (“cừu đực”), và không tự ý xác định giới tính của בָּקָר.
