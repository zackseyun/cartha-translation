translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp liệt kê của bản văn tế lễ. Dùng dạng phiên âm “siếc-lơ” để bảo tồn đơn vị cổ, với chú thích giải thích đây là chuẩn cân nơi thánh.
