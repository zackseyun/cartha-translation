  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc nặng bảy mươi siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh[b]; cả hai đều đựng đầy bột mì mịn trộn dầu để làm lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mâm bạc”; từ Hê-bơ-rơ chỉ một vật đựng nông bằng bạc dùng trong nơi thánh.
    reason: lexical_alternative
  - marker: b
    text: Hay “theo đơn vị cân của nơi thánh.” Cụm từ Hê-bơ-rơ nói đến chuẩn trọng lượng dùng tại nơi thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָנוֹ
  choice: Lễ vật của ông gồm
  rationale: קָרְבָן chỉ vật được dâng trong bối cảnh thờ phượng. “Lễ vật” rõ nghĩa và trang trọng; thêm “gồm” giúp chuỗi danh mục tiếng Hê-bơ-rơ tự nhiên trong tiếng Việt.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קַעֲרָה là một vật đựng tương đối nông trong danh mục dụng cụ nơi thánh; “đĩa bạc” phù hợp ngữ cảnh, còn “mâm bạc” cũng có thể hiểu được.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Diễn đạt trực tiếp trọng lượng của chiếc đĩa, tự nhiên hơn trong tiếng Việt mà vẫn giữ nguyên con số và đơn vị nguồn.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק chỉ vật đựng dùng trong nghi lễ; “chậu” phân biệt nó với chiếc đĩa nông vừa nêu và tránh sắc thái quá gia dụng của “tô”.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Cụm từ nêu trọng lượng của chậu; bổ sung “nặng” làm rõ quan hệ cú pháp vốn được lược trong chuỗi danh mục Hê-bơ-rơ.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Cụm này xác định chuẩn cân dùng tại nơi thánh. Cách dịch giữ hình ảnh đơn vị nguồn và tránh diễn giải quá mức thành một giá trị hiện đại.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Giữ rõ đại từ chỉ hai vật dụng, đồng thời dùng cách nói tự nhiên trong tiếng Việt cho tình trạng chứa đầy.
- source_word: סֹלֶת
  choice: bột mì mịn
  rationale: סֹלֶת là loại bột tinh dùng trong tế lễ. “Bột mì mịn” dễ hiểu và phù hợp thuật ngữ nghi lễ.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn dầu
  rationale: Phân từ bị động cho biết bột đã được trộn với dầu; tiếng Việt tự nhiên có thể nói gọn “bột mì mịn trộn dầu”.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong ngữ cảnh tế lễ của Ngũ Kinh, מִנְחָה chỉ lễ vật làm từ ngũ cốc; cách dịch cụ thể này giữ sự phân biệt với các loại lễ vật khác.
