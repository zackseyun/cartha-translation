  to: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc nặng bảy mươi siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh[b]; cả hai đều đựng đầy bột mì mịn trộn dầu để làm lễ vật ngũ cốc.
