  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông gồm có một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc nặng bảy mươi siếc-lơ, theo siếc-lơ của nơi thánh[b]; cả hai đều đựng đầy bột mịn đã trộn với dầu, dùng cho lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một bát bạc”; từ Hê-bơ-rơ קַעֲרָה chỉ một đồ đựng, nhưng hình dạng chính xác không hoàn toàn chắc chắn.
    reason: lexical_alternative
  - marker: b
    text: “Siếc-lơ của nơi thánh” là tiêu chuẩn cân dùng tại nơi thánh.
    reason: cultural_clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Lễ vật của ông
  rationale: קָרְבָּן chỉ vật được dâng lên trong bối cảnh tế lễ; “lễ vật” tự nhiên, trang trọng và giữ đúng nghĩa.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קַעֲרָה là một loại đồ đựng, có lẽ khá nông; “đĩa” phù hợp với khả năng này nhưng chú thích vẫn bảo lưu sự không chắc chắn về hình dạng.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Diễn đạt tự nhiên ý nguyên văn “trọng lượng của nó là một trăm ba mươi”.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק là đồ đựng dùng trong nghi lễ; “chậu” đủ rộng nghĩa và không áp đặt chức năng cụ thể.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Làm rõ đây là trọng lượng của chậu, phù hợp với cấu trúc của câu Hê-bơ-rơ.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ của nơi thánh
  rationale: Giữ công thức chỉ tiêu chuẩn cân đo thuộc nơi thánh mà không diễn giải quá mức.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Nêu rõ đại từ chỉ cả hai đồ đựng và chuyển tính từ vị ngữ sang cách nói tự nhiên trong tiếng Việt.
- source_word: סֹלֶת
  choice: bột lọc nhuyễn
  rationale: Chỉ loại bột mịn, tinh lọc dùng trong tế lễ; cách dịch này cụ thể và dễ hiểu hơn chỉ nói “bột mịn”.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn dầu
  rationale: Phản ánh phân từ bị động chỉ bột đã được hòa trộn với dầu, bằng lối nói gọn tự nhiên.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong văn mạch tế lễ của sách Dân Số, מִנְחָה là loại lễ vật chế biến từ ngũ cốc, không phải lễ vật nói chung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “siếc-lơ” để phiên âm đơn vị cổ, “nơi thánh” cho thuật ngữ phụng tự, đồng thời bảo lưu sự không chắc chắn về loại đồ đựng trong chú thích.
