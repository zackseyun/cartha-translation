base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của ông gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc[b] nặng bảy mươi siếc-lơ, theo đơn vị siếc-lơ của nơi thánh[c]; cả hai đều đựng đầy bột mì mịn trộn dầu để làm lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mâm bạc” (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bát bạc”; מִזְרָק là một vật đựng dùng trong nghi lễ.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hê-bơ-rơ: “theo siếc-lơ của nơi thánh”, tức theo chuẩn trọng lượng được dùng tại nơi thánh.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Lễ vật của ông gồm
  rationale: קָרְבָּן chỉ lễ vật được dâng trong bối cảnh thờ phượng. Thêm “gồm” diễn đạt tự nhiên mệnh đề không có động từ trong tiếng Hê-bơ-rơ và mở đầu danh sách các vật phẩm.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קַעֲרָה là vật đựng dạng đĩa hoặc mâm. “Đĩa bạc” ngắn gọn, tự nhiên; chú thích giữ lại khả năng dịch là “mâm”.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Chuyển cấu trúc sát nghĩa “trọng lượng của nó là...” thành cách nói tiếng Việt tự nhiên mà vẫn giữ đúng số đo.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק là vật đựng dùng trong nghi lễ, có thể là chậu hoặc bát. “Chậu” phân biệt hợp lý với chiếc đĩa trước đó mà không áp đặt công dụng rảy huyết.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Cụm từ nêu trọng lượng của chiếc chậu; dùng “nặng” làm rõ quan hệ đo lường vốn được lược trong tiếng Hê-bơ-rơ.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo đơn vị siếc-lơ của nơi thánh
  rationale: Công thức này chỉ chuẩn trọng lượng được dùng tại nơi thánh. “Theo đơn vị” truyền đạt chức năng đo lường rõ ràng, còn chú thích giải thích bối cảnh.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Giữ rõ đại từ chỉ cả hai vật đựng; “đựng đầy” tự nhiên hơn cách dịch cứng “đầy” trong tiếng Việt.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: bột mì mịn trộn dầu
  rationale: סֹלֶת là bột mịn dùng cho tế lễ; dạng bị động בְּלוּלָה cho biết bột đã được trộn với dầu.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong văn mạch tế lễ của Ngũ Kinh, מִנְחָה chỉ lễ vật làm từ ngũ cốc, nên cần giữ tính chuyên biệt thay vì chỉ nói chung là “lễ vật”.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “lễ vật”, “nơi thánh” và “lễ vật ngũ cốc” để giữ bối cảnh nghi lễ. Phiên âm “siếc-lơ” giúp độc giả phổ thông nhận biết đây là đơn vị trọng lượng cổ; cấu trúc câu được điều chỉnh để danh sách dài vẫn rõ ràng.
