source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: vi
  text: 'Còn về tế lễ bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con đực một tuổi. Đó là lễ vật của Nê-tha-nên, con trai Xu-a.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật hiệp thông” hoặc “lễ vật an lành”; đây là thuật ngữ Hê-bơ-rơ שְׁלָמִים.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: Còn về lễ vật hiệp thông
  rationale: Cụm giới từ tiếp nối danh sách các lễ vật. “Lễ vật hiệp thông” diễn đạt tự nhiên một loại tế lễ שְׁלָמִים, gợi ý sự hiệp thông mà không thu hẹp nghĩa vào một cách giải thích duy nhất.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là từ chỉ chung gia súc thuộc loài bò và không xác định giới tính; cách dịch này tránh thêm ý “bò đực”.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con chiên đực
  rationale: אֵילִם chỉ chiên đực trưởng thành; cách diễn đạt này rõ ràng trong tiếng Việt hiện đại.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתּוּדִים chỉ dê đực, nên cần giữ thông tin về giới tính.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con đực một tuổi
  rationale: כְּבָשִׂים ở đây là chiên con đực, còn בְּנֵי שָׁנָה xác định tuổi là một năm.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: Đây là công thức kết luận xác định lễ vật vừa liệt kê; “đó là” hợp với mạch kể tiếng Việt.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: Nê-tha-nên, con trai Xu-a
  rationale: Phiên âm tên riêng theo cách đọc gần với tiếng Hê-bơ-rơ và dịch rõ quan hệ phụ tử.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ tế lễ שְׁלָמִים
  choice: lễ vật hiệp thông
  alternative: lễ vật bình an; lễ vật cầu an
  rationale: Thuật ngữ có thể gắn với bình an, sự an lành hoặc mối hiệp thông. Bản dịch chính dùng cách gọi dễ hiểu trong ngữ cảnh tế lễ, còn chú thích bảo tồn các khả năng từ vựng khác mà không quyết định một cách giải nghĩa thần học duy nhất.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp với danh sách nghi lễ. Dùng các loại vật nuôi quen thuộc trong tiếng Việt hiện đại, giữ nguyên giới tính và độ tuổi khi nguyên văn nêu rõ; dấu chú thích [a] xuất hiện ngay sau thuật ngữ cần giải thích.
