  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: vi
  text: Ông trao bốn cỗ xe[a] và tám con bò cho con cháu Mê-ra-ri, tùy theo công việc phục vụ của họ, dưới sự giám sát của Y-tha-ma[b], con trai A-rôn, thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xe chở hàng”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “bởi tay Y-tha-ma”, một thành ngữ chỉ sự điều hành hoặc giám sát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: cỗ xe
  rationale: Danh từ עֲגָלָה chỉ phương tiện vận chuyển có bánh xe. “Cỗ xe” tự nhiên, trang trọng và phù hợp với việc chuyên chở các bộ phận của Đền Tạm.
- source_word: הַבָּקָר
  choice: bò
  rationale: בָּקָר có thể chỉ bò nói chung; trong ngữ cảnh này chúng được dùng để kéo xe. Tiếng Việt không cần suy diễn thêm giới tính hay tình trạng thiến của con vật.
- source_word: נָתַן
  choice: trao
  rationale: נָתַן có nghĩa cơ bản là “cho, trao”. “Trao” vừa giữ nghĩa trực tiếp vừa phù hợp với việc phân bổ chính thức trong ngữ cảnh.
- source_word: לִבְנֵי מְרָרִי
  choice: cho con cháu Mê-ra-ri
  rationale: Cụm này theo nghĩa đen là “cho các con trai của Mê-ra-ri”, nhưng ở đây chỉ dòng tộc Mê-ra-ri; “con cháu” diễn đạt rõ ý tập thể gia tộc trong tiếng Việt.
- source_word: כְּפִי עֲבֹדָתָם
  choice: tùy theo công việc phục vụ của họ
  rationale: כְּפִי là thành ngữ mang nghĩa “theo, tương ứng với”; עֲבֹדָה ở đây là phận sự phục vụ liên quan đến Đền Tạm. “Tùy theo” truyền đạt sự phân bổ phù hợp với nhiệm vụ.
- source_word: בְּיַד אִיתָמָר
  choice: dưới sự giám sát của Y-tha-ma
  rationale: Nghĩa đen là “bởi/dưới tay Y-tha-ma”, một thành ngữ hành chính chỉ sự quản lý hoặc giám sát. Cách dịch này rõ ràng trong tiếng Việt hiện đại.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Danh hiệu xác định A-rôn là thầy tế lễ; cách đặt đồng vị “A-rôn, thầy tế lễ” giữ đúng quan hệ cú pháp của tiếng Hê-bơ-rơ.
