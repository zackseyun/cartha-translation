  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: vi
  text: 'Ông dâng lễ vật của mình: một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ; một chậu bạc[b] nặng bảy mươi siếc-lơ, theo siếc-lơ của nơi thánh[c]; cả hai đều đầy bột mịn trộn với dầu, dùng cho lễ vật ngũ cốc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mâm bạc”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bát bạc”.
    reason: lexical_alternative
  - marker: c
    text: “Siếc-lơ của nơi thánh” là đơn vị cân theo tiêu chuẩn được dùng tại nơi thánh.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב אֶת קָרְבָּנוֹ
  choice: Ông dâng lễ vật của mình
  rationale: Động từ Hiphil của קרב trong văn cảnh nghi lễ có nghĩa đem đến hoặc trình dâng; “dâng” tự nhiên trong tiếng Việt và kết hợp rõ với קָרְבָּנוֹ, “lễ vật của mình”.
- source_word: קַעֲרַת כֶּסֶף
  choice: một đĩa bạc
  rationale: קַעֲרָה chỉ một vật chứa tương đối nông; “đĩa” phù hợp với danh mục đồ dùng nơi thánh, trong khi “mâm” cũng có thể hiểu được.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Diễn đạt tự nhiên mệnh đề cân nặng, với hậu tố giống cái quy chiếu về chiếc đĩa.
- source_word: מִזְרָק
  choice: chậu bạc
  rationale: Danh từ chỉ một vật chứa dùng trong nghi lễ; “chậu” giữ sắc thái một đồ đựng tương đối sâu, còn “bát” là khả năng từ vựng khác.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ nơi thánh
  rationale: Cụm từ nêu chuẩn cân dùng trong phạm vi thánh; cách dịch giữ hình ảnh nguyên ngữ và được giải thích bằng chú thích.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Nêu rõ hai vật chứa cùng có đầy thứ được kể tiếp theo, đúng với biểu thức số đôi/số nhiều của tiếng Hê-bơ-rơ.
- source_word: סֹלֶת
  choice: bột lọc
  rationale: Chỉ loại bột đã được tinh lọc dùng cho lễ vật; “bột lọc” vừa chính xác vừa trang trọng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn dầu
  rationale: Diễn đạt trực tiếp cách chuẩn bị bột, không thêm loại dầu mà câu này không nêu.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong văn cảnh tế lễ của sách Dân Số, מִנְחָה là lễ vật làm từ sản phẩm ngũ cốc chứ không phải lễ vật nói chung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp liệt kê như nguyên văn. Dùng “siếc-lơ” để phiên âm đơn vị cổ; các chú thích bảo tồn những khả năng từ vựng thật sự của tên gọi hai đồ đựng.
