  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/076.yaml
  text: one male goat for a sin offering;[a]
translation:
  language: vi
  text: một con dê đực làm lễ vật chuộc tội;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Trong ngữ cảnh tế lễ, từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật dùng để xử lý tội lỗi và tình trạng ô uế về nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ chỉ một con dê giống đực; cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ rõ loại vật hiến tế.
- source_word: אֶחָד
  choice: một
  rationale: Giữ nguyên số từ nhằm phản ánh lối liệt kê lặp lại, chính xác của Dân Số Ký 7.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật liên quan đến tội lỗi và việc thanh tẩy, chứ không chỉ khái niệm trừu tượng là 'tội'. 'Lễ vật chuộc tội' là cách gọi dễ hiểu và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch חַטָּאת trong ngữ cảnh tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Thuật ngữ Hê-bơ-rơ có thể nhấn mạnh tội lỗi hoặc tác dụng thanh tẩy của nghi lễ. Bản chính dùng cách gọi quen thuộc 'lễ vật chuộc tội', còn chú thích bảo lưu cách hiểu 'lễ vật thanh tẩy' để không xóa bỏ phạm vi ý nghĩa của nguyên ngữ.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và súc tích, phù hợp với cấu trúc liệt kê lễ vật. Dấu chú thích [a] được đặt ngay sau mệnh đề tương ứng.
