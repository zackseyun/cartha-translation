base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: vi
  text: Vào ngày thứ nhất, người dâng lễ vật của mình là Na-ha-sôn, con trai A-mi-na-đáp, thuộc bộ tộc Giu-đa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cho bộ tộc Giu-đa.” Giới từ Hê-bơ-rơ có thể diễn tả sự quy thuộc bộ tộc hoặc việc đại diện cho bộ tộc trong lần dâng lễ này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Trong ngày thứ nhất, ... là
  rationale: Cấu trúc וַיְהִי mở đầu lời thuật; tiếng Việt tự nhiên không cần dịch máy móc là “và đã xảy ra,” nhưng vẫn giữ diễn tiến của câu chuyện qua trạng ngữ thời gian.
- source_word: הַמַּקְרִיב
  choice: người dâng
  rationale: Phân từ Hiphil của קרב chỉ người đem lễ vật đến trình dâng. “Người dâng” tự nhiên, rõ nghĩa và phù hợp văn cảnh thờ phượng.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: trong ngày thứ nhất
  rationale: Diễn đạt trực tiếp cụm thời gian ביום הראשון, đồng thời phù hợp chuỗi ngày dâng lễ trong phân đoạn.
- source_word: אֶת קָרְבָּנוֹ
  choice: lễ vật của mình
  rationale: קָרְבָּן là lễ vật được đem đến dâng trong nghi lễ; “lễ vật” giữ sắc thái thờ phượng, còn đại từ phản thân diễn đạt hậu tố sở hữu ngôi ba tự nhiên trong tiếng Việt.
- source_word: נַחְשׁוֹן
  choice: Na-ha-sôn
  rationale: Phiên âm tên riêng Hê-bơ-rơ thành các âm tiết dễ đọc đối với độc giả Việt.
- source_word: בֶּן עַמִּינָדָב
  choice: con trai A-mi-na-đáp
  rationale: Dịch trực tiếp quan hệ phụ hệ, dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לְמַטֵּה יְהוּדָה
  choice: đại diện cho bộ tộc Giu-đa
  rationale: Tiền tố לְ có thể biểu thị sự quy thuộc hoặc đại diện; trong văn cảnh mỗi thủ lĩnh dâng lễ thay mặt bộ tộc mình, cách dịch này diễn đạt rõ chức năng mà không chỉ nói chung về nguồn gốc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dâng lễ vật” để giữ sắc thái nghi lễ; tên riêng được phiên âm theo lối đọc tiếng Việt. Chú thích bảo lưu độ mở của giới từ לְ trong cụm chỉ bộ tộc.
