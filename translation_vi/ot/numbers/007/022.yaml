  text: one male goat for a sin offering;
translation:
  language: vi
  text: một con dê đực làm lễ vật chuộc tội;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ chỉ một con dê giống đực trong ngữ cảnh tế lễ. “Con dê đực” tự nhiên trong tiếng Việt hiện đại và giữ rõ giới tính của con vật.
- source_word: אֶחָד
  choice: một
  rationale: Từ này nêu số lượng trong danh mục lễ vật; “một” giữ nguyên lối liệt kê của nguyên văn.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ một loại lễ vật được quy định, chứ không chỉ khái niệm trừu tượng về tội lỗi. “Làm” diễn đạt tự nhiên chức năng của con vật trong danh mục.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật vì tội lỗi
  rationale: Ngữ cảnh Dân Số 7 là danh mục các lễ vật dâng hiến, nên thuật ngữ này chỉ một loại lễ vật cụ thể. Cách dịch được chọn giữ chiều kích nghi lễ mà không thu hẹp thành ý niệm đạo đức chung chung.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ cấu trúc ngắn gọn của danh mục tế lễ. Không cần chú thích vì câu không có dị bản hay nét mơ hồ quan trọng cần trình bày.
