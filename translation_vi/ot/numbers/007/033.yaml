translation:
  language: vi
  text: một con bò đực thuộc đàn gia súc[a], một con chiên đực, một con chiên con đực một tuổi[b], làm của lễ thiêu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “một con bò đực, con của đàn bò”—một thành ngữ chỉ bò đực thuộc đàn gia súc, thường được hiểu là bò đực non.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “một con chiên con đực trong năm đầu đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: một con bò đực trong đàn
  rationale: פַּר chỉ bò đực, có thể là bò đực non; בֶּן בָּקָר theo nghĩa đen là “con của đàn bò” nhưng là cách nói xác định con vật thuộc đàn bò. Cách dịch này tự nhiên, tránh lặp ý mà vẫn giữ sắc thái của nguyên văn.
- source_word: אַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל là chiên đực trưởng thành và là thuật ngữ thông dụng trong danh mục tế lễ.
- source_word: כֶּבֶשׂ אֶחָד
  choice: một chiên con đực
  rationale: כֶּבֶשׂ chỉ chiên con và trong ngữ cảnh tế lễ là con đực; nêu rõ giới tính giúp giữ đúng quy cách lễ vật.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ có thể chỉ con vật một tuổi hoặc đang trong năm đầu đời; “một tuổi” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; “lễ thiêu” giữ thuật ngữ tế lễ rõ ràng và phù hợp cấu trúc liệt kê.
- source_word: אֶחָד
  choice: một
  rationale: Số từ được lặp lại để xác định số lượng từng con vật, vì vậy được dịch nhất quán là “một”.
