  source_fidelity: 'Bản dịch phản ánh đúng danh mục ba con vật và số lượng lặp lại trong tiếng Hê-bơ-rơ. Tuy nhiên, “để làm lễ thiêu” kém chính xác về quan hệ hiến tế của לְעֹלָה: con vật được dâng làm của lễ thiêu, không phải tự nó “làm lễ.”'
