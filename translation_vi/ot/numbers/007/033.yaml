  terminology: Giữ “bò đực,” “chiên đực,” “chiên con đực,” và “của lễ thiêu.” “Thuộc đàn gia súc” diễn đạt rõ idiom בֶּן־בָּקָר mà không tạo ấn tượng con vật chỉ ở vị trí địa lý “trong đàn.”
