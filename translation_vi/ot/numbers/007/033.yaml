translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp liệt kê của danh mục lễ vật. Dùng “chiên” theo ngôn ngữ Kinh Thánh tiếng Việt quen thuộc, đồng thời nêu rõ “đực” khi nguyên ngữ và ngữ cảnh tế lễ đòi hỏi.
