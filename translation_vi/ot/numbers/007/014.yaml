  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “một đĩa nhỏ bằng vàng, mười, đầy hương”; đơn vị “siếc-lơ” được hiểu theo công thức lễ vật lặp lại trong văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa nhỏ
  rationale: Trong ngữ cảnh lễ vật và vật dụng thánh, từ này chỉ một vật chứa nhỏ dùng để đựng hương liệu, không phải “lòng bàn tay”. “Đĩa nhỏ” tự nhiên và tránh gợi đến thìa ăn.
- source_word: אַחַת
  choice: một
  rationale: Số từ đơn giản, phù hợp với danh từ chỉ vật chứa.
- source_word: עֲשָׂרָה
  choice: nặng mười siếc-lơ
  rationale: Bản Hê-bơ-rơ chỉ ghi “mười”, nhưng công thức lễ vật lặp lại trong văn cảnh gần cho thấy đơn vị trọng lượng “siếc-lơ” được tỉnh lược. Thêm “nặng” và đơn vị này giúp câu tiếng Việt rõ nghĩa.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt tự nhiên chất liệu làm nên vật chứa.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Truyền đạt tự nhiên tính từ vị ngữ “đầy”, đồng thời nêu rõ quan hệ giữa vật chứa và vật được chứa.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm dùng trong nghi lễ thờ phượng; “hương liệu” phù hợp khi nói về thứ được đựng trong đĩa nhỏ.
