  rationale: Điều chỉnh duy nhất về nghĩa là thay “hương liệu” bằng “hương” để phản ánh chính xác hơn thuật ngữ nghi lễ קְטֹרֶת. Đồng thời thay “đựng đầy” bằng “đầy” cho tự nhiên và sát nguyên ngữ. Giữ nguyên “đĩa nhỏ”, “bằng vàng” và việc bổ sung “nặng mười siếc-lơ” có chú thích, vì các lựa chọn này phù hợp ngữ cảnh và truyền đạt rõ phần tỉnh lược của bản Hê-bơ-rơ.
