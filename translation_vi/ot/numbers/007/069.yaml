  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: vi
  text: một con bò đực thuộc đàn bò[a], một con chiên đực, một con chiên con đực[b] một tuổi, làm của lễ thiêu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “một con bò đực, con của đàn bò.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một con chiên con”; từ Hê-bơ-rơ ở đây thường được dùng để chỉ chiên con đực trong bối cảnh tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: một con bò đực trong đàn
  rationale: פַּר chỉ bò đực, thường là bò đực còn trẻ; בֶּן בָּקָר là cách nói phân loại, theo nghĩa đen là “con của đàn bò.” Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ ý con vật thuộc đàn gia súc.
- source_word: אַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל là từ thông dụng chỉ con đực trưởng thành thuộc loài chiên trong ngữ cảnh tế lễ.
- source_word: כֶּבֶשׂ אֶחָד
  choice: một con chiên con đực
  rationale: כֶּבֶשׂ chỉ chiên con và trong danh mục tế lễ này có thể hiểu cụ thể là con đực; bản dịch nêu rõ giới tính nhưng chú thích vẫn bảo lưu khả năng dịch khái quát hơn.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “con của năm nó,” diễn tả con vật được một tuổi hoặc đang trong năm đầu đời.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là của lễ được thiêu trọn; “lễ thiêu” là cách diễn đạt ngắn gọn, rõ nghĩa trong danh mục lễ vật.
- source_word: אֶחָד
  choice: một
  rationale: Số từ được lặp lại trước từng con vật; giữ “một” ở mỗi mục để bảo toàn cấu trúc liệt kê của nguyên văn.
