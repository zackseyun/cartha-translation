    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa
  rationale: Trong ngữ cảnh các lễ vật dâng tại Đền Tạm, từ này chỉ một vật đựng nhỏ dùng để chứa hương liệu; “đĩa” tự nhiên và phù hợp với danh mục đồ thờ phượng.
- source_word: אַחַת
  choice: một
  rationale: Số từ chỉ số lượng, được dịch trực tiếp là “một”.
- source_word: עֲשָׂרָה
  choice: mười
  rationale: Số từ đơn giản trong cụm diễn tả trọng lượng.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn tả chất liệu của chiếc đĩa; “bằng vàng” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: עֲשָׂרָה זָהָב
  choice: nặng mười siếc-lơ
  rationale: Bản Hê-bơ-rơ lược bỏ đơn vị trọng lượng, nhưng công thức lễ vật lặp lại trong Dân Số Ký 7 cho thấy đơn vị “siếc-lơ” được ngầm hiểu. Thêm “nặng” làm rõ quan hệ cú pháp trong tiếng Việt.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Tính từ vị ngữ chỉ chiếc đĩa đầy vật chứa; “đựng đầy” tự nhiên hơn cách dịch máy móc “đầy” trong câu liệt kê này.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm được dùng để đốt trong nghi lễ thờ phượng; “hương liệu” phân biệt chất liệu này với làn khói hương.
