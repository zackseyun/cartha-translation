  rationale: 'Đổi “hương liệu” thành “hương” để dịch chính xác thuật ngữ קְטֹרֶת trong ngữ cảnh nghi lễ. Điều chỉnh “đĩa bằng vàng ... đựng đầy” thành “đĩa vàng ... đầy” cho tự nhiên, súc tích, đồng thời vẫn giữ nguyên nghĩa: một vật chứa bằng vàng, trọng lượng mười siếc-lơ, chứa hương. Chú thích tiếp tục minh bạch rằng “siếc-lơ” là đơn vị được suy ra từ công thức lặp lại, không hiện diện rõ trong dòng Hê-bơ-rơ rút gọn này.'
  reviewer_model: gpt-5.6-terra
