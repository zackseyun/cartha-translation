  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ, “một đĩa vàng, mười vàng”; đơn vị cân “siếc-lơ” được ngầm hiểu theo công thức lễ vật trong các câu chung quanh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa
  rationale: Trong danh mục lễ vật tại Đền Tạm, từ này chỉ một vật đựng nhỏ chứ không phải lòng bàn tay. “Đĩa” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh đồ dùng nghi lễ.
- source_word: אַחַת
  choice: một
  rationale: Số từ đơn giản, phù hợp với danh từ giống cái כַּף trong tiếng Hê-bơ-rơ.
- source_word: עֲשָׂרָה זָהָב
  choice: nặng mười siếc-lơ
  rationale: Nguyên văn lược bỏ đơn vị cân và viết sát nghĩa là “mười [bằng] vàng”. Công thức lễ vật ở các câu chung quanh cho thấy đơn vị được ngầm hiểu là siếc-lơ; thêm “nặng” giúp câu tiếng Việt rõ nghĩa mà không biến trọng lượng thành số lượng vàng.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Diễn đạt tự nhiên trạng thái chiếc đĩa chứa đầy vật liệu được nêu sau đó.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm dùng để xông trong nghi lễ thờ phượng. “Hương liệu” giữ trọng tâm ở vật liệu thơm, không khiến người đọc hiểu đây chỉ là làn khói.
