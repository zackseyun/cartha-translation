  text: one male goat for a sin offering—[a]
translation:
  language: vi
  text: một con dê đực làm lễ vật chuộc tội—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một con dê đực làm lễ vật thanh tẩy.”'
    reason: Thuật ngữ חַטָּאת trong nghi lễ có thể được hiểu là lễ vật liên quan đến tội lỗi hoặc nhấn mạnh tác dụng thanh tẩy.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: con dê đực
  rationale: Cụm từ ghép này chỉ một con đực thuộc loài dê. “Con dê đực” là cách nói tự nhiên, hiện đại và giữ được sự xác định về giống của con vật dùng làm lễ vật.
- source_word: אֶחָד
  choice: một
  rationale: Dịch trực tiếp số từ, phù hợp với lối liệt kê và đếm các lễ vật trong Dân Số Ký 7.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật dâng liên quan đến tội lỗi, chứ không chỉ khái niệm trừu tượng “tội lỗi”. “Làm” diễn đạt tự nhiên chức năng của con vật trong danh mục lễ vật.
theological_decisions:
- issue: Cách gọi lễ חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: “Lễ vật chuộc tội” là cách gọi rõ ràng, quen thuộc trong tiếng Việt và phù hợp với ngữ cảnh. Tuy vậy, thuật ngữ Hê-bơ-rơ cũng có thể nhấn mạnh chức năng thanh tẩy; phương án ấy được giữ trong chú thích để không xóa bỏ sắc thái nghi lễ.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, giữ cấu trúc liệt kê của nguyên văn. Dấu gạch ngang cho thấy câu còn tiếp tục sang mục kế tiếp.
