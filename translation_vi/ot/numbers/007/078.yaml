source:
  edition: WLC
  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: vi
  text: Ngày thứ mười hai, người lãnh đạo của con cháu Nép-ta-li là A-hi-ra, con trai Ê-nan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר
  choice: Ngày thứ mười hai
  rationale: Cụm giới từ chỉ thời gian cùng số đếm được dùng theo nghĩa thứ tự; cách diễn đạt này tự nhiên trong tiếng Việt và giữ công thức thời gian của chương.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Trong bối cảnh bộ tộc, từ này chỉ người đứng đầu được công nhận; “người lãnh đạo” rõ nghĩa và không gợi nhầm tước vị hoàng gia.
- source_word: לִבְנֵי נַפְתָּלִי
  choice: của con cháu Nép-ta-li
  rationale: Giới từ לְ biểu thị quan hệ giữa người lãnh đạo và nhóm bộ tộc. בְּנֵי là cách gọi quy ước dành cho thành viên hoặc hậu duệ của một chi tộc; “con cháu” tự nhiên hơn “các con trai” trong tiếng Việt mà vẫn giữ quan hệ huyết thống-bộ tộc.
- source_word: אֲחִירַע
  choice: A-hi-ra
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc gần với nguyên ngữ và phù hợp lối ghi tên dễ đọc trong tiếng Việt.
- source_word: בֶּן עֵינָן
  choice: con trai Ê-nan
  rationale: Kết cấu phụ hệ Hê-bơ-rơ được chuyển trực tiếp, xác định A-hi-ra là con trai của Ê-nan.
theological_decisions:
- issue: Cách dịch danh xưng bộ tộc בְּנֵי
  choice: con cháu Nép-ta-li
  alternative: các con trai của Nép-ta-li
  rationale: Dù בְּנֵי có hình thức giống đực số nhiều, trong công thức bộ tộc từ này chỉ tập thể hậu duệ hoặc thành viên thuộc chi tộc. “Con cháu” giữ nghĩa dòng dõi và tránh khiến độc giả hiểu rằng câu chỉ nói đến các con trai trực tiếp của Nép-ta-li.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc ngắn gọn của câu Hê-bơ-rơ; dùng tên phiên âm Nép-ta-li, A-hi-ra và Ê-nan nhất quán theo lối tiếng Việt.
