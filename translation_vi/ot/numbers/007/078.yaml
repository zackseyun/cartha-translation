  source_fidelity: Bản dịch truyền đạt đúng công thức thời gian "vào ngày thứ mười hai," chức vị נָשִׂיא trong bối cảnh chi tộc, quan hệ với בני Nép-ta-li, cùng tên và phụ hệ của A-hi-ra. Câu đảo trật tự theo tiếng Việt (xác định người lãnh đạo là A-hi-ra) tương ứng chính xác với mệnh đề danh từ tiếng Hê-bơ-rơ.
