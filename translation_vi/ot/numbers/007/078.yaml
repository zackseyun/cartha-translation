  terminology: '"Người lãnh đạo" là lựa chọn thích hợp, tránh sắc thái quân chủ của "vương tử/hoàng tử" mà vẫn phản ánh נָשִׂיא. Các dạng tên Nép-ta-li, A-hi-ra và Ê-nan được phiên âm nhất quán. "Con trai Ê-nan" phản ánh trực tiếp בן עינן.'
