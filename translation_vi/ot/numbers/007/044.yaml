  text: một đĩa vàng, nặng mười siếc-lơ[a], đầy hương;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ sát nghĩa là “một đĩa vàng, mười vàng, đầy hương”; đơn vị “siếc-lơ” được bổ sung cho rõ theo công thức trọng lượng lặp lại trong chương này.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: đĩa
  rationale: Trong công thức liệt kê lễ vật lặp lại ở Dân Số 7, từ này chỉ một vật đựng nhỏ dùng để chứa hương liệu; “đĩa” tự nhiên và không quá chuyên biệt.
- source_word: אַחַת
  choice: một
  rationale: Số từ đơn giản, phù hợp với danh từ giống cái כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: bằng vàng, nặng mười siếc-lơ
  rationale: Nguyên văn rút gọn nêu số mười cùng vàng; trong công thức về trọng lượng của chương này, đơn vị siếc-lơ được hiểu ngầm. Bổ sung “nặng” và “siếc-lơ” giúp tiếng Việt rõ nghĩa mà vẫn ghi chú tính hàm ẩn của nguyên văn.
- source_word: מְלֵאָה
  choice: đựng đầy
  rationale: Diễn đạt tự nhiên trạng thái vật chứa đầy nội dung được nêu sau đó.
- source_word: קְטֹרֶת
  choice: hương liệu
  rationale: Chỉ chất thơm dùng trong nghi lễ; “hương liệu” tránh khiến người đọc hiểu đây chỉ là khói hương thay vì chất được đặt trong đĩa.
theological_decisions: []
