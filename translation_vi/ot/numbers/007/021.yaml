translation_notes:
  register: Văn phong trang trọng, sáng rõ, giữ nhịp liệt kê của luật tế lễ. Dùng “chiên” thay vì thuật ngữ địa phương; tránh lối dịch sát chữ khó hiểu như “con trai của đàn bò”.
