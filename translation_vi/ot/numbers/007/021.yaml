translation:
  language: vi
  text: một con bò đực trong đàn, một con chiên đực, một con chiên con đực một tuổi, làm của lễ thiêu;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: một con bò đực thuộc đàn bò
  rationale: פַּר là bò đực, còn בֶּן בָּקָר là thành ngữ chỉ con vật thuộc đàn bò. Cách dịch này giữ được cả loài vật, giới tính và sắc thái nguồn gốc trong đàn mà vẫn tự nhiên trong tiếng Việt.
- source_word: אֶחָד
  choice: một
  rationale: Lặp lại số từ “một” để bảo toàn cấu trúc liệt kê trang trọng của nguyên văn.
- source_word: אַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל chỉ chiên đực trưởng thành; “chiên đực” là cách gọi rõ ràng và phù hợp với danh mục tế lễ.
- source_word: כֶּבֶשׂ אֶחָד
  choice: một chiên con đực
  rationale: כֶּבֶשׂ chỉ chiên con và ở dạng giống đực; bản dịch nêu rõ giới tính theo hình thái và bối cảnh tế lễ.
- source_word: בֶּן שְׁנָתוֹ
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ nói về độ tuổi của con vật; “một tuổi” ngắn gọn, tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: לְעֹלָה
  choice: để làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; “lễ thiêu” là thuật ngữ ngắn gọn, dễ hiểu, còn “để làm” thể hiện tiền tố לְ trong ngữ cảnh danh sách lễ vật.
