  - severity: low
    issue: “Bò đực thuộc đàn bò” không tự nhiên và có tính lặp.
    rationale: בֶּן־בָּקָר là thành ngữ chỉ gia súc thuộc đàn bò; “trong đàn” diễn đạt ý này gọn và tự nhiên hơn trong tiếng Việt.
  revised_text: một con bò đực trong đàn, một con chiên đực, một con chiên con đực một tuổi, làm của lễ thiêu;
