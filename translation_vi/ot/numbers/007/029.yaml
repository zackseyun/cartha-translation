    issue: Thuật ngữ «sinh tế thù ân» cho הַשְּׁלָמִים
    rationale: «Thù ân» thường gợi ý việc đáp tạ ân huệ, gần với lễ tạ ơn hơn là toàn bộ trường nghĩa của שלמים. «Lễ tế bình an» là cách gọi trung tính, quen dùng và tương ứng trực tiếp hơn; các cách hiểu khác nên để trong chú thích.
  - severity: medium
    issue: Mỏ neo chú thích [a] đang đặt sau «hai con bò»
    rationale: Nội dung chú thích giải thích tên loại lễ tế, không phải «bò». Mỏ neo phải đặt ngay sau «lễ tế bình an» để người đọc không hiểu nhầm.
