  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: vi
  text: 'và về lễ tế bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con đực một tuổi. Đó là lễ vật của Ê-li-áp, con trai Hê-lôn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lễ tế thông công” hoặc “lễ tế phúc an.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים
  choice: và để dâng sinh tế thù ân
  rationale: Tiếp nối danh sách ở câu trước; “sinh tế” diễn đạt זֶבַח trong ngữ cảnh tế tự, còn “thù ân” là thuật ngữ tiếng Việt trang trọng, quen thuộc cho שְׁלָמִים, đồng thời giữ sắc thái hòa thuận, bình an và thông công của lễ này.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là danh từ tập hợp chỉ loài bò và tại đây không xác định giới tính; “hai con bò” tránh thêm ý “bò đực” không có trong nguyên văn.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con chiên đực
  rationale: אֵילִם chỉ chiên đực trưởng thành; cách dịch giữ rõ giới tính của con vật hiến tế.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ rõ dê giống đực.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con đực một tuổi
  rationale: כְּבָשִׂים trong danh mục hiến tế chỉ chiên con giống đực, còn בְּנֵי שָׁנָה là thành ngữ chỉ độ tuổi một năm.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: קָרְבַּן là vật được đem đến dâng; “lễ vật” tự nhiên và chính xác trong tiếng Việt. “Đó là” phản ánh cấu trúc chỉ định mang tính tổng kết của tiếng Hê-bơ-rơ mà không buộc chuyển sang quá khứ.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: Ê-li-áp, con trai Hê-lôn
  rationale: Phiên âm tên riêng theo âm Hê-bơ-rơ và diễn đạt quan hệ phụ tử rõ ràng, tự nhiên.
theological_decisions:
- issue: Ý nghĩa của הַשְּׁלָמִים
  choice: sinh tế thù ân
  alternative: sinh tế bình an; sinh tế thông công
  rationale: Thuật ngữ Hê-bơ-rơ có trường nghĩa liên quan đến bình an, phúc lành và bữa ăn thông công; bản dịch chính dùng thuật ngữ tế tự Việt ngữ quen thuộc, còn chú thích bảo tồn các khả năng diễn đạt khác mà không thu hẹp ý nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ nhịp liệt kê của nguyên văn. Thuật ngữ tế tự được dùng nhất quán, tên riêng được phiên âm có gạch nối. Dấu chú thích [a] được đặt ngay sau cụm danh mục mở đầu để giải thích loại sinh tế, thay vì gắn nhầm với “bò”.
