revisions:
- from: Lễ vật của người gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một chậu bạc[b] nặng bảy mươi siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh[c]; cả hai đều đựng đầy bột mì mịn trộn với dầu để làm lễ vật ngũ cốc.
  to: Lễ vật của người gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc[b] nặng bảy mươi siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh[c]; cả hai đều đầy bột mì mịn trộn với dầu, dùng làm lễ vật ngũ cốc.
  rationale: Sửa cách gọi vật dụng thứ hai thành “bát bạc” để phù hợp hơn với מִזְרָק trong tiếng Việt hiện đại, đồng thời chuyển “chậu” xuống chú thích như một khả năng thay thế. Điều chỉnh nhẹ mệnh đề cuối để tiếng Việt tự nhiên hơn, vẫn giữ nguyên ý rằng cả hai vật đều chứa bột mịn trộn dầu cho lễ vật ngũ cốc.
