  - severity: low
    issue: “cả hai đều đựng đầy”
    rationale: Cấu trúc này kém tự nhiên vì “đựng đầy” thường cần bổ ngữ hoặc chủ thể là người. “Cả hai đều đầy bột mì mịn...” phản ánh trực tiếp מְלֵאִים và trôi chảy hơn.
