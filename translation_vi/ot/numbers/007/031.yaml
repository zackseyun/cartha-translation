base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: vi
  text: Lễ vật của người gồm một đĩa bạc[a] nặng một trăm ba mươi siếc-lơ, một bát bạc[b] nặng bảy mươi siếc-lơ, theo tiêu chuẩn siếc-lơ của nơi thánh[c]; cả hai đều đầy bột mì mịn trộn với dầu, dùng làm lễ vật ngũ cốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mâm”; từ Hê-bơ-rơ קַעֲרָה chỉ một vật đựng dùng trong nghi lễ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “chậu”; từ Hê-bơ-rơ מִזְרָק chỉ một vật đựng gắn với việc tế lễ.
    reason: lexical_alternative
  - marker: c
    text: Tức là theo chuẩn trọng lượng được dùng tại nơi thánh.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Lễ vật của người gồm
  rationale: קָרְבָּן chỉ lễ vật được dâng trong nghi lễ. Cách diễn đạt này tự nhiên trong tiếng Việt và dẫn vào danh sách các vật dâng.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: một đĩa bạc
  rationale: קְעָרָה chỉ một vật đựng tương đối nông dùng trong nghi lễ; “đĩa” là cách gọi rõ và tự nhiên, còn khả năng dịch “mâm” được ghi ở chú thích.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: nặng một trăm ba mươi siếc-lơ
  rationale: Chuyển cấu trúc danh từ “trọng lượng của nó” thành cách nói tiếng Việt tự nhiên mà vẫn giữ nguyên số đo.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: một chậu bạc
  rationale: מִזְרָק là vật đựng gắn với việc tế lễ; “chậu” phân biệt nó với chiếc đĩa nông vừa nêu và tránh sắc thái quá gia dụng của “bát”.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: nặng bảy mươi siếc-lơ
  rationale: Cụm từ nêu trọng lượng của chiếc chậu; thêm “nặng” làm rõ quan hệ cú pháp trong tiếng Việt.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo tiêu chuẩn siếc-lơ của nơi thánh
  rationale: Công thức này nói đến chuẩn cân dùng tại nơi thánh, không hàm ý một loại tiền khác; “theo tiêu chuẩn” truyền đạt đúng chức năng đo lường.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: cả hai đều đựng đầy
  rationale: Giữ rõ đại từ chỉ hai vật đựng và diễn đạt trạng thái đầy bằng cấu trúc tự nhiên trong tiếng Việt.
- source_word: סֹלֶת
  choice: bột mì mịn
  rationale: סֹלֶת là loại bột mịn dùng cho lễ vật; “bột mì mịn” rõ nghĩa với độc giả hiện đại.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn với dầu
  rationale: Phân từ bị động mô tả bột đã được hòa trộn với dầu; cách dịch này ngắn gọn và chính xác.
- source_word: לְמִנְחָה
  choice: để làm lễ vật ngũ cốc
  rationale: Trong văn mạch tế lễ của Ngũ Kinh, מִנְחָה là lễ vật làm từ sản phẩm ngũ cốc, nên cần dịch cụ thể thay vì chỉ nói “lễ vật”.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ đơn vị cổ “siếc-lơ” bằng phiên âm quen dùng, đồng thời giải thích chức năng chuẩn cân của nơi thánh. Các dấu chú thích được đặt ngay sau từ hoặc cụm từ liên quan theo thứ tự [a], [b], [c].
