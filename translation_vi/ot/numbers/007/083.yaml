source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: vi
  text: 'Về lễ tế bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con đực một tuổi. Đó là lễ vật của A-hi-ra, con trai Ê-nan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ tế thông công” hoặc “lễ tế an lành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: Còn về sinh tế là lễ vật bình an
  rationale: Cụm này tiếp nối danh mục lễ vật; “sinh tế” thể hiện זֶבַח, còn “lễ vật bình an” dùng thuật ngữ tế tự quen thuộc cho שְׁלָמִים mà không thu hẹp sắc thái vào riêng sự thông công hay an lành.
- source_word: בָּקָר שְׁנַיִם
  choice: hai con bò
  rationale: בָּקָר là danh từ tập hợp chỉ bò; nguyên văn tại đây không xác định giới tính, nên không dịch cụ thể là bò đực.
- source_word: אֵילִם חֲמִשָּׁה
  choice: năm con chiên đực
  rationale: אֵילִים chỉ chiên đực trưởng thành; cách diễn đạt này chính xác và tự nhiên trong tiếng Việt hiện đại.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: năm con dê đực
  rationale: עַתֻּדִים chỉ rõ dê giống đực.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: năm con chiên con đực một tuổi
  rationale: Bản dịch giữ cả giống đực của כְּבָשִׂים trong ngữ cảnh này và tuổi được nêu bằng thành ngữ בְּנֵי שָׁנָה.
- source_word: זֶה קָרְבַּן
  choice: Đó là lễ vật của
  rationale: Đây là công thức kết luận nhận diện lễ vật trong trình thuật; “đó là” tự nhiên trong tiếng Việt và không cần chuyển sang quá khứ như tiếng Anh.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: A-hi-ra, con trai Ê-nan
  rationale: Tên riêng được phiên âm theo âm tiết để độc giả Việt dễ đọc; quan hệ phụ tử được diễn đạt rõ.
theological_decisions:
- issue: Sắc thái của thuật ngữ tế tự שְׁלָמִים
  choice: lễ vật bình an
  alternative: lễ vật thông công; lễ vật cầu an
  rationale: “Lễ vật bình an” duy trì thuật ngữ truyền thống và độ rộng nghĩa, trong khi chú thích ghi nhận các cách hiểu khả dĩ khác mà không áp đặt một cách giải thích thần học duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc liệt kê của nguyên văn. Dùng “sinh tế” để phân biệt זֶבַח với קָרְבָּן (“lễ vật”), đồng thời tránh bổ sung giới tính cho בָּקָר khi tiếng Hê-bơ-rơ không nêu.
