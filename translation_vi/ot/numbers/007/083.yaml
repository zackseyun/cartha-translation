  to: 'Về lễ tế bình an[a]: hai con bò, năm con chiên đực, năm con dê đực và năm con chiên con đực một tuổi. Đó là lễ vật của A-hi-ra, con trai Ê-nan.'
  rationale: Sửa cụm thuật ngữ tế tự đầu câu để phản ánh trực tiếp זֶבַח הַשְּׁלָמִים, cải thiện tính tự nhiên của tiếng Việt, và điều chỉnh chú thích để nêu các lựa chọn từ vựng mà không thêm sắc thái cầu xin. Các thành phần còn lại của bản dịch được giữ nguyên vì phù hợp với nguyên văn.
