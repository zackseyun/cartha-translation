  to: Nhưng đối với con cháu Kê-hát, ông không ban gì, vì công việc phục vụ các vật thánh[a] là trách nhiệm của họ; họ phải khiêng chúng trên vai.
  rationale: Bản sửa giữ nguyên nghĩa của nguyên văn và đối tượng ngầm hiểu từ ngữ cảnh, nhưng đặt chú thích đúng vào cụm từ được chú giải. Cách diễn đạt “là trách nhiệm của họ” phản ánh thành ngữ “ở trên họ” mà không sao chép cấu trúc Hê-bơ-rơ thiếu tự nhiên. Chú thích bảo lưu cách hiểu “nơi thánh” thay vì loại trừ nó.
