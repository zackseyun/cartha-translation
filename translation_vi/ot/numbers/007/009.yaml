language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: vi
  text: Nhưng đối với con cháu Kê-hát, ông không ban gì, vì công việc phục vụ các vật thánh[a] là trách nhiệm của họ; họ phải khiêng chúng trên vai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ cũng có thể được hiểu là “công việc nơi thánh.” Tuy nhiên, trong ngữ cảnh này, có lẽ cụ thể nói đến các vật thánh được giao cho người Kê-hát khiêng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: Nhưng ... cho con cháu Kê-hát
  rationale: Giới từ לְ đánh dấu đối tượng nhận; וְ mang sắc thái tương phản với việc phân phát cho các nhóm Lê-vi trước đó. “Con cháu Kê-hát” diễn đạt tự nhiên tên gọi của thị tộc trong tiếng Việt.
- source_word: לֹא נָתָן
  choice: ông không trao gì
  rationale: Động từ נתן bị phủ định và có tân ngữ được hiểu từ ngữ cảnh là xe cùng bò ở các câu trước. “Không trao gì” giữ sự hàm ẩn ấy mà vẫn tự nhiên.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do họ không được trao xe và bò.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: công việc liên quan đến các vật thánh
  rationale: עֲבֹדָה là công việc hay phận sự phục vụ; הַקֹּדֶשׁ trong ngữ cảnh nhiều khả năng chỉ các vật thánh mà người Kê-hát được giao vận chuyển. Cách dịch này làm rõ quan hệ mà không biến cụm từ thành một danh xưng thần học.
- source_word: עֲלֵיהֶם
  choice: họ phụ trách
  rationale: Thành ngữ theo nghĩa đen là công việc “ở trên họ”, tức trách nhiệm được đặt lên họ. “Phụ trách” chuyển tải nghĩa vụ tự nhiên trong tiếng Việt.
- source_word: בַּכָּתֵף
  choice: trên vai
  rationale: Nghĩa đen là “trên vai”; danh từ số ít có tính phân phối, chỉ mỗi người mang trên vai.
- source_word: יִשָּׂאוּ
  choice: họ phải khiêng những vật ấy
  rationale: Thể chưa hoàn thành trong ngữ cảnh biểu thị phận sự được quy định. “Phải khiêng” thể hiện nghĩa vụ; “những vật ấy” được bổ sung từ ngữ cảnh để chỉ các vật thánh, là tân ngữ bị tỉnh lược trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Đối tượng của עֲבֹדַת הַקֹּדֶשׁ và tân ngữ tỉnh lược của יִשָּׂאוּ
  choice: Hiểu chủ yếu là công việc vận chuyển các vật thánh
  alternative: Hiểu là công việc phục vụ nơi thánh nói chung
  rationale: Ngữ cảnh về việc người Kê-hát không nhận xe, cùng mệnh đề họ phải khiêng trên vai, nghiêng về các đồ vật thánh được giao cho họ; chú thích vẫn bảo lưu cách hiểu trang trọng và rộng hơn là “công việc nơi thánh”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con cháu” cho tên gọi thị tộc; “phụ trách” và “phải khiêng” diễn đạt tự nhiên nghĩa vụ hàm chứa trong các thành ngữ Hê-bơ-rơ, đồng thời chú thích giữ lại cách dịch sát cấu trúc nguyên văn.
