    issue: Ký hiệu chú thích đặt sai vị trí.
    rationale: Chú thích giải thích “công việc ... các vật thánh”/עֲבֹדַת הַקֹּדֶשׁ, không giải thích tên Kê-hát. Neo chú thích vào “Kê-hát” gây hiểu nhầm về đối tượng được chú giải.
  - severity: low
    issue: Bản văn chú thích thay thế chưa tự nhiên và chưa rõ quan hệ ngữ nghĩa.
    rationale: Cụm “công việc nơi thánh đặt trên họ” thiếu diễn đạt tự nhiên trong tiếng Việt. Nên nói rõ đây là một cách hiểu khác của cụm Hê-bơ-rơ, đồng thời không khẳng định quá mức một cách hiểu còn có tranh luận.
