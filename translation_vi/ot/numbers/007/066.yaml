  text: בַּ/יּוֹם֙ הָ/עֲשִׂירִ֔י נָשִׂ֖יא לִ/בְנֵ֣י דָ֑ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/066.yaml
  text: 'On the tenth day, the leader of the sons of Dan was Ahiezer son of Ammishaddai:'
translation:
  language: vi
  text: 'Ngày thứ mười, người lãnh đạo của con cháu Đan là A-hi-ê-xe, con trai A-mi-sa-đai:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: Ngày thứ mười
  rationale: Cụm giới từ chỉ thời gian được diễn đạt tự nhiên trong tiếng Việt; số thứ tự bổ nghĩa cho “ngày”.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Chỉ người đứng đầu được công nhận của chi phái; cách dịch này rõ nghĩa trong tiếng Việt hiện đại và tránh sắc thái hoàng gia có thể gây hiểu lầm của “vương tử”.
- source_word: לִבְנֵי דָן
  choice: của con cháu Đan
  rationale: Giữ hình ảnh gia tộc của בְּנֵי, đồng thời diễn đạt nhóm người thuộc dòng dõi/chi phái Đan một cách tự nhiên.
- source_word: אֲחִיעֶזֶר
  choice: A-hi-ê-xe
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ phụ hệ trong công thức tên gọi.
- source_word: עַמִּישַׁדָּי
  choice: A-mi-sa-đai
  rationale: Phiên âm tên riêng Hê-bơ-rơ thay vì dịch nghĩa.
