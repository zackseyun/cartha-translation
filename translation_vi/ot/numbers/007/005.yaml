base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: vi
  text: Hãy nhận các vật ấy từ họ để dùng vào công việc phục vụ tại Lều Hội Kiến; rồi hãy giao chúng cho người Lê-vi, tùy theo công việc phục vụ của mỗi người[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm này nói đến việc phân chia các vật phù hợp với nhiệm vụ phục vụ của từng người Lê-vi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: Hãy nhận những lễ vật ấy từ họ
  rationale: לקח có nghĩa cơ bản là lấy hoặc nhận. Trong ngữ cảnh các thủ lĩnh vừa dâng xe và bò, “nhận” tự nhiên hơn trong tiếng Việt; thêm “những lễ vật ấy” để làm rõ đại từ chỉ các vật đã được dâng mà không thay đổi đối tượng quy chiếu.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: và dùng vào công việc phục vụ
  rationale: 'Cấu trúc Hê-bơ-rơ diễn tả mục đích: các vật vô tri được dành để dùng cho công việc. Cách dịch này tránh khiến xe và bò có vẻ tự mình thực hiện sự phục vụ, đồng thời giữ sắc thái của עֲבֹדָה.'
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Danh xưng quen thuộc, trang trọng và súc tích cho nơi Đức Chúa Trời gặp dân Ngài trong hoang mạc.
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: rồi con hãy giao chúng cho người Lê-vi
  rationale: נתן thường là “trao/cho”; “giao” phù hợp ngữ cảnh phân phối các lễ vật để người Lê-vi sử dụng trong nhiệm vụ.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: tùy theo công việc phục vụ của mỗi người
  rationale: אִישׁ mang nghĩa phân phối “mỗi người”, còn כְּפִי là thành ngữ chỉ sự tương ứng với nhiệm vụ hay nhu cầu công việc. Cách dịch giữ nguyên sự quy chiếu số ít của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng tự nhiên trong tiếng Việt hiện đại. Dùng “con” vì Đức Chúa Trời đang phán trực tiếp với Môi-se; “Lều Hội Kiến” và “người Lê-vi” theo cách gọi Kinh Thánh phổ biến. Dấu chú thích [a] được đặt ngay sau đối tượng mà phần giải thích liên hệ.
