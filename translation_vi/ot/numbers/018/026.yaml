id: NUM.18.26
reference: Numbers 18:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: vi
  text: 'Hãy nói với người Lê-vi và bảo họ: Khi các ngươi nhận từ con cái Y-sơ-ra-ên phần mười mà Ta đã ban cho các ngươi từ họ làm phần thừa kế của các ngươi, thì các ngươi phải trích từ đó một phần dâng cho Đức Giê-hô-va[a], tức là một phần mười trong phần mười[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một phần dâng thuộc về Đức Giê-hô-va”. Theo truyền thống: “lễ vật dâng đưa lên cho Đức Giê-hô-va”.'
    reason: Bảo tồn sắc thái sở hữu hoặc đích nhận của cấu trúc תְּרוּמַת יְהוָה và nghĩa tế lễ của תְּרוּמָה.
  - marker: b
    text: Nghĩa là người Lê-vi phải dâng một phần mười của phần mười mà họ nhận được.
    reason: Giải thích ngắn gọn cách áp dụng cụm từ cô đọng “một phần mười trong phần mười”.
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Cách gọi tiêu chuẩn, tự nhiên trong tiếng Việt đối với những người thuộc chi phái Lê-vi.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: Hãy nói ... và bảo họ
  rationale: Giữ lại hai động từ trong công thức truyền lệnh của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: כִּי תִקְחוּ
  choice: Khi các ngươi nhận
  rationale: כִּי nêu hoàn cảnh áp dụng mệnh lệnh; 'khi' phù hợp hơn 'nếu'. Động từ 'nhận' diễn đạt tự nhiên việc người Lê-vi thu nhận phần mười từ dân.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Bảo tồn hình thức 'các con của Y-sơ-ra-ên' trong nguyên văn, đồng thời dùng cách diễn đạt trang trọng, quen thuộc trong tiếng Việt.
- source_word: הַמַּעֲשֵׂר
  choice: phần mười
  rationale: Diễn đạt rõ khoản một phần mười theo luật tế lễ, dễ hiểu hơn thuật ngữ Hán-Việt ít thông dụng.
- source_word: בְּנַחֲלַתְכֶם
  choice: làm phần thừa kế của các ngươi
  rationale: Thể hiện phần được Đức Chúa Trời chỉ định cho người Lê-vi thay cho sản nghiệp đất đai.
- source_word: וַהֲרֵמֹתֶם
  choice: các ngươi phải trích ... dâng
  rationale: Kết hợp ý tách riêng một phần với việc dâng phần ấy trong bối cảnh tế lễ; rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: תְּרוּמַת יְהוָה
  choice: một phần dâng cho Đức Giê-hô-va
  rationale: תְּרוּמָה là phần được tách riêng để dâng; cách dịch 'cho' bảo tồn khả năng hiểu phần ấy được dành cho YHWH mà không dùng thuật ngữ cổ khó hiểu.
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: một phần mười trong phần mười
  rationale: Giữ quan hệ phân xuất của מִן và làm rõ rằng người Lê-vi phải lấy một phần mười từ phần mười họ đã nhận.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Dùng dạng danh riêng đã quen thuộc và trang trọng trong truyền thống Kinh Thánh tiếng Việt, thay vì thay thế danh này bằng tước hiệu; không đồng nhất danh từ sở hữu với một giáo thuyết riêng.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc và hình thức giống đực của nguyên văn, dù cụm từ trong ngữ cảnh có thể chỉ toàn thể cộng đồng giao ước.
- issue: Quan hệ trong תְּרוּמַת יְהוָה
  choice: phần dâng cho Đức Giê-hô-va
  alternative: phần dâng của Đức Giê-hô-va
  rationale: Cấu trúc ghép có thể được hiểu là phần thuộc về Ngài hoặc phần dành dâng cho Ngài; bản chính dùng cách diễn đạt tự nhiên theo hướng đích nhận, còn chú thích bảo tồn khả năng kia.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng đại từ số nhiều “các ngươi” để phân biệt lời truyền cho tập thể người Lê-vi; giữ tên riêng Y-sơ-ra-ên và Đức Giê-hô-va theo dạng quen thuộc trong tiếng Việt.
