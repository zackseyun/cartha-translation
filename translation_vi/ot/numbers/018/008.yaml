  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của câu: Yahweh phán với A-rôn; sự nhấn mạnh ngôi thứ nhất; việc giao phó các lễ vật/vật thánh; phần của A-rôn gắn với sự xức dầu; và quy định lâu dài cho các con trai ông. Tuy nhiên, “Còn Ta, này, Ta” là lối calque chưa tự nhiên trong tiếng Việt hiện đại.'
  naturalness: Nên đổi “Còn Ta, này, Ta” thành “Còn Ta đây, Ta” để giữ lực nhấn của וַאֲנִי הִנֵּה mà vẫn tự nhiên trong văn phong trang trọng. “Con trai của con” cũng rõ ràng hơn “các con trai con”.
  terminology: Giữ Yahweh, A-rôn, “lễ vật dâng lên Ta,” “vật thánh,” và “sự xức dầu” là phù hợp. Chú thích về תְּרוּמָה, בְנֵי יִשְׂרָאֵל, và לְמָשְׁחָה bảo lưu các cách hiểu thay thế cần thiết, không áp đặt diễn giải giáo phái.
