  to: 'Yahweh phán với A-rôn: “Còn Ta đây, Ta đã giao cho con trách nhiệm trông coi các lễ vật dâng lên Ta[a], tức mọi vật thánh của con cái Israel[b]. Ta đã ban chúng cho con làm phần thuộc về con nhờ sự xức dầu[c], và ban cho các con trai của con như một quy định vĩnh viễn.”'
