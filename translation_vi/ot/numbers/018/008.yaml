  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: vi
  text: 'Yahweh phán với A-rôn: “Còn Ta đây, Ta đã giao cho con trách nhiệm trông coi các lễ vật dâng lên Ta[a], tức mọi vật thánh của con cái Israel[b]. Ta đã ban chúng cho con làm phần thuộc về con nhờ sự xức dầu[c], và ban cho các con trai của con như một quy định vĩnh viễn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “các lễ phẩm của Ta”; theo thuật ngữ nghi lễ sát chữ hơn: “các lễ vật giơ lên của Ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “các con trai của Israel”, cách gọi quen thuộc dành cho dân Israel trong giao ước.'
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch sát hơn là “để xức dầu” hoặc “làm phần xức dầu”; ở đây có lẽ chỉ phần thuộc về A-rôn do ông giữ chức vụ tư tế đã được xức dầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וַאֲנִי הִנֵּה
  choice: Còn Ta, này, Ta
  rationale: Giữ đại từ ngôi thứ nhất mang tính nhấn mạnh cùng từ gây chú ý הִנֵּה, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: מִשְׁמֶרֶת
  choice: trách nhiệm trông coi
  rationale: Diễn đạt cả ý trách nhiệm được giao lẫn việc gìn giữ, quản lý các lễ vật thánh.
- source_word: תְּרוּמֹתַי
  choice: các lễ vật dâng lên Ta
  rationale: Thể hiện những phần được biệt riêng và dâng cho Yahweh; tự nhiên hơn thuật ngữ kỹ thuật “lễ vật giơ lên” trong câu chính.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: tức mọi vật thánh của con cái Israel
  rationale: Hiểu לְכָל theo quan hệ giải thích với các lễ vật; “vật thánh” giữ độ rộng của קָדְשֵׁי, còn “con cái Israel” bảo lưu cách gọi dân giao ước.
- source_word: לְמָשְׁחָה
  choice: làm phần thuộc về con nhờ sự xức dầu
  rationale: Truyền đạt phần được cấp cho A-rôn gắn với địa vị tư tế được xức dầu, nhưng chú thích vẫn nêu cách hiểu sát hình thức hơn.
- source_word: לְחָק עוֹלָם
  choice: như một quy định vĩnh viễn
  rationale: Giữ sắc thái pháp quy của חָק và tính lâu dài của עוֹלָם bằng cách diễn đạt tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của לְמָשְׁחָה trong việc cấp phần cho A-rôn
  choice: làm phần thuộc về con nhờ sự xức dầu
  alternative: để xức dầu; làm phần xức dầu
  rationale: Trong bối cảnh này, các vật thánh được ban cho A-rôn vì chức vụ tư tế đã được xức dầu của ông; bản dịch không biến cụm từ thành một nghi lễ xức dầu mới, đồng thời chú thích bảo lưu khả năng diễn đạt khác.
- issue: Cách dịch בְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel; người Israel
  rationale: Giữ hình ảnh gia tộc và cách gọi dân giao ước của nguyên văn mà vẫn bao gồm toàn dân, không giới hạn vào nam giới.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại; dùng cách xưng hô thần linh “Ta–con”. Giữ danh Yahweh và các tên riêng theo dạng quen thuộc trong tiếng Việt; các thuật ngữ nghi lễ khó hiểu được diễn đạt dễ đọc trong câu chính và bảo lưu ở chú thích.
