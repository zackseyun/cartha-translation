revisions:
- from: 'Vì Ta đã ban cho người Lê-vi làm phần thừa hưởng khoản một phần mười của con cái Y-sơ-ra-ên, là phần họ dâng lên Đức Giê-hô-va làm lễ vật; vì thế, Ta đã phán về họ: “Giữa con cái Y-sơ-ra-ên, họ sẽ không được hưởng phần thừa kế.”'
  to: 'Vì Ta đã ban cho người Lê-vi phần mười của con cái Y-sơ-ra-ên làm cơ nghiệp, tức là phần họ dâng lên Đức Giê-hô-va làm lễ vật; vì thế, Ta đã phán với họ: “Giữa con cái Y-sơ-ra-ên, họ sẽ không được hưởng cơ nghiệp.”'
  rationale: Sửa “về họ” thành “với họ” để phản ánh đúng לָהֶם. Rút gọn “khoản một phần mười” thành “phần mười” và dùng nhất quán “cơ nghiệp” cho נַחֲלָה/יִנְחֲלוּ, giữ nguyên sự đối chiếu giữa phần mười được ban và việc không có cơ nghiệp giữa dân Y-sơ-ra-ên. Không cần chú thích vì bản văn không đòi hỏi giải quyết một bất định văn bản hay lịch sử.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:32:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng quan hệ chính: Đức Chúa Trời ban phần mười của dân Y-sơ-ra-ên cho người Lê-vi làm cơ nghiệp, bởi họ không có cơ nghiệp giữa dân Y-sơ-ra-ên. Tuy nhiên, לָהֶם trong אָמַרְתִּי לָהֶם nghĩa là “với/bảo họ,” không phải “về họ.”'
  naturalness: Câu văn trang trọng và dễ hiểu, nhưng “khoản một phần mười” và việc dùng hai cách diễn đạt khác nhau cho נַחֲלָה/יִנְחֲלוּ làm câu kém gọn và làm mờ sự lặp có chủ ý trong nguyên văn. “Phần mười” và “cơ nghiệp” tự nhiên, nhất quán trong văn cảnh Kinh Thánh hiện đại.
  terminology: “Người Lê-vi,” “con cái Y-sơ-ra-ên,” và “Đức Giê-hô-va” phù hợp với cách gọi Kinh Thánh tiếng Việt. Dùng nhất quán “cơ nghiệp” cho cả danh từ và động từ phản ánh liên kết từ vựng của nguyên văn mà không khẳng định cụ thể đó chỉ là đất đai.
  issues:
  - severity: high
    issue: “Ta đã phán về họ” dịch sai hướng của giới từ לָהֶם.
    rationale: Nguyên văn אָמַרְתִּי לָהֶם là “Ta đã nói/bảo họ” hoặc “Ta đã phán với họ.” Đại từ ngôi ba trong lời trích không đổi đối tượng được nói với; đó là nội dung lời phán về chính họ.
  - severity: low
    issue: Thuật ngữ cho מַעְשַׂר và נַחֲלָה không nhất quán, hơi nặng nề.
    rationale: “Khoản một phần mười” không cần thiết trong tiếng Việt, còn “phần thừa hưởng” rồi “phần thừa kế” che khuất sự lặp lại của cùng một gốc từ Hê-bơ-rơ.
