  text: כִּ֞י אֶת מַעְשַׂ֣ר בְּנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽ/יהוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַ/לְוִיִּ֖ם לְ/נַחֲלָ֑ה עַל כֵּן֙ אָמַ֣רְתִּי לָ/הֶ֔ם בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: vi
  text: 'Vì Ta đã ban cho người Lê-vi phần mười của con cái Y-sơ-ra-ên làm cơ nghiệp, tức là phần họ dâng lên Đức Giê-hô-va làm lễ vật; vì thế, Ta đã phán với họ: “Giữa con cái Y-sơ-ra-ên, họ sẽ không được hưởng cơ nghiệp.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: khoản một phần mười
  rationale: Diễn đạt rõ nghĩa khoản thu bằng một phần mười trong ngữ cảnh luật pháp, tự nhiên hơn lối phiên âm chuyên biệt.
- source_word: יָרִימוּ
  choice: dâng lên
  rationale: Giữ sắc thái hành động nâng lên/dâng lên trong nghi thức mà không tạo cách nói gượng trong tiếng Việt.
- source_word: תְּרוּמָה
  choice: lễ vật
  rationale: Chỉ phần được dành riêng và dâng cho Đức Giê-hô-va; cách gọi ngắn gọn, trang trọng và phù hợp ngữ cảnh thờ phượng.
- source_word: נַחֲלָה / יִנְחֲלוּ
  choice: phần thừa hưởng / được hưởng phần thừa kế
  rationale: Phản ánh trường nghĩa về tài sản hay phần đất được nhận làm gia nghiệp, đồng thời tránh lặp từ thiếu tự nhiên.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ cách gọi tập thể mang sắc thái Kinh Thánh và bám sát cấu trúc Hê-bơ-rơ.
- source_word: יהוה
  choice: Đức Giê-hô-va
  rationale: Dùng cách biểu thị danh riêng của Đức Chúa Trời quen thuộc trong truyền thống Kinh Thánh tiếng Việt, thay vì đồng nhất với tước hiệu chung.
theological_decisions:
- issue: Bản chất phần thừa hưởng của người Lê-vi
  choice: Khoản một phần mười được ban cho người Lê-vi làm phần thừa hưởng
  alternative: Người Lê-vi nhận một phần đất lãnh thổ như các chi phái khác
  rationale: Câu Hê-bơ-rơ đối chiếu trực tiếp khoản một phần mười với việc họ không nhận phần thừa kế giữa Y-sơ-ra-ên; bản dịch giữ nguyên sự đối chiếu này.
- issue: Chủ thể của mệnh đề אָמַרְתִּי לָהֶם
  choice: Ta đã phán về họ
  alternative: Ta đã phán với họ
  rationale: Giới từ ל có thể được hiểu là “với” hoặc “về/đối với”; chọn “về họ” vì lời trích tiếp theo dùng ngôi thứ ba số nhiều, nhưng không mở rộng thêm nội dung thần học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ lời phán ở ngôi thứ nhất và lời trích ở ngôi thứ ba như nguyên văn; dùng dấu chấm phẩy để làm rõ quan hệ nguyên nhân–kết quả.
