    rationale: Cụm עֲבֹדַת אֹהֶל מוֹעֵד là “công việc phục vụ của Lều Hội Kiến”, nói về nhiệm vụ thuộc Lều Hội Kiến, không chỉ địa điểm thực hiện.
  revised_text: Còn Ta đây, Ta đã nhận anh em các con, tức là người Lê-vi, từ giữa dân Y-sơ-ra-ên, ban cho các con làm một tặng vật, là những người được ban cho Yahweh để thi hành công việc phục vụ của Lều Hội Kiến.
