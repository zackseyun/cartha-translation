revisions:
- from: Còn Ta, này, Ta đã chọn anh em của các con là người Lê-vi từ giữa con dân Y-sơ-ra-ên. Họ được ban cho các con làm một món quà, được dâng cho Yahweh để thực hiện công việc phục vụ tại Lều Hội Kiến.
  to: Còn Ta đây, Ta đã nhận anh em các con, tức là người Lê-vi, từ giữa dân Y-sơ-ra-ên, ban cho các con làm một tặng vật, là những người được ban cho Yahweh để thi hành công việc phục vụ của Lều Hội Kiến.
  rationale: Bản sửa phục hồi nghĩa cơ bản của לקח, duy trì hai quan hệ “ban cho các con” và “được ban cho Yahweh”, đồng thời diễn đạt sát hơn cụm “công việc phục vụ của Lều Hội Kiến”. Không cần chú thích vì không có điểm mơ hồ văn bản hoặc từ vựng nào cần neo chú thích trong tiếng Việt.
