language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: vi
  text: Còn Ta đây, Ta đã nhận anh em các con, tức là người Lê-vi, từ giữa dân Y-sơ-ra-ên, ban cho các con làm một tặng vật, là những người được ban cho Yahweh để thi hành công việc phục vụ của Lều Hội Kiến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Còn Ta, này
  rationale: Giữ đại từ ngôi thứ nhất mang tính nhấn mạnh cùng sắc thái chỉ dẫn, long trọng của הִנֵּה; “Còn Ta” tự nhiên hơn trong tiếng Việt mà vẫn nối tiếp lời phán trước đó.
- source_word: לָקַחְתִּי
  choice: Ta đã chọn
  rationale: Động từ cơ bản có nghĩa là “lấy/đem”; trong ngữ cảnh Đức Chúa Trời tách người Lê-vi khỏi cộng đồng để giao nhiệm vụ, “đã chọn” truyền đạt tự nhiên hành động tiếp nhận và biệt riêng, không hàm ý họ tự nguyện đảm nhận.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: anh em của các con là người Lê-vi
  rationale: Giữ ngôn ngữ thân tộc của אֲחֵיכֶם và xác định người được nói đến là người Lê-vi; “anh em” ở đây chỉ bà con đồng bào, không nhất thiết là anh em ruột.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: từ giữa con dân Y-sơ-ra-ên
  rationale: “Con dân Y-sơ-ra-ên” là cách nói tiếng Việt trang trọng và bao quát cộng đồng giao ước, đồng thời phản ánh thành ngữ Hê-bơ-rơ “các con trai của Y-sơ-ra-ên” mà không gây hiểu nhầm là chỉ nam giới.
- source_word: מַתָּנָה נְתֻנִים
  choice: được ban cho các con làm một món quà
  rationale: Giữ sự lặp ý “quà/được ban” của nguyên văn trong một cấu trúc tiếng Việt tự nhiên, đồng thời thể hiện người Lê-vi được giao cho A-rôn và các con trai ông.
- source_word: לַיהוָה
  choice: được dâng cho Yahweh
  rationale: Dùng danh giao ước Yahweh theo chính văn; “được dâng cho” diễn đạt sự quy thuộc và biệt riêng cho Ngài trong ngữ cảnh phụng sự.
- source_word: לַעֲבֹד אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: để thực hiện công việc phục vụ tại Lều Hội Kiến
  rationale: Diễn đạt tự nhiên sự kết hợp cùng gốc עבד (“phục vụ/công việc phục vụ”); “tại” làm rõ phạm vi nhiệm vụ mà không thu hẹp nó thành việc bảo trì chiếc lều.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi giới tính của בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên
  rationale: Đây là thành ngữ chỉ cộng đồng Y-sơ-ra-ên, không chỉ riêng nam giới. “Con dân” giữ quan hệ dòng dõi và tính tập thể, đồng thời tránh tạo một giới hạn không có trong ngữ cảnh.
- issue: Quan hệ của người Lê-vi với Yahweh và giới tư tế
  choice: được ban cho các con làm một món quà, được dâng cho Yahweh
  alternative: được Yahweh ban cho các con
  rationale: 'Giữ cả hai quan hệ trong cú pháp Hê-bơ-rơ: người Lê-vi là món quà dành cho A-rôn và các con trai ông, đồng thời là những người được hiến dâng cho Yahweh; không hòa nhập hai mệnh đề thành một ý duy nhất.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta/các con” phù hợp lời Yahweh phán với A-rôn và các con trai ông trong ngữ cảnh. Dùng cách viết quen thuộc “người Lê-vi”, “Y-sơ-ra-ên” và thuật ngữ “Lều Hội Kiến”.
