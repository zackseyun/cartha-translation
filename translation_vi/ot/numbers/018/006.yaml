  terminology: Giữ nhất quán Yahweh, người Lê-vi, Y-sơ-ra-ên và Lều Hội Kiến. “Tặng vật” phù hợp văn phong trang trọng và bảo toàn trường nghĩa “quà tặng/được ban cho”.
