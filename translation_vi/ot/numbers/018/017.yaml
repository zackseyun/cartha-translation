revisions:
- from: Nhưng con đầu lòng của bò, con đầu lòng của chiên, hay con đầu lòng của dê thì ngươi không được chuộc; chúng là vật thánh. Ngươi phải rảy máu chúng trên bàn thờ và thiêu mỡ chúng làm lễ vật dâng bằng lửa[a], có hương thơm làm đẹp lòng Đức Giê-hô-va.
  to: Nhưng con đầu lòng của bò, con đầu lòng của chiên, hay con đầu lòng của dê thì ngươi không được chuộc lại chúng; chúng là những vật thánh. Ngươi phải rảy máu của chúng trên bàn thờ và thiêu mỡ của chúng làm lễ vật dâng bằng lửa[a], có mùi thơm đẹp lòng Đức Gia-vê.
  rationale: Bản sửa làm rõ đối tượng của lệnh cấm chuộc, cải thiện độ tự nhiên của các cụm sở hữu, và dùng dạng Việt hóa của Yahweh để nhất quán với quyết định dịch danh יהוה trong audit trail. Các hình ảnh và thuật ngữ tế tự của bản gốc vẫn được giữ nguyên; chú thích bảo lưu phương án từ vựng khác của אִשֶּׁה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:27:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của câu Hê-bơ-rơ: lệnh không chuộc con đầu lòng của ba loài vật, địa vị thánh, nghi thức rảy máu trên bàn thờ, thiêu mỡ, và công thức «mùi thơm đẹp lòng» dâng lên יהוה. Tuy nhiên, «ngươi không được chuộc» có thể bị hiểu là ngươi không được người khác chuộc, thay vì ngươi không được chuộc lại các con vật. Danh riêng «Đức Giê-hô-va» cũng không theo quyết định audit trail là Yahweh; «Đức Gia-vê» là dạng Việt hóa hiện đại, nhận diện rõ hơn danh יהוה.'
  naturalness: Văn phong nhìn chung trang trọng và tự nhiên. Cần thêm «lại chúng» để làm rõ tân ngữ của «chuộc», và dùng «máu của chúng», «mỡ của chúng» để lời văn trôi chảy hơn. «Mùi thơm đẹp lòng» là cách diễn đạt gọn, tự nhiên cho רֵיחַ נִיחֹחַ.
  terminology: «Vật thánh», «bàn thờ», «rảy», «thiêu», và «lễ vật dâng bằng lửa» phù hợp ngữ cảnh tế tự. Giữ chú thích nêu cách hiểu «lễ vật thực phẩm» là thích hợp, vì ý nghĩa gốc của אִשֶּׁה có tranh luận. «Đức Gia-vê» bảo toàn danh riêng יהוה mà không thay bằng tước hiệu.
  issues:
  - severity: medium
    issue: Cấu trúc «ngươi không được chuộc» mơ hồ về chủ thể/tân ngữ.
    rationale: 'Động từ פדה có các con đầu lòng làm tân ngữ: người được nói đến không được chuộc lại chúng. Thêm «lại chúng» bảo toàn nghĩa pháp lý-tế tự và tránh cách hiểu bị động trong tiếng Việt.'
  - severity: low
    issue: Danh «Đức Giê-hô-va» không khớp với audit trail chọn Yahweh.
    rationale: Bản Hê-bơ-rơ dùng trực tiếp יהוה. Dạng «Đức Gia-vê» là cách Việt hóa thông dụng của Yahweh và phản ánh quyết định nguồn tốt hơn.
  - severity: low
    issue: Các sở hữu từ trong «máu chúng», «mỡ chúng» hơi nén trong văn xuôi hiện đại.
    rationale: «Máu của chúng» và «mỡ của chúng» tự nhiên hơn mà không thay đổi nghĩa.
  revised_text: Nhưng con đầu lòng của bò, con đầu lòng của chiên, hay con đầu lòng của dê thì ngươi không được chuộc lại chúng; chúng là những vật thánh. Ngươi phải rảy máu của chúng trên bàn thờ và thiêu mỡ của chúng làm lễ vật dâng bằng lửa[a], có mùi thơm đẹp lòng Đức Gia-vê.
