source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Nhưng con đầu lòng của bò, con đầu lòng của chiên, hay con đầu lòng của dê thì ngươi không được chuộc lại chúng; chúng là những vật thánh. Ngươi phải rảy máu của chúng trên bàn thờ và thiêu mỡ của chúng làm lễ vật dâng bằng lửa[a], có mùi thơm đẹp lòng Đức Gia-vê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật thực phẩm.” Nghĩa gốc của thuật ngữ tế tự Hê-bơ-rơ này còn được tranh luận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Nhưng
  rationale: Đánh dấu ngoại lệ đối với quy định ngay trước đó, đồng thời tự nhiên trong tiếng Việt.
- source_word: בְּכוֹר
  choice: con đầu lòng
  rationale: Diễn đạt chính xác con vật sinh đầu tiên mang ý nghĩa tế tự trong ngữ cảnh.
- source_word: שׁוֹר
  choice: bò
  rationale: Chỉ loài bò theo nghĩa khái quát, không thu hẹp thành bò đực.
- source_word: כֶּשֶׂב
  choice: chiên
  rationale: Chỉ loài chiên trong danh sách các loài vật, phù hợp hơn cách thu hẹp thành chiên con.
- source_word: עֵז
  choice: dê
  rationale: Từ chỉ loài dê trong danh sách tế vật.
- source_word: לֹא תִפְדֶּה
  choice: ngươi không được chuộc
  rationale: Giữ nghĩa pháp lý-tế tự là không được thay thế hay trả giá chuộc; cấu trúc tiếng Việt thể hiện rõ lệnh cấm.
- source_word: קֹדֶשׁ הֵם
  choice: chúng là vật thánh
  rationale: Trong ngữ cảnh, đại từ nói đến các con vật đã được biệt riêng cho Đức Chúa Trời; 'vật thánh' tự nhiên và rõ hơn việc gọi con vật là 'thánh'.
- source_word: תִּזְרֹק
  choice: rảy
  rationale: Động từ chỉ hành động tế lễ hất/rảy máu lên bàn thờ; 'rảy' là thuật ngữ nghi lễ quen thuộc mà không gợi thao tác quá nhẹ như 'vẩy'.
- source_word: חֵלֶב
  choice: mỡ
  rationale: Chỉ phần mỡ tế lễ được dành để thiêu trên bàn thờ.
- source_word: תַּקְטִיר
  choice: thiêu
  rationale: Diễn tả việc đốt phần tế vật trên bàn thờ để khói bay lên.
- source_word: אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  rationale: Giữ liên hệ trực tiếp với lửa trong danh từ tế tự, tránh đưa ý 'thức ăn' vốn không hiện rõ trong hình thái từ.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm làm đẹp lòng
  rationale: Bảo toàn cả hình ảnh mùi hương lẫn ý nghĩa được Đức Chúa Trời vui nhận.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Dùng dạng danh riêng đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng tước hiệu 'CHÚA'; vẫn bảo toàn việc bản Hê-bơ-rơ nêu đích danh יהוה.
- issue: Thành ngữ tế tự אִשֶּׁה
  choice: lễ vật dâng bằng lửa
  alternative: lễ vật thực phẩm
  rationale: Gốc và cách dùng của từ có tranh luận; bản dịch chính giữ cách hiểu truyền thống gắn với lửa, còn chú thích nêu phương án khác để không che lấp tính không chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng, dễ đọc; dùng đại từ luật lệ 'ngươi' để giữ lời truyền trực tiếp trong văn mạch Dân Số. Thuật ngữ tế tự được diễn đạt nhất quán, tránh lối nói quá hàn lâm.
