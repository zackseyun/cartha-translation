revisions:
- from: Cũng vậy, các ngươi phải trích phần dâng lên Yahweh từ mọi khoản phần mười[a] mà các ngươi nhận từ con cái Israel; từ đó, các ngươi phải trao phần dâng lên Yahweh cho thầy tế lễ A-rôn.
  to: Cũng vậy, chính các ngươi phải trích riêng phần dâng cho Yahweh từ tất cả các phần mười mà các ngươi nhận từ con cái Israel[a]; rồi từ đó, các ngươi phải trao phần dâng cho Yahweh cho thầy tế lễ A-rôn.
  rationale: Bản sửa làm rõ sự nhấn mạnh hướng đến người nhận mệnh lệnh, dùng cách diễn đạt tự nhiên hơn cho nguồn của phần dâng, và thay ghi chú ít giá trị bằng ghi chú giải thích lựa chọn dịch cụm công thức “con cái Israel.” Trình tự và sự lặp lại của “phần dâng cho Yahweh” được giữ nguyên, cũng như A-rôn là người nhận.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:27:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng cấu trúc chính: người Lê-vi cũng phải trích một phần từ các phần mười họ nhận từ con cái Israel, rồi trao phần dâng của Yahweh cho A-rôn, thầy tế lễ. Tuy nhiên, “Cũng vậy” chưa biểu lộ rõ nét nhấn mạnh của גַּם אַתֶּם (“chính/các ngươi cũng”), và ghi chú hiện có về số nhiều của “phần mười” không phản ánh một lựa chọn từ vựng hữu ích như ghi chú đối chiếu tiếng Anh.'
  naturalness: “Từ mọi khoản phần mười” có thể hiểu được nhưng “từ tất cả các phần mười” tự nhiên và trực tiếp hơn trong văn phong quy định. “Chính các ngươi” đặt đầu câu giữ được sự nhấn mạnh mà vẫn trang trọng, hiện đại.
  terminology: Giữ “Yahweh,” “phần mười,” và “thầy tế lễ A-rôn.” “Phần dâng cho Yahweh” diễn đạt rõ תְּרוּמַת יְהוָה là phần được biệt riêng cho Yahweh, không thu hẹp nó thành một loại sinh tế. Giữ “con cái Israel” trong bản văn để phản ánh công thức בְּנֵי יִשְׂרָאֵל; chú thích nêu phương án Việt ngữ tự nhiên hơn.
