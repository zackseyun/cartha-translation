source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: vi
  text: Cũng vậy, chính các ngươi phải trích riêng phần dâng cho Yahweh từ tất cả các phần mười mà các ngươi nhận từ con cái Israel[a]; rồi từ đó, các ngươi phải trao phần dâng cho Yahweh cho thầy tế lễ A-rôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “người Israel.” Nguyên văn Hê-bơ-rơ là “con cái Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Cũng vậy
  rationale: Nối chỉ thị này với mệnh lệnh trước và diễn đạt sự tương ứng một cách tự nhiên trong tiếng Việt.
- source_word: תָּרִימוּ
  choice: phải trích ... dâng lên
  rationale: Hiphil của רום trong kết cấu với תְּרוּמָה nói đến việc lấy riêng một phần để dâng; cách dịch này vừa giữ ý tách phần vừa tự nhiên hơn lối dịch sát là 'nâng lên'.
- source_word: גַם אַתֶּם
  choice: các ngươi ... cũng
  rationale: Giữ sự nhấn mạnh rằng chính người Lê-vi cũng phải dâng một phần, tương ứng với dân Israel.
- source_word: תְּרוּמַת יְהוָה
  choice: phần dâng lên Yahweh
  rationale: תְּרוּמָה là phần được trích riêng và dâng hiến; 'phần dâng' không thu hẹp nghĩa thành một loại tế lễ cụ thể.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ sự phân biệt giữa danh giao ước và các tước hiệu.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: từ mọi khoản phần mười
  rationale: Giữ giới từ chỉ nguồn, dạng số nhiều và thuật ngữ quen thuộc 'phần mười'.
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mà các ngươi nhận từ con cái Israel
  rationale: Trong bối cảnh quy định phụng tự, לקח chỉ việc người Lê-vi nhận phần mười hợp lệ; 'con cái Israel' giữ thành ngữ giao ước của nguyên văn.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: từ đó, các ngươi phải trao
  rationale: 'Giữ rõ ý phân xuất: phần dâng cho Yahweh được lấy từ chính các khoản phần mười đã nhận.'
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: cho thầy tế lễ A-rôn
  rationale: Giới từ לְ đánh dấu người nhận; chức danh הַכֹּהֵן được dịch theo cách rõ ràng, phổ thông trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm; phiên âm 'Yahweh' bảo toàn chức năng của danh giao ước thay vì thay bằng tước hiệu.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel; người Israel
  rationale: Cụm tiếng Việt này giữ sắc thái công thức giao ước và quan hệ dòng dõi của thành ngữ Hê-bơ-rơ, đồng thời trong cách dùng tự nhiên có thể chỉ toàn thể cộng đồng.
- issue: Quan hệ giữa phần dâng cho Yahweh và việc trao cho A-rôn
  choice: 'giữ cả hai mệnh đề: dâng lên Yahweh rồi trao cho A-rôn'
  alternative: diễn giải phần này đơn thuần là phần dành cho A-rôn
  rationale: Nguyên văn cố ý gọi đó là 'phần dâng lên Yahweh' dù A-rôn là người nhận; bản dịch giữ nguyên sự căng thẳng thần học và pháp lễ này, không đồng nhất hay giải thích thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng 'các ngươi' để phản ánh lời phán ở ngôi thứ hai số nhiều và giữ sắc thái luật lệ; dùng 'phần dâng' nhất quán cho תְּרוּמָה, tránh hiểu hẹp là sinh tế.
