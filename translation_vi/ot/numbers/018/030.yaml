base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: vi
  text: 'Hãy nói với họ: ‘Khi các ngươi dâng phần tốt nhất[a] từ đó, thì phần ấy sẽ được kể là hoa lợi của sân đập lúa và hoa lợi của bồn ép nho cho người Lê-vi.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “phần béo của nó”; ở đây thành ngữ này chỉ phần tốt nhất của nông sản.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: Hãy nói với họ
  rationale: Diễn đạt tự nhiên mệnh lệnh trực tiếp ở ngôi thứ hai số ít dành cho Môi-se.
- source_word: בַּהֲרִימְכֶם
  choice: Khi các ngươi trích
  rationale: Động từ Hiphil của רום trong ngữ cảnh lễ vật chỉ việc lấy riêng và trình dâng một phần; “trích” làm rõ hành động lấy phần đóng góp từ tổng số mà không thêm thuật ngữ nghi lễ.
- source_word: חֶלְבּוֹ
  choice: phần tốt nhất
  rationale: Nghĩa đen là “phần béo của nó”, nhưng trong ngữ cảnh nông sản, từ này chỉ phần dồi dào hoặc hảo hạng nhất.
- source_word: מִמֶּנּוּ
  choice: từ đó
  rationale: Giữ đại từ hồi chỉ về số phần mười đang được bàn đến trong ngữ cảnh, không tự ý nêu rõ danh từ mà nguyên văn không lặp lại.
- source_word: וְנֶחְשַׁב
  choice: thì phần ấy sẽ được kể
  rationale: Giữ thể bị động và sắc thái pháp lý-kế toán của חשב; thêm “phần ấy” để câu tiếng Việt rõ chủ ngữ.
- source_word: לַלְוִיִּם
  choice: cho người Lê-vi
  rationale: Diễn đạt quan hệ lợi ích hoặc quy thuộc của giới từ לְ một cách tự nhiên trong tiếng Việt.
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: như hoa lợi từ sân đập lúa
  rationale: “Hoa lợi” chuyển tải תבואה là sản lượng thu được, còn “sân đập lúa” giữ hình ảnh nông nghiệp của גֹּרֶן.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: và hoa lợi từ bàn ép nho
  rationale: Giữ cấu trúc song song và dịch יֶקֶב theo cơ sở ép nho làm rượu trong bối cảnh nông nghiệp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ngươi” phân biệt lời truyền cho Môi-se ở số ít với nhóm người Lê-vi được ông nói với ở số nhiều; cách xưng hô này cũng giữ sắc thái chỉ thị của đoạn luật lệ.
