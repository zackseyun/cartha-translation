source:
  edition: WLC
  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: vi
  text: Tất cả phần tốt nhất của dầu[a], cùng tất cả phần tốt nhất của rượu mới và ngũ cốc—những hoa lợi đầu mùa của chúng mà họ dâng cho Đức Giê-hô-va—Ta đã ban cho con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen là “mỡ” của dầu, rượu mới và ngũ cốc; đây là thành ngữ chỉ phần dồi dào hoặc tốt nhất.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: phần tốt nhất
  rationale: Nghĩa đen là “mỡ”, nhưng khi nói về nông sản, từ này là thành ngữ chỉ phần dồi dào, quý hoặc tốt nhất.
- source_word: יִצְהָר
  choice: dầu
  rationale: Chỉ dầu mới ép, thông thường là dầu ô-liu; “dầu” tự nhiên và không thêm loại cây mà từ Hê-bơ-rơ không nói rõ.
- source_word: תִּירוֹשׁ
  choice: rượu mới
  rationale: Giữ sự phân biệt từ vựng với những từ Hê-bơ-rơ khác chỉ rượu nói chung và phù hợp với nông sản mới thu hoạch.
- source_word: דָגָן
  choice: ngũ cốc
  rationale: Đây là danh từ bao quát chỉ các loại hạt lương thực; “ngũ cốc” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: רֵאשִׁיתָם
  choice: những hoa lợi đầu mùa của chúng
  rationale: Trong bối cảnh lễ vật nông nghiệp, רֵאשִׁית chỉ phần đầu tiên của sản vật; cách dịch này thể hiện số nhiều quy chiếu về dầu, rượu mới và ngũ cốc.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: mà dân chúng dâng cho Đức Giê-hô-va
  rationale: Chủ ngữ số nhiều không được nêu đích danh; “dân chúng” làm rõ tự nhiên nhưng không thu hẹp vào một nhóm riêng. “Dâng” hợp ngữ cảnh lễ vật, còn Danh Thánh được chuyển tự là “Đức Giê-hô-va” theo cách gọi quen thuộc trong tiếng Việt.
- source_word: לְךָ נְתַתִּים
  choice: Ta đã ban cho con
  rationale: Thể hoàn thành diễn tả sự cấp ban đã được xác lập; đại từ số ít hướng đến A-rôn trong văn mạch. Tân ngữ đã xuất hiện ở đầu câu nên không cần lặp lại.
theological_decisions:
- issue: Cách thể hiện Danh Thánh יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA; Gia-vê
  rationale: Bản Hê-bơ-rơ ghi Danh riêng יהוה. Dùng một dạng chuyển tự quen thuộc giúp phân biệt Danh Thánh với tước hiệu “Chúa” mà không giải quyết các tranh luận về cách phát âm cổ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” vì Đức Chúa Trời đang phán trực tiếp với A-rôn trong văn mạch. Dấu gạch ngang giữ phần đồng vị giải thích về hoa lợi đầu mùa.
