  to: Tất cả phần tốt nhất của dầu[a], cùng tất cả phần tốt nhất của rượu mới và ngũ cốc—những hoa lợi đầu mùa của chúng mà họ dâng cho Đức Giê-hô-va—Ta đã ban cho con.
