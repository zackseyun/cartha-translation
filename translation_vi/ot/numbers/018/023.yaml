    rationale: Động từ «đảm nhiệm» đã hàm ý thực hiện nhiệm vụ; dùng «thực hiện công việc phục vụ» rõ ràng và tự nhiên hơn, vẫn giữ ý nghĩa cultic của עֲבֹדָה.
