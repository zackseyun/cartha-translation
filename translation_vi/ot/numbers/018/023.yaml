  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: vi
  text: Nhưng chính người Lê-vi phải thực hiện công việc phục vụ tại Lều Hội Kiến, và họ sẽ mang lấy tội lỗi của mình.[a] Đây là một quy định vĩnh viễn qua mọi thế hệ các ngươi. Giữa con cái Y-sơ-ra-ên,[b] họ sẽ không được hưởng phần cơ nghiệp nào.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mang lấy tội trạng của mình” hoặc “gánh chịu hậu quả do tội lỗi của mình.” Thành ngữ Hê-bơ-rơ có thể chỉ tội lỗi, tình trạng mắc tội, hoặc trách nhiệm và hậu quả gắn với tội.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “giữa dân Y-sơ-ra-ên.” Nguyên văn là “giữa các con trai của Y-sơ-ra-ên,” một cách gọi dân Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: c
    text: 'Theo sát nguyên văn: “họ sẽ không thừa hưởng một cơ nghiệp.” Phép lặp đồng căn trong tiếng Hê-bơ-rơ nhấn mạnh rằng người Lê-vi không được nhận phần cơ nghiệp của chi phái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: phải đảm nhiệm
  rationale: Trong văn cảnh luật lệ, dạng động từ này mang sắc thái quy định và nghĩa vụ; “phải đảm nhiệm” tự nhiên trong tiếng Việt và giữ lực bắt buộc.
- source_word: הַלֵּוִי הוּא
  choice: chính người Lê-vi
  rationale: Đại từ độc lập הוּא nhấn mạnh chủ thể; “chính” chuyển tải sự nhấn mạnh mà không hàm ý độc quyền quá mức.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: công việc phục vụ tại Lều Hội Kiến
  rationale: עֲבֹדָה chỉ phận sự phục vụ trong nghi lễ; cách dịch này vừa rõ nghĩa vừa giữ sắc thái phụng sự, còn אֹהֶל מוֹעֵד được dịch theo thuật ngữ Kinh Thánh quen thuộc.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: và họ sẽ mang lấy tội lỗi của mình
  rationale: Giữ hình ảnh của thành ngữ pháp lý-nghi lễ נשא עון, không thu hẹp nghĩa thành riêng sự mắc tội, hình phạt hay hậu quả.
- source_word: חֻקַּת עוֹלָם
  choice: quy định vĩnh viễn
  rationale: Diễn đạt một quy định có hiệu lực lâu dài trong trật tự giao ước của Y-sơ-ra-ên; “vĩnh viễn” giữ lực thời gian mạnh của עוֹלָם.
- source_word: לְדֹרֹתֵיכֶם
  choice: trải qua các thế hệ của các ngươi
  rationale: Thể hiện tính tiếp tục qua nhiều thế hệ và giữ ngôi thứ hai số nhiều của hậu tố Hê-bơ-rơ.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: giữa con cái Y-sơ-ra-ên
  rationale: “Giữa” chuyển tải בְּתוֹךְ trong quan hệ cộng đồng; “con cái Y-sơ-ra-ên” là cách diễn đạt tự nhiên, trang trọng cho thành ngữ dân tộc בְּנֵי יִשְׂרָאֵל.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: họ sẽ không được hưởng phần cơ nghiệp nào
  rationale: Tiếng Việt khó giữ nguyên phép lặp đồng căn mà không gượng ép; “hưởng phần cơ nghiệp” bảo toàn ý nghĩa về việc không nhận phần đất thừa kế của chi phái, còn chú thích nêu cấu trúc nguyên văn.
theological_decisions:
- issue: Trách nhiệm của người Lê-vi trong thành ngữ נשא עון
  choice: mang lấy tội lỗi của mình
  alternative: mang lấy tội trạng của mình; gánh chịu hậu quả do tội lỗi của mình
  rationale: Nguyên văn có thể nhấn mạnh tội lỗi, tình trạng mắc tội hoặc trách nhiệm và hậu quả gắn với tội. Giữ thành ngữ giúp bảo tồn độ căng thần học thay vì quyết định thay cho người đọc.
- issue: Bản chất lâu dài của חֻקַּת עוֹלָם
  choice: quy định vĩnh viễn
  alternative: quy định đời đời; quy định lâu dài
  rationale: Cách dịch giữ lực kéo dài của cụm từ trong khuôn khổ luật giao ước, nhưng không thêm lời giải thích giáo lý về phạm vi áp dụng ngoài điều văn.
- issue: Phần cơ nghiệp của người Lê-vi giữa Y-sơ-ra-ên
  choice: không được hưởng phần cơ nghiệp nào
  alternative: không được thừa hưởng một cơ nghiệp
  rationale: Câu được giữ như sự phủ nhận phần cơ nghiệp giữa các chi phái, không bổ sung ngay trong chính văn rằng đó cụ thể là đất đai, dù ngữ cảnh hướng đến phần đất được phân chia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Lều Hội Kiến,” “người Lê-vi” và “phần cơ nghiệp” để giữ sắc thái luật lệ-nghi lễ. Đại từ “các ngươi” bảo toàn ngôi thứ hai số nhiều trong lời quy định, dù trang trọng hơn khẩu ngữ hiện nay.
