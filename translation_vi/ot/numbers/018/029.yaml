  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: vi
  text: 'Từ mọi lễ vật của anh em, anh em phải dâng lên cho Yahweh toàn bộ phần dâng: phần thánh được trích ra từ mọi phần tốt nhất của các lễ vật ấy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phần tốt nhất” theo nghĩa đen là “mỡ”; trong ngữ cảnh lễ vật, từ này có thể chỉ phần béo, tốt nhất hoặc quý nhất. “Phần thánh” cũng có thể dịch là “phần được thánh hiến” hoặc “phần được biệt riêng làm thánh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: Từ mọi lễ vật anh em nhận được
  rationale: מִן + כֹּל chỉ nguồn mà phần dâng được lấy ra; מַתָּנָה là quà tặng/lễ vật. Thêm “nhận được” làm rõ theo ngữ cảnh rằng đây là các lễ vật dân chúng trao cho người Lê-vi, không đổi nội dung câu.
- source_word: תָּרִימוּ
  choice: anh em phải dâng
  rationale: Hiphil của רוּם theo nghĩa đen là “nâng lên”, nhưng trong ngữ cảnh tế tự là động từ kỹ thuật chỉ việc trích ra và dâng một phần. “Phải dâng” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ lực mệnh lệnh.
- source_word: אֵת כָּל תְּרוּמַת יְהוָה
  choice: mọi phần lễ dành cho Yahweh
  rationale: תְּרוּמָה là phần đóng góp được trích riêng để dâng. “Phần lễ dành cho” diễn đạt cả tính chất lễ vật lẫn sự thuộc về/được dâng cho Yahweh.
- source_word: מִכָּל חֶלְבּוֹ
  choice: từ tất cả phần tốt nhất của mỗi lễ vật
  rationale: חֵלֶב nghĩa đen là “mỡ”, nhưng ở đây mang nghĩa bóng là phần quý nhất, tốt nhất. Hậu tố số ít được hiểu theo nghĩa phân phối đối với từng lễ vật.
- source_word: אֶת מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: hãy dâng phần thánh lấy ra từ đó
  rationale: מִקְדָּשׁוֹ trong ngữ cảnh chỉ phần được biệt riêng làm thánh; מִמֶּנּוּ nhấn mạnh phần ấy được lấy từ chính lễ vật/phần tốt nhất vừa nói đến.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ trực tiếp dùng Danh Bốn Chữ; “Yahweh” giữ đây là danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ giữa “phần tốt nhất” và “phần thánh”
  choice: Giữ cả hai cách gọi mà không đồng nhất hoàn toàn bằng lời giải thích thêm
  alternative: Diễn giải rằng phần tốt nhất chính là phần thánh
  rationale: Cú pháp Hê-bơ-rơ đặt hai cụm gần nhau nhưng hàm nghĩa chính xác có thể là phần thánh được lấy từ phần tốt nhất; bản dịch không nên giải quyết quá mức sự căng thẳng này.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời truyền cho người Lê-vi. Tránh dịch sát “nâng lên” vì dễ gây hiểu nhầm trong tiếng Việt, nhưng giữ thuật ngữ tế tự qua “dâng” và “phần lễ”.
