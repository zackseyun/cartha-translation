base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: vi
  text: 'Còn đối với những con đầu lòng phải chuộc, từ khi được một tháng tuổi, ngươi phải chuộc theo mức ngươi định giá: năm siếc-lơ bạc, theo chuẩn siếc-lơ nơi thánh; siếc-lơ ấy bằng hai mươi ghê-ra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “nó là hai mươi ghê-ra.” Đại từ “nó” chỉ siếc-lơ nơi thánh, tức chuẩn trọng lượng vừa được nhắc đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: mỗi con đầu lòng phải chuộc
  rationale: Dạng phân từ bị động kèm hậu tố số ít có cú pháp khó và mang ý nghĩa chung trong quy định pháp lý. Dựa vào ngữ cảnh trực tiếp về con đầu lòng của người và thú vật, cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ phạm vi bao quát cả hai.
- source_word: מִבֶּן חֹדֶשׁ
  choice: từ một tháng tuổi trở lên
  rationale: Thành ngữ Hê-bơ-rơ chỉ ngưỡng tuổi bắt đầu từ khi tròn một tháng; thêm “trở lên” làm rõ ý của giới từ מִן trong tiếng Việt tự nhiên.
- source_word: תִּפְדֶּה
  choice: ngươi phải chuộc
  rationale: Thể chưa hoàn thành ngôi hai số ít trong văn bản luật diễn đạt nghĩa vụ. “Phải” truyền đạt rõ tính bắt buộc, còn “ngươi” giữ lời trực tiếp nói với thầy tế lễ.
- source_word: בְּעֶרְכְּךָ
  choice: theo giá ngươi định
  rationale: Danh từ ערך trong ngữ cảnh tế lễ và pháp lý chỉ mức giá được ấn định; cách dịch này giữ hậu tố ngôi hai số ít và dễ hiểu hơn lối nói nặng tính chuyên môn.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: năm siếc-lơ bạc
  rationale: Giữ đơn vị trọng lượng cổ và diễn đạt theo trật tự tự nhiên của tiếng Việt.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: tính theo siếc-lơ nơi thánh
  rationale: Cụm này xác định chuẩn trọng lượng dùng tại nơi thánh; “tính theo” diễn đạt đúng chức năng chuẩn định lượng.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: siếc-lơ ấy bằng hai mươi ghê-ra
  rationale: Đại từ Hê-bơ-rơ “nó” có tiền ngữ tự nhiên là siếc-lơ nơi thánh. Nêu lại “siếc-lơ ấy” tránh sự mơ hồ không tự nhiên trong tiếng Việt, trong khi chú thích ghi nhận hình thức sát chữ.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “ngươi” để giữ lời truyền trực tiếp ở ngôi hai số ít; dùng “con đầu lòng” theo nghĩa bao quát trong ngữ cảnh, có thể chỉ con của người hoặc con vật. Các đơn vị cổ “siếc-lơ” và “ghê-ra” được phiên âm thay vì quy đổi sang đơn vị hiện đại.
