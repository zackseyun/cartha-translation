revisions:
- from: 'Còn mỗi con đầu lòng phải chuộc, từ một tháng tuổi trở lên, ngươi phải chuộc theo giá ngươi định: năm siếc-lơ bạc, tính theo siếc-lơ nơi thánh; siếc-lơ ấy bằng hai mươi ghê-ra.[a]'
  to: 'Còn đối với những con đầu lòng phải chuộc, từ khi được một tháng tuổi, ngươi phải chuộc theo mức ngươi định giá: năm siếc-lơ bạc, theo chuẩn siếc-lơ nơi thánh; siếc-lơ ấy bằng hai mươi ghê-ra.[a]'
  rationale: Bản sửa loại bỏ lượng từ “mỗi” không được nêu rõ trong nguyên văn, giữ tính khái quát cần thiết của cụm cú pháp khó, và làm rõ sắc thái pháp lý của việc định giá. Các thuật ngữ và quy chiếu của đại từ cuối câu được bảo tồn; chú thích vẫn ghi nhận cách diễn đạt sát chữ.
