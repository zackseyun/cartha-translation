revisions:
- from: Mọi vật bị biệt hiến trong Israel sẽ thuộc về con.[a]
  to: Mọi vật đã bị hiến trọn trong Israel sẽ thuộc về con.[a]
  rationale: Sửa thuật ngữ chính văn từ “bị biệt hiến” thành “đã bị hiến trọn” để tiếng Việt tự nhiên hơn và phản ánh rõ hơn giá trị pháp lý–thờ phượng của חֵרֶם. Điều chỉnh phương án trong chú thích để không đưa ý “tận diệt” vào như nghĩa trực tiếp của câu, nhưng vẫn bảo lưu sắc thái này trong phần giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:27:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng lượng từ כָּל, phạm vi “trong Israel,” và sự ấn định pháp lý “sẽ thuộc về con” dành cho A-rôn. Tuy nhiên, “bị biệt hiến” kém tự nhiên khi mô tả một vật và chưa truyền đạt rõ sắc thái hiến trọn, không thể thu hồi, của חֵרֶם.
  naturalness: “Mọi vật đã bị hiến trọn” là cách diễn đạt hiện đại, tự nhiên hơn trong tiếng Việt, đồng thời vẫn giữ thuật ngữ ở mức đủ kỹ thuật cho ngữ cảnh luật lệ thờ phượng.
  terminology: Dùng “hiến trọn” cho חֵרֶם để biểu thị sự dâng hẳn cho Đức Chúa Trời mà không khẳng định trong chính văn rằng vật ấy phải bị hủy diệt. Chú thích bảo lưu cách hiểu “đặt dưới lệnh cấm” và giải thích rằng trong một số ngữ cảnh thuật ngữ này liên hệ đến sự hủy diệt.
