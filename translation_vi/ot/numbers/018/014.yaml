    rationale: “Biệt hiến” thường dùng tự nhiên hơn cho người hoặc hành động/quy chế hiến dâng; “đã bị hiến trọn” vừa tự nhiên vừa phản ánh tính không thể thu hồi của חֵרֶם tốt hơn.
  - severity: low
    issue: Chú thích dùng “lệnh tận diệt” như phương án thay thế quá diễn giải.
    rationale: Bản thân câu không nói đến việc hủy diệt. “Đặt dưới lệnh cấm” gần với nghĩa thay thế “under the ban” hơn; phần giải thích vẫn cần nêu rằng một số ngữ cảnh bao hàm sự hủy diệt.
