  text: כָּל חֵ֥רֶם בְּ/יִשְׂרָאֵ֖ל לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/014.yaml
  text: Every devoted thing in Israel shall be yours[a].
translation:
  language: vi
  text: Mọi vật đã bị hiến trọn trong Israel sẽ thuộc về con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Mọi vật bị đặt dưới lệnh cấm trong Israel.” Từ Hê-bơ-rơ חֵרֶם chỉ vật được hiến trọn, không thể thu hồi, cho Đức Chúa Trời; trong một số ngữ cảnh, thuật ngữ này chỉ vật bị dành cho sự hủy diệt.'
    reason: Nêu phương án từ vựng khác và bảo toàn phạm vi nghĩa của thuật ngữ Hê-bơ-rơ.
lexical_decisions:
- source_word: כָּל
  choice: Mọi
  rationale: Diễn đạt toàn bộ các sự vật thuộc phạm trù được nói đến, đồng thời kết hợp tự nhiên với danh từ số ít mang nghĩa khái quát “vật”.
- source_word: חֵרֶם
  choice: vật bị biệt hiến
  rationale: Giữ sắc thái pháp lý và thờ phượng của một vật được dâng hẳn, không thể thu hồi, cho Đức Chúa Trời, nhưng không mặc nhiên đưa ý hủy diệt vào chính văn.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Israel
  rationale: Giới từ בְּ chỉ phạm vi; cách dịch này trực tiếp và tự nhiên trong quy định liên quan đến cộng đồng Israel.
- source_word: לְךָ
  choice: thuộc về con
  rationale: Diễn đạt quyền sở hữu hoặc phần được chỉ định cho A-rôn; “con” phù hợp với lời Đức Chúa Trời trực tiếp phán với A-rôn trong ngữ cảnh.
- source_word: יִהְיֶה
  choice: sẽ thuộc về
  rationale: Thể chưa hoàn thành của היה ở đây nêu sự ấn định có hiệu lực pháp lý; “sẽ thuộc về” tự nhiên hơn lối dịch sát chữ “sẽ là của” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch thuật ngữ thờ phượng–pháp lý חֵרֶם
  choice: vật bị biệt hiến
  alternative: vật bị đặt dưới lệnh tận diệt
  rationale: חֵרֶם có thể chỉ vật được dâng hẳn, không thể thu hồi, cho Đức Chúa Trời và trong một số ngữ cảnh hàm ý bị hủy diệt. Câu này không tự nó xác định sự hủy diệt, nên chính văn giữ nghĩa rộng hơn, còn nghĩa mạnh hơn được ghi ở chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “biệt hiến” để giữ tính chất chuyên biệt của thuật ngữ mà vẫn kèm chú thích giải nghĩa; dùng “con” vì lời phán trong ngữ cảnh hướng trực tiếp đến A-rôn.
