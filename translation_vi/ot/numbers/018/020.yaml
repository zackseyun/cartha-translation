base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: vi
  text: 'Yahweh phán với A-rôn: “Con sẽ không được thừa hưởng đất của họ, cũng sẽ không có phần giữa họ. Ta là phần của con và là cơ nghiệp của con giữa con cháu Y-sơ-ra-ên.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: בְּאַרְצָם לֹא תִנְחָל
  choice: Con sẽ không được thừa hưởng đất đai của họ
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ ý về quyền thừa hưởng lãnh thổ của dân Y-sơ-ra-ên.
- source_word: חֵלֶק
  choice: phần
  rationale: Giữ cùng một từ trong mệnh đề phủ định và lời tự xưng của Yahweh, qua đó bảo toàn liên kết từ vựng và hình ảnh phần được phân chia.
- source_word: נַחֲלָתְךָ
  choice: cơ nghiệp của con
  rationale: “Cơ nghiệp” là cách diễn đạt trang trọng, quen thuộc trong văn cảnh Kinh Thánh về tài sản hoặc phần được thừa hưởng.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: giữa con cháu Y-sơ-ra-ên
  rationale: “Con cháu Y-sơ-ra-ên” vừa phản ánh thành ngữ thân tộc בְּנֵי יִשְׂרָאֵל, vừa tự nhiên và bao quát trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước; phiên âm “Yahweh” bảo tồn danh riêng thay vì đổi thành tước hiệu.
- issue: Quan hệ giữa Yahweh với phần đất thừa hưởng của A-rôn
  choice: Ta là phần và cơ nghiệp của con
  alternative: Ta ban phần và cơ nghiệp cho con
  rationale: 'Giữ nguyên phép đồng nhất mạnh trong tiếng Hê-bơ-rơ: chính Yahweh là phần và cơ nghiệp của A-rôn, không chỉ là Đấng ban chúng.'
- issue: Cách hiểu בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  alternative: các con trai Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Cụm từ là một danh xưng tập thể chỉ dân tộc; “con cháu” giữ sắc thái dòng dõi mà không thu hẹp đối tượng chỉ còn nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp đại từ “Ta–con” vì Yahweh trực tiếp phán với A-rôn; giữ nhịp song song của các thuật ngữ về thừa hưởng, phần và cơ nghiệp.
