revisions:
- from: 'Yahweh phán với A-rôn: “Con sẽ không được thừa hưởng đất đai của họ, cũng sẽ không có phần nào giữa họ. Ta là phần và cơ nghiệp của con giữa con cháu Y-sơ-ra-ên.”'
  to: 'Yahweh phán với A-rôn: “Con sẽ không được thừa hưởng đất của họ, cũng sẽ không có phần giữa họ. Ta là phần của con và là cơ nghiệp của con giữa con cháu Y-sơ-ra-ên.”'
  rationale: Hiệu đính nhẹ để sát số ít của “đất”, bảo toàn sự lặp lại của “phần” trong nguyên văn, và làm rõ rằng Yahweh là cả phần lẫn cơ nghiệp của A-rôn. Không thay đổi ý nghĩa hoặc mức độ trang trọng của bản dịch.
