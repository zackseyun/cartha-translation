source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: vi
  text: 'Đây là phần thuộc về con: phần dâng hiến trong các lễ vật của họ[a], cùng với mọi lễ vật được đưa qua đưa lại của con dân Y-sơ-ra-ên. Ta đã ban chúng cho con, cho các con trai và con gái của con ở với con, làm một quy định lâu dài. Bất cứ ai trong nhà con thanh sạch[b] đều được phép ăn phần đó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phần dâng lên”; từ Hê-bơ-rơ chỉ một phần được tách riêng để dùng vào mục đích thánh.
    reason: lexical_alternative
  - marker: b
    text: “Thanh sạch” ở đây nghĩa là thanh sạch theo nghi lễ, không chỉ là sạch sẽ về thể chất hay ngay thẳng về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: phần trích ra từ các lễ vật của họ
  rationale: תְּרוּמָה chỉ phần được tách riêng để dâng cho mục đích thánh; מַתָּנָם là “các lễ vật của họ”. Cách dịch này giữ quan hệ giữa hai danh từ và diễn đạt tự nhiên bằng tiếng Việt.
- source_word: תְּנוּפֹת
  choice: lễ vật đưa qua đưa lại
  rationale: Đây là thuật ngữ nghi lễ chỉ lễ vật được đưa qua đưa lại trước mặt Đức Chúa Trời. Cách dịch mô tả giúp độc giả hiện đại hiểu động tác nghi lễ mà không dùng thuật ngữ cổ khó hiểu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Y-sơ-ra-ên”, nhưng trong ngữ cảnh này là tên gọi tập thể của dân Y-sơ-ra-ên. “Con dân” vừa giữ sắc thái dòng dõi vừa tự nhiên trong tiếng Việt.
- source_word: נְתַתִּים
  choice: Ta đã ban những phần ấy
  rationale: Thể hoàn thành diễn tả sự cấp ban đã được xác lập và vẫn có hiệu lực. Bổ sung “những phần ấy” làm rõ đại từ số nhiều chỉ các phần lễ vật vừa nêu.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: cùng các con trai và con gái của con
  rationale: Giữ nguyên việc bản Hê-bơ-rơ nêu rõ cả con trai lẫn con gái, thay vì gộp thành “con cái”.
- source_word: לְחָק עוֹלָם
  choice: làm một quy định lâu dài
  rationale: חֹק là quy định cố định; עוֹלָם chỉ tính kéo dài bền vững trong trật tự giao ước. “Lâu dài” tự nhiên hơn “đời đời” trong văn cảnh luật định này mà không xác quyết quá mức về phạm vi thời gian.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: Bất cứ ai trong nhà con thanh sạch
  rationale: טָהוֹר trong luật tế lễ nói về tình trạng thanh sạch theo nghi lễ. “Trong nhà con” có thể bao hàm những người thuộc gia hộ của A-rôn.
- source_word: יֹאכַל אֹתוֹ
  choice: đều được phép ăn những phần ấy
  rationale: Động từ chưa hoàn thành ở đây biểu thị quyền được phép ăn, không chỉ là một dự báo tương lai hay mệnh lệnh. Đại từ số ít hình thái được diễn đạt theo đối tượng tập hợp là các phần lễ vật.
theological_decisions:
- issue: Ý nghĩa của tình trạng thanh sạch
  choice: Hiểu טָהוֹר là thanh sạch theo nghi lễ
  alternative: Trong sạch về đạo đức hoặc sạch sẽ về thể chất
  rationale: Văn cảnh luật tế lễ quy định người nào trong nhà A-rôn được ăn phần lễ vật thánh; vì vậy đây là phạm trù thanh sạch nghi lễ, không phải một nhận định chung về đạo đức.
- issue: Phạm vi thời gian của חָק עוֹלָם
  choice: quy định lâu dài
  alternative: quy định đời đời
  rationale: עוֹלָם có thể diễn tả thời gian kéo dài không xác định hoặc bền vững trong một trật tự đã thiết lập. “Lâu dài” giữ được sức nặng pháp lý mà không tự ý giải quyết câu hỏi thần học về thời hạn tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta–con” phù hợp lời Đức Chúa Trời phán với A-rôn. Giữ các thuật ngữ nghi lễ đủ chính xác nhưng diễn đạt theo lối tiếng Việt phổ thông; mọi ký hiệu chú thích đều có trong chính văn.
