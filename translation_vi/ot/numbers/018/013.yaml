  to: Mọi hoa lợi đầu mùa của mọi sản vật trong đất họ mà họ đem dâng cho Đức Giê-hô-va sẽ thuộc về con. Mọi người trong nhà con thanh sạch[a] đều được ăn hoa lợi ấy.
  rationale: Chỉnh sửa nhằm làm câu văn tự nhiên hơn và thay “được tinh sạch” bằng tính từ chỉ tình trạng “thanh sạch.” Bản sửa vẫn giữ tính khái quát của “mọi sản vật,” hành động đem dâng cho Đức Giê-hô-va, quyền sở hữu của A-rôn, và điều kiện thanh sạch theo nghi thức.
