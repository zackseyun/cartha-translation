source:
  edition: WLC
  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: vi
  text: Mọi hoa lợi đầu mùa của mọi sản vật trong đất họ mà họ đem dâng cho Đức Giê-hô-va sẽ thuộc về con. Mọi người trong nhà con thanh sạch[a] đều được ăn hoa lợi ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là thanh sạch theo nghi thức.
    reason: Làm rõ nghĩa nghi lễ của טָהוֹר trong bối cảnh quy định về phần lễ vật dành cho gia đình thầy tế lễ.
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: hoa lợi đầu mùa
  rationale: Chỉ phần sản vật đầu tiên của mùa thu hoạch được đem dâng; cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp bối cảnh tế lễ.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: của tất cả những gì trong đất của họ
  rationale: Giữ phạm vi khái quát và quan hệ địa điểm/xuất xứ của nguyên văn, không thu hẹp quá mức vào một loại nông sản cụ thể.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: mà họ đem dâng lên Đức Giê-hô-va
  rationale: יָבִיאוּ có nghĩa căn bản là 'đem đến'; thêm 'dâng' làm rõ hành động trong bối cảnh lễ nghi mà không thay đổi đối tượng là Đức Giê-hô-va.
- source_word: לַיהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước יהוה bằng dạng quen thuộc, trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: לְךָ יִהְיֶה
  choice: đều sẽ thuộc về con
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ việc phần lễ vật được giao cho A-rôn.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: bất cứ ai trong nhà con được tinh sạch
  rationale: כָּל mang nghĩa bao quát người đủ điều kiện; 'trong nhà con' giữ hình ảnh nguyên văn, còn 'được tinh sạch' phù hợp bối cảnh thanh sạch lễ nghi.
- source_word: יֹאכֲלֶנּוּ
  choice: đều có thể ăn hoa lợi ấy
  rationale: Dạng chưa hoàn thành ở đây biểu thị quyền được phép ăn; lặp 'hoa lợi ấy' giúp đại từ số ít trong tiếng Hê-bơ-rơ rõ nghĩa và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của טָהוֹר trong luật lệ dành cho thầy tế lễ
  choice: tinh sạch về mặt lễ nghi
  alternative: trong sạch về mặt đạo đức nói chung
  rationale: Bối cảnh Dân Số 18 bàn về quyền hưởng phần lễ vật và điều kiện thanh sạch của gia đình thầy tế lễ; vì vậy ý nghĩa lễ nghi là phù hợp nhất, nhưng chú thích giúp người đọc nhận rõ sắc thái này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'con' vì lời Đức Giê-hô-va trực tiếp phán với A-rôn trong ngữ cảnh; dùng 'nhà con' để giữ gần cấu trúc Hê-bơ-rơ nhưng vẫn mang nghĩa gia đình/hộ gia đình. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
