revisions:
- from: 'Rồi Yahweh phán với A-rôn: “Con, các con trai của con và gia tộc bên cha của con cùng với con sẽ mang lấy tội lỗi liên quan đến nơi thánh[a]; còn con và các con trai của con cùng với con sẽ mang lấy tội lỗi liên quan đến chức tư tế của các con[b].”'
  to: 'Rồi Yahweh phán với A-rôn: “Con, các con trai con và dòng họ bên cha con, cùng với con, sẽ gánh tội của nơi thánh[a]; còn con và các con trai con, cùng với con, sẽ gánh tội của chức tư tế các con[b].”'
  rationale: Bản sửa bỏ phần diễn giải “liên quan đến” khỏi câu chính để duy trì tính mở của נשא את עון, đồng thời giữ lời giải thích cần thiết trong chú thích. Cách diễn đạt về dòng họ được làm tự nhiên hơn, và cấu trúc song song cùng sự lặp lại “cùng với con” vẫn được bảo tồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:27:17Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc hai vế, các thành phần được giao trách nhiệm, và sự lặp lại của “cùng với con”. Tuy nhiên, việc thêm “liên quan đến” vào bản văn chính diễn giải rõ hơn quan hệ vốn được tiếng Hebrew để mở qua cấu trúc “gánh tội của ...”.
  naturalness: “Gia tộc bên cha của con” hiểu được nhưng hơi nặng. “Dòng họ bên cha con” tự nhiên hơn trong tiếng Việt hiện đại. “Gánh tội” là cách nói gọn, tự nhiên và phù hợp văn cảnh hơn “mang lấy tội lỗi”.
  terminology: Giữ Yahweh, A-rôn, nơi thánh và chức tư tế là phù hợp. “Tội” trong văn bản chính, cùng chú thích nêu “tội trạng” và “chịu trách nhiệm”, bảo toàn độ mơ hồ của עָוֹן mà không biến cụm này thành lời giải thích.
  issues:
  - severity: medium
    issue: Cụm “liên quan đến” xuất hiện trong cả hai vế của bản văn chính.
    rationale: Nguyên văn nói sát là “gánh tội của nơi thánh/chức tư tế của các con”; quan hệ trách nhiệm đối với các vi phạm liên quan là một khả năng ngữ nghĩa cần được giữ ở chú thích, không nên được chốt trong bản văn chính.
  - severity: low
    issue: “Gia tộc bên cha của con” hơi nặng và kém tự nhiên.
    rationale: “Dòng họ bên cha con” diễn đạt rõ ý בית אב là nhóm gia đình/dòng họ theo cha mà vẫn phù hợp tiếng Việt hiện đại.
