source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với A-rôn: “Con, các con trai con và dòng họ bên cha con, cùng với con, sẽ gánh tội của nơi thánh[a]; còn con và các con trai con, cùng với con, sẽ gánh tội của chức tư tế các con[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ gánh tội trạng của nơi thánh.” Thành ngữ Hebrew cũng có thể hàm ý chịu trách nhiệm về những vi phạm liên quan đến nơi thánh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ gánh tội trạng của chức tư tế các con.” Thành ngữ Hebrew cũng có thể hàm ý chịu trách nhiệm về những vi phạm liên quan đến chức vụ tư tế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng phiên âm quen dùng, thay vì thay bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Diễn đạt tự nhiên diễn tiến tự sự của waw-consecutive; “phán” phù hợp với lời Đức Chúa Trời.
- source_word: בֵית אָבִיךָ
  choice: gia tộc bên cha của con
  rationale: Thành ngữ chỉ đại gia đình hoặc dòng tộc theo phía cha, không phải một ngôi nhà vật chất; cách dịch này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אִתָּךְ
  choice: cùng với con
  rationale: Giữ ý đồng hành và sự lặp lại có chủ ý trong cả hai vế.
- source_word: תִּשְׂאוּ אֶת עֲוֺן
  choice: sẽ mang lấy tội lỗi liên quan đến
  rationale: Giữ hình ảnh “mang lấy” và độ rộng nghĩa của עָוֹן, đồng thời dùng “liên quan đến” để thể hiện mối liên hệ với nơi thánh hoặc chức tư tế mà không quyết định dứt khoát giữa tội lỗi, tội trạng và trách nhiệm.
- source_word: הַמִּקְדָּשׁ
  choice: nơi thánh
  rationale: Cách gọi tự nhiên, trang trọng cho khu vực hoặc cơ chế thánh thiêng được nói đến ở đây.
- source_word: כְּהֻנַּתְכֶם
  choice: chức tư tế của các con
  rationale: Diễn đạt chức vụ và phận sự tư tế thuộc về A-rôn cùng các con trai ông; đại từ số nhiều phản ánh hậu tố Hebrew.
theological_decisions:
- issue: Ý nghĩa của thành ngữ “mang lấy tội lỗi” trong bối cảnh tư tế
  choice: Giữ thành ngữ “mang lấy tội lỗi”, kèm cụm “liên quan đến” và chú thích về phạm vi nghĩa.
  alternative: “chịu tội trạng” hoặc “chịu trách nhiệm về mọi vi phạm”
  rationale: Hebrew có thể nhấn mạnh tội lỗi, tội trạng, hậu quả hoặc trách nhiệm đối với những vi phạm trong phạm vi thánh. Bản dịch không thu hẹp sự căng thẳng thần học ấy vào một cách giải thích duy nhất.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “con” trong lời Yahweh nói trực tiếp với A-rôn và “các con” cho hậu tố số nhiều. Tên A-rôn được viết theo dạng phiên âm thông dụng; cấu trúc song song của nguyên văn được bảo tồn.
