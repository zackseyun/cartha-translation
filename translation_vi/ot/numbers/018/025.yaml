  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/025.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức tường thuật lời Đức Chúa Trời được diễn đạt tự nhiên và trang trọng bằng “phán”; liên từ וַ đánh dấu bước tiếp theo trong mạch kể nhưng không nhất thiết phải dịch riêng trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho Danh Thánh YHWH, không thay bằng tước hiệu “CHÚA”.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, giới từ này chỉ người tiếp nhận lời nói và phù hợp với cách diễn đạt tự nhiên của tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức mở đầu lời trực tiếp, “rằng” tự nhiên hơn bản dịch hình thức “nói rằng” và tránh lặp với “phán”.
theological_decisions:
- issue: Cách chuyển dịch Danh Thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tetragrammaton. Bản dịch giữ đây là tên riêng thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt dễ nhận biết, trang trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và tự nhiên; giữ nguyên chức năng của công thức dẫn nhập lời phán. Không đặt chú thích vì bản văn chính không có dấu chú thích.
