  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: vi
  text: Họ phải đảm trách phận sự được giao cho con và phận sự đối với toàn bộ lều, nhưng không được đến gần các vật dụng thánh[a] hay bàn thờ, kẻo cả họ lẫn các ngươi đều phải chết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các vật dụng của nơi thánh” hoặc “các đồ vật thuộc thánh điện.”'
    reason: Cụm כְּלֵי הַקֹּדֶשׁ có thể chỉ các vật dụng mang tính thánh hoặc các vật dụng thuộc phạm vi thánh.
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “cả họ và các ngươi.”'
    reason: Ghi nhận hình thức trực tiếp của גַם הֵם גַם אַתֶּם và cho thấy lời cảnh báo bao gồm cả hai nhóm.
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: Họ phải chu toàn phận sự con giao
  rationale: Cụm שׁמר מִשְׁמֶרֶת nói đến việc trung thành thực hiện hoặc trông coi một trách nhiệm được giao. Cách dịch này tự nhiên trong tiếng Việt và giữ việc Đức Chúa Trời trực tiếp nói với A-rôn qua đại từ số ít.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: và phận sự liên quan đến toàn bộ Lều
  rationale: Lặp lại “phận sự” để phản ánh מִשְׁמֶרֶת; “toàn bộ” dịch כָּל. “Lều” giữ nghĩa trực tiếp của אֹהֶל trong ngữ cảnh Lều Hội Kiến, còn “liên quan đến” tránh hàm ý rằng chính cái lều có một phận sự.
- source_word: אַךְ
  choice: nhưng
  rationale: Diễn đạt tự nhiên sắc thái giới hạn hoặc ngoại lệ mở đầu lệnh cấm.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: đến gần các vật dụng thánh
  rationale: כְּלֵי chỉ các đồ vật, dụng cụ hoặc vật dụng; הַקֹּדֶשׁ có thể được hiểu là chỉ tính thánh hoặc phạm vi thánh. “Các vật dụng thánh” sát cấu trúc Hê-bơ-rơ và không thu hẹp thành riêng các bình chứa.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יִקְרָבוּ
  choice: hay bàn thờ, ... không được đến gần
  rationale: Trong câu phủ định tiếng Việt, “hay” kết nối tự nhiên hai đối tượng đều bị cấm đến gần; “đến gần” giữ nghĩa không gian của קרב.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: kẻo cả họ lẫn các con đều phải chết
  rationale: “Kẻo” diễn đạt hậu quả cần tránh của lệnh cấm; “cả... lẫn...” phản ánh trực tiếp גַם...גַם và cho thấy cả hai nhóm đều có thể chịu chết.
theological_decisions:
- issue: Người được nói trực tiếp và nhóm bị hạn chế
  choice: Đức Chúa Trời nói trực tiếp với A-rôn bằng đại từ số ít, còn “họ” là người Lê-vi có nhiệm vụ trợ giúp nhưng không được đến gần các vật thánh hay bàn thờ.
  alternative: Hiểu đại từ ngôi thứ hai theo nghĩa rộng là toàn thể các thầy tế lễ, không nhấn mạnh A-rôn là người trực tiếp được nói với.
  rationale: Hậu tố ngôi thứ hai giống đực số ít trong מִשְׁמַרְתְּךָ và ngữ cảnh trước đó xác định A-rôn là người nghe; bản dịch không xóa nhòa ranh giới trách nhiệm giữa thầy tế lễ và người Lê-vi.
- issue: Phạm vi của lời cảnh báo về cái chết
  choice: Cả người Lê-vi lẫn A-rôn và các thầy tế lễ liên hệ với ông đều có thể phải chết nếu ranh giới thánh bị vi phạm.
  alternative: Chỉ người Lê-vi phải chết.
  rationale: גַם הֵם גַּם אַתֶּם nêu rõ cả “họ” và “các con/các ngươi”; bản dịch giữ nguyên trách nhiệm chung mà không giải thích thêm nguyên nhân ngoài văn bản.
- issue: Quan hệ logic của וְלֹא יָמֻתוּ
  choice: 'Đọc như lời cảnh báo về hậu quả cần tránh: “kẻo ... phải chết.”'
  alternative: 'Dịch thuần liên hợp: “và họ sẽ không chết, cả họ lẫn các con.”'
  rationale: Trong mạch lệnh cấm, “kẻo” diễn đạt rõ và tự nhiên chức năng cảnh báo, đồng thời không làm nhẹ tính nghiêm trọng của hậu quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con/các con” theo lời Đức Chúa Trời nói với A-rôn và nhóm gắn với ông; viết hoa “Lều” để chỉ Lều Hội Kiến trong ngữ cảnh mà không thay từ אֹהֶל bằng một thuật ngữ dài hơn. Hai dấu chú thích [a], [b] đều xuất hiện ngay trong chính văn.
