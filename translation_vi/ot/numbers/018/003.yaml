revisions:
- from: Họ phải chu toàn phận sự con giao và phận sự liên quan đến toàn bộ Lều, nhưng không được đến gần các vật dụng thánh[a] hay bàn thờ, kẻo cả họ lẫn các con đều phải chết[b].
  to: Họ phải đảm trách phận sự được giao cho con và phận sự đối với toàn bộ lều, nhưng không được đến gần các vật dụng thánh[a] hay bàn thờ, kẻo cả họ lẫn các ngươi đều phải chết[b].
  rationale: Sửa lỗi diễn đạt ở mệnh đề đầu để phản ánh chính xác “phận sự được giao cho con.” Đồng thời đổi “các con” thành “các ngươi” ở cuối, vì nguyên văn dùng ngôi thứ hai số nhiều tại đây; cách này duy trì sự mơ hồ hợp lý về thành phần của nhóm được nói đến và tránh đồng nhất họ với con trai của A-rôn. Các phần còn lại, kể cả “kẻo,” phù hợp với chức năng cảnh báo của mệnh đề trong mạch văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:27:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: người Lê-vi thực hiện hai phận sự, bị cấm đến gần vật dụng thánh và bàn thờ, và lời cảnh báo bao gồm cả hai nhóm. Tuy nhiên, cụm “phận sự con giao” không diễn đạt được hậu tố “của con/được giao cho con” trong tiếng Việt. Bản sửa giữ phân biệt số ít ở “con” với số nhiều ở “các ngươi” của nguyên văn.'
  naturalness: “Phận sự con giao” không tự nhiên và có thể bị hiểu là phận sự do người nghe giao phó. “Phận sự được giao cho con” rõ ràng, trang trọng và tự nhiên hơn. “Cả họ lẫn các ngươi” cũng làm rõ sự chuyển từ lời xưng hô số ít sang số nhiều mà không thêm diễn giải.
  terminology: “Vật dụng thánh,” “bàn thờ,” và “phận sự” phù hợp ngữ cảnh nghi lễ và tiếng Việt hiện đại. Dùng “lều” theo nghĩa trực tiếp của אֹהֶל; “toàn bộ lều” biểu đạt כָּל הָאֹהֶל mà không áp đặt thuật ngữ “Lều Hội Kiến.”
  issues:
  - severity: medium
