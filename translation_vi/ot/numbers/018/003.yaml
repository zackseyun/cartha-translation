    rationale: מִשְׁמַרְתְּךָ nghĩa là “phận sự của con” hoặc “phận sự được giao cho con,” không phải “phận sự con giao.”
  - severity: low
    issue: Đại từ “các con” ở cuối không thể hiện rõ đối lập số ít/số nhiều giữa מִשְׁמַרְתְּךָ và אַתֶּם.
    rationale: Nguyên văn chuyển từ “con” số ít khi nói với A-rôn sang “các ngươi” số nhiều trong lời cảnh báo. “Các ngươi” giữ được sự chuyển số này, đồng thời không xác định quá mức thành “các con [của A-rôn].”
