revisions:
- from: Họ sẽ gắn bó với con và đảm nhiệm phận sự tại Lều Hội Kiến, tức mọi công việc phục vụ trong Lều; nhưng không một người ngoài phận sự nào[a] được đến gần các con.
  to: Họ sẽ gắn bó với con và đảm trách nhiệm vụ tại Lều Hội Kiến, để lo mọi công việc phục vụ của Lều; nhưng không một người không được phép nào[a] được đến gần các con.
  rationale: Bản sửa thay «tức» bằng «để lo», nhờ đó giữ được mối liên hệ chức năng giữa nhiệm vụ tại Lều Hội Kiến và toàn bộ công việc phục vụ của Lều mà không đồng nhất hai cụm. Đồng thời, «người không được phép» diễn đạt rõ ý nghĩa theo ngữ cảnh của זָר; chú thích giữ cách nói «người ngoài phận sự» và làm rõ rằng đây không phải thuật ngữ về sắc tộc.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:27:20Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch bảo tồn tốt trình tự số ít «con» (A-rôn) rồi số nhiều «các con», và hiểu đúng זָר là người không được quyền tiếp cận trong bối cảnh thánh vụ, không phải phân loại sắc tộc. Tuy nhiên, «tức» biến quan hệ «giữ/đảm trách phận sự của Lều Hội Kiến» và «cho mọi công việc phục vụ của Lều» thành quan hệ giải thích đồng nhất; nguyên văn không nói hai vế là đồng nghĩa.
  naturalness: «Gắn bó với con» và «các con» phù hợp văn phong Kinh Thánh hiện đại. Cụm «đảm nhiệm phận sự tại Lều Hội Kiến, tức mọi công việc...» vừa hơi gượng vừa không phản ánh rõ hai bình diện trách nhiệm trong tiếng Hê-bơ-rơ. «Đảm trách nhiệm vụ ... để lo mọi công việc phục vụ...» tự nhiên và rõ hơn.
  terminology: «Lều Hội Kiến» là thuật ngữ nhất quán, phù hợp. Nên dùng «người không được phép» trong thân bài để diễn đạt trực tiếp sắc thái quyền hạn của זָר; chú thích có thể nêu «người ngoài phận sự» như cách hiểu thay thế. «Đến gần» giữ được nghĩa cultic của קרב.
  issues:
  - severity: medium
    issue: «tức» áp đặt quan hệ giải thích giữa hai cụm trách nhiệm
    rationale: 'לְכָל עֲבֹדַת הָאֹהֶל diễn tả phạm vi/mục đích: họ giữ trách nhiệm của Lều Hội Kiến cho mọi công việc phục vụ của Lều. Nó không xác định «phận sự tại Lều Hội Kiến» là đồng nghĩa với «mọi công việc phục vụ trong Lều».'
  - severity: low
