  text: וְ/נִלְו֣וּ עָלֶ֔י/ךָ וְ/שָֽׁמְר֗וּ אֶת מִשְׁמֶ֨רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְ/כֹ֖ל עֲבֹדַ֣ת הָ/אֹ֑הֶל וְ/זָ֖ר לֹא יִקְרַ֥ב אֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: vi
  text: Họ sẽ gắn bó với con và đảm trách nhiệm vụ tại Lều Hội Kiến, để lo mọi công việc phục vụ của Lều; nhưng không một người không được phép nào[a] được đến gần các con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người ngoài phận sự”. Từ Hê-bơ-rơ זָר ở đây chỉ người không được phép phục vụ hoặc đến gần nơi thánh, chứ không nhất thiết là người ngoại quốc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: Họ sẽ gắn bó với con
  rationale: Động từ Nifal của לוה cùng giới từ על diễn tả việc người Lê-vi liên kết với A-rôn để hỗ trợ trong chức vụ. “Gắn bó với con” tự nhiên trong tiếng Việt và giữ được sắc thái quan hệ lẫn chức năng.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: và đảm nhiệm phận sự
  rationale: Cụm שׁמר את־משׁמרת trong văn cảnh tư tế nói đến việc tuân giữ, thực hiện trách nhiệm đã được giao. “Đảm nhiệm phận sự” chuyển tải ý nghĩa ấy rõ ràng, trang trọng mà không quá cổ.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Danh xưng này chỉ nơi Đức Chúa Trời gặp dân Ngài; “Lều Hội Kiến” là cách dịch ngắn gọn, quen thuộc và sát cấu trúc Hê-bơ-rơ.
- source_word: לְכָל עֲבֹדַת הָאֹהֶל
  choice: tức mọi công việc phục vụ trong Lều
  rationale: עֲבֹדָה ở đây là công việc phục vụ liên quan đến nơi thánh. “Tức” làm rõ quan hệ giải thích giữa phận sự tại Lều Hội Kiến và toàn bộ công việc phục vụ trong Lều, còn “trong Lều” tự nhiên hơn cách nói sở hữu cứng nhắc.
- source_word: וְזָר
  choice: nhưng không một người ngoài phận sự nào
  rationale: זָר trong luật về nơi thánh chỉ người không thuộc vai trò được phép, chứ không nhất thiết là người ngoại quốc. “Người ngoài phận sự” tránh hàm ý sắc tộc và thể hiện đúng giới hạn chức vụ.
- source_word: יִקְרַב אֲלֵיכֶם
  choice: được đến gần các con
  rationale: קרב diễn tả việc tiến vào phạm vi gần nơi thánh; אֲלֵיכֶם là số nhiều, vì vậy “các con” bảo toàn sự chuyển đổi từ A-rôn ở số ít sang nhóm được nói đến ở số nhiều.
theological_decisions:
- issue: Ý nghĩa của זָר trong luật về nơi thánh
  choice: người ngoài phận sự, tức người không thuộc vai trò được phép tại nơi thánh
  alternative: người lạ; người ngoại quốc; người không được phép
  rationale: Văn cảnh phân định quyền tiếp cận và chức vụ thánh, không phân định nguồn gốc sắc tộc. Cách dịch này giữ trọng tâm chức năng mà không quy זָר thành người ngoại quốc.
- issue: Sự chuyển đổi đại từ từ số ít sang số nhiều
  choice: “con” với עָלֶיךָ và “các con” với אֲלֵיכֶם
  alternative: dùng “con” hoặc “anh em” cho cả hai
  rationale: Bản Hê-bơ-rơ chuyển rõ từ A-rôn ở số ít sang một nhóm ở số nhiều. Giữ sự chuyển đổi này bảo toàn chi tiết của nguyên văn mà không quyết đoán quá mức về mọi thành viên của nhóm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Lều Hội Kiến” như danh xưng riêng; “phận sự” và “công việc phục vụ” giữ sắc thái thánh vụ mà vẫn tự nhiên. Dấu [a] được đặt ngay sau cụm từ cần chú giải.
