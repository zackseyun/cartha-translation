    rationale: Cụm này có thể được hiểu là người hiện không có nhiệm vụ, trong khi זָר chỉ người không được ủy quyền trong vai trò thánh vụ. «Người không được phép» nêu rõ hơn ý nghĩa theo ngữ cảnh và chú thích vẫn bảo lưu lựa chọn từ vựng khác.
