  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: vi
  text: Anh em phải chu toàn phận sự canh giữ nơi thánh và phận sự canh giữ bàn thờ, để cơn thịnh nộ không còn giáng trên con cái Israel[a] nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Israel” hoặc “người Israel.” Nguyên văn Hê-bơ-rơ là “con cái Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Anh em phải chu toàn
  rationale: Động từ שׁמר ở ngôi thứ hai số nhiều, đi với מִשְׁמֶרֶת, diễn tả việc nghiêm túc thực hiện và gìn giữ một trách nhiệm đã được giao. “Phải chu toàn” truyền đạt sức bắt buộc của lời phán và kết hợp tự nhiên với “phận sự canh giữ”.
- source_word: מִשְׁמֶרֶת
  choice: phận sự canh giữ
  rationale: Trong văn cảnh tư tế, từ này vừa chỉ nhiệm vụ được giao vừa hàm ý bảo vệ, trông coi. Cách dịch này giữ cả hai nét nghĩa và lặp lại cụm từ trước hai đối tượng như bản Hê-bơ-rơ.
- source_word: הַקֹּדֶשׁ
  choice: nơi thánh
  rationale: Khi được đặt song song với bàn thờ, từ này chỉ địa điểm hoặc phạm vi thánh, không phải khái niệm trừu tượng về sự thánh khiết. “Nơi thánh” giữ được phạm vi nghĩa mà không xác định hẹp hơn điều nguyên văn nói.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Đây là cách gọi tiếng Việt chuẩn và rõ ràng cho bàn thờ dùng trong việc dâng tế lễ.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: để không còn có ... nữa
  rationale: Mặc dù hình thức là liên từ nối với động từ chưa hoàn thành bị phủ định, văn cảnh cho phép hiểu đây là kết quả hoặc mục đích của việc canh giữ đúng phận sự. Cấu trúc “để” diễn đạt mối liên hệ ấy tự nhiên, còn “không còn ... nữa” thể hiện עוֹד.
- source_word: קֶצֶף
  choice: cơn thịnh nộ
  rationale: Từ này diễn tả cơn giận dữ mạnh mẽ gắn với sự phán xét; “cơn thịnh nộ” giữ được sắc thái nghiêm trọng hơn “sự tức giận”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Cách dịch này theo sát thành ngữ Hê-bơ-rơ “các con trai/con cái của Israel” nhưng trong tiếng Việt vẫn có thể chỉ toàn thể cộng đồng Israel. Chú thích nêu các cách diễn đạt tự nhiên hơn.
theological_decisions:
- issue: Quan hệ giữa việc canh giữ nơi thánh, bàn thờ và mệnh đề nói về cơn thịnh nộ
  choice: 'Hiểu mệnh đề cuối theo sắc thái mục đích/kết quả: chu toàn việc canh giữ nhằm ngăn cơn thịnh nộ tiếp tục giáng trên Israel'
  alternative: 'Hiểu đơn thuần là lời dự báo: “và sẽ không còn có cơn thịnh nộ nữa”'
  rationale: Văn cảnh thiết lập trách nhiệm của các tư tế và người Lê-vi để ngăn việc đến gần nơi thánh trái phép cùng sự phán xét kéo theo. “Để” làm rõ logic trong văn cảnh mà không thay đổi nội dung căn bản.
- issue: Chủ thể của cơn thịnh nộ
  choice: Không thêm “của Đức Chúa Trời”
  alternative: Dịch tường minh là “cơn thịnh nộ của Đức Chúa Trời”
  rationale: Văn cảnh cho thấy cơn thịnh nộ đến từ Đức Chúa Trời, nhưng mệnh đề Hê-bơ-rơ không nêu chủ thể ấy; bản dịch giữ sự hàm ẩn của nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh em” thể hiện lời trực tiếp ở ngôi thứ hai số nhiều mà tránh sắc thái cổ của “các ngươi”; “phận sự canh giữ” phù hợp bối cảnh phụng tự và dễ hiểu đối với độc giả phổ thông.
