    rationale: «Trong nơi thánh của các nơi thánh» gượng và không phản ánh tốt thành ngữ Hê-bơ-rơ. «Trong chốn thánh nhất» vừa gần với cấu trúc nhấn mạnh vừa rõ hơn; phần sau vẫn giải thích rằng không nhất thiết là gian cực thánh.
