base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: vi
  text: Ngươi phải ăn lễ vật ấy tại một nơi chí thánh[a]; mọi người nam đều được ăn lễ vật ấy. Lễ vật ấy sẽ là thánh vật đối với ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “trong chốn thánh nhất”. Trong ngữ cảnh này, thành ngữ ấy chỉ khu vực chí thánh được quy định để ăn lễ vật, không nhất thiết là gian Nơi Chí Thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: tại một nơi chí thánh
  rationale: Giữ nghĩa chỉ nơi chốn của giới từ בְּ và diễn đạt tự nhiên cấu trúc nhấn mạnh bậc cao nhất trong tiếng Hê-bơ-rơ. Cách dịch này tránh khiến độc giả hiểu lầm rằng việc ăn diễn ra ngay trong Nơi Chí Thánh của Đền Tạm.
- source_word: תֹּאכֲלֶנּוּ
  choice: Con phải ăn lễ vật ấy
  rationale: Động từ ngôi hai số ít hướng đến A-rôn; “phải ăn” phù hợp sắc thái chỉ thị trong quy định tế lễ. “Lễ vật ấy” làm rõ đại từ bổ ngữ giống đực số ít dựa vào văn cảnh.
- source_word: כָּל זָכָר
  choice: mọi người nam
  rationale: Phản ánh chính xác giới hạn theo giới tính của danh từ זָכָר, thay vì dùng một từ có thể bị hiểu theo nghĩa bao quát cả hai giới.
- source_word: יֹאכַל אֹתוֹ
  choice: đều được ăn lễ vật ấy
  rationale: Trong mệnh đề này, dạng chưa hoàn thành nêu quyền được phép của tất cả những người nam đủ điều kiện; “được ăn” truyền đạt rõ sắc thái cho phép.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: Lễ vật ấy sẽ là vật thánh đối với con
  rationale: Giữ thuật ngữ nhất quán cho קֹדֶשׁ và bảo toàn quan hệ được diễn đạt bằng לָּךְ, không diễn giải quá mức thành quyền sở hữu đơn thuần.
theological_decisions:
- issue: Đối tượng và phạm vi của lời chỉ thị dành cho chức tế lễ
  choice: Dùng đại từ số ít “con” cho lời nói trực tiếp với A-rôn, rồi giữ mệnh đề mở rộng quyền ăn cho mọi người nam đủ điều kiện trong hàng tư tế.
  alternative: Hiểu lời chỉ thị số ít là chỉ dành riêng cho cá nhân A-rôn.
  rationale: Ngữ cảnh gần nói về các phần lễ vật được ban cho A-rôn và các con trai ông. Bản dịch giữ hình thức số ít của nguyên văn nhưng không thu hẹp mệnh đề kế tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Con” giữ cách xưng hô số ít trong lời Đức Chúa Trời phán với A-rôn; “chí thánh” bảo toàn ngôn ngữ tế lễ mà không đồng nhất địa điểm này với gian Nơi Chí Thánh.
