  terminology: “Mang tội” giữ được thành ngữ pháp lý–tế tự của nguyên văn và chú thích nêu đúng khả năng hiểu là “mắc tội/chịu trách nhiệm hoặc hậu quả”. “Lều Hội Kiến” là thuật ngữ phù hợp cho אֹהֶל מוֹעֵד. Không có vấn đề về tên riêng hoặc thuật ngữ thần học cần sửa.
