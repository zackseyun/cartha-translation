source:
  edition: WLC
  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: vi
  text: Con dân Y-sơ-ra-ên không được đến gần Lều Hội Kiến nữa, kẻo phải mang tội[a] mà chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mắc tội”. Nguyên văn là “mang tội”, một cách nói pháp lý–tế tự chỉ việc phải chịu trách nhiệm hoặc hậu quả vì hành vi sai trái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: đến gần
  rationale: Động từ קרב có nghĩa là đến gần hoặc tiến lại gần; “đến gần” tự nhiên trong tiếng Việt và giữ được sắc thái tiến đến nơi thánh.
- source_word: עוֹד
  choice: nữa
  rationale: Kết hợp với לֹא, từ này diễn đạt ý “không còn... nữa” hoặc “không... lần nữa”; cấu trúc “không được... nữa” phù hợp với lời cấm trong ngữ cảnh.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Y-sơ-ra-ên”, nhưng ở đây chỉ cộng đồng dân Y-sơ-ra-ên nói chung; “con dân Y-sơ-ra-ên” vừa tự nhiên vừa giữ liên hệ với cách diễn đạt nguồn.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Đây là cách dịch ngắn gọn, trang trọng và quen thuộc cho tên gọi nơi Đức Chúa Trời gặp dân Ngài, đồng thời phản ánh cả hai thành tố “lều” và “hội kiến”.
- source_word: לָשֵׂאת חֵטְא
  choice: phải mang tội
  rationale: Giữ hình ảnh pháp lý–tế tự “mang tội” của nguyên văn, đồng thời dùng “phải” để diễn đạt trách nhiệm hoặc hậu quả phát sinh do vi phạm.
- source_word: לָמוּת
  choice: mà chết
  rationale: Diễn đạt gọn hậu quả chí tử nối tiếp việc mang tội, phù hợp với chuỗi hai động từ nguyên văn.
theological_decisions:
- issue: Có nên nói rõ đây là việc dân thường đến gần nơi thánh trái phép và vì thế mắc tội hay không
  choice: 'Giữ lời văn cô đọng: “không được đến gần Lều Hội Kiến nữa, kẻo phải mang tội mà chết”'
  alternative: “không được tự tiện đến gần Lều Hội Kiến nữa, nếu không sẽ mắc tội và chết”
  rationale: Ngữ cảnh cho thấy người Lê-vi gánh trách nhiệm phục vụ liên quan đến Lều, nhưng câu Hê-bơ-rơ không có từ tương ứng trực tiếp với “tự tiện”. Bản dịch không thêm điều giải thích ấy vào chính văn và giữ nguyên sức căng của thành ngữ “mang tội”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Lều Hội Kiến” được viết hoa như tên gọi nơi thánh; “con dân” diễn đạt tập thể Y-sơ-ra-ên mà không giới hạn câu này chỉ cho nam giới.
