base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: vi
  text: Còn con và các con trai con ở cùng con phải trông coi chức tế lễ của các con trong mọi việc liên quan đến bàn thờ và những việc ở phía trong bức màn; các con phải phục vụ. Ta ban chức tế lễ cho các con như một ân ban để phục vụ[a]. Nhưng người ngoài[b] nào đến gần sẽ bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta ban cho các con chức tế lễ, tức là một sự phục vụ được ban làm quà.” Cụm từ Hê-bơ-rơ có thể nhấn mạnh chức tế lễ là ân ban để phục vụ, hoặc sự phục vụ ấy được ban làm quà.'
    reason: lexical_alternative
  - marker: b
    text: “Người ngoài” ở đây là bất cứ ai không được phép thi hành phận sự tư tế, chứ không nhất thiết là người ngoại quốc.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: phải trông coi
  rationale: Trong ngữ cảnh này, động từ שׁמר nói đến việc canh giữ và chu toàn trách nhiệm tế lễ. “Trông coi” tự nhiên trong tiếng Việt và vẫn giữ được sắc thái chịu trách nhiệm bảo vệ.
- source_word: כְּהֻנַּתְכֶם
  choice: chức tế lễ của mình / chức tế lễ cho các con
  rationale: Danh từ chỉ địa vị và phận sự tư tế, không chỉ các nghi thức riêng lẻ. “Chức tế lễ” trang trọng, rõ nghĩa và phù hợp ngữ cảnh Cựu Ước.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: trong mọi việc liên quan đến bàn thờ
  rationale: דבר ở đây bao quát mọi sự vụ thuộc về bàn thờ; cách dịch này giữ nguyên phạm vi rộng mà không thu hẹp thành một nghi lễ cụ thể.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: và những gì ở phía trong bức màn
  rationale: Cụm từ chỉ khu vực ở mặt trong bức màn nơi thánh. Cách diễn đạt này rõ ràng, tự nhiên và không xác định quá mức cấu trúc không gian.
- source_word: וַעֲבַדְתֶּם
  choice: các con phải phục vụ
  rationale: עבד trong ngữ cảnh thờ phượng chỉ việc thi hành sự phục vụ thánh. “Phục vụ” đủ rộng và không nhập thuật ngữ giáo hội về sau.
- source_word: עֲבֹדַת מַתָּנָה אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: Ta ban chức tế lễ cho các con như một ân ban để phục vụ
  rationale: Cụm Hê-bơ-rơ cô đọng liên kết “sự phục vụ”, “quà tặng” và việc Đức Chúa Trời ban chức tế lễ. Bản dịch chính diễn đạt tự nhiên rằng chức tế lễ là ân ban nhằm phục vụ, còn chú thích giữ cách phân tích cú pháp khác.
- source_word: הַזָּר
  choice: người ngoài
  rationale: Trong luật tế lễ, זָר là người không thuộc nhóm được phép thi hành phận sự tư tế, chứ không nhất thiết là người ngoại quốc. “Người ngoài” giữ cách gọi ngắn gọn của nguyên văn, với chú thích ngăn ngừa hiểu lầm.
- source_word: הַקָּרֵב
  choice: nào đến gần
  rationale: קרב diễn tả việc tiến đến gần phạm vi hoặc công việc thánh; “đến gần” giữ được cả sắc thái không gian lẫn nghi lễ.
- source_word: יוּמָת
  choice: sẽ bị xử tử
  rationale: Dạng Hophal mang nghĩa bị khiến phải chết trong văn cảnh pháp luật, nên “bị xử tử” chính xác hơn một lời dự báo đơn thuần rằng người ấy sẽ chết.
theological_decisions:
- issue: Ý nghĩa của זָר trong luật tư tế
  choice: người ngoài
  alternative: người không được phép; người không thuộc hàng tư tế; người lạ
  rationale: Từ này loại trừ người không được trao thẩm quyền tư tế, không phân loại theo sắc tộc. Bản chính giữ hình ảnh “người ngoài”, còn chú thích làm rõ ý nghĩa pháp lý-nghi lễ.
- issue: Quan hệ cú pháp trong עֲבֹדַת מַתָּנָה
  choice: chức tế lễ là ân ban nhằm phục vụ
  alternative: sự phục vụ được ban làm quà
  rationale: Cụm từ có thể nhấn mạnh chức tế lễ được ban như một ân huệ để phục vụ, hoặc chính sự phục vụ là quà được ban. Bản dịch chọn cách tự nhiên trong tiếng Việt và ghi nhận cách hiểu kia trong chú thích, không biến chức tế lễ thành quyền tự nhận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con/các con” phù hợp lời Đức Chúa Trời phán trực tiếp với A-rôn. Dùng “chức tế lễ” thay vì thuật ngữ giáo phái; giữ câu phán quyết pháp lý ngắn và nghiêm.
