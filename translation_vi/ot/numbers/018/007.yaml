  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của tiếng Hê-bơ-rơ: trách nhiệm tư tế của A-rôn và các con trai ông, phạm vi liên quan đến bàn thờ và phía trong bức màn, sự ban cho của Đức Chúa Trời, và án tử hình đối với người không được phép đến gần. “Người ngoài” được chú thích đúng là người không có thẩm quyền tư tế, không nhất thiết là người ngoại quốc. Tuy nhiên, trong câu đầu, phối hợp “trong mọi việc liên quan đến bàn thờ và những gì ở phía trong bức màn” không song song rõ ràng trong tiếng Việt; thêm “những việc” làm sáng tỏ phần được lược của nguyên văn mà không thu hẹp nghĩa.'
  naturalness: Văn phong trang trọng, hiện đại và phù hợp lời phán trực tiếp. Cần chỉnh nhẹ cấu trúc song song ở câu đầu và thay “của mình” bằng “của các con” để quy chiếu số nhiều minh bạch, nhất quán với các động từ số nhiều tiếp theo.
  terminology: “Chức tế lễ,” “bàn thờ,” “bức màn,” “ân ban,” và “bị xử tử” đều thích hợp. “Người ngoài” có thể giữ trong bản văn vì chú thích đã xác định chính xác ý nghĩa pháp lý-nghi lễ của זָר.
