  text: וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/כָל מָק֔וֹם אַתֶּ֖ם וּ/בֵֽיתְ/כֶ֑ם כִּֽי שָׂכָ֥ר הוּא֙ לָ/כֶ֔ם חֵ֥לֶף עֲבֹֽדַתְ/כֶ֖ם בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: vi
  text: Các anh và gia đình các anh có thể ăn phần ấy ở bất cứ nơi nào[a][b], vì đó là tiền công của các anh cho việc phục vụ của các anh tại Lều Hội Kiến[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải ăn phần ấy” hoặc “hãy ăn phần ấy”; hình thức Híp-ri trong văn cảnh luật lệ có thể diễn tả chỉ dẫn hoặc sự cho phép.'
    reason: lexical_alternative
  - marker: b
    text: “Gia đình các anh” chỉ đơn vị hộ gia đình, gồm gia đình và những người thuộc hộ, chứ không chỉ ngôi nhà vật chất.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “thù lao”, “phần thưởng” hoặc “khoản đền đáp”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: có thể ăn phần ấy
  rationale: Trong văn cảnh luật lệ, hình thức Híp-ri diễn đạt sự cho phép hoặc chỉ dẫn, không phải hành động quá khứ đơn thuần. “Phần ấy” làm rõ đại từ chỉ phần thu nhập vừa được nói đến.
- source_word: בְּכָל מָקוֹם
  choice: ở bất cứ nơi nào
  rationale: Diễn đạt tự nhiên ý không bị giới hạn vào một địa điểm thánh cụ thể.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: anh em và cả nhà mình
  rationale: בַּיִת ở đây chỉ toàn thể đơn vị gia đình-gia nhân, không chỉ căn nhà vật chất; “cả nhà mình” tự nhiên trong tiếng Việt và giữ nghĩa rộng ấy.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho phép ăn phần thu nhập này.
- source_word: שָׂכָר
  choice: tiền công
  rationale: Từ này chỉ khoản thù lao cho công việc; “tiền công” truyền đạt rõ tính chất đền đáp, dù phần được nhận ở đây là hiện vật có thể ăn được.
- source_word: חֵלֶף
  choice: để đền đáp
  rationale: Trong ngữ cảnh này, từ diễn tả sự bù đắp tương ứng với công việc phục vụ, thay vì chỉ sự thay thế đơn thuần.
- source_word: עֲבֹדַתְכֶם
  choice: việc phục vụ của anh em
  rationale: Giữ sắc thái công tác được giao trong thánh sở, trang trọng và cụ thể hơn “công việc” nói chung.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: “Lều Hội Kiến” là cách gọi trang trọng, dễ hiểu của nơi Đức Chúa Trời gặp dân Ngài; “tại” tự nhiên trong tiếng Việt khi nói đến hoạt động phục vụ gắn với địa điểm này.
theological_decisions:
- issue: Tính chất phần được cấp cho người Lê-vi
  choice: Câu này trình bày phần ăn được như khoản đền đáp chính đáng cho việc phục vụ tại Lều Hội Kiến và cho phép ăn ở bất cứ nơi nào.
  alternative: Hiểu đây là một bữa ăn thánh chỉ được dùng trong khu vực thánh.
  rationale: Cụm “ở bất cứ nơi nào” trực tiếp loại bỏ sự hạn chế về địa điểm vốn áp dụng cho một số lễ vật thánh khác; bản dịch giữ nguyên sự phân biệt pháp lý-thần học đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến người Lê-vi; dùng “Lều Hội Kiến” như danh xưng riêng. Các chú thích được đặt ngay sau những cụm từ liên quan và theo thứ tự xuất hiện.
