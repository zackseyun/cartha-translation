  to: Các anh và gia đình các anh có thể ăn phần ấy ở bất cứ nơi nào[a][b], vì đó là tiền công của các anh cho việc phục vụ của các anh tại Lều Hội Kiến[c].
  rationale: Bản sửa giữ ý cho phép của hình thức động từ Híp-ri và phạm vi không bị giới hạn của “ở bất cứ nơi nào”. Sửa cách xưng hô để phù hợp nhất quán với số nhiều của nguyên văn, làm rõ בית là hộ gia đình, và rút gọn cách diễn đạt quan hệ giữa tiền công với việc phục vụ mà vẫn giữ sắc thái thù lao của שָׂכָר và חֵלֶף.
