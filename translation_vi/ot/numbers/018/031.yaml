  source_fidelity: 'Bản dịch phản ánh đúng ý chính của tiếng Híp-ri: người Lê-vi và hộ gia đình họ được phép ăn phần ấy ở bất cứ nơi nào, vì đó là thù lao cho việc phục vụ tại Lều Hội Kiến. Tuy nhiên, cụm “anh em và cả nhà mình” trộn cách quy chiếu số nhiều “anh em” với sở hữu phản thân số ít/tập thể “mình”, kém chính xác và kém tự nhiên.'
