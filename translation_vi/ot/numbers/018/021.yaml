source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: vi
  text: Còn về con cháu Lê-vi, này, Ta đã ban mọi phần mười trong Y-sơ-ra-ên cho họ làm sản nghiệp, để đáp lại công việc phục vụ mà họ thực hiện, tức là công việc phục vụ nơi Lều Hội Kiến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lều Hội Kiến” là nơi người Lê-vi thi hành các nhiệm vụ đã được giao trong việc thờ phượng.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי
  choice: Còn đối với con cháu Lê-vi
  rationale: Giữ cách diễn đạt theo dòng dõi của tiếng Hê-bơ-rơ, nhưng dùng “con cháu” tự nhiên hơn “các con trai” khi chỉ toàn thể người Lê-vi.
- source_word: הִנֵּה
  choice: này
  rationale: Bảo toàn chức năng nhấn mạnh và thu hút sự chú ý của lời tuyên bố, với sắc thái trang trọng trong tiếng Việt.
- source_word: נָתַתִּי
  choice: Ta đã ban
  rationale: Dạng hoàn thành diễn tả sự cấp ban đã được xác lập; “ban” phù hợp với chủ thể là Đức Chúa Trời.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: mọi phần mười trong Y-sơ-ra-ên
  rationale: “Phần mười” truyền đạt nghĩa của מַעֲשֵׂר rõ ràng cho độc giả hiện đại; “mọi” phản ánh כָּל mà không buộc phải hiểu là một khối tổng hợp duy nhất.
- source_word: לְנַחֲלָה
  choice: làm phần thừa hưởng
  rationale: Diễn tả phần được cấp làm quyền hưởng lâu dài, đồng thời tránh khiến người đọc chỉ nghĩ đến tài sản nhận sau khi một người qua đời.
- source_word: חֵלֶף
  choice: để đền đáp
  rationale: Thể hiện quan hệ trao đổi hoặc bù đắp vì công việc phục vụ, nhưng không làm câu văn mang màu sắc giao dịch thương mại quá mạnh.
- source_word: עֲבֹדָתָם אֲשֶׁר הֵם עֹבְדִים
  choice: công việc họ làm
  rationale: Truyền đạt tự nhiên sự lặp từ עבד trong nguyên văn mà không tạo lối diễn đạt gượng gạo kiểu “phục vụ sự phục vụ của họ”.
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: tức là công việc phục vụ Lều Hội Kiến
  rationale: Cụm sau giải thích cụ thể công việc vừa nói đến. “Lều Hội Kiến” là cách gọi rõ nghĩa cho nơi thi hành nhiệm vụ thờ phượng.
theological_decisions:
- issue: Mối quan hệ giữa phần mười, phần thừa hưởng và việc phục vụ của người Lê-vi
  choice: Phần mười được ban làm phần thừa hưởng để đền đáp công việc phục vụ của họ.
  alternative: Phần mười chỉ được phân cho người Lê-vi, không nhấn mạnh tính đền đáp; hoặc phần mười thay thế phần đất thừa hưởng dù câu này không nói thẳng điều đó.
  rationale: Nguyên văn đặt לְנַחֲלָה bên cạnh חֵלֶף עֲבֹדָתָם, nên bản dịch giữ cả ý “phần thừa hưởng” lẫn ý “đền đáp”, nhưng không thêm lời giải thích rằng nó thay thế phần đất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta” trong lời Đức Chúa Trời. Giữ tên riêng theo dạng quen thuộc “Lê-vi”, “Y-sơ-ra-ên”; chọn “Lều Hội Kiến” để vừa trang trọng vừa minh bạch về chức năng.
