revisions:
- from: Tất cả những phần dâng từ các vật thánh mà con dân Y-sơ-ra-ên dâng lên Đức Giê-hô-va, Ta ban cho con, cùng các con trai và con gái ở với con, làm một quy định vĩnh viễn. Đó là giao ước muối đời đời trước mặt Đức Giê-hô-va, dành cho con và dòng dõi ở với con.[a]
  to: Tất cả những phần dâng thuộc các vật thánh mà con dân Y-sơ-ra-ên dâng lên Đức Giê-hô-va, Ta ban cho con, cùng các con trai và con gái ở với con, làm một quy định vĩnh viễn. Đó là một giao ước muối đời đời trước mặt Đức Giê-hô-va, dành cho con và dòng dõi con, tức là những người ở với con.[a]
  rationale: Sửa nhẹ để diễn đạt tự nhiên hơn quan hệ sở thuộc trong “các phần dâng thuộc các vật thánh”, làm rõ hậu tố “với con” ở cuối câu, và tinh chỉnh chú thích theo hướng mô tả thay vì định nghĩa dứt khoát. Các thuật ngữ chủ chốt và tính mơ hồ biểu tượng của nguyên văn vẫn được giữ nguyên.
