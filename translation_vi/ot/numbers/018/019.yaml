source:
  edition: WLC
  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: vi
  text: Tất cả những phần dâng thuộc các vật thánh mà con dân Y-sơ-ra-ên dâng lên Đức Giê-hô-va, Ta ban cho con, cùng các con trai và con gái ở với con, làm một quy định vĩnh viễn. Đó là một giao ước muối đời đời trước mặt Đức Giê-hô-va, dành cho con và dòng dõi con, tức là những người ở với con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Giao ước muối” là một thành ngữ cổ. Muối gắn với lễ vật dâng lên (xem Lê-vi Ký 2:13) và trong các ngữ cảnh Kinh Thánh có liên hệ với tính lâu bền của giao ước (xem II Sử Ký 13:5).
    reason: Giữ thành ngữ trong chính văn, đồng thời cung cấp bối cảnh nghi lễ và văn chương mà không thu hẹp biểu tượng vào một cách giải thích duy nhất.
lexical_decisions:
- source_word: תְּרוּמֹת הַקֳּדָשִׁים
  choice: những phần dâng từ các vật thánh
  rationale: 'Diễn đạt quan hệ sở thuộc/phân xuất của cụm Hê-bơ-rơ: các phần được trích dâng từ những lễ vật hay vật đã được biệt thánh.'
- source_word: יָרִימוּ
  choice: dâng lên
  rationale: Giữ hình ảnh căn bản của động từ רום trong ngữ cảnh lễ nghi, đồng thời tự nhiên hơn cách dịch máy móc “nâng lên” trong tiếng Việt.
- source_word: חָק עוֹלָם
  choice: một quy định vĩnh viễn
  rationale: חֹק chỉ điều lệ hay quy định được ấn định; עוֹלָם ở đây được dịch theo công thức pháp quy là “vĩnh viễn”.
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: giao ước muối đời đời
  rationale: Giữ nguyên thành ngữ văn hóa “giao ước muối” và tính chất đời đời, không diễn giải biểu tượng ngay trong chính văn.
- source_word: זַרְעֲךָ
  choice: dòng dõi
  rationale: Trong ngữ cảnh lời hứa mang tính thế hệ, “dòng dõi” chuyển tải tốt danh từ tập hợp Hê-bơ-rơ.
theological_decisions:
- issue: Danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Chúa Hằng Hữu / Yahweh
  rationale: Dùng cách phiên âm đã quen thuộc và trang trọng trong truyền thống Kinh Thánh tiếng Việt, đồng thời biểu thị đây là danh riêng trong nguyên văn.
- issue: Ý nghĩa của “giao ước muối”
  choice: Giữ nguyên thành ngữ và giải thích ngắn trong chú thích
  alternative: Diễn giải trong chính văn là “giao ước bền vững”
  rationale: Không thu hẹp biểu tượng cổ thành một cách giải nghĩa duy nhất; chính văn bảo tồn hình ảnh và chú thích cung cấp bối cảnh cần thiết.
- issue: Phạm vi người nhận
  choice: “con, cùng các con trai và con gái ở với con” và “dòng dõi ở với con”
  alternative: Khái quát thành “gia đình con”
  rationale: Giữ cấu trúc và phạm vi cụ thể của nguyên văn, không đồng nhất hóa tất cả thành viên gia đình hay mở rộng điều khoản quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; dùng “Ta/con” phù hợp lời Đức Chúa Trời phán trực tiếp với A-rôn. Giữ phép lặp của nguyên văn ở mức vừa phải và tránh diễn giải quá mức các thuật ngữ nghi lễ.
