base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: vi
  text: Đây là phần thuộc về con trong những vật chí thánh, phần không bị thiêu trong lửa:[a] mọi lễ vật của họ, mọi lễ vật ngũ cốc của họ, mọi lễ vật chuộc tội[b] của họ và mọi lễ vật chuộc lỗi[c] của họ mà họ dâng lại cho ta. Đó là vật chí thánh dành cho con và các con trai con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ lửa.” Trong ngữ cảnh này, cụm từ chỉ phần được dành lại từ lễ vật dâng bằng lửa thay vì bị thiêu trên bàn thờ.'
    reason: lexical_alternative
  - marker: b
    text: “Lễ vật chuộc tội” cũng có thể dịch là “lễ vật thanh tẩy.”
    reason: lexical_alternative
  - marker: c
    text: “Lễ vật chuộc lỗi” cũng có thể dịch là “lễ vật bồi hoàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: trong những vật chí thánh
  rationale: Cụm từ chỉ những lễ vật thuộc cấp độ thánh cao nhất, chứ không chỉ gian Chí Thánh của đền thánh.
- source_word: מִן הָאֵשׁ
  choice: phần không bị thiêu trong lửa
  rationale: Nghĩa đen là “từ lửa”; trong ngữ cảnh, đây là phần được dành lại từ lễ vật dâng bằng lửa cho tư tế. Cách dịch này làm rõ ý ngữ cảnh, đồng thời chú thích bảo lưu nghĩa đen.
- source_word: קָרְבָּנָם
  choice: mọi lễ vật của họ
  rationale: קָרְבָּן là thuật ngữ khái quát cho vật được đem đến dâng lên Đức Chúa Trời; “lễ vật” tự nhiên và bao quát trong tiếng Việt.
- source_word: מִנְחָתָם
  choice: mọi lễ vật ngũ cốc của họ
  rationale: Trong luật tế lễ, מִנְחָה thường chỉ lễ vật làm từ ngũ cốc; cách dịch này cụ thể và dễ hiểu.
- source_word: חַטָּאתָם
  choice: mọi lễ vật chuộc tội của họ
  rationale: Trong danh sách tế lễ, từ này chỉ một loại lễ vật liên quan đến tội lỗi và sự thanh tẩy. “Lễ vật chuộc tội” là cách gọi quen thuộc; phương án nhấn mạnh sự thanh tẩy được ghi ở chú thích.
- source_word: אֲשָׁמָם
  choice: mọi lễ vật chuộc lỗi của họ
  rationale: אָשָׁם chỉ lễ vật liên quan đến tình trạng mắc lỗi và việc bồi hoàn. “Lễ vật chuộc lỗi” phân biệt tương đối rõ với lễ vật chuộc tội; sắc thái bồi hoàn được bảo lưu ở chú thích.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: mà họ dâng lại cho ta
  rationale: Hiphil của שׁוב mang ý đưa trở lại hoặc hoàn lại. “Dâng lại” giữ được hình ảnh ấy mà vẫn tự nhiên trong văn cảnh tế lễ.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Cụm từ xác định phẩm cấp thánh cao nhất của các phần lễ vật, không phải một địa điểm.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: dành cho con và các con trai con
  rationale: Người được nói với là A-rôn; “các con trai” giữ đúng giới tính được nêu rõ trong tiếng Hê-bơ-rơ và bối cảnh chức tư tế.
theological_decisions:
- issue: Phân biệt phẩm cấp thánh của lễ vật với gian Chí Thánh
  choice: những vật chí thánh / vật chí thánh
  alternative: nơi chí thánh / Chí Thánh
  rationale: Trong câu này, קֹדֶשׁ הַקֳּדָשִׁים và קֹדֶשׁ קָדָשִׁים nói về địa vị nghi lễ của lễ vật, không nói về gian bên trong của nơi thánh.
- issue: Đối tượng thừa hưởng phần lễ vật của tư tế
  choice: con và các con trai con
  alternative: con và con cái con / hậu duệ con
  rationale: Bản Hê-bơ-rơ nêu cụ thể “các con trai,” phù hợp với chức vụ tư tế nam trong ngữ cảnh này; không trung tính hóa chi tiết đó.
- issue: Sắc thái của lễ vật חַטָּאת và אָשָׁם
  choice: lễ vật chuộc tội / lễ vật chuộc lỗi
  alternative: lễ vật thanh tẩy / lễ vật bồi hoàn
  rationale: Dùng các thuật ngữ quen thuộc trong bản văn chính nhưng giữ các sắc thái nghi lễ và bồi hoàn trong chú thích, tránh thu hẹp ý nghĩa thần học của từ gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/con” phản ánh lời Đức Chúa Trời phán với A-rôn. Dùng “chí thánh” như thuật ngữ phẩm cấp nghi lễ; tránh khiến người đọc hiểu nhầm là gian Chí Thánh. Tất cả dấu chú thích [a], [b], [c] đều xuất hiện ngay sau từ ngữ liên quan trong bản văn.
