  source_fidelity: Bản dịch truyền đạt đúng cấu trúc danh mục các lễ vật và giữ được sắc thái của “dâng lại cho ta.” Tuy nhiên, mệnh đề cuối hiện nói “Những lễ vật ấy là vật chí thánh,” có thể khiến toàn bộ lễ vật được hiểu là thuộc riêng tư tế. Trong tiếng Hê-bơ-rơ, “đó là vật chí thánh” xác định phẩm cấp của phần được ban cho A-rôn và các con trai ông. Cách diễn đạt số ít/trung tính cũng bám sát vị ngữ קֹדֶשׁ קָדָשִׁים hơn.
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Phần không bị thiêu trong lửa” là một cách giải nghĩa ngữ cảnh hợp lý cho cụm khó מִן־הָאֵשׁ; chú thích đã bảo lưu nguyên văn và giải thích phạm vi nghĩa.
