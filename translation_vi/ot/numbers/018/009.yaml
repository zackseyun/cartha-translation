  to: Đây là phần thuộc về con trong những vật chí thánh, phần không bị thiêu trong lửa:[a] mọi lễ vật của họ, mọi lễ vật ngũ cốc của họ, mọi lễ vật chuộc tội[b] của họ và mọi lễ vật chuộc lỗi[c] của họ mà họ dâng lại cho ta. Đó là vật chí thánh dành cho con và các con trai con.
