source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: vi
  text: Anh em sẽ không mắc tội vì phần mười ấy khi anh em dâng lên phần tốt nhất lấy từ đó[a]. Anh em không được làm ô uế các vật thánh của con dân Y-sơ-ra-ên[b], và anh em sẽ không phải chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mỡ của nó” hoặc “phần quý nhất của nó.” Từ Hê-bơ-rơ חֶלֶב có nghĩa đen là “mỡ,” nhưng trong ngữ cảnh lễ vật thường chỉ phần quý nhất hoặc tốt nhất.'
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: “các con trai của Y-sơ-ra-ên,” một cách gọi thông dụng chỉ toàn thể dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: sẽ không mắc tội
  rationale: Thành ngữ נשא חטא chỉ việc mang tội hoặc chịu trách nhiệm về tội. “Không mắc tội” tự nhiên trong tiếng Việt và diễn đạt rõ việc không phải chịu tội trong trường hợp này.
- source_word: עָלָיו
  choice: vì phần mười ấy
  rationale: Đại từ chỉ về phần mười đang được bàn đến trong văn cảnh; nói rõ sở chỉ giúp câu tiếng Việt tránh mơ hồ mà không thay đổi ý nghĩa.
- source_word: בַּהֲרִימְכֶם
  choice: khi đã trích ... làm lễ dâng
  rationale: Động từ Hiphil của רום trong ngữ cảnh này nói đến việc lấy riêng và dâng một phần đóng góp. Cách dịch này giữ cả ý tách ra lẫn mục đích dâng hiến, tự nhiên hơn cách dịch sát chữ “nâng lên”.
- source_word: חֶלְבּוֹ
  choice: phần tốt nhất của nó
  rationale: חֵלֶב có nghĩa đen là “mỡ,” nhưng trong ngữ cảnh lễ vật có thể chỉ phần béo tốt, quý nhất. Ở đây đối tượng là phần mười từ sản vật, nên “phần tốt nhất” tránh gợi sai rằng chỉ nói đến mỡ động vật.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: những vật thánh của con dân Y-sơ-ra-ên
  rationale: קָדְשֵׁי được giữ với nghĩa rộng là những vật đã được biệt riêng làm thánh. “Con dân Y-sơ-ra-ên” là cách gọi tập thể tự nhiên, trang trọng cho בְנֵי יִשְׂרָאֵל trong tiếng Việt.
- source_word: תְחַלְּלוּ
  choice: xúc phạm
  rationale: Piel của חלל có nghĩa làm ô uế, phạm đến hoặc đối xử như vật thường với điều thánh. “Xúc phạm những vật thánh” dễ hiểu và vẫn duy trì sự tương phản giữa thánh và phàm.
- source_word: וְלֹא תָמֻתוּ
  choice: và anh em sẽ không phải chết
  rationale: Giữ liên từ phối hợp וְ theo mặt chữ và diễn đạt hậu quả được tránh trong tiếng Việt tự nhiên, không buộc mệnh đề thành ý chỉ mục đích.
theological_decisions:
- issue: Sở chỉ của עָלָיו và các đại từ số ít
  choice: phần mười ấy
  alternative: vì nó
  rationale: Văn cảnh trước xác định phần mười của người Lê-vi là đối tượng. Nêu “phần mười ấy” làm rõ sở chỉ trong tiếng Việt mà không thêm một đối tượng thần học mới.
- issue: Nghĩa của חֶלֶב trong ngữ cảnh lễ vật
  choice: phần tốt nhất
  alternative: phần mỡ
  rationale: Câu này áp dụng cho phần mười từ sản vật; nghĩa thành ngữ “phần tốt nhất” bảo toàn yêu cầu dâng phần quý nhất mà không khiến độc giả hiểu lầm là mỡ động vật.
- issue: Quan hệ của mệnh đề וְלֹא תָמֻתוּ
  choice: và anh em sẽ không phải chết
  alternative: để anh em khỏi chết
  rationale: Cấu trúc Hê-bơ-rơ dùng phép nối đơn giản và có thể được hiểu như kết quả hoặc hậu quả được tránh. Bản dịch không áp đặt sắc thái mục đích vốn không được đánh dấu rõ.
- issue: Cách dịch בְנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên
  rationale: Đây là danh xưng dân tộc tập thể quen thuộc, bao gồm dân Y-sơ-ra-ên chứ không chỉ nam giới. “Con dân” giữ nét nguồn gốc cộng đồng và tự nhiên hơn trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đối tượng số nhiều là người Lê-vi trong văn cảnh; “lễ dâng,” “vật thánh” duy trì sắc thái nghi lễ mà không quá cổ. Tất cả dấu chú thích đều xuất hiện ngay trong chính văn.
