  to: Anh em sẽ không mắc tội vì phần mười ấy khi anh em dâng lên phần tốt nhất lấy từ đó[a]. Anh em không được làm ô uế các vật thánh của con dân Y-sơ-ra-ên[b], và anh em sẽ không phải chết.
