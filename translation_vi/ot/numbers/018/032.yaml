  verdict: revise
  source_fidelity: 'Bản dịch nắm đúng ý chính: người Lê-vi không mắc tội khi dâng phần tốt nhất của phần mười, không được làm tổn phạm các vật thánh, và nhờ đó tránh án chết. Tuy nhiên, “xúc phạm” thiên về lời nói hay thái độ đối với vật thánh, chưa chuyển tải chính xác động từ Piel חלל là làm ô uế, làm phàm tục, hoặc đối xử với điều thánh như thường. Cụm “khi đã trích ... làm lễ dâng” cũng có thể diễn đạt trực tiếp hơn hành động dâng phần được lấy ra.'
  naturalness: Văn phong nhìn chung hiện đại và trang trọng. “Anh em” phù hợp với lời nói trực tiếp với nhóm người Lê-vi. “Dâng lên phần tốt nhất lấy từ đó” tự nhiên hơn “trích ... làm lễ dâng,” đồng thời giữ được cả ý lấy phần riêng ra và ý dâng hiến.
  terminology: Nên dùng “làm ô uế các vật thánh” cho תחללו để duy trì đối lập thánh/phàm và cách dùng nghi lễ quen thuộc. “Các vật thánh của con dân Y-sơ-ra-ên” bảo toàn phạm vi rộng của קדשי בני ישראל. Chú thích a cần sửa dạng từ Hê-bơ-rơ và nêu phương án nghĩa đen không gây mơ hồ.
  issues:
