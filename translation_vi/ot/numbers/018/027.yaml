base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: vi
  text: Lễ vật dâng lên của anh em sẽ được ghi nhận cho anh em như ngũ cốc từ sân đập lúa và như sản lượng từ bồn ép nho[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ được tính cho anh em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “như sự đầy tràn từ bồn ép nho,” tức là sản lượng đầy đủ từ bồn ép nho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: sẽ được kể cho anh em
  rationale: Dạng Niphal của חשׁב diễn tả việc được tính hoặc được xem là tương đương trong bối cảnh luật lệ; “được kể” giữ được sắc thái quy định mà vẫn tự nhiên.
- source_word: תְּרוּמַתְכֶם
  choice: phần đóng góp của anh em
  rationale: תְּרוּמָה chỉ phần được tách riêng để dâng cho mục đích thánh. “Phần đóng góp” rõ nghĩa trong ngữ cảnh người Lê-vi trích một phần từ thuế phần mười, đồng thời tránh thuật ngữ cổ khó hiểu.
- source_word: כַּדָּגָן מִן הַגֹּרֶן
  choice: như ngũ cốc từ sân đập lúa
  rationale: Giữ phép so sánh và hình ảnh nông nghiệp của nguyên văn; גֹּרֶן là nơi đập lúa, được dùng theo phép hoán dụ về sản lượng ngũ cốc.
- source_word: וְכַמְלֵאָה מִן הַיָּקֶב
  choice: và như sản vật dồi dào từ bồn ép nho
  rationale: מְלֵאָה theo nghĩa đen là “sự đầy tràn” nhưng tại đây chỉ sản lượng đầy đủ; cách dịch này chuyển tải ý nghĩa trong tiếng Việt tự nhiên mà vẫn giữ sắc thái dồi dào. יֶקֶב có thể chỉ bồn hay nơi ép nho; “bồn ép nho” phù hợp với hình ảnh nông nghiệp.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho hậu tố số nhiều trong lời truyền cho người Lê-vi. “Phần đóng góp” làm rõ đây là một phần được tách riêng; “sản vật dồi dào” tránh lối dịch sát chữ thiếu tự nhiên của מְלֵאָה.
