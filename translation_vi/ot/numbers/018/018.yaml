- from: Còn thịt của chúng[a] sẽ thuộc về con[c]; như ức của lễ vật đưa qua đưa lại[b] và như đùi phải, nó sẽ thuộc về con.
  to: Còn thịt của chúng[a] sẽ thuộc về con[c]; như ức của lễ vật đưa qua[b] và như đùi phải cũng sẽ thuộc về con.
  rationale: Chỉ điều chỉnh thuật ngữ nghi lễ cho tự nhiên hơn và làm rõ cú pháp tiếng Việt ở mệnh đề cuối. Bản sửa vẫn giữ “Còn”, “thịt”, hai lần “như”, và hai lần công thức “thuộc về con”, đồng thời không giải quyết theo suy đoán sự bất quy tắc giống ngữ pháp trong bản Hê-bơ-rơ.
