source:
  edition: WLC
  text: וּ/בְשָׂרָ֖/ם יִהְיֶה לָּ֑/ךְ כַּ/חֲזֵ֧ה הַ/תְּנוּפָ֛ה וּ/כְ/שׁ֥וֹק הַ/יָּמִ֖ין לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: vi
  text: Còn thịt của chúng[a] sẽ thuộc về con[c]; như ức của lễ vật đưa qua[b] và như đùi phải cũng sẽ thuộc về con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói theo nghĩa đen là “thịt”, ở đây chỉ phần thịt của sinh tế.
    reason: lexical_alternative
  - marker: b
    text: “Lễ vật đưa qua” là phần lễ vật được trình dâng trước mặt Đức Giê-hô-va bằng một động tác nghi lễ; cũng có thể dịch là “lễ vật trình dâng”.
    reason: cultural_note
  - marker: c
    text: Trong tiếng Hê-bơ-rơ, đại từ ở đây có hình thức giống cái số ít, còn đại từ ở cuối câu có hình thức giống đực số ít. Ngữ cảnh vẫn nói về phần được dành cho A-rôn trong vai trò thầy tế lễ.
    reason: textual_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: Còn thịt của chúng
  rationale: בָּשָׂר theo nghĩa đen là “thịt” và trong ngữ cảnh tế lễ chỉ phần thịt có thể dùng làm thức ăn. “Còn” diễn đạt sự chuyển ý từ huyết và mỡ ở câu trước sang phần được dành cho thầy tế lễ.
- source_word: יִהְיֶה לָּךְ / לְךָ יִהְיֶה
  choice: sẽ thuộc về con / nó sẽ thuộc về con
  rationale: Cấu trúc היה + ל diễn tả quyền sở hữu hoặc phần được phân định. Việc lặp lại được giữ để phản ánh sự nhấn mạnh của tiếng Hê-bơ-rơ.
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: như ức của lễ vật đưa qua đưa lại
  rationale: חָזֶה là phần ức; תְּנוּפָה chỉ phần lễ vật được trình dâng bằng một động tác nghi lễ. Cách dịch này giữ hình ảnh cụ thể mà không giải thích quá mức nghi thức.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: và như đùi phải
  rationale: שׁוֹק chỉ phần chân trên hay đùi trong việc phân chia sinh tế; הַיָּמִין xác định đó là bên phải. Giữ cả כְּ (“như”) vì nó có mặt trong nguyên văn.
theological_decisions:
- issue: Đối tượng của các đại từ ngôi thứ hai số ít
  choice: Dùng “con” ở số ít, hiểu là lời phán với A-rôn trong vai trò đại diện cho chức tế lễ.
  alternative: Dịch rõ thành “A-rôn” hoặc chuyển sang số nhiều để chỉ các thầy tế lễ.
  rationale: Ngữ cảnh hướng lời đến A-rôn, còn nguyên văn dùng các hậu tố số ít. Không thêm tên riêng hay chuyển sang số nhiều, nhờ đó giữ được hình thức và phạm vi diễn đạt của câu.
- issue: Sự thay đổi giống ngữ pháp giữa hai hậu tố ngôi thứ hai
  choice: Dịch cả hai bằng “con” và ghi chú sự khác biệt trong tiếng Hê-bơ-rơ.
  alternative: Cố thể hiện hai đối tượng khác nhau trong chính văn.
  rationale: Hậu tố thứ nhất có hình thức giống cái số ít, còn hậu tố thứ hai là giống đực số ít; tiếng Việt không đánh dấu giống ở đại từ này. Ngữ cảnh không đủ để xác quyết hai đối tượng khác nhau, nên ghi nhận hiện tượng thay vì giải quyết suy đoán.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc so sánh lặp lại của nguyên văn, đồng thời dùng “con” phù hợp với lời Đức Chúa Trời phán trực tiếp cùng A-rôn. Các thuật ngữ tế lễ được diễn đạt cụ thể và có chú thích ngắn.
