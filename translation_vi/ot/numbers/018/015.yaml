language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: vi
  text: Mọi con đầu lòng, tức mọi con mở lòng mẹ, của mọi loài xác thịt mà họ trình dâng cho Yahweh—dù là người hay súc vật—sẽ thuộc về con. Tuy nhiên, con nhất định phải chuộc con đầu lòng của loài người, và phải chuộc con đầu lòng của súc vật ô uế.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: con đầu lòng mở dạ mẹ
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về con đầu tiên ra khỏi lòng mẹ, đồng thời dùng cách diễn đạt dễ hiểu trong tiếng Việt.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: mọi ... thuộc mọi loài xác thịt
  rationale: Bảo toàn phạm vi bao quát của câu nguồn và cách nói Kinh Thánh 'mọi loài xác thịt', vốn ở đây gồm người và súc vật.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: mà người ta dâng lên Đức Giê-hô-va
  rationale: Động từ chỉ việc đem đến hoặc trình dâng trong bối cảnh lễ vật; 'dâng lên' tự nhiên mà không hàm ý mọi đối tượng đều bị sát tế.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc và trang trọng trong tiếng Việt để biểu đạt Tứ Tự Danh.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: dù là người hay súc vật
  rationale: Diễn đạt rõ hai phạm vi đối chiếu trong nguyên văn.
- source_word: יִהְיֶה לָּךְ
  choice: đều sẽ thuộc về con
  rationale: Thể hiện trực tiếp quyền được nhận của thầy tế lễ; đại từ 'con' phù hợp lời Đức Chúa Trời phán với A-rôn trong ngữ cảnh.
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Nêu rõ sự hạn định quan trọng đối với mệnh đề vừa nói.
- source_word: פָּדֹה תִפְדֶּה
  choice: nhất định phải chuộc
  rationale: Truyền đạt cả tính bắt buộc lẫn sắc thái nhấn mạnh của cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn.
- source_word: בְּכוֹר הָאָדָם
  choice: con đầu lòng của loài người
  rationale: Giữ sự đối lập tập thể giữa con người và súc vật mà không giới hạn vào nam giới.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: con đầu lòng của súc vật ô uế
  rationale: 'Phản ánh sát phân loại nghi lễ của nguyên văn: những súc vật không thanh sạch để dâng làm sinh tế.'
theological_decisions:
- issue: Ý nghĩa của אָדָם khi đối chiếu với súc vật
  choice: loài người
  alternative: người; nhân loại
  rationale: Trong câu này, từ chỉ con người nói chung, đối lập với súc vật; 'loài người' giữ rõ phạm vi tập thể ấy.
- issue: Tính chất quyền nhận các con đầu lòng của thầy tế lễ
  choice: Các con đầu lòng thuộc về thầy tế lễ, nhưng con đầu lòng của loài người và súc vật ô uế phải được chuộc.
  alternative: Hiểu 'dâng lên' là mọi con đầu lòng đều bị hiến tế theo nghĩa đen.
  rationale: Chính mệnh đề hạn định ngay sau đó loại trừ cách hiểu rằng tất cả các con đầu lòng đều phải bị sát tế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ hình ảnh Hê-bơ-rơ ở 'mở dạ mẹ', dùng thuật ngữ nghi lễ quen thuộc 'chuộc' và 'ô uế', đồng thời tránh khiến 'dâng lên' bị hiểu hẹp là sát tế trong mọi trường hợp.
