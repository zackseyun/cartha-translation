revisions:
- from: Mọi con đầu lòng mở dạ mẹ[a], thuộc mọi loài xác thịt mà người ta dâng lên Đức Giê-hô-va, dù là người hay súc vật, đều sẽ thuộc về con. Tuy nhiên, con nhất định phải chuộc con đầu lòng của loài người, và cũng phải chuộc con đầu lòng của súc vật ô uế.
  to: Mọi con đầu lòng, tức mọi con mở lòng mẹ, của mọi loài xác thịt mà họ trình dâng cho Yahweh—dù là người hay súc vật—sẽ thuộc về con. Tuy nhiên, con nhất định phải chuộc con đầu lòng của loài người, và phải chuộc con đầu lòng của súc vật ô uế.
  rationale: Bản sửa làm rõ quan hệ giữa «con đầu lòng/mở lòng mẹ» và «mọi loài xác thịt», giữ đối chiếu người—súc vật và lực nhấn mạnh của «nhất định phải chuộc». «Trình dâng» bảo toàn nghĩa rộng của động từ Hê-bơ-rơ trong ngữ cảnh mà không hàm ý mọi đối tượng đều bị sát tế. Chỉ giữ chú thích cho thành ngữ «mở lòng mẹ»; không thêm chú thích không có điểm neo trong bản tiếng Việt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:32:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa nhẹ để phản ánh sáng rõ hơn cấu trúc của tiếng Hê-bơ-rơ: «mọi con mở lòng mẹ» thuộc phạm vi «mọi loài xác thịt», rồi được phân rõ là người và súc vật. Bản sửa cũng nhất quán danh riêng Yahweh theo audit trail tiếng Anh.'
  naturalness: Cụm «thuộc mọi loài xác thịt» trong bản nháp không tự nhiên và làm quan hệ cú pháp bị mơ hồ. Đặt cụm giải thích «tức mọi con mở lòng mẹ» giữa hai dấu phẩy giúp câu hiện đại, dễ đọc mà vẫn giữ hình ảnh nguyên ngữ.
  terminology: Giữ «con đầu lòng», «chuộc», và «ô uế» là các thuật ngữ phù hợp. Dùng «trình dâng» để không thu hẹp động từ הִקְרִיבוּ thành sát tế. «Yahweh» nhất quán với quyết định danh xưng trong nguồn đối chiếu.
  issues:
  - severity: medium
    issue: Cú pháp «Mọi con đầu lòng mở dạ mẹ, thuộc mọi loài xác thịt» không rõ và không tự nhiên.
    rationale: Tiếng Hê-bơ-rơ nói về mọi con đầu lòng/mọi con mở lòng mẹ trong phạm vi mọi loài xác thịt. Cách đặt «thuộc» trong bản nháp dễ khiến người đọc không xác định được thành phần nào thuộc thành phần nào.
  - severity: low
    issue: «Đức Giê-hô-va» không nhất quán với lựa chọn Yahweh trong English POB audit trail.
    rationale: Audit trail quy định chuyển tự Tứ Tự Danh là «Yahweh». Dùng danh riêng này giúp duy trì nhất quán liên bản dịch.
  revised_text: Mọi con đầu lòng, tức mọi con mở lòng mẹ, của mọi loài xác thịt mà họ trình dâng cho Yahweh—dù là người hay súc vật—sẽ thuộc về con. Tuy nhiên, con nhất định phải chuộc con đầu lòng của loài người, và phải chuộc con đầu lòng của súc vật ô uế.
