id: NUM.18.2
reference: Numbers 18:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: vi
  text: Cũng hãy đưa anh em của con[a], tức chi phái Lê-vi, chi phái của cha con, đến gần bên con, để họ gắn bó với con và phục vụ con; còn con, cùng các con trai con, sẽ ở trước Lều Chứng Ước[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây chỉ những người cùng chi phái Lê-vi với A-rôn.
    reason: contextual_clarification
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “Lều của Chứng Ước”; không phải cụm từ thường được dịch là “Lều Hội Kiến”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Cũng hãy
  rationale: Diễn đạt tự nhiên sức bổ sung của liên từ và phó từ mở đầu câu.
- source_word: אַחֶיךָ
  choice: anh em của con
  rationale: Giữ ngôn ngữ thân tộc của tiếng Hê-bơ-rơ; trong ngữ cảnh, cụm từ chỉ những người cùng chi phái Lê-vi với A-rôn.
- source_word: מַטֵּה לֵוִי
  choice: chi phái Lê-vi
  rationale: מַטֶּה ở đây là thuật ngữ chỉ chi phái, không phải cây gậy.
- source_word: שֵׁבֶט אָבִיךָ
  choice: chi phái của cha con
  rationale: Giữ cụm đồng vị xác định Lê-vi là chi phái tổ tiên của A-rôn.
- source_word: הַקְרֵב אִתָּךְ
  choice: đưa ... đến gần cùng con
  rationale: Giữ sắc thái của thể Hiphil từ קרב là đưa đến gần để đảm nhận việc phục vụ, đồng thời diễn đạt ý đồng hành của אִתָּךְ.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: để họ gắn bó với con
  rationale: Diễn đạt ý được kết hợp hoặc gắn vào; động từ לוה còn tạo âm hưởng với tên Lê-vi.
- source_word: וִישָׁרְתוּךָ
  choice: và phục vụ con
  rationale: שרת chỉ sự phục vụ hoặc phụng sự; cách nói này trực tiếp và dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: còn con và các con trai con ở cùng con
  rationale: Từ 'còn' làm rõ sự đối chiếu giữa nhiệm vụ hỗ trợ của người Lê-vi và vị trí của A-rôn cùng các con trai ông mà không thêm ý thần học.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: sẽ ở trước Lều Chứng Ước
  rationale: Theo sát cụm Hê-bơ-rơ 'lều của chứng ước/chứng ngôn', không đồng hóa với cụm quen thuộc 'Lều Hội Kiến'.
theological_decisions:
- issue: Cách dịch אֹהֶל הָעֵדֻת
  choice: Lều Chứng Ước
  alternative: Lều Hội Kiến
  rationale: Bản Hê-bơ-rơ tại câu này dùng עֵדֻת, nghĩa là chứng ước/chứng ngôn, chứ không dùng מוֹעֵד, nghĩa là hội kiến. Vì vậy bản dịch giữ sự phân biệt của nguyên bản thay vì hài hòa với cách gọi quen thuộc.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Đại từ “con” phản ánh lời Đức Chúa Trời trực tiếp phán với A-rôn. “Lều Chứng Ước” được viết hoa như tên gọi của nơi thánh; câu giữ quan hệ giữa người Lê-vi và hàng tư tế mà không diễn giải vượt quá nguyên văn.
