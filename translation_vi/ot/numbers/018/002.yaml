revisions:
- from: Cũng hãy đưa anh em của con[a], tức chi phái Lê-vi, chi phái của cha con, đến gần cùng con, để họ gắn bó với con và phục vụ con; còn con và các con trai con ở cùng con sẽ ở trước Lều Chứng Ước.[b]
  to: Cũng hãy đưa anh em của con[a], tức chi phái Lê-vi, chi phái của cha con, đến gần bên con, để họ gắn bó với con và phục vụ con; còn con, cùng các con trai con, sẽ ở trước Lều Chứng Ước[b].
  rationale: Sửa thuần phong cách ở hai cụm gượng, đồng thời chuyển ký hiệu [b] sát ngay sau thuật ngữ mà chú thích giải thích. Không thay đổi quan hệ phục vụ, sự phân biệt vai trò, hay cách dịch “tent of the testimony”.
  reviewer_model: gpt-5.6-terra
