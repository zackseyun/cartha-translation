  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: vi
  text: 'Ông đáp rằng: “Tôi chẳng phải cẩn thận nói điều Yahweh đặt vào miệng tôi sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hê-bơ-rơ: “Chẳng phải điều Yahweh đặt vào miệng tôi, điều ấy tôi phải giữ để nói sao?” Động từ được dùng có thể nhấn mạnh việc cẩn thận tuân theo khi nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: Ông đáp rằng
  rationale: Cặp động từ kể chuyện Hê-bơ-rơ theo nghĩa đen là “ông đáp và nói”; “ông đáp rằng” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ chức năng dẫn lời.
- source_word: הֲלֹא
  choice: Chẳng phải tôi phải ... sao?
  rationale: Diễn đạt câu hỏi tu từ mong đợi sự đồng tình, đồng thời giữ sắc thái nghĩa vụ trong ngữ cảnh Ba-la-am bị ràng buộc bởi lời Đức Chúa Trời.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: điều ...
  rationale: Cụm tân ngữ quan hệ kèm đại từ hồi chỉ được diễn đạt tự nhiên là “điều”; tiếng Việt không cần lặp lại đại từ tân ngữ.
- source_word: יָשִׂים
  choice: đặt
  rationale: Giữ hình ảnh Hê-bơ-rơ về việc Đức Chúa Trời đặt lời vào miệng người nói; cách nói này vẫn rõ nghĩa trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: בְּפִי
  choice: vào miệng tôi
  rationale: Giới từ trong thành ngữ này có thể được diễn đạt tự nhiên theo hướng chuyển động là “vào”; hình ảnh lời được ban để nói vẫn được bảo toàn.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: cẩn thận nói
  rationale: Động từ שׁמר với động từ nguyên mẫu nhấn mạnh việc giữ đúng hoặc chú tâm thực hiện lời phải nói; “cẩn thận nói” bảo toàn sắc thái này mà không dùng cấu trúc quá gượng.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh giao ước יהוה; giữ danh riêng tránh biến nó thành một tước hiệu.
- issue: Mức độ ràng buộc trong lời đáp của Ba-la-am
  choice: Chẳng phải tôi phải cẩn thận nói... sao?
  alternative: Chẳng phải tôi phải nói... sao?
  rationale: Cách dịch kết hợp nghĩa vụ của câu hỏi tu từ הֲלֹא với sắc thái giữ gìn, tuân thủ của אֶשְׁמֹר, nhưng không diễn giải thành sự cưỡng bức máy móc.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Ông đáp rằng” tự nhiên hơn việc sao chép nguyên cụm Hê-bơ-rơ “ông đáp và nói”; hình ảnh “đặt vào miệng tôi” được giữ nguyên vì rõ nghĩa và có giá trị văn chương.
