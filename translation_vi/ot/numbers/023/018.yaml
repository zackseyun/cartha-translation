  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: vi
  text: 'Rồi ông cất lời tuyên bố[a] rằng:


    “Hỡi Ba-lác, hãy đứng lên và nghe;


    hỡi con trai Xíp-bô, hãy lắng nghe tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lời sấm” hay “lời châm ngôn”. Từ Hê-bơ-rơ מָשָׁל có thể chỉ lời châm ngôn, lời ví von, hoặc lời tuyên bố có tính thi ca và trang trọng; ở đây từ này mở đầu lời tuyên bố của Ba-la-am.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: ông cất lời
  rationale: Cụm này là thành ngữ mở đầu một lời tuyên bố trang trọng. “Cất lời” tự nhiên trong tiếng Việt, giữ sắc thái trang nghiêm mà không diễn giải quá mức; chú thích bảo lưu phạm vi nghĩa của מָשָׁל.
- source_word: וַיֹּאמַר
  choice: rằng
  rationale: Sau “cất lời”, dùng “rằng” dẫn lời trực tiếp, tránh lặp vụng “cất lời và nói” nhưng vẫn thể hiện động từ אמר.
- source_word: קוּם
  choice: hãy đứng lên
  rationale: Mệnh lệnh nói với Ba-lác. “Đứng lên” rõ nghĩa và trang trọng vừa phải; không nhất thiết hàm ý từ tư thế nằm mà là lời gọi chú ý.
- source_word: וּשֲׁמָע
  choice: và nghe
  rationale: Giữ nghĩa cơ bản của שׁמע và phép song hành với động từ mạnh hơn ở vế sau.
- source_word: הַאֲזִינָה עָדַי
  choice: hãy lắng nghe tôi
  rationale: “Lắng nghe” diễn đạt sự chú tâm của אזן, còn “tôi” thể hiện hậu tố ngôi thứ nhất trong עָדַי.
- source_word: בְּנוֹ צִפֹּר
  choice: con trai Xíp-bô
  rationale: Giữ nguyên cách xưng hô theo phụ danh trong tiếng Hê-bơ-rơ và âm Hê-bơ-rơ của tên riêng.
