  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và lời mời gọi kép trong tiếng Hê-bơ-rơ: Ba-lác được gọi đích danh, rồi được gọi theo phụ danh là con trai Xíp-bô. Tuy nhiên, “cất lời” một mình không biểu đạt đủ מְשָׁלוֹ, vốn là một lời tuyên bố có tính thi ca/trang trọng; chú thích hiện tại cũng diễn giải một lựa chọn từ vựng quá cụ thể.'
