  terminology: “Sư tử cái” là một lựa chọn có cơ sở cho לָבִיא và chú thích nêu minh bạch phương án rộng hơn là “sư tử”, đồng thời giải thích sự phân biệt với אֲרִי. “Những kẻ bị giết” chuyển đạt chính xác חֲלָלִים trong ngữ cảnh chiến trận. Hình ảnh bạo lực được giữ như ngôn ngữ ẩn dụ chiến thắng, không bị làm nhẹ hoặc diễn giải giáo phái.
