  source_fidelity: 'Bản dịch bám sát cấu trúc và hình ảnh của tiếng Hê-bơ-rơ: הֶן được chuyển tự nhiên là “Kìa”; עָם là “một dân”; hai thuật ngữ sư tử được phân biệt bằng “sư tử cái” và “sư tử”; các động từ diễn tả trỗi dậy, tự vươn lên, không nằm xuống, ăn mồi và uống máu người bị giết đều được giữ nguyên sức mạnh hình tượng. “Ăn mồi” phản ánh đúng động từ אָכַל, không cường điệu hóa thành “ngấu nghiến” hay “xé xác”.'
