id: NUM.23.24
reference: Numbers 23:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: vi
  text: Kìa, một dân trỗi dậy như sư tử cái[a], vươn mình lên như sư tử; nó sẽ không nằm xuống cho đến khi ăn mồi và uống máu những kẻ bị giết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sư tử”. Từ Hê-bơ-rơ לָבִיא có thể chỉ sư tử nói chung; “sư tử cái” giữ sự phân biệt với từ אֲרִי (“sư tử”) ở vế sau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Kìa
  rationale: Thán từ chỉ xuất, mở đầu một lời nhận xét đầy nhấn mạnh; “Kìa” trang trọng, tự nhiên và giữ được sức gợi của nguyên văn.
- source_word: עָם
  choice: một dân
  rationale: Chỉ tập thể dân Y-sơ-ra-ên; “một dân” giữ sắc thái tập thể trong lời thơ hơn “một quốc gia”.
- source_word: כְּלָבִיא
  choice: như sư tử cái
  rationale: לָבִיא có thể chỉ sư tử nói chung hoặc sư tử cái; cách dịch này giữ sự phân biệt từ vựng với אֲרִי ở vế kế tiếp.
- source_word: יָקוּם
  choice: trỗi dậy
  rationale: Động từ קום mô tả việc đứng dậy hay vùng dậy; “trỗi dậy” vừa tự nhiên trong tiếng Việt vừa hợp hình ảnh con thú đang vươn lên.
- source_word: וְכַאֲרִי
  choice: như sư tử
  rationale: אֲרִי là từ thông dụng chỉ sư tử; không thêm ý về tuổi, giống hay kích thước mà nguyên văn không xác định.
- source_word: יִתְנַשָּׂא
  choice: vươn mình lên
  rationale: Dạng Hitpael của נשׂא diễn tả tư thế tự nâng mình dậy; “vươn mình lên” giữ hình ảnh cụ thể, oai vệ của sư tử.
- source_word: לֹא יִשְׁכַּב
  choice: nó sẽ không nằm xuống
  rationale: Giữ hình ảnh cụ thể của con thú và sắc thái tương lai thích hợp trong lời sấm mang tính tiên báo.
- source_word: עַד יֹאכַל טֶרֶף
  choice: cho đến khi ăn mồi
  rationale: Dịch sát יֹאכַל là “ăn”, không tăng cường thành “ngấu nghiến”; טֶרֶף là con mồi hoặc chiến lợi phẩm bị xé bắt, ở đây phù hợp nhất là “mồi”.
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: và uống máu những kẻ bị giết
  rationale: חֲלָלִים trong ngữ cảnh chiến trận thường chỉ những người bị giết; giữ nguyên hình ảnh dữ dội của lời thơ.
theological_decisions:
- issue: Hình ảnh bạo lực trong lời sấm của Ba-la-am
  choice: Giữ nguyên hình ảnh ăn mồi và uống máu những kẻ bị giết như ẩn dụ về chiến thắng và sức mạnh không thể ngăn cản.
  alternative: Làm nhẹ thành ngôn ngữ chiến thắng chung chung.
  rationale: Nguyên văn cố ý dùng hình ảnh dữ dội. Bản dịch không làm dịu cũng không biến câu này thành mệnh lệnh uống máu theo nghĩa đen, nhưng bảo tồn sự căng thẳng của ẩn dụ chiến trận.
translation_notes:
  register: Văn phong thơ tiên tri trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “Kìa”, “trỗi dậy” và “vươn mình lên” để giữ nhịp mạnh cùng hình ảnh sư tử; không làm nhẹ hình ảnh máu và chiến trận.
