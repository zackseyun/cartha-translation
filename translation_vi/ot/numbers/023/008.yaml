base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: vi
  text: Làm sao tôi có thể nguyền rủa người mà Đức Chúa Trời không nguyền rủa? Làm sao tôi có thể lên án người mà Yahweh không lên án?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Làm sao tôi có thể phẫn nộ với người mà Yahweh không phẫn nộ với người ấy?” Động từ Hê-bơ-rơ trong vế thứ hai có thể nhấn mạnh sự phẫn nộ hoặc việc lên án.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Làm sao tôi có thể
  rationale: Trong câu hỏi tu từ này, מָה diễn tả sự bất khả hoặc không có cơ sở để hành động, hơn là hỏi thông tin; cách dịch này tự nhiên trong tiếng Việt.
- source_word: אֶקֹּב / קַבֹּה
  choice: nguyền rủa / không nguyền rủa
  rationale: Hai hình thức cùng một động từ được dịch nhất quán để giữ liên hệ từ vựng và phép song đối của câu thơ.
- source_word: אֵל
  choice: Đức Chúa Trời
  rationale: Ở đây אֵל là danh xưng chỉ Đức Chúa Trời; cách dịch quen thuộc, trang trọng và phân biệt với danh riêng Yahweh ở vế sau.
- source_word: אֶזְעֹם / זָעַם
  choice: lên án / không lên án
  rationale: זעם có thể chỉ sự phẫn nộ hoặc việc bày tỏ sự phẫn nộ bằng lời lên án. 'Lên án' phù hợp ngữ cảnh lời nguyền, đồng thời không đồng nhất động từ này với 'nguyền rủa' ở vế đầu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước, giữ sự phân biệt có chủ ý giữa אֵל và יְהוָה trong hai vế song song.
theological_decisions:
- issue: Phân biệt אֵל và יְהוָה trong phép song đối
  choice: Dịch אֵל là “Đức Chúa Trời” và יְהוָה là “Yahweh”
  alternative: Dịch cả hai bằng một danh xưng chung
  rationale: Nguyên văn dùng một danh xưng chung ở vế đầu và danh riêng YHWH ở vế sau; giữ sự khác biệt này phản ánh sát cấu trúc thần học và thi ca của tiếng Hê-bơ-rơ.
- issue: Sắc thái của זעם
  choice: Dùng “lên án” trong chính văn và ghi chú nghĩa “phẫn nộ”
  alternative: Dịch chính văn là “phẫn nộ với”
  rationale: Ngữ cảnh nhấn mạnh hành vi phát ngôn chống lại dân Y-sơ-ra-ên, nhưng động từ cũng có sắc thái tức giận; chú thích bảo tồn độ rộng nghĩa mà không ép câu vào một cách hiểu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Hai câu hỏi tu từ được giữ song song; “người mà” diễn đạt tự nhiên đối tượng số ít mang nghĩa tập thể trong nguyên văn.
