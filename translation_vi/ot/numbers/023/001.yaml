base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: vi
  text: 'Rồi Ba-la-am nói với Ba-lác: “Hãy xây cho tôi bảy bàn thờ tại đây, và hãy chuẩn bị cho tôi tại đây bảy con bò đực và bảy con cừu đực.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng kể chuyện với waw nối tiếp đưa trình thuật tiến lên; tiếng Việt tự nhiên không cần luôn dịch riêng liên từ bằng “rồi” hoặc “và”.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Phiên âm tên riêng theo lối quen dùng, dễ đọc trong tiếng Việt.
- source_word: בָּלָק
  choice: Ba-lác
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: בְּנֵה
  choice: hãy xây
  rationale: Mệnh lệnh trực tiếp của động từ בנה; “xây” là cách nói tự nhiên đối với bàn thờ.
- source_word: לִי
  choice: cho tôi
  rationale: Giữ ý hưởng lợi hoặc hướng đến người nói của giới từ לְ với hậu tố ngôi thứ nhất số ít.
- source_word: בָּזֶה
  choice: tại đây
  rationale: Trong ngữ cảnh, cụm này chỉ địa điểm; “tại đây” vừa tự nhiên vừa giữ sắc thái chỉ định.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: bảy bàn thờ
  rationale: Chuyển dịch trực tiếp cụm số lượng và danh từ.
- source_word: וְהָכֵן
  choice: và ... hãy chuẩn bị
  rationale: Mệnh lệnh Hifil của כון mang nghĩa làm cho sẵn sàng; “chuẩn bị” phù hợp với các con vật dùng để dâng tế.
- source_word: פָרִים
  choice: bò đực
  rationale: פַּר chỉ bò đực trong bối cảnh tế lễ; nguyên văn tại đây không nêu rõ độ tuổi nên không thêm “tơ”.
- source_word: אֵילִים
  choice: cừu đực
  rationale: אֵיל chỉ cừu giống đực; cách dịch này chính xác và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lặp lại “tại đây” để bảo toàn sự nhấn mạnh địa điểm hai lần trong tiếng Hê-bơ-rơ; đảo vị trí lần thứ hai để câu tiếng Việt trôi chảy mà vẫn giữ phép lặp.
