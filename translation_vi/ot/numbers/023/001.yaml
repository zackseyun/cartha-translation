  to: 'Rồi Ba-la-am nói với Ba-lác: “Hãy xây cho tôi bảy bàn thờ tại đây, và hãy chuẩn bị cho tôi tại đây bảy con bò đực và bảy con cừu đực.”'
  rationale: Thêm “Rồi” để biểu đạt nhẹ nhàng tiến triển tự sự của waw-consecutive, và thay cấu trúc có “cũng” bằng cấu trúc lặp lại “tại đây” không thêm sắc thái ngoài nguyên văn. Không cần chú thích, vì phép lặp địa điểm đã được thể hiện trực tiếp trong bản dịch.
