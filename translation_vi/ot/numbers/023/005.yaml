source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh đặt một lời vào miệng Ba-la-am và phán: “Hãy trở lại với Ba-lác và nói như thế này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: đặt
  rationale: Giữ hình ảnh cụ thể của שׂוּם và thành ngữ Hê-bơ-rơ về việc đặt lời vào miệng một người.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: דָּבָר
  choice: một lời
  rationale: Giữ số ít và sắc thái trực tiếp của דָּבָר; “sứ điệp” tuy có thể dùng nhưng mang tính diễn giải hơn.
- source_word: בְּפִי בִלְעָם
  choice: vào miệng Ba-la-am
  rationale: Diễn đạt tự nhiên trong tiếng Việt đồng thời bảo tồn hình ảnh Hê-bơ-rơ về lời được ban để nói ra.
- source_word: וַיֹּאמֶר
  choice: và phán
  rationale: Chủ thể là Yahweh; “phán” là động từ tiếng Việt trang trọng, tự nhiên khi Đức Chúa Trời nói.
- source_word: שׁוּב אֶל בָּלָק
  choice: Hãy trở lại với Ba-lác
  rationale: Thể hiện rõ mệnh lệnh trở về chỗ Ba-lác mà không thêm ý ngoài nguyên văn.
- source_word: וְכֹה תְדַבֵּר
  choice: và nói như thế này
  rationale: כֹה chỉ cách thức hoặc nội dung lời sắp nói; cách dịch này tự nhiên và giữ tính dẫn nhập mà không tự ý cung cấp nội dung.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn chức năng danh riêng và không thay bằng tước hiệu.
- issue: Nguồn của lời Ba-la-am sẽ nói
  choice: Yahweh đặt lời vào miệng Ba-la-am
  alternative: Yahweh ban một sứ điệp cho Ba-la-am
  rationale: Giữ nguyên hình ảnh mạnh của bản Hê-bơ-rơ, qua đó thể hiện lời nói được Yahweh cung cấp mà không giải thích thêm bản chất thần học của sự tác động ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Bấy giờ” để nối mạch tường thuật; giữ danh riêng theo dạng Ba-la-am và Ba-lác quen thuộc trong tiếng Việt. Không cần chú thích vì “nói như thế này” chuyển tải tự nhiên phạm vi nghĩa của וְכֹה תְדַבֵּר.
