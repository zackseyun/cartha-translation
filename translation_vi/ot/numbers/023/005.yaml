  source_fidelity: 'Bản dịch bám sát văn bản Hê-bơ-rơ: וַיָּשֶׂם được chuyển là “đặt”, giữ hình ảnh “đặt một lời vào miệng”; danh יהוה được giữ là “Yahweh”; và mệnh lệnh שׁוּב אֶל בָּלָק וְכֹה תְדַבֵּר được chuyển đầy đủ là “Hãy trở lại với Ba-lác và nói như thế này.” Cách “nói như thế này” thích hợp với công thức כֹּה mở đầu nội dung lời nói ở câu tiếp theo, không thêm hoặc thu hẹp nghĩa.'
  naturalness: Câu văn tự nhiên, hiện đại và vẫn giữ sắc thái trang trọng phù hợp lời tường thuật Kinh Thánh. “Phán” phù hợp chủ ngữ Yahweh; “Ba-la-am” và “Ba-lác” nhất quán với thông lệ phiên chuyển tiếng Việt. “Bấy giờ” nối mạch tường thuật cách trôi chảy.
  terminology: 'Các thuật ngữ và danh riêng nhất quán: “Yahweh” phản ánh trực tiếp Tetragrammaton; “một lời” giữ số ít của דָּבָר; “đặt ... vào miệng” bảo tồn thành ngữ nguồn. Không có thuật ngữ thần học nào bị diễn giải theo lập trường hệ phái.'
