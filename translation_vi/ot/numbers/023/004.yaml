  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: vi
  text: 'Đức Chúa Trời gặp Ba-la-am[a], và Ba-la-am nói với Ngài: “Tôi đã sắp đặt bảy bàn thờ và dâng một con bò đực cùng một con chiên đực trên bàn thờ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đức Chúa Trời gặp phải Ba-la-am”; động từ Hê-bơ-rơ chỉ một cuộc gặp và trong một số ngữ cảnh có thể gợi sắc thái gặp bất ngờ hoặc tình cờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: gặp
  rationale: Động từ קָרָה ở đây chỉ một cuộc gặp gỡ; “gặp” tự nhiên trong tiếng Việt và không hàm ý rằng Đức Chúa Trời tình cờ gặp Ba-la-am. Chú thích giữ lại sắc thái từ vựng khác có thể có.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít và ngữ cảnh cho thấy dạng số nhiều này được dùng làm danh xưng số ít chỉ Đức Chúa Trời.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: và ông thưa với Ngài
  rationale: Lời nói ngôi thứ nhất theo sau cho thấy chủ ngữ là Ba-la-am. “Thưa” diễn đạt tự nhiên việc một người nói với Đức Chúa Trời; viết hoa “Ngài” giúp làm rõ đối tượng mà không thay đổi nghĩa.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: bảy bàn thờ
  rationale: Cụm danh từ xác định nói đến bảy bàn thờ đã được biết trong ngữ cảnh; tiếng Việt không cần thêm từ tương đương mạo từ xác định.
- source_word: עָרַכְתִּי
  choice: Con đã sắp đặt
  rationale: עָרַךְ có nghĩa sắp xếp hoặc đặt theo trật tự. “Đã sắp đặt” giữ được tính hoàn tất của hành động và sát nghĩa hơn “chuẩn bị”.
- source_word: וָאַעַל
  choice: và dâng
  rationale: Trong ngữ cảnh tế lễ, עלה diễn tả việc dâng lễ vật lên; “dâng” là cách nói rõ ràng, tự nhiên trong tiếng Việt.
- source_word: פָּר
  choice: một con bò đực
  rationale: Cách dịch thông dụng và chính xác trong ngữ cảnh tế lễ; bản văn không buộc phải thêm nghĩa “non”.
- source_word: וָאַיִל
  choice: cùng một con chiên đực
  rationale: אַיִל chỉ chiên đực; “cùng” nối hai lễ vật tự nhiên mà vẫn phản ánh liên từ Hê-bơ-rơ.
- source_word: בַּמִּזְבֵּחַ
  choice: trên bàn thờ
  rationale: Giữ nguyên danh từ số ít có mạo từ trong tiếng Hê-bơ-rơ, không tự ý diễn giải thành “trên mỗi bàn thờ” dù ngữ cảnh có thể gợi ý nghĩa phân phối.
theological_decisions:
- issue: Tính chất của cuộc gặp trong וַיִּקָּר
  choice: Diễn đạt một cuộc gặp thật sự giữa Đức Chúa Trời và Ba-la-am mà không gợi ý sự ngẫu nhiên
  alternative: “Đức Chúa Trời tình cờ gặp Ba-la-am” hoặc “Đức Chúa Trời đến gặp Ba-la-am”
  rationale: Gốc từ có thể mang sắc thái gặp phải hay tình cờ trong một số ngữ cảnh, nhưng ở đây không nên áp đặt ý niệm rằng hành động của Đức Chúa Trời là ngẫu nhiên. Chú thích ghi nhận phạm vi nghĩa mà không giải quyết quá mức sự căng thẳng từ vựng.
- issue: Đối tượng của động từ nói trong וַיֹּאמֶר אֵלָיו
  choice: Xác định Ba-la-am là người nói với Đức Chúa Trời
  alternative: Để các đại từ “ông/người” có thể gây nhầm rằng Đức Chúa Trời là người nói
  rationale: Các động từ ngôi thứ nhất “con đã sắp đặt” và “dâng” xác nhận Ba-la-am là người nói; lựa chọn đại từ tiếng Việt làm rõ cú pháp chứ không thêm nội dung thần học.
- issue: Số lượng bàn thờ trong cụm cuối câu
  choice: Giữ số ít “trên bàn thờ”
  alternative: Diễn giải theo nghĩa phân phối là “trên mỗi bàn thờ”
  rationale: Ngữ cảnh về bảy bàn thờ có thể hỗ trợ cách hiểu phân phối, nhưng hình thức Hê-bơ-rơ là số ít xác định. Bản dịch chính giữ nguyên sự cô đọng và khả năng hiểu của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Chúa Trời”, “Ba-la-am”, “bàn thờ”, “dâng” theo cách gọi quen thuộc trong Kinh Thánh tiếng Việt. Trong lời trực tiếp, “Con… Ngài” phản ánh quan hệ người nói với Đức Chúa Trời và tránh sự mơ hồ về đại từ.
