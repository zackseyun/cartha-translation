base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: vi
  text: 'Ba-lác nói với ông: “Xin ông đi cùng tôi đến một nơi khác; từ đó ông sẽ thấy dân ấy.[b] Ông chỉ thấy một phần ở rìa của dân ấy,[a] chứ không thấy toàn thể dân ấy; rồi từ đó hãy nguyền rủa dân ấy cho tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ cũng có thể hiểu là “đầu mút của dân ấy” hoặc “phần xa nhất của dân ấy”; ý nói Ba-la-am chỉ nhìn thấy một phần dân Y-sơ-ra-ên.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng đại từ số ít (“người ấy”, “toàn thể người ấy”) để chỉ dân Y-sơ-ra-ên như một tập thể; trong tiếng Việt, câu này dịch là “dân ấy”.
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: Xin ông đi cùng tôi
  rationale: Mệnh lệnh הלך kết hợp với נָא mang sắc thái thỉnh cầu lịch sự. “Đi cùng tôi” tự nhiên trong tiếng Việt và diễn tả việc Ba-lác mời Ba-la-am cùng chuyển đến một địa điểm khác.
- source_word: מָקוֹם אַחֵר
  choice: một nơi khác
  rationale: Giữ nguyên ý cụ thể về một địa điểm quan sát khác, bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: từ đó ông có thể thấy dân ấy
  rationale: Diễn tả địa điểm mới như một vị trí quan sát. Đại từ tân ngữ số ít chỉ dân Y-sơ-ra-ên như một tập thể được chuyển thành “dân ấy” để vừa rõ nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: אֶפֶס קָצֵהוּ
  choice: chỉ thấy phần rìa của dân ấy
  rationale: אֶפֶס có tác dụng giới hạn, còn קָצֶה chỉ đầu mút, rìa hay phần ngoài cùng. “Phần rìa” bảo toàn hình ảnh không gian và ý rằng chỉ một phần dân chúng lọt vào tầm mắt.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: chứ không thấy toàn thể dân ấy
  rationale: “Chứ” thể hiện rõ sự tương phản giữa tầm nhìn một phần và toàn bộ; “toàn thể dân ấy” giữ ý tổng thể của כֻּלּוֹ.
- source_word: וְקָבְנוֹ לִי מִשָּׁם
  choice: rồi từ đó hãy nguyền rủa dân ấy cho tôi
  rationale: קבב là động từ chỉ việc nguyền rủa trong trình thuật Ba-la-am. “Rồi” thể hiện trình tự hành động, còn “từ đó” giữ lại điểm nhìn không gian được nhắc lại trong nguyên văn.
theological_decisions:
- issue: Các hậu tố đại từ số ít chỉ Y-sơ-ra-ên
  choice: Dùng “dân ấy” và “toàn thể dân ấy” trong câu chính
  alternative: Dùng đại từ số nhiều “họ” hoặc giữ hình thức số ít bằng “người ấy”
  rationale: Tiếng Hê-bơ-rơ dùng các hậu tố giống đực số ít để nói về Y-sơ-ra-ên như một dân tập thể. “Dân ấy” giữ được tính thống nhất của tập thể mà không gây hiểu lầm rằng đối tượng là một cá nhân.
- issue: Sắc thái của mệnh lệnh לך
  choice: Dịch thành lời thỉnh cầu “Xin ông đi cùng tôi”
  alternative: Dịch sát hơn là “Hãy đi với tôi”
  rationale: Tiểu từ נָא làm mềm mệnh lệnh. Cách dịch đã chọn phản ánh đúng lời đề nghị lịch sự, không biến nó thành một mệnh lệnh cứng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Tên riêng dùng dạng quen thuộc “Ba-lác”. Cấu trúc lời nói trực tiếp giữ nhịp rõ ràng; các lần lặp “dân ấy” có chủ ý nhằm bảo toàn quy chiếu tập thể của nguyên văn.
