  - severity: low
    issue: Thiếu chú thích cho phương án từ vựng của שָׂרִים
    rationale: Bản theo dõi tiếng Anh có chú thích neo tại “princes of Moab” cho phương án “officials”. Nên bảo tồn chú thích tương ứng tại “các thủ lĩnh Mô-áp”.
