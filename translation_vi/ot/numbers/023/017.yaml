  terminology: Giữ “Yahweh” cho יהוה theo quyết định dự án. “Các thủ lĩnh Mô-áp” là lựa chọn rộng, tự nhiên cho שָׂרֵי מוֹאָב; chú thích nêu phương án “các quan chức” và được đặt đúng tại cụm từ liên quan. “Của lễ thiêu” dịch nhất quán thuật ngữ tế tự עֹלָה.
  issues:
