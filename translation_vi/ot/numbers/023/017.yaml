  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: vi
  text: 'Ông đến chỗ vua; kìa, vua đang đứng bên cạnh của lễ thiêu của mình, cùng với các thủ lĩnh Mô-áp[a]. Ba-lác hỏi ông: “Yahweh đã phán điều gì?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: các quan chức Mô-áp.'
    reason: Phương án từ vựng cho שָׂרֵי מוֹאָב, tương ứng chú thích trong bản theo dõi tiếng Anh.
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: Ông đến gặp vua
  rationale: Động từ בוא có nghĩa cơ bản là “đến.” Hai đại từ được diễn đạt theo ngữ cảnh là Ba-la-am và vua Ba-lác để câu tiếng Việt rõ ràng, nhưng không thêm ý “trở lại” vốn không được nói trực tiếp trong tiếng Hê-bơ-rơ.
- source_word: וְהִנּוֹ
  choice: và kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái sống động của tiểu từ הִנֵּה.
- source_word: נִצָּב
  choice: đang đứng
  rationale: Phân từ diễn tả tư thế đang tiếp diễn khi Ba-la-am đến.
- source_word: עַל עֹלָתוֹ
  choice: bên lễ thiêu của mình
  rationale: Trong ngữ cảnh không gian này, עַל mang nghĩa “bên/cạnh”; עֹלָה là lễ vật được thiêu trọn vẹn, được dịch gọn và tự nhiên là “lễ thiêu.”
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: cùng với các thủ lĩnh Mô-áp
  rationale: שָׂרִים có thể chỉ các thủ lĩnh, quan chức hoặc người đứng đầu. “Các thủ lĩnh” tự nhiên, đủ rộng và phù hợp bối cảnh.
- source_word: מַה דִּבֶּר יְהוָה
  choice: Yahweh đã phán điều gì?
  rationale: דבר được dịch là “phán” khi chủ thể là Đức Chúa Trời; cấu trúc hỏi được chuyển tự nhiên sang tiếng Việt, còn danh riêng יהוה được phiên âm là Yahweh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản văn dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” để làm rõ đại từ chỉ Ba-lác trong vế đầu, tránh chuỗi “ông… ông” mơ hồ trong tiếng Việt; dùng các tên Ba-lác, Mô-áp theo dạng quen thuộc trong tiếng Việt.
