base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: vi
  text: Rồi Ba-lác dẫn Ba-la-am đến Cánh đồng Xô-phim[a], trên đỉnh Phít-ga. Ông dựng bảy bàn thờ và dâng một con bò đực cùng một con chiên đực trên mỗi bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cánh đồng của những người canh gác.” Từ Hê-bơ-rơ có thể được hiểu là tên địa danh Xô-phim hoặc là một cụm từ mô tả.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: Rồi Ba-lác dẫn Ba-la-am
  rationale: Động từ לקח với hậu tố ngôi thứ ba số ít diễn tả Ba-lác đưa Ba-la-am sang địa điểm kế tiếp. Nêu tên hai nhân vật giúp tiếng Việt rõ nghĩa mà không thay đổi chủ thể và đối tượng đã có trong ngữ cảnh.
- source_word: שְׂדֵה צֹפִים
  choice: Cánh Đồng Xô-phim
  rationale: Cụm từ có thể là tên địa danh hoặc mang nghĩa mô tả là “cánh đồng của những người canh gác”. Bản chính giữ dạng địa danh để không quyết đoán ý nghĩa; chú thích bảo tồn cách hiểu theo nghĩa từ vựng.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: trên đỉnh Phít-ga
  rationale: רֹאשׁ trong địa hình có nghĩa là đỉnh; הַפִּסְגָּה được hiểu là địa danh Phít-ga. Giới từ “trên” diễn đạt tự nhiên vị trí đích trong tiếng Việt.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: Ông dựng bảy bàn thờ
  rationale: Dịch trực tiếp בנה là “dựng” trong ngữ cảnh lập bàn thờ; đại từ tiếp tục chỉ Ba-lác theo mạch kể.
- source_word: וַיַּעַל
  choice: dâng
  rationale: עלה trong ngữ cảnh tế lễ có nghĩa là dâng lễ vật lên; “dâng” là cách diễn đạt tự nhiên, trang trọng và không thêm loại tế lễ ngoài câu gốc.
- source_word: פָּר וָאַיִל
  choice: một con bò đực cùng một con chiên đực
  rationale: Hai danh từ số ít chỉ một con thuộc mỗi loại. “Chiên đực” phân biệt אַיִל với cách gọi rộng hơn là chiên.
- source_word: בַּמִּזְבֵּחַ
  choice: trên mỗi bàn thờ
  rationale: 'Dù danh từ trong tiếng Hê-bơ-rơ ở số ít, bối cảnh bảy bàn thờ và các câu song song cho thấy ý phân phối: một cặp lễ vật trên từng bàn thờ.'
