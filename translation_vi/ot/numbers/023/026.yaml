  text: וַ/יַּ֣עַן בִּלְעָ֔ם וַ/יֹּ֖אמֶר אֶל בָּלָ֑ק הֲ/לֹ֗א דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כֹּ֛ל אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֶֽעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: vi
  text: 'Ba-la-am đáp lời Ba-lác: “Chẳng phải tôi đã nói với ông rằng: ‘Mọi điều Yahweh phán, tôi sẽ làm’[a] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Mọi điều Yahweh phán, điều ấy tôi sẽ làm.”'
    reason: Bản dịch chính tránh lặp không cần thiết trong tiếng Việt; chú thích bảo lưu cấu trúc hồi chỉ nhấn mạnh của tiếng Hê-bơ-rơ אֹתוֹ אֶעֱשֶׂה.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: đáp lời
  rationale: Công thức gồm hai động từ theo nghĩa đen là “đáp và nói”; “đáp lời” diễn đạt tự nhiên chức năng đối thoại trong tiếng Việt mà không lặp nặng nề.
- source_word: הֲלֹא
  choice: Chẳng phải ... sao?
  rationale: Giữ hình thức câu hỏi tu từ, vốn chờ người nghe xác nhận.
- source_word: דִּבַּרְתִּי אֵלֶיךָ לֵאמֹר
  choice: tôi đã nói với vua rằng
  rationale: Diễn đạt tự nhiên cấu trúc “tôi đã nói với ông rằng”; dùng “vua” làm đại từ xưng hô phù hợp việc Ba-lác là vua và giúp lời thoại tiếng Việt trang trọng, rõ quan hệ giao tiếp.
- source_word: כֹּל אֲשֶׁר
  choice: Mọi điều
  rationale: Giữ trọn ý nghĩa bao quát của cụm Hê-bơ-rơ, đồng thời phù hợp với mệnh đề theo sau.
- source_word: יְדַבֵּר יְהוָה
  choice: Yahweh phán
  rationale: “Phán” là động từ tiếng Việt tự nhiên khi nói về lời Đức Chúa Trời; dạng chưa hoàn thành ở đây nêu nguyên tắc chung về bất cứ điều nào Yahweh truyền phán.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: tôi sẽ làm
  rationale: Đại từ chỉ đối tượng trong tiếng Hê-bơ-rơ quy chiếu lại “mọi điều”; tiếng Việt không cần lặp “điều ấy” mà vẫn giữ rõ cam kết của Ba-la-am.
theological_decisions:
- issue: Cách chuyển danh riêng יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Giữ “Yahweh” như một danh riêng, thay vì thay thế bằng tước hiệu, tránh che khuất sự hiện diện của danh này trong câu.
- issue: Tính chất lời cam kết của Ba-la-am
  choice: “Mọi điều Yahweh phán, tôi sẽ làm”
  alternative: “Tôi chỉ có thể làm điều Yahweh phán”
  rationale: Nguyên văn là lời khẳng định về điều Ba-la-am sẽ làm, không trực tiếp nói “chỉ có thể” hay nêu rõ sự bất lực; bản dịch không thêm cách giải thích thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Tên riêng được phiên âm quen thuộc là “Ba-la-am” và “Ba-lác”; trong lời trực tiếp, “vua” được dùng làm cách xưng hô tự nhiên với Ba-lác.
