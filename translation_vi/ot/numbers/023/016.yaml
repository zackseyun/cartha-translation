  rationale: Chỉnh nhẹ để thành ngữ tiếng Việt tự nhiên hơn và để chú thích phản ánh, với đúng vị trí neo, biến thể từ vựng chính của nguyên văn được ghi nhận trong hồ sơ kiểm tra tiếng Anh. Nghĩa và sắc thái không bị mở rộng.
