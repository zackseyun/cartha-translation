  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: vi
  text: 'Yahweh gặp[a] Ba-la-am, đặt lời vào miệng ông và phán: “Hãy trở lại với Ba-lác và nói như thế này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến gặp” hoặc “chạm mặt” Ba-la-am.'
    reason: Động từ וַיִּקָּר có thể diễn tả việc gặp gỡ hoặc chạm mặt; cách dịch không xác định thêm hình thức cuộc gặp.
lexical_decisions:
- source_word: וַיִּקָּר
  choice: gặp
  rationale: Động từ קָרָה ở đây diễn tả một cuộc gặp hay sự chạm mặt. “Gặp” tự nhiên trong tiếng Việt, giữ được tính trực tiếp mà không diễn giải thành một sự hiện ra trong khải tượng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: đặt một lời vào miệng ông
  rationale: Bám sát thành ngữ Hê-bơ-rơ về lời được Đức Chúa Trời ban để nói; “một lời” cũng bảo toàn dạng số ít của דָּבָר.
- source_word: דָּבָר
  choice: một lời
  rationale: Trong ngữ cảnh này, từ ấy chỉ lời cụ thể Ba-la-am phải truyền lại. “Một lời” gần nguyên văn hơn “một sứ điệp” mà vẫn dễ hiểu.
- source_word: שׁוּב
  choice: Hãy trở lại
  rationale: Mệnh lệnh yêu cầu Ba-la-am quay lại chỗ Ba-lác; cách dịch này trang trọng, rõ ràng và tự nhiên.
- source_word: וְכֹה תְדַבֵּר
  choice: và nói như thế này
  rationale: כֹה với דבר dẫn vào nội dung lời sắp được công bố. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và vẫn giữ sắc thái giới thiệu lời truyền phán.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự YHWH; giữ “Yahweh” bảo toàn danh riêng thay vì thay bằng tước hiệu.
- issue: Tác quyền của lời Ba-la-am sắp nói
  choice: đặt một lời vào miệng ông
  alternative: trao cho ông một sứ điệp
  rationale: Giữ nguyên hình ảnh của bản Hê-bơ-rơ, nhấn mạnh rằng lời công bố bắt nguồn từ Yahweh mà không diễn giải thêm cơ chế linh cảm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ thành ngữ Hê-bơ-rơ “đặt một lời vào miệng” vì hình ảnh này rõ nghĩa trong tiếng Việt; tên Ba-la-am và Ba-lác theo lối phiên âm Kinh Thánh quen thuộc.
