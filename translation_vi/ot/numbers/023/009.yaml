source:
  edition: WLC
  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: vi
  text: Vì từ đỉnh các vách đá, tôi thấy dân ấy; từ các ngọn đồi, tôi ngắm nhìn dân ấy. Kìa, một dân sống riêng biệt, không kể mình vào hàng các dân tộc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được kể vào hàng các dân tộc.” Động từ Hê-bơ-rơ có thể được hiểu theo nghĩa bị động, cũng như theo nghĩa phản thân hoặc trung gian.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng liên kết, dẫn vào lời giải thích trong sấm ngôn của Ba-la-am.
- source_word: מֵרֹאשׁ צֻרִים
  choice: từ đỉnh các vách đá
  rationale: Diễn đạt tự nhiên hình ảnh địa hình và điểm quan sát trên cao; צֻרִים chỉ các khối đá hoặc vách đá.
- source_word: אֶרְאֶנּוּ
  choice: tôi thấy dân ấy
  rationale: Hậu tố tân ngữ số ít giống đực quy chiếu tập thể đến Y-sơ-ra-ên; tiếng Việt dùng “dân ấy” để vừa rõ đối tượng vừa giữ nét quy chiếu tập thể.
- source_word: וּמִגְּבָעוֹת אֲשׁוּרֶנּוּ
  choice: từ các ngọn đồi, tôi ngắm nhìn dân ấy
  rationale: Giữ phép song đối với vế trước; “ngắm nhìn” thể hiện sắc thái nhìn chăm chú của שׁור và phân biệt với ראה.
- source_word: הֶן
  choice: Kìa
  rationale: Tiểu từ chỉ thị nhằm thu hút sự chú ý; “Kìa” trang trọng, ngắn gọn và vẫn tự nhiên trong văn thơ Kinh Thánh.
- source_word: עָם לְבָדָד יִשְׁכֹּן
  choice: một dân sống riêng biệt
  rationale: Diễn đạt tình trạng đặc thù hoặc thường xuyên mà không ép thể chưa hoàn thành thành nghĩa hoàn toàn hiện tại hay tương lai; “riêng biệt” phù hợp hơn “cô độc” trong ngữ cảnh.
- source_word: וּבַגּוֹיִם לֹא יִתְחַשָּׁב
  choice: không kể mình vào hàng các dân tộc
  rationale: Giữ cách hiểu phản thân/trung gian khả hữu của Hitpael יִתְחַשָּׁב; “vào hàng” diễn đạt tự nhiên ý xếp hoặc tính chung vào một nhóm.
theological_decisions:
- issue: יִתְחַשָּׁב nên được hiểu theo nghĩa phản thân hay bị động
  choice: không kể mình vào hàng các dân tộc
  alternative: không được kể vào hàng các dân tộc
  rationale: Dạng Hitpael có thể mang nghĩa phản thân/trung gian hoặc bị động. Bản chính giữ nghĩa phản thân khả hữu, còn chú thích bảo tồn cách hiểu bị động mà không biến sự riêng biệt của Y-sơ-ra-ên thành một tuyên bố về ưu thế dân tộc.
translation_notes:
  register: Văn phong thơ, trang trọng nhưng hiện đại và dễ hiểu. Dùng “dân ấy” thay cho đại từ giống đực vốn không tự nhiên trong tiếng Việt; giữ tính tập thể của đối tượng. Dấu chú thích [a] đặt ngay sau mệnh đề có cách hiểu khác.
