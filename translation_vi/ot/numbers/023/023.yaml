source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: vi
  text: 'Vì không có thuật bói điềm chống lại Gia-cốp,

    cũng không có thuật chiêm đoán chống lại Y-sơ-ra-ên.[a]

    Đúng lúc, người ta sẽ nói với Gia-cốp và Y-sơ-ra-ên:

    “Đức Chúa Trời đã làm nên biết bao điều!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì không có thuật bói điềm ở giữa Gia-cốp, cũng không có thuật chiêm đoán ở giữa Y-sơ-ra-ên.” Giới từ Híp-ri có thể được hiểu theo nhiều cách; trong mạch văn này, “chống lại” có vẻ phù hợp hơn.'
    reason: alternative_reading
  - marker: b
    text: 'Cụm từ Híp-ri cũng có thể được chấm thành câu hỏi: “Đức Chúa Trời đã làm gì?”'
    reason: alternative_reading
lexical_decisions:
- source_word: נַחַשׁ
  choice: thuật bói điềm
  rationale: Danh từ chỉ việc tìm điềm báo để đoán định; cách dịch này phân biệt tự nhiên với קֶסֶם trong tiếng Việt.
- source_word: קֶסֶם
  choice: thuật chiêm đoán
  rationale: Chỉ hoạt động huyền thuật nhằm bói đoán. Cụm từ trang trọng, dễ hiểu và giữ được sự phân biệt tương đối với נַחַשׁ.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: chống lại Gia-cốp / chống lại Y-sơ-ra-ên
  rationale: Trong lời sấm của Ba-la-am, giới từ ב được hiểu theo nghĩa các thuật huyền bí không có hiệu lực chống lại dân được Đức Chúa Trời ban phước. Tuy vậy, nghĩa sát mặt chữ “ở giữa” vẫn có thể có, nên được ghi ở chú thích.
- source_word: כָּעֵת
  choice: đúng lúc
  rationale: Diễn đạt ngắn gọn sắc thái “vào lúc thích hợp/đến thời điểm ấy” mà không xác định quá mức là ngay bây giờ hay một thời điểm xa hơn.
- source_word: יֵאָמֵר
  choice: người ta sẽ nói
  rationale: Chuyển thể bị động vô nhân xưng Híp-ri sang cấu trúc tự nhiên trong tiếng Việt, đồng thời giữ sắc thái tương lai.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: với Gia-cốp và Y-sơ-ra-ên
  rationale: Giữ hướng nghĩa thông thường của giới từ לְ mà không quyết định rằng lời này chỉ nói “về” dân Y-sơ-ra-ên.
- source_word: מַה פָּעַל אֵל
  choice: Đức Chúa Trời đã làm nên việc kỳ diệu biết bao!
  rationale: Hiểu מַה theo sắc thái cảm thán và פָּעַל là hành động đã hoàn tất. “Biết bao” giúp câu cảm thán rõ, còn “việc kỳ diệu” diễn đạt tự nhiên sức nặng tu từ của lời công bố.
- source_word: אֵל
  choice: Đức Chúa Trời
  rationale: Danh xưng phổ thông dành cho Đức Chúa Trời; không mở rộng thành một tước hiệu thần học mà nguyên văn không đòi hỏi.
theological_decisions:
- issue: Câu đầu phủ nhận việc thực hành huyền thuật trong Y-sơ-ra-ên hay phủ nhận hiệu lực của huyền thuật chống lại Y-sơ-ra-ên
  choice: Các thuật bói toán không thể chống lại Gia-cốp/Y-sơ-ra-ên.
  alternative: Không có việc bói điềm hay chiêm đoán ở giữa Gia-cốp/Y-sơ-ra-ên.
  rationale: Mạch văn lời sấm nhấn mạnh rằng lời nguyền không thể thắng dân đã được Đức Chúa Trời ban phước. Tuy nhiên, vì giới từ ב có thể mang nghĩa “trong/ở giữa”, phương án ấy được bảo tồn trong chú thích.
- issue: מַה פָּעַל אֵל là câu hỏi hay câu cảm thán
  choice: 'Câu cảm thán: “Đức Chúa Trời đã làm nên việc kỳ diệu biết bao!”'
  alternative: 'Câu hỏi: “Đức Chúa Trời đã làm gì?”'
  rationale: Lời sấm đạt đến cao trào bằng việc công bố hành động của Đức Chúa Trời; cách hiểu cảm thán phù hợp hơn với lực tu từ, nhưng cách chấm câu hỏi vẫn có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Hai dòng đầu có nhịp song song của thơ Híp-ri. Các thuật ngữ “bói điềm” và “chiêm đoán” tránh sắc thái quá khẩu ngữ, đồng thời không đồng nhất hoàn toàn hai từ nguồn.
