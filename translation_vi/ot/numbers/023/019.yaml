id: NUM.23.19
reference: Numbers 23:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: vi
  text: 'Đức Chúa Trời không phải là người để nói dối,

    cũng không phải là con người[a] để đổi ý[b].

    Ngài đã phán, lẽ nào Ngài không làm?

    Ngài đã nói, lẽ nào Ngài không thực hiện[c]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con người” dịch một thành ngữ Hê-bơ-rơ chỉ một người phàm, không phải tước hiệu Đấng Mê-si.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “thay đổi ý định” hoặc “nguôi đi”; theo truyền thống đôi khi được dịch là “ăn năn”. Ở đây động từ nói đến việc thay đổi đường hướng hay ý định, nhấn mạnh Đức Chúa Trời đáng tin cậy chứ không nói đến sự ăn năn về lỗi đạo đức.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “làm cho thành hiện thực”, “xác nhận” hoặc “làm cho đứng vững”. Tiếng Hê-bơ-rơ theo nghĩa đen là “làm cho nó đứng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, אֵל chỉ Đức Chúa Trời của Y-sơ-ra-ên; cách dịch này tự nhiên, trang trọng và giữ rõ sự tương phản với loài người.
- source_word: אִישׁ
  choice: người
  rationale: Tiếng Việt dùng “người” tự nhiên hơn “người nam” trong mệnh đề khái quát này, đồng thời vẫn giữ được sự tương phản giữa Đức Chúa Trời và con người.
- source_word: וִיכַזֵּב
  choice: để nói dối
  rationale: כזב ở đây diễn tả nói điều giả dối hoặc tỏ ra không thành thật; “nói dối” rõ nghĩa và phù hợp với trọng tâm về sự đáng tin cậy của Đức Chúa Trời.
- source_word: בֶן אָדָם
  choice: con loài người
  rationale: Giữ hình thức thi ca gần với tiếng Hê-bơ-rơ và song song với “người”, nhưng dùng “loài người” để cho thấy đây là thành ngữ chỉ một con người, không phải tước hiệu Đấng Mê-si.
- source_word: וְיִתְנֶחָם
  choice: để đổi ý
  rationale: Dạng hitpael của נחם trong văn cảnh nói đến thay đổi ý định hoặc nguôi đi. “Đổi ý” là tiếng Việt hiện đại, tránh hàm ý Đức Chúa Trời phải ăn năn về lỗi đạo đức.
- source_word: הַהוּא אָמַר
  choice: Ngài đã phán
  rationale: Cấu trúc trần thuật của tiếng Hê-bơ-rơ kết hợp với vế sau tạo thành câu hỏi tu từ; tiếng Việt thể hiện tự nhiên bằng “Ngài đã phán, lẽ nào...?”
- source_word: יַעֲשֶׂה
  choice: Ngài không làm
  rationale: עשה có nghĩa rộng là làm hoặc hành động; ở đây đối tượng được ngầm hiểu là điều Ngài đã phán.
- source_word: וְדִבֶּר
  choice: Ngài đã nói
  rationale: Bản dịch trực tiếp, đồng thời duy trì sự song song thi ca với “đã phán” ở dòng trước.
- source_word: יְקִימֶנָּה
  choice: Ngài không thực hiện
  rationale: Hiphil của קום theo nghĩa đen là “làm cho đứng vững”, và trong ngữ cảnh lời đã nói có nghĩa làm cho lời ấy thành hiện thực. “Thực hiện” tự nhiên hơn trong tiếng Việt, còn hình ảnh nguyên ngữ được ghi chú.
theological_decisions:
- issue: Ngôn ngữ về sự không thay đổi của Đức Chúa Trời trong וְיִתְנֶחָם
  choice: đổi ý
  alternative: nguôi đi; hối tiếc; ăn năn
  rationale: Câu này nhấn mạnh Đức Chúa Trời đáng tin cậy và không thất thường như con người. “Đổi ý” truyền đạt điểm ấy mà không mở rộng câu thành một khẳng định triết học vượt quá văn bản, cũng không gợi ý sự ăn năn đạo đức nơi Đức Chúa Trời.
- issue: Có nên hiểu בֶן אָדָם là tước hiệu Đấng Mê-si hay không
  choice: thành ngữ thông thường “con loài người”, nghĩa là một con người
  alternative: tước hiệu “Con Người”
  rationale: Trong Dân Số 23:19, cụm từ nằm trong phép song song thi ca với אִישׁ và chỉ loài người nói chung, không đóng vai trò một tước hiệu Đấng Mê-si.
translation_notes:
  register: Văn phong Việt ngữ hiện đại, trang trọng và dễ hiểu. Bố cục bốn dòng giữ phép song song thi ca của nguyên văn. Đại từ “Ngài” thể hiện sự tôn kính thông dụng mà không thêm nội dung giáo phái. Các câu hỏi tu từ dùng “lẽ nào” để truyền đạt sức nhấn mạnh tự nhiên.
