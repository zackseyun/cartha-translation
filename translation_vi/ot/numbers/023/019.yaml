  terminology: “Đức Chúa Trời,” “Ngài,” “phán,” và “lẽ nào” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại, trang trọng. Ghi chú cần mô tả đây là thành ngữ Hê-bơ-rơ chỉ người phàm, không phải tước hiệu, thay vì gọi chính cụm tiếng Việt “con loài người” là thành ngữ.
