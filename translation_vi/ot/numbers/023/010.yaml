source:
  edition: WLC
  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: vi
  text: 'Ai đếm nổi bụi đất của Gia-cốp,

    hay đếm được một phần tư dân Y-sơ-ra-ên?[a]

    Nguyện linh hồn tôi chết cái chết của những người ngay thẳng,[b]

    và kết cuộc của tôi giống như kết cuộc của người ấy.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các phần tư của Y-sơ-ra-ên,” hoặc theo lối giải nghĩa: “dù chỉ một phần tư dân Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những người công chính.”'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hê-bơ-rơ dùng hậu tố giống đực số ít, có thể hiểu là “như người ấy” hoặc, theo phần được lược trong câu, “như kết cuộc của người ấy,” dù “những người ngay thẳng” ở trước là số nhiều. Số ít có thể chỉ một người ngay thẳng mang tính đại diện.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: מִי מָנָה
  choice: Ai đếm nổi
  rationale: Câu hỏi tu từ hàm ý không ai có khả năng đếm; “đếm nổi” diễn đạt tự nhiên sắc thái bất khả ấy trong tiếng Việt.
- source_word: עֲפַר יַעֲקֹב
  choice: bụi đất của Gia-cốp
  rationale: Giữ nguyên hình ảnh thơ về hậu duệ đông như bụi đất và tên giao ước Gia-cốp trong thế song song với Y-sơ-ra-ên.
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: hay đếm được một phần tư dân Y-sơ-ra-ên
  rationale: Diễn đạt cụm danh từ theo lối động từ tự nhiên trong tiếng Việt; רֹבַע được giữ theo nghĩa thông thường là “một phần tư”, không thay bằng cách giải thích “đám đông”.
- source_word: תָּמֹת נַפְשִׁי
  choice: Nguyện linh hồn tôi chết
  rationale: Giữ נַפְשִׁי làm chủ ngữ và sắc thái ước nguyện của thể động từ, đồng thời bảo tồn văn phong thi ca.
- source_word: מוֹת יְשָׁרִים
  choice: cái chết của những người ngay thẳng
  rationale: יְשָׁרִים là số nhiều và chỉ những người ngay thẳng; cách dịch này giữ sắc thái đạo đức mà không mặc nhiên áp đặt một thuật ngữ thần học hệ thống.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: và kết cuộc của tôi
  rationale: אַחֲרִית ở đây chỉ kết cuộc hay hậu vận, song song với cái chết; “kết cuộc” vừa rõ nghĩa vừa trang trọng.
- source_word: כָּמֹהוּ
  choice: giống như kết cuộc của người ấy
  rationale: Giữ hậu tố giống đực số ít của tiếng Hê-bơ-rơ. Lặp lại “kết cuộc” để câu tiếng Việt rõ nghĩa hơn cách nói mơ hồ “giống như người ấy”.
theological_decisions:
- issue: Cách hiểu יְשָׁרִים
  choice: những người ngay thẳng
  alternative: những người công chính
  rationale: “Ngay thẳng” gần với trường nghĩa của ישר hơn và không thu hẹp câu vào một phạm trù pháp lý-thần học, trong khi vẫn giữ đầy đủ ý nghĩa đạo đức và tôn giáo.
- issue: Cách hiểu רֹבַע יִשְׂרָאֵל
  choice: một phần tư dân Y-sơ-ra-ên
  alternative: đám đông Y-sơ-ra-ên; các khu trại của Y-sơ-ra-ên
  rationale: Giữ nghĩa trực tiếp, phổ biến của רֹבַע và không giải quyết thay người đọc hình ảnh có phần khó của nguyên văn; ý rằng ngay cả một phần tư dân ấy cũng không thể đếm nổi vẫn hiện rõ trong ngữ cảnh.
- issue: Số ít trong כָּמֹהוּ sau יְשָׁרִים số nhiều
  choice: người ấy
  alternative: họ
  rationale: 'Bảo tồn sự căng thẳng ngữ pháp của nguyên văn: nhóm “những người ngay thẳng” có thể được quy tụ vào một người ngay thẳng mang tính đại diện, nhưng bản dịch không xác quyết thêm danh tính hay giáo lý nào.'
translation_notes:
  register: Văn phong thi ca, trang trọng nhưng hiện đại. Dùng “đếm nổi” để câu hỏi tu từ tự nhiên trong tiếng Việt; giữ “linh hồn tôi” và cấu trúc ước nguyện để phản ánh sát hình thức nguyên văn. Các tên riêng theo dạng Gia-cốp và Y-sơ-ra-ên quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
