    rationale: Từ này có thể mang sắc thái luân lý, nhưng “đồi bại” dễ gợi một dạng suy đồi đặc thù. “Điều bất chính” rộng hơn và phù hợp hơn với tính mở của từ Hê-bơ-rơ.
