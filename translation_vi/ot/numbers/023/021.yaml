  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: vi
  text: 'Ngài chẳng nhìn thấy tai họa nơi Gia-cốp,

    cũng chẳng thấy cảnh khốn khổ trong Y-sơ-ra-ên.[a]

    Yahweh, Đức Chúa Trời của dân ấy, ở cùng dân ấy,[b]

    và tiếng reo hô của một vị vua vang lên giữa dân ấy.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài chẳng thấy gian ác nơi Gia-cốp, cũng chẳng thấy điều bất chính trong Y-sơ-ra-ên.” Hai từ Hê-bơ-rơ có thể mang nghĩa luân lý như “gian ác”, hoặc chỉ tai họa, khổ nhọc và hoạn nạn.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ dùng số ít: “Đức Chúa Trời của người ấy ở cùng người ấy”, vì Y-sơ-ra-ên được nói đến như một tập thể thống nhất.'
    reason: lexical_alternative
  - marker: c
    text: Cụm từ “tiếng reo hô của một vị vua” có thể chỉ tiếng tung hô vua giữa dân Y-sơ-ra-ên, và có lẽ gợi đến sự hiện diện của Yahweh với tư cách Vua; nguyên văn không nói rõ.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: nhìn thấy
  rationale: Diễn đạt hành động nhìn hoặc nhận thấy, đồng thời giữ sự song song tự nhiên với רָאָה trong câu thơ.
- source_word: אָוֶן
  choice: tai họa
  rationale: Từ này có thể chỉ điều ác, tội lỗi, tai họa hoặc khốn khó. Trong lời chúc phước của Ba-la-am, “tai họa” phù hợp với nét nghĩa hoạn nạn mà không loại bỏ cách hiểu luân lý, vốn được ghi ở chú thích.
- source_word: רָאָה
  choice: thấy
  rationale: Cách dịch trực tiếp, gọn và tự nhiên của động từ chỉ sự nhìn thấy.
- source_word: עָמָל
  choice: cảnh khốn khổ
  rationale: Giữ nét nghĩa khổ nhọc, hoạn nạn hoặc đau khổ, đồng thời phân biệt với אָוֶן ở vế trước.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: nơi Gia-cốp / trong Y-sơ-ra-ên
  rationale: Hiểu giới từ ב theo nghĩa vị trí trong cấu trúc song song, với Gia-cốp và Y-sơ-ra-ên chỉ dân giao ước.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: Đức Chúa Trời của họ, ở cùng họ
  rationale: Nguyên văn dùng hậu tố số ít vì xem Y-sơ-ra-ên như một tập thể thống nhất; tiếng Việt dùng số nhiều để chỉ toàn dân một cách tự nhiên, và ghi rõ hình thức số ít trong chú thích.
- source_word: תְרוּעַת
  choice: tiếng reo hô
  rationale: Bao quát âm thanh lớn có thể là tiếng hoan hô, tung hô hoặc tiếng xung trận, không xác định quá mức sắc thái.
- source_word: מֶלֶךְ
  choice: một vị vua
  rationale: Danh từ không có mạo từ xác định; cách dịch này giữ nguyên việc câu Hê-bơ-rơ không nói rõ vị vua là ai.
- source_word: בּוֹ
  choice: giữa họ
  rationale: Nguyên văn là “trong người ấy”, quy chiếu về Y-sơ-ra-ên như một tập thể số ít; “giữa họ” truyền đạt tự nhiên ý nghĩa tập thể trong tiếng Việt.
theological_decisions:
- issue: Câu này nói Y-sơ-ra-ên không có tội hay nói không có tai họa/khốn khổ đang ngự trị trên họ
  choice: Bản chính dùng “tai họa” và “cảnh khốn khổ”, nhấn mạnh hoàn cảnh được ban phước và sự hiện diện bảo vệ của Đức Chúa Trời.
  alternative: “Ngài chẳng thấy gian ác nơi Gia-cốp, cũng chẳng thấy điều đồi bại trong Y-sơ-ra-ên.”
  rationale: אָוֶן và עָמָל đều có phạm vi nghĩa gồm cả điều xấu về luân lý lẫn hoạn nạn, khổ nhọc. Ngữ cảnh lời chúc phước ủng hộ nét nghĩa tai họa, nhưng cách hiểu luân lý vẫn có thật và được bảo lưu trong chú thích.
- issue: “Vua” có trực tiếp chỉ Yahweh hay không
  choice: Giữ cách nói “tiếng reo hô của một vị vua” mà không xác định vị vua.
  alternative: “tiếng tung hô Đức Vua” hoặc “tiếng reo mừng vua của họ”
  rationale: Ngữ cảnh có thể gợi đến sự hiện diện vương quyền của Yahweh, nhưng nguyên văn không trực tiếp đồng nhất “vua” với Ngài; vì vậy bản dịch giữ sự mơ hồ.
translation_notes:
  register: Văn phong thơ trang trọng nhưng hiện đại, dùng các tên quen thuộc Gia-cốp và Y-sơ-ra-ên. Đại từ “họ” giúp câu tự nhiên trong tiếng Việt hiện đại; chú thích bảo lưu hình thức tập thể số ít của nguyên văn. Các dòng được ngắt theo cấu trúc song song của câu Hê-bơ-rơ.
