  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר אָמַ֣ר בִּלְעָ֑ם וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: vi
  text: Vậy Ba-lác làm theo lời Ba-la-am và dâng một con bò đực cùng một con cừu đực trên bàn thờ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Trong kết cấu với כַּאֲשֶׁר אָמַר, động từ עשה mang nghĩa làm theo điều đã được nói; “làm” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: כַּאֲשֶׁר אָמַר
  choice: theo lời
  rationale: Cụm này diễn tả sự làm đúng theo điều Ba-la-am đã nói; “theo lời” gọn, tự nhiên và giữ quan hệ tuân theo chỉ dẫn.
- source_word: וַיַּעַל
  choice: dâng
  rationale: Trong ngữ cảnh tế lễ, עלה chỉ việc dâng sinh tế lên bàn thờ; “dâng” là cách diễn đạt trang trọng, thông dụng và không cần thêm ý không có trong câu.
- source_word: פָּר
  choice: một con bò đực
  rationale: Cách gọi hiện đại, rõ ràng cho con vật đực được dùng làm sinh tế.
- source_word: אַיִל
  choice: một con cừu đực
  rationale: Diễn đạt chính xác loài và giới tính của con vật, dễ hiểu hơn từ ngữ cổ hoặc chuyên biệt.
- source_word: בַּמִּזְבֵּחַ
  choice: trên bàn thờ
  rationale: Giới từ ב trong ngữ cảnh tế lễ chỉ vị trí dâng lễ vật trên bàn thờ; đây là cách nói tự nhiên trong tiếng Việt.
- source_word: וַ
  choice: Vậy
  rationale: Liên từ mở đầu nối hành động này với chỉ thị trước đó và mang sắc thái kết quả; “Vậy” thể hiện mạch kể tự nhiên.
