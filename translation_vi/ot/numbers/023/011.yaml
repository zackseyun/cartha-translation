base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: vi
  text: 'Bấy giờ, Ba-lác nói với Ba-la-am: “Ông đã làm gì tôi thế này? Tôi đưa ông đến để nguyền rủa kẻ thù của tôi, thế mà ông lại quả thật chúc phước cho chúng!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng một động từ cùng với nguyên mẫu tuyệt đối để nhấn mạnh; sát nghĩa là “chúc phước, ông đã chúc phước”, cũng có thể dịch là “ông quả đã chúc phước”.
    reason: Giải thích cấu trúc nhấn mạnh בֵּרַכְתָּ בָרֵךְ và bảo lưu khả năng diễn đạt khác.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... nói
  rationale: Dạng tự sự với waw nối tiếp đưa câu chuyện tiến lên; “Bấy giờ” diễn đạt trình tự tự nhiên trong tiếng Việt.
- source_word: מֶה עָשִׂיתָ לִי
  choice: Ông đã làm gì cho tôi thế này?
  rationale: Giữ câu hỏi trực tiếp và sắc thái trách móc, kinh ngạc của Ba-lác; “thế này” là cách nói tự nhiên trong tiếng Việt cho hành động vừa xảy ra và đang gây hậu quả.
- source_word: לָקֹב
  choice: để nguyền rủa
  rationale: Động từ קבב ở đây chỉ việc tuyên lời nguyền trên một người hay một dân.
- source_word: אֹיְבַי
  choice: kẻ thù của tôi
  rationale: Chuyển tải trực tiếp danh từ số nhiều có hậu tố sở hữu; tiếng Việt không bắt buộc đánh dấu số nhiều khi ý nghĩa đã rõ.
- source_word: לְקַחְתִּיךָ
  choice: Tôi đưa ông đến
  rationale: לקח có nghĩa cơ bản là “lấy/đem/đưa”; trong ngữ cảnh, “đưa ông đến” tự nhiên hơn “lấy ông” và không diễn giải quá mức thành “thuê ông”.
- source_word: וְהִנֵּה
  choice: thế mà ... lại
  rationale: Diễn đạt sự tương phản và kinh ngạc do וְהִנֵּה tạo ra bằng lối nói hiện đại, tự nhiên trong tiếng Việt.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: quả thật chúc phước
  rationale: Động từ hữu hạn đi với nguyên mẫu tuyệt đối tạo sức nhấn mạnh; “quả thật” giữ ý xác quyết mạnh mà không thêm nghĩa “chỉ làm mỗi việc này” vốn không được nói trực tiếp trong tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cách phiên âm tên riêng “Ba-lác” và “Ba-la-am”. Đại từ “ông/tôi” phù hợp với lời đối thoại giữa hai nhân vật nam có địa vị, đồng thời giữ sắc thái quở trách mà không thô tục.
