  text: וַ/יֹּ֨אמֶר֙ אֶל בָּלָ֔ק הִתְיַצֵּ֥ב כֹּ֖ה עַל עֹלָתֶ֑/ךָ וְ/אָנֹכִ֖י אִקָּ֥רֶה כֹּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: vi
  text: 'Ông nói với Ba-lác: “Hãy đứng đây bên lễ thiêu của ông, còn tôi sẽ đi gặp ở đằng kia[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi sẽ gặp tại đó” hoặc “tôi sẽ được gặp tại đó.” Động từ Hê-bơ-rơ rất cô đọng và không nêu rõ đối tượng của cuộc gặp; ngữ cảnh có thể gợi một cuộc gặp với Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: Ông nói với Ba-lác
  rationale: Dùng lối kể chuyện tự nhiên trong tiếng Việt; chủ thể được diễn đạt bằng “ông” theo mạch văn, còn liên từ kể chuyện không cần dịch máy móc.
- source_word: הִתְיַצֵּב
  choice: Hãy đứng
  rationale: Mệnh lệnh Hitpael diễn tả việc đứng vào vị trí và ở lại đó; “hãy đứng” rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: כֹּה
  choice: đây
  rationale: Trong ngữ cảnh chỉ địa điểm, từ này mang nghĩa chỉ xuất gần, tương phản với địa điểm được nhắc ở cuối câu.
- source_word: עַל עֹלָתֶךָ
  choice: bên lễ vật thiêu của ông
  rationale: עַל ở đây chỉ vị trí bên hoặc tại lễ vật; עֹלָה là lễ vật được thiêu trọn. “Của ông” giữ đại từ sở hữu ngôi thứ hai mà không thêm tước vị không có trong nguyên văn.
- source_word: וְאָנֹכִי
  choice: còn tôi
  rationale: 'Đại từ ngôi thứ nhất được nêu rõ để tạo thế tương phản nhẹ: Ba-lác đứng lại đây, còn Ba-la-am đi nơi khác.'
- source_word: אִקָּרֶה
  choice: sẽ đi gặp Ngài
  rationale: Động từ Niphal của קרה rất cô đọng và chỉ một cuộc gặp hay chạm mặt. Cách dịch này tự nhiên trong tiếng Việt và phản ánh chuyển động hàm ý trong ngữ cảnh, nhưng ghi chú cho biết nguyên văn không nêu đối tượng.
- source_word: כֹּה
  choice: ở đằng kia
  rationale: Lần xuất hiện thứ hai chỉ một địa điểm khác với chỗ Ba-lác đứng; “ở đằng kia” giữ rõ thế đối chiếu đây/kia.
theological_decisions:
- issue: Đối tượng không được nêu của cuộc gặp mà Ba-la-am dự định
  choice: Dùng “Ngài” trong câu chính, theo ngữ cảnh chỉ Đức Chúa Trời, đồng thời ghi chú rằng nguyên văn không nêu đối tượng.
  alternative: Dịch vô đối tượng là “tôi sẽ gặp ở đó” hoặc theo thể bị động là “tôi sẽ được gặp ở đó”.
  rationale: Mạch truyện cho thấy Ba-la-am trông đợi cuộc gặp với Đức Chúa Trời, nhưng câu Hê-bơ-rơ này vẫn cô đọng và không gọi đích danh đối tượng. Ghi chú bảo toàn sự mơ hồ thật sự của nguyên văn, tránh biến suy luận theo ngữ cảnh thành điều được nói minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lễ vật thiêu” để diễn đạt đúng loại tế lễ; giữ thế đối chiếu tự nhiên giữa “đây” và “đằng kia”. Đại từ “ông” dành cho Ba-lác tránh tự ý thêm tước hiệu, còn “Ngài” trong mệnh đề cuối phản ánh đối tượng được hiểu theo ngữ cảnh và được giải thích bằng chú thích.
