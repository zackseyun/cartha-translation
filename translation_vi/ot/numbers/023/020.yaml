  edition: WLC
  text: הִנֵּ֥ה בָרֵ֖ךְ לָקָ֑חְתִּי וּ/בֵרֵ֖ךְ וְ/לֹ֥א אֲשִׁיבֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: vi
  text: Này, tôi đã nhận để chúc phước[a]; Ngài đã chúc phước[b], và tôi không thể đảo ngược điều ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “tôi đã nhận để chúc phước”; nguyên văn không nói rõ điều được nhận là gì.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn không nêu riêng chủ ngữ của “đã chúc phước”; ngữ cảnh cho thấy đó là Đức Chúa Trời.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “tôi không thể thu hồi điều ấy” hoặc “tôi không thể làm điều ấy quay lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Từ này có chức năng thu hút sự chú ý; “Này” trang trọng, tự nhiên và gọn trong lời tuyên bố.
- source_word: בָרֵךְ
  choice: để chúc phước
  rationale: Dạng này được hiểu là bổ ngữ chỉ nội dung hoặc mục đích đi với לָקָחְתִּי; cách dịch giữ quan hệ cú pháp mà không thêm danh từ “mệnh lệnh” vốn không hiện diện rõ trong tiếng Hê-bơ-rơ.
- source_word: לָקָחְתִּי
  choice: tôi đã nhận lời
  rationale: Động từ mang nghĩa cơ bản là “lấy/nhận”; “nhận lời” diễn đạt tự nhiên việc tiếp nhận một lời phán hoặc sứ điệp trong ngữ cảnh tiên tri, đồng thời tránh xác định quá mức vật được nhận.
- source_word: וּבֵרֵךְ
  choice: Ngài đã chúc phước
  rationale: Động từ hoàn thành ngôi ba số ít giống đực không nêu chủ ngữ riêng; ngữ cảnh hướng mạnh đến Đức Chúa Trời. Đại từ “Ngài” diễn đạt điều này tự nhiên và tôn kính.
- source_word: אֲשִׁיבֶנָּה
  choice: tôi không thể đảo ngược điều đó
  rationale: Dạng Hiphil của שוב ở đây chỉ việc làm cho quay lại, tức hủy bỏ hoặc đảo ngược lời chúc phước. “Đảo ngược điều đó” rõ nghĩa mà vẫn giữ hình ảnh căn bản của động từ.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của וּבֵרֵךְ
  choice: Dịch là “Ngài”, theo ngữ cảnh chỉ Đức Chúa Trời, và chú thích rằng nguyên văn không nêu danh từ làm chủ ngữ.
  alternative: Dịch vô nhân xưng hoặc giữ “người đã chúc phước”.
  rationale: Ngữ cảnh gần cho thấy Ba-la-am không thể đảo ngược điều Đức Chúa Trời đã làm, nhưng hình thái tiếng Hê-bơ-rơ chỉ mã hóa ngôi ba số ít giống đực. Chú thích bảo tồn sự hàm ẩn của nguyên văn.
- issue: Đối tượng hàm ẩn của לָקָחְתִּי
  choice: Dùng “nhận lời” và chú thích rằng nguyên văn chỉ nói “đã nhận”.
  alternative: Thêm rõ “nhận mệnh lệnh” hoặc dịch sát “đã nhận để chúc phước”.
  rationale: “Mệnh lệnh” có thể phù hợp ngữ cảnh nhưng không được nêu trực tiếp. “Lời” đủ tự nhiên trong tiếng Việt mà không khóa nghĩa vào một loại phát ngôn cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Này” để giữ sức nhấn của הִנֵּה; “chúc phước” phù hợp ngữ vực Kinh Thánh phổ thông. Cấu trúc ngắn, dứt khoát, tương ứng lời tuyên bố của Ba-la-am.
