  source_fidelity: Cần bỏ “lời” trong “đã nhận lời”, vì nguyên văn chỉ có “tôi đã nhận/lấy” với điều được nhận không được nêu rõ. Cụm “đã nhận để chúc phước” giữ được sự lược bỏ này và quan hệ với động từ “chúc phước”. “Ngài đã chúc phước” phản ánh đúng động từ hoàn thành ngôi ba số ít; chú thích cần cho biết chủ ngữ không được nêu minh thị trong câu Hê-bơ-rơ.
