  terminology: '“Chúc phước” là thuật ngữ Kinh Thánh Việt ngữ thông dụng và phù hợp với ברך. “Đảo ngược” diễn đạt hợp ngữ cảnh nghĩa Hiphil của שוב: làm quay lại, bãi bỏ hay đảo lại điều đã được chúc.'
