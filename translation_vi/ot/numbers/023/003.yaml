  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: vi
  text: 'Ba-la-am nói với Ba-lác: “Hãy đứng bên lễ vật thiêu của ngài, còn tôi sẽ đi. Biết đâu Yahweh sẽ đến gặp tôi; Ngài cho tôi thấy điều gì thì tôi sẽ báo lại cho ngài.” Rồi ông đi đến một nơi cao trơ trụi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một nơi cao hoang” hoặc “một ngọn đồi trơ trụi.” Từ Hê-bơ-rơ hiếm gặp này dường như chỉ một nơi cao trống trải, không cây cối.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: Hãy đứng bên lễ thiêu của vua
  rationale: Mệnh lệnh Hitpael diễn tả việc đứng vào vị trí; עַל trong kết cấu này mang nghĩa không gian là “bên/cạnh,” còn עֹלָה là lễ vật được thiêu trọn. Đại từ ngôi hai hướng đến vua Ba-lác được chuyển thành “vua” theo lối xưng hô tự nhiên trong bối cảnh quân vương.
- source_word: וְאֵלְכָה
  choice: còn tôi sẽ đi
  rationale: Dạng cohortative diễn tả ý định của Ba-la-am. “Còn tôi sẽ đi” làm rõ sự tương ứng giữa việc Ba-lác đứng lại và Ba-la-am rời đi.
- source_word: אוּלַי
  choice: Biết đâu
  rationale: Giữ sắc thái hy vọng nhưng không chắc chắn của trạng từ chỉ khả năng, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: Yahweh sẽ đến gặp tôi
  rationale: Niphal của קרה trong ngữ cảnh nói đến một cuộc gặp xảy đến. “Đến gặp tôi” là cách diễn đạt tự nhiên; sắc thái bất định đã được bảo toàn bằng “Biết đâu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וּדְבַר מַה יַּרְאֵנִי וְהִגַּדְתִּי לָךְ
  choice: Ngài cho tôi thấy điều gì, tôi sẽ báo lại cho vua điều ấy
  rationale: Giữ nghĩa trực tiếp của Hiphil ראה là “cho thấy” và của נגד là “báo lại”; kết cấu “điều gì… điều ấy” chuyển đạt tự nhiên mệnh đề bất định, hơi cô đọng trong tiếng Hê-bơ-rơ.
- source_word: שֶׁפִי
  choice: một ngọn đồi trơ trụi
  rationale: Từ hiếm này nhiều khả năng chỉ một nơi cao trống trải, không cây cối. “Ngọn đồi trơ trụi” giữ nét địa hình mà không biến nó thành một thuật ngữ nghi lễ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH; giữ “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của cuộc gặp giữa Yahweh và Ba-la-am
  choice: Biết đâu Yahweh sẽ đến gặp tôi
  alternative: Có lẽ Yahweh sẽ tình cờ gặp tôi
  rationale: Bản dịch bảo toàn sự không chắc chắn trong lời Ba-la-am qua “Biết đâu,” nhưng không thêm ý thần học rằng cuộc gặp là ngẫu nhiên đối với Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” khi Ba-la-am thưa với Ba-lác để phản ánh địa vị quân vương và tránh đại từ thiếu tự nhiên; dùng “ông” trong lời kể để chỉ Ba-la-am. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
