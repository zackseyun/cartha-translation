base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: vi
  text: 'Ông cất lời thi ca[a] và nói:


    “Ba-lác, vua Mô-áp, đã dẫn tôi đến từ A-ram,


    từ những ngọn núi phương đông[b]:


    ‘Hãy đến, nguyền rủa Gia-cốp cho ta;


    hãy đến, rủa sả Y-sơ-ra-ên[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời sấm.” Thành ngữ Hê-bơ-rơ có nghĩa đen là “ông cất mashal của mình lên,” chỉ một lời phát biểu trang trọng theo thể thơ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “từ miền núi phía đông.” Cụm từ này rất có thể chỉ vùng nằm về phía đông của Mô-áp.
    reason: lexical_alternative
  - marker: c
    text: Động từ ở đây khác với động từ được dịch là “nguyền rủa” ở dòng trước. Nó cũng có thể được dịch là “lên án” hoặc “nguyền rủa,” nhưng “rủa sả” giữ sự phân biệt trong cách diễn đạt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Ông cất lời thi ca
  rationale: Thành ngữ Hê-bơ-rơ, sát nghĩa là “ông cất mashal của mình lên,” giới thiệu một lời phát biểu trang trọng theo thể thơ. “Cất lời thi ca” tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành tục ngữ hay mặc nhiên xác định đây là lời sấm.
- source_word: מִן אֲרָם
  choice: Từ A-ram
  rationale: Giữ địa danh A-ram thay vì thay bằng tên địa chính trị về sau là Sy-ri.
- source_word: יַנְחֵנִי
  choice: đã dẫn tôi đến
  rationale: Thể Hiphil của נחה diễn tả việc dẫn dắt hoặc hướng dẫn. Từ “đến” giúp câu tiếng Việt tự nhiên trong ngữ cảnh Ba-lác triệu Ba-la-am từ nơi xa, nhưng không chỉ rõ một địa điểm không có trong nguyên văn.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: từ những ngọn núi phương đông
  rationale: Trong ngữ cảnh địa lý song song với A-ram, קֶדֶם hợp lý nhất mang nghĩa không gian là “phương đông,” dù ở ngữ cảnh khác từ này có thể liên quan đến thời xa xưa.
- source_word: לְכָה
  choice: Hãy đến
  rationale: Mệnh lệnh này là lời mời gọi hoặc triệu gọi; “hãy đến” tự nhiên và giữ được sắc thái trực tiếp.
- source_word: אָרָה
  choice: nguyền rủa
  rationale: Động từ trực tiếp chỉ hành động tuyên lời nguyền; “nguyền rủa” chính xác và thông dụng.
- source_word: לִּי
  choice: cho ta
  rationale: Giới từ đánh dấu lợi ích của Ba-lác. “Cho ta” hợp với lời của một vị vua và vẫn tự nhiên trong tiếng Việt.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Giữ tên riêng theo dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: זֹעֲמָה
  choice: kết án
  rationale: Động từ này khác với אָרָה ở vế trước và mang sắc thái công kích, nguyền rủa hoặc biểu lộ thịnh nộ. “Kết án” duy trì sự phân biệt từ vựng; chú thích lưu lại khả năng dịch mạnh hơn là “rủa sả.”
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Giữ tên riêng/dân tộc theo dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Mối quan hệ giữa Gia-cốp và Y-sơ-ra-ên trong lời yêu cầu được trích dẫn
  choice: Giữ cả hai tên như hai cách gọi song song về cùng dân giao ước.
  alternative: Gộp lại thành một danh xưng tập thể như “dân Y-sơ-ra-ên.”
  rationale: Nguyên văn cố ý dùng cặp tên Gia-cốp/Y-sơ-ra-ên trong phép song đối thi ca. Giữ nguyên cả hai bảo tồn âm hưởng văn chương và giao ước mà không thêm một cách giải thích giáo lý.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu, đồng thời trình bày theo dòng thơ để phản ánh hình thức thi ca của lời Ba-la-am. Đại từ “ta” phù hợp với lời truyền của vua Ba-lác. Các tên riêng dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
