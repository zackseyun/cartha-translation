  text: וַ/יָּ֣שָׁב אֵלָ֔י/ו וְ/הִנֵּ֥ה נִצָּ֖ב עַל עֹלָת֑/וֹ ה֖וּא וְ/כָל שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: vi
  text: Rồi ông trở lại với Ba-lác, và kìa, vua đang đứng bên lễ thiêu của mình, cùng với tất cả các thủ lĩnh Mô-áp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: Rồi ông trở lại với Ba-lác
  rationale: Động từ שׁוב diễn tả việc trở lại; nêu tên Ba-lác để làm rõ đại từ chỉ người trong tiếng Việt mà không thay đổi đối tượng theo văn cảnh.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ sắc thái trình hiện, thu hút sự chú ý của הִנֵּה trong lời kể.
- source_word: נִצָּב עַל עֹלָתוֹ
  choice: đang đứng bên lễ thiêu của mình
  rationale: נִצָּב chỉ tư thế đứng; עַל trong ngữ cảnh này mang nghĩa ở bên/cạnh, còn עֹלָה là lễ vật được thiêu trọn.
- source_word: שָׂרֵי מוֹאָב
  choice: các thủ lĩnh Mô-áp
  rationale: שַׂר có thể chỉ quan chức, người đứng đầu hoặc thủ lĩnh; 'thủ lĩnh' tự nhiên và không ấn định một tước vị hành chính quá cụ thể.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “vua” cho chủ thể Ba-lác ở vế sau để tránh lặp tên và làm rõ hai đại từ nam giống nhau trong nguyên ngữ; không thêm chú giải vì văn cảnh xác định rõ các nhân vật.
