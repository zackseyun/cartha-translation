  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: vi
  text: 'Đức Chúa Trời đưa họ ra khỏi Ai Cập;

    Ngài có cho người ấy sức mạnh như của bò rừng.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ Hê-bơ-rơ này khó hiểu. Cũng có thể dịch: “Ngài có cho người ấy những chiếc sừng của bò rừng.” Hậu tố «người ấy» là số ít trong khi «họ» ở vế trước là số nhiều; có thể quy chiếu Israel như một tập thể. «Bò rừng» có lẽ chỉ loài bò rừng cổ, không phải kỳ lân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Đức Chúa Trời
  rationale: Danh từ אֵל làm chủ ngữ; “Đức Chúa Trời” là cách dịch rõ ràng, trang trọng và tự nhiên trong ngữ cảnh lời sấm của Ba-la-am.
- source_word: מוֹצִיאָם
  choice: đưa họ ra
  rationale: Phân từ Hiphil của יצא với hậu tố ngôi ba số nhiều diễn tả Đức Chúa Trời là Đấng đưa họ ra. Thì hiện tại bảo toàn sắc thái thi ca sống động và hành động mang tính đặc trưng, dù ám chỉ biến cố xuất hành.
- source_word: מִמִּצְרָיִם
  choice: khỏi Ai Cập
  rationale: Đi với động từ chỉ chuyển động, “ra khỏi Ai Cập” là cách diễn đạt tự nhiên và thể hiện rõ hình ảnh xuất hành.
- source_word: כְּתוֹעֲפֹת
  choice: sức mạnh như sừng
  rationale: תּוֹעֲפֹת là từ khó, có thể gợi đến sừng vươn cao, uy lực hoặc sức mạnh. Cách dịch này giữ cả ý sức mạnh lẫn hình ảnh cụ thể của sừng, không thuần túy trừu tượng hóa.
- source_word: רְאֵם
  choice: bò rừng
  rationale: רְאֵם chỉ một loài bò hoang dã hùng mạnh, có lẽ bò rừng cổ, chứ không phải sinh vật thần thoại một sừng. “Bò rừng” dễ hiểu hơn tên động vật học chuyên biệt.
- source_word: לוֹ
  choice: Ngài có
  rationale: Hậu tố ngôi ba giống đực số ít được giữ ở dạng số ít. Trong mạch văn, đại từ có thể quy chiếu theo cách nhìn tập thể về Israel hoặc tiếp tục nói về Đức Chúa Trời; bản dịch không đổi thành số nhiều.
theological_decisions:
- issue: Hình ảnh רְאֵם
  choice: bò rừng
  alternative: bò rừng cổ; kỳ lân
  rationale: Cách dịch này phù hợp nhất với bằng chứng từ vựng hiện nay, giữ hình ảnh sức mạnh của loài bò hoang dã mà không biến câu thơ thành một khẳng định về sinh vật thần thoại.
- issue: Chủ thể của לוֹ
  choice: Giữ đại từ số ít “Ngài”
  alternative: “họ” hoặc “dân ấy”
  rationale: Bản Masoret có hậu tố số ít, trong khi mệnh đề trước dùng số nhiều. Việc giữ số ít bảo toàn sự chuyển đổi ngữ pháp và nét mơ hồ của nguyên văn thay vì âm thầm làm phẳng câu.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng hiện đại. Dùng “Đức Chúa Trời” và “Ngài” theo lối tiếng Việt Kinh Thánh quen thuộc; chú thích bảo toàn khó khăn từ vựng và sự chuyển đổi số nhiều sang số ít trong tiếng Hê-bơ-rơ.
