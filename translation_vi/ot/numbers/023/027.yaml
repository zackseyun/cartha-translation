base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: vi
  text: 'Ba-lác nói với Ba-la-am: “Xin ông đến; tôi sẽ đưa ông đến một nơi khác. Biết đâu điều ấy sẽ đẹp ý Đức Chúa Trời[a], để ông nguyền rủa dân ấy cho tôi từ đó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “được xem là đúng trước mắt Đức Chúa Trời.” Thành ngữ Hê-bơ-rơ có thể chỉ điều được xem là đúng hoặc làm hài lòng trong mắt một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  choice: Xin ông đi với tôi
  rationale: Mệnh lệnh לְכָה kèm נָּא là lời mời hoặc khẩn khoản lịch sự. Trong ngữ cảnh Ba-lác đề nghị chuyển sang một địa điểm khác, “Xin ông đi với tôi” tự nhiên hơn cách dịch từng chữ.
- source_word: אֶקָּחֲךָ
  choice: tôi sẽ đưa ông
  rationale: Dạng vị hoàn ngôi thứ nhất có sắc thái ý chí sau lời mời; “tôi sẽ đưa ông” diễn đạt tự nhiên việc Ba-lác chủ động dẫn Ba-la-am đến địa điểm mới.
- source_word: מָקוֹם אַחֵר
  choice: một nơi khác
  rationale: Giữ nguyên ý nghĩa cụ thể về một địa điểm hay vị trí quan sát khác.
- source_word: אוּלַי
  choice: Biết đâu
  rationale: Diễn đạt hy vọng không chắc chắn của Ba-lác bằng một thành ngữ Việt ngữ tự nhiên, không làm tăng mức độ xác quyết.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: điều ấy sẽ đẹp ý Đức Chúa Trời
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa là điều gì đó đúng hoặc làm hài lòng trong mắt một người. “Đẹp ý Đức Chúa Trời” tự nhiên, trang trọng và giữ được sắc thái thuận ý; “điều ấy” chỉ hành động nguyền rủa từ địa điểm mới.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong mạch truyện, từ này chỉ chính Đức Chúa Trời mà Ba-la-am thỉnh cầu, chứ không phải một thần linh bất định.
- source_word: וְקַבֹּתוֹ לִי
  choice: ông có thể nguyền rủa dân ấy giúp tôi
  rationale: Động từ קבב nghĩa là “nguyền rủa”; hậu tố số ít nhìn Y-sơ-ra-ên như một tập thể. Tiếng Việt dùng “dân ấy” để làm rõ đối tượng mà không gây nhầm với một cá nhân. Cấu trúc “có thể” phù hợp với niềm hy vọng được Đức Chúa Trời cho phép trong mệnh đề trước.
- source_word: מִשָּׁם
  choice: từ đó
  rationale: Giữ rõ ý nghĩa không gian gắn với địa điểm mới.
theological_decisions:
- issue: Đối tượng được gọi là הָאֱלֹהִים trong lời Ba-lác
  choice: Đức Chúa Trời
  alternative: vị thần ấy / thần linh
  rationale: Ngữ cảnh trực tiếp cho thấy Ba-lác đang nói về Đức Chúa Trời là Đấng giới hạn lời Ba-la-am. Cách dịch này nhận diện đúng đối tượng trong mạch truyện mà không đưa thêm một cách hiểu đa thần.
- issue: Sắc thái của יִישַׁר בְּעֵינֵי
  choice: đẹp ý Đức Chúa Trời
  alternative: được xem là phải trước mắt Đức Chúa Trời
  rationale: Nguyên ngữ cho phép cả sắc thái “đúng” lẫn “làm hài lòng.” “Đẹp ý” phù hợp với hy vọng vụ lợi của Ba-lác rằng đề nghị của mình lần này sẽ được chấp thuận, nhưng không hàm ý Đức Chúa Trời thực sự thay đổi ý định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên riêng theo lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt. Không cần chú thích vì sắc thái “đúng/đẹp ý” đã được thể hiện tự nhiên trong chính văn và không có biến thể văn bản cần báo cho độc giả.
