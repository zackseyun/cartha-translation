- from: 'Ba-lác nói với Ba-la-am: “Đừng nguyền rủa dân ấy, cũng đừng chúc phước cho họ!”[a]'
  to: 'Ba-lác nói với Ba-la-am: “Đừng hề nguyền rủa dân ấy, cũng đừng hề chúc phước cho dân ấy!”[a]'
  rationale: Bản sửa giữ nguyên nghĩa và tính song song của câu, đồng thời diễn đạt trong bản chính sự nhấn mạnh có mặt ở cả hai vế tiếng Hê-bơ-rơ. “Dân ấy” diễn đạt tự nhiên hậu tố đối tượng số ít giống đực, vốn quy chiếu tập thể đến dân Y-sơ-ra-ên trong ngữ cảnh.
