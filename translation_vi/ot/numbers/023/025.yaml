base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: vi
  text: 'Ba-lác nói với Ba-la-am: “Đừng hề nguyền rủa dân ấy, cũng đừng hề chúc phước cho dân ấy!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ theo nghĩa đen: “nguyền rủa, đừng nguyền rủa nó … chúc phước, đừng chúc phước nó”; mỗi vế dùng một động từ nguyên thể tuyệt đối trước một động từ đã chia để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng kể chuyện với waw nối tiếp được diễn đạt tự nhiên bằng “nói”; mạch nối với câu trước đã được ngữ cảnh tiếng Việt thể hiện.
- source_word: בָּלָק / בִּלְעָם
  choice: Ba-lác / Ba-la-am
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc và dễ đọc.
- source_word: גַּם ... גַּם
  choice: đừng ... cũng đừng
  rationale: Trong hai mệnh đề phủ định song song, cách diễn đạt này truyền đạt tự nhiên ý “cả điều này cũng không, cả điều kia cũng không”.
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: Đừng nguyền rủa dân ấy
  rationale: קבב chỉ hành động nguyền rủa trong trình thuật Ba-la-am; đại từ số ít giống đực quy chiếu tập thể về dân Y-sơ-ra-ên nên “dân ấy” rõ nghĩa trong tiếng Việt.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: cũng đừng chúc phước cho họ
  rationale: ברך là “chúc phước”; “họ” tiếp tục quy chiếu tự nhiên về tập thể dân ấy. Cấu trúc phủ định song song giữ mệnh lệnh dứt khoát của Ba-lác.
