base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: vi
  text: 'Bấy giờ, Ba-la-am nói với Ba-lác: “Hãy xây cho tôi bảy bàn thờ tại đây, và chuẩn bị cho tôi tại đây bảy con bò đực cùng bảy con chiên đực.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên trình tự ấy trong tiếng Việt.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: אֶל בָּלָק
  choice: với Ba-lác
  rationale: Trong công thức dẫn lời, “nói với” là cách diễn đạt tự nhiên của tiếng Việt cho אֶל.
- source_word: בְּנֵה לִי בָזֶה שִׁבְעָה מִזְבְּחֹת
  choice: Hãy xây cho tôi bảy bàn thờ tại đây
  rationale: Giữ nguyên mệnh lệnh, sắc thái lợi ích của לִי, địa điểm của בָזֶה và số lượng cụ thể.
- source_word: וְהָכֵן לִי בָזֶה
  choice: và chuẩn bị cho tôi tại đây
  rationale: Hiphil mệnh lệnh của כון mang nghĩa làm cho sẵn sàng; “chuẩn bị” phù hợp ngữ cảnh tế lễ.
- source_word: שִׁבְעָה פָרִים
  choice: bảy con bò đực
  rationale: פָרִים chỉ bò đực dùng làm sinh tế; bản văn tại đây không buộc phải thêm ý “tơ” hay “non”.
- source_word: וְשִׁבְעָה אֵילִים
  choice: cùng bảy con chiên đực
  rationale: אֵילִים là chiên đực; “cùng” nối hai nhóm con vật tự nhiên mà vẫn bảo toàn cấu trúc liệt kê.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại “cho tôi ... tại đây” vì bản Hê-bơ-rơ lặp cả לִי và בָזֶה trong hai mệnh lệnh; không giản lược dù tiếng Việt có thể gọn hơn.
