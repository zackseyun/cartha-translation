- from: Ba-lác làm đúng như Ba-la-am đã nói. Ba-lác và Ba-la-am dâng một con bò đực và một con chiên đực trên mỗi bàn thờ.[a]
  to: Ba-lác làm đúng như Ba-la-am đã nói. Ba-lác và Ba-la-am dâng một con bò đực và một con chiên đực trên bàn thờ.
  rationale: Chỉnh «trên mỗi bàn thờ» thành «trên bàn thờ» để bám sát số ít của nguyên văn và bản dịch tiếng Anh trong hồ sơ kiểm tra, đồng thời không phủ nhận bối cảnh bảy bàn thờ ở câu trước. Loại chú thích vì nó chỉ cần thiết để giải thích phần thêm vào nay đã được bỏ.
