  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בִּלְעָ֑ם וַ/יַּ֨עַל בָּלָ֧ק וּ/בִלְעָ֛ם פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: vi
  text: Ba-lác làm đúng như Ba-la-am đã nói. Ba-lác và Ba-la-am dâng một con bò đực và một con chiên đực trên bàn thờ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Trong thành ngữ עשה כאשר דבר, động từ mang nghĩa thực hiện điều đã được nói hoặc chỉ dẫn; “làm” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: đúng như ... đã nói
  rationale: Cụm so sánh diễn tả Ba-lác làm theo lời Ba-la-am; “đúng như” nêu rõ sự phù hợp, còn “đã nói” thể hiện lời nói có trước hành động.
- source_word: וַיַּעַל
  choice: dâng
  rationale: Dạng Hiphil của עלה trong ngữ cảnh tế lễ là thuật ngữ chỉ việc dâng lễ vật; “dâng” rõ ràng và trang trọng trong tiếng Việt hiện đại.
- source_word: בָּלָק וּבִלְעָם
  choice: Ba-lác và Ba-la-am
  rationale: Giữ nguyên hai chủ thể phối hợp của động từ theo văn bản Hê-bơ-rơ.
- source_word: פָּר
  choice: một con bò đực
  rationale: פָּר chỉ bò đực dùng làm sinh tế; văn bản câu này không nêu rõ tuổi nên không thêm “tơ”.
- source_word: וָאַיִל
  choice: và một con chiên đực
  rationale: אַיִל là chiên đực trưởng thành; cách gọi này rõ nghĩa hơn “cừu đực” đối với độc giả Kinh Thánh tiếng Việt phổ thông.
- source_word: בַּמִּזְבֵּחַ
  choice: trên mỗi bàn thờ
  rationale: Danh từ Hê-bơ-rơ ở số ít với mạo từ, nhưng ngữ cảnh trực tiếp của Dân Số 23:1 nói đến bảy bàn thờ và cùng một cặp sinh tế được dâng tại từng bàn; “mỗi” giúp tiếng Việt diễn đạt đúng ý phân phối hàm chứa trong ngữ cảnh.
theological_decisions:
- issue: Số lượng và sự phân phối sinh tế tại các bàn thờ
  choice: một con bò đực và một con chiên đực trên mỗi bàn thờ
  alternative: một con bò đực và một con chiên đực trên bàn thờ
  rationale: Bản Hê-bơ-rơ dùng danh từ số ít “trên bàn thờ”, nhưng câu 1 đã truyền phải chuẩn bị bảy con bò đực, bảy con chiên đực và dựng bảy bàn thờ. Cách dịch phân phối tránh tạo ấn tượng chỉ có tổng cộng hai con vật, đồng thời ghi chú minh bạch hình thức nguyên văn.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng cách phiên âm tên riêng quen thuộc “Ba-lác” và “Ba-la-am”; “dâng” truyền đạt thành ngữ tế lễ mà không dùng lối diễn đạt quá sát chữ nhưng khó hiểu là “làm cho đi lên”.
