base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: vi
  text: Rồi Ba-lác đưa Ba-la-am lên đỉnh Phê-ô, nơi nhìn xuống vùng hoang địa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi nhìn xuống sa mạc”; từ Hê-bơ-rơ Giê-si-môn có thể được hiểu là từ mô tả (“vùng hoang địa/sa mạc”) hoặc là một địa danh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Rồi ... đưa
  rationale: Dạng waw nối tiếp thúc đẩy mạch kể; “rồi” diễn đạt trình tự tự nhiên. Trong ngữ cảnh đưa một người đến một địa điểm, “đưa” tự nhiên hơn “lấy” mà vẫn giữ nghĩa của לקח.
- source_word: בָּלָק
  choice: Ba-lác
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: אֶת בִּלְעָם
  choice: Ba-la-am
  rationale: Dấu chỉ tân ngữ trực tiếp không cần biểu đạt riêng trong tiếng Việt; tên người được phiên âm theo lối quen dùng.
- source_word: רֹאשׁ
  choice: đỉnh
  rationale: Trong địa hình, רֹאשׁ chỉ phần cao nhất của một nơi; “đỉnh” tự nhiên và chính xác hơn nghĩa đen “đầu”.
- source_word: הַפְּעוֹר
  choice: Phê-ô
  rationale: Xử lý là địa danh và phiên âm theo quy ước tiếng Việt; mạo từ Hê-bơ-rơ không được dịch riêng.
- source_word: הַנִּשְׁקָף
  choice: nơi nhìn xuống
  rationale: Phân từ Niphal của שׁקף mô tả một vị trí cao trông xuống hoặc bao quát khu vực bên dưới; cách diễn đạt này rõ và tự nhiên trong tiếng Việt.
- source_word: עַל פְּנֵי
  choice: xuống vùng
  rationale: Thành ngữ có nghĩa đen là “trên mặt của”, nhưng trong mô tả địa hình, tiếng Việt tự nhiên diễn đạt quan hệ quan sát bằng “nhìn xuống vùng”.
- source_word: הַיְשִׁימֹן
  choice: vùng hoang địa
  rationale: יְשִׁימֹן có thể chỉ miền hoang vu, sa mạc, hoặc được hiểu như địa danh Giê-si-môn. Bản chính chuyển nghĩa mô tả, còn chú thích giữ khả năng là tên riêng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Cấu trúc “nơi nhìn xuống” tránh lối dịch sát cứng, còn “vùng hoang địa” giữ sắc thái địa lý hoang vu. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
