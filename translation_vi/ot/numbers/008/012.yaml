  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּם֙ יִסְמְכ֣וּ אֶת יְדֵי/הֶ֔ם עַ֖ל רֹ֣אשׁ הַ/פָּרִ֑ים וַ֠/עֲשֵׂה אֶת הָ/אֶחָ֨ד חַטָּ֜את וְ/אֶת הָ/אֶחָ֤ד עֹלָה֙ לַֽ/יהוָ֔ה לְ/כַפֵּ֖ר עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: vi
  text: Rồi người Lê-vi phải đặt tay lên đầu các con bò đực. Ngươi hãy dâng một con làm lễ tế chuộc tội[a], và con kia làm lễ thiêu dâng lên Yahweh, để chuộc tội cho người Lê-vi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ tế thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ tế liên quan đến tội lỗi và sự thanh tẩy trong các nghi thức tư tế.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: phải đặt tay mình
  rationale: Trong nghi thức tế lễ, סמך chỉ hành động đặt tay lên con vật; cách dịch này tự nhiên và giữ nguyên hành động cụ thể. Đại từ phản thân “mình” phù hợp với chủ ngữ tập thể trong tiếng Việt.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: trên đầu các con bò đực
  rationale: 'Danh từ “đầu” ở số ít được hiểu theo nghĩa phân phối: người Lê-vi đặt tay trên đầu từng con trong các con bò đực.'
- source_word: וַעֲשֵׂה
  choice: con hãy dâng
  rationale: Động từ ở ngôi hai số ít; trong ngữ cảnh tế lễ, עשה mang nghĩa thực hiện việc dâng tế lễ. “Con” duy trì lời Yahweh truyền trực tiếp cho Môi-se trong mạch văn.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Đây là thuật ngữ quen thuộc, dễ hiểu cho lễ tế חטאת; khả năng dịch là lễ vật thanh tẩy được giữ trong chú thích.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ tế lễ chỉ lễ vật được thiêu trọn; “lễ thiêu” ngắn gọn và quen thuộc trong tiếng Việt.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giữ tên riêng giao ước יהוה và diễn đạt tự nhiên hướng dâng của lễ vật.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: để làm lễ chuộc tội cho người Lê-vi
  rationale: Giữ sắc thái nghi lễ của כפר mà không quy định một học thuyết riêng về cơ chế chuộc tội; על xác định người Lê-vi là đối tượng thụ hưởng.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất tên riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của חַטָּאת
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ này có thể nhấn mạnh tội lỗi hoặc sự thanh tẩy trong ngữ cảnh tư tế. Bản chính dùng cách gọi quen thuộc, còn chú thích bảo tồn phương án ngữ nghĩa đáng kể.
- issue: Ý nghĩa của כפר
  choice: làm lễ chuộc tội cho
  alternative: thực hiện nghi thức xá tội/thanh tẩy cho
  rationale: Cách dịch giữ lực nghi lễ-thần học của từ nhưng không thu hẹp nó vào một lý thuyết chuộc tội cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Rồi” để nối tiếp chỉ thị trước đó; dùng “phải” cho sắc thái mệnh lệnh của thể vị lai trong luật nghi lễ. Cấu trúc “con thứ nhất… con kia” phản ánh hai con bò và lời truyền ở ngôi hai số ít.
