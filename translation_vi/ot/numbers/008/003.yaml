  edition: WLC
  text: וַ/יַּ֤עַשׂ כֵּן֙ אַהֲרֹ֔ן אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה הֶעֱלָ֖ה נֵרֹתֶ֑י/הָ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: vi
  text: 'A-rôn làm như vậy: ông đặt[b] các ngọn đèn của chân đèn sao cho chúng hướng về phía trước của chân đèn[a], đúng như Yahweh đã truyền cho Môi-se.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đối diện mặt trước của chân đèn” hoặc “quay về phía trước của chân đèn”.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “ông thắp các ngọn đèn của chân đèn.” Động từ Hê-bơ-rơ có nghĩa đen là làm cho đi lên và trong ngữ cảnh này có thể nói đến việc đặt các ngọn đèn vào vị trí hoặc thắp chúng lên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: A-rôn làm đúng như vậy
  rationale: Diễn đạt tự nhiên thành ngữ chỉ việc A-rôn làm theo chỉ dẫn vừa nêu; “đúng” làm rõ sự tuân thủ mà כֵּן hàm ý trong văn cảnh.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: hướng về phía trước chân đèn
  rationale: Giữ ý định hướng về mặt/phía trước của chân đèn mà không xác định quá mức vị trí hình học.
- source_word: הֶעֱלָה
  choice: đặt
  rationale: Trong cấu trúc với các ngọn đèn, động từ Hiphil của עלה có thể chỉ việc đưa lên, đặt vào vị trí hoặc thắp lên. “Đặt” phù hợp với trọng tâm về hướng chiếu sáng trong câu trước, còn khả năng “thắp” được giữ trong chú thích.
- source_word: נֵרֹתֶיהָ
  choice: các ngọn đèn của chân đèn
  rationale: Diễn rõ đại từ sở hữu giống cái số ít, tránh cách nói tiếng Việt thiếu tự nhiên như “các đèn của nó”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: Thể hiện sự phù hợp chính xác với mệnh lệnh đã được ban trước đó.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của הֶעֱלָה đối với các ngọn đèn
  choice: đặt
  alternative: thắp
  rationale: Ngữ cảnh trực tiếp nhấn mạnh việc các ngọn đèn hướng ánh sáng về phía trước, nhưng động từ cũng có thể được hiểu theo nghĩa thắp đèn; bản dịch chính không loại bỏ cách hiểu kia và ghi nhận nó trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chân đèn” cho מְנוֹרָה, các tên “A-rôn”, “Môi-se” theo dạng quen thuộc trong tiếng Việt, và giữ “Yahweh” như danh riêng. Hai dấu chú thích được đặt ngay sau mệnh đề có điểm mơ hồ tương ứng.
