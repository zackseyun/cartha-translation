  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng trình tự và các thành phần chính của tiếng Hê-bơ-rơ: sau nghi thức trước đó, người Lê-vi đến để phục vụ tại Lều Hội Kiến; người được truyền lệnh thanh tẩy họ và thực hiện nghi thức tế lễ trên chính họ. Tuy nhiên, cụm “đưa họ qua đưa lại như một lễ vật dâng đưa qua đưa lại” lặp từ, nặng nề và không diễn đạt tự nhiên quan hệ giữa động từ הֵנִיף và danh từ תְּנוּפָה.'
  naturalness: '“Đưa họ qua đưa lại” có thể giữ hình ảnh nghi lễ, nhưng cần đặt trong cách diễn đạt thành ngữ hơn: “dâng họ làm lễ vật đưa qua đưa lại.” Dùng dấu chấm phẩy nối hai mệnh đề mệnh lệnh cũng phản ánh tốt hơn cấu trúc liên tục của câu.'
  terminology: Giữ “người Lê-vi,” “Lều Hội Kiến,” “thanh tẩy,” và “lễ vật đưa qua đưa lại.” “Lễ vật đưa qua đưa lại” là thuật ngữ nghi lễ đủ cụ thể mà không áp đặt cách giải thích về động tác vật lý của nghi thức.
