source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: vi
  text: Sau đó, người Lê-vi sẽ đến để phục vụ tại Lều Hội Kiến; ngươi phải thanh tẩy họ[a] và dâng họ làm lễ vật đưa qua đưa lại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làm cho họ tinh sạch”. Động từ Hê-bơ-rơ chỉ sự thanh tẩy theo nghi lễ.
    reason: lexical_alternative
  - marker: b
    text: Tức là dâng trình người Lê-vi theo nghi thức như một lễ vật đưa qua đưa lại.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sau đó
  rationale: Diễn đạt tự nhiên trình tự thời gian rõ ràng, nối nghi thức này với các nghi thức biệt riêng ở trước.
- source_word: יָבֹאוּ הַלְוִיִּם
  choice: người Lê-vi sẽ đến
  rationale: Giữ nghĩa thông dụng của בוא là “đến”, đồng thời thể hiện sắc thái tương lai trong lời chỉ dẫn.
- source_word: לַעֲבֹד אֶת אֹהֶל מוֹעֵד
  choice: phục vụ tại Lều Hội Kiến
  rationale: עבד trong bối cảnh thờ phượng chỉ công việc phục vụ; “tại” diễn đạt tự nhiên mối liên hệ giữa sự phục vụ và Lều Hội Kiến, thay vì khiến chiếc lều có vẻ là đối tượng được phục vụ.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: Ngươi phải thanh tẩy họ
  rationale: טהר ở đây nói về sự làm cho tinh sạch theo nghi lễ. “Thanh tẩy” vừa dễ hiểu vừa giữ được sắc thái nghi lễ; đại từ số ít “ngươi” phản ánh người được truyền lệnh trong nguyên văn.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: đưa họ qua đưa lại như một lễ vật dâng đưa qua đưa lại
  rationale: Giữ hình ảnh nghi lễ nổi bật của נוף và תְּנוּפָה, trong đó chính người Lê-vi là đối tượng được đưa qua đưa lại, nhưng diễn đạt đầy đủ để câu tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Ngôn ngữ nghi lễ trong việc biệt riêng người Lê-vi
  choice: Giữ các thuật ngữ cụ thể “thanh tẩy” và “lễ vật dâng đưa qua đưa lại”.
  alternative: Diễn ý chung là “làm cho họ tinh sạch và dâng trình họ” hoặc “biệt riêng họ”.
  rationale: Câu này mô tả những hành động nghi lễ cụ thể, không chỉ nói chung về việc bổ nhiệm. Cách dịch được chọn duy trì khuôn khổ thờ phượng của phân đoạn mà không thêm một cách giải thích thần học riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Lều Hội Kiến” là thuật ngữ quen thuộc cho אֹהֶל מוֹעֵד. Đại từ “ngươi” giữ lời truyền trực tiếp ở số ít và sắc thái trang nghiêm; cấu trúc “đưa họ qua đưa lại” cố ý bảo tồn hình ảnh nghi lễ khác thường của nguyên văn.
