    rationale: Nguyên văn dùng động từ nghi lễ “làm/dâng theo nghi thức đưa qua đưa lại” với bổ ngữ cùng gốc. Tiếng Việt không cần lặp “đưa qua đưa lại” hai lần; “dâng họ làm lễ vật đưa qua đưa lại” vừa rõ người Lê-vi là đối tượng được dâng trình, vừa giữ thuật ngữ nghi lễ.
