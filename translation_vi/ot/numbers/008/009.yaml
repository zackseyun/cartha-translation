  terminology: “Người Lê-vi,” “Lều Hội Kiến,” và “hội chúng” là các thuật ngữ nhất quán, dễ nhận diện. “Các con trai của Israel” bảo lưu hình thức thân tộc giống đực của nguyên văn; chú thích nêu phương án thành ngữ hơn.
