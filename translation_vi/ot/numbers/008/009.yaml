  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: vi
  text: Sau đó, ngươi phải đưa người Lê-vi đến trước Lều Hội Kiến và triệu tập toàn thể hội chúng của các con trai Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “người Israel.” Tiếng Hê-bơ-rơ: “các con trai của Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Sau đó, ngươi phải đưa
  rationale: Dạng Hiphil của קרב có nghĩa là đưa đến gần hoặc trình diện. “Đưa” diễn đạt tự nhiên hành động tiến đến địa điểm thánh; “Sau đó” thể hiện trình tự của waw trong chuỗi chỉ thị.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Cách gọi tự nhiên và quen thuộc trong tiếng Việt đối với những người thuộc chi tộc Lê-vi, được biệt riêng để phục vụ nơi thánh.
- source_word: לִפְנֵי
  choice: đến trước
  rationale: Giữ nghĩa không gian và nghi lễ là ở trước, đối diện với Lều Hội Kiến.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Thuật ngữ Kinh Thánh tiếng Việt đã quen dùng, diễn đạt chiếc lều là nơi gặp gỡ theo sự ấn định.
- source_word: וְהִקְהַלְתָּ
  choice: và triệu tập
  rationale: Dạng Hiphil của קהל chỉ việc khiến cộng đồng nhóm lại. “Triệu tập” phù hợp với hành động công khai, chính thức trong bối cảnh này.
- source_word: כָּל עֲדַת
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng Israel được quy tụ; “toàn thể” truyền đạt כָּל, còn “hội chúng” giữ sắc thái cộng đồng có tổ chức.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Israel
  rationale: Giữ hình thức thân tộc và giống đực số nhiều rõ ràng của tiếng Hê-bơ-rơ, dù cách nói “người Israel” tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Israel
  alternative: người Israel
  rationale: Cụm từ Hê-bơ-rơ có hình thức giống đực số nhiều và đồng thời chỉ toàn thể dân giao ước. Bản chính giữ hình thức thân tộc, còn chú thích cung cấp cách diễn đạt tự nhiên hơn mà không xóa bỏ sắc thái của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. Đại từ “ngươi” phản ánh lời chỉ dẫn trực tiếp số ít dành cho Môi-se. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
