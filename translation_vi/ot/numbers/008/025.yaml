  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nhiệm vụ phục vụ” phản ánh cụm danh từ kép trong nguyên văn mà không gợi nghĩa quân sự; câu cuối giới hạn rõ việc ngừng công tác đang được phân công.
