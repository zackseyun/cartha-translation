  yaml_path: translation/ot/numbers/008/025.yaml
  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: vi
  text: Từ năm mươi tuổi trở đi, người ấy phải rút khỏi công tác phục vụ và không còn phục vụ nữa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải quay về từ công tác phục vụ”; động từ Hê-bơ-rơ có nghĩa đen là “trở lại, quay lại”, nhưng trong ngữ cảnh này mang nghĩa rút khỏi nhiệm vụ đang thi hành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: Từ năm mươi tuổi trở đi
  rationale: Thành ngữ Hê-bơ-rơ chỉ ngưỡng tuổi bắt đầu; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý kể từ khi đủ năm mươi tuổi.
- source_word: יָשׁוּב
  choice: phải rút khỏi
  rationale: Động từ שׁוב có nghĩa gốc là “trở lại/quay lại”, nhưng khi đi với מִן trong ngữ cảnh phân công phục vụ, nó chỉ việc rút khỏi nhiệm vụ đang thi hành.
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: khỏi nhiệm vụ phục vụ
  rationale: צָבָא ở đây không nói về quân đội mà về nhiệm vụ được phân công cho người Lê-vi; עֲבֹדָה chỉ công việc hay sự phục vụ. Cụm tiếng Việt giữ được cả sắc thái nhiệm vụ lẫn phục vụ mà không quá cứng nhắc.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: và không còn làm công việc ấy nữa
  rationale: עבד chỉ việc thực hiện công việc được giao. Thêm “ấy” liên kết tự nhiên với nhiệm vụ vừa nói và tránh hàm ý rằng người ấy tuyệt đối không được làm bất cứ việc gì khác.
