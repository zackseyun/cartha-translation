  - severity: low
    issue: Chú thích dùng cụm “trở về khỏi nhiệm vụ phục vụ” không tự nhiên.
    rationale: Chú thích cần phản ánh nghĩa đen “trở lại/quay lại” của שוב, nhưng có thể diễn đạt phương án đó bằng tiếng Việt tự nhiên hơn.
