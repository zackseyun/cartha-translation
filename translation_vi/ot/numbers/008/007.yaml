revisions:
- from: 'Để thanh tẩy họ, con hãy làm thế này: rảy nước thanh tẩy[a] trên họ; họ phải đưa dao cạo khắp thân thể[b], giặt quần áo mình, và tự thanh tẩy.'
  to: 'Con hãy làm như thế này để thanh tẩy họ: rảy nước dùng để thanh tẩy[a] trên họ; họ phải dùng dao cạo lướt qua khắp thân thể[b], giặt quần áo mình, và tự thanh tẩy.'
  rationale: Bản sửa giữ cấu trúc mệnh lệnh nghi lễ, lặp lại thuật ngữ “thanh tẩy” cho gốc טהר, và diễn đạt đầy đủ thành ngữ về việc cạo toàn thân. Chú thích về מֵי חַטָּאת được chỉnh để phản ánh sát nghĩa Híp-ri và vẫn giữ cách hiểu chức năng trong ngữ cảnh nghi lễ.
  reviewer_model: gpt-5.6-terra
