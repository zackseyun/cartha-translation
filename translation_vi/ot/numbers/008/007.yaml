  - severity: low
    issue: Chú thích a nêu “nước tẩy tội” nhưng chưa trình bày sát nghĩa chính xác của cụm Híp-ri.
    rationale: מֵי חַטָּאת sát chữ là “nước của tội”; trong ngữ cảnh nghi lễ có thể hiểu là “nước thanh tẩy”. Cách ghi này bảo tồn tính mơ hồ từ vựng mà không áp đặt một nghĩa thần học hẹp.
