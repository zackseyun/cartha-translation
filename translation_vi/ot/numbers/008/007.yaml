source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: vi
  text: 'Con hãy làm như thế này để thanh tẩy họ: rảy nước dùng để thanh tẩy[a] trên họ; họ phải dùng dao cạo lướt qua khắp thân thể[b], giặt quần áo mình, và tự thanh tẩy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nước thanh tẩy”; sát chữ là “nước của tội”.
    reason: lexical_alternative
  - marker: b
    text: Sát chữ là “cho dao cạo đi qua trên toàn bộ da thịt họ”, tức là cạo toàn thân.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: con hãy làm thế này
  rationale: Diễn đạt tự nhiên lời Đức Chúa Trời chỉ dẫn trực tiếp cho Môi-se, đồng thời giữ sắc thái mệnh lệnh và mối liên kết với văn cảnh trước.
- source_word: לְטַהֲרָם
  choice: để thanh tẩy họ
  rationale: “Thanh tẩy” phù hợp với nghi thức biệt riêng người Lê-vi và không thu hẹp ý nghĩa vào việc làm sạch thân thể thông thường.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: rảy ... trên họ
  rationale: Động từ Híp-ri chỉ hành động rảy chất lỏng trong nghi thức; “rảy” là cách nói rõ và quen thuộc trong tiếng Việt.
- source_word: מֵי חַטָּאת
  choice: nước thanh tẩy
  rationale: Cụm từ nguyên văn khó dịch sát là “nước của tội”; trong văn cảnh nghi lễ, “nước thanh tẩy” truyền đạt chức năng mà không khẳng định quá mức rằng đây là nước của một lễ vật chuộc tội. Chú thích giữ lại cách hiểu sát chữ.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: họ phải đưa dao cạo khắp thân thể
  rationale: Giữ hình ảnh cụ thể của thành ngữ “đưa dao cạo qua” và diễn đạt כָּל־בְּשָׂרָם tự nhiên là toàn bộ thân thể.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: giặt quần áo mình
  rationale: כבס thường chỉ việc giặt vải hoặc quần áo; đại từ phản thân làm rõ quần áo thuộc về chính họ.
- source_word: וְהִטֶּהָרוּ
  choice: và tự thanh tẩy
  rationale: Giữ sắc thái phản thân của dạng Hitpael và sự lặp lại có chủ ý của gốc טהר ở đầu và cuối câu.
theological_decisions:
- issue: Bản chất của sự thanh tẩy trong nghi thức biệt riêng người Lê-vi
  choice: Dùng “thanh tẩy” như ngôn ngữ nghi lễ, không đồng nhất hoàn toàn với sự tha thứ luân lý hay một giáo lý cứu rỗi về sau.
  alternative: Dịch toàn bộ bằng “làm sạch”, hoặc giải thích מֵי חַטָּאת là “nước của lễ vật chuộc tội”.
  rationale: Câu này mô tả một nghi thức cụ thể dành cho người Lê-vi. “Thanh tẩy” giữ được tính nghi lễ, còn chú thích bảo tồn sự mơ hồ của cụm מֵי חַטָּאת mà không áp đặt một cách giải nghĩa mang tính hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” vì đây là lời Đức Chúa Trời trực tiếp phán với Môi-se trong văn cảnh; các động từ nghi lễ được diễn đạt rõ ràng nhưng vẫn giữ hình ảnh và sự lặp từ của tiếng Híp-ri.
