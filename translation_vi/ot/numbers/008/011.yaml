    rationale: Thêm “giữa” làm rõ rằng người Lê-vi được chọn ra từ cộng đồng Y-sơ-ra-ên, phù hợp với nghĩa cơ bản của מֵאֵת trong ngữ cảnh mà không quyết định thay nghĩa đại diện nêu ở chú thích.
