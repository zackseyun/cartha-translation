source:
  edition: WLC
  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: vi
  text: A-rôn sẽ dâng những người Lê-vi làm lễ vật đưa qua đưa lại trước mặt Đức Giê-hô-va, từ giữa con cái Y-sơ-ra-ên[a]; và họ sẽ thực hiện việc phụng sự Đức Giê-hô-va.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “từ giữa con cái Y-sơ-ra-ên” cũng có thể hiểu là “thay mặt cho con cái Y-sơ-ra-ên”, nghĩa là những người Lê-vi được dâng lên với tư cách đại diện cho họ trong việc phụng sự Đức Giê-hô-va.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: dâng ... làm lễ vật đưa qua đưa lại
  rationale: Giữ mối liên hệ cùng gốc giữa động từ nghi lễ và danh từ chỉ lễ vật, nhưng dùng “dâng” cho động từ để tránh gợi ý rằng A-rôn nâng và vẫy cả nhóm người theo nghĩa đen.
- source_word: הַלְוִיִּם
  choice: những người Lê-vi
  rationale: Cách gọi tự nhiên và rõ nghĩa trong tiếng Việt đối với nhóm người thuộc chi phái Lê-vi.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: Diễn đạt thành ngữ chỉ việc ở trong sự hiện diện của Đức Giê-hô-va, đồng thời giữ danh riêng của Đức Chúa Trời.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: từ con cái Y-sơ-ra-ên
  rationale: Giữ nghĩa nguồn gốc cơ bản của מֵאֵת và cách nói giao ước “con cái Y-sơ-ra-ên”; chú thích bảo tồn khả năng hiểu là “thay mặt cho”.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: để họ phục vụ trong công việc của Đức Giê-hô-va
  rationale: Chuyển quan hệ kết quả/mục đích sang tiếng Việt tự nhiên; “phục vụ trong công việc” phản ánh phép lặp cùng gốc עבד mà không tạo câu tối nghĩa.
theological_decisions:
- issue: Nghi thức dâng những người Lê-vi như תְּנוּפָה
  choice: dâng ... làm lễ vật đưa qua đưa lại
  alternative: đưa qua đưa lại những người Lê-vi như một lễ vật đưa qua đưa lại
  rationale: Bảo tồn phạm trù nghi lễ và hình ảnh dâng hiến mà không hàm ý những người Lê-vi bị sát tế hoặc nhất thiết bị vẫy theo nghĩa vật lý.
- issue: Quan hệ của những người Lê-vi với con cái Y-sơ-ra-ên trong מֵאֵת
  choice: từ con cái Y-sơ-ra-ên
  alternative: thay mặt cho con cái Y-sơ-ra-ên
  rationale: Nghĩa nguồn gốc được đặt trong chính văn, còn sắc thái đại diện có thể có được nêu trong chú thích để không giải quyết dứt khoát sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Giê-hô-va” cho יהוה; giữ thuật ngữ nghi lễ “lễ vật đưa qua đưa lại”, đồng thời diễn đạt động từ bằng “dâng” để câu tự nhiên trong tiếng Việt.
