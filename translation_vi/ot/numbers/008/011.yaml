    rationale: וְהָיוּ לַעֲבֹד diễn tả “họ sẽ [được/được đặt] để phục vụ”; “để họ phục vụ trong công việc” không thể hiện rõ וְהָיוּ, còn “công việc của Đức Giê-hô-va” có thể hiểu là bất cứ công việc nào thuộc về Đức Chúa Trời thay vì nhiệm vụ phụng sự nghi lễ.
  - severity: low
