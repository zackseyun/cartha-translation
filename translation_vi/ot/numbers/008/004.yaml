  terminology: Giữ “chân đèn,” “Đức Giê-hô-va,” “Môi-se,” và “hình mẫu” nhất quán. “Vàng đập” là thuật ngữ phù hợp hơn “vàng dát” cho kỹ thuật gia công kim loại trong câu này.
