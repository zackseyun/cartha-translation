language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: vi
  text: 'Đây là cách chế tác chân đèn: chân đèn được làm bằng vàng đập[a]; từ đế đến hoa, đều được đập thành. Chân đèn được làm theo hình mẫu mà Đức Giê-hô-va đã cho Môi-se thấy[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vàng được đập thành” hoặc “đồ đập bằng vàng”; từ Hê-bơ-rơ nhấn mạnh rằng chân đèn được tạo hình bằng cách đập. Một số cũng hiểu từ này hàm ý được làm liền một khối.
    reason: lexical_alternative
  - marker: b
    text: “Theo hình mẫu” cũng có thể dịch là “theo hình dạng” hoặc “theo khải tượng” mà Đức Giê-hô-va đã cho Môi-se thấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: cách làm
  rationale: Diễn đạt phương thức chế tác trong ngữ cảnh thủ công, tự nhiên hơn cách nói trừu tượng “công việc”.
- source_word: הַמְּנֹרָה
  choice: chân đèn
  rationale: Tên gọi thông dụng, rõ nghĩa cho vật dụng thờ phượng này.
- source_word: מִקְשָׁה
  choice: dát / được dát
  rationale: Từ Hê-bơ-rơ nhấn mạnh việc tạo hình kim loại bằng cách đập hoặc dát; lặp lại ý này theo hai lần xuất hiện trong nguyên văn.
- source_word: זָהָב
  choice: vàng
  rationale: Chỉ vật liệu một cách trực tiếp.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: từ đế cho đến hoa
  rationale: Diễn đạt toàn bộ phạm vi của chân đèn; יָרֵךְ chỉ phần đế dưới, còn פֶּרַח chỉ chi tiết trang trí hình hoa.
- source_word: כַּמַּרְאֶה
  choice: theo hình mẫu
  rationale: Trong ngữ cảnh chế tạo Đền Tạm, từ này chỉ hình dạng hay mẫu đã được cho thấy; chú thích bảo lưu các nghĩa gần là “hình dạng” và “khải tượng”.
- source_word: הֶרְאָה
  choice: đã cho ... thấy
  rationale: Phản ánh thể gây khiến của động từ ראה, nghĩa là “cho thấy”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Cách phiên âm danh riêng giao ước YHWH quen thuộc và trang trọng trong tiếng Việt.
- source_word: כֵּן עָשָׂה
  choice: được làm đúng theo
  rationale: Giữ quan hệ tương ứng “theo như… thì làm như vậy”, đồng thời tránh buộc phải xác định chủ thể vốn không được nêu rõ trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh / Đức Chúa Trời
  rationale: Dùng danh riêng thay vì thay thế bằng tước hiệu; hình thức “Đức Giê-hô-va” tự nhiên và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- issue: Chủ thể ngầm của עָשָׂה
  choice: cấu trúc bị động “chân đèn được làm”
  alternative: “ông làm chân đèn”
  rationale: Động từ Hê-bơ-rơ ở thể chủ động số ít nhưng không nêu chủ thể. Ngữ cảnh có thể hiểu là người thợ; cấu trúc tiếng Việt này bảo lưu sự không xác định thay vì gán chủ thể cho Môi-se.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu cuối được tái cấu trúc tự nhiên để tránh lối lặp gượng “theo… thì như vậy…”, đồng thời không xác định quá mức chủ thể ngầm của động từ.
