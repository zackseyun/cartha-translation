revisions:
- from: 'Đây là cách làm chân đèn: bằng vàng dát[a]; từ đế cho đến hoa, toàn bộ đều được dát. Chân đèn được làm đúng theo hình mẫu mà Đức Giê-hô-va đã cho Môi-se thấy[b].'
  to: 'Đây là cách chế tác chân đèn: chân đèn được làm bằng vàng đập[a]; từ đế đến hoa, đều được đập thành. Chân đèn được làm theo hình mẫu mà Đức Giê-hô-va đã cho Môi-se thấy[b].'
  rationale: Bản sửa thay “dát” bằng cách diễn đạt đúng kỹ thuật đập tạo hình kim loại, đồng thời cập nhật chú thích tương ứng. Cấu trúc bị động ở câu cuối tiếp tục tránh gán chủ thể không được nêu trong tiếng Hê-bơ-rơ, mà vẫn giữ ý chân đèn được làm phù hợp với điều Yahweh đã cho Môi-se thấy.
