  - severity: low
    issue: Đại từ “Con” được thêm vào mệnh lệnh cuối.
    rationale: Nguyên văn chỉ dùng mệnh lệnh ngôi thứ hai số ít. Bỏ đại từ giúp bản dịch trung tính hơn về xưng hô mà vẫn tự nhiên trong tiếng Việt.
  - severity: low
    issue: Ký hiệu chú thích a đang neo sau “Lều Hội Kiến” dù nội dung chú giải thuộc cụm “chu toàn phận sự”.
    rationale: Dời ký hiệu đến sau cách dịch של לִשְׁמֹר מִשְׁמֶרֶת làm liên kết chú thích chính xác.
