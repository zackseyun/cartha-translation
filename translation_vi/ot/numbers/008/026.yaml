revisions:
- from: Nhưng người ấy có thể phụ giúp anh em mình tại Lều Hội Kiến[a] trong việc chu toàn phận sự, song không được làm công việc phục dịch[b]. Con phải làm như vậy đối với người Lê-vi trong các phận sự của họ.
  to: Nhưng người ấy vẫn có thể phục vụ cùng anh em mình tại Lều Hội Kiến để đảm trách phận sự[a], song không được làm công việc phục dịch[b]. Hãy làm như vậy đối với người Lê-vi trong các phận sự của họ.
  rationale: Sửa cách diễn đạt về quan hệ với “anh em mình” để không biến họ thành đối tượng được giúp đỡ, giữ rõ sự tương phản giữa hoạt động được phép và công việc bị miễn, bỏ đại từ xưng hô không có trong nguồn, và đặt lại neo chú thích cho đúng cụm được giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:39:48Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo nhận ra đúng sự đối lập chủ ý giữa שֵׁרֵת, là việc phục vụ/thi hành chức trách vẫn được phép, và עֲבֹדָה ... יַעֲבֹד, là công việc phục dịch mà người ấy không còn làm. Tuy nhiên, “phụ giúp anh em mình” dễ làm cho “anh em mình” thành đối tượng được giúp đỡ và thêm sắc thái hỗ trợ không được nêu rõ; “phục vụ cùng anh em mình” phản ánh tự nhiên hơn cách hiểu ngữ cảnh của cụm này. Mệnh lệnh cuối không cần thêm đại từ “Con”, vốn không có trong tiếng Hê-bơ-rơ.
  naturalness: “Phục vụ cùng anh em mình ... để đảm trách phận sự” là tiếng Việt hiện đại, trang trọng, và làm rõ quan hệ giữa hành động phục vụ với trách nhiệm được giao. “Hãy làm như vậy” giữ giọng chỉ dẫn mà không phải chọn một đại từ xưng hô bổ sung. Dời chú thích a đến sau “phận sự” cũng đặt ký hiệu đúng tại đơn vị từ vựng được chú giải.
  terminology: Giữ “Lều Hội Kiến” và “người Lê-vi”, là các thuật ngữ Kinh Thánh quen dùng. Dùng “phục vụ” cho שֵׁרֵת nhưng “công việc phục dịch” cho עֲבֹדָה ... יַעֲבֹד để bảo toàn sự phân biệt của nguyên văn mà không diễn giải hẹp thành chỉ việc canh gác.
  issues:
  - severity: medium
    issue: “phụ giúp anh em mình” có thể hiểu là giúp đỡ các anh em, thay vì phục vụ cùng họ.
