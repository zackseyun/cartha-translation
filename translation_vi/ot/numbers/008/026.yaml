  text: וְ/שֵׁרֵ֨ת אֶת אֶחָ֜י/ו בְּ/אֹ֤הֶל מוֹעֵד֙ לִ/שְׁמֹ֣ר מִשְׁמֶ֔רֶת וַ/עֲבֹדָ֖ה לֹ֣א יַעֲבֹ֑ד כָּ֛כָה תַּעֲשֶׂ֥ה לַ/לְוִיִּ֖ם בְּ/מִשְׁמְרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: vi
  text: Nhưng người ấy vẫn có thể phục vụ cùng anh em mình tại Lều Hội Kiến để đảm trách phận sự[a], song không được làm công việc phục dịch[b]. Hãy làm như vậy đối với người Lê-vi trong các phận sự của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm tiếng Hê-bơ-rơ được dịch là “đảm trách phận sự” chỉ việc thực hiện trách nhiệm đã được giao; cũng có thể dịch là “giữ trách nhiệm được giao”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “song không được làm lao dịch”. Tiếng Hê-bơ-rơ phân biệt việc phục vụ vẫn được phép với công việc phục dịch thường lệ mà người Lê-vi lớn tuổi không còn phải làm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: Nhưng người ấy có thể phụ giúp
  rationale: שרת chỉ sự phục vụ, thường trong bối cảnh thánh. Ở đây hoạt động này được phép tiếp tục, trái với עֲבֹדָה bị cấm; “phụ giúp” diễn đạt vai trò hỗ trợ mà không đồng nhất với công việc phục dịch thường lệ.
- source_word: אֶת־אֶחָיו
  choice: anh em mình
  rationale: Giữ hình ảnh thân tộc nam của tiếng Hê-bơ-rơ; trong ngữ cảnh, đây là những người Lê-vi cùng hàng ngũ.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: Cách gọi trang trọng, quen thuộc và sát nghĩa cho nơi Đức Chúa Trời gặp dân Ngài; “tại” tự nhiên hơn trong câu chỉ nơi thi hành nhiệm vụ.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: trong việc chu toàn phận sự
  rationale: Cụm động từ và danh từ cùng gốc nói đến việc đảm trách một trách nhiệm đã được giao, không nhất thiết chỉ là canh gác.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: song không được làm công việc phục dịch
  rationale: Giữ sắc thái nhấn mạnh của danh từ và động từ cùng gốc, đồng thời phân biệt công việc thường lệ bị cấm với sự phụ giúp vẫn được phép.
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם
  choice: Con phải làm như vậy đối với người Lê-vi
  rationale: Mệnh lệnh số ít hướng đến Môi-se; “đối với” diễn đạt tự nhiên quy định được áp dụng cho người Lê-vi.
- source_word: בְּמִשְׁמְרֹתָם
  choice: trong các phận sự của họ
  rationale: מִשְׁמֶרֶת chỉ những trách nhiệm được giao; số nhiều được thể hiện bằng “các phận sự”.
theological_decisions:
- issue: Phân biệt hoạt động được phép sau tuổi mãn nhiệm với công việc bị cấm
  choice: Người Lê-vi lớn tuổi vẫn có thể phụ giúp các anh em chu toàn phận sự, nhưng không còn làm công việc phục dịch thường lệ.
  alternative: Hoặc hiểu là họ phải ngừng tuyệt đối mọi hình thức phục vụ; hoặc chỉ được làm nhiệm vụ canh gác theo nghĩa hẹp.
  rationale: Sự đối lập giữa שרת và עֲבֹדָה...עבד cho thấy hai loại hoạt động được phân biệt, chứ không phải mọi sự tham gia đều chấm dứt. Bản dịch dùng “phụ giúp” và “công việc phục dịch” để giữ sự phân biệt ấy mà không quy định quá cụ thể bản chất công việc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Lều Hội Kiến” và “người Lê-vi” theo lối gọi Kinh Thánh phổ biến; giữ đại từ “Con” vì lời chỉ dẫn trực tiếp được ban cho Môi-se. Các thuật ngữ “phụ giúp”, “phận sự” và “công việc phục dịch” duy trì sự phân biệt có chủ ý trong nguyên văn.
