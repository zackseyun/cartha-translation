translation_notes:
  register: Văn phong chỉ thị trang trọng, hiện đại và dễ hiểu. Dùng “con” vì lời này được truyền qua Môi-se để nói trực tiếp với A-rôn; dùng “ông ấy” trong mệnh đề dẫn để diễn đạt đại từ ngôi ba tự nhiên. Dấu chú thích [a] được đặt ngay sau cụm từ có khả năng dịch khác.
