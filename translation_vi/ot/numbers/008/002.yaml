  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: vi
  text: 'Hãy nói với A-rôn và bảo ông ấy: ‘Khi ngươi đặt các ngọn đèn vào vị trí[a], bảy ngọn đèn sẽ chiếu sáng về phía trước của chân đèn.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi ngươi thắp các ngọn đèn.” Động từ Hê-bơ-rơ có nghĩa đen là “làm cho đi lên”; trong ngữ cảnh này, từ ấy có thể chỉ việc thắp đèn hoặc đặt các ngọn đèn vào vị trí để chúng chiếu sáng về phía trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Mệnh lệnh mở đầu lời chỉ dẫn trực tiếp; cách dịch này giữ sắc thái trang trọng mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: và bảo ông ấy
  rationale: Giữ lại hai động từ phát ngôn riêng biệt trong tiếng Hê-bơ-rơ, đồng thời tránh lặp cứng nhắc “nói... nói” trong tiếng Việt.
- source_word: בְּהַעֲלֹתְךָ
  choice: Khi con đặt các ngọn đèn lên
  rationale: Thể Hiphil của עלה có nghĩa đen là “làm cho đi lên”; trong ngữ cảnh đèn, cụm này có thể chỉ việc đặt/lắp đèn hoặc thắp đèn. Bản chính giữ nét “đưa/đặt lên”, còn nghĩa “thắp” được nêu trong chú thích.
- source_word: הַנֵּרֹת
  choice: các ngọn đèn
  rationale: נֵר chỉ vật dụng phát sáng, tức ngọn đèn, chứ không phải ánh sáng trừu tượng.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: về phía trước chân đèn
  rationale: Cụm giới từ diễn tả hướng chiếu về phía đối diện phần trước của chân đèn; “về phía trước” giữ rõ sắc thái định hướng hơn “ở phía trước”.
- source_word: יָאִירוּ
  choice: phải chiếu sáng
  rationale: Dạng Hiphil của אור mang nghĩa “phát/chiếu ánh sáng”; “phải” thể hiện lực chỉ thị của mệnh đề trong lời truyền dạy.
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: bảy ngọn đèn
  rationale: Dịch trực tiếp cụm số từ ở trạng thái liên kết, không thêm ý “cả” vốn không được biểu đạt rõ trong nguyên văn.
- source_word: הַמְּנוֹרָה
  choice: chân đèn
  rationale: Dịch theo chức năng của vật dụng thờ phượng thay vì phiên âm “menorah”, giúp độc giả phổ thông hiểu ngay.
