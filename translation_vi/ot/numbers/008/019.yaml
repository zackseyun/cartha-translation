  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: vi
  text: Ta đã ban những người Lê-vi làm quà tặng cho A-rôn và các con trai ông, từ giữa con cái Y-sơ-ra-ên[a], để họ thực hiện công việc phục vụ của con cái Y-sơ-ra-ên tại Lều Hội Kiến và làm lễ chuộc tội cho con cái Y-sơ-ra-ên[b], hầu cho không có tai họa xảy đến giữa con cái Y-sơ-ra-ên khi họ đến gần nơi thánh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ lặp lại gốc từ “ban”: “Ta đã ban những người Lê-vi, là những người được ban, cho A-rôn và các con trai ông.”'
    reason: Giải thích phép lặp nhấn mạnh của gốc נתן, được diễn đạt tự nhiên trong chính văn bằng “đã ban ... làm quà tặng.”
  - marker: b
    text: 'Cũng có thể dịch: “làm lễ chuộc tội vì con cái Y-sơ-ra-ên.”'
    reason: Giới từ עַל có thể được diễn đạt là “cho” hoặc “vì” khi chỉ những người được hưởng lợi từ sự chuộc tội; không xác định riêng cơ chế thay thế.
  - marker: c
    text: Hay “thánh điện.”
    reason: הַקֹּדֶשׁ trong ngữ cảnh này có thể chỉ khu vực thánh, tức thánh điện/nơi thánh, của Lều Hội Kiến.
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת הַלְוִיִּם נְתֻנִים
  choice: Ta đã ban những người Lê-vi như một món quà
  rationale: Giữ sự lặp lại nhấn mạnh của gốc נתן (‘ban/được ban’) bằng cách diễn đạt tự nhiên trong tiếng Việt; ‘đã ban’ cũng nêu bật kết quả đang có hiệu lực trong lời phán.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: cho A-rôn và các con trai ông
  rationale: Giới từ לְ chỉ đối tượng tiếp nhận hoặc người được hưởng; cách dịch này trực tiếp và giữ quan hệ gia đình tư tế.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: từ giữa con cái Y-sơ-ra-ên
  rationale: Thể hiện việc chọn người Lê-vi từ bên trong toàn thể cộng đồng và giữ thành ngữ giao ước בְּנֵי יִשְׂרָאֵל.
- source_word: לַעֲבֹד אֶת עֲבֹדַת בְּנֵי יִשְׂרָאֵל
  choice: để họ làm công việc phục vụ thay cho con cái Y-sơ-ra-ên
  rationale: Cặp từ cùng gốc עבד nhấn mạnh nhiệm vụ phục vụ. Trong mạch văn Dân Số 8, công việc ấy được người Lê-vi đảm nhận thay cho dân, nên ‘thay cho’ truyền đạt quan hệ đại diện rõ hơn mà vẫn phù hợp nguyên văn.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: Danh xưng quen thuộc và trang trọng cho אֹהֶל מוֹעֵד; ‘tại’ tự nhiên trong tiếng Việt đối với địa điểm thi hành phận sự.
- source_word: וּלְכַפֵּר עַל
  choice: và làm lễ chuộc tội cho
  rationale: Giữ ý nghĩa nghi lễ của כפר mà không giải thích quá mức cơ chế hay phạm vi của sự chuộc tội.
- source_word: נֶגֶף
  choice: tai họa
  rationale: Từ này có thể chỉ đòn giáng, tai vạ hoặc dịch bệnh do sự vi phạm nơi thánh; ‘tai họa’ đủ rộng để không thu hẹp thành một loại dịch bệnh cụ thể.
- source_word: בְּגֶשֶׁת
  choice: khi họ đến gần
  rationale: Diễn đạt tự nhiên giá trị thời gian của cấu trúc nguyên mẫu với בְּ.
- source_word: הַקֹּדֶשׁ
  choice: nơi thánh
  rationale: Trong ngữ cảnh Lều Hội Kiến, từ này chỉ khu vực thiêng; ‘nơi thánh’ giữ tính cụ thể mà không đồng nhất hoàn toàn với một phần kiến trúc hẹp hơn.
theological_decisions:
- issue: Vai trò của người Lê-vi đối với Y-sơ-ra-ên và hàng tư tế
  choice: Người Lê-vi được ban cho A-rôn và các con trai ông để đảm nhận việc phục vụ thay cho dân và làm lễ chuộc tội cho dân.
  alternative: Người Lê-vi chỉ hỗ trợ những công việc thực hành và không có chức năng nào liên quan đến sự chuộc tội.
  rationale: Nguyên văn trực tiếp gắn người Lê-vi với cả עבד và כפר. Bản dịch giữ nguyên sức căng thần học này, không đồng nhất chức năng của họ với chức tư tế nhưng cũng không xóa cụm từ ‘làm lễ chuộc tội’.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên / người Y-sơ-ra-ên
  rationale: Cách dịch giữ hình thức thành ngữ Hê-bơ-rơ và sắc thái cộng đồng giao ước; trong tiếng Việt, cụm này vẫn dễ hiểu và không nhất thiết chỉ nam giới.
- issue: Mục đích ngăn ngừa נֶגֶף
  choice: Việc người Lê-vi phục vụ nhằm ngăn tai họa xảy đến khi dân đến gần nơi thánh.
  alternative: Chỉ một trận dịch theo nghĩa y khoa được ngăn chặn.
  rationale: נֶגֶף trong ngữ cảnh xâm phạm nơi thánh rộng hơn một chứng bệnh cụ thể; ‘tai họa’ bảo toàn khả năng đây là đòn phạt chết người từ Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng ‘Ta’ theo lời phán trực tiếp của Đức Chúa Trời; dùng ‘Lều Hội Kiến’ và ‘làm lễ chuộc tội’ để giữ thuật ngữ nghi lễ. Các lần lặp ‘con cái Y-sơ-ra-ên’ được giữ có chủ ý nhằm phản ánh nhịp điệu và trọng tâm cộng đồng của nguyên văn.
