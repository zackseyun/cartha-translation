revisions:
- from: 'Đây là điều áp dụng cho người Lê-vi: từ hai mươi lăm tuổi trở lên, người ấy phải đến nhận nhiệm vụ[a] phục vụ tại Lều Hội Kiến.'
  to: 'Đây là điều áp dụng cho người Lê-vi: người nào từ hai mươi lăm tuổi trở lên phải đến để đảm nhận phận sự[a] trong công việc phục vụ tại Lều Hội Kiến.'
  rationale: Sửa “nhận nhiệm vụ” thành “đảm nhận phận sự” để phản ánh sát hơn thành ngữ לִצְבֹא צָבָא; sửa cấu trúc chủ ngữ để tiếng Việt tự nhiên hơn. Giữ nguyên ngưỡng tuổi, tính quy phạm, tên gọi Lều Hội Kiến, và sự phân biệt giữa phận sự với công việc phục vụ.
