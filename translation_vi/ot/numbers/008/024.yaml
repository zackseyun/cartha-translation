base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: vi
  text: 'Đây là điều áp dụng cho người Lê-vi: người nào từ hai mươi lăm tuổi trở lên phải đến để đảm nhận phận sự[a] trong công việc phục vụ tại Lều Hội Kiến.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ dịch là “đảm nhận phận sự” cũng có thể dịch là “thi hành phận sự” hoặc “tham gia phục vụ”; đây là một thành ngữ về việc thực hiện nhiệm vụ, mang sắc thái tổ chức như quân ngũ.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר
  choice: Đây là điều áp dụng cho
  rationale: Cụm từ mở đầu một quy định dành cho người Lê-vi; cách dịch này giữ sắc thái quy phạm mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: לַלְוִיִּם
  choice: người Lê-vi
  rationale: Danh xưng quen thuộc, chỉ tập thể người thuộc chi phái Lê-vi.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi lăm tuổi trở lên
  rationale: Diễn đạt tự nhiên và chính xác ngưỡng tuổi tối thiểu trong nguyên văn.
- source_word: יָבוֹא
  choice: người ấy phải đến
  rationale: Giữ dạng số ít của động từ Hê-bơ-rơ trong quy định áp dụng cho từng thành viên của tập thể; “phải” thể hiện lực quy phạm của văn cảnh.
- source_word: לִצְבֹא צָבָא
  choice: nhận nhiệm vụ
  rationale: Diễn đạt thành ngữ chỉ việc tham gia thi hành phận sự có sắc thái tổ chức như quân ngũ; chú thích bảo lưu nét nghĩa này.
- source_word: בַּעֲבֹדַת
  choice: phục vụ tại
  rationale: עֲבֹדָה ở đây chỉ công việc phụng sự được giao trong nơi thánh; cách dịch tránh sự lặp từ nặng nề trong tiếng Việt.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, rõ nghĩa và quen dùng cho lều thánh nơi Đức Chúa Trời gặp dân Ngài.
theological_decisions:
- issue: Động từ số ít đi với chủ thể tập thể
  choice: người ấy phải đến
  alternative: họ phải đến
  rationale: Nguyên văn dùng động từ số ít khi nói về người Lê-vi như một tập thể. “Người ấy” giữ hình thức số ít và cho thấy quy định áp dụng cho từng người, không làm thay đổi ý nghĩa tập thể.
translation_notes:
  register: Văn phong quy phạm, trang trọng nhưng hiện đại và dễ hiểu. Dùng “người ấy” để bảo lưu số ít của nguyên văn, và đặt chú thích ngay sau thành ngữ có sắc thái quân vụ.
