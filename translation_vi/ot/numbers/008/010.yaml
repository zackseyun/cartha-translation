  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: vi
  text: Ngươi phải đưa người Lê-vi đến trước mặt Yahweh; người Israel[a] sẽ đặt tay lên người Lê-vi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “các con trai của Israel”; đây là một cách gọi tập thể thông dụng chỉ dân Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Ngươi phải đưa
  rationale: Dạng Hiphil của קרב có nghĩa là đưa đến gần hoặc trình diện. “Đưa ... đến trước mặt” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái hướng đến trong nghi lễ.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Cách gọi quen thuộc và tự nhiên trong tiếng Việt dành cho tập thể người thuộc chi phái Lê-vi; tiếng Việt không cần đánh dấu số nhiều bằng hình thái.
- source_word: לִפְנֵי יְהוָה
  choice: đến trước mặt Yahweh
  rationale: לִפְנֵי có nghĩa là “trước mặt” hoặc “trong sự hiện diện của”; “đến trước mặt” phù hợp với động từ chỉ sự đưa đến gần và bối cảnh nghi lễ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên giao ước được biểu thị trực tiếp bằng Tetragrammaton, thay vì thay thế bằng một tước hiệu.
- source_word: וְסָמְכוּ
  choice: rồi ... sẽ đặt
  rationale: Trong cấu trúc nghi lễ với “tay” và giới từ עַל, סמך chỉ hành động đặt tay lên người hoặc vật. “Rồi” diễn đạt tự nhiên quan hệ tiếp nối của וְ mà không thêm ý nghĩa nhân quả.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai/con cái của Israel” nhưng thường là cách gọi tập thể dân Israel. “Con dân Israel” giữ được dấu vết của hình ảnh nguồn và vẫn dễ hiểu trong tiếng Việt; chú thích nêu cách diễn đạt thông dụng hơn.
- source_word: יְדֵיהֶם
  choice: tay mình
  rationale: Đại từ phản thân “mình” quy chiếu rõ về chủ thể tập thể “con dân Israel” và tạo câu tiếng Việt tự nhiên. Danh từ “tay” không bắt buộc đánh dấu số nhiều trong tiếng Việt.
- source_word: עַל הַלְוִיִּם
  choice: trên người Lê-vi
  rationale: עַל được dịch trực tiếp là “trên” trong công thức nghi lễ đặt tay; “người Lê-vi” được hiểu theo nghĩa tập thể.
theological_decisions:
- issue: Cách chuyển dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יְהוָה. “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu hay chọn một dạng phiên âm truyền thống khác.
- issue: Phạm vi chỉ người của בְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai của Israel; người Israel; dân Israel
  rationale: Cụm từ có hình thức giống đực số nhiều nhưng hoạt động như một cách gọi tập thể quen thuộc đối với dân Israel. Bản dịch giữ phần nào hình ảnh nguyên ngữ mà không giới hạn cách hiểu vào các con trai theo nghĩa sinh học; chú thích công khai cách diễn đạt thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Ngươi” duy trì lối xưng hô số ít của mệnh lệnh hướng đến Môi-se trong ngữ cảnh luật pháp. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
