  rationale: Bản sửa giữ nguyên nội dung, trật tự nghi lễ, tên riêng Yahweh và tính tập thể của các danh xưng trong nguyên ngữ, đồng thời dùng lối diễn đạt hiện đại, tự nhiên hơn. Chú thích được điều chỉnh để giải thích trực tiếp hình thức nghĩa đen của tiếng Hê-bơ-rơ và được neo đúng tại “người Israel.”
