source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: vi
  text: Vậy, Môi-se, A-rôn và toàn thể hội chúng con cái Y-sơ-ra-ên đã làm cho người Lê-vi theo đúng mọi điều Yahweh đã truyền cho Môi-se về người Lê-vi; con cái Y-sơ-ra-ên cũng đã làm cho họ như thế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Y-sơ-ra-ên.” Tiếng Hê-bơ-rơ là “con cái Y-sơ-ra-ên,” một cách gọi quen thuộc dành cho cộng đồng giao ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: đã làm
  rationale: Động từ עשה có nghĩa rộng là “làm/thực hiện.” Ở đây, “đã làm” giữ được tính khái quát của nguyên văn, không thu hẹp thành một nghi thức cụ thể.
- source_word: עֲדַת
  choice: hội chúng
  rationale: עֵדָה chỉ cộng đồng giao ước được quy tụ; “hội chúng” vừa trang trọng vừa quen thuộc trong văn mạch Ngũ Kinh.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cách dịch này giữ hình ảnh thân tộc của thành ngữ Hê-bơ-rơ và bao hàm cộng đồng hậu duệ Y-sơ-ra-ên; chú thích nêu cách diễn đạt tự nhiên hơn là “dân Y-sơ-ra-ên.”
- source_word: לַלְוִיִּם / לָהֶם
  choice: cho người Lê-vi / cho họ
  rationale: Giới từ ל đánh dấu những người chịu tác động hoặc hưởng lợi từ các hành động. “Cho” tự nhiên trong tiếng Việt và không xác định quá mức tính chất các hành động.
- source_word: כְּכֹל אֲשֶׁר
  choice: mọi điều đúng như
  rationale: Cụm từ nhấn mạnh sự tuân thủ trọn vẹn và chính xác đối với mệnh lệnh.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Truyền” phù hợp với mệnh lệnh có thẩm quyền của Đức Chúa Trời; “đã” thể hiện mệnh lệnh có trước hành động được thuật lại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: cho Môi-se về người Lê-vi
  rationale: Cấu trúc cho biết mệnh lệnh được truyền cho Môi-se và có liên quan đến người Lê-vi.
- source_word: כֵּן
  choice: đúng như vậy
  rationale: Cách dịch này giữ ý nhấn mạnh rằng dân Y-sơ-ra-ên hành động hoàn toàn tương ứng với điều đã được truyền.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự danh; giữ “Yahweh” bảo tồn danh riêng thay vì âm thầm thay bằng một tước hiệu.
- issue: Thành ngữ cộng đồng mang hình ảnh thân tộc בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” giữ hình ảnh hậu duệ trong nguyên văn, còn chú thích cung cấp cách diễn đạt tự nhiên tương đương mà không giải quyết thay người đọc sắc thái của thành ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “người Lê-vi” và “con cái Y-sơ-ra-ên” của nguyên văn để bảo tồn sự nhấn mạnh, đồng thời đặt dấu chú thích ngay sau toàn câu vì chú thích giải thích cách gọi xuất hiện hai lần.
