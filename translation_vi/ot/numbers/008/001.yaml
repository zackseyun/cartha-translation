  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn lời được chuyển bằng “phán”, cách diễn đạt tự nhiên và trang trọng trong tiếng Việt khi Đức Chúa Trời truyền lời; liên từ וַ־ nối tiếp mạch kể không cần dịch riêng để câu tiếng Việt được tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל chỉ người tiếp nhận lời nói; “phán với Môi-se” là cấu trúc tiếng Việt tự nhiên. Tên מֹשֶׁה được dùng theo dạng quen thuộc Môi-se.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn nhập lời nói, “rằng” báo hiệu nội dung phát ngôn sẽ theo sau và tự nhiên hơn lối dịch sát chữ “mà nói”.
theological_decisions:
- issue: Cách chuyển יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng ấy, không thay bằng tước hiệu, đồng thời tránh khẳng định quá mức về cách phát âm cổ vốn không hoàn toàn chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời và dấu hai chấm để dẫn sang nội dung ở câu kế tiếp; không thêm liên từ “và” ở đầu câu vì tiếng Việt không cần nó để thể hiện sự tiếp diễn của mạch kể.
