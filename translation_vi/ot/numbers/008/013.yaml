revisions:
- from: Ngươi phải đặt người Lê-vi đứng trước A-rôn và các con trai ông, rồi dâng họ lên như một lễ vật đưa qua đưa lại cho Yahweh.[a]
  to: Ngươi phải đặt người Lê-vi đứng trước A-rôn và trước các con trai ông, rồi dâng họ làm lễ vật đưa qua đưa lại cho Yahweh.[a]
  rationale: Bản sửa giữ đầy đủ hai lần "trước" của nguyên văn và bỏ "lên", một sắc thái phương hướng không có trong tiếng Hê-bơ-rơ. Cách diễn đạt vẫn bảo tồn thuật ngữ nghi lễ và sự liên hệ từ vựng giữa động từ với danh từ, còn chú thích cung cấp phương án sát chữ có lặp từ.
