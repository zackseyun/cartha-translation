id: NUM.8.13
reference: Numbers 8:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: vi
  text: Ngươi phải đặt người Lê-vi đứng trước A-rôn và trước các con trai ông, rồi dâng họ làm lễ vật đưa qua đưa lại cho Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “đưa qua đưa lại họ, làm lễ vật đưa qua đưa lại cho Yahweh.” Tiếng Hê-bơ-rơ dùng cả động từ chỉ hành động trình dâng/đưa qua đưa lại trong nghi lễ và danh từ chỉ loại lễ vật ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Ngươi phải đặt ... đứng
  rationale: Thể Hiphil của עמד mang nghĩa khiến ai đứng hoặc đặt vào vị trí; cách diễn đạt này giữ sắc thái gây khiến và phù hợp với bối cảnh nghi lễ.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Danh xưng quen thuộc trong tiếng Việt dành cho nhóm chi phái Lê-vi; ý xác định được thể hiện tự nhiên theo ngữ cảnh.
- source_word: לִפְנֵי
  choice: trước
  rationale: Diễn tả vị trí hoặc sự trình diện trước mặt một người trong bối cảnh nghi lễ.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Phiên âm tên riêng theo lối dùng phổ biến trong Kinh Thánh tiếng Việt.
- source_word: בָנָיו
  choice: các con trai ông
  rationale: Giữ đúng nghĩa chỉ các con trai của A-rôn, là những người đảm nhiệm chức tế lễ.
- source_word: וְהֵנַפְתָּ
  choice: rồi dâng họ lên
  rationale: Thể Hiphil của נוף trong nghi lễ chỉ hành động đưa qua đưa lại hoặc trình dâng. 'Dâng ... lên' truyền đạt chức năng nghi lễ tự nhiên hơn khi đối tượng là con người, còn động tác cụ thể được giữ trong cụm danh từ và chú thích.
- source_word: תְּנוּפָה
  choice: như một lễ vật đưa qua đưa lại
  rationale: Giữ tính chất kỹ thuật của thuật ngữ nghi lễ תְּנוּפָה và gợi đúng động tác đặc trưng, thay vì làm mất sắc thái bằng từ chung chung 'lễ vật'.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giới từ ל chỉ đối tượng tiếp nhận sự dâng hiến; danh thánh יהוה được chuyển tự là Yahweh.
theological_decisions:
- issue: Cách dịch danh thánh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; chuyển tự 'Yahweh' bảo tồn danh riêng mà không thay bằng một tước hiệu.
- issue: Cách diễn đạt nghi thức áp dụng cho người Lê-vi
  choice: dâng họ lên như một lễ vật đưa qua đưa lại
  alternative: đưa qua đưa lại họ như một lễ vật đưa qua đưa lại
  rationale: Bản dịch chính truyền đạt rõ đây là hành động trình dâng trong nghi lễ, đồng thời vẫn giữ tên gọi gắn với động tác đưa qua đưa lại. Chú thích bảo tồn lối diễn đạt lặp từ rõ nét của nguyên văn mà không khiến câu chính trở nên vụng hoặc gợi một động tác thô thiển đối với cả nhóm người.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. Dùng “Ngươi phải” để thể hiện lời chỉ truyền ở ngôi thứ hai số ít mà không thêm tên Môi-se vốn không xuất hiện trong câu. Cụm “lễ vật đưa qua đưa lại” giữ thuật ngữ nghi lễ, còn chú thích giải thích cấu trúc lặp từ của tiếng Hê-bơ-rơ.
