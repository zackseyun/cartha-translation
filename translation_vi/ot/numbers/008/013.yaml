  - severity: low
    issue: Từ "lên" trong "dâng họ lên" không được biểu thị trong nguyên văn.
    rationale: Hiphil của נוף cùng תְּנוּפָה chỉ hành động trình dâng/đưa qua đưa lại theo nghi thức. Bỏ "lên" tránh thêm một phương hướng không được nêu.
