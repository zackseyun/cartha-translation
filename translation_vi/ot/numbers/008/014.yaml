source:
  edition: WLC
  text: וְ/הִבְדַּלְתָּ֙ אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: vi
  text: Vậy, con phải biệt riêng người Lê-vi ra khỏi giữa con cái Y-sơ-ra-ên[a]; người Lê-vi sẽ thuộc về Ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Y-sơ-ra-ên”; nguyên văn Hê-bơ-rơ là “con cái Y-sơ-ra-ên”.
    reason: lexical_alternative
  - marker: b
    text: Hay “sẽ là của Ta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: Vậy, con phải biệt riêng
  rationale: Động từ Hiphil của בדל chỉ việc phân tách hoặc biệt riêng. “Biệt riêng” vừa tự nhiên trong tiếng Việt vừa phù hợp với bối cảnh phục vụ thánh, nhưng không diễn giải thành một thuật ngữ consecration mạnh hơn nguyên văn. Liên từ וְ được thể hiện bằng “Vậy” để nối bước thủ tục trong ngữ cảnh.
- source_word: אֶת הַלְוִיִּם
  choice: người Lê-vi
  rationale: Danh từ số nhiều có mạo từ, chỉ những người thuộc chi phái Lê-vi. “Người Lê-vi” là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt.
- source_word: מִתּוֹךְ
  choice: khỏi giữa
  rationale: Cụm từ diễn tả việc tách một nhóm ra từ bên trong một cộng đồng lớn hơn. “Khỏi giữa” giữ được hình ảnh không gian của nguyên văn mà vẫn trang trọng, dễ hiểu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ sát thành ngữ thân tộc theo nghĩa đen là “các con của Y-sơ-ra-ên”, đồng thời đây là cách diễn đạt Kinh Thánh quen thuộc trong tiếng Việt. Chú thích nêu cách dịch tự nhiên hơn là “dân Y-sơ-ra-ên”.
- source_word: וְהָיוּ לִי
  choice: sẽ thuộc về Ta
  rationale: Cấu trúc היה + לִי diễn tả sự thuộc về Đức Chúa Trời. “Thuộc về Ta” tự nhiên và rõ hơn “sẽ là của Ta” trong câu tiếng Việt, mà không thêm ý dâng hiến vốn không được phát biểu trực tiếp.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Giữ nguyên danh từ được lặp lại trong tiếng Hê-bơ-rơ thay vì thay bằng đại từ, qua đó bảo toàn sự nhấn mạnh và cấu trúc trang trọng của câu.
theological_decisions:
- issue: Tình trạng của người Lê-vi nên được diễn đạt như sự thuộc về hay sự thánh hiến cho Đức Chúa Trời
  choice: người Lê-vi sẽ thuộc về Ta
  alternative: người Lê-vi sẽ được biệt hiến cho Ta
  rationale: Cấu trúc לִי với היה trực tiếp nói đến sự thuộc về Đức Chúa Trời. Dù văn cảnh rộng hơn liên quan đến việc biệt riêng cho chức vụ thánh, câu này không dùng từ vựng minh nhiên về sự thánh hiến; vì vậy bản dịch không đưa thêm ý ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “con” và “Ta” phản ánh lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh. “Biệt riêng” và “thuộc về” giữ sắc thái nghi lễ–giao ước nhưng tránh diễn giải giáo lý vượt quá từ ngữ của câu.
