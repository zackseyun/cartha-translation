  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: vi
  text: Sau đó, người Lê-vi đến thi hành phận sự của mình trong Lều Hội Kiến, trước mặt A-rôn và các con trai ông. Y như Đức Giê-hô-va đã truyền cho Môi-se về người Lê-vi, người ta đã làm cho người Lê-vi như thế[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ta đã làm đối với người Lê-vi như thế.” Câu Hê-bơ-rơ rất súc tích; chủ ngữ của “đã làm” không được nêu rõ và câu này có thể nói đến việc thực hiện các nghi thức đã truyền liên quan đến người Lê-vi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sau đó
  rationale: Diễn đạt tự nhiên trình tự thời gian tiếp nối các nghi thức thanh tẩy và biệt riêng ở phần trước; quan hệ nối kết của וְ được hàm chứa trong mạch văn.
- source_word: בָּאוּ הַלְוִיִּם
  choice: người Lê-vi đến
  rationale: Giữ nghĩa thông thường của động từ בוא mà không diễn giải quá mức rằng họ đi vào bên trong lều.
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  choice: thi hành phận sự của mình
  rationale: Cụm Hê-bơ-rơ dùng động từ và danh từ cùng gốc để chỉ việc thực hiện công tác phụng sự nơi thánh; cách dịch này tránh lặp vụng về và không mang sắc thái giáo hội về sau.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Giữ giới từ chỉ phạm vi và dùng tên gọi quen thuộc, trang trọng cho אֹהֶל מוֹעֵד.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: trước mặt A-rôn và các con trai ông
  rationale: Giữ nghĩa trực tiếp của לִפְנֵי, không tự ý chuyển thành 'dưới sự giám sát', dù ý đó có thể được hàm chứa trong bối cảnh.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã ổn định và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: עַל הַלְוִיִּם
  choice: về người Lê-vi
  rationale: עַל ở đây đánh dấu đối tượng hoặc nội dung liên quan đến mệnh lệnh.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: thì họ làm cho người Lê-vi như thế
  rationale: Giữ chủ ngữ số nhiều không nêu đích danh và giới từ לְ theo hướng người thụ hưởng/đối tượng liên hệ; lặp danh từ để đại từ tiếng Việt không mơ hồ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Bản dịch giữ đây là danh riêng; 'Đức Giê-hô-va' là hình thức trang trọng, quen thuộc với đông đảo độc giả Kinh Thánh tiếng Việt.
- issue: Chủ thể và hướng tác động trong כֵּן עָשׂוּ לָהֶם
  choice: họ làm cho người Lê-vi như thế
  alternative: họ làm đối với người Lê-vi như thế
  rationale: Nguyên văn súc tích, không nhắc lại chủ thể của עָשׂוּ và לָהֶם có thể chỉ điều được làm cho hoặc đối với người Lê-vi. Bản chính giữ cách hiểu 'cho', còn chú thích bảo tồn khả năng kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'người Lê-vi' như danh từ tập hợp; giữ 'trước mặt' để bảo tồn cách diễn đạt của nguyên văn, đồng thời tránh áp đặt ý 'dưới quyền giám sát'. Dấu chú thích [a] đã được đặt ngay tại mệnh đề có cách hiểu khác.
