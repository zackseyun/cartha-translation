  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Đức Gia-vê phán với Môi-se[a] rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường dịch là “ĐỨC CHÚA TRỜI” hoặc “CHÚA”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán” trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho danh riêng YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, giới từ này biểu thị người tiếp nhận lời nói một cách tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức mở đầu lời trực tiếp, “rằng” diễn đạt tự nhiên chức năng dẫn vào nội dung được nói ở câu kế tiếp.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ ghi trực tiếp danh riêng YHWH. “Đức Giê-hô-va” giữ đây là danh riêng và là dạng quen thuộc, trang trọng đối với độc giả Việt; không thay bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và tự nhiên. Dùng công thức quen thuộc “phán với ... rằng” để dẫn vào lời trực tiếp ở câu tiếp theo.
