  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: vi
  text: Ta đã lấy người Lê-vi thay cho mọi con đầu lòng trong số các con trai Y-sơ-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong số dân Y-sơ-ra-ên”. Tiếng Hê-bơ-rơ viết sát nghĩa là “trong số các con trai Y-sơ-ra-ên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Ta đã nhận
  rationale: Động từ Qal wayyiqtol ngôi thứ nhất số ít của לקח có nghĩa cơ bản là “lấy/nhận”. Trong ngữ cảnh Đức Chúa Trời dành người Lê-vi cho mình để đảm nhiệm một vai trò, “nhận” tự nhiên trong tiếng Việt mà không diễn giải quá mức thành “chọn” hay “bổ nhiệm”.
- source_word: אֶת
  choice: '[dấu hiệu tân ngữ trực tiếp, không dịch]'
  rationale: Đánh dấu “người Lê-vi” là tân ngữ trực tiếp xác định và không có từ tương đương cần thể hiện riêng trong tiếng Việt.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Danh từ chỉ tập thể xác định, nói cụ thể đến những người thuộc chi phái Lê-vi; “người Lê-vi” là cách gọi chính xác và quen thuộc trong tiếng Việt.
- source_word: תַּחַת
  choice: thay cho
  rationale: Ở đây תַּחַת biểu thị sự thay thế, không phải vị trí ở bên dưới. “Thay cho” diễn đạt trực tiếp quan hệ thay thế trong ngữ cảnh.
- source_word: כָּל בְּכוֹר
  choice: mọi con đầu lòng
  rationale: כָּל đi với danh từ số ít בְּכוֹר mang nghĩa phân phối. “Mọi con đầu lòng” giữ được nghĩa ấy và không tự ý thêm “nam”, dù văn mạch rộng hơn nói đến con trai đầu lòng.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: trong số các con trai Y-sơ-ra-ên
  rationale: Cụm từ theo sát tiếng Hê-bơ-rơ là “các con trai Y-sơ-ra-ên”. “Trong số” diễn đạt tự nhiên sắc thái của giới từ ב trong quan hệ tập thể/phân xuất ở đây.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: các con trai Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: Bản văn dùng danh từ giống đực số nhiều ở dạng liên kết, nghĩa đen là “các con trai Y-sơ-ra-ên”. Bản chính giữ cách diễn đạt này để phản ánh hình thức nguồn, còn chú thích nêu cách dịch tự nhiên theo nghĩa tập thể.
- issue: Chủ thể ngôi thứ nhất
  choice: Ta
  alternative: Ta, Đức Chúa Trời
  rationale: Câu Hê-bơ-rơ chỉ dùng hình thái động từ ngôi thứ nhất số ít; văn mạch xác định người nói là Đức Chúa Trời. Không thêm danh xưng vào chính văn, qua đó tránh đưa vào những từ không có trong câu nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Trời trong văn mạch trực tiếp; giữ “các con trai Y-sơ-ra-ên” trong chính văn để phản ánh cấu trúc Hê-bơ-rơ, đồng thời chú thích cách diễn đạt tự nhiên theo nghĩa tập thể.
