base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se[a] rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng wayyiqtol đưa câu chuyện sang sự việc kế tiếp; “rồi” diễn đạt tự nhiên trình tự ấy, còn “phán” phù hợp với lời của Đức Chúa Trời trong văn phong trang trọng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Phiên âm danh riêng YHWH theo cách gọi đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc chỉ người tiếp nhận lời nói, “phán với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tiếng Việt thông dụng của tên riêng Hê-bơ-rơ מֹשֶׁה.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức dẫn nhập lời nói trực tiếp được chuyển tự nhiên sang tiếng Việt bằng “rằng”, chuẩn bị cho nội dung ở câu tiếp theo mà không lặp vụng “phán... nói”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu “CHÚA”; “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc, trang trọng, còn chú thích nêu rõ dạng Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ nhịp chuyển tiếp của וַ bằng “Rồi”; dùng dấu hai chấm vì lời phán trực tiếp bắt đầu ở câu kế tiếp.
