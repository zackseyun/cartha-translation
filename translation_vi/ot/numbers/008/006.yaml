base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: vi
  text: “Hãy đem người Lê-vi từ giữa con cái Y-sơ-ra-ên[a] ra, rồi thanh tẩy họ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai Y-sơ-ra-ên”; đây là cách gọi tập thể, cũng có thể dịch là “dân Y-sơ-ra-ên” hoặc “người Y-sơ-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: đem ... ra
  rationale: Mệnh lệnh số ít giống đực của לקח, nói với Môi-se. Kết hợp với מִתּוֹךְ, cách dịch “đem ... ra khỏi” diễn đạt tự nhiên hành động tách người Lê-vi khỏi cộng đồng rộng hơn.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Chỉ tập thể chi phái Lê-vi được dành cho công việc tại Đền Tạm; “người Lê-vi” là cách gọi rõ ràng và quen thuộc trong tiếng Việt.
- source_word: מִתּוֹךְ
  choice: ra khỏi cộng đồng
  rationale: Cụm này biểu thị việc đưa ra từ giữa một tập thể. “Ra khỏi cộng đồng” tự nhiên trong tiếng Việt và giữ ý phân riêng từ bên trong dân Y-sơ-ra-ên.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc và sắc thái giao ước của cụm Hê-bơ-rơ, đồng thời “con cái” trong tiếng Việt có thể chỉ chung toàn thể hậu duệ, không chỉ nam giới.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: và thanh tẩy họ
  rationale: Trong ngữ cảnh nghi lễ, טהר chỉ việc làm cho thanh sạch theo nghi thức. “Thanh tẩy” vừa trang trọng, dễ hiểu, vừa phân biệt với sự sạch sẽ thể chất thông thường.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Cách chọn này bảo tồn thành tố thân tộc “con cái” của nguyên văn và vẫn tự nhiên trong tiếng Việt, không giới hạn đối tượng vào nam giới.
- issue: Ý nghĩa của טהר
  choice: thanh tẩy
  alternative: làm cho thanh sạch; tẩy sạch
  rationale: Ngữ cảnh nói về sự thanh sạch theo nghi lễ của người Lê-vi, không nhất thiết là sự tha thứ tội lỗi hay vệ sinh thân thể; “thanh tẩy” giữ được phạm vi nghĩa đó mà không áp đặt thêm một hệ thống thần học.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Dùng “Y-sơ-ra-ên” và “Lê-vi” theo lối phiên âm Kinh Thánh quen thuộc; tránh câu quá sát chữ gây gượng như “từ giữa con cái Y-sơ-ra-ên”.
