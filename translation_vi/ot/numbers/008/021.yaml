source:
  edition: WLC
  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: vi
  text: Những người Lê-vi thanh tẩy mình và giặt y phục; A-rôn dâng họ làm lễ vật đưa qua đưa lại[a] trước mặt Yahweh. A-rôn làm lễ chuộc tội cho họ để thanh tẩy họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “A-rôn đưa họ qua đưa lại như một lễ vật.” Tiếng Hê-bơ-rơ dùng thành ngữ nghi lễ chỉ việc trình dâng trước mặt Yahweh; câu này không giải thích chi tiết động tác nghi lễ ấy.'
    reason: Nêu một phương án dịch thực sự cho וַיָּנֶף ... תְּנוּפָה, đồng thời bảo toàn sự không rõ ràng về cách thực hiện nghi thức.
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: thanh tẩy mình
  rationale: Dạng Hitpael diễn tả việc các người Lê-vi tự trải qua sự thanh tẩy trong bối cảnh nghi lễ. Bản dịch không thêm cụm “khỏi tội lỗi,” vì câu Hê-bơ-rơ không nói rõ đối tượng cần loại bỏ là tội lỗi hay sự ô uế.
- source_word: הַלְוִיִּם
  choice: các người Lê-vi
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với tập thể người thuộc chi phái Lê-vi, đồng thời giữ tính xác định của danh từ.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: giặt y phục
  rationale: “Y phục” giữ sắc thái trang trọng, phù hợp bối cảnh nghi lễ, và diễn đạt rõ hành động giặt quần áo của họ.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: dâng họ làm lễ vật đưa qua đưa lại
  rationale: Cụm từ giữ ý niệm nghi lễ của תנופה và đối tượng trực tiếp là chính các người Lê-vi, nhưng dùng “dâng” để tránh khẳng định quá mức cách thức chuyển động vật lý vốn không được câu này giải thích.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Diễn đạt tự nhiên ý ở trước sự hiện diện của Đức Chúa Trời và phiên âm trực tiếp danh giao ước יהוה là “Yahweh.”
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: làm lễ chuộc tội cho họ
  rationale: Cách diễn đạt quen thuộc, dễ hiểu cho hành động כפר trong bối cảnh tế lễ, không quy định chi tiết cơ chế thần học ngoài câu văn.
- source_word: לְטַהֲרָם
  choice: để thanh tẩy họ
  rationale: Giữ quan hệ mục đích của tiền tố לְ và ngôn ngữ thanh sạch nghi lễ của טהר.
theological_decisions:
- issue: Mối quan hệ giữa חטא, כפר và טהר trong nghi thức biệt riêng người Lê-vi
  choice: Dùng “thanh tẩy mình,” “làm lễ chuộc tội” và “để thanh tẩy họ.”
  alternative: Dùng “tẩy sạch tội mình,” “làm lễ xá tội” và “để làm cho họ tinh sạch.”
  rationale: 'Lựa chọn này bảo toàn các phạm trù nghi lễ liên hệ nhưng không đồng nhất: người Lê-vi tự thanh tẩy, A-rôn thực hiện nghi thức chuộc tội cho họ, và mục đích là họ được thanh tẩy. Không thêm “khỏi tội lỗi” vì động từ đầu câu có thể bao hàm sự thanh tẩy khỏi ô uế nghi lễ.'
- issue: Cách thể hiện nghi thức תנופה khi đối tượng là con người
  choice: “dâng họ làm lễ vật đưa qua đưa lại,” kèm chú thích về cách dịch sát chữ
  alternative: “đưa họ qua đưa lại làm lễ vật”
  rationale: Nguyên văn dùng thành ngữ nghi lễ נוף ... תנופה nhưng không giải thích A-rôn đã thực hiện động tác với các người Lê-vi như thế nào. Bản chính giữ tên nghi lễ mà không buộc người đọc hiểu rằng ông nhấc hoặc vẫy từng người theo nghĩa thô.
- issue: Danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Dùng danh riêng “Yahweh” để phản ánh trực tiếp danh giao ước xuất hiện trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng dấu chấm phẩy để nối hai hành động chuẩn bị của người Lê-vi với việc A-rôn trình dâng họ; câu sau làm nổi bật hành động chuộc tội riêng. Thuật ngữ “lễ vật đưa qua đưa lại” giữ sắc thái nghi lễ mà vẫn có thể hiểu được trong tiếng Việt phổ thông.
