base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: vi
  text: Họ phải lấy một con bò đực tơ, cùng với lễ vật ngũ cốc của nó bằng bột mịn trộn với dầu; còn ngươi, hãy lấy một con bò đực tơ thứ hai để làm lễ chuộc tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ tế thanh tẩy.” Từ Hê-bơ-rơ חַטָּאת trong ngữ cảnh nghi lễ tư tế có thể chỉ lễ chuộc tội hoặc lễ tế thanh tẩy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Họ phải bắt
  rationale: Dạng Qal hoàn thành có waw trong chuỗi chỉ dẫn nghi lễ mang lực mệnh lệnh; “phải” diễn đạt tự nhiên nghĩa vụ trong tiếng Việt.
- source_word: פַּר בֶּן בָּקָר
  choice: một con bò đực tơ
  rationale: Thành ngữ Hê-bơ-rơ chỉ một bò đực còn non; “một” giúp phân biệt với con thứ hai được nhắc sau đó.
- source_word: וּמִנְחָתוֹ
  choice: cùng với lễ vật ngũ cốc của nó
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה là lễ vật bằng ngũ cốc; hậu tố số ít giống đực quy chiếu về con bò thứ nhất.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Thuật ngữ nghi lễ thông dụng chỉ loại bột được xay mịn để dâng làm lễ vật.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: trộn dầu
  rationale: Diễn đạt rõ ràng, tự nhiên công thức chuẩn bị lễ vật; tiếng Hê-bơ-rơ có giới từ nhưng tiếng Việt không cần thêm “với”.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: còn con, hãy bắt một con bò đực tơ thứ hai
  rationale: Giữ sự chuyển đổi từ ngôi thứ ba số nhiều sang ngôi thứ hai số ít trong nguyên văn; trật tự tiếng Việt làm nổi bật người được trực tiếp truyền lệnh.
- source_word: לְחַטָּאת
  choice: để làm lễ chuộc tội
  rationale: Đây là cách gọi quen thuộc trong tiếng Việt đối với tế lễ חַטָּאת, đồng thời ghi chú bảo lưu sắc thái nghi lễ thanh tẩy.
theological_decisions:
- issue: Cách dịch חַטָּאת trong luật tế lễ
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: “Lễ chuộc tội” là tên gọi quen thuộc và phản ánh mối liên hệ từ vựng với tội lỗi; tuy vậy, trong ngữ cảnh tư tế, tế lễ này cũng thực hiện chức năng thanh tẩy, nên phương án kỹ thuật hơn được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “bắt” theo nghĩa chọn/lấy súc vật cho nghi lễ; giữ rõ sự chuyển ngôi từ “họ” sang “con” trong nguyên văn và dùng “lễ vật ngũ cốc” để phân biệt với các loại tế lễ khác.
