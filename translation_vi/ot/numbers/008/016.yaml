revisions:
- from: Vì họ đã được hiến trọn cho Ta từ giữa con cái Y-sơ-ra-ên[a]. Thay cho mọi con đầu lòng mở dạ mẹ[b] trong con cái Y-sơ-ra-ên[c], Ta đã nhận họ làm của riêng Ta.
  to: Vì họ đã được hiến trọn cho Ta từ giữa con cái Y-sơ-ra-ên[a]. Thay cho mọi con mở lòng mẹ[b]—tức mọi con trai đầu lòng trong con cái Y-sơ-ra-ên[c]—Ta đã nhận họ làm của riêng Ta.
  rationale: 'Bản sửa phục hồi cấu trúc đồng vị của tiếng Hê-bơ-rơ: «mọi con mở lòng mẹ» được giải thích là «mọi con trai đầu lòng trong con cái Y-sơ-ra-ên». Nhờ vậy bản dịch vừa giữ được thành ngữ nguồn, vừa rõ nghĩa và phản ánh phạm vi/giống của cụm «con đầu lòng» mà không loại bỏ cách gọi gia tộc «con cái Y-sơ-ra-ên».'
  reviewer_model: gpt-5.6-terra
