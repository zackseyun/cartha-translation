source:
  edition: WLC
  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: vi
  text: Vì họ đã được hiến trọn cho Ta từ giữa con cái Y-sơ-ra-ên[a]. Thay cho mọi con mở lòng mẹ[b]—tức mọi con trai đầu lòng trong con cái Y-sơ-ra-ên[c]—Ta đã nhận họ làm của riêng Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn lặp hai lần từ “được hiến” để nhấn mạnh; cũng có thể dịch: “chắc chắn đã được hiến cho Ta” hoặc “đã được hiến hoàn toàn cho Ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “mọi kẻ mở lòng mẹ,” một thành ngữ chỉ con đầu lòng.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “các con trai Y-sơ-ra-ên”; trong ngữ cảnh, cụm này chỉ dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: đã được hiến trọn
  rationale: Phân từ bị động được lặp lại để nhấn mạnh việc người Lê-vi được trao hiến hoàn toàn cho Đức Chúa Trời; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn thể hiện sắc thái tăng cường.
- source_word: לִי
  choice: cho Ta
  rationale: Giới từ với đại từ ngôi thứ nhất biểu thị sự dâng hiến và thuộc về Đức Chúa Trời; “cho Ta” phù hợp với cấu trúc “được hiến”.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: từ giữa con cái Y-sơ-ra-ên
  rationale: מִתּוֹךְ chỉ việc chọn ra từ bên trong một cộng đồng; “từ giữa” vừa sát nghĩa vừa trang trọng.
- source_word: תַּחַת
  choice: thay cho
  rationale: 'Từ này biểu thị sự thay thế: người Lê-vi được nhận thay cho các con đầu lòng của Y-sơ-ra-ên.'
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: mọi con đầu lòng mở dạ mẹ
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ về người con đầu tiên ra khỏi lòng mẹ, đồng thời thêm “con đầu lòng” để câu tiếng Việt rõ nghĩa.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: trong con cái Y-sơ-ra-ên
  rationale: בְּכוֹר làm rõ thành ngữ ngay trước đó là “con đầu lòng”; tiếng Việt gộp ý này vào cụm “mọi con đầu lòng mở dạ mẹ” để tránh lặp nặng nề.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: Ta đã nhận họ làm của riêng Ta
  rationale: Động từ hoàn thành cùng לִי diễn tả hành động Đức Chúa Trời đã nhận và xác lập quyền sở hữu; cách dịch này tự nhiên và giữ rõ yêu sách riêng của Ngài.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” giữ hình thức gia tộc của nguyên văn, đồng thời trong ngữ cảnh vẫn chỉ toàn thể cộng đồng Y-sơ-ra-ên.
- issue: Ý nghĩa thay thế của người Lê-vi
  choice: Thay cho mọi con đầu lòng
  alternative: Đổi lấy mọi con đầu lòng
  rationale: תַּחַת nêu quan hệ thay thế chứ không nhất thiết mô tả một giao dịch trao đổi; “thay cho” bảo toàn ý mà không bổ sung một cơ chế thần học ngoài câu.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” thể hiện lời Đức Chúa Trời. Bản dịch ưu tiên tương đương tối ưu: giữ phép nhấn mạnh, quan hệ thay thế và hình ảnh “mở dạ mẹ,” nhưng điều chỉnh cú pháp để tiếng Việt tự nhiên.'
