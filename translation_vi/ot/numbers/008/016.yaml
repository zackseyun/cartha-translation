    rationale: Cách đặt này có thể khiến người đọc hiểu «con đầu lòng» là chủ thể của động từ «mở». Cần chuyển thành «mọi con mở lòng mẹ» và nêu rõ bằng apposition rằng đó là các con trai đầu lòng.
  - severity: low
