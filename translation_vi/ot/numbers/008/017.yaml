id: NUM.8.17
reference: Numbers 8:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: vi
  text: Vì mọi con đầu lòng trong dân Y-sơ-ra-ên, cả người lẫn súc vật, đều thuộc về Ta. Vào ngày Ta đánh mọi con đầu lòng trong đất Ai Cập, Ta đã thánh hiến chúng cho chính Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đã biệt riêng chúng cho chính Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giới thiệu lý do cho lời khẳng định ngay trước đó, phù hợp với chức năng giải thích của liên từ trong ngữ cảnh.
- source_word: לִי
  choice: thuộc về Ta
  rationale: Diễn đạt tự nhiên ý sở hữu của giới từ לְ với đại từ ngôi thứ nhất.
- source_word: כָל בְּכוֹר
  choice: mọi con đầu lòng
  rationale: Giữ nghĩa tập hợp của cụm Hê-bơ-rơ mà không thêm ý 'đực', vốn không được nêu rõ trong câu này.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: trong dân Y-sơ-ra-ên
  rationale: Trong tiếng Việt hiện đại, cách nói này tự nhiên và rõ nghĩa hơn 'giữa các con trai Y-sơ-ra-ên', đồng thời vẫn chỉ cộng đồng giao ước xuất phát từ Y-sơ-ra-ên.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: cả người lẫn súc vật
  rationale: Thể hiện rõ sự đối chiếu giữa loài người và loài vật; 'súc vật' phù hợp với phạm vi בְּהֵמָה trong bối cảnh con đầu lòng của gia súc.
- source_word: בְּיוֹם
  choice: Vào ngày
  rationale: Giữ cách diễn đạt thời gian cụ thể của nguyên văn thay vì giản lược thành 'khi'.
- source_word: הַכֹּתִי
  choice: Ta đánh
  rationale: Dịch trực tiếp động từ נכה, không tự thêm 'chết' dù bối cảnh tai vạ cho thấy hậu quả ấy.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trong đất Ai Cập
  rationale: Giữ danh từ 'đất' của nguyên văn và sắc thái địa lý-lịch sử.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: Ta đã biệt riêng chúng ra thánh cho Ta
  rationale: Diễn đạt cả ý biệt riêng lẫn chiều kích thánh của dạng Hiphil קדשׁ; 'cho Ta' giữ yêu sách thuộc riêng về Đức Chúa Trời.
theological_decisions:
- issue: Phạm vi của אָדָם khi đối chiếu với בְּהֵמָה
  choice: người
  alternative: loài người
  rationale: '''Người'' là danh từ tập hợp tự nhiên trong tiếng Việt và, khi đứng đối với ''súc vật'', chỉ rõ toàn thể phạm trù con người mà không giới hạn vào nam giới.'
- issue: Sắc thái thánh biệt của הִקְדַּשְׁתִּי
  choice: biệt riêng chúng ra thánh cho Ta
  alternative: thánh hiến chúng cho Ta
  rationale: Cách chọn giữ cả hành động tách riêng và địa vị thánh thuộc về Đức Chúa Trời, đồng thời dễ hiểu đối với độc giả phổ thông hơn thuật ngữ 'thánh hiến'.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta” cho lời Đức Chúa Trời. Cấu trúc “cả… lẫn…” tái hiện sự đối chiếu người–súc vật một cách tự nhiên trong tiếng Việt; dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
