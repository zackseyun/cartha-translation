revisions:
- from: Vì mọi con đầu lòng trong dân Y-sơ-ra-ên, cả người lẫn súc vật, đều thuộc về Ta. Vào ngày Ta đánh mọi con đầu lòng trong đất Ai Cập, Ta đã biệt riêng chúng ra thánh cho Ta.[a]
  to: Vì mọi con đầu lòng trong dân Y-sơ-ra-ên, cả người lẫn súc vật, đều thuộc về Ta. Vào ngày Ta đánh mọi con đầu lòng trong đất Ai Cập, Ta đã thánh hiến chúng cho chính Ta.[a]
  rationale: Thay cách diễn đạt không chuẩn “biệt riêng chúng ra thánh” bằng “thánh hiến chúng cho chính Ta,” là thuật ngữ tiếng Việt hiện đại, trang trọng và chính xác cho הִקְדַּשְׁתִּי אֹתָם לִי. Chú thích được đảo thành phương án “biệt riêng,” vẫn bảo tồn lựa chọn từ vựng hợp lệ mà không thay đổi nghĩa câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:39:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: tính giải thích của “Vì,” quyền sở hữu của Đức Chúa Trời, phạm vi con đầu lòng gồm người và súc vật, biến cố đánh các con đầu lòng tại Ai Cập, và hành động thánh hóa dành cho chính Ngài. Tuy nhiên, cụm “biệt riêng chúng ra thánh” không phải cách diễn đạt tiếng Việt chuẩn, nên không diễn đạt rõ và tự nhiên sắc thái Hiphil của קדשׁ.'
  naturalness: Câu đầu tự nhiên và giữ được phép song đối “cả người lẫn súc vật.” Câu hai cần thay cụm “biệt riêng chúng ra thánh” bằng một cách nói hiện hành, trang trọng hơn. “Thánh hiến chúng cho chính Ta” vừa tự nhiên vừa phù hợp văn cảnh thờ phượng.
  terminology: '“Thánh hiến” diễn đạt thích đáng ý קדשׁ ở thể Hiphil: dành riêng/biệt riêng thành thánh cho Đức Chúa Trời. “Cho chính Ta” phản ánh לִי rõ hơn trong tiếng Việt và tránh để “cho Ta” bị đọc như chỉ một mục đích chung chung.'
  issues:
  - severity: medium
    issue: Cụm “Ta đã biệt riêng chúng ra thánh cho Ta” không tự nhiên và không phải kết cấu tiếng Việt chuẩn.
    rationale: “Biệt riêng ... ra thánh” là lối ghép gượng, có thể gây khó hiểu. Động từ “thánh hiến” diễn đạt trọn vẹn hành động biệt riêng thành thánh trong nguyên ngữ mà không thêm nghĩa.
