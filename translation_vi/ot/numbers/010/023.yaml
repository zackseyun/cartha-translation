  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: vi
  text: Người chỉ huy đơn vị[a] của chi tộc Ma-na-se là Ga-ma-li-ên, con trai Phê-đa-xu-rơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ צְבָא cũng có thể dịch là “đội ngũ”, “quân đội” hoặc “đơn vị”; ở đây từ này chỉ lực lượng bộ tộc được tổ chức.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Chỉ huy ... là
  rationale: Trong công thức lặp lại về thứ tự lên đường, עַל chỉ người được đặt trên một đơn vị. Cách diễn đạt này tự nhiên trong tiếng Việt và truyền đạt rõ chức trách lãnh đạo; liên từ וְ không cần dịch riêng vì câu tiếng Việt vẫn nối tiếp mạch liệt kê.
- source_word: צְבָא
  choice: đạo quân
  rationale: Từ này chỉ lực lượng được tổ chức của bộ tộc trong đội hình hành quân; “đạo quân” giữ được sắc thái quân sự mà không nhất thiết giới hạn vào một đơn vị tác chiến theo nghĩa hiện đại.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong sách Dân Số, từ này ở đây chỉ đơn vị bộ tộc, không phải cây gậy.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: con cháu Ma-na-se
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Ma-na-se”, nhưng trong danh xưng bộ tộc, nó chỉ dòng dõi mang tên Ma-na-se; “con cháu” tự nhiên và chính xác về phạm vi trong tiếng Việt.
- source_word: גַּמְלִיאֵל
  choice: Ga-ma-li-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang dạng quen dùng, dễ đọc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Giữ rõ quan hệ cha-con nam được nêu trực tiếp trong nguyên văn.
- source_word: פְּדָה צוּר
  choice: Phê-đa-xua
  rationale: Hai thành tố trong cách trình bày văn bản tạo thành một tên riêng duy nhất; được phiên âm thống nhất thành Phê-đa-xua.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc “Chỉ huy ... là ...” thay cho lối dịch sát chữ “ở trên ... là ...” để câu tự nhiên trong tiếng Việt, đồng thời giữ nguyên ý về người đứng đầu đơn vị. Tên riêng được phiên âm có gạch nối theo thông lệ Kinh Thánh tiếng Việt.
