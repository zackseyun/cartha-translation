revisions:
- from: Chỉ huy đạo quân của bộ tộc con cháu Ma-na-se là Ga-ma-li-ên, con trai Phê-đa-xua.[a]
  to: Người chỉ huy đơn vị[a] của chi tộc Ma-na-se là Ga-ma-li-ên, con trai Phê-đa-xu-rơ.
  rationale: Bản sửa thay “đạo quân” bằng “đơn vị” để giữ nghĩa rộng của צְבָא trong bối cảnh tổ chức hành quân, đổi cụm danh xưng bộ tộc sang tiếng Việt tự nhiên hơn, chỉnh phiên âm Pedahzur để phản ánh thành tố cuối của tên Hê-bơ-rơ, và chuyển neo chú thích đến đúng từ được chú giải. Ý nghĩa của câu không thay đổi.
