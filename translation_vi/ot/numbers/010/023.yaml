    issue: “đạo quân” có thể khiến צְבָא bị hiểu là quân đội theo nghĩa chiến đấu.
    rationale: Trong Dân Số 10, צְבָא chỉ đoàn người/đơn vị bộ tộc được tổ chức trong đội hình hành quân; “đơn vị” giữ độ rộng ngữ nghĩa tốt hơn.
  - severity: medium
    issue: Tên “Phê-đa-xua” làm mất hoặc làm mờ thành tố cuối צור của פְּדָהצוּר.
    rationale: Dạng “Phê-đa-xu-rơ” phản ánh đầy đủ hơn tên riêng Pedahzur và nhất quán với chính sách phiên âm tên.
  - severity: low
    issue: Dấu chú thích từ vựng hiện đặt sau tên riêng thay vì ngay sau từ dịch צְבָא.
    rationale: Đặt [a] sau “đơn vị” tạo neo chú thích chính xác.
  revised_text: Người chỉ huy đơn vị[a] của chi tộc Ma-na-se là Ga-ma-li-ên, con trai Phê-đa-xu-rơ.
