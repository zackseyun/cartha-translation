base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: vi
  text: Và người chỉ huy đạo quân của chi tộc Y-sa-ca là Nê-tha-nê-ên, con trai Xu-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch “đội ngũ” hoặc “đơn vị” thay cho “đạo quân” (Hê-bơ-rơ: צְבָא), chỉ một tập thể thuộc chi tộc được tổ chức theo thứ tự hành quân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Người chỉ huy
  rationale: Trong công thức liệt kê này, giới từ עַל chỉ người đứng đầu một đơn vị; chuyển thành “người chỉ huy” tạo câu tiếng Việt tự nhiên, còn liên từ וְ được hàm ý qua sự tiếp nối của danh sách.
- source_word: צְבָא
  choice: đạo quân
  rationale: Từ này chỉ một lực lượng có tổ chức đang hành quân. “Đạo quân” giữ sắc thái quân sự và trật tự đội ngũ mà không nhất thiết nói đến giao chiến; các cách “đội ngũ” hoặc “đơn vị” cũng có thể dùng.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong ngữ cảnh tổ chức trại quân và cuộc hành trình, מַטֵּה mang nghĩa bộ tộc, không phải cây gậy.
- source_word: בְּנֵי יִשָׂשכָר
  choice: con cháu Y-sa-ca
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Y-sa-ca”, nhưng trong công thức bộ tộc này nó chỉ những người thuộc dòng dõi Y-sa-ca; “con cháu” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: נְתַנְאֵל
  choice: Na-tha-na-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: בֶּן צוּעָר
  choice: con trai Xu-a
  rationale: Giữ nguyên quan hệ phụ hệ được nêu trực tiếp trong cấu trúc Hê-bơ-rơ.
