- from: Người chỉ huy đạo quân của bộ tộc con cháu Y-sa-ca là Na-tha-na-ên, con trai Xu-a.[a]
  to: Và người chỉ huy đạo quân của chi tộc Y-sa-ca là Nê-tha-nê-ên, con trai Xu-a.[a]
  rationale: Bản sửa giữ ý Na-tha-na-ên là người đứng đầu đơn vị hành quân của chi tộc Y-sa-ca, khôi phục liên từ nối câu, và thay cụm danh ngữ gượng bằng cách gọi chi tộc tự nhiên trong tiếng Việt. Chú thích vẫn bảo tồn các khả năng dịch hợp lý của צְבָא.
