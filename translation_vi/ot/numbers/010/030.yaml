translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và tự nhiên. Lược đại từ gián tiếp “với ông ấy” vì tiếng Việt không cần nhắc lại trong lời đáp; thêm “trở về” để thể hiện hướng đi về quê quán vốn hàm chứa trong ngữ cảnh, không nhằm bổ sung ý thần học.
