  text: 'Nhưng ông đáp: “Không, tôi sẽ không đi; nhưng tôi sẽ đi về xứ sở và họ hàng của mình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Tôi sẽ
  rationale: Trong mạch phủ định rồi đối lập, cụm này chuyển hướng sang điều người nói quyết làm; tiếng Việt tự nhiên không cần dịch máy móc là “nhưng đúng hơn”.
- source_word: אַרְצִי
  choice: quê hương
  rationale: Diễn đạt tự nhiên ý “đất/xứ của tôi” trong bối cảnh trở về nơi xuất thân.
- source_word: מוֹלַדְתִּי
  choice: họ hàng của mình
  rationale: Từ này có thể chỉ nơi sinh quán hoặc cộng đồng thân tộc; đi song song với “đất/xứ của tôi”, nghĩa thân tộc phù hợp hơn và tránh lặp ý.
