  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: vi
  text: Nhưng khi triệu tập hội chúng, các ngươi phải thổi kèn, chứ không được thổi hiệu lệnh báo động.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/הַקְהִיל
  choice: Nhưng khi triệu tập
  rationale: Liên từ, giới từ và động từ nguyên mẫu Hiphil của קהל tạo ý nghĩa thời gian; “nhưng khi” cũng thể hiện sự tương phản với tín hiệu lên đường ở câu trước.
- source_word: הַקָּהָל
  choice: hội chúng
  rationale: קָהָל chỉ cộng đồng Israel được tập hợp; “hội chúng” tự nhiên, trang trọng và phân biệt cộng đồng với hành động triệu tập.
- source_word: תִּתְקְעוּ
  choice: phải thổi kèn
  rationale: תקע ở đây nói đến việc thổi các kèn đã được nêu trong ngữ cảnh. Tiếng Việt cần nêu “kèn” để câu rõ và tự nhiên, dù danh từ này không được lặp lại trong câu Hê-bơ-rơ.
- source_word: וְלֹא
  choice: chứ không được
  rationale: Cách diễn đạt này nối hai mệnh lệnh trái ngược nhau một cách tự nhiên, đồng thời giữ rõ sắc thái cấm đoán.
- source_word: תָרִיעוּ
  choice: thổi hồi báo động
  rationale: Dạng Hiphil của רוע trong ngữ cảnh kèn chỉ một kiểu hiệu lệnh báo động đặc trưng, khác với việc thổi thông thường để triệu tập.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “các ngươi” để phản ánh ngôi thứ hai số nhiều trong lời truyền cho Môi-se và A-rôn, đồng thời giữ nhịp văn luật lệ. Không thêm chú thích vì phương án dịch chính đã thể hiện trực tiếp sự đối lập giữa tiếng kèn triệu tập và hồi báo động.
