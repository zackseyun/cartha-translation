    reason: alternative_reading
  revision_rationale: Bản sửa làm rõ ngữ pháp của danh xưng "người Ma-đi-an", giữ nguyên cách dịch chính "cha vợ" kèm chú thích về sự bất định của quan hệ, và thay cách nói "các con" bằng "các ngươi" để phản ánh trực tiếp đại từ số nhiều được Yahweh dùng với cộng đồng Y-sơ-ra-ên. Dấu chấm phẩy phân tách hai mệnh đề mệnh lệnh/lời hứa trong cùng lời nói mà không thay đổi ý nghĩa.
