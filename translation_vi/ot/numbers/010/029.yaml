source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: vi
  text: 'Môi-se nói với Hô-báp, con trai của Rê-u-ên, người Ma-đi-an, là cha vợ của Môi-se[a]: “Chúng ta đang lên đường đến nơi mà Yahweh đã phán: ‘Ta sẽ ban nơi ấy cho các ngươi.’ Hãy đi cùng chúng tôi; chúng tôi sẽ làm điều tốt cho ông, vì Yahweh đã phán điều tốt lành về Y-sơ-ra-ên.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ חֹתֵן có thể chỉ một người có quan hệ thông gia theo nghĩa rộng hơn; vì thế, một số người hiểu Hô-báp là anh/em vợ của Môi-se hoặc một người bà con do hôn nhân, chứ không phải cha vợ.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבָב
  choice: Hô-báp
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc, rõ ràng trong tiếng Việt.
- source_word: רְעוּאֵל
  choice: Rê-u-ên
  rationale: Phiên âm tên riêng, không dịch nghĩa.
- source_word: הַמִּדְיָנִי
  choice: người Ma-đi-an
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt đối với danh xưng chỉ dân tộc có mạo từ.
- source_word: חֹתֵן מֹשֶׁה
  choice: cha vợ của Môi-se
  rationale: חֹתֵן thường chỉ cha vợ, nhưng cũng có thể chỉ quan hệ thông gia rộng hơn; sự bất định được giữ lại trong chú thích.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: chúng ta đang lên đường
  rationale: Phân từ đi với đại từ diễn tả hành trình đang hoặc sắp bắt đầu; cụm này tự nhiên và sát ngữ cảnh.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: 'mà Yahweh đã phán: ‘Ta sẽ ban nơi ấy cho các con’'
  rationale: Giữ lời hứa trực tiếp; אֹתוֹ quy chiếu về 'nơi', còn לָכֶם là số nhiều, chỉ cộng đồng được phán với.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: לְכָה אִתָּנוּ
  choice: Hãy đi cùng chúng tôi
  rationale: Diễn đạt lời mời tự nhiên bằng tiếng Việt và phù hợp với việc cả nhóm cùng lên đường.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: chúng tôi sẽ làm điều tốt cho anh
  rationale: Giữ ý chủ động làm điều có lợi cho người được mời, không thu hẹp thành cách đối đãi nói chung.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: đã phán điều tốt lành về Y-sơ-ra-ên
  rationale: Giữ động từ 'phán' và nội dung 'điều tốt lành', tránh diễn giải hẳn thành 'hứa ban phước'.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh YHWH; phiên âm 'Yahweh' bảo tồn danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ được biểu thị bởi חֹתֵן מֹשֶׁה
  choice: cha vợ của Môi-se
  alternative: anh/em vợ của Môi-se; người bà con bên vợ của Môi-se
  rationale: Nghĩa thông dụng là 'cha vợ', nhưng từ Hê-bơ-rơ có thể chỉ người có quan hệ thông gia rộng hơn. Bản chính dùng nghĩa thông dụng và chú thích bảo tồn sự không chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng cách xưng hô “anh” trong lời Môi-se nói với Hô-báp; dùng “các con” trong lời phán của Yahweh để thể hiện đại từ số nhiều hướng đến cộng đồng Y-sơ-ra-ên. Dấu chú thích [a] xuất hiện ngay sau cụm từ có vấn đề.
