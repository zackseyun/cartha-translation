language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: vi
  text: 'Mỗi khi Hòm khởi hành[a], Môi-se nói: “Lạy Yahweh, xin trỗi dậy[b]! Nguyện kẻ thù của Ngài bị tan tác, và nguyện những kẻ ghét Ngài chạy trốn trước mặt Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Và xảy ra là khi Hòm khởi hành.” Trong ngữ cảnh, thành ngữ Hê-bơ-rơ có lẽ nói đến điều xảy ra mỗi lần Hòm khởi hành.'
    reason: lexical_alternative
  - marker: b
    text: “Xin trỗi dậy” là lời khẩn cầu Yahweh hành động bằng quyền năng, không hàm ý Ngài trước đó không hoạt động.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: Mỗi khi ... khởi hành
  rationale: Cấu trúc היה với giới từ ב và động từ nguyên mẫu trong ngữ cảnh này diễn tả hoàn cảnh lặp lại. “Mỗi khi” truyền đạt tự nhiên sắc thái ấy; “khởi hành” phù hợp với việc Hòm bắt đầu di chuyển.
- source_word: הָאָרֹן
  choice: Hòm Giao Ước
  rationale: Danh từ xác định הָאָרֹן tự thân là “cái hòm”; trong tiếng Việt, “Hòm Giao Ước” giúp độc giả nhận ra vật thánh cụ thể đang được nói đến. Đây là cách gọi quy ước theo ngữ cảnh, dù cụm “giao ước” không xuất hiện trực tiếp trong câu.
- source_word: קוּמָה
  choice: xin trỗi dậy
  rationale: Mệnh lệnh hướng đến Yahweh là lời khẩn cầu Ngài đứng lên hành động. “Xin trỗi dậy” giữ hình ảnh sống động mà không hàm ý Ngài trước đó bất lực hay không hoạt động.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó phản ánh trực tiếp Tứ Tự Danh trong bản Hê-bơ-rơ.
- source_word: וְיָפֻצוּ
  choice: nguyện ... tan tác
  rationale: Dạng vị hoàn thành sau mệnh lệnh mang lực cầu khiến. “Nguyện” giữ sắc thái khẩn cầu; “tan tác” diễn đạt tự nhiên việc quân thù bị phân tán.
- source_word: אֹיְבֶיךָ
  choice: quân thù của Ngài
  rationale: Chỉ những kẻ thù của Yahweh trong khung cảnh hành quân. “Quân thù” tự nhiên và trang trọng, phù hợp ngữ cảnh quân sự.
- source_word: וְיָנֻסוּ
  choice: nguyện ... chạy trốn
  rationale: Song song với וְיָפֻצוּ và cũng mang lực cầu khiến; cách dịch duy trì cấu trúc lời cầu xin.
- source_word: מְשַׂנְאֶיךָ
  choice: những kẻ ghét Ngài
  rationale: Phân từ mô tả những người có thái độ thù ghét thường xuyên; cách diễn đạt này trực tiếp, tự nhiên và giữ tính chất cá nhân của sự chống nghịch.
- source_word: מִפָּנֶיךָ
  choice: khỏi mặt Ngài
  rationale: Giữ gần hình ảnh Hê-bơ-rơ về việc kẻ thù tháo chạy khỏi trước mặt hay sự hiện diện của Yahweh; cụm này cũng phù hợp văn phong Kinh Thánh trang trọng.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng danh riêng Tứ Tự Danh. “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của lời “xin trỗi dậy” khi nói với Đức Chúa Trời
  choice: Giữ nguyên ẩn dụ về việc Yahweh trỗi dậy hành động
  alternative: Diễn giải là “xin hãy hành động bằng quyền năng”
  rationale: Nguyên văn dùng mệnh lệnh קוּמָה. Giữ hình ảnh này bảo tồn sức mạnh thi ca và không buộc câu vào một cách giải thích giáo lý; chú thích làm rõ đây là lời cầu xin hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Môi-se,” đại từ tôn kính “Ngài,” cùng cấu trúc cầu nguyện “Lạy... xin... nguyện...” để phản ánh lời khẩn cầu. Chỉ đặt một chú thích có ký hiệu [a] xuất hiện trong chính văn.
