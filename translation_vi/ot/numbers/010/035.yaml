revisions:
- from: 'Mỗi khi Hòm Giao Ước khởi hành[a], Môi-se nói: “Lạy Yahweh, xin trỗi dậy! Nguyện quân thù của Ngài tan tác, nguyện những kẻ ghét Ngài chạy trốn khỏi mặt Ngài.”'
  to: 'Mỗi khi Hòm khởi hành[a], Môi-se nói: “Lạy Yahweh, xin trỗi dậy[b]! Nguyện kẻ thù của Ngài bị tan tác, và nguyện những kẻ ghét Ngài chạy trốn trước mặt Ngài.”'
  rationale: Bản sửa loại bỏ phần bổ sung “Giao Ước” để bám sát danh từ nguyên văn, điều chỉnh thành ngữ chỉ sự tháo chạy “trước mặt Ngài,” và thêm chú thích cần thiết cho ẩn dụ “trỗi dậy.” Các yếu tố còn lại—sắc thái “mỗi khi,” danh Yahweh, lời cầu xin và phép song hành—được giữ nguyên.
  reviewer_model: gpt-5.6-terra
