id: NUM.10.33
reference: Numbers 10:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: vi
  text: Vậy, họ rời núi của Yahweh và đi một chặng đường ba ngày[a]. Hòm Giao Ước của Yahweh đi trước họ một chặng đường ba ngày để tìm[b] cho họ một nơi nghỉ chân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch cả hai chỗ: “một hành trình ba ngày”.'
    reason: lexical_alternative
  - marker: b
    text: “Tìm” cũng có thể dịch là “thăm dò” hoặc “tìm kiếm”; “nơi nghỉ chân” cũng có thể dịch là “chỗ nghỉ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: họ rời... đi
  rationale: Động từ נסע trong bối cảnh trại quân lên đường mang nghĩa nhổ trại và khởi hành; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được chuyển động của câu chuyện.
- source_word: מֵהַר יְהוָה
  choice: rời núi của Yahweh
  rationale: הַר là “núi”; giới từ מִן chỉ điểm xuất phát. Giữ danh riêng Yahweh để thể hiện trực tiếp Danh Đức Chúa Trời trong nguyên văn.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: một chặng đường ba ngày
  rationale: Cụm này chỉ quãng đường thường đi trong ba ngày, chứ không chỉ đơn thuần nói thời lượng; “chặng đường ba ngày” vừa sát nghĩa vừa tự nhiên.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: Hòm giao ước của Yahweh
  rationale: 'Giữ quan hệ sở hữu trong chuỗi cấu tạo Hebrew: chiếc hòm gắn với giao ước của Yahweh.'
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: đi trước họ
  rationale: Phân từ נֹסֵעַ mô tả hành động đồng thời, đang diễn tiến; trong tiếng Việt, “đi trước họ” diễn đạt tự nhiên mà không cần đánh dấu thể tiến hành.
- source_word: לָתוּר
  choice: tìm
  rationale: תור có nghĩa thăm dò, tìm kiếm hoặc khảo sát. Ở đây mục tiêu là nơi dừng chân, nên “tìm” phù hợp hơn sắc thái quân sự của “do thám”.
- source_word: מְנוּחָה
  choice: một nơi nghỉ chân
  rationale: Trong bối cảnh hành trình, danh từ này chỉ cụ thể một nơi để đoàn dân dừng lại nghỉ, không chỉ trạng thái nghỉ ngơi trừu tượng.
theological_decisions:
- issue: Cách chuyển dịch Danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Vai trò dẫn đường của Hòm giao ước
  choice: Giữ nguyên lời kể rằng Hòm đi trước để tìm nơi nghỉ chân
  alternative: Diễn giải rằng chính Yahweh trực tiếp tìm nơi nghỉ
  rationale: Bản dịch không làm phẳng sự nhân cách hóa hoặc vai trò biểu tượng của Hòm trong cú pháp Hebrew, cũng không thêm một lời giải thích thần học ngoài câu.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Hòm giao ước” theo lối gọi quen thuộc, viết hoa “Hòm” vì đây là một vật thánh xác định. Cấu trúc được chia thành hai câu để dễ đọc mà vẫn giữ quan hệ trình tự và mục đích của nguyên văn.
