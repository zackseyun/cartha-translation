    rationale: Hình thức וְנוֹעֲדוּ diễn tả điều sẽ xảy ra khi tín hiệu được thổi, không trực tiếp dùng mệnh lệnh. “Phải” thêm sắc thái bắt buộc; “sẽ” giữ quan hệ kết quả của chỉ dẫn.
  - severity: medium
    issue: “tập hợp bên ông”
    rationale: אֵלֶיךָ nghĩa cơ bản là “đến với ông/anh.” “Bên ông” vừa kém tự nhiên vừa làm mờ hướng đến người được nói tới.
