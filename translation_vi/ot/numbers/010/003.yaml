  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: vi
  text: Khi người ta thổi cả hai kèn[a], toàn thể hội chúng sẽ tập hợp đến với ông tại lối vào Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa: “Và họ sẽ thổi hai kèn, và toàn thể hội chúng sẽ tập hợp đến với ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָקְעוּ
  choice: Khi người ta thổi
  rationale: 'Trong chuỗi chỉ dẫn này, dạng động từ mang ý nghĩa thời gian/điều kiện: khi hiệu kèn được thổi. Cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ quan hệ giữa tín hiệu và việc tập hợp.'
- source_word: בָּהֵן
  choice: cả hai kèn
  rationale: Đại từ giống cái số nhiều chỉ về hai chiếc kèn bạc ở câu trước. Nêu lại “cả hai kèn” giúp tiếng Việt rõ nghĩa và phân biệt với trường hợp chỉ thổi một kèn ở câu kế tiếp.
- source_word: וְנוֹעֲדוּ
  choice: phải tập hợp
  rationale: Động từ Niphal của יעד tại đây nói đến việc cộng đồng tụ họp theo hiệu triệu. “Tập hợp” diễn đạt tự nhiên sắc thái ấy; “phải” thể hiện hiệu lực của chỉ thị trong văn mạch.
- source_word: אֵלֶיךָ
  choice: bên ông
  rationale: Nghĩa sát là “đến với ông”. Trong tiếng Việt, “tập hợp bên ông” diễn tả việc hội chúng đến nơi Môi-se hiện diện mà không đổi thành sắc thái tôn kính không có sẵn trong từ gốc.
- source_word: כָּל הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ toàn cộng đồng Israel được triệu tập. “Hội chúng” giữ sắc thái cộng đồng, còn “toàn thể” chuyển tải כָּל.
- source_word: פֶּתַח
  choice: lối vào
  rationale: פֶּתַח là chỗ đi vào hoặc cửa vào; “lối vào” tự nhiên đối với một chiếc lều.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cụm từ chỉ chiếc lều nơi diễn ra cuộc gặp đã được định; “Lều Hội Kiến” là cách gọi trang trọng, gọn và quen thuộc trong văn mạch Ngũ Kinh.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Người ta” giữ chủ thể số nhiều không xác định trong câu này; ngữ cảnh trước cho biết đó là những người được giao thổi kèn. Viết hoa “Lều Hội Kiến” vì đây là tên gọi quy ước của một địa điểm thờ phượng cụ thể.
