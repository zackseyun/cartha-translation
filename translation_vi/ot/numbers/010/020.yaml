  text: וְ/עַל צְבָ֖א מַטֵּ֣ה בְנֵי גָ֑ד אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: vi
  text: Và người chỉ huy đơn vị của bộ tộc Gát là Ê-li-a-sáp, con trai Đê-u-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đơn vị” cũng có thể dịch là “đạo quân”, “đội ngũ” hoặc “đoàn”. Từ Hê-bơ-rơ צָבָא thường mang sắc thái quân sự, nhưng ở đây chỉ nhóm người của bộ tộc được tổ chức để di chuyển theo đội hình.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Đứng đầu
  rationale: Trong công thức liệt kê người lãnh đạo, עַל diễn tả quyền chỉ huy đối với đơn vị bộ tộc. Tiếng Việt dùng “đứng đầu” tự nhiên hơn cách dịch sát từng chữ “và trên”, còn quan hệ nối tiếp với các câu trước được thể hiện qua cấu trúc song song của đoạn.
- source_word: צְבָא
  choice: đạo quân
  rationale: Từ này thường mang sắc thái quân sự, nhưng tại đây chỉ đơn vị bộ tộc được tổ chức để di chuyển theo đội hình. “Đạo quân” giữ được sắc thái ấy mà vẫn phù hợp với đoàn người hành quân có tổ chức.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong ngữ cảnh này, מַטֶּה chỉ đơn vị bộ tộc, không phải vật thể “gậy”. “Bộ tộc” là cách nói hiện đại, rõ nghĩa trong tiếng Việt.
- source_word: בְנֵי גָד
  choice: con cháu Gát
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Gát”, nhưng trong cách gọi một cộng đồng hậu duệ, “con cháu Gát” vừa giữ quan hệ dòng dõi vừa tự nhiên hơn trong tiếng Việt.
- source_word: אֶלְיָסָף
  choice: Ê-li-a-sáp
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang dạng dễ đọc và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: בֶּן דְּעוּאֵל
  choice: con trai Đê-u-ên
  rationale: Giữ trực tiếp công thức phụ hệ của nguyên văn, đồng thời diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. Câu bổ sung “là” vì nguyên văn Hê-bơ-rơ dùng cấu trúc liệt kê không có động từ; cách bổ sung này không làm thay đổi ý nghĩa. Tên riêng được phiên âm có dấu và gạch nối để người đọc phổ thông dễ đọc.
