  - severity: low
    issue: “Đạo quân” có thể gợi một lực lượng chiến đấu cụ thể hơn mức cần thiết.
    rationale: צְבָא tại đây chỉ đội hình/lực lượng bộ tộc được tổ chức để hành quân; “đoàn quân” giữ sắc thái tổ chức mà tự nhiên hơn trong tiếng Việt hiện đại.
  revised_text: Và người đứng đầu đoàn quân của chi tộc con cháu Bên-gia-min là A-bi-đan, con trai Ghi-đê-ô-ni.[a]
