  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: vi
  text: Và người đứng đầu đoàn quân của chi tộc con cháu Bên-gia-min là A-bi-đan, con trai Ghi-đê-ô-ni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “đội ngũ” hay “đơn vị”; từ Hê-bơ-rơ chỉ một lực lượng được tổ chức theo kiểu quân sự.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Chỉ huy
  rationale: Trong chuỗi liệt kê đội hình hành quân, giới từ עַל chỉ vai trò đứng đầu/chỉ huy; tiếng Việt diễn đạt tự nhiên bằng cấu trúc “Chỉ huy ... là”, còn liên từ וְ được thể hiện qua tính liên tục của danh sách thay vì dịch máy móc là “và”.
- source_word: צְבָא
  choice: đạo quân
  rationale: Từ này chỉ một lực lượng được tổ chức theo kiểu quân sự trong đội hình hành quân. “Đạo quân” giữ sắc thái quân sự mà không nhất thiết ngụ ý đang giao chiến.
- source_word: מַטֶּה
  choice: bộ tộc
  rationale: Ở đây từ này chỉ đơn vị bộ tộc trong cơ cấu hành chính-quân sự, không phải nghĩa đen “cây gậy”.
- source_word: בְּנֵי בִנְיָמִן
  choice: con cháu Bên-gia-min
  rationale: “Con cháu” truyền đạt thành ngữ huyết thống tập thể בְּנֵי một cách tự nhiên trong tiếng Việt, đồng thời giữ sắc thái gia phả của nguyên văn.
- source_word: אֲבִידָן
  choice: A-bi-đan
  rationale: Phiên âm tên riêng theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: בֶּן גִּדְעוֹנִי
  choice: con trai Ghi-đê-ô-ni
  rationale: Cách diễn đạt tự nhiên của quan hệ phụ hệ dùng để nhận diện nhân vật.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc “Chỉ huy ... là” để tiếp nối tự nhiên danh sách các thủ lĩnh trong ngữ cảnh; giữ sắc thái tổ chức quân sự của צְבָא và công thức huyết thống của tên bộ tộc.
