revisions:
- from: Chỉ huy đạo quân của bộ tộc con cháu Bên-gia-min là A-bi-đan, con trai Ghi-đê-ô-ni.[a]
  to: Và người đứng đầu đoàn quân của chi tộc con cháu Bên-gia-min là A-bi-đan, con trai Ghi-đê-ô-ni.[a]
  rationale: Bản sửa phục hồi liên từ nối tiếp của nguyên ngữ, diễn đạt rõ chức năng “đứng đầu” của עַל, và dùng “đoàn quân” để phản ánh צְבָא trong bối cảnh đội hình hành quân. Các thuật ngữ chi tộc, công thức huyết thống và tên riêng được giữ nhất quán; chú thích vẫn được neo đúng tại từ cần làm rõ.
