  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải. “Anh em” biểu đạt ngôi thứ hai số nhiều tự nhiên hơn lối cổ “các ngươi”; “các trại đóng ở phía đông” giữ cấu trúc và ý nghĩa vị trí của nguyên văn.
