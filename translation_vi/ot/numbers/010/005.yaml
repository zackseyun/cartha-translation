  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: vi
  text: Khi anh em thổi một hồi kèn báo động[a], các trại đóng ở phía đông sẽ lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hồi kèn báo hiệu”. Từ Hê-bơ-rơ ở đây chỉ kiểu tiếng kèn đặc biệt dùng làm hiệu lệnh để các trại di chuyển.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Khi anh em thổi
  rationale: Động từ תקע ở ngôi thứ hai số nhiều, trong ngữ cảnh kèn, có nghĩa là thổi kèn. Mệnh đề được diễn đạt tự nhiên như một chỉ dẫn thời gian dẫn đến hành động tiếp theo.
- source_word: תְּרוּעָה
  choice: hồi kèn báo động
  rationale: תְּרוּעָה ở đây chỉ một kiểu hiệu lệnh bằng kèn riêng biệt, dùng để báo cho các trại bắt đầu di chuyển; “hồi kèn báo động” giữ được sắc thái tín hiệu khẩn và phân biệt với tiếng kèn thông thường.
- source_word: וְנָסְעוּ
  choice: phải lên đường
  rationale: נסע thường chỉ việc nhổ trại và bắt đầu hành trình. “Phải lên đường” tự nhiên trong tiếng Việt và phù hợp với tính chất chỉ thị của câu.
- source_word: הַמַּחֲנוֹת
  choice: các trại
  rationale: Danh từ số nhiều chỉ các đơn vị trại của những chi tộc trong cách bố trí quanh Đền Tạm.
- source_word: הַחֹנִים
  choice: đóng
  rationale: Phân từ này bổ nghĩa cho “các trại”, mô tả vị trí họ đang đóng trại; tiếng Việt tự nhiên dùng cụm “các trại đóng ở…”.
- source_word: קֵדְמָה
  choice: ở phía đông
  rationale: Trong ngữ cảnh bố trí trại, từ này mang nghĩa vị trí về phía đông, không phải hướng chuyển động về phía đông.
