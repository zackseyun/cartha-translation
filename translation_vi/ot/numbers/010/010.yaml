revisions:
- from: Trong ngày vui mừng của anh em, vào các kỳ đã định và vào đầu mỗi tháng[a], anh em phải thổi kèn trên các lễ vật thiêu và các sinh tế bình an[b] của mình. Chúng sẽ là dấu tưởng niệm cho anh em trước mặt Đức Chúa Trời của anh em. Ta là Yahweh, Đức Chúa Trời của anh em.
  to: Vào ngày vui mừng của anh em, trong các kỳ đã định và vào đầu mỗi tháng[a], anh em phải thổi kèn khi dâng các của lễ thiêu và các sinh tế bình an[b] của mình. Chúng sẽ là dấu tưởng niệm cho anh em trước mặt Đức Chúa Trời của anh em. Ta là Yahweh, Đức Chúa Trời của anh em.
  rationale: Bản sửa chỉ làm trôi chảy cách diễn đạt thời điểm và quan hệ giữa việc thổi kèn với các của lễ. Các neo chú thích vẫn đặt đúng sau “tháng” và “sinh tế bình an”; chú thích a bảo tồn cách hiểu “trăng mới”, còn chú thích b ghi nhận lựa chọn thuật ngữ cho שְׁלָמִים.
  reviewer_model: gpt-5.6-terra
