source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: vi
  text: Vào ngày vui mừng của anh em, trong các kỳ đã định và vào đầu mỗi tháng[a], anh em phải thổi kèn khi dâng các của lễ thiêu và các sinh tế bình an[b] của mình. Chúng sẽ là dấu tưởng niệm cho anh em trước mặt Đức Chúa Trời của anh em. Ta là Yahweh, Đức Chúa Trời của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào những ngày trăng mới của anh em.” Nguyên văn là “vào đầu các tháng của anh em.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các sinh tế thông công.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: niềm vui mừng của anh em
  rationale: Danh từ chỉ niềm vui hay sự vui mừng; cách dịch này tự nhiên và vẫn giữ sắc thái của nguyên ngữ.
- source_word: מוֹעֲדֵיכֶם
  choice: các kỳ đã định
  rationale: Giữ được nghĩa rộng của מוֹעֵד là thời điểm đã được ấn định, đồng thời phù hợp với bối cảnh các dịp lễ nghi.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: đầu mỗi tháng
  rationale: Phản ánh sát thành ngữ Hê-bơ-rơ nghĩa đen là “đầu các tháng của anh em”; trong ngữ cảnh lịch lễ, cụm này cũng có thể chỉ ngày trăng mới.
- source_word: וּתְקַעְתֶּם בַּחֲצֹצְרֹת
  choice: anh em phải thổi kèn
  rationale: Động từ có nghĩa thổi hoặc làm vang kèn; “thổi kèn” là cách nói trực tiếp, tự nhiên trong tiếng Việt.
- source_word: עַל עֹלֹתֵיכֶם
  choice: trên các lễ vật thiêu của mình
  rationale: “Trên” giữ sắc thái cơ bản của giới từ עַל và diễn tả tiếng kèn vang lên trong khi dâng lễ vật.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: các sinh tế bình an của mình
  rationale: “Sinh tế bình an” giữ thuật ngữ tế lễ và mối liên hệ từ nguyên với sự bình an, toàn vẹn; “sinh tế thông công” là một cách dịch khả dĩ khác.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: chúng sẽ là dấu tưởng niệm cho anh em
  rationale: Giữ đại từ số nhiều và sắc thái nghi lễ của זִכָּרוֹן, đồng thời không xác quyết quá mức việc dấu ấy chủ yếu nhắc con người hay khiến họ được nhớ đến trước Đức Chúa Trời.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: trước mặt Đức Chúa Trời của anh em
  rationale: Diễn đạt trực tiếp nghĩa “trước mặt, trong sự hiện diện của” Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên ngữ thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn chức năng danh riêng mà không thay thế bằng tước hiệu.
- issue: Ý nghĩa của שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công
  rationale: Thuật ngữ có thể nhấn mạnh sự bình an, toàn vẹn hoặc chiều kích thông công của bữa ăn tế lễ. Bản dịch chính giữ trường nghĩa bình an, còn cách dịch khác được ghi chú.
- issue: Chủ thể và chức năng của וְהָיוּ ... לְזִכָּרוֹן
  choice: Chúng sẽ là dấu tưởng niệm cho anh em trước mặt Đức Chúa Trời
  alternative: Tiếng kèn sẽ khiến Đức Chúa Trời nhớ đến anh em
  rationale: Cách dịch chính giữ cấu trúc và độ mở của nguyên văn, không giải thích dứt khoát cơ chế thần học của việc “tưởng niệm” trước mặt Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều nói với cộng đồng Israel; giữ “Yahweh” như danh riêng. Thuật ngữ tế lễ được dịch nhất quán nhưng tránh lối diễn đạt quá cổ.
