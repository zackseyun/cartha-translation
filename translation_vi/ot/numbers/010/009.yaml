  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: vi
  text: Khi anh em ra trận trong đất mình để chống lại kẻ thù đang áp bức anh em[a], anh em phải thổi kèn báo động. Bấy giờ, anh em sẽ được nhớ đến trước mặt Yahweh, Đức Chúa Trời của anh em[b], và sẽ được cứu khỏi quân thù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu anh em ra trận trong đất mình.” Liên từ Hê-bơ-rơ có thể mở đầu một mệnh đề chỉ tình huống hoặc điều kiện.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “anh em sẽ được nhắc nhớ trước mặt Yahweh, Đức Chúa Trời của anh em”; hoặc diễn ý: “Yahweh, Đức Chúa Trời của anh em, sẽ nhớ đến anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Khi
  rationale: Trong văn cảnh luật lệ, cụm này mở đầu một tình huống có thể xảy ra trong tương lai. “Khi” tự nhiên trong tiếng Việt; khả năng hiểu là điều kiện được ghi ở chú thích [a].
- source_word: תָבֹאוּ מִלְחָמָה
  choice: anh em ra trận
  rationale: Thành ngữ Hê-bơ-rơ chỉ việc tham chiến. “Ra trận” vừa tự nhiên vừa phù hợp bối cảnh quân sự.
- source_word: בְּאַרְצְכֶם
  choice: trong đất mình
  rationale: Giữ sắc thái lãnh thổ và giao ước của אֶרֶץ, thay vì dùng từ mang tính chính trị hiện đại như “quốc gia”.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: để chống lại kẻ thù đang áp bức anh em
  rationale: “Kẻ thù” chuyển tải danh từ צַר, còn “đang áp bức” giữ lực của phân từ צֹרֵר và không giản lược hai yếu tố thành một.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: anh em phải thổi kèn báo động
  rationale: Động từ Hiphil của רוע trong ngữ cảnh kèn chỉ việc phát tín hiệu báo động; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: anh em sẽ được nhớ đến trước mặt Yahweh, Đức Chúa Trời của anh em
  rationale: Giữ dạng bị động của động từ Hê-bơ-rơ và cụm “trước mặt”, không diễn giải thẳng thành Yahweh là chủ thể của động từ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước YHWH thay vì thay bằng một tước hiệu.
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: và sẽ được cứu khỏi quân thù
  rationale: Giữ dạng bị động của ישׁע và ý giải cứu trong bối cảnh chiến trận. “Quân thù” tránh lặp sát từ “kẻ thù” mà vẫn truyền đạt אֹיֵב chính xác.
theological_decisions:
- issue: Cách dịch danh YHWH
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng và không thay nó bằng tước hiệu.
- issue: Lực của וֲנִזְכַּרְתֶּם
  choice: anh em sẽ được nhớ đến trước mặt Yahweh
  alternative: Yahweh sẽ nhớ đến anh em
  rationale: Cách dịch chính giữ dạng bị động của nguyên văn và sự căng thẳng thần học vốn có; chú thích [b] nêu cách diễn đạt chủ động, dễ hiểu hơn nhưng có tính diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng Israel; giữ danh Yahweh và dạng bị động của nguyên văn. Mọi dấu chú thích trong bản văn đều có chú thích tương ứng.
