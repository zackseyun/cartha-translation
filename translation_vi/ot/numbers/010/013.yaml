  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: vi
  text: Vậy, lần đầu tiên họ lên đường theo lệnh của Yahweh, qua Môi-se[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “bởi tay Môi-se,” một thành ngữ chỉ sự trung gian hoặc đại diện của Môi-se trong việc truyền đạt hay thực hiện chỉ dẫn của Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: họ lên đường
  rationale: Trong trình thuật hành trình, נסע thường chỉ việc nhổ trại và bắt đầu di chuyển; “lên đường” tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái khởi hành.
- source_word: בָּרִאשֹׁנָה
  choice: lần đầu tiên
  rationale: Dạng trạng từ này có nghĩa “lúc đầu” hoặc “lần đầu tiên”; tại đây nó nói đến lần khởi hành đầu tiên của Israel khỏi Si-nai theo đội ngũ.
- source_word: עַל פִּי
  choice: theo lệnh của
  rationale: Thành ngữ theo nghĩa đen là “theo miệng của”, nhưng trong ngữ cảnh này diễn tả việc làm theo mệnh lệnh hoặc chỉ thị.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: בְּיַד מֹשֶׁה
  choice: qua tay Môi-se
  rationale: Giữ hình ảnh cụ thể của nguyên văn, đồng thời diễn đạt vai trò trung gian hoặc tác nhân của Môi-se; chú thích làm rõ thành ngữ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn danh ấy mà không thay bằng tước hiệu.
- issue: Vai trò của Môi-se trong cụm בְּיַד מֹשֶׁה
  choice: qua tay Môi-se
  alternative: qua Môi-se
  rationale: Cách dịch giữ nguyên hình ảnh “tay” và không xác định quá mức bản chất vai trò trung gian ngoài điều thành ngữ cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vậy” nối câu với diễn tiến trước đó; “lên đường” phù hợp ngữ cảnh đoàn dân nhổ trại. Giữ “qua tay Môi-se” trong chính văn để bảo tồn hình ảnh Hê-bơ-rơ và dùng chú thích để giải nghĩa.
