source:
  edition: WLC
  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: vi
  text: Và ban ngày, đám mây của Yahweh ở trên họ khi họ rời trại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đám mây của Yahweh ở trên họ ban ngày khi họ lên đường từ trại.”'
    reason: Giữ cách diễn đạt sát cấu trúc Hê-bơ-rơ hơn và nét nghĩa “lên đường” của נסע, trong khi chính văn dùng tiếng Việt gọn, tự nhiên.
lexical_decisions:
- source_word: וַעֲנַן
  choice: Và ... đám mây
  rationale: עָנָן nghĩa là “đám mây”; liên từ וַ־ được dịch là “Và” để giữ mối nối trần thuật với câu trước. Cụm sở hữu với danh thần khiến cách nói xác định “đám mây của Yahweh” là tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự thông dụng “Yahweh”, thay vì thay bằng một tước hiệu.
- source_word: עֲלֵיהֶם
  choice: ở trên họ
  rationale: Giới từ עַל cùng hậu tố chỉ vị trí ở trên hoặc bên trên họ. “Ở trên họ” giữ được nét nghĩa không gian và không buộc câu theo một cách giải thích thần học cụ thể.
- source_word: יוֹמָם
  choice: ban ngày
  rationale: Trạng từ יוֹמָם nghĩa là “ban ngày”; đặt ở đầu câu tạo nhịp tiếng Việt tự nhiên mà vẫn giữ phạm vi thời gian.
- source_word: בְּנָסְעָם
  choice: khi họ rời trại
  rationale: Dạng nguyên mẫu của נסע với בְּ mang nghĩa thời gian, chỉ lúc họ nhổ trại hoặc lên đường. Kết hợp với cụm kế tiếp, “khi họ rời trại” diễn đạt tự nhiên và chính xác.
- source_word: מִן הַמַּחֲנֶה
  choice: rời trại
  rationale: מִן diễn tả sự đi ra khỏi, còn מַחֲנֶה là trại. Tiếng Việt dùng động từ “rời” tự nhiên hơn cấu trúc sát chữ “đi từ trại”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo toàn tính chất danh riêng, không thay bằng tước hiệu hay áp đặt truyền thống hệ phái.
- issue: Ý nghĩa của đám mây “ở trên” dân chúng
  choice: ở trên họ
  alternative: che phủ họ / bảo vệ họ
  rationale: Nguyên văn nêu quan hệ vị trí bằng עַל nhưng không nói thẳng “che phủ” hay “bảo vệ”. Bản dịch giữ sự căng mở về chức năng của đám mây, không diễn giải thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Rời trại” là lối nói tự nhiên cho việc nhổ trại lên đường; “ở trên họ” giữ nguyên tính chất không gian và sự mơ hồ chính đáng của nguyên văn.
