  text: וּ/בְ/נֻחֹ֖/ה יֹאמַ֑ר שׁוּבָ֣/ה יְהוָ֔ה רִֽבְב֖וֹת אַלְפֵ֥י יִשְׂרָאֵֽל׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: vi
  text: 'Mỗi khi Hòm Bia dừng lại, Môi-se nói:


    “Lạy Yahweh[a], xin trở về với muôn vàn ngàn người Y-sơ-ra-ên.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng danh riêng יהוה (YHWH), được phiên âm ở đây là “Yahweh”.
    reason: divine_name
  - marker: b
    text: Nguyên văn ghép hai từ chỉ số lượng lớn, nghĩa sát là “các vạn của các ngàn Y-sơ-ra-ên”, để nhấn mạnh số dân rất đông; không nhất thiết là một con số chính xác.
    reason: lexical_clarification
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: Mỗi khi Hòm Bia dừng lại
  rationale: Cụm giới từ với động từ nguyên thể và hậu tố giống cái tạo mệnh đề thời gian, chỉ Hòm Bia trong văn cảnh. “Mỗi khi” diễn đạt tính lặp lại; nêu rõ “Hòm Bia” giúp tiếng Việt tự nhiên hơn đại từ vô chủ thể.
- source_word: יֹאמַר
  choice: Môi-se nói
  rationale: Dạng chưa hoàn thành trong mạch kể diễn tả lời Môi-se thường nói mỗi khi Hòm Bia dừng lại. Tiếng Việt thể hiện sắc thái tập quán nhờ “mỗi khi”, nên không cần thêm một trợ từ vào động từ.
- source_word: שׁוּבָה
  choice: xin trở về
  rationale: Mệnh lệnh của שׁוב kèm ה tăng cường là lời khẩn cầu trực tiếp. “Xin trở về” vừa tự nhiên vừa không giải thích quá mức hướng hay cách Yahweh hiện diện.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: vô vàn ngàn người của Y-sơ-ra-ên
  rationale: Cách diễn đạt giữ hai lớp từ chỉ số lượng lớn và sức nhấn mạnh của nguyên văn, đồng thời vẫn có thể hiểu tự nhiên là dân Y-sơ-ra-ên đông vô kể.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. Phiên âm “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng tước hiệu.
- issue: Quan hệ cú pháp giữa שׁוּבָה và רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: xin trở về cùng vô vàn ngàn người của Y-sơ-ra-ên
  alternative: xin trở về với vô vàn ngàn người của Y-sơ-ra-ên; xin trở lại giữa vô vàn ngàn người của Y-sơ-ra-ên
  rationale: Tiếng Hê-bơ-rơ không có giới từ được viết rõ trước cụm chỉ dân Y-sơ-ra-ên. “Cùng” cho thấy hướng quy chiếu tự nhiên nhưng tránh xác định quá chặt là “với” hay “ở giữa”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Lời khẩn cầu giữ nhịp thơ ngắn. “Hòm Bia” và “Môi-se” được nêu rõ từ văn cảnh để tránh đại từ mơ hồ trong tiếng Việt; cách nói “vô vàn ngàn người” cố ý giữ phần nào lối chồng số lượng giàu sức nhấn mạnh của câu Hê-bơ-rơ.
