  to: 'Mỗi khi Hòm Bia dừng lại, Môi-se nói:


    “Lạy Yahweh[a], xin trở về với muôn vàn ngàn người Y-sơ-ra-ên.”[b]'
  rationale: 'Bản sửa duy trì mọi yếu tố trọng yếu của nguyên văn và cách dịch tối ưu-tương-đương: Hòm Bia được nêu theo văn cảnh, “mỗi khi” chuyển tải tính lặp lại, và Yahweh được giữ là tên riêng. Chỉ điều chỉnh giới từ để tiếng Việt biểu đạt lời khẩn cầu rõ hơn, đồng thời thay cụm số lượng bằng cách nói tự nhiên hơn và làm chú thích thận trọng hơn về giá trị số học.'
