  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: vi
  text: Người chỉ huy đạo quân của chi tộc Náp-ta-li là A-hi-ra, con trai của Ê-nan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đạo quân” cũng có thể dịch là “đội quân”, “đoàn quân” hoặc “đơn vị quân”. Từ Hê-bơ-rơ צְבָא chỉ lực lượng bộ tộc có tổ chức trong cách bố trí đóng trại và hành quân.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Người chỉ huy ... là
  rationale: Trong công thức liệt kê các thủ lĩnh, עַל diễn tả người được đặt trên một đơn vị. Tiếng Việt tự nhiên dùng “người chỉ huy ... là”; liên từ וְ không nhất thiết phải dịch riêng trong câu độc lập.
- source_word: צְבָא
  choice: đạo quân
  rationale: Trong bối cảnh sắp xếp trại quân và thứ tự hành quân, từ này chỉ một lực lượng bộ tộc có tổ chức. “Đạo quân” giữ sắc thái quân sự nhưng không nhất thiết hàm ý một quân đội quốc gia thường trực.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Ở đây từ này mang nghĩa đơn vị bộ tộc, không phải nghĩa đen là “cây gậy”.
- source_word: בְּנֵי נַפְתָּלִי
  choice: con cháu Nép-ta-li
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Nép-ta-li”, nhưng trong công thức bộ tộc, nó chỉ những người thuộc dòng dõi Nép-ta-li; “con cháu” truyền đạt nghĩa tập thể và quan hệ huyết thống tự nhiên trong tiếng Việt.
- source_word: אֲחִירַע
  choice: A-hi-ra
  rationale: Phiên âm tên riêng sang tiếng Việt, giữ các âm tiết của tên Hê-bơ-rơ.
- source_word: בֶּן עֵינָן
  choice: con trai Ê-nan
  rationale: Đây là cấu trúc phụ hệ thông thường trong tiếng Hê-bơ-rơ; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Trật tự câu được điều chỉnh theo tiếng Việt để diễn đạt tự nhiên công thức chỉ huy lặp lại trong phân đoạn; tên riêng được phiên âm theo lối đọc tiếng Việt.
