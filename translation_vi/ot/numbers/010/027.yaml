revisions:
- from: Người chỉ huy đạo quân của bộ tộc con cháu Nép-ta-li là A-hi-ra, con trai Ê-nan.[a]
  to: Người chỉ huy đạo quân của chi tộc Náp-ta-li là A-hi-ra, con trai của Ê-nan.[a]
  rationale: Sửa cách diễn đạt danh xưng bộ tộc cho tự nhiên và chính xác trong tiếng Việt, đồng thời chuẩn hóa phiên âm Náp-ta-li. Cấu trúc câu “Người chỉ huy ... là” tiếp tục phản ánh thành ngữ lãnh đạo với עַל mà không thêm ý nghĩa ngoài văn bản.
