revisions:
- from: Rồi cờ hiệu của trại con cháu Đan lên đường, làm đội hậu quân cho tất cả các trại theo từng đạo quân của họ; chỉ huy đạo quân ấy là A-hi-ê-xe, con trai A-mi-sa-đai.
  to: Rồi cờ hiệu của trại của con cháu Đan lên đường, đi đoạn hậu cho tất cả các trại theo các đơn vị của họ; người chỉ huy đơn vị ấy là A-hi-ê-xe, con trai A-mi-sa-đai.
  rationale: Bản sửa làm rõ các quan hệ ngữ pháp trong tiếng Việt, giữ ý nghĩa đội hình hành quân của nguyên ngữ, và dùng “đơn vị” nhất quán cho צבא/צבאות trong ngữ cảnh tổ chức bộ tộc. Không cần chú thích, vì câu dịch đã truyền đạt đủ các sắc thái cần thiết mà không thêm diễn giải.
