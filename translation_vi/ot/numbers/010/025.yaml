base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: vi
  text: Rồi cờ hiệu của trại của con cháu Đan lên đường, đi đoạn hậu cho tất cả các trại theo các đơn vị của họ; người chỉ huy đơn vị ấy là A-hi-ê-xe, con trai A-mi-sa-đai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָסַע
  choice: Rồi ... lên đường
  rationale: Động từ với waw liên tiếp đẩy mạch tường thuật tiến tới; “Rồi ... lên đường” diễn đạt tự nhiên trình tự đoàn trại bắt đầu di chuyển.
- source_word: דֶּגֶל
  choice: cờ hiệu
  rationale: Từ này chỉ cờ nhận diện của đơn vị bộ tộc khi đóng trại và hành quân; “cờ hiệu” rõ nghĩa, hiện đại hơn “đại kỳ” hay “quân kỳ”.
- source_word: מַחֲנֵה בְנֵי דָן
  choice: trại con cháu Đan
  rationale: Giữ hình ảnh “trại” và công thức huyết tộc בני, đồng thời “con cháu Đan” tự nhiên trong tiếng Việt khi nói về toàn bộ bộ tộc.
- source_word: מְאַסֵּף לְכָל הַמַּחֲנֹת
  choice: làm đội hậu quân cho tất cả các trại
  rationale: Trong đội hình hành quân, phân từ này chỉ đơn vị đi cuối, vừa bảo vệ phía sau vừa thu nhận những người tụt lại; “làm đội hậu quân” truyền đạt rõ chức năng theo ngữ cảnh.
- source_word: לְצִבְאֹתָם
  choice: theo từng đạo quân của họ
  rationale: צבאות ở đây chỉ các đơn vị bộ tộc được tổ chức để hành quân. “Theo từng đạo quân” bảo lưu sắc thái tổ chức-quân sự mà không giới hạn ý nghĩa vào chiến đấu.
- source_word: וְעַל צְבָאוֹ
  choice: chỉ huy đạo quân ấy là
  rationale: Cụm על + צבא giới thiệu người đứng trên đơn vị ấy. Cách diễn đạt này tự nhiên trong tiếng Việt và tránh cấu trúc cứng “ở trên đạo quân ấy là”.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: A-hi-ê-xe, con trai A-mi-sa-đai
  rationale: Phiên âm các tên riêng sang dạng dễ đọc trong tiếng Việt và giữ nguyên công thức phụ hệ “con trai”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc hành quân theo bộ tộc, dùng “đội hậu quân” cho chức năng của Đan và “đạo quân” cho צבא để duy trì sắc thái một đơn vị có tổ chức. Không cần chú thích vì các lựa chọn từ vựng chính đều có thể diễn đạt rõ ngay trong câu.
