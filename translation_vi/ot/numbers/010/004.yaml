  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: vi
  text: Nhưng nếu họ chỉ thổi một chiếc kèn[a], thì các thủ lĩnh, là những người đứng đầu các đơn vị nghìn người của Y-sơ-ra-ên, sẽ đến tập hợp với con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “với một”; trong ngữ cảnh, nghĩa là chỉ thổi một trong hai chiếc kèn.'
    reason: ellipsis_clarification
lexical_decisions:
- source_word: וְ/אִם
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện có tính tương phản với chỉ thị thổi cả hai kèn ở câu trước.
- source_word: בְּ/אַחַת
  choice: chỉ thổi một chiếc
  rationale: Cụm Hê-bơ-rơ lược danh từ; trong ngữ cảnh, đối tượng là một trong hai chiếc kèn. Thêm “chiếc” làm câu tiếng Việt tự nhiên mà vẫn giữ ý đối lập.
- source_word: יִתְקָעוּ
  choice: họ ... thổi
  rationale: Động từ תקע trong ngữ cảnh phát tín hiệu bằng kèn có nghĩa là thổi kèn.
- source_word: וְ/נוֹעֲדוּ
  choice: phải tập hợp lại
  rationale: Thể Niphal của יעד ở đây chỉ việc hội họp theo hiệu triệu; “phải” thể hiện giá trị chỉ thị của dạng động từ trong ngữ cảnh luật lệ.
- source_word: אֵלֶי/ךָ
  choice: lại chỗ con
  rationale: Diễn đạt hướng chuyển động đến người được Đức Chúa Trời phán bảo, tức Môi-se; “chỗ con” tự nhiên trong lời phán trực tiếp.
- source_word: הַ/נְּשִׂיאִים
  choice: các thủ lĩnh
  rationale: נשיאים chỉ những người lãnh đạo cộng đồng hoặc bộ tộc; “thủ lĩnh” trang trọng, rõ vai trò và không gợi nghĩa hoàng gia như “vương tử”.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: những người đứng đầu các đơn vị nghìn người của Y-sơ-ra-ên
  rationale: Giữ thuật ngữ אלפים theo nghĩa đen là các nhóm nghìn người, đồng thời thêm “đơn vị” để chuỗi sở hữu Hê-bơ-rơ dễ hiểu trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cách xưng hô “con” trong lời Đức Chúa Trời phán với Môi-se. Thành ngữ hành chính-quân sự “các đơn vị nghìn người” được giữ trong chính văn thay vì diễn giải thành “các thị tộc”.
