  - severity: low
    issue: Hai lần dịch צָבָא/צְבָאוֹ bằng “đội ngũ” và “đội quân” thiếu nhất quán.
    rationale: Cùng một từ gốc được dùng số nhiều rồi số ít; dùng “đơn vị”/“các đơn vị” giúp người đọc nhận ra sự liên kết mà vẫn tự nhiên trong tiếng Việt.
