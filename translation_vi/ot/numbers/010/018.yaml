  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: vi
  text: Sau đó, cờ hiệu[a] của trại Ru-bên lên đường theo các đơn vị của họ[b]; người chỉ huy đơn vị ấy là Ê-li-xua, con trai Sê-đêu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đại kỳ”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “theo các đội ngũ của họ” hoặc “theo các đạo quân của họ”; từ Hê-bơ-rơ chỉ các đơn vị được tổ chức, có sắc thái quân sự.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Sau đó ... lên đường
  rationale: Động từ נסע trong trình thuật hành quân chỉ việc rời chỗ và bắt đầu di chuyển; liên từ וְ tiếp nối diễn biến, nên “Sau đó” diễn đạt tự nhiên trình tự của câu.
- source_word: דֶּגֶל
  choice: cờ hiệu
  rationale: דֶּגֶל chỉ lá cờ làm dấu nhận biết và tập hợp cho một đơn vị bộ tộc. “Cờ hiệu” vừa cụ thể, dễ hiểu, vừa phù hợp bối cảnh đoàn quân di chuyển.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: trại Ru-bên
  rationale: Cụm danh từ sở hữu được diễn đạt gọn và tự nhiên trong tiếng Việt, chỉ trại thuộc bộ tộc Ru-bên.
- source_word: לְצִבְאֹתָם
  choice: theo các đội ngũ của họ
  rationale: צָבָא ở đây chỉ các đơn vị được tổ chức theo thứ tự hành quân, có sắc thái quân sự nhưng không nhất thiết nói đến chiến đấu. “Các đội ngũ” giữ được số nhiều và ý tổ chức.
- source_word: וְעַל צְבָאוֹ
  choice: đứng đầu đội quân ấy là
  rationale: עַל diễn tả quyền chỉ huy trên đơn vị; tiếng Việt tự nhiên cần chuyển cấu trúc danh từ thành “đứng đầu”. “Đội quân ấy” phản ánh צָבָא số ít và quy chiếu về đơn vị của trại Ru-bên.
- source_word: אֱלִיצוּר
  choice: Ê-li-xua
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết dễ đọc và quen thuộc trong tiếng Việt.
- source_word: בֶּן שְׁדֵיאוּר
  choice: con trai Sê-đêu
  rationale: Diễn đạt trực tiếp quan hệ phụ tử; tên người cha được phiên âm thay vì dịch nghĩa.
theological_decisions: []
