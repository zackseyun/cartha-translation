  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời Đức Chúa Trời được dịch là “phán”, cách diễn đạt trang trọng nhưng quen thuộc trong tiếng Việt; dạng waw liên tiếp mở ra một sự kiện mới trong mạch kể.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל đánh dấu người tiếp nhận lời phán; “phán với Môi-se” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại. Môi-se là dạng tên riêng đã quen dùng trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này dẫn vào nội dung lời nói trực tiếp; “rằng” chuyển tải chức năng diễn ngôn ấy tự nhiên và tránh cấu trúc lặp “phán... nói rằng” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. Giữ “Yahweh” bảo toàn tư cách tên riêng và không thay nó bằng tước hiệu; câu này không đòi hỏi giải quyết thêm các tranh luận về cách phát âm lịch sử.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời và dấu hai chấm để báo trước nội dung trực tiếp ở câu kế tiếp; không thêm chú thích vì bản dịch đã trực tiếp ghi Yahweh.
