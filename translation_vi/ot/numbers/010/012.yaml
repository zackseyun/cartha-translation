id: NUM.10.12
reference: Numbers 10:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: vi
  text: Dân Israel lên đường theo từng chặng từ hoang mạc Sinai, và đám mây dừng lại trong hoang mạc Paran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: lên đường
  rationale: Trong trình thuật hành trình, động từ נסע thường chỉ việc nhổ trại và bắt đầu di chuyển; “lên đường” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Dân Israel
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Israel,” nhưng trong ngữ cảnh này chỉ toàn thể cộng đồng Israel. “Dân Israel” truyền đạt đúng nghĩa tập thể, tự nhiên hơn trong tiếng Việt và không khiến người đọc hiểu lầm rằng chỉ có nam giới lên đường.
- source_word: לְמַסְעֵיהֶם
  choice: theo từng chặng
  rationale: Danh từ số nhiều מַסָּע chỉ các chặng di chuyển liên tiếp; cách dịch này giữ được ý phân đoạn của hành trình.
- source_word: מִמִּדְבַּר סִינָי
  choice: từ hoang mạc Sinai
  rationale: “Hoang mạc” diễn đạt vùng đất hoang vu, ít canh tác mà không nhất thiết chỉ một sa mạc toàn cát; Sinai được phiên âm theo tên địa danh quen dùng.
- source_word: וַיִּשְׁכֹּן
  choice: dừng lại
  rationale: Với chủ thể là đám mây trong hành trình, שכן diễn tả việc đám mây ngừng di chuyển và ở tại một nơi; “dừng lại” tự nhiên hơn “cư ngụ” trong ngữ cảnh này.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Mạo từ xác định quy chiếu đến đám mây đã được biết trong trình thuật, là dấu hiệu hướng dẫn dân Israel.
- source_word: בְּמִדְבַּר פָּארָן
  choice: trong hoang mạc Paran
  rationale: Giữ nhất quán cách dịch מִדְבָּר là “hoang mạc” và phiên âm địa danh Paran.
theological_decisions:
- issue: Cách dịch בְנֵי יִשְׂרָאֵל
  choice: Dân Israel
  alternative: các con trai của Israel
  rationale: Nguyên ngữ dùng thành ngữ gia tộc giống đực nhưng trong văn cảnh chỉ cộng đồng Israel nói chung. Bản dịch chính ưu tiên nghĩa quy chiếu tự nhiên trong tiếng Việt, không thu hẹp đối tượng thành nam giới; không có khác biệt tín lý được áp đặt.
- issue: Ý nghĩa của đám mây
  choice: Chỉ dịch trực tiếp là “đám mây”
  alternative: đám mây của Đức Chúa Trời
  rationale: Ngữ cảnh rộng hơn cho biết đây là đám mây dẫn đường, nhưng câu Hê-bơ-rơ chỉ nói “đám mây.” Không thêm thành tố giải nghĩa vào chính văn để tránh vượt quá nguồn.
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Dùng “theo từng chặng” để giữ sắc thái hành trình có các điểm dừng; tên riêng được viết là Sinai và Paran.
