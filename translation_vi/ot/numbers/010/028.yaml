  yaml_path: translation/ot/numbers/010/028.yaml
  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
translation:
  language: vi
  text: Đó là những chặng đường của con cái Y-sơ-ra-ên[a], theo các đội ngũ của họ[b]; rồi họ lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Y-sơ-ra-ên”; theo nghĩa đen là “các con trai của Y-sơ-ra-ên.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “theo các đạo quân của họ” hoặc “theo các đoàn quân của họ.” Từ Hê-bơ-rơ gợi đến những nhóm được tổ chức để hành quân.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ định số nhiều mở đầu một câu tổng kết. Tiếng Việt không bắt buộc đánh dấu số nhiều ở đại từ trong cấu trúc này; “Đó là” tự nhiên trong mạch thuật sự hồi cố.
- source_word: מַסְעֵי
  choice: các chặng hành trình
  rationale: Danh từ số nhiều dạng liên kết của מַסָּע có thể chỉ những lần lên đường, hành trình, hoặc các chặng di chuyển. “Các chặng hành trình” phù hợp với bối cảnh đoàn dân di chuyển tuần tự.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm từ theo nghĩa đen là “các con trai/con cái của Y-sơ-ra-ên.” “Con dân Y-sơ-ra-ên” giữ sắc thái cộng đồng có quan hệ với tổ phụ Y-sơ-ra-ên, đồng thời tự nhiên và bao quát trong tiếng Việt hiện đại.
- source_word: לְצִבְאֹתָם
  choice: theo từng đạo quân của họ
  rationale: צָבָא ở đây chỉ các đơn vị được tổ chức để hành quân. “Theo từng đạo quân” bảo lưu sắc thái quân ngũ của từ Hê-bơ-rơ mà không nhất thiết hàm ý họ đang giao chiến.
- source_word: וַיִּסָּעוּ
  choice: rồi họ lên đường
  rationale: Dạng động từ thuật sự của נסע diễn tả việc nhổ trại và bắt đầu di chuyển. “Rồi họ lên đường” tự nhiên trong tiếng Việt và thể hiện sự tiếp nối của trình thuật.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ hình ảnh hành quân có tổ chức trong לְצִבְאֹתָם, nhưng tránh khiến câu mặc nhiên nói rằng dân chúng đang tham chiến. Dấu ngắt câu Masoretic sau động từ được phản ánh bằng dấu chấm cuối câu.
