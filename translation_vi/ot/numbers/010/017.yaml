  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: vi
  text: Lều Thánh được tháo xuống. Sau đó, con cháu Ghẹt-sôn và con cháu Mê-ra-ri[a], là những người mang Lều Thánh[b], lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Ghẹt-sôn và các con trai của Mê-ra-ri”, một cách gọi những người thuộc hai dòng tộc này.
    reason: lexical_alternative
  - marker: b
    text: Tức là họ mang Lều Thánh sau khi Lều đã được tháo xuống; nguyên văn lặp lại “Lều Thánh”, chứ không nói rõ “các bộ phận của Lều Thánh”.
    reason: cultural_note
lexical_decisions:
- source_word: וְהוּרַד
  choice: được hạ xuống
  rationale: Thể Hophal của ירד diễn tả việc Lều Thánh được đưa xuống khỏi trạng thái đã dựng. “Được hạ xuống” giữ sắc thái bị động và không diễn giải quá mức thành việc tháo dỡ từng bộ phận.
- source_word: הַמִּשְׁכָּן
  choice: Lều Thánh
  rationale: מִשְׁכָּן ở đây chỉ nơi thánh dạng lều của Israel. “Lều Thánh” rõ ràng, tự nhiên trong tiếng Việt hiện đại và thích hợp với bối cảnh đoàn dân di chuyển.
- source_word: וְנָסְעוּ
  choice: lên đường
  rationale: Trong ngữ cảnh hành trình, נסע chỉ việc nhổ trại và bắt đầu di chuyển. “Lên đường” diễn đạt tự nhiên hành động khởi hành.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: con cháu Ghẹt-sôn
  rationale: בְּנֵי theo nghĩa đen là “các con trai của”, nhưng trong ngữ cảnh thị tộc chỉ các hậu duệ thuộc dòng Ghẹt-sôn. “Con cháu” vừa tự nhiên vừa giữ mối liên hệ gia tộc.
- source_word: וּבְנֵי מְרָרִי
  choice: con cháu Mê-ra-ri
  rationale: Cùng cấu trúc với בְנֵי גֵרְשׁוֹן, cụm từ chỉ những người thuộc dòng dõi Mê-ra-ri; “con cháu” bảo toàn cách diễn đạt theo gia tộc.
- source_word: נֹשְׂאֵי
  choice: những người mang
  rationale: Phân từ này mô tả vai trò của họ trong lúc di chuyển. “Những người mang” rõ ràng, hiện đại và giữ được chức năng bổ nghĩa của nguyên văn.
- source_word: הַמִּשְׁכָּן
  choice: Lều Thánh
  rationale: Lần xuất hiện thứ hai vẫn lặp lại danh từ “Lều Thánh”. Bản dịch giữ nguyên cách lặp này thay vì tự thêm “các bộ phận”, dù bối cảnh cho thấy Lều đã được hạ xuống.
