source:
  edition: WLC
  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: vi
  text: Rồi những người Kê-hát lên đường, mang theo các vật thánh[a]; còn Đền Tạm được dựng lên trước khi họ đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “mang nơi thánh” hoặc “những người khiêng nơi thánh”. Trong ngữ cảnh, cụm từ này chỉ các vật dụng thánh do người Kê-hát mang, phân biệt với kết cấu Đền Tạm được nhắc đến ngay sau đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: Rồi ... lên đường
  rationale: Liên từ וְ tiếp nối trình tự hành quân; “rồi” diễn đạt tự nhiên sắc thái kế tiếp, còn “lên đường” phù hợp với bối cảnh đoàn dân nhổ trại.
- source_word: הַקְּהָתִים
  choice: những người Kê-hát
  rationale: Đây là danh xưng số nhiều chỉ dòng tộc hậu duệ của Kê-hát; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: mang theo các vật thánh
  rationale: Nghĩa sát là “những người mang nơi thánh”, nhưng trong ngữ cảnh, người Kê-hát mang các đồ vật thánh thuộc nơi thánh, chứ không mang kết cấu Đền Tạm được nhắc đến ở mệnh đề sau. Bản dịch chính dùng phép hoán dụ theo ngữ cảnh, còn chú thích giữ cách hiểu sát mặt chữ.
- source_word: וְהֵקִימוּ אֶת הַמִּשְׁכָּן
  choice: còn Đền Tạm được dựng lên
  rationale: Động từ Híp-ri ở thể chủ động số nhiều nhưng không nêu chủ ngữ. Ngữ cảnh trước đó cho thấy các nhóm Lê-vi đi trước phụ trách kết cấu Đền Tạm; dùng thể bị động tránh khiến người đọc hiểu sai rằng chính người Kê-hát dựng Đền Tạm, đồng thời không xác định chủ thể quá mức văn bản.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: “Đền Tạm” là cách gọi quen thuộc, trang trọng và dễ hiểu cho nơi ngự di động của Đức Chúa Trời trong thời kỳ đồng vắng.
- source_word: עַד בֹּאָם
  choice: trước khi họ đến
  rationale: Trong mạch văn, Đền Tạm được dựng sẵn để đến khi người Kê-hát mang các vật thánh tới thì có thể đặt chúng vào; cách dịch này thể hiện tự nhiên quan hệ thời gian ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “những người Kê-hát” thay cho một thuật ngữ dòng tộc khó hiểu; dùng “các vật thánh” trong câu chính để tránh lẫn với toàn bộ nơi thánh, đồng thời giữ nghĩa sát hơn trong chú thích. Dấu chấm phẩy làm rõ hai nhóm hành động có chủ thể khác nhau.
