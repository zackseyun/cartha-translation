  source_fidelity: 'Bản dịch phản ánh đúng trình tự của câu Híp-ri: người Kê-hát lên đường, mang các vật thánh; Đền Tạm đã được dựng trước khi họ tới. «Các vật thánh» diễn đạt hợp lý nghĩa hoán dụ của נֹשְׂאֵי הַמִּקְדָּשׁ trong văn mạch, vốn phân biệt với chính cấu trúc Đền Tạm ở mệnh đề kế tiếp. Cách dùng bị động cho «Đền Tạm được dựng lên» tránh gán hành động dựng Đền Tạm cho người Kê-hát khi chủ ngữ số nhiều của nguyên ngữ không được nêu rõ.'
