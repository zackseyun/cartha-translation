  terminology: «Kê-hát», «các vật thánh», và «Đền Tạm» nhất quán với thuật ngữ Kinh Thánh Việt ngữ thông dụng. Chú thích nêu đúng phương án sát chữ và giải thích đầy đủ vì sao câu chính không dịch máy móc là «mang nơi thánh».
