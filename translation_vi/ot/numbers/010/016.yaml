  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן חֵלֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/016.yaml
  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: vi
  text: Chỉ huy đạo quân của chi phái con cháu Sa-bu-lôn là Ê-li-áp, con trai Hê-lôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đạo quân” cũng có thể dịch là “đội quân” hoặc “đơn vị”; từ Hê-bơ-rơ צְבָא chỉ một lực lượng bộ tộc được tổ chức theo đội hình hành quân.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Chỉ huy ... là
  rationale: Trong công thức liệt kê này, וְ nối với mục trước, còn עַל cùng động từ được lược bỏ diễn tả quyền chỉ huy. Tiếng Việt tự nhiên có thể tái cấu trúc thành “Chỉ huy ... là” mà vẫn giữ đúng quan hệ cú pháp.
- source_word: צְבָא
  choice: đạo quân
  rationale: Trong bối cảnh dân Y-sơ-ra-ên hành quân theo đội hình, từ này chỉ một lực lượng bộ tộc được tổ chức. “Đạo quân” dễ hiểu, trang trọng, và giữ sắc thái quân sự mà không nhất thiết hàm ý một quân đội thường trực.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Ở đây từ này mang nghĩa đơn vị xã hội-chính trị “bộ tộc”, không phải nghĩa cụ thể “cây gậy”.
- source_word: בְּנֵי זְבוּלֻן
  choice: con cháu Sa-bu-lôn
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Sa-bu-lôn”, nhưng trong công thức bộ tộc nó chỉ những người thuộc dòng dõi Sa-bu-lôn. “Con cháu” truyền đạt tự nhiên quan hệ huyết thống tập thể trong tiếng Việt.
- source_word: אֱלִיאָב
  choice: Ê-li-áp
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc và dễ đọc trong tiếng Việt.
- source_word: בֶּן חֵלֹן
  choice: con trai Hê-lôn
  rationale: Đây là cấu trúc phụ hệ thông thường của tiếng Hê-bơ-rơ; cách dịch trực tiếp này tự nhiên và chính xác trong tiếng Việt.
theological_decisions: []
