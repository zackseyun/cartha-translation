  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tái cấu trúc theo trật tự tự nhiên của tiếng Việt; tên riêng được phiên âm nhất quán. Dấu chú thích [a] xuất hiện ngay sau toàn câu.
