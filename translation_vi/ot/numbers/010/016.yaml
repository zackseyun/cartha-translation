revisions:
- from: Chỉ huy đạo quân của bộ tộc con cháu Sa-bu-lôn là Ê-li-áp, con trai Hê-lôn.[a]
  to: Chỉ huy đạo quân của chi phái con cháu Sa-bu-lôn là Ê-li-áp, con trai Hê-lôn.[a]
  rationale: Chỉ sửa thuật ngữ và cấu trúc danh ngữ để phản ánh rõ, tự nhiên hơn “chi phái của con cháu Sa-bu-lôn”, đồng thời giữ nguyên quan hệ chỉ huy, sắc thái của צָבָא, tên riêng và vị trí chú thích. Chú thích được chỉnh nhẹ để tránh cụm “đơn vị quân ngũ” không tự nhiên; không thay đổi nghĩa.
