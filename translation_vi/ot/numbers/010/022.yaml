base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: vi
  text: Sau đó, cờ hiệu[a] của trại của con cháu Ép-ra-im lên đường theo các đạo quân[b] của họ; người đứng đầu đạo quân ấy là Ê-li-sa-ma, con trai A-mi-hút.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngọn cờ” hoặc “cờ hiệu”; từ Hê-bơ-rơ chỉ cờ của bộ tộc mà trại tập hợp và hành quân dưới đó.
    reason: lexical_alternative
  - marker: b
    text: Hay “theo các đội ngũ của họ”; nguyên ngữ nói đến những lực lượng được tổ chức theo kiểu quân đội trong trại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Sau đó ... lên đường
  rationale: Động từ với waw tiếp nối trình tự thuật chuyện; “lên đường” tự nhiên trong ngữ cảnh các trại lần lượt khởi hành.
- source_word: דֶּגֶל
  choice: ngọn cờ
  rationale: Chỉ cờ hiệu của đơn vị bộ tộc mà trại tập hợp và hành quân bên dưới; “ngọn cờ” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מַחֲנֵה
  choice: trại
  rationale: Giữ hình ảnh trại quân trong cuộc hành trình nơi hoang mạc và quan hệ cấu trúc với cờ hiệu.
- source_word: בְנֵי אֶפְרַיִם
  choice: con cháu Ép-ra-im
  rationale: Trong ngữ cảnh bộ tộc, cụm Hê-bơ-rơ chỉ những người thuộc dòng dõi Ép-ra-im; cách dịch này tự nhiên hơn “các con trai” mà vẫn giữ quan hệ huyết thống.
- source_word: לְצִבְאֹתָם
  choice: theo từng đạo quân của họ
  rationale: Số nhiều chỉ các lực lượng được tổ chức theo đội ngũ để hành quân; “đạo quân” giữ sắc thái quân sự của צָבָא mà không nhất thiết hàm ý đang giao chiến.
- source_word: וְעַל צְבָאוֹ
  choice: người chỉ huy đạo quân ấy là
  rationale: Cụm “ở trên đạo quân của nó” diễn tả quyền lãnh đạo; chuyển thành cấu trúc tiếng Việt tự nhiên, với đại từ chỉ lại đơn vị của trại Ép-ra-im.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Ê-li-sa-ma, con trai A-mi-hút
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt và dịch trực tiếp quan hệ cha-con.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con cháu” cho danh xưng bộ tộc, “đạo quân” để bảo toàn sắc thái tổ chức quân sự, đồng thời chú thích các phương án từ vựng thực sự có thể có.
