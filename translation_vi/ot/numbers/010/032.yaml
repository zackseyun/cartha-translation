source:
  edition: WLC
  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: vi
  text: Nếu anh đi cùng chúng tôi, thì mọi điều tốt lành Yahweh dành cho chúng tôi, chúng tôi sẽ làm điều tốt cho anh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Nếu
  rationale: Cụm mở đầu giới thiệu điều kiện; “Nếu” diễn đạt tự nhiên trong tiếng Việt mà không biến điều kiện thành điều chắc chắn như “Khi” có thể hàm ý.
- source_word: תֵלֵךְ עִמָּנוּ
  choice: anh đi cùng chúng tôi
  rationale: הלך với עִם ở đây chỉ việc cùng Israel lên đường. “Đi cùng” trực tiếp, tự nhiên và hợp ngữ cảnh; đại từ “anh” phù hợp lời Môi-se nói với Hô-báp.
- source_word: וְהָיָה
  choice: thì
  rationale: Lần xuất hiện thứ hai đánh dấu mệnh đề kết quả; cặp “nếu… thì…” thể hiện rõ cấu trúc điều kiện trong tiếng Việt.
- source_word: הַטּוֹב הַהוּא אֲשֶׁר
  choice: điều tốt lành nào
  rationale: Cách diễn đạt này giữ phạm vi mở của điều tốt được Yahweh ban, đồng thời tự nhiên hơn lối dịch sát chữ “điều tốt lành ấy mà”.
- source_word: יֵיטִיב יְהוָה עִמָּנוּ
  choice: Yahweh làm cho chúng tôi
  rationale: Hiphil của יטב mang nghĩa làm điều tốt, đối đãi tốt hoặc ban lợi ích. Kết hợp với “điều tốt lành nào”, “làm cho chúng tôi” rõ nghĩa và duy trì liên hệ từ vựng với mệnh đề sau. Danh riêng יְהוָה được chuyển tự là “Yahweh”.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: chúng tôi cũng sẽ làm điều tốt cho anh
  rationale: Giữ sự lặp lại của gốc יטב và ý tương ứng giữa điều Yahweh làm cho Israel với điều Israel sẽ làm cho Hô-báp, nhưng không thêm từ “cùng một” vốn không được nói rõ trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Chuyển tự “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Mức độ đồng nhất giữa hai hành động ‘làm điều tốt’
  choice: Không thêm ‘cùng một điều tốt’
  alternative: chúng tôi cũng sẽ làm chính điều tốt ấy cho anh
  rationale: Hai động từ cùng gốc יטב tạo sự tương ứng rõ ràng, nhưng nguyên văn không bắt buộc rằng Israel sẽ chuyển nguyên vẹn chính cùng một lợi ích cho Hô-báp; bản dịch giữ sự liên hệ mà không giải quyết quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” theo quan hệ đối thoại nam giới trong ngữ cảnh; tránh “ngươi” vì cổ và tạo khoảng cách không cần thiết. Không đặt chú thích vì câu dịch có thể giữ đầy đủ ý nghĩa và độ mở của nguyên văn ngay trong chính văn.
