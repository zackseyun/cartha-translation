base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: vi
  text: “Hãy làm cho con hai chiếc kèn bằng bạc; con phải làm chúng bằng bạc, theo kỹ thuật gò búa[a]. Chúng sẽ được dùng để triệu tập cộng đồng và để các trại lên đường[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bằng bạc được gò búa.” Từ Hê-bơ-rơ chỉ đồ kim loại được tạo hình bằng cách đập hoặc gò bằng búa.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “và cho việc khởi hành của các trại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Hãy làm cho con
  rationale: Mệnh lệnh cùng לְךָ diễn tả việc Môi-se phải làm hoặc cho làm để sử dụng trong nhiệm vụ của mình; “làm cho con” giữ sắc thái ấy và tự nhiên trong lời Đức Chúa Trời phán với Môi-se.
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  choice: hai chiếc kèn bằng bạc
  rationale: חֲצֹצְרָה chỉ loại kèn thẳng bằng kim loại, khác với tù và cong; “kèn bằng bạc” diễn đạt rõ vật liệu.
- source_word: מִקְשָׁה
  choice: bằng bạc dát
  rationale: מִקְשָׁה mô tả kỹ thuật dùng búa dát kim loại để tạo hình. Lặp lại “bạc” giúp câu tiếng Việt rõ nghĩa, dù từ này được hiểu từ vế trước.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: con phải làm chúng
  rationale: Thể chưa hoàn thành sau mệnh lệnh mang lực chỉ thị, nên “phải” giữ được sắc thái bắt buộc.
- source_word: וְהָיוּ לְךָ
  choice: Chúng sẽ được dùng
  rationale: Cấu trúc nói đến công dụng của hai chiếc kèn hơn là quyền sở hữu; câu bị động tự nhiên trong tiếng Việt hiện đại.
- source_word: לְמִקְרָא הָעֵדָה
  choice: để triệu tập cộng đồng
  rationale: מִקְרָא ở đây là sự kêu gọi hoặc triệu tập, còn עֵדָה là toàn thể cộng đồng Israel.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: và báo hiệu cho các trại lên đường
  rationale: מַסַּע chỉ việc nhổ trại, khởi hành. Cụm tiếng Việt nêu rõ chức năng phát tín hiệu của kèn, đồng thời giữ “các trại” ở số nhiều.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “con” theo ngữ cảnh Đức Chúa Trời phán với Môi-se; dùng “cộng đồng” cho עֵדָה và “các trại” để bảo toàn hình ảnh số nhiều của nguyên văn.
