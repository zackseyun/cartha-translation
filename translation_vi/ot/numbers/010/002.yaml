    rationale: Cụm này trong tiếng Việt thường gợi bạc được dát thành lá, hoặc vật được phủ bạc. Từ Hê-bơ-rơ chỉ công việc kim loại được gò/đập bằng búa để tạo hình.
  - severity: medium
    issue: “báo hiệu cho các trại lên đường” thêm hành vi “báo hiệu” vào bản văn chính.
    rationale: Kèn đương nhiên được dùng để phát tín hiệu trong ngữ cảnh rộng hơn, nhưng câu này chỉ nêu công dụng “cho sự khởi hành/lên đường của các trại.” Bản dịch nên giữ mức độ hàm ý của nguyên văn.
