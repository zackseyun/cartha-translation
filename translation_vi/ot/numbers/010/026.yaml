    rationale: עַל mở đầu quan hệ “ở trên/đứng đầu” đơn vị, còn tên riêng là chủ thể được giới thiệu. Thêm “Người” tạo câu tiếng Việt hoàn chỉnh mà không thêm nội dung.
  - severity: low
