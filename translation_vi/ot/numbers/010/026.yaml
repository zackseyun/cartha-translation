  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: vi
  text: Người chỉ huy đội quân[a] của chi tộc A-se là Pha-ghi-ên, con trai Óc-ran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đoàn quân,” “đơn vị” hoặc “đạo quân”; từ Hê-bơ-rơ chỉ một lực lượng được tổ chức trong trật tự đóng trại và lên đường của Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Chỉ huy
  rationale: Trong chuỗi liệt kê các thủ lĩnh, עַל diễn tả người đứng trên, tức chỉ huy đơn vị; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ ở đầu câu.
- source_word: צְבָא
  choice: đạo quân
  rationale: Trong bối cảnh thứ tự lên đường của trại quân Israel, từ này chỉ một lực lượng có tổ chức; “đạo quân” giữ được sắc thái quân sự và cơ cấu của tiếng Hê-bơ-rơ.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Ở đây từ này mang nghĩa đơn vị bộ tộc, không phải cây gậy.
- source_word: בְּנֵי אָשֵׁר
  choice: con cháu A-se
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của A-se,” nhưng trong ngữ cảnh này là tên gọi những người thuộc dòng dõi và bộ tộc A-se; “con cháu” tự nhiên và chính xác trong tiếng Việt.
- source_word: פַּגְעִיאֵל
  choice: Pha-ghi-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang dạng dễ đọc trong tiếng Việt.
- source_word: בֶּן עָכְרָן
  choice: con trai Óc-ran
  rationale: Giữ rõ cấu trúc phụ hệ “con trai của”; tên người cha được phiên âm, không dịch nghĩa.
