  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: vi
  text: Và người đứng đầu đạo quân của chi tộc Si-mê-ôn là Sê-lu-mi-ên, con trai Xu-ri-sa-đai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch “đơn vị” hoặc “đội ngũ” thay cho “đạo quân” (Hê-bơ-rơ: צְבָא), chỉ lực lượng bộ tộc được tổ chức để hành quân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Chỉ huy ... là
  rationale: Trong ngữ cảnh thứ tự hành quân, עַל diễn tả người được đặt trên một đơn vị. Cấu trúc tiếng Việt đảo thành phần chức danh lên trước và dùng “chỉ huy” để diễn đạt tự nhiên quan hệ lãnh đạo; liên từ וְ không cần dịch riêng vì câu tiếp nối trong danh sách đã rõ.
- source_word: צְבָא
  choice: đạo quân
  rationale: Từ này chỉ lực lượng có tổ chức của bộ tộc trong đội hình hành quân. “Đạo quân” giữ sắc thái quân sự và tập thể, nhưng không nhất thiết nói đến việc đang giao chiến.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong ngữ cảnh kiểm tra dân số và bố trí trại quân, đây là đơn vị bộ tộc, không phải nghĩa đen “cây gậy”.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: con cháu Si-mê-ôn
  rationale: Cụm Hê-bơ-rơ nghĩa đen là “các con trai của Si-mê-ôn”, nhưng ở đây là cách gọi cộng đồng hậu duệ thuộc bộ tộc; “con cháu” vừa tự nhiên vừa giữ quan hệ gia tộc.
- source_word: שְׁלֻמִיאֵל
  choice: Sê-lu-mi-ên
  rationale: Phiên âm tên riêng sang tiếng Việt theo cách đọc gần với dạng Hê-bơ-rơ.
- source_word: בֶּן
  choice: con trai
  rationale: Đây là quan hệ phụ tử trực tiếp trong tên gọi theo cha.
- source_word: צוּרִי שַׁדָּי
  choice: Xu-ri-sa-đai
  rationale: Phiên âm tên riêng ghép thành một tên thống nhất, gần với dạng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chỉ huy” thay cho cách dịch cứng “ở trên” để thể hiện chức năng trong đội hình; giữ chú thích nhằm bảo toàn phạm vi nghĩa của צְבָא.
