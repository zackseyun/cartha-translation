  - severity: low
    issue: “chỉ huy đơn vị của trại ấy” dài và hơi gián tiếp so với câu nguồn.
    rationale: “Người chỉ huy đạo quân ấy” diễn đạt tự nhiên hơn vai trò được nêu bởi עַל, đồng thời giữ hậu tố số ít của צְבָאוֹ.
