  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh “cờ hiệu” làm chủ thể lên đường như trong cấu trúc Hê-bơ-rơ, đồng thời chú thích phép hoán dụ để tránh làm mất độ rộng nghĩa của דֶּגֶל.
