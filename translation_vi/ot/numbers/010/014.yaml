  text: וַ/יִּסַּ֞ע דֶּ֣גֶל מַחֲנֵ֧ה בְנֵֽי יְהוּדָ֛ה בָּ/רִאשֹׁנָ֖ה לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: vi
  text: Cờ hiệu[a] của trại quân con cháu Giu-đa lên đường đầu tiên, theo các đơn vị[b] của họ; người chỉ huy đạo quân ấy là Na-ha-sôn, con trai A-mi-na-đáp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngọn cờ.” Từ Hê-bơ-rơ chỉ cờ hiệu của bộ tộc và, theo phép hoán dụ, đơn vị trại quân tập hợp dưới cờ ấy.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “theo các đội ngũ” hoặc “theo các đạo quân.” Từ Hê-bơ-rơ là một thuật ngữ tổ chức mang sắc thái quân sự, chỉ các đơn vị bộ tộc được sắp xếp có trật tự.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: lên đường
  rationale: Trong trình thuật hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và bắt đầu di chuyển; “lên đường” tự nhiên và đúng với trình tự hành quân.
- source_word: דֶּגֶל
  choice: cờ hiệu
  rationale: Từ này chỉ cờ hiệu của bộ tộc, đồng thời có thể gợi đến cả đơn vị trại quân tập hợp và di chuyển dưới cờ ấy. “Cờ hiệu” giữ được hình ảnh cụ thể cùng sắc thái tổ chức.
- source_word: מַחֲנֵה
  choice: trại
  rationale: Trong cụm kết cấu דֶּגֶל מַחֲנֵה, từ này nói đến trại quân được tổ chức dưới một cờ hiệu; “trại” ngắn gọn và phù hợp bối cảnh.
- source_word: בְנֵי יְהוּדָה
  choice: con cháu Giu-đa
  rationale: Trong ngữ cảnh bộ tộc, cụm Hê-bơ-rơ nghĩa đen là “các con trai của Giu-đa” nhưng bao quát hậu duệ thuộc bộ tộc; “con cháu Giu-đa” tự nhiên và chính xác trong tiếng Việt.
- source_word: בָּרִאשֹׁנָה
  choice: đầu tiên
  rationale: Đây là trạng từ chỉ thứ tự lên đường; “đầu tiên” diễn đạt rõ vị trí đi trước.
- source_word: לְצִבְאֹתָם
  choice: theo từng đơn vị
  rationale: צָבָא ở đây là thuật ngữ tổ chức mang sắc thái quân sự, chỉ các đội ngũ có trật tự. “Theo từng đơn vị” truyền đạt cách sắp xếp mà không hàm ý họ đang trực tiếp giao chiến.
- source_word: וְעַל צְבָאוֹ
  choice: chỉ huy đơn vị của trại ấy là
  rationale: Giới từ עַל giới thiệu người đứng trên, tức người phụ trách đơn vị; cách diễn đạt này làm rõ chức năng lãnh đạo trong tiếng Việt mà vẫn giữ đối tượng số ít của hậu tố.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Na-ha-sôn, con trai A-mi-na-đáp
  rationale: Tên riêng được phiên âm theo lối quen thuộc, còn בֶּן được diễn đạt rõ là “con trai”.
