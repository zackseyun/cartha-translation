source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: vi
  text: 'Ông nói: “Xin ông đừng rời bỏ chúng tôi, vì ông biết những nơi chúng tôi đóng trại trong hoang mạc, và ông sẽ là mắt cho chúng tôi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “sẽ là mắt cho chúng tôi”; một ẩn dụ chỉ sự hướng dẫn nhờ am hiểu hoang mạc.'
    reason: Giữ nguyên hình ảnh “mắt” của tiếng Hê-bơ-rơ và giải thích nghĩa hướng dẫn của ẩn dụ mà không thêm yếu tố “tai”.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ông nói
  rationale: Dạng wayyiqtol tiếp nối lời thuật chuyện và giới thiệu lời nói trực tiếp. Tiếng Việt không cần thêm liên từ để giữ mạch văn tự nhiên.
- source_word: אַל נָא תַּעֲזֹב אֹתָנוּ
  choice: Xin anh đừng rời bỏ chúng tôi
  rationale: אַל diễn tả lời ngăn cấm, còn נָא tạo sắc thái khẩn khoản. “Rời bỏ” phù hợp bối cảnh hành trình mà không hàm ý thần học quá mức.
- source_word: כִּי עַל כֵּן
  choice: vì
  rationale: Cụm này nêu lý do cho lời khẩn cầu; “vì” diễn đạt tự nhiên và gọn rõ quan hệ nguyên nhân trong tiếng Việt.
- source_word: יָדַעְתָּ חֲנֹתֵנוּ בַּמִּדְבָּר
  choice: anh biết những nơi chúng tôi đóng trại trong hoang mạc
  rationale: חֲנֹתֵנוּ có nghĩa đen là “việc/sự đóng trại của chúng tôi”; trong ngữ cảnh, câu nói nhấn mạnh kiến thức thực địa về các nơi đóng trại. Cách dịch này dễ hiểu nhưng không thêm ý “nên” vốn không được biểu thị rõ trong tiếng Hê-bơ-rơ.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: và anh sẽ làm tai mắt cho chúng tôi
  rationale: Nguyên văn là “sẽ làm mắt cho chúng tôi”, một ẩn dụ chỉ người quan sát, dẫn đường nhờ hiểu biết địa hình. Thành ngữ “làm tai mắt” tự nhiên trong tiếng Việt và vẫn giữ hình ảnh về giác quan thay vì diễn giải thẳng thành “người dẫn đường”.
theological_decisions:
- issue: Mối quan hệ giữa sự dẫn dắt của Đức Chúa Trời và sự trợ giúp của người am hiểu địa hình
  choice: Giữ nguyên lời xin người này làm “tai mắt”, không giải thích hoặc dung hòa với sự dẫn dắt thần linh trong văn cảnh rộng hơn.
  alternative: Diễn giải rằng ông chỉ hỗ trợ về mặt thực địa dưới sự dẫn dắt của Đức Chúa Trời.
  rationale: Câu Hê-bơ-rơ tự nó không nêu cách hai phương diện này liên hệ với nhau; bản dịch không nên áp đặt một cách giải quyết thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” vì lời nói hướng đến một người nam trong quan hệ thỉnh cầu, tránh lối xưng hô cổ. “Hoang mạc” diễn tả vùng hoang vu, không nhất thiết chỉ một sa mạc đầy cát.
