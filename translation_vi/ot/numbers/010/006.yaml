  source_fidelity: 'Bản dịch chuyển tải đúng trình tự: tiếng kèn báo hiệu thứ hai khiến các trại ở phía nam lên đường. Tuy nhiên, cụm לְמַסְעֵיהֶם có nghĩa sát là “cho các lần lên đường/hành trình của họ”; cách thêm “mỗi khi các trại ấy lên đường” diễn giải rõ hơn nguyên văn và đổi quy chiếu trực tiếp của đại từ.'
