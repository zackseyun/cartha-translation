  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: vi
  text: Khi anh em thổi hồi kèn báo hiệu lần thứ hai[a], các trại đóng ở phía nam sẽ lên đường; phải thổi hồi kèn báo hiệu cho các lần lên đường của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hồi kèn thúc quân” hoặc “tín hiệu”. Từ Hê-bơ-rơ תְּרוּעָה chỉ một tiếng kèn đặc trưng dùng để điều động các trại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Khi anh em thổi
  rationale: Động từ תקע trong ngữ cảnh này chỉ việc thổi kèn. “Khi anh em thổi” diễn đạt tự nhiên trình tự chỉ dẫn và giữ ngôi thứ hai số nhiều.
- source_word: תְּרוּעָה
  choice: hồi kèn báo hiệu
  rationale: Trong hệ thống tín hiệu bằng kèn ở Dân Số 10, từ này chỉ một kiểu tiếng kèn đặc trưng dùng để ra hiệu, không nhất thiết mang nghĩa báo động nguy hiểm.
- source_word: שֵׁנִית
  choice: lần thứ hai
  rationale: Giữ rõ nghĩa thứ tự của từ Hê-bơ-rơ và kết hợp tự nhiên với “hồi kèn báo hiệu” trong tiếng Việt.
- source_word: וְנָסְעוּ
  choice: sẽ lên đường
  rationale: Động từ נסע trong bối cảnh các trại di chuyển chỉ việc nhổ trại và bắt đầu hành trình; “lên đường” là cách nói hiện đại, tự nhiên.
- source_word: הַמַּחֲנוֹת
  choice: các trại
  rationale: Danh từ số nhiều chỉ các đơn vị trại quân của các chi phái; “các trại” là cách dịch trực tiếp và dễ hiểu.
- source_word: הַחֹנִים
  choice: đóng
  rationale: Phân từ của חנה mô tả vị trí đang đóng trại. Trong cụm “các trại đóng ở phía nam”, dạng gọn này tự nhiên mà vẫn giữ nghĩa trạng thái.
- source_word: תֵּימָנָה
  choice: ở phía nam
  rationale: Trong ngữ cảnh, từ này xác định vị trí của các trại phía nam hơn là hướng chuyển động.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: họ phải thổi hồi kèn báo hiệu
  rationale: Giữ chủ thể số nhiều không xác định của động từ Hê-bơ-rơ và sự lặp lại của תְּרוּעָה; “phải” phù hợp sắc thái quy định trong đoạn chỉ dẫn.
- source_word: לְמַסְעֵיהֶם
  choice: mỗi khi các trại ấy lên đường
  rationale: Cụm này nói đến những lần khởi hành của các trại. Cách diễn đạt này rõ nghĩa trong tiếng Việt và làm sáng tỏ đại từ số nhiều mà không đổi nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời chỉ dẫn; dùng “hồi kèn báo hiệu” để tránh sắc thái quá chuyên biệt của “báo động” và phản ánh chức năng điều động trong ngữ cảnh.
