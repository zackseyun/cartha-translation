  to: Khi anh em thổi hồi kèn báo hiệu lần thứ hai[a], các trại đóng ở phía nam sẽ lên đường; phải thổi hồi kèn báo hiệu cho các lần lên đường của họ.
  rationale: Chỉ sửa mệnh đề cuối để dịch sát לְמַסְעֵיהֶם là “cho các lần lên đường của họ”, không thêm quy chiếu hoặc trạng ngữ không có trong nguyên văn. Dạng “phải thổi” tự nhiên trong tiếng Việt, bảo toàn sắc thái quy định và không buộc chủ thể của động từ số nhiều phải là các trại.
