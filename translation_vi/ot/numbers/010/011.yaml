revisions:
- from: Vào năm thứ hai, tháng thứ hai, ngày hai mươi trong tháng, đám mây cất lên[a] khỏi phía trên Đền Tạm Chứng Ước[b].
  to: Vào ngày hai mươi tháng thứ hai của năm thứ hai, đám mây đã cất lên[a] từ phía trên Đền Tạm Chứng Ngôn[b].
  rationale: Bản sửa giữ nguyên mốc thời gian và ý chuyển động của đám mây theo tiếng Hê-bơ-rơ, đồng thời dùng trật tự thời gian và quan hệ không gian tự nhiên hơn trong tiếng Việt. “Chứng Ngôn” tránh đưa ý “giao ước” vào הָעֵדֻת, nhưng vẫn bảo toàn thuật ngữ thánh điện nhất quán với nguyên ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:40:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mốc thời gian, đám mây, và chuyển động đi lên/rời đi. Tuy nhiên, “Chứng Ước” không phải tương đương từ vựng rõ ràng của הָעֵדֻת ("chứng ngôn/chứng tích/testimony") và thêm sắc thái “giao ước” vào thuật ngữ nguồn. Cụm “cất lên khỏi phía trên” cũng không tự nhiên trong tiếng Việt.
  naturalness: 'Nên sắp xếp cụm niên đại theo trật tự Việt ngữ tự nhiên hơn: “ngày hai mươi tháng thứ hai của năm thứ hai”. “Từ phía trên” diễn đạt rõ và tự nhiên quan hệ không gian của מֵעַל.'
  terminology: Giữ “Đền Tạm” cho מִשְׁכָּן là phù hợp. Đổi “Chứng Ước” thành “Chứng Ngôn” để phản ánh הָעֵדֻת mà không diễn giải thành “giao ước”. Chú thích nên nêu hình thức sát hơn “Đền Tạm của chứng ngôn” và phương án “Lều Chứng Ngôn”.
  issues:
