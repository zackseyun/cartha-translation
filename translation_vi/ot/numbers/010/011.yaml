    rationale: Từ Hê-bơ-rơ mang nghĩa “chứng ngôn/testimony”; dù có liên hệ bối cảnh giao ước, “ước” không có mặt trong từ nguồn và làm cách dịch mang tính diễn giải.
  - severity: low
    issue: “cất lên khỏi phía trên”
    rationale: Cấu trúc này gượng trong tiếng Việt. “Cất lên từ phía trên” giữ được ý đám mây rời vị trí ở trên Đền Tạm.
  - severity: low
