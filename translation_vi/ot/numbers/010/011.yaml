language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: vi
  text: Vào ngày hai mươi tháng thứ hai của năm thứ hai, đám mây đã cất lên[a] từ phía trên Đền Tạm Chứng Ngôn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bốc lên” hoặc “đi lên”.
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: “Đền Tạm của chứng ngôn”; cũng có thể dịch là “Lều Chứng Ngôn”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Vào
  rationale: Trong câu ghi niên đại mở đầu một biến cố, lối kể וַיְהִי được diễn đạt tự nhiên bằng cấu trúc thời gian mở đầu “Vào…”, tránh câu dẫn nặng nề nhưng vẫn giữ diễn tiến tự sự.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: năm thứ hai
  rationale: Diễn đạt trực tiếp mốc năm theo nguyên văn Hê-bơ-rơ.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: tháng thứ hai
  rationale: Giữ nguyên cách xác định tháng trong năm của văn bản nguồn.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: ngày hai mươi trong tháng
  rationale: Thành ngữ Hê-bơ-rơ, sát nghĩa là “vào hai mươi trong tháng”, được diễn đạt rõ ràng theo cách nói tiếng Việt.
- source_word: נַעֲלָה
  choice: cất lên
  rationale: Động từ עלה chỉ chuyển động đi lên; với chủ ngữ là đám mây, “cất lên” vừa tự nhiên vừa giữ hình ảnh đám mây rời vị trí phía trên Đền Tạm.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Danh từ xác định, chỉ đám mây đã được biết đến trong trình thuật về sự dẫn dắt dân Y-sơ-ra-ên.
- source_word: מֵעַל
  choice: khỏi phía trên
  rationale: Thể hiện cả ý chuyển động rời khỏi và vị trí ở bên trên, thay vì chỉ nói chung là “khỏi”.
- source_word: מִשְׁכַּן
  choice: Đền Tạm
  rationale: Thuật ngữ quen thuộc và trang trọng trong tiếng Việt dành cho nơi thánh lưu động; phản ánh ý nghĩa nơi ngự của מִשְׁכָּן.
- source_word: הָעֵדֻת
  choice: Chứng Ước
  rationale: Trong ngữ cảnh nơi thánh của Ngũ Kinh, עֵדוּת chỉ chứng tích/chứng ngôn của giao ước được đặt tại đó. “Chứng Ước” bảo tồn sắc thái làm chứng và mối liên hệ với giao ước mà không thay thẳng từ này bằng “giao ước”.
theological_decisions:
- issue: Danh xưng nơi thánh מִשְׁכַּן הָעֵדֻת
  choice: Đền Tạm Chứng Ước
  alternative: Lều Chứng Ngôn; Đền Tạm của Chứng Tích
  rationale: “Đền Tạm” phân biệt מִשְׁכָּן với từ thông thường chỉ “lều”, còn “Chứng Ước” giữ được chức năng chứng ngôn trong bối cảnh giao ước. Chú thích ghi nhận các cách dịch sát hình thức hơn để không che khuất phạm vi nghĩa của עֵדוּת.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu được tổ chức theo trật tự thời gian tự nhiên của tiếng Việt; các thuật ngữ nơi thánh được viết hoa như danh xưng xác định trong ngữ cảnh.
