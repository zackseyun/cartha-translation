  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: vi
  text: Các con trai của A-rôn, tức là các thầy tế lễ, phải thổi kèn; các kèn ấy sẽ là một quy định lâu dài[a] cho các ngươi qua mọi thế hệ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một quy định đời đời” hoặc “một quy định vĩnh viễn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: Các con trai của A-rôn
  rationale: Giữ nguyên cách diễn đạt thân tộc trực tiếp của tiếng Hê-bơ-rơ; “các con trai” tự nhiên và chính xác trong tiếng Việt.
- source_word: הַכֹּהֲנִים
  choice: tức là các thầy tế lễ
  rationale: Cụm từ đồng vị xác định các con trai của A-rôn là những thầy tế lễ; thêm “tức là” để quan hệ đồng vị rõ ràng trong tiếng Việt.
- source_word: יִתְקְעוּ בַּחֲצֹצְרֹת
  choice: phải thổi kèn
  rationale: Động từ תקע khi đi với חצצרות có nghĩa là thổi hoặc nổi kèn. “Phải” diễn đạt tự nhiên hiệu lực quy định của thể vị hoàn trong văn cảnh luật lệ.
- source_word: וְהָיוּ לָכֶם
  choice: điều này sẽ là ... cho các ngươi
  rationale: Dù động từ ở số nhiều, nội dung theo sau có thể tổng kết toàn bộ quy định vừa nêu. Tiếng Việt dùng “điều này” tự nhiên hơn một đại từ số nhiều mơ hồ, đồng thời không quyết định quá mức vật quy chiếu.
- source_word: לְחֻקַּת עוֹלָם
  choice: một quy định lâu dài
  rationale: Cụm pháp lý חקת עולם chỉ một quy định có hiệu lực bền vững. “Lâu dài” giữ được sức nặng kéo dài mà không buộc עולם luôn mang nghĩa vô tận tuyệt đối.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua mọi thế hệ
  rationale: Cách diễn đạt tự nhiên cho ý quy định tiếp tục có hiệu lực trong các thế hệ kế tiếp.
theological_decisions:
- issue: Phạm vi thời gian của חֻקַּת עוֹלָם
  choice: một quy định lâu dài
  alternative: một quy định đời đời; một quy định vĩnh viễn
  rationale: עוֹלָם có thể chỉ thời gian kéo dài hoặc tính trường tồn tùy văn cảnh. Bản dịch chính tránh áp đặt kết luận triết học về tính vô tận tuyệt đối, còn chú thích bảo lưu các cách hiểu mạnh hơn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “các ngươi” vì lời được phán trực tiếp với cộng đồng trong bối cảnh cổ đại; dùng “thầy tế lễ” là thuật ngữ Kinh Thánh quen thuộc. Mọi dấu chú thích đều xuất hiện trong chính văn.
