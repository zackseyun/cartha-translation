id: NUM.2.12
reference: Numbers 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: vi
  text: Bộ tộc Si-mê-ôn đóng trại bên cạnh người ấy,[a] và người lãnh đạo của con cháu Si-mê-ôn là Sê-lu-mi-ên, con trai của Xu-ri-sa-đai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bên cạnh nó”. Giới từ Hê-bơ-rơ với hậu tố ở đây chỉ vị trí gần kề trong cách bố trí doanh trại; hậu tố có thể quy chiếu đến một người hoặc đến đơn vị trại/cờ hiệu đã được nhắc đến.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: Những người đóng trại
  rationale: Phân từ của חנה được dùng như danh từ để chỉ những người đang đóng trại; cách dịch này tự nhiên và giữ được sắc thái hành động.
- source_word: עָלָיו
  choice: bên cạnh ông
  rationale: Trong ngữ cảnh bố trí doanh trại, עַל với hậu tố ngôi thứ ba số ít giống đực diễn tả vị trí kề bên. Đại từ có thể quy chiếu đến người vừa được nhắc đến trong mạch văn; ghi chú bảo lưu khả năng hiểu là một đối tượng vô nhân xưng.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: bộ tộc Si-mê-ôn
  rationale: מַטֶּה trong các bản văn kiểm kê và bố trí doanh trại chỉ đơn vị bộ tộc, không phải cây gậy theo nghĩa đen.
- source_word: וְנָשִׂיא
  choice: và người lãnh đạo
  rationale: נָשִׂיא ở đây là người đứng đầu được công nhận của bộ tộc; “người lãnh đạo” rõ nghĩa và tránh sắc thái vương tước không có trong ngữ cảnh.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: con cháu Si-mê-ôn
  rationale: בני trong công thức bộ tộc chỉ các hậu duệ thuộc dòng Si-mê-ôn. “Con cháu” là cách nói tự nhiên trong tiếng Việt, đồng thời giữ ý niệm huyết thống của nguyên ngữ.
- source_word: שְׁלֻמִיאֵל
  choice: Sê-lu-mi-ên
  rationale: Tên riêng được phiên âm sang tiếng Việt theo âm dạng Hê-bơ-rơ.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: con trai Xu-ri-sa-đai
  rationale: Cấu trúc phụ hệ בֶּן được dịch trực tiếp; צוּרִישַׁדַּי được phiên âm như một tên riêng thống nhất.
theological_decisions:
- issue: Ngôn ngữ thân tộc trong לִבְנֵי שִׁמְעוֹן
  choice: con cháu Si-mê-ôn
  alternative: các con trai của Si-mê-ôn
  rationale: Dạng Hê-bơ-rơ là số nhiều giống đực của “con trai”, nhưng trong công thức định danh bộ tộc, cụm từ bao quát hậu duệ thuộc dòng tộc. “Con cháu” truyền đạt đúng chức năng tập thể và huyết thống trong tiếng Việt mà không xóa bỏ ý niệm dòng dõi.
- issue: Quy chiếu của hậu tố giống đực trong עָלָיו
  choice: bên cạnh ông
  alternative: bên cạnh nó
  rationale: Hậu tố Hê-bơ-rơ là ngôi thứ ba số ít giống đực và trong mạch văn gần có thể quy chiếu đến Ru-bên hoặc người đứng đầu vừa nêu; tuy nhiên cấu trúc bố trí trại cũng cho phép quy chiếu đến trại hay cờ hiệu. Bản dịch chính giữ quy chiếu hữu nhân, còn chú thích bảo lưu sự nhập nhằng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đóng trại”, “bộ tộc” và “người lãnh đạo” để diễn đạt rõ cơ cấu doanh trại; tên riêng được phiên âm nhất quán sang tiếng Việt.
