  text: And his company, even those numbered from it, was forty-six thousand five hundred.
translation:
  language: vi
  text: Lực lượng của chi tộc ấy, tức những người được kiểm kê, là 46.500 người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: quân ngũ của chi tộc ấy
  rationale: Trong bối cảnh kiểm kê và đóng trại của Dân Số, צָבָא chỉ lực lượng được tổ chức theo chi tộc. “Quân ngũ” giữ sắc thái quân sự và có phẩm cách, còn cụm “của chi tộc ấy” diễn đạt tự nhiên đại từ giống đực số ít theo quy chiếu trong ngữ cảnh.
- source_word: פְקֻדָיו
  choice: những người được kiểm kê
  rationale: Từ này bắt nguồn từ פקד trong nghĩa kiểm đếm, đăng bộ ở cuộc kiểm kê dân số; cách dịch này nêu rõ đây là những người đã được đếm mà không thu hẹp quá mức thành quân nhân chuyên nghiệp.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 46.500 người
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách ghi số chuẩn, dễ đọc trong tiếng Việt hiện đại; thêm “người” làm đơn vị đếm vốn được ngữ cảnh cung cấp.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “tức” để thể hiện quan hệ đồng vị giữa quân ngũ và những người được kiểm kê; tránh từ quá cổ như “đạo binh” và cách nói dễ gợi đơn vị quân đội hiện đại cụ thể như “sư đoàn”.
