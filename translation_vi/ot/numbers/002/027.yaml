  source_fidelity: 'Bản nháp chuyển đạt đúng các thành tố chính của câu: những người đóng trại, chi phái A-se, người đứng đầu, và tên Pha-ghi-ên con trai Óc-ran. Tuy nhiên, “họ” làm số ít của hậu tố עָלָיו trở thành số nhiều. Trong ngữ cảnh bố trí doanh trại, cách nói “bên cạnh đó” tự nhiên trong tiếng Việt và không gán sai số cho đại từ Hê-bơ-rơ.'
  naturalness: Câu sửa giữ văn phong hiện đại, trang trọng và cấu trúc liệt kê phù hợp với nguyên văn. “Người lãnh đạo con cháu A-se” tự nhiên hơn “thủ lĩnh của con cháu A-se” trong mệnh đề danh ngữ này.
  terminology: “Chi phái” là thuật ngữ Kinh Thánh Việt ngữ thông dụng và chính xác cho מַטֶּה trong ngữ cảnh tổ chức doanh trại. “Người lãnh đạo” phù hợp với נָשִׂיא, không áp đặt hàm ý quân chủ. Các tên riêng được giữ theo lối phiên âm nhất quán của bản nháp.
