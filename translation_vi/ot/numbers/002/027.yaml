base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: vi
  text: Những người đóng trại bên cạnh đó[a] là chi phái A-se; người lãnh đạo con cháu A-se là Pha-ghi-ên, con trai Óc-ran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ở bên cạnh đó”. Giới từ Hê-bơ-rơ tại đây chỉ vị trí kề bên trong cách bố trí doanh trại.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: Những người đóng trại
  rationale: Phân từ của חנה chỉ những người đang đóng trại; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sắc thái phân từ.
- source_word: עָלָיו
  choice: bên cạnh họ
  rationale: Trong bố cục doanh trại, עַל kèm đại từ hậu tố diễn tả vị trí ở bên hoặc sát cạnh. Đại từ số ít giống đực trong tiếng Hê-bơ-rơ quy chiếu đến đơn vị bộ tộc đã nói trước đó; tiếng Việt dùng “họ” tự nhiên hơn khi chỉ tập thể người.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong ngữ cảnh kiểm kê và sắp xếp doanh trại, מַטֶּה chỉ một bộ tộc, không phải cây gậy.
- source_word: אָשֵׁר
  choice: A-se
  rationale: Tên riêng được phiên âm theo cách đọc quen thuộc và dễ đọc trong tiếng Việt.
- source_word: נָשִׂיא
  choice: thủ lĩnh
  rationale: Trong sách Dân Số, נָשִׂיא là người đứng đầu được công nhận của một bộ tộc; “thủ lĩnh” chính xác, trang trọng và không gợi ý tước vị hoàng gia.
- source_word: לִבְנֵי אָשֵׁר
  choice: của con cháu A-se
  rationale: בני có nghĩa đen là “các con trai”, nhưng trong công thức bộ tộc ở đây chỉ những người thuộc dòng dõi A-se; “con cháu” chuyển tải thành ngữ huyết thống tự nhiên trong tiếng Việt.
- source_word: פַּגְעִיאֵל
  choice: Pha-ghi-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang dạng dễ đọc trong tiếng Việt.
- source_word: בֶּן עָכְרָן
  choice: con trai Óc-ran
  rationale: Giữ trực tiếp cấu trúc phụ hệ “con trai của” trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng dấu chấm phẩy để phản ánh hai thành phần song song của câu Hê-bơ-rơ, vốn thiếu động từ hữu hạn. Giữ tên bộ tộc A-se và phiên âm các tên riêng còn lại nhất quán theo lối Việt hóa.
