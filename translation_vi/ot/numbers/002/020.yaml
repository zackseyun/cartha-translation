base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: vi
  text: Bên cạnh người ấy là bộ tộc Ma-na-se[a]; người lãnh đạo con cháu Ma-na-se là Ga-ma-li-ên, con trai Phê-đa-xu-rơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Kế bên người ấy là bộ tộc Ma-na-se.” Cụm giới từ Hê-bơ-rơ chỉ vị trí liền kề trong cách bố trí trại quân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  choice: Kế bên người là
  rationale: Trong ngữ cảnh bố trí trại quân ở Dân Số 2, עַל với đại từ hậu tố chỉ vị trí liền kề, không chỉ quyền cai trị. Cách diễn đạt này tự nhiên và nêu rõ quan hệ không gian.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong ngữ cảnh kiểm kê và tổ chức trại quân, מַטֶּה chỉ đơn vị bộ tộc, không phải cây gậy theo nghĩa đen.
- source_word: מְנַשֶּׁה
  choice: Ma-na-se
  rationale: Tên riêng và tên bộ tộc được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: וְנָשִׂיא
  choice: người lãnh đạo
  rationale: נָשִׂיא ở đây là người đứng đầu được chỉ định của bộ tộc; “người lãnh đạo” rõ ràng, hiện đại và không gợi sai nghĩa hoàng tộc.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: con cháu Ma-na-se
  rationale: בְנֵי trong công thức phả hệ–bộ tộc chỉ những người thuộc dòng dõi Ma-na-se; “con cháu” tự nhiên trong tiếng Việt và truyền đạt quan hệ huyết thống đại diện.
- source_word: גַּמְלִיאֵל
  choice: Ga-ma-li-ên
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: בֶּן
  choice: con trai
  rationale: Giữ rõ quan hệ cha–con của cấu trúc phụ danh Hê-bơ-rơ.
- source_word: פְּדָהצוּר
  choice: Phê-đa-xu-rơ
  rationale: Phiên âm tên riêng sang tiếng Việt, đồng thời phản ánh các thành tố âm của tên Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bộ tộc” cho đơn vị tổ chức của Y-sơ-ra-ên; dùng “con cháu” để diễn đạt tự nhiên nhóm người thuộc dòng dõi Ma-na-se. Dấu chấm phẩy giúp phân tách hai mệnh đề phối hợp của câu Hê-bơ-rơ.
