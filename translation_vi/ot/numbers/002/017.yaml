id: NUM.2.17
reference: Numbers 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָסַ֧ע אֹֽהֶל מוֹעֵ֛ד מַחֲנֵ֥ה הַ/לְוִיִּ֖ם בְּ/ת֣וֹךְ הַֽ/מַּחֲנֹ֑ת כַּ/אֲשֶׁ֤ר יַחֲנוּ֙ כֵּ֣ן יִסָּ֔עוּ אִ֥ישׁ עַל יָד֖/וֹ לְ/דִגְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: vi
  text: Sau đó, Lều Hội Kiến sẽ lên đường cùng với trại người Lê-vi ở giữa các trại. Họ đóng trại thế nào thì sẽ lên đường thế ấy, mỗi người ở vị trí của mình[a], theo các ngọn cờ của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo vị trí của mình”; thành ngữ Hê-bơ-rơ theo nghĩa đen có yếu tố “tay/bên cạnh”, ở đây chỉ vị trí trong đội hình hành quân.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “theo các cờ hiệu của họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Sau đó ... sẽ lên đường
  rationale: Trong bối cảnh trại quân di chuyển, נָסַע chỉ việc nhổ trại và bắt đầu hành trình. “Lên đường” tự nhiên trong tiếng Việt; “Sau đó” thể hiện trình tự của đội hình hành quân.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Giữ hình ảnh cụ thể của אֹהֶל là “lều” và chức năng hội họp/gặp gỡ của מוֹעֵד, đồng thời dùng cách gọi trang trọng, quen thuộc trong Ngũ Kinh.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: trại người Lê-vi
  rationale: Diễn đạt trực tiếp cấu trúc sở hữu, xác định đây là trại của cộng đồng Lê-vi.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: ở giữa các trại
  rationale: בְּתוֹךְ ở đây nhấn mạnh vị trí trung tâm trong đội hình các trại, không chỉ đơn thuần là ở giữa theo nghĩa lẫn vào trong.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: Họ đóng trại thế nào thì sẽ lên đường thế ấy
  rationale: Giữ kết cấu đối ứng của tiếng Hê-bơ-rơ và hàm ý rằng thứ tự hành quân tương ứng với cách bố trí khi đóng trại.
- source_word: אִישׁ עַל יָדוֹ
  choice: mỗi người ở vị trí của mình
  rationale: אִישׁ có nghĩa phân phối là “mỗi người”; thành ngữ עַל יָדוֹ, theo nghĩa đen liên quan đến “tay/bên cạnh”, trong ngữ cảnh này chỉ vị trí được ấn định trong đội hình.
- source_word: לְדִגְלֵיהֶם
  choice: theo các ngọn cờ của họ
  rationale: דֶּגֶל là cờ hiệu đánh dấu và tổ chức các đơn vị chi phái; giới từ לְ ở đây phù hợp với ý hành quân theo sự phân chia dưới các cờ hiệu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp đối ứng “thế nào ... thế ấy” của nguyên văn; dùng “người Lê-vi” thay cho một thuật ngữ giáo phái. Các dấu chú thích được đặt đúng tại những cụm từ mà chú thích giải thích.
