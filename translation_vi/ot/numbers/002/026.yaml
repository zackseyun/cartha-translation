translation:
  language: vi
  text: Đạo quân của chi tộc ấy[a], tức những người được kiểm đếm[b], là 62.700 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “quân đội” hoặc “đạo binh”. Từ Hê-bơ-rơ צָבָא có thể chỉ một đạo quân hay lực lượng được tổ chức; trong bối cảnh kiểm kê và bố trí trại ở đây, từ này chỉ lực lượng của một chi tộc.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những người được kiểm đếm của họ.” Cụm này chỉ những người của chi tộc đã được ghi nhận trong cuộc kiểm kê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: quân ngũ của chi tộc ấy
  rationale: צָבָא có thể chỉ quân đội, đạo quân hoặc một lực lượng được tổ chức. Trong bối cảnh kiểm kê và bố trí trại quân ở Dân Số 1–2, “quân ngũ” diễn đạt tự nhiên lực lượng có tổ chức của chi tộc; đại từ số ít giống đực được làm rõ theo đối tượng ở văn cảnh trước.
- source_word: וּפְקֻדֵיהֶם
  choice: tức những người đã được kiểm đếm trong số họ
  rationale: Dạng từ gốc פקד ở đây nói đến những người thuộc nhóm đã được thống kê trong cuộc kiểm kê. “Đã được kiểm đếm” giữ sắc thái bị động và tránh biến cụm từ thành một danh từ tổng số đơn thuần.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 62.700 người
  rationale: Giữ đúng con số 62.700 và trình bày theo cách ghi số thông dụng trong tiếng Việt hiện đại; thêm “người” để câu tự nhiên và rõ đơn vị được đếm.
