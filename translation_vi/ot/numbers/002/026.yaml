  source_fidelity: Bản nháp truyền đạt đúng con số và nhìn chung hiểu đúng hai cụm danh từ Hê-bơ-rơ. Tuy nhiên, “quân ngũ” trong tiếng Việt hiện đại thường chỉ nếp sống/nghĩa vụ quân sự hơn là một đơn vị hay lực lượng, nên chưa tương ứng chính xác với צָבָא trong ngữ cảnh bố trí các đạo quân theo chi tộc. Cụm “trong số họ” cũng làm quan hệ đã rõ trong nguyên ngữ trở nên vòng vo.
  naturalness: Câu dễ hiểu, nhưng “quân ngũ của chi tộc ấy” không tự nhiên theo nghĩa một đoàn quân/contingent. “Đạo quân” là cách dùng trang trọng, hiện đại và phù hợp ngữ cảnh hơn. “Tức những người được kiểm đếm” gọn và rõ hơn “tức những người đã được kiểm đếm trong số họ.”
  terminology: Đổi “quân ngũ” thành “đạo quân” để diễn đạt צָבָא là lực lượng/đạo quân được tổ chức của chi tộc. Giữ “người được kiểm đếm” cho פְקֻדֵיהֶם, vì cụm này chỉ những người được ghi nhận trong cuộc kiểm kê, không chỉ một con số trừu tượng.
