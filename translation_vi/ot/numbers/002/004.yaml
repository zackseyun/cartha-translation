  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “quân đoàn” để giữ sắc thái tổ chức quân sự của bối cảnh; cấu trúc “tức…” làm rõ quan hệ giữa đơn vị và tổng số được kiểm đếm.
