  text: 'and his division[b][a], those numbered from them: seventy-four thousand six hundred.'
translation:
  language: vi
  text: 'Đạo quân của ông[a] gồm những người thuộc họ đã được kiểm kê[b]: 74.600 người.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quân đội của ông” hoặc “lực lượng của ông”. Từ Hê-bơ-rơ צָבָא có thể mang nghĩa quân sự; trong bối cảnh này, từ ấy chỉ lực lượng của bộ tộc được bố trí trong trại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những người được tập hợp để kiểm kê của họ” hoặc “những người đã được đăng bộ của họ”. Tiếng Hê-bơ-rơ dùng thuật ngữ chỉ việc kiểm kê hoặc đăng bộ; “họ” chỉ nhóm/bộ tộc liên hệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Quân đoàn của ông
  rationale: צָבָא có thể chỉ quân đội hoặc đạo quân; trong bối cảnh bố trí trại quân theo bộ tộc ở Dân Số 2, “quân đoàn” diễn đạt tự nhiên đơn vị được tổ chức dưới quyền thủ lĩnh mà vẫn giữ sắc thái quân sự.
- source_word: וּפְקֻדֵיהֶם
  choice: những người được kiểm đếm trong số họ
  rationale: Dạng từ פקד thuộc thuật ngữ kiểm kê dân số, chỉ những người được ghi nhận qua việc kiểm đếm. Cách dịch này giữ hậu tố số nhiều “họ” và không tự ý thu hẹp thành một cách gọi chuyên biệt hơn.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 74.600 người
  rationale: Chuyển đúng tổng số 74.600 sang cách ghi số quen thuộc trong tiếng Việt hiện đại; thêm “người” để câu tự nhiên và làm rõ đơn vị đếm theo ngữ cảnh.
