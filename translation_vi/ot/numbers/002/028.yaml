  text: 'And his company[b][a], those numbered from them: forty-one thousand five hundred.'
translation:
  language: vi
  text: Đoàn quân của ông[a], tức số người được kiểm kê của họ[b], là 41.500 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đạo quân” hoặc “đội quân”; từ Hê-bơ-rơ có thể chỉ một lực lượng quân sự hoặc một đơn vị có tổ chức trong cuộc kiểm kê tại trại.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “những người được đếm của họ” hoặc “những người được triệu tập trong số họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Quân ngũ của chi tộc ấy
  rationale: צָבָא trong bối cảnh kiểm kê và sắp xếp trại chỉ một lực lượng hay đơn vị có tổ chức. “Quân ngũ” giữ được sắc thái quân sự mà vẫn tự nhiên; hậu tố số ít giống đực được diễn đạt theo đối tượng quy chiếu trong văn cảnh là chi tộc.
- source_word: וּפְקֻדֵיהֶם
  choice: tức những người được kiểm kê trong số họ
  rationale: Cụm từ bắt nguồn từ פקד chỉ những người đã được đếm hoặc triệu tập trong cuộc kiểm kê. “Được kiểm kê” phù hợp văn cảnh dân số, còn “trong số họ” giữ hậu tố số nhiều của nguyên văn.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 41.500 người
  rationale: Con số Hê-bơ-rơ được chuyển sang cách ghi số thông dụng trong tiếng Việt hiện đại. Thêm “người” để câu tự nhiên và làm rõ đơn vị đếm vốn đã hiển nhiên trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu hai chấm của công thức kiểm kê được diễn đạt bằng “tức… là” để câu tự nhiên; mọi dấu chú thích đều có mặt trong chính văn.
