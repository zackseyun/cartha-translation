base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: vi
  text: Tổng số những người được kiểm kê của trại Ép-ra-im là 108.100, theo các đơn vị của họ.[a] Họ sẽ lên đường thứ ba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “theo các đoàn quân của họ” hoặc “theo các đạo quân của họ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: người được kiểm kê
  rationale: Động từ פקד ở thể bị động trong ngữ cảnh này chỉ những người đã được đếm và ghi nhận để phục vụ; “được kiểm kê” tự nhiên và vẫn giữ được sắc thái quân ngũ của cuộc kiểm tra dân số.
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: thuộc trại Ép-ra-im
  rationale: Giới từ לְ diễn tả quan hệ thuộc về nhóm đóng trại; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 108.100 người
  rationale: Giữ chính xác tổng số 108.100; thêm “người” để câu tiếng Việt đầy đủ và rõ ràng theo ngữ cảnh kiểm kê.
- source_word: לְצִבְאֹתָם
  choice: theo các đạo quân của họ
  rationale: צָבָא mang nghĩa đoàn quân hoặc lực lượng được tổ chức để phục vụ; “các đạo quân” bảo tồn sắc thái quân sự rõ hơn “các đơn vị”.
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: Họ sẽ lên đường thứ ba
  rationale: נסע trong ngữ cảnh thứ tự di chuyển của trại nghĩa là lên đường; שְׁלִשִׁים được hiểu theo nghĩa thứ tự là “thứ ba”.
