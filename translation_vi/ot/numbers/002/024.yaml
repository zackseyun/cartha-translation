translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ép-ra-im” theo lối phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt; giữ con số bằng chữ số để dễ đọc. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
