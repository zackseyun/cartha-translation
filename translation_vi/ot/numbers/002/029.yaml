  text: וּ/מַטֵּ֖ה נַפְתָּלִ֑י וְ/נָשִׂיא֙ לִ/בְנֵ֣י נַפְתָּלִ֔י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/029.yaml
  text: 'And the tribe of Naphtali[a], and the leader of the sons of Naphtali: Ahira son of Enan.'
translation:
  language: vi
  text: Kế đến là bộ tộc Nép-ta-li; người lãnh đạo con cháu Nép-ta-li là A-hi-ra, con trai Ê-nan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong bối cảnh sắp xếp trại quân ở Dân Số, từ này chỉ đơn vị bộ tộc, không phải cây gậy theo nghĩa đen.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Chỉ người đứng đầu được công nhận của bộ tộc; cách dịch này rõ ràng, hiện đại và không gợi hàm ý hoàng gia như “hoàng tử”.
- source_word: לִבְנֵי
  choice: con cháu
  rationale: בני là cách gọi quen thuộc dành cho thành viên hoặc hậu duệ của một tổ phụ; “con cháu” tự nhiên trong tiếng Việt và phù hợp nghĩa chỉ cộng đồng bộ tộc.
- source_word: נַפְתָּלִי
  choice: Nép-ta-li
  rationale: Phiên âm tên riêng và tên bộ tộc sang tiếng Việt.
- source_word: אֲחִירַע
  choice: A-hi-ra
  rationale: Phiên âm tên riêng sang tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Giữ đúng công thức phụ danh thông thường trong tiếng Hê-bơ-rơ.
- source_word: עֵינָן
  choice: Ê-nan
  rationale: Phiên âm tên riêng sang tiếng Việt.
theological_decisions: []
