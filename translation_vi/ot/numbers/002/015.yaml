  yaml_path: translation/ot/numbers/002/015.yaml
  text: 'and his company[b][a], even those numbered from them: forty-five thousand six hundred and fifty.'
translation:
  language: vi
  text: Đạo quân của ông[a], tức những người trong số họ đã được kiểm kê[b], có 45.650 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đội ngũ của ông” hoặc “lực lượng của ông”; từ Hê-bơ-rơ có thể chỉ một đơn vị quân sự có tổ chức.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những người trong số họ đã được triệu tập kiểm kê” hoặc “những người đã được ghi danh của họ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Đạo quân của ông
  rationale: צָבָא trong bối cảnh kiểm kê và bố trí trại quân chỉ một lực lượng có tổ chức thuộc bộ tộc. “Đạo quân” là cách diễn đạt tự nhiên, trang trọng và giữ được sắc thái quân sự của từ Hê-bơ-rơ.
- source_word: וּפְקֻדֵיהֶם
  choice: tức những người trong số họ đã được kiểm kê
  rationale: Dạng từ bắt nguồn từ פקד chỉ những người đã được ghi danh hoặc đếm trong cuộc kiểm kê. Cách dịch này giữ đại từ số nhiều “họ” và không thêm ý “nam giới” vốn không được nói rõ ngay trong mệnh đề.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 45.650 người
  rationale: Diễn đạt tự nhiên tổng số bốn mươi lăm nghìn sáu trăm năm mươi trong tiếng Việt; thêm “người” để làm rõ đơn vị đếm đã được hàm ý trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “tức…” thể hiện quan hệ giải thích giữa đạo quân và những người đã được kiểm kê; dấu chấm trong 45.650 theo quy ước phân tách hàng nghìn thông dụng trong tiếng Việt.
