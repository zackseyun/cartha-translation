  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה יְהוּדָ֗ה מְאַ֨ת אֶ֜לֶף וּ/שְׁמֹנִ֥ים אֶ֛לֶף וְ/שֵֽׁשֶׁת אֲלָפִ֥ים וְ/אַרְבַּע מֵא֖וֹת לְ/צִבְאֹתָ֑/ם רִאשֹׁנָ֖ה יִסָּֽעוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/009.yaml
  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: vi
  text: Tổng số người được kiểm kê thuộc trại Giu-đa là 186.400 người, theo các đạo quân của họ.[a] Họ sẽ lên đường trước.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “theo các đơn vị của họ” hoặc “theo các đoàn quân của họ”.
    reason: lexical_alternative
  - marker: b
    text: “Lên đường” trong bối cảnh này cũng có thể diễn đạt là “nhổ trại”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Tổng số người được kiểm kê
  rationale: Cụm này tổng kết tất cả những người đã được đếm trong cuộc kiểm kê; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sắc thái thụ động của הַפְּקֻדִים.
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: thuộc trại Giu-đa
  rationale: Tiền tố לְ biểu thị quan hệ với khối doanh trại mang tên Giu-đa; “thuộc trại” rõ nghĩa và tự nhiên.
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 186.400 người
  rationale: Giữ chính xác tổng số; dùng chữ số phù hợp với văn cảnh thống kê, và thêm “người” để câu tiếng Việt rõ ràng.
- source_word: לְצִבְאֹתָם
  choice: theo từng đạo quân của họ
  rationale: צָבָא ở đây chỉ các đơn vị được tổ chức để hành quân; “đạo quân” giữ được sắc thái quân sự của bối cảnh mà không hiện đại hóa thành cơ cấu quân đội cụ thể.
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: Họ sẽ lên đường trước
  rationale: נסע trong bối cảnh trại đóng nơi hoang mạc có nghĩa rời trại để tiếp tục hành trình; “lên đường trước” diễn đạt tự nhiên thứ tự hành quân.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm kê” cho ngữ cảnh thống kê dân số có tính quân sự; dùng “đạo quân” để bảo tồn sắc thái của צָבָא. Dấu chấm được dùng làm dấu phân cách hàng nghìn theo quy ước tiếng Việt.
