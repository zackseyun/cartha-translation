base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/007.yaml
  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: vi
  text: Chi tộc Sa-bu-lôn, và người lãnh đạo của con cháu Sa-bu-lôn[a] là Ê-li-áp, con trai Hê-lôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cho con cháu Sa-bu-lôn.” Giới từ Hê-bơ-rơ trong công thức hành chính về các chi tộc này có thể được hiểu theo những cách gần nghĩa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: chi tộc
  rationale: Trong bối cảnh sắp xếp doanh trại và kiểm kê dân số của sách Dân Số, từ này chỉ một đơn vị bộ tộc, không phải cây gậy; “chi tộc” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: זְבוּלֻן
  choice: Sa-bu-lôn
  rationale: Tên riêng của tổ phụ đồng thời là tên chi tộc; phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: וְנָשִׂיא
  choice: và người lãnh đạo
  rationale: Trong ngữ cảnh hành chính này, נָשִׂיא chỉ người đứng đầu được công nhận của chi tộc; “người lãnh đạo” rõ nghĩa hơn “hoàng tử” và không gợi sắc thái quân chủ không có trong văn cảnh.
- source_word: לִבְנֵי זְבוּלֻן
  choice: con cháu Sa-bu-lôn
  rationale: בני trong công thức bộ tộc chỉ những người thuộc dòng dõi Sa-bu-lôn. “Con cháu” vừa tự nhiên trong tiếng Việt, vừa giữ ý niệm huyết thống; giới từ ל có thể biểu thị quan hệ hoặc đối tượng phục vụ nên được ghi chú.
- source_word: אֱלִיאָב
  choice: Ê-li-áp
  rationale: Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: בֶּן חֵלֹן
  choice: con trai Hê-lôn
  rationale: Kết cấu phụ hệ Hê-bơ-rơ được chuyển trực tiếp và tự nhiên sang tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê của nguyên văn, đồng thời thêm “là” để câu tiếng Việt tự nhiên. Dùng “chi tộc” cho đơn vị bộ tộc và “con cháu” cho thành viên thuộc dòng dõi.
