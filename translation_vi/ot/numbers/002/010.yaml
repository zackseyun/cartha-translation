base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: vi
  text: Cờ hiệu của trại Ru-bên sẽ ở phía nam, theo các đạo quân của họ; người lãnh đạo của con cháu Ru-bên là Ê-li-xua, con trai Sê-đêu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: cờ hiệu
  rationale: Chỉ dấu hiệu nhận diện của đơn vị bộ tộc trong cách bố trí doanh trại; “cờ hiệu” tự nhiên và vẫn giữ sắc thái tổ chức-quân sự.
- source_word: מַחֲנֵה
  choice: trại
  rationale: Chỉ doanh trại có tổ chức của bộ tộc trong bối cảnh bố trí quanh Lều Hội Kiến.
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: תֵּימָנָה
  choice: ở phía nam
  rationale: Dạng chỉ hướng kèm hậu tố định hướng nói đến vị trí ở phía nam của doanh trại.
- source_word: לְצִבְאֹתָם
  choice: theo từng đạo quân của họ
  rationale: Giữ sắc thái quân sự và trật tự tổ chức của צבא trong Dân Số 1–2; “từng” diễn đạt sự phân chia thành các đơn vị.
- source_word: וְנָשִׂיא
  choice: người lãnh đạo
  rationale: Chỉ người đứng đầu được chỉ định của bộ tộc, tránh sắc thái quân chủ của “hoàng tử”.
- source_word: לִבְנֵי רְאוּבֵן
  choice: con cháu Ru-bên
  rationale: Cách nói tự nhiên trong tiếng Việt để chỉ cộng đồng hậu duệ/bộ tộc Ru-bên, thay vì dịch máy móc là “các con trai”.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Ê-li-xua, con trai Sê-đêu
  rationale: Phiên âm tên riêng và thể hiện trực tiếp quan hệ phụ tử của cấu trúc בן.
