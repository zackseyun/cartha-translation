  to: Cờ hiệu của trại Ru-bên sẽ ở phía nam, theo các đạo quân của họ; người lãnh đạo của con cháu Ru-bên là Ê-li-xua, con trai Sê-đêu.
  rationale: Chỉnh rất nhẹ để tránh thêm sắc thái «từng» ngoài nguyên ngữ và làm rõ rằng Ê-li-xua là người lãnh đạo của cộng đồng Ru-bên. Không cần chú thích vì các lựa chọn từ vựng trong bản dịch vẫn đủ rõ và không có điểm tranh chấp văn bản cần bảo lưu.
