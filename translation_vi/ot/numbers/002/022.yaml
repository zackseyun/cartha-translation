  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: vi
  text: Kế đến là bộ tộc Bên-gia-min; người lãnh đạo của con cháu Bên-gia-min[a] là A-bi-đan, con trai Ghi-đê-ô-ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «người lãnh đạo cho con cháu Bên-gia-min». Giới từ Hê-bơ-rơ ở đây có thể được dịch theo những cách gần nghĩa này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong ngữ cảnh bố trí trại quân của Dân Số Ký, từ này chỉ đơn vị bộ tộc, không phải cây gậy; “bộ tộc” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: בִּנְיָמִן
  choice: Bên-gia-min
  rationale: Tên riêng được phiên âm theo cách quen dùng trong tiếng Việt.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Chỉ người đứng đầu được công nhận của bộ tộc; cách dịch này rõ nghĩa, hiện đại và tránh hàm ý vương tước của “hoàng tử”.
- source_word: לִבְנֵי בִנְיָמִן
  choice: con cháu Bên-gia-min
  rationale: בני trong ngữ cảnh bộ tộc chỉ các hậu duệ hay thành viên thuộc dòng Bên-gia-min. Giới từ ל biểu thị quan hệ hoặc phạm vi trách nhiệm; tiếng Việt tự nhiên có thể diễn đạt là “người lãnh đạo con cháu Bên-gia-min”.
- source_word: אֲבִידָן
  choice: A-bi-đan
  rationale: Tên riêng được phiên âm sang tiếng Việt.
- source_word: בֶּן גִּדְעֹנִי
  choice: con trai Ghi-đê-ô-ni
  rationale: Cấu trúc phụ hệ Hê-bơ-rơ thông thường, được chuyển trực tiếp và tự nhiên sang tiếng Việt.
