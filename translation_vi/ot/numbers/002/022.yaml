translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Thêm “Kế đến là” để diễn đạt chức năng nối tiếp của וּ trong danh sách bố trí các bộ tộc. Dấu chấm phẩy giữ rõ hai thành phần song song của câu Hê-bơ-rơ.
