base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/008.yaml
  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: vi
  text: Đạo quân của ông[a], theo số kiểm kê[b], là 57.400 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đoàn quân”, “đạo binh” hoặc “đơn vị”; từ Hê-bơ-rơ צָבָא có thể chỉ một lực lượng hay đơn vị được tổ chức trong bối cảnh kiểm kê và bố trí doanh trại.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “những người được kiểm kê” hay “những người được điểm danh”; từ Hê-bơ-rơ chỉ những người được chính thức đăng ký, kiểm đếm trong cuộc kiểm kê.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Quân ngũ của chi tộc ấy
  rationale: צָבָא trong bối cảnh kiểm kê và sắp xếp doanh trại chỉ một lực lượng có tổ chức của chi tộc. “Quân ngũ” giữ sắc thái quân sự mà không gợi rằng họ đang trực tiếp giao chiến; “của chi tộc ấy” diễn đạt tự nhiên đại từ sở hữu giống đực số ít theo mạch văn.
- source_word: וּפְקֻדָיו
  choice: tức những người đã được kiểm đếm
  rationale: Dạng từ gốc פקד trong công thức kiểm kê chỉ những người đã được chính thức ghi nhận và đếm. “Tức” thể hiện quan hệ giải thích/đồng vị có thể có giữa quân ngũ và số người được kiểm đếm, thay vì chỉ cộng thêm một nhóm khác.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57.400 người
  rationale: Chuyển đúng tổng số 57.400 sang cách ghi số thông dụng trong tiếng Việt; thêm “người” để câu tự nhiên và làm rõ đơn vị đếm theo ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “chi tộc” theo bối cảnh tổ chức dân Y-sơ-ra-ên; giữ sắc thái quân sự của צָבָא và công thức kiểm kê của פקד, đồng thời tránh lối diễn đạt cổ hoặc quá sát trật tự từ Hê-bơ-rơ.
