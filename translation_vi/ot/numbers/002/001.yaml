id: NUM.2.1
reference: Numbers 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: YHWH, danh riêng của Đức Chúa Trời; ở đây được phiên âm là “Yahweh”.'
    reason: Giải thích dạng chữ Hê-bơ-rơ đứng sau cách phiên âm danh riêng trong chính văn.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức mở đầu lời phán của Đức Chúa Trời, “phán” là cách diễn đạt tiếng Việt tự nhiên, trang trọng và chính xác hơn “nói”, đồng thời đánh dấu một sự kiện mới trong mạch kể.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ thay vì thay bằng một tước hiệu; “Yahweh” là dạng phiên âm quen dùng trong nghiên cứu hiện đại.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: “Với” phù hợp tự nhiên với động từ “phán” trong tiếng Việt. Liên từ và hai đối tượng được giữ rõ, cho thấy cả Môi-se lẫn A-rôn đều là người nhận lời phán.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức này giới thiệu nội dung lời phán ở câu kế tiếp. “Rằng” cùng dấu hai chấm nối tự nhiên sang lời trực tiếp trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh Tứ Tự יהוה. Giữ “Yahweh” bảo tồn tính chất danh riêng và không thay danh ấy bằng một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong tiếng Việt là “Môi-se” và “A-rôn”; dùng “phán” theo quy ước tự nhiên dành cho lời Đức Chúa Trời. Dấu hai chấm báo trước nội dung lời phán ở câu tiếp theo.
