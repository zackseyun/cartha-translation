  - marker: a
    text: Cũng có thể dịch là “lực lượng của ông” hoặc “đội quân của ông”; từ Hê-bơ-rơ này có thể mang sắc thái quân sự, chỉ một đơn vị bộ tộc được tổ chức.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: và quân ngũ của ông
  rationale: צָבָא chỉ một lực lượng hay đơn vị được tổ chức và có sắc thái quân sự. Trong bối cảnh kiểm kê và bố trí trại quân ở Dân Số 2, “quân ngũ” vừa giữ được sắc thái ấy vừa không hàm ý họ đang trực tiếp giao chiến.
- source_word: וּפְקֻדֵיהֶם
  choice: tức những người trong số họ đã được kiểm đếm
  rationale: Từ này bắt nguồn từ פקד trong ngữ cảnh kiểm kê, chỉ những người đã được ghi nhận hoặc đếm. Đại từ số nhiều “họ” được giữ lại qua cụm “trong số họ”; “tức” diễn đạt quan hệ giải thích tự nhiên trong tiếng Việt.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: năm mươi ba nghìn bốn trăm
  rationale: Chuyển đúng tổng số sang trật tự số từ tự nhiên của tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quân ngũ” duy trì sắc thái tổ chức quân sự của nguyên ngữ; “kiểm đếm” phù hợp bối cảnh kiểm kê dân số. Thêm “người” sau tổng số để câu tiếng Việt tự nhiên và làm rõ đối tượng được đếm.
