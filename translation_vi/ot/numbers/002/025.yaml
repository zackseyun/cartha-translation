revisions:
- from: Ngọn cờ của trại quân Đan sẽ ở phía bắc, theo từng đạo quân của họ[a]. Người lãnh đạo con cháu Đan là A-hi-ê-xe, con trai A-mi-sa-đai.
  to: Cờ hiệu của trại quân Đan sẽ ở phía bắc, theo các đơn vị của họ[a]. Người lãnh đạo của con cháu Đan là A-hi-ê-xe, con trai A-mi-sa-đai.
  rationale: Bản sửa giữ nguyên cấu trúc và nghĩa của nguyên văn, đồng thời thay cách diễn đạt về các đơn vị tổ chức cho tự nhiên hơn trong tiếng Việt, làm rõ quan hệ “người lãnh đạo của con cháu Đan,” và dùng “cờ hiệu” để phản ánh chức năng của דֶּגֶל trong bối cảnh bố trí trại quân. Chú thích vẫn bảo lưu các khả năng dịch hợp lệ cho צְבָאֹתָם.
