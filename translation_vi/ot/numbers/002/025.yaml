base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: vi
  text: Cờ hiệu của trại quân Đan sẽ ở phía bắc, theo các đơn vị của họ[a]. Người lãnh đạo của con cháu Đan là A-hi-ê-xe, con trai A-mi-sa-đai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “theo từng đoàn quân của họ” hoặc “theo các đội ngũ của họ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: ngọn cờ
  rationale: Chỉ hiệu kỳ mà dưới đó trại quân của một chi tộc được sắp xếp; “ngọn cờ” rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: מַחֲנֵה
  choice: trại quân
  rationale: Trong bối cảnh Dân Số 2, từ này chỉ trại được tổ chức theo các chi tộc; “trại quân” vừa thể hiện nơi đóng trại vừa giữ sắc thái tổ chức.
- source_word: צָפֹנָה
  choice: ở phía bắc
  rationale: Dạng chỉ hướng ở đây diễn tả vị trí của trại so với Lều Hội Kiến, nên “ở phía bắc” tự nhiên và chính xác.
- source_word: לְצִבְאֹתָם
  choice: theo từng đạo quân của họ
  rationale: צָבָא chỉ các đơn vị có tổ chức mang tính quân đội. Cách dịch này giữ sắc thái quân sự và ý phân chia theo đơn vị; chú thích ghi nhận các khả năng khác.
- source_word: וְנָשִׂיא
  choice: người lãnh đạo
  rationale: Trong ngữ cảnh hành chính chi tộc, נָשִׂיא là người đứng đầu được công nhận; cách dịch này tránh sắc thái quân chủ không có trong nguyên văn.
- source_word: לִבְנֵי דָן
  choice: con cháu Đan
  rationale: בְּנֵי trong công thức chi tộc có thể chỉ các hậu duệ hoặc thành viên thuộc chi tộc, không nhất thiết chỉ những người con trai trực tiếp. “Con cháu Đan” tự nhiên và giữ quan hệ huyết thống của danh xưng.
- source_word: אֲחִיעֶזֶר
  choice: A-hi-ê-xe
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết dễ đọc đối với độc giả Việt.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: con trai A-mi-sa-đai
  rationale: Giữ rõ cấu trúc phụ hệ בֶּן và phiên âm tên riêng.
theological_decisions:
- issue: Phạm vi nghĩa của בְנֵי trong danh xưng chi tộc
  choice: con cháu Đan
  alternative: các con trai Đan
  rationale: Trong ngữ cảnh này, בְנֵי דָן là danh xưng tập thể cho chi tộc bắt nguồn từ Đan. “Con cháu” truyền đạt đúng quan hệ hậu duệ mà không giới hạn sai thành các con trai trực tiếp, đồng thời không đưa thêm lập trường giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sẽ ở” để phản ánh cấu trúc quy định về vị trí đóng trại; tên riêng được phiên âm nhất quán bằng dấu gạch nối.
