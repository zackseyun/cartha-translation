  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: vi
  text: Những người đóng trại ở phía đông, về hướng mặt trời mọc, đóng trại dưới cờ hiệu của trại Giu-đa, theo các đạo quân của họ; thủ lĩnh của con cháu Giu-đa là Na-ha-sôn, con trai Am-mi-na-đáp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: cờ hiệu
  rationale: Chỉ cờ hiệu nhận diện và đơn vị trại quân tập hợp dưới cờ; cách dịch này tự nhiên hơn trong tiếng Việt mà vẫn giữ hình ảnh cụ thể của nguyên văn.
- source_word: לְצִבְאֹתָם
  choice: theo các đạo quân của họ
  rationale: Giữ sắc thái tổ chức quân sự của צבא và ý nghĩa phân chia thành các đơn vị.
- source_word: נָשִׂיא
  choice: thủ lĩnh
  rationale: Diễn đạt người đứng đầu bộ tộc trong ngữ cảnh này, không hàm ý tước vị quân chủ.
- source_word: קֵדְמָה מִזְרָחָה
  choice: ở phía đông, về hướng mặt trời mọc
  rationale: Giữ cả hai cách xác định phương hướng có tính nhấn mạnh trong nguyên văn.
