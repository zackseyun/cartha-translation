  text: 'And his division[a], those numbered from them: forty thousand and five hundred.'
translation:
  language: vi
  text: 'Đoàn quân của ông, tức số người của họ đã được kiểm đếm[a]: 40.500.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “được ghi danh”. Từ Hê-bơ-rơ có thể chỉ những người được ghi danh hoặc kiểm đếm để phục vụ trong cuộc kiểm kê.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Đạo quân của ông
  rationale: Trong bối cảnh kiểm kê và sắp xếp trại quân, צָבָא chỉ lực lượng có tổ chức thuộc chi tộc dưới quyền người lãnh đạo; “đạo quân” giữ được sắc thái quân sự mà vẫn tự nhiên trong tiếng Việt.
- source_word: וּפְקֻדֵיהֶם
  choice: tức những người trong số họ đã được kiểm đếm
  rationale: Dạng từ פקד ở đây nói đến những người được ghi danh hoặc kiểm đếm trong cuộc kiểm kê. Cách dịch này giữ đại từ số nhiều “họ” và không thêm ý “nam giới” vốn không được nói rõ trong mệnh đề.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 40.500 người
  rationale: Diễn đạt số đếm theo lối viết hiện đại của tiếng Việt; thêm “người” để câu tự nhiên và làm rõ đơn vị đếm theo ngữ cảnh.
