source:
  edition: WLC
  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: vi
  text: Nhưng người Lê-vi không được kiểm đếm trong số con trai Y-sơ-ra-ên[a], như Yahweh đã truyền lệnh cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Y-sơ-ra-ên”; nguyên văn Hê-bơ-rơ là “các con trai của Y-sơ-ra-ên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: Nhưng người Lê-vi
  rationale: Liên từ וְ ở đây biểu thị sự tương phản với tổng số đã nêu trước đó; “Nhưng” diễn đạt tự nhiên mạch văn ấy. “Người Lê-vi” là cách gọi quen thuộc trong tiếng Việt.
- source_word: לֹא הָתְפָּקְדוּ
  choice: không được kiểm đếm
  rationale: Dạng hitpael của פקד trong bối cảnh kiểm tra dân số chỉ việc được ghi nhận và đếm; cách diễn đạt bị động phản ánh đúng hình thái và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בְּ/תוֹךְ
  choice: cùng với
  rationale: Trong ngữ cảnh này, cụm giới từ nói đến việc được kể vào chung một nhóm; “cùng với” tự nhiên hơn cách dịch sát “ở giữa”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ được hình ảnh trực tiếp của cụm Hê-bơ-rơ “các con trai/con cái của Y-sơ-ra-ên”, đồng thời là lối nói trang trọng và dễ hiểu; chú thích nêu cách dịch thành tên dân tộc.
- source_word: כַּ/אֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự phù hợp với mệnh lệnh đã ban trước đó; “đúng như” truyền đạt tự nhiên sắc thái này.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Thể hoàn thành chỉ mệnh lệnh được ban trước việc kiểm đếm; “đã truyền” thể hiện quan hệ thời gian ấy mà không cần cấu trúc quá nặng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Phiên âm danh riêng giao ước YHWH theo dạng quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: Dấu chỉ tân ngữ אֶת đi với tên riêng; động từ “truyền” trong tiếng Việt tự nhiên dùng bổ ngữ “cho Môi-se”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. Bản dịch giữ đây là danh riêng chứ không thay bằng “CHÚA”; “Đức Giê-hô-va” là hình thức quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt, dù “Yahweh/Gia-vê” gần với cách phục nguyên phát âm được nhiều học giả chấp nhận.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ sự tương phản của liên từ mở đầu, tính bị động của hành động kiểm đếm và thành ngữ Hê-bơ-rơ trong phần chính, kèm chú thích để nêu cách diễn đạt tự nhiên hơn.
