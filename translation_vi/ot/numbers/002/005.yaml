base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: vi
  text: Đóng trại bên cạnh đó là bộ tộc Y-sa-ca,[a] và người lãnh đạo của con cháu Y-sa-ca là Na-tha-na-ên, con trai Xu-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “con cháu Y-sa-ca.” Đây là cách gọi thông thường dành cho một bộ tộc, chỉ các hậu duệ hoặc thành viên thuộc Y-sa-ca, chứ không chỉ những người nam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: Đóng trại
  rationale: Phân từ được dùng như danh từ chỉ tập thể đang đóng trại; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được ý về tình trạng đóng quân.
- source_word: עָלָיו
  choice: bên cạnh họ
  rationale: Trong ngữ cảnh bố trí doanh trại, giới từ diễn tả vị trí kề bên nhóm quân vừa được nhắc đến. Đại từ số ít tiếng Hê-bơ-rơ quy chiếu đến đơn vị tập thể, nên tiếng Việt dùng “họ” tự nhiên hơn.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong ngữ cảnh kiểm kê và bố trí doanh trại, từ này chỉ bộ tộc, không phải cây gậy.
- source_word: יִשָּׂשכָר
  choice: Y-sa-ca
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Chỉ người đứng đầu được công nhận của bộ tộc; “người lãnh đạo” rõ nghĩa và tránh sắc thái vương quyền không có trong ngữ cảnh.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: con cháu Y-sa-ca
  rationale: Giữ hình ảnh huyết tộc của בְּנֵי nhưng diễn đạt tự nhiên, bao gồm cộng đồng hậu duệ chứ không chỉ các con trai trực hệ.
- source_word: נְתַנְאֵל
  choice: Na-tha-na-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt theo cách dễ đọc.
- source_word: בֶּן צוּעָר
  choice: con trai Xu-a
  rationale: Thể hiện chính xác cấu trúc phụ danh Hê-bơ-rơ; “con trai” giữ rõ giới tính được nêu trong nguyên văn.
