  to: Đóng trại bên cạnh đó là bộ tộc Y-sa-ca,[a] và người lãnh đạo của con cháu Y-sa-ca là Na-tha-na-ên, con trai Xu-a.
  rationale: Sửa “bên cạnh họ” thành “bên cạnh đó” để không thay đổi hậu tố số ít trong nguyên văn và để quy chiếu tự nhiên đến đơn vị bố trí doanh trại trong văn mạch. Thêm “của” để làm rõ rằng Na-tha-na-ên là người lãnh đạo đại diện cho con cháu Y-sa-ca. Không thay đổi nội dung hay mức độ xác định của nguyên văn.
