  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: nhóm đang đóng trại, chi phái Y-sa-ca, người đứng đầu của בני Y-sa-ca, và phụ danh Na-tha-na-ên, con trai Xu-a. Tuy nhiên, “họ” ở “bên cạnh họ” chuyển hậu tố số ít עָלָיו thành số nhiều và làm thay đổi điểm quy chiếu không cần thiết.'
