  text: and his company[a], even those numbered from them, was thirty-five thousand four hundred.
translation:
  language: vi
  text: Đạo quân của ông,[a] tức những người trong số họ đã được kiểm kê, là 35.400 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đội ngũ của ông” hoặc “lực lượng của ông”; từ Hê-bơ-rơ phản ánh cách các bộ tộc được tổ chức theo mô hình quân sự trong cuộc kiểm kê nơi hoang mạc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Quân ngũ của ông
  rationale: צָבָא chỉ một đạo quân, lực lượng hoặc đơn vị được tổ chức. Trong bối cảnh kiểm kê và bố trí trại quân ở Dân Số Ký 2, “quân ngũ” diễn đạt sắc thái tổ chức theo quân sự mà không nhất thiết hàm ý đang giao chiến.
- source_word: וּפְקֻדֵיהֶם
  choice: tức những người trong số họ đã được kiểm kê
  rationale: Từ פקד ở đây mang nghĩa những người đã được ghi danh, kiểm đếm trong cuộc kiểm kê. Đại từ số nhiều “họ” được giữ lại để phản ánh sát hậu tố tiếng Hê-bơ-rơ và nối với tổng số theo sau.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 35.400 người
  rationale: Giữ nguyên tổng số 35.400, trình bày theo cách ghi số tự nhiên và dễ đọc trong tiếng Việt hiện đại; thêm “người” để làm rõ đơn vị đếm.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Cấu trúc “tức…” thể hiện quan hệ giải thích của cụm kiểm kê; cách gọi “quân ngũ” giữ sắc thái quân sự của nguyên ngữ nhưng tránh nhấn quá mức đến hoạt động chiến đấu.
