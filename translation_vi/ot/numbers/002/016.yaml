  source_fidelity: Bản dịch truyền đạt đúng tổng số 151.450, mối liên hệ với trại Ru-bên, và vị trí xuất phát thứ hai. Tuy nhiên, “các đơn vị quân ngũ” không phải kết hợp từ tự nhiên trong tiếng Việt hiện đại; “các đoàn quân” diễn đạt sát יותר sắc thái tổ chức quân sự của לְצִבְאֹתָם mà không ấn định quy mô đơn vị.
