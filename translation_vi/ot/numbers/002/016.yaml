  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה רְאוּבֵ֗ן מְאַ֨ת אֶ֜לֶף וְ/אֶחָ֨ד וַ/חֲמִשִּׁ֥ים אֶ֛לֶף וְ/אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים לְ/צִבְאֹתָ֑/ם וּ/שְׁנִיִּ֖ם יִסָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: vi
  text: Tổng số người được kiểm kê thuộc trại Ru-bên là 151.450 người, theo các đoàn quân của họ.[a] Họ sẽ lên đường thứ hai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo các đạo quân của họ” hoặc “theo các đội ngũ của họ.”'
    reason: Từ צִבְאֹתָם có thể chỉ các đoàn quân, đạo quân hoặc các đội ngũ được tổ chức để hành quân.
  - marker: b
    text: 'Nguyên văn: “Và thứ hai, họ sẽ lên đường,” chỉ vị trí của trại này trong thứ tự hành quân.'
    reason: Ghi lại trật tự từ của nguyên văn và làm rõ rằng “thứ hai” nói về thứ tự xuất phát.
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Tổng số người được kiểm kê
  rationale: Diễn đạt tự nhiên ý nghĩa toàn bộ những người đã được ghi số trong cuộc kiểm kê; 'người' được dùng để câu tiếng Việt rõ nghĩa trong ngữ cảnh.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: thuộc trại Ru-bên
  rationale: Tiền tố לְ đánh dấu mối liên hệ với tập đoàn đóng trại; 'thuộc trại' tự nhiên và chính xác trong tiếng Việt.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 151.450 người
  rationale: Giữ nguyên tổng số chính xác của bản Hê-bơ-rơ; dùng dấu chấm phân cách hàng nghìn theo quy ước tiếng Việt hiện đại.
- source_word: לְצִבְאֹתָם
  choice: theo các đơn vị quân ngũ của họ
  rationale: צָבָא trong ngữ cảnh kiểm kê và thứ tự hành quân chỉ các đội ngũ có tổ chức; cách dịch này giữ sắc thái quân sự mà không ấn định quy mô cụ thể như 'đại đội' hay 'sư đoàn'.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: Họ sẽ lên đường thứ nhì
  rationale: Chuyển cấu trúc Hê-bơ-rơ sát nghĩa 'và thứ nhì họ sẽ lên đường' sang trật tự tiếng Việt tự nhiên, đồng thời giữ rõ vị trí thứ hai trong thứ tự hành quân.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ''kiểm kê'' phù hợp ngữ cảnh thống kê dân số/quân số; ''lên đường'' là cách nói tự nhiên cho נסע trong hành trình nơi hoang mạc. Tên riêng dùng dạng quen thuộc trong tiếng Việt: Ru-bên.'
