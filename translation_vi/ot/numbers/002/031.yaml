  yaml_path: translation/ot/numbers/002/031.yaml
  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: vi
  text: Tổng số người được kiểm kê thuộc trại quân Đan là 157.600. Họ sẽ lên đường sau cùng, theo các cờ hiệu của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dưới các ngọn cờ của họ.” Từ Hê-bơ-rơ chỉ cờ hiệu của bộ tộc hoặc các đơn vị tập hợp dưới những cờ hiệu ấy trong cách bố trí trại quân của Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Tổng số người được kiểm kê
  rationale: Cụm này chỉ toàn bộ những người đã được đăng ký và đếm trong cuộc kiểm kê dân số. Cách dịch này tự nhiên trong tiếng Việt, đồng thời giữ nghĩa bị động của הַפְּקֻדִים.
- source_word: לְמַחֲנֵה דָן
  choice: thuộc trại quân Đan
  rationale: Giới từ לְ diễn tả quan hệ với đơn vị trại quân; “thuộc” thể hiện rõ những người được kiểm kê nằm trong nhóm trại quân Đan.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '157.600'
  rationale: Giữ chính xác tổng số trong bản Hê-bơ-rơ và dùng quy ước viết số thông dụng trong tiếng Việt.
- source_word: לָאַחֲרֹנָה
  choice: sau cùng
  rationale: Trạng từ này chỉ vị trí cuối trong thứ tự hành quân; “sau cùng” vừa tự nhiên vừa giữ đúng ý nghĩa ngữ cảnh.
- source_word: יִסְעוּ
  choice: sẽ lên đường
  rationale: Trong bối cảnh hành trình nơi hoang mạc, נסע nói đến việc nhổ trại và bắt đầu di chuyển; “lên đường” truyền đạt rõ hành động mà không diễn giải quá mức.
- source_word: לְדִגְלֵיהֶם
  choice: theo các cờ hiệu của mình
  rationale: דֶּגֶל có thể chỉ cờ hiệu và cũng gắn với đơn vị được tổ chức dưới cờ ấy. “Theo các cờ hiệu” bảo tồn hình ảnh trại quân và sắc thái tổ chức của cụm từ.
theological_decisions: []
