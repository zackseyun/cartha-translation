  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm kê” cho bối cảnh thống kê dân số, “trại quân” cho cơ cấu đóng trại, và “cờ hiệu” để giữ hình ảnh tổ chức hành quân trong nguyên văn.
