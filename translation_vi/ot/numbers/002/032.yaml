revisions:
- from: Đó là những người được kiểm đếm trong con cháu Israel[a], theo gia tộc phụ hệ của họ. Tổng số người được kiểm đếm trong các trại quân, theo từng đạo quân của họ[b], là 603.550 người.
  to: Đó là những người nam được kiểm đếm trong con cháu Israel[a], theo gia tộc bên cha của họ. Tổng số những người được kiểm đếm trong các trại, theo từng đơn vị của họ[b], là 603.550 người.
  rationale: Sửa cách diễn đạt về "nhà cha" để sát nguyên văn và tự nhiên trong tiếng Việt; phân biệt "các trại" với các đơn vị tổ chức; và nêu rõ những người nam được thống kê theo bối cảnh quy định của cuộc kiểm tra dân số. Các dấu chú thích a và b đều được neo đúng trong chính văn.
