source:
  edition: WLC
  text: אֵ֛לֶּה פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל פְּקוּדֵ֤י הַֽ/מַּחֲנֹת֙ לְ/צִבְאֹתָ֔/ם שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: vi
  text: Đó là những người nam được kiểm đếm trong con cháu Israel[a], theo gia tộc bên cha của họ. Tổng số những người được kiểm đếm trong các trại, theo từng đơn vị của họ[b], là 603.550 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “dân Israel.” Nguyên văn: “các con trai Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “theo từng đạo quân của họ” hoặc “theo các đội ngũ của họ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: những người được kiểm đếm
  rationale: Dạng từ này chỉ những người đã được ghi nhận trong cuộc kiểm tra dân số nhằm tổ chức quân ngũ. Cách dịch này sát nghĩa mà không đưa từ 'nam giới' vào ngay chính từ vựng, dù ngữ cảnh xác định đối tượng là nam giới đủ tuổi phục vụ.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  rationale: Giữ sắc thái huyết thống của thành ngữ Hê-bơ-rơ nhưng tự nhiên hơn 'các con trai Israel' trong tiếng Việt hiện đại; cũng có thể hiểu là 'dân Israel'.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc phụ hệ của họ
  rationale: Diễn đạt rõ cơ cấu dòng tộc theo phía cha vốn hiển nhiên trong nguyên văn, đồng thời phù hợp văn cảnh kiểm tra dân số.
- source_word: הַמַּחֲנֹת
  choice: các trại quân
  rationale: Chỉ các đơn vị đóng trại của các bộ tộc quanh Đền Tạm; 'trại quân' truyền đạt cả ý đóng trại lẫn tổ chức mang tính quân sự.
- source_word: לְצִבְאֹתָם
  choice: theo từng đạo quân của họ
  rationale: צְבָאוֹת chỉ các lực lượng hay đội ngũ được tổ chức. 'Đạo quân' giữ sắc thái quân sự của cuộc kiểm tra dân số, trong khi chú thích ghi nhận cách hiểu nhẹ hơn là 'đơn vị'.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: '603.550'
  rationale: Dùng chữ số và dấu phân cách hàng nghìn theo thông lệ tiếng Việt hiện đại, giúp tổng số dài dễ nhận biết mà vẫn biểu đạt chính xác 603.550.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính trong cuộc kiểm tra dân số
  choice: Dùng 'những người được kiểm đếm'; ngữ cảnh các chương 1–2 xác định họ là nam giới đủ điều kiện phục vụ quân ngũ
  alternative: Dịch trực tiếp là 'những người nam được kiểm đếm'
  rationale: Trong câu này không có một danh từ riêng mang nghĩa 'nam giới'; vì vậy bản dịch không thêm giới tính vào cụm từ, nhưng cũng không trung tính hóa bối cảnh quân dịch đã được xác định rõ ở phần trước.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng 'gia tộc phụ hệ' để làm rõ cơ cấu theo nhà cha; dùng 'trại quân' và 'đạo quân' nhằm giữ sắc thái tổ chức quân ngũ của văn cảnh. Mọi dấu chú thích đều xuất hiện trong chính văn.
