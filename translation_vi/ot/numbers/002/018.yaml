id: NUM.2.18
reference: Numbers 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה אֶפְרַ֛יִם לְ/צִבְאֹתָ֖/ם יָ֑מָּ/ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י אֶפְרַ֔יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: vi
  text: Cờ hiệu của trại Ép-ra-im[a], theo từng đơn vị của họ[b], sẽ ở phía tây[c]. Thủ lĩnh của con cháu Ép-ra-im là Ê-li-sa-ma, con trai A-mi-hút.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngọn cờ” hoặc “cờ quân” cho “cờ hiệu”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “theo các đạo quân của họ”. Tiếng Hê-bơ-rơ hàm ý một cơ cấu quân sự được tổ chức theo trật tự.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hê-bơ-rơ là “về phía biển”, một cách nói chỉ hướng tây.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: cờ hiệu
  rationale: Chỉ dấu hiệu nhận biết của một trại quân hay bộ tộc. “Cờ hiệu” tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái tổ chức của ngữ cảnh.
- source_word: מַחֲנֵה
  choice: trại
  rationale: Chỉ trại và đội hình đóng trại của bộ tộc; “trại” ngắn gọn, rõ nghĩa trong văn cảnh.
- source_word: לְצִבְאֹתָם
  choice: theo từng đơn vị của họ
  rationale: צָבָא ở đây mang nghĩa tổ chức, biên chế có trật tự. Cách dịch này tránh hàm ý rằng họ đang trực tiếp giao chiến.
- source_word: יָמָּה
  choice: ở phía tây
  rationale: Trạng từ chỉ hướng có nghĩa đen là “về phía biển”, nhưng theo cách định hướng của người Y-sơ-ra-ên thì chỉ phía tây; công thức của chương này nói về vị trí đóng trại.
- source_word: וְנָשִׂיא
  choice: thủ lĩnh
  rationale: נָשִׂיא chỉ người đứng đầu bộ tộc. “Thủ lĩnh” diễn đạt rõ vai trò mà không gợi ý địa vị hoàng tộc như “hoàng tử”.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: của con cháu Ép-ra-im
  rationale: “Con cháu Ép-ra-im” là cách gọi theo dòng dõi dành cho người thuộc bộ tộc Ép-ra-im, đồng thời tự nhiên hơn “các con trai Ép-ra-im” trong tiếng Việt.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Ê-li-sa-ma, con trai A-mi-hút
  rationale: Các tên riêng được phiên âm theo lối quen dùng trong tiếng Việt; בֶּן được dịch trực tiếp là “con trai”.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, câu văn rõ và dễ đọc. Dùng “con cháu Ép-ra-im” như tên gọi bộ tộc, giữ ý niệm dòng dõi mà không tạo cảm giác chỉ nói đến các con trai trực hệ. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
