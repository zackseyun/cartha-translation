source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: vi
  text: 'Dân Israel đã làm theo mọi điều Yahweh truyền cho Môi-se: họ đóng trại theo các cờ hiệu của mình, và cũng lên đường như thế, mỗi người theo thị tộc mình, theo nhà tổ phụ mình.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ בְּנֵי יִשְׂרָאֵל
  choice: Dân Israel làm
  rationale: Cụm בְּנֵי יִשְׂרָאֵל theo nghĩa đen là “các con trai của Israel”, nhưng trong văn cảnh chỉ toàn thể dân tộc; “Dân Israel” là cách diễn đạt tự nhiên, chính xác và bao quát trong tiếng Việt.
- source_word: כְּכֹל אֲשֶׁר
  choice: đúng mọi điều
  rationale: Diễn đạt cả ý tương ứng và tính toàn diện của cấu trúc Hê-bơ-rơ, đồng thời tự nhiên hơn lối dịch sát chữ “theo tất cả những gì”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: כֵּן חָנוּ לְדִגְלֵיהֶם וְכֵן נָסָעוּ
  choice: Họ đóng trại theo từng ngọn cờ của mình, và họ cũng lên đường như vậy
  rationale: Giữ sự lặp lại tương ứng của כֵּן ... וְכֵן, đồng thời thể hiện דֶּגֶל là cờ hiệu dùng để tổ chức các đơn vị trại quân.
- source_word: אִישׁ לְמִשְׁפְּחֹתָיו
  choice: mỗi người theo thị tộc mình
  rationale: אִישׁ có chức năng phân phối là “mỗi người”; מִשְׁפָּחָה trong ngữ cảnh tổ chức bộ tộc chỉ nhóm họ hàng lớn hơn gia đình hạt nhân, nên dịch là “thị tộc”.
- source_word: עַל בֵּית אֲבֹתָיו
  choice: theo gia tộc tổ tiên mình
  rationale: בֵּית אָבוֹת là đơn vị thân tộc theo dòng cha; “gia tộc tổ tiên” truyền đạt ý cơ cấu gia tộc mà không tạo cảm giác chỉ nói đến một hộ gia đình.
theological_decisions:
- issue: Cách chuyển dịch danh YHWH (יְהוָה)
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ đây là danh riêng thay vì thay bằng tước hiệu. “Đức Giê-hô-va” là dạng danh xưng trang trọng, dễ nhận biết trong tiếng Việt; cách phát âm nguyên thủy không hoàn toàn chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu thứ hai duy trì sự song song giữa việc đóng trại và lên đường; các thuật ngữ “thị tộc” và “gia tộc tổ tiên” phân biệt tương đối hai cấp tổ chức thân tộc trong nguyên văn.
