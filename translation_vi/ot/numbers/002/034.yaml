revisions:
- from: Dân Israel làm đúng mọi điều Đức Giê-hô-va đã truyền cho Môi-se. Họ đóng trại theo từng ngọn cờ của mình, và họ cũng lên đường như vậy, mỗi người theo thị tộc mình, theo gia tộc tổ tiên mình.
  to: 'Dân Israel đã làm theo mọi điều Yahweh truyền cho Môi-se: họ đóng trại theo các cờ hiệu của mình, và cũng lên đường như thế, mỗi người theo thị tộc mình, theo nhà tổ phụ mình.'
