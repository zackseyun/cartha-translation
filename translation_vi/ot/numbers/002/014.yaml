base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/014.yaml
  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
translation:
  language: vi
  text: Và chi tộc Gát; người lãnh đạo của con cháu Gát là Ê-li-a-sáp, con trai Rê-u-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay hoặc các đoạn song song ghi tên người cha là Đê-u-ên (xem Dân Số 1:14).
    reason: textual_variant
lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: Cùng với chi tộc
  rationale: Trong bối cảnh sắp xếp trại quân, מַטֶּה chỉ một chi tộc; liên từ וְ nối câu này với danh sách và được diễn đạt tự nhiên là “Cùng với”.
- source_word: גָּד
  choice: Gát
  rationale: Phiên âm tên chi tộc theo cách đọc quen thuộc trong tiếng Việt.
- source_word: וְ/נָשִׂיא
  choice: thủ lĩnh
  rationale: נָשִׂיא ở đây là người đứng đầu được công nhận của chi tộc; “thủ lĩnh” rõ nghĩa và phù hợp văn cảnh hành chính.
- source_word: לִ/בְנֵי גָד
  choice: của con cháu Gát
  rationale: בְּנֵי trong công thức chỉ cộng đồng hậu duệ của Gát; “con cháu” tự nhiên hơn “các con trai” trong tiếng Việt mà vẫn giữ quan hệ dòng tộc.
- source_word: אֶלְיָסָף
  choice: Ê-li-a-sáp
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Cách diễn đạt trực tiếp của công thức phụ danh.
- source_word: רְעוּאֵל
  choice: Rê-u-ên
  rationale: Theo bản WLC tại câu này, văn bản Masoret đọc רְעוּאֵל; không đồng nhất hóa với tên Đê-u-ên ở Dân Số 1:14.
