lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: và đạo quân của ông
  rationale: צָבָא chỉ một lực lượng được tổ chức theo chi tộc trong cách bố trí doanh trại; “đạo quân” giữ sắc thái quân sự tự nhiên trong tiếng Việt. Liên từ וּ được dịch là “và”, còn hậu tố ngôi ba số ít giống đực là “của ông”, quy chiếu về người lãnh đạo vừa được nêu trong ngữ cảnh.
- source_word: וּפְקֻדָיו
  choice: cùng những người được kiểm đếm trong đó
  rationale: Dạng từ bắt nguồn từ פקד nói đến những người đã được kiểm kê trong cuộc điều tra dân số. “Được kiểm đếm” giữ sắc thái thụ động và ý nghĩa thống kê; “trong đó” liên kết nhóm người này với đạo quân vừa nói đến. “Cùng” thể hiện liên từ thứ hai mà vẫn tránh lối lặp “và… và…” thiếu tự nhiên.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: năm mươi bốn nghìn bốn trăm người
  rationale: Con số được chuyển sang trật tự số từ tự nhiên của tiếng Việt và giữ nguyên chính xác tổng số 54.400. Thêm “người” để câu tiếng Việt rõ và tự nhiên.
