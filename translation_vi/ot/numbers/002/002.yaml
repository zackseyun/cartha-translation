  - severity: medium
    issue: “Lều Hội Kiến” không phải cách dịch trực tiếp, minh bạch của אֹהֶל מוֹעֵד
    rationale: מוֹעֵד ở đây là sự gặp gỡ/điểm hẹn được ấn định. “Lều Gặp Gỡ” phản ánh cụm từ nguồn rõ hơn; chú thích hiện có cũng đã thừa nhận cách này là sát tiếng Hê-bơ-rơ.
  - severity: low
