- from: Con cái Y-sơ-ra-ên[b] phải đóng trại, mỗi người dưới cờ hiệu[a] của mình, theo các dấu hiệu của nhà tổ phụ họ. Họ phải đóng trại đối diện Lều Hội Kiến[c], chung quanh lều ấy.
