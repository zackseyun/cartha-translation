  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: vi
  text: Con cái Y-sơ-ra-ên[b] phải đóng trại, mỗi người bên cờ hiệu[a] của mình, theo các dấu hiệu của nhà tổ phụ của họ. Họ phải đóng trại đối diện Lều Gặp Gỡ[c], chung quanh lều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cờ” hoặc “quân kỳ”. Từ Hê-bơ-rơ chỉ cờ dùng để nhận diện một bộ tộc hay đơn vị quân đội.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “dân Y-sơ-ra-ên”. Cách dịch “Con cái Y-sơ-ra-ên” giữ thành ngữ thân tộc của tiếng Hê-bơ-rơ.
    reason: lexical_alternative
  - marker: c
    text: Cách dịch truyền thống khác là “Đền Tạm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mỗi người
  rationale: Danh từ số ít được dùng theo nghĩa phân phối, chỉ từng người trong cộng đồng; “mỗi người” là cách diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ rõ ý phân phối.
- source_word: דִּגְלוֹ
  choice: dưới cờ hiệu của mình
  rationale: דֶּגֶל là cờ nhận diện của một đơn vị bộ tộc hoặc quân đội. “Cờ hiệu” vừa tự nhiên vừa thể hiện chức năng nhận diện; “dưới” diễn tả vị trí quy tụ theo cờ.
- source_word: בְאֹתֹת
  choice: theo các dấu hiệu
  rationale: אוֹת chỉ những dấu hoặc biểu hiệu nhận diện. “Theo” diễn đạt quan hệ sắp xếp phù hợp với ngữ cảnh mà không xác định quá mức hình dạng của các dấu ấy.
- source_word: לְבֵית אֲבֹתָם
  choice: của nhà tổ phụ họ
  rationale: Cụm từ chỉ đơn vị thân tộc được tổ chức theo dòng cha. “Nhà tổ phụ” giữ được hình ảnh xã hội-thân tộc của nguyên văn và vẫn dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
- source_word: יַחֲנוּ
  choice: phải đóng trại
  rationale: Dạng vị hoàn trong ngữ cảnh mệnh lệnh chỉ sự sắp đặt bắt buộc; “phải đóng trại” truyền đạt rõ lực chỉ thị.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Con cái Y-sơ-ra-ên
  rationale: Cách dịch này giữ thành ngữ thân tộc của tiếng Hê-bơ-rơ; chú thích cung cấp cách gọi cộng đồng tự nhiên hơn là “dân Y-sơ-ra-ên”.
- source_word: מִנֶּגֶד
  choice: đối diện
  rationale: Từ này chỉ vị trí ở phía đối diện hoặc phía trước; “đối diện” bảo tồn quan hệ không gian mà không suy diễn khoảng cách.
- source_word: סָבִיב
  choice: chung quanh lều ấy
  rationale: Trạng từ diễn tả việc bao quanh mọi phía. Bổ sung “lều ấy” làm rõ đối tượng quy chiếu tự nhiên trong tiếng Việt.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Dịch trực tiếp cấu tạo của cụm từ Hê-bơ-rơ, chỉ chiếc lều dành cho sự gặp gỡ, thay vì dùng một thuật ngữ truyền thống kém minh bạch hơn.
theological_decisions:
- issue: Ngôn ngữ thân tộc chỉ cộng đồng giao ước
  choice: Con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Giữ hình ảnh con cháu phát xuất từ tổ phụ Y-sơ-ra-ên trong בְּנֵי יִשְׂרָאֵל, đồng thời ghi nhận cách diễn đạt cộng đồng tự nhiên hơn trong chú thích.
- issue: Tên gọi nơi thánh
  choice: Lều Hội Kiến
  alternative: Đền Tạm; lều gặp gỡ
  rationale: “Lều Hội Kiến” chuyển tải trực tiếp אֹהֶל מוֹעֵד và tránh đưa vào những liên tưởng kiến trúc hoặc truyền thống không nằm sẵn trong cụm từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ các thành ngữ thân tộc và bố cục không gian của nguyên văn, nhưng dùng cú pháp tiếng Việt tự nhiên. Tên riêng “Y-sơ-ra-ên” và thuật ngữ “Lều Hội Kiến” theo lối phiên âm, thuật ngữ quen thuộc trong văn phong Kinh Thánh tiếng Việt.
