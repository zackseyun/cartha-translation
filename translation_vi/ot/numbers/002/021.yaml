  text: 'and his division[a], those numbered from them: thirty-two thousand two hundred.'
translation:
  language: vi
  text: Lực lượng của ông[a], tức số người của họ đã được kiểm kê, có 32.200 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đạo quân của ông” hoặc “quân ngũ của ông”; từ Hê-bơ-rơ צָבָא ở đây chỉ lực lượng của bộ tộc được tổ chức để đóng trại và hành quân.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Quân ngũ của ông
  rationale: צָבָא trong bối cảnh bố trí trại quân và thứ tự hành quân ở Dân Số 2 chỉ lực lượng có tổ chức của bộ tộc dưới quyền người lãnh đạo vừa được nêu. “Quân ngũ” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái quân sự-tổ chức mà không nhất thiết hàm ý đang giao chiến.
- source_word: וּפְקֻדֵיהֶם
  choice: những người đã được kiểm kê trong số họ
  rationale: Dạng từ פקד ở đây chỉ những người đã được đếm hoặc đăng bộ. Cách dịch này giữ hậu tố số nhiều “họ” và cho thấy con số tiếp theo là tổng số người được kiểm kê.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: 32.200 người
  rationale: Diễn đạt số đếm theo trật tự tự nhiên của tiếng Việt; thêm “người” để đơn vị đếm rõ ràng và câu văn trôi chảy.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “quân ngũ” để phản ánh bối cảnh tổ chức các đơn vị trong trại; giữ rõ cấu trúc kiểm kê và tổng số.
