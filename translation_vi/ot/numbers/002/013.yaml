  text: 'and his division, those numbered from them: fifty-nine thousand three hundred.'
translation:
  language: vi
  text: 'cùng đội quân của ông, tức những người đã được kiểm đếm trong số họ: 59.300 người.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: cùng đội quân của ông
  rationale: Trong bối cảnh kiểm kê và bố trí trại, צָבָא chỉ lực lượng quân sự thuộc chi tộc. “Đội quân” tự nhiên, rõ nghĩa và giữ đại từ giống đực số ít “của ông”, quy chiếu về người lãnh đạo vừa được nêu.
- source_word: וּפְקֻדֵיהֶם
  choice: tức những người đã được kiểm đếm trong số họ
  rationale: Dạng từ פקד ở đây chỉ những người được đếm trong cuộc kiểm kê. “Đã được kiểm đếm” giữ sắc thái thụ động; “tức” diễn đạt tự nhiên quan hệ giải thích/đồng vị trong câu, còn “trong số họ” phản ánh hậu tố số nhiều.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: 59.300 người
  rationale: Chuyển trật tự số Hê-bơ-rơ theo cách diễn đạt và ghi số thông dụng trong tiếng Việt, giữ chính xác tổng số 59.300. Thêm “người” để đơn vị đếm rõ ràng và tự nhiên theo ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đội quân” để thể hiện bối cảnh tổ chức quân sự; dùng dấu chấm phân cách hàng nghìn theo quy ước tiếng Việt.
