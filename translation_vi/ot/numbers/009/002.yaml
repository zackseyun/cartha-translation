  text: וְ/יַעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת הַ/פָּ֖סַח בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: vi
  text: Và con dân Israel phải giữ lễ Vượt Qua đúng kỳ đã định.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “các con trai của Israel”; cũng có thể dịch: “người Israel” hoặc theo cách truyền thống: “con cái Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: Và ... phải giữ
  rationale: Động từ עשה theo nghĩa đen là “làm”, nhưng khi đi với פֶּסַח thì mang nghĩa thành ngữ là cử hành hoặc giữ lễ Vượt Qua. Dạng liên hợp với waw và thể chưa hoàn thành trong văn cảnh có sắc thái mệnh lệnh; “phải giữ” diễn đạt tự nhiên và rõ lực truyền lệnh trong tiếng Việt.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Israel”. “Con dân Israel” giữ được hình ảnh cộng đồng có quan hệ nguồn gốc với Israel, đồng thời tự nhiên và bao quát trong tiếng Việt hiện đại; chú thích ghi lại nghĩa sát chữ.
- source_word: הַפָּסַח
  choice: lễ Vượt Qua
  rationale: פֶּסַח có thể chỉ nghi lễ, sinh tế hoặc kỳ lễ Vượt Qua nói chung. “Lễ Vượt Qua” đủ rộng cho văn cảnh này và không thu hẹp nghĩa thành riêng sinh tế.
- source_word: בְּמוֹעֲדוֹ
  choice: đúng kỳ đã định
  rationale: מוֹעֵד chỉ thời điểm hay kỳ được ấn định; hậu tố ngôi ba số ít quy chiếu về lễ Vượt Qua. “Đúng kỳ đã định” chuyển tải cả tính sở thuộc theo văn cảnh lẫn yêu cầu chính xác về lịch.
theological_decisions: []
