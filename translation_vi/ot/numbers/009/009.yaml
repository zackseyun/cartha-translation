base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Bấy giờ Yahweh[a] phán với Môi-se:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Nêu dạng nguyên ngữ và cách dịch truyền thống của danh Yahweh; mỏ neo được chuyển đến đúng từ được chú thích.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ, ... phán
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên sắc thái tuần tự. “Phán” phù hợp với lời Đức Chúa Trời nói trong văn phong Kinh Thánh trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng danh xưng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Trong cấu trúc דִּבֵּר אֶל, tiếng Việt tự nhiên dùng “phán với”; “Môi-se” là dạng tên quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: dấu hai chấm
  rationale: Công thức Hê-bơ-rơ này giới thiệu nội dung lời phán ở phần tiếp theo. Trong tiếng Việt hiện đại, dấu hai chấm chuyển tải chức năng ấy tự nhiên hơn cách dịch sát “rằng rằng” hoặc “mà rằng”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Giữ “Yahweh” phân biệt danh riêng này với các tước hiệu và tránh thay thế bằng một cách đọc truyền thống.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời; dùng dấu hai chấm để mở lời trực tiếp tiếp nối ở câu sau. Dấu chú thích [a] được đặt ngay sau “Môi-se” theo dữ liệu tham chiếu, dù nội dung chú thích thực chất giải thích danh “Yahweh”.
