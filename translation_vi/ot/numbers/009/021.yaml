language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: vi
  text: Có khi đám mây ở lại từ chiều tối đến sáng; vào buổi sáng, khi đám mây được cất lên[a], họ lên đường. Hoặc nếu đám mây ở lại một ngày một đêm, thì khi đám mây được cất lên, họ lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi đám mây lên.” Động từ Hê-bơ-rơ có thể diễn tả việc đám mây đi lên; “được cất lên” làm rõ việc đám mây được nhấc đi như dấu hiệu để họ lên đường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Có khi
  rationale: Thành ngữ này nêu một trường hợp thỉnh thoảng xảy ra trong khuôn mẫu đã nói ở trước; “Có khi” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: יִהְיֶה הֶעָנָן
  choice: đám mây ở lại
  rationale: Động từ היה cơ bản có nghĩa là “có/ở”, nhưng khi đi với khoảng thời gian từ chiều tối đến sáng, nó diễn tả sự hiện diện kéo dài; “ở lại” truyền đạt sắc thái ấy mà không diễn giải quá mức.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: từ chiều tối đến sáng
  rationale: Cách diễn đạt thời gian trực tiếp, tự nhiên; “chiều tối” phân biệt עֶרֶב với ban chiều nói chung.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: khi đám mây được cất lên
  rationale: Trong bối cảnh hành trình, עלה chỉ việc đám mây rời khỏi phía trên Đền Tạm, làm tín hiệu để dân ra đi. “Được cất lên” giữ được hình thái gần thụ động của tiếng Hê-bơ-rơ; chú thích bảo lưu cách hiểu đám mây tự bay/lên cao.
- source_word: בַּבֹּקֶר
  choice: sáng hôm sau
  rationale: Nguyên văn là “vào buổi sáng”; trong tiếng Việt, “sáng hôm sau” thể hiện tự nhiên mối liên hệ với “từ chiều tối đến sáng” mà không thay đổi trình tự thời gian.
- source_word: וְנָסָעוּ
  choice: họ lên đường
  rationale: Trong ngữ cảnh dân Y-sơ-ra-ên di chuyển trong hoang mạc, נסע nói đến việc rời nơi đóng trại để tiếp tục hành trình; “lên đường” rõ ràng và tự nhiên.
- source_word: אוֹ
  choice: Hoặc nếu
  rationale: Từ này mở đầu một trường hợp thay thế song song; thêm “nếu” làm rõ cấu trúc điều kiện vốn được hàm ý trong câu.
- source_word: יוֹמָם וָלַיְלָה
  choice: một ngày một đêm
  rationale: Trong cấu trúc rút gọn của câu, cụm này chỉ khoảng thời gian đám mây ở lại. “Một ngày một đêm” tự nhiên hơn “ban ngày và ban đêm” và không thêm ý “trọn đủ” vốn không được nói rõ.
theological_decisions:
- issue: Tác nhân khiến đám mây cất lên
  choice: Dùng “được cất lên” trong chính văn nhưng không nêu đích danh tác nhân.
  alternative: “đám mây bay lên” hoặc “đám mây cất lên”.
  rationale: Hình thái Nifal có thể được hiểu theo sắc thái thụ động hoặc chỉ việc đám mây đi lên. Bản dịch không xác định rõ Đức Chúa Trời là tác nhân ngữ pháp, đồng thời chú thích giữ lại cách dịch không có tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đám mây”, “ở lại”, “lên đường” là các cách nói phổ thông; giữ nhịp lặp của nguyên văn để nhấn mạnh rằng việc đám mây cất lên là tín hiệu khởi hành.
