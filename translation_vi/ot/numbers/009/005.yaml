language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: vi
  text: Vậy, các con trai Y-sơ-ra-ên đã cử hành lễ Vượt Qua vào tháng thứ nhất, ngày mười bốn của tháng, lúc chạng vạng[a], trong hoang mạc Si-nai. Họ đã làm như vậy, theo mọi điều Yahweh truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “giữa hai buổi chiều,” một thành ngữ chỉ khoảng thời gian chạng vạng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  choice: họ cử hành lễ Vượt Qua
  rationale: Động từ עשה có nghĩa cơ bản là “làm”, nhưng khi đi với הַפֶּסַח thì diễn tả việc giữ hoặc cử hành lễ Vượt Qua. “Cử hành” tự nhiên trong tiếng Việt và giữ được ý nghĩa nghi lễ.
- source_word: הַפֶּסַח
  choice: lễ Vượt Qua
  rationale: Trong văn cảnh, פֶּסַח chỉ toàn bộ việc tuân giữ lễ Vượt Qua, không nhất thiết chỉ riêng sinh tế hay con chiên.
- source_word: בָּרִאשׁוֹן
  choice: vào tháng thứ nhất
  rationale: Danh từ “tháng” được bổ sung theo công thức niên lịch ở vế kế tiếp, làm rõ nghĩa hàm ẩn của tiếng Hê-bơ-rơ.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ngày mười bốn của tháng
  rationale: Cách dịch sát công thức ghi ngày tháng của tiếng Hê-bơ-rơ và tự nhiên trong tiếng Việt.
- source_word: בֵּין הָעַרְבַּיִם
  choice: lúc chạng vạng tối
  rationale: Thành ngữ có nghĩa đen là “giữa hai buổi chiều/tối” và chỉ khoảng thời gian chạng vạng; nghĩa đen được ghi trong chú thích.
- source_word: בְּמִדְבַּר סִינָי
  choice: trong hoang mạc Si-nai
  rationale: מִדְבָּר chỉ vùng hoang vu hoặc sa mạc; “hoang mạc” là cách diễn đạt trang trọng, rõ nghĩa và phù hợp địa danh Si-nai.
- source_word: כְּכֹל אֲשֶׁר צִוָּה ... כֵּן עָשׂוּ
  choice: đã làm đúng mọi điều ... truyền
  rationale: Cấu trúc này nhấn mạnh sự tuân thủ trọn vẹn. “Làm đúng mọi điều” truyền đạt tự nhiên cả tính tương ứng lẫn tính toàn diện.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai Y-sơ-ra-ên
  rationale: Giữ hình thức nam tính và ý niệm dòng dõi trong nguyên văn, đồng thời cụm từ có nghĩa tập thể chỉ dân giao ước.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng Danh Thánh; phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Cách dịch thành ngữ tập thể בְּנֵי יִשְׂרָאֵל
  choice: các con trai Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; con cái Y-sơ-ra-ên
  rationale: Lựa chọn này bảo tồn cách diễn đạt mang giới tính và quan hệ dòng dõi của nguyên văn, dù trong văn cảnh nó chỉ toàn thể cộng đồng giao ước.
- issue: Phạm vi nghĩa của הַפֶּסַח
  choice: lễ Vượt Qua
  alternative: sinh tế Vượt Qua
  rationale: Văn cảnh nói đến việc cộng đồng tuân giữ nghi lễ theo thời điểm được truyền, nên không thu hẹp từ này chỉ còn sinh tế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cử hành” cho hành vi nghi lễ, “hoang mạc” cho bối cảnh địa lý, và giữ các dạng tên Yahweh, Môi-se, Y-sơ-ra-ên. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
