base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: vi
  text: Vào ngày mười bốn của tháng này, lúc chạng vạng[a], anh em phải cử hành lễ ấy vào đúng thời điểm đã định; theo mọi quy định và mọi luật lệ của lễ ấy, anh em phải cử hành lễ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “giữa hai buổi chiều/tối”, một thành ngữ truyền thống chỉ khoảng thời gian quanh lúc chạng vạng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: Vào ngày mười bốn của tháng này
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ nguyên ngày tháng cụ thể của nguyên văn.
- source_word: בֵּין הָעַרְבַּיִם
  choice: lúc chạng vạng
  rationale: Đây là thành ngữ chỉ thời gian theo nghi lễ, nguyên nghĩa là “giữa hai buổi chiều/tối”. “Lúc chạng vạng” dễ hiểu trong tiếng Việt nhưng vẫn cần chú thích vì phạm vi thời gian chính xác của thành ngữ có thể được hiểu khác nhau.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: anh em phải cử hành lễ ấy
  rationale: Động từ עשה có nghĩa rộng là “làm”, nhưng khi đối tượng là lễ Vượt Qua thì mang nghĩa cử hành lễ. “Lễ ấy” làm rõ đại từ chỉ lễ Vượt Qua trong ngữ cảnh trước đó.
- source_word: בְּמוֹעֲדוֹ
  choice: đúng kỳ định
  rationale: מוֹעֵד chỉ thời điểm hay kỳ đã được ấn định; cách dịch này giữ sắc thái thời gian cố định trong bối cảnh nghi lễ.
- source_word: כְּכָל חֻקֹּתָיו
  choice: theo mọi quy định ... về lễ ấy
  rationale: חֻקּוֹת chỉ những điều được ấn định hoặc quy định. Cụm “về lễ ấy” thể hiện hậu tố sở hữu số ít của tiếng Hê-bơ-rơ.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: và mọi luật lệ về lễ ấy
  rationale: מִשְׁפָּטִים trong văn cảnh pháp luật-nghi lễ là các luật lệ hoặc quy tắc; dịch khác với חֻקּוֹת để giữ sự phân biệt từ vựng của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho chủ thể số nhiều được ngầm chỉ trong động từ, “cử hành” cho mệnh lệnh nghi lễ, đồng thời giữ sự lặp lại của động từ trong nguyên văn.
