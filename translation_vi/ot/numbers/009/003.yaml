  to: Vào ngày mười bốn của tháng này, lúc chạng vạng[a], anh em phải cử hành lễ ấy vào đúng thời điểm đã định; theo mọi quy định và mọi luật lệ của lễ ấy, anh em phải cử hành lễ ấy.
