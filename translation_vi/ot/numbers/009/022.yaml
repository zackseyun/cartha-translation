id: NUM.9.22
reference: Numbers 9:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: vi
  text: Dù đám mây lưu lại trên Đền Tạm, phủ trên đó, hai ngày, một tháng hay nhiều ngày[a], dân Y-sơ-ra-ên vẫn đóng trại và không lên đường; nhưng khi đám mây được cất lên, họ lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “những ngày”; trong ngữ cảnh này có thể hàm ý một thời gian kéo dài.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: Dù là ... hay ... hay ...
  rationale: Diễn đạt tự nhiên trong tiếng Việt chuỗi lựa chọn về những khoảng thời gian khác nhau.
- source_word: יֹמַיִם
  choice: hai ngày
  rationale: Dạng số đôi chỉ rõ hai ngày.
- source_word: חֹדֶשׁ
  choice: một tháng
  rationale: Danh từ ở nghĩa bất định trong danh sách các khoảng thời gian.
- source_word: יָמִים
  choice: lâu hơn
  rationale: Trong chuỗi sau “hai ngày” và “một tháng”, từ số nhiều “ngày” có nghĩa theo ngữ cảnh là một thời gian kéo dài; chú thích giữ cách hiểu sát chữ.
- source_word: בְּהַאֲרִיךְ הֶעָנָן
  choice: hễ đám mây còn ở
  rationale: Thể hiện sự kéo dài thời gian đám mây lưu lại, đồng thời phối hợp với các động từ chỉ hành động thường lệ ở mệnh đề sau.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Cách gọi quen thuộc, rõ nghĩa trong tiếng Việt đối với nơi thánh di động của dân Y-sơ-ra-ên.
- source_word: לִשְׁכֹּן עָלָיו
  choice: ngự trên đó
  rationale: Giữ ý đám mây hiện diện ổn định bên trên Đền Tạm; “ngự” phù hợp văn phong trang trọng và ngữ cảnh sự hiện diện thần thánh mà không xác định đám mây chính là Đức Chúa Trời.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cách diễn đạt tự nhiên, trang trọng, chỉ cộng đồng hậu duệ Y-sơ-ra-ên, tránh khiến độc giả hiện đại hiểu cụm từ chỉ riêng nam giới.
- source_word: יַחֲנוּ ... וְלֹא יִסָּעוּ
  choice: vẫn đóng trại và không lên đường
  rationale: 'Diễn tả hành động thường lệ: trong suốt thời gian đám mây lưu lại, dân chúng tiếp tục ở trại và không khởi hành.'
- source_word: וּבְהֵעָלֹתוֹ יִסָּעוּ
  choice: nhưng khi đám mây cất lên, họ liền lên đường
  rationale: Nêu rõ chủ thể của đại từ để tránh mơ hồ trong tiếng Việt; “liền” làm rõ sự tương ứng về thời điểm mà không thêm quan hệ nhân quả ngoài văn cảnh.
theological_decisions:
- issue: Quan hệ giữa đám mây và sự hiện diện thần thánh
  choice: ngự trên đó
  alternative: đậu lại trên đó / ở trên đó
  rationale: “Ngự” truyền đạt sự hiện diện trang trọng của đám mây trên nơi thánh, nhưng câu vẫn giữ “đám mây” làm chủ thể và không đồng nhất hóa một cách minh nhiên đám mây với Đức Chúa Trời.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đền Tạm” và “Y-sơ-ra-ên” theo lối gọi Kinh Thánh quen thuộc; cấu trúc “hễ... thì...” làm rõ tính lặp lại, thường lệ của hành động.
