revisions:
- from: Dù là hai ngày, một tháng hay lâu hơn[a], hễ đám mây còn ở trên Đền Tạm, ngự trên đó, thì con dân Y-sơ-ra-ên vẫn đóng trại và không lên đường; nhưng khi đám mây cất lên, họ liền lên đường.
  to: Dù đám mây lưu lại trên Đền Tạm, phủ trên đó, hai ngày, một tháng hay nhiều ngày[a], dân Y-sơ-ra-ên vẫn đóng trại và không lên đường; nhưng khi đám mây được cất lên, họ lên đường.
  rationale: Bản sửa giữ nguyên chuỗi thời lượng của tiếng Hê-bơ-rơ, dùng “nhiều ngày” thay cho diễn giải so sánh “lâu hơn,” và chuyển phần diễn giải ngữ cảnh vào chú thích. Cú pháp được làm tự nhiên hơn bằng cách để “đám mây” làm chủ thể của hành động lưu lại. “Phủ trên đó” và “được cất lên” lần lượt tránh thêm sắc thái nhân vị và phản ánh tốt hơn động từ nguồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:40:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính: dân Y-sơ-ra-ên ở lại khi mây còn trên Đền Tạm và lên đường khi mây được cất lên. Tuy nhiên, “lâu hơn” diễn giải יָמִים quá xa và gợi một so sánh không có trong tiếng Hê-bơ-rơ; nên giữ “nhiều ngày” trong bản văn và giải thích sắc thái ngữ cảnh ở chú thích. “Ngự” cũng thêm sắc thái thần học/nhân vị vào hành động của đám mây; cách diễn đạt trung tính hơn sẽ sát nguồn hơn. Động từ ở cuối là dạng bị động/được khiến lên, nên “được cất lên” phản ánh tốt hơn “đám mây cất lên.”'
  naturalness: Cấu trúc “Dù là …, hễ …, thì …” chồng hai khung điều kiện-thời gian và hơi gượng trong tiếng Việt hiện đại. Đặt trực tiếp đám mây làm chủ thể của thời lượng (“Dù đám mây lưu lại … hai ngày…”) tự nhiên hơn, đồng thời giữ rõ quan hệ giữa thời gian lưu lại và việc đóng trại.
  terminology: “Đền Tạm” và “Y-sơ-ra-ên” phù hợp lối gọi Kinh Thánh tiếng Việt. “Dân Y-sơ-ra-ên” tự nhiên, bao quát và không làm thay đổi nghĩa của בְנֵי יִשְׂרָאֵל trong ngữ cảnh này. “Phủ trên đó” diễn đạt trung tính việc mây ở/dừng trên Đền Tạm, tránh nhân vị hóa bằng “ngự.”
  issues:
  - severity: medium
    issue: “lâu hơn” cho יָמִים
    rationale: Danh từ số nhiều “ngày” không tự thân mang ý so sánh “hơn”. Trong ngữ cảnh nó có thể chỉ thời gian kéo dài, nhưng bản văn chính nên giữ cách dịch gần là “nhiều ngày”; diễn giải ngữ cảnh nên đặt ở chú thích.
  - severity: low
    issue: “ngự trên đó” cho לִשְׁכֹּן עָלָיו
    rationale: “Ngự” tạo sắc thái nhân vị và thần học không được phát biểu trực tiếp bởi cú pháp này, vốn nói về đám mây lưu/dừng trên Đền Tạm. Cách dịch trung tính bảo toàn sự dè dặt của nguồn.
  - severity: low
    issue: “đám mây cất lên” cho וּבְהֵעָלֹתוֹ
    rationale: Dạng Hiphil infinitive với hậu tố phù hợp hơn với ý đám mây “được cất lên”/“được nhấc lên”, thay vì chủ động tự cất lên.
  revised_text: Dù đám mây lưu lại trên Đền Tạm, phủ trên đó, hai ngày, một tháng hay nhiều ngày[a], dân Y-sơ-ra-ên vẫn đóng trại và không lên đường; nhưng khi đám mây được cất lên, họ lên đường.
  revised_footnotes:
