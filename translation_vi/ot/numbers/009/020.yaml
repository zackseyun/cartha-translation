id: NUM.9.20
reference: Numbers 9:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: vi
  text: Có khi đám mây ở lại trên Đền Tạm trong một số ngày; theo lệnh của Yahweh, họ hạ trại[a], và theo lệnh của Yahweh, họ lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “theo miệng Yahweh”, nghĩa là theo lệnh của Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Có khi
  rationale: Thành ngữ này nêu một trường hợp trong chuỗi những khoảng thời gian khác nhau; “Có khi” tự nhiên, gọn và giữ sắc thái lặp lại.
- source_word: יִהְיֶה הֶעָנָן
  choice: đám mây ở
  rationale: Trong ngữ cảnh hành trình, היה diễn tả việc đám mây tiếp tục hiện diện tại một vị trí, không chỉ sự tồn tại; tiếng Việt tự nhiên có thể dùng “ở” mà vẫn hàm ý lưu lại.
- source_word: יָמִים מִסְפָּר
  choice: một số ngày
  rationale: Cụm từ chỉ một số ngày có hạn nhưng không xác định; “một số ngày” tránh thu hẹp thành “vài ngày”.
- source_word: עַל הַמִּשְׁכָּן
  choice: ở trên Đền Tạm
  rationale: מִשְׁכָּן là nơi thánh di động của Israel trong hoang mạc; “Đền Tạm” là cách gọi rõ nghĩa, quen thuộc, còn “ở trên” diễn đạt vị trí của đám mây.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Nghĩa đen là “theo miệng Yahweh”, nhưng đây là thành ngữ chỉ mệnh lệnh hoặc sự chỉ dẫn có thẩm quyền.
- source_word: יַחֲנוּ
  choice: họ hạ trại
  rationale: Dạng chưa hoàn thành diễn tả hành động theo lệ trong chuỗi sự kiện; “hạ trại” là cách nói tự nhiên cho việc đóng quân tại chỗ.
- source_word: יִסָּעוּ
  choice: họ lên đường
  rationale: נסע trong bối cảnh này chỉ việc nhổ trại và bắt đầu di chuyển; “lên đường” tự nhiên và chính xác.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự Danh, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Bản Hê-bơ-rơ trực tiếp dùng Tứ Tự Danh; phiên âm “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ giữa việc hạ trại, lên đường và mệnh lệnh của Yahweh
  choice: Lặp lại “theo lệnh của Yahweh” ở cả hai vế
  alternative: Chỉ nêu một lần rồi hiểu cho cả hai hành động
  rationale: Nguyên văn lặp lại cụm עַל פִּי יְהוָה, nhấn mạnh rằng cả việc ở lại lẫn việc khởi hành đều tùy thuộc mệnh lệnh của Yahweh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc song song của nguyên văn; dùng “Đền Tạm” nhất quán như tên gọi nơi thánh di động trong hoang mạc.
