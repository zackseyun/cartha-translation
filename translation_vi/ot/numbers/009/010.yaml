revisions:
- from: 'Hãy nói với con cái Y-sơ-ra-ên rằng: “Nếu bất cứ người đàn ông nào trong các ngươi hoặc thuộc các thế hệ mai sau bị ô uế vì người chết[a], hay đang đi xa, thì người ấy phải cử hành lễ Vượt Qua kính Yahweh.”'
  to: 'Hãy nói với con cái Y-sơ-ra-ên rằng: “Nếu bất cứ người đàn ông nào bị ô uế vì người chết[a], hoặc đang ở trên một hành trình xa, dù trong các ngươi hay trong các thế hệ của các ngươi, thì người ấy phải cử hành lễ Vượt Qua cho Yahweh.”'
  rationale: Sửa vị trí của cụm chỉ phạm vi để nó bao quát cả hai trường hợp nêu trong điều luật; làm rõ nghĩa “hành trình xa”; và chuyển “kính Yahweh” thành “cho Yahweh” để giữ quan hệ ngữ nghĩa của nguyên văn mà không thêm sắc thái. Chú thích [a] vẫn được đặt ngay tại thành ngữ cần giải thích.
