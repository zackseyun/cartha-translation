source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: vi
  text: 'Hãy nói với con cái Y-sơ-ra-ên rằng: “Nếu bất cứ người đàn ông nào bị ô uế vì người chết[a], hoặc đang ở trên một hành trình xa, dù trong các ngươi hay trong các thế hệ của các ngươi, thì người ấy phải cử hành lễ Vượt Qua cho Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ nói theo thành ngữ: “bị ô uế vì một người/mạng sống”; trong luật thanh sạch, thành ngữ này chỉ sự ô uế liên quan đến một người đã chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc của cụm Hê-bơ-rơ ‘các con trai/con cái của Israel’, đồng thời trong tiếng Việt tự nhiên cụm này chỉ toàn thể cộng đồng giao ước.
- source_word: אִישׁ אִישׁ
  choice: bất cứ người đàn ông nào
  rationale: Lối lặp phân phối nhấn mạnh từng trường hợp riêng; bản dịch giữ danh từ giống đực của nguyên văn mà vẫn tự nhiên.
- source_word: טָמֵא לָנֶפֶשׁ
  choice: bị ô uế vì người chết
  rationale: Trong ngữ cảnh luật thanh sạch, נֶפֶשׁ ở cấu trúc này chỉ một người đã chết, là nguyên nhân gây ô uế; cách dịch không thêm chi tiết ‘tiếp xúc’ vốn không được nói rõ ngay trong câu.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: đang đi xa
  rationale: Diễn đạt tự nhiên tình trạng ở xa vì hành trình, thay vì dịch cứng là ‘ở trên một con đường xa’.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: trong các ngươi hoặc thuộc các thế hệ mai sau
  rationale: Cụm này mở rộng phạm vi áp dụng từ cộng đồng đang nghe đến các thế hệ kế tiếp; cách đặt trong tiếng Việt làm rõ nó bổ nghĩa cho người thuộc trường hợp nêu ra.
- source_word: וְעָשָׂה פֶסַח
  choice: thì người ấy phải cử hành lễ Vượt Qua
  rationale: Trong mệnh đề điều kiện luật pháp, động từ diễn đạt nghĩa vụ tiếp theo; עשה kết hợp với פֶסַח là thành ngữ chỉ việc cử hành lễ Vượt Qua. Không thêm ‘vẫn’, vì từ ấy không hiện diện rõ trong nguyên văn.
- source_word: לַיהוָה
  choice: kính Yahweh
  rationale: Giữ danh riêng giao ước יהוה là ‘Yahweh’; ‘kính’ diễn đạt tự nhiên việc cử hành lễ hướng về và tôn kính Ngài.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm ‘Yahweh’ bảo tồn đặc tính danh riêng mà không thay bằng một tước hiệu.
- issue: Phạm vi giới tính của אִישׁ אִישׁ
  choice: bất cứ người đàn ông nào
  alternative: bất cứ ai
  rationale: Giữ hình thức giống đực cụ thể của điều luật thay vì trung tính hóa; không suy diễn thêm về phạm vi áp dụng ngoài điều nguyên văn nói.
- issue: Sắc thái nghĩa vụ trong וְעָשָׂה פֶסַח
  choice: phải cử hành lễ Vượt Qua
  alternative: vẫn phải cử hành lễ Vượt Qua
  rationale: Cấu trúc luật pháp sau mệnh đề điều kiện diễn đạt điều phải làm, nhưng nguyên văn không có từ tương đương rõ ràng với ‘vẫn’; vì vậy không thêm sắc thái ấy.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu trong tiếng Việt hiện đại. Dùng ‘con cái Y-sơ-ra-ên’ để giữ sắc thái giao ước; dùng ‘cử hành lễ Vượt Qua’ thay cho lối dịch cứng ‘làm lễ Vượt Qua’. Dấu chú thích [a] được đặt ngay sau cụm cần giải thích.
