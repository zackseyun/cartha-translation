source:
  edition: WLC
  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: vi
  text: Theo lệnh Yahweh, dân Israel lên đường[a]; theo lệnh Yahweh, họ đóng trại. Trong suốt thời gian mây còn ở trên Đền Tạm, họ đóng trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ, ở cả hai chỗ: “theo miệng của Yahweh”, một thành ngữ nghĩa là “theo lệnh của Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Thành ngữ này có nghĩa đen là “theo miệng của Yahweh”, nhưng trong ngữ cảnh diễn tả mệnh lệnh hoặc sự chỉ dẫn có thẩm quyền. “Theo lệnh của Yahweh” tự nhiên và chính xác trong tiếng Việt.
- source_word: יִסְעוּ
  choice: lên đường
  rationale: Động từ נסע trong bối cảnh hành trình chỉ việc nhổ trại và khởi hành; “lên đường” là cách nói hiện đại, rõ nghĩa mà không diễn giải quá mức.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm từ chỉ cộng đồng hậu duệ của Israel. “Con dân Israel” giữ được sắc thái nguồn gốc chung và bao gồm toàn dân, đồng thời tự nhiên hơn “các con trai Israel” trong tiếng Việt.
- source_word: יַחֲנוּ
  choice: đóng trại / cứ ở lại trong trại
  rationale: Lần đầu diễn tả hành động hạ trại nên dịch “đóng trại”; lần cuối nằm trong cấu trúc chỉ thời gian kéo dài nên “cứ ở lại trong trại” truyền đạt rõ sắc thái tiếp diễn.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: suốt những ngày
  rationale: Giữ hình ảnh “những ngày” của nguyên văn và diễn tả toàn bộ khoảng thời gian.
- source_word: יִשְׁכֹּן
  choice: ngự
  rationale: שכן có nghĩa là cư ngụ hay lưu lại. Với đám mây biểu thị sự hiện diện của Đức Chúa Trời trên nơi thánh, “ngự” vừa trang trọng vừa giữ sắc thái cư ngụ, thay vì chỉ nói vị trí tĩnh.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Bản dịch trực tiếp, rõ ràng về đám mây hữu hình hướng dẫn Israel.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן là nơi ngự thánh trong hoang mạc. “Đền Tạm” là thuật ngữ tiếng Việt quen thuộc, phân biệt với “Lều Hội Kiến” là cách dịch phù hợp hơn cho אֹהֶל מוֹעֵד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu, phù hợp với bằng chứng nguyên ngữ.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh יהוה. “Yahweh” bảo tồn danh riêng và không biến danh ấy thành một tước hiệu.
- issue: Sắc thái của שכן khi chủ ngữ là đám mây
  choice: ngự
  alternative: ở lại
  rationale: “Ngự” bảo tồn liên hệ giữa đám mây và sự hiện diện thần linh mà không khẳng định đám mây đồng nhất trọn vẹn với chính Đức Chúa Trời; “ở lại” là cách hiểu thuần vị trí cũng có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con dân Israel” để chỉ toàn thể cộng đồng; viết hoa “Đền Tạm” như tên gọi quy ước của nơi thánh. Dấu chấm phẩy giữ sự song hành giữa việc lên đường và đóng trại.
