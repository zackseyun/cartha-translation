revisions:
- from: Theo lệnh của Yahweh, con dân Israel lên đường[a]; và theo lệnh của Yahweh, họ đóng trại. Suốt những ngày đám mây ngự trên Đền Tạm, họ cứ ở lại trong trại.
  to: Theo lệnh Yahweh, dân Israel lên đường[a]; theo lệnh Yahweh, họ đóng trại. Trong suốt thời gian mây còn ở trên Đền Tạm, họ đóng trại.
  rationale: Bản sửa dùng “còn ở” cho sự lưu lại của mây, tránh gán cách nói tôn kính trực tiếp cho đám mây. Việc lặp lại “đóng trại” giữ phép lặp của nguyên ngữ, còn “Trong suốt thời gian” diễn đạt rõ ý kéo dài của כָּל־יְמֵי אֲשֶׁר. Danh Yahweh và thuật ngữ Đền Tạm được giữ nguyên.
