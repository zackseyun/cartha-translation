  terminology: “Yahweh” nhất quán với việc giữ danh riêng יהוה. “Điều Yahweh giao phó” và “tuân giữ” truyền đạt thích đáng מִשְׁמֶרֶת và שָׁמַר mà không áp đặt diễn giải hệ phái. “Truyền qua Môi-se” diễn đạt đúng chức năng trung gian của בְּיַד מֹשֶׁה.
