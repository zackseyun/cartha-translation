source:
  edition: WLC
  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: vi
  text: Theo lệnh Yahweh, họ đóng trại; và theo lệnh Yahweh, họ lên đường. Họ tuân giữ điều Yahweh giao phó, theo lệnh Yahweh truyền qua Môi-se.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “bởi tay Môi-se”, một thành ngữ có nghĩa là “qua Môi-se” hoặc “do Môi-se làm trung gian”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: theo lệnh
  rationale: Thành ngữ theo nghĩa đen là “theo miệng của”, nhưng trong văn cảnh chỉ mệnh lệnh có thẩm quyền; “theo lệnh” tự nhiên và giữ đúng ý.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: יַחֲנוּ
  choice: họ đóng trại
  rationale: Diễn đạt tự nhiên hành động dừng lại và lập trại.
- source_word: יִסָּעוּ
  choice: họ lên đường
  rationale: Trong bối cảnh hành trình nơi hoang mạc, động từ chỉ việc nhổ trại và khởi hành; “lên đường” rõ ràng, tự nhiên.
- source_word: מִשְׁמֶרֶת יְהוָה
  choice: điều Yahweh giao phó
  rationale: מִשְׁמֶרֶת chỉ trách nhiệm hoặc điều được giao để gìn giữ và tuân hành; cách dịch này bảo toàn sắc thái ủy thác mà không quá cổ.
- source_word: שָׁמָרוּ
  choice: tuân giữ
  rationale: Kết hợp cả ý gìn giữ và vâng theo, phù hợp với trách nhiệm Yahweh đã giao.
- source_word: בְּיַד מֹשֶׁה
  choice: truyền qua Môi-se
  rationale: Thành ngữ “bởi tay Môi-se” diễn tả vai trò trung gian hoặc tác nhân; “qua Môi-se” tự nhiên trong tiếng Việt, còn hình ảnh nguyên văn được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” phân biệt danh riêng này với các tước hiệu và không đưa vào một cách đọc mang tính hệ phái.
- issue: Vai trò của Môi-se trong mệnh lệnh
  choice: Yahweh truyền lệnh qua Môi-se
  alternative: Môi-se tự mình ban lệnh
  rationale: Cụm בְּיַד מֹשֶׁה diễn tả Môi-se là người trung gian chuyển đạt mệnh lệnh của Yahweh, chứ không phải nguồn tối hậu của mệnh lệnh.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Phép lặp “theo lệnh Yahweh” được giữ lại để phản ánh cấu trúc nhấn mạnh của nguyên văn; dấu chấm phẩy làm rõ hai hành động đối ứng là đóng trại và lên đường.
