  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của nguyên văn: việc đóng trại và lên đường đều tùy theo mệnh lệnh của Yahweh; dân sự tuân giữ trách nhiệm/điều được Yahweh giao phó; và mệnh lệnh ấy được truyền qua Môi-se. Phép lặp “theo lệnh Yahweh” bảo toàn sự nhấn mạnh của tiếng Hê-bơ-rơ.'
