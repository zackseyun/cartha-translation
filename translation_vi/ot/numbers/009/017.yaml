translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc điều kiện–trình tự và sự tương ứng địa điểm của tiếng Hê-bơ-rơ. Dùng “con dân Y-sơ-ra-ên” thay vì nghĩa đen dễ gây hiểu lầm là chỉ nam giới; tên riêng theo dạng phiên âm Kinh Thánh quen thuộc.
