revisions:
- from: Mỗi khi đám mây được cất lên khỏi phía trên Lều[a], sau đó con dân Y-sơ-ra-ên lên đường; và tại nơi đám mây dừng lại, con dân Y-sơ-ra-ên hạ trại tại đó.
  to: Mỗi khi đám mây được cất lên từ phía trên Lều[a], người Y-sơ-ra-ên lên đường; và tại nơi đám mây dừng lại, tại đó người Y-sơ-ra-ên hạ trại[b].
  rationale: Bản sửa thay cách gọi có sắc thái diễn giải “con dân” bằng cách gọi trung tính, thông dụng “người Y-sơ-ra-ên”; làm mượt cách diễn đạt vị trí của mây; và chỉnh chú thích về “Lều” cho chính xác. Dấu “tại đó” được giữ để phản ánh sự nhấn mạnh địa điểm trong tiếng Hê-bơ-rơ. Không thêm diễn giải giáo phái hay thay đổi nghĩa của câu.
