  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: vi
  text: Mỗi khi đám mây được cất lên từ phía trên Lều[a], người Y-sơ-ra-ên lên đường; và tại nơi đám mây dừng lại, tại đó người Y-sơ-ra-ên hạ trại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Lều Hội Kiến”; tiếng Hê-bơ-rơ nói “Lều”, chỉ Lều/Đền Tạm trong ngữ cảnh này.
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “các con trai của Y-sơ-ra-ên”; đây là cách gọi dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: Mỗi khi ... được cất lên
  rationale: Cụm לְפִי với động từ nguyên mẫu diễn tả hoàn cảnh có tính lặp lại; “mỗi khi” truyền đạt rõ quy luật hành trình, còn thể bị động “được cất lên” giữ nguyên việc câu không nêu tác nhân.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Cách gọi tự nhiên, rõ nghĩa trong tiếng Việt đối với đám mây dẫn đường trong đồng hoang.
- source_word: מֵעַל הָאֹהֶל
  choice: khỏi phía trên Lều
  rationale: Giữ quan hệ không gian của מֵעַל và nghĩa trực tiếp “lều” của אֹהֶל; viết hoa “Lều” để cho thấy đây là chiếc lều đã được xác định trong ngữ cảnh, không thay thẳng bằng thuật ngữ diễn giải “Đền Tạm”.
- source_word: וְאַחֲרֵי כֵן
  choice: sau đó
  rationale: Giữ rõ trình tự thời gian được cụm từ Hê-bơ-rơ nêu ra.
- source_word: יִסְעוּ
  choice: lên đường
  rationale: Động từ ở đây chỉ việc nhổ trại để bắt đầu chặng hành trình; “lên đường” tự nhiên trong tiếng Việt, còn tính lặp lại đã được “mỗi khi” xác lập.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Diễn đạt tự nhiên một tập thể thuộc về Y-sơ-ra-ên, đồng thời còn phản ánh sắc thái thân tộc của nghĩa đen “các con trai/con cái của Y-sơ-ra-ên” mà không khiến độc giả hiện đại hiểu là chỉ nam giới.
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: và tại nơi
  rationale: Giữ cấu trúc địa điểm tường minh của nguyên văn, thay vì rút gọn thành “bất cứ nơi nào”.
- source_word: יִשְׁכָּן
  choice: dừng lại
  rationale: Trong quan hệ với một đám mây dẫn đường, “dừng lại” là cách nói cụ thể và tự nhiên; nó bảo toàn ý đám mây lưu lại tại một địa điểm mà không nhân cách hóa quá mức thành “cư ngụ”.
- source_word: שָׁם ... שָׁם
  choice: nơi ... tại đó
  rationale: Bảo toàn sự tương ứng và nhấn mạnh về địa điểm trong nguyên văn, nhưng tránh lặp từ vụng về trong tiếng Việt.
- source_word: יַחֲנוּ
  choice: hạ trại
  rationale: Diễn tả chính xác việc lập trại tại điểm dừng; tính hành động lặp lại được bao quát bởi cấu trúc “mỗi khi” của toàn câu.
