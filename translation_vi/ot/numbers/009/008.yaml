  - severity: low
    issue: Chú thích “Hãy đứng lại” chưa phải cách sát nghĩa rõ nhất của עִמְדוּ trong ngữ cảnh
    rationale: Mệnh lệnh này theo nghĩa đen là “hãy đứng/đứng yên”; “đứng lại” trong tiếng Việt thường có thể hàm ý dừng một chuyển động. “Hãy đứng yên” biểu đạt rõ hơn nghĩa ở nguyên vị trí.
  revised_text: 'Môi-se nói với họ: “Hãy chờ[a], để tôi nghe Yahweh sẽ truyền điều gì cho các anh.”'
