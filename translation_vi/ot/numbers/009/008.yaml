  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם מֹשֶׁ֑ה עִמְד֣וּ וְ/אֶשְׁמְעָ֔ה מַה יְצַוֶּ֥ה יְהוָ֖ה לָ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: vi
  text: 'Môi-se nói với họ: “Hãy chờ[a], để tôi nghe Yahweh sẽ truyền điều gì cho các anh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Hãy đứng yên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Môi-se nói
  rationale: Dạng kể chuyện nối tiếp đưa sự việc sang hành động tiếp theo; tiếng Việt không cần dịch máy móc liên từ וַ־, nên câu văn tự nhiên chỉ cần “nói”.
- source_word: אֲלֵהֶם
  choice: với họ
  rationale: Đại từ ngôi thứ ba số nhiều giống đực chỉ những người vừa thưa hỏi Môi-se; “với họ” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: עִמְדוּ
  choice: Hãy chờ
  rationale: Động từ עמד theo nghĩa đen là “đứng”, nhưng trong ngữ cảnh này là mệnh lệnh bảo họ ở lại chờ trong khi Môi-se xin chỉ thị. Nghĩa sát chữ được giữ trong chú thích.
- source_word: וְאֶשְׁמְעָה
  choice: để tôi nghe xem
  rationale: Dạng ngôi thứ nhất biểu thị ý định của Môi-se muốn nghe lời giải đáp; “để tôi nghe xem” vừa tự nhiên vừa giữ động từ “nghe”, không thêm rằng ông sẽ cầu hỏi bằng cách nào.
- source_word: מַה
  choice: điều gì
  rationale: Đại từ nghi vấn mở đầu nội dung mệnh lệnh mà Môi-se chờ được nghe.
- source_word: יְצַוֶּה
  choice: sẽ truyền
  rationale: Piel chưa hoàn thành của צוה mang nghĩa ra lệnh hoặc truyền dạy; “sẽ truyền” phù hợp với lời chỉ thị sắp được ban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: לָכֶם
  choice: cho các anh
  rationale: Giới từ לְ với hậu tố ngôi thứ hai số nhiều có thể chỉ đối tượng nhận mệnh lệnh hoặc vấn đề liên quan đến họ. “Cho các anh” giữ cấu trúc gọn và tự nhiên, đồng thời không loại trừ sắc thái “về trường hợp của các anh” trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn tư cách danh riêng thay vì đổi thành tước hiệu.
- issue: Đối tượng của mệnh lệnh trong לָכֶם
  choice: sẽ truyền điều gì cho các anh
  alternative: sẽ truyền gì về trường hợp của các anh
  rationale: Cấu trúc לָכֶם có thể được hiểu là mệnh lệnh dành cho họ hoặc liên quan đến trường hợp của họ. Bản chính giữ cách nói trực tiếp “cho các anh”, không giải quyết dứt khoát sắc thái mà ngữ cảnh vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các anh” phù hợp với nhóm đàn ông đang nói với Môi-se trong ngữ cảnh; cấu trúc “để tôi nghe xem” bảo tồn cách nói của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
