  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: Môi-se nói với họ, bảo họ chờ, rồi ông sẽ nghe điều Yahweh sẽ truyền cho họ. Tuy nhiên, “nghe xem” thêm một sắc thái thăm dò nhẹ không được biểu thị rõ trong động từ cohortative וְאֶשְׁמְעָה; chỉ “nghe” sát hơn.'
  naturalness: 'Câu văn nhìn chung tự nhiên, trang trọng vừa phải. Bỏ “xem” vẫn giữ được lời nói Việt ngữ lưu loát: “để tôi nghe Yahweh sẽ truyền điều gì cho các anh.”'
  terminology: “Môi-se” và “Yahweh” nhất quán với chính sách tên riêng. “Truyền” là cách dịch thích hợp, hiện đại cho צוה trong ngữ cảnh mệnh lệnh. “Các anh” phù hợp với nhóm nam giới được ngữ cảnh gần xác định.
