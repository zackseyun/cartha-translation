- from: 'Những người ấy nói với ông: “Chúng tôi bị ô uế vì xác một người chết.[a] Tại sao chúng tôi lại bị ngăn không được dâng lễ vật của Yahweh vào đúng kỳ định, cùng với con dân Israel?”[b]'
  to: 'Những người ấy nói với ông: “Chúng tôi bị ô uế vì thi thể một người.[a] Tại sao chúng tôi lại bị ngăn không được dâng lễ vật của Yahweh vào kỳ đã định, giữa con dân Israel?”[b]'
  rationale: Thay “xác một người chết” bằng “thi thể một người” để tiếng Việt tự nhiên và chính xác hơn đối với thành ngữ chỉ ô uế bởi xác chết. Thay “cùng với” bằng “giữa” để phản ánh sát bְּתוֹךְ, đồng thời giữ nguyên sắc thái bị ngăn khỏi sự tham dự trong cộng đồng Israel. Các chú thích giữ nguyên và các neo chú thích vẫn hợp lệ.
