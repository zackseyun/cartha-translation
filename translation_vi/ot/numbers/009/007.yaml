base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: vi
  text: 'Những người ấy nói với ông: “Chúng tôi bị ô uế vì thi thể một người.[a] Tại sao chúng tôi lại bị ngăn không được dâng lễ vật của Yahweh vào kỳ đã định, giữa con dân Israel?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “ô uế vì linh hồn của một người,” một thành ngữ chỉ sự ô uế liên quan đến thi thể người chết.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Tại sao chúng tôi lại bị loại ra, không được đem lễ vật của Yahweh đến vào kỳ đã định, giữa con dân Israel?”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: Những người ấy nói với ông
  rationale: Cách diễn đạt tự nhiên trong văn thuật sự tiếng Việt, giữ đại từ chỉ định và quy chiếu về Môi-se trong ngữ cảnh.
- source_word: אֲנַחְנוּ טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: Chúng tôi bị ô uế vì xác một người chết
  rationale: טְמֵאִים chỉ tình trạng ô uế theo nghi lễ; thành ngữ לְנֶפֶשׁ אָדָם trong ngữ cảnh luật lệ nói đến sự ô uế do thi thể người chết. Bản dịch nêu rõ thi thể nhưng không bổ sung cách thức tiếp xúc vốn không được nói trực tiếp ở đây.
- source_word: לָמָּה נִגָּרַע לְבִלְתִּי הַקְרִב
  choice: Tại sao chúng tôi lại bị ngăn không được dâng
  rationale: Dạng Niphal của גרע ở đây mang ý bị loại hoặc bị ngăn tham dự; הקריב trong ngữ cảnh tế lễ là đem đến/dâng lễ vật.
- source_word: קָרְבַּן יְהוָה
  choice: lễ vật của Yahweh
  rationale: קָרְבָּן là lễ vật được đem dâng; יְהוָה được phiên âm là Yahweh để giữ danh riêng trong nguyên văn.
- source_word: בְּמֹעֲדוֹ
  choice: vào đúng kỳ định
  rationale: מוֹעֵד chỉ thời điểm đã được ấn định cho nghi lễ; “đúng kỳ định” vừa rõ nghĩa vừa hợp văn phong Kinh Thánh tiếng Việt.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: cùng với con dân Israel
  rationale: Thành ngữ בְּנֵי יִשְׂרָאֵל là danh xưng cộng đồng giao ước. “Con dân Israel” tự nhiên hơn lối dịch máy móc “các con trai Israel” và trong câu này làm rõ mong muốn cùng cộng đồng dâng lễ.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Giữ danh riêng của Đức Chúa Trời có trong nguyên văn, thay vì thay bằng một tước hiệu.
- issue: Tính chất của sự ô uế trong לְנֶפֶשׁ אָדָם
  choice: bị ô uế vì xác một người chết
  alternative: bị ô uế do tiếp xúc với thi thể người chết
  rationale: Bản dịch thể hiện rõ đây là ô uế do thi thể nhưng không thêm rõ hành vi “tiếp xúc,” điều chỉ được suy ra từ bối cảnh luật nghi lễ.
- issue: Sắc thái của נִגָּרַע
  choice: bị ngăn không được
  alternative: bị loại ra khỏi
  rationale: Cả hai đều khả dĩ. “Bị ngăn không được” giữ sắc thái thụ động và phù hợp trực tiếp với động từ nguyên mẫu theo sau, còn phương án “bị loại ra khỏi” được ghi chú để bảo tồn sắc thái loại trừ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ô uế” cho phạm trù nghi lễ, “lễ vật” cho קָרְבָּן, và “con dân Israel” như một danh xưng cộng đồng tự nhiên trong tiếng Việt. Mọi dấu chú thích đều xuất hiện trong chính văn.
