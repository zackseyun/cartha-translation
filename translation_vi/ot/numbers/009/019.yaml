revisions:
- from: Khi đám mây ở lâu trên Đền Tạm suốt nhiều ngày, con cái Israel[a] giữ phận sự Yahweh giao[b] và không lên đường.
  to: Khi đám mây ở lại trên Đền Tạm nhiều ngày, con cái Israel[a] giữ điều Yahweh đã giao phó[b] và không lên đường.
  rationale: 'Chỉnh câu cho tự nhiên hơn mà không thay đổi nghĩa: đám mây lưu lại lâu, Israel tuân giữ điều Yahweh giao phó, nên không khởi hành. Chú thích b được sửa để các phương án đều giữ Yahweh là Đấng giao/ra điều phải tuân giữ.'
