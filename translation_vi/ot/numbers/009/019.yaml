source:
  edition: WLC
  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: vi
  text: Khi đám mây ở lại trên Đền Tạm nhiều ngày, con cái Israel[a] giữ điều Yahweh đã giao phó[b] và không lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; cũng có thể dịch là “người Israel” hoặc “con cháu Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tuân giữ mệnh lệnh của Yahweh” hoặc “giữ phận sự Yahweh giao”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ
  choice: Khi ... ở lâu
  rationale: Cấu trúc בְּ + động từ nguyên mẫu אָרַךְ mở đầu một mệnh đề thời gian và diễn tả sự kéo dài; “khi ... ở lâu” tự nhiên trong tiếng Việt.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Chỉ đám mây hữu hình gắn với sự hiện diện và dẫn dắt của Yahweh trong ngữ cảnh đồng hoang.
- source_word: עַל הַמִּשְׁכָּן
  choice: trên Đền Tạm
  rationale: עַל diễn tả vị trí ở phía trên; מִשְׁכָּן là nơi thánh lưu động của Israel, được dịch bằng thuật ngữ quen thuộc “Đền Tạm”.
- source_word: יָמִים רַבִּים
  choice: suốt nhiều ngày
  rationale: Diễn tả một khoảng thời gian kéo dài; “suốt nhiều ngày” làm rõ ý thời lượng mà vẫn bám sát nguyên văn.
- source_word: וְשָׁמְרוּ
  choice: giữ
  rationale: שׁמר đi với מִשְׁמֶרֶת mang nghĩa thực hiện hoặc tuân giữ cẩn thận một phận sự, không chỉ là canh gác vật lý.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ sắc thái gia tộc–giao ước của cách nói Hê-bơ-rơ “các con trai của Israel”, đồng thời dùng cách diễn đạt trang trọng và dễ hiểu trong tiếng Việt.
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  choice: phận sự Yahweh giao
  rationale: מִשְׁמֶרֶת chỉ điều được giao phải gìn giữ hoặc thi hành. Cách dịch này tự nhiên hơn “sự canh giữ của Yahweh” và không thu hẹp ý thành một mệnh lệnh đơn lẻ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: וְלֹא יִסָּעוּ
  choice: và không lên đường
  rationale: נסע trong bối cảnh hành trình đồng hoang chỉ việc nhổ trại và khởi hành; “lên đường” là cách nói tiếng Việt hiện đại, rõ nghĩa.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” giúp phân biệt danh riêng với tước hiệu.
- issue: Cách dịch בְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: người Israel; con trai Israel
  rationale: “Con cái Israel” duy trì sắc thái gia tộc của nguyên ngữ mà trong tiếng Việt vẫn có thể chỉ toàn thể cộng đồng; chú thích ghi rõ hình thức nam tính theo sát mặt chữ.
- issue: Sắc thái của מִשְׁמֶרֶת יְהוָה
  choice: phận sự Yahweh giao
  alternative: điều Yahweh truyền phải tuân giữ; trách nhiệm đối với Yahweh
  rationale: Danh từ có thể chỉ điều giao phó, nghĩa vụ hoặc trách nhiệm phải tuân giữ. Bản dịch giữ ý trách nhiệm được giao mà không xác định quá mức đó là một mệnh lệnh riêng lẻ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Đền Tạm” được viết hoa như tên gọi quen thuộc của nơi thánh lưu động; “Yahweh” giữ nguyên danh riêng. Các chú thích bảo tồn hình thức Hê-bơ-rơ và phạm vi nghĩa chưa hoàn toàn đơn nhất của מִשְׁמֶרֶת.
