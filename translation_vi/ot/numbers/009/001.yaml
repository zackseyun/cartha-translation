language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se trong hoang mạc Si-nai[a], vào năm thứ hai sau khi họ ra khỏi đất Ai Cập, trong tháng thứ nhất rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong vùng hoang vu Si-nai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר với dạng kể chuyện mở đầu một lời phán của Đức Chúa Trời; “phán” tự nhiên, trang trọng và thích hợp với chủ thể thần linh.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng danh riêng quen thuộc trong tiếng Việt để thể hiện trực tiếp Danh Thánh יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל sau דבר đánh dấu người tiếp nhận lời phán; cách nói “phán với Môi-se” tự nhiên trong tiếng Việt.
- source_word: בְּמִדְבַּר סִינַי
  choice: trong hoang mạc Si-nai
  rationale: מִדְבָּר chỉ vùng đất hoang vu, khô cằn; “hoang mạc” giữ sắc thái địa hình và văn phong Kinh Thánh mà vẫn dễ hiểu.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: vào ... năm thứ hai
  rationale: Diễn đạt trực tiếp mốc thời gian, được sắp xếp lại cùng cụm “tháng thứ nhất” cho câu tiếng Việt tự nhiên.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: sau khi dân Israel ra khỏi đất Ai Cập
  rationale: Cấu trúc nguyên mẫu với לְ mang nghĩa thời gian tính từ cuộc xuất hành. Chủ ngữ hàm ẩn “họ” được làm rõ là dân Israel theo ngữ cảnh, tránh đại từ thiếu tiền ngữ trong câu đứng riêng.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: vào tháng thứ nhất
  rationale: Bản dịch trực tiếp, tự nhiên của cụm thời gian; không thêm tên tháng vì nguyên văn chỉ nói “tháng thứ nhất”.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: לֵאמֹר giới thiệu nội dung lời phán ở câu kế tiếp; dấu hai chấm cùng “rằng” thể hiện chức năng này tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch Danh Thánh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng chứ không thay bằng tước hiệu. “Đức Giê-hô-va” là hình thức danh riêng đã quen thuộc và trang trọng trong tiếng Việt; không nhằm khẳng định chắc chắn cách phát âm cổ đại.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Trật tự hai mốc thời gian được kết hợp thành “vào tháng thứ nhất của năm thứ hai” để câu tự nhiên, trong khi vẫn giữ đầy đủ nội dung Hê-bơ-rơ. Dùng “dân Israel” để xác định chủ thể của hậu tố số nhiều trong לְצֵאתָם theo ngữ cảnh sách Dân Số.
