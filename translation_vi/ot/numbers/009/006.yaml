id: NUM.9.6
reference: Numbers 9:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: vi
  text: Có những người đàn ông bị ô uế vì thi thể của một người[a], nên họ không thể giữ lễ Vượt Qua vào ngày hôm ấy; họ đến trước mặt Môi-se và A-rôn vào ngày hôm ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “ô uế vì nephesh của một người”; trong ngữ cảnh luật thanh sạch, đây là thành ngữ chỉ sự ô uế do thi thể người gây ra.
    reason: Giải thích thành ngữ Hê-bơ-rơ và bảo tồn dấu vết của cách diễn đạt nguyên ngữ.
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: Có những người
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt để mở ra một tình huống mới trong trình thuật; “người” ở đây chỉ những người nam theo אֲנָשִׁים, nhưng ngữ cảnh không cần thêm “đàn ông” một cách nặng nề.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: bị ô uế vì một thi thể
  rationale: Diễn đạt thành ngữ về tình trạng ô uế nghi lễ do thi thể người gây ra, tránh hiểu נֶפֶשׁ theo nghĩa đen là “linh hồn” trong cụm này.
- source_word: וְלֹא יָכְלוּ
  choice: nên ... không thể
  rationale: Làm rõ quan hệ hệ quả giữa tình trạng ô uế và việc không thể giữ lễ, phù hợp mạch nghĩa của câu.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: giữ lễ Vượt Qua
  rationale: Động từ עשה trong cụm này mang nghĩa cử hành hoặc tuân giữ lễ; “giữ lễ” vừa tự nhiên vừa bảo toàn sắc thái tuân hành.
- source_word: בַּיּוֹם הַהוּא
  choice: hôm ấy / chính hôm ấy
  rationale: Hai lần lặp lại được giữ về mặt ý nghĩa; lần thứ hai thêm “chính” để diễn đạt sự nhấn mạnh tự nhiên mà không lược bỏ chi tiết.
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: họ đến trình diện trước
  rationale: קרב là đến gần, còn לִפְנֵי là trước mặt; trong bối cảnh đến gặp các lãnh đạo để trình bày sự việc, “đến trình diện trước” tự nhiên và không khẳng định quá mức rằng đây là một thủ tục pháp lý.
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: Môi-se ... A-rôn
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: Trình bày đây là tình trạng ô uế do một thi thể người gây ra, không hàm ý tội lỗi đạo đức.
  alternative: Dịch sát mặt chữ là “ô uế vì linh hồn/sinh mạng của một người”.
  rationale: Trong luật thanh sạch của Ngũ Kinh, cụm từ này chỉ sự ô uế nghi lễ liên quan đến người chết; dịch theo nghĩa đen của נֶפֶשׁ sẽ gây hiểu lầm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ô uế” để giữ thuật ngữ nghi lễ quen thuộc; dùng “thi thể” thay vì “xác chết” nhằm duy trì sắc thái trang nghiêm. Dấu chấm tách hai vế dài cho câu tiếng Việt sáng rõ hơn mà không thay đổi quan hệ nội dung.
