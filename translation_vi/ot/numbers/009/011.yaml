  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: vi
  text: Vào tháng thứ hai, ngày mười bốn, lúc chạng vạng[a], họ phải cử hành lễ ấy; họ phải ăn lễ vật đó cùng với bánh không men và rau đắng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa Hê-bơ-rơ: “giữa hai buổi chiều”, một thành ngữ chỉ khoảng thời gian quanh lúc mặt trời lặn hoặc chạng vạng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: Vào tháng thứ hai
  rationale: Trong ngữ cảnh lịch pháp, חֹדֶשׁ mang nghĩa thông thường là “tháng”; cụm giới từ được chuyển thành trạng ngữ thời gian tự nhiên trong tiếng Việt.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: ngày mười bốn
  rationale: Cấu trúc số đếm với יוֹם diễn tả ngày trong tháng; “ngày mười bốn” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: בֵּין הָעַרְבַּיִם
  choice: lúc chạng vạng
  rationale: Thành ngữ Hê-bơ-rơ chỉ khoảng thời gian quanh lúc mặt trời lặn. “Lúc chạng vạng” rõ nghĩa trong tiếng Việt, còn nghĩa sát chữ được giữ trong chú thích.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: họ phải cử hành lễ ấy
  rationale: Trong ngữ cảnh lễ Vượt Qua, עשה không chỉ có nghĩa chung là “làm” mà là thực hiện hay cử hành nghi lễ. “Phải” phù hợp với tính chất chỉ thị pháp định.
- source_word: עַל מַצּוֹת
  choice: cùng với bánh không men
  rationale: Trong ngữ cảnh ăn uống, עַל diễn tả sự đi kèm; מַצּוֹת là bánh không dùng men. Cách dịch này tự nhiên và giữ đúng quan hệ cú pháp.
- source_word: וּמְרֹרִים
  choice: và rau đắng
  rationale: Danh từ số nhiều chỉ những loại rau có vị đắng dùng trong bữa lễ; “rau đắng” là cách gọi rõ ràng, quen thuộc.
- source_word: יֹאכְלֻהוּ
  choice: họ phải ăn lễ vật đó
  rationale: Động từ có hậu tố ngôi thứ ba giống đực số ít, quy chiếu về vật của lễ Vượt Qua. Thêm danh từ “lễ vật” trong tiếng Việt giúp tránh đại từ “nó” thiếu trang trọng mà không giải quyết quá mức vật quy chiếu cụ thể là phần nào của lễ vật.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cử hành lễ ấy” để thể hiện bối cảnh nghi lễ, đồng thời giữ đại từ chỉ hồi thay vì tự ý thêm tên lễ vào câu. Dấu chú thích được đặt ngay sau “lúc chạng vạng”, đúng với cụm từ mà chú thích giải nghĩa.
