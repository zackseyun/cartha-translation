revisions:
- from: Nhưng người nào thanh sạch, không phải đang đi xa, mà lại không giữ lễ Vượt Qua, thì người ấy sẽ bị dứt khỏi dân mình[a], vì đã không dâng lễ vật của Yahweh vào đúng thời điểm đã định; người ấy sẽ mang lấy tội mình[b].
  to: Nhưng người nào thanh sạch, không đang đi đường xa, mà lại không giữ lễ Vượt Qua, thì người ấy sẽ bị dứt khỏi dân mình[a], vì đã không dâng lễ vật của Yahweh vào thời điểm đã định; người ấy sẽ mang tội mình[b].
  rationale: Bản sửa chỉ điều chỉnh cách diễn đạt để tự nhiên hơn và làm rõ rằng ngoại lệ liên quan đến tình trạng đang đi đường, không phải mức độ đi xa. Thành ngữ về hình phạt và trách nhiệm về tội vẫn được giữ nguyên, không áp đặt cách hiểu giáo phái hoặc xác định hình thức hình phạt đang được tranh luận.
  reviewer_model: gpt-5.6-terra
