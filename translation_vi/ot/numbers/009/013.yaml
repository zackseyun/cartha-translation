source:
  edition: WLC
  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: vi
  text: Nhưng người nào thanh sạch, không đang đi đường xa, mà lại không giữ lễ Vượt Qua, thì người ấy sẽ bị dứt khỏi dân mình[a], vì đã không dâng lễ vật của Yahweh vào thời điểm đã định; người ấy sẽ mang tội mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “linh hồn ấy sẽ bị dứt khỏi dân mình.” Thành ngữ Hê-bơ-rơ này chỉ sự phán xét nghiêm khắc trong giao ước, nhưng tại đây không nói rõ hình phạt được thi hành bằng cách nào.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ chịu tội mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: thanh sạch
  rationale: Trong ngữ cảnh nghi lễ, từ này chỉ tình trạng thanh sạch theo nghi thức, không chủ yếu nói đến sự trong sạch đạo đức.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: không phải đang đi xa
  rationale: Cụm từ đối lập với trường hợp được miễn vì đang trên đường hoặc ở xa; cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ hoàn cảnh đi xa.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: mà lại không giữ lễ Vượt Qua
  rationale: חָדַל diễn tả việc không làm hoặc bỏ không làm; 'giữ lễ Vượt Qua' bao quát việc cử hành theo quy định mà không thu hẹp chỉ còn hành động dâng sinh tế.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ
  choice: người ấy sẽ bị dứt khỏi dân mình
  rationale: נפש ở đây chỉ một con người. 'Bị dứt khỏi dân mình' giữ nguyên thành ngữ phán xét giao ước, không tự ý xác định hình thức thi hành.
- source_word: קָרְבַּן יְהוָה
  choice: lễ vật của Yahweh
  rationale: קָרְבָּן là vật được đem đến dâng cho Đức Chúa Trời; cách dịch này rõ nghĩa và giữ quan hệ sở hữu trong nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm tên riêng của Đức Chúa Trời, phù hợp lớp tham khảo đã cung cấp và phân biệt tên riêng với tước hiệu.
- source_word: בְּמֹעֲדוֹ
  choice: vào đúng thời điểm đã định
  rationale: מוֹעֵד chỉ thời điểm cố định được quy định cho việc cử hành; 'đúng' truyền đạt sắc thái phải dâng vào thời điểm ấy.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: sẽ mang lấy tội mình
  rationale: Giữ hình ảnh và thành ngữ Hê-bơ-rơ về việc chịu trách nhiệm cùng hậu quả của tội, thay vì diễn giải hoàn toàn thành 'chịu hình phạt'.
theological_decisions:
- issue: Ý nghĩa của hình phạt 'bị dứt khỏi dân mình'
  choice: Giữ thành ngữ 'sẽ bị dứt khỏi dân mình' và không xác định chính xác cách thi hành.
  alternative: Bị khai trừ khỏi cộng đồng; hoặc bị xử tử.
  rationale: Câu này không nói rõ hình phạt là khai trừ, tử hình hay sự phán xét trực tiếp của Đức Chúa Trời; giữ thành ngữ bảo toàn sự mơ hồ và sức nặng pháp lý-thần học của nguyên văn.
- issue: Ý nghĩa của 'mang lấy tội mình'
  choice: Giữ cách nói 'mang lấy tội mình'.
  alternative: Chịu tội mình; mang lấy sự mắc tội của mình.
  rationale: Thành ngữ có thể bao hàm cả tình trạng mắc tội lẫn hậu quả phải chịu; bản dịch chính không thu hẹp ý nghĩa vào chỉ một khía cạnh.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng 'thanh sạch' cho tình trạng nghi lễ, 'giữ lễ Vượt Qua' cho việc cử hành, và giữ các thành ngữ giàu sức nặng của nguyên văn. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
