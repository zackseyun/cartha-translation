  - severity: low
    issue: Cụm “để lại chút nào” không nêu rõ đối tượng quy chiếu.
    rationale: Đại từ mִמֶּנּוּ (“của nó”) có nghĩa bộ phận. Thêm “phần nào của nó” làm rõ đối tượng mà không thêm ý.
