  terminology: “Lễ Vượt Qua,” “quy định,” và “cử hành” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Không cần đưa diễn giải Kitô học vào câu dịch; chú thích đối chiếu Xuất Ai Cập 12:46 là phù hợp.
