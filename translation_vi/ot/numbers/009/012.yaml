  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: vi
  text: Họ không được để lại phần nào của nó cho đến sáng, cũng không được bẻ gãy xương nào của nó[a]. Họ phải cử hành lễ Vượt Qua theo mọi quy định về lễ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quy định không làm gãy xương cũng được nêu trong Xuất Ai Cập 12:46.
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: không được để lại chút nào đến sáng
  rationale: Động từ Hiphil יַשְׁאִירוּ mang nghĩa “để lại, để còn”; מִמֶּנּוּ có nghĩa bộ phận. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên giới hạn thời gian עַד בֹּקֶר.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: cũng không được làm gãy một chiếc xương nào của nó
  rationale: Danh từ số ít עֶצֶם được dùng theo nghĩa phân phối; “một chiếc xương nào” diễn đạt rõ lệnh cấm mà không làm đổi nghĩa. בוֹ được chuyển tự nhiên thành “của nó” trong quan hệ với con vật dùng cho lễ.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: theo mọi quy định về lễ Vượt Qua
  rationale: חֻקָּה chỉ quy định hay điều lệ đã được ấn định; cấu trúc số ít với כָּל nói đến toàn bộ khuôn phép của lễ. “Mọi quy định” là tiếng Việt hiện đại, rõ nghĩa hơn một cấu trúc sát chữ nhưng gượng như “toàn bộ điều lệ”.
- source_word: הַפֶּסַח
  choice: lễ Vượt Qua
  rationale: Từ này có thể chỉ nghi lễ, bữa lễ hoặc vật tế lễ tùy ngữ cảnh. Ở mệnh đề cuối, “lễ Vượt Qua” giữ phạm vi nghi lễ rộng, không thu hẹp thành riêng con sinh tế.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: Họ phải cử hành lễ ấy
  rationale: עשה khi đi với một lễ nghi có nghĩa là thực hiện hay cử hành. “Cử hành” vừa tự nhiên vừa thể hiện đây là việc tuân giữ một nghi lễ đã được quy định.
theological_decisions:
- issue: Ý nghĩa liên văn bản của quy định không làm gãy xương
  choice: Chuyển ngữ trực tiếp như một quy định của lễ Vượt Qua trong bối cảnh Dân Số Ký.
  alternative: Dùng cách diễn đạt nhằm làm nổi bật trước sự ứng nghiệm Kitô học về sau.
  rationale: Bản văn Hê-bơ-rơ tại đây chỉ nêu quy định về lễ Vượt Qua. Không nên đưa cách giải thích thần học của những văn bản về sau vào chính câu dịch, nhưng có thể nêu mối liên hệ với Xuất Ai Cập 12:46 trong chú thích.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “không được” và “phải” để thể hiện lực mệnh lệnh; “cử hành lễ Vượt Qua” là cách nói quen thuộc, dễ hiểu. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
