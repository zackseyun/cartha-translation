id: NUM.9.15
reference: Numbers 9:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: vi
  text: Vào ngày Đền Tạm được dựng lên, đám mây bao phủ Đền Tạm, tức là lều của lời chứng[a]. Về đêm, đám mây ở trên Đền Tạm, có hình dạng như lửa, cho đến sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lều chứng ước.” Từ Hê-bơ-rơ עֵדוּת nghĩa là “lời chứng” hoặc “chứng tích”; trong ngữ cảnh này, từ ấy chỉ lời chứng có liên hệ với giao ước được lưu giữ tại đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם
  choice: Vào ngày
  rationale: Diễn đạt tự nhiên cụm thời gian; liên từ וּ không cần được chuyển thành một từ nối riêng ở đầu câu tiếng Việt.
- source_word: הָקִים אֶת הַמִּשְׁכָּן
  choice: Đền Tạm được dựng lên
  rationale: Cấu trúc nguyên ngữ mang chức năng thời gian được chuyển thành mệnh đề bị động tự nhiên, giữ trọng tâm ở việc dựng Đền Tạm.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ tiếng Việt quen thuộc, chỉ nơi thánh lưu động của Israel trong hoang mạc.
- source_word: כִּסָּה הֶעָנָן
  choice: đám mây bao phủ
  rationale: Giữ nghĩa trực tiếp của động từ 'che phủ' và tính xác định của đám mây đã được biết đến trong văn mạch.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: tức là Lều Chứng Ước
  rationale: Hiểu cụm này theo chức năng đồng vị, xác định rõ hơn Đền Tạm; 'Chứng Ước' diễn đạt thuật ngữ phụng tự עֵדוּת mà không biến cụm này thành một địa điểm riêng.
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: Từ chiều tối ... đám mây ở
  rationale: Dạng vị hoàn thành được hiểu là tình trạng kéo dài hoặc thường xuyên trong lời mô tả. Nêu lại 'đám mây' giúp tiếng Việt rõ chủ thể.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: trông như lửa
  rationale: Giữ tính so sánh về thị giác, không khẳng định đám mây chính là lửa.
- source_word: עַד בֹּקֶר
  choice: cho đến sáng
  rationale: Diễn đạt tự nhiên điểm kết thúc về thời gian.
theological_decisions:
- issue: Quan hệ giữa 'Đền Tạm' và 'Lều Chứng Ước'
  choice: Cụm thứ hai là thành phần đồng vị giải thích cụm thứ nhất
  alternative: 'Hiểu giới từ לְ theo sắc thái vị trí hoặc hướng đến: đám mây phủ Đền Tạm tại/hướng về Lều Chứng Ước'
  rationale: Cú pháp và văn mạch phù hợp nhất với cách hiểu hai danh xưng cùng chỉ một công trình; 'tức là' làm rõ quan hệ ấy trong tiếng Việt.
- issue: Bản chất của hiện tượng ban đêm
  choice: Đám mây trông như lửa
  alternative: Đám mây trở thành hoặc chính là lửa
  rationale: כְּמַרְאֵה biểu thị sự tương tự về dáng vẻ, nên không đồng nhất hiện tượng với lửa.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu ngắn và thuật ngữ Kinh Thánh quen thuộc. Dấu chấm tách hai vế thời gian để câu tiếng Việt sáng rõ; chủ thể 'đám mây' được nhắc lại thay cho đại từ dễ mơ hồ.
