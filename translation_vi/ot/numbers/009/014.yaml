  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: vi
  text: Nếu một ngoại kiều cư ngụ cùng anh em cử hành lễ Vượt Qua cho Yahweh, người ấy phải cử hành theo quy định của lễ Vượt Qua và theo thể lệ của lễ ấy. Người ấy phải làm như vậy. Một quy định sẽ áp dụng cho anh em, cho ngoại kiều[a] và cho người bản xứ trong xứ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngoại kiều” dịch từ từ Hê-bơ-rơ gēr, chỉ người ngoại quốc cư ngụ giữa dân Israel, không chỉ là khách qua đường.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người sinh trưởng trong xứ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu trường hợp có điều kiện; trong tiếng Việt, “Nếu” tự nhiên và vẫn nối mạch với luật lệ trước đó.
- source_word: יָגוּר ... גֵּר
  choice: một ngoại kiều cư ngụ giữa anh em
  rationale: גֵּר chỉ người ngoại quốc định cư giữa Israel chứ không phải khách qua đường; “ngoại kiều” giữ được sắc thái pháp lý, còn “cư ngụ giữa” diễn đạt quan hệ định cư trong cộng đồng.
- source_word: וְעָשָׂה פֶסַח
  choice: muốn giữ lễ Vượt Qua
  rationale: Cụm “làm lễ Vượt Qua” là thành ngữ chỉ việc tuân giữ/cử hành nghi lễ. “Giữ lễ” vừa tự nhiên vừa bảo toàn ý nghĩa nghi lễ.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giới từ לְ biểu thị hướng quy về hoặc sự dâng dành cho Yahweh; “dâng lên” phù hợp với sắc thái thờ phượng trong ngữ cảnh.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: theo quy định ... của lễ Vượt Qua
  rationale: חֻקָּה là điều được ấn định có tính ràng buộc; “quy định” rõ ràng và tự nhiên trong văn phong pháp luật hiện đại.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: và thể lệ của lễ Vượt Qua
  rationale: מִשְׁפָּט ở đây là quy tắc hoặc cách thức đúng để thực hiện nghi lễ. “Thể lệ” phân biệt vừa đủ với חֻקָּה mà không cường điệu khác biệt ngữ nghĩa.
- source_word: כֵּן יַעֲשֶׂה
  choice: Người ấy phải làm như vậy
  rationale: Giữ nguyên sự nhấn mạnh rằng người ngoại kiều phải tuân theo cách thức vừa được quy định.
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: Chỉ có một quy định
  rationale: Diễn đạt tự nhiên lời tuyên bố rằng cùng một quy định có hiệu lực cho các nhóm được nêu.
- source_word: לָכֶם וְלַגֵּר
  choice: cho anh em, cho ngoại kiều
  rationale: Lặp lại “cho” để phản ánh giới từ lặp trong tiếng Hê-bơ-rơ và nhấn mạnh việc áp dụng đồng đều.
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: và cho người bản xứ trong xứ
  rationale: אֶזְרַח đối lập với גֵּר và chỉ người thuộc dân bản địa; cách dịch này tránh nhập các khái niệm chính trị hiện đại như “công dân”.
theological_decisions:
- issue: Cách chuyển danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA hoặc Giê-hô-va
  rationale: Bản văn trực tiếp dùng danh giao ước YHWH; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi của quy định chung dành cho Israel và ngoại kiều
  choice: Cùng một quy định áp dụng cho cộng đồng được nói đến, ngoại kiều và người bản xứ trong việc giữ lễ Vượt Qua
  alternative: Tuyên bố một sự bình đẳng pháp lý phổ quát vượt ngoài ngữ cảnh lễ Vượt Qua
  rationale: Mệnh đề “một quy định” nhấn mạnh sự áp dụng như nhau trong ngữ cảnh nghi lễ hiện tại; bản dịch không mở rộng lời này sang mọi lĩnh vực mà câu không trực tiếp đề cập.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” ở số nhiều để chuyển đại từ לָכֶם hướng đến cộng đồng Israel; dùng thuật ngữ pháp lý phổ thông “quy định” và “thể lệ,” đồng thời tránh các từ cổ hoặc khái niệm công dân hiện đại.
