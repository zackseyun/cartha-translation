revisions:
- from: Nếu có một ngoại kiều cư ngụ giữa anh em và muốn giữ lễ Vượt Qua dâng lên Yahweh, thì người ấy phải cử hành theo quy định và thể lệ của lễ Vượt Qua. Người ấy phải làm như vậy. Chỉ có một quy định cho anh em, cho ngoại kiều[a] và cho người bản xứ trong xứ[b].
  to: Nếu một ngoại kiều cư ngụ cùng anh em cử hành lễ Vượt Qua cho Yahweh, người ấy phải cử hành theo quy định của lễ Vượt Qua và theo thể lệ của lễ ấy. Người ấy phải làm như vậy. Một quy định sẽ áp dụng cho anh em, cho ngoại kiều[a] và cho người bản xứ trong xứ[b].
  rationale: Sửa các chỗ thêm sắc thái ý định hoặc dâng tế lễ, đồng thời diễn đạt lời xác nhận về một quy định chung sát với tiếng Hê-bơ-rơ hơn. Các thuật ngữ chính và các neo chú thích hiện có được giữ lại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:40:03Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc chính của câu và sự phân biệt giữa גֵּר (người ngoại kiều cư trú) với אֶזְרָח (người bản xứ). Tuy nhiên, “muốn giữ” thêm yếu tố ý định mà động từ וְעָשָׂה diễn tả trực tiếp việc cử hành/tuân giữ. “Dâng lên Yahweh” có thể gợi hành vi dâng tế lễ hẹp hơn, trong khi nguyên ngữ nói việc cử hành lễ Vượt Qua cho Yahweh.
  naturalness: Văn phong nhìn chung tự nhiên và trang trọng. “Cư ngụ cùng anh em,” “cử hành lễ Vượt Qua cho Yahweh,” và “một quy định sẽ áp dụng” vừa tự nhiên trong tiếng Việt hiện đại vừa sát nghĩa hơn. Cách này cũng tránh sắc thái loại trừ không cần thiết của “Chỉ có một quy định.”
  terminology: Giữ “ngoại kiều,” “lễ Vượt Qua,” và “Yahweh” là nhất quán. “Quy định” cho חֻקָּה và “thể lệ” cho מִשְׁפָּטוֹ bảo toàn cách diễn đạt pháp lý-nghi lễ với mức phân biệt phù hợp.
  issues:
  - severity: medium
    issue: “muốn giữ lễ Vượt Qua” thêm ý muốn/ý định.
    rationale: וְעָשָׂה פֶסַח nghĩa là “cử hành/giữ lễ Vượt Qua”; trong mệnh đề điều kiện, bản văn không nêu riêng một trạng thái “muốn.”
  - severity: medium
    issue: “dâng lên Yahweh” thu hẹp sắc thái của לַיהוָה.
    rationale: Giới từ này quy việc cử hành lễ về Yahweh. “Dâng lên” có thể khiến người đọc hiểu chủ yếu là dâng một lễ vật, trong khi câu nói về việc cử hành toàn bộ lễ Vượt Qua.
  - severity: low
    issue: “Chỉ có một quy định” thêm sắc thái loại trừ.
    rationale: חֻקָּה אַחַת là lời xác nhận một quy định chung cho các nhóm được nêu; “một quy định sẽ áp dụng” diễn đạt trực tiếp hơn mà không thêm nhấn mạnh “chỉ có.”
