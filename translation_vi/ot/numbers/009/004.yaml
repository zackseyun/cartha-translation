lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: bảo
  rationale: Trong cấu trúc וַיְדַבֵּר ... לַעֲשֹׂת, động từ này không chỉ nêu hành vi nói mà truyền đạt điều cần làm; “bảo” tự nhiên và đúng lực ngữ nghĩa trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Chỉ cộng đồng dân Y-sơ-ra-ên, không nhất thiết chỉ những người con trai; “con dân” vừa dễ hiểu vừa giữ sắc thái thuộc về dân tộc.
- source_word: לַעֲשֹׂת הַפָּסַח
  choice: cử hành lễ Vượt Qua
  rationale: Ở đây עשה kết hợp với פֶּסַח mang nghĩa thực hiện nghi lễ Vượt Qua; “cử hành lễ” rõ nghĩa và tự nhiên hơn cách dịch từng chữ là “làm”.
