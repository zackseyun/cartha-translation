  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: vi
  text: 'Tình trạng ấy luôn luôn như vậy: đám mây che phủ Đền Tạm, còn ban đêm thì trông như lửa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: Cứ như vậy
  rationale: Diễn đạt tự nhiên ý tổng kết về một tình trạng lặp lại đúng theo cách vừa được mô tả trong ngữ cảnh.
- source_word: יִהְיֶה תָמִיד
  choice: luôn luôn
  rationale: Thể vị hoàn trong văn cảnh mang nghĩa tình trạng thường xuyên trong quá khứ; kết hợp với תָמִיד nhấn mạnh tính liên tục.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Danh từ xác định chỉ đám mây đã được nhắc đến ngay trước đó.
- source_word: יְכַסֶּנּוּ
  choice: che phủ Đền Tạm
  rationale: Động từ mang nghĩa che phủ; đại từ hậu tố giống đực số ít hợp lý nhất quy chiếu về Đền Tạm trong câu trước. Lặp lại danh từ giúp tiếng Việt rõ nghĩa mà không thay đổi nội dung.
- source_word: וּמַרְאֵה אֵשׁ
  choice: còn ... thì có hình dạng như lửa
  rationale: מַרְאֶה chỉ diện mạo hay vẻ nhìn thấy. Cách dịch này giữ nguyên sự dè dặt của nguyên văn, không khẳng định đó nhất thiết là lửa theo nghĩa vật chất.
- source_word: לָיְלָה
  choice: ban đêm
  rationale: Cách diễn đạt thời gian tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sở chỉ của đại từ hậu tố trong יְכַסֶּנּוּ
  choice: Đền Tạm
  alternative: nó; người ấy
  rationale: Hậu tố giống đực số ít có thể chỉ người hoặc vật về mặt ngữ pháp, nhưng ngữ cảnh trực tiếp nói đám mây phủ trên Đền Tạm. Nêu rõ sở chỉ trong tiếng Việt tránh một đại từ mơ hồ hoặc thiếu tự nhiên.
- issue: Bản chất của hiện tượng ban đêm
  choice: hình dạng như lửa
  alternative: lửa
  rationale: Cụm מַרְאֵה אֵשׁ mô tả điều mắt thấy là diện mạo của lửa; bản dịch không quyết định quá mức rằng hiện tượng ấy chính là lửa vật chất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, sáng rõ và trang nghiêm. Dùng “Đền Tạm” theo sở chỉ trong ngữ cảnh gần; cấu trúc “còn ban đêm thì” làm rõ sự tương phản thời gian mà không thêm ý thần học.
