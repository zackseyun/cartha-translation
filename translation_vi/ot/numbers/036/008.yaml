revisions:
- from: Mọi người con gái được thừa hưởng một phần sản nghiệp trong các bộ tộc của con cái Y-sơ-ra-ên đều phải kết hôn với một người thuộc thị tộc trong bộ tộc của cha mình[a], để mỗi người trong con cái Y-sơ-ra-ên giữ được phần sản nghiệp của tổ phụ mình.
  to: Mọi con gái thừa hưởng một phần sản nghiệp thuộc các bộ tộc của con cái Y-sơ-ra-ên đều phải kết hôn với một người thuộc thị tộc trong bộ tộc của cha mình[a], để con cái Y-sơ-ra-ên, mỗi người, thừa hưởng phần sản nghiệp của các tổ phụ mình.
  rationale: Chỉnh động từ mệnh đề mục đích về “thừa hưởng” để không diễn giải quá mức ירשׁ; làm rõ “các tổ phụ” theo số nhiều của nguyên văn; và điều chỉnh đôi chỗ cho tự nhiên đồng thời phản ánh quan hệ xuất thân từ các bộ tộc. Chú thích được rút gọn để neo đúng tại cụm hôn nhân và ghi nhận sắc thái từ vựng liên quan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:26:37Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch nắm đúng cấu trúc luật lệ, cấp bậc “thị tộc/bộ tộc”, và mục đích bảo toàn sản nghiệp theo dòng cha. Tuy nhiên, “giữ được” thu hẹp động từ יִירְשׁוּ (thừa hưởng/sở hữu) thành kết quả bảo toàn, và “tổ phụ mình” không phản ánh rõ số nhiều của אֲבֹתָיו.
  naturalness: Câu nhìn chung tự nhiên, trang trọng và dễ hiểu. “Mọi con gái” tự nhiên hơn “Mọi người con gái”; “thuộc các bộ tộc” phản ánh tự nhiên hơn quan hệ xuất thân mà giới từ מִן diễn tả.
  terminology: “Phần sản nghiệp,” “thị tộc,” và “bộ tộc” phù hợp bối cảnh đất đai và cơ cấu thân tộc. “Con cái Y-sơ-ra-ên” là cách dùng Việt ngữ quen thuộc cho בני ישראל. “Các tổ phụ” cần được dùng để giữ số nhiều và khung phụ hệ của nguyên văn.
  issues:
  - severity: medium
