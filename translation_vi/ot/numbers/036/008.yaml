source:
  edition: WLC
  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: vi
  text: Mọi con gái thừa hưởng một phần sản nghiệp thuộc các bộ tộc của con cái Y-sơ-ra-ên đều phải kết hôn với một người thuộc thị tộc trong bộ tộc của cha mình[a], để con cái Y-sơ-ra-ên, mỗi người, thừa hưởng phần sản nghiệp của các tổ phụ mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đều phải trở thành vợ của một người thuộc thị tộc trong bộ tộc của cha mình.” Động từ “thừa hưởng” trong mệnh đề sau cũng có thể mang nghĩa “sở hữu”.'
    reason: Ghi nhận lối diễn đạt sát thành ngữ “trở thành vợ của” và biên độ nghĩa thừa hưởng/sở hữu của ירשׁ, không thay đổi ý nghĩa chính văn.
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: được thừa hưởng một phần sản nghiệp
  rationale: Phân từ יֹרֶשֶׁת mô tả người con gái ở địa vị thừa kế; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ sắc thái pháp lý về quyền hưởng đất gia truyền.
- source_word: נַחֲלָה
  choice: phần sản nghiệp
  rationale: Trong bối cảnh phân chia đất theo bộ tộc, từ này chỉ phần đất được truyền lại; “phần sản nghiệp” vừa dễ hiểu vừa thể hiện đây là phần sở hữu gia truyền.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: trong các bộ tộc của con cái Y-sơ-ra-ên
  rationale: Giữ rõ מַטּוֹת là các bộ tộc và bảo tồn thành ngữ giao ước mang hình thức giống đực בְּנֵי יִשְׂרָאֵל bằng “con cái Y-sơ-ra-ên”, cách gọi truyền thống và tự nhiên trong tiếng Việt.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: thuộc thị tộc trong bộ tộc của cha mình
  rationale: “Thị tộc” phân biệt đơn vị thân tộc מִשְׁפָּחָה với đơn vị lớn hơn là “bộ tộc” מַטֶּה, qua đó giữ cấu trúc xã hội lồng nhau của nguyên văn.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: phải kết hôn với
  rationale: Thành ngữ nguyên văn là “trở thành vợ của”; trong điều luật này, “phải kết hôn với” diễn đạt tự nhiên và giữ lực bắt buộc của mệnh đề.
- source_word: יִירְשׁוּ אִישׁ
  choice: để mỗi người ... giữ được
  rationale: Ở đây ירשׁ có sắc thái tiếp tục chiếm hữu phần đất thừa kế, còn אִישׁ có chức năng phân phối. “Mỗi người ... giữ được” tránh lặp vụng “thừa hưởng phần thừa kế” và làm rõ mục đích bảo toàn sản nghiệp.
- source_word: נַחֲלַת אֲבֹתָיו
  choice: phần sản nghiệp của tổ phụ mình
  rationale: “Tổ phụ” giữ nét phụ hệ của אֲבֹתָיו trong luật thừa kế này, thay vì trung hòa thành “tổ tiên”.
theological_decisions:
- issue: Ngôn ngữ giao ước và pháp lý mang cấu trúc phụ hệ
  choice: Giữ “con cái Y-sơ-ra-ên”, “cha mình” và “tổ phụ mình” trong chính văn.
  alternative: Dùng “người Y-sơ-ra-ên” và “tổ tiên”.
  rationale: Nguyên văn đặt điều luật trong cơ cấu thừa kế theo dòng cha; những hình thức này có ý nghĩa pháp lý trong câu, nên không được trung hòa theo cách làm mờ cấu trúc ấy.
- issue: Sắc thái của ירשׁ trong mệnh đề chỉ mục đích
  choice: Dịch là “giữ được phần sản nghiệp”.
  alternative: Dịch là “thừa hưởng phần sản nghiệp”.
  rationale: Động từ có thể mang nghĩa thừa hưởng hoặc sở hữu. Trong ngữ cảnh ngăn đất chuyển sang bộ tộc khác, ý bảo toàn quyền sở hữu được đặt ở chính văn, đồng thời chú thích ghi nhận cách hiểu thiên về hành vi thừa kế.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng câu rõ ràng đối với độc giả phổ thông. “Thị tộc” được chọn để phân biệt cấp thân tộc với “bộ tộc”; “phần sản nghiệp” duy trì trường nghĩa đất thừa kế xuyên suốt câu.
