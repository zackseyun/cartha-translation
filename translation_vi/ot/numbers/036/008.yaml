  - severity: low
    issue: “Mọi người con gái” và “trong các bộ tộc” hơi kém tự nhiên/chính xác.
    rationale: “Mọi con gái” là cách nói Việt ngữ gọn tự nhiên; “thuộc các bộ tộc” thể hiện tốt hơn nguồn gốc/xuất thân được giới từ מִן đánh dấu.
