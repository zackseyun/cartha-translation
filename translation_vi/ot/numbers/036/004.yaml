  register: Văn phong pháp lý nhưng sáng rõ, trang trọng và hiện đại. Giữ cấu trúc điều kiện “nếu” của nguyên văn và thuật ngữ nhất quán “phần thừa kế” cho đất đai được truyền thừa giữa các bộ tộc.
