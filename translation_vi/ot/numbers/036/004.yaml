revisions:
- from: Và nếu Năm Hân Hỉ đến với con cái Israel[a], phần thừa kế của họ sẽ được nhập vào phần thừa kế của bộ tộc mà họ sẽ thuộc về, còn phần thừa kế ấy sẽ bị trừ khỏi phần thừa kế của bộ tộc tổ phụ chúng tôi.
  to: Và nếu Năm Hân Hỉ đến cho dân Israel[a], phần thừa kế của họ sẽ được nhập vào phần thừa kế của bộ tộc mà họ sẽ thuộc về, còn phần thừa kế ấy sẽ bị trừ khỏi phần thừa kế của bộ tộc của tổ phụ chúng tôi.
  rationale: Sửa giới từ để phản ánh chính xác và tự nhiên ý «Năm Hân Hỉ đến cho dân Israel», đồng thời điều chỉnh cấu trúc sở hữu trong tiếng Việt. Bản dịch vẫn giữ sắc thái điều kiện của וְאִם, không thêm chi tiết về hôn nhân vốn không có trong mệnh đề này, và bảo toàn đại từ số nhiều quy chiếu đến các con gái đang được bàn đến.
  reviewer_model: gpt-5.6-terra
