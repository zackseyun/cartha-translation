  text: וְ/אִם יִהְיֶ֣ה הַ/יֹּבֵל֮ לִ/בְנֵ֣י יִשְׂרָאֵל֒ וְ/נֽוֹסְפָה֙ נַחֲלָתָ֔/ן עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִֽ/נַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔י/נוּ יִגָּרַ֖ע נַחֲלָתָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: vi
  text: Và nếu Năm Hân Hỉ đến cho dân Israel[a], phần thừa kế của họ sẽ được nhập vào phần thừa kế của bộ tộc mà họ sẽ thuộc về, còn phần thừa kế ấy sẽ bị trừ khỏi phần thừa kế của bộ tộc của tổ phụ chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Israel”, một cách gọi dân Israel theo dòng dõi tổ tiên; cũng có thể dịch là “dân Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Và nếu
  rationale: Giữ nguyên sắc thái điều kiện của אִם trong lập luận pháp lý, thay vì chuyển hẳn thành “khi” và làm mất tính giả định trong cách các trưởng tộc trình bày mối lo ngại.
- source_word: יִהְיֶה הַיֹּבֵל
  choice: Năm Hân Hỉ đến
  rationale: Diễn đạt tự nhiên việc kỳ יוֹבֵל наступ đến; “Năm Hân Hỉ” là cách gọi trang trọng, dễ hiểu trong ngữ cảnh Kinh Thánh.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: với con cái Israel
  rationale: Phản ánh trực tiếp thành ngữ Hê-bơ-rơ “các con trai/con cái Israel”, đồng thời dùng “con cái” để chỉ cộng đồng hậu duệ Israel một cách tự nhiên trong tiếng Việt.
- source_word: וְנוֹסְפָה נַחֲלָתָן
  choice: phần thừa kế của họ sẽ được nhập vào
  rationale: Dạng Niphal của יסף diễn tả việc phần đất thừa kế được thêm hay sáp nhập vào phần đất của bộ tộc khác; “được nhập vào” phù hợp ngữ cảnh phân chia đất.
- source_word: נַחֲלָתָן
  choice: phần thừa kế của họ
  rationale: נחלה ở đây là phần đất được truyền thừa. Đại từ giống cái số nhiều quy chiếu đến các con gái đang được bàn đến, nhưng tiếng Việt không đánh dấu giống.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: vào phần thừa kế của bộ tộc
  rationale: Với יסף, giới từ עַל biểu thị sự thêm vào một phần đất khác; “nhập vào” tự nhiên hơn cách dịch máy móc “ở trên”.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: mà họ sẽ thuộc về
  rationale: 'Chuyển tải quan hệ được mô tả trong ngữ cảnh: các con gái sẽ gắn với bộ tộc của những người họ lấy làm chồng. Cách dịch không chèn trực tiếp động từ “kết hôn”, vốn không xuất hiện trong chính mệnh đề này.'
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: khỏi phần thừa kế của bộ tộc tổ phụ chúng tôi
  rationale: Giữ sự đối lập giữa bộ tộc nhận đất và bộ tộc tổ tiên của những người đang phát biểu.
- source_word: יִגָּרַע
  choice: sẽ bị trừ khỏi
  rationale: גרע diễn tả việc làm giảm hoặc lấy bớt. “Bị trừ khỏi” thể hiện chính xác việc một phần đất bị chuyển ra khỏi phần thừa kế của bộ tộc.
