id: NUM.36.1
reference: Numbers 36:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: vi
  text: Bấy giờ, các trưởng gia tộc thuộc thị tộc của con cháu Ga-la-át, con Ma-ki, con Ma-na-se, từ các thị tộc của con cháu Giô-sép, đến gần và nói trước mặt Môi-se và các thủ lĩnh[a], tức là các trưởng gia tộc của con dân Y-sơ-ra-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “các vị lãnh đạo”. Từ Hê-bơ-rơ chỉ các thủ lĩnh, trong ngữ cảnh này được xác định là những trưởng gia tộc của con dân Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: đến gần
  rationale: Giữ hình ảnh cụ thể của động từ קרב, đồng thời phù hợp với bối cảnh họ chính thức đến trình một vụ việc.
- source_word: רָאשֵׁי הָאָבוֹת / רָאשֵׁי אָבוֹת
  choice: những người đứng đầu các gia tộc
  rationale: Thành ngữ Hê-bơ-rơ chỉ các vị lãnh đạo được công nhận của những đơn vị thân tộc theo dòng cha; cách dịch này tự nhiên hơn trong tiếng Việt hiện đại mà vẫn giữ cơ cấu gia tộc.
- source_word: לְמִשְׁפַּחַת
  choice: thuộc thị tộc
  rationale: Tiền tố ל biểu thị quan hệ thuộc về; “thị tộc” phân biệt מִשְׁפָּחָה với đơn vị gia tộc nhỏ hơn được hàm ý trong אָבוֹת.
- source_word: בְּנֵי גִלְעָד
  choice: con cháu Ga-la-át
  rationale: Trong phả hệ tập thể, בְּנֵי chỉ hậu duệ chứ không nhất thiết là các con trai trực tiếp; “con cháu” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: con Ma-ki, con Ma-na-se
  rationale: Giữ nguyên chuỗi phả hệ lặp lại “con” của bản Hê-bơ-rơ.
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: trong các thị tộc của con cháu Giô-sép
  rationale: מִן xác định nguồn gốc hay vị trí trong tập hợp rộng hơn; “trong” diễn đạt tự nhiên quan hệ phân cấp này.
- source_word: וַיְדַבְּרוּ
  choice: trình bày
  rationale: Trong bối cảnh đến trước các nhà lãnh đạo để nêu vụ việc, “trình bày” truyền đạt sắc thái chính thức mà không thêm nội dung vào lời nói.
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂאִים
  choice: trước mặt Môi-se cùng các thủ lĩnh
  rationale: לִפְנֵי diễn tả việc hiện diện trước các thẩm quyền; נְשִׂיאִים là các thủ lĩnh bộ tộc.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Truyền đạt danh xưng tập thể theo nghĩa dân tộc trong tiếng Việt tự nhiên, đồng thời vẫn giữ yếu tố “con” của biểu thức Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “gia tộc” cho đơn vị thân tộc theo dòng cha trong thành ngữ רָאשֵׁי אָבוֹת, và “thị tộc” cho מִשְׁפָּחָה để thể hiện các tầng trong cơ cấu bộ tộc. Tên riêng theo dạng phiên âm Kinh Thánh tiếng Việt quen thuộc.
