base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: vi
  text: Mách-la, Tiệt-sa, Hốc-la, Minh-ca và Nô-a, các con gái của Xê-lô-phát, đã lấy các con trai của các chú bác của mình[a] làm chồng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói rõ hơn: “các con trai của những người anh em trai của cha họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: đã lấy … làm chồng
  rationale: Trong công thức hôn nhân này, động từ היה cùng לְנָשִׁים diễn tả việc các phụ nữ bước vào quan hệ hôn nhân. Cách nói này tự nhiên trong tiếng Việt và giữ rõ sự chuyển sang tình trạng làm vợ.
- source_word: בְּנוֹת
  choice: các con gái
  rationale: Nghĩa thông thường trong văn cảnh gia phả, xác định họ là các con gái trực hệ của Xê-lô-phát.
- source_word: צְלָפְחָד
  choice: Xê-lô-phát
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết rõ ràng, quen thuộc trong tiếng Việt.
- source_word: לִבְנֵי
  choice: các con trai của
  rationale: Giới từ ל trong văn cảnh hôn nhân chỉ những người nam mà họ kết hôn; cấu trúc tiếng Việt được hoàn chỉnh bằng cụm “lấy … làm chồng”.
- source_word: דֹדֵיהֶן
  choice: các chú bác mình
  rationale: דּוֹד ở đây chỉ các anh em trai của cha họ. “Chú bác” là cách gọi tự nhiên trong tiếng Việt; chú thích làm rõ quan hệ bên cha mà không khiến câu chính nặng nề.
- source_word: לְנָשִׁים
  choice: làm chồng
  rationale: Nguyên ngữ nói họ trở thành vợ của những người nam ấy. Tiếng Việt diễn đạt tự nhiên cùng một quan hệ bằng “lấy … làm chồng”, không thay đổi vai trò hôn nhân được nêu.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: Mách-la, Tiệt-sa, Hốc-la, Minh-ca và Nô-a
  rationale: Giữ nguyên thứ tự các tên trong bản Hê-bơ-rơ và phiên âm nhất quán sang tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “lấy … làm chồng” tự nhiên hơn lối dịch sát chữ “trở thành vợ của”, còn chú thích bảo toàn ý nghĩa thân tộc chính xác của דֹדֵיהֶן.
