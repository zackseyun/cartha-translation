source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: vi
  text: 'Họ thưa: “Yahweh đã truyền cho ngài trao đất làm cơ nghiệp cho con cháu Israel[a] bằng cách bắt thăm; và Yahweh cũng đã truyền cho ngài trao phần cơ nghiệp của Xê-lô-phê-hát, người anh em của chúng tôi, cho các con gái ông ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai Israel”; cũng có thể dịch là “dân Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ thưa
  rationale: Động từ có nghĩa cơ bản là “nói”; trong lời các thủ lĩnh kính cẩn trình bày với Môi-se, “thưa” diễn đạt tự nhiên sắc thái giao tiếp mà không thêm nội dung.
- source_word: אֲדֹנִי
  choice: ngài
  rationale: Đây là cách xưng hô kính trọng dành cho Môi-se, không phải danh hiệu thần linh. “Ngài” tự nhiên trong tiếng Việt hiện đại và tránh sự mơ hồ của “chúa tôi”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự, thay vì thay thế bằng một tước hiệu.
- source_word: לָתֵת אֶת־הָאָרֶץ בְּנַחֲלָה
  choice: trao đất làm cơ nghiệp
  rationale: “Trao” phù hợp với việc giao phần đất, còn “cơ nghiệp” giữ sắc thái pháp lý và gia tộc của נַחֲלָה.
- source_word: בְּגוֹרָל
  choice: bằng cách bắt thăm
  rationale: Diễn đạt rõ phương thức phân chia đất được chỉ định trong nguyên văn.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con cháu Israel
  rationale: Cụm Hê-bơ-rơ theo mặt chữ là “các con trai Israel” nhưng ở đây chỉ toàn thể cộng đồng giao ước; “con cháu Israel” vừa tự nhiên vừa giữ liên hệ dòng dõi. Dạng sát chữ được ghi ở chú thích.
- source_word: צֻוָּה בַיהוָה
  choice: Yahweh cũng đã truyền cho ngài
  rationale: Chuyển cấu trúc bị động sang chủ động để tiếng Việt tự nhiên, đồng thời giữ Yahweh là nguồn của mệnh lệnh; “cũng” thể hiện sự song song giữa hai mệnh đề.
- source_word: נַחֲלַת צְלָפְחָד
  choice: phần cơ nghiệp của Xê-lô-phê-hát
  rationale: “Phần cơ nghiệp” làm rõ đây là suất đất thừa kế thuộc về dòng của Xê-lô-phê-hát.
- source_word: אָחִינוּ
  choice: người anh em của chúng tôi
  rationale: Giữ nguyên ngôn ngữ thân tộc của bản Hê-bơ-rơ, không diễn giải thành “người cùng họ hàng”.
- source_word: לִבְנֹתָיו
  choice: cho các con gái ông ấy
  rationale: Diễn đạt trực tiếp những người nhận phần cơ nghiệp và dùng đại từ rõ nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Ngôn ngữ giống đực mang nghĩa tập thể trong לִבְנֵי יִשְׂרָאֵל
  choice: con cháu Israel, kèm chú thích dạng sát chữ
  alternative: các con trai Israel
  rationale: Trong ngữ cảnh phân đất cho toàn dân, cụm này mang nghĩa tập thể. Bản dịch chính tránh khiến độc giả hiểu lầm là chỉ nam giới hoặc mười hai con trai trực tiếp của Gia-cốp, nhưng chú thích vẫn bảo tồn hình thức giống đực của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp một lời trình bày pháp lý trước Môi-se. Dùng “thưa” và “ngài” để thể hiện sự kính trọng; tránh lối xưng hô cổ hoặc dễ bị hiểu là tước hiệu dành cho Đức Chúa Trời.
