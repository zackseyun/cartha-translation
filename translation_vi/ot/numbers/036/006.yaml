    rationale: “Được lấy” có thể bị hiểu là bị động hoặc là một cách nói không chuẩn khi nói về phụ nữ. Nguyên văn cho phép họ trở thành vợ của bất cứ người nào vừa ý họ; “có thể kết hôn với” diễn đạt điều này rõ ràng.
  - severity: low
