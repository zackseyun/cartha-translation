- from: 'Đây là điều Yahweh đã truyền về các con gái của Xê-lô-phát: “Họ được lấy người nào mình thấy là tốt[a], nhưng chỉ được kết hôn trong một gia tộc thuộc bộ tộc của cha mình[b].”'
  to: 'Đây là điều Yahweh đã truyền về các con gái của Xê-lô-phát: “Họ có thể kết hôn với người nào họ thấy là tốt[a], nhưng chỉ được kết hôn với người thuộc một gia tộc trong bộ tộc của cha họ[b].”'
  rationale: Sửa cách diễn đạt về hôn nhân để tiếng Việt rõ và tự nhiên hơn, đồng thời làm minh bạch rằng giới hạn áp dụng cho người chồng thuộc gia tộc trong bộ tộc cha họ. Bản sửa vẫn giữ tương phản giữa sự tự do lựa chọn và điều kiện hạn định của אַךְ.
