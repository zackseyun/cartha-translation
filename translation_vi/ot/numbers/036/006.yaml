  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: vi
  text: 'Đây là điều Yahweh đã truyền về các con gái của Xê-lô-phát: “Họ có thể kết hôn với người nào họ thấy là tốt[a], nhưng chỉ được kết hôn với người thuộc một gia tộc trong bộ tộc của cha họ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “với người tốt trong mắt họ”; tức là người mà họ cho là phù hợp hoặc vừa ý.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “với người thuộc một thị tộc trong bộ tộc của cha họ”. Nguyên văn dùng cả từ chỉ gia tộc/thị tộc lẫn từ chỉ bộ tộc, nhấn mạnh rằng phần thừa kế phải được giữ trong dòng bộ tộc bên cha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Đây là điều
  rationale: דָּבָר có thể là “lời”, “việc” hoặc “điều”. Trong tiếng Việt, “điều” giới thiệu một mệnh lệnh cụ thể một cách tự nhiên mà vẫn giữ sắc thái trang trọng.
- source_word: צִוָּה יְהוָה
  choice: Yahweh đã truyền
  rationale: צוה diễn tả hành động truyền lệnh; dạng hoàn thành được dịch bằng “đã truyền”. Danh riêng giao ước יְהוָה được phiên là “Yahweh” thay vì thay bằng một tước hiệu.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: về các con gái của Xê-lô-phát
  rationale: Giới từ ל đánh dấu những người mà mệnh lệnh liên quan đến. “Về” phù hợp với lời của Môi-se đang thuật lại quy định dành cho họ.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: người nào mình thấy là tốt
  rationale: Cụm từ có nghĩa đen là “người tốt trong mắt họ”, chỉ người mà chính họ cho là phù hợp hoặc vừa ý. Bản dịch giữ hình ảnh “thấy là tốt” nhưng diễn đạt tự nhiên trong tiếng Việt.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: được lấy / được kết hôn
  rationale: Nghĩa đen là “trở thành vợ”. Trong lần thứ nhất, “được lấy” thể hiện sự cho phép; trong lần lặp lại sau אַךְ, “chỉ được kết hôn” thể hiện giới hạn bắt buộc mà không làm câu tiếng Việt nặng nề.
- source_word: אַךְ
  choice: nhưng chỉ
  rationale: אַךְ mang nghĩa hạn định ở đây. “Nhưng chỉ” nêu rõ điều kiện giới hạn quyền lựa chọn vừa được công nhận.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: trong một gia tộc thuộc bộ tộc của cha mình
  rationale: מִשְׁפָּחָה chỉ đơn vị gia tộc/thị tộc, còn מַטֶּה chỉ bộ tộc. Cách dịch giữ rõ cả hai cấp độ thân tộc và dòng bộ tộc bên cha.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng này với các tước hiệu và không đưa thêm một truyền thống hệ phái vào câu.
- issue: Mức độ tự do và giới hạn trong việc chọn chồng
  choice: Giữ đồng thời sự cho phép lựa chọn và điều kiện phải kết hôn trong dòng bộ tộc bên cha
  alternative: Nhấn riêng quyền tự chọn hoặc riêng nghĩa vụ kết hôn
  rationale: Câu Hê-bơ-rơ cố ý đặt quyền lựa chọn (“người tốt trong mắt họ”) bên cạnh hạn định do אַךְ mở đầu. Bản dịch không xóa bỏ sự căng thẳng giữa hai vế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Xê-lô-phát” theo lối phiên âm tên riêng quen thuộc trong tiếng Việt. Hai cách diễn đạt “được lấy” và “chỉ được kết hôn” làm rõ lần đầu là quyền lựa chọn, lần sau là điều kiện hạn định, đồng thời tránh lặp cứng cấu trúc Hê-bơ-rơ.
