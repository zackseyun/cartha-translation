  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: vi
  text: Đây là các điều răn và luật lệ mà Yahweh đã truyền qua Môi-se cho con cái Israel[a] tại đồng bằng Mô-áp, bên sông Giô-đanh, đối diện Giê-ri-cô[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai Israel”; trong cách gọi giao ước này, cụm từ chỉ toàn thể dân Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bên sông Giô-đanh, gần Giê-ri-cô.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Cụm chỉ định số nhiều mở đầu công thức tổng kết; tiếng Việt tự nhiên dùng “Đây là”.
- source_word: הַמִּצְוֺת
  choice: các điều răn
  rationale: Giữ sắc thái pháp lý và thẩm quyền của מִצְוָה, đồng thời là cách nói trang trọng, quen thuộc trong tiếng Việt.
- source_word: וְהַמִּשְׁפָּטִים
  choice: và luật lệ
  rationale: Trong văn cảnh pháp luật, מִשְׁפָּטִים chỉ các quy định hay phán lệ có tính ràng buộc; “luật lệ” rõ nghĩa hơn “phán quyết” đối với độc giả hiện đại.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Diễn đạt hành động ban lệnh có thẩm quyền; “truyền” tự nhiên khi chủ thể là Đức Chúa Trời và vẫn liên kết về nghĩa với “điều răn”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: בְּיַד מֹשֶׁה
  choice: qua Môi-se
  rationale: Thành ngữ Hê-bơ-rơ sát chữ là “bởi tay Môi-se”, chỉ vai trò trung gian hay tác nhân; “qua Môi-se” truyền đạt tự nhiên ý đó.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: cho con cái Israel
  rationale: Giữ hình ảnh quan hệ dòng dõi trong בְּנֵי יִשְׂרָאֵל mà vẫn dùng cách gọi tập thể tự nhiên trong tiếng Việt; chú thích nêu nghĩa sát chữ.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: tại đồng bằng Mô-áp
  rationale: עַרְבֹת chỉ vùng đất bằng hay thảo nguyên; “đồng bằng Mô-áp” là cách gọi địa lý rõ ràng.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: bên sông Giô-đanh, đoạn ngang Giê-ri-cô
  rationale: עַל chỉ vị trí bên sông; cách nói “đoạn ngang Giê-ri-cô” xác định khúc sông tương ứng với Giê-ri-cô mà không ngụ ý địa điểm nằm trong thành.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel / dân Israel
  rationale: Cụm từ có hình thức giống đực nhưng là cách gọi cộng đồng giao ước nói chung; bản dịch giữ hình ảnh dòng dõi và chú thích phạm vi tập thể, không giới hạn vào nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “điều răn và luật lệ” để duy trì sắc thái pháp lý của câu kết sách; dùng địa danh Việt hóa quen thuộc, nhưng giữ “Israel” và danh riêng “Yahweh” theo dạng quốc tế.
