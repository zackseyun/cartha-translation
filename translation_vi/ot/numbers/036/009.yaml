  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: vi
  text: Không phần cơ nghiệp nào được chuyển từ chi tộc này sang chi tộc khác, vì mỗi chi tộc của người Y-sơ-ra-ên[a] phải gắn bó với phần cơ nghiệp của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc “các chi tộc của con trai Y-sơ-ra-ên.” Tiếng Hê-bơ-rơ: “các chi tộc của các con trai Y-sơ-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִסֹּב
  choice: được chuyển
  rationale: Trong bối cảnh luật về đất đai, động từ này chỉ việc cơ nghiệp đổi sang quyền sở hữu của một chi tộc khác, chứ không phải sự xoay chuyển theo nghĩa vật lý.
- source_word: נַחֲלָה
  choice: phần cơ nghiệp
  rationale: Thuật ngữ chỉ phần đất được ban và truyền lại trong cơ cấu chi tộc của Y-sơ-ra-ên; “phần cơ nghiệp” vừa quen thuộc trong văn phong Kinh Thánh vừa làm rõ đây là phần được phân chia.
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: từ chi tộc này sang chi tộc khác
  rationale: מַטֶּה theo nghĩa đen có thể là “cây gậy”, nhưng trong ngữ cảnh pháp lý này rõ ràng chỉ một chi tộc; cách dịch giữ được ý chuyển giao giữa các chi tộc.
- source_word: כִּי
  choice: vì
  rationale: Liên từ đưa ra lý do cho điều cấm ở mệnh đề trước.
- source_word: אִישׁ
  choice: mỗi
  rationale: Từ số ít mang ý phân phối, được hiểu kết hợp với chủ ngữ số nhiều “các chi tộc”; “mỗi chi tộc” diễn đạt tự nhiên trong tiếng Việt.
- source_word: בְּנַחֲלָתוֹ
  choice: với cơ nghiệp của mình
  rationale: Đi với דבק, giới từ diễn tả sự gắn bó với phần cơ nghiệp thuộc về từng chi tộc.
- source_word: יִדְבְּקוּ
  choice: phải gắn bó
  rationale: Giữ hình ảnh “bám chặt/gắn bó” của דבק, đồng thời “phải” phù hợp với tính quy định của văn cảnh luật pháp.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: các chi tộc trong các con trai Y-sơ-ra-ên
  rationale: Giữ thành tố giới tính và cấu trúc giao ước của בְּנֵי יִשְׂרָאֵל, nhưng dùng “trong” để câu tiếng Việt rõ rằng các chi tộc thuộc cộng đồng ấy.
theological_decisions:
- issue: Cách diễn đạt mang giới tính בְּנֵי יִשְׂרָאֵל
  choice: các con trai Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên / người Y-sơ-ra-ên
  rationale: Bản văn Hê-bơ-rơ dùng danh từ giống đực số nhiều “các con trai”, một cách gọi cộng đồng giao ước. Bản dịch giữ cách diễn đạt nguyên văn trong câu chính và chú thích nghĩa tập thể để tránh hiểu rằng chỉ nam giới được nói đến.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ sắc thái pháp lý của điều cấm cùng ẩn dụ “gắn bó” trong nguyên văn. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
