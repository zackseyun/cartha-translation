revisions:
- from: Không một phần cơ nghiệp nào được chuyển từ chi tộc này sang chi tộc khác, vì mỗi chi tộc trong các con trai Y-sơ-ra-ên[a] phải gắn bó với cơ nghiệp của mình.
  to: Không phần cơ nghiệp nào được chuyển từ chi tộc này sang chi tộc khác, vì mỗi chi tộc của người Y-sơ-ra-ên[a] phải gắn bó với phần cơ nghiệp của mình.
  rationale: Sửa duy nhất cách diễn đạt thành ngữ “các chi tộc của các con trai Y-sơ-ra-ên” để tiếng Việt hiện đại rõ và tự nhiên. Thân bài dùng nghĩa tập thể thông dụng “người Y-sơ-ra-ên”; chú thích giữ cách diễn đạt sát mặt chữ của tiếng Hê-bơ-rơ. Các yếu tố pháp lý và phân phối của câu được duy trì.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:22:57Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển đạt đúng ý pháp lý của תִסֹּב là cơ nghiệp không được chuyển giữa các chi tộc, và diễn đạt tốt ý דבק là gắn bó/giữ chặt. Tuy nhiên, cụm “mỗi chi tộc trong các con trai Y-sơ-ra-ên” không phản ánh quan hệ sở thuộc trong מַטּוֹת בְּנֵי יִשְׂרָאֵל một cách rõ ràng trong tiếng Việt; nó có thể gợi rằng các chi tộc nằm bên trong những cá nhân được gọi là ‘các con trai’.
  naturalness: Câu có sắc thái trang trọng phù hợp, nhưng “các chi tộc trong các con trai Y-sơ-ra-ên” không tự nhiên trong tiếng Việt hiện đại. “Mỗi chi tộc của người Y-sơ-ra-ên” vừa rõ chủ thể tập thể vừa tự nhiên hơn. “Phần cơ nghiệp” phù hợp với ngữ cảnh phân chia đất đai.
  terminology: Giữ “chi tộc” cho מַטֶּה và “phần cơ nghiệp” cho נַחֲלָה. Dùng “người Y-sơ-ra-ên” trong thân bài như cách chuyển ngữ thành ngữ tập thể בְּנֵי יִשְׂרָאֵל; chú thích bảo lưu cách diễn đạt sát mặt chữ “các con trai Y-sơ-ra-ên”, tránh hiểu sai rằng đối tượng chỉ là nam giới.
  issues:
  - severity: medium
    issue: Quan hệ ngữ pháp trong “các chi tộc trong các con trai Y-sơ-ra-ên” không rõ và không tự nhiên.
    rationale: Cụm Hê-bơ-rơ có nghĩa là “các chi tộc của con cái/người Y-sơ-ra-ên”, chứ không phải các chi tộc ‘ở trong’ các con trai. Cách sửa làm rõ quan hệ sở thuộc và ý tập thể của thành ngữ mà không làm mất dữ kiện nguyên ngữ.
  revised_text: Không phần cơ nghiệp nào được chuyển từ chi tộc này sang chi tộc khác, vì mỗi chi tộc của người Y-sơ-ra-ên[a] phải gắn bó với phần cơ nghiệp của mình.
