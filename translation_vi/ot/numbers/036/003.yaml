  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: vi
  text: Nếu họ lấy một người thuộc một trong các chi tộc của con dân Y-sơ-ra-ên làm chồng, thì phần thừa kế của họ sẽ bị lấy khỏi phần thừa kế của tổ phụ chúng tôi và được thêm vào phần thừa kế của chi tộc mà người họ lấy làm chồng thuộc về; như vậy, phần ấy sẽ bị lấy khỏi phần thừa kế được chỉ định cho chúng tôi bằng bắt thăm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “khỏi lá thăm của phần thừa kế chúng tôi.” Từ Híp-ri nghĩa đen là “lá thăm”; trong văn cảnh này, nó chỉ phần được chỉ định bằng bắt thăm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: Nếu họ ... lấy ... làm chồng
  rationale: Dạng Híp-ri theo nghĩa đen là “và họ trở thành vợ”, nhưng trong mạch lập luận đây là tình huống giả định. Cách diễn đạt chủ động này tự nhiên trong tiếng Việt và vẫn giữ rõ việc các con gái kết hôn.
- source_word: לְאֶחָד מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: một người thuộc các chi tộc của con dân Y-sơ-ra-ên
  rationale: Giữ ý một người nam thuộc một trong các chi tộc Israel, đồng thời tránh lối dịch tầng tầng “các con trai của các chi tộc của các con trai Israel” vốn khó hiểu trong tiếng Việt.
- source_word: וְנִגְרְעָה
  choice: sẽ bị lấy khỏi
  rationale: Thể bị động của גרע ở đây nói đến việc phần đất không còn thuộc gia sản của chi tộc cũ; “bị lấy khỏi” thể hiện rõ sự mất mát hay chuyển dịch.
- source_word: נַחֲלָתָן
  choice: phần thừa kế của họ
  rationale: נַחֲלָה trong bối cảnh phân chia đất chỉ phần đất được truyền làm gia sản; thêm “phần” giúp câu tiếng Việt tự nhiên và cụ thể.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: khỏi phần thừa kế của tổ phụ chúng tôi
  rationale: “Tổ phụ” giữ sắc thái dòng tộc theo phụ hệ của אָבוֹת và phù hợp văn cảnh gia sản bộ tộc.
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: và được thêm vào phần thừa kế của chi tộc
  rationale: Giữ quan hệ đối xứng giữa phần đất bị lấy khỏi gia sản này và được cộng vào gia sản chi tộc kia.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: mà họ gia nhập
  rationale: Cụm Híp-ri khó chuyển sát từng chữ, theo nghĩa đen gần với “mà họ sẽ thuộc về họ”; trong văn cảnh, nó chỉ sự liên hệ chi tộc phát sinh qua hôn nhân. “Gia nhập” truyền đạt quan hệ ấy mà không khẳng định nhiều hơn điều câu văn hàm ý.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ
  choice: khỏi phần đất chúng tôi được bắt thăm để thừa kế
  rationale: גּוֹרָל trước hết là “lá thăm”, nhưng ở đây chỉ phần đất được ấn định bằng việc bắt thăm. Bản dịch làm rõ cả phương thức phân chia lẫn kết quả.
- source_word: יִגָּרֵעַ
  choice: sẽ bị lấy khỏi
  rationale: Lặp lại cùng động từ với וְנִגְרְעָה để duy trì phép nhấn mạnh và tính chất pháp lý của lời trình bày.
