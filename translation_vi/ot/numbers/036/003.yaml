translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “chi tộc” cho מַטֶּה trong bối cảnh phân chia đất, “tổ phụ” cho quan hệ dòng tộc, và diễn đạt rõ cơ chế chuyển phần đất thừa kế qua hôn nhân. Dấu chú thích [a] xuất hiện trong chính văn.
