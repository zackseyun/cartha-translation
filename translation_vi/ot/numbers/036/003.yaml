revisions:
- from: Nếu họ lấy một người thuộc các chi tộc của con dân Y-sơ-ra-ên làm chồng, thì phần thừa kế của họ sẽ bị lấy khỏi phần thừa kế của tổ phụ chúng tôi và được thêm vào phần thừa kế của chi tộc mà họ gia nhập; như vậy, phần ấy sẽ bị lấy khỏi phần đất chúng tôi được bắt thăm để thừa kế.[a]
  to: Nếu họ lấy một người thuộc một trong các chi tộc của con dân Y-sơ-ra-ên làm chồng, thì phần thừa kế của họ sẽ bị lấy khỏi phần thừa kế của tổ phụ chúng tôi và được thêm vào phần thừa kế của chi tộc mà người họ lấy làm chồng thuộc về; như vậy, phần ấy sẽ bị lấy khỏi phần thừa kế được chỉ định cho chúng tôi bằng bắt thăm.[a]
  rationale: Bản sửa giữ nguyên cấu trúc điều kiện và hai lần nhấn mạnh rằng phần thừa kế bị lấy đi. Cụm chỉ chi tộc đích được làm rõ là chi tộc của người chồng, phản ánh ngữ cảnh trực tiếp của “trở thành vợ cho họ,” không dùng khái niệm “gia nhập.” Vế cuối và chú thích phân biệt nghĩa đen “lá thăm” với nghĩa hoán dụ là phần thừa kế được chỉ định bằng bắt thăm.
