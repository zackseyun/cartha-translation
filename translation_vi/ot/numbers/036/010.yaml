  source_fidelity: 'Bản thảo truyền đạt đúng ý chính: các con gái Xê-lô-phê-hát hành động phù hợp với mệnh lệnh Yahweh đã ban liên quan đến Môi-se. Tuy nhiên, cấu trúc mở đầu bằng chủ ngữ làm giảm độ hiển thị của cặp tương ứng כַּאֲשֶׁר ... כֵּן (“như/thể nào ... cũng như vậy”), vốn là trọng tâm cú pháp của câu.'
