  terminology: Giữ “Yahweh,” “Môi-se,” và “Xê-lô-phê-hát” là nhất quán và phù hợp. “Truyền cho Môi-se” là cách nói tiếng Việt chấp nhận được cho động từ Hebrew có Môi-se làm đối tượng của việc truyền lệnh; không cần diễn giải thêm nội dung mệnh lệnh.
