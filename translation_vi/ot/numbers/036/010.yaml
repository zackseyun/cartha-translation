  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: vi
  text: Yahweh đã truyền cho Môi-se thế nào, thì các con gái của Xê-lô-phê-hát cũng làm như vậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: đúng như ... đã làm
  rationale: Cặp từ chỉ sự tương ứng giữa mệnh lệnh và hành động; cách diễn đạt này tự nhiên trong tiếng Việt và nhấn mạnh họ làm theo điều đã truyền.
- source_word: צִוָּה
  choice: truyền cho
  rationale: Động từ diễn tả việc ban mệnh lệnh; trong tiếng Việt, “truyền cho Môi-se” vừa trang trọng vừa tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: אֶת đánh dấu Môi-se là người nhận mệnh lệnh; tiếng Việt diễn đạt tự nhiên bằng “truyền cho Môi-se”.
- source_word: עָשׂוּ
  choice: đã làm
  rationale: Giữ nghĩa thông thường của động từ và diễn tả hành động hoàn tất của các con gái Xê-lô-phê-hát.
- source_word: בְּנוֹת צְלָפְחָד
  choice: Các con gái của Xê-lô-phê-hát
  rationale: Chuyển trực tiếp cấu trúc sở hữu, rõ ràng và phù hợp văn phong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה; giữ “Yahweh” bảo tồn đặc tính danh riêng mà không thay bằng tước hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh để chủ ngữ đứng đầu, tự nhiên hơn trong tiếng Việt, trong khi vẫn giữ quan hệ tương ứng chính xác giữa mệnh lệnh và hành động.
