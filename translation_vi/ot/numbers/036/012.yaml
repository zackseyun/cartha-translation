  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: vi
  text: Họ lấy chồng trong các thị tộc của con cháu Ma-na-se, con trai Giô-sép[a], và phần cơ nghiệp của họ vẫn được tính vào bộ tộc mà thị tộc cha ông họ thuộc về.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ trong các gia tộc của con cháu Ma-na-se, con trai Giô-sép.” Danh từ chỉ nhóm thân tộc trong tiếng Hê-bơ-rơ có thể dịch là “gia tộc” hoặc “thị tộc”; ở đây “thị tộc” làm rõ hơn cơ cấu bộ tộc của Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: trong các thị tộc
  rationale: 'Giới từ מִן chỉ xuất xứ/phạm vi: những người chồng được chọn từ trong các thị tộc Ma-na-se. “Thị tộc” diễn đạt đơn vị thân tộc trong cơ cấu bộ tộc rõ hơn “gia đình”.'
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: con cháu Ma-na-se, con trai Giô-sép
  rationale: בְּנֵי ở đây chỉ tập thể hậu duệ; “con cháu” tự nhiên và tránh khiến người đọc hiểu chỉ các con trai trực tiếp của Ma-na-se, trong khi vẫn giữ phả hệ Ma-na-se là con trai Giô-sép.
- source_word: הָיוּ לְנָשִׁים
  choice: họ lấy chồng
  rationale: Nghĩa đen là “trở thành vợ”; trong tiếng Việt, “lấy chồng” tự nhiên, giữ các phụ nữ làm chủ thể và diễn đạt đúng sự kiện kết hôn.
- source_word: נַחֲלָתָן
  choice: phần cơ nghiệp của họ
  rationale: Trong ngữ cảnh luật phân chia đất của Dân Số, נַחֲלָה là phần đất thừa hưởng được phân cho dòng tộc; “phần cơ nghiệp” vừa trang trọng vừa thể hiện tính thừa kế.
- source_word: וַתְּהִי
  choice: vẫn thuộc về
  rationale: Động từ cơ bản là “đã là/đã trở thành”, nhưng mạch văn nhấn mạnh phần cơ nghiệp không chuyển sang bộ tộc khác sau hôn nhân; “vẫn thuộc về” diễn đạt hệ quả ấy tự nhiên mà không thay đổi ý pháp lý.
- source_word: עַל מַטֵּה
  choice: thuộc về bộ tộc
  rationale: מַטֶּה ở đây là “bộ tộc”, không phải cây gậy; עַל biểu thị sự gắn với hay được tính vào bộ tộc trong cơ cấu phân chia đất.
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: thị tộc cha họ
  rationale: Chuỗi danh từ số ít mang nghĩa tập thể, chỉ thị tộc bên cha mà các con gái thuộc về. Cách nói ngắn gọn, tự nhiên và giữ được cấu trúc thân tộc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thị tộc” và “bộ tộc” để phân biệt hai cấp trong cơ cấu thân tộc; dùng “lấy chồng” thay cho cách dịch sát nhưng kém tự nhiên “trở thành vợ”. Danh xưng riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
