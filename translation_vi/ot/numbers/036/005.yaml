source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: vi
  text: 'Môi-se truyền lệnh cho con cái Y-sơ-ra-ên theo lời Đức Giê-hô-va[a], rằng: “Chi tộc của con cháu Giô-sép nói đúng.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “theo miệng Đức Giê-hô-va,” nghĩa là theo lời hoặc mệnh lệnh của Ngài.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Chi tộc của con cháu Giô-sép có lý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Giữ sắc thái thẩm quyền của động từ צוה, đồng thời tự nhiên trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Phản ánh thành ngữ gia tộc Hê-bơ-rơ và là cách diễn đạt trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: עַל פִּי יְהוָה
  choice: theo lời Đức Giê-hô-va
  rationale: Diễn đạt tự nhiên ý nghĩa 'theo miệng/lời của YHWH', nhấn mạnh thẩm quyền từ lời phán của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong tiếng Việt để biểu thị trực tiếp danh YHWH, thay vì thay bằng một tước hiệu.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Cách tự nhiên trong tiếng Việt để dẫn lời nói trực tiếp, không cần dịch máy móc là 'nói rằng'.
- source_word: כֵּן ... דֹּבְרִים
  choice: nói đúng
  rationale: Giữ cả ý của động từ 'nói' và sự xác nhận rằng lời thỉnh cầu của họ là đúng; gọn và tự nhiên hơn 'đang nói một cách đúng đắn'.
- source_word: מַטֵּה
  choice: bộ tộc
  rationale: Trong bối cảnh phân chia sản nghiệp, từ này chỉ một bộ tộc, không phải nghĩa đen 'cây gậy'.
- source_word: בְנֵי יוֹסֵף
  choice: con cháu Giô-sép
  rationale: Trong ngữ cảnh bộ tộc nhiều thế hệ sau Giô-sép, 'con cháu' truyền đạt đúng quan hệ hậu duệ và tự nhiên hơn 'các con trai'.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh / CHÚA
  rationale: Bản văn dùng trực tiếp danh giao ước YHWH. Dạng 'Đức Giê-hô-va' là cách phiên chuyển danh riêng đã quen thuộc với độc giả Việt, không thay danh bằng tước hiệu.
- issue: Mức độ xác nhận lời của bộ tộc Giô-sép
  choice: nói đúng
  alternative: là đúng
  rationale: Cách chọn giữ hình thức phát ngôn của דֹּבְרִים, đồng thời không mở rộng lời xác nhận sang điều gì ngoài lời họ vừa trình bày.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nét gia tộc của 'con cái Y-sơ-ra-ên', nhưng dùng 'con cháu Giô-sép' theo ngữ cảnh hậu duệ; câu dẫn được sắp xếp tự nhiên theo cú pháp tiếng Việt.
