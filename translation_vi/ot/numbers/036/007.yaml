  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: vi
  text: Phần sản nghiệp của con cái Y-sơ-ra-ên không được chuyển từ bộ tộc này sang bộ tộc khác, vì mỗi người Y-sơ-ra-ên phải bám chặt vào phần sản nghiệp của bộ tộc tổ phụ mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: được chuyển
  rationale: Trong bối cảnh luật về đất thừa kế, động từ không chỉ sự xoay chuyển vật lý mà chỉ việc phần sản nghiệp đổi sang quyền sở hữu của một bộ tộc khác.
- source_word: נַחֲלָה
  choice: phần sản nghiệp
  rationale: Đây là thuật ngữ chỉ đất đai được truyền lại hoặc được phân chia làm cơ nghiệp; “phần sản nghiệp” vừa rõ nghĩa pháp lý vừa tự nhiên trong tiếng Việt.
- source_word: מַטֶּה ... אֶל מַטֶּה
  choice: từ bộ tộc này sang bộ tộc khác
  rationale: מַטֶּה ở đây chỉ bộ tộc; thêm “này” và “khác” giúp diễn đạt tự nhiên ý chuyển giao giữa các bộ tộc.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ cách gọi mang tính giao ước và gia tộc của nguyên văn, đồng thời là lối diễn đạt tiếng Việt quen thuộc.
- source_word: כִּי
  choice: bởi
  rationale: Giới thiệu lý do làm nền cho điều cấm ở mệnh đề trước.
- source_word: אִישׁ
  choice: mỗi người
  rationale: 'Từ này có nghĩa đen là “một người nam”, nhưng tại đây có chức năng phân phối: từng người trong cộng đồng phải giữ phần sản nghiệp của bộ tộc mình.'
- source_word: יִדְבְּקוּ
  choice: phải gắn bó với
  rationale: דבק diễn tả sự bám chặt, gắn liền hoặc không rời bỏ; “gắn bó với” giữ được hình ảnh ấy và phù hợp với nghĩa vụ pháp lý trong câu.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: với phần sản nghiệp thuộc bộ tộc của tổ phụ mình
  rationale: Cách dịch giữ mối liên hệ giữa phần đất thừa kế, bộ tộc và dòng cha, nhưng vẫn rõ ràng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ngôn ngữ gia hệ theo dòng cha trong quy định về sản nghiệp
  choice: con cái Y-sơ-ra-ên ... mỗi người ... tổ phụ mình
  alternative: dân Y-sơ-ra-ên ... mỗi người ... tổ tiên mình
  rationale: Nguyên văn dùng các từ mang hình thức nam tính và xác định dòng tộc theo cha. Bản dịch giữ “con cái Y-sơ-ra-ên” và “tổ phụ” để không làm mờ cấu trúc gia hệ, nhưng dịch אִישׁ theo nghĩa phân phối là “mỗi người” cho tự nhiên.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng dễ hiểu. Dùng “không được chuyển” để diễn đạt điều cấm có hiệu lực lâu dài; dùng “bộ tộc” thay vì “chi phái” nhằm bảo đảm tính phổ thông trong tiếng Việt hiện đại.
