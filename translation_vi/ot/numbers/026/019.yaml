  yaml_path: translation/ot/numbers/026/019.yaml
  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
translation:
  language: vi
  text: 'Các con trai của Giu-đa: Ê-rơ và Ô-nan. Nhưng[a] Ê-rơ và Ô-nan đã chết tại đất Ca-na-an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và Ê-rơ cùng Ô-nan đã chết tại đất Ca-na-an.” Liên từ Hê-bơ-rơ có thể được dịch đơn giản là “và”; bản văn chính dùng “nhưng” để thể hiện sắc thái tương phản trong ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Các con trai của Giu-đa
  rationale: Cụm danh từ sở hữu trong một danh sách gia phả; “các con trai” giữ đúng ý nghĩa nam giới trực hệ, không mở rộng thành “con cái” hay “hậu duệ”.
- source_word: עֵר וְ/אוֹנָן
  choice: Ê-rơ và Ô-nan
  rationale: Hai tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt; liên từ được dịch tự nhiên là “và”.
- source_word: וַ/יָּמָת
  choice: Nhưng ... đã chết
  rationale: Động từ chỉ một sự việc đã xảy ra trong quá khứ. “Nhưng” diễn đạt sắc thái tương phản theo mạch văn khi chuyển từ việc kể tên sang ghi nhận rằng hai người ấy đã chết; nghĩa sát chữ “và” được giữ trong chú thích.
- source_word: בְּ/אֶרֶץ כְּנָעַן
  choice: tại đất Ca-na-an
  rationale: Cách diễn đạt tự nhiên, trang trọng cho địa điểm; “đất Ca-na-an” bảo toàn sắc thái địa lý của אֶרֶץ.
