translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng. Giữ cấu trúc gia phả ngắn gọn, dùng tên riêng theo dạng phiên âm quen thuộc; dấu chú thích [a] được đặt sau danh sách hai người để nêu phương án dịch liên từ mở đầu mệnh đề kế tiếp.
