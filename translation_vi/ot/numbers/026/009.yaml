id: NUM.26.9
reference: Numbers 26:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: vi
  text: Và các con trai của Ê-li-áp là Nê-mu-ên, Đa-than và A-bi-ram. Đó chính là Đa-than và A-bi-ram, những người được gọi trong hội chúng[a], đã chống lại Môi-se và A-rôn trong nhóm của Cô-rê, khi họ chống lại Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người được tuyển chọn trong hội chúng.”'
    reason: Cụm קְרִיאֵי הָעֵדָה theo nghĩa đen là “những người được gọi trong/của hội chúng”; trong ngữ cảnh này, nó cũng có thể chỉ những người được công nhận hoặc tuyển chọn trong hội chúng.
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: Các con trai của Ê-li-áp
  rationale: Trong danh sách gia phả, בְּנֵי chỉ các con trai được nêu tên; cách dịch này chính xác và tự nhiên trong tiếng Việt.
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: Đây chính là Đa-than và A-bi-ram
  rationale: Đại từ số ít הוּא được dùng theo chức năng nhận diện/tái chỉ; “đây chính là” truyền đạt sự nhấn mạnh khi xác định hai người đã được nhắc đến.
- source_word: קרואי הָעֵדָה
  choice: những người được hội chúng triệu tập
  rationale: Phân từ bị động của קרא có nghĩa căn bản là “được gọi/triệu tập”; cách dịch giữ nghĩa từ vựng và chưa quyết định dứt khoát rằng họ là các thủ lĩnh được tuyển chọn.
- source_word: הִצּוּ ... בְּהַצֹּתָם
  choice: đã chống lại ... khi họ chống lại
  rationale: Động từ נצה diễn tả sự tranh chấp hoặc đối đầu. “Chống lại” phù hợp với giới từ עַל và giữ nhất quán việc lặp lại cùng một gốc từ.
- source_word: בַּעֲדַת קֹרַח
  choice: trong phe Cô-rê
  rationale: Ở đây עֵדָה chỉ nhóm người gắn với Cô-rê trong cuộc chống đối; “phe Cô-rê” tự nhiên và tránh gây ấn tượng đây là toàn thể hội chúng Israel.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc và trang trọng trong tiếng Việt để biểu thị trực tiếp danh YHWH, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời. “Đức Giê-hô-va” là dạng tên riêng quen thuộc trong tiếng Việt, giữ sự phân biệt với tước hiệu “Chúa”.
- issue: Ý nghĩa của קרואי העדה
  choice: những người được hội chúng triệu tập
  alternative: những người được tuyển chọn trong hội chúng
  rationale: Cụm Hê-bơ-rơ có thể chỉ những người được gọi, triệu tập hoặc những đại biểu có danh vị. Bản chính giữ nghĩa trực tiếp hơn, còn khả năng mang nghĩa “được tuyển chọn” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối Việt hóa quen thuộc; cấu trúc câu giữ sự lặp lại có chủ ý của nguyên văn.
