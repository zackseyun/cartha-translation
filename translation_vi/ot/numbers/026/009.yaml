revisions:
- from: Các con trai của Ê-li-áp là Nê-mu-ên, Đa-than và A-bi-ram. Đây chính là Đa-than và A-bi-ram, những người được hội chúng triệu tập[a], đã chống lại Môi-se và A-rôn trong phe Cô-rê, khi họ chống lại Đức Giê-hô-va.
  to: Và các con trai của Ê-li-áp là Nê-mu-ên, Đa-than và A-bi-ram. Đó chính là Đa-than và A-bi-ram, những người được gọi trong hội chúng[a], đã chống lại Môi-se và A-rôn trong nhóm của Cô-rê, khi họ chống lại Yahweh.
  rationale: Bản sửa thêm liên từ mở đầu theo וּ, chuyển cách hiểu quá cụ thể “được hội chúng triệu tập” thành cách diễn đạt không áp đặt tác nhân, thay cách gọi nhóm của Cô-rê bằng từ trung tính hơn, và nhất quán dùng “Yahweh” cho danh יהוה. Cấu trúc nhận diện, các tên riêng, và sự lặp lại của động từ “chống lại” được giữ để phản ánh nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:34:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần điều chỉnh hai điểm để bám sát nguyên văn hơn: קרואי העדה không nhất thiết nói hội chúng là tác nhân đã “triệu tập” họ, mà là “những người được gọi của/trong hội chúng”; và danh יהוה nên được chuyển là “Yahweh” theo hồ sơ thuật ngữ POB. “Phe Cô-rê” có sắc thái diễn giải; “nhóm của Cô-rê” trung tính hơn và vẫn phản ánh quan hệ của họ với Cô-rê.'
  naturalness: Bản sửa giữ văn phong Việt ngữ hiện đại, trang trọng. “Đó chính là...” tự nhiên hơn “Đây chính là...” khi tái nhận diện hai nhân vật đã nêu; “những người được gọi trong hội chúng” rõ ràng mà không áp đặt cơ chế tuyển chọn.
  terminology: Giữ tên phiên âm Việt hóa nhất quán. Dùng “hội chúng” cho עֵדָה, “Yahweh” cho יהוה, và lặp “chống lại” để phản ánh việc lặp cùng gốc נצה trong tiếng Hê-bơ-rơ.
  issues:
  - severity: medium
    issue: “những người được hội chúng triệu tập” diễn giải quan hệ ngữ pháp của קרואי העדה quá cụ thể.
    rationale: Cụm này sát nghĩa là “những người được gọi của/trong hội chúng”; cách hiểu hội chúng trực tiếp triệu tập họ là khả dĩ nhưng không phải điều nguyên văn xác định. Nên để bản chính không áp đặt tác nhân và ghi khả năng “người được tuyển chọn...” ở chú thích.
  - severity: medium
    issue: “Đức Giê-hô-va” không theo quyết định thuật ngữ của POB cho יהוה.
    rationale: Hồ sơ tiếng Anh quy định chuyển trực tiếp danh YHWH là “Yahweh”. Trong tiếng Việt, không thêm “Đức” trước tên riêng này để tránh vừa thay đổi cách chuyển danh vừa pha trộn tước hiệu.
  - severity: low
    issue: “trong phe Cô-rê” mang sắc thái phe phái diễn giải.
    rationale: בַּעֲדַת קֹרַח chỉ nhóm/hội của Cô-rê. “Trong nhóm của Cô-rê” giữ liên hệ nhóm mà trung tính hơn.
  revised_text: Và các con trai của Ê-li-áp là Nê-mu-ên, Đa-than và A-bi-ram. Đó chính là Đa-than và A-bi-ram, những người được gọi trong hội chúng[a], đã chống lại Môi-se và A-rôn trong nhóm của Cô-rê, khi họ chống lại Yahweh.
