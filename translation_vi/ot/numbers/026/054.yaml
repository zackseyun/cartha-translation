  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לָ/רַ֗ב תַּרְבֶּה֙ נַחֲלָת֔/וֹ וְ/לַ/מְעַ֕ט תַּמְעִ֖יט נַחֲלָת֑/וֹ אִ֚ישׁ לְ/פִ֣י פְקֻדָ֔י/ו יֻתַּ֖ן נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: vi
  text: Với nhóm đông người, hãy tăng phần cơ nghiệp của nhóm ấy; với nhóm ít người, hãy giảm phần cơ nghiệp của nhóm ấy. Phần cơ nghiệp của mỗi nhóm sẽ được ban tùy theo số người đã được kiểm kê trong nhóm ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu Hebrew diễn đạt cô đọng: “mỗi người, theo những người được kiểm kê của mình.” “Mỗi người” được dùng theo lối phân phối để chỉ từng nhóm, và phần cơ nghiệp của nhóm ấy tương ứng với số người đã được kiểm kê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: với nhóm đông người
  rationale: רַב được dùng như danh từ và mang ý so sánh trong bối cảnh kiểm kê dân số; “nhóm đông người” diễn đạt tự nhiên đơn vị bộ tộc hoặc thị tộc có dân số lớn hơn.
- source_word: תַּרְבֶּה נַחֲלָתוֹ
  choice: hãy tăng phần cơ nghiệp của nhóm ấy
  rationale: Dạng Hiphil của רבה chỉ việc làm cho lớn hơn; cách dịch này giữ mệnh lệnh ở ngôi thứ hai và ý phân chia đất theo tỷ lệ.
- source_word: וְלַמְעַט
  choice: với nhóm ít người
  rationale: מְעַט được dùng như danh từ, đối xứng với רַב, chỉ nhóm có số dân ít hơn.
- source_word: תַּמְעִיט נַחֲלָתוֹ
  choice: hãy giảm phần cơ nghiệp của nhóm ấy
  rationale: Dạng Hiphil của מעט có nghĩa làm cho ít hoặc nhỏ hơn; “giảm” phù hợp với việc ấn định phần đất nhỏ hơn.
- source_word: נַחֲלָה
  choice: phần cơ nghiệp
  rationale: Trong ngữ cảnh này, từ chỉ phần đất được phân chia làm sản nghiệp theo quyền được ban; “phần cơ nghiệp” vừa trang trọng vừa rõ nghĩa.
- source_word: אִישׁ
  choice: mỗi nhóm
  rationale: Danh từ giống đực số ít được dùng theo lối phân phối. Trong mạch văn, đối tượng nhận đất là các nhóm được kiểm kê, nên “mỗi nhóm” truyền đạt đúng quy chiếu mà không khiến người đọc hiểu là từng cá nhân nhận đất trực tiếp.
- source_word: לְפִי פְקֻדָיו
  choice: tùy theo số người đã được kiểm kê trong nhóm ấy
  rationale: Thành ngữ לְפִי diễn tả sự tương ứng hoặc tỷ lệ; פְקֻדָיו chỉ những người thuộc nhóm đã được ghi nhận trong cuộc kiểm kê. Cách dịch làm rõ quan hệ tỷ lệ vốn hàm chứa trong câu Hebrew cô đọng.
- source_word: יֻתַּן
  choice: sẽ được ban
  rationale: Giữ thể bị động của נתן và sắc thái trang trọng của việc trao phần cơ nghiệp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hãy” để giữ lực mệnh lệnh mà không phải chọn đại từ xưng hô cổ; dùng “nhóm ấy” để thể hiện hậu tố số ít chỉ một tập thể.
