  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc đối xứng của tiếng Hebrew: nhóm đông hơn nhận phần cơ nghiệp lớn hơn, nhóm ít hơn nhận phần nhỏ hơn; việc cấp phần được xác định theo số đã kiểm kê. “Phần cơ nghiệp” phản ánh phù hợp נַחֲלָה trong ngữ cảnh phân chia đất, và “sẽ được ban” giữ được thể bị động của יֻתַּן.'
  naturalness: Tiếng Việt hiện đại, rõ ràng và có sắc thái trang trọng thích hợp. Cách lặp “nhóm ấy” giúp giữ quy chiếu số ít tập thể của nguyên ngữ mà không gây gượng. “Tùy theo số người đã được kiểm kê trong nhóm ấy” diễn đạt tự nhiên quan hệ tỷ lệ hàm ý trong לְפִי פְקֻדָיו.
  terminology: “Cơ nghiệp” là thuật ngữ phù hợp và nhất quán cho phần đất được thừa hưởng/phân định. “Kiểm kê” phù hợp với bối cảnh điều tra dân số của Dân Số Ký 26. Chú thích xử lý hữu ích tính cô đọng và cách dùng phân phối của אִישׁ, không áp đặt diễn giải giáo phái.
