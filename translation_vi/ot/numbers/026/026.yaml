base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: vi
  text: 'Các con trai của Xê-bu-lôn[a], theo các gia tộc của họ: từ Sê-rết có gia tộc Sê-rết; từ Ê-lôn có gia tộc Ê-lôn; từ Gia-lê-ên có gia tộc Gia-lê-ên.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong bối cảnh kiểm kê dân số này, “các con trai của Xê-bu-lôn” chỉ các hậu duệ thuộc chi phái Xê-bu-lôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: Các con trai của Xê-bu-lôn
  rationale: Giữ thành ngữ phả hệ sát với nguyên văn Hê-bơ-rơ, đồng thời chú thích rằng trong bối cảnh kiểm kê dân số, cụm này chỉ các hậu duệ thuộc chi phái Xê-bu-lôn.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo các gia tộc của họ
  rationale: מִשְׁפָּחָה ở đây là đơn vị gia tộc trong chi phái; “theo” thể hiện cách phân nhóm của cuộc kiểm kê.
- source_word: לְסֶרֶד ... לְאֵלֹון ... לְיַחְלְאֵל
  choice: từ Sê-rết ... từ Ê-lôn ... từ Gia-lê-ên
  rationale: Tiền tố לְ trong công thức liệt kê này giới thiệu tổ tiên mà từng gia tộc bắt nguồn; “từ” diễn đạt quan hệ dòng dõi tự nhiên trong tiếng Việt.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: gia tộc Sê-rết
  rationale: Dạng chỉ người thuộc dòng Sê-rết được diễn đạt bằng tên tổ tiên sau “gia tộc”, tránh tạo một tên dân tộc gượng gạo trong tiếng Việt.
- source_word: מִשְׁפַּחַת הָאֵלֹנִי
  choice: gia tộc Ê-lôn
  rationale: Diễn đạt dạng chỉ hậu duệ của Ê-lôn bằng cấu trúc gia tộc tiếng Việt rõ ràng và nhất quán.
- source_word: מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: gia tộc Gia-lê-ên
  rationale: Diễn đạt dạng chỉ hậu duệ của Gia-lê-ên bằng cấu trúc gia tộc tiếng Việt rõ ràng và nhất quán.
