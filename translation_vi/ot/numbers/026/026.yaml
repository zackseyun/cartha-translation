  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc kiểm kê của tiếng Hê-bơ-rơ: “các con trai của Xê-bu-lôn,” sự phân chia “theo các gia tộc của họ,” và ba công thức lặp lại chỉ nguồn gốc gia tộc từ Sê-rết, Ê-lôn, và Gia-lê-ên. Cách dùng “từ … có gia tộc …” diễn đạt thích đáng chức năng của לְ trong ngữ cảnh phả hệ.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và giữ được nhịp liệt kê trang trọng. “Gia tộc” là lựa chọn tự nhiên và chính xác hơn “gia đình” cho các đơn vị dòng họ/nhánh trong cuộc kiểm kê.
  terminology: Các tên riêng được phiên âm nhất quán. Việc diễn đạt các dạng tính từ chỉ thị tộc bằng “gia tộc Sê-rết/Ê-lôn/Gia-lê-ên” là tự nhiên trong tiếng Việt và không làm thay đổi quan hệ hậu duệ hàm ý trong nguyên văn. Chú thích về “các con trai” hữu ích để làm rõ thành ngữ phả hệ trong bối cảnh chi phái.
