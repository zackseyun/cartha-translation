base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: vi
  text: 'Các con trai của A-se, theo các thị tộc[a] của họ: từ Im-na có thị tộc Im-na; từ Ích-vi có thị tộc Ích-vi; từ Bê-ri-a có thị tộc Bê-ri-a.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể dịch là “các gia tộc”; trong cuộc kiểm tra dân số này, từ ấy chỉ những nhánh thị tộc thuộc một chi phái.
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hê-bơ-rơ, tên của mỗi thị tộc là một dạng dân danh được phái sinh từ tên tổ phụ; tiếng Việt ở đây dùng lại tên tổ phụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: Các con trai của A-se
  rationale: Giữ thành ngữ gia phả sát nghĩa “các con trai của A-se”; trong ngữ cảnh kiểm tra dân số, các con trai này cũng là những tổ phụ của các nhánh hậu duệ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo các thị tộc của họ
  rationale: מִשְׁפָּחָה ở đây chỉ đơn vị họ hàng nằm trong chi phái; “thị tộc” chính xác hơn “gia đình” trong tiếng Việt hiện đại.
- source_word: לְיִמְנָה ... לְיִשְׁוִי ... לִבְרִיעָה
  choice: từ Im-na ... từ Ích-vi ... từ Bê-ri-a
  rationale: Tiền tố לְ trong công thức gia phả này giới thiệu tổ phụ mà thị tộc phát xuất từ đó; “từ” diễn đạt quan hệ ấy tự nhiên trong tiếng Việt.
- source_word: מִשְׁפַּחַת הַיִּמְנָה ... מִשְׁפַּחַת הַיִּשְׁוִי ... מִשְׁפַּחַת הַבְּרִיעִי
  choice: thị tộc Im-na ... thị tộc Ích-vi ... thị tộc Bê-ri-a
  rationale: Các dạng có mạo từ là tên gọi thị tộc được phái sinh từ tên tổ phụ. Tiếng Việt không cần tạo hậu tố dân danh như tiếng Hê-bơ-rơ hay “-ites” trong tiếng Anh, nên dùng tên tổ phụ sau “thị tộc” vừa tự nhiên vừa giữ đúng chức năng.
- source_word: אָשֵׁר / יִמְנָה / יִשְׁוִי / בְּרִיעָה
  choice: A-se / Im-na / Ích-vi / Bê-ri-a
  rationale: Phiên âm các tên riêng theo dạng Hê-bơ-rơ Masoret, với cách viết dễ đọc đối với độc giả Việt.
