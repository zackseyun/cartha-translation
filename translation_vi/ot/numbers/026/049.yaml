  text: לְ/יֵ֕צֶר מִשְׁפַּ֖חַת הַ/יִּצְרִ֑י לְ/שִׁלֵּ֕ם מִשְׁפַּ֖חַת הַ/שִּׁלֵּמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: vi
  text: từ Giê-xe, gia tộc Giê-xe; từ Si-lêm, gia tộc Si-lêm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: từ Giê-xe
  rationale: Trong công thức kiểm kê theo dòng dõi, לְ giới thiệu người đứng đầu mà gia tộc phát xuất từ đó; “từ” diễn đạt tự nhiên quan hệ hậu duệ trong tiếng Việt. Tên riêng được phiên âm.
- source_word: מִשְׁפַּחַת
  choice: gia tộc
  rationale: Trong bối cảnh bộ tộc và kiểm kê dân số, מִשְׁפָּחָה chỉ một đơn vị thân tộc trong chi phái, rộng hơn gia đình hạt nhân; “gia tộc” vừa chính xác vừa dễ hiểu.
- source_word: הַ/יִּצְרִי
  choice: gia tộc Giê-xe
  rationale: Danh từ chỉ hậu duệ được chuyển thành cụm “gia tộc + tên tổ tiên”, là cách tự nhiên trong tiếng Việt và giữ rõ quan hệ với tên Giê-xe.
- source_word: לְ/שִׁלֵּם
  choice: từ Si-lêm
  rationale: Tương ứng với vế đầu, לְ giới thiệu tổ tiên mà gia tộc phát xuất từ đó; tên riêng được phiên âm là “Si-lêm”.
- source_word: הַ/שִּׁלֵּמִי
  choice: gia tộc Si-lêm
  rationale: Danh từ chỉ hậu duệ được diễn đạt bằng “gia tộc Si-lêm”, bảo toàn ý nghĩa phái sinh và tránh một dạng tên gọi dân tộc thiếu tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và hiện đại, giữ cấu trúc song song của công thức kiểm kê. Dùng “gia tộc” để phản ánh đơn vị thân tộc trong chi phái; không thêm chú giải vì câu không có điểm mơ hồ cần ghi chú.
