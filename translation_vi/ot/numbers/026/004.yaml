  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּצְאִ֖ים מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: vi
  text: Từ hai mươi tuổi trở lên, như Yahweh[a] đã truyền cho Môi-se và những người Israel đã ra khỏi đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là cách phiên âm danh riêng YHWH trong tiếng Hê-bơ-rơ; một số bản dịch dùng “CHÚA” hoặc “ĐỨC GIÊ-HÔ-VA”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: Từ hai mươi tuổi trở lên
  rationale: Đây là công thức chỉ ngưỡng tuổi; cách diễn đạt này vừa sát cấu trúc Hê-bơ-rơ vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: כַּאֲשֶׁר
  choice: như
  rationale: Diễn tả sự phù hợp với mệnh lệnh Đức Chúa Trời đã ban trước đó, ngắn gọn và tự nhiên.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Động từ mang nghĩa ra lệnh; “đã truyền” giữ được sắc thái uy quyền và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng YHWH thay vì thay thế bằng một tước hiệu, qua đó bảo tồn cách gọi có trong bản Hê-bơ-rơ.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: אֶת là dấu hiệu chỉ tân ngữ và không cần dịch riêng; tiếng Việt dùng “truyền cho Môi-se” một cách tự nhiên.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: và những người Israel
  rationale: Cụm từ có nghĩa đen là “các con trai của Israel” nhưng ở đây là tên gọi tập thể của dân Israel, không chỉ riêng nam giới.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: đã ra khỏi đất Ai Cập
  rationale: Phân từ xác định thế hệ xuất hành; “đã ra khỏi” diễn đạt rõ hành động từ Ai Cập đi ra, còn “đất Ai Cập” bảo tồn yếu tố địa lý אֶרֶץ.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Phiên âm “Yahweh” giữ đây là danh riêng và tránh thay nó bằng một tước hiệu.
- issue: Phạm vi của cụm “những người Israel đã ra khỏi đất Ai Cập”
  choice: Gắn cụm này với “những người Israel” trong mệnh đề nói về điều Yahweh truyền
  alternative: 'Ngắt thành câu mới: “Còn những người Israel đã ra khỏi đất Ai Cập...”'
  rationale: Hình thái Hê-bơ-rơ cho phép nhận וּבְנֵי יִשְׂרָאֵל làm đối tượng thứ hai của צִוָּה, như lớp tham khảo tiếng Anh đã chọn; tuy nhiên cách ngắt cú pháp sang câu kế tiếp cũng có thể được cân nhắc trong mạch liệt kê của phân đoạn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc câu cô đọng của nguyên văn; dùng “người Israel” như tên gọi tập thể và “Môi-se” theo dạng tên quen thuộc trong tiếng Việt.
