  text: וְ/אַ֨שְׂרִיאֵ֔ל מִשְׁפַּ֖חַת הָֽ/אַשְׂרִֽאֵלִ֑י וְ/שֶׁ֕כֶם מִשְׁפַּ֖חַת הַ/שִּׁכְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/031.yaml
  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: vi
  text: từ A-sơ-ri-ên[a] có thị tộc A-sơ-ri-ên; và từ Sê-khem có thị tộc Sê-khem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên này cũng có thể được ghi là “Asriel”. Chữ שׂ trong bản Hê-bơ-rơ là sin, có âm /s/, không phải /sh/.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: A-sơ-ri-ên
  rationale: Phiên âm tên riêng theo phụ âm Hê-bơ-rơ; chữ שׂ ở đây mang âm s, nên dùng dạng bắt đầu bằng A-sơ-, thay vì dạng có âm sh.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Trong ngữ cảnh kiểm tra dân số và gia phả, từ này chỉ một đơn vị thân tộc thuộc bộ tộc; “thị tộc” vừa chính xác vừa gọn trong danh sách.
- source_word: הָאַשְׂרִיאֵלִי
  choice: thị tộc A-sơ-ri-ên
  rationale: Danh từ chỉ hậu duệ được chuyển thành tên của thị tộc trong tiếng Việt, tránh tạo một dạng dân danh gượng ép.
- source_word: וְ
  choice: và
  rationale: Giữ liên từ đơn giản nối mục này với mục kế tiếp trong danh sách.
- source_word: שֶׁכֶם
  choice: Sê-khem
  rationale: Phiên âm tên người theo âm Hê-bơ-rơ, trong đó phụ âm cuối כ không có dấu chấm được thể hiện bằng “kh”.
- source_word: הַשִּׁכְמִי
  choice: thị tộc Sê-khem
  rationale: Danh từ chỉ nhóm hậu duệ của Sê-khem được diễn đạt tự nhiên bằng cấu trúc tên thị tộc trong tiếng Việt.
