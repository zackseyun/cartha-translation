base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: vi
  text: Đó là các thị tộc của Nép-ta-li, theo từng thị tộc của họ; số người được kiểm kê là bốn mươi lăm nghìn bốn trăm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ định số nhiều mở đầu câu tổng kết; tiếng Việt dùng “Đó là” tự nhiên trong công thức liệt kê.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh kiểm kê bộ tộc, từ này chỉ những đơn vị thân tộc mở rộng thuộc một bộ tộc, nên “thị tộc” chính xác hơn “gia đình”.
- source_word: נַפְתָּלִי
  choice: Nép-ta-li
  rationale: Phiên âm tên riêng theo lối viết tiếng Việt, giữ ba âm tiết của tên Hê-bơ-rơ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: Tiền tố לְ biểu thị sự phân loại/phân chia theo các thị tộc; “theo từng” diễn đạt rõ ý phân bố trong tiếng Việt.
- source_word: וּפְקֻדֵיהֶם
  choice: số người được kiểm kê
  rationale: Dạng từ liên hệ với פקד trong ngữ cảnh kiểm kê chỉ tập thể những người đã được đếm; cách dịch này không thêm từ “nam giới” vốn không xuất hiện tại đây.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: bốn mươi lăm nghìn bốn trăm
  rationale: Chuyển số đếm trực tiếp sang trật tự tự nhiên của tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thị tộc” nhất quán với cơ cấu thân tộc trong các danh sách kiểm kê; giữ cách diễn đạt trung tính “số người được kiểm kê”, không bổ sung giới tính ngoài câu nguồn.
