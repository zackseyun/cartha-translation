  yaml_path: translation/ot/numbers/026/034.yaml
  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: vi
  text: Đó là các thị tộc của Ma-na-se; số người được kiểm kê trong họ[a] là 52.700 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “số người đã được đếm của họ” hoặc “số người được ghi danh của họ.” Công thức kiểm kê trong tiếng Hê-bơ-rơ dùng một dạng của פקד, chỉ những người được đếm hoặc ghi danh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ định số nhiều mở đầu lời tổng kết danh sách; tiếng Việt tự nhiên có thể dùng “Đó là” để quy chiếu các thị tộc vừa kể.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh kiểm kê của Dân Số, từ này chỉ những phân nhóm huyết tộc trong một chi phái, rộng hơn nghĩa gia đình trong một hộ.
- source_word: מְנַשֶּׁה
  choice: Ma-na-se
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: וּפְקֻדֵיהֶם
  choice: số người được kiểm kê trong họ
  rationale: Dạng từ gốc פקד trong công thức kiểm kê nói đến những người đã được đếm hoặc ghi danh; “trong họ” giữ mối liên hệ với các thị tộc mà không thêm đặc điểm không được nêu rõ ngay trong câu.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 52.700 người
  rationale: Diễn đạt tổng số chính xác theo quy ước ghi số hiện đại của tiếng Việt; thêm danh từ loại “người” để câu rõ và tự nhiên.
