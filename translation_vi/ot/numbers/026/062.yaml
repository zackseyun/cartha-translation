  to: Tổng số người được kiểm đếm của họ là hai mươi ba nghìn, gồm tất cả nam giới từ một tháng tuổi trở lên. Họ không được kiểm đếm trong số con cái Israel[a], vì không có phần thừa kế nào được ban cho họ trong số con cái Israel.
