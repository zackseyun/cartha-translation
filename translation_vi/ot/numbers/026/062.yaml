  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: vi
  text: Tổng số người được kiểm đếm của họ là hai mươi ba nghìn, gồm tất cả nam giới từ một tháng tuổi trở lên. Họ không được kiểm đếm trong số con cái Israel[a], vì không có phần thừa kế nào được ban cho họ trong số con cái Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “dân Israel” ở cả hai chỗ có cụm “con cái Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: số người được kiểm đếm trong họ
  rationale: Diễn đạt danh từ chỉ những người thuộc diện đã được thống kê trong cuộc kiểm đếm, đồng thời giữ đại từ chỉ nhóm người Lê-vi.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: hai mươi ba nghìn
  rationale: Cách diễn đạt số đếm tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: כָּל זָכָר
  choice: tất cả nam giới
  rationale: Giữ rõ giới tính và vẫn thích hợp khi phạm vi tuổi bao gồm cả trẻ sơ sinh.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: từ một tháng tuổi trở lên
  rationale: Cách nói tự nhiên trong tiếng Việt, bảo toàn ngưỡng tuổi của nguyên văn.
- source_word: הָתְפָּקְדוּ
  choice: được kiểm đếm
  rationale: Dùng nhất quán với cùng gốc פקד ở đầu câu và phản ánh bối cảnh thống kê dân số.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: cùng với / giữa vòng con cái Israel
  rationale: Hai cách diễn đạt phù hợp với cú pháp từng mệnh đề; “con cái Israel” giữ hình ảnh gia tộc của nguyên văn, còn “giữa vòng” thể hiện בְּתוֹךְ.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: không có phần thừa kế nào được ban cho họ
  rationale: Giữ thể bị động và thuật ngữ “phần thừa kế” trong bối cảnh phân chia đất.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel
  rationale: “Con cái Israel” bảo toàn cách diễn đạt mang tính gia tộc và giao ước của tiếng Hê-bơ-rơ; “dân Israel” tự nhiên hơn trong tiếng Việt nhưng khái quát hóa hình ảnh ấy.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Câu dài của tiếng Hê-bơ-rơ được tách thành hai câu để dễ đọc, nhưng quan hệ lý do giữa việc không kiểm đếm chung và việc không nhận phần thừa kế vẫn được giữ nguyên.
