source:
  edition: WLC
  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: vi
  text: Nhưng trong số những người này, không có một ai thuộc số những người được Môi-se và A-rôn, thầy tế lễ, kiểm đếm khi họ kiểm đếm con cái Y-sơ-ra-ên trong hoang mạc Si-nai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và trong số những người này”; liên từ Hê-bơ-rơ có nghĩa cơ bản là “và”, nhưng ở đây có lẽ diễn tả sự tương phản với câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: Nhưng trong số những người này
  rationale: Liên từ ו có thể là “và”, nhưng trong mạch văn ở đây mang sắc thái tương phản; בְּאֵלֶּה chỉ phạm vi “trong số những người này”.
- source_word: לֹא הָיָה אִישׁ
  choice: không một người nào
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý không có dù chỉ một cá nhân nào, đồng thời giữ sức nhấn mạnh của danh từ số ít אִישׁ.
- source_word: מִפְּקוּדֵי
  choice: thuộc những người đã được ... kiểm đếm
  rationale: Danh từ bắt nguồn từ פקד ở nghĩa kiểm kê/điểm số, chỉ những người nằm trong cuộc kiểm đếm trước đó chứ không chỉ hồ sơ điều tra.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Nguyên văn chỉ nói “thầy tế lễ”, không có từ “thượng tế”, nên không thêm cấp hiệu.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: là những người đã kiểm đếm
  rationale: Mệnh đề quan hệ chỉ Môi-se và A-rôn là chủ thể thực hiện việc kiểm đếm; cách diễn đạt này tránh khả năng hiểu nhầm đại từ quan hệ là đối tượng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh thân tộc của cụm Hê-bơ-rơ, đồng thời là cách nói Kinh Thánh trang trọng và dễ hiểu trong tiếng Việt.
- source_word: בְּמִדְבַּר סִינָי
  choice: trong hoang mạc Si-nai
  rationale: מִדְבָּר chỉ vùng hoang vu/hoang mạc; cách dịch này tự nhiên và giữ quan hệ địa danh trong nguyên văn.
theological_decisions:
- issue: Ngôn ngữ chỉ giới trong אִישׁ và בְּנֵי יִשְׂרָאֵל
  choice: Dịch אִישׁ là “một người nào” trong cấu trúc phủ định và giữ thành ngữ thân tộc “con cái Y-sơ-ra-ên”
  alternative: “một người nam nào”; “người Y-sơ-ra-ên”
  rationale: Bối cảnh cuộc kiểm đếm trước đó nói đến nam giới, nhưng trong tiếng Việt, “không một người nào” truyền đạt chính xác thành ngữ phủ định mà không phủ nhận bối cảnh ấy. “Con cái Y-sơ-ra-ên” bảo tồn cách gọi thân tộc của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm đếm” để nối rõ hai lần xuất hiện của căn từ פקד; giữ “thầy tế lễ” thay vì thêm “thượng tế”. Mọi dấu chú thích trong bản văn đều có chú thích tương ứng.
