  register: Văn phong hiện đại, trang trọng và dễ hiểu; tên riêng được phiên âm theo lối quen dùng trong tiếng Việt. Phép lặp “gia tộc” được giữ để phản ánh cấu trúc song song của câu Hê-bơ-rơ.
