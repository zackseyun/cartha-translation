base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: vi
  text: 'Các con trai của Bê-ri-a gồm: từ Hê-be có gia tộc Hê-be; từ Manh-ki-ên có gia tộc Manh-ki-ên.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי בְרִיעָה
  choice: Các con trai của Bê-ri-a gồm
  rationale: Giữ cấu trúc gia phả của nguyên văn; “gồm” diễn đạt tự nhiên chức năng mở đầu danh sách của giới từ ל trong công thức kiểm kê dân số.
- source_word: לְחֶבֶר
  choice: từ Hê-be
  rationale: Trong công thức kiểm kê này, ל chỉ nguồn gốc của nhánh gia tộc, nên “từ” thể hiện quan hệ hậu duệ rõ ràng.
- source_word: מִשְׁפַּחַת
  choice: gia tộc
  rationale: Trong bối cảnh kiểm kê và gia phả, từ này chỉ một đơn vị thân tộc thuộc bộ tộc; “gia tộc” chính xác hơn “gia đình”.
- source_word: הַחֶבְרִי
  choice: gia tộc Hê-be
  rationale: Dạng chỉ người thuộc dòng Hê-be được diễn đạt bằng tên gia tộc trong tiếng Việt, tránh tạo một danh xưng dân tộc thiếu tự nhiên.
- source_word: לְמַלְכִּיאֵל
  choice: từ Man-ki-ên
  rationale: Giữ cùng cấu trúc chỉ nguồn gốc/hậu duệ như ở nhánh Hê-be.
- source_word: הַמַּלְכִּיאֵלִי
  choice: gia tộc Man-ki-ên
  rationale: Dạng chỉ những người thuộc dòng Man-ki-ên được chuyển thành tên gia tộc tự nhiên trong tiếng Việt.
