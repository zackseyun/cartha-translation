  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: vi
  text: 'Của Ô-xơ-ni[a]: thị tộc Ô-xơ-ni; của Ê-ri[b]: thị tộc Ê-ri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “gia tộc của người Ô-xơ-ni.” Tiếng Hê-bơ-rơ dùng một thuật ngữ chỉ thị tộc và một dạng từ chỉ hậu duệ của Ô-xơ-ni.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “gia tộc của người Ê-ri.” Tiếng Hê-bơ-rơ dùng một thuật ngữ chỉ thị tộc và một dạng từ chỉ hậu duệ của Ê-ri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אָזְנִי
  choice: thuộc Ô-xơ-ni
  rationale: Trong công thức kiểm kê gia tộc, tiền tố לְ giới thiệu tổ tiên mà thị tộc bắt nguồn từ đó; “thuộc” diễn đạt tự nhiên quan hệ này trong tiếng Việt.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Trong bối cảnh bộ tộc và kiểm kê của Israel, từ này chỉ một đơn vị thân tộc rộng hơn gia đình hạt nhân; “thị tộc” vừa chính xác vừa rõ nghĩa.
- source_word: הָ/אָזְנִי
  choice: thị tộc Ô-xơ-ni
  rationale: Dạng chỉ người thuộc dòng dõi, có mạo từ, gọi nhóm hậu duệ của Ô-xơ-ni; tiếng Việt diễn đạt tự nhiên bằng tên tổ tiên sau danh từ “thị tộc”.
- source_word: לְ/עֵרִי
  choice: thuộc Ê-ri
  rationale: Cùng một công thức gia phả, tiền tố לְ đánh dấu dòng thị tộc bắt nguồn từ Ê-ri; “thuộc” giữ được quan hệ ấy mà không gượng ép.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Giữ nhất quán với vế trước vì nguyên văn lặp lại cùng một thuật ngữ và công thức.
- source_word: הָ/עֵרִי
  choice: thị tộc Ê-ri
  rationale: 'Dạng chỉ hậu duệ của Ê-ri được chuyển sang cấu trúc tự nhiên trong tiếng Việt: “thị tộc” cộng tên vị tổ.'
