base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/039.yaml
  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: vi
  text: Su-pham là tổ của gia tộc Su-pham[a]; Hu-pham là tổ của gia tộc Hu-pham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ tại đây ghi tên Su-pham; một số truyền thống văn bản và các danh sách song song có những dạng tên gần giống nhưng cách viết khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: Từ Su-pham
  rationale: Trong công thức kiểm kê gia tộc, tiền tố לְ biểu thị sự quy thuộc hoặc dòng dõi; “từ” diễn đạt tự nhiên rằng gia tộc này phát xuất từ người mang tên Su-pham.
- source_word: מִשְׁפַּחַת
  choice: gia tộc
  rationale: Trong bối cảnh kiểm kê các chi tộc Israel, מִשְׁפָּחָה chỉ một đơn vị thân tộc nằm trong bộ tộc; “gia tộc” chính xác và tự nhiên hơn “gia đình”.
- source_word: הַשּׁוּפָמִי
  choice: Su-pham
  rationale: Đây là danh xưng tập thể chỉ những người thuộc gia tộc bắt nguồn từ Su-pham. Tiếng Việt diễn đạt gọn và tự nhiên bằng cấu trúc “gia tộc Su-pham” thay vì tạo một tên dân tộc phái sinh.
- source_word: לְחוּפָם
  choice: từ Hu-pham
  rationale: Tiền tố לְ được hiểu theo cùng công thức quy thuộc hoặc dòng dõi; tên riêng được phiên âm là Hu-pham.
- source_word: הַחוּפָמִי
  choice: Hu-pham
  rationale: Danh xưng chỉ tập thể hậu duệ của Hu-pham được diễn đạt tự nhiên trong cụm “gia tộc Hu-pham”.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc song song của câu Hê-bơ-rơ được giữ lại, đồng thời dùng “từ… có gia tộc…” để làm rõ quan hệ dòng dõi. Các tên riêng được phiên âm nhất quán theo âm gần với nguyên ngữ.
