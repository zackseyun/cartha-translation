- from: 'Đây là những người thuộc Lê-vi đã được kiểm kê theo các thị tộc của họ[a]: thuộc Ghẹt-sôn có thị tộc Ghẹt-sôn; thuộc Kê-hát có thị tộc Kê-hát; thuộc Mê-ra-ri có thị tộc Mê-ra-ri.'
  to: 'Đây là những người Lê-vi được kiểm kê[a] theo các thị tộc của họ: về Ghẹt-sôn là thị tộc người Ghẹt-sôn; về Kê-hát là thị tộc người Kê-hát; về Mê-ra-ri là thị tộc người Mê-ra-ri.'
