  text: וְ/אֵ֨לֶּה פְקוּדֵ֣י הַ/לֵּוִי֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/גֵרְשׁ֗וֹן מִשְׁפַּ֨חַת֙ הַ/גֵּ֣רְשֻׁנִּ֔י לִ/קְהָ֕ת מִשְׁפַּ֖חַת הַ/קְּהָתִ֑י לִ/מְרָרִ֕י מִשְׁפַּ֖חַת הַ/מְּרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: vi
  text: 'Đây là những người Lê-vi được kiểm kê[a] theo các thị tộc của họ: về Ghẹt-sôn là thị tộc người Ghẹt-sôn; về Kê-hát là thị tộc người Kê-hát; về Mê-ra-ri là thị tộc người Mê-ra-ri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được đếm” hoặc “được ghi danh”. Từ Hê-bơ-rơ chỉ những người được ghi nhận trong cuộc kiểm kê, không chỉ nói đến việc kiểm đếm nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: những người ... đã được kiểm kê
  rationale: Dạng danh từ chỉ chính những người được ghi nhận trong cuộc kiểm kê dân số, chứ không chỉ hành động hay kết quả kiểm kê trừu tượng.
- source_word: הַלֵּוִי
  choice: thuộc Lê-vi
  rationale: Giữ Lê-vi như tên tổ phụ kiêm tên chi tộc, đồng thời diễn đạt tự nhiên rằng những người được kiểm kê thuộc về chi tộc ấy.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo các thị tộc của họ
  rationale: Trong bối cảnh kiểm kê theo cơ cấu bộ tộc, מִשְׁפָּחָה chỉ một nhóm họ hàng lớn hơn gia đình hạt nhân; “thị tộc” truyền đạt đúng cấp độ xã hội này.
- source_word: לְגֵרְשׁוֹן / לִקְהָת / לִמְרָרִי
  choice: thuộc Ghẹt-sôn / thuộc Kê-hát / thuộc Mê-ra-ri
  rationale: Giới từ ל trong danh sách này biểu thị sự quy thuộc theo dòng dõi hoặc nhánh chi tộc.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי / מִשְׁפַּחַת הַקְּהָתִי / מִשְׁפַּחַת הַמְּרָרִי
  choice: thị tộc Ghẹt-sôn / thị tộc Kê-hát / thị tộc Mê-ra-ri
  rationale: Các dạng chỉ người thuộc dòng dõi được chuyển thành tên thị tộc trong tiếng Việt, tránh cách diễn đạt dài và không tự nhiên mà vẫn giữ rõ quan hệ hậu duệ.
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Mở đầu tự nhiên trong tiếng Việt và tiếp nối danh sách kiểm kê ở văn cảnh trước; liên từ Hê-bơ-rơ không nhất thiết phải dịch riêng thành “và”.
theological_decisions: []
translation_notes:
  register: 'Văn phong trang trọng, rõ ràng và hiện đại. Dùng “thị tộc” nhất quán cho các đơn vị họ hàng trong cơ cấu bộ tộc; phiên âm tên riêng theo cách quen dùng trong tiếng Việt: Lê-vi, Ghẹt-sôn, Kê-hát, Mê-ra-ri.'
