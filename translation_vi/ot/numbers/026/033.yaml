  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: vi
  text: Xê-lô-phát, con trai Hê-phe, không có con trai[a], mà chỉ có con gái. Tên các con gái của Xê-lô-phát là Mách-la, Nô-a[b], Hốt-la, Minh-ca và Tiệt-xa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ theo nghĩa đen: “không có các con trai cho ông, ngoại trừ các con gái.”'
    reason: lexical_alternative
  - marker: b
    text: Nô-a ở đây là tên một người con gái của Xê-lô-phát, không phải Nô-ê trong trình thuật đại hồng thủy.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/צְלָפְחָד
  choice: Xê-lô-phát
  rationale: Liên từ וְ nối câu này với ngữ cảnh trước; tiếng Việt không cần thêm một từ nối ở đầu câu. Tên riêng được phiên âm theo cách đọc Hê-bơ-rơ, phù hợp với văn phong Kinh Thánh tiếng Việt.
- source_word: בֶּן חֵפֶר
  choice: con trai Hê-phe
  rationale: Diễn đạt trực tiếp quan hệ cha-con của cấu trúc Hê-bơ-rơ.
- source_word: לֹא הָיוּ לֹו בָּנִים
  choice: không có con trai
  rationale: Cấu trúc sở hữu theo nghĩa đen là “không có các con trai cho ông”; cách nói tự nhiên trong tiếng Việt là “không có con trai”, đồng thời giữ rõ sự tương phản giới tính với “con gái”.
- source_word: כִּי אִם בָּנוֹת
  choice: mà chỉ có con gái
  rationale: 'כִּי אִם biểu thị sự loại trừ và tương phản: ông không có con trai, chỉ có con gái.'
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: Tên các con gái của Xê-lô-phát là
  rationale: שֵׁם ở dạng số ít nhưng mang nghĩa tập hợp trước danh từ số nhiều; cách diễn đạt tiếng Việt này tự nhiên và chính xác.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Mách-la, Nô-a, Hốt-la, Minh-ca và Tiệt-xa
  rationale: Các tên riêng được phiên âm từ tiếng Hê-bơ-rơ sang tiếng Việt. Nô-a ở đây là tên nữ, dù hình thức Hê-bơ-rơ không có phụ âm cuối như tên Nô-ê trong trình thuật đại hồng thủy.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc tương phản giữa con trai và con gái, đồng thời phiên âm tên riêng theo âm Hê-bơ-rơ thay vì lệ thuộc vào dạng tên tiếng Anh.
