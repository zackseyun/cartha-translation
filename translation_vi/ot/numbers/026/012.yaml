  to: Các con trai của Si-mê-ôn, theo các thị tộc của họ:[a] từ Nê-mu-ên có thị tộc Nê-mu-ên; từ Gia-min có thị tộc Gia-min; từ Gia-kin[b] có thị tộc Gia-kin.
