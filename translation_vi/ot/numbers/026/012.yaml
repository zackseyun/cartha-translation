base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: vi
  text: Các con trai của Si-mê-ôn, theo các thị tộc của họ:[a] từ Nê-mu-ên có thị tộc Nê-mu-ên; từ Gia-min có thị tộc Gia-min; từ Gia-kin[b] có thị tộc Gia-kin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các hậu duệ của Si-mê-ôn, theo các gia tộc của họ.” Nguyên văn dùng “các con trai”; trong bối cảnh điều tra dân số, từ được dịch là “gia tộc” thường chỉ các thị tộc.
    reason: lexical_alternative
  - marker: b
    text: Tên này cũng có thể phiên âm là “Ya-kin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: Các con trai của Si-mê-ôn
  rationale: Giữ sát công thức gia phả theo dòng nam “các con trai của”, thay vì khái quát thành “con cháu”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: Trong bối cảnh kiểm tra dân số, מִשְׁפָּחָה chỉ nhóm họ hàng thuộc một chi phái; “thị tộc” phân biệt rõ với gia đình hạt nhân.
- source_word: לִנְמוּאֵל / לְיָמִין / לְיָכִין
  choice: thuộc Nê-mu-ên / thuộc Gia-min / thuộc Gia-kin
  rationale: Giới từ לְ trong công thức liệt kê này giới thiệu tổ phụ mang tên của thị tộc; “thuộc” diễn đạt tự nhiên quan hệ quy thuộc và dòng dõi.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי / הַיָּמִינִי / הַיָּכִינִי
  choice: thị tộc Nê-mu-ên / Gia-min / Gia-kin
  rationale: Các tính từ chỉ dòng tộc được chuyển thành tên gọi tập thể tự nhiên trong tiếng Việt, tránh dạng dài và gượng như “thị tộc của những người Nê-mu-ên”.
- source_word: יָכִין
  choice: Gia-kin
  rationale: Dùng dạng phiên âm quen thuộc, dễ đọc trong truyền thống Kinh Thánh tiếng Việt; âm đầu Hê-bơ-rơ có thể được phiên gần hơn bằng “Ya-”.
