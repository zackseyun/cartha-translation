translation_notes:
  register: Văn phong trang trọng, hiện đại và có nhịp liệt kê rõ ràng. Dấu hai chấm mở danh sách; dấu chấm phẩy phân cách ba thị tộc. Tên riêng được phiên âm nhất quán theo lối quen thuộc trong tiếng Việt.
