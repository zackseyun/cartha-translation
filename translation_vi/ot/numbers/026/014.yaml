  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thị tộc” giữ đúng cấp độ phân nhóm họ hàng trong cơ cấu chi phái; “người” sau con số được bổ sung theo ngữ cảnh kiểm kê dân số, không làm thay đổi nội dung nguồn.
