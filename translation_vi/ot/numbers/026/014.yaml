  text: אֵ֖לֶּה מִשְׁפְּחֹ֣ת הַ/שִּׁמְעֹנִ֑י שְׁנַ֧יִם וְ/עֶשְׂרִ֛ים אֶ֖לֶף וּ/מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/014.yaml
  text: 'These are the clans of the Simeonites: twenty-two thousand two hundred.'
translation:
  language: vi
  text: 'Đó là các thị tộc của người Si-mê-ôn: hai mươi hai nghìn hai trăm người.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ thị số nhiều mở đầu phần tổng kết kiểm kê; tiếng Việt dùng cấu trúc trình hiện “Đó là” tự nhiên trong ngữ cảnh liệt kê vừa nêu.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh bộ tộc và kiểm kê dân số, từ này chỉ các phân nhóm họ hàng thuộc một chi phái; “thị tộc” chính xác hơn “gia đình”.
- source_word: הַשִּׁמְעֹנִי
  choice: người Si-mê-ôn
  rationale: Danh từ chỉ dân tộc ở dạng số ít có mạo từ nhưng mang nghĩa tập thể; “người Si-mê-ôn” diễn đạt tự nhiên toàn thể nhóm hậu duệ thuộc chi phái này.
- source_word: שְׁנַיִם וְעֶשְׂרִים
  choice: hai mươi hai
  rationale: Cách diễn đạt số đếm chuẩn trong tiếng Việt.
- source_word: אֶלֶף
  choice: nghìn
  rationale: Từ chỉ số lượng trong tổng số kiểm kê, được dịch trực tiếp theo cách dùng hiện đại.
- source_word: וּמָאתָיִם
  choice: hai trăm
  rationale: Hoàn chỉnh con số kiểm kê theo cách diễn đạt số đếm chuẩn; thêm “người” sau tổng số để câu tiếng Việt rõ và tự nhiên.
theological_decisions: []
