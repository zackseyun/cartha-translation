  text: וַ/יִּהְי֥וּ בְנֵי בֶ֖לַע אַ֣רְדְּ וְ/נַעֲמָ֑ן מִשְׁפַּ֨חַת֙ הָֽ/אַרְדִּ֔י לְ/נַֽעֲמָ֔ן מִשְׁפַּ֖חַת הַֽ/נַּעֲמִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: vi
  text: Các con trai của Bê-la là A-rết và Na-a-man. Từ A-rết có thị tộc A-rết; từ Na-a-man có thị tộc Na-a-man.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Trong câu gia phả này, động từ היה nối tiếp mạch liệt kê và xác định các con trai của Bê-la; tiếng Việt tự nhiên dùng “là” mà không cần dịch riêng liên từ mở đầu.
- source_word: בְנֵי
  choice: các con trai của
  rationale: Giữ nghĩa trực tiếp của בנים trong văn cảnh gia phả, thay vì mở rộng thành “hậu duệ” khi bản văn nêu hai nhân danh cụ thể.
- source_word: בֶלַע
  choice: Bê-la
  rationale: Phiên âm nhân danh Hê-bơ-rơ sang tiếng Việt theo cách dễ đọc và phân âm rõ ràng.
- source_word: אַרְדְּ
  choice: Át
  rationale: Phiên âm nhân danh Ard gọn, tự nhiên trong tiếng Việt; phụ âm cuối được thể hiện bằng “t” theo cách phát âm tiếng Việt.
- source_word: וְנַעֲמָן
  choice: và Na-a-man
  rationale: Giữ liên từ và phiên âm nhân danh theo các âm tiết của tiếng Hê-bơ-rơ.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Trong bối cảnh kiểm kê dân số và cơ cấu bộ tộc của Dân Số, מִשְׁפָּחָה chỉ một đơn vị thân tộc dưới cấp bộ tộc; “thị tộc” chính xác hơn “gia đình”.
- source_word: הָאַרְדִּי
  choice: thị tộc Át
  rationale: Dạng chỉ người thuộc dòng Át được diễn đạt tự nhiên bằng tên tổ phụ sau “thị tộc”; tiếng Việt không cần tạo một tính từ dân tộc riêng.
- source_word: לְנַעֲמָן
  choice: từ Na-a-man
  rationale: Tiền tố ל trong công thức gia phả biểu thị sự quy thuộc hay phát sinh từ người mang tên ấy; “từ” truyền đạt rõ quan hệ dòng dõi.
- source_word: הַנַּעֲמִי
  choice: thị tộc Na-a-man
  rationale: Dạng gentilic phát sinh từ Na-a-man được chuyển thành kết cấu tự nhiên trong tiếng Việt, đồng thời giữ rõ tên tổ phụ.
