revisions:
- from: Đất há miệng nuốt họ cùng Cô-rê[a], khi cộng đồng ấy chết, khi lửa thiêu nuốt hai trăm năm mươi người; và họ trở thành một dấu hiệu cảnh báo[b].
  to: Đất há miệng nuốt họ cùng Cô-ra[a], khi cộng đồng ấy chết, khi lửa thiêu nuốt hai trăm năm mươi người; và họ trở thành một dấu hiệu cảnh báo[b].
  rationale: Chỉ sửa cách phiên âm tên riêng Korah từ “Cô-rê” thành “Cô-ra”; không thay đổi nghĩa, cú pháp, mức độ mơ hồ, hay hệ thống chú thích của câu.
