    issue: Tên riêng “Cô-rê”
    rationale: קֹרַח (Qōraḥ/Korah) nên được phiên là “Cô-ra” theo cách dùng tiếng Việt phổ biến và ổn định hơn. Việc dùng “Cô-rê” có thể gây nhầm với một tên riêng khác.
