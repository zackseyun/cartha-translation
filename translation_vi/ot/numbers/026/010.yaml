  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תִּפְתַּ֨ח הָ/אָ֜רֶץ אֶת פִּ֗י/הָ וַ/תִּבְלַ֥ע אֹתָ֛/ם וְ/אֶת קֹ֖רַח בְּ/מ֣וֹת הָ/עֵדָ֑ה בַּ/אֲכֹ֣ל הָ/אֵ֗שׁ אֵ֣ת חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ וַ/יִּהְי֖וּ לְ/נֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: vi
  text: Đất há miệng nuốt họ cùng Cô-ra[a], khi cộng đồng ấy chết, khi lửa thiêu nuốt hai trăm năm mươi người; và họ trở thành một dấu hiệu cảnh báo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “họ và Cô-ra.” Câu này trình bày sự phán xét như vậy; xin đối chiếu toàn bộ trình thuật trong Dân Số Ký 16.'
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “một dấu hiệu.” Từ Hê-bơ-rơ נֵס có thể chỉ dấu hiệu, tín hiệu hoặc vật hiệu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: Đất há miệng
  rationale: אֶרֶץ có thể chỉ đất hoặc xứ; trong hình ảnh mặt đất mở ra, “đất” tự nhiên và giữ được phép nhân hóa “há miệng” của tiếng Hê-bơ-rơ.
- source_word: וַתִּבְלַע
  choice: nuốt
  rationale: Giữ hình ảnh cụ thể của động từ בלע mà không tăng thêm sắc thái ngoài nguyên văn.
- source_word: אֹתָם וְאֶת־קֹרַח
  choice: họ cùng Cô-rê
  rationale: Giữ nguyên việc câu Hê-bơ-rơ liên kết “họ” với Cô-rê, không điều hòa với các chi tiết trong Dân Số Ký 16.
- source_word: בְּמוֹת הָעֵדָה
  choice: khi cộng đồng ấy chết
  rationale: ב với động từ nguyên thể mang nghĩa thời gian “khi”; עֵדָה ở đây chỉ cộng đồng hoặc nhóm người liên quan.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: khi lửa thiêu nuốt
  rationale: אכל nghĩa đen là “ăn”; với lửa làm chủ thể, “thiêu nuốt” vừa tự nhiên vừa bảo tồn hình ảnh mạnh của nguyên văn.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: hai trăm năm mươi người
  rationale: Chuyển trực tiếp số đếm và אִישׁ sang cách nói tự nhiên trong tiếng Việt.
- source_word: וַיִּהְיוּ לְנֵס
  choice: họ trở thành một dấu hiệu cảnh báo
  rationale: נֵס có thể là dấu hiệu, tín hiệu hoặc vật hiệu; “dấu hiệu cảnh báo” làm rõ chức năng trong bối cảnh phán xét, đồng thời chú thích bảo tồn nghĩa sát hơn.
theological_decisions:
- issue: Đối tượng của động từ số nhiều trong “họ trở thành một dấu hiệu”
  choice: Giữ đại từ số nhiều “họ”, không xác định hẹp hơn đối tượng quy chiếu.
  alternative: Chỉ riêng hai trăm năm mươi người, hoặc toàn bộ biến cố, trở thành dấu hiệu.
  rationale: Dạng số nhiều trong tiếng Hê-bơ-rơ cho phép hơn một cách xác định tiền ngữ; bản dịch giữ sự mơ hồ ấy.
- issue: Quan hệ của Cô-rê với việc bị đất nuốt trong câu này
  choice: 'Dịch theo cú pháp trực tiếp: “họ cùng Cô-rê”.'
  alternative: Diễn giải để tách Cô-rê khỏi những người bị đất nuốt.
  rationale: Câu này nêu Cô-rê trong cùng cấu trúc tân ngữ; không nên tự ý điều hòa với trình thuật rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh “đất há miệng” và sự mơ hồ của đại từ số nhiều; dùng “cộng đồng ấy” để chỉ nhóm vừa được nhắc đến, tránh khiến độc giả hiểu là toàn thể hội chúng Israel.
