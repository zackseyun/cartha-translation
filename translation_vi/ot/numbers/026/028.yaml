  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: vi
  text: 'Các con trai của Giô-sép, theo các thị tộc của họ: Ma-na-se và Ép-ra-im.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Các con trai của
  rationale: Dạng số nhiều liên kết của בֵּן; cách dịch này giữ nguyên ngôn ngữ phả hệ trực tiếp của câu, thay vì mở rộng thành “hậu duệ”.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: Trong bối cảnh kiểm kê và tổ chức bộ tộc, מִשְׁפָּחָה chỉ đơn vị thân tộc rộng hơn gia đình hạt nhân; giới từ לְ diễn tả sự phân loại, nên “theo từng thị tộc” vừa rõ nghĩa vừa sát cấu trúc nguồn.
- source_word: מְנַשֶּׁה
  choice: Ma-na-se
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: וְאֶפְרָיִם
  choice: và Ép-ra-im
  rationale: Giữ liên từ וְ và phiên âm tên riêng theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thị tộc” để phân biệt đơn vị tổ chức dòng họ trong cuộc kiểm kê với nghĩa hẹp hiện đại của “gia đình”. Không cần chú thích vì bản dịch chính đã thể hiện trực tiếp sắc thái phân loại của לְמִשְׁפְּחֹתָם.
