  text: To Aaron were born Nadab and Abihu[a], Eleazar and Ithamar.
translation:
  language: vi
  text: A-rôn có các con là Na-đáp, A-bi-hu, Ê-lê-a-sa và Y-tha-ma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng một động từ bị động số ít trong công thức gia phả để dẫn vào danh sách gồm Na-đáp, A-bi-hu, Ê-lê-a-sa và Y-tha-ma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלֵד לְאַהֲרֹן
  choice: A-rôn sinh được
  rationale: Động từ ילד ở thể Niphal cùng giới từ ל tạo thành công thức gia phả, theo nghĩa các con được sinh ra cho A-rôn. Cách nói “A-rôn sinh được” tự nhiên trong tiếng Việt, vẫn giữ sắc thái kết quả mà không chuyển hẳn sang ý chủ động “A-rôn làm cha của”.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: liệt kê các tên, nối tên cuối bằng “và”
  rationale: אֶת là dấu hiệu chỉ tân ngữ xác định và không cần dịch riêng sang tiếng Việt; các tên được trình bày thành một danh sách tự nhiên.
- source_word: נָדָב
  choice: Na-đáp
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết quen thuộc, dễ đọc trong tiếng Việt.
- source_word: אֲבִיהוּא
  choice: A-bi-hu
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết quen thuộc trong tiếng Việt.
- source_word: אֶלְעָזָר
  choice: Ê-lê-a-sa
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết quen thuộc trong tiếng Việt.
- source_word: אִיתָמָר
  choice: Y-tha-ma
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết quen thuộc trong tiếng Việt.
