  source_fidelity: 'Bản dịch truyền đạt đúng công thức mở đầu của tiếng Hê-bơ-rơ: Yahweh là chủ ngữ; Môi-se và Ê-lê-a-sa là hai người nhận lời; Ê-lê-a-sa được xác định là con trai của A-rôn, thầy tế lễ; và “rằng:” đúng chức năng dẫn sang lời nói ở câu tiếp theo. Cách hiểu “thầy tế lễ” bổ nghĩa cho A-rôn phù hợp với cấu trúc nguyên văn và ngữ cảnh.'
