source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: vi
  text: 'Yahweh phán[a] với Môi-se và với Ê-lê-a-sa, con trai của thầy tế lễ A-rôn, rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa sát là “nói”; ở đây dùng “phán” vì chủ thể là Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ có nghĩa cơ bản là “nói”; khi chủ thể là Đức Chúa Trời, “phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và phù hợp với công thức dẫn lời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה וְאֶל אֶלְעָזָר
  choice: với Môi-se và với Ê-lê-a-sa
  rationale: Lặp lại “với” để phản ánh hai cụm giới từ song song trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: con trai của thầy tế lễ A-rôn
  rationale: Diễn đạt chuỗi quan hệ là Ê-lê-a-sa, con trai của A-rôn, người được xác định là thầy tế lễ; trật tự tiếng Việt này rõ ràng và tự nhiên.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: “Rằng” giữ chức năng của dạng nguyên thể dùng để dẫn vào lời nói trực tiếp; dấu hai chấm báo trước nội dung ở câu kế tiếp.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Danh xưng הַכֹּהֵן gắn với ai
  choice: A-rôn là thầy tế lễ
  alternative: Ê-lê-a-sa là thầy tế lễ
  rationale: Cấu trúc liền kề “A-rôn, thầy tế lễ” và cách hiểu thông thường của cụm Hê-bơ-rơ ủng hộ việc danh xưng xác định A-rôn trong câu này, dù Ê-lê-a-sa cũng là thầy tế lễ theo ngữ cảnh rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ danh riêng Yahweh và công thức dẫn lời “phán… rằng”, đồng thời tránh lối diễn đạt cổ như “bèn” hoặc “mà rằng”.
