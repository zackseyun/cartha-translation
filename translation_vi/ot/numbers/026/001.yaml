  terminology: “Yahweh” nhất quán với quyết định dịch danh יהוה. “Phán” là lựa chọn trang trọng, tự nhiên trong văn cảnh Kinh Thánh cho động từ אמר khi Yahweh là chủ thể, dù nghĩa từ vựng cơ bản là “nói”. Các dạng tên Môi-se, Ê-lê-a-sa và A-rôn phù hợp lối phiên âm Việt ngữ quen dùng.
