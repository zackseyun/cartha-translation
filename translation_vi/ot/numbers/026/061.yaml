base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: vi
  text: Nhưng Na-đáp và A-bi-hu đã chết khi họ dâng thứ lửa không được phép trước mặt Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lửa lạ”. Cụm từ Hê-bơ-rơ chỉ thứ lửa không được phép dùng khi dâng lễ trước mặt Yahweh.
    reason: Bảo lưu cách dịch sát truyền thống của אֵשׁ זָרָה, đồng thời giải thích sắc thái nghi lễ mà không xác định thêm bản chất của loại lửa này.
lexical_decisions:
- source_word: וַיָּמָת
  choice: đã chết
  rationale: Động từ số ít đứng trước chủ ngữ kép là cách dùng thông thường trong tiếng Hê-bơ-rơ; tiếng Việt diễn đạt tự nhiên với chủ ngữ gồm cả Na-đáp và A-bi-hu.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Na-đáp và A-bi-hu
  rationale: Phiên âm tên riêng theo dạng quen thuộc, rõ âm tiết trong tiếng Việt.
- source_word: בְּהַקְרִיבָם
  choice: khi họ dâng
  rationale: Giới từ בְּ đi với động từ nguyên thể và hậu tố mang ý nghĩa thời gian tại đây; “dâng” phù hợp với bối cảnh tế lễ.
- source_word: אֵשׁ זָרָה
  choice: thứ lửa không được phép
  rationale: Trong bối cảnh thờ phượng, זָרָה chỉ thứ lửa không thích hợp hoặc không được phép dùng; cách dịch này sáng nghĩa hơn “lửa lạ” nhưng chú thích vẫn bảo lưu khả năng dịch sát mặt chữ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי được diễn đạt tự nhiên là “trước mặt”; danh riêng giao ước יהוה được phiên là “Yahweh” thay vì thay thế bằng một tước hiệu.
- source_word: וַ
  choice: Nhưng
  rationale: Liên từ mở đầu đánh dấu sự tương phản giữa ghi chú về cái chết của hai người này và mạch gia phả chung quanh.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה; phiên âm bảo tồn đặc tính danh riêng mà không áp đặt một tước hiệu thay thế.
- issue: Tính chất của אֵשׁ זָרָה
  choice: lửa không được phép
  alternative: lửa lạ; lửa ngoại lai
  rationale: Bản văn gọi loại lửa này là זָרָה nhưng không giải thích cụ thể nó sai khác thế nào; bản dịch truyền đạt sắc thái không thích hợp trong nghi lễ mà không xác định thêm nguồn gốc hay phương thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thứ lửa không được phép” để tránh sự mơ hồ khó hiểu của cách nói truyền thống “lửa lạ”, đồng thời giữ cách dịch sát hơn trong chú thích.
