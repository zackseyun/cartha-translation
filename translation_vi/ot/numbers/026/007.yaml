  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: vi
  text: Đó là các thị tộc của người Ru-bên; số người được kiểm kê của họ là bốn mươi ba nghìn bảy trăm ba mươi người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh kiểm kê theo chi phái của sách Dân Số, từ này chỉ các nhóm thân tộc lớn trong một chi phái, không phải các gia đình hạt nhân.
- source_word: הָרֻאוּבֵנִי
  choice: người Ru-bên
  rationale: Danh từ chỉ những người thuộc về hoặc hậu duệ của Ru-bên; cách nói này tự nhiên và quen thuộc trong tiếng Việt.
- source_word: פְקֻדֵיהֶם
  choice: số người được kiểm kê trong họ
  rationale: Từ này bắt nguồn từ động từ פקד và trong ngữ cảnh này chỉ những người được đếm, ghi danh trong cuộc kiểm kê. Cách dịch giữ sắc thái bị động mà không tự ý thêm giới tính.
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Động từ nối dẫn vào tổng số; dùng “là” tạo câu thống kê tự nhiên trong tiếng Việt.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: bốn mươi ba nghìn bảy trăm ba mươi người
  rationale: Viết số bằng chữ phù hợp văn phong trang trọng của danh sách kiểm kê; thêm loại từ “người” ở cuối để câu tiếng Việt rõ nghĩa và tự nhiên.
