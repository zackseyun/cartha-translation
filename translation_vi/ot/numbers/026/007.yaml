    issue: Cụm “được kiểm kê trong họ”
    rationale: “Trong họ” không phản ánh chính xác hậu tố sở hữu -họ trong פְקֻדֵיהֶם và có thể gợi nghĩa “được kiểm kê ở trong nhóm ấy.” “Của họ” biểu đạt quan hệ sở hữu/liên thuộc mà tiếng Hê-bơ-rơ nêu.
  revised_text: Đó là các thị tộc của người Ru-bên; số người được kiểm kê của họ là bốn mươi ba nghìn bảy trăm ba mươi người.
