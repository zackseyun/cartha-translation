source:
  edition: WLC
  text: לְ/יָשׁ֕וּב מִשְׁפַּ֖חַת הַ/יָּשׁוּבִ֑י לְ/שִׁמְרֹ֕ן מִשְׁפַּ֖חַת הַ/שִּׁמְרֹנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: vi
  text: Từ Gia-súp có thị tộc Gia-súp; từ Sim-rôn có thị tộc Sim-rôn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: Từ Gia-súp
  rationale: Trong công thức thống kê gia phả này, לְ đứng trước tên người tổ tiên mà thị tộc mang tên. “Từ Gia-súp” diễn đạt tự nhiên quan hệ xuất thân ấy trong tiếng Việt.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Trong bối cảnh kiểm kê các chi tộc của một bộ tộc, מִשְׁפָּחָה chỉ một nhóm thân tộc lớn hơn gia đình riêng lẻ; “thị tộc” chính xác hơn “gia đình”.
- source_word: הַ/יָּשׁוּבִי
  choice: thị tộc Gia-súp
  rationale: Dạng chỉ dân thuộc nhóm hậu duệ của Gia-súp. Tiếng Việt diễn đạt rõ và tự nhiên bằng tên tổ tiên sau danh từ “thị tộc”.
- source_word: לְ/שִׁמְרֹן
  choice: từ Sim-rôn
  rationale: Cùng công thức với Gia-súp, giới từ לְ giới thiệu tổ tiên mang tên của thị tộc; giữ cấu trúc song song trong tiếng Việt.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Lặp lại nhất quán thuật ngữ chỉ phân nhóm thân tộc trong danh sách kiểm kê.
- source_word: הַ/שִּׁמְרֹנִי
  choice: thị tộc Sim-rôn
  rationale: Dạng chỉ nhóm hậu duệ của Sim-rôn được chuyển thành cách gọi thị tộc tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và có nhịp song song phù hợp với danh sách kiểm kê. Dùng “thị tộc” để phân biệt đơn vị thân tộc này với gia đình riêng lẻ; phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt hiện đại.
