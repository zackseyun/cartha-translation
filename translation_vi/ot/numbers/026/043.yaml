  yaml_path: translation/ot/numbers/026/043.yaml
  text: All the families of the Shuhamites[a], according to those numbered among them, were sixty-four thousand four hundred.
translation:
  language: vi
  text: Tất cả các gia tộc của người Su-ha-mít[a], theo số người được kiểm kê, là 64.400 người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả các thị tộc của người Su-ha-mít.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Tất cả
  rationale: Diễn đạt trọn vẹn toàn bộ các gia tộc được tổng kết trong cuộc kiểm kê.
- source_word: מִשְׁפְּחֹת
  choice: các gia tộc
  rationale: Trong bối cảnh phả hệ và kiểm kê chi phái, “gia tộc” tự nhiên và chính xác hơn “gia đình,” đồng thời vẫn giữ được nghĩa nhóm thân tộc.
- source_word: הַשּׁוּחָמִי
  choice: người Su-ha-mít
  rationale: Đây là danh xưng chỉ tập thể hậu duệ hoặc gia tộc mang tên Su-ham; dạng phiên âm kèm “người” thể hiện căn tính nhóm.
- source_word: לִפְקֻדֵיהֶם
  choice: theo số người được kiểm kê
  rationale: Cụm từ bắt nguồn từ פקד trong ngữ cảnh kiểm kê, chỉ những người đã được ghi nhận và đếm làm cơ sở cho tổng số.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 64.400 người
  rationale: Giữ nguyên tổng số chính xác và trình bày theo cách viết số thông dụng trong tiếng Việt; thêm “người” để câu tự nhiên và làm rõ đơn vị đếm.
theological_decisions: []
