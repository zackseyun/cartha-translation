  to: Hãy kiểm kê toàn thể cộng đồng con cái Y-sơ-ra-ên[a], từ hai mươi tuổi trở lên, theo các gia tộc bên cha của họ, tức tất cả những người trong Y-sơ-ra-ên có thể ra trận[b].
  rationale: Các sửa đổi giới hạn ở việc làm rõ công thức quân sự theo chức năng của nó, phản ánh số nhiều của đơn vị thân tộc, và chỉnh chú thích thành ngữ cho chính xác. Không thay đổi ý nghĩa, không thêm tiêu chuẩn pháp lý hay thể lực cụ thể, và vẫn giữ cách gọi thân tộc “con cái Y-sơ-ra-ên.”
