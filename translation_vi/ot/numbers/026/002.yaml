id: NUM.26.2
reference: Numbers 26:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: שְׂא֞וּ אֶת רֹ֣אשׁ כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֗ל מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: vi
  text: Hãy kiểm kê toàn thể cộng đồng con cái Y-sơ-ra-ên[a], từ hai mươi tuổi trở lên, theo các gia tộc bên cha của họ, tức tất cả những người trong Y-sơ-ra-ên có thể ra trận[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn tiếng Hê-bơ-rơ là “hãy nhấc đầu của toàn thể cộng đồng”, một thành ngữ có nghĩa là đếm hoặc kiểm kê.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tất cả những người trong Y-sơ-ra-ên thuộc diện phục vụ quân đội.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: Hãy kiểm kê
  rationale: Cụm này dịch sát là “hãy nhấc đầu lên” nhưng là một thành ngữ chỉ việc đếm hoặc lập danh sách dân số; “kiểm kê” truyền đạt rõ hành động thống kê có tổ chức.
- source_word: כָּל־עֲדַת
  choice: toàn thể cộng đồng
  rationale: עֵדָה chỉ cộng đồng dân giao ước; “cộng đồng” tự nhiên trong tiếng Việt hiện đại và vẫn giữ sắc thái tập thể.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh quan hệ huyết thống của nguyên ngữ mà không khiến câu tiếng Việt bị hiểu là chỉ các con trai; phạm vi nam giới thuộc diện quân dịch được làm rõ ở cuối câu.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Cách diễn đạt tự nhiên và chính xác cho công thức chỉ ngưỡng tuổi.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc bên cha của họ
  rationale: בֵּית אָב là đơn vị thân tộc phụ hệ, rộng hơn một hộ gia đình hạt nhân; cách dịch này nêu rõ cơ cấu phân loại của cuộc kiểm kê.
- source_word: כָּל־יֹצֵא צָבָא
  choice: tất cả những người ... ra trận
  rationale: Giữ gần cấu trúc phân từ của nguyên ngữ, chỉ những người thuộc diện tham chiến, mà không thêm trực tiếp ý “có khả năng” vốn chỉ là hàm ý.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Y-sơ-ra-ên
  rationale: Diễn đạt phạm vi cộng đồng một cách trực tiếp và tự nhiên.
theological_decisions:
- issue: Phạm vi giới tính của בְּנֵי יִשְׂרָאֵל trong cuộc kiểm kê quân sự
  choice: con cái Y-sơ-ra-ên
  alternative: các con trai Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” bảo tồn thành ngữ thân tộc truyền thống của tiếng Hê-bơ-rơ. Cụm “những người ... ra trận” xác định nhóm được kiểm kê theo chức năng quân sự, tránh biến toàn bộ tên gọi dân tộc thành một tuyên bố chỉ về nam giới.
- issue: Mức độ hàm ý về khả năng phục vụ quân sự trong כָּל־יֹצֵא צָבָא
  choice: ra trận
  alternative: đủ sức ra trận; thuộc diện quân dịch
  rationale: Nguyên ngữ nói theo nghĩa đen về người “đi ra” cho quân đội hoặc chiến trận. Bản dịch giữ cách nói này, không làm rõ quá mức tiêu chuẩn thể lực hay pháp lý mà câu không trực tiếp nêu.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu. “Kiểm kê” phù hợp với cuộc thống kê có tổ chức; “gia tộc bên cha” diễn đạt cơ cấu phụ hệ rõ hơn cách dịch sát nhưng khó hiểu là “nhà cha”. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
