  terminology: Các tên Gát, Xê-phôn, Ha-ghi và Su-ni được phiên âm nhất quán. Chú thích cần diễn đạt rõ rằng dạng thay thế liên quan cả tên tổ phụ lẫn danh xưng thị tộc, thay vì nói thị tộc đơn thuần “gọi là” một tên tổ phụ.
