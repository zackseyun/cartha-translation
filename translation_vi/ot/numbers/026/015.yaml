base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: vi
  text: 'Các con trai của Gát, theo các thị tộc của họ: Xê-phôn[a]—thị tộc Xê-phôn; Ha-ghi—thị tộc Ha-ghi; Su-ni—thị tộc Su-ni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số truyền thống tiếng Anh dùng “Xi-phi-ôn” / “người Xi-phi-ôn” ở đây (so sánh Sáng Thế Ký 46:16). Tuy nhiên, Bản Masore trong câu này chép “Xê-phôn” (צפון), nên bản văn chính giữ “Xê-phôn”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: Các con trai của Gát
  rationale: Giữ thành ngữ gia phả trang trọng của tiếng Hê-bơ-rơ; trong ngữ cảnh kiểm kê bộ tộc, cụm này chỉ các dòng dõi nam của Gát.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: מִשְׁפָּחָה ở đây là đơn vị thị tộc trong một chi phái, không chỉ một gia đình hạt nhân; “theo từng” diễn đạt tự nhiên cách phân loại của cuộc kiểm kê.
- source_word: לִצְפוֹן
  choice: từ Xê-phôn
  rationale: Tiền tố לְ trong công thức gia phả này biểu thị dòng xuất thân; “từ” truyền đạt rõ quan hệ nguồn gốc.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: thị tộc Xê-phôn
  rationale: Dạng chỉ người thuộc dòng Xê-phôn được diễn đạt tự nhiên trong tiếng Việt bằng tên tổ phụ dùng làm tên thị tộc, tránh tạo một danh xưng dân tộc gượng ép.
- source_word: לְחַגִּי ... מִשְׁפַּחַת הַחַגִּי
  choice: từ Ha-ghi có thị tộc Ha-ghi
  rationale: Giữ cấu trúc gia phả song song và chuyển tên riêng theo âm Hê-bơ-rơ.
- source_word: לְשׁוּנִי ... מִשְׁפַּחַת הַשּׁוּנִי
  choice: từ Su-ni có thị tộc Su-ni
  rationale: Giữ cấu trúc gia phả song song và chuyển tên riêng theo âm Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp với danh sách kiểm kê. Dùng “thị tộc” để phân biệt đơn vị dòng họ trong chi phái với “gia đình” theo nghĩa hiện đại. Các tên riêng được phiên âm nhất quán, dễ đọc trong tiếng Việt hiện đại.
