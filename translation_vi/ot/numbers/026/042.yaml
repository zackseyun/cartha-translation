base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: vi
  text: 'Đây là các con trai[a] của Đan, theo các thị tộc của họ: từ Su-ham, thị tộc Su-ham. Đó là các thị tộc của Đan, theo các thị tộc của họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Đan”; trong công thức gia phả dùng khi kiểm tra dân số, “các con trai” có thể chỉ các hậu duệ của một bộ tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Cụm chỉ thị mở đầu một mục liệt kê trong bản kiểm tra dân số; tiếng Việt dùng hiện tại tự nhiên và không buộc phải thêm thì quá khứ như tiếng Anh.
- source_word: בְנֵי דָן
  choice: các con trai của Đan
  rationale: Giữ nghĩa trực tiếp và công thức gia phả của בְּנֵי, đồng thời chú thích rằng trong ngữ cảnh bộ tộc, cụm này có thể chỉ các hậu duệ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: Trong ngữ cảnh kiểm tra dân số của Dân Số, מִשְׁפָּחָה chỉ đơn vị thị tộc thuộc bộ tộc; “theo từng” diễn đạt tự nhiên ý phân loại của tiền tố לְ.
- source_word: לְשׁוּחָם
  choice: từ Su-ham
  rationale: Tiền tố לְ trong công thức gia phả nêu người làm nguồn gốc của thị tộc; “từ Su-ham” làm rõ quan hệ hậu duệ mà không thêm thông tin ngoài bản nguồn.
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: thị tộc Su-ham
  rationale: Danh từ chỉ thị tộc cùng tính từ quy thuộc biểu thị tập thể mang tên tổ phụ Su-ham; cách gọi này ngắn gọn, rõ ràng và tự nhiên trong tiếng Việt.
- source_word: מִשְׁפְּחֹת דָּן
  choice: các thị tộc của Đan
  rationale: Dịch nhất quán מִשְׁפָּחָה là “thị tộc” trong toàn câu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: Giữ nguyên sự lặp lại có chủ ý của công thức kiểm tra dân số trong tiếng Hê-bơ-rơ, thay vì đổi từ ở lần xuất hiện cuối.
