translation_notes:
  register: 'Văn phong trang trọng, sáng rõ và mang tính liệt kê. Dùng “thị tộc” để phân biệt đơn vị dòng họ trong bộ tộc; giữ sự lặp lại của nguyên bản. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt: Đan, Su-ham.'
