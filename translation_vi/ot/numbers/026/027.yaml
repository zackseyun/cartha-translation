  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: vi
  text: Đây là các thị tộc của người Sa-bu-lôn. Số người được kiểm kê của họ là sáu mươi nghìn năm trăm người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ thị số nhiều mở đầu câu tổng kết; tiếng Việt tự nhiên dùng “Đây là” mà không cần biểu thị số ở động từ.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh bộ tộc và kiểm kê dân số, từ này chỉ các nhóm thân tộc mở rộng thuộc một chi phái; “thị tộc” chính xác hơn “gia đình”.
- source_word: הַזְּבוּלֹנִי
  choice: người Sa-bu-lôn
  rationale: Danh từ chỉ dân có mạo từ, ở số ít nhưng mang nghĩa tập thể, nói đến những người thuộc chi phái Sa-bu-lôn.
- source_word: לִפְקֻדֵיהֶם
  choice: theo số người được kiểm kê trong số họ
  rationale: Cụm từ bắt nguồn từ פקד trong nghĩa kiểm kê dân số, liên kết các thị tộc với tổng số thành viên đã được đếm; cách dịch giữ được quan hệ “từ trong số họ” của hậu tố.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: sáu mươi nghìn năm trăm người
  rationale: Diễn đạt con số bằng chữ theo văn phong trang trọng của bản kiểm kê; thêm “người” để câu tiếng Việt rõ và tự nhiên.
