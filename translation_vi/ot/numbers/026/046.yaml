  text: And the name of Asher’s daughter was Serah[a].
translation:
  language: vi
  text: Còn tên con gái của A-se là Sê-rách.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ mở đầu: “Và tên con gái A-se là Sê-rách.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: Tên ... là
  rationale: Cụm liên từ וְ với danh từ שֵׁם bổ sung một ghi chú gia phả. Trong tiếng Việt, cấu trúc “Tên ... là” tự nhiên và vẫn giữ được lối diễn đạt danh từ của nguyên văn; không cần dịch máy móc liên từ וְ ở đầu câu.
- source_word: בַּת
  choice: con gái
  rationale: Danh từ số ít ở dạng liên kết, nghĩa đen là “con gái của”; trong văn cảnh gia phả này, cách hiểu tự nhiên nhất là con gái thực sự chứ không phải một nữ hậu duệ nói chung.
- source_word: אָשֵׁר
  choice: A-se
  rationale: Đây là tên riêng Asher; dùng dạng phiên âm tiếng Việt quen thuộc “A-se” thay vì dịch nghĩa.
- source_word: שָׂרַח
  choice: Sê-rách
  rationale: Đây là tên riêng Serah, nên được phiên âm chứ không dịch nghĩa; “Sê-rách” thể hiện tên Hê-bơ-rơ và phân biệt với Sa-ra.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu tiếng Việt dùng trật tự tự nhiên “Tên con gái của A-se là...” thay cho việc giữ cứng liên từ mở đầu và cấu trúc sở hữu của tiếng Hê-bơ-rơ.
