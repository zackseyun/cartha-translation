source:
  edition: WLC
  text: וַ/יִּהְי֣וּ בְנֵי פֶ֔רֶץ לְ/חֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽ/חֶצְרֹנִ֑י לְ/חָמ֕וּל מִשְׁפַּ֖חַת הֶ/חָמוּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: vi
  text: 'Các con trai của Pê-rết gồm có: về Hết-rôn, gia tộc người Hết-rôn; về Ha-mun, gia tộc người Ha-mun.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: gồm có
  rationale: Trong công thức gia phả và kiểm kê này, động từ היה giới thiệu các thành viên được liệt kê; “gồm có” tự nhiên trong tiếng Việt và diễn đạt đúng chức năng của câu.
- source_word: בְנֵי
  choice: các con trai của
  rationale: Ngữ cảnh nêu trực tiếp những người nam đứng đầu các dòng họ; cách dịch này giữ sắc thái giới tính và hình thức gia phả của tiếng Hê-bơ-rơ.
- source_word: פֶרֶץ
  choice: Pê-rết
  rationale: Phiên âm hiện đại, dễ đọc trong tiếng Việt, dựa trên tên Hê-bơ-rơ Perez.
- source_word: לְחֶצְרֹן
  choice: Hết-rôn, thủy tổ của
  rationale: Tiền tố ל trong công thức kiểm kê chỉ mối liên hệ hình thành hoặc xuất thân của gia tộc; cách diễn đạt này làm rõ rằng gia tộc mang tên Hết-rôn phát sinh từ ông.
- source_word: מִשְׁפַּחַת
  choice: gia tộc
  rationale: Trong ngữ cảnh kiểm kê của sách Dân Số, từ này chỉ một đơn vị thân tộc nằm trong bộ tộc; “gia tộc” là cách gọi tự nhiên và phù hợp trong tiếng Việt.
- source_word: הַחֶצְרֹנִי
  choice: gia tộc Hết-rôn
  rationale: Dạng chỉ nhóm hậu duệ mang tên Hết-rôn được diễn đạt tự nhiên bằng tên của gia tộc trong tiếng Việt.
- source_word: לְחָמוּל
  choice: Ha-mun, thủy tổ của
  rationale: Như với Hết-rôn, tiền tố ל đánh dấu người mà gia tộc bắt nguồn từ đó; “thủy tổ của” truyền đạt rõ quan hệ này.
- source_word: הֶחָמוּלִי
  choice: gia tộc Ha-mun
  rationale: Dạng chỉ nhóm hậu duệ của Hamul được chuyển thành tên gia tộc, phù hợp với lối diễn đạt tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “gia tộc” nhất quán cho מִשְׁפָּחָה và thêm “thủy tổ” để chuyển tự nhiên cấu trúc לְ + tên người cùng danh xưng hậu duệ, tránh cách dịch cứng hoặc mơ hồ trong tiếng Việt.
