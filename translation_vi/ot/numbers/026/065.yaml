source:
  edition: WLC
  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: vi
  text: 'Vì Đức Giê-hô-va đã phán về họ: “Họ chắc chắn sẽ chết trong hoang mạc”[a]; và trong số họ không còn lại một người nào, ngoại trừ Ca-lép, con trai Giê-phu-nê, và Giô-suê, con trai Nun.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ lặp ý “chết” bằng một cấu trúc nhấn mạnh, nghĩa là “chắc chắn sẽ chết”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn theo sát từng chữ: “không còn lại từ trong họ một người nào”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên nhân của mệnh đề này đối với kết quả cuộc kiểm tra dân số được nêu trước đó.
- source_word: אָמַר לָהֶם
  choice: đã phán về họ
  rationale: Trong ngữ cảnh, lời phán liên quan đến số phận của nhóm người ấy; “phán về họ” tự nhiên hơn “phán với họ” mà vẫn giữ được khả năng ngữ nghĩa của giới từ ל.
- source_word: מוֹת יָמֻתוּ
  choice: Họ chắc chắn sẽ chết
  rationale: Diễn đạt sức nhấn mạnh của cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn mà không sao chép máy móc thành ngữ pháp Hê-bơ-rơ.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: “Hoang mạc” chỉ vùng đất hoang vu nơi dân Y-sơ-ra-ên lưu lạc, không nhất thiết chỉ một sa mạc toàn cát.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: và trong số họ không còn lại một người nào
  rationale: Giữ ý phân phối của אִישׁ và ý xuất thân từ nhóm của מֵהֶם, đồng thời dùng cú pháp tiếng Việt tự nhiên.
- source_word: כִּי אִם
  choice: ngoại trừ
  rationale: Thành ngữ này giới thiệu hai trường hợp duy nhất nằm ngoài lời phủ định trước đó.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Ca-lép, con trai Giê-phu-nê
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt và dịch rõ quan hệ phụ tử.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: và Giô-suê, con trai Nun
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt và dịch rõ quan hệ phụ tử.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản văn ghi trực tiếp danh giao ước; vì vậy giữ dưới dạng danh riêng thay vì thay bằng tước hiệu. “Đức Giê-hô-va” là dạng tiếng Việt trang trọng, dễ nhận biết.
- issue: Phạm vi của án chết trong hoang mạc
  choice: Không còn một người nào trong nhóm ấy, ngoại trừ Ca-lép và Giô-suê
  alternative: Diễn đạt chung chung rằng không ai sống sót
  rationale: Giữ rõ hai ngoại lệ được bản văn nêu đích danh, không mở rộng hoặc thu hẹp nhóm được nhắc đến ngoài ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời của Đức Chúa Trời; “hoang mạc” cho מִדְבָּר; tên riêng theo dạng quen thuộc trong Kinh Thánh tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
