base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: vi
  text: 'Các con trai của Nép-ta-li, theo từng thị tộc của họ: thuộc về Gia-xê-ên là thị tộc Gia-xê-ên; thuộc về Gu-ni là thị tộc Gu-ni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Các con trai của
  rationale: Giữ sát dạng cấu tạo “các con trai của” trong tiếng Hê-bơ-rơ; ở đây cụm từ mở đầu danh sách các nhánh thuộc chi tộc và vẫn tự nhiên trong văn cảnh gia phả.
- source_word: נַפְתָּלִי
  choice: Nép-ta-li
  rationale: Phiên âm tên riêng theo cách viết quen thuộc, dễ đọc trong tiếng Việt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: Diễn đạt ý phân loại theo từng nhóm huyết tộc trong cuộc kiểm kê; “thị tộc” phân biệt rõ hơn với gia đình hạt nhân.
- source_word: לְיַחְצְאֵל
  choice: thuộc về Gia-xê-ên
  rationale: Giới từ לְ trong công thức kiểm kê giới thiệu tổ phụ mà nhánh thị tộc được quy về; “thuộc về” thể hiện quan hệ phân nhóm mà không biến cụm này thành lời chỉ hướng.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: thị tộc Gia-xê-ên
  rationale: Danh từ chỉ nhóm hậu duệ mang tên tổ phụ; tiếng Việt tự nhiên dùng tên riêng bổ nghĩa trực tiếp cho “thị tộc” thay vì tạo một danh xưng dân tộc nhân tạo.
- source_word: לְגוּנִי
  choice: thuộc về Gu-ni
  rationale: Cùng cách dùng gia phả của לְ như ở vế trước, quy nhóm này về Gu-ni.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: thị tộc Gu-ni
  rationale: Diễn đạt tập thể hậu duệ được gọi theo Gu-ni bằng cấu trúc tên thị tộc tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng; giữ cấu trúc liệt kê song song của nguyên văn. Dùng “thị tộc” nhất quán cho מִשְׁפָּחָה trong ngữ cảnh kiểm kê chi tộc. Tên riêng được phiên âm có gạch nối để người đọc phổ thông dễ phát âm.
