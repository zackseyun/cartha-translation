base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: vi
  text: 'Ru-bên, con trưởng của Y-sơ-ra-ên: các con trai của Ru-bên: Hê-nóc—dòng họ Hê-nóc; Pha-lu—dòng họ Pha-lu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát cấu trúc liệt kê Hê-bơ-rơ: “thuộc Hê-nóc, dòng họ Hê-nóc; thuộc Pha-lu, dòng họ Pha-lu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: con trưởng của Y-sơ-ra-ên
  rationale: Cụm danh từ ghép xác định Ru-bên là người con đầu lòng của Y-sơ-ra-ên. “Con trưởng” tự nhiên, trang trọng và truyền đạt cả quan hệ gia đình lẫn địa vị.
- source_word: בְּנֵי רְאוּבֵן
  choice: các con trai của Ru-bên
  rationale: Giữ nghĩa trực tiếp của בְּנֵי trong phần gia phả, đồng thời phù hợp với việc các tên tiếp theo là những người đứng đầu các dòng họ.
- source_word: חֲנוֹךְ
  choice: Hê-nóc
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo dạng quen thuộc và dễ đọc trong tiếng Việt.
- source_word: מִשְׁפַּחַת
  choice: dòng họ
  rationale: Trong ngữ cảnh kiểm kê theo chi tộc, từ này chỉ một nhóm thân tộc thuộc bộ tộc. “Dòng họ” rõ nghĩa hơn với độc giả phổ thông và không thu hẹp thành gia đình hạt nhân.
- source_word: הַחֲנֹכִי
  choice: dòng họ Hê-nóc
  rationale: Dạng chỉ hậu duệ/thành viên nhóm được chuyển thành tên dòng họ trong tiếng Việt, tránh tạo một danh xưng gượng ép.
- source_word: לְפַלּוּא
  choice: từ Pha-lu
  rationale: Giới từ לְ trong cấu trúc liệt kê này giới thiệu tổ phụ của dòng họ; “từ” diễn đạt quan hệ phát xuất/hậu duệ tự nhiên trong tiếng Việt.
- source_word: הַפַּלֻּאִי
  choice: dòng họ Pha-lu
  rationale: Dạng chỉ nhóm hậu duệ của Pha-lu được diễn đạt bằng tên dòng họ, song song với Hê-nóc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp liệt kê ngắn gọn của bản Hê-bơ-rơ, nhưng dùng “từ ... có dòng họ ...” để quan hệ gia phả rõ ràng trong tiếng Việt. Dấu chú thích [a] được đặt sau toàn bộ cấu trúc mà chú thích giải thích.
