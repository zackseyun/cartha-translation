  register: Văn phong hiện đại, trang trọng và gọn, phù hợp với danh sách gia phả–kiểm tra dân số. Dùng “thị tộc” nhất quán để thể hiện đơn vị thân tộc; tên riêng được phiên âm có gạch nối để người Việt dễ đọc.
