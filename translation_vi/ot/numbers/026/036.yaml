base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/036.yaml
  text: 'And these were the sons of Shuthelah: of Eran[a], the clan of the Eranites.'
translation:
  language: vi
  text: 'Và đây là các con trai của Su-thê-lách: từ Ê-ran có thị tộc mang tên Ê-ran[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “Và đây là các con trai của Su-thê-lách: thuộc Ê-ran, thị tộc người Ê-ran.” Ở đây, “các con trai của” là cách nói gia phả, chỉ hậu duệ hoặc các nhánh thị tộc, không nhất thiết chỉ những người con trai trực tiếp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Đây là
  rationale: Cụm liên từ và đại từ chỉ định tiếp nối danh sách kiểm tra dân số. Tiếng Việt tự nhiên có thể lược dịch liên từ וְ mà vẫn giữ đúng chức năng chuyển sang mục kế tiếp.
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Giữ cách nói gia phả trang trọng của tiếng Hê-bơ-rơ; trong ngữ cảnh này, cụm từ có thể chỉ dòng dõi chứ không nhất thiết chỉ các con trai trực tiếp.
- source_word: שׁוּתָלַח
  choice: Su-thê-la
  rationale: Phiên âm tên riêng sang dạng dễ đọc và phù hợp với âm tiết tiếng Việt.
- source_word: לְ/עֵרָן
  choice: từ Ê-ran
  rationale: Tiền tố לְ mở đầu một nhánh trong công thức kiểm tra dân số. “Từ Ê-ran” diễn đạt tự nhiên quan hệ phát sinh của thị tộc mà không dịch máy móc là “cho Ê-ran”.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Trong các danh sách kiểm tra dân số của sách Dân Số, từ này chỉ một đơn vị thân tộc thuộc bộ tộc; “thị tộc” chính xác hơn “gia đình”.
- source_word: הָ/עֵרָנִי
  choice: thị tộc Ê-ran
  rationale: Dạng chỉ hậu duệ theo tên tổ phụ обозначает nhóm mang tên Ê-ran; tiếng Việt diễn đạt tự nhiên bằng tên thị tộc thay vì tạo một danh xưng dân tộc giả định.
