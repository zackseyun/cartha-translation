  terminology: “Thị tộc”, “con cháu A-se” và “kiểm kê” phù hợp với ngữ cảnh chi phái/gia phả và thuật ngữ פקד. Giữ “người” sau tổng số để minh thị đơn vị được ngữ cảnh kiểm kê hàm ý.
