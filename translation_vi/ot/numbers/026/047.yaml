  yaml_path: translation/ot/numbers/026/047.yaml
  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: vi
  text: 'Đó là các thị tộc của con cháu A-se, theo số người của họ đã được kiểm kê: năm mươi ba nghìn bốn trăm người[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát hơn: “theo những người được kiểm kê của họ.” Tiếng Hê-bơ-rơ dùng thuật ngữ kiểm kê bắt nguồn từ động từ פקד, chỉ những người được ghi danh hoặc đếm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ định số nhiều mở đầu câu tổng kết; tiếng Việt dùng tự nhiên cấu trúc “Đó là” mà không cần thể hiện số.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh kiểm kê các chi phái, từ này chỉ những nhóm thân tộc mở rộng, không phải các gia đình hạt nhân.
- source_word: בְּנֵי אָשֵׁר
  choice: con cháu A-se
  rationale: Thành ngữ gia phả chỉ các hậu duệ thuộc chi phái A-se; “con cháu” tự nhiên trong tiếng Việt và truyền đạt đúng phạm vi tập thể của ngữ cảnh.
- source_word: לִפְקֻדֵיהֶם
  choice: tính theo những người đã được kiểm kê trong số họ
  rationale: Giữ sắc thái thuật ngữ kiểm kê của פקד và thể hiện hậu tố sở hữu, đồng thời diễn đạt rõ ràng bằng tiếng Việt hiện đại.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: năm mươi ba nghìn bốn trăm người
  rationale: Diễn đạt chính xác tổng số theo cách đọc số tự nhiên trong tiếng Việt; thêm “người” để làm rõ đơn vị đếm vốn được ngữ cảnh cung cấp.
