lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: בְנֵי là dạng số nhiều liên kết của בֵּן, dùng trong công thức gia phả với nghĩa “các con trai của”. Liên từ וּ nối tiếp danh sách; trong tiếng Việt, sự nối tiếp đã rõ từ ngữ cảnh nên không cần dịch cứng thành “Và”, giúp câu tự nhiên hơn mà không mất ý.
- source_word: פַלּוּא
  choice: Pha-lu
  rationale: Tên riêng được phiên âm theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: אֱלִיאָב
  choice: Ê-li-áp
  rationale: Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
