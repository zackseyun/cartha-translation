  text: וּ/שְׁמִידָ֕ע מִשְׁפַּ֖חַת הַ/שְּׁמִידָעִ֑י וְ/חֵ֕פֶר מִשְׁפַּ֖חַת הַֽ/חֶפְרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: vi
  text: từ Sê-mi-đa có gia tộc Sê-mi-đa; và từ Hê-phe có gia tộc Hê-phe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: từ Sê-mi-đa
  rationale: Trong công thức kiểm kê dân số rút gọn này, giới từ “từ” được bổ sung theo mô thức của ngữ cảnh để diễn đạt tự nhiên rằng gia tộc phát xuất từ tổ phụ mang tên Sê-mi-đa.
- source_word: מִשְׁפַּחַת
  choice: gia tộc
  rationale: Trong danh sách bộ tộc và kiểm kê dân số, từ này chỉ một đơn vị thân tộc thuộc một chi tộc; “gia tộc” chính xác và tự nhiên hơn “gia đình”.
- source_word: הַ/שְּׁמִידָעִי
  choice: gia tộc Sê-mi-đa
  rationale: Dạng chỉ dòng dõi nói đến nhóm hậu duệ gắn với Sê-mi-đa. Tiếng Việt diễn đạt tự nhiên bằng cách dùng tên tổ phụ bổ nghĩa cho “gia tộc”, thay vì tạo một danh xưng dân tộc nhân tạo.
- source_word: וְ/חֵפֶר
  choice: và từ Hê-phe
  rationale: Liên từ mở đầu mục kế tiếp trong công thức kiểm kê; bổ sung “từ” để làm rõ quan hệ phát xuất vốn được hàm ý trong tiếng Hê-bơ-rơ.
- source_word: הַֽ/חֶפְרִי
  choice: gia tộc Hê-phe
  rationale: Dạng chỉ dòng dõi обозначает nhóm hậu duệ của Hê-phe; cấu trúc “gia tộc Hê-phe” rõ ràng và phù hợp lối diễn đạt tiếng Việt.
theological_decisions: []
