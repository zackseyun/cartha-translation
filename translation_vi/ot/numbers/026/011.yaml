  yaml_path: translation/ot/numbers/026/011.yaml
  text: But the sons of Korah did not die[a].
translation:
  language: vi
  text: Nhưng các con trai của Cô-ra không chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và các con trai của Cô-ra không chết.” Liên từ Hê-bơ-rơ có thể chỉ sự nối tiếp đơn giản; “Nhưng” làm rõ sự tương phản với những cái chết được nói đến ngay trước đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Nhưng các con trai của
  rationale: Liên từ וּ có thể dịch đơn giản là “và”, nhưng trong ngữ cảnh này mang sắc thái tương phản với những người vừa được kể là đã chết. בְנֵי là dạng liên kết của “các con trai/con cái”; ở đây chọn “các con trai” để phản ánh sát hình thức Hê-bơ-rơ.
- source_word: קֹרַח
  choice: Cô-ra
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: לֹא
  choice: không
  rationale: Từ phủ định thông dụng, trực tiếp phủ định động từ “chết”.
- source_word: מֵתוּ
  choice: chết
  rationale: Động từ מות ở thể hoàn thành, số nhiều; trong câu phủ định tiếng Việt, “không chết” diễn đạt tự nhiên sự kiện họ đã không chết trong biến cố được nhắc đến.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn, phù hợp với lời ghi chú mang tính gia phả-tường thuật. Giữ cách gọi cụ thể “các con trai” thay vì diễn giải rộng thành “con cháu”.
