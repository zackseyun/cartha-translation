  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: vi
  text: Đây là các thị tộc của Y-sa-ca, theo số người thuộc các thị tộc ấy đã được kiểm kê:[a] sáu mươi bốn nghìn ba trăm người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo tổng số của họ” hoặc “theo danh sách đăng ký của họ.” Cụm từ Hê-bơ-rơ nói đến số người thuộc các thị tộc này đã được đăng ký trong cuộc kiểm kê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ định số nhiều mở đầu câu tổng kết; tiếng Việt không cần biểu thị số nhiều trên từ chỉ định.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh kiểm kê các chi phái, từ này chỉ những nhóm thân tộc mở rộng thuộc một chi phái; “thị tộc” chính xác hơn “gia đình”.
- source_word: יִשָּׂשכָר
  choice: Y-sa-ca
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לִפְקֻדֵיהֶם
  choice: theo số người đã được kiểm kê trong họ
  rationale: Diễn đạt cấu trúc có giới từ ל và dạng từ thuộc gốc פקד trong ngữ cảnh điều tra dân số, giữ mối liên hệ giữa các thị tộc và những người thuộc họ được tính.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: sáu mươi bốn nghìn ba trăm người
  rationale: Chuyển trật tự số Hê-bơ-rơ sang cách nói số tự nhiên trong tiếng Việt; thêm “người” để làm rõ đơn vị của con số kiểm kê.
