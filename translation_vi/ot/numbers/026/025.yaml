  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thị tộc” duy trì cấp độ tổ chức thân tộc trong bối cảnh chi phái; “kiểm kê” phù hợp với cuộc điều tra dân số trong chương này.
