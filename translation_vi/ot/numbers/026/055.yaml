base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: vi
  text: Đất chỉ được phân chia bằng cách bắt thăm; họ sẽ nhận phần thừa kế theo tên các bộ tộc của tổ phụ mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tổ tiên mình”. Tiếng Hê-bơ-rơ theo nghĩa đen là “các cha của họ”, nói đến các dòng tổ tiên bên cha trong những bộ tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Nhưng… chỉ
  rationale: Trong ngữ cảnh này, אַךְ vừa nối ý với quy định trước vừa giới hạn phương thức phân chia; cấu trúc “Nhưng… chỉ” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: בְּגוֹרָל
  choice: bằng cách bắt thăm
  rationale: Danh từ גוֹרָל chỉ thăm dùng để quyết định việc phân đất; giới từ בְּ mang nghĩa phương tiện.
- source_word: יֵחָלֵק
  choice: được phân chia
  rationale: 'Dạng Nifal diễn tả ý bị động: đất được chia thành các phần để phân bổ.'
- source_word: אֶת הָאָרֶץ
  choice: đất
  rationale: Chỉ miền đất sẽ được nhận làm cơ nghiệp; tiếng Việt không cần mạo từ tương ứng với הָ.
- source_word: לִשְׁמוֹת
  choice: theo tên
  rationale: Giới từ לְ ở đây nêu căn cứ hoặc chuẩn tham chiếu cho việc nhận phần thừa kế.
- source_word: מַטּוֹת
  choice: các bộ tộc
  rationale: Trong ngữ cảnh dân Y-sơ-ra-ên, מַטּוֹת mang nghĩa các bộ tộc chứ không phải nghĩa đen “gậy”.
- source_word: אֲבֹתָם
  choice: tổ phụ mình
  rationale: Giữ sắc thái nam giới và dòng dõi bên cha của nghĩa đen “các cha của họ”, đồng thời dùng cách nói trang trọng, tự nhiên trong văn cảnh gia phả.
- source_word: יִנְחָלוּ
  choice: họ sẽ nhận phần thừa kế
  rationale: Động từ נחל diễn tả việc nhận hoặc chiếm hữu một phần làm cơ nghiệp; cách dịch này rõ nghĩa hơn “thừa hưởng” trong ngữ cảnh phân đất.
theological_decisions:
- issue: Thuật ngữ chỉ tổ tiên theo giới tính trong אֲבֹתָם
  choice: tổ phụ mình
  alternative: tổ tiên mình
  rationale: Bản Hê-bơ-rơ dùng từ giống đực “các cha”, trong bối cảnh quyền thừa kế theo dòng phụ hệ. “Tổ phụ” bảo toàn nét nghĩa ấy mà không bổ sung một lập trường giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bắt thăm” thay cho lối nói cổ; giữ “tổ phụ” để phản ánh chính xác sắc thái phụ hệ của nguyên văn. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
