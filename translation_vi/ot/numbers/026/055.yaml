  to: Đất chỉ được phân chia bằng cách bắt thăm; họ sẽ nhận phần thừa kế theo tên các bộ tộc của tổ phụ mình.[a]
  rationale: Bỏ “Nhưng” để phản ánh trực tiếp chức năng hạn định của אַךְ (“chỉ”), không thêm sắc thái đối lập. Giữ nguyên các lựa chọn dịch thuật còn lại vì chúng trung thành với cấu trúc bị động của יֵחָלֵק, phương tiện của בְּגוֹרָל, và sắc thái phụ hệ của אֲבֹתָם. Mốc chú thích vẫn được đặt ngay sau cụm từ được giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:40:21Z'
