  terminology: “Bộ tộc,” “tổ phụ,” và “nhận phần thừa kế” phù hợp ngữ cảnh. “Tổ phụ” bảo lưu sắc thái dòng nam của אֲבֹתָם; chú thích nêu lựa chọn trung tính hơn một cách thích hợp.
