  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng wayyiqtol tiếp nối diễn tiến tường thuật; “rồi” diễn đạt tự nhiên sự tiếp nối, còn “phán” là động từ trang trọng, thông dụng khi Đức Chúa Trời nói.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Phiên âm danh riêng YHWH theo cách gọi quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong công thức nói năng tiếng Việt, “phán với” diễn đạt tự nhiên đối tượng được lời phán hướng đến.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này giới thiệu nội dung lời nói tiếp theo; “rằng” là cách diễn đạt tự nhiên trong tiếng Việt và giữ chức năng dẫn lời.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt trang trọng và dễ nhận biết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn nhập lời phán, đồng thời tránh lối đảo ngữ cứng theo tiếng Hê-bơ-rơ.
