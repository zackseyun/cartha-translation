    rationale: Trong tiếng Việt, “họ” có thể được hiểu là những người được kiểm kê thay vì các thị tộc. Bản gốc gắn hậu tố số nhiều với các thị tộc; diễn đạt rõ chủ thể quy chiếu sẽ sát nghĩa và tự nhiên hơn.
