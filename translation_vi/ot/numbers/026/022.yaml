  text: 'These were the clans of Judah according to those numbered of them: seventy-six thousand five hundred[a].'
translation:
  language: vi
  text: 'Đó là các thị tộc của Giu-đa, theo số người được kiểm kê của các thị tộc ấy: bảy mươi sáu nghìn năm trăm người.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo số người của họ”; cụm từ Hê-bơ-rơ לִפְקֻדֵיהֶם là một cách nói dùng trong việc kiểm kê, chỉ những người được ghi danh hoặc đếm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ định số nhiều mở đầu câu tổng kết; tiếng Việt không đánh dấu số ở từ này, và cách diễn đạt phù hợp với mạch tường thuật quá khứ.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh kiểm kê các chi phái, từ này chỉ những đơn vị thân tộc nằm trong chi phái; “thị tộc” chính xác hơn “gia đình”.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Dạng tên riêng quen dùng trong tiếng Việt.
- source_word: לִפְקֻדֵיהֶם
  choice: tính theo số người đã được kiểm kê trong họ
  rationale: Giữ sắc thái kiểm kê của פקד và quy chiếu hậu tố số nhiều về các thị tộc, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: bảy mươi sáu nghìn năm trăm người
  rationale: Chuyển đúng trị số sang trật tự số đếm tự nhiên của tiếng Việt; thêm “người” để làm rõ đơn vị dân số vốn được ngữ cảnh kiểm kê hàm ý.
