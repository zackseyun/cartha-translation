  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phần sản nghiệp” theo ngữ cảnh đất được ban làm cơ nghiệp; diễn đạt “mỗi chi tộc” để thể hiện ý phân phối của hậu tố số ít trong mạch văn.
