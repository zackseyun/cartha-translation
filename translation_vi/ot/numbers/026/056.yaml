  yaml_path: translation/ot/numbers/026/056.yaml
  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: vi
  text: Theo lá thăm[a], phần sản nghiệp sẽ được phân chia giữa bên đông người và bên ít người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Dựa theo lá thăm, phần sản nghiệp ấy sẽ được phân chia giữa nhóm đông người và nhóm ít người.” Tiếng Hê-bơ-rơ đối chiếu một nhóm đông hơn với một nhóm ít hơn trong việc phân chia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: Theo kết quả
  rationale: Thành ngữ này có nghĩa là “theo” hoặc “dựa trên quyết định của”; kết hợp với “bắt thăm” để diễn đạt tự nhiên rằng việc phân chia tuân theo kết quả lá thăm.
- source_word: הַגּוֹרָל
  choice: bắt thăm
  rationale: Danh từ chỉ lá thăm hay phương thức dùng thăm để phân định; “bắt thăm” là cách nói tự nhiên trong tiếng Việt và phù hợp với việc phân chia đất.
- source_word: תֵּחָלֵק
  choice: sẽ được phân chia
  rationale: Dạng Niphal mang nghĩa bị động, chỉ phần sản nghiệp được chia hoặc phân bổ.
- source_word: נַחֲלָתוֹ
  choice: phần sản nghiệp của mỗi chi tộc
  rationale: Hậu tố số ít giống đực có nghĩa sát chữ là “sản nghiệp của nó/người ấy”, nhưng trong ngữ cảnh chỉ phần đất được phân cho từng chi tộc. Cách dịch phân phối này làm rõ sở chỉ mà không thay đổi ý nghĩa.
- source_word: בֵּין רַב לִמְעָט
  choice: giữa chi tộc đông người và chi tộc ít người
  rationale: Cặp từ đối lập רַב và מְעָט nói đến hai nhóm có số dân tương đối đông và ít trong bối cảnh kiểm tra dân số và chia đất; thêm “chi tộc” giúp câu tiếng Việt rõ nghĩa.
theological_decisions: []
