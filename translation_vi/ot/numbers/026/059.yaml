id: NUM.26.59
reference: Numbers 26:59
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שֵׁ֣ם אֵ֣שֶׁת עַמְרָ֗ם יוֹכֶ֨בֶד֙ בַּת לֵוִ֔י אֲשֶׁ֨ר יָלְדָ֥ה אֹתָ֛/הּ לְ/לֵוִ֖י בְּ/מִצְרָ֑יִם וַ/תֵּ֣לֶד לְ/עַמְרָ֗ם אֶֽת אַהֲרֹן֙ וְ/אֶת מֹשֶׁ֔ה וְ/אֵ֖ת מִרְיָ֥ם אֲחֹתָֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: vi
  text: Tên vợ của Am-ram là Giô-kê-bết, con gái của Lê-vi[a], người được sinh cho Lê-vi tại Ai Cập[b]. Bà sinh cho Am-ram A-rôn, Môi-se và Mi-ri-am, chị/em gái của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hê-bơ-rơ sát nghĩa là “con gái của Lê-vi”. Trong văn cảnh gia phả, “con gái” đôi khi có thể được dùng theo nghĩa rộng hơn là một nữ hậu duệ.
    reason: lexical_alternative
  - marker: b
    text: Hê-bơ-rơ sát nghĩa là “người mà bà đã sinh cho Lê-vi tại Ai Cập”; động từ có chủ thể giống cái, nhưng danh tính người mẹ không được nêu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: Tên vợ của Am-ram
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ nguyên công thức nêu tên và quan hệ sở hữu của chuỗi liên kết Hê-bơ-rơ.
- source_word: יוֹכֶבֶד
  choice: Giô-kê-bết
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt.
- source_word: בַּת לֵוִי
  choice: con gái của Lê-vi
  rationale: Giữ nghĩa trực tiếp của בַּת, không tự ý giải quyết vấn đề gia phả bằng cách đổi thành “nữ hậu duệ”.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: người mà một phụ nữ đã sinh cho Lê-vi tại Ai Cập
  rationale: Giữ động từ chủ động giống cái và việc người mẹ không được nêu danh; “một phụ nữ” biểu thị chủ thể nữ hàm ẩn mà không xác định bà là ai.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: Bà sinh cho Am-ram
  rationale: Giữ quan hệ được đánh dấu bằng לְ giữa người mẹ, Am-ram và các con, đồng thời tự nhiên trong tiếng Việt.
- source_word: וְאֵת מִרְיָם אֲחֹתָם
  choice: và chị của họ là Mi-ri-am
  rationale: אֲחֹתָם chỉ quan hệ chị/em gái nhưng tiếng Việt buộc chọn cách xưng theo tuổi; theo mạch gia đình quen thuộc, dùng “chị”, đồng thời ghi chú khả năng dịch rộng hơn.
theological_decisions:
- issue: Ý nghĩa gia phả của cụm “con gái của Lê-vi”
  choice: Giữ “con gái của Lê-vi” trong chính văn.
  alternative: một nữ hậu duệ của Lê-vi
  rationale: Cách dịch trực tiếp bảo tồn cách diễn đạt và căng thẳng niên đại/gia phả của bản nguồn, thay vì âm thầm hài hòa hóa.
- issue: Chủ thể nữ của יָלְדָה
  choice: Không xác định danh tính người phụ nữ đã sinh Giô-kê-bết.
  alternative: 'Chuyển sang bị động: “được sinh cho Lê-vi tại Ai Cập”'
  rationale: Bản Hê-bơ-rơ có động từ giống cái số ít nhưng không nêu người mẹ; bản dịch giữ sự không xác định ấy và tránh khiến Lê-vi trở thành người sinh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách nói gia phả gần với bản Hê-bơ-rơ; các tên riêng được phiên âm theo lối Kinh Thánh tiếng Việt quen thuộc. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
