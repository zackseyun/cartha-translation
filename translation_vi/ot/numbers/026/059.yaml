  to: Tên vợ của Am-ram là Giô-kê-bết, con gái của Lê-vi[a], người được sinh cho Lê-vi tại Ai Cập[b]. Bà sinh cho Am-ram A-rôn, Môi-se và Mi-ri-am, chị/em gái của họ.
