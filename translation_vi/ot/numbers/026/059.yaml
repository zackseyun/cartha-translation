  - severity: medium
    issue: “Chị của họ” ấn định Mi-ri-am lớn tuổi hơn A-rôn và Môi-se.
    rationale: אֲחוֹתָם chỉ có nghĩa “chị/em gái của họ” và không mang thông tin về thứ bậc tuổi tác. Cần bảo toàn sự mơ hồ này.
