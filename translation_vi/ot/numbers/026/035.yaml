base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: vi
  text: 'Đây là các con trai của Ép-ra-im, theo các thị tộc của họ: từ Su-thê-lah có thị tộc Su-thê-lah; từ Bê-ke có thị tộc Bê-ke; từ Ta-han có thị tộc Ta-han.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: Đây là các con trai của Ép-ra-im
  rationale: Giữ công thức gia phả của tiếng Hê-bơ-rơ và nghĩa trực tiếp của בְנֵי, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo các thị tộc của họ
  rationale: Trong bối cảnh kiểm kê dân số của sách Dân Số, מִשְׁפָּחָה chỉ đơn vị thị tộc thuộc bộ tộc, không đơn thuần là gia đình hạt nhân.
- source_word: לְשׁוּתֶלַח ... לְבֶכֶר ... לְתַחַן
  choice: từ Su-thê-la ... từ Bê-ke ... từ Ta-han
  rationale: Giới từ לְ trong công thức này phân loại các thị tộc theo tổ tiên mang tên tương ứng; “từ” truyền đạt rõ quan hệ xuất thân.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי ... מִשְׁפַּחַת הַבַּכְרִי ... מִשְׁפַּחַת הַתַּחֲנִי
  choice: thị tộc Su-thê-la ... thị tộc Bê-ke ... thị tộc Ta-han
  rationale: Các dạng chỉ người thuộc dòng tộc được chuyển thành tên thị tộc trong tiếng Việt, tránh tạo những danh xưng dân tộc vụng về mà vẫn giữ cấu trúc lặp của nguyên văn.
