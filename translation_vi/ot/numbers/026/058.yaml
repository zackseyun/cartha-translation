source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֣ת לֵוִ֗י מִשְׁפַּ֨חַת הַ/לִּבְנִ֜י מִשְׁפַּ֤חַת הַֽ/חֶבְרֹנִי֙ מִשְׁפַּ֤חַת הַ/מַּחְלִי֙ מִשְׁפַּ֣חַת הַ/מּוּשִׁ֔י מִשְׁפַּ֖חַת הַ/קָּרְחִ֑י וּ/קְהָ֖ת הוֹלִ֥ד אֶת עַמְרָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: vi
  text: 'Đây là các thị tộc[a] của Lê-vi: thị tộc Líp-ni, thị tộc Hếp-rôn, thị tộc Mác-li, thị tộc Mu-si và thị tộc Cô-ra. Kê-hát sinh ra Am-ram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các gia tộc” hoặc “các nhóm gia đình”; từ Hê-bơ-rơ מִשְׁפָּחָה chỉ một đơn vị thân tộc trong chi phái.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Câu Hê-bơ-rơ không có động từ; “Đây là” bổ sung hệ từ theo cú pháp tiếng Việt và giới thiệu danh sách một cách tự nhiên mà không buộc phải xác định thì quá khứ hay hiện tại.
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: các thị tộc / thị tộc
  rationale: Trong ngữ cảnh kiểm kê và gia phả bộ tộc, từ này chỉ một đơn vị thân tộc thuộc phạm vi chi phái, không chỉ gia đình hạt nhân. “Thị tộc” vừa chính xác vừa dễ hiểu trong tiếng Việt hiện đại.
- source_word: לֵוִי
  choice: Lê-vi
  rationale: Tên riêng của tổ phụ chi phái được phiên âm theo cách quen thuộc trong tiếng Việt.
- source_word: הַלִּבְנִי
  choice: thị tộc Líp-ni
  rationale: Dạng tính từ chỉ nhóm hậu duệ gắn với Líp-ni; tiếng Việt diễn đạt tự nhiên bằng tên tổ phụ đặt sau “thị tộc”.
- source_word: הַחֶבְרֹנִי
  choice: thị tộc Hếp-rôn
  rationale: Diễn đạt danh xưng hậu duệ bằng cấu trúc “thị tộc + tên riêng”, song song với các mục khác.
- source_word: הַמַּחְלִי
  choice: thị tộc Mác-li
  rationale: Chỉ nhóm hậu duệ của Mác-li; cấu trúc này rõ nghĩa và tự nhiên hơn việc tạo một tính từ chỉ dân trong tiếng Việt.
- source_word: הַמּוּשִׁי
  choice: thị tộc Mu-si
  rationale: Giữ nhất quán cách trình bày các danh xưng thị tộc trong câu.
- source_word: הַקָּרְחִי
  choice: thị tộc Cô-ra
  rationale: Chỉ nhóm hậu duệ gắn với Cô-ra; dịch bằng cấu trúc danh từ tự nhiên của tiếng Việt.
- source_word: וּקְהָת
  choice: Kê-hát
  rationale: Tên riêng được phiên âm; liên từ được thể hiện bằng việc mở một câu kế tiếp, phù hợp nhịp văn tiếng Việt và vẫn giữ quan hệ nối tiếp.
- source_word: הוֹלִיד
  choice: sinh
  rationale: Dạng Hiphil của ילד trong công thức gia phả có nghĩa là sinh ra/làm cha của. “Sinh” là cách diễn đạt gia phả ngắn gọn, hiện đại và không cổ kính như “sinh hạ”.
- source_word: אֶת עַמְרָם
  choice: Am-ram
  rationale: Dấu chỉ tân ngữ אֶת không cần dịch; tên riêng được phiên âm.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. Dùng “thị tộc” để phân biệt đơn vị thân tộc trong chi phái với “gia đình” theo nghĩa hẹp; các tên thị tộc được diễn đạt theo cấu trúc tự nhiên của tiếng Việt.
