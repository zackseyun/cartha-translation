  terminology: «Thị tộc» là lựa chọn phù hợp cho מִשְׁפָּחָה trong bối cảnh kiểm kê bộ tộc. Các tên phiên âm được giữ nhất quán. Chú thích giải thích đúng phạm vi thân tộc của từ Hê-bơ-rơ.
