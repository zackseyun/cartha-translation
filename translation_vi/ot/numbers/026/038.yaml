source:
  edition: WLC
  text: בְּנֵ֣י בִנְיָמִן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/בֶ֗לַע מִשְׁפַּ֨חַת֙ הַ/בַּלְעִ֔י לְ/אַשְׁבֵּ֕ל מִשְׁפַּ֖חַת הָֽ/אַשְׁבֵּלִ֑י לַ/אֲחִירָ֕ם מִשְׁפַּ֖חַת הָ/אֲחִירָמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: vi
  text: 'Con cháu Bên-gia-min, phân theo các thị tộc của họ: từ Bê-la có thị tộc Bê-la; từ Ách-bên có thị tộc Ách-bên; từ A-hi-ram[a] có thị tộc A-hi-ram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Masoret chép là “A-hi-ram”; một số truyền thống văn bản và bản dịch ghi “A-hi-am”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: Con cháu Bên-gia-min
  rationale: בְּנֵי theo nghĩa đen là “các con trai của”, nhưng trong bản thống kê bộ tộc này từ ngữ chỉ những người thuộc dòng dõi Bên-gia-min; “con cháu” diễn đạt rõ và tự nhiên hơn trong tiếng Việt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: phân theo các thị tộc của họ
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc nằm trong một bộ tộc. “Thị tộc” chính xác hơn “gia đình”, còn “phân theo” thể hiện chức năng phân loại của giới từ לְ trong công thức kiểm kê.
- source_word: לְבֶלַע
  choice: từ Bê-la
  rationale: Giới từ לְ mở đầu nhánh hậu duệ mang tên tổ phụ. “Từ” diễn đạt quan hệ phát xuất/dòng dõi tự nhiên trong tiếng Việt.
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: thị tộc Bê-la
  rationale: הַבַּלְעִי là danh xưng chỉ những người thuộc dòng Bê-la. Tiếng Việt thường dùng chính tên tổ phụ sau “thị tộc” thay vì tạo một tộc danh biến cách.
- source_word: לְאַשְׁבֵּל
  choice: từ Ách-bên
  rationale: Giữ cùng cấu trúc phả hệ với Bê-la; tên riêng được phiên âm theo lối đọc dễ dùng trong tiếng Việt.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: thị tộc Ách-bên
  rationale: Dịch dạng chỉ thành viên/dòng dõi bằng kết cấu tiếng Việt tự nhiên “thị tộc + tên tổ phụ”.
- source_word: לַאֲחִירָם
  choice: từ A-hi-ram[a]
  rationale: Theo nguyên văn Masoret אֲחִירָם và ghi chú dị bản tại đúng tên riêng liên quan.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: thị tộc A-hi-ram
  rationale: Dạng chỉ dòng dõi của A-hi-ram được chuyển thành tên thị tộc theo cách nói tiếng Việt, đồng thời giữ phép song hành của câu.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và có nhịp liệt kê. Dùng “thị tộc” để phân biệt đơn vị dòng họ trong bộ tộc với gia đình theo nghĩa hẹp; tên riêng được phiên âm có dấu và gạch nối theo cách đọc tiếng Việt.
