base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/017.yaml
  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: vi
  text: Từ A-rốt[a] có thị tộc A-rốt; từ A-rê-li có thị tộc A-rê-li.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch theo cấu trúc công thức hơn: “A-rốt có thị tộc A-rốt; A-rê-li có thị tộc A-rê-li.” Giới từ לְ đứng trước mỗi tên tổ tiên trong công thức kiểm kê tiếng Hê-bơ-rơ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: Từ A-rốt
  rationale: Trong công thức kiểm kê gia tộc này, giới từ לְ đứng trước tên tổ tiên để giới thiệu dòng dõi phát xuất từ người ấy; “từ” diễn đạt tự nhiên mối quan hệ này trong tiếng Việt.
- source_word: מִשְׁפַּחַת
  choice: thị tộc
  rationale: Trong bối cảnh kiểm kê các chi phái, מִשְׁפָּחָה chỉ một đơn vị thân tộc thuộc chi phái; “thị tộc” chính xác và trang trọng hơn “gia đình”.
- source_word: הָאֲרוֹדִי
  choice: thị tộc A-rốt
  rationale: Danh từ chỉ dòng dõi có mạo từ xác định nhóm hậu duệ mang tên A-rốt; tiếng Việt tự nhiên dùng tên tổ tiên làm định ngữ cho “thị tộc”.
- source_word: לְאַרְאֵלִי
  choice: từ A-rê-li
  rationale: Cũng như לַאֲרוֹד, giới từ לְ giới thiệu vị tổ tiên mà thị tộc phát xuất từ đó, đồng thời giữ cấu trúc song song của câu.
- source_word: הָאַרְאֵלִי
  choice: thị tộc A-rê-li
  rationale: Hình thức chỉ dòng dõi gọi tên nhóm hậu duệ của A-rê-li; cách diễn đạt này tránh tạo một danh xưng dân tộc thiếu tự nhiên trong tiếng Việt.
