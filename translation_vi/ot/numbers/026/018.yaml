  text: 'Đây là các gia tộc của con cháu Gát, theo số người được kiểm kê của họ: 40.500 người.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: các gia tộc
  rationale: Diễn đạt tự nhiên đơn vị thị tộc/gia tộc trong cuộc kiểm kê các chi phái.
- source_word: בְּנֵי־גָד
  choice: con cháu Gát
  rationale: Trong văn cảnh gia phả và kiểm kê, cụm này chỉ hậu duệ thuộc chi phái Gát, không chỉ các con trai trực tiếp.
- source_word: לִפְקֻדֵיהֶם
  choice: theo số người được kiểm kê trong họ
  rationale: Giữ ý cuộc điểm danh/kiểm kê và sắc thái những người được tính từ trong các gia tộc ấy.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 40.500 người
  rationale: Chuyển con số sang cách ghi hiện đại của tiếng Việt; thêm 'người' để đơn vị đếm rõ ràng trong văn cảnh.
