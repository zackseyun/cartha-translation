base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/006.yaml
  text: from Hezron[a], the clan of the Hezronites; from Carmi, the clan of the Carmites.
translation:
  language: vi
  text: Từ Hết-rôn[a] có gia tộc Hết-rôn; từ Cạt-mi có gia tộc Cạt-mi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát hơn là “Về Hết-rôn ... về Cạt-mi”; giới từ Hê-bơ-rơ ở đây được dùng trong ngữ cảnh gia phả và kiểm tra dân số, chỉ sự xuất thân hoặc sự phân loại theo gia tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: Từ Hết-rôn
  rationale: Trong công thức gia phả và kiểm tra dân số này, tiền tố לְ biểu thị sự xuất thân hoặc phân loại theo dòng dõi; “từ Hết-rôn” truyền đạt tự nhiên quan hệ ấy trong tiếng Việt.
- source_word: מִשְׁפַּחַת
  choice: gia tộc
  rationale: Trong ngữ cảnh kiểm tra dân số, מִשְׁפָּחָה chỉ một đơn vị thân tộc thuộc bộ tộc; “gia tộc” chính xác và tự nhiên hơn “gia đình”.
- source_word: הַחֶצְרוֹנִי
  choice: Hết-rôn
  rationale: Dạng chỉ nhóm hậu duệ gắn với Hết-rôn; trong cấu trúc “gia tộc Hết-rôn”, tiếng Việt diễn đạt tự nhiên tên của gia tộc mà không cần tạo một danh xưng số nhiều.
- source_word: לְ/כַרְמִי
  choice: từ Cạt-mi
  rationale: Như ở לְחֶצְרֹן, tiền tố לְ biểu thị dòng dõi hoặc sự phân loại gia tộc; “từ Cạt-mi” giữ rõ quan hệ phả hệ.
- source_word: מִשְׁפַּחַת
  choice: gia tộc
  rationale: Giữ nhất quán với lần xuất hiện thứ nhất và bảo toàn cấu trúc song song của câu.
- source_word: הַכַּרְמִי
  choice: Cạt-mi
  rationale: Dạng chỉ tập thể hậu duệ của Cạt-mi được diễn đạt tự nhiên trong tiếng Việt bằng cấu trúc “gia tộc Cạt-mi”.
