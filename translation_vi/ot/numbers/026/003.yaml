  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה וְ/אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן אֹתָ֖/ם בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: vi
  text: 'Môi-se và thầy tế lễ Ê-lê-a-sa nói với họ tại đồng bằng Mô-áp, bên sông Giô-đanh, đối diện Giê-ri-cô,[a] rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bên sông Giô-đanh, gần Giê-ri-cô.”'
    reason: Cụm עַל יַרְדֵּן יְרֵחוֹ có thể diễn tả vị trí gần sông Giô-đanh trong tương quan với Giê-ri-cô mà không xác định rõ là đối diện hay chỉ ở vùng ngang Giê-ri-cô.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nói
  rationale: Động từ này mở đầu lời trực tiếp; “nói” là cách diễn đạt tự nhiên trong tiếng Việt và kết hợp phù hợp với לֵאמֹר ở cuối câu.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: וְאֶלְעָזָר
  choice: và Ê-lê-a-sa
  rationale: Giữ liên từ và dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Giữ chức danh xác định của Ê-lê-a-sa, không thêm ý “thầy tế lễ thượng phẩm” vì nguyên văn không nói như vậy.
- source_word: אֹתָם
  choice: với họ
  rationale: Trong cấu trúc tiếng Việt, “nói với họ” diễn đạt tự nhiên đối tượng tiếp nhận lời nói.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: tại đồng bằng Mô-áp
  rationale: עַרְבוֹת chỉ vùng đất bằng hoặc thảo nguyên; “đồng bằng” vừa dễ hiểu vừa phù hợp với địa danh truyền thống.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: bên sông Giô-đanh, đối diện Giê-ri-cô
  rationale: Cụm từ định vị nơi chốn ở vùng sông Giô-đanh trong tương quan với Giê-ri-cô. “Đối diện Giê-ri-cô” làm rõ quan hệ địa lý thường được hiểu trong công thức này, còn cách hiểu ngắn hơn được giữ ở chú thích.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Đây là công thức dẫn vào nội dung lời nói. “Rằng:” tự nhiên hơn “mà rằng” trong tiếng Việt hiện đại và chuẩn bị cho lời ở câu kế tiếp.
