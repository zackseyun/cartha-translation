  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: vi
  text: 'Xê-rách: gia tộc Xê-rách; Sau-lơ: gia tộc Sau-lơ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: thuộc về Xê-rách
  rationale: Trong công thức kiểm kê này, tiền tố לְ giới thiệu tổ tiên mà gia tộc thuộc về hoặc xuất thân từ đó; “thuộc về” diễn đạt tự nhiên quan hệ gia tộc.
- source_word: מִשְׁפַּחַת
  choice: gia tộc
  rationale: Trong bối cảnh bộ tộc và kiểm kê dân số, מִשְׁפָּחָה chỉ một nhóm thân tộc nằm trong chi tộc; “gia tộc” chính xác hơn “gia đình”.
- source_word: הַזַּרְחִי
  choice: Xê-rách
  rationale: Dạng chỉ hậu duệ được diễn đạt trong tiếng Việt bằng tên tổ tiên sau danh từ “gia tộc”, tránh tạo một danh xưng dân tộc gượng ép.
- source_word: לְ/שָׁאוּל
  choice: thuộc về Sau-lơ
  rationale: Tiền tố לְ tiếp tục đánh dấu quan hệ gia tộc trong công thức liệt kê; cách dịch được giữ song song với vế trước.
- source_word: הַשָּׁאוּלִי
  choice: Sau-lơ
  rationale: Dạng chỉ hậu duệ được chuyển thành tên tổ tiên bổ nghĩa cho “gia tộc”, phù hợp lối diễn đạt tiếng Việt và giữ cấu trúc song song.
