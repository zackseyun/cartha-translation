revisions:
- from: 'Các con trai của Y-sa-ca, theo từng thị tộc: từ Thô-la có thị tộc Thô-la; từ Phu-va[a] có thị tộc Phu-ni.'
  to: 'Các con trai của Y-sa-ca, theo các thị tộc của họ: Thô-la: thị tộc Thô-la; Phu-va[a]: thị tộc Phu-ni.'
  rationale: 'Bản sửa giữ nguyên nghĩa, thuật ngữ, tên riêng và chú thích của bản thảo, nhưng đưa câu về dạng liệt kê trực tiếp tương ứng với nguyên văn: tổ phụ được nêu trước, rồi đến thị tộc mang tên phái sinh. “Theo các thị tộc của họ” diễn đạt tự nhiên và rõ hơn quan hệ của cụm này với “các con trai của Y-sa-ca”.'
  reviewer_model: gpt-5.6-terra
