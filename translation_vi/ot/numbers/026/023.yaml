base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: vi
  text: 'Các con trai của Y-sa-ca, theo các thị tộc của họ: Thô-la: thị tộc Thô-la; Phu-va[a]: thị tộc Phu-ni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong một số phân đoạn liên hệ và một số bản dịch, tên Phu-va được viết là “Phu-a”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: Các con trai của Y-sa-ca
  rationale: Giữ cấu trúc gia phả của nguyên văn. Trong ngữ cảnh kiểm tra dân số, cụm này cũng bao hàm các dòng dõi phát xuất từ những người con trai ấy.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc
  rationale: מִשְׁפָּחָה ở đây chỉ đơn vị dòng họ nằm trong bộ tộc Y-sa-ca; “thị tộc” diễn đạt rõ cấp tổ chức này, còn “từng” làm tự nhiên sắc thái phân loại của giới từ לְ.
- source_word: תּוֹלָע
  choice: Thô-la
  rationale: Đây là tên riêng, được phiên âm thay vì dịch theo nghĩa danh từ thông thường.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: thị tộc Thô-la
  rationale: Dạng chỉ người thuộc dòng Thô-la được diễn đạt bằng tên thị tộc tự nhiên trong tiếng Việt.
- source_word: לְפֻוָה
  choice: từ Phu-va
  rationale: Giới từ לְ mở đầu mục phân loại theo tổ phụ; “từ” làm rõ thị tộc phát xuất từ Phu-va. Cách phiên âm dựa trên dạng פֻוָה của câu này.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: thị tộc Phu-ni
  rationale: Giữ riêng dạng tên thị tộc (gentilic) Phu-ni, phân biệt với tên tổ phụ Phu-va.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, gọn và có nhịp liệt kê phù hợp với bản kiểm tra dân số. Dùng “thị tộc” thay cho “gia đình” để tránh khiến người đọc hiểu đây chỉ là hộ gia đình. Dấu chú thích được đặt sau “Phu-va”, là tên mà chú thích trực tiếp giải thích.
