base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: vi
  text: 'Đây là các con trai của Ga-la-át: từ Giê-xe[a] có gia tộc Giê-xe; từ Hê-léc có gia tộc Hê-léc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ “các con trai của Ga-la-át” có thể chỉ các hậu duệ nam theo dòng tộc hoặc những gia tộc hợp thành, chứ không chỉ các con trai trực tiếp.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ định Hê-bơ-rơ không mang thì; cách mở đầu này tự nhiên trong danh sách kiểm tra dân số.
- source_word: בְּנֵי גִלְעָד
  choice: các con trai của Ghi-lê-át
  rationale: Giữ hình thức gia phả của nguyên văn; trong ngữ cảnh này, cụm từ có thể chỉ các hậu duệ nam theo dòng tộc chứ không nhất thiết chỉ các con trực tiếp.
- source_word: אִיעֶזֶר
  choice: I-ê-xe
  rationale: Phiên âm tên riêng theo cách đọc gần với dạng Hê-bơ-rơ trong câu và phù hợp lối viết tên Kinh Thánh bằng tiếng Việt.
- source_word: מִשְׁפַּחַת
  choice: gia tộc
  rationale: Trong cuộc kiểm tra dân số ở Dân Số Ký 26, từ này chỉ một đơn vị dòng họ thuộc bộ tộc; “gia tộc” rõ và tự nhiên hơn “gia đình”.
- source_word: הָאִיעֶזְרִי
  choice: gia tộc I-ê-xe
  rationale: Dạng tính từ chỉ nhóm hậu duệ của I-ê-xe; tiếng Việt diễn đạt tự nhiên bằng “gia tộc” cộng tên tổ phụ.
- source_word: לְחֵלֶק
  choice: từ Hê-léc
  rationale: Tiền tố לְ trong công thức liệt kê này giới thiệu tổ phụ kế tiếp; “từ” biểu thị gia tộc phát xuất từ người ấy.
- source_word: הַחֶלְקִי
  choice: gia tộc Hê-léc
  rationale: Dạng chỉ nhóm người thuộc dòng Hê-léc được chuyển thành cấu trúc gia tộc tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của “các con trai của Ghi-lê-át”
  choice: Giữ cách nói “các con trai” trong chính văn và giải thích bằng chú thích.
  alternative: Dịch thẳng là “các hậu duệ của Ghi-lê-át”.
  rationale: Cách này bảo tồn hình ảnh gia phả của nguyên văn mà không khiến người đọc phải hiểu họ nhất thiết là con trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “gia tộc” nhất quán cho מִשְׁפַּחַת. Tên riêng được phiên âm theo lối tiếng Việt có gạch nối.
