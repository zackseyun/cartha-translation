base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/051.yaml
  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: vi
  text: Đây là những người được kiểm đếm trong số con trai Y-sơ-ra-ên:[a] sáu trăm lẻ một nghìn bảy trăm ba mươi người.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người Y-sơ-ra-ên được kiểm đếm”. Nguyên văn là “các con trai Y-sơ-ra-ên”.
    reason: lexical_alternative
  - marker: b
    text: Tức 601.730 người.
    reason: numeric_clarification
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ thị số nhiều mở đầu phần tổng kết; tiếng Việt dùng tự nhiên cấu trúc “Đây là”.
- source_word: פְּקוּדֵי
  choice: đã được kiểm đếm
  rationale: Từ này bắt nguồn từ פקד và trong ngữ cảnh dân số biểu chỉ những người đã được đăng ký, kiểm đếm; cách dịch giữ trọng tâm trên con người thay vì chỉ nêu một tổng số trừu tượng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: những người con trai Y-sơ-ra-ên
  rationale: Giữ hình ảnh thân tộc và giới tính ngữ pháp của nguyên văn “các con trai của Y-sơ-ra-ên”; trong ngữ cảnh đây là những nam giới thuộc dân Y-sơ-ra-ên được kiểm đếm.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: sáu trăm lẻ một nghìn bảy trăm ba mươi
  rationale: Chuyển chính xác cấu trúc cộng của số Hê-bơ-rơ thành cách đọc số tự nhiên trong tiếng Việt, tức 601.730.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: những người con trai Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; con cái Y-sơ-ra-ên
  rationale: Nguyên văn nói “các con trai của Y-sơ-ra-ên”. Bản dịch giữ cách gọi thân tộc và sự quy chiếu đến nam giới trong cuộc kiểm kê này, thay vì chuyển thành một danh xưng dân tộc không phân biệt giới.
- issue: Ý nghĩa của פְּקוּדֵי trong bối cảnh kiểm kê
  choice: đã được kiểm đếm
  alternative: những người được đếm; tổng số kiểm kê
  rationale: Danh từ này quy chiếu đến những người được đăng ký trong cuộc kiểm kê. Cách dịch được chọn giữ nghĩa chỉ người, đồng thời tránh biến cụm từ thành một con số tổng cộng thuần túy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm đếm” để thể hiện bối cảnh kiểm kê dân số; viết số bằng chữ trong chính văn theo nguyên bản và cung cấp dạng chữ số ở chú thích.
