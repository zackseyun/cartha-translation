  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thị tộc” cho đơn vị thân tộc trong bộ tộc, “con cháu” cho thành ngữ phả hệ, và “kiểm kê” để giữ bối cảnh điều tra dân số.
