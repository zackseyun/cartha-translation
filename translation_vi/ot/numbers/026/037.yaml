base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: vi
  text: 'Đây là các thị tộc của con cháu Ép-ra-im, tính theo số người được kiểm kê: ba mươi hai nghìn năm trăm người[a]. Đây là con cháu Giô-sép, theo các thị tộc của họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “theo danh sách đăng ký của họ”, “theo số đã được kiểm kê” hoặc, tự nhiên hơn, “theo số người đã được đếm”. Tiếng Hê-bơ-rơ ở đây dùng cách nói của việc đăng ký kiểm kê dân số.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh kiểm kê dân số và phân chia bộ tộc, từ này chỉ những đơn vị thân tộc nằm trong một bộ tộc; “thị tộc” chính xác hơn “gia đình” trong tiếng Việt hiện đại.
- source_word: בְּנֵי אֶפְרַיִם
  choice: con cháu Ép-ra-im
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “các con trai của Ép-ra-im”, nhưng trong danh sách kiểm kê này chỉ các hậu duệ của ông; “con cháu” truyền đạt tự nhiên ý nghĩa phả hệ.
- source_word: לִפְקֻדֵיהֶם
  choice: tính theo số người được kiểm kê
  rationale: Cụm từ thuộc ngôn ngữ kiểm kê dân số, nói đến những người đã được ghi nhận và đếm; cách dịch này vừa rõ nghĩa vừa giữ sắc thái hành chính của nguyên văn.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: ba mươi hai nghìn năm trăm người
  rationale: Chuyển chính xác tổng số sang trật tự số đếm tự nhiên trong tiếng Việt; thêm “người” để làm rõ đơn vị được kiểm kê.
- source_word: בְנֵי יוֹסֵף
  choice: con cháu Giô-sép
  rationale: Giữ sự tương ứng với cách dịch בְּנֵי אֶפְרַיִם và diễn đạt đúng ý nghĩa hậu duệ trong bản kê khai bộ tộc.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo các thị tộc của họ
  rationale: Giữ công thức tổng kết của nguyên văn và nhất quán với cách dịch מִשְׁפְּחֹת ở đầu câu.
theological_decisions: []
