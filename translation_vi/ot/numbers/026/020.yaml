  text: וַ/יִּהְי֣וּ בְנֵי יְהוּדָה֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שֵׁלָ֗ה מִשְׁפַּ֨חַת֙ הַ/שֵּׁ֣לָנִ֔י לְ/פֶ֕רֶץ מִשְׁפַּ֖חַת הַ/פַּרְצִ֑י לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: vi
  text: 'Con cháu Giu-đa[a], phân theo các thị tộc, gồm có: từ Sê-la, thị tộc Sê-la; từ Phê-rết, thị tộc Phê-rết; từ Xê-rách, thị tộc Xê-rách.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Giu-đa”; trong bối cảnh kiểm kê này, cụm từ chỉ con cháu thuộc dòng nam của Giu-đa, được phân thành các thị tộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: gồm có
  rationale: Trong công thức kiểm kê này, động từ היה mở đầu danh sách các thị tộc. “Gồm có” diễn đạt tự nhiên chức năng liệt kê trong tiếng Việt mà không hàm ý một quá trình biến đổi.
- source_word: בְנֵי יְהוּדָה
  choice: Con cháu Giu-đa[a]
  rationale: בְנֵי theo nghĩa đen là “các con trai”, nhưng trong ngữ cảnh kiểm kê và phân chia thị tộc, cụm này chỉ những người thuộc dòng nam của Giu-đa. “Con cháu” rõ nghĩa hơn trong tiếng Việt; chú thích giữ lại nghĩa đen và sắc thái phụ hệ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: phân theo các thị tộc
  rationale: מִשְׁפָּחָה tại Dân Số Ký 26 là đơn vị dòng họ nằm dưới cấp bộ tộc. “Thị tộc” chính xác hơn “gia đình”, còn “phân theo” thể hiện chức năng phân loại của לְ.
- source_word: לְשֵׁלָה ... לְפֶרֶץ ... לְזֶרַח
  choice: từ Sê-la ... từ Phê-rết ... từ Xê-rách
  rationale: Giới từ לְ lặp lại trước tên mỗi tổ phụ để giới thiệu dòng xuất thân của thị tộc. “Từ” ngắn gọn, tự nhiên và bảo toàn quan hệ phả hệ.
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי ... מִשְׁפַּחַת הַפַּרְצִי ... מִשְׁפַּחַת הַזַּרְחִי
  choice: thị tộc Sê-la ... thị tộc Phê-rết ... thị tộc Xê-rách
  rationale: Tiếng Hê-bơ-rơ dùng các tính từ chỉ người thuộc dòng Sê-la, Phê-rết và Xê-rách. Tiếng Việt gọi tự nhiên bằng “thị tộc” cộng tên tổ phụ; cách này cũng duy trì nhịp điệp song song của bản văn.
theological_decisions: []
translation_notes:
  register: 'Văn phong trang trọng, sáng rõ và phù hợp một danh sách kiểm kê. Dùng các dạng tên quen thuộc trong tiếng Việt: Giu-đa, Sê-la, Phê-rết và Xê-rách. Giữ cấu trúc lặp của nguyên văn nhưng tránh tạo các danh xưng dân tộc phái sinh thiếu tự nhiên trong tiếng Việt.'
