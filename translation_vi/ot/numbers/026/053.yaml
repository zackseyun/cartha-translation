  terminology: “Phần thừa kế” là lựa chọn phù hợp cho נַחֲלָה và không áp đặt diễn giải thần học. Chú thích “theo số người” nêu đúng lựa chọn nghĩa theo ngữ cảnh, đồng thời bảo tồn cách nói đen “theo số tên” của bản gốc.
