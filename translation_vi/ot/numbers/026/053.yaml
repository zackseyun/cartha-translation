  text: לָ/אֵ֗לֶּה תֵּחָלֵ֥ק הָ/אָ֛רֶץ בְּ/נַחֲלָ֖ה בְּ/מִסְפַּ֥ר שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: vi
  text: Đất sẽ được chia cho những người này làm phần thừa kế, theo số tên[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “theo số người”; nguyên văn là “theo số tên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: cho những người này
  rationale: Giới từ לְ với đại từ chỉ định số nhiều xác định những người nhận phần đất; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ đối tượng quy chiếu.
- source_word: תֵּחָלֵק
  choice: sẽ được chia
  rationale: Thể Nifal chưa hoàn thành của חלק mang nghĩa bị động, chỉ việc đất được phân chia; cách dịch này rõ ràng và phù hợp với mệnh lệnh trong ngữ cảnh.
- source_word: הָאָרֶץ
  choice: Đất
  rationale: Trong ngữ cảnh phân chia lãnh thổ cho Israel, הָאָרֶץ chỉ miền đất đang được nói đến; tiếng Việt có thể dùng “Đất” ở đầu câu mà không cần mạo từ.
- source_word: בְּנַחֲלָה
  choice: làm phần thừa kế
  rationale: נַחֲלָה chỉ tài sản hoặc phần đất được truyền nhận hay cấp làm cơ nghiệp; “phần thừa kế” giữ được sắc thái pháp lý và giao ước, còn “làm” diễn đạt chức năng của phần đất.
- source_word: בְּמִסְפַּר
  choice: theo số
  rationale: Giới từ בְּ ở đây biểu thị tiêu chuẩn phân chia; “theo số” chuyển tải sát nghĩa và gọn tự nhiên.
- source_word: שֵׁמוֹת
  choice: tên
  rationale: Bản Hê-bơ-rơ nói theo nghĩa đen là “tên”; giữ từ này bảo tồn cách diễn đạt của nguồn, trong khi chú thích giải thích nghĩa hoán dụ là số người.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc bị động cùng hình ảnh “tên” của nguyên ngữ, đồng thời dùng chú thích để làm rõ nghĩa trong bối cảnh kiểm kê dân số.
