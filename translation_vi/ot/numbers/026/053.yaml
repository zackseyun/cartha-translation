  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: đối tượng nhận phần (לָאֵלֶּה), đất được phân chia ở thể bị động, tính chất là phần thừa kế, và tiêu chuẩn phân chia theo “số tên”. “Cho những người này” diễn giải quy chiếu nhân sự vốn đã rõ từ ngữ cảnh kiểm kê mà không làm thay đổi nghĩa.'
