source:
  edition: WLC
  text: אֵ֚לֶּה פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן אֲשֶׁ֨ר פָּֽקְד֜וּ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: vi
  text: Đây là những người được Môi-se và thầy tế lễ Ê-lê-a-sa kiểm đếm; hai ông đã kiểm đếm các con trai của Y-sơ-ra-ên[a] tại đồng bằng Mô-áp, bên sông Giô-đanh, đối diện Giê-ri-cô.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; cũng có thể dịch là “dân Y-sơ-ra-ên” hoặc “con cháu Y-sơ-ra-ên”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bên sông Giô-đanh, gần Giê-ri-cô”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: những người đã được ... kiểm đếm
  rationale: Dạng liên kết của פקד trong bối cảnh điều tra dân số chỉ những người được ghi nhận qua việc kiểm đếm; cách dịch này giữ đối tượng là con người và phù hợp văn cảnh.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Nguyên văn chỉ nói “thầy tế lễ”, không dùng tước hiệu “thầy tế lễ thượng phẩm”; bản dịch không thêm chức danh ngoài văn bản.
- source_word: פָּקְדוּ
  choice: kiểm đếm
  rationale: Giữ sự lặp lại của cùng gốc פקד và làm rõ đây là cuộc kiểm đếm dân số, không phải chỉ đếm sơ lược.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, vừa bảo lưu ý niệm con cháu/dân thuộc về Y-sơ-ra-ên vừa không khiến độc giả hiểu rằng cuộc kiểm đếm chỉ bao gồm các con trai.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: tại đồng bằng Mô-áp
  rationale: עַרְבוֹת trong địa danh này chỉ vùng đồng bằng hoặc thảo nguyên; “đồng bằng Mô-áp” rõ ràng và quen thuộc trong tiếng Việt.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: bên sông Giô-đanh, đối diện Giê-ri-cô
  rationale: Cụm từ định vị nơi ấy ở bên sông Giô-đanh, trong tương quan địa lý với Giê-ri-cô; “đối diện” diễn đạt hợp lý vị trí phía bên kia sông nhưng vẫn được ghi chú vì cấu trúc Hê-bơ-rơ có thể hiểu khái quát hơn.
theological_decisions:
- issue: Cách diễn đạt בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên; con cháu Y-sơ-ra-ên
  rationale: Ngữ cảnh cuộc kiểm đếm có khuôn khổ phả hệ và nam giới, nhưng cụm từ cũng là tên gọi tập thể của dân Y-sơ-ra-ên. “Con dân” giữ sắc thái thuộc về và dòng dõi mà không thu hẹp quá mức theo giới tính; chú thích bảo lưu nghĩa đen.
- issue: Chức danh của Ê-lê-a-sa
  choice: thầy tế lễ
  alternative: thầy tế lễ thượng phẩm
  rationale: Bản Hê-bơ-rơ dùng הַכֹּהֵן, nghĩa là “thầy tế lễ”. Không đưa chức vụ được suy ra từ bối cảnh vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm đếm” để thể hiện bối cảnh điều tra dân số và giữ sự lặp từ của nguyên văn; giữ các tên riêng theo dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
