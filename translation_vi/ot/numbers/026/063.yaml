  naturalness: Câu văn trang trọng, rõ nghĩa và tự nhiên. “Hai ông” giúp làm rõ chủ ngữ của mệnh đề quan hệ trong tiếng Việt. “Kiểm đếm” phù hợp văn cảnh thống kê dân số và giữ được sự lặp từ của tiếng Hê-bơ-rơ.
