  yaml_path: translation/ot/numbers/026/041.yaml
  text: These were the sons of Benjamin by their clans, and those numbered from them were forty-five thousand six hundred.
translation:
  language: vi
  text: Đó là các con cháu của Bên-gia-min, theo từng gia tộc của họ; số người được kiểm kê trong các gia tộc ấy là bốn mươi lăm nghìn sáu trăm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי בִנְיָמִן
  choice: các con cháu của Bên-gia-min
  rationale: Trong văn cảnh kiểm kê các chi tộc, בְנֵי chỉ toàn thể hậu duệ nam thuộc chi tộc chứ không chỉ các con trai trực tiếp.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng gia tộc của họ
  rationale: Diễn đạt tự nhiên ý phân loại theo các nhóm thân tộc trong cuộc kiểm kê.
- source_word: וּפְקֻדֵיהֶם
  choice: số người được kiểm kê trong các gia tộc ấy
  rationale: Danh từ bị động פְקֻדִים chỉ những người đã được đếm/kiểm kê; cách diễn đạt này giữ liên hệ với các gia tộc vừa nêu và tránh lối nói gượng 'những người được kiểm kê từ họ'.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: bốn mươi lăm nghìn sáu trăm
  rationale: Chuyển đúng tổng số 45.600 sang cách đọc số tự nhiên trong tiếng Việt.
