base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: vi
  text: 'Con cháu Ma-na-se: từ Ma-ki có thị tộc Ma-ki; Ma-ki sinh Ga-la-át; từ Ga-la-át có thị tộc Ga-la-át.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Con cháu của Ma-na-se
  rationale: Trong văn cảnh kiểm kê bộ tộc, בְּנֵי không chỉ nói đến các con trai trực tiếp mà bao gồm dòng dõi; “con cháu” truyền đạt đúng phạm vi và tự nhiên trong tiếng Việt.
- source_word: לְמָכִיר
  choice: từ Ma-ki
  rationale: Tiền tố לְ trong công thức kiểm kê này giới thiệu nhánh dòng dõi phát xuất từ người được nêu tên; “từ” làm rõ quan hệ ấy mà vẫn giữ cấu trúc ngắn gọn.
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: thị tộc Ma-ki
  rationale: מִשְׁפָּחָה tại đây là đơn vị họ hàng thuộc một bộ tộc, nên “thị tộc” chính xác hơn “gia đình”; danh xưng theo tổ phụ được diễn đạt tự nhiên là “thị tộc Ma-ki”.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: Ma-ki sinh Ga-la-át
  rationale: הוֹלִיד là động từ phả hệ chỉ việc sinh ra/làm cha của; “sinh” là cách nói tiếng Việt gọn, rõ và trang trọng.
- source_word: לְגִלְעָד
  choice: từ Ga-la-át
  rationale: Cùng công thức với לְמָכִיר, tiền tố לְ giới thiệu nhánh hậu duệ gắn với Ga-la-át; “từ” duy trì sự song song.
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: thị tộc Ga-la-át
  rationale: “Thị tộc” phản ánh cấp phân nhóm trong cuộc kiểm kê, còn tên tổ phụ được giữ làm tên gọi của thị tộc theo lối diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng, phù hợp với danh sách kiểm kê phả hệ. Dùng “con cháu” để tránh khiến người đọc hiểu đây chỉ là các con trai trực tiếp; dùng “thị tộc” nhất quán cho מִשְׁפָּחָה. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
