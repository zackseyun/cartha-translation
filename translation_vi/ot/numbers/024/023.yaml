  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: vi
  text: 'Rồi ông cất lời sấm và nói: “Ôi, ai có thể sống sót khi Đức Chúa Trời làm điều ấy?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ của vế cuối rất khó hiểu; cũng có thể dịch: “Ai có thể sống sót khi Đức Chúa Trời thiết lập điều ấy?”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Rồi ông cất lời sấm
  rationale: Cụm נָשָׂא + מָשָׁל là thành ngữ chỉ việc cất lên hay tuyên đọc một lời nói mang tính thi ca. Trong chuỗi lời tuyên bố của Ba-la-am, “cất lời sấm” vừa tự nhiên vừa giữ được sắc thái tiên tri; מָשָׁל cũng có thể là châm ngôn, dụ ngôn hoặc lời ví.
- source_word: אֹוי
  choice: Ôi!
  rationale: Thán từ diễn tả sự kinh hãi hoặc than tiếc. “Ôi!” trang trọng, tự nhiên và không mặc nhiên biến câu này thành một công thức tuyên án.
- source_word: מִי יִחְיֶה
  choice: Ai có thể sống sót
  rationale: Nghĩa sát là “ai sẽ sống”, nhưng trong bối cảnh biến động đáng sợ, động từ חיה mang ý sống còn; thêm “có thể” diễn đạt lực tu từ của câu hỏi.
- source_word: מִשֻּׂמוֹ אֵל
  choice: khi Đức Chúa Trời làm điều ấy
  rationale: Cụm Hê-bơ-rơ cô đọng và khó hiểu. Bản dịch lấy אֵל làm chủ thể và hiểu מִן theo nghĩa thời gian, còn שׂום theo nghĩa rộng là đặt, thiết lập hay thực hiện. “Làm điều ấy” không xác định quá mức điều mà nguyên văn chỉ nêu mơ hồ.
theological_decisions:
- issue: Cách hiểu cụm khó מִשֻּׂמוֹ אֵל
  choice: 'Đức Chúa Trời là chủ thể: “khi Đức Chúa Trời làm điều ấy”'
  alternative: “khi Đức Chúa Trời thiết lập điều ấy”; cũng có thể phân tích đại từ tiếp vĩ và vai trò của אֵל theo cách khác
  rationale: Cú pháp nguyên văn không minh bạch. Cách chọn này phù hợp với ngữ cảnh về biến cố sắp xảy đến và giữ tác nhân thần linh, nhưng chú thích bảo lưu cách dịch sát hơn theo động từ “đặt/thiết lập”, không biến một cách hiểu còn tranh luận thành điều chắc chắn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Ông” nối tiếp nhân vật Ba-la-am từ văn cảnh; “lời sấm” phù hợp thể loại các lời tuyên bố thi ca ở đây. Dấu chú thích [a] đặt ngay sau toàn câu có liên quan.
