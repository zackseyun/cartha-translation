  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל בָּלָ֑ק הֲ/לֹ֗א גַּ֧ם אֶל מַלְאָכֶ֛י/ךָ אֲשֶׁר שָׁלַ֥חְתָּ אֵלַ֖/י דִּבַּ֥רְתִּי לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: vi
  text: 'Ba-la-am nói với Ba-lác: “Tôi chẳng đã cũng nói với các sứ giả[a] của ông, là những người ông đã sai đến với tôi, rằng:[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các phái viên.” Từ Hê-bơ-rơ này có thể chỉ người đưa tin hoặc, trong những ngữ cảnh khác, thiên sứ; ở đây ngữ cảnh đòi hỏi nghĩa chỉ người.
    reason: lexical_alternative
  - marker: b
    text: Lời được dẫn sau từ “rằng” tiếp tục sang câu kế tiếp.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ trần thuật thông dụng, tự nhiên trong tiếng Việt khi dẫn lời trực tiếp.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: אֶל בָּלָק
  choice: với Ba-lác
  rationale: אֶל đánh dấu người được nói với; cấu trúc “nói với” tự nhiên trong tiếng Việt.
- source_word: הֲלֹא
  choice: Chẳng phải ... sao
  rationale: Câu hỏi phủ định hàm ý chờ đợi câu trả lời khẳng định; cách diễn đạt này giữ được sắc thái ấy. Từ “sao” được lược ở cuối vì câu còn dẫn sang nội dung trích dẫn ở câu kế tiếp, nhưng cấu trúc “Chẳng phải” vẫn truyền đạt lực tu từ.
- source_word: גַּם
  choice: cũng
  rationale: Giữ ý bổ sung/nhấn mạnh rằng Ba-la-am đã nói điều này cả với các sứ giả của Ba-lác.
- source_word: מַלְאָכֶיךָ
  choice: các sứ giả của vua
  rationale: Trong ngữ cảnh ngoại giao giữa người với người, מַלְאָךְ chỉ người đưa tin hoặc phái viên, không phải thiên sứ. Đại từ sở hữu được diễn đạt theo lối xưng hô với vua trong tiếng Việt.
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: mà vua sai đến gặp tôi
  rationale: Diễn đạt tự nhiên mệnh đề quan hệ và hướng chuyển động đến Ba-la-am; “gặp tôi” rõ nghĩa hơn “đến tôi” trong tiếng Việt.
- source_word: דִּבַּרְתִּי
  choice: tôi ... đã nói
  rationale: Dạng hoàn thành mang nghĩa hồi tưởng về lời Ba-la-am đã nói trước đó.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dẫn vào nội dung lời nói tiếp tục ở câu sau; “rằng” tự nhiên hơn việc giữ nguyên công thức “nói rằng” một cách nặng nề.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” để xưng hô với Ba-lác và “tôi” cho Ba-la-am, phù hợp quan hệ giao tiếp trong bối cảnh quân vương mà không làm câu quá cổ kính. Dấu hai chấm cho thấy nội dung lời trích dẫn nằm ở câu tiếp theo.
