revisions:
- from: 'Ba-la-am nói với Ba-lác: “Chẳng phải tôi cũng đã nói với các sứ giả[a] mà vua sai đến gặp tôi rằng:[b]'
  to: 'Ba-la-am nói với Ba-lác: “Tôi chẳng đã cũng nói với các sứ giả[a] của ông, là những người ông đã sai đến với tôi, rằng:[b]”'
  rationale: Sửa đại từ xưng hô để bám sát ngôi thứ hai trong nguyên văn và tự nhiên hơn trong lời trực tiếp; thay “đến gặp tôi” bằng “đến với tôi” để tránh thêm sắc thái không cần thiết. Các yếu tố còn lại, kể cả dấu hai chấm và chú thích nối sang câu kế, được giữ.
