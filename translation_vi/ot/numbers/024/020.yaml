base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: vi
  text: 'Rồi ông thấy A-ma-léc, liền cất lời sấm truyền[a] rằng:


    “A-ma-léc là đầu các dân[b],


    nhưng kết cục của nó là diệt vong hoàn toàn[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cất lời ví”, “đọc lời châm ngôn” hoặc “tuyên lời sấm”; từ Hê-bơ-rơ có thể chỉ một lời nói thi ca, châm ngôn, lời chế nhạo hoặc lời sấm.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “có trước hết trong các dân” hoặc “đứng đầu trong các dân”; cụm từ Hê-bơ-rơ có thể nói đến thứ tự thời gian hoặc địa vị hàng đầu.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “kết cục của nó là tiêu vong” hoặc “hậu vận của nó là sự hủy diệt”; nguyên văn Hê-bơ-rơ rất cô đọng và nhấn mạnh sự tiêu vong triệt để.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: Rồi ông thấy A-ma-léc
  rationale: Động từ ראה mang nghĩa thông thường là “thấy”; waw liên tiếp thúc đẩy trình tự tường thuật, được diễn đạt tự nhiên bằng “rồi”.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: liền cất lời sấm truyền
  rationale: Thành ngữ “cất lời” phản ánh nghĩa đen “nâng/cất lời nói của mình”; מָשָׁל ở đây là một phát ngôn thi ca mang tính tiên tri, nhưng có phạm vi nghĩa rộng gồm châm ngôn, lời ví, lời chế nhạo hoặc lời sấm, nên có chú thích bảo tồn các khả năng.
- source_word: רֵאשִׁית גּוֹיִם
  choice: đứng đầu trong các dân
  rationale: רֵאשִׁית có thể chỉ sự đầu tiên về thời gian hoặc địa vị hàng đầu. “Đứng đầu” là cách nói tự nhiên, còn chú thích nêu rõ khả năng “có trước hết” để không xóa bỏ sự mơ hồ của tiếng Hê-bơ-rơ.
- source_word: עֲמָלֵק
  choice: A-ma-léc
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt; trong ngữ cảnh, tên này chỉ dân A-ma-léc như một tập thể.
- source_word: וְאַחֲרִיתוֹ
  choice: nhưng kết cục của nó
  rationale: אַחֲרִיתוֹ chỉ phần cuối, hậu vận hoặc kết cục. “Nhưng” thể hiện sự tương phản rõ giữa địa vị ban đầu và số phận sau cùng; đại từ “nó” quy chiếu đến dân A-ma-léc.
- source_word: עֲדֵי אֹבֵד
  choice: là diệt vong hoàn toàn
  rationale: Cụm Hê-bơ-rơ cô đọng diễn tả đích điểm là sự tiêu vong. “Hoàn toàn” truyền đạt tính triệt để mà không thêm ý “đời đời”, vốn không được nói minh nhiên.
theological_decisions:
- issue: Ý nghĩa địa vị của A-ma-léc trong רֵאשִׁית גּוֹיִם
  choice: Giữ mở khả năng A-ma-léc đứng đầu về địa vị hoặc có trước về thời gian.
  alternative: Dịch dứt khoát là “dân có trước hết” hoặc “dân hàng đầu”.
  rationale: רֵאשִׁית có thể biểu thị sự khởi đầu hay vị trí đứng đầu; câu không xác định rõ phương diện nào, nên bản dịch chính cùng chú thích không áp đặt một kết luận lịch sử hoặc thần học.
- issue: Mức độ cuối cùng trong עֲדֵי אֹבֵד
  choice: diệt vong hoàn toàn
  alternative: diệt vong đời đời
  rationale: Cụm từ nhấn mạnh sự hủy diệt triệt để, nhưng không minh nhiên dùng thuật ngữ chỉ “đời đời”; vì vậy tránh đưa thêm một xác định thời gian không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bố cục thơ được giữ bằng cách xuống dòng cho lời sấm. “Cất lời sấm truyền” phù hợp ngữ cảnh Ba-la-am nhưng các nghĩa thể loại khác của מָשָׁל được bảo tồn trong chú thích. Các dấu chú thích [a], [b], [c] đều xuất hiện ngay tại vị trí liên quan trong chính văn.
