language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: vi
  text: 'lời tuyên phán của người nghe những lời của Đức Chúa Trời[a],

    người biết tri thức của Đấng Tối Cao,

    người thấy khải tượng của Đấng Toàn Năng,

    ngã xuống[b] mà mắt vẫn mở:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lời phán của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ngã xuống, với đôi mắt không bị che phủ”; một số người cho rằng câu này mô tả trạng thái xuất thần khi nhận khải tượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: lời tuyên phán của
  rationale: Diễn tả lời phát ngôn tiên tri trang trọng, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với cách phiên âm hoặc dùng từ quá cổ.
- source_word: שֹׁמֵעַ
  choice: người nghe
  rationale: Phân từ Qal được dùng như danh từ, mô tả đặc điểm liên tục của người nói.
- source_word: אִמְרֵי אֵל
  choice: những lời Đức Chúa Trời
  rationale: Giữ ý về những lời được Đức Chúa Trời phán; cách diễn đạt rõ ràng, trang trọng và tự nhiên.
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: người biết tri thức của Đấng Tối Cao
  rationale: 'Giữ cấu trúc cô đọng và sự mơ hồ của cụm sở hữu trong tiếng Hê-bơ-rơ: có thể là tri thức thuộc về, liên quan đến hoặc được ban bởi Đấng Tối Cao.'
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: người thấy khải tượng của Đấng Toàn Năng
  rationale: ‘Khải tượng’ diễn đạt thị kiến mang tính mặc khải; mệnh đề quan hệ duy trì thế song song với các dòng trước.
- source_word: נֹפֵל
  choice: ngã xuống
  rationale: Dịch sát nghĩa cơ bản của phân từ, không đưa cách hiểu mang tính diễn giải là trạng thái xuất thần vào chính văn.
- source_word: וּגְלוּי עֵינָיִם
  choice: mà mắt vẫn mở
  rationale: Diễn đạt tự nhiên hình ảnh ‘mắt không bị che phủ’; từ ‘mà… vẫn’ làm rõ sắc thái tương phản với việc ngã xuống mà không áp đặt cách giải thích về trạng thái khải tượng.
theological_decisions:
- issue: Cách dịch các danh hiệu אֵל, עֶלְיוֹן và שַׁדַּי
  choice: Đức Chúa Trời / Đấng Tối Cao / Đấng Toàn Năng
  alternative: Ên / Ê-li-ôn / Sa-đai (phiên âm các danh hiệu)
  rationale: Trong ngữ cảnh này, đây là các danh hiệu thần linh; dịch nghĩa giúp độc giả tiếng Việt nhận ra nội dung của từng danh hiệu mà không biến chúng thành tên riêng.
- issue: Ý nghĩa của דַּעַת עֶלְיוֹן
  choice: tri thức của Đấng Tối Cao
  alternative: tri thức đến từ Đấng Tối Cao; sự hiểu biết về Đấng Tối Cao
  rationale: Cách dịch chính giữ nguyên quan hệ sở hữu rộng và không quyết định liệu đó là tri thức thuộc về Ngài, do Ngài ban hay tri thức về Ngài.
- issue: Trạng thái được mô tả bởi נֹפֵל
  choice: ngã xuống
  alternative: ở trong trạng thái xuất thần
  rationale: Nguyên văn trực tiếp nói đến việc ngã; cách hiểu về trạng thái xuất thần là khả dĩ nhưng mang tính diễn giải, nên được ghi ở chú thích.
translation_notes:
  register: Văn phong thơ tiên tri trang trọng nhưng dùng tiếng Việt hiện đại. Phép lặp “người…” giữ nhịp song song của nguyên văn. Các danh hiệu thần linh được dịch nghĩa; dấu hai chấm cuối câu được giữ vì lời sấm tiếp tục ở câu sau.
