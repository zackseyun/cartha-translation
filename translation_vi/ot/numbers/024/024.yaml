source:
  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: vi
  text: Nhưng tàu thuyền sẽ đến từ phía Kít-tim[a]; chúng sẽ làm khốn khổ A-sua[b] và làm khốn khổ Ê-be[c]. Và chính nó cũng sẽ đi đến chỗ diệt vong[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kít-tim có thể chỉ riêng đảo Síp hoặc chỉ rộng hơn các dân đi biển ở phương tây.
    reason: alternative_reading
  - marker: b
    text: A-sua cũng có thể được dịch là “A-si-ri”.
    reason: lexical_alternative
  - marker: c
    text: Ê-be có thể là tên một dân tộc, chỉ người Hê-bơ-rơ, hoặc chỉ các dân ở “bên kia” một ranh giới như sông Ơ-phơ-rát.
    reason: alternative_reading
  - marker: d
    text: Tiếng Hê-bơ-rơ là đại từ giống đực số ít, “và chính nó/người ấy cũng”; tiền ngữ không rõ. Một số người hiểu đó là một thực thể tập thể, hoặc một người cai trị đại diện cho thế lực đến từ Kít-tim.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: tàu thuyền
  rationale: Danh từ chỉ các phương tiện đi biển và ở đây được dùng theo nghĩa tập hợp. “Tàu thuyền” là cách diễn đạt tự nhiên, không thêm sắc thái quân sự như “chiến thuyền” hay quy mô tổ chức như “hạm đội”.
- source_word: מִיַּד
  choice: từ phía
  rationale: Nghĩa đen là “từ tay của”, nhưng trong cách nói địa lý có thể chỉ phía, bờ hoặc miền gắn với một nơi. “Từ phía” giữ được tính khái quát của thành ngữ Hê-bơ-rơ, không buộc phải hiểu là chính bờ biển.
- source_word: כִּתִּים
  choice: Kít-tim
  rationale: Giữ tên riêng hoặc tên nhóm dân theo âm nguồn, vì phạm vi quy chiếu có thể là đảo Síp hoặc rộng hơn là các dân đi biển phương tây.
- source_word: וְעִנּוּ
  choice: chúng sẽ làm khốn khổ
  rationale: Động từ ענה ở thể piel có thể mang nghĩa gây khổ, hạ nhục hoặc áp bức. “Làm khốn khổ” truyền đạt lực nghĩa rộng mà không xác định quá mức hình thức khuất phục.
- source_word: אַשּׁוּר
  choice: A-sua
  rationale: Phiên âm tên riêng Asshur thay vì giải nghĩa thành “A-si-ri”, nhằm giữ sự mơ hồ giữa tên đất, dân tộc và thực thể chính trị.
- source_word: עֵבֶר
  choice: Ê-be
  rationale: 'Giữ dạng tên riêng vì đối tượng được chỉ đến còn gây tranh luận: có thể là Ê-be, người Hê-bơ-rơ hoặc các dân ở “bên kia” một ranh giới.'
- source_word: וְגַם הוּא
  choice: Cả người ấy cũng
  rationale: Đại từ Hê-bơ-rơ là giống đực số ít. Cách dịch này phản ánh hình thức ngữ pháp mà không tự xác định tiền ngữ đang gây tranh luận.
- source_word: עֲדֵי אֹבֵד
  choice: sẽ đi đến chỗ diệt vong
  rationale: Cụm từ diễn tả hướng đi tới kết cục hủy diệt. Cách dịch giữ sắc thái hướng đích của עֲדֵי mà không thêm ý “đời đời” hay mức độ tuyệt đối không được nói rõ.
theological_decisions:
- issue: Cách xác định Kít-tim, A-sua, Ê-be và đại từ giống đực số ít ở cuối câu
  choice: Giữ các tên Kít-tim, A-sua và Ê-be, đồng thời dịch đại từ cuối câu ở số ít là “người ấy” mà không xác định nhân vật lịch sử.
  alternative: Có thể hiểu Kít-tim là đảo Síp hoặc các thế lực hàng hải phương tây; A-sua là A-si-ri; Ê-be là người Hê-bơ-rơ hoặc các dân bên kia sông Ơ-phơ-rát; “người ấy” có thể chỉ tập thể Kít-tim, người cai trị đại diện cho thế lực ấy, hoặc một quyền lực khác.
  rationale: Lời tiên tri không nói rõ các đồng nhất lịch sử này, và tiền ngữ của đại từ cuối câu không chắc chắn. Bản dịch vì thế giữ nguyên sự mơ hồ và sức căng giải thích của nguyên văn.
translation_notes:
  register: Văn phong tiên tri trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “tàu thuyền”, “làm khốn khổ” và “đi đến chỗ diệt vong” để giữ tính tự nhiên mà không làm mất sắc thái nguồn; các tên đang gây tranh luận được phiên âm thay vì giải nghĩa dứt khoát.
