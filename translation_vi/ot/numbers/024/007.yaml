  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: יִֽזַּל מַ֨יִם֙ מִ/דָּ֣לְיָ֔/ו וְ/זַרְע֖/וֹ בְּ/מַ֣יִם רַבִּ֑ים וְ/יָרֹ֤ם מֵֽ/אֲגַג֙ מַלְכּ֔/וֹ וְ/תִנַּשֵּׂ֖א מַלְכֻתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: vi
  text: Nước sẽ tuôn chảy từ các gàu của người ấy[a], và hạt giống của người ấy[b] sẽ ở giữa nhiều dòng nước; vua của người ấy sẽ cao hơn A-gag, và vương quốc của người ấy[c] sẽ được tôn cao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gàu” là nghĩa thông thường của từ Hê-bơ-rơ; một số người hiểu theo nghĩa ẩn dụ là “cành nhánh”.
    reason: lexical_alternative
  - marker: b
    text: “Hạt giống” cũng có thể hiểu là “dòng dõi” hoặc “con cháu”; từ Hê-bơ-rơ có thể đồng thời gợi hình ảnh hạt giống và sự sinh sôi.
    reason: lexical_and_semantic_alternatives
  - marker: c
    text: “Vương quốc” cũng có thể dịch là “vương quyền” hoặc “sự trị vì”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: sẽ tuôn ra
  rationale: Động từ diễn tả chất lỏng chảy ra. “Tuôn ra” tự nhiên trong hình ảnh nguồn nước dồi dào, nhưng không diễn giải quá mức thành hành động đổ nước có chủ ý.
- source_word: מִדָּלְיוֹ
  choice: từ những gàu của người
  rationale: דְּלִי thông thường là gàu hoặc vật chứa dùng để múc nước. “Gàu” phù hợp bối cảnh cổ và giữ hình ảnh nước của câu thơ.
- source_word: וְזַרְעוֹ
  choice: và dòng giống người
  rationale: זֶרַע có thể chỉ hạt giống hoặc con cháu. Trong tiếng Việt, “dòng giống” giữ được ý hậu duệ và phần nào sự liên tưởng đến sự sinh sôi, dù không tái hiện trọn vẹn nghĩa đen “hạt giống”.
- source_word: בְּמַיִם רַבִּים
  choice: ở giữa nguồn nước dồi dào
  rationale: בְּ có thể chỉ vị trí; מַיִם רַבִּים nói đến lượng nước phong phú. Cách dịch này tự nhiên trong tiếng Việt và truyền đạt cảnh sung túc, trù phú.
- source_word: וְיָרֹם מֵאֲגַג מַלְכּוֹ
  choice: vua của người sẽ cao hơn A-gag
  rationale: רוּם cùng giới từ מִן tạo ý so sánh về địa vị hay sự cao trọng. Giữ “cao hơn” để không đồng nhất động từ này với động từ chỉ sự tôn cao ở vế kế tiếp.
- source_word: וְתִנַּשֵּׂא מַלְכֻתוֹ
  choice: và vương quốc người sẽ được tôn cao
  rationale: Dạng động từ ở đây diễn tả việc được nâng lên hoặc tôn cao; מַלְכוּת có thể là vương quốc, quyền vua hay sự trị vì. “Vương quốc” là cách nói tự nhiên và vẫn giữ phạm vi chính trị-tập thể.
theological_decisions:
- issue: Ý nghĩa của וְזַרְעוֹ
  choice: Dịch là “dòng giống người” và chú thích khả năng hiểu là “hạt giống”.
  alternative: “hạt giống người” hoặc “con cháu người”
  rationale: Nguyên ngữ có thể gợi cả hậu duệ lẫn khả năng sinh sôi trong hình ảnh phì nhiêu. Bản dịch chính cần tự nhiên nhưng chú thích bảo tồn tính đa nghĩa.
- issue: Danh tính của “vua của người” và mối quan hệ với A-gag
  choice: Không xác định vị vua ấy là Sau-lơ, Đa-vít, Đấng Mê-si hay nhân vật cụ thể nào khác.
  alternative: Giải thích trực tiếp là một vua lịch sử hoặc nhân vật Mê-si
  rationale: Bản thân câu này chỉ nói vị vua của dân được đặt cao hơn A-gag; việc xác định cụ thể sẽ vượt quá điều nguyên văn nói rõ.
- issue: Nghĩa của מַלְכֻתוֹ
  choice: “vương quốc người”
  alternative: “vương quyền người” hoặc “triều đại người”
  rationale: Từ Hê-bơ-rơ có thể nói đến vương quốc, quyền làm vua hay sự trị vì. “Vương quốc” phù hợp mạch thơ nhưng không loại bỏ hoàn toàn sắc thái vương quyền, nên ghi nhận trong chú thích.
translation_notes:
  register: Văn phong thơ tiên tri trang trọng nhưng dễ hiểu. Đại từ “người” giữ ngôi số ít giống nguyên văn, quy chiếu về dân được chúc phước trong lời sấm. Tên אֲגַג được phiên âm là “A-gag” theo lối đọc quen thuộc trong tiếng Việt.
