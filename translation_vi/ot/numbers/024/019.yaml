base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: vi
  text: 'Một người từ Gia-cốp sẽ cai trị[a],

    và người ấy sẽ diệt kẻ sống sót khỏi thành[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một người sẽ thống trị”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phần còn sót lại”. Danh từ Hê-bơ-rơ ở số ít có thể mang nghĩa tập thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: một người sẽ cai trị
  rationale: Động từ được hiểu từ רדה, nghĩa là “cai trị/thống trị”. Chủ ngữ không được nói rõ trong mệnh đề này, nên “một người” diễn đạt tự nhiên nhân vật cai trị xuất thân từ Gia-cốp mà không xác định danh tính vượt quá nguyên văn.
- source_word: מִיַּעֲקֹב
  choice: Từ Gia-cốp
  rationale: Giới từ מן chỉ nguồn gốc hoặc nơi xuất thân; “từ Gia-cốp” vừa tự nhiên trong tiếng Việt vừa giữ được nét hàm súc của lời sấm.
- source_word: וְהֶאֱבִיד
  choice: và người ấy sẽ diệt
  rationale: Thể Hiphil của אבד diễn tả việc khiến ai đó bị diệt hoặc phải chết. “Diệt” truyền đạt trực tiếp sức mạnh của động từ và phù hợp văn phong lời sấm.
- source_word: שָׂרִיד
  choice: kẻ sống sót
  rationale: Danh từ số ít chỉ người còn lại hoặc sống sót; cách dịch này giữ hình ảnh cụ thể hơn “phần còn sót lại”, đồng thời vẫn có thể được hiểu theo nghĩa đại diện hoặc tập thể.
- source_word: מֵעִיר
  choice: khỏi thành
  rationale: עִיר có nghĩa thông thường là “thành/thành phố”. Trong kết cấu với động từ “diệt”, “khỏi thành” giữ quan hệ nguồn gốc/phân ly của מן mà không tự ý thêm ý “kiên cố” hay xác định thành nào.
theological_decisions:
- issue: Nhân vật mang tính vương quyền trong lời sấm của Ba-la-am
  choice: 'Dùng ngôn ngữ vương quyền tổng quát: “một người sẽ cai trị”, không gọi nhân vật này là Đấng Mê-si trong chính câu dịch.'
  alternative: Xác định nhân vật là một vị vua lịch sử cụ thể hoặc trực tiếp gọi là Đấng Mê-si.
  rationale: Mạch văn cho thấy một người cai trị xuất thân từ Gia-cốp, nhưng câu này không nêu danh tính. Cách dịch giữ khả năng đọc theo lịch sử, biểu tượng hoặc tiên tri về Đấng Mê-si mà không áp đặt kết luận thần học vào nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng, phù hợp tính chất thi ca của lời sấm. Dùng “thành” thay cho “thành phố” để giữ sắc thái Kinh Thánh tự nhiên; lặp “người ấy” nhằm làm rõ chủ ngữ của vế thứ hai trong tiếng Việt.
