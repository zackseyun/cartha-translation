base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: vi
  text: 'Rồi ông cất lời tuyên sấm rằng:


    “Lời tuyên bố của Ba-la-am, con trai Bê-ô,


    lời tuyên bố của người mà mắt được mở ra[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có mắt nhắm lại” hoặc “có mắt khép kín.” Cụm từ Hê-bơ-rơ này khó hiểu và được giải thích theo nhiều cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Rồi ông cất lời tuyên sấm
  rationale: Cụm נָשָׂא מָשָׁל là thành ngữ mở đầu một lời phát biểu trang trọng, có tính thi ca. “Cất lời tuyên sấm” tự nhiên trong tiếng Việt và truyền đạt tính chất sấm ngôn mà không dịch máy móc là “nâng lời ví dụ của mình”.
- source_word: וַיֹּאמַר
  choice: rằng
  rationale: Kết hợp tự nhiên với “cất lời tuyên sấm” để dẫn trực tiếp nội dung phát ngôn, tránh lặp vụng “và nói” nhưng vẫn bảo toàn chức năng tự sự.
- source_word: נְאֻם
  choice: lời tuyên bố của
  rationale: Danh từ này đánh dấu một phát ngôn trang trọng, có thẩm quyền. Giữ cùng một cách dịch ở cả hai lần xuất hiện; “lời tuyên bố” trang trọng mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Ba-la-am, con trai Bê-ô
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt và diễn đạt quan hệ phụ tử rõ ràng.
- source_word: הַגֶּבֶר
  choice: người
  rationale: Trong ngữ cảnh này, từ chỉ người nam không đòi hỏi phải nhấn mạnh sức mạnh hay giới tính; “người” tự nhiên và trang trọng.
- source_word: שְׁתֻם הָעָיִן
  choice: có mắt được mở ra
  rationale: Cụm Hê-bơ-rơ khó hiểu và còn tranh luận. Ngữ cảnh thị kiến ở câu kế tiếp ủng hộ ý nhận thức mặc khải được mở ra; cách diễn đạt số ít “mắt” cũng giữ sát הָעָיִן. Cách hiểu “mắt nhắm/kín” được giữ trong chú thích.
theological_decisions:
- issue: Ý nghĩa lời Ba-la-am tự mô tả שְׁתֻם הָעָיִן
  choice: có mắt được mở ra
  alternative: có mắt nhắm lại / có mắt khép kín
  rationale: Ngữ cảnh gần nói về người thấy khải tượng và có mắt được vén mở, nên cách hiểu về khả năng thấy mặc khải phù hợp hơn. Tuy vậy, hình thái và từ nguyên của cụm từ vẫn gây tranh luận; chú thích bảo tồn sự mơ hồ thật sự thay vì coi một cách hiểu là chắc chắn tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp thơ. “Tuyên sấm” nêu rõ thể loại phát ngôn, còn hai lần “lời tuyên bố” giữ phép song hành của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ đang được giải thích.
