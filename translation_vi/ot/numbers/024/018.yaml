id: NUM.24.18
reference: Numbers 24:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: vi
  text: Ê-đôm sẽ trở thành lãnh thổ bị chiếm hữu; Sê-i-rơ cũng sẽ trở thành lãnh thổ thuộc về các kẻ thù của người ấy[a], còn Y-sơ-ra-ên sẽ tỏ ra dũng mãnh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các kẻ thù của người ấy”, với hậu tố giống đực số ít. Cụm từ có thể chỉ các kẻ thù của nhân vật cai trị được nói đến trong lời sấm; cũng có thể hiểu là “các kẻ thù của nó”, tức của Sê-i-rơ/Ê-đôm. Một cách phân tích cú pháp khác là: “Sê-i-rơ, tức các kẻ thù của người ấy, cũng sẽ trở thành lãnh thổ bị chiếm hữu.”'
    reason: alternative_reading
  - marker: b
    text: Nguyên văn theo nghĩa đen là “làm/thực hiện sức mạnh”, một thành ngữ có nghĩa là biểu lộ sức mạnh hoặc hành động dũng mãnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sẽ trở thành
  rationale: Trong lời sấm mang hướng tương lai, thể hoàn thành có liên từ đứng trước diễn tả kết quả sẽ xảy đến; “sẽ trở thành” thể hiện rõ sự chuyển sang tình trạng mới.
- source_word: אֱדוֹם
  choice: Ê-đôm
  rationale: Tên riêng của dân tộc và vùng đất Ê-đôm, được phiên âm theo cách gọi quen thuộc trong tiếng Việt.
- source_word: יְרֵשָׁה
  choice: lãnh thổ bị chiếm hữu
  rationale: Danh từ chỉ vật hay vùng đất trở thành tài sản chiếm hữu. Trong bối cảnh chinh phục quân sự, cách dịch này tự nhiên hơn “cơ nghiệp” và không gợi quá mức ý niệm thừa kế gia đình.
- source_word: שֵׂעִיר
  choice: Sê-i-rơ
  rationale: Tên địa danh đứng song song với Ê-đôm; nguyên văn không có danh từ “núi”, nên không thêm “núi” vào chính văn.
- source_word: אֹיְבָיו
  choice: các kẻ thù của người ấy
  rationale: Hậu tố trong tiếng Hê-bơ-rơ là ngôi thứ ba giống đực số ít. “Người ấy” giữ nguyên nét số ít và cho phép liên hệ với nhân vật cai trị trong lời sấm ở các câu xung quanh mà không xác định thần học quá mức.
- source_word: וְיִשְׂרָאֵל
  choice: còn Y-sơ-ra-ên
  rationale: Liên từ וְ có thể dịch đơn giản là “và”; “còn” diễn đạt tự nhiên sự chuyển sang mệnh đề nói về Y-sơ-ra-ên mà vẫn giữ quan hệ nối kết.
- source_word: עֹשֶׂה חָיִל
  choice: sẽ tỏ ra dũng mãnh
  rationale: Thành ngữ theo nghĩa đen là “làm/thực hiện sức mạnh”, chỉ việc biểu lộ sức mạnh hay lòng dũng mãnh. Cách dịch này giữ sắc thái quân sự và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng được hậu tố số ít trong אֹיְבָיו quy chiếu đến
  choice: Giữ hình thức số ít bằng “các kẻ thù của người ấy”, có thể liên hệ với nhân vật cai trị trong lời sấm.
  alternative: Hiểu hậu tố là quy chiếu đến Sê-i-rơ/Ê-đôm và dịch theo nghĩa quốc gia là “các kẻ thù của nó”; hoặc hiểu “Sê-i-rơ, các kẻ thù của người ấy” là cấu trúc đồng vị.
  rationale: Nguyên văn dùng hậu tố giống đực số ít, còn văn mạch gần (câu 17–19) nói về một nhân vật cai trị xuất hiện từ Y-sơ-ra-ên. Chính văn giữ dạng số ít; chú thích nêu cách hiểu khác để không xóa bỏ sự mơ hồ thực sự của cú pháp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng các địa danh quen thuộc “Ê-đôm”, “Sê-i-rơ”, “Y-sơ-ra-ên”; tránh thuật ngữ giáo phái. Cấu trúc chính văn tương đối gọn, còn sự mơ hồ về hậu tố và quan hệ cú pháp được bảo tồn bằng chú thích.
