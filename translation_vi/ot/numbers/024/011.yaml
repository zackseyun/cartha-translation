id: NUM.24.11
reference: Numbers 24:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: vi
  text: 'Vậy bây giờ, hãy chạy trốn về chỗ của ngươi. Ta đã nói: ‘Ta nhất định sẽ ban danh dự cho ngươi.’ Nhưng kìa, Yahweh đã ngăn ngươi nhận được danh dự ấy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Yahweh đã ngăn ngươi khỏi danh dự.” Động từ Hê-bơ-rơ có nghĩa là “ngăn, giữ lại”, đi với giới từ “khỏi”; bản dịch chính diễn đạt tự nhiên ý người ấy bị ngăn không nhận được danh dự đã hứa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả sắc thái nối tiếp của וְ lẫn ý thời gian của עַתָּה, đồng thời chuyển tự nhiên sang lời kết luận của Ba-lác.
- source_word: בְּרַח לְךָ אֶל־מְקוֹמֶךָ
  choice: hãy chạy trốn về chỗ của ngươi
  rationale: Mệnh lệnh בְּרַח diễn tả việc vội vã rời đi, có giọng xua đuổi mạnh; מְקוֹמֶךָ được giữ ở nghĩa khái quát là nơi chốn của người nghe, không diễn giải quá mức thành 'nhà'.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: Ta nhất định sẽ trọng đãi ngươi
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn có tác dụng nhấn mạnh. 'Nhất định' thể hiện sự quả quyết, còn 'trọng đãi' phù hợp với bối cảnh Ba-lác hứa ban danh dự và phần thưởng.
- source_word: וְהִנֵּה
  choice: Nhưng kìa
  rationale: Thể hiện cả sự tương phản với lời hứa trước đó và sắc thái chỉ dẫn chú ý tức thời của הִנֵּה.
- source_word: מְנָעֲךָ ... מִכָּבוֹד
  choice: đã ngăn ngươi nhận được vinh dự ấy
  rationale: מנע với מִן diễn tả việc ngăn một người khỏi điều gì. Cách dịch này tự nhiên trong tiếng Việt và làm rõ quan hệ cú pháp mà không đổi nghĩa; 'vinh dự ấy' quy chiếu về sự trọng đãi vừa được nhắc đến.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng của Đức Chúa Trời trong bản nguồn, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; giữ 'Yahweh' bảo toàn tính chất danh riêng của từ này.
- issue: Tác nhân khiến Ba-la-am không nhận được vinh dự
  choice: chính Yahweh đã ngăn ngươi nhận được vinh dự ấy
  alternative: Yahweh đã không ban vinh dự cho ngươi
  rationale: Giữ nguyên lời quy trách nhiệm mang tính châm biếm hoặc cáo buộc của Ba-lác đối với Yahweh, không biến lời của nhân vật thành một lời khẳng định thần học của người kể chuyện. Từ 'chính' phản ánh vị trí nổi bật của chủ ngữ יהוה sau động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/ngươi” giữ giọng của một vị vua đang tức giận và xua đuổi người dưới quyền. Dùng “kìa” để giữ sắc thái trực chỉ của הִנֵּה mà không quá cổ.
