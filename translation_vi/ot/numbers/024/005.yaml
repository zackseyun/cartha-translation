  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: vi
  text: Lều trại của ngươi tốt đẹp biết bao, hỡi Gia-cốp; nơi ở của ngươi tốt đẹp biết bao, hỡi Y-sơ-ra-ên!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה טֹּבוּ
  choice: tốt đẹp biết bao / tuyệt vời biết bao
  rationale: מַה mở đầu một câu cảm thán bày tỏ sự thán phục, không phải câu hỏi; טוֹב có nghĩa rộng là tốt, đẹp, dễ chịu. Hai cách diễn đạt tự nhiên trong tiếng Việt chuyển tải sắc thái cảm thán mà không thu hẹp hoàn toàn vào vẻ đẹp thị giác.
- source_word: אֹהָלֶיךָ
  choice: lều trại của ngươi
  rationale: אֹהֶל ở đây chỉ các lều trong doanh trại Y-sơ-ra-ên; “lều trại” tự nhiên và tránh sắc thái thờ phượng không có sẵn trong ngữ cảnh.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Tên riêng đồng thời là cách gọi thi ca dành cho toàn dân.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: nơi ở của ngươi
  rationale: מִשְׁכָּן có thể chỉ nơi cư ngụ; lựa chọn này giữ sự song song với “lều trại” nhưng không khiến người đọc hiểu riêng về Đền Tạm.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt; ở đây song song với “Gia-cốp” để chỉ dân Y-sơ-ra-ên.
theological_decisions:
- issue: Có nên dùng thuật ngữ mang nghĩa thờ phượng như “đền tạm” hay “nhà tạm” hay không
  choice: Dùng “lều trại” và “nơi ở”
  alternative: Dùng “đền tạm” hoặc “nhà tạm”
  rationale: Ngữ cảnh là Ba-la-am nhìn thấy nơi dân Y-sơ-ra-ên đóng trại. Nguyên văn không buộc phải hiểu là nơi thánh, nên tránh đưa thêm liên tưởng nghi lễ.
translation_notes:
  register: Văn phong thi ca, trang trọng nhưng hiện đại. Dùng cấu trúc “biết bao” để thể hiện rõ lực cảm thán của מַה; tách thành hai dòng nhằm làm nổi bật phép song song Hê-bơ-rơ.
