  rationale: Sửa để dùng nhất quán «tốt đẹp biết bao» cho cả hai vế, phản ánh cùng một từ טֹּבוּ và giữ phép song song thi ca. Điều chỉnh vị trí hô ngữ cùng dấu chấm phẩy chỉ nhằm làm cấu trúc tiếng Việt sáng rõ hơn, không thay đổi nghĩa. Chú thích được chỉnh để nêu các khả năng từ vựng mà không thu hẹp nghĩa của טוֹב vào vẻ đẹp thị giác.
