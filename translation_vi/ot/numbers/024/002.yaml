source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א בִלְעָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִ/שְׁבָטָ֑י/ו וַ/תְּהִ֥י עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: vi
  text: Bấy giờ, Ba-la-am ngước mắt lên và thấy Israel đang đóng trại theo từng bộ tộc[a]; Thần Khí của Đức Chúa Trời giáng trên ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cư ngụ theo các bộ tộc” hoặc “bộ tộc nào theo bộ tộc nấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “một thần khí từ Đức Chúa Trời ở trên ông.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: ngước mắt lên
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ nhưng diễn đạt tự nhiên trong tiếng Việt hiện đại, thay vì giản lược thành “nhìn”.
- source_word: וַיַּרְא
  choice: thấy
  rationale: Diễn đạt trực tiếp sự quan sát của Ba-la-am sau khi ông ngước mắt lên.
- source_word: שֹׁכֵן
  choice: đang đóng trại
  rationale: Phân từ mô tả Israel đang ở trong một trại được sắp xếp có trật tự; “đóng trại” phù hợp ngữ cảnh hơn “cư ngụ” nhưng không đưa thêm sắc thái quân sự quá mức.
- source_word: לִשְׁבָטָיו
  choice: theo từng bộ tộc
  rationale: Giới từ ל biểu thị sự sắp xếp hoặc phân chia; cách dịch này làm rõ Israel được bố trí theo các bộ tộc.
- source_word: רוּחַ אֱלֹהִים
  choice: Thần của Đức Chúa Trời
  rationale: Trong bối cảnh Ba-la-am sắp công bố lời sấm, cụm từ chỉ sự hiện diện và tác động thần linh đến từ Đức Chúa Trời. Cách dịch này giữ sức nặng thần học mà không thêm những chi tiết tín lý ngoài câu.
- source_word: וַתְּהִי עָלָיו
  choice: ngự trên ông
  rationale: Diễn đạt thành ngữ về sự hiện diện hoặc năng lực thần linh ở trên một người; chú thích giữ lại khả năng dịch sát và tĩnh hơn là “ở trên ông”.
theological_decisions:
- issue: Cách hiểu רוּחַ אֱלֹהִים trong bối cảnh ban năng lực để nói tiên tri
  choice: Thần của Đức Chúa Trời
  alternative: thần khí của Đức Chúa Trời
  rationale: Ngữ cảnh lời sấm ủng hộ cách hiểu đây là Thần đến từ Đức Chúa Trời và tác động trên Ba-la-am. Tuy nhiên, tiếng Hê-bơ-rơ không có mạo từ xác định, nên chú thích bảo tồn cách diễn đạt ít xác định hơn.
- issue: Sắc thái của וַתְּהִי עָלָיו
  choice: ngự trên ông
  alternative: ở trên ông
  rationale: Bản chính diễn đạt tự nhiên sự hiện diện thần linh trong tiếng Việt, còn chú thích bảo tồn sắc thái tĩnh và sát cấu trúc Hê-bơ-rơ hơn.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên đối với độc giả Việt Nam hiện đại. “Ba-la-am” và “Đức Chúa Trời” theo lối phiên âm, danh xưng quen thuộc; “Israel” được giữ ở dạng quốc tế hiện hành. Dấu chấm phẩy giúp phân biệt điều Ba-la-am nhìn thấy với sự kiện Thần ngự trên ông.
