  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: vi
  text: 'Rồi ông cất lên lời ngâm và nói:


    “Lời tuyên phán của Ba-la-am, con trai Bê-ô;


    lời tuyên phán của người có mắt nhắm kín[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có mắt mở ra.” Một số người hiểu cụm từ này theo cách ấy dựa trên văn cảnh về khải tượng và truyền thống giải thích cổ; tuy nhiên, hình thái Hê-bơ-rơ trực tiếp hơn gợi nghĩa “nhắm” hoặc “đóng kín.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Rồi ông cất lời ngâm
  rationale: Thành ngữ Hê-bơ-rơ giới thiệu một lời nói trang trọng, có tính thi ca. “Cất lời ngâm” giữ được hình ảnh của động từ נָשָׂא và phù hợp với văn cảnh thi ca, mà không đồng nhất מָשָׁל với נְאֻם ở phần sau.
- source_word: וַיֹּאמַר
  choice: và nói
  rationale: Đây là động từ tường thuật thông thường của אָמַר; cách dịch trực tiếp giữ nhịp của câu dẫn nhập.
- source_word: נְאֻם
  choice: lời tuyên phán của
  rationale: Danh từ này mở đầu một công thức phát ngôn trang trọng, thường mang sắc thái tiên tri. “Lời tuyên phán” tự nhiên, rõ nghĩa và phân biệt với מָשָׁל ở đầu câu.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Dạng phiên âm tên riêng quen dùng và dễ đọc trong tiếng Việt.
- source_word: בְּנוֹ בְעֹר
  choice: con trai Bê-ô
  rationale: Chuỗi liên kết chỉ quan hệ cha con; dịch trực tiếp, tự nhiên trong tiếng Việt.
- source_word: הַגֶּבֶר
  choice: người
  rationale: Trong công thức tự giới thiệu này, từ chỉ một người đàn ông; tiếng Việt không cần lặp từ “đàn ông” để giữ giống ngữ pháp khi ngữ cảnh đã xác định Ba-la-am.
- source_word: שְׁתֻם הָעָיִן
  choice: có con mắt nhắm kín
  rationale: Hình thái Hê-bơ-rơ theo Văn bản Masore trực tiếp gợi nghĩa “bị đóng/nhắm kín”. Cách dịch này giữ số ít của עַיִן và không âm thầm giải quyết cụm từ khó theo văn cảnh khải tượng.
theological_decisions:
- issue: Ý nghĩa của cụm שְׁתֻם הָעָיִן mô tả khả năng nhìn của Ba-la-am
  choice: có con mắt nhắm kín
  alternative: có con mắt mở ra
  rationale: Hình thái của bản Hê-bơ-rơ Masore nghiêng trực tiếp hơn về nghĩa “nhắm/đóng kín”, trong khi văn cảnh về khải tượng và một số truyền thống giải thích cổ ủng hộ nghĩa “mở ra”. Bản chính giữ cách hiểu sát hình thái nguồn, còn chú thích bảo tồn cách hiểu theo văn cảnh và tính bất định thực sự của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp thi ca. Dùng “cất lời ngâm” để giới thiệu diễn từ thi ca, rồi dùng “lời tuyên phán” cho công thức נְאֻם. Giữ nguyên sự khó hiểu có chủ ý của cụm cuối và giải thích phương án khác trong chú thích.
