source:
  edition: WLC
  text: כָּרַ֨ע שָׁכַ֧ב כַּ/אֲרִ֛י וּ/כְ/לָבִ֖יא מִ֣י יְקִימֶ֑/נּוּ מְבָרֲכֶ֣י/ךָ בָר֔וּךְ וְ/אֹרְרֶ֖י/ךָ אָרֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: vi
  text: 'Nó rạp mình, nằm xuống như sư tử,

    như sư tử cái[a]—ai sẽ làm nó trỗi dậy?

    Người chúc phước cho ngươi thì được chúc phước[b],

    còn người nguyền rủa ngươi thì bị nguyền rủa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như một con sư tử mạnh mẽ.” Từ Hê-bơ-rơ có thể chỉ một con sư tử khỏe mạnh hoặc trưởng thành; “sư tử cái” giữ sự phân biệt với từ “sư tử” ở vế trước.'
    reason: lexical_alternative
  - marker: b
    text: Công thức chúc phước và nguyền rủa này vang vọng Sáng Thế Ký 12:3 và 27:29.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: phục mình
  rationale: Động từ chỉ tư thế hạ thấp hoặc co mình xuống. Trong hình ảnh sư tử nằm nghỉ, “phục mình” diễn tả tư thế con vật mà không biến câu thành hành động thờ lạy hay quy phục của con người.
- source_word: שָׁכַב
  choice: nằm xuống
  rationale: 'Giữ động tác thứ hai trong chuỗi hình ảnh: con sư tử hạ mình rồi nằm nghỉ.'
- source_word: כַּאֲרִי
  choice: như sư tử
  rationale: Chuyển trực tiếp phép so sánh và giữ hình ảnh thơ rõ ràng.
- source_word: וּכְלָבִיא
  choice: như sư tử cái
  rationale: לָבִיא có thể chỉ sư tử, thường gợi sức mạnh hoặc sự trưởng thành, và đôi khi được hiểu là sư tử cái. “Sư tử cái” giữ sự phân biệt từ vựng với אֲרִי; khả năng dịch khác được nêu trong chú thích.
- source_word: מִי יְקִימֶנּוּ
  choice: ai sẽ làm nó trỗi dậy?
  rationale: Dạng khiến khiến của קום theo nghĩa đen là làm cho đứng dậy. Cách dịch này phù hợp với con sư tử đang nằm, đồng thời không thêm ý “dám” vốn không được nói rõ trong tiếng Hê-bơ-rơ.
- source_word: מְבָרֲכֶיךָ
  choice: người chúc phước cho ngươi
  rationale: Phân từ kèm hậu tố ngôi thứ hai số ít được diễn đạt tự nhiên bằng cụm danh từ, đồng thời giữ đối tượng được xưng hô ở số ít.
- source_word: בָרוּךְ
  choice: được chúc phước
  rationale: Tính từ vị ngữ công bố tình trạng được ban phước; cấu trúc này tự nhiên trong tiếng Việt và giữ tính chất tuyên bố của câu.
- source_word: וְאֹרְרֶיךָ
  choice: còn người nguyền rủa ngươi
  rationale: Giữ cấu trúc song song và tương phản trực tiếp với “người chúc phước cho ngươi”.
- source_word: אָרוּר
  choice: bị nguyền rủa
  rationale: Diễn đạt tính từ vị ngữ trong vế đối xứng với “được chúc phước”, không mở rộng nội dung lời nguyền.
theological_decisions:
- issue: Đối tượng của các hậu tố ngôi thứ hai trong lời “chúc phước cho ngươi… nguyền rủa ngươi”
  choice: Giữ đại từ số ít “ngươi”, hướng đến Israel/Gia-cốp trong lời sấm
  alternative: Diễn đạt thành số nhiều cho toàn dân Israel, hoặc xác định hẹp là vua của Israel
  rationale: Ngữ cảnh dùng số ít mang tính thơ ca và đại diện cho Israel/Gia-cốp. Bản dịch giữ nguyên số ít để bảo toàn khả năng quy chiếu đại diện-tập thể mà không xác định quá mức.
- issue: Sự vang vọng công thức phước lành và nguyền rủa của các tổ phụ
  choice: Giữ nguyên lời tuyên bố trực tiếp và chỉ nêu liên hệ trong chú thích
  alternative: Mở rộng ngay trong chính văn để nói rõ giao ước với Áp-ra-ham
  rationale: Cách diễn đạt gợi mạnh Sáng Thế Ký 12:3 và 27:29, nhưng chính văn không nên thêm lời giải thích thần học mà nguyên bản không nói rõ.
translation_notes:
  register: Văn phong thơ trang trọng nhưng dễ hiểu. “Ngươi” được dùng để giữ ngôi thứ hai số ít của tiếng Hê-bơ-rơ và sắc thái lời sấm; không đổi sang số nhiều, dù đối tượng có lực đại diện-tập thể. Các dòng được ngắt theo các vế thơ song song.
