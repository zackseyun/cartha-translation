  text: כִּ֥י אִם יִהְיֶ֖ה לְ/בָ֣עֵֽר קָ֑יִן עַד מָ֖ה אַשּׁ֥וּר תִּשְׁבֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: vi
  text: Vì nếu Ca-in[a] bị thiêu hủy, thì còn bao lâu nữa A-sua[b] sẽ bắt ngươi đi làm phu tù?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ở đây, Ca-in rất có thể chỉ người Kê-nít chứ không phải cá nhân Ca-in.
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh này, A-sua có thể chỉ nước A-si-ri hoặc thế lực A-si-ri.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Vì nếu
  rationale: Giữ mối liên kết giải thích với lời sấm trước đó và bảo toàn sắc thái điều kiện của cụm từ Hê-bơ-rơ.
- source_word: יִהְיֶה לְבָעֵר
  choice: phải bị thiêu hủy
  rationale: Diễn đạt tự nhiên ý hướng tới một kết cục đã được báo trước, đồng thời giữ hình ảnh thiêu đốt của בער mà không quyết định đó là lửa theo nghĩa đen hay sự hủy diệt theo nghĩa bóng.
- source_word: קָיִן
  choice: Ca-in
  rationale: Phiên âm tên riêng theo cách quen thuộc trong tiếng Việt; chú thích cho biết trong ngữ cảnh tên này rất có thể chỉ dân Kê-nít.
- source_word: עַד מָה
  choice: còn bao lâu nữa
  rationale: Chuyển tải câu hỏi về khoảng thời gian trước khi biến cố tiếp theo xảy ra bằng lối nói tự nhiên trong tiếng Việt.
- source_word: אַשּׁוּר
  choice: A-sua
  rationale: Giữ tên riêng thay vì buộc văn bản chính phải chọn giữa đất nước A-si-ri và thế lực/người A-sua; sự nhập nhằng được nêu trong chú thích.
- source_word: תִּשְׁבֶּךָּ
  choice: sẽ bắt ngươi đi lưu đày
  rationale: Phản ánh nghĩa của שבה là bắt làm phu tù và dẫn đi, bao gồm sắc thái bị đưa khỏi quê hương.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “ngươi” được giữ vì đây là lời sấm trực tiếp nói với một cộng đồng được xem như một đối tượng số ít. Cấu trúc “Vì nếu… thì…” bảo toàn tính điều kiện và không âm thầm giải quyết sự căng thẳng của nguyên văn.
