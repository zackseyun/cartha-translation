  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: vi
  text: Đức Chúa Trời đưa người ấy ra khỏi Ai Cập; người ấy có sức mạnh như bò rừng[a]. Người ấy sẽ nuốt chửng các dân là kẻ thù của mình, nghiền nát xương chúng[b] và dùng mũi tên của mình đập tan chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ấy có những chiếc sừng như bò rừng.” Cụm từ Hê-bơ-rơ כְּתוֹעֲפֹת רְאֵם khó xác định; nó có thể nói đến sức mạnh hoặc những chiếc sừng vươn cao của bò rừng.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ יְגָרֵם rất hiếm và nghĩa chính xác không chắc chắn; cũng có thể dịch là “gặm xương chúng” hoặc “lột trơ xương chúng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Đức Chúa Trời
  rationale: Chỉ Đức Chúa Trời là chủ thể giải cứu; cách dịch này trang trọng, rõ ràng và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: מוֹצִיאוֹ
  choice: đưa người ra
  rationale: Phân từ có hậu tố đại từ mang lực của động từ; hiện tại giàu tính gợi hình của lời thơ được giữ lại mà không biến nó thành một hành động chỉ thuộc quá khứ.
- source_word: מִמִּצְרַיִם
  choice: khỏi Ai Cập
  rationale: Diễn đạt tự nhiên thành ngữ xuất hành, với nghĩa ra khỏi Ai Cập.
- source_word: כְּתוֹעֲפֹת רְאֵם
  choice: sức mạnh như bò rừng
  rationale: Cụm từ khó xác định, có thể chỉ sức mạnh cao vút hoặc những chiếc sừng. Bản dịch chính dùng nghĩa khái quát tự nhiên hơn và ghi khả năng 'sừng' trong chú thích.
- source_word: לוֹ
  choice: người có
  rationale: Cấu trúc ל־ diễn tả sự sở hữu hay điều thuộc về người; tiếng Việt tự nhiên hóa thành 'người có'.
- source_word: יֹאכַל
  choice: sẽ nuốt chửng
  rationale: Giữ hình ảnh ăn nuốt trong thi ca chiến trận và truyền đạt rõ ý tiêu diệt.
- source_word: גּוֹיִם צָרָיו
  choice: các dân thù nghịch mình
  rationale: Giữ quan hệ giữa 'các dân' và 'những kẻ thù nghịch người' trong một cụm tiếng Việt gọn, tự nhiên.
- source_word: וְעַצְמֹתֵיהֶם יְגָרֵם
  choice: nghiền nát xương chúng
  rationale: Động từ hiếm יְגָרֵם không chắc nghĩa; 'nghiền nát' phù hợp ngữ cảnh bạo liệt và đối tượng là xương, đồng thời các khả năng khác được bảo lưu trong chú thích.
- source_word: וְחִצָּיו יִמְחָץ
  choice: dùng tên mình đập tan chúng
  rationale: Hiểu 'tên' theo nghĩa công cụ và יִמְחָץ là đập tan/nghiền nát; bổ sung tân ngữ 'chúng' theo ngữ cảnh để câu tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Đối tượng của các đại từ số ít trong lời sấm của Ba-la-am
  choice: Giữ đại từ số ít 'người/mình' mà không xác định thêm đối tượng.
  alternative: Có thể hiểu là Y-sơ-ra-ên với tư cách tập thể, vị vua đại diện cho Y-sơ-ra-ên, hoặc theo cách giải thích về sau là một cá nhân thuộc Đấng Mê-si.
  rationale: Nguyên văn dùng các hình thức số ít, nhưng văn cảnh cho phép cả nghĩa tập thể lẫn đại diện. Giữ nguyên độ mở này tránh áp đặt một kết luận thần học hẹp hơn bản văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Nhịp câu giữ chất thơ chiến trận và hình ảnh mạnh của nguyên văn; tránh thuật ngữ giáo phái. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
