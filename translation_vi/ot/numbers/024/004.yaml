reference: Numbers 24:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: vi
  text: 'lời tuyên phán[a] của người nghe những lời của Đức Chúa Trời, người thấy khải tượng của Đấng Toàn Năng, ngã xuống, nhưng mắt không bị che phủ[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời sấm”. Từ Hê-bơ-rơ נְאֻם là thuật ngữ tiên tri trang trọng chỉ một lời được long trọng công bố.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ngã xuống và mắt mở”. Theo sát chữ: “ngã xuống, và mắt không bị che phủ”. Liên từ Hê-bơ-rơ có thể được hiểu là “và” hoặc, theo quan hệ trong ngữ cảnh, là “nhưng”.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: lời tuyên phán
  rationale: Danh từ này mở đầu một lời phát biểu trang trọng mang tính tiên tri. “Lời tuyên phán” giữ được sắc thái long trọng mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: שֹׁמֵעַ
  choice: người nghe
  rationale: Phân từ được dùng như danh từ, mô tả người có đặc điểm là nghe; cách dịch này giữ được tính khái quát và song song với “người thấy”.
- source_word: אִמְרֵי אֵל
  choice: những lời của Đức Chúa Trời
  rationale: אִמְרֵי là dạng số nhiều liên kết, nghĩa là “những lời/những lời phán”; אֵל ở đây là tước hiệu chung chỉ Đức Chúa Trời chứ không nhất thiết là tên riêng.
- source_word: מַחֲזֵה שַׁדַּי
  choice: khải tượng của Đấng Toàn Năng
  rationale: מַחֲזֵה chỉ điều được thấy trong kinh nghiệm khải thị; שַׁדַּי được dịch theo tước hiệu quen thuộc “Đấng Toàn Năng”.
- source_word: יֶחֱזֶה
  choice: thấy
  rationale: Dù ở hình thái vị hoàn thành, động từ trong lời tự thuật thi ca này diễn tả hành động mang tính đặc trưng, song song với “nghe”.
- source_word: נֹפֵל
  choice: ngã xuống
  rationale: Phân từ giữ sắc thái hành động đang xảy ra mà không quyết định quá mức rằng tư thế ấy nhất thiết là phủ phục để thờ lạy.
- source_word: וּגְלוּי עֵינָיִם
  choice: nhưng mắt không còn bị che phủ
  rationale: גְלוּי có nghĩa đen là “được mở ra/không bị che phủ”. “Nhưng” diễn đạt quan hệ tương phản hợp lý giữa ngã xuống và vẫn có thị giác khải thị, đồng thời chú thích nêu khả năng dịch ít diễn giải hơn.
theological_decisions:
- issue: Cách dịch שַׁדַּי
  choice: Đấng Toàn Năng
  alternative: Shaddai
  rationale: Đây là tước hiệu thần linh; dịch nghĩa giúp độc giả hiểu trực tiếp mà không áp đặt một nội dung tín lý hẹp hơn từ ngữ nguồn.
- issue: Quan hệ giữa נֹפֵל và וּגְלוּי עֵינָיִם
  choice: ngã xuống nhưng mắt không còn bị che phủ
  alternative: ngã xuống và mắt không bị che phủ
  rationale: Liên từ ו có thể chỉ sự nối tiếp đơn thuần hoặc mang sắc thái tương phản theo ngữ cảnh. Bản chính dùng “nhưng” để thể hiện sự tương phản tự nhiên, còn chú thích bảo lưu cách hiểu sát hình thức hơn.
translation_notes:
  register: Văn phong trang trọng, giàu nhịp điệu nhưng dùng từ hiện đại và dễ hiểu. Cấu trúc lặp “người nghe… người thấy…” duy trì tính song song của câu thơ Hê-bơ-rơ. Dấu hai chấm giữ chức năng dẫn vào nội dung lời sấm tiếp theo.
