  - severity: low
    issue: 'Chú thích b nói “Theo sát chữ: ‘ngã xuống và mắt được mở ra/không bị che phủ’”.'
    rationale: “Được mở ra” là một diễn đạt giải thích có thể dùng, nhưng không sát hình ảnh tính từ “mắt được vén mở/không bị che phủ” bằng “mắt không bị che phủ”. Chú thích nên phân biệt bản dịch thay thế “mắt mở” với cách diễn đạt sát chữ.
