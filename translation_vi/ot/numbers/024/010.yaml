  to: 'Bấy giờ, Ba-lác bừng giận với Ba-la-am và đập hai bàn tay vào nhau. Ba-lác nói với Ba-la-am: “Ta đã gọi ngươi đến để nguyền rủa kẻ thù của ta, thế mà xem kìa, ngươi lại cứ chúc phước cho chúng đến ba lần[a]!”'
