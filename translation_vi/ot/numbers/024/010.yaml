    rationale: Trong tiếng Việt hiện đại, “bừng lên với” ít tự nhiên khi chủ ngữ là “cơn giận”. “Ba-lác bừng giận với Ba-la-am” diễn đạt trôi chảy hơn, vẫn phản ánh hình ảnh cơn giận bùng cháy của וַיִּחַר אַף.
