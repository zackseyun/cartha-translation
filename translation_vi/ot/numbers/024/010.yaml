base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: vi
  text: 'Bấy giờ, Ba-lác bừng giận với Ba-la-am và đập hai bàn tay vào nhau. Ba-lác nói với Ba-la-am: “Ta đã gọi ngươi đến để nguyền rủa kẻ thù của ta, thế mà xem kìa, ngươi lại cứ chúc phước cho chúng đến ba lần[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ sát nghĩa là “ngươi đã chúc phước, chúc phước”, một cấu trúc nhấn mạnh việc chúc phước lặp lại hoặc mạnh mẽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: cơn giận của Ba-lác bừng lên với Ba-la-am
  rationale: Giữ hình ảnh cơn giận bùng cháy trong thành ngữ Hê-bơ-rơ, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: ông đập hai bàn tay vào nhau
  rationale: Diễn tả rõ cử chỉ giận dữ, tránh sắc thái tích cực mà “vỗ tay” có thể gợi ra.
- source_word: לָקֹב
  choice: để nguyền rủa
  rationale: Thể hiện trực tiếp mục đích Ba-lác gọi Ba-la-am đến.
- source_word: אֹיְבַי
  choice: kẻ thù của ta
  rationale: Cách dịch rõ nghĩa và tự nhiên cho danh từ số nhiều có sở hữu.
- source_word: קְרָאתִיךָ
  choice: Ta đã gọi ngươi đến
  rationale: “Gọi ... đến” truyền đạt nghĩa triệu đến mà không làm câu quá trang trọng.
- source_word: וְהִנֵּה
  choice: thế mà xem kìa
  rationale: Kết hợp sắc thái tương phản do ngữ cảnh tạo ra với chức năng thu hút sự chú ý của tiểu từ.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: ngươi lại cứ chúc phước cho chúng
  rationale: Cấu trúc động từ hữu hạn đi với nguyên mẫu tuyệt đối tạo nhấn mạnh; “lại cứ” chuyển tải lời trách cứ về hành động được nhấn mạnh và lặp lại mà không thêm ý tuyệt đối hóa.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: đã ba lần rồi
  rationale: Diễn đạt tự nhiên ý ba lần xảy ra tính đến thời điểm hiện tại.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng với độc giả Việt Nam hiện đại. Đại từ “ta—ngươi” phản ánh lời quở trách của một vị vua đối với người được triệu đến. Dùng “chúc phước” để phù hợp ngữ cảnh ban phước/nguyền rủa trong sách Dân Số.
