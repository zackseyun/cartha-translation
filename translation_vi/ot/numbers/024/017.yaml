  rationale: 'Bản sửa làm tiếng Việt tự nhiên và mạch lạc hơn, đồng thời bảo toàn các điểm mơ hồ có chủ ý của nguyên văn: “không gần” không giới hạn קָרוֹב vào không gian; “người ấy” liên kết hành động chinh phục với nhân vật nam tính được thấy trong thị kiến, trong khi “ngôi sao” và “vương trượng” vẫn được giữ nguyên như các biểu tượng hoàng gia. Không thêm nhận diện Mê-si hay một nhân vật lịch sử cụ thể.'
