  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: vi
  text: Tôi thấy người ấy[a], nhưng không phải bây giờ; tôi nhìn người ấy, nhưng không gần. Một ngôi sao đã xuất hiện từ Gia-cốp, một vương trượng đã trỗi dậy từ Y-sơ-ra-ên[b]; người ấy sẽ đập tan các góc của Mô-áp[c] và phá hủy mọi con trai của Sết[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi sẽ thấy người ấy.” Dạng động từ Hê-bơ-rơ có thể diễn tả một thị kiến hiện ra sống động hoặc điều sẽ xảy đến.'
    reason: lexical_alternative
  - marker: b
    text: “Ngôi sao” và “vương trượng” là những hình ảnh vương quyền, có thể chỉ về một vị vua sẽ đến.
    reason: cultural_note
  - marker: c
    text: 'Nguyên văn Hê-bơ-rơ: “các góc của Mô-áp,” có lẽ là một cách nói bóng chỉ các miền biên địa hoặc sức mạnh của Mô-áp.'
    reason: cultural_note
  - marker: d
    text: Hay “mọi con cháu của Sết.” Một số người hiểu cụm từ Hê-bơ-rơ này theo nghĩa rộng hơn là toàn thể loài người hoặc một dân thù nghịch.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ / אֲשׁוּרֶנּוּ
  choice: Tôi thấy người ấy / tôi nhìn người ấy
  rationale: Hai động từ đều có hậu tố giống đực số ít, vì vậy dùng “người ấy” để giữ đối tượng mang tính nhân vị; “thấy” và “nhìn” duy trì phép song song mà không đồng nhất hai động từ.
- source_word: וְלֹא עַתָּה / וְלֹא קָרוֹב
  choice: nhưng không phải bây giờ / nhưng người ấy không ở gần
  rationale: Giữ nguyên sự song song và cả sắc thái thời gian lẫn khoảng cách của קָרוֹב, thay vì thu hẹp nghĩa thành “chẳng bao lâu nữa”.
- source_word: דָּרַךְ כּוֹכָב
  choice: Một ngôi sao đã tiến ra
  rationale: דָּרַךְ theo nghĩa gốc là bước/tiến, ở đây diễn tả sự xuất hiện hay tiến ra. “Đã tiến ra” giữ hình ảnh khác thường và sắc thái xác quyết của lời tiên tri.
- source_word: וְקָם שֵׁבֶט
  choice: một vương trượng đã trỗi dậy
  rationale: שֵׁבֶט có thể là gậy, trượng hoặc bộ tộc; trong phép song song mang tính vương quyền với “ngôi sao”, “vương trượng” phù hợp nhất.
- source_word: וּמָחַץ פַּאֲתֵי מוֹאָב
  choice: sẽ đập tan các góc của Mô-áp
  rationale: מחץ là đập tan/nghiền nát; פאה thường là góc, mép hoặc phía. Bản dịch giữ nguyên ẩn dụ khó thay vì diễn giải thành “các thủ lĩnh” hay “sức mạnh”.
- source_word: וְקַרְקַר
  choice: phá hủy
  rationale: Động từ hiếm và không chắc nghĩa, thường được hiểu là phá đổ, tàn phá hoặc hủy diệt. “Phá hủy” tự nhiên trong tiếng Việt mà không khẳng định một hình ảnh cụ thể quá mức.
- source_word: כָּל בְּנֵי שֵׁת
  choice: mọi con trai của Sết
  rationale: Đọc שֵׁת như tên riêng Sết theo hình thức phụ âm tự nhiên của bản Hê-bơ-rơ, đồng thời ghi chú cách hiểu rộng hơn.
theological_decisions:
- issue: Ý nghĩa về Đấng Mê-si của lời sấm
  choice: Giữ nguyên các hình ảnh hoàng gia “ngôi sao” và “vương trượng”, không nêu đích danh Đấng Mê-si trong chính văn.
  alternative: Dịch trực tiếp thành một lời tiên tri nói rõ về Đấng Mê-si, hoặc giới hạn lời này vào một vua lịch sử như Đa-vít.
  rationale: Bản Hê-bơ-rơ trình bày một nhân vật cai trị bằng hình ảnh biểu tượng nhưng không gọi đích danh. Cách dịch này bảo toàn khả năng ứng nghiệm mang tính Mê-si mà không đưa kết luận thần học vào chính văn.
- issue: Chủ thể của các động từ chinh phục
  choice: Lược chủ ngữ trước “sẽ đập tan” và “phá hủy”, như tiếng Việt cho phép, để hình ảnh ngôi sao/vương trượng và nhân vật được thấy vẫn gắn kết mà không bị đồng nhất quá mức.
  alternative: Nêu rõ “người ấy sẽ” hoặc “nó sẽ”.
  rationale: Phần đầu có đối tượng giống đực số ít, còn phần sau dùng các danh từ biểu tượng làm chủ thể. Lược chủ ngữ giúp giữ sự căng thẳng giữa nhân vật và biểu tượng, đồng thời tránh đại từ “nó” thiếu trang trọng.
translation_notes:
  register: Văn phong tiên tri trang trọng nhưng hiện đại. Dùng “người ấy” thay cho đại từ cổ, giữ nhịp song song của thơ Hê-bơ-rơ và bảo lưu các hình ảnh khó như “ngôi sao”, “vương trượng” và “các góc của Mô-áp”.
