source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: vi
  text: 'Chúng trải dài như những thung lũng,

    như những khu vườn bên dòng sông,

    như những cây trầm hương[a] mà Yahweh đã trồng,

    như những cây tuyết tùng bên các dòng nước.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cây gỗ thơm” hoặc “aloewood”. Từ Hê-bơ-rơ ở đây chỉ một loại cây hay gỗ có hương thơm, không phải “lều”; việc xác định chính xác loài cây không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: những thung lũng
  rationale: Danh từ נחל có thể chỉ thung lũng, lòng suối hoặc khe nước. “Những thung lũng” tự nhiên trong tiếng Việt và giữ được hình ảnh không gian trải dài; các vế sau làm rõ khung cảnh dồi dào nước.
- source_word: נִטָּיוּ
  choice: Chúng trải dài
  rationale: Động từ נטה diễn tả sự giăng ra hoặc kéo dài. Đại từ “chúng” nối với lều trại/nơi cư ngụ của Israel trong câu trước, còn “trải dài” truyền đạt rõ hình ảnh toàn cảnh.
- source_word: גַנֹּת
  choice: những khu vườn
  rationale: Cách dịch trực tiếp, tự nhiên, giữ hình ảnh màu mỡ và được vun trồng.
- source_word: עֲלֵי נָהָר
  choice: bên dòng sông
  rationale: Trong thành ngữ này, עַל chỉ vị trí ở bên hoặc dọc theo; “bên dòng sông” là cách nói tự nhiên và giữ danh từ số ít của nguyên văn.
- source_word: אֲהָלִים
  choice: những cây trầm hương
  rationale: Trong ngữ cảnh thi ca này, từ này chỉ loại cây hoặc gỗ có hương thơm, thường được hiểu là aloewood/lign aloes. “Cây trầm hương” truyền đạt hình ảnh thực vật thơm tự nhiên hơn trong tiếng Việt; chú thích giữ lại sự bất định về định danh.
- source_word: נָטַע
  choice: đã trồng
  rationale: Dạng hoàn thành của động từ diễn tả hành động trồng đã được thực hiện và kết quả đang hiện hữu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: אֲרָזִים
  choice: những cây tuyết tùng
  rationale: Cách gọi thông dụng, giữ hình ảnh về sức mạnh, tầm vóc và sự bền vững.
- source_word: עֲלֵי מָיִם
  choice: bên các dòng nước
  rationale: “Các dòng nước” vừa tự nhiên trong tiếng Việt vừa phản ánh dạng số nhiều מָיִם và hình ảnh nguồn nước dồi dào.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. Phiên âm “Yahweh” bảo tồn tính chất danh riêng và không thay nó bằng một tước hiệu.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng hiện đại. Bốn vế so sánh được trình bày song song; “chúng” nối tự nhiên với đối tượng được mô tả ở câu trước. Dùng “cây trầm hương” thay vì từ vay mượn khó hiểu, đồng thời giữ sự bất định thực vật học trong chú thích.
