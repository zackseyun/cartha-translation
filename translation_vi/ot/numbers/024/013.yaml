id: NUM.24.13
reference: Numbers 24:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: vi
  text: Nếu Ba-lác có cho tôi cả một ngôi nhà đầy bạc và vàng, tôi cũng không thể vượt quá lời của Yahweh[a] để tự ý mình làm điều lành hay điều dữ. Yahweh phán điều gì, tôi sẽ nói điều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “vượt qua miệng của Yahweh.”'
    reason: Giải thích hình ảnh nguyên ngữ đứng sau cách dịch “vượt quá lời của Yahweh”.
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: Dù ... có cho
  rationale: Trong ngữ cảnh này, אִם với động từ chưa hoàn thành nêu một giả định nhượng bộ; cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với ý 'ngay cả nếu'.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: cả một ngôi nhà đầy bạc và vàng
  rationale: Giữ hình ảnh về một ngôi nhà chứa đầy bạc vàng, đồng thời diễn đạt tự nhiên mức thù lao cực lớn được giả định.
- source_word: לֹא אוּכַל
  choice: tôi cũng không thể
  rationale: Diễn đạt khả năng bị phủ định trong mệnh đề giả định; 'cũng' nối tự nhiên với sắc thái nhượng bộ ở đầu câu.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: vượt quá lời của Yahweh
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là 'vượt qua miệng của Yahweh'; dùng 'lời' trong chính văn vừa rõ nghĩa vừa giữ hình ảnh về ranh giới không được vượt quá.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước יהוה, thay vì thay bằng một tước hiệu.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: làm điều lành hay điều dữ
  rationale: Giữ nguyên cặp đối lập טוב/רע với sắc thái trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: מִלִּבִּי
  choice: tự lòng mình
  rationale: Chỉ nguồn gốc hay sáng kiến xuất phát từ chính Ba-la-am, đối lập với điều Yahweh phán.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ
  choice: Yahweh phán điều gì
  rationale: Diễn đạt tự nhiên cấu trúc quan hệ cùng đại từ tân ngữ hồi chỉ, trong đó nội dung Yahweh phán được đưa lên trước.
- source_word: אֲדַבֵּר
  choice: tôi sẽ nói điều ấy
  rationale: Thể chưa hoàn thành ở đây mang ý tương lai/quyết định; 'điều ấy' tái hiện cấu trúc hồi chỉ của nguyên văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; giữ 'Yahweh' bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Giới hạn của Ba-la-am
  choice: Ba-la-am không thể tự ý vượt quá lời Yahweh để làm điều lành hay điều dữ
  alternative: Ba-la-am chỉ không thể thay đổi mệnh lệnh cụ thể về việc chúc phước hay nguyền rủa
  rationale: Bản dịch giữ phạm vi phát biểu trực tiếp của câu và sự căng thẳng giữa 'làm điều lành hay điều dữ' với việc chỉ nói điều Yahweh phán, không suy rộng thành một giáo lý tổng quát về lời tiên tri.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'điều lành hay điều dữ' để giữ sắc thái Kinh Thánh; cấu trúc câu được làm tự nhiên mà vẫn bảo tồn thế đối lập giữa ý riêng của Ba-la-am và lời Yahweh.
