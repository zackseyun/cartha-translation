base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: vi
  text: 'Rồi ông thấy dân Kê-nít, cất lời sấm[a] và nói:


    “Chỗ ở của ngươi thật bền vững,


    tổ ngươi ở trên vách đá.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ מָשָׁל có thể chỉ châm ngôn, lời chế nhạo hoặc lời tuyên sấm; ở đây từ này chỉ lời thơ mang tính tiên tri của Ba-la-am.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “hãy đặt tổ ngươi trên vách đá.” Hình thức Hê-bơ-rơ có thể được phân tích như một mệnh lệnh, dù ngữ cảnh thơ song hành nghiêng về lời mô tả.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הַקֵּינִי
  choice: dân Kê-nít
  rationale: Danh từ ở dạng số ít có mạo từ nhưng chỉ một cộng đồng theo nghĩa tập thể. “Dân Kê-nít” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ đối tượng tập thể của lời sấm.
- source_word: מְשָׁלוֹ
  choice: lời sấm
  rationale: Trong các lời của Ba-la-am, מָשָׁל chỉ một lời nói thi ca trang trọng mang tính tiên tri. “Lời sấm” phù hợp ngữ cảnh hơn “tục ngữ,” nhưng phạm vi nghĩa rộng của từ Hê-bơ-rơ được ghi chú.
- source_word: אֵיתָן
  choice: bền vững
  rationale: Tính từ diễn tả sự chắc chắn, lâu bền và ổn định. “Bền vững” bao quát cả độ vững chắc lẫn tính lâu dài.
- source_word: מוֹשָׁבֶךָ
  choice: nơi ở của ngươi
  rationale: Từ này chỉ chỗ cư ngụ hoặc nơi định cư. Cách dịch này rõ ràng, tự nhiên và giữ đại từ số ít của lời trực tiếp.
- source_word: וְשִׂים
  choice: được đặt
  rationale: Trong mạch thơ, cụm từ được hiểu là mô tả tình trạng của cái tổ. Tuy nhiên, hình thức Hê-bơ-rơ cũng có thể được hiểu như một mệnh lệnh “hãy đặt,” nên khả năng ấy được bảo lưu trong chú thích.
- source_word: בַּסֶּלַע
  choice: giữa vách đá
  rationale: סֶלַע có thể chỉ đá, khối đá hoặc vách đá. “Giữa vách đá” làm rõ hình ảnh một cái tổ nằm an toàn trong địa hình đá cao mà không làm mất ẩn dụ.
- source_word: קִנֶּךָ
  choice: tổ của ngươi
  rationale: Giữ nguyên hình ảnh cụ thể về tổ chim trong nguyên văn, thay vì diễn giải thành nơi trú ẩn hay thành trì.
theological_decisions:
- issue: Lời thơ là lời mô tả hay mệnh lệnh
  choice: “tổ của ngươi được đặt giữa vách đá” như lời mô tả
  alternative: “hãy đặt tổ ngươi giữa vách đá” như mệnh lệnh
  rationale: Ngữ cảnh song hành mô tả sự vững chắc của nơi cư ngụ, nên cách hiểu mô tả phù hợp hơn; tuy vậy, hình thái וְשִׂים cho phép cách đọc mệnh lệnh và không nên bị che khuất.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng dùng từ hiện đại, dễ hiểu. Giữ cách xưng hô số ít “ngươi” để phản ánh lời hướng trực tiếp đến dân Kê-nít như một tập thể và duy trì sắc thái sấm truyền.
