source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: vi
  text: Và bây giờ, này, tôi sắp trở về với dân tôi. Nào, tôi sẽ khuyên bảo ông về điều dân này sẽ làm đối với dân ông trong những ngày sau cùng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Cũng có thể dịch là “trong những ngày sắp tới.” Cụm từ Hê-bơ-rơ có thể chỉ tương lai nói chung, dù “những ngày sau cùng” giữ được sức nặng tiên tri của câu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Giữ chức năng chuyển ý theo thời gian của וְעַתָּה; trong tiếng Việt, không cần dịch riêng liên từ וְ để câu tự nhiên.
- source_word: הִנְנִי
  choice: này, tôi
  rationale: “Này” giữ sắc thái nhấn mạnh, thu hút sự chú ý của הִנְנִי mà vẫn phù hợp với văn phong trang trọng hiện đại.
- source_word: הוֹלֵךְ לְעַמִּי
  choice: tôi đi về với dân mình
  rationale: Dạng phân từ diễn tả hành động sắp diễn ra; “đi về với” tự nhiên trong tiếng Việt và giữ đích đến là dân của chính Ba-la-am.
- source_word: לְכָה
  choice: Hãy đến đây
  rationale: Mệnh lệnh dùng để gọi người nghe chú ý và đến nghe; “đến đây” thể hiện rõ chức năng hội thoại.
- source_word: אִיעָצְךָ
  choice: tôi sẽ cho ông biết
  rationale: Trong cấu trúc có mệnh đề dự báo theo sau, cách dịch này truyền đạt tự nhiên chức năng thông báo. Nghĩa từ vựng sát hơn là “khuyên/bàn”, được giữ trong chú thích [a].
- source_word: אֲשֶׁר יַעֲשֶׂה הָעָם הַזֶּה
  choice: dân này sẽ làm gì
  rationale: Diễn đạt tự nhiên nội dung của mệnh đề quan hệ trong tiếng Việt, đồng thời giữ “dân” ở số tập thể.
- source_word: לְעַמְּךָ
  choice: đối với dân ông
  rationale: Giữ quan hệ tương đối trung tính của giới từ לְ; ngữ cảnh có thể hàm ý hành động chống lại nhưng không áp đặt điều đó vào chính văn.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: trong những ngày sau cùng
  rationale: Giữ hình ảnh thời gian và sức nặng tiên tri của thành ngữ Hê-bơ-rơ, không thu hẹp nó thành một hệ thống cánh chung cụ thể.
theological_decisions:
- issue: Phạm vi thời gian của בְּאַחֲרִית הַיָּמִים
  choice: trong những ngày sau cùng
  alternative: trong những ngày sắp tới
  rationale: Cụm từ có thể chỉ một thời kỳ tương lai nói chung, nhưng cũng có thể mang sức nặng cánh chung. Bản dịch chính giữ nguyên độ căng và chú thích nêu nghĩa rộng hơn.
- issue: Sắc thái hành động đối với dân Mô-áp trong לְעַמְּךָ
  choice: đối với dân ông
  alternative: chống lại dân ông
  rationale: Ngữ cảnh lời tiên tri có thể hàm ý thù địch, nhưng giới từ Hê-bơ-rơ tự nó chỉ quan hệ hoặc đối tượng chịu tác động. Cách dịch trung tính tránh giải quyết thay cho độc giả.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “tôi–ông” phù hợp với lời Ba-la-am nói trực tiếp với Ba-lác mà không thêm tước hiệu không có trong câu Hê-bơ-rơ. Cấu trúc được làm tự nhiên cho tiếng Việt, đồng thời các điểm mơ hồ thực sự về “khuyên/cho biết,” “đối với/chống lại,” và thời điểm tương lai được bảo tồn bằng chú thích.
