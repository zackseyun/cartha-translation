  yaml_path: translation/ot/numbers/024/025.yaml
  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: vi
  text: Rồi Ba-la-am đứng dậy, lên đường trở về chỗ của mình; Ba-lác cũng đi theo đường mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: đứng dậy
  rationale: Động từ קום trong chuỗi tự sự chỉ việc đứng lên để bắt đầu rời đi; “đứng dậy” tự nhiên và giữ được hình ảnh của tiếng Hê-bơ-rơ.
- source_word: בִּלְעָם
  choice: Ba-la-am
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: וַיֵּלֶךְ וַיָּשָׁב
  choice: lên đường trở về
  rationale: Hai động từ liên tiếp có nghĩa đen là “đi và trở về”. Gộp thành “lên đường trở về” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ cả ý khởi hành lẫn quay về.
- source_word: לִמְקֹמוֹ
  choice: chỗ của mình
  rationale: מקום nghĩa là “nơi/chỗ”. Không dịch thành “nhà” vì nguyên văn không nói rõ đó là nhà hay quê hương.
- source_word: וְגַם
  choice: cũng
  rationale: Diễn đạt quan hệ bổ sung và song song giữa hành động của Ba-lác với sự ra đi của Ba-la-am; dấu chấm phẩy đảm nhiệm sự liên kết mà không cần thêm “và” một cách gượng ép.
- source_word: בָּלָק
  choice: Ba-lác
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: הָלַךְ לְדַרְכּוֹ
  choice: đi đường mình
  rationale: Giữ sát thành ngữ Hê-bơ-rơ “đi theo đường của mình”, đồng thời diễn đạt ngắn gọn, tự nhiên trong tiếng Việt.
