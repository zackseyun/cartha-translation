translation_notes:
  register: Văn phong tự sự trang trọng, rõ ràng và hiện đại. Bản dịch giữ sự phân biệt giữa “chỗ của mình” và “đường mình”, không suy diễn rằng Ba-la-am đã về nhà hay quê hương.
