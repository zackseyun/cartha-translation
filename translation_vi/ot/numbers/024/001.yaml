id: NUM.24.1
reference: Numbers 24:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: vi
  text: Khi Ba-la-am thấy rằng việc ban phước cho Israel là điều đẹp lòng Yahweh, ông không đi như những lần trước để tìm điềm báo[a], nhưng hướng mặt về phía hoang mạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để gặp các điềm bói” hoặc “để gặp các sự bói toán”. Cụm từ Hê-bơ-rơ nói đến việc Ba-la-am từng tìm kiếm các dấu hiệu bói toán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Giữ nghĩa cơ bản của ראה, đồng thời trong ngữ cảnh từ này cũng hàm ý Ba-la-am nhận ra điều Yahweh ưa thích.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: rằng việc ... là điều tốt đẹp trong mắt Yahweh
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ “tốt đẹp trong mắt”, nghĩa là điều được Yahweh ưa thích hoặc chấp nhận.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: לְבָרֵךְ אֶת יִשְׂרָאֵל
  choice: việc ban phước cho Israel
  rationale: Diễn đạt trực tiếp động từ ברך; cấu trúc danh hóa giúp câu tiếng Việt tự nhiên mà không xác định thêm chủ thể của hành động ngoài điều văn bản nói rõ.
- source_word: כְּפַעַם בְּפַעַם
  choice: như những lần trước
  rationale: Thành ngữ chỉ hành động đã lặp lại trong các lần trước; cách dịch này tự nhiên trong tiếng Việt.
- source_word: לִקְרַאת נְחָשִׁים
  choice: đi tìm điềm báo
  rationale: נְחָשִׁים ở đây chỉ những dấu hiệu dùng trong bói toán, không phải rắn; “đi tìm” truyền đạt mục đích của hành động trong ngữ cảnh.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: quay mặt
  rationale: Diễn đạt thành ngữ chỉ việc chủ ý hướng mình về một phía; “quay mặt” tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: אֶל הַמִּדְבָּר
  choice: về phía hoang mạc
  rationale: מִדְבָּר chỉ vùng đất hoang vu; “về phía” thể hiện rõ hướng nhìn hoặc hướng quay mặt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Văn bản dùng trực tiếp danh giao ước יהוה; giữ dạng Yahweh bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Chủ thể hàm ẩn của לְבָרֵךְ, “ban phước”
  choice: Giữ cấu trúc “việc ban phước cho Israel” mà không thêm chủ thể
  alternative: “Yahweh muốn ban phước cho Israel” hoặc “Ba-la-am chúc phước cho Israel”
  rationale: Cấu trúc Hê-bơ-rơ nêu việc ban phước là điều tốt đẹp trong mắt Yahweh nhưng không biểu thị chủ thể của động từ nguyên mẫu một cách hoàn toàn tường minh; bản dịch tránh giải quyết sự hàm hồ bằng cách thêm một chủ thể.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dùng các từ thông dụng. Giữ thành ngữ “tốt đẹp trong mắt” để bảo tồn hình ảnh của nguyên văn, đồng thời dùng “đi tìm điềm báo” và “quay mặt về phía hoang mạc” để câu rõ ràng đối với độc giả phổ thông.
