  rationale: Bản sửa làm câu tiếng Việt trôi chảy hơn, đặt cụm chỉ sự lặp lại theo đúng phạm vi cú pháp của nguyên văn, và thay thế lựa chọn cước chú không tự nhiên. Cấu trúc “việc ban phước cho Israel” vẫn giữ sự không xác định về chủ thể của động từ nguyên mẫu trong tiếng Hê-bơ-rơ.
