lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: Về Y-sa-ca
  rationale: Tiền tố לְ biểu thị sự liên hệ trong danh sách các thủ lĩnh đại diện cho từng chi phái; “Về Y-sa-ca” vừa tự nhiên vừa không thêm từ “chi phái” vốn không có trong câu Hê-bơ-rơ.
- source_word: נְתַנְאֵל
  choice: Nê-tha-nê-ên
  rationale: Tên riêng được phiên âm theo cách gọi Kinh Thánh quen thuộc trong tiếng Việt, thay vì dịch nghĩa tên.
- source_word: בֶּן
  choice: con trai
  rationale: Trong công thức xác định gia hệ này, בֶּן chỉ quan hệ cha-con trực tiếp; “con trai” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: צוּעָר
  choice: Xu-a
  rationale: Tên riêng được phiên âm sang tiếng Việt, không dịch nghĩa.
