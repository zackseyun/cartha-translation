revisions:
- from: Con dân Y-sơ-ra-ên phải đóng trại, mỗi người theo trại mình và mỗi người dưới cờ hiệu mình, theo từng đạo quân của họ.
  to: Con dân Y-sơ-ra-ên phải đóng trại, mỗi người theo trại mình và theo cờ hiệu mình, theo các đơn vị của họ.
  rationale: Chỉnh hai cách diễn đạt để phản ánh sát hơn cấu trúc song song của nguyên văn và để tránh thu hẹp nghĩa của các đơn vị được tổ chức thành những “đạo quân” riêng biệt. Không cần chú thích vì các lựa chọn trong bản văn chính đã truyền đạt đầy đủ nghĩa cần thiết.
