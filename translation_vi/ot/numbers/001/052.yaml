translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc lặp “mỗi người ... và mỗi người” cùng sắc thái tổ chức quân sự của câu; dùng “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc.
