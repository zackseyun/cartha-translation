  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: vi
  text: Con dân Y-sơ-ra-ên phải đóng trại, mỗi người theo trại mình và theo cờ hiệu mình, theo các đơn vị của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָנוּ
  choice: phải đóng trại
  rationale: Dạng động từ trong ngữ cảnh chỉ thị mang ý nghĩa quy định cho tương lai. “Phải đóng trại” diễn đạt tự nhiên tính bắt buộc, thay vì chỉ dự báo như “sẽ đóng trại”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Con dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Y-sơ-ra-ên”, nhưng ở đây chỉ tập thể dân Y-sơ-ra-ên. “Con dân Y-sơ-ra-ên” vừa giữ sắc thái nguồn gốc cộng đồng vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: אִישׁ ... וְאִישׁ
  choice: mỗi người ... và mỗi người
  rationale: Giữ nguyên phép lặp có tính phân phối của nguyên văn, nhấn mạnh việc từng người được sắp xếp theo trại và cờ hiệu tương ứng; “người” tự nhiên hơn “người nam” trong câu chỉ cách bố trí toàn dân.
- source_word: עַל מַחֲנֵהוּ
  choice: theo trại mình
  rationale: Giới từ עַל tại đây biểu thị sự quy thuộc hoặc vị trí liên hệ với trại của mỗi người. “Theo trại mình” thể hiện việc được xếp vào trại tương ứng mà không ấn định quá mức quan hệ không gian.
- source_word: דִּגְלוֹ
  choice: dưới cờ hiệu mình
  rationale: דֶּגֶל là cờ hiệu hoặc quân kỳ dùng để nhận diện một đơn vị bộ tộc. “Cờ hiệu” rõ nghĩa và tránh sắc thái quốc kỳ hiện đại của từ “lá cờ”.
- source_word: לְצִבְאֹתָם
  choice: theo từng đạo quân của họ
  rationale: צָבָא mang nghĩa một lực lượng được tổ chức, thường có sắc thái quân sự. “Đạo quân” bảo toàn sắc thái ấy trong bối cảnh kiểm kê và bố trí doanh trại; “từng” làm rõ ý phân chia theo các đơn vị.
