review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng tính chỉ thị của וְחָנוּ, tính phân phối lặp lại của אִישׁ ... וְאִישׁ, và các khái niệm trại, cờ hiệu, đơn vị được tổ chức. Tuy nhiên, “dưới cờ hiệu” thêm sắc thái không gian/hệ thuộc rõ hơn giới từ עַל trong nguyên văn, trong khi vế song song trước dùng “theo trại mình”. “Đạo quân” cũng có thể khiến người đọc hiểu các đơn vị này là những quân đội riêng biệt, hơn là các đơn vị/đội ngũ được tổ chức trong bối cảnh bố trí trại.
  naturalness: “Con dân Y-sơ-ra-ên phải đóng trại” trang trọng và tự nhiên trong văn mạch Kinh Thánh hiện đại. Cần giữ cách diễn đạt song song cho hai vế “trại” và “cờ hiệu”; “theo cờ hiệu mình” làm nổi bật sự song hành và tránh hình dung không gian quá cụ thể của “dưới”. “Các đơn vị của họ” tự nhiên và rõ ràng hơn “từng đạo quân của họ” trong câu này.
  terminology: “Y-sơ-ra-ên” và “cờ hiệu” phù hợp cách dùng Kinh Thánh tiếng Việt hiện đại. “Các đơn vị” diễn đạt צִבְאֹתָם là những nhóm được tổ chức, vẫn phù hợp với bối cảnh quân sự-hành chính mà không áp đặt nghĩa các quân đội độc lập.
  issues:
  - severity: medium
    issue: “dưới cờ hiệu mình” không song hành sát với “theo trại mình” và cụ thể hóa quan hệ không gian.
    rationale: Cả hai vế đều dùng עַל trong cấu trúc song song. “Theo ... mình” ở cả hai vế giữ tính quy thuộc/bố trí mà không xác định quá mức vị trí vật lý.
  - severity: low
    issue: “theo từng đạo quân của họ” có thể quá cụ thể và hơi gượng trong tiếng Việt hiện đại.
    rationale: צָבָא tại đây chỉ các đơn vị/đội ngũ được tổ chức. “Theo các đơn vị của họ” giữ ý phân nhóm và phù hợp với ngữ cảnh sắp xếp doanh trại.
  revised_text: Con dân Y-sơ-ra-ên phải đóng trại, mỗi người theo trại mình và theo cờ hiệu mình, theo các đơn vị của họ.
