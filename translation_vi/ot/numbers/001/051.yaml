- from: Khi Đền Tạm lên đường, người Lê-vi phải tháo dỡ; và khi Đền Tạm dừng trại, người Lê-vi phải dựng lên. Người không có phận sự mà đến gần[a] sẽ bị xử tử.
  to: Khi Đền Tạm lên đường, người Lê-vi phải tháo dỡ Đền Tạm; khi Đền Tạm dừng lại để hạ trại, người Lê-vi phải dựng Đền Tạm lên. Người không có phận sự mà đến gần[a] sẽ bị xử tử.
  rationale: Bản sửa chỉ thay cụm “dừng trại” bằng cách diễn đạt tự nhiên hơn trong tiếng Việt mà vẫn giữ ý “đóng trại” của חנה. Việc nêu lại tân ngữ “Đền Tạm” làm rõ đối tượng của hai hành động. Chú thích được chỉnh để phản ánh chính xác hơn nghĩa chức phận/ủy quyền của זָר và hành động tiếp cận của הַקָּרֵב.
