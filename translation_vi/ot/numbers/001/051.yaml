  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: vi
  text: Khi Đền Tạm lên đường, người Lê-vi phải tháo dỡ Đền Tạm; khi Đền Tạm dừng lại để hạ trại, người Lê-vi phải dựng Đền Tạm lên. Người không có phận sự mà đến gần[a] sẽ bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ngoài” hoặc “người không được phép.” Từ Hê-bơ-rơ ở đây chỉ người không được ủy quyền tiếp cận nơi thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ הַמִּשְׁכָּן
  choice: Khi Đền Tạm lên đường
  rationale: בְּ với động từ nguyên mẫu נסע tạo mệnh đề thời gian. Cách diễn đạt này giữ hình ảnh Đền Tạm cùng đoàn dân bắt đầu di chuyển mà vẫn tự nhiên trong tiếng Việt.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן là nơi ngự thiêng liêng có thể di chuyển; “Đền Tạm” là thuật ngữ quen thuộc, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: phải tháo dỡ
  rationale: Dạng Hiphil của ירד trong ngữ cảnh này chỉ việc hạ xuống và tháo dỡ Đền Tạm để vận chuyển. “Tháo dỡ” diễn đạt đúng hành động thực tế.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Cách gọi tiêu chuẩn trong tiếng Việt dành cho những người thuộc chi tộc Lê-vi, là những người được giao nhiệm vụ đối với Đền Tạm.
- source_word: וּבַחֲנֹת הַמִּשְׁכָּן
  choice: và khi Đền Tạm dừng trại
  rationale: חנה có nghĩa là đóng trại hoặc dừng lại để đóng trại. “Dừng trại” phù hợp với chủ thể Đền Tạm và tạo thế đối xứng tự nhiên với “lên đường”.
- source_word: יָקִימוּ אֹתוֹ
  choice: phải dựng lên
  rationale: Dạng Hiphil của קום ở đây có nghĩa là dựng hoặc thiết lập Đền Tạm tại nơi đóng trại.
- source_word: וְהַזָּר
  choice: Người không có phận sự
  rationale: Trong ngữ cảnh phục vụ nơi thánh, זָר chỉ người không thuộc nhóm được phép thi hành hoặc tiếp cận nhiệm vụ thánh, chứ không nhất thiết là người ngoại quốc.
- source_word: הַקָּרֵב
  choice: mà đến gần
  rationale: Phân từ của קרב diễn tả hành động tiến đến gần khu vực hay công việc thánh; cách dịch giữ nguyên công thức cảnh báo của câu.
- source_word: יוּמָת
  choice: sẽ bị xử tử
  rationale: Dạng Hophal của מות mang nghĩa bị làm cho chết, tức một hình phạt được thi hành, chứ không chỉ là lời báo trước rằng người ấy sẽ chết.
theological_decisions:
- issue: Bản chất hình phạt trong יוּמָת
  choice: “sẽ bị xử tử”, diễn tả hình phạt tử hình ở thể bị động
  alternative: “sẽ chết”, có thể được hiểu đơn thuần là hậu quả
  rationale: Dạng Hophal thường biểu thị cái chết bị gây ra. Cách dịch giữ tính pháp lý và sự nghiêm ngặt về tính thánh mà không xác định tác nhân thi hành là con người hay Đức Chúa Trời.
- issue: Đối tượng được gọi là זָר
  choice: người không có phận sự trong việc phục vụ hoặc tiếp cận nơi thánh
  alternative: người ngoại quốc về sắc tộc, hoặc mọi người không thuộc chi tộc Lê-vi
  rationale: Trong văn cảnh tư tế và Đền Tạm, זָר thường chỉ người ở ngoài vai trò thánh được chuẩn nhận. Cách dịch không biến quy định chức phận thành sự phân biệt sắc tộc và cũng không thu hẹp quá mức khi chính câu không giải thích thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Hai vế “lên đường—dừng trại” và “tháo dỡ—dựng lên” được giữ cân xứng. “Phải” thể hiện lực quy định của văn cảnh; “sẽ bị xử tử” bảo toàn thể bị động của động từ Hê-bơ-rơ.
