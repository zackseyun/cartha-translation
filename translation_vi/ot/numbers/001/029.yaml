translation:
  language: vi
  text: Số người được kiểm kê thuộc bộ tộc Y-sa-ca là 54.400 người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “số người của họ” hoặc “những người được đăng ký”. Thuật ngữ Hê-bơ-rơ dùng trong cuộc kiểm kê chỉ những người đã được ghi danh và đếm.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: Số người được kiểm kê
  rationale: Từ ngữ bắt nguồn từ פקד, trong công thức kiểm kê dân số, chỉ những người đã được ghi nhận và đếm. Cách dịch này tự nhiên trong tiếng Việt, giữ rõ ý kiểm kê và phù hợp với hậu tố số nhiều ngôi thứ ba.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Giới từ לְ đi với מַטֶּה trong công thức này biểu thị sự quy thuộc bộ tộc; “thuộc bộ tộc” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: יִשָּׂשכָר
  choice: Y-sa-ca
  rationale: Tên riêng được phiên âm theo lối quen dùng, dễ đọc trong tiếng Việt.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '54.400'
  rationale: Giữ nguyên chính xác số lượng 54.400 và trình bày theo quy ước viết số hiện đại của tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm kê” để giữ bối cảnh điều tra dân số; thêm “người” sau con số nhằm diễn đạt tự nhiên trong tiếng Việt mà không xác định thêm giới tính ngoài công thức của câu.
