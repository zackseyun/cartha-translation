  text: וַ/יִּֽהְיוּ֙ כָּל הַ/פְּקֻדִ֔ים שֵׁשׁ מֵא֥וֹת אֶ֖לֶף וּ/שְׁלֹ֣שֶׁת אֲלָפִ֑ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/046.yaml
  text: So all those who were counted were six hundred three thousand five hundred and fifty[a].
translation:
  language: vi
  text: Vậy, tổng số những người được kiểm kê là 603.550 người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người đã được đăng ký” hoặc “những người đã được tập hợp để điểm quân”. Từ Hê-bơ-rơ chỉ những người được ghi danh trong cuộc kiểm kê dân số.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Vậy, ... là
  rationale: Dạng kể tiếp của היה vừa tiếp nối mạch văn vừa tổng kết kết quả kiểm kê; “Vậy” diễn đạt tự nhiên sắc thái kết quả trong tiếng Việt.
- source_word: כָּל הַפְּקֻדִים
  choice: tổng số những người được kiểm kê
  rationale: כָּל có sức bao quát, còn הַפְּקֻדִים chỉ những người đã được đăng ký và đếm trong cuộc kiểm kê. Cách dịch này rõ nghĩa và không tự ý thêm “nam giới” vào chính câu này.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 603.550 người
  rationale: Chuyển chuỗi số cộng trong tiếng Hê-bơ-rơ thành cách ghi số tự nhiên, rõ ràng trong tiếng Việt hiện đại; danh từ chỉ đơn vị “người” được nhắc lại sau con số để câu dễ hiểu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm kê” để giữ bối cảnh thống kê dân số và tránh thu hẹp nghĩa ngay trong câu thành một thuật ngữ quân sự, dù ngữ cảnh rộng hơn là cuộc kiểm kê những người nam đủ khả năng ra trận.
