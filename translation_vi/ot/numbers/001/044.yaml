  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: vi
  text: Đây là những người được Môi-se, A-rôn và các thủ lĩnh Y-sơ-ra-ên kiểm đếm[a]. Các thủ lĩnh ấy gồm mười hai người, mỗi người đại diện cho nhà tổ phụ mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người được ghi danh.” Từ Hê-bơ-rơ có thể nhấn mạnh những người được đếm hoặc việc ghi danh họ trong cuộc điều tra dân số.'
    reason: lexical_alternative
  - marker: b
    text: “Nhà tổ phụ” chỉ đơn vị đại gia đình hoặc thị tộc được xác định theo dòng cha trong cơ cấu các chi phái của Y-sơ-ra-ên.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים / פָּקַד
  choice: những người được… kiểm đếm
  rationale: Trong bối cảnh cuộc kiểm tra dân số ở Dân Số 1, các từ thuộc gốc פקד chỉ những người được đếm và việc tiến hành kiểm đếm. Cách dịch này giữ đối tượng là con người và diễn đạt rõ hành động.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: các thủ lĩnh Y-sơ-ra-ên
  rationale: נָשִׂיא ở đây là người đứng đầu các chi phái; “thủ lĩnh” chính xác và không gợi ý tước vị hoàng gia như “hoàng tử”.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: mười hai người
  rationale: Ngữ cảnh đã xác định đây là các thủ lĩnh nam; tiếng Việt thường dùng “người” sau số đếm một cách tự nhiên mà không xóa bỏ thông tin ngữ cảnh.
- source_word: אִישׁ אֶחָד
  choice: mỗi người
  rationale: Diễn đạt tự nhiên ý phân phối “mỗi bên một người” của cụm Hê-bơ-rơ.
- source_word: לְבֵית אֲבֹתָיו
  choice: mỗi người đại diện cho một gia tộc phụ hệ
  rationale: Giới từ לְ biểu thị mối liên hệ đại diện trong ngữ cảnh, còn בֵּית אָבוֹת là đơn vị thân tộc được xác định theo dòng cha; cách dịch tránh hiểu lầm là một căn nhà theo nghĩa vật chất.
- source_word: הָיוּ
  choice: gồm
  rationale: Dùng “gồm” để chuyển tải hệ từ số nhiều một cách tự nhiên khi xác định thành phần của nhóm thủ lĩnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tách thành hai câu để làm rõ rằng “mười hai người” chỉ các thủ lĩnh, đồng thời vẫn phản ánh cấu trúc và hệ từ của nguyên văn.
