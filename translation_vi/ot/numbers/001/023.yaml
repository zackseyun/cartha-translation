translation:
  language: vi
  text: Số người được kiểm kê thuộc bộ tộc Si-mê-ôn là năm mươi chín nghìn ba trăm người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được kiểm kê
  rationale: Dạng từ mang nghĩa những người đã được đếm hoặc ghi nhận trong cuộc kiểm kê. Cách dịch này tự nhiên trong tiếng Việt, giữ rõ bối cảnh kiểm kê dân số và phản ánh hậu tố số nhiều qua kết cấu chỉ tập thể.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Trong công thức kiểm kê này, giới từ לְ cùng מַטֶּה chỉ sự trực thuộc bộ tộc. “Thuộc bộ tộc” tự nhiên và chính xác trong tiếng Việt.
- source_word: שִׁמְעוֹן
  choice: Si-mê-ôn
  rationale: Dạng phiên âm tiếng Việt rõ ràng, phù hợp với tên bộ tộc và nhân vật trong Kinh Thánh.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: năm mươi chín nghìn ba trăm
  rationale: Chuyển trật tự số Hê-bơ-rơ sang cách nói số tự nhiên trong tiếng Việt mà vẫn giữ nguyên tổng số 59.300.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm kê” để phù hợp ngữ cảnh cuộc kiểm tra, ghi danh dân số trong Dân Số Ký; thêm “người” ở cuối số lượng để câu tiếng Việt đầy đủ, không nhằm bổ sung một phân loại thần học hay giới tính ngoài ngữ cảnh.
