  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: vi
  text: 'Con cháu Ma-na-se, theo dòng dõi họ, theo các thị tộc họ, theo nhà cha ông họ, theo số tên từng người, từ hai mươi tuổi trở lên, tất cả nam giới có thể ra quân[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả nam giới ra trận.” Thành ngữ Hê-bơ-rơ chỉ những người đủ điều kiện phục vụ quân sự.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: Con cháu Ma-na-se
  rationale: Trong công thức kiểm kê này, לִבְנֵי nêu đầu mục chi phái. “Con cháu” truyền đạt tự nhiên ý nghĩa tập thể của בנים trong tiếng Việt mà không giới hạn vào các con trai trực hệ.
- source_word: תּוֹלְדֹתָם
  choice: theo gia phả
  rationale: Ở đây תּוֹלְדֹת nói đến dòng dõi được ghi nhận theo quan hệ sinh thành; “gia phả” phù hợp với ngữ cảnh kiểm kê và phân loại theo huyết thống.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: מִשְׁפָּחָה trong cơ cấu chi phái chỉ đơn vị thân tộc rộng hơn gia đình hạt nhân; “thị tộc” phân biệt rõ với “gia tộc cha ông” kế tiếp.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc cha ông của họ
  rationale: Cách dịch này giữ nét phụ hệ của thành ngữ Hê-bơ-rơ nhưng vẫn tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: được đếm tên từng người
  rationale: Cụm từ diễn tả việc kiểm đếm các cá nhân theo tên; cách diễn đạt này tự nhiên hơn lối dịch sát chữ “theo số các tên”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách diễn đạt tiếng Việt hiện đại, chính xác cho ngưỡng tuổi trong nguyên văn.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tất cả những người nam có thể ra quân
  rationale: Trong ngữ cảnh kiểm kê quân sự, cụm này chỉ những người nam đủ điều kiện tham gia lực lượng chiến đấu. “Có thể ra quân” truyền đạt tư cách phục vụ mà không buộc câu phải có nghĩa họ đang thực sự xuất quân.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính trong cuộc kiểm kê
  choice: những người nam có thể ra quân
  alternative: mọi người có thể ra quân
  rationale: Bối cảnh là cuộc kiểm kê nam giới từ hai mươi tuổi trở lên để phục vụ quân sự; nêu rõ “người nam” giữ đúng phạm vi quy chiếu của ngữ cảnh và hình thái giống đực trong tiếng Hê-bơ-rơ.
- issue: Sắc thái của יֹצֵא צָבָא
  choice: có thể ra quân
  alternative: ra trận
  rationale: צָבָא có thể gợi quân đội, chiến trận hoặc nghĩa vụ quân sự. Trong công thức kiểm kê, cách dịch được chọn nhấn mạnh điều kiện phục vụ, còn chú thích bảo lưu khả năng hiểu trực tiếp là “ra trận”.
translation_notes:
  register: 'Văn phong trang trọng, rõ ràng và hiện đại. Câu giữ cấu trúc liệt kê của công thức kiểm kê Hê-bơ-rơ, đồng thời dùng các thuật ngữ phân tầng thân tộc dễ phân biệt: “gia phả,” “thị tộc,” và “gia tộc cha ông.”'
