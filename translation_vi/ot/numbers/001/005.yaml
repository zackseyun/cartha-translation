  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: vi
  text: 'Đây là tên của những người đàn ông sẽ đứng cùng các ngươi: về phía chi tộc Ru-bên[a] là Ê-li-xua, con trai Sê-đêu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ Ru-bên” hay “thuộc chi tộc Ru-bên.” Giới từ Hê-bơ-rơ có thể chỉ sự thuộc về chi tộc hoặc vai trò đại diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה שְׁמוֹת
  choice: Đây là tên
  rationale: Công thức giới thiệu danh sách được diễn đạt tự nhiên trong tiếng Việt; liên từ וְ nối tiếp mạch văn nhưng không nhất thiết phải dịch thành “và” ở đầu câu.
- source_word: הָאֲנָשִׁים
  choice: những người
  rationale: Trong ngữ cảnh, từ này chỉ các nam đại diện được nêu tên; “những người” là cách nói tự nhiên, và danh tính nam giới được thể hiện rõ qua danh sách.
- source_word: יַעַמְדוּ אִתְּכֶם
  choice: sẽ đứng cùng các ngươi
  rationale: Giữ hình ảnh sát nguyên văn của động từ עמד và giới từ “cùng”; “các ngươi” phản ánh đại từ số nhiều, hướng đến Môi-se và A-rôn trong ngữ cảnh.
- source_word: לִרְאוּבֵן
  choice: đại diện cho Ru-bên
  rationale: Giới từ לְ ở đây đánh dấu mối liên hệ với chi tộc hoặc vai trò đại diện; bản dịch chính làm rõ chức năng trong cuộc kiểm kê nhưng ghi chú vẫn bảo tồn khả năng dịch sát hơn.
- source_word: אֱלִיצוּר
  choice: Ê-li-xua
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp công thức phụ hệ của nguyên văn.
- source_word: שְׁדֵיאוּר
  choice: Sê-đêu
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo âm đọc gần nguồn và phù hợp âm tiết tiếng Việt.
