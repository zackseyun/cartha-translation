source:
  edition: WLC
  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: vi
  text: 'Con cháu Gát[a], theo dòng dõi, theo thị tộc[b], theo nhà tổ phụ của họ, được kiểm kê từng người theo tên, từ hai mươi tuổi trở lên, tất cả những người ra quân[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Gát”; trong cuộc kiểm kê này, cụm từ chỉ những thành viên nam thuộc bộ tộc Gát.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “theo các gia tộc”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “mọi người ra quân”; cũng có thể hiểu là “mọi người tham gia quân ngũ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: Con cháu Gát
  rationale: Cụm Hê-bơ-rơ theo sát mặt chữ là “các con trai của Gát”, nhưng trong công thức kiểm kê này chỉ các thành viên nam thuộc bộ tộc Gát. “Con cháu Gát” tự nhiên trong tiếng Việt và diễn đạt đúng quan hệ dòng tộc; chú thích giữ lại hình thức nguyên văn.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: Từ này chỉ sự phân loại theo nguồn gốc và các thế hệ; “dòng dõi” giữ được ý nghĩa gia hệ mà không mặc nhiên biến nó thành hồ sơ thành văn.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: “Thị tộc” diễn tả một đơn vị thân tộc nằm trong bộ tộc rõ hơn “gia đình”, vốn dễ bị hiểu là gia đình hạt nhân hiện đại.
- source_word: לְבֵית אֲבֹתָם
  choice: theo nhà tổ phụ của họ
  rationale: Giữ cấu trúc phụ hệ của thuật ngữ kỹ thuật Hê-bơ-rơ, đồng thời “tổ phụ” tự nhiên và rõ nghĩa hơn cách dịch sát chữ “nhà các cha”.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: được kiểm kê từng người theo tên
  rationale: Cụm từ nói đến việc đếm các cá nhân bằng tên. Cách diễn đạt này truyền đạt chức năng kiểm kê rõ ràng hơn lối dịch cứng “theo số các tên”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách nói tiếng Việt tự nhiên cho ngưỡng tuổi trong công thức kiểm kê, không cần sao chép thành ngữ Hê-bơ-rơ “từ một con trai hai mươi năm”.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tất cả những người ra quân
  rationale: “Ra quân” giữ hình ảnh động của nguyên ngữ và có thể chỉ việc tham gia chiến trận hoặc quân ngũ, không thêm ý “có khả năng” vốn chỉ được hàm ý trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu được giữ ở dạng liệt kê chưa hoàn tất với dấu hai chấm, phù hợp cấu trúc của câu Hê-bơ-rơ và phần tiếp nối ở câu kế tiếp. Các thuật ngữ “dòng dõi”, “thị tộc” và “nhà tổ phụ” được dùng để duy trì các cấp phân loại thân tộc khác nhau trong nguyên văn.
