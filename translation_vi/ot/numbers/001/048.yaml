base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/048.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Bấy giờ, Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng danh “YHWH”; theo truyền thống thường được dịch là “CHÚA”.
    reason: Nêu rõ dạng nguyên văn và cách dịch truyền thống của danh Đức Chúa Trời.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ, ... phán
  rationale: Dạng wayyiqtol tiếp nối diễn tiến của câu chuyện; “Bấy giờ” thể hiện trình tự tự nhiên trong tiếng Việt, còn “phán” phù hợp với lời Đức Chúa Trời nói mà không làm thay đổi nội dung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời theo bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu động từ nói năng, אֶל đánh dấu người tiếp nhận lời nói; “phán với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Phân từ nguyên mẫu này mở đầu lời nói trực tiếp. “Rằng:” truyền đạt tự nhiên chức năng dẫn lời của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo tồn tư cách danh riêng và tránh thay bằng tước hiệu, đồng thời chú thích cách dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bấy giờ” nối tiếp mạch kể; “phán ... rằng” giữ sắc thái công thức dẫn nhập lời thần phán. Dấu chú thích [a] được đặt ngay sau mệnh đề có danh Yahweh để giải thích danh này.
