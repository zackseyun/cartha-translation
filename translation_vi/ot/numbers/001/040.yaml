  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “thị tộc” và “gia tộc tổ phụ” để phân biệt các cấp đơn vị thân tộc trong công thức kiểm kê; giữ nhịp liệt kê của nguyên văn.
