base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: vi
  text: 'Về con cháu A-se: theo dòng dõi, theo thị tộc, theo nhà tổ phụ, theo số tên, từ hai mươi tuổi trở lên, mọi người đi ra chiến trận.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ, sát nghĩa: “mọi người đi ra chiến trận”; đây là một thành ngữ chỉ những người thuộc diện phục vụ quân đội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: Con cháu A-se
  rationale: Trong tiêu đề thống kê bộ tộc, cụm này chỉ các hậu duệ thuộc bộ tộc A-se. “Con cháu” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ ý quan hệ huyết thống.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: Từ này chỉ các tuyến phả hệ hoặc sự phân chia theo nguồn gốc; “dòng dõi” phù hợp ngữ cảnh kiểm kê dân số mà không mặc nhiên cho rằng đây là hồ sơ thành văn.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc dưới cấp bộ tộc; “thị tộc” phân biệt rõ hơn với gia đình theo nghĩa hẹp.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc tổ phụ
  rationale: Cách dịch này truyền đạt cơ cấu thân tộc phụ hệ của thành ngữ Hê-bơ-rơ, đồng thời tự nhiên hơn lối dịch sát chữ “nhà cha ông” trong tiếng Việt.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: theo số tên
  rationale: Giữ hình ảnh nguyên ngữ về việc đếm từng người theo tên trong công tác kiểm kê.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách diễn đạt tự nhiên và chính xác ngưỡng tuổi trong tiếng Việt hiện đại.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tất cả những người ra trận
  rationale: Giữ thành ngữ Hê-bơ-rơ “ra trận”; ngữ cảnh kiểm kê cho thấy cụm này nói đến những người thuộc diện phục vụ quân đội.
