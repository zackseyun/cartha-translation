  text: מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛/ם לְ/צִבְאֹתָ֖/ם אַתָּ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: vi
  text: Từ hai mươi tuổi trở lên, mọi người nam trong Y-sơ-ra-ên có thể ra trận[a], con và A-rôn hãy kiểm đếm họ theo các đơn vị quân đội của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “đi ra trận.” Cụm từ Hê-bơ-rơ là một thành ngữ quân sự chỉ người đủ điều kiện phục vụ; ngữ cảnh chương này xác định đó là nam giới.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “theo các đạo quân của họ” hoặc “theo các đơn vị quân sự của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: Từ hai mươi tuổi trở lên
  rationale: Diễn đạt tự nhiên ngưỡng tuổi tối thiểu mà thành ngữ Hê-bơ-rơ xác định.
- source_word: כָּל יֹצֵא צָבָא
  choice: tất cả người nam ... có thể ra trận
  rationale: Đây là thành ngữ quân sự chỉ những người đủ điều kiện phục vụ; ngữ cảnh cuộc kiểm kê trong chương này xác định họ là nam giới.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Y-sơ-ra-ên
  rationale: Giữ nghĩa trực tiếp, chỉ cộng đồng dân tộc Y-sơ-ra-ên.
- source_word: תִּפְקְדוּ אֹתָם
  choice: phải kiểm đếm họ
  rationale: Trong bối cảnh kiểm kê để phục vụ quân đội, פקד mang nghĩa đăng ký và đếm; “kiểm đếm” thể hiện rõ hành động chính thức này.
- source_word: לְצִבְאֹתָם
  choice: theo từng đơn vị quân đội
  rationale: Cụm từ chỉ việc tổ chức những người được kiểm đếm theo các đơn vị phục vụ quân sự; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: אַתָּה וְאַהֲרֹן
  choice: con và A-rôn
  rationale: Giữ chủ thể được nhấn mạnh trong nguyên văn; “con” là đại từ trực tiếp tự nhiên trong lời Đức Chúa Trời phán với Môi-se, còn A-rôn được nêu đích danh.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính trong điều kiện phục vụ quân sự
  choice: tất cả người nam ... có thể ra trận
  alternative: tất cả những người ra trận
  rationale: Ngữ cảnh của chương xác định cuộc kiểm kê này dành cho nam giới đủ điều kiện phục vụ quân sự; vì vậy cần thể hiện giới tính thay vì làm cho câu mang nghĩa trung tính.
- issue: Sắc thái của thành ngữ יֹצֵא צָבָא
  choice: có thể ra trận
  alternative: đi ra trận
  rationale: Cách dịch đã chọn truyền đạt ý đủ điều kiện phục vụ quân sự mà không khẳng định rằng mọi người được kiểm đếm đều đang thực sự tham chiến; chú thích vẫn bảo lưu hình ảnh sát chữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “kiểm đếm” cho hoạt động kiểm kê chính thức và “đơn vị quân đội” để tránh từ cổ; đặt các dấu chú thích ngay sau những cụm từ tương ứng.
