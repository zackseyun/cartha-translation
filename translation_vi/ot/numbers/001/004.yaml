  to: Cùng với các ngươi sẽ có một người từ mỗi chi tộc, mỗi người là người đứng đầu nhà tổ phụ mình.[a]
  rationale: 'Sửa câu để giữ rõ hơn trật tự và các thành tố của tiếng Hê-bơ-rơ: sự hiện diện “cùng với các ngươi,” một người từ mỗi chi tộc, và chức năng của người ấy là đứng đầu “nhà tổ phụ” của mình. Chú thích được chỉnh để dùng số ít phù hợp với “mình” và phân biệt cách dịch sát với cách diễn đạt thông dụng hơn.'
