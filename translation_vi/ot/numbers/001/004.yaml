  yaml_path: translation/ot/numbers/001/004.yaml
  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: vi
  text: Cùng với các ngươi sẽ có một người từ mỗi chi tộc, mỗi người là người đứng đầu nhà tổ phụ mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người đứng đầu gia tộc mình.” Cụm từ Hê-bơ-rơ theo sát nghĩa là “đầu của nhà tổ phụ mình”, chỉ người nam lãnh đạo đại diện cho một hộ tộc hoặc nhóm thân tộc theo dòng cha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִתְּ/כֶם
  choice: Cùng với các ngươi
  rationale: Diễn đạt tự nhiên việc những người này sẽ cùng tham gia với Môi-se và A-rôn; đại từ số nhiều phù hợp với ngữ cảnh.
- source_word: יִהְיוּ
  choice: phải có
  rationale: Thể chưa hoàn thành ở đây mang sắc thái chỉ thị trong bối cảnh truyền lệnh; “phải có” vừa tự nhiên vừa thể hiện yêu cầu về sự hiện diện.
- source_word: אִישׁ אִישׁ לַ/מַּטֶּה
  choice: mỗi chi tộc phải có một người
  rationale: Lối lặp אִישׁ אִישׁ có nghĩa phân phối, tức mỗi chi tộc có một đại diện; đảo trật tự nhẹ để tiếng Việt rõ và tự nhiên.
- source_word: מַטֶּה
  choice: chi tộc
  rationale: Trong bối cảnh kiểm kê và tổ chức dân Y-sơ-ra-ên, từ này chỉ đơn vị bộ tộc, không phải cây gậy.
- source_word: אִישׁ רֹאשׁ
  choice: người ấy phải là người đứng đầu
  rationale: Giữ hình ảnh “đầu” của tiếng Hê-bơ-rơ bằng cách diễn đạt thông dụng “người đứng đầu”, đồng thời thể hiện quan hệ đồng vị.
- source_word: לְבֵית אֲבֹתָיו
  choice: gia tộc mình
  rationale: Cụm từ chỉ đơn vị thân tộc theo dòng cha, rộng hơn một hộ gia đình hạt nhân; “gia tộc” truyền đạt cơ cấu xã hội này tự nhiên trong tiếng Việt.
- source_word: הוּא
  choice: người ấy
  rationale: Đại từ độc lập có tác dụng nhấn mạnh hoặc nối lại chủ thể; dịch rõ thành “người ấy” phù hợp cú pháp tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ sắc thái lời phán trực tiếp với hai người trong ngữ cảnh; dùng “chi tộc” và “gia tộc” để phân biệt đơn vị bộ tộc với nhóm thân tộc theo dòng cha.
