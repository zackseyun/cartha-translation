review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: một đại diện của mỗi chi tộc sẽ ở cùng Môi-se và A-rôn, và người ấy là người đứng đầu đơn vị thân tộc theo dòng cha. Tuy nhiên, “gia tộc mình” làm mờ cụm từ cụ thể לְבֵית אֲבֹתָיו (“nhà tổ phụ mình”), vốn là một đơn vị xã hội-gia phả quan trọng trong bản gốc. “Sẽ có” phản ánh trực tiếp hơn hình thức vị lai/chỉ thị יִהְיוּ mà không thêm sắc thái mệnh lệnh mạnh của “phải có.”'
  naturalness: Câu sửa vẫn tự nhiên, trang trọng và rõ ràng trong tiếng Việt hiện đại. Cấu trúc “một người từ mỗi chi tộc, mỗi người là...” tái hiện hợp lý tính phân phối và phần đồng vị của tiếng Hê-bơ-rơ.
  terminology: Giữ “chi tộc” cho מַטֶּה. Dùng “nhà tổ phụ” trong thân văn để bảo toàn thuật ngữ/cơ cấu “nhà của tổ phụ”; chú thích cung cấp cách nói tự nhiên hơn là “gia tộc mình.” “Người đứng đầu” là cách dịch sáng rõ và trung tính cho אִישׁ רֹאשׁ.
  issues:
  - severity: medium
    issue: “gia tộc mình” không phản ánh cụ thể “nhà tổ phụ mình.”
    rationale: לְבֵית אֲבֹתָיו nói đến “nhà [của] tổ phụ” của người đại diện, không chỉ khái niệm chung về gia tộc. Nên giữ thuật ngữ này trong thân văn và giải thích bằng chú thích.
  - severity: low
    issue: “phải có” diễn giải sắc thái mệnh lệnh mạnh hơn cần thiết.
    rationale: יִהְיוּ là hình thức chưa hoàn thành, trong ngữ cảnh nêu những người sẽ cùng hiện diện. “Sẽ có” bảo toàn cách diễn đạt của nguồn và vẫn phù hợp văn cảnh chỉ thị.
  revised_text: Cùng với các ngươi sẽ có một người từ mỗi chi tộc, mỗi người là người đứng đầu nhà tổ phụ mình.[a]
