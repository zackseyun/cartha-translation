  choice: A-bi-đan
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách viết dễ đọc và quen thuộc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Từ בֶּן chỉ quan hệ cha con; “con trai” rõ nghĩa và tự nhiên trong công thức nêu tên người.
- source_word: גִּדְעֹנִי
  choice: Ghi-đê-ô-ni
  rationale: Phiên âm tên riêng Hê-bơ-rơ, giữ đủ các âm tiết chính và phù hợp cách ghi tên Kinh Thánh bằng tiếng Việt.
