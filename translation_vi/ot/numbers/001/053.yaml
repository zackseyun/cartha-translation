  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: vi
  text: Nhưng người Lê-vi phải đóng trại chung quanh Đền Tạm của Chứng Ước, để cơn thịnh nộ không giáng trên cộng đồng dân Y-sơ-ra-ên; người Lê-vi phải đảm trách việc canh giữ Đền Tạm của Chứng Ước.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Nhưng người Lê-vi
  rationale: Liên từ nối tương phản với cách bố trí các chi phái khác ở câu trước; “nhưng” diễn đạt tự nhiên mạch văn ấy.
- source_word: יַחֲנוּ סָבִיב
  choice: phải đóng trại chung quanh
  rationale: Thể vị hoàn ở đây mang lực chỉ thị; “phải” thể hiện nghĩa vụ, còn “chung quanh” giữ nguyên ý không gian.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Đền Tạm Chứng Ước
  rationale: “Đền Tạm” là thuật ngữ Việt ngữ quen thuộc cho nơi ngự tạm thời; “Chứng Ước” giữ ý chứng cứ/chứng thư giao ước của עֵדוּת mà không giản lược thành chính giao ước.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: để cơn thịnh nộ không giáng xuống
  rationale: Diễn đạt quan hệ mục đích/phòng ngừa trong ngữ cảnh; “cơn thịnh nộ” giữ sức nặng phán xét, còn “giáng xuống” kết hợp tự nhiên với giới từ עַל.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: xuống cộng đồng con cái Y-sơ-ra-ên
  rationale: “Cộng đồng” là cách nói hiện đại cho עֵדָה; “con cái Y-sơ-ra-ên” giữ sắc thái hậu duệ tập thể của cụm Hê-bơ-rơ.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: phải canh giữ
  rationale: Cấu trúc cùng gốc nhấn mạnh trách nhiệm bảo vệ được giao; tiếng Việt tự nhiên có thể gói cả hành động lẫn nhiệm vụ trong “canh giữ”.
theological_decisions:
- issue: Bản chất của קֶצֶף trong bối cảnh thánh sở
  choice: cơn thịnh nộ, ngầm hiểu là sự phán xét của Đức Chúa Trời
  alternative: cơn giận nói chung hoặc sự bất bình của con người
  rationale: Bối cảnh bảo vệ ranh giới thánh trong Dân Số Ký cho thấy nguy cơ là cơn thịnh nộ giáng trên cộng đồng; bản dịch giữ sức nặng này nhưng không thêm chủ thể vốn không được nêu trực tiếp.
- issue: Ý nghĩa của הָעֵדֻת
  choice: Chứng Ước
  alternative: chứng cớ; bảng chứng; giao ước
  rationale: Từ này chỉ lời/chứng thư làm chứng cho giao ước, có thể đặc biệt liên hệ đến các bảng đá. “Chứng Ước” bảo tồn mối liên hệ ấy mà không đồng nhất hoàn toàn từ này với “giao ước”.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Cụm từ là danh xưng tập thể chỉ hậu duệ của Y-sơ-ra-ên; cách dịch này giữ hình ảnh huyết thống mà vẫn có thể bao gồm toàn cộng đồng trong ngữ cảnh.
translation_notes:
  register: 'Văn phong trang trọng, hiện đại và dễ đọc. Dùng “Đền Tạm” như thuật ngữ Kinh Thánh quen thuộc; viết hoa “Chứng Ước” vì đây là thành tố trong danh xưng thánh sở. Không thêm chú thích vì bản tiếng Anh cung cấp dường như đặt chú thích sai vị trí: phương án “against the congregation of the Israelites” thuộc cụm עַל עֲדַת בְּנֵי יִשְׂרָאֵל, không thuộc “tabernacle of the testimony.”'
