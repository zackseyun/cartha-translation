  text: לִ/בְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: vi
  text: 'Về con cháu Giu-đa: theo dòng dõi, theo thị tộc, theo gia tộc bên cha, căn cứ vào số tên, từ hai mươi tuổi trở lên, mọi nam giới ra trận[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi nam giới ra quân.” Thành ngữ Hê-bơ-rơ trong ngữ cảnh kiểm kê chỉ những nam giới thuộc diện phục vụ quân đội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: Về con cháu Giu-đa
  rationale: בני theo nghĩa đen là “các con trai”, nhưng trong công thức kiểm kê này chỉ các thành viên bộ tộc thuộc dòng dõi Giu-đa. “Con cháu” diễn đạt tự nhiên phạm vi gia hệ trong tiếng Việt, còn “về” nối với cấu trúc danh sách từ câu trước.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: תולדות có thể chỉ các thế hệ, phả hệ hoặc sự truyền nối huyết thống. Trong ngữ cảnh kiểm kê, “dòng dõi” giữ được ý phân loại theo huyết hệ mà không mặc nhiên cho rằng đây là văn bản gia phả.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: משפחה ở đây là một đơn vị xã hội nằm trong bộ tộc và rộng hơn gia đình hạt nhân; “thị tộc” phân biệt tương đối rõ cấp này với gia tộc bên cha.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc bên cha của họ
  rationale: Cụm từ theo nghĩa đen là “theo nhà của các cha họ”, chỉ đơn vị thân tộc phụ hệ. Cách dịch này bảo toàn cấu trúc phụ hệ nhưng tự nhiên hơn lối dịch sát chữ “nhà cha”.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: căn cứ vào số tên
  rationale: Giữ hình ảnh đếm từng người theo tên của nguyên văn, thay vì diễn giải thành “đếm đầu người”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách nói tiếng Việt tự nhiên và chính xác cho ngưỡng tuổi trong công thức kiểm kê.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tất cả những người ra trận
  rationale: Cụm Hê-bơ-rơ theo sát mặt chữ là “mọi người ra quân/ra trận”. Bản dịch giữ cách diễn đạt ấy trong câu chính và giải thích sắc thái đủ điều kiện phục vụ quân đội ở chú thích.
theological_decisions:
- issue: Ngôn ngữ giới tính trong cuộc kiểm kê
  choice: tất cả những người ra trận
  alternative: tất cả nam giới có khả năng ra trận
  rationale: Danh từ và phân từ Hê-bơ-rơ mang dạng giống đực, và ngữ cảnh là cuộc kiểm kê quân sự. Tuy nhiên, nguyên văn không có từ tương ứng trực tiếp với “có khả năng”; vì vậy bản chính không thêm ý ấy, còn chú thích nêu rõ thành ngữ chỉ những người đủ điều kiện phục vụ quân đội.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và có tính công thức phù hợp với danh sách kiểm kê. Dùng “Giu-đa” theo dạng tên quen thuộc trong tiếng Việt; giữ dấu hai chấm vì câu tiếp tục sang số liệu ở câu sau.
