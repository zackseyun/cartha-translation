base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: vi
  text: Vậy, Môi-se và A-rôn đem theo những người này, là những người đã được nêu đích danh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tập hợp
  rationale: Động từ לקח có nghĩa cơ bản là “lấy/đem”; trong ngữ cảnh Môi-se và A-rôn triệu tập các đại diện vừa được nêu tên, “tập hợp” diễn đạt tự nhiên hành động quy tụ họ mà không hàm ý bổ sung về chức vụ.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Môi-se và A-rôn
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt hiện đại.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: những người ... ấy
  rationale: Chỉ đúng các nam đại diện đã được kể tên ngay trước đó; “những người” tự nhiên trong tiếng Việt, còn “ấy” giữ sắc thái xác định của הָאֵלֶּה.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: đã được chỉ đích danh
  rationale: Niphal נִקְּבוּ cùng בְּשֵׁמוֹת diễn tả việc được xác định cụ thể bằng tên. “Được chỉ đích danh” vừa tự nhiên vừa giữ ý nhận diện chính xác từng người.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Dùng “Vậy” để nối tiếp mệnh lệnh ở câu trước; tránh dịch máy móc וַיִּקַּח thành “lấy những người,” vốn không tự nhiên và dễ gây hiểu sai trong tiếng Việt.
