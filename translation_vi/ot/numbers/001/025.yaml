  text: Those counted from the tribe of Gad were forty-five thousand six hundred fifty.
translation:
  language: vi
  text: Số người được kiểm đếm thuộc bộ tộc Gát là 45.650 người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: Số người được kiểm đếm
  rationale: Diễn đạt tự nhiên ý của danh từ thụ động chỉ những người đã được thống kê trong cuộc kiểm đếm; thêm “người” để câu tiếng Việt rõ nghĩa.
- source_word: לְמַטֵּה גָד
  choice: thuộc bộ tộc Gát
  rationale: Giữ nghĩa quan hệ của לְ và dùng cách gọi hiện đại, dễ hiểu cho מַטֶּה trong ngữ cảnh tổ chức các bộ tộc Israel.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 45.650 người
  rationale: Chuyển chính xác tổng số 45.650 sang cách ghi số thông dụng trong tiếng Việt; lặp “người” để xác định đơn vị đếm.
