lexical_decisions:
- source_word: לְ/אָשֵׁר
  choice: Từ chi phái A-se
  rationale: Tiền tố לְ trong danh sách các thủ lĩnh biểu thị sự thuộc về chi phái; thêm “chi phái” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: פַּגְעִיאֵל
  choice: Pha-ghi-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang dạng dễ đọc đối với độc giả Việt, không dịch nghĩa tên.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ cha-con trong công thức xác định gia phả.
- source_word: עָכְרָן
  choice: Óc-ran
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt; phụ âm đầu ע không có âm tương ứng trực tiếp nên được thể hiện theo lối đọc tên Kinh Thánh quen thuộc.
