  yaml_path: translation/ot/numbers/001/031.yaml
  text: Those registered from the tribe of Zebulun were 57,400.
translation:
  language: vi
  text: Số người được kiểm kê thuộc bộ tộc Sa-bu-lôn là 57.400.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được kiểm kê
  rationale: Cụm từ bắt nguồn từ פקד, trong ngữ cảnh cuộc kiểm kê chỉ những người đã được đếm và ghi nhận. Cách dịch này tự nhiên trong tiếng Việt hiện đại và không nhấn mạnh quá mức sắc thái quân sự.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Giới từ לְ đi với מַטֶּה trong công thức kiểm kê này biểu thị sự quy thuộc về bộ tộc; “thuộc bộ tộc” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: זְבוּלֻן
  choice: Sa-bu-lôn
  rationale: Phiên âm tên bộ tộc theo lối viết tiếng Việt dễ đọc, thay vì dịch nghĩa tên riêng.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '57.400'
  rationale: Chuỗi số Hê-bơ-rơ có tổng chính xác là năm mươi bảy nghìn bốn trăm; dùng chữ số giúp câu ngắn gọn, rõ ràng theo cách trình bày số trong tiếng Việt.
theological_decisions: []
