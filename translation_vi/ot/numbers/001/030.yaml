  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: vi
  text: 'Về con cháu Sa-bu-lôn, theo dòng dõi, thị tộc và nhà tổ phụ của họ, căn cứ vào số tên từng người, tất cả nam giới từ hai mươi tuổi trở lên có thể ra trận[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đủ điều kiện phục vụ quân đội.” Thành ngữ Hê-bơ-rơ dịch sát là “ra quân” hoặc “đi ra chiến trận.”'
    reason: Nêu nghĩa chức năng khả dĩ và diễn đạt sát thành ngữ quân sự của nguyên văn, không hàm ý sai rằng người ấy “đi ra trong” một đạo quân.
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: Về con cháu Sa-bu-lôn
  rationale: Tiền tố לְ mở đầu mục kiểm kê của bộ tộc; “về” phù hợp với cấu trúc đề mục, còn “con cháu” diễn đạt phạm vi hậu duệ trong cuộc kiểm kê. “Sa-bu-lôn” là dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: Trong văn cảnh kiểm kê, từ này chỉ sự phân loại theo nguồn gốc huyết thống; “dòng dõi” tự nhiên hơn lối dịch sát “các thế hệ” mà vẫn giữ ý phả hệ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo ... thị tộc ... của họ
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc thuộc bộ tộc, rộng hơn gia đình hạt nhân; “thị tộc” giữ được tính kỹ thuật của cuộc kiểm kê.
- source_word: לְבֵית אֲבֹתָם
  choice: theo ... nhà tổ phụ của họ
  rationale: Giữ hình ảnh và thuật ngữ thân tộc phụ hệ của nguyên văn, đồng thời phân biệt với “thị tộc” ở vế trước.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: căn cứ vào số tên từng người
  rationale: Diễn đạt việc đếm từng cá nhân theo tên, không giản lược thành một cách diễn giải như “kiểm đếm đầu người”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách nói tự nhiên và chính xác trong tiếng Việt cho ngưỡng tuổi của nguyên văn.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tất cả nam giới ... có thể ra trận
  rationale: “Nam giới” làm rõ phạm vi nam giới vốn được biểu thị trong công thức kiểm kê, còn “có thể ra trận” truyền đạt chức năng quân sự của thành ngữ mà không biến nó thành thuật ngữ hành chính hiện đại.
theological_decisions:
- issue: Phạm vi giới tính của cuộc kiểm kê quân sự
  choice: tất cả nam giới ... có thể ra trận
  alternative: tất cả những người ... có thể ra trận
  rationale: Công thức Hê-bơ-rơ trong văn cảnh nói đến nam giới thuộc độ tuổi phục vụ quân sự. Bản dịch giữ phạm vi ấy thay vì trung tính hóa giới tính.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc; giữ nhịp liệt kê hành chính của đoạn kiểm kê nhưng gộp các thành phần song song vừa đủ để câu tiếng Việt tự nhiên. Dấu hai chấm được giữ vì câu này dẫn sang con số kiểm kê ở câu kế tiếp.
