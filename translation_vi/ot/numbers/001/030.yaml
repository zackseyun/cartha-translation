    rationale: “Đi ra trong đạo quân” gợi ý vị trí ở bên trong một đạo quân. יֹצֵא צָבָא là thành ngữ chỉ người ra quân/ra chiến trận, trong ngữ cảnh là người đủ điều kiện phục vụ quân sự.
