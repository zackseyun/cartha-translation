  text: 'for Simeon: Shelumiel son of Zurishaddai;'
translation:
  language: vi
  text: 'cho Si-mê-ôn: Sê-lu-mi-ên, con trai Xu-ri-sa-đai;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: cho Si-mê-ôn
  rationale: Tiền tố לְ trong danh sách này đánh dấu chi tộc mà người được nêu tên đại diện. “Cho Si-mê-ôn” giữ cấu trúc cô đọng của nguyên văn; “Si-mê-ôn” là dạng tên quen dùng trong tiếng Việt.
- source_word: שְׁלֻמִיאֵל
  choice: Sê-lu-mi-ên
  rationale: Tên riêng được phiên âm chứ không dịch nghĩa; dạng này bám theo âm Hebrew và phù hợp cách phiên âm tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Trong công thức xác định gia hệ này, בֶּן chỉ trực tiếp quan hệ cha–con; “con trai” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: צוּרִישַׁדָּי
  choice: Xu-ri-sa-đai
  rationale: Tên riêng được phiên âm chứ không dịch nghĩa; “Xu-ri-sa-đai” phản ánh gần đúng các thành tố âm của tên Hebrew trong lối ghi tên Kinh Thánh bằng tiếng Việt.
