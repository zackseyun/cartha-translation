  terminology: Dùng “được kiểm kê”, “gia tộc bên cha”, và “ra trận” là phù hợp. Đổi “con cháu Israel” thành “con trai Israel” để bảo toàn từ ngữ nguồn và sắc thái nam giới trong ngữ cảnh; chú thích nêu phương án “người Israel” cho cách diễn đạt tự nhiên hơn. Chú thích quân sự được chỉnh để không thêm giới từ/ý niệm không có trong tiếng Hê-bơ-rơ.
