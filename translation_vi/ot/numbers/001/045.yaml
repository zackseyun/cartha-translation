  text: וַ/יִּֽהְי֛וּ כָּל פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/045.yaml
  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
translation:
  language: vi
  text: Vậy, toàn thể những người được kiểm kê trong số con trai Israel[a], theo từng gia tộc bên cha của họ, từ hai mươi tuổi trở lên, tức mọi người có thể ra trận trong dân Israel[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Israel”. Tiếng Hê-bơ-rơ viết là “các con trai Israel”; cách gọi này được giữ lại vì cuộc kiểm kê ở đây rõ ràng được tổ chức theo nam giới và nhằm mục đích quân sự.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch là “mọi người đủ điều kiện phục vụ quân đội”. Sát nghĩa: “mọi người ra quân” hoặc “mọi người đi ra chiến trận”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Vậy, ...
  rationale: Động từ dạng wayyiqtol của היה nối tiếp và tổng kết việc kiểm kê ở phần trước; “Vậy” diễn đạt tự nhiên sắc thái kết quả trong ngữ cảnh.
- source_word: כָּל פְּקוּדֵי
  choice: tất cả những người được kiểm kê
  rationale: פקד trong ngữ cảnh này chỉ việc kiểm đếm để lập danh sách quân dịch; cách dịch này giữ sắc thái thụ động/kết quả mà không diễn giải quá mức.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  rationale: Giữ hình ảnh thân tộc của nguyên văn “các con trai/con cái của Israel”; trong câu này phạm vi nam giới đã được làm rõ bởi cuộc kiểm kê quân sự và chú thích.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc bên cha của họ
  rationale: Cụm từ chỉ cách tổ chức dân số theo đơn vị thân tộc phụ hệ; “gia tộc bên cha” rõ nghĩa và tự nhiên hơn lối dịch sát chữ “nhà cha”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Công thức xác định ngưỡng tuổi được chuyển sang cách nói chuẩn, gọn và chính xác trong tiếng Việt.
- source_word: כָּל יֹצֵא צָבָא
  choice: mọi người có thể ra trận
  rationale: Nguyên nghĩa gần sát là “mọi người đi ra [với] quân đội”; trong ngữ cảnh kiểm kê, cụm này chỉ những người đủ khả năng hoặc đủ điều kiện tham chiến, đồng thời vẫn giữ hình ảnh “ra trận”.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Israel
  rationale: Giữ nghĩa tập thể của Israel trong tư cách cộng đồng dân giao ước; “trong Israel” cũng bảo toàn cấu trúc giới từ của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Phạm vi giới tính của בְנֵי יִשְׂרָאֵל trong cuộc kiểm kê quân sự
  choice: Dịch “con cháu Israel” trong chính văn và nêu rõ đối tượng nam giới trong chú thích.
  alternative: “các con trai Israel” hoặc “người Israel”
  rationale: “Con cháu Israel” là cách gọi thân tộc tự nhiên, trang trọng trong tiếng Việt; tuy nhiên, chú thích bảo tồn sự kiện rằng danh từ Hê-bơ-rơ mang hình thức giống đực và cuộc kiểm kê này được xác định theo nam giới có khả năng ra trận.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ dấu phẩy ở cuối vì đây là mệnh đề dẫn sang tổng số trong câu kế tiếp. Các thuật ngữ tránh lối Hán-Việt nặng nề nhưng vẫn bảo tồn bối cảnh kiểm kê quân sự và cơ cấu phụ hệ.
