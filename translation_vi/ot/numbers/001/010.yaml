base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: vi
  text: 'Về các con trai của Giô-sép: về Ép-ra-im, Ê-li-sa-ma, con trai A-mi-hút; về Ma-na-se, Ga-ma-li-ên, con trai Phê-đa-xua.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Trong các con trai của Giô-sép
  rationale: Cụm này mở đầu một nhóm trong danh sách. בְנֵי được giữ theo nghĩa trực tiếp là “các con trai”, còn ל được diễn đạt tự nhiên bằng “trong” để giới thiệu hai nhánh Ép-ra-im và Ma-na-se.
- source_word: לְאֶפְרַיִם
  choice: về Ép-ra-im
  rationale: Giữ cấu trúc phân mục của danh sách mà không thêm từ “chi phái”, vốn không có trong nguyên văn.
- source_word: אֱלִישָׁמָע
  choice: Ê-li-sa-ma
  rationale: Phiên âm tên riêng theo cách đọc tiếng Việt, không dịch nghĩa tên.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ cha con trong cấu trúc tên gọi của danh sách.
- source_word: עַמִּיהוּד
  choice: A-mi-hút
  rationale: Phiên âm tên riêng theo cách đọc tiếng Việt, không dịch nghĩa tên.
- source_word: לִמְנַשֶּׁה
  choice: về Ma-na-se
  rationale: Giữ sự song song với “về Ép-ra-im” và không thêm từ giải thích ngoài nguyên văn.
- source_word: גַּמְלִיאֵל
  choice: Ga-ma-li-ên
  rationale: Phiên âm tên riêng theo cách đọc tiếng Việt, không dịch nghĩa tên.
- source_word: פְּדָהצוּר
  choice: Phê-đa-xua
  rationale: Phiên âm tên riêng theo cách đọc tiếng Việt, không dịch nghĩa tên.
