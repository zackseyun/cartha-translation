translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; dùng các thuật ngữ thân tộc “dòng dõi”, “thị tộc”, “gia tộc tổ tiên” để làm rõ ba cấp phân loại. Cấu trúc được giữ như một công thức kiểm kê dẫn sang con số ở câu tiếp theo.
