  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: vi
  text: 'Con cháu Ru-bên, con đầu lòng của Y-sơ-ra-ên, được kiểm đếm theo dòng dõi, theo thị tộc, theo nhà cha ông của họ, theo số tên, từng người một[a]—tất cả nam giới từ hai mươi tuổi trở lên, những người ra quân—gồm có:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “theo từng sọ của họ”; đây là một thành ngữ chỉ việc mỗi người được kiểm đếm riêng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: gồm có
  rationale: Động từ mở đầu công thức thống kê và hướng đến con số ở câu kế tiếp; đặt “gồm có” cuối mệnh đề trước dấu hai chấm tạo câu tiếng Việt tự nhiên mà vẫn giữ chức năng của động từ.
- source_word: בְנֵי רְאוּבֵן
  choice: Con cháu Ru-bên
  rationale: Trong ngữ cảnh kiểm kê toàn bộ chi phái, בְּנֵי chỉ các hậu duệ nam thuộc chi phái Ru-bên, không chỉ các con trai trực tiếp.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: con đầu lòng của Y-sơ-ra-ên
  rationale: Giữ nguyên quan hệ đồng vị, xác định Ru-bên là con đầu lòng của Y-sơ-ra-ên.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: Diễn đạt sự phân loại theo nguồn gốc và các thế hệ hậu duệ mà không hàm ý nhất thiết có hồ sơ thành văn.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: “Thị tộc” phù hợp với đơn vị thân tộc trong cơ cấu chi phái và phân biệt với “gia tộc tổ tiên” theo sau.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc tổ tiên của họ
  rationale: Chuyển đạt thành ngữ kỹ thuật “nhà của các cha” bằng cách nói tiếng Việt rõ nghĩa, chỉ đơn vị gia tộc phụ hệ.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: theo số tên
  rationale: Giữ hình ảnh thống kê các cá nhân theo tên, sát với cách diễn đạt của nguyên văn.
- source_word: לְגֻלְגְּלֹתָם
  choice: từng người một
  rationale: Thành ngữ theo nghĩa đen là “theo từng sọ/đầu”, ở đây chỉ việc mỗi cá nhân được kiểm đếm riêng.
- source_word: כָּל זָכָר
  choice: tất cả nam giới
  rationale: Truyền đạt chính xác sự phân loại theo giới tính trong cuộc kiểm kê.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Cách nói tự nhiên trong tiếng Việt cho ngưỡng tuổi được nêu trong tiếng Hê-bơ-rơ.
- source_word: כֹּל יֹצֵא צָבָא
  choice: mọi người thuộc số ra quân
  rationale: Giữ sắc thái của phân từ “đi ra” cùng nghĩa quân sự của צבא, đồng thời tránh thêm hẳn ý “có khả năng” vốn không được phát biểu trực tiếp.
