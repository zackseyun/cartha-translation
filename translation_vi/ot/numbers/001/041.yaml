base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/041.yaml
  text: Those counted from the tribe of Asher were forty-one thousand five hundred.
translation:
  language: vi
  text: Số người được kiểm kê thuộc chi tộc A-se là bốn mươi mốt ngàn năm trăm người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được kiểm kê
  rationale: Dạng từ bắt nguồn từ פקד, có hậu tố ngôi ba số nhiều, chỉ những người đã được ghi nhận và đếm trong cuộc kiểm kê dân số. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ bối cảnh kiểm kê.
- source_word: לְמַטֵּה
  choice: thuộc chi tộc
  rationale: Trong công thức kiểm kê này, לְ kết hợp với מַטֶּה biểu thị sự trực thuộc chi tộc. “Thuộc chi tộc” tự nhiên hơn lối dịch sát chữ “cho chi tộc”.
- source_word: אָשֵׁר
  choice: A-se
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc, rõ ràng trong tiếng Việt.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: bốn mươi mốt ngàn năm trăm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang trật tự tự nhiên của tiếng Việt, đồng thời bảo toàn chính xác tổng số 41.500.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm kê” để phản ánh bối cảnh điều tra dân số; thêm “người” ở cuối con số để câu tiếng Việt rõ nghĩa, không nhằm bổ sung giới tính ngoài điều câu này diễn đạt.
