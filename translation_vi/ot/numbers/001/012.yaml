  text: 'Về Đan: A-hi-ê-xe, con trai của A-mi-sa-đai.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/דָן
  choice: Cho Đan
  rationale: Giới từ לְ nêu bộ tộc mà người được kể tên đại diện trong danh sách kiểm tra dân số. “Cho Đan” giữ được cấu trúc ngắn gọn của nguyên văn mà không thêm từ “bộ tộc” vốn chỉ hàm ý.
- source_word: אֲחִיעֶזֶר
  choice: A-hi-ê-xe
  rationale: Tên riêng được phiên âm theo lối quen thuộc, dễ đọc trong tiếng Việt hiện đại.
- source_word: בֶּן
  choice: con trai
  rationale: Danh từ בֶּן trong công thức định danh này chỉ quan hệ cha-con; “con trai” diễn đạt tự nhiên và chính xác.
- source_word: עַמִּישַׁדָּי
  choice: A-mi-sa-đai
  rationale: Tên riêng được phiên âm thay vì dịch nghĩa, theo lối viết rõ âm tiết và quen thuộc trong tiếng Việt.
