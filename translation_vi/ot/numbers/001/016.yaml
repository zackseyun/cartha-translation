source:
  edition: WLC
  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: vi
  text: Đó là những người được gọi của cộng đồng[a], là các thủ lĩnh của các bộ tộc của cha ông họ, là những người đứng đầu các đơn vị ngàn người của Y-sơ-ra-ên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người được triệu tập của cộng đồng” hoặc “những người được chỉ định của cộng đồng”. Phân từ Hê-bơ-rơ có thể chỉ người được gọi, được triệu tập hoặc được chỉ định.
    reason: lexical_alternative
  - marker: b
    text: “Các đơn vị ngàn người của Y-sơ-ra-ên” có thể chỉ những nhóm một ngàn người, hoặc rộng hơn là các phân khu thị tộc hay quân sự trong Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là những người
  rationale: Đại từ chỉ định số nhiều giới thiệu và xác định những người vừa được nêu danh; tiếng Việt cần thêm cấu trúc hệ từ để câu tự nhiên.
- source_word: קריאי הָעֵדָה
  choice: những người được gọi từ cộng đồng
  rationale: Giữ sắc thái bị động của phân từ קרא và không thu hẹp nghĩa thành “được chọn”; giới từ “từ” diễn đạt họ được gọi ra từ giữa cộng đồng, dù kết cấu Hê-bơ-rơ cũng có thể hiểu là những người được triệu tập hoặc được chỉ định của cộng đồng.
- source_word: נְשִׂיאֵי
  choice: các thủ lĩnh
  rationale: Trong bối cảnh tổ chức bộ tộc, từ này chỉ những người lãnh đạo có địa vị; “thủ lĩnh” trang trọng, rõ nghĩa và không gợi tước vị hoàng gia như “vương hầu”.
- source_word: מַטּוֹת אֲבוֹתָם
  choice: những bộ tộc tổ phụ họ
  rationale: Diễn đạt các bộ tộc thuộc dòng phụ hệ của họ, đồng thời giữ yếu tố “tổ phụ” trong nguyên văn thay vì chỉ nói chung là “tổ tiên”.
- source_word: רָאשֵׁי
  choice: những người đứng đầu
  rationale: Chuyển tự nhiên ẩn dụ “các đầu” sang cách nói tiếng Việt thông dụng về những người lãnh đạo.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: các đơn vị ngàn người của Y-sơ-ra-ên
  rationale: Giữ nghĩa căn bản “ngàn” nhưng trình bày như một đơn vị tổ chức; chú thích bảo lưu khả năng đây là nhóm đúng một ngàn người hoặc một phân khu thị tộc/quân sự.
- source_word: הֵם
  choice: Đó là
  rationale: Đại từ độc lập cuối câu có tác dụng xác nhận, nhận diện; tiếng Việt thể hiện tự nhiên bằng cấu trúc nhấn mạnh ở đầu câu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cộng đồng” cho עֵדָה để chỉ toàn thể dân Y-sơ-ra-ên mà không tạo liên tưởng riêng đến một cơ cấu giáo hội; dùng “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
