  to: Còn ngươi, hãy chỉ định người Lê-vi trông coi Đền Tạm của Chứng Ngôn[a], mọi vật dụng của Đền Tạm, và mọi thứ thuộc về Đền Tạm. Họ phải khiêng Đền Tạm cùng mọi vật dụng của Đền Tạm, phục vụ tại đó[b], và đóng trại chung quanh Đền Tạm.
  rationale: Sửa duy nhất cách diễn đạt mệnh lệnh bổ nhiệm để loại bỏ mơ hồ cú pháp và phản ánh rõ lực của הַפְקֵד ... עַל. Chú thích a được rút gọn để bảo lưu các khả năng từ vựng mà không thêm một diễn giải cụ thể về “Chứng Ngôn.” Nghĩa và các liên kết chú thích của câu được giữ nguyên.
  reviewer_model: gpt-5.6-terra
