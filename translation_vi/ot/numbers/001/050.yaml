source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: vi
  text: Còn ngươi, hãy chỉ định người Lê-vi trông coi Đền Tạm của Chứng Ngôn[a], mọi vật dụng của Đền Tạm, và mọi thứ thuộc về Đền Tạm. Họ phải khiêng Đền Tạm cùng mọi vật dụng của Đền Tạm, phục vụ tại đó[b], và đóng trại chung quanh Đền Tạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Nơi Ngự của Chứng Ngôn.” Từ Hê-bơ-rơ מִשְׁכָּן có thể chỉ nơi ngự hoặc Đền Tạm; הָעֵדֻת có thể dịch là “chứng ngôn” hoặc “chứng cớ.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “phụng sự nơi ấy” hoặc “chăm lo cho Đền Tạm.” Động từ này thường chỉ việc phục vụ trong bối cảnh thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Còn ngươi
  rationale: Đại từ được nêu rõ để nhấn mạnh người nghe; liên từ mang sắc thái chuyển ý tương phản với việc người Lê-vi không được kiểm kê cùng các chi tộc trước đó.
- source_word: הַפְקֵד ... עַל
  choice: hãy giao ... phụ trách
  rationale: Cấu trúc Hiphil của פקד cùng עַל ở đây chỉ việc trao trách nhiệm trông coi, quản nhiệm; cách diễn đạt này tự nhiên hơn trong tiếng Việt hiện đại mà vẫn giữ lực mệnh lệnh.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Đền Tạm của Chứng Ngôn
  rationale: “Đền Tạm” diễn đạt nơi thánh lưu động; “của Chứng Ngôn” giữ quan hệ sở thuộc của cấu trúc Hê-bơ-rơ và không tự ý đồng nhất עֵדוּת với một cách giải thích giáo phái cụ thể.
- source_word: כֵּלָיו
  choice: mọi vật dụng của Đền Tạm
  rationale: כֵּלִים bao quát các đồ dùng, khí cụ và vật phẩm dùng trong nơi thánh; “vật dụng” rõ nghĩa và đủ rộng trong tiếng Việt.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tất cả những gì thuộc về Đền Tạm
  rationale: Giữ nghĩa rộng của mọi thứ liên hệ hoặc thuộc về Đền Tạm, không thu hẹp thành những vật ở bên trong.
- source_word: יִשְׂאוּ
  choice: phải khiêng
  rationale: נשא tại đây nói đến việc mang vác Đền Tạm và các vật dụng khi di chuyển; “khiêng” cụ thể, tự nhiên, còn “phải” chuyển tải lực chỉ thị của ngữ cảnh.
- source_word: יְשָׁרְתֻהוּ
  choice: phục vụ tại đó
  rationale: Piel của שרת mang sắc thái phục vụ trong bối cảnh thánh; chuyển đại từ tân ngữ thành cụm chỉ nơi chốn giúp câu tiếng Việt tự nhiên mà không mở rộng nhiệm vụ ngoài văn bản.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: đóng trại chung quanh Đền Tạm
  rationale: Diễn đạt trực tiếp việc dựng trại thành vòng bao quanh nơi thánh và giữ lực quy định của mệnh đề.
theological_decisions:
- issue: Thuật ngữ chỉ מִשְׁכַּן
  choice: Đền Tạm
  alternative: Nơi Ngự; lều
  rationale: “Đền Tạm” là thuật ngữ tiếng Việt dễ nhận biết cho nơi thánh lưu động, đồng thời tránh nhầm với “Lều Hội Kiến,” vốn thường dịch một cụm Hê-bơ-rơ khác.
- issue: Ý nghĩa của הָעֵדֻת
  choice: Chứng Ngôn
  alternative: chứng cớ; Chứng Ước
  rationale: “Chứng Ngôn” giữ nghĩa cơ bản là lời/vật làm chứng. Không thêm trực tiếp từ “giao ước” vào chính văn, dù trong ngữ cảnh từ này có thể chỉ chứng tích giao ước được đặt trong nơi thánh.
- issue: Sắc thái thánh vụ của שרת
  choice: phục vụ tại đó
  alternative: phụng sự nơi ấy; chăm lo cho Đền Tạm
  rationale: “Phục vụ” giữ được nghĩa làm công việc thánh mà không gán cho người Lê-vi một chức năng tế lễ vượt quá điều câu này nói; chú thích bảo lưu các sắc thái khả dĩ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Còn ngươi” giữ sự nhấn mạnh của đại từ Hê-bơ-rơ và lời truyền trực tiếp cho Môi-se; các lần lặp “Đền Tạm” được giữ để tránh đại từ mơ hồ và phản ánh nhịp liệt kê của nguyên văn.
