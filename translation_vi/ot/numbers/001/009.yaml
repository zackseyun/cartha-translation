- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ cha–con trong công thức định danh; tiếng Việt không cần từ tương đương với mạo từ.
- source_word: חֵלֹן
  choice: Hê-lôn
  rationale: Tên riêng được phiên âm sang tiếng Việt.
