  yaml_path: translation/ot/numbers/001/037.yaml
  text: Those counted from the tribe of Benjamin were thirty-five thousand four hundred.
translation:
  language: vi
  text: Số người được kiểm kê thuộc bộ tộc Bên-gia-min là ba mươi lăm nghìn bốn trăm người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được kiểm kê
  rationale: Dạng từ bắt nguồn từ פקד chỉ những người đã được thống kê trong cuộc kiểm kê dân số. Cách dịch này tự nhiên trong tiếng Việt và không tự ý thêm giới tính, dù ngữ cảnh rộng hơn xác định đối tượng.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Giới từ לְ đi với מַטֶּה trong công thức kiểm kê này biểu thị sự quy thuộc bộ tộc; “thuộc bộ tộc” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: בִנְיָמִן
  choice: Bên-gia-min
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tên bộ tộc Benjamin.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: ba mươi lăm nghìn bốn trăm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách nói hiện đại, tự nhiên trong tiếng Việt, đồng thời giữ đúng tổng số 35.400.
