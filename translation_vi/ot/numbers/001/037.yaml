  register: Văn phong hiện đại, trang trọng và dễ hiểu. Thêm “người” sau con số để câu tiếng Việt rõ nghĩa; đây là danh từ loại đã được nêu trong cụm mở đầu, không bổ sung giới tính hay thông tin thần học.
