base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/027.yaml
  text: Those counted from the tribe of Judah were seventy-four thousand six hundred[a].
translation:
  language: vi
  text: Số người được kiểm kê thuộc bộ tộc Giu-đa là bảy mươi bốn nghìn sáu trăm người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Số người được đăng ký”. Từ Hê-bơ-rơ trong công thức điều tra dân số này có thể được hiểu theo cả hai cách.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được kiểm kê
  rationale: Dạng từ mang nghĩa bị động của פקד trong ngữ cảnh điều tra dân số chỉ những người đã được đếm hoặc đăng ký. “Số người được kiểm kê” tự nhiên trong tiếng Việt và giữ rõ sắc thái thống kê dân số.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Giới từ לְ với מַטֶּה ở đây biểu thị sự quy thuộc bộ tộc. “Thuộc bộ tộc” tự nhiên và không làm mất quan hệ được diễn tả trong công thức kiểm kê.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Cách phiên âm tên bộ tộc quen thuộc trong tiếng Việt.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: bảy mươi bốn nghìn sáu trăm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách nói số tự nhiên trong tiếng Việt, giữ nguyên trị số 74.600.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Thêm “người” sau con số để câu tiếng Việt tự nhiên; đối tượng là người được kiểm kê đã được xác định ngay đầu câu. Dấu ngắt đoạn Masoret (׃פ) không cần thể hiện bằng lời.
