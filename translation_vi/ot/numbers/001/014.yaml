- source_word: לְ/גָד
  choice: từ Gát
  rationale: Tiền tố לְ trong danh sách các trưởng đại diện bộ tộc diễn tả sự thuộc về hoặc xuất thân; “từ Gát” truyền đạt tự nhiên rằng Ê-li-a-sáp là người đại diện bộ tộc Gát.
- source_word: אֶלְיָסָף
  choice: Ê-li-a-sáp
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Cách diễn đạt tự nhiên và chính xác cho quan hệ phụ tử trong cấu trúc gia phả Hê-bơ-rơ.
- source_word: דְּעוּאֵל
  choice: Đê-u-ên
  rationale: Phản ánh trực tiếp dạng tên דְּעוּאֵל trong bản WLC của câu này; dị bản Rê-u-ên được giữ trong chú thích.
