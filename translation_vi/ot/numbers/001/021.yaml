  text: Their counted men from the tribe of Reuben were forty-six thousand five hundred.
translation:
  language: vi
  text: Những người được kiểm đếm thuộc chi tộc Ru-bên là bốn mươi sáu nghìn năm trăm người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được kiểm đếm
  rationale: Danh từ bắt nguồn từ פקד chỉ những người đã được đăng ký và đếm trong cuộc kiểm kê dân số. Cách dịch này giữ ý bị động của nguyên ngữ và diễn đạt tự nhiên trong tiếng Việt.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Giới từ לְ đi với מַטֶּה biểu thị sự quy thuộc vào bộ tộc trong công thức kiểm kê; “thuộc bộ tộc” tự nhiên và sát nghĩa.
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: bốn mươi sáu ngàn năm trăm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang trật tự tự nhiên của tiếng Việt, đồng thời giữ nguyên tổng số 46.500.
