  terminology: “Chi tộc” là thuật ngữ Kinh Thánh tiếng Việt phù hợp hơn “bộ tộc” cho מַטֶּה trong công thức kiểm kê của Dân Số Ký. Dùng “nghìn” phù hợp với chính tả hiện hành; “Ru-bên” được giữ nguyên.
