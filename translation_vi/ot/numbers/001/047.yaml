  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: vi
  text: Nhưng người Lê-vi, theo chi phái tổ phụ mình[a], không được kiểm đếm[b] trong số họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “theo chi phái của các tổ phụ họ”.'
