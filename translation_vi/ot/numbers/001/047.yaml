revisions:
- from: Nhưng người Lê-vi, theo bộ tộc tổ phụ của họ[a], không được kiểm đếm chung với những người ấy.[b]
  to: Nhưng người Lê-vi, theo chi phái tổ phụ mình[a], không được kiểm đếm[b] trong số họ.
  rationale: Sửa cụm chỉ chi phái theo dòng tổ phụ để tiếng Việt tự nhiên hơn và sát cấu trúc tiếng Hê-bơ-rơ; thay “chung với những người ấy” bằng “trong số họ” để giữ chính xác ý bao gồm của בְּתוֹכָם. Không thêm lý do hay diễn giải thần học nào cho việc người Lê-vi không được kiểm đếm.
