    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Nhưng người Lê-vi
  rationale: Liên từ וְ mang sắc thái tương phản trong ngữ cảnh, vì người Lê-vi được phân biệt với các bộ tộc vừa được kiểm đếm.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: theo bộ tộc tổ phụ của họ
  rationale: מַטֶּה trong bối cảnh điều tra dân số chỉ bộ tộc; אֲבֹתָם theo nghĩa đen là “các tổ phụ của họ”, diễn tả dòng dõi phụ hệ. Cách dịch này vừa sát nguồn vừa tự nhiên trong tiếng Việt.
- source_word: לֹא הָתְפָּקְדוּ
  choice: không được kiểm đếm
  rationale: Dạng hitpael của פקד trong cuộc điều tra dân số nói đến việc được ghi nhận và tính vào số dân; “kiểm đếm” giữ được sắc thái chính thức của hành động.
- source_word: בְּתוֹכָם
  choice: chung với những người ấy
  rationale: בְּתוֹךְ ở đây nói đến việc được kể vào cùng tập thể đã nêu trước đó; “chung với những người ấy” diễn đạt rõ quan hệ bao gồm.
