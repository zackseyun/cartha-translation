  terminology: “Yahweh,” “Môi-se,” “Sinai,” “đất Ai Cập,” và “Lều Gặp Gỡ” đều nhất quán và phù hợp. Chú thích nêu “Lều Hội Kiến” và tên gọi truyền thống “Đền Tạm” như các cách gọi thay thế, không áp đặt chúng vào bản văn chính.
  issues:
