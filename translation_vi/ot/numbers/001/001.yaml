id: NUM.1.1
reference: Numbers 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se trong hoang mạc Sinai, tại Lều Gặp Gỡ[a], vào ngày mồng một của tháng thứ hai, năm thứ hai sau khi họ ra khỏi đất Ai Cập, rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lều Hội Kiến”; theo cách gọi truyền thống: “Đền Tạm”.'
    reason: Nêu các cách dịch quen thuộc của אֹהֶל מוֹעֵד, trong khi bản văn chính dùng cách diễn đạt minh bạch hơn đối với độc giả hiện đại.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר mở đầu lời phán của Đức Chúa Trời trong văn thuật sự. “Phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: בְּמִדְבַּר סִינַי
  choice: trong hoang mạc Sinai
  rationale: מִדְבָּר chỉ vùng hoang vu hoặc hoang mạc; “hoang mạc” vừa tự nhiên vừa phù hợp bối cảnh địa lý.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Gặp Gỡ
  rationale: Cụm từ chỉ chiếc lều là nơi gặp gỡ theo sự chỉ định. “Lều Gặp Gỡ” minh bạch hơn thuật ngữ truyền thống nhưng vẫn giữ hình ảnh cụ thể của nguyên văn.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: vào ngày mồng một tháng hai
  rationale: Diễn đạt thành ngữ ghi ngày tháng của tiếng Hê-bơ-rơ bằng cách nói tự nhiên trong tiếng Việt.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: năm thứ hai
  rationale: Chuyển trực tiếp mốc niên đại, không thêm thông tin ngoài nguyên văn.
- source_word: לְצֵאתָם
  choice: sau khi họ ra khỏi
  rationale: Động từ nguyên mẫu có hậu tố ngôi thứ ba số nhiều chỉ thời điểm tính từ cuộc ra đi. Giữ đại từ “họ” vì câu này không nêu đích danh Israel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: đất Ai Cập
  rationale: Giữ danh từ אֶרֶץ (“đất”) thay vì rút gọn chỉ còn tên nước.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức dẫn nhập lời nói báo hiệu nội dung tiếp theo; dấu hai chấm diễn đạt chức năng ấy tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH. Giữ “Yahweh” bảo toàn đặc tính danh riêng và không thay nó bằng một tước hiệu hay cách phiên âm truyền thống khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ trật tự chính của nguyên văn nhưng dùng các giới từ và cách ghi ngày tháng tự nhiên trong tiếng Việt. Đại từ “họ” bảo toàn sự quy chiếu ngầm của nguyên bản, không tự ý thêm “dân Israel” vào câu.
