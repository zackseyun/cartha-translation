- from: Hãy kiểm kê[a] toàn thể cộng đồng con cái Israel[b], theo từng thị tộc, từng gia tộc bên cha, căn cứ vào số tên của mọi người nam, từng người một[c].
  to: Hãy kiểm kê[a] toàn thể cộng đồng các con trai Israel[b], theo các thị tộc của họ, theo các nhà cha của họ, căn cứ vào số tên, mọi người nam, từng người một[c].
  rationale: Bản sửa giữ cách gọi “các con trai Israel” của nguyên ngữ thay vì dùng một cách gọi trung tính. “Theo các nhà cha của họ” bảo toàn sát hơn cấu trúc phụ hệ và hậu tố sở hữu của tiếng Hê-bơ-rơ. Các thành ngữ hành chính và thành ngữ đếm đầu người tiếp tục được chuyển bằng tiếng Việt hiện đại, với nghĩa đen được nêu trong chú thích.
