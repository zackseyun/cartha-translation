language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: vi
  text: Hãy kiểm kê[a] toàn thể cộng đồng các con trai Israel[b], theo các thị tộc của họ, theo các nhà cha của họ, căn cứ vào số tên, mọi người nam, từng người một[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “hãy nâng đầu”; trong ngữ cảnh này nghĩa là đếm hoặc ghi danh để kiểm kê dân số.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “các con trai Israel”; cũng có thể dịch là “dân Israel”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “theo từng sọ/đầu”, một thành ngữ chỉ việc đếm riêng từng cá nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: Hãy kiểm kê
  rationale: Thành ngữ này có nghĩa đen là “hãy nâng đầu” nhưng trong ngữ cảnh hành chính chỉ việc đếm và ghi danh dân số. “Kiểm kê” truyền đạt rõ hành động thống kê chính thức mà vẫn gọn và trang trọng.
- source_word: כָּל עֲדַת
  choice: toàn thể cộng đồng
  rationale: עֵדָה chỉ toàn thể cộng đồng Israel xét như một tập thể. “Cộng đồng” tự nhiên trong tiếng Việt hiện đại và không nhất thiết hàm ý một buổi hội họp cụ thể.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Cách dịch này giữ hình ảnh huyết thống của nguyên ngữ “các con trai/con của Israel”, đồng thời trong tiếng Việt có thể chỉ hậu duệ nói chung; phạm vi kiểm kê người nam được xác định rõ ở cuối câu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc rộng hơn gia đình hạt nhân và là một phân nhóm trong cơ cấu bộ tộc. “Thị tộc” phân biệt thích hợp với “gia tộc bên cha” kế tiếp.
- source_word: לְבֵית אֲבֹתָם
  choice: từng gia tộc bên cha
  rationale: Cụm từ chỉ nhóm huyết thống được tổ chức theo dòng cha. “Gia tộc bên cha” tự nhiên hơn lối dịch sát chữ “nhà của các cha” mà vẫn giữ cấu trúc phụ hệ của văn bản.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: căn cứ vào số tên
  rationale: Giữ cách diễn đạt hành chính của tiếng Hebrew, theo đó việc thống kê được thực hiện qua các tên đã được ghi nhận, thay vì giản lược thành “đếm”.
- source_word: כָּל זָכָר
  choice: mọi người nam
  rationale: זָכָר xác định giới tính nam; “người nam” vừa chính xác vừa phù hợp với văn phong Kinh Thánh trang trọng, không biến nó thành một thuật ngữ tuổi tác như “đàn ông”.
- source_word: לְגֻלְגְּלֹתָם
  choice: từng người một
  rationale: Nghĩa đen là “theo từng sọ/đầu”, một thành ngữ nói về việc đếm riêng từng cá nhân. Bản chính ưu tiên cách nói tiếng Việt tự nhiên; hình ảnh nguyên ngữ được bảo tồn trong chú thích.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ thứ tự các đơn vị thống kê trong nguyên ngữ, đồng thời dùng “thị tộc” và “gia tộc bên cha” để phân biệt hai cấp thân tộc. Các thành ngữ Hebrew khó chuyển trực tiếp được diễn đạt tự nhiên trong bản chính và giải thích bằng chú thích.
