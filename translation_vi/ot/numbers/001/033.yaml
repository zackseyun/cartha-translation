base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/033.yaml
  text: Those registered from the tribe of Ephraim were forty thousand five hundred.
translation:
  language: vi
  text: Số người được đăng ký thuộc bộ tộc Ép-ra-im là bốn mươi nghìn năm trăm người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được đăng ký
  rationale: Danh từ có hậu tố ngôi thứ ba số nhiều, bắt nguồn từ פקד, chỉ những người đã được kiểm kê trong cuộc điều tra dân số. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại mà không nhấn mạnh sắc thái quân sự quá mức câu gốc.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Trong công thức kiểm kê này, לְ kết hợp với מַטֶּה biểu thị sự trực thuộc bộ tộc. “Thuộc bộ tộc” truyền đạt rõ tư cách thành viên và hợp với cú pháp tiếng Việt.
- source_word: אֶפְרָיִם
  choice: Ép-ra-im
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết rõ âm tiết, dễ đọc đối với độc giả Việt Nam.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: bốn mươi nghìn năm trăm
  rationale: Chuyển trực tiếp số từ Hê-bơ-rơ sang chữ trong văn xuôi Kinh Thánh, giữ giọng văn trang trọng và dễ đọc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng. Thêm “người” ở cuối con số để câu tiếng Việt tự nhiên và làm rõ đơn vị đếm vốn đã hiển nhiên từ ngữ cảnh kiểm kê.
