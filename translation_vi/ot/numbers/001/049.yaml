  rationale: Chỉ chỉnh cách diễn đạt vế thứ hai để phản ánh rõ thành ngữ kiểm kê trong tiếng Hê-bơ-rơ và tạo câu tiếng Việt hiện đại, tự nhiên hơn. Không thay đổi nghĩa, sắc thái mệnh lệnh, hay thuật ngữ chính của bản nháp.
