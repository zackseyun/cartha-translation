  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: vi
  text: Chỉ riêng bộ tộc Lê-vi, ngươi không được kiểm kê; cũng không được tính số họ vào số con cái Y-sơ-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Y-sơ-ra-ên”; nguyên văn Hê-bơ-rơ là “các con trai của Y-sơ-ra-ên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Chỉ riêng
  rationale: Trong ngữ cảnh này, từ này nêu một ngoại lệ đối với lệnh kiểm kê trước đó; “chỉ riêng” diễn đạt rõ sắc thái hạn định.
- source_word: מַטֵּה לֵוִי
  choice: bộ tộc Lê-vi
  rationale: מַטֶּה trong bối cảnh kiểm kê các nhóm dân có nghĩa là “bộ tộc”, không phải nghĩa đen “cây gậy”.
- source_word: תִפְקֹד
  choice: kiểm kê
  rationale: Động từ פקד ở đây chỉ việc tiến hành kiểm kê dân số; “kiểm kê” tự nhiên và chính xác hơn “đếm” trong văn cảnh hành chính này.
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: tính tổng số họ
  rationale: Cụm nghĩa đen liên quan đến việc “nâng đầu” là thành ngữ kiểm kê, chỉ việc xác định tổng số người.
- source_word: בְּתוֹךְ
  choice: chung với
  rationale: Giới từ ở đây diễn tả việc được kể vào trong tập thể lớn hơn; “chung với” phù hợp tự nhiên với động từ “tính”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cách dịch này giữ hình ảnh quan hệ dòng dõi trong tiếng Hê-bơ-rơ nhưng vẫn là cách gọi tập thể tự nhiên, quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách gọi giao ước בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; các con trai Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có hình thức giống đực số nhiều nhưng thường là tên gọi quy ước cho toàn dân. “Con cái Y-sơ-ra-ên” bảo tồn ý niệm dòng dõi mà không khiến độc giả Việt hiểu sai rằng cuộc kiểm kê trong câu chỉ đối chiếu người Lê-vi với nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” được giữ vì lời này trực tiếp truyền lệnh cho Môi-se; hai động từ “kiểm kê” và “tính tổng số” phản ánh hai cách diễn đạt song song trong nguyên văn.
