  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לִ/בְנֵ֤י יוֹסֵף֙ לִ/בְנֵ֣י אֶפְרַ֔יִם תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: vi
  text: 'Về con cháu Giô-sép, về con cháu Ép-ra-im, theo dòng dõi, thị tộc và gia tộc bên cha của họ, theo số tên, từ hai mươi tuổi trở lên, tất cả những người nam ra trận[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả những người phục vụ trong quân ngũ.” Thành ngữ Hê-bơ-rơ nói sát nghĩa về việc ra quân.'
    reason: Nêu nghĩa chức năng quân sự của thành ngữ bên cạnh hình ảnh sát nguyên văn “ra trận”.
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Về con cháu Giô-sép
  rationale: Giới từ לְ mở đầu công thức kiểm kê và xác định nhóm được nói đến. “Con cháu” diễn đạt đúng nghĩa hậu duệ theo chi tộc trong tiếng Việt hiện đại hơn “các con trai”, trong khi vẫn giữ quan hệ phả hệ.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: về con cháu Ép-ra-im
  rationale: Giữ cấu trúc lặp lại của nguyên văn để xác định nhánh Ép-ra-im thuộc Giô-sép, không thêm từ giải thích như “tức là” vốn không có trong tiếng Hê-bơ-rơ.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: Trong ngữ cảnh kiểm kê dân số, từ này chỉ sự phân chia theo nguồn gốc phả hệ; “dòng dõi” tự nhiên và không mặc nhiên biến nó thành hồ sơ thành văn.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: מִשְׁפָּחָה tại đây là đơn vị thân tộc trong cơ cấu bộ tộc, rộng hơn gia đình hạt nhân; “thị tộc” phân biệt rõ cấp này với gia tộc bên cha.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc bên cha của họ
  rationale: Diễn đạt thuật ngữ thân tộc “nhà của các cha” bằng tiếng Việt tự nhiên, đồng thời bảo toàn đặc điểm truy hệ phụ hệ của cuộc kiểm kê.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: theo số tên
  rationale: Giữ sát công thức kiểm kê từng người theo tên trong nguyên văn, dù cách nói có sắc thái hành chính.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Cách diễn đạt tiếng Việt hiện đại, tự nhiên và chính xác cho ngưỡng tuổi trong nguyên văn.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tất cả những người nam ra trận
  rationale: Công thức chỉ nam giới trong độ tuổi được kiểm kê để phục vụ quân sự. “Người nam” bảo toàn giới tính của nhóm trong ngữ cảnh, còn “ra trận” giữ hình ảnh quân sự của thành ngữ Hê-bơ-rơ.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính trong cuộc kiểm kê
  choice: tất cả những người nam ra trận
  alternative: tất cả những người ra trận
  rationale: Ngữ cảnh và công thức kiểm kê nói đến nam giới đủ tuổi phục vụ quân sự. Nêu rõ “người nam” tránh trung tính hóa phạm vi của câu.
- issue: Quan hệ giữa Giô-sép và Ép-ra-im
  choice: lặp lại “về con cháu” mà không thêm từ nối giải nghĩa
  alternative: con cháu Giô-sép, tức là con cháu Ép-ra-im
  rationale: Nguyên văn đặt hai cụm từ song song nhưng không có từ tương đương với “tức là”. Giữ cấu trúc lặp bảo toàn cách trình bày và không thu hẹp quan hệ phả hệ bằng một lời giải thích được thêm vào.
translation_notes:
  register: Văn phong trang trọng, rõ ràng, mang sắc thái hành chính-phả hệ phù hợp với danh sách kiểm kê. Giữ phép lặp của nguyên văn nhưng dùng “con cháu”, “thị tộc” và “gia tộc bên cha” để người đọc tiếng Việt hiện đại hiểu đúng các cấp thân tộc. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
