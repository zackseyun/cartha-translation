source:
  edition: WLC
  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: vi
  text: 'Về con cháu Đan, theo dòng dõi của họ, theo thị tộc của họ, theo nhà tổ phụ của họ, căn cứ vào số tên, từ hai mươi tuổi trở lên, mọi nam giới có thể ra trận[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi nam giới đủ điều kiện phục vụ quân đội.” Thành ngữ Hê-bơ-rơ, theo nghĩa đen, là “ra quân” hoặc “ra trận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: Về con cháu Đan
  rationale: Giới từ לְ mở đầu đề mục chi phái trong công thức kiểm kê. “Con cháu” diễn đạt tự nhiên phạm vi các thành viên thuộc chi phái Đan, trong khi đối tượng nam giới được xác định rõ ở phần cuối câu.
- source_word: תּוֹלְדֹתָם
  choice: theo gia phả
  rationale: Trong bối cảnh kiểm kê, từ này chỉ sự phân chia và ghi nhận theo dòng dõi; “gia phả” rõ nghĩa và tự nhiên hơn lối dịch sát chữ “các thế hệ”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc trong cơ cấu chi phái; “thị tộc” giúp phân biệt với “nhà tổ phụ” ngay sau đó.
- source_word: לְבֵית אֲבֹתָם
  choice: theo nhà tổ phụ của họ
  rationale: Giữ lại thuật ngữ xã hội-thân tộc mang tính kỹ thuật của Y-sơ-ra-ên cổ, đồng thời diễn đạt trang trọng và dễ hiểu.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: căn cứ vào số tên
  rationale: Giữ hình ảnh đếm từng người theo tên trong nguyên văn, thay vì diễn giải rộng thành tổng số nhân khẩu.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách nói tiếng Việt tự nhiên và chính xác cho ngưỡng tuổi trong công thức kiểm kê.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tất cả những người ra trận được
  rationale: Giữ thành ngữ Hê-bơ-rơ nói theo nghĩa đen về việc ra trận, đồng thời “được” truyền đạt khả năng hoặc tư cách phục vụ quân đội mà không thu hẹp thành việc họ đang thực sự xuất quân.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính trong cuộc kiểm kê quân sự
  choice: tất cả những người ra trận được
  alternative: tất cả nam giới đủ điều kiện phục vụ quân đội
  rationale: Ngữ cảnh và ngữ pháp nam tính cho thấy đối tượng là nam giới trong độ tuổi quân dịch. Tuy nhiên, tiếng Việt không bắt buộc đánh dấu giống ở “người”; câu vẫn giữ đúng phạm vi nhờ ngữ cảnh kiểm kê quân sự, còn chú thích nêu rõ cách hiểu chức năng của thành ngữ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và có nhịp điệu công thức phù hợp với danh sách kiểm kê. Dùng “thị tộc” và “nhà tổ phụ” để bảo toàn các cấp tổ chức thân tộc khác nhau; dấu hai chấm cuối câu cho thấy câu dẫn sang con số ở câu kế tiếp.
