review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc kiểm kê, ngưỡng tuổi và các đơn vị thân tộc. Tuy nhiên, «tất cả những người ra trận được» không truyền đạt được cách thành ngữ כֹּל יֹצֵא צָבָא chỉ những nam giới thuộc diện có thể/được huy động ra trận, đồng thời tiếng Việt không tự nhiên.
  naturalness: «Ra trận được» là cấu trúc không tự nhiên trong tiếng Việt hiện đại. «Theo dòng dõi của họ» chính xác và rõ hơn «theo gia phả», vì nguyên ngữ nói đến dòng dõi/sự phân chia theo dòng dõi, không trực tiếp nói đến một văn bản gia phả.
  terminology: Giữ «thị tộc» và «nhà tổ phụ» để phân biệt מִשְׁפָּחָה với בֵּית־אָב. Dùng «mọi nam giới có thể ra trận» để thể hiện tham chiếu nam tính của ngữ cảnh kiểm kê quân sự mà không diễn giải thành việc họ đang thực sự xuất quân.
  issues:
  - severity: medium
    issue: Cụm «tất cả những người ra trận được» không tự nhiên và mơ hồ.
    rationale: Cụm này có thể bị hiểu là người đã được ra trận hoặc có cách diễn đạt lỗi. כֹּל יֹצֵא צָבָא là thành ngữ về những người thuộc diện ra quân/phục vụ quân sự.
  - severity: low
    issue: «Theo gia phả» dễ chuyển nghĩa sang hồ sơ gia phả.
    rationale: תּוֹלְדֹתָם trong công thức này quy chiếu dòng dõi/genealogical divisions; «theo dòng dõi của họ» truyền đạt trực tiếp hơn.
  revised_text: 'Về con cháu Đan, theo dòng dõi của họ, theo thị tộc của họ, theo nhà tổ phụ của họ, căn cứ vào số tên, từ hai mươi tuổi trở lên, mọi nam giới có thể ra trận[a]:'
