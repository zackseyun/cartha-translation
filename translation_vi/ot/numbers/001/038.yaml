revisions:
- from: 'Về con cháu Đan, theo gia phả, theo thị tộc, theo nhà tổ phụ của họ, căn cứ vào số tên, từ hai mươi tuổi trở lên, tất cả những người ra trận được[a]:'
  to: 'Về con cháu Đan, theo dòng dõi của họ, theo thị tộc của họ, theo nhà tổ phụ của họ, căn cứ vào số tên, từ hai mươi tuổi trở lên, mọi nam giới có thể ra trận[a]:'
  rationale: Sửa cách diễn đạt không tự nhiên ở cuối câu và làm rõ phạm vi nam giới vốn được xác định bởi công thức kiểm kê quân sự trong nguyên ngữ. «Theo dòng dõi của họ» tránh hàm ý rằng văn bản đang nói đến một bản gia phả. Các yếu tố công thức khác, trật tự câu và dấu hai chấm dẫn sang số liệu ở câu sau đều được giữ lại.
