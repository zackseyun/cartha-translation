  text: לִ/בְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם פְּקֻדָ֗י/ו בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: vi
  text: 'Về con cháu Si-mê-ôn: theo dòng dõi, theo thị tộc và theo nhà cha ông của họ, những người trong số họ được kiểm kê[a] theo số tên, từng người một[b]—tất cả nam giới từ hai mươi tuổi trở lên, mọi người đi ra trận[c]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người trong số họ được tập hợp để kiểm đếm”; động từ Hê-bơ-rơ פקד trong bối cảnh này có thể vừa mang sắc thái kiểm kê dân số vừa mang sắc thái tập hợp quân.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn sát chữ là “theo từng sọ/đầu”, một thành ngữ chỉ việc đếm riêng từng cá nhân.
    reason: cultural_note
  - marker: c
    text: Cũng có thể hiểu là “mọi người đủ khả năng phục vụ quân đội”; nguyên văn sát hơn là “mọi người đi ra trận”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: Về con cháu Si-mê-ôn
  rationale: Trong công thức kiểm kê bộ tộc, בנים chỉ các hậu duệ nam hoặc thành viên bộ tộc mang tên tổ phụ; “con cháu” tự nhiên hơn “các con trai” trong tiếng Việt mà vẫn giữ mối liên hệ huyết thống.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: Trong ngữ cảnh gia phả và kiểm kê, từ này nói đến các nhánh hậu duệ; “dòng dõi” truyền đạt rõ ý hơn cách dịch máy móc “các thế hệ”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc trong bộ tộc, rộng hơn gia đình hạt nhân; “thị tộc” diễn đạt chính xác cấp tổ chức này.
- source_word: לְבֵית אֲבֹתָם
  choice: theo nhà cha ông của họ
  rationale: Giữ hình ảnh và cơ cấu phụ hệ của cụm Hê-bơ-rơ, đồng thời dùng lối nói tiếng Việt dễ hiểu.
- source_word: פְּקֻדָיו
  choice: những người trong số họ được kiểm kê
  rationale: Phân từ thụ động của פקד trong bối cảnh điều tra dân số có thể mang sắc thái kiểm đếm hoặc tập hợp quân; “được kiểm kê” giữ nghĩa hành chính chính yếu mà không nhấn quá sớm sắc thái quân sự.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: theo số tên
  rationale: Giữ công thức kiểm kê theo từng tên cá nhân và tính chính xác hành chính của nguyên văn.
- source_word: לְגֻלְגְּלֹתָם
  choice: từng người một
  rationale: Đây là thành ngữ, sát chữ là “theo từng sọ/đầu”, mang nghĩa đếm từng cá nhân; cách dịch này tự nhiên trong tiếng Việt, còn hình ảnh nguyên ngữ được ghi ở chú thích.
- source_word: כָּל זָכָר
  choice: tất cả nam giới
  rationale: זָכָר xác định giới tính; “nam giới” chính xác và phù hợp với văn cảnh kiểm kê quân sự.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Cách diễn đạt tự nhiên, chính xác cho công thức chỉ ngưỡng tuổi trong nguyên văn.
- source_word: כֹּל יֹצֵא צָבָא
  choice: mọi người ra trận
  rationale: Giữ gần nghĩa đen “mọi người đi ra với quân đội/ra trận”, không diễn giải dứt khoát thành “đủ khả năng phục vụ quân đội”.
theological_decisions:
- issue: Phạm vi của cụm כֹּל יֹצֵא צָבָא
  choice: mọi người ra trận
  alternative: mọi người đủ khả năng phục vụ quân đội
  rationale: Nguyên văn mô tả người “đi ra” trong צבא và hàm ý tư cách quân sự, nhưng không trực tiếp nêu tiêu chuẩn thể chất; bản dịch giữ sự căng giữa cách nói cụ thể và hàm ý tuyển quân.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Cấu trúc liệt kê hành chính của câu Hê-bơ-rơ được giữ lại; dấu gạch ngang cuối câu cho thấy câu còn tiếp sang phần nêu tổng số ở câu kế tiếp. Danh xưng được phiên âm theo lối quen dùng trong tiếng Việt.
