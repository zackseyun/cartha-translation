source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: vi
  text: Con dân Israel[a] đã làm theo mọi điều Yahweh đã truyền cho Môi-se; họ đã làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Israel”; nguyên văn Hê-bơ-rơ là “các con trai của Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: đã làm
  rationale: Động từ עשה có nghĩa rộng là “làm, thực hiện”. “Đã làm” tự nhiên trong tiếng Việt và phù hợp với lời tổng kết về sự vâng phục.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Con dân Israel
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Israel”, nhưng cũng là cách gọi tập thể dân Israel. “Con dân Israel” vừa giữ được sắc thái thuộc về tổ phụ Israel, vừa không khiến độc giả hiểu sai rằng câu này chỉ nói đến nam giới; nghĩa đen được ghi ở chú thích.
- source_word: כְּכֹל אֲשֶׁר
  choice: theo mọi điều
  rationale: Cách dịch này diễn đạt cả sự phù hợp với mệnh lệnh lẫn tính trọn vẹn của những gì đã được truyền.
- source_word: צִוָּה
  choice: truyền
  rationale: “Truyền” là cách diễn đạt trang trọng, tự nhiên đối với mệnh lệnh của Đức Chúa Trời và cho thấy mệnh lệnh có trước hành động của Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: Sau động từ “truyền”, tiếng Việt tự nhiên dùng “cho Môi-se” để chỉ người nhận mệnh lệnh.
- source_word: כֵּן עָשׂוּ
  choice: họ đã làm đúng như vậy
  rationale: Giữ phép lặp nhấn mạnh ở cuối câu, đồng thời diễn đạt rõ sự tương ứng chính xác giữa mệnh lệnh và hành động.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Yahweh” bảo tồn chức năng danh riêng và tránh thay danh ấy bằng một tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: Con dân Israel
  alternative: Các con trai của Israel; dân Israel
  rationale: Trong ngữ cảnh, cụm từ là danh xưng tập thể của dân tộc, dù hình thức từ ngữ có nghĩa đen là “các con trai của Israel”. “Con dân Israel” giữ liên hệ với tổ phụ Israel mà không thu hẹp không có căn cứ vào riêng nam giới; chú thích bảo tồn hình thức nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp ở cuối câu được giữ lại để phản ánh sự nhấn mạnh của nguyên văn; dấu chấm phẩy giúp câu tiếng Việt rõ nhịp.
