  yaml_path: translation/ot/numbers/001/039.yaml
  text: Those counted from the tribe of Dan were sixty-two thousand seven hundred.
translation:
  language: vi
  text: Số người được kiểm kê thuộc bộ tộc Đan là 62.700 người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được kiểm kê
  rationale: Dạng từ bắt nguồn từ פקד, có hậu tố ngôi thứ ba số nhiều, chỉ những người đã được ghi nhận trong cuộc kiểm kê dân số. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ bối cảnh kiểm kê.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Trong công thức kiểm kê này, לְ đi với מַטֶּה để xác định sự lệ thuộc theo bộ tộc. “Thuộc bộ tộc” tự nhiên và chính xác trong tiếng Việt.
- source_word: דָן
  choice: Đan
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt cho tên bộ tộc Dan.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף
  choice: '62.000'
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách biểu đạt số tự nhiên trong tiếng Việt.
- source_word: וּשְׁבַע מֵאוֹת
  choice: '700'
  rationale: Diễn đạt trực tiếp phần còn lại của con số; ghép với 62.000 thành 62.700.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm kê” để phù hợp bối cảnh điều tra quân số; thêm “người” sau con số nhằm làm câu tiếng Việt rõ và tự nhiên, phù hợp đối tượng đã được xác định trong ngữ cảnh.
