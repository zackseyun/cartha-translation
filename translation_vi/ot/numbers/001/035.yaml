lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: Số người được kiểm đếm
  rationale: Trong ngữ cảnh kiểm tra dân số, dạng từ này chỉ những người đã được đếm và ghi nhận. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ trọng tâm của câu ở tổng số người.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Giới từ לְ đi với מַטֶּה trong công thức kiểm tra dân số này biểu thị sự quy thuộc vào bộ tộc; “thuộc bộ tộc” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: מְנַשֶּׁה
  choice: Ma-na-se
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong tiếng Việt.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: '32.200'
  rationale: Chuyển đúng giá trị số là ba mươi hai nghìn hai trăm; dùng cách ghi số thông dụng giúp câu thống kê gọn và dễ đọc.
