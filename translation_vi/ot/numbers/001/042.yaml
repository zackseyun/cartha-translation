  naturalness: “Theo nhà cha ông” và “theo số tên” hơi gượng hoặc mơ hồ trong tiếng Việt hiện đại. “Theo nhà tổ phụ của họ” và “theo số người được ghi tên” rõ ràng, tự nhiên hơn mà vẫn giữ ý nghĩa kiểm kê-gia phả.
  terminology: Dùng “các con trai của Nép-ta-li” để duy trì tính nam và liên hệ bộ tộc của בְּנֵי; “thị tộc” phù hợp với מִשְׁפָּחָה; “nhà tổ phụ” thích hợp cho בֵּית אֲבוֹת. Chú thích giải thích đúng thành ngữ כֹּל יֹצֵא צָבָא mà không áp đặt cách hiểu giáo phái.
