source:
  edition: WLC
  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: vi
  text: 'Các con trai của Nép-ta-li, theo dòng dõi họ, theo thị tộc họ, theo nhà tổ phụ của họ, theo số người được ghi tên, từ hai mươi tuổi trở lên, mọi nam giới ra quân[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “mọi người ra quân” hoặc “mọi người ra trận.” Thành ngữ Hê-bơ-rơ chỉ những người thuộc diện phục vụ quân sự.'
    reason: Nêu nghĩa sát của כֹּל יֹצֵא צָבָא và làm rõ hàm ý quân sự trong văn cảnh kiểm kê.
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Con cháu Nép-ta-li
  rationale: Trong công thức kiểm kê này, בְּנֵי chỉ các thành viên nam thuộc bộ tộc có nguồn gốc từ Nép-ta-li. “Con cháu” diễn đạt quan hệ huyết thống tự nhiên hơn “các con trai” trong tiếng Việt, vốn dễ bị hiểu là các con trực tiếp.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: Từ này nói đến nguồn gốc và các phân nhánh gia phả; “theo dòng dõi” vừa rõ nghĩa vừa thích hợp với văn cảnh kiểm kê.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: מִשְׁפָּחָה trong cơ cấu bộ tộc rộng hơn gia đình hạt nhân; “thị tộc” giữ được cấp độ thân tộc này.
- source_word: לְבֵית אֲבֹתָם
  choice: theo nhà cha ông
  rationale: Giữ hình ảnh cơ cấu gia tộc phụ hệ của nguyên văn mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: theo số tên
  rationale: Giữ công thức kiểm kê theo từng người được ghi tên, không diễn giải quá mức thành một phương thức lập danh sách cụ thể.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Cách diễn đạt tự nhiên, chính xác về ngưỡng tuổi trong tiếng Việt.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tất cả những người có thể ra trận
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa sát là những người “ra quân/ra trận”; trong cuộc kiểm kê, nó chỉ những người thuộc diện phục vụ quân sự. “Có thể ra trận” truyền đạt chức năng ấy mà không biến câu thành thuật ngữ hành chính hiện đại.
theological_decisions:
- issue: Phạm vi giới tính của nhóm được kiểm kê
  choice: Không chèn từ “nam” ngay trong cụm cuối, nhưng để “con cháu Nép-ta-li” cùng bối cảnh quân dịch truyền đạt nhóm được kiểm kê.
  alternative: “Tất cả nam giới có thể ra trận.”
  rationale: כֹּל יֹצֵא צָבָא tự nó không có danh từ nghĩa là “nam giới”; ý nam giới phát sinh từ בְּנֵי và toàn bộ công thức kiểm kê. Cách chọn tránh thêm một từ không hiện diện trong cụm cuối mà vẫn không xóa bối cảnh giới tính của cuộc kiểm kê.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Dùng dấu chấm phẩy để phân định phần phương thức kiểm kê với điều kiện tuổi và quân dịch; giữ dấu hai chấm cuối câu vì câu này dẫn sang con số ở câu kế tiếp.
