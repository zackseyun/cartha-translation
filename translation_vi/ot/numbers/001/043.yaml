lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: số người được kiểm đếm
  rationale: Dạng từ thuộc gốc פקד chỉ những người đã được ghi nhận và đếm trong cuộc kiểm kê dân số; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ bối cảnh.
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Giới từ לְ đi với מַטֶּה trong công thức kiểm kê này biểu thị sự quy thuộc vào một bộ tộc; “thuộc bộ tộc” là cách nói gọn và tự nhiên.
- source_word: נַפְתָּלִי
  choice: Nép-ta-li
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc quen thuộc, rõ ràng trong tiếng Việt.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף
  choice: '53.000'
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách ghi số tự nhiên trong tiếng Việt.
- source_word: וְאַרְבַּע מֵאוֹת
  choice: '400'
  rationale: Thể hiện trực tiếp thành phần cuối của tổng số theo cách ghi số hiện đại trong tiếng Việt.
