base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: vi
  text: 'Về con cháu Bên-gia-min, theo dòng dõi họ, theo các thị tộc họ, theo các nhà tổ phụ của họ, theo số tên, từ hai mươi tuổi trở lên, tất cả những người có thể ra trận[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “tất cả những người đi ra quân đội”; đây là một thành ngữ chỉ những người đủ điều kiện phục vụ quân sự.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: Về con cháu Bên-gia-min
  rationale: Tiền tố לְ mở đầu mục kiểm kê của bộ tộc; “con cháu” diễn đạt tự nhiên ý nghĩa hậu duệ thuộc bộ tộc trong ngữ cảnh này, còn tên riêng được phiên âm theo cách dùng tiếng Việt.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: Trong văn cảnh kiểm kê dân số, từ này chỉ sự phân nhóm theo huyết thống; “dòng dõi” vừa rõ nghĩa vừa giữ sắc thái gia phả của nguyên ngữ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: מִשְׁפָּחָה là đơn vị thân tộc trong cơ cấu bộ tộc; “thị tộc” giúp phân biệt với bộ tộc lớn hơn và gia tộc tổ tiên ở vế kế tiếp.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc tổ tiên của họ
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “nhà các cha của họ”, chỉ đơn vị gia tộc phụ hệ. Cách dịch này tự nhiên trong tiếng Việt mà vẫn bảo lưu cơ cấu thân tộc của nguyên văn.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: theo số tên
  rationale: Giữ sát công thức kiểm kê, cho thấy từng cá nhân được tính theo tên, mà không diễn giải quá mức thành ngôn ngữ hành chính hiện đại.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách diễn đạt tự nhiên và chính xác ngưỡng tuổi tối thiểu được nêu trong nguyên văn.
- source_word: כֹּל יֹצֵא צָבָא
  choice: tất cả những người ra trận
  rationale: Giữ hình ảnh và công thức quân sự của nguyên ngữ; chú thích làm rõ đây là thành ngữ chỉ những người đủ điều kiện phục vụ quân đội.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng, giữ cấu trúc liệt kê của bản kiểm kê. Dùng “con cháu” thay cho “các con trai” vì đây là tên gọi toàn thể hậu duệ thuộc bộ tộc; dùng “thị tộc” và “gia tộc tổ tiên” để phân biệt các cấp độ thân tộc. Dấu hai chấm giữ tính chất câu dẫn sang con số kiểm kê ở câu kế tiếp.
