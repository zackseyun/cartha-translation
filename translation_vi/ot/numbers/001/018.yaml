  text: וְ/אֵ֨ת כָּל הָ/עֵדָ֜ה הִקְהִ֗ילוּ בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י וַ/יִּתְיַֽלְד֥וּ עַל מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/גֻלְגְּלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: vi
  text: Vào ngày mồng một tháng thứ hai, họ tập hợp toàn thể cộng đồng. Họ đăng ký theo gia phả[a], theo các thị tộc và các gia tộc theo dòng cha của mình, theo số tên, từ hai mươi tuổi trở lên, từng người một[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khai báo dòng dõi” hoặc “ghi danh theo phả hệ”; động từ Hê-bơ-rơ hiếm gặp này chỉ việc đăng ký dựa trên nguồn gốc tổ tiên.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “theo từng đầu” hoặc “theo từng sọ,” một thành ngữ có nghĩa là mỗi người đều được tính riêng.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: triệu tập
  rationale: Dạng Hifil của קהל diễn tả việc khiến cộng đồng tụ họp; “triệu tập” tự nhiên và giữ được sắc thái chủ động quy tụ toàn thể cộng đồng.
- source_word: כָּל הָעֵדָה
  choice: toàn thể cộng đồng
  rationale: עֵדָה chỉ cộng đồng Israel xét như một tập thể; cách dịch này rõ ràng, trang trọng và phù hợp với tiếng Việt hiện đại.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: Ngày mồng một tháng hai
  rationale: Đây là thành ngữ lịch pháp Hê-bơ-rơ có nghĩa là ngày đầu tiên của tháng thứ hai; “mồng một” là cách nói ngày tháng tự nhiên trong tiếng Việt.
- source_word: וַיִּתְיַלְדוּ
  choice: đăng ký theo gia phả
  rationale: Dạng Hitpael hiếm của ילד ở đây nói đến việc kê khai hoặc xác lập dòng dõi trong cuộc kiểm kê. Cách dịch vừa thể hiện hành động đăng ký vừa nêu rõ cơ sở phả hệ.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: Trong bối cảnh tổ chức bộ tộc và kiểm kê, מִשְׁפָּחָה thường là nhóm thân tộc lớn hơn gia đình hạt nhân; “thị tộc” phân biệt được cấp độ này.
- source_word: לְבֵית אֲבֹתָם
  choice: theo ... gia tộc của cha ông mình
  rationale: Cụm từ kỹ thuật này chỉ đơn vị thân tộc theo dòng cha. Cách diễn đạt tiếng Việt giữ được yếu tố tổ tiên phụ hệ mà không dùng thuật ngữ quá khó.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: theo danh sách tên
  rationale: Cụm từ nói đến việc thống kê những cá nhân có tên; “theo danh sách tên” truyền đạt rõ chức năng kiểm kê hơn lối dịch sát chữ “theo số tên”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là công thức chỉ ngưỡng tuổi và được chuyển sang cách nói tiếng Việt tự nhiên, chính xác.
- source_word: לְגֻלְגְּלֹתָם
  choice: từng đầu người
  rationale: Nghĩa đen liên quan đến “đầu/sọ” nhưng là thành ngữ chỉ việc đếm riêng từng cá nhân. “Từng đầu người” giữ được hình ảnh cụ thể và vẫn dễ hiểu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tách làm hai để tránh kết cấu quá nặng trong tiếng Việt. Các thuật ngữ “thị tộc” và “gia tộc của cha ông” duy trì hai cấp tổ chức thân tộc khác nhau; các dấu chú thích được đặt ngay sau đúng cụm từ mà chúng giải thích.
