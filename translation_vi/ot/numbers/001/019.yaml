base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: vi
  text: Đúng như Yahweh đã truyền cho Môi-se, ông đã điểm danh họ[a] trong hoang mạc Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ghi danh họ,” “kiểm đếm họ,” hoặc “tiến hành kiểm tra dân số họ.” Động từ Hê-bơ-rơ có thể chỉ việc ghi danh hoặc đếm những người được tập hợp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Đúng như
  rationale: Diễn tả sự phù hợp chính xác giữa việc Môi-se làm và mệnh lệnh đã được ban, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Động từ mang nghĩa ra lệnh hoặc truyền bảo; “đã truyền” thể hiện hành động xảy ra trước việc kiểm kê và giữ văn phong trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: אֶת đánh dấu Môi-se là đối tượng của động từ “truyền”; tiếng Việt diễn đạt tự nhiên bằng giới từ “cho”.
- source_word: וַיִּפְקְדֵם
  choice: ông kiểm kê họ
  rationale: Trong bối cảnh điều tra dân số, פקד chỉ việc ghi nhận và đếm những người thuộc diện được thống kê; “kiểm kê” bao quát hơn việc chỉ đếm số.
- source_word: בְּמִדְבַּר סִינָי
  choice: trong hoang mạc Sinai
  rationale: Giữ quan hệ địa danh của cụm Hê-bơ-rơ và dùng cách diễn đạt địa lý tự nhiên, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng bốn phụ âm; chuyển tự “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Chủ thể ngầm của וַיִּפְקְדֵם
  choice: ông, chỉ Môi-se
  alternative: Không nêu đại từ chủ thể
  rationale: Động từ ở ngôi thứ ba số ít giống đực và mạch văn xác định Môi-se là người thực hiện cuộc kiểm kê; “ông” giúp câu tiếng Việt rõ và tự nhiên mà không thêm một chủ thể khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Môi-se” theo dạng tên quen thuộc trong tiếng Việt; “Sinai” giữ dạng quốc tế. Câu giữ nhịp đối ứng giữa mệnh lệnh của Yahweh và hành động vâng theo của Môi-se.
