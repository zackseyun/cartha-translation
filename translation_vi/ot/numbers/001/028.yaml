  source_fidelity: 'Bản dịch phản ánh đúng công thức kiểm kê của tiếng Hê-bơ-rơ: chi phái, dòng dõi, thị tộc, nhà cha ông, số tên, ngưỡng từ hai mươi tuổi, và đối tượng nam thuộc diện ra quân. Dấu hai chấm cuối câu phù hợp vì câu dẫn sang số liệu ở câu sau.'
  naturalness: Câu văn hiện đại, trang trọng và giữ được nhịp lặp có chủ ý của công thức nguyên ngữ. “Theo số tên” hơi sát chữ nhưng chấp nhận được trong văn cảnh kiểm kê.
  terminology: “Y-sa-ca,” “thị tộc,” và “nhà cha ông” phù hợp với ngữ cảnh thân tộc và tên riêng. Tuy nhiên, lời giải thích trong chú thích hiện diễn đạt sai sắc thái của cụm יוצא צבא khi thêm ý “đi ra [trong] quân đội”; cụm này là người ra quân/đi ra phục vụ trong lực lượng quân sự, không phải chuyển động “trong” quân đội.
  issues:
