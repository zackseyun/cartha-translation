  text: לִ/בְנֵ֣י יִשָּׂשכָ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: vi
  text: 'Về con cháu Y-sa-ca: theo dòng dõi, theo thị tộc, theo nhà cha ông của họ, theo số tên, từ hai mươi tuổi trở lên, mọi người nam có thể ra trận[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi người ra quân.” Cụm từ Hê-bơ-rơ theo sát mặt chữ là “mọi người ra quân” và ở đây chỉ những người nam đủ điều kiện quân dịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: Về con cháu Y-sa-ca
  rationale: Giới từ לְ mở đầu đề mục chi phái trong công thức kiểm kê. “Con cháu” diễn đạt tự nhiên ý các hậu duệ nam và thành viên thuộc chi phái, còn “về” phù hợp với cấu trúc đề mục của câu.
- source_word: תּוֹלְדֹתָם
  choice: theo dòng dõi
  rationale: Trong công thức kiểm kê này, từ này chỉ các tuyến thế hệ hay dòng huyết thống; “dòng dõi” tự nhiên hơn “các thế hệ” trong tiếng Việt mà không giới hạn nghĩa vào hồ sơ gia phả thành văn.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: מִשְׁפָּחָה ở đây là một đơn vị thân tộc trong cơ cấu chi phái, rộng và có tổ chức hơn “gia đình” theo cách hiểu hiện đại.
- source_word: לְבֵית אֲבֹתָם
  choice: theo nhà cha ông của họ
  rationale: Cách dịch giữ hình ảnh phụ hệ của thành ngữ thân tộc Hê-bơ-rơ, đồng thời dùng lối diễn đạt dễ hiểu trong tiếng Việt.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: theo số tên
  rationale: Giữ sát thành ngữ kiểm kê, nhấn mạnh việc đếm từng người có tên, thay vì chuyển thành một cách nói khái quát như “theo nhân số”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách nói tiếng Việt tự nhiên, chính xác cho ngưỡng tuổi bao gồm cả người vừa đủ hai mươi.
- source_word: כֹּל יֹצֵא צָבָא
  choice: mọi người nam có thể ra trận
  rationale: Cụm từ theo sát mặt chữ là “mọi người ra quân”, nhưng trong bối cảnh cuộc kiểm kê này, nó chỉ những người nam trong độ tuổi đủ điều kiện quân dịch. Bản dịch chính diễn đạt chức năng ấy, còn chú thích bảo lưu cách hiểu sát chữ.
theological_decisions:
- issue: Ngôn ngữ chỉ giới trong cuộc kiểm kê
  choice: mọi người nam có thể ra trận
  alternative: mọi người có thể ra trận
  rationale: Hình thái ngữ pháp giống đực, cụm “con cháu” trong cuộc kiểm kê quân sự và ngưỡng tuổi cùng cho thấy đối tượng là nam giới đủ điều kiện quân dịch. Vì vậy không trung tính hóa giới tính của đối tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm cuối câu được giữ vì câu này mở đầu cho con số kiểm kê ở câu tiếp theo. Các cụm “theo…” lặp lại có chủ ý nhằm phản ánh nhịp công thức của nguyên văn.
