  source_fidelity: 'Bản dịch phản ánh đúng chuỗi chỉ dẫn nghi lễ của tiếng Hê-bơ-rơ: động từ mang lực bắt buộc được chuyển là “phải thiêu”; לְעֵינָיו được giữ bằng “trước mắt mình”; và việc thiêu cả da, thịt, máu lẫn phân của con vật được nêu đầy đủ. Sự lặp lại “người ấy phải thiêu” ở cuối bảo toàn sự nhấn mạnh của nguyên văn.'
