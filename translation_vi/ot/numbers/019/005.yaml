  yaml_path: translation/ot/numbers/019/005.yaml
  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: vi
  text: Người ấy phải thiêu con bò cái trước mắt mình; da, thịt, máu cùng với phân của nó, người ấy phải thiêu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Người ấy phải thiêu
  rationale: Dạng waw + qatal trong chuỗi chỉ dẫn nghi lễ mang lực quy định; “phải thiêu” diễn đạt tự nhiên nghĩa vụ trong tiếng Việt.
- source_word: הַפָּרָה
  choice: con bò cái
  rationale: פָּרָה chỉ bò giống cái; “con bò cái” rõ nghĩa, hiện đại và không tự thêm ý rằng con vật còn non.
- source_word: לְעֵינָיו
  choice: trước mắt mình
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ, nghĩa là ngay trong tầm mắt hoặc dưới sự chứng kiến của người ấy; “mình” quy chiếu tự nhiên về chủ thể đang thiêu.
- source_word: עֹרָהּ
  choice: da
  rationale: עוֹר là da của con vật; “da” là cách gọi trực tiếp và tự nhiên trong tiếng Việt.
- source_word: בְּשָׂרָהּ
  choice: thịt
  rationale: בָּשָׂר trong ngữ cảnh thân thể con vật được dịch tự nhiên là “thịt”.
- source_word: דָּמָהּ
  choice: máu
  rationale: Cách dịch trực tiếp của דָּם kèm hậu tố sở hữu; cụm cuối “của nó” bao quát các thành phần được liệt kê.
- source_word: עַל פִּרְשָׁהּ
  choice: cùng với phân của nó
  rationale: פֶּרֶשׁ chỉ phân/chất bài tiết, còn עַל tại đây biểu thị sự kèm theo trong danh sách những thứ phải thiêu.
- source_word: יִשְׂרֹף
  choice: người ấy phải thiêu
  rationale: Dạng chưa hoàn thành trong luật nghi lễ nêu hành động bắt buộc; lặp lại động từ như nguyên văn để kết thúc danh sách với sự nhấn mạnh.
theological_decisions: []
