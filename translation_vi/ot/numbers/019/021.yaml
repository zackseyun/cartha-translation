  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: vi
  text: 'Điều này sẽ là một quy định vĩnh viễn cho họ: người rảy nước tẩy uế[a] phải giặt quần áo mình, còn người chạm vào nước tẩy uế sẽ bị ô uế cho đến chiều tối.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nước dùng để thanh tẩy khỏi sự ô uế”; theo sát tiếng Hê-bơ-rơ: “nước ô uế”; cách dịch truyền thống: “nước phân cách.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: Điều này sẽ là một quy định vĩnh viễn cho họ
  rationale: Diễn đạt tự nhiên lực ràng buộc lâu dài của quy định; “điều này” làm rõ chủ thể được hàm ý theo ngữ cảnh.
- source_word: וּמַזֵּה
  choice: người rảy
  rationale: Phân từ được dùng như danh từ, chỉ người thực hiện nghi thức rảy nước.
- source_word: מֵי הַנִּדָּה
  choice: nước tẩy uế
  rationale: Trong Dân Số 19, cụm từ chỉ thứ nước được chuẩn bị để xử lý tình trạng ô uế do tử thi. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ phạm vi nghi lễ; nghĩa sát chữ được ghi ở chú thích.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: phải giặt quần áo mình
  rationale: Thể hiện yêu cầu pháp quy và nghĩa thông thường của động từ כבס khi nói về quần áo.
- source_word: וְהַנֹּגֵעַ
  choice: còn người chạm vào
  rationale: Phân từ danh từ hóa song song với “người rảy”; “còn” làm rõ sự chuyển sang trường hợp thứ hai.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: sẽ bị ô uế cho đến chiều tối
  rationale: Dùng thuật ngữ nghi lễ “ô uế” và diễn đạt mốc thời gian tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Thuật ngữ về tình trạng thanh sạch trong nghi lễ
  choice: Dùng “ô uế” và “nước tẩy uế” theo nghĩa nghi lễ
  alternative: Dịch sát cấu trúc là “nước ô uế” hoặc theo truyền thống là “nước phân cách”
  rationale: Ngữ cảnh nói về tình trạng ô uế theo nghi lễ chứ không trực tiếp nói về tội lỗi đạo đức. “Nước tẩy uế” giúp độc giả hiểu chức năng của nước mà không đưa thêm cách giải thích giáo phái; chú thích bảo tồn dạng sát chữ và cách dịch truyền thống.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ sắc thái pháp quy và thuật ngữ nghi lễ. Dùng “rảy” thay vì “rắc” vì phù hợp hơn với hành động nghi lễ trong ngữ cảnh Kinh Thánh.
