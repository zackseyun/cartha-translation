review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các thành tố chính: người ô uế theo nghi lễ, lượng bụi mang nghĩa phân lượng, lễ thanh tẩy, và nước sống. Tuy nhiên, “phần thiêu” dễ được hiểu là phần lễ vật được dành để thiêu, trong khi שְׂרֵפַת chỉ việc/sự thiêu. “Nước nguồn” là một cách diễn giải khả dĩ nhưng thu hẹp thành ngữ מַיִם חַיִּים; dùng “nước sống” trong thân bài, kèm chú thích, bảo toàn sát hơn cách dùng từ của nguồn.'
