  terminology: Giữ “ô uế” cho tình trạng nghi lễ và “lễ thanh tẩy” cho חַטָּאת trong bối cảnh này. “Nước sống” được giữ trong bản văn để phản ánh nguyên ngữ; chú thích giải thích đây là nước tươi từ nguồn tự nhiên hoặc nước chảy, không áp đặt một diễn giải hẹp.
