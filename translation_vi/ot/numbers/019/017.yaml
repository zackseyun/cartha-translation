base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: vi
  text: Người ta phải lấy cho người ô uế một ít bụi từ việc thiêu lễ thanh tẩy[a], rồi đổ nước sống[b] lên đó trong một bình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “tro từ việc thiêu của lễ chuộc tội.” Từ Hê-bơ-rơ ở đây theo nghĩa sát chữ là “bụi”; còn danh từ חַטָּאת trong văn cảnh nghi lễ có thể chỉ “lễ chuộc tội” hoặc, theo chức năng, “lễ thanh tẩy.”'
    reason: lexical_alternative
  - marker: b
    text: Sát chữ là “nước sống,” tức nước tươi từ một nguồn tự nhiên hoặc nước đang chảy.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקְחוּ
  choice: người ta phải lấy
  rationale: Động từ số nhiều trong văn luật mang sắc thái chỉ thị; tiếng Việt dùng chủ ngữ phiếm chỉ “người ta” tự nhiên hơn mà không xác định quá mức người thực hiện.
- source_word: לַטָּמֵא
  choice: cho người ô uế
  rationale: Tính từ có mạo từ chỉ người đang ở tình trạng ô uế theo nghi lễ; “ô uế” là thuật ngữ rõ và quen thuộc trong văn cảnh luật thanh sạch.
- source_word: מֵעֲפַר
  choice: một ít bụi
  rationale: עָפָר theo nghĩa từ vựng là bụi hoặc vật chất vụn; “một ít” thể hiện sắc thái phân lượng của מִן.
- source_word: שְׂרֵפַת הַחַטָּאת
  choice: phần thiêu của lễ thanh tẩy
  rationale: Cách dịch giữ ý về việc thiêu, đồng thời diễn đạt gọn và tự nhiên rằng bụi được lấy từ vật còn lại sau khi lễ vật thanh tẩy bị thiêu.
- source_word: וְנָתַן
  choice: rồi đổ
  rationale: Động từ số ít chuyển sang tác nhân phiếm chỉ trong quy định pháp lễ; “đổ” phù hợp với thao tác cho nước lên vật liệu trong bình.
- source_word: עָלָיו
  choice: lên đó
  rationale: Đại từ chỉ phần bụi vừa nhắc đến; “lên đó” giữ quan hệ không gian mà không buộc tiếng Việt dùng đại từ giống.
- source_word: מַיִם חַיִּים
  choice: nước nguồn
  rationale: Cụm từ nguyên nghĩa là “nước sống”, chỉ nước từ nguồn tự nhiên đang chảy hoặc còn tươi; “nước nguồn” vừa tự nhiên trong tiếng Việt vừa phân biệt với nước để lâu.
- source_word: אֶל כֶּלִי
  choice: trong một cái bình
  rationale: Giới từ diễn tả việc cho các thành phần vào vật chứa; “cái bình” là cách gọi thông dụng, trang trọng vừa phải cho כֶּלִי trong nghi thức này.
theological_decisions:
- issue: Cách dịch חַטָּאת trong văn cảnh thanh tẩy theo nghi lễ
  choice: lễ thanh tẩy
  alternative: lễ chuộc tội
  rationale: Nghi thức bò cái tơ đỏ ở đây xử lý tình trạng ô uế nghi lễ, nên “lễ thanh tẩy” làm rõ chức năng của חַטָּאת mà không giới hạn từ này vào tội lỗi luân lý. Cách dịch truyền thống được giữ trong chú thích.
- issue: Cách dịch thành ngữ מַיִם חַיִּים
  choice: nước nguồn
  alternative: nước sống; nước chảy
  rationale: “Nước nguồn” truyền đạt tự nhiên ý nước lấy từ nguồn tươi hoặc đang chảy. Chú thích giữ nghĩa sát chữ “nước sống” để bảo toàn liên hệ từ vựng và âm hưởng Kinh Thánh.
translation_notes:
  register: 'Văn phong luật nghi lễ, hiện đại và trang nghiêm vừa phải. Dùng “người ta phải” để thể hiện chỉ thị phiếm chỉ, “ô uế” làm thuật ngữ nghi lễ, và “cái bình” để người đọc phổ thông dễ hiểu. Các chú thích bảo tồn hai điểm có ý nghĩa từ vựng và thần học: עָפָר/חַטָּאת và מַיִם חַיִּים.'
