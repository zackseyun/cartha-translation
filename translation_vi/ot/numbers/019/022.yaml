revisions:
- from: Mọi vật mà người ô uế chạm vào đều sẽ trở nên ô uế; còn người nào chạm vào vật ấy[a] sẽ bị ô uế cho đến chiều tối.
  to: Mọi vật mà người ô uế chạm vào đều sẽ trở nên ô uế; còn người nào chạm vào vật ấy[a] cũng sẽ trở nên ô uế cho đến chiều tối.
  rationale: Chỉ thay “sẽ bị ô uế” bằng “cũng sẽ trở nên ô uế” để phản ánh chính xác hơn động từ chỉ tình trạng ô uế phát sinh và để duy trì sự song hành với mệnh đề thứ nhất. Giữ chú thích vì tiếng Hê-bơ-rơ không nêu lại tân ngữ của “chạm vào”, dù ngữ cảnh gần nhất tự nhiên cho hiểu là vật đã trở nên ô uế.
