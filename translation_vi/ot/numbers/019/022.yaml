source:
  edition: WLC
  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: vi
  text: Mọi vật mà người ô uế chạm vào đều sẽ trở nên ô uế; còn người nào chạm vào vật ấy[a] cũng sẽ trở nên ô uế cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ chỉ nói “người chạm vào” mà không lặp lại tân ngữ; theo ngữ cảnh, đó là vật vừa trở nên ô uế.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Mọi vật mà
  rationale: Cụm này mở đầu một mệnh đề bao quát. “Mọi vật mà” tự nhiên trong tiếng Việt và, theo ngữ cảnh luật thanh sạch, diễn đạt đối tượng bị người ô uế chạm vào.
- source_word: יִגַּע בּוֹ
  choice: chạm vào
  rationale: נגע với giới từ ב diễn tả sự tiếp xúc; “chạm vào” là cách nói rõ ràng, tự nhiên và phù hợp với bối cảnh nghi lễ.
- source_word: הַטָּמֵא
  choice: người ô uế
  rationale: Tính từ có mạo từ được dùng như danh từ, chỉ người đang ở tình trạng ô uế theo nghi lễ. Thêm “người” làm rõ chủ thể mà không gán ý nghĩa tội lỗi đạo đức.
- source_word: יִטְמָא
  choice: sẽ trở nên ô uế
  rationale: Động từ chỉ kết quả là vật bước vào tình trạng ô uế; “trở nên” thể hiện rõ sự thay đổi trạng thái.
- source_word: וְהַנֶּפֶשׁ
  choice: còn người nào
  rationale: נֶפֶשׁ trong văn luật có thể chỉ cả một con người, không nhất thiết riêng “linh hồn”. “Còn người nào” vừa tự nhiên vừa nối sang hệ quả kế tiếp.
- source_word: הַנֹּגַעַת
  choice: chạm vào vật ấy
  rationale: Phân từ mô tả người thực hiện hành động chạm. Tân ngữ không được lặp lại trong tiếng Hê-bơ-rơ nhưng được hiểu theo ngữ cảnh; “vật ấy” giúp câu tiếng Việt sáng nghĩa.
- source_word: תִּטְמָא
  choice: sẽ bị ô uế
  rationale: Cách diễn đạt này nhấn mạnh tình trạng ô uế phát sinh do tiếp xúc và phù hợp với giọng văn quy định.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Đây là công thức thời gian quen thuộc trong các luật về thanh sạch; “cho đến chiều tối” trang trọng, rõ nghĩa và không thu hẹp cách hiểu thành một thời điểm chính xác hơn nguyên văn.
theological_decisions:
- issue: Tính chất của sự ô uế trong luật nghi lễ
  choice: Dùng “ô uế” cho טמא/יטמא.
  alternative: “không thanh sạch”, “bị nhơ bẩn” hoặc ngôn ngữ hàm ý phạm tội
  rationale: Câu này nói về tình trạng ô uế được truyền qua tiếp xúc trong luật nghi lễ, không trực tiếp khẳng định tội lỗi đạo đức. “Ô uế” giữ được phạm trù của nguyên văn mà không thêm kết luận thần học.
- issue: Tân ngữ của hành động chạm trong mệnh đề thứ hai
  choice: Hiểu là vật vừa trở nên ô uế và diễn đạt “vật ấy”, đồng thời ghi chú rằng nguyên văn không lặp lại tân ngữ.
  alternative: 'Để trống tân ngữ: “người nào chạm vào”'
  rationale: Ngữ cảnh gần nhất cho thấy người sau chạm vào vật đã bị người ô uế chạm đến. Tuy nhiên, vì tiếng Hê-bơ-rơ không ghi rõ tân ngữ ở mệnh đề này, chú thích bảo tồn đặc điểm biểu đạt của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ “ô uế” nhất quán với bối cảnh luật nghi lễ; tránh từ ngữ khiến người đọc hiểu đây nhất thiết là sự phạm tội về đạo đức.
