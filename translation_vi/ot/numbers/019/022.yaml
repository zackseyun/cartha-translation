  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của tiếng Hê-bơ-rơ: mọi thứ người đang ở tình trạng ô uế chạm đến trở nên ô uế, và người chạm vào đối tượng ấy cũng trở nên ô uế đến chiều tối. Tuy nhiên, “sẽ bị ô uế” có sắc thái bị động/tác động từ bên ngoài rõ hơn động từ יִטְמָא, vốn ở đây diễn tả việc đi vào hoặc ở trong tình trạng ô uế. “Sẽ trở nên ô uế” phản ánh sát hơn cả hai lần dùng động từ.'
