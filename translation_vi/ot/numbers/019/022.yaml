  terminology: “Ô uế” là thuật ngữ phù hợp cho tình trạng nghi lễ טמא và không nhất thiết hàm ý tội lỗi đạo đức. “Chiều tối” truyền đạt tốt עַד הָעָרֶב. Chú thích cần giữ để cho biết “vật ấy” là tân ngữ được hiểu theo ngữ cảnh, không được lặp lại trong nguyên văn.
