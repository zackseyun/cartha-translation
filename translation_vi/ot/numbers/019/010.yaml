source:
  edition: WLC
  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: vi
  text: Người thu gom tro của bò cái tơ phải giặt quần áo của mình và sẽ không thanh sạch về nghi lễ[a] cho đến chiều tối. Điều này sẽ là một quy định vĩnh viễn[b] cho con dân Israel[c] và cho người ngoại kiều đang cư ngụ giữa họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là không thanh sạch theo nghi lễ, không nhất thiết hàm ý ô uế về đạo đức.
    reason: Làm rõ thuật ngữ nghi lễ.
  - marker: b
    text: 'Cũng có thể dịch: “một quy định trường tồn.”'
    reason: Ghi nhận sắc thái từ vựng của עוֹלָם.
  - marker: c
    text: 'Nguyên văn: “các con trai của Israel,” một cách nói tập thể chỉ dân Israel.'
    reason: Bảo tồn hình thức và sắc thái giao ước của nguyên ngữ.
lexical_decisions:
- source_word: הָאֹסֵף
  choice: người thu gom
  rationale: Phân từ Qal có mạo từ được dùng như danh từ, chỉ người thực hiện việc thu gom; cách dịch này tự nhiên và giữ được sắc thái phân từ.
- source_word: אֵפֶר הַפָּרָה
  choice: tro của bò cái tơ
  rationale: אֵפֶר là danh từ tập hợp chỉ tro; פָּרָה chỉ bò cái. Trong ngữ cảnh nghi thức của chương 19, “bò cái tơ” là cách gọi tự nhiên, cụ thể trong tiếng Việt.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: phải giặt quần áo mình
  rationale: Động từ chỉ việc giặt y phục trong luật thanh sạch; “phải” diễn đạt rõ hiệu lực quy định của văn bản luật.
- source_word: וְטָמֵא
  choice: sẽ bị ô uế về nghi lễ
  rationale: Cụm từ nói đến tình trạng không thanh sạch theo nghi lễ, không hàm ý người ấy phạm tội hay ô uế về đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Phản ánh giới hạn thời gian của tình trạng ô uế và là cách nói tự nhiên trong tiếng Việt.
- source_word: וְהָיְתָה
  choice: Điều này sẽ là
  rationale: Đại từ chỉ toàn bộ quy định vừa nêu; cách diễn đạt làm rõ sở chỉ mà không thêm nội dung.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con dân Israel
  rationale: בְּנֵי יִשְׂרָאֵל theo nghĩa đen là “các con trai/con cái Israel” nhưng ở đây là thành ngữ tập thể chỉ dân Israel; “con dân Israel” vừa giữ sắc thái giao ước vừa tự nhiên trong tiếng Việt.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: và cho ngoại kiều đang cư ngụ giữa họ
  rationale: גֵּר là người không thuộc dân bản địa nhưng sống ổn định trong cộng đồng; “ngoại kiều đang cư ngụ” truyền đạt cả thân phận bên ngoài lẫn việc cư trú.
- source_word: לְחֻקַּת עוֹלָם
  choice: một quy định vĩnh viễn
  rationale: חֻקָּה là quy định cố định; עוֹלָם trong công thức pháp luật chỉ tính lâu dài, trường tồn. “Vĩnh viễn” giữ sức mạnh của công thức Hê-bơ-rơ.
theological_decisions:
- issue: Ý nghĩa của tình trạng טָמֵא
  choice: ô uế về nghi lễ
  alternative: không thanh sạch
  rationale: Ngữ cảnh là luật thanh sạch nghi lễ chứ không phải phán xét đạo đức; thêm “về nghi lễ” ngăn người đọc hiểu sai.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: con cái Israel; dân Israel
  rationale: Cụm Hê-bơ-rơ có hình thức thân tộc nhưng chức năng tập thể. “Con dân Israel” bảo tồn sắc thái căn tính giao ước mà không khiến độc giả tưởng quy định chỉ áp dụng cho nam giới.
- issue: Phạm vi thời gian của חֻקַּת עוֹלָם
  choice: quy định vĩnh viễn
  alternative: quy định trường tồn; quy định lâu dài
  rationale: Bản dịch giữ nguyên sức căng của עוֹלָם trong công thức giao ước, không tự ý giới hạn hoặc giải thích phạm vi thần học của từ này.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, câu rõ ràng và dễ đọc. Dùng “phải” cho nghĩa vụ pháp lý; giữ thuật ngữ “ô uế” nhưng chú thích rõ phạm vi nghi lễ. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
