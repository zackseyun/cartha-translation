revisions:
- from: Nhưng người nào bị ô uế mà không tự thanh tẩy thì người ấy sẽ bị loại khỏi giữa hội chúng[a], vì đã làm ô uế nơi thánh của Đức Giê-hô-va. Nước tẩy uế chưa được rảy trên người ấy[b]; người ấy vẫn ô uế.
  to: Nhưng người nào trở nên ô uế mà không tự thanh tẩy thì người ấy sẽ bị cắt khỏi giữa hội chúng[a], vì đã làm ô uế nơi thánh của Đức Giê-hô-va. Nước thanh tẩy chưa được rảy trên người ấy[b]; người ấy ô uế.
  rationale: Bản sửa giữ nguyên ý nghĩa và trật tự lập luận của câu, đồng thời phản ánh rõ hơn động từ chỉ tình trạng ô uế phát sinh, duy trì tính chưa xác định của công thức ‘bị cắt khỏi’, và không thêm ý tiếp diễn ở phán quyết cuối. ‘Nước thanh tẩy’ diễn đạt tự nhiên chức năng của מֵי נִדָּה; chú thích bảo lưu phương án sát chữ và cách dịch truyền thống.
