  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: vi
  text: Nhưng người nào trở nên ô uế mà không tự thanh tẩy thì người ấy sẽ bị cắt khỏi giữa hội chúng[a], vì đã làm ô uế nơi thánh của Đức Giê-hô-va. Nước thanh tẩy chưa được rảy trên người ấy[b]; người ấy ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “linh hồn ấy sẽ bị cắt khỏi.” Trong công thức pháp lý Hê-bơ-rơ, từ được dịch là “linh hồn” có thể chỉ toàn thể con người, không chỉ phần phi vật chất.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nước ô uế”; theo cách dịch truyền thống: “nước phân cách.” Cụm từ này chỉ nước thanh tẩy được chuẩn bị trong chương này để thanh tẩy khỏi ô uế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: người nào
  rationale: Danh từ giống đực số ít ở đây có chức năng khái quát, chỉ bất cứ cá nhân nào thuộc cộng đồng; “người nào” tự nhiên trong tiếng Việt và không thu hẹp đối tượng vào nam giới.
- source_word: יִטְמָא
  choice: bị ô uế
  rationale: Trong ngữ cảnh luật thanh sạch, động từ chỉ tình trạng ô uế về nghi lễ, không nhất thiết hàm ý phạm tội luân lý; cách dịch này diễn đạt trạng thái phát sinh mà không quy trách nhiệm chủ động.
- source_word: יִתְחַטָּא
  choice: tự thanh tẩy
  rationale: Thể Hitpael của חטא trong ngữ cảnh này chỉ việc chịu hoặc thực hiện nghi thức thanh tẩy khỏi ô uế, chứ không mang nghĩa thông thường là phạm tội.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: người ấy sẽ bị loại khỏi
  rationale: נפש trong công thức pháp lý chỉ toàn thể con người. “Bị loại khỏi” giữ được thành ngữ giao ước mà không xác định cơ chế là tử hình, khai trừ hay sự phán xét trực tiếp của Đức Chúa Trời.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: khỏi giữa hội chúng
  rationale: קהל là cộng đồng giao ước được tập hợp; “hội chúng” vừa trang trọng vừa quen thuộc, còn “khỏi giữa” phản ánh sát cấu trúc Hê-bơ-rơ.
- source_word: מִקְדַּשׁ יְהוָה
  choice: nơi thánh của Đức Giê-hô-va
  rationale: מקדש chỉ nơi hoặc khu vực thánh. Danh riêng יהוה được phiên âm là “Đức Giê-hô-va”, giúp phân biệt với tước hiệu “Chúa” và phản ánh sự hiện diện của danh riêng trong nguồn.
- source_word: טִמֵּא
  choice: đã làm ô uế
  rationale: 'Dạng Piel có ý nghĩa gây khiến: tình trạng không được thanh tẩy của người ấy làm cho nơi thánh bị ô uế.'
- source_word: מֵי נִדָּה
  choice: nước tẩy uế
  rationale: Cụm từ chỉ thứ nước được chuẩn bị trong chương này để loại bỏ sự ô uế do tử thi. “Nước tẩy uế” diễn đạt chức năng tự nhiên hơn trong tiếng Việt mà không khiến người đọc hiểu rằng bản thân nước là ô uế.
- source_word: זֹרַק עָלָיו
  choice: chưa được rảy trên người ấy
  rationale: Trong nghi lễ, זרק diễn tả hành động rảy hoặc vẩy chất lỏng; thể bị động tiếng Việt phù hợp với cấu trúc và trọng tâm của câu.
- source_word: טָמֵא הוּא
  choice: người ấy vẫn ô uế
  rationale: Mệnh đề danh từ tuyên bố tình trạng kết quả. “Vẫn” làm rõ sự ô uế tiếp tục vì nước chưa được rảy, phù hợp mạch văn mà không thay đổi phán quyết pháp lý.
theological_decisions:
- issue: Bản chất hình phạt trong công thức “bị loại khỏi”
  choice: Giữ công thức “sẽ bị loại khỏi” mà không xác định cách thi hành.
  alternative: Bị khai trừ khỏi cộng đồng; hoặc bị xử tử.
  rationale: Công thức giao ước Hê-bơ-rơ tại đây không tự xác định hình phạt được thực hiện qua cái chết, khai trừ hay sự phán xét trực tiếp của Đức Chúa Trời; bản dịch giữ nguyên độ mở và sức nặng pháp lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ thuật ngữ nghi lễ nhất quán (“ô uế”, “thanh tẩy”, “rảy”, “nơi thánh”). Đại từ “người ấy” tránh khẩu ngữ và duy trì tham chiếu rõ ràng. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
