base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: vi
  text: Rồi một người nam đang thanh sạch về nghi lễ sẽ lấy nhánh kinh giới, nhúng vào nước, và rảy trên lều, trên mọi vật dụng, trên những người có mặt ở đó, và trên người đã chạm vào xương, hoặc vào người bị giết[a], người chết hay mộ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thi thể của người bị giết.” Từ Hê-bơ-rơ chỉ người bị giết, thường do bạo lực, và khác với từ “người chết” mang nghĩa chung hơn ở ngay sau đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: nhánh kinh giới
  rationale: Dùng tên gọi truyền thống trong Kinh Thánh tiếng Việt cho loại cây dùng trong nghi thức thanh tẩy; thêm “nhánh” để diễn đạt tự nhiên hành động cầm và nhúng.
- source_word: בַּמַּיִם
  choice: vào nước
  rationale: Chỉ thứ nước thanh tẩy đã được chuẩn bị trong ngữ cảnh trước; tiếng Việt thường không cần từ chỉ định dù tiếng Hê-bơ-rơ có mạo từ.
- source_word: אִישׁ טָהוֹר
  choice: một người nam thanh sạch
  rationale: Giữ số ít và giống đực của אִישׁ, đồng thời dùng “thanh sạch” theo nghĩa nghi lễ, không hàm ý phẩm chất đạo đức.
- source_word: וְהִזָּה
  choice: rảy
  rationale: Thuật ngữ tự nhiên và quen thuộc cho hành động làm văng các giọt nước trong nghi thức thanh tẩy.
- source_word: הָאֹהֶל
  choice: lều
  rationale: Ngữ cảnh nói về căn lều nơi có người chết, không phải Đền Tạm.
- source_word: הַכֵּלִים
  choice: mọi vật dụng
  rationale: כְּלִי có nghĩa rộng, gồm dụng cụ, đồ dùng và đồ chứa; “vật dụng” tự nhiên hơn “khí dụng” trong tiếng Việt hiện đại.
- source_word: הַנְּפָשׁוֹת
  choice: những người
  rationale: נֶפֶשׁ ở đây chỉ những con người hiện diện trong lều, không nhấn mạnh khái niệm linh hồn.
- source_word: הַנֹּגֵעַ
  choice: người đã chạm
  rationale: Phân từ dùng như danh từ chỉ người bị ô uế do đã tiếp xúc với các nguồn ô uế được liệt kê.
- source_word: בָּעֶצֶם
  choice: xương
  rationale: Chỉ xương người như nguồn gây ô uế; tiếng Việt không cần biểu thị mạo từ xác định trong cấu trúc này.
- source_word: בֶחָלָל
  choice: người bị giết
  rationale: חָלָל chỉ người chết do bị đâm hoặc bị giết, khác với từ מֵת mang nghĩa chung hơn ngay sau đó.
- source_word: בַמֵּת
  choice: người chết
  rationale: Giữ nghĩa khái quát của מֵת và sự phân biệt với חָלָל.
- source_word: בַקָּבֶר
  choice: mộ
  rationale: Cách gọi ngắn gọn, tự nhiên cho nơi chôn cất trong tiếng Việt hiện đại.
theological_decisions:
- issue: Thuật ngữ về sự thanh sạch theo nghi lễ
  choice: thanh sạch
  alternative: thanh khiết
  rationale: Câu này nói về tình trạng nghi lễ liên quan đến ô uế do người chết, không trực tiếp nói đến sự trong sạch đạo đức.
- issue: Ngôn ngữ chỉ giới tính trong אִישׁ
  choice: người nam
  alternative: người
  rationale: Giữ nét nghĩa giống đực số ít của nguyên văn mà vẫn diễn đạt tự nhiên, không suy diễn rằng quy định này mang một ý nghĩa thần học riêng về giới tính.
- issue: Phân biệt חָלָל và מֵת
  choice: người bị giết; người chết
  alternative: xác bị giết; người chết
  rationale: Giữ sự phân biệt giữa người chết vì bạo lực và người chết nói chung, nhưng không quyết định quá mức rằng danh từ đầu tiên bắt buộc phải nhấn mạnh thi thể.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “rảy” và “thanh sạch” để giữ sắc thái nghi lễ; tránh những từ cổ như “khí dụng” hoặc cách diễn đạt dễ biến sự thanh sạch nghi lễ thành phẩm chất đạo đức.
