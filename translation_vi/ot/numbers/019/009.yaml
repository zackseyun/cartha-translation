base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: vi
  text: Một người thanh sạch phải thu gom tro của con bò cái rồi đặt bên ngoài trại, tại một nơi thanh sạch. Tro ấy phải được giữ lại cho cộng đồng con cái Y-sơ-ra-ên để dùng cho nước tẩy uế[a]; đó là lễ vật chuộc tội[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “nước của sự ô uế”; cũng có thể dịch: “nước dùng để loại bỏ sự ô uế.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “đó là lễ vật thanh tẩy.” Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật chuộc tội; trong ngữ cảnh nghi lễ tư tế, từ này cũng có thể nhấn mạnh chức năng thanh tẩy.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: một người thanh sạch
  rationale: Giữ danh từ số ít chỉ người và diễn đạt טָהוֹר theo nghĩa thanh sạch về nghi lễ; “thanh sạch” tự nhiên và trang trọng hơn “sạch” trong ngữ cảnh này.
- source_word: וְאָסַף
  choice: phải thu gom
  rationale: Dạng động từ tiếp nối chuỗi chỉ dẫn nghi lễ, nên dùng “phải” để thể hiện lực quy định và “thu gom” cho hành động gom tro.
- source_word: אֵפֶר הַפָּרָה
  choice: tro của con bò cái
  rationale: אֵפֶר là danh từ tập hợp “tro”; פָּרָה xác định con vật là bò cái, không nhất thiết tự thân hàm ý bò tơ.
- source_word: וְהִנִּיחַ
  choice: rồi đặt
  rationale: Diễn đạt tự nhiên hành động tiếp theo trong trình tự nghi lễ mà vẫn giữ nghĩa cơ bản “đặt/để”.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: bên ngoài trại quân
  rationale: Cụm từ có nghĩa vị trí; “trại quân” phù hợp bối cảnh dân Y-sơ-ra-ên đóng trại trong đồng hoang.
- source_word: בְּמָקוֹם טָהוֹר
  choice: tại một nơi thanh sạch
  rationale: Giữ sự lặp lại của טָהוֹר và sắc thái thanh sạch theo nghi lễ.
- source_word: וְהָיְתָה ... לְמִשְׁמֶרֶת
  choice: Tro ấy phải được lưu giữ
  rationale: Đại từ số ít trong tiếng Hê-bơ-rơ quy chiếu về tro như một khối; tiếng Việt nêu lại “tro ấy” để rõ nghĩa và chuyển לְמִשְׁמֶרֶת thành cách diễn đạt tự nhiên.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: cho cộng đồng con cái Y-sơ-ra-ên
  rationale: “Cộng đồng” diễn đạt עֲדָה tự nhiên trong luật nghi lễ; “con cái Y-sơ-ra-ên” giữ thành ngữ nguồn mà vẫn bao quát dân tộc.
- source_word: לְמֵי נִדָּה
  choice: để pha nước tẩy uế
  rationale: Trong nghi lễ này, tro được giữ để dùng với nước nhằm xử lý tình trạng ô uế. “Nước tẩy uế” truyền đạt chức năng tự nhiên trong tiếng Việt, còn cấu trúc sát chữ được ghi ở chú thích.
- source_word: חַטָּאת הִוא
  choice: đó là lễ vật thanh tẩy tội lỗi
  rationale: חַטָּאת vừa có thể chỉ lễ vật chuộc tội vừa nhấn mạnh chức năng thanh tẩy trong văn bản tư tế. Cách dịch này không loại bỏ chiều kích tội lỗi nhưng phản ánh chức năng thanh tẩy nổi bật; các cách hiểu khác được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch חַטָּאת trong nghi lễ thanh tẩy
  choice: đó là lễ vật thanh tẩy tội lỗi
  alternative: 'đó là lễ vật chuộc tội; hoặc: đó là sự thanh tẩy tội lỗi'
  rationale: Danh từ חַטָּאת có trường nghĩa gồm “tội lỗi,” “lễ vật chuộc tội” và, trong văn bản tư tế, lễ vật hay phương tiện thanh tẩy. Ngữ cảnh Dân Số 19 nhấn mạnh việc loại bỏ ô uế, nhưng từ này vẫn giữ liên hệ với tội lỗi; bản dịch chính duy trì cả hai phương diện và chú thích bảo tồn những cách phân tích khả hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng thuật ngữ nghi lễ nhất quán (“thanh sạch,” “ô uế,” “tẩy uế”). Câu được chia nhịp để tránh nặng nề nhưng vẫn giữ trình tự và quan hệ cú pháp của nguyên bản.
