revisions:
- from: Một người thanh sạch phải thu gom tro của con bò cái rồi đặt bên ngoài trại quân, tại một nơi thanh sạch. Tro ấy phải được lưu giữ cho cộng đồng con cái Y-sơ-ra-ên để pha nước tẩy uế[a]; đó là lễ vật thanh tẩy tội lỗi[b].
  to: Một người thanh sạch phải thu gom tro của con bò cái rồi đặt bên ngoài trại, tại một nơi thanh sạch. Tro ấy phải được giữ lại cho cộng đồng con cái Y-sơ-ra-ên để dùng cho nước tẩy uế[a]; đó là lễ vật chuộc tội[b].
  rationale: Bản sửa loại bỏ chi tiết “pha” không có trong câu, làm rõ chú thích sát chữ về “nước của sự ô uế,” và dùng thuật ngữ “lễ vật chuộc tội” cho חַטָּאת trong bản chính. Chú thích bảo tồn cách hiểu “lễ vật thanh tẩy” mà không quyết định vượt quá nghĩa của bản văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:28:01Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp bảo tồn đúng trình tự nghi lễ, số ít của “một người,” giới tính cái của con vật, và ý giữ tro cho cộng đồng. Tuy nhiên, “để pha nước tẩy uế” thêm rõ hành động pha trộn vốn không được phát biểu trực tiếp trong câu. Cụm חַטָּאת הִוא nên được dịch bằng một thuật ngữ lễ nghi rõ ràng hơn; “lễ vật thanh tẩy tội lỗi” dễ khiến “tội lỗi” trở thành đối tượng trực tiếp của sự thanh tẩy và không phải cách gọi tự nhiên của lễ vật trong tiếng Việt.
  naturalness: “Thanh sạch,” “tro,” và “nơi thanh sạch” phù hợp văn phong nghi lễ hiện đại. “Giữ lại” tự nhiên hơn “lưu giữ” trong mệnh đề này; “dùng cho nước tẩy uế” diễn đạt mục đích mà không thêm thao tác. “Lễ vật chuộc tội” là thuật ngữ Kinh Thánh tiếng Việt thông dụng, với sắc thái thanh tẩy được bảo lưu ở chú thích.
  terminology: Giữ nhất quán “thanh sạch/ô uế/tẩy uế.” Dịch חַטָּאת là “lễ vật chuộc tội” làm bản văn chính tương ứng với cách dịch “sin offering” trong audit trail, đồng thời chú thích nêu lựa chọn “lễ vật thanh tẩy” vốn đặc biệt thích hợp trong ngữ cảnh tư tế. Chú thích về לְמֵי נִדָּה sửa “nước ô uế” mơ hồ thành “nước của sự ô uế.”
  issues:
  - severity: medium
    issue: “để pha nước tẩy uế” thêm hành động pha
    rationale: Câu tiếng Hê-bơ-rơ chỉ nói tro được giữ cho “nước của sự ô uế”/nước tẩy uế. Dù việc pha nước được mô tả trong ngữ cảnh rộng hơn, động từ này không có trong câu 9.
  - severity: medium
    issue: “lễ vật thanh tẩy tội lỗi” không rõ và gộp hai cách hiểu
    rationale: חַטָּאת trong câu này là thuật ngữ nghi lễ có thể dịch “lễ vật chuộc tội” hoặc, theo chức năng trong văn liệu tư tế, “lễ vật thanh tẩy.” Cụm hiện hữu không phải một thuật ngữ nghi lễ tự nhiên và có thể làm thay đổi quan hệ nghĩa.
  - severity: low
    issue: Chú thích a dùng “nước ô uế”
    rationale: Cách nói này trong tiếng Việt dễ hiểu là nước bị bẩn, thay vì “nước của sự ô uế” hay nước dùng để xử lý ô uế.
