  to: 'Đây là quy định của luật pháp mà Đức Giê-hô-va đã truyền: “Hãy bảo dân Y-sơ-ra-ên đem đến cho con một con bò cái màu đỏ, toàn vẹn, không có khuyết tật và chưa từng mang ách.”'
