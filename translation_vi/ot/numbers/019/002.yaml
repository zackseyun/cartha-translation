base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: vi
  text: 'Đây là quy định của luật pháp mà Đức Giê-hô-va đã truyền: “Hãy bảo dân Y-sơ-ra-ên đem đến cho con một con bò cái màu đỏ, toàn vẹn, không có khuyết tật và chưa từng mang ách.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: quy định của luật pháp
  rationale: Giữ quan hệ sở hữu trong nguyên văn và phân biệt חֻקָּה (quy định, điều lệ) với תּוֹרָה (luật pháp, sự chỉ dạy).
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại cho một cộng đồng dân tộc, thay vì dịch máy móc là “các con trai của Y-sơ-ra-ên”.
- source_word: פָרָה אֲדֻמָּה
  choice: một con bò cái tơ màu đỏ
  rationale: פָרָה là bò cái; trong bối cảnh tế lễ, “bò cái tơ” là cách gọi tự nhiên, còn אֲדֻמָּה được giữ là “màu đỏ”.
- source_word: תְּמִימָה
  choice: toàn vẹn
  rationale: Giữ sắc thái tích cực của từ là nguyên vẹn, đầy đủ, đồng thời không đồng nhất nó với mệnh đề kế tiếp “không có khuyết tật”.
- source_word: עֹל
  choice: ách
  rationale: Chỉ chiếc ách lao động đặt lên gia súc; “mang ách” là thành ngữ rõ và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Chúa Trời
  rationale: Dùng dạng danh riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt để phản ánh việc nguyên văn dùng danh יהוה, không thay bằng một danh xưng chung.
- issue: Quan hệ giữa תְּמִימָה và אֵין בָּהּ מוּם
  choice: “toàn vẹn, không có khuyết tật”
  alternative: “không tì vết, không có khuyết tật”
  rationale: Giữ cả hai diễn đạt riêng biệt của tiếng Hê-bơ-rơ và tránh làm chúng thành hai cụm hoàn toàn đồng nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Chuyển công thức לֵאמֹר sang dấu hai chấm và lời dẫn trực tiếp tự nhiên; giữ mệnh lệnh ở ngôi nói với Môi-se qua “Hãy bảo... đem đến cho con”.
