base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: vi
  text: Ai chạm vào thi thể[a] của bất kỳ người nào[b] sẽ bị ô uế trong bảy ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “xác chết”; sát chữ: “người chết”.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ sát chữ là “của mọi sinh mạng/người thuộc loài người”, nghĩa là bất kỳ con người nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: Ai chạm vào
  rationale: Phân từ có mạo từ được dùng như danh từ với ý nghĩa khái quát. “Ai chạm vào” tự nhiên trong tiếng Việt và giữ được tính phổ quát của điều luật.
- source_word: בְּמֵת
  choice: thi thể
  rationale: מֵת chỉ người đã chết hoặc xác người chết. “Thi thể” diễn đạt rõ đối tượng cụ thể trong bối cảnh thanh sạch nghi lễ, với sắc thái trang trọng và tự nhiên.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: của bất cứ người nào
  rationale: Cụm từ chỉ bất kỳ con người nào, không giới hạn ở nam giới. Cách dịch này rõ phạm vi phổ quát và phù hợp tiếng Việt hiện đại.
- source_word: וְטָמֵא
  choice: sẽ bị ô uế
  rationale: Trong văn luật, động từ ở đây nêu tình trạng phát sinh do hành động vừa nói. “Sẽ bị ô uế” giữ sắc thái hệ quả pháp quy và thuật ngữ nghi lễ.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Giới từ “trong” làm rõ khoảng thời gian kéo dài của tình trạng ô uế, phù hợp cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch אָדָם trong ngữ cảnh luật pháp mang nghĩa khái quát
  choice: người
  alternative: người nam; con người
  rationale: Ở đây אָדָם chỉ một con người nói chung chứ không riêng nam giới. “Người” truyền đạt đúng phạm vi của điều luật mà không thêm sự phân biệt giới tính vốn không có trong nguồn.
- issue: Tính chất của טָמֵא
  choice: bị ô uế
  alternative: không thanh sạch; trở nên ô uế
  rationale: “Ô uế” là cách diễn đạt quen thuộc cho tình trạng nghi lễ trong Ngũ Kinh; câu không hàm ý tự động đồng nhất tình trạng này với tội lỗi đạo đức.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “thi thể” thay vì “xác” để giữ phẩm cách; dùng “ô uế” theo nghĩa nghi lễ của ngữ cảnh. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
