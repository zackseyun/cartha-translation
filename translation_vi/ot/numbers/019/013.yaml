source:
  edition: WLC
  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: vi
  text: Bất cứ ai chạm vào người chết, tức thi thể của một người đã chết, mà không tự thanh tẩy, thì đã làm ô uế Đền Tạm của Đức Giê-hô-va. Người ấy sẽ bị cắt khỏi Y-sơ-ra-ên. Vì nước tẩy uế[a] chưa được rảy trên người ấy, nên người ấy vẫn ô uế; sự ô uế của người ấy vẫn còn trên người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “nước ô uế”, tức loại nước dùng để thanh tẩy sự ô uế do tiếp xúc với xác chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: chạm vào người chết
  rationale: Diễn đạt trực tiếp sự tiếp xúc thể lý; phần đồng vị kế tiếp xác định rõ đây là thi thể người.
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: tức thi thể của một người đã chết
  rationale: Trong luật về ô uế do xác chết, נֶפֶשׁ chỉ thi thể; 'một người' truyền đạt nghĩa phổ quát của אָדָם bằng tiếng Việt tự nhiên.
- source_word: יִתְחַטָּא
  choice: tự thanh tẩy
  rationale: Động từ ở đây nói đến nghi thức thanh tẩy chứ không phải ăn năn về đạo đức.
- source_word: מִשְׁכַּן יְהוָה
  choice: Đền Tạm của Đức Giê-hô-va
  rationale: '''Đền Tạm'' là cách gọi rõ và quen thuộc cho nơi ngự dạng lều; dùng ''Đức Giê-hô-va'' để thể hiện danh riêng יהוה.'
- source_word: טִמֵּא
  choice: đã làm ô uế
  rationale: Thể piel diễn tả việc gây ô uế cho nơi thánh, nên 'làm ô uế' vừa chính xác vừa tự nhiên.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִיִּשְׂרָאֵל
  choice: Người ấy sẽ bị loại khỏi Y-sơ-ra-ên
  rationale: Giữ công thức hình phạt giao ước mà không xác định cách thức là xử tử hay khai trừ.
- source_word: מֵי נִדָּה
  choice: nước tẩy uế
  rationale: Chỉ loại nước được chuẩn bị để loại bỏ sự ô uế do xác chết; cách dịch ngắn gọn, dễ hiểu, đồng thời chú thích giữ nghĩa sát chữ.
- source_word: זֹרַק עָלָיו
  choice: được rảy trên người ấy
  rationale: Phản ánh hành động rảy nước trong nghi thức và quan hệ bị động theo văn cảnh.
- source_word: טָמֵא יִהְיֶה
  choice: người ấy vẫn ô uế
  rationale: Văn cảnh nhấn mạnh tình trạng ô uế tiếp tục tồn tại vì chưa được rảy nước.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: sự ô uế của người ấy vẫn còn trên mình
  rationale: Giữ cả ý tiếp diễn của עוֹד và hình ảnh sự ô uế còn bám trên người.
theological_decisions:
- issue: Ý nghĩa của hình phạt וְנִכְרְתָה, 'bị cắt khỏi'
  choice: sẽ bị loại khỏi Y-sơ-ra-ên
  alternative: sẽ bị xử tử; sẽ bị khai trừ khỏi cộng đồng
  rationale: Công thức Hê-bơ-rơ có sức nặng pháp lý và giao ước nhưng câu này không xác định cơ chế thi hành; bản dịch không giải quyết thay sự mơ hồ ấy.
- issue: Tính chất của sự ô uế
  choice: 'Dùng ngôn ngữ nghi lễ: ''thanh tẩy'', ''ô uế'', ''nước tẩy uế'''
  alternative: Diễn giải thành tội lỗi luân lý hoặc sự nhiễm bẩn vệ sinh
  rationale: Ngữ cảnh nói về tình trạng nghi lễ do tiếp xúc với thi thể, dù việc không tuân thủ cũng làm ô uế nơi thánh.
- issue: Cách thể hiện אָדָם số ít mang nghĩa khái quát
  choice: một người
  alternative: một người nam; loài người
  rationale: Trong tiếng Việt, 'một người' giữ nghĩa nhân loại phổ quát và không thêm giới tính mà nguyên ngữ trong ngữ cảnh này không nhấn mạnh.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng thuật ngữ nghi lễ nhất quán; tách câu dài của tiếng Hê-bơ-rơ thành ba câu tiếng Việt để tăng độ rõ mà không thay đổi quan hệ ý nghĩa.
