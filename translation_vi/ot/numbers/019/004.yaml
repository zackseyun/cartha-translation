base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: vi
  text: Rồi thầy tế lễ Ê-lê-a-sa sẽ dùng ngón tay lấy một ít máu của con bò cái và rảy một ít máu ấy bảy lần hướng về phía mặt trước của Lều Hội Kiến[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước Lều Hội Kiến.” Cụm từ Hê-bơ-rơ chỉ hướng về mặt trước của lều.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ... sẽ ... lấy
  rationale: Trong trình tự nghi lễ, waw đi với qatal diễn tả bước chỉ dẫn tiếp theo; “Rồi” và “sẽ” truyền đạt tự nhiên sắc thái tuần tự và quy định.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: thầy tế lễ Ê-lê-a-sa
  rationale: Giữ tên riêng theo lối phiên âm quen thuộc, đồng thời dịch chức danh כֹּהֵן bằng cách gọi rõ ràng, trang trọng trong tiếng Việt.
- source_word: מִדָּמָהּ
  choice: một ít máu của con bò / một ít máu ấy
  rationale: Tiền tố מִן có sắc thái phân lượng, nên dịch “một ít”; đại từ giống cái chỉ về con bò cái ở ngữ cảnh trước. Lần lặp thứ hai được giữ để bảo toàn điểm nhấn nghi lễ của nguyên văn.
- source_word: בְּאֶצְבָּעוֹ
  choice: dùng ngón tay
  rationale: בְּ ở đây diễn tả phương tiện; “dùng ngón tay” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: וְהִזָּה
  choice: và rảy
  rationale: נזה trong nghi lễ tư tế chỉ hành động rảy chất lỏng; “rảy” là từ chính xác, gọn và quen dùng.
- source_word: אֶל נֹכַח פְּנֵי
  choice: về phía trước
  rationale: Cụm từ diễn tả hướng nhắm về mặt trước của lều, không hàm ý đi vào bên trong.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Dịch sát danh xưng nơi Đức Chúa Trời gặp dân Ngài, bằng một danh xưng trang trọng và tương đối quen thuộc trong tiếng Việt.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Chuyển đạt trực tiếp con số và số lần của hành động.
theological_decisions:
- issue: Hướng rảy máu so với Lều Hội Kiến
  choice: về phía trước Lều Hội Kiến
  alternative: trước Lều Hội Kiến
  rationale: Giữ sắc thái định hướng của אֶל נֹכַח פְּנֵי, tránh quyết định rằng hành động nhất thiết diễn ra ngay trước lều.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc tuần tự của chỉ dẫn nghi lễ, đồng thời tránh các từ quá cổ hoặc cách diễn đạt mang sắc thái hệ phái.
