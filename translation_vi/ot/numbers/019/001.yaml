id: NUM.19.1
reference: Numbers 19:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời Đức Chúa Trời được dịch là “phán”, một cách diễn đạt trang trọng nhưng vẫn quen thuộc trong tiếng Việt; từ này phân biệt lời phát ngôn của Đức Chúa Trời với cách nói thông thường mà không thêm nội dung ngoài nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tetragrammaton, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: Trong tiếng Việt, “phán với” diễn đạt tự nhiên đối tượng tiếp nhận lời nói; liên từ và hai tên riêng bảo toàn việc cả Môi-se lẫn A-rôn đều là người được truyền phán.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Trong công thức dẫn lời, “rằng:” tự nhiên hơn “để nói” và báo hiệu trực tiếp lời phán tiếp theo ở câu sau.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” bảo toàn tư cách danh riêng và không thay bằng tước hiệu; hình thức phát âm cổ đại chính xác tuyệt đối vẫn không chắc chắn, nhưng “Yahweh” là cách phục nguyên học thuật phổ biến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” theo công thức lời nói thần linh; dùng dấu hai chấm vì לֵאמֹר mở sang nội dung lời phán ở câu kế tiếp. Tên Môi-se và A-rôn theo dạng quen dùng trong tiếng Việt.
