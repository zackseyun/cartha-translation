  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/הּ יְכַבֵּ֤ס בְּגָדָי/ו֙ בַּ/מַּ֔יִם וְ/רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/טָמֵ֖א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: vi
  text: Người thiêu con bò ấy phải giặt quần áo mình trong nước và tắm thân thể mình trong nước[a], rồi sẽ bị ô uế[b] cho đến chiều tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bằng nước” ở cả hai chỗ. Tiếng Hê-bơ-rơ sát nghĩa là “trong nước”.
    reason: lexical_alternative
  - marker: b
    text: “Ô uế” ở đây chỉ tình trạng không thanh sạch về nghi lễ, không nhất thiết hàm ý phạm tội về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: người thiêu con bò ấy
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ người thực hiện việc thiêu. Đại từ giống cái số ít quy chiếu về con bò cái đỏ; nêu rõ “con bò ấy” tự nhiên và tránh đại từ tiếng Việt mơ hồ.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: phải giặt quần áo mình
  rationale: Thể chưa hoàn thành mang lực quy định trong luật nghi lễ. “Phải” diễn đạt rõ nghĩa bắt buộc; “giặt” phù hợp riêng với quần áo.
- source_word: בַּמַּיִם
  choice: trong nước
  rationale: Giữ sát giới từ ב với mạo từ trong nguyên văn. Tiếng Việt không cần biểu thị mạo từ xác định; chú thích ghi nhận cách hiểu tự nhiên khác là “bằng nước”.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: và tắm thân thể mình
  rationale: “Tắm” phân biệt động từ רחץ dùng cho thân thể với כבס dùng cho quần áo. בשר trong ngữ cảnh này chỉ toàn thân, nên “thân thể” rõ hơn “thịt”.
- source_word: וְטָמֵא
  choice: rồi sẽ bị ô uế
  rationale: Mệnh đề nêu tình trạng nghi lễ tiếp theo. “Ô uế” là thuật ngữ quen thuộc trong văn cảnh luật thanh sạch, nhưng cần chú thích để tránh bị hiểu nhất thiết là tội lỗi đạo đức.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Diễn đạt tự nhiên giới hạn thời gian của tình trạng ô uế mà không diễn giải cụ thể thành lúc mặt trời lặn.
theological_decisions:
- issue: Ý nghĩa của טמא trong luật nghi lễ
  choice: bị ô uế
  alternative: không thanh sạch về nghi lễ
  rationale: “Bị ô uế” ngắn gọn và phù hợp văn phong Kinh Thánh tiếng Việt, trong khi chú thích bảo tồn ý nghĩa chuyên biệt về tình trạng nghi lễ và ngăn việc đồng nhất với lỗi đạo đức.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Dùng “phải” để thể hiện lực quy định; giữ sự lặp lại “trong nước” của nguyên văn và đặt dấu chú thích ngay sau cụm từ liên quan.
