  source_fidelity: 'Bản dịch phản ánh đầy đủ cấu trúc và nội dung tiếng Hê-bơ-rơ: người thực hiện việc thiêu con bò cái được nói đến, phải giặt quần áo và tắm thân thể trong nước, rồi ở tình trạng ô uế đến chiều tối. “Phải” chuyển tải phù hợp sắc thái quy định của thể chưa hoàn thành; sự lặp lại “trong nước” bảo tồn cách diễn đạt của nguyên văn.'
  naturalness: Văn phong luật nghi lễ trang trọng nhưng vẫn tự nhiên trong tiếng Việt hiện đại. “Giặt quần áo mình,” “tắm thân thể mình,” và “cho đến chiều tối” đều rõ nghĩa trong ngữ cảnh. “Bị ô uế” là lối dùng quen thuộc trong tiếng Việt Kinh Thánh và dễ được chú thích định hướng đúng là tình trạng nghi lễ.
