  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: vi
  text: Mọi vật chứa để ngỏ mà không có nắp được buộc chặt[a] trên đó đều bị ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nắp được gắn chặt” hoặc “vật che được niêm kín”; cụm từ Hê-bơ-rơ nói đến một vật che được giữ chắc trên vật chứa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל כְּלִי
  choice: Mọi vật chứa
  rationale: כֹל với danh từ số ít mang nghĩa phân phối là “mọi”; כְּלִי ở đây chỉ một đồ dùng có thể chứa đựng. Không nhất thiết phải dịch וְ thành “và” vì trong tiếng Việt, quan hệ tiếp nối với quy định trước đã rõ và cách bỏ liên từ tự nhiên hơn.
- source_word: פָתוּחַ
  choice: để ngỏ
  rationale: Diễn đạt trạng thái vật chứa đang mở, không được che kín; “để ngỏ” tự nhiên và chính xác hơn “mở” khi nói về vật chứa trong ngữ cảnh này.
- source_word: אֲשֶׁר אֵין
  choice: mà không có
  rationale: Giữ rõ mệnh đề quan hệ nói về sự thiếu vắng vật che đậy.
- source_word: צָמִיד פָּתִיל
  choice: nắp buộc chặt
  rationale: Cụm từ hiếm này chỉ vật che được giữ hoặc buộc chắc trên vật chứa. “Nắp buộc chặt” bảo lưu hình ảnh cụ thể mà không khẳng định quá mức về cơ chế niêm kín.
- source_word: עָלָיו
  choice: trên đó
  rationale: Phản ánh trực tiếp vị trí của nắp trên vật chứa và tránh đại từ mơ hồ.
- source_word: טָמֵא הוּא
  choice: đều bị ô uế
  rationale: “Ô uế” là cách diễn đạt trang trọng, quen thuộc trong luật thanh sạch; không thêm từ “nghi lễ” vì nguyên văn chỉ nêu tình trạng ô uế.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: ô uế
  alternative: ô uế về nghi lễ
  rationale: Ngữ cảnh liên quan đến luật thanh sạch, nhưng nguyên văn chỉ dùng טָמֵא. Bản dịch không thêm lời giải thích thần học vào chính văn.
- issue: Mức độ kín của vật che
  choice: nắp buộc chặt
  alternative: nắp đậy kín / nắp niêm kín
  rationale: Cụm Hê-bơ-rơ hàm ý vật che được giữ chắc, nhưng không xác định hoàn toàn đó là nắp theo kiểu hiện đại hay một lớp phủ được niêm kín; chú thích bảo lưu các khả năng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “vật chứa” để giữ phạm vi nghĩa rộng của כְּלִי; dùng “để ngỏ” và “nắp buộc chặt” nhằm tái hiện sự đối lập giữa vật chứa mở và vật chứa được che chắc.
