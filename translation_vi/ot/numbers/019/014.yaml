  text: זֹ֚את הַ/תּוֹרָ֔ה אָדָ֖ם כִּֽי יָמ֣וּת בְּ/אֹ֑הֶל כָּל הַ/בָּ֤א אֶל הָ/אֹ֨הֶל֙ וְ/כָל אֲשֶׁ֣ר בָּ/אֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: vi
  text: 'Đây là luật: Khi một người chết trong lều, tất cả những ai vào lều và tất cả những ai ở trong lều[a] sẽ bị ô uế trong bảy ngày.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và mọi người, mọi vật ở trong lều.” Cách diễn đạt Hê-bơ-rơ có thể mang nghĩa rộng hơn, nhưng sự song hành trong câu và động từ số ít ở đây nghiêng về những người có mặt; các vật dụng được nói rõ trong câu kế tiếp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Đây là luật
  rationale: תּוֹרָה ở đây dẫn vào quy định có tính ràng buộc về sự ô uế do xác chết; “luật” ngắn gọn, tự nhiên và phù hợp văn cảnh nghi lễ.
- source_word: אָדָם כִּי יָמוּת
  choice: Khi một người chết
  rationale: אָדָם được dùng theo nghĩa khái quát, không nhất thiết chỉ nam giới; “một người” chuyển tải tự nhiên phạm vi ấy trong tiếng Việt. כִּי với động từ chưa hoàn thành dẫn vào trường hợp pháp luật, nên dịch là “khi”.
- source_word: בְּאֹהֶל
  choice: trong lều
  rationale: Lần xuất hiện đầu không có mạo từ, giới thiệu một chiếc lều bất kỳ; tiếng Việt không cần thêm từ chỉ định.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: tất cả những ai vào lều
  rationale: Phân từ đi với כָּל chỉ bất cứ người nào bước vào; cách diễn đạt này tự nhiên và giữ lực khái quát của nguyên văn.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: và tất cả những ai ở trong lều
  rationale: Cụm אֲשֶׁר có thể rộng hơn và bao gồm cả vật, nhưng sự song hành với người đi vào cùng động từ số ít nghiêng về những người đang có mặt. Giữ chú thích để bảo toàn khả năng hiểu rộng của tiếng Hê-bơ-rơ.
- source_word: יִטְמָא
  choice: sẽ bị ô uế
  rationale: Trong luật thanh sạch nghi lễ, “bị ô uế” diễn đạt rõ tình trạng phát sinh do tiếp xúc hoàn cảnh; “sẽ” phù hợp một quy định áp dụng cho trường hợp được nêu.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Diễn đạt trực tiếp khoảng thời gian của tình trạng ô uế.
theological_decisions: []
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại, dễ hiểu. Dùng “một người” thay vì “một người đàn ông” vì אָדָם ở đây mang nghĩa nhân loại khái quát. Dấu chú thích [a] được đặt ngay sau cụm có khả năng hiểu theo nghĩa rộng.
