id: NUM.19.19
reference: Numbers 19:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: vi
  text: Người thanh sạch phải rảy nước ấy lên người ô uế vào ngày thứ ba và ngày thứ bảy; vào ngày thứ bảy, người ấy phải thanh tẩy[a] người ô uế. Người được thanh tẩy phải giặt quần áo, tắm bằng nước, rồi đến chiều tối sẽ thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tẩy sạch”. Động từ Hê-bơ-rơ ở đây cùng gốc với từ thường liên quan đến tội lỗi hoặc sự thanh tẩy, nhưng trong ngữ cảnh này nó chỉ việc thanh tẩy khỏi tình trạng ô uế theo nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: phải rảy nước ấy lên
  rationale: Động từ Hiphil của נזה trong nghi thức này chỉ việc rảy nước thanh tẩy. Tiếng Hê-bơ-rơ không nêu rõ tân ngữ, nhưng ngữ cảnh trực tiếp cho thấy đó là nước dùng để thanh tẩy; thêm “nước ấy” giúp câu tiếng Việt đầy đủ và tự nhiên.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: người thanh sạch / người ô uế
  rationale: Hai tính từ được dùng như danh từ, chỉ tình trạng thanh sạch hay ô uế về nghi lễ. “Người” giữ được nghĩa đại diện chung, không giới hạn vào nam giới.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: vào ngày thứ ba và ngày thứ bảy
  rationale: Cách diễn đạt trực tiếp, tự nhiên, đồng thời giữ rõ lịch trình của nghi thức.
- source_word: וְחִטְּאוֹ
  choice: phải thanh tẩy người ô uế
  rationale: Piel của חטא ở đây nói đến việc loại bỏ tình trạng ô uế theo nghi lễ, không nhất thiết nói đến sự tha thứ tội lỗi về phương diện đạo đức.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: phải giặt quần áo
  rationale: “Giặt quần áo” là cách nói hiện đại, tự nhiên và chính xác.
- source_word: וְרָחַץ בַּמַּיִם
  choice: tắm bằng nước
  rationale: Động từ רחץ trong chuỗi nghi thức này hàm ý tắm rửa thân thể; cách dịch này ngắn gọn và rõ nghĩa.
- source_word: וְטָהֵר בָּעָרֶב
  choice: đến chiều tối sẽ thanh sạch
  rationale: Diễn đạt thời điểm người ấy đạt lại tình trạng thanh sạch theo nghi lễ, thay vì ngụ ý rằng sự thanh sạch hoàn tất ngay khi tắm.
theological_decisions:
- issue: Bản chất của ngôn ngữ thanh tẩy trong חטא và טהר
  choice: Dịch theo nghĩa thanh tẩy khỏi ô uế nghi lễ
  alternative: Dịch là làm sạch khỏi tội lỗi hoặc chuộc tội
  rationale: Ngữ cảnh nói về sự ô uế do tử thi và nước thanh tẩy. Cách dịch mang nghĩa đạo đức hay chuộc tội sẽ đưa vào câu những khẳng định thần học mà bản văn không trực tiếp nêu.
- issue: Giống của הַטָּהֹר và הַטָּמֵא
  choice: Dùng “người” theo nghĩa đại diện chung
  alternative: Dùng “người đàn ông”
  rationale: Dù hình thức Hê-bơ-rơ là giống đực số ít, trong luật nghi lễ chúng có chức năng đại diện, không nhằm giới hạn đối tượng vào nam giới.
- issue: Chủ thể của các động từ giặt và tắm
  choice: Nêu rõ là “người được thanh tẩy”
  alternative: Giữ đại từ “người ấy”, có thể bị hiểu là người thanh sạch thực hiện việc rảy nước
  rationale: Sau hành động thanh tẩy do người thanh sạch thực hiện, ngữ cảnh nghi lễ cho thấy người vừa được thanh tẩy phải giặt quần áo và tắm. Nêu rõ chủ thể tránh sự mơ hồ không tự nhiên trong tiếng Việt mà không thay đổi diễn tiến của bản văn.
translation_notes:
  register: Văn phong luật nghi lễ trang trọng nhưng hiện đại. Dùng “thanh sạch”, “ô uế” và “thanh tẩy” nhất quán để phân biệt tình trạng nghi lễ với sự sạch sẽ thông thường; câu văn vẫn đủ rõ cho độc giả phổ thông.
