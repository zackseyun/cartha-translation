  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: vi
  text: Rồi thầy tế lễ phải lấy gỗ bá hương, cây bài hương và chỉ đỏ thắm, rồi ném chúng vào giữa đám lửa đang thiêu con bò cái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ... phải lấy
  rationale: Waw đi với động từ qatal tiếp nối trình tự nghi lễ; “rồi” diễn đạt thứ tự, còn “phải” thể hiện tính quy định trong tiếng Việt tự nhiên.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi phổ thông, trang trọng và rõ nghĩa cho כֹּהֵן trong bối cảnh phụng tự; tính xác định được thể hiện theo ngữ cảnh tiếng Việt.
- source_word: עֵץ אֶרֶז
  choice: gỗ bá hương
  rationale: Diễn đạt tự nhiên cấu trúc “gỗ của cây tuyết tùng/bá hương”; “bá hương” là tên gọi Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: וְאֵזוֹב
  choice: cây bài hương
  rationale: Tương đương truyền thống của אֵזוֹב trong tiếng Việt; giữ tên thực vật quy ước dù việc định danh chính xác còn được tranh luận.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: chỉ đỏ
  rationale: Cụm từ chỉ vật liệu sợi nhuộm màu đỏ thắm từ phẩm nhuộm; “chỉ đỏ” gọn, cụ thể và phù hợp với vật dùng trong nghi lễ.
- source_word: וְהִשְׁלִיךְ
  choice: ném
  rationale: Động từ Hiphil của שלך có nghĩa là ném/quăng; “ném” là cách nói hiện đại, trực tiếp.
- source_word: אֶל תּוֹךְ
  choice: vào giữa
  rationale: Giữ sắc thái đưa vật vào phần bên trong hoặc giữa tiến trình đang diễn ra, rõ hơn cách dịch đơn giản “vào”.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: chỗ con bò cái đang cháy
  rationale: שְׂרֵפָה chỉ sự hoặc quá trình thiêu đốt, còn פָּרָה là bò giống cái. Cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy các vật được ném vào giữa lúc con vật đang bị thiêu.
theological_decisions:
- issue: Cách dịch פָּרָה trong nghi thức thanh tẩy bằng bò cái đỏ
  choice: con bò cái
  alternative: con bò tơ cái
  rationale: פָּרָה xác định con vật thuộc giống cái nhưng tự nó không nhất thiết nhấn mạnh độ tuổi. “Bò cái” giữ nghĩa rộng của tiếng Hê-bơ-rơ; cách dịch truyền thống cụ thể hơn được ghi ở chú thích.
translation_notes:
  register: Văn phong nghi lễ trang trọng nhưng hiện đại. Dùng “thầy tế lễ” và các tên vật liệu quen thuộc trong tiếng Việt; tránh lối dịch quá cổ. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
