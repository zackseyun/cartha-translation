  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc điều kiện và trình tự nghi thức của nguyên văn Hê-bơ-rơ: người bị ô uế phải thanh tẩy mình bằng phương tiện được ám chỉ, vào ngày thứ ba và thứ bảy; kết quả là được thanh sạch, còn không làm vậy thì không thanh sạch. Cặp thuật ngữ “thanh tẩy mình” (יתחטא) và “được thanh sạch” (יטהר) phân biệt hợp lý hành động nghi thức với tình trạng đạt được.'
