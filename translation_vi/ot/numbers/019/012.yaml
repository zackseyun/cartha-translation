  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: vi
  text: Người ấy phải thanh tẩy mình bằng nước đó vào ngày thứ ba và ngày thứ bảy[a], rồi sẽ được thanh sạch; nhưng nếu không thanh tẩy mình vào ngày thứ ba và ngày thứ bảy[b], người ấy sẽ không được thanh sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là nước dùng để tẩy uế đã được chuẩn bị trước đó trong chương này.
    reason: cross_reference
  - marker: b
    text: Cũng có thể dịch là “làm cho mình sạch”. Động từ Hê-bơ-rơ ở đây chỉ việc trải qua sự thanh tẩy khỏi tình trạng ô uế về nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Người ấy
  rationale: Đại từ nhấn mạnh chỉ người bị ô uế đang được nói đến; “người ấy” tự nhiên hơn “ông ấy” trong quy định áp dụng chung mà vẫn giữ số ít.
- source_word: יִתְחַטָּא
  choice: thanh tẩy mình
  rationale: Dạng Hitpael của חטא trong nghi thức này nói đến việc chịu sự thanh tẩy khỏi ô uế, không mang nghĩa phạm tội. Cách dịch giữ sắc thái phản thân và tính nghi lễ.
- source_word: בּוֹ
  choice: bằng nước đó
  rationale: Đại từ chỉ phương tiện quy chiếu về nước dùng để tẩy uế đã được chuẩn bị trước đó. Nêu “nước” giúp câu tiếng Việt rõ nghĩa mà không thay đổi đối tượng quy chiếu.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: vào ngày thứ ba và ngày thứ bảy
  rationale: Giữ nguyên hai thời điểm và quan hệ phối hợp của nghi thức trong tiếng Hê-bơ-rơ.
- source_word: יִטְהָר
  choice: sẽ được thanh sạch
  rationale: טהר diễn tả tình trạng thanh sạch đạt được sau nghi thức; cách dịch này phân biệt kết quả với hành động יתחטא, “thanh tẩy mình”.
- source_word: וְאִם לֹא
  choice: nhưng nếu không
  rationale: Liên từ mở đầu điều kiện tương phản; “nhưng nếu” truyền đạt tự nhiên sắc thái cảnh báo.
theological_decisions:
- issue: Bản chất của ngôn ngữ thanh tẩy trong Dân Số 19
  choice: Diễn đạt theo phạm trù thanh tẩy và thanh sạch về nghi lễ.
  alternative: Diễn đạt như sự tha thứ tội lỗi hoặc sự thánh hóa nội tâm.
  rationale: Ngữ cảnh nói về sự ô uế do tiếp xúc với xác chết và nước dùng để tẩy uế; câu này không trực tiếp nói đến sự tha thứ về mặt đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thanh tẩy” và “thanh sạch” để phân biệt hành động nghi lễ với tình trạng đạt được; tránh từ ngữ gợi sự tha thứ tội lỗi khi nguyên văn chỉ nói đến sự thanh sạch nghi lễ.
