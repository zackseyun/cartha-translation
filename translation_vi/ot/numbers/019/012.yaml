  terminology: “Thanh tẩy,” “tẩy uế,” và “thanh sạch” giữ đúng bình diện nghi lễ của ngữ cảnh Dân Số 19, không chuyển nghĩa sang sự tha thứ đạo đức hay sự thanh hóa nội tâm. “Nước đó” là cách làm rõ quy chiếu của בוֹ mà vẫn phù hợp với chú thích liên văn.
