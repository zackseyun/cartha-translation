revisions:
- from: Bất cứ ai ở ngoài đồng trống[a] chạm vào người bị gươm giết, hoặc một xác chết[b], hoặc một khúc xương người[c], hoặc một ngôi mộ, thì sẽ bị ô uế trong bảy ngày.
  to: Bất cứ ai ở ngoài đồng trống[a] mà chạm vào người bị giết bằng gươm, hoặc một xác chết[b], hoặc một chiếc xương người[c], hoặc một ngôi mộ, thì sẽ bị ô uế trong bảy ngày.
  rationale: Chỉ điều chỉnh hai cụm từ để tiếng Việt tự nhiên hơn và để tránh thêm sắc thái “mảnh xương”; các lựa chọn về địa điểm, ô uế nghi lễ, tính khái quát của “người,” và các chú thích đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
