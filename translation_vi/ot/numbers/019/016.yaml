id: NUM.19.16
reference: Numbers 19:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: vi
  text: Bất cứ ai ở ngoài đồng trống[a] mà chạm vào người bị giết bằng gươm, hoặc một xác chết[b], hoặc một chiếc xương người[c], hoặc một ngôi mộ, thì sẽ bị ô uế trong bảy ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “trên mặt đồng,” một thành ngữ có nghĩa là ở nơi trống trải ngoài đồng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “một người chết” hoặc “một thi thể.”
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “một xương của con người”; từ được dùng ở đây chỉ con người nói chung, không riêng nam giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: Bất cứ ai ... chạm vào
  rationale: Cụm từ này có ý nghĩa phân phối và điều kiện trong luật lệ; cách dịch này tự nhiên trong tiếng Việt và giữ phạm vi áp dụng cho mọi người.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: ở ngoài đồng trống
  rationale: Nghĩa đen là “trên mặt đồng”; đây là thành ngữ chỉ nơi trống trải ngoài đồng, đối lập với bên trong một công trình.
- source_word: בַּחֲלַל חֶרֶב
  choice: người bị gươm giết
  rationale: חָלָל chỉ người bị giết hoặc đâm chết, còn חֶרֶב nêu phương tiện; “gươm” giữ hình ảnh cụ thể của nguyên văn.
- source_word: אוֹ בְמֵת
  choice: hoặc một xác chết
  rationale: מֵת trong ngữ cảnh ô uế có thể chỉ người chết hay thi thể; “xác chết” rõ ràng, phổ thông và phù hợp với hành động chạm vào.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: hoặc một khúc xương người
  rationale: עֶצֶם ở số ít chỉ một chiếc hoặc một phần xương, còn אָדָם mang nghĩa loài người nói chung chứ không riêng nam giới.
- source_word: אוֹ בְקָבֶר
  choice: hoặc một ngôi mộ
  rationale: קֶבֶר chỉ mộ hoặc nơi chôn cất; “ngôi mộ” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: thì sẽ bị ô uế trong bảy ngày
  rationale: Động từ chỉ tình trạng ô uế theo nghi lễ trong luật tế lễ; “sẽ bị ô uế” diễn đạt hệ quả pháp định mà không giải thích quá mức.
theological_decisions:
- issue: Ý nghĩa của אָדָם trong cụm עֶצֶם אָדָם
  choice: xương người
  alternative: xương đàn ông
  rationale: Trong quy định về hài cốt, אָדָם chỉ con người nói chung, không có căn cứ giới hạn vào nam giới.
- issue: Bản chất của tình trạng טמא
  choice: bị ô uế
  alternative: không thanh sạch về nghi lễ
  rationale: Giữ thuật ngữ truyền thống và sắc thái pháp lý của bản văn; ngữ cảnh chương 19 cho thấy đây là tình trạng ô uế theo nghi lễ mà không cần đưa phần giải thích vào chính câu.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, rõ nghĩa với độc giả phổ thông. Cấu trúc liệt kê của tiếng Hê-bơ-rơ được giữ lại; dấu phẩy sau cụm chỉ địa điểm được lược bỏ để câu tiếng Việt trôi chảy hơn.
