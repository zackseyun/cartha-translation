    issue: Cách diễn đạt “người bị gươm giết” chưa tự nhiên.
    rationale: Tiếng Việt hiện đại thường nói “người bị giết bằng gươm”; cách sửa không thay đổi ý nghĩa của בַּחֲלַל חֶרֶב.
  - severity: low
    issue: “Khúc xương người” thêm sắc thái một mảnh hay đoạn xương.
    rationale: עֶצֶם ở đây chỉ một xương người. “Một chiếc xương người” vừa tự nhiên vừa không thêm ý về xương bị vỡ hoặc chỉ là mảnh.
  revised_text: Bất cứ ai ở ngoài đồng trống[a] mà chạm vào người bị giết bằng gươm, hoặc một xác chết[b], hoặc một chiếc xương người[c], hoặc một ngôi mộ, thì sẽ bị ô uế trong bảy ngày.
