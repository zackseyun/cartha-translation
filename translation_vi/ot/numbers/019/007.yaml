revisions:
- from: Sau đó, thầy tế lễ phải giặt quần áo mình và tắm thân thể trong nước; rồi người được vào trại. Tuy nhiên, thầy tế lễ vẫn bị ô uế[a] cho đến chiều tối.
  to: Thầy tế lễ phải giặt quần áo mình và tắm rửa thân thể trong nước; sau đó người được vào trại. Tuy nhiên, thầy tế lễ vẫn sẽ ô uế[a] cho đến chiều.
  rationale: Loại bỏ mốc thời gian thêm ở đầu câu, dùng cách diễn đạt tự nhiên hơn cho việc tắm rửa, và diễn đạt tình trạng nghi lễ bằng “vẫn sẽ ô uế” sát với cấu trúc luật lệ Hê-bơ-rơ. Bản sửa vẫn giữ việc thầy tế lễ được vào trại sau khi tắm rửa, dù tình trạng ô uế kéo dài đến chiều.
