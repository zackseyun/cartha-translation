  text: וְ/כִבֶּ֨ס בְּגָדָ֜י/ו הַ/כֹּהֵ֗ן וְ/רָחַ֤ץ בְּשָׂר/וֹ֙ בַּ/מַּ֔יִם וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/טָמֵ֥א הַ/כֹּהֵ֖ן עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: vi
  text: Thầy tế lễ phải giặt quần áo mình và tắm rửa thân thể trong nước; sau đó người được vào trại. Tuy nhiên, thầy tế lễ vẫn sẽ ô uế[a] cho đến chiều.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ô uế” ở đây nói về tình trạng không thanh sạch theo nghi lễ, không nhất thiết là tội lỗi hay lỗi lầm về đạo đức.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: phải giặt quần áo mình
  rationale: Động từ כבס ở thể Piel chỉ việc giặt quần áo; trong văn luật lệ, “phải” diễn đạt tự nhiên tính bắt buộc của thủ tục.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ nghĩa, quen thuộc trong tiếng Việt hiện đại đối với כהן trong bối cảnh nghi lễ.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: và tắm thân thể trong nước
  rationale: בשר ở đây chỉ toàn thân, còn רחץ diễn tả việc tắm rửa; “thân thể” tránh sắc thái dễ gây hiểu sai của cách dịch sát là “thịt”.
- source_word: וְאַחַר יָבֹא אֶל־הַמַּחֲנֶה
  choice: rồi người được vào trại
  rationale: Cụm này nêu hành động tiếp theo sau khi tắm rửa; “được vào” truyền đạt hợp lý sự tái nhập được phép mà không biến nó thành một mệnh lệnh riêng.
- source_word: וְטָמֵא
  choice: vẫn bị ô uế
  rationale: טמא chỉ tình trạng ô uế theo nghi lễ. “Vẫn” làm rõ rằng việc được vào trại không đồng nghĩa tình trạng ấy đã chấm dứt.
- source_word: עַד הָעָרֶב
  choice: cho đến chiều tối
  rationale: Diễn đạt tự nhiên mốc kết thúc tình trạng ô uế trong tiếng Việt.
theological_decisions:
- issue: Bản chất của sự ô uế
  choice: tình trạng ô uế theo nghi lễ
  alternative: tội lỗi hay sự ô uế về đạo đức
  rationale: Trong Dân Số 19, טמא là tình trạng nghi lễ có thời hạn phát sinh trong quá trình thực hiện nghi thức, không nhất thiết hàm ý phạm tội hay lỗi đạo đức.
- issue: Việc vào trại trước khi hết thời gian ô uế
  choice: người được vào trại sau khi giặt và tắm, nhưng vẫn ô uế đến chiều tối
  alternative: chỉ được vào trại sau khi hết ô uế
  rationale: Trật tự cú pháp Hê-bơ-rơ đặt việc vào trại sau tắm rửa, rồi khẳng định riêng rằng thầy tế lễ còn ô uế đến chiều tối; bản dịch giữ nguyên sức căng này.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại; dùng “thầy tế lễ,” “quần áo,” “thân thể,” và “trại” để dễ hiểu. Dấu chấm tách hai mệnh đề nhằm làm rõ rằng được vào trại và vẫn ô uế đến chiều tối cùng được khẳng định.
