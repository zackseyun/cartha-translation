  text: וּ/נְתַתֶּ֣ם אֹתָ֔/הּ אֶל אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן וְ/הוֹצִ֤יא אֹתָ/הּ֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/שָׁחַ֥ט אֹתָ֖/הּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: vi
  text: Anh em phải giao con bò ấy cho thầy tế lễ Ê-lê-a-sa. Ông sẽ đưa nó ra ngoài trại, rồi nó sẽ bị giết trước mặt ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rồi ông sẽ giết nó trước mặt mình,” nếu hiểu Ê-lê-a-sa vẫn là chủ thể của động từ cuối.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: Anh em phải giao
  rationale: Động từ ngôi thứ hai số nhiều trong văn mệnh lệnh pháp luật được diễn đạt bằng “phải”; “anh em” giữ số nhiều và phù hợp với tiếng Việt hiện đại.
- source_word: אֹתָהּ
  choice: con bò ấy / nó
  rationale: Đại từ giống cái số ít chỉ con bò cái đỏ đã nói ở câu trước. Tiếng Việt tự nhiên dùng danh ngữ “con bò ấy”, rồi dùng “nó” để tránh lặp.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: thầy tế lễ Ê-lê-a-sa
  rationale: Dịch chức danh theo cách gọi quen thuộc, còn tên riêng được phiên âm sang tiếng Việt.
- source_word: וְהוֹצִיא
  choice: Ông sẽ đưa nó ra
  rationale: Thể Hiphil của יצא mang nghĩa khiến cho đi ra, nên “đưa ... ra” giữ được ý sai khiến và tự nhiên trong tiếng Việt.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Diễn đạt tự nhiên hướng chuyển động đến một nơi bên ngoài trại.
- source_word: וְשָׁחַט
  choice: nó sẽ bị giết
  rationale: Động từ chủ động ngôi thứ ba số ít không nêu chủ thể rõ ràng. Cấu trúc bị động tiếng Việt không xác định người thực hiện, tránh quyết đoán rằng Ê-lê-a-sa trực tiếp giết con bò.
- source_word: לְפָנָיו
  choice: trước mặt ông
  rationale: Giữ nghĩa ở phía trước hoặc trong sự hiện diện của Ê-lê-a-sa bằng một cách nói tự nhiên.
theological_decisions:
- issue: Ai là người giết con bò trong mệnh đề cuối
  choice: Không xác định người thực hiện; con bò bị giết trước mặt Ê-lê-a-sa.
  alternative: Ê-lê-a-sa sẽ giết con bò trước mặt mình.
  rationale: Tiếng Hê-bơ-rơ dùng động từ ngôi thứ ba số ít với chủ thể hàm ẩn, nên có thể hiểu Ê-lê-a-sa tiếp tục là chủ thể. Tuy nhiên, cụm “trước mặt ông” cũng tự nhiên cho thấy việc giết diễn ra trong sự hiện diện của ông. Bản dịch chính không khép lại sự nhập nhằng này, còn chú thích ghi nhận cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” thay cho đại từ cổ “các ngươi”; dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh quen thuộc. Dấu [a] được đặt ngay sau mệnh đề có cách hiểu khác.
