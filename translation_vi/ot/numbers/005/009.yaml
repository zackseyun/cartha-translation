  - severity: low
    issue: “người ấy” có thể tạm thời mơ hồ trong câu tiếng Việt dài.
    rationale: לוֹ trong nguyên văn quy về thầy tế lễ; dùng “thầy tế lễ ấy” bảo toàn và làm rõ quy chiếu.
