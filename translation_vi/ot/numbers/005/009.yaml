revisions:
- from: Mọi phần đóng góp lấy từ tất cả lễ vật thánh của con cái Y-sơ-ra-ên[a] mà họ dâng cho thầy tế lễ đều sẽ thuộc về người ấy.
  to: Mọi phần đóng góp trong mọi lễ vật thánh của con cái Y-sơ-ra-ên[a], mà họ dâng cho thầy tế lễ, sẽ thuộc về thầy tế lễ ấy.
  rationale: Sửa cấu trúc “lấy từ” thành “trong” để tránh thêm quan hệ trích xuất không có trong nguyên văn và để câu Việt tự nhiên hơn. Sắp lại mệnh đề quan hệ để “họ” quy chiếu trực tiếp về con cái Y-sơ-ra-ên, và thay “người ấy” bằng “thầy tế lễ ấy” để nêu rõ người sở hữu được nói đến trong mệnh đề pháp lý.
