  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: vi
  text: Mọi phần đóng góp trong mọi lễ vật thánh của con cái Y-sơ-ra-ên[a], mà họ dâng cho thầy tế lễ, sẽ thuộc về thầy tế lễ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Y-sơ-ra-ên”. Nguyên văn Hê-bơ-rơ là “các con trai của Y-sơ-ra-ên”, một cách gọi toàn thể dân Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: phần đóng góp
  rationale: Danh từ này chỉ phần được biệt riêng để dâng hoặc trao, thường là phần dành cho thầy tế lễ. “Phần đóng góp” giữ được ý nghĩa căn bản mà không dùng thuật ngữ cổ hoặc quá chuyên biệt.
- source_word: קָדְשֵׁי
  choice: lễ vật thánh
  rationale: Dạng số nhiều kết hợp ở đây chỉ những vật đã được biệt riêng và dâng hiến. “Lễ vật thánh” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh tế lễ.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cách dịch này giữ hình ảnh gia tộc của nguyên văn Hê-bơ-rơ, đồng thời trong tiếng Việt có thể chỉ toàn thể cộng đồng giao ước chứ không chỉ nam giới.
- source_word: יַקְרִיבוּ
  choice: dâng
  rationale: Hiphil của קרב theo nghĩa đen là “đưa đến gần”, nhưng trong ngữ cảnh tế lễ thường có nghĩa là đem trình hoặc dâng. “Dâng” là cách diễn đạt tự nhiên, trang trọng và giữ rõ sắc thái thờ phượng.
- source_word: לַכֹּהֵן
  choice: cho thầy tế lễ
  rationale: Giới từ đánh dấu người nhận lễ vật. “Cho thầy tế lễ” tự nhiên trong tiếng Việt, còn mệnh đề sau xác nhận quyền sở hữu.
- source_word: לוֹ יִהְיֶה
  choice: sẽ thuộc về người ấy
  rationale: Thành ngữ này diễn tả quyền sở hữu theo lối pháp lý. Cách dịch làm rõ rằng lễ vật trở thành phần của thầy tế lễ.
theological_decisions:
- issue: Cách gọi cộng đồng giao ước בְנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: người Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” bảo tồn hình ảnh huyết tộc trong nguyên văn mà không buộc cụm từ chỉ riêng nam giới; chú thích nêu cách dịch dân tộc học tự nhiên hơn.
- issue: Động từ tế lễ יַקְרִיבוּ
  choice: dâng
  alternative: đem đến gần
  rationale: Trong ngữ cảnh này, động từ mang nghĩa kỹ thuật là trình hoặc dâng lễ vật. Dịch sát hình thức “đem đến gần” có thể gây khó hiểu trong tiếng Việt; “dâng” chuyển tải chức năng tế lễ mà không thêm một nghi thức cụ thể.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo ngữ cảnh Ngũ Kinh; tránh thuật ngữ cổ “lễ vật dâng đưa qua đưa lại”. Cấu trúc câu giữ trọng tâm pháp lý: mọi phần dâng thuộc loại thánh được trao cho thầy tế lễ sẽ thuộc về người ấy.'
