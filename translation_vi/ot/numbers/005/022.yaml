language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: vi
  text: 'Nguyện cho nước mang lời nguyền này đi vào trong thân thể ngươi, làm bụng ngươi trướng lên và đùi ngươi teo đi.[a] Người phụ nữ phải đáp: “A-men, a-men.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “làm bụng trướng lên và làm đùi sa xuống.” Cách diễn đạt tiếng Hê-bơ-rơ ở đây khó hiểu và có thể là một lối nói tránh về tai họa đối với khả năng sinh sản.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: Nguyện cho ... đi vào
  rationale: Trong công thức thề-nguyền này, dạng động từ mang sắc thái cầu khiến hoặc tuyên lời nguyền, chứ không chỉ đơn thuần nói về tương lai.
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: nước mang lời nguyền này
  rationale: מְאָרְרִים chỉ thứ nước đem đến hoặc thi hành lời nguyền. Tiếng Việt tự nhiên dùng danh từ khối “nước” thay vì cố mô phỏng hình thức số nhiều của tiếng Hê-bơ-rơ.
- source_word: בְּמֵעַיִךְ
  choice: vào tận bên trong chị
  rationale: מֵעֶה chỉ các phần bên trong cơ thể. Cách dịch này giữ ý nghĩa thân thể nhưng tránh từ quá cổ hoặc quá chuyên môn y khoa.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: làm bụng chị trướng lên
  rationale: Giữ nghĩa trực tiếp của בֶּטֶן là “bụng” và diễn đạt động từ như hậu quả của lời nguyền.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: và đùi chị teo đi
  rationale: Cụm từ khó hiểu này có nghĩa đen gần với “làm đùi sa/ngã.” “Teo đi” truyền đạt sự suy tổn thân thể mà không xác định quá mức một chứng trạng y khoa.
- source_word: יָרֵךְ
  choice: đùi
  rationale: Đây là nghĩa từ vựng trực tiếp; từ này có thể được dùng như một cách nói tránh liên quan đến cơ quan sinh sản, nên bản dịch giữ cách diễn đạt kín đáo của nguyên văn.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: Người phụ nữ phải đáp
  rationale: Diễn đạt lời đáp bắt buộc trong nghi thức bằng tiếng Việt tự nhiên.
- source_word: אָמֵן אָמֵן
  choice: A-men! A-men!
  rationale: Giữ nguyên công thức phụng vụ được lặp đôi để bày tỏ sự long trọng và xác nhận lời thề-nguyền.
theological_decisions:
- issue: Ý nghĩa chính xác của những hậu quả trên thân thể
  choice: Dịch tương đối sát là “bụng ... trướng lên và đùi ... teo đi,” không xác định một bệnh trạng sinh sản cụ thể.
  alternative: Dịch rõ thành sẩy thai, vô sinh, sa tử cung hoặc bộ phận sinh dục suy tàn.
  rationale: Cụm tiếng Hê-bơ-rơ khó giải nghĩa và có thể là cách nói tránh về tai họa đối với khả năng sinh sản, nhưng câu này không xác định rõ hậu quả y khoa nào. Bản dịch vì thế bảo tồn sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chị” thể hiện ngôi thứ hai giống cái trong nguyên văn mà không dùng đại từ “ngươi” mang sắc thái cổ; câu nguyền vẫn giữ tính nghi lễ qua cấu trúc “Nguyện cho...” và lời đáp lặp đôi “A-men”.
