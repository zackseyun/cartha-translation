revisions:
- from: 'Nguyện cho nước mang lời nguyền này đi vào tận bên trong chị, làm bụng chị trướng lên và đùi chị teo đi.[a] Người phụ nữ phải đáp: “A-men! A-men!”'
  to: 'Nguyện cho nước mang lời nguyền này đi vào trong thân thể ngươi, làm bụng ngươi trướng lên và đùi ngươi teo đi.[a] Người phụ nữ phải đáp: “A-men, a-men.”'
  rationale: Chỉ sửa đại từ xưng hô để loại bỏ hàm ý quan hệ xã hội không có trong nguyên văn và phục hồi giọng nghi lễ phù hợp. Giữ “teo đi” trong bản văn chính để diễn đạt dễ hiểu mà không quyết định một nghĩa y khoa cụ thể; chú thích bảo lưu cách diễn đạt sát chữ và tính khó của thành ngữ Hê-bơ-rơ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:46Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng sắc thái cầu-nguyện/lời nguyền của וּבָאוּ, diễn đạt được các hậu quả thân thể mà không áp đặt một chẩn đoán sinh sản cụ thể, và giữ đúng lời đáp lặp đôi “A-men”. Tuy nhiên, “chị” là cách xưng hô mang tính quan hệ xã hội hiện đại, không phù hợp với lời nghi thức trực tiếp của bản văn và dễ tạo thêm hàm ý không có trong tiếng Hê-bơ-rơ.
  naturalness: Cấu trúc câu nhìn chung tự nhiên và trang trọng. Thay “chị” bằng “ngươi” tạo giọng văn nghi lễ/Kinh Thánh nhất quán, trực tiếp, và không gán quan hệ thân tộc hay tuổi tác giữa người nói với người phụ nữ.
  terminology: “Nước mang lời nguyền,” “bụng trướng lên,” “đùi ... teo đi,” và “A-men” đều phù hợp. “Ngươi” là đại từ trang trọng-văn chương phù hợp hơn trong ngữ cảnh lời nguyền nghi lễ; không nên dùng “chị”.
  issues:
