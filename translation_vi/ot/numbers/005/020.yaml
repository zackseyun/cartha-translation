source:
  edition: WLC
  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: vi
  text: Nhưng nếu chị đã đi chệch lối trong khi đang ở trong mối ràng buộc với chồng chị[a], nếu chị đã trở nên ô uế, và một người đàn ông đã ăn nằm với chị, ngoài chồng chị[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đã đi chệch lối ở dưới chồng chị.” “Ở dưới chồng” là thành ngữ trong bối cảnh hôn nhân, chỉ mối ràng buộc hôn nhân của người phụ nữ.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn gần nghĩa: “một người đàn ông đã đặt sự nằm của mình nơi chị”; đây là lối nói tránh trong tiếng Hebrew về quan hệ tình dục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂטִית
  choice: đã đi chệch đường
  rationale: Giữ hình ảnh đi lệch khỏi đường ngay của động từ Hebrew, đồng thời trong ngữ cảnh cho thấy sự lệch khỏi lòng chung thủy hôn nhân mà không diễn giải quá mức.
- source_word: תַּחַת אִישֵׁךְ
  choice: khi còn trong nghĩa vợ chồng với chồng mình
  rationale: תחת có nghĩa đen là “ở dưới”, nhưng tại đây chỉ địa vị và mối ràng buộc hôn nhân. Cách dịch này tự nhiên trong tiếng Việt và tránh tạo ấn tượng thuần túy về vị trí không gian.
- source_word: נִטְמֵאת
  choice: đã làm mình ô uế
  rationale: Dạng Niphal diễn tả việc người phụ nữ trở nên ô uế trong phạm trù nghi lễ-pháp lý gắn với hành vi tình dục; “làm mình ô uế” truyền đạt tự nhiên sắc thái ấy.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: một người đàn ông ... đã ăn nằm với chị
  rationale: Thành ngữ Hebrew có nghĩa đen gần với “một người đàn ông đã đặt sự nằm của mình nơi chị”, là lối nói tránh về quan hệ tình dục. “Ăn nằm với” vừa rõ nghĩa vừa giữ sắc thái uyển ngữ.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: khác ngoài chồng chị
  rationale: מבלעדי biểu thị sự loại trừ; cách diễn đạt này nói rõ đó là một người đàn ông không phải chồng của người phụ nữ.
theological_decisions:
- issue: Diễn đạt sự sai phạm hôn nhân mà không nói quá điều bản văn Hebrew xác quyết
  choice: Giữ ẩn dụ “đi chệch đường”, rồi làm rõ hành vi qua cụm “ăn nằm với”
  alternative: Dịch trực tiếp là “đã không chung thủy với chồng”
  rationale: Bản văn kết hợp hình ảnh lệch đường với một lối nói tránh về quan hệ tình dục. Cách chọn này giữ cấu trúc và sức căng của nguyên văn, không thêm phán đoán giáo lý hay luân lý ngoài lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chị” theo lời vị tư tế trực tiếp nói với người phụ nữ; giữ dấu gạch ngang cuối câu vì lời thề nguyền còn tiếp tục sang câu kế.
