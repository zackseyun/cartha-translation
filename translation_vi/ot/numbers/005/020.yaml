revisions:
- from: Nhưng nếu chị đã đi chệch đường khi còn trong nghĩa vợ chồng với chồng mình[a], đã làm mình ô uế, và một người đàn ông khác ngoài chồng chị đã ăn nằm với chị[b]—
  to: Nhưng nếu chị đã đi chệch lối trong khi đang ở trong mối ràng buộc với chồng chị[a], nếu chị đã trở nên ô uế, và một người đàn ông đã ăn nằm với chị, ngoài chồng chị[b]—
  rationale: Bản sửa giữ ẩn dụ “đi chệch lối”, thứ tự các mệnh đề và lối nói tránh về quan hệ tình dục của Hebrew. Đồng thời, bản sửa phản ánh đúng hơn thể “trở nên ô uế”, làm cho thành ngữ hôn nhân dễ hiểu trong tiếng Việt hiện đại qua bản văn chính và chú thích, và loại bỏ cách diễn đạt dư thừa.
