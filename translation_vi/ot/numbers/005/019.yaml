source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: vi
  text: 'Rồi thầy tế lễ phải bắt người nữ ấy thề và nói với nàng: “Nếu không có người đàn ông nào ăn nằm với nàng, và nếu nàng không lạc lối mà sa vào ô uế trong mối ràng buộc hôn nhân với chồng mình,[a] thì hãy được miễn khỏi những nước đắng gây lời nguyền này.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ở dưới chồng nàng,” một thành ngữ chỉ tình trạng và ràng buộc hôn nhân của người nữ.'
    reason: cultural_note
  - marker: b
    text: 'Nguyên văn sát: “những nước đắng, những thứ gây lời nguyền này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ אֹתָהּ
  choice: bắt người nữ ấy thề
  rationale: Dạng Hiphil của שבע mang ý khiến một người thề hoặc đặt người ấy dưới lời thề; cách diễn đạt này tự nhiên và giữ được sắc thái sai khiến.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: nếu không có người đàn ông nào ăn nằm với nàng
  rationale: שׁכב là lối nói giảm chỉ quan hệ tình dục. “Ăn nằm với” là thành ngữ tiếng Việt trang trọng vừa phải, rõ nghĩa mà không thô tục.
- source_word: שָׂטִית טֻמְאָה
  choice: nàng không đi chệch vào sự ô uế
  rationale: Giữ hình ảnh lệch khỏi đường ngay của שׂטה và phạm trù ô uế của טֻמְאָה, không thu hẹp nghĩa thành một thuật ngữ đạo đức hay nghi lễ duy nhất.
- source_word: תַּחַת אִישֵׁךְ
  choice: khi đang thuộc về chồng mình
  rationale: תחת ở đây là thành ngữ nói đến địa vị và ràng buộc hôn nhân. Dịch theo nghĩa thành ngữ tự nhiên hơn “ở dưới chồng” nhưng không thêm khái niệm ngoài văn cảnh.
- source_word: הִנָּקִי
  choice: sẽ không bị hại bởi
  rationale: Mệnh lệnh này diễn tả việc được miễn khỏi tác động của phép thử. Trong lời tuyên thệ có điều kiện, tiếng Việt dùng “sẽ không bị hại” tự nhiên và truyền đạt kết quả thực tế, dù nghĩa sát hơn là “hãy được miễn khỏi”.
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים הָאֵלֶּה
  choice: nước đắng gây lời nguyền này
  rationale: “Nước” là danh từ khối tự nhiên trong tiếng Việt dù tiếng Hê-bơ-rơ dùng hình thức số nhiều; phân từ הַמְאָרֲרִים mô tả nước là thứ làm lời nguyền phát tác.
theological_decisions:
- issue: Ngôn ngữ mô tả hành vi bị nghi ngờ
  choice: Giữ các cách nói “ăn nằm”, “đi chệch” và “ô uế” của nguyên văn.
  alternative: Dịch trực tiếp là “phạm tội ngoại tình”.
  rationale: Văn cảnh liên quan đến nghi vấn bất trung trong hôn nhân, nhưng câu này dùng chuỗi cách diễn đạt cụ thể chứ không dùng một thuật ngữ duy nhất tương đương “ngoại tình”; bản dịch không nên xác định quá mức.
- issue: Tác động của nước đắng
  choice: Dịch là “nước đắng gây lời nguyền” và diễn đạt kết quả vô tội là “không bị hại bởi”.
  alternative: “Nước đắng, tức những thứ đem lại lời nguyền” hoặc “hãy được miễn khỏi nước đắng”.
  rationale: Cách dịch giữ mối liên hệ giữa nước và lời nguyền nhưng không giải thích cơ chế của nghi lễ vượt quá nguyên văn.
translation_notes:
  register: Văn phong pháp lý-nghi lễ, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Đại từ “nàng” phù hợp với lời thầy tế lễ trực tiếp nói với người nữ; “người nữ ấy” tránh sắc thái lạnh hoặc miệt thị. Các dấu chú thích [a], [b] đều được đặt ngay tại cụm từ liên quan trong chính văn.
