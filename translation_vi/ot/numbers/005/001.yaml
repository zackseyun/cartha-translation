  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; theo truyền thống thường được dịch là “CHÚA”. Một cách phiên âm khác là “Giê-hô-va”.'
    reason: Nêu dạng nguyên ngữ và các cách dịch hoặc phiên âm quen thuộc của danh Đức Chúa Trời.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời Đức Chúa Trời được dịch là “phán”, vừa trang trọng, tự nhiên trong tiếng Việt, vừa đánh dấu một sự kiện lời nói mới trong mạch kể.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời dưới dạng chuyển tự phổ biến “Yahweh”, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu chỉ hành động nói hướng đến một người, “phán với” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn nhập lời nói, “rằng” tự nhiên hơn cách dịch máy móc “để nói” và chuẩn bị cho lời trực tiếp ở câu kế tiếp.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. Giữ “Yahweh” bảo toàn đặc tính danh riêng và không âm thầm thay nó bằng một tước hiệu; chú thích ghi nhận cách dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích. “Phán với … rằng” giữ sắc thái công thức dẫn nhập lời Đức Chúa Trời mà vẫn dễ hiểu đối với độc giả phổ thông.
