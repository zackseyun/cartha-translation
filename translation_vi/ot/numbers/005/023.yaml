translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thầy tế lễ” theo văn phong Kinh Thánh quen thuộc; diễn đạt hành động rửa chữ theo cách cụ thể, tự nhiên. Mọi dấu chú thích đều xuất hiện trong chính văn.
