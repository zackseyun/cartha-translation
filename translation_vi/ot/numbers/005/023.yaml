  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: vi
  text: Rồi thầy tế lễ phải viết những lời nguyền này trên cuộn sách, và rửa cho những chữ ấy trôi vào nước đắng.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lời nguyền thề này.” Từ Hê-bơ-rơ có thể chỉ lời nguyền gắn với một lời thề.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “xóa” hoặc “lau sạch.” Động từ Hê-bơ-rơ nói đến việc lau hay xóa những chữ đã viết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: Rồi ... phải viết
  rationale: Trong chuỗi chỉ dẫn nghi lễ, thể hoàn thành Qal có liên từ mang ý nghĩa hành động kế tiếp cần thực hiện; “Rồi ... phải viết” tự nhiên và giữ sắc thái quy định.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: những lời nguyền này
  rationale: אָלָה chỉ lời nguyền, thường là lời nguyền gắn với lời thề. Ngữ cảnh nói đến những hình phạt đã được tuyên; sắc thái lời thề được giữ trong chú thích.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi thông dụng, trang trọng và dễ hiểu đối với người thi hành chức vụ tế lễ trong nghi thức.
- source_word: בַּסֵּפֶר
  choice: vào cuộn sách
  rationale: סֵפֶר ở đây là vật liệu/văn bản dùng để viết, không phải sách đóng gáy theo nghĩa hiện đại; “cuộn sách” phù hợp bối cảnh cổ đại.
- source_word: וּמָחָה
  choice: rửa cho những chữ ấy trôi
  rationale: מחה có nghĩa lau, xóa hoặc tẩy đi. Trong nghi thức này, chữ viết được rửa khỏi cuộn sách và chuyển vào nước, nên cách diễn đạt này làm rõ hành động vật lý mà không thay đổi ý nghĩa.
- source_word: אֶל
  choice: vào
  rationale: Giới từ chỉ hướng chuyển động; ở đây diễn tả chữ viết bị rửa và hòa/chuyển vào nước.
- source_word: מֵי הַמָּרִים
  choice: nước đắng
  rationale: Cụm sở hữu có nghĩa sát là “nước của sự đắng” hoặc “nước đắng”; dạng số ít tập hợp là tự nhiên trong tiếng Việt.
