  - severity: low
    issue: Chú thích a dùng “những lời nguyền của lời thề này”
    rationale: Cách nói này không tự nhiên và không phản ánh tốt cụm הָאָלֹת הָאֵלֶּה, vốn là “những lời nguyền này,” với sắc thái có thể là những lời nguyền gắn với một lời thề.
