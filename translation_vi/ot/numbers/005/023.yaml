  rationale: Chỉnh giới từ vị trí cho tự nhiên và chính xác hơn trong tiếng Việt đối với hành động viết trên một cuộn văn bản; đồng thời chỉnh chú thích từ vựng về “lời nguyền thề” để giữ đúng sắc thái của từ Hê-bơ-rơ mà không thêm diễn giải.
  reviewer_model: gpt-5.6-terra
