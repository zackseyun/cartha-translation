  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: vi
  text: Nhưng nếu người phụ nữ ấy không làm mình ô uế và vẫn trong sạch, thì nàng sẽ được minh oan và sẽ thụ thai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “sẽ được gieo bằng hạt giống”, một thành ngữ chỉ việc thụ thai hoặc có con cái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mệnh đề điều kiện tương phản với trường hợp bị kết tội ở câu trước; “Nhưng nếu” diễn đạt tự nhiên lực đối lập trong ngữ cảnh.
- source_word: לֹא נִטְמְאָה
  choice: không làm mình ô uế
  rationale: Dạng Niphal của טמא có thể chỉ việc trở nên ô uế; trong bối cảnh cáo buộc ngoại tình, cách diễn đạt này giữ được sắc thái ô uế về luân lý và tình dục.
- source_word: הָאִשָּׁה
  choice: người phụ nữ ấy
  rationale: Danh từ xác định chỉ người phụ nữ đang chịu nghi thức thử nghiệm; “ấy” nối tự nhiên với ngữ cảnh trước.
- source_word: וּטְהֹרָה הִוא
  choice: và quả thật trong sạch
  rationale: טָהוֹר chỉ tình trạng sạch hay thanh sạch. “Trong sạch” phù hợp ngữ cảnh luân lý-nghi lễ; “quả thật” làm rõ đại từ nhấn mạnh הִוא mà không đổi nội dung.
- source_word: וְנִקְּתָה
  choice: thì nàng sẽ được miễn khỏi hình phạt
  rationale: Niphal của נקה có nghĩa được thoát, được miễn hay không phải chịu hậu quả. Trong ngữ cảnh đối lập với lời nguyền ở câu trước, cách dịch này cụ thể và tự nhiên hơn “được minh oan”, vốn dễ thu hẹp câu vào phạm vi tố tụng.
- source_word: וְנִזְרְעָה זָרַע
  choice: và sẽ thụ thai
  rationale: Thành ngữ nguyên văn là “được gieo bằng hạt giống”, chỉ việc thụ thai hoặc có dòng dõi. “Sẽ thụ thai” chuyển tải trực tiếp ý sinh sản mà không thêm ý chỉ có khả năng thụ thai.
theological_decisions:
- issue: Kết quả dành cho người phụ nữ được chứng thực là vô tội
  choice: Nàng không chịu hậu quả của lời nguyền và sẽ thụ thai.
  alternative: Nàng được minh oan và vẫn có khả năng sinh sản nói chung.
  rationale: וְנִקְּתָה đối lập với hình phạt ở câu trước, còn וְנִזְרְעָה זָרַע là ngôn ngữ về thụ thai. Bản dịch giữ lời khẳng định trực tiếp của câu, không làm yếu thành “có khả năng” và cũng không mở rộng thành chắc chắn sinh con.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “nàng” để tránh lặp “người phụ nữ ấy”; giữ sự phân biệt giữa “ô uế” và “trong sạch” trong bối cảnh nghi lễ-luân lý. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
