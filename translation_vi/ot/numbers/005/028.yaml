- from: Nhưng nếu người phụ nữ ấy không làm mình ô uế và quả thật trong sạch, thì nàng sẽ được miễn khỏi hình phạt và sẽ thụ thai.[a]
  to: Nhưng nếu người phụ nữ ấy không làm mình ô uế và vẫn trong sạch, thì nàng sẽ được minh oan và sẽ thụ thai[a].
  rationale: Bản sửa phục hồi sắc thái thanh minh của וְנִקְּתָה, không giới hạn thành việc miễn hình phạt. Cụm chỉ sinh sản vẫn được dịch trực tiếp là “sẽ thụ thai”; chú thích giữ thành ngữ Hê-bơ-rơ và nêu nghĩa của nó. Không thay đổi mức độ khẳng định của câu thành chỉ khả năng sinh sản.
