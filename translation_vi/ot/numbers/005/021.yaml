revisions:
- from: 'Bấy giờ, thầy tế lễ phải bắt người phụ nữ thề bằng lời thề nguyền rủa, rồi nói với nàng: “Nguyện Yahweh khiến ngươi trở thành một lời nguyền và một lời thề giữa dân ngươi[a], khi Yahweh làm cho đùi ngươi sa xuống[b] và bụng ngươi phình lên[c].”'
  to: 'Bấy giờ, thầy tế lễ sẽ cho người phụ nữ thề bằng lời thề kèm lời nguyền, rồi nói với nàng: “Nguyện Yahweh khiến ngươi trở nên lời nguyền và lời thề trong dân ngươi[a], khi Yahweh làm cho đùi ngươi rũ xuống[b] và bụng ngươi phình lên[c].”'
  rationale: Bản sửa làm rõ hành động nghi thức của vị tế lễ, cải thiện tính tự nhiên của tiếng Việt, và vẫn giữ nguyên tính bất định của lời nguyền thân thể trong nguyên ngữ. Các chú thích được giữ ở đúng vị trí và tiếp tục trình bày các khả năng đang tranh luận mà không áp đặt một cách hiểu giáo phái hay chẩn đoán y khoa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc nghi thức: vị tế lễ làm cho người phụ nữ thề, rồi tuyên bố lời nguyền nhân danh Yahweh. Các từ «đùi» và «bụng» cùng hình ảnh suy sụp/phình lên bảo toàn sự mơ hồ của tiếng Hê-bơ-rơ; không diễn giải thành sẩy thai hay vô sinh.'
  naturalness: Cần tránh «bắt ... thề», vì trong tiếng Việt hiện đại cụm này dễ nhấn mạnh sự cưỡng ép hơn là hành vi nghi lễ-pháp lý «administer an oath». «Cho ... thề» tự nhiên hơn trong ngữ cảnh này. «Lời thề kèm lời nguyền» cũng rõ và tự nhiên hơn «lời thề nguyền rủa».
  terminology: Giữ «Yahweh», «thầy tế lễ», «đùi», và «bụng». «Rũ xuống» diễn đạt được hình ảnh נֹפֶלֶת (rơi/sụp xuống) tự nhiên hơn «sa xuống», nhưng chú thích phải tiếp tục nêu tính khó và khả năng hàm ý sinh sản.
  issues:
  - severity: medium
    issue: «bắt người phụ nữ thề bằng lời thề nguyền rủa»
    rationale: Cách nói này hơi gượng và «bắt» có thể làm lệch trọng tâm sang cưỡng ép. Động từ Hiphil ở đây chỉ việc vị tế lễ đặt người phụ nữ dưới/làm cho người phụ nữ thề trong nghi thức.
  - severity: low
    issue: «đùi ngươi sa xuống»
    rationale: Dù bám hình ảnh «rơi xuống», cụm này kém tự nhiên trong tiếng Việt và có thể gợi một chẩn đoán giải phẫu quá cụ thể. «Rũ xuống» giữ hình ảnh suy sụp mà không xác định cơ chế.
