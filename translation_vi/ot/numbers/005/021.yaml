  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: vi
  text: 'Bấy giờ, thầy tế lễ sẽ cho người phụ nữ thề bằng lời thề kèm lời nguyền, rồi nói với nàng: “Nguyện Yahweh khiến ngươi trở nên lời nguyền và lời thề trong dân ngươi[a], khi Yahweh làm cho đùi ngươi rũ xuống[b] và bụng ngươi phình lên[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa là nàng sẽ trở thành một trường hợp điển hình mà dân chúng viện dẫn khi nguyền rủa hoặc thề.
    reason: lexical_alternative
  - marker: b
    text: “Đùi ngươi rũ xuống” dịch sát một thành ngữ Hê-bơ-rơ khó hiểu. Cụm này có thể nói giảm về cơ quan sinh sản, hoặc chỉ phần thân thể ấy bị teo tóp hay suy hoại.
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ cũng có thể được dịch là “ổ bụng” hoặc, theo một số cách hiểu, “tử cung”. Tác động chính xác về y khoa hay sinh sản của lời nguyền này vẫn còn được tranh luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: bắt ... thề
  rationale: Dạng Hiphil của שׁבע mang nghĩa khiến hoặc buộc người khác thề; cách diễn đạt này rõ ràng và giữ được tính pháp lý-nghi lễ.
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: bằng lời thề nguyền rủa
  rationale: Giữ cả hai yếu tố ‘lời thề’ và ‘lời nguyền’, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: một lời nguyền và một lời thề
  rationale: Bám sát công thức Hê-bơ-rơ và không tự ý giải nghĩa; chú thích nêu rõ hàm ý người phụ nữ trở thành một trường hợp điển hình được viện dẫn khi nguyền rủa hay thề.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: giữa dân ngươi
  rationale: Giữ sắc thái cộng đồng và công khai của cụm từ Hê-bơ-rơ.
- source_word: בְּתֵת
  choice: khi ... làm cho
  rationale: Diễn đạt giá trị hoàn cảnh/thời gian của giới từ ב đi với động từ nguyên mẫu cấu trúc.
- source_word: יְרֵךְ
  choice: đùi
  rationale: Đây là nghĩa trực tiếp của יָרֵךְ; từ này đôi khi có thể là cách nói giảm chỉ cơ quan sinh sản, nhưng bản văn chính không thu hẹp nghĩa theo một cách giải thích cụ thể.
- source_word: נֹפֶלֶת
  choice: sa xuống
  rationale: Giữ hình ảnh cơ bản của נפל, ‘rơi, sa xuống’, dù ý nghĩa chính xác của biểu hiện thân thể này không rõ; chú thích trình bày các khả năng.
- source_word: בֶּטֶן
  choice: bụng
  rationale: בֶּטֶן có thể chỉ bụng hoặc tử cung; ‘bụng’ là cách gọi tự nhiên, rộng nghĩa và không áp đặt một chẩn đoán sinh sản.
- source_word: צָבָה
  choice: phình lên
  rationale: Diễn tả sự trương hoặc sưng lên một cách rõ ràng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Mức độ cụ thể khi dịch hình phạt trên thân thể trong một câu khó và còn tranh luận
  choice: Giữ hình ảnh ‘đùi ... sa xuống’ và ‘bụng ... phình lên’, đồng thời giải thích sự bất định trong chú thích.
  alternative: Dịch cụ thể thành sẩy thai, teo tử cung hoặc vô sinh.
  rationale: Tiếng Hê-bơ-rơ không xác định rõ một cơ chế y khoa hay hậu quả sinh sản cụ thể. Cách dịch này bảo toàn sự mơ hồ và sức căng của bản văn, không đưa một cách giải thích đang tranh luận vào chính văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “thầy tế lễ” cho chức vụ nghi lễ, “người phụ nữ/nàng” để tránh lặp nặng nề, và “ngươi” trong lời tuyên thệ trực tiếp nhằm giữ sắc thái trang nghiêm của công thức nguyền rủa.
