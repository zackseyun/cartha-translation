  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: vi
  text: Rồi thầy tế lễ sẽ nhận từ tay người phụ nữ lễ vật ngũ cốc về sự ghen tuông, đưa lễ vật ngũ cốc ấy qua lại trước mặt Yahweh, rồi đem lễ vật ấy đến gần bàn thờ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ... sẽ nhận
  rationale: Waw + qatal tiếp tục trình tự nghi lễ. “Rồi” diễn đạt bước kế tiếp, còn “nhận từ tay” tự nhiên hơn “lấy từ tay” trong ngữ cảnh người phụ nữ trao lễ vật cho thầy tế lễ.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi hiện đại, trang trọng và dễ hiểu đối với chức viên phụng tự trong ngữ cảnh này.
- source_word: מִיַּד הָאִשָּׁה
  choice: từ tay người phụ nữ
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ và cho thấy lễ vật được nhận trực tiếp từ bà.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: lễ vật ngũ cốc về sự ghen tuông
  rationale: מִנְחָה trong luật tế lễ chỉ lễ vật bằng ngũ cốc; “về sự ghen tuông” giữ quan hệ sở thuộc rộng của cụm từ mà không thu hẹp quá mức ý nghĩa nghi lễ.
- source_word: וְהֵנִיף
  choice: đưa qua đưa lại
  rationale: Hiphil của נוף chỉ động tác nghi lễ thường được hiểu là đưa lễ vật qua đưa lại; cách diễn đạt này rõ nghĩa hơn động từ đơn “vẫy” trong tiếng Việt.
- source_word: הַמִּנְחָה
  choice: lễ vật ngũ cốc ấy
  rationale: Lặp lại loại lễ vật như nguyên văn, đồng thời thêm “ấy” để liên kết tự nhiên với lần nhắc trước.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ cách nói phụng tự chỉ hành động được thực hiện trong sự hiện diện của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được ghi trực tiếp bằng Tứ Tự Danh trong nguyên văn.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: rồi đem nó đến gần bàn thờ
  rationale: Giữ sắc thái gây khiến của קרב, nghĩa là đem lễ vật lại gần bàn thờ, thay vì diễn giải thành việc dâng trên bàn thờ.
theological_decisions:
- issue: Cách dịch danh xưng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יְהוָה; “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của מִנְחַת הַקְּנָאֹת
  choice: lễ vật ngũ cốc về sự ghen tuông
  alternative: lễ vật ngũ cốc vì lòng ghen / lễ vật ghen tuông
  rationale: Cấu trúc sở thuộc có thể liên hệ lễ vật với sự ghen tuông theo nhiều sắc thái; bản dịch giữ cách diễn đạt tương đối mở, không quyết định đó là lòng ghen của người chồng hay một đặc tính nội tại của lễ vật.
translation_notes:
  register: Văn phong luật nghi lễ, trang trọng nhưng dùng cú pháp tiếng Việt hiện đại. “Đưa qua đưa lại” làm rõ động tác nghi lễ mà không thêm hướng chuyển động không có trong câu; “đến gần bàn thờ” giữ sắc thái nguyên ngữ và tránh ngụ ý rằng lễ vật đã được đặt hay thiêu trên bàn thờ ở bước này.
