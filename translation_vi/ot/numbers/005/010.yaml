    rationale: לוֹ יִהְיוּ là công thức sở hữu, và chủ ngữ của mệnh đề là “các vật thánh của người ấy.” Câu nháp không sai nghĩa thực tế, nhưng làm mờ sự lặp lại có chủ ý của công thức “thuộc về người ấy.”
  - severity: low
