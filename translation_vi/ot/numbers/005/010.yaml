base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: vi
  text: Những vật thánh của mỗi người sẽ thuộc về người ấy[a]. Điều gì người nào trao cho thầy tế lễ thì sẽ thuộc về thầy tế lễ ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “các vật thánh của người ấy.” Cụm từ này chỉ những vật được biệt riêng làm lễ vật thánh.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn chỉ nói: “sẽ thuộc về người ấy.” Theo ngữ cảnh, “người ấy” ở vế cuối chỉ thầy tế lễ.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: mỗi người / người ấy
  rationale: Danh từ giống đực số ít được dùng theo nghĩa phân phối trong điều luật. Tiếng Việt không bắt buộc đánh dấu giới tính ở đây; “mỗi người” diễn đạt tự nhiên và chính xác, còn “người ấy” nối với chủ thể trong mệnh đề quan hệ.
- source_word: קֳדָשָׁיו
  choice: những lễ vật thánh của mình
  rationale: Số nhiều của קֹדֶשׁ ở đây chỉ những vật được biệt riêng làm của thánh. “Lễ vật thánh” truyền đạt rõ bối cảnh tế tự hơn cách dịch sát chữ “những vật thánh”.
- source_word: לוֹ יִהְיוּ
  choice: sẽ có ... của mình
  rationale: Cấu trúc Hê-bơ-rơ biểu thị quyền sở hữu. Cách diễn đạt này giữ được ý rằng các lễ vật thánh gắn với người dâng, đồng thời tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: bất cứ thứ gì người ấy trao cho thầy tế lễ
  rationale: Mệnh đề quan hệ mang nghĩa khái quát; “bất cứ thứ gì” thể hiện phạm vi mở của quy định. “Thầy tế lễ” giữ danh từ xác định số ít trong ngữ cảnh.
- source_word: לוֹ יִהְיֶה
  choice: sẽ thuộc về thầy tế lễ
  rationale: Đại từ Hê-bơ-rơ chỉ nói “thuộc về người ấy/người đó”, nhưng tiền ngữ gần nhất là thầy tế lễ. Lặp danh từ trong bản dịch giúp tiếng Việt rõ nghĩa; chú thích ghi nhận sự súc tích và khả năng mơ hồ về mặt hình thức của nguyên văn.
theological_decisions:
- issue: Chủ thể sở hữu trong hai mệnh đề
  choice: Mệnh đề đầu nói đến người có lễ vật thánh; mệnh đề cuối nói đến thầy tế lễ nhận vật được trao.
  alternative: Giữ cả hai đại từ sở hữu là “của người ấy/thuộc về người ấy”, như hình thức súc tích của nguyên văn.
  rationale: Mạch cú pháp đặt לַכֹּהֵן (“cho thầy tế lễ”) ngay trước לוֹ יִהְיֶה, nên thầy tế lễ là tiền ngữ tự nhiên của đại từ cuối. Tuy nhiên, nguyên văn dùng cùng một dạng đại từ sở hữu ở cả hai vế, vì vậy sự chuyển đổi chủ thể được nêu trong chú thích thay vì bị che khuất.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Dùng “thầy tế lễ” theo cách gọi Kinh Thánh quen thuộc; tránh lối Hán-Việt quá nặng. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
