review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý pháp lý cơ bản, nhưng vế đầu “Mỗi người sẽ có...” diễn giải cấu trúc sở hữu יותר tự do so với nguyên văn “các vật thánh của người ấy sẽ thuộc về người ấy.” Vế sau nên tránh để “người ấy” có thể bị hiểu là người dâng, đồng thời ghi chú chính xác hơn tính súc tích của đại từ Hê-bơ-rơ.
  naturalness: “Lễ vật thánh” và “thầy tế lễ” tự nhiên trong văn phong Kinh Thánh Việt hiện đại. Cấu trúc đảo nhẹ ở bản sửa giúp phản ánh nguyên văn mà vẫn rõ ràng, trôi chảy.
  terminology: Giữ “vật thánh” trong chính văn là sát với קֳדָשָׁיו; chú thích giải thích đây là những vật được biệt riêng/dâng làm lễ vật. Giữ “thầy tế lễ” cho כֹּהֵן. Không cần áp đặt cách giải thích giáo phái.
  issues:
