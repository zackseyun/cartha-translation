- from: Mỗi người sẽ có những lễ vật thánh của mình[a]; bất cứ thứ gì người ấy trao cho thầy tế lễ thì sẽ thuộc về thầy tế lễ[b].
  to: Những vật thánh của mỗi người sẽ thuộc về người ấy[a]. Điều gì người nào trao cho thầy tế lễ thì sẽ thuộc về thầy tế lễ ấy[b].
  rationale: Bản sửa tái tạo hai lần công thức sở hữu của tiếng Hê-bơ-rơ, giữ số nhiều của “các vật thánh,” và làm rõ trong tiếng Việt rằng vật được trao thuộc về thầy tế lễ. Chú thích [b] vẫn bảo tồn sự súc tích về mặt hình thức của nguyên văn mà không để chính văn Việt ngữ mơ hồ.
  reviewer_model: gpt-5.6-terra
