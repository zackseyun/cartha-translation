language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: vi
  text: '“Hãy nói với con cái Y-sơ-ra-ên rằng: Nếu một người nam hay người nữ phạm bất cứ tội nào mà người ta thường phạm[a], qua đó bội tín với ĐỨC CHÚA, thì người ấy có tội.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ có thể dịch sát là “bất cứ tội lỗi nào của loài người”; từ “con người” ở đây chỉ nhân loại nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Thể mệnh lệnh Piel được diễn đạt tự nhiên bằng “Hãy nói” trong công thức truyền lệnh trực tiếp.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh gia tộc-giao ước của nguyên ngữ, đồng thời là cách nói trang trọng và quen thuộc trong tiếng Việt.
- source_word: אִישׁ אֽוֹ אִשָּׁה
  choice: một người nam hay người nữ
  rationale: Giữ rõ cặp nam–nữ trong tiếng Hê-bơ-rơ và cho thấy luật áp dụng cho cả hai.
- source_word: כִּי יַעֲשׂוּ
  choice: Khi ... phạm
  rationale: Dù động từ ở số nhiều do cấu trúc phân phối, tiếng Việt tự nhiên dùng chủ ngữ số ít; “khi” phù hợp văn phong luật tình huống.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: bất cứ tội nào con người thường phạm
  rationale: Diễn đạt הָאָדָם theo nghĩa loài người nói chung; thêm “thường phạm” làm rõ quan hệ ngữ nghĩa tự nhiên của cụm từ mà không giới hạn tội vào nam giới.
- source_word: לִמְעֹל מַעַל
  choice: tức là bất trung
  rationale: Cấu trúc động từ nguyên mẫu kèm danh từ cùng gốc nhấn mạnh hành vi vi phạm lòng trung tín; “bất trung” giữ sắc thái quan hệ và giao ước.
- source_word: בַּיהוָה
  choice: với Đức Giê-hô-va
  rationale: Giới từ trong thành ngữ מעל ב־ chỉ đối tượng bị phản bội; “bất trung với” là kết hợp từ tự nhiên trong tiếng Việt. Danh Đức Giê-hô-va biểu thị יהוה một cách rõ ràng.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: thì người ấy mắc tội
  rationale: נפש ở đây chỉ chính cá nhân, không phải “linh hồn” theo nghĩa kỹ thuật; “mắc tội” diễn đạt trạng thái có tội và chịu trách nhiệm.
theological_decisions:
- issue: Cách dịch יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA; Yahweh
  rationale: Dùng danh xưng riêng quen thuộc trong tiếng Việt để phân biệt יהוה với danh hiệu אֲדֹנָי, đồng thời không che khuất tên riêng trong nguyên ngữ.
- issue: Nghĩa của הָאָדָם trong cụm luật pháp tổng quát
  choice: con người
  alternative: loài người; người ta
  rationale: Ở đây từ này mang nghĩa bao quát nhân loại, không chỉ người nam; “con người” vừa chính xác vừa tự nhiên.
- issue: Quan hệ giữa tội đối với người khác và sự bất trung với Đức Giê-hô-va
  choice: giữ mệnh đề giải thích “tức là bất trung với Đức Giê-hô-va”
  alternative: 'dịch thành một hành vi bổ sung: “và bất trung...”'
  rationale: 'לִמְעֹל diễn tả đặc tính hoặc hệ quả của việc phạm tội: tội ấy là hành vi bất trung với Đức Giê-hô-va. Bản dịch không thu hẹp loại tội cũng không tách thành hai điều kiện độc lập.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lời truyền phán và ngôn ngữ luật pháp, nhưng tránh các cách nói cổ như “phạm sự lỗi” hoặc hiểu נפש là “linh hồn” theo nghĩa bản thể học.
