revisions:
- from: '“Hãy nói với con cái Israel: Khi một người nam hay người nữ phạm bất cứ tội nào con người thường phạm[a], tức là bất trung với Đức Giê-hô-va, thì người ấy mắc tội.”'
  to: '“Hãy nói với con cái Y-sơ-ra-ên rằng: Nếu một người nam hay người nữ phạm bất cứ tội nào mà người ta thường phạm[a], qua đó bội tín với ĐỨC CHÚA, thì người ấy có tội.”'
  rationale: Bản sửa thay danh xưng riêng bằng “ĐỨC CHÚA” theo quy ước POB; diễn đạt mối liên hệ giữa hành vi phạm tội và sự bội tín bằng “qua đó bội tín”; và chỉnh chú thích để phản ánh chính xác lựa chọn dịch thuật. Không thay đổi phạm vi phổ quát của luật đối với nam và nữ, cũng không thu hẹp loại tội được nói đến.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:40Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa danh xưng יהוה để nhất quán với quy ước của POB là “ĐỨC CHÚA”. Cụm מִכָּל־חַטֹּאת הָאָדָם nói đến các tội lỗi thuộc phạm vi con người/loài người nói chung; cách diễn đạt “mà người ta thường phạm” truyền đạt tự nhiên ý thành ngữ nhưng không nên trình bày như thể “thường” là một từ có mặt riêng trong nguyên văn. לִמְעֹל מַעַל nhấn mạnh sự bội tín đối với Đức Chúa; “bội tín” giữ rõ hơn sắc thái giao ước.
  naturalness: Bản sửa giữ văn phong luật lệ trang trọng, hiện đại. “Một người nam hay người nữ” và “người ấy có tội” là tự nhiên, rõ nghĩa. “Con cái Y-sơ-ra-ên” bảo lưu cách gọi gia tộc-giao ước của nguyên ngữ trong lối văn Kinh Thánh tiếng Việt.
  terminology: Dùng “ĐỨC CHÚA” cho יהוה theo audit trail của POB, thay vì “Đức Giê-hô-va”. Dùng “bội tín” cho מעל để tránh làm yếu nghĩa phản bội lòng trung thành/giao ước. “Người ấy có tội” diễn đạt tình trạng אשמה mà không áp đặt nghĩa kỹ thuật cho נֶפֶשׁ.
  issues:
  - severity: medium
    issue: Danh xưng יהוה được dịch là “Đức Giê-hô-va”.
    rationale: Điều này không nhất quán với quyết định thuật ngữ của English POB, nơi יהוה được dịch là “the LORD”; trong tiếng Việt POB tương ứng phù hợp là “ĐỨC CHÚA”.
  - severity: low
    issue: “tức là bất trung” làm mệnh đề bội tín có sắc thái chú giải đồng nhất hóa quá trực tiếp.
    rationale: Nguyên ngữ dùng cụm nguyên mẫu chỉ cách thức/đặc tính của việc phạm tội. “qua đó bội tín” phản ánh liên hệ này tự nhiên hơn, đồng thời giữ lực nhấn của cụm cùng gốc מעל.
  - severity: low
    issue: Chú thích mô tả “có thể hiểu sát hơn” chưa phân biệt rõ cách dịch thành ngữ ở câu chính với từ ngữ nguyên văn.
    rationale: Chú thích sửa lại để nêu bản dịch sát của cụm Hê-bơ-rơ, trong khi câu chính dùng thành ngữ tiếng Việt tự nhiên.
