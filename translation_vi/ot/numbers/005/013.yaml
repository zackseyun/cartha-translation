source:
  edition: WLC
  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: vi
  text: mà một người đàn ông nằm với nàng, có xuất tinh[a], việc ấy bị che khuất khỏi mắt chồng nàng, và nàng được giấu kín[b], nàng đã trở nên ô uế; không có nhân chứng chống lại nàng[c], và nàng không bị bắt gặp[d]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát mặt chữ: “sự nằm của tinh dịch”, tức là giao hợp có xuất tinh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nàng tự giấu mình” hoặc “nàng bị che khuất”.'
    reason: alternative_reading
  - marker: c
    text: 'Hoặc: “không có nhân chứng liên quan đến nàng”.'
    reason: alternative_reading
  - marker: d
    text: 'Hoặc: “nàng không bị tóm giữ”; một số người hiểu hàm ý là “nàng không bị cưỡng ép”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: một người đàn ông nằm với nàng
  rationale: Giữ thành ngữ Hê-bơ-rơ “nằm với” trong ngữ cảnh quan hệ tình dục, đồng thời diễn đạt đúng giống và số của אִישׁ.
- source_word: שִׁכְבַת זֶרַע
  choice: và xuất tinh
  rationale: Cụm từ theo sát mặt chữ là “sự nằm của tinh dịch”, chỉ việc giao hợp có xuất tinh. Cách dịch này rõ ràng, tự nhiên và vẫn giữ chi tiết có ý nghĩa trong luật thanh sạch.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: việc ấy bị che khuất khỏi mắt chồng nàng
  rationale: Giữ thể bị động và hình ảnh “khỏi mắt” của nguyên văn, không giản lược thành việc người chồng chỉ đơn thuần không biết.
- source_word: וְנִסְתְּרָה
  choice: nàng làm việc ấy cách kín đáo
  rationale: Diễn đạt tự nhiên ý hành vi diễn ra trong kín đáo; chú thích bảo lưu khả năng hiểu sát hình thái bị động/phản thân là “nàng được che khuất” hoặc “nàng ẩn mình”.
- source_word: וְהִיא נִטְמָאָה
  choice: đã trở nên ô uế
  rationale: “Ô uế” giữ ngôn ngữ thanh sạch nghi lễ và luân lý của טמא mà không tăng sắc thái lên án quá mức.
- source_word: וְעֵד אֵין בָּהּ
  choice: không có nhân chứng chống lại nàng
  rationale: Thể hiện chức năng pháp lý của lời chứng; chú thích giữ nghĩa rộng hơn “liên quan đến nàng”.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: nàng không bị bắt gặp
  rationale: Trong mạch văn về hành vi không có nhân chứng, “bị bắt gặp” tự nhiên và phù hợp hơn “bị bắt giữ”; chú thích bảo lưu nghĩa “bị cưỡng ép” mà một số cách hiểu đề xuất.
theological_decisions:
- issue: Ngôn ngữ về tình trạng טמא
  choice: đã trở nên ô uế
  alternative: đã bị làm nhơ nhuốc
  rationale: “Ô uế” bảo tồn phạm trù thanh sạch của luật pháp, không biến câu này thành một phán đoán tu từ mạnh hơn nguyên văn.
- issue: Ý nghĩa của לֹא נִתְפָּשָׂה
  choice: nàng không bị bắt gặp
  alternative: nàng không bị cưỡng ép
  rationale: Ngữ cảnh nhấn mạnh việc không có bằng chứng hay nhân chứng, nên nghĩa “không bị bắt gặp” được ưu tiên. Tuy nhiên, động từ có thể mang nghĩa “bị tóm/bị giữ”, từ đó nảy sinh cách hiểu liên quan đến cưỡng ép; khả năng ấy được ghi trong chú thích thay vì bị loại bỏ.
- issue: Chủ thể và sắc thái của וְנִסְתְּרָה
  choice: nàng làm việc ấy cách kín đáo
  alternative: nàng ẩn mình / nàng được che khuất
  rationale: Bản dịch chính truyền đạt chức năng của mệnh đề trong tình huống pháp lý, còn chú thích giữ sự mơ hồ giữa sắc thái bị động và phản thân của dạng Nifal.
translation_notes:
  register: Văn phong pháp lý trang nghiêm nhưng hiện đại. Dùng “nàng” để duy trì mạch quy chiếu đến người vợ trong câu dài; dùng “nằm với” và “xuất tinh” nhằm vừa giữ thành ngữ Kinh Thánh vừa diễn đạt rõ ràng, không uyển ngữ quá mức. Dấu gạch ngang cuối câu cho thấy mệnh đề còn tiếp sang câu kế.
