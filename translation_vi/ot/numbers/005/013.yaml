  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng khung pháp lý của câu, giữ được chi tiết về giao hợp, sự việc bị giấu khỏi người chồng, tình trạng ô uế, sự vắng mặt của nhân chứng và việc không bị bắt gặp. Tuy nhiên, “nàng làm việc ấy cách kín đáo” chuyển dạng Nifal của וְנִסְתְּרָה thành một hành động chủ động của người phụ nữ, đồng thời thêm rõ “việc ấy” không có trong mệnh đề này. Nên giữ sắc thái bị động/phản thân không xác định của nguyên văn.
  naturalness: “Nàng được giấu kín” là cách nói tự nhiên, trang trọng vừa phải trong văn cảnh pháp lý Kinh Thánh và tránh quy cho nàng một hành động chủ động. “Nằm với nàng, có xuất tinh” rõ nghĩa hơn cấu trúc “nằm với nàng và xuất tinh”, vốn có thể khiến động từ thứ hai mang chủ ngữ nam giới quá trực tiếp.
  terminology: “Ô uế” phù hợp với ngôn ngữ thanh sạch nghi lễ của טמא. “Nhân chứng chống lại nàng” và “không bị bắt gặp” phù hợp văn cảnh pháp lý. Các chú thích nên bảo lưu khả năng “bị tóm giữ/cưỡng ép” như một cách hiểu thay thế, không đưa vào bản văn chính.
