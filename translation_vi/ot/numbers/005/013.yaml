  - severity: low
    issue: “Nằm với nàng và xuất tinh” có thể gán động từ “xuất tinh” trực tiếp cho người đàn ông hơn mức cấu trúc danh ngữ שִׁכְבַת זֶרַע.
    rationale: Cụm Hebrew theo nghĩa đen là “sự nằm của hạt giống/tinh dịch”, một thành ngữ về giao hợp có xuất tinh. “Có xuất tinh” giữ nội dung mà ít tái cấu trúc cú pháp hơn.
