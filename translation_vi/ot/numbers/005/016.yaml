revisions:
- from: Bấy giờ, thầy tế lễ phải đưa người phụ nữ ấy đến gần và cho nàng đứng trước mặt Đức Giê-hô-va[a].
  to: Thầy tế lễ sẽ đưa người phụ nữ ấy đến gần và cho người phụ nữ ấy đứng trước mặt Yahweh[a].
  rationale: Bản sửa giữ sát nghĩa “đưa đến gần” (הִקְרִיב) và lực khiến của “cho ... đứng” (הֶעֱמִיד), đồng thời dùng “sẽ” cho mệnh đề nghi lễ. Danh thần được chuẩn hóa là “Yahweh” theo nguồn. Không thêm chi tiết về thủ tục khảo nghiệm trong văn cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng hai hành động Hiphil: tư tế đưa người phụ nữ đến gần và khiến bà đứng trước YHWH. Tuy nhiên, “phải” có thể làm mạnh sắc thái bắt buộc hơn hình thức chưa hoàn thành mang tính quy định/tương lai trong nguyên văn; “sẽ” phù hợp hơn với trình tự nghi lễ. Danh YHWH nên được nhất quán chuyển là “Yahweh” theo quyết định nguồn và bản tiếng Anh.'
  naturalness: “Bấy giờ” và đại từ “nàng” hơi thiên về văn phong kể chuyện/literary và không cần thiết trong một chỉ dẫn nghi lễ. Câu sửa dùng cách diễn đạt hiện đại, trang trọng, rõ chủ ngữ và đối tượng.
  terminology: “Thầy tế lễ” là cách gọi dễ hiểu và phù hợp cho הַכֹּהֵן. Thay “Đức Giê-hô-va” bằng “Yahweh” để phản ánh trực tiếp chính sách danh thần của nguồn; chú thích giải thích YHWH và các cách chuyển truyền thống.
  issues:
  - severity: medium
    issue: Danh YHWH được dịch là “Đức Giê-hô-va” thay vì “Yahweh”.
    rationale: Nguồn tiếng Anh và quyết định thuật ngữ quy định chuyển יהוה là “Yahweh”. “Giê-hô-va” là một dạng đọc truyền thống khác, nên không nên làm bản văn chính khi nguồn đã chọn “Yahweh”.
  - severity: low
    issue: “Phải” và “Bấy giờ” thêm sắc thái không cần thiết; “nàng” ít hiện đại.
    rationale: Liên từ וְ chỉ sự nối tiếp đơn giản, còn hình thức động từ phù hợp với thì tương lai/quy định trong trình tự. “Sẽ”, bỏ “Bấy giờ”, và lặp lại danh ngữ giúp câu trung tính, hiện đại hơn.
  revised_text: Thầy tế lễ sẽ đưa người phụ nữ ấy đến gần và cho người phụ nữ ấy đứng trước mặt Yahweh[a].
