base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: vi
  text: Thầy tế lễ sẽ đưa người phụ nữ ấy đến gần và cho người phụ nữ ấy đứng trước mặt Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH.” Danh này thường được phiên âm là “Yahweh”; theo truyền thống thường được dịch là “CHÚA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: đưa người phụ nữ ấy đến gần
  rationale: Dạng Hiphil của קרב mang nghĩa “đưa đến gần”; cách dịch này giữ sắc thái không gian trong nguyên văn, còn “người phụ nữ ấy” làm rõ đối tượng giống cái theo văn cảnh.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi tự nhiên, quen thuộc trong tiếng Việt đối với כֹּהֵן trong bối cảnh nghi lễ của Ít-ra-ên.
- source_word: וְהֶעֱמִדָהּ
  choice: cho nàng đứng
  rationale: Dạng Hiphil của עמד có nghĩa khiến hoặc cho ai đứng. “Cho nàng đứng” giữ lực gây khiến mà vẫn tự nhiên, đồng thời tránh sắc thái cưỡng ép mạnh hơn mức nguyên văn tất yếu biểu đạt.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Diễn đạt vị trí trong sự hiện diện của một người; “trước mặt” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là dạng danh xưng quen thuộc trong tiếng Việt, còn chú thích nêu rõ dạng Hê-bơ-rơ và phương án phiên âm khác.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh bốn phụ âm YHWH. Bản dịch giữ danh riêng bằng dạng tiếng Việt quen thuộc “Đức Giê-hô-va”, không âm thầm thay bằng tước hiệu; chú thích bảo tồn phương án phiên âm “Yahweh” và truyền thống dịch “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bấy giờ” nối tiếp thủ tục pháp lý-nghi lễ trong văn cảnh; “nàng” tránh lặp nặng nề sau “người phụ nữ ấy” mà vẫn giữ chỉ dấu giống cái.
