revisions:
- from: Rồi thầy tế lễ sẽ cho người phụ nữ uống nước đắng gây lời nguyền[a], và nước gây lời nguyền ấy sẽ vào trong nàng, gây nên sự cay đắng.[b]
  to: Rồi thầy tế lễ sẽ cho người phụ nữ uống nước đắng gây ra lời nguyền[a], và nước gây ra lời nguyền ấy sẽ đi vào người phụ nữ ấy để gây cay đắng.[b]
  rationale: Chỉnh nhẹ để làm rõ quan hệ ngữ nghĩa của “gây lời nguyền” và dùng cách diễn đạt tự nhiên hơn cho việc nước đi vào thân thể người phụ nữ. Bản chính vẫn giữ cách hiểu kết quả của לְמָרִים; chú thích bảo lưu các khả năng dịch sát và tính không xác định của hậu quả.
  reviewer_model: gpt-5.6-terra
