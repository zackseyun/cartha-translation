  text: וְ/הִשְׁקָה֙ אֶת הָ֣/אִשָּׁ֔ה אֶת מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִ֑ים וּ/בָ֥אוּ בָ֛/הּ הַ/מַּ֥יִם הַֽ/מְאָרֲרִ֖ים לְ/מָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: vi
  text: Rồi thầy tế lễ sẽ cho người phụ nữ uống nước đắng gây ra lời nguyền[a], và nước gây ra lời nguyền ấy sẽ đi vào người phụ nữ ấy để gây cay đắng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nước của sự cay đắng đem lại lời nguyền.” Tiếng Hê-bơ-rơ dùng dạng số nhiều của từ “nước”, một cách nói thông thường khi chỉ nước.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn có thể dịch sát hơn: “nước gây lời nguyền sẽ đi vào người phụ nữ ấy thành sự cay đắng” hoặc “để gây cay đắng.” Cụm từ không nói rõ hậu quả cụ thể là gì.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: sẽ cho ... uống
  rationale: Dạng Hiphil của שׁקה mang nghĩa khiến hoặc cho ai uống; “cho người phụ nữ uống” tự nhiên trong tiếng Việt và giữ được ý gây khiến.
- source_word: הָאִשָּׁה
  choice: người phụ nữ
  rationale: Danh từ xác định được dịch trực tiếp, không khái quát hóa.
- source_word: מֵי הַמָּרִים
  choice: nước đắng
  rationale: Cụm sở thuộc theo nghĩa đen là “nước của sự cay đắng”; tiếng Việt tự nhiên dùng danh từ khối số ít “nước” với tính từ “đắng”.
- source_word: הַמְאָרֲרִים
  choice: gây lời nguyền
  rationale: Phân từ từ ארר mô tả nước như phương tiện đem lại hoặc làm ứng nghiệm lời nguyền, thay vì nhất thiết nói bản thân nước bị nguyền rủa.
- source_word: וּבָאוּ בָהּ
  choice: sẽ vào trong nàng
  rationale: בוא đi với ב diễn tả sự đi vào trong thân thể; cách dịch này giữ hình ảnh cụ thể của nguyên văn.
- source_word: לְמָרִים
  choice: gây nên sự cay đắng
  rationale: Giữ danh từ trừu tượng “sự cay đắng” và hiểu לְ theo kết quả hoặc tác động, nhưng không xác định cụ thể hậu quả sinh lý.
theological_decisions:
- issue: Bản chất của ngôn ngữ lời nguyền trong nghi thức
  choice: Dịch nước là thứ “gây lời nguyền”.
  alternative: “nước bị nguyền rủa” hoặc “nước của sự cay đắng đem lại lời nguyền”
  rationale: Phân từ Hê-bơ-rơ từ ארר có thể mô tả vai trò chuyển tải hoặc thực hiện lời nguyền. Cách dịch này tránh hàm ý ma thuật không có trong câu, đồng thời giữ nguyên sức nặng pháp lý-nghi lễ.
- issue: Ý nghĩa của לְמָרִים ở cuối câu
  choice: “gây nên sự cay đắng”
  alternative: “một cách đắng cay”, “thành sự cay đắng”, hoặc “để gây cay đắng”
  rationale: Cụm Hê-bơ-rơ ngắn và có thể chỉ kết quả, mục đích hoặc tác động. Bản dịch chính diễn đạt tự nhiên nhưng chú thích bảo lưu độ mở của nguyên văn, không đồng nhất “cay đắng” với một triệu chứng cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo ngữ cảnh trực tiếp của nghi thức dù chủ thể chỉ được biểu thị bằng động từ ngôi thứ ba trong câu; dùng “nàng” ở vế sau để tránh lặp nặng nhưng vẫn giữ sắc thái trang trọng. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
