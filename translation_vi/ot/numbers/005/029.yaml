  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: vi
  text: Đây là luật về sự ghen tuông[a], khi một người vợ đi chệch đường trong khi còn với chồng mình[b] và bị ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là dạng số nhiều, có thể dịch là “những sự ghen tuông”; có lẽ đây là tên gọi kỹ thuật của thủ tục pháp lý này.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “ở dưới chồng mình”, một thành ngữ chỉ việc người vợ đang ở trong mối ràng buộc hôn nhân với chồng.'
    reason: cultural_note
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Đây là luật về
  rationale: Công thức tóm kết điều luật; cách diễn đạt này vừa tự nhiên trong tiếng Việt vừa giữ sắc thái pháp lý của תּוֹרָה.
- source_word: הַקְּנָאֹת
  choice: sự ghen tuông
  rationale: Danh từ ở dạng số nhiều trong tiếng Hê-bơ-rơ, nhưng tại đây có lẽ là nhãn kỹ thuật cho toàn bộ thủ tục liên quan đến sự ghen tuông; tiếng Việt tự nhiên dùng danh từ khối số ít.
- source_word: אֲשֶׁר
  choice: khi
  rationale: Tiểu từ quan hệ mở đầu hoàn cảnh mà điều luật áp dụng; “khi” diễn đạt rõ chức năng này.
- source_word: תִּשְׂטֶה
  choice: lìa bỏ đường ngay
  rationale: Động từ mang hình ảnh quay lệch hoặc đi chệch đường, trong ngữ cảnh chỉ sự bất tín trong hôn nhân; lựa chọn này giữ phép ẩn dụ mà không nói cụ thể hơn nguyên văn.
- source_word: אִשָּׁה
  choice: một người vợ
  rationale: Dù từ này cũng có thể nghĩa là “người phụ nữ”, cụm từ tiếp theo xác định rõ quan hệ hôn nhân.
- source_word: תַּחַת אִישָׁהּ
  choice: trong khi đang thuộc về chồng mình
  rationale: Nghĩa đen là “ở dưới chồng mình”; đây là thành ngữ chỉ người phụ nữ đang ở trong mối ràng buộc hôn nhân. Bản dịch tránh cách nói tiếng Việt dễ gây hiểu lầm về vị trí thể chất.
- source_word: וְנִטְמָאָה
  choice: và bị ô uế
  rationale: Giữ ngôn ngữ ô uế của động từ טמא ở thể Niphal, không thu hẹp thành ô uế nghi lễ hay diễn giải thẳng thành phạm tội ngoại tình.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật về người vợ bị nghi bất tín
  choice: bị ô uế
  alternative: phạm tội ngoại tình; trở nên không thanh sạch
  rationale: Ngữ cảnh liên quan đến sự bất tín tình dục, nhưng nguyên văn dùng phạm trù ô uế. Cách dịch này giữ nguyên sức căng thần học và không xác định cụ thể hơn câu Hê-bơ-rơ.
- issue: Ý nghĩa của תַּחַת אִישָׁהּ trong quan hệ hôn nhân
  choice: trong khi đang thuộc về chồng mình
  alternative: ở dưới chồng mình; dưới quyền chồng mình
  rationale: Cụm từ nói đến mối ràng buộc hôn nhân, có thể hàm ý địa vị hoặc thẩm quyền. Bản dịch chính diễn đạt quan hệ ấy bằng tiếng Việt tự nhiên nhưng không biến câu thành một tuyên bố giáo lý tổng quát về quyền hành trong hôn nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lìa bỏ đường ngay” giữ hình ảnh đi chệch hướng của nguyên văn; “bị ô uế” bảo tồn thuật ngữ thần học-pháp lý mà không diễn giải quá mức.
