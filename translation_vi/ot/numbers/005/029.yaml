revisions:
- from: Đây là luật về sự ghen tuông[a], khi một người vợ lìa bỏ đường ngay trong khi đang thuộc về chồng mình[b] và bị ô uế.
  to: Đây là luật về sự ghen tuông[a], khi một người vợ đi chệch đường trong khi còn với chồng mình[b] và bị ô uế.
  rationale: Sửa động từ thành “đi chệch đường” để duy trì phép ẩn dụ của nguyên văn mà không thêm “đường ngay” hay xác định thẳng là ngoại tình. Sửa thành ngữ hôn nhân để tránh sắc thái sở hữu của “thuộc về”, đồng thời chú thích nghĩa đen và ý nghĩa trong ngữ cảnh. Giữ “bị ô uế” để bảo toàn tính mơ hồ có chủ ý của ngôn ngữ Hê-bơ-rơ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:50Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc tóm kết pháp lý của câu và bảo tồn ngôn ngữ “ô uế” (וְנִטְמָאָה), không diễn giải thành một cáo buộc cụ thể hơn. Tuy nhiên, “lìa bỏ đường ngay” không phải là cách chuyển tự nhiên, sát chức năng của שׂטה trong ngữ cảnh này; nó thêm sắc thái “đường ngay” không được nêu rõ. “Trong khi đang thuộc về chồng mình” cũng dễ gợi ý sở hữu cá nhân hơn là thành ngữ về tình trạng hôn nhân của תַּחַת אִישָׁהּ.
  naturalness: 'Cần chỉnh để tiếng Việt hiện đại, trang trọng mà không gượng: “đi chệch đường” giữ được ẩn dụ đi lệch/đi lạc; “khi còn với chồng mình” diễn đạt tự nhiên tình trạng hôn nhân. Chú thích giải thích nghĩa đen và phạm vi thành ngữ.'
  terminology: “Luật về sự ghen tuông” phù hợp với תּוֹרַת הַקְּנָאֹת, đồng thời chú thích đúng rằng dạng Hê-bơ-rơ là số nhiều và có thể là nhãn kỹ thuật. “Bị ô uế” thích hợp hơn các cách nói thu hẹp như “phạm tội ngoại tình” hay chỉ nghi lễ.
  issues:
