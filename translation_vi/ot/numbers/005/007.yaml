base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: vi
  text: thì họ phải xưng nhận tội mình đã phạm; người ấy phải hoàn trả đầy đủ khoản phải bồi thường vì lỗi mình[a], cộng thêm một phần năm vào khoản đó, rồi trao toàn bộ khoản ấy cho người mình đã đắc tội[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ cũng có thể dịch là “hoàn trả đầy đủ khoản mình mắc nợ” hoặc “hoàn trả khoản bồi thường.” Trong câu này, từ אָשָׁם nói đến nghĩa vụ bồi hoàn do lỗi gây ra, chứ không phải lễ vật chuộc lỗi.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “người mà đối với người ấy mình đã mắc lỗi.” Cách nói Hê-bơ-rơ xác định người nhận là người mà kẻ phạm lỗi đã mang tội hoặc trách nhiệm đối với họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: thì họ phải xưng nhận
  rationale: Động từ Hitpael của ידה ở đây chỉ việc công khai nhìn nhận tội lỗi. “Phải” thể hiện tính quy định của luật, còn “thì” nối hành động này với điều kiện và trình tự trong văn cảnh.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: tội mình đã phạm
  rationale: חַטָּאת có thể chỉ tội hoặc hành vi sai trái; kết hợp với עשה, cách nói tự nhiên trong tiếng Việt là “tội … đã phạm”.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: người ấy phải hoàn trả đầy đủ khoản phải bồi thường vì lỗi mình
  rationale: Hiphil của שוב trong ngữ cảnh này có nghĩa hoàn trả. אָשָׁם chỉ trách nhiệm hay khoản bồi thường phát sinh từ lỗi, còn בְּרֹאשׁוֹ chỉ khoản gốc phải được hoàn trả đầy đủ. Cách dịch này giữ mối liên hệ với lỗi phạm mà không biến khoản hoàn trả thành lễ vật hiến tế.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: cộng thêm một phần năm
  rationale: Cụm từ quy định phải thêm một phần năm của khoản gốc, tức hai mươi phần trăm.
- source_word: וְנָתַן
  choice: rồi trao số đó
  rationale: נתן có nghĩa là trao hoặc đưa. “Số đó” làm rõ đối tượng được trao là toàn bộ khoản hoàn trả vừa nêu, gồm khoản gốc và phần cộng thêm.
- source_word: לַאֲשֶׁר אָשַׁם לוֹ
  choice: cho người mình đã đắc tội
  rationale: Cấu trúc Hê-bơ-rơ mô tả người mà đối với họ kẻ phạm lỗi đã mắc tội hoặc mang trách nhiệm. “Người mình đã đắc tội” tự nhiên trong tiếng Việt và vẫn giữ sắc thái lỗi phạm, thay vì chỉ nói chung là bên bị thiệt hại.
theological_decisions:
- issue: Ý nghĩa của אָשָׁם trong ngữ cảnh bồi hoàn
  choice: trách nhiệm và khoản phải bồi thường phát sinh từ lỗi, không phải lễ vật chuộc lỗi
  alternative: lễ vật chuộc lỗi
  rationale: Mạch câu nói đến việc hoàn trả khoản gốc, cộng thêm một phần năm và trao cho người bị đắc tội. Vì vậy, ở đây אָשָׁם chỉ nghĩa vụ bồi hoàn do lỗi gây ra, dù từ này ở những văn cảnh khác có thể chỉ lễ vật chuộc lỗi.
- issue: Sự chuyển đổi từ chủ ngữ số nhiều sang số ít
  choice: giữ “họ” ở việc xưng tội rồi chuyển sang “người ấy” ở nghĩa vụ hoàn trả
  alternative: đồng nhất toàn câu thành một chủ ngữ số ít hoặc số nhiều
  rationale: Bản Hê-bơ-rơ chuyển từ động từ số nhiều וְהִתְוַדּוּ sang các động từ số ít וְהֵשִׁיב và וְנָתַן. Bản dịch giữ sự chuyển đổi này nhưng dùng “người ấy” để câu tiếng Việt dễ hiểu.
translation_notes:
  register: 'Văn phong luật pháp trang trọng nhưng dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng “xưng nhận,” “hoàn trả,” và “đắc tội” để giữ sắc thái đạo đức lẫn nghĩa vụ bồi hoàn; tránh thuật ngữ giáo phái. Dấu chấm phẩy giúp thể hiện hai bước liên tiếp: xưng tội và bồi hoàn.'
