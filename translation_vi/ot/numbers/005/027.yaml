  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: vi
  text: Khi thầy tế lễ cho nàng uống nước ấy[a], nếu nàng đã trở nên ô uế và phản bội chồng, thì nước gây ra lời nguyền sẽ đi vào người nàng, đem lại nỗi đắng cay; bụng nàng sẽ sưng lên và đùi nàng sẽ tàn lụi[b]. Người phụ nữ ấy sẽ trở thành một lời nguyền giữa dân mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nước gây ra lời nguyền sẽ đi vào người nàng để gây đắng cay.” Cụm từ Hê-bơ-rơ được dịch là “đem lại nỗi đắng cay” rất khó hiểu và có thể mô tả tác dụng hoặc tính chất của nước.'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “đùi nàng sẽ sa xuống.” Đây có lẽ là lối nói uyển ngữ về một chứng bệnh nghiêm trọng ảnh hưởng đến cơ quan sinh sản, nhưng ý nghĩa chính xác không rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: Khi thầy tế lễ cho nàng uống nước ấy
  rationale: Dạng Hifil của שׁקה có nghĩa là cho hoặc khiến uống. Chủ thể được xác định theo ngữ cảnh gần là thầy tế lễ; mệnh đề thời gian diễn đạt tự nhiên chuỗi kết quả trong tiếng Việt.
- source_word: נִטְמְאָה
  choice: đã làm ô uế mình
  rationale: Giữ cả sắc thái ô uế về đạo đức lẫn nghi lễ, đồng thời phản ánh ý nghĩa hướng về chính người phụ nữ trong ngữ cảnh.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: phản bội chồng
  rationale: Kết cấu cùng gốc מעל nhấn mạnh hành vi bất trung và phá vỡ lòng tin; “phản bội” tự nhiên, mạnh và phù hợp với quan hệ hôn nhân.
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: nước gây ra lời nguyền
  rationale: Phân từ mô tả nước như phương tiện mang đến hoặc thực hiện lời nguyền, không chỉ là nước đã bị nguyền.
- source_word: לְמָרִים
  choice: đem lại nỗi đắng cay
  rationale: Cụm từ Hê-bơ-rơ khó xác định, có thể chỉ tác dụng hoặc tính chất của nước. Cách dịch này giữ ý nghĩa kết quả mà không xác định quá mức.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: bụng nàng sẽ sưng lên
  rationale: בטן trực tiếp chỉ bụng hoặc vùng bụng; không nên cụ thể hóa thành tử cung.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: đùi nàng sẽ tàn lụi
  rationale: Giữ danh từ cụ thể “đùi” nhưng diễn đạt động từ theo một chứng suy kiệt nghiêm trọng; chú thích nêu nghĩa đen và sự bất định của lối nói uyển ngữ.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: Người phụ nữ ấy sẽ trở thành một lời nguyền giữa dân mình
  rationale: Diễn đạt việc nàng trở thành đối tượng hoặc điển hình được nhắc đến trong lời nguyền ngay giữa cộng đồng của mình.
theological_decisions:
- issue: Cách diễn đạt chứng bệnh trong công thức thử tội mà không áp đặt một chẩn đoán sinh sản cụ thể
  choice: bụng nàng sẽ sưng lên và đùi nàng sẽ tàn lụi
  alternative: tử cung nàng sẽ sẩy thai và bụng nàng sẽ sưng lên; hoặc bộ phận sinh dục nàng sẽ teo lại
  rationale: Nguyên văn dùng hình ảnh cơ thể cụ thể nhưng một phần có tính uyển ngữ, và ý nghĩa sinh lý chính xác còn bất định. Bản văn chính vì thế giữ gần hình thức Hê-bơ-rơ, còn chú thích công khai sự bất định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” phù hợp với mạch luật pháp cổ nhưng vẫn tự nhiên trong tiếng Việt; tránh thuật ngữ y khoa hoặc cách giải thích sinh sản quá cụ thể mà nguyên văn không xác quyết.
