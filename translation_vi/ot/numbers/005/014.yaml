language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: vi
  text: thì cơn ghen nổi lên trong lòng người chồng, và ông sinh lòng ghen đối với vợ mình, và người vợ đã trở nên ô uế[a]; hoặc cơn ghen nổi lên trong lòng ông, và ông sinh lòng ghen đối với vợ mình, dù người vợ không trở nên ô uế[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã bị ô uế”. Tiếng Hê-bơ-rơ dùng ngôn ngữ về sự ô uế; trong ngữ cảnh này, từ ấy nói đến sự ô uế do hành vi tình dục bị nghi ngờ.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát tiếng Hê-bơ-rơ: “và người vợ không trở nên ô uế”. Từ “dù” trong bản dịch làm rõ sự tương phản trong trường hợp pháp lý này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו רוּחַ קִנְאָה
  choice: lòng ghen nổi lên trong người chồng / trong ông
  rationale: Cụm עָבַר עַל diễn tả một tâm trạng hoặc xung lực ập đến và chi phối người chồng. Trong ngữ cảnh này, רוּחַ קִנְאָה là trạng thái ghen tuông, nên “lòng ghen nổi lên” tự nhiên trong tiếng Việt và tránh khiến độc giả hiểu “thần khí” là một hữu thể riêng biệt.
- source_word: וְקִנֵּא אֶת־אִשְׁתּוֹ
  choice: khiến ông ghen vì vợ mình
  rationale: 'Thể Piel của קנא diễn tả phản ứng ghen tuông của người chồng. “Ghen vì vợ mình” là cách nói tiếng Việt tự nhiên; thêm “khiến” làm rõ trình tự: lòng ghen nổi lên rồi dẫn đến phản ứng ghen.'
- source_word: נִטְמָאָה
  choice: đã trở nên ô uế
  rationale: Động từ Niphal của טמא dùng ngôn ngữ ô uế. “Trở nên ô uế” giữ được sắc thái trạng thái/kết quả của nguyên ngữ mà không xác quyết quá mức bà chủ động làm ô uế mình hay bị người khác làm ô uế; trong luật này, ngữ cảnh xác định đây là sự ô uế liên quan đến hành vi tình dục bị nghi ngờ.
- source_word: אוֹ
  choice: hoặc
  rationale: Từ này mở ra trường hợp pháp lý thay thế. Tiếng Việt chỉ cần “hoặc” vì cấu trúc câu đã biểu đạt rõ hai khả năng.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: dù người vợ không hề trở nên ô uế
  rationale: Liên từ וְ về mặt hình thức là “và”, nhưng ở đây nối một tình huống tương phản, trong đó sự ghen tuông không có căn cứ. “Dù” diễn đạt tự nhiên quan hệ nhượng bộ; “không hề” nhấn rõ sự phủ định trong tình huống pháp lý này.
theological_decisions:
- issue: Bản chất của ngôn ngữ ô uế trong luật về người vợ bị nghi ngoại tình
  choice: Dịch נִטְמָאָה là “đã trở nên ô uế”, đồng thời giải thích ngữ cảnh tình dục trong chú thích.
  alternative: “đã làm mình ô uế” hoặc “đã bị ô uế”
  rationale: Cách dịch được chọn giữ sự giao thoa giữa ô uế nghi lễ và ô uế đạo đức trong nguyên ngữ, đồng thời không áp đặt một tác thể hay mức độ chủ ý mà hình thái động từ không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc song song của hai trường hợp pháp lý, dùng “người chồng/người vợ” để tránh đại từ thiếu rõ ràng khi câu được đọc tách khỏi ngữ cảnh. Dấu phẩy cuối câu được giữ vì câu 5:14 tiếp tục sang câu kế tiếp.
