source:
  edition: WLC
  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: vi
  text: hoặc khi một thần khí ghen tuông ập đến với một người đàn ông[a], và người ấy ghen với vợ mình, rồi đưa người phụ nữ ấy ra trước mặt Yahweh, thì thầy tế lễ phải thực hiện đối với người phụ nữ ấy toàn bộ chỉ thị này[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đến trên”; nghĩa đen của thành ngữ là “đi qua trên người ấy”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “toàn bộ luật lệ này”, “toàn bộ quy trình này” hoặc “toàn bộ nghi thức này”.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: hoặc khi
  rationale: Mở đầu phương án thứ hai trong câu dài bắt đầu ở phần trước; “hoặc khi” vừa giữ quan hệ lựa chọn vừa tự nhiên trong tiếng Việt.
- source_word: אִישׁ
  choice: một người
  rationale: Giữ nghĩa thông thường của danh từ Hê-bơ-rơ; quan hệ hôn nhân đã được làm rõ qua cụm “vợ mình” ngay sau đó.
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: một thần khí ghen tuông ập đến với một người
  rationale: Giữ hình ảnh “thần khí ghen tuông” và sắc thái một sức thúc đẩy mạnh mẽ đến trên người ấy, nhưng không quyết định đó là tác nhân siêu nhiên hay trạng thái nội tâm.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: khiến người ấy ghen với vợ mình
  rationale: Diễn đạt tự nhiên mối liên hệ giữa thần khí ghen tuông và hành động ghen, đồng thời giữ chủ thể và đối tượng rõ ràng.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: và người ấy đưa người phụ nữ đến trước mặt Yahweh
  rationale: Động từ dạng khiến có nghĩa là làm cho đứng hoặc trình diện; “đưa ... đến trước mặt” phù hợp với bối cảnh nghi lễ và tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm danh riêng của Đức Chúa Trời, tương ứng trực tiếp với danh YHWH trong bản nguồn.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: thì thầy tế lễ phải thực hiện đối với nàng
  rationale: Chuyển tải lực quy định của văn cảnh luật lệ; “đối với nàng” tự nhiên hơn lối dịch sát chữ “làm cho nàng” trong tiếng Việt.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: toàn bộ chỉ thị này
  rationale: תּוֹרָה ở đây chỉ toàn bộ quy trình đã được truyền dạy; “chỉ thị” giữ nghĩa rộng hơn “luật” mà vẫn phù hợp văn cảnh pháp lý-nghi lễ.
theological_decisions:
- issue: Bản chất của “thần khí ghen tuông”
  choice: Giữ cách nói “một thần khí ghen tuông” mà không xác định bản chất của nó.
  alternative: một cơn ghen; lòng ghen tuông; một thôi thúc ghen tuông
  rationale: Cụm Hê-bơ-rơ có thể chỉ một khuynh hướng nội tâm mạnh mẽ nhưng cũng dùng từ רוּחַ, “thần khí/gió/hơi thở”. Bản dịch không nên tự ý biến nó hoàn toàn thành hiện tượng tâm lý hoặc một hữu thể siêu nhiên.
- issue: Phạm vi nghĩa của תּוֹרָה trong nghi thức này
  choice: Dịch là “chỉ thị”.
  alternative: luật; quy định; nghi thức; thủ tục
  rationale: Trong câu này, từ ấy nói đến toàn bộ điều đã được truyền dạy về nghi thức, chứ không nhất thiết chỉ một đạo luật theo nghĩa hẹp.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc “hoặc khi ... thì ...” cho thấy đây là phần tiếp nối của quy định trước đó. Dùng “nàng” một lần để tránh lặp dài nhưng vẫn giữ sắc thái trang trọng; “thần khí ghen tuông” chủ ý bảo tồn sự mơ hồ của nguyên văn.
