  rationale: Bản sửa loại bỏ quan hệ nhân quả được thêm vào giữa “thần khí ghen tuông” và hành động ghen, làm rõ nét giống đực của אִישׁ, cải thiện độ rõ và tự nhiên của cụm chỉ nghi thức do thầy tế lễ thực hiện, đồng thời đặt lại neo chú thích b đúng tại “toàn bộ chỉ thị này”. Không thay đổi tính mơ hồ về bản chất của “thần khí ghen tuông” hoặc phạm vi chính xác của תּוֹרָה.
