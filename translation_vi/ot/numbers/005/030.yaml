- from: hoặc khi một thần khí ghen tuông ập đến với một người[a], khiến người ấy ghen với vợ mình, và người ấy đưa người phụ nữ đến trước mặt Yahweh, thì thầy tế lễ phải thực hiện đối với nàng toàn bộ chỉ thị này[b].
