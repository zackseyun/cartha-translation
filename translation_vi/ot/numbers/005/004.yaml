base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: vi
  text: 'Dân Israel đã làm như vậy: họ đưa những người ấy ra ngoài trại. Dân Israel đã làm đúng như Yahweh phán với Môi-se.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: đã làm như vậy
  rationale: Diễn đạt tự nhiên cấu trúc עשה + כן, cho biết dân Israel làm theo mệnh lệnh vừa được ban.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  rationale: Trong ngữ cảnh này, cụm từ Hê-bơ-rơ có nghĩa tập thể, chỉ toàn dân; “dân Israel” tự nhiên và chính xác hơn trong tiếng Việt hiện đại.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: họ đưa những người ấy ra
  rationale: שׁלח ở đây chỉ việc loại những người đã nêu khỏi phạm vi trại; “đưa ... ra” kết hợp tự nhiên với cụm chỉ nơi chốn theo sau.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Truyền đạt rõ hướng di chuyển và sự tách khỏi khu trại.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: đúng như ... phán
  rationale: כַּאֲשֶׁר diễn tả sự phù hợp chính xác với lời truyền trước đó; “phán” thích hợp với lời của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: כֵּן עָשׂוּ
  choice: đã làm đúng như
  rationale: Giữ ý nhấn mạnh ở phần lặp cuối câu rằng dân Israel thực hiện đúng lời Đức Giê-hô-va.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. “Đức Giê-hô-va” bảo tồn tính chất danh riêng và là hình thức quen thuộc, trang trọng trong tiếng Việt; không thay bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “dân Israel” theo nghĩa tập thể. Dấu hai chấm giúp thể hiện hành động tiếp theo là nội dung của việc “làm như vậy”, còn câu cuối giữ sự nhấn mạnh lặp lại của nguyên văn.
