base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: vi
  text: Hãy truyền cho con cái Israel rằng họ phải đưa ra khỏi trại tất cả những người mắc bệnh ngoài da[a], tất cả những người bị tiết dịch[b], và tất cả những người bị ô uế do thi hài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mắc bệnh phong.” Thuật ngữ Hê-bơ-rơ này chỉ rộng hơn một chứng bệnh nghiêm trọng ngoài da trong bối cảnh luật nghi lễ, không nhất thiết là bệnh phong theo y học hiện đại.'
    reason: lexical_alternative
  - marker: b
    text: Tức là bị tiết dịch bất thường từ cơ thể theo bối cảnh luật nghi lễ.
    reason: lexical_clarification
lexical_decisions:
- source_word: צַו
  choice: Hãy truyền
  rationale: Diễn đạt mệnh lệnh số ít dành cho Môi-se với sắc thái có thẩm quyền, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh tập thể của thành ngữ Hê-bơ-rơ theo cách trang trọng, quen thuộc và bao quát trong tiếng Việt.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: phải đưa ra khỏi trại
  rationale: Thể hiện rõ hành động đưa người ra ngoài phạm vi trại mà không thêm sắc thái trừng phạt.
- source_word: כָּל צָרוּעַ
  choice: tất cả những người mắc bệnh ngoài da
  rationale: Thuật ngữ chỉ một phạm vi bệnh trạng ngoài da trong luật thanh sạch, không nhất thiết là bệnh phong theo nghĩa y học hiện đại.
- source_word: וְכָל זָב
  choice: tất cả những người bị tiết dịch
  rationale: Diễn đạt ngắn gọn tình trạng tiết dịch bất thường của cơ thể trong luật nghi lễ mà không thu hẹp quá mức loại dịch.
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: tất cả những người bị ô uế vì xác người chết
  rationale: Chuyển đúng nghĩa thành ngữ Hê-bơ-rơ về sự ô uế do xác chết, đồng thời giữ rõ đây là xác người.
theological_decisions:
- issue: Cách dịch thuật ngữ về tình trạng không thanh sạch theo nghi lễ
  choice: bị ô uế
  alternative: không thanh sạch; bị nhơ uế
  rationale: Trong ngữ cảnh này, טָמֵא nói về tình trạng nghi lễ liên quan đến sự thánh sạch của trại, không mặc nhiên hàm ý người ấy phạm tội về đạo đức.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “con cái Israel” để giữ sắc thái tập thể của nguyên văn; dùng “ô uế” theo nghĩa nghi lễ chứ không đạo đức hóa tình trạng này.
