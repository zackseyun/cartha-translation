- from: Hãy truyền cho con cái Israel phải đưa ra khỏi trại tất cả những người mắc bệnh ngoài da[a], tất cả những người bị tiết dịch[b], và tất cả những người bị ô uế vì xác người chết.
  to: Hãy truyền cho con cái Israel rằng họ phải đưa ra khỏi trại tất cả những người mắc bệnh ngoài da[a], tất cả những người bị tiết dịch[b], và tất cả những người bị ô uế do thi hài.
