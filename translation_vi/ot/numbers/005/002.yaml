    rationale: “Hãy truyền cho con cái Israel phải...” thiếu thành tố nối nội dung lời truyền. “Hãy truyền cho con cái Israel rằng họ phải...” là cấu trúc tự nhiên, đồng thời giữ rõ Môi-se là người nhận mệnh lệnh và con cái Israel là chủ thể phải thi hành.
  - severity: low
    issue: Diễn đạt về xác chết chưa tự nhiên
    rationale: “Xác người chết” có tính lặp nghĩa trong tiếng Việt. “Thi hài” tự nhiên hơn và vẫn giữ rõ thành ngữ Hê-bơ-rơ ở đây chỉ sự ô uế do xác người chết.
  - severity: low
    issue: Chú thích a có câu văn không tự nhiên
    rationale: Cụm “chỉ rộng hơn đến một chứng bệnh...” không chuẩn cú pháp. Chú thích cần nói rõ thuật ngữ Hê-bơ-rơ có phạm vi nghĩa rộng hơn “bệnh phong” theo y học hiện đại.
