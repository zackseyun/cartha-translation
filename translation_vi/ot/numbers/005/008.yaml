revisions:
- from: Nhưng nếu người ấy không có người thân có quyền chuộc để nhận khoản bồi hoàn cho lỗi lầm[a], thì khoản bồi hoàn cho lỗi lầm được hoàn lại cho Đức Giê-hô-va sẽ thuộc về thầy tế lễ[b], ngoài con chiên đực dùng để chuộc tội, là con vật thầy tế lễ sẽ dùng để làm lễ chuộc tội cho người ấy.
  to: Nhưng nếu người ấy không có người thân có quyền chuộc để nhận lại khoản bồi thường về lỗi phạm[a], thì khoản bồi thường về lỗi phạm được hoàn lại cho ĐỨC CHÚA sẽ thuộc về thầy tế lễ[b], ngoài con chiên đực chuộc tội, nhờ con đó thầy tế lễ làm lễ chuộc tội cho người ấy.
  rationale: Bản sửa thay cách chuyển יהוה để phù hợp với thuật ngữ POB dành cho “the LORD”, làm rõ khoản tiền là bồi thường về lỗi phạm, và duy trì sự phân biệt nguyên văn giữa khoản bồi thường được hoàn lại cho ĐỨC CHÚA (và thuộc về thầy tế lễ) với con chiên đực chuộc tội được thêm vào. Không thay đổi ý nghĩa hay thêm diễn giải giáo phái.
