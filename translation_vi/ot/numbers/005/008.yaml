base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: vi
  text: Nhưng nếu người ấy không có người thân có quyền chuộc để nhận lại khoản bồi thường về lỗi phạm[a], thì khoản bồi thường về lỗi phạm được hoàn lại cho ĐỨC CHÚA sẽ thuộc về thầy tế lễ[b], ngoài con chiên đực chuộc tội, nhờ con đó thầy tế lễ làm lễ chuộc tội cho người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người thân có quyền chuộc” chỉ một thành viên trong gia tộc có quyền và trách nhiệm pháp lý trong việc chuộc lại tài sản hoặc nhận khoản bồi thường thay cho người thân.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ אָשָׁם ở đây chỉ khoản bồi thường về lỗi phạm, không phải chính con chiên đực dâng làm sinh tế; con chiên được nhắc riêng ở phần sau của câu.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: người thân có quyền chuộc
  rationale: Diễn đạt cả quan hệ họ hàng lẫn vai trò pháp lý của người có trách nhiệm hoặc quyền nhận sự bồi hoàn thay cho thân nhân.
- source_word: הָאָשָׁם
  choice: khoản bồi hoàn cho lỗi lầm
  rationale: Trong ngữ cảnh này, từ này chỉ khoản bồi thường phát sinh từ hành vi có lỗi, không phải chính con vật hiến tế, vì con chiên đực được nhắc riêng sau đó.
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: khoản bồi hoàn cho lỗi lầm được hoàn lại
  rationale: Giữ sắc thái phục hồi hoặc hoàn trả của phân từ bị động từ שוב.
- source_word: לַיהוָה
  choice: cho Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước YHWH bằng cách gọi quen thuộc, rõ ràng trong tiếng Việt; khoản bồi hoàn được dâng cho Ngài và vì thế thuộc về thầy tế lễ.
- source_word: לַכֹּהֵן
  choice: sẽ thuộc về thầy tế lễ
  rationale: Bổ sung vị ngữ cần thiết trong tiếng Việt để nêu rõ người được nhận khoản bồi hoàn.
- source_word: מִלְּבַד
  choice: ngoài
  rationale: Cho thấy con chiên đực là phần thêm vào, khác với khoản bồi hoàn.
- source_word: אֵיל הַכִּפֻּרִים
  choice: con chiên đực dùng để chuộc tội
  rationale: Cách diễn đạt tự nhiên, vẫn bảo toàn chức năng tế lễ của con vật.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: là con vật thầy tế lễ sẽ dùng để làm lễ chuộc tội cho người ấy
  rationale: Đại từ chỉ phương tiện quy về con chiên đực; chủ thể là thầy tế lễ được hiểu từ thủ tục tế lễ và ngữ cảnh ngay trước đó.
- source_word: לָאִישׁ
  choice: người ấy
  rationale: Tự nhiên trong tiếng Việt và chỉ đúng người phạm lỗi đang được nói đến, dù không lặp lại dấu giống đực của danh từ Hê-bơ-rơ.
theological_decisions:
- issue: Mối quan hệ giữa khoản bồi hoàn và sinh tế
  choice: Phân biệt khoản bồi hoàn với con chiên đực dùng để chuộc tội; con chiên là phần thêm vào.
  alternative: Hiểu אָשָׁם tại đây là chính lễ vật chuộc lỗi.
  rationale: מִלְּבַד (‘ngoài’) cùng việc nhắc riêng con chiên đực cho thấy khoản bồi hoàn và sinh tế là hai hạng mục khác nhau.
- issue: Cách chuyển YHWH
  choice: Đức Giê-hô-va
  alternative: Đức Chúa Trời; Chúa; Gia-vê
  rationale: Dùng một cách gọi danh riêng quen thuộc trong tiếng Việt để phân biệt YHWH với tước hiệu ‘Chúa’, mà không làm thay đổi quan hệ pháp lý-tế lễ trong câu.
- issue: Chủ thể làm lễ chuộc tội
  choice: Nêu thầy tế lễ là chủ thể được ngữ cảnh hàm ý.
  alternative: 'Dùng thể bị động: ‘nhờ đó lễ chuộc tội được thực hiện cho người ấy’.'
  rationale: Động từ Hê-bơ-rơ ở ngôi thứ ba số ít giống đực có chủ thể hàm ẩn; ‘thầy tế lễ’ là tiền ngữ gần nhất và phù hợp với thủ tục tế lễ, nhưng bản dịch vẫn tập trung vào con chiên như phương tiện chuộc tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ pháp lý ‘khoản bồi hoàn’ để phân biệt với nghi thức tế lễ, đồng thời dùng ‘thầy tế lễ’ và ‘làm lễ chuộc tội’ theo lối diễn đạt Kinh Thánh quen thuộc.
