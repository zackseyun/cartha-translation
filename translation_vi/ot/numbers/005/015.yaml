- from: 'Bấy giờ, người chồng phải đưa vợ mình đến gặp thầy tế lễ, và thay cho nàng đem lễ vật của nàng: một phần mười ê-pha bột lúa mạch. Người ấy không được đổ dầu hay đặt nhũ hương lên lễ vật, vì đó là lễ vật ngũ cốc về sự ghen tuông, một lễ vật tưởng niệm[a] khiến tội lỗi[b] được nhớ lại.'
  to: 'Bấy giờ, người chồng phải đưa vợ mình đến thầy tế lễ, và người ấy phải đem lễ vật của nàng thay cho nàng: một phần mười ê-pha bột lúa mạch. Người ấy không được đổ dầu lên lễ vật, cũng không được đặt nhũ hương lên đó, vì đó là lễ vật ngũ cốc về sự ghen tuông, một lễ vật tưởng niệm[a] khiến tội lỗi[b] được nhớ lại.'
  rationale: Bản sửa loại bỏ sắc thái không có trong nguyên văn ở “đến gặp,” làm rõ hai điều cấm đều có hiệu lực, và chỉnh vị trí của cụm chỉ sự đại diện để câu Việt tự nhiên hơn. Không thay đổi tính mơ hồ về tội lỗi/tội trạng của עָוֹן, cũng không suy diễn kết quả nghi thức.
