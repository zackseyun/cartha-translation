source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: vi
  text: 'Bấy giờ, người chồng phải đưa vợ mình đến thầy tế lễ, và người ấy phải đem lễ vật của nàng thay cho nàng: một phần mười ê-pha bột lúa mạch. Người ấy không được đổ dầu lên lễ vật, cũng không được đặt nhũ hương lên đó, vì đó là lễ vật ngũ cốc về sự ghen tuông, một lễ vật tưởng niệm[a] khiến tội lỗi[b] được nhớ lại.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật để nhớ lại”; cụm từ Hê-bơ-rơ cũng có thể hiểu sát hơn là “lễ vật của sự nhớ lại”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “khiến tội trạng được nhớ lại”; từ Hê-bơ-rơ עָוֹן có thể chỉ tội lỗi, tội trạng, hoặc trách nhiệm phát sinh do hành vi sai trái.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: phải đưa / đem
  rationale: Trong văn cảnh luật định, dạng động từ này mang lực chỉ thị; “phải” diễn đạt nghĩa vụ tự nhiên trong tiếng Việt mà không biến câu thành lời dự đoán.
- source_word: הָאִישׁ ... אִשְׁתּוֹ
  choice: người chồng ... vợ mình
  rationale: הָאִישׁ theo mặt chữ là “người đàn ông”, nhưng cụm “vợ mình” xác định rõ quan hệ; “người chồng” là cách diễn đạt tự nhiên, không thêm thông tin ngoài văn cảnh.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, trang trọng và quen thuộc trong tiếng Việt đối với chức vụ tư tế của Y-sơ-ra-ên.
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: thay cho nàng đem lễ vật của nàng
  rationale: Giữ hậu tố giống cái của “lễ vật của nàng” và diễn đạt עָלֶיהָ theo nghĩa người chồng mang lễ vật thay mặt nàng.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: một phần mười ê-pha
  rationale: Giữ nguyên đơn vị đo lường cổ thay vì quy đổi gần đúng.
- source_word: קֶמַח שְׂעֹרִים
  choice: bột lúa mạch
  rationale: קֶמַח chỉ bột; kết cấu sở thuộc được chuyển thành cụm danh từ tự nhiên trong tiếng Việt.
- source_word: לֹא יִצֹק עָלָיו שֶׁמֶן וְלֹא יִתֵּן עָלָיו לְבֹנָה
  choice: không được đổ dầu hay đặt nhũ hương lên lễ vật
  rationale: Diễn đạt hai điều cấm song song; làm rõ đại từ “trên nó” quy chiếu về lễ vật.
- source_word: מִנְחַת קְנָאֹת
  choice: lễ vật ngũ cốc về sự ghen tuông
  rationale: Trong văn cảnh tế lễ, מִנְחָה là lễ vật ngũ cốc; “sự ghen tuông” giữ phạm vi nghĩa rộng của קְנָאֹת mà không khẳng định người vợ có tội.
- source_word: מִנְחַת זִכָּרוֹן
  choice: lễ vật tưởng niệm
  rationale: זִכָּרוֹן có thể chỉ sự tưởng niệm hoặc sự nhớ lại; cách dịch chính ngắn gọn và trang trọng, còn phương án gần mặt chữ được ghi chú.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: khiến tội lỗi được nhớ lại
  rationale: Giữ lực gây khiến của phân từ מַזְכֶּרֶת và không xác định trước phán quyết của nghi thức.
theological_decisions:
- issue: Lễ vật có hàm ý người vợ đã phạm tội hay không
  choice: Mô tả chức năng của lễ vật là khiến tội lỗi được nhớ lại, nhưng không khẳng định người vợ có tội.
  alternative: Dịch theo hướng lễ vật mặc nhiên chứng minh hoặc giả định tội của người vợ.
  rationale: Câu này quy định thành phần và chức năng của lễ vật nhưng chưa công bố kết quả xét xử; bản dịch giữ nguyên sự căng thẳng đó.
- issue: Sắc thái của עָוֹן
  choice: tội lỗi
  alternative: tội trạng / trách nhiệm do phạm tội
  rationale: “Tội lỗi” là nghĩa trực tiếp và dễ hiểu, trong khi chú thích bảo lưu các sắc thái “tội trạng” và “trách nhiệm phát sinh do sai phạm”.
translation_notes:
  register: Văn phong luật định, trang trọng nhưng hiện đại. Dùng “phải/không được” để thể hiện lực chỉ thị; giữ đơn vị cổ “ê-pha”. Các đại từ “người ấy”, “nàng” tránh lặp nặng mà vẫn xác định rõ chủ thể.
