  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֥ישׁ אִישׁ֙ כִּֽי תִשְׂטֶ֣ה אִשְׁתּ֔/וֹ וּ/מָעֲלָ֥ה ב֖/וֹ מָֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: vi
  text: '“Hãy nói với con cái Y-sơ-ra-ên và bảo họ: Nếu vợ của bất cứ người nào lạc lối và phản bội chồng mình,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn lặp một động từ và một danh từ cùng gốc, theo sát nghĩa là “phạm hành vi phản trắc đối với chồng”, để nhấn mạnh hành vi bất tín.
    reason: Giải thích cấu trúc đồng căn của וּמָעֲלָה ... מָעַל và sắc thái nhấn mạnh mà cách dịch tự nhiên “phản bội” không thể hiện đầy đủ về mặt hình thức.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Mệnh lệnh mở đầu lời chỉ dẫn của Đức Chúa Trời; cách dịch trực tiếp, trang trọng và tự nhiên.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh quan hệ huyết thống của thành ngữ Hê-bơ-rơ, đồng thời trong tiếng Việt có thể chỉ toàn thể dân Y-sơ-ra-ên mà không giới hạn ở nam giới.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và bảo họ
  rationale: Truyền đạt tự nhiên công thức tiếp nối, tránh lặp cứng ‘nói ... nói với họ’.
- source_word: אִישׁ אִישׁ
  choice: bất cứ người nào
  rationale: Lối lặp ‘người, người’ mang nghĩa phân phối, tương đương ‘bất cứ người nào’.
- source_word: כִּי
  choice: Nếu
  rationale: Trong luật lệ nêu trường hợp, từ này dẫn vào một điều kiện giả định.
- source_word: תִשְׂטֶה
  choice: đi chệch đường
  rationale: Giữ nét ẩn dụ ‘lệch khỏi đường’ và chưa xác định quá mức hành vi trước mệnh đề kế tiếp.
- source_word: אִשְׁתּוֹ
  choice: vợ ... chồng mình
  rationale: Diễn đạt quan hệ sở hữu và đối tượng bị phản bội theo cú pháp tiếng Việt tự nhiên.
- source_word: וּמָעֲלָה ... מָעַל
  choice: phản bội
  rationale: Cụm đồng căn nhấn mạnh hành vi bất tín, phản trắc; ‘phản bội’ truyền tải mạnh và tự nhiên hơn một cấu trúc danh hóa gượng ép trong tiếng Việt.
- source_word: בּוֹ
  choice: chồng mình
  rationale: Trong ngữ cảnh, đại từ chỉ người chồng là người bị hành vi bất tín nhắm đến.
theological_decisions:
- issue: Cách gọi cộng đồng giao ước có hình thức giống đực trong tiếng Hê-bơ-rơ
  choice: con cái Y-sơ-ra-ên
  alternative: người Y-sơ-ra-ên
  rationale: ‘Con cái Y-sơ-ra-ên’ bảo lưu hình ảnh gia tộc của nguyên văn nhưng trong tiếng Việt vẫn tự nhiên bao quát toàn dân.
- issue: Mức độ xác định hành vi bất tín trong câu này
  choice: đi chệch đường và phản bội chồng mình
  alternative: ngoại tình với chồng mình
  rationale: Nguyên văn ở câu 12 dùng ngôn ngữ đi chệch và bất tín; không nên đưa ngay chi tiết tình dục được nêu rõ hơn ở câu tiếp theo vào câu này.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng ‘bảo họ’ để tránh lặp từ thiếu tự nhiên; ‘đi chệch đường’ giữ hình ảnh của nguyên ngữ, còn ‘phản bội chồng mình’ diễn đạt rõ quan hệ bị xâm phạm.
