  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מִ/זָּכָ֤ר עַד נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה תְּשַׁלְּח֑וּ/ם וְ/לֹ֤א יְטַמְּאוּ֙ אֶת מַ֣חֲנֵי/הֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: vi
  text: Từ nam cho đến nữ, các con phải đưa họ ra ngoài trại; các con phải đưa họ ra, để họ không làm ô uế các trại của họ[a], mà Ta ngự giữa họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng số nhiều: “các trại của họ”; có thể chỉ các phân khu hoặc những phần khác nhau trong toàn trại quân.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mà Ta ngự ở giữa.” Nguyên văn có thể nói Ta ngự giữa các trại hoặc giữa những người thuộc các trại ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: Từ nam cho đến nữ
  rationale: Giữ hình ảnh bao quát từ đầu này đến đầu kia của thành ngữ Hê-bơ-rơ, đồng thời dùng cặp “nam/nữ” sát với các danh từ chỉ giới tính sinh học trong nguyên văn.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: các con phải đưa họ ra … các con phải đưa họ ra
  rationale: Lặp lại cùng một động từ như nguyên văn để giữ sắc thái nhấn mạnh; “đưa ra” phù hợp với việc loại khỏi phạm vi trại mà không tự thêm sắc thái trừng phạt mạnh như “trục xuất”.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ra ngoài trại
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ rõ ý đưa qua khỏi ranh giới của trại.
- source_word: יְטַמְּאוּ
  choice: làm ô uế
  rationale: Giữ nghĩa ô uế theo nghi thức trong văn mạch luật thanh sạch, thay vì làm phẳng thành sự nhiễm bẩn thông thường.
- source_word: מַחֲנֵיהֶם
  choice: các trại của mình
  rationale: Giữ dạng số nhiều của מַחֲנֵיהֶם; “của mình” quy chiếu tự nhiên về cộng đồng mà những người bị đưa ra thuộc về.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: là nơi Ta ngự giữa họ
  rationale: “Ngự” giữ sắc thái trang trọng về sự hiện diện của Đức Chúa Trời; đại từ “họ” bảo lưu khả năng quy chiếu đến dân chúng gắn với các trại, trong khi chú thích nêu cách hiểu theo địa điểm.
theological_decisions:
- issue: Đối tượng quy chiếu của בְּתוֹכָם trong mệnh đề nói về nơi Đức Chúa Trời ngự
  choice: “là nơi Ta ngự giữa họ,” có thể hiểu Đức Chúa Trời ngự giữa dân chúng trong các trại
  alternative: “mà Ta ngự ở giữa,” hiểu trực tiếp là Ngài ngự giữa các trại ấy
  rationale: Hậu tố số nhiều giống đực có thể quy chiếu đến các trại hoặc đến dân chúng gắn với chúng. Bản dịch chính giữ trọng tâm về sự hiện diện của Đức Chúa Trời giữa cộng đồng nhưng dùng chú thích để không loại bỏ cách hiểu theo địa điểm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” cho ngôi thứ hai số nhiều trong lời Đức Chúa Trời truyền cho Môi-se, “Ta” cho lời tự xưng của Đức Chúa Trời, và giữ sự lặp động từ có chủ ý của nguyên văn.
