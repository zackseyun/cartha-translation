  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּ/כְלִי חָ֑רֶשׂ וּ/מִן הֶֽ/עָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּ/קַרְקַ֣ע הַ/מִּשְׁכָּ֔ן יִקַּ֥ח הַ/כֹּהֵ֖ן וְ/נָתַ֥ן אֶל הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: vi
  text: Rồi thầy tế lễ phải lấy nước thánh[a] trong một bình bằng đất nung[b], lấy một ít bụi đất trên nền Đền Tạm[c] và bỏ vào nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nước được biệt riêng làm thánh”. Cụm từ Hê-bơ-rơ chỉ nước được dành riêng làm thánh để dùng trong nghi lễ.
    reason: lexical_alternative
  - marker: b
    text: Hay “một bình bằng đất sét” hoặc “một bình gốm”.
    reason: lexical_alternative
  - marker: c
    text: Hay “trên mặt đất của Đền Tạm”. Từ Hê-bơ-rơ có thể chỉ mặt đất hoặc nền; trong khung cảnh Đền Tạm, “nền” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: nước thánh
  rationale: Cụm từ Hê-bơ-rơ chỉ nước được biệt riêng làm thánh để dùng trong nghi lễ. “Nước thánh” là cách dịch trực tiếp, tự nhiên; chú thích giúp tránh áp đặt những liên tưởng giáo hội có sau này.
- source_word: בִּכְלִי חָרֶשׂ
  choice: đựng trong một bình bằng đất nung
  rationale: כְּלִי là vật chứa, còn חָרֶשׂ chỉ đồ gốm bằng đất sét. “Bình bằng đất nung” vừa tự nhiên trong tiếng Việt vừa nêu rõ chất liệu.
- source_word: מִן הֶעָפָר
  choice: một ít bụi đất
  rationale: עָפָר có thể chỉ bụi, đất khô hoặc đất vụn; giới từ מִן mang sắc thái phân lượng. “Một ít bụi đất” diễn đạt cả vật liệu lẫn ý lấy một phần.
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: trên nền Đền Tạm
  rationale: קַרְקַע có thể là mặt đất hoặc nền. Trong khung cảnh bên trong מִשְׁכָּן, “nền” tự nhiên hơn, còn “Đền Tạm” biểu đạt nơi Đức Chúa Trời ngự giữa dân trong thời kỳ này.
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: phải lấy ... lấy ... và bỏ
  rationale: Chuỗi động từ là chỉ dẫn nghi lễ bắt buộc. “Phải” thể hiện tính quy định; “bỏ vào” là cách nói tự nhiên cho נָתַן אֶל trong ngữ cảnh này.
- source_word: הַמָּיִם
  choice: nước
  rationale: Danh từ xác định nhắc lại nước đã nói ở đầu câu; tiếng Việt không cần lặp từ “thánh” hay dùng một từ tương đương với mạo từ.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “thầy tế lễ” và “Đền Tạm” nhất quán với cách gọi Kinh Thánh phổ thông; giữ “nước thánh” theo nghĩa nguyên thủy và giải thích trong chú thích để tránh liên tưởng hệ phái.
