  rationale: Sửa cách nối cụm chỉ vật chứa để phản ánh rõ hơn cú pháp tiếng Hê-bơ-rơ và tránh hiểu nước vốn đã ở sẵn trong bình. Chỉnh chú thích về “nước thánh” cho chính xác và trung tính hơn. Không thay đổi ý nghĩa nghi thức hay các thuật ngữ chủ đạo.
