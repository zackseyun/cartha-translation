revisions:
- from: Rồi thầy tế lễ phải đặt người phụ nữ đứng trước mặt Yahweh, xõa tóc người ấy ra[a], và đặt vào hai lòng bàn tay người ấy lễ vật ngũ cốc để nhắc nhớ—đó là lễ vật ngũ cốc về sự ghen tuông; còn trong tay thầy tế lễ là nước đắng gây nên lời nguyền[b].
  to: Rồi thầy tế lễ phải cho người phụ nữ đứng trước mặt Yahweh, tháo tóc người ấy cho tóc xõa ra[a], và đặt vào hai lòng bàn tay người ấy lễ vật ngũ cốc để nhắc nhớ—đó là lễ vật ngũ cốc về sự ghen tuông; còn trong tay thầy tế lễ là nước đắng gây nên lời nguyền[b].
  rationale: Chỉnh nhẹ để văn bản tự nhiên hơn và để chú thích a phản ánh chính xác hơn tính đa nghĩa của thành ngữ פָרַע אֶת־רֹאשׁ. Không thay đổi ý nghĩa, trật tự nghi lễ, hay cách xử lý các thuật ngữ then chốt.
