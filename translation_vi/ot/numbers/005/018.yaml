source:
  edition: WLC
  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: vi
  text: Rồi thầy tế lễ phải cho người phụ nữ đứng trước mặt Yahweh, tháo tóc người ấy cho tóc xõa ra[a], và đặt vào hai lòng bàn tay người ấy lễ vật ngũ cốc để nhắc nhớ—đó là lễ vật ngũ cốc về sự ghen tuông; còn trong tay thầy tế lễ là nước đắng gây nên lời nguyền[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để đầu người ấy trần” hoặc “để tóc người ấy xõa ra.” Thành ngữ Hê-bơ-rơ nói đến việc tháo hoặc buông tóc của người phụ nữ; trong nghi lễ này, có lẽ tóc được tháo để xõa ra.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nước đắng mang lời nguyền.” Phân từ Hê-bơ-rơ có thể mô tả nước như thứ thực hiện hoặc chuyển tải lời nguyền.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: phải đặt ... đứng
  rationale: Dạng Hiphil của עמד chỉ việc khiến một người đứng hoặc trình diện trong bối cảnh nghi lễ; cách dịch này vừa giữ hành động cụ thể vừa tự nhiên trong tiếng Việt.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Đây là thành ngữ nghi lễ chỉ sự hiện diện trước Đức Chúa Trời; danh riêng giao ước יְהוָה được phiên là “Yahweh”.
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: xõa tóc người ấy ra
  rationale: Thành ngữ Hê-bơ-rơ nói đến việc làm cho đầu không còn bị buộc; trong ngữ cảnh, nhiều khả năng là tháo tóc và để tóc xõa. Chú thích giữ lại khả năng hiểu là để đầu trần.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: đặt vào hai lòng bàn tay người ấy
  rationale: כַּפַּיִם là dạng số đôi, nghĩa đen là hai lòng bàn tay. Cách dịch này bảo tồn cử chỉ cụ thể của nghi lễ.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: lễ vật ngũ cốc để nhắc nhớ
  rationale: מִנְחָה trong ngữ cảnh tế lễ là lễ vật bằng ngũ cốc; הַזִּכָּרוֹן diễn tả chức năng nhắc nhớ hoặc làm kỷ niệm, không xác định rõ đối tượng được nhắc.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: đó là lễ vật ngũ cốc về sự ghen tuông
  rationale: Giữ phép đồng vị và sự lặp lại của “lễ vật ngũ cốc”; קְנָאֹת có hình thức số nhiều nhưng ở đây mang ý nghĩa trừu tượng/tổng hợp.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: còn trong tay thầy tế lễ là
  rationale: Mệnh đề mô tả hoàn cảnh đồng thời và giữ danh từ “tay” ở số ít như bản Hê-bơ-rơ.
- source_word: מֵי הַמָּרִים
  choice: nước đắng
  rationale: Cụm cấu tạo Hê-bơ-rơ có thể dịch tự nhiên là “nước đắng”; tiếng Việt không cần đánh dấu số nhiều cho danh từ khối “nước”.
- source_word: הַמְאָרֲרִים
  choice: gây nên lời nguyền
  rationale: Phân từ của ארר mô tả nước như phương tiện mang lại hoặc thực hiện lời nguyền, chứ không đơn thuần là nước đã bị nguyền.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn trực tiếp dùng Tetragrammaton; phiên âm “Yahweh” giữ đây là danh riêng giao ước và không thay bằng một tước hiệu.
- issue: Ý nghĩa nghi lễ của מִנְחַת הַזִּכָּרוֹן
  choice: lễ vật ngũ cốc để nhắc nhớ
  alternative: lễ vật ngũ cốc kỷ niệm
  rationale: Cách dịch theo chức năng không quyết định trước lễ vật nhắc ai, nhắc điều gì, hay theo cơ chế thần học nào.
- issue: Tác dụng của nước và lời nguyền
  choice: nước đắng gây nên lời nguyền
  alternative: nước đắng mang lời nguyền
  rationale: Giữ sức tác động của phân từ Hê-bơ-rơ nhưng không giải thích thêm cơ chế hay thời điểm lời nguyền được thực hiện.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “thầy tế lễ” cho הַכֹּהֵן, “người phụ nữ/người ấy” để tránh lặp nặng nề, đồng thời giữ rõ các động tác nghi lễ và không làm phẳng những chỗ còn đa nghĩa trong tiếng Hê-bơ-rơ.
