  text: And Yahweh spoke to Moses, saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời phán của Đức Chúa Trời được diễn đạt tự nhiên và trang trọng bằng “phán”; liên từ וַ đánh dấu diễn tiến sang một đơn vị lời phán mới.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho danh riêng YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc nói/phán với một người, “với” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Cách phiên âm tiếng Việt thông dụng của tên riêng Mô-sê.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn lời tiếng Việt, “rằng” tự nhiên hơn lối dịch sát “nói rằng” sau động từ “phán” và báo hiệu nội dung lời phán tiếp theo.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng thay vì đổi thành tước hiệu “CHÚA”; “Đức Giê-hô-va” là dạng tiếng Việt dễ nhận biết và có sắc thái tôn kính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng công thức dẫn lời gọn tự nhiên trong tiếng Việt; dấu hai chấm cho biết nội dung lời phán bắt đầu ở câu kế tiếp.
