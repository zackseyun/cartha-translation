base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: vi
  text: Thầy tế lễ sẽ bốc từ lễ vật bằng ngũ cốc một nắm, tức phần tưởng niệm của lễ vật ấy, rồi thiêu phần ấy trên bàn thờ. Sau đó, ông sẽ cho người phụ nữ uống nước[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong văn mạch rộng hơn, đây là “nước đắng”; tuy nhiên, câu này trong nguyên văn chỉ nói “nước”.
    reason: Giải thích cách gọi trong văn cảnh rộng hơn mà không thêm tính từ không có trong câu Hê-bơ-rơ.
lexical_decisions:
- source_word: וְקָמַץ
  choice: sẽ bốc một nắm
  rationale: Trong nghi thức dâng tế, קמץ chỉ hành động dùng tay lấy một nắm từ lễ vật. “Bốc một nắm” vừa tự nhiên trong tiếng Việt vừa giữ được tính cụ thể của động tác; dạng động từ theo chuỗi được diễn đạt bằng “Bấy giờ… sẽ” trong lời chỉ dẫn luật lệ.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, trang trọng và quen thuộc trong văn cảnh nghi lễ của Kinh Thánh.
- source_word: מִן הַמִּנְחָה
  choice: từ lễ vật bằng ngũ cốc
  rationale: Trong văn cảnh tế lễ của Ngũ Kinh, מִנְחָה chỉ lễ vật làm từ sản phẩm ngũ cốc, chứ không chỉ một lễ vật chung chung.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: tức phần tưởng niệm của lễ vật ấy
  rationale: אַזְכָּרָה là phần đại diện của lễ vật ngũ cốc được thiêu trên bàn thờ. “Phần tưởng niệm” giữ thuật ngữ nghi lễ và hậu tố giống cái được diễn đạt rõ là thuộc về lễ vật ấy.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: rồi thiêu trên bàn thờ
  rationale: Trong ngữ cảnh tế lễ, הקטיר nói đến việc thiêu lễ vật để dâng trên bàn thờ. “Thiêu” trang trọng và chính xác hơn “đốt”; tân ngữ được hiểu là phần tưởng niệm vừa nêu.
- source_word: וְאַחַר
  choice: Sau đó
  rationale: Diễn đạt tự nhiên trình tự thời gian rõ ràng của nghi thức.
- source_word: יַשְׁקֶה
  choice: sẽ cho … uống
  rationale: Thể Hiphil mang nghĩa khiến hoặc cho uống. “Cho người phụ nữ uống” giữ nghĩa tác khiến mà không tự ý nhấn mạnh mức độ cưỡng ép hơn điều động từ xác định.
- source_word: אֶת הָאִשָּׁה
  choice: người phụ nữ
  rationale: Tân ngữ xác định của động từ; cách dịch hiện đại, tự nhiên và trung tính.
- source_word: אֶת הַמָּיִם
  choice: nước
  rationale: Bản Hê-bơ-rơ ở câu này chỉ nói “nước”, không có tính từ “đắng”. Tiếng Việt có thể dùng danh từ không kèm từ chỉ định ở đây mà vẫn tự nhiên.
theological_decisions:
- issue: Có nên gọi nước trong câu này là “nước đắng” theo văn cảnh rộng hơn hay không
  choice: Giữ nguyên cách nói đơn giản “nước” trong chính văn
  alternative: “nước đắng”
  rationale: Câu này chỉ có הַמָּיִם, nghĩa là “nước”. Thêm “đắng” vào chính văn sẽ đưa từ ngữ của các câu lân cận vào câu này và làm mất đi mức độ diễn đạt chính xác của nguồn Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc được chia thành hai câu để làm rõ thứ tự nghi lễ; dùng “ông” để tránh lặp “thầy tế lễ” nhưng vẫn giữ chủ thể rõ ràng. Dấu chú thích [a] được đặt ngay sau “nước”, là từ mà chú thích giải thích.
