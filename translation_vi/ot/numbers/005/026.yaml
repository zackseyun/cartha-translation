revisions:
- from: Bấy giờ, thầy tế lễ sẽ bốc một nắm từ lễ vật bằng ngũ cốc, tức phần tưởng niệm của lễ vật ấy, rồi thiêu trên bàn thờ. Sau đó, ông sẽ cho người phụ nữ uống nước[a].
  to: Thầy tế lễ sẽ bốc từ lễ vật bằng ngũ cốc một nắm, tức phần tưởng niệm của lễ vật ấy, rồi thiêu phần ấy trên bàn thờ. Sau đó, ông sẽ cho người phụ nữ uống nước[a].
  rationale: 'Bản sửa chỉ làm sáng tỏ cú pháp và đối tượng nghi lễ được ngầm hiểu trong nguyên văn: một nắm từ lễ vật là phần tưởng niệm, và chính phần ấy được thiêu trên bàn thờ. Không thay đổi trình tự, chủ thể, hay nội dung của câu; chú thích vẫn giữ đúng điểm từ vựng rằng câu này chỉ nói «nước».'
