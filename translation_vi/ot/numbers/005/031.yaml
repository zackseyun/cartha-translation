base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: vi
  text: Người đàn ông sẽ được miễn tội[a], còn người phụ nữ ấy sẽ gánh tội mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người chồng sẽ được miễn tội.”
    reason: lexical_alternative
  - marker: b
    text: Hay “sẽ gánh tội lỗi của mình”; thành ngữ Hê-bơ-rơ cũng có thể hàm ý phải gánh chịu hậu quả của tội.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: sẽ được miễn
  rationale: Thể Niphal của נקה diễn tả việc được thoát khỏi hoặc không còn phải chịu trách nhiệm; “được miễn” tự nhiên trong tiếng Việt và phù hợp với cấu trúc מִן + עָוֹן.
- source_word: הָאִישׁ
  choice: người đàn ông
  rationale: Dịch sát nghĩa cơ bản của אִישׁ, đồng thời ngữ cảnh cho thấy đây là người chồng; phương án theo ngữ cảnh được ghi ở chú thích.
- source_word: מֵעָוֺן
  choice: khỏi tội
  rationale: עָוֹן có thể chỉ sự gian ác, tội lỗi, trách nhiệm do tội hoặc hậu quả của tội. Trong kết cấu với נקה, “khỏi tội” giữ được sắc thái đạo đức-pháp lý mà không thu hẹp thành hình phạt.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: nhưng người phụ nữ ấy
  rationale: Liên từ וְ được diễn đạt là “nhưng” vì hai vế tương phản; “ấy” bảo lưu sức nhấn của đại từ chỉ định הַהִוא.
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: sẽ mang lấy tội mình
  rationale: Giữ thành ngữ נשׂא עָוֹן theo cách diễn đạt trang trọng nhưng dễ hiểu; thành ngữ có thể bao hàm cả việc gánh hậu quả do tội gây ra.
theological_decisions:
- issue: Ý nghĩa của עָוֹן trong hai vế
  choice: Dùng “tội” ở cả hai chỗ để giữ thế đối xứng đạo đức-pháp lý giữa việc người đàn ông được miễn và người phụ nữ phải mang lấy.
  alternative: “lỗi”, “sự gian ác”, hoặc “hình phạt do tội”
  rationale: “Tội” đủ rộng để chỉ hành vi sai trái cùng trách nhiệm gắn với nó, không cổ kính như một số từ Hán-Việt và không thu hẹp nghĩa thành hình phạt בלבד.
- issue: Phạm vi hàm nghĩa của “mang lấy tội”
  choice: Giữ nguyên thành ngữ, không xác định riêng là mang tình trạng có tội hay chịu hậu quả của tội.
  alternative: “sẽ chịu hậu quả vì tội mình”
  rationale: Nguyên văn có thể bao hàm cả trách nhiệm và hậu quả; bản dịch chính giữ sự căng nghĩa này, còn chú thích nêu khả năng về hậu quả.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế giữ sự tương phản của nguyên văn; “mang lấy tội mình” bảo tồn thành ngữ và độ mơ hồ có ý nghĩa của tiếng Hê-bơ-rơ.
