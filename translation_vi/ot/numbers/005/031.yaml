revisions:
- from: Người đàn ông sẽ được miễn khỏi tội[a], nhưng người phụ nữ ấy sẽ mang lấy tội mình[b].
  to: Người đàn ông sẽ được miễn tội[a], còn người phụ nữ ấy sẽ gánh tội mình[b].
  rationale: 'Sửa hai kết hợp từ để tiếng Việt tự nhiên hơn: “miễn tội” thay cho “miễn khỏi tội,” và “gánh tội” thay cho “mang lấy tội.” Liên từ “còn” diễn đạt sự đối lập của hai vế mà không mạnh hơn “nhưng.” Chú thích b cũng được chỉnh để phương án thay thế là tiếng Việt tự nhiên và ghi rõ, nhưng không quyết định thay bản văn chính, hàm ý hệ quả của thành ngữ.'
  reviewer_model: gpt-5.6-terra
