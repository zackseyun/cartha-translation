  terminology: Dùng nhất quán “tội” cho עָוֹן ở cả hai vế, bảo lưu phạm vi nghĩa gồm lỗi/trách nhiệm và hệ quả. “Được miễn tội” và “gánh tội mình” diễn đạt tương ứng tự nhiên hơn mà không áp đặt việc hiểu riêng là chỉ hình phạt.
  issues:
