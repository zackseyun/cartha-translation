    rationale: Tiếng Việt thường nói “được miễn tội” hoặc diễn đạt bằng “được giải trừ trách nhiệm”; thêm “khỏi” sau “miễn” tạo kết hợp gượng và có thể làm nghĩa thành miễn khỏi hành vi tội lỗi.
  - severity: low
    issue: “Mang lấy tội mình” kém tự nhiên hơn cách nói thành ngữ “gánh tội mình.”
    rationale: נשא עון là thành ngữ ‘bear guilt/iniquity’. “Gánh tội” là cách nói Việt ngữ tự nhiên, vẫn giữ tính cô đọng và không thu hẹp nghĩa vào hậu quả hay hình phạt.
