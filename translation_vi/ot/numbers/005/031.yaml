  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc đối lập của tiếng Hê-bơ-rơ: người đàn ông được giải trừ khỏi עָוֹן, còn người phụ nữ phải mang/gánh עָוֹן của mình. Tuy nhiên, “được miễn khỏi tội” không tự nhiên và có thể bị hiểu là được miễn trừ khỏi một tội theo nghĩa ân xá, thay vì được giải trừ trách nhiệm/liability trong thủ tục này.'
