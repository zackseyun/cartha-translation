  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: «YHWH», thường được dịch theo truyền thống là «Đức Giê-hô-va» hoặc «CHÚA».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức mở đầu lời truyền phán của Đức Chúa Trời, động từ דבר được diễn đạt tự nhiên và trang trọng bằng “phán”; dạng kể tiếp diễn đánh dấu một đơn vị lời nói mới.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Sau động từ “phán”, “với” là giới từ tự nhiên trong tiếng Việt để chỉ người tiếp nhận lời phán.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn nhập lời nói, “rằng” chuyển tự nhiên chức năng của nguyên mẫu לֵאמֹר và báo hiệu nội dung lời phán theo sau.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh. “Đức Giê-hô-va” giữ đây là danh riêng, có sắc thái trang trọng và quen thuộc với độc giả tiếng Việt; không thay danh ấy bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “phán với Môi-se rằng” giữ công thức dẫn nhập lời phán của tiếng Hê-bơ-rơ nhưng vẫn tự nhiên trong tiếng Việt.
