  to: Nhưng nếu nàng lấy chồng[a] khi các lời khấn nguyện của nàng vẫn còn ràng buộc nàng, hoặc một lời nói bồng bột từ môi nàng mà nàng đã dùng để tự ràng buộc mình[b],
