  text: וְ/אִם הָי֤וֹ תִֽהְיֶה֙ לְ/אִ֔ישׁ וּ/נְדָרֶ֖י/הָ עָלֶ֑י/הָ א֚וֹ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: vi
  text: Nhưng nếu nàng lấy chồng[a] khi các lời khấn nguyện của nàng vẫn còn ràng buộc nàng, hoặc một lời nói bồng bột từ môi nàng mà nàng đã dùng để tự ràng buộc mình[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nàng đã có chồng.” Thành ngữ Hê-bơ-rơ theo nghĩa đen là “nàng là/trở thành thuộc về một người đàn ông,” chỉ quan hệ hôn nhân.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một lời thốt ra từ môi.” Trong ngữ cảnh này, cụm từ có lẽ chỉ một lời tự cam kết được nói ra bồng bột, khác với lời khấn nguyện chính thức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Giữ cả ý nối tiếp và sự chuyển sang một trường hợp pháp lý khác trong mạch văn.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: nàng lấy chồng
  rationale: Đây là thành ngữ chỉ việc bước vào quan hệ hôn nhân hoặc ở trong quan hệ ấy. “Lấy chồng” tự nhiên trong tiếng Việt và không diễn đạt quan hệ hôn nhân như quyền sở hữu.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: trong khi các lời khấn nguyện vẫn còn ràng buộc nàng
  rationale: Diễn đạt hình ảnh nghĩa vụ đang đặt trên người nữ mà không quyết định trước hiệu lực cuối cùng của lời khấn, vốn được các câu sau xem xét.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: một lời nói bồng bột thốt ra từ môi
  rationale: Phân biệt phát ngôn tự buộc mình với lời khấn nguyện chính thức; “bồng bột” phản ánh sắc thái có thể có trong ngữ cảnh luật về lời khấn, còn chú thích bảo lưu nghĩa trung tính.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: nàng đã tự ràng buộc mình bằng
  rationale: Giữ ẩn dụ pháp lý của động từ “buộc/ràng buộc”; נֶפֶשׁ ở đây có chức năng phản thân, chỉ chính con người nàng.
theological_decisions:
- issue: Cách dịch נֶפֶשׁ trong bối cảnh lời khấn nguyện có tính pháp lý
  choice: mình
  alternative: linh hồn mình; mạng sống mình
  rationale: Cụm từ nói đến việc một người tự đặt nghĩa vụ lên chính mình, không đưa ra khẳng định về cấu tạo con người hay bản tính của linh hồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” phù hợp với nhân vật nữ trong điều luật; giữ câu chưa kết thúc bằng dấu phẩy vì câu nguồn tiếp tục sang phần quy định kế tiếp.
