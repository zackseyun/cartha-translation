  text: וְ/אִם הָפֵ֥ר יָפֵ֛ר אֹתָ֖/ם אַחֲרֵ֣י שָׁמְע֑/וֹ וְ/נָשָׂ֖א אֶת עֲוֺנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: vi
  text: Nhưng nếu người chồng thực sự hủy bỏ những điều ấy sau khi đã nghe về chúng[a], thì người chồng sẽ mang lấy tội lỗi của vợ mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sau khi đã nghe những điều ấy.”
    reason: alternative_reading
  - marker: b
    text: “Mang lấy tội lỗi của vợ mình” cũng có thể được hiểu là “chịu trách nhiệm về tội của vợ mình” hoặc “chịu hình phạt vì tội lỗi của vợ mình.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Trong mạch văn, liên từ mở đầu một điều kiện tương phản với trường hợp ở câu trước.
- source_word: הָפֵר יָפֵר
  choice: nhất quyết hủy bỏ
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi cùng động từ hữu hạn nhấn mạnh hành động; cách dịch này vừa thể hiện sự nhấn mạnh vừa phù hợp với ngữ cảnh pháp lý về việc hủy hiệu lực lời khấn.
- source_word: אֹתָם
  choice: những điều ấy
  rationale: Đại từ số nhiều chỉ về các lời khấn hoặc những điều tự ràng buộc đã nêu trong ngữ cảnh gần.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: sau khi đã nghe biết
  rationale: Diễn tả việc hủy bỏ xảy ra sau khi người chồng đã biết các lời khấn; “nghe biết” tự nhiên trong tiếng Việt và không buộc phải hiểu là nghe chính lời khấn được nói ra.
- source_word: וְנָשָׂא
  choice: thì người chồng sẽ mang lấy
  rationale: “Thì” làm rõ hệ quả của mệnh đề điều kiện; lặp lại chủ thể giúp câu tiếng Việt rõ ràng.
- source_word: עֲוֺנָהּ
  choice: tội lỗi của vợ mình
  rationale: Giữ thành ngữ pháp lý–đạo đức “mang lấy tội lỗi” và quan hệ sở hữu giống cái, nhưng không quyết định quá mức đó là tình trạng phạm tội, trách nhiệm hay hình phạt.
theological_decisions:
- issue: Ý nghĩa của việc “mang lấy tội lỗi” trong bối cảnh pháp lý
  choice: Giữ nguyên hình ảnh người chồng “mang lấy tội lỗi của vợ mình.”
  alternative: Người chồng chịu trách nhiệm về tội của vợ hoặc chịu hình phạt do tội ấy.
  rationale: Thành ngữ נָשָׂא עָוֹן có thể nói đến việc mang tội, chịu trách nhiệm hoặc gánh hậu quả/hình phạt. Bản dịch chính giữ độ mở thần học của nguyên văn, còn chú thích nêu các khả năng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Người chồng” được dùng thay cho đại từ đơn lẻ để làm rõ chủ thể trong một câu đứng riêng; “vợ mình” diễn đạt tự nhiên hậu tố sở hữu giống cái. Giữ sắc thái pháp lý của việc hủy bỏ lời khấn và giữ nguyên độ nhập nhằng của thành ngữ chỉ việc mang tội.
