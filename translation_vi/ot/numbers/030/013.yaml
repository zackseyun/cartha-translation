id: NUM.30.13
reference: Numbers 30:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: vi
  text: Nhưng nếu chồng nàng dứt khoát hủy bỏ chúng vào ngày chồng nàng nghe biết điều đó, thì mọi điều thốt ra từ môi nàng—dù là các lời hứa nguyện hay nghĩa vụ nàng tự ràng buộc mình—đều không có hiệu lực. Chồng nàng đã hủy bỏ chúng, và Đức Giê-hô-va sẽ tha thứ cho nàng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện có sắc thái tương phản với trường hợp trước.
- source_word: הָפֵר יָפֵר
  choice: nhất quyết hủy bỏ
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ nhấn mạnh tính dứt khoát của hành động; cách dịch này tự nhiên trong tiếng Việt.
- source_word: אִישָׁהּ
  choice: chồng nàng
  rationale: Trong ngữ cảnh luật hôn nhân, đây là nghĩa chính xác và tự nhiên.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: ngay trong ngày nghe được
  rationale: Giữ rõ giới hạn thời gian có ý nghĩa pháp lý trong nguyên văn.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: mọi điều thốt ra từ môi nàng
  rationale: Bảo tồn hình ảnh sát nghĩa 'mọi điều đi ra từ môi nàng', chỉ toàn bộ cam kết được nói ra.
- source_word: לִנְדָרֶיהָ
  choice: các lời khấn nguyện
  rationale: Cách gọi tự nhiên cho נדר trong bối cảnh tôn giáo và pháp lý.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: điều nàng tự buộc mình phải giữ
  rationale: Truyền đạt ý một nghĩa vụ do chính nàng đặt lên mình mà không thu hẹp thành một loại kiêng cữ cụ thể.
- source_word: לֹא יָקוּם
  choice: đều không có hiệu lực
  rationale: Diễn đạt thành ngữ pháp lý 'không đứng vững' bằng tiếng Việt hiện đại, rõ nghĩa.
- source_word: הֲפֵרָם
  choice: đã hủy bỏ chúng
  rationale: Giữ hành động hoàn tất và đối tượng số nhiều, chỉ các lời cam kết.
- source_word: וַיהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng danh riêng quen thuộc trong tiếng Việt để thể hiện YHWH, thay vì thay bằng một tước hiệu.
- source_word: יִסְלַח לָהּ
  choice: sẽ tha thứ cho nàng
  rationale: Phản ánh trực tiếp động từ סלח và không giải thích thêm bản chất của lỗi.
theological_decisions:
- issue: Ý nghĩa của sự tha thứ sau khi lời khấn bị hủy bỏ
  choice: Giữ nguyên mệnh đề rằng Đức Giê-hô-va sẽ tha thứ cho nàng sau khi chồng hủy bỏ các lời cam kết.
  alternative: Giải thích cụ thể rằng nàng được miễn tội vì không thực hiện lời khấn, hoặc rằng sự tha thứ chỉ liên quan đến việc khấn nguyện hấp tấp.
  rationale: Nguyên văn nêu trình tự pháp lý-thần học nhưng không xác định tường tận đối tượng hay căn cứ của sự tha thứ; bản dịch giữ sự căng thẳng đó.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng 'nàng' nhất quán với văn cảnh kể-luật cổ, tránh cách diễn đạt quá khẩu ngữ; 'không có hiệu lực' làm rõ sắc thái pháp lý của לֹא יָקוּם.
