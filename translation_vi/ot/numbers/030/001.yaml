base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: vi
  text: Môi-se nói với con cái Israel[a] theo mọi điều Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; cũng có thể dịch là “dân Israel”. Đây là một danh xưng giao ước quen thuộc chỉ cộng đồng Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói với
  rationale: Động từ có nghĩa cơ bản là “nói”; đi với אֶל, cách dịch “nói với” tự nhiên trong tiếng Việt và không hàm ý đây là lời trích dẫn trực tiếp.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Israel”, nhưng đây là danh xưng quen thuộc chỉ cộng đồng dân Israel; “con cái Israel” vừa giữ hình ảnh gia tộc vừa tự nhiên và bao quát trong tiếng Việt.
- source_word: כְּכֹל אֲשֶׁר
  choice: đúng theo mọi điều
  rationale: Tiền tố כְּ diễn tả sự phù hợp với chuẩn mực, nên “đúng theo mọi điều” bảo toàn ý “theo đúng tất cả những gì”, thay vì chỉ nêu nội dung lời nói.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Đã truyền” diễn đạt mệnh lệnh có thẩm quyền và cho thấy mệnh lệnh của Yahweh có trước lời Môi-se nói với dân.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho ông
  rationale: Môi-se là đối tượng nhận mệnh lệnh. Đại từ “ông” tránh lặp tên nặng nề trong tiếng Việt mà vẫn có sở chỉ rõ ràng ngay trong cùng câu.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo toàn tính chất danh riêng và không biến danh ấy thành tước hiệu.
- issue: Danh xưng giao ước בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai của Israel; dân Israel
  rationale: Hình thức Hê-bơ-rơ là giống đực số nhiều, nhưng toàn cụm hoạt động như danh xưng dân tộc-giao ước. “Con cái Israel” duy trì quan hệ dòng dõi mà không khiến độc giả Việt hiểu sai rằng câu chỉ nói đến nam giới; nghĩa sát chữ được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “đúng theo mọi điều” giữ sắc thái tuân thủ trọn vẹn của nguyên văn; dùng “ông” ở cuối câu để tránh lặp tên Môi-se mà không gây mơ hồ.
