  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: vi
  text: Nhưng nếu trong ngày ông nghe việc ấy, cha nàng phản đối, thì mọi lời khấn nguyện của nàng và mọi điều ràng buộc mà nàng đã tự buộc mình phải giữ[a] đều không còn hiệu lực[b]; Đức Giê-hô-va sẽ tha thứ cho nàng, vì cha nàng đã phản đối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những cam kết ràng buộc” hoặc “những điều nàng tự buộc mình phải làm.” Từ Hê-bơ-rơ chỉ nghĩa vụ một người tự đặt lên mình, đặc biệt trong bối cảnh khấn nguyện.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “không đứng vững”, nghĩa là không được duy trì như một nghĩa vụ có tính ràng buộc.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu điều kiện có tính tương phản với trường hợp trước; “Nhưng nếu” diễn đạt tự nhiên mối liên hệ ấy.
- source_word: הֵנִיא
  choice: ngăn nàng lại
  rationale: Trong luật về lời khấn nguyện, động từ chỉ hành động của người cha phản đối và làm cho cam kết không còn hiệu lực. Cách dịch này giữ đối tượng trực tiếp là người con gái như trong tiếng Hê-bơ-rơ, thay vì tự ý đổi thành “hủy lời khấn nguyện”.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: ngay trong ngày ông nghe biết
  rationale: Giữ rõ giới hạn thời gian pháp lý “trong ngày ông nghe”, đồng thời dùng lối nói tự nhiên trong tiếng Việt.
- source_word: כָּל נְדָרֶיהָ
  choice: mọi lời khấn nguyện của nàng
  rationale: נדר chỉ lời khấn nguyện hay lời thề nguyện mang tính cam kết; “lời khấn nguyện” phù hợp ngữ cảnh nghi lễ và pháp lý.
- source_word: וֶאֱסָרֶיהָ אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: mọi điều ràng buộc mà nàng đã tự buộc mình phải giữ
  rationale: 'Giữ nét nghĩa của danh từ và động từ cùng gốc אסר: một nghĩa vụ do chính người ấy đặt lên mình.'
- source_word: לֹא יָקוּם
  choice: đều không có hiệu lực
  rationale: Trong ngữ cảnh pháp lý, “không đứng vững” có nghĩa các cam kết không được duy trì như nghĩa vụ có hiệu lực; cách dịch này rõ ràng và tự nhiên.
- source_word: וַיהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng danh xưng riêng quen thuộc trong tiếng Việt để biểu đạt יהוה, thay vì đồng nhất danh ấy với một tước hiệu chung.
- source_word: יִסְלַח לָהּ
  choice: sẽ tha thứ cho nàng
  rationale: Diễn đạt trực tiếp động từ סלח với đối tượng là người con gái, không thêm nội dung về bản chất hay mức độ lỗi.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do được nêu ngay trong câu, ngắn gọn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của việc Đức Giê-hô-va tha thứ trong trường hợp lời khấn nguyện bị ngăn lại
  choice: Giữ nguyên lời khẳng định rằng Đức Giê-hô-va tha thứ cho người nữ vì cha nàng đã kịp thời ngăn nàng lại.
  alternative: Diễn giải cụ thể rằng nàng được tha vì đã phạm tội do không thực hiện lời khấn nguyện.
  rationale: Câu văn nói đến sự tha thứ trong bối cảnh pháp lý về hiệu lực của lời khấn nguyện nhưng không xác định đầy đủ bản chất hay phạm vi lỗi. Bản dịch vì thế không mở rộng thành một kết luận giáo lý vượt quá câu gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “nàng” phù hợp lối kể luật định trong đoạn văn và tránh sắc thái khẩu ngữ. Cấu trúc “mọi… đều không” truyền đạt tự nhiên phạm vi phủ định của tiếng Hê-bơ-rơ.
