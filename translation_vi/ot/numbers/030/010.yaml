translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “nàng” để quy chiếu rõ đến người phụ nữ và tránh lặp lại cụm danh từ dài; “có hiệu lực đối với” truyền đạt thành ngữ pháp lý Hê-bơ-rơ tự nhiên hơn lối dịch sát chữ “đứng trên/chống lại nàng”.
