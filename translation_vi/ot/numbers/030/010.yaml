  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: vi
  text: Còn lời khấn nguyện của một góa phụ hoặc một người phụ nữ đã ly hôn—mọi điều nàng dùng để ràng buộc mình—đều sẽ có hiệu lực đối với nàng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đều sẽ ràng buộc nàng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: lời thề
  rationale: Trong ngữ cảnh luật pháp và thờ phượng, từ này chỉ lời thề nguyện với Đức Chúa Trời; “lời thề” là cách diễn đạt rõ ràng, tự nhiên.
- source_word: אַלְמָנָה
  choice: góa phụ
  rationale: Tương đương trực tiếp, trang trọng và thông dụng cho người phụ nữ có chồng đã qua đời.
- source_word: גְרוּשָׁה
  choice: người phụ nữ đã ly hôn
  rationale: Phân từ bị động chỉ người phụ nữ đã bị cho ly hôn; cách dịch này tự nhiên và không suy diễn hoàn cảnh ly hôn.
- source_word: כֹּל אֲשֶׁר
  choice: mọi điều ...
  rationale: Giữ phạm vi bao quát của cụm từ, không giới hạn nội dung chỉ ở một loại lời thề.
- source_word: אָסְרָה עַל נַפְשָׁהּ
  choice: nàng dùng để ràng buộc mình
  rationale: Giữ hình ảnh “ràng buộc” của động từ אסר và ý nghĩa một nghĩa vụ do chính người phụ nữ tự đặt trên mình.
- source_word: יָקוּם עָלֶיהָ
  choice: đều sẽ có hiệu lực đối với nàng
  rationale: Diễn đạt tự nhiên ý nghĩa pháp lý rằng nghĩa vụ vẫn đứng vững và có tính ràng buộc đối với người đã lập lời thề.
