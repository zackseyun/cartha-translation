    issue: Cách diễn đạt thành ngữ לְעַנֹּת נָפֶשׁ trong chính văn
    rationale: '"Nhằm ép mình chịu khổ" không sai về nghĩa, nhưng "ép mình" dễ gợi cưỡng bách và câu văn hơi thiếu tự nhiên. "Để tự làm khổ mình" truyền đạt trực tiếp hơn ý thành ngữ mà không giới hạn nó vào việc kiêng ăn.'
  - severity: medium
    issue: 'Cụm từ trong chú thích: "tự kiêng ép"'
    rationale: '"Tự kiêng ép" không phải cách nói chuẩn, tự nhiên trong tiếng Việt hiện đại. "Tự kiêng khem" phản ánh tốt khả năng hiểu là tự từ bỏ/kiêng chế, bên cạnh "tự hạ mình."'
  revised_text: Mọi lời khấn nguyện và mọi lời thề ràng buộc để tự làm khổ mình[a], chồng nàng có thể xác nhận hoặc hủy bỏ.
