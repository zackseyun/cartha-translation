- from: Mọi lời khấn nguyện và mọi lời thề ràng buộc nhằm ép mình chịu khổ[a], chồng nàng có thể xác nhận hoặc hủy bỏ.
  to: Mọi lời khấn nguyện và mọi lời thề ràng buộc để tự làm khổ mình[a], chồng nàng có thể xác nhận hoặc hủy bỏ.
  rationale: Bản sửa thay cách nói hơi gượng bằng một diễn đạt tự nhiên hơn cho thành ngữ Hê-bơ-rơ, đồng thời chỉnh chú thích để dùng cách nói tiếng Việt chuẩn. Các thuật ngữ pháp lý và sự phân biệt giữa lời khấn nguyện với lời thề ràng buộc được giữ nguyên.
  reviewer_model: gpt-5.6-terra
