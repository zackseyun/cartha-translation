  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: vi
  text: Mọi lời khấn nguyện và mọi lời thề ràng buộc để tự làm khổ mình[a], chồng nàng có thể xác nhận hoặc hủy bỏ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “làm khổ linh hồn”; thành ngữ này cũng có thể hiểu là “tự kiêng khem” hoặc “tự hạ mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: lời khấn nguyện
  rationale: Trong ngữ cảnh luật lệ và thờ phượng, từ này chỉ lời cam kết long trọng với Đức Chúa Trời; “lời khấn nguyện” tự nhiên và phân biệt với “lời thề” theo sau.
- source_word: שְׁבֻעַת אִסָּר
  choice: lời thề ràng buộc
  rationale: Cách dịch này giữ cả yếu tố thề nguyện lẫn sức ràng buộc, hạn chế của אִסָּר.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: nhằm ép mình chịu khổ
  rationale: Thành ngữ Hê-bơ-rơ diễn tả việc tự hạ mình hoặc tự kiêng ép, thường có thể bao gồm kiêng ăn. Bản dịch truyền đạt ý nghĩa tự gây thiếu thốn hay khổ nhọc mà không giới hạn thành ngữ vào một thực hành duy nhất.
- source_word: נָפֶשׁ
  choice: mình
  rationale: Trong thành ngữ này, נֶפֶשׁ chỉ chính bản thân con người hơn là một bộ phận phi vật chất riêng biệt; “mình” là cách nói tự nhiên trong tiếng Việt.
- source_word: אִישָׁהּ
  choice: chồng nàng
  rationale: Ngữ cảnh hôn nhân xác định אִישָׁהּ là người chồng; “nàng” giữ lối văn trang trọng, gọn và tránh lặp từ.
- source_word: יְקִימֶנּוּ
  choice: có thể xác nhận
  rationale: Thể Hiphil của קום ở đây có nghĩa làm cho lời khấn nguyện hay lời thề tiếp tục có hiệu lực; “xác nhận” diễn đạt rõ sắc thái pháp lý.
- source_word: יְפֵרֶנּוּ
  choice: hủy bỏ
  rationale: Thể Hiphil của פרר trong luật về lời khấn nguyện có nghĩa làm mất hiệu lực; “hủy bỏ” là cách diễn đạt pháp lý tự nhiên trong tiếng Việt.
- source_word: כָּל ... וְכָל
  choice: Mọi ... và mọi ...
  rationale: Giữ nguyên tính bao quát và cấu trúc phân phối lặp lại của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “khấn nguyện” cho נֵדֶר để giữ sắc thái thiêng liêng, còn “lời thề ràng buộc” bảo toàn hai thành tố của cụm Hê-bơ-rơ. Thành ngữ לְעַנֹּת נָפֶשׁ được diễn đạt tự nhiên trong chính văn và giữ dạng sát chữ cùng các khả năng khác ở chú thích.
