  terminology: “Lời khấn” và “điều ràng buộc” phân biệt hợp lý hai thuật ngữ נֵדֶר và אִסָּר. “Có hiệu lực” diễn đạt phù hợp nghĩa pháp lý của קוּם. “Tự buộc mình phải giữ” giữ ý tự áp đặt ràng buộc lên bản thân.
  issues:
