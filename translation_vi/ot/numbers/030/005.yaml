  source_fidelity: 'Cần sửa liên từ giữa “lời khấn” và “điều ràng buộc”: tiếng Hê-bơ-rơ có וְ (“và”), không phải “hoặc”. Các thành phần khác truyền đạt đúng cấu trúc điều kiện, sự im lặng của người cha, và hiệu lực pháp lý tiếp theo.'
