source:
  edition: WLC
  text: וְ/שָׁמַ֨ע אָבִ֜י/הָ אֶת נִדְרָ֗/הּ וֶֽ/אֱסָרָ/הּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל נַפְשָׁ֔/הּ וְ/הֶחֱרִ֥ישׁ לָ֖/הּ אָבִ֑י/הָ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: vi
  text: Nếu cha nàng nghe lời khấn của nàng và điều ràng buộc mà nàng đã tự buộc mình phải giữ, và cha nàng im lặng, không nói gì với nàng[a], thì mọi lời khấn của nàng đều có hiệu lực, và mọi điều ràng buộc mà nàng đã tự buộc mình phải giữ cũng có hiệu lực[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cha nàng im lặng đối với nàng.” Trong trường hợp luật định này, sự im lặng dẫn đến việc các lời khấn và điều ràng buộc vẫn có hiệu lực.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đều đứng vững.” Ở đây, động từ Hê-bơ-rơ mang nghĩa các cam kết vẫn được xác lập hoặc vẫn còn hiệu lực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: lời khấn của nàng / mọi lời khấn của nàng
  rationale: Trong ngữ cảnh luật pháp và thờ phượng, נֵדֶר chỉ lời khấn nguyện, thường hướng về Đức Chúa Trời. “Lời khấn” là cách nói rõ ràng, trang trọng và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֱסָרָהּ / אִסָּר
  choice: điều ràng buộc
  rationale: אִסָּר chỉ một sự hạn chế hay cam kết có tính bắt buộc do chính người ấy đặt trên mình, có liên hệ nhưng khác với נֵדֶר. “Điều ràng buộc” giữ được sắc thái pháp lý và sự phân biệt từ vựng.
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: nàng đã tự buộc mình phải giữ
  rationale: Cách dịch này giữ ý tự đặt sự ràng buộc lên chính mình, đồng thời diễn đạt tự nhiên hơn lối dịch sát chữ “buộc trên linh hồn mình”.
- source_word: וְהֶחֱרִישׁ לָהּ אָבִיהָ
  choice: cha nàng im lặng, không nói gì với nàng
  rationale: Động từ חָרַשׁ ở đây có nghĩa là giữ im lặng. Cụm bổ sung “không nói gì với nàng” làm rõ đối tượng của sự im lặng mà chưa diễn giải sự im lặng thành sự chấp thuận.
- source_word: וְקָמוּ ... יָקוּם
  choice: đều có hiệu lực / cũng có hiệu lực
  rationale: Trong bối cảnh luật định, קום diễn tả việc lời khấn hay điều ràng buộc vẫn đứng vững, tức vẫn có giá trị bắt buộc. “Có hiệu lực” truyền đạt rõ sắc thái pháp lý trong tiếng Việt hiện đại.
- source_word: כָּל
  choice: mọi
  rationale: “Mọi” diễn đạt tự nhiên phạm vi bao quát của כָּל trong cả hai mệnh đề.
theological_decisions:
- issue: Ý nghĩa pháp lý của sự im lặng của người cha
  choice: Giữ hành động “im lặng, không nói gì” trong chính văn; diễn đạt kết quả riêng là các cam kết “có hiệu lực”.
  alternative: Dịch trực tiếp rằng người cha “không phản đối” hoặc “mặc nhiên chấp thuận”.
  rationale: Nguyên văn nêu sự im lặng rồi quy định hệ quả pháp lý, chứ không trực tiếp gọi đó là sự chấp thuận. Cách chọn này tránh giải quyết thay cho văn bản quan hệ giữa im lặng, không phản đối và chấp thuận.
translation_notes:
  register: Văn phong luật định, trang trọng nhưng dễ hiểu. Dùng “nàng” để giữ mạch văn Kinh Thánh trang nghiêm; lặp cấu trúc “mọi lời khấn... mọi điều ràng buộc” nhằm bảo toàn sự phân biệt và tính nhấn mạnh của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
