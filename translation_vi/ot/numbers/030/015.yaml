  text: וְ/אִם הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥/הּ אִישָׁ/הּ֮ מִ/יּ֣וֹם אֶל יוֹם֒ וְ/הֵקִים֙ אֶת כָּל נְדָרֶ֔י/הָ א֥וֹ אֶת כָּל אֱסָרֶ֖י/הָ אֲשֶׁ֣ר עָלֶ֑י/הָ הֵקִ֣ים אֹתָ֔/ם כִּי הֶחֱרִ֥שׁ לָ֖/הּ בְּ/י֥וֹם שָׁמְעֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: vi
  text: Nhưng nếu chồng nàng cứ im lặng với nàng từ ngày này sang ngày khác, thì người ấy xác nhận mọi lời khấn nguyện của nàng, hoặc mọi điều ràng buộc mà nàng đã nhận lấy. Người ấy đã xác nhận các điều đó, vì đã im lặng với nàng vào ngày người ấy nghe biết việc ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: cứ im lặng
  rationale: Kết cấu nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh sự im lặng; “cứ im lặng” vừa tự nhiên vừa thể hiện sự tiếp diễn trong bối cảnh người chồng không phản đối.
- source_word: אִישָׁהּ
  choice: chồng nàng
  rationale: Trong bối cảnh luật lệ hôn nhân, אִישׁ với hậu tố ngôi ba giống cái số ít chỉ người chồng.
- source_word: מִיּוֹם אֶל יוֹם
  choice: từ ngày này sang ngày khác
  rationale: Giữ ý của thành ngữ chỉ sự im lặng kéo dài qua các ngày liên tiếp.
- source_word: וְהֵקִים
  choice: thì người ấy xác nhận
  rationale: 'Thể Hiphil của קום tại đây mang hiệu lực pháp lý: làm cho lời khấn tiếp tục có hiệu lực; “xác nhận” truyền đạt rõ nghĩa ấy.'
- source_word: נְדָרֶיהָ
  choice: mọi lời khấn nguyện
  rationale: “Lời khấn nguyện” là cách diễn đạt trang trọng, dễ hiểu cho נדר trong bối cảnh luật lệ và thờ phượng.
- source_word: אֱסָרֶיהָ
  choice: mọi điều ràng buộc
  rationale: Danh từ bắt nguồn từ אסר, “buộc/ràng buộc”, chỉ những cam kết tự nguyện có tính bắt buộc; cách dịch này giữ hình ảnh và hiệu lực pháp lý của từ Hê-bơ-rơ.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: đang đặt trên nàng
  rationale: Giữ ẩn dụ Hê-bơ-rơ về những nghĩa vụ nằm trên một người, đồng thời vẫn rõ nghĩa trong văn phong trang trọng.
- source_word: הֵקִים אֹתָם
  choice: Người ấy đã xác nhận chúng
  rationale: Thể hoàn thành tóm lược hiệu lực pháp lý phát sinh từ việc im lặng trước đó.
- source_word: כִּי
  choice: vì
  rationale: Liên từ mang nghĩa nguyên nhân, giải thích tại sao các lời khấn và điều ràng buộc được xác nhận.
- source_word: הֶחֱרִשׁ לָהּ
  choice: đã im lặng
  rationale: Trong tiếng Việt không cần dịch cứng giới từ לָהּ; ngữ cảnh đã cho thấy sự im lặng của người chồng đối với lời khấn của nàng.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: vào ngày nghe biết
  rationale: Bám sát công thức thời gian của nguyên văn và giữ trọng tâm pháp lý vào ngày người chồng nghe biết.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng/người ấy” để tránh lặp nặng nề nhưng vẫn giữ rõ các chủ thể trong quy định pháp lý; giữ hình ảnh “đặt trên nàng” của nguyên văn.
