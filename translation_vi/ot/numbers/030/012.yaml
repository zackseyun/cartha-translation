  text: וְ/שָׁמַ֤ע אִישָׁ/הּ֙ וְ/הֶחֱרִ֣שׁ לָ֔/הּ לֹ֥א הֵנִ֖יא אֹתָ֑/הּ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: vi
  text: Nhưng nếu chồng nàng nghe mà không nói gì với nàng, không hủy bỏ lời khấn nguyện hay điều ràng buộc của nàng[a], thì mọi lời khấn nguyện của nàng vẫn có hiệu lực, và mọi điều ràng buộc mà nàng đã tự đặt trên mình cũng vẫn có hiệu lực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng đại từ chỉ chính người phụ nữ: “không làm vô hiệu nàng.” Trong văn cảnh, ý nói người chồng không hủy bỏ lời khấn nguyện hay điều ràng buộc của nàng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Nhưng nếu ... nghe
  rationale: Dạng waw + qatal tiếp tục cấu trúc luật điều kiện của văn cảnh; tiếng Việt cần nêu rõ “nếu”. “Nhưng” thể hiện sự đối lập với trường hợp người chồng hủy bỏ lời khấn ở câu trước.
- source_word: אִישָׁהּ
  choice: chồng nàng
  rationale: Trong luật về người phụ nữ đã kết hôn, אִישׁ kèm hậu tố ngôi ba giống cái số ít chỉ người chồng.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: vẫn im lặng
  rationale: Thành ngữ chỉ việc không lên tiếng phản đối sau khi nghe. “Vẫn im lặng” tự nhiên trong tiếng Việt và giữ được ý nghĩa pháp lý của sự im lặng; thành tố לָהּ được hiểu theo quan hệ với nàng trong văn cảnh.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: không hủy bỏ lời khấn nguyện của nàng
  rationale: Động từ ở thể khiến khiến diễn tả việc làm mất hiệu lực lời khấn hay điều ràng buộc. Bản dịch nêu rõ đối tượng được ngụ ý để tránh cách hiểu rằng người chồng “hủy bỏ” chính người vợ; chú thích bảo lưu cấu trúc nguyên văn.
- source_word: וְקָמוּ כָּל נְדָרֶיהָ
  choice: mọi lời khấn nguyện của nàng vẫn có hiệu lực
  rationale: קום trong ngữ cảnh pháp lý nói đến việc tiếp tục có giá trị. “Vẫn có hiệu lực” rõ nghĩa hơn lối dịch sát “đứng vững” trong tiếng Việt hiện đại.
- source_word: וְכָל אִסָּר
  choice: mọi điều ràng buộc
  rationale: אִסָּר chỉ một sự hạn chế hay nghĩa vụ có tính ràng buộc do lời cam kết đặt ra. Cách dịch này cũng cho phép giữ phép lặp từ với động từ אָסְרָה.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: mà nàng đã tự buộc mình vào
  rationale: Giữ hình ảnh Hê-bơ-rơ về việc buộc một điều trên chính mình, đồng thời diễn đạt tự nhiên và rõ chủ thể tự nguyện gánh sự ràng buộc.
- source_word: יָקוּם
  choice: cũng vẫn có hiệu lực
  rationale: Động từ số ít đi với cụm mang tính tập hợp trong tiếng Hê-bơ-rơ. Bản dịch lặp lại kết quả pháp lý để bảo tồn cấu trúc song song của câu.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “nàng” để quy chiếu nhất quán đến người phụ nữ trong điều luật; “có hiệu lực” chuyển tải chính xác sắc thái pháp lý của קום, còn “điều ràng buộc… tự buộc mình vào” giữ phép lặp từ của nguyên bản mà vẫn dễ hiểu.
