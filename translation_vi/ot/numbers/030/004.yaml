  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: vi
  text: Nếu một phụ nữ khấn một lời nguyện với Yahweh[a] và tự ràng buộc mình bằng một cam kết[b] trong nhà cha mình, khi còn trẻ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng động từ và danh từ cùng gốc, sát nghĩa là “khấn một lời nguyện”, nhằm nhấn mạnh hành vi chính thức lập lời nguyện.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và tự ràng buộc mình bằng một điều ràng buộc”. Tiếng Hê-bơ-rơ dùng một động từ và danh từ liên hệ với nhau để diễn tả việc tự đặt mình dưới một cam kết có tính ràng buộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: Nếu một người nữ
  rationale: Cụm này mở đầu một trường hợp trong luật; “nếu” diễn đạt tự nhiên sắc thái điều kiện của כִּי, còn “người nữ” giữ phạm vi nghĩa rộng hơn “thiếu nữ”.
- source_word: תִדֹּר נֶדֶר
  choice: khấn lời nguyện
  rationale: Diễn đạt hành vi lập lời nguyện một cách tự nhiên, trang trọng; chú thích ghi nhận kết cấu đồng căn của nguyên văn.
- source_word: לַיהוָה
  choice: với Yahweh
  rationale: Giữ danh riêng giao ước יהוה theo dạng phiên âm Yahweh; giới từ ל trong ngữ cảnh khấn nguyện được diễn đạt tự nhiên bằng “với”.
- source_word: וְאָסְרָה אִסָּר
  choice: và tự buộc mình bằng một điều cam kết
  rationale: Giữ ý người nữ đặt chính mình dưới một nghĩa vụ ràng buộc, đồng thời phân biệt cụm này với נֶדֶר ở trước.
- source_word: בְּבֵית אָבִיהָ
  choice: đang ở trong nhà cha mình
  rationale: Giữ bối cảnh gia hộ và quan hệ với người cha mà không thêm diễn giải pháp lý không được nói rõ trong câu.
- source_word: בִּנְעֻרֶיהָ
  choice: khi còn trẻ
  rationale: Diễn đạt tự nhiên thời kỳ tuổi trẻ, không tự ý chuyển thành tình trạng chưa kết hôn dù ngữ cảnh có thể hàm ý điều đó.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Phiên âm trực tiếp danh giao ước trong nguyên văn và làm rõ đây là danh riêng, không phải một tước hiệu.
- issue: Tình trạng pháp lý hàm ý bởi בִּנְעֻרֶיהָ בְּבֵית אָבִיהָ
  choice: khi còn trẻ, đang ở trong nhà cha mình
  alternative: khi còn là thiếu nữ chưa chồng dưới quyền cha
  rationale: Giữ nguyên cách mô tả của tiếng Hê-bơ-rơ, không biến hàm ý theo ngữ cảnh thành lời khẳng định rõ hơn nguyên văn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Câu được giữ ở dạng mệnh đề điều kiện chưa trọn vẹn vì câu Hê-bơ-rơ tiếp tục sang câu sau. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
