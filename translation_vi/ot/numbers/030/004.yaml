  - severity: low
    issue: Trật tự các cụm chỉ hoàn cảnh đã bị đảo
    rationale: Nguyên văn đặt “trong nhà cha mình” trước “khi còn trẻ”. Giữ trật tự này giúp bám sát nguồn hơn mà vẫn tự nhiên.
  - severity: low
