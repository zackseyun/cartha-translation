revisions:
- from: Và nếu tại nhà chồng, nàng đã khấn nguyện, hoặc lấy lời thề buộc mình vào một điều ràng buộc,
  to: Và nếu trong nhà chồng, cô ấy đã lập lời khấn, hoặc tự đặt mình dưới một điều ràng buộc[a] bằng lời thề,
  rationale: Bản sửa thay thế cách diễn đạt có thể gây lệch nghĩa hoặc gượng bằng các thuật ngữ pháp lý hiện đại. Nó giữ liên từ nối tiếp “Và nếu,” địa điểm “trong nhà chồng,” hai khả năng “lập lời khấn” hoặc tự đặt mình dưới sự ràng buộc, và yếu tố lời thề. Chú thích được neo đúng tại cụm dịch cấu trúc đồng căn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:20:40Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc điều kiện, bối cảnh ở nhà chồng, hành vi lập lời khấn, và sự tự ràng buộc bằng lời thề. Tuy nhiên, “khấn nguyện” dễ gợi hành vi cầu nguyện hơn là lập một lời khấn có hiệu lực pháp lý; cụm “lấy lời thề buộc mình vào một điều ràng buộc” nặng và chưa tự nhiên.
  naturalness: Nên dùng văn phong pháp lý hiện đại, tránh “nàng” mang sắc thái văn chương. “Trong nhà chồng” và “cô ấy” rõ ràng, tự nhiên hơn trong câu luật lệ này. Câu vẫn giữ dấu phẩy vì mệnh đề tiếp tục ở câu sau.
  terminology: Dịch נָדָרָה là “lập lời khấn” để phân biệt với cầu nguyện. Dịch אָסְרָה אִסָּר עַל נַפְשָׁהּ là “tự đặt mình dưới một điều ràng buộc,” bảo toàn ý tự cam kết/hạn chế; “bằng lời thề” dịch בִּשְׁבֻעָה. Không cần diễn giải thần học.
  issues:
  - severity: medium
    issue: “khấn nguyện” có thể bị hiểu là cầu nguyện.
    rationale: נדר chỉ hành vi lập lời khấn/lời nguyện có tính cam kết, không nhất thiết là hành vi cầu nguyện.
  - severity: medium
    issue: “lấy lời thề buộc mình vào một điều ràng buộc” gượng và lặp ý.
    rationale: Cụm này tuy cố phản ánh cấu trúc đồng căn, nhưng không tự nhiên trong tiếng Việt hiện đại. Cách “tự đặt mình dưới một điều ràng buộc bằng lời thề” giữ được ý pháp lý và phương tiện là lời thề.
  - severity: low
    issue: “nàng” mang sắc thái văn chương.
    rationale: “Cô ấy” phù hợp hơn với văn phong pháp lý hiện đại và vẫn biểu thị giống cái của hậu tố Hê-bơ-rơ.
