  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: vi
  text: Và nếu trong nhà chồng, cô ấy đã lập lời khấn, hoặc tự đặt mình dưới một điều ràng buộc[a] bằng lời thề,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “tự buộc một sự ràng buộc trên mình bằng lời thề.”'
    reason: Giải thích cấu trúc đồng căn của động từ và danh từ Hê-bơ-rơ, đồng thời cho thấy ý tự ràng buộc.
lexical_decisions:
- source_word: וְאִם
  choice: Và nếu
  rationale: Giữ quan hệ nối tiếp trong chuỗi quy định pháp lý, đồng thời mở đầu điều kiện mới.
- source_word: בֵּית אִישָׁהּ
  choice: tại nhà chồng
  rationale: Diễn đạt tự nhiên trong tiếng Việt, vẫn giữ bối cảnh địa điểm và gia đình của cụm Hê-bơ-rơ 'nhà của chồng nàng'.
- source_word: נָדָרָה
  choice: nàng đã khấn nguyện
  rationale: Truyền đạt hành vi lập lời khấn có tính cam kết; 'khấn nguyện' trang trọng và dễ hiểu trong văn cảnh luật lệ.
- source_word: אוֹ
  choice: hoặc
  rationale: Giữ nguyên quan hệ lựa chọn giữa hai hành vi pháp lý có liên hệ.
- source_word: אָסְרָה אִסָּר
  choice: buộc mình vào một điều ràng buộc
  rationale: Phản ánh kết cấu đồng căn động từ–danh từ và ý tự đặt mình dưới một nghĩa vụ hay hạn chế có tính ràng buộc.
- source_word: עַל נַפְשָׁהּ
  choice: mình
  rationale: Trong thành ngữ này, נֶפֶשׁ chỉ chính bản thân người phụ nữ, không nên dịch hẹp thành 'linh hồn'.
- source_word: בִּשְׁבֻעָה
  choice: lấy lời thề
  rationale: 'Giữ sắc thái phương tiện hoặc hoàn cảnh đi kèm: sự tự ràng buộc được xác lập bằng lời thề.'
