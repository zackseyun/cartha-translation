translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. Dùng 'nàng' để chỉ người phụ nữ theo mạch văn và tránh thêm chủ ngữ không có trong câu; giữ câu chưa kết thúc bằng dấu phẩy vì câu Hê-bơ-rơ tiếp tục sang mệnh đề kế tiếp.
