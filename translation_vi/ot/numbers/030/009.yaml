id: NUM.30.9
reference: Numbers 30:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: vi
  text: Nhưng nếu ngay trong ngày người chồng nghe biết, ông ngăn cản nàng và hủy bỏ lời khấn đang ràng buộc nàng, cùng lời từ môi nàng mà nàng đã dùng để tự buộc mình, thì Yahweh sẽ tha thứ cho nàng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện có sắc thái tương phản với trường hợp trước.
- source_word: בְּיוֹם שְׁמֹעַ
  choice: ngay trong ngày ... nghe biết
  rationale: Giữ ý pháp lý rằng sự ngăn cản phải xảy ra vào ngày người chồng biết việc ấy; “nghe biết” tự nhiên trong tiếng Việt.
- source_word: אִישָׁהּ
  choice: người chồng
  rationale: Trong ngữ cảnh luật về lời khấn của người phụ nữ, từ này chỉ chồng của nàng.
- source_word: יָנִיא אֹתָהּ
  choice: ông ngăn cản nàng
  rationale: Hiphil của נוא ở đây chỉ việc không cho nghĩa vụ từ lời khấn tiếp tục có hiệu lực; “ngăn cản” giữ được đối tượng là người phụ nữ.
- source_word: וְהֵפֵר
  choice: và hủy bỏ
  rationale: Diễn đạt hành vi làm mất hiệu lực pháp lý của lời khấn.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: lời khấn đang ràng buộc nàng
  rationale: Truyền đạt tự nhiên hình ảnh nghĩa vụ ở trên nàng mà không làm mất ý ràng buộc.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: lời nàng đã thốt ra
  rationale: מִבְטָא trước hết là lời phát ra hay lời nói; bản thân từ này không buộc phải mang nghĩa “hấp tấp”, nên bản chính giữ cách dịch trung tính.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: mà tự buộc mình
  rationale: Diễn đạt thành ngữ chỉ việc một người tự đặt mình dưới một nghĩa vụ.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn.
- source_word: יִסְלַח לָהּ
  choice: sẽ tha thứ cho nàng
  rationale: סלח diễn tả sự tha thứ; thì tương lai phù hợp với hệ quả pháp lý được nêu.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; “Yahweh” bảo tồn tính chất danh riêng mà không nhập một truyền thống hệ phái riêng.
- issue: Sắc thái của מִבְטָא שְׂפָתֶיהָ
  choice: lời nàng đã thốt ra
  alternative: lời hấp tấp nàng đã thốt ra; lời ràng buộc từ môi nàng
  rationale: Từ ngữ chắc chắn chỉ một lời nói được phát ra, nhưng sắc thái “hấp tấp” không hoàn toàn chắc chắn; vì vậy bản chính không giải quyết quá mức điểm mơ hồ và ghi phương án khác ở chú thích.
- issue: Quan hệ giữa lời khấn và lời thốt ra
  choice: dùng “cùng”
  alternative: hoặc
  rationale: Nguyên văn có וְאֵת, về hình thức là “và/cùng”; cách dịch này giữ cấu trúc nguồn thay vì đổi thành quan hệ lựa chọn.
translation_notes:
  register: Văn phong pháp lý nhưng dễ hiểu, trang trọng và hiện đại. Dùng “nàng/ông” để theo dõi rõ các chủ thể trong câu dài; giữ danh Yahweh và tránh thuật ngữ hệ phái.
