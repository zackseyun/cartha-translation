  text: וְ/שָׁמַ֥ע אִישָׁ֛/הּ בְּ/י֥וֹם שָׁמְע֖/וֹ וְ/הֶחֱרִ֣ישׁ לָ֑/הּ וְ/קָ֣מוּ נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֻֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: vi
  text: Nếu chồng nàng nghe biết điều đó, và vào ngày nghe biết ấy im lặng với nàng[a], thì những lời khấn nguyện của nàng sẽ có hiệu lực, và những điều ràng buộc[b] mà nàng đã tự ràng buộc mình cũng sẽ có hiệu lực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và không nói gì với nàng.” Thành ngữ Hê-bơ-rơ “im lặng với nàng” hàm ý người chồng không phản đối; vì vậy lời khấn vẫn có hiệu lực.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những nghĩa vụ” hoặc “những điều tự ràng buộc.” Từ Hê-bơ-rơ chỉ các cam kết có tính ràng buộc mà nàng tự đặt trên mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Nếu ... nghe được
  rationale: Trong chuỗi luật lệ theo tình huống, dạng động từ này tiếp tục một mệnh đề điều kiện; “Nếu ... nghe được” diễn đạt tự nhiên chức năng ấy trong tiếng Việt.
- source_word: אִישָׁהּ
  choice: chồng nàng
  rationale: Trong ngữ cảnh luật hôn nhân, danh từ אִישׁ kèm hậu tố ngôi ba giống cái số ít chỉ người chồng.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: vào chính ngày ấy
  rationale: Cụm từ nhấn mạnh ngày người chồng nghe biết sự việc là thời điểm có hiệu lực pháp lý; “chính” làm rõ tính giới hạn của ngày đó mà không thêm một thời hạn ngoài nguyên văn.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: mà vẫn im lặng với nàng
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, đồng thời trong ngữ cảnh cho thấy người chồng không lên tiếng phản đối.
- source_word: וְקָמוּ ... יָקֻמוּ
  choice: vẫn có hiệu lực ... cũng vẫn có hiệu lực
  rationale: קוּם trong văn cảnh pháp lý có nghĩa là đứng vững, tiếp tục hợp lệ. Lặp lại cùng cách diễn đạt để bảo toàn sự nhấn mạnh của nguyên văn.
- source_word: נְדָרֶיהָ
  choice: những lời khấn nguyện của nàng
  rationale: Diễn đạt lời cam kết long trọng hướng đến Đức Chúa Trời trong văn cảnh luật về lời khấn.
- source_word: וֶאֱסָרֶהָ
  choice: những điều ràng buộc
  rationale: Danh từ phát sinh từ אסר mang ý niệm một sự ràng buộc hoặc nghĩa vụ mà người nói tự đặt lên mình.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: mà nàng đã tự buộc mình phải giữ
  rationale: Bảo lưu ẩn dụ “buộc/ràng buộc” của nguyên văn, nhưng diễn đạt tự nhiên trong tiếng Việt rằng đây là nghĩa vụ nàng tự nhận.
theological_decisions:
- issue: Giá trị pháp lý của lời khấn khi người chồng im lặng
  choice: “vẫn có hiệu lực”
  alternative: “sẽ đứng vững”
  rationale: Cách dịch được chọn truyền đạt nghĩa pháp lý của קוּם mà không suy diễn bản chất thần học hay phạm vi của quyền người chồng vượt quá câu văn.
translation_notes:
  register: Văn phong pháp lý nhưng sáng rõ, trang trọng và tự nhiên trong tiếng Việt hiện đại. Dùng “nàng” để các đại từ trong đoạn luật được liền mạch; lặp “vẫn có hiệu lực” nhằm phản ánh phép lặp có chủ ý trong nguyên văn.
