id: NUM.30.3
reference: Numbers 30:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: vi
  text: Nếu một người nam lập lời khấn dâng Yahweh, hoặc thề để tự ràng buộc mình bằng một nghĩa vụ ràng buộc[a], thì người ấy không được vi phạm lời mình[b]; người ấy phải thực hiện mọi điều mình đã nói ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để tự buộc mình vào một nghĩa vụ.” Tiếng Hê-bơ-rơ, sát chữ: “buộc một sự ràng buộc trên chính mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “không được làm cho lời mình ra phàm,” nghĩa là không được vi phạm lời ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: một người nam
  rationale: Giữ giống đực số ít của nguyên văn trong quy định pháp lý này, đồng thời diễn đạt tự nhiên hơn cách chỉ dùng “người”.
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện trong văn luật.
- source_word: יִדֹּר נֶדֶר
  choice: khấn nguyện
  rationale: Chuyển cấu trúc đồng căn động từ–danh từ sang một động từ tiếng Việt tự nhiên, vẫn giữ ý lập lời nguyện trang trọng.
- source_word: לַיהוָה
  choice: với Yahweh
  rationale: Giữ danh riêng giao ước יהוה; giới từ ל trong ngữ cảnh lời khấn được diễn đạt tự nhiên là “với”.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: thề
  rationale: Động từ tiếng Việt tự nhiên đã hàm nghĩa lập lời thề, tương ứng với cấu trúc đồng căn trong tiếng Hê-bơ-rơ.
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: để tự ràng buộc mình bằng một điều cam kết
  rationale: Thể hiện nghĩa một người tự đặt mình dưới một nghĩa vụ; “điều cam kết” giữ tính pháp lý mà không dùng lối lặp gượng ép của nguyên văn.
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: không được nuốt lời
  rationale: Thành ngữ Việt tự nhiên diễn đạt việc không vi phạm lời mình đã nói; nghĩa sát chữ liên quan đến làm cho lời ấy ra phàm tục được ghi chú.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: phải làm mọi điều đã ra khỏi miệng mình
  rationale: Giữ hình ảnh cụ thể của nguyên văn về lời phát ra từ miệng, đồng thời dùng “phải” để biểu thị nghĩa vụ pháp lý.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה; phiên âm “Yahweh” giúp phân biệt danh riêng này với một tước hiệu.
- issue: Sắc thái của חלל trong cụm לֹא יַחֵל דְּבָרוֹ
  choice: không được nuốt lời
  alternative: không được làm cho lời mình ra phàm tục; không được vi phạm lời mình
  rationale: Bản chính ưu tiên thành ngữ Việt rõ nghĩa, còn chú thích bảo tồn sắc thái thánh–phàm của động từ Hê-bơ-rơ mà không áp đặt một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, phù hợp một quy định pháp lý. Giữ danh Yahweh và hình ảnh “ra khỏi miệng”; dùng “người ấy” để tránh lặp đại từ thiếu tự nhiên. Tất cả ký hiệu chú thích đều có mặt trong chính văn.
