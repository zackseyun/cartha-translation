revisions:
- from: Nếu một người nam khấn nguyện với Yahweh, hoặc thề để tự ràng buộc mình bằng một điều cam kết[a], thì người ấy không được nuốt lời[b]; người ấy phải làm mọi điều đã ra khỏi miệng mình.
  to: Nếu một người nam lập lời khấn dâng Yahweh, hoặc thề để tự ràng buộc mình bằng một nghĩa vụ ràng buộc[a], thì người ấy không được vi phạm lời mình[b]; người ấy phải thực hiện mọi điều mình đã nói ra.
  rationale: Bản sửa làm rõ lời khấn được dâng cho Yahweh, dùng thuật ngữ nghĩa vụ phù hợp hơn với אִסָּר, thay thành ngữ hơi khẩu ngữ bằng cách diễn đạt pháp lý hiện đại, và chuyển hình ảnh “ra khỏi miệng” thành cấu trúc tiếng Việt tự nhiên mà vẫn giữ trọn nghĩa phải thực hiện điều đã nói. Hai chú thích được giữ đúng vị trí và làm rõ các phương án sát chữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:20:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo phản ánh đúng cấu trúc điều kiện và các ý chính của nguyên văn: người nam, lời khấn dâng Yahweh, lời thề tự ràng buộc, không được vi phạm lời mình, và phải thực hiện điều mình nói. Tuy nhiên, “khấn nguyện với Yahweh” có thể gợi ý cầu nguyện cùng Yahweh hơn là lập một lời khấn dâng cho Ngài; “mọi điều đã ra khỏi miệng mình” cũng không tự nhiên khi đi với “làm”.'
  naturalness: Cần điều chỉnh nhẹ để tiếng Việt hiện đại, trang trọng và pháp lý hơn. “Lập lời khấn dâng Yahweh” phân biệt rõ lời khấn với lời cầu nguyện. “Thực hiện mọi điều mình đã nói ra” truyền đạt thành ngữ Hê-bơ-rơ cách tự nhiên. “Nuốt lời” dễ hiểu nhưng hơi khẩu ngữ đối với văn luật; “vi phạm lời mình” phù hợp hơn.
  terminology: Giữ “Yahweh” theo quyết định thuật ngữ. “Nghĩa vụ ràng buộc” diễn đạt chính xác hơn “điều cam kết” cho אִסָּר, vốn là một nghĩa vụ tự áp đặt. Chú thích về חלל nên dùng “làm cho lời mình ra phàm” để phản ánh sát hơn trường nghĩa “làm cho ra phàm tục/profane” mà không biến nó thành cách hiểu thần học đặc thù.
  issues:
  - severity: medium
    issue: “khấn nguyện với Yahweh” chưa xác định rõ hành vi lập lời khấn dâng Yahweh.
    rationale: 'לַיהוָה bổ nghĩa cho נֶדֶר: lời khấn được lập/dâng cho Yahweh. “Khấn nguyện với” trong tiếng Việt có thể được hiểu là cầu nguyện hoặc nói chuyện với Ngài.'
  - severity: medium
    issue: “phải làm mọi điều đã ra khỏi miệng mình” là lối kết hợp không tự nhiên trong tiếng Việt.
    rationale: Cụm Hê-bơ-rơ nghĩa là phải thực hiện mọi điều đã nói ra. Bản sửa vẫn giữ ý lời nói phát ra từ miệng, nhưng dùng động từ thích hợp với nội dung lời hứa.
  - severity: low
    issue: “nuốt lời” hơi khẩu ngữ trong bối cảnh quy định pháp lý trang trọng.
    rationale: “Không được vi phạm lời mình” tự nhiên, trang trọng, và phản ánh đúng nghĩa thành ngữ của לֹא יַחֵל דְּבָרוֹ.
  - severity: low
    issue: “điều cam kết” có phạm vi rộng hơn nghĩa vụ tự ràng buộc của אִסָּר.
    rationale: “Nghĩa vụ ràng buộc” giữ rõ tính chất pháp lý và tự áp đặt của cụm từ Hê-bơ-rơ.
