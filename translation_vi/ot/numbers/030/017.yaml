base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: vi
  text: Đây là những luật lệ mà Gia-vê đã truyền cho Môi-se giữa chồng và vợ mình, và giữa cha và con gái mình, trong thời tuổi trẻ của cô, ở nhà cha cô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát chữ: “giữa một người nam và vợ mình, và giữa cha với con gái mình, trong thời tuổi trẻ của cô ở nhà cha cô.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: Đó là những quy định
  rationale: Mệnh đề danh từ số nhiều dùng để kết lại các quy định vừa nêu; “quy định” giữ sắc thái pháp lý của חֻקִּים và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: Đức Giê-hô-va đã truyền cho Môi-se
  rationale: צוה diễn tả việc ban truyền mệnh lệnh. Cấu trúc tiếng Việt “truyền cho” thể hiện tự nhiên quan hệ giữa Đấng truyền lệnh và người nhận lệnh.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc, trang trọng trong tiếng Việt để biểu thị trực tiếp Danh Bốn Chữ, thay vì thay bằng một tước hiệu.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: về quan hệ giữa người chồng với vợ mình
  rationale: בֵּין có nghĩa cơ bản là “giữa”; thêm “về quan hệ” giúp câu kết luật tự nhiên mà vẫn giữ cấu trúc tương quan. Trong cặp với אִשְׁתּוֹ, אִישׁ được hiểu theo vai trò hôn nhân là “người chồng”.
- source_word: בֵּין אָב לְבִתּוֹ
  choice: và giữa người cha với con gái mình
  rationale: Giữ cấu trúc song song và các danh từ quan hệ có giới tính rõ ràng của nguyên văn.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: khi cô còn trẻ và sống trong nhà cha
  rationale: 'Diễn đạt tự nhiên hoàn cảnh kép của nguyên văn: cô đang ở thời tuổi trẻ và ở trong nhà cha; “sống” được thêm theo nghĩa hàm ẩn của cụm chỉ nơi cư trú.'
theological_decisions:
- issue: Cách dịch Danh Bốn Chữ יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời. Bản dịch giữ một dạng phiên âm tên riêng quen thuộc trong tiếng Việt, không thay bằng tước hiệu; “Đức” là yếu tố kính ngữ tự nhiên.
- issue: Ý nghĩa pháp lý của בֵּין trong hai cụm quan hệ
  choice: về quan hệ giữa ... với ...
  alternative: giữa ... với ...; liên quan đến ... và ...
  rationale: Cách dịch vừa giữ nghĩa “giữa” vừa cho thấy các quy định chi phối những quan hệ được nêu, nhưng không xác định thêm bản chất thần học của thẩm quyền trong các quan hệ ấy.
- issue: Phạm vi của בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: khi cô còn trẻ và sống trong nhà cha
  alternative: trong thời son trẻ, tại nhà cha mình
  rationale: Giữ cả yếu tố tuổi trẻ lẫn nơi cư trú. Không đồng nhất hoàn toàn “tuổi trẻ” với sự lệ thuộc pháp lý, dù văn cảnh luật pháp liên hệ hai yếu tố này.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại, phù hợp một câu tổng kết pháp luật. Duy trì các quan hệ giới tính cụ thể của nguyên văn và tránh thêm thuật ngữ giáo phái.
