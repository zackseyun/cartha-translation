source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se nói với những người đứng đầu các chi tộc của con cái Israel[a] rằng: “Đây là lời Yahweh đã truyền:[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “các con trai của Israel”; cũng có thể dịch tự nhiên hơn là “dân Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đây là điều Yahweh đã truyền.” Tiếng Hê-bơ-rơ dùng từ có thể mang nghĩa “lời”, “điều” hoặc “việc”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ, ... nói
  rationale: Động từ với waw liên tiếp đẩy câu chuyện tiến tới; “Bấy giờ” diễn đạt tự nhiên trình tự thuật sự mà không biến nó thành một quan hệ thời gian quá cụ thể.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: những người đứng đầu các chi tộc
  rationale: “Người đứng đầu” giữ được hình ảnh của רֹאשׁ nhưng tự nhiên trong tiếng Việt; מַטּוֹת ở đây chỉ các đơn vị bộ tộc của Israel, nên dịch là “chi tộc”.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: của con cái Israel
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “các con trai của Israel”, nhưng trong ngữ cảnh chỉ toàn thể cộng đồng giao ước; “con cái Israel” giữ hình ảnh gia đình và vẫn tự nhiên, bao quát trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: “Rằng” là cách dẫn lời trực tiếp gọn và tự nhiên trong tiếng Việt, tương ứng với động từ nguyên mẫu dùng để giới thiệu lời nói.
- source_word: זֶה הַדָּבָר
  choice: Đây là lời
  rationale: דָּבָר có thể là “lời”, “việc” hoặc “điều”; ở đây nó giới thiệu một mệnh lệnh có thẩm quyền, nên “lời” vừa sát vừa trang trọng.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Thể hoàn thành trình bày mệnh lệnh của Đức Chúa Trời như việc đã được ban và nay được công bố; “đã truyền” tự nhiên hơn “đã ra lệnh” trong công thức này.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. “Yahweh” giữ đây là danh riêng và tránh thay bằng tước hiệu.
- issue: Cụm giao ước mang hình ảnh gia đình בְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai của Israel; dân Israel
  rationale: “Con cái Israel” giữ hình ảnh huyết tộc của nguyên văn, đồng thời trong tiếng Việt có thể chỉ toàn thể dân tộc. “Các con trai” quá dễ bị hiểu là chỉ nam giới hoặc các con ruột của tổ phụ, còn “dân Israel” làm mất hình ảnh gia đình.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng “Môi-se” theo dạng tên quen thuộc trong tiếng Việt, “Israel” theo cách viết quốc tế hiện hành, và giữ “Yahweh” như danh riêng. Dấu hai chấm nằm trong lời dẫn vì câu tiếp theo sẽ trình bày nội dung mệnh lệnh.
