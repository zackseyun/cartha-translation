- from: Miền đất mà Yahweh đã đánh trước mặt cộng đồng Israel là miền đất thích hợp để chăn nuôi[a], và các tôi tớ ngài có nhiều gia súc.
  to: Miền đất mà Yahweh đã đánh chiếm trước mặt cộng đồng Israel là miền đất thích hợp để chăn nuôi[a], và các tôi tớ của ngài có gia súc.
