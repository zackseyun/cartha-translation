  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: vi
  text: Miền đất mà Yahweh đã đánh chiếm trước mặt cộng đồng Israel là miền đất thích hợp để chăn nuôi[a], và các tôi tớ của ngài có gia súc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “miền đất dành cho gia súc.” Từ Hê-bơ-rơ chỉ chung các loài vật nuôi, không chỉ riêng bò.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: Miền đất
  rationale: Chỉ lãnh thổ cụ thể vừa được nhắc đến; “miền đất” tự nhiên trong tiếng Việt và giữ sắc thái địa lý.
- source_word: הִכָּה
  choice: đã đánh
  rationale: Giữ động từ נכה ở mức khái quát, có thể bao hàm việc Yahweh đánh bại cư dân và chiếm lấy vùng đất, nhưng không thu hẹp nghĩa thành “đánh bại”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Diễn đạt tự nhiên ý hành động diễn ra trước sự hiện diện/chứng kiến của cộng đồng Israel.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: cộng đồng Israel
  rationale: עֵדָה chỉ toàn thể cộng đồng dân Israel; “cộng đồng” hiện đại, rõ nghĩa và không tạo sắc thái riêng của một hệ phái.
- source_word: אֶרֶץ מִקְנֶה
  choice: miền đất thích hợp để chăn nuôi
  rationale: Diễn đạt quan hệ hàm ý công dụng hoặc sự thích hợp của đất đối với gia súc, tự nhiên hơn cách dịch sát chữ “đất của gia súc”.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: và các tôi tớ ngài có nhiều gia súc
  rationale: Chuyển cấu trúc sở hữu với לְ sang cách nói tiếng Việt tự nhiên; “gia súc” bao quát các đàn vật nuôi. “Nhiều” làm rõ sắc thái tập hợp/sản nghiệp trong ngữ cảnh, không giới hạn vào bò.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tetragrammaton; giữ danh riêng bảo toàn đặc điểm của nguồn Hê-bơ-rơ mà không thay bằng tước hiệu.
- issue: Chủ thể ngầm chịu hành động הִכָּה
  choice: giữ cách nói “miền đất mà Yahweh đã đánh”
  alternative: “miền đất có dân cư mà Yahweh đã đánh bại”
  rationale: Nguyên văn lấy “đất” làm đối tượng ngữ pháp theo lối hoán dụ. Bản dịch giữ hình ảnh và độ hàm súc ấy, không tự ý thêm cư dân hay xác định riêng hành động quân sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” là cách xưng hô của các chi phái với Môi-se trong ngữ cảnh; “các tôi tớ ngài” giữ lối tự xưng khiêm nhường của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
