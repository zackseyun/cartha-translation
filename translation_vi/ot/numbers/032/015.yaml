source:
  edition: WLC
  text: כִּ֤י תְשׁוּבֻ/ן֙ מֵֽ/אַחֲרָ֔י/ו וְ/יָסַ֣ף ע֔וֹד לְ/הַנִּיח֖/וֹ בַּ/מִּדְבָּ֑ר וְ/שִֽׁחַתֶּ֖ם לְ/כָל הָ/עָ֥ם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: vi
  text: Vì nếu anh em quay lưng, không theo Ngài nữa[a], Ngài sẽ lại để dân ấy trong hoang mạc[b], và anh em sẽ khiến toàn thể dân này bị diệt vong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “quay khỏi phía sau Ngài”, một thành ngữ có nghĩa là không tiếp tục đi theo Ngài.'
    reason: lexical_alternative
  - marker: b
    text: Bản Hê-bơ-rơ dùng hậu tố số ít, theo nghĩa đen là “để người ấy trong hoang mạc”; số ít ở đây rất có thể chỉ Israel hay cả dân như một tập thể. Vì vậy, bản dịch dùng “dân ấy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì nếu
  rationale: Giữ cả quan hệ giải thích với lời cảnh báo trước đó lẫn sắc thái điều kiện trong ngữ cảnh.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: anh em quay lưng, không theo Ngài nữa
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ, theo nghĩa chấm dứt việc đi theo Đức Chúa Trời, chứ không chỉ quay về theo nghĩa không gian.
- source_word: וְיָסַף עוֹד
  choice: Ngài sẽ lại
  rationale: Cụm từ này mang nghĩa thực hiện một việc thêm một lần nữa.
- source_word: לְהַנִּיחוֹ
  choice: để dân ấy
  rationale: Động từ Hiphil mang nghĩa để cho ở lại. Hậu tố số ít giống đực được phản ánh bằng danh ngữ tập thể số ít “dân ấy”, vừa rõ nghĩa trong tiếng Việt vừa bảo tồn hình thái tập thể của nguyên bản.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: “Hoang mạc” là cách diễn đạt tự nhiên, trang trọng cho מִדְבָּר và phù hợp bối cảnh dân Israel lưu lạc.
- source_word: וְשִׁחַתֶּם
  choice: anh em sẽ khiến ... bị diệt vong
  rationale: Giữ sắc thái gây nên sự hủy diệt của dạng động từ trong ngữ cảnh phán xét, thay vì chỉ mô tả một thiệt hại nhẹ.
- source_word: לְכָל הָעָם הַזֶּה
  choice: toàn thể dân này
  rationale: Giữ danh từ tập thể số ít của nguyên bản bằng lối nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của hậu tố số ít trong לְהַנִּיחוֹ
  choice: Dùng “dân ấy” như một danh ngữ tập thể số ít chỉ Israel/dân chúng.
  alternative: Dùng đại từ số nhiều “họ”, hoặc đại từ số ít “người ấy”.
  rationale: Nguyên bản có hậu tố số ít, nhưng mạch văn cho thấy đối tượng là dân Israel xét như một tập thể. “Dân ấy” bảo tồn tính số ít tập thể mà không tạo ấn tượng sai rằng câu nói về một cá nhân.
- issue: Mức độ mạnh của וְשִׁחַתֶּם
  choice: “khiến ... bị diệt vong”
  alternative: “gây tai họa cho” hoặc “hủy diệt”
  rationale: Cách dịch này giữ lực mạnh và sắc thái nguyên nhân của động từ, đồng thời không quyết định quá mức rằng chính các chi phái trực tiếp thi hành sự hủy diệt thay vì khiến dân chịu sự phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” thể hiện đối tượng số nhiều; “Ngài” chỉ Đức Chúa Trời. Cấu trúc nhân quả và lời cảnh báo nghiêm trọng của câu được giữ rõ.
