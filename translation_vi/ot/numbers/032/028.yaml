translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu giữ “về họ” ở vị trí đầu để phản ánh trật tự Hê-bơ-rơ và bảo tồn sự mơ hồ của לָהֶם; chú thích [a] nêu cách phân tích cú pháp khác. Các danh xưng hành chính được diễn đạt gọn bằng “trưởng tộc” và được giải thích sát nguyên văn ở chú thích [b].
