base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: vi
  text: Vậy, về họ, Môi-se truyền lệnh cho thầy tế lễ Ê-lê-a-sa[a], Giô-suê, con của Nun, và các trưởng tộc của những chi phái thuộc con dân Y-sơ-ra-ên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Môi-se truyền lệnh cho họ, tức là cho thầy tế lễ Ê-lê-a-sa…”; theo cách hiểu này, “họ” chỉ những người lãnh đạo được nêu trong câu, chứ không phải các chi phái đã nói đến trước đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Có thể dịch sát: “những người đứng đầu các nhà cha của các chi phái của con cái Y-sơ-ra-ên”, một cách gọi hành chính dành cho các lãnh đạo gia tộc và chi phái của Y-sơ-ra-ên.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Động từ צוה diễn tả một mệnh lệnh có thẩm quyền. “Truyền lệnh” tự nhiên, trang trọng và phù hợp với bối cảnh hành chính.
- source_word: לָהֶם
  choice: về họ
  rationale: Đại từ nhiều khả năng chỉ người Ru-bên và người Gát trong văn cảnh trước đó; đặt “về họ” gần đầu câu giữ được vị trí nổi bật của cụm từ trong tiếng Hê-bơ-rơ mà vẫn rõ nghĩa trong tiếng Việt. Tuy vậy, cấu trúc cũng có thể được hiểu là “cho họ”, tức các lãnh đạo được nêu sau đó.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: cho thầy tế lễ Ê-lê-a-sa
  rationale: Dấu chỉ tân ngữ אֵת giới thiệu người nhận lệnh sau động từ צוה; tiếng Việt dùng “truyền lệnh cho” để diễn đạt tự nhiên.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Giô-suê con trai Nun
  rationale: Giữ tên riêng theo lối phiên âm Kinh Thánh quen thuộc trong tiếng Việt; “con trai Nun” diễn đạt trực tiếp phụ danh Hê-bơ-rơ.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: các trưởng tộc của những chi phái
  rationale: Cụm hành chính cô đọng chỉ những người đứng đầu các đơn vị gia tộc trong cơ cấu chi phái. “Các trưởng tộc” rõ ràng hơn lối dịch từng chữ “các đầu của nhà cha” nhưng vẫn giữ cấp độ gia tộc và chi phái.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: thuộc con dân Y-sơ-ra-ên
  rationale: בני ישראל là thành ngữ chỉ cộng đồng dân Y-sơ-ra-ên. “Con dân Y-sơ-ra-ên” giữ sắc thái dân tộc-gia phả mà vẫn tự nhiên hơn “các con trai Y-sơ-ra-ên” trong tiếng Việt hiện đại.
