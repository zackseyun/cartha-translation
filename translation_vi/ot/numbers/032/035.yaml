  yaml_path: translation/ot/numbers/032/035.yaml
  text: and Atroth-shophan[a], and Jazer, and Jogbehah.
translation:
  language: vi
  text: và Át-rốt Sô-phan[a], và Gia-ê-xe, và Giốc-bê-ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể phiên âm là “A-ta-rốt Sô-phan.” Đây là một địa danh ghép trong tiếng Hê-bơ-rơ; cách phiên âm có thể khác nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: cùng / và
  rationale: Liên từ וְ nối các địa danh trong danh sách; tiểu từ אֶת đánh dấu bổ ngữ trực tiếp nên không cần dịch riêng trong tiếng Việt. Dùng “cùng” ở đầu câu rồi “và” trước địa danh cuối để câu liệt kê tự nhiên.
- source_word: עַטְרֹת שׁוֹפָן
  choice: Át-rốt Sô-phan
  rationale: Đây là địa danh ghép, được phiên âm thay vì dịch nghĩa. Cách viết có dấu và gạch nối giúp độc giả Việt đọc gần với hình thức Hê-bơ-rơ.
- source_word: יַעְזֵר
  choice: Gia-ê-xe
  rationale: Địa danh được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt, đồng thời phản ánh tương đối các âm tiết của tên Hê-bơ-rơ.
- source_word: יָגְבֳּהָה
  choice: Giốc-bê-ha
  rationale: Địa danh được phiên âm sang tiếng Việt; hình thức này giữ được nhận diện của tên riêng và dễ đọc đối với độc giả hiện đại.
