id: NUM.32.14
reference: Numbers 32:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: vi
  text: Kìa, các ngươi đã đứng lên thay chỗ cha ông mình—một thế hệ người tội lỗi[a]—để làm tăng thêm nữa cơn giận bừng cháy của Yahweh chống lại Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự gia tăng những người tội lỗi” hoặc “dòng dõi của những người tội lỗi.” Từ Hê-bơ-rơ תַּרְבּוּת có thể chỉ sự gia tăng hoặc con cháu/hậu duệ; “một thế hệ” diễn đạt ý lớp người tiếp nối trong giọng quở trách ở đây.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát chữ: “trên sự bừng cháy của mũi Yahweh”; đây là một thành ngữ Hê-bơ-rơ chỉ cơn giận dữ dội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ sức nhấn mạnh của lời chỉ trỏ/cảnh báo trong lời quở trách của Môi-se, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: các ngươi đã đứng lên thay chỗ cha ông mình
  rationale: Diễn đạt hình ảnh ‘đứng lên’ và ý kế tục, thay thế thế hệ cha ông; ‘các ngươi’ phù hợp với giọng quở trách trực tiếp.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: một lứa người tội lỗi
  rationale: ‘Lứa’ truyền đạt ý một thế hệ hay lớp người phát sinh tiếp nối, mang sắc thái chê trách nhưng không ép danh từ תַּרְבּוּת vào duy nhất nghĩa ‘dòng dõi’.
- source_word: לִסְפּוֹת עוֹד
  choice: để càng làm tăng thêm
  rationale: Thể hiện cả ý thêm vào và sự gia tăng tiếp diễn, tức thế hệ này làm cho cơn giận vốn có càng lớn hơn.
- source_word: חֲרוֹן אַף
  choice: cơn giận bừng cháy
  rationale: Giữ lại hình ảnh sức nóng của thành ngữ Hê-bơ-rơ chỉ cơn giận dữ dội, nhưng diễn đạt tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay bằng một tước hiệu.
- source_word: אֶל יִשְׂרָאֵל
  choice: đối với Israel
  rationale: Trong ngữ cảnh cơn giận, אֶל chỉ đối tượng mà cơn giận hướng đến.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; giữ ‘Yahweh’ giúp phân biệt danh này với một tước hiệu.
- issue: Phạm vi chỉ người của אֲנָשִׁים חַטָּאִים
  choice: người tội lỗi
  alternative: những kẻ có tội / những người nam tội lỗi
  rationale: ‘Người’ trong tiếng Việt có thể chỉ nhóm người đang được Môi-se trực tiếp quở trách mà không thêm một nét nghĩa giới tính không cần thiết; tính chất kết án đạo đức của חַטָּאִים vẫn được giữ nguyên.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu. ‘Kìa’ cùng đại từ ‘các ngươi’ duy trì sức nặng của lời quở trách; dấu gạch ngang làm rõ cụm đồng vị mà không giảm sự gay gắt. Tất cả dấu chú thích đều xuất hiện trong chính văn.
