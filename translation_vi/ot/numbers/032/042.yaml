  register: Văn phong kể chuyện trang trọng, gọn và dễ hiểu trong tiếng Việt hiện đại. Dùng “rồi” để thể hiện chuỗi hành động của các động từ nối tiếp trong nguyên văn; tên riêng được phiên âm nhất quán.
