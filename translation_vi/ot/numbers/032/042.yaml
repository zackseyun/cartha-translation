base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: vi
  text: Nô-bách đi chiếm Kê-nát cùng các làng phụ thuộc của nó[a], rồi đặt tên cho thành ấy là Nô-bách, theo tên mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con gái của nó”, một thành ngữ chỉ những làng hoặc khu định cư nhỏ lệ thuộc vào Kê-nát.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: Nô-bách
  rationale: Tên riêng của người; phiên âm sang tiếng Việt và giữ nguyên sự lặp lại khi tên này được đặt cho thành.
- source_word: הָלַךְ
  choice: đi
  rationale: Động từ chỉ chuyển động đơn giản trong mạch kể chuyện; “đi” tự nhiên và không thêm ý ngoài nguyên văn.
- source_word: וַיִּלְכֹּד
  choice: chiếm
  rationale: Trong bối cảnh quân sự, לכד có nghĩa là chiếm hoặc đoạt lấy một địa điểm; “chiếm” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: קְנָת
  choice: Kê-nát
  rationale: Địa danh được phiên âm theo cách đọc gần với tiếng Hê-bơ-rơ.
- source_word: בְּנֹתֶיהָ
  choice: các làng phụ thuộc
  rationale: Nghĩa đen là “các con gái của nó”, một thành ngữ chỉ những khu định cư nhỏ lệ thuộc vào thành chính; cách dịch này truyền đạt rõ quan hệ phụ thuộc.
- source_word: וַיִּקְרָא לָהּ
  choice: đặt tên thành ấy là
  rationale: Cấu trúc קרא + ל trong ngữ cảnh này diễn tả hành động đặt tên; thêm “thành ấy” giúp đại từ giống cái trong tiếng Hê-bơ-rơ có quy chiếu rõ ràng bằng tiếng Việt.
- source_word: בִּשְׁמוֹ
  choice: theo tên mình
  rationale: Cụm từ cho biết địa danh mới được đặt theo tên của Nô-bách; “mình” quy chiếu tự nhiên về chủ thể trong tiếng Việt.
