  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּשָּׁבַ֖ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: vi
  text: 'Hôm đó, cơn giận của Yahweh[a] bừng cháy, và Ngài thề rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; cũng được chuyển tự là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: cơn giận ... bừng cháy
  rationale: Cụm חרה אף là thành ngữ chỉ cơn giận nổi nóng hoặc bốc cháy. Cách dịch này giữ hình ảnh của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בַּיּוֹם הַהוּא
  choice: Trong ngày ấy
  rationale: Diễn đạt tự nhiên cụm chỉ thời gian trong mạch kể chuyện và không thêm sắc thái tiên tri.
- source_word: וַיִּשָּׁבַע
  choice: Ngài thề
  rationale: Dạng Niphal của שבע chỉ việc thề hoặc lập lời thề; “thề” ngắn gọn và trực tiếp.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Từ này dẫn vào nội dung lời thề ở câu kế tiếp; dấu hai chấm cùng “rằng” thể hiện chức năng ấy tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Danh Tứ Tự. Giữ “Yahweh” bảo tồn tính chất danh riêng, không biến nó thành tước hiệu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “Ngài” dùng để tránh lặp danh riêng trong cùng mệnh đề; “bừng cháy” giữ ẩn dụ Hê-bơ-rơ về cơn giận. Dấu hai chấm báo trước nội dung lời thề tiếp nối ở câu sau.
