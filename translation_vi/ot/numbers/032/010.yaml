    rationale: Tiếng Việt hiện đại thường dùng “Hôm đó” hoặc “Vào ngày ấy” cho thời điểm quá khứ xác định; “Hôm đó” phù hợp nhất với câu chuyện này.
  - severity: medium
    issue: Chú thích về Yahweh tự mâu thuẫn.
    rationale: Bản văn đã chuyển tự יהוה là “Yahweh,” nên không nên liệt kê “Yahweh” như một cách chuyển tự thay thế. Cần sửa để chú thích phản ánh đúng dạng YHWH và phương án “Giê-hô-va.”
