  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: vi
  text: Môi-se trao Ga-la-át cho Ma-ki, con trai Ma-na-se, và ông định cư tại đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: trao
  rationale: Trong bối cảnh phân chia đất, נתן có nghĩa đơn giản là trao hoặc ban. “Trao” tự nhiên trong tiếng Việt và không thêm sắc thái hành chính như “phân cấp” hay “chỉ định”.
- source_word: הַגִּלְעָד
  choice: Ga-la-át
  rationale: Đây là địa danh Gilead; tiếng Việt không cần thể hiện mạo từ xác định của tiếng Hê-bơ-rơ.
- source_word: לְמָכִיר
  choice: cho Ma-ki
  rationale: Giới từ לְ đánh dấu người nhận; “cho Ma-ki” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: בֶּן מְנַשֶּׁה
  choice: con trai Ma-na-se
  rationale: בֶּן theo nghĩa trực tiếp là “con trai”. Câu này không buộc phải mở rộng thành “hậu duệ”, dù trong văn cảnh rộng hơn tên Ma-ki cũng có thể chỉ một thị tộc.
- source_word: וַיֵּשֶׁב
  choice: định cư
  rationale: ישׁב có thể mang nghĩa ngồi, cư trú hoặc định cư. Trong bối cảnh nhận đất và chiếm lĩnh khu vực, “định cư” diễn đạt tự nhiên việc thiết lập nơi ở.
- source_word: בָּהּ
  choice: tại đó
  rationale: Hậu tố giống cái số ít chỉ về Ga-la-át như một vùng đất. “Tại đó” tự nhiên hơn “trong đó” trong tiếng Việt mà vẫn giữ rõ ý chỉ nơi chốn.
