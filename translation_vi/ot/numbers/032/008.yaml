  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: vi
  text: Cha ông các ngươi đã làm như thế khi ta sai họ từ Ca-đe Ba-nê-a đi xem đất ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đi khảo sát” hoặc “đi do thám đất ấy.” Động từ Hê-bơ-rơ có nghĩa đen là “xem,” nhưng trong ngữ cảnh này chỉ việc thăm dò vùng đất.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה עָשׂוּ
  choice: cũng đã làm như vậy
  rationale: Diễn tả cách tự nhiên sự đối chiếu giữa hành động hiện tại của người nghe và tiền lệ của thế hệ trước; từ “cũng” làm rõ ý so sánh vốn có trong ngữ cảnh.
- source_word: אֲבֹתֵיכֶם
  choice: tổ phụ các ngươi
  rationale: Giữ sắc thái chỉ thế hệ cha ông trước đó, đồng thời dùng cách nói trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: בְּשָׁלְחִי
  choice: khi ta sai
  rationale: Giới từ בְּ với động từ nguyên mẫu và hậu tố ngôi thứ nhất mang nghĩa thời gian ở đây; “khi ta sai” là cách diễn đạt trực tiếp, tự nhiên.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ tân ngữ chỉ các tổ phụ, tức thế hệ trước.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: từ Ca-đe Ba-nê-a
  rationale: Phiên âm địa danh theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: לִרְאוֹת
  choice: đi xem
  rationale: Giữ nghĩa căn bản của ראה là “xem/thấy”; thêm “đi” để diễn đạt tự nhiên mục đích của việc được sai đi, nhưng không thu hẹp nghĩa thành “do thám” trong chính văn.
- source_word: אֶת הָאָרֶץ
  choice: xứ ấy
  rationale: “Xứ” phù hợp với vùng đất được nhắc đến trong bối cảnh; “ấy” diễn đạt tính xác định của danh từ tiếng Hê-bơ-rơ mà không thêm thuật ngữ thần học.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta/các ngươi” để phản ánh lời Môi-se trực tiếp quở trách cả nhóm; giữ động từ “xem” trong chính văn nhằm bảo toàn độ rộng nghĩa của nguyên ngữ.
