  terminology: Danh riêng “Yahweh” phản ánh trực tiếp יהוה và nhất quán với định hướng dự án. Chú thích a nêu được các khả năng từ vựng chính mà không áp đặt một diễn giải giáo phái. Chú thích b phân biệt đúng nghĩa đen “trước mặt Yahweh” với hàm ý ngữ cảnh về sự hiện diện và thẩm quyền của Ngài.
