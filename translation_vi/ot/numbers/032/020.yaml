source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ מֹשֶׁ֔ה אִֽם תַּעֲשׂ֖וּ/ן אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה אִם תֵּחָֽלְצ֛וּ לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: vi
  text: 'Môi-se nói với họ: “Nếu anh em làm điều này, nếu anh em trang bị vũ khí[a] trước mặt Yahweh[b] để ra trận,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được trang bị”, “ra đi như những người có vũ trang”, hoặc “tập hợp sẵn sàng”. Động từ Hê-bơ-rơ mang nghĩa quân sự là được vũ trang hoặc chuẩn bị cho chiến trận.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trước mặt Yahweh”, cho thấy hành động quân sự của họ diễn ra trong sự hiện diện của Yahweh và dưới thẩm quyền của Ngài.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: Môi-se nói với họ
  rationale: Diễn đạt tự nhiên chuỗi tự sự của thể wayyiqtol; tiếng Việt không cần thêm liên từ “và” ở đầu câu.
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: Nếu anh em làm điều này
  rationale: דָּבָר ở đây chỉ đề nghị hoặc cam kết vừa nêu; “điều này” vừa tự nhiên vừa giữ phạm vi nghĩa rộng.
- source_word: אִם תֵּחָלְצוּ
  choice: nếu anh em trang bị vũ khí
  rationale: Nifal của חלץ trong văn cảnh quân sự chỉ việc được trang bị hoặc chuẩn bị như những người có vũ trang; cách dịch này làm rõ nghĩa quân sự mà không thêm ý ngoài văn bản.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ hình ảnh “trước mặt/trong sự hiện diện của” và phiên âm trực tiếp danh riêng giao ước יהוה.
- source_word: לַמִּלְחָמָה
  choice: để ra trận
  rationale: Trong tiếng Việt hiện đại, “để ra trận” diễn đạt tự nhiên mục đích quân sự của cụm này hơn lối dịch sát chữ “cho cuộc chiến”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Văn bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của לִפְנֵי יְהוָה trong hành động quân sự
  choice: trước mặt Yahweh
  alternative: dưới quyền Yahweh
  rationale: Giữ nguyên cách nói về sự hiện diện của Yahweh và không thu hẹp ý nghĩa thành riêng thẩm quyền, dù thẩm quyền có thể được hàm ý trong văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Môi-se nói với các đại diện bộ tộc; giữ câu mở vì mệnh đề điều kiện tiếp tục sang câu kế tiếp.
