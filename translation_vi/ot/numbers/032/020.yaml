  source_fidelity: 'Bản dịch giữ đúng cấu trúc điều kiện kép của tiếng Hê-bơ-rơ và ý nghĩa quân sự của תֵּחָלְצוּ: họ phải tự trang bị/ra đi với tư cách người có vũ trang. “Trước mặt Yahweh” phản ánh sát לִפְנֵי יְהוָה, và “để ra trận” diễn đạt tự nhiên לַמִּלְחָמָה trong tiếng Việt. Câu được để mở bằng dấu phẩy, phù hợp vì điều kiện và hệ quả còn tiếp sang câu sau.'
