  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính: cơn giận của Yahweh, tác động khiến Israel phải lang thang trong hoang mạc bốn mươi năm, và sự chấm dứt của thế hệ làm điều ác. Tuy nhiên, “Vì thế” thêm quan hệ hệ quả không được biểu thị rõ bởi liên từ waw trong câu này. “Đối với Israel” làm yếu hướng đối nghịch của cơn giận; “chống lại Israel” phản ánh sát hơn ngữ cảnh. Thành ngữ בְּעֵינֵי יְהוָה nên là “trong mắt Yahweh” để giữ phép ẩn dụ đánh giá của nguyên ngữ.'
