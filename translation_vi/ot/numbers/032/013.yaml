revisions:
- from: Vì thế, cơn giận của Yahweh bừng cháy đối với Israel[a], và Ngài khiến họ phiêu bạt trong hoang mạc suốt bốn mươi năm[b], cho đến khi cả thế hệ đã làm điều ác trước mắt Yahweh đều không còn nữa.
  to: Cơn giận của Yahweh bừng cháy chống lại Israel[a], và Ngài khiến họ lang thang trong hoang mạc bốn mươi năm[b], cho đến khi toàn thể thế hệ đã làm điều ác trong mắt Yahweh không còn nữa.
