source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: vi
  text: Cơn giận của Yahweh bừng cháy chống lại Israel[a], và Ngài khiến họ lang thang trong hoang mạc bốn mươi năm[b], cho đến khi toàn thể thế hệ đã làm điều ác trong mắt Yahweh không còn nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Yahweh nổi giận với Israel.” Thành ngữ Hê-bơ-rơ theo nghĩa đen nói rằng “mũi/cơn giận của Yahweh bừng cháy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ngài khiến họ đi lang thang trong hoang mạc bốn mươi năm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: cơn giận của Yahweh bừng cháy
  rationale: Giữ hình ảnh 'cơn giận bừng cháy' của thành ngữ Hê-bơ-rơ, đồng thời diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּיִשְׂרָאֵל
  choice: đối với Israel
  rationale: Trong ngữ cảnh tức giận, giới từ בְ chỉ đối tượng mà cơn giận hướng đến; 'đối với' tự nhiên hơn 'chống lại' trong câu này.
- source_word: וַיְנִעֵם
  choice: Ngài khiến họ phiêu bạt
  rationale: Giữ thể khiến khiến của động từ và ý họ phải đi đây đó không ổn định; 'phiêu bạt' phù hợp văn cảnh hành trình trong hoang mạc.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: '''Hoang mạc'' bao quát vùng đất hoang vắng trong bối cảnh Xuất Hành, không nhất thiết chỉ là sa mạc cát.'
- source_word: אַרְבָּעִים שָׁנָה
  choice: suốt bốn mươi năm
  rationale: '''Suốt'' làm rõ khoảng thời gian kéo dài mà không thêm ý ngoài nguyên văn.'
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: cho đến khi cả thế hệ ... đều không còn nữa
  rationale: Diễn đạt tự nhiên ý thế hệ ấy đi đến chỗ chấm dứt, tức không còn người nào thuộc thế hệ bị xét đoán.
- source_word: הָעֹשֶׂה הָרַע
  choice: đã làm điều ác
  rationale: Chuyển phân từ số ít bổ nghĩa cho danh từ tập thể thành mệnh đề quan hệ tự nhiên trong tiếng Việt.
- source_word: בְּעֵינֵי יְהוָה
  choice: trước mắt Yahweh
  rationale: Giữ hình ảnh đánh giá của thành ngữ Hê-bơ-rơ và vẫn rõ nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; giữ danh riêng tránh thay bằng tước hiệu và không áp đặt truyền thống hệ phái.
- issue: Hình ảnh về cơn thịnh nộ của Đức Chúa Trời
  choice: cơn giận của Yahweh bừng cháy
  alternative: Yahweh nổi giận
  rationale: Giữ hình ảnh 'cháy' của nguyên văn thay vì làm nhẹ thành một lời mô tả khái quát.
- issue: Tác nhân của sự phiêu bạt
  choice: Ngài khiến họ phiêu bạt
  alternative: họ phiêu bạt
  rationale: Dạng Hiphil của động từ nêu Yahweh là Đấng khiến việc ấy xảy ra; bản dịch giữ rõ tác nhân mà không giải thích thêm nguyên nhân thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để nối lại chủ thể Yahweh; “phiêu bạt” truyền đạt ý bị khiến phải đi đây đó trong hoang mạc. Các dấu chú thích [a], [b] đều xuất hiện ngay trong chính văn.
