  yaml_path: translation/ot/numbers/032/002.yaml
  text: Then the sons of Gad and the sons of Reuben came and spoke to Moses, to Eleazar the priest, and to the leaders of the congregation, saying,
translation:
  language: vi
  text: 'Bấy giờ, con cháu Gát và con cháu Ru-bên đến thưa với Môi-se, thầy tế lễ Ê-lê-a-sa và các thủ lĩnh của cộng đồng rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: con cháu Gát và con cháu Ru-bên
  rationale: Trong văn cảnh bộ tộc, בְנֵי chỉ các hậu duệ hay thành viên của hai chi tộc, không chỉ những người con trực hệ.
- source_word: וַיֹּאמְרוּ אֶל
  choice: thưa với
  rationale: Diễn đạt tự nhiên hành vi nói với các vị lãnh đạo, đồng thời phù hợp sắc thái kính trọng trong tiếng Việt.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: các thủ lĩnh của cộng đồng
  rationale: נְשִׂיאִים là những người đứng đầu, còn עֵדָה ở đây là cộng đồng hội chúng Israel; cách dịch tránh từ ngữ quá chuyên biệt.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức dẫn lời trực tiếp được chuyển tự nhiên sang tiếng Việt bằng dấu hai chấm.
