base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: vi
  text: 'Họ đến gần ông và nói: “Chúng tôi sẽ xây chuồng chiên tại đây cho đàn gia súc của mình, và xây các thành cho con trẻ của mình[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con cái” hoặc “những người phụ thuộc.” Từ Hê-bơ-rơ טַף thường chỉ trẻ nhỏ hoặc những người phụ thuộc, đặc biệt nhấn mạnh các thành viên dễ bị tổn thương trong cộng đồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: Họ đến gần ông
  rationale: Động từ נגשׁ diễn tả việc tiến đến gần một người; cách dịch này tự nhiên trong tiếng Việt và giữ được chuyển động hướng về Môi-se.
- source_word: וַיֹּאמְרוּ
  choice: và nói
  rationale: Giữ lối nối tiếp của câu kể tiếng Hê-bơ-rơ và dẫn vào lời nói trực tiếp một cách tự nhiên.
- source_word: גִּדְרֹת צֹאן
  choice: chuồng chiên
  rationale: Cụm từ chỉ những khu có rào bao quanh để giữ đàn chiên; “chuồng chiên” ngắn gọn, rõ nghĩa và phù hợp bối cảnh chăn nuôi.
- source_word: נִבְנֶה
  choice: chúng tôi sẽ xây
  rationale: Dạng vị hoàn thành ngôi thứ nhất số nhiều ở đây diễn tả ý định hoặc đề nghị; “sẽ xây” truyền đạt rõ kế hoạch họ nêu ra.
- source_word: לְמִקְנֵנוּ
  choice: cho đàn gia súc của mình
  rationale: מִקְנֶה chỉ chung vật nuôi thuộc sở hữu, không chỉ riêng bò; “đàn gia súc” giữ được nghĩa rộng ấy. Đại từ “mình” tránh lặp nặng mà vẫn quy chiếu rõ đến người nói.
- source_word: פֹּה
  choice: tại đây
  rationale: Tương đương tự nhiên và trang trọng vừa phải của trạng từ chỉ nơi chốn.
- source_word: וְעָרִים
  choice: và xây các thành
  rationale: עָרִים là số nhiều của “thành”; lặp lại “xây” trong tiếng Việt làm rõ rằng cả chuồng chiên lẫn các thành đều là đối tượng của cùng dự định.
- source_word: לְטַפֵּנוּ
  choice: cho con trẻ của mình
  rationale: טַף thường chỉ trẻ nhỏ hoặc những người phụ thuộc, nhấn mạnh các thành viên dễ bị tổn thương trong cộng đồng. “Con trẻ” giữ sắc thái gia đình và tuổi nhỏ mà không thu hẹp hoàn toàn thành một thuật ngữ pháp lý.
theological_decisions: []
