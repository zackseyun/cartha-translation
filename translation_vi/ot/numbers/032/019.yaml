base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: vi
  text: Vì chúng tôi sẽ không nhận phần cơ nghiệp cùng với họ ở bên kia sông Giô-đanh và xa hơn nữa, bởi phần cơ nghiệp của chúng tôi đã đến với chúng tôi ở phía đông sông Giô-đanh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vì phần cơ nghiệp của chúng tôi đã được phân cho chúng tôi ở phía đông sông Giô-đanh.”'
    reason: Diễn đạt thay thế cho thành ngữ «cơ nghiệp đã đến với chúng tôi», nêu rõ ý phần đất đã được phân.
lexical_decisions:
- source_word: נִנְחַל
  choice: sẽ không nhận phần cơ nghiệp
  rationale: Động từ נחל trong ngữ cảnh phân chia đất nói đến việc nhận phần thừa hưởng được cấp. Cách dịch này tự nhiên hơn “thừa hưởng” khi chủ thể là các chi phái, đồng thời giữ sắc thái cơ nghiệp giao ước.
- source_word: אִתָּם
  choice: cùng với họ
  rationale: Diễn đạt trực tiếp việc cùng tham dự vào phần cơ nghiệp với các chi phái còn lại.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: ở bên kia sông Giô-đanh và xa hơn nữa
  rationale: Giữ cách định hướng theo vị trí người nói và chuyển וָהָלְאָה bằng một cụm từ tự nhiên, không lược bỏ ý tiếp tục đi xa về phía ấy.
- source_word: בָאָה נַחֲלָתֵנוּ אֵלֵינוּ
  choice: phần cơ nghiệp của chúng tôi đã thuộc về chúng tôi
  rationale: Nguyên văn dùng động từ “đến”, nhưng trong ngữ cảnh nhận đất làm cơ nghiệp, “đã thuộc về chúng tôi” truyền đạt tự nhiên kết quả đã được xác lập mà không quy định cụ thể cơ chế phân chia.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: ở phía đông sông Giô-đanh
  rationale: מִזְרָחָה xác định rõ hướng đông; cách diễn đạt này tránh sự mơ hồ của “bên kia sông” trong tiếng Việt và phù hợp với vị trí của các chi phái đang nói.
