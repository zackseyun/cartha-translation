  to: Vì chúng tôi sẽ không nhận phần cơ nghiệp cùng với họ ở bên kia sông Giô-đanh và xa hơn nữa, bởi phần cơ nghiệp của chúng tôi đã đến với chúng tôi ở phía đông sông Giô-đanh.[a]
  rationale: Bản sửa giữ nguyên cấu trúc, ý đối lập địa lý và thuật ngữ «cơ nghiệp», nhưng phục hồi động từ «đã đến với chúng tôi» của nguyên văn. Chú thích được thay bằng một phương án tiếng Việt rõ ràng, phản ánh hợp lý sắc thái phân chia cơ nghiệp mà không áp đặt cơ chế hay cách giải thích giáo phái.
