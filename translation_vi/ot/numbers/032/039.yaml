source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן מְנַשֶּׁ֛ה גִּלְעָ֖דָ/ה וַֽ/יִּלְכְּדֻ֑/הָ וַ/יּ֖וֹרֶשׁ אֶת הָ/אֱמֹרִ֥י אֲשֶׁר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: vi
  text: Các con trai của Ma-ki, con trai Ma-na-se, đi đến Ga-la-át và chiếm lấy vùng ấy; rồi ông[a] đuổi người A-mô-rít[b] đang ở đó đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ chuyển sang động từ số ít: “ông đuổi”, sau các động từ số nhiều ở đầu câu. “Ông” có thể chỉ Ma-ki, hoặc dòng Ma-ki được xem như một tập thể; đây cũng có thể là một chuyển đổi về văn phong hay văn bản. Một số bản dịch làm trơn thành “họ đuổi”.'
    reason: textual_variant
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng danh xưng dân tộc ở số ít, “người A-mô-rít”, theo nghĩa tập thể để chỉ các cư dân A-mô-rít.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: đi
  rationale: Động từ הלך ở đây là động từ trần thuật thông thường, không nhất thiết hàm ý đi lên hay hành quân.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Các con trai của Ma-ki, con trai Ma-na-se
  rationale: Giữ cách diễn đạt quan hệ huyết thống của tiếng Hê-bơ-rơ; trong ngữ cảnh, cụm này cũng có thể chỉ hậu duệ hay dòng tộc.
- source_word: גִּלְעָדָה
  choice: đến Ga-la-át
  rationale: Hậu tố chỉ hướng diễn tả chuyển động về phía địa danh; tiếng Việt tự nhiên là “đến Ga-la-át”.
- source_word: וַיִּלְכְּדֻהָ
  choice: chiếm lấy vùng ấy
  rationale: לכד thường chỉ việc chiếm được một nơi; “vùng ấy” làm rõ đại từ giống cái đang quy chiếu về Ga-la-át.
- source_word: וַיּוֹרֶשׁ
  choice: rồi ông đuổi ... đi
  rationale: Bản Ma-xô-ra dùng động từ ngôi thứ ba số ít, chuyển đột ngột từ chủ ngữ số nhiều. “Đuổi ... đi” diễn đạt nghĩa Hiphil của ירש một cách tự nhiên, còn “ông” bảo tồn sự chuyển đổi số của nguyên văn.
- source_word: הָאֱמֹרִי
  choice: người A-mô-rít
  rationale: Danh xưng dân tộc ở dạng số ít được dùng theo nghĩa tập thể; tiếng Việt có thể giữ dạng “người A-mô-rít” mà vẫn chỉ toàn thể cư dân.
- source_word: אֲשֶׁר בָּהּ
  choice: đang ở đó
  rationale: Diễn đạt tự nhiên mệnh đề quan hệ chỉ những cư dân ở trong vùng Ga-la-át.
theological_decisions:
- issue: Chủ thể số ít của וַיּוֹרֶשׁ sau các động từ số nhiều
  choice: Bảo tồn bằng “ông” và chú thích sự bất định về đối tượng quy chiếu
  alternative: Làm trơn thành “họ đuổi”
  rationale: Nguyên văn Ma-xô-ra thực sự chuyển sang động từ số ít. Không nên âm thầm giải quyết đây là Ma-ki, dòng Ma-ki như một tập thể, hay một chuyển đổi văn phong/văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ lối gọi gia phả sát nguyên văn; dùng “chiếm lấy vùng ấy” để tránh đại từ mơ hồ; bảo tồn sự chuyển từ số nhiều sang số ít bằng chú thích thay vì âm thầm làm trơn.
