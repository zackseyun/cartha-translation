  text: וַ/יֹּ֤אמֶר בְּנֵי גָד֙ וּ/בְנֵ֣י רְאוּבֵ֔ן אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר עֲבָדֶ֣י/ךָ יַעֲשׂ֔וּ כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י מְצַוֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: vi
  text: 'Bấy giờ, con cháu Gát và con cháu Ru-bên thưa với Môi-se rằng: “Các tôi tớ của ngài sẽ làm đúng như ngài truyền.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: con cháu Gát và con cháu Ru-bên
  rationale: Trong ngữ cảnh bộ tộc, בְּנֵי chỉ các hậu duệ hay thành viên của hai chi phái, nên “con cháu” tự nhiên và chính xác hơn “các con trai”.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: thưa ... rằng
  rationale: Công thức Hê-bơ-rơ mở lời được chuyển sang lối kể tự nhiên trong tiếng Việt; động từ “thưa” thể hiện lời nói kính trọng với Môi-se mà không thêm nội dung.
- source_word: עֲבָדֶיךָ
  choice: các tôi tớ của ngài
  rationale: Giữ nguyên cách tự xưng khiêm nhường ở số nhiều và tương quan kính trọng trong nguyên văn.
- source_word: כַּאֲשֶׁר אֲדֹנִי מְצַוֶּה
  choice: đúng như ngài truyền
  rationale: כַּאֲשֶׁר diễn tả sự làm theo đúng điều đã truyền; אֲדֹנִי ở đây là cách gọi kính trọng dành cho Môi-se, không phải danh xưng Thiên Chúa.
theological_decisions:
- issue: Ý nghĩa của אֲדֹנִי
  choice: ngài
  alternative: chúa tôi
  rationale: Đối tượng được nói với là Môi-se. Dùng “ngài” giữ sắc thái kính trọng trong tiếng Việt hiện đại và tránh khiến độc giả hiểu lầm đây là danh xưng chỉ Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách tự xưng “các tôi tớ của ngài”; lược việc dịch tách biệt động từ nguyên mẫu לֵאמֹר vì “thưa ... rằng” đã chuyển tải đầy đủ công thức dẫn lời.
