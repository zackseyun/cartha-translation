source:
  edition: WLC
  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: vi
  text: Chắc chắn chẳng một ai trong số những người đàn ông đã đi lên từ Ai Cập, từ hai mươi tuổi trở lên, sẽ thấy miền đất mà Ta đã thề với Áp-ra-ham, với Y-sác và với Gia-cốp[a], vì họ đã không theo Ta một cách trọn vẹn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng công thức thề với từ “nếu”: “nếu những người đàn ông ấy ... thấy miền đất”, qua đó ngầm diễn đạt một lời phủ định mạnh: “chắc chắn chẳng một ai ... sẽ thấy”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “họ đã không hoàn toàn theo Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Chắc chắn chẳng một ai ... sẽ được thấy
  rationale: Trong công thức thề, אִם mở đầu một lời thề phủ định rút gọn. Cách dịch này diễn đạt rõ sự phủ định mạnh và trang trọng, thay vì dùng từ “nếu” theo nghĩa đen nhưng dễ gây hiểu lầm trong tiếng Việt.
- source_word: יִרְאוּ
  choice: sẽ được thấy
  rationale: ראה ở đây không chỉ là nhìn bằng mắt mà còn hàm ý được sống để chứng kiến hoặc bước vào miền đất; “sẽ được thấy” giữ được cách nói của nguyên văn mà không giải thích quá mức.
- source_word: הָאֲנָשִׁים
  choice: những người đàn ông
  rationale: Danh từ Hê-bơ-rơ ở giống đực số nhiều và trong bối cảnh này chỉ những người nam thuộc độ tuổi kiểm tra dân số và quân dịch.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: đã đi lên từ Ai Cập
  rationale: Giữ hình ảnh không gian của động từ עלה cùng giới từ מן, một cách diễn đạt quen thuộc về cuộc xuất hành khỏi Ai Cập.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách diễn đạt tự nhiên và chính xác trong tiếng Việt cho công thức chỉ ngưỡng tuổi.
- source_word: הָאֲדָמָה
  choice: miền đất
  rationale: Trong bối cảnh lời hứa giao ước, אֲדָמָה chỉ vùng đất đã hứa chứ không đơn thuần là đất hoặc thổ nhưỡng.
- source_word: נִשְׁבַּעְתִּי
  choice: Ta đã thề
  rationale: Diễn đạt trực tiếp công thức tuyên thệ của Đức Chúa Trời, với đại từ “Ta” phù hợp lời phán trang trọng.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: với Áp-ra-ham, với Y-sác và với Gia-cốp
  rationale: Lặp lại “với” để phản ánh ba giới từ לְ trong nguyên văn và giữ nhịp điệu giao ước, đồng thời không thêm nội dung “ban cho” vốn chỉ được hàm ý.
- source_word: כִּי
  choice: vì
  rationale: Từ này nêu nguyên nhân của phán quyết trong lời thề; “vì” tự nhiên và giữ rõ quan hệ nhân quả.
- source_word: לֹא מִלְאוּ אַחֲרַי
  choice: họ đã không hoàn toàn theo Ta
  rationale: Thành ngữ מלא אחרי nói đến việc đi theo một cách trọn vẹn. Cách dịch này giữ hình ảnh “theo” và mức độ “hoàn toàn”, không chuyển thành khái niệm rộng hơn như trung tín.
theological_decisions:
- issue: Công thức thề phủ định mở đầu bằng אִם
  choice: Chắc chắn chẳng một ai ... sẽ được thấy
  alternative: Nếu những người đàn ông ấy ... được thấy
  rationale: Nguyên văn dùng một công thức thề rút gọn, trong đó mệnh đề bắt đầu bằng “nếu” ngầm mang ý phủ định mạnh. Dịch rõ lực phủ định giúp độc giả tiếng Việt hiểu đúng phán quyết mà không thêm một kết luận thần học ngoài văn bản.
- issue: Phạm vi ý nghĩa của לֹא מִלְאוּ אַחֲרַי
  choice: họ đã không hoàn toàn theo Ta
  alternative: họ đã không hết lòng trung tín với Ta
  rationale: Lựa chọn chính giữ nguyên hình ảnh đi theo Đức Chúa Trời và ý về mức độ trọn vẹn; phương án thay thế diễn giải rộng hơn thành sự trung tín và vì vậy không được đưa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” trong lời phán trực tiếp của Đức Chúa Trời; giữ “những người đàn ông” để phản ánh chính xác giống và bối cảnh kiểm tra dân số. Các tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
