revisions:
- from: Chắc chắn chẳng một ai trong số những người đàn ông đã đi lên từ Ai Cập, từ hai mươi tuổi trở lên, sẽ được thấy miền đất mà Ta đã thề với Áp-ra-ham, với Y-sác và với Gia-cốp[a], vì họ đã không hoàn toàn theo Ta.[b]
  to: Chắc chắn chẳng một ai trong số những người đàn ông đã đi lên từ Ai Cập, từ hai mươi tuổi trở lên, sẽ thấy miền đất mà Ta đã thề với Áp-ra-ham, với Y-sác và với Gia-cốp[a], vì họ đã không theo Ta một cách trọn vẹn.[b]
  rationale: Bản sửa thay thể bị động bằng thể chủ động để phản ánh chính xác יִרְאוּ, đồng thời chỉnh cách diễn đạt của thành ngữ “theo cách trọn vẹn” cho tự nhiên hơn trong tiếng Việt. Công thức thề phủ định, giới tính của nhóm người được nói đến, ngưỡng tuổi, lời thề với ba tổ phụ, và quan hệ nguyên nhân đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
