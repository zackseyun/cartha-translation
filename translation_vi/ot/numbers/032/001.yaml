  text: וּ/מִקְנֶ֣ה רַ֗ב הָיָ֞ה לִ/בְנֵ֧י רְאוּבֵ֛ן וְ/לִ/בְנֵי גָ֖ד עָצ֣וּם מְאֹ֑ד וַ/יִּרְא֞וּ אֶת אֶ֤רֶץ יַעְזֵר֙ וְ/אֶת אֶ֣רֶץ גִּלְעָ֔ד וְ/הִנֵּ֥ה הַ/מָּק֖וֹם מְק֥וֹם מִקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: vi
  text: Con cháu Ru-bên và con cháu Gát[a] có rất nhiều gia súc. Họ thấy đất Gia-ê-xe và đất Ga-la-át, và kìa, nơi ấy là nơi thích hợp cho gia súc.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Ru-bên và các con trai của Gát”, một cách gọi những người thuộc hai chi tộc này.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn lặp lại từ “nơi” để nhấn mạnh: “nơi ấy là nơi dành cho gia súc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: Con cháu Ru-bên và con cháu Gát
  rationale: בְּנֵי theo nghĩa đen là “các con trai của”, nhưng trong ngữ cảnh này chỉ các thành viên hoặc hậu duệ của hai chi tộc. “Con cháu” vừa tự nhiên trong tiếng Việt vừa giữ được hình ảnh thân tộc của nguyên văn.
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: có một đàn gia súc rất lớn
  rationale: מִקְנֶה chỉ gia súc như tài sản chăn nuôi, không chỉ riêng bò. Cách diễn đạt này gộp tự nhiên hai ý nhấn mạnh về số lượng và quy mô trong tiếng Hê-bơ-rơ mà không thu hẹp loại vật nuôi.
- source_word: וַיִּרְאוּ
  choice: Họ thấy
  rationale: Động từ ở thể kể chuyện tiếp nối trình tự bằng liên từ đơn giản. Tách thành câu mới giúp tiếng Việt rõ ràng mà không thêm sắc thái thời gian hoặc nguyên nhân vốn không được nói rõ.
- source_word: אֶרֶץ יַעְזֵר וְאֶרֶץ גִּלְעָד
  choice: đất Gia-ê-xe và đất Ga-la-át
  rationale: אֶרֶץ có thể là đất, vùng hoặc lãnh thổ. “Đất” trực tiếp và giữ sự lặp lại của nguyên văn trước cả hai địa danh.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: הִנֵּה thu hút sự chú ý đến điều họ nhận ra. “Kìa” giữ được tính trực tiếp và sức nhấn của từ này trong lời kể.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: nơi ấy là nơi dành cho gia súc
  rationale: Cách dịch giữ sự lặp lại có chủ ý của מָקוֹם (“nơi”) và diễn đạt công dụng của vùng đất mà không tự ý biến nó thành “đồng cỏ”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “con cháu” cho tên gọi chi tộc, “gia súc” theo nghĩa rộng, và giữ “kìa” cùng sự lặp lại của “nơi” để phản ánh nét tu từ của nguyên văn.
