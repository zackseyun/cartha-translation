  text: וּ/בְנֵ֤י רְאוּבֵן֙ בָּנ֔וּ אֶת חֶשְׁבּ֖וֹן וְ/אֶת אֶלְעָלֵ֑א וְ/אֵ֖ת קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: vi
  text: Con cháu Ru-bên xây Hết-bôn, Ê-lê-a-lê và Ki-ri-a-tha-im.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: Con cháu Ru-bên
  rationale: בְנֵי có nghĩa đen là “các con trai của”, nhưng khi đi với tên tổ phụ của một chi tộc, cụm từ chỉ các hậu duệ thuộc chi tộc ấy. “Con cháu Ru-bên” vừa giữ được ý niệm dòng dõi vừa tự nhiên và không khiến độc giả hiện đại hiểu rằng chỉ nói đến các con trai trực tiếp của Ru-bên.
- source_word: בָּנוּ
  choice: xây
  rationale: Động từ qal בנה có nghĩa cơ bản là “xây”. Trong bối cảnh định cư, từ này có thể bao hàm việc xây lại hoặc thiết lập các thành, nhưng bản văn không minh nhiên đòi hỏi các sắc thái ấy.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ xác định trong tiếng Hê-bơ-rơ, không có từ tương ứng riêng trong tiếng Việt.
- source_word: חֶשְׁבּוֹן
  choice: Hết-bôn
  rationale: Địa danh được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt, phản ánh các phụ âm chính của tên Hê-bơ-rơ.
- source_word: אֶלְעָלֵא
  choice: Ê-lê-a-lê
  rationale: Địa danh được phiên âm sát dạng được ghi âm trong bản Masoret.
- source_word: קִרְיָתָיִם
  choice: Ki-ri-a-tha-im
  rationale: Địa danh được phiên âm từ tiếng Hê-bơ-rơ; dạng số đôi trong tên riêng được giữ qua phần kết “-a-im” thay vì diễn giải nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng và dễ hiểu. Không thêm liên từ “Và” ở đầu câu vì tiếng Việt hiện đại không cần liên từ này để thể hiện waw kể chuyện; quan hệ tiếp nối vẫn rõ từ ngữ cảnh. Dùng “con cháu” thay cho cách dịch quá sát “các con trai” nhằm diễn đạt đúng nghĩa chi tộc trong tiếng Việt tự nhiên.
