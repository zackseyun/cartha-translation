  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: vi
  text: và Bết Nim-ra, Bết Ha-ran—những thành kiên cố—cùng các chuồng chiên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể chỉ các chuồng nhốt bầy gia súc nhỏ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: Bết Nim-ra
  rationale: Đây là địa danh; phiên âm theo cách đọc quen thuộc trong tiếng Việt thay vì dịch thành “nhà của Nim-ra”.
- source_word: בֵּית הָרָן
  choice: Bết Ha-ran
  rationale: Đây là tên thành; giữ dưới dạng phiên âm để người đọc nhận ra đó là địa danh.
- source_word: עָרֵי מִבְצָר
  choice: những thành kiên cố
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt rõ ý các thành có công sự phòng thủ.
- source_word: גִדְרֹת צֹאן
  choice: các chuồng cho bầy chiên
  rationale: Diễn đạt rõ các khu có rào bao quanh dùng để giữ bầy chiên; “צֹאן” cũng có thể chỉ gia súc nhỏ theo nghĩa rộng hơn.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: và ... , ... cùng ...
  rationale: Tiếp nối danh sách từ câu trước; lược bỏ dấu chỉ định tân ngữ אֵת vốn không cần biểu đạt riêng trong tiếng Việt, đồng thời dùng liên từ tự nhiên.
