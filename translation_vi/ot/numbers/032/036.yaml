  rationale: Chỉ chỉnh một cách diễn đạt để tăng tính tự nhiên và súc tích, không thay đổi nội dung, quan hệ liệt kê, hay phạm vi nghĩa của bản văn. Chú thích được giữ để nêu nghĩa rộng có thể có của từ Hê-bơ-rơ chỉ bầy chiên/gia súc nhỏ.
