source:
  edition: WLC
  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: vi
  text: ngoại trừ Ca-lép, con trai Giê-phu-nê, người Kê-nít, và Giô-suê, con trai Nun, vì họ đã hết lòng theo Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã trọn lòng theo Yahweh.” Thành ngữ Hê-bơ-rơ, theo nghĩa đen là “làm đầy theo sau Yahweh,” diễn tả lòng trung thành trọn vẹn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  choice: ngoại trừ
  rationale: Trong ngữ cảnh, từ này nêu hai người duy nhất không chịu phán quyết đã nói trước đó; “ngoại trừ” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Ca-lép, con trai Giê-phu-nê
  rationale: Phiên âm các tên riêng theo lối quen thuộc trong tiếng Việt; בֶּן được dịch rõ là “con trai”.
- source_word: הַקְּנִזִּי
  choice: người Kê-nít
  rationale: Đây là danh xưng chỉ dòng tộc hoặc mối liên hệ sắc tộc của Ca-lép; cách dịch “người Kê-nít” thể hiện chức năng của danh xưng trong câu.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: và Giô-suê, con trai Nun
  rationale: Liên từ nối người thứ hai thuộc diện ngoại lệ; các tên riêng được phiên âm, còn בִּן được dịch là “con trai”.
- source_word: כִּי
  choice: vì
  rationale: Từ này nêu lý do Ca-lép và Giô-suê được loại khỏi phán quyết; “vì” diễn đạt rõ quan hệ nguyên nhân.
- source_word: מִלְאוּ אַחֲרֵי
  choice: đã hoàn toàn theo
  rationale: Thành ngữ Hê-bơ-rơ, theo nghĩa đen là “làm đầy đằng sau”, diễn tả việc trung thành đi theo cách trọn vẹn. “Đã hoàn toàn theo” giữ được hình ảnh theo sau mà vẫn dễ hiểu; chú thích cung cấp cách diễn đạt tự nhiên tương đương.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng danh bốn phụ âm, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יְהוָה. “Yahweh” bảo tồn chức năng danh riêng và tránh thay nó bằng tước hiệu.
- issue: Mức độ trung thành trong thành ngữ מִלְאוּ אַחֲרֵי
  choice: đã hoàn toàn theo
  alternative: đã hết lòng theo
  rationale: Cách dịch chính giữ gần cấu trúc và ý niệm theo sau trọn vẹn, nhưng không biến sự trung thành thành một khẳng định thần học rộng hơn về tình trạng đạo đức tuyệt đối. Cách dịch tự nhiên “hết lòng theo” được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu này tiếp nối cú pháp của câu trước nên bắt đầu bằng chữ thường; tên người và danh xưng dòng tộc được phiên âm theo lối Việt hóa, còn danh Yahweh được giữ dưới dạng danh riêng.
