  text: וְ/אֶת נְב֞וֹ וְ/אֶת בַּ֧עַל מְע֛וֹן מֽוּסַבֹּ֥ת שֵׁ֖ם וְ/אֶת שִׂבְמָ֑ה וַ/יִּקְרְא֣וּ בְ/שֵׁמֹ֔ת אֶת שְׁמ֥וֹת הֶ/עָרִ֖ים אֲשֶׁ֥ר בָּנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: vi
  text: Nê-bô[a], Ba-anh Mê-ôn—tên của hai thành này đã được thay đổi—và Síp-ma. Họ đặt tên cho các thành mà họ đã xây dựng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với những tên đã được thay đổi” hoặc “là những thành đã được đổi tên.” Cụm từ Hê-bơ-rơ có lẽ cho biết tên của Nê-bô và Ba-anh Mê-ôn đã được thay đổi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוֹ
  choice: Nê-bô
  rationale: Tên địa danh được phiên âm theo cách đọc Hê-bơ-rơ và quy ước tên riêng dễ đọc trong tiếng Việt.
- source_word: בַּעַל מְעוֹן
  choice: Ba-anh Mê-ôn
  rationale: Giữ đây là tên địa danh ghép; phiên âm từng thành tố để người đọc tiếng Việt dễ nhận biết và phát âm.
- source_word: מוּסַבֹּת שֵׁם
  choice: tên của hai thành này đã được thay đổi
  rationale: Cụm phân từ bị động số nhiều nói đến việc đổi tên; vị trí cú pháp cho thấy cụm này nhiều khả năng bổ nghĩa cho Nê-bô và Ba-anh Mê-ôn. Thêm “hai thành này” để quan hệ quy chiếu rõ ràng tự nhiên trong tiếng Việt, đồng thời giữ chú thích về khả năng diễn đạt khác.
- source_word: שִׂבְמָה
  choice: Síp-ma
  rationale: Tên địa danh được phiên âm sát các phụ âm Hê-bơ-rơ theo dạng tự nhiên trong tiếng Việt.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת
  choice: Họ đặt tên
  rationale: “Đặt tên” là cách diễn đạt thành ngữ tự nhiên của hành động gọi hoặc chỉ định bằng tên trong ngữ cảnh này.
- source_word: אֶת שְׁמוֹת הֶעָרִים
  choice: cho các thành
  rationale: Tiếng Hê-bơ-rơ nói sát nghĩa là “các tên của những thành”; tiếng Việt tự nhiên diễn đạt hành động này là “đặt tên cho các thành”.
- source_word: אֲשֶׁר בָּנוּ
  choice: mà họ đã xây dựng
  rationale: Giữ nghĩa thông thường của בנה là “xây dựng”, không tự ý chuyển thành “xây lại”; “đã” thể hiện hành động hoàn tất trước việc đặt tên.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng dấu gạch ngang để đặt cụm giải thích vào đúng phạm vi bổ nghĩa mà không làm câu nặng nề; mọi tên địa danh được phiên âm nhất quán.
