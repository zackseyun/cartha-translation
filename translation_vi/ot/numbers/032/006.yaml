  to: 'Nhưng Môi-se nói với con cháu của Gát và con cháu của Ru-bên: “Anh em của các anh[a] sẽ ra trận[b], còn các anh lại ngồi đây sao?”'
  rationale: Chỉ điều chỉnh nhẹ cách diễn đạt nhóm bộ tộc và di chuyển ký hiệu chú thích b đến đúng cụm “ra trận”. Nghĩa, sắc thái câu hỏi tu từ và thuật ngữ chủ chốt đều được giữ nguyên.
