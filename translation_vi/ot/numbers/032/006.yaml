base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: vi
  text: 'Nhưng Môi-se nói với con cháu của Gát và con cháu của Ru-bên: “Anh em của các anh[a] sẽ ra trận[b], còn các anh lại ngồi đây sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em của các anh” chỉ những người Y-sơ-ra-ên thuộc các bộ tộc khác.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “sẽ đi chiến đấu”. Cụm tiếng Hê-bơ-rơ dùng một thành ngữ thông dụng chỉ việc tham gia chiến trận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng Môi-se nói
  rationale: Waw nối tiếp đẩy câu chuyện tiến tới; trong ngữ cảnh, “nhưng” diễn đạt tự nhiên sự đối lập giữa đề nghị trước đó và lời quở trách của Môi-se.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: với con cháu Gát và con cháu Ru-bên
  rationale: בני theo nghĩa đen là “các con trai của”, nhưng ở đây chỉ các nhóm bộ tộc; “con cháu” vừa tự nhiên trong tiếng Việt vừa giữ quan hệ dòng dõi.
- source_word: הַאַחֵיכֶם
  choice: anh em của các anh
  rationale: Giữ hình ảnh thân tộc của nguyên văn; trong ngữ cảnh, cụm này chỉ những người Y-sơ-ra-ên thuộc các bộ tộc khác.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: sẽ ra trận
  rationale: Động từ “đến/đi vào” kết hợp với “chiến tranh, trận chiến” là thành ngữ chỉ việc tham chiến; “ra trận” là cách diễn đạt tiếng Việt tự nhiên và giữ sắc thái quân sự.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: còn các anh lại ngồi đây sao
  rationale: ישב có thể là “ngồi, ở lại, cư ngụ”; “ngồi đây” giữ hình ảnh cụ thể và sức quở trách, còn “còn… lại” làm rõ sự tương phản trong câu hỏi tu từ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ giữ nguyên sức quở trách; “con cháu” phù hợp cách gọi các nhóm bộ tộc, còn “ra trận” tự nhiên hơn lối dịch từng chữ “đi vào cuộc chiến”.
