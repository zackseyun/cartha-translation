id: NUM.32.17
reference: Numbers 32:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: vi
  text: Còn chúng tôi sẽ mau chóng tự vũ trang và đi trước dân Y-sơ-ra-ên[a], cho đến khi chúng tôi đưa họ đến nơi của họ; con trẻ của chúng tôi[b] sẽ ở lại trong các thành kiên cố vì cư dân trong xứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trước mặt con cái Y-sơ-ra-ên”; trong bối cảnh này, có lẽ chỉ việc đi ở tuyến đầu trước dân Y-sơ-ra-ên khi chiến đấu.'
    reason: lexical_alternative
  - marker: b
    text: “Con trẻ” là một từ tập hợp, có thể chỉ cả trẻ em và những người lệ thuộc trong gia đình.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: trang bị vũ khí
  rationale: 'Dạng Niphal mang nghĩa phản thân/trung gian trong ngữ cảnh này: những người nói cam kết tự trang bị để chiến đấu.'
- source_word: חֻשִׁים
  choice: nhanh chóng
  rationale: Trạng từ diễn tả sự mau lẹ và sẵn sàng; cách dịch này tránh lặp lại ý trang bị vũ khí của נֵחָלֵץ.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: đi trước dân Y-sơ-ra-ên
  rationale: לִפְנֵי theo nghĩa đen là “trước mặt”; trong bối cảnh quân sự, cụm từ có khả năng chỉ việc đi ở tuyến đầu. “Dân Y-sơ-ra-ên” là cách gọi tự nhiên trong tiếng Việt hiện đại cho tập thể בְּנֵי יִשְׂרָאֵל.
- source_word: עַד אֲשֶׁר אִם
  choice: cho đến khi
  rationale: Tổ hợp này đánh dấu điểm kết thúc của hành động; “cho đến khi” truyền đạt tự nhiên chức năng cú pháp ấy.
- source_word: הֲבִיאֹנֻם
  choice: đưa họ tới
  rationale: Dạng Hiphil của בוא có nghĩa khiến đến, tức là đem hoặc đưa đến; “đưa” phù hợp với việc dẫn dân đến vùng định cư.
- source_word: אֶל מְקוֹמָם
  choice: tới nơi của họ
  rationale: Giữ cách diễn đạt rộng của nguyên bản, có thể chỉ nơi đến hoặc phần đất định cư được dành cho họ.
- source_word: וְיָשַׁב טַפֵּנוּ
  choice: con trẻ của chúng tôi sẽ ở lại
  rationale: טַף là danh từ tập hợp, chủ yếu chỉ trẻ nhỏ nhưng trong ngữ cảnh có thể bao gồm những người lệ thuộc; “con trẻ” tự nhiên và không thu hẹp quá mức.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: trong các thành kiên cố
  rationale: Cụm từ chỉ những thành có công sự bảo vệ; “thành kiên cố” là cách nói rõ ràng, trang trọng trong tiếng Việt.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: để tránh cư dân trong xứ
  rationale: מִפְּנֵי biểu thị mối đe dọa hoặc lý do phải lánh khỏi; cách dịch làm rõ sắc thái bảo vệ mà bối cảnh các thành kiên cố hàm ý, không xác định thêm bản chất mối nguy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; giữ “nơi của họ” để bảo toàn độ rộng nghĩa của nguyên bản, đồng thời dùng chú thích để ghi nhận nghĩa đen và khả năng quân sự của לִפְנֵי.
