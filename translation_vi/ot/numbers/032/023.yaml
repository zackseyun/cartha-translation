revisions:
- from: Nhưng nếu anh em không làm như vậy, thì anh em đã phạm tội với Yahweh. Hãy biết rằng tội của anh em chắc chắn sẽ tìm đến anh em.[a]
  to: Nhưng nếu anh em không làm như vậy, này, anh em đã phạm tội chống lại Yahweh; hãy biết rằng tội của anh em sẽ đuổi kịp anh em.[a]
  rationale: Bản sửa làm rõ đối tượng bị xúc phạm trong «phạm tội chống lại Yahweh», phục hồi lực nhấn của הִנֵּה bằng «này», và dùng «sẽ đuổi kịp» để chuyển đạt tự nhiên thành ngữ «tội của anh em sẽ tìm thấy anh em» mà không áp đặt cách giải thích chỉ là phơi bày hoặc chỉ là hình phạt. Chú thích giữ các khả năng dịch sát hơn và giải thích hàm ý của thành ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:21:25Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc điều kiện, mệnh lệnh «hãy biết», danh Yahweh, và hình ảnh tội được nhân cách hóa. Tuy nhiên, לַיהוָה với động từ חטא trong ngữ cảnh này cần được diễn đạt là phạm tội «chống lại» Yahweh, không chỉ «với» Yahweh. Hạt nhấn הִנֵּה cũng nên được thể hiện rõ hơn.
  naturalness: «Tội của anh em chắc chắn sẽ tìm đến anh em» không tự nhiên trong tiếng Việt và làm mờ sắc thái tội lỗi/ hậu quả đuổi kịp người phạm tội. «Tội của anh em sẽ đuổi kịp anh em» là cách nói hiện đại, tự nhiên, vẫn giữ phép nhân cách hóa và không thu hẹp nghĩa vào riêng việc bị phát giác.
  terminology: «Yahweh» phù hợp với quyết định thuật ngữ. «Phạm tội chống lại Yahweh» diễn đạt đúng quan hệ của động từ חטא với Đức Chúa Trời. Giữ «tội» thay vì giải thích thành chỉ «hình phạt» hoặc chỉ «tội lỗi bị phơi bày».
  issues:
  - severity: medium
    issue: Giới từ «với Yahweh» chưa diễn đạt đầy đủ quan hệ của חטא לַיהוָה.
    rationale: Trong cách dùng này, động từ «phạm tội» xác định Yahweh là Đấng bị xúc phạm; «chống lại Yahweh» là tương đương rõ và tự nhiên hơn.
  - severity: medium
    issue: «Tìm đến anh em» làm suy yếu thành ngữ cảnh báo ở cuối câu.
    rationale: תִּמְצָא אֶתְכֶם nói về tội lỗi tất yếu bắt kịp/giáng đến người phạm tội, với hàm ý bị phát giác và hậu quả. «Đuổi kịp» bảo toàn sức cảnh báo hơn.
  - severity: low
    issue: Hạt nhấn הִנֵּה không được thể hiện riêng.
    rationale: «Này» giữ tín hiệu cảnh báo, nhấn mạnh của nguyên văn mà vẫn hợp với văn phong trang trọng.
  revised_text: Nhưng nếu anh em không làm như vậy, này, anh em đã phạm tội chống lại Yahweh; hãy biết rằng tội của anh em sẽ đuổi kịp anh em.[a]
