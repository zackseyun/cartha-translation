  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תַעֲשׂוּ/ן֙ כֵּ֔ן הִנֵּ֥ה חֲטָאתֶ֖ם לַ/יהוָ֑ה וּ/דְעוּ֙ חַטַּאתְ/כֶ֔ם אֲשֶׁ֥ר תִּמְצָ֖א אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: vi
  text: Nhưng nếu anh em không làm như vậy, này, anh em đã phạm tội chống lại Yahweh; hãy biết rằng tội của anh em sẽ đuổi kịp anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tội của anh em sẽ tìm ra anh em” hoặc “tội lỗi của anh em sẽ tìm thấy anh em.” Thành ngữ Hê-bơ-rơ diễn tả việc tội lỗi chắc chắn bị phơi bày và kéo theo hậu quả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn tả điều kiện mang ý tương phản với lời dặn ở phần trước.
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: anh em không làm như vậy
  rationale: Cách nói tự nhiên, chỉ về việc họ đã cam kết thực hiện trong văn cảnh trước.
- source_word: הִנֵּה
  choice: thì
  rationale: Trong câu cảnh báo tiếng Việt, “thì” đánh dấu mạnh hệ quả của điều kiện một cách tự nhiên; sức nhấn cũng được thể hiện qua cấu trúc toàn câu.
- source_word: חֲטָאתֶם לַיהוָה
  choice: anh em đã phạm tội với Yahweh
  rationale: Dạng động từ hoàn thành trình bày hành vi phạm tội như hệ quả chắc chắn nếu họ không làm điều đã hứa; ל đánh dấu Đấng bị xúc phạm.
- source_word: וּדְעוּ
  choice: Hãy biết rằng
  rationale: Giữ nguyên lực mệnh lệnh số nhiều và dẫn vào điều họ phải nhận thức chắc chắn.
- source_word: חַטַּאתְכֶם
  choice: tội của anh em
  rationale: Giữ nghĩa trực tiếp “tội”; trong ngữ cảnh, từ này cũng hàm chứa trách nhiệm và hậu quả do tội gây ra.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: chắc chắn sẽ tìm đến anh em
  rationale: Giữ hình ảnh nhân cách hóa của nguyên văn, đồng thời thêm “chắc chắn” để truyền đạt tính không thể tránh khỏi của lời cảnh báo.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn danh riêng mà không thay bằng tước hiệu.
- issue: Tội “tìm đến” người phạm tội
  choice: Giữ hình ảnh nhân cách hóa và tính bao quát
  alternative: tội sẽ bị phơi bày; hình phạt sẽ đuổi kịp
  rationale: Nguyên văn không xác định riêng sự phát hiện hay hình phạt. Cách dịch giữ được sự mơ hồ có chủ ý giữa việc tội bị lộ và hậu quả tất yếu của nó.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. “Anh em” phù hợp với lời Môi-se nói cùng một nhóm người nam/dân chúng; câu cuối giữ hình ảnh mạnh của tiếng Hê-bơ-rơ mà vẫn dễ hiểu trong tiếng Việt.
