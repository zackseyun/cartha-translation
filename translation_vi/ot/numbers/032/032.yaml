  variant: modern standard Vietnamese
source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: vi
  text: Chính chúng tôi sẽ vượt qua với vũ khí, trước mặt Yahweh, vào đất Canaan; còn phần đất cơ nghiệp thuộc quyền sở hữu của chúng tôi sẽ thuộc về chúng tôi ở bên này sông Jordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phía bên kia sông Jordan” hoặc “bên kia sông Jordan”. Cách nói trong tiếng Hê-bơ-rơ tùy thuộc vào điểm nhìn; ở đây, “bên này sông Jordan” phản ánh vị trí của những người nói ở phía đông con sông.
    reason: Giữ sự phụ thuộc điểm nhìn và các khả năng từ vựng của מֵעֵבֶר לַיַּרְדֵּן.
lexical_decisions:
- source_word: נַחְנוּ
  choice: Chính chúng tôi
  rationale: Đại từ độc lập đứng cùng động từ ngôi thứ nhất số nhiều tạo sắc thái nhấn mạnh; “chính chúng tôi” diễn đạt tự nhiên sự cam kết đích thân của người nói.
- source_word: נַעֲבֹר
  choice: sẽ ... vượt qua
  rationale: Động từ Qal chưa hoàn thành ngôi thứ nhất số nhiều chỉ hành động tương lai được cam kết, trong ngữ cảnh là vượt qua sông Jordan.
- source_word: חֲלוּצִים
  choice: trang bị vũ khí
  rationale: Trong ngữ cảnh quân sự, từ này chỉ trạng thái được vũ trang và sẵn sàng ra trận; cách dịch này ngắn gọn mà vẫn rõ nghĩa.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ ý nghĩa không gian–quan hệ của לִפְנֵי và chuyển trực tiếp danh giao ước יְהוָה là “Yahweh”.
- source_word: אֶרֶץ כְּנָעַן
  choice: vào đất Canaan
  rationale: Dù tiếng Hê-bơ-rơ không có giới từ trước cụm danh từ này, “vào” diễn đạt đích đến tự nhiên sau động từ chỉ sự vượt qua.
- source_word: וְאִתָּנוּ
  choice: còn ... sẽ ở với chúng tôi
  rationale: Mệnh đề tiếng Hê-bơ-rơ không có động từ; bổ sung “sẽ ở” theo hướng tương lai của lời cam kết, đồng thời “còn” thể hiện sự chuyển ý tự nhiên.
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: phần đất chúng tôi sở hữu làm cơ nghiệp
  rationale: Cách diễn đạt giữ được cả ý về phần đất thuộc quyền sở hữu (אֲחֻזָּה) lẫn phần được nhận làm cơ nghiệp (נַחֲלָה), nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: bên này sông Jordan
  rationale: Cụm từ phụ thuộc vào điểm nhìn. Trong ngữ cảnh, người nói đang ở phía đông sông Jordan và nhắc đến phần cơ nghiệp tại đó, nên “bên này” phản ánh điểm nhìn của họ; chú thích giữ các khả năng dịch khác.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của “trước mặt Yahweh”
  choice: Giữ nguyên cách nói không gian–giao ước
  alternative: đi trước theo mệnh lệnh của Yahweh
  rationale: Cụm từ có thể hàm ý chiến đấu trong sự hiện diện và dưới thẩm quyền của Yahweh, nhưng câu không nói rõ “theo mệnh lệnh”; bản dịch không thêm cách giải thích thần học vượt quá nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “cơ nghiệp” vì đây là thuật ngữ quen thuộc trong ngữ cảnh phân chia đất, nhưng kết hợp với “phần đất” để người đọc phổ thông nhận ra nghĩa cụ thể. Giữ tên riêng “Jordan” và “Canaan” theo dạng quốc tế thông dụng.
