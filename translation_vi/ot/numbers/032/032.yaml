revisions:
- from: Chính chúng tôi sẽ trang bị vũ khí vượt qua trước mặt Yahweh, vào đất Canaan; còn phần đất chúng tôi sở hữu làm cơ nghiệp sẽ ở với chúng tôi bên này sông Jordan.[a]
  to: Chính chúng tôi sẽ vượt qua với vũ khí, trước mặt Yahweh, vào đất Canaan; còn phần đất cơ nghiệp thuộc quyền sở hữu của chúng tôi sẽ thuộc về chúng tôi ở bên này sông Jordan.[a]
  rationale: 'Sửa hai chỗ diễn đạt chưa tự nhiên: đặt “với vũ khí” sau động từ để cho thấy những người nói vượt qua trong tình trạng được vũ trang; thay “sẽ ở với chúng tôi” bằng “sẽ thuộc về chúng tôi” để truyền đạt tự nhiên quan hệ sở hữu của phần đất cơ nghiệp. Giữ “bên này sông Jordan” theo điểm nhìn nội tại của người nói, đồng thời chú thích bảo tồn khả năng dịch khác.'
