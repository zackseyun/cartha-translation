source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: vi
  text: Họ đi lên tận thung lũng Ếch-côn, thấy xứ ấy, rồi làm con cái Y-sơ-ra-ên nản lòng, khiến họ không vào xứ mà Yahweh đã ban cho họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Họ đi lên
  rationale: Giữ nghĩa chỉ hướng của עלה, đồng thời tự nhiên trong tiếng Việt.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: tận thung lũng Ếch-côn
  rationale: עַד được diễn đạt bằng “tận”; נַחַל ở đây chỉ một thung lũng khe suối, và “thung lũng” dễ hiểu trong tiếng Việt phổ thông.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: và xem thấy xứ ấy
  rationale: ראה mang nghĩa cơ bản là thấy; “xem thấy” phù hợp với việc quan sát xứ trong mạch truyện.
- source_word: וַיָּנִיאוּ אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: rồi làm con cái Y-sơ-ra-ên nản lòng
  rationale: Dạng Hiphil của נוא diễn tả việc khiến người khác thoái chí hoặc quay lòng. “Làm ... nản lòng” truyền đạt tự nhiên tác động lên quyết tâm tập thể; “con cái Y-sơ-ra-ên” giữ danh xưng giao ước/dân tộc của nguyên văn.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: không muốn vào xứ
  rationale: Cụm לְבִלְתִּי với động từ nguyên mẫu diễn tả kết quả ngăn trở; trong tiếng Việt, sau “làm ... nản lòng”, “không muốn vào” thể hiện rõ việc họ bị khiến cho chùn bước, không tiến vào xứ.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: mà Đức Giê-hô-va đã ban cho họ
  rationale: נתן là thể hoàn thành, phù hợp với “đã ban”; יְהוָה được phiên âm theo cách gọi quen thuộc và trang trọng trong tiếng Việt là “Đức Giê-hô-va”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. “Đức Giê-hô-va” bảo lưu đây là danh riêng, có tính trang trọng và dễ nhận biết đối với độc giả Kinh Thánh tiếng Việt, thay vì thay bằng một tước hiệu.
- issue: Sắc thái của וַיָּנִיאוּ
  choice: làm ... nản lòng
  alternative: làm ... đổi lòng; khiến ... từ chối
  rationale: Ngữ cảnh cho thấy các thám tử khiến dân chúng mất quyết tâm tiến vào xứ. Bản dịch giữ tác động gây thoái chí mà không quy định quá mức cơ chế tâm lý hay thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc kể chuyện nối tiếp của tiếng Hê-bơ-rơ, nhưng dùng “rồi” để câu tiếng Việt tự nhiên; không thêm quan hệ tương phản vốn không có trong nguyên văn.
