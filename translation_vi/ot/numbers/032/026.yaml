base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: vi
  text: Con thơ của chúng tôi[a], vợ chúng tôi, đàn gia súc của chúng tôi và tất cả thú vật của chúng tôi sẽ ở lại đó, trong các thành của Ga-la-át.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con cái của chúng tôi”. Từ Hê-bơ-rơ טַף thường đặc biệt chỉ trẻ nhỏ hoặc con cái còn lệ thuộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: con cái thơ ấu của chúng tôi
  rationale: טַף thường chỉ trẻ nhỏ hoặc con cái còn lệ thuộc; cách dịch này giữ sắc thái về độ tuổi, đồng thời chú thích nêu phương án rộng hơn.
- source_word: נָשֵׁינוּ
  choice: vợ chúng tôi
  rationale: Trong ngữ cảnh các gia đình của những người đang nói, dạng số nhiều có hậu tố ngôi thứ nhất số nhiều tự nhiên nhất là “vợ chúng tôi”.
- source_word: מִקְנֵנוּ
  choice: đàn gia súc của chúng tôi
  rationale: מִקְנֶה chỉ gia súc như bầy đàn, gồm chiên dê và gia súc lớn; thêm “đàn” diễn đạt tự nhiên ý nghĩa tập hợp.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: và tất cả súc vật của chúng tôi
  rationale: בְּהֵמָה là từ rộng chỉ thú vật, đặc biệt là vật nuôi; “súc vật” vừa giữ độ rộng vừa phân biệt phần nào với מִקְנֶה.
- source_word: יִהְיוּ
  choice: sẽ ở lại
  rationale: Nghĩa cơ bản là “sẽ ở”, nhưng ngữ cảnh cho thấy họ ở lại phía sau trong khi các chiến binh lên đường; “sẽ ở lại” diễn đạt đúng lực ngữ cảnh.
- source_word: שָׁם
  choice: đó
  rationale: Trạng từ chỉ nơi chốn được dịch trực tiếp và tự nhiên.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: trong các thành của Ga-la-át
  rationale: עָרִים có thể là các thành hay thị trấn; “các thành của Ga-la-át” là cách dịch trang trọng, quen thuộc và sát cấu trúc Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép liệt kê của nguyên văn; dùng “Ga-la-át” theo dạng phiên âm Kinh Thánh Việt ngữ quen thuộc. Không thêm chú thích cho יִהְיוּ vì bản dịch “sẽ ở lại” đã thể hiện hợp lý hàm ý ngữ cảnh; dữ liệu tiếng Anh gắn chú thích [b] không nhất quán với từ được đánh dấu.
