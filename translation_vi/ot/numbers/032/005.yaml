  source_fidelity: 'Cần sửa cụm «được đẹp lòng ông»: cụm này nói các người thỉnh cầu làm hài lòng Môi-se, trong khi thành ngữ מָצָאנוּ חֵן בְּעֵינֶיךָ nói họ nhận được sự ưu ái/favor nơi ông. Các phần còn lại truyền đạt đúng lời thỉnh cầu, thể bị động của יֻתַּן, lối tự xưng khiêm nhường «các tôi tớ ông», ý sở hữu của אֲחֻזָּה, và sắc thái sai khiến của תַּעֲבִרֵנוּ.'
