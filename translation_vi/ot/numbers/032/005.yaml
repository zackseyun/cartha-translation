  terminology: «Các tôi tớ ông» thích hợp như lối tự xưng kính cẩn; «phần sở hữu» giữ nghĩa một phần đất được nắm giữ mà không áp đặt nghĩa «thừa kế». «Sông Giô-đanh» là cách viết tên riêng chuẩn.
  issues:
