base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: vi
  text: 'Họ nói: “Nếu chúng tôi được ông ưu ái, xin cho miền đất này được ban cho các tôi tớ ông làm phần sở hữu. Xin đừng đưa chúng tôi qua sông Giô-đanh.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin đừng khiến chúng tôi vượt qua sông Giô-đanh.” Động từ Hê-bơ-rơ ở thể sai khiến có thể mang nghĩa đưa qua hoặc khiến cho vượt qua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: nếu chúng tôi được đẹp lòng ông
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ việc nhận được sự ưu ái của người đối diện. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ sắc thái kính cẩn của lời thỉnh cầu.
- source_word: יֻתַּן
  choice: xin cho ... được ban
  rationale: Dạng bị động mang sắc thái cầu xin. Cách dịch giữ cấu trúc thỉnh cầu trang trọng mà không biến câu thành một mệnh lệnh trực tiếp.
- source_word: הָאָרֶץ הַזֹּאת
  choice: miền đất này
  rationale: Trong ngữ cảnh phân chia lãnh thổ, “miền đất này” vừa trực tiếp vừa tự nhiên hơn “lãnh thổ này”.
- source_word: לַעֲבָדֶיךָ
  choice: cho các tôi tớ ông
  rationale: Ở đây עבד là cách tự xưng khiêm nhường trước Môi-se, không nhấn mạnh địa vị nô lệ; “tôi tớ” giữ được sắc thái kính cẩn.
- source_word: לַאֲחֻזָּה
  choice: làm phần sở hữu
  rationale: אֲחֻזָּה chỉ phần đất được nắm giữ lâu dài. “Phần sở hữu” truyền đạt ý này mà không mặc nhiên đồng nhất với thuật ngữ “cơ nghiệp” hay “thừa kế”.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: Xin đừng đưa chúng tôi qua sông Giô-đanh
  rationale: Dạng Hiphil của עבר có nghĩa gây khiến hoặc đưa ai qua. “Đưa chúng tôi qua” tự nhiên, giữ được tính tác động của thể sai khiến và tránh hàm ý cưỡng ép quá mạnh.
