  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: vi
  text: 'Bấy giờ, con cháu Gát và con cháu Ru-bên đáp rằng: “Yahweh đã phán với các tôi tớ của ông thế nào, chúng tôi sẽ làm như vậy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng tôi sẽ làm theo điều Yahweh đã phán với các tôi tớ của ông.”'
    reason: Phản ánh cách diễn đạt mệnh đề danh từ thay cho cấu trúc tương liên của אֵת אֲשֶׁר ... כֵּן.
lexical_decisions:
- source_word: וַיַּעֲנוּ ... לֵאמֹר
  choice: đáp rằng
  rationale: Trong văn kể chuyện, ענה ở dạng này dẫn vào lời hồi đáp; kết hợp với לֵאמֹר, “đáp rằng” vừa tự nhiên trong tiếng Việt vừa giữ rõ chức năng dẫn lời.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: con cháu Gát và con cháu Ru-bên
  rationale: בְּנֵי theo nghĩa đen là “các con trai của”, nhưng ở đây chỉ các thành viên thuộc hai chi phái. “Con cháu” bảo lưu hình ảnh thân tộc mà vẫn tránh khiến độc giả hiểu đây chỉ là con trai trực tiếp của Gát và Ru-bên.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: … thế nào, … như vậy
  rationale: Cách diễn đạt tương liên này truyền đạt tự nhiên quan hệ giữa điều Yahweh đã phán và việc họ cam kết thực hiện, đồng thời giữ khả năng phân tích cú pháp khác trong chú thích.
- source_word: דִּבֶּר
  choice: đã phán
  rationale: Động từ chỉ lời nói đã được ban ra trước đó; “đã phán” phù hợp với ngữ cảnh lời của Đức Chúa Trời và không thêm sắc thái ngoài văn bản.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: אֶל עֲבָדֶיךָ
  choice: với các tôi tớ của ông
  rationale: עֶבֶד ở đây là lối tự xưng khiêm nhường trước Môi-se. “Tôi tớ” phù hợp hơn “nô lệ”; hậu tố ngôi hai số ít được thể hiện bằng “của ông”.
- source_word: נַעֲשֶׂה
  choice: chúng tôi sẽ làm
  rationale: Giữ nghĩa rộng và trực tiếp của עשה, diễn tả cam kết thực hiện mà không thêm một tân ngữ không có trong nguyên văn.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. Phiên âm “Yahweh” giữ đây là danh riêng, thay vì âm thầm thay bằng một tước hiệu.
- issue: Quan hệ cú pháp của אֵת אֲשֶׁר với כֵּן
  choice: “Yahweh đã phán … thế nào, chúng tôi sẽ làm như vậy”
  alternative: “Điều Yahweh đã phán …, chúng tôi sẽ làm”
  rationale: Cả cách hiểu tương liên “thế nào… như vậy” và cách hiểu mệnh đề danh từ “điều… ấy” đều khả hữu. Bản chính giữ cấu trúc tương liên, còn chú thích bảo lưu cách phân tích khác mà không làm thay đổi nội dung cam kết.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. “Bấy giờ” nối câu với diễn tiến tường thuật; “đáp rằng” cô đọng cấu trúc Hê-bơ-rơ. Tên chi phái dùng dạng quen thuộc trong tiếng Việt: Gát và Ru-bên.'
