- from: 'Bấy giờ, con cháu Gát và con cháu Ru-bên đáp rằng: “Yahweh đã phán với các tôi tớ của ông thế nào, chúng tôi sẽ làm như vậy.”[a]'
  to: 'Bấy giờ, con cháu Gát và con cháu Ru-bên đáp rằng: “Yahweh đã phán với các tôi tớ của ông thế nào, chúng tôi sẽ làm như vậy.”[a]'
