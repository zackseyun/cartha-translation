base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: vi
  text: Hãy xây cho mình các thành cho con trẻ anh em, và làm các chuồng cho đàn chiên dê của anh em; hãy thực hiện điều đã ra khỏi miệng anh em[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “hãy làm điều anh em đã hứa.” Nguyên văn Hê-bơ-rơ là “hãy thực hiện điều đã ra khỏi miệng anh em”, một thành ngữ chỉ việc thực hiện lời mình đã nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוּ
  choice: Hãy xây
  rationale: Động từ mệnh lệnh số nhiều của בנה, diễn đạt trực tiếp mệnh lệnh xây dựng.
- source_word: לָכֶם
  choice: lược dịch trong cấu trúc sở hữu “của anh em”
  rationale: Trong tiếng Việt, lợi ích dành cho chính họ được thể hiện tự nhiên qua các cụm “cho con trẻ của anh em” và “cho bầy gia súc của anh em”; thêm “cho mình” sẽ nặng câu.
- source_word: עָרִים
  choice: các thành
  rationale: עיר có thể chỉ thành hoặc thị trấn; “các thành” phù hợp bối cảnh định cư và cách dùng Kinh Thánh trang trọng.
- source_word: לְטַפְּכֶם
  choice: cho con trẻ của anh em
  rationale: טף chủ yếu chỉ trẻ nhỏ, đôi khi gợi rộng hơn đến những người yếu thế đi theo gia đình. “Con trẻ” giữ nét cụ thể và thân thuộc mà không mở rộng thành mọi người lệ thuộc.
- source_word: וּגְדֵרֹת
  choice: và làm chuồng
  rationale: גדרות ở đây là những khu có rào dùng giữ gia súc. “Chuồng” là cách nói tự nhiên, dễ hiểu trong tiếng Việt; động từ “làm” tránh hàm ý nhất thiết phải là công trình xây kiên cố.
- source_word: לְצֹנַאֲכֶם
  choice: cho bầy gia súc của anh em
  rationale: צאן chỉ đàn gia súc nhỏ, nhất là chiên và dê. “Bầy gia súc” tự nhiên hơn “đàn vật nuôi nhỏ”, dù ít chuyên biệt hơn; ngữ cảnh chuồng trại giữ rõ ý nghĩa.
- source_word: וְהַיֹּצֵא מִפִּיכֶם
  choice: còn điều đã ra khỏi miệng anh em
  rationale: Giữ hình ảnh nguyên văn của thành ngữ Hê-bơ-rơ về lời đã nói hoặc lời cam kết, đồng thời dùng “còn” để chuyển sang mệnh lệnh kết luận một cách tự nhiên.
- source_word: תַּעֲשׂוּ
  choice: anh em phải thực hiện
  rationale: עשה nghĩa cơ bản là “làm”; với lời đã nói, “thực hiện” truyền đạt rõ việc làm đúng điều đã cam kết mà vẫn giữ thành ngữ ở vế trước.
theological_decisions:
- issue: Tính chất của lời đã ra khỏi miệng
  choice: Giữ nguyên thành ngữ trong chính văn và giải thích là lời đã nói hoặc cam kết trong chú thích
  alternative: Dịch thẳng là “hãy làm điều anh em đã hứa”
  rationale: Nguyên văn không dùng riêng một danh từ nghĩa là “lời hứa”. Giữ hình ảnh “ra khỏi miệng” bảo tồn sắc thái rộng và sức nặng của lời nói, không thu hẹp quá mức thành một công thức lời thề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng; giữ thành ngữ Hê-bơ-rơ trong chính văn nhưng dùng “thực hiện” để câu tiếng Việt sáng nghĩa. Dấu chú thích [a] được đặt ngay sau thành ngữ cần giải thích.
