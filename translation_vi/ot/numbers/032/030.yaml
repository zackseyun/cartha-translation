  text: וְ/אִם לֹ֧א יַֽעַבְר֛וּ חֲלוּצִ֖ים אִתְּ/כֶ֑ם וְ/נֹֽאחֲז֥וּ בְ/תֹכְ/כֶ֖ם בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: vi
  text: Nhưng nếu họ không vượt qua cùng anh em trong tư thế vũ trang, thì họ sẽ được cấp phần đất giữa anh em trong xứ Ca-na-an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thì họ sẽ được định cư giữa anh em trong xứ Ca-na-an.” Động từ Hê-bơ-rơ có thể chỉ việc được thiết lập trong quyền sở hữu, chứ không chỉ hành động nhận đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ mở đầu vế điều kiện tương phản với câu trước; “Nhưng nếu” diễn đạt rõ chức năng ấy trong ngữ cảnh.
- source_word: יַעַבְרוּ
  choice: vượt qua
  rationale: Động từ עבר ở đây chỉ việc vượt qua sông Giô-đanh để vào xứ Ca-na-an.
- source_word: חֲלוּצִים
  choice: mang vũ khí
  rationale: Từ này chỉ trạng thái được trang bị và sẵn sàng chiến đấu; cách diễn đạt này tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אִתְּכֶם
  choice: cùng anh em
  rationale: Diễn đạt sự đồng hành với cộng đồng Y-sơ-ra-ên; “anh em” phù hợp với lời nói trực tiếp hướng đến một tập thể nam giới trong ngữ cảnh.
- source_word: וְנֹאחֲזוּ
  choice: thì họ sẽ được nhận phần đất sở hữu
  rationale: Dạng Niphal của אחז trong bối cảnh phân chia đất nói đến việc được thiết lập trong quyền sở hữu hoặc được cấp một phần đất. Bản dịch chính nêu rõ sắc thái thụ nhận nhưng giữ phương án gần nghĩa khác trong chú thích.
- source_word: בְּתֹכְכֶם
  choice: giữa anh em
  rationale: Chỉ vị trí ở trong cộng đồng của những người Y-sơ-ra-ên nhận đất tại phía tây sông Giô-đanh.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: trong xứ Ca-na-an
  rationale: Giữ đầy đủ cách gọi địa lý của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều giống đực trong lời nói trực tiếp, đồng thời tránh lối diễn đạt quá cổ như “cơ nghiệp” hoặc “sản nghiệp” khi nguyên văn dùng động từ chỉ quyền chiếm hữu.
