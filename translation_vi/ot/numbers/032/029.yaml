id: NUM.32.29
reference: Numbers 32:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: vi
  text: 'Môi-se nói với họ: “Nếu con cháu Gát và con cháu Ru-bên, tất cả đều được trang bị để chiến đấu trước mặt Yahweh, cùng anh em vượt qua sông Giô-đanh, và xứ ấy bị khuất phục trước mặt anh em, thì anh em phải ban đất Ga-la-át cho họ làm cơ nghiệp.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dùng động từ kể chuyện tự nhiên trong tiếng Việt; không nhất thiết dịch liên từ וַ־ thành “và” ở đầu câu.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: con cháu Gát và con cháu Ru-bên
  rationale: Giữ rõ cách gọi theo huyết thống và bộ tộc của nguyên văn, đồng thời tự nhiên hơn “các con trai” trong tiếng Việt hiện đại.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: vượt qua sông Giô-đanh
  rationale: Diễn đạt tự nhiên hành động qua sông; thêm danh từ loại “sông” để người đọc Việt nhận biết địa danh.
- source_word: אִתְּכֶם
  choice: cùng anh em
  rationale: Thể hiện trực tiếp ý đồng hành; “anh em” phù hợp lời Môi-se nói với các thủ lĩnh và cộng đồng Israel.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: mọi người được trang bị để chiến đấu
  rationale: חָלוּץ chỉ người đã được trang bị hoặc dàn trận; cách dịch này giữ sắc thái quân sự mà không thêm ý ngoài văn bản.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ không gian-thần học לִפְנֵי và phiên âm danh riêng giao ước thay vì thay bằng một tước hiệu.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: và xứ ấy bị khuất phục
  rationale: Giữ thể bị động của כבש và ý bị đặt dưới quyền kiểm soát, không cường điệu thành hủy diệt.
- source_word: לִפְנֵיכֶם
  choice: trước mặt anh em
  rationale: Bảo tồn thành ngữ Hebrew và mối liên hệ với cuộc tiến quân của Israel.
- source_word: וּנְתַתֶּם לָהֶם
  choice: thì anh em phải ban ... cho họ
  rationale: “Thì” làm rõ mệnh đề kết quả của điều kiện; “phải ban” truyền đạt lực chỉ thị của dạng động từ trong ngữ cảnh phân chia đất.
- source_word: אֲחֻזָּה
  choice: cơ nghiệp
  rationale: Chỉ phần đất được nắm giữ lâu dài theo quyền thừa hưởng; “cơ nghiệp” là từ trang trọng, quen thuộc trong văn phong Kinh Thánh Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng với tước hiệu và không áp đặt truyền thống thay thế danh bằng “Chúa”.
- issue: Ý nghĩa của לִפְנֵי יְהוָה trong cuộc chiến
  choice: trước mặt Yahweh
  alternative: dưới sự dẫn dắt của Yahweh
  rationale: Nguyên văn nói “trước mặt Yahweh”; không diễn giải thêm về hình thức dẫn dắt, sự hiện diện hay phê chuẩn, nhờ đó giữ nguyên độ mở thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều hướng đến cộng đồng; giữ các tên riêng theo dạng Việt hóa quen thuộc, riêng יהוה được ghi là Yahweh. Dấu gạch ngang làm rõ cụm đồng vị “mọi người được trang bị để chiến đấu” bổ nghĩa cho lực lượng vượt sông.
