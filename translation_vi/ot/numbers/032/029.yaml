  to: 'Môi-se nói với họ: “Nếu con cháu Gát và con cháu Ru-bên, tất cả đều được trang bị để chiến đấu trước mặt Yahweh, cùng anh em vượt qua sông Giô-đanh, và xứ ấy bị khuất phục trước mặt anh em, thì anh em phải ban đất Ga-la-át cho họ làm cơ nghiệp.”'
