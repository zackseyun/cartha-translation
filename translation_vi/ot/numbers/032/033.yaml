source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם מֹשֶׁ֡ה לִ/בְנֵי גָד֩ וְ/לִ/בְנֵ֨י רְאוּבֵ֜ן וְ/לַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֣ה בֶן יוֹסֵ֗ף אֶת מַמְלֶ֨כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י וְ/אֶת מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן הָ/אָ֗רֶץ לְ/עָרֶ֨י/הָ֙ בִּ/גְבֻלֹ֔ת עָרֵ֥י הָ/אָ֖רֶץ סָבִֽיב׀־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: vi
  text: Môi-se trao cho con cháu Gát, con cháu Ru-bên và nửa chi tộc Ma-na-se, con trai Giô-sép, vương quốc của Si-hôn, vua dân A-mô-rít, cùng vương quốc của Óc, vua Ba-san—vùng đất cùng các thành của nó trong các địa hạt, tức các thành của vùng đất chung quanh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ Hê-bơ-rơ ở cuối câu rất cô đọng và có thể được hiểu theo vài cách gần nhau; cũng có thể dịch: “vùng đất, các thành của nó cùng các ranh giới của các thành ấy, tức các thành của vùng đất chung quanh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: trao cho
  rationale: Động từ נתן ở đây chỉ việc Môi-se trao hoặc phân đất; “trao cho” tự nhiên và vẫn giữ sắc thái tường thuật trực tiếp.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: con cháu Gát ... con cháu Ru-bên
  rationale: “Con cháu” giữ được thành ngữ gia tộc–bộ tộc của בְּנֵי mà vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: và phân nửa bộ tộc Ma-na-se
  rationale: Phản ánh trực tiếp cấu trúc Hê-bơ-rơ và tránh biến cụm từ thành tên gọi cố định “nửa bộ tộc” khi nguyên văn cũng có thể hiểu là một nửa của bộ tộc.
- source_word: בֶן יוֹסֵף
  choice: con trai Giô-sép
  rationale: Giữ nguyên thông tin phả hệ dùng để xác định Ma-na-se.
- source_word: מַמְלֶכֶת
  choice: vương quốc
  rationale: Tương đương trực tiếp, chỉ lãnh thổ từng thuộc quyền cai trị của Si-hôn và Óc.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Si-hôn, vua dân A-mô-rít
  rationale: Giữ cấu trúc đồng vị và làm rõ הָאֱמֹרִי mang nghĩa tập thể, chỉ dân A-mô-rít.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Óc, vua Ba-san
  rationale: Bản dịch trực tiếp chuỗi tên và tước hiệu trong nguyên văn.
- source_word: הָאָרֶץ
  choice: vùng đất
  rationale: Chỉ lãnh thổ vừa được nhắc đến; “vùng đất” tự nhiên hơn “đất” đơn thuần trong ngữ cảnh phân chia lãnh thổ.
- source_word: לְעָרֶיהָ בִּגְבֻלֹת עָרֵי הָאָרֶץ סָבִיב
  choice: với các thành nằm trong ranh giới của nó, là các thành trong vùng đất chung quanh
  rationale: Cố gắng giữ cấu trúc đồng vị và sự cô đọng của cụm Hê-bơ-rơ, đồng thời dùng chú thích để thừa nhận những cách phân tích cú pháp khác.
theological_decisions: []
translation_notes:
  register: Văn phong tường thuật trang trọng nhưng hiện đại. Dùng “con cháu” để bảo tồn thành ngữ bộ tộc, và đặt dấu gạch ngang để cho thấy phần sau giải thích phạm vi hai vương quốc được trao. Dấu chú thích [a] được đặt ngay sau cụm từ có cú pháp không chắc chắn.
