  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: vi
  text: Nhưng các tôi tớ của ngài, mỗi người đã được trang bị để chiến đấu, sẽ vượt qua trước mặt Yahweh để ra trận,[a] đúng như chúa tôi nói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để chiến đấu” hoặc “cho cuộc chiến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: Nhưng các tôi tớ của ngài
  rationale: עֶבֶד ở đây là cách các chi phái tự xưng khi kính cẩn thưa với Môi-se; “tôi tớ” giữ được sắc thái ấy. Waw được dịch là “Nhưng” vì lời này đối ứng với điều vừa nêu trong văn cảnh.
- source_word: יַעַבְרוּ
  choice: sẽ vượt qua
  rationale: Động từ עבר trong văn cảnh chỉ việc vượt sang bên kia ranh giới để tham chiến; “vượt qua” tự nhiên và giữ được ý chuyển động.
- source_word: כָּל חֲלוּץ צָבָא
  choice: tất cả những người được trang bị để chiến đấu
  rationale: כָּל kết hợp với dạng số ít mang ý bao quát từng người; חֲלוּץ צָבָא chỉ người đã được trang bị và sẵn sàng cho nhiệm vụ quân sự.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ nghĩa trực tiếp “trước mặt/trong sự hiện diện của” và bảo toàn ý rằng cuộc hành quân diễn ra dưới thẩm quyền, trong sự hiện diện của Yahweh.
- source_word: לַמִּלְחָמָה
  choice: ra trận
  rationale: Giới từ לְ diễn tả hướng đi hoặc mục đích; “ra trận” là cách nói Việt tự nhiên, vừa giữ ý chuyển động vừa nêu mục đích quân sự.
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: đúng như chúa tôi đã nói
  rationale: כַּאֲשֶׁר biểu thị sự phù hợp; אֲדֹנִי là cách kính cẩn gọi Môi-se, không phải danh xưng thần linh. Phân từ דֹּבֵר trong ngữ cảnh quy chiếu đến lời Môi-se vừa nói nên tiếng Việt tự nhiên dùng “đã nói”.
theological_decisions:
- issue: Cách dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Danh Giao Ước; phiên âm “Yahweh” phân biệt danh này với אֲדֹנִי, vốn chỉ Môi-se trong cùng câu.
- issue: Ý nghĩa của לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  alternative: dưới quyền Yahweh
  rationale: Bản dịch chính giữ hình ảnh và độ mở của tiếng Hê-bơ-rơ, không thu hẹp cụm từ chỉ còn một cách giải thích về thẩm quyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chúa tôi” viết thường để chỉ lời tôn kính dành cho Môi-se, nhờ đó không lẫn với Yahweh. Dấu chân chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
