revisions:
- from: Nhưng các tôi tớ của ngài sẽ vượt qua, tất cả những người được trang bị để chiến đấu, trước mặt Yahweh, ra trận,[a] đúng như chúa tôi đã nói.
  to: Nhưng các tôi tớ của ngài, mỗi người đã được trang bị để chiến đấu, sẽ vượt qua trước mặt Yahweh để ra trận,[a] đúng như chúa tôi nói.
  rationale: Bản sửa làm rõ sắc thái “mỗi người” của כָּל, dùng trật tự câu Việt tự nhiên hơn, và giữ phân từ דֹּבֵר ở sắc thái hiện tại bằng “nói.” “Trước mặt Yahweh” vẫn được giữ nguyên để không thu hẹp nghĩa của לִפְנֵי יְהוָה. Chú thích được điều chỉnh để nêu các phương án thực sự khác biệt cho לַמִּלְחָמָה.
  reviewer_model: gpt-5.6-terra
