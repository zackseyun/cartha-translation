  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: vi
  text: Vậy, tại sao các ông lại làm nản lòng con cái Israel, ngăn họ vượt qua để vào xứ mà Yahweh đã ban cho họ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, tiếng Hê-bơ-rơ nói đến việc “làm nản lòng” của con cái Israel. Cũng có thể hiểu là làm suy giảm lòng can đảm hoặc quyết tâm của họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: Vậy tại sao
  rationale: Giữ sắc thái liên kết của וְ với lời trách cứ ngay trước đó, đồng thời diễn đạt câu hỏi tự nhiên trong tiếng Việt.
- source_word: תנואון אֶת־לֵב
  choice: làm nản lòng
  rationale: Động từ Hiphil của נוא trong thành ngữ với לֵב chỉ việc làm suy giảm ý chí hoặc khiến người ta chùn bước. “Làm nản lòng” vừa tự nhiên vừa giữ hình ảnh “lòng” của nguyên văn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Cụm từ dân tộc–gia tộc này theo nghĩa sát là “các con trai của Israel”; “con cái Israel” là cách nói trang trọng, quen thuộc trong tiếng Việt và có thể chỉ toàn dân.
- source_word: מֵעֲבֹר אֶל־הָאָרֶץ
  choice: khiến họ không vượt qua để vào xứ
  rationale: מִן với động từ nguyên mẫu diễn tả sự ngăn cản; “vượt qua để vào” làm rõ cả hành động vượt qua và đích đến là xứ, phù hợp bối cảnh vượt sông Jordan.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: mà ... đã ban cho họ
  rationale: Dạng hoàn thành נָתַן được chuyển là “đã ban”, giữ cách nhìn về việc ban xứ như một hành động đã được xác lập.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước YHWH; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel; các con trai Israel
  rationale: “Con cái Israel” giữ hình thức gia tộc của tiếng Hê-bơ-rơ nhưng trong ngữ cảnh chỉ cộng đồng Israel nói chung, không nhất thiết chỉ nam giới.
- issue: Quan hệ ngăn cản trong מֵעֲבֹר
  choice: khiến họ không vượt qua
  alternative: ngăn họ vượt qua
  rationale: Cách chọn giữ trọng tâm của động từ chính ở việc làm nản lòng, đồng thời biểu đạt rõ hậu quả ngăn cản do giới từ מִן; không quyết định rằng đây là sự cấm đoán trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì Môi-se đang nói trực tiếp với những người thuộc các chi phái Ru-bên và Gát; dùng “xứ” để giữ sắc thái địa bàn được ban trong ngữ cảnh Kinh Thánh. Dấu chú thích [a] xuất hiện ngay trong câu chính.
