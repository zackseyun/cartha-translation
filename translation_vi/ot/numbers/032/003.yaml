base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/003.yaml
  text: Ataroth[a], Dibon, Jazer, Nimrah, Heshbon, Elealeh, Sebam, Nebo[b], and Beon—
translation:
  language: vi
  text: A-ta-rốt, Đi-bôn, Gia-ê-xe, Nim-ra, Hết-bôn, Ê-lê-a-lê, Sê-bam[a], Nê-bô và Bê-ôn[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ chép “Sê-bam”; ở những chỗ khác, địa danh có liên hệ này xuất hiện dưới dạng “Síp-ma” hoặc “Síp-mah”.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ chép “Bê-ôn”; ở những chỗ khác, địa danh có liên hệ này xuất hiện dưới dạng đầy đủ “Ba-anh Mê-ôn”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  choice: A-ta-rốt
  rationale: Địa danh được phiên âm theo lối viết tên riêng Kinh Thánh quen thuộc và dễ đọc trong tiếng Việt, không dịch nghĩa.
- source_word: דִיבֹן
  choice: Đi-bôn
  rationale: Phiên âm trực tiếp địa danh Hê-bơ-rơ sang dạng tự nhiên trong tiếng Việt.
- source_word: יַעְזֵר
  choice: Gia-ê-xe
  rationale: Phiên âm giữ các âm tiết chính của địa danh Hê-bơ-rơ và phù hợp với cách đọc tiếng Việt.
- source_word: נִמְרָה
  choice: Nim-ra
  rationale: Giữ đúng dạng địa danh ngắn trong câu này, không đồng nhất với dạng dài Bết Nim-ra xuất hiện ở nơi khác.
- source_word: חֶשְׁבּוֹן
  choice: Hết-bôn
  rationale: Phiên âm địa danh theo hình thức quen thuộc, rõ ràng đối với độc giả tiếng Việt.
- source_word: אֶלְעָלֵה
  choice: Ê-lê-a-lê
  rationale: Phiên âm đầy đủ địa danh, phản ánh cấu trúc âm tiết của nguyên ngữ.
- source_word: שְׂבָם
  choice: Sê-bam
  rationale: Phản ánh trực tiếp dạng שׂבם trong câu này; không tự ý chuẩn hóa thành tên liên hệ Si-ma hoặc Síp-ma ở các chỗ khác.
- source_word: נְבוֹ
  choice: Nê-bô
  rationale: Phiên âm trực tiếp địa danh Hê-bơ-rơ theo cách dễ đọc trong tiếng Việt.
- source_word: בְּעֹן
  choice: Bê-ôn
  rationale: Giữ dạng ngắn được chép trong câu này, không thay bằng dạng mở rộng Ba-anh Mê-ôn ở những chỗ khác.
- source_word: וְ / וּ
  choice: dấu phẩy trong danh sách, với “và” trước tên cuối
  rationale: Tiếng Hê-bơ-rơ lặp liên từ để nối các địa danh; tiếng Việt hiện đại diễn đạt danh sách tự nhiên hơn bằng dấu phẩy và dùng “và” trước mục cuối, không làm thay đổi quan hệ giữa các tên.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Các địa danh được phiên âm nhất quán bằng dấu gạch nối; chuỗi liên từ Hê-bơ-rơ được chuyển thành cách liệt kê tự nhiên trong tiếng Việt. Dấu gạch ngang cuối câu được giữ vì câu nói còn tiếp sang phần sau.
