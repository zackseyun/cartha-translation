source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: vi
  text: Khi xứ đã được chinh phục trước mặt Yahweh, sau đó anh em có thể trở về và sẽ không còn chịu trách nhiệm trước Yahweh và Israel[a]. Xứ này sẽ thuộc về anh em làm sản nghiệp trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được kể là vô tội” hoặc “trong sạch trước Yahweh và trước Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: và khi xứ đã được chinh phục
  rationale: Dạng Nifal diễn tả xứ được đặt dưới quyền kiểm soát. “Được chinh phục” giữ sắc thái bị động và phù hợp tự nhiên với bối cảnh quân sự.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Diễn đạt trực tiếp ý “trước mặt, trong sự hiện diện của”; giữ tên riêng giao ước Yahweh.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: thì sau đó anh em có thể trở về
  rationale: Cụm từ đánh dấu trình tự thời gian; trong mệnh đề điều kiện này, hành động trở về được cho phép sau khi nghĩa vụ đã hoàn tất.
- source_word: וִהְיִיתֶם נְקִיִּים מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: và không còn mắc trách nhiệm với Yahweh và Israel
  rationale: נְקִיִּים có thể chỉ sự vô tội hoặc không còn bị ràng buộc. Trong ngữ cảnh lời cam kết, cách dịch này nêu rõ việc đã làm trọn trách nhiệm mà không phủ nhận sắc thái pháp lý của nguyên ngữ.
- source_word: וְהָיְתָה הָאָרֶץ הַזֹּאת לָכֶם לַאֲחֻזָּה
  choice: Xứ này sẽ thuộc về anh em làm sản nghiệp
  rationale: אֲחֻזָּה là phần đất được nắm giữ lâu dài; “sản nghiệp” tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ hàm ý quyền sở hữu đất.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Giữ đây là danh riêng trong nguyên văn và tránh biến nó thành một tước hiệu.
- issue: Ý nghĩa của נְקִיִּים trong bối cảnh lời cam kết
  choice: không còn mắc trách nhiệm
  alternative: vô tội / trong sạch
  rationale: Bối cảnh nói đến việc hoàn tất trách nhiệm quân sự đối với Đức Chúa Trời và cộng đồng Israel; chú thích giữ lại nghĩa khả dĩ về sự vô tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến các chi phái; dùng “xứ” và “sản nghiệp” để giữ sắc thái về đất giao ước mà vẫn quen thuộc với độc giả Kinh Thánh tiếng Việt.
