  to: Khi xứ đã được chinh phục trước mặt Yahweh, sau đó anh em có thể trở về và sẽ không còn chịu trách nhiệm trước Yahweh và Israel[a]. Xứ này sẽ thuộc về anh em làm sản nghiệp trước mặt Yahweh.
  rationale: Bản sửa thay cách nói không tự nhiên “mắc trách nhiệm với” bằng “không còn chịu trách nhiệm trước,” qua đó giữ được ý được giải khỏi trách nhiệm trước Yahweh và Israel. Câu đầu cũng được làm gọn để phản ánh trình tự của tiếng Hê-bơ-rơ một cách tự nhiên hơn, không thay đổi ý nghĩa.
