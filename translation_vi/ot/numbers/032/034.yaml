  text: וַ/יִּבְנ֣וּ בְנֵי גָ֔ד אֶת דִּיבֹ֖ן וְ/אֶת עֲטָרֹ֑ת וְ/אֵ֖ת עֲרֹעֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/034.yaml
  text: The sons of Gad built Dibon[a], Ataroth[b], and Aroer.
translation:
  language: vi
  text: Con cháu Gát xây dựng Đi-bôn[a], Át-ta-rốt và A-rô-e.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong văn cảnh, cũng có thể hiểu là “xây lại” hoặc “củng cố”; động từ Hê-bơ-rơ tự nó chỉ có nghĩa là “xây dựng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: xây dựng
  rationale: Động từ בנה ở dạng kể chuyện diễn tả hành động đã xảy ra, nghĩa cơ bản là “xây dựng”. Trong bối cảnh định cư, có thể hiểu là xây lại hoặc củng cố, nhưng bản thân động từ không buộc phải mang các sắc thái ấy.
- source_word: בְנֵי גָד
  choice: Con cháu Gát
  rationale: Cụm từ có nghĩa đen là “các con trai của Gát”, nhưng trong văn cảnh bộ tộc chỉ những người thuộc dòng dõi hay bộ tộc Gát. “Con cháu Gát” vừa giữ hình ảnh huyết tộc của tiếng Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
- source_word: אֶת
  choice: không dịch riêng
  rationale: Đây là dấu hiệu chỉ định ngữ trực tiếp trong tiếng Hê-bơ-rơ, không có từ tương ứng độc lập trong tiếng Việt; chức năng của nó được thể hiện qua cú pháp.
- source_word: דִּיבֹן
  choice: Đi-bôn
  rationale: Địa danh được phiên âm sang tiếng Việt.
- source_word: עֲטָרֹת
  choice: Át-ta-rốt
  rationale: Địa danh được phiên âm sang tiếng Việt.
- source_word: עֲרֹעֵר
  choice: A-rô-e
  rationale: Địa danh được phiên âm sang tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng và tự nhiên. Dùng “con cháu Gát” để diễn đạt thành ngữ huyết tộc Hê-bơ-rơ theo nghĩa bộ tộc mà không biến nó thành một thuật ngữ khó hiểu. Tên riêng được phiên âm nhất quán theo lối tiếng Việt.
