  text: וְ/יָאִ֤יר בֶּן מְנַשֶּׁה֙ הָלַ֔ךְ וַ/יִּלְכֹּ֖ד אֶת חַוֺּתֵי/הֶ֑ם וַ/יִּקְרָ֥א אֶתְ/הֶ֖ן חַוֺּ֥ת יָאִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: vi
  text: Gia-i-rơ, con trai Ma-na-se, đi và chiếm các làng của họ, rồi đặt tên chúng là Ha-vốt Gia-i-rơ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ha-vốt Gia-i-rơ có nghĩa là “các làng của Gia-i-rơ” hoặc “các khu định cư của Gia-i-rơ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָאִיר
  choice: Gia-ia
  rationale: Phiên âm tên riêng Jair theo lối viết tự nhiên, dễ đọc trong tiếng Việt.
- source_word: בֶּן מְנַשֶּׁה
  choice: con trai Ma-na-se
  rationale: Giữ nghĩa trực tiếp của cấu trúc Hê-bơ-rơ; dù trong một số văn cảnh có thể chỉ hậu duệ, câu này không buộc phải giải nghĩa rộng hơn.
- source_word: הָלַךְ
  choice: đi
  rationale: Diễn đạt đơn giản, tự nhiên trình tự hành động, không thêm hướng đi hay mục đích vốn không được nêu rõ.
- source_word: וַיִּלְכֹּד
  choice: chiếm
  rationale: Động từ לכד trong bối cảnh lãnh thổ mang nghĩa chiếm lấy; “chiếm” tự nhiên và phù hợp hơn “bắt giữ” khi đối tượng là các làng.
- source_word: חַוֺּתֵיהֶם
  choice: các làng của họ
  rationale: חַוּוֹת chỉ những khu định cư nhỏ hoặc làng không có tường thành; “các làng” rõ ràng và tự nhiên đối với độc giả hiện đại.
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: gọi các làng ấy là
  rationale: Trong ngữ cảnh đặt địa danh, cách diễn đạt này vừa truyền đạt nghĩa “gọi/đặt tên” vừa tự nhiên trong tiếng Việt.
- source_word: חַוֺּת יָאִיר
  choice: Ha-vốt Gia-ia
  rationale: Giữ đây là một địa danh bằng cách phiên âm, đồng thời chú thích nghĩa của tên gọi.
