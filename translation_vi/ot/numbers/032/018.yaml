revisions:
- from: Chúng tôi sẽ không trở về nhà mình cho đến khi mỗi người trong con cái Israel[a] nhận được phần cơ nghiệp của mình.
  to: Chúng tôi sẽ không trở về nhà mình cho đến khi mỗi người Israel được nhận phần cơ nghiệp của mình.[a]
  rationale: Bản sửa giữ nguyên phủ định, thời hướng tương lai, giới hạn ‘cho đến khi’, và tính phân phối ‘mỗi người ... của mình’. Cụm ‘được nhận phần cơ nghiệp’ làm rõ hơn sắc thái của הִתְנַחֵל trong bối cảnh thụ hưởng đất được phân, còn ‘mỗi người Israel’ cải thiện độ tự nhiên mà chú thích vẫn bảo lưu cách nói gia tộc của nguyên ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:21:16Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời cam kết không trở về và tính phân phối của phần cơ nghiệp. Tuy nhiên, הִתְנַחֵל trong ngữ cảnh phân chia/định cư đất không chỉ là ‘nhận được’; động từ này bao hàm việc được/đi vào quyền sở hữu cơ nghiệp. ‘Được nhận phần cơ nghiệp’ phản ánh sát hơn sắc thái thụ hưởng được phân định mà vẫn tự nhiên.
  naturalness: ‘Chúng tôi sẽ không trở về nhà mình’ là tiếng Việt hiện đại, tự nhiên. Cấu trúc ‘mỗi người trong con cái Israel’ hơi gượng và có thể gây cảm giác mỗi người là một thành viên tách khỏi cụm từ; chuyển thành ‘mỗi người Israel’ tự nhiên hơn trong câu này.
  terminology: ‘Phần cơ nghiệp’ phù hợp cho נַחֲלָתוֹ và giữ sắc thái đất được phân. ‘Con cái Israel’ có thể dùng trong văn phong Kinh Thánh, nhưng với cấu trúc phân phối אִישׁ ... נַחֲלָתוֹ, ‘mỗi người Israel’ diễn đạt rõ và tự nhiên hơn; chú thích có thể bảo lưu thành ngữ Hê-bơ-rơ ‘con cái Israel’.
  issues:
  - severity: medium
    issue: ‘nhận được’ làm nhẹ sắc thái của הִתְנַחֵל.
    rationale: Trong ngữ cảnh này, động từ nói đến việc người Israel đi vào/thụ hưởng quyền sở hữu cơ nghiệp đã được phân. Thêm ‘được’ và giữ ‘phần cơ nghiệp’ phản ánh rõ hơn ý nhận lãnh phần đất được cấp, không áp đặt cách hiểu về phương thức chiếm hữu.
  - severity: low
    issue: ‘mỗi người trong con cái Israel’ chưa tự nhiên.
    rationale: Tiếng Việt hiện đại thường dùng ‘mỗi người Israel’ trong cấu trúc phân phối. Chú thích vẫn có thể nêu hình thức nguyên ngữ ‘con cái Israel’ và lựa chọn thay thế ‘dân Israel’.
  revised_text: Chúng tôi sẽ không trở về nhà mình cho đến khi mỗi người Israel được nhận phần cơ nghiệp của mình.[a]
