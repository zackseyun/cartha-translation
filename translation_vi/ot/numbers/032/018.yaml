    reason: lexical_alternative
  revision_rationale: Bản sửa giữ nguyên phủ định, thời hướng tương lai, giới hạn ‘cho đến khi’, và tính phân phối ‘mỗi người ... của mình’. Cụm ‘được nhận phần cơ nghiệp’ làm rõ hơn sắc thái của הִתְנַחֵל trong bối cảnh thụ hưởng đất được phân, còn ‘mỗi người Israel’ cải thiện độ tự nhiên mà chú thích vẫn bảo lưu cách nói gia tộc của nguyên ngữ.
