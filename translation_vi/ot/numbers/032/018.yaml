source:
  edition: WLC
  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: vi
  text: Chúng tôi sẽ không trở về nhà mình cho đến khi mỗi người Israel được nhận phần cơ nghiệp của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “mỗi người trong dân Israel”. Tiếng Hê-bơ-rơ: “con cái Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: chúng tôi sẽ không trở về
  rationale: Thể Qal chưa hoàn thành ngôi thứ nhất số nhiều diễn tả hành động tương lai gắn với lời cam kết; cách dịch này tự nhiên và giữ rõ ý phủ định.
- source_word: אֶל בָּתֵּינוּ
  choice: về nhà mình
  rationale: Giới từ chỉ hướng đi với danh từ số nhiều có hậu tố ngôi thứ nhất số nhiều. Trong tiếng Việt, “trở về nhà mình” tự nhiên hơn “trở về những ngôi nhà của chúng tôi” mà vẫn giữ đúng ý.
- source_word: עַד
  choice: cho đến khi
  rationale: Diễn tả giới hạn thời gian của việc không trở về.
- source_word: הִתְנַחֵל
  choice: nhận được
  rationale: Động từ Hitpael của נחל trong ngữ cảnh này nói đến việc mỗi người được sở hữu phần đất đã phân làm cơ nghiệp; kết hợp với “phần cơ nghiệp” tránh lối diễn đạt nặng nề nhưng vẫn bảo toàn sắc thái phân chia và sở hữu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh gia tộc của thành ngữ Hê-bơ-rơ và là cách diễn đạt Kinh Thánh trang trọng, dễ hiểu trong tiếng Việt hiện đại; chú thích nêu cách dịch tự nhiên hơn là “dân Israel”.
- source_word: אִישׁ
  choice: mỗi người
  rationale: Trong cấu trúc phân phối, אִישׁ có nghĩa “mỗi người”, không nhất thiết nhấn mạnh giới tính của từng cá nhân.
- source_word: נַחֲלָתוֹ
  choice: phần cơ nghiệp của mình
  rationale: Chỉ phần đất được phân cho từng người hoặc gia tộc. Từ “phần” làm rõ tính phân phối, còn “cơ nghiệp” giữ nội hàm thừa hưởng và sở hữu đất.
theological_decisions:
- issue: Cách diễn đạt mang tính gia tộc trong בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel
  rationale: Bản dịch chính giữ thành ngữ gia tộc của nguyên văn mà không giới hạn cách hiểu vào các con trai theo nghĩa sinh học; cách dịch tự nhiên theo căn tính dân tộc được bảo lưu trong chú thích.
- issue: Ý nghĩa của נחל trong bối cảnh chia đất
  choice: nhận được phần cơ nghiệp
  alternative: chiếm hữu phần cơ nghiệp
  rationale: Nguyên văn có thể nhấn mạnh việc đi vào quyền sở hữu phần đất được phân. “Nhận được” phù hợp với ý cơ nghiệp được cấp, trong khi “chiếm hữu” có thể nhấn mạnh hơn khía cạnh thực thi quyền sở hữu; không nên biến câu này thành một tuyên bố thần học riêng về phương thức nhận đất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “chúng tôi” cho lời cam kết tập thể; “nhà mình” và “của mình” là cách hồi chỉ tự nhiên trong tiếng Việt, còn “phần cơ nghiệp” giữ sắc thái Kinh Thánh và bối cảnh phân chia đất.
