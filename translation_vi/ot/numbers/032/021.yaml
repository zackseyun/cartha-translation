  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: vi
  text: và mọi người có vũ trang trong số anh em sẽ vượt sông Giô-đanh trước mặt Yahweh, cho đến khi người ấy đánh đuổi[a] các kẻ thù của mình khỏi trước mặt mình[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tước quyền sở hữu của”. Động từ Hê-bơ-rơ có thể mang nghĩa “đánh đuổi” hoặc “tước quyền sở hữu”.
    reason: lexical_alternative
  - marker: b
    text: Chuỗi đại từ trong cụm “người ấy đánh đuổi các kẻ thù của mình khỏi trước mặt mình” có khả năng tự nhiên nhất là chỉ Yahweh; tuy nhiên, một số người hiểu chúng là chỉ Israel hoặc lực lượng vũ trang của Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: đều vượt
  rationale: Dạng động từ hoàn thành có waw trong mệnh đề điều kiện tiếp nối câu 20 mang ý nghĩa tương lai/quy định. Tiếng Việt có thể diễn đạt tự nhiên bằng động từ không đánh dấu thì; từ “đều” phối hợp với “mọi người” làm rõ tính bao quát.
- source_word: לָכֶם
  choice: trong anh em
  rationale: Giới từ với đại từ chỉ mối liên hệ với các chi phái đang được nói đến; “trong anh em” diễn đạt tự nhiên ý “among you”.
- source_word: כָּל חָלוּץ
  choice: mọi người được trang bị vũ khí
  rationale: חָלוּץ chỉ người đã được trang bị để chiến đấu. Cách dịch này giữ ý quân sự mà không diễn giải quá mức thành một danh xưng như “chiến binh”.
- source_word: אֶת הַיַּרְדֵּן
  choice: sông Giô-đanh
  rationale: Tên địa lý quen dùng trong tiếng Việt; thêm “sông” giúp câu rõ ràng và tự nhiên.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי mang nghĩa ở trước mặt hoặc trong sự hiện diện của; “trước mặt” giữ hình ảnh và liên kết với מִפָּנָיו ở cuối câu. Danh יהוה được phiên âm là “Yahweh” để giữ danh giao ước.
- source_word: עַד
  choice: cho đến khi
  rationale: Diễn đạt giới hạn thời gian trực tiếp và tự nhiên.
- source_word: הוֹרִישׁוֹ
  choice: Ngài đánh đuổi
  rationale: Dạng Hiphil của ירשׁ trong ngữ cảnh này có nghĩa khiến đối phương bị mất chỗ ở hoặc bị trục xuất. “Đánh đuổi” là cách nói hiện đại, rõ nghĩa; chú thích giữ phương án “tước quyền sở hữu”.
- source_word: אֹיְבָיו
  choice: các kẻ thù của Ngài
  rationale: Giữ đại từ sở hữu ngôi ba số ít của nguyên văn và mối liên kết với chủ thể của הוֹרִישׁוֹ.
- source_word: מִפָּנָיו
  choice: khỏi trước mặt Ngài
  rationale: Giữ sát thành ngữ chỉ sự loại bỏ khỏi trước mặt hoặc sự hiện diện của một người, đồng thời bảo tồn sự lặp lại từ ngữ với לִפְנֵי.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn đặc tính của danh riêng thay vì thay bằng một tước hiệu.
- issue: Sở chỉ của các đại từ ngôi ba số ít trong הוֹרִישׁוֹ / אֹיְבָיו / מִפָּנָיו
  choice: Các đại từ chỉ Yahweh
  alternative: Các đại từ chỉ tập thể Israel hoặc lực lượng vũ trang
  rationale: Cụm gần nhất “trước mặt Yahweh” và mô-típ chinh phục trong Ngũ Kinh ủng hộ cách hiểu Yahweh là Đấng đánh đuổi kẻ thù. Tuy nhiên, cấu trúc Hê-bơ-rơ vẫn cho phép cách hiểu khác, nên sự không chắc chắn được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc của một mệnh đề tiếp nối câu trước bằng “và”; dùng “anh em” phù hợp lời Môi-se nói với cộng đồng nam giới/chi phái mà không quá cổ kính. Viết hoa “Ngài” theo cách dùng tiếng Việt khi chỉ Đức Chúa Trời, đồng thời ghi nhận cách quy chiếu khác trong chú thích.
