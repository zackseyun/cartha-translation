  - severity: low
    issue: Cụm “mọi người được trang bị vũ khí trong anh em” thiếu tự nhiên.
    rationale: “Trong số anh em” là cách diễn đạt quan hệ thuộc nhóm tự nhiên hơn; “có vũ trang” gọn và vẫn giữ nghĩa quân sự.
  - severity: low
    issue: Cụm “khỏi trước mặt Ngài” gượng trong tiếng Việt.
    rationale: “Khỏi trước mặt mình” phù hợp cú pháp tiếng Việt hơn, đồng thời duy trì quan hệ đại từ cùng chủ thể của nguyên văn.
