id: NUM.25.18
reference: Numbers 25:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: vi
  text: Vì chúng thù nghịch với anh em bằng những mưu kế mà chúng đã dùng để lừa gạt anh em trong vụ Phê-ô và trong vụ Cô-xbi, con gái của một thủ lĩnh Ma-đi-an, chị/em gái của chúng,[b] người đã bị đánh chết vào ngày xảy ra tai dịch vì vụ Phê-ô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “bằng những thủ đoạn xảo quyệt của chúng.” Phê-ô chỉ sự việc liên quan đến Ba-anh Phê-ô được kể trước đó trong chương này.
    reason: Nêu phương án từ vựng cho “mưu kế” và giải thích sở chỉ của tên Phê-ô mà không mở rộng chính văn.
  - marker: b
    text: 'Nguyên văn: “chị/em gái của chúng”; có lẽ có nghĩa là một phụ nữ thuộc cùng dân tộc hoặc nhóm thân tộc với chúng.'
    reason: Bảo tồn cách nói thân tộc theo nguyên văn và nêu khả năng nghĩa rộng trong ngữ cảnh.
lexical_decisions:
- source_word: צֹרְרִים
  choice: thù nghịch
  rationale: Phân từ diễn tả thái độ thù địch đang tiếp diễn; cách dịch này tự nhiên và không giới hạn ý nghĩa vào chiến tranh quân sự.
- source_word: בְּנִכְלֵיהֶם
  choice: bằng những mưu kế của chúng
  rationale: Danh từ chỉ những thủ đoạn xảo quyệt, lừa dối; giới từ בְּ mang nghĩa phương tiện.
- source_word: נִכְּלוּ
  choice: đã dùng để lừa gạt
  rationale: Động từ cùng gốc với danh từ đứng trước, chỉ hành động mưu mẹo nhằm hại hoặc đánh lừa; cách diễn đạt này giữ được mối liên hệ giữa mưu kế và hành động.
- source_word: עַל דְּבַר פְּעוֹר
  choice: trong vụ Phê-ô / vì vụ Phê-ô
  rationale: Cụm từ có nghĩa 'về, trong sự việc liên quan đến'; lần cuối mang sắc thái nguyên nhân rõ hơn vì bổ nghĩa cho tai dịch.
- source_word: כָּזְבִּי
  choice: Cô-xbi
  rationale: Phiên âm tên riêng theo cách đọc dễ hiểu trong tiếng Việt.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: con gái một thủ lĩnh Ma-đi-an
  rationale: נָשִׂיא chỉ người đứng đầu hay thủ lĩnh; 'thủ lĩnh' tránh hàm ý tước vị quân chủ của 'hoàng tử'.
- source_word: אֲחֹתָם
  choice: người chị em của chúng
  rationale: Giữ sát hình ảnh thân tộc của nguyên văn, đồng thời chú thích rằng cách nói này có thể chỉ một phụ nữ thuộc cùng dân tộc hoặc nhóm thân tộc.
- source_word: הַמֻּכָּה
  choice: đã bị đánh chết
  rationale: Dạng bị động của נכה mang hình ảnh 'bị đánh hạ'; trong ngữ cảnh Cô-xbi thực sự bị giết, 'đánh chết' vừa rõ nghĩa vừa giữ nét động từ.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: vào ngày xảy ra tai dịch
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ mốc thời gian cụ thể của nguyên văn.
theological_decisions:
- issue: Sở chỉ của 'Phê-ô'
  choice: Giữ tên riêng 'Phê-ô' trong chính văn và giải thích bằng chú thích.
  alternative: Mở rộng thành 'Ba-anh Phê-ô'.
  rationale: Nguyên văn chỉ ghi Phê-ô; việc thêm Ba-anh sẽ làm rõ nhưng vượt quá hình thức của bản nguồn.
- issue: Sắc thái của hai lần xuất hiện cụm עַל דְּבַר פְּעוֹר
  choice: Lần đầu dịch 'trong vụ Phê-ô', lần cuối dịch 'vì vụ Phê-ô'.
  alternative: Dùng cùng một cách dịch ở cả hai chỗ.
  rationale: Cụm Hê-bơ-rơ cho phép cả sắc thái liên quan và nguyên nhân; ngữ cảnh lần cuối gắn vụ Phê-ô với nguyên nhân của tai dịch.
- issue: Ý nghĩa của אֲחֹתָם
  choice: Giữ nghĩa đen 'người chị em của chúng' và nêu nghĩa thân tộc rộng hơn trong chú thích.
  alternative: Dịch thẳng là 'người cùng dân tộc với chúng' hoặc 'người bà con của chúng'.
  rationale: Nguyên văn giữ ngôn ngữ gia đình nhưng có thể dùng theo nghĩa cộng đồng; chú thích bảo tồn sự mơ hồ chân thực.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng 'anh em' cho đại từ số nhiều hướng đến cộng đồng Y-sơ-ra-ên; dùng 'chúng' cho dân Ma-đi-an để duy trì sự phân biệt giữa hai nhóm. Các tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
