revisions:
- from: 'Giao ước ấy sẽ dành cho người và dòng dõi người sau này: một giao ước về chức tế lễ đời đời, vì người đã nhiệt thành vì Đức Chúa Trời của mình[a] và làm lễ chuộc tội cho con cái Y-sơ-ra-ên[b].'
  to: Điều ấy sẽ là một giao ước về chức tế lễ đời đời[a] cho người và dòng dõi người về sau, vì người đã nhiệt thành vì Đức Chúa Trời của mình[b] và thực hiện sự chuộc tội cho con cái Y-sơ-ra-ên[c].
  rationale: Bản sửa giữ nguyên các quan hệ cú pháp và ý nghĩa của tiếng Hê-bơ-rơ, đồng thời loại bỏ hàm ý về một nghi lễ riêng lẻ trong động từ “chuộc tội.” Cấu trúc đầu câu được làm tự nhiên hơn mà không xác định quá mức chủ thể ngầm. Chú thích về “đời đời” bảo tồn phương án dịch hợp lý cho עוֹלָם.
  reviewer_model: gpt-5.6-terra
