base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: vi
  text: Điều ấy sẽ là một giao ước về chức tế lễ đời đời[a] cho người và dòng dõi người về sau, vì người đã nhiệt thành vì Đức Chúa Trời của mình[b] và thực hiện sự chuộc tội cho con cái Y-sơ-ra-ên[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chức tế lễ vĩnh viễn.” Từ Hê-bơ-rơ có thể chỉ sự bền vững, tiếp nối lâu dài của một định chế.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đã ghen tương vì Đức Chúa Trời của mình.” Động từ Hê-bơ-rơ có thể diễn tả lòng nhiệt thành hoặc sự ghen tương nhằm bảo vệ lòng trung thành độc hữu trong giao ước.'
    reason: lexical_alternative
  - marker: c
    text: “Con cái Y-sơ-ra-ên” là danh xưng dân tộc truyền thống trong tiếng Hê-bơ-rơ, chỉ dân Y-sơ-ra-ên nói chung.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Giao ước ấy sẽ dành
  rationale: Động từ giống cái số ít hướng đến בְּרִית (giao ước); nêu rõ chủ thể trong tiếng Việt giúp câu tự nhiên và tránh đại từ mơ hồ.
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: cho người và dòng dõi người sau này
  rationale: “Dòng dõi” giữ được nghĩa tập thể số ít của זֶרַע và ý niệm kế tục; “người” là cách xưng trang trọng trong văn cảnh.
- source_word: בְּרִית
  choice: giao ước
  rationale: Đây là thuật ngữ tiếng Việt chuẩn cho một cam kết mang tính ràng buộc giữa Đức Chúa Trời và con người.
- source_word: כְּהֻנַּת עוֹלָם
  choice: về chức tế lễ đời đời
  rationale: Cụm từ chỉ nội dung của giao ước. “Đời đời” diễn đạt tính bền vững, tiếp nối của chức vụ mà không buộc phải giải quyết phạm vi thời gian theo nghĩa siêu hình.
- source_word: תַּחַת אֲשֶׁר
  choice: vì
  rationale: Trong ngữ cảnh này, cụm từ nêu căn cứ của việc ban giao ước; “vì” ngắn gọn và tự nhiên.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: nhiệt thành vì Đức Chúa Trời của mình
  rationale: קנא có thể diễn tả lòng sốt sắng hoặc ghen tương trong ý nghĩa bảo vệ sự độc tôn giao ước. “Nhiệt thành” tự nhiên hơn trong tiếng Việt, còn sắc thái “ghen tương” được giữ ở chú thích.
- source_word: וַיְכַפֵּר
  choice: làm lễ chuộc tội
  rationale: כפר trong văn cảnh tư tế chỉ hành động thực hiện sự chuộc tội. “Làm lễ chuộc tội” dễ hiểu và vẫn giữ sắc thái nghi lễ.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: cho con cái Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” là cách gọi dân tộc truyền thống, sát với cấu trúc Hê-bơ-rơ và trong tiếng Việt có thể bao hàm toàn dân.
theological_decisions:
- issue: Sắc thái của קנא đối với hành động của Phi-nê-a
  choice: nhiệt thành vì Đức Chúa Trời của mình
  alternative: ghen tương vì Đức Chúa Trời của mình
  rationale: Động từ có thể chỉ cả lòng sốt sắng lẫn sự ghen tương giao ước. Bản chính dùng cách nói tự nhiên, không dễ bị hiểu thành đố kỵ cá nhân; chú thích bảo tồn sắc thái từ nguyên và thần học.
- issue: Hiệu lực thời gian của עוֹלָם trong lời hứa về chức tế lễ
  choice: chức tế lễ đời đời
  alternative: chức tế lễ vĩnh viễn
  rationale: “Đời đời” bảo tồn sức nặng của lời hứa về sự tiếp nối lâu dài nhưng không tự ý định nghĩa thuật ngữ theo một hệ thống thần học cụ thể.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: Cách dịch chính giữ hình thức danh xưng truyền thống gần nguyên văn; chú thích làm rõ rằng cụm từ chỉ toàn thể dân tộc chứ không chỉ nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “người” để chỉ Phi-nê-a nhằm phù hợp giọng văn Kinh Thánh; dùng “Đức Chúa Trời” cho אֱלֹהִים. Trật tự câu được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt nhưng vẫn giữ quan hệ giữa giao ước, chức tế lễ và căn cứ ban lời hứa.
