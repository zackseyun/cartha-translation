  - severity: low
    issue: Mở đầu câu lặp “giao ước” và có kết cấu Việt ngữ chưa gọn.
    rationale: 'Cụm “Giao ước ấy sẽ dành cho ...: một giao ước ...” làm câu nặng nề. Cách “Điều ấy sẽ là một giao ước ... cho ...” tái hiện tốt hơn cấu trúc vị ngữ của tiếng Hê-bơ-rơ.'
  - severity: low
    issue: Chưa có chú thích cho lựa chọn dịch עוֹלָם là “đời đời.”
    rationale: “Đời đời” là lựa chọn có thể chấp nhận, nhưng עוֹלָם trong lời hứa về một định chế cũng có thể được hiểu/dịch là “vĩnh viễn” hoặc “lâu dài.” Chú thích giúp giữ độ mở của từ nguồn.
