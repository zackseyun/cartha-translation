  naturalness: Văn phong nhìn chung hiện đại, trang trọng và dễ hiểu. “Cháu của thầy tế lễ A-rôn” là cách làm sáng rõ quan hệ gia phả cho độc giả Việt mà không đổi ý nghĩa. Cụm cần sửa là “nhiệt thành bằng ... lòng nhiệt thành”, vì cấu trúc này gượng trong tiếng Việt.
  terminology: “Thầy tế lễ,” “cơn thịnh nộ,” “con cái Y-sơ-ra-ên,” và đại từ “Ta” phù hợp văn phong Kinh Thánh tiếng Việt. Giữ nhất quán “nhiệt thành / lòng nhiệt thành” là một lựa chọn khả dĩ cho קנא / קנאה; chú thích nên nêu phương án “ghen / lòng ghen” bằng một câu tiếng Việt tự nhiên hơn.
