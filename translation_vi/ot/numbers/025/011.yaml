reference: Numbers 25:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: vi
  text: Phi-nê-a, con của Ê-lê-a-sa, cháu của thầy tế lễ A-rôn, đã khiến cơn thịnh nộ của Ta lìa khỏi con cái Y-sơ-ra-ên, vì giữa họ người đã hành động với lòng nhiệt thành của Ta; vì thế, Ta đã không tiêu diệt con cái Y-sơ-ra-ên trong lòng nhiệt thành của Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “vì giữa họ người đã ghen với lòng ghen của Ta ... trong lòng ghen của Ta.” Tiếng Hê-bơ-rơ dùng các dạng cùng gốc từ cho hành động của Phi-nê-a và lòng nhiệt thành của Đức Chúa Trời.'
    reason: Nêu phương án từ vựng “ghen / lòng ghen” và giải thích phép lặp đồng nguyên của nguyên văn.
lexical_decisions:
- source_word: הֵשִׁיב אֶת חֲמָתִי מֵעַל
  choice: đã khiến cơn thịnh nộ của Ta lìa khỏi
  rationale: Diễn đạt thể Hiphil mang nghĩa khiến cơn thịnh nộ quay đi hoặc được cất khỏi Israel; cách nói này tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh cơn thịnh nộ đang đè trên dân.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ thành ngữ giao ước theo sát hình thức Hê-bơ-rơ, đồng thời trong tiếng Việt cụm từ này có thể chỉ toàn thể cộng đồng Israel.
- source_word: בְּקַנְאוֹ אֶת קִנְאָתִי
  choice: người đã nhiệt thành bằng chính lòng nhiệt thành của Ta
  rationale: Giữ mối liên hệ đồng nguyên giữa hành động của Phi-nê-a và phẩm tính của Đức Chúa Trời. Từ “chính” làm rõ rằng lòng nhiệt thành ấy tương ứng với lòng nhiệt thành của chính Đức Chúa Trời.
- source_word: בְּתוֹכָם
  choice: ngay giữa họ
  rationale: Truyền đạt rõ việc Phi-nê-a hành động ở giữa cộng đồng; “ngay” nhấn nhẹ vị trí mà không thêm ý nghĩa mới.
- source_word: וְלֹא כִלִּיתִי
  choice: Ta đã không tiêu diệt
  rationale: Động từ Piel của כלה trong văn cảnh này chỉ sự hủy diệt hoàn toàn. “Tiêu diệt” rõ nghĩa và tự nhiên hơn “thiêu nuốt” trong tiếng Việt hiện đại.
- source_word: בְּקִנְאָתִי
  choice: trong lòng nhiệt thành của Ta
  rationale: Lặp lại cùng cách dịch với קִנְאָתִי ở vế trước để bảo toàn phép lặp có chủ ý của nguyên văn.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Danh hiệu chỉ A-rôn được chuyển bằng thuật ngữ Kinh Thánh quen thuộc, dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của קנא / קִנְאָה khi nói về Phi-nê-a và Đức Chúa Trời
  choice: nhiệt thành / lòng nhiệt thành
  alternative: ghen / lòng ghen
  rationale: Trong văn cảnh, từ này diễn tả sự sốt sắng quyết liệt cho lòng trung thành giao ước. “Nhiệt thành” tự nhiên và trang trọng hơn trong tiếng Việt, đồng thời tránh hàm ý ghen tuông nhỏ nhen; phương án “ghen” vẫn có cơ sở vì gốc từ có thể diễn tả lòng ghen mang tính giao ước, nên được ghi ở chú thích.
- issue: Quan hệ gia phả trong בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: con của Ê-lê-a-sa, cháu của thầy tế lễ A-rôn
  alternative: con của Ê-lê-a-sa, con của thầy tế lễ A-rôn
  rationale: Tiếng Hê-bơ-rơ lặp từ “con”, nhưng tiếng Việt cần dùng “cháu” ở quan hệ thứ hai để tránh hiểu lầm Phi-nê-a là con trực tiếp của cả Ê-lê-a-sa lẫn A-rôn. Nội dung gia phả không thay đổi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng đại từ “Ta” cho lời Đức Chúa Trời và “người” cho Phi-nê-a. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Bản dịch ưu tiên sự tự nhiên nhưng giữ phép lặp thần học của קנא / קִנְאָה.
