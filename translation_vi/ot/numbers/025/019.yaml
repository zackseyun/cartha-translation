  text: And it happened after the plague[a].
translation:
  language: vi
  text: Và sau trận dịch, có chuyện xảy ra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Sau trận dịch, có chuyện xảy ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (thể hiện qua cấu trúc chuyển tiếp “Sau…,”)
  rationale: Dạng wayyiqtol của היה ở đây là công thức chuyển tiếp trần thuật. Trong tiếng Việt hiện đại, mở đầu bằng “Sau…” tự nhiên hơn lối dịch sát chữ “Và đã xảy ra,” đồng thời vẫn giữ chức năng dẫn sang câu chuyện tiếp theo.
- source_word: אַחֲרֵי
  choice: Sau
  rationale: Giới từ này trực tiếp chỉ trình tự thời gian; “Sau” là cách diễn đạt ngắn gọn và tự nhiên.
- source_word: הַמַּגֵּפָה
  choice: trận dịch
  rationale: מַגֵּפָה chỉ tai họa gây chết chóc, trong ngữ cảnh này là dịch bệnh như một sự phán xét. “Trận dịch” rõ nghĩa và phù hợp với cách dùng tiếng Việt.
theological_decisions:
- issue: Công thức trần thuật trong một câu chuyển tiếp ngắn
  choice: Dịch thành mệnh đề chuyển tiếp “Sau trận dịch,” và giữ dấu phẩy để nối về ý nghĩa với phần tiếp theo.
  alternative: 'Dịch thành câu độc lập: “Và chuyện xảy ra sau trận dịch.”'
  rationale: Bản Hê-bơ-rơ tại vị trí này chỉ có một công thức chuyển tiếp và dấu phân đoạn; trong truyền thống đánh số câu phổ biến, cụm này thường gắn cú pháp với phần tiếp theo. Cách dịch bằng mệnh đề thời gian giữ đúng chức năng chuyển tiếp mà không thêm một biến cố không được nêu rõ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng tự nhiên. Vì câu Hê-bơ-rơ là một đoạn chuyển tiếp rất ngắn, bản dịch cố ý giữ dạng chưa khép ý bằng dấu phẩy; dấu chú thích [a] xuất hiện đầy đủ trong chính văn.
