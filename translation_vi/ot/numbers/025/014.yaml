revisions:
- from: Tên người đàn ông Y-sơ-ra-ên đã bị đánh chết[a], người đã bị đánh chết cùng với người nữ Ma-đi-an, là Xim-ri, con trai Sa-lu, một thủ lĩnh của một gia tộc phụ hệ trong chi tộc Si-mê-ôn.[b]
  to: Tên của người đàn ông Y-sơ-ra-ên bị đánh chết[a], người đã bị đánh chết cùng với người phụ nữ Ma-đi-an, là Xim-ri, con trai Sa-lu, một thủ lĩnh của một gia tộc phụ hệ[b] trong chi tộc Si-mê-ôn.
  rationale: Chỉ điều chỉnh cách diễn đạt cho tự nhiên hơn và dời neo chú thích [b] đến đúng thuật ngữ được giải thích. Bản sửa vẫn giữ sự lặp lại có chủ ý của động từ nguyên ngữ, quan hệ “bị giết cùng với,” và các thuật ngữ xã hội-bộ lạc của câu.
