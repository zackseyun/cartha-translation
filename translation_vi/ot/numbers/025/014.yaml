  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: vi
  text: Tên của người đàn ông Y-sơ-ra-ên bị đánh chết[a], người đã bị đánh chết cùng với người phụ nữ Ma-đi-an, là Xim-ri, con trai Sa-lu, một thủ lĩnh của một gia tộc phụ hệ[b] trong chi tộc Si-mê-ôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “người đàn ông Y-sơ-ra-ên bị đánh chết, người đã bị đánh chết cùng với người phụ nữ Ma-đi-an.” Tiếng Hê-bơ-rơ lặp lại động từ để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: “Gia tộc phụ hệ” là một đơn vị gia đình hoặc thị tộc trong chi tộc, được xác định theo dòng cha.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: Tên
  rationale: Danh từ cùng liên từ mở đầu phần nhận diện nhân vật; tiếng Việt không cần thêm một từ chỉ thời gian như “bấy giờ”.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: người đàn ông Y-sơ-ra-ên
  rationale: Giữ rõ cả căn tính Y-sơ-ra-ên và giống đực số ít của nguyên văn.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: đã bị đánh chết ... người đã bị đánh chết
  rationale: Giữ sự lặp lại có chủ ý của hai dạng động từ נכה, đồng thời diễn đạt rõ kết quả tử vong trong ngữ cảnh.
- source_word: אֶת הַמִּדְיָנִית
  choice: cùng với người nữ Ma-đi-an
  rationale: 'Trong cấu trúc này, אֶת mang ý nghĩa đồng hành: ông bị giết cùng người nữ Ma-đi-an; danh từ “người nữ” làm rõ tính âm giống cái số ít.'
- source_word: זִמְרִי בֶּן סָלוּא
  choice: Xim-ri, con trai Sa-lu
  rationale: Phiên âm tên riêng sang dạng dễ đọc trong tiếng Việt và giữ quan hệ phụ tử.
- source_word: נְשִׂיא
  choice: một thủ lĩnh
  rationale: Diễn đạt địa vị lãnh đạo mà không gợi sai sắc thái hoàng tộc của từ “hoàng tử”.
- source_word: בֵית אָב
  choice: một gia tộc phụ hệ
  rationale: Truyền đạt thuật ngữ xã hội chỉ đơn vị gia đình hoặc thị tộc được xác định theo dòng cha, tự nhiên hơn lối dịch sát chữ “nhà của cha”.
- source_word: לַשִּׁמְעֹנִי
  choice: trong chi tộc Si-mê-ôn
  rationale: Nêu rõ đơn vị phụ hệ này thuộc về chi tộc Si-mê-ôn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên sự lặp động từ của tiếng Hê-bơ-rơ, nhưng dùng “đánh chết” để làm rõ bạo lực dẫn đến cái chết. Tên riêng được phiên âm nhất quán theo cách đọc tiếng Việt.
