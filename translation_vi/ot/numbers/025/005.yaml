source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל שֹׁפְטֵ֖י יִשְׂרָאֵ֑ל הִרְגוּ֙ אִ֣ישׁ אֲנָשָׁ֔י/ו הַ/נִּצְמָדִ֖ים לְ/בַ֥עַל פְּעֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: vi
  text: 'Môi-se nói với các thẩm phán của Y-sơ-ra-ên: “Mỗi người trong các ông phải giết những người nam thuộc quyền mình đã gắn bó với Ba-anh Phê-ô.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “Ba-anh của Phê-ô.” Câu Hê-bơ-rơ theo sát nghĩa là: “Hãy giết, mỗi người, những người của mình,” tức mỗi thẩm phán phải giết những người nam thuộc quyền mình đã gắn bó với Ba-anh Phê-ô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: các thẩm phán
  rationale: Danh từ chỉ những người thực thi quyền xét xử và cai quản trong Y-sơ-ra-ên; “các thẩm phán” là cách dịch trực tiếp và phù hợp ngữ cảnh.
- source_word: הִרְגוּ
  choice: phải giết
  rationale: Mệnh lệnh số nhiều truyền đạt một chỉ thị dứt khoát. “Phải giết” giữ nguyên mức độ nghiêm khắc mà không thêm sắc thái pháp lý cụ thể như “hành quyết”.
- source_word: אִישׁ אֲנָשָׁיו
  choice: Mỗi người trong các ông ... những người thuộc quyền mình
  rationale: Cấu trúc phân phối theo sát nghĩa là “mỗi người, những người của mình,” tức mỗi thẩm phán phải xử những người thuộc phạm vi trách nhiệm của mình. Cách diễn đạt này tự nhiên trong tiếng Việt và tránh ngộ nhận về sở hữu.
- source_word: הַנִּצְמָדִים
  choice: đã gắn bó
  rationale: Phân từ Niphal của צמד diễn tả việc gắn hay kết chặt với một đối tượng. “Đã gắn bó” truyền đạt sự tự nguyện liên kết với thần tượng mà không giải thích quá mức hình ảnh gốc.
- source_word: לְבַעַל פְּעוֹר
  choice: với Ba-anh Phê-ô
  rationale: Cụm từ gọi tên thần Ba-anh gắn với Phê-ô. Dạng “Ba-anh Phê-ô” bảo lưu trực tiếp tên ghép trong tiếng Hê-bơ-rơ; chú thích nêu cách hiểu quan hệ địa danh.
theological_decisions:
- issue: Tính chất của lệnh giết
  choice: Trình bày thẳng lệnh của Môi-se rằng các thẩm phán phải giết những người phạm tội thuộc quyền mình.
  alternative: Dùng “hành quyết” để nhấn mạnh hình phạt tư pháp, hoặc diễn giải đây là sự phán xét giao ước.
  rationale: Câu này đưa ra mệnh lệnh trực tiếp nhưng không mô tả thủ tục pháp lý hay ý nghĩa nghi lễ. Bản dịch giữ nguyên sự nghiêm khắc mà không thêm khung thần học hoặc pháp lý không được nói rõ.
- issue: Phạm vi chỉ định của אִישׁ אֲנָשָׁיו
  choice: 'Giữ ý phân phối: mỗi thẩm phán phải xử những người nam thuộc quyền mình.'
  alternative: Dịch chung là “mọi người dưới quyền các ông,” có thể làm mờ hình thức giống đực của nguyên văn.
  rationale: Nguyên văn dùng danh từ giống đực và trong ngữ cảnh nói đến những người nam phạm tội; cách dịch chính phản ánh điều đó nhưng diễn đạt tự nhiên bằng tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se,” “Y-sơ-ra-ên,” “Ba-anh” và “Phê-ô” theo lối phiên âm Kinh Thánh quen thuộc; không thêm thuật ngữ giáo phái hay giải thích giáo lý vào chính văn.
