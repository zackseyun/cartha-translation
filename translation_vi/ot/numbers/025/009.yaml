  text: וַ/יִּהְי֕וּ הַ/מֵּתִ֖ים בַּ/מַּגֵּפָ֑ה אַרְבָּעָ֥ה וְ/עֶשְׂרִ֖ים אָֽלֶף׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/009.yaml
  text: And those who died in the plague were twenty-four thousand.
translation:
  language: vi
  text: Số người chết trong trận dịch là hai mươi bốn ngàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Động từ היה ở đây làm chức năng liên kết để nêu tổng số; “là” tự nhiên và chính xác trong câu thống kê tiếng Việt.
- source_word: הַמֵּתִים
  choice: số người chết
  rationale: Phân từ của מות chỉ những người đã chết. “Số người chết” vừa tự nhiên trong tiếng Việt vừa phù hợp với việc câu đang nêu tổng số.
- source_word: בַּמַּגֵּפָה
  choice: trong trận dịch
  rationale: מַגֵּפָה là một trận dịch gây chết người; giới từ ב có thể chỉ hoàn cảnh hay biến cố mà họ chết trong đó. Cách dịch này giữ gần cấu trúc Hê-bơ-rơ và không buộc phải xác định sắc thái tác nhân như “vì trận dịch”.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: hai mươi bốn ngàn
  rationale: Đây là cách diễn đạt số 24.000 theo trật tự tự nhiên của tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, thích hợp với một câu tường thuật thống kê. Dùng “trận dịch” để diễn tả một biến cố dịch bệnh cụ thể; dùng “ngàn” là cách nói phổ thông, rõ nghĩa trong tiếng Việt hiện đại.
