  text: לָ/כֵ֖ן אֱמֹ֑ר הִנְנִ֨/י נֹתֵ֥ן ל֛/וֹ אֶת בְּרִיתִ֖/י שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: vi
  text: 'Vì vậy, hãy nói: ‘Này, ta ban cho người ấy giao ước bình an của ta.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Vì vậy
  rationale: Diễn đạt trực tiếp quan hệ kết luận/hệ quả của từ Hê-bơ-rơ.
- source_word: הִנְנִי
  choice: Này, ta
  rationale: Giữ sắc thái trình hiện và nhấn mạnh của הִנְנִי trong lời Đức Chúa Trời, đồng thời dùng cách nói trang trọng, tự nhiên trong tiếng Việt.
- source_word: נֹתֵן לוֹ
  choice: ban cho người ấy
  rationale: Động từ נֹתֵן ở ngữ cảnh này chỉ hành động trao ban; “ban” phù hợp với chủ thể là Đức Chúa Trời, còn “người ấy” giữ đại từ ngôi ba số ít.
- source_word: בְּרִיתִי שָׁלוֹם
  choice: giao ước bình an của ta
  rationale: Giữ sát cấu trúc nguồn và không tự ý giải quyết quan hệ ngữ nghĩa có thể được hiểu là giao ước đem lại/thiết lập bình an.
theological_decisions:
- issue: Quan hệ giữa “giao ước” và “bình an” trong בְּרִיתִי שָׁלוֹם
  choice: giao ước bình an của ta
  alternative: giao ước về sự bình an của ta / giao ước đem lại bình an của ta
  rationale: Bản dịch chính giữ cách diễn đạt cô đọng và độ mở của nguyên ngữ, không thêm quan hệ giải thích mà câu Hê-bơ-rơ không nêu rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; duy trì lời nói trực tiếp của Đức Chúa Trời với đại từ “ta”. Không cần chú thích cho câu này.
