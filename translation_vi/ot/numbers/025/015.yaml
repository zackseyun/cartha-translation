  text: וְ/שֵׁ֨ם הָֽ/אִשָּׁ֧ה הַ/מֻּכָּ֛ה הַ/מִּדְיָנִ֖ית כָּזְבִּ֣י בַת צ֑וּר רֹ֣אשׁ אֻמּ֥וֹת בֵּֽית אָ֛ב בְּ/מִדְיָ֖ן הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: vi
  text: Tên người phụ nữ Ma-đi-an bị giết là Cô-xbi, con gái Xu-rơ. Ông là người đứng đầu các thị tộc của một nhà cha[a] ở Ma-đi-an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen trong tiếng Hebrew là “nhà của cha”, một thuật ngữ thân tộc chỉ đại gia đình hoặc hộ gia đình cùng tổ tiên.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “các dân của một nhà cha ở Ma-đi-an”. Từ Hebrew ở đây có thể chỉ “các dân” hoặc, trong ngữ cảnh thân tộc này, các nhóm thị tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: Tên
  rationale: Mở đầu câu bằng “Tên” diễn đạt tự nhiên trong tiếng Việt; quan hệ nối tiếp với câu trước được ngữ cảnh bảo toàn mà không cần thêm “Và” một cách gượng ép.
- source_word: הָאִשָּׁה הַמֻּכָּה הַמִּדְיָנִית
  choice: người phụ nữ Ma-đi-an bị đánh chết
  rationale: Giữ dân tộc tính từ và hình ảnh của phân từ thụ động נכה; “bị đánh chết” vừa phản ánh hành động đánh vừa phù hợp với kết quả đã nêu trong ngữ cảnh.
- source_word: כָּזְבִּי בַת צ֑וּר
  choice: Cô-xbi, con gái Xu-rơ
  rationale: Phiên âm tên riêng theo âm Hebrew và dịch minh bạch quan hệ huyết thống của cấu trúc liên kết.
- source_word: רֹאשׁ
  choice: người đứng đầu
  rationale: Diễn đạt tự nhiên chức vị lãnh đạo hàm chứa trong nghĩa đen “đầu”; đại từ הוּא quy chiếu về Xu-rơ nên dùng “Ông” ở đầu câu sau.
- source_word: אֻמּוֹת
  choice: các thị tộc
  rationale: Trong ngữ cảnh cơ cấu thân tộc, “các thị tộc” phù hợp hơn “các dân”, nhưng chú thích vẫn bảo lưu khả năng từ này mang nghĩa “các dân” hoặc các nhóm dân.
- source_word: בֵּית אָב
  choice: một gia tộc phụ hệ
  rationale: Truyền đạt thuật ngữ thân tộc Hebrew theo cách người đọc hiện đại dễ hiểu, đồng thời chú thích nêu nghĩa đen “nhà của cha”.
- source_word: בְּמִדְיָן
  choice: ở Ma-đi-an
  rationale: Giới từ בְּ được hiểu theo nghĩa địa điểm, là cách đọc tự nhiên nhất trong câu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tách thành hai câu để đại từ הוּא quy chiếu rõ về Xu-rơ, tránh khiến người đọc tưởng Cô-xbi là người đứng đầu. Các tên riêng được phiên âm nhất quán theo dạng Hebrew.
