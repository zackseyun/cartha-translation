  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: vi
  text: Kìa, một người trong số con cái Ít-ra-ên đến và đưa một phụ nữ Ma-đi-an đến gần anh em mình[a], trước mắt Môi-se và trước mắt toàn thể hội chúng con cái Ít-ra-ên, trong khi họ đang khóc tại lối vào Lều Hội Kiến.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “anh em mình”; cũng có thể hiểu là “bà con mình” hoặc “đồng bào Ít-ra-ên của mình.”'
    reason: lexical_alternative
  - marker: b
    text: “Lều Hội Kiến” cũng có thể dịch là “Lều Gặp Gỡ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ sức mạnh của dấu hiệu diễn ngôn, đột ngột hướng sự chú ý đến một hành động gây sửng sốt.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: trong con cái Ít-ra-ên
  rationale: Giữ hình ảnh thân tộc của tiếng Hê-bơ-rơ, đồng thời dùng cách nói Kinh Thánh quen thuộc và dễ hiểu trong tiếng Việt.
- source_word: וַיַּקְרֵב
  choice: dẫn ... lại gần
  rationale: Diễn đạt thể khiến của קרב, nghĩa là làm cho đến gần; với một người làm bổ ngữ, “dẫn ... lại gần” tự nhiên hơn “đem ... lại gần”.
- source_word: אֶל־אֶחָיו
  choice: anh em mình
  rationale: Giữ từ thân tộc theo sát nguyên văn; chú thích nêu rõ trong ngữ cảnh có thể chỉ những người cùng dân tộc.
- source_word: הַמִּדְיָנִית
  choice: một phụ nữ Ma-đi-an
  rationale: Tính từ giống cái được dùng như danh từ; thêm “phụ nữ” cho rõ nghĩa. Dùng “một” khi nhân vật được đưa vào câu chuyện lần đầu là tự nhiên trong tiếng Việt.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: ngay trước mắt ... và trước mắt
  rationale: Giữ sự lặp lại và nhấn mạnh tính công khai, trắng trợn của hành động; “ngay” làm rõ sắc thái nổi bật mà không thêm cách giải thích động cơ.
- source_word: כָּל־עֲדַת בְּנֵי־יִשְׂרָאֵל
  choice: toàn thể hội chúng con cái Ít-ra-ên
  rationale: “Hội chúng” biểu đạt cộng đồng giao ước đang nhóm họp; “toàn thể” chuyển tải כָּל.
- source_word: וְהֵמָּה בֹכִים
  choice: trong khi họ đang khóc
  rationale: Thể hiện hành động đang tiếp diễn làm nền, đồng thời xảy ra với việc người đàn ông dẫn người phụ nữ đến.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: tại cửa Lều Hội Kiến
  rationale: Cách gọi ngắn gọn, trang trọng và quen thuộc cho địa điểm thánh; “cửa” chỉ lối vào chứ không nhất thiết là một cánh cửa vật chất.
theological_decisions:
- issue: Ngôn ngữ thân tộc trong בְּנֵי יִשְׂרָאֵל và אֶחָיו
  choice: Giữ “con cái Ít-ra-ên” và “anh em mình” trong chính văn
  alternative: “người Ít-ra-ên” và “đồng bào mình”
  rationale: Nguyên văn dùng các thuật ngữ thân tộc. Bản dịch giữ hình ảnh ấy, nhưng chú thích cho biết phạm vi ngữ cảnh của “anh em” có thể là đồng bào hay những người cùng dân Ít-ra-ên.
- issue: Chủ thể của “họ đang khóc”
  choice: Giữ đại từ “họ” như nguyên văn
  alternative: Nói rõ “hội chúng đang khóc”
  rationale: Tiếng Hê-bơ-rơ dùng đại từ số nhiều; dù ngữ cảnh hướng về hội chúng, không cần thay đại từ bằng một diễn giải xác định hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ nhịp kể đột ngột của “Kìa”, sự lặp lại “trước mắt”, cùng ngôn ngữ thân tộc của nguyên văn, nhưng điều chỉnh trật tự từ cho tự nhiên trong tiếng Việt.
