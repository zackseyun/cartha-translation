revisions:
- from: Kìa, một người trong con cái Ít-ra-ên đến, dẫn một phụ nữ Ma-đi-an lại gần anh em mình[a], ngay trước mắt Môi-se và trước mắt toàn thể hội chúng con cái Ít-ra-ên, trong khi họ đang khóc tại cửa Lều Hội Kiến.[b]
  to: Kìa, một người trong số con cái Ít-ra-ên đến và đưa một phụ nữ Ma-đi-an đến gần anh em mình[a], trước mắt Môi-se và trước mắt toàn thể hội chúng con cái Ít-ra-ên, trong khi họ đang khóc tại lối vào Lều Hội Kiến.[b]
  rationale: Sửa tối thiểu để câu tiếng Việt tự nhiên hơn và để động từ “đưa ... đến gần” phản ánh đầy đủ, trung tính nghĩa của וַיַּקְרֵב. Giữ nguyên sự lặp lại “trước mắt,” ngôn ngữ thân tộc, đại từ số nhiều mơ hồ “họ,” và thuật ngữ địa điểm thánh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:34:24Z'
