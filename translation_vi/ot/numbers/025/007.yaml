  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: vi
  text: Khi Phi-nê-a, con trai Ê-lê-a-sa, cháu của tư tế A-rôn, thấy việc ấy[a], ông đứng dậy từ giữa hội chúng[b] và cầm một ngọn giáo trong tay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thấy điều này” hoặc chỉ “thấy”. Bản Hê-bơ-rơ không nêu đối tượng của động từ; đối tượng được hiểu từ ngữ cảnh ngay trước đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “từ trong hội chúng” hoặc “từ giữa cộng đồng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy việc ấy
  rationale: Động từ Hê-bơ-rơ chỉ nói “thấy”, không nêu bổ ngữ; tiếng Việt tự nhiên cần bổ sung đối tượng được hàm ý từ sự việc ở câu trước. Chú thích bảo lưu cách diễn đạt sát mặt chữ.
- source_word: פִּינְחָס
  choice: Phi-nê-a
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: con trai Ê-lê-a-sa, cháu của tư tế A-rôn
  rationale: Diễn đạt quan hệ phả hệ tự nhiên trong tiếng Việt; “tư tế” phản ánh הַכֹּהֵן mà không thêm ý “thượng tế” vốn không có trong câu Hê-bơ-rơ.
- source_word: וַיָּקָם
  choice: ông đứng dậy
  rationale: Thể hiện hành động đứng lên để hành động tiếp theo, tự nhiên và rõ ràng trong văn kể chuyện tiếng Việt.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: từ giữa hội chúng
  rationale: “Từ giữa” phản ánh מִתּוֹךְ, còn “hội chúng” diễn tả cộng đồng đang tụ họp; chú thích nêu cách dịch tự nhiên tương đương.
- source_word: וַיִּקַּח
  choice: và cầm
  rationale: Trong ngữ cảnh lấy một vũ khí vào tay, “cầm” tự nhiên hơn lối dịch máy móc “lấy”, mà không gia tăng sắc thái mạnh như “chộp lấy”.
- source_word: רֹמַח
  choice: một ngọn giáo
  rationale: “Giáo” là từ phổ thông và bao quát phù hợp cho loại vũ khí cán dài này; loại từ “ngọn” tạo cách nói tự nhiên trong tiếng Việt.
- source_word: בְּיָדוֹ
  choice: trong tay
  rationale: Giữ hình ảnh trực tiếp của thành ngữ Hê-bơ-rơ và diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch הָעֵדָה
  choice: hội chúng
  alternative: cộng đồng; đoàn dân đang tụ họp
  rationale: “Hội chúng” giữ được ý nghĩa tập thể của dân Y-sơ-ra-ên đang tụ họp trong Ngũ Kinh mà không đồng nhất thuật ngữ này với một cơ cấu giáo hội về sau.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “tư tế” theo nghĩa chức vụ trong văn cảnh cổ đại; giữ cấu trúc phả hệ nhưng chuyển “con của con” thành “con trai… cháu của…” cho tự nhiên trong tiếng Việt. Các dấu chú thích [a], [b] đều được đặt đúng tại cụm từ liên quan trong chính văn.
