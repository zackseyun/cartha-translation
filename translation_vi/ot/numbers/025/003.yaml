  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: vi
  text: Israel đã gắn mình với Ba-anh Phê-ô[a], và cơn giận của Yahweh bừng lên chống lại Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Israel tự buộc mình vào Ba-anh Phê-ô” hoặc “Israel gắn mình với Ba-anh của Phê-ô.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: gắn mình với
  rationale: Động từ צמד ở thể Niphal diễn tả việc gắn kết chặt chẽ. “Gắn mình với” giữ được sắc thái phản thân và sự liên kết mang tính thờ thần tượng, nhưng không diễn giải quá mức.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Giữ dạng tên dân tộc quen dùng trong bản dự thảo và phù hợp với tên riêng trong nguyên văn.
- source_word: לְבַעַל פְּעוֹר
  choice: với Ba-anh Phê-ô
  rationale: בעל là danh hiệu hoặc tên của thần Ba-anh, còn פעור xác định hình thức địa phương gắn với Phê-ô. Cách dịch này giữ quan hệ giữa hai thành tố mà vẫn tự nhiên trong tiếng Việt.
- source_word: וַיִּחַר אַף
  choice: cơn giận ... bừng lên
  rationale: Thành ngữ Hê-bơ-rơ diễn tả cơn giận trở nên nóng hoặc cháy. “Bừng lên” giữ hình ảnh nhiệt và là cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- source_word: בְּיִשְׂרָאֵל
  choice: nghịch cùng Israel
  rationale: Trong thành ngữ חרה אף, giới từ ב đánh dấu đối tượng của cơn giận. “Nghịch cùng” diễn đạt rõ hướng của cơn giận và giữ văn phong trang trọng.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu, đồng thời phản ánh cách phục nguyên học thuật phổ biến.
- issue: Sắc thái của việc Israel liên kết với Ba-anh Phê-ô
  choice: gắn mình với
  alternative: tự buộc mình vào
  rationale: “Gắn mình với” bảo tồn ý nghĩa liên kết chặt chẽ của thể Niphal mà không quyết định liệu hình ảnh chính xác là mang ách, gia nhập nghi lễ hay một dạng ràng buộc giao ước.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ danh Yahweh và hình ảnh cơn giận bừng lên; chú thích bảo tồn các khả năng của động từ צמד và cách hiểu cụm Ba-anh Phê-ô.
