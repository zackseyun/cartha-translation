id: NUM.25.4
reference: Numbers 25:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se[a]: “Hãy bắt tất cả những người lãnh đạo dân chúng và đóng họ vào cọc trước mặt Yahweh giữa ban ngày[b], để cơn thịnh nộ bừng cháy của Yahweh lìa khỏi Y-sơ-ra-ên.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Hãy tập hợp tất cả những người lãnh đạo dân chúng và bảo họ xử tử những kẻ có tội trước mặt Yahweh giữa ban ngày.” Về mặt cú pháp, đại từ “họ” trực tiếp nhất chỉ những người lãnh đạo, nhưng một số người hiểu rằng các lãnh đạo là những người được lệnh thi hành án.'
    reason: alternative_reading
  - marker: b
    text: 'Nghĩa đen: “trước mặt trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: קַח
  choice: Hãy bắt
  rationale: Trong ngữ cảnh xử phạt, “bắt” diễn đạt tự nhiên và rõ hơn “lấy,” đồng thời không thêm ý ngoài mệnh lệnh của động từ.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: tất cả những người lãnh đạo dân chúng
  rationale: רָאשֵׁי theo nghĩa đen là “các đầu,” nhưng ở đây chỉ những người đứng đầu; “những người lãnh đạo” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וְהוֹקַע אֹתָם
  choice: và đóng họ vào cọc
  rationale: יקע ở thể Hiphil chỉ một hình phạt công khai khốc liệt, thường được hiểu là đóng/treo trên cọc. Cách dịch này giữ hình ảnh cụ thể nhưng không xác quyết quá mức rằng cơ thể bị cọc xuyên qua.
- source_word: לַיהוָה
  choice: trước mặt Yahweh
  rationale: ל diễn tả sự quy hướng hoặc liên hệ với Yahweh trong hành vi xử phạt mang tính tư pháp–thánh lễ. “Trước mặt” chuyển tải việc làm trong sự hiện diện và theo phán quyết của Ngài, dù “cho Yahweh” cũng có thể hiểu được.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: giữa ban ngày
  rationale: Nghĩa đen là “trước mặt trời”; thành ngữ nhấn mạnh việc thi hành công khai dưới ánh sáng ban ngày.
- source_word: חֲרוֹן אַף יְהוָה
  choice: cơn thịnh nộ bừng cháy của Yahweh
  rationale: Giữ sắc thái mãnh liệt và hình ảnh sức nóng của thành ngữ Hê-bơ-rơ, bằng lối diễn đạt trang trọng nhưng dễ hiểu.
- source_word: מִיִּשְׂרָאֵל
  choice: lìa khỏi Y-sơ-ra-ên
  rationale: מן chỉ sự phân cách; “lìa khỏi” kết hợp tự nhiên với việc cơn thịnh nộ rút đi.
theological_decisions:
- issue: Đối tượng của đại từ “họ” trong mệnh lệnh đóng vào cọc
  choice: Đại từ được hiểu theo cú pháp trực tiếp là chỉ tất cả những người lãnh đạo dân chúng.
  alternative: Môi-se phải tập hợp các lãnh đạo để họ xử tử những người có tội trước mặt Yahweh.
  rationale: Tiền ngữ số nhiều gần nhất của אֹתָם là “những người lãnh đạo dân chúng,” nên bản văn chính theo cách hiểu trực tiếp này. Tuy nhiên, câu kế tiếp giao cho các thẩm phán giết những người theo Ba-anh Phê-ô, tạo ra một căng thẳng giải nghĩa thực sự; vì vậy cách hiểu kia được giữ trong chú thích.
- issue: Sắc thái của לַיהוָה
  choice: trước mặt Yahweh
  alternative: cho Yahweh
  rationale: Giới từ ל có thể chỉ sự quy hướng, dâng cho hoặc liên hệ. Trong ngữ cảnh tư pháp–thánh lễ, “trước mặt Yahweh” diễn đạt hành vi được thi hành trong sự hiện diện và theo đòi hỏi của Ngài; chú thích không cần thiết vì khác biệt này không làm thay đổi trọng tâm câu.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt tiêu chuẩn hiện đại. Dùng “phán” cho lời trực tiếp của Yahweh, “Môi-se” và “Y-sơ-ra-ên” theo dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
