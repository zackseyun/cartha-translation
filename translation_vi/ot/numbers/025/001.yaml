  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính của câu: Israel ở tại Si-tim, dân chúng bắt đầu hành vi tình dục bất chính với các con gái Mô-áp. Tuy nhiên, cụm “làm điếm với” không vận hành tự nhiên trong tiếng Việt và có thể khiến người đọc hiểu là dân Israel hành nghề mại dâm với họ. Động từ זנה có hình ảnh mạnh của việc “làm điếm/chơi điếm”, nhưng trong ngữ cảnh với đối tượng là các phụ nữ, “gian dâm với” chuyển tải rõ và chính xác hành vi được nói đến mà không thêm chi tiết.'
