base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: vi
  text: Khi Y-sơ-ra-ên đang ở Si-tim, dân chúng bắt đầu gian dâm với các con gái Mô-áp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bắt đầu phạm tội gian dâm với phụ nữ Mô-áp.” Động từ Hê-bơ-rơ có nghĩa đen là “làm điếm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: đang ở
  rationale: Động từ ישׁב có thể chỉ việc ngồi, cư ngụ hoặc lưu lại; trong bối cảnh đóng trại, “đang ở” tự nhiên và không hàm ý định cư lâu dài.
- source_word: בַּשִּׁטִּים
  choice: tại Si-tim
  rationale: Tên địa danh được phiên âm theo cách quen thuộc trong tiếng Việt; giới từ “tại” thích hợp với nơi dân Israel lưu trú.
- source_word: וַיָּחֶל
  choice: bắt đầu
  rationale: Dạng động từ ở đây mang nghĩa khởi sự một hành động.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ tập thể dân Israel và nối tự nhiên với chủ thể “Y-sơ-ra-ên” ở đầu câu.
- source_word: לִזְנוֹת
  choice: làm điếm
  rationale: Giữ hình ảnh mạnh và cụ thể của זנה, chỉ hành vi tình dục bất chính với sắc thái mại dâm, thay vì làm nhẹ thành một khái niệm đạo đức chung.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu với זנה và đối tượng chỉ người, אֶל diễn tả người cùng tham gia quan hệ, nên “với” là cách diễn đạt tự nhiên.
- source_word: בְּנוֹת מוֹאָב
  choice: những người con gái Mô-áp
  rationale: Bám sát thành ngữ Hê-bơ-rơ “các con gái của Mô-áp” mà vẫn rõ nghĩa trong tiếng Việt; cũng có thể hiểu là phụ nữ Mô-áp.
theological_decisions:
- issue: Tính chất tội lỗi của dân Israel trong mệnh đề mở đầu
  choice: Dùng ngôn ngữ trực tiếp “làm điếm” để giữ sức nặng của hình ảnh trong nguyên văn.
  alternative: “phạm tội gian dâm với những người phụ nữ Mô-áp” hoặc “hành dâm với những người con gái Mô-áp”
  rationale: זנה mạnh và giàu hình ảnh hơn một cách nói khái quát về sự vô luân tình dục. Bản dịch giữ sức nặng luân lý của câu nhưng không đưa thêm cách giải thích thần học từ các câu sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Y-sơ-ra-ên,” “Si-tim” và “Mô-áp” dùng dạng phiên âm Kinh Thánh quen thuộc; “làm điếm” được giữ vì độ sắc và hình ảnh của nguyên văn, còn chú thích cung cấp cách diễn đạt khái quát hơn.
