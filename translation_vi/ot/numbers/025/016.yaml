base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: YHWH; theo truyền thống thường được dịch là “Đức Giê-hô-va” hoặc “CHÚA”. Cũng có cách phiên âm là “Yahweh” và “Jehovah”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”; dạng có waw nối tiếp đưa câu chuyện sang một sự kiện phát ngôn mới.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Đây là danh riêng của Đức Chúa Trời, tức Tứ Tự YHWH. “Đức Giê-hô-va” là cách phiên âm quen thuộc, trang trọng trong tiếng Việt và không thay danh ấy bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu nói năng tiếng Việt, “phán với” diễn đạt tự nhiên quan hệ hướng đến người tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức וידבר ... לאמר, “rằng” là cách dẫn trực tiếp tự nhiên trong tiếng Việt, giữ chức năng mở đầu lời phán tiếp theo mà không tạo lối diễn đạt gượng như “nói rằng” sau “phán”.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự YHWH. Bản dịch giữ đây là danh riêng thay vì âm thầm thay bằng tước hiệu; “Đức Giê-hô-va” được chọn vì quen thuộc và tự nhiên hơn đối với độc giả tiếng Việt phổ thông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích, phù hợp công thức dẫn nhập lời phán trong Ngũ Kinh. Dấu hai chấm báo trước nội dung lời phán ở câu kế tiếp.
