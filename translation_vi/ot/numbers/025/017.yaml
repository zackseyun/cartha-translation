  rationale: 'Sửa “đối nghịch với” thành “coi ... là kẻ thù” để tiếng Việt tự nhiên hơn và để chuyển đạt chính xác sắc thái của mệnh lệnh צָרוֹר: xem hay đối xử với đối tượng như kẻ thù. Giữ “và đánh họ” vì động từ נכה chỉ hành động đánh/giáng đòn và không buộc phải xác định kết quả là giết chết hay đánh bại. Chú thích được chỉnh để bảo tồn các khả năng từ vựng mà không biến “quấy phá” thành nghĩa duy nhất.'
