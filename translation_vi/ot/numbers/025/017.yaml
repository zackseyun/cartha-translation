  text: Harass the Midianites and strike them down,[a]
translation:
  language: vi
  text: Hãy coi dân Ma-đi-an là kẻ thù và đánh họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đối xử thù nghịch với dân Ma-đi-an và đánh họ,” hoặc: “Hãy quấy phá dân Ma-đi-an và đánh họ.” Động từ Hê-bơ-rơ צָרוֹר có thể mang nghĩa đối xử với ai như kẻ thù hoặc bày tỏ sự thù địch với họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: Hãy đối nghịch với
  rationale: Mệnh lệnh Qal của צרר diễn tả việc xem hoặc đối xử với một dân như kẻ thù, bày tỏ sự thù địch. “Đối nghịch với” giữ được độ rộng của nghĩa mà không thu hẹp thành một chiến thuật quấy phá cụ thể.
- source_word: הַמִּדְיָנִים
  choice: dân Ma-đi-an
  rationale: Danh xưng dân tộc Midian được phiên âm theo lối quen thuộc trong tiếng Việt; thêm “dân” để câu rõ và tự nhiên.
- source_word: וְהִכִּיתֶם
  choice: và đánh họ
  rationale: Dạng Hiphil của נכה có thể mang nghĩa đánh, giáng đòn, hạ hoặc đánh bại. “Đánh họ” bảo toàn tính trực tiếp và bạo lực của mệnh lệnh nhưng không xác định quá mức rằng động từ tự nó nhất thiết có nghĩa là giết sạch.
- source_word: אוֹתָם
  choice: họ
  rationale: Đại từ làm tân ngữ, quy chiếu về dân Ma-đi-an.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Dấu hiệu chỉ tân ngữ xác định trong tiếng Hê-bơ-rơ, được thể hiện qua cú pháp tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt mệnh lệnh thù địch và bạo lực do Đức Chúa Trời truyền mà không làm nhẹ hoặc mở rộng ý
  choice: Hãy đối nghịch với dân Ma-đi-an và đánh họ
  alternative: Hãy quấy phá dân Ma-đi-an và đánh hạ họ
  rationale: 'Nguyên văn gồm hai mệnh lệnh trực tiếp: một mệnh lệnh về thái độ/hành động thù địch và một mệnh lệnh đánh họ. Bản dịch giữ nguyên mức nghiêm khắc nhưng không thêm lời biện minh thần học hoặc khẳng định cụ thể hơn rằng phải giết họ.'
translation_notes:
  register: Văn phong mệnh lệnh trang trọng, trực tiếp và dễ hiểu trong tiếng Việt hiện đại. “Đối nghịch với” được chọn để giữ trường nghĩa rộng của צרר; chú thích nêu cách dịch cụ thể hơn là “quấy phá”.
