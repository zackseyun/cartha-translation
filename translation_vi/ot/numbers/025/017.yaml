    rationale: Cụm này thường mô tả một tình trạng hay lập trường đối lập hơn là chỉ thị phải đối xử với một nhóm như kẻ thù. Cách sửa làm rõ sắc thái của צָרוֹר mà không thu hẹp nghĩa thành “quấy phá.”
  - severity: low
