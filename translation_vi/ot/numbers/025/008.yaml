  text: וַ֠/יָּבֹא אַחַ֨ר אִֽישׁ יִשְׂרָאֵ֜ל אֶל הַ/קֻּבָּ֗ה וַ/יִּדְקֹר֙ אֶת שְׁנֵי/הֶ֔ם אֵ֚ת אִ֣ישׁ יִשְׂרָאֵ֔ל וְ/אֶת הָ/אִשָּׁ֖ה אֶל קֳבָתָ֑/הּ וַ/תֵּֽעָצַר֙ הַ/מַּגֵּפָ֔ה מֵ/עַ֖ל בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: vi
  text: Ông đi theo người đàn ông Y-sơ-ra-ên vào căn phòng[a], rồi đâm cả hai người—người đàn ông Y-sơ-ra-ên và người phụ nữ—vào bụng bà[b]. Bấy giờ, tai vạ trên con cái Y-sơ-ra-ên được ngăn lại[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gian phía trong”, “khoang trong lều” hoặc “trướng”; từ Hê-bơ-rơ này hiếm gặp và chỉ một gian hay khoang có che chắn.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn chỉ cụ thể bụng hoặc khoang bụng của người phụ nữ.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “con cái Y-sơ-ra-ên”, một cách gọi quen thuộc dành cho dân Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: phòng kín
  rationale: Danh từ hiếm này chỉ một gian hay khoang ở phía trong. “Phòng kín” diễn đạt tự nhiên một không gian riêng, có che chắn, nhưng không xác định quá mức đó là phòng trong nhà hay khoang trong lều.
- source_word: וַיִּדְקֹר
  choice: đâm xuyên
  rationale: Giữ được ý đâm mạnh và xuyên qua của động từ דקר, phù hợp với việc cả hai người bị đâm cùng một lần.
- source_word: שְׁנֵיהֶם
  choice: cả hai người
  rationale: Diễn đạt trực tiếp rằng hai người cùng bị đâm.
- source_word: אֶל קֳבָתָהּ
  choice: qua bụng bà
  rationale: קֳבָה chỉ bụng hoặc khoang bụng; cách dịch này cụ thể, tự nhiên và không làm nhẹ chi tiết thân thể trong nguyên văn.
- source_word: וַתֵּעָצַר
  choice: chấm dứt
  rationale: Thể Niphal cho biết tai họa bị ngăn lại, đi đến kết quả là chấm dứt; tiếng Việt dùng “chấm dứt” tự nhiên hơn một cấu trúc bị động cứng.
- source_word: הַמַּגֵּפָה
  choice: tai họa
  rationale: מַגֵּפָה trong văn cảnh này là tai họa giáng xuống dân chúng; “tai họa” phù hợp rộng hơn “dịch bệnh”, vì câu không xác định cơ chế y học.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: trên con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh không gian của מֵעַל và công thức giao ước בְּנֵי יִשְׂרָאֵל, đồng thời vẫn dễ hiểu trong tiếng Việt.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: người đàn ông Y-sơ-ra-ên
  rationale: Giữ cả giới tính nam được nêu rõ bởi אִישׁ và căn tính Y-sơ-ra-ên của người này.
theological_decisions:
- issue: Công thức tập thể có giống đực בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” bảo tồn công thức huyết thống–giao ước của tiếng Hê-bơ-rơ mà trong ngữ cảnh vẫn chỉ toàn thể cộng đồng, không chỉ nam giới.
- issue: Chi tiết giải phẫu trong cảnh phán xét
  choice: qua bụng bà
  alternative: qua vùng bụng bà
  rationale: Nguyên văn nêu chi tiết thân thể cụ thể; bản dịch không làm nhẹ cũng không thêm mức độ ghê rợn.
- issue: Quan hệ giữa hành động của Phi-nê-a và việc tai họa chấm dứt
  choice: Bấy giờ, tai họa ... chấm dứt
  alternative: Vì thế, tai họa ... chấm dứt
  rationale: Liên từ וַ chỉ trình tự trong câu và không tự nó buộc phải diễn đạt quan hệ nhân quả bằng “vì thế”; “bấy giờ” giữ sự nối tiếp mà không giải quyết quá mức hàm ý thần học.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Dùng “ông” để nối chủ thể Phi-nê-a từ câu trước; tránh lối bị động gượng ép. “Phòng kín” giữ tính không xác định của danh từ hiếm, còn các chú thích trình bày những khả năng kiến trúc khác.
