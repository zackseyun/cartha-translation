  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi hành động và các quan hệ chính của Hê-bơ-rơ: chủ ngữ giống cái số nhiều theo ngữ cảnh mời dân chúng tham dự các lễ/sinh tế gắn với các thần của họ; dân chúng ăn; rồi họ sấp mình trước các thần ấy. “Các phụ nữ ấy” là sự làm rõ quy chiếu ngữ cảnh của hình thái 3fp, không thêm một nhân vật mới. “Sấp mình xuống trước” bảo toàn hành động cụ thể của וַיִּשְׁתַּחֲווּ và cách diễn đạt đối tượng của לְ.'
  naturalness: Văn phong kể chuyện trang trọng, hiện đại và mạch lạc. “Đến dự những lễ hiến tế” diễn đạt tự nhiên lời mời tới các nghi thức/sinh tế; dấu chấm phẩy phân chia hợp lý hai diễn tiến tiếp nối. “Dân chúng” phù hợp với tính tập thể của הָעָם.
  terminology: “Lễ hiến tế” là cách chuyển ngữ phù hợp cho זִבְחֵי trong ngữ cảnh nghi lễ. Chú thích phân biệt cách dịch cụ thể “sấp mình xuống” với phương án diễn giải “thờ lạy,” không áp đặt diễn giải vượt quá văn bản. Đại từ “ấy/họ” được dùng nhất quán theo quy chiếu của câu.
