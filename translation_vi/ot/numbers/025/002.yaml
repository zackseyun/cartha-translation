base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: vi
  text: Các phụ nữ ấy mời dân chúng đến dự những lễ hiến tế cho các thần của họ; dân chúng ăn rồi sấp mình xuống trước các thần ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thờ lạy các thần ấy.” Động từ Hê-bơ-rơ chỉ hành động sấp mình xuống, thường là một hành vi thờ phượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: Các phụ nữ ấy mời
  rationale: Động từ Qal 3fp cho thấy chủ ngữ giống cái số nhiều, quy chiếu về các phụ nữ Mô-áp ở câu trước. “Mời” diễn đạt tự nhiên cấu trúc קרא với לְ trong ngữ cảnh này.
- source_word: לָעָם
  choice: dân chúng
  rationale: Giữ cách gọi khái quát có mạo từ của tiếng Hê-bơ-rơ; ngữ cảnh cho biết đây là dân Y-sơ-ra-ên nhưng câu này không nhắc lại tên ấy.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: đến dự những lễ hiến tế cho các thần của họ
  rationale: זִבְחֵי là danh từ số nhiều dạng liên kết, chỉ các sinh tế hoặc nghi lễ hiến tế gắn với các thần của những phụ nữ ấy. “Đến dự” phù hợp với hành động được mời tham gia, còn “cho các thần” tự nhiên trong tiếng Việt.
- source_word: וַיֹּאכַל
  choice: dân chúng ăn
  rationale: Động từ kể thuật đơn giản với chủ ngữ tập thể הָעָם; “ăn” giữ sự trực tiếp của nguyên văn và trong ngữ cảnh là ăn đồ thuộc lễ hiến tế.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sấp mình xuống
  rationale: Giữ hành động thân thể cụ thể của השתחוה, thường mang ý nghĩa thờ phượng, thay vì chuyển thẳng sang cách diễn giải “thờ lạy”.
- source_word: לֵאלֹהֵיהֶן
  choice: trước các thần ấy
  rationale: Sau השתחוה, לְ đánh dấu đối tượng được hướng đến. “Trước các thần ấy” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn nêu rõ đối tượng của hành động.
theological_decisions:
- issue: Cách dịch hành vi thờ thần tượng được mô tả bằng וַיִּשְׁתַּחֲווּ
  choice: sấp mình xuống trước các thần ấy
  alternative: thờ lạy các thần ấy
  rationale: Bản dịch giữ hình ảnh cúi rạp thân thể trong nguyên văn, đồng thời chú thích ý nghĩa thờ phượng thường có của động từ. Như vậy không làm mất sắc thái cụ thể cũng không che khuất tính chất tôn giáo của hành động.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “các phụ nữ ấy” để biểu thị rõ chủ ngữ giống cái số nhiều vốn chỉ được mã hóa trong động từ Hê-bơ-rơ; dùng “lễ hiến tế” để bao quát sinh tế và bữa ăn nghi lễ.
