  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Đức Giê-hô-va phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa câu chuyện tiến sang hành động kế tiếp; “rồi” diễn đạt tự nhiên sắc thái tuần tự, còn “phán” phù hợp với lời Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu chỉ hành động nói với một người, “phán với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng truyền thống, phổ biến và dễ nhận biết trong Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức nguyên ngữ giới thiệu nội dung lời nói tiếp theo; “rằng” chuyển chức năng ấy tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê); CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng YHWH. Bản dịch giữ danh riêng bằng hình thức phiên âm quen thuộc trong tiếng Việt, không thay bằng tước hiệu; “Đức” là yếu tố kính ngữ tiếng Việt chứ không phải một phần của danh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm báo trước lời phán bắt đầu ở câu kế tiếp. Không đặt chú thích vì không có phương án văn bản khác cần ghi nhận trong câu này.
