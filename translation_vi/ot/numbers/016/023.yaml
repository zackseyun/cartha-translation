reference: Numbers 16:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se[a] rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ có thể dịch sát hơn: “Và Yahweh phán với Môi-se rằng”. Liên từ mở đầu cũng có thể dịch là “Và” thay vì “Bấy giờ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ ... phán
  rationale: Dạng wayyiqtol tiếp nối và đẩy diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên sắc thái tuần tự, còn “phán” phù hợp với lời trang trọng của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì dùng một tước hiệu thay thế.
- source_word: אֶל
  choice: với
  rationale: Trong công thức chỉ hành vi nói, tiếng Việt tự nhiên dùng “phán với”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Cách phiên âm tên riêng Moses quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này mở đầu lời nói trực tiếp; “rằng” giữ câu mở sang lời trích dẫn ở câu kế tiếp và tự nhiên hơn cấu trúc sát chữ “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh xưng bốn phụ âm; giữ “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời; giữ công thức dẫn nhập ngắn gọn và để dấu hai chấm báo trước lời trực tiếp ở câu tiếp theo.
