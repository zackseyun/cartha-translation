revisions:
- from: Mỗi người hãy lấy lư đựng than[a] của mình, đặt hương lên đó, rồi đem lư của mình đến trước mặt Đức Giê-hô-va—tất cả là hai trăm năm mươi lư. Còn ngươi và A-rôn, mỗi người cũng đem lư của mình đến.
  to: Mỗi người hãy lấy lư đựng than[a] của mình, đặt hương lên đó, rồi đem đến trước mặt Yahweh lư của mình—hai trăm năm mươi cái lư. Còn ngươi và A-rôn, mỗi người đem lư của mình đến.
  rationale: Sửa danh riêng יהוה thành “Yahweh” theo quyết định của nguồn. Điều chỉnh vị trí của “hai trăm năm mươi cái lư” để nó liên kết trực tiếp với hành động đem lư đến trước Yahweh, và bỏ “cũng” là yếu tố diễn giải không cần thiết. Các yếu tố nghĩa khác của nguyên văn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:26:53Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng mệnh lệnh phân phối, hương, số lượng hai trăm năm mươi, và việc Môi-se cùng A-rôn cũng có lư riêng. Tuy nhiên, danh יהוה nên nhất quán với quyết định nguồn/audit là “Yahweh”, không phải “Đức Giê-hô-va”. Cụm “tất cả là hai trăm năm mươi lư” cũng nên gắn trực tiếp hơn với mệnh đề dâng/trình lư như cấu trúc nguyên văn.
  naturalness: “Mỗi người hãy...” và “lư đựng than” rõ ràng, tự nhiên trong văn phong hiện đại trang trọng. Bản sửa làm rõ rằng con số 250 bổ nghĩa cho các lư được đem đến trước mặt Yahweh, đồng thời tránh thêm “cũng” không có trong nguyên văn.
  terminology: Dùng “Yahweh” cho יהוה theo audit trail. Giữ “lư đựng than” cho מַחְתָּה, với chú thích thay thế “lư xông hương”; “hương” phù hợp với קְטֹרֶת. Giữ A-rôn và “ngươi” phù hợp ngữ cảnh trực tiếp với Môi-se.
  issues:
  - severity: medium
    issue: Danh יהוה được dịch là “Đức Giê-hô-va”.
    rationale: Nguồn tiếng Anh và quyết định thần học đi kèm nhất quán chọn “Yahweh” cho יהוה. Bản dịch nên theo quyết định thuật ngữ này thay vì dùng một cách phiên âm khác.
  - severity: low
    issue: “tất cả là hai trăm năm mươi lư” bị tách thành một câu độc lập.
    rationale: Nguyên văn đặt “hai trăm năm mươi lư” trong chuỗi mệnh lệnh đem lư đến trước Yahweh. Gắn trực tiếp con số với mệnh đề này bảo toàn cấu trúc và quan hệ cú pháp rõ hơn.
  - severity: low
    issue: Từ “cũng” trong mệnh đề về Môi-se và A-rôn không được biểu thị trong nguyên văn.
    rationale: Ý Môi-se và A-rôn được thêm vào đã đủ được thể hiện bằng “còn”; bỏ “cũng” giúp bản dịch sát hơn mà không làm mất nghĩa.
  revised_text: Mỗi người hãy lấy lư đựng than[a] của mình, đặt hương lên đó, rồi đem đến trước mặt Yahweh lư của mình—hai trăm năm mươi cái lư. Còn ngươi và A-rôn, mỗi người đem lư của mình đến.
  revised_footnotes:
