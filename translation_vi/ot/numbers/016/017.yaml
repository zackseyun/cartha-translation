source:
  edition: WLC
  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: vi
  text: Mỗi người hãy lấy lư đựng than[a] của mình, đặt hương lên đó, rồi đem đến trước mặt Yahweh lư của mình—hai trăm năm mươi cái lư. Còn ngươi và A-rôn, mỗi người đem lư của mình đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lư xông hương”; đây là vật dụng chứa than để đốt hương.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ אִישׁ
  choice: Mỗi người hãy lấy
  rationale: Mệnh lệnh số nhiều đi với אִישׁ theo nghĩa phân phối; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý từng người.
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: lư đựng than / lư
  rationale: מַחְתָּה là dụng cụ chứa than dùng để đốt hương. “Lư đựng than” làm rõ vật dụng trong lần xuất hiện đầu, sau đó rút gọn thành “lư” để câu không nặng nề.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: đặt hương lên đó
  rationale: Giữ nét nghĩa của giới từ עַל, có lẽ chỉ việc đặt hương lên than trong các lư, thay vì diễn giải thành “vào trong”.
- source_word: קְטֹרֶת
  choice: hương
  rationale: Từ tiếng Việt thông dụng, trang trọng, chỉ chất thơm được đốt trong nghi lễ.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: đem ... đến trước mặt Đức Giê-hô-va
  rationale: Diễn đạt tự nhiên động từ Hiphil của קרב và thành ngữ chỉ việc đưa vật đến trình diện trước Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước trong hình thức đã quen thuộc và trang trọng đối với độc giả Kinh Thánh tiếng Việt.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: tất cả là hai trăm năm mươi lư
  rationale: Nêu rõ đây là tổng số lư của nhóm người vừa được truyền lệnh, đồng thời viết số bằng chữ theo văn phong tự sự.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: Còn ngươi và A-rôn, mỗi người cũng đem lư của mình đến
  rationale: Bổ sung động từ được lược trong tiếng Hê-bơ-rơ để câu tiếng Việt hoàn chỉnh; “mỗi người” bảo toàn ý phân phối của אִישׁ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Bản dịch giữ một dạng danh riêng thay vì thay bằng tước hiệu “CHÚA”; “Đức Giê-hô-va” là hình thức trang trọng, dễ nhận biết trong tiếng Việt, trong khi cách phát âm nguyên thủy không hoàn toàn chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “ngươi” vì lời nói trực tiếp hướng đến Môi-se trong bối cảnh cổ; giữ tên A-rôn theo dạng quen thuộc. Dấu gạch ngang làm nổi bật tổng số hai trăm năm mươi lư.
