  to: 'Ông nói với Cô-ra và toàn thể hội chúng của ông: “Vào buổi sáng, Yahweh sẽ cho biết[a] ai thuộc về Ngài, ai là người thánh, và sẽ cho người ấy đến gần Ngài[b]. Người nào Ngài chọn, Ngài sẽ cho người ấy đến gần Ngài.”'
