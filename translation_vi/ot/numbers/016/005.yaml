source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: vi
  text: 'Ông nói với Cô-ra và toàn thể hội chúng của ông: “Vào buổi sáng, Yahweh sẽ cho biết[a] ai thuộc về Ngài, ai là người thánh, và sẽ cho người ấy đến gần Ngài[b]. Người nào Ngài chọn, Ngài sẽ cho người ấy đến gần Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Yahweh sẽ biết ai thuộc về Ngài.” Trong ngữ cảnh này, động từ Hê-bơ-rơ có lẽ nói đến việc Yahweh công khai cho thấy người ấy là ai.'
    reason: lexical_alternative
  - marker: b
    text: “Đến gần” là cách nói trong bối cảnh thờ phượng, chỉ việc được phép đến trước sự hiện diện của Yahweh để thực hiện phận sự thánh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ông nói
  rationale: Động từ דבר chỉ việc nói hoặc ngỏ lời. “Ông nói” giữ lối kể chuyện tự nhiên và phân biệt được với לֵאמֹר, là từ dẫn vào lời trực tiếp.
- source_word: עֲדָתוֹ
  choice: toàn thể hội chúng của ông
  rationale: עֵדָה chỉ một cộng đồng hoặc nhóm người tụ họp. “Hội chúng” phù hợp với bối cảnh cộng đồng Israel trong hoang mạc; đại từ sở hữu được giữ theo nguyên văn và chỉ về Cô-ra.
- source_word: בֹּקֶר
  choice: Sáng mai
  rationale: Danh từ “buổi sáng” được dùng với chức năng trạng ngữ. Trong lời nói về việc sắp xảy ra, “sáng mai” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: וְיֹדַע יְהוָה
  choice: Yahweh sẽ cho biết
  rationale: ידע có nghĩa cơ bản là “biết”, nhưng trong ngữ cảnh phân định công khai này có thể mang ý nghĩa làm cho người ta biết hoặc bày tỏ. Bản dịch chính dùng “cho biết” và ghi chú nghĩa sát chữ để bảo tồn khả năng hiểu khác.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: ai thuộc về Ngài
  rationale: Cụm từ có nghĩa sát là “người thuộc về Ngài”. Cách dịch này giữ ý sở hữu và mối liên hệ với Yahweh mà không diễn giải thêm.
- source_word: הַקָּדוֹשׁ
  choice: ai là người thánh
  rationale: Tính từ có mạo từ được dùng như danh từ, chỉ người được biệt riêng cho phận sự thánh. “Người thánh” giữ được sắc thái thiêng liêng và cấu trúc song song của câu.
- source_word: וְהִקְרִיב אֵלָיו / יַקְרִיב אֵלָיו
  choice: sẽ cho người ấy đến gần Ngài
  rationale: Dạng Hiphil của קרב có nghĩa khiến hoặc cho phép một người đến gần, đặc biệt trong bối cảnh thờ phượng và chức vụ thánh. Cách dịch này giữ hình ảnh “đến gần” và lặp lại cụm từ như tiếng Hê-bơ-rơ.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: Người nào Ngài chọn
  rationale: בחר chỉ việc chọn lựa. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ trọng tâm nơi sự lựa chọn của Yahweh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” giữ đây là danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của ידע trong lời tuyên bố phân định
  choice: sẽ cho biết
  alternative: sẽ biết
  rationale: Trong bối cảnh Yahweh công khai xác nhận người thuộc về Ngài và được phép đến gần, “cho biết” truyền đạt tác dụng bày tỏ. Tuy nhiên, vì hình thái Hê-bơ-rơ cũng có thể được dịch sát là “biết”, khả năng ấy được nêu trong chú thích.
- issue: Ý nghĩa của việc được “đến gần” Yahweh
  choice: giữ nguyên ngôn ngữ đến gần và giải thích sắc thái chức vụ thánh trong chú thích
  alternative: sẽ lập người ấy làm thầy tế lễ
  rationale: Nguyên văn dùng ngôn ngữ thờ phượng về quyền được đến gần, chứ không trực tiếp nói “lập làm thầy tế lễ”. Giữ cách nói của nguyên văn tránh thu hẹp ý nghĩa thần học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ sự lặp lại có chủ ý của “cho ... đến gần Ngài”, đồng thời không diễn giải cụm từ ấy thành một chức danh giáo phái cụ thể. Các đại từ viết hoa khi chỉ Yahweh để giúp người đọc theo dõi chủ thể, không nhằm xác lập một quan điểm thần học riêng.
