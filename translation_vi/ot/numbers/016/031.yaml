  text: וַ/יְהִי֙ כְּ/כַלֹּת֔/וֹ לְ/דַבֵּ֕ר אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/תִּבָּקַ֥ע הָ/אֲדָמָ֖ה אֲשֶׁ֥ר תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/031.yaml
  text: And as soon as he had finished speaking all these words, the ground beneath them split open.
translation:
  language: vi
  text: Ngay khi ông vừa nói xong tất cả những lời ấy, đất bên dưới họ nứt toác ra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Ngay khi ông vừa nói xong
  rationale: Cấu trúc כְּ kết hợp với động từ hoàn tất diễn tả sự việc kế tiếp xảy ra đúng lúc lời nói vừa chấm dứt; “ngay khi... vừa” truyền đạt tự nhiên tính tức thời ấy.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: tất cả những lời ấy
  rationale: דְּבָרִים trong ngữ cảnh hành vi nói chỉ các lời vừa được phát biểu; “ấy” trang trọng và tự nhiên trong văn thuật chuyện.
- source_word: וַתִּבָּקַע
  choice: nứt toác ra
  rationale: Động từ בקע ở dạng nifal chỉ việc bị tách hoặc vỡ mở ra; “nứt toác ra” giữ được sức mạnh và hướng mở của hành động.
- source_word: הָאֲדָמָה אֲשֶׁר תַּחְתֵּיהֶם
  choice: đất bên dưới họ
  rationale: Diễn đạt gọn, đúng nghĩa vị trí của nguyên văn; “đất” phù hợp hơn “mặt đất” vì chủ thể chính là nền đất bị tách ra.
theological_decisions: []
translation_notes:
  register: Văn kể chuyện hiện đại, trang nghiêm và dễ hiểu. Giữ đại từ “ông” theo ngữ cảnh chỉ Môi-se, đồng thời không thêm tên riêng vốn không có trong câu Hê-bơ-rơ.
