  rationale: Chỉ điều chỉnh “tách mình ra” thành “tách ra” để câu tự nhiên hơn trong tiếng Việt hiện đại. Bản sửa vẫn bảo toàn mệnh lệnh số nhiều tự tách biệt, ý “khỏi giữa,” mức độ phán xét của “tiêu diệt,” và tính tức khắc của “trong chốc lát.”
