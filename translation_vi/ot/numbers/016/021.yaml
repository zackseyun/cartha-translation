  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: vi
  text: “Hãy tách ra khỏi giữa hội chúng này[a], để Ta tiêu diệt chúng trong chốc lát[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi giữa cộng đồng này” hoặc “khỏi giữa đoàn dân này.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong khoảnh khắc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: Hãy tách mình ra
  rationale: Động từ Niphal mệnh lệnh số nhiều của בדל truyền đạt việc những người được phán bảo phải tự tách khỏi nhóm; cách diễn đạt này tự nhiên và giữ sắc thái phản thân.
- source_word: מִתּוֹךְ
  choice: khỏi giữa
  rationale: Giữ ý nghĩa rời ra từ bên trong một tập thể, thay vì chỉ diễn đạt chung là rời khỏi.
- source_word: הָעֵדָה הַזֹּאת
  choice: hội chúng này
  rationale: עֵדָה chỉ cộng đồng Israel đang tụ họp; “hội chúng” vừa giữ nghĩa tập thể vừa phù hợp văn cảnh Ngũ Kinh.
- source_word: וַאֲכַלֶּה
  choice: để Ta tiêu diệt
  rationale: Dạng động từ ngôi thứ nhất sau mệnh lệnh mang sắc thái ý định/kết quả; כלה ở đây diễn tả việc kết liễu hoàn toàn, nên không làm nhẹ thành “xử lý” hay “loại bỏ”.
- source_word: אֹתָם
  choice: chúng
  rationale: Đại từ tân ngữ chỉ hội chúng đang đứng trước sự phán xét.
- source_word: כְּרָגַע
  choice: trong chốc lát
  rationale: רֶגַע chỉ một khoảng thời gian cực ngắn; “trong chốc lát” truyền đạt cả sự nhanh chóng lẫn tính đột ngột.
theological_decisions:
- issue: Tính chất của lời đe dọa phán xét từ Đức Chúa Trời
  choice: Giữ nguyên lời tuyên bố về ý định tiêu diệt hội chúng một cách mau chóng.
  alternative: Làm nhẹ thành “xử lý chúng” hoặc “loại bỏ chúng”.
  rationale: Động từ כלה trong văn cảnh mang sức nặng của sự phán xét hủy diệt. Bản dịch bảo tồn mức độ nghiêm trọng và sự căng thẳng thần học của câu, không tự ý giảm nhẹ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ta” phản ánh lời phán trực tiếp của Đức Chúa Trời; “tiêu diệt” giữ nguyên sức nặng của כלה. Các chú thích được đặt ngay sau thành phần tương ứng trong chính văn.
