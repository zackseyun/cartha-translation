  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/020.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức trần thuật về lời Đức Chúa Trời được diễn đạt tự nhiên và trang trọng bằng “phán”, đồng thời thể hiện diễn tiến do waw liên tiếp.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: “Với” chỉ rõ hai người tiếp nhận lời phán; tên riêng được phiên âm theo cách dùng tiếng Việt phổ biến.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Trong tiếng Việt hiện đại, “rằng:” là cách tự nhiên để chuyển công thức dẫn lời לֵאמֹר và báo hiệu nội dung trực tiếp theo sau.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng danh riêng YHWH. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu “CHÚA”; “Đức Giê-hô-va” là dạng trang trọng, quen thuộc với độc giả Việt.
translation_notes:
  register: Văn phong trần thuật ngắn gọn, trang trọng và tự nhiên. Dấu hai chấm sau “rằng” phù hợp vì câu sau sẽ trình bày nội dung lời phán.
