id: NUM.16.10
reference: Numbers 16:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: vi
  text: Ngài đã đưa anh và tất cả anh em của anh, tức con cháu Lê-vi, đến gần[a]; thế mà các anh còn tìm kiếm cả chức tư tế nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã cho anh được đến gần.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: đã đưa ... đến gần
  rationale: Động từ קרב ở thể Hifil có nghĩa là đưa đến gần hoặc cho được tiếp cận. Cách dịch này giữ được cả ý không gian lẫn đặc ân phụng tự trong ngữ cảnh.
- source_word: אֹתְךָ
  choice: anh
  rationale: Đại từ tân ngữ giống đực số ít, trực tiếp chỉ Cô-ra.
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: cùng với tất cả anh em anh là con cháu Lê-vi
  rationale: Giữ nghĩa sát của אַחֶיךָ là “anh em anh”, đồng thời thể hiện בְנֵי לֵוִי như thành phần giải thích họ là những người thuộc dòng Lê-vi.
- source_word: אִתָּךְ
  choice: cùng với
  rationale: Diễn đạt tự nhiên mối liên kết giữa Cô-ra và các anh em thuộc dòng Lê-vi, dù hình thức Masoret của từ này có cách chấm nguyên âm bất thường trong ngữ cảnh.
- source_word: וּבִקַּשְׁתֶּם
  choice: thế mà các anh còn tìm kiếm
  rationale: Động từ ở số nhiều chuyển lời quở trách từ Cô-ra sang cả nhóm. “Thế mà” thể hiện sắc thái đối lập theo ngữ cảnh, còn “tìm kiếm” giữ nghĩa cơ bản của בקש.
- source_word: גַּם
  choice: cả ... nữa
  rationale: 'Cấu trúc tiếng Việt này diễn đạt rõ ý bổ sung: ngoài đặc ân đã nhận, họ còn muốn thêm chức tư tế.'
- source_word: כְּהֻנָּה
  choice: chức tư tế
  rationale: Chỉ địa vị hoặc chức vụ tư tế, không chỉ hoạt động phục vụ nói chung; cách dịch giữ sự phân biệt giữa phận sự của người Lê-vi và chức tư tế.
theological_decisions:
- issue: Sự phân biệt về địa vị phụng tự giữa người Lê-vi và các tư tế
  choice: chức tư tế
  alternative: việc phục vụ của tư tế
  rationale: Cô-ra và đồng đảng bị quở trách vì muốn một địa vị vượt quá phận sự Lê-vi đã được ban. “Chức tư tế” giữ rõ sự phân biệt mang tính thiết chế trong đoạn văn.
- issue: Đối tượng ngầm của việc được đưa đến gần
  choice: đưa ... đến gần
  alternative: cho ... được đến gần Ngài
  rationale: Bản Hê-bơ-rơ không nêu bổ ngữ sau “đến gần”. Không thêm “Ngài” giúp bảo tồn cách diễn đạt cô đọng và độ mở của nguyên văn, dù ngữ cảnh phụng tự hàm ý đến gần Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh/các anh” để phản ánh sự chuyển từ tân ngữ số ít chỉ Cô-ra sang động từ số nhiều chỉ Cô-ra cùng đồng đảng; câu hỏi cuối câu thể hiện lực quở trách của ngữ cảnh.
