source:
  edition: WLC
  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: vi
  text: Vậy, dân chúng rời khỏi khu vực quanh nơi ở của Cô-rê, Đa-than và A-bi-ram.[a] Đa-than và A-bi-ram bước ra, đứng ở cửa lều của họ, cùng với vợ, các con trai và con nhỏ của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “dân chúng đi lên, rời khỏi khu vực quanh nơi ở của Cô-rê, Đa-than và A-bi-ram.” Động từ Hê-bơ-rơ có nghĩa đen là “đi lên”, nhưng trong ngữ cảnh này có lẽ diễn tả việc rời khỏi khu vực ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: rời khỏi khu vực quanh
  rationale: Động từ có nghĩa đen là “đi lên”, nhưng khi kết hợp với מֵעַל và מִסָּבִיב trong ngữ cảnh này, cụm từ diễn tả việc dân chúng rút ra xa khỏi vùng chung quanh nơi ở của những người phản loạn.
- source_word: מִשְׁכַּן
  choice: nơi ở
  rationale: Ở đây từ này chỉ nơi cư trú hoặc khu trại gắn với Cô-rê, Đa-than và A-bi-ram, chứ không phải Đền Tạm của Đức Giê-hô-va.
- source_word: יָצְאוּ נִצָּבִים
  choice: bước ra, đứng
  rationale: Giữ riêng hành động đi ra và tư thế đứng; không thêm sắc thái “đứng thách thức”, dù ngữ cảnh có thể gợi ý điều đó.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: tại cửa lều mình
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho vị trí ngay lối vào các lều của họ; “mình” quy chiếu về Đa-than và A-bi-ram.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: cùng với vợ, các con trai và con nhỏ của họ
  rationale: Duy trì sự phân biệt giữa בנים, các con trai, và טף, trẻ nhỏ hoặc người phụ thuộc; tiếng Việt cho phép dùng “vợ” ở dạng không đánh dấu số trong cấu trúc sở hữu chung.
theological_decisions:
- issue: Nghĩa của מִשְׁכַּן trong câu này
  choice: nơi ở
  alternative: Đền Tạm
  rationale: Các tên người theo sau và bối cảnh địa lý cho thấy đây là nơi cư trú hoặc khu trại của Cô-rê, Đa-than và A-bi-ram; dịch là “Đền Tạm” sẽ dễ gây nhầm với nơi thánh của Đức Giê-hô-va.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong tiếng Việt: Cô-rê, Đa-than, A-bi-ram. Tránh dùng “Đền Tạm” cho מִשְׁכַּן vì không phù hợp với sở chỉ trong câu này.'
