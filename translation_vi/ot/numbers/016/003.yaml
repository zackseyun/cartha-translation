language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֣וּ אֲלֵ/הֶם֮ רַב לָ/כֶם֒ כִּ֤י כָל הָֽ/עֵדָה֙ כֻּלָּ֣/ם קְדֹשִׁ֔ים וּ/בְ/תוֹכָ֖/ם יְהוָ֑ה וּ/מַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל קְהַ֥ל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: vi
  text: 'Họ tụ tập chống lại Môi-se và A-rôn, rồi nói với hai ông: “Hai ông đã đi quá xa rồi![a] Vì cả hội chúng—tất cả mọi người—đều là thánh, và Yahweh ở giữa họ.[b] Vậy tại sao hai ông lại tự nâng mình lên trên hội chúng của Yahweh?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ có thể dịch sát là “Đủ rồi, hai ông!” hoặc “Quá lắm rồi, hai ông!” Đây là một thành ngữ quở trách.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” phiên âm danh riêng יהוה (YHWH) của Đức Chúa Trời; danh này đôi khi được dịch theo truyền thống là “CHÚA” hoặc “Đức Giê-hô-va.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: tụ tập chống lại
  rationale: Giữ nghĩa tập hợp có chủ ý của động từ קהל và sắc thái đối đầu của giới từ עַל trong văn cảnh.
- source_word: רַב לָכֶם
  choice: Hai ông đã đi quá xa rồi!
  rationale: Diễn đạt tự nhiên sức nặng của lời quở trách; đại từ “hai ông” làm rõ số nhiều hướng đến Môi-se và A-rôn mà không thêm ý ngoài văn bản.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: cả hội chúng—tất cả mọi người—
  rationale: Bảo toàn sự nhấn mạnh kép về tính toàn thể trong tiếng Hê-bơ-rơ.
- source_word: קְדֹשִׁים
  choice: đều là thánh
  rationale: “Thánh” là cách dịch trực tiếp, quen thuộc và có trọng lượng thần học của קָדוֹשׁ; “đều” chuyển tải số nhiều cùng ý nhấn mạnh của câu.
- source_word: וּבְתוֹכָם יְהוָה
  choice: và Yahweh ở giữa họ
  rationale: Diễn đạt sự hiện diện của Đức Chúa Trời trong cộng đồng, đồng thời giữ danh riêng giao ước YHWH dưới dạng Yahweh.
- source_word: תִּתְנַשְּׂאוּ עַל
  choice: tự tôn mình lên trên
  rationale: Phản ánh dạng phản thân của động từ và lời cáo buộc hai người tự nâng mình cao hơn cộng đồng.
- source_word: קְהַל יְהוָה
  choice: hội chúng của Yahweh
  rationale: “Hội chúng” tự nhiên trong tiếng Việt và phù hợp với cộng đồng Israel được triệu tập; giữ nguyên danh Yahweh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ danh riêng được văn bản Hê-bơ-rơ dùng trực tiếp, không thay bằng một tước hiệu.
- issue: Lời khẳng định rằng toàn thể hội chúng đều thánh
  choice: Trình bày thẳng như lời của những người đang nói
  alternative: Thêm từ ngữ hàm ý họ chỉ tự nhận là thánh hoặc lời họ sai
  rationale: Không đưa sự phán xét của mạch truyện vào chính lời phát biểu, nhờ đó bảo toàn căng thẳng thần học của phân đoạn.
- issue: Sắc thái của רַב לָכֶם
  choice: Hai ông đã đi quá xa rồi!
  alternative: Đủ rồi, hai ông!; Quá đủ cho hai ông!
  rationale: Chọn thành ngữ tiếng Việt hiện đại truyền đạt rõ lời cáo buộc, đồng thời ghi cách nói sát chữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hai ông” vì lời nói trực tiếp nhắm đến Môi-se và A-rôn; dùng dấu gạch ngang để giữ sức nhấn mạnh của cấu trúc Hê-bơ-rơ כָל ... כֻּלָּם.
