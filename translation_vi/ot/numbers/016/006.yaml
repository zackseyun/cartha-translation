  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: vi
  text: 'Hãy làm thế này: Cô-ra và toàn thể hội chúng của ông, hãy lấy cho mình những lư hương[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những chảo đựng lửa”. Từ Hê-bơ-rơ chỉ các vật dụng dùng để đựng than đang cháy, đặc biệt trong nghi thức dâng hương.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “toàn thể đoàn người” hoặc “toàn thể cộng đồng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: Hãy làm thế này
  rationale: Cách diễn đạt mệnh lệnh tự nhiên trong tiếng Việt, đồng thời giữ đại từ chỉ định hướng tới chỉ dẫn sắp được nêu.
- source_word: קְחוּ לָכֶם
  choice: hãy lấy cho mình
  rationale: Giữ mệnh lệnh số nhiều của קְחוּ và sắc thái phản thân của לָכֶם mà không làm câu tiếng Việt nặng nề.
- source_word: מַחְתּוֹת
  choice: những lư hương
  rationale: Trong bối cảnh nghi lễ dâng hương, “lư hương” là từ rõ ràng, quen thuộc; chú thích bảo lưu nghĩa rộng hơn là dụng cụ đựng than lửa.
- source_word: קֹרַח
  choice: Cô-ra
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc đối với độc giả Việt.
- source_word: וְכָל עֲדָתוֹ
  choice: và toàn thể hội chúng của ông
  rationale: “Hội chúng” giữ nghĩa một tập thể được quy tụ của עֵדָה; “của ông” thể hiện hậu tố sở hữu ngôi thứ ba số ít.
