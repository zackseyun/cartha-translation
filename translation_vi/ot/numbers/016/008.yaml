  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: vi
  text: 'Rồi Môi-se nói với Cô-ra: “Hỡi các con trai Lê-vi, hãy nghe đây![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin hãy nghe, hỡi các con trai Lê-vi,” hoặc: “Hỡi những người Lê-vi, hãy nghe đây!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Động từ với waw liên tiếp đẩy mạch kể tiến lên; “Rồi ... nói” tự nhiên trong tiếng Việt và giữ rõ trình tự.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֶל־קֹרַח
  choice: với Cô-ra
  rationale: Trong công thức phát ngôn, אֶל chỉ người được nói với; “nói với Cô-ra” là cách diễn đạt tự nhiên.
- source_word: שִׁמְעוּ
  choice: hãy nghe
  rationale: Mệnh lệnh số nhiều của שׁמע, mang sức nặng của lời kêu gọi chú ý; “hãy nghe” giữ sắc thái trang trọng.
- source_word: נָא
  choice: đây
  rationale: Tiểu từ thúc giục hoặc làm dịu mệnh lệnh; trong bối cảnh đối chất, “hãy nghe đây” chuyển tải lời thúc giục trực tiếp hơn “xin hãy nghe”.
- source_word: בְּנֵי לֵוִי
  choice: các con trai Lê-vi
  rationale: Giữ hình thức thân tộc giống đực của nguyên văn, đồng thời diễn đạt rõ lời gọi trực tiếp đến những người nam thuộc dòng Lê-vi.
theological_decisions:
- issue: Danh xưng thân tộc mang giống trong lời gọi trực tiếp
  choice: các con trai Lê-vi
  alternative: người Lê-vi; con cháu Lê-vi
  rationale: Nguyên văn dùng danh từ giống đực số nhiều “các con trai của Lê-vi”; bản dịch giữ nét giới tính và hình ảnh dòng dõi thay vì trung hòa thành tên bộ tộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự lời gọi được điều chỉnh cho tự nhiên trong tiếng Việt; dấu chấm than thể hiện sức thúc giục của mệnh lệnh và tiểu từ נָא.
