revisions:
- from: 'Bấy giờ, Môi-se nổi giận dữ dội và thưa với Yahweh: “Xin đừng đoái đến lễ vật của họ.[a] Con chưa từng lấy của họ dù chỉ một con lừa, cũng chưa từng làm hại bất cứ ai trong họ.”'
  to: 'Bấy giờ, Môi-se rất tức giận và thưa với Yahweh: “Xin đừng đoái đến lễ vật của họ.[a] Tôi chưa từng lấy của họ dù chỉ một con lừa, cũng chưa từng làm hại bất cứ ai trong số họ.”'
  rationale: Điều chỉnh hạn chế để bản văn tự nhiên hơn và tránh thêm đại từ xưng hô không có trong nguyên ngữ. Giữ nguyên «đoái đến», «lễ vật», tên Yahweh và chú thích, vì chúng truyền đạt trung thành ý nghĩa cùng sự mơ hồ hợp lý của nguyên văn.
  reviewer_model: gpt-5.6-terra
