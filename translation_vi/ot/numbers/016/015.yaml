  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se rất tức giận và thưa với Yahweh: “Xin đừng đoái đến lễ vật của họ.[a] Tôi chưa từng lấy của họ dù chỉ một con lừa, cũng chưa từng làm hại bất cứ ai trong số họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin đừng lưu tâm đến lễ vật của họ” hoặc “Xin đừng chấp nhận lễ vật của họ.” Tiếng Hê-bơ-rơ theo nghĩa đen là “Xin đừng quay về phía lễ vật của họ.”'
    reason: Nêu nghĩa đen và các sắc thái khả dĩ của פנה אל mà không giải quyết dứt khoát sự mơ hồ.
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: Môi-se nổi giận dữ dội
  rationale: Thành ngữ חרה ל diễn tả cơn giận bùng lên; מְאֹד tăng cường mức độ. Cách dịch này tự nhiên trong tiếng Việt và giữ nguyên sắc thái mạnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng tên riêng của Đức Chúa Trời theo Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Xin đừng đoái đến lễ vật của họ
  rationale: פנה אל có nghĩa đen là quay về phía, nhưng trong lời cầu nguyện tại đây hàm ý lưu tâm hoặc ưu ái chấp nhận. “Đoái đến” giữ được phần nào hình ảnh hướng sự chú ý đến và tự nhiên, trang trọng trong tiếng Việt; chú thích nêu nghĩa đen và khả năng hiểu là không chấp nhận.
- source_word: מִנְחָתָם
  choice: lễ vật của họ
  rationale: מִנְחָה có thể chỉ quà biếu, cống vật hoặc lễ vật. “Lễ vật” phù hợp bối cảnh thờ phượng mà không thu hẹp thành lễ vật ngũ cốc.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: Con chưa từng lấy của họ dù chỉ một con lừa
  rationale: נשא ở đây chỉ việc lấy hoặc chiếm dụng. “Dù chỉ một con lừa” giữ hình ảnh cụ thể và nhấn mạnh lời phủ nhận sự trục lợi.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: cũng chưa từng làm hại bất cứ ai trong họ
  rationale: Dạng Hiphil của רעע có nghĩa gây điều xấu hoặc làm hại. Cách dịch này ngắn gọn, tự nhiên và giữ phạm vi phủ định đối với từng người.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng Tứ Tự Danh; giữ “Yahweh” bảo tồn chức năng tên riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa lời xin אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Xin đừng đoái đến lễ vật của họ
  alternative: Xin đừng chấp nhận lễ vật của họ; Xin đừng quay về phía lễ vật của họ
  rationale: Động từ giữ hình ảnh quay/hướng đến nhưng trong ngữ cảnh cầu nguyện có thể hàm ý nhìn đến với sự ưu ái hay chấp nhận. Bản chính dùng cách nói tự nhiên mà không khẳng định quá mức; chú thích bảo tồn các khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa với” phù hợp lời Môi-se hướng lên Đức Chúa Trời; đại từ “Con” thể hiện quan hệ trong lời cầu nguyện mà không thêm một tước hiệu vào danh Yahweh.
