    issue: Đại từ «Con» được thêm vào lời Môi-se.
    rationale: Nguyên văn chỉ có ngôi thứ nhất trong động từ («tôi đã không lấy...; tôi đã không làm hại...»), không có từ tương ứng với «Con». Trong lời cầu nguyện tiếng Việt, «con» là cách xưng hô có thể chấp nhận, nhưng ở đây thêm một sắc thái quan hệ không cần thiết; bỏ đại từ giữ sát nguồn hơn.
  - severity: low
