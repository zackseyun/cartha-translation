  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: vi
  text: Hãy cho lửa vào các lư hương ấy và đặt hương lên các lư hương ấy trước mặt Yahweh vào ngày mai. Bấy giờ, người nào Yahweh chọn, chính người ấy là người thánh. Hỡi những người con của Lê-vi, các ngươi đã đi quá xa rồi![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thế là quá đủ cho các ngươi rồi, hỡi những người con của Lê-vi!”'
    reason: Cụm רַב לָכֶם theo sát chữ là “nhiều/quá đủ cho các ngươi”; trong ngữ cảnh, nó cũng có thể là lời quở trách rằng họ đã vượt quá giới hạn.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: Hãy bỏ lửa vào các lư hương ấy
  rationale: Động từ נָתַן với בְּ diễn tả việc cho lửa vào các vật chứa; “các lư hương” được làm rõ từ tiền cảnh ngay trước đó, giúp câu tiếng Việt tự nhiên mà không đổi nghĩa.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: và đặt hương lên trên
  rationale: שׂים là “đặt, để”; giới từ עַל cho biết hương được đặt trên lửa trong các lư hương.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ hành động được thực hiện trong sự hiện diện của Đức Chúa Trời, đồng thời chuyển danh riêng giao ước יְהוָה là “Yahweh”.
- source_word: מָחָר
  choice: vào ngày mai
  rationale: Cách diễn đạt thời gian trực tiếp và tự nhiên trong tiếng Việt.
- source_word: וְהָיָה
  choice: Bấy giờ
  rationale: Thể hiện kết quả sẽ được nhận biết qua phép thử vừa truyền, tự nhiên hơn lối dịch sát chữ “và sẽ xảy ra”.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: người nào Yahweh chọn
  rationale: Diễn đạt tự nhiên cấu trúc quan hệ chỉ người sẽ được Yahweh tuyển chọn; “người” không loại bỏ việc danh từ nguồn ở giống đực.
- source_word: הוּא הַקָּדוֹשׁ
  choice: chính người ấy là người thánh
  rationale: Từ “chính” phản ánh đại từ nhấn mạnh הוּא, còn “người thánh” giữ mạo từ xác định trước קָדוֹשׁ thay vì chỉ nói chung rằng người ấy thánh khiết.
- source_word: רַב לָכֶם
  choice: các ngươi đã đi quá xa rồi
  rationale: Trong ngữ cảnh, thành ngữ này là lời quở trách những người đã vượt quá giới hạn; cách dịch giữ sức nặng tu từ và có chú thích nêu cách hiểu sát chữ hơn.
- source_word: בְּנֵי לֵוִי
  choice: các con trai Lê-vi
  rationale: Giữ hình ảnh gia tộc và lời xưng hô trực tiếp của nguyên văn, thay vì khái quát thành “người Lê-vi”.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa lời quở trách רַב לָכֶם
  choice: các ngươi đã đi quá xa rồi
  alternative: Thế là quá đủ cho các ngươi rồi; Việc ấy quá sức các ngươi
  rationale: Ngữ cảnh cho thấy Môi-se đáp lại việc họ vượt quá phận sự, nhưng chú thích vẫn bảo tồn khả năng chuyển sát cấu trúc định lượng của câu Hê-bơ-rơ.
- issue: Sắc thái xác định của הַקָּדוֹשׁ
  choice: người thánh
  alternative: người thánh khiết; người được biệt riêng
  rationale: Giữ danh xưng có mạo từ mà không diễn giải thêm nội dung thần học của sự thánh hóa hay chức vụ tư tế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “các ngươi” để giữ sắc thái quở trách trong lời nói với một nhóm người; dùng “Hỡi” cho lời gọi đích danh ở cuối câu. Bổ sung danh từ “các lư hương” từ tiền cảnh rõ ràng để tránh đại từ mơ hồ trong tiếng Việt.
