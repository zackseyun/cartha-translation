review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng các mệnh lệnh liên quan đến lư hương, thời điểm «ngày mai», sự tuyển chọn của Yahweh, danh xưng xác định «người thánh», và lời quở trách kết thúc. Tuy nhiên, «đặt hương lên trên» thiếu bổ ngữ trong tiếng Việt và không cho biết rõ hương được đặt trên các lư hương đã nêu; cần khôi phục quy chiếu ấy.
  naturalness: «Bỏ lửa» và «đặt hương lên trên» hơi khẩu ngữ hoặc lửng trong văn xuôi Kinh Thánh hiện đại. «Cho lửa vào» và «đặt hương lên các lư hương ấy» tự nhiên, rõ nghĩa hơn. «Những người con của Lê-vi» tự nhiên hơn «các con trai Lê-vi» trong lời gọi trực tiếp, đồng thời vẫn giữ hình ảnh gia tộc của nguyên văn.
  terminology: Giữ «Yahweh» nhất quán với chính sách dự án. «Lư hương», «hương», và «người thánh» phù hợp ngữ cảnh nghi lễ và duy trì tính xác định của הַקָּדוֹשׁ mà không diễn giải thành chức vụ cụ thể.
  issues:
  - severity: medium
    issue: Cụm «đặt hương lên trên» bị thiếu đối tượng/quy chiếu.
    rationale: Nguyên văn có עֲלֵיהֶן, «trên chúng», quy về các lư hương trong ngữ cảnh trước. Câu Việt hiện tại có thể bị đọc như một cụm dang dở; thêm «các lư hương ấy» làm rõ mà không thêm nghĩa.
  - severity: low
    issue: «Bỏ lửa» có sắc thái khẩu ngữ và «các con trai Lê-vi» không thật tự nhiên trong lời xưng hô hiện đại.
    rationale: «Cho lửa vào» phù hợp hơn với vật chứa là lư hương. «Những người con của Lê-vi» giữ nghĩa đen בני לוי nhưng trôi chảy hơn trong tiếng Việt hiện đại.
