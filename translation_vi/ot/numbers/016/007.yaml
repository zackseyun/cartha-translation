revisions:
- from: Hãy bỏ lửa vào các lư hương ấy và đặt hương lên trên, trước mặt Yahweh vào ngày mai. Bấy giờ, người nào Yahweh chọn, chính người ấy là người thánh. Hỡi các con trai Lê-vi, các ngươi đã đi quá xa rồi![a]
  to: Hãy cho lửa vào các lư hương ấy và đặt hương lên các lư hương ấy trước mặt Yahweh vào ngày mai. Bấy giờ, người nào Yahweh chọn, chính người ấy là người thánh. Hỡi những người con của Lê-vi, các ngươi đã đi quá xa rồi![a]
  rationale: Bản sửa chỉ làm rõ đại từ «chúng» trong mệnh đề thứ hai và điều chỉnh vài cách diễn đạt để văn phong hiện đại, trang trọng, tự nhiên hơn. Cấu trúc, thời điểm, danh riêng Yahweh, tính xác định của «người thánh», và sức mạnh lời quở trách đều được giữ nguyên. Chú thích được cập nhật để khớp với lời gọi đã sửa.
