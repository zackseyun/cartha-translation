revisions:
- from: Há chẳng đủ sao, khi ông đã đưa chúng tôi lên khỏi một xứ đượm sữa và mật để giết chúng tôi trong hoang mạc, mà ông còn muốn cai trị chúng tôi như một bậc thủ lĩnh nữa?[a][b]
  to: 'Há là chuyện nhỏ sao: ông đã đưa chúng tôi lên khỏi một xứ đượm sữa và mật để giết chúng tôi trong hoang mạc, rồi còn tự đặt mình làm người cai trị chúng tôi nữa sao?[a][b]'
