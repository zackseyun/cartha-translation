  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: vi
  text: 'Há là chuyện nhỏ sao: ông đã đưa chúng tôi lên khỏi một xứ đượm sữa và mật để giết chúng tôi trong hoang mạc, rồi còn tự đặt mình làm người cai trị chúng tôi nữa sao?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Những người nói dùng cách mỉa mai khi gọi Ai Cập là “một xứ đượm sữa và mật”; ở những chỗ khác, cách nói này thường chỉ về đất hứa.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “rồi còn lộng quyền trên chúng tôi nữa sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Há chẳng đủ sao
  rationale: 'Diễn đạt tự nhiên câu hỏi tu từ đầy phẫn nộ: điều đã bị tố cáo không những nghiêm trọng mà còn chưa phải là tất cả.'
- source_word: הֶעֱלִיתָנוּ
  choice: đã đưa chúng tôi lên
  rationale: Giữ nghĩa Hiphil của עלה là “đưa lên”, đồng thời bảo tồn ngôn ngữ chuyển động gắn với cuộc xuất hành và sắc thái mỉa mai trong lời những người nổi loạn.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: khỏi một xứ đượm sữa và mật
  rationale: Giữ nguyên hình ảnh quen thuộc chỉ sự phồn thịnh; trong ngữ cảnh này, người nói cố ý áp dụng cho Ai Cập cách diễn đạt thường dùng về đất hứa.
- source_word: לַהֲמִיתֵנוּ
  choice: để giết chúng tôi
  rationale: Chuyển trực tiếp động từ nguyên mẫu chỉ mục đích, giữ nguyên sức nặng của lời cáo buộc.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: “Hoang mạc” là cách nói trang trọng, dễ hiểu cho vùng hoang vu nơi dân Y-sơ-ra-ên đang lưu lạc, không nhất thiết chỉ một sa mạc toàn cát.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: muốn cai trị chúng tôi như một bậc thủ lĩnh
  rationale: Diễn đạt ý tự đặt mình làm người cai trị; cụm “như một bậc thủ lĩnh” bảo tồn liên hệ với ý nghĩa làm thủ lĩnh của שׂרר, còn “cai trị” chuyển tải hành vi thực thi quyền lực. Hình thức động từ hữu hạn đi với nguyên mẫu tuyệt đối tạo sắc thái nhấn mạnh.
- source_word: גַּם
  choice: còn ... nữa
  rationale: 'Cặp từ tiếng Việt này tự nhiên thể hiện lời khiếu nại được thêm vào: không chỉ dẫn họ đến chỗ chết mà còn cai trị họ.'
theological_decisions:
- issue: Cách gọi Ai Cập là “một xứ đượm sữa và mật”
  choice: Giữ nguyên hình ảnh trong chính văn và giải thích sắc thái mỉa mai ở chú thích
  alternative: Thêm trực tiếp một dấu hiệu giải thích như “cái gọi là một xứ đượm sữa và mật”
  rationale: Bản Hê-bơ-rơ để ngữ cảnh tự tạo nên sự mỉa mai. Nói rõ trong chính văn sẽ giải quyết thay cho độc giả một sự căng thẳng mà nguyên tác cố ý giữ lại.
- issue: Sắc thái của động từ שׂרר được nhấn mạnh bằng nguyên mẫu tuyệt đối
  choice: “cai trị chúng tôi như một bậc thủ lĩnh”
  alternative: “lộng quyền trên chúng tôi”
  rationale: Lựa chọn chính giữ cả ý cai trị lẫn hình ảnh thủ lĩnh, đồng thời tránh mặc nhiên quy động cơ lạm quyền vượt quá lời nguyên tác; phương án khác được ghi chú vì có thể chuyển tải sắc thái thống trị trong lời cáo buộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Há chẳng đủ sao” giữ lực của câu hỏi tu từ; “ông” phù hợp với lời đối chất trực tiếp nhưng không mang sắc thái kính trọng quá mức. Các chú thích [a], [b] xuất hiện trong chính văn theo đúng thứ tự.
