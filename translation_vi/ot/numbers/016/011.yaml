source:
  edition: WLC
  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: vi
  text: Vì thế, ngươi và cả nhóm của ngươi, là những kẻ tụ họp chống lại Yahweh—còn A-rôn là ai mà các ngươi lại kêu trách A-rôn?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Vì thế
  rationale: Giữ rõ ý suy luận từ lời cáo buộc ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: עֲדָתְךָ
  choice: phe nhóm của ngươi
  rationale: Trong ngữ cảnh, từ này chỉ nhóm người theo Cô-ra nổi loạn; “phe nhóm” truyền đạt sắc thái bè phái tốt hơn “hội chúng” mà không biến nó thành một thuật ngữ giáo hội.
- source_word: הַנֹּעָדִים
  choice: những kẻ đã tụ họp
  rationale: Diễn đạt phân từ Niphal của יעד, chỉ những người đã cùng tụ họp; không thêm động cơ ngoài điều văn bản nói.
- source_word: עַל
  choice: chống lại
  rationale: Ngữ cảnh nổi loạn đòi hỏi nghĩa đối nghịch, không chỉ đơn thuần là “trước mặt” hay “về việc”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước YHWH thay vì thay thế bằng một tước hiệu.
- source_word: וְאַהֲרֹן מַה הוּא
  choice: Còn A-rôn là ai
  rationale: Giữ câu hỏi tu từ hạ thấp vai trò cá nhân của A-rôn, qua đó nhấn mạnh rằng đối tượng thật sự của cuộc nổi loạn là Yahweh.
- source_word: תלונו
  choice: các ngươi lại lẩm bẩm
  rationale: “Lẩm bẩm” tự nhiên và giữ sắc thái bất mãn, chống đối thường gắn với động từ לון trong các trình thuật đồng hoang.
- source_word: עָלָיו
  choice: chống ông ấy
  rationale: Giữ lực đối nghịch của giới từ và xác định A-rôn là người trực tiếp bị họ lẩm bẩm chống lại.
theological_decisions:
- issue: Cách chuyển dịch danh YHWH
  choice: Yahweh
  alternative: ĐỨC CHÚA hoặc Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh יהוה; giữ “Yahweh” bảo tồn đặc tính danh riêng thay vì thay bằng tước hiệu.
- issue: Đối tượng thật sự của cuộc nổi loạn
  choice: Tách thành hai câu để cho thấy cả phe nhóm tụ họp chống Yahweh, còn A-rôn được nhắc đến bằng câu hỏi tu từ.
  alternative: Hiểu rằng họ tụ họp chống Yahweh và A-rôn như hai đối tượng ngang hàng.
  rationale: Cú pháp trước hết nói họ tụ họp chống Yahweh, rồi mới thêm câu hỏi “A-rôn là ai?”; cách dịch duy trì trọng tâm này mà không phủ nhận rằng họ trực tiếp lẩm bẩm chống A-rôn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Đại từ “ngươi/các ngươi” phản ánh việc Môi-se chuyển từ nói với người đứng đầu sang cả nhóm. “Phe nhóm” phù hợp bối cảnh tranh chấp; “lẩm bẩm” giữ âm hưởng quen thuộc của các trình thuật đồng hoang mà vẫn dễ hiểu.
