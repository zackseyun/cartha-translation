  source_fidelity: 'Bản dịch chuyển tải đầy đủ trật tự và các thành tố chính của tiếng Hê-bơ-rơ: đất được nhân hóa “há miệng,” hành động nuốt, các đối tượng “họ,” “gia quyến/nhà cửa của họ,” mọi người liên hệ với Cô-ra, và toàn bộ tài sản. “Tất cả những người thuộc về Cô-ra” diễn đạt tự nhiên giá trị tập hợp của כָּל־הָאָדָם mà không áp đặt giới tính hoặc xác định quá mức bản chất mối liên hệ do לְ diễn tả.'
