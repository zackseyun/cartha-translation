id: NUM.16.32
reference: Numbers 16:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תִּפְתַּ֤ח הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלַ֥ע אֹתָ֖/ם וְ/אֶת בָּתֵּי/הֶ֑ם וְ/אֵ֤ת כָּל הָ/אָדָם֙ אֲשֶׁ֣ר לְ/קֹ֔רַח וְ/אֵ֖ת כָּל הָ/רֲכֽוּשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: vi
  text: Đất há miệng nuốt chửng họ, gia quyến họ[a], tất cả những người thuộc về Cô-ra[b], cùng toàn bộ tài sản của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhà cửa của họ.” Từ Hê-bơ-rơ có thể chỉ các ngôi nhà hoặc, theo nghĩa mở rộng, những người trong gia đình.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng một danh từ số ít mang nghĩa tập hợp: “toàn thể người thuộc về Cô-ra”; cũng có thể hiểu là “mọi người ở với Cô-ra.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: Đất há miệng
  rationale: Giữ nguyên hình ảnh nhân hóa rất cụ thể của tiếng Hê-bơ-rơ; “há miệng” tự nhiên hơn “mở miệng” khi nói đến hành động nuốt.
- source_word: וַתִּבְלַע
  choice: nuốt chửng
  rationale: Diễn đạt trực tiếp động từ בלע và phù hợp với hình ảnh đất há miệng; “chửng” làm câu tự nhiên, mạnh mẽ mà không thay đổi nội dung.
- source_word: בָּתֵּיהֶם
  choice: gia quyến họ
  rationale: בַּיִת ở số nhiều có thể chỉ nhà cửa hoặc, theo nghĩa hoán dụ, các hộ/gia quyến. Trong chuỗi các đối tượng bị nuốt, “gia quyến” là cách hiểu hợp ngữ cảnh, đồng thời nghĩa đen được ghi ở chú thích.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: tất cả những người thuộc về Cô-ra
  rationale: הָאָדָם là danh từ số ít mang nghĩa tập hợp trong cấu trúc với כָּל. Tiếng Việt không buộc phải đánh dấu giống ngữ pháp ở đây; “những người” truyền đạt nghĩa tập hợp tự nhiên, còn “thuộc về” giữ quan hệ rộng của לְ.
- source_word: כָּל־הָרֲכוּשׁ
  choice: toàn bộ tài sản của họ
  rationale: רְכוּשׁ chỉ của cải, tài vật hay tài sản; “tài sản” là từ hiện đại, rõ nghĩa và đủ rộng.
theological_decisions:
- issue: Phạm vi của הָאָדָם trong cụm כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: tất cả những người thuộc về Cô-ra
  alternative: mọi người ở với Cô-ra
  rationale: Cụm Hê-bơ-rơ dùng אָדָם theo nghĩa tập hợp và giới từ לְ có thể diễn tả sự thuộc về hoặc liên hệ. Bản dịch chính giữ cách nói rộng, không xác định sâu hơn bản văn xem đây là thân thuộc, người hầu hay phe cánh.
- issue: Nghĩa của בָּתֵּיהֶם
  choice: gia quyến họ
  alternative: nhà cửa của họ
  rationale: Ngữ cảnh kể các sinh thể và tài sản bị nuốt khiến nghĩa “gia quyến” có vẻ phù hợp, nhưng nghĩa vật chất “nhà cửa” vẫn thực sự có thể có nên được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đất há miệng” để bảo toàn phép nhân hóa; dùng tên riêng “Cô-ra” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc. Hai chú thích bảo lưu những điểm mơ hồ thực sự của בָּתֵּיהֶם và quan hệ לְקֹרַח.
