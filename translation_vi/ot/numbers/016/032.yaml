  terminology: Tên “Cô-ra” nhất quán với cách phiên âm Kinh Thánh tiếng Việt quen dùng. “Gia quyến” và “tài sản” phù hợp ngữ cảnh; các chú thích bảo lưu đúng những khả năng ngữ nghĩa quan trọng của בָּתֵּיהֶם và cụm chỉ người liên hệ với Cô-ra.
