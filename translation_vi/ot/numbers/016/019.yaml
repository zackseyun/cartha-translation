  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: vi
  text: Cô-ra tập hợp toàn thể cộng đồng chống lại họ tại lối vào Lều Hội Kiến. Bấy giờ, vinh quang của Yahweh[a] hiện ra cho toàn thể cộng đồng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; theo truyền thống thường được dịch là “ĐỨC CHÚA”.'
    reason: Ghi nhận danh Tứ Tự và cách dịch truyền thống.
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: tập hợp
  rationale: Dạng Hiphil diễn tả Cô-ra chủ động khiến cộng đồng tụ họp; “tập hợp” tự nhiên và giữ được vai trò chủ động ấy.
- source_word: עֲלֵיהֶם
  choice: chống lại họ
  rationale: Trong bối cảnh cuộc nổi loạn chống Môi-se và A-rôn, giới từ עַל mang sắc thái đối nghịch; “chống lại họ” thể hiện đúng hướng thù nghịch của cuộc tụ họp.
- source_word: כָּל־הָעֵדָה
  choice: toàn thể cộng đồng
  rationale: עֵדָה chỉ cộng đồng Israel được quy tụ như một tập thể; “toàn thể” chuyển tải כָּל, còn “cộng đồng” là cách nói hiện đại, dễ hiểu.
- source_word: אֶל־פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: פֶּתַח là lối vào; trong ngữ cảnh tụ họp, “tại” diễn đạt địa điểm tự nhiên. “Lều Hội Kiến” giữ ý nghĩa danh xưng אֹהֶל מוֹעֵד và văn phong trang trọng.
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Dạng Niphal của ראה ở đây là cách diễn đạt quen thuộc về sự hiển hiện có thể nhận biết; “hiện ra” ngắn gọn và không xác định quá mức cách thức.
- source_word: כְבוֹד יְהוָה
  choice: vinh quang của Yahweh
  rationale: כָּבוֹד trong ngữ cảnh này nói đến sự hiển hiện đầy uy nghi của sự hiện diện thần linh; cấu trúc “vinh quang của…” bám sát nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל־כָּל־הָעֵדָה
  choice: cho toàn thể cộng đồng
  rationale: Giới từ אֶל đánh dấu đối tượng mà sự hiển hiện hướng đến; “hiện ra cho” là tiếng Việt tự nhiên và giữ được nghĩa này.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng danh riêng יְהוָה. Phiên âm “Yahweh” bảo toàn tư cách danh riêng và tránh thay bằng tước hiệu; chú thích ghi nhận truyền thống dịch khác.
- issue: Tính chất của כְבוֹד יְהוָה
  choice: vinh quang của Yahweh hiện ra
  alternative: Yahweh bày tỏ sự hiện diện hữu hình
  rationale: Giữ cách nói của nguyên văn, không xác định thêm hình thức hay cơ chế của sự hiển hiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Cô-ra” theo lối phiên âm tên riêng quen thuộc; “Lều Hội Kiến” như một danh xưng thánh sở. Thêm “Bấy giờ” để nối hai mệnh đề tự nhiên mà không bổ sung quan hệ nhân quả.
