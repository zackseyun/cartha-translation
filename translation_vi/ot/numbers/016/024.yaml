  text: 'Hãy nói với hội chúng: ‘Hãy đi lên khỏi khu vực quanh nơi ở của Cô-ra, Đa-than và A-bi-ram.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: hội chúng
  rationale: Chỉ toàn thể cộng đồng dân Y-sơ-ra-ên; “hội chúng” vừa sát nghĩa vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: הֵעָלוּ
  choice: hãy đi lên
  rationale: Giữ nghĩa cơ bản của động từ עלה và chi tiết định hướng trong nguyên văn, thay vì giản lược thành “hãy tránh xa”.
- source_word: מִסָּבִיב לְמִשְׁכַּן
  choice: tránh xa khu vực quanh nơi ở
  rationale: מִסָּבִיב diễn tả vùng bao quanh, còn מִשְׁכַּן ở đây là nơi ở/chỗ cư ngụ của những người được nêu tên. Cách diễn đạt này làm rõ mệnh lệnh rời khỏi vùng chung quanh mà không đồng nhất nơi ấy với Đền Tạm.
