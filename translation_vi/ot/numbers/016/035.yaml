language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֵ֥שׁ יָצְאָ֖ה מֵ/אֵ֣ת יְהוָ֑ה וַ/תֹּ֗אכַל אֵ֣ת הַ/חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ מַקְרִיבֵ֖י הַ/קְּטֹֽרֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: vi
  text: Lửa phát ra từ Yahweh và thiêu nuốt hai trăm năm mươi người đang dâng hương.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: Lửa
  rationale: אֵשׁ nghĩa là “lửa”. Tiếng Việt không cần mạo từ; liên từ וְ được thể hiện qua mạch kể liền với câu trước, tránh mở câu bằng “Và” một cách gượng ép.
- source_word: יָצְאָה
  choice: phát ra
  rationale: Động từ יצא có nghĩa là “đi ra, phát ra”. Với lửa xuất phát từ sự hiện diện của Đức Chúa Trời, “phát ra” vừa tự nhiên vừa giữ rõ ý nguồn gốc.
- source_word: מֵ/אֵת יְהוָה
  choice: từ Yahweh
  rationale: Cụm từ chỉ nguồn xuất phát từ Yahweh. “Từ Yahweh” rõ ràng và tự nhiên; cách sát hình thức hơn “từ trước mặt Yahweh” được giữ trong chú thích.
- source_word: וַ/תֹּאכַל
  choice: và thiêu nuốt
  rationale: אכל theo nghĩa đen là “ăn”, nhưng khi chủ thể là lửa thì có nghĩa “thiêu nuốt”. Cách dịch này giữ được hình ảnh mạnh của nguyên văn và vẫn tự nhiên trong tiếng Việt.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: hai trăm năm mươi người
  rationale: Cụm số đếm cùng אִישׁ chỉ một nhóm gồm 250 người; cách diễn đạt này chuẩn và tự nhiên trong tiếng Việt hiện đại.
- source_word: מַקְרִיבֵי
  choice: đang dâng
  rationale: Phân từ của קרב mô tả hành động những người ấy đang thực hiện vào thời điểm bị phán xét. “Đang dâng” làm rõ tính tiếp diễn mà không thêm ý ngoài văn bản.
- source_word: הַ/קְּטֹרֶת
  choice: hương
  rationale: קְטֹרֶת là hương dùng trong nghi lễ. Trong cụm “dâng hương”, tiếng Việt không cần từ xác định tương ứng với mạo từ Hebrew vì đối tượng đã rõ theo ngữ cảnh.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng này với các tước hiệu và không đưa truyền thống giáo phái riêng vào bản dịch.
- issue: Sắc thái của מֵאֵת trước danh Yahweh
  choice: từ Yahweh
  alternative: từ trước mặt Yahweh
  rationale: Cách chính diễn đạt tự nhiên nguồn phát xuất của lửa, trong khi chú thích bảo tồn khả năng dịch sát cấu trúc hơn, gợi đến sự hiện diện của Yahweh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Thiêu nuốt” giữ sức nặng của hình ảnh phán xét; “đang dâng hương” diễn đạt rõ hành động nghi lễ đang diễn ra.
