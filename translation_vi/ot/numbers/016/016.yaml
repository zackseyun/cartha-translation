source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל קֹ֔רַח אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הֱי֖וּ לִ/פְנֵ֣י יְהוָ֑ה אַתָּ֥ה וָ/הֵ֛ם וְ/אַהֲרֹ֖ן מָחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: vi
  text: 'Môi-se nói với Cô-ra: “Ngày mai, ngươi và toàn thể hội chúng của ngươi hãy có mặt trước mặt Yahweh[a]—ngươi, họ và A-rôn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong sự hiện diện của Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Môi-se nói
  rationale: Dạng kể chuyện với waw nối tiếp được diễn đạt tự nhiên trong tiếng Việt; không nhất thiết thêm “và” ở đầu câu.
- source_word: קֹרַח
  choice: Cô-ra
  rationale: Tên riêng được phiên âm theo cách quen thuộc và dễ đọc trong tiếng Việt.
- source_word: אַתָּה וְכָל עֲדָתְךָ
  choice: ngươi cùng toàn thể phe nhóm của ngươi
  rationale: Trong bối cảnh cuộc nổi loạn, עֵדָה chỉ nhóm người tụ tập theo Cô-ra; “phe nhóm” tự nhiên hơn “hội chúng” và tránh khiến người đọc hiểu là toàn thể dân Y-sơ-ra-ên.
- source_word: הֱיוּ
  choice: phải có mặt
  rationale: Mệnh lệnh số nhiều của היה có nghĩa đen là “hãy ở”, nhưng trong ngữ cảnh là hiện diện hoặc ra trình diện; “phải có mặt” rõ nghĩa mà không thêm ý phục tùng không có trong nguyên văn.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: Giữ hình ảnh không gian của לִפְנֵי, đồng thời truyền đạt ý ở trong sự hiện diện của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Phiên âm danh riêng giao ước YHWH theo hình thức đã quen thuộc trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: ngươi, họ và A-rôn
  rationale: Giữ nguyên danh sách ba bên được nguyên văn nêu rõ và nhấn mạnh.
- source_word: מָחָר
  choice: Ngày mai
  rationale: Trạng từ thời gian được đưa lên đầu lời nói để câu tiếng Việt tự nhiên, không thay đổi phạm vi ý nghĩa.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê) hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu; “Đức Giê-hô-va” là hình thức trang trọng, quen thuộc trong tiếng Việt.
- issue: Ý nghĩa của לִפְנֵי יהוה
  choice: trước mặt Đức Giê-hô-va
  alternative: trong sự hiện diện của Đức Giê-hô-va
  rationale: Cách dịch chính giữ sát thành ngữ Hê-bơ-rơ và không xác định thêm đây là một nghi thức trình diện hay chỉ là việc có mặt trước Đức Chúa Trời.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “ngươi” phù hợp với lời Môi-se nói trực tiếp với Cô-ra trong văn cảnh cổ, còn “họ” giúp giữ sự liệt kê nhấn mạnh của nguyên văn. Dấu gạch ngang bảo tồn phần nhắc lại mang tính xác định: “ngươi, họ và A-rôn”.'
