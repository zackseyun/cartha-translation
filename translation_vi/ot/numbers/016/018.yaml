base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: vi
  text: Vậy, mỗi người lấy lư đựng than[a] của mình, bỏ lửa vào đó rồi đặt hương lên trên. Họ đứng tại lối vào Lều Hội Kiến, cùng với Môi-se và A-rôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lư hương”. Từ Hê-bơ-rơ chỉ một vật dụng đựng than cháy để dâng hương.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: mỗi người lấy lư đựng than của mình
  rationale: אִישׁ được dùng theo nghĩa phân phối, chỉ từng người trong nhóm; hậu tố sở hữu số ít cho biết mỗi người cầm vật dụng riêng của mình. מַחְתָּה là vật dùng để đựng than cháy khi dâng hương; “lư đựng than” cụ thể và dễ hiểu hơn “lư hương” trong ngữ cảnh lửa được bỏ vào trước rồi hương được đặt lên trên.
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: bỏ lửa vào đó
  rationale: עַל có nghĩa đen là “trên”, nhưng khi nói về vật chứa, tiếng Việt tự nhiên dùng “vào”. “Đó” quy chiếu các lư đựng than mà không tạo cách nói nặng nề.
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: đặt hương lên trên
  rationale: Giữ nét nghĩa “trên” vì hương được đặt trên than cháy trong lư, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: קְטֹרֶת
  choice: hương
  rationale: “Hương” là từ thông dụng và trang trọng vừa phải cho chất thơm được đốt trong nghi lễ thờ phượng.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: lối vào Lều Hội Kiến
  rationale: פֶּתַח là lối vào hoặc cửa vào. “Lều Hội Kiến” diễn đạt אֹהֶל מוֹעֵד theo cách quen thuộc, chỉ chiếc lều nơi diễn ra cuộc gặp gỡ theo bối cảnh thờ phượng.
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: cùng với Môi-se và A-rôn
  rationale: Cụm không có động từ đứng sau địa điểm tự nhiên nhất cho biết Môi-se và A-rôn cũng đứng tại đó; “cùng với” làm rõ quan hệ đồng hiện diện mà không thêm diễn giải thần học.
