source:
  edition: WLC
  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: vi
  text: Nhưng nếu Yahweh làm nên một việc chưa từng có[a], đất há miệng nuốt chửng họ cùng tất cả những gì thuộc về họ, và họ còn sống mà đi xuống Sheol[b], thì anh em sẽ biết rằng những người này đã khinh miệt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tạo nên một điều mới lạ” hoặc “sáng tạo một sự sáng tạo.” Tiếng Hê-bơ-rơ dùng danh từ và động từ cùng gốc để nhấn mạnh một hành động phi thường của Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: Sheol là thuật ngữ Hê-bơ-rơ chỉ cõi người chết; trong nghĩa cụ thể hơn cũng có thể dịch là “phần mộ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: làm nên một việc chưa từng có
  rationale: Cụm danh từ–động từ cùng gốc nhấn mạnh một hành động sáng tạo phi thường của Đức Chúa Trời. Cách dịch này tự nhiên trong tiếng Việt, diễn đạt tính mới lạ chưa từng xảy ra mà không dùng lối nói gượng ép “sáng tạo một sự sáng tạo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng hình thức chuyển tự, thay vì thay thế bằng một tước hiệu.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: đất há miệng
  rationale: “Đất” phù hợp với mặt đất ngay bên dưới họ; hình ảnh nhân cách hóa “há miệng” được giữ nguyên.
- source_word: וּבָלְעָה
  choice: nuốt chửng
  rationale: Diễn đạt trực tiếp và mạnh động từ chỉ hành động nuốt, nhận chìm hoàn toàn.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: tất cả những gì thuộc về họ
  rationale: Giữ phạm vi bao quát của nguyên văn mà không tự ý giới hạn vào tài sản hay người phụ thuộc.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: họ còn sống mà đi xuống Sheol
  rationale: Giữ sự nhấn mạnh nghịch thường rằng họ đi xuống cõi chết khi vẫn còn sống, đồng thời bảo lưu thuật ngữ Hê-bơ-rơ Sheol.
- source_word: וִידַעְתֶּם
  choice: thì anh em sẽ biết
  rationale: “Thì” thể hiện rõ kết quả của mệnh đề điều kiện; “anh em” phản ánh ngôi thứ hai số nhiều.
- source_word: נִאֲצוּ
  choice: đã khinh miệt
  rationale: Truyền đạt sắc thái coi thường và xúc phạm mạnh của động từ Hê-bơ-rơ.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: những người này
  rationale: Trong tiếng Việt, “những người này” tự nhiên và không làm mất quy chiếu đến nhóm nam giới đang được nói tới trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch שְׁאוֹל
  choice: Sheol
  alternative: cõi người chết; phần mộ
  rationale: Sheol có thể chỉ cõi của người chết rộng hơn một ngôi mộ cụ thể. Giữ dạng chuyển tự trong chính văn bảo tồn độ rộng và sự căng thẳng thần học của thuật ngữ; chú thích cung cấp các cách hiểu chính.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ hình ảnh sống động “đất há miệng,” tên riêng Yahweh và thuật ngữ Sheol; tránh lối diễn đạt cổ hoặc gắn với truyền thống hệ phái cụ thể.
