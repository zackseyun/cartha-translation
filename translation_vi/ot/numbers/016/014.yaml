source:
  edition: WLC
  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: vi
  text: Quả thật, ông đã không đưa chúng tôi vào một xứ tràn đầy sữa và mật, cũng chẳng ban cho chúng tôi một phần sản nghiệp là ruộng đồng và vườn nho. Ông định móc mắt những người này sao?[a] Chúng tôi sẽ không lên đâu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông định làm cho những người này mù quáng sao?” Thành ngữ Hê-bơ-rơ theo nghĩa đen là “móc mắt”; cũng có thể hàm ý coi họ như mù trước sự thật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: Quả thật, ... không
  rationale: אַף nhấn mạnh lời cáo buộc; “Quả thật” truyền đạt sắc thái quyết liệt, còn לֹא được giữ bằng “không”.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: vào một xứ đượm sữa và mật
  rationale: Giữ hình ảnh quen thuộc của thành ngữ Hê-bơ-rơ về sự trù phú; “đượm” tự nhiên, trang trọng và vẫn bảo toàn ý tuôn tràn/dồi dào.
- source_word: הֲבִיאֹתָנוּ
  choice: ông đã không đưa chúng tôi
  rationale: Hình thức nghi vấn có chức năng tu từ trong lời trách cứ; chuyển thành câu khẳng định phủ định giúp tiếng Việt tự nhiên mà vẫn giữ nguyên cáo buộc.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: cũng chẳng ban cho chúng tôi đồng ruộng và vườn nho làm sản nghiệp
  rationale: נַחֲלָה là phần sở hữu được ban hoặc thừa hưởng. “Làm sản nghiệp” giữ ý này, còn “đồng ruộng và vườn nho” diễn đạt tự nhiên giá trị tập hợp của các danh từ số ít.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: Ông định móc mắt những người này sao?
  rationale: נקר ở thể Piel chỉ hành động móc/chọc mắt. Bản dịch giữ hình ảnh cụ thể và dữ dội, đồng thời chú thích khả năng đây là cách nói về việc làm người khác mù quáng hoặc lừa dối họ.
- source_word: הָאֲנָשִׁים הָהֵם
  choice: những người này
  rationale: Dù הָהֵם thường là “những người kia/đó”, trong lời nói trực tiếp, “những người này” tự nhiên khi chỉ nhóm người đang được nhắc đến và phù hợp sức nặng tu từ.
- source_word: לֹא נַעֲלֶה
  choice: Chúng tôi sẽ không lên đâu!
  rationale: עלה nghĩa đen là đi/lên. Ở đây Đa-than và A-bi-ram từ chối lời triệu gọi của Môi-se; “không lên đâu” giữ hướng nhìn của người triệu gọi và thể hiện sự cự tuyệt dứt khoát.
theological_decisions:
- issue: Câu hỏi về việc móc mắt có thể là nghĩa đen hoặc thành ngữ
  choice: Giữ hình ảnh cụ thể “móc mắt” trong chính văn
  alternative: “Ông định làm cho những người này mù quáng sao?”
  rationale: Nguyên văn dùng động từ cụ thể chỉ việc móc mắt nhưng ngữ cảnh có thể hàm ý lừa dối hoặc coi người ta như không thấy sự thật. Giữ nghĩa đen trong chính văn và nêu nghĩa bóng trong chú thích bảo toàn sự mơ hồ và sức mạnh tu từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng trực tiếp, thể hiện lời phản kháng gay gắt. Dùng “ông” vì đây là lời Đa-than và A-bi-ram nói với Môi-se trong thái độ đối đầu; câu cuối thêm “đâu” để truyền đạt sự cự tuyệt mạnh của nguyên văn.
