  to: Quả thật, ông đã không đưa chúng tôi vào một xứ tràn đầy sữa và mật, cũng chẳng ban cho chúng tôi một phần sản nghiệp là ruộng đồng và vườn nho. Ông định móc mắt những người này sao?[a] Chúng tôi sẽ không lên đâu!
