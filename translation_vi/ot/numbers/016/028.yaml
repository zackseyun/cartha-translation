  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: vi
  text: 'Môi-se nói: “Qua điều này, anh em sẽ biết rằng Yahweh đã sai tôi làm tất cả những việc này, và rằng tôi không làm những việc này theo ý riêng mình[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “không từ lòng tôi,” một thành ngữ nói rằng những việc ấy không xuất phát từ ý riêng hay sáng kiến của Môi-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Môi-se nói
  rationale: Lối kể chuyện Hê-bơ-rơ được chuyển tự nhiên sang tiếng Việt; không nhất thiết thêm liên từ nếu ngữ cảnh đã nối tiếp rõ ràng.
- source_word: בְּזֹאת
  choice: Qua điều này
  rationale: 'Diễn đạt nghĩa phương tiện/chứng cứ: sự việc sắp xảy ra sẽ cho thấy lời Môi-se là đúng.'
- source_word: תֵּדְעוּן
  choice: anh em sẽ biết
  rationale: Động từ ngôi hai số nhiều mang nghĩa tương lai trong ngữ cảnh; “anh em” thể hiện lời nói với một tập thể cách tự nhiên.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; dạng “Đức Giê-hô-va” quen thuộc và trang trọng trong tiếng Việt.
- source_word: שְׁלָחַנִי
  choice: đã sai tôi
  rationale: Diễn đạt hành động sai phái đã xảy ra và có hiệu lực đối với những việc đang được nói đến.
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: làm tất cả những việc này
  rationale: מַעֲשִׂים chỉ các việc làm/hành động; cách dịch này trực tiếp, tự nhiên và không thu hẹp nghĩa quá mức.
- source_word: כִּי לֹא מִלִּבִּי
  choice: chứ không phải do lòng tôi tự ý
  rationale: Giữ hình ảnh “từ lòng tôi” đồng thời làm rõ thành ngữ nói rằng Môi-se không hành động theo sáng kiến hay ý riêng.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh giao ước יהוה. Bản dịch giữ một dạng danh riêng quen thuộc trong tiếng Việt, không thay bằng tước hiệu và không thêm diễn giải thần học.
- issue: Nguồn gốc hành động của Môi-se
  choice: chứ không phải do lòng tôi tự ý
  alternative: vì không phải từ lòng tôi
  rationale: Cách dịch bảo tồn hình ảnh Hê-bơ-rơ về “lòng” nhưng cho độc giả hiện đại hiểu rằng những hành động ấy không bắt nguồn từ ý riêng của Môi-se; không xác định quá mức là chỉ nói về sáng kiến hay thẩm quyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ danh riêng của Đức Chúa Trời, hình ảnh “lòng,” và quan hệ đối lập trong mệnh đề cuối; dùng “anh em” cho đối tượng số nhiều.
