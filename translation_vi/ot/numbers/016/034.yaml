base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: vi
  text: 'Toàn thể dân Y-sơ-ra-ên ở chung quanh họ đều bỏ chạy khi nghe tiếng họ[a], vì họ nói: “Kẻo đất nuốt chửng chúng ta!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khi nghe tiếng kêu của họ.” Từ Hê-bơ-rơ qôl có thể có nghĩa là “tiếng”, “giọng” hoặc “tiếng kêu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: Toàn thể dân Y-sơ-ra-ên
  rationale: Diễn đạt ý nghĩa tập thể của כָל יִשְׂרָאֵל bằng tiếng Việt tự nhiên, đồng thời giữ tên gọi giao ước Y-sơ-ra-ên.
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: ở chung quanh họ
  rationale: Thể hiện mệnh đề quan hệ chỉ những người đang ở vùng lân cận nhóm vừa chịu phán xét, không hàm ý họ đang bao vây nhóm ấy.
- source_word: נָסוּ
  choice: đều bỏ chạy
  rationale: Bỏ chạy diễn đạt rõ hành động chạy trốn vì sợ hãi; từ “đều” làm nổi bật phạm vi tập thể đã có trong כָל.
- source_word: לְ/קֹלָם
  choice: khi nghe tiếng họ
  rationale: קוֹל có thể là tiếng, giọng hoặc tiếng kêu. “Tiếng họ” giữ được độ rộng nghĩa và đại từ số nhiều của nguyên văn; thêm “khi nghe” tạo câu tiếng Việt tự nhiên mà không ấn định đó nhất thiết là tiếng kêu.
- source_word: כִּי אָמְרוּ
  choice: vì họ nói
  rationale: כִּי nêu lý do họ bỏ chạy; cách dịch này rõ ràng và tự nhiên trong lời kể.
- source_word: פֶּן
  choice: Kẻo
  rationale: “Kẻo” diễn đạt hậu quả đáng sợ mà người nói muốn tránh, ngắn gọn và phù hợp với lời nói khẩn cấp.
- source_word: תִּבְלָעֵ/נוּ
  choice: nuốt chửng cả chúng ta
  rationale: Giữ hình ảnh sống động của בלע trong bối cảnh đất há miệng nuốt người; “cả” truyền đạt nỗi sợ rằng họ cũng sẽ cùng chung số phận.
- source_word: הָ/אָרֶץ
  choice: đất
  rationale: Trong ngữ cảnh trực tiếp về mặt đất há miệng, “đất” tự nhiên hơn “trái đất” và vẫn giữ hình ảnh đất như tác nhân nuốt chửng.
