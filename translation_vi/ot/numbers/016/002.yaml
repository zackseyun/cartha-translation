  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: vi
  text: Họ đứng lên trước mặt Môi-se, cùng với hai trăm năm mươi người trong số con trai Y-sơ-ra-ên[a], là các thủ lĩnh của cộng đồng, những người được gọi đến hội họp[b], những người có danh tiếng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “trong số các con trai Y-sơ-ra-ên.” Cách gọi này cũng có thể được dịch là “trong số người Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những người được gọi đến cuộc họp.” Cụm từ Hê-bơ-rơ có thể chỉ những người chính thức được triệu tập đến cuộc hội họp đã định của cộng đồng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Họ đứng dậy
  rationale: Động từ קום trong mạch kể chỉ việc đứng dậy và hành động; cách dịch này không đưa ý nổi loạn vào chính động từ, dù văn cảnh mang sắc thái đối đầu.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Giữ nghĩa không gian–quan hệ cơ bản là “ở trước, trước mặt”; sắc thái đối đầu được để cho văn cảnh thể hiện.
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל
  choice: cùng với ... người trong số con cái Y-sơ-ra-ên
  rationale: Làm rõ cấu trúc tỉnh lược và sự phối hợp với chủ thể đứng dậy; “con cái Y-sơ-ra-ên” giữ cách gọi giao ước truyền thống của בְּנֵי יִשְׂרָאֵל.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: hai trăm năm mươi
  rationale: Cách diễn đạt số đếm tự nhiên trong tiếng Việt hiện đại.
- source_word: נְשִׂיאֵי עֵדָה
  choice: các thủ lĩnh của cộng đồng
  rationale: נָשִׂיא chỉ người đứng đầu hay thủ lĩnh; עֵדָה ở đây là cộng đồng dân được tập hợp.
- source_word: קְרִאֵי מוֹעֵד
  choice: được triệu tập đến hội nghị
  rationale: Giữ nghĩa bị động của קְרִאֵי và hiểu מוֹעֵד là cuộc họp đã định của cộng đồng; không khẳng định quá mức một chức danh kỹ thuật.
- source_word: אַנְשֵׁי שֵׁם
  choice: những người có danh tiếng
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “người có tên,” tức người nổi tiếng hoặc có địa vị và uy tín.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Tách câu sau danh ngữ “con cái Y-sơ-ra-ên” để tránh chuỗi định ngữ dài nhưng vẫn giữ quan hệ đồng vị của nguyên văn. Dùng “Môi-se” và “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc.
