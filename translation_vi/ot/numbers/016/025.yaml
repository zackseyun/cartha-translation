base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: vi
  text: Rồi Môi-se đứng dậy, đi đến chỗ Đa-than và A-bi-ram; các trưởng lão của Y-sơ-ra-ên đi sau ông[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo ông.” Nguyên văn Hê-bơ-rơ là “đi sau ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: đứng dậy
  rationale: Động từ קום ở dạng kể chuyện chỉ việc Môi-se đứng lên để bắt đầu hành động tiếp theo; “đứng dậy” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: וַיֵּלֶךְ
  choice: đi
  rationale: הלך thường có nghĩa là “đi”; ngữ cảnh không đòi hỏi xác định cách thức di chuyển.
- source_word: אֶל
  choice: đến chỗ
  rationale: Giới từ chỉ hướng chuyển động tới người; “đến chỗ” tự nhiên hơn “đến” đơn thuần khi bổ ngữ là hai người.
- source_word: דָּתָן וַאֲבִירָם
  choice: Đa-than và A-bi-ram
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: đi sau ông
  rationale: 'Giữ hình ảnh và cấu trúc của nguyên ngữ: động từ “đi” kết hợp với cụm chỉ vị trí/hướng “sau ông”, thay vì mặc nhiên thu gọn thành “theo ông”.'
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: các trưởng lão của Y-sơ-ra-ên
  rationale: Cụm sở thuộc chỉ những người giữ vai trò trưởng lão, tức các vị lãnh đạo được nhìn nhận trong cộng đồng Y-sơ-ra-ên.
- source_word: וַ
  choice: Rồi
  rationale: Liên từ mở đầu tiếp nối diễn biến câu chuyện; “Rồi” diễn đạt trình tự tự nhiên trong văn kể tiếng Việt mà không máy móc lặp lại “Và”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Môi-se”, “Đa-than”, “A-bi-ram” và “Y-sơ-ra-ên” theo dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt; giữ cách diễn đạt cụ thể “đi sau ông” của nguyên ngữ, đồng thời ghi cách dịch tự nhiên hơn trong chú thích.
