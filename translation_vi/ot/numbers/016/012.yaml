  terminology: Phiên âm Môi-se, Đa-than, A-bi-ram và Ê-li-áp nhất quán, dễ đọc, và quan hệ “các con trai của Ê-li-áp” được giữ nguyên. Chú thích trình bày đúng khả năng “đi lên” và không áp đặt một cách hiểu duy nhất về hướng đi hay việc trình diện.
