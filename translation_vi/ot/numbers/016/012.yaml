  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa Hê-bơ-rơ: Môi-se sai người đi gọi/triệu Đa-than và A-bi-ram, họ là các con trai của Ê-li-áp, và họ dứt khoát từ chối “lên.” “Sai người đi gọi” diễn đạt hợp lý hành vi sai phái hàm ý trong וַיִּשְׁלַח...לִקְרֹא mà không xác định danh tính sứ giả. “Sẽ không lên đâu” giữ động từ עלה và sắc thái ý chí khước từ của thể chưa hoàn thành.'
