base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se sai người đi gọi Đa-than và A-bi-ram, các con trai của Ê-li-áp, nhưng họ nói: “Chúng tôi sẽ không lên đâu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng tôi sẽ không đi lên.” Động từ Hê-bơ-rơ có nghĩa đen là “lên” hoặc “đi lên”; ở đây có thể chỉ việc đến chỗ Môi-se hoặc ra trình diện theo lời gọi của ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sai người đi
  rationale: Động từ שׁלח cho biết Môi-se sai phái để gọi họ đến, nhưng không xác định sứ giả là ai. “Sai người đi” tự nhiên trong tiếng Việt và không thêm danh tính người được sai.
- source_word: לִקְרֹא
  choice: gọi
  rationale: Trong cấu trúc này, קרא mang nghĩa gọi người nào đó đến hoặc triệu đến. “Gọi” là cách diễn đạt tự nhiên, rõ ràng; ngữ cảnh cho thấy đây là lời triệu gọi chứ không phải lời mời xã giao.
- source_word: דָתָן וַאֲבִירָם
  choice: Đa-than và A-bi-ram
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: בְּנֵי אֱלִיאָב
  choice: các con trai của Ê-li-áp
  rationale: Giữ nguyên quan hệ phụ tử dùng để xác định Đa-than và A-bi-ram; “các con trai” phù hợp vì câu nêu hai người.
- source_word: וַיֹּאמְרוּ
  choice: nhưng họ nói
  rationale: Liên từ וַ biểu thị trình tự, nhưng trong ngữ cảnh lời đáp trái với lệnh gọi. “Nhưng” chuyển tải tự nhiên sự đối nghịch này.
- source_word: לֹא נַעֲלֶה
  choice: Chúng tôi sẽ không lên đâu
  rationale: עלה có nghĩa đen là “lên/đi lên”; thể chưa hoàn thành ở đây diễn tả sự khước từ dứt khoát. “Đâu” làm lời từ chối tự nhiên và mạnh trong tiếng Việt mà không đổi nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ động từ không gian “lên” cùng độ mở nghĩa của nguyên bản; lời từ chối được diễn đạt tự nhiên trong khẩu ngữ trang nghiêm.
