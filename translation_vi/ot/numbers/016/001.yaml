id: NUM.16.1
reference: Numbers 16:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: vi
  text: Cô-ra, con trai Dít-ha, con trai Kê-hát, con trai Lê-vi, đã đem theo một số người, cùng với Đa-than và A-bi-ram, các con trai của Ê-li-áp, và Ôn, con trai Phê-lết—những người thuộc dòng Ru-bên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “và ông đã lấy”; câu không nêu tân ngữ. Cụm từ “một số người” được bổ sung dựa vào ngữ cảnh của câu 2.'
    reason: Giải thích cú pháp tỉnh lược và phần được bổ sung tối thiểu để câu tiếng Việt rõ nghĩa.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: đã tập hợp một số người theo mình
  rationale: Động từ לָקַח cơ bản có nghĩa là “lấy, đem theo”, nhưng trong câu Hê-bơ-rơ này không nêu tân ngữ. Dựa vào 250 người được nói đến ở câu kế tiếp, bản dịch bổ sung “một số người” để câu tiếng Việt rõ nghĩa; “tập hợp ... theo mình” diễn đạt tự nhiên hành động lôi cuốn người khác tham gia mà không dùng từ mang sắc thái phán xét mạnh như “xúi giục”.
- source_word: קֹרַח
  choice: Cô-ra
  rationale: Phiên âm tên riêng theo lối viết tiếng Việt hiện đại, dễ đọc và gần âm nguồn.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: con trai Dít-ha, cháu Kê-hát, thuộc dòng Lê-vi
  rationale: Trong chuỗi gia phả, בֶּן có thể chỉ quan hệ con cháu. Cách diễn đạt này bảo toàn từng cấp được nêu nhưng tránh khiến tiếng Việt hiểu Kê-hát và Lê-vi đều là cha trực tiếp của Cô-ra.
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: cùng với Đa-than và A-bi-ram, là các con trai của Ê-li-áp
  rationale: “Cùng với” làm rõ rằng Đa-than và A-bi-ram cùng tham gia hành động; “các con trai” phản ánh trực tiếp số nhiều בְּנֵי.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: và Ôn, con trai Phê-lết
  rationale: Giữ quan hệ gia phả và phiên âm các tên riêng một cách rõ ràng.
- source_word: בְּנֵי רְאוּבֵן
  choice: họ đều thuộc dòng Ru-bên
  rationale: Cụm từ nghĩa đen là “các con trai của Ru-bên”. Trong ngữ cảnh bộ tộc, “thuộc dòng Ru-bên” là tiếng Việt tự nhiên và tránh tạo ấn tượng rằng tất cả là con trực tiếp của Ru-bên.
theological_decisions:
- issue: Cú pháp tỉnh lược ở đầu câu
  choice: 'Bổ sung tân ngữ theo ngữ cảnh: “đã tập hợp một số người theo mình”'
  alternative: Dịch sát hình thức là “đã lấy/đem theo”, hoặc diễn giải là “đã nổi dậy”
  rationale: Nguyên văn để trống tân ngữ, còn câu 2 nói đến 250 người. Bổ sung “một số người” giúp tiếng Việt sáng nghĩa, trong khi chú thích bảo lưu hình thức và độ mơ hồ của nguyên văn. Không dùng “nổi dậy” trong chính văn vì đó là cách diễn giải diễn tiến, không phải nghĩa trực tiếp của לָקַח.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con trai”, “cháu”, “thuộc dòng” để trình bày quan hệ gia phả tự nhiên trong tiếng Việt; dấu gạch ngang giúp cụm xác định “thuộc dòng Ru-bên” không bị hiểu là chỉ bổ nghĩa cho Ôn.
