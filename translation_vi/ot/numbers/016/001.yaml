revisions:
- from: Cô-ra, con trai Dít-ha, cháu Kê-hát, thuộc dòng Lê-vi, cùng với Đa-than và A-bi-ram, là các con trai của Ê-li-áp, và Ôn, con trai Phê-lết—họ đều thuộc dòng Ru-bên—đã tập hợp một số người theo mình.[a]
  to: Cô-ra, con trai Dít-ha, con trai Kê-hát, con trai Lê-vi, đã đem theo một số người, cùng với Đa-than và A-bi-ram, các con trai của Ê-li-áp, và Ôn, con trai Phê-lết—những người thuộc dòng Ru-bên.[a]
  rationale: Bản sửa thay cách diễn giải “tập hợp ... theo mình” bằng “đem theo”, phù hợp sát hơn với לקח và với lựa chọn “took men” trong hồ sơ tiếng Anh. Đồng thời, cụm chỉ Ru-bên được đặt ngay sau ba nhân vật Ru-bên để không bao gồm Cô-ra, người thuộc dòng Lê-vi. Cấu trúc gia phả của Cô-ra được giữ lặp lại theo nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:26:47Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo đã nhận ra đúng chỗ tỉnh lược của וַיִּקַּח và có chú thích. Tuy nhiên, “đã tập hợp một số người theo mình” thêm sắc thái quy tụ người theo phe, vượt quá động từ “lấy/đem theo”; đặc biệt, “họ đều thuộc dòng Ru-bên” sai phạm vi quy chiếu, vì Cô-ra được nêu là người Lê-vi, còn cụm “con trai Ru-bên” quy về Đa-than, A-bi-ram và Ôn.
  naturalness: Câu sửa giữ văn phong hiện đại, trang trọng và gia phả dễ theo dõi. “Đem theo một số người” tự nhiên hơn cách dịch sát không tân ngữ, đồng thời ít diễn giải hơn “tập hợp ... theo mình”.
  terminology: Giữ các tên phiên âm của bản thảo và các thuật ngữ gia phả “con trai”, “thuộc dòng”. Chuỗi “con trai Dít-ha, con trai Kê-hát, con trai Lê-vi” phản ánh cấu trúc gia phả của nguyên văn rõ hơn “cháu ... thuộc dòng”, mà không khẳng định Kê-hát hay Lê-vi là cha trực tiếp theo nghĩa hiện đại.
  issues:
  - severity: high
    issue: “họ đều thuộc dòng Ru-bên” bao gồm cả Cô-ra.
    rationale: Cô-ra được xác định là hậu duệ Lê-vi trong chính câu. בְּנֵי רְאוּבֵן áp dụng cho Đa-than, A-bi-ram và Ôn, không thể áp dụng cho toàn bộ nhóm vừa kể.
  - severity: medium
    issue: “đã tập hợp một số người theo mình” diễn giải quá mức động từ וַיִּקַּח.
    rationale: Động từ nghĩa cơ bản là “lấy/đem theo”; nguyên văn không nói họ là người theo phe Cô-ra hay nhấn mạnh hành vi tập hợp. Cần chỉ bổ sung tân ngữ tối thiểu theo ngữ cảnh.
  - severity: low
    issue: “cháu Kê-hát, thuộc dòng Lê-vi” làm mờ sự lặp lại của chuỗi בֶּן.
    rationale: Trong văn cảnh gia phả, “con trai ... con trai ... con trai ...” có thể được hiểu là chuỗi tổ tiên và bảo toàn cách diễn đạt nguồn tốt hơn.
