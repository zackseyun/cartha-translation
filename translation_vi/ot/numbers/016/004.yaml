id: NUM.16.4
reference: Numbers 16:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּפֹּ֖ל עַל פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: vi
  text: Khi nghe vậy, Môi-se sấp mặt xuống đất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “ngã trên mặt mình”; cũng có thể dịch: “phủ phục xuống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe vậy
  rationale: Động từ שׁמע trong mạch kể chuyện có nghĩa tự nhiên là “nghe”; “vậy” diễn đạt tân ngữ được ngầm hiểu từ lời của những người chống đối ở câu trước mà không thêm cách giải thích.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: וַיִּפֹּל
  choice: sấp ... xuống
  rationale: נפל có nghĩa cơ bản là “ngã/rơi xuống”; kết hợp với thành ngữ theo sau, cách dịch này diễn đạt tư thế phủ phục một cách tự nhiên trong tiếng Việt.
- source_word: עַל פָּנָיו
  choice: mặt ... xuống đất
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “trên mặt mình”, chỉ việc nằm phủ phục. Cách dịch giữ hình ảnh thân thể và không xác định quá mức đó là cầu nguyện, đau buồn hay khiêm nhường.
theological_decisions:
- issue: Ý nghĩa tư thế của Môi-se
  choice: Chỉ thuật lại hành động cụ thể là “sấp mặt xuống đất”, không giải thích động cơ hay ý nghĩa tinh thần.
  alternative: “phủ phục cầu nguyện” hoặc “sấp mặt xuống vì đau buồn”
  rationale: Bản Hê-bơ-rơ nêu hành động nhưng không nói rõ đó là biểu hiện của cầu nguyện, kinh hoàng, khiêm nhường hay cầu thay; bản dịch giữ nguyên sự mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sấp mặt xuống đất” tự nhiên hơn lối dịch sát chữ “ngã trên mặt mình”, đồng thời vẫn bảo toàn hình ảnh và tính hàm súc của nguyên văn.
