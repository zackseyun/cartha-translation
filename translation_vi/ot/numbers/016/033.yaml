base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: vi
  text: Họ cùng tất cả những gì thuộc về họ đã đi xuống Sê-ôn[a] khi vẫn còn sống. Đất phủ lấp họ, và họ biến mất khỏi giữa hội chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phần mộ” hoặc “cõi người chết.” Tiếng Hê-bơ-rơ là Sheol (Sê-ôn).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: đã đi xuống
  rationale: Diễn đạt tự nhiên động từ ירד, đồng thời giữ nguyên chuyển động đi xuống trong trình thuật.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: họ cùng tất cả những gì thuộc về họ
  rationale: Cách diễn đạt đủ rộng để bao gồm cả người lẫn tài sản gắn với họ, không thu hẹp phạm vi của cụm từ Hê-bơ-rơ.
- source_word: חַיִּים
  choice: khi vẫn còn sống
  rationale: Nêu rõ họ đi xuống trong tình trạng còn sống; đây là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: שְׁאֹלָה
  choice: xuống Sê-ôn
  rationale: Phiên âm danh từ שְׁאוֹל và thể hiện hậu tố chỉ hướng bằng “xuống”, tránh đồng nhất thuật ngữ này chỉ với phần mộ hoặc với một quan niệm hậu kỳ về địa ngục.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: Đất phủ lấp họ
  rationale: Giữ “đất” làm chủ thể và chuyển tải hình ảnh đất bao phủ họ bằng một cách nói rõ, tự nhiên trong tiếng Việt.
- source_word: וַיֹּאבְדוּ
  choice: họ bị diệt
  rationale: Phản ánh ý nghĩa bị tiêu diệt, không còn hiện diện trong cộng đồng, mà không xác định thêm cách thức ngoài văn bản.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: khỏi giữa hội chúng
  rationale: Bám sát thành ngữ Hê-bơ-rơ “từ giữa” và dùng “hội chúng” cho קהל trong bối cảnh cộng đồng Ít-ra-ên.
theological_decisions:
- issue: Cách dịch שְׁאוֹל
  choice: Sê-ôn
  alternative: phần mộ; cõi người chết
  rationale: Phiên âm giữ lại phạm vi khái niệm rộng và phần nào không xác định của thuật ngữ Hê-bơ-rơ, không thu hẹp nó thành một ngôi mộ cụ thể cũng không đồng nhất với giáo thuyết hậu kỳ về địa ngục. Các cách hiểu chính được nêu trong chú thích.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt, nhưng vẫn giữ các nét chính của bản Hê-bơ-rơ: họ xuống khi còn sống, đất phủ lấp họ, và họ bị loại khỏi hội chúng.'
