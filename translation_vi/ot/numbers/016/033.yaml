revisions:
- from: Họ cùng tất cả những gì thuộc về họ đã đi xuống Sê-ôn[a] khi vẫn còn sống. Đất phủ lấp họ, và họ bị diệt khỏi giữa hội chúng.
  to: Họ cùng tất cả những gì thuộc về họ đã đi xuống Sê-ôn[a] khi vẫn còn sống. Đất phủ lấp họ, và họ biến mất khỏi giữa hội chúng.
  rationale: 'Chỉnh “bị diệt” thành “biến mất” để diễn đạt tự nhiên hơn và gần hơn với sắc thái nội động của אָבַד trong ngữ cảnh: họ bị mất đi khỏi cộng đồng sau khi đất phủ lấp. Chú thích được điều chỉnh nhẹ để nhất quán giữa dạng phiên âm tiếng Việt và tên thuật ngữ Hê-bơ-rơ quốc tế. Các yếu tố còn lại được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
