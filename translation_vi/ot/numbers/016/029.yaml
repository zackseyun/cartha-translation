  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: vi
  text: Nếu những người này chết như mọi người, và số phận chung của mọi người cũng xảy đến với họ,[a] thì Yahweh đã không sai phái tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “và sự thăm viếng dành cho mọi người cũng giáng trên họ.” Tiếng Hê-bơ-rơ lặp lại gốc פקד, có thể chỉ sự thăm viếng, sự định liệu, hoặc điều xảy đến với một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Mở đầu mệnh đề điều kiện nêu phép thử của Môi-se; cách dịch ngắn gọn, tự nhiên.
- source_word: כְּמוֹת כָּל הָאָדָם יְמֻתוּן אֵלֶּה
  choice: những người này chết như mọi người vẫn chết
  rationale: Diễn đạt tự nhiên thành ngữ so sánh có מוֹת, đồng thời giữ ý về cái chết thông thường của loài người.
- source_word: כָּל הָאָדָם
  choice: mọi người
  rationale: אָדָם được dùng theo nghĩa tập thể, chỉ loài người nói chung chứ không riêng nam giới.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: điều xảy đến với mọi người cũng xảy đến với họ
  rationale: Giữ sự lặp ý của cùng gốc פקד bằng việc lặp 'xảy đến', nhưng không ép từ này thành 'hình phạt' khi ngữ nghĩa có thể rộng hơn.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: thì Yahweh đã không sai tôi
  rationale: Diễn đạt kết luận của điều kiện và giữ tên riêng giao ước יְהוָה.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm Yahweh bảo tồn tư cách tên riêng thay vì thay bằng một tước hiệu.
- issue: Sắc thái của פקד trong mệnh đề thứ hai
  choice: điều xảy đến ... cũng xảy đến
  alternative: sự viếng thăm ... giáng trên; số phận ... xảy đến
  rationale: Gốc פקד có thể chỉ sự thăm viếng, định liệu hoặc điều xảy đến. Bản dịch chính giữ nghĩa rộng, không mặc nhiên xác định đó là hình phạt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc điều kiện được giữ rõ; 'mọi người vẫn chết' diễn đạt cái chết thông thường của nhân loại, còn chú thích bảo tồn độ rộng ngữ nghĩa và phép lặp của פקד.
