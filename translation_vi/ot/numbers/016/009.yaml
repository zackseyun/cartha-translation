id: NUM.16.9
reference: Numbers 16:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: vi
  text: Chẳng lẽ đối với các ngươi, việc Đức Chúa Trời của Israel đã biệt riêng các ngươi khỏi cộng đồng Israel[a], đem các ngươi đến gần Ngài để làm công việc phục vụ tại Đền Tạm của Yahweh, và đứng trước cộng đồng để phục vụ họ, lại là chuyện nhỏ sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch phần mở đầu: “Việc Đức Chúa Trời của Israel biệt riêng các ngươi khỏi cộng đồng Israel... vẫn chưa đủ cho các ngươi sao?”'
    reason: Thành ngữ Hê-bơ-rơ הַמְעַט có thể được giữ theo hình ảnh “là chuyện nhỏ” hoặc diễn đạt linh hoạt là “chưa đủ”.
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  choice: đối với các ngươi... lại là chuyện nhỏ sao?
  rationale: Giữ hình ảnh và sức nặng của câu hỏi tu từ Hê-bơ-rơ, hàm ý đặc ân đã ban không nên bị xem là nhỏ bé hay không đủ.
- source_word: כִּי
  choice: việc
  rationale: Danh hóa nội dung theo sau câu hỏi tu từ, tương ứng chức năng giới thiệu nội dung của כִּי trong cấu trúc này.
- source_word: הִבְדִּיל
  choice: đã biệt riêng
  rationale: Diễn đạt hành động tách họ khỏi cộng đồng cho một nhiệm vụ riêng; tự nhiên trong tiếng Việt và vẫn giữ sắc thái phục vụ thánh.
- source_word: עֲדַת יִשְׂרָאֵל / הָעֵדָה
  choice: cộng đồng Israel / cộng đồng
  rationale: עֵדָה chỉ cộng đồng dân Israel được quy tụ; “cộng đồng” rõ nghĩa và tự nhiên với độc giả hiện đại.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: đem các ngươi đến gần Ngài
  rationale: Giữ nghĩa tiếp cận mang tính quan hệ và thờ phượng của קרב, không diễn giải họ như lễ vật.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: làm công việc phục vụ tại Đền Tạm của Yahweh
  rationale: Phản ánh sự nhấn mạnh của động từ עבד và danh từ cùng gốc עֲבֹדָה mà vẫn tự nhiên trong tiếng Việt.
- source_word: מִשְׁכַּן יְהוָה
  choice: Đền Tạm của Yahweh
  rationale: “Đền Tạm” là cách gọi quen thuộc cho nơi thánh lưu động trong hoang mạc; giới từ “tại” làm rõ địa điểm phục vụ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên bản thay vì thay thế bằng một tước hiệu.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: và đứng trước cộng đồng
  rationale: Giữ trực tiếp tư thế phục vụ chính thức trước dân chúng được quy tụ.
- source_word: לְשָׁרְתָם
  choice: để phục vụ họ
  rationale: שרת ở đây nói đến sự hầu việc có tính chức trách; “phục vụ họ” rõ ràng, trang trọng và không thêm sắc thái giáo phái.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên bản dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của việc đưa người Lê-vi đến gần Đức Chúa Trời
  choice: đem các ngươi đến gần Ngài
  alternative: dâng các ngươi cho Ngài
  rationale: Ngữ cảnh nói đến việc được chỉ định để phục vụ nơi thánh. Cách dịch này giữ sắc thái thờ phượng và quan hệ nhưng không quyết định rằng người Lê-vi được mô tả như lễ vật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” vì lời quở trách trực tiếp nhắm đến một nhóm người; giữ câu hỏi tu từ và độ dài của chuỗi mệnh đề trong nguyên bản nhưng sắp xếp lại vừa đủ cho cú pháp tiếng Việt.
