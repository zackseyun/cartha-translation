revisions:
- from: 'Ông nói với cộng đồng: “Xin hãy rời xa lều của những người gian ác này, và đừng chạm vào bất cứ vật gì thuộc về họ, kẻo anh em bị quét sạch vì mọi tội lỗi của họ.”[a]'
  to: 'Ông nói với cộng đồng: “Hãy tránh xa lều trại của những người gian ác này, và đừng chạm vào mọi điều thuộc về họ, kẻo anh em bị quét sạch trong mọi tội lỗi của họ.”[a]'
  rationale: Bản sửa giữ “trong mọi tội lỗi của họ” để bảo tồn tính đa nghĩa của giới từ בְּ trong nguyên văn, đồng thời chuyển cách hiểu nhân quả sang chú thích. “Mọi điều thuộc về họ” phản ánh đầy đủ hơn כָּל אֲשֶׁר לָהֶם, và chú thích không thêm ý “cùng với họ” ngoài câu gốc.
  reviewer_model: gpt-5.6-terra
