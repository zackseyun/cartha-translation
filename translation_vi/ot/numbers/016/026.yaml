  text: וַ/יְדַבֵּ֨ר אֶל הָ/עֵדָ֜ה לֵ/אמֹ֗ר ס֣וּרוּ נָ֡א מֵ/עַל֩ אָהֳלֵ֨י הָ/אֲנָשִׁ֤ים הָֽ/רְשָׁעִים֙ הָ/אֵ֔לֶּה וְ/אַֽל תִּגְּע֖וּ בְּ/כָל אֲשֶׁ֣ר לָ/הֶ֑ם פֶּן תִּסָּפ֖וּ בְּ/כָל חַטֹּאתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: vi
  text: 'Ông nói với cộng đồng: “Hãy tránh xa lều trại của những người gian ác này, và đừng chạm vào mọi điều thuộc về họ, kẻo anh em bị quét sạch trong mọi tội lỗi của họ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “kẻo anh em bị quét sạch vì mọi tội lỗi của họ.” Tiếng Hê-bơ-rơ có thể được hiểu với sắc thái nguyên nhân rõ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: cộng đồng
  rationale: עֵדָה chỉ toàn thể cộng đồng Israel đang tụ họp; “cộng đồng” tự nhiên trong tiếng Việt hiện đại và giữ được ý nghĩa tập thể.
- source_word: סוּרוּ נָא
  choice: Xin hãy rời xa
  rationale: Mệnh lệnh סוּרוּ kêu gọi họ tránh xa, còn נָא tạo sắc thái khẩn thiết và nhã nhặn; “xin hãy” thể hiện cả hai nét nghĩa.
- source_word: מֵעַל אָהֳלֵי
  choice: rời xa lều của
  rationale: מֵעַל trong ngữ cảnh này diễn tả việc rời khỏi vùng gần các lều, không phải chuyển động theo nghĩa đen từ trên lều xuống.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: những người gian ác này
  rationale: Cụm từ xác định một nhóm người cụ thể và mô tả họ là gian ác theo nghĩa đạo đức và xét xử; cách nói này tự nhiên, trang trọng trong tiếng Việt.
- source_word: וְאַל תִּגְּעוּ
  choice: và đừng chạm vào
  rationale: Giữ nguyên lệnh cấm trực tiếp của động từ נגע mà không diễn giải thêm loại tiếp xúc.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: bất cứ vật gì thuộc về họ
  rationale: Sau mệnh lệnh phủ định, “bất cứ vật gì” diễn đạt tự nhiên phạm vi bao quát của כָל אֲשֶׁר לָהֶם và cho thấy câu nói nhắm đến tài sản của họ.
- source_word: פֶּן תִּסָּפוּ
  choice: kẻo anh em bị quét sạch
  rationale: Dạng Niphal của ספה mang nghĩa bị cuốn đi hoặc bị tiêu diệt trong sự phán xét; “bị quét sạch” giữ được thể bị động và hình ảnh tai họa bao trùm.
- source_word: בְּכָל חַטֹּאתָם
  choice: vì mọi tội lỗi của họ
  rationale: Giới từ בְּ có thể mang sắc thái nguyên nhân hoặc liên hệ/hoàn cảnh. Bản chính dùng cách diễn đạt tự nhiên theo sắc thái nguyên nhân, còn chú thích giữ lại khả năng hiểu theo nghĩa bị cuốn vào sự phán xét gắn với tội lỗi của họ.
theological_decisions:
- issue: Sự liên đới với người gian ác trong sự phán xét tập thể
  choice: Lời cảnh báo yêu cầu cộng đồng tách khỏi người gian ác và tài sản của họ để khỏi bị quét sạch bởi sự phán xét do tội lỗi của họ gây nên.
  alternative: 'Có thể hiểu câu cuối theo sắc thái liên đới rộng hơn: “kẻo anh em bị quét sạch cùng với họ trong mọi tội lỗi của họ.”'
  rationale: Bản dịch không khẳng định rằng tội lỗi của những người kia được quy cho cộng đồng; đồng thời chú thích bảo tồn sự căng thẳng trong tiếng Hê-bơ-rơ giữa nguyên nhân và sự liên đới trong tai họa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” giữ chủ thể ngôi thứ ba như nguyên văn; “anh em” phù hợp với lời một người nam nói trực tiếp với cộng đồng. Dấu chú thích được đặt sau mệnh đề mà chú thích giải thích.
