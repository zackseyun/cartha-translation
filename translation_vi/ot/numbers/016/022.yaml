base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: vi
  text: 'Họ liền sấp mặt xuống và nói: “Lạy Đức Chúa Trời, là Đức Chúa Trời của thần linh của mọi xác thịt[a], chỉ một người phạm tội[b] mà Ngài nổi giận với cả hội chúng sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời của hơi thở của mọi xác thịt,” nhấn mạnh Ngài là Đấng ban sự sống cho mọi sinh vật.'
    reason: lexical_alternative
  - marker: b
    text: “Chỉ một người” có thể mang ý nghĩa đại diện; lời cầu xin nhấn mạnh rằng tội của một cá nhân không nên khiến cơn giận giáng trên cả hội chúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: Họ liền sấp mặt xuống
  rationale: Diễn đạt tự nhiên hành động phủ phục vì kinh hãi, khiêm nhường và cầu thay, đồng thời giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ.
- source_word: אֵל אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Lạy Đức Chúa Trời, là Đức Chúa Trời của thần linh mọi xác thịt
  rationale: Giữ cấu trúc danh hiệu và cách nói rộng của nguyên văn. “Thần linh” bảo tồn nghĩa chỉ đời sống bên trong của từng người, còn “mọi xác thịt” duy trì thành ngữ Kinh Thánh thay vì thu hẹp thành “mọi người”.
- source_word: הָאִישׁ אֶחָד
  choice: chỉ một người
  rationale: “Người” là cách nói tiếng Việt tự nhiên và không làm mất nét số ít được nhấn mạnh bởi אֶחָד; trong ngữ cảnh, trọng tâm là sự tương phản giữa một cá nhân và toàn hội chúng, không phải giới tính.
- source_word: יֶחֱטָא
  choice: phạm tội
  rationale: Chuyển tải trực tiếp hành vi mắc tội trong câu hỏi tu từ, không áp đặt thêm sắc thái thời hay thể.
- source_word: כָּל־הָעֵדָה
  choice: cả hội chúng
  rationale: “Hội chúng” phù hợp với cộng đồng Ít-ra-ên được tập hợp; “cả” thể hiện כָּל tự nhiên trong tiếng Việt.
- source_word: תִּקְצֹף
  choice: Ngài nổi giận với
  rationale: Cách diễn đạt hiện đại, rõ nghĩa cho cơn giận của Đức Chúa Trời; “với” thể hiện đối tượng của cơn giận theo lối nói tự nhiên.
theological_decisions:
- issue: Ý nghĩa nhân học của cụm “Đức Chúa Trời của thần linh mọi xác thịt”
  choice: Giữ “thần linh” trong chính văn, nhấn mạnh Đức Chúa Trời biết và cai quản đời sống bên trong của từng người.
  alternative: Hiểu רוּחוֹת là “hơi thở”, nhấn mạnh Đức Chúa Trời ban sự sống cho mọi sinh vật.
  rationale: Ngữ cảnh là lời cầu xin Đức Chúa Trời phân biệt trách nhiệm của một cá nhân với cả cộng đồng. Tuy vậy, nghĩa “hơi thở/sinh khí” vẫn khả hữu nên được bảo tồn trong chú thích.
- issue: Sắc thái của הָאִישׁ אֶחָד
  choice: “chỉ một người”, nhấn mạnh một cá nhân đối lập với cả hội chúng.
  alternative: “một người nam”, phản ánh hình thái giống đực của אִישׁ sát mặt chữ hơn.
  rationale: Tiếng Việt không có giống ngữ pháp ở danh từ “người”; trong câu này, giới tính không phải điểm tương phản. Bản dịch giữ nét cá nhân và tính đại diện mà không thêm một sự nhấn mạnh về giới không rõ trong ngữ cảnh.
- issue: Quan hệ giữa tội cá nhân và cơn giận trên cộng đồng
  choice: Giữ nguyên dưới dạng câu hỏi cầu xin, không biến thành một mệnh đề giáo lý tuyệt đối.
  alternative: Diễn giải rằng Đức Chúa Trời chắc chắn không bao giờ xét phạt tập thể vì tội cá nhân.
  rationale: Nguyên văn trình bày lời khẩn cầu của Môi-se và A-rôn trong hoàn cảnh cụ thể; bản dịch không nên giải quyết rộng hơn sự căng thẳng về trách nhiệm cá nhân và cộng đồng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Lạy” để biểu thị lời thưa trực tiếp, “Ngài” làm đại từ kính xưng, và giữ thành ngữ Kinh Thánh “mọi xác thịt” nhằm bảo tồn hình ảnh cùng độ rộng của nguyên văn.
