language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: vi
  text: 'A-rôn nói với Môi-se: “Thưa ngài, xin đừng quy tội cho chúng tôi, vì chúng tôi đã hành động dại dột và đã phạm tội[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “xin đừng đặt tội lỗi lên chúng tôi.”'
    reason: Cụm תָשֵׁת עָלֵינוּ חַטָּאת có hình ảnh sát chữ là “đặt tội lỗi lên chúng tôi”; trong ngữ cảnh, “quy tội” diễn đạt tự nhiên ý quy trách nhiệm/tội lỗi.
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Ôi, thưa chúa tôi
  rationale: בִּי mở đầu lời khẩn cầu, còn אֲדֹנִי là cách xưng hô kính trọng dành cho Môi-se, không phải thần hiệu. Cách dịch này giữ được sự hạ mình và khẩn thiết của A-rôn.
- source_word: אַל נָא
  choice: xin đừng
  rationale: נָא làm lời cấm mang sắc thái nài xin; “xin đừng” diễn đạt tự nhiên và đầy đủ sắc thái ấy trong tiếng Việt.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: đặt tội lỗi lên chúng tôi
  rationale: Giữ hình ảnh đặt một gánh nặng lên người nào đó trong cấu trúc שׁית + על. חַטָּאת ở đây có thể chỉ tội lỗi hoặc tình trạng mắc tội.
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: vì chúng tôi đã hành động dại dột
  rationale: Động từ יאל ở thể Niphal chỉ việc cư xử thiếu khôn ngoan, dại dột; mệnh đề với אֲשֶׁר được hiểu theo quan hệ giải thích-nguyên nhân trong lời thú nhận.
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: và đã phạm tội
  rationale: Giữ vế thú nhận thứ hai, trong đó A-rôn gọi thẳng hành vi của họ là phạm tội, đồng thời tránh lặp “chúng tôi” không cần thiết trong tiếng Việt.
theological_decisions:
- issue: Cách dịch אֲדֹנִי khi A-rôn thưa với Môi-se
  choice: chúa tôi
  alternative: thưa ngài
  rationale: Trong ngữ cảnh này, từ ngữ là danh xưng kính trọng dành cho một con người, không chỉ Đức Chúa Trời. “Chúa tôi” bảo tồn mức độ hạ mình và tương quan quyền uy trong lời cầu xin, nhưng không viết hoa như thần hiệu.
- issue: Quan hệ của hai mệnh đề אֲשֶׁר với lời cầu xin
  choice: vì chúng tôi đã hành động dại dột và đã phạm tội
  alternative: trong việc chúng tôi đã hành động dại dột và đã phạm tội
  rationale: Cách hiểu nguyên nhân phù hợp với diễn tiến của lời khẩn cầu và tự nhiên trong tiếng Việt; phương án quan hệ “trong việc” vẫn có thể phản ánh cú pháp sát hơn nhưng nặng nề và kém rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ôi, thưa chúa tôi” giữ sắc thái khẩn cầu cùng sự kính trọng mà không khiến danh xưng dành cho Môi-se bị hiểu là thần hiệu. Hình ảnh “đặt ... lên” được giữ để phản ánh phép ẩn dụ của nguyên văn.
