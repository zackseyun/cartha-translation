source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: vi
  text: 'Họ nói: “Chẳng lẽ Yahweh chỉ phán qua Môi-se thôi sao?[a] Ngài cũng phán qua chúng ta, phải không?” Yahweh đã nghe lời ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chẳng lẽ Yahweh chỉ phán với Môi-se thôi sao? Ngài cũng phán với chúng ta, phải không?” Giới từ Hê-bơ-rơ có thể chỉ người nhận hoặc người trung gian của lời phán; bản văn chính chọn “qua” vì ngữ cảnh nói đến thẩm quyền tiên tri.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Động từ wayyiqtol mở đầu lời nói trực tiếp và tiếp nối mạch kể. Tiếng Việt không cần thêm liên từ nếu câu vẫn nối mạch tự nhiên.
- source_word: הֲרַק אַךְ
  choice: Chẳng lẽ ... chỉ ... thôi sao?
  rationale: Cấu trúc câu hỏi cùng hai tiểu từ hạn định tạo một lời chất vấn nhấn mạnh tính độc quyền; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sắc thái phản bác.
- source_word: בְּמֹשֶׁה
  choice: qua Môi-se
  rationale: 'Giới từ בְּ đi với דבר trong bối cảnh mặc khải có thể chỉ người trung gian hoặc người nhận. Bối cảnh tranh luận về thẩm quyền tiên tri nghiêng về nghĩa phương tiện: Yahweh phán qua Môi-se.'
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh ... phán
  rationale: “Phán” là cách diễn đạt trang trọng, rõ ràng và tự nhiên cho lời Đức Chúa Trời; danh riêng giao ước יְהוָה được phiên âm là “Yahweh” thay vì thay bằng một tước hiệu.
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: Ngài chẳng cũng phán qua chúng ta sao?
  rationale: Giữ cùng cách hiểu giới từ như ở vế trước, qua đó thể hiện lời khẳng định rằng họ cũng là những người chuyển đạt lời thần thượng.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Yahweh đã nghe lời ấy
  rationale: Nguyên văn không nêu tân ngữ, nhưng ngữ cảnh cho thấy điều được nghe là lời họ vừa nói. “Lời ấy” làm câu tiếng Việt trọn nghĩa mà không xác định đó là lời than phiền hay lời chống đối.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Giữ danh riêng xuất hiện trực tiếp trong nguyên văn, không thay bằng tước hiệu và không áp đặt cách gọi mang dấu ấn hệ phái.
- issue: בְּ với דבר chỉ người nhận hay người trung gian
  choice: qua Môi-se / qua chúng ta
  alternative: với Môi-se / với chúng ta; phán cho Môi-se / phán cho chúng ta
  rationale: Mạch văn liên quan đến địa vị và thẩm quyền tiên tri, nên “qua” phù hợp hơn; tuy vậy, khả năng hiểu là người nhận vẫn có thật trong tiếng Hê-bơ-rơ và được bảo lưu ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Chẳng lẽ ... chỉ ... thôi sao?” giữ sức nặng của câu hỏi tu từ; “phán” phù hợp với lời thần thượng. Dấu chú thích [a] được đặt ngay sau mệnh đề đầu, nơi sự mơ hồ của giới từ xuất hiện lần đầu.
