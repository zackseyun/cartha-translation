source:
  edition: WLC
  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: vi
  text: Nhưng tôi tớ Ta là Môi-se thì không như vậy; người trung tín trong cả nhà Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong toàn thể gia đình Ta.” Từ Hê-bơ-rơ được dịch là “nhà” cũng có thể chỉ gia đình hoặc toàn bộ những người thuộc về một người, chứ không chỉ một công trình kiến trúc.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: thì không như vậy
  rationale: Cụm này tạo thế tương phản mạnh với cách Đức Chúa Trời phán qua khải tượng và giấc mơ ở câu trước; cách diễn đạt tiếng Việt này tự nhiên và vẫn giữ sắc thái bác bỏ.
- source_word: עַבְדִּי
  choice: tôi tớ Ta
  rationale: Trong ngữ cảnh này, עֶבֶד là danh xưng cao trọng nói về sự phục vụ và mối quan hệ của Môi-se với Đức Chúa Trời, chứ không nhấn mạnh thân phận nô lệ.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: בְּכָל בֵּיתִי
  choice: trong cả nhà Ta
  rationale: Giữ giới từ và hình ảnh 'nhà' của nguyên văn, đồng thời không thu hẹp nghĩa thành một kiến trúc vật chất hay diễn giải thành quyền cai quản.
- source_word: נֶאֱמָן
  choice: trung tín
  rationale: Từ này diễn đạt sự đáng tin cậy và lòng trung thành; 'trung tín' phù hợp với lời xác nhận của Đức Chúa Trời về Môi-se.
- source_word: הוּא
  choice: người
  rationale: Đại từ độc lập được chuyển thành 'người' để chỉ Môi-se một cách trang trọng, tự nhiên trong tiếng Việt và làm chủ ngữ cho mệnh đề sau.
theological_decisions:
- issue: Ý nghĩa của “nhà Ta” đối với vai trò của Môi-se
  choice: Giữ ẩn dụ “nhà Ta” trong chính văn.
  alternative: “toàn thể gia đình Ta” hoặc “toàn dân Ta”
  rationale: בַּיִת có thể chỉ gia đình, cộng đồng thuộc về Đức Chúa Trời hoặc phạm vi của Ngài, nhưng nguyên văn vẫn dùng hình ảnh 'nhà'. Giữ hình ảnh này bảo tồn tính hàm súc và mối liên hệ với những đoạn Kinh Thánh về sau mà không quyết định thay cho người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Trời và “người” để nói về Môi-se. Cấu trúc tương phản được sắp xếp tự nhiên theo tiếng Việt, đồng thời giữ nguyên ẩn dụ “nhà Ta”.
