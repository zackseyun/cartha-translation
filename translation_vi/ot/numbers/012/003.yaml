  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: vi
  text: Môi-se là người rất khiêm nhường, khiêm nhường hơn bất cứ ai trên mặt đất.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הָ/אִישׁ מֹשֶׁה
  choice: Môi-se là người
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, vẫn thể hiện danh từ הָאִישׁ thay vì lược bỏ; waw mang chức năng nối tiếp mạch văn nên không cần dịch máy móc là “và”.
- source_word: ענו
  choice: khiêm nhường
  rationale: Trong ngữ cảnh này, từ này tự nhiên nhất khi chỉ phẩm chất khiêm nhường của Môi-se. “Nhu mì” cũng có thể dùng nhưng dễ gợi sắc thái thụ động hoặc mang màu sắc văn phong tôn giáo hơn trong tiếng Việt hiện đại.
- source_word: מְאֹד
  choice: rất
  rationale: Trạng từ tăng cường thông dụng, truyền đạt trực tiếp mức độ mạnh của tiếng Hê-bơ-rơ.
- source_word: מִ/כֹּל֙ הָֽ/אָדָ֔ם
  choice: hơn bất cứ người nào
  rationale: Diễn đạt tự nhiên cấu trúc so sánh מן + כֹּל; הָאָדָם ở đây mang nghĩa khái quát, chỉ mọi người nói chung.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: trên mặt đất
  rationale: Mệnh đề quan hệ có thể được rút gọn tự nhiên trong tiếng Việt mà không mất nghĩa; “trên mặt đất” giữ hình ảnh của thành ngữ Hê-bơ-rơ và dễ hiểu.
theological_decisions:
- issue: Nghĩa của ענו khi mô tả Môi-se
  choice: khiêm nhường
  alternative: nhu mì; chịu khổ; thấp hèn
  rationale: Ngữ cảnh ưu tiên phẩm chất nội tâm “khiêm nhường”, nhưng không biến câu thành một khẳng định giáo lý vượt quá phạm vi từ ngữ.
- issue: Phạm vi khái quát của הָאָדָם
  choice: bất cứ người nào
  alternative: mọi người; bất cứ người nam nào
  rationale: Danh từ ở đây có nghĩa khái quát về con người, không giới hạn ở nam giới; “người nào” vừa chính xác vừa tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc nhấn mạnh Môi-se là “người” nhưng sắp xếp lại theo cú pháp tiếng Việt tự nhiên. Không cần chú thích vì nghĩa khái quát của “người” đã rõ trong bản dịch.
