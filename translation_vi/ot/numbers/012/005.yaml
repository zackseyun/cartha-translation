id: NUM.12.5
reference: Numbers 12:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: vi
  text: Bấy giờ, Yahweh ngự xuống trong một trụ mây và đứng tại lối vào Lều[a]. Ngài gọi A-rôn và Mi-ri-am; cả hai người bước ra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “lều”; theo ngữ cảnh, đây là Lều Hội Kiến.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “cả hai người đi ra”. Động từ Hê-bơ-rơ theo nghĩa đen là “đi ra”, và ở đây có lẽ chỉ việc họ bước ra đáp lại tiếng gọi của Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ngự xuống
  rationale: Động từ ירד diễn tả chuyển động đi xuống. “Ngự xuống” giữ hình ảnh cụ thể của bản Hê-bơ-rơ, đồng thời tự nhiên và trang trọng khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng phiên âm phổ biến, thay vì thay thế bằng một tước hiệu.
- source_word: בְּעַמּוּד עָנָן
  choice: trong một trụ mây
  rationale: 'Giới từ בְּ ở đây tự nhiên nhất là chỉ cách thức hoặc phương tiện biểu hiện: Yahweh ngự xuống “trong” một trụ mây. Danh từ không có mạo từ nên dùng “một”.'
- source_word: וַיַּעֲמֹד
  choice: đứng
  rationale: Giữ nghĩa trực tiếp của עמד và trình tự kể chuyện đơn giản.
- source_word: פֶּתַח הָאֹהֶל
  choice: tại lối vào Lều
  rationale: פתח là lối vào hoặc cửa vào; אֹהֶל ở đây có mạo từ và theo ngữ cảnh chỉ Lều Hội Kiến, nhưng câu Hê-bơ-rơ chỉ nói “Lều”, nên bản chính không mở rộng thành tên đầy đủ.
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: קרא có nghĩa thông thường là “gọi”; ngữ cảnh tự nó cho thấy đây là lời gọi hai người đến trình diện, không cần diễn giải thành “triệu đến”.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: A-rôn và Mi-ri-am
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: cả hai người bước ra
  rationale: יצא theo nghĩa đen là “đi ra/bước ra”. Trong ngữ cảnh, họ đáp lại tiếng gọi bằng cách bước ra trình diện; “bước ra” vừa giữ động tác gốc vừa tự nhiên. שְׁנֵיהֶם được thể hiện rõ bằng “cả hai người”.
theological_decisions:
- issue: Cách chuyển tên יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Dùng tên riêng thay vì thay bằng tước hiệu, nhờ đó bảo toàn sự phân biệt có trong nguyên văn mà không áp đặt truyền thống hệ phái.
- issue: Hình ảnh Yahweh đi xuống
  choice: Giữ chuyển động cụ thể bằng “ngự xuống”
  alternative: Diễn giải thành “hiện ra”
  rationale: Nguyên văn dùng động từ ירד, không chỉ nói về sự hiện ra. Giữ hình ảnh đi xuống bảo toàn ngôn ngữ thần hiện và không tự giải quyết căng thẳng thần học liên quan đến sự hiện diện của Đức Chúa Trời.
- issue: Xác định chiếc lều
  choice: Giữ “Lều” trong câu chính và giải thích bằng chú thích
  alternative: Dịch thẳng là “Lều Hội Kiến”
  rationale: Ngữ cảnh cho thấy đây là Lều Hội Kiến, nhưng cụm từ trong câu chỉ là “lều”. Cách dịch này vừa giữ hình thức nguồn vừa giúp độc giả nhận ra sở chỉ qua chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, sáng rõ và trang trọng vừa phải. “Ngự xuống” phù hợp với chủ thể thần linh nhưng vẫn giữ hình ảnh chuyển động cụ thể; tên riêng và thuật ngữ được trình bày theo lối quen đọc trong tiếng Việt. Các dấu chú thích [a], [b] đều đặt ngay sau từ hoặc mệnh đề liên quan.
