  text: וַ/יִּֽחַר אַ֧ף יְהוָ֛ה בָּ֖/ם וַ/יֵּלַֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: vi
  text: Cơn giận của Yahweh bùng lên chống lại họ[a], rồi Ngài rời đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen, tiếng Hê-bơ-rơ nói: “mũi của Yahweh nóng lên chống lại họ,” một thành ngữ có nghĩa là cơn giận của Yahweh bùng lên chống lại họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר
  choice: bừng lên
  rationale: Động từ חרה diễn tả cơn giận trở nên nóng hoặc cháy. “Bừng lên” tự nhiên trong tiếng Việt và vẫn giữ hình ảnh sức nóng của nguyên ngữ.
- source_word: אַף
  choice: cơn giận
  rationale: Nghĩa đen là “mũi”, nhưng trong thành ngữ đi với חרה, từ này chỉ sự giận dữ. “Cơn giận” truyền đạt đúng nghĩa thành ngữ mà không nâng sắc thái quá mức thành “thịnh nộ”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: בָּם
  choice: chống lại họ
  rationale: Trong thành ngữ về cơn giận, giới từ בְּ đánh dấu những người làm đối tượng của cơn giận; “chống lại họ” diễn đạt rõ hướng đối nghịch.
- source_word: וַיֵּלַךְ
  choice: rồi Ngài rời đi
  rationale: הלך ở đây nói đến việc Yahweh rút đi sau khi phán. “Rời đi” ngắn gọn, tự nhiên và không thêm cách thức không có trong nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Phiên âm “Yahweh” giữ đây là tên riêng, không thay bằng tước hiệu.
- issue: Tính cụ thể của việc Yahweh rời đi
  choice: Ngài rời đi
  alternative: Ngài rút sự hiện diện đi
  rationale: Nguyên văn chỉ dùng động từ “đi/rời đi”; bản dịch không xác định thêm phương thức hay ý nghĩa thần học của sự rời đi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế giữ trình tự của tiếng Hê-bơ-rơ; đại từ “Ngài” làm rõ chủ thể tiếp diễn nhưng không thêm nội dung.
