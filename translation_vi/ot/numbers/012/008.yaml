base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: vi
  text: Ta phán với người miệng đối miệng[a], rõ ràng, không bằng lời bí ẩn; người chiêm ngưỡng hình dạng của Yahweh[b]. Vậy tại sao các ngươi không sợ nói chống lại đầy tớ Ta, là Môi-se?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “miệng đối miệng”; thành ngữ này nhấn mạnh việc phán trực tiếp. Cũng có thể dịch: “mặt đối mặt.”'
    reason: lexical_alternative
  - marker: b
    text: “Hình dạng” cũng có thể dịch là “hình tượng” hoặc “diện mạo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: trực tiếp với người, miệng đối miệng
  rationale: Giữ nguyên hình ảnh cụ thể “miệng đối miệng” của tiếng Hê-bơ-rơ, đồng thời thêm “trực tiếp” để thành ngữ được người đọc tiếng Việt hiện đại hiểu đúng là sự giao tiếp trực tiếp.
- source_word: אֲדַבֶּר בּוֹ
  choice: Ta nói chuyện ... với người
  rationale: Động từ דבר đi với ב diễn tả việc nói chuyện, giao tiếp với một người; “nói chuyện với” phản ánh sắc thái tương hỗ tự nhiên hơn chỉ “nói với”.
- source_word: וּמַרְאֶה
  choice: rõ ràng
  rationale: Trong thế đối lập với “không bằng những lời bí ẩn”, từ này chỉ cách truyền đạt hiển nhiên, rõ ràng; cách dịch trạng từ tạo câu tiếng Việt tự nhiên mà vẫn giữ tương phản.
- source_word: וְלֹא בְחִידֹת
  choice: chứ không bằng những lời bí ẩn
  rationale: חִידוֹת có thể chỉ câu đố, ẩn ngữ hay lời khó hiểu. “Những lời bí ẩn” phù hợp ngữ cảnh mặc khải và tránh gợi trò đố vui.
- source_word: וּתְמֻנַת יְהוָה
  choice: hình dạng của Yahweh
  rationale: תְּמוּנָה chỉ hình dạng, hình tượng hay dáng hiện ra. “Hình dạng” giữ tính cụ thể và không xác định quá mức bản chất của sự hiện thấy; danh riêng giao ước được phiên là “Yahweh”.
- source_word: יַבִּיט
  choice: người chiêm ngưỡng
  rationale: Dạng Hiphil của נבט diễn tả việc chăm chú nhìn; “chiêm ngưỡng” giữ sắc thái chủ ý và trang trọng.
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: Vậy tại sao các ngươi không sợ
  rationale: “Vậy” thể hiện kết luận trách cứ từ mệnh đề trước; “không sợ” giữ sức nặng trực tiếp của ירא.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: nói nghịch cùng đầy tớ Ta, cùng Môi-se
  rationale: Giới từ ב lặp lại trong ngữ cảnh mang nghĩa lời nói chống nghịch. Việc lặp “cùng” bảo tồn cấu trúc nhấn mạnh và quan hệ đồng vị của nguyên văn.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng một tước hiệu.
- issue: Lời mô tả sự mặc khải độc đáo dành cho Môi-se
  choice: hình dạng của Yahweh
  alternative: hình tượng của Yahweh / diện mạo của Yahweh
  rationale: Bản dịch giữ lời khẳng định cụ thể của תְּמוּנָה nhưng không giải thích bản thể của điều Môi-se thấy, nhờ đó bảo tồn sự căng thẳng thần học trong câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “Ta” dành cho lời Đức Chúa Trời; “người” chỉ Môi-se; “các ngươi” giữ giọng quở trách số nhiều. Tên Môi-se dùng dạng quen thuộc trong tiếng Việt. Tất cả dấu chú thích đều xuất hiện ngay trong chính văn.
