  text: וְ/אַחַ֛ר נָסְע֥וּ הָ/עָ֖ם מֵ/חֲצֵר֑וֹת וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּ֥ר פָּארָֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/016.yaml
  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: vi
  text: Sau đó, dân chúng rời Ha-xê-rốt và đóng trại trong hoang mạc Pha-ran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: Sau đó
  rationale: Diễn tả trình tự thời gian sau các sự việc vừa kể, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: נָסְעוּ
  choice: rời
  rationale: Trong các trình thuật hành trình, động từ נסע chỉ việc nhổ trại và lên đường; ở đây “rời Ha-xê-rốt” diễn đạt gọn, tự nhiên và giữ đúng hướng chuyển động từ địa điểm ấy.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ toàn thể cộng đồng Ít-ra-ên; “dân chúng” giữ sắc thái tập thể mà không thêm cách gọi mang tính diễn giải.
- source_word: מֵחֲצֵרוֹת
  choice: từ Ha-xê-rốt
  rationale: Địa danh được phiên âm sang tiếng Việt; giới từ מִן đánh dấu nơi khởi hành.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה chỉ việc dừng lại và lập trại; “đóng trại” là cách nói tự nhiên, hiện đại.
- source_word: בְּמִדְבַּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng đất hoang vắng, khô cằn; “hoang mạc” phù hợp bối cảnh địa lý và văn phong Kinh Thánh tiếng Việt.
- source_word: פָּארָן
  choice: Pha-ran
  rationale: Địa danh được phiên âm theo âm tiết dễ đọc đối với độc giả Việt.
theological_decisions: []
