translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Mi-ri-am” theo lối phiên âm tên riêng Kinh Thánh; đại từ “bà” tránh lặp tên mà vẫn tôn trọng nhân vật. Dấu chú thích được đặt ngay sau cụm từ liên quan.
