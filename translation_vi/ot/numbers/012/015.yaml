  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: vi
  text: Vậy, Mi-ri-am bị cách ly bên ngoài trại trong bảy ngày, và dân chúng không lên đường cho đến khi bà được đưa vào lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “cho đến khi Mi-ri-am được tập hợp vào.” Tiếng Hê-bơ-rơ dùng động từ “tập hợp”; trong ngữ cảnh này, từ ấy chỉ việc bà được đưa trở lại trại sau thời gian bị cách ly.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: bị cách ly
  rationale: Thể Niphal của סגר diễn tả việc Mi-ri-am bị đặt trong tình trạng tách biệt hoặc đóng ở ngoài; “bị cách ly” tự nhiên trong tiếng Việt hiện đại và phù hợp với bối cảnh bị loại khỏi trại trong một thời gian.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: bên ngoài trại
  rationale: Chuyển đạt trực tiếp vị trí ở ngoài khu trại của dân Ít-ra-ên trong hành trình qua hoang mạc.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Cụm từ chỉ khoảng thời gian; cách diễn đạt này tự nhiên và giữ nguyên thời lượng của bản Hê-bơ-rơ.
- source_word: הָעָם
  choice: dân chúng
  rationale: Trong ngữ cảnh này, từ này chỉ toàn thể cộng đồng Ít-ra-ên đang di chuyển; “dân chúng” rõ nghĩa và tự nhiên.
- source_word: לֹא נָסַע
  choice: không lên đường
  rationale: נסע trong các trình thuật hoang mạc thường nói đến việc nhổ trại để tiếp tục hành trình; “lên đường” truyền đạt đúng sắc thái này.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: cho đến khi bà được đón vào lại
  rationale: Thể Niphal của אסף có nghĩa đen là được tập hợp hoặc thu nhận vào; trong ngữ cảnh, Mi-ri-am được tiếp nhận trở lại trại sau thời gian bị cách ly. “Đón vào lại” diễn đạt tự nhiên hàm ý phục hồi này, còn nghĩa đen được giữ trong chú thích.
