  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה וְ/אָבִ֨י/הָ֙ יָרֹ֤ק יָרַק֙ בְּ/פָנֶ֔י/הָ הֲ/לֹ֥א תִכָּלֵ֖ם שִׁבְעַ֣ת יָמִ֑ים תִּסָּגֵ֞ר שִׁבְעַ֤ת יָמִים֙ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/אַחַ֖ר תֵּאָסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Nếu cha nàng nhổ vào mặt nàng, chẳng phải nàng sẽ chịu nhục trong bảy ngày sao?[a] Nàng phải bị cách ly ngoài trại bảy ngày; sau đó nàng sẽ được đưa trở lại trại.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chẳng phải nàng sẽ hổ thẹn trong bảy ngày sao?”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “sau đó nàng sẽ được thu nhận vào lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: יָרֹק יָרַק
  choice: nhổ
  rationale: Kết cấu nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động; tiếng Việt tự nhiên không cần lặp động từ, còn sắc thái giả định được thể hiện bằng “nếu”.
- source_word: בְּפָנֶיהָ
  choice: vào mặt nàng
  rationale: Diễn đạt trực tiếp hành vi sỉ nhục công khai trong ngữ cảnh.
- source_word: תִכָּלֵם
  choice: sẽ chịu nhục
  rationale: Thể Niphal chỉ việc bị làm cho hổ thẹn hoặc mất thể diện; “chịu nhục” giữ được cả khía cạnh xã hội lẫn sắc thái bị động.
- source_word: תִּסָּגֵר
  choice: hãy biệt riêng nàng
  rationale: Chuyển tải việc nàng bị tách khỏi cộng đồng theo sắc thái mệnh lệnh, đồng thời tự nhiên hơn cách dịch sát chữ “bị đóng lại” trong tiếng Việt.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: bên ngoài trại quân
  rationale: Cách diễn đạt rõ ràng về nơi bị loại ra khỏi cộng đồng đang đóng trại.
- source_word: תֵּאָסֵף
  choice: sẽ được đón trở lại
  rationale: Giữ thể bị động và ý nghĩa được đưa trở vào cộng đồng sau thời gian bị loại ra ngoài.
theological_decisions:
- issue: Tính chất của mệnh đề người cha nhổ vào mặt
  choice: Một giả định dùng làm phép so sánh về sự nhục nhã và thời gian bị loại ra ngoài
  alternative: Lời nhắc đến một biến cố đã thực sự xảy ra
  rationale: Cấu trúc tiếng Hê-bơ-rơ là câu điều kiện mang tính tu từ; bản dịch giữ nguyên phép so sánh mà không thêm ý nghĩa biểu tượng hay giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “nàng” giúp theo sát giống cái trong nguyên văn và tránh cách gọi quá khẩu ngữ; “biệt riêng” diễn đạt sự cách ly khỏi trại mà không hàm ý cơ chế pháp lý ngoài văn cảnh.
