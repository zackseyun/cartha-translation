revisions:
- from: 'Yahweh phán với Môi-se: “Nếu cha nàng nhổ vào mặt nàng, chẳng phải nàng sẽ chịu nhục trong bảy ngày sao?[a] Hãy biệt riêng nàng bên ngoài trại quân bảy ngày; sau đó nàng sẽ được đón trở lại.[b]”'
  to: 'Yahweh phán với Môi-se: “Nếu cha nàng nhổ vào mặt nàng, chẳng phải nàng sẽ chịu nhục trong bảy ngày sao?[a] Nàng phải bị cách ly ngoài trại bảy ngày; sau đó nàng sẽ được đưa trở lại trại.[b]”'
  rationale: Thay “biệt riêng” bằng “bị cách ly” để tránh hàm nghĩa thánh hiến và phản ánh thể Niphal của תִּסָּגֵר. Đơn giản hóa “trại quân” thành “trại”, và đổi mệnh đề cuối thành “được đưa trở lại trại” để giữ sắc thái bị động cùng ý phục hồi vào cộng đồng. Các chú thích được giữ nguyên nội dung và đặt đúng sau cụm từ liên quan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:41:22Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lập luận điều kiện tu từ, sự nhục nhã kéo dài bảy ngày, việc bị loại ra ngoài trại, và sự trở lại sau đó. Tuy nhiên, “biệt riêng” thường gợi ý biệt riêng/thánh hiến hơn là bị cách ly, và chưa phản ánh rõ sắc thái bị động của תִּסָּגֵר.
  naturalness: Văn phong trang trọng, hiện đại và dễ hiểu. “Bị cách ly ngoài trại” tự nhiên hơn trong ngữ cảnh quy định cộng đồng, đồng thời tránh hàm nghĩa thánh hiến không có trong nguyên văn.
  terminology: Giữ “Yahweh” và “Môi-se” nhất quán. “Trại” đủ để dịch מַחֲנֶה; không cần thêm “quân”, vốn có thể thu hẹp hoặc quân sự hóa cách không cần thiết. “Được đưa trở lại” giữ ý bị động của תֵּאָסֵף và làm rõ việc trở về cộng đồng/trại.
  issues:
  - severity: medium
    issue: “Hãy biệt riêng nàng” cho תִּסָּגֵר
    rationale: Động từ Niphal diễn tả bị đóng lại/cách ly, tức tình trạng bị loại ra. Trong tiếng Việt, “biệt riêng” thường mang nghĩa dành riêng hoặc thánh hiến; “bị cách ly” phản ánh chính xác hơn cả nghĩa và thể bị động.
  - severity: low
    issue: “trại quân”
    rationale: מַחֲנֶה nghĩa là “trại/đồn trại”; “trại” là cách dịch trung tính và tự nhiên hơn ở đây.
  - severity: low
    issue: “được đón trở lại”
    rationale: Cách nói này hiểu được, nhưng “được đưa trở lại trại” phản ánh rõ hơn động từ bị động “được thu nhận/gom lại” và liên kết với việc bị cách ly ngoài trại.
