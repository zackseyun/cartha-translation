source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: vi
  text: 'Ngài phán: “Bây giờ, hãy nghe lời Ta: Nếu có một nhà tiên tri ở giữa các ngươi,[a] thì Ta, Yahweh, sẽ tỏ mình cho người ấy trong khải tượng;[b] Ta sẽ phán với người ấy trong giấc mơ.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu một người trong các ngươi là nhà tiên tri.” Tiếng Hê-bơ-rơ sát chữ là “nếu có nhà tiên tri của các ngươi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “sẽ bày tỏ chính mình cho người ấy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “Ta sẽ phán cùng người ấy.” Tiếng Hê-bơ-rơ sát chữ có giới từ mang nghĩa “trong/với người ấy”; trong ngữ cảnh này, “phán với người ấy” là cách diễn đạt tự nhiên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngài phán
  rationale: Động từ kể chuyện wayyiqtol mở đầu lời trực tiếp. “Phán” phù hợp với chủ thể là Đức Chúa Trời và giữ sắc thái trang trọng tự nhiên trong tiếng Việt.
- source_word: שִׁמְעוּ נָא
  choice: Bây giờ, hãy nghe
  rationale: Mệnh lệnh số nhiều cùng tiểu từ נָא mang sắc thái thúc giục nghiêm trang. Cách dịch này tự nhiên hơn lối dịch sát chữ nhưng vẫn giữ lực của lời triệu gọi.
- source_word: דְבָרָי
  choice: lời Ta
  rationale: Danh từ số nhiều có hậu tố ngôi thứ nhất số ít; tiếng Việt thường dùng danh từ tập hợp “lời” trong ngữ cảnh này.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: Nếu có một nhà tiên tri ở giữa các ngươi
  rationale: Cụm Hê-bơ-rơ sát chữ là “nếu có nhà tiên tri của các ngươi”; cách dịch đã chọn diễn đạt tự nhiên ý một nhà tiên tri thuộc cộng đồng được ngỏ lời mà không quyết định quá mức cấu trúc mơ hồ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: בַּמַּרְאָה
  choice: trong khải tượng
  rationale: מַרְאָה chỉ sự hiện thấy mang tính mặc khải; “khải tượng” là cách nói trang trọng, dễ hiểu và phân biệt với giấc mơ trong vế song song.
- source_word: אֵלָיו אֶתְוַדָּע
  choice: Ta sẽ tỏ mình cho người ấy
  rationale: Thể Hitpael của ידע ở đây diễn tả việc Đức Chúa Trời làm cho chính mình được biết đến; “tỏ mình” giữ sắc thái phản thân và tự nhiên trong tiếng Việt.
- source_word: בַּחֲלוֹם
  choice: trong giấc mơ
  rationale: Diễn đạt trực tiếp phương thức mặc khải và tạo thế song song với “trong khải tượng”.
- source_word: אֲדַבֶּר בּוֹ
  choice: Ta sẽ phán với người ấy
  rationale: Giới từ בְּ đi với דבר có thể mang nghĩa nói với hoặc phán qua/trong một người. “Phán với” vừa tự nhiên vừa giữ gần hình thức giới từ, trong khi chú thích bảo lưu khả năng khác.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự danh. Phiên âm “Yahweh” giữ đây là danh riêng mà không thay bằng tước hiệu.
- issue: Phương thức mặc khải cho nhà tiên tri
  choice: Yahweh tỏ mình trong khải tượng và phán trong giấc mơ
  alternative: Yahweh hiện ra trong khải tượng và phán qua giấc mơ
  rationale: Bản dịch giữ hai phương thức được nêu trong câu và không thêm một lý thuyết thần học về bản chất hay mức độ của mặc khải.
- issue: Sắc thái của אֲדַבֶּר בּוֹ
  choice: phán với người ấy
  alternative: phán qua người ấy; phán trong người ấy
  rationale: Cấu trúc Hê-bơ-rơ cho phép hơn một cách hiểu về giới từ. Chính văn chọn cách tự nhiên nhất trong ngữ cảnh giao tiếp, còn chú thích giữ lại độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta/các ngươi” giữ giọng phán uy nghiêm của Đức Chúa Trời; “nhà tiên tri,” “khải tượng,” và “giấc mơ” là các thuật ngữ quen thuộc trong tiếng Việt Kinh Thánh. Mọi điểm mơ hồ đáng kể của cấu trúc Hê-bơ-rơ được giữ bằng chú thích thay vì bị giải quyết ngầm.
