  text: וַ/יִּצְעַ֣ק מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹ֑ר אֵ֕ל נָ֛א רְפָ֥א נָ֖א לָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: vi
  text: 'Môi-se liền kêu cầu Yahweh rằng: “Lạy Đức Chúa Trời, xin chữa lành cho bà ấy!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ lặp lại từ “xin”: “Lạy Đức Chúa Trời, xin chữa lành cho bà ấy, xin!” Sự lặp lại nhấn mạnh tính khẩn thiết trong lời cầu xin của Môi-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: liền kêu cầu
  rationale: Động từ צעק diễn tả một tiếng kêu khẩn thiết. “Kêu cầu” phù hợp với lời cầu nguyện, còn “liền” chuyển tải diễn tiến trực tiếp của וַ trong ngữ cảnh.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Giới từ אֶל chỉ đối tượng Môi-se hướng lời kêu cầu đến; tên riêng giao ước יהוה được phiên âm là “Yahweh”, không thay bằng một tước hiệu.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dẫn trực tiếp nội dung lời kêu cầu một cách tự nhiên và gọn trong tiếng Việt.
- source_word: אֵל
  choice: Lạy Đức Chúa Trời
  rationale: אֵל là lời xưng hô trực tiếp với Đức Chúa Trời. “Lạy” thể hiện sắc thái khẩn cầu cung kính, tự nhiên trong lời cầu nguyện tiếng Việt.
- source_word: נָא רְפָא נָא
  choice: xin chữa lành
  rationale: Hai lần נָא nhấn mạnh lời van xin. Bản văn chính diễn đạt tự nhiên bằng một lần “xin”; sự lặp lại của nguyên văn được bảo tồn trong chú thích.
- source_word: לָהּ
  choice: cho bà ấy
  rationale: Hậu tố giống cái số ít chỉ Mi-ri-am. “Bà ấy” diễn đạt đại từ ngôi ba mà không đưa quan hệ chị em vốn không được nói rõ trong câu này vào lời cầu xin.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn sự phân biệt giữa danh riêng này với tước hiệu אֵל trong chính câu.
- issue: Cường độ của lời khẩn cầu do hai lần נָא
  choice: Một lần “xin” trong bản văn chính, kèm chú thích về sự lặp lại
  alternative: “xin chữa lành cho bà ấy, xin Ngài”
  rationale: Cách chọn giữ lời cầu nguyện tự nhiên trong tiếng Việt nhưng không che khuất sự lặp lại đầy khẩn thiết của tiếng Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu ngắn phản ánh lời chuyển cầu trực tiếp, khẩn thiết; tránh lối xưng hô cổ và tránh bổ sung quan hệ “chị” không được biểu thị trong chính đại từ Hê-bơ-rơ.
