  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: vi
  text: Xin đừng để nàng như người chết, khi ra khỏi lòng mẹ thì một nửa thịt của người ấy đã bị hủy hoại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin đừng để nàng như một đứa trẻ chết lưu, khi ra khỏi lòng mẹ thì một nửa thịt của nó đã bị hủy hoại.” Tiếng Hê-bơ-rơ nói “như người chết”; mệnh đề sau gợi hình ảnh một đứa trẻ chết khi lọt lòng mẹ. Một số bản dịch nêu rõ hình ảnh chết lưu ngay trong chính văn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Xin đừng
  rationale: אַל diễn đạt sự ngăn cấm, còn נָא làm lời nói mang sắc thái khẩn khoản; “Xin đừng” tự nhiên và giữ được tính van nài.
- source_word: תְהִי
  choice: để nàng như
  rationale: Dạng vị hoàn thành chưa hoàn tất/nguyện cầu ngôi ba giống cái sau אַל diễn đạt lời cầu xin phủ định. “Nàng” chỉ Mi-ri-am trong ngữ cảnh.
- source_word: כַּמֵּת
  choice: như một người đã chết
  rationale: Giữ nghĩa so sánh tương đối sát là “như người chết”, không đưa cách hiểu thai chết lưu vào chính văn trước khi mệnh đề sau làm rõ hình ảnh.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: lúc ra khỏi lòng mẹ
  rationale: Giữ sắc thái thời gian và hình ảnh cụ thể của nguyên văn, đồng thời diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: một nửa thịt đã bị tiêu hủy
  rationale: Động từ theo nghĩa đen có thể là “bị ăn mất”, nhưng trong hình ảnh này mô tả tình trạng phần thịt bị hủy hoại. “Thịt” bảo tồn tính chất thể lý mạnh của בשר.
theological_decisions:
- issue: Đối tượng của động từ giống cái số ít
  choice: “nàng” chỉ Mi-ri-am
  alternative: Lặp tên “Mi-ri-am”
  rationale: Ngữ cảnh trực tiếp xác định Mi-ri-am là người được A-rôn cầu xin cho; đại từ giữ gần cấu trúc nguyên văn mà vẫn rõ nghĩa.
- issue: Hình ảnh người chết khi lọt lòng mẹ
  choice: Giữ cách nói “một người đã chết” trong chính văn
  alternative: Dịch rõ thành “một thai chết lưu” hoặc “đứa trẻ chết lưu”
  rationale: כַּמֵּת tự nó chỉ nói “như người chết”; ý niệm chết từ khi sinh ra phát sinh từ toàn bộ mệnh đề. Giữ độ mơ hồ chân thực trong chính văn và nêu cách hiểu rõ hơn ở chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Xin đừng” truyền đạt lời van nài khẩn thiết; “thịt” và “tiêu hủy” giữ hình ảnh thể lý khắc nghiệt mà không dùng lối nói quá cổ.
