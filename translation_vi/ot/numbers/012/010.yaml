base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: vi
  text: Đám mây rời khỏi phía trên Lều. Kìa, Mi-ri-am mắc chứng bệnh ngoài da, trắng như tuyết. A-rôn quay sang Mi-ri-am, và kìa, bà mắc chứng bệnh ngoài da.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Danh từ có mạo từ xác định, chỉ đám mây hữu hình gắn với sự hiện diện của Đức Chúa Trời trong ngữ cảnh.
- source_word: סָר
  choice: rời khỏi
  rationale: Động từ diễn tả việc chuyển đi hoặc rút khỏi vị trí trước đó; cách dịch này tự nhiên và giữ được ý chuyển động.
- source_word: מֵעַל הָאֹהֶל
  choice: khỏi phía trên Lều
  rationale: מֵעַל chỉ chuyển động ra khỏi vị trí ở phía trên. Dùng “Lều” thay vì diễn giải thành “Lều Hội Kiến” để giữ sát cách gọi ngắn gọn của câu Hê-bơ-rơ, đồng thời viết hoa theo vật quy chiếu trong ngữ cảnh.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: Tiểu từ tạo sự bất ngờ và trình bày cảnh tượng cách sống động; “kìa” giữ được sắc thái ấy trong tiếng Việt hiện đại.
- source_word: מְצֹרַעַת
  choice: mắc chứng bệnh ngoài da
  rationale: Từ Hê-bơ-rơ chỉ tình trạng thuộc phạm vi צָרַעַת, rộng hơn bệnh Hansen theo y học hiện đại. Cách dịch này tránh đồng nhất sai với bệnh phong hiện đại; chú thích bảo lưu phạm vi nghĩa và thuật ngữ truyền thống.
- source_word: כַּשָּׁלֶג
  choice: trắng như tuyết
  rationale: Nguyên văn nói “như tuyết”; trong ngữ cảnh bệnh ngoài da, thêm “trắng” làm rõ phương diện so sánh vốn được hàm ý và tạo câu tiếng Việt tự nhiên.
- source_word: וַיִּפֶן ... אֶל
  choice: quay về phía
  rationale: Diễn đạt hành động A-rôn xoay người hoặc hướng sự chú ý về phía Mi-ri-am, không thu hẹp động từ thành chỉ “nhìn”.
- source_word: וְהִנֵּה מְצֹרָעַת
  choice: và kìa, bà đã mắc chứng bệnh ấy
  rationale: Giữ sự lặp lại đầy kịch tính của וְהִנֵּה và tình trạng bệnh, đồng thời dùng đại từ cùng từ thay thế để tiếng Việt không nặng nề.
theological_decisions:
- issue: Phạm vi của צָרַעַת
  choice: Dịch là “chứng bệnh ngoài da” và giải thích trong chú thích.
  alternative: Dịch là “bệnh phong” hoặc “phong hủi”.
  rationale: Thuật ngữ Hê-bơ-rơ thuộc hệ thống chẩn định nghi lễ của Cựu Ước và không nhất thiết tương ứng với bệnh Hansen; tránh áp một chẩn đoán y học hiện đại lên bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kìa” giữ nhịp kể sống động của nguyên văn; “Lều” được viết hoa vì trong ngữ cảnh đây là Lều Hội Kiến. Dấu chấm than sau hình ảnh “trắng như tuyết” thể hiện sức mạnh cảm thán của וְהִנֵּה mà không thêm nội dung thần học.
