revisions:
- from: Đám mây rời khỏi phía trên Lều. Kìa, Mi-ri-am mắc chứng bệnh ngoài da[a], trắng như tuyết! A-rôn quay về phía Mi-ri-am, và kìa, bà đã mắc chứng bệnh ấy.
  to: Đám mây rời khỏi phía trên Lều. Kìa, Mi-ri-am mắc chứng bệnh ngoài da, trắng như tuyết. A-rôn quay sang Mi-ri-am, và kìa, bà mắc chứng bệnh ngoài da.
  rationale: Bản sửa loại bỏ sắc thái “đã” không có trong nguyên ngữ, lặp lại “mắc chứng bệnh ngoài da” để phản ánh sự lặp lại nhấn mạnh của tiếng Hê-bơ-rơ, và dùng “quay sang” cho cách diễn đạt tiếng Việt tự nhiên. Hình ảnh “trắng như tuyết” được giữ vì là hàm ý ngữ cảnh rõ ràng của phép so sánh, không phải một chẩn đoán y học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:41:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng diễn tiến chính và bảo lưu hợp lý phạm vi rộng của מְצֹרַעַת qua chú thích. Tuy nhiên, “đã mắc” thêm sắc thái hoàn thành không được đánh dấu trong nguyên văn, còn “chứng bệnh ấy” làm yếu sự lặp lại có chủ ý của מְצֹרָעַת. “Trắng như tuyết” là cách làm rõ an toàn hình ảnh so sánh vốn hàm ý màu trắng trong ngữ cảnh.
  naturalness: Câu sửa giữ giọng kể trang trọng, hiện đại và nhịp nhấn của hai lần וְהִנֵּה bằng “Kìa”. “Quay sang” tự nhiên hơn “quay về phía” trong ngữ cảnh A-rôn hướng người về phía Mi-ri-am.
  terminology: “Bệnh ngoài da” là cách dịch không đồng nhất צָרַעַת với bệnh Hansen. Chú thích cần giữ thuật ngữ truyền thống để người đọc nhận ra liên hệ, đồng thời nói rõ đây không nhất thiết là chẩn đoán y học hiện đại.
  issues:
  - severity: medium
    issue: “bà đã mắc chứng bệnh ấy” thêm thể hoàn thành và thay thế sự lặp lại của nguyên ngữ.
    rationale: 'Mệnh đề Hê-bơ-rơ chỉ lặp lại: “và kìa, [bà] bị/mắc צָרַעַת”; không có dấu hiệu tương ứng với “đã”, và sự lặp lại của tình trạng là một nét tu từ cần được duy trì.'
  - severity: low
    issue: “quay về phía” hơi nặng trong văn kể tiếng Việt.
    rationale: וַיִּפֶן אֶל diễn tả A-rôn xoay/hướng sang Mi-ri-am; “quay sang” vừa tự nhiên vừa không thu hẹp thành chỉ hành động nhìn.
  revised_text: Đám mây rời khỏi phía trên Lều. Kìa, Mi-ri-am mắc chứng bệnh ngoài da, trắng như tuyết. A-rôn quay sang Mi-ri-am, và kìa, bà mắc chứng bệnh ngoài da.
