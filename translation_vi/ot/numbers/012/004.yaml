base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: vi
  text: 'Yahweh thình lình phán với Môi-se, A-rôn và Mi-ri-am: “Cả ba người hãy ra[a] Lều Hội Kiến.” Thế là cả ba người đi ra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy đi ra đến Lều Hội Kiến.” Động từ Hê-bơ-rơ chỉ sự đi ra khỏi một nơi; tự nó không xác định hướng nhìn là “đi” hay “đến” trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu; phù hợp trực tiếp với bản Hê-bơ-rơ.
- source_word: פִּתְאֹם
  choice: thình lình
  rationale: Diễn tả cả tính bất ngờ lẫn tức thời của lời phán; tự nhiên và trang trọng trong văn kể chuyện tiếng Việt.
- source_word: צְאוּ
  choice: hãy đi ra
  rationale: Động từ יצא chỉ sự di chuyển từ bên trong ra ngoài; ngữ cảnh không buộc phải hiểu theo hướng ‘đến’ người nói, nên chọn ‘đi ra’ và ghi chú phương án ‘ra đây’.
- source_word: שְׁלָשְׁתְּכֶם
  choice: cả ba người
  rationale: Giữ sự nhấn mạnh rằng cả ba người được gọi chung, đồng thời tự nhiên hơn lối nói ‘ba người các ngươi’ trong tiếng Việt hiện đại.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi quen thuộc, trang trọng của nơi Yahweh gặp gỡ dân Ngài; viết hoa để thể hiện đây là tên gọi xác định của lều thánh.
- source_word: וַיֵּצְאוּ
  choice: đi ra
  rationale: Dịch trực tiếp động từ kể chuyện יצא, cho biết họ làm theo mệnh lệnh.
- source_word: שְׁלָשְׁתָּם
  choice: cả ba người đều
  rationale: Tái hiện sự nhắc lại có chủ ý trong tiếng Hê-bơ-rơ và làm rõ rằng không ai trong ba người vắng mặt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; giữ dạng ‘Yahweh’ bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm. Giữ tên riêng theo dạng Việt hóa thông dụng Môi-se, A-rôn, Mi-ri-am; dùng ‘phán’ cho lời trực tiếp của Yahweh và giữ sự lặp lại ‘cả ba người’ của nguyên văn.
