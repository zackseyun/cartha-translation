source:
  edition: WLC
  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: vi
  text: Mi-ri-am và A-rôn nói chống lại Môi-se vì người phụ nữ Cút mà ông đã lấy làm vợ[a], bởi ông đã lấy một người phụ nữ Cút[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lấy làm vợ” dịch một thành ngữ Hê-bơ-rơ có nghĩa đen là “lấy”.
    reason: lexical_alternative
  - marker: b
    text: Hay “một người phụ nữ Ê-thi-ô-pi-a”. Tiếng Hê-bơ-rơ nói “người phụ nữ Cút”, tức một phụ nữ thuộc xứ hoặc dân Cút.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר ... בְּמֹשֶׁה
  choice: nói chống lại Môi-se
  rationale: Động từ דבר tự nó có nghĩa là “nói”; với giới từ ב và theo ngữ cảnh đối nghịch, cụm này tự nhiên mang nghĩa nói chống lại một người, nhưng không cần diễn giải mạnh hơn thành “chỉ trích” hay “phàn nàn”.
- source_word: מִרְיָם וְאַהֲרֹן
  choice: Mi-ri-am và A-rôn
  rationale: Giữ nguyên thứ tự hai tên như tiếng Hê-bơ-rơ. Động từ ở giống cái số ít có thể cho thấy Mi-ri-am giữ vai trò nổi bật hoặc khởi xướng, nhưng bản dịch không biến khả năng ngữ pháp ấy thành một khẳng định rõ hơn nguyên văn.
- source_word: עַל אֹדוֹת
  choice: vì
  rationale: Cụm này nêu lý do hoặc duyên cớ của lời chống đối; “vì” ngắn gọn, tự nhiên và giữ được quan hệ nguyên nhân.
- source_word: הָאִשָּׁה הַכֻּשִׁית
  choice: người phụ nữ Cút
  rationale: אִשָּׁה có thể là “phụ nữ” hoặc “vợ”; dùng “người phụ nữ” bảo tồn cách diễn đạt của nguyên văn, còn mệnh đề theo sau làm rõ quan hệ hôn nhân. “Cút” chỉ người thuộc xứ/dân Cút và tránh đồng nhất trực tiếp với quốc gia Ê-thi-ô-pi-a hiện đại.
- source_word: אֲשֶׁר לָקָח
  choice: mà ông đã lấy làm vợ
  rationale: לקח nghĩa đen là “lấy”, nhưng trong ngữ cảnh hôn nhân là thành ngữ chỉ việc lấy một người làm vợ. Cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: כִּי
  choice: bởi
  rationale: Từ này mở đầu lời giải thích nhắc lại lý do vừa nêu; “bởi” giữ sắc thái giải thích và giúp bảo tồn sự lặp lại có chủ ý.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: ông đã lấy một người phụ nữ Cút
  rationale: Giữ lại lời nhắc lại nhấn mạnh của tiếng Hê-bơ-rơ thay vì lược bỏ hoặc làm trơn câu.
theological_decisions:
- issue: Danh tính và nguồn gốc của vợ Môi-se
  choice: Dịch כֻשִׁית là “Cút”, không đồng nhất người phụ nữ này với Xíp-pô-ra và cũng không hài hòa hóa với nguồn gốc Ma-đi-an.
  alternative: Dịch là “Ê-thi-ô-pi-a” hoặc giải thích đây chính là Xíp-pô-ra.
  rationale: Câu này chỉ gọi bà là người phụ nữ Cút. Bản dịch giữ nguyên cách định danh địa lý-dân tộc của văn bản và không giải quyết một cuộc tranh luận lịch sử mà câu Kinh Thánh không giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ sự lặp lại của nguyên văn để bảo tồn sắc thái nhấn mạnh. Các tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt; “Cút” được dùng thay vì tên quốc gia hiện đại “Ê-thi-ô-pi-a”.
