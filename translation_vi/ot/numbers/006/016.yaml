  source_fidelity: Bản dịch phân biệt đúng giữa הִקְרִיב, hành động đem/trình các lễ vật đến trước Yahweh, và וְעָשָׂה, hành động thực hiện/dâng các lễ tế. Tân ngữ số nhiều ngầm của động từ đầu được cung cấp hợp lý từ câu trước. Tuy nhiên, chú thích a đổi danh Yahweh trong bản văn thành “Đức Chúa Trời” và diễn giải “nghi lễ dâng” rộng hơn hành động dâng các lễ vật trong nguyên văn.
  naturalness: Câu chính nhìn chung tự nhiên, trang trọng. “Trước Yahweh” gọn và tự nhiên hơn “trước mặt Yahweh” trong câu này. “Lễ chuộc tội” là thuật ngữ tế lễ Việt ngữ ngắn gọn, quen dùng hơn “lễ vật chuộc tội”. Chú thích b nên tránh cụm “ngôn ngữ tế lễ của các thầy tế lễ”, vốn nặng và lặp ý.
  terminology: Giữ “Yahweh” nhất quán cho יהוה. “Thầy tế lễ,” “lễ chuộc tội,” và “lễ thiêu” phù hợp với ngữ cảnh tế lễ. Chú thích giữ lựa chọn “lễ thanh tẩy” như một khả năng từ vựng, không áp đặt một cách hiểu duy nhất.
