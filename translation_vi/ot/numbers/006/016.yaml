source:
  edition: WLC
  text: וְ/הִקְרִ֥יב הַ/כֹּהֵ֖ן לִ/פְנֵ֣י יְהוָ֑ה וְ/עָשָׂ֥ה אֶת חַטָּאת֖/וֹ וְ/אֶת עֹלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: vi
  text: Thầy tế lễ sẽ trình các lễ vật ấy trước Yahweh[a], rồi dâng lễ chuộc tội[b] và lễ thiêu của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đem các lễ vật ấy đến gần trước Yahweh.” Động từ Hê-bơ-rơ có thể nhấn mạnh việc đưa lễ vật đến trình trước Yahweh trước khi dâng chúng.'
    reason: lexical_alternative
  - marker: b
    text: “Lễ chuộc tội” cũng có thể được hiểu là “lễ thanh tẩy” trong thuật ngữ tế lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: sẽ trình
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến gần hoặc trình ra. “Trình” phân biệt hành động đưa các lễ vật đến trước mặt Đức Chúa Trời với hành động dâng lễ được diễn tả tiếp theo bằng וְעָשָׂה.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách dịch tự nhiên và quen thuộc của כֹּהֵן trong ngữ cảnh nghi lễ.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי chỉ việc ở trong sự hiện diện của Đức Chúa Trời; יְהוָה được phiên âm là “Yahweh” để bảo tồn danh riêng trong nguyên văn.
- source_word: וְעָשָׂה
  choice: rồi dâng
  rationale: Dù nghĩa cơ bản là “làm”, עשה khi đi với tên các sinh tế mang nghĩa thực hiện nghi lễ hay dâng sinh tế. “Rồi” diễn đạt tự nhiên trình tự với hành động trình lễ vật trước đó.
- source_word: אֶת חַטָּאתוֹ
  choice: lễ vật chuộc tội của người ấy
  rationale: Trong luật tế lễ, חַטָּאת chỉ sinh tế liên quan đến tội lỗi và sự thanh tẩy. “Lễ vật chuộc tội” là cách gọi rõ nghĩa, quen thuộc; đại từ sở hữu ngôi ba số ít được dịch là “của người ấy” theo văn cảnh về người Na-xi-rê.
- source_word: וְאֶת עֹלָתוֹ
  choice: và lễ thiêu của người ấy
  rationale: עֹלָה là thuật ngữ thông thường chỉ sinh tế được thiêu toàn bộ. Đại từ sở hữu được diễn đạt rõ là “của người ấy”.
- source_word: tân ngữ ngầm của וְהִקְרִיב
  choice: các lễ vật ấy
  rationale: Tiếng Hê-bơ-rơ không nêu tân ngữ trong câu này, nhưng các vật hiến tế ở câu trước là tân ngữ theo văn cảnh. “Các lễ vật ấy” làm rõ câu tiếng Việt mà không xác định quá mức.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” bảo tồn đặc tính danh riêng, thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của חַטָּאת trong thuật ngữ tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Từ này có thể nhấn mạnh việc xử lý tội lỗi hoặc chức năng thanh tẩy của sinh tế. Bản chính dùng cách gọi truyền thống, dễ hiểu, còn chú thích giữ lại cách hiểu hợp lý kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dùng “trình … rồi dâng” để giữ sự phân biệt giữa việc đưa lễ vật đến trước mặt Yahweh và việc thực hiện nghi lễ dâng; “người ấy” tránh sự mơ hồ giới tính không cần thiết trong tiếng Việt.
