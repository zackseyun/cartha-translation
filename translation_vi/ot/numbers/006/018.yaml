  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: vi
  text: Rồi người Na-xi-rê phải cạo mái tóc biệt riêng của mình tại cửa Lều Hội Kiến, lấy tóc ấy và đặt trên ngọn lửa ở dưới sinh tế bình an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sinh tế thông công” hoặc “sinh tế cầu an”.
    reason: Bảo lưu những cách diễn đạt khả hữu của thuật ngữ tế tự שְׁלָמִים, vốn có thể nhấn mạnh bình an, sự an lành hoặc sự thông công.
lexical_decisions:
- source_word: הַנָּזִיר
  choice: người Na-xi-rê
  rationale: Dùng cách phiên âm quen thuộc cho danh xưng kỹ thuật chỉ người thực hiện lời khấn đặc thù được quy định trong chương này, thay vì giản lược thành một người tận hiến nói chung.
- source_word: וְגִלַּח
  choice: phải cạo
  rationale: Diễn đạt rõ tính chất chỉ thị của thủ tục nghi lễ trong mạch văn, đồng thời giữ nghĩa trực tiếp của động từ là cạo tóc.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: tại cửa Lều Hội Kiến
  rationale: Cách dịch gọn, tự nhiên và quen thuộc cho địa điểm nghi lễ; פֶּתַח chỉ cửa hoặc lối vào.
- source_word: רֹאשׁ נִזְרוֹ / שְׂעַר רֹאשׁ נִזְרוֹ
  choice: mái tóc biệt riêng của mình / tóc ấy
  rationale: Trong ngữ cảnh, tóc trên đầu là dấu hiệu cụ thể của tình trạng biệt riêng. Cách diễn đạt này truyền đạt tự nhiên ý nghĩa nghi lễ, tránh cụm sát chữ nhưng khó hiểu như “đầu của sự biệt riêng”, và “tóc ấy” duy trì rõ vật vừa được cạo.
- source_word: הָאֵשׁ אֲשֶׁר תַּחַת
  choice: ngọn lửa ở dưới
  rationale: Giữ quan hệ không gian trực tiếp của nguyên văn mà không suy đoán thêm về cấu tạo bàn thờ hay nơi nấu lễ vật.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sinh tế bình an
  rationale: “Sinh tế” phản ánh זֶבַח là lễ vật được giết tế, còn “bình an” giữ tên gọi truyền thống của loại lễ שְׁלָמִים và mối liên hệ rộng với sự toàn vẹn, an lành.
theological_decisions:
- issue: Cách dịch thuật ngữ tế tự שְׁלָמִים
  choice: sinh tế bình an
  alternative: sinh tế thông công; sinh tế cầu an
  rationale: “Bình an” không thu hẹp ý nghĩa vào riêng sự thông công và giữ được phạm vi nghĩa liên quan đến bình an, an lành và toàn vẹn. Chú thích bảo lưu các cách hiểu khả hữu khác mà không áp đặt một cách giải thích thần học duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Lều Hội Kiến” và “người Na-xi-rê” được dùng như các thuật ngữ Kinh Thánh kỹ thuật; câu được sắp xếp lại nhẹ để tự nhiên trong tiếng Việt nhưng vẫn giữ đầy đủ trình tự nghi lễ của nguyên văn.
