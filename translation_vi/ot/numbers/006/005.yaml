revisions:
- from: Suốt những ngày giữ lời khấn Na-xi-rê[a], không được để dao cạo lướt qua đầu người ấy. Cho đến khi mãn những ngày người ấy biệt mình ra cho Yahweh, người ấy phải nên thánh; người ấy phải để tóc trên đầu mọc dài.
  to: Trong suốt các ngày của lời khấn Na-xi-rê[a], dao cạo không được lướt qua đầu người ấy. Cho đến khi đủ số ngày mà người ấy biệt riêng mình cho Yahweh, người ấy phải thánh; người ấy phải để tóc trên đầu mọc dài.
  rationale: Chỉnh câu mở đầu để bám sát “mọi ngày của lời khấn,” thay cách diễn đạt thời hạn bằng “đủ số ngày,” và thay “phải nên thánh” bằng “phải thánh” để bảo toàn tính chất trạng thái của קָדֹשׁ mà vẫn giữ thuật ngữ thần học then chốt. Các phần còn lại trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
