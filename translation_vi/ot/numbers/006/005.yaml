id: NUM.6.5
reference: Numbers 6:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: vi
  text: Trong suốt các ngày của lời khấn Na-xi-rê[a], dao cạo không được lướt qua đầu người ấy. Cho đến khi đủ số ngày mà người ấy biệt riêng mình cho Yahweh, người ấy phải thánh; người ấy phải để tóc trên đầu mọc dài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời khấn biệt riêng.” Từ Hê-bơ-rơ đứng sau tên gọi “Na-xi-rê” mang ý niệm biệt riêng hoặc hiến riêng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: lời khấn Na-xi-rê
  rationale: Giữ thuật ngữ chỉ địa vị Na-xi-rê trong văn mạch luật pháp, đồng thời dùng “lời khấn” cho נֶדֶר. Chú thích nêu rõ ý niệm biệt riêng nằm trong gốc từ.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: không được để dao cạo lướt qua đầu người ấy
  rationale: Bảo tồn hình ảnh thành ngữ Hê-bơ-rơ về dao cạo đi qua đầu, nhưng diễn đạt tự nhiên và làm rõ đây là điều bị cấm.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: cho đến khi mãn những ngày
  rationale: “Mãn” diễn đạt sự hoàn tất của thời hạn đã định, phù hợp sắc thái pháp lý của מְלֹאת.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: người ấy biệt mình ra cho Yahweh
  rationale: “Biệt mình ra” giữ ý nghĩa cốt lõi của נזר là phân riêng hoặc hiến riêng, và “cho” diễn đạt hướng quy thuộc của לַיהוָה.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Dùng trực tiếp danh giao ước Yahweh và thể hiện giới từ ל như sự biệt riêng dành cho Ngài.
- source_word: קָדֹשׁ יִהְיֶה
  choice: người ấy phải nên thánh
  rationale: Giữ thuật ngữ thần học “thánh” của קָדֹשׁ; cấu trúc “phải nên thánh” truyền đạt lực quy định của văn bản luật pháp.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: người ấy phải để tóc trên đầu mọc dài
  rationale: Diễn đạt tự nhiên ý cho tóc mọc dài, buông tự do và không cắt tỉa; tránh cách dịch quá nặng nề nhưng vẫn thể hiện פֶּרַע.
theological_decisions:
- issue: Cách chuyển dịch danh giao ước יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Văn bản dùng trực tiếp Tứ Danh; “Yahweh” bảo tồn danh giao ước thay vì thay bằng một tước hiệu.
- issue: Giữ thuật ngữ “thánh” hay giải nghĩa là “được biệt riêng”
  choice: người ấy phải nên thánh
  alternative: người ấy phải được biệt riêng / được thánh hiến
  rationale: קָדֹשׁ trực tiếp có nghĩa là “thánh”; giữ từ này bảo tồn trọng lượng thần học, còn ý biệt riêng đã xuất hiện ngay trong mệnh đề trước.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “người ấy” để phản ánh đại từ giống đực số ít trong nguyên văn mà không lặp “ông”; giữ hình ảnh dao cạo và thuật ngữ Na-xi-rê. Chỉ đặt một chú thích thực sự cần thiết; không gắn chú thích về dao cạo vào “nên thánh,” vì như vậy sẽ sai vị trí và sai nội dung.
