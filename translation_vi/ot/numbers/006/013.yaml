  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: vi
  text: 'Và đây là luật về người Na-xi-rê: vào ngày kết thúc thời kỳ biệt riêng của mình[b], người ấy phải được đưa đến cửa Lều Hội Kiến.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn theo thể chủ động của tiếng Híp-ri: “người ấy sẽ đưa người Na-xi-rê đến cửa Lều Hội Kiến.” Tuy nhiên, câu này không nói rõ ai là người đưa.'
    reason: lexical_alternative
  - marker: b
    text: “Thời kỳ biệt riêng” cũng có thể dịch là “thời gian giữ lời khấn Na-xi-rê” hoặc “thời kỳ thánh hiến.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת תּוֹרַת הַנָּזִיר
  choice: Đây là luật về người Na-xi-rê
  rationale: Cụm từ mở đầu một quy định pháp lễ. “Luật về” chuyển tải tự nhiên תּוֹרַת, còn “Na-xi-rê” giữ nguyên thuật ngữ riêng của thể chế trong Dân Số Ký 6.
- source_word: בְּיוֹם מְלֹאת יְמֵי נִזְרוֹ
  choice: vào ngày mãn thời kỳ biệt riêng của mình
  rationale: “Vào ngày” giữ sắc thái thời gian trang trọng; “mãn thời kỳ” diễn đạt ý hoàn tất của מְלֹאת יְמֵי; “biệt riêng” phản ánh ý cốt lõi của נֵזֶר là được tách riêng cho một mục đích thánh.
- source_word: יָבִיא אֹתוֹ
  choice: người ấy phải được đưa đến
  rationale: Động từ Híp-ri ở thể chủ động, nghĩa đen là “người ấy sẽ đưa người đó”, nhưng chủ thể không được nêu rõ. Cách bị động tiếng Việt giữ trọng tâm nơi người Na-xi-rê được trình diện mà không tự ý xác định người đưa.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: đến lối vào Lều Hội Kiến
  rationale: “Lối vào” là cách nói hiện đại, tự nhiên cho פֶּתַח. “Lều Hội Kiến” là danh xưng trang trọng, quen dùng cho אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Ý nghĩa của thuật ngữ נָזִיר / נֵזֶר
  choice: Dùng “người Na-xi-rê” và “thời kỳ biệt riêng”
  alternative: Dùng “người được biệt riêng” và “thời kỳ thánh hiến”, hoặc nói rõ “thời kỳ giữ lời khấn Na-xi-rê”
  rationale: Giữ “Na-xi-rê” bảo tồn tên gọi của một thể chế cụ thể trong Y-sơ-ra-ên; “biệt riêng” giữ được ý nghĩa từ nguyên và sự căng thẳng giữa lời khấn, sự phân cách và sự thánh hiến mà không thu hẹp vào một cách giải thích.
- issue: Thể của יָבִיא אֹתוֹ
  choice: Dùng câu bị động “người ấy phải được đưa đến”
  alternative: 'Dịch sát thể chủ động: “người ấy phải đưa người đó đến”'
  rationale: Nguyên văn có động từ chủ động nhưng không chỉ rõ chủ thể; câu bị động tiếng Việt bảo tồn sự không xác định ấy và phù hợp với văn phong thủ tục nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc quy định pháp lễ nhưng tránh lối diễn đạt quá cổ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
