  text: יָאֵ֨ר יְהוָ֧ה פָּנָ֛י/ו אֵלֶ֖י/ךָ וִֽ/יחֻנֶּֽ/ךָּ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: vi
  text: Nguyện Yahweh khiến mặt Ngài chiếu sáng trên anh và ban ơn cho anh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nguyện Yahweh khiến mặt Ngài chiếu sáng hướng về anh và tỏ ân huệ với anh.”'
    reason: Nêu cách diễn đạt khác cho אֵלֶיךָ (“hướng về anh”) và חנן (“tỏ ân huệ”), đồng thời giữ hình ảnh và sắc thái lời chúc của nguyên văn.
lexical_decisions:
- source_word: יָאֵר
  choice: Nguyện ... làm cho ... chiếu sáng
  rationale: 'Dạng Hiphil jussive của אוֹר diễn tả lời cầu chúc và sắc thái nguyên nhân: cầu xin Yahweh khiến ánh sáng từ mặt Ngài chiếu ra.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn, thay vì thay bằng một tước hiệu.
- source_word: פָּנָיו
  choice: mặt Ngài
  rationale: Dịch sát hình ảnh cụ thể trong tiếng Hê-bơ-rơ; hình ảnh này hàm ý sự hiện diện đầy thiện ý nhưng không nên bị diễn giải thành khái niệm trừu tượng trong chính văn.
- source_word: אֵלֶיךָ
  choice: trên con
  rationale: אֶל có nghĩa cơ bản là “đến, hướng về”; trong thành ngữ này, “chiếu sáng trên con” tự nhiên trong tiếng Việt và diễn đạt hướng tác động tốt lành.
- source_word: וִיחֻנֶּךָּ
  choice: và ban ân huệ cho con
  rationale: Động từ חנן chỉ việc tỏ lòng ưu ái hoặc ban ơn. “Ban ân huệ” giữ được sắc thái trang trọng của lời chúc phước mà không thu hẹp nghĩa thành lòng thương hại.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay thế bằng tước hiệu.
- issue: Hình ảnh nhân hình “mặt Ngài chiếu sáng”
  choice: Giữ hình ảnh theo nghĩa trực tiếp trong chính văn
  alternative: Nguyện sự hiện diện của Ngài soi sáng con; nguyện Ngài đoái xem con
  rationale: Nguyên văn dùng hình ảnh thi ca về khuôn mặt rạng chiếu để biểu thị sự hiện diện và ân huệ của Đức Chúa Trời. Giữ hình ảnh này bảo toàn sức gợi và không giải quyết thay người đọc ý nghĩa thần học của thành ngữ.
- issue: Đại từ ngôi thứ hai số ít giống đực
  choice: con
  alternative: ngươi; bạn
  rationale: Các hậu tố אֵלֶיךָ và וִיחֻנֶּךָּ ở số ít. “Con” phù hợp lời chúc phước của Đức Chúa Trời được phán qua thầy tế lễ, tự nhiên và trang trọng trong tiếng Việt hiện đại, dù nguyên ngữ không mã hóa quan hệ thân tộc.
translation_notes:
  register: Văn phong trang trọng, dễ hiểu và phù hợp thể loại chúc phước. Dùng “Ngài” để quy chiếu Yahweh và “con” cho đối tượng số ít. Giữ nguyên hình ảnh Hê-bơ-rơ “mặt Ngài chiếu sáng”, đồng thời tránh từ cổ như “nhan” hoặc “đoái thương”.
