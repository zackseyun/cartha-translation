  naturalness: “Nguyện Yahweh khiến mặt Ngài chiếu sáng trên anh” là văn phong chúc phước trang trọng nhưng vẫn rõ ràng trong tiếng Việt hiện đại. “Ban ơn cho anh” tự nhiên và gọn hơn “ban ân huệ cho con”.
