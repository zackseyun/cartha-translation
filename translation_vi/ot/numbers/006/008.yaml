  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: vi
  text: Trong suốt thời gian biệt riêng của mình, người ấy là thánh cho Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời khấn Na-xi-rê của mình” hoặc “sự thánh hiến của mình.” Từ Hê-bơ-rơ chỉ tình trạng được biệt riêng làm người Na-xi-rê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: Suốt những ngày
  rationale: Diễn đạt tự nhiên toàn bộ khoảng thời gian mà cụm Hê-bơ-rơ chỉ đến, đồng thời giữ sức bao quát của כֹּל.
- source_word: נִזְרוֹ
  choice: biệt riêng của mình
  rationale: Chỉ tình trạng hay thời kỳ người Na-xi-rê được biệt riêng, không thu hẹp nghĩa thành chính lời khấn và cũng tránh lặp ý với קָדֹשׁ.
- source_word: קָדֹשׁ הוּא
  choice: người ấy là thánh
  rationale: Giữ nguyên trọng lượng thần học của קָדֹשׁ và thể hiện đại từ nhấn mạnh הוּא bằng một mệnh đề tiếng Việt đầy đủ.
- source_word: לַיהוָה
  choice: cho Đức Giê-hô-va
  rationale: Giới từ לְ ở đây biểu thị sự quy thuộc hoặc hiến dâng; “cho” là cách diễn đạt gọn, tự nhiên, còn danh YHWH được phiên âm theo lối dùng tiếng Việt quen thuộc.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Hằng Hữu; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Đức Giê-hô-va” bảo tồn tính chất tên riêng và là dạng đã quen thuộc trong tiếng Việt, không thay bằng một tước hiệu.
- issue: Ý nghĩa của נִזְרוֹ trong luật về người Na-xi-rê
  choice: thời trạng biệt riêng của người ấy
  alternative: lời khấn Na-xi-rê của người ấy; sự thánh hiến của người ấy
  rationale: Ngữ cảnh nhấn mạnh toàn bộ thời gian sống trong địa vị được biệt riêng. Cách dịch không đồng nhất từ này với lời khấn, cũng không xóa nhòa sự phân biệt giữa việc biệt riêng và việc người ấy là thánh cho YHWH.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Người ấy” phù hợp với quy định chung về người Na-xi-rê; “biệt riêng” giữ thuật ngữ thần học quen thuộc mà vẫn rõ nghĩa trong ngữ cảnh.
