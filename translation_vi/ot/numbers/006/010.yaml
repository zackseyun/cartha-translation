  rationale: 'Bản sửa giữ nguyên mọi thành tố ngữ nghĩa của tiếng Hê-bơ-rơ: mốc ngày thứ tám, mệnh lệnh đem lễ vật, hai phương án chim, thầy tế lễ và lối vào Lều Hội Kiến. Chỉnh sửa chỉ nhằm làm rõ quan hệ địa điểm và dùng tiếng Việt hiện đại tự nhiên hơn, không thêm diễn giải thần học.'
  reviewer_model: gpt-5.6-terra
