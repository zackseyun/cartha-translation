base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/010.yaml
  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: vi
  text: Vào ngày thứ tám, người ấy phải đem hai con chim cu hoặc hai con bồ câu non đến cho thầy tế lễ tại lối vào Lều Hội Kiến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: Đến ngày thứ tám
  rationale: Diễn đạt tự nhiên trình tự thời gian trong tiếng Việt, đồng thời giữ rõ mốc ngày thứ tám.
- source_word: יָבִא
  choice: phải đem
  rationale: Dạng Hiphil chưa hoàn thành có sắc thái quy định trong văn mạch luật lệ; “phải đem” truyền đạt nghĩa bắt buộc rõ ràng và tự nhiên.
- source_word: שְׁתֵּי תֹרִים
  choice: hai con chim cu
  rationale: תֹרִים chỉ loài cu, một loại chim được dùng làm lễ vật; “chim cu” là cách gọi thông dụng trong tiếng Việt.
- source_word: אוֹ
  choice: hoặc
  rationale: Giữ nguyên quan hệ lựa chọn giữa hai loại lễ vật được phép.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: hai chim bồ câu non
  rationale: Thành ngữ Hê-bơ-rơ, theo nghĩa đen là “hai con của bồ câu,” chỉ bồ câu non; bản dịch truyền đạt trực tiếp ý nghĩa thành ngữ.
- source_word: אֶל הַ/כֹּהֵן
  choice: đến cho thầy tế lễ
  rationale: Diễn đạt tự nhiên việc đem lễ vật đến trao hoặc trình cho thầy tế lễ.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: tại cửa Lều Hội Kiến
  rationale: פֶּתַח là cửa/lối vào; אֹהֶל מוֹעֵד là danh xưng cố định của nơi Đức Chúa Trời gặp dân Ngài, được dịch trang trọng là “Lều Hội Kiến.”
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ sắc thái quy định của luật tế lễ. Không cần chú thích vì “chim bồ câu non” đã chuyển tải rõ thành ngữ Hê-bơ-rơ, còn “chim cu” phân biệt đủ tự nhiên với bồ câu.
