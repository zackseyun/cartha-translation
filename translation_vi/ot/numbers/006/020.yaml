  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: vi
  text: Thầy tế lễ phải dâng những vật ấy làm lễ vật đưa qua đưa lại trước mặt Yahweh. Đó là vật thánh thuộc về thầy tế lễ, cùng với ức của lễ vật đưa qua đưa lại và đùi của lễ vật dâng hiến[a]. Sau đó, người Na-xi-rê được phép uống rượu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cái đùi của lễ vật giơ lên.” Từ Hê-bơ-rơ תְּרוּמָה chỉ một phần được tách riêng và trình dâng.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “người Na-xi-rê sẽ uống rượu.” Trong ngữ cảnh, câu này cho biết người ấy lại được phép uống rượu sau khi hoàn tất lời khấn.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: phải đưa qua đưa lại ... làm lễ vật
  rationale: Trong nghi thức hiến tế, dạng Hiphil của נוּף và danh từ cùng gốc תְּנוּפָה chỉ hành động trình dâng lễ vật bằng cách đưa qua đưa lại. Cách diễn đạt này vừa giữ được hình ảnh nghi lễ vừa dễ hiểu trong tiếng Việt.
- source_word: אוֹתָם
  choice: những vật ấy
  rationale: Đại từ số nhiều chỉ về cái vai đã luộc, bánh không men và bánh mỏng trong câu trước; cách dịch này làm rõ sở chỉ mà không thêm nội dung mới.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ nghĩa trực tiếp của thành ngữ nghi lễ לִפְנֵי và chuyển tự danh riêng giao ước יְהוָה là Yahweh.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: Phần ấy là phần thánh dành cho thầy tế lễ
  rationale: Giữ số ít của הוּא bằng cách hiểu toàn bộ phần vừa được trình dâng như một phần lễ vật thánh được dành cho thầy tế lễ.
- source_word: עַל
  choice: ngoài
  rationale: Trong công thức phân chia phần lễ vật, giới từ này biểu thị phần được thêm vào những phần vốn đã thuộc về thầy tế lễ.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: cái ức của lễ vật đưa qua đưa lại
  rationale: Diễn đạt rõ phần ức của con vật gắn với nghi thức đưa qua đưa lại, đồng thời giữ thuật ngữ nhất quán.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: cái đùi của lễ vật dâng hiến
  rationale: שׁוֹק chỉ phần đùi hoặc chân trên; תְּרוּמָה chỉ phần được tách riêng và trình dâng. “Lễ vật dâng hiến” rõ hơn với độc giả hiện đại.
- source_word: וְאַחַר
  choice: Sau đó
  rationale: Biểu thị trình tự thời gian sau khi nghi thức kết thúc.
- source_word: הַנָּזִיר
  choice: người Na-xi-rê
  rationale: Dùng cách phiên âm quen thuộc cho người biệt riêng mình theo lời khấn được mô tả trong Dân Số Ký 6.
- source_word: יַיִן
  choice: rượu
  rationale: Từ tương đương trực tiếp và tự nhiên trong ngữ cảnh.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ nêu trực tiếp danh giao ước; dùng “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Sắc thái của יִשְׁתֶּה ở mệnh đề cuối
  choice: được phép uống rượu
  alternative: sẽ uống rượu
  rationale: Hình thái động từ tự nó có thể được dịch là “sẽ uống”, nhưng trong ngữ cảnh luật lệ, nghi thức vừa hoàn tất đã chấm dứt lệnh kiêng rượu; cách dịch được chọn thể hiện sự cho phép được khôi phục mà không biến việc uống thành mệnh lệnh.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu rõ và thuật ngữ nghi lễ nhất quán. “Thầy tế lễ” và “người Na-xi-rê” là các cách gọi phổ thông trong văn cảnh Kinh Thánh; cấu trúc tránh lối Hán-Việt quá nặng.
