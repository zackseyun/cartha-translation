revisions:
- from: Thầy tế lễ phải đưa qua đưa lại những vật ấy làm lễ vật trước mặt Yahweh. Phần ấy là phần thánh dành cho thầy tế lễ, ngoài cái ức của lễ vật đưa qua đưa lại và cái đùi của lễ vật dâng hiến[a]. Sau đó, người Na-xi-rê được phép uống rượu[b].
  to: Thầy tế lễ phải dâng những vật ấy làm lễ vật đưa qua đưa lại trước mặt Yahweh. Đó là vật thánh thuộc về thầy tế lễ, cùng với ức của lễ vật đưa qua đưa lại và đùi của lễ vật dâng hiến[a]. Sau đó, người Na-xi-rê được phép uống rượu[b].
  rationale: Sửa trật tự cú pháp ở câu đầu để phản ánh rõ nghi thức tế lễ của הֵנִיף ... תְּנוּפָה; thay “Phần ấy là phần thánh dành cho” bằng “Đó là vật thánh thuộc về” để diễn đạt gọn và sát quan hệ sở thuộc; thay “ngoài” bằng “cùng với” để tránh hàm ý loại trừ và biểu đạt ý phần được thêm vào. Không thay đổi ý nghĩa, tên riêng, hay chức năng chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:38:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu: hành vi tế lễ, tính thánh dành cho thầy tế lễ, các phần được thêm vào, và việc người Na-xi-rê được uống rượu sau đó. Tuy nhiên, “đưa qua đưa lại những vật ấy làm lễ vật” chưa diễn đạt tự nhiên cấu trúc Hê-bơ-rơ, trong đó thầy tế lễ làm nghi thức đưa qua đưa lại *các vật ấy như/làm một lễ vật đưa qua đưa lại*. “Ngoài” cũng có thể gợi ý loại trừ, trong khi עַל ở đây chỉ phần thầy tế lễ nhận thêm vào.'
  naturalness: “Đưa qua đưa lại những vật ấy làm lễ vật” có trật tự từ hơi gượng và dễ khiến “làm lễ vật” bổ nghĩa không rõ. “Thầy tế lễ phải dâng những vật ấy làm lễ vật đưa qua đưa lại” rõ và tự nhiên hơn. “Vật thánh thuộc về thầy tế lễ, cùng với...” giữ văn phong nghi lễ hiện đại và làm rõ quan hệ cộng thêm.
  terminology: 'Giữ nhất quán “lễ vật đưa qua đưa lại” cho תְּנוּפָה và “lễ vật dâng hiến” cho תְּרוּמָה. “Người Na-xi-rê,” “thầy tế lễ,” và “Yahweh” đều phù hợp. Chú thích được giữ đúng neo: chú thích a tại “lễ vật dâng hiến” và b tại mệnh đề về việc uống rượu.'
  issues:
  - severity: medium
    issue: Cú pháp của mệnh đề mở đầu chưa rõ quan hệ giữa hành động và lễ vật.
