revisions:
- from: Nguyện Yahweh ngước mặt hướng về con và ban bình an cho con[a].
  to: Nguyện Yahweh ngước mặt Ngài về phía con và ban bình an cho con[a].
  rationale: Chỉnh nhẹ cụm diễn đạt hình ảnh “nâng/ngước mặt Ngài về phía con” để câu tiếng Việt tự nhiên hơn, đồng thời biểu thị rõ đại từ sở hữu trong פָּנָיו. Không diễn giải thành “đoái thương” hoặc “ưu ái”, nên vẫn giữ được tính hình tượng và độ mở của thành ngữ Hê-bơ-rơ.
