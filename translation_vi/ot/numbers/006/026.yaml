source:
  edition: WLC
  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: vi
  text: Nguyện Yahweh ngước mặt Ngài về phía con và ban bình an cho con[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ shalom, dịch là “bình an”, cũng có thể bao hàm sự toàn vẹn, yên ổn và phúc lợi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: ngước
  rationale: Động từ נָשָׂא có nghĩa cơ bản là “nâng, nhấc lên”. Khi đi với “mặt” trong lời chúc phước này, từ ấy diễn tả việc hướng sự chú ý và thiện ý đến một người. “Ngước” giữ được hình ảnh cụ thể của nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời dưới dạng chuyển tự, thay vì thay bằng một tước hiệu.
- source_word: פָּנָיו
  choice: mặt
  rationale: פָּנִים có nghĩa trực tiếp là “mặt”. Cách dịch này giữ hình ảnh nhân hình và sắc thái văn chương của lời chúc phước, không diễn giải thành khái niệm trừu tượng như “ân huệ”.
- source_word: אֵלֶיךָ
  choice: hướng về con
  rationale: Giới từ אֶל chỉ hướng “đến, về phía”. Trong tiếng Việt, “hướng về con” diễn đạt tự nhiên hướng của ánh nhìn và sự quan tâm.
- source_word: וְיָשֵׂם
  choice: và ban
  rationale: שׂוּם có nghĩa cơ bản là “đặt, để”. Trong kết hợp “đặt bình an cho con”, tiếng Việt tự nhiên dùng “ban bình an”, diễn đạt rõ kết quả của hành động.
- source_word: לְךָ
  choice: cho con
  rationale: Giới từ לְ đánh dấu người tiếp nhận hoặc hưởng lợi; “cho con” thể hiện rõ quan hệ này.
- source_word: שָׁלוֹם
  choice: bình an
  rationale: שָׁלוֹם bao gồm sự yên ổn, toàn vẹn và phúc lợi. “Bình an” là cách dịch chuẩn, phù hợp với công thức chúc phước; nghĩa rộng hơn được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước YHWH. Chuyển tự “Yahweh” bảo tồn tính chất danh riêng, không thay bằng một tước hiệu.
- issue: Giữ hình ảnh “ngước mặt”
  choice: ngước mặt hướng về con
  alternative: đoái thương con; tỏ lòng ưu ái với con
  rationale: Nguyên văn dùng hình ảnh cụ thể về khuôn mặt để diễn tả sự lưu tâm và thiện ý của Đức Chúa Trời. Bản dịch giữ hình ảnh ấy thay vì âm thầm giải nghĩa thành một ý niệm trừu tượng.
- issue: Đại từ số ít giống đực אֵלֶיךָ / לְךָ
  choice: con
  alternative: bạn; ngươi; anh
  rationale: Nguyên văn dùng ngôi thứ hai số ít trong công thức chúc phước dành cho dân Israel. “Con” phù hợp lời chúc phước từ Đức Chúa Trời đến người nhận, tự nhiên và trang trọng trong tiếng Việt, đồng thời vẫn giữ số ít.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “ngước mặt hướng về” hơi giàu hình ảnh hơn lời nói thường ngày nhưng được giữ có chủ ý để phản ánh thành ngữ Hê-bơ-rơ. Đại từ “con” tránh sắc thái xa cách hoặc cổ của “ngươi”.
