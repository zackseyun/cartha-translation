  text: וְ/סַ֣ל מַצּ֗וֹת סֹ֤לֶת חַלֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וּ/מִנְחָתָ֖/ם וְ/נִסְכֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/015.yaml
  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: vi
  text: cùng một giỏ bánh không men, gồm những bánh nhỏ bằng bột mịn trộn dầu[a] và những bánh mỏng không men được xức dầu[b], cùng với lễ vật ngũ cốc và lễ quán của chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch từ מַצּוֹת ở đầu câu là “các bánh không men”; từ Hê-bơ-rơ này có nghĩa rộng, rồi câu văn mới phân loại thành bánh nhỏ và bánh mỏng.
    reason: lexical_alternative
  - marker: b
    text: Hay “được phết dầu”; động từ Hê-bơ-rơ thường có nghĩa là “xức”, nhưng ở đây chỉ việc thoa dầu lên bánh mỏng.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: một giỏ
  rationale: Danh từ chỉ vật đựng các loại bánh không men; “giỏ” là cách diễn đạt tự nhiên và chính xác.
- source_word: מַצּוֹת
  choice: bánh không men
  rationale: Từ này chỉ chung các sản phẩm bánh không men; phần sau nêu cụ thể bánh nhỏ và bánh mỏng.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Thuật ngữ tế lễ thông dụng, chỉ loại bột được xay kỹ.
- source_word: חַלֹּת
  choice: những bánh nhỏ
  rationale: Trong ngữ cảnh lễ vật, từ này chỉ những chiếc bánh được tạo hình; “bánh nhỏ” tự nhiên hơn “ổ bánh” và phân biệt với bánh mỏng ở vế sau.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: trộn dầu
  rationale: Phân từ diễn tả dầu được trộn vào bánh hoặc nguyên liệu làm bánh; cách dịch ngắn gọn, rõ ràng.
- source_word: רְקִיקֵי מַצּוֹת
  choice: những bánh mỏng không men
  rationale: רְקִיקִים là những miếng bánh dẹt, mỏng dùng làm lễ vật; cách dịch này nêu rõ đặc điểm hình dạng.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: được xức dầu
  rationale: Giữ liên hệ từ vựng với động từ משׁח, đồng thời phù hợp với việc thoa dầu lên bánh trong ngữ cảnh chế biến lễ vật.
- source_word: מִנְחָתָם
  choice: lễ vật ngũ cốc ... kèm theo chúng
  rationale: Trong luật tế lễ, מִנְחָה chỉ lễ vật làm từ ngũ cốc. Hậu tố số nhiều liên hệ với các sinh tế thuộc ngữ cảnh rộng hơn; thêm “kèm theo” giúp tiếng Việt rõ nghĩa mà không xác định lại tiền ngữ một cách quá mức.
- source_word: נִסְכֵּיהֶם
  choice: các lễ quán kèm theo chúng
  rationale: Danh từ chỉ các lễ vật bằng chất lỏng được rót ra. “Lễ quán” là thuật ngữ tiếng Việt trang trọng và chính xác; cụm “kèm theo chúng” thể hiện hậu tố số nhiều.
theological_decisions:
- issue: Ý nghĩa của משׁח khi nói về bánh
  choice: xức dầu
  alternative: phết dầu
  rationale: “Xức” bảo toàn nghĩa thông thường và liên hệ từ vựng của động từ mà không hàm ý rằng bánh nhận một địa vị thần học đặc biệt; chú thích nêu cách hiểu thực tiễn trong chế biến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bánh nhỏ” và “bánh mỏng” để thể hiện sự phân biệt giữa חַלּוֹת và רְקִיקִים. Giữ thuật ngữ tế lễ “lễ vật ngũ cốc” và “lễ quán”; cấu trúc “kèm theo chúng” bảo toàn hậu tố số nhiều vốn có tiền ngữ trong ngữ cảnh rộng hơn.
