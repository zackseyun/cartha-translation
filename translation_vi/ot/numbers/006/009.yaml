revisions:
- from: Nếu có người thình lình chết bên cạnh người ấy[a], khiến đầu đã được biệt riêng của người ấy bị ô uế[b], thì người ấy phải cạo đầu vào ngày mình được thanh tẩy; vào ngày thứ bảy, người ấy phải cạo đầu.
