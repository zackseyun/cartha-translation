  source_fidelity: 'Bản nháp truyền đạt đúng trường hợp người Na-xi-rê bị ô uế khi có người chết đột ngột ở ngay bên cạnh, hậu quả ô uế đối với đầu biệt riêng, và yêu cầu cạo đầu vào ngày thứ bảy. Tuy nhiên, các chú thích hiện không được neo sát cụm từ mà chúng giải thích: chú thích về thành ngữ chỉ cái chết đột ngột đặt sau “bên cạnh người ấy”, còn chú thích về “đầu của sự biệt riêng” đặt sau “bị ô uế”.'
