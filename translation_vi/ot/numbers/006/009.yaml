base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: vi
  text: Nếu có người chết đột ngột[a] bên cạnh người ấy và làm ô uế đầu đã được biệt riêng của người ấy[b], thì người ấy phải cạo đầu vào ngày thanh tẩy của người ấy; vào ngày thứ bảy, người ấy phải cạo đầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng cách nói nhấn mạnh, theo sát chữ là: “nếu một người chết chết bên cạnh người ấy, đột ngột, bất ngờ”, diễn tả một cái chết xảy ra bất thần ngay trong sự hiện diện của người ấy.'
    reason: lexical_alternative
  - marker: b
    text: Theo sát chữ là “đầu của sự biệt riêng của người ấy”, chỉ mái đầu gắn với tình trạng biệt riêng của người Na-xi-rê.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện trong luật về người Na-xi-rê; tiếng Việt không cần dịch riêng liên từ ו để câu tự nhiên.
- source_word: יָמוּת מֵת
  choice: có người ... chết
  rationale: Cấu trúc đồng căn theo nghĩa đen là “một người chết chết”; đây là thành ngữ chỉ việc một người qua đời, nên được diễn đạt tự nhiên trong tiếng Việt.
- source_word: עָלָיו
  choice: bên cạnh người ấy
  rationale: Trong bối cảnh ô uế do xác chết, giới từ chỉ sự ở sát bên hoặc trong phạm vi hiện diện trực tiếp, không nhất thiết hàm ý xác đè lên người Na-xi-rê.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: thình lình
  rationale: Cặp từ gần nghĩa nhấn mạnh cái chết xảy ra đột ngột, không ngờ; “thình lình” truyền đạt gọn và rõ sắc thái ấy.
- source_word: וְטִמֵּא
  choice: khiến ... bị ô uế
  rationale: Dạng động từ mang tính chuyển tác, nhưng chủ thể trong chuỗi tiếng Hê-bơ-rơ có thể gây khó hiểu khi chuyển thẳng. Cấu trúc “khiến ... bị ô uế” giữ quan hệ gây ô uế mà không áp đặt quá mức tác nhân là người chết hay chính biến cố.
- source_word: רֹאשׁ נִזְרוֹ
  choice: đầu đã được biệt riêng của người ấy
  rationale: נֵזֶר ở đây nói đến tình trạng biệt riêng, thánh hiến của người Na-xi-rê, được biểu hiện nơi đầu và tóc không cắt. Cách dịch này giữ hình ảnh “đầu” và ý nghĩa nghi lễ, không đồng nhất từ này đơn thuần với lời khấn.
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: thì người ấy phải cạo đầu
  rationale: “Thì” thể hiện hệ quả theo thủ tục của trường hợp điều kiện; “phải” phù hợp sắc thái luật định.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: vào ngày mình được thanh tẩy
  rationale: טָהֳרָה trong văn cảnh chỉ sự thanh tẩy khỏi tình trạng ô uế nghi lễ. Cách nói này dễ hiểu và vẫn giữ ý nghĩa nghi lễ.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: vào ngày thứ bảy
  rationale: Chuyển trực tiếp mốc thời gian được quy định trong câu.
- source_word: יְגַלְּחֶנּוּ
  choice: người ấy phải cạo đầu
  rationale: Đại từ hậu tố chỉ trở lại cái đầu. Tiếng Việt lặp lại “cạo đầu” tự nhiên và rõ hơn “cạo nó”, đồng thời giữ sự lặp nhấn mạnh của điều luật.
theological_decisions:
- issue: Bản chất của sự ô uế trong thời gian biệt riêng của người Na-xi-rê
  choice: Dùng ngôn ngữ nghi lễ “đầu đã được biệt riêng” và “bị ô uế”.
  alternative: “đầu của lời khấn” hoặc “mái đầu thánh hiến”
  rationale: Câu này nói đến sự ô uế làm gián đoạn tình trạng biệt riêng của người Na-xi-rê. Bản dịch giữ ý nghĩa nghi lễ của נזר mà không đưa vào những phạm trù thần học về sau hoặc thu hẹp từ này chỉ còn là lời khấn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dùng “người ấy” để theo dõi chủ thể rõ ràng. Giữ sự lặp lại mệnh lệnh cạo đầu ở cuối câu như trong nguyên văn. Các dấu chú thích được đặt đúng ngay sau cụm từ cần giải thích.
