  terminology: A-rôn và Y-sơ-ra-ên là các dạng phiên âm Kinh Thánh Việt ngữ quen thuộc. “Con dân Y-sơ-ra-ên” diễn đạt đúng danh xưng tập thể; chú thích sát chữ bảo đảm người đọc vẫn thấy hình thức “các con trai của Y-sơ-ra-ên” của tiếng Hê-bơ-rơ. “Chúc phước” phù hợp ngữ cảnh tế lễ.
