source:
  edition: WLC
  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר כֹּ֥ה תְבָרֲכ֖וּ אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אָמ֖וֹר לָ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: vi
  text: 'Hãy nói với A-rôn và các con trai ông rằng: “Các ngươi phải chúc phước cho con dân Y-sơ-ra-ên[a] như sau. Hãy nói với họ:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; đây là một cách gọi toàn thể dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Hãy nói với
  rationale: Mệnh lệnh Piel số ít giống đực, trực tiếp truyền cho Môi-se nói với người nhận; cách dịch tự nhiên và giữ rõ lực mệnh lệnh.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: וְאֶל בָּנָיו
  choice: và các con trai ông
  rationale: Trong ngữ cảnh chức tế lễ, בָּנָיו chỉ các con trai của A-rôn, không phải con cái nói chung.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dùng từ dẫn lời tự nhiên trong tiếng Việt thay vì sao chép cứng cấu trúc phân từ của tiếng Hê-bơ-rơ.
- source_word: כֹּה
  choice: như sau
  rationale: Giới thiệu công thức chúc phước được quy định; tự nhiên hơn “như thế này” trong ngữ cảnh dẫn lời.
- source_word: תְבָרֲכוּ
  choice: các ngươi phải chúc phước
  rationale: Thể chưa hoàn thành Piel ngôi hai số nhiều mang lực chỉ thị trong ngữ cảnh; “phải” diễn đạt mệnh lệnh mà không biến nó thành lời dự báo.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm này nguyên văn là “các con trai của Y-sơ-ra-ên” nhưng cũng là danh xưng dân tộc theo giao ước; “con dân Y-sơ-ra-ên” vừa tự nhiên vừa giữ sắc thái thuộc về gia tộc-dân tộc.
- source_word: אָמֹר לָהֶם
  choice: Hãy nói với họ
  rationale: Giữ lực mệnh lệnh của אָמוֹר và báo trước chính lời chúc phước ở câu tiếp theo.
theological_decisions:
- issue: Danh xưng giao ước בְּנֵי יִשְׂרָאֵל có hình thức giống đực
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Ở đây cụm từ là danh xưng quy ước cho toàn dân chứ không chỉ nam giới. “Con dân” tránh thu hẹp đối tượng, đồng thời còn phản ánh sắc thái huyết tộc và giao ước của nguyên ngữ; chú thích nêu hình thức sát chữ.
- issue: Lực quy định của תְבָרֲכוּ
  choice: các ngươi phải chúc phước ... như sau
  alternative: các ngươi sẽ chúc phước như thế này
  rationale: Ngữ cảnh là Đức Chúa Trời quy định cách các thầy tế lễ ban phước. Bản dịch giữ lực chỉ thị mà không thêm nội dung thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “các ngươi” vì lời truyền trực tiếp nhắm đến A-rôn cùng các con trai ông, giúp biểu thị rõ số nhiều; dùng dấu hai chấm để dẫn vào công thức chúc phước tiếp theo.
