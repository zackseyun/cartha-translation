  source_fidelity: 'Bản dịch chuyển tải đầy đủ cấu trúc mệnh lệnh: truyền cho A-rôn và các con trai ông, quy định cách họ phải chúc phước cho בני ישראל, rồi dẫn vào lời chúc ở câu kế tiếp. “Các ngươi phải chúc phước” phản ánh thích hợp sắc thái chỉ thị của động từ Piel chưa hoàn thành số nhiều תְבָרֲכוּ.'
