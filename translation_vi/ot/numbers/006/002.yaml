revisions:
- from: '“Hãy nói với con cái Ít-ra-ên và bảo họ: Khi một người nam hay người nữ lập một lời khấn đặc biệt—lời khấn Na-xia—để biệt mình ra cho Đức Giê-hô-va[a],”'
  to: '“Hãy nói với con cái Ít-ra-ên và bảo họ: Khi một người nam hay người nữ lập một lời khấn đặc biệt, tức là lời khấn Na-xi-rê[a], để biệt riêng mình cho Đức Giê-hô-va,”'
  rationale: Sửa dạng phiên âm của thuật ngữ kỹ thuật נָזִיר thành “Na-xi-rê”, chuyển neo chú thích về đúng thuật ngữ được giải thích, và viết lại chú thích cho chính xác, không lặp ý. Các yếu tố ngữ nghĩa còn lại của nguyên văn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
