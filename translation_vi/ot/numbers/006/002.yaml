id: NUM.6.2
reference: Numbers 6:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: vi
  text: '“Hãy nói với con cái Ít-ra-ên và bảo họ: Khi một người nam hay người nữ lập một lời khấn đặc biệt, tức là lời khấn Na-xi-rê[a], để biệt riêng mình cho Đức Giê-hô-va,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Na-xi-rê” chỉ người được biệt riêng cho Đức Giê-hô-va theo một lời khấn.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Ít-ra-ên
  rationale: Giữ hình ảnh gia tộc của thành ngữ Hê-bơ-rơ, đồng thời dùng cách diễn đạt quen thuộc và trang trọng trong tiếng Việt.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: một người nam hay người nữ
  rationale: Giữ nguyên việc bản Hê-bơ-rơ nêu rõ cả hai giới trong quy định pháp lý.
- source_word: כִּי
  choice: khi
  rationale: Trong công thức nêu trường hợp luật định, “khi” tự nhiên và vẫn giữ sắc thái điều kiện; “nếu” cũng có thể hiểu được.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: lập một lời khấn đặc biệt
  rationale: יַפְלִא ở Hiphil mang ý làm điều khác thường hay đặc biệt; kết hợp với cụm đồng căn “khấn một lời khấn”, cách dịch này truyền đạt tự nhiên mà không lặp vụng về.
- source_word: נֶדֶר נָזִיר
  choice: lời khấn Na-xia
  rationale: Dùng thuật ngữ phiên âm cho chế định đặc thù của Dân Số 6, đồng thời giữ rõ đây là một loại lời khấn.
- source_word: לְהַזִּיר
  choice: biệt mình ra
  rationale: Giữ nét nghĩa cốt lõi là tự tách riêng để được dành cho Đức Giê-hô-va, phù hợp với những quy định tiếp theo.
- source_word: לַיהוָה
  choice: cho Đức Giê-hô-va
  rationale: Dịch danh riêng giao ước יהוה bằng dạng Việt hóa quen thuộc “Đức Giê-hô-va”, thay vì thay bằng tước hiệu chung.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự danh. Bản dịch giữ đây là danh riêng; dạng “Đức Giê-hô-va” tự nhiên và quen thuộc trong tiếng Việt, không biến danh này thành một tước hiệu.
- issue: Ý nghĩa của sự biệt riêng trong lời khấn Na-xia
  choice: biệt mình ra cho Đức Giê-hô-va
  alternative: dâng mình cho Đức Giê-hô-va
  rationale: “Biệt mình ra” bảo tồn mối liên hệ từ vựng giữa נָזִיר và לְהַזִּיר, không thu hẹp ý nghĩa chỉ còn sự dâng hiến nói chung.
- issue: Phạm vi giới tính của luật
  choice: nêu rõ “một người nam hay người nữ” nhưng dùng “mình” trung tính ở mệnh đề sau
  alternative: bất cứ ai; người ấy
  rationale: Cách này giữ sự nêu đích danh cả nam lẫn nữ trong nguyên văn, đồng thời tránh áp đặt đại từ giống đực lên mệnh đề áp dụng cho cả hai.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. “Lập lời khấn” tự nhiên trong tiếng Việt; dấu gạch ngang làm rõ “lời khấn Na-xia” giải thích loại lời khấn vừa nêu. Dùng “hay” để diễn đạt cặp lựa chọn trong quy định, và “mình” để quy chiếu tự nhiên đến cả người nam lẫn người nữ.
