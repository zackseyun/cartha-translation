base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/024.yaml
  text: May Yahweh bless you and keep you[a].
translation:
  language: vi
  text: Nguyện Yahweh ban phước cho con và gìn giữ con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Nêu rõ danh riêng trong nguyên văn và cách dịch truyền thống khác.
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Nguyện ... ban phước cho con
  rationale: Động từ Piel dạng cầu khiến, ngôi ba số ít giống đực, kèm hậu tố ngôi hai số ít giống đực. “Nguyện ... ban phước cho con” diễn đạt tự nhiên sắc thái chúc phước, thay vì hiểu như một lời dự báo hay mệnh lệnh trực tiếp.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng YHWH theo cách gọi đã quen thuộc và trang trọng trong tiếng Việt, không thay bằng tước hiệu “Chúa”.
- source_word: וְיִשְׁמְרֶךָ
  choice: và gìn giữ con
  rationale: Động từ Qal dạng cầu khiến, ngôi ba số ít giống đực, kèm hậu tố ngôi hai số ít giống đực. “Gìn giữ” vừa cô đọng vừa thể hiện ý bảo vệ, chăm nom và bảo toàn trong lời chúc phước.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước YHWH. Bản dịch giữ đây là danh riêng thay vì thay thế bằng tước hiệu; “Đức Giê-hô-va” là hình thức tự nhiên, trang trọng và quen thuộc với độc giả Việt.
- issue: Sắc thái của hai động từ dạng cầu khiến
  choice: Nguyện ... ban phước ... và gìn giữ
  alternative: sẽ ban phước ... và gìn giữ; hãy ban phước ... và gìn giữ
  rationale: Trong ngữ cảnh phước lành của thầy tế lễ, hai dạng cầu khiến diễn tả lời khẩn nguyện/chúc phước hướng về Đức Chúa Trời, không phải lời tiên báo đơn thuần hay mệnh lệnh dành cho người được chúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng, phù hợp nhịp điệu của lời chúc phước. Đại từ “con” phản ánh đối tượng ngôi hai số ít trong nguyên văn và phù hợp lời phước lành được công bố cho từng người trong dân.
