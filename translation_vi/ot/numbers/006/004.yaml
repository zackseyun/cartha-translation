revisions:
- from: Suốt thời gian biệt riêng làm người Na-xia[a], người ấy không được ăn bất cứ thứ gì làm ra từ cây nho, từ hạt cho đến vỏ.
  to: Suốt thời gian giữ lời khấn Na-xia[a], người ấy không được ăn bất cứ sản phẩm nào từ cây nho, từ hạt cho đến vỏ.
  rationale: Sửa cách diễn đạt về thời hạn của lời khấn cho tự nhiên và sát ngữ cảnh hơn; thay «thứ gì làm ra từ» bằng «sản phẩm nào từ» để diễn đạt mạch lạc phạm vi sản vật của cây nho. Chú thích được rút gọn nhằm loại bỏ chi tiết không có trong câu, đồng thời vẫn giải thích thuật ngữ Na-xia và giữ đúng vị trí neo chú thích.
  reviewer_model: gpt-5.6-terra
