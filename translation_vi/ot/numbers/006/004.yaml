source:
  edition: WLC
  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: vi
  text: Suốt thời gian giữ lời khấn Na-xia[a], người ấy không được ăn bất cứ sản phẩm nào từ cây nho, từ hạt cho đến vỏ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Na-xia” phiên âm từ tiếng Hê-bơ-rơ, chỉ người giữ lời khấn biệt riêng.
    reason: Giải thích thuật ngữ văn hóa–tôn giáo không có từ tương đương đầy đủ trong tiếng Việt, không thêm chi tiết ngoài câu.
lexical_decisions:
- source_word: נִזְרוֹ
  choice: thời gian biệt riêng làm người Na-xia
  rationale: Trong luật lệ ở Dân Số 6, từ này chỉ tình trạng biệt riêng được xác lập bởi lời khấn Na-xia. Cách dịch này giữ ý niệm biệt riêng của tiếng Hê-bơ-rơ và nêu rõ thiết chế đang được nói đến.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: bất cứ thứ gì làm ra
  rationale: Cụm từ chỉ toàn bộ các sản phẩm thuộc phạm vi bị cấm; động từ phủ định ở cuối câu tạo thành lệnh cấm.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: từ cây nho
  rationale: Nghĩa đen là “từ cây nho của rượu”, một cách nói chỉ cây nho; “cây nho” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: từ hạt cho đến vỏ
  rationale: Đây là lối nói bao quát hai đầu phạm vi, chỉ mọi phần của quả nho. “Hạt” và “vỏ” phản ánh cách hiểu thông dụng của hai danh từ Hê-bơ-rơ.
- source_word: לֹא יֹאכֵל
  choice: không được ăn
  rationale: Thể chưa hoàn thành kèm phủ định trong văn luật pháp diễn đạt lệnh cấm; “không được ăn” tự nhiên và có đủ sức ràng buộc trong tiếng Việt hiện đại.
- source_word: כֹּל יְמֵי
  choice: Suốt thời gian
  rationale: Cụm từ nhấn mạnh toàn bộ khoảng thời gian biệt riêng; cách dịch này tự nhiên hơn lối dịch sát chữ “tất cả các ngày”.
theological_decisions:
- issue: Ý nghĩa của נִזְרוֹ trong bối cảnh lời khấn Na-xia
  choice: biệt riêng làm người Na-xia
  alternative: sự thánh hiến của mình / lời khấn Na-xia của mình
  rationale: Bản dịch vừa giữ sắc thái “biệt riêng” của từ gốc vừa xác định đúng thiết chế pháp lý trong Dân Số 6, nhưng không đồng nhất hoàn toàn sự biệt riêng với chính lời khấn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “người ấy” thay cho đại từ mang giới tính để diễn đạt tự nhiên trong tiếng Việt; ngữ cảnh Dân Số 6 áp dụng quy định cho cả nam lẫn nữ. Dấu chú thích [a] xuất hiện ngay sau thuật ngữ cần giải thích.
