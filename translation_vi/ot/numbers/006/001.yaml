base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ wayyiqtol của דבר tiếp nối mạch tường thuật; khi chủ ngữ là Đức Chúa Trời và câu mở đầu một lời truyền dạy trang trọng, “phán” là cách diễn đạt tự nhiên, trang nghiêm trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc דבר אל, “phán với” diễn đạt tự nhiên đối tượng tiếp nhận lời nói trong tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức nguyên mẫu này giới thiệu nội dung lời phán; “rằng” truyền đạt chức năng ấy tự nhiên hơn lối dịch sát chữ “nói rằng” trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo toàn tính chất danh riêng và không thay nó bằng một tước hiệu; đây cũng là cách phiên âm được giới nghiên cứu hiện nay chấp nhận rộng rãi.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và gọn. Dùng “phán” cho lời nói chính thức của Đức Chúa Trời; dấu hai chấm báo trước nội dung lời phán ở câu kế tiếp.
