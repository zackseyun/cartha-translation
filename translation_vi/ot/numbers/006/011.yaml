    rationale: וְקִדַּשׁ là động từ số ít tiếp nối các hành động của הַכֹּהֵן; câu có nghĩa là thầy tế lễ sẽ thánh hiến đầu của người ấy trong ngày đó. Ngữ cảnh tái lập sự biệt riêng không cho phép tự ý đổi chủ thể ngữ pháp.
  - severity: low
