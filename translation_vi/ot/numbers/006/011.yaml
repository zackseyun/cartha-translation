  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: vi
  text: Thầy tế lễ sẽ dâng một con làm lễ vật chuộc tội[a] và một con làm lễ thiêu, rồi làm lễ chuộc tội cho người ấy vì người ấy đã phạm tội liên quan đến người chết[b], và thầy tế lễ sẽ thánh hiến đầu người ấy ngay trong ngày đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật chuộc tội hoặc lễ vật thanh tẩy, đặc biệt trong bối cảnh ô uế nghi lễ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “trên/đối với הַנֶּפֶשׁ”. Trong ngữ cảnh này, từ ấy chỉ người đã chết, tức thi thể đã khiến người Na-xi-rê bị ô uế.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: Thầy tế lễ sẽ dâng
  rationale: Động từ עשה có nghĩa cơ bản là “làm”, nhưng khi đi với các loại lễ vật thì mang nghĩa thực hiện hay dâng sinh tế.
- source_word: אֶחָד לְחַטָּאת
  choice: một con làm lễ vật chuộc tội
  rationale: חטאת ở đây chỉ loại sinh tế thường gọi là lễ vật chuộc tội; trong bối cảnh ô uế nghi lễ, cũng có thể hiểu là lễ vật thanh tẩy, nên giữ phương án ấy trong chú thích.
- source_word: וְאֶחָד לְעֹלָה
  choice: một con làm lễ thiêu
  rationale: עלה là sinh tế được thiêu toàn bộ; “lễ thiêu” là cách gọi rõ ràng, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: וְכִפֶּר עָלָיו
  choice: làm lễ chuộc tội cho người ấy
  rationale: Giữ ý nghĩa nghi lễ và thần học của כפר mà không ấn định một lý thuyết riêng về sự chuộc tội.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: vì người ấy đã phạm tội liên quan đến người chết
  rationale: מֵאֲשֶׁר nêu lý do cần chuộc tội; trong ngữ cảnh luật người Na-xia, נפש chỉ người đã chết gây ô uế. “Liên quan đến” giữ được độ rộng của giới từ על.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: người ấy phải biệt riêng đầu mình ra thánh
  rationale: Chủ thể theo ngữ cảnh là người Na-xia, không phải thầy tế lễ. Cách diễn đạt này giữ động từ “làm nên thánh/biệt riêng” và mối liên hệ giữa đầu, tóc với sự biệt riêng của lời khấn.
- source_word: בַּיּוֹם הַהוּא
  choice: Ngay trong ngày đó
  rationale: Diễn đạt thời điểm của hành động trong chính ngày nghi lễ, tự nhiên hơn trong tiếng Việt mà vẫn sát cụm Hê-bơ-rơ.
theological_decisions:
- issue: Ý nghĩa của חַטָּאת trong bối cảnh tế lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Danh từ này vừa là tên truyền thống của sinh tế xử lý tội lỗi, vừa có sắc thái thanh tẩy rõ trong bối cảnh ô uế do người chết; bản chính dùng tên gọi quen thuộc và chú thích bảo tồn phương án kia.
- issue: Đối tượng của הַנֶּפֶשׁ
  choice: người chết
  alternative: thi thể
  rationale: Trong ngữ cảnh Dân Số 6:6–12, từ nghĩa đen là “người/sinh mạng” chỉ một người đã chết. “Người chết” bảo toàn tính người, còn chú thích giải thích rằng sự tiếp xúc với thi thể gây ô uế.
- issue: Chủ thể của וְקִדַּשׁ
  choice: người Na-xia phải biệt riêng đầu mình ra thánh
  alternative: thầy tế lễ biệt riêng đầu người ấy ra thánh
  rationale: Dù động từ đứng sau chuỗi hành động của thầy tế lễ, nội dung và phần tiếp theo về việc tái biệt riêng cho Đức Giê-hô-va cho thấy hành động này thuộc về người Na-xia; nêu “người ấy” tránh để tiếng Việt gán một hành động khó hiểu cho thầy tế lễ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “thầy tế lễ”, “lễ vật chuộc tội”, “lễ thiêu”, “biệt riêng… ra thánh” để giữ sắc thái nghi lễ mà không quá cổ. Hai chú thích bảo tồn sự nhập nhằng từ vựng quan trọng của bản Hê-bơ-rơ.
