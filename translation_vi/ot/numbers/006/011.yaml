  terminology: “Thầy tế lễ”, “lễ vật chuộc tội”, “lễ thiêu” và “làm lễ chuộc tội” phù hợp. Chú thích a bảo tồn cách hiểu “lễ vật thanh tẩy”. Chú thích b nên dùng dạng tên gọi quen thuộc hơn là “Na-xi-rê”.
  issues:
