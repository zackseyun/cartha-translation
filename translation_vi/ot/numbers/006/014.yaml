id: NUM.6.14
reference: Numbers 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: vi
  text: 'và người ấy phải dâng lễ vật của mình cho Yahweh: một chiên đực một tuổi, không tì vết, làm lễ thiêu; một chiên cái một tuổi, không tì vết, làm lễ chuộc tội[a]; và một con cừu đực không tì vết làm lễ bình an[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ tội lỗi và cũng có thể chỉ tế lễ thanh tẩy khỏi sự ô uế hoặc vi phạm.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “lễ cầu an” hoặc “lễ thông công”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: và người ấy phải dâng
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến hoặc trình dâng; “phải dâng” tự nhiên trong văn luật lệ và giữ sắc thái nghi lễ.
- source_word: קָרְבָּנוֹ
  choice: lễ vật của mình
  rationale: Chỉ chung vật được đem dâng trong nghi lễ; “lễ vật” rõ ràng và không thu hẹp vào một loại tế lễ riêng.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ nguyên danh giao ước יהוה dưới dạng Yahweh; “dâng ... lên” là cách nói tự nhiên trong tiếng Việt.
- source_word: כֶּבֶשׂ ... בֶּן־שְׁנָתוֹ
  choice: một chiên đực một tuổi
  rationale: כֶּבֶשׂ là chiên con giống đực, còn thành ngữ בֶּן־שְׁנָתוֹ chỉ con vật một tuổi; cách diễn đạt này tự nhiên và giữ rõ giới tính.
- source_word: תָמִים / תְּמִימָה
  choice: không tì vết
  rationale: Trong luật tế lễ, từ này chỉ con vật không có khuyết tật; đây là cách dịch trang trọng và quen thuộc.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: עֹלָה là loại tế lễ được thiêu; “lễ thiêu” ngắn gọn, minh bạch và phù hợp ngữ cảnh nghi lễ.
- source_word: וְכַבְשָׂה ... בַּת־שְׁנָתָהּ
  choice: một chiên cái một tuổi
  rationale: כַבְשָׂה là chiên con giống cái; giữ sự đối ứng giới tính với con chiên đực trước đó.
- source_word: לְחַטָּאת
  choice: làm lễ chuộc tội
  rationale: חַטָּאת vừa có thể chỉ tội lỗi vừa chỉ tế lễ liên quan đến tội lỗi hoặc sự thanh tẩy. “Lễ chuộc tội” là tên gọi dễ nhận biết; khả năng “lễ thanh tẩy” được giữ trong chú thích.
- source_word: וְאַיִל אֶחָד
  choice: một con cừu đực
  rationale: אַיִל chỉ cừu đực trưởng thành, phân biệt với כֶּבֶשׂ là chiên con; “cừu đực” truyền đạt đúng khác biệt từ vựng.
- source_word: לִשְׁלָמִים
  choice: làm lễ bình an
  rationale: שְׁלָמִים là một loại tế lễ gắn với bình an, an lành và sự thông công; “lễ bình an” ngắn gọn và quen thuộc, còn các sắc thái khác được nêu trong chú thích.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Chuyển âm danh riêng giao ước thay vì thay bằng một tước hiệu, phù hợp với việc danh này xuất hiện trực tiếp trong bản Hê-bơ-rơ.
- issue: Ý nghĩa của חַטָּאת trong luật tế lễ
  choice: lễ chuộc tội
  alternative: lễ thanh tẩy
  rationale: Từ ngữ có thể nhấn mạnh tội lỗi hoặc chức năng thanh tẩy. Bản chính dùng tên gọi phổ thông nhưng chú thích bảo tồn khả năng nghĩa kia.
- issue: Ý nghĩa của שְׁלָמִים
  choice: lễ bình an
  alternative: lễ cầu an / lễ thông công
  rationale: Từ này có trường nghĩa gồm bình an, an lành và sự thông công; không ép toàn bộ ý nghĩa vào một cách giải thích duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc liệt kê được làm rõ bằng dấu hai chấm và dấu chấm phẩy. Dùng “chiên” cho chiên con và “cừu đực” cho אַיִל để bảo tồn khác biệt từ vựng trong nguyên văn.
