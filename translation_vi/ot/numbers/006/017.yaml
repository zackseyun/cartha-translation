    rationale: מִנְחָתוֹ và נִסְכּוֹ đều mang hậu tố số ít. Dịch riêng “... của sinh tế ấy” cho từng lễ phẩm phản ánh cấu trúc nguồn rõ hơn, vẫn tránh đại từ chỉ súc vật kém trang trọng.
  - severity: low
    issue: Chú thích dùng “lễ bình an/lễ thông công”, không khớp hoàn toàn với thuật ngữ chính “sinh tế bình an”.
    rationale: Đồng bộ thuật ngữ giúp người đọc hiểu đây là phương án dịch thay thế cho cùng một cụm זֶבַח שְׁלָמִים, không phải một tên loại lễ khác.
