  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: vi
  text: Người ấy phải dâng con chiên đực làm sinh tế bình an[a] lên Yahweh, cùng với giỏ bánh không men; rồi thầy tế lễ phải dâng lễ phẩm ngũ cốc của sinh tế ấy và lễ quán của sinh tế ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sinh tế thông công”. Từ Hê-bơ-rơ שְׁלָמִים có thể được dịch là “bình an” hoặc “thông công”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: con chiên đực
  rationale: אַיִל chỉ chiên đực trưởng thành, nhất là trong ngữ cảnh tế lễ; cách dịch này rõ nghĩa và tự nhiên hơn từ Hán-Việt 'cừu đực' đối với độc giả phổ thông.
- source_word: יַעֲשֶׂה זֶבַח
  choice: phải dâng ... làm sinh tế
  rationale: Động từ עשה vốn có nghĩa rộng là 'làm', nhưng trong luật tế lễ diễn tả việc thực hiện hay dâng sinh tế; cách diễn đạt này vừa giữ yếu tố זֶבַח vừa tự nhiên trong tiếng Việt.
- source_word: זֶבַח שְׁלָמִים
  choice: sinh tế bình an
  rationale: Giữ cả danh từ זֶבַח ('sinh tế') và tên loại lễ שְׁלָמִים ('bình an'), đồng thời tránh thu hẹp ý nghĩa thành riêng sự thông công.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giới từ ל đánh dấu đối tượng tiếp nhận hay sự dâng hiến; 'dâng ... lên Yahweh' là cách nói tế lễ tự nhiên trong tiếng Việt và giữ nguyên danh giao ước.
- source_word: עַל סַל הַמַּצּוֹת
  choice: cùng với giỏ bánh không men
  rationale: Trong ngữ cảnh này עַל biểu thị sự đi kèm trong nghi lễ hơn là vị trí không gian; 'cùng với' truyền đạt rõ quan hệ ấy.
- source_word: מִנְחָתוֹ
  choice: lễ phẩm ngũ cốc ... đi kèm với sinh tế ấy
  rationale: מִנְחָה trong văn bản tư tế là lễ phẩm làm từ ngũ cốc. Hậu tố số ít giống đực có thể quy chiếu đến con chiên đực hoặc sinh tế; diễn đạt 'đi kèm với sinh tế ấy' làm rõ quan hệ nghi lễ mà không gán cho một người.
- source_word: נִסְכּוֹ
  choice: lễ quán đi kèm với sinh tế ấy
  rationale: נֶסֶךְ là phần rượu hay chất lỏng được rưới trong nghi lễ. 'Lễ quán' là thuật ngữ Kinh Thánh gọn và chính xác; cụm bổ nghĩa chung làm rõ đây là lễ đi kèm.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng danh riêng giao ước יהוה; chuyển tự 'Yahweh' bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Cách chuyển dịch שְׁלָמִים
  choice: bình an
  alternative: thông công
  rationale: '''Bình an'' duy trì cách gọi truyền thống và độ rộng nghĩa của thuật ngữ Hê-bơ-rơ; ''thông công'' là khả dĩ nhưng nhấn mạnh một phương diện diễn giải hẹp hơn.'
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng 'phải dâng' cho sắc thái quy định của luật tế lễ; giữ 'Yahweh' theo nguyên văn. 'Sinh tế bình an', 'lễ phẩm ngũ cốc' và 'lễ quán' bảo tồn các loại lễ khác nhau, còn cụm 'đi kèm với sinh tế ấy' tránh sự mơ hồ không tự nhiên của đại từ sở hữu tiếng Việt.
