  yaml_path: translation/ot/numbers/006/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: «YHWH»; theo truyền thống thường dịch là «Đức Giê-hô-va» hoặc «CHÚA».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn nhập lời Đức Chúa Trời được dịch tự nhiên và trang trọng là “phán”; dạng có waw tiếp diễn mở ra một bước mới trong trình thuật.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל chỉ người tiếp nhận lời phán; “phán với Môi-se” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn lời, “rằng” chuyển tải tự nhiên chức năng mở đầu lời nói trực tiếp, tránh lối dịch cứng “mà nói”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” giữ đây là danh riêng và phù hợp với cách gọi trang trọng, dễ nhận biết trong tiếng Việt; không thay danh ấy bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm báo trước lời phán trực tiếp tiếp nối ở câu 23.
