  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לְ/אָבִ֣י/ו וּ/לְ/אִמּ֗/וֹ לְ/אָחִי/ו֙ וּ/לְ/אַ֣חֹת֔/וֹ לֹא יִטַּמָּ֥א לָ/הֶ֖ם בְּ/מֹתָ֑/ם כִּ֛י נֵ֥זֶר אֱלֹהָ֖י/ו עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: vi
  text: Dù là cha mình, mẹ mình, anh em trai mình hay chị em gái mình, người ấy cũng không được để mình bị ô uế vì họ khi họ qua đời[a], vì dấu hiệu biệt riêng cho Đức Chúa Trời của người ấy ở trên đầu người ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “... vì họ vào lúc họ qua đời.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ nê-xe (nezer) trong bối cảnh Na-xi-rê có thể chỉ tình trạng hoặc dấu hiệu được biệt riêng cho Đức Chúa Trời; dấu hiệu ấy được biểu hiện qua mái tóc trên đầu người ấy.
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: Dù là cha, mẹ, anh em trai hay chị em gái
  rationale: Cụm từ chỉ thân nhân được đặt lên đầu câu trong tiếng Hê-bơ-rơ để nhấn mạnh. Cấu trúc “Dù là… cũng không” chuyển tải sự nhấn mạnh ấy tự nhiên trong tiếng Việt, đồng thời giữ đúng các quan hệ thân thuộc ở số ít.
- source_word: לֹא יִטַּמָּא
  choice: không được làm cho mình bị ô uế
  rationale: Dạng Hitpael mang sắc thái phản thân. Cách dịch này cho thấy người Na-xi-rê không được để chính mình rơi vào tình trạng ô uế theo nghi lễ, thay vì hàm ý một sự bại hoại về đạo đức.
- source_word: לָהֶם בְּמֹתָם
  choice: vì họ khi họ qua đời
  rationale: “Vì họ” quy chiếu về những thân nhân vừa nêu; “khi họ qua đời” diễn đạt rõ hoàn cảnh phát sinh sự ô uế do người chết, dù chuyển danh từ מֹת sang mệnh đề tự nhiên hơn trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Liên từ giới thiệu lý do của lệnh cấm; “vì” ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: נֵזֶר
  choice: sự biệt riêng
  rationale: Trong bối cảnh Na-xi-rê, từ này chỉ tình trạng hoặc dấu hiệu được biệt riêng, thánh hiến cho Đức Chúa Trời; lựa chọn này tránh khiến người đọc hiểu đơn thuần là một chiếc vương miện vật chất.
- source_word: אֱלֹהָיו
  choice: Đức Chúa Trời của người ấy
  rationale: Giữ lại hậu tố sở hữu ngôi thứ ba số ít trong nguyên văn và sắc thái quan hệ cá nhân/giao ước.
- source_word: עַל רֹאשׁוֹ
  choice: ở trên đầu người ấy
  rationale: Giữ hình ảnh cụ thể của nguyên văn, có khả năng ám chỉ mái tóc Na-xi-rê như biểu hiện hữu hình của sự biệt riêng.
theological_decisions:
- issue: Bản chất của sự ô uế trong luật về người Na-xi-rê
  choice: Dùng ngôn ngữ chỉ tình trạng ô uế theo nghi lễ, không diễn tả như sự suy đồi đạo đức.
  alternative: Dịch bằng từ ngữ nặng nghĩa đạo đức như “làm nhơ nhuốc bản thân” mà không giải thích.
  rationale: Văn cảnh nói về sự ô uế do tiếp xúc với cái chết trong luật thanh sạch dành cho người Na-xi-rê. Bản dịch không nên gán thêm ý niệm phạm tội cá nhân mà câu này không trực tiếp khẳng định.
- issue: Ý nghĩa của נֵזֶר trong bối cảnh Na-xi-rê
  choice: Giữ nghĩa “sự biệt riêng”, đồng thời giải thích trong chú thích rằng mái tóc là dấu hiệu hữu hình của tình trạng ấy.
  alternative: Dịch trực tiếp là “vương miện” hoặc đồng nhất hoàn toàn từ này với mái tóc.
  rationale: Từ ngữ có trường nghĩa gồm sự biệt riêng, sự thánh hiến và dấu hiệu trên đầu. Cách dịch giữ được ý nghĩa nghi lễ mà không thu hẹp hình ảnh đa nghĩa thành một vật thể duy nhất.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “người ấy” để giữ ngôi thứ ba số ít và tránh lối xưng hô cổ. Cấu trúc đầu câu bảo tồn sự nhấn mạnh của nguyên văn. Hai dấu chú thích đều được đặt ngay tại nội dung mà chú thích giải thích.
