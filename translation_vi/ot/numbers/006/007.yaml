  source_fidelity: Bản nháp phản ánh đúng các thân nhân số ít, lệnh cấm tự làm mình nhiễm ô uế theo nghi lễ, hoàn cảnh họ qua đời, và mệnh đề chỉ lý do. Tuy nhiên, “sự biệt riêng ... ở trên đầu” khiến một khái niệm trừu tượng nghe như nằm vật lý trên đầu, trong khi נֵזֶר tại đây có thể chỉ dấu hiệu cụ thể cũng như tình trạng biệt riêng. Bản sửa dùng “dấu hiệu biệt riêng” để giữ hình ảnh ‘ở trên đầu’ mà không đồng nhất từ này hoàn toàn với tóc.
  naturalness: “Không được làm cho mình bị ô uế” và chú thích a hiện có hơi gượng trong tiếng Việt hiện đại. “Không được để mình bị ô uế” tự nhiên hơn, vẫn nêu rõ tính phản thân và bối cảnh nghi lễ. Cú pháp chú thích a cũng được sửa thành một phương án tiếng Việt hoàn chỉnh, tự nhiên.
  terminology: Giữ “ô uế” trong nghĩa nghi lễ và “Đức Chúa Trời.” “Dấu hiệu biệt riêng” diễn đạt נֵזֶר trong văn cảnh Na-xi-rê, còn chú thích bảo lưu rằng từ Hê-bơ-rơ có thể chỉ cả tình trạng lẫn dấu hiệu của sự biệt riêng.
