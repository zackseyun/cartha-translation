  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: vi
  text: người ấy phải kiêng rượu nho và thức uống gây say[a]; không được uống giấm làm từ rượu nho hay giấm làm từ thức uống gây say; cũng không được uống bất cứ thứ nước nào từ nho[b], và không được ăn nho tươi hay nho khô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm này chỉ một loại thức uống gây say khác với rượu nho; không nhất thiết là rượu mạnh được chưng cất theo nghĩa hiện đại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bất cứ nước nho nào” hoặc “bất cứ thứ nước ngâm nho nào”; từ Hê-bơ-rơ chỉ chất lỏng có được từ nho qua việc ngâm hoặc chế biến.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן
  choice: rượu nho
  rationale: יַיִן là từ thông dụng chỉ rượu, trong ngữ cảnh này là rượu làm từ nho. Tiền tố מִן đi với יַזִּיר được thể hiện tự nhiên bằng cụm “kiêng …”.
- source_word: וְשֵׁכָר
  choice: và thức uống gây say
  rationale: שֵׁכָר chỉ một loại đồ uống gây say khác với rượu nho. Cách dịch này tránh “rượu mạnh,” vốn trong tiếng Việt hiện đại dễ bị hiểu riêng là rượu chưng cất.
- source_word: יַזִּיר
  choice: phải kiêng
  rationale: Dạng Hiphil của נזר trong luật về người Na-xi-rê mang nghĩa tự tách mình khỏi hoặc kiêng những thứ được nêu. “Phải kiêng” rõ ràng, tự nhiên và phù hợp sắc thái quy định.
- source_word: חֹמֶץ יַיִן
  choice: giấm làm từ rượu nho
  rationale: חֹמֶץ có thể chỉ chất uống đã chua hoặc giấm. Cách dịch này biểu đạt rõ quan hệ cấu tạo với יַיִן mà không khiến độc giả hiểu đây chỉ là giấm ăn hiện đại.
- source_word: וְחֹמֶץ שֵׁכָר
  choice: hay giấm làm từ thức uống gây say
  rationale: Giữ cấu trúc song song với “giấm làm từ rượu nho” và cho thấy sản phẩm chua có nguồn từ שֵׁכָר cũng bị cấm.
- source_word: וְכָל מִשְׁרַת עֲנָבִים
  choice: cũng không được uống bất cứ thứ nước ngâm nho nào
  rationale: מִשְׁרָה chỉ chất lỏng do ngâm, ở đây là ngâm nho. “Nước ngâm nho” bám sát nguồn hơn “nước nho,” đồng thời chú thích ghi nhận phạm vi nghĩa có thể rộng hơn.
- source_word: וַעֲנָבִים לַחִים וִיבֵשִׁים
  choice: nho tươi hay nho khô
  rationale: לַחִים và יְבֵשִׁים đối lập nho còn tươi/ẩm với nho đã khô. “Hay” diễn đạt tự nhiên phạm vi cấm bao gồm cả hai loại, dù tiếng Hê-bơ-rơ nối chúng bằng “và”.
- source_word: לֹא יֹאכֵל
  choice: không được ăn
  rationale: Diễn đạt trực tiếp lệnh cấm; lặp lại “không được” giúp câu tiếng Việt rõ ràng và cân đối.
theological_decisions:
- issue: Sắc thái của việc kiêng trong lời khấn Na-xi-rê
  choice: Dịch יַזִּיר là “phải kiêng”
  alternative: “phải tách mình khỏi”
  rationale: “Phải kiêng” truyền đạt đúng hành vi được quy định trong câu mà không thêm cách giải thích thần học về bản chất của sự biệt riêng; ý niệm biệt riêng vẫn do văn cảnh của toàn phân đoạn xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để nối tự nhiên với chủ thể được nêu ở câu trước; dùng “thức uống gây say” thay cho “rượu mạnh” nhằm tránh hàm ý đồ uống chưng cất hiện đại. Các vế cấm được giữ song song để phản ánh nhịp lập pháp của nguyên văn.
