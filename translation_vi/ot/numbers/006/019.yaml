revisions:
- from: Rồi thầy tế lễ sẽ lấy cái vai đã luộc của con chiên đực, một ổ bánh không men trong giỏ và một bánh mỏng không men, đặt tất cả vào lòng hai bàn tay của người Na-xia sau khi người ấy đã cạo tóc biệt riêng của mình.[a]
  to: Rồi thầy tế lễ sẽ lấy phần vai đã luộc của con chiên đực, một ổ bánh không men từ trong giỏ và một chiếc bánh mỏng không men, rồi đặt những thứ ấy trên lòng hai bàn tay của người Na-xia, sau khi người ấy đã cạo mái tóc biệt riêng của mình.[a]
  rationale: Bản sửa thay các cách diễn đạt hơi khẩu ngữ hoặc kém sát vị trí trong nguyên văn bằng văn phong nghi lễ tự nhiên hơn, đồng thời duy trì việc làm rõ “mái tóc” theo ngữ cảnh. Chú thích giữ lại cách nói sát chữ của tiếng Hê-bơ-rơ và giải thích mối liên hệ ngữ cảnh mà không biến nó thành một nghĩa từ vựng duy nhất.
