base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: vi
  text: Rồi thầy tế lễ sẽ lấy phần vai đã luộc của con chiên đực, một ổ bánh không men từ trong giỏ và một chiếc bánh mỏng không men, rồi đặt những thứ ấy trên lòng hai bàn tay của người Na-xia, sau khi người ấy đã cạo mái tóc biệt riêng của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “sau khi người ấy đã cạo sự biệt riêng của mình.” Trong ngữ cảnh, cách nói này chỉ mái tóc là dấu hiệu của sự biệt riêng của người Na-xia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Rồi ... sẽ lấy
  rationale: Trong chỉ dẫn nghi lễ, waw kèm qatal diễn tả bước kế tiếp; cách dịch này giữ trình tự và có giọng quy định tự nhiên trong tiếng Việt.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Thuật ngữ tiếng Việt quen thuộc chỉ người thi hành nghi lễ; mạo từ xác định được thể hiện theo ngữ cảnh.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: cái vai đã luộc
  rationale: זְרוֹעַ chỉ phần chân trước/vai trong ngữ cảnh tế lễ, còn בְּשֵׁלָה nói phần ấy đã được luộc chín.
- source_word: מִן הָאַיִל
  choice: của con chiên đực
  rationale: מן ở đây nêu con vật mà phần vai được lấy ra; tiếng Việt tự nhiên dùng quan hệ sở thuộc.
- source_word: חַלַּת מַצָּה אַחַת
  choice: một ổ bánh không men
  rationale: חַלָּה là một ổ hoặc bánh tròn; 'ổ bánh' tự nhiên, còn 'không men' giữ rõ đặc điểm của מַצָּה.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: một bánh mỏng không men
  rationale: רְקִיק là loại bánh mỏng; cách dịch mô tả rõ hơn từ vay mượn và dễ hiểu với độc giả hiện đại.
- source_word: וְנָתַן עַל כַּפֵּי
  choice: đặt tất cả vào lòng hai bàn tay
  rationale: כַּפַּיִם chỉ hai lòng bàn tay. 'Đặt ... vào lòng hai bàn tay' diễn đạt tư thế tiếp nhận tự nhiên trong tiếng Việt; 'tất cả' làm rõ các vật vừa liệt kê mà không thêm nội dung.
- source_word: הַנָּזִיר
  choice: người Na-xia
  rationale: Dùng thuật ngữ phiên âm quen thuộc cho người đã lập lời khấn biệt riêng, tránh diễn giải dài ngay trong câu.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: sau khi người ấy đã cạo
  rationale: Cụm nguyên mẫu với אַחַר được chuyển thành mệnh đề thời gian, chỉ hành động hoàn tất trước bước nghi lễ chính.
- source_word: אֶת נִזְרוֹ
  choice: tóc biệt riêng của mình
  rationale: Danh từ נֵזֶר có nghĩa đen liên quan đến sự biệt riêng, nhưng trong nghi lễ Na-xia ở đây đối tượng được cạo là mái tóc biểu thị sự biệt riêng.
theological_decisions:
- issue: Cách hiểu נִזְרוֹ trong nghi lễ Na-xia
  choice: tóc biệt riêng của mình
  alternative: sự biệt riêng của mình
  rationale: Nguyên văn dùng danh từ có thể chỉ tình trạng/dấu hiệu biệt riêng, tạo lối nói cô đọng. Ngữ cảnh trực tiếp cho thấy việc cạo liên quan đến tóc, nên đưa 'tóc' vào câu để tiếng Việt có nghĩa tự nhiên, đồng thời giữ 'biệt riêng' và chú thích nghĩa sát chữ thay vì đồng nhất hoàn toàn sự biệt riêng với tóc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và mang tính chỉ dẫn nghi lễ. Dùng 'người Na-xia' làm thuật ngữ phiên âm, cùng các từ cụ thể như 'vai', 'luộc', 'ổ bánh' và 'lòng hai bàn tay' để câu dễ hình dung.
