  terminology: Giữ “Đức Giê-hô-va” theo lựa chọn thuật ngữ của bản nháp. “Thi thể của người chết” là cách nói rõ ràng, phù hợp với ngữ cảnh luật thanh sạch; chú thích giải thích thành ngữ Hê-bơ-rơ mà không đưa chi tiết giáo phái vào bản văn.
