  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: vi
  text: Trong suốt thời gian biệt riêng của người ấy cho Đức Giê-hô-va[a], người ấy không được đến gần thi thể của người chết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời khấn Na-xi-rê của người ấy” hoặc “sự dâng hiến của người ấy”. Từ Hê-bơ-rơ chỉ tình trạng hay thời kỳ được biệt riêng làm người Na-xi-rê.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “một nephesh chết”; trong ngữ cảnh này có nghĩa là thi thể của một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Suốt những ngày
  rationale: Diễn đạt tự nhiên tổng thể toàn bộ thời gian được nói đến, đồng thời giữ hình ảnh “những ngày” của cấu trúc Hê-bơ-rơ.
- source_word: הַזִּירוֹ
  choice: biệt riêng mình
  rationale: Động danh từ thuộc gốc נזר chỉ tình trạng hoặc thời kỳ một người được biệt riêng làm người Na-xi-rê. Cách dịch này không tự thêm danh từ “lời khấn”, nhưng ngữ cảnh vẫn xác định đây là sự biệt riêng của người Na-xi-rê.
- source_word: לַיהוָה
  choice: cho Đức Giê-hô-va
  rationale: Giới từ לְ biểu thị sự dâng hiến hoặc biệt riêng hướng về YHWH; “cho” tự nhiên trong tiếng Việt và giữ sắc thái dâng mình. Danh riêng giao ước יהוה được chuyển theo dạng quen thuộc “Đức Giê-hô-va”.
- source_word: לֹא יָבֹא עַל
  choice: không được đến gần
  rationale: Trong quy định pháp luật, thể chưa hoàn thành có phủ định diễn tả điều cấm. Kết hợp בוא với עַל ở đây mang nghĩa đến gần một tử thi.
- source_word: נֶפֶשׁ מֵת
  choice: thi thể người chết
  rationale: Cụm từ theo nghĩa đen là “một nephesh chết”, nhưng trong luật thanh sạch chỉ tử thi con người. “Thi thể người chết” rõ nghĩa và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt thuật ngữ chỉ sự biệt riêng của người Na-xi-rê
  choice: biệt riêng mình
  alternative: lời khấn Na-xi-rê của mình; sự dâng mình của mình
  rationale: Danh từ הַזִּירוֹ nhấn mạnh tình trạng hoặc thời kỳ biệt riêng, không trực tiếp là danh từ “lời khấn”. Bản dịch chính giữ nghĩa từ vựng và để ngữ cảnh Dân Số 6 xác định thể chế Na-xi-rê.
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt để thể hiện rằng bản Hê-bơ-rơ có danh giao ước יהוה, thay vì đồng nhất nó với một tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người ấy” duy trì chủ thể số ít mà không làm câu quá cổ; “không được” truyền đạt rõ lực cấm của quy định. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
