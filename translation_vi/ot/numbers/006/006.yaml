revisions:
- from: Suốt những ngày biệt riêng mình[a] cho Đức Giê-hô-va, người ấy không được đến gần thi thể người chết[b].
  to: Trong suốt thời gian biệt riêng của người ấy cho Đức Giê-hô-va[a], người ấy không được đến gần thi thể của người chết[b].
  rationale: Sửa cấu trúc “biệt riêng mình” thành “thời gian biệt riêng của người ấy” để phản ánh đúng danh từ Hê-bơ-rơ có sở hữu ngữ, đồng thời tạo câu tiếng Việt hiện đại, rõ ràng. Giữ nguyên lực cấm pháp lý, thời lượng bao quát, tên riêng Đức Giê-hô-va, và chú thích neo đúng tại các cụm liên quan.
