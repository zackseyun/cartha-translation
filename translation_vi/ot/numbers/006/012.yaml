  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: vi
  text: Người ấy phải biệt riêng cho Đức Giê-hô-va thời gian mình làm người Na-xi-rê[a], và phải đem đến một con chiên đực một tuổi làm lễ vật chuộc lỗi. Nhưng những ngày trước đó sẽ không được kể[b], vì sự biệt riêng của người ấy đã bị ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những ngày biệt riêng của mình” hoặc “những ngày thánh hiến của mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những ngày đầu sẽ rơi”; nghĩa là những ngày đã trải qua trước đó không còn được tính.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  choice: phải biệt riêng
  rationale: Dạng Hiphil của נזר trong luật về người Na-xi-rê chỉ việc bắt đầu lại thời kỳ biệt riêng đã bị gián đoạn; ngữ cảnh làm rõ ý tái lập mà không cần thêm từ không có trực tiếp trong nguyên văn.
- source_word: לַיהוָה
  choice: cho Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ và diễn đạt tự nhiên đích hướng của sự biệt riêng.
- source_word: יְמֵי נִזְרוֹ
  choice: trọn những ngày làm người Na-xi-rê
  rationale: Chỉ thời hạn thuộc quy chế biệt riêng của người Na-xi-rê; cách dịch này vừa rõ nghĩa thể chế vừa không thu hẹp נזר chỉ còn hành vi khấn nguyện.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: một con chiên đực một tuổi
  rationale: Diễn đạt tự nhiên quy định về giới tính và độ tuổi của sinh tế.
- source_word: לְאָשָׁם
  choice: làm lễ vật chuộc lỗi
  rationale: אָשָׁם là loại lễ vật nghi thức gắn với lỗi phạm và sự bồi hoàn; 'lễ vật chuộc lỗi' là thuật ngữ dễ hiểu trong tiếng Việt.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: những ngày trước đó sẽ không được kể
  rationale: Nghĩa đen là 'những ngày đầu sẽ rơi'; trong quy định này, hiệu lực pháp lý là số ngày đã trải qua trước khi bị ô uế không còn được tính.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: vì sự biệt riêng của người ấy đã bị ô uế
  rationale: Giữ mối liên hệ từ vựng với נזר và sắc thái ô uế nghi lễ, thay vì diễn giải rằng chính lời khấn là đối tượng bị ô uế.
theological_decisions:
- issue: Cách dịch נזר trong luật về người Na-xi-rê
  choice: sự biệt riêng / làm người Na-xi-rê
  alternative: lời khấn Na-xi-rê / sự thánh hiến
  rationale: Ngữ căn nhấn mạnh tình trạng biệt riêng, còn ngữ cảnh Dân Số 6 xác định đây là quy chế Na-xi-rê. Phối hợp hai cách diễn đạt giữ được cả nghĩa từ vựng lẫn tính thể chế.
- issue: Cách thể hiện יהוה
  choice: Đức Giê-hô-va
  alternative: Đức Chúa Hằng Hữu / CHÚA / Gia-vê
  rationale: Dùng một danh xưng riêng quen thuộc trong tiếng Việt để phản ánh việc nguyên văn dùng thần danh, không đồng nhất nó với danh từ chung 'Chúa'.
- issue: Hiệu lực của những ngày đã giữ trước khi bị ô uế
  choice: sẽ không được kể
  alternative: sẽ mất / sẽ đổ xuống
  rationale: 'Đây là hệ quả trực tiếp của יִפְּלוּ trong ngữ cảnh luật nghi lễ: thời gian trước đó không được tính vào kỳ biệt riêng mới; chú thích bảo lưu hình ảnh nguyên văn.'
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp văn bản luật nghi lễ. Dùng 'người ấy' để tránh sắc thái giới tính không cần thiết trong đại từ tiếng Việt, trong khi vẫn giữ rõ quy định về con chiên đực. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
