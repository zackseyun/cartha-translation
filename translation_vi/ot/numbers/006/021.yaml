revisions:
- from: 'Đây là luật lệ về người Na-xi-rê khi người ấy lập lời khấn: ngoài lễ vật dâng lên Yahweh vì sự biệt riêng của mình, người ấy còn dâng những gì khả năng mình cho phép.[a] Người ấy phải làm đúng theo lời khấn mình đã lập, phù hợp với luật lệ về sự biệt riêng của người Na-xi-rê.'
  to: Đây là luật lệ dành cho người Na-xi-rê, người khấn dâng lễ vật của mình cho Yahweh vì sự biệt riêng của mình, ngoài những gì người ấy có khả năng dâng.[a] Theo lời khấn mà người ấy khấn, người ấy phải làm như vậy, theo luật lệ về sự biệt riêng của mình.
  rationale: Bản sửa phục hồi việc “lễ vật” là đối tượng của động từ “khấn dâng” và không thêm ý rằng người ấy thực hiện một hành động dâng riêng, bổ sung. Cụm về khả năng được giữ gần với vị trí và độ cô đọng của nguyên văn; chú thích bảo lưu hình ảnh “tay ... đạt tới” cùng sắc thái thành ngữ. Câu sau duy trì sự lặp lại giữa lời khấn cụ thể và luật lệ về sự biệt riêng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:38:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo nhận diện đúng các thuật ngữ chính: תּוֹרָה là quy định/luật lệ, נָזִיר là người Na-xi-rê, נֵזֶר là sự biệt riêng, và יהוה là Yahweh. Tuy nhiên, trật tự cú pháp của mệnh đề đầu đã bị thay đổi đáng kể: nguyên văn nói về người Na-xi-rê “khấn dâng lễ vật của mình ... ngoài/bên cạnh những gì tay người ấy có thể lo liệu”, trong khi bản thảo biến thành một mệnh đề mới rằng người ấy “còn dâng” theo khả năng. Điều này thêm một quan hệ hành động không được nêu rõ trong tiếng Hê-bơ-rơ.'
  naturalness: “Luật lệ dành cho” và “khấn dâng” là tiếng Việt hiện đại, tự nhiên trong văn phong pháp lý–tôn giáo. Việc giữ lặp lại “lời khấn ... khấn” phản ánh đúng sự lặp từ có chủ ý của nguyên văn, dù có thể hơi trang trọng.
  terminology: “Người Na-xi-rê,” “lễ vật,” “Yahweh,” “lời khấn,” và “sự biệt riêng” phù hợp. “Sự biệt riêng” giữ được sự phân biệt từ vựng giữa נֵזֶר và נֶדֶר, không áp đặt cách giải thích giáo phái.
  issues:
  - severity: high
    issue: Đảo quan hệ cú pháp của cụm “ngoài những gì tay người ấy có thể đạt tới/lo liệu”.
    rationale: Bản thảo viết “ngoài lễ vật ... người ấy còn dâng những gì khả năng mình cho phép,” khiến cụm này trở thành một lễ vật bổ sung mà người ấy dâng. Nguyên văn gắn cụm này với lễ vật mà người Na-xi-rê khấn dâng và để quan hệ chính xác còn cô đọng/khó phân định; không nên thêm “còn dâng.”
  - severity: medium
    issue: Mệnh đề mở đầu “khi người ấy lập lời khấn” làm mờ bổ ngữ trực tiếp “lễ vật của mình” của động từ khấn.
    rationale: אֲשֶׁר יִדֹּר קָרְבָּנוֹ nêu người Na-xi-rê là người khấn dâng lễ vật của mình. Bản sửa cần biểu đạt rõ lễ vật là đối tượng của lời khấn.
  revised_text: Đây là luật lệ dành cho người Na-xi-rê, người khấn dâng lễ vật của mình cho Yahweh vì sự biệt riêng của mình, ngoài những gì người ấy có khả năng dâng.[a] Theo lời khấn mà người ấy khấn, người ấy phải làm như vậy, theo luật lệ về sự biệt riêng của mình.
  revised_footnotes:
  - marker: a
    text: 'Nguyên văn: “ngoài những gì tay người ấy có thể đạt tới.” Thành ngữ này chỉ khả năng hoặc phương tiện của người ấy; cũng có thể dịch: “ngoài những gì người ấy có thể lo liệu.”'
