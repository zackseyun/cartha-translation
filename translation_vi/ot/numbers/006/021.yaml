base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: vi
  text: Đây là luật lệ dành cho người Na-xi-rê, người khấn dâng lễ vật của mình cho Yahweh vì sự biệt riêng của mình, ngoài những gì người ấy có khả năng dâng.[a] Theo lời khấn mà người ấy khấn, người ấy phải làm như vậy, theo luật lệ về sự biệt riêng của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ngoài những gì tay người ấy có thể đạt tới.” Thành ngữ này chỉ khả năng hoặc phương tiện của người ấy; cũng có thể dịch: “ngoài những gì người ấy có thể lo liệu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: luật lệ về
  rationale: Trong công thức pháp lý này, תּוֹרָה chỉ quy định chi phối trường hợp người Na-xi-rê. “Luật lệ” tự nhiên trong tiếng Việt và giữ được sắc thái chuẩn định.
- source_word: הַנָּזִיר
  choice: người Na-xi-rê
  rationale: Đây là thuật ngữ kỹ thuật chỉ người thực hiện lời khấn biệt riêng trong Dân Số 6; phiên âm giúp phân biệt địa vị này với ý niệm biệt riêng nói chung.
- source_word: אֲשֶׁר יִדֹּר
  choice: khi người ấy lập lời khấn
  rationale: Cách diễn đạt này giữ nghĩa động từ נדר và hợp với câu luật lệ tiếng Việt hơn một mệnh đề quan hệ cứng nhắc.
- source_word: קָרְבָּנוֹ לַיהוָה
  choice: lễ vật dâng lên Yahweh
  rationale: קָרְבָּן là lễ vật được đem đến dâng cho Đức Chúa Trời; “dâng lên” thể hiện hướng và sự dâng hiến của ל.
- source_word: עַל נִזְרוֹ
  choice: vì sự biệt riêng của mình
  rationale: נֵזֶר ở đây nói đến tình trạng biệt riêng gắn với lời khấn Na-xi-rê. Bản dịch không đồng nhất hoàn toàn từ này với chính “lời khấn”, nhờ đó giữ được nét nghĩa consecration/separation.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: ngoài ... những gì khả năng mình cho phép
  rationale: Thành ngữ “tay đạt tới” chỉ khả năng hay phương tiện người ấy có. Câu chính truyền đạt nghĩa tự nhiên, còn hình ảnh nguyên văn được bảo tồn trong chú thích.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: đúng theo lời khấn mình đã lập
  rationale: כְּפִי diễn tả sự tương ứng với nội dung lời khấn. Tiếng Việt dùng “đúng theo” để thể hiện nghĩa vụ tuân thủ, đồng thời giữ từ “lời khấn”.
- source_word: כֵּן יַעֲשֶׂה
  choice: người ấy phải làm
  rationale: Công thức này có sức bắt buộc trong văn cảnh luật pháp; “phải làm” diễn đạt rõ lực quy phạm trong tiếng Việt hiện đại.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: phù hợp với luật lệ về sự biệt riêng của người Na-xi-rê
  rationale: Cụm kết nối việc thi hành lời khấn với quy định nền tảng về tình trạng biệt riêng. “Phù hợp với” diễn đạt quan hệ chuẩn định của עַל trong ngữ cảnh.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ ghi trực tiếp danh giao ước יהוה. Dùng “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Quan hệ giữa lời khấn và luật Na-xi-rê
  choice: Lời khấn cụ thể phải được thực hiện phù hợp với luật lệ chung về sự biệt riêng
  alternative: Đồng nhất toàn bộ “lời khấn” với “sự biệt riêng”
  rationale: Câu dùng cả נֶדֶר và נֵזֶר. Bản dịch giữ sự liên hệ nhưng không xóa khác biệt từ vựng giữa điều người ấy khấn và tình trạng biệt riêng do lời khấn ấy.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và mang sắc thái luật lệ nhưng vẫn dễ hiểu trong tiếng Việt hiện đại. Dùng “người ấy” nhất quán, tránh đại từ mang sắc thái cổ. Phiên âm “Na-xi-rê” cho thuật ngữ kỹ thuật, còn נֵזֶר được dịch là “sự biệt riêng” để giữ phân biệt từ vựng.
