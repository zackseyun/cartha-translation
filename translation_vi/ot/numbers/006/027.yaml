  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: vi
  text: Như vậy, họ sẽ đặt danh Ta trên con cái Y-sơ-ra-ên[a][b], và chính Ta sẽ ban phước cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “dân Y-sơ-ra-ên” hoặc “người Y-sơ-ra-ên”. Nguyên văn Hê-bơ-rơ: “các con trai của Y-sơ-ra-ên”.'
    reason: lexical_alternative
  - marker: b
    text: Cách nói “đặt danh Ta trên” có lẽ chỉ việc tuyên xưng danh Ngài trên dân và xác nhận họ thuộc về Ngài.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: Như vậy, họ sẽ đặt
  rationale: Động từ שׂוּם có nghĩa cơ bản là “đặt, để”. “Như vậy” nối câu này với lời chúc phước và chỉ thị ngay trước đó, còn “sẽ đặt” giữ sắc thái hướng tới kết quả của thể động từ Hê-bơ-rơ.
- source_word: אֶת שְׁמִי
  choice: danh Ta
  rationale: Giữ nguyên hình ảnh “danh” vì từ này mang ý nghĩa đại diện và giao ước; không diễn giải hẹp thành “thẩm quyền” hay “phước lành”.
- source_word: עַל
  choice: trên
  rationale: “Trên” phản ánh trực tiếp giới từ עַל và giữ nguyên hình ảnh cụ thể về việc đặt danh Đức Chúa Trời trên dân.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Y-sơ-ra-ên”, nhưng trong ngữ cảnh đây là danh xưng tập thể chỉ toàn dân. “Con cái Y-sơ-ra-ên” vừa gần cấu trúc nguồn vừa tự nhiên và bao quát trong tiếng Việt.
- source_word: וַאֲנִי
  choice: và chính Ta
  rationale: Đại từ độc lập אֲנִי tạo sự nhấn mạnh; “chính Ta” thể hiện lực nhấn ấy mà không thêm nội dung.
- source_word: אֲבָרֲכֵם
  choice: sẽ ban phước cho họ
  rationale: Động từ ברך nghĩa là “ban phước/chúc phước”. Khi chủ thể là Đức Chúa Trời, “ban phước” là cách diễn đạt tự nhiên; “họ” quy chiếu về dân Y-sơ-ra-ên.
theological_decisions:
- issue: Ý nghĩa của việc đặt danh Đức Chúa Trời trên Y-sơ-ra-ên
  choice: Giữ cách nói cụ thể “đặt danh Ta trên” trong chính văn.
  alternative: “kêu cầu danh Ta trên họ” hoặc “đánh dấu họ là dân thuộc về Ta”
  rationale: Thành ngữ có thể bao hàm việc các thầy tế lễ tuyên xưng danh giao ước trên dân, xác nhận họ thuộc về Đức Chúa Trời và chuyển đạt lời chúc phước. Tuy nhiên, chính văn không thu hẹp hình ảnh vào duy nhất một cách giải thích.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: “các con trai của Y-sơ-ra-ên”, “dân Y-sơ-ra-ên” hoặc “người Y-sơ-ra-ên”
  rationale: Nguyên ngữ dùng danh từ giống đực số nhiều nhưng cụm từ hoạt động như danh xưng tập thể của cộng đồng giao ước. “Con cái Y-sơ-ra-ên” bảo tồn thành tố huyết thống mà vẫn truyền đạt tự nhiên rằng toàn dân được nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ta” cho lời Đức Chúa Trời tự xưng, “ban phước” theo cách dùng Kinh Thánh phổ thông. Giữ hình ảnh nguyên ngữ “đặt danh ... trên”, đồng thời dùng “con cái Y-sơ-ra-ên” thay cho bản dịch quá cứng “các con trai của Y-sơ-ra-ên”. Các dấu chú thích đều xuất hiện trong chính văn.
