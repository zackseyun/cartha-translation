  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: vi
  text: Họ phải trải một tấm vải đỏ thắm lên các vật ấy, phủ bàn bằng một tấm phủ bằng da ta-hách[a], rồi đặt các đòn khiêng của bàn vào vị trí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: ta-hách; chưa rõ chính xác đây là loài vật hay loại vật liệu nào. Các cách dịch truyền thống gồm “da lửng”, “da cá heo” hoặc nói chung là “da thuộc tốt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: Họ phải trải trên các vật ấy
  rationale: Diễn đạt hành động trải một lớp phủ lên các vật dụng được nhắc ở câu trước; đại từ số nhiều được làm rõ tự nhiên trong tiếng Việt.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: một tấm vải đỏ thắm
  rationale: בֶּגֶד ở đây là vải dùng để phủ chứ không phải y phục. Cụm màu được dịch là “đỏ thắm”, không thêm “sợi” vì nguyên văn tại đây không nói rõ dạng vật liệu.
- source_word: וְכִסּוּ אֹתוֹ
  choice: phủ lên bàn
  rationale: Hậu tố số ít chỉ chiếc bàn như một toàn thể, khác với số nhiều ở mệnh đề trước. Nêu lại “bàn” giúp giữ sự chuyển đổi số và tránh đại từ mơ hồ trong tiếng Việt.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: một tấm phủ bằng da ta-hách
  rationale: מִכְסֶה là vật phủ; תַּחַשׁ chưa xác định chắc chắn là con vật hay loại vật liệu nào, nên phiên âm để không tạo độ chính xác giả.
- source_word: וְשָׂמוּ אֶת־בַּדָּיו
  choice: rồi lắp các đòn khiêng của bàn vào chỗ
  rationale: בַּדִּים là các đòn dùng để khiêng đồ thánh. “Lắp… vào chỗ” truyền đạt hành động đặt các đòn vào vị trí để vận chuyển; thêm “của bàn” làm rõ sở hữu.
