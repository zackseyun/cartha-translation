  text: וַ/יִּפְקֹ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י הָ/עֵדָ֖ה אֶת בְּנֵ֣י הַ/קְּהָתִ֑י לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: vi
  text: Vậy, Môi-se, A-rôn và các thủ lĩnh của hội chúng kiểm đếm[a] con cháu Kê-hát[b] theo các thị tộc và nhà tổ phụ của họ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đếm”, “lập danh sách” hoặc “thống kê”. Trong những văn cảnh khác, động từ Hê-bơ-rơ này cũng có thể mang nghĩa “bổ nhiệm”, nhưng tại đây nói đến việc kiểm đếm để phục vụ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “các con trai của người Kê-hát”, tức nhóm hậu duệ thuộc dòng Kê-hát.
    reason: lexical_alternative
  - marker: c
    text: “Nhà tổ phụ” là thuật ngữ thân tộc truyền thống của người Y-sơ-ra-ên, chỉ các gia hộ tổ tiên hoặc những phân nhánh gia tộc.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: kiểm đếm
  rationale: Trong văn cảnh cuộc kiểm kê để phục vụ tại Lều Hội Kiến, động từ פקד chỉ việc đếm và ghi nhận người; “kiểm đếm” tự nhiên và chính xác hơn nghĩa “bổ nhiệm” vốn có thể xuất hiện ở văn cảnh khác.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: các thủ lĩnh của hội chúng
  rationale: נְשִׂיאִים là những người lãnh đạo được công nhận trong cộng đồng; “thủ lĩnh” giữ sắc thái chức vị, còn “hội chúng” phù hợp với עֵדָה trong bối cảnh dân Y-sơ-ra-ên nơi hoang mạc.
- source_word: בְּנֵי הַקְּהָתִי
  choice: con cháu Kê-hát
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của người Kê-hát”, nhưng ở đây chỉ nhóm hậu duệ thuộc dòng Kê-hát; “con cháu Kê-hát” truyền đạt tự nhiên ý nghĩa gia hệ mà không giới hạn vào con trai trực tiếp.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc
  rationale: מִשְׁפָּחָה trong ngữ cảnh điều tra dân số và gia phả chỉ một đơn vị thân tộc; “thị tộc” phân biệt đơn vị này với hộ gia đình nhỏ hơn.
- source_word: וּלְבֵית אֲבֹתָם
  choice: và theo từng nhà cha ông
  rationale: בֵית אָבוֹת là thuật ngữ thân tộc truyền thống của Y-sơ-ra-ên. “Nhà cha ông” giữ được cấu trúc và sắc thái phụ hệ của nguyên văn, trong khi chú thích giải nghĩa khái niệm văn hóa này.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se”, “A-rôn”, “Kê-hát” và “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc trong tiếng Việt. Giữ thuật ngữ văn hóa “nhà cha ông” trong chính văn và giải thích bằng chú thích; dùng “thị tộc” để tránh nhập hai cấp độ thân tộc làm một.
