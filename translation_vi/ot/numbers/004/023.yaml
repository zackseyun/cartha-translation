  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקֹ֣ד אוֹתָ֑/ם כָּל הַ/בָּא֙ לִ/צְבֹ֣א צָבָ֔א לַ/עֲבֹ֥ד עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: vi
  text: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi, ngươi phải kiểm đếm họ—tất cả những người đến để làm nhiệm vụ, để làm công việc tại Lều Hội Kiến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đến để thực hiện công tác phục vụ” hoặc “đến để làm nhiệm vụ”; nguyên ngữ dùng cách nói có sắc thái quân vụ để chỉ nhiệm vụ có tổ chức tại Lều Hội Kiến.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi
  rationale: Diễn đạt tự nhiên thành ngữ chỉ độ tuổi trong tiếng Hê-bơ-rơ, đồng thời giữ rõ giới hạn từ ba mươi đến năm mươi tuổi.
- source_word: תִּפְקֹד אֹתָם
  choice: ngươi phải kiểm đếm họ
  rationale: פקד trong ngữ cảnh thống kê có nghĩa là đếm hoặc ghi danh. “Kiểm đếm” vừa dễ hiểu vừa cho thấy đây là việc đếm có tổ chức.
- source_word: כָּל הַבָּא
  choice: tất cả những người vào
  rationale: Phân từ đi với כָּל chỉ toàn thể những người thuộc diện tham gia; “vào” phù hợp với việc họ đến đảm nhiệm phận sự.
- source_word: לִצְבֹא צָבָא
  choice: phục vụ
  rationale: Cấu trúc đồng nguyên từ צבא gợi nhiệm vụ có tổ chức, mang sắc thái quân vụ nhưng ở đây chỉ công tác của người Lê-vi, không phải chiến đấu.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: để làm công việc
  rationale: Cấu trúc động từ và danh từ đồng nguyên nhấn mạnh việc thi hành công tác được giao; cách dịch này tự nhiên trong tiếng Việt và duy trì sự phân biệt với cụm trước.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: “Lều Hội Kiến” là danh xưng trang trọng, quen thuộc cho nơi Đức Chúa Trời gặp dân Ngài; “tại” không quyết định quá mức sắc thái vị trí của giới từ בְּ.
theological_decisions:
- issue: Có nên dịch צבא bằng thuật ngữ quân sự rõ rệt hay không
  choice: Dịch là “phục vụ”, đồng thời chú thích sắc thái nhiệm vụ có tổ chức
  alternative: thi hành quân vụ; làm nhiệm vụ
  rationale: Trong Dân Số Ký 4, đối tượng là người Lê-vi làm công tác tại Lều Hội Kiến chứ không tham chiến. Bản dịch tránh gây hiểu lầm nhưng chú thích vẫn bảo tồn hình ảnh quân vụ của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phản ánh lời phán trực tiếp ở số ít trong mạch văn; dùng “Lều Hội Kiến” như một danh xưng riêng. Dấu gạch ngang giúp cụm “tất cả những người...” bổ nghĩa rõ cho “họ”.
