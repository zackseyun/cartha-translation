revisions:
- from: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi, ngươi phải kiểm đếm họ—tất cả những người vào phục vụ[a], để làm công việc tại Lều Hội Kiến.
  to: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi, ngươi phải kiểm đếm họ—tất cả những người đến để làm nhiệm vụ, để làm công việc tại Lều Hội Kiến.[a]
  rationale: Sửa cụm “vào phục vụ” thành “đến để làm nhiệm vụ” để phản ánh chính xác hơn phân từ “đến” và cấu trúc chỉ nhiệm vụ của nguyên ngữ, đồng thời cải thiện tính tự nhiên. Chuyển mốc chú thích đến cuối câu để chú thích bao quát cụm được giải thích mà không ngắt quãng cú pháp. Không thay đổi ý nghĩa, giới hạn tuổi, hay tính chất không-chiến-đấu của công việc Lê-vi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng khung tuổi, mệnh lệnh kiểm đếm và bối cảnh công việc tại Lều Hội Kiến. Tuy nhiên, “những người vào phục vụ” không tự nhiên và làm mờ cấu trúc כָּל הַבָּא לִצְבֹא צָבָא: những người đến để đảm trách một nhiệm vụ có tổ chức. Bản sửa giữ sắc thái này, đồng thời bảo toàn sự song hành giữa “làm nhiệm vụ” và “làm công việc.”'
  naturalness: “Tất cả những người đến để làm nhiệm vụ” là cách diễn đạt hiện đại, rõ nghĩa và tự nhiên hơn “tất cả những người vào phục vụ.” “Tại Lều Hội Kiến” được giữ như danh xưng quen thuộc và phù hợp văn phong trang trọng.
  terminology: Giữ “ngươi” cho số ít trực tiếp, “kiểm đếm” cho פקד trong ngữ cảnh kiểm kê/đăng bộ, và “Lều Hội Kiến” cho אֹהֶל מוֹעֵד. “Làm nhiệm vụ” diễn tả צבא trong ngữ cảnh phụng vụ mà không áp đặt nghĩa chiến đấu; chú thích nêu sắc thái quân vụ/tổ chức như một khả năng từ vựng.
  issues:
  - severity: medium
    issue: Cụm “tất cả những người vào phục vụ” không tự nhiên và chưa diễn đạt rõ quan hệ mục đích trong כָּל הַבָּא לִצְבֹא צָבָא.
    rationale: הַבָּא là “người đến,” còn לִצְבֹא צָבָא chỉ mục đích/việc được giao. “Đến để làm nhiệm vụ” giữ được cả hai thành tố và đọc tự nhiên trong tiếng Việt.
  revised_text: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi, ngươi phải kiểm đếm họ—tất cả những người đến để làm nhiệm vụ, để làm công việc tại Lều Hội Kiến.[a]
