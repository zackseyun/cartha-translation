revisions:
- from: từ ba mươi tuổi trở lên cho đến năm mươi tuổi, tất cả những người đến[a] để phục vụ[b], làm công việc trong Lều Hội Kiến.
  to: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi, mọi người đến[a] nhận nhiệm vụ phục vụ[b] để làm công việc trong Lều Hội Kiến.
  rationale: Sửa câu để làm rõ rằng những người trong độ tuổi quy định đến/được nhận vào nhiệm vụ phục vụ nhằm thực hiện công việc tại Lều Hội Kiến. Giữ chú thích về độ rộng nghĩa của בָּא và צָבָא, không giải quyết theo hướng giáo phái hay quân sự hóa thuật ngữ.
