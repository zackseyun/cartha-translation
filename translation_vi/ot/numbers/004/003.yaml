base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/003.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: vi
  text: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi, mọi người đến[a] nhận nhiệm vụ phục vụ[b] để làm công việc trong Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “tham gia” hoặc “đến nhận nhiệm vụ.” Phân từ Hê-bơ-rơ có nghĩa cơ bản là “đến/vào,” nhưng trong ngữ cảnh này có thể chỉ việc một người đến để đảm nhận công tác.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ צָבָא có thể chỉ “việc phục vụ,” “nhiệm vụ,” “đội ngũ” hoặc “đạo quân.” Ở đây từ này nói đến việc phục vụ có tổ chức của người Lê-vi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: từ ba mươi tuổi trở lên
  rationale: Thành ngữ בֶּן + số tuổi chỉ độ tuổi; מִן và וָמַעְלָה xác định giới hạn dưới và ý ‘trở lên’. Cách diễn đạt này tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: cho đến năm mươi tuổi
  rationale: Diễn đạt rõ giới hạn trên của khoảng tuổi mà vẫn giữ sát cấu trúc וְעַד.
- source_word: כָּל בָּא
  choice: tất cả những người đến
  rationale: Giữ nghĩa cơ bản và dạng phân từ của בָּא, đồng thời bảo lưu khả năng hiểu là ‘đến’ hoặc ‘tham gia/nhận nhiệm vụ’ theo ngữ cảnh.
- source_word: לַצָּבָא
  choice: để phục vụ
  rationale: Trong Dân Số 4, צָבָא nói đến việc phục vụ có tổ chức của người Lê-vi chứ không phải chiến trận. ‘Phục vụ’ tự nhiên trong tiếng Việt và tránh đưa sắc thái quân sự không cần thiết vào chính văn.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: làm công việc
  rationale: Chuyển tải trực tiếp ý thực hiện công việc được giao; cách nói ngắn gọn, cụ thể và dễ hiểu.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: ‘Lều Hội Kiến’ là cách dịch trang trọng, quen thuộc của אֹהֶל מוֹעֵד; giới từ ‘trong’ phản ánh בְּ.
theological_decisions:
- issue: Sắc thái của צָבָא trong nhiệm vụ của người Lê-vi
  choice: phục vụ
  alternative: đội ngũ; nghĩa vụ; quân ngũ
  rationale: Ngữ cảnh nói về công việc có tổ chức tại Lều Hội Kiến. Chọn ‘phục vụ’ không quân sự hóa nhiệm vụ này, nhưng chú thích vẫn ghi nhận trường nghĩa rộng của từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức độ tuổi của nguyên văn, dùng ‘Lều Hội Kiến’ như một danh xưng, đồng thời đặt chú thích ngay sau các từ liên quan để bảo lưu độ rộng nghĩa của בָּא và צָבָא.
