review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển tải đúng khung tuổi (30–50), ý bao quát của כָּל בָּא, công tác phục vụ có tổ chức của צָבָא, công việc được thực hiện, và địa điểm là Lều Hội Kiến. Tuy nhiên, cụm “đến để phục vụ, làm công việc” đặt hai động từ nối bằng dấu phẩy chưa rõ quan hệ: nguyên văn nói đến người vào/đến nhận công tác phục vụ nhằm làm công việc. Điều chỉnh cú pháp sẽ phản ánh quan hệ này rõ hơn mà không thu hẹp nghĩa của בָּא.'
  naturalness: Câu cần viết hoa đầu câu và cần liên kết tự nhiên hơn giữa “đến”, “phục vụ” và “làm công việc”. “Đến nhận nhiệm vụ phục vụ để làm công việc” là tiếng Việt hiện đại, trang trọng, đồng thời vẫn giữ sự phân biệt của nguyên văn giữa công tác/nhiệm vụ (צָבָא) và công việc (מְלָאכָה).
  terminology: “Lều Hội Kiến” và “người Lê-vi” nhất quán với bản nháp. “Nhiệm vụ phục vụ” diễn đạt được sắc thái công tác có tổ chức của צָבָא mà không áp đặt nghĩa quân sự. Các chú thích được neo trực tiếp vào những từ liên quan.
  issues:
  - severity: low
    issue: Cú pháp “đến để phục vụ, làm công việc” chưa mạch lạc.
    rationale: Dấu phẩy làm quan hệ giữa việc đến/nhận công tác phục vụ và mục đích làm công việc không rõ. Cấu trúc “đến nhận nhiệm vụ phục vụ để làm công việc” diễn đạt chính xác và tự nhiên hơn.
  - severity: low
    issue: Chính văn mở đầu bằng chữ thường.
    rationale: Theo chuẩn trình bày tiếng Việt, câu Kinh Thánh độc lập nên bắt đầu bằng chữ hoa.
