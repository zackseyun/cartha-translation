revisions:
- from: Khi A-rôn và các con trai ông đã phủ xong nơi thánh cùng mọi đồ dùng của nơi thánh, và khi trại quân lên đường, thì sau đó các con trai Kê-hát[c] sẽ đến khiêng chúng. Nhưng họ không được chạm vào các vật thánh[a], kẻo phải chết[b]. Đó là phần phải khiêng của các con trai Kê-hát trong Lều Hội Kiến.
  to: Khi A-rôn và các con trai ông đã phủ xong các vật thánh cùng mọi đồ dùng thánh, vào lúc trại quân lên đường, sau đó các con trai Kê-hát[c] sẽ đến để khiêng chúng. Nhưng họ không được chạm vào các vật thánh[a], kẻo phải chết[b]. Đây là nhiệm vụ khiêng vác của các con trai Kê-hát liên quan đến Lều Hội Kiến.
  rationale: Sửa bản văn chính để phản ánh rõ hơn đối tượng được che phủ và không được chạm đến là các vật thánh trong bối cảnh vận chuyển. Điều chỉnh cú pháp thời gian cho tiếng Việt hiện đại mạch lạc hơn. Câu cuối được đổi sang “nhiệm vụ khiêng vác ... liên quan đến Lều Hội Kiến” để diễn tả מַשָּׂא và phạm vi của בְּאֹהֶל מוֹעֵד mà không gán nghĩa vị trí quá hẹp. Các chú thích giữ nguyên những phương án dịch có cơ sở và neo chú thích hợp lệ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần chỉnh cụm đầu: הַקֹּדֶשׁ trong mạch văn này trước hết chỉ tập hợp các vật thánh được che phủ, không phải chính “nơi thánh”. Bản nháp “phủ xong nơi thánh” có thể gợi ý rằng A-rôn che phủ toàn bộ không gian thánh, không phù hợp với thao tác và mạch văn. Cụm cảnh báo “không được chạm vào các vật thánh, kẻo phải chết” truyền đạt đúng nghĩa cảnh báo của וָמֵתוּ. Câu kết nên diễn đạt בְּאֹהֶל מוֹעֵד theo phạm vi nhiệm vụ liên quan đến Lều Hội Kiến, thay vì dễ hiểu là hành động khiêng diễn ra bên trong lều.'
  naturalness: Câu đã khá tự nhiên và giữ giọng văn trang trọng. Tuy nhiên, “Khi ... và khi ..., thì sau đó” nặng và hơi rối. Tách tiến trình bằng “Khi ... xong, vào lúc trại quân lên đường, sau đó ...” tự nhiên hơn. “Phần phải khiêng ... trong Lều Hội Kiến” cũng chưa rõ quan hệ nghĩa.
  terminology: Giữ “A-rôn”, “Kê-hát”, “các con trai Kê-hát”, “vật thánh” và “Lều Hội Kiến” nhất quán. “Các vật thánh” thích hợp cho הַקֹּדֶשׁ ở cả hai chỗ trong bản văn chính; chú thích bảo lưu cách hiểu rộng hơn là “nơi thánh”. “Nhiệm vụ khiêng vác” diễn tả מַשָּׂא rõ hơn “phần phải khiêng”, nhưng vẫn không loại bỏ khía cạnh gánh/vật phải mang.
  issues:
  - severity: medium
    issue: “đã phủ xong nơi thánh”
    rationale: Cách dịch này coi הַקֹּדֶשׁ là không gian thánh. Trong ngữ cảnh các đồ thánh được A-rôn và các con trai ông bọc phủ trước khi người Kê-hát vận chuyển, nghĩa tập hợp “các vật thánh” phù hợp trực tiếp hơn. Khả năng “nơi thánh” nên nằm ở chú thích, không phải bản văn chính.
  - severity: low
    issue: Cấu trúc thời gian “Khi ... và khi ..., thì sau đó”
    rationale: Không sai nghĩa, nhưng tạo chuỗi mệnh đề nặng trong tiếng Việt. Có thể làm rõ trật tự thủ tục mà vẫn sát nguyên văn.
  - severity: low
    issue: “phần phải khiêng ... trong Lều Hội Kiến”
    rationale: “Trong” có thể khiến độc giả hiểu việc khiêng xảy ra bên trong Lều Hội Kiến. Giới từ בְּ ở đây hợp lý hơn khi diễn đạt phạm vi hoặc nhiệm vụ liên quan đến Lều Hội Kiến.
