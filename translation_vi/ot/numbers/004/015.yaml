  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: vi
  text: Khi A-rôn và các con trai ông đã phủ xong các vật thánh cùng mọi đồ dùng thánh, vào lúc trại quân lên đường, sau đó các con trai Kê-hát[c] sẽ đến để khiêng chúng. Nhưng họ không được chạm vào các vật thánh[a], kẻo phải chết[b]. Đây là nhiệm vụ khiêng vác của các con trai Kê-hát liên quan đến Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nơi thánh”. Từ Hê-bơ-rơ ở đây có thể được hiểu theo nghĩa tập hợp là các vật thánh, hoặc rộng hơn là nơi thánh.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “và họ sẽ chết”. Tiếng Hê-bơ-rơ nêu hậu quả cách trực tiếp.
    reason: lexical_alternative
  - marker: c
    text: Hay “những người Kê-hát”; nguyên văn là “các con trai Kê-hát”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: đã phủ xong
  rationale: Động từ chỉ sự hoàn tất kết hợp với động từ nguyên mẫu diễn tả việc phủ che đã hoàn thành trước khi người Kê-hát đến.
- source_word: הַקֹּדֶשׁ
  choice: nơi thánh
  rationale: Ở lần xuất hiện đầu, từ này chỉ phạm vi thánh đang được A-rôn và các con trai che phủ; “nơi thánh” giữ sắc thái thờ phượng mà không thu hẹp thành một món đồ riêng lẻ.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: mọi đồ dùng của nơi thánh
  rationale: כְּלֵי chỉ các vật dụng, khí cụ hoặc đồ đạc phục vụ nơi thánh; cách dịch này tự nhiên và đủ rộng trong tiếng Việt hiện đại.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: khi trại quân lên đường
  rationale: Cấu trúc nguyên mẫu với giới từ mang nghĩa thời gian; “lên đường” diễn đạt tự nhiên việc cả trại bắt đầu di chuyển.
- source_word: בְנֵי קְהָת
  choice: các con trai Kê-hát
  rationale: Giữ cách nói thân tộc của nguyên văn, đồng thời chú thích cách gọi theo thị tộc là “người Kê-hát”.
- source_word: לָשֵׂאת
  choice: đến khiêng chúng
  rationale: Động từ mang nghĩa mang hoặc khiêng; đại từ “chúng” được bổ sung theo ngữ cảnh, quy chiếu về những vật vừa được phủ.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: nhưng họ không được chạm vào các vật thánh
  rationale: Trong mạch văn vận chuyển các đồ vật đã được che phủ, הַקֹּדֶשׁ được hiểu theo nghĩa tập hợp là những vật thánh; chú thích bảo lưu khả năng hiểu là “nơi thánh”.
- source_word: וָמֵתוּ
  choice: kẻo phải chết
  rationale: Cách dịch này truyền đạt chức năng cảnh báo của hậu quả; chú thích ghi nhận nguyên văn có thể được dịch trực tiếp hơn là “và họ sẽ chết”.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: Đó là phần phải khiêng của các con trai Kê-hát
  rationale: מַשָּׂא vừa có nghĩa vật nặng/gánh nặng vừa chỉ phần việc vận chuyển. “Phần phải khiêng” giữ được cả vật được mang lẫn nhiệm vụ được giao.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Giữ nghĩa trực tiếp của giới từ בְּ và dùng danh xưng trang trọng, dễ hiểu cho אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Đối tượng của הַקֹּדֶשׁ trong lệnh cấm chạm
  choice: các vật thánh
  alternative: nơi thánh
  rationale: Ngữ cảnh gần nói đến các đồ dùng thánh đã được che phủ để người Kê-hát khiêng. Tuy vậy, danh từ số ít có phạm vi nghĩa rộng hơn, nên khả năng chỉ “nơi thánh” được bảo lưu trong chú thích.
- issue: Quan hệ giữa lệnh cấm và cái chết trong וָמֵתוּ
  choice: kẻo phải chết
  alternative: và họ sẽ chết
  rationale: “Kẻo phải chết” diễn đạt tự nhiên lực cảnh báo trong tiếng Việt, còn chú thích giữ cách phát biểu hậu quả trực tiếp của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “phủ” cho thao tác che các vật thánh, “khiêng” cho nhiệm vụ vận chuyển bằng sức người, và viết hoa “Lều Hội Kiến” như một danh xưng. Trật tự các mệnh đề được giữ gần nguyên văn nhưng điều chỉnh nhẹ để câu tiếng Việt tự nhiên.
