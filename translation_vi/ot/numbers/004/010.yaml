base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: vi
  text: Họ phải đặt chân đèn và mọi dụng cụ của nó vào một vỏ bọc bằng da ta-khát[a], rồi đặt nó lên đòn khiêng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ תַּחַשׁ (ta-khát) không rõ nghĩa; có thể chỉ da của một loài vật nào đó hoặc một loại da thuộc bền chắc. Các bản dịch truyền thống đưa ra nhiều cách nhận diện khác nhau, như “da cá heo” hoặc những loại da tương tự.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתָהּ
  choice: chân đèn
  rationale: Đại từ giống cái số ít chỉ về chân đèn ở câu trước; nêu lại danh từ giúp câu tiếng Việt rõ nghĩa mà không thay đổi đối tượng quy chiếu.
- source_word: כָּל כֵּלֶיהָ
  choice: mọi dụng cụ của nó
  rationale: כֵּלִים chỉ các vật dụng hoặc thiết bị đi kèm; “dụng cụ” tự nhiên và phù hợp với ngữ cảnh Đền Tạm.
- source_word: אֶל מִכְסֵה
  choice: vào trong một tấm phủ
  rationale: Sau động từ נתן, אֶל có thể diễn tả việc đặt vật vào trong lớp bọc; cách dịch này thể hiện hành động bao bọc.
- source_word: עוֹר תַּחַשׁ
  choice: da ta-khát
  rationale: Danh tính loài vật hay loại da được gọi là תַּחַשׁ không chắc chắn; phiên âm thuật ngữ thay vì xác quyết một cách nhận diện còn tranh luận.
- source_word: עַל הַמּוֹט
  choice: lên đòn khiêng
  rationale: מּוֹט là đòn hoặc thanh dùng để mang; giữ dạng số ít của tiếng Hê-bơ-rơ và diễn đạt chức năng vận chuyển một cách gọn, tự nhiên.
