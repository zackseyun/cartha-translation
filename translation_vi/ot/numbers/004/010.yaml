  to: Họ phải đặt chân đèn và mọi dụng cụ của nó vào một vỏ bọc bằng da ta-khát[a], rồi đặt nó lên đòn khiêng.
  rationale: Thay “tấm phủ” bằng “vỏ bọc” để phản ánh chính xác và tự nhiên hơn vật bao chứa trong tiếng Việt; thêm “nó” để làm rõ đối tượng của hành động thứ hai. Không thay đổi cách xử lý thận trọng đối với thuật ngữ תַּחַשׁ hay ý nghĩa của câu.
