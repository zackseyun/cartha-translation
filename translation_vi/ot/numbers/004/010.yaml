  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng dễ hiểu. Dùng “phải” để thể hiện chuỗi mệnh lệnh thủ tục; nêu rõ “chân đèn” theo tiền ngữ cảnh để tránh đại từ mơ hồ trong tiếng Việt.
