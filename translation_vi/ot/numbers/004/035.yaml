base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: vi
  text: từ ba mươi tuổi trở lên cho đến năm mươi tuổi, tất cả những người đến phục vụ[a] để làm công việc trong Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến nhận nhiệm vụ”. Từ Hê-bơ-rơ ở đây có thể chỉ nhiệm vụ hoặc sự phục vụ có tổ chức, không nhất thiết là quân đội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: từ ba mươi tuổi trở lên
  rationale: Diễn đạt tự nhiên thành ngữ chỉ điểm bắt đầu của độ tuổi, đồng thời giữ ý “trở lên” của וָמַעְלָה.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: cho đến năm mươi tuổi
  rationale: Giữ rõ giới hạn trên của khoảng tuổi do עַד biểu thị.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: tất cả những người vào đội phục vụ
  rationale: “Vào” phản ánh phân từ của בוא; “đội phục vụ” truyền đạt tính tổ chức của צָבָא trong bối cảnh người Lê-vi mà không khiến người đọc hiểu đây là hoạt động quân sự.
- source_word: לַעֲבֹדָה
  choice: để làm công việc
  rationale: Phân biệt עֲבֹדָה với צָבָא đứng trước và tránh từ ngữ mang sắc thái giáo phái như “mục vụ”.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Giữ giới từ chỉ phạm vi hoạt động và dùng tên gọi trang trọng, quen thuộc cho אֹהֶל מוֹעֵד.
