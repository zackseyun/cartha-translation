  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: vi
  text: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi, tất cả những người vào phục vụ để làm công việc tại Lều Hội Kiến—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: từ ba mươi tuổi trở lên
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ độ tuổi tối thiểu, đồng thời giữ cấu trúc khoảng tuổi.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: cho đến năm mươi tuổi
  rationale: Thể hiện rõ giới hạn trên của khoảng tuổi.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: tất cả những người vào đội ngũ
  rationale: בוא là “vào/đến”, còn צבא ở đây chỉ một lực lượng được tổ chức để thi hành nhiệm vụ Lê-vi; “vào đội ngũ” bảo tồn cả ý gia nhập lẫn sắc thái tổ chức, không biến cụm từ thành nghĩa quân sự thuần túy.
- source_word: לַעֲבֹדָה
  choice: để làm công việc
  rationale: Phân biệt עֲבֹדָה, công việc phục vụ, với צבא, đội ngũ/nhiệm vụ có tổ chức.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: “Lều Hội Kiến” là cách gọi trang trọng, dễ hiểu của địa điểm Đức Chúa Trời gặp dân Ngài; “tại” tự nhiên hơn trong tiếng Việt khi nói về nơi thực hiện toàn bộ công việc liên quan đến lều.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và rõ nghĩa. Câu này tiếp nối cú pháp của câu trước trong ngữ cảnh kiểm kê nên không dùng dấu gạch ngang cuối câu khi đứng riêng. Không thêm chú thích vì bản tiếng Việt có thể bảo tồn trực tiếp nét nghĩa của צבא bằng “đội ngũ”; chú thích [a] của lớp tham khảo tiếng Anh dường như đặt sai vị trí và không cần chuyển sang bản Việt.
