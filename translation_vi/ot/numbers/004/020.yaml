source:
  edition: WLC
  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: vi
  text: Nhưng họ không được vào để nhìn các vật thánh dù chỉ trong chốc lát[a], nếu không họ sẽ chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dù chỉ trong khoảnh khắc.” Cụm từ Hê-bơ-rơ này có tính thành ngữ và có thể nói đến việc chỉ nhìn các vật thánh trong giây lát, hoặc nhìn khi chúng đang được che phủ.'
    reason: Bảo lưu hai khả năng giải nghĩa của cụm từ khó כְבַלַּע.
lexical_decisions:
- source_word: וְלֹא
  choice: Nhưng ... không được
  rationale: Liên từ đi với phủ định tiếp nối chỉ thị bằng một lời nghiêm cấm; “Nhưng” diễn đạt tự nhiên sắc thái chuyển sang lời cảnh báo.
- source_word: יָבֹאוּ
  choice: vào
  rationale: Động từ có nghĩa là đến, đi vào hoặc bước vào; trong ngữ cảnh này, “không được vào” diễn đạt rõ lệnh cấm dành cho người Kê-hát.
- source_word: לִרְאוֹת
  choice: để nhìn
  rationale: Giữ nghĩa trực tiếp của động từ “thấy/nhìn” và phù hợp với lời cấm tiếp xúc bằng thị giác.
- source_word: כְבַלַּע
  choice: dù chỉ trong chốc lát
  rationale: Cụm từ khó và có tính thành ngữ; cách dịch này thể hiện cách hiểu là chỉ một khoảnh khắc, đồng thời chú thích bảo lưu khả năng câu nói đến lúc các vật thánh đang được che phủ.
- source_word: אֶת הַקֹּדֶשׁ
  choice: các vật thánh
  rationale: Danh từ số ít mang nghĩa tập hợp trong ngữ cảnh các đồ dùng thánh của Lều Hội Kiến; “các vật thánh” cụ thể và tự nhiên hơn “nơi thánh” ở đây.
- source_word: וָמֵתוּ
  choice: nếu không họ sẽ chết
  rationale: Diễn đạt hậu quả của việc vi phạm bằng một lời cảnh báo rõ ràng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng được chỉ bởi הַקֹּדֶשׁ
  choice: các vật thánh, tức những đồ dùng thánh vừa được nói đến
  alternative: nơi thánh; vật thánh theo nghĩa số ít hoặc trừu tượng
  rationale: Mạch văn Dân Số 4 nói về việc che phủ và vận chuyển các đồ dùng của Lều Hội Kiến, nên cách hiểu tập hợp phù hợp nhất mà không chuyển nghĩa sang một địa điểm.
- issue: Ý nghĩa của כְבַלַּע
  choice: dù chỉ trong chốc lát
  alternative: khi các vật thánh đang được che phủ
  rationale: Cụm Hê-bơ-rơ có thể chỉ một khoảnh khắc rất ngắn hoặc thời điểm các vật đang được che phủ. Bản văn chính chọn cách diễn đạt thành ngữ tự nhiên, còn chú thích giữ lại cách hiểu theo hành động che phủ.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “các vật thánh” để người đọc phổ thông nhận ra đây là những đồ vật thiêng trong ngữ cảnh, đồng thời tránh thuật ngữ giáo phái.
