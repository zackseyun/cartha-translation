  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Phải” thể hiện sắc thái chỉ thị của dạng động từ trong mạch văn; “dọn tro” giữ hành động nghi lễ cụ thể, còn chú thích bảo tồn phạm vi nghĩa rộng hơn của động từ Hê-bơ-rơ.
