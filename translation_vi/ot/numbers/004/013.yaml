  yaml_path: translation/ot/numbers/004/013.yaml
  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: vi
  text: Rồi họ phải dọn tro khỏi bàn thờ và trải lên đó một tấm vải màu tím[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thanh tẩy bàn thờ” hoặc “dọn lớp tro lẫn mỡ khỏi bàn thờ.” Động từ Hê-bơ-rơ ở đây nói cụ thể đến việc dọn phần tro và cặn còn lại trên bàn thờ trong nghi thức tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: họ phải dọn tro
  rationale: Động từ דשׁן ở thể Piel trong bối cảnh tế lễ chỉ việc dọn lớp tro và cặn của lễ vật khỏi bàn thờ. “Dọn tro” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và không biến hành động cụ thể này thành ý niệm thanh tẩy chung chung.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Cách dịch tiêu chuẩn của מִזְבֵּחַ trong bối cảnh Đền Tạm và việc dâng tế lễ.
- source_word: וּפָרְשׂוּ
  choice: và trải
  rationale: פרשׂ mang nghĩa giăng hoặc trải ra; “trải” phù hợp tự nhiên với việc phủ một tấm vải lên đồ vật.
- source_word: עָלָיו
  choice: lên đó
  rationale: Đại từ chỉ lại bàn thờ; “lên đó” diễn đạt tự nhiên vị trí tấm vải được trải phủ trên bàn thờ.
- source_word: בֶּגֶד
  choice: một tấm vải
  rationale: Dù בגד thường có nghĩa là y phục, ở đây từ này chỉ một vật bằng vải dùng để phủ đồ thánh. “Tấm vải” thể hiện đúng chức năng trong ngữ cảnh.
- source_word: אַרְגָּמָן
  choice: màu tím
  rationale: אַרְגָּמָן chỉ vật liệu được nhuộm màu tím. Vì בגד đã nêu rõ đây là vải, “màu tím” truyền đạt đầy đủ mà không xác định quá mức loại sợi hay chất liệu.
theological_decisions: []
