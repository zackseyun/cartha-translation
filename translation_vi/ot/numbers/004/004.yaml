  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: vi
  text: Đây là phận sự của con cháu Kê-hát trong Lều Hội Kiến, liên quan đến những vật chí thánh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nơi Chí Thánh.” Ở đây, cụm từ này có lẽ chỉ những vật thánh nhất hơn là chỉ riêng gian trong cùng của Đền Tạm.'
    reason: Giữ lại khả năng cụm Hê-bơ-rơ được hiểu theo nghĩa không gian, đồng thời giải thích nghĩa phù hợp hơn với văn cảnh.
lexical_decisions:
- source_word: זֹאת
  choice: Đây là
  rationale: Đại từ chỉ định giống cái số ít mở đầu mệnh đề; tiếng Việt cần thêm “là” để câu tự nhiên.
- source_word: עֲבֹדַת
  choice: phận sự
  rationale: Trong ngữ cảnh này, từ này chỉ công việc thánh được giao. “Phận sự” diễn đạt cả nhiệm vụ lẫn trách nhiệm phụng sự, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּנֵי קְהָת
  choice: con cháu Kê-hát
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Kê-hát”, nhưng ở đây chỉ dòng dõi hay thị tộc Kê-hát; “con cháu” tránh gây hiểu lầm rằng chỉ nói đến con trai trực tiếp.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Giữ tên gọi quen thuộc của nơi Đức Chúa Trời gặp dân Ngài; giới từ được dịch là “trong”, chỉ phạm vi phục vụ.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: những vật chí thánh
  rationale: Trong văn cảnh Dân Số 4, cụm này nhiều khả năng chỉ các đồ vật thánh nhất mà con cháu Kê-hát phải chăm lo và vận chuyển. “Những vật chí thánh” thể hiện nghĩa này mà vẫn giữ sắc thái tuyệt đối của thành ngữ Hê-bơ-rơ.
theological_decisions:
- issue: Đối tượng quy chiếu của קֹדֶשׁ הַקֳּדָשִׁים
  choice: Các vật chí thánh được giao cho con cháu Kê-hát
  alternative: Nơi Chí Thánh, tức gian trong cùng của Đền Tạm
  rationale: Mạch văn kế tiếp nói về việc che phủ, chăm lo và chuyên chở các vật dụng thánh. Tuy vậy, cấu trúc Hê-bơ-rơ cũng có thể dùng làm tên gọi Nơi Chí Thánh, nên cách hiểu không gian được ghi ở chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. “Phận sự” phù hợp với nhiệm vụ phụng sự được giao; “con cháu Kê-hát” tự nhiên hơn lối dịch sát chữ “các con trai của Kê-hát”. Danh xưng “Lều Hội Kiến” được viết hoa như một tên gọi riêng.
