review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc cơ bản của mệnh lệnh phủ định và quan hệ «khỏi giữa/trong số người Lê-vi». Tuy nhiên, «bị diệt» chưa diễn đạt rõ sắc thái gây khiến của Hifil כרת cũng như ý bị loại trừ/tiêu vong khỏi cộng đồng; «bị tuyệt diệt» phù hợp hơn trong chính văn, với lựa chọn «cắt đứt/loại trừ» được giữ ở chú thích.
  naturalness: Cụm «chi tộc gồm các gia tộc» nặng và không phải cách kết hợp tự nhiên nhất trong văn phong Kinh Thánh tiếng Việt hiện đại. «Chi phái các gia tộc Kê-hát» vừa gọn vừa bảo toàn hai cấp độ thuật ngữ trong cụm Hê-bơ-rơ.
  terminology: «Chi phái» cho שֵׁבֶט, «gia tộc» cho מִשְׁפְּחֹת, «Kê-hát» và «người Lê-vi» đều thích hợp. «Khỏi giữa người Lê-vi» diễn đạt trực tiếp מִתּוֹךְ hơn «khỏi hàng».
  issues:
  - severity: medium
    issue: Diễn đạt «chi tộc gồm các gia tộc» thiếu tự nhiên.
    rationale: Cấu trúc này tạo cảm giác giải thích và lặp cấp độ thân tộc. Cụm danh từ «chi phái các gia tộc Kê-hát» sát nguồn hơn và thông dụng trong văn cảnh phả hệ.
  - severity: low
    issue: «Bị diệt khỏi hàng» chưa truyền đạt rõ ý bị cắt đứt/tiêu vong từ trong cộng đồng.
    rationale: כרת ở Hifil có thể chỉ làm cho bị cắt đứt hoặc tiêu diệt. «Bị tuyệt diệt khỏi giữa» rõ quan hệ phân ly và hậu quả nghiêm trọng, nhưng không áp đặt cơ chế.
  revised_text: Đừng khiến chi phái các gia tộc Kê-hát bị tuyệt diệt khỏi giữa người Lê-vi.[a]
