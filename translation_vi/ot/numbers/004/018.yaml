base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/018.yaml
  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: vi
  text: Đừng khiến chi phái các gia tộc Kê-hát bị tuyệt diệt khỏi giữa người Lê-vi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng khiến chi phái các gia tộc Kê-hát bị cắt đứt khỏi giữa người Lê-vi.” Động từ Hê-bơ-rơ có thể mang nghĩa “cắt đứt, loại trừ” hoặc “tiêu diệt”; «gia tộc» cũng có thể dịch là «thị tộc».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Đừng
  rationale: Tiểu từ phủ định dùng trong lời cấm; “Đừng” truyền đạt trực tiếp và tự nhiên sắc thái mệnh lệnh trong tiếng Việt hiện đại.
- source_word: תַּכְרִיתוּ
  choice: khiến... bị diệt
  rationale: 'Dạng Hifil của כרת mang ý gây khiến: làm cho bị cắt khỏi hoặc bị tiêu diệt. Cách dịch này giữ sắc thái gây khiến và phù hợp với nguy cơ tử vong trong văn cảnh, còn phương án sát thành ngữ hơn được ghi ở chú thích.'
- source_word: שֵׁבֶט
  choice: chi tộc
  rationale: Trong ngữ cảnh phả hệ, từ này chỉ một phân nhánh thuộc bộ tộc Lê-vi; “chi tộc” tự nhiên và chính xác hơn “bộ tộc” đối với nhóm Kê-hát.
- source_word: מִשְׁפְּחֹת
  choice: các gia tộc
  rationale: Danh từ số nhiều ở dạng liên kết chỉ các nhóm họ hàng cấu thành chi tộc Kê-hát; “gia tộc” giữ quy mô rộng hơn gia đình hạt nhân.
- source_word: הַקְּהָתִי
  choice: Kê-hát
  rationale: Tính từ/danh xưng tập thể chỉ nhóm hậu duệ Kê-hát; trong cụm “các gia tộc Kê-hát”, tên riêng bổ nghĩa tự nhiên cho toàn nhóm.
- source_word: מִתּוֹךְ
  choice: khỏi hàng
  rationale: Diễn tả việc bị tách ra từ bên trong một cộng đồng lớn hơn; “khỏi hàng” là cách nói tự nhiên, giữ quan hệ nhóm con nằm trong nhóm Lê-vi.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Cách gọi chuẩn, rõ ràng đối với tập thể hậu duệ Lê-vi.
theological_decisions:
- issue: Sức nặng của lệnh cấm liên quan đến số phận các gia tộc Kê-hát
  choice: Cấm làm cho nhóm Kê-hát bị diệt khỏi cộng đồng Lê-vi, nhưng không đưa cơ chế cụ thể vào câu dịch.
  alternative: Cấm loại bỏ hoặc cắt đứt chi tộc Kê-hát khỏi người Lê-vi.
  rationale: Bản thân câu này chỉ nêu lệnh cấm; văn cảnh kế tiếp liên hệ hiểm họa với việc đến gần các vật cực thánh. Bản dịch giữ ý gây khiến và hậu quả nghiêm trọng mà không thêm lời giải thích giáo lý vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chi tộc” cho שֵׁבֶט và “gia tộc” cho מִשְׁפְּחֹת để thể hiện hai cấp độ thân tộc; giữ tên riêng theo lối phiên âm Kê-hát và Lê-vi quen thuộc trong tiếng Việt.
