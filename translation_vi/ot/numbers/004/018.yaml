  to: Đừng khiến chi phái các gia tộc Kê-hát bị tuyệt diệt khỏi giữa người Lê-vi.[a]
  rationale: Bản sửa làm câu gọn và tự nhiên hơn, đồng thời phản ánh rõ hơn quan hệ «từ giữa» trong tiếng Hê-bơ-rơ và vẫn giữ tính mở của động từ כרת qua chú thích. Không thêm cơ chế hoặc lời giải thích thần học từ văn mạch vào chính văn.
