base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; cũng có thể phiên âm là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng wayyiqtol đưa trình thuật tiến sang lời phán tiếp theo; “Rồi” diễn đạt tự nhiên tính kế tiếp, còn “phán” phù hợp với lời Đức Chúa Trời truyền cho người nghe.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: “Với” diễn đạt tự nhiên hai người trực tiếp nhận lời phán; tiếng Việt không cần lặp lại giới từ trước tên thứ hai.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức dẫn nhập lời nói trực tiếp được chuyển thành “rằng:” vì nội dung lời phán bắt đầu ở câu kế tiếp.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” giữ đây là danh riêng và là dạng quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt; chú thích nêu dạng chữ Hê-bơ-rơ và cách phiên âm khác mà không thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn. Giữ nhịp chuyển tiếp của câu Hê-bơ-rơ, đồng thời dùng dấu hai chấm để báo trước lời phán ở câu tiếp theo.
