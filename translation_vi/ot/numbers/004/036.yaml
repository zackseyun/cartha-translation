  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: vi
  text: Số người được kiểm đếm của họ, theo các gia tộc, là hai nghìn bảy trăm năm mươi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Trong mạch tường thuật thống kê, cấu trúc với היה nêu kết quả kiểm đếm; tiếng Việt dùng “là” tự nhiên, không cần dịch riêng liên từ וַ־.
- source_word: פְקֻדֵיהֶם
  choice: số người trong họ được kiểm đếm
  rationale: Danh từ từ פקד trong ngữ cảnh kiểm kê chỉ những người đã được đếm hoặc đăng ký. Cách dịch này giữ sắc thái thụ động-kết quả và không thêm từ “nam giới” vốn không có ngay trong câu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng gia tộc
  rationale: מִשְׁפָּחָה ở đây chỉ đơn vị gia tộc trong cơ cấu bộ tộc Israel; “theo từng gia tộc” vừa rõ nghĩa phân loại vừa tự nhiên trong tiếng Việt.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: hai ngàn bảy trăm năm mươi
  rationale: Diễn đạt đầy đủ và chính xác tổng số 2.750 bằng chữ theo lối tiếng Việt hiện đại.
