  text: their counted men were eight thousand five hundred and eighty[a].
translation:
  language: vi
  text: Số người nam được kiểm kê trong số họ[a] là tám nghìn năm trăm tám mươi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người được kiểm kê của họ” hoặc “những người được ghi danh của họ.” Tiếng Hê-bơ-rơ chỉ những người đã được ghi vào danh sách kiểm kê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Trong câu tổng kết kiểm kê, dạng động từ היה với waw thuật lại đóng vai trò liên kết, giới thiệu tổng số; “là” tự nhiên và sát chức năng cú pháp trong tiếng Việt.
- source_word: פְּקֻדֵיהֶם
  choice: số người nam được kiểm kê trong số họ
  rationale: Danh từ từ פקד trong ngữ cảnh kiểm kê chỉ những người đã được ghi nhận và đếm. “Người nam” phản ánh đúng đối tượng trong văn cảnh Dân Số 4, còn “trong số họ” diễn đạt hậu tố sở hữu mà không khiến câu tiếng Việt tối nghĩa.
- source_word: שְׁמֹנַת אֲלָפִים
  choice: tám ngàn
  rationale: Chuyển trực tiếp cấu trúc số đếm Hê-bơ-rơ sang cách nói thông dụng trong tiếng Việt.
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: năm trăm
  rationale: Giữ đúng thành phần cộng tiếp theo của tổng số.
- source_word: וּשְׁמֹנִים
  choice: tám mươi
  rationale: Giữ đúng thành phần cuối của chuỗi số cộng; tiếng Việt không cần liên từ trước thành phần này.
theological_decisions:
- issue: Thuật ngữ kiểm kê có chỉ giới tính
  choice: số người nam được kiểm kê trong số họ
  alternative: những người được kiểm kê trong số họ; số người được ghi tên của họ
  rationale: Văn cảnh gần của Dân Số 4 nói đến những người nam thuộc độ tuổi phục vụ tại Lều Hội Kiến. Nêu rõ “người nam” phản ánh đối tượng thực tế của cuộc kiểm kê, không biến cách diễn đạt thành trung tính về giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kiểm kê” cho bối cảnh thống kê dân số phục vụ; dùng “tám ngàn” theo cách nói tự nhiên trong tiếng Việt. Dấu chú thích [a] được đặt sau toàn bộ con số vì chú thích giải nghĩa cụm chỉ những người được đếm.
