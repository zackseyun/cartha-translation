  text: וְ/נָתְנ֣וּ עָלָ֗י/ו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּ/פָרְשׂ֧וּ בֶֽגֶד כְּלִ֛יל תְּכֵ֖לֶת מִ/לְ/מָ֑עְלָ/ה וְ/שָׂמ֖וּ בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: vi
  text: Họ phải phủ lên đó một tấm phủ bằng da ta-hách[a], rồi trải bên trên một tấm vải toàn màu xanh lam, và đặt các đòn khiêng vào đúng chỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ תַּחַשׁ (ta-hách) chưa rõ nghĩa; có thể chỉ da của một loài vật cụ thể, từng được dịch là da dê, da cá heo hoặc da bò biển.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Họ phải phủ lên trên đó
  rationale: Trong chuỗi chỉ dẫn nghi lễ, dạng động từ này mang sắc thái mệnh lệnh; “phủ lên trên đó” diễn đạt tự nhiên việc đặt một lớp phủ lên vật đã được nói đến.
- source_word: כְּסוּי עוֹר תַּחַשׁ
  choice: một tấm phủ bằng da ta-hách
  rationale: כְּסוּי là vật dùng để phủ. Vì nghĩa chính xác của תַּחַשׁ chưa chắc chắn, phiên âm tên gọi thay vì xác quyết một loài động vật cụ thể, đồng thời giải thích trong chú thích.
- source_word: וּפָרְשׂוּ בֶגֶד
  choice: rồi trải ... một tấm vải
  rationale: Trong ngữ cảnh này, בֶגֶד là một tấm vải được trải làm lớp phủ chứ không phải y phục; “rồi” làm rõ trình tự thao tác.
- source_word: כְּלִיל תְּכֵלֶת
  choice: hoàn toàn màu xanh lam
  rationale: כְּלִיל nhấn mạnh toàn bộ tấm vải mang màu תְּכֵלֶת. “Xanh lam” là cách gọi rõ ràng, thông dụng, dù sắc màu cổ có thể nằm trong dải xanh lam đến xanh tím.
- source_word: מִלְמָעְלָה
  choice: bên trên
  rationale: Từ này chỉ vị trí ở phía trên cùng trong trình tự xếp các lớp phủ.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: và đặt các đòn khiêng vào đúng chỗ
  rationale: בַּדִּים là các đòn dùng để khiêng. Cụm “vào đúng chỗ” diễn đạt tự nhiên hành động đặt chúng vào vị trí mà không thêm một cách thức cụ thể như luồn hay lắp.
theological_decisions:
- issue: Quan hệ giữa lệnh đặt các đòn khiêng ở đây và lệnh không rút đòn khỏi Hòm trong Xuất Hành 25:15
  choice: dịch trực tiếp là “đặt các đòn khiêng vào đúng chỗ”
  alternative: giải thích rằng họ điều chỉnh, lắp lại hoặc để nguyên các đòn khiêng
  rationale: Câu Hê-bơ-rơ chỉ nói đặt các đòn khiêng, không giải thích cách dung hòa các chỉ dẫn. Bản dịch giữ nguyên sức căng của văn bản thay vì áp đặt một cách giải quyết.
translation_notes:
  register: Văn phong chỉ dẫn nghi lễ trang trọng nhưng hiện đại. Dùng “tấm phủ”, “tấm vải”, “đòn khiêng” là những từ phổ thông, rõ nghĩa; giữ “ta-hách” để không che lấp sự bất định của nguyên ngữ.
