    rationale: Giới từ “lên” và cụm “trên đó” cùng diễn đạt vị trí ở phía trên; “phủ lên đó” tự nhiên hơn mà không giảm độ chính xác.
  - severity: low
    issue: Cách diễn đạt màu sắc “một tấm vải hoàn toàn màu xanh lam” hơi gượng.
    rationale: Tiếng Việt thường dùng “toàn màu...” để nói toàn bộ tấm vải có một màu; cách này truyền đạt כְּלִיל (“hoàn toàn/toàn bộ”) tự nhiên hơn.
