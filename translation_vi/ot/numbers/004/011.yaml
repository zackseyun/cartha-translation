revisions:
- from: Trên bàn thờ bằng vàng, họ phải trải một tấm vải màu xanh, phủ lên đó một tấm phủ bằng da ta-khát[a], rồi xỏ các đòn khiêng vào.
  to: Trên bàn thờ vàng, họ phải trải một tấm vải màu xanh, phủ bàn thờ ấy bằng một tấm phủ bằng da ta-khát[a], rồi đặt các đòn khiêng của nó vào vị trí.
  rationale: Bản sửa làm rõ đối tượng được phủ là bàn thờ, dùng cách gọi tự nhiên hơn cho “golden altar”, và diễn đạt hành động đặt các đòn khiêng trọn ý hơn. Thuật ngữ bất định “ta-khát” và chú thích về sự bất định được giữ nguyên.
  reviewer_model: gpt-5.6-terra
