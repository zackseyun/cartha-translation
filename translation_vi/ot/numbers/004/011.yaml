base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: vi
  text: Trên bàn thờ vàng, họ phải trải một tấm vải màu xanh, phủ bàn thờ ấy bằng một tấm phủ bằng da ta-khát[a], rồi đặt các đòn khiêng của nó vào vị trí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không rõ “ta-khát” chỉ chính xác loài vật nào. Những cách dịch được đề xuất gồm “da thuộc tốt”, “da bò biển” và các loại da bền tương tự.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: bàn thờ bằng vàng
  rationale: Cụm danh từ này chỉ bàn thờ vàng; cách diễn đạt “bằng vàng” tự nhiên trong tiếng Việt và không hàm ý rằng toàn bộ vật thể nhất thiết là vàng đặc.
- source_word: יִפְרְשׂוּ
  choice: họ phải trải
  rationale: Động từ פרשׂ diễn tả việc trải tấm vải ra trên bàn thờ; “phải” truyền đạt tính chất chỉ thị của ngữ cảnh luật lệ.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: một tấm vải màu xanh
  rationale: בֶּגֶד ở đây là vải dùng để phủ, còn תְּכֵלֶת chỉ màu nhuộm xanh đến xanh tím đặc trưng; “màu xanh” rõ ràng mà không xác định quá mức sắc độ cổ đại.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: một tấm phủ bằng da ta-khát
  rationale: מִכְסֶה là vật phủ, עוֹר là da, còn תָּחַשׁ chưa xác định chắc chắn là loài vật nào. Phiên âm thuật ngữ giúp tránh khẳng định võ đoán và chú thích nêu rõ sự bất định.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: rồi xỏ các đòn khiêng vào
  rationale: בַּדִּים là các đòn dùng để khiêng đồ thánh. Trong ngữ cảnh chuẩn bị vận chuyển, “xỏ ... vào” diễn đạt tự nhiên hành động đặt các đòn vào đúng vị trí.
