  to: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi, tất cả những người đến để làm công việc phục vụ và công việc mang vác[a] trong Lều Hội Kiến.
  rationale: Bỏ “tức” để câu tiếng Việt bám sát hơn cấu trúc và quan hệ cú pháp của nguyên văn. Điều chỉnh “lao dịch” thành “lao động” trong chú thích để tránh một hàm ý cưỡng bức không có trong bản văn, đồng thời vẫn bảo tồn ghi chú về sự lặp danh từ trong tiếng Hê-bơ-rơ.
  reviewer_model: gpt-5.6-terra
