base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/047.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: vi
  text: Từ ba mươi tuổi trở lên cho đến năm mươi tuổi, tất cả những người đến để làm công việc phục vụ và công việc mang vác[a] trong Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “công việc lao động và công việc mang gánh nặng.” Tiếng Hê-bơ-rơ lặp các dạng của cùng một danh từ để nhấn mạnh hoặc phân loại công việc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: từ ba mươi tuổi trở lên
  rationale: Thành ngữ này xác định giới hạn tuổi thấp nhất; cách diễn đạt được chọn vừa sát cấu trúc Hê-bơ-rơ vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: cho đến năm mươi tuổi
  rationale: Cụm từ xác định giới hạn tuổi cao nhất và nối tự nhiên với vế trước.
- source_word: כָּל הַבָּא
  choice: tất cả những người đến
  rationale: Giữ sắc thái của phân từ בוא chỉ những người đến để nhận hoặc thực hiện nhiệm vụ, thay vì diễn giải thành 'đủ tư cách' hay 'được chỉ định'.
- source_word: לַעֲבֹד
  choice: để làm
  rationale: Động từ nguyên mẫu nêu mục đích của việc đến. 'Để làm' trực tiếp, tự nhiên và vẫn để các danh từ עֲבֹדָה phía sau mang nội dung chuyên biệt.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: công việc phục vụ
  rationale: Cách dịch giữ được cả ý 'công việc' lẫn 'phục vụ' trong cấu trúc lặp của tiếng Hê-bơ-rơ mà không tạo ra sự lặp gượng gạo trong tiếng Việt.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: và công việc mang vác
  rationale: מַשָּׂא chỉ vật nặng hoặc gánh được mang; 'mang vác' diễn đạt nhiệm vụ cụ thể mà không cần bổ sung một tân ngữ không được nêu rõ trong câu.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: '''Lều Hội Kiến'' là tên gọi rõ ràng, quen thuộc của אֹהֶל מוֹעֵד; ''trong'' phản ánh giới từ בְּ và chỉ phạm vi phục vụ.'
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cấu trúc tuổi tác tự nhiên trong tiếng Việt. Giữ câu như một thành phần tiếp nối văn mạch liệt kê của phân đoạn; không thêm chủ ngữ hay động từ chính vốn không có trong câu Hê-bơ-rơ này.
