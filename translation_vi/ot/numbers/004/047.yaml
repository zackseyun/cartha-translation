    rationale: Câu Hê-bơ-rơ chỉ tiếp nối việc nêu độ tuổi với “tất cả những người đến”; không cần một từ giải thích hay đồng nhất hóa như “tức.”
  - severity: low
    issue: Chú thích dùng “lao dịch.”
    rationale: Từ này trong tiếng Việt hiện đại thường hàm ý lao động khổ sai hoặc cưỡng bức, trong khi từ Hê-bơ-rơ ở đây chỉ công việc/phục vụ.
