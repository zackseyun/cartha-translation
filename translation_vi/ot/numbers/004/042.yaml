  rationale: Chỉnh sửa giới hạn ở cách diễn đạt các đơn vị phả hệ. Bản sửa duy trì “được kiểm đếm,” “con cháu Mê-ra-ri,” trật tự cú pháp, và dấu hai chấm của câu nguyên ngữ, đồng thời dùng “nhà tổ phụ” để truyền đạt chính xác בית אבות.
