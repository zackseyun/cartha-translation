  text: 'And the numbered men of the clans of the sons of Merari, by their clans, by their fathers'' houses:'
translation:
  language: vi
  text: 'Những người được kiểm đếm trong các gia tộc của con cháu Mê-ra-ri, theo các gia tộc của họ, theo nhà tổ phụ của họ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: Những người được kiểm đếm
  rationale: Danh từ dạng bị động từ פקד trong ngữ cảnh kiểm kê dân số chỉ những người đã được ghi nhận qua việc kiểm đếm; cách dịch này giữ sắc thái thụ động và phù hợp với mạch văn.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: các gia tộc của con cháu Mê-ra-ri
  rationale: מִשְׁפְּחֹת là các gia tộc/nhóm họ hàng, còn בְּנֵי có thể chỉ hậu duệ nói chung; “con cháu” tự nhiên và chính xác hơn “các con trai” trong cuộc kiểm kê bộ tộc.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng gia tộc
  rationale: Giới từ לְ ở đây biểu thị cách phân loại; “từng” làm rõ việc kiểm đếm theo các đơn vị gia tộc mà không thêm nội dung mới.
- source_word: לְבֵית אֲבֹתָם
  choice: từng nhà cha ông của họ
  rationale: Giữ hình ảnh xã hội phụ hệ của thành ngữ Hê-bơ-rơ בֵּית אָבוֹת thay vì đồng nhất nó với “gia tộc”; “nhà cha ông” vừa sát nguồn vừa dễ hiểu trong văn phong Kinh Thánh.
