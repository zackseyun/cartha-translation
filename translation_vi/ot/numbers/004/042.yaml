translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Giữ cấu trúc câu chưa hoàn tất với dấu hai chấm vì câu này dẫn sang nội dung kiểm đếm ở câu kế tiếp; không thêm động từ chính vốn không có trong nguyên bản.
