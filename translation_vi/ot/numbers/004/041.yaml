  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: vi
  text: Đây là những người được kiểm kê thuộc các gia tộc của con cháu Ghẹt-sôn, tức tất cả những người phục vụ tại Lều Hội Kiến, mà Môi-se và A-rôn đã kiểm kê theo lệnh của Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Đây là những người được kiểm kê
  rationale: Cụm này mở đầu lời tổng kết cuộc kiểm kê; cách dịch bị động tự nhiên trong tiếng Việt và giữ được nghĩa những người đã được ghi đếm.
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: thuộc các gia tộc của con cháu Ghẹt-sôn
  rationale: “Gia tộc” diễn đạt đơn vị thân tộc trong cơ cấu bộ tộc rõ hơn “gia đình”; “con cháu” bao gồm các hậu duệ, phù hợp ngữ cảnh kiểm kê.
- source_word: כָּל הָעֹבֵד
  choice: tất cả những người phục vụ
  rationale: Phân từ chỉ tập thể những người đảm trách công việc phục vụ; cách diễn đạt này tự nhiên và không thu hẹp loại công việc.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: Giới từ ב có thể chỉ địa điểm hoặc phạm vi phục vụ liên quan đến nơi thánh; “tại” tránh hàm ý rằng mọi công việc đều diễn ra bên trong lều.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: mà Môi-se và A-rôn đã kiểm kê
  rationale: Giữ mệnh đề quan hệ và lặp lại ý của căn פקד, đồng thời xác định rõ hai người thực hiện việc kiểm kê.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Đây là cách diễn đạt tự nhiên cho thành ngữ Hê-bơ-rơ “theo miệng của”, mang nghĩa làm theo mệnh lệnh; danh riêng giao ước được phiên là “Yahweh”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự danh; giữ “Yahweh” bảo tồn chức năng của danh riêng mà không thay bằng một tước hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Lều Hội Kiến” như tên gọi nơi thánh; chọn “gia tộc” cho cơ cấu thân tộc và “tại” để giữ độ rộng nghĩa của giới từ Hê-bơ-rơ.
