  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: vi
  text: 'Đây là phận sự của các gia tộc Ghẹt-sôn: phục vụ và mang vác.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “phục vụ và chuyên chở.”'
    reason: מַשָּׂא có thể chỉ việc mang vác, vật được mang, hoặc gánh nặng; “chuyên chở” là một cách diễn đạt Việt ngữ khả dĩ nhưng khái quát hơn.
lexical_decisions:
- source_word: זֹאת
  choice: Đây là
  rationale: Đại từ chỉ định giống cái số ít mở đầu một mệnh đề danh từ; tiếng Việt tự nhiên cần thêm “là”.
- source_word: עֲבֹדַת
  choice: phận sự
  rationale: עֲבֹדָה có thể chỉ sự phục vụ, công việc hoặc nhiệm vụ; “phận sự” phù hợp ngữ cảnh nhiệm vụ của người Lê-vi và tránh lặp vụng với động từ “phục vụ” ngay sau đó.
- source_word: מִשְׁפְּחֹת
  choice: của các gia tộc
  rationale: Dạng số nhiều liên kết chỉ các nhóm huyết tộc thuộc dòng Ghẹt-sôn; “gia tộc” tự nhiên và chính xác hơn “gia đình” trong ngữ cảnh này.
- source_word: הַגֵּרְשֻׁנִּי
  choice: Ghẹt-sôn
  rationale: Danh xưng tập thể chỉ hậu duệ của Ghẹt-sôn; cấu trúc “các gia tộc Ghẹt-sôn” truyền đạt ý này tự nhiên trong tiếng Việt.
- source_word: לַעֲבֹד
  choice: phục vụ
  rationale: Động từ nguyên mẫu với לְ diễn tả chức năng hay mục đích; sau dấu hai chấm, “phục vụ” nêu trực tiếp nội dung phận sự.
- source_word: וּלְמַשָּׂא
  choice: và chuyên chở
  rationale: מַשָּׂא chỉ vật mang, gánh nặng hoặc việc mang; “chuyên chở” hợp với nhiệm vụ vận chuyển các phần của Đền Tạm nhưng vẫn giữ mức khái quát của nguyên văn.
