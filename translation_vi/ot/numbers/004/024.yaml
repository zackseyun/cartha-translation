  source_fidelity: Bản nháp truyền đạt đúng cấu trúc cơ bản của câu. Tuy nhiên, “chuyên chở” dễ hướng đến hoạt động vận tải nói chung, trong khi מַשָּׂא trực tiếp gợi việc mang/vác một vật mang hay gánh nặng. “Mang vác” sát hơn mà không thêm chi tiết về đối tượng được chở.
  naturalness: “Đây là phận sự của các gia tộc Ghẹt-sôn” tự nhiên trong văn phong Kinh Thánh hiện đại. Cặp động từ “phục vụ và mang vác” rõ, song song, và phù hợp ngữ cảnh.
  terminology: Giữ “phận sự,” “gia tộc,” và tên “Ghẹt-sôn.” Đổi thuật ngữ cuối để phản ánh tốt hơn trường nghĩa của מַשָּׂא. Chú thích được điều chỉnh thành phương án diễn đạt thay thế thực sự, thay vì lặp lại cách dịch chính.
  issues:
