translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “phận sự” để diễn đạt nhiệm vụ Lê-vi, đồng thời giữ hai chức năng song song “phục vụ và chuyên chở”. Dấu chân trang [a] xuất hiện trong chính văn.
