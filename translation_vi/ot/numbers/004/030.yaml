  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: vi
  text: Hãy kiểm kê, từ ba mươi tuổi trở lên cho đến năm mươi tuổi, tất cả những người vào làm nhiệm vụ[a] để thực hiện công việc tại Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến để phục dịch.” Từ Hê-bơ-rơ được dùng ở đây có thể chỉ một đoàn ngũ có tổ chức hoặc nhiệm vụ được phân công; trong ngữ cảnh này, nó nói đến việc phục vụ của người Lê-vi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: từ ba mươi tuổi trở lên
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ ngưỡng tuổi, đồng thời giữ rõ điểm bắt đầu là ba mươi tuổi.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: cho đến năm mươi tuổi
  rationale: Thể hiện rõ giới hạn trên của khoảng tuổi mà không thêm cách hiểu về tính bao gồm ngoài điều câu văn tự nhiên hàm ý.
- source_word: תִּפְקְדֵם
  choice: Hãy kiểm kê họ
  rationale: Trong bối cảnh điều tra dân số và phân công người Lê-vi, động từ פקד chỉ việc đếm và ghi nhận những người đủ điều kiện; “kiểm kê” bao hàm cả hai sắc thái.
- source_word: כָּל הַבָּא
  choice: tất cả những người vào
  rationale: Giữ ý phân phối của כָּל cùng động tính từ số ít, nhưng chuyển sang cấu trúc số nhiều tự nhiên trong tiếng Việt.
- source_word: לַצָּבָא
  choice: đội ngũ phục vụ
  rationale: צָבָא có thể chỉ đạo quân, đoàn ngũ hoặc nhiệm vụ có tổ chức. Ở đây, cụm từ nói về lực lượng người Lê-vi được tổ chức để phục vụ, không phải tham chiến; “đội ngũ phục vụ” giữ được cả sắc thái tập thể có tổ chức lẫn chức năng.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: để làm công việc
  rationale: Tránh lối lặp gượng “phục vụ sự phục vụ”, nhưng vẫn thể hiện động tác thực hiện nhiệm vụ được giao.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Tên gọi truyền thống, dễ nhận biết của nơi thánh; “hội kiến” diễn đạt chức năng là nơi gặp gỡ theo ngữ cảnh Ngũ Kinh.
theological_decisions:
- issue: Sắc thái quân sự hoặc tổ chức của לַצָּבָא
  choice: đội ngũ phục vụ
  alternative: việc phục vụ; quân ngũ; nhiệm vụ
  rationale: Ngữ cảnh nói đến công việc của người Lê-vi tại Lều Hội Kiến chứ không phải chiến đấu. Cách dịch này không áp đặt hình ảnh quân sự, nhưng vẫn giữ sắc thái một lực lượng được tổ chức và phân công vốn có thể hiện diện trong צָבָא.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “kiểm kê” thay cho “đếm” để phù hợp bối cảnh ghi nhận người đủ điều kiện phục vụ; viết hoa “Lều Hội Kiến” như một danh xưng đã được xác định. Dấu gạch ngang làm rõ rằng mệnh đề sau giải thích đối tượng phải kiểm kê.
