revisions:
- from: Hãy kiểm kê họ, từ ba mươi tuổi trở lên cho đến năm mươi tuổi—tất cả những người vào đội ngũ phục vụ[a] để làm công việc tại Lều Hội Kiến.
  to: Hãy kiểm kê, từ ba mươi tuổi trở lên cho đến năm mươi tuổi, tất cả những người vào làm nhiệm vụ[a] để thực hiện công việc tại Lều Hội Kiến.
  rationale: 'Bản sửa giữ nguyên trật tự và nội dung chính của tiếng Hê-bơ-rơ: giới hạn tuổi, việc kiểm kê mọi người hội đủ điều kiện, việc vào thực hiện nhiệm vụ, và công việc tại Lều Hội Kiến. Cách diễn đạt mới tránh xác định quá mức צָבָא là một “đội ngũ,” nhưng chú thích vẫn lưu ý sắc thái tổ chức của từ này.'
