source:
  edition: WLC
  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: vi
  text: Khi trại quân lên đường, A-rôn cùng các con trai ông sẽ đến, hạ bức màn ngăn xuống và dùng màn ấy phủ Hòm Chứng Ngôn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách gọi quen thuộc hơn: “Hòm Giao Ước.” Tuy nhiên, từ Hê-bơ-rơ ở đây là “chứng ngôn,” không phải “giao ước.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: sẽ đến
  rationale: Động từ ở dạng số ít nhưng đi với chủ ngữ kép “A-rôn cùng các con trai ông” và các động từ số nhiều theo sau; trong ngữ cảnh chỉ thị về tương lai, “sẽ đến” diễn đạt tự nhiên mà không thêm địa điểm vốn không được nêu rõ trong câu.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: Khi trại quân lên đường
  rationale: Cấu trúc nguyên mẫu với בְּ chỉ hoàn cảnh thời gian; “lên đường” diễn đạt tự nhiên việc trại quân bắt đầu di chuyển.
- source_word: וְהוֹרִדוּ
  choice: hạ ... xuống
  rationale: Trong bối cảnh tháo dỡ và chuẩn bị vận chuyển Đền Tạm, cách dịch này giữ được ý đưa bức màn từ vị trí đang treo xuống.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: bức màn ngăn
  rationale: פָּרֹכֶת là bức màn bên trong nơi thánh, còn הַמָּסָךְ nhấn mạnh chức năng che/ngăn; “bức màn ngăn” vừa tự nhiên trong tiếng Việt vừa giữ được tính chuyên biệt của vật này.
- source_word: וְכִסּוּ בָהּ
  choice: và dùng màn ấy phủ
  rationale: כסה có nghĩa là “phủ, che”; đại từ giống cái בָהּ quy chiếu về bức màn và mang nghĩa phương tiện, được thể hiện rõ bằng “dùng màn ấy”.
- source_word: אֲרֹן הָעֵדֻת
  choice: Hòm Chứng Ngôn
  rationale: Danh từ עֵדוּת có nghĩa là “chứng ngôn/lời chứng”, không phải בְּרִית (“giao ước”); cách dịch này ưu tiên từ ngữ thực sự có trong bản Hê-bơ-rơ và tránh đồng nhất hai thuật ngữ.
theological_decisions:
- issue: Cách gọi אֲרֹן הָעֵדֻת theo truyền thống
  choice: Hòm Chứng Ngôn
  alternative: Hòm Giao Ước
  rationale: Nguyên văn dùng עֵדוּת (“chứng ngôn, lời chứng”), nên bản dịch giữ thuật ngữ này thay vì thay bằng cách gọi truyền thống có từ “giao ước”. Chú thích cung cấp cách gọi quen thuộc mà không làm lu mờ từ ngữ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trại quân” cho cộng đồng đang đóng trại, “bức màn ngăn” cho vật dụng thánh có chức năng phân cách, và viết hoa “Hòm Chứng Ngôn” như tên gọi chuyên biệt.
