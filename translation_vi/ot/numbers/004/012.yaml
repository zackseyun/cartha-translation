  text: וְ/לָקְחוּ֩ אֶת כָּל כְּלֵ֨י הַ/שָּׁרֵ֜ת אֲשֶׁ֧ר יְשָֽׁרְתוּ בָ֣/ם בַּ/קֹּ֗דֶשׁ וְ/נָֽתְנוּ֙ אֶל בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אוֹתָ֔/ם בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: vi
  text: Rồi họ phải lấy mọi dụng cụ dùng để phụng sự trong nơi thánh, đặt chúng trong một tấm vải xanh, bọc chúng bằng một tấm phủ da ta-khát[a], rồi đặt chúng lên đòn khiêng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ תָּחַשׁ (ta-khát) chưa xác định chắc chắn; có thể chỉ da của một loài vật cụ thể hoặc một loại da thuộc tốt hay bền.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “đặt chúng lên khung khiêng.” Nguyên ngữ dùng danh từ số ít, nghĩa là “đòn/thanh,” nhưng từ này có thể đại diện cho cả bộ phận dùng để khiêng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Rồi họ phải lấy
  rationale: Diễn đạt chuỗi chỉ dẫn nghi lễ do liên từ וְ và động từ ở dạng chỉ thị theo trình tự; “phải” tự nhiên trong văn cảnh mệnh lệnh.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: mọi dụng cụ phục vụ
  rationale: כְּלִי chỉ các vật dụng hay khí cụ; הַשָּׁרֵת nêu chức năng phục vụ trong nghi lễ. Cách dịch này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: mà họ dùng để phụng sự
  rationale: Giữ cả ý phương tiện của בָם (“dùng chúng”) lẫn sắc thái phục vụ thánh của שרת.
- source_word: בַּקֹּדֶשׁ
  choice: trong nơi thánh
  rationale: קֹדֶשׁ theo nghĩa đen là nơi/vùng thánh; bản dịch không thu hẹp câu này thành một gian cụ thể của Đền Tạm.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: một tấm vải xanh
  rationale: Trong văn cảnh đóng gói, בֶּגֶד là tấm vải hơn là y phục; תְּכֵלֶת chỉ màu xanh đặc trưng của hàng dệt dùng trong Đền Tạm.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: một tấm phủ bằng da ta-hát
  rationale: Danh tính loài תָּחַשׁ không chắc chắn. Phiên âm trong chính văn tránh khẳng định một loài vật hoặc phẩm chất da mà nguyên ngữ không xác định chắc chắn; chú thích giải thích cho độc giả.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: rồi đặt tất cả lên đòn khiêng
  rationale: מוֹט ở số ít có nghĩa là đòn hoặc thanh dùng để khiêng. “Tất cả” làm rõ đối tượng là các dụng cụ đã được bọc mà không biến số ít của danh từ thành một khung nhiều thanh.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại. Dùng “phụng sự” để thể hiện việc phục vụ trong nơi thánh; tránh thuật ngữ riêng của bất kỳ hệ phái nào. Các dấu chú thích [a], [b] được đặt ngay sau những từ ngữ có vấn đề từ vựng tương ứng.
