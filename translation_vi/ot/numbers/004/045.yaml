source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: vi
  text: Đây là những người đã được kiểm đếm thuộc các gia tộc của con cháu Mê-ra-ri. Môi-se và A-rôn đã kiểm đếm họ theo lệnh của Yahweh[a], được truyền qua Môi-se[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “theo miệng Yahweh,” nghĩa là “theo lệnh của Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “bởi tay Môi-se,” nghĩa là “qua Môi-se.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Đây là số người được kiểm đếm
  rationale: Diễn đạt tự nhiên một câu tổng kết kiểm kê, đồng thời giữ nghĩa của פְקוּדֵי là những người đã được ghi nhận trong cuộc kiểm đếm.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: thuộc các gia tộc con cháu Mê-ra-ri
  rationale: Giữ cả ý nghĩa đơn vị họ tộc của מִשְׁפְּחֹת lẫn cách gọi theo quan hệ huyết thống trong בְּנֵי מְרָרִי.
- source_word: פָּקַד
  choice: đã kiểm đếm
  rationale: Phù hợp bối cảnh thống kê người Lê-vi và tạo sự nhất quán với פְקוּדֵי ở đầu câu.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa là làm theo mệnh lệnh của Yahweh; bản dịch chính ưu tiên tiếng Việt tự nhiên, còn chú thích bảo lưu hình ảnh nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: בְּיַד מֹשֶׁה
  choice: được truyền qua Môi-se
  rationale: Trong ngữ cảnh này, thành ngữ 'bởi tay Môi-se' chỉ vai trò trung gian của Môi-se trong việc truyền mệnh lệnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה; phiên âm 'Yahweh' giữ rõ đây là danh riêng mà không thêm cách hiểu hệ phái.
- issue: Mối quan hệ giữa mệnh lệnh của Yahweh và vai trò của Môi-se
  choice: theo lệnh của Yahweh, được truyền qua Môi-se
  alternative: theo miệng Yahweh, bởi tay Môi-se
  rationale: Cách dịch này giữ Yahweh là nguồn ban lệnh và Môi-se là người trung gian truyền đạt, đồng thời không biến Môi-se thành nguồn gốc của mệnh lệnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “gia tộc” cho đơn vị họ tộc, “kiểm đếm” cho ngữ cảnh thống kê, và giữ danh riêng “Yahweh.” Tách thành hai câu để tránh cấu trúc quan hệ nặng nề trong tiếng Việt nhưng không làm thay đổi nội dung.
