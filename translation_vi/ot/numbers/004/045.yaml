  source_fidelity: 'Bản nháp chuyển đạt đúng ý chính của câu: các người thuộc những gia tộc của con cháu Mê-ra-ri đã được kiểm đếm; Môi-se và A-rôn thực hiện việc này theo mệnh lệnh của Yahweh, với Môi-se là trung gian. Tuy nhiên, “số người” có thể được hiểu là một con số tổng cộng, trong khi פְּקוּדֵי ở đây chỉ những người đã được kiểm đếm/đăng ký.'
