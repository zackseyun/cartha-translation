  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: vi
  text: Đây là công việc phục vụ của các gia tộc con cháu Ghẹt-sôn tại Lều Hội Kiến; trách nhiệm của họ được đặt dưới sự giám sát của Y-tha-ma, con trai của A-rôn, thầy tế lễ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Đây là công việc phục vụ
  rationale: Cụm này giới thiệu phần việc được giao. “Công việc phục vụ” diễn đạt rõ lao tác phụng sự trong bối cảnh Lều Hội Kiến mà không đưa thêm sắc thái giáo phái.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: các gia tộc con cháu Ghẹt-sôn
  rationale: “Gia tộc” phù hợp đơn vị thân tộc trong ngữ cảnh bộ tộc; “con cháu Ghẹt-sôn” chuyển tải tự nhiên ý niệm dòng dõi của cấu trúc Hê-bơ-rơ.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: Giới từ בְּ ở đây có thể chỉ phạm vi hoặc địa điểm thi hành công việc; “tại” tự nhiên hơn trong tiếng Việt và không giới hạn công việc vào bên trong lều.
- source_word: וּמִשְׁמַרְתָּם
  choice: trách nhiệm của họ
  rationale: מִשְׁמֶרֶת chỉ phận sự hay nhiệm vụ được giao; “trách nhiệm” rõ ràng, hiện đại và phù hợp ngữ cảnh hành chính-thờ phượng.
- source_word: בְּיַד
  choice: được đặt dưới sự giám sát của
  rationale: Thành ngữ nghĩa đen là “trong/dưới tay,” nhưng trong ngữ cảnh này chỉ sự quản lý hoặc thẩm quyền. Cách dịch này truyền đạt trực tiếp ý nghĩa trong tiếng Việt tự nhiên.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Y-tha-ma, con trai thầy tế lễ A-rôn
  rationale: Giữ quan hệ phụ tử và hiểu הַכֹּהֵן là danh xưng bổ nghĩa cho A-rôn, cách hiểu tự nhiên nhất của trật tự cú pháp Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Dùng “Lều Hội Kiến” làm thuật ngữ nhất quán cho אֹהֶל מוֹעֵד; tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
