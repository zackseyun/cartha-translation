base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: vi
  text: Họ phải mang các tấm màn của Đền Tạm, Lều Hội Kiến cùng tấm phủ của nó, tấm phủ ta-khát ở phía trên nó, và bức màn che lối vào Lều Hội Kiến,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Họ phải mang
  rationale: Trong ngữ cảnh vận chuyển các bộ phận thánh sở, נשׂא chỉ việc mang hoặc chuyên chở; cách diễn đạt này tự nhiên và giữ sắc thái mệnh lệnh về nhiệm vụ.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: các tấm màn của Đền Tạm
  rationale: יְרִיעֹת là các tấm vải lớn cấu thành nơi thánh; “các tấm màn” chính xác hơn một danh từ số ít. “Đền Tạm” là cách gọi trang trọng, dễ hiểu cho מִשְׁכָּן.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Giữ cả hình thức vật chất là “lều” và chức năng là nơi gặp gỡ; đây là thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: מִכְסֵהוּ
  choice: tấm phủ của lều
  rationale: Hậu tố số ít giống đực nhiều khả năng quy chiếu về אֹהֶל, tức Lều Hội Kiến; diễn đạt rõ sở chỉ mà không xác định quá mức loại vật liệu.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: tấm phủ bằng da ta-khát
  rationale: Danh từ תַּחַשׁ có nghĩa chính xác chưa chắc chắn. Phiên âm bảo toàn sự bất định của nguồn Hê-bơ-rơ, thay vì đoán một loài vật hoặc phẩm cấp da.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: ở phía trên
  rationale: Diễn đạt tự nhiên vị trí lớp phủ nằm trên cùng; quan hệ với Lều Hội Kiến đã rõ trong chuỗi danh từ trước đó.
- source_word: מָסַךְ פֶּתַח
  choice: bức màn che lối vào
  rationale: מָסַךְ là tấm vải có chức năng che chắn; “bức màn che lối vào” truyền đạt tự nhiên cả vật thể lẫn chức năng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Viết hoa “Đền Tạm” và “Lều Hội Kiến” như các danh xưng ổn định của thánh sở. Câu giữ dấu phẩy cuối vì đây là một phần của danh sách tiếp nối sang câu sau.
