base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: vi
  text: Số người được kiểm đếm trong số họ[a], theo các thị tộc và theo nhà tổ phụ của họ, là hai ngàn sáu trăm ba mươi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người được đăng ký trong số họ”, “những người được kiểm kê trong số họ”, hoặc “số người được kiểm đếm của họ”. Từ Hê-bơ-rơ nói đến những người được ghi danh trong cuộc kiểm kê dân số.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Trong công thức thống kê dân số này, động từ היה làm hệ từ, nối số người được kiểm đếm với tổng số.
- source_word: פְּקֻדֵיהֶם
  choice: số người trong họ đã được kiểm đếm
  rationale: Danh từ từ פקד chỉ những người đã được đăng ký và đếm trong cuộc kiểm kê; cách dịch này giữ sắc thái bị động và mối liên hệ với nhóm vừa được nhắc đến.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo các thị tộc
  rationale: Trong ngữ cảnh kiểm kê của Israel, מִשְׁפָּחָה chỉ một đơn vị thân tộc nhỏ hơn bộ tộc; “thị tộc” vừa chính xác vừa phân biệt với gia đình hạt nhân.
- source_word: לְבֵית אֲבֹתָם
  choice: theo các gia tộc phụ hệ
  rationale: Cụm từ chỉ đơn vị dòng họ được tổ chức theo nhà tổ phụ. “Gia tộc phụ hệ” diễn đạt tự nhiên hơn lối dịch sát chữ “nhà của các cha” mà vẫn giữ cấu trúc xã hội trong nguyên văn.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: hai ngàn sáu trăm ba mươi
  rationale: Chuyển trực tiếp chuỗi số đếm sang cách nói tiếng Việt hiện đại, rõ ràng.
