  register: Văn phong trang trọng nhưng hiện đại. Dùng “thị tộc” và “gia tộc phụ hệ” để thể hiện hai cấp đơn vị thân tộc khác nhau; thêm “người” sau tổng số cho tự nhiên và rõ nghĩa trong tiếng Việt.
