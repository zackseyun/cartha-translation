base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: vi
  text: Rồi họ phải lấy một tấm vải màu xanh lam[a] và phủ chân đèn dùng để chiếu sáng, cùng với các ngọn đèn, kẹp gắp, khay đựng than lửa và mọi vật dụng dùng cho dầu của nó; họ dùng những vật ấy để phục vụ chân đèn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vải xanh pha tím.” Từ Hê-bơ-rơ תְּכֵלֶת chỉ loại vải nhuộm màu đặc trưng được dùng cho các vật dụng trong Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: một tấm vải màu xanh lam
  rationale: בֶּגֶד trong ngữ cảnh vận chuyển đồ đạc Đền Tạm chỉ một tấm vải hơn là y phục. תְּכֵלֶת là loại vải nhuộm xanh đặc trưng dùng trong nơi thánh; “xanh lam” là cách diễn đạt tự nhiên, còn sắc xanh pha tím được ghi ở chú thích.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: chân đèn dùng để chiếu sáng
  rationale: מְנוֹרָה là chân đèn; הַמָּאוֹר chỉ ánh sáng hoặc sự chiếu sáng. Cách dịch theo chức năng này tự nhiên trong tiếng Việt mà không biến chân đèn thành chính nguồn sáng theo nghĩa trừu tượng.
- source_word: נֵרֹתֶיהָ
  choice: các ngọn đèn
  rationale: נֵר có thể chỉ đèn hoặc ngọn lửa đèn. Ở đây cụm từ nói đến các bộ phận phát sáng gắn với chân đèn; “các ngọn đèn” rõ ràng và thông dụng.
- source_word: מַלְקָחֶיהָ
  choice: kẹp gắp
  rationale: Từ này chỉ dụng cụ dạng kẹp dùng khi chăm sóc tim hoặc ngọn đèn. “Kẹp gắp” giữ nghĩa khái quát, không xác quyết quá mức về chức năng cụ thể.
- source_word: מַחְתֹּתֶיהָ
  choice: khay đựng than lửa
  rationale: מַחְתָּה có thể là khay đựng lửa hoặc lư hương. Trong ngữ cảnh chân đèn, dụng cụ để nhận than, tro hay phần cháy khi sửa đèn phù hợp hơn nghĩa lư hương.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: tất cả các dụng cụ đựng dầu
  rationale: כְּלִים là các đồ dùng hoặc bình chứa, còn שַׁמְנָהּ là dầu thuộc về chân đèn. “Dụng cụ đựng dầu” vừa tự nhiên vừa đủ rộng để không giới hạn vào một loại bình cụ thể.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: mà họ dùng để phục vụ chân đèn
  rationale: שׁרת mang sắc thái phục vụ trong nghi lễ; לָהּ quy về chân đèn và בָּהֶם chỉ các dụng cụ làm phương tiện. Câu tiếng Việt diễn đạt rõ cả đối tượng được phục vụ lẫn chức năng của các dụng cụ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng các thuật ngữ cụ thể và dễ hiểu. “Phục vụ chân đèn” giữ sắc thái phụng sự nghi lễ của động từ Hê-bơ-rơ; “chăm sóc chân đèn” tự nhiên hơn nhưng làm nhẹ sắc thái ấy.
