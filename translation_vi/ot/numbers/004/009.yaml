- from: Rồi họ phải lấy một tấm vải màu xanh lam[a] phủ lên chân đèn dùng để chiếu sáng, cùng với các ngọn đèn, kẹp gắp, khay đựng than lửa và tất cả các dụng cụ đựng dầu mà họ dùng để phục vụ chân đèn.
  to: Rồi họ phải lấy một tấm vải màu xanh lam[a] và phủ chân đèn dùng để chiếu sáng, cùng với các ngọn đèn, kẹp gắp, khay đựng than lửa và mọi vật dụng dùng cho dầu của nó; họ dùng những vật ấy để phục vụ chân đèn.
