  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: vi
  text: 'Rồi họ phải đặt trên bàn thờ tất cả các dụng cụ dùng để phục vụ tại đó: các khay đựng than lửa, các chĩa, các xẻng và các chậu—tức mọi dụng cụ của bàn thờ. Sau đó, họ phải trải lên bàn thờ một tấm phủ bằng da[a] và lắp các đòn khiêng vào vị trí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ con vật hoặc loại da này (taḥash) chưa xác định được chắc chắn. Cũng có thể dịch là “một tấm phủ bằng da dê”, “một tấm phủ bằng da cá heo”, hoặc khái quát hơn là “một tấm phủ bằng da bền chắc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Rồi họ phải đặt trên bàn thờ
  rationale: Diễn đạt tự nhiên chuỗi chỉ dẫn nghi lễ; nói rõ đối tượng quy chiếu của đại từ là bàn thờ để tránh mơ hồ trong tiếng Việt.
- source_word: כָּל כֵּלָיו
  choice: tất cả các dụng cụ
  rationale: כְּלִי là từ rộng chỉ vật dụng hoặc khí cụ; “dụng cụ” rõ ràng, hiện đại và phù hợp ngữ cảnh phục vụ bàn thờ.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: dùng để phục vụ tại đó
  rationale: Giữ sắc thái phục vụ trong nghi lễ của שרת, đồng thời tránh lối diễn đạt nặng nề nếu sao chép từng giới từ Hê-bơ-rơ.
- source_word: הַמַּחְתֹּת
  choice: các khay đựng than lửa
  rationale: מַחְתָּה là dụng cụ dùng để chứa hoặc chuyển than lửa; cách dịch này cụ thể hơn “lư hương”, vốn có thể hàm ý chuyên dùng cho hương.
- source_word: הַמִּזְלָגֹת
  choice: các chĩa
  rationale: Chỉ những dụng cụ có ngạnh dùng trong việc tế lễ; “chĩa” tự nhiên và ít mang sắc thái gia dụng hơn “nĩa”.
- source_word: הַיָּעִים
  choice: các xẻng
  rationale: Đây là dụng cụ xúc, thường dùng để xử lý tro tại bàn thờ.
- source_word: הַמִּזְרָקֹת
  choice: các chậu
  rationale: Chỉ các vật chứa dùng trong nghi lễ, có thể đựng chất lỏng hoặc máu; “chậu” truyền đạt hình dạng và công dụng rộng mà không thu hẹp quá mức.
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: tức mọi dụng cụ của bàn thờ
  rationale: Giữ chức năng tổng kết của cụm từ và thêm “tức” để mối quan hệ đồng vị được rõ ràng trong tiếng Việt.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: Sau đó, họ phải trải lên trên một tấm phủ
  rationale: Giữ riêng ý nghĩa “trải” của פרשׂ và danh từ “tấm phủ” của כְּסוּי, đồng thời thể hiện trình tự chỉ dẫn.
- source_word: עוֹר תַּחַשׁ
  choice: bằng da tốt[a]
  rationale: Danh tính loài vật được gọi là תַּחַשׁ không chắc chắn. “Da tốt” truyền đạt một vật liệu da thích hợp làm lớp bảo vệ mà không khẳng định một nhận dạng động vật còn tranh luận; các khả năng khác được nêu trong chú thích.
- source_word: וְשָׂמוּ בַדָּיו
  choice: và lắp các đòn khiêng vào
  rationale: Trong ngữ cảnh chuẩn bị vận chuyển, שׂים diễn tả việc đặt các đòn vào đúng vị trí; “lắp… vào” tự nhiên và chính xác hơn dịch máy móc là “đặt”.
