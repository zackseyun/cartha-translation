  text: Số người của họ được kiểm kê theo các gia tộc là ba ngàn hai trăm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Trong công thức tổng kết kiểm kê, động từ היה nối tiếp mạch thuật sự và nêu tổng số; tiếng Việt tự nhiên dùng “là” mà không cần dịch riêng liên từ וַ־.
- source_word: פְקֻדֵיהֶם
  choice: số người trong họ được kiểm kê
  rationale: Trong bối cảnh kiểm kê dân số, từ phái sinh của פקד chỉ những người đã được đếm hoặc đăng ký. Cách dịch này giữ liên hệ với nhóm vừa được nói đến mà không thêm “nam giới”, vốn không xuất hiện rõ trong câu này.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng gia tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc trong bộ tộc; “gia tộc” vừa chính xác vừa tự nhiên trong văn cảnh sách Dân Số.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: ba ngàn hai trăm
  rationale: Đây là tổng số đếm trực tiếp; “ba ngàn hai trăm” là cách diễn đạt số tự nhiên trong tiếng Việt hiện đại.
