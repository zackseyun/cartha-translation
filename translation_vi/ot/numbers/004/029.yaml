  text: בְּנֵ֖י מְרָרִ֑י לְ/מִשְׁפְּחֹתָ֥/ם לְ/בֵית אֲבֹתָ֖/ם תִּפְקֹ֥ד אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: vi
  text: Còn con cháu Mê-ra-ri[a], ngươi phải kiểm đếm họ theo từng thị tộc, từng gia tộc phụ hệ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Mê-ra-ri”; trong ngữ cảnh này, cụm từ chỉ con cháu hoặc người thuộc dòng Mê-ra-ri.'
    reason: lexical_alternative
  - marker: b
    text: “Gia tộc phụ hệ” là nhóm thân tộc được xác định theo dòng cha trong cơ cấu gia phả của Y-sơ-ra-ên.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: con cháu Mê-ra-ri
  rationale: Trong bối cảnh kiểm đếm theo dòng tộc, בְּנֵי kèm tên riêng chỉ hậu duệ thuộc dòng Mê-ra-ri, không chỉ các con trai trực tiếp. “Con cháu” tự nhiên và chính xác hơn trong tiếng Việt hiện đại.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc trong cơ cấu bộ tộc; “thị tộc” phân biệt rõ với đơn vị gia tộc phụ hệ được nhắc kế tiếp.
- source_word: לְבֵית אֲבֹתָם
  choice: từng gia tộc phụ hệ
  rationale: Cụm từ chỉ các nhóm hộ tộc được xác định theo dòng cha. Cách dịch này chuyển tải cơ cấu xã hội của nguyên ngữ mà không dùng lối dịch từng chữ khó hiểu như “nhà cha ông”.
- source_word: תִּפְקֹד
  choice: phải kiểm đếm
  rationale: Trong ngữ cảnh điều tra dân số và đăng bộ, פקד chỉ việc kiểm kê, ghi nhận số người. “Kiểm đếm” thể hiện tính chính thức rõ hơn “đếm” đơn thuần.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ làm tân ngữ, quy chiếu về con cháu Mê-ra-ri.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ lời truyền lệnh trực tiếp ở số ít trong תִּפְקֹד; dùng “thị tộc” và “gia tộc phụ hệ” để phân biệt hai cấp đơn vị thân tộc.
