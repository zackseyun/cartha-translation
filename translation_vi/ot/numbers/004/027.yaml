review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhìn chung phản ánh đúng quyền chỉ huy của A-rôn và các con trai ông, cũng như việc giao trách nhiệm vận chuyển cho người Ghẹt-sôn. Tuy nhiên, “mọi công việc khác của họ” thêm ý “khác” không có trong nguyên văn và làm yếu sự lặp lại có chủ ý của עֲבֹדָה. Cụm “mọi thứ cần khuân vác” cũng ít trực tiếp hơn “mọi việc khuân vác của họ” trong việc phản ánh מַשָּׂאָם.
