revisions:
- from: Mọi công việc phục vụ của con cháu Ghẹt-sôn đều phải theo lệnh của A-rôn và các con trai ông[a], kể cả mọi việc khuân vác và mọi công việc khác của họ. Các ông phải giao cho họ mọi thứ cần khuân vác như một trách nhiệm phải đảm nhận[b].
  to: Mọi công việc phục vụ của con cháu Ghẹt-sôn, trong mọi việc khuân vác và mọi công việc phục vụ của họ, đều phải theo lệnh của A-rôn và các con trai ông[a]. Các ông phải giao cho họ, như một phận sự, mọi việc khuân vác của họ[b].
  rationale: Sửa để loại bỏ ý thêm “khác,” bảo tồn sự lặp lại của “công việc phục vụ” và “việc khuân vác” trong tiếng Hê-bơ-rơ, đồng thời diễn đạt rõ rằng toàn bộ công việc của người Ghẹt-sôn phải được thực hiện theo chỉ thị của A-rôn và các con trai ông. Câu hai giữ tính mơ hồ đúng mức của מִשְׁמֶרֶת bằng “như một phận sự.”
