  text: עַל פִּי֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו תִּהְיֶ֗ה כָּל עֲבֹדַת֙ בְּנֵ֣י הַ/גֵּרְשֻׁנִּ֔י לְ/כָל מַשָּׂאָ֔/ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/פְקַדְתֶּ֤ם עֲלֵ/הֶם֙ בְּ/מִשְׁמֶ֔רֶת אֵ֖ת כָּל מַשָּׂאָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: vi
  text: Mọi công việc phục vụ của con cháu Ghẹt-sôn, trong mọi việc khuân vác và mọi công việc phục vụ của họ, đều phải theo lệnh của A-rôn và các con trai ông[a]. Các ông phải giao cho họ, như một phận sự, mọi việc khuân vác của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “theo miệng của A-rôn và các con trai ông”; đây là thành ngữ Hê-bơ-rơ có nghĩa là làm theo lời truyền hoặc sự chỉ đạo của họ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “như một trách nhiệm được giao” hoặc “như một phận sự được giao.” Từ Hê-bơ-rơ có thể chỉ trách nhiệm, nghĩa vụ hoặc nhiệm vụ trông coi được giao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: theo lệnh của
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “theo miệng của”, nhưng trong ngữ cảnh chỉ sự hành động theo mệnh lệnh hoặc sự chỉ đạo của người có thẩm quyền.
- source_word: כָּל־עֲבֹדַת
  choice: mọi công việc phục vụ
  rationale: עֲבֹדָה trong bối cảnh người Lê-vi phục vụ tại Đền Tạm vừa chỉ lao động được giao vừa chỉ sự phục vụ; cách dịch này giữ được cả hai sắc thái.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: con cháu Ghẹt-sôn
  rationale: Cụm từ chỉ nhóm thị tộc hậu duệ của Ghẹt-sôn. “Con cháu Ghẹt-sôn” tự nhiên trong tiếng Việt và vẫn giữ ý niệm dòng dõi.
- source_word: לְכָל־מַשָּׂאָם וּלְכֹל עֲבֹדָתָם
  choice: kể cả mọi việc khuân vác và mọi công việc khác của họ
  rationale: Các giới từ לְ nêu phạm vi mà mệnh lệnh của A-rôn và các con trai ông chi phối. “Kể cả” diễn đạt phạm vi ấy tự nhiên; “khác” tránh lặp khó hiểu giữa công việc tổng quát và việc khuân vác đã được nêu riêng.
- source_word: וּפְקַדְתֶּם עֲלֵהֶם
  choice: Các ông phải giao cho họ
  rationale: פקד trong cấu trúc này mang nghĩa giao hoặc chỉ định trách nhiệm. Đại từ số nhiều “các ông” giữ lời chỉ dẫn trực tiếp cho A-rôn và các con trai ông theo văn cảnh.
- source_word: בְמִשְׁמֶרֶת
  choice: như một trách nhiệm phải đảm nhận
  rationale: מִשְׁמֶרֶת có thể chỉ phận sự, trách nhiệm hoặc nhiệm vụ được giao trông coi. Cách dịch này rõ nghĩa trong tiếng Việt hiện đại mà không thu hẹp thành việc canh gác.
- source_word: אֵת כָּל־מַשָּׂאָם
  choice: mọi thứ cần khuân vác
  rationale: מַשָּׂא ở đây chỉ cụ thể các vật dụng Đền Tạm mà họ chịu trách nhiệm vận chuyển, không phải gánh nặng theo nghĩa bóng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “công việc phục vụ” cho bối cảnh Lê-vi, tránh từ “chức vụ” vì dễ gợi một chức danh tôn giáo. Tên riêng dùng dạng Việt hóa quen thuộc A-rôn và Ghẹt-sôn.
