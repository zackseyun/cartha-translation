  terminology: Giữ “A-rôn,” “Ghẹt-sôn,” “công việc phục vụ,” “khuân vác,” và “phận sự” là nhất quán, tự nhiên trong bối cảnh trách nhiệm của người Lê-vi. “Phận sự” phản ánh tốt מִשְׁמֶרֶת mà không áp đặt nghĩa canh gác.
  issues:
