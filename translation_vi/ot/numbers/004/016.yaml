  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: vi
  text: Ê-lê-a-sa, con trai thầy tế lễ A-rôn, có trách nhiệm trông coi[a] dầu thắp đèn, hương liệu thơm, lễ vật ngũ cốc thường xuyên[b] và dầu xức; ông cũng phụ trách toàn bộ Đền Tạm và mọi thứ trong đó, trong nơi thánh[c] và trong các vật dụng của nó[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể dịch là “việc giám sát” hoặc “nhiệm vụ được giao.”
    reason: lexical_alternative
  - marker: b
    text: “Thường xuyên” cũng có thể dịch là “liên tục”; từ Hê-bơ-rơ nhấn mạnh việc dâng lễ đều đặn.
    reason: lexical_alternative
  - marker: c
    text: “Nơi thánh” cũng có thể dịch là “khu vực thánh”; ở đây từ này có thể chỉ phạm vi thánh nói chung, không nhất thiết chỉ riêng gian Thánh.
    reason: lexical_alternative
  - marker: d
    text: “Các vật dụng” cũng có thể dịch là “các khí cụ” hoặc “các đồ dùng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: có trách nhiệm trông coi / phụ trách
  rationale: Danh từ này chỉ trách nhiệm giám sát được giao. Cách diễn đạt bằng động từ tự nhiên trong tiếng Việt, đồng thời giữ được ý Eleazar được giao coi sóc các vật thánh.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: dầu thắp đèn
  rationale: Diễn đạt tự nhiên ý đen là “dầu dùng cho ánh sáng”, tức dầu dùng để thắp đèn trong Đền Tạm.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: hương thơm
  rationale: Chỉ loại hương được pha chế từ các chất thơm; cách dịch ngắn gọn, tự nhiên và không thêm chi tiết ngoài nguyên văn.
- source_word: מִנְחַת הַתָּמִיד
  choice: lễ vật ngũ cốc thường xuyên
  rationale: מִנְחָה ở đây là lễ vật bằng ngũ cốc, còn תָּמִיד nhấn mạnh tính đều đặn hoặc liên tục; “thường xuyên” tránh xác định quá mức là “hằng ngày”.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Thuật ngữ tự nhiên, quen thuộc cho loại dầu dùng trong nghi thức xức phong hoặc biệt riêng.
- source_word: כָּל הַמִּשְׁכָּן
  choice: toàn bộ Đền Tạm
  rationale: “Đền Tạm” là cách gọi rõ ràng, thông dụng trong văn cảnh sách Dân Số; “toàn bộ” thể hiện lực của כָּל.
- source_word: בְּקֹדֶשׁ
  choice: nơi thánh
  rationale: Trong văn cảnh này, קֹדֶשׁ có nghĩa không gian thánh hoặc khu vực thánh, chứ không phải khái niệm trừu tượng “sự thánh khiết”.
- source_word: וּבְכֵלָיו
  choice: các vật dụng của Đền Tạm
  rationale: כֵּלִים có thể chỉ đồ dùng, dụng cụ hoặc khí cụ. “Các vật dụng” đủ rộng để bao gồm trang thiết bị thánh của Đền Tạm.
theological_decisions:
- issue: Cấu trúc và phạm vi của hai lần dùng פְקֻדַּת
  choice: Eleazar được giao trông coi các vật liệu thánh được liệt kê và, theo nghĩa tổng quát hơn, toàn bộ Đền Tạm cùng mọi thứ trong đó.
  alternative: 'Có thể giữ cấu trúc danh từ tỉnh lược sát hơn: “Trách nhiệm của Ê-lê-a-sa… là…; trách nhiệm về toàn bộ Đền Tạm…”'
  rationale: Tiếng Hê-bơ-rơ dùng cấu trúc không có động từ và mang tính đồng vị. Dùng “có trách nhiệm trông coi” và “phụ trách” giúp câu tiếng Việt rõ ràng mà không biến trách nhiệm này thành quyền sở hữu hay thêm một chức vụ thần học.
- issue: Quan hệ của בְּקֹדֶשׁ וּבְכֵלָיו với mệnh đề trước
  choice: 'Hiểu cụm cuối theo chức năng giải thích phạm vi: “tức là nơi thánh và các vật dụng của Đền Tạm.”'
  alternative: Có thể hiểu sát các giới từ hơn là “trong nơi thánh và trong các vật dụng của nó,” nhưng cách này tối nghĩa và kém tự nhiên trong tiếng Việt.
  rationale: Cú pháp Hê-bơ-rơ ở cuối câu cô đọng và có thể hiểu theo lối đồng vị. Bản dịch giữ tính giải thích mà không thu hẹp “nơi thánh” vào riêng gian Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng dùng dạng phiên âm quen thuộc; “thầy tế lễ,” “Đền Tạm,” “dầu xức” và “lễ vật ngũ cốc” duy trì thuật ngữ nhất quán trong văn cảnh nghi lễ. Cấu trúc danh từ cô đọng của tiếng Hê-bơ-rơ được chuyển thành hai mệnh đề chủ động tự nhiên trong tiếng Việt.
