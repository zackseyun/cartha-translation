    issue: Cấu trúc “công việc phục vụ ... trong mọi phận sự của họ” hơi gượng và làm mờ quan hệ “đối với/toàn bộ” trong לְכָל עֲבֹדָתָם.
    rationale: Câu Hê-bơ-rơ nói về phần phục vụ của các thị tộc Mê-ra-ri liên quan đến toàn bộ công việc phục vụ của họ; diễn đạt lại giúp câu tiếng Việt mạch lạc hơn mà không thêm nghĩa.
  - severity: low
    issue: Ký hiệu chú thích [a] hiện đặt ở cuối câu thay vì neo trực tiếp vào “dưới sự giám sát của Y-tha-ma.”
    rationale: Chú thích chỉ giải thích בְּיַד (“bởi tay”), nên cần gắn sát cách dịch của thành ngữ này để xác định phạm vi chú thích.
