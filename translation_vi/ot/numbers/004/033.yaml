revisions:
- from: Đây là công việc phục vụ của các thị tộc con cháu Mê-ra-ri trong mọi phận sự của họ tại Lều Hội Kiến, dưới sự giám sát của Y-tha-ma, con trai thầy tế lễ A-rôn.[a]
  to: Đây là phần việc của các thị tộc con cháu Mê-ra-ri trong toàn bộ công việc phục vụ của họ tại Lều Hội Kiến, dưới sự giám sát của Y-tha-ma[a], con trai của A-rôn, thầy tế lễ.
  rationale: Điều chỉnh câu để diễn đạt trôi chảy hơn mối liên hệ giữa “phần việc” và “toàn bộ công việc phục vụ,” đồng thời giữ nguyên các thuật ngữ phụng tự, cơ cấu thị tộc, tên riêng và ý nghĩa giám sát hành chính của thành ngữ Hê-bơ-rơ. Di chuyển neo chú thích đến đúng cụm được chú giải.
