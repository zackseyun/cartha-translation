base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: vi
  text: Đây là phần việc của các thị tộc con cháu Mê-ra-ri trong toàn bộ công việc phục vụ của họ tại Lều Hội Kiến, dưới sự giám sát của Y-tha-ma[a], con trai của A-rôn, thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “bởi tay Y-tha-ma”, một thành ngữ chỉ sự quản lý hoặc giám sát.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Đây là công việc phục vụ
  rationale: Mệnh đề tổng kết cần thêm động từ “là” trong tiếng Việt; “công việc phục vụ” diễn đạt עֲבֹדָה trong bối cảnh nhiệm vụ Lê-vi, không chỉ là lao động nói chung.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: các thị tộc con cháu Mê-ra-ri
  rationale: מִשְׁפְּחֹת chỉ các nhóm thân tộc trong cơ cấu bộ tộc; בְּנֵי ở đây nói về toàn thể dòng dõi nên “con cháu” tự nhiên và chính xác hơn cách hiểu chỉ các con trai trực hệ.
- source_word: לְכָל עֲבֹדָתָם
  choice: trong mọi phận sự của họ
  rationale: Cụm này bao quát toàn bộ nhiệm vụ được giao; “phận sự” tránh lặp cứng với עֲבֹדַת mà vẫn giữ sắc thái trách nhiệm phục vụ.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: Đây là danh xưng cố định của nơi Đức Chúa Trời gặp dân Ngài; “tại” diễn đạt phạm vi thực hiện công việc mà không ngụ ý mọi nhiệm vụ đều diễn ra bên trong lều.
- source_word: בְּיַד
  choice: dưới sự giám sát của
  rationale: Thành ngữ nghĩa đen là “bởi tay”, nhưng trong ngữ cảnh hành chính chỉ sự quản lý hoặc giám sát.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Y-tha-ma, con trai thầy tế lễ A-rôn
  rationale: Cú pháp Hê-bơ-rơ gắn הַכֹּהֵן trực tiếp với A-rôn; trật tự tiếng Việt này làm rõ rằng A-rôn được gọi là thầy tế lễ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “thị tộc” cho đơn vị thân tộc thuộc bộ tộc, “Lều Hội Kiến” như danh xưng phụng tự, và giữ tên riêng theo dạng phiên âm Việt quen dùng.
