  source_fidelity: Bản dịch nhìn chung phản ánh đúng mệnh lệnh bảo vệ người Kê-hát, việc họ đến gần các vật chí thánh, và sự phân định cá nhân về phận sự cùng tải vật. Tuy nhiên, “để họ được sống và không phải chết” làm yếu đối ứng trực tiếp וְחָיוּ וְלֹא יָמֻתוּ (“để họ sống mà không chết”); và “phân công từng người đảm nhận” kém sát cấu trúc Aaron cùng các con trai ông chỉ định/giao từng người vào phần việc và tải vật của người ấy.
