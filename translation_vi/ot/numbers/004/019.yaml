  terminology: “A-rôn”, “các vật chí thánh”, “phận sự”, và “vật phải khuân vác” phù hợp với tiếng Việt Kinh Thánh hiện đại và bối cảnh nghi lễ-vận chuyển. Chú thích thay thế nên tránh đặt hai nhãn Việt ngữ gần như đồng nghĩa cho cùng một cách hiểu không gian; chỉ cần nêu “Nơi Chí Thánh” và giải thích đây là cách hiểu theo không gian.
