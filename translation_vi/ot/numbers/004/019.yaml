  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: vi
  text: 'Nhưng hãy làm điều này cho họ, để họ sống mà không chết khi đến gần các vật chí thánh[a]: A-rôn và các con trai ông phải vào và giao cho từng người[b] phận sự và vật phải khuân vác của người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nơi Chí Thánh.” Trong văn cảnh này, cụm từ có lẽ chỉ các vật thánh thiêng nhất phải được khuân chuyển hơn là chính gian bên trong của Đền Tạm.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “người người,” một lối diễn đạt phân phối, nghĩa là từng người được giao phận sự và vật phải khuân vác riêng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: Nhưng hãy làm điều này cho họ
  rationale: Giữ lực mệnh lệnh và sắc thái chuyển ý/đối lập của וְ, đồng thời hiểu לָהֶם theo nghĩa hành động vì lợi ích của người Kê-hát.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: để họ được sống và không phải chết
  rationale: Diễn đạt quan hệ mục đích-kết quả tự nhiên trong tiếng Việt mà vẫn giữ nguyên thế đối xứng sống/chết.
- source_word: בְּגִשְׁתָּם
  choice: khi đến gần
  rationale: Cấu trúc בְּ với động từ nguyên mẫu mang nghĩa thời gian; “đến gần” giữ được sắc thái tiếp cận trong nghi lễ.
- source_word: אֶת קֹדֶשׁ הַקֳּדָשִׁים
  choice: các vật chí thánh
  rationale: Trong văn cảnh phân công khuân vác, cụm này hợp lý nhất khi chỉ các vật thánh thiêng nhất, không nhất thiết chỉ một không gian.
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: A-rôn và các con trai ông phải vào
  rationale: “Phải” chuyển tải lực chỉ thị của thể chưa hoàn thành trong văn bản luật lệ; “vào” giữ nghĩa cơ bản của יָבֹאוּ trong văn cảnh.
- source_word: וְשָׂמוּ אוֹתָם אִישׁ אִישׁ
  choice: rồi phân công từng người
  rationale: שׂים trong cấu trúc này mang nghĩa bố trí/chỉ định; lối lặp אִישׁ אִישׁ có nghĩa phân phối, tức từng người một.
- source_word: עַל עֲבֹדָתוֹ
  choice: đảm nhận phận sự
  rationale: עֲבֹדָה ở đây là công việc phục vụ được giao; “phận sự” phù hợp văn phong trang trọng và rõ trách nhiệm cá nhân.
- source_word: וְאֶל מַשָּׂאוֹ
  choice: và vật phải khuân vác của mình
  rationale: מַשָּׂא trong văn cảnh vận chuyển chỉ vật hoặc phần tải phải mang; cách dịch cụ thể này tự nhiên hơn “gánh nặng” và tránh nghĩa bóng.
theological_decisions:
- issue: Sở chỉ của קֹדֶשׁ הַקֳּדָשִׁים
  choice: các vật chí thánh
  alternative: Nơi Chí Thánh / nơi cực thánh
  rationale: Văn cảnh nói về nhiệm vụ và vật phải khuân vác của người Kê-hát sau khi các thầy tế lễ chuẩn bị các vật thánh. Tuy vậy, cấu trúc Hê-bơ-rơ vẫn có thể được hiểu theo nghĩa không gian, nên ghi nhận cách đọc ấy trong chú thích.
- issue: Giới tính trong אִישׁ אִישׁ
  choice: từng người
  alternative: mỗi người nam
  rationale: “Từng người” chuyển tải chính xác ý phân phối của phép lặp và trong văn cảnh đã rõ những người được nói đến là nam giới thuộc nhóm Lê-vi; không cần thêm từ gây nặng câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “A-rôn” theo dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt; “chí thánh” giữ sắc thái nghi lễ, còn “vật phải khuân vác” làm rõ bối cảnh vận chuyển cụ thể.
