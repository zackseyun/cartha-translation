source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י יִשְׂרָאֵ֖ל אֶת הַ/לְוִיִּ֑ם לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: vi
  text: Tất cả những người đã được kiểm kê[a] trong số người Lê-vi, mà Môi-se, A-rôn và các thủ lĩnh Y-sơ-ra-ên đã kiểm kê theo từng thị tộc và gia tộc phụ hệ[b] của họ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được đếm” hoặc “được đăng bộ”. Tiếng Hê-bơ-rơ dùng từ ngữ chỉ việc kiểm kê dân số, từ động từ פקד.
    reason: lexical_alternative
  - marker: b
    text: “Gia tộc phụ hệ” chỉ các hộ tộc hoặc các nhánh gia đình theo dòng cha nằm trong những thị tộc.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Tất cả những người đã được kiểm kê
  rationale: Diễn đạt tự nhiên dạng phân từ bị động và ý nghĩa điều tra, đăng bộ dân số của פקד, đồng thời không thêm từ “nam giới” vốn không xuất hiện tại đây.
- source_word: פָּקַד
  choice: đã kiểm kê
  rationale: Trong Dân Số Ký 4, động từ chỉ việc chính thức thống kê và đăng bộ; “kiểm kê” vừa rõ nghĩa vừa giữ được sự lặp từ với הַפְּקֻדִים.
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: các thủ lĩnh Y-sơ-ra-ên
  rationale: נְשִׂיאִים là những người đứng đầu bộ tộc; “thủ lĩnh” trang trọng, hiện đại và không gây liên tưởng sai đến hoàng tử.
- source_word: אֶת הַלְוִיִּם
  choice: trong số người Lê-vi
  rationale: אֶת đánh dấu “người Lê-vi” là đối tượng được kiểm kê; cách diễn đạt này liên kết tự nhiên với “những người đã được kiểm kê” trong tiếng Việt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc ở cấp thị tộc trong cơ cấu bộ tộc, không chỉ một gia đình hạt nhân.
- source_word: וּלְבֵית אֲבֹתָם
  choice: và gia tộc phụ hệ của họ
  rationale: בֵּית אָבוֹת là đơn vị hộ tộc dựa trên dòng cha. “Gia tộc phụ hệ” truyền đạt chức năng xã hội rõ hơn lối dịch sát nhưng khó hiểu “nhà cha”.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ dấu gạch ngang cuối câu vì câu cú pháp tiếp tục sang câu 47. Dùng “kiểm kê” nhất quán để bảo toàn phép lặp từ của nguyên văn Hê-bơ-rơ.
