  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/043.yaml
  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: vi
  text: từ ba mươi tuổi trở lên cho đến năm mươi tuổi, tất cả những người đến[a] làm nhiệm vụ[b], để làm công việc trong Lều Hội Kiến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vào phục vụ”. Phân từ Hê-bơ-rơ có thể nhấn mạnh việc họ đến hoặc trình diện để nhận phần việc được giao.
    reason: lexical_alternative
  - marker: b
    text: Từ được dịch là “nhiệm vụ” có thể chỉ một nhiệm vụ được tổ chức theo hàng ngũ, đôi khi mang sắc thái quân sự; ở đây từ ấy nói về việc phục vụ của người Lê-vi.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן ... שְׁלֹשִׁים שָׁנָה
  choice: từ ba mươi tuổi
  rationale: Thành ngữ בֶּן + số + שָׁנָה chỉ tuổi; cách diễn đạt tự nhiên trong tiếng Việt là “ba mươi tuổi”.
- source_word: וָמַעְלָה
  choice: trở lên
  rationale: Diễn tả giới hạn dưới của độ tuổi theo cách tự nhiên và rõ ràng trong tiếng Việt.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: cho đến năm mươi tuổi
  rationale: Giữ rõ giới hạn trên của khoảng tuổi mà không diễn giải thêm về cách tính tuổi.
- source_word: כָּל הַבָּא
  choice: tất cả những người đến
  rationale: Giữ sắc thái của phân từ בוא, chỉ những người đến hoặc trình diện để đảm nhận công việc, thay vì âm thầm đổi thành một động từ chuyên biệt hơn.
- source_word: לַצָּבָא
  choice: làm nhiệm vụ
  rationale: Trong bối cảnh người Lê-vi, צָבָא chỉ nhiệm vụ có tổ chức chứ không nhất thiết là quân vụ; “làm nhiệm vụ” rõ nghĩa và tránh quân sự hóa câu văn.
- source_word: לַעֲבֹדָה
  choice: để làm công việc
  rationale: Phân biệt עֲבֹדָה với צָבָא đứng trước, đồng thời giữ quan hệ mục đích của cụm từ.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: “Lều Hội Kiến” là cách gọi trang trọng, dễ hiểu; “trong” phản ánh trực tiếp giới từ בְּ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu giữ hai ý gần nhau nhưng không đồng nhất của צָבָא (“nhiệm vụ có tổ chức”) và עֲבֹדָה (“công việc”), đồng thời không áp đặt sắc thái quân sự lên việc phục vụ của người Lê-vi.
