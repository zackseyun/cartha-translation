source:
  edition: WLC
  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: vi
  text: Trên bàn Hiện Diện, họ phải trải một tấm vải xanh lam[a], rồi đặt lên đó các đĩa, chén, bát và bình dùng cho lễ quán; và bánh thường lệ[b] phải ở trên bàn ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát tiếng Hê-bơ-rơ: “bàn của sự hiện diện”; nghĩa đen là “bàn của nhan”. Theo cách gọi truyền thống: “bàn bánh tiến.”'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “bánh liên tục”. Đây là bánh được đặt thường xuyên trước mặt Đức Giê-hô-va trên bàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: bàn Hiện Diện
  rationale: Cụm từ có nghĩa sát là “bàn của sự hiện diện/nhan”; cách dịch này giữ được thành ngữ và ý nghĩa phụng tự của tiếng Hê-bơ-rơ mà không diễn giải thành tên của loại bánh.
- source_word: יִפְרְשׂוּ
  choice: trải
  rationale: Động từ chỉ hành động trải một vật ra hoặc phủ lên; “trải” tự nhiên và chính xác trong ngữ cảnh đặt vải trên bàn.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: một tấm vải xanh lam
  rationale: תְּכֵלֶת chỉ màu xanh đặc trưng dùng trong Đền Tạm, có thể mang sắc xanh tím; “xanh lam” rõ ràng và không xác định sắc độ quá mức.
- source_word: הַקְּעָרֹת
  choice: các đĩa
  rationale: Trong danh mục đồ dùng phụng tự, từ này chỉ những vật đựng tương đối phẳng; “đĩa” phù hợp và dễ hiểu.
- source_word: הַכַּפֹּת
  choice: chén
  rationale: Tên dụng cụ này có thể chỉ vật đựng nhỏ hoặc dạng thìa trong những ngữ cảnh khác; “chén” là cách gọi tự nhiên trong chuỗi đồ dùng trên bàn mà không xác định hình dạng quá chi tiết.
- source_word: הַמְּנַקִּיֹּת
  choice: bát
  rationale: Danh từ hiếm này được hiểu theo nhiều cách; “bát” bảo tồn tính khái quát của một vật đựng trên bàn và tránh thuật ngữ cổ hoặc quá chuyên biệt.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: bình dùng cho lễ quán
  rationale: Cụm từ chỉ những bình liên hệ với việc rót lễ quán. “Bình dùng cho lễ quán” vừa tự nhiên vừa giữ chức năng nghi lễ của נֶסֶךְ.
- source_word: לֶחֶם הַתָּמִיד
  choice: bánh thường xuyên
  rationale: Cụm từ nhấn mạnh bánh được đặt đều đặn/liên tục trước Đức Giê-hô-va. Cách dịch sát này giữ sắc thái của תָּמִיד và được giải thích thêm trong chú thích.
- source_word: עָלָיו יִהְיֶה
  choice: phải ở trên bàn ấy
  rationale: Mệnh đề nói bánh phải có mặt trên chiếc bàn; nêu lại “bàn ấy” giúp đại từ quy chiếu rõ ràng trong tiếng Việt mà không thêm ý “vẫn còn” vốn không được động từ diễn đạt trực tiếp.
theological_decisions:
- issue: Ý nghĩa của שֻׁלְחַן הַפָּנִים
  choice: Giữ cách gọi sát “bàn Hiện Diện”
  alternative: “bàn bánh tiến” hoặc “bàn bánh trưng bày”
  rationale: Nguyên văn gọi chiếc bàn theo “sự hiện diện/nhan”, không trực tiếp gọi theo bánh; cách dịch sát bảo tồn hình ảnh thần học và tránh giải quyết thay cho độc giả mối liên hệ giữa bàn, bánh và sự hiện diện của Đức Chúa Trời.
- issue: Sắc thái của לֶחֶם הַתָּמִיד
  choice: “bánh thường xuyên”
  alternative: “bánh hằng hiến” hoặc “bánh luôn đặt trước mặt Chúa”
  rationale: Giữ ý liên tục/đều đặn của תָּמִיד mà không thêm một động tác hiến dâng hoặc bổ sung danh xưng thần linh không xuất hiện trong câu này.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “phải” để thể hiện tính chỉ thị của ngữ cảnh. Các thuật ngữ phụng tự được giữ gọn; “lễ quán” là thuật ngữ quen thuộc cho lễ dâng bằng cách rót. Hai chú thích bảo tồn lối nói Hê-bơ-rơ và giải thích danh xưng truyền thống mà không đưa phần diễn giải vào chính văn.
