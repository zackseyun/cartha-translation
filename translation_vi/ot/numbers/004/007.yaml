revisions:
- from: Trên bàn Hiện Diện, họ phải trải một tấm vải xanh lam[a], rồi đặt lên đó các đĩa, chén, bát và bình dùng cho lễ quán; còn bánh thường xuyên phải ở trên bàn ấy.[b]
  to: Trên bàn Hiện Diện, họ phải trải một tấm vải xanh lam[a], rồi đặt lên đó các đĩa, chén, bát và bình dùng cho lễ quán; và bánh thường lệ[b] phải ở trên bàn ấy.
  rationale: Sửa tối thiểu để loại bỏ sắc thái đối lập không có trong nguyên văn, dùng một cách diễn đạt tự nhiên hơn cho לֶחֶם הַתָּמִיד, và gắn chú thích với đúng cụm từ nó giải thích. Các thuật ngữ phụng tự và tính không chắc chắn hợp lý về một số loại đồ dùng được giữ nguyên.
  reviewer_model: gpt-5.6-terra
