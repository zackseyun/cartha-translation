    issue: “còn” tạo sắc thái đối lập
    rationale: Nguyên văn chỉ nối mệnh đề bằng וְ (“và”); không nêu sự tương phản giữa các vật dụng và bánh.
  - severity: medium
    issue: “bánh thường xuyên” chưa tự nhiên trong tiếng Việt
    rationale: Cụm này dễ mô tả tần suất làm/dùng bánh, không rõ ý bánh theo quy định thường xuyên ở trên bàn. “Bánh thường lệ” giữ ý תָּמִיד theo hướng “regular” mà không thêm ý hiến dâng.
  - severity: low
