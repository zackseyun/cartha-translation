  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: vi
  text: các tấm màn vây quanh sân, bức màn che lối vào cổng của sân—sân này bao quanh Đền Tạm và bàn thờ—các dây[a] của chúng, mọi dụng cụ dùng trong việc phục vụ chúng, cùng mọi việc phải làm với chúng[b]; họ sẽ phục vụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dây thừng” hoặc “các dây buộc”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mọi việc phải làm cho chúng”. Tiếng Hê-bơ-rơ có thể nói đến các việc được thực hiện với những vật dụng này hoặc cho chúng trong khi phục vụ.
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: các tấm màn
  rationale: Chỉ những tấm vải tạo thành hàng rào bao quanh sân; cách diễn đạt này tự nhiên và phân biệt được từng tấm.
- source_word: חָצֵר
  choice: sân
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ khu vực ngoài trời được bao quanh.
- source_word: מָסַךְ
  choice: bức màn che
  rationale: Chỉ tấm vải chắn tại một lối vào, vừa rõ chức năng vừa phù hợp ngữ cảnh thánh điện.
- source_word: פֶּתַח שַׁעַר
  choice: lối vào cổng
  rationale: Giữ được cả ý 'lối vào' và 'cổng' của chuỗi danh từ Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: bao quanh Đền Tạm và bàn thờ
  rationale: Diễn đạt quan hệ không gian của sân đối với cả Đền Tạm lẫn bàn thờ; tránh cách lặp 'xung quanh... và xung quanh...' kém tự nhiên trong tiếng Việt.
- source_word: מֵיתְרֵיהֶם
  choice: các dây của chúng
  rationale: Từ Hê-bơ-rơ có thể chỉ dây thừng hoặc dây buộc; 'dây' giữ nghĩa rộng và dễ hiểu.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: mọi dụng cụ dùng trong công việc phục vụ liên quan đến chúng
  rationale: כְּלִים là các dụng cụ/đồ dùng, còn עֲבֹדָה ở đây là công việc phục vụ Đền Tạm; thêm 'liên quan đến chúng' làm rõ đại từ số nhiều mà không biến nó thành nghi thức riêng biệt.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: mọi việc phải làm với chúng
  rationale: Giữ cách hiểu theo ngữ cảnh rằng đây là những việc thực hiện bằng hoặc đối với các vật dụng, đồng thời ghi chú khả năng 'làm cho chúng'.
- source_word: וְעָבָדוּ
  choice: họ phải phục vụ
  rationale: Diễn đạt nghĩa vụ trong nhiệm vụ được giao và giữ sắc thái phục vụ thánh điện của động từ עבד.
theological_decisions:
- issue: Quan hệ của לָהֶם trong כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: mọi việc phải làm với chúng
  alternative: mọi việc phải làm cho chúng
  rationale: Giới từ có thể nói đến việc dùng/xử lý các vật dụng hoặc việc thực hiện vì chúng. Bản chính chọn cách phù hợp mạch nhiệm vụ, còn chú thích bảo tồn nghĩa thay thế.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đền Tạm” làm thuật ngữ nhất quán cho הַמִּשְׁכָּן; giữ cấu trúc liệt kê của nguyên văn nhưng điều chỉnh trật tự từ cho tự nhiên. Dấu chấm phẩy nối mệnh lệnh kết luận với danh sách nhiệm vụ.
