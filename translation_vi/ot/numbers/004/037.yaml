source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: vi
  text: Đây là những người thuộc các gia tộc Kê-hát đã được kiểm kê, tất cả đều phục vụ trong Lều Hội Kiến; họ đã được Môi-se và A-rôn kiểm kê theo lệnh của Yahweh, qua tay Môi-se.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “qua Môi-se” thay cho “qua tay Môi-se.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: những người đã được kiểm kê
  rationale: Trong bối cảnh kiểm kê nhân sự phục vụ của Dân Số Ký 4, từ này chỉ những người được đếm và ghi nhận, chứ không phải một khái niệm trừu tượng như “cuộc kiểm kê”.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: các gia tộc Kê-hát
  rationale: מִשְׁפְּחֹת chỉ các nhóm thân tộc hoặc thị tộc; “các gia tộc Kê-hát” vừa tự nhiên vừa diễn đạt tập thể hậu duệ Kê-hát.
- source_word: כָּל הָעֹבֵד
  choice: tất cả những người phục vụ
  rationale: Phân từ עֹבֵד mô tả những người đang đảm trách công việc phục vụ; cách dịch này giữ được ý tập thể của כָּל.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Giữ giới từ “trong” theo בְּ và dùng danh xưng quen thuộc, trang trọng cho nơi gặp gỡ thánh.
- source_word: אֲשֶׁר פָּקַד
  choice: mà ... đã kiểm kê
  rationale: Ở đây פקד tiếp tục mang nghĩa đếm hoặc kiểm kê nhân sự, không phải bổ nhiệm.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Thành ngữ nghĩa đen là “theo miệng Yahweh,” nhưng trong ngữ cảnh diễn đạt mệnh lệnh hoặc sự chỉ đạo của Ngài.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng trong bản Hê-bơ-rơ thay vì thay thế bằng một tước hiệu.
- source_word: בְּיַד מֹשֶׁה
  choice: qua tay Môi-se
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ về phương tiện hoặc sự trung gian; chú thích nêu cách diễn đạt tự nhiên hơn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Quan hệ giữa mệnh lệnh của Yahweh và vai trò của Môi-se
  choice: theo lệnh của Yahweh, qua tay Môi-se
  alternative: theo lệnh Yahweh truyền qua Môi-se
  rationale: Giữ cả nguồn gốc thần linh của mệnh lệnh lẫn thành ngữ chỉ vai trò trung gian của Môi-se, không đồng nhất hai cụm từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kiểm kê” phù hợp ngữ cảnh thống kê nhân sự; “Lều Hội Kiến” được viết hoa như một danh xưng. Cấu trúc “qua tay Môi-se” có sắc thái trang trọng nhằm bảo tồn thành ngữ nguồn, với cách nói tự nhiên hơn trong chú thích.
