  terminology: Giữ “Ghẹt-sôn” và “gia tộc”. Dùng “nhà tổ phụ” cho בֵּית אָבוֹת, một đơn vị gia hệ theo dòng cha, tránh cách nói không tự nhiên “nhà cha ông”.
