  text: 'Những người được kiểm đếm trong số con cháu Ghẹt-sôn, theo các gia tộc và các nhà tổ phụ của họ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: Những người được kiểm đếm
  rationale: Dạng danh từ thụ động chỉ những người đã được thống kê trong cuộc kiểm đếm; thêm “người” để tiếng Việt rõ và tự nhiên.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: con cháu Ghẹt-sôn
  rationale: Trong ngữ cảnh bộ tộc, בְּנֵי chỉ hậu duệ thuộc dòng Ghẹt-sôn, không chỉ các con trai trực hệ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng gia tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị họ tộc trong cơ cấu Y-sơ-ra-ên.
- source_word: וּלְבֵית אֲבֹתָם
  choice: và từng nhà cha ông của họ
  rationale: Giữ hình ảnh phụ hệ và cơ cấu xã hội của cụm Hê-bơ-rơ בֵּית אָבוֹת, đồng thời diễn đạt dễ hiểu bằng tiếng Việt.
