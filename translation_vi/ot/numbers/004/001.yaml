  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH (יהוה), danh riêng của Đức Chúa Trời; thường được phiên âm là “Yahweh”.'
    reason: Giải thích Tứ Tự Danh và cách phiên âm.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức dẫn lời của Đức Chúa Trời được dịch là “phán”, cách diễn đạt tự nhiên và trang trọng trong tiếng Việt; hình thái có waw nối tiếp đưa trình thuật sang hành động kế tiếp.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu; “Yahweh” là dạng phiên âm được dùng rộng rãi trong nghiên cứu hiện đại.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: Sau động từ “phán”, giới từ אֶל được diễn đạt tự nhiên bằng “với”; “Môi-se” là dạng tên quen thuộc trong tiếng Việt.
- source_word: וְאֶל אַהֲרֹן
  choice: và A-rôn
  rationale: Liên từ וְ phối hợp người nhận lời phán thứ hai. Tiếng Việt không cần lặp lại “với” nhưng vẫn truyền đạt rõ cả Môi-se lẫn A-rôn đều được phán bảo.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức giới thiệu lời nói, “rằng” là cách chuyển tự nhiên sang phần nội dung trực tiếp sẽ theo sau, đồng thời tránh lối dịch cứng “nói rằng” sau “phán”.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn trực tiếp dùng Tứ Tự Danh. Giữ “Yahweh” bảo toàn tính chất danh riêng và không âm thầm thay danh ấy bằng tước hiệu; chú thích nêu rõ dạng chữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời, các tên quen thuộc “Môi-se” và “A-rôn”, và đặt dấu hai chấm để dẫn vào lời phán ở câu kế tiếp.
