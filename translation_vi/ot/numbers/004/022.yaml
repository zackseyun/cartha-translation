  text: נָשֹׂ֗א אֶת רֹ֛אשׁ בְּנֵ֥י גֵרְשׁ֖וֹן גַּם הֵ֑ם לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: vi
  text: “Cũng hãy kiểm kê con cháu Ghẹt-sôn[a], theo nhà tổ phụ và thị tộc của họ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “hãy nâng đầu con cháu Ghẹt-sôn”; đây là một thành ngữ có nghĩa là đếm hoặc kiểm kê số người của họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Hãy kiểm kê
  rationale: Cụm từ này có nghĩa đen là “nâng đầu” nhưng là thành ngữ hành chính chỉ việc đếm hoặc lập danh sách. “Kiểm kê” truyền đạt tự nhiên ý nghĩa thống kê dân số trong văn cảnh.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: con cháu Ghẹt-sôn
  rationale: בְּנֵי có nghĩa đen là “các con trai của”, nhưng trong văn cảnh gia phả chỉ toàn thể hậu duệ thuộc dòng Ghẹt-sôn; “con cháu” rõ nghĩa hơn trong tiếng Việt hiện đại.
- source_word: גַּם הֵם
  choice: cả ... nữa
  rationale: Cách diễn đạt này giữ ý bổ sung và sắc thái nhấn mạnh của đại từ הֵם, cho biết nhóm Ghẹt-sôn cũng phải được kiểm kê như nhóm đã nói trước đó.
- source_word: לְבֵית אֲבֹתָם
  choice: theo từng nhà tổ phụ
  rationale: Giữ cấu trúc phụ hệ của thuật ngữ chỉ đơn vị gia tộc theo dòng tổ tiên nam, đồng thời thêm “từng” để diễn đạt tự nhiên chức năng phân loại của giới từ לְ.
- source_word: לְמִשְׁפְּחֹתָם
  choice: từng thị tộc của họ
  rationale: Trong bối cảnh kiểm kê bộ tộc, מִשְׁפָּחָה là một đơn vị thân tộc rộng hơn gia đình hạt nhân; “thị tộc” phân biệt phù hợp với “nhà tổ phụ”.
