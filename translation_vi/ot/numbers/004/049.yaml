  to: Theo lệnh Yahweh, họ được Môi-se kiểm kê[a], từng người tùy theo công việc phục vụ và vật mình phải mang; và việc đăng bộ của họ được thực hiện đúng như Yahweh đã truyền cho Môi-se[b].
