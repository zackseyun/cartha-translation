source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה פָּקַ֤ד אוֹתָ/ם֙ בְּ/יַד מֹשֶׁ֔ה אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/עַל מַשָּׂא֑/וֹ וּ/פְקֻדָ֕י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: vi
  text: Theo lệnh Yahweh, họ được Môi-se kiểm kê[a], từng người tùy theo công việc phục vụ và vật mình phải mang; và việc đăng bộ của họ được thực hiện đúng như Yahweh đã truyền cho Môi-se[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nhờ Môi-se”. Nguyên văn dùng thành ngữ “bởi tay Môi-se”, chỉ việc được thực hiện qua Môi-se.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “việc đăng bộ” khó xác định chính xác; tùy cách hiểu, nó cũng có thể nói đến sự kiểm kê, sự phân công, hoặc phần trách nhiệm được giao.
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: Theo lệnh của Yahweh
  rationale: Thành ngữ này có nghĩa đen là “theo miệng Yahweh” nhưng trong ngữ cảnh chỉ mệnh lệnh của Ngài. Giữ danh riêng Yahweh cho יהוה.
- source_word: פָּקַד אֹתָם
  choice: họ được kiểm kê
  rationale: פקד có trường nghĩa rộng, nhưng mạch văn Dân Số 4 nói về việc đăng bộ những người Lê-vi đủ tuổi phục vụ; “được kiểm kê” diễn đạt hành động hành chính này mà không đồng nhất nó với việc giao nhiệm vụ.
- source_word: בְּיַד מֹשֶׁה
  choice: qua tay Môi-se
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, đồng thời biểu thị Môi-se là người trung gian thực hiện việc kiểm kê theo lệnh Yahweh.
- source_word: אִישׁ אִישׁ
  choice: từng người
  rationale: Lối lặp phân phối nhấn mạnh rằng mỗi người được xét riêng; tiếng Việt tự nhiên dùng “từng người”.
- source_word: עַל עֲבֹדָתוֹ
  choice: theo công việc phục vụ
  rationale: עֲבֹדָה ở đây là nhiệm vụ phục vụ liên quan đến Lều Hội Kiến; “công việc phục vụ” vừa rõ vừa không thêm sắc thái giáo phái.
- source_word: וְעַל מַשָּׂאוֹ
  choice: và vật mình phải mang
  rationale: מַשָּׂא chỉ tải vật được giao mang khi vận chuyển các vật dụng của Đền Tạm. Cách diễn đạt cụ thể này tự nhiên hơn “gánh nặng” trong tiếng Việt hiện đại.
- source_word: וּפְקֻדָיו
  choice: những người được kiểm kê
  rationale: Dạng từ phái sinh từ פקד khó xác định tuyệt đối và có thể liên hệ đến người được đăng bộ, sự bổ nhiệm hoặc phần trách nhiệm. Trong mạch văn kiểm kê, chọn nghĩa chỉ những người được kiểm kê, đồng thời ghi chú khả năng khác.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: là theo điều Yahweh đã truyền cho Môi-se
  rationale: Diễn đạt mệnh đề quan hệ như sự phù hợp với mệnh lệnh Yahweh ban cho Môi-se, nhưng không xác định chi tiết vượt quá câu Hê-bơ-rơ.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; Chúa
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” giữ đây là danh riêng thay vì thay bằng một tước hiệu.
- issue: Quan hệ giữa kiểm kê và giao nhiệm vụ
  choice: Giữ “kiểm kê” ở động từ chính và không nhập nó với việc giao nhiệm vụ
  alternative: “bổ nhiệm” hoặc “phân công” họ
  rationale: פקד có thể mang nghĩa bổ nhiệm, nhưng ngữ cảnh tổng kết cuộc kiểm kê trong Dân Số 4 nghiêng về đăng bộ; các cụm nói đến việc phục vụ và vật phải mang vẫn bảo toàn yếu tố nhiệm vụ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “kiểm kê” cho bối cảnh đăng bộ hành chính, “công việc phục vụ” cho nhiệm vụ tại Lều Hội Kiến, và “vật mình phải mang” để tránh nghĩa bóng dễ gây hiểu lầm của “gánh nặng”. Cấu trúc cuối câu cố ý giữ phần nào độ khó và tính mơ hồ của וּפְקֻדָיו thay vì âm thầm giải quyết theo một cách duy nhất.
