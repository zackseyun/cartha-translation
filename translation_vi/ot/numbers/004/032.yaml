  text: וְ/עַמּוּדֵי֩ הֶ/חָצֵ֨ר סָבִ֜יב וְ/אַדְנֵי/הֶ֗ם וִֽ/יתֵדֹתָ/ם֙ וּ/מֵ֣יתְרֵי/הֶ֔ם לְ/כָל כְּלֵי/הֶ֔ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/בְ/שֵׁמֹ֣ת תִּפְקְד֔וּ אֶת כְּלֵ֖י מִשְׁמֶ֥רֶת מַשָּׂאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: vi
  text: cùng các trụ bao quanh sân, các đế, các cọc và các dây của chúng, cùng mọi vật dụng và mọi công việc phục vụ của chúng. Các ngươi phải chỉ định đích danh các vật dụng thuộc trách nhiệm mang vác của họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát hơn: “các vật dụng thuộc phận sự về gánh mang của họ.”'
    reason: Câu Hê-bơ-rơ rất cô đọng; chú thích bảo lưu các sắc thái “vật dụng,” “phận sự/trách nhiệm,” và “gánh mang” của nguyên văn.
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: các trụ quanh sân
  rationale: Diễn đạt tự nhiên vị trí các trụ bao quanh sân; עַמּוּדִים là các trụ kết cấu, còn סָבִיב chỉ vị trí chung quanh.
- source_word: אַדְנֵיהֶם
  choice: các đế của chúng
  rationale: Trong ngữ cảnh Đền Tạm, אֶדֶן là đế hoặc ổ đỡ của trụ; “đế” rõ nghĩa hơn với độc giả hiện đại.
- source_word: יְתֵדֹתָם
  choice: các cọc của chúng
  rationale: יָתֵד chỉ cọc dùng để neo giữ kết cấu lều; “cọc” tự nhiên trong tiếng Việt.
- source_word: מֵיתְרֵיהֶם
  choice: các dây của chúng
  rationale: מֵיתָר là dây hoặc dây thừng dùng với cọc để neo lều; “dây” vừa gọn vừa phù hợp ngữ cảnh.
- source_word: לְכָל כְּלֵיהֶם
  choice: cùng mọi dụng cụ
  rationale: כְּלִים có nghĩa rộng là vật dụng, dụng cụ hay trang thiết bị; ở đây “dụng cụ” phù hợp với các bộ phận và đồ dùng liên quan.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: và mọi công việc liên quan
  rationale: עֲבֹדָה có thể là công việc, sự phục vụ hoặc nhiệm vụ. Cách dịch này tự nhiên, đồng thời giữ quan hệ của các vật ấy với toàn bộ công việc được giao.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: Các ngươi phải chỉ định đích danh
  rationale: פקד với בְשֵׁמוֹת nói đến việc phân công hoặc chỉ định theo từng tên, chứ không chỉ kiểm đếm.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: những vật họ có trách nhiệm mang
  rationale: Cụm Hê-bơ-rơ cô đọng kết hợp “vật”, “trách nhiệm/phận sự” và “gánh/vật mang”. Bản dịch chuyển tải ý nghĩa thực tế mà không áp đặt người nhận trách nhiệm ngoài điều ngữ cảnh cho thấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” vì lời truyền trực tiếp ở số nhiều; giữ thuật ngữ vật chất cụ thể của Đền Tạm, nhưng diễn đạt mệnh đề cuối theo lối tiếng Việt tự nhiên. Dấu chú thích [a] xuất hiện đúng trong chính văn.
