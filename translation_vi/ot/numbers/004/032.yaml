  to: cùng các trụ bao quanh sân, các đế, các cọc và các dây của chúng, cùng mọi vật dụng và mọi công việc phục vụ của chúng. Các ngươi phải chỉ định đích danh các vật dụng thuộc trách nhiệm mang vác của họ[a].
