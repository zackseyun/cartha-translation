  source_fidelity: Bản thảo truyền đạt đúng các thành phần vật chất và mệnh lệnh phân công theo tên. Tuy nhiên, “mọi công việc liên quan” làm nhạt עֲבֹדָתָם, vốn chỉ công việc phục vụ/phận sự được giao; câu cuối nên giữ rõ hơn quan hệ giữa các vật dụng và trách nhiệm mang vác.
  naturalness: Văn phong nhìn chung tự nhiên. “Các trụ bao quanh sân” rõ hơn “các trụ quanh sân,” và “công việc phục vụ” vừa tự nhiên vừa sát ngữ cảnh phục vụ Lều Hội Kiến.
  terminology: “Trụ,” “đế,” “cọc,” và “dây” là các lựa chọn phù hợp. “Vật dụng” phù hợp hơn “vật” trong cụm cuối, vì כְּלֵי chỉ các đồ vật/trang bị được giao để mang. “Phận sự” trong chú thích bảo lưu sắc thái מִשְׁמֶרֶת.
