  yaml_path: translation/ot/numbers/004/021.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng wayyiqtol tiếp nối mạch kể chuyện; “Rồi” diễn đạt trình tự tự nhiên, còn “phán” phù hợp với lời Đức Chúa Trời nói trong văn phong Kinh Thánh trang trọng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Trong công thức chỉ hành vi nói, אֶל được diễn đạt tự nhiên là “với”; tên מֹשֶׁה theo dạng tiếng Việt quen dùng là “Môi-se”.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Trong công thức dẫn nhập lời nói, “rằng:” chuyển tự nhiên sang lời trực tiếp sắp theo sau, đồng thời giữ chức năng đánh dấu diễn ngôn.
theological_decisions:
- issue: Cách dịch danh thần יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn trực tiếp dùng Tứ Tự Danh. Bản dịch giữ đây là danh riêng qua dạng “Giê-hô-va” quen thuộc trong tiếng Việt, không âm thầm thay bằng tước hiệu; “Đức” là yếu tố xưng kính tự nhiên.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ công thức mở đầu lời phán nhưng dùng “rằng:” thay cho lối dịch cứng “mà rằng”. Không có chú thích nên không đặt dấu chú thích trong chính văn.
