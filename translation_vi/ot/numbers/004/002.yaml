  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: vi
  text: Hãy kiểm kê con cháu Kê-hát trong số con cháu Lê-vi[a], theo các thị tộc của họ, theo nhà của tổ phụ họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “hãy nâng đầu con cháu Kê-hát,” một thành ngữ có nghĩa là kiểm kê hoặc đếm số người.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Hãy kiểm đếm
  rationale: Cụm này theo nghĩa đen là “nâng đầu”, nhưng trong ngữ cảnh hành chính và kiểm kê dân số mang nghĩa đếm hoặc lập danh sách. “Kiểm đếm” truyền đạt rõ hành động thống kê mà không gây hiểu lầm theo nghĩa đen.
- source_word: בְּנֵי קְהָת
  choice: con cháu Kê-hát
  rationale: בְּנֵי trong văn cảnh gia phả có thể chỉ hậu duệ, không chỉ các con trai trực tiếp. “Con cháu Kê-hát” tự nhiên và chính xác hơn trong tiếng Việt hiện đại.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: trong số con cháu Lê-vi
  rationale: מִתּוֹךְ diễn tả việc chọn một nhóm nằm trong một tập thể lớn hơn; “trong số” thể hiện rõ con cháu Kê-hát là một bộ phận của con cháu Lê-vi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc
  rationale: Trong các cuộc kiểm kê của sách Dân Số, מִשְׁפָּחָה thường chỉ đơn vị thân tộc cấp thị tộc. Cách dịch này giúp phân biệt với đơn vị “gia tộc phụ hệ” tiếp theo.
- source_word: לְבֵית אֲבֹתָם
  choice: theo từng gia tộc phụ hệ của họ
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “nhà của các cha”, chỉ đơn vị thân tộc được xác định theo dòng cha. “Gia tộc phụ hệ” bảo toàn nét cấu trúc xã hội này mà vẫn rõ nghĩa trong tiếng Việt.
theological_decisions: []
