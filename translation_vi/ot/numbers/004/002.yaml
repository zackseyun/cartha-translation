revisions:
- from: Hãy kiểm đếm con cháu Kê-hát trong số con cháu Lê-vi[a], theo từng thị tộc và từng gia tộc phụ hệ của họ.
  to: Hãy kiểm kê con cháu Kê-hát trong số con cháu Lê-vi[a], theo các thị tộc của họ, theo nhà của tổ phụ họ.
  rationale: 'Bản sửa giữ nghĩa kiểm kê của thành ngữ Hê-bơ-rơ, quan hệ “trong số” với con cháu Lê-vi, và hai cấp phân loại được nêu riêng: thị tộc và nhà của tổ phụ. Nó tránh diễn giải quá mức “nhà của tổ phụ” thành một thuật ngữ xã hội học hiện đại.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T08:37:09Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh kiểm kê và quan hệ Kê-hát là một nhóm thuộc con cháu Lê-vi. Tuy nhiên, לְבֵית אֲבֹתָם nghĩa sát là “theo nhà của tổ phụ/cha ông họ” (một đơn vị gia hệ), không nên chuyển thành “gia tộc phụ hệ,” vì cách này vừa diễn giải vừa dễ làm mờ thuật ngữ hành chính-gia phả riêng của nguyên văn.
  naturalness: “Hãy kiểm kê” tự nhiên và chuẩn xác hơn “Hãy kiểm đếm” trong ngữ cảnh một cuộc thống kê nhân sự. “Theo các thị tộc của họ, theo nhà của tổ phụ họ” là văn phong Việt hiện đại trang trọng, đồng thời giữ được hai bình diện phân loại trong tiếng Hê-bơ-rơ.
  terminology: Giữ “con cháu Kê-hát/Lê-vi” là có thể chấp nhận trong văn cảnh gia phả. Dùng “thị tộc” cho מִשְׁפָּחָה. Dùng “nhà của tổ phụ” cho בֵּית אָב thay vì thuật ngữ xã hội học “gia tộc phụ hệ.” Chú thích nên nói “kiểm kê dân số” thay vì “lập danh sách dân số.”
  issues:
  - severity: medium
    issue: “gia tộc phụ hệ” không phản ánh trực tiếp cụm לְבֵית אֲבֹתָם.
    rationale: Nguyên văn nói theo “nhà của tổ phụ/cha ông họ,” một cách gọi đơn vị gia hệ. “Gia tộc phụ hệ” là một diễn giải khái quát và có thể chồng lấn nghĩa với “thị tộc,” trong khi bản văn nêu hai đơn vị riêng.
  - severity: low
    issue: “kiểm đếm” và “lập danh sách dân số” kém chính xác/tự nhiên hơn thuật ngữ kiểm kê trong ngữ cảnh này.
    rationale: Thành ngữ נָשָׂא אֶת־רֹאשׁ ở đây chỉ việc kiểm kê hay lấy số người; “kiểm kê” là cách diễn đạt hành chính tự nhiên và rõ nghĩa hơn.
  revised_text: Hãy kiểm kê con cháu Kê-hát trong số con cháu Lê-vi[a], theo các thị tộc của họ, theo nhà của tổ phụ họ.
