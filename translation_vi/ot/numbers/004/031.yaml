base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: vi
  text: 'Đây là nhiệm vụ khiêng vác của họ trong mọi công việc phục vụ trong Lều Hội Kiến: các khung của Đền Tạm[a], các thanh ngang, các trụ và các đế[b] của Đền Tạm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tấm ván của Đền Tạm”; từ Hê-bơ-rơ chỉ những bộ phận kết cấu dạng ván hoặc khung.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các ổ đế”, tức những bộ phận nền để đặt các khung hoặc trụ vào.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Đây là
  rationale: Mở đầu lời xác định phần việc được giao; tiếng Việt không cần dịch riêng liên từ וְ mà vẫn giữ tự nhiên và mạch văn.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: trách nhiệm về những vật họ phải khiêng
  rationale: Diễn đạt rõ cả trách nhiệm được giao và ý nghĩa cụ thể của מַשָּׂא là vật phải mang khi di chuyển, tránh sắc thái bóng của “gánh nặng”.
- source_word: לְכָל עֲבֹדָתָם
  choice: trong mọi công việc phục vụ
  rationale: Giữ phạm vi toàn bộ phần việc và sắc thái phục vụ liên quan đến nơi thánh, nhưng dùng ngôn ngữ hiện đại, dễ hiểu.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: Danh xưng quen thuộc, trang trọng; “tại” phù hợp vì đây là phạm vi phục vụ, dù các vật được liệt kê là những bộ phận kết cấu.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: các khung của Đền Tạm
  rationale: קֶרֶשׁ có thể chỉ các tấm ván hay bộ phận khung kết cấu; “khung” nêu bật chức năng kiến trúc, còn phương án “ván” được ghi chú.
- source_word: בְרִיחָיו
  choice: các thanh ngang
  rationale: Các thanh này liên kết những bộ phận khung; “thanh ngang” rõ chức năng hơn “thanh” mà không giải thích quá mức.
- source_word: עַמּוּדָיו
  choice: các trụ
  rationale: Từ hiện đại, tự nhiên cho các bộ phận chống đỡ thẳng đứng.
- source_word: אֲדָנָיו
  choice: các đế
  rationale: Chỉ những bộ phận nền để khung hoặc trụ được đặt vào; “đế” rõ ràng hơn thuật ngữ kỹ thuật “ổ đế”.
