  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: vi
  text: Ranh giới sẽ đi xuống từ Sê-pham đến Ríp-la, ở phía đông A-in,[a] rồi ranh giới sẽ tiếp tục đi xuống và chạm đến sườn phía đông của biển Ki-nê-rết.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “về phía đông của A-in.” Cụm từ Hê-bơ-rơ định vị Ríp-la ở phía đông A-in.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “chạm vào vai của biển Ki-nê-rết về phía đông”; trong cách nói địa lý, “vai” chỉ cạnh hoặc sườn của địa hình gần mặt nước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: đi xuống
  rationale: Giữ nghĩa chỉ hướng và địa hình của động từ ירד, đồng thời phù hợp với văn cảnh mô tả đường ranh giới.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: ranh giới
  rationale: גְּבוּל chỉ đường biên của lãnh thổ; “ranh giới” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: מִשְּׁפָם
  choice: từ Sê-pham
  rationale: Phiên âm địa danh Hê-bơ-rơ và thể hiện rõ điểm xuất phát.
- source_word: הָרִבְלָה
  choice: Ríp-la
  rationale: Phiên âm địa danh Hê-bơ-rơ; hướng chuyển động đến địa điểm này đã được thể hiện bằng cấu trúc “từ… đi xuống…”.
- source_word: מִקֶּדֶם לָעָיִן
  choice: ở phía đông A-in
  rationale: Cụm từ định vị Ríp-la so với A-in; cách dịch này rõ ràng, tự nhiên và giữ phương hướng của nguyên văn.
- source_word: וּמָחָה
  choice: chạm đến
  rationale: Trong văn cảnh địa giới, động từ diễn tả đường biên đi tới và tiếp giáp một đặc điểm địa hình; “chạm đến” giữ được sắc thái tiếp xúc của nguyên văn.
- source_word: עַל כֶּתֶף
  choice: sườn
  rationale: כֶּתֶף nghĩa đen là “vai”, nhưng trong cách dùng địa lý chỉ cạnh hoặc sườn địa hình; “sườn” dễ hiểu mà vẫn gần hình ảnh nguyên văn.
- source_word: יָם כִּנֶּרֶת
  choice: biển Ki-nê-rết
  rationale: Giữ cách gọi và địa danh trong nguyên văn thay vì thay bằng tên gọi về sau.
- source_word: קֵדְמָה
  choice: phía đông
  rationale: Trạng từ xác định phía đông của biển Ki-nê-rết; được kết hợp tự nhiên thành “sườn phía đông” trong tiếng Việt.
