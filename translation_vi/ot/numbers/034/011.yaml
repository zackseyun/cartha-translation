  register: Văn phong trang trọng, sáng rõ và phù hợp với lối mô tả địa giới. Dùng “ranh giới” nhất quán, phiên âm các địa danh theo âm Hê-bơ-rơ, đồng thời giữ hình ảnh địa hình của nguyên văn trong chú thích thay vì đưa cách nói khó hiểu vào câu chính.
