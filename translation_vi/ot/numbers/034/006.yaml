translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ lối xưng hô số nhiều trực tiếp trong lời phán; giữ danh xưng “Biển Lớn” và bảo toàn sự lặp lại của câu Hê-bơ-rơ.
