  text: וּ/גְב֣וּל יָ֔ם וְ/הָיָ֥ה לָ/כֶ֛ם הַ/יָּ֥ם הַ/גָּד֖וֹל וּ/גְב֑וּל זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/006.yaml
  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: vi
  text: Biên giới phía tây của các ngươi sẽ là Biển Lớn làm ranh giới[a]; đó sẽ là biên giới phía tây của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có thể dịch sát là “biên giới biển” hoặc “ranh giới về phía biển.” Trong ngữ cảnh xác định địa giới này, từ Hê-bơ-rơ יָם (“biển”) cũng được dùng để chỉ hướng tây.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: biên giới / ranh giới
  rationale: Danh từ chỉ đường giới hạn của một lãnh thổ. “Biên giới” tự nhiên trong công thức mô tả các phía của đất; “ranh giới” phù hợp khi nói Biển Lớn có chức năng làm đường phân định.
- source_word: יָם
  choice: phía tây
  rationale: Trong cụm גְּבוּל יָם, “biển” mang nghĩa phương hướng, tức phía hướng ra biển, là phía tây trong địa lý của đoạn này.
- source_word: הַיָּם הַגָּדוֹל
  choice: Biển Lớn
  rationale: Giữ nguyên danh xưng địa lý theo tiếng Hê-bơ-rơ, chỉ Địa Trung Hải, thay vì thay thế bằng tên gọi hiện đại.
- source_word: וְהָיָה לָכֶם
  choice: của các ngươi sẽ là
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ ý phân định cho cộng đồng được xưng hô ở số nhiều.
- source_word: וּגְבוּל
  choice: làm ranh giới
  rationale: 'Hiểu danh từ này theo chức năng đồng vị của Biển Lớn: biển ấy cấu thành đường ranh.'
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל יָם
  choice: đó sẽ là biên giới phía tây của các ngươi
  rationale: Giữ công thức tổng kết và sự lặp lại có chủ ý của nguyên văn, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt.
