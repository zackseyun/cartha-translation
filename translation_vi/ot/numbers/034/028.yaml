base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/028.yaml
  text: 'And for the tribe of the sons of Naphtali[a], a leader: Pedahel son of Ammihud.'
translation:
  language: vi
  text: Còn về chi tộc các con trai của Nép-ta-li[a], người lãnh đạo là Pê-đa-ên, con trai Am-mi-hút.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Nép-ta-li”, một cách gọi chi tộc quen thuộc, có nghĩa là các hậu duệ của Nép-ta-li.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Còn về chi tộc
  rationale: Trong ngữ cảnh phân chia đất cho các chi tộc, מַטֶּה chỉ “chi tộc”, không phải nghĩa cụ thể là “gậy”; וּלְ được diễn đạt tự nhiên là “Còn về” trong mạch liệt kê.
- source_word: בְנֵי
  choice: các con trai của
  rationale: Giữ nghĩa trực tiếp của danh từ giống đực số nhiều trong cụm định danh chi tộc; chú thích cho biết cụm này được dùng rộng hơn để chỉ hậu duệ.
- source_word: נַפְתָּלִי
  choice: Nép-ta-li
  rationale: Phiên âm tên riêng theo cách viết Kinh Thánh quen thuộc và dễ đọc trong tiếng Việt.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Trong danh sách hành chính này, từ chỉ người đứng đầu được bổ nhiệm của chi tộc; “người lãnh đạo” rõ nghĩa và tránh sắc thái quân chủ của “hoàng tử”.
- source_word: פְּדַהְאֵל
  choice: Pê-đa-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Công thức phụ danh thông thường, trực tiếp biểu thị quan hệ cha-con.
- source_word: עַמִּיהוּד
  choice: Am-mi-hút
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt.
theological_decisions: []
