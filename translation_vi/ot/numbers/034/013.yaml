  text: וַ/יְצַ֣ו מֹשֶׁ֔ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָ/הּ֙ בְּ/גוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֛ת לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: vi
  text: 'Môi-se truyền cho con dân Y-sơ-ra-ên rằng: “Đây là xứ mà anh em sẽ nhận làm cơ nghiệp bằng cách rút thăm, là xứ Đức Giê-hô-va đã truyền phải ban cho chín bộ tộc và nửa bộ tộc.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Diễn đạt tự nhiên một công thức chỉ cộng đồng dân Israel, không giới hạn vào nam giới theo nghĩa sinh học.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: anh em sẽ nhận làm cơ nghiệp
  rationale: Giữ sắc thái của động từ נחל về việc nhận và sở hữu phần đất được ban làm cơ nghiệp.
- source_word: בְּגוֹרָל
  choice: theo cách bắt thăm
  rationale: Nêu rõ phương thức phân chia đất bằng lá thăm.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh giao ước đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt, đồng thời phân biệt với danh xưng chung 'Chúa'.
- source_word: לָתֵת
  choice: ban cho
  rationale: Dịch động từ nguyên mẫu chủ động 'ban/cho', với Đức Giê-hô-va là chủ thể của mệnh lệnh.
- source_word: תִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: chín bộ tộc và nửa bộ tộc
  rationale: Phản ánh trực tiếp cách đếm các đơn vị bộ tộc trong nguyên văn.
theological_decisions:
- issue: Chủ thể và ý nghĩa của לָתֵת
  choice: “Đức Giê-hô-va đã truyền ban cho”
  alternative: “Đức Giê-hô-va đã truyền phải giao cho”
  rationale: Cấu trúc Hê-bơ-rơ có nguyên mẫu 'ban/cho' sau 'truyền'; bản dịch giữ cách hiểu tự nhiên rằng chính Đức Giê-hô-va ban xứ ấy, nhưng không thêm tác nhân trung gian.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; giữ thuật ngữ Kinh Thánh quen thuộc “cơ nghiệp”, đồng thời dùng “bộ tộc” để diễn đạt rõ מַטֶּה trong ngữ cảnh phân chia đất.
