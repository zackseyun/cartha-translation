revisions:
- from: Đó là những người Đức Giê-hô-va đã truyền phải phân chia sản nghiệp cho con dân Y-sơ-ra-ên trong xứ Ca-na-an.[a]
  to: Đó là những người mà Gia-vê đã truyền cho họ phân chia phần sản nghiệp cho con cháu Y-sơ-ra-ên trong đất Ca-na-an.[a]
  rationale: Bản sửa dùng “Gia-vê” theo lựa chọn Yahweh của audit trail, chỉnh cú pháp tiếng Việt để nêu rõ những người này là người nhận lệnh, và dùng “phần sản nghiệp” cho rõ hành động phân định phần thừa kế. Chú thích bảo tồn cách diễn đạt thay thế thiên về “giao/ban sản nghiệp”, nhưng không biến sự khác biệt sắc thái thành một khẳng định diễn giải.
  reviewer_model: gpt-5.6-terra
