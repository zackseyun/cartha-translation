base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: vi
  text: Đó là những người mà Gia-vê đã truyền cho họ phân chia phần sản nghiệp cho con cháu Y-sơ-ra-ên trong đất Ca-na-an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đó là những người mà Gia-vê đã truyền giao sản nghiệp cho con cháu Y-sơ-ra-ên trong đất Ca-na-an.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Đó là những người
  rationale: Cụm chỉ định kết hợp đại từ quan hệ dùng để kết lại danh sách những người đã được nêu; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ quy chiếu về người.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Giữ nghĩa thông thường của צוה là ra lệnh hoặc truyền, thay vì diễn giải thành việc bổ nhiệm.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: לְנַחֵל
  choice: phải phân chia sản nghiệp
  rationale: Dạng Hiphil của נחל trong ngữ cảnh phân đất diễn tả việc khiến dân nhận phần thừa kế, tức phân chia đất làm sản nghiệp. Từ “phải” biểu thị tự nhiên nội dung mệnh lệnh sau động từ “truyền”.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: cho con dân Y-sơ-ra-ên
  rationale: “Con dân Y-sơ-ra-ên” là cách gọi tập thể tự nhiên, trang trọng, tương ứng với “con cái của Y-sơ-ra-ên”; “cho” được thêm theo cú pháp tiếng Việt để nêu người nhận sản nghiệp.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: trong xứ Ca-na-an
  rationale: Giữ danh từ “xứ/đất” và địa danh Ca-na-an, phù hợp văn phong địa lý Kinh Thánh trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ ghi trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng bằng hình thức phiên âm quen thuộc trong tiếng Việt, không thay bằng tước hiệu “CHÚA”.
- issue: Chủ thể thực hiện việc phân chia sản nghiệp
  choice: những người được Đức Giê-hô-va truyền phải phân chia
  alternative: những người được Đức Giê-hô-va giao cho việc ban sản nghiệp
  rationale: Cấu trúc אֲשֶׁר צִוָּה ... לְנַחֵל có thể nhấn mạnh mệnh lệnh hoặc sự giao nhiệm vụ. Bản chính giữ nghĩa trực tiếp “truyền”, còn chú thích bảo tồn cách hiểu thiên về việc trao quyền phân đất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ sắc thái pháp lý-hành chính của việc phân đất làm sản nghiệp; dùng “con dân Y-sơ-ra-ên” như một cách gọi tập thể, không nhằm chỉ riêng nam giới.
