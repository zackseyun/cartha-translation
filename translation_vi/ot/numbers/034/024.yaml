base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/024.yaml
  text: 'And for the tribe of the sons of Ephraim[a], a leader: Kemuel son of Shiphtan.'
translation:
  language: vi
  text: Còn về chi phái của con cháu Ép-ra-im[a], người lãnh đạo là Kê-mu-ên, con trai Síp-tan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “các con trai của Ép-ra-im”, tức là các hậu duệ hoặc thành viên thuộc chi phái Ép-ra-im.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Còn về chi phái
  rationale: מַטֶּה theo nghĩa đen có thể là “gậy”, nhưng trong danh sách hành chính về các chi phái, từ này mang nghĩa thành ngữ là “chi phái”. וּ và לְ được diễn đạt tự nhiên là “Còn về” theo mạch liệt kê.
- source_word: בְנֵי אֶפְרַיִם
  choice: con cháu Ép-ra-im
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “các con trai của Ép-ra-im”, nhưng trong công thức bộ tộc, nó chỉ các hậu duệ hay thành viên của chi phái. “Con cháu” vừa giữ ý huyết thống vừa tự nhiên và bao quát trong tiếng Việt.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Trong ngữ cảnh này, từ này chỉ người đứng đầu hoặc đại diện được chỉ định cho chi phái; “người lãnh đạo” rõ nghĩa và tránh sắc thái hoàng gia có thể gây hiểu lầm của “hoàng tử”.
- source_word: קְמוּאֵל
  choice: Kê-mu-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối đọc tự nhiên, quen thuộc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Cấu trúc phụ hệ tiêu chuẩn; “con trai” chuyển tải trực tiếp nghĩa của בֶּן.
- source_word: שִׁפְטָן
  choice: Síp-tan
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, giữ phụ âm mở đầu và dạng tên dễ đọc.
theological_decisions: []
