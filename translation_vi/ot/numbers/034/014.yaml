translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “chi tộc” cho מַטֶּה và “phần sản nghiệp” cho phần đất thừa hưởng; giữ cấu trúc giải thích mở đầu bằng “Vì”.
