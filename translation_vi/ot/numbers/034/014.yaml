base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: vi
  text: Vì chi tộc của con cháu Ru-bên, theo từng gia tộc của họ,[a] và chi tộc của con cháu Gát, theo từng gia tộc của họ, cùng nửa chi tộc Ma-na-se, đã nhận phần sản nghiệp của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Theo từng gia tộc của họ” chỉ sự phân chia theo các đơn vị gia đình hoặc thị tộc phụ hệ trong mỗi chi tộc.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích/nguyên nhân nối với lời trước.
- source_word: לָקְחוּ
  choice: đã nhận
  rationale: Trong bối cảnh phân chia đất, động từ chỉ việc đã tiếp nhận phần được phân; cách dịch này tự nhiên trong tiếng Việt mà không làm mất tính hoàn tất.
- source_word: מַטֵּה
  choice: chi tộc
  rationale: Chỉ đơn vị bộ tộc Y-sơ-ra-ên trong bối cảnh phân đất; “chi tộc” là thuật ngữ Kinh Thánh rõ và quen thuộc.
- source_word: בְנֵי הָרְאוּבֵנִי / בְנֵי הַגָּדִי
  choice: con cháu Ru-bên / con cháu Gát
  rationale: Bảo tồn sắc thái phả hệ của cấu trúc Hê-bơ-rơ, đồng thời tự nhiên hơn cách dịch sát chữ “các con trai”.
- source_word: לְבֵית אֲבֹתָם
  choice: theo các gia tộc tổ tiên của họ
  rationale: Diễn đạt việc phân chia theo các đơn vị gia tộc phụ hệ bên trong mỗi chi tộc.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: cùng nửa chi tộc Ma-na-se
  rationale: Giữ cách hiểu thông thường rằng một nửa của chi tộc Ma-na-se đang được nói đến.
- source_word: נַחֲלָתָם
  choice: phần sản nghiệp của mình
  rationale: Thể hiện phần đất được phân làm cơ nghiệp, giữ sắc thái pháp lý và giao ước của נַחֲלָה.
