  - severity: medium
    issue: “Các gia tộc tổ tiên của họ” không tự nhiên và có sắc thái trùng lặp.
    rationale: “Gia tộc” đã chỉ đơn vị dòng họ; thêm “tổ tiên” không phải là cách diễn đạt thông dụng cho לְבֵית אֲבֹתָם. “Theo từng gia tộc của họ” phù hợp với ngữ cảnh phân chia và chú thích có thể bảo lưu sắc thái phụ hệ.
