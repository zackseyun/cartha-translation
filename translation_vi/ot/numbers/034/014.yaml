  to: Vì chi tộc của con cháu Ru-bên, theo từng gia tộc của họ,[a] và chi tộc của con cháu Gát, theo từng gia tộc của họ, cùng nửa chi tộc Ma-na-se, đã nhận phần sản nghiệp của họ.
  rationale: 'Bản sửa giữ nguyên ý nghĩa và trật tự cơ bản của nguyên văn: hai chi tộc được nêu theo từng gia tộc, cùng nửa chi tộc Ma-na-se, đã nhận sản nghiệp. Sửa các cụm chưa tự nhiên, làm rõ quan hệ sở thuộc, và điều chỉnh đại từ cuối câu để quy chiếu minh bạch đến các nhóm được liệt kê.'
