revisions:
- from: Rồi ranh giới sẽ đi xuống đến sông Giô-đanh, và điểm tận cùng của nó sẽ ở Biển Muối[a]. Đó sẽ là đất của anh em, với các ranh giới bao quanh.
  to: Rồi ranh giới sẽ đi xuống đến sông Giô-đanh, và các điểm cuối của nó sẽ ở Biển Muối[a]. Đó sẽ là đất đai của anh em, theo các ranh giới chung quanh.
  rationale: Sửa số ít thành số nhiều ở “các điểm cuối” để phản ánh תוֹצְאֹתָיו. Điều chỉnh mệnh đề kết để sát hơn với cụm “theo các ranh giới của nó chung quanh”, đồng thời giữ văn phong Việt hiện đại và trang trọng. Chú thích hiện có vẫn đúng, cần thiết và được giữ nguyên.
  reviewer_model: gpt-5.6-terra
