base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: vi
  text: Rồi ranh giới sẽ đi xuống đến sông Giô-đanh, và các điểm cuối của nó sẽ ở Biển Muối[a]. Đó sẽ là đất đai của anh em, theo các ranh giới chung quanh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “Biển Muối”, tức vùng nước ngày nay thường được gọi là Biển Chết.'
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: Rồi ... sẽ đi xuống
  rationale: Động từ ירד có nghĩa là “đi xuống”; trong bản mô tả địa giới, dạng tương lai diễn đạt đường ranh sẽ tiếp tục theo hướng được chỉ định.
- source_word: הַגְּבוּל
  choice: ranh giới
  rationale: גְּבוּל chỉ đường biên hoặc địa giới; “ranh giới” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: הַיַּרְדֵּנָה
  choice: đến sông Giô-đanh
  rationale: Hậu tố chỉ hướng biểu thị chuyển động về phía Giô-đanh. Thêm “sông” giúp độc giả Việt nhận biết địa danh mà không thay đổi ý nghĩa.
- source_word: תוֹצְאֹתָיו
  choice: điểm tận cùng của nó
  rationale: Trong văn cảnh phân định địa giới, danh từ số nhiều này chỉ điểm hoặc phần tận cùng của đường ranh; tiếng Việt tự nhiên dùng số ít tập hợp ở đây.
- source_word: יָם הַמֶּלַח
  choice: Biển Muối
  rationale: Giữ sát tên Hê-bơ-rơ, nghĩa đen là “Biển Muối”, thay vì thay trực tiếp bằng tên hiện đại “Biển Chết”.
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: Đó sẽ là đất của anh em
  rationale: Diễn đạt tự nhiên quan hệ sở hữu của לָכֶם trong lời phán dành cho cộng đồng Ít-ra-ên.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: với các ranh giới bao quanh
  rationale: Cụm từ mô tả miền đất được xác định bởi toàn bộ các đường ranh chung quanh; cách dịch này rõ ràng và không diễn giải quá mức.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp một đoạn mô tả địa giới. Dùng “anh em” cho đại từ số nhiều chỉ cộng đồng; giữ địa danh “Biển Muối” theo nguyên văn và giải thích tên gọi quen thuộc trong chú thích.
