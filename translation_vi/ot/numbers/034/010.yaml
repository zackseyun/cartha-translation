source:
  edition: WLC
  text: וְ/הִתְאַוִּיתֶ֥ם לָ/כֶ֖ם לִ/גְב֣וּל קֵ֑דְמָ/ה מֵ/חֲצַ֥ר עֵינָ֖ן שְׁפָֽמָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/010.yaml
  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: vi
  text: Các ngươi phải vạch[a] ranh giới phía đông cho mình, từ Hát-sa Ê-nan đến Sê-pham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kẻ đường” hoặc “định đường ranh giới”. Động từ Hê-bơ-rơ ở đây ít gặp và trong ngữ cảnh này nói đến việc vạch đường ranh giới.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: phải vạch
  rationale: Trong ngữ cảnh phân định lãnh thổ, động từ hiếm này chỉ việc vạch hoặc định đường ranh giới; “vạch” tự nhiên, rõ nghĩa và không nhập nghĩa thông dụng hơn của cùng gốc từ là ham muốn.
- source_word: לָכֶם
  choice: cho mình
  rationale: 'Giữ sắc thái thụ hưởng/phản thân: dân Y-sơ-ra-ên vạch ranh giới cho chính phần đất của họ.'
- source_word: לִגְבוּל
  choice: ranh giới
  rationale: גְּבוּל ở đây là đường phân định lãnh thổ; “ranh giới” phù hợp văn cảnh địa lý-pháp lý.
- source_word: קֵדְמָה
  choice: phía đông
  rationale: Chỉ cạnh phía đông của lãnh thổ; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: מֵחֲצַר עֵינָן
  choice: từ Hát-sa Ê-nan
  rationale: Phiên âm địa danh làm điểm đầu của đoạn ranh giới.
- source_word: שְׁפָמָה
  choice: đến Sê-pham
  rationale: Phiên âm địa danh làm điểm cuối của đoạn ranh giới; “từ… đến…” diễn đạt rõ phạm vi.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu mệnh lệnh pháp lý rõ ràng. Các địa danh được phiên âm theo lối quen thuộc trong tiếng Việt; không thêm cách giải thích thần học.
