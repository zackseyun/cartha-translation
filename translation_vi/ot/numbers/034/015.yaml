base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: vi
  text: Hai chi tộc và nửa chi tộc đã nhận phần thừa kế của mình bên kia sông Giô-đanh, gần Giê-ri-cô[a], về phía đông, hướng mặt trời mọc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bên kia sông Giô-đanh, tại Giê-ri-cô.”'
    reason: Cách gắn địa danh יְרֵחוֹ vào cụm chỉ vị trí có thể được diễn đạt là “tại Giê-ri-cô”; “gần Giê-ri-cô” định vị khu vực mà không diễn giải cụ thể quan hệ địa lý.
  - marker: b
    text: 'Tiếng Hê-bơ-rơ dùng một cách nói kép: “về phía đông, hướng mặt trời mọc,” nhằm nhấn mạnh phía đông.'
    reason: Giữ và giải thích phép nhấn mạnh do hai từ chỉ hướng đông đứng liền nhau.
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: hai chi tộc
  rationale: Trong bối cảnh phân chia đất, מַטֶּה là cách gọi một chi tộc, không phải cây gậy.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: và nửa chi tộc
  rationale: Chỉ đơn vị nửa chi tộc được công nhận trong việc phân đất, ở đây là nửa chi tộc Ma-na-se.
- source_word: לָקְחוּ
  choice: đã nhận
  rationale: Động từ Qal hoàn thành chỉ hành động đã hoàn tất; trong ngữ cảnh đất được phân làm cơ nghiệp, “đã nhận” tự nhiên hơn trong tiếng Việt, dù nghĩa sát của động từ là “đã lấy”.
- source_word: נַחֲלָתָם
  choice: phần thừa kế của mình
  rationale: נַחֲלָה chỉ phần đất được ban và truyền làm cơ nghiệp; “phần thừa kế” giữ được sắc thái phân chia đất.
- source_word: מֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: bên kia sông Giô-đanh, đối diện Giê-ri-cô
  rationale: Cụm từ xác định vùng ở phía bên kia sông Giô-đanh tại khu vực ngang với Giê-ri-cô; “đối diện” diễn đạt rõ tương quan địa lý mà không coi Giê-ri-cô là nơi nằm ngay trên bờ đông.
- source_word: קֵדְמָה מִזְרָחָה
  choice: về phía đông, hướng mặt trời mọc
  rationale: Giữ hai thành tố gần đồng nghĩa của tiếng Hê-bơ-rơ, vừa nêu phương hướng vừa nhấn mạnh phía mặt trời mọc.
