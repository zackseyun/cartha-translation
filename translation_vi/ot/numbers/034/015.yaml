translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “chi tộc” theo ngữ cảnh Ít-ra-ên và “phần thừa kế” cho thuật ngữ phân đất. Hai vế chỉ hướng đông được giữ lại thay vì giản lược.
