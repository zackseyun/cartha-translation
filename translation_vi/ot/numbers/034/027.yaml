source:
  edition: WLC
  text: וּ/לְ/מַטֵּ֥ה בְנֵי אָשֵׁ֖ר נָשִׂ֑יא אֲחִיה֖וּד בֶּן שְׁלֹמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/027.yaml
  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: vi
  text: Còn về chi tộc con cháu A-se, người lãnh đạo là A-hi-hút, con trai Sê-lô-mi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Còn về chi tộc
  rationale: Trong bối cảnh phân chia đất, מַטֶּה chỉ một chi tộc, không phải nghĩa cụ thể là gậy. וּלְ được diễn đạt tự nhiên là “Còn về” trong chuỗi liệt kê.
- source_word: בְנֵי אָשֵׁר
  choice: con cháu A-se
  rationale: בְנֵי theo nghĩa đen là “các con trai của”, nhưng trong danh xưng chi tộc, từ này chỉ những người thuộc dòng dõi A-se; “con cháu” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Từ này chỉ người đứng đầu hoặc đại diện chính thức của chi tộc trong việc phân chia đất; “người lãnh đạo” rõ ràng và không gợi hàm ý hoàng gia như “hoàng tử”.
- source_word: אֲחִיהוּד
  choice: A-hi-hút
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, giữ âm cuối của tên nguồn ở mức dễ đọc.
- source_word: בֶּן שְׁלֹמִי
  choice: con trai Sê-lô-mi
  rationale: Diễn đạt trực tiếp cấu trúc phụ hệ Hê-bơ-rơ và giữ rõ từ בֶּן là “con trai”.
theological_decisions: []
