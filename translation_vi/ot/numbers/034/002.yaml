  text: צַ֞ו אֶת בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי אַתֶּ֥ם בָּאִ֖ים אֶל הָ/אָ֣רֶץ כְּנָ֑עַן זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּפֹּ֤ל לָ/כֶם֙ בְּֽ/נַחֲלָ֔ה אֶ֥רֶץ כְּנַ֖עַן לִ/גְבֻלֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: vi
  text: '“Hãy truyền lệnh cho con dân Israel[a] và nói với họ: Khi anh em vào đất Canaan, đây là miền đất sẽ thuộc về anh em làm cơ nghiệp[b], tức là đất Canaan theo các ranh giới của nó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”, một cách gọi tập thể chỉ dân Israel.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn nói miền đất “sẽ rơi xuống cho anh em”, một thành ngữ chỉ phần đất được chỉ định hoặc được nhận làm cơ nghiệp.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Hãy truyền lệnh
  rationale: Động từ mệnh lệnh צוה mang sắc thái chỉ thị có thẩm quyền; “truyền lệnh” giữ được lực nghĩa ấy mà vẫn tự nhiên trong văn cảnh.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Israel”, nhưng ở đây chỉ toàn thể cộng đồng giao ước. “Con dân Israel” vừa trang trọng, dễ hiểu, vừa tránh khiến độc giả tưởng mệnh lệnh chỉ dành cho nam giới.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và nói với họ
  rationale: Diễn đạt trực tiếp chuỗi mệnh lệnh trong nguyên văn, không thêm ý giải thích.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: Khi anh em vào
  rationale: כִּי trong ngữ cảnh này mở đầu hoàn cảnh thời gian, còn phân từ בָּאִים hướng đến việc tiến vào sắp xảy ra. “Khi anh em vào” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: הָאָרֶץ כְּנָעַן
  choice: đất Canaan
  rationale: Phản ánh lối đặt đồng vị của nguyên văn bằng cách gọi địa danh quen thuộc, ngắn gọn và rõ nghĩa.
- source_word: זֹאת הָאָרֶץ
  choice: đây là miền đất
  rationale: Giữ lực chỉ định của זֹאת và mở đầu phần xác định lãnh thổ; “miền đất” phù hợp với vùng lãnh thổ sắp được mô tả.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם
  choice: sẽ được chia cho anh em
  rationale: נפל nghĩa đen là “rơi”, nhưng trong việc phân đất đây là thành ngữ chỉ phần đất được phân định, thường qua việc bắt thăm. Bản dịch chính truyền đạt nghĩa thành ngữ; nghĩa đen được giữ trong chú thích.
- source_word: בְּנַחֲלָה
  choice: làm cơ nghiệp
  rationale: נחלה chỉ phần sở hữu được thừa hưởng hoặc được ban để làm phần lâu dài. “Cơ nghiệp” giữ được sắc thái pháp lý và thần học của việc Israel nhận đất.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: đất Canaan theo các ranh giới của nó
  rationale: Giữ cách diễn đạt quy định lãnh thổ của nguyên văn và chuẩn bị cho phần mô tả các ranh giới tiếp theo.
theological_decisions:
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: Dịch là “con dân Israel” để chỉ toàn thể cộng đồng.
  alternative: “các con trai của Israel”
  rationale: Trong văn cảnh phân đất cho các chi tộc, cụm từ là tên gọi tập thể của dân Israel; dịch máy móc theo giống ngữ pháp có thể tạo hàm ý sai rằng chỉ nam giới được nghe hoặc thuộc về cộng đồng.
- issue: Sắc thái của תִּפֹּל trong việc nhận đất
  choice: Dịch thành ngữ là “sẽ được chia cho”.
  alternative: “sẽ rơi vào phần của”
  rationale: Cách dịch chính làm rõ hành động phân định lãnh thổ nhưng không quyết định vượt quá nguyên văn phương thức cụ thể; hình ảnh nghĩa đen và khả năng liên hệ đến bắt thăm được nêu trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh em” làm đại từ số nhiều hướng đến cộng đồng Israel, tự nhiên và ít cổ kính hơn “các ngươi”. “Cơ nghiệp” được giữ vì là thuật ngữ quen thuộc, súc tích cho phần đất thừa hưởng lâu dài. Cả hai dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong bản văn.
