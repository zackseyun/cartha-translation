base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: vi
  text: Từ núi Hô-rơ, các ngươi phải vạch đường biên giới đến Lê-bô Ha-mát[a]; điểm cuối của đường biên giới sẽ ở Xê-đát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ sát nghĩa là “lối vào Ha-mát”; có lẽ đây là một địa danh cố định, Lê-bô Ha-mát.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: Từ núi Hô-rơ
  rationale: Cụm Hê-bơ-rơ là địa danh quen dùng cho Núi Hô-rơ, với giới từ mang nghĩa “từ”.
- source_word: תְּתָאוּ
  choice: các ngươi phải vạch
  rationale: Trong ngữ cảnh xác định lãnh thổ, động từ chỉ việc vạch hoặc định tuyến đường biên; “vạch” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: לְבֹא חֲמָת
  choice: đến Lê-bô Ha-mát
  rationale: Dù có nghĩa sát chữ là “lối vào Ha-mát”, cụm này nhiều khả năng được dùng như một địa danh cố định; giữ dạng địa danh trong chính văn và ghi nghĩa sát chữ ở chú thích.
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: điểm cuối của đường biên giới
  rationale: Trong các mô tả địa giới, תּוֹצְאֹת chỉ điểm tận cùng hoặc nơi đường biên đi ra; cách dịch này rõ ràng trong tiếng Việt hiện đại.
- source_word: צְדָדָה
  choice: ở Xê-đát
  rationale: Đây là địa danh chỉ vị trí tận cùng của đường biên; hậu tố chỉ hướng có thể gợi nghĩa “về phía”, nhưng trong mệnh đề này “ở” diễn đạt tự nhiên vị trí điểm cuối.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “các ngươi” để phản ánh ngôi thứ hai số nhiều trong lời truyền trực tiếp; phiên âm các địa danh theo cách dễ đọc đối với độc giả Việt.
