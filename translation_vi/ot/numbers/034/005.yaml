  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: vi
  text: Rồi ranh giới sẽ đổi hướng từ Át-môn đến Khe Ai Cập[a], và điểm cuối của ranh giới sẽ ở biển[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Suối Ai Cập” hoặc “Wadi Ai Cập.” Từ Hê-bơ-rơ נחל thường chỉ khe nước hay lòng suối chảy theo mùa.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “các điểm cuối của nó”; tiếng Hê-bơ-rơ dùng hình thức số nhiều để nói về nơi đường ranh kết thúc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Rồi ... sẽ đổi hướng
  rationale: Trong văn cảnh mô tả địa giới, נסב chỉ việc đường ranh đổi hướng; cách diễn đạt này tự nhiên và giữ sắc thái tiếp diễn của chuỗi chỉ dẫn.
- source_word: הַגְּבוּל
  choice: ranh giới
  rationale: גְּבוּל ở đây là đường phân định lãnh thổ; “ranh giới” là cách nói thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מֵעַצְמוֹן
  choice: từ Át-môn
  rationale: Địa danh được phiên âm sang tiếng Việt.
- source_word: נַחְלָה מִצְרָיִם
  choice: đến Khe Ai Cập
  rationale: נחל thường chỉ khe nước hoặc lòng suối có thể chảy theo mùa, không nhất thiết là một con sông lớn; “Khe Ai Cập” tránh khiến người đọc nhầm với sông Nin.
- source_word: וְהָיוּ
  choice: sẽ ở
  rationale: Động từ nối giới thiệu vị trí tận cùng của đường ranh; tiếng Việt diễn đạt tự nhiên bằng “sẽ ở”.
- source_word: תּוֹצְאֹתָיו
  choice: điểm cuối của ranh giới
  rationale: Trong các bản văn địa giới, תוצאות chỉ nơi đường ranh đi tới hoặc chấm dứt. Cụm này truyền đạt rõ chức năng địa lý dù từ Hê-bơ-rơ có hình thức số nhiều.
- source_word: הַיָּמָּה
  choice: ở biển
  rationale: Dạng định hướng nghĩa đen là “về phía biển”, nhưng trong ngữ cảnh này chỉ nơi đường ranh kết thúc. Bản Hê-bơ-rơ chỉ nói “biển”, nên không đưa tên Địa Trung Hải vào chính văn.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Dùng “Khe Ai Cập” để phản ánh địa hình do נחל biểu thị, đồng thời giữ các cách dịch quen thuộc hơn trong chú thích. Mọi dấu chú thích đều xuất hiện trong chính văn.
