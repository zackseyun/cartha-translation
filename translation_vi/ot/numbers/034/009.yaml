  text: וְ/יָצָ֤א הַ/גְּבֻל֙ זִפְרֹ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו חֲצַ֣ר עֵינָ֑ן זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל צָפֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: vi
  text: Ranh giới sẽ chạy đến Xíp-rôn, rồi điểm tận cùng của nó sẽ là Ha-xa Ê-nan.[a] Đó sẽ là ranh giới phía bắc của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hê-bơ-rơ: “các điểm tận cùng của nó sẽ là Ha-xa Ê-nan.” Tiếng Hê-bơ-rơ dùng một cách diễn đạt số nhiều để nói về nơi ranh giới kết thúc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: sẽ chạy đến
  rationale: Trong phần mô tả địa giới, động từ יצא chỉ hướng chạy hoặc sự kéo dài của đường ranh giới; “chạy đến” tự nhiên trong tiếng Việt và không gợi chuyển động theo nghĩa đen.
- source_word: הַגְּבֻל
  choice: ranh giới
  rationale: גְּבוּל ở đây là đường phân định lãnh thổ; “ranh giới” là cách diễn đạt hiện đại, rõ nghĩa.
- source_word: זִפְרֹנָה
  choice: đến Xíp-rôn
  rationale: Tên địa danh được phiên âm; hậu tố chỉ hướng được thể hiện bằng “đến”.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: rồi điểm tận cùng của nó sẽ là
  rationale: תוֹצְאֹתָיו có hình thức số nhiều và theo nghĩa sát là “các lối ra/các điểm cuối của nó”, nhưng trong công thức mô tả địa giới, cụm này chỉ nơi đường biên kết thúc. Bản chính dùng số ít tập hợp tự nhiên trong tiếng Việt, đồng thời chú thích hình thức số nhiều của tiếng Hê-bơ-rơ.
- source_word: חֲצַר עֵינָן
  choice: Ha-xa Ê-nan
  rationale: Tên địa danh được phiên âm theo lối viết dễ đọc đối với độc giả tiếng Việt, không dịch nghĩa các thành tố.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: Đó sẽ là ... của anh em
  rationale: Cách diễn đạt này giữ ý đường biên vừa mô tả được xác định là ranh giới dành cho cộng đồng Y-sơ-ra-ên; “anh em” truyền đạt đại từ số nhiều theo văn phong hiện đại, trang trọng.
- source_word: גְּבֻל צָפוֹן
  choice: ranh giới phía bắc
  rationale: Cụm từ chỉ đường biên ở phía bắc; cách dịch này tự nhiên và chính xác trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng thuật ngữ địa lý tự nhiên, tránh lối nói cổ như “các ngươi”. Tên riêng được phiên âm nhất quán theo âm dạng Hê-bơ-rơ.
