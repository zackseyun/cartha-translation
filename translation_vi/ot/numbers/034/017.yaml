    rationale: “Mang ý khiến người khác nhận cơ nghiệp” có thể đổi thành “có sắc thái khiến người khác nhận cơ nghiệp” để diễn tả chính xác hơn đặc điểm ngữ nghĩa của động từ Hiphil.
