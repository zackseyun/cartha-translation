base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: vi
  text: 'Đây là tên của những người sẽ phân chia xứ ấy cho anh em làm cơ nghiệp: thầy tế lễ Ê-lê-a-sa và Giô-suê, con trai Nun[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ trao xứ ấy cho anh em làm cơ nghiệp” hoặc “sẽ khiến anh em được thừa hưởng xứ ấy.” Động từ Hê-bơ-rơ có sắc thái khiến người khác nhận cơ nghiệp hoặc giao phần cơ nghiệp cho họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Đây là tên
  rationale: Cụm chỉ định mở đầu một mệnh đề danh từ; cách diễn đạt này tự nhiên trong tiếng Việt và giới thiệu những người được nêu tên ngay sau đó.
- source_word: הָאֲנָשִׁים
  choice: những người
  rationale: Chỉ các nam lãnh đạo cụ thể được nêu tên; trong tiếng Việt, “những người” là cách gọi tự nhiên và không làm mất dữ kiện của ngữ cảnh.
- source_word: אֲשֶׁר יִנְחֲלוּ לָכֶם אֶת־הָאָרֶץ
  choice: sẽ phân chia xứ ấy cho anh em làm cơ nghiệp
  rationale: Động từ נחל ở thể Hiphil mang ý nghĩa khiến người khác nhận cơ nghiệp hoặc giao phần cơ nghiệp; “phân chia… làm cơ nghiệp” thể hiện vai trò phân bổ đất trong ngữ cảnh, còn chú thích bảo lưu các khả năng diễn đạt sát cấu trúc nguyên ngữ hơn.
- source_word: לָכֶם
  choice: cho anh em
  rationale: Đại từ số nhiều chỉ cộng đồng Ít-ra-ên là những người hưởng phần đất; “anh em” phù hợp lời phán hướng đến cộng đồng giao ước.
- source_word: אֶת הָאָרֶץ
  choice: xứ ấy
  rationale: Chỉ vùng đất đã được xác định trong văn cảnh; “xứ” là từ trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: thầy tế lễ Ê-lê-a-sa
  rationale: Giữ chức danh chính thức trước tên riêng theo trật tự tự nhiên của tiếng Việt và dùng dạng phiên âm quen thuộc.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: và Giô-suê, con trai Nun
  rationale: Dịch trực tiếp liên từ và thành ngữ phụ hệ; dấu phẩy giúp cụm đồng vị rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Vai trò của Ê-lê-a-sa và Giô-suê đối với việc nhận đất làm cơ nghiệp
  choice: sẽ phân chia xứ ấy cho anh em làm cơ nghiệp
  alternative: sẽ trao xứ ấy cho anh em làm cơ nghiệp; sẽ khiến anh em được thừa hưởng xứ ấy
  rationale: Bản dịch không trình bày hai người như những người thừa hưởng thay cho dân, nhưng như những người thi hành việc giao phần đất. Chú thích giữ lại sắc thái gây khiến của thể Hiphil và sự đa nghĩa chân thực của động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xứ”, “cơ nghiệp” và “thầy tế lễ” để giữ sắc thái Kinh Thánh quen thuộc; tên riêng được phiên âm theo lối phổ biến trong tiếng Việt.
