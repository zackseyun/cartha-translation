  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/016.yaml
  text: Then Yahweh spoke to Moses, saying,
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa trình thuật tiến sang lời phán kế tiếp. “Rồi” diễn đạt tự nhiên tính nối tiếp; “phán” phù hợp với lời của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc trong Kinh Thánh tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu nói năng tiếng Việt, “phán với Môi-se” diễn đạt tự nhiên đối tượng tiếp nhận lời phán.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã được chuẩn hóa và quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn nhập lời nói, “rằng” báo hiệu nội dung trực tiếp theo sau và tự nhiên hơn lối dịch sát hình thức “mà nói”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng trực tiếp danh riêng gồm bốn phụ âm YHWH. Bản dịch giữ đây là danh riêng chứ không thay bằng tước hiệu “CHÚA”; “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc, trang trọng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ công thức dẫn nhập lời phán ngắn gọn, đồng thời dùng dấu hai chấm để báo trước lời trực tiếp ở câu kế tiếp.
