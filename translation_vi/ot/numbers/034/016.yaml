  source_fidelity: 'Bản nháp truyền đạt đúng công thức tường thuật של וַיְדַבֵּר ... אֶל־מֹשֶׁה לֵאמֹר: hành động nói của Đức Chúa Trời hướng đến Môi-se và mở đầu lời trực tiếp tiếp theo. Tuy nhiên, cách ghi danh riêng cần nhất quán với quyết định dịch thuật của POB về יהוה.'
