translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc liệt kê của nguyên văn nhưng thêm “là” để tiếng Việt trôi chảy; tên riêng được phiên âm nhất quán theo âm Hê-bơ-rơ.
