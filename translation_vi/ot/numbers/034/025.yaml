  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי זְבוּלֻ֖ן נָשִׂ֑יא אֱלִיצָפָ֖ן בֶּן פַּרְנָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: vi
  text: Còn về chi tộc con cháu của Xê-bu-lun, người lãnh đạo là Ê-li-xa-phan, con trai của Pác-nác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Còn về chi tộc
  rationale: Trong ngữ cảnh phân chia đất và liệt kê các đại diện được chỉ định, מַטֶּה chỉ một chi tộc, không phải cây gậy; וּלְ được diễn đạt tự nhiên là “Còn về” để nối tiếp danh sách.
- source_word: בְנֵי זְבוּלֻן
  choice: con cháu Xê-bu-lun
  rationale: בְנֵי có nghĩa đen là “các con trai của”, nhưng trong tên gọi chi tộc, từ này chỉ chung hậu duệ; “con cháu” vừa giữ sắc thái gia phả vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: נָשִׂיא chỉ người đứng đầu hoặc đại diện được công nhận của chi tộc. “Người lãnh đạo” rõ nghĩa và tránh sắc thái quân chủ dễ gợi ra bởi “vương hầu” hay “hoàng tử”.
- source_word: אֱלִיצָפָן
  choice: Ê-li-xa-phan
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, với các âm tiết được phân tách để dễ đọc.
- source_word: בֶּן פַּרְנָךְ
  choice: con trai Pác-nác
  rationale: בֶּן là công thức gia phả thông thường, nghĩa là “con trai của”; trong tiếng Việt, “con trai Pác-nác” tự nhiên và không cần thêm “của”.
