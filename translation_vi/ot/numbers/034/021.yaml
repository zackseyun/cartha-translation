  register: Văn phong hiện đại, trang trọng và ngắn gọn, phù hợp với cấu trúc liệt kê. Dùng “bộ tộc” để diễn đạt מַטֶּה và giữ sự mơ hồ thật sự của giới từ לְ trong chú thích.
