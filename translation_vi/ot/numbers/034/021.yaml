  yaml_path: translation/ot/numbers/034/021.yaml
  text: 'From the tribe of Benjamin: Elidad son of Chislon[a].'
translation:
  language: vi
  text: 'Từ bộ tộc Bên-gia-min: Ê-li-đát, con trai Kít-lôn.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Cho bộ tộc Bên-gia-min.” Giới từ Hê-bơ-rơ trong danh sách các đại diện bộ tộc này có thể được hiểu theo cả hai cách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַטֵּה
  choice: Từ bộ tộc
  rationale: Trong danh sách các đại diện được chỉ định, giới từ לְ đi với מַטֶּה có thể chỉ mối liên hệ của người đại diện với bộ tộc. “Từ bộ tộc” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh, nhưng “Cho bộ tộc” cũng có thể hiểu được từ cấu trúc Hê-bơ-rơ.
- source_word: בִנְיָמִן
  choice: Bên-gia-min
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên bộ tộc.
- source_word: אֱלִידָד
  choice: Ê-li-đát
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối đọc tự nhiên, rõ ràng trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ cha–con trong cụm tên; tiếng Việt không cần thêm từ “của”.
- source_word: כִּסְלוֹן
  choice: Kít-lôn
  rationale: Phiên âm tên riêng Hê-bơ-rơ, giữ phụ âm đầu /k/ và cấu trúc âm tiết dễ đọc trong tiếng Việt.
