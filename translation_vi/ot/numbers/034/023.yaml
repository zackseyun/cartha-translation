  source_fidelity: 'Bản dịch hiểu đúng các thuật ngữ chủ yếu: בְּנֵי trong ngữ cảnh bộ tộc là “con cháu”, מַטֶּה là “chi phái/bộ tộc”, נָשִׂיא là người đứng đầu đại diện, và Ê-phốt là tên người. Tuy nhiên, cụm “con cháu Giô-sép, thuộc bộ tộc con cháu Ma-na-se” khiến quan hệ cú pháp dễ bị hiểu là con cháu Giô-sép ‘thuộc’ một bộ tộc, trong khi tiếng Hê-bơ-rơ đang xác định chi phái Ma-na-se là nhánh được nêu dưới Giô-sép.'
