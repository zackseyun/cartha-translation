base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: vi
  text: 'Về con cháu Giô-sép[a], tức chi phái con cháu Ma-na-se: một thủ lĩnh là Ha-ni-ên, con trai Ê-phốt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Giô-sép”; tương tự, phần sau là “các con trai của Ma-na-se”. Trong ngôn ngữ gia phả và bộ tộc, cách nói này chỉ con cháu hoặc hậu duệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי יוֹסֵף
  choice: Về con cháu Giô-sép
  rationale: בְּנֵי có nghĩa đen là “các con trai của”, nhưng trong ngữ cảnh gia phả và bộ tộc, cụm từ chỉ hậu duệ. “Con cháu” tự nhiên và rõ nghĩa trong tiếng Việt; chú thích giữ lại cách diễn đạt sát chữ.
- source_word: לְ/מַטֵּה
  choice: thuộc bộ tộc
  rationale: מַטֶּה có thể chỉ cây gậy, nhưng trong ngữ cảnh phân chia đất này là thuật ngữ chỉ bộ tộc. Giới từ לְ được diễn đạt tự nhiên bằng “thuộc” trong cấu trúc liệt kê.
- source_word: בְנֵי מְנַשֶּׁה
  choice: con cháu Ma-na-se
  rationale: Trong ngôn ngữ bộ tộc, cụm này chỉ hậu duệ của Ma-na-se. “Con cháu” tránh khiến độc giả hiểu rằng đây chỉ là các con trai trực tiếp.
- source_word: נָשִׂיא
  choice: một thủ lĩnh
  rationale: Trong danh sách hành chính này, từ này chỉ người đứng đầu đại diện cho bộ tộc. “Thủ lĩnh” trang trọng, dễ hiểu và không mang hàm ý hoàng gia như “hoàng tử”.
- source_word: חַנִּיאֵל
  choice: Ha-ni-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối Việt hóa rõ âm tiết.
- source_word: בֶּן אֵפֹד
  choice: con trai Ê-phốt
  rationale: Đây là cấu trúc phụ danh thông thường. Ê-phốt ở đây là tên người, không phải tên lễ phục của thầy tế lễ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con cháu” trong chính văn để truyền đạt đúng nghĩa bộ tộc, đồng thời ghi chú cách nói sát chữ của tiếng Hê-bơ-rơ. Giữ cấu trúc liệt kê rút gọn của câu nguồn.
