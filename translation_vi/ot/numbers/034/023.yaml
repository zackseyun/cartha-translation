  terminology: Giữ “con cháu” trong chính văn là phù hợp với nghĩa bộ tộc của בְּנֵי; chú thích bảo tồn nghĩa sát chữ “các con trai”. Giữ các dạng tên Giô-sép, Ma-na-se, Ha-ni-ên và Ê-phốt nhất quán. “Thủ lĩnh” truyền đạt tốt נָשִׂיא mà không gợi nghĩa vương thất.
