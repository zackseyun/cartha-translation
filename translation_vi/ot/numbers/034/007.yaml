  to: 'Và đây sẽ là ranh giới phía bắc của anh em: từ Biển Lớn, anh em phải vạch cho mình đường ranh giới đến Núi Hô-rơ[a][b].'
  rationale: Bản sửa giữ nguyên ý nghĩa, thứ tự và các địa danh của tiếng Hê-bơ-rơ, đồng thời phục hồi liên từ mở đầu, diễn đạt tính quy định của câu rõ hơn, và làm chú thích từ vựng có giá trị thông tin thay vì chỉ lặp lại chính văn.
