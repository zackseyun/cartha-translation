  text: וְ/זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֣וּל צָפ֑וֹן מִן הַ/יָּם֙ הַ/גָּדֹ֔ל תְּתָא֥וּ לָ/כֶ֖ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: vi
  text: 'Và đây sẽ là ranh giới phía bắc của anh em: từ Biển Lớn, anh em phải vạch cho mình đường ranh giới đến Núi Hô-rơ[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “anh em phải định đường ranh giới cho mình đến Núi Hô-rơ.” Trong văn cảnh mô tả địa giới, động từ Hê-bơ-rơ có thể chỉ việc vạch, định tuyến hoặc xác định đường ranh giới.'
    reason: lexical_alternative
  - marker: b
    text: “Biển Lớn” chỉ Địa Trung Hải.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה
  choice: Đây
  rationale: Mở đầu phần mô tả ranh giới kế tiếp; trong tiếng Việt, “Đây” tự nhiên và vẫn giữ được mạch văn luật định.
- source_word: יִהְיֶה לָ/כֶם גְּבוּל צָפוֹן
  choice: sẽ là ranh giới phía bắc của anh em
  rationale: Diễn đạt sắc thái quy định của thể vị hoàn bằng “sẽ là”; “của anh em” thể hiện לָכֶם theo cách tự nhiên trong tiếng Việt.
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: từ Biển Lớn
  rationale: Giữ nguyên danh xưng địa lý sát với tiếng Hê-bơ-rơ, thay vì đưa tên hiện đại vào chính văn.
- source_word: תְּתָאוּ לָ/כֶם
  choice: anh em hãy vạch đường ranh giới
  rationale: Trong văn cảnh địa giới, động từ chỉ việc vạch hoặc định tuyến ranh giới; “hãy” chuyển tải chức năng chỉ thị, còn chủ thể “anh em” thể hiện đại từ số nhiều.
- source_word: הֹר הָ/הָר
  choice: núi Hô-rơ
  rationale: Xử lý cụm từ như một địa danh và phiên âm theo cách dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “anh em” cho đại từ số nhiều chỉ cộng đồng Y-sơ-ra-ên. Giữ “Biển Lớn” trong chính văn và giải thích tên gọi hiện đại ở chú thích.
