  yaml_path: translation/ot/numbers/034/020.yaml
  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: vi
  text: 'Và về chi tộc con cháu của Si-mê-ôn: Sê-mu-ên, con trai A-mi-hút.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là “Sê-mu-ên”; tên này thường được phiên âm theo dạng quen thuộc là “Sa-mu-ên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Về chi tộc
  rationale: Trong ngữ cảnh hành chính phân chia đất, מַטֶּה chỉ đơn vị bộ tộc, không phải cây gậy hay nhánh cây. Tiếng Việt tự nhiên dùng “chi tộc”; liên từ וּ không nhất thiết phải dịch riêng trong công thức liệt kê này.
- source_word: בְּנֵי
  choice: con cháu
  rationale: Dạng số nhiều liên kết בְּנֵי theo nghĩa đen là “các con trai của”, nhưng trong tên gọi bộ tộc chỉ tập thể hậu duệ; “con cháu” truyền đạt đúng nghĩa và tự nhiên hơn trong tiếng Việt.
- source_word: שִׁמְעוֹן
  choice: Si-mê-ôn
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: שְׁמוּאֵל
  choice: Sê-mu-ên
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ Shemuel, giữ hình thức của tên trong câu này thay vì dùng dạng quen thuộc Sa-mu-ên.
- source_word: בֶּן
  choice: con trai
  rationale: Trong danh sách người lãnh đạo bộ tộc, בֶּן biểu thị quan hệ cha-con trực tiếp; “con trai” rõ nghĩa và chính xác.
- source_word: עַמִּיהוּד
  choice: A-mi-hút
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, với âm cuối phù hợp gần dạng nguồn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và gọn, phù hợp cấu trúc danh sách. Dùng “chi tộc con cháu” để diễn đạt tự nhiên công thức bộ tộc trong tiếng Hê-bơ-rơ; giữ dấu hai chấm để giới thiệu người đại diện.
