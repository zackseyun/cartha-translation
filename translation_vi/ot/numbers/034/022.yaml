  text: וּ/לְ/מַטֵּ֥ה בְנֵי דָ֖ן נָשִׂ֑יא בֻּקִּ֖י בֶּן יָגְלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/022.yaml
  text: 'And for the tribe of the sons of Dan[a], a leader: Bukki son of Jogli.'
translation:
  language: vi
  text: Về chi phái của con cháu Đan[a], người lãnh đạo là Bu-ki, con trai Giốc-li.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Đan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Còn chi phái ... thì
  rationale: Trong bối cảnh phân chia đất của Dân Số 34, מַטֶּה chỉ một chi phái, không phải cây gậy. Cấu trúc tiếng Việt này chuyển tự nhiên liên từ וּ và giới từ לְ trong công thức liệt kê.
- source_word: בְנֵי דָן
  choice: con cháu Đan
  rationale: בְנֵי theo nghĩa đen là “các con trai của”, nhưng trong công thức bộ tộc chỉ những người thuộc dòng dõi Đan. “Con cháu Đan” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái huyết thống của nguyên văn.
- source_word: נָשִׂיא
  choice: một thủ lĩnh
  rationale: Từ này chỉ người đứng đầu, đại diện cho chi phái trong việc phân chia đất; “thủ lĩnh” rõ nghĩa và không gợi sai rằng đây là một hoàng tử.
- source_word: בֻּקִּי
  choice: Bu-ki
  rationale: Phiên âm tên riêng Hê-bơ-rơ בֻּקִּי theo âm gần với nguyên ngữ và theo lối viết tên Kinh Thánh dễ đọc trong tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Cách diễn đạt trực tiếp quan hệ cha-con trong lời xác định danh tính.
- source_word: יָגְלִי
  choice: Giốc-li
  rationale: Phiên âm tên Hê-bơ-rơ יָגְלִי theo cách đọc gần nguyên ngữ; nguyên âm đầu qamats được thể hiện gần với âm “o/ô” trong tên này.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê của phân đoạn nhưng dùng “Còn ... thì có” để câu tự nhiên trong tiếng Việt; tên riêng được phiên âm thay vì theo quy ước tiếng Anh.
