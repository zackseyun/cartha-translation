  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: vi
  text: Rồi ranh giới sẽ vòng từ phía nam của Dốc Ác-ráp-bim[a] và băng qua đến Xin; các điểm cuối của nó sẽ ở phía nam Ca-đe Ba-nê-a. Rồi ranh giới sẽ kéo dài đến Hát-sa Át-đa và băng qua đến Át-môn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ác-ráp-bim có lẽ có nghĩa là “bọ cạp”; địa danh này cũng có thể dịch là “Dốc Bọ Cạp” hoặc “Đèo Bọ Cạp”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: sẽ vòng
  rationale: Trong mô tả địa giới, động từ này chỉ đường ranh đổi hướng hoặc uốn vòng; “sẽ vòng” tự nhiên và giữ được ý chuyển hướng.
- source_word: הַגְּבוּל
  choice: ranh giới
  rationale: Từ này chỉ đường phân định lãnh thổ; “ranh giới” rõ nghĩa và phù hợp văn cảnh địa lý.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: về phía nam dốc Ác-ráp-bim
  rationale: Cụm từ định vị đường ranh ở phía nam địa danh; מַעֲלֵה được dịch là “dốc”, còn Ác-ráp-bim được phiên âm như tên riêng.
- source_word: וְעָבַר צִנָה
  choice: đi qua về hướng Xin
  rationale: Động từ עָבַר diễn tả đường ranh đi qua, còn hậu tố chỉ hướng trong צִנָה cho biết chuyển động về phía Xin mà không nhất thiết xác định đường ranh đi vào hay xuyên qua nơi ấy.
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: điểm cuối của ranh giới sẽ ở
  rationale: Dạng số nhiều תּוֹצְאֹתָיו là cách dùng quen thuộc trong các mô tả địa giới để chỉ chỗ đường ranh kết thúc; tiếng Việt tự nhiên dùng số ít “điểm cuối” trong trường hợp này.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: ở phía nam Ca-đe Ba-nê-a
  rationale: Cụm giới từ xác định điểm cuối nằm về phía nam của Ca-đe Ba-nê-a.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: Từ đó, ranh giới sẽ kéo dài đến Hát-sa Át-đa
  rationale: Trong hành trình địa giới, יָצָא chỉ đường ranh tiếp tục vươn đến một địa điểm; “kéo dài đến” rõ ràng hơn lối dịch sát chữ “đi ra”.
- source_word: וְעָבַר עַצְמֹנָה
  choice: rồi đi qua về hướng Át-môn
  rationale: Giữ cùng cách diễn đạt với עָבַר và thể hiện hậu tố chỉ hướng gắn với địa danh Át-môn.
