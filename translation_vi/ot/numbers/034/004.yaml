  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “ranh giới” nhất quán làm chủ thể của hành trình địa giới; phiên âm các địa danh theo lối Việt hóa, đồng thời giữ nghĩa từ nguyên của Ác-ráp-bim trong chú thích.
