revisions:
- from: Phía nam của các ngươi sẽ bắt đầu từ hoang mạc Xin, dọc theo Ê-đôm; ranh giới phía nam của các ngươi sẽ bắt đầu từ đầu phía đông của Biển Muối.[a]
  to: Phía nam của các ngươi sẽ bắt đầu từ hoang mạc Xin, dọc theo Ê-đôm; ranh giới phía nam của các ngươi sẽ bắt đầu từ đầu mút Biển Muối, về phía đông.[a]
  rationale: Đổi «đầu phía đông của Biển Muối» thành «đầu mút Biển Muối, về phía đông» để không quyết định trước phạm vi cú pháp của קֵדְמָה. Các thành tố địa lý và sắc thái mô tả ranh giới còn lại được giữ nguyên.
  reviewer_model: gpt-5.6-terra
