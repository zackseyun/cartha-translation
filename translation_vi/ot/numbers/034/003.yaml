source:
  edition: WLC
  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: vi
  text: Phía nam của các ngươi sẽ bắt đầu từ hoang mạc Xin, dọc theo Ê-đôm; ranh giới phía nam của các ngươi sẽ bắt đầu từ đầu mút Biển Muối, về phía đông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ đầu mút phía đông của Biển Muối.” Biển Muối thường được gọi là Biển Chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: phía nam
  rationale: Trong công thức mô tả địa giới, פְּאַת chỉ một phía hay cạnh của lãnh thổ, còn נֶגֶב mang nghĩa phương hướng; “phía nam” tự nhiên và chính xác trong tiếng Việt.
- source_word: מִמִּדְבַּר צִן
  choice: từ hoang mạc Xin
  rationale: מִדְבָּר chỉ vùng hoang vu, khô cằn; “hoang mạc” là cách gọi địa lý trang trọng, dễ hiểu, và Xin là địa danh.
- source_word: עַל יְדֵי אֱדוֹם
  choice: dọc theo Ê-đôm
  rationale: Thành ngữ địa lý này có nghĩa “bên cạnh/dọc theo”; cách dịch không suy diễn rằng đây nhất thiết là một đường biên giới pháp lý của Ê-đôm.
- source_word: גְּבוּל נֶגֶב
  choice: ranh giới phía nam
  rationale: גְּבוּל trong ngữ cảnh phân định đất đai là ranh giới lãnh thổ; cụm tiếng Việt rõ nghĩa và tự nhiên.
- source_word: מִקְצֵה יָם הַמֶּלַח קֵדְמָה
  choice: từ đầu phía đông của Biển Muối
  rationale: קָצֶה là đầu mút hay tận cùng, còn קֵדְמָה xác định hướng đông. Trong bối cảnh địa lý, cụm này tự nhiên được hiểu là đầu mút phía đông của biển; chú thích bảo lưu khả năng hiểu trạng từ theo sát hình thức Hê-bơ-rơ.
- source_word: יָם הַמֶּלַח
  choice: Biển Muối
  rationale: Dịch trực tiếp địa danh Hê-bơ-rơ thay vì thay bằng tên gọi truyền thống “Biển Chết”.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: sẽ bắt đầu ... sẽ bắt đầu
  rationale: Trong mô tả địa giới, cấu trúc “sẽ là cho các ngươi” xác lập vị trí và điểm đầu; “sẽ bắt đầu” tạo câu tiếng Việt rõ ràng mà không thêm ý đường biên 'chạy' vốn không có trong động từ.
theological_decisions: []
translation_notes:
  register: Văn phong địa lý–pháp lý trang trọng nhưng hiện đại. Dùng “các ngươi” để diễn đạt số nhiều của לָכֶם và giữ sắc thái lời phán trực tiếp trong ngữ cảnh; giữ địa danh nguyên ngữ “Biển Muối” và giải thích tên gọi quen thuộc trong chú thích.
