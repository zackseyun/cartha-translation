base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/019.yaml
  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: vi
  text: 'Và đây là tên của những người ấy: đại diện cho bộ tộc Giu-đa là Ca-lép, con trai Giê-phu-nê.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Trong mạch văn liệt kê tiếp nối, cụm này giới thiệu danh tính những người được chỉ định. Tiếng Việt không cần dịch riêng liên từ וְ, vì sự tiếp nối đã rõ trong ngữ cảnh.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: tên những người ấy
  rationale: שְׁמוֹת là dạng liên kết, nghĩa là “tên của”; הָאֲנָשִׁים chỉ những người nam cụ thể vừa được nói đến trong ngữ cảnh. Cách diễn đạt này tự nhiên và vẫn xác định rõ nhóm người.
- source_word: לְמַטֵּה יְהוּדָה
  choice: đại diện cho bộ tộc Giu-đa
  rationale: Trong bối cảnh phân chia đất, מַטֶּה nghĩa là “bộ tộc”, không phải cây gậy; giới từ לְ biểu thị người được nêu thuộc về hoặc hành động thay mặt bộ tộc. Thêm “đại diện” làm rõ chức năng theo ngữ cảnh của câu 17–18 mà không thay đổi ý.
- source_word: כָּלֵב
  choice: Ca-lép
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: בֶּן יְפֻנֶּה
  choice: con trai Giê-phu-nê
  rationale: בֶּן tạo thành ngữ hệ phụ tử, được chuyển tự nhiên sang tiếng Việt là “con trai [của]”; tên יְפֻנֶּה được phiên âm theo lối dùng Kinh Thánh tiếng Việt.
