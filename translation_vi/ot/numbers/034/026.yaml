base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/026.yaml
  text: 'And for the tribe of the sons of Issachar, a leader: Paltiel son of Azzan.'
translation:
  language: vi
  text: Còn về bộ tộc các con trai Y-sa-ca, người lãnh đạo là Phan-ti-ên, con trai A-xan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Còn về bộ tộc
  rationale: Trong ngữ cảnh phân chia đất cho các bộ tộc, מַטֶּה chỉ một bộ tộc; וּ và לְ được diễn đạt tự nhiên trong cấu trúc liệt kê bằng “Còn về”.
- source_word: בְנֵי
  choice: con cháu
  rationale: בְנֵי theo nghĩa đen là “các con trai của”, nhưng trong tên gọi bộ tộc ở đây chỉ những người thuộc dòng dõi Y-sa-ca; “con cháu” truyền đạt đúng chức năng gia phả và tự nhiên trong tiếng Việt.
- source_word: יִשָׂשכָר
  choice: Y-sa-ca
  rationale: Tên riêng được phiên âm theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: Trong Dân Số 34, נָשִׂיא là người đứng đầu hoặc đại diện được chỉ định cho bộ tộc; “người lãnh đạo” rõ nghĩa và không gợi sai rằng đây là một hoàng tử.
- source_word: פַּלְטִיאֵל
  choice: Phan-ti-ên
  rationale: Tên riêng được phiên âm sang tiếng Việt; âm cuối của yếu tố thần danh אֵל được thể hiện theo dạng “ên” quen thuộc.
- source_word: בֶּן
  choice: con trai
  rationale: Đây là từ chỉ quan hệ trực tiếp trong công thức phụ danh; “con trai” vừa chính xác vừa tự nhiên.
- source_word: עַזָּן
  choice: A-xan
  rationale: Tên riêng được phiên âm gần với dạng Hê-bơ-rơ và phù hợp cách đọc tiếng Việt.
