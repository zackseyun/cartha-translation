base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”. Cách phiên âm khác: “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng wayyiqtol tiếp nối diễn tiến; “Rồi” diễn đạt tự nhiên tính kế tiếp trong lời thuật, còn “phán” phù hợp với lời Đức Chúa Trời nói trong văn phong Kinh Thánh tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Phiên âm danh riêng YHWH theo cách gọi đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế hoàn toàn bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, từ này diễn đạt tự nhiên đối tượng tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng đã thông dụng trong Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Phân từ giới thiệu lời nói trực tiếp được chuyển bằng dấu hai chấm trong tiếng Việt hiện đại; cách này tránh cụm “rằng rằng” hoặc “mà rằng” thiếu tự nhiên mà vẫn giữ chức năng dẫn nhập lời phán tiếp theo.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. “Đức Giê-hô-va” bảo tồn đây là danh riêng và là hình thức quen thuộc với đông đảo độc giả Việt; chú thích nêu dạng YHWH và các cách thể hiện khác để không che khuất chứng cứ nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn nhập lời phán nhưng dùng dấu hai chấm để lời Việt tự nhiên; câu này nối trực tiếp với nội dung lời phán ở câu kế tiếp.
