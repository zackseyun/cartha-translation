revisions:
- from: Các ngươi phải chọn từ mỗi bộ tộc một lãnh đạo để phân chia đất làm cơ nghiệp.[a]
  to: Các ngươi phải chọn, từ mỗi bộ tộc, một thủ lãnh để nhận vùng đất làm cơ nghiệp.[a]
  rationale: Sửa bản văn chính theo nghĩa Qal «nhận/thừa hưởng» của לִנְחֹל, thay vì nghĩa phân chia/cấp phần thuộc một cách diễn đạt gây khiến không có trong câu. Chú thích được rút gọn để nêu một cách dịch tương đương mà không gán cho động từ nghĩa phân bổ. Việc thêm «vùng» trước «đất» giúp chỉ lãnh thổ được hứa ban, không đổi nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:22:12Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa nghĩa của לִנְחֹל. Đây là dạng Qal của נחל, mang nghĩa nhận/thừa hưởng (chiếm hữu như cơ nghiệp), không phải dạng Hiphil «khiến nhận cơ nghiệp/phân chia». Dù văn mạch rộng nói về việc phân chia đất, riêng câu này không diễn đạt trực tiếp hành động phân chia.
  naturalness: Câu sửa dùng cấu trúc hiện đại, rõ ràng và vẫn giữ sắc thái chỉ thị trang trọng. «Thủ lãnh» là danh từ tự nhiên hơn «một lãnh đạo» trong cấu trúc chỉ một đại diện bộ tộc.
  terminology: «Bộ tộc», «thủ lãnh», «vùng đất» và «cơ nghiệp» phù hợp với ngữ cảnh hành chính-bộ tộc và thuật ngữ Kinh Thánh. Không nên để «phân chia» trong bản văn chính hoặc chú thích như một nghĩa từ vựng tương đương của hình thức động từ này.
  issues:
  - severity: high
    issue: Bản dịch chính dịch לִנְחֹל là «để phân chia đất làm cơ nghiệp».
    rationale: Hình thức Hê-bơ-rơ trong câu là Qal infinitive construct, nghĩa là «để nhận/thừa hưởng», trái với Hiphil thường diễn đạt việc cho hưởng hay phân chia. Văn mạch có thể giải thích vai trò đại diện của các thủ lãnh, nhưng không cho phép đổi nghĩa động từ trong câu.
  - severity: medium
    issue: Chú thích trình bày «phân chia hay cấp phần đất» như nghĩa được văn cảnh ưu tiên.
    rationale: Điều này đảo ngược giá trị ngữ pháp của hình thức hiện có và mâu thuẫn với nghĩa trực tiếp của câu. Nếu cần chú thích, chỉ nên nêu cách diễn đạt tương đương «thừa hưởng/nhận làm cơ nghiệp».
  - severity: low
    issue: «một lãnh đạo» kém tự nhiên trong cụm danh từ chỉ một viên chức bộ tộc.
    rationale: «Một thủ lãnh» rõ vai trò danh từ và phù hợp hơn với văn phong Kinh Thánh hiện đại.
  revised_text: Các ngươi phải chọn, từ mỗi bộ tộc, một thủ lãnh để nhận vùng đất làm cơ nghiệp.[a]
  revised_footnotes:
