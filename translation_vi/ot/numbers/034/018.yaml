translation:
  language: vi
  text: Các ngươi phải chọn, từ mỗi bộ tộc, một thủ lãnh để nhận vùng đất làm cơ nghiệp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “để thừa hưởng vùng đất.” Động từ Hê-bơ-rơ chỉ việc nhận hoặc chiếm hữu như cơ nghiệp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: lãnh đạo
  rationale: Trong bối cảnh hành chính của việc phân chia đất, từ này chỉ người đứng đầu hoặc đại diện được công nhận; “lãnh đạo” tự nhiên và tránh sắc thái hoàng gia của “hoàng tử”.
- source_word: אֶחָד נָשִׂיא אֶחָד מִמַּטֶּה
  choice: từ mỗi bộ tộc một lãnh đạo
  rationale: Sự lặp lại của אֶחָד nhấn mạnh mỗi bộ tộc có một người đại diện; cách diễn đạt này chuyển tải tự nhiên ý phân phối trong tiếng Việt.
- source_word: תִּקְחוּ
  choice: các ngươi phải chọn
  rationale: Động từ ở đây có lực chỉ thị đối với số nhiều. “Phải chọn” phù hợp với việc chỉ định người đại diện hơn cách dịch sát chữ “lấy”.
- source_word: לִנְחֹל
  choice: để phân chia ... làm cơ nghiệp
  rationale: Trong văn cảnh, các lãnh đạo được chọn để tham gia việc cấp phần đất cho các bộ tộc. Cách dịch này phản ánh nghĩa tác động của động từ trong lĩnh vực thừa hưởng, đồng thời chú thích bảo lưu khả năng hiểu là nhận đất làm cơ nghiệp.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Chỉ miền đất đang được phân chia cho Israel; “đất” là cách gọi rõ và tự nhiên trong câu này.
theological_decisions:
- issue: Vai trò của các lãnh đạo trong לִנְחֹל
  choice: phân chia đất làm cơ nghiệp
  alternative: nhận đất làm cơ nghiệp
  rationale: Ngữ cảnh gần, nhất là việc chỉ định các lãnh đạo hỗ trợ Ê-lê-a-sa và Giô-suê phân chia đất, nghiêng về hành động cấp hoặc phân bổ cơ nghiệp. Tuy vậy, hình thái và trường nghĩa của động từ cho phép cách hiểu liên quan đến nhận cơ nghiệp, nên không loại bỏ cách hiểu ấy mà ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để biểu thị đối tượng số nhiều trong lời truyền lệnh; “bộ tộc” và “cơ nghiệp” duy trì thuật ngữ Kinh Thánh quen thuộc mà vẫn rõ nghĩa.
