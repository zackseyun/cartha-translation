base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: vi
  text: 'Tôi lấy đâu ra thịt để cho cả dân này? Vì họ khóc lóc trước mặt tôi[a] và nói: ‘Hãy cho chúng tôi thịt để chúng tôi ăn.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khóc lóc với tôi” hoặc “lấy tiếng khóc gây sức ép lên tôi”. Thành ngữ Hê-bơ-rơ dịch sát là “khóc trên tôi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: Tôi lấy đâu ra
  rationale: Cụm nghi vấn hỏi về nguồn cung, đồng thời diễn tả sự bất lực và bức bách của Môi-se; cách nói này tự nhiên trong tiếng Việt.
- source_word: בָּשָׂר
  choice: thịt
  rationale: Trong ngữ cảnh lương thực, từ này chỉ thịt dùng làm thức ăn.
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: để cho cả dân này
  rationale: Giữ quan hệ mục đích của động từ nguyên mẫu và sắc thái tập thể số ít của עָם.
- source_word: כִּי
  choice: Vì
  rationale: Giới thiệu lý do cho lời than phiền của Môi-se.
- source_word: יִבְכּוּ עָלַי
  choice: họ khóc lóc trước mặt tôi
  rationale: Diễn đạt tự nhiên việc dân chúng khóc và hướng sức ép về phía Môi-se, nhưng không quyết định quá mức rằng họ chống đối ông.
- source_word: לֵאמֹר
  choice: và nói
  rationale: Giới thiệu trực tiếp nội dung lời yêu cầu; thêm liên từ tạo câu tiếng Việt tự nhiên.
- source_word: תְּנָה לָּנוּ
  choice: Hãy cho chúng tôi
  rationale: Truyền đạt rõ mệnh lệnh thức cùng đại từ chỉ người nhận.
- source_word: וְנֹאכֵלָה
  choice: để chúng tôi ăn
  rationale: Diễn đạt sắc thái ý nguyện hoặc mục đích của dạng cohortative trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Sắc thái của יִבְכּוּ עָלַי
  choice: khóc lóc trước mặt tôi
  alternative: khóc lóc với tôi; lấy tiếng khóc gây sức ép lên tôi
  rationale: Giữ được hình ảnh dân chúng khóc hướng về Môi-se mà không áp đặt sắc thái thù nghịch hay chỉ đơn thuần là vị trí.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tôi lấy đâu ra” chuyển tải tự nhiên lời than đầy bức bách; “cả dân này” giữ nghĩa tập thể của nguyên văn.
