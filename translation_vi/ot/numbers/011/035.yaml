    rationale: Tên Hê-bơ-rơ קִבְרוֹת הַתַּאֲוָה chứa thành tố taʾavah. Dạng «Ha-tha-a-va» phản ánh đầy đủ hơn tên riêng và phù hợp với việc chú thích nghĩa của tên.
  - severity: low
    issue: Cụm «lên đường đi Ha-xê-rốt» có thể chỉnh thành «lên đường đến Ha-xê-rốt».
    rationale: «Lên đường đến» tự nhiên, rõ đích đến trong tiếng Việt hiện đại, và không thêm nội dung vượt quá ngữ cảnh hành trình.
