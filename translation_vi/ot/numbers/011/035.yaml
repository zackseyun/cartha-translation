base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: vi
  text: Từ Kíp-rốt Ha-tha-a-va, dân chúng lên đường đến Ha-xê-rốt[a], rồi họ dừng lại tại Ha-xê-rốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kíp-rốt Ha-tha-a-va có nghĩa là “những ngôi mộ của lòng thèm muốn” hoặc “những ngôi mộ của dục vọng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקִּבְרוֹת הַתַּאֲוָה
  choice: Từ Kíp-rốt Ha-tha-va
  rationale: Đây là địa danh ghép từ các danh từ thông dụng, nhưng trong câu chuyện nó hoạt động như tên riêng; vì vậy phiên âm tên và ghi nghĩa trong chú thích.
- source_word: נָסְעוּ
  choice: lên đường
  rationale: Trong các trình thuật hành trình, נסע thường chỉ việc nhổ trại và bắt đầu di chuyển; “lên đường” tự nhiên và giữ được sắc thái khởi hành.
- source_word: הָעָם
  choice: dân chúng
  rationale: עם ở đây chỉ cộng đồng Ít-ra-ên như một tập thể; “dân chúng” là cách diễn đạt tự nhiên trong ngữ cảnh.
- source_word: חֲצֵרוֹת
  choice: Ha-xê-rốt
  rationale: Đây là tên riêng của một địa điểm nên được phiên âm sang tiếng Việt.
- source_word: וַיִּהְיוּ בַּחֲצֵרוֹת
  choice: rồi họ dừng lại tại Ha-xê-rốt
  rationale: Nghĩa sát là “và họ ở tại Ha-xê-rốt”; trong văn cảnh lộ trình, היה + ב chỉ việc dừng chân hoặc lưu lại. “Dừng lại tại” diễn đạt rõ và tự nhiên sắc thái ấy.
