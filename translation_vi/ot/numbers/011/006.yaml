source:
  edition: WLC
  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: vi
  text: Nhưng bây giờ lòng chúng tôi đã khô héo[a]; chẳng có gì cả ngoài ma-na trước mắt chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự sống của chúng tôi đã khô héo” hoặc, theo ngữ cảnh thức ăn, “lòng thèm ăn của chúng tôi đã khô héo.” Từ Hê-bơ-rơ נֶפֶשׁ có thể chỉ sự sống, bản thân, lòng/tâm hồn, hoặc sự thèm muốn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nhưng bây giờ
  rationale: Liên từ cùng trạng từ thời gian mang sắc thái tương phản với hoàn cảnh được nhắc đến trước đó; cách dịch này tự nhiên trong lời than phiền.
- source_word: נַפְשֵׁנוּ
  choice: sức sống của chúng tôi
  rationale: נֶפֶשׁ có thể chỉ sự sống, bản thân, tâm hồn hoặc sự thèm muốn. Kết hợp với יְבֵשָׁה, hình ảnh nói đến sinh lực bên trong bị khô héo; lựa chọn này giữ được phạm vi nghĩa rộng hơn so với chỉ dịch là “khẩu vị”.
- source_word: יְבֵשָׁה
  choice: đã khô héo
  rationale: Tính từ diễn tả tình trạng khô cạn, héo mòn; “đã khô héo” giữ hình ảnh cụ thể và phù hợp với lời than về thức ăn.
- source_word: אֵין כֹּל
  choice: chẳng có gì cả
  rationale: Cụm phủ định có כֹּל mang lực nhấn mạnh; “gì cả” thể hiện rõ sắc thái ấy trong tiếng Việt.
- source_word: בִּלְתִּי אֶל
  choice: ngoài
  rationale: Cấu trúc này loại trừ mọi thứ trừ một đối tượng; “ngoài” ngắn gọn và tự nhiên.
- source_word: הַמָּן
  choice: ma-na
  rationale: Danh từ có mạo từ chỉ thứ ma-na cụ thể, quen thuộc trong ngữ cảnh. Tiếng Việt không cần thêm từ chỉ định mà vẫn truyền đạt được ý này.
- source_word: עֵינֵינוּ
  choice: trước mắt chúng tôi
  rationale: Giữ nguyên hình ảnh về thứ duy nhất họ nhìn thấy, đồng thời là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của נֶפֶשׁ trong lời than về thức ăn
  choice: sức sống
  alternative: khẩu vị; tâm hồn; sự sống
  rationale: Bản dịch chính không thu hẹp từ này chỉ còn cảm giác thèm ăn, nhưng chú thích thừa nhận cách hiểu ấy do ngữ cảnh nói về thức ăn. Nhờ vậy, sự mơ hồ từ vựng của tiếng Hê-bơ-rơ được bảo toàn mà không áp đặt một quan niệm nhân học riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ hình ảnh “khô héo” và “trước mắt”; dùng “ma-na” theo lối phiên âm Kinh Thánh quen thuộc. Không thêm từ chỉ định tương đương “này” vì nguyên văn chỉ có mạo từ xác định.
