  source_fidelity: Bản thảo truyền đạt đúng cấu trúc tương phản, sự nhấn mạnh của “chẳng có gì cả,” tính loại trừ của “ngoài,” và thành ngữ “trước mắt chúng tôi.” Tuy nhiên, trong lời than trực tiếp về thực phẩm, נַפְשֵׁנוּ hợp với nghĩa “lòng/chính chúng tôi” có hàm ý sự thèm muốn hơn là “sức sống” theo nghĩa sinh lực. “Sức sống ... đã khô héo” vừa thu hẹp nghĩa theo hướng sinh lực vừa không tự nhiên bằng hình ảnh nguyên ngữ.
  naturalness: “Lòng chúng tôi đã khô héo” là lối diễn đạt tiếng Việt Kinh Thánh hiện đại, tự nhiên và vẫn giữ hình ảnh “khô” của nguyên văn. Câu được chỉnh dấu phẩy để liên kết chặt chẽ cụm loại trừ “chẳng có gì cả ngoài...”.
  terminology: Giữ “ma-na,” một dạng phiên âm Kinh Thánh quen dùng. Dùng “lòng” ở văn bản chính để không áp đặt nghĩa nhân học “tâm hồn” hay giới hạn hoàn toàn vào “khẩu vị”; chú thích nêu rõ lựa chọn “lòng thèm ăn” theo ngữ cảnh thức ăn.
