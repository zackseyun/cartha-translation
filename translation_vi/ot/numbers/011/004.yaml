  text: וְ/הָֽ/אסַפְסֻף֙ אֲשֶׁ֣ר בְּ/קִרְבּ֔/וֹ הִתְאַוּ֖וּ תַּאֲוָ֑ה וַ/יָּשֻׁ֣בוּ וַ/יִּבְכּ֗וּ גַּ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ מִ֥י יַאֲכִלֵ֖/נוּ בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: vi
  text: 'Đám người tạp nhạp ở giữa họ nổi lòng thèm khát mãnh liệt[a]; rồi con cái Y-sơ-ra-ên cũng lại khóc lóc và nói: “Ai sẽ cho chúng ta ăn thịt[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đám dân pha tạp.” Từ Hê-bơ-rơ này hiếm gặp và mang sắc thái chê trách, chỉ một đám đông không thuộc thành phần cốt lõi ở giữa dân Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ai sẽ cho chúng ta thịt để ăn?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: đám người tạp nhạp
  rationale: Danh từ tập hợp hiếm và mang sắc thái chê trách, chỉ một đám đông không thuộc thành phần cốt lõi ở giữa dân Y-sơ-ra-ên. Cách dịch này giữ được cả ý tập thể lẫn sắc thái tiêu cực.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: ở giữa họ
  rationale: Diễn đạt tự nhiên vị trí của đám người ấy trong cộng đồng/trại quân, đồng thời không buộc phải giải quyết dứt khoát sự căng thẳng số ít/số nhiều trong nguyên văn.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: nổi lòng thèm khát mãnh liệt
  rationale: Động từ đi với danh từ cùng gốc tạo ý nhấn mạnh. Tiếng Việt tự nhiên hơn khi biểu đạt cường độ bằng “mãnh liệt” thay vì mô phỏng cứng nhắc cấu trúc đồng căn.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: rồi ... cũng lại khóc lóc
  rationale: Ở đây שׁוּב có khả năng chỉ sự tái diễn của hành động khóc; “lại” chuyển tải nghĩa ấy tự nhiên hơn cách dịch theo hình ảnh “quay trở lại”.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên cũng
  rationale: Giữ hình thức chỉ quan hệ huyết thống/dân tộc của tiếng Hê-bơ-rơ trong một lối nói tiếng Việt quen thuộc và bao quát cộng đồng.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Ai sẽ cho chúng ta ăn thịt?
  rationale: Thể Hiphil của אכל có nghĩa khiến hoặc cho ăn. Cách dịch này tự nhiên, sát nghĩa và giữ “thịt” là thức ăn.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: giữ sắc thái chê trách của הָאסַפְסֻף và sức nhấn của thành ngữ đồng căn, nhưng diễn đạt tự nhiên bằng tiếng Việt. Không thêm từ chỉ thời gian tương ứng với “Now,” vì nguyên văn không có từ ấy.'
