  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của nguyên văn: הָאסַפְסֻף được chuyển bằng một danh ngữ tập hợp có sắc thái chê trách; cụm đồng căn הִתְאַוּוּ תַּאֲוָה được diễn đạt tự nhiên với cường độ nhấn mạnh; וַיָּשֻׁבוּ được chuyển theo nghĩa tái diễn bằng “lại”; và thể Hiphil trong מִי יַאֲכִלֵנוּ được bảo toàn qua “cho chúng ta ăn thịt.”'
