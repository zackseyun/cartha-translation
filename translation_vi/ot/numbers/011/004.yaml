  terminology: “Đám người tạp nhạp” giữ được sắc thái miệt thị của הָאסַפְסֻף mà không áp đặt nhận định sắc tộc hoặc giáo phái. “Con cái Y-sơ-ra-ên” là cách gọi Kinh Thánh quen thuộc, bao quát cộng đồng trong ngữ cảnh này. “Thịt” là thuật ngữ đúng cho בָּשָׂר ở đây.
