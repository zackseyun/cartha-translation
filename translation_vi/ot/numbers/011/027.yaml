  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: vi
  text: 'Bấy giờ, một người trẻ tuổi chạy đến báo cho Môi-se[a]: “Ên-đát và Mê-đát đang nói tiên tri trong trại.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người trẻ tuổi ấy chạy đến trình báo với Môi-se.” Mạo từ trong tiếng Hebrew có thể được dịch sát là “người trẻ tuổi ấy”; động từ cũng có thể dịch là “trình báo” hoặc “cho biết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: chạy đến
  rationale: Động từ רוץ diễn tả hành động chạy; “chạy đến” tự nhiên trong mạch kể và giữ được tính sống động của nguyên văn.
- source_word: הַנַּעַר
  choice: một người trẻ tuổi
  rationale: נַעַר có thể chỉ thiếu niên hoặc người trẻ tuổi. Nhân vật này chưa được giới thiệu trong lời kể, nên “một người trẻ tuổi” là cách diễn đạt tự nhiên; chú thích bảo lưu khả năng dịch mạo từ Hebrew theo nghĩa xác định.
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: báo cho Môi-se
  rationale: Hiphil của נגד có nghĩa là báo, thuật lại hoặc cho biết. “Báo cho” phù hợp với vai trò đưa tin và tránh lặp động từ “nói” ngay trước lời trực tiếp.
- source_word: וַיֹּאמַר
  choice: dấu hai chấm mở lời trực tiếp
  rationale: Thay vì dịch cứng là “và nói,” dấu hai chấm thể hiện tự nhiên trong tiếng Việt rằng nội dung lời báo theo sau, đồng thời vẫn bảo toàn trình tự kể chuyện.
- source_word: אֶלְדָּד וּמֵידָד
  choice: Ên-đát và Mê-đát
  rationale: Các tên riêng được phiên âm theo lối đọc quen thuộc và rõ ràng trong tiếng Việt.
- source_word: מִתְנַבְּאִים
  choice: đang nói tiên tri
  rationale: Phân từ Hitpael của נבא chỉ hoạt động tiên tri đang diễn ra. “Đang nói tiên tri” giữ sắc thái tiếp diễn và không giải thích thêm bản chất của hiện tượng.
- source_word: בַּמַּחֲנֶה
  choice: trong trại
  rationale: מַחֲנֶה chỉ trại của dân Y-sơ-ra-ên trong bối cảnh đồng hoang; “trong trại” là cách dịch trực tiếp và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nói tiên tri” để diễn đạt hoạt động tiên tri đang tiếp diễn mà không áp đặt cách giải thích thần học; giữ chú thích để phản ánh độ xác định của danh từ và phạm vi nghĩa của động từ báo tin.
