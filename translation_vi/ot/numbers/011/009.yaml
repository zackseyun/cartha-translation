  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: vi
  text: Khi sương sa xuống trên trại quân vào ban đêm[a], ma-na sa xuống trên đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và khi sương sa xuống trên trại quân ban đêm, ma-na sa xuống trên đó.” Tiếng Hê-bơ-rơ dùng cùng một động từ (“sa xuống”) cho cả sương lẫn ma-na, nhấn mạnh sự song hành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: Khi ... sa xuống
  rationale: Liên từ וּ kết hợp với giới từ בְ và động từ nguyên mẫu cấu trúc רדת mở đầu một mệnh đề chỉ thời gian. “Khi ... sa xuống” tự nhiên trong tiếng Việt và vẫn giữ được động từ chỉ chuyển động đi xuống.
- source_word: הַטַּל
  choice: sương
  rationale: Danh từ xác định chỉ sương đêm; tiếng Việt thường không cần từ chỉ định tương ứng với mạo từ הַ trong ngữ cảnh này.
- source_word: עַל הַמַּחֲנֶה
  choice: trên trại quân
  rationale: עַל được dịch là “trên”; “trại quân” diễn đạt rõ המחנה trong bối cảnh dân Israel đóng trại.
- source_word: לָיְלָה
  choice: vào ban đêm
  rationale: Danh từ được dùng theo chức năng trạng ngữ thời gian; cách diễn đạt này tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: יֵרֵד
  choice: cũng sa xuống
  rationale: Dạng vị hoàn ở đây mô tả hành động thường diễn ra trong bối cảnh quá khứ. Lặp lại “sa xuống” bảo tồn sự song hành từ vựng với רדת; “cũng” làm rõ quan hệ song hành vốn được thể hiện qua cấu trúc câu.
- source_word: הַמָּן
  choice: ma-na
  rationale: Phiên âm danh từ chỉ thức ăn đã được biết đến trong câu chuyện; dấu gạch nối giúp người đọc nhận ra đây là một tên gọi riêng biệt.
- source_word: עָלָיו
  choice: trên đó
  rationale: Đại từ hậu tố ngôi ba số ít giống đực nhiều khả năng quy chiếu về המחנה, tức trại quân. “Trên đó” giữ nguyên tính đại từ, không giải thích quá mức mối quan hệ giữa ma-na và sương.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ phép lặp động từ của tiếng Hê-bơ-rơ, đồng thời dùng “trên đó” để không xác định quá mức đối tượng quy chiếu hay quan hệ vật lý giữa sương và ma-na.
