  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: vi
  text: Ta sẽ ngự xuống và phán với con tại đó. Ta sẽ lấy một phần thần khí đang ở trên con[a] mà đặt trên họ. Họ sẽ cùng con gánh vác gánh nặng của dân chúng, để con không phải gánh một mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một phần Thần Khí đang ở trên con.” Từ Hê-bơ-rơ רוּחַ có thể chỉ thần khí, gió hoặc hơi thở; ở đây, từ này nói đến thần khí ban năng lực cho Môi-se để lãnh đạo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: Ta sẽ ngự xuống
  rationale: Giữ hình ảnh Thiên Chúa đi xuống trong nguyên văn, đồng thời dùng cách nói trang trọng và tự nhiên trong tiếng Việt khi chủ thể là Thiên Chúa.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: và phán với con tại đó
  rationale: Động từ דבר với עם diễn tả việc nói với ai; “tại đó” giữ nguyên nét xác định không gian.
- source_word: וְאָצַלְתִּי
  choice: Ta sẽ lấy một phần
  rationale: Động từ hiếm אצל ở đây diễn tả việc lấy từ điều đang ở trên Môi-se để đặt trên các trưởng lão. “Lấy một phần” truyền đạt ý phân chia/chuyển giao nhưng không khẳng định thần khí nơi Môi-se bị suy giảm.
- source_word: מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: một phần thần khí đang ở trên con
  rationale: רוּחַ trong ngữ cảnh là thần khí ban năng lực lãnh đạo. Viết thường “thần khí” giữ được sự mơ hồ vốn có của danh từ Hê-bơ-rơ, không áp đặt mức độ xác định thần học vượt quá câu chữ.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: mà đặt trên họ
  rationale: 'Giữ động từ và hình ảnh không gian của nguyên văn: thần khí được đặt trên các trưởng lão.'
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: Họ sẽ cùng con gánh vác gánh nặng của dân chúng
  rationale: Tái hiện phép chơi từ giữa נשא, “gánh/mang,” và מַשָּׂא, “gánh nặng,” đồng thời diễn đạt trách nhiệm lãnh đạo được chia sẻ.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: để con không phải gánh một mình
  rationale: Diễn đạt tự nhiên quan hệ mục đích/kết quả và giữ sự nhấn mạnh của đại từ cùng לְבַדֶּךָ.
theological_decisions:
- issue: רוּחַ chỉ Thần Khí của Thiên Chúa hay “thần khí” theo nghĩa rộng
  choice: thần khí
  alternative: Thần Khí
  rationale: Ngữ cảnh cho thấy đây là quyền năng đến từ Thiên Chúa để thi hành vai trò lãnh đạo, nhưng danh từ Hê-bơ-rơ không có quy ước viết hoa. Cách viết thường bảo tồn độ mở của nguyên văn; chú thích nêu rõ nghĩa theo ngữ cảnh mà không đồng nhất hóa quá mức với thuật ngữ thần học về sau.
- issue: Việc lấy thần khí từ Môi-se có hàm ý Môi-se bị giảm phần hay không
  choice: không xác định; dịch “lấy một phần”
  alternative: san sẻ thần khí
  rationale: Nguyên văn mô tả sự chuyển giao từ điều đang ở trên Môi-se nhưng không nói rõ Môi-se bị suy giảm hay vẫn giữ trọn. Bản dịch tránh giải quyết điều văn bản để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta–con” cho lời Thiên Chúa nói với Môi-se; “ngự xuống” bảo tồn hình ảnh thần hiện mà vẫn tự nhiên trong tiếng Việt. Dùng “dân chúng” thay vì “dân” ở cụm gánh nặng để câu rõ nghĩa.
