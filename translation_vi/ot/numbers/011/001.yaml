  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: vi
  text: Dân chúng tỏ ra như những kẻ than phiền về cảnh khốn khó trước Yahweh.[a] Yahweh nghe thấy, cơn giận của Ngài bừng cháy;[b] lửa của Yahweh bùng cháy giữa họ[c] và thiêu rụi ở rìa trại.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ này hiếm và khó hiểu; cũng có thể dịch là “những kẻ than phiền,” “những người đang than phiền,” hoặc có lẽ “như thể đang than phiền.” “Trước Yahweh” dịch thành ngữ nguyên văn là “trong tai Yahweh,” nghĩa là lời than phiền đến sự nghe biết của Ngài.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “cơn giận của Ngài bừng cháy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “một ngọn lửa từ Yahweh bùng cháy giữa họ.”'
    reason: alternative_reading
  - marker: d
    text: Cũng có thể dịch là “ở vùng ngoài cùng của trại.” Tiếng Hê-bơ-rơ không nói rõ người hay vật nào bị thiêu rụi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם כְּמִתְאֹנְנִים רַע
  choice: Dân chúng như những kẻ than phiền về cảnh khốn khó
  rationale: Giữ sắc thái so sánh của כְּ và tính khó, hiếm của מִתְאֹנְנִים; hiểu רַע theo nghĩa nghịch cảnh, khốn khó trong ngữ cảnh, thay vì tự động quy thành điều ác về luân lý.
- source_word: בְּאָזְנֵי יְהוָה
  choice: lời ấy đến tai Yahweh
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ 'trong tai Yahweh', đồng thời giữ hình ảnh thính giác và ý rằng lời than phiền đã được Ngài nghe biết.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng YHWH thay vì thay bằng một tước hiệu.
- source_word: וַיִּשְׁמַע יְהוָה וַיִּחַר אַפּוֹ
  choice: Yahweh nghe thấy thì nổi giận
  rationale: Chuyển thành câu tiếng Việt tự nhiên, giữ trình tự nghe rồi giận; 'nổi giận' truyền đạt thành ngữ về cơn giận bừng cháy mà không dịch cứng hình ảnh 'mũi nóng'.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: lửa của Yahweh bùng cháy giữa họ
  rationale: Giữ quan hệ sở hữu/liên hệ của cụm 'lửa của Yahweh' và dịch בָּם là 'giữa họ', không quyết đoán hơn mức cấu trúc nguồn.
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: thiêu rụi một phần ở ngoài rìa trại
  rationale: Động từ có lửa làm chủ thể được dịch là 'thiêu rụi'; thêm 'một phần' để câu Việt có đối tượng tự nhiên nhưng không xác định nguồn chỉ người hay vật, còn קְצֵה được hiểu là phần rìa/ngoại vi của trại.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Bản nguồn dùng trực tiếp danh giao ước; phiên âm giữ đây là danh riêng mà không biến thành tước hiệu.
- issue: Nguồn gốc và tính chất của ngọn lửa phán xét
  choice: lửa của Yahweh
  alternative: một ngọn lửa từ Yahweh
  rationale: Giữ nguyên cấu trúc liên kết אֵשׁ יְהוָה và sự quy thuộc trực tiếp cho Yahweh, nhưng ghi nhận cách hiểu chỉ nguồn gốc là một khả năng.
- issue: Đối tượng bị thiêu ở rìa trại
  choice: một phần ở ngoài rìa trại
  alternative: một số người ở ngoài rìa trại
  rationale: Tiếng Hê-bơ-rơ không nêu tân ngữ riêng ngoài cụm chỉ vị trí; tránh xác quyết rằng chỉ người bị thiêu trong khi vẫn tạo câu tiếng Việt đầy đủ, tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dân chúng” cho tập thể Y-sơ-ra-ên, “cảnh khốn khó” cho nghịch cảnh, và “ngoài rìa trại” cho khu vực ngoại vi. Các câu được chia nhịp để tránh chuỗi liên từ nặng nề nhưng vẫn giữ diễn tiến của bản Hê-bơ-rơ.
