source:
  edition: WLC
  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא קִבְר֣וֹת הַֽתַּאֲוָ֑ה כִּי שָׁם֙ קָֽבְר֔וּ אֶת הָ/עָ֖ם הַ/מִּתְאַוִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: vi
  text: Ông đặt tên cho nơi ấy là Kíp-rốt Ha-tha-a-va[a], vì tại đó người ta chôn những người đã thèm muốn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kíp-rốt Ha-tha-a-va có lẽ có nghĩa là “Mồ mả của sự thèm muốn” hoặc “Mồ mả của lòng ham muốn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Ông đặt tên
  rationale: Động từ số ít mở đầu diễn tiến tiếp theo và dùng trong công thức đặt tên. “Ông đặt tên” tự nhiên trong tiếng Việt, đồng thời giữ chủ thể nam số ít được ngữ cảnh ngầm chỉ đến.
- source_word: אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: nơi ấy
  rationale: Trong tiếng Việt, “đặt tên nơi ấy” diễn đạt tự nhiên đầy đủ ý của công thức Hê-bơ-rơ “gọi tên của nơi ấy”, không cần lặp từ “tên” theo cấu trúc nguồn.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: Kíp-rốt Ha-tha-va
  rationale: Giữ địa danh bằng hình thức phiên âm dễ đọc trong tiếng Việt; ý nghĩa của tên được nêu ở chú thích.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu nguyên nhân của việc đặt tên, ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: שָׁם
  choice: tại đó
  rationale: Diễn đạt rõ trạng từ chỉ nơi chốn và liên kết tự nhiên với mệnh đề nguyên nhân.
- source_word: קָבְרוּ
  choice: người ta chôn
  rationale: Động từ Hê-bơ-rơ ở số nhiều nhưng không nêu rõ chủ thể. Cách nói “người ta chôn” giữ tính không xác định ấy trong tiếng Việt.
- source_word: הָעָם הַמִּתְאַוִּים
  choice: những kẻ đã thèm khát
  rationale: Danh từ tập hợp được xác định thêm bằng phân từ chỉ những người buông mình theo sự thèm muốn. “Đã thèm khát” phù hợp ngữ cảnh ham muốn thức ăn, không thu hẹp thành dục vọng tình dục; “những kẻ” chuyển tải sắc thái bị phán xét trong ngữ cảnh.
theological_decisions:
- issue: Chủ thể ngầm của וַיִּקְרָא
  choice: Ông
  alternative: Người ta / tên nơi ấy được gọi là
  rationale: Hình thái động từ là ngôi thứ ba giống đực số ít, nên bản dịch giữ một chủ thể cá nhân theo ngữ cảnh thay vì biến thành chủ thể số nhiều hoặc câu bị động; không thêm tên riêng mà nguyên văn không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Địa danh được phiên âm; cấu trúc đặt tên được Việt hóa tự nhiên. Cụm “thèm khát” giữ liên hệ từ vựng với nguyên nhân của địa danh mà không gán cho nó nghĩa tình dục.
