review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự đặt tên, quan hệ nguyên nhân ("vì"), địa điểm chôn cất, và nhóm người được đặc trưng là những người đã thèm muốn. Tuy nhiên, “những kẻ” thêm sắc thái miệt thị không do riêng phân từ הַמִּתְאַוִּים bắt buộc; “những người” giữ ý nghĩa và sự đánh giá của ngữ cảnh mà không tăng cường sắc thái.
  naturalness: “Đặt tên cho nơi ấy” là cách nói hiện đại, tự nhiên và đầy đủ hơn “đặt tên nơi ấy”. “Những người đã thèm muốn” tự nhiên trong văn mạch này; cụm này không giới hạn sự ham muốn vào dục tính hay chỉ cảm giác đói.
  terminology: Giữ địa danh dưới dạng phiên âm và chú thích nghĩa. Điều chỉnh phiên âm thành “Kíp-rốt Ha-tha-a-va” để phản ánh rõ hơn âm tiết của Hê-bơ-rơ תַּאֲוָה (taʾavah). Chú thích dùng “mồ mả” cho số nhiều קִבְרוֹת, đồng thời giữ cả hai khả năng “thèm muốn/ham muốn”.
