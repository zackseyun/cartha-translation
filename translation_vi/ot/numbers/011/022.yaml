base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: vi
  text: Liệu có giết chiên và bò cho họ mà đủ không? Hay dù có gom tất cả cá biển lại cho họ[a], liệu có đủ không?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “và được tìm thấy cho họ”, một thành ngữ có nghĩa là “và đủ cho họ” hoặc “và đáp ứng đủ cho họ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: Liệu... không?
  rationale: Tiểu từ nghi vấn mở đầu một câu hỏi tu từ mang tính giả định; cấu trúc “liệu... không?” tự nhiên trong tiếng Việt hiện đại.
- source_word: צֹאן וּבָקָר
  choice: chiên và bò
  rationale: Cặp từ chỉ gia súc nhỏ và gia súc lớn; “chiên và bò” cụ thể, dễ hiểu và phù hợp với ngữ cảnh làm thức ăn.
- source_word: יִשָּׁחֵט
  choice: có giết
  rationale: Thể Niphal của שׁחט chỉ việc súc vật bị giết để lấy thịt. Tiếng Việt tự nhiên dùng cấu trúc chủ động phiếm chỉ “có giết... cho họ”, vẫn giữ đúng ý bị động mà không gợi thêm sắc thái tế lễ.
- source_word: לָהֶם
  choice: cho họ
  rationale: Giới từ diễn tả sự cung cấp vì lợi ích của dân chúng; “cho họ” là cách diễn đạt tự nhiên.
- source_word: וּמָצָא לָהֶם
  choice: mà đủ không? / liệu có đủ không?
  rationale: Trong thành ngữ này, מצא mang nghĩa đủ hoặc đáp ứng đủ, không đơn thuần là “được tìm thấy”. Hai lần xuất hiện được dịch nhất quán về ý nghĩa, với cú pháp điều chỉnh cho tự nhiên.
- source_word: אִם
  choice: Hay dù
  rationale: Từ này mở nhánh thứ hai của câu hỏi tu từ. “Hay dù” vừa thể hiện quan hệ lựa chọn vừa truyền đạt tính giả định cực đại trong ngữ cảnh.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: tất cả cá dưới biển
  rationale: Giữ yếu tố toàn thể của כָּל và diễn đạt cụm sở thuộc theo cách tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: יֵאָסֵף
  choice: có gom... lại
  rationale: Thể Niphal của אסף mang nghĩa được tập hợp hoặc thu gom. Cấu trúc phiếm chỉ “có gom... lại” tự nhiên trong câu giả định và không thêm ý cụ thể là đánh bắt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Hai câu hỏi tu từ được giữ nguyên, cùng sự tăng tiến từ gia súc đến toàn bộ cá biển. Bản dịch tránh ngôn ngữ quá cổ và không giải quyết thay cho văn bản hàm ý thần học trong lời chất vấn của Môi-se.
