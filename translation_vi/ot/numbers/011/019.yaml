  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: vi
  text: Anh em sẽ ăn không chỉ một ngày[a], không chỉ hai ngày, không chỉ năm ngày, không chỉ mười ngày, cũng không chỉ hai mươi ngày,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát cấu trúc Hê-bơ-rơ: “Anh em sẽ ăn—không phải một ngày, không phải hai ngày, không phải năm ngày, không phải mười ngày, cũng không phải hai mươi ngày.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: không phải chỉ ... cũng không phải
  rationale: Chuỗi phủ định loại trừ lần lượt các khoảng thời gian. Cách diễn đạt này tự nhiên trong tiếng Việt và, trong ngữ cảnh câu tiếp nối, làm rõ rằng việc ăn không dừng ở các mốc được nêu.
- source_word: יוֹם אֶחָד
  choice: một ngày
  rationale: Giữ nguyên số đếm và mở đầu tự nhiên cho chuỗi tăng dần.
- source_word: תֹּאכְלוּ/ן
  choice: anh em sẽ ăn
  rationale: Động từ Qal chưa hoàn thành ngôi hai số nhiều mang nghĩa tương lai trong lời công bố; “anh em” biểu đạt số nhiều và hợp với lời nói trực tiếp trang trọng.
- source_word: יוֹמָיִם
  choice: hai ngày
  rationale: Dạng số đôi chỉ rõ hai ngày.
- source_word: חֲמִשָּׁה יָמִים
  choice: năm ngày
  rationale: Dịch trực tiếp để giữ nhịp tăng dần.
- source_word: עֲשָׂרָה יָמִים
  choice: mười ngày
  rationale: Dịch trực tiếp để bảo toàn cấu trúc tu từ.
- source_word: עֶשְׂרִים יוֹם
  choice: hai mươi ngày
  rationale: Diễn đạt theo ngữ pháp tiếng Việt tự nhiên.
- source_word: וְ
  choice: cũng không phải ... hay
  rationale: Trong chuỗi phủ định, waw liên kết các khoảng thời gian bị loại trừ; “cũng không phải” và “hay” truyền đạt quan hệ ấy tự nhiên hơn việc lặp máy móc “và không”.
