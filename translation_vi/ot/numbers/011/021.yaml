language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: vi
  text: 'Nhưng Môi-se nói: “Dân chúng mà con đang ở giữa họ có sáu trăm nghìn người đi bộ[a], thế mà Ngài đã phán: ‘Ta sẽ ban thịt cho họ, và họ sẽ ăn suốt một tháng[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sáu trăm nghìn bộ binh.” Cụm từ Hê-bơ-rơ có thể chỉ những người đi bộ hoặc những người lính đi bộ.'
    reason: alternative_reading
  - marker: b
    text: Tiếng Hê-bơ-rơ dịch sát là “một tháng ngày,” một thành ngữ có nghĩa là trọn một tháng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng Môi-se nói
  rationale: Liên từ nối tiếp diễn tiến câu chuyện, nhưng trong ngữ cảnh lời Môi-se nêu sự phản vấn trước lời Đức Chúa Trời, “nhưng” diễn đạt tự nhiên sắc thái tương phản.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: sáu trăm nghìn
  rationale: Chuyển trực tiếp số đếm trong tiếng Hê-bơ-rơ.
- source_word: רַגְלִי הָעָם
  choice: sáu trăm nghìn người đi bộ
  rationale: רַגְלִי liên hệ đến việc đi bằng chân và có thể chỉ người đi bộ hoặc người có khả năng hành quân. “Người đi bộ” giữ hình ảnh gốc mà không áp đặt sắc thái quân sự; chú thích nêu khả năng hiểu khác.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: dân mà con đang ở giữa
  rationale: בקרב với hậu tố nghĩa là “ở giữa/ở trong vòng họ.” Cách nói này giữ sát hình ảnh nguồn; “con” phù hợp khi Môi-se trực tiếp thưa với Đức Chúa Trời.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: thế mà Ngài đã phán
  rationale: Đại từ “Ngài” được diễn đạt rõ để giữ sự nhấn mạnh tương phản của אַתָּה; “thế mà” truyền đạt sự kinh ngạc, phản vấn trong ngữ cảnh.
- source_word: בָּשָׂר
  choice: thịt
  rationale: Trong ngữ cảnh này, từ chỉ thịt động vật dùng làm thức ăn.
- source_word: אֶתֵּן לָהֶם
  choice: Ta sẽ ban thịt cho họ
  rationale: Thể chưa hoàn thành ngôi thứ nhất diễn tả lời hứa hoặc ý định tương lai. “Ban” tự nhiên trong lời Đức Chúa Trời nhưng không thêm nội dung thần học.
- source_word: וְאָכְלוּ
  choice: và họ sẽ ăn
  rationale: Giữ quan hệ phối hợp và ý nghĩa tương lai của động từ, trình bày kết quả được tuyên bố.
- source_word: חֹדֶשׁ יָמִים
  choice: suốt một tháng
  rationale: Thành ngữ nguyên văn là “một tháng ngày,” nghĩa là một tháng trọn vẹn. Bản dịch tự nhiên diễn đạt “suốt một tháng,” còn chú thích bảo tồn hình thức nguyên ngữ.
theological_decisions:
- issue: Cách xưng hô của Môi-se với Đức Chúa Trời
  choice: 'con / Ngài; trong lời Đức Chúa Trời: Ta'
  alternative: tôi / Người; Ta
  rationale: “Con / Ngài” là lối xưng hô tiếng Việt tự nhiên, trang trọng khi một người thưa với Đức Chúa Trời. Đây là lựa chọn văn phong, không nhằm xác định riêng một lập trường giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sắc thái phản vấn của Môi-se qua “thế mà,” bảo tồn hình ảnh “ở giữa” và sự mơ hồ của רַגְלִי bằng chú thích. Các dấu chú thích đều xuất hiện ngay tại thành phần liên quan trong chính văn.
