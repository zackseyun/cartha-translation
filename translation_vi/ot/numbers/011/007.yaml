base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: vi
  text: Ma-na giống như hạt ngò, và vẻ ngoài của nó giống như vẻ ngoài của bdellium.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bdellium thường được hiểu là một loại nhựa cây hoặc gôm thơm; tuy nhiên, việc xác định chính xác từ Hê-bơ-rơ này vẫn chưa chắc chắn. Một số người hiểu đó là một chất giống đá quý, chẳng hạn như ngọc trai hoặc pha lê.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: Ma-na
  rationale: Danh từ xác định chỉ thức ăn đã được biết đến trong hoang mạc; tiếng Việt tự nhiên không cần mạo từ và dùng dạng phiên âm quen thuộc.
- source_word: כִּזְרַע גַּד
  choice: giống như hạt ngò
  rationale: כִּ diễn tả sự tương tự; גַּד thường được nhận diện là cây ngò. “Hạt ngò” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: וְעֵינוֹ
  choice: và hình dạng của nó
  rationale: עַיִן theo nghĩa đen là “mắt”, nhưng trong thành ngữ này chỉ diện mạo hay hình dạng nhìn thấy được.
- source_word: כְּעֵין
  choice: giống như hình dạng của
  rationale: Giữ lại sự lặp lại của עַיִן trong nguyên ngữ để bảo toàn phép song hành và trọng tâm thị giác.
- source_word: הַבְּדֹלַח
  choice: nhựa thơm bdellium
  rationale: Danh tính chính xác của vật này không chắc chắn. Kết hợp mô tả loại vật liệu với tên phiên âm giúp độc giả hiểu mà vẫn giữ thuật ngữ nguồn và sự bất định.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không thêm từ chỉ thời gian như “bấy giờ” vì nguyên ngữ chỉ có liên từ וְ, không có từ tương đương trực tiếp với “bây giờ”. Dấu chú thích được đặt ngay sau thuật ngữ đang được giải thích.
