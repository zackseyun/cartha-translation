  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: vi
  text: 'Nhưng Môi-se nói với ông: “Anh ganh vì tôi sao? Ước gì toàn dân Yahweh đều là những nhà tiên tri; ước gì Yahweh đặt Thần Ngài trên họ!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  choice: Anh ganh vì tôi sao?
  rationale: Động từ קנא ở đây diễn tả thái độ sốt sắng mang tính bảo vệ dành cho quyền lợi hay địa vị của Môi-se. “Ganh vì tôi” giữ được sắc thái trách nhẹ và tự nhiên hơn “ghen tị” trong văn cảnh này.
- source_word: וּמִי יִתֵּן
  choice: Ước gì
  rationale: Đây là thành ngữ biểu thị ước nguyện, không phải câu hỏi theo nghĩa đen “ai sẽ ban”. “Ước gì” truyền đạt rõ lực cầu ước trong tiếng Việt hiện đại.
- source_word: כָּל עַם יְהוָה
  choice: toàn dân của Yahweh
  rationale: Cụm danh từ sở hữu chỉ toàn thể dân thuộc về Yahweh. Cách dịch này rõ ràng, tự nhiên và bảo toàn ý nghĩa giao ước.
- source_word: נְבִיאִים
  choice: các nhà tiên tri
  rationale: Danh từ số nhiều chỉ những người giữ vai trò tiên tri; cách dịch danh từ trực tiếp bảo toàn hình thức của nguyên văn.
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: vì Yahweh ban Thần của Ngài trên họ
  rationale: כִּי có thể mang nghĩa “vì/bởi vì” và nêu nền tảng hay điều kiện gắn với ước nguyện. “Ban ... trên họ” giữ hình ảnh Hê-bơ-rơ về Thần được ban xuống trên con người, dù tiếng Việt hơi trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp trực tiếp với יהוה trong nguyên văn.
- source_word: רוּחוֹ
  choice: Thần của Ngài
  rationale: Trong văn cảnh được ban năng lực nói tiên tri, רוּחַ chỉ Thần đến từ Đức Chúa Trời, không phải gió hay hơi thở. Viết hoa “Thần” làm rõ đối tượng theo văn cảnh.
theological_decisions:
- issue: Cách hiểu רוּחוֹ trong văn cảnh ban năng lực tiên tri
  choice: Thần của Ngài
  alternative: thần khí của Ngài
  rationale: Văn cảnh trực tiếp nói về hoạt động tiên tri do Đức Chúa Trời ban, nên “Thần của Ngài” vừa sáng nghĩa vừa không thêm một định nghĩa hệ thống ngoài câu.
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA
  rationale: Nguyên văn dùng danh riêng יהוה; “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Quan hệ của כִּי với lời ước
  choice: vì Yahweh ban Thần của Ngài trên họ
  alternative: khi Yahweh ban Thần của Ngài trên họ
  rationale: כִּי cho phép sắc thái nguyên nhân hoặc giải thích nội dung của điều ước. Chọn “vì” giữ mối liên hệ rằng việc họ làm tiên tri là do Yahweh ban Thần, đồng thời không biến câu thành một lời khẳng định thời điểm chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se”, đại từ “ông/anh” theo quan hệ đối thoại; “ganh vì tôi” giữ sắc thái bảo vệ địa vị của Môi-se mà không áp đặt nghĩa ghen tị cá nhân quá mạnh. Không dùng chú thích vì câu dịch không cần đánh dấu biến thể để đọc trọn nghĩa.
