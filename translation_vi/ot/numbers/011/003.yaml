id: NUM.11.3
reference: Numbers 11:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: vi
  text: Vì thế, ông gọi nơi ấy là Ta-bê-ra[a], bởi lửa của Yahweh đã cháy giữa họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ta-bê-ra có âm gần với từ Hê-bơ-rơ nghĩa là “sự cháy.”
    reason: Giải thích lối chơi chữ giữa địa danh תבערה và động từ בער (“cháy”).
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: ông gọi nơi ấy là
  rationale: Diễn đạt tự nhiên trong tiếng Việt công thức đặt tên của tiếng Hê-bơ-rơ; chủ ngữ số ít được giữ là “ông” nhưng không xác định thêm người nào.
- source_word: תַּבְעֵרָה
  choice: Ta-bê-ra
  rationale: Phiên âm địa danh, đồng thời giữ mối liên hệ với động từ “cháy” trong mệnh đề giải thích và chú thích nghĩa tên.
- source_word: כִּי
  choice: bởi
  rationale: Thể hiện rõ quan hệ nguyên nhân, phù hợp văn phong trang trọng mà hiện đại.
- source_word: בָעֲרָה
  choice: đã cháy
  rationale: Truyền đạt trực tiếp nghĩa của בער và phản ánh lối chơi chữ với tên Ta-bê-ra.
- source_word: בָם
  choice: giữa họ
  rationale: Diễn tả ngọn lửa hoạt động ở giữa cộng đồng, tự nhiên hơn cách dịch sát chữ “trong họ”.
- source_word: אֵשׁ יְהוָה
  choice: lửa của Yahweh
  rationale: Giữ cấu trúc sở hữu của nguyên văn và dùng danh riêng giao ước Yahweh cho יהוה.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; phiên âm Yahweh bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Tính chất của cụm אֵשׁ יְהוָה
  choice: lửa của Yahweh
  alternative: một ngọn lửa từ Yahweh
  rationale: Giữ nguyên cấu trúc liên thuộc và không thu hẹp quan hệ thành chỉ nguồn phát, dù trong ngữ cảnh lửa rõ ràng là sự phán xét đến từ Yahweh.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Vì thế” để nối với sự kiện ngay trước đó; giữ “ông” nhằm phản ánh chủ ngữ số ít không được nêu danh trong câu. Phiên âm địa danh có gạch nối theo lối đọc tiếng Việt.
