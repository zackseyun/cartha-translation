revisions:
- from: Dân chúng đứng dậy; suốt ngày hôm ấy, suốt đêm hôm ấy và suốt cả ngày hôm sau, họ thu gom chim cút. Người thu gom ít nhất cũng được mười ô-me[a][b]. Họ trải chúng ra cho mình khắp chung quanh trại.
  to: Dân chúng đứng dậy, rồi suốt ngày hôm ấy, suốt đêm hôm ấy và suốt cả ngày hôm sau, họ thu gom chim cút. Người thu gom ít nhất cũng thu gom được mười hô-me[a][b]. Họ trải chúng ra cho mình khắp chung quanh trại.
  rationale: Sửa phiên âm đơn vị đo để phân biệt chính xác חֹמֶר (homer) với עֹמֶר (omer), đồng thời phục hồi rõ nét sự lặp lại của động từ “thu gom”. Các yếu tố khác, gồm tính kéo dài của thời gian, số lượng tối thiểu, và ý “cho mình”, được giữ nguyên.
