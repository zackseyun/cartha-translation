source:
  edition: WLC
  text: וַ/יָּ֣קָם הָ/עָ֡ם כָּל הַ/יּוֹם֩ הַ/ה֨וּא וְ/כָל הַ/לַּ֜יְלָה וְ/כֹ֣ל י֣וֹם הַֽ/מָּחֳרָ֗ת וַ/יַּֽאַסְפוּ֙ אֶת הַ/שְּׂלָ֔ו הַ/מַּמְעִ֕יט אָסַ֖ף עֲשָׂרָ֣ה חֳמָרִ֑ים וַ/יִּשְׁטְח֤וּ לָ/הֶם֙ שָׁט֔וֹחַ סְבִיב֖וֹת הַֽ/מַּחֲנֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: vi
  text: Dân chúng đứng dậy, rồi suốt ngày hôm ấy, suốt đêm hôm ấy và suốt cả ngày hôm sau, họ thu gom chim cút. Người thu gom ít nhất cũng thu gom được mười hô-me[a][b]. Họ trải chúng ra cho mình khắp chung quanh trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hô-me là một đơn vị đo dung tích đồ khô rất lớn. Không thể xác định chắc chắn giá trị tương đương chính xác theo đơn vị hiện đại; ý chính là ngay cả người thu gom ít nhất cũng thu được một lượng rất lớn.
    reason: cultural_note
  - marker: b
    text: Hoặc “mười tải lừa”, nếu hiểu חֳמָרִים theo mối liên hệ từ nguyên với “lừa” thay vì theo nghĩa thông thường là đơn vị đo đồ khô “hô-me”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: Dân chúng đứng dậy
  rationale: Giữ hình ảnh và sức kể của động từ קום, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt để mở đầu hành động khẩn trương của cả cộng đồng.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: suốt ngày hôm ấy, suốt đêm hôm ấy và suốt cả ngày hôm sau
  rationale: Tái hiện nhịp lặp và nhấn mạnh thời gian thu gom kéo dài liên tục.
- source_word: וַיַּאַסְפוּ אֶת הַשְּׂלָו
  choice: họ thu gom chim cút
  rationale: “Thu gom” diễn đạt tự nhiên hành động אָסף trong bối cảnh nhặt và tập hợp số lượng lớn chim cút.
- source_word: הַמַּמְעִיט אָסַף
  choice: Người thu gom ít nhất cũng được
  rationale: Bổ sung ý “thu gom” theo động từ kế tiếp và ngữ cảnh; từ “cũng” làm rõ rằng đây là lượng tối thiểu đáng kể mà không thay đổi nội dung.
- source_word: עֲשָׂרָה חֳמָרִים
  choice: mười ô-me
  rationale: Phiên âm đơn vị đo dung tích חֹמֶר thay vì quy đổi thiếu chắc chắn sang đơn vị hiện đại; giữ khả năng đối chiếu với chú thích.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: Họ trải chúng ra cho mình
  rationale: Phản ánh động từ שטח cùng cấu trúc nhấn mạnh và giữ לָהֶם là “cho mình”, không suy đoán cụ thể rằng họ phơi hay chế biến.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: khắp chung quanh trại
  rationale: “Khắp chung quanh” truyền đạt sắc thái bao quanh và phân bố rộng của סְבִיבוֹת.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu đầu giữ nhịp lặp của tiếng Hê-bơ-rơ; dấu chấm phẩy giúp tránh hiểu “suốt ngày” là bổ nghĩa trực tiếp cho hành động đứng dậy. Hai chú thích được đặt ngay sau “ô-me”, là từ ngữ mà cả hai chú thích giải thích.
