  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: vi
  text: Nhưng có hai người vẫn ở lại trong trại. Một người tên là Ên-đát, người thứ hai tên là Mê-đát. Thần Khí ngự trên họ; họ thuộc số những người đã được ghi tên[a], nhưng không đi đến lều[b], và họ nói tiên tri trong trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ thuộc số những người đã đăng ký.” Tiếng Hê-bơ-rơ nói sát nghĩa là họ ở “trong số những người được viết/ghi lại.”'
    reason: lexical_alternative
  - marker: b
    text: Theo văn cảnh của sự việc này, đây rất có thể là Lều Hội Kiến.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: vẫn ở lại
  rationale: Động từ שׁאר diễn tả việc còn lại hoặc ở lại. “Vẫn ở lại” tự nhiên trong tiếng Việt và không suy đoán lý do họ không đi ra.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: hai người
  rationale: Ngữ cảnh và các tên riêng cho thấy đây là hai người nam; tiếng Việt thường dùng “hai người” tự nhiên hơn “hai người đàn ông” trong lối kể này mà không làm thay đổi đối tượng.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Một người tên là ... người thứ hai tên là
  rationale: Giữ sự phân biệt “một người” và “người thứ hai” của công thức Hê-bơ-rơ, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: אֶלְדָּד / מֵידָד
  choice: Ên-đát / Mê-đát
  rationale: Phiên âm các tên riêng theo cách đọc dễ nhận biết và phù hợp với chính tả tiếng Việt.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: Thần Khí ngự trên họ
  rationale: Trong văn cảnh, הָרוּחַ là Thần Khí đến từ Đức Chúa Trời và ban năng lực nói tiên tri. “Ngự trên” chuyển tải ý Thần Khí dừng lại trên họ bằng cách diễn đạt trang trọng, tự nhiên.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: họ thuộc số những người đã được ghi tên
  rationale: כְּתֻבִים có nghĩa đen là “những người được viết/ghi lại.” Cách dịch này làm rõ rằng họ có tên trong số đã được ghi, nhưng không xác định quá mức bản chất của danh sách.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: nhưng không đi ra lều
  rationale: Dạng chỉ hướng trong אֹהֱלָה biểu thị chuyển động về phía lều. Bản dịch giữ “lều” như nguyên văn, không tự đưa cụm “Lều Hội Kiến” vào chính văn.
- source_word: וַיִּתְנַבְּאוּ
  choice: họ nói tiên tri
  rationale: Thể hitpael của נבא tại đây chỉ hoạt động nói tiên tri; không nhất thiết mang sắc thái “bắt đầu,” nên không thêm ý đó.
theological_decisions:
- issue: הָרוּחַ chỉ Thần Khí của Đức Chúa Trời hay chỉ một thần khí nói chung
  choice: Thần Khí
  alternative: thần khí
  rationale: Văn cảnh trực tiếp nói về Thần Khí ở trên Môi-se được đặt trên các trưởng lão để họ nói tiên tri. Viết hoa phản ánh đối tượng được nói đến trong văn cảnh, không thêm một định nghĩa tín lý ngoài câu.
- issue: Có nên dịch rõ הָאֹהֱלָה là “Lều Hội Kiến” hay không
  choice: lều
  alternative: Lều Hội Kiến
  rationale: Văn cảnh rất có thể chỉ Lều Hội Kiến, nhưng câu Hê-bơ-rơ này chỉ ghi “lều.” Chính văn giữ cách gọi không mở rộng, còn chú thích nêu nhận diện theo văn cảnh.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, với câu cú dễ hiểu cho độc giả phổ thông. Dùng “Thần Khí” để chỉ Đấng ban năng lực nói tiên tri; giữ “lều” ở chữ thường vì nguyên văn của câu không nêu đầy đủ “Lều Hội Kiến.” Các dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
