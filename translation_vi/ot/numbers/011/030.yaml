  yaml_path: translation/ot/numbers/011/030.yaml
  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: vi
  text: Bấy giờ, Môi-se cùng các trưởng lão Y-sơ-ra-ên trở về trại[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hình thức hơn: “Bấy giờ, Môi-se được tập hợp trở lại trại, cùng các trưởng lão Y-sơ-ra-ên.” Động từ Hê-bơ-rơ có thể được dịch sát theo hình thức như vậy, nhưng trong ngữ cảnh có nghĩa là Môi-se trở về trại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: trở về
  rationale: Động từ אסף ở thể Niphal, nối tiếp mạch kể, theo ngữ cảnh diễn tả việc Môi-se quay lại trại sau sự việc vừa kể. “Trở về” tự nhiên trong tiếng Việt, đồng thời chú thích giữ lại cách hiểu sát hình thức hơn là “được tập hợp lại”.
- source_word: אֶל הַמַּחֲנֶה
  choice: về trại
  rationale: מַחֲנֶה chỉ trại của dân Y-sơ-ra-ên; giới từ אֶל biểu thị hướng đến. “Về trại” phù hợp với động từ “trở về” và không diễn giải quá mức thành “vào trong trại”.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: ông cùng các trưởng lão Y-sơ-ra-ên
  rationale: Đại từ הוּא mang tính nhấn mạnh hoặc đồng vị, cho biết Môi-se trở về cùng các trưởng lão. Dùng “ông” để thể hiện đại từ này mà vẫn giữ câu tiếng Việt tự nhiên.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: các trưởng lão Y-sơ-ra-ên
  rationale: Đây là cách dịch tự nhiên của cấu trúc sở thuộc trong tiếng Hê-bơ-rơ, chỉ các vị trưởng lão thuộc dân Y-sơ-ra-ên.
