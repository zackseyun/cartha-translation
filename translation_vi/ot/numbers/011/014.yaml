  text: לֹֽא אוּכַ֤ל אָנֹכִי֙ לְ/בַדִּ֔/י לָ/שֵׂ֖את אֶת כָּל הָ/עָ֣ם הַ/זֶּ֑ה כִּ֥י כָבֵ֖ד מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/014.yaml
  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: vi
  text: Một mình tôi không thể gánh nổi toàn dân này, vì dân này quá nặng đối với tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַל אָנֹכִי לְבַדִּי
  choice: Một mình tôi không thể
  rationale: Giữ sự nhấn mạnh của đại từ אָנֹכִי cùng לְבַדִּי, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: לָשֵׂאת
  choice: gánh nổi
  rationale: Động từ mang nghĩa mang hoặc gánh; trong ngữ cảnh trách nhiệm lãnh đạo, “gánh” vừa giữ hình ảnh nguyên văn vừa tự nhiên.
- source_word: אֶת כָּל הָעָם הַזֶּה
  choice: cả dân này
  rationale: “Cả” chuyển tải כָּל; “dân này” giữ cách chỉ định trực tiếp của הָעָם הַזֶּה.
- source_word: כִּי כָבֵד מִמֶּנִּי
  choice: vì họ quá nặng đối với tôi
  rationale: Giữ ẩn dụ “nặng” và cấu trúc so sánh/hạn định מִמֶּנִּי; dùng “họ” theo cách quy chiếu tự nhiên đến tập thể người trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ hình ảnh “gánh” và “nặng” của tiếng Hê-bơ-rơ, không giải nghĩa ẩn dụ thành một khái niệm thần học cụ thể.
