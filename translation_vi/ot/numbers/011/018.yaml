  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: vi
  text: 'Ngươi hãy bảo dân chúng: ‘Hãy tự thánh hóa mình[a] cho ngày mai, và các ngươi sẽ ăn thịt; vì các ngươi đã khóc than đến tai Yahweh rằng: “Ai sẽ cho chúng ta ăn thịt? Vì ở Ai Cập, chúng ta đã sống tốt.” Yahweh sẽ ban thịt cho các ngươi, và các ngươi sẽ ăn.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tự biệt riêng mình cho ngày mai.” Động từ Hê-bơ-rơ chỉ việc tự đặt mình riêng ra để chuẩn bị cho hành động của Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאמַר
  choice: Ngươi hãy nói
  rationale: Dạng vị hoàn thành 2ms mang lực mệnh lệnh, nói với Môi-se; cách dịch này tự nhiên mà vẫn giữ cấu trúc chỉ thị.
- source_word: הִתְקַדְּשׁוּ
  choice: Hãy thánh hóa mình
  rationale: Mệnh lệnh Hitpael của קדשׁ chỉ việc tự biệt riêng và chuẩn bị trước hành động của Đức Chúa Trời; giữ sắc thái thánh thiêng thay vì chỉ nói ‘chuẩn bị’.
- source_word: לְמָחָר
  choice: để chuẩn bị cho ngày mai
  rationale: Giới từ לְ quy việc tự thánh hóa hướng đến ngày sắp tới; diễn đạt rõ quan hệ chuẩn bị trong tiếng Việt.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: rồi các ngươi sẽ ăn thịt
  rationale: בָּשָׂר trong văn cảnh là thịt dùng làm thức ăn; động từ nối sau mệnh lệnh mang ý kết quả hoặc tương lai.
- source_word: בְּכִיתֶם
  choice: các ngươi đã khóc
  rationale: Qatal nói đến hành động đã xảy ra và làm căn cứ cho lời đáp sắp tới của Yahweh.
- source_word: בְּאָזְנֵי יְהוָה
  choice: khóc thấu tai Yahweh
  rationale: Giữ hình ảnh ‘trong tai’ của tiếng Hê-bơ-rơ bằng một thành ngữ tiếng Việt tự nhiên, cho thấy Yahweh đã nghe tiếng than khóc.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Ai sẽ cho chúng ta ăn thịt?
  rationale: Hiphil của אכל mang nghĩa khiến hoặc cho ăn; ‘cho chúng ta ăn thịt’ vừa sát nghĩa vừa tự nhiên hơn ‘nuôi chúng ta bằng thịt’ trong tiếng Việt.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: Vì ở Ai Cập, chúng ta được sung sướng
  rationale: טוֹב לָנוּ diễn tả tình trạng được cho là tốt đối với họ; ‘được sung sướng’ tự nhiên, không thêm ý so sánh vốn không được biểu thị rõ trong nguyên văn.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: Yahweh sẽ ban thịt cho các ngươi
  rationale: Giữ liên từ đơn giản của nguyên văn ở cấp diễn ngôn, không thêm từ ‘vì vậy’; ‘ban’ phù hợp với chủ thể thần linh mà không đổi nội dung.
- source_word: וַאֲכַלְתֶּם
  choice: và các ngươi sẽ ăn
  rationale: Giữ sự lặp lại có chủ ý của nguyên văn và sắc thái tương lai/kết quả.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm ‘Yahweh’ bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của הִתְקַדְּשׁוּ
  choice: thánh hóa mình
  alternative: chuẩn bị mình
  rationale: Bản dịch chính giữ nội dung biệt riêng/thánh thiêng của gốc קדשׁ; chú thích nêu cách diễn đạt chức năng dễ hiểu hơn mà không xóa sắc thái thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘ngươi/các ngươi’ để phản ánh sự chuyển đổi số ít (lời phán với Môi-se) sang số nhiều (lời dành cho dân chúng). Giữ danh Yahweh và sự lặp lại ở cuối câu theo nguyên văn.
