    issue: “được sung sướng” cho כִּי טוֹב לָנוּ בְּמִצְרָיִם
    rationale: “Sung sướng” tăng cường ý nghĩa vượt quá mệnh đề đơn giản “điều đó tốt cho chúng ta.” Nên dùng “chúng ta đã sống tốt” để giữ tính khái quát của nguyên văn.
  - severity: medium
    issue: “khóc thấu tai Yahweh” cho בְּאָזְנֵי יְהוָה
    rationale: Cụm này không phải cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại. “Khóc than đến tai Yahweh” duy trì hình ảnh tiếng khóc được Yahweh nghe.
  - severity: low
    issue: “để chuẩn bị cho ngày mai” cho לְמָחָר
    rationale: Ý chuẩn bị có thể được hàm ý từ động từ “tự thánh hóa”; thêm “để chuẩn bị” trong câu chính hơi giải thích. “Cho ngày mai” sát và gọn hơn.
