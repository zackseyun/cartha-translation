- from: 'Ngươi hãy nói với dân chúng: ‘Hãy thánh hóa mình[a] để chuẩn bị cho ngày mai, rồi các ngươi sẽ ăn thịt, vì các ngươi đã khóc thấu tai Yahweh rằng: “Ai sẽ cho chúng ta ăn thịt? Vì ở Ai Cập, chúng ta được sung sướng.” Yahweh sẽ ban thịt cho các ngươi, và các ngươi sẽ ăn.’'
