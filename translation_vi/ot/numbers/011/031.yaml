revisions:
- from: Bấy giờ, một luồng gió từ Đức Giê-hô-va thổi đến[a], cuốn chim cút từ biển vào và rải chúng quanh trại, xa chừng một ngày đường về phía này và một ngày đường về phía kia, khắp chung quanh trại, ở độ cao khoảng hai cu-bít trên mặt đất.[b]
  to: Bấy giờ, một cơn gió từ Đức Yahweh nổi lên[a], cuốn chim cút từ biển vào và rải chúng quanh trại, xa chừng một ngày đường về phía này và một ngày đường về phía kia, khắp chung quanh trại, ở độ cao khoảng hai cu-bít trên mặt đất.[b]
