  source_fidelity: 'Bản dịch phản ánh tốt mạch chính: một cơn gió có nguồn từ YHWH đưa chim cút từ biển đến, phân bố quanh trại trong phạm vi một ngày đường, và nêu số đo hai cu-bít. Tuy nhiên, danh thánh יהוה cần được nhất quán chuyển là “Yahweh” theo quyết định của dự án và dấu vết kiểm tra tiếng Anh, thay vì “Giê-hô-va”. “Nổi lên” diễn đạt tự nhiên hơn “thổi đến” cho נָסַע, vốn nhấn nguồn khởi phát từ Yahweh.'
  naturalness: Câu văn hiện đại và dễ hiểu. Bản sửa dùng “một cơn gió ... nổi lên” tự nhiên hơn khi nói về gió, đồng thời tránh gợi ý rằng gió chỉ thổi tới từ một hướng không nêu rõ. Sự lặp lại “quanh trại ... khắp chung quanh trại” phản chiếu sự lặp lại và tính bao quát của tiếng Hê-bơ-rơ.
  terminology: Giữ “chim cút”, “trại”, “một ngày đường” và “cu-bít” là phù hợp. “Đức Yahweh” bảo toàn danh riêng יהוה theo chính sách đã nêu. Chú thích b giữ đúng tính mơ hồ của cụm số đo, không khẳng định đó là độ dày của chim trên đất.
