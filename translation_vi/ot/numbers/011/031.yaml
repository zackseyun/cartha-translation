  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: vi
  text: Bấy giờ, một cơn gió từ Đức Yahweh nổi lên[a], cuốn chim cút từ biển vào và rải chúng quanh trại, xa chừng một ngày đường về phía này và một ngày đường về phía kia, khắp chung quanh trại, ở độ cao khoảng hai cu-bít trên mặt đất.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thần linh từ Đức Yahweh đi ra”; trong ngữ cảnh này, nghĩa “gió” phù hợp hơn vì nó cuốn chim cút từ biển vào.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “khoảng hai cu-bít trên mặt đất” (khoảng 90 cm). Cụm này có thể chỉ độ cao chim bay hoặc được rải ra, chứ không nhất thiết là một lớp chim dày chừng ấy trên mặt đất.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: một luồng gió
  rationale: רוּחַ có thể chỉ gió, hơi thở hoặc thần linh; trong ngữ cảnh này, tác nhân cuốn chim cút từ biển vào rõ ràng phù hợp nhất với nghĩa “gió”.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: từ Đức Giê-hô-va thổi đến
  rationale: נָסַע diễn tả sự chuyển động hay khởi hành; cách dịch này tự nhiên trong tiếng Việt khi chủ thể là gió, đồng thời giữ rõ nguồn gốc từ Đức Giê-hô-va.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng quen thuộc trong tiếng Việt để phân biệt thánh danh với tước hiệu “Chúa”.
- source_word: וַיָּגָז שַׂלְוִים
  choice: cuốn chim cút ... vào
  rationale: Động từ גוז hiếm gặp ở đây chỉ tác động của gió đưa chim cút đến; “cuốn ... vào” giữ được lực chuyển động mà vẫn tự nhiên.
- source_word: מִן הַיָּם
  choice: từ biển
  rationale: Giữ nghĩa địa lý trực tiếp của cụm từ, không chuyển thành một hướng phương vị.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: rải chúng quanh trại
  rationale: נטשׁ có thể mang nghĩa trải ra, bỏ lại hoặc quăng xuống. “Rải” phù hợp với phạm vi phân bố được mô tả tiếp theo; “quanh trại” tránh hàm ý chim phủ trực tiếp lên lều trại.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: xa chừng một ngày đường về phía này và một ngày đường về phía kia
  rationale: Giữ cấu trúc lặp và ý chỉ phạm vi tính từ trại theo các phía.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: khắp chung quanh trại
  rationale: Diễn đạt tính bao quát của dạng số nhiều trong tiếng Hê-bơ-rơ.
- source_word: וּכְאַמָּתַיִם
  choice: khoảng hai cu-bít
  rationale: Giữ đơn vị đo cổ; “khoảng” phản ánh tiền tố so sánh כְּ. Hai cu-bít tương đương khoảng 90 cm.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: trên mặt đất
  rationale: Cụm từ theo sát nghĩa đen là “trên mặt đất”; khi đi với số đo chiều cao, tiếng Việt tự nhiên hiểu là độ cao so với mặt đất, nhưng chú thích vẫn bảo lưu khả năng khác.
theological_decisions:
- issue: Tác nhân đến từ Đức Giê-hô-va
  choice: Mô tả một luồng gió bắt nguồn từ Đức Giê-hô-va và đưa chim cút đến
  alternative: Có thể hiểu רוּחַ là “thần linh/thần khí từ Đức Giê-hô-va”
  rationale: Ngữ cảnh vật lý ủng hộ nghĩa “gió”, nhưng chú thích bảo lưu đa nghĩa vốn có của רוּחַ và không giải thích quá mức cách Đức Chúa Trời hành động qua tác nhân tự nhiên.
- issue: Chiều cao hay độ dày của lớp chim cút
  choice: ở độ cao khoảng hai cu-bít trên mặt đất
  alternative: một lớp dày khoảng hai cu-bít trên mặt đất
  rationale: Cú pháp Hê-bơ-rơ không xác định dứt khoát đây là độ cao chim bay/phân bố hay độ dày của lớp chim trên đất; bản văn chính chọn cách đọc hợp lý trong ngữ cảnh và chú thích giữ lại sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trại”, “một ngày đường” và giữ “cu-bít” để bảo tồn bối cảnh cổ; chú thích cung cấp trị số gần đúng theo hệ mét. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
