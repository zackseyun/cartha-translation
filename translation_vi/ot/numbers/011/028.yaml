  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: vi
  text: 'Bấy giờ, Giô-suê, con trai Nun, người từ thuở trẻ đã làm phụ tá cho Môi-se[a], đáp lời: “Thưa ngài Môi-se, xin hãy ngăn họ lại![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một trong những người trẻ của ông,” hoặc có lẽ: “thuộc số những người được ông chọn.” Cụm từ Hê-bơ-rơ cô đọng và có phần không rõ nghĩa.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “xin cấm họ.” Động từ Hê-bơ-rơ có thể có nghĩa là kiềm giữ, ngăn lại hoặc cấm đoán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Bấy giờ ... lên tiếng
  rationale: Động từ ענה cùng waw liên tiếp đưa lời đáp vào mạch kể chuyện. “Lên tiếng” tự nhiên trong tiếng Việt và không nhất thiết hàm ý rằng trước đó có một câu hỏi trực tiếp.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Giô-suê con trai Nun
  rationale: Dùng dạng tên Giô-suê quen thuộc trong tiếng Việt; “con trai Nun” diễn đạt trực tiếp quan hệ phụ tử.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: người phụ tá của Môi-se
  rationale: מְשָׁרֵת chỉ người phục vụ trong vai trò trợ giúp. “Người phụ tá” phù hợp ngữ cảnh và tránh sắc thái nô lệ không cần thiết của “đầy tớ”.
- source_word: מִבְּחֻרָיו
  choice: từ thuở trẻ
  rationale: Cụm Hê-bơ-rơ cô đọng và có thể được hiểu là nói về thời trẻ của Giô-suê, hoặc về việc ông thuộc nhóm người trẻ hay người được chọn của Môi-se. Bản chính chọn cách diễn đạt tự nhiên “từ thuở trẻ”, còn chú thích giữ các khả năng khác.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: Thưa ngài Môi-se
  rationale: Đây là cách xưng hô kính trọng với một người có thẩm quyền. “Thưa ngài” truyền đạt sự tôn kính tự nhiên trong tiếng Việt hiện đại mà không khiến độc giả hiểu đây là tước hiệu dành cho Đức Chúa Trời.
- source_word: כְּלָאֵם
  choice: xin ngăn họ lại
  rationale: Mệnh lệnh từ כלא có thể mang nghĩa kiềm giữ, ngăn lại hoặc cấm. “Ngăn họ lại” giữ được phạm vi nghĩa rộng mà không xác định quá mức cách thức ngăn cản.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Bấy giờ” giữ nhịp nối tiếp của câu chuyện; lời thưa “Thưa ngài Môi-se” thể hiện sự kính trọng đối với cấp trên. Dấu chú thích được đặt ngay sau những cụm từ mà chú thích giải thích.
