source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với Môi-se: “Chẳng lẽ tay Đức Giê-hô-va đã ngắn lại sao?[a] Bây giờ, con sẽ thấy lời Ta có ứng nghiệm cho con hay không.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “Tay Đức Giê-hô-va đã ngắn lại sao?” Đây là thành ngữ hỏi liệu quyền năng của Đức Giê-hô-va có bị giới hạn hay không.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “điều Ta đã phán có xảy đến cho con hay không.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: Chẳng lẽ tay Đức Giê-hô-va đã ngắn lại sao?
  rationale: Giữ hình ảnh nhân hình và câu hỏi tu từ của tiếng Hê-bơ-rơ; “chẳng lẽ” truyền đạt tự nhiên sắc thái thách thức sự nghi ngờ.
- source_word: עַתָּה תִרְאֶה
  choice: Bây giờ, con sẽ thấy
  rationale: Diễn đạt trực tiếp thời điểm sắp xảy ra và thể tương lai; “con” phù hợp với lời Đức Chúa Trời nói trực tiếp với Môi-se.
- source_word: הֲיִקְרְךָ דְבָרִי אִם לֹא
  choice: lời ta có xảy đến cho con hay không
  rationale: Giữ danh từ số ít “lời ta,” ý xảy ra/ứng nghiệm của קרה, hậu tố ngôi hai “cho con,” và cấu trúc nghi vấn “có… hay không,” không ép nghĩa thành chỉ một cách hiểu.
theological_decisions:
- issue: Hình ảnh nhân hình về quyền năng của Đức Chúa Trời
  choice: Giữ nguyên hình ảnh “tay Đức Giê-hô-va đã ngắn lại”
  alternative: Quyền năng của Đức Giê-hô-va đã bị giới hạn
  rationale: Nguyên văn dùng “tay” như hình ảnh chỉ năng lực hành động. Giữ hình ảnh này bảo tồn sức mạnh tu từ mà không khẳng định Đức Chúa Trời có thân thể theo nghĩa thô.
- issue: Sắc thái lời Đức Chúa Trời chất vấn Môi-se
  choice: Dùng câu hỏi tu từ “Chẳng lẽ… sao?”
  alternative: Có phải tay Đức Giê-hô-va đã ngắn lại không?
  rationale: “Chẳng lẽ… sao?” thể hiện tự nhiên trong tiếng Việt lời bác bỏ sự hoài nghi, đồng thời vẫn giữ hình thức câu hỏi của nguyên văn.
- issue: Phạm vi nghĩa của דְבָרִי và הֲיִקְרְךָ
  choice: “lời ta có xảy đến cho con”
  alternative: “điều ta đã phán có thành sự thật đối với con”
  rationale: Cách chọn giữ được sự cô đọng và độ mở của “lời/sự việc” cùng động từ “xảy đến,” tránh giải thích quá mức thành lời hứa hoặc sự ứng nghiệm theo một công thức thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ Hê-bơ-rơ trong chính văn, kèm chú thích giải nghĩa; duy trì cách xưng hô “ta—con” trong lời Đức Chúa Trời nói với Môi-se. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
