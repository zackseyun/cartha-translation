language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: vi
  text: Chúng tôi nhớ cá chúng tôi từng ăn ở Ai Cập mà không phải trả tiền[a], dưa chuột, dưa, tỏi tây, hành và tỏi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “miễn phí” hoặc “không mất tiền.” Đây là cách những người đang than phiền hồi tưởng về Ai Cập, dù trên thực tế họ từng sống trong cảnh nô lệ tại đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: Chúng tôi nhớ
  rationale: Dạng hoàn thành Qal ngôi thứ nhất số nhiều trong lời nói trực tiếp diễn tả sự hồi tưởng hiện tại; cách dịch này tự nhiên và giữ đúng sắc thái than phiền.
- source_word: הַדָּגָה
  choice: cá
  rationale: Danh từ chỉ chung cá dùng làm thức ăn; tiếng Việt không cần từ chỉ số lượng hay số nhiều ở đây.
- source_word: אֲשֶׁר נֹאכַל
  choice: mình từng ăn
  rationale: Dạng yiqtol mang nghĩa hành động quen thuộc trong quá khứ; “từng ăn” thể hiện rõ sắc thái hồi tưởng mà vẫn tự nhiên trong câu nói.
- source_word: בְּמִצְרַיִם
  choice: ở Ai Cập
  rationale: Cụm từ chỉ địa điểm được dịch trực tiếp, tự nhiên trong tiếng Việt.
- source_word: חִנָּם
  choice: mà không phải trả tiền
  rationale: Diễn đạt nghĩa ăn không mất tiền; không biến lời hồi tưởng chủ quan của dân chúng thành nhận định khách quan về cảnh nô lệ tại Ai Cập.
- source_word: הַקִּשֻּׁאִים
  choice: dưa chuột
  rationale: Tên gọi thông dụng trong tiếng Việt hiện đại cho loại rau quả này.
- source_word: הָאֲבַטִּחִים
  choice: dưa gang
  rationale: Từ Hê-bơ-rơ chỉ một loại dưa, có thể là dưa hấu; “dưa gang” giữ nghĩa rộng hơn trong văn cảnh danh sách thực phẩm, còn khả năng khác được ghi chú.
- source_word: הֶחָצִיר
  choice: tỏi tây
  rationale: Trong danh sách thực phẩm, từ này hợp lý nhất khi chỉ một loại rau thuộc họ hành, theo cách hiểu truyền thống là tỏi tây, thay vì nghĩa thông thường là cỏ.
- source_word: הַבְּצָלִים
  choice: hành
  rationale: Cách gọi tự nhiên và chính xác trong tiếng Việt; văn cảnh phân biệt với tỏi tây và tỏi.
- source_word: הַשּׁוּמִים
  choice: tỏi
  rationale: Nghĩa từ vựng tiêu chuẩn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch חִנָּם trong bối cảnh dân Israel từng làm nô lệ tại Ai Cập
  choice: mà không phải trả tiền
  alternative: miễn phí; tự do ăn
  rationale: Câu này thuật lại lời than phiền theo góc nhìn của chính dân chúng, không đưa ra đánh giá thần học khách quan về ách nô lệ. Cách dịch trực tiếp giữ nguyên sự mỉa mai và căng thẳng của văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “mình” trong mệnh đề phụ để tránh lặp “chúng tôi” nặng nề; danh sách thực phẩm giữ nhịp gọn của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ tương ứng.
