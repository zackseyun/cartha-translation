id: NUM.11.2
reference: Numbers 11:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: vi
  text: Dân chúng kêu cứu Môi-se; Môi-se cầu nguyện cùng Yahweh, và ngọn lửa dịu xuống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngọn lửa lắng xuống.” Động từ Hê-bơ-rơ gợi hình ảnh chìm hoặc lắng xuống, nghĩa là ngọn lửa giảm dần.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: liền kêu cứu
  rationale: Động từ צעק diễn tả tiếng kêu trong cảnh nguy cấp, thường nhằm cầu cứu; “kêu cứu” truyền đạt sắc thái này tự nhiên hơn “kêu lên”.
- source_word: הָעָם
  choice: dân chúng
  rationale: עם ở đây chỉ cộng đồng Israel nói chung; “dân chúng” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל hướng lời kêu đến Môi-se; trong cấu trúc “kêu cứu với”, cách dịch này tự nhiên và giữ đúng đối tượng được cầu cứu.
- source_word: וַיִּתְפַּלֵּל
  choice: cầu nguyện
  rationale: Dạng Hitpael của פלל thường có nghĩa là cầu nguyện. Ngữ cảnh hàm ý Môi-se cầu thay cho dân, nhưng bản dịch không chuyển thẳng thành “cầu thay” để tránh nói rõ hơn nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng chuyển tự “Yahweh”, thay vì thay bằng một tước hiệu.
- source_word: וַתִּשְׁקַע
  choice: dịu xuống
  rationale: שקע có nghĩa gốc là chìm xuống hoặc lắng xuống; khi chủ thể là lửa, “dịu xuống” là cách nói tiếng Việt tự nhiên và vẫn diễn tả ngọn lửa giảm bớt, không nhất thiết bị dập tắt tức thì.
- source_word: הָאֵשׁ
  choice: ngọn lửa
  rationale: אשׁ chỉ ngọn lửa đã được nhắc đến trong ngữ cảnh ngay trước đó; “ngọn lửa” tự nhiên hơn “lửa” khi làm chủ ngữ xác định.
theological_decisions:
- issue: Cách dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh יהוה. Dạng “Yahweh” bảo tồn tính chất tên riêng, không thay bằng tước hiệu và không khẳng định cách phát âm “Jehovah” về sau.
- issue: Mức độ hàm ý cầu thay trong וַיִּתְפַּלֵּל
  choice: cầu nguyện
  alternative: cầu thay
  rationale: Ngữ cảnh cho thấy lời cầu nguyện có lợi cho dân, nhưng động từ tự nó được dịch trực tiếp là “cầu nguyện”; như vậy giữ được hàm ý mà không biến nó thành nội dung minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu chấm phẩy để nối hai hành động liên tiếp có quan hệ chặt chẽ; giữ “Yahweh” dưới dạng tên riêng. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
