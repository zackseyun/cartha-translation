  terminology: Giữ “Môi-se” và “Yahweh” nhất quán, trang trọng và phù hợp với chủ trương chuyển tự danh יהוה. Không chuyển động từ cầu nguyện thành “cầu thay”, vì đó chỉ là hàm ý ngữ cảnh.
  issues:
