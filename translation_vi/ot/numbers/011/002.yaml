    issue: “kêu cứu với Môi-se”
    rationale: Giới từ “với” ở đây không tự nhiên trong tiếng Việt và có thể gợi nghĩa đồng hành (“cùng Môi-se kêu cứu”), thay vì hướng lời kêu đến Môi-se như אֶל מֹשֶׁה.
  - severity: low
    issue: “cầu nguyện với Yahweh”
    rationale: Dù có thể hiểu được, “cầu nguyện cùng Yahweh” tự nhiên hơn trong văn phong Kinh Thánh tiếng Việt và biểu đạt rõ Yahweh là Đấng được cầu nguyện đến.
