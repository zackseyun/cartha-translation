  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: vi
  text: 'suốt cả một tháng, cho đến khi thịt ra khỏi lỗ mũi các ngươi và trở thành điều ghê tởm đối với các ngươi,[a] vì các ngươi đã khước từ Yahweh, Đấng đang ở giữa các ngươi, và đã khóc trước mặt Ngài mà nói: ‘Tại sao chúng ta lại ra khỏi Ai Cập?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trở thành điều kinh tởm đối với các ngươi.” Từ Hê-bơ-rơ diễn tả cảm giác ghê tởm mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: suốt cả một tháng
  rationale: Cụm từ Hê-bơ-rơ diễn tả trọn thời gian một tháng; cách dịch này tự nhiên và giữ được sắc thái nhấn mạnh.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: thịt trào ra đằng mũi
  rationale: Động từ chỉ việc đi hoặc trào ra, còn אַף mang nghĩa cụ thể là mũi/lỗ mũi. Bổ sung “thịt” theo đối tượng đã nêu trong ngữ cảnh để câu tiếng Việt rõ và tự nhiên.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: trở nên ghê tởm đối với các ngươi
  rationale: זָרָא diễn tả sự ghê tởm hoặc kinh tởm mạnh; cách dịch này giữ hình ảnh và cường độ của nguyên văn.
- source_word: מְאַסְתֶּם
  choice: đã khước từ
  rationale: Động từ có nghĩa từ chối, loại bỏ, có thể hàm ý coi thường. “Khước từ” truyền đạt hành động chối bỏ mà không diễn giải quá mức cảm xúc.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được thể hiện trực tiếp bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: Đấng đang ở giữa các ngươi
  rationale: Cụm này nói đến sự hiện diện của Yahweh trong cộng đồng, không phải sự hiện diện nội tâm trong từng cá nhân.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: đã khóc trước mặt Ngài
  rationale: Giữ cả hành động khóc và ý niệm diễn ra trước sự hiện diện của Yahweh.
- source_word: לָמָּה זֶּה יָצָאנוּ מִמִּצְרָיִם
  choice: Tại sao chúng ta lại ra khỏi Ai Cập?
  rationale: “Lại” truyền đạt tự nhiên sắc thái than trách của לָמָּה זֶּה mà không thêm từ nhấn mạnh vượt quá nguyên văn; “ra khỏi Ai Cập” giữ ngôn ngữ về cuộc xuất hành.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay thế bằng tước hiệu.
- issue: Ý nghĩa sự hiện diện trong אֲשֶׁר בְּקִרְבְּכֶם
  choice: Đấng đang ở giữa các ngươi
  alternative: Đấng ở trong các ngươi
  rationale: Ngữ cảnh nói về sự hiện diện của Yahweh giữa cộng đồng Israel; cách dịch này tránh khiến người đọc hiểu thành sự nội tại trong từng cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “các ngươi” vì đây là lời phán xét trực tiếp dành cho toàn dân; dùng “Ngài” để chỉ Yahweh. Dấu chân chú [a] được đặt ngay sau mệnh đề liên quan.
