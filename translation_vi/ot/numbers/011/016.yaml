source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy tập hợp[a] cho Ta bảy mươi người trong số các trưởng lão của Israel, mà con biết là các trưởng lão của dân và các viên chức[b] của dân. Hãy đưa họ đến Lều Gặp Gỡ, rồi để họ đứng tại đó cùng con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy quy tụ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người phụ trách”; từ Hê-bơ-rơ chỉ những người thi hành nhiệm vụ hành chính hoặc quản trị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu, để phản ánh trực tiếp Danh được dùng trong bản Hê-bơ-rơ.
- source_word: אֶסְפָה לִּי
  choice: Hãy tập hợp cho Ta
  rationale: Diễn đạt mệnh lệnh quy tụ người lại và giữ sắc thái của לִּי, tức là thực hiện việc ấy cho Yahweh.
- source_word: שִׁבְעִים אִישׁ
  choice: bảy mươi người
  rationale: אִישׁ chỉ những người nam trưởng thành trong bối cảnh lãnh đạo; trong tiếng Việt, “người” sau số đếm tự nhiên hơn, còn bối cảnh các trưởng lão đã xác định nhóm được nói đến.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: trong số các trưởng lão Israel
  rationale: Giới từ מִן biểu thị việc chọn người từ một nhóm lớn hơn; cách nói này rõ và tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: là những người con biết đang làm
  rationale: Giữ ý Môi-se đã biết tư cách của những người được chọn, đồng thời chuyển cấu trúc Hê-bơ-rơ sang tiếng Việt tự nhiên.
- source_word: זִקְנֵי הָעָם
  choice: trưởng lão của dân
  rationale: “Trưởng lão” diễn tả địa vị lãnh đạo cộng đồng, còn “của dân” bảo toàn quan hệ sở thuộc trong nguyên văn.
- source_word: וְשֹׁטְרָיו
  choice: và viên chức của dân
  rationale: שֹׁטֵר ở đây chỉ người đảm nhiệm chức vụ hành chính hoặc thi hành quyền quản trị; lặp lại “của dân” làm rõ tiền ngữ của hậu tố số ít trong tiếng Hê-bơ-rơ.
- source_word: וְלָקַחְתָּ אֹתָם אֶל
  choice: Hãy đưa họ đến
  rationale: לקח có nghĩa cơ bản là lấy hoặc dẫn đi; với một đích đến cụ thể, “đưa ... đến” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Gặp Gỡ
  rationale: Dịch minh bạch tên gọi nơi Yahweh gặp dân và phán dạy, sát nghĩa hơn đối với độc giả hiện đại so với việc dùng một thuật ngữ giáo hội khó hiểu.
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: rồi để họ đứng tại đó cùng con
  rationale: Dạng hitpael của יצב diễn tả việc đứng vào vị trí hoặc trình diện; câu dịch giữ lực chỉ thị mà vẫn tự nhiên.
theological_decisions:
- issue: Cách thể hiện Danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Danh riêng gồm bốn phụ âm. Phiên âm “Yahweh” bảo toàn việc bản văn gọi đích danh Đức Chúa Trời mà không thay bằng tước hiệu hay chọn một lối phiên âm truyền thống khác.
- issue: Cách xưng hô trong lời Yahweh nói với Môi-se
  choice: Ta / con
  alternative: Ta / ngươi
  rationale: Nguyên văn chỉ đánh dấu ngôi thứ nhất và ngôi thứ hai, không ấn định hệ thống đại từ tiếng Việt. “Ta / con” trang trọng nhưng dễ hiểu và không thêm sắc thái xa cách không bắt buộc bởi bản Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc mệnh lệnh được chia thành hai câu để lời phán rõ ràng. Các dấu chú thích [a], [b] được đặt ngay sau từ ngữ mà chú thích giải thích.
