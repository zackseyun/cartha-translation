revisions:
- from: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy tập hợp[a] cho Ta bảy mươi người trong số các trưởng lão Israel, là những người con biết đang làm trưởng lão của dân và viên chức[b] của dân. Hãy đưa họ đến Lều Gặp Gỡ, rồi để họ đứng tại đó cùng con.”'
  to: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy tập hợp[a] cho Ta bảy mươi người trong số các trưởng lão của Israel, mà con biết là các trưởng lão của dân và các viên chức[b] của dân. Hãy đưa họ đến Lều Gặp Gỡ, rồi để họ đứng tại đó cùng con.”'
  rationale: Chỉnh sửa tối thiểu để loại bỏ sắc thái không có trong nguyên văn (“đang làm”), làm rõ cấu trúc “mà con biết là”, và dùng cách diễn đạt sở thuộc tự nhiên hơn (“của Israel”). Không thay đổi nghĩa, giọng trang trọng, thuật ngữ chủ chốt, hay hệ thống chú thích.
  reviewer_model: gpt-5.6-terra
