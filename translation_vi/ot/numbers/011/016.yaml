  terminology: “Yahweh”, “trưởng lão”, “viên chức”, và “Lều Gặp Gỡ” đều phù hợp ngữ cảnh và nhất quán với các quyết định thuật ngữ. Chú thích b giải thích đúng nghĩa hành chính của שֹׁטְרִים; mốc chú thích được đặt đúng sau thuật ngữ liên quan.
