id: NUM.11.24
reference: Numbers 11:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: vi
  text: Môi-se đi ra và nói với dân chúng những lời của Yahweh. Ông tập hợp bảy mươi người trong số các trưởng lão của dân và cho họ đứng[a] chung quanh Lều[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đặt họ vào vị trí” hoặc “bố trí họ.” Động từ Hê-bơ-rơ có nghĩa đen là “khiến họ đứng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “Lều”; theo ngữ cảnh, có lẽ là Lều Hội Kiến.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: đi ra
  rationale: Diễn đạt trực tiếp động từ יצא trong mạch kể chuyện, tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: nói với dân chúng những lời của Yahweh
  rationale: Giữ cấu trúc cụ thể “những lời” thay vì khái quát thành “sứ điệp,” đồng thời diễn đạt דבר אֶל tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: וַיֶּאֱסֹף
  choice: tập hợp
  rationale: Phù hợp với nghĩa quy tụ một nhóm người và tự nhiên trong ngữ cảnh tổ chức các trưởng lão.
- source_word: שִׁבְעִים אִישׁ מִזִּקְנֵי הָעָם
  choice: bảy mươi người trong số các trưởng lão của dân
  rationale: “Người” tránh lối diễn đạt nặng nề “bảy mươi người nam”; phạm vi “các trưởng lão” trong ngữ cảnh vẫn bảo toàn đối tượng, còn “trong số” thể hiện rõ sắc thái bộ phận của מִן.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: cho họ đứng
  rationale: Phản ánh trực tiếp dạng Hiphil có nghĩa khiến hoặc cho đứng, đồng thời giữ được sắc thái mà cách dịch “bố trí” có thể diễn giải mạnh hơn.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: chung quanh Lều
  rationale: Giữ nguyên nghĩa đen “Lều” vì bản Hê-bơ-rơ chỉ dùng הָאֹהֶל, không có đầy đủ cụm “Lều Hội Kiến”; viết hoa cho thấy đây là chiếc Lều đã được xác định trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; “Yahweh” bảo toàn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Giới tính trong שִׁבְעִים אִישׁ
  choice: bảy mươi người trong số các trưởng lão
  alternative: bảy mươi người nam trong số các trưởng lão
  rationale: אִישׁ có hình thức giống đực và chỉ các trưởng lão trong bối cảnh này, nhưng tiếng Việt thông thường dùng “người” sau số đếm; thêm “nam” sẽ gượng và nhấn giới tính hơn cách diễn đạt tự nhiên của nguồn.
- issue: Nhận diện הָאֹהֶל
  choice: Lều
  alternative: Lều Hội Kiến
  rationale: Ngữ cảnh có thể xác định đây là Lều Hội Kiến, nhưng câu này chỉ nói “Lều”; bản dịch chính không thêm thành tố vắng mặt và ghi nhận cách hiểu theo ngữ cảnh trong chú thích.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “dân chúng” để tránh lặp “dân” quá sát, nhưng giữ “các trưởng lão của dân” theo thuật ngữ xã hội của nguyên văn. Các dấu chú thích được đặt ngay sau cụm từ liên quan và theo đúng thứ tự xuất hiện.
