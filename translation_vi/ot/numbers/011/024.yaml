  terminology: “Yahweh” nhất quán với quyết định dịch danh YHWH của dự án. “Các trưởng lão của dân” chuyển tải đúng vai trò xã hội của זִקְנֵי. “Lều” giữ đúng danh từ xác định nhưng chưa đầy đủ của nguyên văn; chú thích nêu nhận diện theo ngữ cảnh mà không áp đặt vào bản văn.
