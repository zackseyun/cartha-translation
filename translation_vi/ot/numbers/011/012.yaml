id: NUM.11.12
reference: Numbers 11:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: vi
  text: 'Ta đã cưu mang cả dân này sao? Ta đã sinh ra nó sao, mà Ngài lại bảo ta: “Hãy ẵm nó vào lòng ngươi, như người chăm nom[a] ẵm đứa trẻ còn bú, rồi đem nó đến miền đất mà Ngài đã thề ban cho tổ phụ nó[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người nuôi dưỡng” hoặc “người bảo hộ”.'
    reason: lexical_alternative
  - marker: b
    text: Bản Hê-bơ-rơ dùng đại từ số ít “nó” và “tổ phụ nó”, coi toàn dân như một đứa trẻ duy nhất; cũng có thể diễn đạt theo số nhiều là “họ” và “tổ phụ họ”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: Ta đã cưu mang ... sao?
  rationale: Câu hỏi tu từ có đại từ ngôi thứ nhất nhấn mạnh. “Cưu mang” diễn đạt tự nhiên ý thụ thai/mang thai và giữ nguyên ẩn dụ người mẹ.
- source_word: כָּל הָעָם הַזֶּה
  choice: cả dân này
  rationale: “Dân” là danh từ tập hợp số ít, tự nhiên trong tiếng Việt và phù hợp với các đại từ số ít tiếp theo.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: Ta đã sinh ra nó sao
  rationale: Giữ ẩn dụ sinh nở và hậu tố số ít chỉ toàn dân như một đứa trẻ duy nhất.
- source_word: כִּי תֹאמַר אֵלַי
  choice: mà Ngài lại bảo ta
  rationale: “Mà ... lại” truyền đạt tự nhiên sắc thái phản vấn và lời than phiền trong ngữ cảnh; “Ngài” chỉ Đức Chúa Trời, còn “ta” phản ánh lời tự xưng của Môi-se mà không thêm quan hệ thân tộc.
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: Hãy ẵm nó vào lòng ngươi
  rationale: “Ẵm” phù hợp với hình ảnh chăm sóc trẻ nhỏ; “vào lòng” giữ hình ảnh cụ thể của חֵיק mà vẫn tự nhiên trong tiếng Việt.
- source_word: הָאֹמֵן
  choice: người chăm nom
  rationale: Từ Hê-bơ-rơ chỉ người đảm trách việc nuôi nấng/chăm sóc một đứa trẻ. Cách dịch này không xác định quá mức giới tính hay chức phận.
- source_word: הַיֹּנֵק
  choice: đứa trẻ còn bú
  rationale: Diễn đạt rõ giai đoạn đứa trẻ vẫn đang bú, tự nhiên hơn một thuật ngữ cổ hoặc quá chuyên biệt.
- source_word: עַל הָאֲדָמָה
  choice: đến miền đất
  rationale: Trong ngữ cảnh chuyển động hướng tới nơi đã hứa, giới từ được diễn đạt theo đích đến. “Miền đất” nêu rõ lãnh thổ được hứa ban.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: mà Ngài đã thề ban cho tổ phụ nó
  rationale: Giữ ngôn ngữ lời thề; “ban” làm rõ điều tiếng Việt đòi hỏi trong cấu trúc này nhưng vốn được hàm ý bởi ngữ cảnh. Đại từ số ít tiếp tục hình ảnh dân như một đứa trẻ tập thể.
theological_decisions:
- issue: Các đại từ số ít chỉ toàn dân Israel
  choice: Dùng “nó” và “tổ phụ nó”
  alternative: Dùng “họ” và “tổ phụ họ”
  rationale: Bản Hê-bơ-rơ nhất quán dùng hậu tố số ít, trình bày cả dân như một đứa trẻ duy nhất trong ẩn dụ của Môi-se. Tiếng Việt có thể giữ cách nhân hóa tập thể này mà vẫn dễ hiểu.
- issue: Nghĩa của הָאֹמֵן
  choice: người chăm nom
  alternative: người nuôi dưỡng; người bảo hộ
  rationale: Từ này có thể chỉ người chịu trách nhiệm chăm sóc, nuôi nấng hoặc bảo hộ trẻ. “Người chăm nom” giữ độ rộng nghĩa, không biến nhân vật thành người cho bú.
- issue: Điều được thề liên quan đến miền đất
  choice: “đã thề ban cho”
  alternative: “đã thề với tổ phụ nó”
  rationale: Cú pháp Hê-bơ-rơ nói đến miền đất mà Đức Chúa Trời đã thề với tổ phụ; trong tiếng Việt, “thề ban cho” nêu rõ nội dung đã được ngữ cảnh hàm chứa mà không thay đổi đối tượng của lời hứa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tính khẩu ngữ vừa phải để giữ giọng than trách của Môi-se. “Ngài” dùng khi Môi-se thưa với Đức Chúa Trời; “ta/ngươi” trong lời trích dẫn giữ quan hệ vai nói rõ ràng. Hình ảnh thai nghén, sinh nở, ẵm vào lòng và trẻ còn bú được bảo toàn xuyên suốt.
