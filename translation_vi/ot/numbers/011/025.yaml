revisions:
- from: Bấy giờ, Yahweh ngự xuống trong đám mây và phán với ông. Ngài lấy một phần Thần Khí đang ngự trên ông mà đặt trên bảy mươi trưởng lão. Khi Thần Khí ngự trên họ, họ nói tiên tri, nhưng không tiếp tục nữa.[a]
  to: Bấy giờ, Yahweh ngự xuống trong đám mây và phán với ông. Ngài lấy một phần Thần Khí đang ngự trên ông mà đặt trên bảy mươi trưởng lão. Khi Thần Khí ngự trên họ, họ nói tiên tri, nhưng họ không tiếp tục nói tiên tri nữa.[a]
  rationale: Bản sửa chỉ làm rõ đối tượng của “không tiếp tục” là hoạt động nói tiên tri, như ngữ cảnh và cách hiểu chính yêu cầu. Chú thích được điều chỉnh rất nhẹ để duy trì công khai cách hiểu thay thế “họ không ngừng nói tiên tri” mà không ưu tiên nó trong thân bài.
