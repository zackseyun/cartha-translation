  - severity: low
    issue: Cách dẫn nhập chú thích “Cũng có thể dịch” hơi hẹp đối với một cụm mơ hồ về mặt ngữ nghĩa.
    rationale: “Cũng có thể hiểu” phù hợp hơn, vì chú thích nêu một cách hiểu truyền thống thay thế chứ không khẳng định một phương án dịch duy nhất.
