source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: vi
  text: Bấy giờ, Yahweh ngự xuống trong đám mây và phán với ông. Ngài lấy một phần Thần Khí đang ngự trên ông mà đặt trên bảy mươi trưởng lão. Khi Thần Khí ngự trên họ, họ nói tiên tri, nhưng họ không tiếp tục nói tiên tri nữa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “và họ không ngừng nói tiên tri.” Cụm từ Hê-bơ-rơ rất cô đọng và đã được hiểu theo nhiều cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu; cách viết này giữ được tính chất tên riêng trong bản Hê-bơ-rơ.
- source_word: וַיֵּרֶד
  choice: ngự xuống
  rationale: Diễn đạt chuyển động đi xuống, đồng thời dùng lối nói trang trọng, tự nhiên khi chủ thể là Đức Chúa Trời và vẫn giữ hình ảnh thần hiện của nguyên văn.
- source_word: בֶּעָנָן
  choice: trong đám mây
  rationale: Giữ hình ảnh Yahweh hiện diện trong đám mây; tiếng Việt không cần thêm từ chỉ định để thể hiện mạo từ xác định của tiếng Hê-bơ-rơ trong ngữ cảnh này.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: phán với ông
  rationale: “Phán” phù hợp khi Đức Chúa Trời là chủ thể; “ông” chỉ Môi-se theo ngữ cảnh mà không tự ý chèn tên vào câu.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: Ngài lấy một phần Thần Khí đang ngự trên ông
  rationale: Động từ hiếm אצל cùng giới từ מן diễn tả việc lấy từ hoặc phân chia từ điều đang ở trên Môi-se. “Một phần” làm rõ ý phân ban nhưng không nhằm nói Thần Khí bị suy giảm.
- source_word: רוּחַ
  choice: Thần Khí
  rationale: Trong ngữ cảnh, רוּחַ là quyền năng thần linh khiến các trưởng lão nói tiên tri, không phải gió hay tâm tính con người. “Thần Khí” vừa sát nghĩa vừa tránh thêm tính từ “Thánh” vốn không có trong câu.
- source_word: וַיִּתֵּן עַל
  choice: đặt trên
  rationale: Giữ cấu trúc và hình ảnh Thần Khí được đặt trên các trưởng lão, tương ứng với việc Thần Khí ngự trên họ ở mệnh đề sau.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: bảy mươi trưởng lão
  rationale: Diễn đạt tự nhiên trong tiếng Việt và nhận diện bảy mươi người ấy là các trưởng lão; từ “người” trong nguyên ngữ không cần dịch riêng vì số từ kết hợp trực tiếp với danh từ chỉ người.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: Khi Thần Khí ngự trên họ
  rationale: נוח על mang nghĩa nghỉ/ngự trên. “Ngự trên” tự nhiên, trang trọng và giữ hình ảnh sự hiện diện thần linh.
- source_word: וַיִּתְנַבְּאוּ
  choice: họ nói tiên tri
  rationale: Diễn đạt hoạt động tiên tri được động từ hitpael נבא chỉ đến trong ngữ cảnh; cách nói này rõ ràng hơn “họ tiên tri” đối với độc giả phổ thông.
- source_word: וְלֹא יָסָפוּ
  choice: nhưng không tiếp tục nữa
  rationale: Thể hiện cách hiểu theo ngữ cảnh rằng việc nói tiên tri không kéo dài sau dịp ấy, đồng thời ghi nhận cách hiểu đối lập trong chú thích vì cụm Hê-bơ-rơ ngắn gọn và đa nghĩa.
theological_decisions:
- issue: רוּחַ chỉ Thần Khí của Đức Chúa Trời hay một thần khí/tâm trạng
  choice: Thần Khí
  alternative: thần khí; tâm thần
  rationale: Thần Khí vốn ở trên Môi-se được đặt trên các trưởng lão và khiến họ nói tiên tri, nên ngữ cảnh mạnh mẽ chỉ đến Thần Khí của Đức Chúa Trời. Viết hoa là quyết định biên tập tiếng Việt.
- issue: Ý nghĩa của וְלֹא יָסָפוּ
  choice: họ không tiếp tục nói tiên tri nữa
  alternative: họ không ngừng nói tiên tri
  rationale: Theo cách hiểu thông dụng trong ngữ cảnh, hoạt động tiên tri chỉ xảy ra vào dịp ấy. Tuy nhiên, hình thức Hê-bơ-rơ cũng từng được hiểu là “họ không ngừng”, nên bản dịch không xóa bỏ cách hiểu này mà nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngự” cho sự hiện diện thần linh, “phán” khi Yahweh nói, và “ông” để chỉ Môi-se theo ngữ cảnh. Dấu chú thích [a] được đặt ngay sau mệnh đề có cách hiểu khác nhau.
