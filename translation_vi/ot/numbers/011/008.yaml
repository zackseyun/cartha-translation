base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: vi
  text: Dân chúng đi khắp nơi thu nhặt ma-na, rồi xay bằng cối đá hoặc giã trong cối, nấu trong nồi và làm thành bánh. Vị của nó giống như vị dầu béo ngậy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vị dầu tươi.” Cụm từ Hê-bơ-rơ ở đây khó xác định; có thể nói đến độ béo đậm hoặc tinh chất của dầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: đi khắp nơi
  rationale: Động từ diễn tả việc đi đây đó trong một khu vực; cách dịch này tự nhiên và phù hợp với hành động thường lệ khi dân chúng thu nhặt ma-na.
- source_word: לָקְטוּ
  choice: thu nhặt
  rationale: Diễn tả việc gom nhặt vật nằm rải rác, phù hợp trực tiếp với ngữ cảnh thu nhặt ma-na.
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: xay bằng cối đá
  rationale: רֵחַיִם chỉ cối xay hoặc cặp thớt cối; “cối đá” giữ hình ảnh cụ thể và diễn đạt tự nhiên trong tiếng Việt.
- source_word: דָכוּ בַּמְּדֹכָה
  choice: giã trong cối
  rationale: Động từ mang nghĩa giã hoặc nghiền nát, còn מְדֹכָה là cối giã; đây là cách nói thông dụng, rõ ràng trong tiếng Việt.
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: nấu trong nồi
  rationale: בשל có thể chỉ nấu hoặc luộc; “nấu” giữ được độ rộng nghĩa của động từ, còn פָּרוּר được diễn đạt là “nồi” mà không xác định quá mức loại dụng cụ.
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: làm thành bánh
  rationale: Diễn đạt rõ việc chế biến vật ấy thành các bánh; tiếng Việt không cần đánh dấu số nhiều tại danh từ.
- source_word: טַעְמוֹ
  choice: vị của nó
  rationale: Bám sát nghĩa vị hoặc hương vị và tự nhiên trong tiếng Việt.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: dầu béo ngậy
  rationale: Cụm từ Hê-bơ-rơ khó xác định; לְשַׁד gợi sự đậm béo, tinh chất hoặc độ tươi ngon. “Dầu béo ngậy” truyền đạt đặc tính phong phú, béo của dầu mà không biến một cách dứt khoát thành “dầu tươi”.
