translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ma-na” để làm rõ đối tượng mà đại từ Hê-bơ-rơ nhắc đến trong mạch văn; giữ chuỗi thao tác chế biến cụ thể và không giải quyết dứt khoát cụm từ khó ở cuối câu.
