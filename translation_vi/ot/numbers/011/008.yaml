  terminology: “Ma-na” phù hợp cách dùng Kinh Thánh tiếng Việt; các thuật ngữ dụng cụ bếp núc đều tự nhiên. Cần chỉnh chú thích để không diễn giải “tươi ngon” như một nét nghĩa đã được xác lập của cụm Hê-bơ-rơ khó.
  issues:
