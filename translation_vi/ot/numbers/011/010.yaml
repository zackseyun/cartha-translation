revisions:
- from: Môi-se nghe dân chúng khóc than theo từng gia tộc[a], mỗi người đàn ông tại cửa lều mình. Cơn giận của Yahweh bừng cháy dữ dội, và việc ấy là điều xấu trong mắt Môi-se.[b]
  to: Môi-se nghe dân chúng khóc than, từng gia tộc một[a], mỗi người đàn ông khóc ở cửa lều mình. Cơn giận của Yahweh bừng cháy dữ dội, còn trong mắt Môi-se, điều đó là xấu.[b]
  rationale: Bản sửa chỉ làm rõ cấu trúc phân phối của câu đầu trong tiếng Việt và cải thiện độ tự nhiên của trật tự từ. Không thay đổi nghĩa, mức độ nhấn mạnh, hoặc tính hàm ẩn của đối tượng được Môi-se đánh giá ở mệnh đề cuối.
  reviewer_model: gpt-5.6-terra
