source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: vi
  text: Môi-se nghe dân chúng khóc than, từng gia tộc một[a], mỗi người đàn ông khóc ở cửa lều mình. Cơn giận của Yahweh bừng cháy dữ dội, còn trong mắt Môi-se, điều đó là xấu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo từng gia đình”. Từ Hê-bơ-rơ có thể chỉ các nhóm thân tộc hoặc gia đình.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “điều đó khiến Môi-se không hài lòng”. Nguyên văn: “điều đó là xấu trong mắt Môi-se”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe
  rationale: Động từ שׁמע ở đây diễn tả Môi-se nhận biết tiếng khóc của dân chúng; “nghe” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: הָעָם
  choice: dân chúng
  rationale: עָם chỉ cộng đồng Y-sơ-ra-ên trong hoang mạc; “dân chúng” phù hợp hơn từ mang sắc thái chính trị như “quốc gia”.
- source_word: בֹּכֶה
  choice: khóc than
  rationale: Phân từ diễn tả hành động đang tiếp diễn; “khóc than” giữ được sắc thái than vãn trong văn cảnh.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: theo từng gia tộc
  rationale: מִשְׁפָּחָה có thể chỉ một nhóm thân tộc hay gia đình; “gia tộc” thể hiện quy mô nhóm họ hàng mà không loại bỏ nghĩa “gia đình”, được ghi ở chú thích.
- source_word: אִישׁ
  choice: mỗi người đàn ông
  rationale: Danh từ giống đực số ít được dùng theo nghĩa phân phối, nói đến từng người trong cộng đồng; bản dịch giữ dấu hiệu giới tính của nguyên văn.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: tại cửa lều mình
  rationale: Cụm từ chỉ vị trí ở lối vào lều; “cửa lều mình” tự nhiên trong tiếng Việt và giữ quan hệ sở hữu phân phối.
- source_word: וַיִּחַר אַף יְהוָה
  choice: cơn giận của Yahweh bừng cháy
  rationale: Cách dịch giữ hình ảnh cơn giận bốc cháy trong thành ngữ Hê-bơ-rơ, đồng thời vẫn rõ nghĩa trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: מְאֹד
  choice: dữ dội
  rationale: Từ này tăng cường mức độ; “dữ dội” kết hợp tự nhiên với hình ảnh cơn giận bừng cháy.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: và việc ấy là điều xấu trong mắt Môi-se
  rationale: Giữ thành ngữ đánh giá “xấu trong mắt” và không xác định rõ hơn đối tượng của lời đánh giá, vì nguyên văn cũng để điều đó hàm ẩn.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יְהוָה. “Yahweh” bảo tồn chức năng danh riêng và không thay nó bằng một tước hiệu.
- issue: Sắc thái giới tính của אִישׁ dùng theo nghĩa phân phối
  choice: mỗi người đàn ông
  alternative: mỗi người; mọi người
  rationale: Nguyên văn dùng danh từ giống đực số ít theo nghĩa phân phối; cách dịch này giữ đặc điểm ấy mà không thêm một vai trò như “chủ gia đình” vốn không có trong câu.
- issue: Chủ thể của lời đánh giá cuối câu
  choice: việc ấy là điều xấu trong mắt Môi-se
  alternative: việc ấy khiến Môi-se không hài lòng
  rationale: Đại từ chỉ “việc ấy” không xuất hiện rõ trong tiếng Hê-bơ-rơ, và điều bị Môi-se đánh giá có thể được hiểu từ toàn bộ tình huống trước đó. Bản chính giữ tính hàm ẩn và sức nặng của רָע.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “khóc than” để diễn tả hành động kéo dài; giữ hình ảnh Hê-bơ-rơ trong “cơn giận… bừng cháy” và “xấu trong mắt”. Danh Môi-se theo dạng quen thuộc trong tiếng Việt; danh Yahweh được giữ dưới dạng chuyển tự.
