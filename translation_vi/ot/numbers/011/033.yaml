id: NUM.11.33
reference: Numbers 11:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: vi
  text: Khi thịt còn ở giữa răng họ, trước khi bị ăn hết[a], cơn giận của Yahweh bừng cháy chống lại dân chúng, và Yahweh giáng trên dân chúng một tai họa rất lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “trước khi nó bị cắt đứt”—trong ngữ cảnh này có thể hiểu là trước khi thịt được ăn hết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: thịt
  rationale: Trong ngữ cảnh dân chúng ăn chim cút, từ này chỉ thịt động vật dùng làm thức ăn; “thịt” là cách dịch tự nhiên và chính xác trong tiếng Việt.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: vẫn còn giữa hai hàm răng họ
  rationale: 'Giữ hình ảnh sống động của nguyên văn: thịt vẫn đang ở trong miệng và chưa được nuốt hay ăn hết.'
- source_word: טֶרֶם יִכָּרֵת
  choice: trước khi được ăn hết
  rationale: טֶרֶם có nghĩa “trước khi”; יִכָּרֵת theo nghĩa đen là “bị cắt đứt”, nhưng trong ngữ cảnh ăn uống có thể chỉ việc thịt được dùng hết. Chú thích lưu lại nghĩa đen và sự không chắc chắn về sắc thái.
- source_word: וְאַף יְהוָה חָרָה
  choice: cơn giận của Yahweh bừng lên
  rationale: Bảo tồn ẩn dụ về cơn giận bốc cháy trong thành ngữ Hê-bơ-rơ, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: וַיַּךְ יְהוָה בָּעָם
  choice: Yahweh giáng trên họ
  rationale: Động từ נכה diễn tả hành động đánh hoặc giáng họa trong bối cảnh phán xét; cấu trúc này tự nhiên trong tiếng Việt và nối rõ với danh từ “tai họa” ở sau.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: một tai họa vô cùng khủng khiếp
  rationale: מַכָּה có thể là đòn đánh, sự hành hại hoặc tai họa; ở đây chỉ sự trừng phạt nghiêm trọng trên dân chúng. “Vô cùng khủng khiếp” truyền đạt mức độ đặc biệt lớn của רַבָּה מְאֹד.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Hình ảnh nhân cách hóa về cơn thịnh nộ của Đức Chúa Trời
  choice: cơn giận của Yahweh bừng lên
  alternative: Yahweh nổi giận
  rationale: Giữ ẩn dụ “cháy/bừng lên” của חרה אף, không làm nhẹ hoặc diễn giải phẳng cách nguyên văn mô tả sự phán xét.
- issue: Tác nhân của tai họa
  choice: Yahweh giáng trên họ một tai họa
  alternative: dân chúng mắc một trận dịch
  rationale: Nguyên văn nói rõ Yahweh là chủ thể của וַיַּךְ; bản dịch bảo tồn quan hệ tác nhân trực tiếp này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hai hàm răng” để diễn đạt tự nhiên hình ảnh בֵּין שִׁנֵּיהֶם; giữ danh Yahweh và ẩn dụ cơn giận bừng lên. Đại từ “họ” ở vế cuối quy chiếu dân chúng nhằm tránh lặp nặng nề.
