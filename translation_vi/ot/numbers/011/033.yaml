revisions:
- from: Khi thịt vẫn còn giữa hai hàm răng họ, trước khi được ăn hết[a], cơn giận của Yahweh bừng lên nghịch cùng dân chúng, và Yahweh giáng trên họ một tai họa vô cùng khủng khiếp.
  to: Khi thịt còn ở giữa răng họ, trước khi bị ăn hết[a], cơn giận của Yahweh bừng cháy chống lại dân chúng, và Yahweh giáng trên dân chúng một tai họa rất lớn.
  rationale: Chỉnh cách diễn đạt cho tự nhiên trong tiếng Việt hiện đại và giảm sắc thái cường điệu không có trong nguyên văn. Bản sửa vẫn giữ hình ảnh thịt còn giữa răng, ẩn dụ cơn giận bừng cháy, Yahweh là tác nhân trực tiếp, và tính khái quát của מַכָּה.
  reviewer_model: gpt-5.6-terra
