language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: vi
  text: 'Môi-se thưa với Yahweh: “Tại sao Ngài đã đối xử tệ với tôi tớ Ngài?[a] Tại sao Ngài không ban ân huệ cho con,[b] đến nỗi Ngài đặt gánh nặng của cả dân này lên con?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa sát hơn, động từ Híp-ri có thể dịch là “làm điều xấu cho” hoặc “gây điều tệ hại cho”; đây là lời than trách của Môi-se.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Híp-ri: “con không tìm được ân huệ trong mắt Ngài”, một thành ngữ chỉ việc nhận được sự ưu ái từ một người.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: הֲרֵעֹתָ לְעַבְדֶּךָ
  choice: Ngài lại đối xử tệ với tôi tớ Ngài
  rationale: Diễn đạt tự nhiên lời than trách mạnh của Môi-se; động từ Híp-ri theo nghĩa sát hơn là làm điều xấu hoặc gây điều tệ hại cho ai.
- source_word: לְעַבְדֶּךָ
  choice: tôi tớ Ngài
  rationale: Đây là cách Môi-se khiêm nhường tự xưng trước Đức Chúa Trời; “tôi tớ” phù hợp hơn “nô lệ” trong ngữ cảnh.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: con không được đẹp lòng Ngài
  rationale: Chuyển thành ngữ Híp-ri “tìm được ân huệ trong mắt Ngài” sang cách nói tiếng Việt tự nhiên mà vẫn giữ ý được Ngài đoái favor.
- source_word: לָשׂוּם אֶת מַשָּׂא
  choice: đặt gánh nặng
  rationale: Giữ nguyên hình ảnh cụ thể trong nguyên văn về một gánh được đặt lên Môi-se.
- source_word: כָּל הָעָם הַזֶּה
  choice: cả dân này
  rationale: Giữ “dân” ở dạng danh từ tập hợp số ít như tiếng Híp-ri và diễn đạt tự nhiên trong tiếng Việt.
- source_word: עָלָי
  choice: lên con
  rationale: Phù hợp với hình ảnh “đặt gánh nặng” và cách Môi-se tự xưng khi thưa với Đức Chúa Trời.
theological_decisions:
- issue: Động từ הֲרֵעֹתָ có thể nghe như quy điều ác về đạo đức cho Đức Chúa Trời
  choice: đối xử tệ với
  alternative: làm điều ác cho; gây họa cho
  rationale: Cách chọn này giữ nguyên sức nặng trong lời than trách của Môi-se nhưng không tự động biến lời ông thành một khẳng định thần học rằng Đức Chúa Trời phạm điều ác.
- issue: Sắc thái của לָשׂוּם sau hai câu hỏi
  choice: đến nỗi Ngài đặt
  alternative: để Ngài đặt; vì Ngài đã đặt
  rationale: “Đến nỗi” diễn tả tự nhiên mối liên hệ kết quả trong lời than, nhưng không loại trừ hoàn toàn sắc thái mục đích hoặc căn nguyên của cấu trúc Híp-ri.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” và cặp xưng hô “Ngài—con” cho lời Môi-se nói trực tiếp với Đức Chúa Trời; giữ danh Yahweh và hình ảnh “gánh nặng” của nguyên văn.
