language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: vi
  text: Nếu Ngài đối xử với con như thế, xin giết con ngay đi, nếu con được đẹp lòng Ngài, và đừng để con thấy nỗi khốn khổ của con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tai họa của con” hoặc “nỗi gian truân của con.” Từ Hê-bơ-rơ có thể chỉ nghịch cảnh hay tai họa, không chỉ điều ác về đạo đức.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם כָּכָה
  choice: Nếu ... như thế
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện; liên từ וְ được hòa vào cú pháp tiếng Việt, còn כָּכָה được giữ bằng “như thế”.
- source_word: אַתְּ עֹשֶׂה לִּי
  choice: Ngài cứ đối xử với con
  rationale: Cấu trúc עשה với ל diễn tả cách Đức Chúa Trời hành động đối với Môi-se. “Đối xử với con” tự nhiên và giữ được sắc thái quan hệ; “cứ” phù hợp với lời than về tình trạng đang tiếp diễn mà không biến nó thành một khẳng định chắc chắn về tương lai.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: xin giết con đi—giết con ngay đi
  rationale: “Xin” chuyển tải tiểu từ khẩn cầu נָא; việc lặp động từ cùng “ngay” thể hiện sức nhấn mạnh của động từ nguyên mẫu tuyệt đối đi với mệnh lệnh, đồng thời giữ cường độ tuyệt vọng của lời nói.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nếu con được đẹp lòng Ngài
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ Hê-bơ-rơ “tìm được ân huệ trong mắt Ngài”, không hàm ý Môi-se có công trạng.
- source_word: וְאַל אֶרְאֶה
  choice: và đừng để con phải thấy
  rationale: Chuyển thể lời khẩn cầu phủ định hướng đến Đức Chúa Trời. “Phải thấy” làm rõ ý không muốn sống để chứng kiến hoặc trải qua điều sắp đến.
- source_word: בְּרָעָתִי
  choice: cảnh khốn khổ của mình
  rationale: רָעָה ở đây có thể chỉ nghịch cảnh, tai họa hoặc nỗi khốn khổ chứ không nhất thiết là điều ác về đạo đức. Cách dịch này phù hợp với cảnh Môi-se tuyệt vọng vì gánh nặng, đồng thời chú thích giữ các khả năng từ vựng khác.
theological_decisions:
- issue: Ý nghĩa của בְּרָעָתִי trong lời khẩn cầu của Môi-se
  choice: nỗi khốn khổ/nghịch cảnh của chính Môi-se
  alternative: điều ác của con; tai họa xảy đến với con; cảnh khốn cùng của con
  rationale: Ngữ cảnh nói về sự tuyệt vọng của Môi-se dưới gánh nặng lãnh đạo dân, chứ không trực tiếp là lời thú nhận tội lỗi. Bản dịch tránh gán cho danh từ một ý nghĩa đạo đức mà ngữ cảnh không đòi hỏi, nhưng vẫn ghi nhận độ rộng nghĩa trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài—con” thể hiện lời Môi-se thưa trực tiếp với Đức Chúa Trời. Dấu gạch ngang giữ sức dồn nén của lời khẩn cầu; dấu chấm phẩy giúp người đọc nhận ra mệnh đề cuối mà không làm dịu sự căng thẳng của câu.
