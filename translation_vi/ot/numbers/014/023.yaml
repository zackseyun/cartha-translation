  yaml_path: translation/ot/numbers/014/023.yaml
  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: vi
  text: thì chúng chắc chắn sẽ không thấy xứ[a] mà Ta đã thề với tổ phụ chúng; và không một ai trong số những kẻ khinh miệt Ta sẽ thấy xứ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ sát nghĩa là “nếu chúng thấy xứ”; trong công thức thề này, câu mang nghĩa phủ định nhấn mạnh: “chúng chắc chắn sẽ không thấy xứ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: chắc chắn sẽ không được thấy
  rationale: Trong công thức thề ở đây, אִם không đặt ra một điều kiện thực sự mà diễn đạt lời phủ định nhấn mạnh. “Không được thấy” cũng truyền đạt đúng nghĩa bị loại khỏi việc tận hưởng hay bước vào xứ.
- source_word: הָאָרֶץ
  choice: xứ
  rationale: Trong ngữ cảnh giao ước của Dân Số, từ này chỉ xứ đã hứa; “xứ” là cách diễn đạt tự nhiên, trang trọng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: נִשְׁבַּעְתִּי
  choice: đã thề ban
  rationale: Động từ có nghĩa là thề; bổ sung “ban” theo quan hệ với bổ ngữ gián tiếp “cho tổ phụ chúng” giúp câu tiếng Việt tự nhiên và làm rõ nội dung lời thề vốn được ngữ cảnh xác định, không thay đổi ý nghĩa.
- source_word: לַאֲבֹתָם
  choice: cho tổ phụ chúng
  rationale: “Tổ phụ” giữ sắc thái nam giới và chỉ các bậc cha ông thuộc giao ước, đồng thời tự nhiên hơn cách dịch sát chữ “các cha của chúng” trong tiếng Việt.
- source_word: מְנַאֲצַי
  choice: những kẻ đã khinh miệt Ta
  rationale: נאץ diễn tả thái độ khinh thường, xúc phạm hoặc bác bỏ với sự miệt thị; “khinh miệt” trực tiếp và đủ mạnh.
- source_word: לֹא יִרְאוּהָ
  choice: sẽ được thấy xứ ấy
  rationale: Đại từ hậu tố giống cái quy chiếu về “xứ.” Lặp lại “xứ ấy” tránh đại từ mơ hồ trong tiếng Việt và giữ sự nhấn mạnh của câu phán xét.
theological_decisions:
- issue: Sức nhấn của công thức thề mở đầu
  choice: 'Dịch thành lời phủ định quả quyết: “chắc chắn sẽ không được thấy”'
  alternative: 'Dịch sát mặt chữ: “nếu chúng thấy xứ”'
  rationale: Trong ngữ cảnh lời thề của Đức Chúa Trời, אִם là công thức rút gọn mang nghĩa phủ định mạnh. Dịch như một điều kiện thông thường sẽ che khuất ý phán xét.
- issue: Cách dịch אָבוֹת
  choice: “tổ phụ” trong chính văn
  alternative: “tổ tiên” hoặc “cha ông”
  rationale: “Tổ phụ” bảo toàn nét nghĩa nam giới của nguyên văn và phù hợp với các bậc tiền nhân thuộc giao ước, nhưng vẫn dễ hiểu trong văn phong Kinh Thánh hiện đại.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “Ta” phản ánh lời phán trực tiếp của Đức Chúa Trời. Dùng “chúng” và “những kẻ” để giữ sắc thái phán xét nghiêm trang; dấu [a] được đặt ngay sau mệnh đề liên quan.
