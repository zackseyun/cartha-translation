source:
  edition: WLC
  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: vi
  text: Những người mà Môi-se đã sai đi do thám xứ ấy trở về và khiến cả hội chúng than phiền về ông bằng cách đưa ra một báo cáo xấu về xứ ấy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi khảo sát xứ ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “loan truyền lời gièm pha về xứ ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Những người
  rationale: Mạch văn tiếp nối được thể hiện tự nhiên trong tiếng Việt mà không cần thêm từ chỉ thời gian như “bấy giờ”; danh từ có mạo từ được dịch xác định là “những người”.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: mà Môi-se đã sai đi
  rationale: Mệnh đề quan hệ được diễn đạt tự nhiên; “đã” làm rõ hành động sai phái xảy ra trước khi họ trở về.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: do thám xứ ấy
  rationale: תור ở đây chỉ việc khảo sát để thu thập tin tức. “Do thám” ngắn gọn, quen thuộc trong văn cảnh này; chú thích giữ phương án ít sắc thái quân sự hơn.
- source_word: וַיָּשֻׁבוּ
  choice: trở về
  rationale: Diễn đạt trực tiếp động từ שוב trong chuỗi kể chuyện.
- source_word: וילונו עָלָיו
  choice: khiến ... oán trách ông
  rationale: 'Dạng động từ cùng tân ngữ “cả hội chúng” mang nghĩa gây khiến: các người ấy làm cho cộng đồng oán trách Môi-se. “Oán trách” giữ được sắc thái bất mãn dai dẳng của mô-típ than phiền trong hoang mạc.'
- source_word: אֶת כָּל־הָעֵדָה
  choice: cả hội chúng
  rationale: עֵדָה chỉ toàn thể cộng đồng Israel được tập hợp; “hội chúng” vừa trang trọng vừa quen thuộc trong Ngũ Kinh.
- source_word: לְהוֹצִיא דִבָּה
  choice: bằng cách tung ra tin xấu
  rationale: Cụm nguyên ngữ nêu phương tiện dẫn đến sự oán trách. “Tung ra tin xấu” truyền đạt הן động từ הוציא vừa sắc thái bất lợi, gây tổn hại của דִבָּה; chú thích ghi nhận cách hiểu “loan truyền lời gièm pha”.
- source_word: עַל־הָאָרֶץ
  choice: về xứ ấy
  rationale: עַל ở đây nêu đối tượng hay nội dung của bản tin; “về” là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Chủ thể gây ra sự oán trách
  choice: khiến cả hội chúng oán trách ông
  alternative: cùng cả hội chúng oán trách ông
  rationale: Cấu trúc động từ và tân ngữ אֶת כָּל־הָעֵדָה ủng hộ nghĩa gây khiến, nhưng bản dịch không mở rộng thêm động cơ hay mức độ trách nhiệm của những người do thám.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Môi-se”, “xứ” và “hội chúng” để phù hợp văn phong Ngũ Kinh; tránh thêm một từ mở đầu tương đương “bấy giờ” vì nguyên văn không có từ chỉ thời gian ấy.
