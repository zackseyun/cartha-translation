  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng ý chính của Hê-bơ-rơ: Môi-se phản đối việc dân chúng vượt phạm điều Yahweh đã truyền và cảnh báo rằng hành động ấy sẽ không thành công. “Tại sao ... lại” diễn đạt tự nhiên sắc thái nhấn mạnh của לָמָה זֶה; “vi phạm mệnh lệnh” phù hợp với עבַר đi với פִּי יהוה trong ngữ cảnh này. “Việc này” giữ tính khái quát của đại từ וְהִוא, không xác định quá mức hành động được nói tới.'
  naturalness: Câu văn rõ ràng, hiện đại và có sắc thái trang trọng thích hợp. “Các ngươi” tuy mang màu sắc Kinh Thánh hơn khẩu ngữ đương đại, vẫn là lựa chọn tự nhiên trong lời quở trách của Môi-se với cộng đồng.
  terminology: Giữ “Yahweh” nhất quán với quyết định dịch danh YHWH. “Mệnh lệnh của Yahweh” là cách hiểu theo ngữ cảnh của thành ngữ “miệng của Yahweh”; ghi chú cũng nêu được nghĩa đen và phương án “lời của Yahweh.”
  issues:
