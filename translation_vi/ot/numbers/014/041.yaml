source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: vi
  text: 'Nhưng Môi-se nói: “Tại sao các ngươi lại vi phạm mệnh lệnh[a] của Yahweh? Việc này sẽ không thành công.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “miệng của Yahweh,” một thành ngữ chỉ điều Yahweh đã phán hoặc truyền lệnh; cũng có thể dịch là “lời của Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Việc này sẽ không được hanh thông.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng Môi-se nói
  rationale: Waw nối tiếp diễn tiến câu chuyện; trong ngữ cảnh, “nhưng” thể hiện sự tương phản giữa ý định của dân chúng và lời cảnh báo của Môi-se.
- source_word: לָמָה זֶּה
  choice: Tại sao ... lại
  rationale: Cấu trúc tiếng Việt này tự nhiên, đồng thời giữ sắc thái nhấn mạnh của tổ hợp Hê-bơ-rơ hơn một câu hỏi chỉ dùng “tại sao”.
- source_word: אַתֶּם עֹבְרִים
  choice: các ngươi lại vi phạm
  rationale: Động từ עבר đi với lời truyền của Yahweh mang nghĩa vượt quá, xâm phạm hay bất tuân, không chỉ hành động đi qua theo nghĩa đen.
- source_word: אֶת פִּי יְהוָה
  choice: mệnh lệnh của Yahweh
  rationale: Nghĩa đen là “miệng của Yahweh,” nhưng đây là thành ngữ chỉ điều Yahweh đã phán hoặc truyền lệnh; “mệnh lệnh” phù hợp nhất với ngữ cảnh bất tuân.
- source_word: וְהִוא
  choice: Việc này
  rationale: Đại từ giống cái số ít có thể quy chiếu đến hành động hoặc kế hoạch vừa được nói đến; “việc này” là cách diễn đạt tự nhiên mà không xác định quá mức đối tượng quy chiếu.
- source_word: לֹא תִצְלָח
  choice: sẽ không thành công
  rationale: צלח ở đây nói đến việc một hành động hay cuộc tiến quân đạt kết quả; “thành công” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Đối tượng bị vi phạm trong אֶת פִּי יְהוָה
  choice: mệnh lệnh của Yahweh
  alternative: lời của Yahweh
  rationale: Cả “lời” và “mệnh lệnh” đều có thể diễn đạt thành ngữ “miệng của Yahweh”; ngữ cảnh nhấn mạnh dân chúng hành động trái điều đã được truyền nên “mệnh lệnh” được chọn, còn phương án rộng hơn được ghi chú.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Các ngươi” giữ sắc thái Môi-se nói với toàn thể cộng đồng trong bối cảnh quở trách; “Tại sao ... lại” chuyển tải tự nhiên sắc thái nhấn mạnh của לָמָה זֶּה.
