id: NUM.14.2
reference: Numbers 14:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּלֹּ֨נוּ֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן כֹּ֖ל בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם כָּל הָ/עֵדָ֗ה לוּ מַ֨תְנוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם א֛וֹ בַּ/מִּדְבָּ֥ר הַ/זֶּ֖ה לוּ מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: vi
  text: 'Toàn thể con dân Israel[a] đều phàn nàn[b] chống lại Môi-se và A-rôn. Cả hội chúng nói với hai ông: “Phải chi chúng tôi đã chết tại đất Ai Cập, hoặc phải chi chúng tôi đã chết trong hoang mạc này!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “toàn thể các con trai của Israel”; cụm này chỉ toàn dân Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lẩm bẩm” hoặc “kêu ca.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: phàn nàn
  rationale: Động từ לון/לין trong bối cảnh hành trình nơi hoang mạc chỉ sự bất mãn tập thể nhằm vào những người lãnh đạo. “Phàn nàn” là cách nói tự nhiên trong tiếng Việt hiện đại và vẫn giữ sắc thái chống đối của câu.
- source_word: עַל
  choice: chống lại
  rationale: Đi với động từ chỉ sự phàn nàn, עַל đánh dấu đối tượng bị nhắm đến và mang sắc thái đối kháng; “chống lại” thể hiện rõ lực hướng về Môi-se và A-rôn.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: toàn thể con dân Israel
  rationale: Cụm này theo mặt chữ là “toàn thể các con trai/con cái Israel” nhưng ở đây là danh xưng dân tộc chỉ toàn dân. “Con dân Israel” vừa giữ quan hệ dòng dõi trong cách gọi Hê-bơ-rơ, vừa tránh khiến độc giả hiểu lầm rằng chỉ nói đến các con trai ruột của Gia-cốp.
- source_word: כָּל הָעֵדָה
  choice: cả hội chúng
  rationale: עֵדָה trong sách Dân Số thường chỉ cộng đồng giao ước được quy tụ. “Hội chúng” giữ được sắc thái tập thể có tổ chức, còn “cả” chuyển tải כָּל một cách tự nhiên.
- source_word: לוּ
  choice: phải chi
  rationale: לוּ mở đầu một ước muốn trái với thực tế. “Phải chi” là thành ngữ tiếng Việt hiện đại, tự nhiên, diễn đạt đúng lời than tiếc và ước ao không thành.
- source_word: מַתְנוּ / מָתְנוּ
  choice: chúng tôi đã chết
  rationale: Dạng hoàn thành sau לוּ diễn đạt điều ước không có thật về quá khứ. Kết cấu “phải chi ... đã chết” truyền đạt rõ sắc thái phản thực này.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: tại đất Ai Cập
  rationale: Cách dịch này giữ danh từ אֶרֶץ trong nguyên văn và vẫn tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: trong hoang mạc này
  rationale: “Hoang mạc” diễn đạt מִדְבָּר như vùng hoang vu nơi Israel đang hành trình, không giới hạn nghĩa vào một sa mạc toàn cát.
theological_decisions:
- issue: Danh xưng dân tộc có hình thức giống đực בְּנֵי יִשְׂרָאֵל
  choice: toàn thể con dân Israel
  alternative: toàn thể các con trai của Israel
  rationale: Nguyên ngữ dùng danh từ số nhiều giống đực “các con trai/con cái của Israel,” nhưng trong ngữ cảnh danh xưng này bao gồm toàn cộng đồng. Dịch sát máy móc là “các con trai” trong tiếng Việt dễ bị hiểu là chỉ nam giới hoặc mười hai người con trai của Gia-cốp. “Con dân Israel” giữ ý niệm hậu duệ và phạm vi toàn dân, đồng thời chú thích hình thức nguyên văn.
translation_notes:
  register: Bản dịch dùng tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. “Môi-se,” “A-rôn” và “Israel” được viết theo dạng tên riêng quen dùng; “phải chi” giữ cảm xúc than tiếc trực tiếp của lời nói. Hai lần לוּ được thể hiện đối xứng để bảo toàn nhịp điệu và cường độ của lời oán trách.
