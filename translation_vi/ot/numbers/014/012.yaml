- from: Ta sẽ dùng dịch bệnh đánh phạt dân ấy và tước quyền sở hữu của họ[a]. Rồi Ta sẽ làm cho con trở thành một dân tộc lớn hơn và hùng mạnh hơn họ.
  to: Ta sẽ giáng dịch bệnh trên dân ấy và tước quyền thừa hưởng của dân ấy[a]. Rồi Ta sẽ làm cho con trở thành một dân tộc lớn hơn và hùng mạnh hơn dân ấy.
  rationale: Bản sửa đặt “dân ấy” làm đối tượng rõ ràng của cả lời giáng dịch bệnh lẫn hành động tước quyền, tránh thay đổi quy chiếu do đại từ “họ.” “Tước quyền thừa hưởng” phản ánh an toàn nét nghĩa của ירשׁ trong ngữ cảnh thay thế Israel bằng một dân tộc xuất phát từ Môi-se; chú thích bảo lưu các khả năng sở hữu và thừa kế. Câu vẫn dùng “Ta—con” theo thanh giọng trang trọng trực tiếp của bản thảo.
