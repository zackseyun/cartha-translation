base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: vi
  text: Ta sẽ giáng dịch bệnh trên dân ấy và tước quyền thừa hưởng của dân ấy[a]. Rồi Ta sẽ làm cho con trở thành một dân tộc lớn hơn và hùng mạnh hơn dân ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tước quyền sở hữu của dân ấy” hoặc “tước quyền thừa kế của dân ấy.” Động từ Hê-bơ-rơ có thể mang sắc thái tước bỏ quyền thừa hưởng hoặc quyền chiếm hữu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: Ta sẽ… đánh phạt dân ấy
  rationale: Thể Hiphil của נכה có nghĩa là “đánh.” Hậu tố ngôi ba số ít chỉ dân Israel như một tập thể; “dân ấy” vừa giữ được tính tập thể số ít của tiếng Hê-bơ-rơ, vừa tự nhiên trong tiếng Việt.
- source_word: בַדֶּבֶר
  choice: dùng dịch bệnh
  rationale: דֶּבֶר chỉ dịch bệnh hoặc ôn dịch, thường trong bối cảnh phán xét. “Dịch bệnh” là cách nói hiện đại, rõ nghĩa; cấu trúc “dùng… đánh phạt” diễn đạt chức năng công cụ của giới từ ב.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: và tước quyền sở hữu của họ
  rationale: Thể Hiphil của ירשׁ có thể mang nghĩa tước quyền chiếm hữu hoặc tước quyền thừa kế. Cách dịch này giữ sắc thái bị loại khỏi phần sở hữu mà không quyết định hoàn toàn giữa hai nét nghĩa; đại từ “họ” quy chiếu tự nhiên về tập thể “dân ấy” trong tiếng Việt.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: Rồi Ta sẽ làm cho con trở thành một dân tộc
  rationale: עשה kết hợp với bổ ngữ לְ diễn tả việc làm cho một người trở thành điều gì. “Con” phù hợp với lời Đức Chúa Trời trực tiếp phán cùng Môi-se.
- source_word: גָּדוֹל וְעָצוּם מִמֶּנּוּ
  choice: lớn hơn và hùng mạnh hơn họ
  rationale: מִמֶּנּוּ tạo phép so sánh với Israel. עָצוּם có thể chỉ sức mạnh hoặc đông đảo; “hùng mạnh” bảo toàn sắc thái quyền lực mà không thu hẹp thành số lượng.
theological_decisions:
- issue: Các hậu tố số ít chỉ dân Israel như một tập thể
  choice: Dùng “dân ấy” trong lần nhắc đầu, rồi dùng đại từ tập thể tự nhiên “họ.”
  alternative: Lặp “dân ấy” hoặc dùng hoàn toàn đại từ số nhiều “họ.”
  rationale: Tiếng Hê-bơ-rơ dùng hậu tố giống đực số ít để nhìn Israel như một thực thể tập thể. Tiếng Việt không đánh dấu số ở đại từ theo cùng cách; bản dịch nêu rõ “dân ấy” để giữ hình ảnh tập thể, rồi dùng “họ” nhằm tránh câu gượng ép.
- issue: Nghĩa của ירשׁ trong lời đe dọa
  choice: “tước quyền sở hữu” trong chính văn, kèm “tước quyền thừa kế” ở chú thích.
  alternative: “tước quyền thừa kế” hoặc “đuổi khỏi phần đất sở hữu.”
  rationale: Động từ có thể gợi cả việc bị mất phần sở hữu lẫn bị tước quyền thừa hưởng. Chính văn giữ nghĩa rộng hơn, còn chú thích bảo toàn sắc thái thừa kế có thật trong từ gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” thể hiện lời Đức Chúa Trời phán trực tiếp với Môi-se. Dùng “dân ấy” để phản ánh Israel như một tập thể số ít, nhưng chuyển sang “họ” ở các vị trí sau cho tự nhiên trong tiếng Việt.
