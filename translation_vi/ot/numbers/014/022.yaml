  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: vi
  text: Vì tất cả những người nam đã thấy vinh quang Ta và các dấu lạ Ta đã làm tại Ai Cập và trong hoang mạc, đã thử Ta mười lần như thế và không nghe theo tiếng Ta[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không vâng lời Ta.” Thành ngữ Hê-bơ-rơ “nghe theo tiếng Ta” có thể hàm nghĩa nghe và vâng theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lý do làm nền cho lời thề và phán quyết ở văn mạch trước; “Vì” giữ được quan hệ giải thích.
- source_word: כָל הָאֲנָשִׁים
  choice: tất cả những người nam
  rationale: אֲנָשִׁים ở đây chỉ những người nam thuộc thế hệ đang chịu phán xét; cách dịch này giữ nét giới tính của nguyên văn.
- source_word: הָרֹאִים
  choice: đã thấy
  rationale: Phân từ mô tả những người từng chứng kiến, với kinh nghiệm quá khứ vẫn có ý nghĩa đối với lời buộc tội hiện tại.
- source_word: כְּבֹדִי
  choice: vinh quang Ta
  rationale: Trong ngữ cảnh nói về Đức Chúa Trời, כָּבוֹד chỉ vinh quang được bày tỏ; “vinh quang” là cách diễn đạt tự nhiên và có trọng lượng.
- source_word: אֹתֹתַי
  choice: các dấu lạ Ta
  rationale: אוֹת chỉ dấu hiệu có chức năng chứng thực; “dấu lạ” vừa tự nhiên trong tiếng Việt Kinh Thánh vừa tránh thu hẹp thành chỉ “phép lạ”.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: Ta đã làm
  rationale: Dịch trực tiếp động từ עשה mà không diễn giải thêm cách thức thực hiện.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: tại Ai Cập và trong hoang mạc
  rationale: “Hoang mạc” diễn đạt tự nhiên מִדְבָּר trong bối cảnh hành trình Xuất Hành; giới từ được điều chỉnh cho hợp tiếng Việt.
- source_word: וַיְנַסּוּ אֹתִי
  choice: đã thử Ta
  rationale: נסה ở đây là thử hoặc đặt Đức Chúa Trời vào sự thử thách; “thử Ta” ngắn gọn và giữ sắc thái cáo buộc.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: đủ mười lần này
  rationale: “Đủ mười lần” diễn đạt thành ngữ nhấn mạnh số lần trọn vẹn, còn “này” giữ phần nào lực chỉ định của זֶה.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: không nghe theo tiếng Ta
  rationale: “Nghe theo tiếng” giữ hình ảnh của thành ngữ Hê-bơ-rơ, đồng thời truyền đạt ý vâng lời vốn có trong שׁמע בקול.
theological_decisions:
- issue: Lời tự xưng trực tiếp của Đức Chúa Trời
  choice: Giữ ngôi thứ nhất trong “vinh quang Ta”, “các dấu lạ Ta” và “tiếng Ta”.
  alternative: Thay bằng danh xưng “Đức Chúa Trời” hoặc diễn giải thêm.
  rationale: Nguyên văn là lời phán trực tiếp và không cung cấp phần giải thích thần học mở rộng.
- issue: Phạm vi giới tính của הָאֲנָשִׁים
  choice: tất cả những người nam
  alternative: tất cả mọi người
  rationale: Danh từ và văn mạch chỉ những người nam của thế hệ bị phán xét; không nên trung tính hóa chi tiết này.
- issue: Sắc thái của שׁמע בקול
  choice: không nghe theo tiếng Ta
  alternative: không vâng lời Ta
  rationale: Cách chọn giữ thành ngữ nguồn mà vẫn chuyển tải hàm ý tuân phục; phương án kia rõ nghĩa hơn nhưng làm mất hình ảnh “tiếng”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ta” để biểu thị ngôi thứ nhất của Đức Chúa Trời theo quy ước tiếng Việt; giữ dấu gạch ngang cuối câu vì cú pháp và lời phán tiếp tục sang câu kế.
