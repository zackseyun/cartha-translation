    reason: lexical_alternative
  revision_rationale: Thay “nhưng” bằng “và” để không thêm quan hệ đối lập ngoài nguyên văn, và thay “đủ mười lần này” bằng “mười lần như thế” để diễn đạt tự nhiên, sát nghĩa lực nhấn mạnh của tiếng Hê-bơ-rơ. Thêm chú thích cho nghĩa tuân phục hàm ẩn trong thành ngữ “nghe theo tiếng Ta.”
