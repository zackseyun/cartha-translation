  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: vi
  text: 'Và nếu Ngài giết dân này như một người[a], thì các dân tộc đã nghe tin về Ngài[b] sẽ nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “như một người”, một thành ngữ có nghĩa là cả dân cùng chịu chung số phận, tức toàn thể hoặc tất cả cùng một lúc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã nghe danh tiếng Ngài” hoặc “đã nghe tin tức về Ngài”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: Và nếu Ngài giết
  rationale: Động từ Hiphil của מות có nghĩa là “làm cho chết, giết”. Liên từ וְ tự nó không có nghĩa là “nếu”, nhưng mạch lập luận điều kiện tiếp nối câu trước khiến tiếng Việt cần thêm “nếu” cho tự nhiên và rõ nghĩa.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: עָם chỉ toàn thể dân Israel; “dân này” giữ được sắc thái tập thể và đại từ chỉ định mà không chuyển thành “nước”.
- source_word: כְּאִישׁ אֶחָד
  choice: như một người
  rationale: Giữ hình ảnh nguyên văn của thành ngữ Hê-bơ-rơ, diễn tả cả dân cùng chung một số phận, tức bị giết toàn bộ hoặc cùng một lúc.
- source_word: הַגּוֹיִם
  choice: các dân tộc
  rationale: גּוֹיִם ở đây là các dân ngoài Israel; “các dân tộc” phù hợp bối cảnh Cựu Ước và tránh những liên tưởng muộn hơn của cách gọi mang tính tôn giáo.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: đã nghe danh tiếng Ngài
  rationale: שֵׁמַע có thể là “tin tức, lời đồn, danh tiếng”. Trong ngữ cảnh các dân đã nghe về Đức Giê-hô-va và những việc Ngài làm, “nghe danh tiếng Ngài” là tiếng Việt tự nhiên, đồng thời giữ khả năng hiểu là tiếng tăm hoặc tin tức về Ngài.
- source_word: לֵאמֹר
  choice: 'sẽ nói rằng:'
  rationale: Động từ nguyên mẫu này dẫn vào nội dung lời nói ở câu tiếp theo; “sẽ nói rằng:” diễn đạt tự nhiên chức năng ấy trong tiếng Việt.
theological_decisions:
- issue: Cách dịch thành ngữ dùng danh từ giống đực số ít כְּאִישׁ אֶחָד
  choice: như một người
  alternative: tất cả cùng một lúc
  rationale: Cụm từ có tính thành ngữ chứ không nhấn mạnh giới tính. Giữ “như một người” bảo tồn hình ảnh và sức tu từ của nguyên văn; chú thích giải thích ý nghĩa tập thể mà không áp đặt thêm một cách hiểu thần học.
- issue: Đối tượng của שִׁמְעֲךָ
  choice: danh tiếng Ngài
  alternative: tin tức về Ngài
  rationale: Hình thức có hậu tố ngôi thứ hai có thể được hiểu là điều người ta nghe về Ngài hoặc danh tiếng của Ngài. Bản dịch chính dùng cách nói tự nhiên, còn chú thích bảo lưu cách hiểu sát cấu trúc hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” phản ánh lời Môi-se thưa trực tiếp với Đức Giê-hô-va. Dấu hai chấm cho thấy lời phát biểu của các dân tộc tiếp tục ở câu sau.
