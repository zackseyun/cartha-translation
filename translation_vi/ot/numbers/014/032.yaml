  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: vi
  text: Còn các ngươi, thây các ngươi sẽ ngã xuống trong hoang mạc này.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/פִגְרֵי/כֶם
  choice: thây các ngươi
  rationale: פֶּגֶר chỉ thân thể đã chết, tức thây hoặc xác chết. “Thây các ngươi” giữ được hình ảnh cụ thể, nghiêm khắc của lời phán xét và phù hợp với động từ “ngã xuống”; liên từ וּ được thể hiện ở cấp mệnh đề bằng “Còn”.
- source_word: אַתֶּם
  choice: Còn các ngươi
  rationale: Đại từ độc lập mang sắc thái nhấn mạnh và đối chiếu. Cấu trúc “Còn các ngươi” diễn đạt tự nhiên lực đối chiếu ấy trong tiếng Việt.
- source_word: יִפְּלוּ
  choice: sẽ ngã xuống
  rationale: נפל có nghĩa cơ bản là ngã; trong ngữ cảnh này là ngã xuống mà chết. “Sẽ ngã xuống” bảo toàn cách diễn đạt cụ thể của nguyên văn, trong khi “thây” đã làm rõ kết cục tử vong.
- source_word: בַּ/מִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר là vùng hoang vu, khô cằn; “hoang mạc” là cách gọi hiện đại, trang trọng và phù hợp với bối cảnh hành trình trong Dân Số.
- source_word: הַ/זֶּה
  choice: này
  rationale: Đại từ chỉ định xác định chính hoang mạc nơi dân đang ở; “này” truyền đạt đầy đủ mà không thêm mức nhấn mạnh.
theological_decisions:
- issue: Mức độ cụ thể và nghiêm khắc của hình ảnh phán xét trong פִגְרֵיכֶם
  choice: thây các ngươi
  alternative: xác chết của các ngươi
  rationale: Câu này công bố cái chết thể xác của thế hệ phản nghịch. “Thây” giữ nguyên sức nặng và tính cụ thể của nguyên văn mà không giải thích thêm nguyên nhân hoặc bản chất thần học của sự phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Các ngươi” phù hợp với lời phán nghiêm khắc hướng đến cả cộng đồng; “thây” có sắc thái nặng nhưng không cổ đến mức khó hiểu. Không cần chú thích vì lựa chọn này thể hiện rõ nghĩa từ vựng trong chính văn.
