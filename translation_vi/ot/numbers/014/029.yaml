revisions:
- from: Trong hoang mạc này, thi thể các ngươi sẽ ngã xuống[a]—tất cả những người trong các ngươi đã được kiểm đếm[b], theo toàn bộ số người của các ngươi, từ hai mươi tuổi trở lên, là những kẻ đã lằm bằm chống lại Ta[c].
  to: Trong hoang mạc này, xác các ngươi sẽ ngã xuống[a]—tức là toàn thể những người trong các ngươi đã được kiểm đếm[b], tính theo toàn bộ số người, từ hai mươi tuổi trở lên, là những người đã than phiền chống lại Ta[c].
  rationale: Bản sửa làm rõ nhóm «toàn thể những người ... đã được kiểm đếm» và cụm tổng quát «tính theo toàn bộ số người», đồng thời dùng cách nói trang trọng, hiện đại hơn cho hành vi than trách. Các chi tiết và hình ảnh phán xét của nguyên văn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
