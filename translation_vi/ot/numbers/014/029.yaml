  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: vi
  text: Trong hoang mạc này, xác các ngươi sẽ ngã xuống[a]—tức là toàn thể những người trong các ngươi đã được kiểm đếm[b], tính theo toàn bộ số người, từ hai mươi tuổi trở lên, là những người đã than phiền chống lại Ta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thi thể các ngươi sẽ ngã xuống.” Tiếng Hê-bơ-rơ dùng hình ảnh cụ thể và mạnh, nhấn mạnh cái chết thể xác trong hoang mạc.'
    reason: lexical_alternative
  - marker: b
    text: “Được kiểm đếm” nói đến những người đã được ghi tên trong cuộc kiểm kê dân số hoặc duyệt quân.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “đã lằm bằm chống lại Ta” hoặc “đã oán trách Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: Trong hoang mạc này
  rationale: מִדְבָּר chỉ vùng hoang vu, khô cằn; “hoang mạc” tự nhiên trong tiếng Việt và giữ bối cảnh cuộc lưu lạc của Israel.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: thi thể các ngươi sẽ ngã xuống
  rationale: Giữ hình ảnh cụ thể của נפל (“ngã xuống”) và פגר (“thi thể, xác chết”), thay vì diễn giải giản lược thành “các ngươi sẽ chết”.
- source_word: וְכָל פְּקֻדֵיכֶם
  choice: tất cả những người trong các ngươi đã được kiểm đếm
  rationale: פְּקֻדִים là những người đã được ghi nhận trong cuộc kiểm kê dân số hoặc duyệt quân; cách dịch này rõ nghĩa mà không giới hạn quá mức vào một sắc thái quân sự.
- source_word: לְכָל מִסְפַּרְכֶם
  choice: theo toàn bộ số người của các ngươi
  rationale: Giữ ý bao quát của כָל và mối liên hệ với tổng số đã được kiểm đếm, dù cấu trúc lặp có phần trang trọng như nguyên văn.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Đây là cách diễn đạt tự nhiên, chính xác cho công thức chỉ ngưỡng tuổi trong tiếng Hê-bơ-rơ.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: là những kẻ đã lằm bằm chống lại Ta
  rationale: “Lằm bằm” diễn tả lời than phiền dai dẳng mang tính phản nghịch; “chống lại” phản ánh עָלַי, không làm nhẹ đối tượng và hướng của hành vi.
theological_decisions:
- issue: Tính cụ thể của lời phán xét
  choice: Giữ “thi thể các ngươi sẽ ngã xuống”.
  alternative: “Các ngươi sẽ chết trong hoang mạc này.”
  rationale: Nguyên văn nhấn mạnh cái chết thể xác như sự phán xét bằng hình ảnh thi thể ngã xuống; bản dịch không làm phẳng sức nặng ấy thành một lời thông báo chung chung.
- issue: Phạm vi những người chịu phán xét
  choice: Giữ cả yếu tố được kiểm đếm và ngưỡng tuổi hai mươi trở lên.
  alternative: Rút gọn thành “tất cả những người từ hai mươi tuổi trở lên”.
  rationale: Các yếu tố kiểm đếm, tổng số và độ tuổi liên kết lời phán xét với nhóm đã được ghi nhận trong cuộc kiểm kê, nên không được lược bỏ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “các ngươi” cùng “Ta” phù hợp với lời Đức Chúa Trời trực tiếp tuyên phán trong bối cảnh phán xét. Dấu gạch ngang giúp làm rõ phần đồng vị xác định những người có thi thể sẽ ngã xuống, nhưng không thêm quan hệ ý nghĩa ngoài nguyên văn.
