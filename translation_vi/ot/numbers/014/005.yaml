  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: vi
  text: Bấy giờ, Môi-se và A-rôn sấp mặt xuống trước toàn thể hội chúng của cộng đồng con cái Y-sơ-ra-ên[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Y-sơ-ra-ên” hoặc “con cháu Y-sơ-ra-ên”. Tiếng Hê-bơ-rơ dịch sát chữ là “các con trai của Y-sơ-ra-ên”.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng hai từ gần nghĩa, dịch sát chữ là “hội chúng của cộng đồng”, giữ sắc thái nhấn mạnh về toàn thể đoàn dân đang tụ họp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: sấp mặt xuống
  rationale: Động từ נפל có nghĩa cơ bản là “ngã, sụp xuống”; kết hợp với עַל־פְּנֵיהֶם, cụm “sấp mặt xuống” diễn đạt tự nhiên tư thế phủ phục mà không xác định thêm động cơ.
- source_word: עַל־פְּנֵיהֶם
  choice: sấp mặt
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ tư thế úp mặt, thường biểu thị sự hạ mình hoặc khẩn thiết. Tiếng Việt “sấp mặt xuống” vừa rõ tư thế vừa tự nhiên.
- source_word: לִפְנֵי
  choice: trước
  rationale: Giữ nghĩa không gian và công khai là ở trước mặt, trong sự hiện diện của toàn thể cộng đồng.
- source_word: כָּל
  choice: toàn thể
  rationale: Với danh từ tập thể, “toàn thể” truyền đạt đầy đủ ý bao quát và phù hợp văn phong trang trọng.
- source_word: קְהַל
  choice: hội chúng
  rationale: קָהָל chỉ một tập thể đã tụ họp; “hội chúng” là từ rõ nghĩa và thích hợp với bối cảnh cộng đồng Israel.
- source_word: עֲדַת
  choice: cộng đồng
  rationale: עֵדָה chỉ cộng đồng hay đoàn dân có tổ chức. Dùng “cộng đồng” bên cạnh “hội chúng” giúp giữ hai danh từ gần nghĩa trong nguyên văn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo sát mặt chữ là “các con trai của Israel”, nhưng trong cách gọi dân tộc này nó chỉ hậu duệ/dân Israel. “Con cái Y-sơ-ra-ên” giữ hình ảnh huyết thống, có sắc thái Kinh Thánh quen thuộc, mà không khiến độc giả hiểu sai rằng chỉ có nam giới.
theological_decisions:
- issue: Có nên giản lược cụm kép קְהַל עֲדַת thành một danh từ tập thể hay không
  choice: Giữ cả hai yếu tố bằng “hội chúng của cộng đồng”
  alternative: “toàn thể hội chúng” hoặc “toàn thể cộng đồng”
  rationale: Nguyên văn dùng hai danh từ cộng đồng có nghĩa gần nhau, tạo sắc thái long trọng và nhấn mạnh tính công khai. Giữ cả hai tránh làm phẳng cấu trúc, còn chú thích giúp độc giả hiểu cách diễn đạt hơi khác thường này.
- issue: Cách hiểu בְּנֵי יִשְׂרָאֵל về giới tính và dân tộc
  choice: “con cái Y-sơ-ra-ên”
  alternative: “các con trai của Y-sơ-ra-ên” hoặc “dân Y-sơ-ra-ên”
  rationale: Mặt chữ là giống đực, nhưng đây là danh xưng dân tộc quen dùng cho cộng đồng Israel, không nhất thiết giới hạn ở nam giới. Bản dịch giữ hình ảnh “con cái” và ghi rõ mặt chữ trong chú thích, không áp đặt một kết luận thần học về thành phần hội chúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Tên riêng dùng dạng phiên âm Kinh Thánh quen thuộc “Môi-se”, “A-rôn”, “Y-sơ-ra-ên”. Cụm “sấp mặt xuống” tự nhiên hơn cách dịch cứng “ngã trên mặt”, đồng thời vẫn bảo toàn hình ảnh phủ phục của nguyên văn.
