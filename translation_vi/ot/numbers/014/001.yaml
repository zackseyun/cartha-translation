base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/001.yaml
  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: vi
  text: Bấy giờ, cả cộng đồng cất tiếng kêu lớn[a], và dân chúng khóc trong đêm ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ theo sát nghĩa là “cất lên ... và cất tiếng của họ”, một cách nói chỉ tiếng kêu lớn của cả cộng đồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... וַיִּתְּנוּ אֶת־קוֹלָם
  choice: cất tiếng kêu lớn
  rationale: Hai cách diễn đạt liên tiếp, theo nghĩa sát là “nâng lên” và “cất tiếng của họ”, cùng tạo thành một thành ngữ chỉ tiếng kêu lớn của cả cộng đồng. “Cất tiếng kêu lớn” tự nhiên trong tiếng Việt và giữ được sắc thái âm thanh tập thể.
- source_word: כָּל הָעֵדָה
  choice: cả cộng đồng
  rationale: עֵדָה chỉ toàn thể cộng đồng Y-sơ-ra-ên tụ họp; “cả cộng đồng” là cách diễn đạt hiện đại, rõ nghĩa và bảo toàn כָּל.
- source_word: הָעָם
  choice: dân chúng
  rationale: Phản ánh עָם và giữ sự thay đổi từ ngữ của bản Hê-bơ-rơ, thay vì đồng nhất với “cộng đồng” ở vế trước.
- source_word: וַיִּבְכּוּ
  choice: khóc
  rationale: בכה có nghĩa là khóc hoặc than khóc. “Khóc” phân biệt hành động này với tiếng kêu lớn ở vế trước mà không thêm mức độ không có trong nguyên văn.
- source_word: בַּלַּיְלָה הַהוּא
  choice: suốt đêm ấy
  rationale: Cách nói tự nhiên trong tiếng Việt theo ngữ cảnh; diễn tả việc dân chúng khóc trong đêm đó. “Suốt” làm rõ sắc thái thời gian kéo dài thường được hàm ý trong câu, nhưng không thêm nguyên nhân hay cường độ cảm xúc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cộng đồng” phù hợp với tập thể Y-sơ-ra-ên đang tụ họp; “dân chúng” giữ sự biến đổi danh từ trong nguyên văn. Dấu chú thích [a] được đặt ngay sau thành ngữ cần giải thích.
