base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: vi
  text: Nhưng cả cộng đồng đòi ném đá họ. Vinh quang của Yahweh hiện ra trong Lều Hội Kiến trước toàn thể dân Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trước toàn thể con cái Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: cả cộng đồng
  rationale: עֵדָה chỉ cộng đồng Israel được tập hợp; “cả cộng đồng” tự nhiên trong tiếng Việt hiện đại và giữ nghĩa tập thể.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: ném đá họ
  rationale: Cách nói tiếng Việt đã hàm ý dùng đá, nên không lặp thành “ném đá họ bằng đá”; cũng không thêm “cho chết” vì nguyên văn không nói rõ.
- source_word: כְבוֹד יְהוָה
  choice: vinh quang của Yahweh
  rationale: Giữ hình thức danh từ của כָּבוֹד và phiên âm danh riêng giao ước יְהוָה là “Yahweh”.
- source_word: נִרְאָה
  choice: hiện ra
  rationale: Dạng Niphal diễn tả sự xuất hiện hữu hình; “hiện ra” tự nhiên và phù hợp với ngữ cảnh thần hiện.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  rationale: ב có thể chỉ vị trí “trong/tại”; ở đây “tại” tránh xác quyết quá mức rằng vinh quang chỉ ở bên trong lều, đồng thời “Lều Hội Kiến” là tên gọi trang trọng, dễ hiểu.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: trước toàn thể con cái Israel
  rationale: אֶל với động từ “hiện ra” được diễn đạt tự nhiên là “trước”; “con cái Israel” giữ công thức dân tộc theo sát tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Giữ đây là danh riêng giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
- issue: Cụm dân tộc בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel / người Israel
  rationale: Bản chính giữ cách gọi truyền thống gần với hình thức Hê-bơ-rơ; cách nói thành ngữ hơn được ghi ở chú thích để làm rõ phạm vi là toàn dân.
- issue: Giới từ בְּ trong בְּאֹהֶל מוֹעֵד
  choice: tại Lều Hội Kiến
  alternative: trong Lều Hội Kiến
  rationale: Giữ độ mở hợp lý của giới từ chỉ địa điểm, không buộc cách hình dung không gian cụ thể hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Bấy giờ” để thể hiện sự chuyển cảnh của וּ־ mà không làm nhẹ sự đối lập với ý định ném đá. Dấu chú thích [a] đặt ngay sau cụm được chú giải.
