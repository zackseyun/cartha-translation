  source_fidelity: Bản dịch truyền đạt đúng quan hệ nguyên nhân trong מִבִּלְתִּי יְכֹלֶת, lời quy kết về sự bất lực của Đức Giê-hô-va, hành động đưa dân vào xứ, và kết quả là họ bị giết trong hoang mạc. “Đã thề ban cho họ” diễn giải hợp lý đối tượng hàm ẩn của lời thề trong ngữ cảnh; chú thích đồng thời bảo tồn lối diễn đạt ngắn hơn của tiếng Hê-bơ-rơ.
