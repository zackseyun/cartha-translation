  terminology: “Đức Giê-hô-va” nhất quán là tên riêng cho יהוה theo lựa chọn của bản thảo. “Xứ,” “hoang mạc,” và đại từ “ngài” được dùng nhất quán. “Giết họ” là cách dịch tự nhiên, tuy ít sắc thái hơn “slaughtered,” nhưng vẫn nằm trong phạm vi nghĩa của שׁחט và không thêm diễn giải.
