id: NUM.14.16
reference: Numbers 14:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: vi
  text: Vì Đức Giê-hô-va không có khả năng đưa dân này vào xứ mà ngài đã thề ban cho họ[a], nên ngài đã giết họ trong hoang mạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “xứ mà ngài đã thề với họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבִּלְתִּי יְכֹלֶת
  choice: Vì ... không có khả năng
  rationale: 'Cụm giới từ, phủ định và danh động từ diễn tả nguyên nhân mà các dân sẽ viện ra: Đức Giê-hô-va không đủ khả năng. Cách dịch này tự nhiên trong tiếng Việt và giữ nguyên sức căng của lời cáo buộc.'
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay tên bằng một tước hiệu.
- source_word: לְהָבִיא
  choice: đưa ... vào
  rationale: Thể Hiphil của בוא có nghĩa khiến đi vào; cấu trúc 'đưa ... vào xứ' diễn đạt rõ cả hành động lẫn đích đến.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: Giữ danh từ tập hợp số ít עָם và sắc thái chỉ định của nguyên văn.
- source_word: אֶל הָאָרֶץ
  choice: vào xứ
  rationale: Trong ngữ cảnh Ngũ Kinh, הָאָרֶץ chỉ xứ đã hứa; 'xứ' là cách gọi tự nhiên, trang trọng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: mà ngài đã thề ban cho họ
  rationale: Nguyên văn nói sát là 'mà ngài đã thề với/cho họ'; bổ sung 'ban' làm rõ nội dung lời thề được hàm ý bởi xứ, đồng thời ghi chú cách dịch sát hơn.
- source_word: וַיִּשְׁחָטֵם
  choice: ngài đã giết họ
  rationale: שׁחט mang nghĩa giết, hạ sát hoặc làm thịt. 'Giết' giữ mức độ nghiêm trọng mà vẫn tự nhiên; các từ như 'tàn sát' có thể thêm sắc thái giết hàng loạt không nhất thiết có trong động từ ở đây.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu nơi dân Israel đi qua; 'hoang mạc' chính xác hơn 'sa mạc' vì không nhất thiết chỉ vùng toàn cát.
theological_decisions:
- issue: Lời các dân quy cho Đức Giê-hô-va sự bất lực
  choice: Vì Đức Giê-hô-va không có khả năng...
  alternative: Vì Đức Giê-hô-va không thể...
  rationale: Giữ nguyên nội dung lời mà Môi-se nói các dân sẽ phát biểu theo mạch văn câu 15, không làm nhẹ lời cáo buộc và cũng không biến nó thành lời khẳng định của người kể chuyện về bản tính Đức Chúa Trời.
- issue: Nội dung được hàm ý trong lời thề
  choice: đã thề ban cho họ
  alternative: đã thề với họ
  rationale: Động từ 'ban' không hiện diện thành từ riêng trong tiếng Hê-bơ-rơ nhưng được hàm ý bởi quan hệ giữa lời thề và xứ. Bản chính dùng cách nói rõ nghĩa, còn chú thích bảo tồn hình thức ngắn gọn và độ mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Đức Giê-hô-va' cho danh riêng יהוה; dùng đại từ 'ngài' viết thường theo quy tắc chính tả thông thường. Câu giữ quan hệ nguyên nhân–kết quả và sức nặng của lời cáo buộc trong ngữ cảnh.
