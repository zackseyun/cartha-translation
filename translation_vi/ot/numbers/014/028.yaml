  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: vi
  text: 'Hãy nói với họ: “Đức Giê-hô-va phán: ‘Ta lấy sự sống mình mà thề: chắc chắn, ta sẽ đối xử với các ngươi đúng như những gì các ngươi đã nói trước tai ta.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָנִי
  choice: Ta lấy sự sống mình mà thề
  rationale: Thành ngữ thề của tiếng Hê-bơ-rơ, sát nghĩa là “Ta sống”; cách dịch này truyền đạt tự nhiên lực của lời thề dựa trên sự sống của chính Đức Chúa Trời.
- source_word: נְאֻם יְהוָה
  choice: Đức Giê-hô-va phán
  rationale: Giữ công thức tuyên phán của Đức Chúa Trời và thể hiện danh riêng YHWH bằng dạng quen thuộc trong tiếng Việt.
- source_word: אִם לֹא
  choice: chắc chắn
  rationale: Trong ngữ cảnh lời thề, cấu trúc này có giá trị khẳng định mạnh, tương đương “chắc chắn”.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם בְּאָזְנָי
  choice: đúng như những gì các ngươi đã nói trước tai ta
  rationale: Giữ hình ảnh cụ thể “trước tai ta” của nguyên văn, đồng thời dùng cú pháp tiếng Việt tự nhiên.
- source_word: כֵּן אֶעֱשֶׂה לָכֶם
  choice: ta sẽ làm cho các ngươi đúng như
  rationale: Bảo toàn sự tương ứng trực tiếp giữa lời dân đã nói và điều Đức Chúa Trời sẽ làm cho họ.
theological_decisions:
- issue: Danh giao ước יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Giê-va / Yahweh
  rationale: Dùng hình thức danh riêng đã quen thuộc rộng rãi trong truyền thống Kinh Thánh tiếng Việt, không biến danh riêng thành một tước hiệu chung.
- issue: Lời thề thần linh חַי אָנִי
  choice: Ta lấy sự sống mình mà thề
  alternative: Thật như ta hằng sống / Ta sống
  rationale: Nêu rõ chức năng lời thề mà không làm suy giảm sự trang trọng hay thêm nội dung giáo lý.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu; giữ đại từ “ta/các ngươi” phù hợp lời phán xét nghiêm nghị của Đức Chúa Trời trong ngữ cảnh.
