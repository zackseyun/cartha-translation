revisions:
- from: 'Hãy nói với họ: ‘Ta lấy sự sống mình mà thề,’ Đức Giê-hô-va phán, ‘chắc chắn ta sẽ làm cho các ngươi đúng như những gì các ngươi đã nói trước tai ta.’'
  to: 'Hãy nói với họ: “Đức Giê-hô-va phán: ‘Ta lấy sự sống mình mà thề: chắc chắn, ta sẽ đối xử với các ngươi đúng như những gì các ngươi đã nói trước tai ta.’”'
  rationale: Chỉnh cú pháp và dấu câu để lời tuyên phán tự nhiên trong tiếng Việt, đồng thời thay cách kết hợp động từ không chuẩn bằng “đối xử với các ngươi”, sát chức năng của עשה לכם. Không thay đổi nghĩa, mức độ khẳng định, danh riêng, hay hình ảnh “trước tai ta”.
  reviewer_model: gpt-5.6-terra
