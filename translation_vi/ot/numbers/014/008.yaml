  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: vi
  text: Nếu Yahweh vui lòng với chúng ta[a], Ngài sẽ đưa chúng ta vào xứ này và ban xứ ấy cho chúng ta—một xứ tuôn chảy sữa và mật ong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hài lòng với chúng ta” hoặc “ưu ái chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Diễn đạt trực tiếp điều kiện được nêu trong lời của Giô-suê và Ca-lép; trong ngữ cảnh này, cách hiểu theo điều kiện phù hợp hơn cách dịch “khi”.
- source_word: חָפֵץ בָּנוּ
  choice: hài lòng về chúng ta
  rationale: חפץ diễn tả sự vui thích, hài lòng hoặc có thiện ý đối với một người. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ sắc thái tương quan cá nhân.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng tên riêng của Đức Chúa Trời theo hình thức phiên âm phổ biến, thay vì thay thế bằng một tước hiệu.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: Ngài sẽ đưa chúng ta vào xứ này
  rationale: Động từ diễn tả hệ quả tương lai của điều kiện; “vào xứ này” phù hợp với bối cảnh dân Israel tiến vào và chiếm hữu Ca-na-an.
- source_word: וּנְתָנָהּ לָנוּ
  choice: và ban xứ ấy cho chúng ta
  rationale: נתן có nghĩa cơ bản là “cho”; “ban” phù hợp với chủ thể là Yahweh, còn việc lặp lại “xứ ấy” làm rõ đại từ chỉ về đất nước vừa nhắc đến.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: một xứ tuôn chảy sữa và mật
  rationale: Giữ hình ảnh giàu sức gợi của thành ngữ Hê-bơ-rơ về sự phì nhiêu và dư dật, đồng thời dùng cách diễn đạt quen thuộc, dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA hoặc Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn tính chất tên giao ước, không thay bằng một tước hiệu.
- issue: Sắc thái của חָפֵץ בָּנוּ
  choice: hài lòng về chúng ta
  alternative: vui thích chúng ta; ưu ái chúng ta
  rationale: Không thu hẹp cụm từ chỉ còn ý niệm pháp lý hay sự ban ơn; cách dịch chính giữ được cả sự hài lòng lẫn thái độ thuận tình, còn các khả năng gần nghĩa được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu tự nhiên đến Yahweh; giữ hình ảnh “tuôn chảy sữa và mật” thay vì giải nghĩa thành sự phì nhiêu ngay trong chính văn.
