source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: vi
  text: Rồi họ sẽ nói với cư dân xứ này, là những người đã nghe rằng Ngài, Yahweh, ở giữa dân này; rằng Ngài, Yahweh, hiện ra trước mắt họ[a]; rằng đám mây của Ngài đứng trên họ, và ban ngày Ngài đi trước họ trong một trụ mây, ban đêm trong một trụ lửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “mắt đối mắt Ngài được thấy” (thành ngữ Hê-bơ-rơ); cũng có thể dịch: “Ngài hiện ra mặt đối mặt.”'
    reason: Bảo lưu hình ảnh của thành ngữ עַיִן בְּעַיִן và sắc thái bị động của động từ Niphal, trong khi bản dịch chính diễn đạt tự nhiên theo ngữ cảnh.
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: cư dân xứ này
  rationale: Danh từ phân từ số ít mang nghĩa tập thể, nên dịch tự nhiên sang tiếng Việt là “cư dân”; “xứ này” phù hợp văn cảnh địa lý và giọng văn Kinh Thánh.
- source_word: שָׁמְעוּ
  choice: đã nghe
  rationale: Thể hoàn thành chỉ việc họ đã được nghe và hiện có sự hiểu biết ấy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּקֶרֶב
  choice: ở giữa
  rationale: Giữ hình ảnh sự hiện diện ngay giữa dân chúng, đồng thời tự nhiên trong tiếng Việt.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: hiện ra trước mắt họ
  rationale: Diễn đạt tự nhiên ý hiện diện hữu hình của thành ngữ “mắt với mắt” và động từ Niphal; chú thích bảo lưu hình ảnh nguyên văn cùng khả năng dịch khác.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: đám mây của Ngài đứng trên họ
  rationale: Giữ hình ảnh cụ thể của động từ “đứng” và vị trí “trên họ”, không diễn giải thêm chức năng che chở.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: Ngài đi trước họ
  rationale: Bám sát động từ “đi” và cụm chỉ vị trí “trước họ”, tránh diễn giải thành “dẫn dắt”.
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: trong một trụ mây ... trong một trụ lửa
  rationale: Giữ khả năng chỉ phương thức hoặc hình thức hiện diện của giới từ ב và hình ảnh song song trong nguyên ngữ.
- source_word: יוֹמָם ... לָיְלָה
  choice: ban ngày ... ban đêm
  rationale: Cách diễn đạt thời gian tự nhiên, rõ ràng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch danh YHWH (יְהוָה)
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời; phiên âm “Yahweh” bảo tồn danh ấy mà không thay bằng tước hiệu.
- issue: Ý nghĩa của עַיִן בְּעַיִן נִרְאָה
  choice: hiện ra trước mắt họ
  alternative: được thấy mắt đối mắt; hiện ra mặt đối mặt
  rationale: Câu nói về sự hiện diện hữu hình của Yahweh, nhưng thành ngữ Hê-bơ-rơ không hoàn toàn tương ứng với một thành ngữ tiếng Việt. Bản chính dùng cách nói dễ hiểu, còn chú thích bảo tồn nghĩa đen và các khả năng khác mà không xác quyết quá mức về bản chất của sự nhìn thấy.
- issue: Đối tượng được ngụ ý trong עַיִן בְּעַיִן
  choice: trước mắt họ
  alternative: mắt đối mắt
  rationale: Đại từ “họ” được suy ra từ văn cảnh gần (“dân này”, “trên họ”, “trước họ”), giúp tiếng Việt trọn nghĩa; chú thích nêu rõ dạng nguyên văn cô đọng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ngài” khi nói trực tiếp với Yahweh. Tách câu đầu để tránh một cấu trúc phụ thuộc quá dài, nhưng vẫn giữ mạch lập luận và các hình ảnh cụ thể của nguyên văn.
