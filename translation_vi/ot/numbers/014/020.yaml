source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: vi
  text: 'Yahweh phán: “Ta đã tha thứ theo lời ngươi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đã tha, như ngươi đã nói.”'
    reason: Nêu cách diễn đạt khác cho סלחתי và כִּדְבָרֶךָ, giữ sắc thái «tha/tha thứ» và khả năng hiểu cụm cuối là «như ngươi đã nói».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Dạng wayyiqtol tiếp nối mạch kể chuyện; tiếng Việt tự nhiên không cần dịch riêng liên từ וַ. Dùng “phán” vì chủ thể là Đức Giê-hô-va và đây là lời tuyên bố trực tiếp.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước יהוה theo cách gọi quen thuộc, trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: סָלַחְתִּי
  choice: Ta đã tha thứ
  rationale: Động từ סלח chỉ sự tha thứ hoặc tha tội; thể hoàn thành được diễn đạt tự nhiên bằng “đã tha thứ”, giữ ý hành động đã được quyết định và có hiệu lực.
- source_word: כִּדְבָרֶךָ
  choice: theo lời con
  rationale: Giữ khá sát cấu trúc כ + דבר, nghĩa là “theo lời của con”; đại từ số ít giống đực chỉ Môi-se. “Con” phù hợp với lời Đức Chúa Trời trực tiếp nói với Môi-se trong văn phong trang trọng mà vẫn dễ hiểu.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Hằng Hữu
  rationale: Bản văn dùng trực tiếp danh riêng יהוה. Chọn một dạng phiên âm danh riêng quen thuộc trong tiếng Việt, không thay danh ấy bằng tước hiệu và không thêm cách giải thích thần học.
- issue: Phạm vi của lời tha thứ
  choice: Không bổ sung đối tượng sau “tha thứ”
  alternative: Ta đã tha thứ cho dân này
  rationale: Tiếng Hê-bơ-rơ không nêu tân ngữ trong câu này. Giữ nguyên sự hàm ẩn để không xác định rộng hoặc hẹp hơn điều bản văn trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn. Giữ lời phán ở ngôi “Ta—con”, phù hợp tương quan giữa Đức Chúa Trời và Môi-se. Dấu chú thích [a] được đặt ngay sau toàn bộ lời trích dẫn.
