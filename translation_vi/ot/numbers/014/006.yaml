base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: vi
  text: Giô-suê, con trai Nun, và Ca-lép, con trai Giê-phu-nê, thuộc số những người đã do thám xứ, đã xé áo mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Xé áo là một phong tục thời ấy, biểu lộ sự đau buồn, kinh hãi hoặc đau khổ.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: Giô-suê, con trai Nun
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt và dịch minh bạch thành ngữ phụ hệ בִּן נוּן là “con trai Nun”.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: và Ca-lép, con trai Giê-phu-nê
  rationale: Liên từ nối Ca-lép với Giô-suê làm đồng chủ ngữ; cụm phụ hệ được giữ theo hình thức rõ ràng, trang trọng.
- source_word: מִן הַתָּרִים
  choice: là những người trong nhóm đã do thám
  rationale: מִן ở đây có nghĩa phân bộ, xác định Giô-suê và Ca-lép thuộc nhóm do thám; cách diễn đạt này tự nhiên trong tiếng Việt và tránh khiến người đọc hiểu là họ vừa rời khỏi nhóm ấy.
- source_word: אֶת הָאָרֶץ
  choice: xứ
  rationale: אֶת là dấu hiệu tân ngữ nên không dịch; הָאָרֶץ được dịch là “xứ”, chỉ vùng đất đang được nói đến mà không thêm tên Ca-na-an vốn không có trong câu.
- source_word: קָרְעוּ בִּגְדֵיהֶם
  choice: xé áo mình
  rationale: Diễn đạt ngắn gọn, tự nhiên hành động xé y phục; “mình” quy chiếu về hai chủ thể và phù hợp văn phong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “là những người trong nhóm” làm rõ sắc thái phân bộ của מִן; giữ “xứ” thay vì thêm “Ca-na-an”. Mọi dấu chú thích trong bản văn đều có chú thích tương ứng.
