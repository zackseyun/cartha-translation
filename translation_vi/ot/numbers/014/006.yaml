revisions:
- from: Giô-suê, con trai Nun, và Ca-lép, con trai Giê-phu-nê, là những người trong nhóm đã do thám xứ, thì xé áo mình.[a]
  to: Giô-suê, con trai Nun, và Ca-lép, con trai Giê-phu-nê, thuộc số những người đã do thám xứ, đã xé áo mình.[a]
  rationale: Sửa cấu trúc câu để phản ánh tự nhiên hơn quan hệ phân bộ “thuộc số những người đã do thám xứ” và giữ rõ hai người là chủ thể của động từ. Chú thích văn hóa được điều chỉnh để diễn đạt đúng phạm vi ý nghĩa mà không thêm mức độ không được nêu trong nguyên văn.
