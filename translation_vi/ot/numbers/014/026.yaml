  yaml_path: translation/ot/numbers/014/026.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức dẫn nhập lời Đức Chúa Trời, “phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và chính xác hơn “nói” về sắc thái văn cảnh.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “Giê-hô-va” là dạng danh xưng đã quen thuộc và trang trọng trong tiếng Việt.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: Giới từ אֶל đánh dấu hai người nhận lời phán; tiếng Việt tự nhiên dùng “phán với”, không cần lặp lại giới từ trước tên thứ hai.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức mở đầu lời trực tiếp, “rằng” nối tự nhiên với nội dung được phán ở câu kế tiếp và tránh lối dịch cứng “mà nói rằng”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. Bản dịch giữ một dạng danh riêng bằng tiếng Việt thay vì âm thầm thay thế bằng tước hiệu; lựa chọn này không làm thay đổi chức năng thần học của danh trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức lời phán ngắn gọn; dấu hai chấm báo trước nội dung trực tiếp ở câu tiếp theo.
