  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: vi
  text: Những người đã phao tin xấu về xứ ấy đều chết vì trận dịch trước mặt Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: đều chết
  rationale: Động từ Qal wayyiqtol của מות kể một sự việc đã xảy ra trong mạch tường thuật. Từ “đều” tự nhiên trong tiếng Việt và nhấn mạnh toàn bộ nhóm người được nói đến.
- source_word: הָאֲנָשִׁים
  choice: những người
  rationale: Danh từ số nhiều xác định chỉ ngược về những người do thám đã được nhắc đến; ngữ cảnh đủ làm rõ đối tượng mà không cần thêm từ diễn giải.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: đã đưa ra lời đồn xấu về xứ ấy
  rationale: Cấu trúc phân từ xác định họ bằng hành động trước đó. “Đưa ra” giữ hình ảnh của הוציא; דִבָּה mang sắc thái lời thuật lại gây hại hoặc gièm pha, nên “lời đồn xấu” tự nhiên hơn “báo cáo xấu” và không loại bỏ sắc thái đáng chê trách.
- source_word: בַּמַּגֵּפָה
  choice: vì tai họa
  rationale: מַגֵּפָה có thể chỉ một trận dịch hoặc đòn giáng gây chết người. Trong câu này, giới từ בְ có thể biểu thị phương tiện hoặc nguyên nhân; “vì tai họa” giữ nghĩa rộng, không xác định quá mức đó là bệnh dịch.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Cách diễn đạt này giữ sát ý hiện diện trong לִפְנֵי và duy trì sắc thái trang nghiêm của sự phán xét diễn ra trước Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm quen thuộc của danh riêng giao ước, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng bốn phụ âm. “Yahweh” bảo tồn tính chất danh riêng và phù hợp với chứng cứ ngôn ngữ nguồn.
- issue: Bản chất của מַגֵּפָה
  choice: tai họa
  alternative: dịch bệnh; đòn phạt
  rationale: Từ này có thể nói đến dịch bệnh hoặc một đòn giáng chết người từ Đức Chúa Trời. “Tai họa” giữ độ rộng ngữ nghĩa và không buộc câu vào một cơ chế cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Xứ ấy” nối tự nhiên với vùng đất đã được nói đến trong ngữ cảnh; “lời đồn xấu” chuyển tải sắc thái tiêu cực của דִבָּה mà không biến câu thành thuật ngữ hành chính.
