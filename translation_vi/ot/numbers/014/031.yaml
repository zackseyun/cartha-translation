  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/טַ֨פְּ/כֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָ/בַ֣ז יִהְיֶ֑ה וְ/הֵבֵיאתִ֣י אֹתָ֔/ם וְ/יָֽדְעוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: vi
  text: Còn con trẻ của các ngươi, mà các ngươi đã nói sẽ trở thành chiến lợi phẩm[a], Ta sẽ đưa chúng vào miền đất ấy; và chúng sẽ biết[b] miền đất mà các ngươi đã khước từ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ thành mồi” hoặc “sẽ bị cướp làm chiến lợi phẩm”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ trải nghiệm miền đất”. Động từ Hê-bơ-rơ dịch là “biết” ở đây có thể bao hàm sự biết qua kinh nghiệm.'
    reason: lexical_alternative
  - marker: c
    text: “Khước từ” cũng có thể dịch là “khinh chê” hoặc “ruồng bỏ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: con trẻ của các ngươi
  rationale: טַף chỉ trẻ nhỏ, nhấn mạnh sự non nớt và dễ bị tổn thương; “con trẻ” tự nhiên, trang trọng và chính xác hơn nghĩa rộng “con cái”.
- source_word: לָבַז
  choice: sẽ trở thành chiến lợi phẩm
  rationale: בַּז chỉ của cải hoặc người bị quân thù chiếm lấy; “chiến lợi phẩm” phù hợp bối cảnh quân sự, còn sắc thái “mồi ngon” được ghi ở chú thích.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: Ta sẽ đưa chúng vào
  rationale: Dạng Hiphil của בוא diễn tả khiến ai đó đi vào; nơi đến là miền đất được nói ngay sau đó nên có thể để hàm ẩn như nguyên văn.
- source_word: וְיָדְעוּ
  choice: chúng sẽ biết
  rationale: Giữ nghĩa trực tiếp của ידע đồng thời bảo tồn khả năng mang sắc thái trải nghiệm, hưởng biết miền đất ấy.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Nguyên văn chỉ nói “đất/miền đất”; ngữ cảnh xác định đó là đất được hứa ban mà không cần thêm “Ca-na-an” hay “hứa ban”.
- source_word: מְאַסְתֶּם בָּהּ
  choice: mà các ngươi đã khước từ
  rationale: מאס có thể là khước từ, ruồng bỏ hoặc khinh chê. “Khước từ” diễn đạt hành động không chịu nhận miền đất mà không áp đặt sắc thái khinh miệt mạnh hơn.
theological_decisions:
- issue: Có nên nói rõ “miền đất” là đất hứa hoặc xứ Ca-na-an hay không
  choice: Giữ “miền đất” mà không thêm “được hứa ban” hay “Ca-na-an”.
  alternative: miền đất hứa; xứ Ca-na-an
  rationale: הָאָרֶץ chỉ nói “miền đất”; ngữ cảnh đã làm rõ sở chỉ. Thêm tên hoặc đặc tính sẽ đưa lời giải thích vào chính văn.
- issue: Sắc thái của động từ “biết” đối với miền đất
  choice: Giữ “chúng sẽ biết” trong chính văn.
  alternative: chúng sẽ được trải nghiệm; chúng sẽ được hưởng miền đất
  rationale: ידע có thể bao hàm sự nhận biết qua trải nghiệm, nhưng nguyên văn vẫn dùng động từ phổ quát “biết”. Giữ cách nói này bảo tồn độ mở ngữ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để thể hiện lời Đức Chúa Trời trực tiếp phán với cả cộng đồng; giữ cấu trúc đối lập mở đầu bằng “Còn”. Đại từ “chúng” quy chiếu đến con trẻ. Không thêm chú thích riêng cho “biết” vì cách dịch chính văn cố ý giữ nguyên độ mở của tiếng Hê-bơ-rơ.
