source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: vi
  text: Yahweh chậm giận, dồi dào tình yêu thương bền vững[a], tha thứ tội ác và sự phản nghịch[b], nhưng tuyệt nhiên không tuyên kẻ có tội là vô tội[c]; Ngài xét phạt tội ác của cha ông trên con cháu, đến đời thứ ba và thứ tư[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giàu lòng thương xót,” “rất mực trung tín với giao ước,” hoặc “giàu tình yêu thành tín.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “tha thứ” theo nghĩa đen là “mang” hoặc “gánh” tội ác và sự phản nghịch.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “chắc chắn không miễn phạt” hoặc “không tuyên trắng án.”'
    reason: lexical_alternative
  - marker: d
    text: Trong tiếng Hê-bơ-rơ, “thứ ba” và “thứ tư” được hiểu là các đời hoặc thế hệ.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֶרֶךְ אַפַּיִם
  choice: chậm giận
  rationale: Chuyển thành ngữ Hê-bơ-rơ theo nghĩa tự nhiên trong tiếng Việt, diễn tả sự nhẫn nại trước khi nổi giận.
- source_word: רַב חֶסֶד
  choice: giàu lòng thành tín
  rationale: Diễn đạt sự dồi dào của חֶסֶד, giữ sắc thái tình yêu trung kiên và lòng trung thành trong mối quan hệ giao ước.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: tha thứ điều gian ác và sự phản nghịch
  rationale: נשא đi với các từ chỉ tội có thể mang nghĩa mang đi hay tha thứ; cách dịch này tự nhiên và vẫn phân biệt עָוֺן với פָשַׁע.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: nhưng tuyệt nhiên không kể kẻ có tội là vô tội
  rationale: Cấu trúc nhấn mạnh phủ định được thể hiện bằng “tuyệt nhiên không”; bổ sung đối tượng hàm ẩn “kẻ có tội” để câu tiếng Việt rõ nghĩa, đồng thời giữ sắc thái pháp lý của נקה.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: Ngài truy xét điều gian ác của cha ông nơi con cháu
  rationale: “Truy xét” giữ ý Đức Chúa Trời lưu tâm và đưa tội lỗi vào sự phán xét mà không thu hẹp câu này thành những hậu quả hoàn toàn tự nhiên; “con cháu” phù hợp với chuỗi nhiều thế hệ.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: đến đời thứ ba và đời thứ tư
  rationale: Bổ sung “đời” để làm rõ danh từ “thế hệ” được lược trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Sự tha thứ của Đức Chúa Trời và phán xét đối với người có tội
  choice: 'Giữ cả hai vế: Ngài tha thứ, nhưng tuyệt nhiên không kể kẻ có tội là vô tội.'
  alternative: Làm nhẹ vế phán xét hoặc giải thích ngay điều kiện để được tha thứ.
  rationale: Nguyên văn đặt lòng thương xót và công lý cạnh nhau; bản dịch không tự ý giải quyết sức căng thần học ấy.
- issue: Công thức phán xét liên thế hệ
  choice: Giữ lời tuyên bố rằng Ngài truy xét điều gian ác của cha ông nơi con cháu đến đời thứ ba và thứ tư.
  alternative: Chỉ diễn giải đây là hậu quả tự nhiên, hoặc sửa theo nguyên tắc trách nhiệm cá nhân trong các phân đoạn khác.
  rationale: Cách dịch phản ánh trực tiếp phát biểu của câu này mà không áp đặt cơ chế hay dung hòa nó với những bản văn khác.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Yahweh” cho danh Đức Chúa Trời; “cha ông” và “con cháu” thể hiện quan hệ qua nhiều thế hệ. Dấu chấm phẩy giúp phân định vế nói về bản tính và sự tha thứ với vế nói về việc thực thi công lý.
