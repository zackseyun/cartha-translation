- from: Yahweh chậm giận và giàu lòng thành tín[a], tha thứ điều gian ác và sự phản nghịch[b], nhưng tuyệt nhiên không kể kẻ có tội là vô tội[c]; Ngài truy xét điều gian ác của cha ông nơi con cháu đến đời thứ ba và đời thứ tư[d].
  to: Yahweh chậm giận, dồi dào tình yêu thương bền vững[a], tha thứ tội ác và sự phản nghịch[b], nhưng tuyệt nhiên không tuyên kẻ có tội là vô tội[c]; Ngài xét phạt tội ác của cha ông trên con cháu, đến đời thứ ba và thứ tư[d].
  rationale: Sửa “truy xét” thành “xét phạt” để phản ánh chức năng phán xét của פֹּקֵד trong ngữ cảnh mà không quy định cơ chế thần học của sự xét phạt liên thế hệ. Sửa cách dịch חֶסֶד để bao hàm rõ hơn tình yêu thương nhân hậu và bền vững. Chỉnh chú thích c cho thành ngữ tiếng Việt tự nhiên, đồng thời giữ các mốc chú thích và ý nghĩa của bản gốc.
  reviewer_model: gpt-5.6-terra
