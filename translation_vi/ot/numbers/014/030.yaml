language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִם אַתֶּם֙ תָּבֹ֣אוּ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/שַׁכֵּ֥ן אֶתְ/כֶ֖ם בָּ֑/הּ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: vi
  text: Chắc chắn các ngươi sẽ không được vào miền đất mà Ta đã giơ tay thề sẽ cho các ngươi định cư tại đó[a], ngoại trừ Ca-lép, con trai Giê-phu-nê, và Giô-suê, con trai Nun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “miền đất mà Ta đã giơ tay để cho các ngươi định cư trong đó.” Giơ tay là cử chỉ tuyên thệ, nghĩa là Ngài đã thề ban miền đất ấy cho họ.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: Chắc chắn các ngươi sẽ không được vào
  rationale: Trong lời tuyên thệ phán xét này, אִם mang lực phủ định mạnh, không phải điều kiện đơn thuần. Cách dịch này diễn đạt tự nhiên sức nặng của thành ngữ Hê-bơ-rơ.
- source_word: אֶל הָאָרֶץ
  choice: vào miền đất
  rationale: Động từ בוא với אֶל chỉ sự đi vào một lãnh thổ; “vào miền đất” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: mà Ta đã giơ tay thề
  rationale: Giữ lại hình ảnh giơ tay đồng thời nêu rõ đây là cử chỉ tuyên thệ, tránh để độc giả hiện đại hiểu mơ hồ.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: sẽ cho các ngươi định cư tại đó
  rationale: Dạng khiến khiến của שׁכן có nghĩa làm cho cư ngụ hay định cư; “cho ... định cư” vừa tự nhiên vừa giữ sắc thái khiến khiến.
- source_word: כִּי אִם
  choice: ngoại trừ
  rationale: Cụm này giới thiệu hai người duy nhất được loại trừ khỏi lời phủ định trước đó.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Ca-lép, con trai Giê-phu-nê
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt và giữ quan hệ phụ tử của nguyên văn.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: và Giô-suê, con trai Nun
  rationale: Giữ liên từ và quan hệ phụ tử; dùng dạng tên Giô-suê quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Diễn đạt thành ngữ tuyên thệ mà không làm nhẹ lời phán xét của Đức Chúa Trời
  choice: Chắc chắn các ngươi sẽ không được vào miền đất
  alternative: Nếu các ngươi vào miền đất...
  rationale: Ở đầu lời tuyên thệ, אִם có giá trị phủ định mạnh. Dịch thành câu điều kiện sẽ tạo một mệnh đề dở dang và che khuất tính chắc chắn của bản án.
- issue: Mối liên hệ giữa cử chỉ giơ tay và lời hứa ban đất
  choice: giơ tay thề sẽ cho các ngươi định cư tại đó
  alternative: giơ tay để cho các ngươi định cư tại đó
  rationale: Bản dịch nêu ý nghĩa tuyên thệ của cử chỉ nhưng vẫn giữ hình ảnh cụ thể trong nguyên văn; không suy diễn thêm nội dung thần học ngoài ngữ cảnh.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Đại từ “Ta—các ngươi” phù hợp lời phán trực tiếp của Đức Chúa Trời với cả cộng đồng. “Miền đất” giúp câu tự nhiên, còn tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt; tên Nun được giữ gọn, tránh nhầm với danh từ “con”.
