base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: vi
  text: Người A-ma-léc và người Ca-na-an đang sống trong thung lũng. Ngày mai, các ngươi hãy đổi hướng rồi lên đường vào hoang mạc theo đường Biển Đỏ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “Biển Sậy”; theo truyền thống thường dịch là “Biển Đỏ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: Người A-ma-léc và người Ca-na-an
  rationale: Hai danh từ chỉ dân tộc ở dạng số ít có mạo từ được dùng theo nghĩa tập thể. Tiếng Việt có thể diễn đạt tự nhiên bằng “người A-ma-léc” và “người Ca-na-an” để chỉ toàn thể hai nhóm dân.
- source_word: יוֹשֵׁב
  choice: đang sống
  rationale: Phân từ diễn tả tình trạng cư trú đang tiếp diễn; “đang sống” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: בָּעֵמֶק
  choice: trong thung lũng
  rationale: עֵמֶק chỉ vùng đất thấp hoặc thung lũng; “thung lũng” là cách dịch trực tiếp và phù hợp ngữ cảnh.
- source_word: מָחָר
  choice: Ngày mai
  rationale: Trạng từ thời gian chỉ ngày kế tiếp.
- source_word: פְּנוּ
  choice: hãy chuyển hướng
  rationale: Động từ mệnh lệnh yêu cầu đổi hướng. “Chuyển hướng” giữ đúng ý cơ bản mà không thêm nghĩa “quay trở lại,” vốn chỉ được suy ra từ ngữ cảnh chứ không được nói rõ trong động từ.
- source_word: וּסְעוּ לָכֶם
  choice: và lên đường
  rationale: נסע trong bối cảnh hành trình có nghĩa nhổ trại và khởi hành. Đại từ לָכֶם nhấn mạnh đối tượng nhận lệnh, nhưng không cần dịch riêng vì “các ngươi hãy” đã thể hiện rõ trong tiếng Việt.
- source_word: הַמִּדְבָּר
  choice: hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, không nhất thiết là sa mạc cát; “hoang mạc” phù hợp với địa hình và hành trình của dân Y-sơ-ra-ên.
- source_word: דֶּרֶךְ יַם סוּף
  choice: theo con đường về phía Biển Đỏ
  rationale: דֶּרֶךְ có thể chỉ con đường, tuyến đường hoặc phương hướng. Cách diễn đạt này giữ cả ý lộ trình lẫn hướng đi. יַם סוּף được dịch theo tên gọi truyền thống “Biển Đỏ,” còn nghĩa sát chữ được nêu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ sắc thái lời truyền phán trực tiếp trong bối cảnh cổ đại; không thêm liên từ diễn ngôn hoặc ý “quay trở lại” mà nguyên văn không nói rõ. Dấu chú thích được đặt ngay sau “Biển Đỏ,” là từ ngữ mà chú thích giải thích.
