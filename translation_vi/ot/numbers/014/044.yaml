  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến chính: dân chúng liều lĩnh đi lên đỉnh núi, còn Hòm Giao Ước của Yahweh và Môi-se không rời trại. “Cả gan” diễn tả được sắc thái hành động táo bạo, tự phụ của וַיַּעְפִּלוּ. Tuy nhiên, chú thích từ vựng phải được neo ngay tại cụm từ mà nó giải thích, và chú thích về cấu trúc “Hòm giao ước Yahweh” cần nêu rõ hơn giá trị của chuỗi liên kết Hê-bơ-rơ.'
