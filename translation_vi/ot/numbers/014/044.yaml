  edition: WLC
  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: vi
  text: Nhưng họ vẫn cả gan[a] đi lên đỉnh núi, trong khi Hòm Giao Ước của Yahweh[b] và Môi-se vẫn ở trong trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ hành động tự phụ” hoặc “họ ngang nhiên đi lên.” Động từ Hê-bơ-rơ hàm ý một hành động cố ý, táo bạo và tự phụ.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “Hòm giao ước Yahweh”; cũng có thể dịch theo cấu trúc sở hữu: “Hòm giao ước của Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: họ vẫn cả gan
  rationale: Động từ hiếm עפל ở dạng này diễn tả hành động cố ý, táo bạo và tự phụ. “Vẫn cả gan” tự nhiên trong tiếng Việt, đồng thời giữ sắc thái đáng trách trong bối cảnh họ làm trái lời Yahweh.
- source_word: לַעֲלוֹת
  choice: đi lên
  rationale: Giữ nghĩa chỉ sự chuyển động lên cao của עלה bằng cách diễn đạt thông dụng, rõ ràng.
- source_word: אֶל רֹאשׁ הָהָר
  choice: lên đỉnh núi
  rationale: רֹאשׁ nghĩa đen là “đầu”, nhưng trong địa hình có nghĩa thành ngữ là “đỉnh”; הָהָר ở số ít nên được dịch là “núi”.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: Hòm Giao Ước của Yahweh
  rationale: Cách dịch tự nhiên trong tiếng Việt, phản ánh chuỗi liên kết Hê-bơ-rơ và giữ trực tiếp danh Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וּמֹשֶׁה
  choice: và Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: לֹא מָשׁוּ
  choice: không rời khỏi
  rationale: מוש tại đây có nghĩa rời đi hoặc chuyển khỏi vị trí; “không rời khỏi” diễn đạt rõ rằng cả Hòm và Môi-se đều ở lại.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: khỏi giữa trại
  rationale: Phản ánh nghĩa “từ giữa/bên trong trại” của cụm Hê-bơ-rơ mà vẫn gọn và tự nhiên.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Bản nguồn dùng trực tiếp Tứ Tự Danh; “Yahweh” bảo tồn danh giao ước thay vì thay bằng tước hiệu.
- issue: Sắc thái đạo đức của וַיַּעְפִּלוּ
  choice: vẫn cả gan
  alternative: hành động tự phụ; ngang nhiên đi lên
  rationale: Cụm từ giữ được ý họ cố tình tiến lên bất chấp lời cảnh báo, nhưng không thêm một động cơ thần học vượt quá từ ngữ và văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Cả gan” truyền đạt sắc thái cố ý, tự phụ mà không quá cổ; “trong khi” làm rõ sự tương phản giữa việc dân đi lên và việc Hòm cùng Môi-se vẫn ở lại trại.
