translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bấy giờ” nối mạch tường thuật; “kéo xuống” mang sắc thái quân sự tự nhiên. Tên riêng được phiên âm theo lối dễ đọc trong tiếng Việt, còn ý nghĩa của địa danh được giữ trong chú thích.
