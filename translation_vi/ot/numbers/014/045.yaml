  - severity: low
    issue: Diễn đạt chú thích “việc biệt riêng để hủy diệt” hơi gượng.
    rationale: “Dành riêng để hủy diệt” là cách nói hiện đại, dễ hiểu hơn cho nét nghĩa liên hệ với חרם, mà không biến địa danh thành bản dịch nghĩa trong chính văn.
