base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: vi
  text: Bấy giờ, người A-ma-léc và người Ca-na-an sống trong vùng đồi núi ấy kéo xuống, đánh họ và nghiền nát họ cho đến tận Họt-ma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Họt-ma là một địa danh; tên Hê-bơ-rơ này có liên hệ với một từ mang nghĩa “sự hủy diệt” hoặc “việc dành riêng để hủy diệt”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: kéo xuống
  rationale: Giữ hướng di chuyển từ vùng cao xuống và diễn đạt tự nhiên một cuộc tiến quân; động từ số ít đứng trước chủ ngữ ghép là cấu trúc Hê-bơ-rơ thông thường.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: người A-ma-léc và người Ca-na-an
  rationale: Hai danh từ dân tộc ở dạng số ít nhưng mang nghĩa tập thể; tiếng Việt có thể dùng “người” để chỉ cả cộng đồng.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: sống trong vùng đồi núi ấy
  rationale: יֹשֵׁב chỉ việc cư trú; הָר trong ngữ cảnh địa hình khu vực phù hợp với “vùng đồi núi” hơn là một ngọn núi riêng lẻ.
- source_word: וַיַּכּוּם
  choice: đánh họ
  rationale: Giữ nghĩa rộng và cụ thể của נכה, không vội diễn giải là tiêu diệt hoàn toàn.
- source_word: וַיַּכְּתוּם
  choice: nghiền nát họ
  rationale: Truyền đạt sắc thái mạnh, gia tăng sau động từ “đánh”, phản ánh hành động áp đảo hoặc đập tan mà không khẳng định họ bị tận diệt.
- source_word: עַד הַחָרְמָה
  choice: cho đến tận Họt-ma
  rationale: עַד nêu giới hạn không gian của cuộc đánh đuổi; địa danh được phiên âm trong chính văn.
