  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: vi
  text: 'Họ nói với nhau: “Chúng ta hãy chọn một người lãnh đạo và trở về Ai Cập.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Động từ wayyiqtol tiếp nối mạch kể chuyện; trong tiếng Việt, “Họ nói” tự nhiên và không cần thêm liên từ khi câu đứng độc lập.
- source_word: אִישׁ אֶל־אָחִיו
  choice: với nhau
  rationale: Thành ngữ có nghĩa đen là “mỗi người với anh em mình” nhưng ở đây diễn tả hành động tương hỗ; “với nhau” truyền đạt đúng ý và tự nhiên trong tiếng Việt.
- source_word: נִתְּנָה
  choice: hãy chọn
  rationale: Dạng cohortative ngôi thứ nhất số nhiều, đi với רֹאשׁ, diễn tả việc đặt hoặc chọn một người làm người đứng đầu. “Hãy chọn” phù hợp với lời đề nghị của cả nhóm mà không hàm ý một thủ tục bổ nhiệm chính thức.
- source_word: רֹאשׁ
  choice: một người lãnh đạo
  rationale: Nghĩa đen là “đầu”, nhưng trong ngữ cảnh chỉ một người đứng đầu nhóm. Cách dịch này rõ ràng, hiện đại và giữ đúng chức năng của từ.
- source_word: וְנָשׁוּבָה
  choice: rồi trở về
  rationale: 'Dạng cohortative phối hợp với động từ trước, tiếp tục lời đề nghị: chọn lãnh đạo và trở về. “Rồi” thể hiện trình tự dự kiến một cách tự nhiên.'
- source_word: מִצְרָיְמָה
  choice: Ai Cập
  rationale: Hậu tố chỉ hướng biểu thị chuyển động về phía Ai Cập; giới từ “về” trong “trở về” đã truyền đạt đầy đủ ý hướng đến.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu; các thành ngữ Hê-bơ-rơ được chuyển sang cách nói tiếng Việt tự nhiên mà không thêm diễn giải thần học.
