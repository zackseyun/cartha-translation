source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: vi
  text: Xin Ngài tha thứ tội lỗi của dân này theo lòng nhân từ lớn lao của Ngài, như Ngài đã cưu mang dân này[a] từ Ai Cập cho đến nay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như Ngài đã tha thứ cho dân này từ Ai Cập cho đến nay.” Động từ Hê-bơ-rơ có nghĩa cơ bản là “mang, gánh”; trong một số ngữ cảnh, từ này cũng có thể có nghĩa là “tha thứ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: Xin tha
  rationale: Mệnh lệnh סלח cùng tiểu từ נָא diễn tả một lời khẩn cầu tha thiết; “Xin tha” tự nhiên, trang trọng và giữ được sắc thái cầu xin.
- source_word: לַעֲוֺן
  choice: tội
  rationale: עָוֹן có thể chỉ điều gian ác, tội lỗi, trách nhiệm hoặc hậu quả của tội. Trong ngữ cảnh này, “tội” diễn đạt tự nhiên đối tượng của hành động tha thứ mà không thu hẹp quá mức vào hành vi hay hình phạt.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: עַם là danh từ tập hợp số ít chỉ cộng đồng dân giao ước; “dân này” trực tiếp và tự nhiên trong tiếng Việt.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: theo lòng thành tín lớn lao của Ngài
  rationale: גֹּדֶל là sự lớn lao; חֶסֶד bao hàm tình yêu trung tín, lòng nhân từ và sự thủy chung trong giao ước. “Lòng thành tín” giữ được yếu tố bền vững và trung tín, trong khi “lớn lao” phản ánh גֹּדֶל.
- source_word: וְכַאֲשֶׁר
  choice: như
  rationale: Liên từ đưa ra sự so sánh với hành động trước đây của Đức Chúa Trời; “như” gọn, tự nhiên và rõ quan hệ viện dẫn tiền lệ.
- source_word: נָשָׂאתָה
  choice: Ngài đã mang lấy
  rationale: נשא có nghĩa cơ bản là nhấc, mang hoặc gánh, và trong một số ngữ cảnh có thể mang nghĩa tha thứ. Vì tân ngữ ở đây là chính “dân này”, “mang lấy” giữ được hình ảnh gốc cùng độ mở ngữ nghĩa, thay vì quyết định hoàn toàn theo nghĩa “tha thứ”.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: từ Ai Cập cho đến nay
  rationale: Cụm từ diễn tả sự tiếp nối từ cuộc ra khỏi Ai Cập đến thời điểm hiện tại; cách dịch này tự nhiên và giữ được chiều thời gian nổi bật trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của נָשָׂאתָה trong lời cầu xin của Môi-se
  choice: Giữ hình ảnh Đức Chúa Trời đã “mang lấy” dân, bao gồm sắc thái nâng đỡ, chịu đựng và có thể cả tha thứ.
  alternative: “Ngài đã tha thứ cho dân này” hoặc “Ngài đã nhẫn nhịn dân này”.
  rationale: Tân ngữ trực tiếp là “dân này” chứ không phải “tội của họ”, nên nghĩa rộng “mang/gánh” có cơ sở mạnh. Cách dịch chính giữ sự mơ hồ và sức căng thần học của nguyên ngữ; chú thích nêu rõ nghĩa “tha thứ” khả hữu trong ngữ cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ngài” phù hợp lời Môi-se trực tiếp thưa với Đức Chúa Trời. Bản dịch ưu tiên giữ hình ảnh và sự mơ hồ thực sự của động từ נשא; dấu chú thích [a] đặt ngay sau cụm từ liên quan.
