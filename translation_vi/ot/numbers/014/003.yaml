  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: vi
  text: Tại sao Yahweh lại đưa chúng ta vào xứ này để chết vì gươm? Vợ và con nhỏ chúng ta sẽ thành chiến lợi phẩm[a]. Chẳng phải trở về Ai Cập thì tốt hơn cho chúng ta sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sẽ thành mồi”; từ Hê-bơ-rơ có thể chỉ những người bị quân thù bắt làm của cướp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Tại sao... lại
  rationale: Diễn đạt tự nhiên lời chất vấn tiếp nối trong tiếng Việt; ngữ cảnh liền trước đã thể hiện mạch nối nên không cần dịch máy móc liên từ וְ thành “Và”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: מֵבִיא
  choice: đưa
  rationale: Phân từ chỉ hành động đang diễn ra hoặc được hình dung là sắp hoàn tất; trong câu hỏi hiện tại, “lại đưa” truyền đạt tự nhiên sắc thái ấy.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: để ngã chết dưới lưỡi gươm
  rationale: Làm rõ thành ngữ Hê-bơ-rơ chỉ việc chết bởi gươm trong chiến trận, đồng thời giữ hình ảnh “ngã” và “lưỡi gươm”.
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: vợ con chúng ta
  rationale: Cách nói tiếng Việt gọn, tự nhiên cho “vợ chúng ta và trẻ nhỏ của chúng ta”; “con” trong ngữ cảnh vẫn truyền đạt nhóm trẻ nhỏ dễ bị tổn thương.
- source_word: יִהְיוּ לָבַז
  choice: sẽ trở thành chiến lợi phẩm
  rationale: בַּז chỉ của cướp hoặc chiến lợi phẩm bị quân thù chiếm lấy; lựa chọn này phù hợp trực tiếp với bối cảnh chiến tranh.
- source_word: הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה
  choice: Chẳng phải chúng ta trở về Ai Cập thì tốt hơn sao?
  rationale: Giữ lực của câu hỏi tu từ phủ định và diễn đạt tự nhiên phép so sánh ngầm trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh Thánh; bản dịch giữ đây là danh riêng thay vì thay bằng tước hiệu. “Đức Giê-hô-va” là dạng tiếng Việt trang trọng, dễ nhận biết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi đầu giữ giọng oán trách; “ngã chết dưới lưỡi gươm” bảo tồn hình ảnh Hê-bơ-rơ nhưng làm rõ ý nghĩa. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
