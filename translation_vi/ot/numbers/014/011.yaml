id: NUM.14.11
reference: Numbers 14:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Dân này còn khinh miệt Ta[a] cho đến bao giờ? Chúng còn không tin Ta[b] cho đến bao giờ, bất chấp mọi dấu lạ Ta đã làm giữa chúng?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “coi khinh Ta” hoặc “khước từ Ta với thái độ khinh miệt.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không tin cậy nơi Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời dưới dạng chuyển tự, thay vì thay bằng một tước hiệu.
- source_word: עַד אָנָה
  choice: cho đến bao giờ
  rationale: Cách hỏi tu từ tự nhiên trong tiếng Việt, đồng thời giữ được sắc thái than trách của nguyên văn.
- source_word: יְנַאֲצֻנִי
  choice: khinh miệt Ta
  rationale: Động từ נאץ diễn tả thái độ coi khinh đi kèm sự khước từ; “khinh miệt” giữ được mức độ mạnh của lời quở trách.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: Giữ danh từ tập hợp số ít và sắc thái xa cách, quở trách của cụm từ Hê-bơ-rơ.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: không tin Ta
  rationale: Trong tiếng Việt, “tin Ta” có thể bao hàm cả tin lời và đặt lòng tin cậy nơi một người, nhờ đó giữ được độ rộng nghĩa của אמן với giới từ ב.
- source_word: בְּכֹל הָאֹתוֹת
  choice: bất chấp mọi dấu lạ
  rationale: 'Trong ngữ cảnh, giới từ ב mang quan hệ nhượng bộ: dân vẫn không tin dù đã có tất cả các dấu lạ. Cách dịch này làm rõ quan hệ ấy bằng tiếng Việt tự nhiên.'
- source_word: הָאֹתוֹת
  choice: dấu lạ
  rationale: “Dấu lạ” là cách diễn đạt quen thuộc, trang trọng và phù hợp với אוֹת trong ngữ cảnh các hành động bày tỏ quyền năng của Đức Chúa Trời.
- source_word: עָשִׂיתִי
  choice: Ta đã làm
  rationale: Thì hoàn thành trong tiếng Việt cho thấy các hành động đã xảy ra nhưng vẫn có ý nghĩa đối với lời quở trách hiện tại.
- source_word: בְּקִרְבּוֹ
  choice: giữa chúng
  rationale: Hậu tố Hê-bơ-rơ ở số ít quy chiếu về danh từ tập hợp “dân này”; tiếng Việt tự nhiên dùng đại từ số nhiều “chúng” khi nói về các thành viên của dân.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Chuyển tự “Yahweh” bảo tồn đây là danh riêng, không thay nó bằng một tước hiệu.
- issue: Sắc thái của לֹא יַאֲמִינוּ בִי
  choice: không tin Ta
  alternative: không tin cậy nơi Ta
  rationale: Cấu trúc này có thể nhấn mạnh cả sự tin nhận lẫn lòng tin cậy. “Tin Ta” giữ được cả hai khả năng trong tiếng Việt; chú thích nêu rõ sắc thái thay thế mà không thu hẹp nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại “cho đến bao giờ” để giữ cấu trúc tu từ song song của nguyên văn. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời; “chúng” diễn đạt tự nhiên danh từ tập hợp “dân này” mà không làm thay đổi đối tượng quy chiếu.
