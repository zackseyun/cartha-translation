  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc hai câu hỏi tu từ lặp lại của Hê-bơ-rơ: Yahweh phán cùng Môi-se; “dân này” là danh từ tập hợp mang sắc thái quở trách; động từ נאץ được chuyển đạt đủ mạnh bằng “khinh miệt”; và לֹא יַאֲמִינוּ בִי được giữ ở độ rộng nghĩa bằng “không tin Ta.” “Bất chấp mọi dấu lạ” diễn đạt phù hợp quan hệ nhượng bộ theo ngữ cảnh của בְּכֹל. “Giữa chúng” truyền đạt tự nhiên בְּקִרְבּוֹ, với hậu tố số ít quy chiếu về tập thể “dân này.”'
  naturalness: Văn bản hiện đại, trang trọng, rõ ràng và đọc tự nhiên. Việc lặp “cho đến bao giờ” bảo toàn nhịp điệu chất vấn của nguyên văn. Đại từ “Ta” nhất quán với diễn ngôn trực tiếp của Yahweh, còn “chúng” tự nhiên khi chỉ các thành viên của “dân này.”
  terminology: “Yahweh” nhất quán với quyết định chuyển tự danh יהוה. “Dấu lạ” là thuật ngữ Kinh Thánh tiếng Việt quen thuộc cho אוֹת trong bối cảnh này, không gây lệch nghĩa. Chú thích a và b nêu các khả năng từ vựng thực sự có căn cứ, không áp đặt cách hiểu giáo phái.
