source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: vi
  text: '“Ta, Đức Giê-hô-va, đã phán: Chắc chắn[a] Ta sẽ làm điều này với toàn thể cộng đồng gian ác này[b], là những kẻ đã tụ họp chống lại Ta: trong hoang mạc này, họ sẽ đi đến chỗ tận cùng, và ở đó họ sẽ chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thành ngữ Hê-bơ-rơ được dịch là “Chắc chắn” có nghĩa sát chữ là “nếu không”; trong ngữ cảnh lời thề, nó diễn tả sự quả quyết mạnh mẽ.
    reason: lexical_alternative
  - marker: b
    text: “Cộng đồng” cũng có thể dịch là “hội chúng” hoặc “hội đồng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: דִּבַּרְתִּי
  choice: đã phán
  rationale: Thể hoàn thành chỉ lời tuyên bố thần linh đã được nói ra; “phán” phù hợp với văn cảnh trang nghiêm.
- source_word: אִם לֹא
  choice: Ta thề rằng
  rationale: Trong công thức thề, cụm này diễn tả sự quả quyết mạnh mẽ, không phải một điều kiện còn bỏ ngỏ.
- source_word: הָעֵדָה הָרָעָה
  choice: cộng đồng gian ác
  rationale: עֵדָה chỉ cộng đồng hội họp của Israel; “cộng đồng” tự nhiên trong tiếng Việt và không gợi riêng một cơ cấu giáo hội. “Gian ác” giữ sự phán xét về đạo đức.
- source_word: הַנּוֹעָדִים עָלָי
  choice: những kẻ đã tụ họp chống lại Ta
  rationale: Giữ cả ý tập hợp thành một nhóm và ý đối nghịch được biểu thị bởi עָלָי trong văn cảnh.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: trong hoang mạc này
  rationale: “Hoang mạc” diễn đạt vùng đất hoang vu trong hành trình của Israel và giữ từ chỉ định “này”.
- source_word: יִתַּמּוּ
  choice: sẽ bị tiêu diệt
  rationale: Trong ngữ cảnh phán xét dẫn đến cái chết, cách dịch này truyền đạt ý họ sẽ đi đến chỗ tận cùng, nhưng vẫn giữ mệnh đề tiếp theo nói rõ rằng họ sẽ chết.
- source_word: וְשָׁם יָמֻתוּ
  choice: và tại đây chúng sẽ chết
  rationale: שָׁם quy chiếu về chính hoang mạc vừa nêu; “tại đây” tự nhiên theo điểm nhìn của lời phán và giữ sự nhấn mạnh về nơi chịu phán xét.
theological_decisions:
- issue: Công thức thề אִם לֹא
  choice: 'Diễn đạt thành lời thề quả quyết: “Ta thề rằng”'
  alternative: “Chắc chắn Ta sẽ…” hoặc dạng sát chữ “nếu không”
  rationale: Đây là công thức thề rút gọn trong tiếng Hê-bơ-rơ. Dịch như một lời thề giữ được tính trang nghiêm và mức độ chắc chắn mà không biến câu thành điều kiện.
- issue: Ý nghĩa của יִתַּמּוּ bên cạnh “chúng sẽ chết”
  choice: “sẽ bị tiêu diệt” rồi “sẽ chết”
  alternative: “sẽ đi đến chỗ tận cùng” hoặc “sẽ chấm dứt”
  rationale: Giữ hai động từ riêng biệt và sức nặng của phán quyết, đồng thời không đồng nhất hoàn toàn động từ thứ nhất với động từ chỉ cái chết.
- issue: Danh xưng cộng đồng עֵדָה
  choice: “cộng đồng”
  alternative: “hội chúng” hoặc “hội đồng”
  rationale: “Cộng đồng” biểu thị toàn thể nhóm người bị xét xử mà không đưa vào nghĩa giáo hội về sau; các phương án khác vẫn có thể có về mặt từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Đại từ “Ta” giữ giọng phán của Đức Chúa Trời; “chúng” thể hiện sự lên án đối với nhóm phản nghịch. Gộp hai lưu ý từ vựng vào một chú thích [a] để mọi dấu chú thích đều xuất hiện trong chính văn.
