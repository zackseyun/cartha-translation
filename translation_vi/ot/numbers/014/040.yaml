  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: vi
  text: 'Sáng sớm, họ dậy và đi lên đỉnh núi, nói: “Chúng tôi đây! Chúng tôi sẽ đi lên nơi Yahweh đã nói đến, vì chúng tôi đã phạm tội.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Sáng sớm, họ dậy
  rationale: Cụm động từ Hiphil của שׁכם kết hợp với בַבֹּקֶר nhấn mạnh việc dậy sớm; cách diễn đạt này tự nhiên trong tiếng Việt và không lặp ý.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: đi lên đỉnh núi
  rationale: עלה là động từ thông dụng chỉ việc đi lên, còn רֹאשׁ הָהָר là thành ngữ chỉ đỉnh núi.
- source_word: לֵאמֹר
  choice: nói
  rationale: Dạng nguyên mẫu này giới thiệu lời nói trực tiếp; “nói” là cách chuyển ngữ gọn và tự nhiên.
- source_word: הִנֶּנּוּ
  choice: Chúng tôi đây!
  rationale: Đây là công thức tự trình diện ở ngôi thứ nhất số nhiều, được giữ lại mà không diễn giải quá mức thành “chúng tôi đã sẵn sàng”.
- source_word: וְעָלִינוּ
  choice: Chúng tôi sẽ đi lên
  rationale: Dù có hình thức hoàn thành với liên từ, trong ngữ cảnh câu này động từ diễn tả hành động họ đang quyết định thực hiện.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר יְהוָה
  choice: đến nơi Đức Giê-hô-va đã phán đến
  rationale: מָקוֹם là “nơi”; động từ אָמַר chỉ “phán/nói”. Thêm “đến” làm rõ quan hệ với địa điểm theo ngữ cảnh nhưng không nâng nghĩa thành “hứa”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh xưng riêng quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt để chuyển Tetragrammaton.
- source_word: כִּי חָטָאנוּ
  choice: vì chúng tôi đã phạm tội
  rationale: כִּי nêu lý do, còn חטא mang ý nghĩa đạo đức và thần học là phạm tội, mạnh hơn cách nói đơn thuần “đã sai”.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản dịch giữ đây là danh riêng của Đức Chúa Trời, không thay bằng tước hiệu “CHÚA”; “Đức Giê-hô-va” là cách gọi trang trọng và quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt.
- issue: Quan hệ của lời thú tội với ý định đi lên
  choice: vì chúng tôi đã phạm tội
  alternative: quả thật, chúng tôi đã phạm tội
  rationale: כִּי có thể mang sắc thái giải thích hoặc xác nhận. Ngữ cảnh gần nhất hỗ trợ quan hệ lý do, nhưng không hàm ý rằng lời thú tội tự nó làm cho hành động của họ trở nên đúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ lời tự trình diện “Chúng tôi đây!” cùng sức nặng của lời thú tội; tránh diễn giải họ là đã thật sự vâng phục hay được tha thứ.
