  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: vi
  text: Theo số ngày các ngươi đã do thám xứ—bốn mươi ngày—một ngày tính một năm, một ngày tính một năm, các ngươi sẽ gánh tội lỗi mình trong bốn mươi năm; và các ngươi sẽ biết sự chống đối của Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự xa cách của Ta,” “sự thù nghịch của Ta,” hoặc “sự bất mãn của Ta.” Một số bản dịch truyền thống hiểu là “việc Ta thất hứa,” nhưng từ Hê-bơ-rơ hiếm gặp này có lẽ nói đến sự chống đối hoặc xa cách của Ta đối với thế hệ nổi loạn, chứ không nói rằng Ta không giữ lời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: Theo số ngày
  rationale: Giới từ בְּ với מִסְפָּר diễn tả sự tương ứng theo số lượng; cách dịch này giữ mối liên hệ trực tiếp giữa số ngày do thám và số năm chịu phạt.
- source_word: תַּרְתֶּם אֶת־הָאָרֶץ
  choice: các ngươi đã do thám xứ
  rationale: Trong ngữ cảnh này, תור chỉ nhiệm vụ trinh sát Ca-na-an; “do thám” chính xác hơn “thăm dò.” “Xứ” diễn đạt הָאָרֶץ một cách ngắn gọn và phù hợp với văn cảnh.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: mỗi ngày kể là một năm, mỗi ngày kể là một năm
  rationale: Giữ nguyên phép lặp nhấn mạnh của tiếng Hê-bơ-rơ và làm rõ sự tương ứng giữa một ngày với một năm.
- source_word: תִּשְׂאוּ אֶת־עֲוֺנֹתֵיכֶם
  choice: các ngươi sẽ gánh tội lỗi mình
  rationale: Thành ngữ נשא עון bao gồm việc mang tội và hậu quả của tội. “Gánh tội lỗi mình” giữ được hình ảnh sức nặng và nội dung luân lý mà không diễn giải quá mức.
- source_word: וִידַעְתֶּם
  choice: và các ngươi sẽ biết
  rationale: Giữ nghĩa rộng của ידע, có thể bao gồm cả nhận biết lẫn kinh nghiệm thực tế.
- source_word: תְּנוּאָתִי
  choice: sự chống đối của ta
  rationale: Danh từ hiếm này có thể chỉ sự chống đối, xa cách, thù nghịch hoặc bất mãn. “Sự chống đối của ta” phù hợp với bối cảnh phán xét và không hàm ý Đức Chúa Trời thất tín.
theological_decisions:
- issue: Cách dịch תְּנוּאָתִי trong lời phán xét
  choice: sự chống đối của ta
  alternative: sự xa cách của ta; sự thù nghịch của ta; sự bất mãn của ta; việc ta thất hứa
  rationale: Ngữ cảnh nói đến lập trường phán xét của Đức Chúa Trời đối với thế hệ nổi loạn. Cách dịch đã chọn giữ được mức độ nghiêm khắc nhưng không áp đặt ý rằng Đức Chúa Trời không giữ lời; chú thích vẫn bảo tồn tính hiếm và độ bất định của từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Đại từ “các ngươi” phù hợp với lời Đức Chúa Trời trực tiếp phán xét cả cộng đồng. Dấu gạch ngang làm nổi bật cụm giải thích “bốn mươi ngày,” còn phép lặp được giữ nguyên để phản ánh sự nhấn mạnh của nguyên bản.
