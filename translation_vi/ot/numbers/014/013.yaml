revisions:
- from: 'Nhưng Môi-se thưa với Yahweh[a]: “Bấy giờ người Ai Cập sẽ nghe biết, vì Ngài đã dùng quyền năng mình đưa dân này lên khỏi giữa họ.”'
  to: 'Nhưng Môi-se thưa với Yahweh[a]: “Người Ai Cập sẽ nghe, vì Ngài đã dùng quyền năng của Ngài đưa dân này lên khỏi giữa họ.”'
  rationale: Sửa nhẹ để sát nghĩa từ vựng hơn (“nghe”), làm rõ đại từ sở hữu (“quyền năng của Ngài”), và không áp đặt thêm sắc thái thời điểm bằng “Bấy giờ.” Vẫn giữ cách hiểu tương lai trong bản chính và bảo tồn cách hiểu quá khứ có thể có trong chú thích.
