id: NUM.14.13
reference: Numbers 14:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: vi
  text: 'Nhưng Môi-se thưa với Yahweh[a]: “Người Ai Cập sẽ nghe, vì Ngài đã dùng quyền năng của Ngài đưa dân này lên khỏi giữa họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Và người Ai Cập đã nghe, vì Ngài đã dùng quyền năng của Ngài đưa dân này lên khỏi giữa họ.” Dạng động từ Hê-bơ-rơ có thể được hiểu theo nghĩa quá khứ, hoặc theo nghĩa tương lai/hệ quả trong lời cầu xin của Môi-se; bản văn chính chọn nghĩa hướng tới tương lai, phù hợp với lập luận ở các câu kế tiếp.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng Môi-se thưa
  rationale: Liên từ nối tiếp diễn tiến câu chuyện, nhưng trong ngữ cảnh lời Môi-se đáp lại phán quyết vừa được công bố, “nhưng” diễn đạt tự nhiên sắc thái tương phản. “Thưa” phù hợp với lời một người nói trực tiếp với Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng Tứ Tự Danh, thay vì thay bằng một tước hiệu.
- source_word: וְשָׁמְעוּ מִצְרַיִם
  choice: Bấy giờ người Ai Cập sẽ nghe biết
  rationale: Dạng động từ có thể được hiểu theo nghĩa quá khứ hoặc như kết quả tương lai trong lời cầu xin. Ngữ cảnh lập luận tiếp nối sang câu sau ủng hộ nghĩa hướng tới hệ quả. “Nghe biết” tự nhiên trong tiếng Việt khi nói đến tin tức đến tai một dân tộc.
- source_word: כִּי
  choice: vì
  rationale: 'Diễn đạt quan hệ giải thích hoặc nêu căn cứ: người Ai Cập sẽ nghe biết vì chính Yahweh đã đưa dân Israel ra khỏi giữa họ.'
- source_word: הֶעֱלִיתָ
  choice: đã ... đưa ... lên
  rationale: Giữ hướng nghĩa cơ bản của thể Hiphil động từ עלה là “đưa lên”, đồng thời thì hoàn thành được thể hiện bằng “đã”.
- source_word: בְכֹחֲךָ
  choice: dùng quyền năng mình
  rationale: Giới từ בְּ chỉ phương tiện; cách diễn đạt này tự nhiên trong tiếng Việt và giữ trọng tâm vào quyền năng của Yahweh.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: עם là danh từ tập hợp số ít; “dân này” ngắn gọn, tự nhiên và không thêm sắc thái chính trị của “quốc gia”.
- source_word: מִקִּרְבּוֹ
  choice: khỏi giữa họ
  rationale: Hậu tố số ít quy chiếu tập thể về Ai Cập; tiếng Việt tự nhiên dùng “họ” để chỉ người Ai Cập.
theological_decisions:
- issue: Cách chuyển יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời. Phiên âm “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Thời và chức năng của וְשָׁמְעוּ
  choice: Bấy giờ người Ai Cập sẽ nghe biết
  alternative: Và người Ai Cập đã nghe biết
  rationale: Dạng qatal cho phép cả cách hiểu quá khứ lẫn cách hiểu hướng tới tương lai/kết quả. Mạch lời cầu xin, đặc biệt sự tiếp nối ở câu sau, thuận với hệ quả tương lai; cách đọc quá khứ được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” cho lời Môi-se nói với Yahweh; giữ danh riêng “Yahweh”. Cụm “nghe biết” làm rõ sắc thái nghe được tin mà không bổ sung nội dung ngoài nguyên văn.
