    rationale: “Cộng đồng” đã chỉ tập thể; “con dân” lại là một cách chỉ chính tập thể ấy. Thay bằng “cộng đồng con cháu Y-sơ-ra-ên” vừa rõ quan hệ với בני ישראל vừa mạch lạc hơn.
  revised_text: 'Họ nói với toàn thể cộng đồng con cháu Y-sơ-ra-ên: “Xứ mà chúng tôi đã đi qua để do thám là một xứ rất, rất tốt.”'
