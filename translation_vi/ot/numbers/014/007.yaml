  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: vi
  text: 'Họ nói với toàn thể cộng đồng con cháu Y-sơ-ra-ên: “Xứ mà chúng tôi đã đi qua để do thám là một xứ rất, rất tốt.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Dịch tự nhiên lối kể chuyện của động từ אמר; liên từ וַ được lược trong tiếng Việt vì câu vẫn nối mạch rõ ràng từ văn cảnh.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toàn thể cộng đồng con dân Y-sơ-ra-ên
  rationale: “Cộng đồng” diễn đạt עֵדָה là cộng đồng đang tụ họp; “con dân Y-sơ-ra-ên” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa giữ được dấu vết của thành ngữ בְּנֵי יִשְׂרָאֵל.
- source_word: לֵאמֹר
  choice: lược bỏ như một từ riêng
  rationale: Động từ nguyên mẫu dẫn lời này là thành ngữ Hê-bơ-rơ; dấu hai chấm đã giới thiệu lời nói trực tiếp một cách tự nhiên trong tiếng Việt.
- source_word: הָאָרֶץ
  choice: xứ
  rationale: Chỉ vùng đất Ca-na-an đang được nói đến; “xứ” là cách diễn đạt trang trọng, quen thuộc và phù hợp ngữ cảnh.
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: mà chúng tôi đã đi qua
  rationale: Giữ ý chuyển động qua một vùng đất của עבר với ב, đồng thời tự nhiên trong tiếng Việt.
- source_word: לָתוּר אֹתָהּ
  choice: để do thám
  rationale: Trong trình thuật Dân Số, תור nói đến việc khảo sát có tính trinh sát; “do thám” phản ánh đúng ngữ cảnh hơn từ trung tính “thăm dò”.
- source_word: טוֹבָה
  choice: tốt
  rationale: Giữ nghĩa cơ bản của tính từ, không tự tăng cường vì mức độ nhấn mạnh đã nằm trong מְאֹד מְאֹד.
- source_word: מְאֹד מְאֹד
  choice: rất, rất
  rationale: Giữ nguyên phép lặp nhấn mạnh của nguyên văn thay vì gộp thành một trạng từ cường độ duy nhất.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Bản dịch ưu tiên tương đương tối ưu và giữ phép lặp tu từ “rất, rất” của tiếng Hê-bơ-rơ. Không cần chú thích vì các lựa chọn thay thế không tạo ra khác biệt nội dung đáng kể trong câu này.
