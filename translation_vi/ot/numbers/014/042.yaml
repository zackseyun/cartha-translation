id: NUM.14.42
reference: Numbers 14:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: vi
  text: Đừng đi lên[a], vì Yahweh không ở giữa anh em[b], kẻo anh em bị đánh bại[c] trước mặt quân thù của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “tiến lên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “ở trong cộng đồng anh em” hoặc “ở cùng anh em.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bị đánh ngã.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: Đừng đi lên
  rationale: Tiểu từ phủ định אַל cùng động từ diễn đạt lệnh cấm; תַּעֲלוּ có nghĩa cơ bản là “đi lên”. Cách dịch này giữ hình ảnh địa lý-quân sự của nguyên văn.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho lời cấm, tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay bằng một tước hiệu.
- source_word: בְּקִרְבְּכֶם
  choice: ở giữa anh em
  rationale: Giữ nét nghĩa không gian và cộng đồng của cụm từ, theo sát nghĩa “ở giữa, ở trong anh em”.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: kẻo anh em bị đánh bại
  rationale: Trong ngữ cảnh lời cảnh báo và chiến trận, liên từ cùng thể bị động của נגף diễn đạt hậu quả cần tránh. “Kẻo” chuyển tải tự nhiên sắc thái cảnh báo, còn “bị đánh bại” phù hợp ngữ cảnh quân sự.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: trước mặt quân thù của anh em
  rationale: Giữ cấu trúc “trước mặt” của לִפְנֵי và nghĩa quân sự của אֹיְבֵיכֶם.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sự hiện diện của Yahweh trong בְּקִרְבְּכֶם
  choice: Yahweh không ở giữa anh em
  alternative: Yahweh không ở cùng anh em
  rationale: “Ở giữa anh em” giữ nguyên hình ảnh về sự hiện diện trong cộng đồng, không diễn giải rộng hơn điều câu Hê-bơ-rơ khẳng định.
- issue: Sắc thái của וְלֹא תִּנָּגְפוּ
  choice: kẻo anh em bị đánh bại
  alternative: và anh em sẽ không bị đánh ngã; để anh em khỏi bị đánh bại
  rationale: Cấu trúc có thể được hiểu theo hình thức là “và không”, nhưng trong mạch cảnh báo, “kẻo” diễn đạt tự nhiên hậu quả có nguy cơ xảy ra mà không biến lời này thành một khẳng định tất định.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng Israel; “quân thù” làm rõ bối cảnh chiến trận. Giữ “đi lên” trong chính văn để bảo tồn hình ảnh của nguyên ngữ, đồng thời chú thích cách hiểu “tiến lên”.
