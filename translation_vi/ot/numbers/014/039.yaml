source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: vi
  text: Môi-se nói những lời này với toàn thể con cái Y-sơ-ra-ên[a], và dân chúng hết sức than khóc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “toàn thể dân Y-sơ-ra-ên” hoặc “toàn thể người Y-sơ-ra-ên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nói
  rationale: Động từ piel ở đây thuật lại việc Môi-se truyền đạt phán quyết của Đức Chúa Trời; “nói” trực tiếp, tự nhiên và không thêm sắc thái diễn giải.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: những lời này
  rationale: דְּבָרִים có thể chỉ lời nói, sự việc hoặc vấn đề; trong ngữ cảnh Môi-se truyền lại lời phán vừa nêu, “những lời này” giữ đúng sắc thái ngôn từ.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: với toàn thể con cái Y-sơ-ra-ên
  rationale: Cách dịch này giữ hình thức của thành ngữ chỉ dân giao ước trong tiếng Hê-bơ-rơ, đồng thời vẫn dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
- source_word: וַיִּתְאַבְּלוּ
  choice: đau buồn
  rationale: Dạng hitpael của אבל diễn tả việc bước vào trạng thái than khóc hoặc tang chế. “Đau buồn” tự nhiên trong tiếng Việt và phù hợp với phản ứng cộng đồng trước lời phán xét.
- source_word: הָעָם
  choice: dân chúng
  rationale: עָם chỉ tập thể dân; “dân chúng” là cách diễn đạt tự nhiên, rõ nghĩa trong câu này.
- source_word: מְאֹד
  choice: vô cùng
  rationale: Từ này nhấn mạnh mức độ của nỗi đau buồn; “vô cùng” truyền đạt cường độ mạnh mà vẫn trang trọng, hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cách gọi “con cái Y-sơ-ra-ên” trong chính văn để phản ánh sát thành ngữ Hê-bơ-rơ, đồng thời nêu cách diễn đạt tự nhiên hơn trong chú thích.
