id: NUM.14.43
reference: Numbers 14:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: vi
  text: Vì người Amalek và người Canaan đang ở đó trước mặt anh em, và anh em sẽ ngã dưới lưỡi gươm. Bởi anh em đã quay lưng, không còn theo Yahweh nữa, nên Yahweh sẽ không ở cùng anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Liên từ mở đầu nêu lý do cho lời cảnh báo ở câu trước; “Vì” tự nhiên và giữ rõ quan hệ giải thích.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: người Amalek và người Canaan
  rationale: Hai danh từ số ít mang nghĩa tập thể, chỉ các dân tộc; tiếng Việt có thể dùng “người” với tên dân tộc mà không cần đánh dấu số nhiều.
- source_word: שָׁם לִפְנֵיכֶם
  choice: đang ở đó trước mặt anh em
  rationale: Giữ cả yếu tố vị trí “ở đó” và quan hệ không gian “trước mặt anh em”; “đang” diễn đạt tình trạng hiện hữu trong bối cảnh lời cảnh báo.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: và anh em sẽ ngã dưới lưỡi gươm
  rationale: Giữ hình ảnh động từ “ngã” trong chiến trận; thành ngữ “dưới lưỡi gươm” truyền đạt việc bị giết hoặc đánh bại bằng vũ khí mà không giải thích quá mức.
- source_word: כִּי עַל כֵּן
  choice: Bởi ... nên
  rationale: Cấu trúc nguyên nhân–kết quả tự nhiên trong tiếng Việt, làm rõ rằng việc Yahweh không ở cùng họ là hệ quả của việc họ ngừng theo Ngài.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: anh em đã quay lưng, không còn theo Yahweh nữa
  rationale: Diễn đạt cả ý quay trở lại/quay lưng của שׁוב lẫn hình ảnh “theo sau” trong מֵאַחֲרֵי; tránh lối dịch sát chữ thiếu tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên chuyển danh riêng giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: nên Yahweh sẽ không ở cùng anh em
  rationale: Giữ nguyên mô-típ sự hiện diện của Yahweh và ý tương lai của mệnh đề.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; phiên chuyển “Yahweh” bảo tồn danh giao ước mà không thay bằng tước hiệu.
- issue: Ý nghĩa của việc “quay khỏi sau Yahweh”
  choice: quay lưng, không còn theo Yahweh nữa
  alternative: lìa bỏ Yahweh
  rationale: Lựa chọn này giữ hình ảnh đi theo Yahweh và hành động quay lại, đồng thời không diễn giải sâu hơn về tình trạng giao ước hay sự cứu rỗi của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi hai số nhiều, phù hợp lời Môi-se nói với cộng đồng Israel. Không thêm chú thích vì câu này không có biến thể hay độ mơ hồ nào cần ghi chú để bản dịch chính khỏi bị quá tải.
