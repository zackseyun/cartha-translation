source:
  edition: WLC
  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: vi
  text: Chỉ có điều, đừng nổi loạn chống lại Yahweh. Anh em cũng đừng sợ dân trong xứ, vì họ là bánh của chúng ta[a]. Sự che chở của họ đã lìa khỏi họ[b], và Yahweh ở cùng chúng ta. Đừng sợ họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ là thức ăn của chúng ta.” Nguyên văn Hê-bơ-rơ theo nghĩa đen là: “họ là bánh của chúng ta”; đây là một ẩn dụ về sự chinh phục dễ dàng hoặc bị nuốt chửng.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn theo nghĩa đen: “bóng của họ đã lìa khỏi trên họ.” Trong ngữ cảnh này, “bóng” có thể chỉ sự che chở hoặc nơi nương náu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Chỉ có điều
  rationale: Diễn đạt sắc thái giới hạn và nhấn mạnh của אַךְ, đồng thời nối tự nhiên với lời khuyên răn theo sau.
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: đừng nổi loạn chống lại Yahweh
  rationale: Với động từ מרד, giới từ ב chỉ Đấng bị chống nghịch; “nổi loạn chống lại” truyền đạt trực tiếp hành vi phản nghịch quyền cai trị.
- source_word: עַם הָאָרֶץ
  choice: dân trong xứ
  rationale: Giữ sát thành ngữ Hê-bơ-rơ nhưng vẫn tự nhiên trong tiếng Việt; ngữ cảnh cho thấy đây là cư dân của xứ Ca-na-an.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: vì chúng là bánh của chúng ta
  rationale: Giữ nguyên ẩn dụ ngắn gọn, mạnh mẽ của nguyên văn, không diễn giải quá mức thành hành động “nuốt chửng” hay kết quả chinh phục.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: Bóng che chở của chúng đã lìa khỏi chúng
  rationale: Giữ hình ảnh “bóng” của nguyên văn và làm rõ chức năng bảo vệ bằng cụm “bóng che chở”; “đã lìa khỏi” phản ánh động từ סָר.
- source_word: וַיהוָה אִתָּנוּ
  choice: còn Yahweh ở cùng chúng ta
  rationale: “Còn” diễn đạt sự tương phản rõ trong tiếng Việt giữa việc đối phương mất sự che chở và việc Israel có sự hiện diện của Yahweh, dù liên từ Hê-bơ-rơ tự thân là waw.
- source_word: תִּירְאוּ / תִּירָאֻם
  choice: đừng sợ / đừng sợ chúng
  rationale: Giữ nguyên cả hai mệnh lệnh cấm và sự lặp lại đầy nhấn mạnh ở cuối câu.
- source_word: יהוה
  choice: Yahweh
  rationale: Dùng cách phiên âm tên riêng giao ước trong nguyên văn, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Ẩn dụ chinh phục trong כִּי לַחְמֵנוּ הֵם
  choice: Giữ “chúng là bánh của chúng ta” trong chính văn
  alternative: “chúng là thức ăn của chúng ta” hoặc “chúng ta sẽ nuốt chửng chúng”
  rationale: Nguyên văn dùng một ẩn dụ hàm súc. Giữ hình ảnh “bánh” bảo toàn sức gợi và không quyết định thay độc giả chính xác ẩn dụ phải được khai triển thế nào.
- issue: Ý nghĩa của צִלָּם
  choice: “Bóng che chở của chúng”
  alternative: “bóng của chúng” hoặc “sự bảo vệ của chúng”
  rationale: Cách dịch này vừa bảo toàn hình ảnh “bóng” vừa giúp độc giả hiện đại nhận ra ý niệm che chở, mà không xác định nguồn của sự che chở ấy là thần linh, quân sự hay chính trị.
- issue: Sự hiện diện của Yahweh đối lập với sự che chở đã lìa khỏi dân trong xứ
  choice: Dùng “còn Yahweh ở cùng chúng ta”
  alternative: “và Yahweh ở cùng chúng ta”
  rationale: “Còn” làm rõ thế tương phản vốn có trong mạch lập luận nhưng không bổ sung tuyên bố thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “anh em” phù hợp với lời Giô-suê và Ca-lép nói với cộng đồng. Tên Yahweh được giữ như tên riêng; phép lặp “Đừng sợ chúng” ở cuối câu được bảo toàn để giữ sức nhấn mạnh của nguyên văn.
