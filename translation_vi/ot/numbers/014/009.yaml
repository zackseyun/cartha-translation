  to: Chỉ có điều, đừng nổi loạn chống lại Yahweh. Anh em cũng đừng sợ dân trong xứ, vì họ là bánh của chúng ta[a]. Sự che chở của họ đã lìa khỏi họ[b], và Yahweh ở cùng chúng ta. Đừng sợ họ.
