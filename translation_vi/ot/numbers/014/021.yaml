source:
  edition: WLC
  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: vi
  text: Nhưng thật như Ta hằng sống, vinh quang của Đức Giê-hô-va sẽ đầy khắp đất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khắp xứ,” vì từ Hê-bơ-rơ אֶרֶץ có thể chỉ “đất,” “xứ,” hoặc “trái đất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với lời đi trước bằng cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: חַי אָ֑נִי
  choice: thật như Ta hằng sống
  rationale: Giữ sắc thái công thức thề trang nghiêm của Đức Chúa Trời; thêm “thật” giúp câu tiếng Việt biểu đạt rõ lực xác quyết mà không biến lời thề thành một mệnh đề đơn thuần.
- source_word: וְיִמָּלֵא
  choice: sẽ đầy khắp
  rationale: Dạng Nifal có sắc thái kết quả/trạng thái đầy tràn; cách dịch này tự nhiên với chủ ngữ “vinh quang” và không ép động từ thành cấu trúc chủ động ngoại động.
- source_word: כְבוֹד
  choice: vinh quang
  rationale: Từ tương đương quen thuộc và thích hợp khi nói về sự uy nghi, hiện diện và danh tiếng của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển tải danh riêng giao ước YHWH bằng hình thức đã quen thuộc với độc giả Kinh Thánh tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: אֶת כָּל הָאָרֶץ
  choice: khắp đất
  rationale: “Khắp” diễn đạt toàn thể phạm vi; “đất” giữ được độ mở nghĩa của אֶרֶץ giữa “đất/đất đai” và “trái đất,” thay vì mặc nhiên giới hạn hoặc phổ quát hóa hoàn toàn.
theological_decisions:
- issue: Phạm vi của הָאָרֶץ
  choice: “khắp đất” trong chính văn
  alternative: “toàn cõi đất” hoặc “khắp trái đất”
  rationale: Danh từ אֶרֶץ có thể chỉ đất, xứ, hoặc toàn thể trái đất. Chính văn giữ cách diễn đạt rộng nhưng chưa khóa nghĩa; chú thích nêu khả năng địa phương để bảo tồn sự mơ hồ thật của tiếng Hê-bơ-rơ.
- issue: Quan hệ cú pháp của וְיִמָּלֵא với כְבוֹד יְהוָה
  choice: “vinh quang của Đức Giê-hô-va sẽ đầy khắp đất”
  alternative: “khắp đất sẽ đầy dẫy vinh quang của Đức Giê-hô-va”
  rationale: Trong tiếng Hê-bơ-rơ, “vinh quang của YHWH” đứng như chủ ngữ của động từ Nifal. Cách dịch đã chọn bảo toàn trật tự khái niệm và sắc thái đầy tràn, dù phương án bị động cũng có thể diễn đạt kết quả tương tự.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Cụm “thật như Ta hằng sống” giữ sắc thái lời thề; “đầy khắp đất” vừa tự nhiên vừa duy trì độ mở nghĩa của nguyên văn.
