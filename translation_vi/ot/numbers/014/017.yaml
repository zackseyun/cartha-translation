id: NUM.14.17
reference: Numbers 14:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: vi
  text: 'Và giờ đây, xin quyền năng của Chúa được tỏ ra lớn lao[a], đúng như Ngài đã phán rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xin quyền năng của Chúa được tôn cao” hoặc, sát từng chữ hơn, “xin quyền năng của Chúa nên lớn lao.”'
    reason: 'Bảo lưu các sắc thái có thể có của יִגְדַּל: trở nên lớn, được nhìn nhận là lớn, hoặc được tôn cao.'
lexical_decisions:
- source_word: וְעַתָּה
  choice: Và giờ đây
  rationale: Giữ cả liên từ וְ và dấu hiệu thời gian/diễn ngôn עַתָּה, đồng thời mở lời thỉnh cầu một cách tự nhiên trong tiếng Việt.
- source_word: יִגְדַּל נָא
  choice: xin ... được tỏ ra lớn lao
  rationale: Thể mệnh lệnh ước nguyện cùng tiểu từ khẩn cầu נָא được diễn đạt bằng “xin”. Cụm “được tỏ ra lớn lao” tự nhiên hơn “trở nên lớn” khi nói về quyền năng vốn có của Chúa, nhưng chú thích vẫn bảo lưu khả năng hiểu là “được tôn cao”.
- source_word: כֹּחַ
  choice: quyền năng
  rationale: Trong ngữ cảnh nói về khả năng hành động của Thiên Chúa trong cả phán xét lẫn thương xót, “quyền năng” phù hợp và trang trọng hơn “sức mạnh”.
- source_word: אֲדֹנָי
  choice: Chúa
  rationale: Đây là tước hiệu אֲדֹנָי chứ không phải danh YHWH; “Chúa” là cách dịch tự nhiên, không đồng nhất hai từ này.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn đạt rõ sự tương ứng giữa lời cầu xin của Môi-se và điều Chúa đã phán trước đó.
- source_word: דִּבַּרְתָּ
  choice: Ngài đã phán
  rationale: Động từ hoàn thành ngôi hai số ít chỉ lời Chúa đã nói và vẫn có hiệu lực; “đã phán” hợp với văn cảnh trang trọng.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Dùng từ dẫn và dấu hai chấm để tự nhiên mở sang nội dung lời phán ở câu tiếp theo.
theological_decisions:
- issue: Ý nghĩa của lời xin quyền năng Chúa “lớn lên”
  choice: được tỏ ra lớn lao
  alternative: được tôn cao; nên lớn lao
  rationale: Bản dịch chính tránh hàm ý quyền năng nội tại của Chúa trước đó còn thiếu hoặc cần gia tăng, nhưng không xác quyết một cách giải nghĩa rằng câu chỉ nói đến sự biểu lộ; chú thích bảo lưu khả năng dịch khác của גָּדַל.
- issue: Cách dịch tước hiệu אֲדֹנָי
  choice: Chúa
  alternative: Đức Chúa
  rationale: Giữ đây là tước hiệu dành cho Thiên Chúa mà không dùng quy ước dịch danh giao ước YHWH.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và phù hợp với lời cầu xin. “Ngài” được dùng làm đại từ kính xưng chỉ Chúa; dấu hai chấm cho thấy lời trích dẫn tiếp tục ở câu sau.
