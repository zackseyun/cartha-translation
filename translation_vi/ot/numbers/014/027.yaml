source:
  edition: WLC
  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: vi
  text: “Ta còn phải chịu đựng cộng đồng gian ác này[a], là những kẻ cứ than phiền nghịch lại Ta, cho đến bao giờ?[b] Ta đã nghe những lời than phiền của con cái Y-sơ-ra-ên[c], là những người cứ than phiền nghịch lại Ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hội chúng gian ác này.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn là một câu hỏi tỉnh lược: “Cho đến bao giờ đối với cộng đồng gian ác này…?” Động từ “chịu đựng” được bổ sung theo ngữ cảnh.'
    reason: source_ambiguity
  - marker: c
    text: Hay “dân Y-sơ-ra-ên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: cho đến bao giờ
  rationale: Cách hỏi tự nhiên trong tiếng Việt, giữ được sắc thái bức xúc và kéo dài của câu hỏi Hê-bơ-rơ.
- source_word: לָעֵדָה
  choice: cộng đồng
  rationale: עֵדָה chỉ tập thể dân Y-sơ-ra-ên được nhìn như một cộng đồng; “cộng đồng” hiện đại, rõ nghĩa và phù hợp văn cảnh.
- source_word: הָרָעָה הַזֹּאת
  choice: gian ác này
  rationale: רָעָה ở đây là sự đánh giá về đạo đức và thái độ phản nghịch, không chỉ có nghĩa là “xấu” hay “tồi tệ”.
- source_word: מַלִּינִים
  choice: cứ càu nhàu
  rationale: Động từ diễn tả việc than phiền bất mãn, lặp đi lặp lại và hướng nghịch lại Đức Chúa Trời; “cứ càu nhàu” truyền đạt cả tính tiếp diễn lẫn sắc thái phản kháng.
- source_word: עָלַי
  choice: chống lại Ta
  rationale: Giới từ עַל trong kết cấu này biểu thị lời than phiền hướng nghịch lại Đức Chúa Trời, mạnh hơn nghĩa trung tính “về Ta”.
- source_word: תְּלֻנּוֹת
  choice: những lời phàn nàn
  rationale: Danh từ chỉ những lời bất mãn được bày tỏ; cách dịch này tự nhiên trong tiếng Việt và phân biệt vừa đủ với động từ “càu nhàu”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ thành ngữ dòng dõi/tập thể của nguyên ngữ mà vẫn quen thuộc trong văn phong Kinh Thánh tiếng Việt; chú thích nêu cách diễn đạt tự nhiên hơn.
- source_word: שָׁמָעְתִּי
  choice: Ta đã nghe
  rationale: Thể hoàn thành Hê-bơ-rơ xác nhận Đức Chúa Trời thực sự đã nghe những lời phàn nàn và nay đáp lại.
theological_decisions:
- issue: Chủ thể và động từ được hiểu ngầm trong câu hỏi עַד מָתַי לָעֵדָה הָרָעָה הַזֹּאת
  choice: Ta còn phải chịu đựng cộng đồng gian ác này ... cho đến bao giờ?
  alternative: Cộng đồng gian ác này ... còn như thế cho đến bao giờ?
  rationale: Mệnh đề chính trong tiếng Hê-bơ-rơ là một câu hỏi tỉnh lược, không ghi rõ động từ. Bổ sung “phải chịu đựng” tạo câu tiếng Việt tự nhiên và phù hợp văn cảnh, nhưng chú thích công khai rằng từ này được hiểu ngầm để không che lấp tính tỉnh lược của nguyên văn.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: Cụm từ Hê-bơ-rơ có hình thức giống đực số nhiều nhưng thường là danh xưng tập thể của dân tộc. Bản dịch giữ lối nói truyền thống mà không khẳng định rằng câu chỉ nhắm đến nam giới; phương án tập thể tự nhiên hơn được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “Ta” thể hiện lời Đức Chúa Trời phán. Dấu gạch ngang ở câu thứ hai giúp giữ quan hệ lặp lại giữa danh từ “những lời phàn nàn” và động từ “càu nhàu” mà không tạo một mệnh đề quan hệ gượng gạo trong tiếng Việt.
