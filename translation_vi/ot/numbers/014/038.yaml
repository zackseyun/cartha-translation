  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/כָלֵ֖ב בֶּן יְפֻנֶּ֑ה חָיוּ֙ מִן הָ/אֲנָשִׁ֣ים הָ/הֵ֔ם הַֽ/הֹלְכִ֖ים לָ/ת֥וּר אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: vi
  text: Nhưng trong số những người đã đi do thám xứ[a], Giô-suê con trai Nun và Ca-lép con trai Giê-phu-nê vẫn còn sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khảo sát xứ” hoặc “trinh sát xứ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Nhưng… Giô-suê
  rationale: Liên từ ו được dịch là “Nhưng” để nêu bật sự tương phản với cái chết của những người do thám khác trong câu trước; tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: בִּן נוּן
  choice: con trai Nun
  rationale: Giữ nguyên cấu trúc chỉ quan hệ cha con; “Nun” là cách phiên âm ngắn gọn, rõ ràng của tên נוּן.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: và Ca-lép con trai Giê-phu-nê
  rationale: Liên từ phối hợp hai người sống sót; các tên riêng được phiên âm tự nhiên trong tiếng Việt.
- source_word: חָיוּ
  choice: vẫn còn sống
  rationale: 'Diễn đạt nghĩa “sống/còn sống” của חיה trong thế tương phản: hai người này không chết như những người kia. Cách dịch này ít diễn giải hơn “sống sót”.'
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: trong số những người
  rationale: מִן biểu thị hai người được tách ra như những ngoại lệ trong nhóm đã nêu; “trong số” tự nhiên và chính xác trong tiếng Việt.
- source_word: הַהֹלְכִים
  choice: đã đi
  rationale: Phân từ mô tả nhóm người ấy; “đã đi” phù hợp với điểm nhìn hồi thuật của câu chuyện.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: do thám xứ
  rationale: תור ở đây chỉ nhiệm vụ khảo sát/trinh sát Ca-na-an. “Do thám” phù hợp ngữ cảnh, còn “xứ” chỉ vùng đất đang được nói đến.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đưa cụm “trong số những người…” lên đầu để câu tự nhiên hơn, đồng thời vẫn giữ rõ sự tương phản và quan hệ giữa hai người còn sống với cả nhóm.
