  source_fidelity: 'Bản dịch chuyển đạt đúng các yếu tố của tiếng Hê-bơ-rơ: liên từ tương phản “Nhưng,” hai tên riêng và quan hệ cha-con, ý hai người này là ngoại lệ “trong số những người,” động từ חָיוּ là “vẫn còn sống,” cùng nhiệm vụ đã hoàn tất là đi do thám xứ. Việc đưa cụm “trong số những người...” lên đầu là đảo trật tự tự nhiên trong tiếng Việt, không làm thay đổi quan hệ nghĩa.'
