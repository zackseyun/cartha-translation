  terminology: Các tên Giô-suê, Ca-lép, Giê-phu-nê và Nun được phiên âm nhất quán theo lối Kinh Thánh tiếng Việt. “Xứ” là cách gọi phù hợp cho הָאָרֶץ trong văn cảnh này. Chú thích giữ được các khả năng từ vựng hợp lệ của לָתוּר mà không áp đặt một sắc thái duy nhất.
