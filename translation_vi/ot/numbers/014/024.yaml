  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: vi
  text: Nhưng vì tôi tớ Ta là Ca-lép có một tinh thần khác và hết lòng theo Ta[a], nên Ta sẽ đưa người vào miền đất mà người đã đến, và dòng dõi người sẽ chiếm hữu miền đất ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn là một thành ngữ Hê-bơ-rơ, sát chữ: “làm đầy theo sau Ta”, nghĩa là theo Đức Giê-hô-va cách trọn vẹn hoặc hết lòng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dòng dõi người sẽ thừa hưởng miền đất ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי כָלֵב
  choice: Nhưng ... tôi tớ Ta là Ca-lép
  rationale: Liên từ được hiểu theo nghĩa tương phản với thế hệ không tin ở văn cảnh trước. “Tôi tớ” diễn đạt tự nhiên địa vị phục vụ trung thành đối với Đức Chúa Trời; tên riêng dùng dạng Việt hóa quen thuộc “Ca-lép”.
- source_word: עֵקֶב
  choice: vì ... nên
  rationale: Cấu trúc nhân quả tiếng Việt làm rõ lòng trung thành của Ca-lép là lý do cho lời hứa tiếp theo mà không thay đổi quan hệ cú pháp của nguyên văn.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: có một tinh thần khác
  rationale: “Tinh thần” giữ được độ rộng nghĩa của רוּחַ, có thể chỉ tinh thần, tâm thế hoặc thái độ; “khác” nêu sự tương phản với dân chúng mà không đồng nhất rõ ràng với Đức Thánh Linh.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: hết lòng theo Ta
  rationale: Đây là thành ngữ Hê-bơ-rơ, sát chữ là “làm đầy theo sau Ta”; “hết lòng theo Ta” truyền đạt tự nhiên ý theo trọn vẹn và trung thành.
- source_word: וַהֲבִיאֹתִיו
  choice: Ta sẽ đưa người
  rationale: Dạng hoàn thành liên kết trong lời tuyên bố của Đức Chúa Trời mang ý nghĩa hành động tương lai chắc chắn. “Người” là đại từ trang trọng, phù hợp để chỉ Ca-lép.
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: vào miền đất mà người đã đến
  rationale: Giữ động từ chuyển động בוא và việc Ca-lép từng đến miền đất ấy khi đi do thám; cách diễn đạt này tự nhiên hơn lối dịch sát “đến đó” trong tiếng Việt.
- source_word: וְזַרְעוֹ יוֹרִשֶׁנָּה
  choice: và dòng dõi người sẽ chiếm hữu miền đất ấy
  rationale: “Dòng dõi” diễn đạt nghĩa tập thể của זֶרַע. “Chiếm hữu” thể hiện nghĩa ירשׁ trong bối cảnh nhận và sở hữu đất; lặp “miền đất ấy” giúp đại từ rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “một tinh thần khác” nơi Ca-lép
  choice: Giữ cụm từ rộng nghĩa “một tinh thần khác”, có thể nói đến tinh thần, tâm thế hoặc thái độ trung tín khác với dân chúng.
  alternative: “có một thái độ khác” hoặc hiểu là Thần của Đức Chúa Trời ở cùng người cách đặc biệt
  rationale: רוּחַ có nhiều nét nghĩa, và câu này không xác định rõ Đức Thánh Linh là đối tượng được nói đến. Bản dịch không thu hẹp sự mơ hồ thần học chính đáng của nguyên văn.
- issue: Mức độ Ca-lép theo Đức Chúa Trời
  choice: “hết lòng theo Ta”
  alternative: “hoàn toàn theo Ta”
  rationale: Thành ngữ מלא אחרי nói đến sự theo trọn vẹn, trung thành. “Hết lòng” tự nhiên trong tiếng Việt nhưng vẫn không hàm ý Ca-lép tuyệt đối vô tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ta” vì đây là lời Đức Chúa Trời tự xưng; tránh gọi đích danh Đức Thánh Linh khi nguyên văn chỉ dùng רוּחַ. Các dấu chú thích [a], [b] đều được đặt ngay sau nội dung liên quan trong chính văn.
