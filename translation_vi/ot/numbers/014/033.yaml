base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: vi
  text: Còn các con trai của các ngươi sẽ chăn bầy[a] trong hoang mạc suốt bốn mươi năm và sẽ gánh lấy sự bất trung như ngoại tình của các ngươi[b], cho đến khi xác các ngươi không còn nữa trong hoang mạc.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sống lang thang”. Từ Hê-bơ-rơ có nghĩa trực tiếp là chăn dắt hoặc chăn thả, nhưng ở đây có thể nhấn mạnh đời sống phiêu bạt trong hoang mạc.
    reason: lexical_alternative
  - marker: b
    text: Nguyên ngữ dùng một từ có thể dịch là “sự dâm loạn” hoặc “sự ngoại tình”, lấy hình ảnh bất trung trong quan hệ vợ chồng để nói về sự bất trung với giao ước.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “cho đến khi xác các ngươi tiêu tan trong hoang mạc”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: Còn các con trai của các ngươi
  rationale: Giữ nghĩa thông thường của danh từ số nhiều giống đực בנים là “các con trai”; “còn” nối lời phán này với số phận của thế hệ cha mẹ trong ngữ cảnh.
- source_word: רֹעִים
  choice: làm người chăn dắt
  rationale: Giữ trường nghĩa trực tiếp của רעה là chăn dắt/chăn thả, đồng thời diễn đạt tự nhiên hơn trong tiếng Việt so với danh ngữ “là những người chăn”.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: “Hoang mạc” chỉ vùng hoang vu, ít dân, phù hợp với מִדְבָּר và không giới hạn vào sa mạc cát.
- source_word: אַרְבָּעִים שָׁנָה
  choice: suốt bốn mươi năm
  rationale: Diễn đạt rõ khoảng thời gian kéo dài được lời phán ấn định.
- source_word: וְנָשְׂאוּ
  choice: và sẽ gánh lấy
  rationale: Giữ hình ảnh “mang/gánh” của נשא cùng ý chịu hậu quả nặng nề.
- source_word: אֶת זְנוּתֵיכֶם
  choice: sự bất trung như ngoại tình của các ngươi
  rationale: “Bất trung” phù hợp với sự phản nghịch giao ước trong ngữ cảnh, còn “như ngoại tình” giữ hình ảnh tính dục mạnh của זְנוּת thay vì làm phẳng ẩn dụ.
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: cho đến khi xác các ngươi không còn nữa
  rationale: Diễn đạt sự chấm dứt hoàn toàn của thế hệ bị kết án; “xác” giữ sắc thái nghiêm khắc của פגר mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: זְנוּתֵיכֶם nói về hành vi tình dục theo nghĩa đen hay sự bất trung với giao ước bằng hình ảnh tình dục
  choice: sự bất trung như ngoại tình của các ngươi
  alternative: sự dâm loạn của các ngươi; sự bất trung của các ngươi
  rationale: Ngữ cảnh trực tiếp là dân Y-sơ-ra-ên phản nghịch Đức Chúa Trời. Cách dịch đã chọn vừa tránh giới hạn câu vào tội tình dục theo nghĩa đen, vừa không xóa bỏ hình ảnh ngoại tình trong từ Hê-bơ-rơ.
- issue: רֹעִים nên được hiểu trực tiếp là người chăn dắt hay diễn giải là người lang thang
  choice: làm người chăn dắt
  alternative: lang thang
  rationale: Động từ Hê-bơ-rơ trực tiếp thuộc trường nghĩa chăn dắt/chăn thả. Cuộc sống phiêu bạt là hệ quả có thể được hàm ý, nhưng không nên thay thế nghĩa từ vựng trong chính văn.
- issue: Mối liên hệ giữa tội của cha mẹ và điều các con trai phải gánh
  choice: Giữ thành ngữ “gánh lấy” mà không giải thích đó là gánh tội hay gánh hậu quả
  alternative: chịu hậu quả vì sự bất trung của các ngươi
  rationale: נשא cho phép sức căng giữa việc mang gánh nặng và chịu hậu quả. Chính văn không nên tự ý giải quyết chi tiết thần học mà câu Hê-bơ-rơ để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “các ngươi” duy trì lời phán trực tiếp, nghiêm nghị dành cho cả cộng đồng. Cụm “bất trung như ngoại tình” được dùng để giữ đồng thời ý nghĩa giao ước và ẩn dụ tính dục của nguyên ngữ; các phương án sát chữ hơn được ghi ở chú thích.
