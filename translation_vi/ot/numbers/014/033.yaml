revisions:
- from: Còn các con trai của các ngươi sẽ làm người chăn dắt[a] trong hoang mạc suốt bốn mươi năm và sẽ gánh lấy sự bất trung như ngoại tình của các ngươi[b], cho đến khi xác các ngươi không còn nữa trong hoang mạc.[c]
  to: Còn các con trai của các ngươi sẽ chăn bầy[a] trong hoang mạc suốt bốn mươi năm và sẽ gánh lấy sự bất trung như ngoại tình của các ngươi[b], cho đến khi xác các ngươi không còn nữa trong hoang mạc.[c]
  rationale: Chỉ thay “sẽ làm người chăn dắt” bằng “sẽ chăn bầy” để tiếng Việt tự nhiên và rõ hơn. Cách sửa vẫn phản ánh trực tiếp nghĩa chăn thả/chăn bầy của רֹעִים và giữ chú thích về khả năng hiểu theo nghĩa “sống lang thang”. Không thay đổi các quyết định về thuật ngữ hay ý nghĩa thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:26:19Z'
