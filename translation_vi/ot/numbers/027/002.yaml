source:
  edition: WLC
  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: vi
  text: 'Họ đứng trước mặt Môi-se, trước mặt thầy tế lễ Ê-lê-a-sa, trước mặt các thủ lãnh và toàn thể hội chúng, tại lối vào Lều Hội Kiến, và nói rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: Họ đến đứng
  rationale: Động từ עמד ở dạng kể chuyện ngôi thứ ba số nhiều giống cái diễn tả các con gái đến trình diện và đứng trong một khung cảnh công khai, pháp lý. “Đến đứng” tự nhiên trong tiếng Việt và giữ được hành động trang trọng, không diễn giải quá mức.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Cách dịch trực tiếp, tự nhiên, đồng thời giữ phép lặp nhằm nhấn mạnh những người có thẩm quyền mà họ trình diện.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: thầy tế lễ Ê-lê-a-sa
  rationale: Giữ đúng chức danh đơn giản “thầy tế lễ”; không thêm “thượng tế,” vì nguyên văn không có từ ấy.
- source_word: הַנְּשִׂיאִם
  choice: các thủ lãnh
  rationale: נְשִׂיאִים chỉ những người đứng đầu cộng đồng hoặc bộ tộc. “Các thủ lãnh” vừa trang trọng vừa không gợi nghĩa hoàng tộc như “các hoàng tử.”
- source_word: כָל הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה trong Dân Số Ký thường chỉ cộng đồng giao ước được tập hợp; “hội chúng” giữ được sắc thái cộng đồng, còn “toàn thể” thể hiện כָּל.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: “Lối vào” diễn đạt tự nhiên vị trí פֶּתַח; “Lều Hội Kiến” là tên gọi trang trọng, rõ nghĩa của אֹהֶל מוֹעֵד.
- source_word: לֵאמֹר
  choice: 'và nói rằng:'
  rationale: Công thức này mở đầu lời nói trực tiếp ở câu tiếp theo. Trong tiếng Việt, “và nói rằng:” tự nhiên hơn phân từ kiểu “mà rằng,” đồng thời vẫn nối câu với lời phát biểu kế tiếp.
theological_decisions:
- issue: Bối cảnh công khai và pháp lý của lời thỉnh cầu
  choice: Giữ phép lặp “trước mặt” và liệt kê đầy đủ Môi-se, thầy tế lễ Ê-lê-a-sa, các thủ lãnh và toàn thể hội chúng
  alternative: Rút gọn danh sách thành một lời tóm lược trôi chảy hơn
  rationale: Cấu trúc nguyên văn nhấn mạnh rằng các phụ nữ trình bày vụ việc công khai trước giới lãnh đạo và cộng đồng; giữ nguyên cấu trúc bảo toàn sức nặng pháp lý và cộng đồng.
- issue: Cách dịch עֵדָה
  choice: hội chúng
  alternative: cộng đồng; đại hội
  rationale: “Hội chúng” bảo toàn sắc thái cộng đồng dân giao ước trong Ngũ Kinh mà không thêm một khẳng định giáo phái nào.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ nhịp liệt kê cùng phép lặp của nguyên văn khi điều đó chuyên chở sắc thái pháp lý; tên riêng được phiên âm theo lối Kinh Thánh Việt ngữ quen dùng. Không dùng chú thích vì các phương án từ vựng không tạo ra sự mơ hồ thiết yếu cần đưa vào bản văn xuất bản.
