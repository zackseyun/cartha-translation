revisions:
- from: 'Ngươi phải nói với con cái Y-sơ-ra-ên[a] rằng: ‘Nếu một người nam chết mà không có con trai, thì các ngươi phải chuyển phần gia nghiệp của người ấy cho con gái người ấy.’'
  to: 'Hãy nói với con cháu Y-sơ-ra-ên[a] rằng: ‘Nếu một người nam chết mà không có con trai, thì các ngươi phải chuyển phần thừa kế của người ấy cho con gái người ấy.’'
  rationale: 'Bản sửa dùng cách diễn đạt hiện đại và rõ nghĩa hơn trong văn cảnh luật pháp, đồng thời giữ các phân biệt quan trọng của nguyên ngữ: người nam/con trai/con gái, tính điều kiện của trường hợp, và sự chuyển quyền thừa kế. Cấu trúc mệnh lệnh đầu câu không nêu chủ ngữ tránh đại từ cổ mà vẫn tương ứng với ngôi số ít; “các ngươi” giữ số nhiều ở mệnh đề cuối.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:35:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc pháp lý chủ yếu của tiếng Hê-bơ-rơ: điều kiện người nam chết không có con trai, rồi quyền thừa kế được chuyển cho con gái. Việc phân biệt mệnh lệnh số ít ở đầu câu với động từ số nhiều ở mệnh đề sau cũng có cơ sở trong bản gốc. Tuy nhiên, “con cái Y-sơ-ra-ên” không phản ánh rõ dạng giống đực số nhiều בְּנֵי (“con trai”) mà chú thích lại nêu; cách diễn đạt này cũng kém tự nhiên trong tiếng Việt hiện đại. “Phần gia nghiệp” có thể hiểu theo nghĩa sự nghiệp gia đình hơn là quyền/tài sản thừa kế theo luật.'
  naturalness: “Ngươi” và “các ngươi” tạo sắc thái cổ, không phù hợp nhất với tiếng Việt chuẩn hiện đại. Có thể giữ sự phân biệt số ít/số nhiều của nguyên ngữ bằng mệnh lệnh không nêu chủ ngữ ở đầu câu và “các ngươi” ở quy định tiếp theo. “Phần thừa kế” rõ ràng, tự nhiên trong văn cảnh pháp lý.
  terminology: Dùng “con cháu Y-sơ-ra-ên” làm cách gọi tập thể tự nhiên trong văn bản chính; chú thích ghi nghĩa đen “các con trai của Y-sơ-ra-ên,” đồng thời nêu phương án “người Y-sơ-ra-ên.” Giữ “người nam,” “con trai,” “con gái,” và “phần thừa kế” để bảo toàn các nét pháp lý và giới tính trong tiếng Hê-bơ-rơ.
  issues:
  - severity: medium
    issue: Cách xưng hô “Ngươi ... các ngươi” mang sắc thái cổ.
    rationale: Bản dịch nhắm tiếng Việt chuẩn hiện đại; việc lược chủ ngữ ở mệnh lệnh đầu vẫn phù hợp ngôi số ít của תְּדַבֵּר, còn “các ngươi” giữ được số nhiều của וְהַעֲבַרְתֶּם.
  - severity: low
    issue: “Con cái Y-sơ-ra-ên” không nhất quán với chú thích về nghĩa đen của בְּנֵי.
    rationale: בְּנֵי có nghĩa đen là “các con trai”; “con cháu Y-sơ-ra-ên” là cách gọi cộng đồng tự nhiên hơn trong tiếng Việt, với chú thích bảo lưu dạng nghĩa đen.
  - severity: medium
    issue: “Phần gia nghiệp” có thể không rõ nghĩa pháp lý của נַחֲלָה.
    rationale: Trong điều luật thừa kế, “phần thừa kế” truyền đạt trực tiếp hơn quyền/tài sản được chuyển giao.
