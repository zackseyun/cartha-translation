  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֣ישׁ כִּֽי יָמ֗וּת וּ/בֵן֙ אֵ֣ין ל֔/וֹ וְ/הַֽעֲבַרְתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/בִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: vi
  text: 'Hãy nói với con cháu Y-sơ-ra-ên[a] rằng: ‘Nếu một người nam chết mà không có con trai, thì các ngươi phải chuyển phần thừa kế của người ấy cho con gái người ấy.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người Y-sơ-ra-ên.” Tiếng Hê-bơ-rơ sát nghĩa là “các con trai của Y-sơ-ra-ên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל בְּנֵי יִשְׂרָאֵל
  choice: với con cái Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai/con cái của Y-sơ-ra-ên”; cách dịch truyền thống nhưng vẫn dễ hiểu này giữ hình ảnh gia tộc, đồng thời trong tiếng Việt có thể chỉ toàn thể cộng đồng.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: phải nói ... rằng
  rationale: Diễn đạt tự nhiên công thức dẫn lời דבר + לאמר, đồng thời giữ sắc thái mệnh lệnh của thể chưa hoàn thành trong ngữ cảnh luật pháp.
- source_word: אִישׁ
  choice: một người nam
  rationale: Giữ rõ hình thức giống đực số ít của điều luật và phù hợp với trường hợp thừa kế đang được quy định.
- source_word: כִּי יָמוּת
  choice: nếu ... chết
  rationale: כִּי trong luật tình huống mở đầu một giả định pháp lý; “nếu” là cách diễn đạt tự nhiên và chính xác.
- source_word: וּבֵן אֵין לוֹ
  choice: mà không có con trai
  rationale: Diễn đạt tự nhiên cấu trúc “không có con trai cho người ấy,” vẫn giữ trọng tâm là không có người con trai thừa kế.
- source_word: וְהַעֲבַרְתֶּם
  choice: các ngươi phải chuyển
  rationale: Thể Hiphil của עבר ở đây chỉ việc làm cho quyền sở hữu gia nghiệp được chuyển sang người khác; “chuyển” phù hợp văn cảnh pháp lý.
- source_word: נַחֲלָתוֹ
  choice: phần gia nghiệp của người ấy
  rationale: נַחֲלָה chỉ phần tài sản hoặc đất đai thuộc quyền thừa kế; “gia nghiệp” giữ được sắc thái di sản gia tộc.
- source_word: לְבִתּוֹ
  choice: cho con gái người ấy
  rationale: Giới từ לְ đánh dấu người nhận gia nghiệp; lối diễn đạt này rõ ràng, tự nhiên và tránh đại từ gây mơ hồ.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “ngươi/các ngươi” để phân biệt Môi-se, người được truyền lệnh ở số ít, với cộng đồng thi hành quy định ở số nhiều; dùng “người ấy” thay cho chuỗi đại từ để câu rõ nghĩa.
