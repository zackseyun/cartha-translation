revisions:
- from: Tại sao tên của cha chúng tôi lại bị xóa khỏi thị tộc của ông chỉ vì ông không có con trai? Xin ban cho chúng tôi một phần sản nghiệp giữa các anh em của cha chúng tôi.[a][b]
  to: Tại sao tên của cha chúng tôi lại bị mất khỏi thị tộc của ông vì ông không có con trai? Xin ban cho chúng tôi một phần sản nghiệp giữa các anh em của cha chúng tôi.[a][b]
  rationale: Bỏ “chỉ” để không thêm một giới hạn không được nêu rõ trong nguyên văn. Thay “bị xóa khỏi” bằng “bị mất khỏi” để giữ biên độ nghĩa của נִגְרַע—mất đi, suy giảm, hoặc bị loại—mà không gợi cụ thể việc xóa tên khỏi hồ sơ. Các phần còn lại được giữ nguyên vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:35:35Z'
