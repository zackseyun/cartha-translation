  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: vi
  text: Tại sao tên của cha chúng tôi lại bị mất khỏi thị tộc của ông vì ông không có con trai? Xin ban cho chúng tôi một phần sản nghiệp giữa các anh em của cha chúng tôi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “bị giảm đi” hoặc “bị loại khỏi”. Tiếng Hê-bơ-rơ hỏi tại sao “tên” của người cha lại phải mất khỏi thị tộc vì ông không có con trai.
    reason: lexical_alternative
  - marker: b
    text: “Phần sản nghiệp” là phần đất sở hữu hoặc phần đất thừa kế được phân trong thị tộc.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: Tại sao ... lại
  rationale: Diễn đạt tự nhiên câu hỏi phản biện trong tiếng Việt, giữ sắc thái phản đối hàm ý.
- source_word: יִגָּרַע
  choice: bị xóa khỏi
  rationale: Động từ Niphal ở đây nói đến việc tên người cha không còn được duy trì trong cơ cấu thị tộc và quyền thừa kế; cách dịch này truyền đạt sự mất đi mà không giải thích quá mức.
- source_word: שֵׁם
  choice: tên
  rationale: Giữ nguyên hình ảnh và thành ngữ Hê-bơ-rơ về việc tên người cha tiếp tục tồn tại trong thị tộc.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: khỏi thị tộc của ông
  rationale: Trong bối cảnh phân chia đất theo bộ tộc, מִשְׁפָּחָה chỉ nhóm thân tộc rộng hơn gia đình hạt nhân; “thị tộc” phù hợp hơn “gia đình”.
- source_word: כִּי אֵין לוֹ בֵּן
  choice: chỉ vì ông không có con trai
  rationale: Giữ cấu trúc hiện tại của nguyên văn và thuật ngữ giới tính cụ thể; “chỉ vì” làm rõ sắc thái phản biện của câu hỏi mà không đổi lý do được nêu.
- source_word: תְּנָה לָּנוּ
  choice: Xin ban cho chúng tôi
  rationale: Giữ lời cầu xin trực tiếp nhưng dùng “xin” để thể hiện giọng thỉnh nguyện trang trọng, tự nhiên trong tiếng Việt.
- source_word: אֲחֻזָּה
  choice: một phần sản nghiệp
  rationale: Chỉ phần đất được nắm giữ hoặc phân cấp trong cơ cấu thừa kế; “phần sản nghiệp” vừa tự nhiên vừa giữ sắc thái pháp lý về đất đai.
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: giữa các anh em của cha chúng tôi
  rationale: Giữ cách gọi nam giới cụ thể của nguyên văn, tức các anh em trai của người cha trong dòng họ nội.
theological_decisions:
- issue: Ngôn ngữ thừa kế có giới tính cụ thể
  choice: con trai / các anh em của cha
  alternative: con cái / họ hàng
  rationale: Nguyên văn dùng các danh từ nam giới vì vấn đề pháp lý liên quan đến quyền thừa kế qua con trai và phần đất giữa các anh em của người cha; không trung tính hóa các thuật ngữ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ câu hỏi phản biện cùng lời thỉnh cầu trực tiếp; bảo tồn hình ảnh “tên” và các thuật ngữ thân tộc nam giới của nguyên văn.
