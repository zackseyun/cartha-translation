  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: vi
  text: Vậy, Môi-se đem vụ việc của họ ra trước Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trình vụ việc pháp lý của họ trước Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: trình ... lên
  rationale: Dạng Hiphil của קרב mang nghĩa đem đến gần hoặc trình lên. Trong bối cảnh pháp lý, “trình ... lên” diễn đạt tự nhiên việc Môi-se chính thức đưa vấn đề ra để Đức Chúa Trời phán quyết.
- source_word: מִשְׁפָּטָן
  choice: vụ việc của họ
  rationale: מִשְׁפָּט có thể chỉ sự xét xử, phán quyết, quyền lợi pháp lý hoặc một vụ việc. Ở đây từ này nói đến vấn đề pháp lý của các con gái Xê-lô-phê-hát; “vụ việc của họ” vừa tự nhiên vừa giữ được phạm vi nghĩa rộng hơn “đơn kiện”.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Cụm này có nghĩa là “trước” hoặc “trong sự hiện diện của”; “trước mặt” phù hợp với việc trình một vụ việc lên Đấng có thẩm quyền phán quyết.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là dạng danh xưng quen thuộc, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: וַ
  choice: Vậy
  rationale: Liên từ tiếp nối câu chuyện và nêu kết quả từ lời thỉnh cầu ở các câu trước; “Vậy” diễn đạt tự nhiên quan hệ này.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản dịch giữ đây là danh riêng chứ không thay bằng “CHÚA”. Dạng phát âm cổ không chắc chắn tuyệt đối; “Đức Giê-hô-va” được chọn vì quen thuộc và trang trọng trong tiếng Việt, còn chú thích nêu dạng chuyển tự phổ biến trong nghiên cứu hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn. “Trình vụ việc ... lên” giữ sắc thái pháp lý mà không quá chuyên môn; “trước mặt” phản ánh sát thành ngữ Hê-bơ-rơ.
