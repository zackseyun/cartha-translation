source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: vi
  text: 'Rồi Đức Giê-hô-va phán với Môi-se: “Hãy lên ngọn núi A-ba-rim này[a] và nhìn xem miền đất mà Ta đã ban cho các con trai của Y-sơ-ra-ên[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “núi của A-ba-rim”; cũng có thể dịch: “núi thuộc dãy A-ba-rim.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; cụm từ này cũng có thể dịch là “dân Y-sơ-ra-ên” hoặc “người Y-sơ-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh giao ước đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: וַ־ tiếp nối diễn tiến câu chuyện; “rồi” tự nhiên trong lời kể, còn “phán” phù hợp khi Đức Chúa Trời nói.
- source_word: עֲלֵה
  choice: Hãy lên
  rationale: Truyền đạt trực tiếp mệnh lệnh và chuyển động đi lên của động từ עלה.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: ngọn núi A-ba-rim này
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ địa danh עֲבָרִים bằng phiên âm và giữ đại từ chỉ định “này”; chú thích bảo lưu cấu trúc sát chữ.
- source_word: וּרְאֵה
  choice: và nhìn xem
  rationale: “Nhìn xem” diễn đạt hành động quan sát miền đất được chỉ cho Môi-se, với sắc thái trang trọng nhưng vẫn dễ hiểu.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Trong bối cảnh lời hứa, אֶרֶץ chỉ vùng đất được ban; “miền đất” tự nhiên và cụ thể hơn “đất” đứng riêng.
- source_word: נָתַתִּי
  choice: Ta đã ban
  rationale: Thể hoàn thành được giữ bằng “đã ban”, diễn tả sự ban cấp được xác lập; “ban” phù hợp với hành động của Đức Chúa Trời.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con dân Y-sơ-ra-ên
  rationale: Đây là thành ngữ chỉ cộng đồng hậu duệ/dân tộc Y-sơ-ra-ên. “Con dân” vừa giữ ý niệm dòng dõi của בְּנֵי vừa tự nhiên hơn cách dịch máy móc “các con trai”; chú thích nêu các khả năng khác.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Hằng Hữu; CHÚA
  rationale: Giữ danh riêng bằng hình thức phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, không thay danh ấy bằng một tước hiệu; “Đức” là yếu tố kính ngữ tiếng Việt.
- issue: Phạm vi của לִבְנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Trong ngữ cảnh này, cụm từ là tên gọi tập thể của cộng đồng giao ước, không chỉ những người nam. “Con dân” bảo lưu liên hệ hậu duệ mà không thu hẹp đối tượng; chú thích duy trì độ minh bạch về hình thức Hê-bơ-rơ.
- issue: Giá trị của thể hoàn thành נָתַתִּי
  choice: đã ban
  alternative: ban; đã trao
  rationale: Giữ hình thức hoàn thành của nguyên văn và tính xác quyết của sự ban đất, nhưng không thêm một cách giải thích thần học về thời điểm hoàn tất.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng “Ta” trong lời Đức Giê-hô-va và “phán” cho lời Ngài. Các địa danh và tên riêng theo dạng phiên âm quen thuộc trong tiếng Việt; mọi dấu chú thích đều xuất hiện trong chính văn.
