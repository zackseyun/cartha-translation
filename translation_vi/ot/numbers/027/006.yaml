base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/006.yaml
  text: Then Yahweh said to Moses[a], saying,
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Dạng waw-consecutive tiếp nối mạch kể. Trong tiếng Việt, không nhất thiết phải thêm “rồi”; ngữ cảnh tự thể hiện trình tự. “Phán” là cách nói trang trọng, tự nhiên khi Đức Chúa Trời truyền lời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Phiên âm danh riêng YHWH theo cách gọi quen thuộc, trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: Diễn đạt tự nhiên công thức nói với một người; מֹשֶׁה được phiên âm theo hình thức tiếng Việt thông dụng.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này giới thiệu nội dung lời phán ở câu kế tiếp; “rằng” vừa phản ánh chức năng ấy vừa tự nhiên hơn kiểu dịch sát “mà rằng”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng thay vì thay bằng tước hiệu; dùng dạng phiên âm đã quen thuộc trong tiếng Việt phổ thông và có sắc thái trang trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn lời bằng “rằng:” để phản ánh לֵאמֹר và báo trước lời trực tiếp ở câu kế tiếp.
