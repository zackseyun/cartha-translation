language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תִּקְרַ֜בְנָה בְּנ֣וֹת צְלָפְחָ֗ד בֶּן חֵ֤פֶר בֶּן גִּלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה נֹעָ֔ה וְ/חָגְלָ֥ה וּ/מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: vi
  text: Bấy giờ, các con gái của Xê-lô-phê-hát, con trai Hê-phe, con trai Ghi-lê-át, con trai Ma-ki, con trai Ma-na-se, thuộc các thị tộc của Ma-na-se, con trai Giô-sép, đã đến gần.[a] Tên các con gái ông là Mác-la, Nô-a,[b] Hốc-la, Minh-ca và Tiệt-sa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiến đến” hoặc “bước tới”. Cách nói này có thể gợi ý rằng họ bước ra để chính thức thỉnh nguyện, như các câu sau thuật lại.
    reason: lexical_alternative
  - marker: b
    text: Nô-a ở đây là tên một người con gái của Xê-lô-phê-hát, không phải Nô-ê, người nam được nhắc đến trước đó trong sách Sáng Thế.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: tiến đến
  rationale: Động từ Qal wayyiqtol ngôi 3 số nhiều giống cái của קרב diễn tả họ đến gần, bước ra trình diện trước nhà chức trách; “tiến đến” tự nhiên trong tiếng Việt và không nói rõ đối tượng khi câu Hê-bơ-rơ chưa nêu.
- source_word: בְּנוֹת
  choice: các con gái của
  rationale: Cấu trúc sở hữu với tên người cha chỉ các con gái ruột, điều được xác nhận bởi danh sách tên ngay sau đó.
- source_word: בֶּן חֵפֶר בֶּן גִּלְעָד בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: con trai Hê-phe, cháu Ghi-lê-át, chắt Ma-ki, thuộc dòng Ma-na-se
  rationale: Tiếng Việt không tự nhiên nếu lặp “con trai” cho mọi thế hệ; cách diễn đạt này vẫn bảo toàn chuỗi phả hệ và không khẳng định Ma-na-se là người cha trực tiếp của Ma-ki.
- source_word: לְמִשְׁפְּחֹת
  choice: từ các thị tộc của
  rationale: מִשְׁפָּחָה trong bối cảnh bộ tộc-phả hệ chỉ đơn vị “thị tộc”; giới từ לְ biểu thị sự thuộc về hoặc liên hệ.
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: Ma-na-se con trai Giô-sép
  rationale: Giữ nguyên mối liên hệ phả hệ với Giô-sép như nguồn Hê-bơ-rơ.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Tên các con gái ông là
  rationale: Chuyển công thức giới thiệu danh sách sang cách nói tiếng Việt tự nhiên, với “ông” quy chiếu về Xê-lô-phê-hát.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: Mác-la, Nô-a, Hốc-la, Minh-ca và Tiệt-sa
  rationale: Phiên âm các tên riêng theo lối đọc gần âm Hê-bơ-rơ, dùng chính tả tiếng Việt dễ đọc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chuỗi phả hệ được diễn đạt theo quan hệ thế hệ tự nhiên trong tiếng Việt, còn thuật ngữ “thị tộc” giữ sắc thái xã hội-bộ tộc. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
