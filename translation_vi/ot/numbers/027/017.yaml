id: NUM.27.17
reference: Numbers 27:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֲשֶׁר יֵצֵ֣א לִ/פְנֵי/הֶ֗ם וַ/אֲשֶׁ֤ר יָבֹא֙ לִ/פְנֵי/הֶ֔ם וַ/אֲשֶׁ֥ר יוֹצִיאֵ֖/ם וַ/אֲשֶׁ֣ר יְבִיאֵ֑/ם וְ/לֹ֤א תִהְיֶה֙ עֲדַ֣ת יְהוָ֔ה כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: vi
  text: là người sẽ đi ra trước họ và đi vào trước họ,[a] sẽ dẫn họ ra và đưa họ vào,[b] để cộng đồng của Yahweh không như đàn chiên không có người chăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “đi ra phía trước họ và đi vào phía trước họ”, nhấn mạnh người ấy đi đầu dân chúng.
    reason: lexical_alternative
  - marker: b
    text: Chuỗi “đi ra… đi vào… dẫn họ ra… đưa họ vào” là lối diễn đạt Hê-bơ-rơ về sự lãnh đạo dân chúng trong mọi hoạt động.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: là người sẽ
  rationale: Mở đầu mệnh đề quan hệ mô tả người lãnh đạo được cầu xin ở câu trước; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: יֵצֵא ... יָבֹא
  choice: đi ra ... đi vào
  rationale: Giữ nguyên cặp động từ chuyển động cụ thể và tính bao quát của lối nói Hê-bơ-rơ, thay vì diễn giải thành một khái niệm cai trị trừu tượng.
- source_word: לִפְנֵיהֶם
  choice: trước họ
  rationale: Phản ánh nghĩa đen 'trước mặt họ', đồng thời hàm ý người lãnh đạo đi đầu.
- source_word: יוֹצִיאֵם ... יְבִיאֵם
  choice: dẫn họ ra ... đưa họ vào
  rationale: Thể hiện dạng sai khiến của hai động từ; 'dẫn' đặc biệt phù hợp với vai trò lãnh đạo và hình ảnh người chăn ở cuối câu.
- source_word: עֲדַת יְהוָה
  choice: cộng đồng của Yahweh
  rationale: עֵדָה chỉ tập thể dân giao ước; 'cộng đồng' là từ hiện đại, dễ hiểu và không giới hạn vào một buổi hội họp.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản văn Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: כַצֹּאן
  choice: như đàn chiên
  rationale: Danh từ số ít mang nghĩa tập hợp được chuyển thành 'đàn chiên', tự nhiên trong tiếng Việt và chuẩn bị cho hình ảnh người chăn.
- source_word: רֹעֶה
  choice: người chăn
  rationale: Giữ nguyên ẩn dụ chăn chiên về sự lãnh đạo, không đưa thuật ngữ chức vụ giáo hội về sau vào bản văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản văn dùng trực tiếp danh giao ước; phiên âm giữ đây là danh riêng thay vì biến thành tước hiệu.
- issue: Ý nghĩa chuỗi 'đi ra, đi vào, dẫn ra, đưa vào'
  choice: Giữ nguyên hình ảnh chuyển động cụ thể
  alternative: Diễn giải khái quát là 'lãnh đạo họ trong mọi việc'
  rationale: Chuỗi động từ có thể là lối nói bao quát về vai trò lãnh đạo công khai, nhưng việc giữ hình thức cụ thể bảo tồn hình ảnh và sự liên kết với đàn chiên cùng người chăn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng cấu trúc song song để giữ nhịp của nguyên văn; chọn 'cộng đồng' thay cho từ mang sắc thái giáo hội rõ hơn. Mọi dấu chú thích đều đặt ngay sau phần văn bản liên quan.
