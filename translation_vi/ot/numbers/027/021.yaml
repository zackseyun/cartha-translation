  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: vi
  text: Ông phải đứng trước thầy tế lễ Ê-lê-a-sa; thầy sẽ cầu hỏi cho ông theo phán quyết của U-rim trước mặt Yahweh.[a] Theo lệnh của người ấy, họ sẽ ra đi, và theo lệnh của người ấy, họ sẽ trở về—ông, cùng toàn thể con cái Israel ở với ông, tức toàn thể hội chúng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo quyết định của U-rim.” Cụm từ nói đến việc thầy tế lễ cầu hỏi trước mặt Yahweh bằng U-rim.'
    reason: lexical_alternative
  - marker: b
    text: “Con cái Israel” nghĩa là dân Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: trước
  rationale: 'Giữ nghĩa không gian và quan hệ thông thường: Giô-suê đứng trước mặt thầy tế lễ Ê-lê-a-sa.'
- source_word: יַעֲמֹד
  choice: phải đứng
  rationale: Thể chưa hoàn thành mang lực chỉ thị trong bối cảnh lập người kế nhiệm; “phải đứng” tự nhiên và trang trọng trong tiếng Việt.
- source_word: וְשָׁאַל לוֹ
  choice: thầy sẽ vì ông mà cầu hỏi
  rationale: Chủ ngữ chuyển sang Ê-lê-a-sa, người cầu hỏi thay cho Giô-suê. Cách diễn đạt này làm rõ cú pháp mà không thêm nội dung.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: theo phán quyết của U-rim
  rationale: מִשְׁפָּט ở đây chỉ phán quyết hay thủ tục quyết định mang tính tư tế; U-rim là thuật ngữ chuyên biệt nên được phiên âm.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: עַל פִּיו
  choice: theo lệnh của người ấy
  rationale: Thành ngữ sát nghĩa là “theo miệng người ấy,” diễn tả chỉ thị có thẩm quyền. “Người ấy” giữ đại từ số ít và tránh quyết định dứt khoát tiền ngữ.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: họ sẽ ra đi ... họ sẽ trở về
  rationale: Cặp động từ chỉ việc xuất hành và trở lại, thường trong hoạt động công cộng hoặc quân sự; “trở về” truyền đạt tự nhiên ý đối xứng trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình thức thân tộc của nguyên văn, đồng thời là cách diễn đạt Kinh Thánh dễ nhận biết; chú thích nêu cách hiểu tự nhiên là dân Israel.
- source_word: הָעֵדָה
  choice: hội chúng
  rationale: Chỉ cộng đồng giao ước được tập hợp; “hội chúng” giữ sắc thái tập thể và trang trọng.
theological_decisions:
- issue: Tiền ngữ của đại từ trong cụm עַל פִּיו
  choice: Giữ đại từ số ít bằng cụm “theo lệnh của người ấy,” không xác định rõ đó là Ê-lê-a-sa hay Giô-suê.
  alternative: Hiểu trực tiếp là lệnh của Ê-lê-a-sa; hoặc là lệnh của Giô-suê khi ông hành động theo phán quyết được ban qua U-rim.
  rationale: Cú pháp Hê-bơ-rơ cô đọng và tiền ngữ không hoàn toàn minh thị. Bản dịch bảo tồn sự mơ hồ thật của câu thay vì chèn một cách giải thích giáo lý vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm quen thuộc; U-rim được giữ như thuật ngữ tư tế. Dấu gạch ngang làm rõ phần đồng vị cuối câu mà không làm phẳng cấu trúc nguyên văn.
