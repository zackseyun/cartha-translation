revisions:
- from: Ông phải đứng trước thầy tế lễ Ê-lê-a-sa, và thầy sẽ vì ông mà cầu hỏi trước mặt Yahweh theo phán quyết của U-rim.[a] Theo lệnh của người ấy, họ sẽ ra đi, và theo lệnh của người ấy, họ sẽ trở về—ông cùng toàn thể con cái Israel đi với ông,[b] tức toàn thể hội chúng.
  to: Ông phải đứng trước thầy tế lễ Ê-lê-a-sa; thầy sẽ cầu hỏi cho ông theo phán quyết của U-rim trước mặt Yahweh.[a] Theo lệnh của người ấy, họ sẽ ra đi, và theo lệnh của người ấy, họ sẽ trở về—ông, cùng toàn thể con cái Israel ở với ông, tức toàn thể hội chúng.[b]
  rationale: Bản sửa giữ mọi lựa chọn thuật ngữ chính của bản nháp, nhưng đặt “trước mặt Yahweh” gần “phán quyết của U-rim” hơn theo trật tự và liên hệ của tiếng Hê-bơ-rơ, đồng thời làm câu tiếng Việt tự nhiên hơn. “Người ấy” được giữ nguyên để không áp đặt một tiền ngữ duy nhất cho עַל־פִּיו. Chú thích giữ nguyên các neo [a] và [b], nội dung và lý do chú thích.
