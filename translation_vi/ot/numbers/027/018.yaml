base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với Môi-se: “Hãy chọn Giô-suê, con trai của Nun, một người có thần linh[a] trong mình, rồi đặt tay con trên người ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một người có ruach trong người ấy.” Từ Hê-bơ-rơ ruach có thể chỉ “thần linh”, “Thần” hoặc “tinh thần”; ở đây không có mạo từ xác định.'
    reason: Bảo tồn sự mơ hồ từ vựng và thần học của nguyên văn.
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh giao ước quen thuộc và trang trọng trong tiếng Việt, phân biệt với tước hiệu “Chúa”.
- source_word: קַח לְךָ
  choice: Hãy chọn
  rationale: Trong ngữ cảnh chỉ định người kế nhiệm, “chọn” truyền đạt tự nhiên chức năng của mệnh lệnh; לְךָ là thành tố thành ngữ, không cần dịch riêng là “cho con”.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Giô-suê, con trai Nun
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt; בִּן được dịch chính xác là “con trai”.
- source_word: אִישׁ
  choice: một người
  rationale: “Người” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn rõ người được nói đến là Giô-suê; không cần lặp giới tính vốn đã hiển nhiên từ tên và cụm “con trai”.
- source_word: אֲשֶׁר רוּחַ בּוֹ
  choice: một người có thần linh[a] ở trong mình
  rationale: Giữ רוּחַ không có mạo từ và không tự động đồng nhất rõ ràng với Đức Thánh Linh; “thần linh” duy trì sắc thái thuộc linh, còn chú thích bảo tồn các khả năng “Thần” hoặc “tinh thần”.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: rồi đặt tay con trên người ấy
  rationale: “Đặt tay trên” là cách diễn đạt tự nhiên cho nghi thức ủy nhiệm; giữ “tay” ở số ít như nguyên văn.
theological_decisions:
- issue: רוּחַ chỉ Thần của Đức Chúa Trời hay tinh thần/phẩm chất nơi Giô-suê
  choice: thần linh
  alternative: Thần; tinh thần
  rationale: Danh từ không có mạo từ nên nguyên văn không xác định dứt khoát. Bản dịch chính giữ sắc thái thuộc linh mà không viết hoa để áp đặt một nhận diện thần học; chú thích nêu rõ các cách hiểu khả hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng, dễ hiểu. Lời phán dùng đại từ “con” phù hợp quan hệ giữa Đức Giê-hô-va và Môi-se; “người ấy” tránh sắc thái thiếu trang trọng của “ông ấy” trong mệnh lệnh nghi lễ.
