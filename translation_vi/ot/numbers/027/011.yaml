  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: vi
  text: Nếu cha người ấy không có anh em trai, thì các ngươi phải trao phần gia nghiệp của người ấy cho người bà con huyết thống gần nhất trong thị tộc của người ấy[a], và người đó sẽ thừa hưởng phần ấy[b]. Điều này sẽ là một quy định pháp lý[c] cho con dân Israel[d], đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn kết hợp “người bà con huyết thống của người ấy” với “người gần nhất với người ấy.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và người đó sẽ sở hữu phần ấy” hoặc “sẽ nhận phần ấy làm gia nghiệp.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “một điều lệ xét định” hoặc “một điều luật.”'
    reason: lexical_alternative
  - marker: d
    text: Nguyên văn là “các con trai Israel,” một danh xưng quen thuộc chỉ toàn thể dân Israel.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים
  choice: anh em trai
  rationale: Trong trình tự thừa kế của đoạn luật này, từ này chỉ các anh em nam của cha người đã chết; cách dịch nêu rõ giới tính và quan hệ họ hàng.
- source_word: לְאָבִיו
  choice: cha người ấy
  rationale: 'Giới từ trong tiếng Hê-bơ-rơ được diễn đạt theo cú pháp tự nhiên của tiếng Việt: người được nói đến là cha của người đã chết.'
- source_word: נַחֲלָתוֹ
  choice: phần gia nghiệp của người ấy
  rationale: “Gia nghiệp” thể hiện tài sản có tính thừa kế trong bối cảnh pháp luật, còn “phần” giúp câu tiếng Việt tự nhiên và xác định rõ đối tượng được chuyển giao.
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: người bà con huyết thống gần nhất
  rationale: Cụm Hê-bơ-rơ kết hợp ý bà con cùng huyết thống với mức độ thân cận nhất; bản dịch giữ cả hai thành tố thay vì gộp mơ hồ thành “người thân”.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: trong thị tộc của người ấy
  rationale: מִשְׁפָּחָה ở đây chỉ đơn vị họ hàng rộng hơn gia đình hạt nhân trong cơ cấu xã hội Israel; “thị tộc” giữ được sắc thái xã hội-pháp lý ấy.
- source_word: וְיָרַשׁ אֹתָהּ
  choice: và người đó sẽ thừa hưởng phần ấy
  rationale: Động từ ירשׁ trong luật thừa kế có thể mang nghĩa thừa hưởng hoặc chiếm hữu; “thừa hưởng” phù hợp trực tiếp với ngữ cảnh và vẫn giữ kết quả pháp lý của việc chuyển giao.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: một quy định pháp lý
  rationale: Cụm này diễn tả một điều lệ có tính ràng buộc và xét định; “quy định pháp lý” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ sắc thái luật pháp.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con dân Israel
  rationale: Đây là danh xưng cộng đồng mang tính giao ước dành cho dân Israel, không chỉ riêng nam giới; “con dân Israel” vừa trang trọng vừa tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; “Yahweh” bảo tồn chức năng tên riêng và tránh thay nó bằng một tước hiệu.
- issue: Phạm vi của לִבְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai Israel / con cái Israel
  rationale: Trong công thức pháp lý này, cụm từ chỉ toàn thể cộng đồng giao ước. “Con dân Israel” truyền đạt phạm vi tập thể mà không ngụ ý điều luật chỉ dành cho nam giới; chú thích vẫn cho biết hình thức sát chữ.
- issue: Sắc thái của ירשׁ
  choice: thừa hưởng
  alternative: chiếm hữu / nhận làm sở hữu
  rationale: Ngữ cảnh là thứ tự kế thừa gia nghiệp. “Thừa hưởng” thể hiện đúng bối cảnh, trong khi chú thích bảo tồn khả năng hiểu động từ theo nghĩa nhận quyền sở hữu.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “các ngươi” để giữ lời truyền trực tiếp ở số nhiều trong bối cảnh luật giao cho cộng đồng; dùng “người ấy/người đó” để tránh mơ hồ về các đại từ nam tính trong tiếng Việt. “Thị tộc” giữ cơ cấu họ hàng rộng của Israel cổ đại; “Môi-se” theo dạng tên quen thuộc trong tiếng Việt.
