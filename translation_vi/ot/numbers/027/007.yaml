  to: “Các con gái của Xê-lô-phê-hát nói đúng.[a] Con nhất định phải cấp cho họ một phần đất thừa kế giữa các anh em trai của cha họ, và phải chuyển sản nghiệp của cha họ cho họ.”
  rationale: Bản sửa làm rõ rằng phần đất thừa kế được đặt trong phạm vi các anh em trai của người cha, theo nghĩa thân tộc của tiếng Hê-bơ-rơ, đồng thời giữ nguyên lực nhấn mạnh của mệnh lệnh và thuật ngữ pháp lý về sản nghiệp. Chú thích được điều chỉnh để tránh áp đặt sắc thái tiếp diễn không có trong cách dịch tiếng Việt tự nhiên.
