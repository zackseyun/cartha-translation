base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: vi
  text: “Các con gái của Xê-lô-phê-hát nói đúng.[a] Con nhất định phải cấp cho họ một phần đất thừa kế giữa các anh em trai của cha họ, và phải chuyển sản nghiệp của cha họ cho họ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách diễn đạt Hê-bơ-rơ: “Các con gái của Xê-lô-phê-hát nói một cách đúng đắn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: nói đúng
  rationale: Cụm này xác nhận lời thỉnh cầu của các con gái là đúng trong bối cảnh xét xử. “Nói đúng” vừa gần cấu trúc Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
- source_word: נָתֹן תִּתֵּן
  choice: nhất định phải cấp
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ đã chia nhấn mạnh mệnh lệnh; “nhất định phải” truyền đạt cả sắc thái nhấn mạnh lẫn tính bắt buộc.
- source_word: לָהֶם
  choice: cho họ
  rationale: Dù hậu tố trong bản Hê-bơ-rơ tại đây có hình thức giống đực số nhiều, đối tượng theo ngữ cảnh rõ ràng là các con gái của Xê-lô-phê-hát; tiếng Việt “họ” không đánh dấu giống.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: một phần đất làm sản nghiệp
  rationale: Cách dịch này thể hiện cả quyền sở hữu đất và tính chất thừa kế của cụm từ trong bối cảnh phân chia đất.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: giữa các anh em của cha họ
  rationale: Giữ nguyên quan hệ thân tộc và vị trí của phần sản nghiệp trong phạm vi phần đất thuộc gia tộc bên cha, không diễn giải quá mức thành “các chú bác”.
- source_word: וְהַעֲבַרְתָּ
  choice: phải chuyển
  rationale: Thể Hiphil của עבר ở đây mang nghĩa pháp lý là làm cho quyền thừa kế được chuyển sang người khác.
- source_word: נַחֲלַת אֲבִיהֶן
  choice: sản nghiệp của cha họ
  rationale: Diễn đạt trực tiếp phần thừa kế vốn thuộc về người cha đã qua đời, đồng thời giữ quan hệ pháp lý và gia đình.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sản nghiệp” để giữ sắc thái pháp lý-thừa kế quen thuộc trong văn cảnh Kinh Thánh; “phần đất làm sản nghiệp” làm rõ đây là quyền sở hữu đất. Đại từ “con” phù hợp vì Đức Chúa Trời đang phán trực tiếp với Môi-se trong mạch văn.
