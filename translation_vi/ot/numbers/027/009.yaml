translation:
  language: vi
  text: Nếu người ấy không có con gái, thì các ngươi phải trao phần thừa kế của người ấy cho các anh em trai của người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: Nếu
  rationale: Mở đầu trường hợp điều kiện kế tiếp trong chuỗi luật lệ; tiếng Việt không cần dịch riêng liên từ וְ để diễn đạt tự nhiên.
- source_word: אֵין ל֖/וֹ בַּת
  choice: người ấy không có con gái
  rationale: Kết cấu tồn tại với לְ được chuyển thành cách diễn đạt sở hữu tự nhiên trong tiếng Việt; danh từ số ít mang nghĩa không có người con gái nào.
- source_word: וּ/נְתַתֶּם
  choice: thì ... sẽ được hưởng
  rationale: Diễn đạt hệ quả pháp lý của mệnh đề điều kiện bằng câu chủ động theo nghĩa hưởng thừa kế, tự nhiên trong tiếng Việt, dù hình thức Hê-bơ-rơ là mệnh lệnh số nhiều 'các ngươi phải trao'.
- source_word: נַחֲלָת֖/וֹ
  choice: phần gia nghiệp đó
  rationale: Trong ngữ cảnh luật thừa kế, נַחֲלָה chỉ phần tài sản được truyền lại, đặc biệt là sản nghiệp gia tộc; 'phần gia nghiệp' vừa chính xác vừa trang trọng.
- source_word: לְ/אֶחָי/ו
  choice: anh em trai của người ấy
  rationale: Giữ rõ giống đực số nhiều của tiếng Hê-bơ-rơ, chỉ các anh em nam là hàng thừa kế kế tiếp.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại và dễ hiểu. Dùng 'người ấy' để nối với người đàn ông đã qua đời trong ngữ cảnh, và 'anh em trai' để tránh sự mơ hồ của từ 'anh em' trong tiếng Việt.
