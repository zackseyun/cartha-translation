review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng trình tự thừa kế và giữ được “con gái” cùng “anh em trai”. Tuy nhiên, וּנְתַתֶּם là mệnh lệnh ngôi thứ hai số nhiều (“các ngươi phải/hãy trao”), trong khi “sẽ được hưởng” chuyển thành một phát biểu thụ động về người thừa kế và làm mất tác nhân pháp lý được nguyên ngữ nêu rõ.
  naturalness: Câu văn nhìn chung tự nhiên, nhưng “phần gia nghiệp đó” hơi mơ hồ do “đó” không có tiền tố chỉ rõ và “gia nghiệp” trong tiếng Việt hiện đại có thể gợi công việc/sự nghiệp gia đình. “Phần thừa kế của người ấy” rõ nghĩa và phù hợp văn phong pháp lý hơn.
  terminology: “Anh em trai” diễn đạt đúng số nhiều giống đực của אֶחָיו. “Phần thừa kế” chuyển tải chính xác נַחֲלָתוֹ trong ngữ cảnh luật thừa kế.
  issues:
  - severity: medium
    issue: Mất sắc thái mệnh lệnh ngôi thứ hai số nhiều ở וּנְתַתֶּם.
    rationale: Nguyên ngữ trực tiếp chỉ thị cộng đồng/cơ quan thực thi phải trao tài sản; “anh em trai ... sẽ được hưởng” chỉ nêu kết quả và không còn mệnh lệnh này.
  - severity: low
    issue: “Phần gia nghiệp đó” kém rõ và ít tự nhiên hơn trong văn cảnh pháp lý hiện đại.
    rationale: “Phần thừa kế của người ấy” nêu rõ sở hữu từ hậu tố -וֹ và là thuật ngữ dễ hiểu hơn.
  revised_text: Nếu người ấy không có con gái, thì các ngươi phải trao phần thừa kế của người ấy cho các anh em trai của người ấy.
