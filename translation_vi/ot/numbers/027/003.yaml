  to: “Cha chúng tôi đã chết trong hoang mạc; ông không thuộc số những người tụ họp chống lại Yahweh trong nhóm của Cô-ra, nhưng ông đã chết vì tội của chính mình,[a] và ông không có con trai.”
  rationale: Thay “phe Cô-ra” bằng “nhóm của Cô-ra” để dịch trung tính hơn cho עֲדַת. Chỉnh dấu câu để quan hệ nối tiếp và tương phản của câu Hê-bơ-rơ được rõ ràng trong tiếng Việt, đồng thời giữ cách hiểu nhân quả của “vì tội của chính mình” và chú thích cho cách hiểu thay thế “trong tội mình.”
