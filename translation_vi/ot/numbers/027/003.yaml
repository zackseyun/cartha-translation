source:
  edition: WLC
  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: vi
  text: “Cha chúng tôi đã chết trong hoang mạc; ông không thuộc số những người tụ họp chống lại Yahweh trong nhóm của Cô-ra, nhưng ông đã chết vì tội của chính mình,[a] và ông không có con trai.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông đã chết trong tội mình.” Nguyên văn không nói rõ đó là tội gì; câu này chỉ phân biệt ông với nhóm Cô-ra đã tụ họp chống lại Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: Cha chúng tôi
  rationale: Lời trực tiếp của các con gái nói về người cha của mình; cách dịch này rõ ràng và tự nhiên.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: Giữ bối cảnh dân Israel lưu lạc trong vùng hoang vu; “hoang mạc” là cách diễn đạt trang trọng và quen thuộc.
- source_word: בְּתוֹךְ הָעֵדָה הַנּוֹעָדִים
  choice: thuộc số những người tụ họp
  rationale: Diễn đạt tự nhiên ý “ở giữa/thuộc trong cộng đồng những người tập hợp”; ở đây עֵדָה chỉ tập thể người nổi loạn, không nhất thiết phải dịch lặp thành một danh từ riêng.
- source_word: עַל יְהוָה
  choice: chống lại Yahweh
  rationale: עַל trong ngữ cảnh này biểu thị sự đối nghịch; giữ nguyên danh riêng giao ước Yahweh.
- source_word: בַּעֲדַת קֹרַח
  choice: trong phe Cô-ra
  rationale: “Phe” truyền đạt tự nhiên nhóm người gắn với cuộc nổi loạn của Cô-ra và tránh lặp từ “cộng đồng/hội chúng”.
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: nhưng ông đã chết vì tội của chính mình
  rationale: כִּי có chức năng đối chiếu/giải thích; בְּחֶטְאוֹ có thể mang nghĩa nguyên nhân, đồng thời đại từ sở hữu nhấn mạnh tội của ông chứ không phải việc tham gia cuộc nổi loạn của Cô-ra.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: và ông không có con trai
  rationale: Cách diễn đạt tiếng Việt tự nhiên của cấu trúc tồn tại với לְ; giữ “con trai” vì đây là điểm thiết yếu trong vấn đề thừa kế.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm Yahweh bảo toàn danh riêng thay vì thay bằng một tước hiệu.
- issue: Mối quan hệ giữa cái chết của người cha và tội lỗi
  choice: ông đã chết vì tội của chính mình
  alternative: ông đã chết trong tội mình
  rationale: 'Bản dịch giữ sự phân biệt trong lời các con gái: cha họ không tham gia cuộc nổi loạn của Cô-ra nhưng chết liên quan đến tội của chính ông. Không xác định tội ấy là gì hoặc bổ sung một học thuyết vượt quá câu văn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để quy chiếu người cha đã được nhắc đến; “phe Cô-ra” làm rõ đây là nhóm nổi loạn. Dấu [a] được đặt ngay sau mệnh đề có cách hiểu khác.
