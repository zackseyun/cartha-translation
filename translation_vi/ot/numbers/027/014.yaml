source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: vi
  text: vì trong hoang mạc Xin, trong vụ tranh cãi của cộng đồng, hai ngươi đã chống lại lệnh ta, không tôn ta là thánh tại các nguồn nước trước mắt họ.[a] Đó là các nguồn nước Mê-ri-ba Ca-đe[b] trong hoang mạc Xin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “để tôn ta là thánh” hoặc “để bày tỏ ta là thánh trước mắt họ.” Dạng nguyên mẫu trong tiếng Hê-bơ-rơ mang nghĩa tích cực, nhưng ngữ cảnh cho thấy Môi-se và A-rôn đã không làm điều ấy.'
    reason: lexical_alternative
  - marker: b
    text: “Mê-ri-ba Ca-đe” cũng có thể dịch là “Mê-ri-ba thuộc Ca-đe”, hoặc sát nghĩa hơn là “sự tranh cãi tại Ca-đe”.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: vì
  rationale: Trong ngữ cảnh, từ này nêu nguyên nhân Môi-se và A-rôn không được vào đất hứa; cách dịch nhân quả tự nhiên hơn trong tiếng Việt.
- source_word: מְרִיתֶם
  choice: hai ngươi đã chống lại
  rationale: Động từ מרה diễn tả sự chống nghịch hoặc bất tuân thẩm quyền. Chủ ngữ số nhiều chỉ Môi-se và A-rôn, nên thêm “hai” để tiếng Việt rõ nghĩa theo ngữ cảnh.
- source_word: פִּי
  choice: lệnh ta
  rationale: Nghĩa đen là “miệng ta”, nhưng đây là thành ngữ chỉ điều Đức Chúa Trời phán truyền; “lệnh ta” chuyển đạt đúng ý và tự nhiên.
- source_word: בְּמִדְבַּר צִן
  choice: trong hoang mạc Xin
  rationale: מִדְבָּר chỉ vùng hoang vu; “hoang mạc” là cách gọi địa lý trang trọng, tự nhiên. צִן được phiên âm là “Xin”.
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: khi cộng đồng tranh cãi
  rationale: Cụm từ xác định hoàn cảnh cộng đồng gây tranh chấp. “Cộng đồng” chuyển tải עֵדָה tự nhiên hơn “hội chúng” đối với độc giả phổ thông, còn “tranh cãi” phản ánh מְרִיבָה.
- source_word: לְהַקְדִּישֵׁנִי
  choice: không tôn ta là thánh
  rationale: Dạng nguyên mẫu có nghĩa tích cực là “tôn ta là thánh”, nhưng trong quan hệ với động từ “chống lại” và ngữ cảnh sự thất bại, tiếng Việt cần biểu đạt ý phủ định được hàm chứa.
- source_word: בַמַּיִם
  choice: tại nguồn nước
  rationale: Cụm này chỉ nơi xảy ra biến cố. “Nguồn nước” phù hợp với địa danh được nhận diện ở vế sau và tự nhiên trong tiếng Việt.
- source_word: לְעֵינֵיהֶם
  choice: trước mắt họ
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ và nhấn mạnh sự việc diễn ra công khai trước dân chúng.
- source_word: הֵם
  choice: Đó là
  rationale: Đại từ dùng để nhận diện địa điểm vừa nói; “Đó là” tự nhiên trong tiếng Việt.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: nguồn nước Mê-ri-ba Ca-đe
  rationale: Giữ cụm như một địa danh bằng lối phiên âm tiếng Việt, đồng thời chú thích nghĩa và cấu trúc khả dĩ.
theological_decisions:
- issue: Cách thể hiện sự thất bại trong לְהַקְדִּישֵׁנִי
  choice: không tôn ta là thánh
  alternative: để tôn ta là thánh / để bày tỏ ta là thánh
  rationale: Nguyên văn của nguyên mẫu là tích cực, nhưng cú pháp và ngữ cảnh cho biết Môi-se cùng A-rôn đã không thực hiện điều ấy. Bản dịch làm rõ ý phủ định hàm chứa, còn chú thích bảo tồn hình thức tích cực của tiếng Hê-bơ-rơ.
- issue: Ý nghĩa của việc tôn Đức Chúa Trời là thánh
  choice: tôn ta là thánh
  alternative: thánh hóa ta / bày tỏ sự thánh khiết của ta
  rationale: Cách nói này không hàm ý con người khiến Đức Chúa Trời trở nên thánh, mà chỉ việc công nhận và bày tỏ Ngài là thánh trước cộng đồng; lối dịch tránh áp đặt diễn giải hệ phái.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta/hai ngươi” để giữ sắc thái lời phán trực tiếp và làm rõ chủ ngữ số nhiều là Môi-se cùng A-rôn. Các địa danh được phiên âm theo lối Việt hóa: Xin, Mê-ri-ba, Ca-đe. Cả hai ký hiệu chú thích [a], [b] đều xuất hiện trong chính văn.'
