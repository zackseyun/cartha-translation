  source_fidelity: Bản dịch truyền đạt đúng quan hệ nhân quả, sự chống nghịch mệnh lệnh của Đức Chúa Trời, và ý phủ định được hàm ý trong nguyên mẫu לְהַקְדִּישֵׁנִי. Tuy nhiên, “khi cộng đồng tranh cãi” làm chuyển cụm danh từ בִּמְרִיבַת הָעֵדָה (một biến cố/vụ tranh cãi của cộng đồng) thành một mệnh đề thời gian. “Nguồn nước” số ít cũng chưa phản ánh cách gọi מֵי (‘nước/các dòng nước’) trong cả hai lần xuất hiện.
  naturalness: “Trong vụ tranh cãi của cộng đồng” vừa tự nhiên vừa giữ đúng tính chất quy chiếu đến sự kiện. “Các nguồn nước” là cách diễn đạt rõ ràng hơn trong tiếng Việt khi cần biểu thị số nhiều; tuy nhiên trong tên riêng, “các nguồn nước Mê-ri-ba Ca-đe” vẫn đọc tự nhiên trong văn phong Kinh Thánh hiện đại.
  terminology: Giữ nhất quán các đại từ “ta/hai ngươi”, các địa danh Việt hóa “Xin, Mê-ri-ba, Ca-đe”, và thuật ngữ “tôn ta là thánh”. Cách này diễn đạt việc công nhận/bày tỏ Đức Chúa Trời là thánh, không hàm ý làm cho Ngài trở nên thánh.
