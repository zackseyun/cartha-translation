revisions:
- from: Con hãy đưa ông ấy ra đứng trước thầy tế lễ Ê-lê-a-xa và trước toàn thể hội chúng, rồi trao nhiệm vụ cho ông ấy[a] trước mắt họ.
  to: Con hãy đặt người ấy đứng trước Ê-lê-a-xa, thầy tế lễ, và trước toàn thể cộng đồng; hãy ủy nhiệm người ấy[a] trước mắt họ.
  rationale: Sửa “đưa ... ra đứng” thành “đặt ... đứng” để sát nghĩa hơn với dạng Hiphil của עמד. Sửa “trao nhiệm vụ” thành “ủy nhiệm” để diễn đạt hành động công khai trong văn cảnh mà không biến động từ צוה thành một cụm quá diễn giải. Chú thích bảo lưu nghĩa trực tiếp và thông dụng của động từ là “truyền lệnh/ra lệnh.”
  reviewer_model: gpt-5.6-terra
