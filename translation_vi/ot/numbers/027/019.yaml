base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: vi
  text: Con hãy đặt người ấy đứng trước Ê-lê-a-xa, thầy tế lễ, và trước toàn thể cộng đồng; hãy ủy nhiệm người ấy[a] trước mắt họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “truyền lệnh cho người ấy” hoặc “ra lệnh cho người ấy”. Động từ Hê-bơ-rơ thường có nghĩa là truyền lệnh; trong bối cảnh bổ nhiệm Giô-suê công khai, từ này cũng có thể chỉ việc chính thức ủy nhiệm cho ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Con hãy đưa ông ấy ra đứng
  rationale: Dạng Hiphil của עמד mang nghĩa khiến một người đứng hoặc đặt người ấy vào vị trí nào đó. Cách dịch này diễn đạt tự nhiên hành động đưa Giô-suê ra trình diện trong nghi thức công khai.
- source_word: לִפְנֵי
  choice: trước
  rationale: Giữ nghĩa không gian và nghi lễ là ở trước mặt hoặc trong sự hiện diện của một người hay cộng đồng.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: thầy tế lễ Ê-lê-a-xa
  rationale: Dùng cách phiên âm tên riêng quen thuộc trong tiếng Việt và dịch chức danh xác định theo nghĩa trực tiếp.
- source_word: כָּל הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng Y-sơ-ra-ên được tập hợp; “hội chúng” giữ được sắc thái tập thể và hội họp.
- source_word: וְצִוִּיתָה אֹתוֹ
  choice: rồi trao nhiệm vụ cho ông ấy
  rationale: צוה thường có nghĩa là truyền lệnh, nhưng trong ngữ cảnh bổ nhiệm công khai này, cụm từ cũng chỉ việc chính thức giao phó nhiệm vụ. Cách dịch chính nêu rõ chức năng trong ngữ cảnh, còn chú thích bảo lưu nghĩa từ vựng trực tiếp.
- source_word: לְעֵינֵיהֶם
  choice: trước mắt họ
  rationale: Giữ gần thành ngữ Hê-bơ-rơ, đồng thời diễn đạt rõ hành động diễn ra công khai để họ chứng kiến.
theological_decisions:
- issue: Tính chất của hành động צוה trong lễ xác lập thẩm quyền cho Giô-suê
  choice: trao nhiệm vụ cho ông ấy
  alternative: truyền lệnh cho ông ấy; giao trọng trách cho ông ấy
  rationale: Văn cảnh cho thấy đây là hành động công khai giao phó trách nhiệm cho Giô-suê trước thầy tế lễ và hội chúng. Tuy nhiên, vì động từ cũng có nghĩa thông thường là “truyền lệnh”, chú thích giữ lại khả năng đó thay vì loại bỏ sự đa nghĩa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “con hãy” để thể hiện lời Đức Chúa Trời trực tiếp truyền cho Môi-se; “ông ấy” giữ cách quy chiếu tự nhiên đến Giô-suê mà không lặp tên vốn không có trong câu Hê-bơ-rơ. Cấu trúc “trước... và trước...” phản ánh phép lặp לִפְנֵי của nguyên văn.
