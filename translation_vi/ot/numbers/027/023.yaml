  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: vi
  text: Môi-se đặt hai tay lên ông và truyền lệnh cho ông[a], đúng như Yahweh đã phán qua Môi-se[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giao nhiệm vụ cho ông.” Động từ Hê-bơ-rơ thường có nghĩa là “truyền lệnh”; trong ngữ cảnh nghi thức này, nó cũng có thể hàm ý việc chính thức giao phó trách nhiệm lãnh đạo cho Giô-suê.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “bởi tay Môi-se,” một thành ngữ có nghĩa là qua Môi-se với tư cách người được Yahweh dùng làm trung gian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: đặt hai tay mình trên ông
  rationale: Diễn đạt tự nhiên nghi thức đặt tay; יָדָיו là số nhiều nên dịch rõ là “hai tay” trong tiếng Việt.
- source_word: וַיְצַוֵּהוּ
  choice: truyền lệnh cho ông
  rationale: Giữ nghĩa thông dụng của צוה là truyền lệnh/chỉ thị, đồng thời ngữ cảnh cho thấy đây là hành động chính thức khi trao nhiệm vụ cho Giô-suê.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Thể hiện rõ sự tương ứng giữa hành động của Môi-se và lời Yahweh đã phán.
- source_word: דִּבֶּר
  choice: đã phán
  rationale: “Phán” phù hợp với chủ thể thần linh; “đã” biểu thị lời ấy có trước hành động của Môi-se.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּיַד מֹשֶׁה
  choice: qua Môi-se
  rationale: Đây là thành ngữ chỉ phương tiện hay tác nhân trung gian; cách dịch này tự nhiên trong tiếng Việt, còn nghĩa đen được ghi ở chú thích.
theological_decisions:
- issue: Ý nghĩa của וַיְצַוֵּהוּ trong nghi thức trao quyền cho Giô-suê
  choice: truyền lệnh cho ông
  alternative: giao nhiệm vụ cho ông
  rationale: Bản dịch chính giữ sát nghĩa từ vựng “truyền lệnh”, không biến động từ thành một thuật ngữ giáo hội; chú thích bảo tồn khả năng hiểu theo nghĩa chính thức là giao phó nhiệm vụ.
- issue: Cụm từ chỉ vai trò trung gian của Môi-se
  choice: qua Môi-se
  alternative: bởi tay Môi-se
  rationale: “Qua Môi-se” truyền đạt tự nhiên ý Yahweh dùng Môi-se làm người trung gian, trong khi chú thích nêu nguyên văn để bảo tồn hình ảnh Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo dạng tên quen thuộc trong tiếng Việt; giữ danh Yahweh. Tránh thuật ngữ giáo hội như “tấn phong,” đồng thời dùng chú thích để bảo tồn sắc thái trao nhiệm vụ và thành ngữ nguyên ngữ.
