  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/015.yaml
  text: Then Moses spoke to Yahweh[a], saying,
translation:
  language: vi
  text: 'Bấy giờ, Môi-se thưa với Yahweh[a] rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Nêu dạng Hê-bơ-rơ và cách dịch truyền thống của danh Đức Chúa Trời.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ, ... thưa
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt trình tự tự nhiên. Trong ngữ cảnh Môi-se nói với Đức Chúa Trời, “thưa” vừa đúng hướng lời nói vừa tự nhiên và kính trọng.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: אֶל
  choice: với
  rationale: Giới từ đánh dấu đối tượng mà Môi-se hướng lời nói đến; kết cấu tiếng Việt tự nhiên là “thưa với”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng phiên tự phổ biến, thay vì thay thế bằng một tước hiệu.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức nguyên mẫu này dẫn vào lời nói trực tiếp; “rằng:” thể hiện chức năng ấy tự nhiên trong tiếng Việt và chuẩn bị cho nội dung ở câu kế tiếp.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo tồn tính chất danh riêng, còn chú thích cho biết cách dịch truyền thống mà không biến danh ấy thành tước hiệu trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa với” phù hợp khi người dưới hướng lời đến Đức Chúa Trời; dấu hai chấm báo trước lời cầu xin bắt đầu ở câu tiếp theo.
