  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của Hê-bơ-rơ: וְנָתַתָּה...עָלָיו được giữ bằng hình ảnh “đặt ... trên người ấy”; מֵהוֹדְךָ được diễn đạt là sự chia một phần phẩm tính/uy nghi của Môi-se; và mệnh đề mục đích với יִשְׁמְעוּ được dịch “nghe theo”, bảo toàn cả nghĩa lắng nghe lẫn đáp ứng vâng phục trong ngữ cảnh ủy nhiệm. “Con cái Y-sơ-ra-ên” giữ được cách gọi thân tộc của nguyên văn mà không áp đặt cách hiểu thần học hẹp hơn.'
  naturalness: Câu văn trang trọng, rõ ràng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Ngươi”, “người ấy”, “hội chúng” và “nghe theo” nhất quán với ngữ cảnh lời phán trực tiếp và nghi thức công khai. Cụm “một phần vẻ uy nghi” hơi văn chương nhưng tự nhiên trong thanh ghi trang trọng và thích hợp với tính đa nghĩa của הוֹד.
  terminology: “Vẻ uy nghi” là lựa chọn thận trọng cho הוֹד, không giản lược từ này chỉ còn “uy quyền”; chú thích nêu rõ các khả năng “huy hoàng”, “danh dự”, và “uy quyền” theo ngữ cảnh. “Nghe theo” là thuật ngữ phù hợp cho שׁמע tại đây, và chú thích giữ các phương án nghĩa chính. Các neo chú thích [a] và [b] đều có mặt và gắn với các cụm được giải thích.
