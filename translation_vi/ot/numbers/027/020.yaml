id: NUM.27.20
reference: Numbers 27:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ה מֵ/הֽוֹדְ/ךָ֖ עָלָ֑י/ו לְמַ֣עַן יִשְׁמְע֔וּ כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: vi
  text: Ngươi hãy đặt một phần vẻ uy nghi của ngươi trên người ấy[a], để toàn thể hội chúng con cái Y-sơ-ra-ên nghe theo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một phần vẻ huy hoàng”, “một phần danh dự” hoặc “một phần uy quyền của ngươi”. Từ Hê-bơ-rơ có thể chỉ vẻ uy nghi, phẩm giá và uy quyền gắn với chức vụ.
    reason: lexical_alternative
  - marker: b
    text: Hay “vâng lời”; động từ Hê-bơ-rơ có thể mang nghĩa nghe, lắng nghe hoặc nghe theo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Ngươi hãy đặt
  rationale: נתן nghĩa cơ bản là “trao/ban”, nhưng đi với עַל trong nghi thức ủy nhiệm này, “đặt ... trên” vừa tự nhiên vừa giữ được hình ảnh trao truyền.
- source_word: מֵהוֹדְךָ
  choice: một phần vẻ uy nghi của ngươi
  rationale: הוֹד chỉ vẻ huy hoàng, uy nghi hoặc danh dự, đồng thời trong ngữ cảnh có thể hàm ý uy quyền gắn với chức vụ. Tiền tố מִן biểu thị một phần, nên không diễn đạt như sự chuyển giao toàn bộ.
- source_word: עָלָיו
  choice: trên người ấy
  rationale: Dịch trực tiếp giới từ עַל với hậu tố ngôi thứ ba, giữ hình ảnh đặt hoặc trao trên một người.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên mệnh đề chỉ mục đích trong tiếng Việt.
- source_word: יִשְׁמְעוּ
  choice: nghe theo
  rationale: שׁמע có thể là nghe, lắng nghe hoặc vâng lời. “Nghe theo” giữ được cả hình ảnh nghe lẫn ý đáp ứng bằng sự tuân phục, phù hợp ngữ cảnh lãnh đạo.
- source_word: כָּל עֲדַת
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng được tập hợp; “toàn thể hội chúng” là cách diễn đạt trang trọng, rõ nghĩa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ thành ngữ thân tộc của nguyên văn nhưng dùng “con cái” tự nhiên hơn trong tiếng Việt và bao quát cộng đồng Israel.
theological_decisions:
- issue: Bản chất điều được Môi-se trao cho Giô-suê
  choice: Dịch הוֹד là “vẻ uy nghi”, đồng thời chú thích rằng từ này trong ngữ cảnh có thể bao hàm danh dự và uy quyền chức vụ.
  alternative: Dịch trực tiếp là “uy quyền” hoặc “vinh quang”.
  rationale: Nguyên ngữ trước hết dùng một từ đa nghĩa chỉ vẻ huy hoàng, uy nghi và danh dự. Ngữ cảnh ủy nhiệm làm nổi bật chức năng uy quyền, nhưng không nên thay thế hoàn toàn hình ảnh và độ rộng nghĩa của từ.
- issue: Sắc thái của שׁמע trong mệnh đề mục đích
  choice: Dịch là “nghe theo”.
  alternative: “nghe”, “lắng nghe” hoặc “vâng lời”.
  rationale: “Nghe theo” bảo tồn sự căng giữa nghĩa nghe và nghĩa tuân phục, không thu hẹp động từ chỉ còn hành vi tiếp nhận âm thanh hay chỉ còn sự vâng lời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ngươi” vì lời Đức Chúa Trời trực tiếp phán với Môi-se; “người ấy” tránh sắc thái khinh miệt có thể có của “hắn”. Các dấu chú thích [a], [b] đều xuất hiện ngay tại cụm từ liên quan.
