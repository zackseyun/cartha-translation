source:
  edition: WLC
  text: יִפְקֹ֣ד יְהוָ֔ה אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר אִ֖ישׁ עַל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: vi
  text: Xin Yahweh[a], Đức Chúa Trời của tâm linh mọi người phàm[b], đặt một người nam lên lãnh đạo hội chúng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin CHÚA, Đức Chúa Trời của tâm linh mọi người phàm, đặt một người nam lên lãnh đạo hội chúng.” Yahweh là danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ; theo truyền thống, danh này thường được dịch là “CHÚA”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “của các linh của mọi xác thịt.” “Mọi xác thịt” là một thành ngữ Hê-bơ-rơ chỉ loài người trong thân phận hữu hạn, phải chết.'
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “cộng đồng” hoặc “đại hội”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד
  choice: xin ... bổ nhiệm
  rationale: Trong ngữ cảnh tìm người kế nhiệm Môi-se và với cụm עַל הָעֵדָה theo sau, פקד mang nghĩa chỉ định hoặc bổ nhiệm vào chức trách. Cấu trúc “xin ... bổ nhiệm” diễn đạt tự nhiên sắc thái thỉnh cầu của thể vị hoàn thành chưa trọn trong tiếng Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời bằng lối phiên âm thông dụng, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: Đức Chúa Trời của thần linh
  rationale: Giữ cấu trúc danh xưng đặc biệt và nghĩa cơ bản của רוּחוֹת là “các thần linh/tâm linh”, không thu hẹp thành hơi thở hay tính khí.
- source_word: לְכָל בָּשָׂר
  choice: mọi người phàm
  rationale: Cụm “mọi xác thịt” là thành ngữ Hê-bơ-rơ chỉ loài người trong thân phận hữu hạn, phải chết. “Mọi người phàm” truyền đạt ý này tự nhiên hơn trong tiếng Việt, còn nghĩa đen được ghi ở chú thích.
- source_word: אִישׁ
  choice: một người
  rationale: אִישׁ là danh từ giống đực số ít và trong ngữ cảnh chỉ một người nam sẽ kế nhiệm Môi-se. Tiếng Việt dùng “một người” tự nhiên mà không xóa bỏ giới tính ngữ cảnh; nếu cần nhấn mạnh riêng giới tính, “một người nam” sẽ nặng nề không cần thiết.
- source_word: עַל הָעֵדָה
  choice: cai quản hội chúng
  rationale: עַל biểu thị vị trí thẩm quyền trên cộng đồng, còn עֵדָה là cộng đồng giao ước được tập hợp. “Cai quản hội chúng” diễn đạt rõ chức năng lãnh đạo.
theological_decisions:
- issue: Danh xưng của Đức Chúa Trời trong lời thỉnh cầu
  choice: Xin Yahweh...
  alternative: Xin CHÚA...
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của “Đức Chúa Trời của thần linh mọi người phàm”
  choice: Giữ “thần linh” và diễn đạt “mọi xác thịt” là “mọi người phàm”
  alternative: Đức Chúa Trời của hơi thở mọi xác thịt
  rationale: Cách dịch giữ được danh xưng thần học đặc thù, đồng thời không quyết đoán quá mức rằng רוּחוֹת chỉ về hơi thở, tính khí hay một khía cạnh riêng biệt nào của nội tâm con người.
- issue: Giới tính của người được bổ nhiệm
  choice: một người
  alternative: một người nam
  rationale: Ngữ cảnh xác định người kế nhiệm là nam, nhưng danh từ “người” trong tiếng Việt không mặc nhiên trung tính hóa hay phủ nhận điều đó. Cách dịch tránh thêm từ ngữ gượng ép trong khi vẫn không chuyển thành một tập thể hay chức vụ phi cá nhân.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Xin ... bổ nhiệm” phù hợp với lời cầu xin; “cai quản hội chúng” làm rõ quan hệ thẩm quyền của עַל mà vẫn giữ thuật ngữ cộng đồng giao ước. Các chú thích giải thích danh Yahweh, thành ngữ “mọi xác thịt” và phạm vi nghĩa của עֵדָה.
