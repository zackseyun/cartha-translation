  to: Nhưng nếu người ấy không có anh em trai, thì các ngươi phải trao phần thừa kế của người ấy cho các anh em trai của cha người ấy.[a]
  rationale: Chỉ thay “phần gia nghiệp” bằng “phần thừa kế” để diễn đạt chính xác và trực tiếp hơn thuật ngữ pháp lý נַחֲלָה, không thay đổi ý nghĩa hay mức độ mơ hồ của nguyên văn. Giữ nguyên cấu trúc quan hệ họ hàng trong chính văn và phương án thành ngữ trong chú thích.
