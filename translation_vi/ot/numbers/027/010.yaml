  text: וְ/אִם אֵ֥ין ל֖/וֹ אַחִ֑ים וּ/נְתַתֶּ֥ם אֶת נַחֲלָת֖/וֹ לַ/אֲחֵ֥י אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: vi
  text: Nhưng nếu người ấy không có anh em trai, thì các ngươi phải trao phần thừa kế của người ấy cho các anh em trai của cha người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói tự nhiên hơn: “cho các chú bác bên nội của người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ kết hợp với tiểu từ điều kiện mở đầu trường hợp kế tiếp trong chuỗi luật định; “Nhưng nếu” vừa thể hiện sự chuyển sang trường hợp tương phản vừa giữ rõ ý điều kiện.
- source_word: אֵין לוֹ אַחִים
  choice: người ấy không có anh em trai
  rationale: Cấu trúc phủ định hiện hữu với לְ chỉ sự sở hữu được diễn đạt tự nhiên trong tiếng Việt bằng “không có”; אַחִים ở đây chỉ các anh em nam trong quy định thừa kế.
- source_word: וּנְתַתֶּם
  choice: thì các ngươi phải trao
  rationale: Động từ số nhiều ngôi thứ hai tiếp tục lời chỉ thị pháp lý. “Thì” làm rõ hệ quả của điều kiện, còn “phải trao” truyền đạt lực bắt buộc của quy định.
- source_word: נַחֲלָתוֹ
  choice: phần gia nghiệp của người ấy
  rationale: נַחֲלָה trong ngữ cảnh này là phần tài sản hay đất đai được truyền thừa; “phần gia nghiệp” giữ sắc thái pháp lý và truyền đời mà vẫn dễ hiểu.
- source_word: לַאֲחֵי אָבִיו
  choice: cho các anh em trai của cha người ấy
  rationale: Cách dịch này bám sát cấu trúc sở hữu của tiếng Hê-bơ-rơ, đồng thời tránh dùng riêng “chú” hay “bác”, vốn trong tiếng Việt còn phân biệt tuổi tác so với người cha mà nguyên văn không nêu.
theological_decisions: []
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại. Dùng “các ngươi” để giữ ngôi thứ hai số nhiều trong lời truyền phán; dùng “anh em trai” nhằm thể hiện chính xác giới tính trong quy định thừa kế. Cụm sát nguyên văn “các anh em trai của cha” được giữ trong chính văn, còn cách nói họ hàng tự nhiên hơn được đưa vào chú thích.
