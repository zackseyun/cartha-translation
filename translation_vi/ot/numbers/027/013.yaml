  edition: WLC
  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: vi
  text: Sau khi nhìn thấy xứ ấy, con cũng sẽ được quy tụ về cùng dân mình[a], như A-rôn, anh con, đã được quy tụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, diễn ý hơn: “con sẽ chết” hoặc “con sẽ về cùng tổ tiên mình”. Thành ngữ Hê-bơ-rơ theo sát chữ là “được quy tụ về cùng dân mình”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה
  choice: Sau khi nhìn thấy
  rationale: 'Động từ Qal ngôi hai số ít, nối tiếp mệnh lệnh xem đất ở câu trước. Cách diễn đạt này thể hiện tự nhiên trình tự thời gian: Môi-se nhìn thấy xứ rồi mới qua đời.'
- source_word: אֹתָהּ
  choice: xứ ấy
  rationale: Đại từ tân ngữ giống cái số ít chỉ về vùng đất được nhắc đến trong ngữ cảnh. Nêu lại “xứ ấy” giúp câu tiếng Việt rõ nghĩa mà không làm thay đổi đối tượng quy chiếu.
- source_word: וְנֶאֱסַפְתָּ
  choice: con cũng sẽ được quy tụ
  rationale: Thể Niphal của אסף là dạng bị động; trong thành ngữ này, từ ấy nói đến cái chết và việc về cùng dân mình. “Được quy tụ” giữ nguyên hình ảnh của tiếng Hê-bơ-rơ thay vì giản lược thành “chết”.
- source_word: אֶל עַמֶּיךָ
  choice: về với dân mình
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ, đồng thời giữ sắc thái cộng đồng và thân tộc. “Dân mình” phù hợp với quan hệ xưng hô trong lời Đức Chúa Trời phán với Môi-se.
- source_word: גַּם אָתָּה
  choice: con cũng
  rationale: Giữ ý nhấn mạnh rằng Môi-se cũng sẽ chịu chung số phận như A-rôn.
- source_word: כַּאֲשֶׁר
  choice: như
  rationale: Đánh dấu trực tiếp sự so sánh giữa điều sẽ xảy đến với Môi-se và điều đã xảy đến với A-rôn.
- source_word: נֶאֱסַף
  choice: đã được quy tụ
  rationale: Giữ nhất quán với cùng động từ và cùng thành ngữ ở vế trước.
- source_word: אַהֲרֹן אָחִיךָ
  choice: A-rôn, anh con
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt và đặt dấu phẩy để thể hiện thành phần đồng vị chỉ quan hệ anh em.
theological_decisions:
- issue: Cách chuyển ngữ thành ngữ chỉ cái chết אסף אל־עמיו
  choice: Giữ hình ảnh “được quy tụ về với dân mình”.
  alternative: “chết”, “về với tổ tiên mình”, hoặc “sum họp với người thân đã khuất”
  rationale: Nguyên văn không chỉ nói trần trụi về cái chết mà dùng một thành ngữ mang sắc thái thân tộc và cộng đồng. Giữ hình ảnh này bảo toàn chiều sâu văn chương và thần học, nhưng không áp đặt một giáo lý chi tiết về đời sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo ngữ cảnh Đức Chúa Trời trực tiếp phán với Môi-se; giữ thành ngữ Hê-bơ-rơ trong một cấu trúc tiếng Việt tự nhiên.
