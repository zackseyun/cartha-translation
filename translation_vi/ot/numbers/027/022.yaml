id: NUM.27.22
reference: Numbers 27:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: vi
  text: 'Môi-se làm đúng như Yahweh đã truyền cho ông: ông đưa Giô-suê đến và đặt ông ấy đứng[a] trước mặt thầy tế lễ Ê-lê-a-sa và trước mặt toàn thể cộng đồng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đặt ông ấy trước mặt” hoặc “đưa ông ấy ra trình diện”; động từ Hê-bơ-rơ có thể chỉ việc khiến một người đứng hoặc đặt người ấy vào vị trí trước những người khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה trong công thức vâng phục này được diễn đạt tự nhiên bằng “làm”, gắn với mệnh đề “đúng như ... đã truyền”.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: “Đúng như” diễn đạt rõ sự tương ứng giữa hành động của Môi-se và mệnh lệnh trước đó, đồng thời vẫn gọn và tự nhiên.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Đã truyền” thể hiện mệnh lệnh có trước hành động của Môi-se mà không thêm nội dung vào nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: ông đưa Giô-suê đến
  rationale: לקח có nghĩa cơ bản là “lấy/đem”; trong ngữ cảnh nghi thức công khai này, “đưa ... đến” tự nhiên hơn trong tiếng Việt và không hàm ý cưỡng ép.
- source_word: וַיַּעֲמִדֵהוּ
  choice: đặt ông ấy đứng
  rationale: Dạng Hiphil của עמד có nghĩa khiến một người đứng hoặc đặt người ấy vào vị trí; cách dịch này giữ được cả nét nghĩa thể chất lẫn nghi lễ.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Diễn đạt việc đặt Giô-suê công khai trong sự hiện diện của Ê-lê-a-sa và cộng đồng.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách gọi rõ ràng, quen thuộc trong tiếng Việt hiện đại đối với chức vụ tư tế của Ê-lê-a-sa.
- source_word: כָּל־הָעֵדָה
  choice: toàn thể cộng đồng
  rationale: עֵדָה chỉ cộng đồng Y-sơ-ra-ên được triệu tập; “toàn thể cộng đồng” vừa dễ hiểu hiện nay vừa phản ánh כָּל.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm; phiên âm “Yahweh” bảo tồn tư cách tên riêng và không thay nó bằng một tước hiệu.
- issue: Sắc thái nghi lễ của וַיַּעֲמִדֵהוּ
  choice: đặt ông ấy đứng
  alternative: giới thiệu ông ấy; trình diện ông ấy
  rationale: Bản dịch giữ hành động khiến Giô-suê đứng trước những người hiện diện, đồng thời không thu hẹp động từ thành riêng ý niệm bổ nhiệm hay giới thiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông ấy” để tránh chuỗi đại từ “ông” gây mơ hồ giữa Môi-se và Giô-suê; chọn “cộng đồng” thay cho từ mang sắc thái giáo hội hiện đại.
