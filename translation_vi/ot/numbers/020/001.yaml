source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: vi
  text: Bấy giờ, toàn thể hội chúng Israel[a][b] đến hoang mạc Xin vào tháng thứ nhất; dân chúng ở lại Ca-đe. Mi-ri-am chết tại đó và được chôn cất tại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; cũng có thể dịch là “con cái Israel”. Trong ngữ cảnh, cụm này chỉ toàn dân Israel.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “toàn thể cộng đồng” hoặc “toàn thể đại hội”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Dân Israel
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Israel”, nhưng trong ngữ cảnh chỉ toàn dân Israel. “Dân Israel” tự nhiên, chính xác về phạm vi và dễ hiểu trong tiếng Việt hiện đại; nghĩa đen được ghi ở chú thích.
- source_word: כָּל הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng Israel được quy tụ như một tập thể; “hội chúng” giữ được sắc thái cộng đồng có tổ chức, còn “toàn thể” phản ánh כָּל.
- source_word: מִדְבַּר צִן
  choice: hoang mạc Xin
  rationale: מִדְבָּר là vùng hoang vu, khô cằn; “hoang mạc” vừa tự nhiên vừa tránh hàm ý nơi hoàn toàn chỉ có cát của từ “sa mạc”.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: vào tháng thứ nhất
  rationale: Dịch trực tiếp biểu thức thời gian và không tự ý bổ sung năm hoặc mốc niên đại mà nguyên văn không nêu.
- source_word: וַיֵּשֶׁב
  choice: ở lại
  rationale: Động từ diễn tả việc dân chúng cư trú tại Ca-đe trong bối cảnh hành trình; “ở lại” không hàm ý định cư vĩnh viễn.
- source_word: בְּקָדֵשׁ
  choice: tại Ca-đe
  rationale: “Tại” phù hợp với địa danh chỉ nơi dân chúng dừng chân và cư trú.
- source_word: וַתָּמָת
  choice: qua đời
  rationale: Diễn đạt tự nhiên, trang trọng trong tiếng Việt mà vẫn nêu rõ sự chết, không thêm ý nghĩa thần học.
- source_word: וַתִּקָּבֵר
  choice: được chôn cất
  rationale: Giữ thể bị động của nguyên văn và không thêm chủ thể thực hiện việc mai táng.
- source_word: שָׁם ... שָׁם
  choice: tại đó ... tại đó
  rationale: 'Giữ nguyên sự lặp lại có chủ ý: Mi-ri-am qua đời tại đó và cũng được chôn cất tại đó.'
theological_decisions:
- issue: Mốc thời gian “tháng thứ nhất” không nêu năm
  choice: Giữ nguyên “vào tháng thứ nhất”
  alternative: Bổ sung năm thứ bốn mươi hoặc một mốc niên đại khác
  rationale: Câu Hê-bơ-rơ chỉ nói “tháng thứ nhất”; việc xác định năm dựa trên suy luận từ văn mạch không nên được đưa vào chính văn.
translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Dân Israel” thay cho cách dịch sát chữ kém tự nhiên, đồng thời giữ nghĩa đen trong chú thích. Cấu trúc “tức toàn thể hội chúng” làm rõ quan hệ đồng vị trong nguyên văn. Các địa danh và tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt: Xin, Ca-đe, Mi-ri-am.'
