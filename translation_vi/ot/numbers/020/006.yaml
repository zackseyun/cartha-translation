  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: vi
  text: Môi-se và A-rôn rời khỏi dân chúng, đi đến lối vào Lều Hội Kiến rồi sấp mặt xuống đất. Vinh quang của Yahweh hiện ra với họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đi đến
  rationale: בוא có thể mang nghĩa đến, đi đến hoặc bước vào tùy điểm nhìn; ở đây hai người di chuyển từ dân chúng đến một địa điểm được nêu rõ.
- source_word: מִפְּנֵי הַקָּהָל
  choice: rời khỏi dân chúng
  rationale: Cụm từ theo nghĩa đen là “từ trước mặt/sự hiện diện của cộng đồng”; cách dịch này diễn đạt tự nhiên việc họ rời nơi dân chúng đang tụ họp.
- source_word: הַקָּהָל
  choice: dân chúng
  rationale: קהל chỉ cộng đồng đang tụ họp; trong ngữ cảnh này “dân chúng” tự nhiên và không hàm ý một thiết chế tôn giáo về sau.
- source_word: פֶּתַח
  choice: lối vào
  rationale: פתח là chỗ dùng để đi vào một công trình hoặc lều.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Danh xưng này chỉ chiếc lều nơi diễn ra cuộc gặp gỡ được ấn định giữa Đức Chúa Trời và dân Ngài; cách viết hoa đánh dấu danh xưng riêng trong ngữ cảnh đền tạm.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: sấp mặt xuống đất
  rationale: Giữ rõ tư thế theo thành ngữ Hê-bơ-rơ, đồng thời dùng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Thể Niphal của ראה ở đây diễn tả sự biểu hiện hữu hình.
- source_word: כְבוֹד יְהוָה
  choice: vinh quang của Yahweh
  rationale: כבוד trong ngữ cảnh chỉ sự vinh quang thần thượng được biểu hiện; kết cấu sở hữu phản ánh sát cụm Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֲלֵיהֶם
  choice: với họ
  rationale: Trong kết cấu “hiện ra”, tiếng Việt tự nhiên dùng “hiện ra với họ”; đối tượng là Môi-se và A-rôn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh thánh bốn phụ âm; “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng một tước hiệu.
- issue: Bản chất của “vinh quang” xuất hiện
  choice: vinh quang của Yahweh hiện ra
  alternative: Yahweh hiện ra trong vinh quang
  rationale: Giữ nguyên chủ ngữ ngữ pháp כְבוֹד יְהוָה và không xác định thêm hình thức hay bản chất của sự hiện ra.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “rời khỏi dân chúng” để chuyển thành ngữ không tự nhiên nếu dịch sát chữ; giữ cấu trúc ngắn gọn của lời thuật. Các tên riêng được viết theo lối phiên âm quen thuộc: Môi-se, A-rôn; danh xưng Lều Hội Kiến được viết hoa.'
