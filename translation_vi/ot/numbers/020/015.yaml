base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: vi
  text: Tổ phụ chúng ta đã đi xuống Ai Cập[a]; chúng ta sống tại Ai Cập nhiều ngày[b], và người Ai Cập đã đối xử tệ với chúng ta và tổ phụ chúng ta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tổ tiên chúng ta”; từ Hê-bơ-rơ theo nghĩa đen là “các cha của chúng ta”. Cũng vậy ở lần xuất hiện thứ hai.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen là “nhiều ngày”, một thành ngữ chỉ một thời gian dài.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đã ngược đãi chúng ta và tổ phụ chúng ta” hoặc “đã làm điều ác đối với chúng ta và tổ phụ chúng ta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: đã đi xuống
  rationale: Giữ nghĩa chuyển động địa lý thông thường của ירד khi nói về việc đến Ai Cập, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: אֲבֹתֵינוּ
  choice: tổ phụ chúng ta
  rationale: אָבוֹת theo nghĩa đen là “các cha”, nhưng trong lời hồi thuật lịch sử này chỉ các thế hệ đi trước; “tổ phụ” vừa giữ sắc thái gia tộc vừa rõ nghĩa hơn “cha chúng ta”.
- source_word: מִצְרַיְמָה
  choice: Ai Cập
  rationale: Hậu tố chỉ hướng diễn đạt chuyển động đến một nơi; tiếng Việt tự nhiên thể hiện nghĩa này qua động từ “đi xuống” và địa danh, không cần thêm “đến”.
- source_word: וַנֵּשֶׁב
  choice: chúng ta sống
  rationale: ישב ở đây nói đến việc cư trú; “sống” là cách diễn đạt hiện đại, rõ ràng và không hàm ý định cư lâu dài hơn văn bản.
- source_word: יָמִים רַבִּים
  choice: nhiều ngày
  rationale: Giữ hình thức sát nguyên văn của thành ngữ Hê-bơ-rơ, còn chú thích cho biết nghĩa tự nhiên là một thời gian dài.
- source_word: וַיָּרֵעוּ
  choice: đã đối xử tệ với
  rationale: Dạng Hiphil của רעע diễn tả việc gây điều xấu hoặc làm hại; “đối xử tệ với” truyền đạt nghĩa rộng mà không thu hẹp thành một loại ngược đãi cụ thể.
- source_word: מִצְרַיִם
  choice: người Ai Cập
  rationale: Hình thức từ là “Ai Cập”, nhưng động từ số nhiều cho thấy chủ thể được hiểu là dân Ai Cập; tiếng Việt cần nêu rõ chủ thể là người.
- source_word: לָנוּ ... וְלַאֲבֹתֵינוּ
  choice: với chúng ta và tổ phụ chúng ta
  rationale: Giữ cả hai đối tượng chịu tác động và sự lặp lại của cụm từ chỉ tổ phụ trong nguyên văn.
