source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se và A-rôn tại núi Hô-rơ, trên biên giới xứ Ê-đôm rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH.”'
    reason: Tên Yahweh dịch từ Tetragrammaton יהוה trong nguyên văn Hê-bơ-rơ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ אמר có nghĩa cơ bản là “nói”; khi Đức Chúa Trời là chủ thể, “phán” là cách diễn đạt tiếng Việt tự nhiên, trang trọng và không làm thay đổi chức năng dẫn lời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho Tetragrammaton, thay vì thay thế bằng một tước hiệu; tiền tố “Đức” phù hợp với lối xưng hô tôn kính trong tiếng Việt.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: Cụm giới từ chỉ những người tiếp nhận lời phán. Tiếng Việt tự nhiên dùng một lần “với” cho hai đối tượng phối hợp, dù tiếng Hê-bơ-rơ lặp lại אֶל.
- source_word: בְּהֹר הָהָר
  choice: tại núi Hô-rơ
  rationale: בְּ mang nghĩa định vị; “tại” diễn đạt rõ địa điểm. הֹר הָהָר là địa danh thường được hiểu là núi Hô-rơ.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: trên biên giới xứ Ê-đôm
  rationale: Giữ sát quan hệ không gian của עַל với גְּבוּל; “xứ Ê-đôm” là cách gọi tự nhiên cho vùng đất thuộc Ê-đôm.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Đây là công thức dẫn nhập nội dung lời nói. Trong tiếng Việt, “rằng:” tự nhiên hơn dạng phân từ “nói rằng” sau động từ “phán” và báo hiệu lời trực tiếp tiếp theo.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tetragrammaton. Bản dịch giữ đây là tên riêng, không thay bằng tước hiệu “CHÚA”; “Giê-hô-va” là dạng tên đã quen thuộc và dễ nhận biết trong tiếng Việt, còn “Yahweh” phản ánh cách phục nguyên học thuật phổ biến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc dẫn lời kéo sang câu kế tiếp bằng dấu hai chấm. Không thêm chú thích vì câu này không đòi hỏi giải thích văn bản; chú thích tiếng Anh được cung cấp dường như đặt sai vị trí và nội dung không tương ứng với “Mount Hor”.
