id: NUM.20.3
reference: Numbers 20:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: vi
  text: 'Dân chúng tranh cãi với Môi-se và nói[a]: “Phải chi chúng tôi đã chết khi anh em chúng tôi chết trước mặt Đức Yahweh!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Phải chi chúng tôi đã chết như anh em chúng tôi đã chết trước mặt Đức Yahweh!”'
    reason: Cụm בִּגְוַע có thể được hiểu là “khi … chết” hoặc “như … đã chết”.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: tranh cãi
  rationale: Động từ ריב diễn tả sự tranh chấp, đối đầu bằng lời nói; “tranh cãi” tự nhiên trong tiếng Việt và giữ được sắc thái đối kháng với Môi-se.
- source_word: הָעָם
  choice: dân chúng
  rationale: עַם ở đây chỉ cộng đồng dân Israel nói chung; “dân chúng” là cách diễn đạt rõ ràng, tự nhiên.
- source_word: עִם מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ עִם có nghĩa cơ bản là “với”; kết hợp “tranh cãi với” đã truyền đạt đầy đủ tính chất đối đầu mà không cần dịch quá thành “chống lại”.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: và nói
  rationale: Công thức dẫn lời Hê-bơ-rơ được chuyển thành cách dẫn lời gọn, tự nhiên trong tiếng Việt, không lặp cứng nhắc “nói rằng”.
- source_word: וְלוּ
  choice: Phải chi
  rationale: Tiểu từ này biểu thị một ước muốn đầy nuối tiếc; “phải chi” truyền đạt tự nhiên sắc thái than tiếc ấy.
- source_word: גָוַעְנוּ … בִּגְוַע
  choice: chúng tôi đã chết … chết
  rationale: Cả hai hình thức đều từ גוע. Lặp từ “chết” bảo toàn sự lặp từ có chủ ý trong nguyên văn mà vẫn tự nhiên; בִּגְוַע được hiểu theo nghĩa thời gian là “khi … chết”.
- source_word: אַחֵינוּ
  choice: anh em chúng tôi
  rationale: Danh từ là giống đực số nhiều và trong ngữ cảnh chỉ những người đồng bào Israel đã chết; “anh em chúng tôi” giữ được hình thức và quan hệ cộng đồng trong nguyên văn.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Yahweh
  rationale: לִפְנֵי có nghĩa “trước mặt, trong sự hiện diện của”; “trước mặt” tự nhiên và giữ sắc thái hiện diện. Danh riêng giao ước יהוה được phiên là “Yahweh”.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יהוה
  choice: Đức Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh יהוה. Giữ “Yahweh” giúp phân biệt danh riêng giao ước với tước hiệu “Chúa”; “Đức” phù hợp với lối xưng hô trang trọng trong tiếng Việt.
- issue: Phạm vi nghĩa của אַחֵינוּ
  choice: anh em chúng tôi
  alternative: đồng bào chúng tôi
  rationale: Nguyên văn dùng danh từ giống đực số nhiều “anh em”. Bản dịch giữ hình thức ấy thay vì trung tính hóa, nhưng không khẳng định rằng nhóm được nói đến nhất thiết chỉ gồm nam giới.
- issue: Quan hệ thời gian hoặc cách thức trong בִּגְוַע
  choice: khi anh em chúng tôi chết
  alternative: như anh em chúng tôi đã chết
  rationale: Giới từ בְּ với động danh từ có thể nêu hoàn cảnh hoặc thời điểm. Chính văn chọn nghĩa thời gian tự nhiên hơn, còn chú thích giữ cách hiểu so sánh/cách thức để không xóa bỏ độ mở của cấu trúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phải chi” diễn đạt lời than ước tự nhiên; sự lặp lại “chết … chết” phản ánh cùng một gốc từ trong nguyên văn. Dấu chú thích [a] được đặt ngay sau động từ dẫn lời và nội dung chú thích cung cấp cách hiểu khác cho toàn bộ lời nói.
