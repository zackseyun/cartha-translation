reference: Numbers 20:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se và A-rôn: “Vì các ngươi không tin Ta[a] và không coi Ta là thánh[b] trước mặt dân Israel[c], nên các ngươi sẽ không đưa hội chúng này vào xứ mà Ta đã ban cho họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã không tin cậy Ta.” Động từ Hê-bơ-rơ có thể mang nghĩa tin hoặc tin cậy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thánh hóa Ta” hoặc “tôn Ta là thánh.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Israel”; đây là cách gọi tập thể dân Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời dưới dạng chuyển tự, thay vì thay bằng một tước hiệu.
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: tin Ta
  rationale: Động từ Hiphil của אמן đi với ב có thể chỉ việc tin hoặc tin cậy một người. “Tin Ta” trực tiếp, tự nhiên và không giải thích quá mức bản văn.
- source_word: לְהַקְדִּישֵׁנִי
  choice: tôn Ta là thánh
  rationale: Diễn đạt hành động công khai nhìn nhận và bày tỏ sự thánh khiết của Yahweh; rõ hơn cách nói kỹ thuật “thánh hóa Ta” trong tiếng Việt hiện đại.
- source_word: לְעֵינֵי
  choice: trước mắt
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ và nhấn mạnh tính công khai của sự việc.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Là cách gọi tự nhiên trong tiếng Việt đối với cộng đồng hậu duệ của Israel, đồng thời vẫn phản ánh yếu tố “con” trong nguyên ngữ.
- source_word: לָכֵן
  choice: nên
  rationale: Nối nguyên nhân với hậu quả một cách tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: תָבִיאוּ
  choice: sẽ không đưa
  rationale: Dạng Hiphil của בוא có nghĩa khiến cho đi vào, tức “đưa vào”; câu tuyên bố hậu quả chắc chắn hơn là một mệnh lệnh.
- source_word: הַקָּהָל
  choice: hội chúng này
  rationale: Chỉ cộng đồng dân được tập hợp trong bối cảnh đồng hoang mà không mang nghĩa giáo hội riêng biệt.
- source_word: הָאָרֶץ
  choice: xứ
  rationale: “Xứ” là cách diễn đạt gọn, trang trọng và quen thuộc cho vùng đất được hứa ban trong Ngũ Kinh.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: mà Ta đã ban cho họ
  rationale: Thì hoàn thành trong tiếng Hê-bơ-rơ trình bày việc ban xứ như điều đã được xác lập chắc chắn.
theological_decisions:
- issue: Bản chất sự thất bại của Môi-se và A-rôn
  choice: 'Giữ cả hai ý: họ không tin Yahweh và không tôn Ngài là thánh trước dân chúng.'
  alternative: Diễn giải riêng là họ thiếu lòng tin cậy, không vâng lời, hoặc chiếm lấy vinh quang của Đức Chúa Trời.
  rationale: Câu này nêu sự không tin và việc không tôn Yahweh là thánh nhưng không giải thích chính xác hành động của họ liên hệ hai điều ấy thế nào; bản dịch không tự ý giải quyết sự căng thẳng đó.
- issue: Quan hệ cú pháp của לְהַקְדִּישֵׁנִי
  choice: “để tôn Ta là thánh”
  alternative: “và đã không tôn Ta là thánh” hoặc “đến mức không bày tỏ sự thánh khiết của Ta”
  rationale: Giữ mối liên hệ mục đích/kết quả của לְ với hành động tin mà không biến hai vế thành hai cáo buộc hoàn toàn tách biệt.
- issue: Sắc thái của lời tuyên án
  choice: “các ngươi sẽ không đưa”
  alternative: “các ngươi không được đưa”
  rationale: Bản văn tuyên bố hậu quả chắc chắn dành cho Môi-se và A-rôn; cách dịch này tránh biến lời ấy chỉ thành một lệnh cấm.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” trong lời phán trực tiếp để giữ sắc thái uy nghiêm và đại từ số nhiều hướng đến cả Môi-se lẫn A-rôn. Các tên riêng được trình bày theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, còn Israel giữ dạng quốc tế thông dụng.
