  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: vi
  text: Họ rời Ca-đe, rồi toàn thể cộng đồng người Y-sơ-ra-ên[a] đến núi Hô-rơ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói theo nghĩa đen là “các con trai của Y-sơ-ra-ên”; cũng có thể dịch là “dân Y-sơ-ra-ên.”
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ là “Hô-rơ, ngọn núi,” một cụm từ được dùng làm địa danh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: họ rời
  rationale: Động từ נסע trong mạch kể chuyện chỉ việc nhổ trại và lên đường. “Rời” diễn đạt tự nhiên việc khởi hành khỏi Ca-đe mà không thêm chi tiết ngoài câu.
- source_word: מִקָּדֵשׁ
  choice: khỏi Ca-đe
  rationale: Bản Hê-bơ-rơ chỉ ghi Ca-đe, nên không mở rộng thành Ca-đe Ba-nê-a dù địa điểm này có thể được nhận diện như vậy theo văn cảnh rộng hơn.
- source_word: וַיָּבֹאוּ
  choice: đến
  rationale: בוא ở đây diễn tả việc đi tới một địa điểm; “đến” là cách nói tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cách dịch này giữ được sắc thái cộng đồng có nguồn gốc gia tộc của thành ngữ Hê-bơ-rơ, đồng thời tự nhiên hơn cách dịch máy móc “các con trai của Y-sơ-ra-ên”.
- source_word: כָּל הָעֵדָה
  choice: toàn thể cộng đồng
  rationale: עֵדָה nói đến cộng đồng hội tụ của dân chúng; “toàn thể” thể hiện כָּל, còn “cộng đồng” là cách diễn đạt hiện đại, rõ nghĩa.
- source_word: הֹר הָהָר
  choice: núi Hô-rơ
  rationale: Cụm từ này hoạt động như một địa danh. “Núi Hô-rơ” là trật tự tự nhiên trong tiếng Việt, thay vì dịch máy móc là “Hô-rơ, ngọn núi”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dấu chấm phẩy làm rõ hai động tác nối tiếp, còn cụm “tức toàn thể cộng đồng” giữ quan hệ đồng vị trong nguyên văn. Các dấu chú thích được đặt cạnh đúng cụm từ mà chúng giải thích.
