    rationale: Động từ דבר אל nghĩa là “nói với/đối thoại với”; bản nguồn không biểu thị hành vi ban lệnh hay lời phán theo nghĩa đặc biệt. “Nói với” bảo toàn mệnh lệnh khác thường của câu mà không thêm sắc thái diễn giải.
