revisions:
- from: “Hãy cầm lấy cây gậy[a], rồi con và A-rôn, anh con, hãy triệu tập cộng đồng lại. Trước mắt họ, hai con hãy phán với tảng đá, thì nó sẽ cho nước của nó chảy ra. Con sẽ làm cho nước từ tảng đá chảy ra cho họ, và cho cộng đồng cùng gia súc của họ uống.”
  to: “Hãy cầm lấy cây gậy[a], rồi con và A-rôn, anh con, hãy triệu tập cộng đồng. Trước mắt họ, hai con hãy nói với tảng đá, thì nó sẽ cho nước của nó chảy ra. Con sẽ làm cho nước từ tảng đá chảy ra cho họ, và cho cộng đồng cùng gia súc của họ uống.”
  rationale: Thay “phán với” bằng “nói với” để dịch sát và tự nhiên động từ דבר אל, không gán sắc thái thẩm quyền mà bản Hê-bơ-rơ không nêu. Các yếu tố còn lại được giữ vì phản ánh đúng các mệnh lệnh, sự đối lập số nhiều/số ít, tính công khai “trước mắt họ”, và hai mệnh đề liên tiếp về nước từ tảng đá.
