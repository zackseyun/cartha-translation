source:
  edition: WLC
  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: vi
  text: “Hãy cầm lấy cây gậy[a], rồi con và A-rôn, anh con, hãy triệu tập cộng đồng. Trước mắt họ, hai con hãy nói với tảng đá, thì nó sẽ cho nước của nó chảy ra. Con sẽ làm cho nước từ tảng đá chảy ra cho họ, và cho cộng đồng cùng gia súc của họ uống.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cây roi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: cây gậy
  rationale: מַטֶּה có thể chỉ gậy hoặc roi; “cây gậy” tự nhiên trong tiếng Việt hiện đại và phù hợp với vật Môi-se được lệnh cầm lấy.
- source_word: הָעֵדָה
  choice: cộng đồng
  rationale: עֵדָה chỉ toàn thể cộng đồng Y-sơ-ra-ên được tập hợp; “cộng đồng” rõ nghĩa và không mang sắc thái giáo phái.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: hai con hãy phán với tảng đá
  rationale: Động từ ở số nhiều, bao gồm Môi-se và A-rôn. “Phán với” giữ sắc thái lời truyền có thẩm quyền mà không biến hành động nói thành đánh.
- source_word: לְעֵינֵיהֶם
  choice: trước mắt họ
  rationale: Giữ sát thành ngữ Hê-bơ-rơ và nhấn mạnh tính công khai của mệnh lệnh.
- source_word: וְנָתַן מֵימָיו
  choice: thì nó sẽ cho nước của nó chảy ra
  rationale: Tảng đá là chủ ngữ số ít và hậu tố sở hữu trong מֵימָיו được giữ bằng “nước của nó”; thêm “chảy ra” giúp câu tự nhiên theo ngữ cảnh mà không đổi tác nhân.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: Con sẽ làm cho nước từ tảng đá chảy ra cho họ
  rationale: Thể Hiphil của יצא mang nghĩa khiến hoặc đem nước ra; “làm cho… chảy ra” diễn đạt rõ nghĩa gây khiến trong tiếng Việt.
- source_word: וְהִשְׁקִיתָ
  choice: cho … uống
  rationale: Diễn đạt tự nhiên ý gây khiến của động từ Hiphil שקה.
- source_word: בְּעִירָם
  choice: gia súc của họ
  rationale: בְּעִיר chỉ các động vật nuôi nói chung; “gia súc” là cách gọi hiện đại, rộng và dễ hiểu.
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: con và A-rôn, anh con
  rationale: Giữ nguyên việc nêu đích danh cả hai người và quan hệ anh em; “con” phù hợp với lời Đức Chúa Trời trực tiếp phán với Môi-se trong văn phong Kinh Thánh trang trọng.
theological_decisions:
- issue: Tính công khai của mệnh lệnh làm phép lạ
  choice: Giữ nguyên “trước mắt họ”, cho thấy Môi-se và A-rôn phải phán với tảng đá trong sự chứng kiến của cộng đồng.
  alternative: Lược thành “trước mặt họ” hoặc “để họ thấy”.
  rationale: לְעֵינֵיהֶם nhấn mạnh sự chứng kiến công khai, điều quan trọng đối với diễn tiến và sự căng thẳng thần học trong phần còn lại của câu chuyện.
- issue: Chủ thể được lệnh phán với tảng đá
  choice: Dùng “hai con” vì וְדִבַּרְתֶּם là động từ số nhiều, bao gồm Môi-se và A-rôn.
  alternative: Dùng số ít và hiểu chỉ Môi-se phải nói.
  rationale: Hình thái số nhiều của bản Hê-bơ-rơ cần được thể hiện, không nên âm thầm quy mệnh lệnh riêng cho Môi-se.
- issue: Quan hệ giữa tảng đá cho nước và Môi-se làm nước chảy ra
  choice: 'Giữ cả hai cách diễn đạt liên tiếp: tảng đá cho nước, rồi Môi-se làm cho nước chảy ra.'
  alternative: Gộp hai vế thành một mô tả duy nhất về việc nước xuất hiện.
  rationale: Bản Hê-bơ-rơ cố ý đặt hai mệnh đề cạnh nhau; giữ cả hai bảo tồn sự căng thẳng về tác nhân thay vì giải thích thay cho văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “con” trong lời Đức Chúa Trời nói trực tiếp với Môi-se; dùng “triệu tập cộng đồng” để diễn đạt mệnh lệnh tập hợp toàn dân. Tên riêng theo dạng quen thuộc A-rôn.
