  source_fidelity: Bản dịch nhìn chung theo sát trình tự mệnh lệnh và phản ánh đúng số nhiều của וְדִבַּרְתֶּם bằng “hai con”. Tuy nhiên, “phán với tảng đá” thêm sắc thái thẩm quyền không có trong động từ דבר אל, vốn chỉ đơn giản là “nói với”.
  naturalness: Câu văn trang trọng và dễ hiểu, nhưng “phán với tảng đá” không tự nhiên trong tiếng Việt hiện đại khi chủ ngữ là Môi-se và A-rôn. “Nói với tảng đá” vừa tự nhiên vừa sát nguồn hơn.
  terminology: “Cây gậy”, “cộng đồng”, “gia súc”, và dạng tên “A-rôn” đều phù hợp. Đại từ “con” nhất quán với lối văn Kinh Thánh Việt ngữ trong lời Đức Chúa Trời nói với Môi-se.
