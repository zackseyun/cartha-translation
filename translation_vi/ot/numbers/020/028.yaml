  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּפְשֵׁט֩ מֹשֶׁ֨ה אֶֽת אַהֲרֹ֜ן אֶת בְּגָדָ֗י/ו וַ/יַּלְבֵּ֤שׁ אֹתָ/ם֙ אֶת אֶלְעָזָ֣ר בְּנ֔/וֹ וַ/יָּ֧מָת אַהֲרֹ֛ן שָׁ֖ם בְּ/רֹ֣אשׁ הָ/הָ֑ר וַ/יֵּ֧רֶד מֹשֶׁ֛ה וְ/אֶלְעָזָ֖ר מִן הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: vi
  text: Môi-se cởi y phục của A-rôn và mặc y phục ấy cho Ê-lê-a-sa, con trai A-rôn[a]. A-rôn chết tại đó, trên đỉnh núi[b]. Sau đó, Môi-se và Ê-lê-a-sa đi xuống khỏi núi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đây là y phục chính thức của A-rôn trong chức vụ tư tế, được chuyển cho Ê-lê-a-sa trong việc kế nhiệm được mô tả ở văn cảnh xung quanh.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “trên chóp núi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: cởi áo của
  rationale: Dạng Hifil của פשט ở đây chỉ hành động cởi y phục khỏi một người. Cách nói này tự nhiên trong tiếng Việt và không gợi sắc thái làm nhục ngoài văn cảnh.
- source_word: בְּגָדָיו
  choice: áo của A-rôn
  rationale: בגד là từ thông dụng chỉ y phục. Tiếng Việt dùng “áo” tự nhiên trong kết cấu cởi rồi mặc lại; ý nghĩa lễ phục tư tế được giải thích ở chú thích thay vì thêm vào chính văn.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: mặc những áo ấy cho Ê-lê-a-sa, con trai ông
  rationale: Dạng Hifil của לבש nghĩa là mặc y phục cho người khác. “Những áo ấy” nối rõ với y phục vừa cởi khỏi A-rôn; “con trai ông” giữ quan hệ thân thuộc mà không lặp tên nặng nề.
- source_word: וַיָּמָת
  choice: qua đời
  rationale: מות nghĩa là chết. “Qua đời” là cách diễn đạt hiện đại, trang nghiêm và vẫn nêu rõ sự chết, không làm thay đổi nội dung.
- source_word: שָׁם
  choice: tại đó
  rationale: Giữ rõ trạng từ chỉ địa điểm trong nguyên văn.
- source_word: בְּרֹאשׁ הָהָר
  choice: trên đỉnh núi
  rationale: רֹאשׁ theo nghĩa không gian là phần đầu, chóp hay đỉnh. “Trên đỉnh núi” tự nhiên và giữ hình ảnh địa hình.
- source_word: וַיֵּרֶד
  choice: đi xuống
  rationale: ירד nghĩa là đi xuống. “Đi xuống” trung tính về điểm nhìn và phù hợp lối kể chuyện tiếng Việt.
- source_word: מִן הָהָר
  choice: từ trên núi
  rationale: Diễn đạt tự nhiên hướng di chuyển xuống khỏi núi, tương ứng với giới từ מִן chỉ điểm xuất phát.
theological_decisions:
- issue: Tính chất y phục được chuyển từ A-rôn sang Ê-lê-a-sa
  choice: Giữ từ thông dụng “áo” trong chính văn và giải thích chức năng tư tế trong chú thích
  alternative: Dịch trực tiếp là “lễ phục tư tế” hoặc “phẩm phục”
  rationale: Danh từ בגד trong câu là từ thông dụng chỉ y phục; văn cảnh cho thấy đây là y phục chức vụ của A-rôn và việc chuyển giao gắn với sự kế nhiệm. Chú thích truyền đạt bối cảnh ấy mà không đưa điều hàm ý vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng tên riêng theo lối phiên âm quen thuộc trong tiếng Việt. Chia câu để lời kể sáng rõ nhưng giữ nguyên trình tự hành động của tiếng Hê-bơ-rơ; mọi dấu chú thích đều xuất hiện trong chính văn.
