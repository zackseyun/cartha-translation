  text: וַ/יָּ֨רֶם מֹשֶׁ֜ה אֶת יָד֗/וֹ וַ/יַּ֧ךְ אֶת הַ/סֶּ֛לַע בְּ/מַטֵּ֖/הוּ פַּעֲמָ֑יִם וַ/יֵּצְאוּ֙ מַ֣יִם רַבִּ֔ים וַ/תֵּ֥שְׁתְּ הָ/עֵדָ֖ה וּ/בְעִירָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: vi
  text: Bấy giờ, Môi-se giơ tay lên, dùng cây gậy của mình đập vào tảng đá hai lần. Nước tuôn ra dồi dào, và cộng đồng cùng đàn gia súc của họ đều uống.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם ... אֶת־יָדוֹ
  choice: giơ tay lên
  rationale: Diễn đạt tự nhiên động tác nâng tay của Môi-se, giữ đầy đủ hình ảnh cụ thể trong tiếng Hê-bơ-rơ.
- source_word: וַיַּךְ
  choice: đập
  rationale: Động từ נכה chỉ hành động đánh vào vật; “đập vào” tự nhiên và rõ trong ngữ cảnh dùng gậy tác động lên tảng đá.
- source_word: הַסֶּלַע
  choice: tảng đá
  rationale: סֶלַע ở đây là khối đá được Môi-se đập; “tảng đá” cụ thể và tự nhiên hơn chỉ nói “đá”.
- source_word: בְּמַטֵּהוּ
  choice: dùng cây gậy của mình
  rationale: מַטֶּה là gậy cầm tay; cấu trúc “dùng ...” diễn đạt phương tiện tự nhiên trong tiếng Việt, còn “của mình” làm rõ hậu tố ngôi thứ ba số ít.
- source_word: פַּעֲמָיִם
  choice: hai lần
  rationale: Chuyển tải trực tiếp dạng số đôi, đồng thời là cách nói thông dụng trong tiếng Việt.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: Nước tuôn ra dồi dào
  rationale: רַבִּים diễn tả lượng nước rất nhiều; “tuôn ra dồi dào” vừa giữ ý phong phú vừa phù hợp với chuyển động của nước trong văn kể chuyện.
- source_word: הָעֵדָה
  choice: cộng đồng
  rationale: עֵדָה chỉ toàn thể cộng đồng Ít-ra-ên tụ họp; “cộng đồng” rõ nghĩa, hiện đại và không thu hẹp thành một thiết chế tôn giáo.
- source_word: וּבְעִירָם
  choice: cùng đàn gia súc của họ
  rationale: בְּעִירָם nói chung về súc vật thuộc về dân chúng; “gia súc” không thu hẹp vào riêng bò, còn “đàn” tạo cách diễn đạt tự nhiên.
theological_decisions:
- issue: Cách thuật lại việc Môi-se đập tảng đá
  choice: Chỉ thuật rằng ông dùng gậy đập tảng đá hai lần
  alternative: Thêm vào câu chữ sự phán xét rằng hành động ấy là bất tuân
  rationale: Bản thân câu này kể hành động và kết quả, còn ý nghĩa phán xét xuất hiện trong văn mạch kế tiếp. Không nên đưa lời giải thích thần học vào ngay phần dịch.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “Môi-se” theo lối phiên âm quen thuộc; không thêm chú giải vì câu không có dị bản hay điểm mơ hồ nào cần đánh dấu trong dòng chính.
