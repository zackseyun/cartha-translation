  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/007.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; cũng có thể phiên là “Giê-hô-va”; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Nêu các cách đọc và cách dịch khác của danh riêng Đức Chúa Trời.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ Piel của דבר trong công thức tường thuật chỉ hành động nói. “Phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời theo bốn phụ âm Hê-bơ-rơ YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu chỉ việc nói với một người, “với” là cách dùng tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Đây là công thức dẫn nhập lời nói sắp theo sau; “rằng” truyền đạt chức năng ấy tự nhiên và gọn trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh riêng YHWH. Giữ “Yahweh” bảo tồn sự phân biệt giữa danh riêng và tước hiệu, còn chú thích ghi nhận cách đọc truyền thống và lối thay thế bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn. Dùng “phán” theo lối nói tiếng Việt khi Đức Chúa Trời truyền lời; dấu hai chấm báo hiệu nội dung lời phán tiếp nối ở câu sau.
