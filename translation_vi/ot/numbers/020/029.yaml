  source_fidelity: 'Bản dịch theo sát cú pháp và ý nghĩa của bản Hê-bơ-rơ: toàn thể cộng đồng «thấy/nhận ra» rằng A-rôn đã chết, rồi toàn nhà Y-sơ-ra-ên khóc thương ông ba mươi ngày. «Thấy rằng» giữ được động từ ראה mà không loại trừ sắc thái nhận biết; chú thích nêu đúng khả năng ngữ nghĩa này. «Đã qua đời» diễn đạt phù hợp, trang trọng cho גוע trong tiếng Việt hiện đại.'
  naturalness: Câu văn tự nhiên, rõ ràng và có văn phong trang trọng phù hợp tường thuật Ngũ Kinh. «Khóc thương A-rôn suốt ba mươi ngày» là cách diễn đạt Việt ngữ thông suốt. Sự lặp lại «toàn thể cộng đồng» và «cả nhà Y-sơ-ra-ên» phản ánh hai cách gọi tập thể khác nhau của nguyên văn.
  terminology: «A-rôn», «Y-sơ-ra-ên», «toàn thể cộng đồng», và «cả nhà Y-sơ-ra-ên» nhất quán, dễ hiểu. Chú thích b giải thích cần thiết rằng «cả nhà Y-sơ-ra-ên» là thành ngữ tập thể, tránh hiểu theo nghĩa một hộ gia đình.
