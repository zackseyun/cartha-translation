  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: vi
  text: Khi toàn thể cộng đồng thấy rằng A-rôn đã qua đời[a], cả nhà Y-sơ-ra-ên[b] đều khóc thương A-rôn suốt ba mươi ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhận ra rằng A-rôn đã qua đời.” Nguyên văn tiếng Hê-bơ-rơ là “thấy rằng A-rôn đã qua đời”; động từ “thấy” cũng có thể bao hàm ý nhận biết sự việc ấy.'
    reason: lexical_alternative
  - marker: b
    text: “Cả nhà Y-sơ-ra-ên” là cách nói mang tính tập thể, chỉ toàn thể dân Y-sơ-ra-ên.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: thấy
  rationale: Động từ ראה có nghĩa cơ bản là “thấy”; trong ngữ cảnh này cũng có thể bao hàm ý nhận ra một sự việc. Giữ “thấy” bảo tồn cách diễn đạt của tiếng Hê-bơ-rơ, còn chú thích nêu sắc thái khả hữu.
- source_word: כָּל הָעֵדָה
  choice: toàn thể cộng đồng
  rationale: עֵדָה chỉ cộng đồng dân Y-sơ-ra-ên với tư cách một tập thể. “Toàn thể cộng đồng” tự nhiên trong tiếng Việt hiện đại và không nhất thiết hàm ý một buổi nhóm họp cụ thể.
- source_word: כִּי
  choice: rằng
  rationale: 'Ở đây כִּי dẫn vào nội dung mà cộng đồng thấy hoặc nhận ra: A-rôn đã qua đời.'
- source_word: גָוַע
  choice: đã qua đời
  rationale: גוע là động từ chỉ sự chết hoặc trút hơi thở cuối cùng. “Đã qua đời” vừa trang trọng, tự nhiên, vừa thể hiện hành động đã xảy ra trước phản ứng của cộng đồng.
- source_word: וַיִּבְכּוּ
  choice: khóc thương
  rationale: בכה có nghĩa trực tiếp là khóc. “Khóc thương” giữ được hành động khóc và làm rõ rằng họ khóc vì A-rôn qua đời, thay vì chỉ dùng từ rộng hơn là “để tang”.
- source_word: אֶת אַהֲרֹן
  choice: A-rôn
  rationale: Sau בכה, dấu hiệu tân ngữ אֶת giới thiệu người được khóc thương; tiếng Việt diễn đạt tự nhiên là “khóc thương A-rôn”.
- source_word: שְׁלֹשִׁים יוֹם
  choice: suốt ba mươi ngày
  rationale: Cụm này là đối cách chỉ khoảng thời gian. “Suốt ba mươi ngày” diễn đạt rõ tính liên tục của thời gian trong tiếng Việt.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: cả nhà Y-sơ-ra-ên
  rationale: “Nhà Y-sơ-ra-ên” giữ hình ảnh tập thể của thành ngữ בֵּית יִשְׂרָאֵל, thay vì giản lược thành “toàn dân Y-sơ-ra-ên”; từ “cả” tương ứng với כֹּל.
theological_decisions: []
translation_notes:
  register: 'Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt: “A-rôn” và “Y-sơ-ra-ên”. Cấu trúc câu bám sát diễn tiến của nguyên văn nhưng thêm “đều” và “suốt” để câu tự nhiên, đồng thời vẫn giữ nguyên ý nghĩa.'
