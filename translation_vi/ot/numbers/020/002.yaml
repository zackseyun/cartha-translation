  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: vi
  text: Cộng đồng không có nước, và họ tụ họp chống lại Môi-se và A-rôn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “hội chúng” hay “cộng đoàn”. Từ Hê-bơ-rơ עֵדָה chỉ dân Y-sơ-ra-ên được quy tụ thành một cộng đồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: Không có
  rationale: Cấu trúc היה với danh từ không xác định diễn tả sự hiện hữu; “không có” là cách nói tự nhiên trong tiếng Việt. Liên từ וְ được thể hiện qua quan hệ nối tiếp dẫn đến “nên” ở mệnh đề sau.
- source_word: מַיִם
  choice: nước
  rationale: Dạng số nhiều chỉ chất liệu trong tiếng Hê-bơ-rơ được dịch bằng danh từ khối tự nhiên trong tiếng Việt.
- source_word: לָ/עֵדָה
  choice: cho cộng đồng
  rationale: עֵדָה chỉ tập thể dân Y-sơ-ra-ên, thường với sắc thái một cộng đồng được quy tụ; “cộng đồng” rõ nghĩa và tự nhiên đối với độc giả hiện đại.
- source_word: וַ/יִּקָּהֲלוּ
  choice: nên họ tụ tập
  rationale: Động từ קהל diễn tả việc tập hợp thành nhóm. “Tụ tập” giữ được hành động tập thể; “nên” làm rõ quan hệ diễn tiến/hệ quả tự nhiên trong ngữ cảnh mà không thêm ý tương phản.
- source_word: עַל מֹשֶׁה וְ/עַל אַהֲרֹן
  choice: chống lại Môi-se và A-rôn
  rationale: Trong bối cảnh tranh cãi, עַל mang sắc thái đối nghịch. “Chống lại” thể hiện đúng hướng thù nghịch; việc lặp giới từ trong tiếng Hê-bơ-rơ không cần lặp máy móc trong tiếng Việt vì cả hai người vẫn rõ ràng là đối tượng của sự chống đối.
