  - severity: low
    issue: “Nói với người” hơi không tự nhiên trong văn xuôi Việt hiện đại.
    rationale: “Nói với ông ấy” là cách quy chiếu ngôi ba tự nhiên hơn; vẫn phản ánh đại từ nam tính số ít của אֵלָיו và không tự ý thêm tên riêng.
