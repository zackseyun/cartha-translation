base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: vi
  text: 'Nhưng Ê-đôm nói với ông ấy: “Ngươi không được đi qua đất ta[a]; nếu không, ta sẽ cầm gươm ra đối đầu với ngươi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sát nghĩa là “đi qua ta”. Ê-đôm nói như một quốc gia-lãnh thổ, nên câu này có nghĩa là đi qua đất Ê-đôm.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ra gặp ngươi”; trong ngữ cảnh này, cụm từ chỉ việc tiến ra để chống lại bằng vũ lực.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ אמר ở dạng kể chuyện được chuyển tự nhiên bằng “nói” trong lời dẫn trực tiếp.
- source_word: אֵלָיו
  choice: với người
  rationale: Đại từ số ít giống đực chỉ người nhận lời trong ngữ cảnh; “với người” giữ cách quy chiếu mà không tự ý nêu danh tính.
- source_word: אֱדוֹם
  choice: Ê-đôm
  rationale: Tên riêng của dân tộc đồng thời chỉ lãnh thổ; dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: לֹא תַעֲבֹר
  choice: Ngươi không được đi qua
  rationale: Thể chưa hoàn thành ngôi hai số ít mang lực cấm đoán hoặc từ chối dứt khoát; “không được” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: בִּי
  choice: qua đất ta
  rationale: Nghĩa sát là “qua ta/trong ta”, nhưng Ê-đôm được nhân cách hóa như một quốc gia-lãnh thổ; “qua đất ta” truyền đạt đúng ý địa lý và vẫn giữ lời nói ở ngôi thứ nhất.
- source_word: פֶּן
  choice: nếu không
  rationale: Trong lời đe dọa, פֶּן nêu hậu quả nếu lời cấm bị vi phạm; “nếu không” tự nhiên hơn “kẻo” trong cấu trúc tiếng Việt này.
- source_word: בַּחֶרֶב
  choice: mang gươm
  rationale: Cụm Hê-bơ-rơ chỉ hành động vũ trang bằng gươm; “mang gươm” giữ hình ảnh cụ thể và hợp với động từ “ra”.
- source_word: אֵצֵא
  choice: ta sẽ ... ra
  rationale: Động từ יצא ngôi thứ nhất số ít trong lời đe dọa hướng tới tương lai; “sẽ ... ra” diễn đạt đúng sắc thái.
- source_word: לִקְרָאתֶךָ
  choice: đối đầu với ngươi
  rationale: Nghĩa cơ bản là “đi ra gặp ngươi”, nhưng trong ngữ cảnh có gươm, cuộc gặp mang tính thù địch; “đối đầu” truyền đạt sắc thái ấy mà không thêm kết quả giao chiến.
