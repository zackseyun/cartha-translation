  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “ngươi/ta” phù hợp với lời của một quốc gia-vua chúa gửi cho bên đối thoại và giữ sắc thái cứng rắn của lời cấm. Dấu chú thích được đặt đúng sau các cụm từ mà chúng giải thích.
