  source_fidelity: Bản nháp phản ánh đúng mạch đối lập, lời từ chối, việc Ê-đôm đi ra gặp phía Y-sơ-ra-ên, và hai cụm diễn tả lực lượng đông cùng sức mạnh. Tuy nhiên, “sức mạnh hùng hậu” không phải kết hợp từ tự nhiên trong tiếng Việt và làm nhòe cách diễn đạt thứ hai của tiếng Hê-bơ-rơ.
