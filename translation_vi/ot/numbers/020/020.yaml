  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: vi
  text: 'Nhưng ông nói: “Ngươi không được đi qua.” Rồi Ê-đôm kéo ra đón họ[a] với một lực lượng đông đảo[b] và sức mạnh lớn[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đối đầu với họ.” Cụm từ Hê-bơ-rơ tự nó có nghĩa trung tính là đi ra gặp hoặc đón, nhưng trong ngữ cảnh này rõ ràng mang tính thù địch.
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “với một dân nặng,” một cách nói chỉ một đoàn người đông đảo hoặc đáng gờm.'
    reason: lexical_alternative
  - marker: c
    text: 'Nghĩa đen: “với một bàn tay mạnh,” tức là với quyền lực hoặc vũ lực mạnh mẽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng ông nói
  rationale: Liên từ nối tiếp diễn tiến câu chuyện, nhưng trong ngữ cảnh mang sắc thái tương phản với lời thỉnh cầu trước đó; “ông” giữ chủ thể số ít được hiểu từ ngữ cảnh.
- source_word: לֹא תַעֲבֹר
  choice: Ngươi không được đi qua
  rationale: Thể chưa hoàn thành ở đây diễn đạt lời cấm hoặc khước từ dứt khoát; cách dịch tự nhiên và trang trọng trong lời trực tiếp.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: Rồi Ê-đôm kéo ra
  rationale: יצא có nghĩa cơ bản là đi/ra; “kéo ra” tự nhiên trong ngữ cảnh một lực lượng tiến ra đối diện, nhưng không xác định quá mức rằng đó là một trận đánh.
- source_word: לִקְרָאתוֹ
  choice: đón họ
  rationale: Thành ngữ có nghĩa cơ bản là đi ra gặp/đón. Đại từ Hebrew ở số ít, quy chiếu tập thể đến Y-sơ-ra-ên; tiếng Việt dùng “họ” để tránh hiểu nhầm là chỉ một cá nhân, còn sắc thái đối đầu được giải thích trong chú thích.
- source_word: בְּעַם כָּבֵד
  choice: với một lực lượng đông đảo
  rationale: Nghĩa đen là “với một dân nặng”; כבד ở đây diễn tả một đoàn người lớn hoặc đáng gờm. “Lực lượng đông đảo” truyền đạt thành ngữ phù hợp bối cảnh.
- source_word: וּבְיָד חֲזָקָה
  choice: và sức mạnh hùng hậu
  rationale: Thành ngữ “bằng/với bàn tay mạnh” chỉ quyền lực hoặc sức mạnh áp đảo. Cách dịch này tự nhiên trong tiếng Việt, còn hình ảnh nguyên văn được lưu ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” trong lời từ chối trực tiếp để giữ sắc thái cứng rắn; “Ê-đôm” là chủ thể tập thể nên đại từ số ít Hebrew được diễn đạt tự nhiên bằng “họ” trong tiếng Việt. Mọi dấu chú thích đều xuất hiện ngay sau cụm từ liên quan.
