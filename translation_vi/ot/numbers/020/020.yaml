  rationale: 'Chỉ sửa một kết hợp từ không tự nhiên trong tiếng Việt: “sức mạnh hùng hậu” thành “sức mạnh lớn.” Bản sửa vẫn phân biệt “lực lượng đông đảo” (bְּעַם כָּבֵד) với sức mạnh/quyền lực (וּבְיָד חֲזָקָה), đồng thời giữ nguyên các điểm mơ hồ và các chú thích từ vựng.'
