id: NUM.20.13
reference: Numbers 20:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: vi
  text: Đây là nước Mê-ri-ba,[a] nơi con cái Y-sơ-ra-ên đã tranh cãi với Đức Giê-hô-va, và Ngài đã tỏ mình là thánh giữa họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mê-ri-ba có nghĩa là “tranh cãi” hoặc “tranh chấp.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ngài đã được tỏ là thánh trong họ” hoặc “Ngài đã chứng tỏ mình là thánh qua họ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: Đây là
  rationale: Đại từ chỉ định mở đầu công thức nhận diện. Tiếng Việt dùng “Đây là” tự nhiên, không cần biểu thị số nhiều trên đại từ.
- source_word: מֵי מְרִיבָה
  choice: nước Mê-ri-ba
  rationale: Cụm từ chỉ vùng nước mang địa danh Mê-ri-ba; giữ địa danh trong chính văn và giải thích ý nghĩa từ nguyên ở chú thích.
- source_word: רָבוּ
  choice: đã tranh cãi
  rationale: Động từ ריב diễn tả sự tranh chấp hoặc cãi cọ; “tranh cãi” rõ nghĩa, hiện đại và phù hợp văn cảnh.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Đây là cách gọi tập thể quen thuộc, trang trọng trong tiếng Việt, phản ánh thành ngữ Hê-bơ-rơ mà không khiến độc giả hiểu rằng chỉ nói đến nam giới.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu; dạng “Đức Giê-hô-va” đã quen thuộc và trang trọng trong tiếng Việt.
- source_word: וַיִּקָּדֵשׁ
  choice: Ngài đã tỏ mình là thánh
  rationale: 'Nifal của קדש ở đây có sắc thái bị động-phản thân: sự thánh khiết của Đức Giê-hô-va được biểu lộ qua biến cố. Cách dịch này tự nhiên và tránh hàm ý rằng con người khiến Ngài trở nên thánh.'
- source_word: בָּם
  choice: giữa họ
  rationale: Giới từ ב với hậu tố số nhiều có thể mang nghĩa “trong, giữa, qua”; “giữa họ” diễn tả tự nhiên việc sự thánh khiết của Đức Giê-hô-va được bày tỏ trong mối liên hệ với dân.
theological_decisions:
- issue: Cách diễn đạt việc Đức Giê-hô-va được thánh hóa trong mệnh đề cuối
  choice: Ngài đã tỏ mình là thánh giữa họ
  alternative: Ngài đã được tỏ là thánh trong họ / Ngài đã chứng tỏ mình là thánh qua họ
  rationale: Dạng Nifal cho phép cách hiểu bị động hoặc phản thân. Chính văn dùng cách diễn đạt phản thân tự nhiên trong tiếng Việt, còn chú thích giữ các khả năng bị động và phương tiện để không xóa bỏ sự mơ hồ của nguyên văn.
- issue: Cách dịch בְנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên / dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh này, thành ngữ chỉ toàn thể cộng đồng giao ước. “Con cái Y-sơ-ra-ên” vừa bảo tồn hình ảnh thân tộc vừa tránh thu hẹp ý nghĩa vào nam giới mà nguyên văn không nhất thiết có ý loại trừ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các tên riêng theo dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt; dùng “Ngài” cho Đức Giê-hô-va. Hai chú thích bảo tồn ý nghĩa của địa danh và độ mở ngữ pháp-thần học của mệnh đề cuối.
