revisions:
- from: 'Con dân Y-sơ-ra-ên nói với vua ấy: “Chúng tôi sẽ đi lên theo đường cái. Nếu tôi và gia súc của tôi uống nước của vua, tôi sẽ trả tiền nước. Tôi chỉ xin đi bộ ngang qua thôi, không có gì khác.”'
  to: 'Người Y-sơ-ra-ên nói với vua: “Chúng tôi sẽ đi lên theo đường cái. Nếu tôi và gia súc của tôi uống nước của ngài, tôi sẽ trả giá cho nước ấy. Tôi sẽ chỉ đi qua bằng chân, không gì khác.”'
  rationale: Chỉnh câu để lời Việt tự nhiên hơn, phục hồi đại từ trực tiếp “ngài,” và tránh thu hẹp thành ngữ “bằng chân tôi” thành nghĩa đen “đi bộ.” Bản sửa vẫn giữ “đi lên,” sự chuyển đổi “chúng tôi/tôi,” ý trả tiền nước, và tính giới hạn của lời yêu cầu.
