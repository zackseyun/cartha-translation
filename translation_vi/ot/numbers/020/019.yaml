base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: vi
  text: 'Người Y-sơ-ra-ên nói với vua: “Chúng tôi sẽ đi lên theo đường cái. Nếu tôi và gia súc của tôi uống nước của ngài, tôi sẽ trả giá cho nước ấy. Tôi sẽ chỉ đi qua bằng chân, không gì khác.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, chỉ dân Y-sơ-ra-ên như một cộng đồng, đồng thời còn phản ánh phần nào thành ngữ Hê-bơ-rơ 'các con trai của Y-sơ-ra-ên'.
- source_word: בַּמְסִלָּה
  choice: theo đường cái
  rationale: מְסִלָּה chỉ con đường chính hoặc đường đắp cao; 'theo đường cái' diễn đạt rõ việc họ cam kết đi đúng tuyến đường đã có.
- source_word: נַעֲלֶה
  choice: chúng tôi sẽ đi lên
  rationale: Giữ nghĩa cơ bản 'đi lên' của động từ, không đồng nhất nó với động từ 'đi ngang qua' ở cuối câu.
- source_word: מֵימֶיךָ
  choice: nước của vua
  rationale: Danh từ 'nước' ở dạng số nhiều theo lối Hê-bơ-rơ nhưng tiếng Việt dùng số ít tập hợp tự nhiên; đại từ kính ngữ 'vua' phù hợp với người được thưa chuyện trong ngữ cảnh.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: tôi và gia súc của tôi uống
  rationale: Giữ sự chuyển từ chủ thể số nhiều sang ngôi thứ nhất số ít, trong đó người nói đại diện cho toàn dân; 'gia súc' bao quát nghĩa của מִקְנֶה.
- source_word: וְנָתַתִּי מִכְרָם
  choice: tôi sẽ trả tiền nước
  rationale: Diễn đạt tự nhiên ý trả giá cho lượng nước đã dùng; hậu tố số nhiều theo hình thức quy chiếu về 'nước' trong tiếng Hê-bơ-rơ.
- source_word: רַק אֵין דָּבָר
  choice: chỉ ... thôi, không có gì khác
  rationale: Giữ cả sắc thái giới hạn của רַק và thành ngữ giảm nhẹ yêu cầu אֵין דָּבָר.
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: tôi ... đi bộ ngang qua
  rationale: Phản ánh hình ảnh nguyên văn 'bằng chân tôi' bằng thành ngữ Việt tự nhiên 'đi bộ', đồng thời giữ ý chỉ quá cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và dễ hiểu. Dùng 'vua' làm đại từ xưng hô theo ngữ cảnh đối thoại với vua Ê-đôm; giữ sự chuyển đổi có thật từ 'chúng tôi' sang 'tôi' trong bản Hê-bơ-rơ thay vì âm thầm làm đồng nhất.
