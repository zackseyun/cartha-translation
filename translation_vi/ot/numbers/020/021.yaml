translation:
  language: vi
  text: Nhưng Ê-đôm không cho dân Y-sơ-ra-ên đi qua lãnh thổ của mình, nên Y-sơ-ra-ên quay đi khỏi Ê-đôm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: không cho
  rationale: Động từ מאן diễn tả sự từ chối; kết hợp với נְתֹן tạo thành cách nói tự nhiên trong tiếng Việt là “không cho”.
- source_word: אֱדוֹם
  choice: Ê-đôm
  rationale: Tên riêng của dân tộc/quốc gia được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: נְתֹן
  choice: cho
  rationale: Trong kết cấu với מאן, נתן mang nghĩa cho phép, nên “không cho” diễn đạt tự nhiên và chính xác.
- source_word: עֲבֹר
  choice: đi qua
  rationale: עבר trong ngữ cảnh di chuyển qua vùng đất chỉ việc quá cảnh; “đi qua” rõ ràng và tự nhiên.
- source_word: בִּגְבֻלוֹ
  choice: qua lãnh thổ mình
  rationale: גְּבוּל có thể chỉ biên giới, ranh giới hoặc lãnh thổ; ở đây, lời xin quá cảnh cho thấy nghĩa phù hợp là “lãnh thổ”.
- source_word: וַיֵּט
  choice: quay đi
  rationale: נטה chỉ việc đổi hướng hoặc rẽ khỏi; “quay đi” giữ được ý Y-sơ-ra-ên đổi lộ trình.
- source_word: מֵעָלָיו
  choice: khỏi họ
  rationale: Cụm từ diễn tả sự rời xa Ê-đôm. “Họ” hiểu Ê-đôm theo nghĩa tập thể là dân Ê-đôm, tự nhiên hơn đại từ số ít trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dân Y-sơ-ra-ên” để làm rõ tên dân tộc; dùng “họ” cho Ê-đôm theo nghĩa tập thể. Không thêm chú thích vì phương án “quay đi” truyền đạt đủ nghĩa trong ngữ cảnh.
