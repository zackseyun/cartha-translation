  text: וַ/יַּקְהִ֜לוּ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן אֶת הַ/קָּהָ֖ל אֶל פְּנֵ֣י הַ/סָּ֑לַע וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְעוּ נָא֙ הַ/מֹּרִ֔ים הֲ/מִן הַ/סֶּ֣לַע הַ/זֶּ֔ה נוֹצִ֥יא לָ/כֶ֖ם מָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: vi
  text: 'Bấy giờ, Môi-se và A-rôn tập hợp cộng đồng trước tảng đá. Ông nói với họ: “Hãy nghe đây, hỡi những kẻ phản nghịch! Chúng ta sẽ khiến nước từ tảng đá này chảy ra cho các ngươi sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Chúng ta sẽ lấy nước từ tảng đá này ra cho các ngươi sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: tập hợp
  rationale: Dạng Hiphil của קהל mang nghĩa khiến người ta tụ họp; “tập hợp” tự nhiên và giữ được sắc thái tác động.
- source_word: הַקָּהָל
  choice: cộng đồng
  rationale: Chỉ toàn thể dân chúng đang được triệu tập; “cộng đồng” tự nhiên trong tiếng Việt hiện đại và tránh sắc thái giáo hội có thể gắn với “hội chúng”.
- source_word: אֶל־פְּנֵי הַסָּלַע
  choice: trước tảng đá
  rationale: Diễn đạt trực tiếp thành ngữ chỉ vị trí ở phía trước mặt tảng đá.
- source_word: וַיֹּאמֶר
  choice: Ông nói
  rationale: Động từ ở số ít, tự nhiên quy chiếu về Môi-se sau chủ ngữ kép; không nêu đích danh vượt quá hình thức của nguyên văn.
- source_word: שִׁמְעוּ נָא
  choice: Hãy nghe đây
  rationale: Giữ mệnh lệnh trực tiếp và sắc thái thúc giục của נָא, thay vì hiểu nó đơn thuần là lời xin lịch sự.
- source_word: הַמֹּרִים
  choice: hỡi những kẻ phản nghịch
  rationale: Phân từ dùng như danh từ từ מרה mô tả những người có thái độ chống nghịch; cách gọi này giữ sức nặng của lời quở trách.
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: từ tảng đá này
  rationale: Giới từ מן biểu thị nguồn xuất phát; “từ tảng đá này” là cách dịch trung tính, tự nhiên.
- source_word: נוֹצִיא
  choice: chúng ta sẽ lấy ... ra ... sao?
  rationale: Dạng Hiphil của יצא có nghĩa làm cho đi ra, tức lấy ra; cấu trúc nghi vấn giữ tính chất câu hỏi tu từ và ngôi thứ nhất số nhiều.
- source_word: מָיִם
  choice: nước
  rationale: Tương đương thông dụng và chính xác của מַיִם.
theological_decisions:
- issue: Ngôi thứ nhất số nhiều trong câu hỏi của Môi-se
  choice: Chúng ta sẽ lấy nước từ tảng đá này ra cho các ngươi sao?
  alternative: Đức Chúa Trời sẽ lấy nước từ tảng đá này ra cho các ngươi sao?
  rationale: Nguyên văn dùng rõ ràng ngôi thứ nhất số nhiều נוֹצִיא. Bản dịch giữ nguyên sự căng thẳng về vai trò của Môi-se và A-rôn so với quyền năng của Đức Chúa Trời, không giải thích thay cho mạch truyện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Môi-se”, “A-rôn” theo dạng tên quen thuộc trong tiếng Việt; “các ngươi” thể hiện lời quở trách gay gắt trong ngữ cảnh. Dấu [a] được đặt ngay sau câu có phương án dịch khác.
