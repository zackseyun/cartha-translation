source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח מֹשֶׁ֧ה מַלְאָכִ֛ים מִ/קָּדֵ֖שׁ אֶל מֶ֣לֶךְ אֱד֑וֹם כֹּ֤ה אָמַר֙ אָחִ֣י/ךָ יִשְׂרָאֵ֔ל אַתָּ֣ה יָדַ֔עְתָּ אֵ֥ת כָּל הַ/תְּלָאָ֖ה אֲשֶׁ֥ר מְצָאָֽתְ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: vi
  text: 'Bấy giờ, Môi-se sai các sứ giả từ Ca-đe đến với vua Ê-đôm: “Ít-ra-ên, người anh em của vua, nói thế này: Vua biết mọi nỗi gian truân đã xảy đến với chúng tôi.[a][b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ít-ra-ên, người bà con của vua.” Tiếng Hê-bơ-rơ dùng cách nói thân tộc “người anh em của vua”, gợi đến quan hệ tổ tiên giữa Ê-đôm và Ít-ra-ên.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mọi nỗi khốn khó” hoặc “mọi cảnh khốn cùng.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “đã gặp chúng tôi” hoặc “đã tìm thấy chúng tôi”; nghĩa là “đã xảy đến với chúng tôi” hay “đã ập đến với chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Bấy giờ ... sai
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt trình tự tự nhiên trong tiếng Việt, còn “sai” phù hợp với việc cử người thi hành sứ mạng.
- source_word: מַלְאָכִים
  choice: các sứ giả
  rationale: Trong bối cảnh ngoại giao, từ này chỉ những người được phái đi truyền đạt thông điệp, không phải thiên sứ.
- source_word: מִקָּדֵשׁ
  choice: từ Ca-đe
  rationale: Giữ đúng địa danh Kadesh như bản Hê-bơ-rơ, không thêm “Ba-nê-a” vốn không xuất hiện trong câu.
- source_word: מֶלֶךְ אֱדוֹם
  choice: vua Ê-đôm
  rationale: Cách dịch trực tiếp, tự nhiên của kết cấu sở hữu trong nguyên văn.
- source_word: כֹּה אָמַר
  choice: nói thế này
  rationale: Diễn đạt tự nhiên công thức truyền tin ngoại giao, trong đó sứ giả chuyển nguyên lời của người sai mình.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: Ít-ra-ên, người anh em của vua
  rationale: Giữ nguyên ngôn ngữ thân tộc có chủ ý giữa Ít-ra-ên và Ê-đôm; “của vua” thể hiện đại từ ngôi hai số ít trong lối xưng hô ngoại giao trang trọng.
- source_word: אַתָּה יָדַעְתָּ
  choice: Vua biết
  rationale: Thể hoàn thành ở đây diễn tả trạng thái hiểu biết hiện tại; đại từ được thể hiện bằng “Vua”, phù hợp lời thưa với một vị vua.
- source_word: כָּל הַתְּלָאָה
  choice: mọi nỗi gian truân
  rationale: Diễn đạt phạm vi của danh từ chỉ khó nhọc, khốn khó hay hoạn nạn bằng tiếng Việt trang trọng nhưng dễ hiểu.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: đã xảy đến với chúng tôi
  rationale: Chuyển ngữ tự nhiên thành ngữ Hê-bơ-rơ theo nghĩa đen là điều “đã tìm gặp chúng tôi”, đồng thời không làm mất sắc thái những biến cố ập đến.
theological_decisions:
- issue: Ngôn ngữ thân tộc giữa Ít-ra-ên và Ê-đôm
  choice: Ít-ra-ên, người anh em của vua
  alternative: Ít-ra-ên, người bà con của vua
  rationale: Nguyên văn chủ ý dùng “anh em”, gợi đến quan hệ tổ tiên giữa Gia-cốp và Ê-sau. Bản dịch giữ hình ảnh thân tộc trực tiếp thay vì khái quát hóa thành “bà con”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “vua” làm đại từ kính trọng trong thông điệp ngoại giao; giữ các tên riêng theo dạng phiên âm quen dùng và bảo tồn hình ảnh “anh em” của nguyên văn.
