  - severity: low
    issue: «và nói» làm câu có thể được hiểu là Môi-se trực tiếp nói.
    rationale: Nguyên văn chuyển sang công thức sứ điệp sau đối tượng «vua Ê-đôm»; dùng dấu hai chấm biểu thị lời nhắn rõ hơn.
