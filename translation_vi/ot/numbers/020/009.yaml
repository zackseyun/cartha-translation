id: NUM.20.9
reference: Numbers 20:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: vi
  text: Vậy Môi-se lấy cây gậy[a] từ trước mặt Yahweh, đúng như Ngài đã truyền cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cây trượng.”
    reason: מַטֶּה có thể chỉ gậy hoặc trượng; “cây trượng” là một cách dịch khả dĩ nhưng trang trọng hơn.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Động từ לקח ở thể Qal trong mạch kể chuyện diễn tả hành động đơn giản là “lấy”; không cần thêm sắc thái “nhấc lên” hay “nhận lấy”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: הַמַּטֶּה
  choice: cây gậy
  rationale: מַטֶּה ở đây chỉ một vật cụ thể; “cây gậy” là cách nói tự nhiên, dễ hiểu trong tiếng Việt. “Cây trượng” là phương án trang trọng và truyền thống hơn nên được ghi ở chú thích.
- source_word: מִלִּפְנֵי
  choice: từ trước mặt
  rationale: Giữ hướng nghĩa của giới từ מִן (“từ”) cùng nghĩa không gian cụ thể của לִפְנֵי (“trước mặt”), đồng thời bảo toàn bối cảnh vật ấy được đặt trước Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp trực tiếp với danh יְהוָה trong bản Hê-bơ-rơ.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn đạt tự nhiên ý tương ứng chính xác với mệnh lệnh đã ban trước đó.
- source_word: צִוָּהוּ
  choice: Ngài đã truyền cho ông
  rationale: “Đã truyền” thể hiện mệnh lệnh xảy ra trước hành động lấy gậy; “Ngài” chỉ Yahweh và “ông” chỉ Môi-se theo mạch văn.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יְהוָה; giữ “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Vậy” nối câu với diễn tiến trước đó; “đúng như” nhấn mạnh Môi-se làm theo mệnh lệnh. Đại từ “Ngài” dành cho Yahweh và “ông” dành cho Môi-se giúp câu tiếng Việt rõ ràng mà không thêm nội dung.
