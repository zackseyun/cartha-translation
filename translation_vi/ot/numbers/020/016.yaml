source:
  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: vi
  text: Chúng tôi đã kêu cầu Yahweh; Ngài nghe tiếng chúng tôi, sai một thiên sứ[a] và đưa chúng tôi ra khỏi Ai Cập. Kìa, chúng tôi đang ở Kadesh, một thành nằm ở rìa biên giới của ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “một sứ giả.” Từ Hê-bơ-rơ có thể chỉ sứ giả loài người hoặc sứ giả từ trời; trong ngữ cảnh này, nhiều người hiểu đó là một thiên sứ do Đức Chúa Trời sai đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: chúng tôi đã kêu cầu
  rationale: Động từ צעק diễn tả tiếng kêu khẩn thiết xin cứu giúp; “kêu cầu” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái cầu cứu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng cách phiên chuyển trực tiếp, thay vì thay bằng một tước hiệu.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: Ngài nghe tiếng chúng tôi
  rationale: Giữ hình ảnh cụ thể “nghe tiếng” của nguyên văn, đồng thời câu vẫn tự nhiên trong tiếng Việt.
- source_word: מַלְאָךְ
  choice: một thiên sứ
  rationale: Trong ngữ cảnh được Yahweh sai đến để giải cứu Israel khỏi Ai Cập, “thiên sứ” là cách hiểu tự nhiên; tuy nhiên, từ Hê-bơ-rơ cũng có thể chỉ một sứ giả nói chung, nên phương án ấy được bảo lưu trong chú thích.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: đưa chúng tôi ra khỏi Ai Cập
  rationale: Thể khiến của יצא có nghĩa là “đưa ra”; cách diễn đạt này rõ ràng và tự nhiên.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: “Kìa” giữ chức năng thu hút sự chú ý vào hoàn cảnh hiện tại mà không dùng lối diễn đạt quá dài.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: một thành nằm ở rìa biên giới của ngài
  rationale: Diễn đạt vị trí của Kadesh tại điểm ngoài cùng của biên giới/lãnh thổ Ê-đôm bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Danh tính của מַלְאָךְ trong lời nhắc đến cuộc xuất hành
  choice: Dịch là “một thiên sứ” nhưng không xác định cụ thể danh tính hay bản thể của vị này.
  alternative: một sứ giả
  rationale: Ngữ cảnh thuận với một sứ giả từ trời do Yahweh sai đến, nhưng chính câu này không nói rõ hơn và danh từ Hê-bơ-rơ có phạm vi nghĩa rộng hơn; chú thích bảo tồn sự mơ hồ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” viết hoa chỉ Yahweh; “ngài” viết thường là cách xưng hô kính trọng với vua Ê-đôm. Dấu chú thích [a] được đặt ngay sau từ mà chú thích giải thích.
