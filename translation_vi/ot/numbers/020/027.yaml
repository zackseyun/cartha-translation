id: NUM.20.27
reference: Numbers 20:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַֽ/יַּעֲלוּ֙ אֶל הֹ֣ר הָ/הָ֔ר לְ/עֵינֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: vi
  text: Môi-se làm đúng như Yahweh đã truyền, rồi họ đi lên núi Hô-rơ trước mắt toàn thể hội chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói “trước mắt toàn thể hội chúng”, nghĩa là công khai, trước sự chứng kiến của toàn dân đang tụ họp.
    reason: Giải thích thành ngữ và hàm ý công khai của לְעֵינֵי כָּל הָעֵדָה.
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר
  choice: làm đúng như
  rationale: Diễn đạt tự nhiên sự vâng phục chính xác của Môi-se đối với mệnh lệnh vừa được ban, đồng thời giữ quan hệ so sánh của כַּאֲשֶׁר.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Truyền” giữ được sắc thái mệnh lệnh có thẩm quyền và phù hợp với văn phong Kinh Thánh hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וַיַּעֲלוּ
  choice: họ đi lên
  rationale: Giữ nghĩa chuyển động đi lên của עלה bằng cách nói tự nhiên trong tiếng Việt.
- source_word: אֶל הֹר הָהָר
  choice: lên núi Hô-rơ
  rationale: Dùng dạng địa danh tự nhiên trong tiếng Việt; giới từ “lên” đồng thời thể hiện אֶל và hướng chuyển động của động từ.
- source_word: לְעֵינֵי
  choice: trước mắt
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ và hàm ý hành động diễn ra công khai, trong tầm nhìn của dân chúng.
- source_word: כָּל הָעֵדָה
  choice: toàn thể hội chúng
  rationale: עֵדָה chỉ cộng đồng Israel được tập hợp; “hội chúng” trang trọng nhưng vẫn dễ hiểu, còn “toàn thể” thể hiện כָּל.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; chuyển tự “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
translation_notes:
  register: Văn phong trần thuật trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
