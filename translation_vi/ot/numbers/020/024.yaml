source:
  edition: WLC
  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: vi
  text: A-rôn sẽ được quy tụ về với dân mình[a], vì ông sẽ không vào miền đất Ta đã ban cho con cái Y-sơ-ra-ên, do các ngươi đã chống nghịch mệnh lệnh Ta[b] tại các dòng nước Mê-ri-ba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “được quy tụ về với dân mình.” Đây là thành ngữ trang trọng nói về cái chết; bản văn không chỉ đơn thuần nói “A-rôn sẽ chết”.'
    reason: idiom
  - marker: b
    text: 'Nguyên văn: “miệng Ta”, một cách nói chỉ lời phán hoặc mệnh lệnh của Ta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: sẽ được quy tụ
  rationale: Giữ thể bị động và thành ngữ trang trọng về cái chết, thay vì diễn giải phẳng thành “sẽ chết”.
- source_word: אֶל עַמָּיו
  choice: về với dân mình
  rationale: Diễn đạt tự nhiên hướng chuyển động của אֶל, đồng thời giữ hình ảnh A-rôn được quy tụ với cộng đồng tổ tiên của mình mà không thu hẹp nghĩa thành riêng “tổ tiên”.
- source_word: כִּי
  choice: vì
  rationale: Thể hiện rõ quan hệ nguyên nhân giữa việc A-rôn bị quy tụ và việc ông không được vào đất.
- source_word: יָבֹא אֶל הָאָרֶץ
  choice: sẽ không vào miền đất
  rationale: “Vào miền đất” là cách nói tự nhiên trong tiếng Việt và giữ nguyên ý chuyển động vào vùng đất được Đức Chúa Trời ban.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Giữ danh từ giao ước ở mức khái quát, không thêm tính từ “hứa” vốn không có trong câu Hê-bơ-rơ.
- source_word: אֲשֶׁר נָתַתִּי
  choice: Ta đã ban
  rationale: Thể hoàn thành được chuyển bằng “đã ban”, nhấn mạnh hành động ban đất là chắc chắn và đã được xác lập.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con cái Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” vừa phản ánh công thức Hê-bơ-rơ theo nghĩa hậu duệ của Y-sơ-ra-ên, vừa là cách diễn đạt tự nhiên và bao quát trong tiếng Việt.
- source_word: עַל אֲשֶׁר
  choice: bởi
  rationale: Chuyển tải sắc thái chỉ nguyên nhân của sự phán xét mà không làm câu nặng nề.
- source_word: מְרִיתֶם
  choice: các ngươi đã chống lại
  rationale: Động từ số nhiều chỉ Môi-se và A-rôn; “chống lại” giữ mức độ nghiêm trọng của hành vi bất tuân và phù hợp với bổ ngữ “lệnh Ta”.
- source_word: אֶת־פִּי
  choice: lệnh Ta
  rationale: Nguyên văn là “miệng Ta”, một hoán dụ chỉ lời phán hay mệnh lệnh của Đức Chúa Trời. “Lệnh Ta” truyền đạt rõ nghĩa trong tiếng Việt hiện đại, còn nghĩa đen được giữ ở chú thích.
- source_word: לְמֵי מְרִיבָה
  choice: tại vùng nước Mê-ri-ba
  rationale: Giữ Mê-ri-ba như địa danh/sự kiện và diễn đạt tự nhiên vị trí nơi hành vi chống nghịch xảy ra.
theological_decisions:
- issue: Thành ngữ về cái chết “được quy tụ về với dân mình”
  choice: Giữ thành ngữ trong chính văn
  alternative: Dịch trực tiếp là “A-rôn sẽ chết”
  rationale: Thành ngữ Hê-bơ-rơ không chỉ thông báo cái chết mà còn gợi sự thuộc về dân tộc và tổ tiên. Giữ hình ảnh này bảo toàn chiều sâu văn chương và thần học, nhưng không khẳng định một học thuyết cụ thể về đời sau.
- issue: Cách hiểu בְּנֵי יִשְׂרָאֵל
  choice: “con cái Y-sơ-ra-ên”
  alternative: “các con trai Y-sơ-ra-ên” hoặc “dân Y-sơ-ra-ên”
  rationale: Trong công thức dân tộc học này, בְּנֵי chỉ toàn thể hậu duệ/dân tộc chứ không chỉ nam giới. “Con cái Y-sơ-ra-ên” giữ quan hệ dòng dõi trong nguyên ngữ mà không loại phụ nữ khỏi đối tượng được nói đến.
- issue: Hoán dụ “miệng Ta”
  choice: Dịch theo nghĩa là “lệnh Ta” và ghi nghĩa đen trong chú thích
  alternative: Giữ nguyên “miệng Ta” trong chính văn
  rationale: Cụm từ nói về mệnh lệnh do Đức Chúa Trời phán. Bản dịch theo nghĩa giúp độc giả hiện đại hiểu đúng hành vi chống nghịch mà vẫn bảo tồn hình ảnh nguyên ngữ qua chú thích.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Đại từ “Ta” thể hiện lời Đức Chúa Trời; “các ngươi” giữ ngôi thứ hai số nhiều hướng đến Môi-se và A-rôn. Các tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
