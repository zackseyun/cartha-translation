revisions:
- from: A-rôn sẽ được quy tụ về với dân mình[a], vì ông sẽ không vào miền đất Ta đã ban cho con cái Y-sơ-ra-ên, bởi các ngươi đã chống lại lệnh Ta[b] tại vùng nước Mê-ri-ba.
  to: A-rôn sẽ được quy tụ về với dân mình[a], vì ông sẽ không vào miền đất Ta đã ban cho con cái Y-sơ-ra-ên, do các ngươi đã chống nghịch mệnh lệnh Ta[b] tại các dòng nước Mê-ri-ba.
  rationale: Bản sửa bảo toàn thành ngữ “được quy tụ về với dân mình,” quan hệ nhân quả kép, và hoán dụ “miệng Ta/mệnh lệnh Ta.” “Các dòng nước Mê-ri-ba” sát với danh ngữ số nhiều trong nguyên văn hơn “vùng nước,” đồng thời vẫn tự nhiên trong tiếng Việt hiện đại. Chú thích được thu gọn để làm rõ từ ngữ mà không áp đặt diễn giải thần học hoặc hậu thế học cụ thể.
  reviewer_model: gpt-5.6-terra
