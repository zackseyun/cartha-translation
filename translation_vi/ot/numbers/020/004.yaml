  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: vi
  text: Vậy tại sao các ông đưa hội chúng của Yahweh vào hoang mạc này, để chúng tôi và gia súc của chúng tôi chết ở đó?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָמָה
  choice: Vậy tại sao
  rationale: Giữ liên từ mở đầu và sắc thái chất vấn tiếp nối lời than phiền trước đó; cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: הֲבֵאתֶם
  choice: các ông lại đưa
  rationale: Thể Hiphil của בוא mang nghĩa ‘đưa vào/đem đến’; ‘lại’ chuyển tải tự nhiên sắc thái trách cứ trong ngữ cảnh, còn chủ ngữ số nhiều được diễn đạt là ‘các ông’.
- source_word: קְהַל יְהוָה
  choice: hội chúng của Yahweh
  rationale: קָהָל chỉ cộng đồng được triệu tập hay quy tụ; ‘hội chúng’ giữ sắc thái tập thể mà không đồng nhất với một cơ cấu giáo hội hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng thần thánh YHWH thay vì thay thế bằng một tước hiệu.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: vào hoang mạc này
  rationale: מִדְבָּר là vùng hoang vu, khô cằn hoặc thảo nguyên; ‘hoang mạc’ rộng nghĩa hơn ‘sa mạc’ và ‘vào’ phù hợp với chuyển động của động từ.
- source_word: לָמוּת שָׁם
  choice: phải chết tại đây
  rationale: Động từ nguyên mẫu có thể chỉ mục đích hoặc kết quả; ‘để... phải chết’ giữ được cả lời quy trách lẫn hậu quả được hình dung. שָׁם quy chiếu đến nơi họ đang ở nên ‘tại đây’ tự nhiên trong lời nói trực tiếp.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: chúng tôi và gia súc của chúng tôi
  rationale: Giữ đại từ nhấn mạnh cùng danh từ tập hợp בְּעִיר, chỉ vật nuôi/gia súc nói chung.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng giao ước יהוה; phiên âm ‘Yahweh’ bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Quan hệ của קהל với יהוה
  choice: hội chúng của Yahweh
  alternative: cộng đồng thuộc về Yahweh
  rationale: Giữ cấu trúc sở hữu/liên hệ ngắn gọn của tiếng Hê-bơ-rơ mà không giải thích quá mức bản chất thần học của mối quan hệ này.
- issue: Sắc thái của לָמוּת
  choice: để ... phải chết
  alternative: khiến ... chết
  rationale: Nguyên mẫu có thể biểu thị mục đích được người nói quy kết hoặc kết quả; cách dịch đã chọn không quyết định dứt khoát giữa hai sắc thái ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời chất vấn trực tiếp. Dùng ‘các ông’ để thể hiện chủ ngữ số nhiều hướng đến Môi-se và A-rôn; dùng ‘chúng tôi’ nhằm phân biệt rõ nhóm người nói với người bị chất vấn.
