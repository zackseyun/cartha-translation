translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngài” giữ sắc thái kính trọng của một lời xin phép ngoại giao. Các lời cam kết được trình bày dứt khoát nhưng không cổ kính hóa.
