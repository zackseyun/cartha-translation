language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: vi
  text: Xin cho chúng tôi đi qua đất của ngài. Chúng tôi sẽ không đi qua ruộng đồng hay vườn nho, cũng không uống nước giếng. Chúng tôi sẽ đi theo con đường của vua[a], không rẽ sang phải hay sang trái cho đến khi chúng tôi qua khỏi biên giới của ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đường cái của vua” hoặc “vương lộ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “biên giới của ngài”; từ được dùng cũng có thể chỉ địa phận hoặc lãnh thổ trong phạm vi ranh giới.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: Xin cho chúng tôi đi qua
  rationale: Thể cohortative đi với נָא diễn tả một lời thỉnh cầu lịch sự; cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái xin phép.
- source_word: בְאַרְצֶךָ
  choice: qua đất của ngài
  rationale: Với động từ עבר, giới từ ב chỉ sự di chuyển xuyên qua một vùng đất; “đất” chuyển tải trực tiếp אֶרֶץ, còn “ngài” phù hợp với lời ngoại giao kính trọng.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: Chúng tôi sẽ không đi qua ruộng đồng hay vườn nho
  rationale: Hai danh từ số ít được dùng theo nghĩa khái quát về đất canh tác. “Hay” diễn đạt tự nhiên phạm vi phủ định của lời cam kết.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: cũng không uống nước giếng
  rationale: מֵי בְאֵר có nghĩa là nước từ giếng; “nước giếng” ngắn gọn, rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: con đường của vua
  rationale: Cụm từ có nghĩa đen là “đường của vua”, có thể chỉ một tuyến đường được công nhận hoặc do vua quản lý. Cách dịch chính giữ cấu trúc nguồn mà không ấn định quá mức tính chất của tuyến đường.
- source_word: נֵלֵךְ
  choice: Chúng tôi sẽ đi theo
  rationale: הלך ở đây nói đến việc di chuyển dọc theo tuyến đường đã nêu; “đi theo” là cách nói tự nhiên trong tiếng Việt.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: không rẽ sang phải hay sang trái
  rationale: Giữ nguyên cặp phương hướng của tiếng Hê-bơ-rơ và truyền đạt lời hứa không đi chệch khỏi tuyến đường.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: cho đến khi đi qua hết địa phận của ngài
  rationale: גְּבוּל có thể chỉ đường biên hoặc lãnh thổ nằm trong đường biên. Trong ngữ cảnh hành trình xuyên qua Ê-đôm, “đi qua hết địa phận” diễn đạt tự nhiên ý đi ra ngoài ranh giới cuối cùng, đồng thời chú thích bảo lưu nghĩa sát chữ.
