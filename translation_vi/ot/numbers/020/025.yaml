source:
  edition: WLC
  text: קַ֚ח אֶֽת אַהֲרֹ֔ן וְ/אֶת אֶלְעָזָ֖ר בְּנ֑/וֹ וְ/הַ֥עַל אֹתָ֖/ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: vi
  text: Hãy dẫn A-rôn và Ê-lê-a-sa, con trai ông, rồi đưa họ lên núi Hô-rơ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח
  choice: dẫn
  rationale: Động từ mệnh lệnh Qal có nghĩa cơ bản là “lấy/đem”; khi đối tượng là người và tiếp theo là việc cùng đưa họ lên núi, “dẫn” tự nhiên trong tiếng Việt mà vẫn giữ ý Môi-se phải đưa họ theo.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: אֶלְעָזָר
  choice: Ê-lê-a-sa
  rationale: Dạng phiên âm tên riêng rõ ràng, phù hợp lối ghi tên Kinh Thánh bằng tiếng Việt.
- source_word: בְּנוֹ
  choice: con trai ông
  rationale: Hậu tố ngôi ba số ít giống đực tự nhiên nhất quy chiếu về A-rôn; cụm này xác định Ê-lê-a-sa là con trai ông.
- source_word: וְהַעַל
  choice: rồi đưa ... lên
  rationale: Thể Hiphil mệnh lệnh của עלה mang nghĩa khiến hoặc đưa ai đi lên; “đưa họ lên” vừa giữ sắc thái khiến/chủ động vừa tự nhiên trong tiếng Việt.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ tân ngữ chỉ chung A-rôn và Ê-lê-a-sa.
- source_word: הֹר הָהָר
  choice: núi Hô-rơ
  rationale: Cách diễn đạt địa danh tự nhiên trong tiếng Việt, tương ứng với cấu trúc Hê-bơ-rơ theo nghĩa đen “Hô-rơ, ngọn núi”.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại, dễ hiểu. Dùng “dẫn” cho קַח để tránh cách nói gượng “hãy lấy A-rôn”; dùng “đưa họ lên” để biểu đạt rõ sắc thái causative của וְהַעַל. Không cần chú thích vì “núi Hô-rơ” chuyển tải tự nhiên cấu trúc địa danh Hê-bơ-rơ mà không làm mất nội dung đáng kể.
