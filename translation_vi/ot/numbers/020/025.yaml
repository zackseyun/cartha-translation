  source_fidelity: 'Bản dịch chuyển tải đúng hai mệnh lệnh: לקחת là “dẫn” (đưa đi/cầm theo trong ngữ cảnh người), và העל là “đưa ... lên,” giữ được sắc thái khiến/đưa lên của Hiphil. “Họ” quy chiếu đúng A-rôn và Ê-lê-a-sa; “núi Hô-rơ” là cách Việt hóa tự nhiên của địa danh הֹר הָהָר.'
