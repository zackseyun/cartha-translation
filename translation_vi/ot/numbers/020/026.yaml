revisions:
- from: Hãy cởi áo của A-rôn và mặc những áo ấy cho Ê-lê-a-sa, con trai ông. Rồi A-rôn sẽ được quy tụ[a] và chết tại đó.
  to: Hãy cởi y phục của A-rôn, rồi mặc chúng cho Ê-lê-a-sa, con trai ông. Rồi A-rôn sẽ được quy tụ[a] và chết tại đó.
  rationale: Thay “áo” bằng “y phục” và dùng đại từ “chúng” để phản ánh rõ các y phục số nhiều, đồng thời giữ văn phong trang trọng. Giữ nguyên thành ngữ “được quy tụ” không kèm “về với dân mình”, bởi nguyên văn câu này không có bổ ngữ đó. Chú thích bảo tồn thông tin thành ngữ cần thiết mà không diễn giải quá mức chính văn.
  reviewer_model: gpt-5.6-terra
