  text: וְ/הַפְשֵׁ֤ט אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/הִלְבַּשְׁתָּ֖/ם אֶת אֶלְעָזָ֣ר בְּנ֑/וֹ וְ/אַהֲרֹ֥ן יֵאָסֵ֖ף וּ/מֵ֥ת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: vi
  text: Hãy cởi y phục của A-rôn, rồi mặc chúng cho Ê-lê-a-sa, con trai ông. Rồi A-rôn sẽ được quy tụ[a] và chết tại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Được quy tụ” là một thành ngữ Hê-bơ-rơ dùng trong bối cảnh nói về cái chết; ở những chỗ khác có dạng đầy đủ hơn là “được quy tụ về với dân mình.”
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט
  choice: Hãy cởi áo của
  rationale: Thể Hiphil mệnh lệnh của פשט ở đây truyền lệnh cởi y phục khỏi một người; cách diễn đạt này trực tiếp và tự nhiên trong tiếng Việt.
- source_word: בְּגָדָיו
  choice: áo của A-rôn / những áo ấy
  rationale: בגד chỉ y phục nói chung. Ngữ cảnh cho thấy đây là lễ phục tư tế, nhưng nguyên văn câu này chỉ nói 'áo/y phục', nên không thêm 'tư tế' vào chính văn.
- source_word: וְהִלְבַּשְׁתָּם
  choice: mặc những áo ấy cho
  rationale: Hiphil diễn tả việc khiến Ê-lê-a-sa mặc các áo vừa được cởi khỏi A-rôn; 'mặc ... cho' rõ nghĩa và giữ đại từ số nhiều 'chúng' bằng 'những áo ấy'.
- source_word: אֶת אֶלְעָזָר בְּנוֹ
  choice: Ê-lê-a-sa, con trai ông
  rationale: Giữ tên riêng và quan hệ cha con, đồng thời dùng trật tự tự nhiên trong tiếng Việt; 'ông' quy chiếu về A-rôn.
- source_word: יֵאָסֵף
  choice: sẽ được quy tụ
  rationale: Niphal của אסף là một thành ngữ liên quan đến cái chết. Bản dịch giữ hình ảnh 'được quy tụ' và không tự ý thêm 'về với dân mình', vì cụm ấy không có trong câu Hê-bơ-rơ này.
- source_word: וּמֵת
  choice: và chết
  rationale: Tiếp nối ý tương lai của יֵאָסֵף, diễn đạt kết quả kế tiếp một cách ngắn gọn và sát nguyên văn.
- source_word: שָׁם
  choice: tại đó
  rationale: Tương đương tự nhiên và trang trọng vừa phải của trạng từ chỉ nơi chốn שָׁם.
theological_decisions:
- issue: Thành ngữ về sự chết trong יֵאָסֵף
  choice: Giữ thành ngữ là 'sẽ được quy tụ'.
  alternative: sẽ được quy tụ về với dân mình; sẽ qua đời
  rationale: Nguyên văn chỉ có động từ 'được quy tụ', không có bổ ngữ 'về với dân mình'. Giữ cách nói cô đọng bảo toàn sắc thái văn chương và thần học mà không mở rộng theo các câu song song hay đồng nhất nó hoàn toàn với động từ 'chết' ngay sau đó.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'áo' thay vì từ chuyên biệt hơn để không diễn giải quá mức בְּגָדָיו; giữ riêng thành ngữ 'được quy tụ' trước 'và chết' nhằm phản ánh cấu trúc và độ hàm súc của nguyên văn.
