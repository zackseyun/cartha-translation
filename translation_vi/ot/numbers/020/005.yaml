source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: vi
  text: Và tại sao các ông lại đưa chúng tôi lên khỏi Ai Cập để đem chúng tôi vào nơi khốn khổ này? Đây chẳng phải là nơi để gieo trồng[a]; cũng không có cây vả, cây nho hay cây lựu, và cũng chẳng có nước để uống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “nơi của hạt giống”, có thể chỉ nơi thích hợp để gieo trồng hoặc nơi sinh ra ngũ cốc, hoa màu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Và tại sao
  rationale: Giữ liên từ để phản ánh lời than phiền đang tiếp diễn, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: các ông lại đưa chúng tôi lên khỏi Ai Cập
  rationale: Giữ hình ảnh đi lên của động từ עלה và sắc thái chất vấn, trách móc của câu.
- source_word: לְהָבִיא אֹתָנוּ
  choice: để đem chúng tôi vào
  rationale: Diễn đạt rõ ý mục đích của động từ nguyên mẫu và kết hợp tự nhiên với địa điểm theo sau.
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: vào nơi khốn khổ này
  rationale: רַע ở đây mô tả nơi chốn có hại, tồi tệ và đáng chán, chứ không nhất thiết mang nghĩa xấu xa về đạo đức.
- source_word: לֹא מְקוֹם זֶרַע
  choice: Đây chẳng phải là nơi để gieo trồng
  rationale: Cụm Hê-bơ-rơ sát nghĩa là 'không phải nơi của hạt giống'; trong ngữ cảnh, ý tự nhiên là nơi không thích hợp cho việc gieo trồng hoặc không sinh hoa màu.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: cũng không có cây vả, cây nho hay cây lựu
  rationale: Tên gọi các loài cây phù hợp hơn tên trái vì גֶּפֶן chỉ cây nho; cách dịch này tạo một danh sách nhất quán và tự nhiên.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: và cũng chẳng có nước để uống
  rationale: Chuyển cấu trúc chỉ sự không hiện hữu sang cách nói tiếng Việt tự nhiên mà vẫn giữ nguyên ý thiếu nước uống.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ông” vì lời này hướng đến Môi-se và A-rôn; “khốn khổ” truyền đạt sức nặng của רַע mà không hàm ý nơi chốn phạm điều ác. Dấu chấm phẩy giúp tách nhận định về khả năng canh tác khỏi danh sách cây trái và tình trạng thiếu nước.
