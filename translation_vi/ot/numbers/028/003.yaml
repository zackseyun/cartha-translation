- from: 'Ngươi hãy nói với họ: ‘Đây là lễ vật dùng lửa dâng[a] mà các ngươi phải dâng lên Yahweh: mỗi ngày hai con chiên đực một tuổi, không tì vết, làm lễ thiêu thường xuyên.’'
  to: 'Ngươi hãy nói với họ: ‘Đây là lễ vật dâng bằng lửa[a] mà các ngươi phải dâng lên Yahweh: mỗi ngày hai con chiên đực một tuổi, không tì vết, làm lễ thiêu thường lệ.’'
  rationale: Sửa cách diễn đạt của הָאִשֶּׁה để tiếng Việt tự nhiên hơn, loại bỏ sự lặp ý với động từ “dâng,” và chỉnh cách chuyển tải תָמִיד cho phù hợp sắc thái nghi lễ định kỳ. Không thay đổi nội dung hay mức độ xác định của nguyên văn.
