language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: vi
  text: 'Ngươi hãy nói với họ: ‘Đây là lễ vật dâng bằng lửa[a] mà các ngươi phải dâng lên Yahweh: mỗi ngày hai con chiên đực một tuổi, không tì vết, làm lễ thiêu thường lệ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hỏa lễ” hoặc “lễ vật dùng lửa.”'
    reason: Giữ các cách diễn đạt khả dĩ của thuật ngữ tế lễ הָאִשֶּׁה.
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: lễ vật dùng lửa dâng
  rationale: Danh từ nghi lễ này chỉ loại lễ vật được dâng bằng lửa. Cách dịch này giữ rõ yếu tố lửa trong tiếng Hê-bơ-rơ mà vẫn tự nhiên hơn một thuật ngữ ghép khó hiểu.
- source_word: תַּקְרִיבוּ
  choice: phải dâng
  rationale: Thể Hiphil của קרב trong ngữ cảnh tế lễ có nghĩa là đem đến để dâng; “dâng” là cách diễn đạt nghi lễ tự nhiên và rõ ràng trong tiếng Việt.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ tên giao ước được biểu thị trực tiếp bằng יהוה; “dâng lên” là kết hợp từ tự nhiên trong tiếng Việt.
- source_word: כְּבָשִׂים
  choice: con chiên đực
  rationale: Danh từ ở dạng giống đực, và luật tế lễ đòi hỏi nhận diện con vật đủ cụ thể.
- source_word: בְּנֵי שָׁנָה
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “con của một năm”, nhưng nghĩa thông dụng là con vật một tuổi.
- source_word: תְמִימִם
  choice: không tì vết
  rationale: Trong luật tế lễ, từ này nói đến con vật không có khuyết tật; “không tì vết” vừa chính xác vừa quen thuộc.
- source_word: לַיּוֹם
  choice: mỗi ngày
  rationale: 'Cụm này có nghĩa phân phối: hai con cho từng ngày.'
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Đây là thuật ngữ tế lễ chỉ lễ vật bị thiêu trọn; “lễ thiêu” là cách gọi ngắn gọn, rõ nghĩa trong tiếng Việt.
- source_word: תָמִיד
  choice: thường xuyên
  rationale: Trong lịch tế lễ, từ này nhấn mạnh nghi thức đều đặn, tiếp diễn theo quy định, chứ không nhất thiết là hành động không ngừng từng khoảnh khắc.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng một tước hiệu.
- issue: Sắc thái của תָמִיד trong lễ thiêu hằng ngày
  choice: thường xuyên
  alternative: liên tục; hằng dâng
  rationale: Ngữ cảnh quy định hai con mỗi ngày, nên từ này chỉ tính đều đặn, thường lệ của lễ tế; dịch “liên tục” có thể bị hiểu là việc thiêu không bao giờ gián đoạn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “ngươi/các ngươi” để phản ánh sự chuyển đổi từ số ít trong mệnh lệnh nói với Môi-se sang số nhiều trong lời ông phải truyền cho dân; dùng thuật ngữ tế lễ nhất quán và tránh lối diễn đạt quá cổ.
