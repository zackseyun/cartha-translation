  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: vi
  text: Ngoài lễ thiêu thường lệ[a] và lễ vật ngũ cốc đi kèm, anh em phải dâng các lễ vật này. Các con vật phải không tì vết[b], cùng với lễ rượu đổ của chúng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ thiêu liên tục” hoặc “lễ thiêu hằng ngày.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “chúng phải là không tì vết cho anh em,” nói về những con vật được đem dâng.'
    reason: source_form
  - marker: c
    text: 'Hay: “những lễ quán.” Đây là phần rượu được đổ ra làm lễ vật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Ngoài
  rationale: Diễn tả rằng các lễ vật vừa truyền phải được dâng thêm vào lễ thiêu thường lệ.
- source_word: עֹלַת הַתָּמִיד
  choice: lễ thiêu thường xuyên
  rationale: תָּמִיד chỉ lễ thiêu được dâng đều đặn mỗi ngày; cách dịch này giữ được ý liên tục, theo quy định, còn chú thích nêu cách hiểu cụ thể là “hằng ngày”.
- source_word: וּמִנְחָתוֹ
  choice: và lễ vật ngũ cốc đi kèm
  rationale: Trong luật tế lễ, מִנְחָה tại đây là lễ vật bằng ngũ cốc đi cùng lễ thiêu; “đi kèm” làm rõ đại từ sở hữu của tiếng Hê-bơ-rơ một cách tự nhiên.
- source_word: תַּעֲשׂוּ
  choice: anh em phải dâng
  rationale: Trong ngữ cảnh tế lễ, עשה có nghĩa thực hiện hoặc dâng lễ vật; “phải dâng” tự nhiên và chính xác hơn cách dịch máy móc là “làm”.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Các con vật phải không tì vết
  rationale: תָּמִים trong luật hiến tế mô tả con vật không có khuyết tật. Chủ thể số nhiều được nói rõ theo ngữ cảnh; thành phần לָכֶם được lược khỏi chính văn vì trong tiếng Việt sẽ nặng nề nhưng được ghi nhận trong chú thích.
- source_word: וְנִסְכֵּיהֶם
  choice: cùng với những lễ rượu đổ kèm
  rationale: נֶסֶךְ là lễ rượu được đổ ra cùng sinh tế. Cụm từ này dễ hiểu hơn thuật ngữ truyền thống “lễ quán” mà vẫn giữ hành động nghi lễ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai số nhiều; dùng “lễ rượu đổ kèm” trong chính văn để người đọc phổ thông hiểu được nghi thức, đồng thời giữ thuật ngữ truyền thống “lễ quán” trong chú thích.
