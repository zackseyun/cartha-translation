  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: vi
  text: Vào ngày mười lăm của tháng này là một kỳ lễ[a]; trong bảy ngày, bánh không men sẽ được ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lễ hội”. Từ Hê-bơ-rơ חָג có thể chỉ một kỳ lễ thánh cũng như việc ăn mừng trong kỳ lễ ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Ngày mười lăm
  rationale: Cụm giới từ mở đầu chỉ thời điểm; tiếng Việt tự nhiên dùng “Ngày mười lăm” mà không cần dịch riêng liên từ וּ.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: tháng này
  rationale: Trong ngữ cảnh lịch lễ, חֹדֶשׁ có nghĩa thông thường là “tháng”.
- source_word: חָג
  choice: một kỳ lễ
  rationale: חָג chỉ một dịp lễ hội tôn giáo, có thể bao hàm việc dự lễ và yến tiệc; “kỳ lễ” rõ nghĩa và trang trọng trong tiếng Việt.
- source_word: שִׁבְעַת יָמִים
  choice: trong bảy ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài bảy ngày mà cụm Hê-bơ-rơ xác định.
- source_word: מַצּוֹת
  choice: bánh không men
  rationale: Đây là cách gọi rõ ràng, quen thuộc cho loại bánh không dùng men trong bối cảnh kỳ lễ này.
- source_word: יֵאָכֵל
  choice: người ta phải ăn
  rationale: Thể Niphal số ít là một cấu trúc bị động vô nhân xưng, sát nghĩa là “sẽ/phải được ăn”; chuyển sang chủ động vô nhân xưng giúp tiếng Việt tự nhiên hơn, còn “phải” truyền đạt tính quy định của chỉ thị trong ngữ cảnh.
