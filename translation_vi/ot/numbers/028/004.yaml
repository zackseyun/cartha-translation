  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và các yếu tố chính của tiếng Hê-bơ-rơ: một con chiên vào buổi sáng, con thứ hai vào thời điểm בֵּין הָעַרְבָּיִם. “Dâng” là cách chuyển ngữ phù hợp trong ngữ cảnh tế lễ; “ngươi” bảo lưu ngôi thứ hai số ít của động từ. Tuy nhiên, “vào khoảng giữa hai buổi chiều” vừa thêm sắc thái xấp xỉ qua từ “khoảng”, vừa không tự nhiên; nguyên ngữ vốn dùng thành ngữ thời gian có nghĩa và thời điểm chính xác còn được tranh luận.'
