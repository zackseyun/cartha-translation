  terminology: “Con chiên”, “dâng”, “buổi sáng”, và “con chiên thứ hai” đều nhất quán với ngữ cảnh tế lễ và cách dùng tiếng Việt hiện đại. “Giữa hai buổi chiều” giữ được tính không xác định của thành ngữ בֵּין הָעַרְבָּיִם mà không áp đặt một cách hiểu thời gian cụ thể.
