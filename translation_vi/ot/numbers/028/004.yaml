  text: אֶת הַ/כֶּ֥בֶשׂ אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָֽ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: vi
  text: Một con chiên, ngươi phải dâng vào buổi sáng; còn con chiên thứ hai, ngươi phải dâng vào giữa hai buổi chiều.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “giữa hai buổi chiều”, một thành ngữ truyền thống chỉ thời điểm vào khoảng chạng vạng hoặc cuối buổi chiều.'
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: con chiên
  rationale: כֶּבֶשׂ chỉ chiên con, thường là chiên đực non trong bối cảnh tế lễ. “Con chiên” là cách diễn đạt tự nhiên và không thêm ý “đực” vốn không được nhắc lại rõ trong câu này.
- source_word: אֶחָד
  choice: một
  rationale: Giữ đúng số từ אֶחָד là “một”, thay vì đổi thành số thứ tự “thứ nhất”.
- source_word: תַּעֲשֶׂה
  choice: ngươi phải dâng
  rationale: Động từ עשה theo nghĩa đen là “làm”, nhưng trong chỉ thị tế lễ mang nghĩa chuẩn bị hoặc dâng lễ vật. “Dâng” truyền đạt rõ hành động tế lễ; “phải” thể hiện sắc thái chỉ thị của thể vị hoàn thành nối tiếp trong ngữ cảnh luật lệ.
- source_word: בַבֹּקֶר
  choice: vào buổi sáng
  rationale: Cách diễn đạt tự nhiên, trực tiếp của בֹּקֶר trong tiếng Việt hiện đại.
- source_word: הַשֵּׁנִי
  choice: con chiên thứ hai
  rationale: שֵׁנִי là số thứ tự “thứ hai”; lặp lại “con chiên” giúp câu tiếng Việt rõ nghĩa.
- source_word: בֵּין הָעַרְבָּיִם
  choice: vào khoảng giữa hai buổi chiều
  rationale: Giữ hình ảnh và tính mơ hồ thật sự của thành ngữ Hê-bơ-rơ, thay vì quyết định dứt khoát đó là lúc chạng vạng hay cuối buổi chiều; chú thích giải thích cách hiểu thời gian.
theological_decisions:
- issue: Chủ thể được truyền lệnh ở ngôi thứ hai số ít
  choice: ngươi
  alternative: các ngươi / anh em
  rationale: Động từ Hê-bơ-rơ ở ngôi thứ hai giống đực số ít. “Ngươi” bảo toàn số ít và sắc thái trang trọng của lời truyền, dù mệnh lệnh liên quan đến việc thờ phượng của cộng đồng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “ngươi” để giữ ngôi thứ hai số ít của nguyên văn. Dấu chú thích được đặt ngay sau thành ngữ mà chú thích giải thích.
