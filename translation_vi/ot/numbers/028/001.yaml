  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; cũng được phiên là “Yahweh” hoặc “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר ở thể Piel trong công thức trần thuật này chỉ hành động nói. “Phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi Đức Chúa Trời truyền lời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng YHWH thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là dạng danh xưng quen thuộc và trang trọng trong tiếng Việt.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, từ này diễn đạt tự nhiên hướng của lời nói đến Môi-se.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tiếng Việt thông dụng của tên riêng Hê-bơ-rơ מֹשֶׁה.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này mở đầu nội dung lời phán; “rằng” truyền đạt chức năng ấy tự nhiên hơn trong tiếng Việt hiện đại và tránh lối lặp “phán… nói rằng”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê) hoặc CHÚA
  rationale: Bản văn dùng trực tiếp danh YHWH. Bản dịch giữ một dạng danh riêng, không thay bằng tước hiệu, nhưng không khẳng định chắc chắn cách phát âm nguyên thủy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm báo trước nội dung lời phán ở câu tiếp theo; không thêm chú thích vì câu dịch không có ký hiệu chú thích.
