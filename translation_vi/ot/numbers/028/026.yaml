base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: vi
  text: Vào ngày hoa lợi đầu mùa, khi anh em dâng lên Yahweh một lễ vật ngũ cốc mới trong Lễ Các Tuần, anh em phải có một cuộc hội họp thánh[a]. Anh em không được làm bất cứ công việc thường ngày nào[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một cuộc triệu tập thánh”. Cụm Hê-bơ-rơ là thuật ngữ chỉ một cuộc tập hợp được triệu tập cho việc thờ phượng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “công việc lao nhọc” hoặc “công việc nghề nghiệp”. Cụm từ này nói đến công việc lao động thường lệ gắn với sinh kế hằng ngày.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: Vào ngày hoa lợi đầu mùa
  rationale: Diễn đạt tự nhiên cụm chỉ thời gian và giữ ý ngày gắn với hoa lợi đầu tiên, không biến cụm này thành một tên lễ riêng ngoài điều bản văn nói.
- source_word: בְּהַקְרִיבְכֶם
  choice: khi anh em dâng lên
  rationale: Cấu trúc nguyên mẫu với בְּ chỉ hành động đồng thời; trong ngữ cảnh tế lễ, קרב có nghĩa là đem đến hoặc dâng lễ vật.
- source_word: מִנְחָה חֲדָשָׁה
  choice: một lễ vật ngũ cốc mới
  rationale: Trong ngữ cảnh tư tế, מִנְחָה thường là lễ vật bằng ngũ cốc; 'mới' gắn với sản vật của vụ mới.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh giao ước được ghi trực tiếp bằng Tứ Tự Danh, thay vì thay bằng một tước hiệu.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: trong Lễ Các Tuần
  rationale: Danh từ số nhiều ở đây chỉ kỳ lễ được xác định theo các tuần; cách dịch này rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một hội thánh
  rationale: Cụm thuật ngữ chỉ một cuộc tập hợp được triệu tập cho mục đích thánh; 'hội thánh' ở đây được dùng theo nghĩa một cuộc hội họp thánh, không phải tên riêng của một tổ chức.
- source_word: יִהְיֶה לָכֶם
  choice: anh em phải nhóm
  rationale: Chuyển cấu trúc 'sẽ có cho anh em' thành mệnh lệnh tự nhiên trong tiếng Việt mà vẫn giữ hiệu lực quy định.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: Anh em không được làm bất cứ công việc thường ngày nào
  rationale: Cụm tư tế nói đến lao động nghề nghiệp hoặc công việc sinh kế thông thường bị cấm trong ngày lễ, chứ không nhất thiết cấm tuyệt đối mọi hoạt động.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm 'Yahweh' bảo tồn chức năng của danh giao ước mà không thay bằng tước hiệu.
- issue: Ý nghĩa của מִקְרָא קֹדֶשׁ
  choice: một hội thánh
  alternative: một cuộc triệu tập thánh; một buổi nhóm họp thánh
  rationale: 'Giữ cả hai nét nghĩa: cộng đồng được triệu tập và tính chất biệt riêng cho việc thờ phượng, không quy định thêm hình thức nghi lễ.'
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại; dùng “anh em” để thể hiện ngôi thứ hai số nhiều. Các dấu chú thích [a], [b] được đặt đúng tại những cụm từ có phương án dịch khác; sửa sự lệch dấu chú thích trong lớp tham khảo tiếng Anh.
