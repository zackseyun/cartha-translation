revisions:
- from: Vào ngày hoa lợi đầu mùa, khi anh em dâng lên Yahweh một lễ vật ngũ cốc mới trong Lễ Các Tuần, anh em phải nhóm một hội thánh[a]. Anh em không được làm bất cứ công việc thường ngày nào.[b]
  to: Vào ngày hoa lợi đầu mùa, khi anh em dâng lên Yahweh một lễ vật ngũ cốc mới trong Lễ Các Tuần, anh em phải có một cuộc hội họp thánh[a]. Anh em không được làm bất cứ công việc thường ngày nào[b].
