  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: vi
  text: và một con dê đực làm lễ vật chuộc tội[a], để thực hiện sự chuộc tội cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Trong ngữ cảnh tế lễ, từ Hê-bơ-rơ được dịch là “lễ vật chuộc tội” cũng có thể được hiểu là “lễ vật thanh tẩy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: và một con dê đực
  rationale: שָׂעִיר chỉ dê đực; tiền tố וּ được dịch là “và”, còn số lượng “một” được diễn đạt tự nhiên cùng danh từ.
- source_word: חַטָּאת
  choice: lễ vật chuộc tội
  rationale: Trong ngữ cảnh tế lễ, חַטָּאת chỉ lễ vật dâng vì tội hơn là khái niệm trừu tượng “tội lỗi”. Cách dịch này rõ ràng, quen thuộc và vẫn ghi nhận nghĩa khả dĩ “lễ vật thanh tẩy” trong chú thích.
- source_word: אֶחָד
  choice: một
  rationale: Giữ rõ số lượng của con vật hiến tế theo nguyên văn.
- source_word: לְ/כַפֵּר
  choice: để chuộc tội
  rationale: Trong ngữ cảnh tế lễ của Ngũ Kinh, כפר diễn tả việc thực hiện sự chuộc tội. Cách dịch này giữ sức nặng nghi lễ và thần học mà không xác định quá hẹp cơ chế của hành động ấy.
- source_word: עֲלֵי/כֶם
  choice: cho anh em
  rationale: עַל kèm hậu tố ngôi thứ hai số nhiều ở đây mang nghĩa vì lợi ích hoặc thay mặt cộng đồng. “Cho anh em” tự nhiên và giữ được số nhiều.
theological_decisions:
- issue: Cách dịch ngôn ngữ tế lễ כפר
  choice: để chuộc tội cho anh em
  alternative: để làm lễ xá tội cho anh em; để thực hiện sự chuộc tội thay cho anh em
  rationale: Bản dịch chính giữ ý nghĩa rộng của công thức tế lễ, không áp đặt một lý thuyết thần học cụ thể về cơ chế chuộc tội.
- issue: Ý nghĩa của חַטָּאת trong nghi lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: “Lễ vật chuộc tội” là cách nói rõ và quen thuộc trong tiếng Việt; chú thích bảo tồn khả năng hiểu thuật ngữ này theo chức năng thanh tẩy trong ngữ cảnh tế lễ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp ngữ cảnh luật tế lễ. Dùng “anh em” cho ngôi thứ hai số nhiều nhằm nói với toàn thể cộng đồng và tránh cách xưng hô quá khẩu ngữ.
