  text: וּ/מִ֨נְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֗ר וּ/שְׁנֵ֧י עֶשְׂרֹנִ֛ים לָ/אַ֖יִל תַּעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: vi
  text: 'Lễ vật ngũ cốc của chúng phải là bột mịn trộn với dầu: các ngươi phải chuẩn bị ba phần mười ê-pha cho con bò đực[a] và hai phần mười ê-pha cho con chiên đực.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ, “ba phần mười” và “hai phần mười” là cách nói rút gọn, chỉ các phần mười của một ê-pha, đơn vị đo lường khô dùng trong các quy định tế lễ.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Lễ vật ngũ cốc đi kèm các con vật ấy
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc; hậu tố số nhiều quy chiếu chung đến các con vật vừa được kể. Cụm “đi kèm” làm rõ quan hệ tự nhiên trong tiếng Việt mà không thay đổi nội dung.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: סֹלֶת là loại bột được xay mịn dùng theo quy định tế lễ; “bột mịn” chính xác, tự nhiên và dễ hiểu.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: trộn với dầu
  rationale: Phân từ bị động בְּלוּלָה cùng giới từ ב diễn tả bột đã được hòa trộn với dầu.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ba phần mười ê-pha
  rationale: עִשָּׂרוֹן là một phần mười ê-pha trong các quy định tế lễ. Nêu rõ “ê-pha” trong câu giúp độc giả tiếng Việt nhận biết đơn vị bị tỉnh lược trong tiếng Hê-bơ-rơ.
- source_word: לַפָּר
  choice: cho con bò đực
  rationale: Danh từ số ít có mạo từ chỉ con bò đực đã được quy định trong mạch văn ngay trước đó.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: và hai phần mười ê-pha
  rationale: Giữ cấu trúc song song và nêu rõ cùng một đơn vị đo như ở vế trước.
- source_word: לָאַיִל
  choice: cho con chiên đực
  rationale: אַיִל trong ngữ cảnh súc vật tế lễ là chiên đực trưởng thành; cách gọi này tự nhiên và phân biệt với chiên con.
- source_word: תַּעֲשׂוּ
  choice: các ngươi phải chuẩn bị
  rationale: Ở đây עשה diễn tả việc thực hiện hay chuẩn bị lễ vật theo chỉ thị. “Phải chuẩn bị” truyền đạt sắc thái mệnh lệnh mà không thêm ý “dâng” vốn không được nêu trực tiếp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. Dùng “các ngươi” để thể hiện lời chỉ thị trực tiếp ở số nhiều; dùng thuật ngữ nhất quán “lễ vật ngũ cốc”, “bột mịn” và “ê-pha”. Dấu chú thích [a] được đặt sau lần đầu nêu định lượng.
