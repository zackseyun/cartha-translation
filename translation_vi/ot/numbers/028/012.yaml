id: NUM.28.12
reference: Numbers 28:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: vi
  text: và ba phần mười ê-pha bột mì tinh làm lễ vật ngũ cốc[a], trộn với dầu, cho mỗi con bò đực; cùng hai phần mười ê-pha bột mì tinh làm lễ vật ngũ cốc, trộn với dầu[b], cho mỗi con chiên đực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hebrew là “ba phần mười” và “hai phần mười”; đơn vị được hiểu là phần mười của một ê-pha.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “hòa đều với dầu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: và ba phần mười ê-pha
  rationale: עֶשְׂרוֹן là đơn vị một phần mười, trong luật tế lễ được hiểu là một phần mười ê-pha. Nêu rõ ê-pha giúp độc giả hiện đại hiểu đây là đơn vị đo lường.
- source_word: סֹלֶת
  choice: bột mì tinh
  rationale: Thuật ngữ tế lễ chỉ loại bột mịn, chất lượng cao dùng làm lễ vật; “bột mì tinh” rõ nghĩa và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong ngữ cảnh tế lễ, từ này chỉ lễ vật làm từ sản phẩm ngũ cốc, không đơn thuần là một món quà hay lễ vật nói chung.
- source_word: בְּלוּלָה בַ/שֶּׁמֶן
  choice: trộn với dầu
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại và phản ánh đúng cách chuẩn bị bột được mô tả bằng phân từ Hebrew.
- source_word: לַ/פָּר הָ/אֶחָד
  choice: cho mỗi con bò đực
  rationale: Mạo từ kết hợp với אֶחָד ở đây có ý nghĩa cá thể/phân phối trong quy định tế lễ. “Mỗi con” tự nhiên hơn tiếng Việt và không biến אֶחָד thành số thứ tự “con thứ nhất”.
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: cùng hai phần mười ê-pha
  rationale: Như ở vế trước, đơn vị được hiểu là phần mười của một ê-pha; nêu rõ đơn vị để tránh mơ hồ.
- source_word: לָ/אַיִל הָ/אֶחָד
  choice: cho mỗi con chiên đực
  rationale: Cấu trúc song song với לַפָּר הָאֶחָד, mang sắc thái cá thể/phân phối chứ không phải số thứ tự.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Lễ vật ngũ cốc” giữ tính chính xác của thuật ngữ tế lễ; “mỗi con” chuyển tải tự nhiên sắc thái cá thể/phân phối của הָאֶחָד. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
