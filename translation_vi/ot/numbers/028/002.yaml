source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: vi
  text: 'Hãy truyền lệnh cho dân Y-sơ-ra-ên[a] và nói với họ: ‘Các con phải cẩn thận dâng cho Ta lễ vật của Ta—thức ăn của Ta cho các lễ vật dâng bằng lửa của Ta, hương thơm làm đẹp lòng Ta—vào thời điểm đã định.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; đây là cách gọi toàn thể dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Hãy truyền lệnh
  rationale: Động từ mệnh lệnh צוה diễn tả một chỉ thị có thẩm quyền; “truyền lệnh” giữ được sức mạnh hơn “chỉ dẫn”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Cụm từ theo nghĩa đen là “các con trai/con cái của Y-sơ-ra-ên”, nhưng trong ngữ cảnh này là danh xưng tập thể chỉ toàn dân; “dân Y-sơ-ra-ên” tự nhiên và bao quát trong tiếng Việt hiện đại.
- source_word: קָרְבָּנִי
  choice: lễ vật của ta
  rationale: קָרְבָּן là vật được đem đến dâng cho Đức Chúa Trời; “lễ vật” vừa rõ nghĩa vừa giữ sắc thái tế tự.
- source_word: לַחְמִי
  choice: thức ăn của ta
  rationale: לֶחֶם có nghĩa đen là “bánh” nhưng ở đây chỉ thức ăn trong nghi lễ hiến tế nói chung; dịch “thức ăn” tránh giới hạn sai vào bánh.
- source_word: לְאִשַּׁי
  choice: trong các lễ vật thiêu dâng
  rationale: אִשֶּׁה là thuật ngữ tế tự chỉ lễ vật được dâng trên bàn thờ, thường gắn với lửa; “lễ vật thiêu dâng” truyền đạt rõ bối cảnh mà không đồng nhất nó với riêng loại tế lễ thiêu toàn phần.
- source_word: רֵיחַ נִיחֹחִי
  choice: hương thơm làm ta vui lòng
  rationale: Cụm từ tế tự cố định này diễn tả lễ vật được Đức Chúa Trời vui nhận; bản dịch vẫn giữ hình ảnh cụ thể “hương thơm” của nguyên văn.
- source_word: תִּשְׁמְרוּ לְהַקְרִיב לִי
  choice: Các con phải lưu ý dâng lên ta
  rationale: שמר đi với động từ nguyên mẫu mang ý cẩn thận tuân giữ việc dâng lễ; “phải lưu ý” thể hiện cả nghĩa vụ lẫn sự chuyên tâm.
- source_word: בְּמוֹעֲדוֹ
  choice: đúng thời điểm ấn định
  rationale: מוֹעֵד ở đây là thời điểm đã được quy định cho việc dâng lễ; trạng từ “đúng” tự nhiên diễn đạt yêu cầu tuân thủ thời điểm ấy.
theological_decisions:
- issue: 'Ngôn ngữ nhân hình về tế lễ: “thức ăn của ta” và “hương thơm làm ta vui lòng”'
  choice: Giữ nguyên các hình ảnh tế tự cụ thể của tiếng Hê-bơ-rơ.
  alternative: Diễn giải thành “những lễ vật được ta chấp nhận”.
  rationale: Nguyên văn cố ý dùng ngôn ngữ cụ thể. Giữ hình ảnh bảo toàn sắc thái giao ước và nghi lễ, nhưng chú thích giúp người đọc hiểu đây là cách nói về sự vui nhận, không nhất thiết hàm ý Đức Chúa Trời cần thức ăn.
- issue: Danh xưng tập thể בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; con cái Y-sơ-ra-ên
  rationale: Trong câu này, cụm từ chỉ cộng đồng giao ước nói chung. “Dân Y-sơ-ra-ên” là tiếng Việt tự nhiên và không thu hẹp mệnh lệnh vào nam giới, còn nghĩa đen được ghi trong chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “ta/các con” để thể hiện lời phán trực tiếp của Đức Chúa Trời với cộng đồng qua Môi-se. Cấu trúc được sắp xếp lại vừa phải để chuỗi danh từ đồng vị trong tiếng Hê-bơ-rơ dễ hiểu bằng tiếng Việt, đồng thời vẫn giữ “lễ vật”, “thức ăn” và “hương thơm” trong câu chính.
