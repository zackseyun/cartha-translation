revisions:
- from: Ngoài lễ vật thiêu thường xuyên và lễ quán đi kèm, người ta phải dâng lên Yahweh một con dê đực làm lễ vật chuộc tội.[a]
  to: Ngoài lễ vật thiêu thường xuyên và lễ quán kèm theo lễ vật ấy, phải dâng lên Yahweh một con dê đực làm lễ vật tạ tội.[a]
  rationale: Bản sửa chỉ làm rõ đại từ sở hữu trong “lễ quán của lễ vật thiêu thường xuyên” và dùng một thuật ngữ nghi lễ ít diễn giải hơn cho חַטָּאת. Số lượng, giống đực của con vật, danh Yahweh, và quan hệ “ngoài/bổ sung cho” đều được giữ nguyên.
