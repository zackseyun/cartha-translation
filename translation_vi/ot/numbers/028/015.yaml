  - severity: low
    issue: “lễ vật chuộc tội” có sắc thái giải thích mạnh hơn cần thiết
    rationale: חַטָּאת có thể quy chiếu đến lễ vật xử lý tội lỗi hoặc ô uế. “Lễ vật tạ tội” giữ thuật ngữ nghi lễ truyền thống hơn, trong khi chú thích nêu nghĩa “thanh tẩy”.
