  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: một con dê đực, lễ vật חַטָּאת dâng cho Yahweh, và quan hệ bổ sung đối với lễ vật thiêu thường xuyên cùng lễ quán của nó. Tuy nhiên, “lễ quán đi kèm” chưa xác định rõ lễ quán thuộc về lễ vật thiêu thường xuyên; còn “chuộc tội” có thể diễn giải chức năng của חַטָּאת hẹp hơn mức từ Hê-bơ-rơ tự nó đòi hỏi.'
  naturalness: Câu hiện tại khá tự nhiên, nhưng “lễ quán đi kèm” có thể được đọc là đi kèm con dê đực. Đặt rõ cụm sở hữu “kèm theo lễ vật ấy” làm quan hệ trong tiếng Hê-bơ-rơ minh bạch hơn. “Phải dâng” vẫn là cách diễn đạt phiếm chỉ, trang trọng và tự nhiên.
  terminology: Giữ “Yahweh” nhất quán với danh יהוה. Đổi “lễ vật chuộc tội” thành “lễ vật tạ tội” để phản ánh cách gọi nghi lễ mà không xác quyết riêng cơ chế chuộc tội; chú thích vẫn bảo tồn khả năng “lễ vật thanh tẩy”. “Lễ quán” là thuật ngữ nghi lễ thích hợp, nhưng cần nêu rõ nó đi với lễ vật thiêu thường xuyên.
