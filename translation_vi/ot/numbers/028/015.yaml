source:
  edition: WLC
  text: וּ/שְׂעִ֨יר עִזִּ֥ים אֶחָ֛ד לְ/חַטָּ֖את לַ/יהוָ֑ה עַל עֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/015.yaml
  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: vi
  text: Ngoài lễ vật thiêu thường xuyên và lễ quán kèm theo lễ vật ấy, phải dâng lên Yahweh một con dê đực làm lễ vật tạ tội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ vật thanh tẩy”. Từ Hê-bơ-rơ חַטָּאת có thể chỉ lễ vật xử lý sự ô uế cũng như tội lỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: một con dê đực
  rationale: Cụm từ chỉ rõ một con dê giống đực; giữ nguyên số lượng và giới tính của con vật bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לְחַטָּאת
  choice: làm lễ vật chuộc tội
  rationale: Trong luật tế lễ, חַטָּאת chỉ lễ vật liên quan đến tội lỗi hoặc sự thanh tẩy. “Lễ vật chuộc tội” là cách gọi quen thuộc, còn nghĩa “lễ vật thanh tẩy” được giữ trong chú thích.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng “Yahweh”; kết hợp với động từ “dâng” để diễn đạt tự nhiên đối tượng tiếp nhận lễ vật.
- source_word: עַל עֹלַת הַתָּמִיד
  choice: ngoài lễ vật thiêu thường xuyên
  rationale: Trong ngữ cảnh này, עַל biểu thị sự bổ sung; עֹלַת הַתָּמִיד là lễ vật thiêu được dâng đều đặn theo quy định.
- source_word: יֵעָשֶׂה
  choice: người ta phải dâng
  rationale: Dạng bị động theo nghĩa đen là “sẽ được làm”, nhưng trong ngữ cảnh tế lễ có nghĩa là lễ vật phải được dâng. Cách diễn đạt phiếm chỉ này tự nhiên trong tiếng Việt và không xác định thêm chủ thể.
- source_word: וְנִסְכּוֹ
  choice: và lễ quán đi kèm
  rationale: נֶסֶךְ là lễ vật dạng lỏng được rót ra. “Lễ quán” là thuật ngữ Kinh Thánh gọn, còn “đi kèm” làm rõ đại từ sở hữu chỉ về lễ vật thiêu thường xuyên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Văn bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của חַטָּאת trong nghi lễ
  choice: lễ vật chuộc tội
  alternative: lễ vật thanh tẩy
  rationale: Thuật ngữ có thể nhấn mạnh việc xử lý tội lỗi hoặc sự ô uế. Bản chính dùng cách gọi quen thuộc nhưng chú thích bảo tồn nghĩa thay thế chính đáng.
- issue: Quan hệ của עַל với lễ vật thiêu thường xuyên
  choice: ngoài
  alternative: cùng với; thêm vào
  rationale: Ở đây giới từ biểu thị lễ vật bổ sung cho lễ vật thiêu thường xuyên, không mang nghĩa vị trí theo nghĩa đen.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lễ vật thiêu” và “lễ quán” làm thuật ngữ nghi lễ; đảo cụm bổ sung lên đầu câu để quan hệ giữa lễ vật bổ sung và lễ vật thường xuyên rõ ràng trong tiếng Việt.
