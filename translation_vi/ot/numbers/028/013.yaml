- from: cùng một phần mười ê-pha bột mịn làm lễ vật ngũ cốc, trộn với dầu, cho mỗi con chiên. Đó là lễ thiêu, một hương thơm đẹp lòng, một lễ vật hỏa tế[a] dâng lên Yahweh.
