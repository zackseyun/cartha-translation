source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: vi
  text: 'Và một phần mười ê-pha bột mịn, dùng làm lễ vật ngũ cốc trộn với dầu, cho mỗi con chiên: một lễ thiêu, hương thơm đẹp lòng, một lễ vật hỏa tế[a] dâng lên Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu: “một lễ vật thực phẩm”.'
    reason: Giữ lại một cách hiểu từ vựng thay thế đã được đề xuất cho אִשֶּׁה, trong khi bản văn chính dịch theo nghĩa thông dụng trong ngữ cảnh tế lễ là lễ vật dâng bằng lửa.
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: cùng một phần mười ê-pha
  rationale: Cấu trúc lặp có nghĩa phân phối theo từng con chiên; trong ngữ cảnh tế lễ, đơn vị được hiểu là một phần mười ê-pha. Bổ sung “ê-pha” giúp độc giả nhận biết đơn vị đo.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Thuật ngữ thông dụng chỉ loại bột tinh chế dùng trong tế lễ.
- source_word: מִנְחָה
  choice: lễ vật ngũ cốc
  rationale: Trong ngữ cảnh thờ phượng, từ này chỉ lễ vật làm từ sản phẩm ngũ cốc chứ không phải lễ vật nói chung.
- source_word: בְּלוּלָה בַּשֶּׁמֶן
  choice: trộn với dầu
  rationale: Diễn đạt tự nhiên trạng thái bột đã được hòa trộn với dầu.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: cho mỗi con chiên
  rationale: 'Chuyển tải nghĩa phân phối: lượng lễ vật này đi kèm từng con chiên trong số các con chiên được quy định.'
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ tế lễ chỉ lễ vật được thiêu trọn trên bàn thờ.
- source_word: רֵיחַ נִיחֹחַ
  choice: một hương thơm đẹp lòng
  rationale: Giữ hình ảnh mùi hương đồng thời diễn đạt ý lễ vật được Đức Chúa Trời vui nhận.
- source_word: אִשֶּׁה
  choice: một lễ vật hỏa tế
  rationale: Từ ngữ tế lễ có liên hệ trực tiếp với lửa; “hỏa tế” ngắn gọn, trang trọng và giữ được nét nghĩa ấy. Cách hiểu “lễ vật làm thức ăn” được ghi ở chú thích vì nguồn gốc và phạm vi nghĩa của từ còn được bàn luận.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Dùng tên giao ước được biểu thị trực tiếp bằng Tứ Tự Danh יהוה; “dâng lên” thể hiện hướng quy thuộc của lễ vật.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm “Yahweh” bảo tồn chức năng danh xưng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của אִשֶּׁה
  choice: lễ vật hỏa tế
  alternative: lễ vật làm thức ăn
  rationale: Nét nghĩa liên quan đến lửa được chứng thực rõ trong ngữ cảnh tế lễ. Tuy nhiên, cách hiểu theo thức ăn/lễ vật dành cho Đức Chúa Trời cũng có cơ sở từ cách dùng trong hệ thống tế lễ, nên được bảo tồn trong chú thích thay vì bị loại bỏ.
- issue: Quan hệ giữa lễ vật ngũ cốc và lễ thiêu
  choice: Dùng câu mới “Đó là lễ thiêu” để giữ quan hệ đồng vị trong chuỗi quy định tế lễ
  alternative: 'Nối trực tiếp bằng dấu phẩy: “cho mỗi con chiên, làm lễ thiêu”'
  rationale: Cú pháp Hê-bơ-rơ cô đọng và không nói rằng chính bột mịn là toàn bộ lễ thiêu. Cách tách câu giúp tiếng Việt sáng nghĩa nhưng vẫn để “lễ thiêu” chỉ toàn bộ lễ dâng đang được mô tả.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Giữ các thuật ngữ tế lễ nhất quán: “lễ vật ngũ cốc”, “lễ thiêu”, “lễ vật hỏa tế”. Dùng “chiên” thay cho cách gọi khẩu ngữ hơn, và giữ tên riêng “Yahweh”.'
