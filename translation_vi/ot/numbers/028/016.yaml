  verdict: revise
  source_fidelity: Bản nháp giữ đúng mốc thời gian và thuật ngữ פֶּסַח. Tuy nhiên, “dâng cho” có thể khiến “lễ Vượt Qua” bị hiểu là một lễ vật được dâng, trong khi câu chỉ nêu lễ/việc cử hành. Cụm לַיהוָה diễn tả quan hệ dành cho/thuộc về Yahweh; nên dùng cách diễn đạt không thu hẹp nghĩa.
  naturalness: Câu sửa vẫn ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. “Ngày mười bốn của tháng” bám sát công thức ngày tháng của tiếng Hê-bơ-rơ mà không cần thêm đại từ chỉ định.
  terminology: Dùng “lễ Vượt Qua” cho פֶּסַח. Danh יהוה được chuyển là “Yahweh”, phù hợp với cách chuyển danh riêng trong dấu vết thẩm định tiếng Anh; không thêm “Đức” vào danh riêng.
  issues:
