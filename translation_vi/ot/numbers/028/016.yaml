    issue: “dâng cho Đức Giê-hô-va” có thể quá chuyên biệt hóa quan hệ của לַיהוָה.
    rationale: Động từ “dâng” trong tiếng Việt thường gợi một vật tế lễ hoặc hành vi dâng hiến. Nguyên văn gọi tên lễ Vượt Qua, không xác định nó là một lễ vật; “dành cho Yahweh” giữ được quan hệ phụng tự mà không thu hẹp nghĩa.
  - severity: low
    issue: “tháng ấy” thêm một yếu tố chỉ định không có trong công thức Hê-bơ-rơ.
    rationale: Quy chiếu là rõ từ “tháng thứ nhất”; “của tháng” sát nguyên văn hơn và vẫn tự nhiên.
  - severity: medium
    issue: Danh יהוה không nhất quán với quyết định thuật ngữ trong dấu vết tiếng Anh.
    rationale: Bản tiếng Anh dùng “Yahweh” để chuyển trực tiếp Tetragrammaton. Dùng “Yahweh” trong tiếng Việt bảo toàn danh riêng thay vì dùng một hình thức truyền thống khác.
