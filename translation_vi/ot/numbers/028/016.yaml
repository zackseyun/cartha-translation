  text: וּ/בַ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֑דֶשׁ פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: vi
  text: Tháng thứ nhất, vào ngày mười bốn của tháng, là lễ Vượt Qua dành cho Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ Vượt Qua của Yahweh.” Giới từ Hê-bơ-rơ có thể diễn tả sự dành cho hoặc sự thuộc về.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: Tháng thứ nhất
  rationale: Lược dịch liên từ וּ để câu tiếng Việt mở đầu tự nhiên, đồng thời giữ nguyên mốc thời gian của nguyên văn.
- source_word: בְּ/אַרְבָּעָה עָשָׂר יוֹם לַ/חֹדֶשׁ
  choice: vào ngày mười bốn của tháng ấy
  rationale: Diễn đạt tự nhiên công thức ghi ngày tháng của tiếng Hê-bơ-rơ; “tháng ấy” quy chiếu rõ về tháng thứ nhất vừa nêu.
- source_word: פֶּסַח
  choice: lễ Vượt Qua
  rationale: Đây là cách gọi quen thuộc và dễ hiểu trong tiếng Việt; trong ngữ cảnh lịch lễ, từ này chỉ lễ Vượt Qua mà không nhất thiết thu hẹp thành riêng sinh tế.
- source_word: לַ/יהוָה
  choice: dâng cho Đức Giê-hô-va
  rationale: Giới từ לְ có thể biểu thị sự hướng đến hoặc hiến dâng. “Dâng cho” tự nhiên trong tiếng Việt và giữ được quan hệ phụng tự với danh riêng יהוה.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Dùng hình thức danh riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt, thay vì thay thế danh ấy bằng một tước hiệu; thêm “Đức” để có sắc thái trang trọng tự nhiên.
- issue: Quan hệ được biểu thị bởi לַיהוָה
  choice: dâng cho Đức Giê-hô-va
  alternative: của Đức Giê-hô-va
  rationale: Cách dịch chính giữ sắc thái hướng đến hoặc hiến dâng của giới từ לְ. Vì cấu trúc này cũng có thể được hiểu là thuộc về Đức Giê-hô-va, phương án ấy được ghi trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ câu ngắn theo tính chất quy định lịch lễ; dùng “lễ Vượt Qua” là thuật ngữ phổ thông trong tiếng Việt.
