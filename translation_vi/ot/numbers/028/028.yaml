revisions:
- from: 'Lễ vật ngũ cốc dâng kèm theo các con vật ấy phải là bột mì mịn trộn với dầu: mỗi con bò đực dâng ba phần mười[a], còn con chiên đực dâng hai phần mười.'
  to: 'Lễ vật ngũ cốc kèm theo phải là bột mịn trộn với dầu: ba phần mười[a] cho một con bò đực, và hai phần mười cho một con chiên đực.'
  rationale: Bản sửa giữ đầy đủ nội dung và tính cô đọng của tiếng Hê-bơ-rơ, tránh xác định “bột” là bột mì khi bản văn không nói rõ, và phục hồi cấu trúc song hành phân bổ lễ vật cho từng sinh tế. Chú thích hiện có vẫn giải thích đầy đủ cả hai số đo.
