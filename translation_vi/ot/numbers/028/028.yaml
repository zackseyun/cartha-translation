base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: vi
  text: 'Lễ vật ngũ cốc kèm theo phải là bột mịn trộn với dầu: ba phần mười[a] cho một con bò đực, và hai phần mười cho một con chiên đực.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “ba đơn vị một phần mười” và “hai đơn vị một phần mười”; trong bối cảnh tế lễ này, mỗi đơn vị thường được hiểu là một phần mười ê-pha.'
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Lễ vật ngũ cốc dâng kèm theo các con vật ấy
  rationale: Trong ngữ cảnh tế lễ, מִנְחָה chỉ lễ vật bằng ngũ cốc. Đại từ số nhiều liên hệ đến các sinh tế ở câu trước; cụm “dâng kèm theo” diễn đạt tự nhiên mối liên hệ ấy trong tiếng Việt.
- source_word: סֹלֶת
  choice: bột mì mịn
  rationale: סֹלֶת là loại bột hảo hạng dùng trong tế lễ; “bột mì mịn” là cách diễn đạt rõ ràng, quen thuộc trong tiếng Việt hiện đại.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: trộn với dầu
  rationale: Phân từ bị động diễn tả bột đã được hòa trộn với dầu; cách dịch này trực tiếp và tự nhiên.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ba phần mười
  rationale: עִשָּׂרוֹן là một đơn vị bằng một phần mười, trong luật tế lễ thường được hiểu là một phần mười ê-pha; giữ cách nói ngắn trong chính văn và giải thích đơn vị ở chú thích.
- source_word: לַפָּר הָאֶחָד
  choice: mỗi con bò đực
  rationale: Cụm có mạo từ cùng אֶחָד phân phối lượng lễ vật cho từng con bò. “Mỗi con” truyền đạt chức năng phân phối tự nhiên hơn cách dịch máy móc “con bò đực duy nhất” trong tiếng Việt.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: hai phần mười
  rationale: Chỉ hai đơn vị một phần mười; đơn vị cụ thể được nêu trong chú thích để chính văn gọn và dễ đọc.
- source_word: לָאַיִל הָאֶחָד
  choice: con chiên đực
  rationale: אַיִל là chiên đực trưởng thành. Ở đây chỉ có một con theo danh sách của câu trước, nên dùng số ít tự nhiên mà không thêm ý thần học.
