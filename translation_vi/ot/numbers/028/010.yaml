translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ cấu trúc lặp của nguyên văn nhưng dùng “phải dâng” để câu tiếng Việt hoàn chỉnh, vì mệnh đề Hê-bơ-rơ là một chỉ dẫn tế lễ rút gọn.
