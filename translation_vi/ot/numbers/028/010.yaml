  text: עֹלַ֥ת שַׁבַּ֖ת בְּ/שַׁבַּתּ֑/וֹ עַל עֹלַ֥ת הַ/תָּמִ֖יד וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: vi
  text: Lễ thiêu ngày Sa-bát, dâng vào mỗi ngày Sa-bát, ngoài lễ thiêu thường xuyên và lễ quán của lễ thiêu ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: lễ thiêu
  rationale: עֹלָה là sinh tế được thiêu trọn; “lễ thiêu” là thuật ngữ tiếng Việt rõ ràng, quen thuộc và phù hợp văn cảnh tế tự.
- source_word: שַׁבַּת
  choice: ngày Sa-bát
  rationale: Trong lịch tế lễ này, שַׁבָּת chỉ ngày Sa-bát, không phải tuần lễ nói chung.
- source_word: בְּשַׁבַּתּוֹ
  choice: vào mỗi ngày Sa-bát
  rationale: 'Cụm giới từ cùng hậu tố số ít có ý nghĩa phân phối: lễ vật phải được dâng vào từng ngày Sa-bát khi ngày ấy đến.'
- source_word: עַל
  choice: ngoài
  rationale: Trong chỉ dẫn tế lễ, עַל biểu thị lễ vật được thêm vào lễ vật khác; “ngoài” diễn đạt tự nhiên quan hệ bổ sung này.
- source_word: הַתָּמִיד
  choice: thường xuyên
  rationale: תָּמִיד mang nghĩa liên tục hoặc đều đặn; đi với עֹלַת, cụm này chỉ lễ thiêu được dâng theo lệ thường.
- source_word: וְנִסְכָּהּ
  choice: và lễ quán đi kèm
  rationale: נֶסֶךְ là lễ vật dạng lỏng được rót ra; “lễ quán” là thuật ngữ tế tự gọn, còn “đi kèm” làm rõ hậu tố giống cái quy chiếu về lễ thiêu thường xuyên.
