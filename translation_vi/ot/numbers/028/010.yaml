revisions:
- from: Đó là lễ thiêu của ngày Sa-bát, phải dâng vào mỗi ngày Sa-bát, ngoài lễ thiêu thường xuyên và lễ quán đi kèm.
  to: Lễ thiêu ngày Sa-bát, dâng vào mỗi ngày Sa-bát, ngoài lễ thiêu thường xuyên và lễ quán của lễ thiêu ấy.
  rationale: Bản sửa loại bỏ các yếu tố không được nêu trong nguyên văn, duy trì tính rút gọn của công thức tế lễ, và diễn đạt rõ quan hệ của lễ quán với lễ thiêu thường xuyên. Không cần chú thích vì không có vấn đề văn bản hay từ vựng cần giữ mở trong tiếng Việt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:36:46Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng các thuật ngữ tế tự chủ yếu và quan hệ bổ sung của עַל. Tuy nhiên, “Đó là” không có trong câu Hê-bơ-rơ, còn “phải dâng” biến cụm danh ngữ ngắn gọn của nguyên văn thành một mệnh lệnh rõ rệt. Cần giữ cách diễn đạt danh ngữ/rút gọn phù hợp văn cảnh quy định tế lễ.
  naturalness: “Lễ thiêu ngày Sa-bát, dâng vào mỗi ngày Sa-bát” là cách tiếng Việt hiện đại, trang trọng và rõ nghĩa hơn, đồng thời không cần thêm một mệnh đề giới thiệu. “Lễ quán của lễ thiêu ấy” làm rõ sở thuộc của hậu tố trong וְנִסְכָּהּ.
  terminology: “Lễ thiêu,” “ngày Sa-bát,” “lễ thiêu thường xuyên,” và “lễ quán” phù hợp với văn cảnh tế tự. Dùng “của lễ thiêu ấy” bảo toàn quan hệ sở thuộc của “lễ quán” mà không thêm ý diễn giải.
  issues:
  - severity: medium
    issue: Thêm “Đó là”
    rationale: Nguyên văn bắt đầu trực tiếp bằng cụm “lễ thiêu của/ngày Sa-bát,” không có đại từ chỉ định hay động từ “là.”
  - severity: low
    issue: “phải dâng” nêu rõ sắc thái mệnh lệnh không được phát biểu trong câu
    rationale: Câu Hê-bơ-rơ là một cụm quy định tế lễ rút gọn. Có thể dùng “dâng vào” để tiếng Việt trôi chảy mà không chuyển hẳn sang một mệnh lệnh.
  - severity: low
    issue: “lễ quán đi kèm” không biểu thị trực tiếp sở thuộc của hậu tố
    rationale: וְנִסְכָּהּ là “và lễ quán của nó”; “của lễ thiêu ấy” chính xác hơn và vẫn tự nhiên.
  revised_text: Lễ thiêu ngày Sa-bát, dâng vào mỗi ngày Sa-bát, ngoài lễ thiêu thường xuyên và lễ quán của lễ thiêu ấy.
