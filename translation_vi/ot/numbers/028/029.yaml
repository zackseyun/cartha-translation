  text: một phần mười cho mỗi con chiên con[a], cho bảy con chiên con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một phần mười, một phần mười cho một con chiên con, cho bảy con chiên con.” Tiếng Hê-bơ-rơ dùng công thức phân phối, nghĩa là một phần mười đơn vị đo cho mỗi con trong bảy con chiên con.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: mỗi con một phần mười
  rationale: 'Danh từ số ít được lặp lại, theo nghĩa đen là “một phần mười, một phần mười”, tạo thành công thức phân phối: mỗi con nhận một phần mười đơn vị đo. Không thêm “ê-pha” vào chính văn vì đơn vị ấy không được nêu trực tiếp trong câu này.'
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: mỗi con chiên con
  rationale: Theo nghĩa sát chữ là “cho con chiên con thứ/một ấy”; trong công thức phân phối này, “mỗi con chiên con” truyền đạt tự nhiên rằng lượng đã nêu áp dụng cho từng con.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: cho cả bảy con chiên con
  rationale: Cụm từ xác định toàn bộ nhóm gồm bảy con mà mức phân phối nói trên áp dụng; “cả” giúp diễn đạt quan hệ ấy tự nhiên trong tiếng Việt.
