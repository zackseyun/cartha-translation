  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: vi
  text: Ngươi phải chuẩn bị một phần mười ê-pha[a][b] cho mỗi con chiên trong bảy con chiên ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ nói sát nghĩa: “một phần mười, một phần mười, ngươi phải làm cho một con chiên, cho bảy chiên con.” Sự lặp lại diễn tả ý phân phối: một phần mười cho mỗi con.'
    reason: lexical_alternative
  - marker: b
    text: Tức là một phần mười ê-pha, đơn vị tiêu chuẩn dùng cho lễ vật ngũ cốc trong ngữ cảnh này.
    reason: cultural_note
lexical_decisions:
- source_word: עִשָּׂר֤וֹן עִשָּׂרוֹן֙
  choice: một phần mười ê-pha
  rationale: 'Danh từ số ít được lặp lại mang ý nghĩa phân phối: một phần mười cho từng con. Trong các chỉ dẫn tế lễ của Ngũ Kinh, עִשָּׂרוֹן là đơn vị ngũ cốc bằng một phần mười ê-pha; nêu rõ “ê-pha” giúp độc giả hiện đại hiểu đơn vị được hàm ý trong ngữ cảnh.'
- source_word: תַּעֲשֶׂה
  choice: Ngươi phải chuẩn bị
  rationale: Động từ עשה có nghĩa rộng là “làm”, nhưng trong chỉ dẫn về phần lễ vật, “chuẩn bị” vừa tự nhiên vừa không diễn giải quá mức thành “dâng”.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: cho mỗi con ... chiên con
  rationale: Cụm số ít với mạo từ và số từ, đi sau cách lặp mang nghĩa phân phối, chỉ phần dành cho từng con; “mỗi con” truyền đạt tự nhiên chức năng này.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: trong số bảy chiên con
  rationale: Cách diễn đạt này giữ rõ tổng số bảy con đồng thời kết hợp tự nhiên với ý phân phối “mỗi con” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phù hợp với lời luật truyền trực tiếp trong văn mạch. Trật tự câu được điều chỉnh để tránh lặp gượng “cho mỗi con, cho bảy con” nhưng vẫn giữ cả ý phân phối lẫn tổng số bảy chiên con.
