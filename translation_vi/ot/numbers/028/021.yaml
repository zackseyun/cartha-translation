  source_fidelity: 'Bản dịch truyền đạt đúng ý phân phối của עִשָּׂרוֹן được lặp lại: một phần mười cho từng chiên con, và nêu đúng tổng số bảy con. “Chuẩn bị” là cách dịch thích hợp cho תַּעֲשֶׂה trong chỉ dẫn tế lễ. Tuy nhiên, “trong số bảy chiên con” có thể gợi một tập hợp chọn lựa hơn là cụm “cho bảy chiên con” được nhắc lại trong tiếng Hê-bơ-rơ; có thể diễn đạt sát và rõ hơn mà vẫn tự nhiên.'
  naturalness: “Ngươi phải chuẩn bị” giữ được sắc thái chỉ thị trực tiếp và phù hợp văn phong Kinh Thánh trang trọng. Đổi vị trí bổ ngữ để “cho mỗi con chiên trong bảy con chiên ấy” làm câu rõ quan hệ phân phối hơn và tránh cách nối “cho mỗi con trong số...” hơi hành chính.
