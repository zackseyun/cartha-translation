revisions:
- from: Trong ngày thứ nhất, phải có một cuộc hội họp thánh[a]; anh em không được làm bất cứ công việc lao động thường ngày nào[b].
  to: Vào ngày thứ nhất, sẽ có một cuộc họp thánh[a]; không được làm bất cứ công việc lao động nào[b].
  rationale: Bản sửa dùng cách diễn đạt thời điểm tự nhiên hơn, tránh thêm sắc thái xưng hô vào ngôi thứ hai số nhiều, và giữ phần giải thích về phạm vi của “công việc lao động” trong chú thích. Hai ký hiệu chú thích vẫn được đặt đúng sau các cụm từ mà chúng giải thích.
