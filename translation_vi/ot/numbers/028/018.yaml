translation:
  language: vi
  text: Vào ngày thứ nhất, sẽ có một cuộc họp thánh[a]; không được làm bất cứ công việc lao động nào[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một hội nghị thánh.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “không làm công việc lao động/phục vụ nào”; tức là không làm công việc nghề nghiệp thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Trong ngày thứ nhất
  rationale: Diễn đạt trực tiếp cụm thời gian có mạo từ và số thứ tự; không thêm “của kỳ lễ” vì ý đó thuộc văn cảnh nhưng không được nói rõ trong câu này.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Cụm từ nghi lễ cố định chỉ một cuộc tụ họp thiêng liêng được chính thức triệu tập. “Cuộc hội họp thánh” vừa tự nhiên trong tiếng Việt hiện đại vừa giữ được sắc thái cộng đồng và nghi lễ.
- source_word: כָּל ... לֹא
  choice: không ... bất cứ ... nào
  rationale: Cấu trúc phủ định này có sức bao quát; cách diễn đạt tiếng Việt tự nhiên là “không được làm bất cứ ... nào” thay vì dịch máy móc từng từ.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: công việc lao động thường ngày
  rationale: Cụm từ theo nghĩa đen là “công việc lao động/phục vụ”, trong ngữ cảnh chỉ lao động nghề nghiệp hay công việc sản xuất thông thường bị cấm vào ngày lễ, chứ không nhất thiết là mọi hành động.
- source_word: לֹא תַעֲשׂוּ
  choice: anh em không được làm
  rationale: Động từ ngôi thứ hai số nhiều trong văn bản luật được chuyển thành lời cấm trang trọng nhưng tự nhiên, hướng đến toàn thể cộng đồng.
