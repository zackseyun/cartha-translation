revisions:
- from: 'Anh em phải dâng một lễ vật hỏa tế[a], tức là lễ thiêu kính dâng Đức Giê-hô-va: hai con bò đực, một con chiên đực và bảy con chiên đực một tuổi. Các con vật ấy phải không tì vết.'
  to: 'Anh em phải dâng một lễ vật hỏa tế[a], tức là lễ thiêu kính dâng Yahweh: hai con bò đực, một con chiên đực và bảy con chiên con đực một tuổi. Các con vật anh em dâng phải không tì vết.'
  rationale: Chỉnh tên riêng giao ước theo quyết định hiện hành của audit trail; làm rõ sự phân biệt giữa chiên đực trưởng thành và chiên con đực; đồng thời diễn đạt lָכֶם tự nhiên hơn trong tiếng Việt. Không thay đổi số lượng, loại tế vật, hay quan hệ giữa “lễ vật hỏa tế” và “lễ thiêu”.
