language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: vi
  text: 'Anh em phải dâng một lễ vật hỏa tế[a], tức là lễ thiêu kính dâng Yahweh: hai con bò đực, một con chiên đực và bảy con chiên con đực một tuổi. Các con vật anh em dâng phải không tì vết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ vật dâng qua lửa.” Đây là một thuật ngữ tế lễ Hê-bơ-rơ chỉ lễ vật được thiêu bằng lửa trên bàn thờ.'
    reason: Nêu cách dịch thay thế và giải thích thuật ngữ tế lễ אִשֶּׁה.
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Anh em phải dâng
  rationale: Động từ Hifil của קרב trong bối cảnh tế lễ có nghĩa là đem đến hoặc dâng lễ vật; “phải dâng” tự nhiên và diễn đạt tính bắt buộc của chỉ thị.
- source_word: אִשֶּׁה
  choice: một lễ vật hỏa tế
  rationale: Đây là thuật ngữ tế lễ chỉ lễ vật được đưa vào lửa trên bàn thờ. “Lễ vật hỏa tế” giữ được mối liên hệ rõ ràng với lửa mà không đồng nhất nó với loại lễ thiêu được nêu ngay sau đó.
- source_word: עֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ tế lễ quen thuộc, chỉ lễ vật được thiêu trọn trên bàn thờ.
- source_word: לַיהוָה
  choice: kính dâng Đức Giê-hô-va
  rationale: Giới từ ל biểu thị hướng dâng hoặc sự biệt riêng cho Đức Chúa Trời; danh riêng giao ước יהוה được chuyển sang dạng tiếng Việt quen dùng “Đức Giê-hô-va”.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: hai con bò đực
  rationale: Cụm Hê-bơ-rơ xác định hai con vật thuộc loài bò và là giống đực; tiếng Việt không cần dịch máy móc thành “con của đàn bò”.
- source_word: וְאַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל chỉ chiên đực trưởng thành trong danh sách tế lễ.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: bảy con chiên đực một tuổi
  rationale: כְבָשִׂים là chiên non giống đực, còn בְּנֵי שָׁנָה là thành ngữ chỉ độ tuổi một năm.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Các con vật ấy phải không tì vết
  rationale: Trong luật tế lễ, תְּמִימִם nghĩa là không có khuyết tật. Cách dịch này diễn đạt tự nhiên yêu cầu đặt trên những con vật dân chúng phải chuẩn bị; לָכֶם không cần chuyển thành cụm “cho anh em” gượng ép.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh
  rationale: Giữ đây là danh riêng của Đức Chúa Trời, không thay bằng tước hiệu “CHÚA”; dùng dạng đã quen thuộc và dễ nhận biết trong tiếng Việt.
- issue: Quan hệ giữa אִשֶּׁה và עֹלָה
  choice: “lễ vật hỏa tế, tức là lễ thiêu”
  alternative: “lễ vật làm thức ăn, một lễ thiêu”
  rationale: Không diễn giải אִשֶּׁה thành thức ăn theo một lối phân tích từ nguyên còn được bàn luận. Cụm giải thích cho thấy lễ thiêu trong câu này là lễ vật được dâng qua lửa, đồng thời giữ cả hai thuật ngữ của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng; tách yêu cầu không tì vết thành câu riêng để danh sách tế vật rõ ràng hơn.
