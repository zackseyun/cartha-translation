id: NUM.28.11
reference: Numbers 28:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: vi
  text: 'Vào đầu mỗi tháng[a], các ngươi phải dâng cho Yahweh một lễ vật thiêu: hai con bò đực, một con chiên đực và bảy con chiên đực một tuổi, không tì vết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “vào đầu các tháng của các ngươi”; tức là vào các dịp trăng mới.'
    reason: Giải thích thành ngữ thời gian và nêu cách hiểu theo bối cảnh nghi lễ.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: Vào đầu các tháng của các ngươi
  rationale: Giữ khá sát thành ngữ Hê-bơ-rơ, theo nghĩa đen là “vào những đầu tháng của các ngươi”, đồng thời vẫn tự nhiên trong tiếng Việt. Trong ngữ cảnh, cụm này chỉ các dịp trăng mới hằng tháng.
- source_word: תַּקְרִיבוּ
  choice: các ngươi phải dâng lên
  rationale: Thể Hiphil của קרב trong ngữ cảnh tế lễ mang nghĩa đem đến hoặc dâng lễ vật. “Dâng lên” diễn đạt rõ hành động tế lễ và sắc thái hướng về Đức Chúa Trời.
- source_word: עֹלָה
  choice: một lễ vật thiêu
  rationale: Đây là thuật ngữ chỉ lễ vật được thiêu toàn bộ. “Lễ vật thiêu” rõ nghĩa, trang trọng và tránh lẫn với hành động dâng nói chung.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng “Yahweh”; giới từ ל biểu thị lễ vật được dâng cho Ngài.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: hai con bò đực từ đàn bò
  rationale: Phân biệt bò đực thuộc đại gia súc với các con vật tế lễ khác; không ép cụm từ thành “bò đực non” vì yếu tố tuổi trẻ không được văn bản xác định rõ.
- source_word: וְאַיִל אֶחָד
  choice: một con chiên đực
  rationale: אַיִל chỉ chiên đực trưởng thành dùng làm sinh tế; cách gọi này thông dụng và chính xác trong tiếng Việt.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: bảy con chiên con đực một tuổi
  rationale: כְּבָשִׂים chỉ chiên con đực; thành ngữ “con của một năm” chỉ tuổi khoảng một năm hoặc đang trong năm đầu đời.
- source_word: תְּמִימִם
  choice: tất cả đều không tì vết
  rationale: Trong luật tế lễ, từ này chỉ con vật không có khuyết tật. Thêm “tất cả đều” làm rõ số nhiều của tính từ và phạm vi áp dụng cho các con vật được liệt kê.
theological_decisions:
- issue: Cách diễn đạt thời điểm cử hành hằng tháng
  choice: Vào đầu các tháng của các ngươi
  alternative: Vào các dịp trăng mới của các ngươi
  rationale: Câu chính bảo toàn cấu trúc và hình ảnh của nguyên văn, còn chú thích nêu nghĩa nghi lễ theo lịch trăng. Như vậy không biến một cách diễn giải đúng theo ngữ cảnh thành câu chữ duy nhất của nguyên văn.
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” giúp phân biệt danh riêng này với các tước hiệu, không thêm một truyền thống hệ phái riêng vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời truyền trực tiếp cho cộng đồng Israel; duy trì thuật ngữ tế lễ nhất quán và đặt dấu chú thích [a] ngay trong câu chính.
