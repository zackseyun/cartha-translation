    rationale: “Vào đầu mỗi tháng” truyền đạt thành ngữ thời gian một cách tự nhiên; chú thích có thể bảo lưu dạng số nhiều sở hữu của tiếng Hê-bơ-rơ và nghĩa theo bối cảnh nghi lễ.
