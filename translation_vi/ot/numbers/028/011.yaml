revisions:
- from: 'Vào đầu các tháng của các ngươi[a], các ngươi phải dâng lên Yahweh một lễ vật thiêu: hai con bò đực từ đàn bò, một con chiên đực và bảy con chiên con đực một tuổi, tất cả đều không tì vết.'
  to: 'Vào đầu mỗi tháng[a], các ngươi phải dâng cho Yahweh một lễ vật thiêu: hai con bò đực, một con chiên đực và bảy con chiên đực một tuổi, không tì vết.'
  rationale: Chỉnh câu mở đầu để tự nhiên hơn trong tiếng Việt, đồng thời giữ sắc thái sát nguyên văn trong chú thích. Bỏ “tất cả đều” để không mở rộng phạm vi cú pháp của “không tì vết” vượt quá bảy con chiên đực một tuổi mà nguyên văn mô tả trực tiếp. Không thay đổi ý nghĩa, số lượng sinh tế, hay cách phiên âm danh יהוה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:41:56Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh dâng lễ thiêu cho Yahweh vào đầu tháng, cùng số lượng và loại sinh tế. Tuy nhiên, “tất cả đều không tì vết” mở rộng phạm vi của תְּמִימִם sang cả bò đực và chiên đực, trong khi tính từ số nhiều này theo cú pháp trực tiếp bổ nghĩa cho bảy con chiên một tuổi.
  naturalness: “Vào đầu các tháng của các ngươi” khá sát chữ nhưng chưa thật tự nhiên trong tiếng Việt hiện đại. “Vào đầu mỗi tháng” tự nhiên hơn; chú thích giữ lại cách diễn đạt sát nguyên văn và giải thích bối cảnh trăng mới.
  terminology: “Yahweh,” “lễ vật thiêu,” “bò đực,” “chiên đực,” và “không tì vết” phù hợp ngữ cảnh tế lễ. “Bảy con chiên đực một tuổi” diễn đạt rõ giống đực và tuổi của כְּבָשִׂים בְּנֵי־שָׁנָה.
  issues:
