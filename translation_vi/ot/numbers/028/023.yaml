    rationale: Trong tiếng Việt, cụm này không phải cách gọi ổn định cho loại tế lễ và có thể được đọc như một lễ vật được thiêu. “Lễ tế thiêu” giữ đúng loại lễ trong nguyên ngữ và tự nhiên hơn.
  revised_text: Ngoài lễ tế thiêu buổi sáng thường lệ, các ngươi phải dâng các lễ vật này.
