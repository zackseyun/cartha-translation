  yaml_path: translation/ot/numbers/028/023.yaml
  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: vi
  text: Ngoài lễ tế thiêu buổi sáng thường lệ, các ngươi phải dâng các lễ vật này.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: Ngoài
  rationale: Trong ngữ cảnh này, từ này cho biết các lễ vật trong kỳ lễ được dâng thêm, không thay thế lễ vật thường lệ; “Ngoài” diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: lễ vật thiêu buổi sáng thường lệ
  rationale: Mệnh đề quan hệ xác định lễ vật thiêu buổi sáng là lễ vật thường xuyên, chứ không nói một lễ vật được dâng vì một lễ vật khác. Cách diễn đạt này gọn, rõ và phù hợp ngữ cảnh nghi lễ.
- source_word: תַּעֲשׂוּ
  choice: phải dâng
  rationale: Động từ có nghĩa cơ bản là “làm”, nhưng trong chỉ dẫn về tế lễ, “dâng” là tương đương theo ngữ cảnh tự nhiên nhất; hình thái chỉ thị được thể hiện bằng “phải”.
- source_word: אֶת אֵלֶּה
  choice: những lễ vật này
  rationale: Đại từ chỉ định quay lại các lễ vật vừa được quy định. Bổ sung danh từ “lễ vật” trong tiếng Việt làm rõ đối tượng mà không thay đổi nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh ngôi thứ hai số nhiều trong chỉ thị dành cho cộng đồng, đồng thời giữ sắc thái Kinh Thánh trang nghiêm; câu tránh cách hiểu sai rằng lễ vật buổi sáng được dâng cho một lễ vật thường lệ khác.
