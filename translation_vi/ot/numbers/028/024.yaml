    text: 'Nguyên văn: “bánh/thức ăn của lễ vật dâng bằng lửa”; “thức ăn” ở đây chỉ phần lễ vật được dâng, không nhất thiết chỉ là bánh theo nghĩa đen.'
    reason: cultural_note
