id: NUM.28.24
reference: Numbers 28:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: vi
  text: 'Trong bảy ngày, mỗi ngày các ngươi phải dâng các lễ vật như vậy: lễ vật thực phẩm dâng bằng lửa, có hương thơm đẹp lòng Yahweh. Lễ vật ấy phải được dâng ngoài lễ thiêu thường xuyên và lễ quán đi kèm lễ thiêu ấy.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: những lễ vật như thế này
  rationale: Tiền tố כ־ mang nghĩa so sánh; cách dịch này giữ ý các lễ vật hằng ngày phải theo loại và số lượng vừa được quy định, đồng thời làm rõ tân ngữ ngầm trong tiếng Hê-bơ-rơ.
- source_word: תַּעֲשׂוּ
  choice: các ngươi phải dâng
  rationale: Động từ עשה có nghĩa rộng là “làm”, nhưng trong ngữ cảnh tế lễ, “dâng” diễn đạt tự nhiên và chính xác hành động nghi lễ.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: Trong bảy ngày, mỗi ngày
  rationale: 'Giữ rõ nghĩa phân phối: hành động phải được lặp lại vào từng ngày trong cả bảy ngày.'
- source_word: לֶחֶם אִשֵּׁה
  choice: thức ăn, tức lễ vật dùng lửa dâng lên
  rationale: לֶחֶם ở đây là thức ăn hay phần cung ứng tế lễ, không nhất thiết chỉ bánh; אִשֵּׁה chỉ lễ vật được dâng bằng lửa. “Tức” cho thấy hai cụm cùng mô tả lễ vật mà không xóa hình ảnh “thức ăn” của nguyên văn.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  rationale: Diễn đạt tự nhiên công thức tế lễ chỉ hương thơm được Đức Chúa Trời vui nhận, đồng thời giữ nguyên hình ảnh khứu giác.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: עַל עוֹלַת הַתָּמִיד
  choice: ngoài lễ thiêu thường xuyên
  rationale: עַל trong ngữ cảnh này mang nghĩa bổ sung; הַתָּמִיד chỉ lễ dâng đều đặn, liên tục.
- source_word: יֵעָשֶׂה
  choice: Lễ ấy phải được dâng
  rationale: Thể bị động của עשה trong văn cảnh tế lễ được diễn đạt tự nhiên bằng “được dâng”; “lễ ấy” làm rõ chủ thể ngầm.
- source_word: וְנִסְכּוֹ
  choice: và lễ quán kèm theo
  rationale: נֶסֶךְ là lễ vật dạng lỏng được rót ra; hậu tố ngôi ba số ít quy chiếu về lễ thiêu thường xuyên. “Lễ quán” là thuật ngữ tiếng Việt gọn và chính xác, còn “kèm theo” làm rõ quan hệ nghi lễ.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng יהוה; “Yahweh” bảo tồn chức năng của danh giao ước mà không thay bằng tước hiệu.
- issue: Ý nghĩa của רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng Yahweh
  alternative: hương thơm làm nguôi Yahweh
  rationale: Công thức nói đến sự chấp nhận và hài lòng của Đức Chúa Trời đối với lễ vật; tránh diễn giải quá mức rằng lễ vật tác động hoặc làm thay đổi cảm xúc của Ngài.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời chỉ dẫn ở ngôi thứ hai số nhiều; dùng thuật ngữ tế lễ nhất quán: “lễ thiêu”, “lễ quán”, “lễ vật dùng lửa dâng lên”.'
