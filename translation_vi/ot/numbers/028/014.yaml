revisions:
- from: 'Lễ quán của chúng phải là rượu: nửa hin cho con bò đực, một phần ba hin cho con cừu đực, và một phần tư hin cho con chiên. Đây là lễ thiêu hằng tháng, dâng mỗi tháng suốt các tháng trong năm.[a]'
  to: 'Các lễ dâng rượu kèm theo chúng là: nửa hin rượu cho con bò đực, một phần ba hin rượu cho con cừu đực, và một phần tư hin rượu cho con chiên. Đây là lễ thiêu hằng tháng, được dâng mỗi tháng suốt các tháng trong năm.[a]'
  rationale: Sửa thuật ngữ hiếm “lễ quán” thành “lễ dâng rượu” để rõ nghĩa trong tiếng Việt hiện đại, đồng thời đặt “rượu” với từng định lượng để phản ánh rõ chất của lễ dâng. Chỉnh chú thích để bảo tồn nghĩa thay thế “trăng mới” của חֹדֶשׁ mà vẫn phản ánh đúng bְּחָדְשׁוֹ (“trong tháng của nó”).
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:37:10Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng các định lượng, các con vật hiến tế và tính chu kỳ của lễ thiêu. Tuy nhiên, cách đặt “phải là rượu” ở đầu câu làm quan hệ của יַיִן với toàn bộ các lượng rượu kém tự nhiên trong tiếng Việt; nên diễn đạt trực tiếp là các lễ dâng rượu. Chú thích hiện có diễn giải בְּחָדְשׁוֹ là “vào kỳ trăng mới ấy,” trong khi nghĩa sát là “trong tháng của nó.”
  naturalness: “Lễ quán” là thuật ngữ truyền thống nhưng hiếm trong tiếng Việt hiện đại và không tự giải nghĩa. “Lễ dâng rượu” vừa rõ nghĩa vừa vẫn giữ văn phong trang trọng, tế lễ. Việc lặp “rượu” theo từng định lượng giúp câu mạch lạc mà không thay đổi nội dung.
  terminology: Dùng “lễ dâng rượu,” “lễ thiêu,” “hin,” “bò đực,” “cừu đực,” và “chiên” phù hợp với ngữ cảnh tế tự. Sự phân biệt giữa אַיִל (cừu đực) và כֶּבֶשׂ (chiên) được giữ lại.
  issues:
  - severity: medium
    issue: “Lễ quán của chúng phải là rượu” không tự nhiên và có thể làm mơ hồ phạm vi của “rượu.”
    rationale: נִסְכֵּיהֶם là “các lễ dâng rượu/lễ quán của chúng”; יַיִן xác định chất được dâng cho các lượng liệt kê. Diễn đạt lại làm rõ quan hệ này trong tiếng Việt hiện đại.
  - severity: low
    issue: Chú thích thay thế dịch “vào kỳ trăng mới ấy.”
    rationale: Cụm בְּחָדְשׁוֹ có nghĩa cơ bản là “trong tháng của nó,” không phải “vào kỳ trăng mới ấy.” Chú thích nên giữ sự mơ hồ từ vựng của חֹדֶשׁ mà không thay thế cụm kế tiếp bằng một nghĩa khác.
  revised_text: 'Các lễ dâng rượu kèm theo chúng là: nửa hin rượu cho con bò đực, một phần ba hin rượu cho con cừu đực, và một phần tư hin rượu cho con chiên. Đây là lễ thiêu hằng tháng, được dâng mỗi tháng suốt các tháng trong năm.[a]'
