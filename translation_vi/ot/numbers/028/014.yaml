  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: vi
  text: 'Các lễ dâng rượu kèm theo chúng là: nửa hin rượu cho con bò đực, một phần ba hin rượu cho con cừu đực, và một phần tư hin rượu cho con chiên. Đây là lễ thiêu hằng tháng, được dâng mỗi tháng suốt các tháng trong năm.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây là lễ thiêu của ngày trăng mới, trong tháng của nó, cho các tháng trong năm.” Từ Hê-bơ-rơ חֹדֶשׁ có thể có nghĩa là “tháng” hoặc “trăng mới”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: lễ quán của chúng
  rationale: Danh từ נֶסֶךְ chỉ lễ vật dạng chất lỏng được rót ra. “Lễ quán” là thuật ngữ tế lễ ngắn gọn, trang trọng; phần tiếp theo xác định chất được dùng là rượu.
- source_word: חֲצִי הַהִין
  choice: nửa hin
  rationale: Giữ nguyên đơn vị đo lường cổ hin để trung thành với văn bản nguồn, thay vì quy đổi theo một giá trị hiện đại có thể gây cảm giác chính xác quá mức.
- source_word: לַפָּר
  choice: cho con bò đực
  rationale: Danh từ số ít có mạo từ chỉ con vật hiến tế đã được xác định trong ngữ cảnh.
- source_word: וּשְׁלִישִׁת הַהִין
  choice: một phần ba hin
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ nguyên phân số và đơn vị của tiếng Hê-bơ-rơ.
- source_word: לָאַיִל
  choice: cho con cừu đực
  rationale: אַיִל là cừu đực trưởng thành; cách dịch này phân biệt nó với con chiên כֶּבֶשׂ ở vế kế tiếp.
- source_word: וּרְבִיעִת הַהִין
  choice: một phần tư hin
  rationale: Phản ánh trực tiếp cấu trúc phân số trong nguyên văn.
- source_word: לַכֶּבֶשׂ
  choice: cho con chiên
  rationale: כֶּבֶשׂ chỉ chiên thuộc loại dùng làm sinh tế; “con chiên” là cách gọi tự nhiên và quen thuộc trong văn cảnh tế lễ.
- source_word: יָיִן
  choice: là rượu
  rationale: Từ יָיִן đứng sau danh sách lượng đo và xác định chất của các lễ quán. Đưa lên sau “Lễ quán của chúng” giúp câu tiếng Việt rõ ràng mà không đổi quan hệ ý nghĩa.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: Đây là lễ thiêu hằng tháng
  rationale: חֹדֶשׁ có thể chỉ “tháng” hoặc “trăng mới”. Bản chính truyền đạt chu kỳ hằng tháng; chú thích giữ lại nghĩa thay thế phù hợp với bối cảnh nghi lễ.
- source_word: בְּחָדְשׁוֹ
  choice: dâng mỗi tháng
  rationale: Nghĩa sát là “trong tháng của nó”; cách dịch phân phối “mỗi tháng” tự nhiên trong tiếng Việt và phù hợp với chu kỳ được nói đến.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: suốt các tháng trong năm
  rationale: Diễn đạt phạm vi lặp lại xuyên suốt các tháng của năm, đồng thời giữ hình ảnh “các tháng trong năm” của nguyên văn.
theological_decisions:
- issue: Nghĩa của חֹדֶשׁ trong cụm זֹאת עֹלַת חֹדֶשׁ
  choice: lễ thiêu hằng tháng
  alternative: lễ thiêu ngày trăng mới
  rationale: Từ này thực sự có cả hai nghĩa. Mạch câu nhấn mạnh sự tái diễn qua các tháng trong năm, nên bản chính dùng cách nói dễ hiểu “hằng tháng”, còn chú thích bảo tồn khả năng chỉ ngày trăng mới mà không loại bỏ nó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ đơn vị cổ “hin”; dùng các thuật ngữ tế lễ “lễ quán” và “lễ thiêu”. Dấu chú thích [a] được đặt sau toàn bộ mệnh đề mà cách hiểu thay thế chi phối.
