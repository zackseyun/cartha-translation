  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc luật lệ của tiếng Hê-bơ-rơ: ngày thứ bảy, một cuộc hội họp thánh, và lệnh cấm làm מְלֶאכֶת עֲבֹדָה. Tuy nhiên, chú thích a hiện nêu “hội chúng” (một nhóm người), trong khi מִקְרָא chỉ sự triệu tập/cuộc hội họp; cần tránh thay đổi nghĩa này.'
