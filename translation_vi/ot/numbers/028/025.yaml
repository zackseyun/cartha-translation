    rationale: “Bất cứ công việc thường ngày nào” là diễn giải phù hợp trong ngữ cảnh, nhưng chú thích nên trình bày nghĩa đen là “mọi công việc lao động/phục dịch” và giải thích đây là công việc nghề nghiệp thông thường.
