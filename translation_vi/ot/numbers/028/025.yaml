  yaml_path: translation/ot/numbers/028/025.yaml
  text: On the seventh day you shall have a holy convocation[b][a]; you shall do no ordinary work.
translation:
  language: vi
  text: Vào ngày thứ bảy, các ngươi phải có một buổi hội họp thánh[a]; không được làm bất cứ công việc thường ngày nào[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một buổi nhóm họp thánh” hoặc “một cuộc triệu tập thánh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “mọi công việc lao động/phục dịch”; tức là không làm công việc nghề nghiệp thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: Vào ngày thứ bảy
  rationale: Diễn đạt tự nhiên quan hệ thời gian của וּבַיּוֹם; liên từ וּ không cần dịch riêng trong tiếng Việt ở đây.
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Giữ cả ý nghĩa một cuộc tụ họp được triệu tập của מִקְרָא và tính chất biệt riêng, thánh của קֹדֶשׁ; cách nói hiện đại, trang trọng và dễ hiểu.
- source_word: יִהְיֶה לָכֶם
  choice: các ngươi phải có
  rationale: Cụm từ theo sát nghĩa là “sẽ/phải là cho các ngươi”; trong văn cảnh luật lệ, “phải có” truyền đạt tự nhiên sắc thái quy định.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: bất cứ công việc thường ngày nào
  rationale: Trong cấu trúc phủ định, כָּל mang nghĩa “bất cứ... nào.” Cụm מְלֶאכֶת עֲבֹדָה chỉ loại công việc lao động/nghề nghiệp thông thường bị cấm vào ngày thánh, không nhất thiết là mọi hành động.
- source_word: לֹא תַעֲשׂוּ
  choice: không được làm
  rationale: Thể chưa hoàn thành đi với phủ định trong văn bản luật được chuyển thành một lệnh cấm rõ ràng và tự nhiên trong tiếng Việt.
