revisions:
- from: Đó là lễ thiêu thường xuyên[a], được thực hiện tại núi Si-nai, làm hương thơm đẹp lòng Yahweh[b], một lễ vật dâng bằng lửa cho Ngài.
  to: Đó là lễ thiêu thường lệ[a], được thực hiện tại núi Si-nai[b], làm hương thơm đẹp lòng[c], là một lễ vật dâng bằng lửa cho Yahweh[d].
  rationale: Bản sửa đưa “cho Yahweh” trở lại với “lễ vật dâng bằng lửa”, đúng quan hệ cú pháp của אִשֶּׁה לַיהוָה; giữ “được thực hiện” để không quyết định thay nguyên văn giữa nghĩa đen và hàm ý thiết lập; và tách các chú thích để mỗi chú thích có một neo rõ ràng. “Thường lệ” là cách diễn đạt hiện đại, tự nhiên cho tính đều đặn của תָּמִיד trong bối cảnh tế tự.
  reviewer_model: gpt-5.6-terra
