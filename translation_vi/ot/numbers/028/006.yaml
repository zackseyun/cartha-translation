id: NUM.28.6
reference: Numbers 28:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עֹלַ֖ת תָּמִ֑יד הָ/עֲשֻׂיָה֙ בְּ/הַ֣ר סִינַ֔י לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: vi
  text: Đó là lễ thiêu thường lệ[a], được thực hiện tại núi Si-nai[b], làm hương thơm đẹp lòng[c], là một lễ vật dâng bằng lửa cho Yahweh[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lễ thiêu liên tục” hoặc “lễ thiêu thường xuyên”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được làm tại núi Si-nai” hoặc “được dâng tại núi Si-nai”. Theo ngữ cảnh, cụm này cũng có thể gợi việc lễ dâng được quy định tại đó.'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “làm hương thơm êm dịu” hoặc “làm hương thơm dễ chịu”.'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “lễ vật bằng lửa cho Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: lễ thiêu thường xuyên
  rationale: “Lễ thiêu” là thuật ngữ quen thuộc cho sinh tế được thiêu trọn; “thường xuyên” diễn đạt tính đều đặn, liên tục của nghi lễ mà không tự ý thu hẹp thành “hằng ngày”.
- source_word: הָעֲשֻׂיָה
  choice: được thực hiện
  rationale: Giữ sát nghĩa rộng của phân từ bị động “được làm/thực hiện”, không quyết đoán rằng câu chỉ nói đến việc thiết lập nghi lễ tại Si-nai.
- source_word: בְּהַר סִינַי
  choice: tại núi Si-nai
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ khả năng câu chỉ địa điểm thực hiện hoặc gợi đến việc nghi lễ được ban truyền tại đó.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: làm hương thơm đẹp lòng Yahweh
  rationale: Diễn đạt thành ngữ tế tự như một hương thơm được Đức Chúa Trời vui nhận, đồng thời giữ hình ảnh mùi hương của nguyên văn.
- source_word: אִשֶּׁה
  choice: một lễ vật dâng bằng lửa
  rationale: Giữ yếu tố lửa vốn hiện diện trong thuật ngữ tế tự và tránh đưa nghĩa “thức ăn” vào phần chính khi từ nguyên và phạm vi nghĩa còn được tranh luận.
- source_word: לַיהוָה
  choice: cho Ngài
  rationale: Đưa danh Yahweh vào ngay cụm “hương thơm đẹp lòng Yahweh”, rồi dùng đại từ để tránh câu tiếng Việt nặng nề; giới từ chỉ đối tượng nhận lễ vật vẫn được thể hiện.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Phiên âm danh giao ước thay vì thay bằng một tước hiệu, theo lớp tham khảo đã được hiệu chỉnh và không gắn với cách gọi riêng của một hệ phái.
- issue: Ý nghĩa của הָעֲשֻׂיָה tại Si-nai
  choice: được thực hiện tại núi Si-nai
  alternative: được thiết lập tại núi Si-nai
  rationale: Nguyên văn dùng “được làm/thực hiện”; “được thiết lập” có thể đúng theo văn cảnh nhưng giải quyết một hàm ý mà câu Hê-bơ-rơ không nói rõ.
- issue: Thành ngữ רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng Yahweh
  alternative: hương thơm êm dịu / hương thơm dễ chịu
  rationale: Giữ hình ảnh tế tự và ý nghĩa được Đức Chúa Trời vui nhận, nhưng không diễn giải thành một cơ chế xoa dịu thần linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Bản dịch ưu tiên sát cấu trúc Hê-bơ-rơ nhưng điều chỉnh trật tự cụm từ để tiếng Việt tự nhiên; không dùng “được thiết lập” vì đó là một diễn giải theo văn cảnh. Mọi ký hiệu chú thích [a], [b] đều xuất hiện trong chính văn.
