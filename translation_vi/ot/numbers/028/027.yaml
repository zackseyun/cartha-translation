source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: vi
  text: 'Anh em phải dâng lên Yahweh một lễ thiêu làm hương thơm đẹp lòng[a]: hai con bò đực, một con chiên đực và bảy con chiên đực một tuổi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “làm hương thơm êm dịu”. Cụm Hê-bơ-rơ lereach nichoach là một công thức tế lễ, cũng có thể dịch là “làm hương thơm đẹp lòng/êm dịu”.'
    reason: Ghi nhận cách dịch từ vựng thay thế của công thức לְרֵיחַ נִיחֹחַ mà không giải thích quá mức ý nghĩa nghi lễ.
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Anh em phải dâng
  rationale: Dạng Hiphil của קרב trong ngữ cảnh tế lễ mang nghĩa đem đến để dâng; “dâng” tự nhiên và đúng sắc thái nghi lễ trong tiếng Việt.
- source_word: עוֹלָה
  choice: một lễ thiêu
  rationale: Chỉ lễ vật được thiêu toàn bộ; “lễ thiêu” là cách gọi ngắn gọn, rõ ràng cho độc giả hiện đại.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: làm hương thơm đẹp lòng
  rationale: Giữ hình ảnh mùi hương và ý nghĩa lễ vật được Đức Chúa Trời vui nhận, phù hợp công thức tế lễ trong tiếng Hê-bơ-rơ.
- source_word: לַיהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước יהוה thành cách gọi quen thuộc, trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu chung.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: hai con bò đực thuộc đàn bò
  rationale: Không thêm ý “còn non” vì câu này không nêu tuổi của bò; cụm “thuộc đàn bò” phản ánh בְּנֵי בָקָר mà vẫn dễ hiểu.
- source_word: אַיִל אֶחָד
  choice: một con chiên đực
  rationale: Phản ánh trực tiếp danh từ chỉ chiên đực trưởng thành trong ngữ cảnh tế lễ.
- source_word: שִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: bảy con chiên đực một tuổi
  rationale: Giữ cả giới tính đực của כְבָשִׂים và độ tuổi được quy định bởi בְּנֵי שָׁנָה.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Giữ đây là danh riêng của Đức Chúa Trời chứ không thay bằng “CHÚA”; “Đức Giê-hô-va” là hình thức đã quen thuộc và trang trọng trong tiếng Việt, dù “Yahweh/Gia-vê” gần cách phục nguyên học thuật hiện nay hơn.
- issue: Ý nghĩa công thức לְרֵיחַ נִיחֹחַ
  choice: làm hương thơm đẹp lòng
  alternative: làm hương thơm êm dịu
  rationale: Bản dịch giữ nguyên hình ảnh tế lễ và diễn đạt tính được vui nhận, nhưng không khai triển thành một giáo lý về bản tính hay giác quan của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho ngôi thứ hai số nhiều; giữ cấu trúc mệnh lệnh nghi lễ và danh sách con vật súc tích.
