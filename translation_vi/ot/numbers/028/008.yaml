- from: Con chiên thứ hai, hãy dâng vào khoảng giữa hai buổi chiều[a]. Hãy dâng nó cùng một lễ vật ngũ cốc và lễ quán giống như buổi sáng, làm lễ vật dùng lửa dâng[b], có hương thơm đẹp lòng Yahweh.
  to: Con chiên thứ hai, hãy dâng vào khoảng giữa hai buổi chiều[a]. Theo lễ vật ngũ cốc buổi sáng và lễ quán kèm theo, hãy dâng nó làm lễ vật dâng bằng lửa, có hương thơm đẹp lòng Yahweh.[b]
