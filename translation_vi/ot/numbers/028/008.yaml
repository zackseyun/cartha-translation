  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: vi
  text: Con chiên thứ hai, hãy dâng vào khoảng giữa hai buổi chiều[a]. Theo lễ vật ngũ cốc buổi sáng và lễ quán kèm theo, hãy dâng nó làm lễ vật dâng bằng lửa, có hương thơm đẹp lòng Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “giữa hai buổi chiều”, một thành ngữ truyền thống thường được hiểu là “lúc chạng vạng”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lễ vật dâng bằng lửa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: con chiên thứ hai
  rationale: Trong bối cảnh tế lễ, כֶּבֶשׂ chỉ chiên non; “thứ hai” được giữ lại để nối rõ với con chiên dâng buổi sáng.
- source_word: תַּעֲשֶׂה
  choice: hãy dâng
  rationale: Động từ עשה có nghĩa cơ bản là “làm”, nhưng khi có sinh tế và các lễ vật làm đối tượng, tiếng Việt tự nhiên dùng “dâng”.
- source_word: בֵּין הָעַרְבָּיִם
  choice: vào khoảng giữa hai buổi chiều
  rationale: Giữ tương đối sát thành ngữ Hê-bơ-rơ vì thời điểm chính xác còn được hiểu khác nhau; “vào khoảng” giúp câu tiếng Việt tự nhiên hơn mà không ấn định một cách giải thích.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: cùng một lễ vật ngũ cốc ... giống như buổi sáng
  rationale: Trong luật tế lễ, מִנְחָה là lễ vật bằng ngũ cốc chứ không phải lễ vật nói chung.
- source_word: וּכְנִסְכּוֹ
  choice: và lễ quán
  rationale: נֶסֶךְ là lễ vật dạng lỏng được rót ra; “lễ quán” là thuật ngữ tiếng Việt ngắn gọn, chính xác trong văn cảnh tế lễ.
- source_word: אִשֵּׁה
  choice: lễ vật dùng lửa dâng
  rationale: Cách dịch giữ yếu tố lửa vốn hiện diện trong từ Hê-bơ-rơ, đồng thời tránh hiểu “thức ăn” theo nghĩa quá vật chất.
- source_word: רֵיחַ נִיחֹחַ
  choice: hương thơm đẹp lòng
  rationale: Diễn đạt tự nhiên công thức tế lễ, giữ hình ảnh mùi hương và ý lễ vật được vui nhận.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Dùng danh riêng Yahweh để thể hiện trực tiếp danh giao ước יהוה; trong câu tiếng Việt, quan hệ hướng đến Yahweh được diễn đạt tự nhiên qua cụm “đẹp lòng Yahweh”.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng của Đức Chúa Trời; giữ “Yahweh” tránh thay danh riêng bằng một tước hiệu.
- issue: Thời điểm בֵּין הָעַרְבָּיִם
  choice: giữa hai buổi chiều
  alternative: lúc chạng vạng
  rationale: Ý nghĩa thời gian chính xác của thành ngữ này còn gây tranh luận; bản chính giữ cấu trúc Hê-bơ-rơ và chú thích cung cấp cách hiểu thông dụng.
- issue: Ý nghĩa אִשֵּׁה
  choice: lễ vật dùng lửa dâng
  alternative: lễ vật thiêu bằng lửa
  rationale: Danh từ này gắn lễ vật với lửa nhưng cách cấu tạo và sắc thái chính xác không hoàn toàn chắc chắn; cách dịch chính giữ yếu tố lửa mà không khẳng định toàn bộ lễ vật đều bị thiêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có tính chỉ dẫn. Cấu trúc mệnh lệnh không nêu chủ ngữ tránh dùng đại từ cổ “ngươi”, đồng thời phù hợp với lời truyền chung cho dân Israel. Thuật ngữ “lễ quán” được giữ vì tính chính xác trong văn cảnh tế lễ.
