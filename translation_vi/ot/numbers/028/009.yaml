id: NUM.28.9
reference: Numbers 28:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: vi
  text: Vào ngày Sa-bát, phải dâng hai con chiên đực một tuổi, không tì vết, cùng hai phần mười ê-pha[a] bột mịn làm lễ vật ngũ cốc, trộn với dầu, và lễ quán kèm theo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “hai phần mười”; trong luật tế lễ, điều này có nghĩa là hai phần mười ê-pha.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: Còn vào ngày Sa-bát
  rationale: “Còn” giữ chức năng liên kết của וּ và cho thấy đây là quy định bổ sung cho ngày Sa-bát; “ngày Sa-bát” là cách gọi quen thuộc, trang trọng trong tiếng Việt.
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: hai con chiên đực một tuổi
  rationale: כְבָשִׂים chỉ chiên non; hình thức giống đực và bối cảnh tế lễ hỗ trợ việc nêu rõ “đực.” Thành ngữ בְּנֵי שָׁנָה được diễn đạt tự nhiên là “một tuổi.”
- source_word: תְּמִימִם
  choice: không tì vết
  rationale: Trong luật tế lễ, từ này nói đến con vật không có khiếm khuyết; “không tì vết” vừa chính xác vừa quen thuộc.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: hai phần mười ê-pha
  rationale: עִשָּׂרוֹן là đơn vị bằng một phần mười ê-pha trong các quy định tế lễ; cách dịch này làm rõ đơn vị được ngầm hiểu mà không đổi lượng.
- source_word: סֹלֶת מִנְחָה
  choice: bột mịn làm lễ vật ngũ cốc
  rationale: סֹלֶת là bột được xay mịn, còn מִנְחָה trong văn cảnh này là lễ vật bằng ngũ cốc, không phải lễ vật nói chung.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: trộn với dầu
  rationale: Diễn đạt trực tiếp trạng thái bột được hòa trộn với dầu bằng tiếng Việt hiện đại.
- source_word: וְנִסְכּוֹ
  choice: và lễ quán đi kèm
  rationale: נֶסֶךְ là lễ dâng chất lỏng bằng cách rót; hậu tố sở hữu số ít chỉ lễ quán thuộc về hoặc đi kèm toàn bộ lễ tế ngày Sa-bát. “Đi kèm” tự nhiên hơn đại từ “của nó” vốn dễ mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Chủ thể và động từ dâng không được nêu trực tiếp trong mệnh đề Hê-bơ-rơ
  choice: phải dâng
  alternative: giữ nguyên một danh sách không có động từ
  rationale: Văn cảnh là chuỗi mệnh lệnh về các lễ vật phải dâng; bổ sung “phải dâng” làm câu tiếng Việt hoàn chỉnh nhưng không xác định thêm một chủ thể hay ý nghĩa thần học không có trong văn bản.
- issue: Sở thuộc của וְנִסְכּוֹ
  choice: lễ quán đi kèm
  alternative: lễ quán của nó
  rationale: Hậu tố số ít có thể quy chiếu đến lễ tế như một tổng thể; cách diễn đạt “đi kèm” giữ chức năng phụ trợ của lễ quán và tránh buộc nó vào riêng danh từ gần nhất.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Giữ thuật ngữ tế lễ quen thuộc “lễ vật ngũ cốc” và “lễ quán”; dùng “đi kèm” để câu tự nhiên và tránh đại từ sở hữu mơ hồ. Dấu chú thích [a] được đặt ngay sau đơn vị đo mà chú thích giải thích.
