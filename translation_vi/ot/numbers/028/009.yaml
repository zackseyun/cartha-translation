  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: hai chiên đực một tuổi không tì vết, hai phần mười ê-pha bột mịn làm lễ vật ngũ cốc có trộn dầu, và lễ quán. Tuy nhiên, “lễ quán đi kèm” diễn đạt chức năng đi kèm nhưng làm mờ hậu tố sở hữu trong וְנִסְכּוֹ (“lễ quán của nó/lễ quán kèm theo”).'
