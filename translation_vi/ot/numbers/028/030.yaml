base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/030.yaml
  text: and one male goat to make atonement for you[a].
translation:
  language: vi
  text: và một con dê đực để làm lễ chuộc tội cho anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu Hebrew được diễn đạt tỉnh lược: “và một con dê đực, để làm lễ chuộc tội cho anh em.” Theo ngữ cảnh tế lễ ngay trước đó, con dê này được dâng làm lễ vật chuộc tội.'
    reason: Giải thích sự tỉnh lược và thành phần được ngữ cảnh hàm ý mà không đưa thành phần ấy vào chính văn.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: một con dê đực
  rationale: Cụm từ chỉ một con dê giống đực trong ngữ cảnh tế lễ; cách diễn đạt này tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: אֶחָד
  choice: một
  rationale: Số từ xác định chỉ một con vật.
- source_word: לְכַפֵּר
  choice: để làm lễ chuộc tội
  rationale: Động từ כפר trong ngữ cảnh tế lễ nói đến hành động thực hiện nghi thức chuộc tội; cách dịch này giữ sắc thái nghi lễ mà không áp đặt một học thuyết cụ thể.
- source_word: עֲלֵיכֶם
  choice: cho anh em
  rationale: Với כפר, giới từ עַל đánh dấu những người được hưởng hiệu lực của nghi thức; “cho anh em” là cách nói tự nhiên.
theological_decisions:
- issue: Có nên thêm loại lễ vật không được nêu rõ trong câu Hebrew hay không
  choice: Không thêm “làm lễ vật chuộc tội” vào chính văn; chỉ dịch mệnh đề mục đích “để làm lễ chuộc tội cho anh em”
  alternative: Thêm “làm lễ vật chuộc tội” dựa vào công thức tế lễ trong ngữ cảnh gần
  rationale: Bản Hebrew mang tính tỉnh lược nhưng không có danh từ חטאת trong câu này. Giữ chính văn gần nguồn giúp bảo tồn sự tỉnh lược; chú thích giải thích loại lễ vật được ngữ cảnh hàm ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ngôi thứ hai; giữ nguyên tính tỉnh lược của nguyên bản trong chính văn và giải thích bằng chú thích.
