  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: vi
  text: Lễ quán đi kèm phải là một phần tư hin cho mỗi con chiên[a]. Tại nơi thánh[b], hãy rót lễ quán bằng thức uống gây say[c] dâng lên Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho một con chiên”; sát nghĩa: “cho con chiên duy nhất.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong thánh điện.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ chỉ một thức uống gây say, thường không phải rượu nho; loại thức uống cụ thể không được nêu rõ.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: Lễ quán đi kèm
  rationale: Danh từ có hậu tố chỉ lễ bằng chất lỏng đi kèm với con chiên; “lễ quán” là thuật ngữ tế lễ ngắn gọn, còn “đi kèm” làm rõ quan hệ do hậu tố diễn đạt.
- source_word: רְבִיעִת הַהִין
  choice: một phần tư hin
  rationale: Giữ nguyên đơn vị đo cổ hin và diễn đạt chính xác tỷ lệ một phần tư.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: cho mỗi con chiên
  rationale: Nguyên văn sát nghĩa là “cho con chiên ấy/một con chiên”; trong ngữ cảnh hai con chiên được dâng hằng ngày, cách dịch phân phối “mỗi con” truyền đạt tự nhiên lượng dành cho từng con.
- source_word: בַּקֹּדֶשׁ
  choice: Tại nơi thánh
  rationale: Trong ngữ cảnh tế lễ, cụm này nhiều khả năng chỉ địa điểm thánh; cách dịch này giữ gần hình thức nguồn và không xác định quá mức phạm vi của nơi ấy.
- source_word: הַסֵּךְ נֶסֶךְ
  choice: phải rót lễ quán
  rationale: Giữ cả hành động rót và danh từ lễ quán vốn được lặp từ cùng gốc trong tiếng Hê-bơ-rơ, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: שֵׁכָר
  choice: thức uống có men
  rationale: Từ này chỉ đồ uống gây say, thường phân biệt với rượu nho, nhưng không xác định chính xác loại thức uống; “có men” tránh cách hiểu hiện đại rằng nhất thiết phải có nồng độ cồn cao.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giới từ diễn tả lễ vật hướng đến Yahweh; “dâng lên” phù hợp ngữ cảnh tế lễ và giữ nguyên danh riêng giao ước.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Bản nguồn trực tiếp dùng danh riêng יהוה; phiên âm “Yahweh” bảo tồn danh giao ước mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của בַּקֹּדֶשׁ
  choice: Tại nơi thánh
  alternative: Trong nơi thánh / Trong thánh điện / một cách thánh khiết
  rationale: Ngữ cảnh tế lễ thiên về nghĩa địa điểm, nhưng câu không xác định rõ hơn đó là toàn khu thánh hay một phần cụ thể; vì vậy không thu hẹp thành một địa điểm kiến trúc quá chuyên biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ tế lễ “lễ quán” nhất quán; giữ đơn vị cổ “hin” và danh Yahweh. Các chú thích bảo tồn những khả năng từ vựng thực sự của bản Hê-bơ-rơ.
