revisions:
- from: cùng một phần mười ê-pha bột mịn làm lễ vật ngũ cốc[a], trộn với một phần tư hin dầu ô-liu giã ép.[b]
  to: cùng một phần mười ê-pha bột mịn, dùng làm lễ vật ngũ cốc[a], trộn với một phần tư hin dầu ép.[b]
  rationale: Bản sửa giữ nguyên các lượng đo và chức năng nghi lễ của nguyên văn, loại bỏ chi tiết “ô-liu” không được nêu minh thị, và thay cách diễn đạt không tự nhiên “giã ép” bằng “dầu ép.” Chú thích b được chỉnh để phản ánh lựa chọn từ vựng của כָּתִית mà không làm thay đổi nghĩa câu.
  reviewer_model: gpt-5.6-terra
