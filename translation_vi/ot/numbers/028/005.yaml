base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: vi
  text: cùng một phần mười ê-pha bột mịn, dùng làm lễ vật ngũ cốc[a], trộn với một phần tư hin dầu ép.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ê-pha và hin là các đơn vị đo lường của người Israel thời xưa.
    reason: cultural_note
  - marker: b
    text: Từ Hê-bơ-rơ này chỉ dầu được giã hoặc nghiền; cũng có thể dịch là “dầu đã giã.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: cùng một phần mười ê-pha
  rationale: Tiếp đầu ngữ וַ nối lượng bột này với quy định tế lễ ở câu trước. Giữ tên đơn vị cổ “ê-pha” thay vì quy đổi gần đúng.
- source_word: סֹלֶת
  choice: bột mịn
  rationale: Chỉ loại bột được xay kỹ, dùng trong các lễ vật; cách dịch này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: לְמִנְחָה
  choice: làm lễ vật ngũ cốc
  rationale: Trong luật tế lễ của phần này, מִנְחָה là lễ vật làm từ sản phẩm ngũ cốc, không chỉ là một lễ vật hay món quà nói chung.
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: trộn với ... dầu ô-liu
  rationale: Phân từ bị động mô tả bột được hòa trộn với dầu. Dầu trong bối cảnh Israel cổ đại là dầu ô-liu; nêu rõ giúp độc giả hiện đại hiểu đúng chất liệu.
- source_word: כָּתִית
  choice: giã ép
  rationale: Từ này mô tả dầu thu được từ ô-liu bị giã hoặc nghiền. “Giã ép” tự nhiên hơn “dầu bị đánh” và vẫn phản ánh phương pháp chế biến cổ.
- source_word: רְבִיעִת הַהִין
  choice: một phần tư hin
  rationale: Diễn đạt phân số tự nhiên trong tiếng Việt và giữ nguyên tên đơn vị đo lường cổ “hin”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các đơn vị đo cổ để bảo toàn tính cụ thể của nguyên văn; chú thích giải thích bối cảnh. Dùng “lễ vật ngũ cốc” để phân biệt loại lễ vật này với các lễ vật nói chung.
