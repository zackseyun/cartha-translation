  text: וַ/יִּקַּ֞ח אֶלְעָזָ֣ר הַ/כֹּהֵ֗ן אֵ֚ת מַחְתּ֣וֹת הַ/נְּחֹ֔שֶׁת אֲשֶׁ֥ר הִקְרִ֖יבוּ הַ/שְּׂרֻפִ֑ים וַֽ/יְרַקְּע֖וּ/ם צִפּ֥וּי לַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: vi
  text: Vậy thầy tế lễ Ê-lê-a-sa lấy những lư hương[a] bằng đồng mà những người bị lửa thiêu[b] đã dâng, rồi người ta dát các lư ấy thành lớp bọc[c] cho bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dụng cụ đựng than lửa”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những người bị thiêu”, tức những người đã bị lửa thiêu trong phần thuật chuyện trước.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “lớp dát” hoặc “lớp phủ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: lư hương
  rationale: Chỉ những dụng cụ đựng than hồng và hương trong nghi lễ; “lư hương” là cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: הַנְּחֹשֶׁת
  choice: bằng đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng hoặc hợp kim đồng; “đồng” là cách gọi tự nhiên và phù hợp với ngữ cảnh các vật dụng nơi thánh.
- source_word: הִקְרִיבוּ
  choice: đã dâng
  rationale: Ở thể Hiphil và trong ngữ cảnh nghi lễ, động từ mang nghĩa đem đến để dâng; “đã” thể hiện hành động xảy ra trước việc Ê-lê-a-sa lấy các lư.
- source_word: הַשְּׂרֻפִים
  choice: những người bị lửa thiêu
  rationale: Giữ nghĩa cụ thể của phân từ bị động từ שׂרף và liên kết tự nhiên với biến cố lửa thiêu trong phần thuật chuyện ngay trước đó.
- source_word: וַיְרַקְּעוּם
  choice: rồi người ta dát mỏng các lư ấy
  rationale: Động từ ở ngôi thứ ba số nhiều với hậu tố chỉ tân ngữ số nhiều. Chủ thể không được nêu rõ, nên “người ta” bảo toàn tính bất định, còn “các lư ấy” thể hiện rõ tân ngữ.
- source_word: צִפּוּי
  choice: lớp bọc
  rationale: Diễn tả lớp kim loại phủ lên một vật; “lớp bọc” vừa tự nhiên vừa giữ nghĩa rộng hơn các cách gọi kỹ thuật như “lớp dát”.
- source_word: לַמִּזְבֵּחַ
  choice: cho bàn thờ
  rationale: 'Giới từ לְ ở đây chỉ mục đích hoặc công dụng: các lư được dát mỏng để làm lớp bọc dành cho bàn thờ.'
theological_decisions:
- issue: Danh tính của הַשְּׂרֻפִים
  choice: Không thêm tên Cô-rê hay xác định cụ thể hơn ngoài “những người bị lửa thiêu”.
  alternative: “những người thuộc phe Cô-rê đã bị thiêu”
  rationale: Ngữ cảnh trước giúp nhận diện họ, nhưng chính câu này chỉ dùng một phân từ bị động; bản dịch không nên đưa phần giải thích ngữ cảnh vào chính văn.
- issue: Chủ thể của וַיְרַקְּעוּם
  choice: Dùng chủ thể bất định “người ta”.
  alternative: “Ê-lê-a-sa dát mỏng chúng” hoặc chuyển hoàn toàn sang bị động
  rationale: Hình thái Hê-bơ-rơ là ngôi thứ ba số nhiều nhưng không nêu danh tính chủ thể. Cách dịch này giữ cấu trúc chủ động và tân ngữ, đồng thời không gán hành động cho Ê-lê-a-sa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo lối gọi phổ thông; phiên âm tên riêng “Ê-lê-a-sa”. Cụm “người ta” làm rõ rằng chủ thể của hành động dát mỏng không được văn bản xác định.
