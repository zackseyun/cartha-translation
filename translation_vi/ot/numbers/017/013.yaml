  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: vi
  text: Ông đứng giữa những người đã chết và những người còn sống, và dịch bệnh đã dừng lại.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Ông đứng
  rationale: Động từ עמד có nghĩa cơ bản là “đứng” hoặc “đứng vào vị trí”; cách dịch này tự nhiên, cụ thể và không diễn giải quá mức tư thế của nhân vật.
- source_word: בֵּין ... וּבֵין
  choice: giữa ... và
  rationale: Cặp giới từ biểu thị vị trí phân cách hai nhóm; “giữa ... và” là cách diễn đạt trực tiếp, tự nhiên trong tiếng Việt.
- source_word: הַמֵּתִים
  choice: những người đã chết
  rationale: Dạng dùng như danh từ chỉ những người đã chết; cách dịch này rõ nghĩa và duy trì sự tương phản với những người còn sống.
- source_word: הַחַיִּים
  choice: những người còn sống
  rationale: Tính từ được danh từ hóa chỉ những người vẫn sống; “còn sống” làm nổi bật sự tương phản trong bối cảnh dịch bệnh đang diễn ra.
- source_word: וַתֵּעָצַר
  choice: dừng lại
  rationale: Dạng động từ này diễn tả việc dịch bệnh bị chặn và không tiếp tục lan tới; tiếng Việt tự nhiên có thể diễn đạt kết quả ấy bằng “dừng lại” mà không cần dùng cấu trúc bị động cứng.
- source_word: הַמַּגֵּפָה
  choice: dịch bệnh
  rationale: מַגֵּפָה ở đây chỉ một đợt tai họa gây chết người. “Dịch bệnh” rõ ràng với độc giả hiện đại và phù hợp diễn tiến của trình thuật.
theological_decisions:
- issue: Bản chất của מַגֵּפָה trong bối cảnh phán xét
  choice: dịch bệnh
  alternative: tai họa; ôn dịch
  rationale: Trong văn cảnh gần, từ này nói đến một tai họa gây chết người do Đức Chúa Trời giáng xuống. “Dịch bệnh” giữ được tính nghiêm trọng và hình ảnh một đợt bùng phát chết chóc nhưng không thêm lời giải thích thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì câu riêng lẻ không nêu tên A-rôn, đồng thời tránh tự ý chèn tên không có trong câu Hebrew. Cấu trúc “thì” thể hiện diễn tiến và kết quả của hai mệnh đề Hebrew nối bằng waw.
