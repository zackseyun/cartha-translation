source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Hãy đặt lại cây gậy của A-rôn trước Chứng Ước[b], để lưu giữ làm dấu hiệu cho những kẻ phản nghịch[a]. Nhờ đó, con sẽ chấm dứt những lời than phiền của họ chống lại Ta, để họ không chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “những con trai của sự phản nghịch”; cũng có thể dịch là “những người phản nghịch.”'
    reason: lexical_alternative
  - marker: b
    text: “Chứng Ước” có lẽ chỉ chứng tích giao ước gắn với Hòm Giao Ước; nguyên văn Hê-bơ-rơ chỉ nói ngắn gọn là “chứng ước.”
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước thay vì thay bằng một tước hiệu, phù hợp trực tiếp với dạng Hê-bơ-rơ.
- source_word: הָשֵׁב
  choice: hãy đặt lại
  rationale: Dạng Hiphil mệnh lệnh của שוב đòi Môi-se đưa cây gậy trở về vị trí trước đó; “đặt lại” tự nhiên và chính xác trong ngữ cảnh.
- source_word: מַטֵּה
  choice: cây gậy
  rationale: Chỉ vật thể cụ thể của A-rôn; “cây gậy” là cách gọi rõ ràng, thông dụng trong tiếng Việt hiện đại.
- source_word: לִפְנֵי הָעֵדוּת
  choice: trước Chứng Ước
  rationale: Giữ cách nói ngắn gọn của nguyên văn và không tự ý thêm “Hòm”; viết hoa để biểu thị vật/chứng tích giao ước đặc thù trong Đền Tạm.
- source_word: לְמִשְׁמֶרֶת
  choice: để lưu giữ
  rationale: Diễn đạt mục đích bảo tồn, canh giữ vật này lâu dài.
- source_word: לְאוֹת
  choice: làm dấu hiệu
  rationale: אוֹת có nghĩa là dấu hiệu hoặc dấu chứng; “dấu hiệu” rõ và tự nhiên.
- source_word: לִבְנֵי מֶרִי
  choice: cho những kẻ phản nghịch
  rationale: Thành ngữ sát chữ là “những con trai của sự phản nghịch”; tiếng Việt tự nhiên diễn đạt nhóm người được đặc trưng bởi sự phản nghịch là “những kẻ phản nghịch”, không giới hạn sai đối tượng vào con trai theo nghĩa sinh học.
- source_word: וּתְכַל
  choice: như vậy, con sẽ chấm dứt
  rationale: Hiphil của כלה mang nghĩa khiến cho kết thúc/chấm dứt. Cách nối này giữ sắc thái kết quả hoặc mục đích mà không ép cấu trúc thành một mệnh lệnh mới.
- source_word: תְּלוּנֹּתָם מֵעָלַי
  choice: những lời họ lằm bằm chống lại Ta
  rationale: “Lằm bằm” duy trì mô-típ than phiền dai dẳng trong hành trình hoang mạc; “chống lại Ta” diễn đạt đúng hướng của lời than phiền.
- source_word: וְלֹא יָמֻתוּ
  choice: và họ sẽ không phải chết
  rationale: 'Giữ liên từ Hê-bơ-rơ đồng thời diễn đạt kết quả được nhắm tới: việc chấm dứt phản nghịch giúp họ khỏi chết.'
theological_decisions:
- issue: Danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng YHWH; phiên âm “Yahweh” bảo tồn danh giao ước mà không thay thế bằng tước hiệu.
- issue: Ý nghĩa của הָעֵדוּת trong bối cảnh Đền Tạm
  choice: Chứng Ước
  alternative: Hòm Chứng Ước / bản chứng ước
  rationale: Nguyên văn chỉ nói “chứng ước/chứng tích”, không nói rõ “Hòm”. Bản dịch giữ sự súc tích và để chú thích nêu quan hệ có thể có với Hòm Giao Ước.
- issue: Thành ngữ לִבְנֵי מֶרִי
  choice: những kẻ phản nghịch
  alternative: những con trai của sự phản nghịch
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ những người mang đặc tính phản nghịch, không nhất thiết chỉ nam giới hay quan hệ huyết thống. Bản chính chuyển nghĩa tự nhiên; chú thích bảo tồn hình thức sát chữ.
- issue: Quan hệ giữa việc chấm dứt lời lằm bằm và không chết
  choice: kết quả/mục đích được nhắm tới
  alternative: lời bảo đảm tuyệt đối rằng họ sẽ không chết
  rationale: Mệnh đề phối hợp có thể mang sắc thái mục đích hoặc kết quả. “Sẽ không phải chết” tránh giải thích quá mức nhưng vẫn cho thấy dấu hiệu nhằm ngăn hậu quả chết chóc.
translation_notes:
  register: 'Văn phong trang trọng nhưng hiện đại, dùng “phán” trong lời tường thuật thần linh và cặp đại từ “Ta–con” trong lời Yahweh nói với Môi-se. Các tên riêng theo dạng Việt hóa thông dụng: Môi-se, A-rôn. Mọi dấu chú thích trong phần chính tương ứng đầy đủ với chú thích.'
