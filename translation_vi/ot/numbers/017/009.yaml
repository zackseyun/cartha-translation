  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Trong công thức tường thuật này, động từ דבר chỉ việc Đức Chúa Trời truyền lời. “Phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và vẫn phân biệt được với אמר ở vế dẫn lời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự thông dụng “Yahweh”, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu tiếng Việt “phán với”, từ này biểu thị người tiếp nhận lời nói một cách tự nhiên.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn nhập lời trực tiếp, “rằng” tự nhiên hơn bản dịch sát chữ “nói rằng” và báo trước nội dung phát ngôn ở câu kế tiếp.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo toàn tính chất danh riêng mà không thay thế bằng tước hiệu; chú thích ghi nhận các cách thể hiện khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn. Không đặt chú thích ở “Môi-se”, vì chú thích tiếng Anh gắn tại đó nhưng nội dung thực tế giải thích danh YHWH; nếu cần chú thích xuất bản, dấu chú thích nên đặt ngay sau “Yahweh”.
