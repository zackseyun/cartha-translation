  text: 'Rồi Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; theo truyền thống được dịch là “Đức Giê-hô-va.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa trình thuật tiến tới; “Rồi” diễn đạt tự nhiên trình tự sự việc. Với Đức Chúa Trời là chủ thể, “phán” là cách dùng trang trọng và quen thuộc trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Phiên âm danh riêng YHWH theo quy ước Kinh Thánh tiếng Việt phổ biến, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Sau động từ “phán”, tiếng Việt tự nhiên dùng “phán với” để chỉ người tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức nguyên mẫu này giới thiệu nội dung lời phán; “rằng” tự nhiên hơn “nói rằng” trong cấu trúc tiếng Việt và tránh lặp ý với “phán”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng YHWH. Bản dịch giữ danh riêng bằng dạng phiên âm quen thuộc với độc giả Việt Nam, không thay bằng tước hiệu “CHÚA”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức dẫn nhập lời phán ngắn gọn; dấu hai chấm báo hiệu nội dung trực tiếp sẽ tiếp nối ở câu sau.
