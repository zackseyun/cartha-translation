  text: דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/קַ֣ח מֵֽ/אִתָּ֡/ם מַטֶּ֣ה מַטֶּה֩ לְ/בֵ֨ית אָ֜ב מֵ/אֵ֤ת כָּל נְשִֽׂיאֵ/הֶם֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת אִ֣ישׁ אֶת שְׁמ֔/וֹ תִּכְתֹּ֖ב עַל מַטֵּֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: vi
  text: Hãy nói với con cái Israel[a] và lấy từ họ mười hai cây gậy[b], mỗi gia tộc theo dòng cha một cây, từ tất cả các thủ lĩnh của họ theo gia tộc mình. Con phải viết tên của mỗi người trên cây gậy của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Israel”. Tiếng Hê-bơ-rơ, theo nghĩa đen, là “các con trai của Israel”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ מַטֶּה có thể chỉ “gậy” hoặc “trượng”; ở đây nói đến một cây gậy cụ thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh thân tộc của thành ngữ Hê-bơ-rơ, đồng thời đây là cách diễn đạt trang trọng và quen thuộc trong tiếng Việt; chú thích nêu cách dịch tập thể tự nhiên hơn.
- source_word: מַטֶּה
  choice: cây gậy
  rationale: Trong câu này từ ngữ chỉ một vật thể cụ thể có thể được viết tên lên; “cây gậy” tự nhiên hơn “cây trượng” và không đưa thêm sắc thái vương quyền.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: mỗi gia tộc một cây gậy
  rationale: Diễn đạt tự nhiên giá trị phân phối của phép lặp מַטֶּה מַטֶּה và hiểu בֵית אָב là đơn vị gia tộc theo dòng cha, không chỉ một hộ gia đình hạt nhân.
- source_word: נְשִׂיאֵיהֶם
  choice: các thủ lĩnh của họ
  rationale: Phản ánh vai trò đứng đầu các chi tộc mà không gợi sai rằng họ là các hoàng tử.
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc mình
  rationale: Cho thấy các thủ lĩnh và gậy được sắp theo những gia tộc thuộc dòng cha; đại từ “mình” quy chiếu tự nhiên về từng thủ lĩnh.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: tổng cộng mười hai cây gậy
  rationale: “Tổng cộng” làm rõ rằng cụm số lượng tóm kết số gậy vừa được truyền lấy, không thêm nội dung ngoài cú pháp nguồn.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: Con phải viết tên của mỗi người
  rationale: Giữ lực phân phối của אִישׁ và chuyển mệnh lệnh ngôi hai số ít sang tiếng Việt tự nhiên.
- source_word: עַל מַטֵּהוּ
  choice: trên cây gậy của người ấy
  rationale: Giữ rõ sự tương ứng giữa tên từng thủ lĩnh và cây gậy thuộc về người đó.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “con” cho lời Đức Chúa Trời truyền trực tiếp cho Môi-se, tránh đại từ số nhiều không có trong nguồn. Giữ thành ngữ “con cái Israel” trong chính văn nhưng giải thích lựa chọn tập thể ở chú thích.
