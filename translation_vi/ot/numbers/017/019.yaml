  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: vi
  text: Hãy đặt chúng trong Lều Hội Kiến, trước Chứng Ngôn[a], tại nơi Ta sẽ gặp các con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trước lời chứng của giao ước”. “Chứng Ngôn” có lẽ chỉ lời chứng gắn với giao ước, liên hệ với các bảng đá trong nơi thánh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tại nơi Ta sẽ tỏ mình cho các con biết” hoặc “tại nơi Ta ấn định gặp các con”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: Con hãy đặt chúng
  rationale: Dạng Hifil ngôi hai số ít với hậu tố ngôi ba số nhiều mang ý khiến các vật được đặt xuống. “Hãy đặt” diễn đạt tự nhiên sức chỉ thị; “con” phản ánh người trực tiếp được phán bảo là một cá nhân.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Đây là danh xưng quen thuộc của nơi thánh. “Lều Hội Kiến” vừa sát nghĩa vừa tự nhiên trong tiếng Việt, và viết hoa như một danh xưng.
- source_word: לִפְנֵי הָעֵדוּת
  choice: trước Chứng Ước
  rationale: לִפְנֵי là “trước, ở phía trước”. הָעֵדוּת có nghĩa đen là “chứng ngôn/chứng tích”, nhưng trong ngữ cảnh nơi thánh chỉ chứng cứ hay vật làm chứng cho giao ước. “Chứng Ước” ngắn gọn, giữ được nội hàm giao ước mà không xác định quá mức là các bảng đá hay Hòm Giao Ước.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: tại nơi Ta sẽ gặp
  rationale: Dạng Nifal của יעד trong ngữ cảnh này diễn tả cuộc gặp đã được ấn định. Cấu trúc quan hệ cùng שָׁמָּה có nghĩa chỉ nơi chốn, nên “tại nơi” là cách diễn đạt tự nhiên.
- source_word: לָכֶם
  choice: các con
  rationale: Đại từ Hê-bơ-rơ ở số nhiều. Trong thành ngữ với יעד, giới từ ל mang nghĩa gặp “với” ai; tiếng Việt không cần dịch riêng giới từ sau động từ “gặp”. “Các con” giữ sự khác biệt với “con” số ít ở đầu câu.
- source_word: שָׁמָּה
  choice: được hàm chứa trong “tại nơi”
  rationale: Trạng từ “ở đó” được kết hợp vào cụm quan hệ chỉ nơi chốn để tránh câu tiếng Việt dư thừa mà không làm mất nghĩa.
theological_decisions:
- issue: Đối tượng mà הָעֵדוּת (“chứng ngôn/chứng tích”) chỉ đến
  choice: Giữ cách gọi khái quát “Chứng Ước” mà không xác định đó là các bảng đá hay chiếc hòm.
  alternative: “các bảng Chứng Ước” hoặc “Hòm Chứng Ước”
  rationale: Nguyên văn mang nội hàm thần học về chứng cứ của giao ước nhưng không nêu rõ vật quy chiếu trong câu này. Không nên thu hẹp điều mà bản Hê-bơ-rơ để ngỏ.
- issue: Sắc thái của אִוָּעֵד
  choice: “Ta sẽ gặp”
  alternative: “Ta sẽ tỏ mình ra” hoặc “Ta ấn định gặp”
  rationale: Trong ngữ cảnh Lều Hội Kiến, nghĩa trực tiếp và phù hợp nhất là Đức Chúa Trời gặp dân Ngài tại nơi đã định, nhưng chú thích bảo lưu các sắc thái từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp đại từ “Con/các con” phân biệt số ít của người nhận mệnh lệnh với số nhiều của cộng đồng mà Đức Chúa Trời gặp. “Chứng Ước” được viết hoa như một danh xưng trong nơi thánh nhưng vẫn để chú thích giải thích độ mở của nguyên ngữ.
