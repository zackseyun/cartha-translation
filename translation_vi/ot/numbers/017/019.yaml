    rationale: Nguyên ngữ thực sự chuyển từ ngôi hai số ít sang số nhiều, nhưng tiếng Việt có thể diễn đạt mệnh lệnh đầu câu không cần đại từ, rồi giữ “các con” tại chỗ mà tiếng Hê-bơ-rơ nêu số nhiều rõ ràng.
