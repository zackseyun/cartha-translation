- from: Con hãy đặt chúng trong Lều Hội Kiến, trước Chứng Ước[a], tại nơi Ta sẽ gặp các con[b].
  to: Hãy đặt chúng trong Lều Hội Kiến, trước Chứng Ngôn[a], tại nơi Ta sẽ gặp các con[b].
  rationale: Sửa “Chứng Ước” thành “Chứng Ngôn” để phản ánh trực tiếp hơn הָעֵדוּת, đồng thời không quyết định vật quy chiếu là các bảng đá, chiếc hòm, hay chứng cứ giao ước theo nghĩa rộng. Bỏ “Con” ở đầu câu để tiếng Việt trôi chảy hơn mà không làm mất mệnh lệnh ngôi số ít; “các con” vẫn bảo lưu số nhiều của לָכֶם.
