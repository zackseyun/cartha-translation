  text: הֵרֹ֗מּוּ מִ/תּוֹךְ֙ הָ/עֵדָ֣ה הַ/זֹּ֔את וַ/אֲכַלֶּ֥ה אֹתָ֖/ם כְּ/רָ֑גַע וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: vi
  text: “Hãy rời khỏi giữa cộng đồng này[a], để Ta diệt sạch họ trong chốc lát[b].” Bấy giờ, họ sấp mặt xuống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Hãy nâng mình lên khỏi giữa cộng đồng này”; hàm ý: “Hãy tách mình ra khỏi cộng đồng này.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để Ta tiêu diệt họ trong khoảnh khắc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: Hãy rời khỏi
  rationale: Động từ רום ở thể Nifal, mệnh lệnh số nhiều, theo ngữ cảnh mang nghĩa thành ngữ là rời ra hoặc tách mình khỏi cộng đồng. “Hãy rời khỏi” truyền đạt rõ mệnh lệnh khẩn cấp trong tiếng Việt hiện đại; nghĩa sát hình ảnh hơn được giữ trong chú thích.
- source_word: מִתּוֹךְ
  choice: khỏi giữa
  rationale: Diễn tả sự chuyển ra khỏi vị trí đang ở bên trong một nhóm; “khỏi giữa” vừa gần cấu trúc Hê-bơ-rơ vừa tự nhiên trong câu này.
- source_word: הָעֵדָה הַזֹּאת
  choice: cộng đồng này
  rationale: עֵדָה chỉ cộng đồng dân Y-sơ-ra-ên đang tụ họp. “Cộng đồng” giữ được ý nghĩa tập thể mà không giới hạn vào một buổi nhóm mang tính nghi lễ.
- source_word: וַאֲכַלֶּה
  choice: để Ta diệt sạch
  rationale: כלה ở thể Piel có nghĩa làm cho chấm dứt hoàn toàn, tiêu diệt hoặc tận diệt. “Diệt sạch” giữ nguyên mức độ nghiêm trọng và tính toàn diện của lời phán xét.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ tân ngữ chỉ cộng đồng; “họ” là cách gọi tự nhiên và trung tính trong tiếng Việt.
- source_word: כְּרָגַע
  choice: trong chốc lát
  rationale: Cụm từ diễn tả một khoảng thời gian cực ngắn. “Trong chốc lát” tự nhiên và gần nghĩa nguyên văn.
- source_word: וַיִּפְּלוּ
  choice: Bấy giờ, họ sấp mặt xuống
  rationale: Wayyiqtol tiếp nối diễn tiến câu chuyện. “Bấy giờ” thể hiện sự đáp ứng tức thời mà không biến quan hệ này thành một kết luận nhân quả rõ hơn nguyên văn.
- source_word: עַל פְּנֵיהֶם
  choice: sấp mặt xuống
  rationale: Thành ngữ chỉ tư thế phủ phục, có thể hàm ý kinh sợ, cầu thay hoặc thờ phượng. Cách dịch giữ nguyên hành động nhưng không xác định động cơ.
theological_decisions:
- issue: Bản chất mệnh lệnh dành cho Môi-se và A-rôn trước sự phán xét
  choice: Dịch là lời truyền phải rời khỏi cộng đồng trước khi Đức Chúa Trời thi hành sự phán xét tức khắc.
  alternative: Dịch sát hình ảnh là “hãy nâng mình lên khỏi giữa cộng đồng này” hoặc giải nghĩa rõ hơn là “hãy tách mình ra”.
  rationale: Nguyên văn đưa ra một mệnh lệnh khẩn cấp rồi nêu ý định tiêu diệt cộng đồng trong thời gian rất ngắn. Bản dịch không làm nhẹ lời đe dọa, đồng thời tránh bổ sung lời giải thích thần học ngoài câu.
- issue: Ý nghĩa của hành động sấp mặt
  choice: Chỉ mô tả tư thế phủ phục, không nêu rõ đó là thờ phượng, kinh sợ hay cầu thay.
  alternative: Giải thích hành động này là lời cầu thay của Môi-se và A-rôn.
  rationale: Ngữ cảnh rộng hơn có thể gợi ý sự cầu thay, nhưng chính câu này chỉ thuật lại tư thế của họ; giữ nguyên độ mở tránh quyết định thay cho nguyên văn.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Đại từ “Ta” được dùng trong lời Đức Chúa Trời phán. “Cộng đồng” diễn đạt עֵדָה theo nghĩa tập thể; “sấp mặt xuống” giữ sự trang nghiêm của thành ngữ mà vẫn dễ hiểu với độc giả phổ thông.
