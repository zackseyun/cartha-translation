  terminology: “Cộng đồng” là cách chuyển ngữ phù hợp, không quá nghi lễ hóa עֵדָה. Đại từ “Ta” phù hợp với lời phán thần linh trong văn phong trang trọng. Các chú thích giữ được lựa chọn sát hình ảnh “nâng mình lên” và lựa chọn từ vựng cho thời điểm/phán xét.
