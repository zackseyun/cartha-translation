source:
  edition: WLC
  text: כֹּ֣ל הַ/קָּרֵ֧ב הַ/קָּרֵ֛ב אֶל מִשְׁכַּ֥ן יְהוָ֖ה יָמ֑וּת הַ/אִ֥ם תַּ֖מְנוּ לִ/גְוֺֽעַ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: vi
  text: Bất cứ ai đến gần—đến gần Đền Tạm của Yahweh—đều sẽ chết. Chẳng lẽ chúng tôi sẽ tiêu vong[a] hết sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chẳng lẽ chúng tôi sẽ chết hết sao?” Tiếng Hê-bơ-rơ ở đây dùng một động từ khác với động từ được dịch là “sẽ chết” trong câu trước; vì vậy, câu này có thể gợi sắc thái tiêu vong hay bị hủy diệt, thay vì chỉ lặp lại cùng một động từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Bất cứ ai
  rationale: Trong câu này, כֹּל chỉ bất kỳ người nào đến gần; “bất cứ ai” diễn đạt tự nhiên và giữ nguyên phạm vi bao quát.
- source_word: הַקָּרֵב הַקָּרֵב
  choice: đến gần, đến gần
  rationale: Giữ nguyên sự lặp lại của phân từ קרב để phản ánh sắc thái nhấn mạnh, gấp gáp trong lời than sợ hãi của dân chúng.
- source_word: מִשְׁכַּן
  choice: Đền Tạm
  rationale: Đây là cách gọi quen thuộc và rõ nghĩa trong tiếng Việt đối với nơi thánh di động của Israel trong hoang mạc.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: יָמוּת
  choice: sẽ chết
  rationale: Thể chưa hoàn thành ở đây diễn tả hậu quả chắc chắn đối với người đến gần; “sẽ chết” rõ ràng và tự nhiên.
- source_word: תַּמְנוּ לִגְוֹעַ
  choice: chúng tôi sẽ tiêu vong hết
  rationale: תמם mang ý kết thúc hoặc bị tận diệt, còn גוע chỉ việc chết hoặc tắt sự sống. “Tiêu vong hết” giữ sắc thái toàn thể bị diệt và tránh san bằng hoàn toàn với יָמוּת ở mệnh đề trước.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của câu hỏi kết thúc
  choice: Chẳng lẽ chúng tôi sẽ tiêu vong hết sao?
  alternative: Chẳng lẽ chúng tôi sẽ chết hết sao?
  rationale: Cách dịch chính giữ nỗi sợ bị tận diệt của cả cộng đồng và phần nào phản ánh việc tiếng Hê-bơ-rơ dùng động từ khác với “sẽ chết” ở mệnh đề trước, nhưng chú thích vẫn ghi nhận cách hiểu trực tiếp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Sự lặp lại “đến gần, đến gần” được giữ có chủ ý để phản ánh cấu trúc nhấn mạnh của nguyên văn; “Đền Tạm” được viết hoa như tên gọi quy ước của nơi thánh.
