  source_fidelity: 'Bản dịch truyền đạt đúng ý chính của câu: tính phổ quát của lời cảnh báo, sự lặp lại nhấn mạnh của động từ «đến gần», Đền Tạm của Yahweh, và câu hỏi tu từ về nguy cơ cả cộng đồng bị diệt vong. «Tiêu vong» phân biệt hợp lý với «sẽ chết» và không ép một sắc thái thần học nào vào hai động từ Hê-bơ-rơ khác nhau.'
