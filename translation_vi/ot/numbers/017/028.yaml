  terminology: «Đền Tạm» là thuật ngữ chuẩn, trang trọng và phù hợp ngữ cảnh. «Yahweh» nhất quán với quyết định dịch danh יהוה. «Tiêu vong» tự nhiên trong lời than sợ hãi và giữ được khác biệt từ vựng với «chết».
