  rationale: Sửa cụm chỉ cộng đồng để tiếng Việt tự nhiên mà vẫn giữ cả עֲדָה và thành ngữ בְּנֵי יִשְׂרָאֵל; lược yếu tố nhấn mạnh không cần thiết; và chuyển הֲמִתֶּם bằng “đã giết” theo giá trị ngữ cảnh của Hiphil, không thay đổi nội dung lời tố cáo.
