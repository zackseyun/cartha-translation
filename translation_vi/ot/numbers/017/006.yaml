language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: vi
  text: 'Nhưng hôm sau, toàn thể cộng đồng con dân Israel than phiền chống lại Môi-se và chống lại A-rôn rằng: “Các ông đã giết dân của Yahweh!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: kêu ca chống lại
  rationale: Động từ לון trong ngữ cảnh đồng hoang diễn tả sự bất mãn tập thể nhắm vào người lãnh đạo. “Kêu ca chống lại” là cách nói hiện đại, tự nhiên và giữ được sắc thái đối kháng.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toàn thể hội chúng con dân Israel
  rationale: “Hội chúng” phản ánh עֵדָה là cộng đồng được tập hợp; “con dân Israel” chuyển tải thành ngữ chỉ toàn thể dân giao ước, không giới hạn vào nam giới.
- source_word: מִמָּחֳרָת
  choice: hôm sau
  rationale: Cách diễn đạt tiếng Việt hiện đại và chính xác cho “vào ngày kế tiếp”.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: chống lại Môi-se và chống lại A-rôn
  rationale: Lặp lại “chống lại” để phản ánh việc giới từ עַל được lặp lại, nhấn mạnh rằng lời oán trách nhắm vào cả hai người.
- source_word: אַתֶּם הֲמִתֶּם
  choice: Chính các ông đã khiến … phải chết
  rationale: Dạng Hiphil của מות mang nghĩa gây ra cái chết hoặc giết. Cách dịch này giữ sắc thái nguyên nhân trực tiếp trong lời buộc tội, còn “chính” thể hiện sự nhấn mạnh tự nhiên của đại từ chủ ngữ độc lập אַתֶּם.
- source_word: עַם יְהוָה
  choice: dân của Yahweh
  rationale: Giữ nguyên quan hệ sở hữu trong cụm từ giao ước và chuyển YHWH bằng danh riêng Yahweh.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản nguồn dùng trực tiếp Tứ tự thần danh; “Yahweh” bảo tồn danh giao ước thay vì thay bằng một tước hiệu.
- issue: Phạm vi giới tính của בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai Israel
  rationale: Trong cụm thành ngữ này, בְּנֵי יִשְׂרָאֵל chỉ cộng đồng Israel nói chung. Dịch sát từng chữ là “các con trai Israel” dễ khiến độc giả Việt hiểu sai rằng chỉ có nam giới.
- issue: Mức độ trực tiếp trong lời buộc tội הֲמִתֶּם
  choice: đã khiến … phải chết
  alternative: đã giết
  rationale: Dạng sai khiến có thể được hiểu là “làm cho chết” hoặc, theo ngữ cảnh, “giết”. Bản chính giữ cấu trúc gây khiến để không xác định quá mức cách thức chịu trách nhiệm.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Giữ nhịp buộc tội mạnh của lời nói trực tiếp; tên riêng dùng dạng quen thuộc trong tiếng Việt: Môi-se, A-rôn, Israel và Yahweh.'
