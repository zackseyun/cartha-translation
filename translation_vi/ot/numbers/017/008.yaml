id: NUM.17.8
reference: Numbers 17:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּבֹ֤א מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶל פְּנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/008.yaml
  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: vi
  text: Bấy giờ, Môi-se và A-rôn đến trước Lều Hội Kiến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “đến trước mặt Lều Hội Kiến”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Bấy giờ, ... đến
  rationale: Dạng wayyiqtol của בוא tiếp nối diễn tiến câu chuyện và mang lực quá khứ. Tiếng Việt dùng “Bấy giờ” để chuyển mạch tự nhiên; “đến” phù hợp hơn “đi vào”, vì cụm theo sau chỉ vị trí trước Lều chứ không khẳng định họ vào trong.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng đã quen dùng trong tiếng Việt.
- source_word: וְאַהֲרֹן
  choice: và A-rôn
  rationale: Dịch liên từ וְ bằng “và” và dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: אֶל־פְּנֵי
  choice: đến trước
  rationale: Thành ngữ này có nghĩa đen là “đến mặt/phía trước mặt của” và trong ngữ cảnh diễn tả việc tiến đến phía trước một địa điểm. “Đến trước” vừa tự nhiên vừa không hàm ý họ đã vào trong.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, quen thuộc cho lều thánh đặc định, bảo toàn quan hệ cấu tạo và ý nghĩa nơi hội kiến; viết hoa để chỉ công trình thánh cụ thể.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu ngắn và dễ hiểu. Giữ cách gọi quen thuộc “Lều Hội Kiến” và đặt dấu chú thích ngay sau cụm từ liên quan.
