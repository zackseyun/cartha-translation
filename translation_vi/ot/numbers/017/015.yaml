base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: vi
  text: Bấy giờ, A-rôn trở lại chỗ Môi-se, tại lối vào Lều Hội Kiến, và tai họa đã bị chặn lại[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã dừng lại”, “đã bị kiềm lại” hoặc “đã được ngăn lại”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Bấy giờ, A-rôn trở lại
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên trình tự ấy, còn שׁוּב mang nghĩa không gian đơn giản là “trở lại”.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: אֶל chỉ hướng chuyển động đến chỗ Môi-se. Sau động từ “trở lại”, “với Môi-se” là cách diễn đạt tiếng Việt tự nhiên và không cần lặp thêm ý “về”.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: פֶּתַח là “lối vào/cửa vào”. Trong cấu trúc câu này, cụm từ xác định nơi Môi-se đang ở; “tại” tránh lặp giới từ chỉ hướng. “Lều Hội Kiến” là cách gọi rõ nghĩa và trang trọng cho אֹהֶל מוֹעֵד.
- source_word: הַמַּגֵּפָה
  choice: tai họa
  rationale: מַגֵּפָה trong ngữ cảnh này chỉ tai họa gây chết người như một đòn giáng xuống, không nhất thiết xác định cơ chế là bệnh truyền nhiễm; “tai họa” giữ được phạm vi nghĩa đó tốt hơn “dịch bệnh”.
- source_word: נֶעֱצָרָה
  choice: đã bị chặn lại
  rationale: Thể Niphal của עצר cho biết tai họa được làm cho dừng lại. “Đã bị chặn lại” giữ sắc thái bị động và kết quả hoàn tất, nhưng không nêu tác nhân mà tiếng Hê-bơ-rơ không nói rõ trong mệnh đề này.
theological_decisions:
- issue: Tác nhân hàm ẩn khiến tai họa dừng lại
  choice: Giữ cách nói bị động “đã bị chặn lại”, không thêm Đức Chúa Trời làm chủ ngữ.
  alternative: “Đức Chúa Trời đã chặn tai họa lại” hoặc “tai họa đã ngừng lại”.
  rationale: Ngữ cảnh cho thấy tác động của Đức Chúa Trời, nhưng câu Hê-bơ-rơ dùng dạng bị động và không trực tiếp nêu tác nhân. Bản dịch vì thế giữ sự dè dặt của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Tên riêng dùng dạng quen thuộc “A-rôn”, “Môi-se”; אֹהֶל מוֹעֵד được viết là “Lều Hội Kiến” như một danh xưng. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
