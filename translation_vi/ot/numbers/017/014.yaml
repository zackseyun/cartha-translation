  source_fidelity: Bản dịch phân biệt đúng 14.700 người chết trong tai dịch với nhóm người chết được loại trừ khỏi con số ấy. Tuy nhiên, “vì vụ Cô-rê” là cách kết hợp chưa tự nhiên và dễ làm mờ sắc thái rộng, quy chiếu đến sự việc liên quan đến Cô-rê, của עַל־דְּבַר קֹרַח. “Trong vụ Cô-rê” giữ được độ mở của nguyên ngữ mà không diễn giải quá mức.
