base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: vi
  text: Số người chết trong trận dịch là mười bốn nghìn bảy trăm, không kể những người đã chết trong vụ Cô-rê.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì Cô-rê” hoặc “liên quan đến sự việc Cô-rê.” Cụm từ này nói đến những người đã chết trước đó trong các biến cố liên quan đến cuộc nổi loạn của Cô-rê.'
    reason: Nêu các khả năng của עַל־דְּבַר קֹרַח và làm rõ rằng nhóm này không nằm trong con số 14.700.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Động từ היה trong mạch kể chuyện dẫn vào con số tổng kết; tiếng Việt tự nhiên không cần thêm một từ chỉ thời gian như “bấy giờ”.
- source_word: הַמֵּתִים
  choice: những người chết
  rationale: Phân từ được dùng như danh từ tập thể; cách diễn đạt này tự nhiên và phù hợp với con số theo sau.
- source_word: בַּמַּגֵּפָה
  choice: trong trận dịch
  rationale: מַגֵּפָה chỉ tai dịch gây chết người; “trong trận dịch” giữ được sắc thái của giới từ ב và diễn đạt hoàn cảnh xảy ra các trường hợp tử vong.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: mười bốn ngàn bảy trăm
  rationale: Chuyển trực tiếp số đếm Hê-bơ-rơ sang cách nói số tự nhiên trong tiếng Việt.
- source_word: מִלְּבַד
  choice: không kể
  rationale: Từ này loại nhóm tử vong trước đó khỏi tổng số 14.700; “không kể” rõ nghĩa và tự nhiên trong câu thống kê.
- source_word: עַל דְּבַר קֹרַח
  choice: vì vụ Cô-rê
  rationale: Cụm עַל דְּבַר có thể chỉ nguyên nhân hoặc sự việc có liên quan. “Vì vụ Cô-rê” giữ được mối liên hệ nhân quả mà không quy giản toàn bộ sự kiện chỉ vào cá nhân Cô-rê.
theological_decisions:
- issue: Phạm vi những người chết có liên quan đến Cô-rê
  choice: Phân biệt 14.700 người chết trong trận dịch với những người đã chết trước đó vì vụ Cô-rê, nhưng không xác định thêm các nhóm trong chính văn.
  alternative: “những người chết vì Cô-rê” hoặc “những người chết trong sự việc Cô-rê”
  rationale: Cụm עַל דְּבַר קֹרַח quy chiếu về cuộc phán xét đã xảy ra liên quan đến cuộc nổi loạn của Cô-rê. Bản dịch cần giữ sự phân biệt giữa hai nhóm mà không thêm chi tiết ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trận dịch” để diễn đạt một tai dịch cụ thể, “không kể” cho phép tính loại trừ, và “vụ Cô-rê” nhằm giữ độ mở của cụm Hê-bơ-rơ.
