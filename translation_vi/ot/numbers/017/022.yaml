    rationale: עֵדוּת trong cụm אֹהֶל הָעֵדֻת có nghĩa cơ bản là “chứng ngôn/lời chứng” (testimony). Tuy có liên hệ với các bảng giao ước, “Chứng Ước” không phải cách chuyển nghĩa trực tiếp và thu hẹp/đổi sắc thái của từ nguồn.
  - severity: low
    issue: Câu mở đầu bằng “Vậy,” và có dấu phẩy trước “trong...”.
    rationale: Liên từ waw ở đây chỉ tiếp diễn tự sự; không cần suy ra quan hệ kết luận bằng “Vậy”. Dấu phẩy tách cụm trạng ngữ nơi chốn là không cần thiết trong câu tiếng Việt này.
  revised_text: Môi-se đặt các cây gậy[a] trước mặt Yahweh trong Lều Chứng Ngôn[b].
