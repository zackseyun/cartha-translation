base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: vi
  text: Môi-se đặt các cây gậy[a] trước mặt Yahweh trong Lều Chứng Ngôn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các cây trượng”. Từ Hê-bơ-rơ ở đây chỉ những cây gậy hữu hình đại diện cho các bộ tộc.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “trong lều của chứng ngôn”. Nguyên văn là “trong lều chứng ngôn”; cũng thường được gọi là “Đền Tạm Chứng Ngôn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: đặt
  rationale: Động từ נוח ở thể Hifil trong mạch kể chuyện có nghĩa là đặt hoặc để một vật xuống; “đặt” tự nhiên và chính xác trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt hiện đại.
- source_word: הַמַּטֹּת
  choice: các cây gậy
  rationale: מַטֶּה có thể chỉ cây gậy hoặc bộ tộc; tại đây rõ ràng là các cây gậy hữu hình đại diện cho các bộ tộc.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Diễn đạt tự nhiên ý nghĩa ở trước hoặc trong sự hiện diện của một người.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tetragrammaton, thay vì thay thế bằng một tước hiệu.
- source_word: בְּאֹהֶל הָעֵדֻת
  choice: trong Lều Chứng Ước
  rationale: אֹהֶל là “lều”; עֵדוּת trong ngữ cảnh nơi thánh chỉ chứng ước gắn với các bảng giao ước. “Lều Chứng Ước” vừa giữ hình ảnh nguyên ngữ vừa tự nhiên hơn cách ghép “lều của chứng ngôn” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của עֵדוּת trong tên nơi thánh
  choice: Chứng Ước
  alternative: chứng ngôn; bảng chứng ước
  rationale: Từ này có thể được hiểu là “chứng ngôn/chứng tích” và đặc biệt liên hệ đến các bảng giao ước. “Chứng Ước” giữ mối liên hệ ấy nhưng không thêm từ “bảng” vốn không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vậy” nối câu với diễn tiến trước đó; viết hoa “Lều Chứng Ước” vì đây là tên gọi của nơi thánh. Mọi dấu chú thích đều xuất hiện trong chính văn.
