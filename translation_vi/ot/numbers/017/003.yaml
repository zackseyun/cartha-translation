base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: vi
  text: Về các lư hương của những kẻ đã phạm tội đến nỗi mất mạng[a], người ta hãy dát chúng thành những tấm kim loại mỏng[b] làm lớp bọc cho bàn thờ; vì họ đã dâng chúng trước mặt Yahweh, nên chúng đã trở nên thánh[c]. Chúng sẽ là một dấu hiệu cho dân Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những kẻ phạm tội bằng chính mạng sống mình”. Nghĩa là tội của họ khiến họ phải mất mạng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “những tấm kim loại được đập dẹt”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “đã được biệt ra làm thánh”. Chủ ngữ hợp lý nhất là các lư hương.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: những lư hương
  rationale: Chỉ các vật dụng dùng để đốt và dâng hương trong trình thuật về cuộc nổi loạn; “lư hương” là cách gọi tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: những kẻ đã phạm tội đến mất mạng
  rationale: Dùng mệnh đề chỉ hành động để giữ sắc thái sự kiện của phân từ; cụm בְּנַפְשֹׁתָם được hiểu theo văn cảnh là tội lỗi dẫn đến việc chính họ mất mạng.
- source_word: וְעָשׂוּ אֹתָם רִקֻּעֵי פַחִים
  choice: hãy dát chúng thành những tấm kim loại mỏng
  rationale: Mạch câu tiếp tục mệnh lệnh ở câu trước. “Dát” diễn đạt việc đập kim loại cho dẹt, còn “những tấm kim loại mỏng” truyền đạt cả chất liệu lẫn hình dạng.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: để bọc bàn thờ
  rationale: 'Diễn đạt tự nhiên mục đích của các tấm kim loại: làm lớp phủ cho bàn thờ.'
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: vì họ đã dâng chúng trước mặt Yahweh
  rationale: “Dâng” giữ sắc thái thờ phượng của động từ 'đem đến gần/dâng', đồng thời phù hợp với vật được dâng là các lư hương.
- source_word: וַיִּקְדָּשׁוּ
  choice: chúng đã trở nên thánh
  rationale: Chủ ngữ số nhiều gần nhất và phù hợp nhất là các lư hương. Cách dịch này giữ nguyên kết quả mà không xác định thêm tác nhân.
- source_word: וְיִהְיוּ לְאוֹת לִבְנֵי יִשְׂרָאֵל
  choice: Chúng sẽ là một dấu hiệu cho dân Israel
  rationale: Giữ hình ảnh “dấu hiệu” và chức năng cảnh báo, tưởng niệm; “dân Israel” là cách gọi tập thể tự nhiên, bao quát trong tiếng Việt hiện đại.
theological_decisions:
- issue: Chủ thể và ý nghĩa của וַיִּקְדָּשׁוּ
  choice: Các lư hương đã trở nên thánh vì được dâng trước mặt Yahweh.
  alternative: Những người dâng lư hương trở nên thánh, hoặc các lư hương chỉ được biệt riêng theo nghi lễ mà không mang tình trạng thánh lâu dài.
  rationale: 'Các lư hương là tiền ngữ số nhiều gần nhất, và đây cũng là cách hiểu giải thích hợp lý việc chúng phải được tái sử dụng cho bàn thờ. Bản dịch giữ sự căng thẳng của câu: vật gắn với tội phản nghịch vẫn trở nên thánh khi được đưa vào phạm vi thánh.'
- issue: Ý nghĩa của בְּנַפְשֹׁתָם
  choice: Tội của họ dẫn đến việc họ mất chính mạng sống mình.
  alternative: Họ phạm tội chống lại mạng sống mình, hoặc phạm tội liên quan đến linh hồn mình.
  rationale: Trong văn cảnh cái chết của những kẻ nổi loạn, cụm này nói đến hậu quả mất mạng, chứ không triển khai sự phân biệt thần học giữa “linh hồn” và “sự sống”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Yahweh” để thể hiện danh riêng יהוה; dùng “dân Israel” thay cho cách dịch sát chữ nhưng kém tự nhiên “các con trai Israel”. Đại từ “họ” chỉ những người phạm tội, còn “chúng” chỉ các lư hương, nhằm làm rõ các chủ thể vốn được thể hiện qua hậu tố và động từ trong tiếng Hê-bơ-rơ.
