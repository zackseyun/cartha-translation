revisions:
- from: Còn những lư hương của những kẻ đã phạm tội đến mất mạng[a], hãy dát chúng thành những tấm kim loại mỏng[b] để bọc bàn thờ, vì họ đã dâng chúng trước mặt Yahweh nên chúng đã trở nên thánh[c]. Chúng sẽ là một dấu hiệu cho dân Israel.
  to: Về các lư hương của những kẻ đã phạm tội đến nỗi mất mạng[a], người ta hãy dát chúng thành những tấm kim loại mỏng[b] làm lớp bọc cho bàn thờ; vì họ đã dâng chúng trước mặt Yahweh, nên chúng đã trở nên thánh[c]. Chúng sẽ là một dấu hiệu cho dân Israel.
