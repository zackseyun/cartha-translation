source:
  edition: WLC
  text: וַ/יֹּצֵ֨א מֹשֶׁ֤ה אֶת כָּל הַ/מַּטֹּת֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּרְא֥וּ וַ/יִּקְח֖וּ אִ֥ישׁ מַטֵּֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: vi
  text: Môi-se đem tất cả các cây gậy từ trước mặt Yahweh ra cho toàn thể con dân Israel[a]. Họ thấy[b], rồi mỗi người lấy cây gậy của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “toàn thể các con trai của Israel”; đây là cách gọi toàn dân Israel.'
    reason: Nêu hình thức sát chữ của danh xưng dân tộc và tránh hiểu lầm rằng câu chỉ nói đến nam giới.
  - marker: b
    text: 'Cũng có thể dịch: “họ nhìn.”'
    reason: Động từ ראה thường có nghĩa là “thấy” và, tùy ngữ cảnh, cũng có thể được diễn đạt là “nhìn”; nguyên văn không xác định rõ mức độ chủ ý của hành động.
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: đem ... ra
  rationale: Dạng Hiphil của יצא mang nghĩa khiến đi ra, tức “đem ra”; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sắc thái tác động.
- source_word: הַמַּטֹּת
  choice: các cây gậy
  rationale: Trong ngữ cảnh này מַטֶּה chỉ những vật cụ thể đã được đặt trước Yahweh, không phải “bộ tộc”; “cây gậy” rõ nghĩa và tự nhiên.
- source_word: מִלִּפְנֵי יְהוָה
  choice: từ trước mặt Yahweh
  rationale: Giữ khá sát thành ngữ không gian tiếng Hê-bơ-rơ “từ trước mặt YHWH”, đồng thời dùng danh riêng giao ước Yahweh.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: cho toàn thể con dân Israel
  rationale: בְּנֵי יִשְׂרָאֵל là danh xưng dân tộc. “Con dân Israel” vừa dễ hiểu trong tiếng Việt hiện đại, vừa phản ánh hình ảnh “con cái/con trai của Israel” mà không hàm ý chỉ nam giới.
- source_word: וַיִּרְאוּ
  choice: họ xem
  rationale: ראה cơ bản là “thấy/nhìn”, nhưng trong chuỗi hành động này có thể chỉ việc họ nhìn xem các cây gậy trước khi nhận lại. “Xem” giữ được ý tri giác có chủ ý mà không thêm khái niệm kiểm tra không có trong nguyên văn.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: mỗi người lấy cây gậy của mình
  rationale: אִישׁ được dùng theo nghĩa phân phối “mỗi người”; cách dịch này tự nhiên và giữ đúng cấu trúc mỗi cá nhân nhận cây gậy thuộc về mình.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Danh giao ước יהוה. Giữ “Yahweh” như một danh riêng, thay vì thay thế bằng tước hiệu, phù hợp với chứng cứ nguồn và không áp đặt truyền thống hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se”, “Yahweh” và “Israel” nhất quán; tách thành hai câu để tiếng Việt sáng rõ nhưng vẫn bảo toàn trình tự các hành động trong tiếng Hê-bơ-rơ.
