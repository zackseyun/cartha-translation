revisions:
- from: “Người Ta chọn thì cây gậy của người ấy sẽ đâm chồi. Ta sẽ dẹp khỏi Ta[b] những lời than phiền của con dân Israel[a] mà họ đang lằm bằm chống lại các con.”
  to: “Người mà Ta chọn thì cây gậy của người ấy sẽ đâm chồi. Ta sẽ làm cho những lời than phiền của con dân Israel[a] lắng xuống, không còn đổ lên Ta[b], là những lời họ đang than phiền chống lại các ngươi.”
  rationale: Bản sửa thay những cụm chưa tự nhiên bằng tiếng Việt hiện đại, diễn đạt đầy đủ lực tác động của động từ “làm lắng xuống,” và tránh thêm sắc thái thân tộc vào đại từ số nhiều. Các chú thích vẫn được neo đúng vị trí và bảo tồn sự mơ hồ diễn giải của מֵעָלַי.
