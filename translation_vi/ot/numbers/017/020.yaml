  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: vi
  text: “Người mà Ta chọn thì cây gậy của người ấy sẽ đâm chồi. Ta sẽ làm cho những lời than phiền của con dân Israel[a] lắng xuống, không còn đổ lên Ta[b], là những lời họ đang than phiền chống lại các ngươi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “các con trai Israel”; cũng có thể dịch là “dân Israel” hoặc “người Israel”.'
    reason: Nêu hình thức thân tộc của nguyên văn và các cách diễn đạt tự nhiên tương đương.
  - marker: b
    text: 'Nguyên văn: “khỏi trên Ta.” Cụm này có hình ảnh những lời than phiền không còn đổ lên Ta; cũng có thể được hiểu theo thành ngữ là những lời than phiền chống lại Ta.'
    reason: Giải thích cách diễn đạt của מֵעָלַי mà không áp đặt một cách hiểu duy nhất.
lexical_decisions:
- source_word: וְהָיָה
  choice: thì
  rationale: Diễn đạt tự nhiên trong tiếng Việt cấu trúc báo trước kết quả sẽ xảy ra, không cần giữ máy móc công thức “và sẽ là”.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: người Ta chọn
  rationale: Giữ rõ hành động tuyển chọn của Đức Chúa Trời; “người” tự nhiên trong tiếng Việt và ngữ cảnh đã xác định đây là người đại diện nam của chi tộc.
- source_word: מַטֵּהוּ
  choice: cây gậy của người ấy
  rationale: Đại từ sở hữu trong tiếng Hê-bơ-rơ được thể hiện rõ; “cây gậy” là cách gọi hiện đại, tự nhiên hơn “cây trượng” trong ngữ cảnh này.
- source_word: יִפְרָח
  choice: sẽ đâm chồi
  rationale: Động từ chỉ việc nảy chồi hoặc nở hoa; “đâm chồi” phù hợp với dấu hiệu đầu tiên của sự sống, còn câu kế tiếp kể chi tiết việc trổ hoa.
- source_word: וַהֲשִׁכֹּתִי
  choice: Ta sẽ dẹp
  rationale: Thể Hifil diễn tả việc khiến điều gì lắng xuống hoặc chấm dứt; “dẹp” vừa gọn vừa truyền đạt hành động chủ động làm cho những lời than phiền không còn tiếp diễn.
- source_word: מֵעָלַי
  choice: khỏi Ta
  rationale: Giữ hình ảnh không gian của nguyên văn, “từ trên Ta/khỏi Ta”, thay vì mặc nhiên giải nghĩa là “chống lại Ta”; chú thích nêu khả năng hiểu thành ngữ.
- source_word: תְּלֻנּוֹת
  choice: những lời than phiền
  rationale: Diễn đạt danh từ số nhiều bằng tiếng Việt hiện đại, rõ nghĩa và trang trọng vừa phải.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Giữ phần nào sắc thái thân tộc của nguyên văn mà vẫn chỉ toàn thể cộng đồng Israel một cách tự nhiên; nghĩa đen được ghi ở chú thích.
- source_word: מַלִּינִם
  choice: đang lằm bằm
  rationale: Thể phân từ cho thấy hành động đang tiếp diễn; “lằm bằm” giữ sắc thái bất mãn dai dẳng, mạnh hơn từ trung tính “phàn nàn”.
- source_word: עֲלֵיכֶם
  choice: chống lại các con
  rationale: Giữ nghĩa đối nghịch của giới từ và số nhiều của đại từ; trong ngữ cảnh, lời Đức Chúa Trời hướng đến Môi-se và bao gồm A-rôn.
theological_decisions:
- issue: Quan hệ giữa מֵעָלַי và lời than phiền
  choice: Ta sẽ dẹp khỏi Ta
  alternative: Ta sẽ chấm dứt những lời than phiền chống lại Ta
  rationale: Cách chọn giữ cấu trúc “khỏi/trên Ta” của tiếng Hê-bơ-rơ và không quyết đoán rằng cụm này chỉ hướng đối tượng của lời than phiền. Chú thích cho biết cách hiểu thành ngữ có thể là chấm dứt lời than phiền chống lại Đức Chúa Trời.
- issue: Cách gọi בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai Israel; dân Israel; người Israel
  rationale: Cụm từ chỉ cộng đồng giao ước nói chung, không chỉ nam giới. “Con dân Israel” duy trì sắc thái thuộc về dòng dõi Israel mà không tạo ấn tượng sai rằng chỉ đàn ông đang than phiền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” thể hiện lời phán của Đức Chúa Trời; “các con” truyền đạt đại từ số nhiều mà không mang sắc thái miệt thị. Các dấu chú thích đều xuất hiện ngay sau cụm từ liên quan trong chính văn.
