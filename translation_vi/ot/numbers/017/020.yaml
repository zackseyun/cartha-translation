    rationale: Động từ này nói đến việc khiến sự than phiền lắng xuống hay chấm dứt. Cách “làm cho ... lắng xuống, không còn đổ lên Ta” vừa tự nhiên vừa giữ được hình ảnh của מֵעָלַי.
  - severity: low
    issue: “các con” diễn giải thêm quan hệ cha-con.
    rationale: עֲלֵיכֶם chỉ là đại từ số nhiều “các ngươi/các ông”; trong ngữ cảnh chỉ Môi-se và A-rôn. “Các ngươi” giữ đúng mức độ xác định của nguyên văn.
