id: NUM.17.7
reference: Numbers 17:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: vi
  text: Khi hội chúng tụ họp chống lại Môi-se và A-rôn, họ quay về phía Lều Hội Kiến. Kìa, đám mây che phủ lều ấy[a], và vinh quang của Yahweh hiện ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “che phủ nó”; đại từ có khả năng nhất chỉ “Lều Hội Kiến”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהִקָּהֵל
  choice: Khi ... tụ họp
  rationale: Cấu trúc וַיְהִי với nguyên mẫu có בְּ mở đầu biến cố trong mạch kể và nêu hoàn cảnh thời gian. Tiếng Việt diễn đạt tự nhiên bằng “Khi ...”, không cần thêm một công thức kể chuyện nặng nề.
- source_word: הָעֵדָה
  choice: hội chúng
  rationale: Chỉ cộng đồng Israel xét như một tập thể; “hội chúng” vừa trang trọng vừa quen thuộc trong văn cảnh Ngũ Kinh.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: chống lại Môi-se và A-rôn
  rationale: Trong văn cảnh đối kháng, עַל diễn tả sự chống đối, không chỉ hướng di chuyển.
- source_word: וַיִּפְנוּ אֶל
  choice: họ quay về phía
  rationale: פנה ở đây diễn tả hành động xoay người hoặc hướng nhìn về một nơi.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Dịch trực tiếp danh xưng của nơi thánh trong hoang mạc, đồng thời giữ cách gọi trang trọng và quen thuộc.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý đến cảnh tượng bất ngờ và trang nghiêm.
- source_word: כִסָּהוּ הֶעָנָן
  choice: đám mây che phủ lều ấy
  rationale: כסה có nghĩa là “che phủ”; hậu tố ngôi ba số ít giống đực có khả năng nhất quy chiếu về אֹהֶל, “lều”, là tiền ngữ gần nhất.
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Dạng Niphal của ראה ở đây diễn tả sự biểu hiện hữu hình; “hiện ra” tự nhiên trong tiếng Việt và thích hợp với sự hiển hiện thần linh.
- source_word: כְּבוֹד יְהוָה
  choice: vinh quang của Yahweh
  rationale: Giữ nguyên sức nặng của כָּבוֹד như sự huy hoàng được biểu lộ và phiên âm danh riêng giao ước יְהוָה là “Yahweh” thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh; phiên âm “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sở chỉ của hậu tố trong כִסָּהוּ
  choice: lều ấy, tức Lều Hội Kiến
  alternative: hội chúng hoặc toàn cảnh
  rationale: Hậu tố giống đực số ít phù hợp và gần nhất với אֹהֶל, “lều”; tuy vậy, vì nguyên văn chỉ dùng đại từ, chú thích ghi lại hình thức này thay vì che khuất hoàn toàn khả năng mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Kìa” để giữ sắc thái chỉ xuất trang nghiêm của וְהִנֵּה; dùng “Lều Hội Kiến” như một danh xưng. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
