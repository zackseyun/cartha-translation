    rationale: Cụm này trong tiếng Việt thường gợi hành động được thực hiện trực tiếp bởi bàn tay hay chuyển giao vật thể, không rõ nghĩa thành ngữ “qua/trung gian Môi-se” của בְּיַד מֹשֶׁה. Dùng “qua Môi-se” truyền đạt chính xác chức năng trung gian; chú thích có thể bảo lưu cách nói sát chữ.
  - severity: low
