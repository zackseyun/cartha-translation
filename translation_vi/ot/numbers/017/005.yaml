id: NUM.17.5
reference: Numbers 17:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: vi
  text: làm vật nhắc nhở[a] cho con dân Israel, để không một người ngoài[b] nào, tức là người không thuộc dòng dõi A-rôn, đến gần để dâng hương trước mặt Yahweh, và để người ấy không trở nên như Cô-rê và phe nhóm của Cô-rê, đúng như Yahweh đã phán với người ấy[d] qua Môi-se.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vật lưu niệm” hoặc “vật để ghi nhớ.”
    reason: lexical_alternative
  - marker: b
    text: “Người ngoài” ở đây là người không được phép làm công việc tư tế này, không nhất thiết là người ngoại quốc về dân tộc.
    reason: cultural_note
  - marker: c
    text: Nguyên văn Hê-bơ-rơ là “qua tay Môi-se,” một thành ngữ có nghĩa là “qua Môi-se.”
    reason: lexical_alternative
  - marker: d
    text: “Người ấy” ở cuối câu có khả năng chỉ A-rôn.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: vật nhắc nhở
  rationale: Danh từ chỉ một vật có chức năng lưu niệm hoặc nhắc nhớ; cách dịch này phù hợp với vật thể trong ngữ cảnh và dễ hiểu trong tiếng Việt hiện đại.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con dân Israel
  rationale: Diễn đạt tự nhiên cộng đồng giao ước, không giới hạn vào nam giới như cách dịch sát chữ “các con trai Israel” có thể gợi ra.
- source_word: אִישׁ זָר
  choice: một người ngoài
  rationale: Trong ngữ cảnh chức vụ tư tế, từ này chỉ người không được phép đảm nhiệm nghi thức ấy, chứ không nhất thiết là người ngoại quốc.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: không thuộc dòng dõi A-rôn
  rationale: “Dòng dõi” truyền đạt rõ ý huyết thống của זֶרַע và tự nhiên hơn “hạt giống” trong tiếng Việt.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: dâng hương
  rationale: Cụm từ nghi lễ tự nhiên trong tiếng Việt, diễn tả việc làm cho hương cháy và bay khói như một lễ dâng.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: để người ấy không trở nên giống như Cô-rê cùng phe nhóm của ông ta
  rationale: Giữ động từ số ít và lời cảnh báo rằng người vi phạm có thể trở nên giống Cô-rê cùng nhóm của ông về hành động hoặc số phận, không giải quyết hẹp hơn điều nguyên văn nói.
- source_word: בְּיַד מֹשֶׁה
  choice: qua tay Môi-se
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về vai trò trung gian, đồng thời vẫn dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Chuyển âm danh giao ước được nêu trực tiếp trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- issue: Ý nghĩa của זָר trong bối cảnh tư tế
  choice: người ngoài
  alternative: người ngoại quốc
  rationale: Sự phân biệt ở đây liên quan đến thẩm quyền và dòng dõi tư tế A-rôn, không phải bản sắc dân tộc.
- issue: Đại từ לוֹ ở cuối câu
  choice: người ấy, có khả năng chỉ A-rôn
  alternative: liên quan đến người ấy hoặc chỉ Môi-se
  rationale: Đại từ số ít giống đực không nêu rõ tiền ngữ ngay trong câu; ngữ cảnh có khả năng hướng đến A-rôn, nhưng bản dịch và chú thích không khẳng định quá mức.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng tên riêng quen thuộc trong tiếng Việt như A-rôn, Cô-rê và Môi-se. Giữ “Yahweh” theo nguyên văn. Cấu trúc mở đầu “làm vật nhắc nhở” phản ánh tính nối tiếp của câu với ngữ cảnh ngay trước đó.
