id: NUM.17.11
reference: Numbers 17:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se nói với A-rôn: “Hãy lấy lư hương[a], bỏ than lửa từ trên bàn thờ vào đó, bỏ hương vào đó, rồi hãy mau chóng đi đến hội chúng và làm lễ chuộc tội cho họ, vì cơn thịnh nộ đã phát ra từ sự hiện diện của Yahweh[b]; nạn dịch đã bắt đầu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chảo đựng than.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “từ trước mặt Yahweh,” nghĩa là từ sự hiện diện của Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: lư hương
  rationale: Chỉ vật dụng dùng để đựng than lửa và hương trong nghi lễ tư tế. “Lư hương” tự nhiên và dễ hiểu trong tiếng Việt; chú thích giữ lại khả năng hiểu là chảo đựng than.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: bỏ than lửa từ trên bàn thờ vào đó
  rationale: Diễn đạt tự nhiên việc lấy lửa/than đang cháy từ bàn thờ và cho vào vật đựng, đồng thời giữ nguồn của lửa là bàn thờ.
- source_word: קְטֹרֶת
  choice: hương
  rationale: Từ thông dụng chỉ hương dùng trong nghi lễ; ngắn gọn, rõ nghĩa và phù hợp với ngữ cảnh thờ phượng.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: rồi mau chóng đem đến
  rationale: Động từ dạng khiến đi có thể mang nghĩa đem vật đang cầm đi; cách dịch này giữ cả chuyển động lẫn tính khẩn cấp.
- source_word: הָעֵדָה
  choice: hội chúng
  rationale: Chỉ cộng đồng Israel được tập hợp với tư cách một tập thể giao ước; “hội chúng” giữ sắc thái tập thể trang trọng.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: làm lễ chuộc tội cho họ
  rationale: Giữ ý nghĩa nghi lễ của động từ כפר trong văn mạch tư tế mà không áp đặt một lý thuyết thần học hẹp hơn.
- source_word: הַקֶּצֶף
  choice: cơn thịnh nộ
  rationale: Diễn tả sự giận dữ bùng phát gắn với phán xét của Đức Chúa Trời; trang trọng và mạnh hơn “cơn giận”.
- source_word: מִלִּפְנֵי יְהוָה
  choice: từ trước mặt Yahweh
  rationale: Bảo tồn hình ảnh Hê-bơ-rơ “từ trước mặt/sự hiện diện của Yahweh”; chú thích giải thích thành ngữ để tránh tối nghĩa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển trực tiếp danh giao ước YHWH thay vì thay bằng một tước hiệu hoặc dạng Jehovah.
- source_word: הֵחֵל הַנָּגֶף
  choice: nạn dịch đã bắt đầu rồi
  rationale: Trong ngữ cảnh này נֶגֶף là tai họa chết người đang lan giữa dân chúng; “nạn dịch” diễn đạt tự nhiên tính chất của biến cố, còn “đã bắt đầu rồi” truyền đạt tính khẩn cấp của thể hoàn thành.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. “Yahweh” bảo tồn danh giao ước và không thay nó bằng tước hiệu.
- issue: Ý nghĩa nghi lễ của כפר
  choice: làm lễ chuộc tội cho họ
  alternative: làm lễ xá tội cho họ
  rationale: Cách dịch giữ chức năng tư tế và chiều kích chuộc tội của hành động, nhưng không giải quyết thay cho nguyên văn cơ chế thần học chính xác của nghi lễ.
- issue: Nguồn phát ra của cơn thịnh nộ
  choice: từ trước mặt Yahweh
  alternative: từ Yahweh; từ sự hiện diện của Yahweh
  rationale: Giữ hình ảnh và sức căng của thành ngữ nguyên văn, đồng thời giải thích trong chú thích rằng câu này nói đến sự hiện diện của Yahweh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng các thuật ngữ nghi lễ quen thuộc như “lư hương,” “hội chúng” và “làm lễ chuộc tội,” đồng thời tránh lối văn quá cổ. Dấu chú thích [a] được đặt ngay sau từ mà nó giải thích, thay vì sau tên A-rôn.
