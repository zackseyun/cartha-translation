  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּבֹ֤א מֹשֶׁה֙ אֶל אֹ֣הֶל הָ/עֵד֔וּת וְ/הִנֵּ֛ה פָּרַ֥ח מַטֵּֽה אַהֲרֹ֖ן לְ/בֵ֣ית לֵוִ֑י וַ/יֹּ֤צֵֽא פֶ֨רַח֙ וַ/יָּ֣צֵֽץ צִ֔יץ וַ/יִּגְמֹ֖ל שְׁקֵדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: vi
  text: Hôm sau, Môi-se vào Lều Chứng Ước[a]. Kìa, cây gậy của A-rôn, đại diện cho nhà Lê-vi[b], đã nảy chồi, trổ nụ, ra hoa và kết hạnh nhân chín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lều của lời chứng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “cho nhà Lê-vi”; cây gậy này đại diện cho bộ tộc Lê-vi.'
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Hôm sau
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, giữ đúng trình tự thời gian là ngày kế tiếp.
- source_word: אֹהֶל הָעֵדוּת
  choice: Lều Chứng Ước
  rationale: Giữ sắc thái pháp lý và giao ước của עֵדוּת trong tên gọi nơi thánh, đồng thời dùng một cụm từ trang trọng, dễ hiểu.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Tái hiện dấu hiệu trỏ chỉ sống động của lời kể Hê-bơ-rơ, thu hút sự chú ý vào cảnh tượng kỳ diệu.
- source_word: מַטֵּה
  choice: cây gậy
  rationale: Chỉ cây gậy của người đứng đầu, là cách gọi rõ ràng và tự nhiên trong ngữ cảnh này.
- source_word: לְבֵית לֵוִי
  choice: đại diện cho nhà Lê-vi
  rationale: Làm rõ chức năng đại diện của cây gậy, trong khi vẫn giữ thành ngữ Hê-bơ-rơ “nhà Lê-vi” và ghi chú nghĩa sát chữ.
- source_word: פָּרַח
  choice: đã nảy chồi
  rationale: Thể hiện giai đoạn sinh trưởng ban đầu và giữ được sự phân biệt với nụ, hoa và quả ở phần sau.
- source_word: וַיֹּצֵא פֶרַח
  choice: trổ nụ
  rationale: Dùng cách nói thực vật tự nhiên trong tiếng Việt, duy trì diễn tiến từ nảy chồi đến nở hoa.
- source_word: וַיָּצֵץ צִיץ
  choice: ra hoa
  rationale: Diễn đạt rõ giai đoạn hoa nở tiếp sau việc trổ nụ mà không gượng ép lặp lại danh từ đồng nguyên.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: kết hạnh nhân chín
  rationale: Giữ cả ý sinh quả và ý đạt đến độ chín của động từ גמל, là cao điểm của chuỗi tăng trưởng kỳ diệu.
theological_decisions:
- issue: Ý nghĩa của לְבֵית לֵוִי
  choice: “đại diện cho nhà Lê-vi” trong chính văn
  alternative: “cho nhà Lê-vi” hoặc “thuộc nhà Lê-vi”
  rationale: Giới từ לְ có thể được dịch sát là “cho”, nhưng trong bối cảnh các cây gậy đại diện cho các bộ tộc, cách dịch đã chọn làm rõ quan hệ mà không thêm một kết luận giáo phái.
- issue: Danh xưng אֹהֶל הָעֵדוּת
  choice: Lều Chứng Ước
  alternative: Lều Chứng Ngôn
  rationale: “Chứng Ước” bảo lưu chiều kích chứng nhận và giao ước của thuật ngữ; phương án sát hình thái hơn được nêu trong chú thích để không che lấp độ rộng nghĩa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ đọc. Chuỗi động từ “nảy chồi, trổ nụ, ra hoa và kết hạnh nhân chín” giữ nhịp tăng tiến của nguyên văn và phân biệt các giai đoạn sinh trưởng.
