  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: vi
  text: Hãy viết tên A-rôn trên cây gậy của Lê-vi, vì mỗi người đứng đầu gia tộc bên cha sẽ có một cây gậy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vì một cây gậy dành cho người đứng đầu gia tộc bên cha của họ.” Cấu trúc tiếng Hê-bơ-rơ có thể được hiểu theo nghĩa phân phối: mỗi người đứng đầu một gia tộc bên cha được đại diện bằng một cây gậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: Hãy
  rationale: Liên từ nối tiếp lời chỉ dẫn trước; dấu chỉ tân ngữ không dịch riêng. Trong tiếng Việt, mệnh lệnh trực tiếp mở đầu tự nhiên bằng “Hãy”.
- source_word: שֵׁם אַהֲרֹן
  choice: tên A-rôn
  rationale: Dịch trực tiếp danh từ “tên” và phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt phổ biến.
- source_word: תִּכְתֹּב
  choice: viết
  rationale: Dạng vị hoàn ngôi hai số ít mang lực mệnh lệnh trong ngữ cảnh chỉ thị; kết hợp với “Hãy” để diễn đạt tự nhiên.
- source_word: עַל מַטֵּה לֵוִי
  choice: trên cây gậy của Lê-vi
  rationale: מַטֶּה chỉ cây gậy hữu hình dùng làm vật đại diện; “của Lê-vi” giữ quan hệ thuộc về/đại diện cho Lê-vi.
- source_word: כִּי
  choice: vì
  rationale: Dẫn vào lý do của mệnh lệnh.
- source_word: מַטֶּה אֶחָד
  choice: một cây gậy
  rationale: Giữ rõ số lượng một và vật thể cụ thể.
- source_word: לְ/רֹאשׁ
  choice: mỗi người đứng đầu
  rationale: רֹאשׁ theo nghĩa chức năng là người lãnh đạo/đại diện. Cách dịch phân phối “mỗi” phù hợp với quy tắc mỗi đơn vị gia tộc có một cây gậy, nhưng tính hàm hồ cú pháp được ghi nhận ở chú thích.
- source_word: בֵּית אֲבוֹתָם
  choice: một gia tộc
  rationale: Thành ngữ chỉ đơn vị thân tộc theo dòng cha. “Gia tộc” tự nhiên và trang trọng trong tiếng Việt hiện đại; đại từ sở hữu không cần biểu thị riêng vì ngữ cảnh đã xác định các chi tộc.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng tự nhiên. Dùng “cây gậy” thay cho từ cổ “cây trượng”; “gia tộc” chuyển tải đơn vị בית אבות theo lối nói hiện đại. Dấu chú thích [a] được đặt ngay sau mệnh đề có cách hiểu khác.
