id: NUM.17.26
reference: Numbers 17:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: vi
  text: Môi-se đã làm đúng như Yahweh truyền cho ông; ông đã làm như vậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה có nghĩa rộng là “làm/thực hiện”; trong ngữ cảnh vâng theo mệnh lệnh, “làm” tự nhiên và cho phép giữ sự lặp lại ở cuối câu.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự tương ứng với điều được truyền và giữ sắc thái nhấn mạnh rằng Môi-se làm theo đúng mệnh lệnh.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Truyền” thể hiện mệnh lệnh có thẩm quyền, đồng thời phù hợp văn phong Kinh Thánh tiếng Việt hiện đại, trang trọng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là dạng danh xưng quen thuộc và trang trọng trong tiếng Việt.
- source_word: אֹתוֹ
  choice: cho ông
  rationale: Trong cấu trúc tiếng Việt với động từ “truyền”, đối tượng nam số ít chỉ Môi-se được diễn đạt tự nhiên bằng “cho ông”.
- source_word: כֵּן
  choice: như vậy
  rationale: Hồi chỉ toàn bộ nội dung vừa nêu và củng cố lời xác nhận rằng Môi-se đã thực hiện đúng mệnh lệnh.
- source_word: עָשָׂה
  choice: ông đã làm
  rationale: Giữ lại sự lặp có chủ ý của עשה, qua đó nhấn mạnh sự vâng lời trọn vẹn của Môi-se.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản dịch giữ đây là danh riêng chứ không thay bằng “Chúa”. Dạng “Đức Giê-hô-va” dễ nhận biết, trang trọng và đã bén rễ trong tiếng Việt; cách phiên âm “Yahweh/Gia-vê” phản ánh gần hơn cách phục nguyên học thuật nhưng chưa thống nhất trong cách dùng phổ thông.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc lặp “làm… đã làm” được giữ có chủ ý để phản ánh sự nhấn mạnh trong tiếng Hê-bơ-rơ; không thêm chú giải hoặc hệ phái hóa câu văn.
