  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/016.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH, danh riêng của Đức Chúa Trời; tại đây được phiên âm là “Yahweh”.'
    reason: Làm rõ rằng “Yahweh” là cách phiên âm danh יהוה trong nguyên bản Hê-bơ-rơ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa trình thuật tiến tới. “Rồi” tạo dòng kể tự nhiên trong tiếng Việt, còn “phán” phù hợp với lời Đức Chúa Trời nói mà vẫn giữ ý nghĩa của động từ דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc nói năng, אֶל chỉ người tiếp nhận lời nói; “phán với Môi-se” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tiếng Việt thông dụng của tên riêng משה.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Động từ nguyên mẫu này thường mở đầu lời nói trực tiếp. “Rằng:” thể hiện rõ chức năng dẫn nhập ấy và tự nhiên hơn việc dịch máy móc là “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo tồn tính chất danh riêng, không âm thầm thay nó bằng một tước hiệu; chú thích nêu dạng chữ Hê-bơ-rơ đứng sau cách phiên âm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn. “Phán” giữ sắc thái trang nghiêm quen thuộc khi chủ thể là Đức Chúa Trời; “Rồi” tạo mạch kể tự nhiên. Dấu hai chấm báo hiệu lời trực tiếp tiếp theo.
