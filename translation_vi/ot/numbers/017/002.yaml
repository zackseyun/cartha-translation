  text: אֱמֹ֨ר אֶל אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן וְ/יָרֵ֤ם אֶת הַ/מַּחְתֹּת֙ מִ/בֵּ֣ין הַ/שְּׂרֵפָ֔ה וְ/אֶת הָ/אֵ֖שׁ זְרֵה הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: vi
  text: “Hãy bảo Ê-lê-a-sa, con trai của thầy tế lễ A-rôn, nhấc các lư hương[a] ra khỏi giữa đám cháy và rải lửa ra xa, vì chúng đã trở nên thánh.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các khay đựng than lửa.” Từ Hê-bơ-rơ chỉ những dụng cụ dùng để đựng than lửa hoặc dâng hương.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch là “vì chúng là vật thánh.” Dạng hoàn thành trong tiếng Hê-bơ-rơ có thể nhấn mạnh trạng thái kết quả: “đã trở nên thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Hãy bảo
  rationale: Thể mệnh lệnh của אמר mở đầu lời chỉ thị; “hãy bảo” diễn đạt tự nhiên việc Môi-se phải truyền lệnh cho Ê-lê-a-sa.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Ê-lê-a-sa, con trai của thầy tế lễ A-rôn
  rationale: Giữ quan hệ phụ chú của nguyên văn; cụm xác định “thầy tế lễ” gắn tự nhiên nhất với A-rôn trong chuỗi danh từ Hê-bơ-rơ.
- source_word: וְיָרֵם
  choice: lấy ... ra
  rationale: Động từ mang sắc thái mệnh lệnh tiếp nối, theo nghĩa nâng hoặc nhấc lên; trong ngữ cảnh lấy vật khỏi đám cháy, “lấy ... ra” là tiếng Việt tự nhiên mà vẫn giữ hành động chính.
- source_word: הַמַּחְתֹּת
  choice: các lư hương
  rationale: מחתה chỉ dụng cụ đựng than lửa hoặc dùng để dâng hương. “Lư hương” là thuật ngữ nghi lễ quen thuộc; chú thích giữ phương án cụ thể hơn là “khay đựng than lửa”.
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: ra khỏi đám cháy
  rationale: שׂרפה có thể chỉ sự thiêu cháy, ngọn cháy lớn hoặc khu vực đang cháy; “đám cháy” giữ hình ảnh cụ thể mà không diễn giải thành tro tàn.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: và rải lửa ra xa
  rationale: זרה nghĩa là rải hoặc tung ra, còn הָלְאָה chỉ hướng xa khỏi nơi ấy. Giữ “lửa” theo danh từ trực tiếp của nguyên văn, thay vì tự ý thu hẹp thành “than lửa”.
- source_word: כִּי קָדֵשׁוּ
  choice: vì chúng đã trở nên thánh
  rationale: Dạng hoàn thành số nhiều mô tả một trạng thái phát sinh từ hành động trước đó. Đại từ “chúng” quy chiếu về các lư hương; chú thích bảo lưu khả năng dịch theo trạng thái hiện tại là “chúng là vật thánh”.
theological_decisions:
- issue: Đối tượng của động từ số nhiều קָדֵשׁוּ
  choice: “Chúng” chỉ các lư hương đã trở nên thánh
  alternative: Hiểu rộng là các vật liên quan đến lễ dâng, gồm cả lửa
  rationale: “Các lư hương” là tiền ngữ số nhiều phù hợp gần nhất, trong khi “lửa” ở dạng số ít. Mạch truyện cũng phân biệt các lư hương cần được giữ lại với lửa phải bị rải ra xa.
- issue: Sắc thái thời-thể của קָדֵשׁוּ
  choice: đã trở nên thánh
  alternative: là vật thánh
  rationale: Cách dịch chính làm rõ trạng thái kết quả do các lư hương đã được đem dâng trước Đức Chúa Trời, nhưng không khẳng định một cơ chế thần học vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy tế lễ” theo lối gọi Kinh Thánh quen thuộc; phiên âm tên riêng theo cách đọc phổ biến trong tiếng Việt. Cấu trúc mệnh lệnh được gọn hóa để lời truyền đạt tự nhiên, đồng thời giữ nguyên sự phân biệt giữa các lư hương và lửa.
