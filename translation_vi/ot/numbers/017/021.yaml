- from: Vậy, Môi-se nói với con cái Y-sơ-ra-ên[a], và tất cả các thủ lĩnh của họ trao cho ông mỗi người một cây gậy, mỗi thủ lĩnh một cây gậy theo gia tộc của tổ phụ mình, tổng cộng mười hai cây gậy; còn gậy của A-rôn ở giữa các gậy ấy.
