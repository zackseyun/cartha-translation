source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וַ/יִּתְּנ֣וּ אֵלָ֣י/ו כָּֽל נְשִֽׂיאֵי/הֶ֡ם מַטֶּה֩ לְ/נָשִׂ֨יא אֶחָ֜ד מַטֶּ֨ה לְ/נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת וּ/מַטֵּ֥ה אַהֲרֹ֖ן בְּ/ת֥וֹךְ מַטּוֹתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: vi
  text: Môi-se nói với con cái Y-sơ-ra-ên[a], và tất cả các thủ lĩnh của họ trao cho ông, mỗi thủ lĩnh một cây gậy theo nhà tổ phụ của họ, cả thảy mười hai cây gậy; và gậy của A-rôn ở giữa các gậy ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Y-sơ-ra-ên”. Tiếng Hê-bơ-rơ theo nghĩa sát chữ là “con cái Y-sơ-ra-ên”, một cách gọi quen thuộc dành cho toàn dân Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nói với
  rationale: Động từ דבר ở đây giới thiệu việc Môi-se ngỏ lời với dân; “nói với” tự nhiên và giữ đúng quan hệ hướng đến đối tượng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình thức chỉ cộng đồng mang tính giao ước của tiếng Hê-bơ-rơ, đồng thời dùng “con cái” để bao quát toàn dân trong tiếng Việt tự nhiên.
- source_word: נְשִׂיאֵיהֶם
  choice: các thủ lĩnh của họ
  rationale: Trong bối cảnh các chi phái, נָשִׂיא chỉ người đứng đầu được công nhận; “thủ lĩnh” rõ nghĩa và không gợi tước vị hoàng gia như “hoàng tử”.
- source_word: מַטֶּה
  choice: cây gậy
  rationale: Ở đây từ này chỉ vật thể được giao nộp làm dấu hiệu đại diện; “cây gậy” là cách gọi thông dụng, cụ thể và nhất quán.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד מַטֶּה לְנָשִׂיא אֶחָד
  choice: mỗi người một cây gậy, mỗi thủ lĩnh một cây gậy
  rationale: 'Giữ sức nhấn mạnh phân phối của cấu trúc lặp: từng thủ lĩnh trao đúng một cây gậy.'
- source_word: לְבֵית אֲבֹתָם
  choice: theo gia tộc của tổ phụ mình
  rationale: Cụm từ nói đến đơn vị huyết tộc theo dòng cha; “gia tộc của tổ phụ” truyền đạt cấu trúc thân tộc mà vẫn dễ hiểu với độc giả hiện đại.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: tổng cộng mười hai cây gậy
  rationale: “Tổng cộng” làm rõ chức năng tổng kết của con số sau phần mô tả phân phối mà không thêm nội dung mới.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: còn gậy của A-rôn ở giữa các gậy ấy
  rationale: Mệnh đề Hê-bơ-rơ không có động từ; tiếng Việt có thể giữ cấu trúc này tự nhiên. “Ở giữa” bảo tồn sắc thái trực tiếp của בְּתוֹךְ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ nhịp lặp phân phối của nguyên văn nhưng điều chỉnh cú pháp cho tự nhiên trong tiếng Việt; dùng cách phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
