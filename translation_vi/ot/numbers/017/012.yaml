  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: vi
  text: A-rôn cầm lấy vật ấy[a], đúng như Môi-se đã nói, rồi chạy vào giữa hội chúng. Kìa, tai họa đã bắt đầu giữa dân chúng; ông đặt hương vào đó và làm lễ chuộc tội cho dân chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không nêu tân ngữ; vật A-rôn cầm lấy được hiểu theo lời Môi-se trong câu trước.
    reason: implicit_object
lexical_decisions:
- source_word: וַיִּקַּח
  choice: cầm lấy vật ấy
  rationale: Động từ có nghĩa đơn giản là “lấy/cầm lấy”; tân ngữ được hiểu từ câu trước nhưng không được nêu rõ trong câu này, nên “vật ấy” giữ được sự hàm ẩn thay vì xác định đó là lư hương.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: đúng như Môi-se đã nói
  rationale: Giữ nghĩa căn bản của דבר là “nói”, không diễn giải mạnh hơn thành “truyền lệnh”, dù lời nói trong ngữ cảnh mang tính chỉ thị.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: chạy vào giữa hội chúng
  rationale: רוץ là “chạy”, תּוֹךְ là “giữa”, còn קָהָל chỉ cộng đồng đang tụ họp; “hội chúng” trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Tái hiện chức năng thu hút sự chú ý và tính sống động của הִנֵּה một cách tự nhiên, trang trọng.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: tai họa đã bắt đầu giữa dân chúng
  rationale: נֶגֶף ở đây là tai họa gây chết chóc từ Đức Chúa Trời; “tai họa” giữ sắc thái phán xét mà không thu hẹp thành một bệnh dịch theo nghĩa y học. “Đã bắt đầu” thể hiện hành động đã khởi sự trước lúc A-rôn đến.
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: ông bỏ hương vào
  rationale: נתן có nghĩa rộng là “đặt/để/bỏ”; theo ngữ cảnh câu trước, hương được bỏ vào lư hương có than lửa. Cách dịch này diễn tả hành động cụ thể mà không diễn giải trực tiếp thành “dâng hương”.
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: làm lễ chuộc tội cho dân chúng
  rationale: Trong văn cảnh nghi lễ tư tế, כפר diễn tả hành động thực hiện sự chuộc tội. “Làm lễ chuộc tội” vừa giữ trọng lượng thần học vừa cho thấy đây là hành động nghi lễ.
theological_decisions:
- issue: Cách dịch động từ nghi lễ כפר
  choice: làm lễ chuộc tội cho dân chúng
  alternative: thực hiện sự chuộc tội cho dân chúng
  rationale: Bản dịch giữ nguyên ý nghĩa nghi lễ và thần học của hành động tư tế, nhưng không xác định thêm cơ chế chuộc tội ngoài điều câu văn nói.
- issue: Cách dịch קָהָל
  choice: hội chúng
  alternative: cộng đồng tụ họp
  rationale: “Hội chúng” truyền đạt ý niệm dân Y-sơ-ra-ên đang nhóm họp, không đồng nhất họ một cách không cần thiết với một cơ cấu giáo hội về sau.
- issue: Bản chất của הַנֶּגֶף
  choice: tai họa
  alternative: dịch bệnh
  rationale: “Tai họa” phù hợp với sự phán xét gây chết chóc trong ngữ cảnh và tránh khẳng định quá mức rằng đây nhất thiết là một bệnh truyền nhiễm theo cách hiểu hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Kìa” để giữ nét sống động của lời kể; dùng “hội chúng” và “làm lễ chuộc tội” để bảo toàn sắc thái cộng đồng và nghi lễ của nguyên văn.
