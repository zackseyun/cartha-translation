  source_fidelity: 'Bản dịch nhìn chung bám sát tiếng Hê-bơ-rơ: “cầm lấy vật ấy” phản ánh tân ngữ được hàm ẩn; “đúng như Môi-se đã nói,” “chạy vào giữa hội chúng,” “Kìa,” và “làm lễ chuộc tội cho dân chúng” đều chuyển tải phù hợp các thành tố chính. “Tai họa” là cách dịch có thể chấp nhận được cho נֶגֶף trong ngữ cảnh này, không ép nghĩa thành một chẩn đoán y học hiện đại.'
