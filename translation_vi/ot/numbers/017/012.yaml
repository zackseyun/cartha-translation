  to: A-rôn cầm lấy vật ấy[a], đúng như Môi-se đã nói, rồi chạy vào giữa hội chúng. Kìa, tai họa đã bắt đầu giữa dân chúng; ông đặt hương vào đó và làm lễ chuộc tội cho dân chúng.
