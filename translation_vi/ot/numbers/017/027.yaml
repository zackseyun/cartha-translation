  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: vi
  text: 'Dân Y-sơ-ra-ên[a] nói với Môi-se: “Kìa[b], chúng tôi chết mất! Chúng tôi tiêu vong rồi! Tất cả chúng tôi đều tiêu vong rồi!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; nghĩa là dân Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: b
    text: 'Từ Hê-bơ-rơ là một tiếng gọi chú ý, tại đây biểu lộ sự hoảng sợ; cũng có thể dịch: “Này” hoặc “Hãy xem”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn dùng hai động từ khác nhau liên tiếp: “chết” (גוע) và “tiêu vong” (אבד), rồi lặp lại “tiêu vong”. Các dạng động từ có thể diễn tả tai họa như đã xảy đến hoặc như chắc chắn sắp xảy đến.'
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Dân Y-sơ-ra-ên
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, diễn đạt tập thể dân giao ước; chú thích giữ lại nghĩa đen của thành ngữ Hê-bơ-rơ.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: 'nói với Môi-se:'
  rationale: Dấu hai chấm và lời trích dẫn trực tiếp đã chuyển tải chức năng của לֵאמֹר; không cần thêm từ “rằng” hoặc “mà nói” vốn nặng nề trong tiếng Việt.
- source_word: הֵן
  choice: Kìa
  rationale: Thán từ gọi sự chú ý, ở đây mang sắc thái hốt hoảng; “Kìa” vừa ngắn gọn vừa giữ được lực cảm thán.
- source_word: גָּוַעְנוּ
  choice: chúng tôi chết mất
  rationale: גוע chỉ sự tắt thở hay chết. Cấu trúc “chết mất” diễn tả tự nhiên tiếng kêu hoảng sợ về cái chết đang đe dọa.
- source_word: אָבַדְנוּ
  choice: chúng tôi tiêu vong rồi
  rationale: אבד chỉ sự hủy diệt, tiêu vong; lựa chọn này phân biệt với גוע và giữ sắc thái tai họa đã cận kề hay bị coi như chắc chắn.
- source_word: כֻּלָּנוּ אָבָדְנוּ
  choice: Tất cả chúng tôi đều tiêu vong rồi
  rationale: Giữ sự nhấn mạnh vào toàn thể cộng đồng và lặp lại cùng động từ như nguyên văn, qua đó tái hiện nỗi hoảng loạn.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng tự nhiên. “Chết mất” chuyển tải tiếng kêu hốt hoảng, còn “tiêu vong rồi” giữ động từ khác biệt và phép lặp của nguyên văn. Không thêm từ “rằng” cho לֵאמֹר vì cấu trúc dẫn lời trực tiếp trong tiếng Việt đã đủ rõ.
