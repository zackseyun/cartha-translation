  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/הוֹשֵׁ֥עַ בִּן נ֖וּן יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: vi
  text: Đây là tên của những người mà Môi-se sai đi do thám xứ[a]. Môi-se gọi Hô-sê, con trai Nun, là Giô-suê[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đi khảo sát xứ.” Động từ Hê-bơ-rơ có thể chỉ việc thăm dò, khảo sát hoặc trinh sát.
    reason: lexical_alternative
  - marker: b
    text: Hô-sê là tên trước đó của Giô-suê; tại đây Môi-se gọi ông bằng tên Giô-suê.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Đó là tên
  rationale: Cụm chỉ thị dùng để quy chiếu đến danh sách vừa nêu; tiếng Việt tự nhiên dùng “Đó là tên” trong lời tổng kết.
- source_word: הָאֲנָשִׁים
  choice: những người
  rationale: Trong ngữ cảnh, đây là các đại diện nam đã được liệt kê; “những người” tự nhiên trong tiếng Việt và không làm sai đối tượng cụ thể của câu.
- source_word: שָׁלַח
  choice: sai đi
  rationale: Diễn đạt tự nhiên hành động Môi-se cử họ thực hiện nhiệm vụ.
- source_word: לָתוּר
  choice: do thám
  rationale: Động từ תור tại đây chỉ việc khảo sát, trinh sát xứ; “do thám” giữ được sắc thái nhiệm vụ thu thập thông tin mà không nhất thiết hàm ý hoạt động gián điệp bí mật.
- source_word: הָאָרֶץ
  choice: xứ
  rationale: “Xứ” là cách dịch trang trọng, quen thuộc và gọn cho הארץ trong ngữ cảnh đất Ca-na-an.
- source_word: וַיִּקְרָא ... לְ ... יְהוֹשֻׁעַ
  choice: gọi ... là Giô-suê
  rationale: Giữ sát cấu trúc “gọi [người] là [tên]” của tiếng Hê-bơ-rơ, đồng thời cho thấy hành vi đặt hoặc đổi tên mà không diễn giải quá mức.
- source_word: הוֹשֵׁעַ
  choice: Hô-sê
  rationale: Phiên âm tên riêng Hê-bơ-rơ Hoshea theo cách rõ ràng, tự nhiên trong tiếng Việt.
- source_word: בִּן נוּן
  choice: con trai Nun
  rationale: Chuyển trực tiếp công thức phụ danh Hê-bơ-rơ; giữ “Nun” là tên riêng.
- source_word: יְהוֹשֻׁעַ
  choice: Giô-suê
  rationale: Dùng dạng tên đã quen thuộc trong tiếng Việt cho Joshua.
theological_decisions:
- issue: Việc Môi-se gọi Hô-sê là Giô-suê có phải được diễn đạt rõ là đổi tên hay không
  choice: gọi Hô-sê ... là Giô-suê
  alternative: đổi tên Hô-sê ... thành Giô-suê
  rationale: Nguyên văn dùng קרא, nghĩa là “gọi/đặt tên”; cách dịch được chọn bảo toàn lối nói của bản Hê-bơ-rơ và không nhấn mạnh hơn mức văn bản rằng đây là một nghi thức đổi tên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se,” “Hô-sê” và “Giô-suê” theo dạng tên quen thuộc trong tiếng Việt; giữ “Nun” thay vì thêm dấu hoặc Việt hóa thiếu căn cứ. Câu thứ hai giữ cách diễn đạt gần nguyên văn để bảo toàn mức độ hàm ý về việc đặt hay đổi tên.
