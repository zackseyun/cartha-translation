source:
  edition: WLC
  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: vi
  text: Dân A-ma-léc cư ngụ trong vùng Nê-ghép[a]; dân Hê-tít, dân Giê-bu-sít và dân A-mô-rít cư ngụ ở miền đồi núi; còn dân Ca-na-an cư ngụ bên biển và dọc theo sông Giô-đanh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nê-ghép” cũng có thể dịch là “miền nam”; tại đây từ này có lẽ chỉ vùng đất khô hạn ở phía nam Ca-na-an.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “ở bên cạnh Giô-đanh”; thành ngữ này có nghĩa là “bên sông Giô-đanh” hoặc “dọc theo sông Giô-đanh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: dân A-ma-léc
  rationale: Tên dân tộc được phiên âm theo cách quen thuộc trong tiếng Việt; thêm “dân” để biểu thị rõ ý tập thể trong ngữ cảnh.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: cư ngụ
  rationale: Phân từ của ישב diễn tả việc định cư thường xuyên; “cư ngụ” tự nhiên, trang trọng và giữ được sắc thái cư trú ổn định.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: trong vùng Nê-ghép
  rationale: נֶגֶב ở đây nhiều khả năng là tên vùng địa lý phía nam Ca-na-an; “vùng” chuyển tải אֶרֶץ tự nhiên hơn “đất của” trong tiếng Việt.
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: dân Hê-tít / dân Giê-bu-sít / dân A-mô-rít / dân Ca-na-an
  rationale: Các danh từ dân tộc số ít về hình thái được hiểu theo nghĩa tập thể; tiếng Việt dùng “dân” để diễn đạt rõ và tự nhiên.
- source_word: בָּהָר
  choice: ở miền đồi núi
  rationale: הַר có thể chỉ núi hoặc vùng cao nguyên đồi núi; trong mô tả địa lý về nơi cư trú, “miền đồi núi” phù hợp và không thu hẹp thành một ngọn núi.
- source_word: עַל הַיָּם
  choice: bên biển
  rationale: Giữ nghĩa không gian trực tiếp của עַל trong ngữ cảnh mà không diễn giải cụ thể hơn thành “ven biển” hay “trên bờ biển”.
- source_word: עַל יַד הַיַּרְדֵּן
  choice: dọc theo sông Giô-đanh
  rationale: Thành ngữ nghĩa đen là “ở bên cạnh/phía của Giô-đanh”; “dọc theo sông Giô-đanh” diễn đạt tự nhiên vị trí trải dọc bên sông trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng dấu chấm phẩy để phân chia ba khu vực cư trú, đồng thời giữ cấu trúc liệt kê của tiếng Hê-bơ-rơ. Các địa danh và tên dân tộc được phiên âm theo lối dùng Kinh Thánh tiếng Việt quen thuộc.
