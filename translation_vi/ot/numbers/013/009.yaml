translation:
  language: vi
  text: 'Thuộc chi phái Bên-gia-min[a]: Phan-ti, con trai Ra-phu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho chi phái Bên-gia-min” hoặc “từ chi phái Bên-gia-min.” Cấu trúc Hê-bơ-rơ ở đây đánh dấu sự liên hệ với chi phái trong danh sách này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַטֵּה
  choice: thuộc chi phái
  rationale: Trong danh sách này, לְ đi với מַטֶּה đánh dấu sự liên hệ của người được nêu tên với chi phái. “Thuộc chi phái” tự nhiên trong tiếng Việt và giữ được ý nghĩa liên hệ, đồng thời không xác định quá mức giữa các cách hiểu “cho chi phái” và “từ chi phái”.
- source_word: בִנְיָמִן
  choice: Bên-gia-min
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: פַּלְטִי
  choice: Pan-ti
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, không dịch nghĩa tên.
- source_word: בֶּן
  choice: con trai
  rationale: Cách diễn đạt tự nhiên, rõ ràng cho quan hệ phụ tử trong cấu trúc gia phả Hê-bơ-rơ.
- source_word: רָפוּא
  choice: Ra-phu
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, phản ánh các nguyên âm trong bản nguồn.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, phù hợp với một mục trong danh sách. Dùng “có” để dẫn vào tên người đại diện mà không làm câu tiếng Việt trở nên gượng; giữ chú thích để bảo toàn sắc thái linh hoạt của giới từ Hê-bơ-rơ.
