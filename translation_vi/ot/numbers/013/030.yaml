base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: vi
  text: 'Bấy giờ, Ca-lép làm cho dân chúng im lặng trước mặt Môi-se[a] và nói: “Chúng ta nhất định sẽ tiến lên và chiếm lấy xứ ấy[b], vì chúng ta chắc chắn có thể làm được[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bắt dân chúng im tiếng trước mặt Môi-se.” Động từ Hê-bơ-rơ có thể mang nghĩa làm cho yên lặng, lắng xuống hoặc im tiếng.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ dùng cấu trúc nhấn mạnh: “tiến lên, chúng ta nhất định sẽ tiến lên.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “vì chúng ta hoàn toàn đủ sức chiếm được xứ ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: làm cho ... im lặng
  rationale: Diễn đạt hành động khiến đám đông yên tiếng; tự nhiên trong tiếng Việt và không hàm ý trấn áp quá mạnh.
- source_word: אֶת־הָעָם
  choice: dân chúng
  rationale: Chỉ cộng đồng Israel đang tụ họp; cách nói tự nhiên trong ngữ cảnh một đám đông đang phản ứng.
- source_word: אֶל־מֹשֶׁה
  choice: trước mặt Môi-se
  rationale: 'Giữ sắc thái không gian và quan hệ của אֶל trong cảnh này: Ca-lép khiến dân chúng im lặng ở trước mặt Môi-se.'
- source_word: עָלֹה נַעֲלֶה
  choice: nhất định phải tiến lên
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ chia nhấn mạnh mạnh mẽ hành động đi lên; “nhất định” giữ lực nhấn, còn “tiến lên” hợp với việc tiến vào xứ.
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: và chiếm lấy xứ ấy
  rationale: ירשׁ trong ngữ cảnh chinh phục và cư ngụ mang nghĩa chiếm hữu; nêu rõ “xứ ấy” để đại từ giống cái trong tiếng Hê-bơ-rơ có sở chỉ tự nhiên bằng tiếng Việt.
- source_word: כִּי יָכוֹל נוּכַל
  choice: vì chúng ta chắc chắn có thể
  rationale: Cấu trúc nhấn mạnh thứ hai bày tỏ niềm xác tín mạnh về khả năng; “chắc chắn có thể” vừa rõ nghĩa vừa giữ cường độ.
- source_word: לָהּ
  choice: làm được
  rationale: Đại từ giống cái quy chiếu về xứ; sau “có thể,” tiếng Việt cần bổ ngữ tự nhiên. “Làm được” quy về việc tiến lên và chiếm xứ mà không thêm ý “đánh bại” vốn không được nói rõ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ca-lép” và “Môi-se” theo lối phiên âm Kinh Thánh quen thuộc. Hai cấu trúc nhấn mạnh trong nguyên văn được thể hiện bằng “nhất định” và “chắc chắn,” tránh thêm sắc thái thời gian như “ngay lập tức.”
