  text: וּ/מָ֣ה הָ֠/אָרֶץ הַ/שְּׁמֵנָ֨ה הִ֜וא אִם רָזָ֗ה הֲ/יֵֽשׁ בָּ֥/הּ עֵץ֙ אִם אַ֔יִן וְ/הִ֨תְחַזַּקְתֶּ֔ם וּ/לְקַחְתֶּ֖ם מִ/פְּרִ֣י הָ/אָ֑רֶץ וְ/הַ֨/יָּמִ֔ים יְמֵ֖י בִּכּוּרֵ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: vi
  text: 'Còn đất ấy thì sao: màu mỡ hay cằn cỗi, có cây cối[a] hay không? Anh em hãy can đảm và lấy một ít sản vật của đất ấy.” Bấy giờ là lúc nho đầu mùa chín.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “có gỗ hay không”; từ Hê-bơ-rơ có thể có nghĩa là “cây” hoặc “gỗ.”
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “Những ngày ấy là những ngày nho đầu mùa,” tức là lúc bắt đầu mùa nho chín.'
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: màu mỡ hay cằn cỗi
  rationale: Hai tính từ theo nghĩa đen là “béo” và “gầy”; khi nói về đất, cặp từ tự nhiên trong tiếng Việt là “màu mỡ” và “cằn cỗi,” diễn đạt sức sản xuất của đất.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: có cây cối hay không
  rationale: עֵץ có thể chỉ cây hoặc gỗ. “Cây cối” phù hợp nhất với việc khảo sát đặc điểm của vùng đất, nhưng chú thích giữ lại khả năng chỉ nguồn gỗ.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: hãy mạnh dạn
  rationale: Dạng động từ mang ý tự làm mình mạnh lên hoặc tỏ ra mạnh mẽ. “Hãy mạnh dạn” là lời thúc giục tự nhiên, không thu hẹp ý nghĩa chỉ vào sức lực thể chất.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: lấy một ít hoa lợi của đất đem về
  rationale: מִן biểu thị lấy một phần. “Hoa lợi của đất” bao quát sản vật ăn được; “đem về” được làm rõ theo nhiệm vụ thám sát và mục đích lấy mẫu, dù ý trở về chỉ hàm chứa trong ngữ cảnh.
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: mùa nho bắt đầu chín
  rationale: Cụm từ chỉ thời điểm những trái nho đầu mùa chín. Cách diễn đạt này tự nhiên trong tiếng Việt và tránh gợi không cần thiết đến nghi lễ dâng hoa quả đầu mùa.
- source_word: וְהַיָּמִים יְמֵי
  choice: Bấy giờ đang là mùa
  rationale: Chuyển cấu trúc thời gian lặp từ của tiếng Hê-bơ-rơ sang lời kể tiếng Việt tự nhiên, đồng thời vẫn giữ đây là một ghi chú về mùa vụ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để diễn đạt lời Môi-se nói với nhóm người được sai đi; giữ nhịp mệnh lệnh rõ ràng. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn và tương ứng với chú thích.
