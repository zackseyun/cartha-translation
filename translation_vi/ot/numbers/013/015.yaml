  text: 'thuộc bộ tộc Gát: Ghê-u-ên, con trai Ma-ki.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Trong danh sách lặp lại này, לְ đi với מַטֶּה chỉ sự thuộc về và đại diện cho một bộ tộc. “Thuộc bộ tộc” tự nhiên trong tiếng Việt và giữ được ý nghĩa liên hệ bộ tộc.
- source_word: גָד
  choice: Gát
  rationale: Tên bộ tộc được phiên âm theo cách quen dùng và dễ đọc trong tiếng Việt.
- source_word: גְּאוּאֵל
  choice: Ghê-u-ên
  rationale: Tên riêng được phiên âm trực tiếp từ dạng Hê-bơ-rơ, với các âm tiết được phân tách để người đọc tiếng Việt dễ nhận biết.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt tự nhiên quan hệ cha–con trong cấu trúc gia phả Hê-bơ-rơ.
- source_word: מָכִי
  choice: Ma-ki
  rationale: Tên riêng được phiên âm từ tiếng Hê-bơ-rơ theo lối dễ đọc trong tiếng Việt.
