  text: 'And these were their names: from the tribe of Reuben, Shammua son of Zaccur.'
translation:
  language: vi
  text: 'Đây là tên của họ: thuộc chi phái Ru-bên có Sam-mua, con trai của Xa-cua.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ thị được dịch tự nhiên để mở đầu danh sách; liên từ וְ không nhất thiết phải biểu hiện riêng trong tiếng Việt vì mạch nối đã rõ từ văn cảnh.
- source_word: שְׁמוֹתָם
  choice: tên của họ
  rationale: Giữ sát nghĩa sở hữu của cụm Hê-bơ-rơ và kết hợp tự nhiên với câu giới thiệu danh sách trong tiếng Việt.
- source_word: לְמַטֵּה
  choice: thuộc chi phái
  rationale: Trong danh sách này, לְ chỉ sự liên hệ hoặc đại diện theo chi phái; “thuộc chi phái” diễn đạt rõ sự quy thuộc mà không làm câu nặng nề.
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Phiên âm tên chi phái theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: שַׁמּוּעַ
  choice: Sa-mua
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, không dịch nghĩa tên.
- source_word: בֶּן
  choice: con trai của
  rationale: Diễn đạt rõ quan hệ cha-con của từ Hê-bơ-rơ בֶּן bằng tiếng Việt hiện đại.
- source_word: זַכּוּר
  choice: Xa-cua
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, không dịch nghĩa tên.
