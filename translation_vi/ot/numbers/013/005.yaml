- source_word: לְמַטֵּה
  choice: thuộc chi phái
  rationale: מַטֶּה trong danh sách này chỉ một chi phái Y-sơ-ra-ên; giới từ לְ biểu thị người đại diện được kể theo chi phái. “Thuộc chi phái” tự nhiên trong tiếng Việt và giữ được cấu trúc liệt kê.
- source_word: שִׁמְעוֹן
  choice: Si-mê-ôn
  rationale: Tên riêng của tổ phụ và chi phái, được phiên âm theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: שָׁפָט
  choice: Sa-phát
  rationale: Tên riêng được phiên âm, không dịch nghĩa.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt rõ quan hệ phụ tử trong công thức định danh; “con trai” tự nhiên và chính xác hơn chỉ dùng “con” trong ngữ cảnh này.
- source_word: חוֹרִי
  choice: Hô-ri
  rationale: Tên riêng được phiên âm, không dịch nghĩa.
