  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: vi
  text: “Hãy sai những người nam đi cho con[a], để họ thăm dò xứ Ca-na-an mà Ta đang ban cho con cái Y-sơ-ra-ên. Các ngươi phải sai từ mỗi chi tộc của tổ phụ họ một người; mỗi người đều là một thủ lĩnh trong số họ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì con” hoặc đơn giản là “Hãy sai.” Tiếng Hê-bơ-rơ có cụm “cho con,” có thể mang sắc thái nhấn mạnh, cho phép, hoặc liên hệ riêng với Môi-se; sắc thái chính xác không hoàn toàn rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: Hãy sai những người nam đi cho chính con
  rationale: Động từ mệnh lệnh שְׁלַח được dịch là “hãy sai ... đi”; לְךָ được giữ lại bằng “cho chính con” nhằm bảo toàn sắc thái hướng riêng đến Môi-se mà không quyết định đó là sự cho phép, nhấn mạnh hay hành động vì lợi ích của ông.
- source_word: אֲנָשִׁים
  choice: những người nam
  rationale: Danh từ số nhiều giống đực ở đây chỉ các đại diện nam được chọn từ các chi tộc; “những người nam” diễn đạt chính xác giới tính trong ngữ cảnh.
- source_word: וְיָתֻרוּ
  choice: để họ thăm dò
  rationale: תור trong ngữ cảnh này chỉ việc đi khảo sát, do thám hay khám phá đất. “Thăm dò” tự nhiên trong tiếng Việt và không thu hẹp nghĩa chỉ còn hoạt động gián điệp.
- source_word: אֶרֶץ כְּנַעַן
  choice: xứ Ca-na-an
  rationale: “Xứ Ca-na-an” phản ánh cả אֶרֶץ lẫn địa danh, đồng thời là cách nói trang trọng, dễ hiểu trong tiếng Việt.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: mà Ta đang ban
  rationale: Phân từ נֹתֵן diễn tả hành động đang diễn tiến hoặc chắc chắn sắp thực hiện; “đang ban” giữ được phương diện này.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con cái Y-sơ-ra-ên
  rationale: Cách dịch này giữ thành ngữ gia tộc–giao ước “các con trai/con cái của Y-sơ-ra-ên” nhưng trong tiếng Việt tự nhiên vẫn bao hàm toàn dân.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: mỗi ... một người
  rationale: Phép lặp trong tiếng Hê-bơ-rơ có ý nghĩa phân phối; cấu trúc “mỗi ... một người” truyền đạt tự nhiên lực nghĩa ấy.
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: mỗi chi tộc tổ phụ
  rationale: מַטֶּה ở đây là “chi tộc”; אֲבֹתָיו chỉ dòng dõi tổ tiên theo phụ hệ. “Chi tộc tổ phụ” giữ cấu trúc thân tộc mà vẫn gọn trong tiếng Việt.
- source_word: תִּשְׁלָחוּ
  choice: Các con phải sai
  rationale: Dạng chưa hoàn thành ở đây tiếp nối mệnh lệnh và có lực chỉ thị. Chủ ngữ số nhiều được biểu đạt bằng “các con”, còn “phải” làm rõ tính mệnh lệnh.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: mỗi người đều phải là một thủ lĩnh trong số họ
  rationale: נָשִׂיא có thể là thủ lĩnh, người đứng đầu hoặc lãnh tụ. “Thủ lĩnh” phù hợp với người lãnh đạo được công nhận trong chi tộc và giữ sắc thái trang trọng.
theological_decisions:
- issue: Sắc thái của לְךָ trong mệnh lệnh của Đức Chúa Trời
  choice: Giữ trong chính văn là “cho chính con”
  alternative: Lược bỏ như một thành tố thành ngữ, hoặc dịch “theo ý con/vì con”
  rationale: Nguyên văn có לְךָ. Giữ cụm từ này bảo toàn sự mơ hồ chân thực về việc nó biểu thị sự nhấn mạnh, sự cho phép hay sự liên hệ riêng với Môi-se, thay vì ngầm quyết định cách hiểu.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: “con cái Y-sơ-ra-ên”
  alternative: “các con trai của Y-sơ-ra-ên” hoặc “dân Y-sơ-ra-ên”
  rationale: “Con cái Y-sơ-ra-ên” giữ được hình ảnh gia tộc và giao ước của tiếng Hê-bơ-rơ, đồng thời trong tiếng Việt tự nhiên chỉ toàn thể dân chứ không loại trừ phụ nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta/con” phản ánh lời Đức Chúa Trời phán trực tiếp với Môi-se; “các con” ở câu sau giữ số nhiều của động từ Hê-bơ-rơ. Dấu chú thích [a] xuất hiện ngay sau cụm từ mà chú thích giải thích.
