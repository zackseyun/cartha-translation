  yaml_path: translation/ot/numbers/013/014.yaml
  text: from the tribe of Naphtali[a], Nahbi the son of Vophsi;
translation:
  language: vi
  text: 'thuộc chi phái Nép-ta-li: Nác-bi, con trai Vốp-si[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Váp-si.” Các cách phiên âm tên Hê-bơ-rơ này có khác nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: thuộc chi phái
  rationale: Trong danh sách các đại diện, giới từ לְ đi với מַטֶּה biểu thị người được nêu thuộc về chi phái nào. “Thuộc chi phái” tự nhiên, ngắn gọn và phù hợp văn cảnh tiếng Việt.
- source_word: נַפְתָּלִי
  choice: Nép-ta-li
  rationale: Tên riêng của tổ phụ và chi phái, được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: נַחְבִּי
  choice: Nác-bi
  rationale: Tên riêng được phiên âm sát âm vị Hê-bơ-rơ, đồng thời dễ đọc đối với độc giả Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ phụ tử trong cấu trúc tên gọi; tiếng Việt không cần thêm mạo từ tương ứng với “the” trong lớp tham khảo tiếng Anh.
- source_word: וָפְסִי
  choice: Vóp-si
  rationale: Phiên âm theo cách phát âm của dạng Hê-bơ-rơ וָפְסִי; nguyên âm đầu được thể hiện là “ó” thay vì dựa vào biến thể phiên tự tiếng Anh.
theological_decisions: []
