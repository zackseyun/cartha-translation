  register: Văn phong trang trọng, tự nhiên và cô đọng, phù hợp cấu trúc liệt kê của phân đoạn. Dùng dấu hai chấm để giới thiệu người đại diện của chi phái; giữ dấu chấm phẩy vì câu còn tiếp nối danh sách.
