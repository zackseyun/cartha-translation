  text: וַ/יְסַפְּרוּ ל/וֹ֙ וַ/יֹּ֣אמְר֔וּ בָּ֕אנוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֣ר שְׁלַחְתָּ֑/נוּ וְ֠/גַם זָבַ֨ת חָלָ֥ב וּ/דְבַ֛שׁ הִ֖וא וְ/זֶה פִּרְיָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: vi
  text: 'Họ thuật lại cho ông và nói: “Chúng tôi đã vào xứ mà ông sai chúng tôi đến. Xứ ấy quả thật[a] tuôn tràn sữa và mật; đây là hoa trái của xứ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xứ ấy đúng là tuôn tràn sữa và mật.” Từ וְגַם nhấn mạnh lời xác nhận về sự phong phú của xứ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: Họ thuật lại
  rationale: Động từ ספר ở thể piel mang nghĩa kể lại hoặc báo cáo. “Thuật lại” phù hợp với lời tường trình chính thức và vẫn tự nhiên trong tiếng Việt.
- source_word: לוֹ
  choice: cho ông
  rationale: Giữ đại từ của nguyên văn; người được nói đến là Môi-se theo ngữ cảnh, nhưng câu Hê-bơ-rơ không nêu tên.
- source_word: וַיֹּאמְרוּ
  choice: và nói
  rationale: Giữ chuỗi tự sự của nguyên văn, dù tiếng Việt có phần lặp với “thuật lại”; sự lặp này phản ánh cấu trúc Hê-bơ-rơ.
- source_word: בָּאנוּ אֶל הָאָרֶץ
  choice: Chúng tôi đã vào xứ
  rationale: בוא có thể chỉ việc đến hoặc đi vào; ở đây “vào xứ” diễn đạt tự nhiên việc họ đã tiến vào và thám sát vùng đất ấy.
- source_word: אֲשֶׁר שְׁלַחְתָּנוּ
  choice: mà ông sai chúng tôi đến
  rationale: Bổ sung “đến” theo đích hướng đã có trong אֶל, tạo câu tiếng Việt rõ nghĩa mà không thêm nội dung.
- source_word: וְגַם
  choice: quả thật
  rationale: Cụm này nhấn mạnh và xác nhận lời đánh giá tích cực về sự màu mỡ của xứ; “quả thật” giữ được lực khẳng định.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: tuôn tràn sữa và mật
  rationale: Giữ hình ảnh Hê-bơ-rơ quen thuộc về sự phong phú, đồng thời dùng cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: הִוא
  choice: Xứ ấy
  rationale: Đại từ giống cái quy chiếu về הָאָרֶץ, “xứ”; lặp lại danh từ trong tiếng Việt giúp câu rõ và tự nhiên hơn.
- source_word: וְזֶה פִּרְיָהּ
  choice: đây là hoa trái của xứ
  rationale: “Đây” thể hiện động tác chỉ vào sản vật làm bằng chứng; “hoa trái” diễn đạt פְּרִי theo văn phong Kinh Thánh tự nhiên.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ đại từ “ông” theo nguyên văn thay vì nêu tên Môi-se; bảo tồn phép lặp “thuật lại... và nói” và hình ảnh “tuôn tràn sữa và mật” của tiếng Hê-bơ-rơ.
