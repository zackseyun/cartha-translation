  source_fidelity: 'Bản dịch truyền đạt đầy đủ diễn tiến của nguyên văn: họ tường trình với ông, đã vào xứ ông sai họ đến, xác nhận tính phong phú của xứ, và chỉ hoa trái làm bằng chứng. “Quả thật” phản ánh hợp lý sắc thái nhấn mạnh của וְגַם; “đây là hoa trái của xứ” bảo toàn tính chỉ thị của וְזֶה.'
  naturalness: Câu tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “thuật lại cho ông và nói” có chủ ý giữ hai động từ tường thuật của tiếng Hê-bơ-rơ mà vẫn chấp nhận được trong văn phong Kinh Thánh. “Tuôn tràn sữa và mật” giữ hình ảnh thành ngữ của nguồn và đọc tự nhiên trong ngữ cảnh trang trọng.
  terminology: “Xứ,” “sữa và mật,” và “hoa trái” nhất quán với văn phong Kinh Thánh Việt ngữ. Đại từ “ông” tôn trọng việc nguyên văn dùng đại từ thay vì gọi tên Môi-se. Chú thích được gắn đúng tại “quả thật” và giải thích đúng chức năng nhấn mạnh của וְגַם.
