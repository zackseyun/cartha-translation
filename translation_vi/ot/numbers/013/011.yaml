  text: 'from the tribe of Joseph[a], from the tribe of Manasseh: Gaddi son of Susi.'
translation:
  language: vi
  text: 'Từ chi phái Giô-sép, từ chi phái Ma-na-se: Ga-đi, con trai Su-si.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: thuộc chi phái
  rationale: Trong danh sách này, לְ đánh dấu sự trực thuộc và đại diện cho một chi phái; “thuộc chi phái” tự nhiên trong tiếng Việt và giữ đúng chức năng của cụm từ.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Phiên âm tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: tức chi phái Ma-na-se
  rationale: Bản Hê-bơ-rơ lặp lại לְמַטֵּה để xác định Ma-na-se là chi phái cụ thể thuộc dòng Giô-sép; “tức” diễn đạt rõ quan hệ giải thích mà vẫn giữ cả hai danh xưng.
- source_word: גַּדִּי
  choice: Ga-đi
  rationale: Phiên âm tên riêng sang tiếng Việt.
- source_word: בֶּן
  choice: con trai
  rationale: Cách diễn đạt tự nhiên và chính xác về quan hệ cha–con trong danh sách tên người.
- source_word: סוּסִי
  choice: Su-si
  rationale: Phiên âm tên riêng sang tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa Giô-sép và Ma-na-se trong cách gọi chi phái
  choice: “thuộc chi phái Giô-sép, tức chi phái Ma-na-se”
  alternative: “thuộc chi phái Giô-sép, thuộc chi phái Ma-na-se”
  rationale: “Tức” giúp độc giả hiện đại hiểu Ma-na-se là nhánh cụ thể của Giô-sép được nói đến, chứ không phải hai đơn vị độc lập, mà không thêm một lập trường thần học hệ phái.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và dễ hiểu, phù hợp cấu trúc liệt kê. Giữ tên Giô-sép trước Ma-na-se theo nguyên văn; dùng dấu hai chấm để giới thiệu người đại diện.
