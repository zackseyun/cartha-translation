id: NUM.13.3
reference: Numbers 13:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: vi
  text: Môi-se sai họ đi từ hoang mạc Pha-ran theo lệnh Yahweh[a]. Tất cả họ đều là những người nam, là các trưởng tộc của dân Y-sơ-ra-ên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo lời Yahweh.” Thành ngữ Hê-bơ-rơ dịch sát là “theo miệng Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “những người đứng đầu các con trai Y-sơ-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sai họ đi
  rationale: Động từ שׁלח trong mạch tường thuật chỉ hành động phái người đi làm nhiệm vụ; “sai họ đi” tự nhiên trong tiếng Việt và giữ rõ đối tượng.
- source_word: מִמִּדְבַּר פָּארָן
  choice: từ hoang mạc Pha-ran
  rationale: מִדְבָּר chỉ vùng hoang vu, không nhất thiết hoàn toàn là sa mạc cát; “hoang mạc” phù hợp văn cảnh địa lý và văn phong Kinh Thánh.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Thành ngữ này có nghĩa là làm theo mệnh lệnh hay chỉ thị; bản dịch chính diễn đạt tự nhiên, còn nghĩa đen được ghi ở chú thích.
- source_word: כֻּלָּם אֲנָשִׁים
  choice: Tất cả họ đều là những người nam
  rationale: כֻּלָּם nhấn mạnh toàn thể nhóm, còn אֲנָשִׁים trong ngữ cảnh nói về các đại diện nam của các bộ tộc.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: những người đứng đầu con cái Y-sơ-ra-ên
  rationale: Cách dịch giữ hình ảnh “đứng đầu” của רָאשֵׁי và cách gọi mang tính gia tộc “con cái Y-sơ-ra-ên”, đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יְהוָה. Giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Ngôn ngữ chỉ giới tính trong אֲנָשִׁים
  choice: những người nam
  alternative: những người; các thủ lĩnh
  rationale: Trong văn cảnh, các đại diện được cử đi là nam giới; cách dịch này không xóa nét nghĩa giới tính của nguyên văn.
- issue: Cách gọi בְנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Giữ cách diễn đạt gia tộc của tiếng Hê-bơ-rơ mà không suy diễn thêm ý nghĩa thần học; cách nói tự nhiên hơn được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ nghĩa. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt, ngoại trừ danh Yahweh được giữ nguyên theo dạng chuyển tự. Cấu trúc hai câu bảo tồn nhịp kể và sự nhấn mạnh của כֻּלָּם.
