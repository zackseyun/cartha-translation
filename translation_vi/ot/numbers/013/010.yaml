  language: vi
  text: từ bộ tộc Sa-bu-lôn, Ga-đi-ên, con trai của Sô-đi;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: từ bộ tộc
  rationale: Trong công thức liệt kê này, לְ đi với מַטֶּה chỉ người đại diện xuất thân từ một bộ tộc; “từ bộ tộc” tự nhiên và giữ đúng quan hệ bộ tộc.
- source_word: זְבוּלֻן
  choice: Sa-bu-lôn
  rationale: Phiên âm tên bộ tộc theo cách dùng Kinh Thánh tiếng Việt quen thuộc, đồng thời không dịch nghĩa tên riêng.
- source_word: גַּדִּיאֵל
  choice: Ga-đi-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, dùng dấu gạch nối để dễ đọc.
- source_word: בֶּן
  choice: con trai của
  rationale: Diễn đạt rõ và tự nhiên quan hệ phụ tử trong cấu trúc gia phả Hê-bơ-rơ.
- source_word: סוֹדִי
  choice: Sô-đi
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt thay vì dịch nghĩa.
