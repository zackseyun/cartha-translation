base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: vi
  text: Vậy, họ đi lên và do thám xứ, từ hoang mạc Xin cho đến Rê-hốp, tại Lê-bô Ha-mát.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “về phía lối vào Ha-mát.” Cụm từ Hê-bơ-rơ có thể được hiểu theo nghĩa mô tả thay vì là địa danh Lê-bô Ha-mát.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: họ đi lên
  rationale: Giữ sắc thái phương hướng của động từ עלה, đồng thời tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: וַיָּתֻרוּ
  choice: do thám
  rationale: Trong ngữ cảnh những người được sai đi khảo sát Ca-na-an, תור mang ý nghĩa trinh sát; “do thám” diễn đạt rõ mục đích mà không thêm chi tiết.
- source_word: הָאָרֶץ
  choice: xứ
  rationale: Chỉ vùng đất Ca-na-an đang được khảo sát; “xứ” ngắn gọn, trang trọng và phù hợp ngữ cảnh địa lý.
- source_word: מִמִּדְבַּר צִן
  choice: từ hoang mạc Xin
  rationale: מִדְבָּר là vùng hoang vu, khô cằn; “hoang mạc” tự nhiên trong tiếng Việt và Xin được phiên âm như địa danh.
- source_word: עַד רְחֹב
  choice: cho đến Rê-hốp
  rationale: עַד đánh dấu giới hạn địa lý của cuộc do thám; “cho đến” truyền đạt trực tiếp phạm vi ấy.
- source_word: לְבֹא חֲמָת
  choice: về phía lối vào Ha-mát
  rationale: Cụm này có thể được hiểu theo nghĩa mô tả là “lối vào Ha-mát” hoặc như địa danh Lê-bô Ha-mát. Bản chính giữ cách hiểu mô tả phù hợp với cấu trúc Hê-bơ-rơ, còn cách hiểu địa danh được ghi ở chú thích.
