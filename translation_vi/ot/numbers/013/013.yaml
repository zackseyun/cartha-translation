  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: thuộc bộ tộc
  rationale: Trong danh sách các đại diện của những bộ tộc, לְ trước מַטֵּה chỉ bộ tộc mà người được nêu tên thuộc về. “Thuộc bộ tộc” tự nhiên trong tiếng Việt và không diễn giải quá mức.
- source_word: אָשֵׁר
  choice: A-se
  rationale: Tên riêng của tổ phụ và bộ tộc, được phiên âm theo lối quen dùng trong tiếng Việt.
- source_word: סְתוּר
  choice: Sê-thua
  rationale: Tên riêng được phiên âm trực tiếp từ dạng Hê-bơ-rơ có nguyên âm.
- source_word: בֶּן
  choice: con trai
  rationale: Trong công thức gia hệ, בֶּן + tên riêng xác định người cha; “con trai” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: מִיכָאֵל
  choice: Mi-ca-ên
  rationale: Tên riêng được phiên âm từ tiếng Hê-bơ-rơ, đồng thời giữ dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
