  to: Ở đó, chúng tôi đã thấy người Nê-phi-lim[a]—con cháu A-nác, thuộc dòng Nê-phi-lim—; chúng tôi tự thấy mình như châu chấu, và trong mắt họ, chúng tôi cũng như vậy.
