  source_fidelity: Bản nháp giữ được thuật ngữ Nê-phi-lim, quan hệ với A-nác, và phép so sánh với châu chấu. Tuy nhiên, “Trước mắt mình” trong tiếng Việt thường mang nghĩa không gian (ở ngay trước mắt), không diễn đạt thành ngữ đánh giá “trong mắt chúng tôi”; vì vậy cần sửa để giữ rõ sắc thái tự nhận định của tiếng Hê-bơ-rơ.
  naturalness: Câu đầu có dấu gạch ngang mở cho phần đồng vị nhưng không được khép lại, và câu thứ hai lặp “thấy mình” với một cách nói chưa tự nhiên. “Chúng tôi tự thấy mình...” và “trong mắt họ” là tiếng Việt hiện đại, tự nhiên, đồng thời giữ thế đối xứng của câu gốc.
  terminology: Giữ phiên âm “Nê-phi-lim” là phù hợp vì từ Hê-bơ-rơ không chắc nghĩa. “Con cháu A-nác, thuộc dòng Nê-phi-lim” truyền đạt quan hệ xuất thân/thuộc về mà không ép nghĩa “người khổng lồ”. Chú thích nên dùng số nhiều tự nhiên là “những người khổng lồ”.
