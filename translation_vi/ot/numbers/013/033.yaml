source:
  edition: WLC
  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: vi
  text: Ở đó, chúng tôi đã thấy người Nê-phi-lim[a]—con cháu A-nác, thuộc dòng Nê-phi-lim—; chúng tôi tự thấy mình như châu chấu, và trong mắt họ, chúng tôi cũng như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo cách dịch truyền thống, “những người khổng lồ”. Nghĩa chính xác của từ Hê-bơ-rơ Nê-phi-lim không chắc chắn, nên chính văn giữ dạng phiên âm.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: người Nê-phi-lim
  rationale: Phiên âm thuật ngữ Hê-bơ-rơ vì đối tượng được chỉ đến không chắc chắn; thêm danh từ loại “người” để câu tiếng Việt tự nhiên mà không diễn giải họ là “người khổng lồ” hay “những kẻ sa ngã”.
- source_word: בְּנֵי עֲנָק
  choice: con cháu A-nác
  rationale: Trong ngữ cảnh gia tộc và dòng dõi, “con cháu” truyền đạt tự nhiên ý nghĩa của cách nói Hê-bơ-rơ “các con trai của A-nác”, tránh khiến độc giả hiểu rằng chỉ nói đến con trai trực hệ.
- source_word: מִן הַנְּפִלִים
  choice: thuộc dòng Nê-phi-lim
  rationale: Diễn đạt quan hệ nguồn gốc hoặc dòng dõi được מן gợi ra, đồng thời không xác định quá mức bản chất chính xác của mối quan hệ.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: Trước mắt mình, chúng tôi thấy mình
  rationale: Chuyển thành ngữ chỉ sự tự nhận định sang tiếng Việt tự nhiên, giữ rõ đây là nhận thức của những người thuật chuyện chứ không nhất thiết là sự mô tả khách quan.
- source_word: כַּחֲגָבִים
  choice: như châu chấu
  rationale: “Châu chấu” là cách gọi thông dụng, phù hợp với phép so sánh về sự nhỏ bé.
- source_word: וְכֵן
  choice: cũng như vậy
  rationale: Giữ lực so sánh và sự song hành giữa cách họ nhìn chính mình với cách họ cho rằng đối phương nhìn họ.
- source_word: בְעֵינֵיהֶם
  choice: trước mắt họ
  rationale: Giữ thành ngữ Hê-bơ-rơ và tạo thế đối xứng với “trước mắt mình” trong vế trước.
theological_decisions:
- issue: Cách dịch נְפִילִים
  choice: Nê-phi-lim
  alternative: người khổng lồ; những kẻ sa ngã
  rationale: Thuật ngữ này có nghĩa và đối tượng quy chiếu còn gây tranh luận, cũng xuất hiện trong Sáng Thế 6:4. Phiên âm trong chính văn bảo tồn sự mơ hồ của nguyên ngữ; cách hiểu truyền thống “người khổng lồ” được nêu trong chú thích.
- issue: Mối quan hệ giữa con cháu A-nác và Nê-phi-lim
  choice: thuộc dòng Nê-phi-lim
  alternative: ở trong số người Nê-phi-lim
  rationale: מן có thể chỉ nguồn gốc hoặc quan hệ thuộc nhóm. Bản dịch chọn cách diễn đạt dòng dõi phù hợp nhất với cấu trúc đồng vị, nhưng không giải thích thêm bản chất của Nê-phi-lim.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối Việt hóa có dấu và gạch nối. Câu giữ sự lặp có chủ ý của “trước mắt” để phản ánh tính đối xứng trong nguyên văn.
