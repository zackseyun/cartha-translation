lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: thuộc chi phái
  rationale: Trong danh sách những người đại diện cho các chi phái, לְ trước מַטֵּה nêu chi phái mà người được gọi tên thuộc về và đại diện. “Thuộc chi phái” tự nhiên trong tiếng Việt và phù hợp với cấu trúc liệt kê.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Cách phiên âm quen dùng trong tiếng Việt cho tên Giu-đa; tại đây chỉ chi phái mang tên ông.
- source_word: כָּלֵב
  choice: Ca-lép
  rationale: Cách phiên âm tiếng Việt quen thuộc của tên riêng Ca-lép.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ phụ hệ dùng để xác định Ca-lép; “con trai” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: יְפֻנֶּה
  choice: Giê-phu-nê
  rationale: Cách phiên âm tiếng Việt quen thuộc của tên riêng Giê-phu-nê.
