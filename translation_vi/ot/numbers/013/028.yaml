base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: vi
  text: Tuy nhiên, dân sống trong xứ rất mạnh, các thành kiên cố và rất lớn; tại đó, chúng tôi cũng đã thấy con cháu của A-nác[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “các con của A-nác.” Cụm từ Hê-bơ-rơ chỉ những người thuộc dòng dõi A-nác.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: Tuy nhiên
  rationale: Cụm từ mở đầu đưa ra một sự hạn định mạnh, đối lập với lời tường thuật tích cực về xứ ở câu trước; “Tuy nhiên” tự nhiên trong tiếng Việt và giữ được sắc thái đối nghịch.
- source_word: עַז הָעָם הַיֹּשֵׁב בָּאָרֶץ
  choice: dân cư trong xứ rất mạnh
  rationale: עַז diễn tả sức mạnh hoặc tính đáng gờm, không nhất thiết hàm ý hung dữ. “Dân cư trong xứ” diễn đạt tự nhiên ý tập thể của הָעָם cùng phân từ הַיֹּשֵׁב.
- source_word: וְהֶעָרִים בְּצֻרוֹת גְּדֹלֹת מְאֹד
  choice: các thành thì kiên cố và rất lớn
  rationale: “Kiên cố” truyền đạt ý các thành được phòng thủ bằng công sự; liên từ “và” giữ sự phối hợp giữa hai đặc điểm “kiên cố” và “rất lớn” trong tiếng Hê-bơ-rơ.
- source_word: וְגַם
  choice: còn thấy cả
  rationale: Cách diễn đạt này giữ lực bổ sung của וְגַם, cho thấy đây là một chi tiết đáng lo ngại được thêm vào báo cáo.
- source_word: יְלִדֵי הָעֲנָק
  choice: con cháu của A-na
  rationale: Cụm cấu tạo chỉ những người thuộc dòng dõi A-na. “Con cháu” tự nhiên trong tiếng Việt và diễn đạt rõ ý hậu duệ mà không giới hạn ở con ruột trực tiếp.
- source_word: רָאִינוּ שָׁם
  choice: tại đó chúng tôi ... thấy
  rationale: Động từ hoàn thành được dịch bằng thời quá khứ hiểu theo ngữ cảnh tường thuật; “tại đó” được giữ lại để nhấn mạnh địa điểm.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “xứ” phù hợp ngữ cảnh địa lý trong sách Dân Số, còn “thành” và “kiên cố” giữ sắc thái tường thuật quân sự mà không cổ hóa câu văn.
