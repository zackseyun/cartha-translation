base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: vi
  text: Họ đi lên miền Nê-ghép, rồi người ấy đi đến tận Hếp-rôn.[a] Ở đó có A-hi-man, Sê-sai và Tanh-mai, là con cháu của A-nác. Hếp-rôn được xây dựng trước Xô-an của Ai Cập bảy năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chuyển từ “họ đi lên” sang “người ấy đi đến”; không nói rõ “người ấy” là ai.
    reason: Bảo tồn sự thay đổi số của chủ ngữ và tính không xác định trong bản Hê-bơ-rơ.
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: miền Nê-ghép
  rationale: Giữ địa danh vùng miền theo ngữ cảnh hành trình, đồng thời dùng “miền” để người đọc nhận ra đây là một khu vực.
- source_word: יְלִידֵי הָעֲנָק
  choice: con cháu của A-nác
  rationale: Cụm Hê-bơ-rơ chỉ những người thuộc dòng dõi A-nác; “con cháu” tự nhiên và chính xác hơn cách dịch sát chữ “những người được sinh ra bởi A-nác”.
- source_word: נִבְנְתָה לִפְנֵי
  choice: được xây dựng trước
  rationale: 'Diễn đạt trực tiếp quan hệ niên đại: Hếp-rôn được xây trước Xô-an bảy năm.'
theological_decisions:
- issue: Sự chuyển đổi chủ ngữ từ số nhiều sang số ít
  choice: “Họ đi lên… rồi người ấy đi…”
  alternative: “Họ đi lên… rồi đi đến…”
  rationale: Bản Hê-bơ-rơ chuyển đột ngột từ động từ số nhiều וַיַּעֲלוּ sang động từ giống đực số ít וַיָּבֹא. Bản dịch giữ sự chuyển đổi này và không tự xác định người đi đến Hếp-rôn là ai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng được phiên âm nhất quán sang tiếng Việt; cấu trúc số ít bất ngờ được giữ lại và giải thích bằng chú thích.
