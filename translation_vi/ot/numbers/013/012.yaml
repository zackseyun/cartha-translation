  text: 'Về chi phái Đan: A-mi-ên, con trai Ghê-ma-li;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: thuộc bộ tộc
  rationale: Trong danh sách các đại diện của từng bộ tộc, לְ biểu thị sự quy thuộc hoặc tư cách đại diện, còn מַטֶּה chỉ đơn vị bộ tộc chứ không phải cây gậy theo nghĩa đen. Cách dịch này tự nhiên trong tiếng Việt và phù hợp với cấu trúc liệt kê.
- source_word: דָן
  choice: Đan
  rationale: Tên riêng của bộ tộc, được phiên âm theo cách quen dùng trong tiếng Việt.
- source_word: עַמִּיאֵל
  choice: A-mi-ên
  rationale: Tên riêng được phiên âm rõ âm tiết, phù hợp lối trình bày tên Hê-bơ-rơ trong bản dịch tiếng Việt phổ thông.
- source_word: בֶּן
  choice: con trai
  rationale: Diễn đạt trực tiếp quan hệ phụ tử trong cấu trúc gia phả Hê-bơ-rơ; dạng rút gọn phù hợp với danh sách.
- source_word: גְּמַלִּי
  choice: Ghê-ma-li
  rationale: Tên riêng được phiên âm từ tiếng Hê-bơ-rơ theo lối dễ đọc đối với độc giả Việt.
