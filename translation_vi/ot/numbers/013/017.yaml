base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: vi
  text: 'Môi-se sai họ đi thăm dò đất Ca-na-an[a] và bảo họ: “Hãy đi lên lối này, vào miền Nê-ghép[b], rồi đi lên vùng đồi núi[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “do thám đất Ca-na-an”.
    reason: lexical_alternative
  - marker: b
    text: Nê-ghép là vùng khô cằn ở phía nam Ca-na-an.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “miền núi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sai
  rationale: Động từ שׁלח ở thể kể chuyện diễn tả việc Môi-se phái họ đi; “sai” tự nhiên, trang trọng và đúng quan hệ cú pháp với động từ mục đích theo sau.
- source_word: לָתוּר
  choice: đi thăm dò
  rationale: תור ở đây chỉ việc khảo sát, trinh sát vùng đất. “Thăm dò” giữ được ý điều tra thực địa mà không mặc nhiên nhấn mạnh tính bí mật như “do thám”.
- source_word: אֶרֶץ כְּנָעַן
  choice: đất Ca-na-an
  rationale: Giữ đầy đủ danh ngữ chỉ lãnh thổ mang tên Ca-na-an, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: עֲלוּ זֶה
  choice: Hãy theo đường này đi lên
  rationale: עֲלוּ mang nghĩa đi lên, còn זֶה có chức năng chỉ hướng hoặc lộ trình; bản dịch diễn đạt rõ mà vẫn giữ nét địa hình của động từ.
- source_word: בַּנֶּגֶב
  choice: miền Nê-ghép
  rationale: נֶגֶב tại đây là địa danh chỉ vùng khô cằn ở phía nam. Cụm “đi lên miền Nê-ghép” thể hiện hướng tiến vào vùng này mà không biến địa danh thành một từ chỉ phương hướng đơn thuần.
- source_word: וַעֲלִיתֶם
  choice: rồi đi lên
  rationale: Dạng động từ nối tiếp tiếp tục lực mệnh lệnh của câu trước; “rồi” thể hiện trình tự hành trình tự nhiên trong tiếng Việt.
- source_word: הָהָר
  choice: vùng đồi núi
  rationale: Danh từ số ít có mạo từ trong ngữ cảnh địa lý chỉ miền cao nguyên hoặc vùng núi, không nhất thiết là một ngọn núi riêng lẻ.
