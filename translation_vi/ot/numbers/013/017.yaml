translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu lệnh rõ ràng và dễ hiểu. Giữ các địa danh theo lối phiên âm quen dùng trong Kinh Thánh tiếng Việt. Các dấu chú thích được đặt ngay sau từ hoặc cụm từ liên quan.
