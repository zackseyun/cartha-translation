  text: וַ/יָּשֻׁ֖בוּ מִ/תּ֣וּר הָ/אָ֑רֶץ מִ/קֵּ֖ץ אַרְבָּעִ֥ים יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: vi
  text: Sau bốn mươi ngày, họ trở về từ chuyến thăm dò miền đất ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khảo sát miền đất ấy” hoặc “do thám miền đất ấy.” Động từ Hê-bơ-rơ chỉ việc xem xét miền đất trong một nhiệm vụ trinh sát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: họ trở về
  rationale: Động từ Qal wayyiqtol ngôi 3 số nhiều của שוב tiếp nối mạch kể chuyện. Tiếng Việt tự nhiên không cần dịch riêng liên từ וַ־.
- source_word: מִתּוּר
  choice: từ chuyến thăm dò
  rationale: Dạng động từ nguyên thể của תור với מִן chỉ việc trở về sau hoạt động khảo sát. “Thăm dò” diễn đạt nhiệm vụ trinh sát mà không mặc nhiên mang sắc thái tiêu cực của “do thám”.
- source_word: הָאָרֶץ
  choice: miền đất ấy
  rationale: Ở đây אֶרֶץ chỉ miền đất cụ thể mà đoàn người vừa khảo sát; “ấy” giúp xác định đối tượng đã biết trong văn cảnh.
- source_word: מִקֵּץ
  choice: sau
  rationale: Cụm מִקֵּץ đánh dấu thời điểm một khoảng thời gian đã kết thúc. Đặt “Sau bốn mươi ngày” ở đầu câu là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: אַרְבָּעִים יוֹם
  choice: bốn mươi ngày
  rationale: Cụm số đếm và danh từ chỉ một khoảng thời gian gồm bốn mươi ngày.
theological_decisions: []
