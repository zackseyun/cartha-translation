id: NUM.13.32
reference: Numbers 13:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: vi
  text: 'Họ báo cho con cái Y-sơ-ra-ên một tin xấu về miền đất mà họ đã thám sát,[a] rằng: “Miền đất mà chúng tôi đã đi qua để thám sát là miền đất nuốt chửng cư dân của nó; và tất cả những người chúng tôi thấy trong đó đều là những người có tầm vóc lớn.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do thám” hoặc “dò xét.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những người có tầm vóc,” ở đây nói đến kích thước thể chất nổi bật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: tung ra ... một lời tường thuật xấu
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ ‘đưa ra/tung ra một lời tường thuật xấu’, đồng thời diễn đạt tự nhiên việc phổ biến một báo cáo gây bất lợi; không mặc nhiên nâng nghĩa thành ‘vu khống’.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Phù hợp bối cảnh địa lý-giao ước và tự nhiên hơn ‘đất’ đơn lẻ trong câu tiếng Việt.
- source_word: תָּרוּ / לָתוּר
  choice: thám sát
  rationale: Bao quát ý khảo sát, dò xét địa hình mà không giới hạn vào hoạt động gián điệp.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: giữa con cái Y-sơ-ra-ên
  rationale: Giữ danh xưng tập thể theo sát nguyên văn ‘các con trai/con cái của Y-sơ-ra-ên’; ‘giữa’ diễn đạt tự nhiên phạm vi lời tường thuật được tung ra.
- source_word: עָבַרְנוּ בָהּ
  choice: chúng tôi đã đi qua
  rationale: Diễn đạt trực tiếp động từ עבר kèm giới từ, tự nhiên trong tiếng Việt.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: miền đất nuốt chửng cư dân của nó
  rationale: Bảo tồn ẩn dụ mạnh và giọng điệu đáng sợ của אֹכֶלֶת thay vì làm nhẹ thành ‘tiêu hao’.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: những người có vóc dáng cao lớn
  rationale: Làm rõ đây là kích thước, thể chất nổi bật, tránh để ‘tầm vóc’ bị hiểu theo địa vị hoặc uy tín.
theological_decisions:
- issue: Danh xưng tập thể mang hình thức giống đực בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên / người Y-sơ-ra-ên
  rationale: ‘Con cái Y-sơ-ra-ên’ giữ được hình ảnh huyết thống và danh xưng giao ước của nguyên văn, đồng thời trong tiếng Việt có thể chỉ toàn thể cộng đồng mà không khẳng định chỉ có nam giới.
- issue: Mức độ quy kết trong דִּבָּה
  choice: một lời tường thuật xấu
  alternative: lời vu khống
  rationale: Ngữ cảnh cho thấy lời báo cáo tiêu cực và gây nản lòng, nhưng từ ngữ trong câu này không buộc bản dịch phải giải quyết dứt khoát rằng toàn bộ nội dung là lời vu khống có chủ ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Y-sơ-ra-ên’ theo lối phiên âm Kinh Thánh quen thuộc; giữ ẩn dụ ‘nuốt chửng’ và sự cường điệu trong lời của các thám tử, không giải thích hoặc sửa lời họ ngay trong chính văn.
