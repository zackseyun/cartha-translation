- from: Họ đến thung lũng Ếch-côn[a]. Tại đó, họ cắt một nhánh nho có một chùm nho; hai người trong số họ khiêng nó bằng một cây đòn[b]. Họ cũng hái một ít lựu và sung.
  to: Họ đến thung lũng Ếch-côn[a]. Tại đó, họ cắt một nhánh nho có một chùm nho; hai người trong số họ khiêng nó trên một cây đòn[b]. Họ cũng lấy một ít quả lựu và quả sung.
