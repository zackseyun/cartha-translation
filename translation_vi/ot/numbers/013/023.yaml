translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “khiêng” và “cây đòn” để tái hiện cách vận chuyển, đồng thời giữ sự mơ hồ của đại từ số ít trong chú thích.
