  text: וַ/יָּבֹ֜אוּ עַד נַ֣חַל אֶשְׁכֹּ֗ל וַ/יִּכְרְת֨וּ מִ/שָּׁ֤ם זְמוֹרָה֙ וְ/אֶשְׁכּ֤וֹל עֲנָבִים֙ אֶחָ֔ד וַ/יִּשָּׂאֻ֥/הוּ בַ/מּ֖וֹט בִּ/שְׁנָ֑יִם וּ/מִן הָ/רִמֹּנִ֖ים וּ/מִן הַ/תְּאֵנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: vi
  text: Họ đến thung lũng Ếch-côn[a]. Tại đó, họ cắt một nhánh nho có một chùm nho; hai người trong số họ khiêng nó trên một cây đòn[b]. Họ cũng lấy một ít quả lựu và quả sung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khe Ếch-côn” hoặc “suối Ếch-côn”. Từ נַחַל trong tiếng Hê-bơ-rơ có thể chỉ một khe núi, lòng suối có nước theo mùa, hoặc một thung lũng.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch cụm trước đó là: “một nhánh nho với một chùm nho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: thung lũng Ếch-côn
  rationale: נַחַל có thể chỉ khe núi, thung lũng có dòng nước theo mùa, hoặc lòng suối. “Thung lũng” tự nhiên và dễ hiểu trong tiếng Việt, còn độ rộng nghĩa được giữ trong chú thích; Ếch-côn được phiên âm như địa danh.
- source_word: זְמוֹרָה
  choice: một nhánh nho
  rationale: Từ này chỉ nhánh hoặc cành của cây nho. Nêu rõ “nhánh nho” trong tiếng Việt giúp diễn đạt chính xác mà vẫn tự nhiên.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: một chùm nho
  rationale: Cụm từ nhấn mạnh số lượng là một chùm. Tiếng Việt “một chùm nho” đã biểu đạt tự nhiên ý này mà không cần thêm “duy nhất”.
- source_word: וַיִּשָּׂאֻהוּ
  choice: khiêng nó
  rationale: Động từ mang nghĩa mang hoặc vác; trong bối cảnh có hai người và một cây đòn, “khiêng” tạo hình ảnh rõ ràng, còn đại từ số ít phản ánh hậu tố số ít của tiếng Hê-bơ-rơ.
- source_word: בַמּוֹט
  choice: bằng một cây đòn
  rationale: מוֹט là cây sào hoặc đòn dùng để mang vật. “Cây đòn” phù hợp với hành động hai người cùng khiêng.
- source_word: בִּשְׁנָיִם
  choice: hai người trong số họ
  rationale: Nguyên văn là “bởi/với hai”; ngữ cảnh cho thấy đó là hai người thuộc đoàn do thám. Cách diễn đạt này làm rõ chủ thể hàm ẩn mà không thêm giới tính ngoài văn bản.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: Họ cũng hái một ít lựu và sung
  rationale: Tiếng Hê-bơ-rơ nối thêm hai loại trái cây nhưng lược động từ. Tiếng Việt cần khôi phục hành động hàm ẩn; “hái” phù hợp với việc lấy trái tại nơi ấy, còn “một ít” diễn đạt giá trị bộ phận của מִן.
