base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: vi
  text: Xứ mà dân ấy đang cư ngụ như thế nào? Tốt hay xấu? Các thành mà họ đang ở như thế nào? Họ ở trong các trại hay trong những nơi kiên cố?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong các khu đóng trại… trong các thành lũy.” Tiếng Hê-bơ-rơ đối chiếu những khu dân cư kiểu trại với những nơi được củng cố để phòng thủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: Xứ ... như thế nào?
  rationale: Diễn đạt tự nhiên câu hỏi về đặc điểm và tình trạng của xứ; “xứ” phù hợp với bối cảnh do thám Ca-na-an.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: mà dân ấy đang cư ngụ
  rationale: Đại từ số ít trong tiếng Hê-bơ-rơ mang nghĩa tập thể, chỉ dân cư trong xứ. Tiếng Việt dùng “dân ấy” để thể hiện nghĩa tập thể rõ ràng, còn “cư ngụ” giữ sắc thái trang trọng, dễ hiểu.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: Tốt hay xấu?
  rationale: Giữ nguyên phạm vi đánh giá rộng của hai tính từ Hê-bơ-rơ, không thu hẹp thành màu mỡ hay cằn cỗi.
- source_word: הֶעָרִים
  choice: các thành
  rationale: “Thành” là cách dịch quen thuộc và phù hợp với các khu dân cư được đem đối chiếu theo mức độ phòng thủ.
- source_word: הַבְּמַחֲנִים
  choice: trong các trại
  rationale: מחנה chỉ trại hoặc khu đóng trại; cách dịch này giữ hình ảnh những nơi cư trú kiểu trại, tương phản với nơi kiên cố.
- source_word: בְּמִבְצָרִים
  choice: trong những nơi kiên cố
  rationale: מבצר chỉ nơi được củng cố để phòng thủ, thành lũy hoặc cứ điểm; “những nơi kiên cố” tự nhiên và không xác định quá hẹp loại công trình.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dân ấy” rồi chuyển sang đại từ số nhiều “họ” theo cách nói tự nhiên của tiếng Việt để biểu đạt danh từ tập thể trong nguyên văn; giữ câu hỏi ngắn và trực tiếp.
