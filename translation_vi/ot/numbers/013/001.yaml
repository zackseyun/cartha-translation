  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong công thức mở đầu lời thần phán được dịch là “phán”, cách diễn đạt tự nhiên và trang trọng trong tiếng Việt khi Đức Chúa Trời nói, đồng thời vẫn phân biệt với אמר ở vế sau.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu tiếng Việt “phán với”, từ này biểu thị người tiếp nhận lời nói một cách tự nhiên.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn nhập lời nói, “rằng” chuyển tải tự nhiên chức năng của nguyên mẫu לֵאמֹר và chuẩn bị cho nội dung trực tiếp theo sau.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự YHWH; giữ “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu hay áp đặt cách phát âm truyền thống khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán với… rằng” phù hợp công thức dẫn nhập lời Đức Chúa Trời trong tiếng Việt; dấu hai chấm báo hiệu lời phán tiếp nối ở câu sau.
