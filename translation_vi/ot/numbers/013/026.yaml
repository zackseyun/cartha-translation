  text: וַ/יֵּלְכ֡וּ וַ/יָּבֹאוּ֩ אֶל מֹשֶׁ֨ה וְ/אֶֽל אַהֲרֹ֜ן וְ/אֶל כָּל עֲדַ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל אֶל מִדְבַּ֥ר פָּארָ֖ן קָדֵ֑שָׁ/ה וַ/יָּשִׁ֨יבוּ אוֹתָ֤/ם דָּבָר֙ וְ/אֶת כָּל הָ֣/עֵדָ֔ה וַ/יַּרְא֖וּ/ם אֶת פְּרִ֥י הָ/אָֽרֶץ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: vi
  text: Họ trở về, đến gặp Môi-se, A-rôn và toàn thể cộng đồng người Y-sơ-ra-ên[a] trong hoang mạc Pha-ran, tại Ca-đe. Họ trình báo cho hai ông và toàn thể cộng đồng, rồi cho họ xem hoa trái của xứ ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cộng đồng các con trai của Y-sơ-ra-ên”, một cách gọi cộng đồng/dân Y-sơ-ra-ên.'
    reason: Bảo lưu cách diễn đạt đen của cụm từ Hê-bơ-rơ בְּנֵי יִשְׂרָאֵל, đồng thời làm rõ nghĩa thành ngữ trong tiếng Việt.
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Họ đi về, đến gặp
  rationale: Giữ lại hai động từ nối tiếp diễn tả hành trình và sự đến nơi, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt theo bối cảnh các trinh sát trở về.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toàn thể cộng đồng con dân Y-sơ-ra-ên
  rationale: “Cộng đồng” diễn đạt עֵדָה, còn “con dân Y-sơ-ra-ên” chuyển tải thành ngữ chỉ dân Y-sơ-ra-ên mà không khiến độc giả hiểu rằng chỉ có nam giới.
- source_word: מִדְבַּר פָּארָן קָדֵשָׁה
  choice: ở Ca-đe, trong hoang mạc Pha-ran
  rationale: Thể hiện Ca-đe là nơi họ đến và đặt địa danh ấy trong hoang mạc Pha-ran; cách sắp xếp này tự nhiên trong tiếng Việt mà vẫn giữ quan hệ địa lý của tiếng Hê-bơ-rơ.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: Họ báo lại mọi việc cho hai ông
  rationale: Động từ và danh từ דָּבָר tạo thành ý báo tin hoặc trình báo. “Mọi việc” phù hợp ngữ cảnh bản tường trình, còn “hai ông” làm rõ đại từ chỉ Môi-se và A-rôn.
- source_word: וַיַּרְאוּם אֶת פְּרִי הָאָרֶץ
  choice: cho họ xem hoa trái của xứ ấy
  rationale: Dạng Hiphil của ראה mang nghĩa “cho xem”; “hoa trái của xứ ấy” giữ hình ảnh cụ thể của פְּרִי הָאָרֶץ và liên kết tự nhiên với vùng đất vừa được thám sát.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên đối với độc giả Việt Nam hiện đại. Tên riêng được phiên âm theo lối quen dùng trong các bản Kinh Thánh tiếng Việt; nhịp câu giữ trình tự hành trình, trình báo và trưng ra hoa trái.
