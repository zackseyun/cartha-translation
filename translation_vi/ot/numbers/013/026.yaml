  to: Họ trở về, đến gặp Môi-se, A-rôn và toàn thể cộng đồng người Y-sơ-ra-ên[a] trong hoang mạc Pha-ran, tại Ca-đe. Họ trình báo cho hai ông và toàn thể cộng đồng, rồi cho họ xem hoa trái của xứ ấy.
