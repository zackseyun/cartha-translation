source:
  edition: WLC
  text: לַ/מָּק֣וֹם הַ/ה֔וּא קָרָ֖א נַ֣חַל אֶשְׁכּ֑וֹל עַ֚ל אֹד֣וֹת הָֽ/אֶשְׁכּ֔וֹל אֲשֶׁר כָּרְת֥וּ מִ/שָּׁ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: vi
  text: Nơi ấy được gọi là Thung lũng Ếch-côn[a], vì chùm nho mà con cháu Y-sơ-ra-ên đã cắt từ đó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Khe Ếch-côn,” “Lòng suối Ếch-côn” hoặc “Thung lũng suối Ếch-côn.” Từ Hê-bơ-rơ naḥal có thể chỉ một lòng suối theo mùa, khe núi, hoặc thung lũng gắn với nó. Tên Ếch-côn nghe giống từ Hê-bơ-rơ có nghĩa là “chùm.”
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Theo chữ: “các con trai của Y-sơ-ra-ên”; cũng có thể dịch là “dân Y-sơ-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: Nơi ấy
  rationale: Giữ sắc thái chỉ định của cụm từ Hê-bơ-rơ, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: קָרָא
  choice: được gọi là
  rationale: Dạng Hê-bơ-rơ là động từ chủ động ngôi thứ ba số ít với chủ thể không nêu; cách bị động diễn đạt tự nhiên chức năng đặt tên trong tiếng Việt.
- source_word: נַחַל
  choice: Thung lũng
  rationale: נַחַל có thể chỉ khe, lòng suối theo mùa, hoặc thung lũng gắn với nó. “Thung lũng” là cách gọi địa hình rõ ràng, tự nhiên ở đây; các nghĩa khác được ghi chú.
- source_word: אֶשְׁכּוֹל
  choice: Ếch-côn
  rationale: Trong cụm địa danh, từ này được dùng như tên riêng nên được phiên âm; lối chơi chữ với danh từ “chùm” được giải thích trong chú thích.
- source_word: עַל אֹדוֹת
  choice: vì
  rationale: Diễn đạt trực tiếp quan hệ nguyên nhân của việc đặt tên.
- source_word: הָאֶשְׁכּוֹל
  choice: chùm nho
  rationale: Danh từ tự nó có nghĩa “chùm”; văn cảnh ngay trước xác định đó là chùm nho. Thêm “nho” giúp tiếng Việt rõ và tự nhiên mà không thay đổi nghĩa theo văn cảnh.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: mà ... đã cắt
  rationale: Giữ nghĩa cơ bản của כרת là “cắt”; “đã” biểu thị hành động xảy ra trước việc đặt tên.
- source_word: מִשָּׁם
  choice: tại đó
  rationale: Trong tiếng Việt, “cắt tại đó” tự nhiên hơn “cắt từ đó” khi nói nơi chùm nho được cắt, trong khi vẫn giữ quy chiếu địa điểm.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  rationale: Đây là thành ngữ dân tộc-giao ước, theo nghĩa đen là “các con trai của Y-sơ-ra-ên.” “Con cháu Y-sơ-ra-ên” giữ hình ảnh dòng dõi và tự nhiên hơn trong tiếng Việt; nghĩa theo chữ được ghi chú.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo chữ là “các con trai của Y-sơ-ra-ên” nhưng thường dùng như tên gọi cộng đồng dân tộc. “Con cháu” bảo tồn ý niệm dòng dõi mà không làm câu tiếng Việt mang nghĩa chỉ những người con trai trực hệ; chú thích giữ cách hiểu sát chữ.
- issue: Quan hệ giữa địa danh אֶשְׁכּוֹל và danh từ הָאֶשְׁכּוֹל
  choice: phiên âm địa danh và giải thích lối chơi chữ
  alternative: dịch địa danh là “Thung lũng Chùm Nho”
  rationale: Bản văn tạo liên hệ từ nguyên giữa tên riêng và “chùm.” Phiên âm tên riêng tránh biến phần giải thích đặt tên thành sự lặp thừa, còn chú thích bảo tồn liên hệ ngôn ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Dùng “Nơi ấy” thay vì lối cổ “nơi đó bèn được gọi”; giữ địa danh phiên âm theo truyền thống tiếng Việt, đồng thời dùng chú thích để bảo tồn độ rộng nghĩa địa hình và lối chơi chữ Hê-bơ-rơ.
