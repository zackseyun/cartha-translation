  text: לְ/מַטֵּ֥ה אֶפְרָ֖יִם הוֹשֵׁ֥עַ בִּן נֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/008.yaml
  text: from the tribe of Ephraim[a], Hoshea son of Nun[b];
translation:
  language: vi
  text: 'thuộc chi phái Ép-ra-im: Hô-sê, con trai Nun;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: thuộc chi phái
  rationale: Trong danh sách các đại diện của từng chi phái, giới từ לְ kết hợp với מַטֶּה biểu thị sự liên thuộc. “Thuộc chi phái” tự nhiên trong tiếng Việt và giữ được cấu trúc ngắn gọn của danh sách.
- source_word: אֶפְרָיִם
  choice: Ép-ra-im
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: הוֹשֵׁעַ
  choice: Hô-sê
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ; đây là tên trước đây của người sau được Môi-se gọi là Giô-suê (Dân Số 13:16). Trong tiếng Việt, không cần tạo một dạng chính tả riêng chỉ để phân biệt với nhà tiên tri cùng tên.
- source_word: בִּן
  choice: con trai
  rationale: Diễn đạt rõ quan hệ phụ tử trong cấu trúc gia phả và danh sách.
- source_word: נוּן
  choice: Nun
  rationale: Phiên âm tên riêng; giữ dạng Nun quen thuộc và gần với âm Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và cô đọng, phù hợp với cấu trúc liệt kê của phân đoạn. Không đưa các chú thích tiếng Anh vào vì chú thích [a] gắn nhầm sau tên chi phái trong văn bản chính, còn chú thích [b] chỉ giải thích một vấn đề chính tả riêng của tiếng Anh.
