  text: לְ/מַטֵּ֣ה יִשָּׂשכָ֔ר יִגְאָ֖ל בֶּן יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/007.yaml
  text: from the tribe of Issachar, Igal son of Joseph;
translation:
  language: vi
  text: thuộc bộ tộc Y-sa-ca, Y-ganh, con trai Giô-sép;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: thuộc bộ tộc
  rationale: Trong danh sách các đại diện bộ tộc, giới từ לְ đi với מַטֶּה nêu bộ tộc mà người được kể tên đại diện. “Thuộc bộ tộc” tự nhiên trong tiếng Việt và giữ được ý liên hệ, không buộc phải hiểu theo nghĩa xuất thân địa lý.
- source_word: יִשָּׂשכָר
  choice: Y-sa-ca
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt cho tên bộ tộc Issachar.
- source_word: יִגְאָל
  choice: Y-ganh
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt, thể hiện gần âm của יִגְאָל và phân biệt với các tên khác.
- source_word: בֶּן
  choice: con trai
  rationale: Trong công thức định danh gia phả בֶּן יוֹסֵף, nghĩa trực tiếp là “con trai của”; tiếng Việt có thể lược “của” một cách tự nhiên trước tên người cha.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên Joseph quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
