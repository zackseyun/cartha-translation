source:
  edition: WLC
  text: וְ/הָ֨/אֲנָשִׁ֜ים אֲשֶׁר עָל֤וּ עִמּ/וֹ֙ אָֽמְר֔וּ לֹ֥א נוּכַ֖ל לַ/עֲל֣וֹת אֶל הָ/עָ֑ם כִּֽי חָזָ֥ק ה֖וּא מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: vi
  text: 'Nhưng những người đã cùng ông đi lên nói: “Chúng ta không thể tiến lên chống lại dân ấy[a], vì họ mạnh hơn chúng ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “đi lên đến dân ấy”; trong ngữ cảnh, cụm này chỉ việc tiến lên đối đầu với họ.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng đại từ số ít cho danh từ tập hợp “dân”; tiếng Việt dùng “họ” theo nghĩa tập hợp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Nhưng những người
  rationale: Liên từ וְ trong mạch văn tạo thế tương phản với lời của Ca-lép ở câu trước; “nhưng” diễn đạt tự nhiên chức năng diễn ngôn ấy. “Những người” giữ nghĩa cụ thể của אֲנָשִׁים mà không cần thêm “đàn ông” khi giới tính không phải trọng tâm.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: đã cùng ông đi lên
  rationale: Mệnh đề quan hệ xác định những người đã đi cùng Ca-lép. “Đã” làm rõ hành động xảy ra trước lời nói, còn “đi lên” giữ hình ảnh của động từ עלה.
- source_word: אָמְרוּ
  choice: nói
  rationale: Dạng qatal trong lời kể được chuyển bằng động từ tường thuật quá khứ theo cách tự nhiên của tiếng Việt; thời gian đã được ngữ cảnh xác định nên không cần thêm “đã”.
- source_word: לֹא נוּכַל
  choice: Chúng ta không thể
  rationale: Diễn đạt trực tiếp ý không có khả năng của יכל, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: tiến lên chống lại dân ấy
  rationale: עלה có nghĩa cơ bản là “đi lên”, nhưng trong bối cảnh đối đầu quân sự, “tiến lên” tự nhiên hơn; אֶל theo ngữ cảnh mang hướng đối địch, nên dịch “chống lại”. “Dân ấy” chỉ nhóm cư dân vừa được nhắc đến.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho lời khẳng định rằng họ không thể tiến lên.
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: họ mạnh hơn chúng ta
  rationale: חָזָק diễn tả sức mạnh, còn מִן mang nghĩa so sánh “hơn”. Đại từ số ít הוּא hòa hợp với danh từ tập hợp הָעָם; tiếng Việt tự nhiên dùng “họ” để chỉ những người thuộc dân ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ động tác “đi lên/tiến lên” của nguyên văn, đồng thời biểu đạt rõ sắc thái quân sự qua “chống lại”. Đại từ “ông” chỉ Ca-lép theo ngữ cảnh trước đó nhưng không đưa tên riêng vào câu.
