  source_fidelity: 'Bản dịch truyền đạt đúng mệnh lệnh khảo sát, câu hỏi về đặc tính của xứ, và hai đối lập về dân cư: mạnh/yếu, ít/đông. Tuy nhiên, với dân cư của một xứ, tiếng Việt hiện đại tự nhiên hơn khi nói họ cư ngụ “trong đó” thay vì “trên đó”; sự điều chỉnh này vẫn phản ánh nghĩa cư trú của יֹשֵׁב mà không làm thay đổi ý nghĩa.'
