  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: vi
  text: Hãy xem xứ ấy thế nào, và dân đang cư ngụ trong đó mạnh hay yếu, ít hay đông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Hãy xem
  rationale: Động từ ראה ở đây mang sức của lời chỉ dẫn trong chuỗi mệnh lệnh Môi-se giao cho những người đi do thám. “Hãy xem” tự nhiên, rõ ràng và không diễn giải quá mức.
- source_word: הָאָרֶץ מַה הִוא
  choice: xứ ấy thế nào
  rationale: Cụm từ hỏi về đặc điểm hoặc tình trạng của xứ, không chỉ về căn tính. “Xứ ấy thế nào” giữ được cách diễn đạt rộng và tự nhiên của tiếng Hê-bơ-rơ.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: dân đang cư ngụ trên đó
  rationale: יֹשֵׁב diễn tả việc cư trú, còn עָלֶיהָ theo sát hình ảnh “trên xứ ấy”. Tiếng Việt có thể dùng “cư ngụ trên đó” một cách tự nhiên, trang trọng vừa phải và gần cấu trúc nguồn.
- source_word: הֶחָזָק ... הֲרָפֶה
  choice: mạnh hay yếu
  rationale: Hai từ tạo thành cặp đối lập trực tiếp về sức mạnh; cách dịch ngắn gọn này giữ nguyên phép tương phản.
- source_word: הַמְעַט ... רָב
  choice: ít hay đông
  rationale: Trong ngữ cảnh nói về dân cư, “ít hay đông” là cách nói tự nhiên, giữ đúng sự tương phản về số lượng.
- source_word: אִם
  choice: hay
  rationale: Trong câu hỏi gián tiếp gồm các cặp lựa chọn, tiếng Việt tự nhiên dùng “hay” để nối hai khả năng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xứ” phù hợp ngữ cảnh địa lý Kinh Thánh; “cư ngụ” diễn đạt sự định cư mà không quá cổ. Không cần chú thích vì các nét nghĩa quan trọng của nguyên văn đều có thể thể hiện trực tiếp, tự nhiên trong tiếng Việt.
