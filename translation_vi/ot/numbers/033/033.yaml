base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/033.yaml
  text: They set out from Hor-haggidgad and camped at Jotbathah.
translation:
  language: vi
  text: Họ rời Hô-rơ Ha-ghít-gát và đóng trại tại Giốt-ba-tha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc rời một chặng để lên đường; “rời” tự nhiên, gọn và phù hợp với địa danh đi sau giới từ “từ” trong nguyên văn.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: Hô Ha-ghít-gát
  rationale: Địa danh được phiên âm sang tiếng Việt; giới từ מִן được diễn đạt trong động từ “rời”, nên không cần thêm “từ”.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong danh sách hành trình có nghĩa là dừng lại và dựng trại; “đóng trại” là cách nói hiện đại, rõ nghĩa.
- source_word: בְּיָטְבָתָה
  choice: tại Giốt-ba-tha
  rationale: Giới từ בְּ mang nghĩa chỉ địa điểm; “tại” phù hợp với một trạm dừng mang địa danh, còn tên riêng được phiên âm sang tiếng Việt.
