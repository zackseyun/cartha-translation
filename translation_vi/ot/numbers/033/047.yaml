base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: vi
  text: Họ rời An-môn Đíp-la-tha-im và đóng trại trong vùng núi A-ba-rim, đối diện Nê-bô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trước mặt Nê-bô” hoặc “ở phía trước Nê-bô.” Giới từ Hê-bơ-rơ diễn tả quan hệ không gian nhưng không xác định sắc thái chính xác.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình của Dân Số 33, động từ נסע chỉ việc nhổ trại và lên đường. “Rời” tự nhiên, ngắn gọn và phù hợp khi đi với địa danh xuất phát.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: An-môn Đíp-la-tha-im
  rationale: Đây là địa danh nên được phiên âm thay vì dịch nghĩa; cách viết có gạch nối giúp người đọc nhận ra các thành tố của tên gọi.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong công thức hành trình có nghĩa là dựng hoặc đóng trại. “Đóng trại” là cách nói hiện đại, rõ ràng.
- source_word: בְּהָרֵי
  choice: trong vùng núi
  rationale: Danh từ số nhiều dạng liên kết của הַר chỉ các núi hoặc miền núi. “Trong vùng núi” diễn đạt tự nhiên việc trú đóng trong một khu vực địa hình mà không buộc phải hiểu là ở ngay trên đỉnh hay sườn một ngọn núi.
- source_word: הָעֲבָרִים
  choice: A-ba-rim
  rationale: Trong ngữ cảnh này, từ này hoạt động như tên riêng địa lý, nên được phiên âm chứ không dịch theo nghĩa từ nguyên.
- source_word: לִפְנֵי
  choice: đối diện
  rationale: Giới từ này biểu thị quan hệ không gian ở phía trước hoặc đối diện. “Đối diện” tự nhiên trong tiếng Việt, nhưng không xác định chính xác phương hướng; các khả năng khác được giữ trong chú thích.
- source_word: נְבוֹ
  choice: Nê-bô
  rationale: Đây là địa danh nên được phiên âm; câu không nói rõ hơn đó là núi, thành hay toàn khu vực, vì vậy bản dịch không thêm loại địa hình.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Duy trì nhịp công thức của danh sách hành trình; phiên âm các địa danh theo lối Việt hóa, đồng thời giữ sự không xác định của giới từ לִפְנֵי bằng chú thích.
