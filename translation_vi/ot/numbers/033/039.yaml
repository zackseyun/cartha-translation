  text: And Aaron was one hundred twenty-three years old when he died on Mount Hor.
translation:
  language: vi
  text: A-rôn qua đời trên núi Hô-rơ lúc một trăm hai mươi ba tuổi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: A-rôn
  rationale: Tên riêng được phiên âm theo cách quen thuộc trong tiếng Việt; liên từ וְ chỉ tiếp nối mạch kể và có thể không biểu đạt riêng để câu tự nhiên.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: hưởng thọ một trăm hai mươi ba tuổi
  rationale: Cấu trúc בן + số + שנה chỉ tuổi. Trong ngữ cảnh nói về tuổi lúc qua đời, “hưởng thọ ... tuổi” là cách diễn đạt tiếng Việt tự nhiên, trang trọng và truyền đạt đúng con số 123.
- source_word: בְּ/מֹת/וֹ
  choice: khi ông qua đời
  rationale: Giới từ בְּ với danh từ động tác “chết” và hậu tố ngôi ba mang nghĩa thời gian; “khi ông qua đời” vừa rõ nghĩa vừa giữ sắc thái trang trọng.
- source_word: בְּ/הֹר הָ/הָר
  choice: trên núi Hô-rơ
  rationale: הֹר הָהָר là địa danh Núi Hô-rơ; “trên” phù hợp với vị trí xảy ra sự việc trên núi.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hưởng thọ” để diễn đạt tự nhiên tuổi của A-rôn vào lúc qua đời; tên riêng được phiên âm có gạch nối theo thông lệ Kinh Thánh tiếng Việt.
