  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: vi
  text: Họ rời Ca-đe[a] và đóng trại tại núi Hô-rơ[b], ở rìa xứ Ê-đôm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ ghi “Ca-đe”; dựa vào văn mạch rộng hơn, một số bản dịch gọi là “Ca-đe Ba-nê-a”, nhưng tên địa điểm trong câu này chỉ có dạng ngắn.
    reason: alternative_reading
  - marker: b
    text: 'Hê-bơ-rơ sát chữ: “tại Hô-rơ, ngọn núi”; theo cách gọi thông dụng: “núi Hô-rơ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và khởi hành khỏi một địa điểm; “rời” tự nhiên, ngắn gọn và phù hợp với mốc xuất phát có giới từ מִן.
- source_word: מִקָּדֵשׁ
  choice: Ca-đe
  rationale: Bản Hê-bơ-rơ tại đây chỉ ghi קָדֵשׁ, vì vậy giữ địa danh ngắn, không tự ý mở rộng thành Ca-đe Ba-nê-a.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה là từ quen dùng cho việc dừng lại lập trại trong các chặng hành trình; “đóng trại” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּהֹר הָהָר
  choice: tại núi Hô-rơ
  rationale: Cụm Hê-bơ-rơ có nghĩa sát chữ là “tại Hô-rơ, ngọn núi”; “núi Hô-rơ” là cách gọi địa danh tự nhiên trong tiếng Việt, đồng thời chú thích lưu lại cấu trúc nguyên văn.
- source_word: בִּקְצֵה
  choice: ở rìa
  rationale: קָצֶה có thể chỉ đầu mút, rìa hoặc phần tận cùng. “Ở rìa” giữ nghĩa không gian mà không xác định quá mức đây là một đường biên giới chính trị.
- source_word: אֶרֶץ אֱדוֹם
  choice: xứ Ê-đôm
  rationale: אֶרֶץ ở đây chỉ miền đất hay lãnh thổ của Ê-đôm; “xứ Ê-đôm” là cách diễn đạt gọn, trang trọng và quen thuộc trong văn thuật chuyện Kinh Thánh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dạng phiên âm địa danh quen thuộc trong tiếng Việt. Các dấu chú thích đều xuất hiện trong chính văn; [b] đặt ngay sau “núi Hô-rơ”, còn [a] đặt cuối câu để chú giải địa danh Ca-đe mà không làm câu bị nặng.
