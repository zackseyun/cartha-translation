base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: vi
  text: Họ rời khỏi hoang mạc Sin và đóng trại tại Đốp-ca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sin” ở đây là tên một vùng hoang mạc.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và lên đường. “Rời” diễn đạt tự nhiên, gọn rõ sự chuyển đi từ địa điểm trước.
- source_word: מִמִּדְבַּר
  choice: hoang mạc
  rationale: מִדְבָּר chỉ vùng đất hoang vu, khô cằn. “Hoang mạc” phù hợp với địa danh và văn phong hành trình trong Ngũ Kinh.
- source_word: סִין
  choice: Sin
  rationale: Đây là tên riêng của một vùng hoang mạc nên được phiên âm, không dịch theo bất kỳ từ đồng âm nào trong ngôn ngữ đích.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה là từ thông dụng trong các chặng hành trình, chỉ việc dừng lại và dựng trại. “Đóng trại” tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּדָפְקָה
  choice: tại Đốp-ca
  rationale: Giới từ בְּ đánh dấu địa điểm; “tại” phù hợp với tên một nơi dừng chân. Tên דָּפְקָה được phiên âm là “Đốp-ca” để người Việt dễ đọc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu; giữ cấu trúc ngắn gọn của danh sách các chặng hành trình. Dùng cách phiên âm tên riêng quen với chính tả tiếng Việt.
