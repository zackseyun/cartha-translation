  text: וַ/יִּסְע֖וּ מֵ/רִסָּ֑ה וַֽ/יַּחֲנ֖וּ בִּ/קְהֵלָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/022.yaml
  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: vi
  text: Họ rời Rít-sa và đóng trại tại Kê-hê-la-tha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại, rời một chặng để đi tiếp. “Rời” tự nhiên, ngắn gọn và phù hợp với cấu trúc có địa điểm theo sau.
- source_word: מֵרִסָּה
  choice: Rít-sa
  rationale: Danh từ riêng רִסָּה đi với giới từ מֵ־, nghĩa là “khỏi/từ”. Tên địa danh được phiên âm sang tiếng Việt thay vì dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong danh sách hành trình nói đến việc dừng lại và lập trại. “Đóng trại” là cách diễn đạt hiện đại, rõ nghĩa và cụ thể.
- source_word: בִּקְהֵלָתָה
  choice: tại Kê-hê-la-tha
  rationale: Danh từ riêng קְהֵלָתָה có giới từ בְּ־. “Tại” diễn đạt tự nhiên địa điểm của một chặng dừng; tên được phiên âm sang tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nguyên công thức hành trình súc tích của nguyên văn; dùng hệ thống phiên âm địa danh có dấu và gạch nối để người Việt dễ đọc.
