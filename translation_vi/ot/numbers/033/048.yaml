source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵ/הָרֵ֣י הָ/עֲבָרִ֑ים וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: vi
  text: Họ rời dãy núi A-ba-rim và đóng trại tại đồng bằng Mô-áp, bên sông Giô-đanh, gần Giê-ri-cô.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tại vùng thảo nguyên Mô-áp.” Từ Hê-bơ-rơ có thể chỉ vùng thảo nguyên hoặc đồng bằng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bên sông Giô-đanh, đối diện Giê-ri-cô.” Cụm từ cuối câu có thể được hiểu cụ thể hơn là khu vực bên kia sông, đối diện thành Giê-ri-cô.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong các chặng hành trình, động từ נסע chỉ việc nhổ trại và lên đường. “Rời” diễn đạt tự nhiên sự chuyển đi khỏi địa điểm vừa nêu.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: dãy núi A-ba-rim
  rationale: הָרֵי là dạng số nhiều liên kết của “núi/đồi”; trong ngữ cảnh địa lý, “dãy núi” tự nhiên và cho thấy đây là vùng núi mang tên A-ba-rim.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: חנה trong công thức hành trình nghĩa là dựng hoặc đóng trại; cách nói này hiện đại, rõ ràng và trung thành với hành động được mô tả.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: tại đồng bằng Mô-áp
  rationale: עַרְבֹת có thể chỉ vùng đồng bằng hoặc thảo nguyên khô; “đồng bằng” là cách gọi địa hình dễ hiểu, còn nghĩa gần “thảo nguyên” được giữ trong chú thích.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: bên sông Giô-đanh, gần Giê-ri-cô
  rationale: עַל với tên sông có nghĩa “bên/dọc theo.” Cụm יַרְדֵּן יְרֵחוֹ liên hệ đoạn sông với khu vực Giê-ri-cô nhưng không có từ riêng mang nghĩa “đối diện,” nên bản chính dùng “gần” và giữ khả năng “đối diện” trong chú thích.
