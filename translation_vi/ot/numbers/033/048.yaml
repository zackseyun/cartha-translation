  terminology: Các tên riêng A-ba-rim, Mô-áp, Giô-đanh và Giê-ri-cô được xử lý nhất quán. “Đồng bằng” là lựa chọn chính thích hợp cho עַרְבֹת; chú thích bảo lưu phương án “thảo nguyên.” Chú thích thứ hai cũng bảo lưu cách hiểu “đối diện Giê-ri-cô” mà không biến nó thành khẳng định chính văn.
