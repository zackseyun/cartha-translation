  source_fidelity: 'Bản dịch phản ánh đúng chuỗi hành trình của tiếng Hê-bơ-rơ: họ rời khỏi núi A-ba-rim, đóng trại tại עַרְבֹת מוֹאָב, bên sông Giô-đanh thuộc khu vực Giê-ri-cô. “Rời,” “đóng trại,” “đồng bằng,” và “bên sông” đều phù hợp với ngữ cảnh công thức hành trình. “Gần Giê-ri-cô” diễn đạt dè dặt và tự nhiên cho liên hệ địa lý trong cụm יַרְדֵּן יְרֵחוֹ, không ép nghĩa “đối diện” vào bản văn chính.'
