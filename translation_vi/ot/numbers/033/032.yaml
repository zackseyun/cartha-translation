  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: vi
  text: Họ rời Bê-nê-Gia-a-can và đóng trại tại Hô-rơ-Ha-ghít-gát.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hê-bơ-rơ Bê-nê-Gia-a-can có lẽ là một địa danh, dù nghĩa đen của tên này là “các con trai của Gia-a-can”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc rời một chặng để lên đường; “rời” tự nhiên, ngắn gọn và phù hợp với chuỗi địa danh.
- source_word: מִבְּנֵי יַעֲקָן
  choice: Bê-nê Gia-a-can
  rationale: Cụm này đóng vai trò địa danh trong bản liệt kê hành trình, nên phiên âm thay vì dịch nghĩa đen là “các con trai của Gia-a-can”; cách phiên âm cũng giữ được mối liên hệ với tên Hê-bơ-rơ.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה thuộc công thức chỉ việc dừng lại lập trại; “đóng trại” là cách nói hiện đại, rõ ràng và tự nhiên.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: tại Hô Ha-ghít-gát
  rationale: Đây là địa danh nên được phiên âm; giới từ בְּ chỉ địa điểm được dịch là “tại”, còn yếu tố mạo từ trong הַגִּדְגָּד được phản ánh bằng “Ha-” trong tên ghép.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ công thức hành trình ngắn gọn; các địa danh được phiên âm nhất quán theo âm gần với nguyên ngữ. Dấu chú thích [a] xuất hiện trong chính văn.
