  yaml_path: translation/ot/numbers/033/024.yaml
  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: vi
  text: Họ rời núi Sa-phe và đóng trại tại Ha-ra-đa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại, lên đường khỏi một địa điểm; “rời” tự nhiên và chính xác khi đi với nơi xuất phát.
- source_word: מֵהַר
  choice: núi
  rationale: Giới từ מִן kết hợp với הַר mang nghĩa “từ núi”; trong tiếng Việt, tên địa điểm đứng sau “núi” không cần thêm từ nối.
- source_word: שָׁפֶר
  choice: Sê-phe
  rationale: Đây là địa danh nên được phiên âm, không dịch nghĩa; cách viết phản ánh gần đúng âm Hê-bơ-rơ šāpher theo lối phiên âm tên riêng dễ đọc trong tiếng Việt.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong các bản kê hành trình nói đến việc dừng lại và dựng trại; “đóng trại” là cách diễn đạt hiện đại, rõ nghĩa.
- source_word: בַּחֲרָדָה
  choice: tại Ha-ra-đa
  rationale: Giới từ בְּ trước địa danh chỉ nơi đoàn dân dừng chân; “tại” phù hợp với văn phong tường thuật hành trình. Ha-ra-đa được phiên âm như một địa danh.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và giữ cấu trúc ngắn gọn, lặp nhịp của danh sách hành trình. Các địa danh được phiên âm theo âm Hê-bơ-rơ thay vì dựa trên biến thể chính tả tiếng Anh; vì vậy không cần chú thích biến thể “Shapher”, vốn chỉ là phương án Latinh hóa trong tiếng Anh.
