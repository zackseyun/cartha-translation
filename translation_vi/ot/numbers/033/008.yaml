  text: וַ/יִּסְעוּ֙ מִ/פְּנֵ֣י הַֽ/חִירֹ֔ת וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֨לְכ֜וּ דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בְּ/מִדְבַּ֣ר אֵתָ֔ם וַֽ/יַּחֲנ֖וּ בְּ/מָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: vi
  text: Họ lên đường từ trước Ha-hi-rốt[a], đi qua giữa lòng biển vào hoang mạc, rồi đi một chặng đường ba ngày[b] trong hoang mạc Ê-tham và đóng trại tại Ma-ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “từ trước Ha-hi-rốt.” Sách Xuất Hành thường gọi địa điểm này là “Pi-ha-hi-rốt”; ở đây, Dân Số 33:8 không có thành tố “Pi”, nên giữ tên ngắn thay vì đồng nhất hóa.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “rồi họ đi ba ngày đường trong hoang mạc Ê-tham.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong văn cảnh hành trình, נסע chỉ việc nhổ trại và lên đường; “rời” tự nhiên trong tiếng Việt và phù hợp với điểm xuất phát được nêu ngay sau đó.
- source_word: מִפְּנֵי הַחִירֹת
  choice: nơi đối diện Ha-hi-rốt
  rationale: מִפְּנֵי theo nghĩa sát là “từ trước mặt/đối diện”; thêm “nơi” giúp câu tiếng Việt tự nhiên. Bản Hê-bơ-rơ tại đây chỉ có הַחִירֹת, không có thành tố פי như trong Xuất Hành, nên giữ dạng tên ngắn Ha-hi-rốt.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: đi xuyên qua giữa biển
  rationale: עבר diễn tả việc đi qua, còn בְתוֹךְ nhấn mạnh vị trí giữa biển; cách dịch này giữ hình ảnh cụ thể của nguyên văn.
- source_word: הַמִּדְבָּרָה
  choice: vào hoang mạc
  rationale: Hậu tố chỉ hướng -ה diễn tả chuyển động hướng tới hoặc đi vào hoang mạc; “vào” chuyển tải rõ sắc thái ấy.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: đi một chặng đường ba ngày
  rationale: Cấu trúc Hê-bơ-rơ nói đến một quãng hành trình được tính bằng ba ngày. “Một chặng đường ba ngày” vừa giữ thành tố דֶּרֶךְ vừa tự nhiên, đồng thời không buộc phải hiểu tuyệt đối là họ đi liên tục đúng ba ngày.
- source_word: בְּמִדְבַּר אֵתָם
  choice: trong hoang mạc Ê-tham
  rationale: Đây là chuỗi liên kết với địa danh Ê-tham; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: đóng trại tại Ma-ra
  rationale: חנה trong danh sách hành trình có nghĩa là dựng hoặc đóng trại; “tại” phù hợp với một địa điểm dừng chân có tên riêng.
