revisions:
- from: Họ rời nơi đối diện Ha-hi-rốt[a], đi xuyên qua giữa biển vào hoang mạc, rồi đi một chặng đường ba ngày[b] trong hoang mạc Ê-tham và đóng trại tại Ma-ra.
  to: Họ lên đường từ trước Ha-hi-rốt[a], đi qua giữa lòng biển vào hoang mạc, rồi đi một chặng đường ba ngày[b] trong hoang mạc Ê-tham và đóng trại tại Ma-ra.
  rationale: Chỉnh hai chỗ để tăng độ rõ nghĩa và tự nhiên mà không hài hòa hóa địa danh với Xuất Hành hay thêm diễn giải lịch sử. Các chú thích vẫn giữ sự khác biệt văn bản về Ha-hi-rốt và phương án dịch cho cách nói «ba ngày đường».
  reviewer_model: gpt-5.6-terra
