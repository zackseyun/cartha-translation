base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/043.yaml
  text: They set out from Punon and camped at Oboth.
translation:
  language: vi
  text: Họ rời Phu-nôn và đóng trại tại Ô-bốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình qua hoang mạc, động từ נסע chỉ việc nhổ trại để lên đường. “Rời” diễn đạt tự nhiên trong tiếng Việt khi đi với địa điểm xuất phát được nêu ngay sau đó.
- source_word: מִפּוּנֹן
  choice: Phu-nôn
  rationale: Tiền tố מִן đánh dấu nơi xuất phát; ý “khỏi/từ” được diễn đạt tự nhiên bằng cấu trúc “rời Phu-nôn”. Địa danh được phiên âm sang tiếng Việt.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong các danh sách hành trình có nghĩa là dựng hoặc đóng trại. “Đóng trại” là cách nói hiện đại, rõ ràng và trang trọng vừa phải.
- source_word: בְּאֹבֹת
  choice: tại Ô-bốt
  rationale: Giới từ בְּ trước địa điểm dừng chân được chuyển là “tại”. Ô-bốt là địa danh nên được phiên âm, không dịch nghĩa.
