revisions:
- from: Các ngươi phải đuổi hết mọi cư dân trong xứ ra khỏi trước mặt mình; phải phá hủy mọi đá chạm hình của họ[a], tiêu hủy mọi tượng đúc bằng kim loại của họ[b], và triệt phá mọi nơi thờ tự trên cao của họ.
  to: Các ngươi phải đuổi hết mọi cư dân trong xứ khỏi trước mặt các ngươi; phải phá hủy mọi vật có chạm hình của họ[a], tiêu hủy mọi tượng đúc bằng kim loại của họ[b], và triệt phá mọi nơi thờ tự trên cao của họ.
  rationale: Sửa cụm chỉ מַשְׂכִּיּוֹת thành “vật có chạm hình” để không khẳng định chất liệu đá khi từ Hê-bơ-rơ còn bất định; chuyển khả năng “phiến đá chạm hình” vào chú thích. Đồng thời thay “mình” bằng “các ngươi” để đúng ngôi xưng của nguyên văn và tự nhiên hơn. Các động từ và thuật ngữ còn lại được giữ vì phù hợp với ngữ cảnh thờ cúng và sắc thái mệnh lệnh của câu.
