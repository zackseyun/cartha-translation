  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: vi
  text: Các ngươi phải đuổi hết mọi cư dân trong xứ khỏi trước mặt các ngươi; phải phá hủy mọi vật có chạm hình của họ[a], tiêu hủy mọi tượng đúc bằng kim loại của họ[b], và triệt phá mọi nơi thờ tự trên cao của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các phiến đá chạm hình” hoặc “các hình chạm của họ”. Từ Hê-bơ-rơ מַשְׂכִּיּוֹת chỉ những vật hoặc hình có chạm khắc/biểu trưng; hình dạng và chất liệu chính xác vẫn còn được tranh luận.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các tượng kim loại nóng chảy của họ” hoặc “các tượng đúc của họ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: phải đuổi hết
  rationale: Động từ ירשׁ ở thể Hiphil tại đây nói đến việc khiến cư dân hiện tại phải rời đi hoặc mất quyền chiếm hữu. “Đuổi hết” tự nhiên trong tiếng Việt và giữ được sức mạnh của mệnh lệnh.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: mọi cư dân trong xứ
  rationale: Cấu trúc phân từ chỉ tất cả những người đang sinh sống trong vùng đất; “cư dân” ngắn gọn, hiện đại và trang trọng.
- source_word: מִפְּנֵיכֶם
  choice: ra khỏi trước mặt mình
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ “khỏi trước mặt các ngươi”, đồng thời dùng đại từ phản thân “mình” để câu tiếng Việt tự nhiên hơn.
- source_word: וְאִבַּדְתֶּם
  choice: phải phá hủy
  rationale: Động từ אבד ở thể Piel diễn tả việc hủy bỏ các vật dụng thờ cúng; “phá hủy” rõ nghĩa và phù hợp với đối tượng hữu hình.
- source_word: מַשְׂכִּיֹּתָם
  choice: mọi đá chạm hình của họ
  rationale: Danh từ chỉ những vật có hình khắc hoặc hình trang trí, thường được hiểu là đá có hình chạm. Cách dịch này giữ nghĩa cụ thể có khả năng nhất, còn chú thích ghi nhận sự bất định về hình dạng và chất liệu.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: mọi tượng đúc bằng kim loại của họ
  rationale: צֶלֶם là hình tượng, còn מַסֵּכָה chỉ vật được đúc từ kim loại nóng chảy. Cụm này diễn đạt rõ cả vật thể lẫn phương pháp chế tác.
- source_word: תְּאַבֵּדוּ
  choice: tiêu hủy
  rationale: Lần xuất hiện thứ hai của אבד tiếp tục mệnh lệnh hủy bỏ vật thờ cúng. “Tiêu hủy” giữ sự lặp ý của nguyên văn mà tránh câu tiếng Việt nặng nề.
- source_word: בָּמֹתָם
  choice: mọi nơi thờ tự trên cao của họ
  rationale: בָּמוֹת là các địa điểm thờ cúng trên nơi cao. Cách diễn đạt này rõ hơn “nơi cao” đơn thuần đối với độc giả Việt hiện đại và không mặc nhiên giới hạn chúng ở đỉnh đồi.
- source_word: תַּשְׁמִידוּ
  choice: triệt phá
  rationale: Động từ שׁמד ở thể Hiphil nhấn mạnh sự hủy bỏ hoàn toàn. “Triệt phá” phù hợp với các địa điểm thờ tự hơn những từ thường dùng cho việc tiêu diệt con người.
theological_decisions:
- issue: Các mệnh lệnh liên quan đến cư dân Ca-na-an và việc thờ cúng của họ
  choice: Dịch trực tiếp mệnh lệnh đuổi cư dân đi và phá hủy các vật thể, địa điểm thờ cúng của họ.
  alternative: Làm nhẹ động từ đầu thành một hành động thuần túy chuyển quyền sở hữu đất, hoặc khái quát các thuật ngữ thờ cúng thành “tục lệ ngoại giáo”.
  rationale: Nguyên văn nêu rõ cả việc loại cư dân khỏi xứ lẫn việc hủy bỏ những vật thể và địa điểm thờ cúng cụ thể. Bản dịch không làm nhẹ mức độ nghiêm khắc, cũng không thêm lời biện minh thần học ngoài câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời truyền trực tiếp cho toàn thể dân chúng; giữ hình ảnh “trước mặt” của nguyên văn. Các động từ “phá hủy”, “tiêu hủy” và “triệt phá” bảo toàn nhịp mệnh lệnh mạnh mà vẫn phù hợp tự nhiên với từng loại đối tượng.
