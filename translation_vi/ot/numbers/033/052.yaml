  terminology: “Tượng đúc bằng kim loại” và “nơi thờ tự trên cao” truyền đạt tốt các thuật ngữ về hình tượng đúc và các nơi cao thờ cúng. Giữ “các ngươi” và “khỏi trước mặt các ngươi” để phản ánh lời truyền trực tiếp và thành ngữ Hê-bơ-rơ.
