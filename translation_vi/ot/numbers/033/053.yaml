  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: vi
  text: Anh em phải chiếm hữu xứ và cư ngụ trong đó, vì Ta đã ban xứ ấy cho anh em để anh em chiếm hữu nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để thừa hưởng nó.” Động từ Hê-bơ-rơ ירשׁ có thể mang nghĩa thừa hưởng cũng như chiếm hữu, đặc biệt trong bối cảnh lời hứa giao ước về xứ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם אֶת־הָאָרֶץ
  choice: Anh em phải chiếm hữu xứ
  rationale: Hiphil của ירשׁ có thể mang nghĩa truất hữu hoặc khiến bị mất quyền sở hữu, nhưng tân ngữ trực tiếp ở đây là “xứ”, không phải cư dân. “Chiếm hữu xứ” diễn đạt tự nhiên kết quả được nhắm đến và phù hợp với mệnh đề mục đích ở cuối câu.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: và cư ngụ trong đó
  rationale: ישׁב ở đây chỉ việc ở và định cư lâu dài. “Cư ngụ” có sắc thái trang trọng vừa phải, tự nhiên trong văn Kinh Thánh hiện đại và không quá cổ như “cư trú” trong một số ngữ cảnh.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do cho mệnh lệnh trước đó; “vì” giữ rõ quan hệ nhân quả và gọn tự nhiên.
- source_word: לָכֶם נָתַתִּי אֶת־הָאָרֶץ
  choice: Ta đã ban xứ ấy cho anh em
  rationale: Dạng hoàn thành נָתַתִּי trình bày việc ban cho như hành động đã được xác lập. “Đã ban” giữ sắc thái hoàn tất; đảo “xứ ấy” trước “cho anh em” tạo câu tiếng Việt tự nhiên.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: để anh em chiếm hữu nó
  rationale: Động từ nguyên mẫu diễn tả mục đích hoặc kết quả của việc ban xứ. “Chiếm hữu” duy trì liên hệ từ vựng với mệnh lệnh đầu câu; đại từ “nó” quy chiếu rõ về “xứ ấy”.
theological_decisions:
- issue: Cách dịch ירשׁ trong bối cảnh lời hứa ban xứ
  choice: chiếm hữu
  alternative: thừa hưởng; truất hữu
  rationale: Ngữ cảnh gần nhấn mạnh việc Israel thực sự tiếp nhận và ở trong xứ dựa trên hành động ban cho của Đức Chúa Trời. ירשׁ vẫn có thể gợi ý niềm thừa hưởng trong bối cảnh giao ước, còn dạng Hiphil có thể nhấn mạnh việc truất hữu; bản dịch chính không loại bỏ các sắc thái ấy nhưng chọn cách nói tự nhiên nhất khi tân ngữ là chính vùng đất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh em” biểu thị đối tượng số nhiều; “Ta” giữ lời phán trực tiếp của Đức Chúa Trời. Dùng “xứ” thay vì “đất” để chỉ vùng lãnh thổ được hứa ban và duy trì sắc thái Kinh Thánh quen thuộc.
