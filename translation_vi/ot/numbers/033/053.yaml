  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa của tiếng Hê-bơ-rơ: mệnh lệnh chiếm hữu xứ, tiếp theo là cư ngụ trong đó, với lý do Đức Chúa Trời đã ban xứ cho họ để họ chiếm hữu. “Chiếm hữu” là lựa chọn có thể chấp nhận được cho הורישׁתם khi tân ngữ là vùng đất, đồng thời tránh diễn đạt sai rằng chính đất bị ‘truất hữu’. Mệnh đề cuối giữ được quan hệ mục đích của לָרֶשֶׁת אֹתָהּ.'
