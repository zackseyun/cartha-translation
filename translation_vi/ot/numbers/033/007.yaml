  text: וַ/יִּסְעוּ֙ מֵֽ/אֵתָ֔ם וַ/יָּ֨שָׁב֙ עַל פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֥י מִגְדֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: vi
  text: Họ rời Ê-tham, quay lại Pi Ha-hi-rốt[a], nơi đối diện Ba-anh Xê-phôn, rồi đóng trại trước Mích-đôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trở lại Pi Ha-hi-rốt”; động từ Hê-bơ-rơ có thể chỉ việc trở lại hoặc đổi hướng, nhưng ở đây có lẽ nói đến sự thay đổi lộ trình.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵתָם
  choice: Họ rời Ê-tham
  rationale: Trong công thức hành trình, נסע chỉ việc nhổ trại và lên đường; “rời” diễn đạt tự nhiên, gọn rõ trong tiếng Việt hiện đại.
- source_word: וַיָּשָׁב
  choice: quay lại hướng
  rationale: שׁוב có thể chỉ trở lại hoặc đổi hướng. Trong ngữ cảnh lộ trình, cách dịch này giữ ý quay ngược hay chuyển hướng mà không khẳng định họ trở lại một địa điểm cũ.
- source_word: עַל־פִּי הַחִירֹת
  choice: hướng Pi Ha-hi-rốt
  rationale: עַל đi với địa danh ở đây biểu thị tương quan đích hướng; “hướng” phù hợp với động từ chỉ sự đổi lộ trình, còn địa danh được phiên âm.
- source_word: אֲשֶׁר עַל־פְּנֵי בַּעַל צְפֹן
  choice: nơi đối diện Ba-anh Xê-phôn
  rationale: עַל־פְּנֵי trong chỉ dẫn địa lý có thể diễn tả vị trí ở phía trước hoặc đối diện; “đối diện” tự nhiên và phù hợp ngữ cảnh.
- source_word: וַיַּחֲנוּ
  choice: rồi đóng trại
  rationale: חנה chỉ hành động dừng lại và dựng trại; “đóng trại” là cách nói thông dụng, rõ nghĩa.
- source_word: לִפְנֵי מִגְדֹּל
  choice: trước Mích-đôn
  rationale: לִפְנֵי biểu thị vị trí ở phía trước một địa điểm. Migdol được xử lý như địa danh và phiên âm thay vì dịch thành “tháp”.
