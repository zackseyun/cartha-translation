  to: 'Yahweh phán với Môi-se tại đồng bằng[a] Mô-áp, bên sông Giô-đanh, ở khu vực Giê-ri-cô:'
  rationale: Thay “đối diện Giê-ri-cô” bằng “ở khu vực Giê-ri-cô” để không đưa vào quan hệ không gian cụ thể hơn điều câu Hebrew diễn đạt. Chú thích được thu hẹp vào lựa chọn từ vựng thực sự của עַרְבֹת. Dấu hai chấm tiếp tục thể hiện chức năng của לֵאמֹר khi lời trực tiếp bắt đầu ở câu sau.
