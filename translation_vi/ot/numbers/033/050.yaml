  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: vi
  text: 'Yahweh phán với Môi-se tại đồng bằng[a] Mô-áp, bên sông Giô-đanh, ở khu vực Giê-ri-cô:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thảo nguyên Mô-áp.”'
    reason: Ghi nhận phương án từ vựng cho עַרְבֹת, có thể chỉ vùng đồng bằng hoặc thảo nguyên/đất trống.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר với dạng kể chuyện tiếp nối diễn tiến. Trong ngữ cảnh Yahweh truyền lời cho Môi-se, “phán” là cách diễn đạt tiếng Việt tự nhiên, trang trọng và phân biệt với לֵאמֹר ở cuối câu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng Tứ Tự, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: אֶל đánh dấu người tiếp nhận lời phán; “phán với Môi-se” là kết cấu tiếng Việt tự nhiên.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: tại đồng bằng Mô-áp
  rationale: עֲרָבוֹת chỉ vùng đất bằng phẳng hoặc thảo nguyên khô; “đồng bằng Mô-áp” vừa tự nhiên vừa phù hợp với tên địa lý quen dùng.
- source_word: עַל יַרְדֵּן
  choice: bên sông Giô-đanh
  rationale: Trong cấu trúc địa lý này, עַל biểu thị vị trí gần hoặc dọc theo sông, không phải ở trên mặt sông.
- source_word: יְרֵחוֹ
  choice: đối diện Giê-ri-cô
  rationale: Cụm địa lý עַל־יַרְדֵּן יְרֵחוֹ xác định vùng đồng bằng Mô-áp bên kia sông Giô-đanh, ngang với Giê-ri-cô; “đối diện” truyền đạt quan hệ địa lý rõ ràng mà không đồng nhất địa điểm với thành Giê-ri-cô.
- source_word: לֵאמֹר
  choice: dấu hai chấm
  rationale: Phân từ nguyên mẫu này giới thiệu lời nói trực tiếp ở câu kế tiếp. Trong tiếng Việt hiện đại, dấu hai chấm diễn đạt chức năng ấy tự nhiên hơn việc thêm “rằng” hoặc “phán rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự như một danh riêng. Giữ “Yahweh” bảo toàn danh ấy và tránh thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “phán” cho lời của Yahweh; giữ các địa danh theo dạng phiên âm tiếng Việt quen thuộc. Dấu hai chấm thay cho cách dịch máy móc לֵאמֹר, vì lời trực tiếp bắt đầu ở câu tiếp theo.
