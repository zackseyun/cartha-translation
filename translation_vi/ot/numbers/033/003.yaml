source:
  edition: WLC
  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: vi
  text: Vào tháng thứ nhất, ngày mười lăm của tháng thứ nhất, họ khởi hành từ Ra-am-se. Vào ngày hôm sau lễ Vượt Qua, con cháu Israel[a] ra đi với tay giơ cao[b], trước mắt tất cả người Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “người Israel”. Nguyên văn: “các con trai của Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “Với tay giơ cao” là thành ngữ Hê-bơ-rơ, diễn tả việc ra đi công khai và hiên ngang, trước sự chứng kiến của tất cả người Ai Cập.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ khởi hành
  rationale: Trong các chặng hành trình, động từ נסע chỉ việc nhổ trại và bắt đầu lên đường; “khởi hành” tự nhiên và phù hợp với công thức hành trình.
- source_word: מֵרַעְמְסֵס
  choice: từ Ra-am-se
  rationale: Dùng dạng phiên âm tiếng Việt dễ đọc cho địa danh רַעְמְסֵס.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: vào tháng thứ nhất
  rationale: Giữ cách gọi tháng theo thứ tự như nguyên văn, không tự xác định tên tháng.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ngày mười lăm tháng thứ nhất
  rationale: Diễn đạt ngày tháng rõ ràng trong tiếng Việt và giữ việc nguyên văn lặp lại “tháng thứ nhất”.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: vào ngày hôm sau lễ Vượt Qua
  rationale: מָחֳרַת là ngày kế tiếp; הַפֶּסַח ở đây chỉ lễ Vượt Qua.
- source_word: יָצְאוּ
  choice: ra đi
  rationale: Giữ nghĩa cơ bản của יצא và âm hưởng cuộc xuất hành.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  rationale: Phản ánh thành ngữ huyết tộc “các con trai/con cái của Israel” nhưng dùng cách nói tập thể tự nhiên, trang trọng trong tiếng Việt.
- source_word: בְּיָד רָמָה
  choice: với bàn tay giơ cao
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ và để chú thích giải thích sắc thái công khai, mạnh dạn thay vì thu hẹp thành một cảm xúc duy nhất.
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: trước mắt toàn thể người Ai Cập
  rationale: Chuyển thành ngữ chỉ sự chứng kiến công khai sang một cách nói rõ ràng mà vẫn gần với hình ảnh nguyên văn.
theological_decisions:
- issue: Cách dịch בְנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  alternative: người Israel
  rationale: Cách chọn giữ hình thức quan hệ dòng dõi trong nguyên văn nhưng không khiến độc giả hiểu rằng chỉ nam giới được nói đến; chú thích nêu cách dịch tập thể tự nhiên.
- issue: Cách dịch thành ngữ בְיָד רָמָה
  choice: với bàn tay giơ cao
  alternative: một cách hiên ngang / mạnh dạn
  rationale: Nguyên văn dùng một hình ảnh có thể gợi sự mạnh dạn, công khai và thách thức. Giữ hình ảnh cùng lời chú thích bảo tồn độ rộng nghĩa, không áp đặt một sắc thái duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ sự lặp lại “tháng thứ nhất” của nguyên văn, giữ hình ảnh thành ngữ “bàn tay giơ cao”, đồng thời dùng chú thích để làm rõ nghĩa tập thể và bối cảnh văn hóa.
