revisions:
- from: Họ khởi hành từ Ra-am-se vào tháng thứ nhất, ngày mười lăm tháng thứ nhất. Vào ngày hôm sau lễ Vượt Qua, con cháu Israel[a] ra đi với bàn tay giơ cao[b], trước mắt toàn thể người Ai Cập.
  to: Vào tháng thứ nhất, ngày mười lăm của tháng thứ nhất, họ khởi hành từ Ra-am-se. Vào ngày hôm sau lễ Vượt Qua, con cháu Israel[a] ra đi với tay giơ cao[b], trước mắt tất cả người Ai Cập.
  rationale: Bản sửa chỉ cải thiện tính tự nhiên và tránh hiểu hình ảnh thành ngữ như một cử chỉ vật lý cụ thể. Trật tự thời gian, sự lặp lại “tháng thứ nhất,” tên riêng, và độ mở nghĩa của thành ngữ đều được giữ lại.
