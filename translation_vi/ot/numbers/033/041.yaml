  text: וַ/יִּסְע֖וּ מֵ/הֹ֣ר הָ/הָ֑ר וַֽ/יַּחֲנ֖וּ בְּ/צַלְמֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/041.yaml
  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: vi
  text: Họ rời núi Hô-rơ và đóng trại tại Xanh-mô-na.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong các chặng hành trình, động từ נסע chỉ việc nhổ trại và lên đường khỏi một địa điểm. “Rời” diễn đạt tự nhiên công thức hành trình khi đi với nơi xuất phát.
- source_word: מֵהֹר הָהָר
  choice: núi Hô-rơ
  rationale: הֹר הָהָר là địa danh quen dùng, được chuyển tự sang tiếng Việt là “núi Hô-rơ”; giới từ מִן được thể hiện trong động từ “rời”.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong danh sách hành trình có nghĩa dựng hoặc đóng trại; “đóng trại” là cách nói hiện đại, rõ nghĩa và trang trọng vừa phải.
- source_word: בְּצַלְמֹנָה
  choice: tại Xanh-mô-na
  rationale: Giới từ בְּ ở đây mang nghĩa chỉ địa điểm. “Tại” phù hợp với một điểm dừng chân; צַלְמֹנָה được chuyển tự là “Xanh-mô-na”.
theological_decisions: []
