  register: Bản dịch dùng tiếng Việt hiện đại, gọn và trang trọng, giữ nguyên cấu trúc công thức của danh sách các chặng hành trình. Không cần chú thích vì câu không có dị bản hay điểm mơ hồ đáng kể ảnh hưởng đến bản dịch.
