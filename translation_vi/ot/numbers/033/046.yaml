  yaml_path: translation/ot/numbers/033/046.yaml
  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: vi
  text: Họ rời Đi-bôn-Gát và đóng trại tại Al-môn-Đíp-la-tha-im.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình ở Dân Số 33, נסע chỉ việc nhổ trại và lên đường. “Rời” diễn đạt tự nhiên, gọn rõ điểm xuất phát khi đi với מִן.
- source_word: מִדִּיבֹן גָּד
  choice: Đi-bôn Gát
  rationale: Đây là địa danh ghép, được phiên âm thay vì dịch; giữ hai thành tố để phản ánh דִּיבֹן גָּד mà không diễn giải thành “Đi-bôn của Gát”.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: חנה trong công thức hành trình có nghĩa dừng lại và dựng trại; “đóng trại” là cách nói hiện đại, tự nhiên trong tiếng Việt.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: tại An-môn Đíp-la-tha-im
  rationale: בְּ được diễn đạt bằng “tại” để chỉ địa điểm; tên riêng được phiên âm và giữ đủ hai thành tố của địa danh.
