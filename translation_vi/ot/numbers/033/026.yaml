base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/026.yaml
  text: They set out from Makheloth and camped at Tahath.
translation:
  language: vi
  text: Họ rời Ma-kê-lốt và đóng trại tại Ta-hát.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc rời một chặng đóng trại để lên đường. “Rời” tự nhiên, gọn và phù hợp với tiếng Việt hiện đại.
- source_word: מִמַּקְהֵלֹת
  choice: Ma-kê-lốt
  rationale: Địa danh מַקְהֵלוֹת được phiên âm sang tiếng Việt; tiền tố מִן được thể hiện qua động từ “rời”, nên không cần thêm “khỏi”.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong danh sách hành trình có nghĩa là dừng lại và dựng trại tại chặng kế tiếp. “Đóng trại” là cách nói rõ ràng, tự nhiên.
- source_word: בְּתָחַת
  choice: tại Ta-hát
  rationale: תָּחַת là địa danh nên được phiên âm; giới từ בְּ được dịch là “tại” để chỉ địa điểm đóng trại.
