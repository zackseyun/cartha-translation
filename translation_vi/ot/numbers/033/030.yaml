base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/030.yaml
  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: vi
  text: Họ rời Hát-mô-na và đóng trại tại Mô-xê-rốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc rời một chặng để lên đường; “rời” tự nhiên, gọn và phù hợp khi đi cùng địa điểm có giới từ “từ” hàm ẩn trong tiếng Việt.
- source_word: מֵחַשְׁמֹנָה
  choice: Hát-mô-na
  rationale: Giới từ מֵ biểu thị điểm xuất phát và được thể hiện qua cấu trúc “rời [địa điểm]”; địa danh חַשְׁמֹנָה được phiên âm sang tiếng Việt.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong các bản kê hành trình có nghĩa là dựng hoặc đóng trại; “đóng trại” là cách nói hiện đại, rõ nghĩa và giữ được hành động cụ thể.
- source_word: בְּמֹסֵרוֹת
  choice: tại Mô-xê-rốt
  rationale: Giới từ בְ trong ngữ cảnh một trạm dừng được dịch tự nhiên là “tại”; מֹסֵרוֹת là địa danh nên được phiên âm.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng vừa phải và nhất quán với công thức liệt kê các chặng hành trình. Không thêm chú thích vì biến thể tiếng Anh “camped/encamped” không tạo ra khác biệt cần ghi chú trong tiếng Việt; cả hai đều tương ứng tự nhiên với “đóng trại”.
