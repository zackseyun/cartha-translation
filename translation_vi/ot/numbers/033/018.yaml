  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: vi
  text: Họ rời Hát-sê-rốt và đóng trại tại Rít-ma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Động từ נסע trong công thức hành trình nơi hoang mạc chỉ việc nhổ trại và lên đường. “Rời” tự nhiên, gọn và phù hợp khi đi với địa danh xuất phát.
- source_word: מֵחֲצֵרֹת
  choice: Hát-xê-rốt
  rationale: Tên địa danh חֲצֵרֹת được phiên âm sang tiếng Việt; giới từ מִן được thể hiện qua động từ “rời”.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה là từ thông dụng trong các chặng hành trình, chỉ việc dựng hoặc lập trại; “đóng trại” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּרִתְמָה
  choice: tại Rít-ma
  rationale: Tên địa danh רִתְמָה được phiên âm; giới từ בְּ chỉ địa điểm được chuyển là “tại”, phù hợp với địa điểm đóng trại.
