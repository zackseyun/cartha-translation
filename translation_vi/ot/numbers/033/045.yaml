  text: וַ/יִּסְע֖וּ מֵ/עִיִּ֑ים וַֽ/יַּחֲנ֖וּ בְּ/דִיבֹ֥ן גָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
translation:
  language: vi
  text: Họ rời I-giim và đóng trại tại Đi-bôn Gát.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình của Dân Số, động từ נסע chỉ việc nhổ trại và lên đường khỏi một chặng; “rời” diễn đạt tự nhiên điểm xuất phát được nêu với מֵ.
- source_word: מֵעִיִּים
  choice: I-giim
  rationale: Giới từ מֵ được thể hiện trong “rời I-giim”. Địa danh עִיִּים được phiên âm theo lối Việt hóa, giữ âm yod kép bằng “gi” và nguyên âm dài tương đối qua “iim”.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong các ghi chép hành trình có nghĩa dựng hoặc đóng trại; “đóng trại” là cách nói hiện đại, rõ nghĩa và sát ngữ cảnh.
- source_word: בְּדִיבֹן גָּד
  choice: tại Đi-bôn Gát
  rationale: Giới từ בְּ trước địa điểm được dịch tự nhiên là “tại”. דִיבֹן גָּד được giữ như một địa danh ghép, không diễn giải thành quan hệ sở hữu.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng vừa phải và phù hợp với công thức liệt kê các chặng hành trình. Tên riêng được phiên âm theo cách đọc dễ tiếp cận đối với độc giả Việt hiện đại.
