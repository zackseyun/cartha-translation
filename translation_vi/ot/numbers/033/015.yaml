base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/015.yaml
  text: They set out from Rephidim and camped in the wilderness of Sinai.
translation:
  language: vi
  text: Họ rời Rê-phi-đim và đóng trại trong hoang mạc Si-nai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình, động từ נסע chỉ việc nhổ trại và khởi hành khỏi một địa điểm. “Rời” là cách diễn đạt tự nhiên, gọn và phù hợp khi đi với giới từ nguồn מֵ־.
- source_word: מֵרְפִידִם
  choice: Rê-phi-đim
  rationale: Tiền tố מֵ־ chỉ nơi xuất phát; địa danh רְפִידִם được phiên âm theo cách đọc tiếng Việt, không dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong các danh sách chặng đường chỉ hành động dựng hoặc dừng trại. “Đóng trại” tự nhiên trong tiếng Việt hiện đại và giữ được ý nghĩa cụ thể.
- source_word: בְּמִדְבַּר סִינָי
  choice: trong hoang mạc Si-nai
  rationale: מִדְבָּר chỉ vùng hoang vu, không nhất thiết hoàn toàn là sa mạc cát; “hoang mạc” giữ được sắc thái địa hình rộng hơn. Cấu trúc sở thuộc với סִינָי được diễn đạt tự nhiên là “hoang mạc Si-nai”.
theological_decisions: []
