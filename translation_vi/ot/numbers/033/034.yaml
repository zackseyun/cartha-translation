base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/034.yaml
  text: They set out from Jotbathah and camped at Abronah.
translation:
  language: vi
  text: Họ rời Giốt-ba-tha và đóng trại tại Áp-rô-na.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và lên đường khỏi một địa điểm. “Rời” tự nhiên, súc tích trong tiếng Việt và phù hợp với giới từ “khỏi/từ” hàm trong địa danh theo sau.
- source_word: מִיָּטְבָתָה
  choice: Giốt-ba-tha
  rationale: Giới từ מִן diễn tả điểm xuất phát, được thể hiện cùng động từ “rời”. Địa danh יָטְבָתָה được phiên âm theo cách đọc gần với tiếng Hê-bơ-rơ và hình thức quen dùng trong Kinh Thánh tiếng Việt.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong danh sách các chặng đường có nghĩa là dựng hoặc đóng trại tại địa điểm kế tiếp. “Đóng trại” là cách nói hiện đại, rõ nghĩa.
- source_word: בְּעַבְרֹנָה
  choice: tại Áp-rô-na
  rationale: Giới từ בְּ mang nghĩa chỉ địa điểm, được dịch là “tại”. Địa danh עַבְרֹנָה được phiên âm thay vì dịch nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, giữ đúng cấu trúc của một ghi chép hành trình. Không cần chú thích vì câu không có dị bản hay điểm mơ hồ đáng kể ảnh hưởng đến bản dịch.
