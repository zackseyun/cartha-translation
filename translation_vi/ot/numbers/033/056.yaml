base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/056.yaml
  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: vi
  text: thì điều Ta đã định làm cho chúng, Ta sẽ làm cho các ngươi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: thì
  rationale: Trong mạch cảnh báo ở câu trước, công thức này dẫn vào hậu quả sẽ xảy đến; tiếng Việt tự nhiên có thể diễn đạt gọn bằng “thì” mà vẫn giữ quan hệ kết quả.
- source_word: כַּאֲשֶׁר
  choice: điều
  rationale: Trong cấu trúc này, từ nối dẫn vào nội dung của ý định; “điều Ta đã định làm” tự nhiên trong tiếng Việt và không làm thay đổi quan hệ giữa hai vế.
- source_word: דִּמִּיתִי
  choice: Ta đã định
  rationale: Thể piel ở đây biểu thị ý định hay chủ định, không chỉ một suy nghĩ thoáng qua. “Đã định” vừa trang trọng vừa giữ được sức nặng của lời cảnh báo.
- source_word: לַעֲשׂוֹת
  choice: làm
  rationale: Giữ nghĩa rộng và trực tiếp của động từ עשה, để mạch văn cung cấp sắc thái trừng phạt.
- source_word: לָהֶם
  choice: cho chúng
  rationale: Giữ quan hệ gián tiếp của giới từ mà không thêm rõ nghĩa “chống lại”; “chúng” chỉ các cư dân được nhắc đến trong ngữ cảnh.
- source_word: אֶעֱשֶׂה
  choice: Ta sẽ làm
  rationale: Lặp lại “làm” để bảo toàn phép song hành sắc lạnh của nguyên văn và hình thái tương lai của lời đe dọa.
- source_word: לָכֶם
  choice: cho các ngươi
  rationale: “Các ngươi” phân biệt rõ đại từ số nhiều và phù hợp với lời Đức Chúa Trời phán trực tiếp cho cộng đồng Israel; không thêm sắc thái “chống lại” vốn chỉ do ngữ cảnh hàm ý.
theological_decisions:
- issue: Tính chất của lời cảnh báo về sự phán xét tương ứng
  choice: Giữ lời phán trực tiếp rằng chính Đức Chúa Trời sẽ làm cho Israel điều Ngài đã định làm cho các cư dân ấy.
  alternative: Diễn đạt nhẹ hơn như một hậu quả tự nhiên, không nhấn mạnh chủ ý và hành động của Đức Chúa Trời.
  rationale: Chủ ngữ ngôi thứ nhất và sự lặp lại của עשה cho thấy đây là lời đe dọa trực tiếp về hành động tương ứng của Đức Chúa Trời; bản dịch không thêm nội dung hình phạt ngoài điều câu văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời phán của Đức Chúa Trời và “các ngươi” để giữ ngôi thứ hai số nhiều. Không đặt chú thích vì chú thích tiếng Anh được cung cấp chỉ lặp nguyên văn, không nêu một phương án dịch thực sự khác.
