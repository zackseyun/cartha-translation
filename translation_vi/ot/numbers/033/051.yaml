  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: vi
  text: 'Hãy nói với con dân Israel[a] và bảo họ: “Khi anh em vượt sông Jordan[b] vào đất Canaan,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Israel”; cũng có thể dịch là “người Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đang vượt” hoặc “sắp vượt”. Phân từ Hê-bơ-rơ ở đây diễn tả cuộc vượt sông cận kề.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Động từ Pi’el ở thể mệnh lệnh truyền đạt một mệnh lệnh trực tiếp; “hãy nói” tự nhiên và vẫn phân biệt với động từ “bảo” theo sau.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cách nói tự nhiên trong tiếng Việt để chỉ cộng đồng hậu duệ Israel; chú thích giữ lại nghĩa đen mang tính gia tộc của tiếng Hê-bơ-rơ.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: và bảo họ
  rationale: Giữ lại động từ thứ hai của nguyên văn mà không tạo sự lặp từ thiếu tự nhiên trong tiếng Việt.
- source_word: כִּי
  choice: Khi
  rationale: Trong ngữ cảnh này, từ nối mở đầu nội dung lời truyền đạt và kết hợp với phân từ chỉ việc vượt sông sắp xảy ra; “khi” dẫn tự nhiên vào các chỉ thị ở câu kế tiếp.
- source_word: אַתֶּם עֹבְרִים
  choice: anh em vượt
  rationale: Đại từ số nhiều cùng phân từ diễn tả hành động sắp xảy ra. “Anh em” là lối xưng hô tập thể trang trọng, còn mệnh đề với “khi” chuyển tải sắc thái tương lai gần.
- source_word: אֶת הַיַּרְדֵּן
  choice: sông Jordan
  rationale: Thêm danh từ loại “sông” để độc giả Việt nhận biết rõ địa danh, dù tiếng Hê-bơ-rơ chỉ dùng tên riêng có mạo từ.
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: để vào đất Canaan
  rationale: “Vào” thể hiện hướng đi và sự tiến nhập; “đất Canaan” giữ rõ danh từ אֶרֶץ. Từ “để” làm quan hệ chuyển động tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của כִּי và phân từ עֹבְרִים
  choice: Khi anh em vượt
  alternative: Vì anh em đang vượt / anh em sắp vượt
  rationale: Nguyên văn cho phép nhận ra tính hiện tại hoặc cận tương lai của phân từ, nhưng trong mạch lời dặn trước khi vào Canaan, mệnh đề thời gian là cách diễn đạt tự nhiên nhất; chú thích bảo lưu các sắc thái khả hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dạng quốc tế của các địa danh Israel, Jordan và Canaan. Câu được để mở bằng dấu phẩy vì lời truyền đạt tiếp tục ở câu 52.
