base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: vi
  text: Họ rời Su-cốt, rồi đóng trại tại Ê-tham, ở rìa hoang mạc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình, נסע chỉ việc nhổ trại và lên đường; “rời” tự nhiên, gọn và phù hợp khi đi với địa điểm xuất phát.
- source_word: מִסֻּכֹּת
  choice: Su-cốt
  rationale: Tên địa danh được phiên âm từ סֻכּוֹת theo lối viết quen thuộc, dễ đọc trong tiếng Việt.
- source_word: וַיַּחֲנוּ
  choice: rồi đóng trại
  rationale: חנה có nghĩa là dừng lại để dựng trại; “đóng trại” là cách diễn đạt hiện đại và chính xác. “Rồi” thể hiện trình tự của waw kể chuyện.
- source_word: בְאֵתָם
  choice: tại Ê-tam
  rationale: Giới từ ב trước địa danh được diễn đạt tự nhiên bằng “tại”; Ê-tam là phiên âm của אֵתָם.
- source_word: אֲשֶׁר
  choice: ở
  rationale: Mệnh đề quan hệ mô tả vị trí của Ê-tam được chuyển thành cụm vị trí tự nhiên trong tiếng Việt mà không làm thay đổi quan hệ cú pháp.
- source_word: בִּקְצֵה
  choice: ở rìa
  rationale: קָצֶה chỉ phần tận cùng hoặc ranh giới của một vùng; “rìa” giữ được sắc thái địa lý mà không hàm ý một biên giới chính trị.
- source_word: הַמִּדְבָּר
  choice: hoang mạc
  rationale: מִדְבָּר là vùng đất hoang vu, ít canh tác, không nhất thiết là sa mạc cát; “hoang mạc” phù hợp với bối cảnh hành trình.
theological_decisions: []
translation_notes:
  register: Văn phong tường thuật ngắn gọn, trang trọng vừa phải và tự nhiên đối với độc giả Việt Nam hiện đại. Không thêm chú thích vì cách dịch “ở rìa hoang mạc” trực tiếp bảo toàn nghĩa địa lý của בִּקְצֵה; phương án “ở biên giới hoang mạc” kém tự nhiên và dễ gợi một ranh giới chính trị.
