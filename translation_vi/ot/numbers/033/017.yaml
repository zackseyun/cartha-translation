  text: They set out from Kibroth-hattaavah and camped at Hazeroth[a].
translation:
  language: vi
  text: Họ rời khỏi Kíp-rốt Ha-tha-a-va và đóng trại tại Ha-xê-rốt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Kíp-rốt Ha-tha-a-va có lẽ có nghĩa là “Những ngôi mộ của sự ham muốn” hoặc “Những ngôi mộ của dục vọng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức ghi lại các chặng đường nơi hoang mạc, động từ נסע chỉ việc rời một địa điểm để lên đường; “rời” tự nhiên và gọn trong tiếng Việt.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: Kíp-rốt Ha-tha-a-va
  rationale: Giữ dưới dạng phiên âm vì đây là địa danh; tiền tố מִן được thể hiện trong động từ “rời”. Nghĩa của tên được nêu ở chú thích.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Trong văn cảnh hành trình, חנה có nghĩa là dừng lại và dựng trại; “đóng trại” là cách nói hiện đại, rõ ràng.
- source_word: בַּחֲצֵרֹת
  choice: tại Ha-xê-rốt
  rationale: Phiên âm địa danh חֲצֵרֹת; giới từ ב được dịch là “tại” để diễn tả nơi họ đóng trại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu; giữ cấu trúc ngắn gọn của danh sách hành trình. Các địa danh được phiên âm nhất quán, còn ý nghĩa của địa danh đầu tiên được bảo lưu trong chú thích.
