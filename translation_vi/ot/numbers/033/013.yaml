base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/013.yaml
  text: They set out from Dophkah and camped at Alush.
translation:
  language: vi
  text: Họ rời Đáp-ca và đóng trại tại A-lút.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và khởi hành từ một chặng; “rời” tự nhiên, gọn và phù hợp khi đi với địa điểm nguồn.
- source_word: מִדָּפְקָה
  choice: Đáp-ca
  rationale: Tiền tố מִן chỉ nơi xuất phát (“từ”); tên địa danh được phiên âm sang tiếng Việt, không dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: đóng trại
  rationale: Động từ חנה trong danh sách các chặng đường có nghĩa là dừng lại và dựng trại; “đóng trại” là cách nói hiện đại, rõ nghĩa.
- source_word: בְּאָלוּשׁ
  choice: tại A-lút
  rationale: Giới từ בְּ chỉ địa điểm; “tại” phù hợp với một nơi dừng chân, còn tên riêng được phiên âm sang tiếng Việt.
