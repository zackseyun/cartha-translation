  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: vi
  text: Đây là những chặng hành trình của con cái Israel[a], những người đã ra khỏi đất Ai Cập theo các đội ngũ của họ[b], dưới sự dẫn dắt của Môi-se và A-rôn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “con trai của Israel”; cũng có thể dịch là “người Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “theo các quân đội của họ” hoặc “theo các đơn vị của họ.” Từ Hê-bơ-rơ chỉ các nhóm được tổ chức, và có thể mang sắc thái quân sự.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “bởi tay Môi-se và A-rôn,” một thành ngữ Hê-bơ-rơ chỉ vai trò tác động hoặc lãnh đạo của họ.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Cách mở đầu tự nhiên trong tiếng Việt để giới thiệu danh sách hành trình theo sau.
- source_word: מַסְעֵי
  choice: các chặng đường
  rationale: Danh từ chỉ những chặng nối tiếp nhau trong một hành trình; cách dịch này thể hiện rõ cấu trúc của bản lộ trình.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cách nói trang trọng, tự nhiên trong tiếng Việt, chỉ cộng đồng hậu duệ của Israel mà không khiến độc giả hiểu là chỉ gồm nam giới.
- source_word: אֲשֶׁר יָצְאוּ
  choice: là những người đã ra khỏi
  rationale: Giữ quan hệ của mệnh đề với con dân Israel và diễn đạt rõ hành động rời khỏi Ai Cập.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: khỏi đất Ai Cập
  rationale: Giữ thành tố 'đất' có mặt trong tiếng Hê-bơ-rơ và dùng cú pháp tiếng Việt tự nhiên.
- source_word: לְצִבְאֹתָם
  choice: theo từng đạo quân
  rationale: Giữ sắc thái tổ chức và quân sự của צָבָא, đồng thời biểu đạt sự phân chia thành các đơn vị.
- source_word: בְּיַד
  choice: dưới sự dẫn dắt của
  rationale: Chuyển thành ngữ Hê-bơ-rơ 'bởi/dưới tay' sang nghĩa tác nhân và lãnh đạo tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Môi-se và A-rôn
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: giữ hình ảnh lộ trình và sắc thái tổ chức của nguyên văn, nhưng chuyển thành ngữ בְּיַד sang cách nói tự nhiên trong tiếng Việt; các nét nghĩa nguyên văn đáng chú ý được bảo tồn trong chú thích.'
