  text: וַ/יִּסְע֖וּ מִ/מִּתְקָ֑ה וַֽ/יַּחֲנ֖וּ בְּ/חַשְׁמֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/029.yaml
  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: vi
  text: Họ rời Mít-ca và đóng trại tại Hát-mô-na.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc rời một chặng để đi tiếp; “rời” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מִמִּתְקָה
  choice: Mít-ca
  rationale: Tiền tố מִן mang nghĩa “từ”; trong câu tiếng Việt, ý này đã được thể hiện bằng động từ “rời”. מִתְקָה là địa danh nên được phiên âm, không dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה là từ thường dùng trong các danh sách hành trình để nói đến việc dựng hoặc dừng trại; “đóng trại” là cách diễn đạt hiện đại và trang trọng vừa phải.
- source_word: בְּחַשְׁמֹנָה
  choice: tại Hát-mô-na
  rationale: Giới từ בְּ trước địa điểm cắm trại được diễn đạt tự nhiên là “tại”. חַשְׁמֹנָה là địa danh nên được phiên âm.
theological_decisions: []
translation_notes:
  register: Câu ngắn gọn theo công thức ghi chép hành trình, dùng tiếng Việt hiện đại, rõ ràng và trang nghiêm. Các địa danh được phiên âm nhất quán, không thêm thông tin ngoài nguyên văn.
