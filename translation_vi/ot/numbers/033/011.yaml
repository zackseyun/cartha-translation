  text: וַ/יִּסְע֖וּ מִ/יַּם ס֑וּף וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּר סִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: vi
  text: Họ rời Biển Đỏ[a] và đóng trại trong hoang mạc Sin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Biển Sậy”. Tên Hê-bơ-rơ yam suf theo truyền thống được dịch là “Biển Đỏ”, nhưng cách dịch sát chữ thường được hiểu là “Biển Sậy”.
    reason: lexical_alternative
  - marker: b
    text: “Sin” ở đây là tên một vùng hoang mạc.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Động từ נסע trong công thức hành trình của Dân Số 33 chỉ việc nhổ trại và khởi hành khỏi một địa điểm. “Rời” tự nhiên, gọn và phù hợp khi đi với nơi xuất phát.
- source_word: מִיַּם סוּף
  choice: Biển Đỏ
  rationale: יָם־סוּף là địa danh theo cách dịch truyền thống và quen thuộc trong tiếng Việt. Nghĩa sát chữ có thể là “Biển Sậy”, nên phương án này được giữ trong chú thích để không che khuất vấn đề từ nguyên.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה là từ thông dụng trong các trình thuật hành trình để nói việc dựng hoặc lập trại. “Đóng trại” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּמִדְבַּר סִין
  choice: trong hoang mạc Sin
  rationale: מִדְבָּר chỉ vùng đất hoang vu, khô cằn; “hoang mạc” vừa trang trọng vừa quen thuộc trong văn cảnh Ngũ Kinh. סִין là tên riêng địa lý nên được phiên âm là “Sin”, không dịch theo bất kỳ nghĩa đạo đức nào.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ nhịp ngắn gọn của công thức liệt kê hành trình trong Dân Số 33. Các tên địa lý quen thuộc được giữ theo truyền thống, đồng thời chú thích phương án sát nghĩa khi cần.
