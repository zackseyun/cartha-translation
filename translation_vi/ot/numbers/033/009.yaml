  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: vi
  text: Họ rời Ma-ra và đến Ê-lim. Tại Ê-lim có mười hai mạch nước và bảy mươi cây chà là; họ đóng trại tại đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình, động từ נסע chỉ việc nhổ trại và lên đường. “Rời” tự nhiên trong tiếng Việt và kết hợp rõ với địa điểm xuất phát.
- source_word: מִמָּרָה
  choice: Ma-ra
  rationale: Tên địa danh được phiên âm sang tiếng Việt, không dịch nghĩa.
- source_word: וַיָּבֹאוּ
  choice: và đến
  rationale: בוא ở đây diễn tả việc đi đến địa điểm kế tiếp; “đến” ngắn gọn, tự nhiên và không thêm sắc thái ngoài văn bản.
- source_word: אֵילִמָה / בְאֵילִם
  choice: đến Ê-lim / Tại Ê-lim
  rationale: Dạng chỉ hướng trước hết diễn tả chuyển động đến Ê-lim, còn cụm có giới từ sau đó xác định địa điểm có các nguồn nước và cây chà là.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: mười hai
  rationale: Chuyển trực tiếp số từ sang cách nói thông dụng trong tiếng Việt.
- source_word: עֵינֹת מַיִם
  choice: mạch nước
  rationale: עַיִן trong ngữ cảnh này là nguồn hay mạch nước tự nhiên. “Mạch nước” chính xác và tự nhiên hơn “giếng”, vốn có thể gợi nguồn nước do con người đào.
- source_word: וְשִׁבְעִים
  choice: và bảy mươi
  rationale: Chuyển trực tiếp số từ, giữ phép nối của nguyên văn.
- source_word: תְּמָרִים
  choice: cây chà là
  rationale: תָּמָר chỉ cây họ cau, thường là chà là. “Cây chà là” là cách gọi rõ ràng, quen thuộc trong tiếng Việt và phù hợp với bối cảnh.
- source_word: וַיַּחֲנוּ שָׁם
  choice: họ đóng trại tại đó
  rationale: חנה trong các chặng hành trình nơi hoang mạc có nghĩa là dựng hoặc đóng trại; cách diễn đạt này hiện đại và trang trọng vừa phải.
