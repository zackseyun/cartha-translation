  register: 'Văn phong kể chuyện ngắn gọn, trang trọng và dễ hiểu; giữ cấu trúc hành trình của nguyên văn. Dùng các dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Ma-ra và Ê-lim.'
