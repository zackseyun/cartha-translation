  text: וַ/יִּסְע֖וּ מֵ/רִמֹּ֣ן פָּ֑רֶץ וַֽ/יַּחֲנ֖וּ בְּ/לִבְנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/020.yaml
  text: They set out from Rimmon-perez and camped at Libnah.
translation:
  language: vi
  text: Họ rời Rim-môn Pê-rết và đóng trại tại Líp-na.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc rời một trạm để tiếp tục lên đường. “Rời” tự nhiên, gọn và phù hợp với cấu trúc có מִן (“khỏi, từ”).
- source_word: מֵרִמֹּן פָּרֶץ
  choice: Rim-môn Pê-rết
  rationale: Địa danh được phiên âm sang tiếng Việt thay vì dịch nghĩa; giới từ מִן được thể hiện bằng động từ “rời”.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong danh sách hành trình có nghĩa là dừng lại và dựng trại; “đóng trại” là cách diễn đạt hiện đại, rõ nghĩa.
- source_word: בְּלִבְנָה
  choice: tại Líp-na
  rationale: Giới từ בְּ trong thông báo hành trình đánh dấu địa điểm dừng chân, nên dịch là “tại”; Líp-na là dạng phiên âm địa danh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và súc tích, giữ nguyên mô thức lặp của danh sách hành trình. Các địa danh được phiên âm theo cách đọc gần với tiếng Hê-bơ-rơ.
