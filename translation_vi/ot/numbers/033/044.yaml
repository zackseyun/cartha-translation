  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: vi
  text: Họ rời Ô-bốt và đóng trại tại I-yê A-ba-rim[a], ở biên giới Mô-áp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể phiên âm là “Iy-yê A-ba-rim”; tên Hê-bơ-rơ này có thể gồm các yếu tố liên hệ đến “các đống hoang tàn” và “A-ba-rim/các miền bên kia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và lên đường. “Rời” tự nhiên trong tiếng Việt và kết hợp rõ với nơi xuất phát.
- source_word: מֵאֹבֹת
  choice: Ô-bốt
  rationale: Tiền tố מֵ chỉ nơi xuất phát; אֹבֹת là địa danh nên được phiên âm thay vì dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה là từ thông dụng chỉ việc dựng hoặc lập trại trong các trình thuật hành trình; “đóng trại” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: tại Y-ê A-ba-rim
  rationale: Cụm này hoạt động như một địa danh trong danh sách hành trình. Phiên âm giữ được chức năng địa danh và tránh áp đặt cách giải thích từ nguyên.
- source_word: בִּגְבוּל
  choice: bên biên giới
  rationale: גְּבוּל có thể chỉ biên giới, ranh giới hoặc lãnh thổ. Trong thông báo về địa điểm cắm trại này, “bên biên giới” truyền đạt nghĩa vị trí mà không hàm ý họ đã đi sâu vào lãnh thổ Mô-áp.
- source_word: מוֹאָב
  choice: Mô-áp
  rationale: Dùng dạng phiên âm địa danh quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu; giữ công thức hành trình ngắn gọn của nguyên văn. Các địa danh được phiên âm, còn khả năng phân tích từ nguyên của Y-ê A-ba-rim được bảo lưu trong chú thích.
