  text: וַ/יִּסְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל מֵ/רַעְמְסֵ֑ס וַֽ/יַּחֲנ֖וּ בְּ/סֻכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/005.yaml
  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: vi
  text: Người Israel[a] khởi hành từ Ra-am-sết[b] và đóng trại tại Su-cốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con cái Israel”; tiếng Hê-bơ-rơ theo nghĩa đen là “các con trai của Israel”.
    reason: lexical_alternative
  - marker: b
    text: Tên Ra-am-sết cũng được phiên âm là “Ra-mê-se” trong một số bản dịch.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: khởi hành
  rationale: Động từ נסע trong bản liệt kê hành trình chỉ việc nhổ trại và lên đường. “Khởi hành” tự nhiên trong tiếng Việt hiện đại và diễn đạt rõ sự bắt đầu chặng đi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: người Israel
  rationale: Cụm từ có nghĩa đen là “các con trai của Israel”, nhưng trong ngữ cảnh này chỉ cộng đồng Israel. “Người Israel” rõ ràng, tự nhiên và không khiến độc giả hiểu lầm rằng chỉ có nam giới.
- source_word: מֵרַעְמְסֵס
  choice: từ Ra-am-sết
  rationale: Tiền tố מִן chỉ điểm xuất phát. “Ra-am-sết” là cách phiên âm địa danh רַעְמְסֵס, đồng thời giữ dạng tên riêng thay vì dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: đóng trại
  rationale: Động từ חנה có nghĩa là dựng hoặc đóng trại. “Đóng trại” là cách nói thông dụng, phù hợp với văn cảnh hành trình.
- source_word: בְּסֻכֹּת
  choice: tại Su-cốt
  rationale: Giới từ בְּ ở đây chỉ địa điểm dừng chân; “tại” phù hợp với lối thuật lại hành trình. סֻכֹּת được phiên âm là “Su-cốt”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn, phù hợp với thể loại liệt kê hành trình. Các địa danh được phiên âm dễ đọc trong tiếng Việt; cách dịch “người Israel” ưu tiên nghĩa tập thể tự nhiên, còn hình thức sát chữ được giữ trong chú thích.
