  text: וַ/יִּסְע֖וּ מִ/לִּבְנָ֑ה וַֽ/יַּחֲנ֖וּ בְּ/רִסָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/021.yaml
  text: They set out from Libnah and camped at Rissah.
translation:
  language: vi
  text: Họ rời Líp-na và đóng trại tại Rít-sa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Động từ נסע trong công thức hành trình nơi hoang mạc chỉ việc nhổ trại, rời một điểm để tiếp tục lên đường. “Rời” tự nhiên trong tiếng Việt và phù hợp với cấu trúc có địa điểm xuất phát.
- source_word: מִלִּבְנָה
  choice: Líp-na
  rationale: Giới từ מִן đánh dấu nơi xuất phát, được thể hiện bằng cấu trúc “rời Líp-na”; לִבְנָה là địa danh nên được phiên âm, không dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה là từ quen dùng trong các chặng hành trình, mang nghĩa dựng hoặc đóng trại. “Đóng trại” rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּרִסָּה
  choice: tại Rít-sa
  rationale: Giới từ בְּ biểu thị địa điểm. “Tại” thích hợp với tên một điểm dừng chân; רִסָּה được phiên âm là “Rít-sa”.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng vừa phải và tự nhiên, giữ nguyên cấu trúc công thức của bản liệt kê hành trình. Hai địa danh được phiên âm nhất quán theo cách đọc gần với tiếng Hê-bơ-rơ.
