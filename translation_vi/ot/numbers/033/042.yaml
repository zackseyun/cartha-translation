base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/042.yaml
  text: They set out from Zalmonah and camped at Punon.
translation:
  language: vi
  text: Họ rời Xanh-mô-na và đóng trại tại Phu-nôn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và lên đường. “Rời” tự nhiên trong tiếng Việt và kết hợp rõ với địa điểm xuất phát.
- source_word: מִצַּלְמֹנָה
  choice: Xanh-mô-na
  rationale: Tiền tố מִן được thể hiện qua cấu trúc “rời [địa điểm]”. Địa danh צַלְמֹנָה được phiên âm sang tiếng Việt là “Xanh-mô-na” thay vì dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong ngữ cảnh lộ trình có nghĩa dừng lại để dựng trại; “đóng trại” là cách diễn đạt hiện đại, rõ nghĩa và tự nhiên.
- source_word: בְּפוּנֹן
  choice: tại Phu-nôn
  rationale: Giới từ בְּ trước địa điểm dừng chân được dịch tự nhiên là “tại”. Địa danh פוּנֹן được phiên âm là “Phu-nôn”.
