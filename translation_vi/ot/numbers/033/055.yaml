source:
  edition: WLC
  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: vi
  text: Nhưng nếu anh em không đuổi cư dân của xứ ấy khỏi trước mặt anh em, thì những kẻ anh em để lại trong số họ sẽ trở thành mũi nhọn trong mắt anh em[a] và gai nhọn nơi sườn anh em[b]; họ sẽ quấy nhiễu anh em trên đất anh em đang cư ngụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vật nhọn đâm vào mắt anh em.” Danh từ Hê-bơ-rơ này hiếm gặp và chỉ một vật sắc nhọn gây đâm đau.
    reason: lexical_alternative
  - marker: b
    text: Hay “gai” hoặc “móc nơi sườn anh em.” Hai hình ảnh đi đôi đều mô tả nỗi đau dai dẳng do những cư dân còn lại gây ra.
    reason: lexical_alternative
  - marker: c
    text: Hay “gây khốn khó cho anh em” hoặc “áp bức anh em.” Động từ Hê-bơ-rơ có thể bao hàm nhiều mức độ gây hại mang tính thù nghịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: đuổi
  rationale: Thể Hiphil của ירשׁ ở đây chỉ việc khiến cư dân hiện tại mất chỗ và phải rời khỏi xứ; “đuổi” tự nhiên, rõ nghĩa và giữ được sức mạnh của hành động.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: cư dân của xứ ấy
  rationale: Diễn đạt tự nhiên cấu trúc phân từ chỉ những người đang cư ngụ trong xứ; “xứ ấy” nối rõ với miền đất đang được nói đến.
- source_word: מִפְּנֵיכֶם
  choice: khỏi trước mặt mình
  rationale: Giữ hình ảnh không gian của thành ngữ Hê-bơ-rơ, tức loại bỏ họ khỏi phía trước mặt Israel, đồng thời dùng đại từ phản thân tự nhiên theo chủ ngữ “anh em”.
- source_word: תּוֹתִירוּ
  choice: anh em để lại
  rationale: Thể Hiphil của יתר có nghĩa để cho còn lại. “Để lại” rõ và không thêm sắc thái thương xót như “tha”.
- source_word: לְשִׂכִּים
  choice: gai nhọn
  rationale: Danh từ hiếm này chỉ vật sắc đâm chích. “Gai nhọn” giữ hình ảnh đau đớn và phù hợp với vị trí “trong mắt”; chú thích nêu khả năng dịch cụ thể hơn.
- source_word: בְּעֵינֵיכֶם
  choice: trong mắt anh em
  rationale: Bản dịch trực tiếp, dễ hiểu và bảo toàn ẩn dụ thân thể sống động.
- source_word: לִצְנִינִם
  choice: chông
  rationale: Từ này chỉ vật sắc nhọn gây đâm đau, có thể hiểu là gai hoặc móc. “Chông” phân biệt nó với “gai nhọn” ở vế trước mà vẫn giữ cặp hình ảnh xuyên đâm.
- source_word: בְּצִדֵּיכֶם
  choice: nơi sườn anh em
  rationale: “Sườn” diễn đạt tự nhiên bộ phận cơ thể được chỉ bởi צַד và giữ nguyên hình ảnh về nỗi đau dai dẳng.
- source_word: וְצָרֲרוּ
  choice: họ sẽ quấy nhiễu anh em
  rationale: צרר có thể chỉ hành động thù nghịch, gây khốn khó hoặc áp bức. “Quấy nhiễu” phù hợp với sự gây hại liên tục mà không thu hẹp quá mức cường độ của động từ.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: trên đất anh em đang cư ngụ
  rationale: “Trên đất” phản ánh עַל và vẫn tự nhiên trong tiếng Việt; “đang cư ngụ” giữ sắc thái hiện thời của phân từ.
