revisions:
- from: Nhưng nếu anh em không đuổi cư dân của xứ ấy khỏi trước mặt mình, thì những kẻ anh em để lại trong số họ sẽ trở thành gai nhọn trong mắt anh em[a] và chông nơi sườn anh em[b]; họ sẽ quấy nhiễu anh em trên đất anh em đang cư ngụ.[c]
  to: Nhưng nếu anh em không đuổi cư dân của xứ ấy khỏi trước mặt anh em, thì những kẻ anh em để lại trong số họ sẽ trở thành mũi nhọn trong mắt anh em[a] và gai nhọn nơi sườn anh em[b]; họ sẽ quấy nhiễu anh em trên đất anh em đang cư ngụ.[c]
  rationale: Bản sửa thay “chông” bằng “gai nhọn” để tránh sắc thái cọc/bẫy quá cụ thể, trong khi vẫn giữ hình ảnh vật sắc gây đau và sự phân biệt tương đối với “mũi nhọn” ở vế trước. Đại từ được làm rõ thành “anh em” để phù hợp với chủ ngữ số nhiều. Các chú thích, vị trí ký hiệu, và ý nghĩa câu vẫn được giữ nguyên.
