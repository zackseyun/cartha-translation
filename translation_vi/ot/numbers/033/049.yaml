  text: וַ/יַּחֲנ֤וּ עַל הַ/יַּרְדֵּן֙ מִ/בֵּ֣ית הַיְשִׁמֹ֔ת עַ֖ד אָבֵ֣ל הַשִּׁטִּ֑ים בְּ/עַֽרְבֹ֖ת מוֹאָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: vi
  text: Họ đóng trại bên sông Giô-đanh, từ Bết Ha-giê-si-mốt đến tận A-bên Ha-si-tim, trong đồng bằng Mô-áp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: Họ đóng trại
  rationale: Động từ חנה ở dạng kể chuyện chỉ chặng dừng tiếp theo của dân Israel; “đóng trại” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: עַל הַיַּרְדֵּן
  choice: bên sông Giô-đanh
  rationale: Với tên sông, עַל diễn tả vị trí ở cạnh hoặc ven sông, không nhất thiết là “trên”; thêm “sông” giúp câu tiếng Việt tự nhiên.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: từ Bết Ha-giê-si-mốt
  rationale: מִן đánh dấu điểm đầu của phạm vi nơi đóng trại. Địa danh được phiên âm, đồng thời giữ mạo từ Ha- vốn thuộc dạng tên trong bản Hê-bơ-rơ.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: đến tận A-bên Ha-si-tim
  rationale: עַד đánh dấu điểm cuối của phạm vi; “đến tận” thể hiện rõ khoảng trải dài. Địa danh được phiên âm theo âm Hê-bơ-rơ.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: trong đồng bằng Mô-áp
  rationale: עֲרָבוֹת chỉ vùng đất bằng, khô dạng thảo nguyên ven sông Giô-đanh; “đồng bằng” là cách diễn đạt rõ ràng, quen thuộc trong ngữ cảnh địa lý này.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện địa lý ngắn gọn, trang trọng nhưng dễ hiểu. Dùng các địa danh phiên âm nhất quán theo cách đọc gần tiếng Hê-bơ-rơ; không thêm chú thích vì câu chính đã diễn đạt trực tiếp các quan hệ địa lý.
