  yaml_path: translation/ot/numbers/033/016.yaml
  text: They set out from the wilderness of Sinai and camped at Kibroth-hattaavah[a].
translation:
  language: vi
  text: Họ rời khỏi hoang mạc Si-nai và đóng trại tại Kíp-rốt Ha-ta-a-va[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kíp-rốt Ha-ta-a-va có nghĩa là “những ngôi mộ của lòng ham muốn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình của Dân Số 33, נסע chỉ việc nhổ trại và lên đường. “Rời” diễn đạt tự nhiên trong tiếng Việt, đồng thời kết hợp rõ với nơi xuất phát.
- source_word: מִמִּדְבַּר סִינָי
  choice: hoang mạc Si-nai
  rationale: מִדְבָּר chỉ vùng hoang vu hoặc hoang mạc; “hoang mạc” là cách gọi địa lý tự nhiên, trang trọng, và giữ quan hệ với địa danh Si-nai.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: חנה là động từ quen thuộc trong các chặng hành trình, nghĩa là dừng lại và dựng trại. “Đóng trại” là cách nói hiện đại, rõ nghĩa.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: tại Kíp-rốt Ha-ta-va
  rationale: Cụm này được dùng như một địa danh nên được phiên âm trong chính văn; ý nghĩa từ nguyên được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc hành trình ngắn gọn của nguyên văn. Địa danh được phiên âm theo âm tiết phù hợp tiếng Việt, còn ý nghĩa tên gọi được đưa vào chú thích.
