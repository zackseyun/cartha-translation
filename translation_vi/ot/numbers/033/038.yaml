  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: vi
  text: A-rôn, thầy tế lễ, lên núi Hô-rơ theo lệnh Yahweh[a] và chết tại đó, vào năm thứ bốn mươi sau khi dân Y-sơ-ra-ên ra khỏi đất Ai Cập, trong tháng thứ năm, vào ngày mồng một của tháng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo lời của Yahweh”; sát nghĩa: “trên miệng của Yahweh.”'
    reason: Nêu cách dịch thành ngữ khác và bảo tồn hình ảnh của tiếng Hê-bơ-rơ עַל־פִּי.
lexical_decisions:
- source_word: וַיַּעַל
  choice: lên
  rationale: Động từ עלה chỉ sự đi lên; “lên núi” là cách diễn đạt tự nhiên và giữ nguyên hướng chuyển động.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Diễn đạt trực tiếp chức vụ của A-rôn bằng thuật ngữ Kinh Thánh quen thuộc, dễ hiểu trong tiếng Việt.
- source_word: אֶל הֹר הָהָר
  choice: lên núi Hô-rơ
  rationale: Hֹר הָהָר là địa danh Núi Hô-rơ; kết hợp với động từ “lên” tạo câu tiếng Việt tự nhiên.
- source_word: עַל פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: Thành ngữ này theo nghĩa đen là “theo miệng của Yahweh,” nhưng trong ngữ cảnh diễn tả hành động tuân theo mệnh lệnh của Ngài.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: וַיָּמָת שָׁם
  choice: và qua đời tại đó
  rationale: “Qua đời” là cách nói trang trọng, tự nhiên cho מוּת, còn “tại đó” giữ rõ trạng từ chỉ nơi chốn.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: vào năm thứ bốn mươi
  rationale: Phản ánh trực tiếp công thức ghi niên đại của tiếng Hê-bơ-rơ.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: kể từ khi dân Y-sơ-ra-ên ra khỏi
  rationale: Cụm nguyên mẫu với לְ xác định cuộc xuất hành làm mốc tính thời gian; “dân Y-sơ-ra-ên” chỉ cả dân tộc.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: đất Ai Cập
  rationale: Giữ danh từ “đất” trong nguyên văn, đồng thời phù hợp cách diễn đạt tiếng Việt.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי בְּאֶחָד לַחֹדֶשׁ
  choice: nhằm ngày mồng một tháng năm
  rationale: Chuyển công thức lịch “trong tháng thứ năm, vào ngày thứ nhất của tháng” sang cách ghi ngày tháng tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của עַל־פִּי יְהוָה
  choice: theo lệnh của Yahweh
  alternative: theo lời của Yahweh
  rationale: Trong ngữ cảnh, thành ngữ nói đến sự tuân theo chỉ thị của Yahweh. Bản dịch chính dùng “lệnh” cho rõ, còn chú thích bảo tồn cách hiểu “lời” và hình ảnh nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “thầy tế lễ,” “dân Y-sơ-ra-ên” và công thức ngày tháng tự nhiên trong tiếng Việt; giữ tên riêng Yahweh và đặt dấu chú thích ngay sau tên.
