  text: וְ/הִתְנַחַלְתֶּם֩ אֶת הָ/אָ֨רֶץ בְּ/גוֹרָ֜ל לְ/מִשְׁפְּחֹֽתֵי/כֶ֗ם לָ/רַ֞ב תַּרְבּ֤וּ אֶת נַחֲלָת/וֹ֙ וְ/לַ/מְעַט֙ תַּמְעִ֣יט אֶת נַחֲלָת֔/וֹ אֶל֩ אֲשֶׁר יֵ֨צֵא ל֥/וֹ שָׁ֛מָּ/ה הַ/גּוֹרָ֖ל ל֣/וֹ יִהְיֶ֑ה לְ/מַטּ֥וֹת אֲבֹתֵי/כֶ֖ם תִּתְנֶחָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: vi
  text: Các ngươi phải phân chia đất làm sản nghiệp bằng cách bắt thăm, theo từng thị tộc. Đối với nhóm đông người, các ngươi phải tăng phần sản nghiệp của họ; đối với nhóm ít người, các ngươi phải giảm phần sản nghiệp của họ. Lá thăm chỉ định cho người nào nơi nào, thì nơi đó sẽ thuộc về người ấy.[a] Các ngươi phải nhận phần sản nghiệp theo các chi phái của tổ phụ mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Nơi nào lá thăm rơi cho người ấy, thì nơi đó sẽ thuộc về người ấy.”'
    reason: Giữ lại hình ảnh và cấu trúc không gian của thành ngữ Hê-bơ-rơ, vốn được diễn đạt tự nhiên hơn trong chính văn.
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: Các ngươi phải chia đất làm sản nghiệp
  rationale: Dạng hitpael của נחל trong ngữ cảnh phân chia đất vừa mang ý nhận đất làm sản nghiệp vừa có sắc thái phân bổ. Cách dịch này giữ chủ đề sản nghiệp mà vẫn diễn đạt tự nhiên hành động chia đất.
- source_word: בְּגוֹרָל
  choice: bằng cách bắt thăm
  rationale: גּוֹרָל chỉ phương thức phân định phần đất bằng lá thăm; “bắt thăm” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: theo từng thị tộc
  rationale: מִשְׁפָּחָה ở đây là đơn vị thân tộc nằm trong cơ cấu chi phái, rộng hơn gia đình hạt nhân; “thị tộc” giữ được sắc thái xã hội này.
- source_word: לָרַב ... וְלַמְעַט
  choice: Nhóm đông người ... nhóm ít người
  rationale: Hai cụm từ đối lập nói đến quy mô dân số của các nhóm nhận đất. Cách dịch này làm rõ sự so sánh vốn hàm chứa trong ngữ cảnh mà không thêm một tiêu chuẩn phân chia khác.
- source_word: תַּרְבּוּ אֶת נַחֲלָתוֹ ... תַּמְעִיט אֶת נַחֲלָתוֹ
  choice: phải được phần sản nghiệp lớn hơn ... phải được phần sản nghiệp nhỏ hơn
  rationale: Diễn đạt kết quả của việc làm tăng hoặc giảm phần נַחֲלָה theo lối tiếng Việt tự nhiên, đồng thời giữ thuật ngữ giao ước “sản nghiệp”.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל לֹו יִהְיֶה
  choice: Lá thăm chỉ cho ai nơi nào thì nơi ấy sẽ thuộc về người đó
  rationale: Chuyển thành ngữ Hê-bơ-rơ “lá thăm đi ra” sang cách diễn đạt tiếng Việt rõ nghĩa, nhưng vẫn giữ quan hệ trực tiếp giữa kết quả bắt thăm và quyền sở hữu.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: theo các chi phái của tổ phụ mình
  rationale: מַטֶּה trong ngữ cảnh Y-sơ-ra-ên là chi phái, còn אֲבוֹת chỉ dòng dõi tổ phụ; cách dịch bảo toàn cấu trúc tổ tiên–chi phái.
- source_word: תִּתְנֶחָלוּ
  choice: phải nhận phần sản nghiệp
  rationale: Lần dùng נחל ở cuối câu nhấn mạnh việc mỗi nhóm nhận đất làm sản nghiệp theo cơ cấu chi phái.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “các ngươi” phản ánh lời truyền trực tiếp cho cộng đồng số nhiều; “thị tộc”, “chi phái”, “tổ phụ” duy trì các cấp độ thân tộc của bối cảnh Y-sơ-ra-ên. Chính văn ưu tiên cách nói tiếng Việt rõ ràng, còn chú thích bảo lưu lối diễn đạt sát hình thức Hê-bơ-rơ.
