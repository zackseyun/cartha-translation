base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/036.yaml
  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: vi
  text: Họ rời Ê-xi-ôn Ghê-be rồi đóng trại trong hoang mạc Xin, tức là Ca-đe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đó là Ca-đe.” Đại từ Hê-bơ-rơ dùng để xác định địa điểm vừa nêu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình của Dân Số Ký 33, נסע chỉ việc nhổ trại và lên đường. “Rời” diễn đạt tự nhiên điểm xuất phát khi đi với מֵ־, đồng thời không thêm chi tiết ngoài nguyên văn.
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: Ê-xi-ôn Ghê-be
  rationale: Địa danh được phiên âm theo cách đọc Hê-bơ-rơ và quy ước chính tả tiếng Việt; giới từ מֵ־ được thể hiện bằng cấu trúc “rời [địa điểm]”.
- source_word: וַיַּחֲנוּ
  choice: rồi đóng trại
  rationale: חנה có nghĩa là dựng hoặc đóng trại. “Rồi” thể hiện diễn tiến nối tiếp của waw trong bản tường thuật hành trình.
- source_word: בְמִדְבַּר צִן
  choice: trong hoang mạc Xin
  rationale: מִדְבָּר chỉ vùng hoang vu, khô cằn nhưng không nhất thiết là sa mạc cát; “hoang mạc” giữ được phạm vi nghĩa địa lý rộng. Xin là dạng phiên âm của צִן.
- source_word: הִוא
  choice: tức là
  rationale: Đại từ giống cái số ít có chức năng đồng vị, xác định địa điểm vừa nêu là Ca-đe. “Tức là” diễn đạt tự nhiên chức năng giải thích này, nhưng một cách hiểu sát hình thức hơn vẫn là “đó là”.
- source_word: קָדֵשׁ
  choice: Ca-đe
  rationale: Địa danh được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức hành trình ngắn gọn; dùng các dạng địa danh quen thuộc trong tiếng Việt và bảo lưu sắc thái xác định của הִוא bằng chú thích.
