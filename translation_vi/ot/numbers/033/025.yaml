  text: וַ/יִּסְע֖וּ מֵ/חֲרָדָ֑ה וַֽ/יַּחֲנ֖וּ בְּ/מַקְהֵלֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/025.yaml
  text: They set out from Haradah and camped at Makheloth[a].
translation:
  language: vi
  text: Họ rời Ha-ra-đa và đóng trại tại Ma-kê-lốt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ lên đường từ Ha-ra-đa và hạ trại tại Ma-kê-lốt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình qua hoang mạc, động từ נסע chỉ việc nhổ trại và lên đường khỏi một địa điểm. “Rời” tự nhiên, súc tích trong tiếng Việt và làm rõ điểm xuất phát được nêu ngay sau đó.
- source_word: מֵחֲרָדָה
  choice: Ha-ra-đa
  rationale: Tiền tố מֵ chỉ nguồn hay điểm xuất phát, được thể hiện trong động từ “rời”. Tên địa danh được phiên âm sang tiếng Việt thay vì dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong các chặng hành trình có nghĩa là dựng hoặc đóng trại. “Đóng trại” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בְּמַקְהֵלֹת
  choice: tại Ma-kê-lốt
  rationale: Giới từ בְ trước địa danh ở đây chỉ nơi dừng trại, nên dịch là “tại”. Tên riêng được phiên âm theo âm Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp với công thức liệt kê các chặng hành trình. Các địa danh được phiên âm nhất quán, có dấu gạch nối để người đọc phổ thông dễ phát âm.
