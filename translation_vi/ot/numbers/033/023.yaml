  source_fidelity: 'Cấu trúc câu bám sát công thức hành trình của tiếng Hê-bơ-rơ: họ rời một địa điểm rồi đóng trại tại một ngọn núi. Tuy nhiên, dạng «Sê-phe» không phản ánh tốt nguyên âm Masoretic của שָׁפֶר (šāper); chú thích hiện có cũng gọi «Sa-phe» là dạng khác nhưng thực chất phù hợp hơn với nguyên văn.'
  naturalness: «Họ rời khỏi … và đóng trại tại núi …» là văn phong hiện đại, tự nhiên và vẫn giữ được tính cô đọng của danh sách các chặng đường.
  terminology: «Đóng trại» chuyển đạt phù hợp חנה trong ngữ cảnh hành trình. «Núi Sa-phê» giữ הַר và phiên âm địa danh theo tiếng Hê-bơ-rơ; cách viết «phê» biểu thị nguyên âm e phù hợp hơn «phe».
  issues:
