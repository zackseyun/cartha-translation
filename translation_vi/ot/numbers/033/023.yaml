  yaml_path: translation/ot/numbers/033/023.yaml
  text: They set out from Kehelathah and camped at Mount Shepher[a].
translation:
  language: vi
  text: Họ rời khỏi Kê-hê-la-tha và đóng trại tại núi Sa-phê[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể phiên âm là “Sê-phe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình ở Dân Số 33, נסע chỉ việc nhổ trại và lên đường. “Rời” tự nhiên, ngắn gọn và kết hợp rõ với địa danh có giới từ מִן.
- source_word: מִקְּהֵלָתָה
  choice: Kê-hê-la-tha
  rationale: Đây là địa danh קְהֵלָתָה với giới từ מִן, được phiên âm sang tiếng Việt thay vì dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: חנה trong các danh sách chặng đường chỉ việc dựng hoặc đóng trại; “đóng trại” là cách nói hiện đại, rõ nghĩa.
- source_word: בְּהַר
  choice: tại núi
  rationale: הַר có thể là núi hoặc vùng đồi núi; khi đứng trước một tên riêng trong danh sách trạm dừng, “núi” là cách hiểu phù hợp, còn ב được diễn đạt tự nhiên bằng “tại”.
- source_word: שָׁפֶר
  choice: Sê-phe
  rationale: Phiên âm địa danh theo cách đọc Masoretic šāpher, điều chỉnh cho âm và chính tả tiếng Việt; giữ một dạng phiên âm khác trong chú thích.
