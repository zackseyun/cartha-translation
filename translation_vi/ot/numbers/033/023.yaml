    rationale: Tên שָׁפֶר được đọc là šāper; âm đầu sau š phù hợp với «Sa-» hơn «Sê-». Vì vậy «Sê-phe» không nên là dạng chính, nhất là khi chú thích đã nêu «Sa-phe» như một khả năng.
  - severity: low
    issue: «Họ rời Kê-hê-la-tha» có thể được hiểu tự nhiên, nhưng chưa biểu thị rõ giới từ מִן.
    rationale: Thêm «khỏi» làm rõ quan hệ ‘từ/rời khỏi’ của nguyên văn mà không làm câu nặng nề.
  revised_text: Họ rời khỏi Kê-hê-la-tha và đóng trại tại núi Sa-phê[a].
