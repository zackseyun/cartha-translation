  text: וַ/יִּסְע֖וּ מִ/מֹּסֵר֑וֹת וַֽ/יַּחֲנ֖וּ בִּ/בְנֵ֥י יַעֲקָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: vi
  text: Họ rời Mô-sê-rốt và đóng trại tại Bê-nê Gia-a-can[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hê-bơ-rơ Bê-nê Gia-a-can có nghĩa đen là “các con trai của Gia-a-can”, nhưng ở đây được dùng làm địa danh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình ở đồng hoang, động từ נסע chỉ việc nhổ trại và lên đường. “Rời” tự nhiên, gọn và kết hợp rõ với địa điểm có giới từ מִן (“khỏi/từ”).
- source_word: מִמֹּסֵרֹות
  choice: Mô-sê-rốt
  rationale: Giới từ מִן được thể hiện trong động từ “rời”; địa danh מֹסֵרוֹת được phiên âm theo âm vị tiếng Việt thay vì dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong danh sách hành trình có nghĩa là dựng/đóng trại. “Đóng trại” là cách nói hiện đại, rõ nghĩa và trang trọng vừa phải.
- source_word: בִּבְנֵי יַעֲקָן
  choice: tại Bê-nê Gia-a-can
  rationale: Cụm này có nghĩa đen là “các con trai của Gia-a-can” nhưng tại đây hoạt động như một địa danh. Giới từ ב được dịch tự nhiên là “tại” khi nói về nơi đóng trại.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, sáng rõ và trang nghiêm; giữ nhịp ngắn gọn của danh sách hành trình. Các địa danh được phiên âm và có dấu gạch nối để người đọc phổ thông dễ phát âm.
