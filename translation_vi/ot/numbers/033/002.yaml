id: NUM.33.2
reference: Numbers 33:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת מוֹצָאֵי/הֶ֛ם לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וְ/אֵ֥לֶּה מַסְעֵי/הֶ֖ם לְ/מוֹצָאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: vi
  text: Môi-se ghi lại những nơi họ xuất phát[b] theo các chặng hành trình của họ, theo lệnh của Yahweh[a]; và đây là các chặng hành trình của họ theo những nơi họ xuất phát.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “theo miệng của Yahweh”, một thành ngữ có nghĩa là “theo lệnh của Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ được dịch là “những nơi họ xuất phát” cũng có thể dịch là “những lần họ khởi hành” hoặc “những lần họ đi ra”.
    reason: lexical_alternative
  - marker: c
    text: 'Câu này cố ý đảo thứ tự hai ý: “những nơi họ xuất phát theo các chặng hành trình” rồi “các chặng hành trình theo những nơi họ xuất phát”.'
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: ghi lại
  rationale: Dạng động từ kể chuyện chỉ hành động trong quá khứ; “ghi lại” diễn đạt việc lập thành văn bản tự nhiên hơn “viết” mà không thêm ý quá mức.
- source_word: מוֹצָאֵיהֶם
  choice: những nơi họ xuất phát
  rationale: מוֹצָא có thể chỉ hành động hoặc nơi đi ra. Trong bảng hành trình này, cách dịch cụ thể theo địa điểm là tự nhiên, đồng thời vẫn giữ quan hệ đối ứng với các chặng hành trình.
- source_word: לְמַסְעֵיהֶם
  choice: theo các chặng hành trình của họ
  rationale: מַסָּע có thể chỉ việc nhổ trại hoặc một chặng đường; “chặng hành trình” phù hợp ngữ cảnh liệt kê, còn giới từ לְ được hiểu theo quan hệ tương ứng “theo”.
- source_word: עַל־פִּי יְהוָה
  choice: theo lệnh của Yahweh
  rationale: עַל־פִּי theo nghĩa đen là “theo miệng”, nhưng là thành ngữ chỉ mệnh lệnh hay sự chỉ dẫn; danh riêng giao ước יְהוָה được phiên là “Yahweh”.
- source_word: וְאֵלֶּה
  choice: và đây là
  rationale: Cụm từ mở đầu danh sách kế tiếp; thì hiện tại trong tiếng Việt phù hợp khi giới thiệu nội dung sắp được thuật lại.
- source_word: מַסְעֵיהֶם
  choice: các chặng hành trình của họ
  rationale: Diễn đạt rõ những chặng liên tiếp trong bảng hành trình, dễ hiểu đối với độc giả hiện đại.
- source_word: לְמוֹצָאֵיהֶם
  choice: theo những nơi họ xuất phát
  rationale: 'Giữ cùng cách hiểu của מוֹצָאֵיהֶם và bảo toàn sự đảo thứ tự có chủ ý: nơi xuất phát—chặng hành trình, rồi chặng hành trình—nơi xuất phát.'
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יְהוָה; phiên âm “Yahweh” bảo tồn danh riêng và không biến nó thành một tước hiệu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “chặng hành trình” để thể hiện tính chất của một bảng lộ trình; giữ cấu trúc đảo tương ứng của nguyên văn dù sự lặp lại hơi nổi bật trong tiếng Việt.
