base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: vi
  text: Họ rời Ê-lim và đóng trại bên Biển Đỏ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Biển Sậy.” Tên Hê-bơ-rơ Yam Suf theo truyền thống được dịch là “Biển Đỏ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Động từ נסע trong công thức hành trình chỉ việc rời một chặng để tiếp tục lên đường; “rời” tự nhiên, gọn và phù hợp với chuỗi địa danh.
- source_word: מֵאֵילִם
  choice: Ê-lim
  rationale: Giới từ מִן chỉ nơi xuất phát; אֵילִם là địa danh, được phiên âm theo cách quen dùng trong tiếng Việt.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה là động từ thường dùng trong các bản liệt kê hành trình, chỉ việc dựng hoặc lập trại; “đóng trại” là cách diễn đạt hiện đại, rõ nghĩa.
- source_word: עַל
  choice: bên
  rationale: Trong ngữ cảnh đóng trại cạnh một vùng nước, עַל diễn tả vị trí sát hoặc bên cạnh hơn là ở trên bề mặt.
- source_word: יַם סוּף
  choice: Biển Đỏ
  rationale: Đây là cách dịch truyền thống và là tên địa lý quen thuộc; nghĩa sát chữ có thể là “Biển Sậy,” nên phương án ấy được giữ trong chú thích.
