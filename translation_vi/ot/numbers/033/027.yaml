  text: וַ/יִּסְע֖וּ מִ/תָּ֑חַת וַֽ/יַּחֲנ֖וּ בְּ/תָֽרַח׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/027.yaml
  text: They set out from Tahath and camped at Terah.
translation:
  language: vi
  text: Họ rời Ta-hát và đóng trại tại Tê-rách.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, נסע chỉ việc nhổ trại để đi tiếp. “Rời” diễn đạt tự nhiên, gọn rõ trong tiếng Việt và kết hợp thích hợp với địa điểm có giới từ מִן.
- source_word: מִתָּחַת
  choice: Ta-hát
  rationale: Giới từ מִן được thể hiện trong động từ “rời”; địa danh תָּחַת được phiên âm là “Ta-hát” để gần âm Hê-bơ-rơ và dễ đọc bằng tiếng Việt.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong các ghi chép hành trình có nghĩa là dựng hoặc đóng trại; “đóng trại” là cách nói hiện đại, rõ nghĩa.
- source_word: בְּתָרַח
  choice: tại Tê-rách
  rationale: Giới từ בְּ trước địa điểm dừng chân được dịch tự nhiên là “tại”; תָּרַח được phiên âm “Tê-rách” theo cách đọc Hê-bơ-rơ và quy ước âm tiết tiếng Việt.
theological_decisions: []
translation_notes:
  register: Câu văn ngắn gọn, trang trọng vừa phải và phù hợp với công thức liệt kê hành trình; tên riêng được phiên âm có gạch nối để người đọc tiếng Việt dễ nhận biết các âm tiết.
