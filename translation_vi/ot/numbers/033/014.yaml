base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: vi
  text: Họ rời A-lút và đóng trại tại Rê-phi-đim, nhưng ở đó không có nước cho dân uống.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, נסע chỉ việc nhổ trại và lên đường. “Rời” tự nhiên trong tiếng Việt và kết hợp rõ với địa điểm xuất phát.
- source_word: מֵאָלוּשׁ
  choice: A-lút
  rationale: Địa danh được phiên âm sang tiếng Việt, không dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: חנה là động từ quen thuộc chỉ việc dựng hoặc lập trại; “đóng trại” là cách nói hiện đại, rõ nghĩa.
- source_word: בִּרְפִידִם
  choice: tại Rê-phi-đim
  rationale: Địa danh được phiên âm; “tại” phù hợp với địa điểm dừng chân và đóng trại.
- source_word: וְלֹא הָיָה שָׁם
  choice: nhưng ở đó không có
  rationale: Liên từ waw mở đầu một hoàn cảnh bất lợi tương phản với việc đóng trại; “nhưng” diễn đạt tự nhiên sắc thái này mà không thêm ý.
- source_word: מַיִם
  choice: nước
  rationale: Nghĩa thông thường của מַיִם trong ngữ cảnh.
- source_word: לָעָם
  choice: cho dân chúng
  rationale: עָם chỉ toàn thể dân Y-sơ-ra-ên trong hành trình; “dân chúng” là cách diễn đạt phổ thông và rõ ràng.
- source_word: לִשְׁתּוֹת
  choice: uống
  rationale: 'Động từ nguyên mẫu nêu mục đích hoặc công dụng: nước để dân chúng uống.'
