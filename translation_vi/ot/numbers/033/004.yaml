id: NUM.33.4
reference: Numbers 33:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: vi
  text: Trong khi người Ai Cập đang chôn cất những người Yahweh đã đánh chết trong số họ, tức mọi con đầu lòng. Yahweh đã thi hành các phán xét trên các thần của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Yahweh đã thi hành các phán xét chống lại các thần của họ.”'
    reason: Giới từ ב trong cụm này có thể được diễn đạt là phán xét giáng “trên” hoặc được thực hiện “chống lại” các thần Ai Cập.
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: trong khi người Ai Cập đang chôn
  rationale: Danh từ đi với phân từ tạo mệnh đề hoàn cảnh, diễn tả hành động đang tiếp diễn làm bối cảnh; “trong khi… đang” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם
  choice: những người mà Yahweh đã đánh chết giữa họ
  rationale: Giữ cấu trúc quan hệ của tiếng Hê-bơ-rơ. “Đánh chết” bảo lưu hình ảnh của נכה đồng thời thể hiện rõ kết quả gây chết trong ngữ cảnh tai vạ con đầu lòng; “giữa họ” chỉ cộng đồng người Ai Cập.
- source_word: כָּל בְּכוֹר
  choice: tức mọi con đầu lòng
  rationale: Cụm danh từ đồng vị xác định những người vừa được nhắc đến. “Tức” làm rõ quan hệ đồng vị mà không biến nó thành sở hữu “con đầu lòng của họ” vốn không được nêu trực tiếp trong nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וּבֵאלֹהֵיהֶם
  choice: trên các thần của họ
  rationale: Giữ sắc thái gần với giới từ ב trong thành ngữ đi cùng việc thi hành phán xét; “các thần của họ” không bị diễn giải thành nhà cai trị hay thần tượng.
- source_word: עָשָׂה יְהוָה שְׁפָטִים
  choice: Yahweh cũng đã thi hành các cuộc phán xét
  rationale: Thành ngữ “làm các phán xét” chỉ việc thực hiện những hành động xét xử. “Thi hành các cuộc phán xét” trang trọng, rõ nghĩa và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; giữ danh riêng tránh thay thế nó bằng tước hiệu.
- issue: Đối tượng của các cuộc phán xét
  choice: các thần của họ
  alternative: các thần tượng hoặc các nhà cai trị của họ
  rationale: אֱלֹהִים trong văn cảnh nói thẳng đến các thần của Ai Cập; bản dịch không thu hẹp thành thần tượng vật chất hay diễn giải thành giới cầm quyền.
- issue: Sắc thái của giới từ ב trước “các thần của họ”
  choice: trên các thần của họ
  alternative: chống lại các thần của họ
  rationale: “Trên” bám sát hình thức Hê-bơ-rơ và vẫn cho thấy phán xét giáng xuống đối tượng; chú thích lưu lại cách hiểu đối nghịch tự nhiên hơn nhưng mạnh hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc đồng vị “những người… tức mọi con đầu lòng” để phản ánh trật tự và điểm nhấn của nguyên văn, đồng thời dùng hai câu nhằm tránh một câu tiếng Việt quá nặng.
