    rationale: “Các cuộc phán xét” không phải cách kết hợp từ gọn tự nhiên trong ngữ cảnh này; “các phán xét” phù hợp hơn. “Cũng” không có đối ứng cần thiết trong nguyên văn và có thể bỏ mà không mất quan hệ phối hợp.
