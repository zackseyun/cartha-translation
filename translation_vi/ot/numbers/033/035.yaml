base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/035.yaml
  text: They set out from Abronah and camped at Ezion-geber.
translation:
  language: vi
  text: Họ rời Áp-rô-na và đóng trại tại Ê-xi-ôn Ghê-be.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và lên đường khỏi một địa điểm; “rời” tự nhiên, gọn và phù hợp với sự bổ nghĩa của “khỏi/từ” trong nguyên văn.
- source_word: מֵעַבְרֹנָה
  choice: Áp-rô-na
  rationale: Tiền tố מֵ mang nghĩa xuất phát “khỏi/từ”; trong cấu trúc tiếng Việt, nghĩa này đã được thể hiện tự nhiên bằng động từ “rời”. עַבְרֹנָה là địa danh nên được phiên âm.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong danh sách các chặng hành trình được diễn đạt tự nhiên và chính xác bằng “đóng trại”.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: tại Ê-xi-ôn Ghê-be
  rationale: Giới từ בְּ chỉ địa điểm nên dịch là “tại”; עֶצְיוֹן גָּבֶר là địa danh kép và được phiên âm theo cách dễ đọc trong tiếng Việt.
