base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/028.yaml
  text: They set out from Terah and camped at Mithkah.
translation:
  language: vi
  text: Họ rời Ta-rách và đóng trại tại Mít-ca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và lên đường khỏi một chặng. “Rời” diễn đạt tự nhiên điểm xuất phát được nêu ngay sau đó mà không thêm ý ngoài nguyên văn.
- source_word: מִתָּרַח
  choice: Ta-rách
  rationale: Tiền tố מִן chỉ nơi xuất phát, được thể hiện bằng cấu trúc tiếng Việt “rời Ta-rách”. תָּרַח là địa danh nên được phiên âm.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה trong danh sách hành trình có nghĩa dừng lại và dựng trại. “Đóng trại” là cách nói hiện đại, rõ nghĩa và giữ được hình ảnh cụ thể.
- source_word: בְּמִתְקָה
  choice: tại Mít-ca
  rationale: Tiền tố בְּ chỉ địa điểm; “tại” phù hợp với văn phong tường thuật hành trình. מִתְקָה là địa danh nên được phiên âm là “Mít-ca”.
