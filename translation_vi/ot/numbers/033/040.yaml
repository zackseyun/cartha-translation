- from: Vua A-rát, người Ca-na-an sống tại Nê-ghép[a] trong đất Ca-na-an, nghe tin con dân Y-sơ-ra-ên đang tiến đến.
  to: Vua A-rát, người Ca-na-an, vốn cư ngụ tại Nê-ghép[a] trong đất Ca-na-an, đã nghe tin khi con cái Y-sơ-ra-ên đến.
  rationale: Thay “đang tiến đến” bằng “đến” để không thêm sắc thái tiếp diễn hay đích đến; thay “con dân” bằng “con cái” để phản ánh rõ hơn danh xưng בְּנֵי יִשְׂרָאֵל mà vẫn tự nhiên trong tiếng Việt. “Đã nghe tin” diễn đạt tự nhiên động từ “nghe” với nội dung được ngầm hiểu, không xác định thêm nội dung của tin.
