  text: וַ/יִּשְׁמַ֗ע הַֽ/כְּנַעֲנִי֙ מֶ֣לֶךְ עֲרָ֔ד וְ/הֽוּא יֹשֵׁ֥ב בַּ/נֶּ֖גֶב בְּ/אֶ֣רֶץ כְּנָ֑עַן בְּ/בֹ֖א בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: vi
  text: Vua A-rát, người Ca-na-an, vốn cư ngụ tại Nê-ghép[a] trong đất Ca-na-an, đã nghe tin khi con cái Y-sơ-ra-ên đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nê-ghép” cũng có thể dịch là “miền nam” hoặc “vùng phía nam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe tin
  rationale: Động từ שׁמע có nghĩa cơ bản là “nghe”; vì tân ngữ được ngầm hiểu, “nghe tin” là cách diễn đạt tự nhiên trong tiếng Việt mà không xác định thêm nội dung của tin.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: Vua A-rát, người Ca-na-an
  rationale: Cách diễn đạt này giữ cả địa vị “vua A-rát” và căn tính Ca-na-an, đồng thời tự nhiên hơn trong tiếng Việt so với việc xếp nhiều danh từ liên tiếp.
- source_word: וְהוּא יֹשֵׁב
  choice: sống
  rationale: Đại từ kèm phân từ cung cấp thông tin nền về nơi cư trú; “sống” trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại.
- source_word: בַּנֶּגֶב
  choice: tại Nê-ghép
  rationale: Giữ tên địa lý của miền nam Ca-na-an thay vì đồng nhất hoàn toàn với phương nam; chú thích nêu nghĩa thay thế.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: trong đất Ca-na-an
  rationale: Giữ danh từ אֶרֶץ và trọng tâm địa lý của nguyên văn.
- source_word: בְּבֹא
  choice: đang tiến đến
  rationale: Cấu trúc בְּ + động từ nguyên mẫu chỉ thời điểm khi Y-sơ-ra-ên đến. “Tiến đến” phù hợp với ngữ cảnh hành trình và không tự ý thêm một đích đến; “đang” thể hiện hoàn cảnh đồng thời.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “các con trai của Y-sơ-ra-ên” nhưng thường chỉ toàn thể dân Y-sơ-ra-ên; “con dân” tự nhiên, bao quát cộng đồng mà vẫn gợi quan hệ dòng dõi.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc câu giữ thông tin nền về nơi cư trú nhưng tránh lối dịch quá sát gây nặng nề. Dùng “con dân Y-sơ-ra-ên” cho danh xưng cộng đồng, không giới hạn ý nghĩa vào nam giới.
