base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/019.yaml
  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: vi
  text: Họ rời Rít-ma và đóng trại tại Rim-môn Phê-rết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ lên đường từ Rít-ma và hạ trại tại Rim-môn Phê-rết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, động từ נסע chỉ việc nhổ trại và lên đường. “Rời” diễn đạt tự nhiên, súc tích việc khởi hành khỏi địa điểm vừa nêu.
- source_word: מֵרִתְמָה
  choice: Rít-ma
  rationale: Tiền tố מִן chỉ nơi xuất phát và đã được thể hiện trong động từ “rời”. Địa danh được phiên âm sang tiếng Việt.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה là động từ quen dùng trong các chặng hành trình, nghĩa là dựng hoặc đóng trại; “đóng trại” là cách nói hiện đại, rõ nghĩa.
- source_word: בְּרִמֹּן פָּרֶץ
  choice: tại Rim-môn Phê-rết
  rationale: Giới từ בְּ đánh dấu địa điểm, nên dịch là “tại”. Địa danh ghép được phiên âm theo từng thành tố và nối bằng dấu gạch ngang.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; duy trì công thức hành trình ngắn gọn của nguyên văn Hê-bơ-rơ. Dùng “rời… đóng trại tại…” làm lối diễn đạt tự nhiên, đồng thời ghi phương án sát hình thức hơn trong chú thích.
