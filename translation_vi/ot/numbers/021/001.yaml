source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: vi
  text: Khi vua của A-rát, người Ca-na-an đang sống ở Nê-ghép, nghe tin Y-sơ-ra-ên đang tiến đến theo đường A-tha-rim[a], ông giao chiến với Y-sơ-ra-ên và bắt một số người trong họ làm tù binh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “theo đường A-tha-rim.” Từ “A-tha-rim” không rõ nghĩa; một số người hiểu đây là địa danh, còn một số khác, dựa theo các bản dịch cổ, hiểu là “các thám tử” hoặc “những người do thám.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe tin
  rationale: Trong văn thuật sự, שׁמע chỉ việc nhận được tin tức; “nghe tin” tự nhiên trong tiếng Việt và làm rõ mối liên hệ với mệnh đề theo sau.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: vua Ca-na-an ở A-rát
  rationale: Cụm này nhận diện vị vua theo dân tộc và lãnh địa. Cách diễn đạt tránh khiến “Ca-na-an” bị hiểu là tên nước theo nghĩa hiện đại, đồng thời giữ A-rát là địa danh.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: là người sống tại Nê-ghép
  rationale: Phân từ יֹשֵׁב diễn tả nơi cư trú; giữ Nê-ghép như tên vùng địa lý thay vì khái quát thành “miền nam”.
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: Y-sơ-ra-ên đang tiến đến
  rationale: Sau động từ “nghe”, כִּי dẫn nội dung tin tức. Trong ngữ cảnh nói đến đường tiếp cận và phản ứng quân sự, “đang tiến đến” diễn đạt tiến trình mà không khẳng định họ đã tới nơi.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: theo đường A-tha-rim
  rationale: דֶּרֶךְ là đường hoặc lộ trình; אֲתָרִים có nghĩa không chắc chắn nên được phiên âm thận trọng và giải thích trong chú thích.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: ông giao chiến với Y-sơ-ra-ên
  rationale: Dạng động từ chiến trận với בְּ diễn tả sự đối địch; “giao chiến với” rõ ràng mà không suy diễn quy mô cuộc xung đột.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: bắt một số người trong dân làm tù binh
  rationale: Động từ שׁבה và danh từ cùng gốc שֶׁבִי nói về việc bắt người trong chiến tranh. מִמֶּנּוּ quy chiếu về tập thể Y-sơ-ra-ên và mang ý phân bộ phận; cách dịch này tự nhiên và không xác định số lượng.
