translation_notes:
  register: Văn phong thuật sự hiện đại, trang trọng và dễ hiểu. Dùng các dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt; giữ tên vùng Nê-ghép và thuật ngữ khó A-tha-rim để bảo toàn tính cụ thể cũng như sự mơ hồ của nguyên ngữ.
