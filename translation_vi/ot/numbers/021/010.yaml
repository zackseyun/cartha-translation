  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנ֖וּ בְּ/אֹבֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/010.yaml
  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: vi
  text: Sau đó, người Israel lên đường và đóng trại tại Ô-bốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: lên đường
  rationale: Trong văn cảnh hành trình nơi hoang mạc, נסע chỉ việc rời trại để đi sang chặng kế tiếp. “Lên đường” tự nhiên trong tiếng Việt hiện đại và diễn đạt rõ tiến trình hành trình.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm từ theo nghĩa đen là “các con trai của Israel,” nhưng ở đây là danh xưng tập thể chỉ dân Israel. “Con dân Israel” giữ được liên hệ với hình ảnh hậu duệ mà không khiến độc giả hiểu rằng chỉ có nam giới.
- source_word: וַיַּחֲנוּ
  choice: đóng trại
  rationale: Động từ חנה là từ thông dụng trong các trình thuật hành trình để chỉ việc dừng lại và lập trại. “Đóng trại” rõ ràng, tự nhiên và trang trọng vừa phải.
- source_word: בְּאֹבֹת
  choice: tại Ô-bốt
  rationale: אֹבֹת là địa danh, vì vậy được phiên âm thay vì dịch nghĩa. Giới từ “tại” phù hợp tự nhiên với động từ “đóng trại” trong tiếng Việt.
- source_word: וַ
  choice: Sau đó
  rationale: Tiền tố waw ở đầu câu đẩy trình thuật sang sự việc kế tiếp. “Sau đó” thể hiện rõ trình tự nối tiếp trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, sáng rõ và trang nghiêm. Dùng “con dân Israel” như một danh xưng tập thể tự nhiên trong tiếng Việt, thay vì dịch máy móc là “các con trai của Israel.” Phiên âm địa danh theo lối tiếng Việt là “Ô-bốt.”
