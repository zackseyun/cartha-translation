source:
  edition: WLC
  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֗/ךָ לֹ֤א נִטֶּה֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר בְּ/דֶ֤רֶךְ הַ/מֶּ֨לֶךְ֙ נֵלֵ֔ךְ עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבֻלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: vi
  text: “Xin cho tôi đi qua đất của ngài. Chúng tôi sẽ không rẽ vào đồng ruộng hay vườn nho, cũng không uống nước giếng. Chúng tôi sẽ đi theo con đường của vua[a] cho đến khi ra khỏi địa phận của ngài.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đường hoàng gia” hoặc, theo cách truyền thống, “đại lộ của vua”.'
    reason: Giữ các khả năng dịch của בְּדֶרֶךְ הַמֶּלֶךְ, có thể được hiểu theo nghĩa đen là con đường của vua hoặc theo nghĩa chức năng là tuyến đường chính của hoàng gia.
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Xin cho chúng tôi đi qua
  rationale: Động từ cohortative ngôi thứ nhất số ít diễn đạt lời thỉnh cầu trong bối cảnh ngoại giao; tiếng Việt tự nhiên dùng đại từ tập thể “chúng tôi” vì người nói đại diện cho toàn dân, phù hợp với các động từ số nhiều tiếp theo.
- source_word: בְאַרְצְךָ
  choice: đất của ngài
  rationale: אֶרֶץ ở đây chỉ vùng đất thuộc quyền cai quản của vua; “đất của ngài” rõ nghĩa, trang trọng vừa phải và giữ được hình ảnh địa lý.
- source_word: לֹא נִטֶּה
  choice: chúng tôi sẽ không rẽ
  rationale: נטה trong ngữ cảnh hành trình nghĩa là rẽ khỏi tuyến đường; “không rẽ” tự nhiên và giữ hình ảnh chuyển hướng.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: vào đồng ruộng hay vườn nho
  rationale: Hai danh từ số ít mang nghĩa khái quát về đất canh tác; “đồng ruộng hay vườn nho” diễn đạt tự nhiên trong tiếng Việt.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: cũng không uống nước giếng
  rationale: Cụm sở thuộc có nghĩa đen là “nước của giếng”; “uống nước giếng” ngắn gọn, hiện đại và cho thấy họ cam kết không sử dụng nguồn nước địa phương.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: đi theo con đường của vua
  rationale: Cụm từ có nghĩa đen là “trên/theo đường của vua”, có thể chỉ tuyến đường chính hoặc đường hoàng gia; cách dịch này giữ cấu trúc nguồn và tránh áp đặt rằng đây là một tên riêng.
- source_word: נֵלֵךְ
  choice: chúng tôi sẽ đi
  rationale: הלך là động từ thông dụng chỉ việc đi hoặc di chuyển; cách dịch đơn giản, rõ ràng.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבֻלֶךָ
  choice: cho đến khi ra khỏi địa phận của ngài
  rationale: גְּבוּל cơ bản là ranh giới nhưng trong ngữ cảnh vượt qua một vùng lãnh thổ, thành ngữ tiếng Việt “ra khỏi địa phận” truyền đạt tự nhiên điểm kết thúc của hành trình mà không làm mất ý niệm về ranh giới.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” để thể hiện lời thỉnh cầu ngoại giao gửi đến một vị vua; dùng “chúng tôi” vì người nói đại diện cho dân Israel. Dấu ngoặc kép cho thấy đây là nội dung sứ điệp được trích dẫn trong mạch văn.
