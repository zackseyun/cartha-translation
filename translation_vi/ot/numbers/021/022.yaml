  source_fidelity: 'Cần giữ sự chuyển đổi có chủ ý trong tiếng Hê-bơ-rơ: động từ mở đầu אֶעְבְּרָה là cohortative ngôi thứ nhất số ít (“xin cho tôi đi qua”), trong khi các cam kết tiếp theo ở số nhiều. Bản nháp chuyển ngay sang “chúng tôi” nên làm mất chi tiết này. Cụm “ra khỏi địa phận của ngài” diễn đạt đúng ý kết thúc việc đi qua lãnh thổ, dù từ גְּבוּל là “ranh giới/biên giới.”'
