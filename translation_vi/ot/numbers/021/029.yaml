revisions:
- from: Khốn cho ngươi, hỡi Mô-áp! Ngươi tiêu vong rồi, hỡi dân của Kê-mốt! Nó đã khiến các con trai mình phải chạy trốn, còn các con gái mình bị bắt làm tù binh và trao vào tay Si-hôn, vua dân A-mô-rít.[a]
  to: Khốn cho ngươi, hỡi Mô-áp! Ngươi tiêu vong rồi, hỡi dân của Kê-mốt! Kê-mốt đã nộp các con trai mình làm những kẻ chạy trốn, và các con gái mình làm phu tù cho Si-hôn, vua dân A-mô-rít.[a]
  rationale: 'Sửa cấu trúc để một động từ “đã nộp” chi phối hai thành phần song song như tiếng Hê-bơ-rơ, đồng thời giữ cách hiểu chính về Kê-mốt mà không dùng đại từ “Nó.” Chú thích được sửa để phản ánh đúng sự mơ hồ của hậu tố sở hữu: chỉ đối tượng sở hữu có thể là Mô-áp; chủ ngữ của động từ không vì thế trở thành Mô-áp.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:32:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng lời than trực tiếp, sự tiêu vong của Mô-áp, và cách hiểu chính rằng các hậu tố số ít quy chiếu về Kê-mốt. Tuy nhiên, câu hiện tại khiến cụm “và trao vào tay Si-hôn” chỉ bổ nghĩa cho “các con gái,” trong khi động từ נָתַן chi phối cả hai vế song song. Chú thích thay thế cũng đổi sai chủ ngữ từ Kê-mốt sang Mô-áp, thay vì chỉ đổi đối tượng quy chiếu của các hậu tố.
  naturalness: '“Nó đã khiến ... phải chạy trốn” và “bị bắt làm tù binh” đều tự nhiên, nhưng cấu trúc phối hợp hiện có bị lệch: các con trai chỉ bị khiến chạy trốn, còn các con gái mới bị trao cho Si-hôn. Nêu rõ Kê-mốt làm chủ ngữ ở câu sau cũng tự nhiên hơn đại từ “Nó” sau lời hô gọi.'
  terminology: Các tên Mô-áp, Kê-mốt, Si-hôn và A-mô-rít nhất quán, phù hợp thông lệ tiếng Việt. “Khốn cho,” “tiêu vong,” và “dân của Kê-mốt” phù hợp văn cảnh thơ ca chế nhạo. “Phu tù” diễn tả gọn và trang trọng tình trạng bị bắt đi lưu đày.
  issues:
  - severity: medium
    issue: Cụm “và trao vào tay Si-hôn” chỉ gắn ngữ pháp với các con gái.
    rationale: Trong tiếng Hê-bơ-rơ, נָתַן (“đã trao/đã nộp”) chi phối cả “các con trai ... những kẻ chạy trốn” lẫn “các con gái ... trong cảnh bị bắt,” với Si-hôn là đối tượng nhận. Bản sửa đặt Si-hôn sau cả hai vế để không giới hạn hành động trao nộp vào các con gái.
  - severity: high
    issue: Chú thích cách hiểu thay thế đổi Kê-mốt thành chủ ngữ Mô-áp.
    rationale: Cách đọc thay thế được nêu trong audit trail chỉ hiểu hậu tố “các con trai nó/các con gái nó” là quy về Mô-áp, chứ không thay đổi chủ ngữ ngầm của động từ “đã trao/nộp,” vốn vẫn là Kê-mốt theo cách phân tích đang được trình bày.
