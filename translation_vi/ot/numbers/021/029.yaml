source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤י/ו פְּלֵיטִם֙ וּ/בְנֹתָ֣י/ו בַּ/שְּׁבִ֔ית לְ/מֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: vi
  text: Khốn cho ngươi, hỡi Mô-áp! Ngươi tiêu vong rồi, hỡi dân của Kê-mốt! Kê-mốt đã nộp các con trai mình làm những kẻ chạy trốn, và các con gái mình làm phu tù cho Si-hôn, vua dân A-mô-rít.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Kê-mốt đã nộp các con trai của Mô-áp làm những kẻ chạy trốn, và các con gái của Mô-áp làm phu tù,” nếu hiểu các hậu tố là chỉ Mô-áp chứ không phải Kê-mốt.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Khốn cho
  rationale: Diễn đạt lời than về tai họa, đồng thời giữ sức nặng của câu thơ chế nhạo và phán xét.
- source_word: אָבַדְתָּ
  choice: ngươi tiêu vong rồi
  rationale: Thể hiện tổn thất mang tính thảm họa và lời nói trực tiếp với Mô-áp; “rồi” truyền đạt sắc thái hoàn tất của động từ mà vẫn tự nhiên trong tiếng Việt.
- source_word: עַם כְּמוֹשׁ
  choice: dân của Kê-mốt
  rationale: Giữ quan hệ sở thuộc hoặc gắn bó trong kết cấu Hê-bơ-rơ, chỉ dân tộc được đồng nhất với Kê-mốt.
- source_word: נָתַן
  choice: đã khiến … và trao vào tay
  rationale: Động từ có nghĩa cơ bản là “trao, nộp”; trong cấu trúc thơ này nó dẫn đến tình trạng các con trai phải chạy trốn và các con gái bị bắt. Cách dịch kết hợp vừa tự nhiên vừa giữ ý bị giao vào quyền Si-hôn.
- source_word: בָּנָיו
  choice: các con trai mình
  rationale: Giữ giống đực và quan hệ quy chiếu ngôi thứ ba số ít, với Kê-mốt là tiền ngữ gần nhất; “mình” cũng không xóa hẳn khả năng quy chiếu khác của hậu tố.
- source_word: פְּלֵיטִם
  choice: phải chạy trốn
  rationale: Truyền đạt hình ảnh những người thoát chạy sau thất bại, rõ và tự nhiên hơn danh từ “những kẻ đào thoát” trong tiếng Việt hiện đại.
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: các con gái mình bị bắt làm tù binh
  rationale: Giữ thế song song với “các con trai mình” và diễn đạt rõ tình trạng bị bắt đi trong cảnh lưu đày.
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: vào tay Si-hôn, vua dân A-mô-rít
  rationale: “Vào tay” diễn đạt tự nhiên hướng đích và sự lệ thuộc sau khi bị trao nộp; cụm đồng vị xác định Si-hôn là vua của dân A-mô-rít.
theological_decisions:
- issue: Đối tượng được các hậu tố ngôi thứ ba số ít trong “các con trai mình” và “các con gái mình” quy chiếu
  choice: Quy chiếu đến Kê-mốt
  alternative: Quy chiếu tập thể đến Mô-áp, nghĩa là “con trai của Mô-áp” và “con gái của Mô-áp”
  rationale: Kê-mốt là tiền ngữ trực tiếp gần nhất, và câu thơ chế nhạo sự bất lực của thần Mô-áp qua cảnh con dân của thần ấy bị giao nộp. Tuy nhiên, vì Mô-áp cũng có thể được nhân cách hóa như một cá thể, bản dịch ghi nhận cách hiểu thay thế trong chú thích.
translation_notes:
  register: 'Văn phong thơ ca trang trọng nhưng dễ hiểu. “Ngươi” phù hợp với lời gọi trực tiếp trong khúc ca chế nhạo; “Khốn cho” giữ sức nặng tiên tri. Đại từ “nó” tránh dành kính ngữ cho thần ngoại bang và duy trì khả năng quy chiếu cần được chú thích. Tên riêng dùng dạng phiên âm quen thuộc trong tiếng Việt: Mô-áp, Kê-mốt, Si-hôn, A-mô-rít.'
