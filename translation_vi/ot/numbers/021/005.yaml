    issue: “thứ bánh tệ hại này” chưa diễn đạt tối ưu sắc thái của קְלֹקֵל
    rationale: Tính từ hiếm này biểu lộ sự coi khinh, khinh miệt đối với thức ăn. “Tệ hại” dễ được hiểu là một nhận định khách quan về chất lượng; “đáng khinh” nêu rõ hơn thái độ khinh chê của người nói.
  - severity: low
