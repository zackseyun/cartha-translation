base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: vi
  text: 'Dân chúng nói chống lại Đức Chúa Trời và Môi-se: “Tại sao hai vị đã đưa chúng tôi ra khỏi Ai Cập để chết trong hoang mạc? Vì chẳng có bánh, cũng chẳng có nước, và chúng tôi ghê tởm thứ bánh đáng khinh này[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thứ bánh tệ hại này” hoặc “thứ bánh vô giá trị này.” Tính từ Hê-bơ-rơ ở đây rất hiếm và bộc lộ thái độ khinh chê đối với thức ăn Đức Chúa Trời đã ban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: Dân chúng nói lời chống lại Đức Chúa Trời và Môi-se
  rationale: Trong ngữ cảnh lời nói mang tính buộc tội, דּבר với ב được diễn đạt theo nghĩa đối nghịch. “Nói lời chống lại” tự nhiên trong tiếng Việt và không cường điệu thành phạm thượng.
- source_word: לָמָה הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: Tại sao các vị đưa chúng tôi ra khỏi Ai Cập
  rationale: Động từ ở ngôi thứ hai số nhiều, phù hợp với việc lời trách cứ hướng đến cả Đức Chúa Trời lẫn Môi-se. “Đưa… ra khỏi” diễn đạt tự nhiên hành động xuất hành mà không làm mất sắc thái nguyên ngữ.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: để chết trong hoang mạc
  rationale: Giữ quan hệ mục đích/kết quả của động từ nguyên mẫu và dùng “hoang mạc” cho vùng hoang vu, không nhất thiết chỉ là sa mạc cát.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: Vì ở đây chẳng có bánh, cũng chẳng có nước
  rationale: Giữ “bánh” thay vì khái quát thành “thức ăn” để bảo toàn sự lặp lại đầy mỉa mai với “bánh” ở cuối câu. “Ở đây” được thêm theo ngữ cảnh địa điểm để câu tiếng Việt tự nhiên.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: và chúng tôi ghê tởm
  rationale: Cụm Hê-bơ-rơ nói theo nghĩa đen về נפשׁ của họ trở nên chán ghét; cách diễn đạt bằng động từ này truyền tải mạnh sự ngán ghét trong tiếng Việt.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: thứ bánh tệ hại này
  rationale: קְלֹקֵל là tính từ hiếm, biểu thị thái độ khinh chê đối với thức ăn được ban cho. “Tệ hại” tự nhiên, rõ nghĩa và vẫn giữ sự đánh giá miệt thị của dân chúng; “thứ… này” diễn đạt lối chỉ trỏ hàm ẩn trong lời than phiền.
theological_decisions:
- issue: Tính chất lời nói của dân chúng đối với Đức Chúa Trời
  choice: Diễn đạt là “nói lời chống lại”
  alternative: “nói với” hoặc “nói về” Đức Chúa Trời và Môi-se
  rationale: Nội dung trích dẫn là lời buộc tội và oán trách, nên cách dịch trung tính sẽ làm nhẹ đi tính chống nghịch. Đây là quyết định theo ngữ cảnh và ngữ nghĩa, không phải bổ sung giáo lý.
- issue: Đối tượng số nhiều trong câu hỏi trách móc
  choice: Giữ ngôi thứ hai số nhiều bằng “các vị”
  alternative: Lược chủ ngữ hoặc chuyển thành số ít, chỉ nhắm đến Môi-se
  rationale: Hình thái הֶעֱלִיתֻנוּ là ngôi thứ hai giống đực số nhiều và câu trước nêu cả Đức Chúa Trời lẫn Môi-se. Bản dịch giữ sự căng thẳng của việc dân chúng quy trách nhiệm cho cả hai mà không diễn giải thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các vị” giữ số nhiều của nguyên ngữ mà không dùng đại từ quá suồng sã khi lời nói đồng thời hướng đến Đức Chúa Trời và Môi-se. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
