base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: vi
  text: Từ đó, họ lên đường và đóng trại tại khe Xê-rết[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thung lũng Xê-rết”, “khe núi Xê-rết” hoặc “suối Xê-rết”; từ Hê-bơ-rơ naḥal có thể chỉ một khe núi, lòng suối theo mùa hoặc dòng suối.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Từ đó
  rationale: Diễn tả việc rời địa điểm vừa được nhắc đến và giữ mạch kể tự nhiên trong tiếng Việt.
- source_word: נָסָעוּ
  choice: họ lên đường
  rationale: Trong các trình thuật hành trình, động từ נסע thường chỉ việc nhổ trại để tiếp tục đi; “lên đường” tự nhiên và đúng sắc thái.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Động từ חנה có nghĩa là dựng hoặc đóng trại; cách nói này rõ ràng, hiện đại và phù hợp bối cảnh hành trình.
- source_word: בְּנַחַל
  choice: tại khe
  rationale: נַחַל có thể chỉ khe núi, lòng suối cạn theo mùa hoặc dòng suối. “Khe” phù hợp địa hình vùng hoang mạc, còn “tại” không xác định quá mức là ở trong hay ở bên cạnh địa điểm ấy.
- source_word: זָרֶד
  choice: Xê-rết
  rationale: Đây là địa danh; phiên âm sang tiếng Việt thay vì dịch nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng nhưng tự nhiên trong tiếng Việt hiện đại. “Tại khe” giữ được tính khái quát về địa hình và tránh giải quyết dứt khoát sắc thái không hoàn toàn xác định của danh từ נַחַל cùng giới từ בְּ.
