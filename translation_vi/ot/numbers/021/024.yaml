  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: vi
  text: Y-sơ-ra-ên dùng lưỡi gươm đánh ông và chiếm lấy đất của ông, từ sông Ác-nôn đến sông Gia-bốc, cho đến con cháu Am-môn[a], vì biên giới của con cháu Am-môn vững chắc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói tự nhiên hơn: “cho đến dân Am-môn” hoặc “cho đến người Am-môn”; ở cuối câu: “biên giới của dân Am-môn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: đánh ông
  rationale: Giữ nghĩa trực tiếp của נכה là “đánh”, không diễn giải quá mức thành “giết” hay “đánh chết”; đại từ chỉ Si-hôn trong văn cảnh trước.
- source_word: לְפִי חָרֶב
  choice: bằng lưỡi gươm
  rationale: Bảo tồn hình ảnh của thành ngữ Hê-bơ-rơ, theo nghĩa đen là “bằng miệng/lưỡi gươm”, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: וַיִּירַשׁ
  choice: chiếm lấy
  rationale: Trong bối cảnh quân sự và với “đất” làm tân ngữ, cụm này diễn đạt việc giành quyền sở hữu lãnh thổ mà không gợi sai sang nghĩa thừa kế.
- source_word: אַרְצוֹ
  choice: đất của ông
  rationale: Là cách chuyển ngữ trực tiếp của אֶרֶץ và phù hợp với phạm vi lãnh thổ được mô tả.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: từ sông Ác-nôn đến sông Gia-bốc
  rationale: Cặp giới từ xác định phạm vi lãnh thổ; thêm “sông” giúp độc giả hiện đại nhận biết rõ hai địa danh này.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: cho đến lãnh thổ của con cháu Am-môn
  rationale: Giới từ עַד ở đây chỉ giới hạn không gian tiếp giáp dân Am-môn; thêm “lãnh thổ của” làm rõ ý địa lý vốn hàm chứa, còn “con cháu Am-môn” giữ hình ảnh thân tộc của nguyên văn.
- source_word: כִּי
  choice: vì
  rationale: Nêu lý do cuộc chiếm đất dừng ở ranh giới Am-môn.
- source_word: עַז
  choice: rất vững chắc
  rationale: עַז mang nghĩa mạnh, kiên cố; trong quan hệ với “biên giới”, “vững chắc” tự nhiên hơn “mạnh” trong tiếng Việt mà không cụ thể hóa thành công sự.
- source_word: גְּבוּל
  choice: biên giới
  rationale: Diễn đạt tự nhiên giới hạn lãnh thổ giữa các dân trong ngữ cảnh này.
- source_word: בְּנֵי עַמּוֹן
  choice: con cháu Am-môn
  rationale: Bảo tồn lối nói thân tộc “các con trai của Am-môn” nhưng dùng cách nói tiếng Việt có chức năng đại diện dân tộc rõ ràng hơn.
theological_decisions:
- issue: Cách dịch בְּנֵי עַמּוֹן
  choice: con cháu Am-môn
  alternative: dân Am-môn / người Am-môn
  rationale: Cụm Hê-bơ-rơ dùng danh từ thân tộc giống đực để chỉ toàn thể dân tộc. “Con cháu Am-môn” giữ được hình ảnh nguồn, còn chú thích cung cấp cách nói dân tộc tự nhiên hơn.
- issue: Ý nghĩa sức mạnh của biên giới Am-môn
  choice: biên giới ... rất vững chắc
  alternative: biên giới ... mạnh / kiên cố
  rationale: Không xác định nguyên nhân là địa hình, phòng thủ hay công sự; cách dịch giữ sự khái quát của עַז và không giải quyết sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt. Câu giữ trình tự tường thuật của tiếng Hê-bơ-rơ, đồng thời thêm “sông” và “lãnh thổ của” để quan hệ địa lý rõ ràng trong tiếng Việt.
