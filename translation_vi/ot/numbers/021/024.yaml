    rationale: Nguyên văn nói “cho đến con cháu Am-môn,” còn “lãnh thổ” chỉ là hàm ý có thể có từ ngữ cảnh. Việc bổ sung làm mất tính trực tiếp và phần nào giải quyết trước sự uyển chuyển của cụm nguồn.
  - severity: low
    issue: Từ “rất” trong “rất vững chắc.”
    rationale: עַז có nghĩa “mạnh/vững chắc”; không có yếu tố tăng cường tương ứng trong nguyên văn.
