  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: vi
  text: Y-sơ-ra-ên chiếm tất cả các thành này. Y-sơ-ra-ên cư ngụ trong mọi thành của người A-mô-rít, trong Hết-bôn và trong tất cả các thị trấn phụ thuộc của nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “và trong tất cả các con gái của nó”, một thành ngữ chỉ những khu định cư nhỏ phụ thuộc vào một thành lớn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: chiếm
  rationale: Động từ לקח có nghĩa cơ bản là “lấy”; trong bối cảnh quân sự, “chiếm” diễn đạt tự nhiên hành động giành lấy các thành mà không thêm sắc thái quá mức.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: tất cả các thành ấy
  rationale: Giữ đầy đủ ý nghĩa của כָּל và đại từ chỉ định; “thành” là cách gọi trang trọng, tự nhiên trong văn cảnh cổ đại.
- source_word: וַיֵּשֶׁב
  choice: cư ngụ
  rationale: ישב ở đây nói đến việc ở trong các thành đã chiếm. “Cư ngụ” giữ được nghĩa ở/định cư mà không nhất thiết khẳng định một quá trình lập cư lâu dài.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: trong mọi thành của người A-mô-rít
  rationale: Phản ánh trực tiếp kết cấu sở thuộc trong tiếng Hê-bơ-rơ và dùng dạng tên dân tộc dễ hiểu trong tiếng Việt.
- source_word: בְּחֶשְׁבּוֹן
  choice: Hết-bôn
  rationale: Phiên âm địa danh Hê-bơ-rơ חֶשְׁבּוֹן theo lối tên riêng Kinh Thánh quen dùng trong tiếng Việt.
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: và tất cả các thị trấn phụ thuộc của thành ấy
  rationale: Nghĩa đen là “và mọi con gái của nó”, một thành ngữ chỉ những khu định cư nhỏ lệ thuộc thành chính. Bản dịch chuyển nghĩa để người đọc hiện đại hiểu rõ, còn nghĩa đen được bảo tồn trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chiếm” cho bối cảnh quân sự, “cư ngụ” để giữ độ rộng nghĩa của ישב, và giải nghĩa thành ngữ “các con gái” ngay trong câu với chú thích bảo tồn hình ảnh nguyên văn.
