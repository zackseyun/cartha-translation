- from: Y-sơ-ra-ên chiếm tất cả các thành ấy rồi cư ngụ trong mọi thành của người A-mô-rít, kể cả Hết-bôn và tất cả các thị trấn phụ thuộc của thành ấy.[a]
  to: Y-sơ-ra-ên chiếm tất cả các thành này. Y-sơ-ra-ên cư ngụ trong mọi thành của người A-mô-rít, trong Hết-bôn và trong tất cả các thị trấn phụ thuộc của nó.[a]
  rationale: Bản sửa giữ sát hơn hai mệnh đề thuật sự và sự lặp lại chủ ngữ trong tiếng Hê-bơ-rơ; đồng thời diễn đạt rõ chuỗi địa điểm “trong Hết-bôn và trong tất cả các con gái của nó.” “Các thị trấn phụ thuộc” chuyển tải nghĩa thành ngữ mà không áp đặt mức độ hành chính cụ thể, còn hình ảnh nghĩa đen được bảo tồn trong chú thích.
