  terminology: “Israel,” “sứ giả,” “Si-hôn,” và “A-mô-rít” nhất quán với lối dùng Kinh Thánh tiếng Việt. “Sứ giả” phù hợp với ngữ cảnh ngoại giao của מַלְאָכִים.
