  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: vi
  text: 'Bấy giờ, Israel sai các sứ giả đến với Si-hôn, vua của người A-mô-rít, và nói rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Bấy giờ... sai
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “bấy giờ” thể hiện tự nhiên bước chuyển trong văn kể, còn “sai” là nghĩa cốt lõi của động từ.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Tên riêng ở đây chỉ dân Israel; giữ dạng quen dùng “Israel” trong tiếng Việt hiện đại.
- source_word: מַלְאָכִים
  choice: các sứ giả
  rationale: Trong bối cảnh ngoại giao, từ này chỉ những người được sai đi, không phải thiên sứ; “sứ giả” vừa chính xác vừa trang trọng, dễ hiểu.
- source_word: אֶל
  choice: đến gặp
  rationale: Giới từ chỉ hướng được diễn đạt tự nhiên theo ngữ cảnh người được phái đến một vị vua; “gặp” là hàm ý ngữ cảnh, không thay đổi nội dung.
- source_word: סִיחֹן
  choice: Si-hôn
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: vua dân A-mô-rít
  rationale: Cụm liên kết Hê-bơ-rơ có thể hiểu là vị vua cai trị dân A-mô-rít; cách diễn đạt này tự nhiên trong tiếng Việt và không cần một chú thích về trật tự tính từ như tiếng Anh.
- source_word: לֵאמֹר
  choice: và nói rằng
  rationale: Công thức nguyên ngữ dùng để dẫn vào lời nói trực tiếp ở câu kế tiếp; tiếng Việt tự nhiên dùng “và nói rằng”.
