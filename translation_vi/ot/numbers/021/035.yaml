base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: vi
  text: Họ đánh hạ ông, các con trai ông và toàn thể dân ông, không để lại cho ông một người sống sót nào; rồi họ chiếm lấy đất của ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: đánh hạ
  rationale: Trong bối cảnh chiến trận, נכה diễn tả việc đánh bại bằng vũ lực, thường dẫn đến chết chóc. “Đánh hạ” giữ được sắc thái cụ thể mà không thu hẹp động từ thành riêng “giết”.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Danh từ בנים ở dạng giống đực số nhiều; “các con trai” thể hiện chính xác giới tính được nêu trong bản Hê-bơ-rơ.
- source_word: כָּל עַמּוֹ
  choice: toàn thể dân ông
  rationale: עַם có nghĩa rộng là dân chúng thuộc quyền cai trị của Óc, không chỉ riêng quân đội.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: không để lại cho ông một người sống sót nào
  rationale: Cách diễn đạt này chuyển tự nhiên thành kết quả tuyệt đối của cuộc đánh hạ, đồng thời giữ cụm לוֹ, “cho ông”; שָׂרִיד trong ngữ cảnh chiến tranh là người sống sót.
- source_word: וַיִּירְשׁוּ
  choice: chiếm lấy
  rationale: ירשׁ ở đây chỉ việc giành quyền sở hữu lãnh thổ sau chiến thắng; “chiếm lấy” tự nhiên và phù hợp hơn “thừa hưởng” trong ngữ cảnh này.
- source_word: אַרְצוֹ
  choice: đất của ông
  rationale: אֶרֶץ chỉ lãnh thổ dưới quyền cai trị của Óc; “đất” giữ cách gọi rộng và quen thuộc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Giữ mức độ bạo lực cùng tính toàn diện của câu Hê-bơ-rơ, không giảm nhẹ “toàn thể dân” hay “không... một người sống sót nào”. Không thêm chú thích vì các lựa chọn thay thế không tạo ra khác biệt nội dung đáng kể cần thiết cho độc giả phổ thông.
