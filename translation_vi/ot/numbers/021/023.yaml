  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: vi
  text: Nhưng Si-hôn không cho phép Y-sơ-ra-ên đi qua lãnh thổ của mình.[a] Vì thế, Si-hôn tập hợp toàn dân mình[b] và đi ra hoang mạc để gặp Y-sơ-ra-ên. Si-hôn đến Gia-hát[c] và giao chiến với Y-sơ-ra-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi qua ranh giới của mình.”'
    reason: גְּבוּל có thể mang nghĩa “ranh giới” hoặc “lãnh thổ.”
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “toàn dân mình”; bản văn không nói rõ là “quân đội,” dù ngữ cảnh cho thấy đây là một lực lượng chiến đấu.'
    reason: Giữ lại phạm vi nghĩa của עַם và tránh diễn giải quá mức.
  - marker: c
    text: Tên địa danh này cũng có thể được phiên âm là “Gia-ha.”
    reason: Dạng địa danh יָהְצָה có nhiều quy ước phiên âm trong truyền thống Kinh Thánh.
lexical_decisions:
- source_word: נָתַן ... עֲבֹר
  choice: cho phép ... đi qua
  rationale: Trong cấu trúc này, נָתַן diễn tả sự cho phép, còn עֲבֹר chỉ việc đi qua vùng đất; cách dịch này vừa tự nhiên vừa sát nghĩa.
- source_word: בִּגְבֻלוֹ
  choice: qua lãnh thổ của mình
  rationale: גְּבוּל có thể chỉ ranh giới hoặc phần đất nằm trong ranh giới; ngữ cảnh nói về việc xin đi xuyên qua đất của Si-hôn nên “lãnh thổ” rõ nghĩa hơn.
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: tập hợp toàn dân mình
  rationale: Giữ nguyên cách nói “toàn dân” của tiếng Hê-bơ-rơ, không tự ý đổi thành “quân đội,” dù ngữ cảnh cho thấy đây là lực lượng chiến đấu.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: để đón đánh Y-sơ-ra-ên
  rationale: לִקְרַאת tự nó có thể là “đi gặp/đón,” nhưng trong ngữ cảnh Si-hôn huy động dân chúng và ngay sau đó giao chiến, “đón đánh” diễn đạt tự nhiên mục đích thù địch mà không thêm một hành động mới.
- source_word: הַמִּדְבָּרָה
  choice: tiến vào hoang mạc
  rationale: Hậu tố chỉ hướng -ָה diễn tả chuyển động về phía hoặc vào hoang mạc; “tiến vào” thể hiện rõ chuyển động ấy.
- source_word: יָהְצָה
  choice: Gia-ha
  rationale: Phiên âm địa danh Hê-bơ-rơ יָהַץ/יָהְצָה theo lối quen dùng trong tiếng Việt.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: giao chiến với Y-sơ-ra-ên
  rationale: Động từ לחם với ב diễn tả việc giao chiến chống lại một đối thủ; “giao chiến với” rõ ràng và tự nhiên trong văn thuật sự.
- source_word: וְלֹא
  choice: Nhưng ... không
  rationale: Liên từ mở đầu tạo thế tương phản với lời xin đi qua trước đó, nên “Nhưng” phù hợp hơn cách dịch máy móc là “Và ... không.”
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “mình” để quy chiếu tự nhiên về Si-hôn; giữ “toàn dân” thay vì diễn giải thành “quân đội.” Các tên riêng được phiên âm theo lối Kinh Thánh tiếng Việt quen thuộc.
