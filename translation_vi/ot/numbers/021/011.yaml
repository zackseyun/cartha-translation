base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/011.yaml
  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: vi
  text: Họ rời Ô-bốt và đóng trại tại I-giê A-ba-rim[a], trong vùng hoang mạc đối diện Mô-áp, về phía mặt trời mọc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên I-giê A-ba-rim cũng có thể được hiểu theo nghĩa là “những phế tích của A-ba-rim” hoặc “những đống đổ nát của A-ba-rim”; tuy nhiên, ở đây cụm từ này được dùng làm địa danh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Họ rời
  rationale: Trong công thức hành trình, נסע chỉ việc nhổ trại và lên đường; “rời” kết hợp tự nhiên với địa điểm xuất phát trong tiếng Việt.
- source_word: מֵאֹבֹת
  choice: Ô-bốt
  rationale: Địa danh được phiên âm theo lối quen thuộc, không dịch nghĩa.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Diễn đạt trực tiếp, tự nhiên nghĩa cụ thể của חנה trong tiếng Việt hiện đại.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: tại I-giê Ha-A-ba-rim
  rationale: Cụm từ hoạt động như một địa danh trong bản liệt kê hành trình; giữ dạng phiên âm trong chính văn, còn nghĩa từ nguyên được nêu ở chú thích.
- source_word: בַּמִּדְבָּר
  choice: trong vùng hoang mạc
  rationale: “Hoang mạc” diễn đạt vùng đất hoang vắng hoặc thảo nguyên khô, phù hợp ngữ cảnh hành trình mà không nhất thiết hàm ý sa mạc cát.
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: đối diện Mô-áp
  rationale: Trong mô tả địa lý, עַל־פְּנֵי mang nghĩa ở trước mặt, hướng về hoặc đối diện; “đối diện” rõ ràng và tự nhiên.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: về phía mặt trời mọc
  rationale: Giữ hình ảnh nguyên ngữ chỉ hướng đông, đồng thời diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các địa danh được phiên âm; hình ảnh “mặt trời mọc” được giữ lại thay vì giản lược thành “phía đông”.
