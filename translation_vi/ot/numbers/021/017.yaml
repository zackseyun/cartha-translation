  yaml_path: translation/ot/numbers/021/017.yaml
  text: 'Then Israel sang this song: “Spring up[a], O well! Answer it!”'
translation:
  language: vi
  text: 'Bấy giờ Israel hát bài ca này:


    “Giếng ơi, hãy trào lên![a]


    Hãy đáp lời nó!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Giếng ơi, hãy dâng lên!” Câu Hê-bơ-rơ có lẽ phản ánh lối hát xướng đáp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Bấy giờ
  rationale: Trạng từ thời gian mở đầu hành động tiếp theo trong mạch kể; “Bấy giờ” tự nhiên và trang trọng vừa phải.
- source_word: יָשִׁיר
  choice: hát
  rationale: Dù hình thức là chưa hoàn thành, khi đi với אָז trong văn kể, động từ mang nghĩa quá khứ; tiếng Việt không bắt buộc đánh dấu thì trên động từ.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Giữ dạng tên riêng quen dùng trong bản dịch này, chỉ toàn dân Israel.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: bài ca này
  rationale: Diễn đạt tự nhiên danh từ xác định kèm đại từ chỉ định và phù hợp với phần thơ ngay sau đó.
- source_word: עֲלִי
  choice: hãy trào lên
  rationale: Mệnh lệnh giống cái số ít hướng đến cái giếng; “trào lên” diễn đạt sinh động chuyển động của nước, đồng thời giữ hình ảnh thơ.
- source_word: בְאֵר
  choice: Giếng ơi
  rationale: Hô ngữ được thể hiện tự nhiên trong tiếng Việt bằng tiểu từ “ơi”.
- source_word: עֱנוּ לָהּ
  choice: Hãy đáp lời nó
  rationale: Giữ nghĩa căn bản “đáp lại/đáp lời” của ענה và sự mơ hồ về lối hát đối đáp, thay vì diễn giải hẳn thành “hãy hát cho giếng”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giếng ơi” để thể hiện hô ngữ thơ ca; xuống dòng theo cấu trúc bài ca. Đại từ “nó” giữ tham chiếu giống cái số ít của tiếng Hê-bơ-rơ về cái giếng mà không thêm cách giải nghĩa.
