language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: vi
  text: 'Vì thế, người ta nói trong Sách Các Cuộc Chiến của Yahweh rằng: “Va-hép[a] tại Xu-pha[b], và các khe suối của Ác-nôn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ của câu trích này rất tối nghĩa. Một số người hiểu “Va-hép” theo cách khác, thậm chí coi từ này là một phần của mệnh đề động từ chứ không phải địa danh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong bão tố” nếu Xu-pha được hiểu là danh từ chung thay vì địa danh.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn đạt tự nhiên công thức suy luận dùng để dẫn vào một lời trích dẫn, đồng thời giữ quan hệ nối kết với văn cảnh trước.
- source_word: יֵאָמַר
  choice: có câu
  rationale: Động từ Nifal được dùng theo lối vô nhân xưng để giới thiệu lời trích. Trong ngữ cảnh một sách được nêu tên, “có câu” tự nhiên hơn “người ta nói” mà không biến động từ thành “chép” một cách quá trực tiếp.
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: trong Sách Các Cuộc Chiến của Yahweh
  rationale: Giữ cấu trúc danh xưng của nguồn văn bản, số nhiều của מִלְחֲמֹת và danh riêng Yahweh.
- source_word: אֶת וָהֵב
  choice: Va-hép
  rationale: Hiểu וָהֵב theo khả năng cao là địa danh trong câu thơ cổ và phiên âm thay vì áp đặt một cách phân tích động từ còn nhiều tranh luận.
- source_word: בְּסוּפָה
  choice: tại Xu-pha
  rationale: Hiểu סוּפָה là địa danh; giới từ “tại” phù hợp tự nhiên trong tiếng Việt. Nghĩa danh từ chung “bão tố” được giữ trong chú thích.
- source_word: וְאֶת הַנְּחָלִים אַרְנוֹן
  choice: và các thung lũng suối của Ác-nôn
  rationale: נחל trong địa hình vùng này chỉ thung lũng hoặc khe có dòng nước, thường theo mùa. “Thung lũng suối” dễ hiểu hơn từ vay mượn “wadi” và vẫn giữ liên hệ địa lý với Ác-nôn.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA hoặc Giê-hô-va
  rationale: Giữ đây là danh riêng của Đức Chúa Trời trong nhan đề nguồn cổ, không thay bằng một tước hiệu; đồng thời phù hợp quy ước của dự án.
- issue: Tính tối nghĩa của câu thơ cổ được trích
  choice: Giữ Va-hép và Xu-pha như các địa danh, kèm chú thích về các cách hiểu khác
  alternative: Dịch thành một mệnh đề động từ và/hoặc hiểu סופה là “bão tố”
  rationale: Nguyên văn rất khó xác định; bản dịch chính chọn cách phân tích khả dĩ nhưng không âm thầm loại bỏ những khả năng ngữ nghĩa khác.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “có câu” để dẫn lời trích một cách tự nhiên; phiên âm các địa danh theo cách dễ đọc trong tiếng Việt. “Thung lũng suối” diễn đạt đặc điểm địa hình của נחל mà không dùng thuật ngữ ngoại lai khó hiểu.
