    rationale: Động từ Nifal vô nhân xưng giới thiệu lời được nói/trích dẫn. “Có câu” chỉ sự hiện diện của một câu trong sách, còn “người ta nói ... rằng” giữ được chức năng dẫn trích dẫn mà vẫn tự nhiên.
  - severity: medium
    issue: “các thung lũng suối” không tự nhiên
    rationale: Cụm này không phải cách kết hợp thông dụng trong tiếng Việt và khiến nghĩa của נְחָלִים kém rõ. “Các khe suối” diễn đạt phù hợp các lòng/khe nước theo mùa (wadi) trong ngữ cảnh.
