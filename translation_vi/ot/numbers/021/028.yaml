source:
  edition: WLC
  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: vi
  text: 'Vì lửa đã phát ra từ Hết-bôn,

    một ngọn lửa từ thành của Si-hôn;

    nó đã thiêu rụi A-rơ thuộc Mô-áp[a]

    và những người làm chủ các nơi cao bên Ác-nôn.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A-rơ” được hiểu là tên một địa điểm của Mô-áp; từ Hê-bơ-rơ cũng có thể được hiểu là “thành”.
    reason: lexical_alternative
  - marker: b
    text: Cụm Hê-bơ-rơ này khó hiểu. Có thể dịch là “những chủ nhân của các nơi cao bên Ác-nôn” hoặc “cư dân vùng cao bên Ác-nôn”. Một số cách hiểu xem toàn cụm như ám chỉ các vùng cao bên Ác-nôn.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu căn cứ của câu thơ trong văn cảnh.
- source_word: אֵשׁ ... לֶהָבָה
  choice: lửa ... một ngọn lửa
  rationale: Giữ hình ảnh cụ thể và phép song song thi ca giữa hai vế.
- source_word: יָצְאָה
  choice: đã phát ra
  rationale: Diễn đạt trực tiếp hình ảnh lửa đi ra từ một địa điểm, đồng thời phản ánh thể hoàn thành của động từ.
- source_word: מֵחֶשְׁבּוֹן
  choice: từ Hết-bôn
  rationale: Phiên âm địa danh theo cách đọc tự nhiên trong tiếng Việt.
- source_word: מִקִּרְיַת סִיחֹן
  choice: từ thành của Si-hôn
  rationale: קִרְיָה là danh từ chung chỉ thành hoặc đô thị; cấu trúc sở hữu được giữ rõ ràng.
- source_word: אָכְלָה
  choice: đã thiêu rụi
  rationale: Động từ nghĩa đen là ‘ăn, nuốt’ nhưng khi chủ thể là lửa mang nghĩa hủy diệt; ‘thiêu rụi’ tự nhiên trong tiếng Việt mà vẫn giữ sức mạnh của hình ảnh.
- source_word: עָר מוֹאָב
  choice: A-rơ thuộc Mô-áp
  rationale: Hiểu עָר là địa danh A-rơ, một địa điểm của Mô-áp, thay vì danh từ chung ‘thành’.
- source_word: בַּעֲלֵי
  choice: những người làm chủ
  rationale: Phản ánh trực tiếp danh từ số nhiều chỉ người sở hữu, người cai quản hoặc chủ nhân, không tự động đổi thành ‘cư dân’.
- source_word: בָּמוֹת אַרְנֹן
  choice: các nơi cao bên Ác-nôn
  rationale: בָּמוֹת có thể chỉ nơi cao hoặc các vùng cao; ‘bên Ác-nôn’ diễn đạt quan hệ địa lý tự nhiên mà không xác định quá mức.
theological_decisions:
- issue: Ý nghĩa của בַּעֲלֵי בָּמוֹת אַרְנֹן
  choice: những người làm chủ các nơi cao bên Ác-nôn
  alternative: cư dân vùng cao bên Ác-nôn; hoặc các vùng cao bên Ác-nôn
  rationale: Bản dịch chính giữ cấu trúc và nghĩa thông thường của bản Masoret, dù cách diễn đạt này khó và có thể được hiểu theo địa lý hoặc về những người chiếm hữu khu vực.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng hiện đại; giữ bốn vế song song và các hình ảnh lửa, ngọn lửa. Các địa danh được phiên âm dễ đọc trong tiếng Việt. Cách dịch không giải quyết dứt khoát cụm Hê-bơ-rơ khó ở cuối câu mà nêu các khả năng trong chú thích.
