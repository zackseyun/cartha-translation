source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Đừng sợ người ấy[a], vì Ta đã trao người ấy, toàn dân của người ấy và đất của người ấy vào tay con[b]. Con sẽ xử với người ấy như con đã xử với Si-hôn, vua của người A-mô-rít, người sống ở Hết-bôn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng khiếp sợ người ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ “trao vào tay con” là một thành ngữ, nghĩa là “trao vào quyền của con”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Yahweh
  rationale: Giữ nguyên danh giao ước được biểu thị bằng bốn phụ âm YHWH; thêm kính ngữ “Đức” để câu văn tiếng Việt tự nhiên và trang trọng.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Đừng sợ ông ta
  rationale: Diễn đạt trực tiếp lệnh cấm sợ hãi; “ông ta” giữ đại từ chỉ người của bản Hê-bơ-rơ mà không thêm sắc thái khinh miệt.
- source_word: בְיָדְךָ נָתַתִּי
  choice: Ta đã trao ... vào tay con
  rationale: Giữ hình ảnh thành ngữ “vào tay” và thể hoàn thành của động từ, qua đó diễn tả việc Đức Chúa Trời coi sự trao nộp là chắc chắn.
- source_word: אֹתוֹ וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: ông ta, cùng toàn thể dân chúng và đất đai của ông ta
  rationale: 'Bảo toàn cả ba đối tượng được trao: nhà vua, toàn dân của vua và lãnh thổ của vua.'
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Con sẽ làm cho ông ta như con đã làm
  rationale: Giữ cấu trúc so sánh trực tiếp và sắc thái tương lai của mệnh đề trong mạch kể, không giải thích cụ thể hành động hơn mức nguyên văn.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Si-hôn, vua dân A-mô-rít
  rationale: Chuyển âm các tên riêng theo lối dễ đọc trong tiếng Việt và thể hiện rõ tước hiệu cùng dân tộc của Si-hôn.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: là người từng sống tại Hết-bôn
  rationale: Phân từ יֹשֵׁב chỉ việc cư trú; “từng sống” phù hợp với nhân vật đã bị đánh bại trước đó và vẫn phản ánh nội dung của mệnh đề quan hệ.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Giữ “Yahweh” giúp phân biệt danh riêng này với tước hiệu “Chúa”, còn “Đức” tạo sắc thái kính trọng tự nhiên trong tiếng Việt.
- issue: Thể hoàn thành trong lời hứa נָתַתִּי
  choice: Ta đã trao
  alternative: Ta sẽ trao; Ta trao
  rationale: 'Cách dịch ở thì hoàn thành giữ sức căng của nguyên văn: chiến thắng chưa diễn ra trong mạch truyện nhưng được Đức Yahweh tuyên bố như việc đã chắc chắn hoàn tất.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” thể hiện lời Đức Chúa Trời nói trực tiếp với Môi-se mà tránh lối xưng hô quá cổ; các tên riêng được chuyển âm theo dạng quen thuộc, dễ đọc trong tiếng Việt. Hai dấu chú thích [a], [b] đều được đặt ngay tại cụm từ mà chú thích giải thích.
