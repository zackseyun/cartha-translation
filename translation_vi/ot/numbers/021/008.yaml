  to: 'Bấy giờ, Đức Giê-hô-va phán với Môi-se: “Hãy làm một con rắn lửa[a] và đặt nó trên một cây sào[b]. Bất cứ ai bị cắn mà nhìn nó thì sẽ sống.”'
  rationale: Chỉ sửa phần diễn giải không cần thiết “nhìn lên” thành “nhìn”, sát với động từ Hê-bơ-rơ mà vẫn tự nhiên. Chú thích về שָׂרָף được chỉnh để nêu phương án từ vựng và nghĩa cơ bản chính xác hơn, không áp đặt cách hiểu thiên sứ hay chỉ giữ nghĩa ‘rắn độc’.
