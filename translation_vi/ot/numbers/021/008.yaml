language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: vi
  text: 'Bấy giờ, Đức Giê-hô-va phán với Môi-se: “Hãy làm một con rắn lửa[a] và đặt nó trên một cây sào[b]. Bất cứ ai bị cắn mà nhìn nó thì sẽ sống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sê-ra-ph”, “đấng cháy”, hoặc, theo ngữ cảnh, “rắn độc”. Từ Hê-bơ-rơ có nghĩa cơ bản là “kẻ/đấng cháy”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ cũng có thể chỉ cột hiệu, cờ hiệu, hoặc vật làm dấu hiệu được dựng cao.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong tiếng Việt để biểu thị danh giao ước YHWH, thay vì thay bằng tước hiệu “CHÚA”.
- source_word: עֲשֵׂה לְךָ
  choice: Hãy làm
  rationale: Mệnh lệnh được diễn đạt tự nhiên trong tiếng Việt; đại từ lợi cách לְךָ không nhất thiết mang nghĩa hưởng lợi rõ rệt nên không thêm “cho mình” một cách gượng ép.
- source_word: שָׂרָף
  choice: con rắn lửa
  rationale: Trong mạch truyện, từ này chỉ loài rắn gây chết người và vẫn giữ hình ảnh “cháy/bỏng” của gốc Hê-bơ-rơ; “rắn độc” rõ nghĩa hơn nhưng mang tính diễn giải.
- source_word: נֵס
  choice: cây sào
  rationale: Ở đây נֵס chỉ vật cao dùng để treo hoặc dựng hình con rắn lên; “cây sào” là cách diễn đạt cụ thể, tự nhiên, đồng thời chú thích bảo lưu nghĩa “cột hiệu/cờ hiệu” rộng hơn.
- source_word: כָל הַנָּשׁוּךְ
  choice: Bất cứ ai bị cắn
  rationale: Phân từ bị động có mạo từ mang ý nghĩa khái quát; cách dịch này tự nhiên và giữ phạm vi bao quát của כָל.
- source_word: וְרָאָה אֹתוֹ
  choice: mà nhìn lên nó
  rationale: “Nhìn lên” phù hợp với vật được đặt trên sào; từ “mà” giữ quan hệ điều kiện-kết quả của chuỗi động từ mà không diễn giải quá mức.
- source_word: וָחָי
  choice: thì sẽ sống
  rationale: Diễn đạt trực tiếp kết quả được hứa; “sống” bảo lưu khả năng vừa là sống lại khỏi nguy cơ chết vừa là tiếp tục sống.
theological_decisions:
- issue: Ý nghĩa và hình ảnh của שָׂרָף
  choice: Dịch là “con rắn lửa” trong chính văn.
  alternative: “sê-ra-phim”, “sinh vật cháy”, hoặc “rắn độc”
  rationale: Ngữ cảnh xác định đây là hình con rắn liên hệ với tai họa ở Dân Số 21:6. “Rắn lửa” giữ hình ảnh từ nguyên và tránh nhập ý nghĩa thiên sứ từ những văn cảnh khác; “rắn độc” có thể đúng về tác động nhưng diễn giải nhiều hơn nguyên văn.
- issue: Bản chất của lời hứa וָחָי
  choice: Giữ cách nói đơn giản “sẽ sống”.
  alternative: “sẽ được chữa lành” hoặc “sẽ không chết”
  rationale: Nguyên văn nói “sống” chứ không xác định cơ chế chữa lành; bản dịch không thu hẹp hay mở rộng ý nghĩa thần học của lời hứa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bấy giờ” nối câu với diễn tiến tường thuật; lời phán dùng cấu trúc mệnh lệnh tự nhiên. Các chú thích được đặt ngay sau đúng từ ngữ mà chúng giải thích.
