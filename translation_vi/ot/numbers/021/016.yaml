id: NUM.21.16
reference: Numbers 21:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מִ/שָּׁ֖ם בְּאֵ֑רָ/ה הִ֣וא הַ/בְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לְ/מֹשֶׁ֔ה אֱסֹף֙ אֶת הָ/עָ֔ם וְ/אֶתְּנָ֥ה לָ/הֶ֖ם מָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: vi
  text: 'Từ đó, họ đến Bê-e[a]. Đó là cái giếng mà Yahweh đã phán với Môi-se về giếng ấy: “Hãy tập hợp dân chúng lại, và Ta sẽ ban nước cho họ.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bê-e là tên một địa điểm; trong tiếng Hebrew, tên này cũng có nghĩa là “giếng”.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Hãy tập hợp dân chúng lại để Ta ban nước cho họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Từ đó
  rationale: Diễn đạt tự nhiên bước chuyển tiếp trong hành trình; liên từ וּ được thể hiện qua mạch nối của câu tiếng Việt mà không cần thêm “và” ở đầu câu.
- source_word: בְּאֵרָה
  choice: họ đi đến Bê-e
  rationale: Bְּאֵר là địa danh, còn hậu tố chỉ hướng הָ được diễn đạt bằng “đến”; chủ ngữ và động từ chuyển động được bổ sung từ ngữ cảnh hành trình để câu tiếng Việt đầy đủ, tự nhiên.
- source_word: הִוא הַבְּאֵר
  choice: Đó là cái giếng
  rationale: Giữ chức năng nhận diện và giải thích địa danh của mệnh đề Hebrew.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: mà Yahweh đã phán với Môi-se
  rationale: Mệnh đề quan hệ liên kết cái giếng với lời Yahweh phán cho Môi-se; “phán” phù hợp với lời trực tiếp trang trọng của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó phản ánh trực tiếp יהוה trong văn bản nguồn.
- source_word: אֱסֹף אֶת־הָעָם
  choice: Hãy tập hợp dân chúng lại
  rationale: Mệnh lệnh אֱסֹף yêu cầu Môi-se quy tụ cộng đồng; “dân chúng” diễn đạt tự nhiên tập thể הָעָם trong ngữ cảnh.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: và Ta sẽ ban nước cho họ
  rationale: Dạng cohortative ngôi thứ nhất sau mệnh lệnh có thể biểu thị quyết ý hoặc kết quả dự định; cách dịch chính giữ liên từ và diễn đạt lời hứa/quyết ý tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Văn bản dùng trực tiếp danh giao ước יהוה. Giữ dạng phiên âm giúp phân biệt danh riêng với tước hiệu mà không thêm cách giải thích thần học ngoài văn bản.
- issue: Sắc thái của cohortative וְאֶתְּנָה
  choice: và Ta sẽ ban nước cho họ
  alternative: để Ta ban nước cho họ
  rationale: Cấu trúc có thể nhấn mạnh quyết ý tiếp theo hoặc mục đích của việc tập hợp. Bản chính giữ quan hệ nối tiếp, còn chú thích bảo lưu khả năng chỉ mục đích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta” trong lời trực tiếp của Yahweh và “Môi-se” theo dạng tên quen thuộc; giữ địa danh “Bê-e” cùng chú thích về lối chơi chữ Hebrew.
