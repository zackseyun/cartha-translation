base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: vi
  text: Rồi họ đổi hướng và đi lên theo đường Ba-san. Óc, vua Ba-san, ra đón họ cùng toàn thể dân mình để giao chiến tại Ét-rê-i.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: họ đổi hướng
  rationale: Động từ פנה trong mạch tự sự chỉ việc chuyển hướng; “đổi hướng” tự nhiên và rõ hơn cách dịch sát chữ “quay lại”, vốn có thể bị hiểu là trở về.
- source_word: וַיַּעֲלוּ
  choice: đi lên
  rationale: Giữ sắc thái phương hướng hoặc địa hình của עלה bằng cách diễn đạt thông dụng trong tiếng Việt.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: theo đường Ba-san
  rationale: דֶּרֶךְ kèm địa danh chỉ con đường hoặc tuyến đường gắn với Ba-san; cách dịch này không buộc phải hiểu Ba-san chỉ là đích đến.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Óc, vua Ba-san
  rationale: Chuyển âm tên riêng và diễn đạt thành phần đồng vị theo cú pháp tiếng Việt hiện đại.
- source_word: וַיֵּצֵא
  choice: kéo ra
  rationale: Trong bối cảnh quân sự, “kéo ra” diễn tả tự nhiên việc vua cùng dân mình ra nghênh chiến, nhưng không biến עַם thành “quân đội”.
- source_word: לִקְרָאתָם
  choice: đón họ
  rationale: Giữ nghĩa cơ bản, tự nó có thể trung tính, của לקראת là đi ra gặp hoặc đón; cụm “để giao chiến” ngay sau đó xác định tính thù địch.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: cùng toàn thể dân mình
  rationale: Giữ nghĩa trực tiếp của עַם là “dân”, không diễn giải thành “quân đội” hay “binh lính”.
- source_word: לַמִּלְחָמָה
  choice: để giao chiến
  rationale: Diễn đạt tự nhiên ý mục đích của cụm giới từ và danh từ מִלְחָמָה trong ngữ cảnh một trận đánh.
- source_word: אֶדְרֶעִי
  choice: tại Ét-rê-i
  rationale: Địa danh không có giới từ riêng trong tiếng Hê-bơ-rơ; “tại” thể hiện hợp lý địa điểm giao chiến mà không thêm sắc thái chuyển động.
theological_decisions: []
translation_notes:
  register: Văn phong tự sự trang trọng nhưng hiện đại, câu chữ dễ hiểu. Tên riêng được chuyển âm theo lối đọc tiếng Việt. Không thêm chú thích vì nét nghĩa trung tính của “đón” đã được cụm “để giao chiến” làm rõ ngay trong câu.
