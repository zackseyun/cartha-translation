  rationale: Chỉnh nhẹ động từ “kéo ra” thành “ra đón” để sát hơn với chuỗi וַיֵּצֵא ... לִקְרָאתָם, đồng thời sắp xếp lại liên kết câu cho rõ rằng Óc ra gặp họ cùng dân mình. Không thay đổi ý nghĩa, sắc thái quân sự, hay cách chuyển âm tên riêng.
