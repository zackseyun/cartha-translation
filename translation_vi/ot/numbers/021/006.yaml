  terminology: “Yahweh” nhất quán với chính sách dự án. “Rắn lửa” là một cách giữ hình ảnh cô đọng của הַנְּחָשִׁים הַשְּׂרָפִים; chú thích nên diễn đạt sát hơn nghĩa đen “những con rắn, những con rực cháy,” thay vì biến thành mệnh đề chủ động “những con thiêu đốt.”
