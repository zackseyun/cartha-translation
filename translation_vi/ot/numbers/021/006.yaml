id: NUM.21.6
reference: Numbers 21:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: vi
  text: Vì thế, Yahweh sai những con rắn lửa[a] đến giữa dân chúng; chúng cắn dân chúng, và nhiều người Israel đã chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “rắn độc” hoặc “rắn gây bỏng rát.” Tiếng Hê-bơ-rơ theo nghĩa đen là “những con rắn, những con rực cháy.”
    reason: Nêu các khả năng từ vựng của הַנְּחָשִׁים הַשְּׂרָפִים và bảo tồn sự mơ hồ của nguyên văn.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: sai
  rationale: Động từ שׁלח trong mạch kể chuyện có nghĩa trực tiếp là “sai”; cách dịch này tự nhiên và giữ được ý Yahweh chủ động đưa rắn đến.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: בָּעָם
  choice: đến giữa dân chúng
  rationale: Giới từ ב ở đây mang nghĩa vị trí, chỉ nơi những con rắn được sai đến; cách diễn đạt này tự nhiên hơn “trong dân chúng” và không thêm sắc thái “chống lại”.
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: những con rắn lửa
  rationale: נְחָשִׁים là “rắn,” còn שְּׂרָפִים theo nghĩa đen là “những con rực cháy/thiêu đốt.” “Rắn lửa” giữ hình ảnh và sự mơ hồ của tiếng Hê-bơ-rơ, thay vì xác định hẳn là rắn độc.
- source_word: וַיְנַשְּׁכוּ
  choice: chúng cắn
  rationale: Động từ נשׁך có nghĩa thông thường là “cắn”; đại từ “chúng” nối rõ với những con rắn.
- source_word: וַיָּמָת
  choice: đã chết
  rationale: מות là động từ thông thường chỉ sự chết; “đã chết” phù hợp với trình tự kể chuyện trong tiếng Việt.
- source_word: עַם רָב
  choice: nhiều người
  rationale: Cụm từ chỉ một số đông người; “nhiều người” là cách diễn đạt tiếng Việt rõ ràng, tự nhiên.
- source_word: מִיִּשְׂרָאֵל
  choice: trong Israel
  rationale: מן ở đây có thể chỉ thành phần thuộc một tập thể, tức nhiều người từ trong cộng đồng Israel; “trong Israel” diễn đạt tự nhiên ý đó bằng tiếng Việt.
theological_decisions:
- issue: Cách dịch danh YHWH (יְהוָה)
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Giữ “Yahweh” bảo tồn sự phân biệt giữa tên riêng và tước hiệu.
- issue: Ý nghĩa của הַשְּׂרָפִים
  choice: rắn lửa
  alternative: rắn độc / rắn gây bỏng rát
  rationale: “Rắn lửa” giữ nguyên hình ảnh Hê-bơ-rơ và không quyết đoán liệu từ này mô tả vẻ ngoài của rắn hay cảm giác bỏng rát do vết cắn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “dân chúng” để tránh lặp từ “người” quá dày, đồng thời giữ sự quy chiếu tập thể của הָעָם. Dấu chấm phẩy giúp thể hiện chuỗi hành động liên tiếp mà không làm câu tiếng Việt nặng nề.
