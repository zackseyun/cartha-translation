  to: Vì thế, Yahweh sai những con rắn lửa[a] đến giữa dân chúng; chúng cắn dân chúng, và nhiều người Israel đã chết.
  rationale: Thay “nhiều người trong Israel” bằng “nhiều người Israel” để diễn đạt đúng hơn quan hệ thành phần trong מִיִּשְׂרָאֵל, đồng thời điều chỉnh chú thích để phản ánh sát hơn cấu trúc và sắc thái của cụm Hê-bơ-rơ. Các yếu tố khác được giữ nguyên vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
