  text: וּ/מִ/מַּתָּנָ֖ה נַחֲלִיאֵ֑ל וּ/מִ/נַּחֲלִיאֵ֖ל בָּמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/019.yaml
  text: And from Mattanah to Nahaliel[a], and from Nahaliel to Bamoth.
translation:
  language: vi
  text: Từ Ma-tha-na đến Na-ha-li-ên, rồi từ Na-ha-li-ên đến Ba-mốt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ Ba-mốt cũng có thể có nghĩa là “các nơi cao” hoặc “nơi cao”; nhưng tại đây, từ này phù hợp nhất khi được hiểu là tên một địa điểm trong hành trình của Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: Từ Ma-tha-na
  rationale: מַתָּנָה là địa danh trong hành trình nên được phiên âm. Giới từ מִן được dịch là “từ”; liên từ וּ được thể hiện tự nhiên qua sự tiếp nối của câu và từ “rồi” ở vế sau.
- source_word: נַחֲלִיאֵל
  choice: đến Na-ha-li-ên
  rationale: Nguyên văn không có giới từ trước địa danh này, nhưng lối ghi hành trình tỉnh lược hàm ý chuyển từ nơi này đến nơi kế tiếp; thêm “đến” giúp câu tiếng Việt rõ ràng mà không làm thay đổi ý.
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: rồi từ Na-ha-li-ên
  rationale: וּ nối chặng kế tiếp và được dịch tự nhiên là “rồi”; מִן là “từ”. Địa danh được phiên âm nhất quán.
- source_word: בָּמֽוֹת
  choice: Ba-mốt
  rationale: Trong văn cảnh liệt kê các chặng đường, בָּמוֹת hợp lý nhất là một địa danh nên được phiên âm. Nghĩa từ vựng “những nơi cao” được giữ lại trong chú thích như một khả năng.
theological_decisions: []
translation_notes:
  register: Câu văn ngắn gọn, trang trọng và tự nhiên, giữ lối liệt kê hành trình của nguyên văn. Các địa danh được phiên âm theo cách dễ đọc đối với độc giả Việt ngữ hiện đại; dấu chú thích được đặt ngay sau “Ba-mốt”, là từ mà chú thích giải nghĩa.
