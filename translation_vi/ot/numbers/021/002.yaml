source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: vi
  text: 'Bấy giờ, Y-sơ-ra-ên khấn nguyện cùng Đức Giê-hô-va và nói: “Nếu Ngài thật sự phó[a] dân này vào tay con, thì con sẽ dành riêng các thành của chúng cho sự hủy diệt[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ nhấn mạnh động từ, sát nghĩa là “nếu ban, Ngài ban”; cũng có thể dịch: “Nếu Ngài chắc chắn phó dân này vào tay con.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đặt các thành của chúng dưới lệnh tận diệt.” Từ Hê-bơ-rơ chỉ việc dành riêng một người, vật hoặc nơi chốn cách không thể thu hồi cho sự hủy diệt, như một hành động ḥerem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: lập một lời thề nguyện
  rationale: Cấu trúc đồng căn trong tiếng Hê-bơ-rơ diễn tả một lời cam kết long trọng; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ tính trang nghiêm và chính thức.
- source_word: לַיהוָה
  choice: với Đức Giê-hô-va
  rationale: Danh riêng giao ước יהוה được biểu đạt bằng dạng phiên âm quen thuộc trong tiếng Việt, thay vì hòa lẫn với danh xưng chung “Chúa”.
- source_word: אִם נָתֹן תִּתֵּן
  choice: Nếu Ngài thật sự phó
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ hữu hạn tạo ý nhấn mạnh; “thật sự” truyền đạt sắc thái ấy bằng tiếng Việt tự nhiên.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: Giữ עָם là một danh từ tập hợp số ít và phản ánh trực tiếp cấu trúc chỉ định của nguyên văn.
- source_word: בְּיָדִי
  choice: vào tay con
  rationale: Giữ hình ảnh Hê-bơ-rơ về việc trao đối phương vào quyền kiểm soát của người nói; “con” phù hợp với lời thưa trực tiếp với Đức Chúa Trời.
- source_word: וְהַחֲרַמְתִּי
  choice: con sẽ biệt riêng ... để hủy diệt
  rationale: 'Diễn đạt cả hai phương diện của חרם: dành riêng một cách không thể thu hồi và đưa đến hủy diệt, thay vì giản lược thành hành động phá hủy thông thường.'
- source_word: עָרֵיהֶם
  choice: các thành của chúng
  rationale: עִיר được dịch trực tiếp là “thành”; đại từ “chúng” quy chiếu về tập thể thù địch vừa được nhắc đến.
theological_decisions:
- issue: Ngôn ngữ חרם trong lời thề thời chiến
  choice: biệt riêng các thành của chúng để hủy diệt
  alternative: hủy diệt hoàn toàn các thành của chúng; đặt các thành của chúng dưới lệnh tận diệt
  rationale: 'Cách dịch giữ được chiều kích nghi lễ lẫn quân sự của חרם: các thành bị dành riêng một cách không thể thu hồi để hủy diệt. Nó không giảm khái niệm này xuống thành việc phá hủy thông thường, cũng không thêm lời biện giải thần học hay đạo đức ngoài văn bản.'
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Lời khấn dùng cặp xưng hô “Ngài–con”; hình ảnh “vào tay” được giữ vì rõ nghĩa trong tiếng Việt. Các dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích.
