  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: vi
  text: Rồi họ rời núi Hô-rơ, đi theo con đường về phía Biển Đỏ[a] để vòng qua đất Ê-đôm. Dọc đường, dân chúng mất kiên nhẫn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo con đường về phía Biển Sậy.” Tiếng Hê-bơ-rơ: yam suph.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dân chúng nản lòng” hoặc “dân chúng nao núng dọc đường.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: họ rời
  rationale: Trong công thức hành trình nơi hoang mạc, נסע chỉ việc nhổ trại và lên đường; “rời” tự nhiên trong tiếng Việt và phù hợp khi đi cùng điểm xuất phát.
- source_word: מֵהֹר הָהָר
  choice: rời núi Hô-rơ
  rationale: הֹר הָהָר là địa danh quen dùng; “núi Hô-rơ” là cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: דֶּרֶךְ יַם סוּף
  choice: theo con đường về phía Biển Đỏ
  rationale: דֶּרֶךְ chỉ đường hoặc tuyến đi; cấu trúc có thể chỉ con đường hướng về יַם־סוּף. “Biển Đỏ” giữ cách gọi truyền thống, còn khả năng “Biển Sậy” được nêu trong chú thích.
- source_word: לִסְבֹב
  choice: để vòng qua
  rationale: Động từ nguyên mẫu diễn tả mục đích của tuyến đường; “vòng qua” rõ nghĩa và tự nhiên.
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: đất Ê-đôm
  rationale: אֶרֶץ ở đây chỉ đất hoặc lãnh thổ của Ê-đôm; “đất Ê-đôm” ngắn gọn và sát nghĩa.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: dân chúng mất kiên nhẫn
  rationale: Thành ngữ קצר נפש theo nghĩa đen là “tâm hồn trở nên ngắn”, diễn tả sự thiếu kiên nhẫn, nản chí hoặc nao núng vì gian khó; “mất kiên nhẫn” phù hợp ngữ cảnh mà không giải nghĩa quá mức.
- source_word: בַּדָּרֶךְ
  choice: dọc đường
  rationale: Giới từ ב với דֶּרֶךְ trước hết có nghĩa chỉ hoàn cảnh hoặc địa điểm “trên/dọc đường”, dù cũng có thể hàm ý tuyến đường là nguyên nhân khiến họ nản lòng.
