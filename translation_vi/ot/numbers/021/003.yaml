language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: vi
  text: Yahweh nghe tiếng của Israel và trao dân Canaan vào tay họ. Họ biệt hiến dân ấy cùng các thành của họ để hủy diệt. Vì thế, nơi ấy được gọi là Horma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Horma liên hệ với từ Hê-bơ-rơ mang nghĩa “biệt hiến để hủy diệt” hoặc “đặt dưới lệnh tận diệt.”
    reason: Giải thích lối chơi chữ và mối liên hệ từ nguyên giữa חָרְמָה và חרם.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: nghe tiếng Israel
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, đồng thời trong ngữ cảnh diễn tả việc Yahweh nghe và đáp lời Israel.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: trao dân Canaan vào tay họ
  rationale: Động từ נתן với đối tượng thù địch mang nghĩa trao vào quyền lực của bên kia; “dân Canaan” diễn đạt tự nhiên danh từ dân tộc số ít có nghĩa tập thể.
- source_word: וַיַּחֲרֵם
  choice: biệt hiến ... để hủy diệt
  rationale: 'Giữ nét nghĩa chuyên biệt của חרם: đặt người hoặc vật dưới lệnh biệt hiến không thể thu hồi, dẫn đến sự hủy diệt, thay vì chỉ nói chung là “tiêu diệt”.'
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: dân ấy cùng các thành của họ
  rationale: Đại từ “dân ấy” nối rõ với dân Canaan; “các thành” là cách dịch thông thường và tự nhiên của עָרֵיהֶם.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: nơi ấy được gọi là
  rationale: Cấu trúc bị động tránh xác định quá mức chủ thể không được nêu rõ của động từ số ít trong nguyên văn.
- source_word: חָרְמָה
  choice: Horma
  rationale: Phiên âm địa danh theo cách dễ đọc trong tiếng Việt; chú thích giữ mối liên hệ từ nguyên với חרם.
theological_decisions:
- issue: Thuật ngữ חרם trong chiến tranh
  choice: biệt hiến dân ấy cùng các thành của họ để hủy diệt
  alternative: tận diệt dân ấy cùng các thành của họ
  rationale: Cách dịch chính giữ cả ý biệt hiến theo lệnh cấm và kết quả hủy diệt, không giảm nhẹ bạo lực cũng không biến thuật ngữ thành một cách diễn giải giáo phái.
- issue: Chủ thể đặt tên địa điểm
  choice: nơi ấy được gọi là Horma
  alternative: ông gọi nơi ấy là Horma / họ gọi nơi ấy là Horma
  rationale: Nguyên văn để chủ thể ở dạng hàm ẩn; bị động bảo toàn sự mơ hồ thay vì quyết định đó là Yahweh, Israel hay một cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dân Canaan” để chuyển nghĩa tập thể tự nhiên; giữ “Yahweh” là danh riêng. Cụm “biệt hiến ... để hủy diệt” hơi mang tính thuật ngữ nhưng cần thiết để bảo toàn sắc thái của חרם; chú thích giải thích lối chơi chữ trong địa danh.
