  terminology: “Yahweh,” “phạm tội,” “cầu nguyện,” và “cất ... khỏi” đều thích hợp. Cách gọi “Môi-se” và đại từ “ông” nhất quán với văn cảnh. Chú thích về danh từ số ít/tập hợp là cần thiết và không áp đặt một cách hiểu duy nhất.
