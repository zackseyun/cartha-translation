id: NUM.21.7
reference: Numbers 21:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: vi
  text: 'Bấy giờ, dân chúng đến gặp Môi-se và nói: “Chúng tôi đã phạm tội, vì đã nói chống lại Yahweh và chống lại ông. Xin ông cầu nguyện với Yahweh để Ngài cất rắn[a] khỏi chúng tôi.” Vậy Môi-se cầu nguyện cho dân chúng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Danh từ Hê-bơ-rơ ở số ít, có thể chỉ chung tai họa do rắn gây ra.
    reason: 'Giữ sự mơ hồ về số của הַנָּחָשׁ: hình thức ngữ pháp là số ít nhưng có thể mang nghĩa tập hợp trong văn cảnh.'
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: Bấy giờ, dân chúng đến gặp
  rationale: Liên từ kể chuyện nối tiếp diễn biến; “Bấy giờ” diễn đạt trình tự tự nhiên. Danh từ tập hợp הָעָם được chuyển là “dân chúng”.
- source_word: חָטָאנוּ
  choice: Chúng tôi đã phạm tội
  rationale: Dạng hoàn thành diễn tả hành động đã xảy ra nhưng được nhìn nhận trong lời thú tội hiện tại.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: đã nói nghịch với Yahweh và với ông
  rationale: דבר đi với ב trong văn cảnh này chỉ lời nói chống nghịch. Lặp lại “với” giữ rõ hai đối tượng song song.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị trực tiếp bằng Tứ tự YHWH trong bản Hê-bơ-rơ.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: Xin ông cầu nguyện với Yahweh
  rationale: Diễn đạt trực tiếp động từ “cầu nguyện”; sắc thái chuyển cầu đã rõ qua lời dân chúng xin Môi-se cầu thay.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: để Ngài cất ... khỏi chúng tôi
  rationale: Dạng động từ sau mệnh lệnh nêu nội dung hoặc mục đích của lời cầu xin; “cất khỏi” vừa tự nhiên vừa giữ ý loại bỏ tai họa.
- source_word: אֶת הַנָּחָשׁ
  choice: rắn[a]
  rationale: נָחָשׁ là “rắn”; tiếng Việt không bắt buộc biểu thị số nên cách dịch này giữ được sự mơ hồ giữa một con rắn và rắn được nói theo nghĩa tập hợp.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: Vậy Môi-se cầu nguyện cho dân chúng
  rationale: בְּעַד biểu thị hành động thay mặt người khác; “cầu nguyện cho” là cách nói rõ ràng, phổ thông.
theological_decisions:
- issue: Cách chuyển tên Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh YHWH; phiên âm “Yahweh” bảo tồn tư cách tên riêng mà không thay bằng một tước hiệu.
- issue: Sắc thái chuyển cầu trong lời cầu nguyện của Môi-se
  choice: cầu nguyện cho dân chúng
  alternative: cầu thay cho dân chúng
  rationale: “Cầu nguyện cho” chuyển đúng בְּעַד và dễ hiểu, đồng thời không thêm sắc thái thần học vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” khi dân chúng thưa với Môi-se, tránh lối xưng hô quá cổ; giữ cấu trúc lời thú tội, lời xin chuyển cầu và đáp ứng của Môi-se.
