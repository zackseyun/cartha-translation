revisions:
- from: 'Bấy giờ, dân chúng đến gặp Môi-se và nói: “Chúng tôi đã phạm tội, vì đã nói nghịch với Yahweh và với ông. Xin ông cầu nguyện với Yahweh để Ngài cất rắn[a] khỏi chúng tôi.” Vậy Môi-se cầu nguyện cho dân chúng.'
  to: 'Bấy giờ, dân chúng đến gặp Môi-se và nói: “Chúng tôi đã phạm tội, vì đã nói chống lại Yahweh và chống lại ông. Xin ông cầu nguyện với Yahweh để Ngài cất rắn[a] khỏi chúng tôi.” Vậy Môi-se cầu nguyện cho dân chúng.'
  rationale: Chỉ thay “nói nghịch với” bằng “nói chống lại” để đạt cách diễn đạt hiện đại, rõ ràng hơn mà không thay đổi ý nghĩa hay sắc thái đối nghịch của nguyên văn. Giữ “rắn” cùng chú thích để không quyết định thay nguyên văn giữa một con rắn và tai họa rắn theo nghĩa tập hợp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:29:09Z'
