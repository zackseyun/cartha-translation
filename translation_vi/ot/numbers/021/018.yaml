  rationale: Bản sửa chỉ tinh chỉnh đăng ký văn phong và tránh việc “vương trượng” áp đặt sắc thái quân chủ hẹp hơn nguyên ngữ. Cấu trúc thơ, tính song song, cách hiểu hành trình, và các cách hiểu thay thế có căn cứ vẫn được giữ nguyên.
