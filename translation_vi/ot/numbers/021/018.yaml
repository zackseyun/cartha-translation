  text: בְּאֵ֞ר חֲפָר֣וּ/הָ שָׂרִ֗ים כָּר֨וּ/הָ֙ נְדִיבֵ֣י הָ/עָ֔ם בִּ/מְחֹקֵ֖ק בְּ/מִשְׁעֲנֹתָ֑/ם וּ/מִ/מִּדְבָּ֖ר מַתָּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: vi
  text: 'Giếng mà các thủ lĩnh đã đào,

    mà các bậc quyền quý trong dân đã khơi

    bằng trượng của người cai trị[a], bằng gậy của họ.

    Rồi từ hoang mạc, họ đi đến Mát-ta-na.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi người ban luật” hoặc “bởi người cai trị”; từ Hê-bơ-rơ có thể chỉ một người, thay vì cây trượng của người cai trị.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ chỉ ghi: “và từ hoang mạc, Mát-ta-na”; theo mạch liệt kê các chặng đường, ý có lẽ là “từ hoang mạc đến Mát-ta-na”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: cái giếng
  rationale: Danh từ chỉ giếng; ngữ cảnh bài ca ở câu trước xác định đây là cái giếng đang được ca tụng.
- source_word: חֲפָרוּהָ
  choice: đã đào
  rationale: Động từ חפר nghĩa là đào; hậu tố giống cái số ít chỉ lại בְּאֵר.
- source_word: שָׂרִים
  choice: các thủ lĩnh
  rationale: Chỉ những người đứng đầu có địa vị cao; “thủ lĩnh” tự nhiên trong bối cảnh dân Israel và không hàm ý họ thuộc hoàng tộc.
- source_word: כָּרוּהָ
  choice: đã khơi
  rationale: Động từ כרה cũng chỉ việc đào. “Khơi” giữ nét song song thi ca nhưng tránh lặp nguyên từ “đào” trong tiếng Việt.
- source_word: נְדִיבֵי הָעָם
  choice: các bậc quyền quý trong dân
  rationale: Trong thế song song với שָׂרִים, từ này nhiều khả năng chỉ những người cao quý hoặc có địa vị trong dân.
- source_word: בִּמְחֹקֵק
  choice: bằng vương trượng
  rationale: מְחֹקֵק có thể chỉ người ban luật, người cai trị, hoặc trượng biểu thị quyền cai trị. Phép song song với “bằng gậy của họ” nghiêng về nghĩa dụng cụ.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: bằng gậy của họ
  rationale: מִשְׁעֵנָה là cây gậy dùng để chống hoặc nâng đỡ; “gậy” là cách diễn đạt gọn và tự nhiên.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: Rồi từ hoang mạc, họ đi đến Mát-ta-na
  rationale: Nguyên văn cô đọng, không có động từ và cũng không có giới từ “đến” trước địa danh. Mạch hành trình ở các câu 18–20 cho thấy đây là sự chuyển tiếp từ hoang mạc đến Mát-ta-na.
theological_decisions:
- issue: Nghĩa của בִּמְחֹקֵק trong câu thơ
  choice: 'nghĩa dụng cụ: “bằng vương trượng”'
  alternative: 'nghĩa chỉ người: “bởi người ban luật/người cai trị”'
  rationale: Cụm song song “bằng gậy của họ” ủng hộ cách hiểu đây là một vật dụng hoặc biểu tượng quyền cai trị. Chú thích giữ lại cách hiểu chỉ người vì từ Hê-bơ-rơ thực sự có thể mang nghĩa ấy.
- issue: Cách hiểu וּמִמִּדְבָּר מַתָּנָה
  choice: 'chặng hành trình: “từ hoang mạc… đến Mát-ta-na”'
  alternative: 'cách diễn đạt sát hình thức: “và từ hoang mạc, Mát-ta-na”'
  rationale: Các câu kế tiếp liệt kê những chặng đường. Việc bổ sung “họ đi đến” làm rõ quan hệ vốn được ngữ cảnh hàm ý mà không biến một cách hiểu thần học thành điều chắc chắn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và có nhịp thơ. Dùng “thủ lĩnh” thay vì “vương tử” để tránh gợi quan hệ huyết thống hoàng gia không nhất thiết có trong שָׂרִים; dùng “các bậc quyền quý” để giữ sắc thái địa vị xã hội. Phiên âm địa danh theo cách dễ đọc trong tiếng Việt.
