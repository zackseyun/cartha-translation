  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: vi
  text: Môi-se làm một con rắn bằng đồng[a] và đặt nó trên cây sào[b]. Hễ rắn cắn một người[c], người ấy nhìn vào con rắn bằng đồng[d] thì sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ kim loại này có thể có nghĩa là đồng đỏ hoặc hợp kim đồng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cột hiệu” hoặc “cờ hiệu.”
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hê-bơ-rơ là “một người nam,” nhưng được dùng theo nghĩa đại diện cho bất cứ người nào bị cắn.
    reason: lexical_alternative
  - marker: d
    text: Sự kiện này được nhắc đến trong Giăng 3:14–15.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: con rắn
  rationale: Cách gọi tự nhiên trong tiếng Việt hiện đại, phù hợp cho cả con rắn thật lẫn hình rắn được chế tác trong ngữ cảnh này.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ Hê-bơ-rơ có thể chỉ đồng đỏ hoặc đồng pha; “đồng” giữ được phạm vi nghĩa rộng và tự nhiên trong tiếng Việt.
- source_word: הַנֵּס
  choice: cây sào
  rationale: Trong ngữ cảnh, đây là vật thẳng đứng dùng để treo hình con rắn; “cây sào” rõ nghĩa hơn “cờ hiệu” nhưng vẫn chú thích nghĩa thay thế.
- source_word: וְהָיָה
  choice: Khi
  rationale: Chuyển cấu trúc nêu tình huống-kết quả của tiếng Hê-bơ-rơ thành câu tiếng Việt tự nhiên mà không làm thay đổi quan hệ sự việc.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: Khi rắn cắn một người
  rationale: Giữ số ít và ý nghĩa đại diện của אִישׁ, đồng thời diễn đạt tự nhiên; mạo từ trong “con rắn” có thể mang nghĩa tập hợp, nên tiếng Việt dùng “rắn” chung loại.
- source_word: וְהִבִּיט אֶל
  choice: nhìn
  rationale: Diễn đạt nghĩa trực tiếp là hướng mắt vào, không thêm sắc thái thần học như “trông cậy vào”.
- source_word: וָחָי
  choice: thì được sống
  rationale: Thể hiện rõ kết quả là người bị cắn vẫn sống; “được sống” tự nhiên trong ngữ cảnh thoát chết mà không xác định thêm cơ chế.
theological_decisions:
- issue: Giống đực đại diện trong אִישׁ
  choice: một người
  alternative: một người đàn ông
  rationale: Trong câu điều kiện này, אִישׁ chỉ bất cứ cá nhân nào bị rắn cắn. “Một người” bảo toàn số ít và nghĩa đại diện, tránh khiến độc giả Việt hiểu sai rằng chỉ nam giới được nói đến.
- issue: Nguy cơ đưa cách đọc hình bóng vào động từ וְהִבִּיט
  choice: nhìn
  alternative: trông lên / trông cậy vào
  rationale: Bản văn Hê-bơ-rơ mô tả hành động nhìn vào hình rắn. Ý nghĩa hình bóng trong Giăng 3:14–15 được nêu ở chú thích, không được đưa ngược vào lời dịch chính.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu ngắn và dễ hiểu. Dùng “Môi-se” theo lối phiên âm Kinh Thánh quen thuộc; tránh từ cổ và tránh đưa ý nghĩa thần học hậu kỳ vào thân câu.
