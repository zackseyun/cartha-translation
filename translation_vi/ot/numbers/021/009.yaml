revisions:
- from: Vậy Môi-se làm một con rắn bằng đồng[a] và đặt nó trên cây sào[b]. Khi rắn cắn một người[c], người ấy nhìn con rắn bằng đồng[d] thì được sống.
  to: Môi-se làm một con rắn bằng đồng[a] và đặt nó trên cây sào[b]. Hễ rắn cắn một người[c], người ấy nhìn vào con rắn bằng đồng[d] thì sống.
  rationale: Bản sửa giữ nguyên nghĩa và trật tự sự việc của nguyên văn, nhưng làm rõ hướng của hành động nhìn (אֶל), biểu đạt điều kiện tổng quát bằng “hễ ... thì,” và chỉnh các chú thích để tiếng Việt hiện đại, chính xác về từ vựng, và trung tính về diễn giải hơn.
