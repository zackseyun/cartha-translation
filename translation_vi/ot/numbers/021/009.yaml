  - severity: low
    issue: Chú thích [a] dùng cụm “đồng pha”.
    rationale: “Đồng pha” không phải cách gọi thông dụng, rõ nghĩa trong tiếng Việt hiện đại cho phạm vi kim loại của נְחֹשֶׁת. “Hợp kim đồng” tự nhiên và chính xác hơn, đồng thời vẫn bảo toàn sự không chắc chắn giữa copper và bronze.
  - severity: low
    issue: Chú thích [d] diễn đạt “theo ý nghĩa hình bóng”.
    rationale: Bản văn Giăng có liên hệ với sự kiện này, nhưng chú thích trung tính “được nhắc đến trong” tránh áp đặt một khuôn khổ giải thích thần học vào chú thích của câu.
