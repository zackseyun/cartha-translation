revisions:
- from: Vì Hết-bôn là thành của Si-hôn, vua dân A-mô-rít. Si-hôn đã giao chiến với vua Mô-áp trước kia và tước khỏi tay vua ấy[a] toàn bộ lãnh thổ cho đến sông Ạt-nôn.
  to: Vì Hết-bôn là thành của Si-hôn, vua của dân A-mô-rít; ông đã giao chiến với vị vua Mô-áp trước kia và tước khỏi tay vua ấy[a] toàn bộ lãnh thổ của vua ấy, cho đến sông Ạt-nôn.
  rationale: Bản sửa chỉ điều chỉnh cú pháp và quy chiếu đại từ/danh ngữ để tiếng Việt rõ ràng hơn. Trật tự lịch sử, mức độ xác định của “vua Mô-áp trước kia,” hình ảnh “khỏi tay,” và ranh giới “cho đến sông Ạt-nôn” đều được bảo toàn.
