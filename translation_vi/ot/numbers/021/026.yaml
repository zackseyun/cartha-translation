language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: vi
  text: Vì Hết-bôn là thành của Si-hôn, vua của dân A-mô-rít; ông đã giao chiến với vị vua Mô-áp trước kia và tước khỏi tay vua ấy[a] toàn bộ lãnh thổ của vua ấy, cho đến sông Ạt-nôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi quyền kiểm soát của vua ấy”; nguyên văn Hê-bơ-rơ là “khỏi tay vua ấy.”'
    reason: Giải thích thành ngữ מִיָּדוֹ và nêu nghĩa chuyển về quyền kiểm soát.
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích của mệnh đề này đối với lời kể ngay trước đó.
- source_word: חֶשְׁבּוֹן
  choice: Hết-bôn
  rationale: Phiên âm địa danh theo lối viết rõ ràng, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: עִיר סִיחֹן
  choice: thành của Si-hôn
  rationale: Diễn đạt quan hệ sở hữu/chủ quyền tự nhiên trong tiếng Việt; עִיר ở đây là một trung tâm đô thị thuộc quyền vua Si-hôn.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: vua dân A-mô-rít
  rationale: Danh từ có mạo từ ở số ít mang nghĩa tập thể, chỉ dân A-mô-rít.
- source_word: נִלְחַם בְּ
  choice: đã giao chiến với
  rationale: Niphal của לחם cùng giới từ בְּ diễn tả việc tham chiến hay đánh nhau với một đối thủ.
- source_word: מֶלֶךְ מוֹאָב הָרִאשׁוֹן
  choice: vua Mô-áp trước kia
  rationale: הָרִאשׁוֹן có thể mang nghĩa 'đầu tiên' hoặc 'trước/trước kia'; trong ngữ cảnh lịch sử này, cách dịch nêu một vị vua thuộc thời trước mà không khẳng định ông là vị vua đầu tiên tuyệt đối.
- source_word: וַיִּקַּח
  choice: và tước ... toàn bộ lãnh thổ
  rationale: Động từ לקח là 'lấy, chiếm'; kết hợp với thành ngữ 'khỏi tay' để diễn tả hành động chinh phục tự nhiên và mạnh rõ trong tiếng Việt.
- source_word: כָּל אַרְצוֹ
  choice: toàn bộ lãnh thổ
  rationale: אַרְצוֹ chỉ vùng đất thuộc quyền vị vua Mô-áp; 'lãnh thổ' làm rõ sắc thái chính trị trong ngữ cảnh chiến tranh.
- source_word: מִיָּדוֹ
  choice: khỏi tay vua ấy
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, đồng thời dùng 'vua ấy' để tránh đại từ mơ hồ trong tiếng Việt.
- source_word: עַד אַרְנֹן
  choice: cho đến sông Ạt-nôn
  rationale: עַד đánh dấu ranh giới xa nhất; Ạt-nôn ở đây là địa danh chỉ con sông làm ranh giới.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện lịch sử, trang trọng nhưng hiện đại. Lặp tên “Si-hôn” ở câu thứ hai để xác định rõ chủ thể vì đại từ tiếng Việt dễ gây nhầm; “vua ấy” quy chiếu đến vua Mô-áp trước kia. Tách thành hai câu để câu tiếng Việt sáng rõ mà vẫn giữ quan hệ giải thích mở đầu bằng “Vì”.
