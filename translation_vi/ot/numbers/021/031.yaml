  text: וַ/יֵּ֨שֶׁב֙ יִשְׂרָאֵ֔ל בְּ/אֶ֖רֶץ הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/031.yaml
  text: So Israel lived in the land of the Amorites[a].
translation:
  language: vi
  text: Vậy, Y-sơ-ra-ên cư ngụ trong xứ của dân A-mô-rít.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Vậy, Y-sơ-ra-ên ở trong xứ của dân A-mô-rít.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: cư ngụ
  rationale: Động từ יָשַׁב có thể có nghĩa là ngồi, ở, cư ngụ hoặc định cư. Trong câu tổng kết này, “cư ngụ” diễn đạt tự nhiên việc Y-sơ-ra-ên sống trong vùng đất ấy mà không nhấn mạnh quá mức tính định cư vĩnh viễn.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: בְּאֶרֶץ
  choice: trong xứ
  rationale: אֶרֶץ ở đây chỉ vùng lãnh thổ của một dân; “xứ” ngắn gọn, tự nhiên và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: הָאֱמֹרִי
  choice: dân A-mô-rít
  rationale: Dạng Hê-bơ-rơ là danh xưng dân tộc ở số ít nhưng mang nghĩa tập thể. “Dân A-mô-rít” thể hiện rõ đây là một nhóm dân và giữ được mối liên hệ sở hữu trong cụm “xứ của dân A-mô-rít”.
theological_decisions: []
