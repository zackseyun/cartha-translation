  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của tiếng Hê-bơ-rơ: וַיֵּשֶׁב được diễn đạt là “cư ngụ,” chủ ngữ tập thể “Y-sơ-ra-ên” được giữ nguyên, và בְּאֶרֶץ הָאֱמֹרִי được chuyển tự nhiên là “trong xứ của dân A-mô-rít.” Cách dùng “dân A-mô-rít” truyền đạt đúng danh xưng tộc người mang nghĩa tập thể, không hàm ý một cá nhân A-mô-rít.'
  naturalness: “Vậy, Y-sơ-ra-ên cư ngụ trong xứ của dân A-mô-rít” là tiếng Việt hiện đại, trang trọng và phù hợp với văn mạch tường thuật Kinh Thánh. “Cư ngụ” hơi trang trọng nhưng vẫn thông dụng và diễn đạt thích hợp hành động sống/ở trong vùng đất ấy.
  terminology: Cách viết “Y-sơ-ra-ên” và “A-mô-rít” nhất quán với lối phiên âm Kinh Thánh tiếng Việt quen thuộc. “Xứ” phù hợp với אֶרֶץ trong ngữ cảnh lãnh thổ, còn “dân A-mô-rít” tránh sự gượng ép của một danh từ dân tộc số ít trong tiếng Việt.
