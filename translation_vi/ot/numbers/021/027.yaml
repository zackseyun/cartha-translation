base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: vi
  text: 'Vì thế, các thi sĩ[a] nói:


    “Hãy đến Hết-bôn!


    Nguyện thành của Si-hôn được xây dựng và được thiết lập!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người nói châm ngôn” hoặc “những người ngâm khúc ca”; theo cách dịch truyền thống là “những người cai trị.” Trong ngữ cảnh này, từ Hê-bơ-rơ có lẽ chỉ những người sáng tác hoặc ngâm một khúc ca mang tính châm ngôn, chứ không phải các nhà cai trị.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Giữ chức năng liên kết, nêu hệ quả hoặc lời giải thích từ phần thuật sự ngay trước đó; cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: יֹאמְרוּ
  choice: nói
  rationale: Dạng chưa hoàn thành ở đây có giá trị tập quán hoặc khái quát trong công thức dẫn lời; thì hiện tại tiếng Việt truyền đạt thích hợp.
- source_word: הַמֹּשְׁלִים
  choice: các thi sĩ
  rationale: Trong ngữ cảnh này, từ này chỉ những người sáng tác hoặc ngâm một câu thơ mang tính châm ngôn hay chế nhạo. “Các thi sĩ” ngắn gọn, tự nhiên và phù hợp thể thơ của lời trích, còn các nghĩa khả dĩ khác được bảo lưu trong chú thích.
- source_word: בֹּאוּ
  choice: Hãy đến
  rationale: Mệnh lệnh số nhiều được chuyển thành lời kêu gọi trực tiếp, tự nhiên trong tiếng Việt.
- source_word: חֶשְׁבּוֹן
  choice: Hết-bôn
  rationale: Phiên âm địa danh Hê-bơ-rơ theo lối đọc rõ ràng, quen thuộc trong văn bản Kinh Thánh tiếng Việt.
- source_word: תִּבָּנֶה
  choice: Nguyện ... được xây dựng
  rationale: Giữ thể bị động và sắc thái ý nguyện của dạng động từ trong câu thơ, thay vì biến thành một mệnh lệnh chủ động.
- source_word: וְתִכּוֹנֵן
  choice: và vững lập
  rationale: Diễn đạt ý được thiết lập vững chắc, đồng thời giữ nhịp song hành thi ca với “được xây dựng”.
- source_word: עִיר סִיחוֹן
  choice: thành của Si-hôn
  rationale: Giữ quan hệ sở hữu của kết cấu danh từ Hê-bơ-rơ mà không đồng nhất hóa Hết-bôn và Si-hôn trong cách diễn đạt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, với bố cục xuống dòng để làm rõ lời thơ được trích dẫn. “Nguyện” bảo tồn sắc thái ước nguyện của hai động từ thi ca; “vững lập” được dùng như một từ trang trọng, dễ hiểu trong văn cảnh thơ.
