  to: 'Vì thế, các thi sĩ[a] nói:


    “Hãy đến Hết-bôn!


    Nguyện thành của Si-hôn được xây dựng và được thiết lập!”'
  rationale: Chỉ thay “vững lập” bằng “được thiết lập” để câu tiếng Việt tự nhiên hơn và để hai động từ song hành cùng có cấu trúc bị động/ước nguyện rõ ràng. Giữ “các thi sĩ” trong bản văn và chú thích từ vựng để bảo lưu sự không chắc chắn của הַמֹּשְׁלִים.
  reviewer_model: gpt-5.6-terra
