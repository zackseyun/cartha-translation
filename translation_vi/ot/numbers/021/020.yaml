source:
  edition: WLC
  text: וּ/מִ/בָּמ֗וֹת הַ/גַּיְא֙ אֲשֶׁר֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב רֹ֖אשׁ הַ/פִּסְגָּ֑ה וְ/נִשְׁקָ֖פָה עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: vi
  text: rồi từ Ba-mốt đến thung lũng trong miền Mô-áp, đến đỉnh Pít-ga, là nơi nhìn xuống vùng hoang địa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “mặt của vùng hoang địa”, một cách nói chỉ khu vực ở phía trước hoặc phía dưới tầm nhìn.'
    reason: cultural_note
  - marker: b
    text: 'Hoặc: “vùng Giê-si-môn”, nếu hiểu từ Hê-bơ-rơ này là tên riêng của một khu vực thay vì danh từ chung chỉ vùng hoang địa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: rồi từ Ba-mốt
  rationale: Giữ giới từ chỉ điểm xuất phát và hiểu בָּמוֹת là địa danh trong hành trình; “rồi” nối tự nhiên với chuỗi địa điểm ở câu trước.
- source_word: הַגַּיְא
  choice: thung lũng
  rationale: גַּיְא chỉ thung lũng hoặc khe núi; “thung lũng” là cách gọi địa hình tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: trong miền Mô-áp
  rationale: שָׂדֶה có nghĩa đen là “cánh đồng” nhưng trong cách dùng địa lý có thể chỉ vùng đất hay miền; “miền Mô-áp” truyền đạt đúng chức năng địa lý mà không gợi một thửa ruộng riêng lẻ.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: đỉnh Pít-ga
  rationale: רֹאשׁ trong địa hình là “đỉnh”; הַפִּסְגָּה được hiểu là địa danh Pít-ga.
- source_word: וְנִשְׁקָפָה
  choice: là nơi nhìn xuống
  rationale: Động từ diễn tả vị trí cao trông ra hoặc nhìn xuống khu vực phía trước; mệnh đề quan hệ làm rõ rằng đỉnh Pít-ga có tầm nhìn ấy.
- source_word: עַל־פְּנֵי הַיְשִׁימֹן
  choice: nhìn xuống vùng hoang địa
  rationale: Diễn đạt tự nhiên thành ngữ địa hình “trên/hướng về mặt của” và dịch יְשִׁימוֹן theo nghĩa vùng đất hoang vu, đồng thời ghi nhận cách hiểu như địa danh trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ dạng nối tiếp của bản liệt kê hành trình; địa danh được phiên âm theo cách dễ đọc trong tiếng Việt. Dùng “miền Mô-áp” thay cho nghĩa đen “cánh đồng Mô-áp” để tránh gây hiểu nhầm về một cánh đồng canh tác cụ thể.
