  yaml_path: translation/ot/numbers/021/015.yaml
  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
translation:
  language: vi
  text: và triền dốc của các lòng suối[a] vươn đến nơi A-rơ nằm[b] và tựa vào biên giới Mô-áp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các thung lũng” hoặc “các khe núi”; từ Hê-bơ-rơ נְחָלִים thường chỉ các lòng suối hoặc dòng suối theo mùa.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đến chỗ ở của A-rơ.” Cụm từ Hê-bơ-rơ này khó hiểu và có thể nói đến vị trí hoặc khu định cư của A-rơ.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: triền dốc
  rationale: Danh từ chỉ một sườn hay triền dốc trong địa hình; “triền dốc” tự nhiên và phù hợp với hình ảnh các khe suối.
- source_word: הַנְּחָלִים
  choice: các lòng suối cạn
  rationale: נחל thường chỉ dòng suối theo mùa hoặc lòng suối thường khô trong vùng hoang mạc. Cách dịch này dễ hiểu hơn từ vay mượn “wadi” mà vẫn giữ sắc thái địa lý.
- source_word: אֲשֶׁר נָטָה
  choice: kéo dài
  rationale: נטה có thể mang nghĩa giăng ra, nghiêng hoặc vươn dài; ở đây “kéo dài” diễn đạt quan hệ không gian tự nhiên.
- source_word: לְשֶׁבֶת עָר
  choice: đến nơi thành A-rơ tọa lạc
  rationale: Cụm Hê-bơ-rơ khó, có thể liên quan đến chỗ ở, vị trí hay nơi định cư của A-rơ. Bản dịch chính hiểu đây là chỉ vị trí địa lý nhưng không che khuất cách hiểu khác, được ghi ở chú thích.
- source_word: עָר
  choice: A-rơ
  rationale: Tên địa danh được phiên âm theo âm đọc Hê-bơ-rơ và quy ước tiếng Việt.
- source_word: וְנִשְׁעַן
  choice: và tựa vào
  rationale: Giữ hình ảnh của động từ שען, nghĩa là tựa hay dựa vào, đồng thời vẫn dễ hiểu trong mô tả địa hình.
- source_word: לִגְבוּל מוֹאָב
  choice: biên giới Mô-áp
  rationale: גבול chỉ ranh giới hay biên giới; “biên giới Mô-áp” là cách nói rõ ràng, tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lòng suối cạn” thay cho thuật ngữ vay mượn “wadi”; giữ ẩn dụ địa hình “tựa vào”. Câu là phần tiếp nối của một trích đoạn thơ/địa chí ở câu trước nên được mở đầu bằng “và”.
