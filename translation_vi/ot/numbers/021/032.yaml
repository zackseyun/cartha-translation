  text: וַ/יִּשְׁלַ֤ח מֹשֶׁה֙ לְ/רַגֵּ֣ל אֶת יַעְזֵ֔ר וַֽ/יִּלְכְּד֖וּ בְּנֹתֶ֑י/הָ ו/יירש אֶת הָ/אֱמֹרִ֥י אֲשֶׁר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: vi
  text: Sau đó, Môi-se sai người đi do thám Gia-ê-xe. Họ chiếm các làng phụ thuộc của thành ấy[a] và đánh đuổi dân A-mô-rít đang ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các con gái của nó”, một thành ngữ Hê-bơ-rơ chỉ những khu định cư hoặc làng mạc phụ thuộc vào một thành.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sai người đi
  rationale: Động từ שלח trong mạch kể mang nghĩa sai phái; chủ thể số ít và mục đích do thám hàm ý Môi-se sai người thực hiện nhiệm vụ.
- source_word: לְרַגֵּל
  choice: đi do thám
  rationale: Dạng piel chỉ việc trinh sát một địa điểm; “do thám” tự nhiên trong tiếng Việt và giữ sắc thái quân sự.
- source_word: יַעְזֵר
  choice: Gia-ê-xe
  rationale: Phiên âm địa danh Hê-bơ-rơ theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: וַיִּלְכְּדוּ
  choice: họ chiếm
  rationale: לכד trong bối cảnh quân sự có nghĩa chiếm lấy; đại từ “họ” phản ánh chủ ngữ số nhiều của động từ.
- source_word: בְּנֹתֶיהָ
  choice: các làng phụ thuộc của thành ấy
  rationale: Nghĩa đen là “các con gái của nó”, nhưng đây là thành ngữ địa lý chỉ các khu định cư trực thuộc một thành chính; cách dịch này truyền đạt rõ quan hệ phụ thuộc.
- source_word: וַיִּירַשׁ
  choice: đánh đuổi
  rationale: ירש trong ngữ cảnh chinh phục có thể diễn tả việc tước quyền cư trú hoặc chiếm hữu bằng cách loại cư dân trước đó; “đánh đuổi” phù hợp với tân ngữ chỉ dân cư và không thêm ý thừa kế.
- source_word: הָאֱמֹרִי
  choice: dân A-mô-rít
  rationale: Danh từ dân tộc số ít tập hợp được diễn đạt tự nhiên bằng “dân” trong tiếng Việt.
- source_word: אֲשֶׁר שָׁם
  choice: đang ở đó
  rationale: Mệnh đề quan hệ xác định nhóm dân A-mô-rít có mặt tại địa điểm vừa nói đến.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Dùng “các làng phụ thuộc” trong chính văn để người đọc hiểu ngay thành ngữ địa lý, đồng thời giữ nghĩa đen trong chú thích.
