source:
  edition: WLC
  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: vi
  text: Từ đó, họ lên đường và đóng trại ở phía bên kia sông Ạt-nôn[a], trong hoang mạc trải dài từ biên giới của dân A-mô-rít[b], vì sông Ạt-nôn là ranh giới của Mô-áp, phân cách Mô-áp với dân A-mô-rít.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ có thể chỉ vùng ở bên kia sông Ạt-nôn hoặc vùng đối diện sông, tùy theo điểm nhìn của người kể.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “đi ra từ biên giới của dân A-mô-rít.” Ở đây, hình ảnh nói về hoang mạc trải dài từ biên giới ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Từ đó
  rationale: Cách diễn đạt tự nhiên, đánh dấu việc rời địa điểm vừa được nhắc đến và giữ mạch tường thuật.
- source_word: נָסָעוּ
  choice: họ lên đường
  rationale: Trong các trình thuật hành trình, động từ này chỉ việc nhổ trại để tiếp tục đi; “lên đường” chuyển tải rõ ý khởi hành.
- source_word: וַיַּחֲנוּ
  choice: và đóng trại
  rationale: Diễn đạt trực tiếp hành động dựng trại tại một địa điểm mới bằng tiếng Việt hiện đại.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: ở phía bên kia sông Ạt-nôn
  rationale: עֵבֶר chỉ phía hoặc miền bên kia một ranh giới tùy theo điểm nhìn. Cách dịch này tự nhiên và không xác định quá mức hướng địa lý.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: Xác định khu vực nơi họ đóng trại ở phía bên kia sông Ạt-nôn; “hoang mạc” phù hợp với מִדְבָּר trong bối cảnh địa lý.
- source_word: הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: trải ra từ biên giới của dân A-mô-rít
  rationale: Phân từ יֹצֵא, nghĩa đen là “đi ra”, ở đây mô tả hoang mạc kéo dài hoặc trải ra từ ranh giới của dân A-mô-rít.
- source_word: גְּבוּל
  choice: biên giới; ranh giới
  rationale: Danh từ chỉ đường phân định lãnh thổ. “Biên giới” tự nhiên khi đi với dân A-mô-rít, còn “ranh giới” làm rõ chức năng phân cách của sông Ạt-nôn.
- source_word: הָאֱמֹרִי
  choice: dân A-mô-rít
  rationale: Hình thức số ít trong tiếng Hê-bơ-rơ được dùng theo nghĩa tập thể để chỉ cả dân tộc; “dân A-mô-rít” giữ được nghĩa ấy trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Mở đầu mệnh đề giải thích lý do của phần mô tả địa lý phía trước.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: sông Ạt-nôn là ranh giới của Mô-áp
  rationale: Mệnh đề không có động từ nêu một thực trạng địa lý; thêm “là” là cần thiết và tự nhiên trong tiếng Việt.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: phân cách Mô-áp với dân A-mô-rít
  rationale: Chuyển cấu trúc lặp “giữa... và giữa...” thành cách nói tiếng Việt tự nhiên, đồng thời giữ rõ chức năng đường biên giữa hai bên.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đóng trại”, “hoang mạc” và “phân cách” để mô tả hành trình và địa lý rõ ràng; phiên âm địa danh theo lối quen thuộc trong tiếng Việt: Ạt-nôn, Mô-áp, A-mô-rít.'
