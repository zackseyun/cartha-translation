  text: וַ/נִּירָ֛/ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד דִּיב֑וֹן וַ/נַּשִּׁ֣ים עַד נֹ֔פַח אֲשֶׁ֖רׄ עַד מֵֽידְבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: vi
  text: Chúng ta đã bắn vào chúng[a]; Hết-bôn đã bị diệt cho đến Đi-bôn. Chúng ta đã tàn phá cho đến Nô-pha[b], trải dài đến Mê-đê-ba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm mở đầu trong tiếng Hê-bơ-rơ rất khó hiểu; cũng có thể dịch là “chúng ta đã đánh đổ chúng” hoặc “quyền thống trị của chúng đã bị diệt”.
    reason: textual_variant
  - marker: b
    text: Dạng từ được dịch là “đã tàn phá” cũng không chắc chắn; có người phân tích từ này theo cách khác, nhưng văn cảnh bài ca chiến thắng nghiêng về một động từ chỉ sự tàn phá.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: Chúng ta đã bắn chúng
  rationale: Hình thái và ý nghĩa của từ này rất khó xác định. Cách dịch này hiểu từ theo ngữ căn liên quan đến hành động bắn và nhận ra hình thái ngôi thứ nhất số nhiều kèm hậu tố ngôi thứ ba số nhiều, phù hợp với hình ảnh chiến trận trong bài ca chế nhạo; các cách hiểu chính khác được giữ trong chú thích.
- source_word: אָבַד
  choice: đã bị diệt
  rationale: Động từ diễn tả sự tiêu vong hoặc bị hủy diệt; cách dịch bị động tự nhiên trong tiếng Việt và hợp với số phận của một thành trong văn cảnh chiến thắng.
- source_word: חֶשְׁבּוֹן
  choice: Hết-bôn
  rationale: Địa danh được phiên âm theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: עַד דִּיבוֹן
  choice: cho đến Đi-bôn
  rationale: עַד chỉ giới hạn hoặc phạm vi không gian; “cho đến” diễn đạt tự nhiên ý ấy.
- source_word: וַנַּשִּׁים
  choice: Chúng ta đã tàn phá
  rationale: Dạng từ khó hiểu, nhưng trong mạch bài ca chiến thắng, cách đọc như một động từ ngôi thứ nhất số nhiều chỉ sự tàn phá phù hợp hơn cách hiểu như danh từ “phụ nữ”; sự bất định được ghi chú.
- source_word: עַד נֹפַח
  choice: cho đến Nô-pha
  rationale: עַד đánh dấu phạm vi; Nô-pha được giữ như địa danh phiên âm.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: là nơi trải dài đến Mê-đê-ba
  rationale: אֲשֶׁר mở một mệnh đề quan hệ gắn với Nô-pha và ghi thêm phạm vi địa lý; “trải dài đến” làm rõ quan hệ mà không loại bỏ hoàn toàn sự cô đọng của câu thơ.
- source_word: מֵידְבָא
  choice: Mê-đê-ba
  rationale: Địa danh được phiên âm theo âm tiết tự nhiên của tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp của một bài ca chiến thắng. Đại từ “chúng ta” phản ánh ngôi thứ nhất số nhiều của lời ca. Các địa danh được phiên âm dễ đọc; hai điểm bất định thật sự của bản Hê-bơ-rơ được giữ bằng chú thích, không bị giải quyết quá mức.
