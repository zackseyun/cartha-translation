base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: vi
  text: Pha-ra-ôn đã nổi giận với các bề tôi của mình và giam[a] tôi trong nhà của viên chỉ huy đội cận vệ[b]—cả tôi lẫn quan đứng đầu các thợ làm bánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đặt dưới sự canh giữ”; từ Hê-bơ-rơ chỉ tình trạng bị canh giữ, không nhất thiết nói đến một nhà tù chính thức.
    reason: lexical_alternative
  - marker: b
    text: Chức danh này, sát nghĩa hơn, là “người đứng đầu những người giết mổ hoặc hành hình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: nổi giận
  rationale: Diễn đạt tự nhiên ý tức giận của động từ Hê-bơ-rơ mà không nhấn mạnh quá mức thành thịnh nộ.
- source_word: עֲבָדָיו
  choice: các bầy tôi của mình
  rationale: Trong bối cảnh triều đình, từ này chỉ những người phục vụ vua, cụ thể là các quan phụ trách rượu và bánh; “bầy tôi” giữ được quan hệ lệ thuộc vào Pha-ra-ôn mà không mặc nhiên xác định họ là nô lệ.
- source_word: בְּמִשְׁמַר
  choice: giam giữ
  rationale: Từ Hê-bơ-rơ nói đến tình trạng bị canh giữ, câu lưu; “giam giữ” rõ nghĩa trong tiếng Việt hiện đại nhưng không nhất thiết hàm ý một nhà tù chính thức.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: nhà viên chỉ huy đội cận vệ
  rationale: Cụm từ là một chức danh triều đình trong truyện Giô-sép. Cách dịch này tự nhiên và phù hợp chức năng trong ngữ cảnh, còn nghĩa sát chữ liên quan đến người giết mổ hoặc hành hình được ghi ở chú thích.
- source_word: שַׂר הָאֹפִים
  choice: quan đứng đầu các thợ làm bánh
  rationale: Cấu trúc Hê-bơ-rơ chỉ người đứng đầu nhóm thợ làm bánh của hoàng gia; cách diễn đạt này rõ ràng hơn với độc giả hiện đại.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: cả tôi lẫn quan đứng đầu các thợ làm bánh
  rationale: Giữ sự nhấn mạnh do tiếng Hê-bơ-rơ lặp lại “tôi” và đánh dấu riêng cả hai người là đối tượng bị giam.
theological_decisions: []
