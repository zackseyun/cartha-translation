  - severity: low
    issue: “Các bầy tôi” có sắc thái cổ và kém tự nhiên hơn trong văn phong hiện đại.
    rationale: “Các bề tôi” vẫn giữ quan hệ thần thuộc với quân vương của עֲבָדָיו, phù hợp bối cảnh triều đình hơn và không hàm ý nô lệ.
