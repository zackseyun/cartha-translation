translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Pha-ra-ôn” theo lối phiên âm phổ biến. Chọn thuật ngữ nông nghiệp tự nhiên trong tiếng Việt (“bông lúa lép”, “chắc”, “đầy hạt”) thay vì bám máy móc vào các tính từ vốn cũng dùng cho súc vật.
