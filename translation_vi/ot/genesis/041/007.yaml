base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: vi
  text: Bảy bông lúa lép nuốt bảy bông lúa chắc và đầy hạt[a]. Pha-ra-ôn tỉnh giấc, thì ra đó là một giấc mơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bảy bông lúa đầy đặn và đầy hạt.” Từ Hê-bơ-rơ được dịch là “chắc” cũng có thể diễn tả tình trạng phát triển khỏe mạnh hoặc đầy đặn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: nuốt chửng
  rationale: Giữ hình ảnh sống động và khác thường của động từ בלע (“nuốt”); “nuốt chửng” tự nhiên trong tiếng Việt mà không thêm sắc thái săn mồi như “ăn ngấu nghiến”.
- source_word: הַשִּׁבֳּלִים
  choice: bông lúa
  rationale: Trong ngữ cảnh này, שִׁבֹּלֶת chỉ phần bông mang hạt, không phải toàn bộ thân cây; “bông lúa” là cách nói tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: הַדַּקּוֹת
  choice: lép
  rationale: Nghĩa cơ bản là “mỏng/gầy”; khi tả bông lúa, “lép” là cách diễn đạt tiếng Việt tự nhiên cho tình trạng ít hạt, đồng thời phù hợp với sự tương phản cùng các bông chắc và đầy hạt.
- source_word: שֶׁבַע
  choice: bảy
  rationale: Số từ trực tiếp.
- source_word: הַבְּרִיאוֹת
  choice: chắc
  rationale: Tính từ diễn tả trạng thái khỏe, mập hoặc phát triển tốt. Với bông lúa, “chắc” tự nhiên hơn “khỏe” và truyền đạt tình trạng tốt, đầy đặn mà không dùng cách nói gượng.
- source_word: וְהַמְּלֵאוֹת
  choice: và đầy hạt
  rationale: מלא nghĩa là “đầy”; thêm “hạt” để nêu rõ điều làm bông lúa đầy, phù hợp ngữ cảnh và tiếng Việt tự nhiên.
- source_word: וַיִּיקַץ
  choice: tỉnh giấc
  rationale: Cách kể trang trọng, tự nhiên để diễn tả việc thức dậy sau khi ngủ.
- source_word: וְהִנֵּה
  choice: thì ra
  rationale: Trong câu tỉnh giấc và nhận biết đó là mơ, “thì ra” truyền đạt sự nhận ra bất ngờ do הִנֵּה đánh dấu, tự nhiên hơn cách dịch cổ “kìa”.
- source_word: חֲלוֹם
  choice: đó là một giấc mơ
  rationale: Tiếng Hê-bơ-rơ nói cô đọng “và kìa, một giấc mơ”; tiếng Việt cần bổ sung hệ từ và đại từ để câu rõ nghĩa, nhưng vẫn giữ nét nhận ra đột ngột.
