  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: vi
  text: Pha-ra-ôn đặt tên cho Giô-sép là Xa-phơ-nát Pa-nê-ác[a], rồi ban cho Giô-sép Ách-nát, con gái của Phô-ti Phê-ra, tư tế của thành Ôn[b], làm vợ. Giô-sép đi khắp[c] đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể phiên âm là “Xa-phơ-nát Pa-a-nê-ác”. Ý nghĩa của tên Ai Cập này không chắc chắn, và có nhiều cách giải nghĩa khác nhau.
    reason: lexical_alternative
  - marker: b
    text: Ôn là một thành phố Ai Cập, về sau được người Hy Lạp gọi là Hê-li-ô-pô-lít.
    reason: cultural_note
  - marker: c
    text: Nguyên văn có thể hiểu sát hơn là “đi trên đất Ai Cập”; cách diễn đạt này cũng có thể gợi đến phạm vi quyền cai quản của Giô-sép.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם יוֹסֵף
  choice: đặt tên cho Giô-sép là
  rationale: Trong ngữ cảnh đặt tên, קרא + שׁם được diễn đạt tự nhiên và chính xác trong tiếng Việt là “đặt tên ... là”, thay vì sao chép thành ngữ Hê-bơ-rơ một cách gượng gạo.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: Xa-phơ-nát Pa-nê-ác
  rationale: Đây là tên Ai Cập có nguyên nghĩa chưa chắc chắn, nên phiên âm thay vì dịch nghĩa; giữ hai thành tố như văn bản Hê-bơ-rơ.
- source_word: וַיִּתֶּן לוֹ
  choice: ban ... làm vợ ông
  rationale: “Ban” phù hợp với hành động của vua trong văn cảnh, còn đại từ “ông” chỉ Giô-sép và tạo câu tiếng Việt tự nhiên.
- source_word: אָסְנַת
  choice: Ách-nát
  rationale: Phiên âm tên riêng theo hình thức Hê-bơ-rơ, bằng lối viết dễ đọc trong tiếng Việt.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: con gái của Phô-ti Phê-ra
  rationale: Chuyển trực tiếp quan hệ thân tộc và phiên âm tên riêng.
- source_word: כֹּהֵן אֹן
  choice: tư tế thành Ôn
  rationale: כֹּהֵן chỉ người đảm nhiệm chức vụ thờ cúng; “tư tế” thích hợp với bối cảnh tôn giáo Ai Cập. Thêm “thành” để người đọc nhận ra Ôn là địa danh.
- source_word: לְאִשָּׁה
  choice: làm vợ ông
  rationale: Diễn đạt tự nhiên thành ngữ hôn nhân của nguyên văn và làm rõ người nhận làm vợ là Giô-sép.
- source_word: וַיֵּצֵא ... עַל אֶרֶץ מִצְרָיִם
  choice: đi khắp đất Ai Cập
  rationale: Trong ngữ cảnh này, יצא với עַל mô tả Giô-sép ra đi trên phạm vi lãnh thổ; “đi khắp” là tiếng Việt tự nhiên, đồng thời ghi nhận cách hiểu sát hình thức hơn ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm nhất quán theo âm hình Hê-bơ-rơ; tránh dịch suy đoán tên Ai Cập. Câu cuối ưu tiên nghĩa chuyển động trên toàn lãnh thổ nhưng bảo lưu sắc thái không chắc chắn của giới từ עַל trong chú thích.
