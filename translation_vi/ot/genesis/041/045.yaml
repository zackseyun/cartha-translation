  to: Pha-ra-ôn đặt tên cho Giô-sép là Xa-phơ-nát Pa-nê-ác[a], rồi ban cho Giô-sép Ách-nát, con gái của Phô-ti Phê-ra, tư tế của thành Ôn[b], làm vợ. Giô-sép đi khắp[c] đất Ai Cập.
