  text: Then the seven years of abundance that had been in the land of Egypt came to an end.
translation:
  language: vi
  text: Bảy năm sung túc tại xứ Ai Cập đã chấm dứt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: đã chấm dứt
  rationale: Động từ כלה ở thể wayyiqtol, giống cái số nhiều, phù hợp với “bảy năm”; cách dịch này diễn đạt tự nhiên ý một thời kỳ đã đi đến hồi kết.
- source_word: שֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: bảy năm sung túc
  rationale: Giữ rõ số từ và quan hệ cấu tạo “những năm của sự sung túc”; “sung túc” tự nhiên, trang trọng và phù hợp với thời kỳ sản vật dồi dào trong văn cảnh.
- source_word: אֲשֶׁר הָיָה
  choice: tại
  rationale: Mệnh đề quan hệ tiếng Hê-bơ-rơ được diễn đạt gọn theo cú pháp tiếng Việt; ý rằng thời kỳ sung túc diễn ra ở xứ Ai Cập vẫn được bảo toàn.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: tại xứ Ai Cập
  rationale: “Xứ Ai Cập” phản ánh אֶרֶץ מִצְרָיִם và phù hợp với văn phong tường thuật Kinh Thánh hiện đại; “tại” chỉ nơi diễn ra thời kỳ ấy.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ trọng tâm ở “bảy năm sung túc” và diễn đạt tự nhiên sự chuyển tiếp của trình thuật, không thêm từ nối vốn không hiện diện tách biệt ngoài hình thái wayyiqtol.
