base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: vi
  text: 'Rồi Giô-sép nói với Pha-ra-ôn: “Giấc mơ của Pha-ra-ôn là một[a]; Đức Chúa Trời đã báo cho Pha-ra-ôn biết điều Ngài đang làm[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Giấc mơ của Pha-ra-ôn là một.” Trong ngữ cảnh, hai giấc mơ truyền đạt một thông điệp duy nhất.'
    reason: lexical_alternative
  - marker: b
    text: “Đang làm” cũng có thể hiểu là “sắp làm” trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Dạng tự sự với waw liên tiếp đẩy diễn tiến câu chuyện về phía trước; “Rồi” tự nhiên trong tiếng Việt hiện đại.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dạng phiên âm tên riêng quen dùng trong Kinh Thánh tiếng Việt.
- source_word: אֶל־פַּרְעֹה
  choice: với Pha-ra-ôn
  rationale: Trong công thức dẫn lời, “nói với” là cách diễn đạt tự nhiên của tiếng Việt.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: Giấc mơ của Pha-ra-ôn chỉ là một
  rationale: Giữ số ít và vị ngữ “một” của tiếng Hê-bơ-rơ, đồng thời “chỉ là một” diễn đạt tự nhiên ý hai giấc mơ hợp thành một thông điệp.
- source_word: אֵת אֲשֶׁר
  choice: điều
  rationale: Mở đầu mệnh đề nội dung một cách gọn và tự nhiên trong tiếng Việt.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt, chỉ chính Đức Chúa Trời mà không thêm nội dung giải nghĩa.
- source_word: עֹשֶׂה
  choice: đang làm
  rationale: Phản ánh trực tiếp phân từ Hê-bơ-rơ và không áp đặt sắc thái tương lai gần vốn chỉ được suy ra từ ngữ cảnh.
- source_word: הִגִּיד לְפַרְעֹה
  choice: đã báo cho Pha-ra-ôn biết
  rationale: Diễn đạt tự nhiên thể Hiphil của נגד, mang nghĩa báo hoặc làm cho biết.
theological_decisions:
- issue: Cách dịch הָאֱלֹהִים
  choice: Đức Chúa Trời
  alternative: Thượng Đế
  rationale: “Đức Chúa Trời” là cách gọi trang trọng và phổ thông trong truyền thống Kinh Thánh tiếng Việt; câu không đòi hỏi thêm mạo từ hay lời giải thích thần học.
- issue: Thời tính của phân từ עֹשֶׂה
  choice: đang làm
  alternative: sắp làm
  rationale: Giữ hình thái phân từ và sự căng thẳng giữa hành động hiện tại với biến cố sắp xảy ra; “sắp làm” là một cách hiểu hợp ngữ cảnh nhưng thêm sắc thái tương lai không được đánh dấu minh nhiên.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc và sự lặp lại “Pha-ra-ôn” của nguyên văn; dùng dấu chấm phẩy để nối chặt hai vế giải thích.
