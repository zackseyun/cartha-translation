  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của tiếng Hê-bơ-rơ: trình tự tự sự, tên riêng, số ít hình thức của “giấc mơ”, lời khẳng định “là một”, và việc Đức Chúa Trời đã cho Pha-ra-ôn biết điều Ngài làm. Chú thích a xử lý thích đáng sự căng thẳng giữa số ít trong nguyên văn và hai giấc mơ trong ngữ cảnh. Cách dịch “đang làm” bám sát phân từ עֹשֶׂה; chú thích b nêu đúng khả năng hiểu theo sắc thái sắp xảy ra mà không áp đặt nó vào bản văn.'
  naturalness: Câu thứ hai của bản nháp (“điều … đang làm, Ngài đã báo…”) có thể hiểu được, nhưng cách đảo bổ ngữ đầu câu, ngắt bằng dấu phẩy, hơi gượng trong tiếng Việt hiện đại. Đảo lại thành “Đức Chúa Trời đã báo cho Pha-ra-ôn biết điều Ngài đang làm” tự nhiên, rõ quan hệ quy chiếu của “Ngài”, và không đổi nghĩa. Bỏ “chỉ” trong “chỉ là một” cũng tránh thêm sắc thái loại trừ không cần thiết; vị ngữ “là một” đã chuyển tải nguyên văn.
  terminology: “Giô-sép”, “Pha-ra-ôn”, và “Đức Chúa Trời” nhất quán với lối dùng Kinh Thánh tiếng Việt trang trọng, hiện đại. “Đức Chúa Trời” là cách gọi Việt ngữ đã quy ước cho הָאֱלֹהִים trong ngữ cảnh này, không thêm giải thích giáo phái. “Báo cho … biết” diễn đạt phù hợp động từ Hiphil הִגִּיד.
