  edition: WLC
  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: vi
  text: Ngươi sẽ cai quản nhà ta, và toàn dân ta sẽ tuân lệnh ngươi.[a] Chỉ về ngai vàng, ta mới lớn hơn ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ theo sát mặt chữ: “và theo miệng ngươi, toàn dân ta sẽ hôn.” Cách nói này ở đây thường được hiểu là dân chúng vâng theo mệnh lệnh hoặc bày tỏ sự quy phục trước quyền của Giô-sép.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: cai quản nhà ta
  rationale: Giới từ עַל cùng với בֵּיתִי diễn tả quyền quản trị trên nhà hoặc hoàng gia của Pha-ra-ôn. “Cai quản nhà ta” tự nhiên trong tiếng Việt và làm rõ chức trách được giao.
- source_word: וְעַל־פִּיךָ יִשַּׁק
  choice: sẽ tuân lệnh ngươi
  rationale: Cụm này theo sát mặt chữ là “sẽ hôn theo miệng ngươi”, nhưng trong ngữ cảnh trao quyền, nó thường được hiểu là vâng theo lời truyền hoặc bày tỏ sự quy phục. Bản chính truyền đạt nghĩa theo ngữ cảnh, còn cách nói nguyên văn được giữ trong chú thích.
- source_word: כָּל־עַמִּי
  choice: toàn dân ta
  rationale: עַם chỉ toàn thể dân chúng; “toàn dân ta” ngắn gọn, trang trọng và phù hợp lời của vua.
- source_word: רַק
  choice: Chỉ
  rationale: רַק nêu giới hạn duy nhất đối với quyền của Giô-sép.
- source_word: הַכִּסֵּא
  choice: ngai vàng
  rationale: כִּסֵּא theo nghĩa đen là ngai; ở đây chỉ địa vị và vương quyền riêng của Pha-ra-ôn. “Ngai vàng” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: ta mới lớn hơn ngươi
  rationale: Động từ גדל với מִן diễn tả sự vượt hơn. Cách dịch này giữ sát hình thức và sự căng thẳng của nguyên văn, trong khi cụm “về ngai vàng” xác định đây là sự vượt hơn về địa vị.
theological_decisions:
- issue: Phạm vi quyền của Giô-sép so với Pha-ra-ôn
  choice: Giữ lời khẳng định rằng Pha-ra-ôn chỉ lớn hơn Giô-sép về ngai vàng
  alternative: Diễn giải thành “chỉ mình ta có địa vị cao hơn ngươi” hoặc “ta sẽ hơn ngươi một bậc”
  rationale: Nguyên văn gắn sự vượt hơn trực tiếp với הַכִּסֵּא, nên bản dịch không mở rộng thành nhận định về phẩm chất, đạo đức hay mọi phương diện quyền lực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta—ngươi” phù hợp lời phán của Pha-ra-ôn trong bối cảnh cổ đại; “cai quản” và “tuân lệnh” diễn đạt rõ quan hệ hành chính, còn chú thích bảo tồn hình ảnh nguyên văn có tính đa nghĩa.
