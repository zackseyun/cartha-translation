  yaml_path: translation/ot/genesis/041/020.yaml
  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: vi
  text: Rồi những con bò gầy gò, xấu xí ăn hết bảy con bò khỏe mạnh đầu tiên[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Rồi những con bò ốm nhom, trông xấu xí ăn hết bảy con bò béo tốt đầu tiên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: ăn hết
  rationale: Động từ אכל có nghĩa là “ăn”; trong bối cảnh giấc mơ, “ăn hết” diễn đạt tự nhiên việc những con bò kia bị ăn trọn, mà không tăng sắc thái dữ dội như “nuốt chửng”.
- source_word: הַפָּרוֹת
  choice: những con bò
  rationale: Danh từ số nhiều giống cái chỉ cụ thể các con bò cái; trong tiếng Việt, “những con bò” vừa chính xác vừa tự nhiên.
- source_word: הָרַקּוֹת
  choice: gầy gò
  rationale: Tính từ này mô tả thân hình gầy, thiếu sức sống; “gầy gò” rõ nghĩa và phù hợp với văn cảnh.
- source_word: וְהָרָעוֹת
  choice: xấu xí
  rationale: Ở đây רעות nói về dáng vẻ tồi tệ chứ không mang nghĩa đạo đức là “gian ác”; “xấu xí” truyền đạt đúng phương diện ngoại hình.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: bảy con bò
  rationale: Cụm gồm dấu hiệu tân ngữ, số từ và danh từ được chuyển ngữ trực tiếp, tự nhiên.
- source_word: הָרִאשֹׁנוֹת
  choice: lúc đầu
  rationale: Từ này xác định nhóm bò xuất hiện trước trong trình tự của giấc mơ; “lúc đầu” tránh cách diễn đạt cứng “bảy con bò đầu tiên” trong cấu trúc câu này.
- source_word: הַבְּרִיאֹת
  choice: khỏe mạnh
  rationale: Tính từ mô tả tình trạng khỏe khoắn, đầy đặn. “Khỏe mạnh” giữ được phạm vi nghĩa rộng, trong khi “béo tốt” là một khả năng theo văn cảnh.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Rồi” nối câu với diễn tiến của lời thuật; “ăn hết” tự nhiên trong tiếng Việt và phản ánh kết quả trọn vẹn trong cảnh tượng. Dấu chú thích [a] được đặt ngay sau phần câu liên quan.
