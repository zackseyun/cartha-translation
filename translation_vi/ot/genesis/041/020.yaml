  rationale: Chỉ điều chỉnh vị trí của yếu tố chỉ trình tự để phản ánh rõ ràng hơn chức năng bổ nghĩa của הָרִאשֹׁנוֹת (“đầu tiên/ban đầu”), đồng thời giữ nguyên nghĩa và giọng văn của bản nháp. Chú thích được chỉnh tương ứng để phương án thay thế cũng không còn mơ hồ.
