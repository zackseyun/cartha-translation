  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: vi
  text: Sự sung túc trong xứ sẽ không còn được nhận thấy vì nạn đói tiếp theo,[a] vì nạn đói ấy sẽ vô cùng khốc liệt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ không còn được biết đến”; động từ Hê-bơ-rơ có thể mang nghĩa được biết, được nhận ra hoặc được nhận thấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: sẽ không còn được nhận thấy
  rationale: Dạng Niphal của ידע có thể chỉ việc được biết, được nhận ra hoặc được nhận thấy. Trong ngữ cảnh này, ý là sự sung túc trước đó sẽ không còn được cảm nhận hay thấy rõ khi nạn đói ập đến.
- source_word: הַשָּׂבָע
  choice: sự sung túc
  rationale: Danh từ này nói đến tình trạng dư dật do những mùa thu hoạch phong phú; “sự sung túc” tự nhiên và phù hợp với bối cảnh kinh tế-nông nghiệp.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: Ở đây chỉ lãnh thổ chịu ảnh hưởng trong câu chuyện về Ai Cập, không nhất thiết toàn thể trái đất.
- source_word: מִפְּנֵי
  choice: vì
  rationale: 'Giới từ diễn tả nguyên nhân: sự sung túc không còn được nhận thấy do nạn đói.'
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: nạn đói xảy đến sau đó
  rationale: Cách dịch giữ trình tự thời gian và ý chỉ định của cụm Hê-bơ-rơ, đồng thời tự nhiên trong tiếng Việt.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: bởi nạn đói ấy sẽ vô cùng khốc liệt
  rationale: כבד nghĩa đen là “nặng”, nhưng khi nói về nạn đói thì mang nghĩa cực kỳ nghiêm trọng hoặc khốc liệt. Việc lặp “nạn đói ấy” làm rõ chủ thể trong tiếng Việt.
