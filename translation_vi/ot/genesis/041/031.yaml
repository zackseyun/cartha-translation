  rationale: 'Chỉnh sửa nhỏ để câu tiếng Việt tự nhiên và mạch lạc hơn: thay “nạn đói xảy đến sau đó” bằng “nạn đói tiếp theo,” và tránh sự lặp không cần thiết giữa “vì” và “bởi.” Nghĩa, sắc thái tương lai và chú thích từ vựng được giữ nguyên.'
