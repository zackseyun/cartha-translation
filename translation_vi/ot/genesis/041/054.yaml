base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: vi
  text: Bảy năm đói kém bắt đầu xảy đến, đúng như Giô-sép đã nói. Nạn đói xảy ra khắp các xứ, nhưng khắp đất Ai Cập đều có bánh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lương thực”; từ Hê-bơ-rơ được dịch là “bánh” cũng có thể chỉ thức ăn hay lương thực nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: bắt đầu ập đến
  rationale: Giữ ý khởi đầu của động từ và hình ảnh những năm đói kém đang kéo đến; “ập đến” tự nhiên trong tiếng Việt và diễn đạt sức nặng của tai họa mà không thêm nội dung mới.
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: bảy năm đói kém
  rationale: Cách nói tự nhiên, rõ nghĩa trong tiếng Việt, bảo toàn cấu trúc chỉ thời kỳ đói kém kéo dài bảy năm.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: đúng như Giô-sép đã nói
  rationale: “Đúng như” thể hiện sự tương ứng; “đã nói” cho thấy lời của Giô-sép có trước biến cố.
- source_word: וַיְהִי רָעָב
  choice: nạn đói xảy ra
  rationale: Diễn đạt tự nhiên cấu trúc hiện hữu của tiếng Hê-bơ-rơ, không cường điệu hóa.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: khắp các xứ
  rationale: Giữ dạng số nhiều và tránh sắc thái chính trị hiện đại có thể có ở từ “quốc gia”.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: nhưng trên toàn đất Ai Cập
  rationale: Liên từ וּ về hình thức là “và”, nhưng quan hệ ngữ cảnh có tính tương phản giữa nạn đói ở các xứ và lương thực tại Ai Cập; “nhưng” làm rõ quan hệ này trong tiếng Việt.
- source_word: הָיָה לָחֶם
  choice: vẫn có bánh
  rationale: Giữ danh từ cụ thể “bánh” của nguyên văn; “vẫn” làm nổi bật sự tương phản đã có trong ngữ cảnh, còn nghĩa rộng hơn được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “Giô-sép” và “Ai Cập” theo cách gọi Kinh Thánh phổ biến trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau “bánh”, là từ mà chú thích giải nghĩa.
