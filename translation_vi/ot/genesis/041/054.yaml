  to: Bảy năm đói kém bắt đầu xảy đến, đúng như Giô-sép đã nói. Nạn đói xảy ra khắp các xứ, nhưng khắp đất Ai Cập đều có bánh[a].
  rationale: Bản sửa thay cách nói cường điệu “ập đến” bằng “xảy đến” để phản ánh trung tính hơn cấu trúc ‘bắt đầu ... đến’, và bỏ “vẫn” để không thêm ý tiếp diễn. Các yếu tố khác, gồm số nhiều “các xứ,” đối lập ngữ cảnh qua “nhưng,” và chú thích tại “bánh,” được giữ phù hợp với nguyên ngữ và văn phong Việt hiện đại.
