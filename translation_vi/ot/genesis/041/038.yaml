- from: 'Pha-ra-ôn nói với các quần thần: “Chúng ta có thể tìm được một người như người này, là người có thần linh của Đức Chúa Trời ngự trong mình chăng?”[a]'
  to: 'Pha-ra-ôn nói với quần thần: “Chúng ta có thể tìm được một người như thế này mà thần khí của Đức Chúa Trời[a] ở trong người ấy chăng?”'
  rationale: Bản sửa thay cách dùng “thần linh ... ngự” bằng “thần khí ... ở trong người ấy” để phản ánh từ רוח và giới từ בּוֹ chính xác, tự nhiên hơn, đồng thời không định trước một diễn giải giáo lý. Câu quan hệ được làm gọn; chú thích được sửa để nêu các lựa chọn ngữ nghĩa khả dĩ một cách rõ ràng và được neo đúng cụm từ liên quan.
