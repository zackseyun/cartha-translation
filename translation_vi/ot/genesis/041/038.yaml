  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: vi
  text: 'Pha-ra-ôn nói với quần thần: “Chúng ta có thể tìm được một người như thế này mà thần khí của Đức Chúa Trời[a] ở trong người ấy chăng?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ cũng có thể được hiểu là “thần của Đức Chúa Trời,” “một thần khí của Đức Chúa Trời,” hoặc “một thần khí thiêng liêng.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Mạch kể tuần tự đã rõ trong tiếng Việt; không cần thêm “rồi/bấy giờ” một cách máy móc.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm danh hiệu Ai Cập quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: עֲבָדָיו
  choice: các quần thần
  rationale: Trong bối cảnh triều đình, từ này chỉ những người phục vụ nhà vua, tức các quan cận thần; “quần thần” tự nhiên hơn “các đầy tớ” mà không ấn định chức tước cụ thể.
- source_word: הֲנִמְצָא
  choice: Chúng ta có thể tìm được ... chăng?
  rationale: Giữ câu hỏi tu từ ở ngôi thứ nhất số nhiều và tạo sắc thái trang trọng, tự nhiên trong lời vua.
- source_word: כָזֶה אִישׁ
  choice: một người như người này
  rationale: Giữ lực chỉ định của כָזֶה và quy chiếu cụ thể đến Giô-sép.
- source_word: אֲשֶׁר ... בּוֹ
  choice: là người có ... ngự trong mình
  rationale: Diễn đạt tự nhiên trong tiếng Việt đồng thời giữ ý rằng thần linh hiện diện “trong người ấy”.
- source_word: רוּחַ אֱלֹהִים
  choice: thần linh của Đức Chúa Trời
  rationale: “Thần linh” không buộc người đọc phải quyết định giữa danh xưng ngôi vị và nghĩa rộng hơn là thần khí/linh thiêng; sở hữu cách “của Đức Chúa Trời” giữ sát cấu trúc Hê-bơ-rơ.
theological_decisions:
- issue: רוּחַ אֱלֹהִים có chỉ đích danh Thánh Linh hay mang nghĩa rộng hơn như một thần khí đến từ Đức Chúa Trời
  choice: thần linh của Đức Chúa Trời
  alternative: Thần của Đức Chúa Trời; một thần khí của thần linh
  rationale: Cụm Hê-bơ-rơ không có mạo từ và lời này do Pha-ra-ôn nói, nên không nên dùng cách viết hoa để âm thầm xác định một cách hiểu tín lý duy nhất. Bản chính giữ sự quy thuộc về Đức Chúa Trời, còn chú thích nêu các khả năng thật sự của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải. “Quần thần” phù hợp khung cảnh cung đình; “chăng” duy trì sắc thái câu hỏi tu từ mà vẫn dễ hiểu. Dấu chú thích [a] được đặt ngay sau toàn câu liên quan.
