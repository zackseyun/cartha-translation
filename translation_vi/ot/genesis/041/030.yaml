base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: vi
  text: Sau đó sẽ nổi lên bảy năm đói kém, và mọi sự dư dật trong xứ Ai Cập sẽ bị quên lãng[a]; nạn đói sẽ tàn phá xứ ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi cảnh no đủ.” Từ Hê-bơ-rơ chỉ sự no đủ hoặc dư dật, đặc biệt khi đối lập với nạn đói.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nạn đói sẽ tiêu hao xứ ấy” hoặc “sẽ hủy hoại xứ ấy.” Động từ Hê-bơ-rơ có thể mang nghĩa làm cho cạn kiệt hoàn toàn hoặc tàn phá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: Sau đó sẽ nổi lên
  rationale: Động từ Qal trong mạch lời tiên báo mang nghĩa tương lai; “sau đó” diễn đạt trình tự của waw, còn “nổi lên” giữ hình ảnh của động từ קום.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: bảy năm đói kém
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho chuỗi cấu trúc chỉ bảy năm có nạn đói; “đói kém” phù hợp với nạn đói trên quy mô toàn xứ.
- source_word: אַחֲרֵיהֶן
  choice: Sau đó
  rationale: Hậu tố giống cái số nhiều quy chiếu về bảy năm dư dật ở câu trước. Trong tiếng Việt, “sau đó” chuyển đạt tự nhiên quan hệ nối tiếp mà không cần đại từ số nhiều gượng ép.
- source_word: וְנִשְׁכַּח
  choice: sẽ bị quên lãng
  rationale: Giữ nghĩa bị động của thể Nifal và diễn tả việc thời kỳ dư dật không còn được nhớ đến vì nạn đói.
- source_word: כָּל הַשָּׂבָע
  choice: mọi sự dư dật
  rationale: שָׂבָע chỉ tình trạng no đủ, sung túc hay dư dật; lựa chọn này giữ nghĩa rộng, không thu hẹp thành riêng lương thực dự trữ.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: trong đất Ai Cập
  rationale: Bảo toàn cách gọi địa lý trang trọng của nguyên văn và tạo liên kết với “cả xứ” ở vế cuối.
- source_word: וְכִלָּה
  choice: sẽ tàn phá
  rationale: Trong ngữ cảnh nạn đói, כלה có thể chỉ sự làm tiêu hao hoàn toàn hoặc hủy hoại. “Tàn phá” tự nhiên trong tiếng Việt và giữ sức nặng của hậu quả.
- source_word: הָרָעָב
  choice: nạn đói
  rationale: Danh từ xác định quy chiếu về bảy năm đói kém vừa nêu; “nạn đói” là cách gọi chuẩn cho tai họa trên diện rộng.
- source_word: אֶת הָאָרֶץ
  choice: cả xứ
  rationale: אָרֶץ ở đây chỉ xứ Ai Cập đã nêu trước đó. “Cả xứ” chuyển đạt phạm vi toàn vùng một cách tự nhiên; từ “cả” làm rõ tính bao quát vốn hàm chứa trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ ba bước của nguyên văn: nạn đói kế tiếp, sự dư dật bị quên lãng, rồi toàn xứ bị tàn phá. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn và chú thích phản ánh những khả năng từ vựng thực sự của tiếng Hê-bơ-rơ.'
