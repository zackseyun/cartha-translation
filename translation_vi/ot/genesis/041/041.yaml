  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף רְאֵה֙ נָתַ֣תִּי אֹֽתְ/ךָ֔ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: vi
  text: 'Pha-ra-ôn nói với Giô-sép: “Hãy xem, ta đã đặt ngươi cai quản toàn cõi Ai Cập.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ có waw liên tiếp tiếp diễn mạch kể chuyện; tiếng Việt không cần dịch máy móc liên từ וַ־ ở đầu câu.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm tước hiệu hoàng gia quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֶל יוֹסֵף
  choice: với Giô-sép
  rationale: Trong cấu trúc động từ nói năng, אֶל chỉ người nghe; “nói với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: רְאֵה
  choice: Hãy xem
  rationale: Giữ sắc thái mệnh lệnh dùng để hướng sự chú ý của Giô-sép vào lời tuyên bố long trọng tiếp theo.
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: ta đã đặt ngươi cai quản
  rationale: נתן có nghĩa cơ bản là “ban/đặt”, nhưng khi đi với עַל trong bối cảnh bổ nhiệm thì diễn tả việc trao quyền trên một phạm vi; cách dịch này rõ và tự nhiên mà vẫn giữ ý bổ nhiệm.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: toàn cõi Ai Cập
  rationale: כָּל biểu thị toàn bộ phạm vi, còn אֶרֶץ ở đây là lãnh thổ hay vương quốc; “toàn cõi Ai Cập” diễn đạt gọn, trang trọng và tự nhiên.
theological_decisions: []
