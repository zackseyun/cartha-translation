  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Đại từ “ta–ngươi” phản ánh lời của vua với một bề tôi trong bối cảnh triều đình cổ đại, không nhằm truyền tải một lập trường thần học riêng.
