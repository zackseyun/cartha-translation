    rationale: Cách nói này trong tiếng Việt thường chỉ sự phân chia hoặc tiến hành từng ít một. Trong câu này, ngữ cảnh và cách dùng לִקְמָצִים hướng đến sản lượng phong phú; nên diễn đạt ý đó trong thân bài và bảo lưu hình ảnh “nắm/vốc” ở chú thích.
