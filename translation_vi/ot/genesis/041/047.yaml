  source_fidelity: Bản dịch nhận đúng chủ ngữ nông nghiệp của הָאָרֶץ, thời kỳ bảy năm, và ý sản xuất/cho hoa lợi của וַתַּעַשׂ. Tuy nhiên, “từng nắm một” dễ gợi hành động hoặc sản lượng ít, từng phần nhỏ, trong khi לִקְמָצִים là cách diễn đạt khó nhưng trong ngữ cảnh nhấn mạnh sự phong phú của hoa lợi.
