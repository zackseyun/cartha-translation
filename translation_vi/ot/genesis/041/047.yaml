  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: vi
  text: Trong bảy năm sung túc, đất đai cho hoa lợi dồi dào[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc theo nghĩa đen: “thành những nắm” hoặc “những vốc.” Nguyên văn Hê-bơ-rơ dùng một từ chỉ nắm hoặc vốc để diễn tả sản lượng phong phú của đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: sinh hoa lợi
  rationale: Động từ עשה có nghĩa cơ bản là “làm, tạo ra”; khi chủ ngữ là đất đai trong bối cảnh nông nghiệp, cụm “sinh hoa lợi” diễn đạt tự nhiên ý đất sản xuất mùa màng.
- source_word: הָאָרֶץ
  choice: đất đai
  rationale: Trong mạch truyện này, từ ngữ chỉ đất canh tác của Ai Cập, không phải toàn thể trái đất; “đất đai” phù hợp với ngữ cảnh nông nghiệp.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: Trong bảy năm sung túc
  rationale: Cụm này chỉ thời kỳ bảy năm dư dật đã được báo trước. “Sung túc” chuyển tải שׂבע một cách trang trọng, tự nhiên và dễ hiểu.
- source_word: לִקְמָצִים
  choice: từng nắm một
  rationale: Danh từ קְמָץ chỉ một nắm hoặc vốc; giới từ לְ được dùng theo nghĩa trạng ngữ. Cách dịch này giữ hình ảnh cụ thể của nguyên văn thay vì diễn giải đơn thuần là “dồi dào”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “từng nắm một” cố ý giữ hình ảnh khác thường của tiếng Hê-bơ-rơ; chú thích giúp người đọc nhận ra hàm ý về sản lượng dồi dào.
