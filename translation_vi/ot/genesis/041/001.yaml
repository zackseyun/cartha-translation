base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: vi
  text: Sau khi trọn hai năm[a], Pha-ra-ôn nằm mơ, và kìa, Pha-ra-ôn đang đứng bên sông Nin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “hai năm ngày”, một thành ngữ Hê-bơ-rơ chỉ một khoảng thời gian trọn hai năm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Sau
  rationale: Cụm mở đầu tường thuật cùng מִקֵּץ xác định sự việc xảy ra khi một khoảng thời gian đã kết thúc; “Sau” tự nhiên trong tiếng Việt và chuyển tải đúng quan hệ thời gian.
- source_word: שְׁנָתַיִם יָמִים
  choice: trọn hai năm
  rationale: Thành ngữ sát nghĩa là “hai năm ngày”, nhấn mạnh một khoảng hai năm đầy đủ; “trọn hai năm” vừa rõ nghĩa vừa tự nhiên.
- source_word: פַרְעֹה
  choice: Pha-ra-ôn
  rationale: Dùng cách phiên âm danh hiệu hoàng gia đã quen thuộc trong tiếng Việt.
- source_word: חֹלֵם
  choice: nằm mơ
  rationale: Phân từ diễn tả việc mơ trong cảnh tường thuật; tiếng Việt tự nhiên dùng “nằm mơ”, không cần ép sang cấu trúc tiếp diễn.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ sắc thái chỉ xuất, thu hút sự chú ý và tính sống động của cảnh trong giấc mơ.
- source_word: עֹמֵד
  choice: đang đứng
  rationale: “Đang đứng” bảo tồn giá trị diễn tiến của phân từ và dựng rõ cảnh hiện ra trong giấc mơ.
- source_word: עַל
  choice: bên
  rationale: Trong quan hệ vị trí với một con sông, עַל có nghĩa tự nhiên là “bên/cạnh”, không phải “trên”.
- source_word: הַיְאֹר
  choice: sông Nin
  rationale: Trong bối cảnh Ai Cập, danh từ có mạo từ này chỉ sông Nin; gọi đích danh giúp độc giả nhận ra địa danh, trong khi chú thích ghi nhận cách dịch sát hơn là “con sông”.
