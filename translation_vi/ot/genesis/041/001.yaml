translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Kìa” giữ sức gợi của הִנֵּה mà vẫn quen thuộc trong văn chương tiếng Việt. Dùng “vua” ở mệnh đề sau để tránh lặp “Pha-ra-ôn” và làm rõ chủ thể theo cách tự nhiên; từ này không bổ sung một nhân vật hay ý niệm mới.
