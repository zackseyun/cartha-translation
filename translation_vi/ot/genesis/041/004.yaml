  text: וַ/תֹּאכַ֣לְנָה הַ/פָּר֗וֹת רָע֤וֹת הַ/מַּרְאֶה֙ וְ/דַקֹּ֣ת הַ/בָּשָׂ֔ר אֵ֚ת שֶׁ֣בַע הַ/פָּר֔וֹת יְפֹ֥ת הַ/מַּרְאֶ֖ה וְ/הַ/בְּרִיאֹ֑ת וַ/יִּיקַ֖ץ פַּרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: vi
  text: Bấy giờ, những con bò có vẻ ngoài xấu xí và thân hình gầy gò ăn bảy con bò có vẻ ngoài đẹp đẽ và béo tốt[a]. Rồi Pha-ra-ôn tỉnh giấc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “có vẻ ngoài xấu ... và khỏe mạnh”; các từ Hê-bơ-rơ có nghĩa sát hơn là “xấu/tệ” và “khỏe mạnh, mập mạp”, nhưng văn cảnh thiên về sự tương phản thể chất giữa xấu xí, gầy gò với đẹp đẽ, béo tốt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: Bấy giờ ... ăn thịt
  rationale: Dạng wayyiqtol giống cái số nhiều tiếp nối diễn biến trong giấc mơ. “Bấy giờ” diễn đạt tự nhiên bước tiến của câu chuyện; “ăn thịt” phù hợp với việc bò ăn các con bò khác mà không tăng mức độ thành “nuốt chửng”.
- source_word: הַפָּרוֹת
  choice: những con bò
  rationale: Danh từ là dạng giống cái số nhiều, chỉ cụ thể các con bò cái trong giấc mơ; tiếng Việt thường dùng tự nhiên là “những con bò”.
- source_word: רָעוֹת הַמַּרְאֶה
  choice: có vẻ ngoài xấu xí
  rationale: רָעוֹת có nghĩa cơ bản là “xấu/tệ”; khi kết hợp với “vẻ ngoài”, cụm này mô tả diện mạo khó coi. Cách dịch giữ được cấu trúc và sự tương phản với “đẹp đẽ”.
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: và thân hình gầy gò
  rationale: Nghĩa sát là “mỏng/gầy về thịt”. “Thân hình gầy gò” là cách nói hiện đại, tự nhiên và vẫn thể hiện rõ tình trạng thể chất.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: bảy con bò
  rationale: Tiểu từ chỉ tân ngữ trực tiếp, số từ và danh từ được chuyển thẳng thành “bảy con bò”.
- source_word: יְפֹת הַמַּרְאֶה
  choice: có vẻ ngoài đẹp đẽ
  rationale: Cách dịch giữ phép đối song song trực tiếp với “có vẻ ngoài xấu xí” và phù hợp với giọng kể trang trọng.
- source_word: וְהַבְּרִיאֹת
  choice: và béo tốt
  rationale: בָּרִיא có thể mang nghĩa “khỏe mạnh, béo, mập mạp”. Trong thế đối lập với bò gầy, “béo tốt” diễn tả cụ thể hình thể, đồng thời vẫn gợi tình trạng khỏe mạnh.
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: Pha-ra-ôn liền tỉnh giấc
  rationale: Động từ có nghĩa là tỉnh thức khỏi giấc ngủ. “Liền tỉnh giấc” diễn đạt tự nhiên sự kiện kế tiếp; tên riêng dùng dạng quen thuộc “Pha-ra-ôn”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ sự đối xứng trong các cụm mô tả hai nhóm bò, đồng thời dùng “ăn thịt” để tránh cách hiểu thông thường rằng bò chỉ ăn thức ăn.
