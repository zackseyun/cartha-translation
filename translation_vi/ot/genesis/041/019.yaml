  text: וְ/הִנֵּ֞ה שֶֽׁבַע פָּר֤וֹת אֲחֵרוֹת֙ עֹל֣וֹת אַחֲרֵי/הֶ֔ן דַּלּ֨וֹת וְ/רָע֥וֹת תֹּ֛אַר מְאֹ֖ד וְ/רַקּ֣וֹת בָּשָׂ֑ר לֹֽא רָאִ֧יתִי כָ/הֵ֛נָּה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם לָ/רֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: vi
  text: Kìa, bảy con bò cái khác đi lên sau chúng; chúng gầy yếu, có dáng vẻ rất xấu xí và gầy gò. Trong khắp đất Ai Cập, ta chưa từng thấy con bò nào xấu xí đến thế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ ở cuối câu có nghĩa rộng hơn là “tồi tệ đến thế” hoặc “khốn khổ đến thế”, nói chung về tình trạng đặc biệt thảm hại của những con bò.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ sắc thái trình bày sống động của lời thuật lại giấc mộng mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: bảy con bò cái khác
  rationale: פָּרוֹת chỉ những con bò cái; אֲחֵרוֹת mô tả một nhóm khác với bảy con đã xuất hiện trước đó.
- source_word: עֹלֹת אַחֲרֵיהֶן
  choice: đi lên sau chúng
  rationale: Giữ hình ảnh chuyển động đi lên từ bối cảnh sông Nin, đồng thời diễn đạt phân từ Hê-bơ-rơ bằng động từ hữu hạn tự nhiên.
- source_word: דַּלּוֹת
  choice: ốm yếu
  rationale: Diễn tả tình trạng suy nhược, còm cõi, đồng thời tránh lặp với mô tả thân thể gầy ở vế sau.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: hình dạng rất xấu xí
  rationale: Trong ngữ cảnh này, רָעוֹת nói về vẻ ngoài tồi tệ chứ không mang nghĩa đạo đức; תֹּאַר nhấn mạnh hình dạng, diện mạo.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: gầy trơ xương
  rationale: Cách nói tự nhiên diễn đạt rõ tình trạng có rất ít thịt, nhưng không thêm ý bệnh tật ngoài hình ảnh tiều tụy của nguyên văn.
- source_word: לֹא רָאִיתִי כָהֵנָּה
  choice: ta chưa từng thấy con bò nào ... đến thế
  rationale: Diễn đạt tự nhiên lời hồi tưởng của Pha-ra-ôn và giữ phép so sánh rằng không có con nào giống chúng về mức độ tồi tệ.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: trong khắp đất Ai Cập
  rationale: Giữ phạm vi nhấn mạnh của כָּל và lối gọi địa lý trang trọng, quen thuộc.
- source_word: לָרֹעַ
  choice: xấu xí đến thế
  rationale: Trong mạch văn về hình dạng và thân thể, cách dịch này tự nhiên và tránh khiến người đọc hiểu רֹעַ là sự gian ác; chú thích vẫn bảo lưu nghĩa đánh giá rộng hơn của tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “ta” phù hợp lời Pha-ra-ôn tự thuật; câu dùng những từ thông dụng như “ốm yếu”, “xấu xí”, “gầy trơ xương” để hình ảnh rõ ràng với độc giả phổ thông.
