  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: vi
  text: Ông đặt tên cho người con thứ hai là Ép-ra-im[a], vì Đức Chúa Trời đã làm cho tôi sinh hoa kết quả trong xứ sở khốn khổ của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ép-ra-im có âm gần với cụm từ Hê-bơ-rơ mang nghĩa là “Đức Chúa Trời đã làm cho tôi sinh hoa kết quả.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: Ông đặt tên cho người con thứ hai là
  rationale: Diễn đạt tự nhiên thành ngữ đặt tên trong tiếng Việt; “người con” được bổ sung theo ngữ cảnh trực tiếp về hai con trai của Giô-sép.
- source_word: אֶפְרָיִם
  choice: Ép-ra-im
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc, đồng thời giữ chú thích về lối chơi chữ Hê-bơ-rơ.
- source_word: כִּי
  choice: vì ông nói
  rationale: כִּי giới thiệu lời giải thích cho tên gọi. Thêm “ông nói” giúp câu trích dẫn sau đó tự nhiên trong tiếng Việt mà không thay đổi nội dung.
- source_word: הִפְרַנִי
  choice: đã làm cho tôi sinh hoa kết quả
  rationale: Thể Hiphil của פרה mang nghĩa khiến trở nên sinh hoa kết quả; cách dịch này giữ hình ảnh và liên hệ âm thanh với tên Ép-ra-im tốt hơn “làm cho tôi thịnh vượng”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ ở số ít và ngữ cảnh chỉ Đức Chúa Trời; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: בְּאֶרֶץ עָנְיִי
  choice: trong vùng đất tôi chịu khổ
  rationale: Giữ ý địa điểm của אֶרֶץ và sức nặng của עֳנִי, nhưng diễn đạt tự nhiên hơn cấu trúc danh từ sở hữu “đất của sự khốn khổ tôi”.
theological_decisions:
- issue: Phạm vi của nỗi khổ mà Giô-sép nhắc đến
  choice: Giữ Ai Cập vừa là nơi Đức Chúa Trời ban kết quả, vừa là vùng đất Giô-sép chịu khổ.
  alternative: Giới hạn nỗi khổ chỉ vào thời kỳ trước khi Giô-sép được cất nhắc, hoặc hiểu rộng là cảnh xa cách gia đình.
  rationale: Câu Hê-bơ-rơ không xác định hẹp phạm vi của עָנְיִי; bản dịch giữ nguyên sự căng thẳng giữa phước lành của Đức Chúa Trời và kinh nghiệm đau khổ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sinh hoa kết quả” để giữ ẩn dụ nguyên ngữ và lối chơi chữ; dùng lời trích dẫn trực tiếp nhằm trình bày rõ lời giải thích tên gọi.
