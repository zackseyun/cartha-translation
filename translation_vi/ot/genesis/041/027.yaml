  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc giải nghĩa của tiếng Hê-bơ-rơ: bảy con bò gầy còm/xấu xí tượng trưng cho bảy năm, và bảy bông lúa lép bị gió đông làm hại tượng trưng cho bảy năm đói kém. “Gầy còm” diễn đạt tốt רַקּוֹת; “bông lúa lép” chuyển tải tự nhiên ý bông hạt không đầy của שִׁבֳּלִים הָרֵקוֹת; “đói kém” phù hợp với רָעָב. Cụm “đi lên sau chúng” bảo toàn trình tự xuất hiện trong giấc mơ.'
