base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: vi
  text: Bảy con bò gầy còm và xấu xí đi lên sau chúng là bảy năm; còn bảy bông lúa lép bị gió đông thiêu cháy sẽ là bảy năm đói kém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: gầy còm
  rationale: Trong ngữ cảnh mô tả bò, từ này chỉ tình trạng gầy yếu, thiếu thịt; “gầy còm” tự nhiên và gợi đúng hình ảnh hơn cách dịch đơn thuần là “mỏng”.
- source_word: וְהָרָעֹת
  choice: và xấu xí
  rationale: Ở đây רַע mô tả dáng vẻ hoặc tình trạng tồi tệ của những con bò, không mang nghĩa xấu xa về đạo đức. “Xấu xí” phù hợp với hình ảnh trong giấc mơ.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: đi lên sau chúng
  rationale: Giữ hình ảnh những con bò từ sông đi lên và trình tự chúng xuất hiện sau bảy con bò trước.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: là bảy năm
  rationale: Diễn đạt trực tiếp sự đồng nhất mang tính biểu tượng giữa bảy con bò và bảy năm.
- source_word: הַשִׁבֳּלִים הָרֵקוֹת
  choice: những bông lúa lép
  rationale: שִׁבֹּלֶת là bông lúa/ngũ cốc, còn רֵיקוֹת cho biết hạt không đầy; “bông lúa lép” là cách diễn đạt nông nghiệp tự nhiên và chính xác trong tiếng Việt.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: bị gió đông thiêu cháy
  rationale: Cụm từ mô tả bông lúa bị luồng gió đông khô nóng làm hư hại. “Thiêu cháy” truyền đạt sinh động tác động làm khô cháy mà không hàm ý nhất thiết có lửa.
- source_word: יִהְיוּ
  choice: sẽ là
  rationale: Dạng chưa hoàn thành hướng tới điều sắp xảy ra trong lời giải thích mang tính dự báo của Giô-sép.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: bảy năm đói kém
  rationale: “Đói kém” là cách nói tiếng Việt tự nhiên cho nạn thiếu lương thực kéo dài, phù hợp với רָעָב trong mạch truyện.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “gầy còm”, “bông lúa lép” và “đói kém” để tái hiện hình ảnh cụ thể bằng tiếng Việt tự nhiên; giữ sự chuyển từ “là” sang “sẽ là” theo cấu trúc và sắc thái dự báo của bản Hê-bơ-rơ.
