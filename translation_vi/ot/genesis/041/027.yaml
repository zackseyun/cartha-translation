  terminology: Các thuật ngữ nông nghiệp và nạn đói được dùng nhất quán, không áp đặt diễn giải thần học. “Xấu xí” hợp với ngữ cảnh mô tả tình trạng/diện mạo bất thường của đàn bò trong giấc mơ, dù רָעוֹת có phạm vi nghĩa rộng hơn là “tồi tệ/bất thường.”
