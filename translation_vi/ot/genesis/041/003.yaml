base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: vi
  text: Kìa, có bảy con bò cái khác từ sông Nin đi lên sau chúng, vẻ ngoài xấu xí và thân thể gầy gò[a]; chúng đứng cạnh những con bò kia trên bờ sông Nin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vẻ ngoài xấu xí và gầy về thịt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ sức gợi trực tiếp, sống động của hạt từ trình thuật הִנֵּה, thích hợp với cảnh tượng bất ngờ trong giấc mơ.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: bảy con bò cái khác
  rationale: פָּרוֹת là danh từ giống cái, chỉ rõ bò cái; אֲחֵרוֹת phân biệt nhóm thứ hai với bảy con trước.
- source_word: עֹלוֹת אַחֲרֵיהֶן מִן הַיְאֹר
  choice: từ sông Nin đi lên theo sau chúng
  rationale: Diễn đạt tự nhiên việc đàn bò xuất hiện từ dưới sông và theo sau nhóm trước; trong bối cảnh Ai Cập, הַיְאֹר chỉ sông Nin.
- source_word: רָעוֹת מַרְאֶה
  choice: xấu xí
  rationale: Cụm từ mô tả vẻ ngoài khó coi chứ không mang nghĩa xấu về đạo đức; cách nói ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: דַקּוֹת בָּשָׂר
  choice: gầy trơ thịt
  rationale: Giữ hình ảnh thân thể gầy gò của nguyên văn và tạo câu tiếng Việt dễ hiểu; chú thích nêu cách dịch sát cấu trúc hơn.
- source_word: וַתַּעֲמֹדְנָה אֵצֶל הַפָּרוֹת
  choice: rồi đứng cạnh những con bò kia
  rationale: וַתַּעֲמֹדְנָה là động từ trình thuật đơn giản; אֵצֶל diễn tả vị trí sát bên. 'Những con bò kia' giúp phân biệt với nhóm mới mà không thêm ý nghĩa.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: trên bờ sông Nin
  rationale: שְׂפַת, nghĩa đen là 'mép', được dùng tự nhiên là 'bờ' khi nói về sông.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và giàu tính trình thuật. Dùng “Kìa” để giữ nét sống động của nguyên văn; dùng “sông Nin” để xác định rõ địa danh trong bối cảnh Ai Cập. Mọi dấu chú thích đều xuất hiện trong chính văn.
