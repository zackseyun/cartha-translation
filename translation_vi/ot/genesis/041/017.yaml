  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: vi
  text: 'Bấy giờ, Pha-ra-ôn nói với Giô-sép: “Trong giấc mơ của ta, này, ta đang đứng trên bờ sông Nin[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “con sông.” Trong bối cảnh Ai Cập của sách Sáng Thế, từ này thường chỉ sông Nin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nói
  rationale: Trong lời kể dẫn vào câu nói trực tiếp, “nói” là cách diễn đạt tự nhiên, đúng chức năng của động từ דּבר.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tước hiệu vua Ai Cập.
- source_word: אֶל־יוֹסֵף
  choice: với Giô-sép
  rationale: Giới từ אֶל đánh dấu người tiếp nhận lời nói; “nói với Giô-sép” tự nhiên trong tiếng Việt.
- source_word: בַּחֲלֹמִי
  choice: Trong giấc mơ
  rationale: Chuyển tải trực tiếp giới từ ב và hậu tố ngôi thứ nhất số ít; sở hữu đã rõ qua lời kể ở ngôi thứ nhất nên tiếng Việt không cần lặp “của ta”.
- source_word: הִנְנִי
  choice: kìa, ta đang
  rationale: “Kìa” giữ sắc thái trình hiện và sự sống động của הִנֵּה, còn “ta đang” kết hợp tự nhiên với phân từ theo bối cảnh thuật lại giấc mơ.
- source_word: עֹמֵד
  choice: đứng
  rationale: Diễn đạt trạng thái đứng của phân từ עמד; kết hợp với “đang” để thể hiện cảnh tượng đang hiện ra trong giấc mơ.
- source_word: עַל שְׂפַת
  choice: trên bờ
  rationale: שׂפה nghĩa gốc là “mép” hoặc “môi”, nhưng khi nói về sông thì chỉ bờ sông; “trên bờ” vừa sát cấu trúc vừa tự nhiên.
- source_word: הַיְאֹר
  choice: sông Nin
  rationale: Trong bối cảnh Ai Cập, יְאֹר thường chỉ sông Nin; bản dịch nêu rõ đối tượng, đồng thời chú thích nghĩa hình thức là “con sông”.
