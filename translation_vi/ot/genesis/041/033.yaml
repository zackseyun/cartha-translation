  text: וְ/עַתָּה֙ יֵרֶ֣א פַרְעֹ֔ה אִ֖ישׁ נָב֣וֹן וְ/חָכָ֑ם וִ/ישִׁיתֵ֖/הוּ עַל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: vi
  text: Bây giờ, Pha-ra-ôn hãy tìm một người sáng suốt và khôn ngoan[a], rồi lập người ấy cai quản đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy xem xét/chọn một người sáng suốt và khôn ngoan.” Động từ Hê-bơ-rơ trong ngữ cảnh này có thể mang nghĩa nhìn xem, tìm ra hoặc lựa chọn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Đánh dấu bước chuyển từ việc giải nghĩa giấc mộng sang lời khuyên thực tế; cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: יֵרֶא
  choice: hãy tìm
  rationale: Thể mệnh lệnh nhẹ của ראה trong ngữ cảnh này mang ý xem xét, tìm hoặc chọn một người thích hợp, chứ không chỉ nhìn thấy.
- source_word: פַרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm quen thuộc của tước hiệu hoàng gia Ai Cập trong tiếng Việt.
- source_word: אִישׁ
  choice: một người
  rationale: Diễn đạt tự nhiên trong tiếng Việt; đại từ hồi chỉ “người ấy” vẫn giữ tính xác định cá nhân mà không thêm ý ngoài nguyên văn.
- source_word: נָבוֹן
  choice: sáng suốt
  rationale: Diễn tả năng lực thấu hiểu, nhận định đúng và phán đoán thực tiễn, phù hợp với nhiệm vụ quản trị.
- source_word: וְחָכָם
  choice: và khôn ngoan
  rationale: Giữ hai phẩm chất song song trong tiếng Hê-bơ-rơ và phân biệt tương đối với “sáng suốt”.
- source_word: וִישִׁיתֵהוּ
  choice: rồi lập người ấy cai quản
  rationale: Động từ שׂים nghĩa đen là đặt/lập; trong bối cảnh hành chính, cụm này truyền đạt rõ việc giao chức vụ và quyền quản trị.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: đất Ai Cập
  rationale: Kết hợp với “cai quản” để thể hiện עַל là quyền hành trên toàn lãnh thổ, đồng thời giữ danh từ אֶרֶץ là “đất”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “rồi” để thể hiện trình tự tự nhiên giữa việc tìm/chọn người và việc lập người ấy cai quản; không thêm sắc thái thần học hay cơ cấu chức vụ cụ thể ngoài nguyên văn.
