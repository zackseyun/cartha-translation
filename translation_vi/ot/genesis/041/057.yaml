  yaml_path: translation/ot/genesis/041/057.yaml
  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: vi
  text: Người ta từ khắp đất[a] đến Ai Cập, đến chỗ Giô-sép để mua ngũ cốc, vì nạn đói rất trầm trọng khắp đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “từ khắp xứ” hoặc “từ khắp thế giới.” Từ Hê-bơ-rơ אֶרֶץ có thể chỉ “đất,” “xứ” hoặc “thế giới”; ở đây có lẽ nói rộng về các vùng chịu ảnh hưởng của nạn đói.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Người từ khắp đất
  rationale: Cụm Hê-bơ-rơ theo sát mặt chữ là “cả đất,” nhưng chủ thể thực tế của động từ “đến” là cư dân. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời giữ phạm vi rộng và sắc thái khái quát của אָרֶץ.
- source_word: בָּאוּ מִצְרַיְמָה
  choice: kéo đến Ai Cập
  rationale: בוא diễn tả việc đến, còn đuôi chỉ hướng trong מִצְרַיְמָה biểu thị chuyển động về phía Ai Cập. “Kéo đến” diễn đạt tự nhiên việc đông người từ nhiều nơi cùng tìm đến.
- source_word: לִשְׁבֹּר
  choice: để mua ngũ cốc
  rationale: Trong bối cảnh nạn đói, שׁבר là cách nói về việc mua hoặc kiếm ngũ cốc. Nêu rõ “ngũ cốc” tránh hiểu đây là hành vi mua bán chung chung.
- source_word: אֶל יוֹסֵף
  choice: đến với Giô-sép
  rationale: Giữ hướng nghĩa trực tiếp của אֶל là “đến với/đến chỗ,” không đổi thành “mua từ Giô-sép,” vốn sẽ giải thích quá mức vai trò của giới từ.
- source_word: כִּי חָזַק הָרָעָב
  choice: vì nạn đói rất trầm trọng
  rationale: כִּי có giá trị nguyên nhân. חָזַק theo mặt chữ là “mạnh,” nhưng khi nói về nạn đói, “rất trầm trọng” là cách diễn đạt tiếng Việt tự nhiên và chính xác.
- source_word: בְּכָל הָאָרֶץ
  choice: khắp đất
  rationale: Lặp lại “khắp đất” để bảo toàn sự lặp từ và sức nhấn trong nguyên văn, không tự ý thu hẹp thành riêng đất Ai Cập.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “kéo đến” để thể hiện dòng người từ nhiều nơi, và giữ “khắp đất” ở cả hai vị trí nhằm phản ánh phép lặp của nguyên văn.
