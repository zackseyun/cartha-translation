  text: שֶׁ֧בַע פָּרֹ֣ת הַ/טֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִּׁבֳּלִים֙ הַ/טֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: vi
  text: Bảy con bò cái tốt là bảy năm, và bảy bông lúa tốt là bảy năm; đó là cùng một giấc mơ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרֹת
  choice: bò cái
  rationale: Danh từ chỉ cụ thể những con bò giống cái trong giấc mơ của Pha-ra-ôn; “bò cái” chính xác và tự nhiên hơn từ khái quát “bò”.
- source_word: הַטֹּבֹת
  choice: tốt
  rationale: Giữ nghĩa rộng và sự tương ứng trực tiếp với hình ảnh trong giấc mơ, không thu hẹp thành chỉ “khỏe mạnh” hay “đẹp”.
- source_word: שָׁנִים
  choice: năm
  rationale: Tương đương trực tiếp; các biểu tượng trong giấc mơ được giải thích rõ là những năm.
- source_word: שִׁבֳּלִים
  choice: bông lúa
  rationale: Chỉ phần mang hạt ở đầu thân cây ngũ cốc. “Bông lúa” là cách nói tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: đó là cùng một giấc mơ
  rationale: 'Truyền đạt trọng tâm của cấu trúc số ít: hai chuỗi biểu tượng hợp thành một giấc mơ có chung một thông điệp.'
- source_word: הֵנָּה
  choice: là
  rationale: Đại từ giống cái số nhiều làm thành tố liên kết trong tiếng Hê-bơ-rơ; tiếng Việt diễn đạt tự nhiên bằng “là”.
