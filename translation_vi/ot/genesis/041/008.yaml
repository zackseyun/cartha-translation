  source_fidelity: 'Bản dịch bám sát bản Hê-bơ-rơ: mốc thời gian, sự xao động nội tâm của Pha-ra-ôn, hành động sai người triệu tập các chuyên gia Ai Cập, và sự thất bại trong việc giải nghĩa giấc mơ đều được chuyển đạt đầy đủ. “Giấc mơ” số ít được giữ đúng theo văn bản Masoret, trong khi “những điều ấy” cùng chú thích bảo lưu đại từ tân ngữ số nhiều ở cuối câu.'
