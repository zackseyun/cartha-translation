  text: וַ/יְהִ֤י בַ/בֹּ֨קֶר֙ וַ/תִּפָּ֣עֶם רוּח֔/וֹ וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א אֶת כָּל חַרְטֻמֵּ֥י מִצְרַ֖יִם וְ/אֶת כָּל חֲכָמֶ֑י/הָ וַ/יְסַפֵּ֨ר פַּרְעֹ֤ה לָ/הֶם֙ אֶת חֲלֹמ֔/וֹ וְ/אֵין פּוֹתֵ֥ר אוֹתָ֖/ם לְ/פַרְעֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: vi
  text: Đến sáng, tinh thần Pha-ra-ôn xao động, nên ông sai người triệu tập tất cả các pháp sư Ai Cập và tất cả những người thông thái của xứ ấy. Pha-ra-ôn kể cho họ giấc mơ của mình, nhưng không ai có thể giải nghĩa những điều ấy[a] cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ dùng “giấc mơ” ở số ít, nhưng sau đó lại dùng đại từ số nhiều, sát nghĩa là “giải nghĩa chúng”. Đại từ số nhiều có thể chỉ các phần hoặc các hình ảnh trong giấc mơ. Một số bản dịch làm thuận số thành “giải nghĩa giấc mơ ấy”.
    reason: Giữ sự chuyển đổi số ít–số nhiều có thật trong bản nguồn mà vẫn giúp câu tiếng Việt dễ hiểu.
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Đến sáng
  rationale: Diễn đạt tự nhiên mốc thời gian và sự tiếp nối của câu chuyện.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: tinh thần Pha-ra-ôn xao động
  rationale: Giữ nghĩa cơ bản của רוּחַ là “tinh thần” và diễn tả trạng thái bất an mạnh bên trong của động từ פעמ; nêu rõ Pha-ra-ôn để câu tiếng Việt tự nhiên, không mơ hồ.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: ông sai người triệu tập
  rationale: 'Chuyển hai động từ nối tiếp theo lối nói tự nhiên trong tiếng Việt: Pha-ra-ôn sai người đi gọi, tức triệu tập họ.'
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: các pháp sư Ai Cập
  rationale: Chỉ các chuyên gia nghi lễ và huyền thuật Ai Cập, trong ngữ cảnh này có liên hệ với việc giải mộng.
- source_word: כָּל חֲכָמֶיהָ
  choice: tất cả những người thông thái của xứ ấy
  rationale: Giữ sự phân biệt với nhóm pháp sư; “xứ ấy” thể hiện hậu tố giống cái quy chiếu về Ai Cập mà không lặp từ nặng nề.
- source_word: אֶת חֲלֹמוֹ
  choice: giấc mơ của mình
  rationale: Giữ danh từ số ít đúng theo bản Hê-bơ-rơ Masoret.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: nhưng không ai có thể giải nghĩa những điều ấy cho ông
  rationale: “Giải nghĩa” phù hợp với פתר trong ngữ cảnh giấc mơ. “Những điều ấy” giữ dấu vết của đại từ số nhiều אֹתָם, dù danh từ đứng trước là “giấc mơ” số ít.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ra-ôn” theo cách phiên âm quen thuộc; tránh thuật ngữ giáo phái và không giải quyết thay bản nguồn sự căng thẳng giữa “giấc mơ” số ít với đại từ số nhiều.
