  rationale: Bản sửa bảo toàn tính không xác định về loại ngũ cốc của tiếng Hê-bơ-rơ, đồng thời chỉnh chú thích từ vựng để phản ánh chính xác nghĩa «đầy, mẩy» của בְּרִיאוֹת. Không thay đổi nội dung hay sắc thái tự sự của câu.
