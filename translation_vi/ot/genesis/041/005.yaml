translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Chiêm bao” phù hợp với ngữ cảnh Kinh Thánh và vẫn dễ hiểu; “kìa” giữ nét trình hiện sống động của nguyên văn. Các dấu chú thích được đặt ngay sau những từ mà chú thích giải thích.
