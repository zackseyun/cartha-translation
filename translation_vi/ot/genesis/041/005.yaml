  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: vi
  text: Rồi ông ngủ và chiêm bao lần thứ hai. Kìa, bảy bông ngũ cốc[a] đang mọc lên trên một thân, chắc mẩy[b] và tốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bảy gié ngũ cốc.” Từ Hê-bơ-rơ chỉ phần mang hạt, như bông hoặc gié, của cây ngũ cốc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đầy đặn.” Tính từ này mô tả những bông ngũ cốc đầy hạt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: Rồi ông ngủ
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “rồi” diễn đạt tự nhiên trình tự sự việc, còn “ngủ” giữ nguyên nghĩa đơn giản của động từ.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: và chiêm bao lần thứ hai
  rationale: שֵׁנִית có nghĩa trạng từ là “lần thứ hai”; cách dịch này sát nguyên văn và vẫn tự nhiên trong văn kể chuyện.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: הִנֵּה làm cho cảnh tượng trong chiêm bao hiện ra sống động; “kìa” giữ được chức năng trình hiện ấy mà phù hợp với tiếng Việt hiện đại.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: bảy bông lúa
  rationale: שִׁבֳּלִים chỉ phần đầu mang hạt của cây ngũ cốc. “Bông lúa” là cách nói quen thuộc, dễ hiểu trong tiếng Việt; “gié lúa” là một khả năng khác.
- source_word: עֹלֹת
  choice: đang mọc lên
  rationale: Phân từ diễn tả hành động đang diễn ra hoặc được trình bày sống động trong cảnh chiêm bao; “đang mọc lên” giữ sắc thái ấy.
- source_word: בְּקָנֶה אֶחָד
  choice: trên một thân lúa
  rationale: קָנֶה ở đây là thân hoặc cuống cây; giới từ בְּ được diễn đạt tự nhiên bằng “trên”, cho thấy nhiều bông cùng mọc trên một thân.
- source_word: בְּרִיאוֹת
  choice: chắc mẩy
  rationale: Tính từ diễn tả tình trạng đầy đặn, phát triển tốt. Khi nói về hạt hoặc bông lúa, “chắc mẩy” là cách diễn đạt tự nhiên và đúng ngữ cảnh hơn “béo”.
- source_word: וְטֹבוֹת
  choice: và tốt
  rationale: טוֹב có nghĩa rộng là tốt, đẹp hoặc có phẩm chất tốt; “tốt” giữ được phạm vi đánh giá rộng ấy.
