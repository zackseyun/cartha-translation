source:
  edition: WLC
  text: וּ/לְ/יוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּ/טֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: vi
  text: Trước khi năm đói kém đến[a], A-sê-nát, con gái của Phô-ti-phê-ra, tư tế tại Ôn[b], sinh cho Giô-sép hai con trai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước khi năm của nạn đói đến”. Tiếng Hê-bơ-rơ dùng danh từ số ít “năm” tại đây, chỉ lúc thời kỳ đói kém bắt đầu.'
    reason: lexical_alternative
  - marker: b
    text: Ôn là một thành phố Ai Cập, về sau được người Hy Lạp gọi là Hê-li-ô-pô-lít.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד ... שְׁנֵי בָנִים
  choice: sinh ... hai con trai
  rationale: Dạng bị động của ילד đi với chủ ngữ số nhiều “hai con trai”. Tiếng Việt tự nhiên hơn khi chuyển sang câu chủ động với A-sê-nát làm chủ ngữ, đồng thời vẫn giữ nguyên nội dung sinh nở.
- source_word: וּלְיוֹסֵף
  choice: cho Giô-sép
  rationale: Giới từ ל đánh dấu mối quan hệ với người cha trong cách diễn đạt về việc sinh con; “cho Giô-sép” là cách nói tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: בְּטֶרֶם
  choice: Trước khi
  rationale: 'Diễn đạt rõ quan hệ thời gian: việc hai con trai chào đời xảy ra trước khi năm đói kém bắt đầu.'
- source_word: תָּבוֹא שְׁנַת הָרָעָב
  choice: năm đói kém đến
  rationale: Giữ danh từ số ít “năm” và hình ảnh động từ “đến” của tiếng Hê-bơ-rơ, không tự ý đổi thành toàn bộ thời kỳ đói kém.
- source_word: שְׁנֵי בָנִים
  choice: hai con trai
  rationale: Cách tương đương trực tiếp, tự nhiên, phù hợp với văn mạch gia đình và gia phả.
- source_word: יָלְדָה לּוֹ
  choice: sinh cho Giô-sép
  rationale: Giữ cả động từ sinh con lẫn quan hệ được biểu thị bởi đại từ có giới từ לּוֹ; nêu lại tên Giô-sép giúp câu tiếng Việt rõ nghĩa.
- source_word: אָסְנַת
  choice: A-sê-nát
  rationale: Phiên âm tên riêng theo lối đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: con gái của Phô-ti-phê-ra
  rationale: Thể hiện trực tiếp chuỗi liên thuộc xác định A-sê-nát theo quan hệ cha con.
- source_word: כֹּהֵן אֽוֹן
  choice: tư tế tại Ôn
  rationale: כֹּהֵן chỉ chức vụ tôn giáo; “tư tế” là từ trang trọng, dễ hiểu. “Tại Ôn” cho biết nơi Phô-ti-phê-ra thi hành chức vụ mà không hàm ý ông thờ chính thành phố.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Trật tự câu được điều chỉnh sang chủ động để tự nhiên trong tiếng Việt; các tên riêng được phiên âm nhất quán. Hai chú thích bảo tồn sắc thái số ít của “năm” và cung cấp bối cảnh địa danh Ôn.
