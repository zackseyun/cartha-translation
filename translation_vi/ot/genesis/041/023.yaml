  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: vi
  text: Và kìa, bảy gié lúa[a] teo tóp, lép và bị gió đông làm cháy sém đang mọc lên sau chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bảy bông ngũ cốc”.
    reason: “Gié lúa” ở đây chỉ bông của một loại ngũ cốc, không nhất thiết là lúa gạo.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Và kìa
  rationale: Giữ sắc thái chỉ trỏ sống động, đưa một hình ảnh mới vào lời thuật lại giấc mơ.
- source_word: שִׁבֳּלִים
  choice: gié lúa
  rationale: Chỉ phần mang hạt của cây ngũ cốc; cách nói ngắn gọn, quen thuộc trong văn cảnh nông nghiệp, nhưng không xác định chính xác loại ngũ cốc.
- source_word: צְנֻמוֹת
  choice: teo tóp
  rationale: Diễn đạt dáng vẻ co quắt, còi cọc của các gié lúa và phân biệt từ này với tính từ kế tiếp.
- source_word: דַּקּוֹת
  choice: lép
  rationale: Chuyển ý mỏng, gầy, ít hạt sang cách miêu tả tự nhiên đối với gié lúa trong tiếng Việt.
- source_word: שְׁדֻפוֹת קָדִים
  choice: bị gió đông thiêu cháy
  rationale: Giữ cấu trúc bị động và nêu tác nhân là luồng gió đông khô nóng gây hại cho mùa màng.
- source_word: צֹמְחוֹת
  choice: đang mọc lên
  rationale: Thể hiện hành động đang diễn tiến do phân từ Hê-bơ-rơ diễn tả trong cảnh tượng của giấc mơ.
- source_word: אַחֲרֵיהֶם
  choice: sau chúng
  rationale: Giữ được khả năng chỉ sự tiếp nối cả về trình tự lẫn vị trí so với bảy gié lúa trước đó.
