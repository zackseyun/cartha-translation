  register: Văn phong hiện đại, trang trọng vừa phải. Bản dịch giữ riêng hai tính từ Hê-bơ-rơ bằng “teo tóp, lép”, tránh gộp mất một nét nghĩa; “Và kìa” duy trì tính sống động của lời thuật giấc mơ.
