  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: vi
  text: Việc giấc mộng được lặp lại cho Pha-ra-ôn hai lần là vì việc ấy đã được Đức Chúa Trời xác lập[a], và Đức Chúa Trời đang gấp rút thực hiện việc ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “việc ấy đã được xác lập từ nơi Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đức Chúa Trời sẽ mau chóng thực hiện việc ấy” hoặc “Đức Chúa Trời sắp thực hiện việc ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Còn việc
  rationale: Mở đầu lời giải thích về sự kiện giấc mộng được lặp lại; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ chức năng chuyển ý của cụm Hê-bơ-rơ.
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: giấc mộng được lặp lại
  rationale: Giữ ý nghĩa bị động của động từ nguyên mẫu và diễn đạt tự nhiên trong tiếng Việt.
- source_word: אֶל־פַּרְעֹה
  choice: với Pha-ra-ôn
  rationale: Trong ngữ cảnh, giấc mộng xảy đến với Pha-ra-ôn; “với” tự nhiên hơn “đến” khi nói về việc một người có cùng nội dung mộng hai lần.
- source_word: פַּעֲמָיִם
  choice: hai lần
  rationale: Cách diễn đạt thông dụng, tương ứng trực tiếp với dạng số đôi của nguyên văn.
- source_word: כִּי
  choice: là vì
  rationale: Nêu rõ quan hệ nguyên nhân giữa việc giấc mộng lặp lại và sự chắc chắn của điều Đức Chúa Trời đã định.
- source_word: נָכוֹן הַדָּבָר
  choice: việc ấy … định chắc
  rationale: נָכוֹן mang ý đã được thiết lập vững chắc, chắc chắn; “định chắc” vừa giữ sắc thái quyết định vừa tránh biến câu thành một nhận định đơn thuần về khả năng xảy ra.
- source_word: מֵעִם הָאֱלֹהִים
  choice: được Đức Chúa Trời
  rationale: Chuyển quan hệ nguồn gốc và thẩm quyền thành cấu trúc bị động tự nhiên trong tiếng Việt; chú thích bảo lưu khả năng dịch sát hơn là “từ nơi Đức Chúa Trời”.
- source_word: וּמְמַהֵר
  choice: và … đang gấp rút
  rationale: Giữ hình thái phân từ và sắc thái hành động cận kề, khẩn trương, thay vì chỉ dùng một trạng từ chỉ tốc độ.
- source_word: לַעֲשֹׂתוֹ
  choice: thực hiện việc ấy
  rationale: Đại từ hậu tố chỉ lại sự việc đã được báo trước; “thực hiện” tự nhiên và rõ nghĩa hơn cách dịch từng chữ “làm nó”.
theological_decisions:
- issue: Cách dịch הָאֱלֹהִים trong lời giải thích của Giô-sép
  choice: Đức Chúa Trời
  alternative: các thần
  rationale: Dù אֱלֹהִים có hình thức số nhiều, cú pháp và văn cảnh dùng từ này để chỉ một Đấng duy nhất, là Đấng bày tỏ ý nghĩa giấc mộng cho Giô-sép.
- issue: Mức độ quyết định hàm chứa trong נָכוֹן
  choice: đã được Đức Chúa Trời định chắc
  alternative: là chắc chắn trước mặt Đức Chúa Trời
  rationale: Nguyên văn nhấn mạnh sự việc đã được thiết lập vững chắc từ Đức Chúa Trời. Bản dịch giữ ý quyết định chắc chắn nhưng không thêm hệ thống thần học về cách thức tiền định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “giấc mộng” để phù hợp bối cảnh Kinh Thánh nhưng giữ cú pháp tiếng Việt tự nhiên; “Pha-ra-ôn” là cách phiên âm quen thuộc. Các chú thích bảo lưu sắc thái nguồn gốc của מֵעִם và tính cận kề/hối thúc của phân từ מְמַהֵר.
