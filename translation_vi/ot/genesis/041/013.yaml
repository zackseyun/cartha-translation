  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: vi
  text: 'Việc đã xảy ra đúng như người ấy giải nghĩa cho chúng tôi: tôi được phục chức, còn người kia bị treo lên.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר ... כֵּן הָיָה
  choice: Việc xảy ra đúng như...
  rationale: Gộp cấu trúc đối ứng của tiếng Hê-bơ-rơ thành một câu tiếng Việt tự nhiên, đồng thời giữ ý lời giải nghĩa đã ứng nghiệm chính xác.
- source_word: פָּתַר לָנוּ
  choice: đã giải nghĩa cho chúng tôi
  rationale: Trong ngữ cảnh các giấc mơ, פתר chỉ việc giải nghĩa giấc mơ; cách dịch này chính xác và quen thuộc trong tiếng Việt.
- source_word: אֹתִי הֵשִׁיב עַל־כַּנִּי
  choice: tôi được phục chức
  rationale: Thành ngữ עַל־כַּנִּי nói đến việc được đưa trở lại vị trí chính thức trước đây. 'Được phục chức' diễn đạt gọn và rõ ý trong tiếng Việt.
- source_word: וְאֹתוֹ תָלָה
  choice: còn người kia bị treo cổ
  rationale: '''Còn'' thể hiện sự tương phản giữa hai số phận. Thể bị động tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh, trong đó Pha-ra-ôn là chủ thể được hiểu ngầm.'
