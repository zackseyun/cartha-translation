translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự đối lập nổi bật giữa người kể được phục chức và người kia bị xử tử; không thêm tên chủ thể vốn chỉ được hàm ý trong nguyên văn.
