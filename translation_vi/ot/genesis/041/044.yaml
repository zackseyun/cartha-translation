  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל יוֹסֵ֖ף אֲנִ֣י פַרְעֹ֑ה וּ/בִלְעָדֶ֗י/ךָ לֹֽא יָרִ֨ים אִ֧ישׁ אֶת יָד֛/וֹ וְ/אֶת רַגְל֖/וֹ בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: vi
  text: 'Rồi Pha-ra-ôn nói với Giô-sép: “Ta là Pha-ra-ôn; không có ngươi,[a] thì trong toàn cõi Ai Cập, không ai được nhấc tay hay nhấc chân.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngoài ngươi ra” hoặc “không có sự cho phép của ngươi,” nhấn mạnh rằng không ai ở Ai Cập được hành động độc lập với thẩm quyền của Giô-sép.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “nhấc tay mình và nhấc chân mình,” một thành ngữ chỉ việc thực hiện bất cứ hành động hay bước đi nào.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Dạng kể chuyện với waw liên tiếp đưa trình thuật tiến sang hành động kế tiếp; “Rồi” diễn đạt trình tự tự nhiên trong tiếng Việt.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm quen thuộc trong tiếng Việt đối với tước hiệu hoàng gia Ai Cập này.
- source_word: אֲנִי פַרְעֹה
  choice: Ta là Pha-ra-ôn
  rationale: Giữ nguyên lời tự xưng đầy uy quyền của Pha-ra-ôn mà không thêm ý giải thích như “chính ta”.
- source_word: וּבִלְעָדֶיךָ
  choice: nhưng không có ngươi
  rationale: “Không có ngươi” giữ được nghĩa loại trừ hoặc không độc lập với Giô-sép; “nhưng” diễn đạt tự nhiên sự tương phản ngầm giữa chủ quyền của Pha-ra-ôn và quyền được giao cho Giô-sép.
- source_word: לֹא יָרִים אִישׁ
  choice: không ai được nhấc
  rationale: Trong ngữ cảnh sắc lệnh, “không ai được” thể hiện sự cấm đoán hay thiếu thẩm quyền, còn “nhấc” giữ hình ảnh cụ thể của động từ Hebrew.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: nhấc tay hay nhấc chân
  rationale: Giữ thành ngữ hình tượng của nguyên văn; trong câu phủ định tiếng Việt, “hay” truyền đạt tự nhiên ý không được thực hiện bất cứ hành động nào.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: trong toàn cõi Ai Cập
  rationale: “Toàn cõi” là cách diễn đạt trang trọng, tự nhiên và chỉ toàn bộ lãnh thổ Ai Cập.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ta—ngươi” phù hợp với lời của vua ban quyền cho một bề tôi. Hai dấu chú thích được đặt ngay sau các cụm từ mà chúng giải thích.
