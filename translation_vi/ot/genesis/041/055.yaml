base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: vi
  text: 'Cả xứ Ai Cập lâm vào cảnh đói kém, và dân chúng kêu xin Pha-ra-ôn cho bánh. Pha-ra-ôn nói với toàn dân Ai Cập: “Hãy đến gặp Giô-sép; người bảo các ngươi điều gì, hãy làm điều đó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: lâm vào cảnh đói kém
  rationale: Động từ רעב ở đây diễn tả xứ Ai Cập bắt đầu chịu nạn đói; cách dịch này giữ diễn tiến của câu chuyện và tự nhiên hơn lối nói một vùng đất 'trở nên đói' trong tiếng Việt.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: cả xứ Ai Cập
  rationale: Giữ thành tố אֶרֶץ ('xứ, đất') đồng thời dùng cách diễn đạt trang trọng, tự nhiên trong tiếng Việt.
- source_word: וַיִּצְעַק הָעָם אֶל־פַּרְעֹה
  choice: dân chúng kêu xin Pha-ra-ôn
  rationale: צעק diễn tả tiếng kêu khẩn thiết trong cảnh khốn cùng; 'kêu xin' truyền đạt cả sự cấp bách lẫn hướng cầu cứu đến Pha-ra-ôn.
- source_word: לַלָּחֶם
  choice: ban lương thực
  rationale: לֶחֶם nghĩa đen là 'bánh', nhưng trong bối cảnh nạn đói chỉ lương thực nói chung. Thêm 'ban' làm rõ nội dung lời kêu xin theo cách tự nhiên trong tiếng Việt mà không thay đổi ý.
- source_word: לְכָל מִצְרַיִם
  choice: với toàn dân Ai Cập
  rationale: Tên địa danh được dùng theo nghĩa tập thể; diễn đạt thành 'toàn dân Ai Cập' giúp câu tiếng Việt rõ và tự nhiên.
- source_word: לְכוּ אֶל־יוֹסֵף
  choice: Hãy đến gặp Giô-sép
  rationale: Trong ngữ cảnh trình diện một người có thẩm quyền để nhận chỉ thị, 'đến gặp' tự nhiên hơn 'đi đến', đồng thời vẫn giữ ý của giới từ אֶל.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: ông ấy bảo các ngươi làm gì thì hãy làm theo như vậy
  rationale: Giữ cấu trúc nhấn mạnh nội dung Giô-sép truyền bảo nhưng diễn đạt bằng cú pháp Việt tự nhiên; 'làm theo như vậy' truyền đạt mệnh lệnh תַּעֲשׂוּ rõ ràng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Pha-ra-ôn' như tước hiệu, 'Giô-sép' theo dạng tên quen thuộc trong tiếng Việt, và đại từ 'các ngươi' để phản ánh lời của vua với thần dân mà không làm câu quá cổ.
