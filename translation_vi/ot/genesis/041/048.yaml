base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: vi
  text: Ông thu gom mọi lương thực của bảy năm ấy tại Ai Cập và đưa lương thực vào các thành. Trong mỗi thành, ông đưa vào đó lương thực từ những cánh đồng chung quanh thành ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Lương thực của cánh đồng của thành, là những cánh đồng chung quanh thành ấy, ông đặt vào trong thành ấy.” Tiếng Hê-bơ-rơ lặp lại từ “lương thực” và dùng cấu trúc nhắc lại để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: thu gom
  rationale: Động từ קבץ chỉ việc tập hợp, gom lại; “thu gom” tự nhiên trong bối cảnh thu lương thực để dự trữ.
- source_word: כָּל אֹכֶל
  choice: mọi lương thực
  rationale: אֹכֶל có nghĩa rộng là thức ăn/lương thực; “lương thực” phù hợp bối cảnh nông nghiệp mà không thu hẹp thành riêng “ngũ cốc”.
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: của bảy năm ấy trên đất Ai Cập
  rationale: Giữ quan hệ sở thuộc của nguyên văn và quy chiếu đến bảy năm sung túc đã được nói trước; cách diễn đạt này tự nhiên hơn việc dịch sát “bảy năm đã có”.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: đưa lương thực vào các thành
  rationale: נתן cơ bản là đặt/đưa; “đưa ... vào” vừa sát ý vừa tự nhiên, không thêm rõ nghĩa “tích trữ” dù ngữ cảnh hàm ý điều đó.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: lương thực từ đồng ruộng chung quanh thành nào
  rationale: Diễn đạt rõ mối liên hệ giữa sản vật và vùng đồng ruộng quanh từng thành, đồng thời giữ từ “lương thực” được lặp lại trong tiếng Hê-bơ-rơ.
- source_word: נָתַן בְּתוֹכָהּ
  choice: ông đưa vào chính thành ấy
  rationale: בְּתוֹכָהּ là “ở bên trong/giữa nó”; “chính thành ấy” bảo toàn sắc thái quy chiếu và nhấn mạnh của cấu trúc nhắc lại.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng “ông” theo chủ thể đã có trong ngữ cảnh; tránh cụ thể hóa אֹכֶל thành “ngũ cốc” và tránh thêm động từ diễn giải “tích trữ” vào câu chính.
