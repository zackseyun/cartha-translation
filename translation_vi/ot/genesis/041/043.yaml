base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: vi
  text: 'Vua cho ông đi trên cỗ xe thứ hai của mình, và người ta hô vang đi trước ông: “Áp-rếch!”[a] Rồi vua đặt ông cai quản toàn cõi Ai Cập.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Áp-rếch” là một từ khó hiểu, chưa rõ nghĩa; có thể là một lời tung hô bằng tiếng Ai Cập hoặc tiếng Hê-bơ-rơ. Nhiều người hiểu từ này theo nghĩa gần như: “Hãy quỳ gối!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: Vua cho ông ngồi trên
  rationale: Dạng Hifil của רכב mang nghĩa khiến hoặc cho một người đi xe. “Cho ông ngồi trên” diễn đạt tự nhiên quan hệ sai khiến; chủ thể được nêu là “vua” theo văn cảnh để câu tiếng Việt rõ nghĩa.
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: cỗ xe thứ hai của mình
  rationale: מִשְׁנֶה chỉ vị trí thứ hai hoặc cấp bậc kế tiếp; cụm từ nói đến cỗ xe đứng hàng thứ hai trong số xe của Pha-ra-ôn. “Của mình” chuyển tải tự nhiên mệnh đề sở hữu אֲשֶׁר־לוֹ.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: và người ta hô vang trước mặt ông
  rationale: קרא ở đây là tiếng hô công khai trong đoàn rước. Cách dịch này giữ hình ảnh những người đi phía trước hoặc ở trước mặt Giô-sép cất tiếng tung hô mà không xác định quá mức vị trí của họ.
- source_word: אַבְרֵךְ
  choice: Áp-rếch
  rationale: Từ này tối nghĩa, có thể là một lời tung hô chuyên biệt hoặc từ vay mượn. Phiên âm trong chính văn tránh biến một cách giải nghĩa chưa chắc chắn thành lời dịch dứt khoát.
- source_word: וְנָתוֹן אֹתוֹ
  choice: Rồi vua lập ông
  rationale: Cấu trúc có dạng nguyên thể tuyệt đối mang lực của động từ hữu hạn, tiếp nối hành động trước. “Lập ông” diễn đạt việc chính thức đặt Giô-sép vào địa vị cai quản.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: cai quản toàn cõi Ai Cập
  rationale: עַל biểu thị thẩm quyền trên một lãnh thổ. “Toàn cõi Ai Cập” vừa giữ sắc thái lãnh thổ của אֶרֶץ vừa là lối nói trang trọng, dễ hiểu trong tiếng Việt.
