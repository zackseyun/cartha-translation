    rationale: לְפָנָיו trong cảnh rước có nghĩa không gian là ở phía trước ông. “Trước mặt” tiếng Việt dễ được hiểu là ngay trước sự hiện diện của ông, không nhất thiết là đi trước đoàn xe.
