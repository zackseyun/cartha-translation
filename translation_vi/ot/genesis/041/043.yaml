translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “vua” thay cho đại từ ở hai vị trí để tránh mơ hồ về chủ thể trong tiếng Việt. Giữ nguyên lời tung hô tối nghĩa bằng hình thức phiên âm và giải thích trong chú thích.
