  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các ý chính: Pha-ra-ôn khiến Giô-sép đi xe, lời hô công khai được giữ ở dạng phiên âm do từ אַבְרֵךְ không chắc nghĩa, và việc đặt ông cai quản toàn lãnh thổ Ai Cập. Tuy nhiên, “cho ông ngồi trên” làm hẹp động từ Hifil của רכב thành tư thế ngồi, trong khi ngữ cảnh nói đến việc cho đi/cưỡi xe; “trước mặt ông” cũng không diễn đạt rõ đoàn người hô đi phía trước ông.'
