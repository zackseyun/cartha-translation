  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: vi
  text: Họ hãy thu gom mọi lương thực trong những năm tốt lành sắp đến này, tích trữ ngũ cốc dưới quyền Pha-ra-ôn[a] làm lương thực tại các thành, và gìn giữ số lương thực ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “dưới tay Pha-ra-ôn”, một thành ngữ Hê-bơ-rơ chỉ thẩm quyền hoặc sự kiểm soát.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “canh giữ số lương thực ấy” hoặc “bảo quản số lương thực ấy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: Họ hãy thu gom
  rationale: Thể vị hoàn thành Qal trong ngữ cảnh đề xuất của Giô-sép mang sắc thái mệnh lệnh/đề nghị; “hãy” diễn đạt tự nhiên sắc thái ấy.
- source_word: כָּל אֹכֶל
  choice: mọi lương thực
  rationale: אֹכֶל chỉ chung thức ăn hoặc nguồn lương thực; “lương thực” phù hợp với sản vật được thu gom để dự trữ.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: những năm tốt lành sắp đến này
  rationale: Cách dịch giữ cả ý chỉ định “này” lẫn ý tương lai của phân từ “sắp đến”, đồng thời tự nhiên trong tiếng Việt.
- source_word: וְיִצְבְּרוּ
  choice: tích trữ
  rationale: Động từ diễn tả việc chất gom hoặc dự trữ với số lượng lớn; “tích trữ” hợp với bối cảnh quản lý lương thực.
- source_word: בָר
  choice: ngũ cốc
  rationale: בָר ở đây chỉ hạt ngũ cốc, nhất là ngũ cốc đã đập; “ngũ cốc” chính xác hơn một loại hạt cụ thể.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: dưới quyền Pha-ra-ôn
  rationale: Thành ngữ nghĩa đen là “dưới tay Pha-ra-ôn”, nhưng trong ngữ cảnh chỉ thẩm quyền hoặc sự kiểm soát của vua.
- source_word: אֹכֶל בֶּעָרִים
  choice: làm lương thực tại các thành
  rationale: 'Cụm từ có tính đồng vị/chỉ công dụng: ngũ cốc được dự trữ để làm lương thực đặt tại các thành.'
- source_word: וְשָׁמָרוּ
  choice: và gìn giữ số lương thực ấy
  rationale: שׁמר có thể là giữ, canh giữ hoặc bảo quản. “Gìn giữ” bảo tồn độ rộng nghĩa, còn tân ngữ được nói rõ để câu tiếng Việt tự nhiên.
