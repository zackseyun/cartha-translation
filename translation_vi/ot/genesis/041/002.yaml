  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת יְפ֥וֹת מַרְאֶ֖ה וּ/בְרִיאֹ֣ת בָּשָׂ֑ר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: vi
  text: Và kìa, từ sông Nin[a] có bảy con bò cái đi lên, dáng đẹp, thân hình béo tốt, rồi chúng gặm cỏ giữa đám lau sậy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “con sông”; trong bối cảnh Ai Cập ở đây, từ Hê-bơ-rơ này thường chỉ sông Nin.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong đám cỏ đầm lầy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Và kìa
  rationale: Giữ sắc thái chỉ dẫn sự chú ý và tính sống động của cảnh trong giấc mơ; cách nói trang trọng nhưng vẫn dễ hiểu.
- source_word: הַיְאֹר
  choice: sông Nin
  rationale: Trong bối cảnh Ai Cập, danh từ này chỉ sông Nin chứ không đơn thuần là một con sông bất kỳ.
- source_word: עֹלֹת
  choice: đi lên
  rationale: Phân từ diễn tả hành động đang hiện ra trong cảnh mơ; tiếng Việt tự nhiên có thể dùng động từ không đánh dấu tiếp diễn.
- source_word: שֶׁבַע פָּרוֹת
  choice: bảy con bò cái
  rationale: פָּרוֹת là dạng giống cái số nhiều, nên dịch rõ là bò cái thay vì khái quát thành gia súc.
- source_word: יְפוֹת מַרְאֶה
  choice: dáng đẹp
  rationale: Diễn đạt tự nhiên ý có vẻ ngoài đẹp, không thêm ý nghĩa vượt quá mô tả ngoại hình.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: thân hình béo tốt
  rationale: Giữ trọng tâm của tiếng Hê-bơ-rơ về sự đầy đặn của thân thể; “béo tốt” tự nhiên và phù hợp với văn cảnh hơn lối dịch sát chữ cứng nhắc.
- source_word: וַתִּרְעֶינָה
  choice: chúng gặm cỏ
  rationale: Động từ chỉ việc ăn cỏ/chăn thả; “gặm cỏ” tạo hình ảnh cụ thể, tự nhiên.
- source_word: בָּאָחוּ
  choice: giữa đám lau sậy
  rationale: Từ này chỉ vùng cây cỏ đầm lầy hoặc lau sậy ven sông; bản dịch giữ bối cảnh ven sông Nin và không dùng từ quá khái quát như “đồng cỏ”.
