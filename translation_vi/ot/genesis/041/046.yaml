  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho Giô-sép, phiên âm “Pha-ra-ôn” theo lối quen thuộc trong tiếng Việt. Không thêm mục đích chuyến đi của Giô-sép vì câu Hê-bơ-rơ chỉ nói ông đi khắp đất Ai Cập.
