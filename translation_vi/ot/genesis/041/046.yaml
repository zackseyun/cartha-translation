  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: vi
  text: Giô-sép ba mươi tuổi khi ông đứng trước Pha-ra-ôn, vua Ai Cập. Giô-sép rời khỏi Pha-ra-ôn rồi đi khắp đất Ai Cập.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: được ba mươi tuổi
  rationale: Đây là cách diễn đạt tuổi tác tự nhiên trong tiếng Việt, chuyển đúng thành ngữ Hê-bơ-rơ theo nghĩa thay vì dịch sát từng chữ là “con trai của ba mươi năm”.
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: khi ông ra mắt Pha-ra-ôn
  rationale: Cụm giới từ với động từ nguyên mẫu chỉ thời điểm Giô-sép đứng trước mặt vua; “ra mắt” diễn đạt tự nhiên việc hiện diện chính thức trước nhà vua mà không thêm ý ông mới gặp vua lần đầu.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: Pha-ra-ôn, vua Ai Cập
  rationale: Giữ cách phiên âm quen thuộc trong Kinh Thánh tiếng Việt và thể hiện “vua Ai Cập” là cụm đồng vị xác định tước vị.
- source_word: וַיֵּצֵא יוֹסֵף מִלִּפְנֵי פַרְעֹה
  choice: Rời khỏi Pha-ra-ôn, Giô-sép
  rationale: “Rời khỏi” truyền đạt tự nhiên động tác đi ra khỏi sự hiện diện của Pha-ra-ôn. Tiếng Việt không cần lặp thành ngữ “khỏi trước mặt” vốn thiếu tự nhiên.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: đi khắp đất Ai Cập
  rationale: Động từ עבר với cụm chỉ toàn cõi ở đây nói đến sự di chuyển trên phạm vi rộng; “đi khắp” vừa tự nhiên vừa không bổ sung mục đích hành chính mà nguyên văn không nói rõ.
- source_word: וְ / וַ
  choice: liên kết bằng trình tự câu kể
  rationale: Các liên từ Hê-bơ-rơ duy trì mạch tường thuật. Tiếng Việt không nhất thiết phải dịch máy móc bằng “và”; quan hệ tiếp nối được thể hiện tự nhiên qua thứ tự hai câu và phân từ “Rời khỏi”.
