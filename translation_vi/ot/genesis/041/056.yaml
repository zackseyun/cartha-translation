  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: vi
  text: Nạn đói lan khắp mặt đất. Giô-sép mở tất cả các kho[a] và bán ngũ cốc cho Ai Cập. Nạn đói ngày càng trầm trọng trong xứ Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ tỉnh lược, sát chữ là “mở tất cả những gì ở trong chúng”; theo ngữ cảnh, câu này nói đến các kho hoặc nơi chứa ngũ cốc.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָב
  choice: nạn đói
  rationale: רָעָב trong mạch truyện này chỉ nạn đói nghiêm trọng trên diện rộng; “nạn đói” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: lan khắp mặt đất
  rationale: Giữ hình ảnh “mặt đất” của thành ngữ Hê-bơ-rơ, đồng thời dùng “lan khắp” để diễn đạt tự nhiên việc nạn đói hiện diện trên toàn vùng được nói đến. הָאָרֶץ có thể chỉ đất, xứ hoặc vùng đất rộng lớn; bản dịch không thu hẹp phạm vi hơn nguyên văn.
- source_word: וַיִּפְתַּח יוֹסֵף אֶת כָּל אֲשֶׁר בָּהֶם
  choice: Giô-sép mở tất cả các kho
  rationale: Nguyên văn có lối nói tỉnh lược, sát chữ là “mở tất cả những gì ở trong chúng”, nhưng không nêu rõ danh từ làm tiền ngữ cho “chúng”. Theo ngữ cảnh tích trữ và phân phối lúa, ý nói Giô-sép mở các nơi chứa lúa; “các kho” truyền đạt hành động rõ ràng trong tiếng Việt, còn độ tỉnh lược của nguyên văn được ghi ở chú thích.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: bán lúa cho dân Ai Cập
  rationale: שׁבר trong ngữ cảnh này là thành ngữ chỉ việc bán lương thực, đặc biệt là ngũ cốc. “Lúa” phù hợp với mạch truyện về việc dự trữ thóc lúa; “dân Ai Cập” diễn đạt tự nhiên nghĩa tập thể của מִצְרַיִם.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: nạn đói ngày càng trầm trọng
  rationale: חזק có nghĩa cơ bản là “mạnh”, nhưng khi chủ ngữ là nạn đói, cụm từ diễn tả nạn đói tăng mức độ và trở nên nghiêm trọng hơn.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: trong xứ Ai Cập
  rationale: “Xứ Ai Cập” phản ánh đầy đủ אֶרֶץ מִצְרָיִם và giữ văn phong tường thuật trang trọng của Sáng Thế Ký.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các câu được tách theo diễn tiến của lời kể thay vì nối liên tục bằng “và”. “Giô-sép” và “Ai Cập” theo dạng tên riêng quen thuộc trong tiếng Việt. Chú thích giữ lại nét tỉnh lược thật sự của nguyên văn mà không làm câu chính khó hiểu.
