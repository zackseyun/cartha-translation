base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: vi
  text: Những gié lúa lép nuốt chửng bảy gié lúa tốt[a]. Tôi kể cho các thuật sĩ[b], nhưng không ai giải nghĩa cho tôi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bảy bông lúa tốt.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “thuật sĩ” chỉ những chuyên gia nghi lễ hoặc người giải mộng của Ai Cập.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “nhưng không ai giải thích cho tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: nuốt chửng
  rationale: Giữ hình ảnh sống động của động từ בלע trong giấc mơ; cách nói này tự nhiên trong tiếng Việt và diễn tả việc các gié lép nuốt các gié tốt.
- source_word: שִׁבֳּלִים
  choice: gié lúa
  rationale: Trong bối cảnh nông nghiệp, từ này chỉ bông hoặc đầu mang hạt của cây ngũ cốc. “Gié lúa” ngắn gọn, dễ hiểu và phù hợp hình ảnh trong câu.
- source_word: הַדַּקֹּת
  choice: lép
  rationale: Nghĩa sát là “mỏng, gầy”; đối với gié lúa, “lép” là cách diễn đạt tự nhiên về những gié không chắc hạt, đồng thời không thêm sắc thái quá mạnh.
- source_word: הַטֹּבוֹת
  choice: tốt
  rationale: Giữ nghĩa rộng và trực tiếp của טוֹב, không tự ý thu hẹp thành “chắc hạt” hay “đầy đặn” dù bối cảnh có thể hàm ý như vậy.
- source_word: וָאֹמַר אֶל
  choice: Tôi kể lại cho
  rationale: Trong ngữ cảnh Pha-ra-ôn thuật giấc mơ cho các chuyên gia, “kể lại cho” diễn đạt tự nhiên hành động được hàm ý mà không cần thêm đại từ “nó”.
- source_word: הַחַרְטֻמִּים
  choice: các thuật sĩ
  rationale: Chỉ những chuyên gia nghi lễ và giải mộng của Ai Cập; “thuật sĩ” là cách gọi ngắn gọn, trang trọng hơn và ít gợi liên tưởng đến người biểu diễn ảo thuật.
- source_word: וְאֵין מַגִּיד לִי
  choice: nhưng không ai giải nghĩa cho tôi
  rationale: Trong bối cảnh giấc mơ, נגד nói đến việc làm cho ý nghĩa được biết. “Giải nghĩa” truyền đạt đúng chức năng giải mộng, trong khi vẫn để chú thích nêu khả năng dịch rộng hơn là “giải thích”.
theological_decisions: []
