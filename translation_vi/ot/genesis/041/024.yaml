  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “gié lúa” cho hình ảnh nông nghiệp, “thuật sĩ” cho chức năng cung đình Ai Cập, và giữ câu ở ngôi thứ nhất theo lời Pha-ra-ôn.
