translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và giàu tính hình ảnh. “Kìa” bảo tồn nét sống động của lời kể; “gió đông” giữ hướng gió theo nguyên văn, dù trong bối cảnh Cận Đông đây là luồng gió nóng, gây hại.
