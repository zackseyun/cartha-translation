base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: vi
  text: Kìa, bảy bông lúa gầy guộc, bị gió đông thiêu cháy[a], mọc lên sau bảy bông ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị gió đông làm khô héo.”'
    reason: Động từ có thể nhấn mạnh kết quả bị gió nóng làm cháy sém hoặc khô héo.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ sắc thái đột ngột, sống động của dấu hiệu trần thuật trong cảnh chiêm bao mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: שֶׁבַע
  choice: bảy
  rationale: Chuyển trực tiếp số đếm trong nguyên văn.
- source_word: שִׁבֳּלִים
  choice: bông lúa
  rationale: Chỉ phần mang hạt của cây lương thực; “bông lúa” tự nhiên và dễ hiểu hơn “thân lúa” trong tiếng Việt.
- source_word: דַּקּוֹת
  choice: gầy guộc
  rationale: Diễn tả hình dáng mảnh, thiếu sức sống của các bông lúa; cách nói này tự nhiên hơn “mỏng” khi miêu tả bông lúa.
- source_word: וּשְׁדוּפֹת קָדִים
  choice: bị gió đông thiêu cháy
  rationale: Phân từ diễn tả tình trạng bị luồng gió đông nóng và có sức tàn phá làm cháy, khô héo; câu bị động giữ rõ tác nhân trong nguyên văn.
- source_word: צֹמְחוֹת
  choice: mọc lên
  rationale: Giữ hình ảnh hành động đang hiện ra trong chiêm bao và diễn đạt tự nhiên trong tiếng Việt.
- source_word: אַחֲרֵיהֶן
  choice: sau chúng
  rationale: Giữ được khả năng chỉ cả thứ tự thời gian lẫn vị trí tiếp sau những bông lúa ở câu trước.
