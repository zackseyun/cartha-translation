source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: vi
  text: 'Pha-ra-ôn nói với Giô-sép: “Vì[a] Đức Chúa Trời đã cho ông biết tất cả những điều này, nên không ai sáng suốt và khôn ngoan như ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi Đức Chúa Trời đã cho ông biết tất cả những điều này.” Giới từ Hê-bơ-rơ có nghĩa sát hơn là “sau khi”, nhưng trong ngữ cảnh này cũng có thể nêu cơ sở cho kết luận của Pha-ra-ôn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng kể chuyện với waw nối tiếp làm câu chuyện tiến triển; tiếng Việt tự nhiên không nhất thiết phải thêm “rồi” hoặc “bấy giờ” khi trình tự đã rõ trong văn cảnh.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm quen thuộc trong tiếng Việt đối với tước hiệu của vua Ai Cập.
- source_word: אַחֲרֵי
  choice: Vì ... nên
  rationale: Từ này về hình thức có nghĩa là “sau khi”, nhưng tại đây lời mặc khải của Đức Chúa Trời là cơ sở để Pha-ra-ôn kết luận về Giô-sép; cấu trúc “vì ... nên” diễn đạt tự nhiên lực suy luận ấy.
- source_word: הוֹדִיעַ
  choice: đã cho ... biết
  rationale: Dạng Hiphil của ידע mang nghĩa khiến cho biết hoặc làm cho biết; “đã cho ... biết” giữ được sắc thái tác động và tự nhiên trong tiếng Việt.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ và văn cảnh chỉ một Đấng đã bày tỏ ý nghĩa giấc mơ cho Giô-sép; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: אוֹתְךָ
  choice: ngươi
  rationale: Đại từ ngôi hai số ít phù hợp với lời một vị vua nói trực tiếp với thuộc cấp trong bối cảnh cổ đại, đồng thời giữ sắc thái trang trọng của truyện.
- source_word: אֶת כָּל זֹאת
  choice: tất cả những điều này
  rationale: Chỉ toàn bộ sự việc và sự hiểu biết về các giấc mơ vừa được trình bày.
- source_word: אֵין
  choice: không ai
  rationale: Diễn đạt tự nhiên cấu trúc phủ định hiện hữu khi nói về người.
- source_word: נָבוֹן
  choice: sáng suốt
  rationale: Diễn tả năng lực nhận hiểu và phân định sâu sắc mà Giô-sép vừa thể hiện.
- source_word: וְחָכָם
  choice: và khôn ngoan
  rationale: Giữ nguyên hai phẩm chất song song trong tiếng Hê-bơ-rơ, không gộp chúng thành một ý.
- source_word: כָּמוֹךָ
  choice: như ngươi
  rationale: Hoàn chỉnh cách so sánh tự nhiên sau mệnh đề “không ai”.
theological_decisions:
- issue: Số của אֱלֹהִים trong lời Pha-ra-ôn
  choice: Đức Chúa Trời
  alternative: các thần
  rationale: Dù אֱלֹהִים về hình thái có thể là số nhiều trong một số văn cảnh, động từ số ít và mạch truyện tại đây hướng đến một Đấng đã tỏ cho Giô-sép biết; bản dịch số ít phản ánh sát cách dùng trong câu mà không mở rộng thêm nhận định thần học của Pha-ra-ôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phản ánh quan hệ vua–thuộc cấp trong lời thoại cổ đại; câu chính dùng quan hệ “vì ... nên” cho mạch suy luận rõ ràng, còn chú thích giữ phương án thời gian sát hình thức Hê-bơ-rơ.
