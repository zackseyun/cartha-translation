base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: vi
  text: Giô-sép tích trữ ngũ cốc nhiều vô kể, như cát biển, đến nỗi ông thôi không đếm nữa, vì không thể đếm xuể.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: tích trữ
  rationale: Động từ צבר chỉ việc gom và chất lại để dự trữ; “tích trữ” phù hợp với bối cảnh Giô-sép thu gom lương thực trong những năm sung túc.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên gọi đã quen thuộc và dễ nhận biết trong tiếng Việt hiện đại.
- source_word: בָּר
  choice: lúa thóc
  rationale: בָּר ở đây chỉ ngũ cốc nói chung, không nhất thiết riêng lúa mì; “lúa thóc” là cách nói tự nhiên trong ngữ cảnh kho lương thực.
- source_word: כְּחוֹל הַיָּם
  choice: như cát biển
  rationale: Giữ nguyên hình ảnh so sánh quen thuộc của tiếng Hê-bơ-rơ về một số lượng vô cùng lớn.
- source_word: הַרְבֵּה מְאֹד
  choice: nhiều vô kể
  rationale: Diễn đạt tự nhiên mức độ nhấn mạnh rất mạnh của cụm từ, đồng thời hài hòa với mệnh đề tiếp theo nói rằng không thể đếm xuể.
- source_word: עַד כִּי
  choice: đến nỗi
  rationale: Trong văn cảnh, cụm từ giới thiệu kết quả đạt tới do lượng lúa thóc quá lớn; “đến nỗi” tự nhiên hơn cách hiểu thuần thời gian.
- source_word: חָדַל לִסְפֹּר
  choice: ông thôi không đếm nữa
  rationale: Chủ ngữ số ít tự nhiên nhất là Giô-sép; cách diễn đạt này rõ ràng và hiện đại.
- source_word: כִּי אֵין מִסְפָּר
  choice: vì không thể đếm xuể
  rationale: Truyền đạt thành ngữ Hê-bơ-rơ “vì không có con số” theo nghĩa số lượng vượt quá khả năng đếm, tránh một câu dịch sát nhưng khó hiểu trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ hình ảnh “cát biển” của nguyên văn, dùng “đến nỗi” để thể hiện quan hệ kết quả, và không thêm diễn giải thần học.
