base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: vi
  text: Bấy giờ, Pha-ra-ôn sai người gọi Giô-sép đến. Họ vội đưa ông ra khỏi hố[a]. Ông cạo râu, thay áo quần rồi đến trước mặt Pha-ra-ôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngục”. Từ Hê-bơ-rơ có nghĩa đen là “hố”, đôi khi chỉ một bể chứa nước cạn được dùng làm nơi giam giữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת־יוֹסֵף
  choice: sai người gọi Giô-sép đến
  rationale: Kết hợp tự nhiên hai động từ “sai” và “gọi” trong tiếng Việt, đồng thời vẫn thể hiện việc Pha-ra-ôn phái người đi triệu Giô-sép đến.
- source_word: וַיְרִיצֻהוּ
  choice: họ vội đưa ông
  rationale: Dạng khiến của động từ diễn tả việc làm cho Giô-sép đi ra nhanh chóng; “vội đưa” truyền đạt cả tác nhân hàm ẩn lẫn tính khẩn trương.
- source_word: מִן־הַבּוֹר
  choice: ra khỏi hố giam
  rationale: בּוֹר có nghĩa đen là “hố”, nhưng trong văn cảnh là nơi giam giữ. “Hố giam” giữ được hình ảnh nguyên văn mà vẫn giúp độc giả hiểu chức năng của nơi ấy.
- source_word: וַיְגַלַּח
  choice: Ông cạo râu
  rationale: Động từ chủ động chỉ việc cạo để chỉnh trang trước khi vào chầu. Cách nói “cạo râu” tự nhiên trong tiếng Việt, nhưng không mở rộng thành các chi tiết không được nêu rõ như cạo cả tóc.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: thay áo quần
  rationale: Diễn đạt rõ, hiện đại hành động thay y phục của Giô-sép.
- source_word: וַיָּבֹא אֶל־פַּרְעֹה
  choice: đến trước mặt Pha-ra-ôn
  rationale: Diễn đạt việc Giô-sép đến gặp vua trong bối cảnh triều kiến, tự nhiên hơn “đến với Pha-ra-ôn” mà không thêm nghi thức ngoài văn bản.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Tên riêng được phiên âm theo cách quen dùng trong tiếng Việt. Câu văn giữ nhịp hành động nhanh của nguyên bản và không giải thích thêm về nghi thức triều đình.
