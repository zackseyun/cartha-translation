  terminology: Tên riêng Pha-ra-ôn và Giô-sép nhất quán. “Cạo râu” là cách dịch Việt ngữ quen dùng trong ngữ cảnh này; dù động từ Hê-bơ-rơ không nêu bộ phận được cạo, cách dùng này không gây trở ngại đáng kể trong bản văn kể chuyện.
