  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: vi
  text: Ở đó có một thanh niên Hê-bơ-rơ ở cùng chúng tôi, là nô lệ của viên chỉ huy đội cận vệ.[a] Chúng tôi kể cho người ấy các giấc mơ của mình, và người ấy giải nghĩa các giấc mơ ấy cho chúng tôi; người ấy giải nghĩa cho từng người tùy theo giấc mơ của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “viên chỉ huy những người giết mổ”; trong ngữ cảnh chức danh triều đình, cụm này cũng có thể chỉ “viên chỉ huy đội hành quyết” hoặc “viên chỉ huy đội cận vệ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: thanh niên
  rationale: Từ này chỉ một người nam còn trẻ; “thanh niên” tự nhiên trong tiếng Việt và không khiến Giô-sép bị hiểu là một đứa trẻ.
- source_word: עִבְרִי
  choice: người Hê-bơ-rơ
  rationale: Đây là danh xưng dân tộc; cách dịch này là tương đương quen thuộc và rõ nghĩa trong tiếng Việt.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Trong ngữ cảnh này, Giô-sép thuộc quyền sở hữu của viên quan, nên “nô lệ” thể hiện địa vị lệ thuộc rõ hơn “đầy tớ”.
- source_word: שַׂר הַטַּבָּחִים
  choice: viên chỉ huy đội cận vệ
  rationale: Cụm từ là một chức danh trong triều đình Ai Cập. Cách dịch này diễn đạt chức năng theo ngữ cảnh, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: וַנְּסַפֶּר לוֹ
  choice: chúng tôi kể ... cho anh ấy
  rationale: Động từ ספר ở đây có nghĩa là thuật lại; cấu trúc này tự nhiên trong tiếng Việt và đối tượng được kể là các giấc mơ.
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: anh ấy giải nghĩa cho chúng tôi
  rationale: פתר trong văn cảnh giấc mơ chỉ việc giải nghĩa; bản dịch giữ thành phần “cho chúng tôi” của nguyên văn mà tránh lặp lại “các giấc mơ” một cách nặng nề.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: anh ấy giải nghĩa cho mỗi người tùy theo giấc mơ của người ấy
  rationale: Cách diễn đạt giữ lực phân phối của אִישׁ và cho thấy lời giải nghĩa tương ứng với giấc mơ riêng của từng người.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “anh ấy” vì đây là lời viên quan kể về Giô-sép khi còn là một thanh niên; dùng “nô lệ” để giữ rõ địa vị pháp lý-xã hội trong nguyên văn.
