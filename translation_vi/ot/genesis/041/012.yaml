revisions:
- from: Ở đó cùng với chúng tôi có một thanh niên người Hê-bơ-rơ, là nô lệ của viên chỉ huy đội cận vệ.[a] Chúng tôi kể các giấc mơ cho anh ấy, và anh ấy giải nghĩa cho chúng tôi; anh ấy giải nghĩa cho mỗi người tùy theo giấc mơ của người ấy.
  to: Ở đó có một thanh niên Hê-bơ-rơ ở cùng chúng tôi, là nô lệ của viên chỉ huy đội cận vệ.[a] Chúng tôi kể cho người ấy các giấc mơ của mình, và người ấy giải nghĩa các giấc mơ ấy cho chúng tôi; người ấy giải nghĩa cho từng người tùy theo giấc mơ của người ấy.
  rationale: Bản sửa phục hồi rõ tân ngữ “các giấc mơ của chúng tôi,” giữ sắc thái phân phối của “mỗi người tùy theo giấc mơ của người ấy,” và làm văn phong tiếng Việt tự nhiên hơn. Chú thích được điều chỉnh để phản ánh phạm vi nghĩa của chức danh tiếng Hê-bơ-rơ mà không áp đặt một cách hiểu duy nhất.
