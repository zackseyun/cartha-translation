  terminology: Giữ cách viết tên “Pha-ra-ôn” và “Giô-sép” nhất quán. “Nhẫn ấn” và “y phục” hợp văn cảnh nghi thức. Đổi “vải gai mịn” thành “vải lanh mịn” để phản ánh tốt hơn שֵׁשׁ. Giữ chú thích về các khả năng “vòng cổ” hoặc “kiềng” cho đồ trang sức bằng vàng.
  issues:
