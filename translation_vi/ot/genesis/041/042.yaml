  to: Pha-ra-ôn tháo chiếc nhẫn ấn khỏi tay mình, đeo vào tay Giô-sép[a], mặc cho ông y phục bằng vải lanh mịn[b], rồi đeo một chuỗi vàng quanh cổ ông[c].
