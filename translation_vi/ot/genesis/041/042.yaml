source:
  edition: WLC
  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: vi
  text: Pha-ra-ôn tháo chiếc nhẫn ấn khỏi tay mình, đeo vào tay Giô-sép[a], mặc cho ông y phục bằng vải lanh mịn[b], rồi đeo một chuỗi vàng quanh cổ ông[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “chiếc nhẫn”; từ Hê-bơ-rơ có thể chỉ nhẫn nói chung, nhưng trong bối cảnh hoàng gia này, nhiều khả năng đó là nhẫn dùng làm ấn, biểu thị quyền hành được ủy thác.
    reason: lexical_alternative
  - marker: b
    text: “Vải lanh mịn” dịch từ שֵׁשׁ (shesh), một loại vải cao cấp gắn với sự giàu sang và danh dự.
    reason: cultural_note
  - marker: c
    text: Hoặc “vòng cổ vàng” hay “kiềng vàng”. Từ Hê-bơ-rơ chỉ một món trang sức đeo cổ, nhưng hình dạng chính xác của món đó không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: tháo
  rationale: Động từ diễn tả việc lấy vật đang đeo ra; “tháo” tự nhiên và chính xác đối với nhẫn.
- source_word: טַבַּעְתּוֹ
  choice: chiếc nhẫn ấn
  rationale: Danh từ có thể chỉ nhẫn nói chung, nhưng trong bối cảnh vua trao quyền cho Giô-sép, nhẫn dùng làm ấn là nghĩa phù hợp nhất.
- source_word: מֵעַל יָדוֹ
  choice: khỏi tay mình
  rationale: Diễn đạt tự nhiên quan hệ không gian của cụm Hê-bơ-rơ, đồng thời làm rõ tay ấy là của Pha-ra-ôn.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: đeo vào tay Giô-sép
  rationale: Dù נתן thường có nghĩa là “trao/đặt”, kết hợp với chiếc nhẫn và “trên tay” cho thấy hành động đeo nhẫn vào tay Giô-sép.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: mặc cho ông
  rationale: 'Giữ cấu trúc tác động của nguyên văn: Pha-ra-ôn cho Giô-sép mặc y phục, trong một nghi thức tấn phong.'
- source_word: בִּגְדֵי שֵׁשׁ
  choice: y phục bằng vải gai mịn
  rationale: שֵׁשׁ chỉ loại vải gai cao cấp gắn với sự sang trọng và địa vị; cách dịch này trang trọng nhưng vẫn dễ hiểu.
- source_word: רְבִד הַזָּהָב
  choice: một chuỗi vàng
  rationale: Từ Hê-bơ-rơ chỉ một món trang sức đeo ở cổ, nhưng hình dạng chính xác không chắc chắn; “chuỗi vàng” là cách dịch tự nhiên, có chú thích phương án khác.
- source_word: עַל צַוָּארוֹ
  choice: quanh cổ ông
  rationale: “Quanh cổ” là cách nói tiếng Việt tự nhiên đối với việc đeo trang sức, tương ứng với nghĩa không gian của nguyên văn.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu văn giữ chuỗi hành động nghi lễ của nguyên văn; dùng “ông” cho Giô-sép để tự nhiên và tôn trọng, đồng thời không thêm cách giải thích thần học vào chính văn.
