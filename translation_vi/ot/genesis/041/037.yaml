  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י פַרְעֹ֑ה וּ/בְ/עֵינֵ֖י כָּל עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: vi
  text: Việc ấy được Pha-ra-ôn và tất cả quần thần của ông xem là tốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיטַב
  choice: được ... xem là tốt
  rationale: Trong cấu trúc với בְּעֵינֵי, động từ diễn tả sự đánh giá thuận lợi hoặc chấp thuận. Cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ việc הַדָּבָר là đối tượng được đánh giá.
- source_word: הַדָּבָר
  choice: việc ấy
  rationale: דָּבָר có nghĩa rộng; ở đây chỉ điều Giô-sép vừa đề nghị. “Việc ấy” gần nghĩa nguồn hơn “kế hoạch ấy” và tự nhiên hơn “lời ấy” trong ngữ cảnh.
- source_word: בְּעֵינֵי ... וּבְעֵינֵי
  choice: được ... xem là
  rationale: Thành ngữ Hê-bơ-rơ nguyên văn là “trong mắt”; tiếng Việt hiện đại diễn đạt tự nhiên bằng “được ... xem là”, vẫn bảo toàn ý nghĩa đánh giá.
- source_word: פַרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm danh hiệu hoàng gia quen dùng trong tiếng Việt Kinh Thánh.
- source_word: כָּל עֲבָדָיו
  choice: tất cả quần thần của ông
  rationale: Trong triều đình Pha-ra-ôn, עֲבָדִים chỉ những người phục vụ vua, thường là triều thần hoặc quan chức. “Quần thần” thể hiện đúng bối cảnh cung đình mà không nhấn quá mức địa vị nô lệ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên. Thành ngữ “trong mắt” được chuyển theo nghĩa sang “xem là” vì cách nói nguyên dạng kém tự nhiên trong tiếng Việt hiện đại; không có khác biệt thần học cần chú thích.
