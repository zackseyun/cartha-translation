base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: vi
  text: 'Pha-ra-ôn hãy làm thế này: bổ nhiệm các quan chức cai quản khắp đất nước và thu một phần năm sản lượng của đất Ai Cập trong bảy năm dư dật[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thu một phần năm từ đất Ai Cập.” Động từ Hê-bơ-rơ có thể được hiểu là đánh thuế hoặc thu lấy một phần năm trong những năm dư dật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: Pha-ra-ôn hãy làm thế này
  rationale: Động từ עשה có nghĩa rộng là “làm”; trong ngữ cảnh Giô-sép đang đưa ra lời khuyên, “hãy làm thế này” diễn đạt tự nhiên sắc thái đề nghị/mệnh lệnh gián tiếp và bổ sung đối tượng được hàm ý.
- source_word: וְיַפְקֵד
  choice: bổ nhiệm
  rationale: Dạng Hiphil của פקד tại đây chỉ việc chỉ định người đảm trách một nhiệm vụ hành chính.
- source_word: פְּקִדִים
  choice: các quan chức
  rationale: Danh từ này chỉ những người được bổ nhiệm vào chức trách. “Các quan chức” tự nhiên trong tiếng Việt và phù hợp bối cảnh quản lý nhà nước; chức năng cai quản được làm rõ trong cụm kế tiếp.
- source_word: עַל הָאָרֶץ
  choice: cai quản khắp đất nước
  rationale: עַל biểu thị phạm vi thẩm quyền, còn הָאָרֶץ tại đây là lãnh thổ Ai Cập. Cách diễn đạt này truyền đạt tự nhiên việc các quan chức được đặt trên toàn quốc.
- source_word: וְחִמֵּשׁ
  choice: thu một phần năm
  rationale: Dạng Piel hiếm của חמשׁ trong ngữ cảnh này nhiều khả năng nói đến việc thu hoặc đánh một phần năm; bản dịch giữ cách hiểu chính nhưng ghi nhận khả năng diễn giải khác trong chú thích.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: sản lượng của đất Ai Cập
  rationale: Nguyên văn nêu “đất Ai Cập” làm đối tượng, nhưng trong mạch văn về thu gom lương thực, điều được lấy là sản vật/sản lượng từ đất. Việc thêm “sản lượng” làm rõ nghĩa hàm ẩn mà không đổi trọng tâm.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: trong bảy năm dư dật
  rationale: שָׂבָע diễn tả sự no đủ, phong phú; “dư dật” là cách trang trọng, dễ hiểu và phù hợp bối cảnh mùa màng sung túc.
theological_decisions: []
