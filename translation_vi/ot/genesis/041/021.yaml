  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại cùng cấu trúc đại từ của tiếng Hê-bơ-rơ, đồng thời dùng chú thích để tránh hiểu lầm rằng những con bò đi vào bụng của chính mình.
