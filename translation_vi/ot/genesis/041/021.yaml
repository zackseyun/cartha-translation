revisions:
- from: Chúng đi vào bụng chúng[a], nhưng không ai nhận ra rằng chúng đã vào bụng chúng; dáng vẻ chúng vẫn xấu xí như lúc ban đầu. Rồi tôi tỉnh giấc.
  to: Khi những con bò béo đã vào bụng những con bò gầy[a], không thể nhận ra rằng chúng đã vào bụng chúng, vì dáng vẻ chúng vẫn xấu xí như lúc ban đầu. Rồi tôi tỉnh giấc.
  rationale: Sửa câu mở đầu để xác định rõ các tiền ngữ mà tiếng Hê-bơ-rơ biểu thị bằng hình thức giống cái số nhiều và hậu tố sở hữu. Cấu trúc “Khi ...” diễn đạt quan hệ thời gian hợp với hành động đã hoàn tất trước sự nhận biết và tránh chuỗi đại từ tối nghĩa. Giữ sự lặp lại “đã vào bụng chúng” ở mệnh đề nội dung, nơi “chúng” đã có tiền ngữ gần và rõ là những con bò béo/bò gầy. Thêm “vì” để nối mệnh đề không thể nhận ra với sự kiện dáng vẻ không đổi, là quan hệ ngữ nghĩa hiển nhiên trong cấu trúc phối hợp của bản gốc.
