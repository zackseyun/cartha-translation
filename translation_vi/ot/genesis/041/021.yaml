base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: vi
  text: Khi những con bò béo đã vào bụng những con bò gầy[a], không thể nhận ra rằng chúng đã vào bụng chúng, vì dáng vẻ chúng vẫn xấu xí như lúc ban đầu. Rồi tôi tỉnh giấc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “vào phần bên trong của chúng”; trong ngữ cảnh giấc mơ, “bụng những con bò gầy” làm rõ hình ảnh các con bò béo đã bị nuốt chửng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל קִרְבֶּנָה
  choice: Chúng đi vào bụng chúng
  rationale: Động từ בוא với אֶל קֶרֶב diễn tả việc đi vào bên trong. Trong hình ảnh chiêm bao về bò nuốt bò, “bụng” diễn đạt tự nhiên phần bên trong thân thể; giữ đại từ như nguyên văn, còn chú thích làm rõ đối tượng.
- source_word: וְלֹא נוֹדַע
  choice: nhưng không ai nhận ra
  rationale: Dạng Niphal của ידע nói rằng sự việc không thể nhận biết qua quan sát. Cách diễn đạt vô nhân xưng này tự nhiên trong tiếng Việt và phù hợp ngữ cảnh.
- source_word: כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: rằng chúng đã vào bụng chúng
  rationale: כִּי giới thiệu nội dung không được nhận ra. Lặp lại “vào bụng chúng” theo nguyên văn và dùng “đã” để nêu hành động hoàn tất trước sự quan sát.
- source_word: וּמַרְאֵיהֶן רַע
  choice: dáng vẻ chúng vẫn xấu xí
  rationale: מַרְאֶה là dáng vẻ bề ngoài, còn רַע trong ngữ cảnh chỉ vẻ xấu xí. “Vẫn” làm rõ rằng việc ăn không thay đổi dáng vẻ, điều được vế so sánh kế tiếp xác nhận.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: như lúc ban đầu
  rationale: Diễn đạt sát phép so sánh về trạng thái của những con bò xấu trước và sau khi ăn.
- source_word: וָאִיקָץ
  choice: Rồi tôi tỉnh giấc
  rationale: Wayyiqtol ngôi thứ nhất số ít kết thúc lời thuật chiêm bao; “rồi” thể hiện trình tự kể chuyện tự nhiên.
