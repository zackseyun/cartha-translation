  source_fidelity: 'Bản nháp phản ánh đúng trình tự chính: những con bò đã bị nuốt đi vào bên trong các con bò nuốt chúng, việc này không thể nhận ra qua dáng vẻ, rồi Pha-ra-ôn tỉnh giấc. Tuy nhiên, chuỗi đại từ “Chúng ... bụng chúng” rất dễ bị hiểu là những con bò gầy đi vào bụng của chính chúng. Chú thích hiện có giải thích được nhưng không khắc phục sự mơ hồ ngay trong văn bản. Bản sửa nêu rõ hai nhóm bò, đồng thời giữ ý nghĩa cụ thể của קֶרֶב trong bối cảnh giấc mơ.'
  naturalness: Cách diễn đạt minh thị “những con bò béo ... những con bò gầy” tự nhiên, dễ theo dõi trong tiếng Việt hiện đại. “Không thể nhận ra” truyền đạt tốt thể Niphal vô nhân xưng/bị động mà không thêm một chủ thể quan sát. Không dùng “vẫn”, vì ý không thay đổi đã được diễn đạt bởi “như lúc ban đầu” và không cần thêm sắc thái ngoài mặt chữ.
