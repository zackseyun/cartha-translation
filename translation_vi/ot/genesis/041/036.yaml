  to: Lương thực ấy sẽ là nguồn dự trữ cho xứ trong bảy năm đói kém sẽ xảy ra tại đất Ai Cập, để xứ không bị nạn đói hủy diệt.[a]
  rationale: Chỉnh “Số lương thực ấy sẽ được dự trữ” thành “Lương thực ấy sẽ là nguồn dự trữ” để phản ánh trực tiếp hơn cấu trúc và chức năng của הָאֹכֶל לְפִקָּדוֹן, đồng thời loại bỏ một cách nói không tự nhiên. Các thành phần ý nghĩa khác và chú thích về “bị cắt đứt” được giữ nguyên về nội dung.
