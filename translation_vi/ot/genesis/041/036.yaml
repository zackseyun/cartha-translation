    rationale: הָאֹכֶל ... לְפִקָּדוֹן miêu tả lương thực như một khoản dự trữ. Bỏ “Số” và dùng vị ngữ danh từ phản ánh nguyên văn chính xác hơn, đồng thời tự nhiên hơn trong tiếng Việt.
