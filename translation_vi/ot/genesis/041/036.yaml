base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: vi
  text: Lương thực ấy sẽ là nguồn dự trữ cho xứ trong bảy năm đói kém sẽ xảy ra tại đất Ai Cập, để xứ không bị nạn đói hủy diệt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “để xứ không bị nạn đói cắt đứt”; ý nói xứ không bị tiêu diệt hoặc suy sụp vì nạn đói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הָאֹכֶל
  choice: Số lương thực ấy sẽ được
  rationale: הָאֹכֶל chỉ chung lương thực đã được thu gom ở câu trước; “ấy” liên kết tự nhiên với văn cảnh. Cấu trúc tương lai mang sắc thái kết quả dự kiến.
- source_word: לְפִקָּדוֹן
  choice: dự trữ
  rationale: Danh từ chỉ vật được giữ lại an toàn để dùng khi cần; cách diễn đạt bằng động từ bị động tự nhiên trong tiếng Việt và phù hợp bối cảnh hành chính.
- source_word: לָאָרֶץ
  choice: cho xứ
  rationale: אֶרֶץ ở đây là lãnh thổ/quốc gia Ai Cập; “xứ” giữ được sự lặp lại của từ Hê-bơ-rơ mà vẫn trang trọng, dễ hiểu.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: để dùng trong bảy năm đói kém
  rationale: Giữ mục đích của giới từ לְ và diễn đạt tự nhiên chức năng của kho lương trong suốt bảy năm đã được xác định trước.
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: sẽ xảy ra tại đất Ai Cập
  rationale: Mệnh đề quan hệ hướng đến tương lai; “xảy ra” diễn đạt tự nhiên việc các năm đói kém sẽ đến, còn “đất Ai Cập” phản ánh đầy đủ בְּאֶרֶץ מִצְרָיִם.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ בָּרָעָב
  choice: hầu cho xứ không bị nạn đói hủy diệt
  rationale: Niphal của כרת theo nghĩa đen là “bị cắt đứt/tiêu trừ”; khi chủ thể là cả xứ và tác nhân là nạn đói, “bị hủy diệt” truyền đạt rõ hậu quả mà hình ảnh Hê-bơ-rơ chỉ đến. “Hầu cho” thể hiện quan hệ mục đích/kết quả.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “xứ” cho אֶרֶץ khi nói về toàn cõi Ai Cập, và “đất Ai Cập” trong địa danh để vừa giữ sự lặp từ của nguyên bản vừa tránh lối diễn đạt gượng. Dấu chú thích được đặt ngay sau mệnh đề liên quan.
