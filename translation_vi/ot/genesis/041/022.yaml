base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: vi
  text: 'Rồi, trong giấc mơ, tôi thấy: kìa, bảy bông lúa[a] đang mọc lên trên cùng một thân, đầy đặn và tốt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bảy bông ngũ cốc.” Từ Hê-bơ-rơ có thể chỉ bông mang hạt của nhiều loại ngũ cốc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Rồi ... tôi thấy
  rationale: Động từ Qal wayyiqtol của ראה tiếp nối lời kể ở ngôi thứ nhất của Pha-ra-ôn; “Rồi” thể hiện diễn tiến tự sự một cách tự nhiên trong tiếng Việt.
- source_word: בַּחֲלֹמִי
  choice: trong giấc mơ
  rationale: Giới từ בְּ cùng danh từ חֲלוֹם và hậu tố ngôi thứ nhất số ít có nghĩa là “trong giấc mơ của tôi”; vì chủ thể đã là “tôi”, tiếng Việt tự nhiên có thể lược “của mình” mà không mất nghĩa.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: “Kìa” giữ được chức năng trình hiện sống động và yếu tố bất ngờ của הִנֵּה, đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: bảy bông lúa
  rationale: Trong ngữ cảnh này, שִׁבֹּלֶת chỉ phần bông mang hạt của cây ngũ cốc. “Bông lúa” là cách diễn đạt tự nhiên, dễ hình dung trong tiếng Việt; chú thích ghi nhận nghĩa rộng hơn là bông ngũ cốc.
- source_word: עֹלֹת
  choice: đang mọc lên
  rationale: Phân từ giống cái số nhiều diễn tả hành động đang diễn ra hoặc được thuật lại cách sống động trong giấc mơ; “đang mọc lên” phản ánh sắc thái ấy.
- source_word: בְּקָנֶה אֶחָד
  choice: trên cùng một thân
  rationale: קָנֶה ở đây là thân cây dạng ống hay cuống của ngũ cốc. Cách dịch này giữ hình ảnh nhiều bông cùng mọc trên một thân và diễn đạt tự nhiên trong tiếng Việt.
- source_word: מְלֵאֹת
  choice: đầy đặn
  rationale: Tính từ mang nghĩa “đầy”; “đầy đặn” truyền đạt hình ảnh những bông có hạt phát triển đầy đủ mà không thu hẹp nghĩa quá mức.
- source_word: וְטֹבוֹת
  choice: và tốt
  rationale: טוֹב có nghĩa rộng là “tốt”; giữ từ này bảo toàn tính khái quát của nguyên văn và sự đối lập trong trình thuật giấc mơ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dấu hai chấm trước “kìa” giúp tái hiện sự chuyển sang cảnh tượng sống động của giấc mơ. Dùng “bông lúa” theo cách nói quen thuộc của người Việt, đồng thời chú thích nghĩa rộng của từ Hê-bơ-rơ.
