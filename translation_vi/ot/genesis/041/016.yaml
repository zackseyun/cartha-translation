base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: vi
  text: 'Giô-sép đáp lời Pha-ra-ôn: “Không phải do tôi; Đức Chúa Trời sẽ ban cho Pha-ra-ôn một lời đáp an lành.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Không phải tôi; Đức Chúa Trời sẽ đáp về sự an lành của Pha-ra-ôn.” “An lành” ở đây có thể chỉ phúc lợi của Pha-ra-ôn hoặc một lời đáp có kết quả thuận lợi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יוֹסֵף אֶת־פַּרְעֹה לֵאמֹר
  choice: Giô-sép đáp lời Pha-ra-ôn
  rationale: Diễn đạt tự nhiên công thức kể chuyện và dẫn lời trong tiếng Việt; không cần dịch riêng לֵאמֹר vì dấu hai chấm đã đảm nhiệm chức năng dẫn lời.
- source_word: בִּלְעָדָי
  choice: Điều ấy không ở nơi tôi
  rationale: 'Giữ hình ảnh và sự phủ nhận mạnh trong nguyên ngữ: khả năng đưa ra lời giải đáp không bắt nguồn từ Giô-sép.'
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ đi với động từ số ít và trong ngữ cảnh chỉ Đức Chúa Trời mà Giô-sép quy việc mặc khải cho Ngài.
- source_word: יַעֲנֶה
  choice: sẽ ban ... một lời đáp
  rationale: Chuyển động từ 'đáp' thành cấu trúc tiếng Việt tự nhiên khi đi với cụm từ khó שְׁלוֹם פַּרְעֹה, đồng thời giữ ý Đức Chúa Trời là nguồn của lời giải đáp.
- source_word: שְׁלוֹם פַּרְעֹה
  choice: cho Pha-ra-ôn ... về sự bình an
  rationale: Giữ trường nghĩa rộng của שָׁלוֹם gồm bình an, an lành và kết quả thuận lợi, thay vì thu hẹp thành cảm xúc yên ổn hoặc khẳng định chắc chắn một kết quả tốt.
theological_decisions:
- issue: Nguồn của khả năng giải nghĩa
  choice: Giô-sép phủ nhận rằng lời giải đáp bắt nguồn từ mình và quy lời đáp cho Đức Chúa Trời.
  alternative: “Không phải tôi; Đức Chúa Trời sẽ ban cho Pha-ra-ôn một lời đáp bình an.”
  rationale: Cách dịch duy trì sự tương phản thần học giữa Giô-sép và Đức Chúa Trời mà không thêm một học thuyết ngoài câu.
- issue: Sắc thái của שָׁלוֹם
  choice: Giữ cách nói “về sự bình an” và giải thích nghĩa rộng trong chú thích.
  alternative: “một lời đáp tốt lành” hoặc “một lời đáp đem lại an lành”
  rationale: Nguyên ngữ có thể nói đến sự an lành/phúc lợi của Pha-ra-ôn hoặc tính thuận lợi của lời đáp; bản dịch chính không nên âm thầm quyết định giữa các sắc thái ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên riêng quen thuộc “Giô-sép”, “Pha-ra-ôn” và danh xưng “Đức Chúa Trời”. Cấu trúc “Điều ấy không ở nơi tôi” hơi mang sắc thái Kinh Thánh nhưng vẫn rõ nghĩa, nhằm bảo toàn hình ảnh của nguyên ngữ.
