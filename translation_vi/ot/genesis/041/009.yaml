base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: vi
  text: 'Bấy giờ, viên quan chánh dâng rượu thưa với Pha-ra-ôn: “Hôm nay, tôi nhớ lại những lỗi lầm của mình.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những tội lỗi của mình” hoặc “những sai phạm của mình.” Từ Hê-bơ-rơ này có thể chỉ rộng về điều sai trái, dù liên quan đến đạo đức hay chức vụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ ... thưa
  rationale: Dạng waw liên tiếp đẩy mạch kể chuyện tiến tới. “Bấy giờ” tự nhiên trong văn thuật sự tiếng Việt; “thưa” phù hợp khi một quan chức cấp dưới nói với Pha-ra-ôn.
- source_word: שַׂר הַמַּשְׁקִים
  choice: quan trưởng tửu chánh
  rationale: Chức danh chỉ người đứng đầu việc dâng rượu trong triều. “Quan trưởng tửu chánh” trang trọng, dễ hiểu trong văn cảnh cung đình và tránh cách gọi cổ “quan tửu chính” khó hiểu hơn.
- source_word: אֶת־פַּרְעֹה
  choice: với Pha-ra-ôn
  rationale: אֶת đánh dấu đối tượng của động từ; trong tiếng Việt, cấu trúc tự nhiên là “thưa với Pha-ra-ôn”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Phân từ giới thiệu lời nói được thể hiện tự nhiên bằng dấu hai chấm; không cần lặp “rằng” hay “nói rằng” sau động từ “thưa”.
- source_word: אֶת חֲטָאַי
  choice: những lỗi lầm của mình
  rationale: חטא có thể chỉ tội, lỗi hoặc sự sai phạm. Trong văn cảnh triều đình, “lỗi lầm” giữ nghĩa rộng, không thu hẹp thành tội lỗi tôn giáo hay chỉ sai phạm công vụ.
- source_word: אֲנִי מַזְכִּיר
  choice: tôi nhớ lại
  rationale: Dạng Hiphil của זכר có thể mang nghĩa làm cho nhớ, nhắc đến hoặc gọi lại trong trí. Ở đây, “nhớ lại” diễn đạt tự nhiên việc viên quan đưa lỗi lầm trước kia của mình trở lại tâm trí và lời nói.
- source_word: הַיּוֹם
  choice: Hôm nay
  rationale: Cách diễn đạt hiện đại, tự nhiên, đồng thời giữ nguyên sự nhấn mạnh về thời điểm.
theological_decisions:
- issue: Phạm vi nghĩa của חֲטָאַי
  choice: những lỗi lầm của mình
  alternative: những tội lỗi của mình; những sai phạm của mình
  rationale: Nguyên ngữ cho phép cả sắc thái đạo đức lẫn lỗi phạm trong chức vụ. Bản dịch chính giữ nghĩa rộng; chú thích bảo tồn các khả năng khác mà không áp đặt cách hiểu thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” biểu thị đúng quan hệ cấp dưới với vua; “quan trưởng tửu chánh” giữ sắc thái chức danh cung đình. Đại từ “tôi” tự nhiên trong lời trình bày trước Pha-ra-ôn.
