source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: vi
  text: 'Giô-sép đặt tên cho con trưởng nam là Ma-na-se[a], vì ông nói: “Đức Chúa Trời đã làm cho tôi quên hết mọi gian khổ[b] và cả nhà cha tôi[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ma-na-se nghe gần giống từ Hê-bơ-rơ có nghĩa là “làm cho quên.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mọi nỗi nhọc nhằn” hoặc “mọi khốn khó.”
    reason: lexical_alternative
  - marker: c
    text: “Nhà cha tôi” là cách nói Hê-bơ-rơ chỉ gia đình hoặc hộ gia đình bên cha của một người.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם הַבְּכוֹר
  choice: đặt tên cho con trưởng nam
  rationale: Diễn đạt tự nhiên trong tiếng Việt hành động gọi tên, đồng thời giữ rõ chi tiết người con này là con trưởng nam.
- source_word: מְנַשֶּׁה
  choice: Ma-na-se
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt; lối chơi chữ với động từ ‘làm cho quên’ được giải thích trong chú thích.
- source_word: כִּי
  choice: vì ông nói
  rationale: Liên từ mở đầu lời giải thích cho việc đặt tên; thêm ‘ông nói’ để câu dẫn lời trực tiếp tự nhiên mà không thay đổi nội dung.
- source_word: נַשַּׁנִי
  choice: đã làm cho tôi quên
  rationale: Giữ nghĩa khiến cho/quy nguyên nhân của dạng động từ và mối liên hệ với tên Ma-na-se.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Ngữ cảnh và động từ số ít cho thấy từ này chỉ Đức Chúa Trời duy nhất; đây là cách gọi trang trọng, dễ hiểu trong tiếng Việt.
- source_word: כָּל עֲמָלִי
  choice: hết mọi gian khổ
  rationale: עָמָל có thể chỉ nỗi nhọc nhằn, khốn khó hoặc lao khổ; ‘gian khổ’ bao quát kinh nghiệm đau khổ của Giô-sép trong ngữ cảnh.
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: và cả nhà cha tôi
  rationale: Giữ hình ảnh và thành ngữ thân tộc ‘nhà cha’ của tiếng Hê-bơ-rơ, thay vì thu hẹp thành một số cá nhân cụ thể.
theological_decisions:
- issue: Hàm ý Giô-sép ‘quên’ nhà cha mình
  choice: Giữ nguyên lời giải thích trực tiếp rằng Đức Chúa Trời làm cho ông quên mọi gian khổ và cả nhà cha mình.
  alternative: Diễn giải rằng Đức Chúa Trời chỉ làm ông quên nỗi đau gắn với nhà cha, hoặc xem đây chỉ là cách nói cường điệu về sự khuây khỏa.
  rationale: Bản Hê-bơ-rơ phát biểu thẳng như vậy. Bản dịch không làm nhẹ đi hoặc dung hòa sự căng thẳng thần học và tình cảm trong lời của Giô-sép.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu văn ưu tiên lối diễn đạt tự nhiên ‘đặt tên cho’ thay vì sao chép cứng cấu trúc Hê-bơ-rơ ‘gọi tên của’; vẫn giữ ‘con trưởng nam’ và thành ngữ ‘nhà cha tôi’ vì chúng có ý nghĩa trong mạch truyện.
