  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: Giô-sép đặt tên người con đầu lòng là Ma-na-se; lời giải thích nêu Đức Chúa Trời đã khiến ông quên toàn bộ gian khổ và toàn bộ «nhà cha tôi». Cụm «và cả nhà cha tôi» giữ được sự căng thẳng nguyên văn, không diễn giải giảm nhẹ thành chỉ nỗi đau hay chỉ những người trong gia đình.'
