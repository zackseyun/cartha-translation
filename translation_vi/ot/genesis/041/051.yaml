  terminology: «Giô-sép», «Ma-na-se» và «Đức Chúa Trời» nhất quán với cách dùng Kinh Thánh tiếng Việt thông dụng. «Gian khổ» là lựa chọn bao quát, phù hợp với עָמָל; chú thích nêu các sắc thái «nhọc nhằn» và «khốn khó». Chú thích về «nhà cha tôi» giải thích đúng thành ngữ thân tộc mà không áp đặt cách hiểu.
