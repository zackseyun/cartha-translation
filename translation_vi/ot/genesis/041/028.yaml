base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: vi
  text: 'Đây là điều tôi đã nói với Pha-ra-ôn: Đức Chúa Trời đã cho Pha-ra-ôn thấy điều Ngài đang làm[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều Đức Chúa Trời sắp làm.” Phân từ Hê-bơ-rơ có thể chỉ hành động hiện tại hoặc sắp xảy ra; trong bối cảnh giải nghĩa giấc mơ, câu này nói đến những biến cố sắp đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: Đây là điều
  rationale: Diễn đạt tự nhiên câu đồng nhất trong tiếng Việt; דָּבָר ở đây chỉ nội dung đã được giải thích, nên “điều” phù hợp hơn “lời” hay “sự việc”.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל פַּרְעֹה
  choice: tôi đã nói với Pha-ra-ôn
  rationale: Giữ mệnh đề quan hệ và hành động nói đã xảy ra, đồng thời dùng kết cấu tiếng Việt tự nhiên “nói với”.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt để chỉ Đức Chúa Trời; mạo từ Hê-bơ-rơ không cần được dịch riêng.
- source_word: עֹשֶׂה
  choice: đang làm
  rationale: Phân từ Hê-bơ-rơ có thể biểu thị hành động đang diễn ra hoặc sắp xảy ra. Bản chính giữ sát hình thái bằng “đang làm”, còn sắc thái cận tương lai được nêu trong chú thích.
- source_word: הֶרְאָה אֶת פַּרְעֹה
  choice: đã cho Pha-ra-ôn thấy
  rationale: Thể Hifil của ראה mang nghĩa “cho thấy”; “đã” phản ánh động từ hoàn thành và phù hợp với việc giấc mơ đã được ban.
theological_decisions:
- issue: Cách gọi הָאֱלֹהִים trong lời Giô-sép
  choice: Đức Chúa Trời
  alternative: Thượng Đế
  rationale: “Đức Chúa Trời” xác định tự nhiên Đấng mà Giô-sép quy cho quyền thực hiện và bày tỏ các biến cố, không thêm nội dung tín lý ngoài nguyên văn.
- issue: Thời thái của עֹשֶׂה
  choice: đang làm
  alternative: sắp làm
  rationale: Giữ sự mơ hồ thật của phân từ giữa hành động hiện tại và cận tương lai; bối cảnh lời tiên báo ủng hộ “sắp làm”, nhưng không nên đưa cách hiểu ấy vào bản chính như lựa chọn duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc nhấn mạnh của nguyên văn và dùng “Pha-ra-ôn” theo lối phiên âm Kinh Thánh quen thuộc.
