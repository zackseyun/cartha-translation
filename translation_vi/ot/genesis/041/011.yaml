  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: vi
  text: Trong cùng một đêm, tôi và người ấy đều nằm mơ; mỗi người đã mơ một giấc mơ phù hợp với lời giải nghĩa của giấc mơ mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: đều nằm mơ
  rationale: Động từ cùng danh từ đồng gốc trong tiếng Hê-bơ-rơ nhấn mạnh sự việc cả hai đã mơ; tiếng Việt tự nhiên dùng “đều nằm mơ”, tránh cách lặp gượng “mơ một giấc mơ”.
- source_word: בְּלַיְלָה אֶחָד
  choice: trong cùng một đêm
  rationale: Nghĩa sát là “trong một đêm”; trong ngữ cảnh, cụm từ nhấn mạnh hai người cùng nằm mơ vào một đêm, nên “trong cùng một đêm” diễn đạt rõ sự trùng hợp về thời gian.
- source_word: אֲנִי וָהוּא
  choice: tôi và anh ấy
  rationale: Giữ thứ tự của nguyên văn và nêu rõ cả hai người sau động từ số nhiều.
- source_word: אִישׁ
  choice: mỗi người
  rationale: אִישׁ được dùng theo nghĩa phân phối, chỉ riêng từng người trong hai người; “mỗi người” tự nhiên và chính xác trong tiếng Việt.
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: ứng với lời giải nghĩa của giấc mơ mình
  rationale: כְּ diễn tả sự tương ứng giữa giấc mơ của mỗi người và lời giải nghĩa dành cho nó; “mình” duy trì quan hệ phân phối với “mỗi người”.
- source_word: חָלָמְנוּ
  choice: có một giấc mơ
  rationale: Động từ cuối câu nối lại ý “chúng tôi nằm mơ” trong cấu trúc phân phối. Tiếng Việt diễn đạt tự nhiên bằng “mỗi người có một giấc mơ”, đồng thời giữ sự tương ứng riêng của từng giấc mơ.
