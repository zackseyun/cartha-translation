  terminology: “Sông Nin,” “bò cái,” “béo tốt,” và “dáng vẻ đẹp đẽ” đều phù hợp với cách dùng tiếng Việt hiện đại và các từ ngữ nguồn. Chú thích cần giữ các khả năng thay thế cho אָחוּ, nhưng không nên trình bày “cỏ đầm lầy” như chỉ là phương án phụ nếu bản văn chính lại chọn “lau sậy.”
