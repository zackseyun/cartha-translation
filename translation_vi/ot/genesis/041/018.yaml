translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. “Kìa” bảo tồn nét sống động của lời thuật giấc mơ; “béo tốt” là cách miêu tả gia súc tự nhiên trong tiếng Việt. Dấu chân chú [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
