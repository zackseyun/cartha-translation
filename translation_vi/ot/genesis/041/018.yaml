base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: vi
  text: Kìa, từ sông Nin đi lên bảy con bò cái, thân hình béo tốt, dáng vẻ đẹp đẽ; chúng gặm cỏ trong bãi cỏ đầm lầy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giữa đám lau sậy” hoặc “giữa đám cói”; từ Hê-bơ-rơ chỉ thảm thực vật vùng đất ngập nước ven sông Nin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ sắc thái chỉ dẫn sống động, làm cảnh trong giấc mơ hiện ra đột ngột; tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: מִן הַיְאֹר
  choice: từ sông Nin
  rationale: Trong bối cảnh Ai Cập, יְאֹר chỉ sông Nin; dịch rõ địa danh phù hợp hơn cách gọi chung chung là “sông”.
- source_word: עֹלֹת
  choice: đi lên
  rationale: Phân từ giống cái số nhiều mô tả hành động đang diễn ra; tiếng Việt không cần đánh dấu thể tiến hành bằng từ phụ để giữ câu tự nhiên.
- source_word: שֶׁבַע פָּרוֹת
  choice: bảy con bò cái
  rationale: פָּרוֹת xác định rõ đây là bò giống cái, nên bản dịch giữ độ chính xác này.
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: thân hình béo tốt
  rationale: Cụm Hê-bơ-rơ mô tả thịt/thân thể đầy đặn, khỏe mạnh. “Béo tốt” truyền đạt đồng thời vẻ no đủ và khỏe mạnh, không mang sắc thái chê bai trong ngữ cảnh gia súc.
- source_word: וִיפֹת תֹּאַר
  choice: dáng vẻ đẹp đẽ
  rationale: Giữ ý về hình dáng hoặc diện mạo đẹp, đồng thời tạo cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: וַתִּרְעֶינָה
  choice: chúng gặm cỏ
  rationale: רעה ở đây nói về súc vật ăn hoặc chăn thả; “gặm cỏ” là cách nói rõ ràng, tự nhiên.
- source_word: בָּאָחוּ
  choice: giữa đám lau sậy
  rationale: אָחוּ chỉ thảm thực vật vùng đầm lầy ven sông; cách dịch này giữ bối cảnh đất ngập nước, thay vì hiểu chung là đồng cỏ.
