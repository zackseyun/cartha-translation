base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: vi
  text: 'Pha-ra-ôn nói với Giô-sép: “Ta đã mơ một giấc mơ, nhưng không ai giải nghĩa giấc mơ ấy được. Ta nghe nói về ngươi rằng hễ ngươi nghe một giấc mơ thì có thể giải nghĩa nó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: Ta đã nằm mơ một giấc mơ
  rationale: Giữ phép lặp giữa danh từ và động từ trong tiếng Hê-bơ-rơ, đồng thời vẫn tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: nhưng không ai giải nghĩa được
  rationale: Diễn đạt tự nhiên cấu trúc hiện hữu phủ định; đại từ chỉ giấc mơ được hiểu ngầm trong tiếng Việt.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: Ta nghe nói về ngươi rằng
  rationale: Phản ánh thành ngữ báo tin trong nguyên văn mà không tạo lời trích dẫn cứng nhắc.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: ngươi chỉ cần nghe một giấc mơ là có thể giải nghĩa được
  rationale: Cấu trúc nguyên văn theo sát mặt chữ là ‘ngươi nghe một giấc mơ để giải nghĩa nó’; bản dịch diễn đạt năng lực được thuật lại, phù hợp ngữ cảnh và giữ vai trò của việc nghe giấc mơ.
