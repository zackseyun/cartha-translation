- from: 'Pha-ra-ôn nói với Giô-sép: “Ta đã nằm mơ một giấc mơ, nhưng không ai giải nghĩa được. Ta nghe nói về ngươi rằng ngươi chỉ cần nghe một giấc mơ là có thể giải nghĩa được.”'
  to: 'Pha-ra-ôn nói với Giô-sép: “Ta đã mơ một giấc mơ, nhưng không ai giải nghĩa giấc mơ ấy được. Ta nghe nói về ngươi rằng hễ ngươi nghe một giấc mơ thì có thể giải nghĩa nó.”'
  rationale: Bản sửa loại bỏ sắc thái thêm của “chỉ cần”, phục hồi tham chiếu rõ ràng đến giấc mơ theo nguyên văn, và giữ lối nói thuật lại về năng lực giải mộng. Không cần chú thích vì không có điểm tranh chấp văn bản hoặc từ ngữ không thể chuyển tải trong thân văn.
  reviewer_model: gpt-5.6-terra
