- from: 'Vậy, ngày hôm ấy, ông chúc phước cho họ rằng: “Nhờ hai con[a], Israel sẽ chúc phước rằng: ‘Nguyện Đức Chúa Trời làm cho bạn được như Ép-ra-im và như Ma-na-se.’” Như thế, ông đặt Ép-ra-im trước Ma-na-se.'
  to: 'Và ngày hôm ấy, ông chúc phước cho họ rằng: “Nhờ con, Israel sẽ chúc phước rằng: ‘Nguyện Đức Chúa Trời làm cho bạn được như Ép-ra-im và như Ma-na-se.’” Và ông đặt Ép-ra-im trước Ma-na-se.'
