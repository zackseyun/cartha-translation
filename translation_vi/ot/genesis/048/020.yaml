base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: vi
  text: 'Và ngày hôm ấy, ông chúc phước cho họ rằng: “Nhờ con, Israel sẽ chúc phước rằng: ‘Nguyện Đức Chúa Trời làm cho bạn được như Ép-ra-im và như Ma-na-se.’” Và ông đặt Ép-ra-im trước Ma-na-se.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: ông chúc phước cho họ
  rationale: Động từ ברך ở thể Piel có nghĩa là chúc phước; hậu tố số nhiều chỉ chung Ép-ra-im và Ma-na-se.
- source_word: בַּיּוֹם הַהוּא
  choice: ngày hôm ấy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ rõ thời điểm được bản Hê-bơ-rơ nêu ra.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Từ dẫn lời trực tiếp trong tiếng Hê-bơ-rơ được chuyển bằng cấu trúc dẫn ngữ tự nhiên của tiếng Việt.
- source_word: בְּךָ
  choice: nhờ hai con
  rationale: Giới từ בְּ có thể biểu thị phương tiện hoặc sự quy chiếu. Đại từ Hê-bơ-rơ ở số ít nhưng mang nghĩa tập thể, quy về hai người vừa được chúc phước; tiếng Việt cần dùng số nhiều để tránh hiểu là chỉ một người.
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: Israel sẽ chúc phước
  rationale: Dạng vị hoàn thành diễn tả tập quán hoặc hành động tương lai. Giữ nguyên tên Israel để không thu hẹp nghĩa vào riêng Gia-cốp hay chỉ dân tộc hậu thế.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: Nguyện Đức Chúa Trời làm cho bạn
  rationale: Trong công thức chúc phước, động từ mang sắc thái nguyện ước; “nguyện” diễn đạt tự nhiên sắc thái ấy. Đại từ số ít của công thức được chuyển là “bạn” theo cách một người chúc phước cho một người khác.
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: như Ép-ra-im và như Ma-na-se
  rationale: Lặp lại “như” để phản ánh hai giới từ so sánh כְּ và giữ nhịp điệu, sự nhấn mạnh của nguyên văn.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: Như thế, ông đặt Ép-ra-im trước Ma-na-se
  rationale: “Đặt ... trước” vừa bảo toàn hình ảnh của שׂים với לִפְנֵי, vừa truyền đạt địa vị ưu tiên của Ép-ra-im trong công thức chúc phước; “như thế” nêu kết quả của chính thứ tự vừa được tuyên bố.
theological_decisions:
- issue: Đối tượng mà בְּךָ quy chiếu
  choice: “nhờ hai con”, hiểu đại từ số ít theo nghĩa tập thể là Ép-ra-im và Ma-na-se
  alternative: “nhờ con”, quy chiếu riêng về Ép-ra-im; hoặc “nơi con” theo lối dịch sát hình thức
  rationale: Lời chúc ngay sau đó dùng cả hai tên làm khuôn mẫu, và câu mở đầu nói Gia-cốp chúc phước cho “họ”. Bản dịch chính làm rõ nghĩa tập thể cần thiết trong tiếng Việt, còn chú thích ghi nhận lối dịch sát hơn và chức năng của các tên trong công thức chúc phước.
- issue: Đối tượng của danh xưng “Israel” trong công thức chúc phước
  choice: Giữ nguyên “Israel” mà không diễn giải thêm
  alternative: “Gia-cốp” hoặc “dân Israel”
  rationale: Nguyên văn chỉ ghi יִשְׂרָאֵל. Trong ngữ cảnh, từ này có thể gợi cả vị tổ phụ mang tên Israel và cộng đồng hậu duệ sẽ dùng công thức ấy; giữ nguyên danh xưng bảo toàn độ mở của bản văn.
- issue: Ý nghĩa của việc đặt Ép-ra-im trước Ma-na-se
  choice: Giữ cách nói “đặt ... trước”
  alternative: Diễn giải là “cho Ép-ra-im địa vị cao hơn Ma-na-se”
  rationale: Nguyên văn vừa nói đến thứ tự tên gọi vừa hàm ý sự ưu tiên. Cách dịch không giải thích quá mức bản chất hay hệ quả thần học của sự ưu tiên đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho אֱלֹהִים; phiên âm tên riêng theo lối Việt hóa quen thuộc. Đại từ “ông” tiếp nối chủ thể Gia-cốp từ ngữ cảnh, còn “bạn” trong lời chúc biểu thị người bất kỳ sẽ nhận công thức chúc phước.
