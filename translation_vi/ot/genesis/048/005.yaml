source:
  edition: WLC
  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: vi
  text: Và bây giờ, hai con trai của con, sinh ra cho con trong xứ Ai Cập trước khi cha đến với con tại Ai Cập,[a] đều thuộc về cha; Ép-ra-im và Ma-na-se sẽ thuộc về cha, như Ru-bên và Si-mê-ôn vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ cũng có thể dịch sát hơn là “cho đến khi cha đến với con tại Ai Cập”; trong ngữ cảnh, câu nói chỉ hai người con được sinh ra trước khi Gia-cốp đến.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Và bây giờ
  rationale: Giữ mối nối trong diễn từ và nhấn mạnh bước phát triển mới trong lời Gia-cốp.
- source_word: שְׁנֵי בָנֶיךָ הַנּוֹלָדִים לְךָ
  choice: hai con trai của con, là những người đã sinh cho con
  rationale: Bảo toàn số lượng, quan hệ sở hữu và ý nghĩa của phân từ bị động; cách diễn đạt trang trọng nhưng vẫn rõ trong tiếng Việt.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trong xứ Ai Cập
  rationale: Dịch rõ אֶרֶץ là “xứ”, thay vì lược bỏ.
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרָיְמָה
  choice: trước khi cha đến với con tại Ai Cập
  rationale: Trong ngữ cảnh, עַד xác định những người con sinh ra trước lúc Gia-cốp đến; vẫn giữ địa danh Ai Cập được lặp lại trong nguyên văn.
- source_word: לִי הֵם
  choice: đều thuộc về cha
  rationale: Diễn đạt tự nhiên lời Gia-cốp nhận hai người vào hàng con mình mà không thêm thuật ngữ pháp lý “nhận làm con nuôi”.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: Ép-ra-im và Ma-na-se
  rationale: Phiên âm tên riêng theo dạng quen thuộc, dễ đọc trong tiếng Việt.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן יִהְיוּ לִי
  choice: sẽ thuộc về cha như Ru-bên và Si-mê-ôn vậy
  rationale: Giữ ý so sánh và lời tuyên bố về địa vị của Ép-ra-im và Ma-na-se ngang với các con trai của Gia-cốp.
theological_decisions:
- issue: Bản chất lời Gia-cốp nhận Ép-ra-im và Ma-na-se
  choice: Dịch là “thuộc về cha… như Ru-bên và Si-mê-ôn vậy”
  alternative: “Cha nhận chúng làm con nuôi”
  rationale: Nguyên văn khẳng định họ là của Gia-cốp và sẽ như Ru-bên, Si-mê-ôn, nhưng không dùng thuật ngữ kỹ thuật chỉ việc nhận con nuôi; bản dịch giữ nguyên sức nặng mà không xác định quá mức cơ chế pháp lý.
- issue: Quan hệ thời gian của עַד בֹּאִי
  choice: “trước khi cha đến” trong chính văn
  alternative: “cho đến khi cha đến”
  rationale: “Trước khi” truyền đạt rõ giới hạn thời gian theo ngữ cảnh, còn chú thích lưu lại cách diễn đạt sát hình thức Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cha/con” theo quan hệ giữa Gia-cốp và Giô-sép; giữ sự lặp lại “Ai Cập” vì nguyên văn nêu địa danh hai lần. Dấu chú thích [a] được đặt sau toàn câu vì liên quan đến mệnh đề thời gian ở giữa câu.
