  terminology: Cách xưng hô “cha/con,” “xứ Ai Cập,” và các dạng tên Ép-ra-im, Ma-na-se, Ru-bên, Si-mê-ôn phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Thuộc về cha” truyền đạt lời Gia-cốp nhận họ vào hàng con mà không áp đặt thuật ngữ pháp lý hay giáo phái.
