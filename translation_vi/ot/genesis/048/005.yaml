  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của tiếng Hê-bơ-rơ: lời chuyển ý “Và bây giờ,” hai người con của Giô-sép, nơi sinh tại xứ Ai Cập, giới hạn thời gian trước khi Gia-cốp đến Ai Cập, lời tuyên bố họ thuộc về Gia-cốp, và địa vị tương đương Ru-bên cùng Si-mê-ôn. Tuy nhiên, “là những người đã sinh cho con” thiếu cách diễn đạt bị động cần thiết và trong tiếng Việt có thể bị hiểu là chính các con trai ấy đã sinh con cho Giô-sép.'
