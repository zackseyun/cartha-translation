  text: וּ/מוֹלַדְתְּ/ךָ֛ אֲשֶׁר הוֹלַ֥דְתָּ אַחֲרֵי/הֶ֖ם לְ/ךָ֣ יִהְי֑וּ עַ֣ל שֵׁ֧ם אֲחֵי/הֶ֛ם יִקָּרְא֖וּ בְּ/נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: vi
  text: Còn con cái mà con sinh ra sau họ sẽ thuộc về con[a]; chúng sẽ được gọi theo tên các anh mình trong phần thừa kế của các anh ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa là họ sẽ không nhận phần thừa kế riêng với tư cách một bộ tộc, nhưng sẽ được tính vào Ép-ra-im hoặc Ma-na-se.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: con cái
  rationale: Danh từ chỉ những người được sinh ra cho Giô-sép; “con cái” tự nhiên trong tiếng Việt và phù hợp với các con sinh sau Ép-ra-im và Ma-na-se.
- source_word: הוֹלַדְתָּ
  choice: con sinh ra
  rationale: Thể Hiphil của ילד, nói với người cha, mang nghĩa sinh thành; cách diễn đạt này tự nhiên và không gây sắc thái cổ.
- source_word: אַחֲרֵיהֶם
  choice: sau họ
  rationale: Giữ trực tiếp quy chiếu đến Ép-ra-im và Ma-na-se, tức những người con được sinh sau hai người ấy.
- source_word: לְךָ יִהְיוּ
  choice: sẽ thuộc về con
  rationale: Diễn đạt quan hệ pháp lý và gia đình, đối lập với việc Ép-ra-im và Ma-na-se vừa được Gia-cốp nhận làm con.
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: theo tên của các anh mình
  rationale: Giữ hình ảnh gọi theo tên, đồng thời tiếng Việt “theo tên” tự nhiên và có thể hàm ý được tính vào danh phận bộ tộc của các anh.
- source_word: אֲחֵיהֶם
  choice: các anh mình
  rationale: Trong ngữ cảnh, Ép-ra-im và Ma-na-se là những người con sinh trước; “các anh” thể hiện đúng quan hệ tuổi tác, còn “mình” giúp câu tiếng Việt rõ chủ thể.
- source_word: יִקָּרְאוּ
  choice: sẽ được gọi
  rationale: Giữ nghĩa thụ động cơ bản của קרא và không chuyển hẳn sang cách giải thích “được kể vào,” dù ngữ cảnh thừa kế gợi sắc thái ấy.
- source_word: בְּנַחֲלָתָם
  choice: trong phần thừa kế của mình
  rationale: נַחֲלָה chỉ phần đất hoặc sản nghiệp được thừa hưởng; thêm “phần” làm rõ ý phân chia gia nghiệp trong tiếng Việt.
theological_decisions:
- issue: Địa vị thừa kế của những người con sinh sau
  choice: Giữ lời văn rằng họ thuộc về Giô-sép và được gọi theo tên các anh trong phần thừa kế.
  alternative: Diễn giải trực tiếp rằng họ không có phần đất bộ tộc riêng mà được tính vào Ép-ra-im và Ma-na-se.
  rationale: Bản Hê-bơ-rơ nói bằng ngôn ngữ thuộc về và gọi tên, không phát biểu tường minh toàn bộ cơ chế phân chia đất; chú thích có thể giải thích hàm ý mà không thay thế sự căng thẳng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo lời Gia-cốp nói với Giô-sép; giữ cấu trúc gọi theo tên trong bối cảnh thừa kế thay vì giải nghĩa hoàn toàn ngay trong chính văn.
