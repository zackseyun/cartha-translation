id: GEN.48.10
reference: Genesis 48:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִ/זֹּ֔קֶן לֹ֥א יוּכַ֖ל לִ/רְא֑וֹת וַ/יַּגֵּ֤שׁ אֹתָ/ם֙ אֵלָ֔י/ו וַ/יִּשַּׁ֥ק לָ/הֶ֖ם וַ/יְחַבֵּ֥ק לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: vi
  text: Mắt Y-sơ-ra-ên đã mờ vì tuổi già[a], nên ông không thể nhìn thấy. Giô-sép đưa hai con lại gần ông[b]; ông hôn và ôm các cháu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “mắt Y-sơ-ra-ên đã nặng vì tuổi già”; đây là thành ngữ nói rằng thị lực ông đã mờ.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ không nêu lại chủ ngữ của động từ “đưa lại gần”; theo ngữ cảnh câu 9, người đưa hai con đến gần Y-sơ-ra-ên là Giô-sép.
    reason: referent_clarification
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: Mắt Y-sơ-ra-ên
  rationale: Giữ nguyên tên “Y-sơ-ra-ên” như bản Hê-bơ-rơ, đồng thời diễn đạt cấu trúc sở hữu theo lối tự nhiên trong tiếng Việt.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: đã mờ vì tuổi già
  rationale: כָּבְדוּ theo nghĩa đen là “nặng”, nhưng khi nói về mắt thì chỉ thị lực suy giảm; “mờ vì tuổi già” truyền đạt rõ thành ngữ và quan hệ nguyên nhân.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: ông không thể nhìn thấy
  rationale: Diễn đạt trực tiếp tình trạng không còn khả năng nhìn của Y-sơ-ra-ên.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: Giô-sép đưa hai con lại gần ông
  rationale: Động từ Hiphil mang nghĩa “đưa lại gần”. Chủ ngữ không được nêu lại trong tiếng Hê-bơ-rơ, nhưng ngữ cảnh câu 9 xác định người đưa hai con đến là Giô-sép; nêu tên giúp tiếng Việt tránh khiến độc giả hiểu nhầm rằng Y-sơ-ra-ên tự đưa các cháu đến gần mình.
- source_word: וַיִּשַּׁק לָהֶם וַיְחַבֵּק לָהֶם
  choice: ông hôn và ôm các cháu
  rationale: “Ông” trở lại chỉ Y-sơ-ra-ên; “các cháu” diễn đạt tự nhiên quan hệ của Ép-ra-im và Ma-na-se với ông trong ngữ cảnh, còn hai động từ giữ nguyên hai cử chỉ trìu mến.
theological_decisions:
- issue: Chủ ngữ của וַיַּגֵּשׁ
  choice: Nêu rõ là Giô-sép
  alternative: Giữ đại từ “ông” theo hình thức chủ ngữ ẩn của tiếng Hê-bơ-rơ
  rationale: Đây là vấn đề quy chiếu trong mạch truyện, không phải một khẳng định thần học. Câu trước đó (48:9) cho thấy Y-sơ-ra-ên bảo Giô-sép đưa hai con đến, nên việc nêu Giô-sép bảo toàn ý nghĩa của tình tiết và tránh một quy chiếu sai trong tiếng Việt.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Y-sơ-ra-ên” đúng tên xuất hiện trong nguyên văn; “hai con” theo góc nhìn của Giô-sép và “các cháu” theo góc nhìn của Y-sơ-ra-ên giúp các đại từ rõ nghĩa mà vẫn tự nhiên.
