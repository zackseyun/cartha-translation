  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/אֲנִ֣י בְּ/בֹאִ֣/י מִ/פַּדָּ֗ן מֵ֩תָה֩ עָלַ֨/י רָחֵ֜ל בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ בַּ/דֶּ֔רֶךְ בְּ/ע֥וֹד כִּבְרַת אֶ֖רֶץ לָ/בֹ֣א אֶפְרָ֑תָה וָ/אֶקְבְּרֶ֤/הָ שָּׁם֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: vi
  text: Còn ta, khi từ Pha-đan trở về, Ra-chên đã qua đời bên ta[a] trong xứ Ca-na-an, dọc đường, khi vẫn còn cách Ép-ra-ta một quãng; ta đã chôn nàng tại đó, bên đường đến Ép-ra-ta, tức là Bết-lê-hem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo sát cách nói Hê-bơ-rơ là “qua đời trên ta/đối với ta”; thành ngữ này có thể nhấn mạnh Ra-chên qua đời bên cạnh Gia-cốp hoặc sức nặng riêng của cái chết ấy đối với ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Còn ta
  rationale: Đại từ độc lập cùng liên từ đánh dấu sự chuyển đề và nhấn mạnh lời hồi tưởng riêng của Gia-cốp; “Còn ta” tự nhiên và giữ được sắc thái ấy.
- source_word: בְּבֹאִי מִפַּדָּן
  choice: khi từ Pha-đan trở về
  rationale: Cấu trúc nguyên mẫu với hậu tố ngôi thứ nhất có nghĩa thời gian. Trong mạch kể về chuyến trở về Ca-na-an, “trở về” tự nhiên hơn “đến,” còn địa danh được giữ đúng dạng ngắn Pha-đan của câu Hê-bơ-rơ.
- source_word: מֵתָה עָלַי
  choice: đã qua đời bên ta
  rationale: Cụm từ theo sát mặt chữ là “chết trên/đối với ta,” có thể gợi cả sự hiện diện gần Gia-cốp lẫn sức nặng riêng của cái chết đối với ông. “Qua đời bên ta” giữ được sắc thái không gian-cá nhân mà không thu hẹp hoàn toàn vào nỗi đau.
- source_word: בְּאֶרֶץ כְּנַעַן בַּדֶּרֶךְ
  choice: trong xứ Ca-na-an, dọc đường
  rationale: Giữ đầy đủ địa danh và hoàn cảnh đang đi đường; “dọc đường” là cách nói Việt tự nhiên trong lời thuật chuyện.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: khi vẫn còn cách Ép-ra-ta một quãng
  rationale: כברת ארץ chỉ một quãng đường còn lại nhưng độ dài chính xác không chắc chắn; cách dịch này tránh tạo ra độ chính xác không có trong nguyên văn.
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: ta đã chôn nàng tại đó
  rationale: Giữ trình tự kể chuyện, chủ thể ngôi thứ nhất và đại từ chỉ nơi chốn.
- source_word: בְּדֶרֶךְ אֶפְרָת הִוא בֵּית לָחֶם
  choice: bên đường đến Ép-ra-ta, tức là Bết-lê-hem
  rationale: Diễn đạt rõ địa điểm liên hệ với đường đến Ép-ra-ta và giữ lời giải thích đồng nhất Ép-ra-ta với Bết-lê-hem.
theological_decisions:
- issue: Sắc thái của מֵתָה עָלַי
  choice: qua đời bên ta
  alternative: qua đời khiến ta đau buồn
  rationale: Nguyên ngữ có độ mở giữa ý gần gũi về không gian và tác động riêng trên Gia-cốp. Bản dịch chính không biến một hàm ý cảm xúc có thể có thành nghĩa duy nhất; chú thích nêu rõ khả năng khác.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại; dùng cách xưng “ta” phù hợp lời của vị tổ phụ với con mình. Phiên âm địa danh theo lối quen thuộc trong Kinh Thánh tiếng Việt, đồng thời giữ dạng Pha-đan đúng với nguyên văn câu này, không tự mở rộng thành Pha-đan A-ram.
