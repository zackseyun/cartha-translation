  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành phần chính của nguyên văn: sự hồi tưởng có tính đối chiếu của Gia-cốp, Pha-đan (không tự mở rộng thành Pha-đan A-ram), cái chết của Ra-chên trong xứ Ca-na-an khi đang đi đường, quãng đường còn lại đến Ép-ra-ta, việc chôn cất tại đó, và chú giải Ép-ra-ta là Bết-lê-hem. “Trở về” phù hợp với ngữ cảnh hành trình của Gia-cốp và không làm thay đổi ý nghĩa cốt lõi của “từ Pha-đan đến.” Cách dịch “qua đời bên ta” không áp đặt riêng nghĩa cảm xúc; chú thích nêu đúng tính mơ hồ của עָלַי.'
