source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: vi
  text: 'Israel nói với Giô-sép: “Ta không ngờ sẽ được thấy mặt con[a]; này, Đức Chúa Trời còn cho ta thấy cả dòng dõi của con nữa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ dịch sát là “thấy mặt con”, nghĩa là được trực tiếp gặp con.
    reason: Giải thích thành ngữ Hê-bơ-rơ trong khi giữ hình ảnh nguyên văn ở chính văn.
lexical_decisions:
- source_word: וַיֹּאמֶר יִשְׂרָאֵל
  choice: Israel nói
  rationale: Giữ đúng tên Israel được bản Hê-bơ-rơ dùng và diễn đạt tự nhiên bước tiếp diễn của lời kể; tiếng Việt không cần dịch máy móc liên từ וַ־.
- source_word: רְאֹה פָנֶיךָ
  choice: được thấy mặt con
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ ‘thấy mặt’, đồng thời dùng đại từ cha–con tự nhiên trong lời Israel nói với Giô-sép.
- source_word: לֹא פִלָּלְתִּי
  choice: Ta không ngờ
  rationale: Trong ngữ cảnh này, động từ diễn tả điều không dự liệu hay mong đợi, không phải hành động cầu nguyện; ‘không ngờ’ truyền đạt tự nhiên sắc thái kinh ngạc.
- source_word: וְהִנֵּה
  choice: thế mà nay
  rationale: Diễn đạt bước ngoặt đầy ngạc nhiên và nhấn mạnh của הִנֵּה bằng tiếng Việt hiện đại, tránh lối dịch quá cổ ‘kìa’ trong câu hồi tưởng này.
- source_word: הֶרְאָה אֹתִי
  choice: cho ta thấy
  rationale: 'Phản ánh thể khiến của ראה: Đức Chúa Trời khiến hoặc ban cho Israel được thấy.'
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi tiêu chuẩn, trang trọng và dễ hiểu trong tiếng Việt cho danh xưng thần linh אֱלֹהִים, không đồng nhất với danh riêng YHWH.
- source_word: גַּם
  choice: còn ... cả ... nữa
  rationale: 'Cấu trúc tiếng Việt này thể hiện sự gia tăng đầy bất ngờ: không chỉ thấy Giô-sép mà còn thấy dòng dõi của ông.'
- source_word: זַרְעֶךָ
  choice: dòng dõi của con
  rationale: Giữ nghĩa tập hợp của זֶרַע và không thu hẹp từ này thành riêng ‘các con’, dù trong bối cảnh trực tiếp đang nói đến hai người con của Giô-sép.
theological_decisions:
- issue: Chủ thể của phước lành quan phòng
  choice: Đức Chúa Trời còn cho ta thấy
  alternative: Đức Chúa Trời đã tỏ cho ta thấy
  rationale: Giữ quan hệ khiến của động từ và quy việc Israel được gặp Giô-sép cùng dòng dõi ông cho hành động của Đức Chúa Trời, nhưng không thêm một diễn giải thần học ngoài câu gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tình cảm. Đại từ “ta–con” phù hợp lời người cha cao tuổi nói với con trai trong bối cảnh gia trưởng, không làm thay đổi nội dung mệnh đề.
