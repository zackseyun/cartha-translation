  to: 'Israel nói với Giô-sép: “Ta không ngờ sẽ được thấy mặt con[a]; này, Đức Chúa Trời còn cho ta thấy cả dòng dõi của con nữa.”'
  rationale: Bản sửa thay cách diễn đạt có thêm sắc thái “nay” bằng “này” để phản ánh וְהִנֵּה, và làm rõ ý “không mong đợi” của לֹא פִלָּלְתִּי. Các lựa chọn từ ngữ chính, tên riêng, thuật ngữ về Đức Chúa Trời, và chú thích thành ngữ được giữ lại.
