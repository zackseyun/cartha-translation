- from: 'Giô-sép thưa với cha mình: “Thưa cha, không phải như vậy đâu, vì đứa này mới là con trưởng. Xin cha đặt tay phải lên đầu nó.”'
  to: 'Giô-sép nói với cha mình: “Không phải thế, thưa cha, vì người này là con trưởng. Xin cha đặt tay phải lên đầu người ấy.”'
