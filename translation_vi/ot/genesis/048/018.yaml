base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: vi
  text: 'Giô-sép nói với cha mình: “Không phải thế, thưa cha, vì người này là con trưởng. Xin cha đặt tay phải lên đầu người ấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: thưa
  rationale: Động từ nói đi kèm lời xưng hô với cha; “thưa” vừa tự nhiên trong tiếng Việt vừa thể hiện thái độ kính trọng của Giô-sép, còn mạch kể tiếp diễn không cần chuyển waw thành một liên từ riêng.
- source_word: אֶל אָבִיו
  choice: với cha mình
  rationale: Diễn đạt rõ hướng của lời nói và quy chiếu đại từ về Giô-sép bằng tiếng Việt tự nhiên.
- source_word: לֹא כֵן
  choice: không phải như vậy đâu
  rationale: Thành ngữ này là lời đính chính hoặc phản đối. Cách dịch giữ được tính trực tiếp nhưng không quá cộc lốc trong lời con nói với cha.
- source_word: אָבִי
  choice: Thưa cha
  rationale: Thể hiện hậu tố ngôi thứ nhất trong lối xưng hô tự nhiên của tiếng Việt; từ “thưa” giữ sắc thái kính trọng.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do Giô-sép đính chính việc đặt tay.
- source_word: זֶה
  choice: đứa này
  rationale: Giữ sức chỉ định trực tiếp của đại từ trong bối cảnh Giô-sép đang chỉ vào một trong hai người con; “đứa” phù hợp với người cha nói về con mình mà không mang ý khinh miệt trong ngữ cảnh này.
- source_word: הַבְּכֹר
  choice: con trưởng
  rationale: Trong tiếng Việt hiện đại, “con trưởng” diễn đạt tự nhiên địa vị người con sinh trước trong gia đình và phù hợp với bối cảnh quyền chúc phước, hơn cách nói nặng tính từ Hán-Việt “trưởng nam”.
- source_word: שִׂים
  choice: Xin cha đặt
  rationale: Mệnh lệnh được chuyển thành lời yêu cầu kính trọng cho hợp quan hệ con–cha trong tiếng Việt, trong khi hành động được yêu cầu vẫn rõ ràng.
- source_word: יְמִינְךָ
  choice: tay phải
  rationale: Nêu rõ bàn tay phải, vốn có ý nghĩa trực tiếp trong hành động chúc phước ở ngữ cảnh này.
- source_word: עַל רֹאשׁוֹ
  choice: lên đầu nó
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho động tác đặt tay trên đầu; đại từ “nó” quy chiếu rõ về người con vừa được chỉ ra.
theological_decisions:
- issue: Thuật ngữ chỉ địa vị trong bối cảnh chúc phước
  choice: con trưởng
  alternative: con đầu lòng
  rationale: בְּכוֹר không chỉ nói đến tuổi tác mà còn chỉ địa vị gia đình gắn với quyền lợi và lời chúc phước. “Con trưởng” giữ được chiều kích địa vị này; “con đầu lòng” nhấn mạnh thứ tự sinh hơn và cũng có thể gợi riêng người con đầu tiên của người mẹ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Lời thoại dùng “thưa” và “xin cha” để thể hiện sự kính trọng theo lối nói tiếng Việt, nhưng vẫn giữ sự khẩn thiết trong lời Giô-sép đính chính cha mình.
