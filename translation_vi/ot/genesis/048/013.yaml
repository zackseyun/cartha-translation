  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: vi
  text: Giô-sép đem cả hai con mình đến—Ép-ra-im ở bên tay phải của ông, về phía tay trái của Y-sơ-ra-ên, còn Ma-na-se ở bên tay trái của ông, về phía tay phải của Y-sơ-ra-ên—rồi đưa hai con lại gần Y-sơ-ra-ên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: dẫn
  rationale: Trong ngữ cảnh Giô-sép sắp xếp và đưa hai con đến trước Y-sơ-ra-ên, “dẫn” tự nhiên hơn “cầm/lấy” mà vẫn diễn đạt hành động chủ động của động từ.
- source_word: אֶת־שְׁנֵיהֶם
  choice: cả hai con mình
  rationale: Đại từ chỉ Ép-ra-im và Ma-na-se; thêm “con mình” làm rõ đối tượng theo ngữ cảnh mà không thay đổi nghĩa.
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: về phía tay trái của Y-sơ-ra-ên / về phía tay phải của Y-sơ-ra-ên
  rationale: Giữ ý định hướng/vị trí tương ứng khi hai bên đối diện nhau; tránh hiểu cứng tiền tố מִן là chuyển động “từ” phía ấy.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: rồi đưa hai con lại gần Y-sơ-ra-ên
  rationale: Hiphil của נגש mang nghĩa khiến/đưa đến gần; nêu lại Y-sơ-ra-ên để đại từ tiếng Việt không mơ hồ.
