  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הִנְ/נִ֤י מַפְרְ/ךָ֙ וְ/הִרְבִּיתִ֔/ךָ וּ/נְתַתִּ֖י/ךָ לִ/קְהַ֣ל עַמִּ֑ים וְ/נָ֨תַתִּ֜י אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֲחֻזַּ֥ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: vi
  text: 'Ngài phán với cha: ‘Này, ta sẽ làm cho con sinh sôi nảy nở và trở nên đông đảo; ta sẽ khiến con thành một cộng đồng gồm nhiều dân tộc, và ta sẽ ban đất này cho dòng dõi con sau con làm cơ nghiệp đời đời.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Này, ta sẽ
  rationale: Giữ sắc thái giới thiệu và nhấn mạnh của הִנְנִי trong lời hứa, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: làm cho con sinh sôi nảy nở và trở nên đông đảo
  rationale: 'Phân biệt hai động từ: פָּרָה nói đến sinh sản, còn רָבָה nói đến gia tăng số lượng.'
- source_word: קְהַל עַמִּים
  choice: một cộng đồng gồm nhiều dân tộc
  rationale: קָהָל là cộng đồng hay hội chúng; עַמִּים ở số nhiều chỉ nhiều dân tộc. Cách dịch này rõ nghĩa mà không gán sắc thái giáo hội về sau.
- source_word: זַרְעֲךָ
  choice: dòng dõi con
  rationale: Trong ngữ cảnh lời hứa về đất, זֶרַע mang nghĩa tập thể là hậu duệ.
- source_word: אֲחֻזַּת עוֹלָם
  choice: cơ nghiệp đời đời
  rationale: אֲחֻזָּה là phần đất được nắm giữ như sản nghiệp; עוֹלָם chỉ thời gian lâu dài hoặc vĩnh viễn. Cụm truyền đạt trang trọng và sát ngữ cảnh.
theological_decisions:
- issue: Phạm vi thời gian của עוֹלָם
  choice: đời đời
  alternative: lâu dài / muôn đời
  rationale: Giữ cách diễn đạt mạnh và truyền thống của cụm Hê-bơ-rơ, không tự ý thu hẹp hay xác định cơ chế thực hiện lời hứa.
- issue: Tính tập thể của קְהַל עַמִּים
  choice: một cộng đồng gồm nhiều dân tộc
  alternative: một hội chúng các dân tộc
  rationale: Giữ ý nhiều dân tộc hợp thành một tập thể, nhưng tránh đưa vào thuật ngữ có thể bị hiểu theo cơ cấu tôn giáo chuyên biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài/ta/con/cha’ theo ngữ cảnh Gia-cốp thuật lại lời Đức Chúa Trời với Giô-sép; ‘cha’ làm rõ đại từ ngôi thứ nhất trong lời kể mà không thêm nội dung ngoài ngữ cảnh.
