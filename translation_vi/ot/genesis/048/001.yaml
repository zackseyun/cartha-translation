base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: vi
  text: 'Sau những việc ấy, có người nói với Giô-sép[a]: “Này, cha ông đang ốm.” Giô-sép liền đem theo hai con trai mình là Ma-na-se và Ép-ra-im.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng động từ ngôi thứ ba số ít: “và người đó nói với Giô-sép”, nhưng không nêu rõ người nói là ai; vì vậy bản dịch dùng “có người” để giữ tính không xác định này.'
    reason: Giải thích chủ thể không được nêu rõ trong nguyên văn.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Sau những việc ấy
  rationale: Diễn đạt tự nhiên bước chuyển tiếp trong lời kể, đồng thời giữ mối liên hệ rộng và không quá xác định của הַדְּבָרִים với phần trước.
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: có người nói với Giô-sép
  rationale: Động từ ở ngôi thứ ba số ít nhưng chủ thể không được nêu tên. “Có người” giữ tính bất định ấy mà không tự ý xác định người báo tin.
- source_word: הִנֵּה
  choice: Này
  rationale: Tiểu từ này thu hút sự chú ý của người nghe; “Này” ngắn gọn, trực tiếp và phù hợp với tiếng Việt hiện đại.
- source_word: אָבִיךָ חֹלֶה
  choice: cha ông đang bị bệnh
  rationale: Giữ nghĩa tình trạng hiện tại của phân từ חֹלֶה; đại từ “ông” phù hợp với lời nói trang trọng dành cho một người đàn ông trưởng thành.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: Giô-sép liền dẫn theo hai con trai mình
  rationale: “Liền” thể hiện diễn tiến kế tiếp của mạch kể; “dẫn theo” truyền đạt tự nhiên ý ông đưa hai con đi cùng mình.
- source_word: מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Ma-na-se và Ép-ra-im
  rationale: Dùng dạng phiên âm quen thuộc, rõ ràng trong tiếng Việt cho hai tên riêng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Bản dịch tránh lối cổ “xảy ra rằng”, giữ nguyên tính không xác định của người báo tin và dùng các dạng tên riêng quen thuộc trong tiếng Việt.
