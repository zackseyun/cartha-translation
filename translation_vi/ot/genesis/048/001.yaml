  rationale: Chỉnh rất nhẹ để tiếng Việt tự nhiên hơn và để chú thích mô tả chính xác hơn hình thức ngữ pháp Hê-bơ-rơ. Nội dung, mức độ xác định của người báo tin, trình tự tường thuật, và các tên riêng đều được giữ nguyên.
