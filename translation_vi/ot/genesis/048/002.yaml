base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: vi
  text: 'Có người báo cho Gia-cốp rằng: “Kìa, con trai ông là Giô-sép đã đến với ông.” Y-sơ-ra-ên liền gượng sức và ngồi dậy trên giường.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: Có người báo cho Gia-cốp rằng
  rationale: Hai động từ “báo” và “nói” cùng dẫn vào một lời thông báo, trong khi chủ thể không được nêu. Cách diễn đạt này giữ ý có người báo tin và dùng “rằng” để đưa vào lời nói trực tiếp một cách tự nhiên trong tiếng Việt.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Tiểu từ này thu hút sự chú ý vào tin vừa được báo; “Kìa” trang trọng, tự nhiên và giữ được sắc thái chỉ xuất.
- source_word: בִּנְךָ יוֹסֵף
  choice: con trai ông là Giô-sép
  rationale: Diễn đạt rõ quan hệ sở hữu và phần đồng vị trong tiếng Việt hiện đại.
- source_word: בָּא אֵלֶיךָ
  choice: đã đến với ông
  rationale: Dạng qatal chỉ hành động đã xảy ra và có kết quả hiện tại; “đã đến với ông” giữ sát hướng chuyển động trong nguyên văn mà không tự ý thêm mục đích chuyến thăm.
- source_word: וַיִּתְחַזֵּק
  choice: gượng sức
  rationale: Dạng Hitpael của חזק diễn tả việc tự làm mình mạnh lên. Trong bối cảnh Gia-cốp đang đau yếu, “gượng sức” tự nhiên hơn cách dịch máy móc “tự làm mình mạnh lên” và không biến ý này thành thuần túy can đảm tinh thần.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Giữ nguyên sự chuyển đổi có chủ ý từ tên Gia-cốp sang Y-sơ-ra-ên trong cùng câu.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: ngồi dậy trên giường
  rationale: Động từ cơ bản nghĩa là “ngồi”; trong bối cảnh một người bệnh đang nằm, “ngồi dậy” diễn đạt tự nhiên chuyển động được hàm ý, còn “trên giường” phản ánh עַל הַמִּטָּה.
theological_decisions:
- issue: Sự luân phiên giữa hai tên Gia-cốp và Y-sơ-ra-ên
  choice: Giữ nguyên cả hai tên theo đúng vị trí trong tiếng Hê-bơ-rơ
  alternative: Dùng Gia-cốp xuyên suốt để câu văn đồng nhất
  rationale: Sự đổi tên có thể mang ý nghĩa văn chương hoặc thần học; bản dịch không nên san bằng nét này hay áp đặt một cách giải thích cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Có người báo” thể hiện chủ thể bất định; “gượng sức” phù hợp tình trạng đau yếu; tên riêng dùng dạng Việt hóa quen thuộc.
