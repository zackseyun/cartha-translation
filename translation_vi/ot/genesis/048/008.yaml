  text: וַ/יַּ֥רְא יִשְׂרָאֵ֖ל אֶת בְּנֵ֣י יוֹסֵ֑ף וַ/יֹּ֖אמֶר מִי אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/008.yaml
  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: vi
  text: 'Khi Y-sơ-ra-ên thấy các con trai của Giô-sép, ông nói[b]: “Những người này là ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Bản văn gọi ông là “Y-sơ-ra-ên,” tên giao ước của Gia-cốp.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: Khi ... thấy
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; cấu trúc “Khi ... thấy” diễn đạt tự nhiên quan hệ thời gian dẫn vào lời nói kế tiếp.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Giữ đúng tên được bản Hê-bơ-rơ dùng tại đây, thay vì đổi thành Gia-cốp.
- source_word: אֶת
  choice: không dịch riêng
  rationale: Đây là dấu chỉ trực tiếp túc từ trong tiếng Hê-bơ-rơ, không có từ tương ứng độc lập trong tiếng Việt.
- source_word: בְּנֵי יוֹסֵף
  choice: các con trai của Giô-sép
  rationale: Cụm liên kết có nghĩa đen là “các con trai của Giô-sép”; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: וַיֹּאמֶר
  choice: ông hỏi
  rationale: Động từ có nghĩa cơ bản là “nói”, nhưng vì lời trực tiếp là một câu hỏi nên “ông hỏi” tự nhiên trong tiếng Việt và giữ đúng chức năng giao tiếp của câu.
- source_word: מִי אֵלֶּה
  choice: Những người này là ai?
  rationale: מִי hỏi về danh tính và אֵלֶּה là đại từ chỉ định số nhiều; trật tự này tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Tên của vị tổ phụ
  choice: Y-sơ-ra-ên
  alternative: Gia-cốp
  rationale: Không đồng nhất hóa hai tên trong bản dịch; giữ tên giao ước mà văn bản nguồn chủ ý dùng ở câu này.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” để chỉ Y-sơ-ra-ên và “những người này” cho câu hỏi về danh tính của hai người đang hiện diện. Tất cả ký hiệu chú thích đều xuất hiện trong chính văn.
