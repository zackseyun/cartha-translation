    issue: Đại từ “nó” được lặp lại để chỉ hai người con trai.
    rationale: Trong văn phong Kinh Thánh tiếng Việt hiện đại, “nó” ở đây dễ mang sắc thái hạ thấp hoặc khẩu ngữ. Nguyên ngữ chỉ dùng đại từ giống đực và không mang sắc thái này. Dùng “người anh ấy,” “người em,” và “người anh” vừa tự nhiên vừa làm rõ quan hệ đối chiếu.
