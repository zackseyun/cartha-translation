  text: וַ/יְמָאֵ֣ן אָבִ֗י/ו וַ/יֹּ֨אמֶר֙ יָדַ֤עְתִּֽי בְנִ/י֙ יָדַ֔עְתִּי גַּם ה֥וּא יִֽהְיֶה לְּ/עָ֖ם וְ/גַם ה֣וּא יִגְדָּ֑ל וְ/אוּלָ֗ם אָחִ֤י/ו הַ/קָּטֹן֙ יִגְדַּ֣ל מִמֶּ֔/נּוּ וְ/זַרְע֖/וֹ יִהְיֶ֥ה מְלֹֽא הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: vi
  text: 'Nhưng cha ông không chịu và nói: “Cha biết, con ạ, cha biết. Người anh ấy cũng sẽ trở thành một dân, và cũng sẽ lớn mạnh. Tuy nhiên, người em sẽ lớn mạnh hơn người anh, và dòng dõi người em sẽ trở thành sự đầy trọn của các dân tộc[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “một đoàn dân tộc đông đảo.” Tiếng Hê-bơ-rơ sát nghĩa hơn là “sự đầy trọn của các dân tộc.”
    reason: Nêu cách hiểu thành ngữ theo số lượng nhưng vẫn cho biết hình thức sát nguyên ngữ của cụm từ khó xác định này.
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: không chịu
  rationale: Động từ מאן diễn tả sự khước từ có chủ ý; “không chịu” tự nhiên trong tiếng Việt và phù hợp với việc Gia-cốp bác bỏ ý định đổi tay của Giô-sép.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: Cha biết, con ạ, cha biết
  rationale: Giữ nguyên phép lặp nhấn mạnh. Cặp xưng hô “cha—con” tự nhiên hơn “ta—con” trong lời người cha nói trực tiếp với con trai.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: Nó cũng sẽ trở thành một dân
  rationale: Giữ nghĩa tập thể cơ bản của עָם là “dân”, không đồng nhất từ này với גּוֹיִם ở cuối câu.
- source_word: וְגַם הוּא יִגְדָּל
  choice: và nó cũng sẽ lớn mạnh
  rationale: “Lớn mạnh” diễn đạt sự gia tăng về quy mô và vị thế, đồng thời giữ sắc thái phát triển của động từ גדל.
- source_word: וְאוּלָם
  choice: Tuy nhiên
  rationale: Thể hiện rõ sự tương phản mạnh giữa tương lai của Ma-na-se và địa vị nổi trội hơn của Ép-ra-im.
- source_word: אָחִיו הַקָּטֹן
  choice: em trai nó
  rationale: Trong ngữ cảnh thứ tự sinh, הַקָּטֹן chỉ người em, không phải vóc dáng nhỏ hơn.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: sẽ lớn mạnh hơn nó
  rationale: Giữ phép so sánh của מן và dùng nhất quán “lớn mạnh” cho hai lần xuất hiện của גדל.
- source_word: וְזַרְעוֹ
  choice: và dòng dõi người em
  rationale: “Dòng dõi” diễn đạt tự nhiên nghĩa tập thể của זֶרַע. Nêu rõ “người em” để tránh sự mơ hồ không chủ ý do chuỗi đại từ tiếng Việt.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: sẽ trở thành sự đầy trọn của các dân tộc
  rationale: Giữ danh từ מְלֹא với nghĩa “sự đầy trọn” và sắc thái khó xác định của cụm Hê-bơ-rơ, thay vì âm thầm thu hẹp thành ý chỉ số lượng đông đảo.
theological_decisions:
- issue: Cách dịch מְלֹא הַגּוֹיִם
  choice: sự đầy trọn của các dân tộc
  alternative: một đoàn dân tộc đông đảo
  rationale: Cách dịch chính giữ hình ảnh “đầy trọn” của nguyên ngữ và không giải quyết thay độc giả những âm vang thần học hoặc liên văn bản có thể có. Cách hiểu theo số lượng được ghi ở chú thích như một khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “cha—con” phù hợp quan hệ gia đình; “nó” được dùng cho hai người con trai đang được nói đến, còn “người em” làm rõ tiền ngữ của “dòng dõi” mà không thay đổi nội dung.
