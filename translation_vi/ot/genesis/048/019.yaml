revisions:
- from: 'Nhưng cha ông không chịu và nói: “Cha biết, con ạ, cha biết. Nó cũng sẽ trở thành một dân, và nó cũng sẽ lớn mạnh. Tuy nhiên, em trai nó sẽ lớn mạnh hơn nó, và dòng dõi người em sẽ trở thành sự đầy trọn của các dân tộc[a].”'
  to: 'Nhưng cha ông không chịu và nói: “Cha biết, con ạ, cha biết. Người anh ấy cũng sẽ trở thành một dân, và cũng sẽ lớn mạnh. Tuy nhiên, người em sẽ lớn mạnh hơn người anh, và dòng dõi người em sẽ trở thành sự đầy trọn của các dân tộc[a].”'
  rationale: 'Sửa duy nhất ở cấp diễn đạt: thay chuỗi “nó” bằng các danh ngữ chỉ quan hệ anh em. Điều này tránh sắc thái không phù hợp trong tiếng Việt hiện đại, làm sáng rõ các tiền ngữ, và không thêm hay thay đổi bất cứ khẳng định nào của tiếng Hê-bơ-rơ. Cụm “sự đầy trọn của các dân tộc” và chú thích được giữ nguyên để bảo toàn tính mơ hồ của nguyên ngữ.'
