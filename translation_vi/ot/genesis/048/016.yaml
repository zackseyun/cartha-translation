base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: vi
  text: Vị thiên sứ đã cứu chuộc tôi khỏi mọi điều dữ[a], nguyện vị ấy ban phước cho hai cậu bé. Nguyện chúng được gọi bằng danh tôi và danh các tổ phụ tôi là Áp-ra-ham và Y-sác[b]; nguyện chúng sinh sôi nảy nở thật nhiều[c] giữa xứ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi mọi tai họa” hoặc “khỏi mọi hoạn nạn.” Từ Hê-bơ-rơ ở đây có thể chỉ điều ác, tai họa hoặc tổn hại.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn sát chữ: “nguyện danh tôi và danh các tổ phụ tôi là Áp-ra-ham và Y-sác được gọi trên chúng.” Đây là thành ngữ chỉ việc mang hoặc được gọi theo danh ấy.'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “nguyện chúng gia tăng thành một đoàn đông đảo.” Động từ Hê-bơ-rơ hiếm gặp này gợi sự sinh sôi dồi dào, có thể mang hình ảnh cá sinh sản rất nhiều.'
    reason: lexical_alternative
  - marker: d
    text: 'Hay: “giữa đất.” Từ Hê-bơ-rơ có thể chỉ một xứ sở hoặc toàn thể đất, tùy theo ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: vị thiên sứ
  rationale: מַלְאָךְ có thể là “sứ giả” hoặc “thiên sứ”; trong ngữ cảnh lời chúc phước của Gia-cốp, “thiên sứ” là cách diễn đạt tự nhiên, đồng thời không xác định thêm căn tính của vị này.
- source_word: הַגֹּאֵל אֹתִי
  choice: đã cứu chuộc tôi
  rationale: Phân từ גאל chỉ người cứu chuộc hoặc giải cứu. “Đã cứu chuộc tôi” giữ sắc thái cứu chuộc và phù hợp với việc Gia-cốp nhìn lại cả cuộc đời mình.
- source_word: מִכָּל רָע
  choice: khỏi mọi điều dữ
  rationale: רָע có thể bao gồm điều ác về đạo đức lẫn tai họa, tổn hại. Cách dịch này giữ độ rộng nghĩa của tiếng Hê-bơ-rơ.
- source_word: יְבָרֵךְ
  choice: nguyện vị ấy ban phước
  rationale: Dạng yiqtol mang lực cầu chúc trong ngữ cảnh này; “nguyện” truyền đạt rõ sắc thái ước nguyện.
- source_word: הַנְּעָרִים
  choice: hai đứa trẻ này
  rationale: Danh từ có số nhiều xác định, chỉ Ép-ra-im và Ma-na-se. Thêm “hai” và “này” theo ngữ cảnh giúp câu tiếng Việt rõ và tự nhiên mà không thay đổi đối tượng quy chiếu.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: nguyện danh tôi cùng danh các tổ phụ tôi… được gọi trên chúng
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ “danh được gọi trên” và để một động từ chi phối chủ ngữ kép như nguyên văn.
- source_word: וְיִדְגּוּ לָרֹב
  choice: nguyện chúng sinh sôi nảy nở thật nhiều
  rationale: Động từ hiếm דגה gợi sự gia tăng dồi dào, có thể liên tưởng đến cá. Cách dịch này truyền đạt sự sinh sôi đông đúc mà không đưa hình ảnh khó hiểu vào chính văn.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: giữa xứ
  rationale: אֶרֶץ có thể là “xứ/đất” hoặc “đất, thế gian.” Trong bối cảnh lời hứa dành cho các tổ phụ, “xứ” phù hợp, nhưng nghĩa rộng hơn được giữ trong chú thích.
theological_decisions:
- issue: Căn tính của “vị thiên sứ” trong lời chúc phước
  choice: Giữ nguyên “vị thiên sứ” mà không xác định đó là Đức Chúa Trời hiện ra hay một thọ tạo làm sứ giả.
  alternative: Hiểu vị thiên sứ là sự hiện ra của Đức Chúa Trời; hoặc là một thiên sứ thọ tạo đại diện cho Ngài.
  rationale: Câu này liên kết rất chặt Đức Chúa Trời với vị thiên sứ trong lời cầu chúc, nhưng nguyên văn không minh định bản thể của vị ấy. Bản dịch vì thế giữ nguyên sự căng thẳng thần học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “vị ấy” để tránh lặp “vị thiên sứ”; dùng “ban phước” theo lối diễn đạt Kinh Thánh quen thuộc. Cấu trúc “được gọi trên chúng” hơi lạ trong tiếng Việt nhưng được giữ có chủ ý nhằm bảo tồn hình ảnh và tính mơ hồ của thành ngữ Hê-bơ-rơ, kèm chú thích giải nghĩa.
