base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: vi
  text: 'Giô-sép thưa với cha mình: “Đây là các con trai của con mà Đức Chúa Trời đã ban cho con ở đây.[a]” Cha ông nói: “Xin đưa chúng lại gần cha, để cha chúc phước cho chúng.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại nơi này.” Cụm từ Hê-bơ-rơ có thể chỉ cụ thể hơn đến địa điểm Giô-sép đang ở.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Xin đưa chúng đến với cha, và cha sẽ chúc phước cho chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אָבִיו
  choice: Giô-sép thưa với cha mình
  rationale: “Thưa” diễn đạt tự nhiên lời của người con nói với cha trong tiếng Việt, đồng thời vẫn giữ sắc thái trang trọng của lời thuật.
- source_word: בָּנַי הֵם
  choice: Chúng là các con trai của con
  rationale: Giữ cấu trúc nhận diện của tiếng Hê-bơ-rơ và nghĩa giống đực số nhiều cụ thể của בָּנַי; đại từ “con” phù hợp khi Giô-sép nói với cha.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: những đứa Đức Chúa Trời đã ban cho con
  rationale: “Ban cho” thể hiện các con là quà tặng từ Đức Chúa Trời; “những đứa” quy chiếu tự nhiên về các con trai trong tiếng Việt.
- source_word: בָּזֶה
  choice: ở đây
  rationale: Cách dịch ngắn gọn, tự nhiên, giữ lực chỉ định về nơi hoặc hoàn cảnh hiện tại; nghĩa cụ thể hơn “tại nơi này” được ghi ở chú thích.
- source_word: קָחֶם־נָא אֵלַי
  choice: Xin đưa chúng lại gần cha
  rationale: Trong ngữ cảnh Gia-cốp muốn các cháu được đưa đến gần để chúc phước, “đưa… lại gần” truyền đạt đúng hướng chuyển động; “xin” thể hiện tiểu từ lịch sự נָא.
- source_word: וַאֲבָרֲכֵם
  choice: để cha chúc phước cho chúng
  rationale: Diễn đạt tự nhiên mục đích của lời yêu cầu trong tiếng Việt, trong khi cách hiểu phối hợp “và cha sẽ…” vẫn được bảo lưu ở chú thích.
theological_decisions:
- issue: Đối tượng được gọi là אֱלֹהִים trong lời Giô-sép
  choice: Đức Chúa Trời, Đấng ban các con trai cho Giô-sép
  alternative: một thần hoặc các thần
  rationale: Ngữ cảnh truyện các tổ phụ cho thấy danh từ này chỉ Đức Chúa Trời mà Giô-sép thờ phượng; cách dịch không thêm một khẳng định giáo phái nào ngoài ý nghĩa theo ngữ cảnh.
- issue: Sắc thái của lời chúc phước וַאֲבָרֲכֵם
  choice: 'Mệnh đề chỉ mục đích: “để cha chúc phước cho chúng”'
  alternative: 'Mệnh đề nối tiếp: “và cha sẽ chúc phước cho chúng”'
  rationale: Sau lời yêu cầu đưa các cháu lại gần, động từ diễn đạt hành động Gia-cốp muốn thực hiện; cả sắc thái mục đích và nối tiếp đều khả hữu, nên phương án kia được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ thân tộc “con/cha” được dùng trong lời thoại để phản ánh quan hệ Giô-sép–Gia-cốp một cách tự nhiên trong tiếng Việt; phần lời dẫn dùng “cha mình” để tránh khẩu ngữ quá mức.
