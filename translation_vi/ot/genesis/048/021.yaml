  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: vi
  text: 'Rồi Y-sơ-ra-ên nói với Giô-sép: “Này, ta sắp chết, nhưng Đức Chúa Trời sẽ ở cùng các con[a] và sẽ đưa các con trở về đất của tổ phụ các con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Các từ “các con” trong câu này ở dạng số nhiều trong tiếng Hê-bơ-rơ, nên lời hứa không chỉ hướng đến riêng Giô-sép mà còn bao gồm gia đình hoặc hậu duệ của ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Waw liên tiếp đẩy câu chuyện tiến tới; “Rồi” diễn đạt tự nhiên trình tự kể chuyện trong tiếng Việt.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Giữ đúng tên giao ước được bản Hê-bơ-rơ dùng, không đổi thành Gia-cốp.
- source_word: הִנֵּה
  choice: Này
  rationale: Là từ hướng sự chú ý đến lời sắp nói; “Này” trang trọng, tự nhiên và không cổ kính quá mức.
- source_word: אָנֹכִי מֵת
  choice: cha sắp qua đời
  rationale: Phân từ của מוּת trong ngữ cảnh chỉ cái chết cận kề. Đại từ “cha” tự nhiên trong lời người cha nói với con; “qua đời” giữ giọng trang nghiêm.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: nhưng Đức Chúa Trời sẽ ở cùng các con
  rationale: Waw về hình thức là liên từ “và”, nhưng trong ngữ cảnh mang sắc thái tương phản giữa việc Y-sơ-ra-ên sắp chết và sự hiện diện tiếp tục của Đức Chúa Trời.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi tiêu chuẩn, trang trọng và phổ thông trong tiếng Việt đối với Đức Chúa Trời duy nhất của Y-sơ-ra-ên ở đây.
- source_word: עִמָּכֶם
  choice: ở cùng các con
  rationale: Hậu tố ngôi thứ hai số nhiều được biểu đạt rõ bằng “các con”, mở rộng lời hứa vượt quá riêng Giô-sép.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: sẽ đưa các con trở về
  rationale: Thể Hiphil của שוב mang nghĩa khiến trở lại; “đưa ... trở về” giữ rõ ý nguyên nhân và tự nhiên trong tiếng Việt.
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: về đất của tổ phụ các con
  rationale: Giữ hình ảnh vùng đất thuộc về các tổ phụ, đồng thời diễn đạt tự nhiên và sát nghĩa trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của các đại từ số nhiều trong lời hứa
  choice: Dùng “các con” để giữ rõ số nhiều, chỉ Giô-sép cùng gia đình hoặc hậu duệ của ông.
  alternative: Dùng “con” như thể lời hứa chỉ dành cho riêng Giô-sép.
  rationale: Các hậu tố Hê-bơ-rơ trong cả “ở cùng” và “đưa ... trở về” đều là số nhiều; giữ số nhiều bảo toàn phạm vi giao ước mà không xác định hẹp hơn điều bản văn nói.
- issue: Sắc thái của waw trước mệnh đề Đức Chúa Trời ở cùng họ
  choice: Dịch là “nhưng”.
  alternative: Dịch theo liên từ đơn thuần là “và”.
  rationale: Bản văn đối chiếu cái chết sắp đến của Y-sơ-ra-ên với sự hiện diện tiếp tục của Đức Chúa Trời; “nhưng” làm rõ quan hệ diễn ngôn tự nhiên trong tiếng Việt mà không thêm nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng lối xưng hô cha–con phù hợp quan hệ giữa Y-sơ-ra-ên và Giô-sép; “các con” đồng thời thể hiện rõ số nhiều của nguyên văn. Giữ tên Y-sơ-ra-ên theo bản nguồn.
