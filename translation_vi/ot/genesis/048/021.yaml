    rationale: Nguyên văn chỉ nói “tôi/ta sắp chết.” Dù quan hệ cha–con là rõ trong văn cảnh rộng hơn, bản dịch nên tránh gia tăng chi tiết trong câu khi không cần thiết; “Ta sắp chết” giữ giọng trang trọng và sát nghĩa hơn.
