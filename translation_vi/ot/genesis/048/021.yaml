  source_fidelity: Bản dịch truyền đạt đúng trình tự tự sự, tên “Y-sơ-ra-ên,” tính sắp xảy ra của cái chết, sắc thái tương phản hợp lý của liên từ, và các hậu tố ngôi thứ hai số nhiều. Tuy nhiên, “cha sắp qua đời” thêm cách tự xưng quan hệ thân tộc và dùng lối nói uyển ngữ hơn cách diễn đạt trực tiếp của tiếng Hê-bơ-rơ. “Ta sắp chết” sát nguồn hơn, vẫn trang trọng và tự nhiên trong ngữ cảnh lời một tổ phụ nói với con cháu.
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng, và mạch lạc. “Ta ... các con” là lối xưng hô Việt ngữ phù hợp với ngữ cảnh, đồng thời giúp giữ số nhiều ở các đại từ sau mà không cần thêm diễn giải vào thân câu.
  terminology: “Đức Chúa Trời,” “Y-sơ-ra-ên,” “Giô-sép,” và “tổ phụ” nhất quán với văn phong Kinh Thánh tiếng Việt. “Ở cùng” và “đưa ... trở về” diễn đạt tốt sự hiện diện của Đức Chúa Trời và nghĩa khiến trở về của thể Hiphil.
