  text: וַ/יְבָ֥רֶךְ אֶת יוֹסֵ֖ף וַ/יֹּאמַ֑ר הָֽ/אֱלֹהִ֡ים אֲשֶׁר֩ הִתְהַלְּכ֨וּ אֲבֹתַ֤/י לְ/פָנָי/ו֙ אַבְרָהָ֣ם וְ/יִצְחָ֔ק הָֽ/אֱלֹהִים֙ הָ/רֹעֶ֣ה אֹתִ֔/י מֵ/עוֹדִ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: vi
  text: 'Ông chúc phước cho Giô-sép và nói: “Đức Chúa Trời, Đấng mà các tổ phụ tôi là Áp-ra-ham và Y-sác đã bước đi trước mặt Ngài[a], Đức Chúa Trời, Đấng đã chăn dắt tôi từ thuở đầu đời cho đến ngày nay[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã sống trong sự hiện diện của Ngài.” Thành ngữ Hê-bơ-rơ nói đến cách một người sống trước mặt Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Hay “suốt đời tôi.” Cụm từ Hê-bơ-rơ chỉ về giai đoạn rất sớm của đời Gia-cốp, nhấn mạnh rằng Đức Chúa Trời đã chăm sóc ông ngay từ đầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: Ông chúc phước cho Giô-sép
  rationale: Giữ nguyên đối tượng được nêu rõ trong tiếng Hê-bơ-rơ là Giô-sép, không điều hòa với việc hai con trai của ông được chúc phước trong văn cảnh.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, tự nhiên trong tiếng Việt, phù hợp với danh xưng xác định được lặp lại trong lời khẩn cầu.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: Đấng mà các tổ phụ tôi ... đã bước đi trước mặt Ngài
  rationale: Bảo tồn thành ngữ giao ước về việc sống cả cuộc đời trước sự hiện diện của Đức Chúa Trời, thay vì thu hẹp thành ý vâng phục hoặc đi theo.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Áp-ra-ham và Y-sác
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: הָרֹעֶה אֹתִי
  choice: Đấng đã chăn dắt tôi
  rationale: Giữ hình ảnh chủ động của người chăn chiên cùng sắc thái chăm sóc, dẫn dắt và nuôi dưỡng liên tục.
- source_word: מֵעוֹדִי
  choice: từ thuở tôi hiện hữu
  rationale: Diễn đạt điểm khởi đầu của đời sống hay sự hiện hữu mà không giới hạn cụ thể vào tuổi trẻ hoặc chính biến cố sinh ra.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: cho đến ngày nay
  rationale: Thành ngữ tiếng Việt tự nhiên, thể hiện sự chăm sóc liên tục từ khởi đầu đời Gia-cốp đến hiện tại.
theological_decisions:
- issue: Thành ngữ các tổ phụ bước đi trước mặt Đức Chúa Trời
  choice: đã bước đi trước mặt Ngài
  alternative: đã sống trong sự hiện diện của Ngài; đã theo Ngài
  rationale: Giữ nguyên ẩn dụ mang tính quan hệ và giao ước, không diễn giải hẹp thành sự vâng phục đơn thuần.
- issue: Ẩn dụ Đức Chúa Trời chăn dắt
  choice: Đấng đã chăn dắt tôi
  alternative: Đấng là Đấng Chăn Giữ tôi; Đấng đã nuôi dưỡng tôi
  rationale: Bảo tồn hình ảnh người chăn chiên và lực chủ động của phân từ Hê-bơ-rơ, đồng thời diễn đạt sự chăm sóc kéo dài đến hiện tại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lời chúc phước còn tiếp diễn sang câu kế tiếp, giữ thành ngữ “bước đi trước mặt” và ẩn dụ “chăn dắt”; các cách nói có thể khó hiểu được giải thích bằng chú thích.
