    rationale: וַיִּשְׁתַּחוּ chỉ hành động cúi mình phủ phục; לְאַפָּיו אָרְצָה bổ sung tư thế mặt hướng xuống đất. Đổi thành «cúi lạy, mặt xuống đất» giữ đủ hai thành tố và tránh sắc thái «ngã/sấp mặt» trong tiếng Việt hiện đại.
  - severity: low
    issue: Từ «chỗ» trong «ra khỏi chỗ giữa hai đầu gối» không cần thiết.
    rationale: Cụm «ra khỏi giữa hai đầu gối» trực tiếp hơn, vẫn giữ cách hiểu ngữ cảnh của מֵעִם בִּרְכָּיו và sự dè dặt được bảo lưu ở chú thích.
