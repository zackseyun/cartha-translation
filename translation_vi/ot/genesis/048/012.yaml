base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: vi
  text: Rồi Giô-sép đưa hai con ra khỏi giữa hai đầu gối của Gia-cốp[a], và cúi lạy, mặt xuống đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ra khỏi chỗ bên đầu gối của Gia-cốp.” Cụm từ Hê-bơ-rơ có thể mô tả vị trí hai cậu bé ở sát bên Gia-cốp trong cảnh chúc phước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: đưa ... ra
  rationale: Dạng Hiphil của יצא mang nghĩa khiến một người đi ra; “đưa ... ra” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái tác động của động từ.
- source_word: אֹתָם
  choice: hai con
  rationale: Đại từ tân ngữ số nhiều chỉ Ép-ra-im và Ma-na-se. Dùng “hai con” giúp câu tiếng Việt rõ nghĩa theo ngữ cảnh mà không thêm thông tin mới.
- source_word: מֵעִם בִּרְכָּיו
  choice: ra khỏi chỗ giữa hai đầu gối của Gia-cốp
  rationale: Cụm giới từ diễn tả vị trí rất gần Gia-cốp trong cảnh chúc phước. “Giữa hai đầu gối” là cách hiểu phù hợp với tư thế trong ngữ cảnh, còn khả năng “bên đầu gối” được giữ trong chú thích.
- source_word: וַיִּשְׁתַּחוּ
  choice: sấp mặt
  rationale: Động từ chỉ hành động cúi mình phủ phục để bày tỏ lòng tôn kính; kết hợp với “xuống đất” diễn đạt trọn tư thế một cách tự nhiên.
- source_word: לְאַפָּיו אָרְצָה
  choice: mặt xuống đất
  rationale: Cụm từ theo nghĩa đen hướng khuôn mặt về phía đất, bổ nghĩa cho động tác phủ phục.
theological_decisions:
- issue: Đối tượng được chỉ bởi hậu tố sở hữu trong “hai đầu gối của ông”
  choice: Gia-cốp
  alternative: Giô-sép
  rationale: Theo mạch văn, Giô-sép đang đưa hai con ra khỏi vị trí gần Gia-cốp sau khi Gia-cốp ôm và chuẩn bị chúc phước cho chúng. Nêu tên “Gia-cốp” giúp tránh đại từ sở hữu mơ hồ trong tiếng Việt; đây là quyết định theo ngữ cảnh, không phải quyết định giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sấp mặt xuống đất” diễn đạt tự nhiên cử chỉ tôn kính sâu sắc; tên riêng được dùng thay cho đại từ để tránh nhầm người sở hữu “hai đầu gối”.
