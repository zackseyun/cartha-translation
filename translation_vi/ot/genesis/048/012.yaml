  rationale: Bản sửa thay cụm có thể gây lệch sắc thái «sấp mặt xuống đất» bằng cách diễn đạt rõ cử chỉ phủ phục của Giô-sép, đồng thời rút gọn cụm chỉ vị trí. Chú thích tiếp tục bảo lưu khả năng hiểu «bên đầu gối», vì giới từ Hê-bơ-rơ không hoàn toàn loại trừ cách hiểu này.
