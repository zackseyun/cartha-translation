base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: vi
  text: 'Gia-cốp nói với Giô-sép: “Đức Chúa Trời Toàn Năng[a] đã hiện ra với cha tại Lu-xơ, trong xứ Ca-na-an, và ban phước cho cha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “El Shaddai.” Theo truyền thống, tước hiệu này được dịch là “Đức Chúa Trời Toàn Năng”; sắc thái chính xác của từ Shaddai vẫn còn được tranh luận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng kể chuyện nối tiếp đưa lời nói vào diễn tiến; tiếng Việt tự nhiên không cần dịch riêng liên từ וַ ở đây.
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc ‘nói với’, đây là cách diễn đạt tự nhiên của tiếng Việt hiện đại.
- source_word: אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  rationale: Dịch tước hiệu thần linh theo nghĩa truyền thống và quen thuộc; vì sắc thái chính xác của שַׁדַּי còn được tranh luận, dạng Hê-bơ-rơ được ghi trong chú thích.
- source_word: נִרְאָה אֵלַי
  choice: đã hiện ra với cha
  rationale: Niphal của ראה diễn tả sự hiện ra; ‘với cha’ vừa truyền đạt hướng đến người nói vừa phản ánh tự nhiên việc Gia-cốp xưng hô với con mình.
- source_word: בְּלוּז
  choice: tại Lu-xơ
  rationale: ‘Tại’ phù hợp với một địa điểm cụ thể nơi sự việc xảy ra.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: trong xứ Ca-na-an
  rationale: Giữ danh từ ‘xứ’ có mặt trong nguyên văn và dùng cách gọi địa lý trang trọng, quen thuộc.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: và ban phước cho cha
  rationale: Giữ hành động tiếp nối của cùng chủ thể thần linh; ‘ban phước’ là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch tước hiệu אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  alternative: Ên Sa-đai (El Shaddai)
  rationale: Bản chính dịch tước hiệu để người đọc hiểu được, nhưng chú thích giữ dạng Hê-bơ-rơ và thừa nhận rằng nghĩa chính xác của שַׁדַּי vẫn còn được tranh luận, tránh giải quyết quá mức sự bất định từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng lối xưng hô cha–con phù hợp với quan hệ giữa Gia-cốp và Giô-sép; không thêm nội dung thần học ngoài nguyên văn. Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
