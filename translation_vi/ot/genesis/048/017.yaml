base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: vi
  text: Khi Giô-sép thấy cha mình đã đặt tay phải lên đầu Ép-ra-im, ông không hài lòng[a], và ông nắm lấy tay cha mình để dời tay ấy khỏi đầu Ép-ra-im sang đầu Ma-na-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “điều ấy là xấu trong mắt ông,” một thành ngữ có nghĩa là điều ấy khiến ông không hài lòng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: Khi ... thấy
  rationale: Diễn đạt tự nhiên quan hệ thời gian và nội dung điều Giô-sép nhận thấy, đồng thời giữ mạch kể tiếp diễn của câu Hê-bơ-rơ.
- source_word: יָשִׁית
  choice: đã đặt
  rationale: Động từ có nghĩa là đặt hoặc để; thể hoàn thành trong tiếng Việt làm rõ rằng Giô-sép nhận thấy vị trí tay cha mình.
- source_word: יַד יְמִינוֹ
  choice: tay phải
  rationale: Cách nói tự nhiên trong tiếng Việt và giữ nguyên chi tiết quan trọng của cử chỉ ban phước.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: ông không hài lòng
  rationale: Truyền đạt tự nhiên phản ứng không vừa ý của Giô-sép mà không khiến người đọc hiểu nhầm rằng ông phán xét hành động ấy là điều ác; chú thích bảo lưu hình ảnh nguyên văn ‘xấu trong mắt ông’.
- source_word: וַיִּתְמֹךְ
  choice: nắm lấy
  rationale: Trong ngữ cảnh, תמך chỉ hành động Giô-sép giữ lấy tay cha để chuyển nó, nhưng không nhất thiết hàm ý dùng sức mạnh như ‘chộp’ hay ‘giật’.
- source_word: לְהָסִיר אֹתָהּ
  choice: để dời tay ấy
  rationale: הסיר có nghĩa là dời hoặc đưa khỏi; lặp lại ‘tay ấy’ giúp tiếng Việt rõ đại từ giống cái trong nguyên văn quy chiếu về bàn tay.
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: khỏi đầu Ép-ra-im sang đầu Ma-na-se
  rationale: Giữ rõ hướng chuyển động từ đầu người này sang đầu người kia bằng cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong Kinh Thánh tiếng Việt: Giô-sép, Ép-ra-im và Ma-na-se. Câu giữ cụ thể hành động đặt tay ban phước nhưng diễn đạt thành ngữ Hê-bơ-rơ theo lối tự nhiên, kèm chú thích để bảo lưu hình ảnh nguyên ngữ.'
