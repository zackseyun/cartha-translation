  text: וַ/יִּשְׁלַח֩ יִשְׂרָאֵ֨ל אֶת יְמִינ֜/וֹ וַ/יָּ֨שֶׁת עַל רֹ֤אשׁ אֶפְרַ֨יִם֙ וְ/ה֣וּא הַ/צָּעִ֔יר וְ/אֶת שְׂמֹאל֖/וֹ עַל רֹ֣אשׁ מְנַשֶּׁ֑ה שִׂכֵּל֙ אֶת יָדָ֔י/ו כִּ֥י מְנַשֶּׁ֖ה הַ/בְּכֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: vi
  text: Bấy giờ, Y-sơ-ra-ên đưa tay phải ra, đặt trên đầu Ép-ra-im, dù Ép-ra-im là em; còn tay trái ông đặt trên đầu Ma-na-se. Ông bắt chéo hai tay[a], vì Ma-na-se là con đầu lòng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “ông chủ ý điều khiển đôi tay mình.” Cụm từ Hê-bơ-rơ có thể nhấn mạnh việc sắp đặt đôi tay một cách có chủ ý và khéo léo; ngữ cảnh cho thấy ông đã bắt chéo tay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: đưa
  rationale: Trong ngữ cảnh cử chỉ đặt tay chúc phước, động từ chỉ việc đưa hoặc giơ tay ra; “đưa tay” tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיָּשֶׁת
  choice: đặt
  rationale: Diễn đạt trực tiếp hành động đặt bàn tay lên đầu.
- source_word: יְמִינוֹ / שְׂמֹאלוֹ
  choice: tay phải / tay trái
  rationale: Giữ rõ sự đối xứng và sự đảo ngược có chủ ý trong cử chỉ chúc phước.
- source_word: וְהוּא הַצָּעִיר
  choice: dù cậu là em
  rationale: 'Thể hiện sắc thái nhượng bộ do ngữ cảnh: Ép-ra-im nhận tay phải mặc dù là người nhỏ hơn; “là em” tự nhiên và phù hợp quan hệ giữa hai anh em.'
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: Ông bắt chéo hai tay
  rationale: Ngữ cảnh cho thấy tay phải được đặt trên Ép-ra-im và tay trái trên Ma-na-se, nên cách hiểu là bắt chéo tay có cơ sở mạnh; chú thích vẫn bảo lưu sắc thái cố ý, khéo léo của cụm Hê-bơ-rơ.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lời giải thích cho cách đặt tay khác thường.
- source_word: הַבְּכֹר
  choice: con đầu lòng
  rationale: Giữ ý nghĩa văn hóa và pháp lý của thứ tự sinh, vốn quan trọng trong bối cảnh ban phước.
theological_decisions:
- issue: Cách hiểu שִׂכֵּל אֶת יָדָיו
  choice: Gia-cốp cố ý bắt chéo hai tay khi chúc phước
  alternative: Gia-cốp khéo léo hoặc có chủ ý điều khiển hai tay, không nói rõ việc bắt chéo
  rationale: Vị trí của hai tay trong câu cho thấy chúng được bắt chéo để tay phải đặt trên người em. Bản dịch nêu hành động theo ngữ cảnh nhưng dùng chú thích để bảo lưu độ rộng nghĩa của cụm từ Hê-bơ-rơ, không suy diễn thêm ý nghĩa thần học.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dùng tên riêng theo lối phiên âm quen thuộc. “Cậu” làm rõ Ép-ra-im là người em mà không khiến câu nặng nề; “con đầu lòng” bảo tồn ý nghĩa của quyền trưởng nam.
