    issue: “đưa tay phải đặt” thiếu từ chỉ hướng/động tác sau “đưa tay ra”.
    rationale: וַיִּשְׁלַח diễn tả việc vươn hoặc đưa tay ra. Thêm “ra” làm câu tiếng Việt tự nhiên hơn và biểu đạt đầy đủ hơn cử chỉ này.
  - severity: low
