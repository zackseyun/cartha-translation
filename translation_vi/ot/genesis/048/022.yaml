  text: וַ/אֲנִ֞י נָתַ֧תִּֽי לְ/ךָ֛ שְׁכֶ֥ם אַחַ֖ד עַל אַחֶ֑י/ךָ אֲשֶׁ֤ר לָקַ֨חְתִּי֙ מִ/יַּ֣ד הָֽ/אֱמֹרִ֔י בְּ/חַרְבִּ֖/י וּ/בְ/קַשְׁתִּֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: vi
  text: Còn chính ta ban cho con một phần hơn các anh em con[a], phần mà ta đã lấy khỏi tay người A-mô-rít bằng gươm và cung của ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שְׁכֶם (shekhem) có thể mang nghĩa “vai”, “sườn đất” hoặc “phần”, đồng thời gợi đến địa danh Si-chem. Câu này có thể chủ ý nói đến cả phần gia nghiệp được thêm và vùng đất về sau gắn với Giô-sép.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Còn chính ta
  rationale: Đại từ độc lập אֲנִי nhấn mạnh chủ thể vốn đã hàm trong động từ; “chính ta” giữ được sắc thái nhấn mạnh, còn “còn” nối lời này với việc Gia-cốp vừa nói về các anh em của Giô-sép.
- source_word: נָתַתִּי
  choice: ban cho
  rationale: Dạng hoàn thành ở đây có thể mang lực ngôn trung của lời trao ban trong di ngôn. “Ban cho” tự nhiên, trang trọng và diễn tả hành vi trao phần thừa kế ngay trong lời nói.
- source_word: שְׁכֶם אַחַד
  choice: một phần
  rationale: Trong ngữ cảnh phân chia gia nghiệp, cụm này nhiều khả năng chỉ một phần được cấp thêm. Từ שְׁכֶם đồng thời có thể gợi nghĩa “vai/sườn đất” và địa danh Si-chem; các lớp nghĩa ấy được giữ trong chú thích thay vì ép vào câu chính một cách thiếu tự nhiên.
- source_word: עַל אַחֶיךָ
  choice: hơn các anh em con
  rationale: עַל ở đây biểu thị phần trội hơn hoặc được thêm vào. Cách dịch này nói rõ quan hệ so sánh mà không diễn giải quá mức.
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: phần mà ta đã lấy
  rationale: Giữ nghĩa trực tiếp của לקח và dùng “phần” làm từ nối để mệnh đề quan hệ rõ ràng trong tiếng Việt.
- source_word: מִיַּד הָאֱמֹרִי
  choice: khỏi tay người A-mô-rít
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ “khỏi tay”, tức khỏi quyền sở hữu hoặc quyền kiểm soát. Danh từ số ít được giữ theo nguyên văn và có thể mang nghĩa tập thể.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: bằng gươm và cung của ta
  rationale: Dịch trực tiếp hai vũ khí và giữ nguyên hình ảnh chiến trận; một lần dùng “bằng” là tự nhiên trong tiếng Việt mà vẫn áp dụng cho cả hai danh từ.
theological_decisions:
- issue: Nghĩa của שְׁכֶם và mối liên hệ với địa danh Si-chem cùng phần gia nghiệp thêm của Giô-sép
  choice: Dịch “một phần” trong chính văn và ghi lại nghĩa địa hình cùng khả năng chơi chữ với Si-chem trong chú thích.
  alternative: “một sườn đất” hoặc “Si-chem, một phần”
  rationale: Ngữ cảnh gia nghiệp ủng hộ nghĩa “phần”, nhưng từ Hê-bơ-rơ cũng có thể chỉ vai/sườn hay dải đất cao và đồng âm với Si-chem. Chú thích bảo tồn sự đa nghĩa cùng mối liên hệ có thể có với phần gia nghiệp của Giô-sép mà không biến một cách hiểu thành điều chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ta—con” phù hợp lời của người cha cao tuổi đang long trọng trao phần gia nghiệp; “A-mô-rít” theo lối phiên âm tên dân tộc quen thuộc trong tiếng Việt Kinh Thánh.
