  register: Văn phong hiện đại, trang trọng vừa phải. Dùng “các con” phù hợp lời người cha nói với nhiều con trai; giữ hai mệnh lệnh “đứng dậy, trở lại” để phản ánh chuỗi mệnh lệnh không có liên từ trong tiếng Hê-bơ-rơ.
