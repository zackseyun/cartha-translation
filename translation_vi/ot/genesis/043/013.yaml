revisions:
- from: Cũng hãy dẫn em các con theo[a]; đứng dậy, trở lại chỗ người ấy.[b]
  to: Hãy đem cả người em của các con theo[a], đứng dậy và trở lại với người ấy.[b]
  rationale: Chỉnh trật tự và lựa chọn từ để tiếng Việt tự nhiên hơn, giữ ý “cả/cũng” của thành phần mở đầu, và thay “chỗ người ấy” bằng “với người ấy” để không biến đối tượng của giới từ thành địa điểm. Bản sửa không thêm tên riêng hay diễn giải chức vụ vào chính văn.
