  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: vi
  text: Hãy đem cả người em của các con theo[a], đứng dậy và trở lại với người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “anh/em của các con”; trong ngữ cảnh, đây là Bên-gia-min.'
    reason: cross_reference
  - marker: b
    text: 'Nguyên văn đặt hai mệnh lệnh liền nhau: “đứng dậy, trở lại.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/אֶת
  choice: cũng … theo
  rationale: Liên từ đi với dấu hiệu tân ngữ mang ý bổ sung; trong tiếng Việt, “cũng” và “theo” diễn đạt tự nhiên việc đưa thêm người em cùng đi.
- source_word: אֲחִי/כֶם
  choice: em các con
  rationale: Danh từ số ít với hậu tố ngôi hai số nhiều có nghĩa đen là “anh/em của các con”. Trong ngữ cảnh, người được nói đến là Bên-gia-min, em của những người đang được truyền lệnh; “em các con” tự nhiên trong tiếng Việt mà không thêm tên riêng vào chính văn.
- source_word: קָחוּ
  choice: hãy dẫn … theo
  rationale: Mệnh lệnh Qal số nhiều của לקח, cơ bản là “lấy/đem”. Vì tân ngữ là một người cùng đi, “dẫn … theo” tự nhiên và chính xác hơn “lấy” trong tiếng Việt.
- source_word: וְ/ק֖וּמוּ
  choice: đứng dậy
  rationale: Mệnh lệnh Qal số nhiều của קום; giữ lại hình ảnh đứng lên và sắc thái thúc giục, thay vì giản lược thành “đi”.
- source_word: שׁ֥וּבוּ
  choice: trở lại
  rationale: Mệnh lệnh Qal số nhiều của שוב, ở đây chỉ việc quay trở lại nơi đã đến trước đó.
- source_word: אֶל הָ/אִישׁ
  choice: chỗ người ấy
  rationale: אֶל chỉ hướng đến, còn הָאִישׁ là “người đàn ông/người ấy” đã xác định trong ngữ cảnh. “Trở lại chỗ người ấy” là cách nói tiếng Việt tự nhiên, không biến cụm này thành mục đích “gặp” vốn không được nêu trực tiếp.
