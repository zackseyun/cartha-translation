source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: vi
  text: Ông cho mang các phần ăn từ chỗ mình đến cho họ[a]; nhưng phần của Bên-gia-min nhiều gấp năm lần phần của mỗi người trong số họ[b]. Họ cùng ông uống và say rượu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “từ trước mặt ông”; có lẽ các phần ăn được mang từ chỗ ngồi hoặc bàn của Giô-sép.'
    reason: cultural_note
  - marker: b
    text: 'Nghĩa đen: “năm tay,” một cách nói Hê-bơ-rơ có nghĩa là nhiều gấp năm lần.'
    reason: lexical_alternative
  - marker: c
    text: Động từ Hê-bơ-rơ trực tiếp có nghĩa là “say”; một số bản dịch dùng cách nói nhẹ hơn là “trở nên vui vẻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: cho mang các phần ăn
  rationale: Trong bối cảnh yến tiệc, cụm này nói đến việc sai người chuyển các phần thức ăn đến thực khách; cách dịch này tự nhiên hơn nghĩa đen “nhấc/mang các phần”.
- source_word: מֵאֵת פָּנָיו
  choice: từ chỗ mình
  rationale: Giữ ý các phần ăn được đưa đi từ ngay trước mặt hoặc chỗ ngồi của Giô-sép, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: phần của Bên-gia-min
  rationale: Danh từ chỉ phần thức ăn được phân tại bữa tiệc; “phần” trang trọng, rõ nghĩa và tránh lặp từ không cần thiết.
- source_word: מִמַּשְׂאֹת כֻּלָּם
  choice: phần của mỗi người trong số họ
  rationale: 'Diễn đạt phép so sánh theo nghĩa phân phối: phần của Bên-gia-min được so với phần riêng của từng người còn lại, không phải với tổng số phần của tất cả họ.'
- source_word: חָמֵשׁ יָדוֹת
  choice: nhiều gấp năm lần
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “năm tay/phần,” chỉ lượng lớn gấp năm lần.
- source_word: וַיִּשְׁתּוּ
  choice: uống
  rationale: Động từ tường thuật trực tiếp việc uống trong bữa tiệc.
- source_word: וַיִּשְׁכְּרוּ
  choice: say rượu
  rationale: Động từ Hê-bơ-rơ trực tiếp chỉ tình trạng say do uống rượu; không làm nhẹ thành “vui vẻ” hoặc “uống thỏa thích”.
- source_word: עִמּוֹ
  choice: cùng ông
  rationale: Đại từ chỉ Giô-sép; giữ đại từ như nguyên văn vì tiền ngữ cảnh đã xác định rõ nhân vật.
theological_decisions:
- issue: Mức độ say được diễn tả bởi וַיִּשְׁכְּרוּ
  choice: say rượu
  alternative: vui vẻ / uống thỏa thích
  rationale: Bản dịch giữ nghĩa trực tiếp của động từ mà không giảm nhẹ hàm ý say, đồng thời không thêm nhận định đạo đức ngoài nguyên văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “cho mang” để thể hiện Giô-sép sai người chuyển thức ăn, “từ chỗ mình” để giữ hình ảnh không gian của nguyên văn, và “say rượu” để bảo toàn sắc thái trực tiếp của tiếng Hê-bơ-rơ.
