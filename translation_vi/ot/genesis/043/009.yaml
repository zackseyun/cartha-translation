  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: vi
  text: Chính con sẽ bảo lãnh cho em ấy. Cha cứ đòi con về em ấy. Nếu con không đưa em ấy về cho cha và trình em ấy ra trước mặt cha, thì con sẽ đắc tội với cha suốt đời[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “thì con sẽ có tội với cha suốt đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Chính con
  rationale: Đại từ độc lập mang sắc thái nhấn mạnh; trong lời Giu-đa thưa với cha, “chính con” vừa tự nhiên vừa nêu bật trách nhiệm cá nhân.
- source_word: אֶֽעֶרְבֶ֔נּוּ
  choice: sẽ bảo lãnh cho nó
  rationale: Động từ ערב diễn tả việc đứng ra làm người bảo đảm và nhận trách nhiệm; “bảo lãnh” giữ được sắc thái cam kết mà vẫn dễ hiểu.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: cha cứ đòi nó nơi tay con
  rationale: Giữ hình ảnh cụ thể “từ/nơi tay con” của thành ngữ Hê-bơ-rơ về trách nhiệm phải hoàn trả; “cứ đòi” truyền đạt lực cho phép/cam kết của thể chưa hoàn thành trong ngữ cảnh.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: đưa nó về cho cha
  rationale: Hiphil của בוא là “đưa/đem đến”. “Về” được ngữ cảnh trở lại với cha xác định rõ và tạo câu tiếng Việt tự nhiên.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: và trình nó ra trước mặt cha
  rationale: יצג ở Hiphil có nghĩa đặt hoặc trình ra; cách dịch này giữ cảnh Giu-đa đích thân đưa Bên-gia-min đến trước mặt cha.
- source_word: וְחָטָאתִי לְךָ
  choice: thì con sẽ mang tội với cha
  rationale: חטא là động từ thông thường chỉ phạm tội/mắc lỗi; “mang tội với cha” giữ được sức nặng đạo đức và trách nhiệm liên vị, không thu hẹp thành lời trách móc đơn thuần.
- source_word: כָּל הַיָּמִים
  choice: suốt đời
  rationale: Thành ngữ chỉ thời hạn kéo dài trọn đời; “suốt đời” là cách nói tiếng Việt tự nhiên và chính xác trong ngữ cảnh.
theological_decisions:
- issue: Sắc thái của וְחָטָאתִי לְךָ trong lời cam kết trách nhiệm giữa Giu-đa và cha
  choice: con sẽ mang tội với cha
  alternative: con sẽ có tội với cha / con sẽ đắc tội với cha
  rationale: Bản dịch chính giữ từ “tội”, vốn phản ánh nghĩa thông thường của חטא, đồng thời “mang tội” diễn đạt hậu quả trách nhiệm kéo dài. Chú thích nêu cách dịch sát cấu trúc hơn để bảo tồn độ căng giữa ý phạm tội và ý mắc lỗi/chịu trách nhiệm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ thân tộc “con/cha” theo quan hệ người nói-người nghe; giữ phần nào hình ảnh pháp lý cụ thể của nguyên văn trong “bảo lãnh” và “nơi tay con”.
