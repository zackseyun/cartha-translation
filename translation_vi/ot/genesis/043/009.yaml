revisions:
- from: Chính con sẽ bảo lãnh cho nó; cha cứ đòi nó nơi tay con. Nếu con không đưa nó về cho cha và trình nó ra trước mặt cha, thì con sẽ mang tội với cha suốt đời[a].
  to: Chính con sẽ bảo lãnh cho em ấy. Cha cứ đòi con về em ấy. Nếu con không đưa em ấy về cho cha và trình em ấy ra trước mặt cha, thì con sẽ đắc tội với cha suốt đời[a].
  rationale: Bản sửa thay các cách kết hợp từ gượng bằng tiếng Việt hiện đại nhưng vẫn giữ đầy đủ lời cam kết cá nhân của Giu-đa, quyền của Gia-cốp đòi trách nhiệm nơi ông, hành động đưa và trình Bên-gia-min, cùng ý đắc tội kéo dài suốt đời. Chú thích duy trì phương án gần với cách diễn đạt từ vựng của חטא.
