lexical_decisions:
- source_word: וְהָרָעָב
  choice: Nạn đói
  rationale: רָעָב trong văn cảnh này chỉ nạn đói trên diện rộng. Liên từ וְ tiếp nối mạch kể; tiếng Việt không cần dịch riêng bằng “và” ở đầu câu.
- source_word: כָּבֵד
  choice: rất trầm trọng
  rationale: Nghĩa cơ bản là “nặng”, nhưng khi nói về nạn đói, từ này diễn tả mức độ nghiêm trọng. “Rất trầm trọng” tự nhiên trong tiếng Việt và phản ánh sức nhấn của vị ngữ.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: אֶרֶץ ở đây chỉ vùng đất đang được nói đến trong câu chuyện, không phải toàn thể trái đất. “Trong xứ” vừa gọn vừa phù hợp văn phong Kinh Thánh tiếng Việt.
