base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: vi
  text: Khi chúng tôi đến chỗ nghỉ đêm và mở các bao ra, thì kìa, bạc của mỗi người đều ở miệng bao của người ấy[a]—số bạc của chúng tôi vẫn đủ theo đúng trọng lượng[b]—và chúng tôi đã mang số bạc ấy trở lại trong tay chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngay chỗ mở của bao người ấy.” Tiếng Hê-bơ-rơ nói theo nghĩa đen là “ở miệng bao người ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “theo trọng lượng của nó”; ý nói số bạc được hoàn lại đủ đúng theo lượng đã cân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: chỗ nghỉ đêm
  rationale: Chỉ nơi dừng lại qua đêm trên hành trình, không nhất thiết là một quán trọ thương mại.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: các bao / bao mình
  rationale: Từ này chỉ bao dùng để đựng lương thực hoặc mang theo khi đi đường; “bao” phù hợp với bối cảnh mua ngũ cốc.
- source_word: וְהִנֵּה
  choice: thì kìa
  rationale: Giữ sắc thái phát hiện bất ngờ và tính sống động của lời kể.
- source_word: כֶּסֶף אִישׁ / כַּסְפֵּנוּ
  choice: số bạc của mỗi người / số bạc của chúng tôi
  rationale: Giữ hình ảnh bạc được cân theo trọng lượng, đồng thời thêm “số” để câu tiếng Việt tự nhiên.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: ở miệng bao mình
  rationale: Giữ thành ngữ hình ảnh của tiếng Hê-bơ-rơ, trong đó “miệng” chỉ chỗ mở của vật chứa.
- source_word: בְּמִשְׁקָלוֹ
  choice: vẫn nguyên theo đúng trọng lượng
  rationale: Diễn đạt rằng toàn bộ số bạc đã cân được hoàn lại, không thiếu hụt.
- source_word: וַנָּשֶׁב אֹתוֹ בְּיָדֵנוּ
  choice: chúng tôi đã mang số bạc ấy trở lại trong tay mình
  rationale: Giữ ý mang trả lại và hình ảnh “trong tay” của nguyên văn, đồng thời dùng thì quá khứ phù hợp với chuỗi động từ kể chuyện.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ các hình ảnh Hê-bơ-rơ “miệng bao” và “trong tay mình”, đồng thời dùng chú thích để làm rõ thành ngữ và ý nghĩa của việc cân bạc.
