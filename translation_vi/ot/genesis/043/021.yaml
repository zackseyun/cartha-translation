  to: Khi chúng tôi đến chỗ nghỉ đêm và mở các bao ra, thì kìa, bạc của mỗi người đều ở miệng bao của người ấy[a]—số bạc của chúng tôi vẫn đủ theo đúng trọng lượng[b]—và chúng tôi đã mang số bạc ấy trở lại trong tay chúng tôi.
