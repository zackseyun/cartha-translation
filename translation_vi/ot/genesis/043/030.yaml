  text: וַ/יְמַהֵ֣ר יוֹסֵ֗ף כִּֽי נִכְמְר֤וּ רַחֲמָי/ו֙ אֶל אָחִ֔י/ו וַ/יְבַקֵּ֖שׁ לִ/בְכּ֑וֹת וַ/יָּבֹ֥א הַ/חַ֖דְרָ/ה וַ/יֵּ֥בְךְּ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: vi
  text: Giô-sép vội vã, vì lòng thương em mình trỗi dậy, và ông tìm chỗ để khóc[a]. Ông vào phòng và khóc ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “ông tìm để khóc.” Ngữ cảnh cho thấy ông tìm một nơi riêng để khóc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: vội vã
  rationale: Động từ diễn tả hành động khẩn trương. Không thêm ý “đi ra” vì nguyên văn không nói rõ hướng chuyển động.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: lòng thương ... trỗi dậy
  rationale: Cách diễn đạt tự nhiên này giữ hình ảnh lòng thương cảm bị khuấy động mạnh, nhưng tránh dịch cứng thành thành ngữ chỉ nội tạng.
- source_word: אֶל אָחִיו
  choice: em mình
  rationale: אָח có nghĩa là anh hoặc em tùy ngữ cảnh; ở đây người được nói đến là Bên-gia-min, em của Giô-sép, nên “em mình” chính xác và tự nhiên.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: tìm chỗ để khóc
  rationale: Nguyên văn sát nghĩa là “tìm/cố để khóc”; ngữ cảnh cho thấy Giô-sép tìm nơi riêng tư để khóc. Bổ sung “chỗ” làm rõ hàm ý và được ghi chú.
- source_word: הַחַדְרָה
  choice: vào phòng
  rationale: Danh từ chỉ một căn phòng, có thể là phòng bên trong hoặc phòng riêng; “phòng” là cách nói hiện đại, không xác định quá mức.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: và khóc ở đó
  rationale: Giữ cả hành động khóc lẫn trạng từ chỉ nơi chốn שָׁמָּה.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “lòng thương” thay cho lối dịch giải phẫu cổ, đồng thời giữ cường độ cảm xúc bằng “trỗi dậy”. Không thêm “đi ra” vào động từ mở đầu vì chi tiết ấy không có trong nguyên văn.
