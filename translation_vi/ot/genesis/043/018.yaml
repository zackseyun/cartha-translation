revisions:
- from: 'Những người ấy sợ hãi vì bị đưa vào nhà Giô-sép. Họ nói: “Chúng ta bị đưa vào đây là vì số bạc đã được trả lại trong các bao của chúng ta lần trước, để ông ấy kiếm cớ chống lại chúng ta[a], xông vào chúng ta, bắt chúng ta làm nô lệ và lấy cả lừa của chúng ta.”'
  to: 'Những người ấy sợ hãi vì bị đưa vào nhà Giô-sép. Họ nói: “Chúng ta bị đưa vào đây là vì số bạc đã được trả lại trong các bao của chúng ta lần trước, để ông ấy kiếm cớ chống lại chúng ta[a], tấn công chúng ta, bắt chúng ta làm nô lệ và lấy cả lừa của chúng ta.”'
  rationale: Chỉ thay “xông vào chúng ta” bằng “tấn công chúng ta” để phản ánh rõ, tự nhiên và trung tính hơn hành động thù nghịch trong nguyên ngữ. Các phần khác được giữ nguyên vì trung thành với nguyên văn và phù hợp tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
