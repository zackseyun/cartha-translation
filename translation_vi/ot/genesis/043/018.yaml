  text: וַ/יִּֽירְא֣וּ הָֽ/אֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַ/יֹּאמְר֗וּ עַל דְּבַ֤ר הַ/כֶּ֨סֶף֙ הַ/שָּׁ֤ב בְּ/אַמְתְּחֹתֵ֨י/נוּ֙ בַּ/תְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְ/הִתְגֹּלֵ֤ל עָלֵ֨י/נוּ֙ וּ/לְ/הִתְנַפֵּ֣ל עָלֵ֔י/נוּ וְ/לָ/קַ֧חַת אֹתָ֛/נוּ לַ/עֲבָדִ֖ים וְ/אֶת חֲמֹרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: vi
  text: 'Những người ấy sợ hãi vì bị đưa vào nhà Giô-sép. Họ nói: “Chúng ta bị đưa vào đây là vì số bạc đã được trả lại trong các bao của chúng ta lần trước, để ông ấy kiếm cớ chống lại chúng ta[a], tấn công chúng ta, bắt chúng ta làm nô lệ và lấy cả lừa của chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tìm dịp chống lại chúng ta.” Thành ngữ Híp-ri ở đây khó xác định chính xác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הָאֲנָשִׁים
  choice: Những người ấy sợ hãi
  rationale: Diễn đạt tự nhiên phản ứng sợ hãi của nhóm anh em Giô-sép, đồng thời giữ danh từ chỉ những người nam trong ngữ cảnh.
- source_word: כִּי הוּבְאוּ בֵּית יוֹסֵף
  choice: vì bị đưa vào nhà Giô-sép
  rationale: Giữ sắc thái bị động của dạng Hophal và quan hệ nguyên nhân do כִּי biểu thị.
- source_word: עַל דְּבַר הַכֶּסֶף הַשָּׁב
  choice: vì số bạc đã được trả lại
  rationale: עַל דְּבַר mang nghĩa nguyên nhân trong ngữ cảnh; הַשָּׁב mô tả số bạc trở lại, được diễn đạt bằng thể bị động tự nhiên trong tiếng Việt.
- source_word: בְּאַמְתְּחֹתֵינוּ בַּתְּחִלָּה
  choice: trong các bao của chúng ta lần trước
  rationale: אַמְתַּחַת là bao dùng khi đi đường hoặc đựng lương thực; בַּתְּחִלָּה trong mạch truyện chỉ chuyến đi trước.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: để ông ấy kiếm cớ chống lại chúng ta
  rationale: Thành ngữ Híp-ri khó xác định chính xác, có ý chỉ một hành động thù nghịch nhằm tạo cơ hội hoặc lý do chống lại họ; bản dịch giữ cách hiểu này và ghi chú phương án khác.
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: xông vào chúng ta
  rationale: Truyền đạt hành động tấn công thù nghịch rõ ràng và tự nhiên hơn cách dịch sát chữ ‘ngã trên chúng ta’.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: bắt chúng ta làm nô lệ
  rationale: עֲבָדִים ở đây nói đến tình trạng bị cưỡng ép làm nô lệ, không chỉ là người phục vụ.
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: và lấy cả lừa của chúng ta
  rationale: Giữ đối tượng bổ sung của động từ ‘bắt/lấy’ và sắc thái ‘cả’ tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “số bạc” phù hợp bối cảnh tiền được cân bằng bạc; “nô lệ” thể hiện đúng tình trạng lệ thuộc cưỡng bức. Đại từ “ông ấy” phản ánh lời phỏng đoán của các anh em về chủ nhà mà không thêm danh tính ngoài nguyên văn.
