    rationale: Động từ này với עַל diễn tả hành động thù nghịch nhằm vào họ, tức xông tới/ập xuống/tấn công. Trong tiếng Việt hiện đại, “xông vào” dễ được hiểu là đi vào một không gian; “tấn công” bảo đảm nghĩa hơn mà không thêm chi tiết.
