  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: vi
  text: 'Bấy giờ, Israel nói: “Tại sao các con lại làm hại cha khi nói với người ấy rằng các con vẫn còn một người em?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw liên tiếp thúc đẩy mạch kể; “Bấy giờ” diễn đạt tự nhiên quan hệ tiếp nối trong tiếng Việt.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Giữ nguyên danh xưng mà bản Hê-bơ-rơ dùng, không đổi thành “Gia-cốp”.
- source_word: לָמָה
  choice: Tại sao
  rationale: Cách hỏi trực tiếp, tự nhiên và trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: הֲרֵעֹתֶם לִי
  choice: các con lại gây họa cho cha
  rationale: Động từ רעע ở thể Hiphil chỉ việc gây điều bất lợi hoặc làm hại. “Gây họa cho cha” giữ sắc thái nhân quả và lời than trách trong ngữ cảnh; đại từ theo quan hệ cha-con giúp lời thoại tự nhiên.
- source_word: לְהַגִּיד
  choice: khi nói
  rationale: Động từ nguyên mẫu nêu hành động qua đó tai họa bị gây ra; “khi nói” tự nhiên trong tiếng Việt và vẫn giữ quan hệ hoàn cảnh/phương tiện.
- source_word: לָאִישׁ
  choice: với người ấy
  rationale: Chỉ viên quan Ai Cập đã được nhắc đến; “người ấy” là cách quy chiếu tự nhiên, không thêm chức danh ngoài nguyên văn.
- source_word: הַעוֹד לָכֶם אָח
  choice: các con vẫn còn một người em
  rationale: עוֹד diễn tả sự còn tồn tại. אָח tự thân là “anh/em trai”; trong ngữ cảnh Bên-gia-min là em của những người đang được nói với, nên “người em” tự nhiên và chính xác theo quan hệ gia đình.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Lời thoại dùng “các con/cha” theo quan hệ giữa Israel và các con trai, tránh lối xưng hô xa cách. Không cần chú thích vì khác biệt giữa “một người anh/em trai” theo hình thức và “một người em” theo ngữ cảnh không tạo ra mơ hồ thực chất trong câu chuyện.
