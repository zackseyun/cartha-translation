  text: If you will send our brother with us[a], we will go down and buy food for you.
translation:
  language: vi
  text: Nếu cha chịu cho em chúng con đi cùng chúng con, chúng con sẽ xuống mua lương thực cho cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu cha cho em chúng con đi cùng chúng con.” Thành ngữ Hê-bơ-rơ dùng יֵשׁ với phân từ có thể diễn tả sự sẵn lòng cũng như chính hành động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Diễn đạt trực tiếp điều kiện do tiểu từ אִם mở đầu, không thêm sắc thái nhấn mạnh.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: cha chịu cho ... đi
  rationale: Cấu trúc יֵשׁ với hậu tố đại từ và phân từ có thể chỉ sự sẵn lòng hoặc hành động thực tế. Trong lời Giu-đa nói với cha, “cha chịu cho ... đi” tự nhiên và làm rõ sắc thái sẵn lòng, đồng thời chú thích bảo lưu cách hiểu ít diễn giải hơn.
- source_word: אֶת אָחִינוּ
  choice: em chúng con
  rationale: Nghĩa sát là “anh/em trai của chúng con”; trong ngữ cảnh chỉ Bên-gia-min, người em, nên tiếng Việt tự nhiên dùng “em chúng con” và vẫn giữ quan hệ gia đình.
- source_word: אִתָּנוּ
  choice: đi cùng
  rationale: Diễn đạt sự đồng hành với các anh; động từ “đi” được hàm theo ngữ cảnh sai phái.
- source_word: נֵרְדָה
  choice: chúng con sẽ xuống đó
  rationale: Dạng cohortative ngôi thứ nhất số nhiều diễn tả ý định/quyết tâm trong mệnh đề kết quả. “Sẽ xuống đó” tự nhiên trong tiếng Việt và giữ hình ảnh địa lý “đi xuống”.
- source_word: וְנִשְׁבְּרָה
  choice: mua
  rationale: Động từ שׁבר trong ngữ cảnh tìm lương thực có nghĩa là mua lương thực; “mua” ngắn gọn và đúng ngữ cảnh.
- source_word: לְךָ
  choice: cho cha
  rationale: Giới từ với hậu tố ngôi thứ hai giống đực số ít chỉ người thụ hưởng. Dùng “cha” phù hợp quan hệ và lời xưng hô tiếng Việt.
- source_word: אֹכֶל
  choice: lương thực
  rationale: Danh từ có nghĩa rộng là thức ăn; “lương thực” phù hợp hoàn cảnh thiếu đói và việc mua nguồn thực phẩm dự trữ mà không thu hẹp hoàn toàn thành “ngũ cốc”.
