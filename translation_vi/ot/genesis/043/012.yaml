base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: vi
  text: Hãy mang theo số tiền gấp đôi; cũng hãy đem trả lại số tiền đã được đặt lại ở miệng bao của các con[a]. Có lẽ đó là một sự nhầm lẫn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “ở miệng bao của các con,” tức là tại chỗ mở của các bao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: số tiền gấp đôi
  rationale: Diễn đạt trực tiếp lượng tiền gấp đôi, đồng thời không quyết định quá mức rằng đây là đúng hai lần giá mua trước hay một khoản thứ hai tương đương.
- source_word: קְחוּ בְיֶדְכֶם
  choice: hãy mang theo
  rationale: Thành ngữ có nghĩa là cầm hoặc mang theo; tiếng Việt tự nhiên không cần giữ nguyên hình ảnh 'trong tay'.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: số tiền đã được đặt lại
  rationale: Giữ sắc thái bị động của phân từ Hophal và phù hợp với bối cảnh số tiền đã bị đặt trở lại trong bao, không hàm ý chính các anh em đã hoàn trả nó.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: nơi miệng các bao của các con
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ; chú thích giải thích đây là chỗ mở của bao.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: mang trở lại
  rationale: Thể Hiphil của שוב mang nghĩa khiến trở lại, tức đem trả hoặc mang trở lại; cách nói này tự nhiên trong tiếng Việt.
- source_word: אוּלַי
  choice: có lẽ
  rationale: Diễn đạt đúng sự không chắc chắn với văn phong trang trọng, tự nhiên.
- source_word: מִשְׁגֶּה
  choice: một sự nhầm lẫn
  rationale: Chỉ lỗi hoặc sơ suất trong giao dịch mà không gán ý gian dối hay tội lỗi.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “các con” vì đây là lời Gia-cốp nói với các con trai. Giữ hình ảnh “miệng các bao” trong chính văn nhưng giải thích bằng chú thích; lược hình ảnh lặp lại “trong tay” để câu tiếng Việt tự nhiên.
