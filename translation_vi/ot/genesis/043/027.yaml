base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: vi
  text: 'Ông hỏi thăm tình hình của họ và nói: “Người cha già của các anh mà các anh đã nhắc đến có khỏe không? Ông ấy vẫn còn sống chứ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: Ông hỏi thăm họ
  rationale: Cụm hỏi với שָׁלוֹם là thành ngữ chỉ việc hỏi han tình hình, sức khỏe và sự bình an nói chung. “Hỏi thăm họ” tự nhiên trong tiếng Việt và không thu hẹp nghĩa chỉ còn sức khỏe.
- source_word: הֲשָׁלוֹם
  choice: có khỏe không
  rationale: Trong câu hỏi về người cha cao tuổi, cách nói này chuyển tải tự nhiên ý ông có được bình an, ổn thỏa hay không; không hiểu שָׁלוֹם đơn thuần là vắng xung đột.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: người cha già của các anh
  rationale: Giữ rõ danh từ “cha” cùng nét nghĩa tuổi cao của הַזָּקֵן. “Người cha già” trang trọng, dễ hiểu và không hàm ý một chức vị trưởng lão.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: mà các anh đã nhắc đến
  rationale: Diễn đạt tự nhiên mệnh đề quan hệ nói về người cha họ từng đề cập, đồng thời giữ sắc thái hồi chỉ của nguyên văn.
- source_word: הַעוֹדֶנּוּ חָי
  choice: Cụ vẫn còn sống chứ?
  rationale: “Vẫn còn” thể hiện עוֹד, còn “sống” thể hiện חָי. Đại từ kính trọng “cụ” phù hợp với người cha cao tuổi và ngữ cảnh hỏi trực tiếp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và tự nhiên. Dùng “các anh” cho nhóm anh em của Giô-sép và “cụ” để kính trọng người cha cao tuổi. Không thêm chú thích vì các lựa chọn từ vựng có thể được truyền đạt rõ ràng trong chính văn.
