  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: vi
  text: 'Rồi ông rửa mặt, đi ra, tự kiềm chế và nói: “Hãy dọn thức ăn ra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là “bánh”; ở đây từ này được dùng theo nghĩa rộng để chỉ thức ăn hoặc bữa ăn được dọn ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ פָּנָיו
  choice: ông rửa mặt
  rationale: Động từ רחץ thường có nghĩa là “rửa”; פָּנִים tuy có hình thức số nhiều trong tiếng Hê-bơ-rơ nhưng ở đây chỉ khuôn mặt của một người. Cách dịch này tự nhiên trong bối cảnh Giô-sép vừa khóc riêng rồi trở lại.
- source_word: וַיֵּצֵא
  choice: đi ra
  rationale: יצא diễn tả việc ra khỏi nơi ông vừa vào để khóc. “Đi ra” bám sát hướng chuyển động của động từ và tự nhiên trong mạch kể tiếng Việt.
- source_word: וַיִּתְאַפַּק
  choice: lấy lại bình tĩnh
  rationale: Dạng hitpael của אפק ở đây diễn tả việc tự kiềm chế sau xúc động mạnh. “Lấy lại bình tĩnh” truyền đạt rõ trạng thái cảm xúc trong tiếng Việt hiện đại, đồng thời không thêm nguyên nhân ngoài văn bản.
- source_word: שִׂימוּ
  choice: Hãy dọn ... ra
  rationale: Nghĩa cơ bản là “đặt, để”, nhưng trong ngữ cảnh bữa ăn, mệnh lệnh này có nghĩa là đem và bày thức ăn ra. “Dọn ... ra” là cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt.
- source_word: לָחֶם
  choice: thức ăn
  rationale: לֶחֶם theo nghĩa đen là “bánh”, nhưng thường được dùng hoán dụ cho thức ăn hay bữa ăn. Trong cảnh đãi tiệc này, “thức ăn” phản ánh đúng nghĩa theo ngữ cảnh hơn là chỉ riêng bánh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang nghiêm vừa phải. Giữ chuỗi hành động ngắn gọn của nguyên bản; dùng “ông” theo tham chiếu ngữ cảnh đến Giô-sép. Dấu chú thích [a] được đặt ngay sau câu có từ “thức ăn”.
