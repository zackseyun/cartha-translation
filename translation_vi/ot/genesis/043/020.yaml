base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: vi
  text: 'Họ thưa: “Thưa ngài[a], lần đầu chúng tôi quả thật[b] đã xuống để mua lương thực.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngài” ở đây là cách xưng hô kính trọng với một người có địa vị cao hơn, không phải danh xưng dành cho Đức Chúa Trời.
    reason: cultural_note
  - marker: b
    text: 'Tiếng Hê-bơ-rơ dùng một nguyên mẫu tuyệt đối đi với động từ hữu hạn “xuống” để nhấn mạnh; cũng có thể dịch: “chúng tôi chắc chắn đã xuống”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Dạng tự sự với waw nối tiếp mở đầu lời thoại; tiếng Việt không cần dịch máy móc liên từ וַ־.
- source_word: בִּי
  choice: Thưa
  rationale: Trong ngữ cảnh này, đây là lời mở đầu khẩn khoản và cung kính, không mang nghĩa đen của giới từ ‘trong tôi’.
- source_word: אֲדֹנִי
  choice: ngài
  rationale: Cách xưng hô kính trọng với một người có địa vị cao hơn; ‘ngài’ tự nhiên trong tiếng Việt và không hàm ý đây là danh xưng dành cho Đức Chúa Trời.
- source_word: יָרֹד יָרַדְנוּ
  choice: chúng tôi quả thật đã xuống đây
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ hữu hạn tạo sắc thái nhấn mạnh; ‘quả thật’ thể hiện lực nhấn ấy, còn ‘xuống đây’ diễn đạt tự nhiên hướng chuyển động trong ngữ cảnh.
- source_word: בַּתְּחִלָּה
  choice: lần trước
  rationale: Trong mạch truyện, cụm từ chỉ chuyến đi ban đầu của họ, tức lần họ đến trước đó, hơn là một ‘khởi đầu’ trừu tượng.
- source_word: לִשְׁבָּר
  choice: để mua
  rationale: Động từ chỉ việc kiếm lương thực, thường bằng cách mua; ‘để mua’ ngắn gọn và phù hợp với tân ngữ đi sau.
- source_word: אֹכֶל
  choice: lương thực
  rationale: Danh từ có nghĩa chung là thức ăn; ‘lương thực’ phù hợp với hoàn cảnh đi mua đồ ăn dự trữ mà không thu hẹp hẳn thành ‘ngũ cốc’.
theological_decisions:
- issue: Danh xưng אֲדֹנִי trong lời thưa gửi
  choice: ngài
  alternative: Chúa tôi / chủ tôi
  rationale: Ngữ cảnh nói đến một cấp trên là con người. ‘Ngài’ giữ sắc thái cung kính mà không tạo liên tưởng không cần thiết đến danh xưng thần linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời “Thưa ngài” thể hiện thái độ dè dặt, kính trọng của những người anh khi trình bày với viên quản gia; “quả thật” bảo lưu sắc thái nhấn mạnh của cấu trúc Hê-bơ-rơ.
