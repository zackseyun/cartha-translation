base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: vi
  text: 'Ông nói: “Bình an cho các ông! Đừng sợ. Đức Chúa Trời của các ông và Đức Chúa Trời của cha các ông đã ban cho các ông một kho báu[a] trong các bao của các ông. Bạc[b] của các ông đã đến tay tôi rồi.” Sau đó, ông đưa Si-mê-ôn ra cho họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một kho báu được cất giấu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Tiền của các ông.” Trong tiếng Hê-bơ-rơ, “bạc” thường được dùng để chỉ tiền.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Bình an cho các ông
  rationale: Giữ nghĩa cốt lõi của שָׁלוֹם và chức năng trấn an trong ngữ cảnh, đồng thời là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: אַל תִּירָאוּ
  choice: Đừng sợ
  rationale: Mệnh lệnh phủ định được chuyển dịch ngắn gọn, trực tiếp và tự nhiên.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: Đức Chúa Trời của các ông và Đức Chúa Trời của cha các ông
  rationale: Diễn đạt số ít theo ngữ cảnh và giữ nguyên danh từ số ít “cha”, không khái quát thành tổ tiên.
- source_word: נָתַן לָכֶם
  choice: đã ban cho các ông
  rationale: Thể hoàn thành được diễn đạt bằng “đã”; “ban” phù hợp khi chủ thể là Đức Chúa Trời mà không thêm ý ngoài nguyên văn.
- source_word: מַטְמוֹן
  choice: một kho báu
  rationale: Từ này chỉ vật quý được cất giấu hoặc tích trữ; “kho báu” tự nhiên và súc tích, còn sắc thái “cất giấu” được ghi ở chú thích.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: trong các bao của các ông
  rationale: “Bao” phù hợp với vật đựng ngũ cốc trong bối cảnh vận chuyển cổ đại và dễ hiểu trong tiếng Việt hiện đại.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: Bạc của các ông đã đến tay tôi rồi
  rationale: Giữ hình ảnh cụ thể “bạc” của tiếng Hê-bơ-rơ; “đến tay tôi” chuyển tải tự nhiên động từ “đến với tôi”, còn “rồi” làm rõ kết quả đã hoàn tất trong lời trấn an.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: Sau đó, ông đưa Si-mê-ôn ra với họ
  rationale: Giữ sắc thái sai khiến của יצא là “đưa ra”, có thể hàm ý đưa ra khỏi nơi giam giữ, và dùng “Sau đó” để thể hiện diễn tiến tường thuật.
theological_decisions:
- issue: Lời người quản gia nhắc đến Đức Chúa Trời
  choice: Dịch thẳng là “Đức Chúa Trời của các ông và Đức Chúa Trời của cha các ông”, không xác quyết cũng không phủ nhận đức tin cá nhân của người nói.
  alternative: Xem lời này chỉ là cách nói ngoại giao, hoặc xem đây là bằng chứng chắc chắn rằng người quản gia có đức tin cá nhân.
  rationale: Nguyên văn chỉ thuật lại lời nói mà không giải thích niềm tin nội tâm của người quản gia; bản dịch cần giữ nguyên sự bỏ ngỏ đó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “các ông” phù hợp với lời người quản gia nói với nhóm anh em trưởng thành. Các dấu chú thích được đặt ngay sau đúng từ ngữ liên quan, tránh sự lệch vị trí trong lớp tham khảo tiếng Anh.
