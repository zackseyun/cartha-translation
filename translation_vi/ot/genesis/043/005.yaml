  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: vi
  text: 'Nhưng nếu cha không cho em ấy đi, chúng con sẽ không xuống, vì người ấy đã nói với chúng con: ‘Các ngươi sẽ không được gặp mặt ta[a] nếu em trai các ngươi không đi cùng.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ nói sát nghĩa: “Các ngươi sẽ không thấy mặt ta nếu em trai các ngươi không ở cùng các ngươi.” “Thấy mặt” là cách nói chỉ việc đến gặp hoặc được vào chầu trước một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ mở ra điều kiện tương phản với lời đề nghị ở câu trước; “Nhưng nếu” thể hiện rõ quan hệ ấy trong tiếng Việt.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: cha không cho em ấy đi
  rationale: Cấu trúc phủ định với phân từ diễn tả việc người cha không chịu hoặc không định cho đi. Tân ngữ không được nêu trong tiếng Hê-bơ-rơ nhưng theo ngữ cảnh là Bên-gia-min; “em ấy” tự nhiên trong lời Giu-đa nói với cha.
- source_word: לֹא נֵרֵד
  choice: chúng con sẽ không xuống đó
  rationale: ירד thường mô tả hành trình từ Ca-na-an xuống Ai Cập. “Xuống đó” giữ hướng địa lý, còn đại từ xưng hô phù hợp với lời con nói với cha.
- source_word: כִּי
  choice: vì
  rationale: כִּי nêu lý do cho việc họ không xuống Ai Cập.
- source_word: הָאִישׁ
  choice: người ấy
  rationale: Giu-đa nói về Giô-sép khi anh em chưa biết thân phận ông. “Người ấy” giữ góc nhìn của nhân vật mà không đưa thêm thông tin.
- source_word: אָמַר אֵלֵינוּ
  choice: đã nói với chúng con
  rationale: Diễn đạt trực tiếp động từ אמר và dẫn vào lời trích dẫn.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Các ngươi sẽ không được gặp mặt ta
  rationale: Nghĩa đen là “không thấy mặt ta”, một cách nói về việc được vào gặp hoặc hiện diện trước người có thẩm quyền. “Không được gặp mặt ta” truyền đạt tự nhiên cả ý nhìn thấy lẫn được tiếp kiến.
- source_word: בִּלְתִּי
  choice: nếu ... không
  rationale: Trong cấu trúc này, בִּלְתִּי nêu điều kiện bắt buộc; tiếng Việt tự nhiên diễn đạt bằng “nếu ... không”.
- source_word: אֲחִיכֶם
  choice: em trai các ngươi
  rationale: Danh từ אָח không tự thân phân biệt anh hay em, nhưng trong ngữ cảnh người được nói đến là Bên-gia-min, em trai của những người đang được संब خطاب; tiếng Việt cần chọn quan hệ tuổi tác tự nhiên hơn “người anh em”.
- source_word: אִתְּכֶם
  choice: đi cùng
  rationale: Mệnh đề Hê-bơ-rơ không có động từ và có nghĩa “ở/cùng với các ngươi”. Trong ngữ cảnh chuyến đi, “đi cùng” diễn đạt rõ điều kiện người em phải có mặt với họ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Trong lời Giu-đa thưa với cha, dùng “cha–chúng con”; trong lời vị quan Ai Cập được trích dẫn, dùng “ta–các ngươi” để phản ánh địa vị và giọng nghiêm nghị. Dấu chú thích [a] đặt ngay sau câu trích dẫn mà chú thích giải thích.
