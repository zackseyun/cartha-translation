base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: vi
  text: Khi Giô-sép vào nhà, họ đem món quà họ mang theo vào nhà đến cho ông,[a] rồi sấp mình xuống đất trước mặt ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn lặp lại cụm “vào nhà”: Giô-sép “vào nhà”, rồi họ đem món quà “vào nhà” đến cho ông.'
    reason: literary_note
  - marker: b
    text: 'Cũng có thể dịch: “cúi rạp xuống đất trước mặt ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vào
  rationale: Động từ בוא ở đây chỉ chuyển động vào trong nhà; “vào” tự nhiên và thể hiện rõ đích đến trong tiếng Việt.
- source_word: הַבַּיְתָה
  choice: vào nhà
  rationale: Danh từ với ה chỉ hướng diễn tả chuyển động hướng vào nhà.
- source_word: וַיָּבִיאוּ לוֹ
  choice: đem ... để dâng cho ông
  rationale: Hiphil của בוא có nghĩa là “đem”; trong bối cảnh lễ vật được trao cho một quan lớn, “dâng cho” diễn đạt tự nhiên quan hệ tiếp nhận mà không biến hành động thành nghi lễ thờ phượng.
- source_word: הַמִּנְחָה
  choice: lễ vật
  rationale: מנחה có thể là quà biếu, lễ vật hoặc cống phẩm. Ở đây đó là món quà mang tính kính trọng dành cho Giô-sép; “lễ vật” giữ được sắc thái trang trọng nhưng không nhất thiết mang nghĩa tế lễ.
- source_word: אֲשֶׁר בְּיָדָם
  choice: đang cầm trong tay
  rationale: Giữ hình ảnh cụ thể của nguyên văn “ở trong tay họ” bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: sấp mình ... trước mặt ông
  rationale: Động từ שחה mô tả cử chỉ hạ mình sâu để tỏ lòng tôn kính; “sấp mình” mạnh hơn “cúi xuống” và phù hợp với bổ ngữ “xuống đất”.
- source_word: אָרְצָה
  choice: xuống đất
  rationale: Dạng chỉ hướng của ארץ nhấn mạnh chuyển động hướng xuống mặt đất.
theological_decisions:
- issue: Cử chỉ וַיִּשְׁתַּחֲווּ có thể được dùng cho sự thờ phượng hoặc sự thần phục trước người có địa vị.
  choice: sấp mình xuống đất trước mặt ông
  alternative: thờ lạy ông
  rationale: Bối cảnh nói về sự kính phục đối với Giô-sép trong tư cách quan cai trị, nên bản dịch mô tả tư thế mà không áp đặt ý nghĩa thờ phượng tôn giáo.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh cụ thể “trong tay” và cử chỉ phủ phục; sự lặp lại “vào nhà” của tiếng Hê-bơ-rơ được làm gọn trong chính văn để câu tiếng Việt tự nhiên, đồng thời được ghi rõ trong chú thích.
