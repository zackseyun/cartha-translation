revisions:
- from: Khi Giô-sép vào nhà, họ đem lễ vật đang cầm trong tay vào nhà để dâng cho ông,[a] rồi sấp mình xuống đất trước mặt ông.[b]
  to: Khi Giô-sép vào nhà, họ đem món quà họ mang theo vào nhà đến cho ông,[a] rồi sấp mình xuống đất trước mặt ông.[b]
  rationale: Sửa “lễ vật” thành “món quà” và “dâng cho” thành “đến cho” để giữ nghĩa quà biếu/biếu phẩm của מִנְחָה mà không gán sắc thái tế tự. Sửa cụm “đang cầm trong tay” thành “mang theo” để tiếng Việt tự nhiên hơn. Giữ cả hai lần “vào nhà” trong chính văn, tương ứng với sự lặp lại của nguyên văn; chú thích a giải thích sự lặp lại này.
  reviewer_model: gpt-5.6-terra
