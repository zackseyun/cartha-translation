  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: vi
  text: Người ấy đưa những người ấy vào nhà Giô-sép, cho họ nước; họ rửa chân mình. Rồi người ấy cho lừa của họ ăn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: đưa ... vào
  rationale: Dạng Hifil của בוא diễn tả việc khiến người khác đi vào; “đưa ... vào” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái chỉ hướng.
- source_word: הָאִישׁ
  choice: người ấy
  rationale: Hê-bơ-rơ chỉ nói “người đàn ông/người ấy”, không nêu chức vụ quản gia trong câu này; “người ấy” tự nhiên hơn trong mạch văn tiếng Việt mà không thêm nhận diện.
- source_word: הָאֲנָשִׁים
  choice: những người kia
  rationale: Danh từ có nghĩa thông thường là “những người đàn ông”; bản dịch không thay bằng “các anh em”, vì câu này không gọi họ như vậy.
- source_word: בֵּיתָה יוֹסֵף
  choice: vào nhà Giô-sép
  rationale: Đuôi chỉ hướng ở בֵּיתָה biểu thị chuyển động vào bên trong ngôi nhà.
- source_word: וַיִּתֶּן מַיִם
  choice: cho họ nước để rửa chân
  rationale: Nguyên văn là “cho nước”; mục đích sử dụng được câu kế tiếp làm rõ. Cách diễn đạt này tự nhiên trong tiếng Việt và không hàm ý người ấy tự rửa chân cho họ.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: họ liền rửa chân mình
  rationale: 'Động từ ở thể chủ động số nhiều: chính họ rửa chân; “mình” làm rõ chủ thể sở hữu mà không chuyển sang thể bị động.'
- source_word: מִסְפּוֹא
  choice: thức ăn
  rationale: Trong ngữ cảnh lừa, từ này chỉ thức ăn cho gia súc. “Thức ăn” là cách gọi hiện đại, dễ hiểu; đối tượng “lừa” khiến nghĩa đủ rõ.
- source_word: לַחֲמֹרֵיהֶם
  choice: cho lừa của họ
  rationale: Giới từ לְ đánh dấu đối tượng nhận hoặc hưởng lợi; cấu trúc “cho lừa của họ thức ăn” tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cách gọi không định danh của nguyên văn (“người ấy”, “những người kia”), thay vì diễn giải thành “quản gia” và “các anh em của Giô-sép”. Tách nhịp bằng dấu chấm phẩy và câu mới để tránh nhập nhằng chủ thể khi chuyển từ người tiếp đón sang các vị khách.
