base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: vi
  text: Chúng tôi cũng đã mang theo[c] một khoản bạc khác xuống đây để mua lương thực.[a][b] Chúng tôi không biết ai đã bỏ bạc của chúng tôi vào các bao của chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiền” ở cả hai chỗ có từ “bạc”; từ Hê-bơ-rơ כֶּסֶף có thể chỉ kim loại bạc hoặc tiền dùng để thanh toán.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “để mua ngũ cốc”; cụm động từ này có thể nói cụ thể đến việc mua ngũ cốc, dù danh từ ở đây có nghĩa rộng hơn là “lương thực”.
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “trong tay chúng tôi”.'
    reason: previous_rendering
lexical_decisions:
- source_word: וְכֶסֶף אַחֵר
  choice: một số bạc khác
  rationale: כֶּסֶף vừa chỉ bạc vừa chỉ tiền; giữ hình ảnh cụ thể “bạc”, còn אַחֵר cho biết đây là khoản thêm ngoài số bạc đã được hoàn lại.
- source_word: הוֹרַדְנוּ
  choice: đã mang ... xuống đây
  rationale: Dạng Hiphil của ירד có nghĩa “đem xuống”; cách diễn đạt này giữ hướng hành trình quen thuộc từ Ca-na-an xuống Ai Cập, đồng thời “đây” làm câu tiếng Việt tự nhiên trong lời nói trực tiếp.
- source_word: בְיָדֵנוּ
  choice: mang theo
  rationale: Thành ngữ Hê-bơ-rơ sát nghĩa là “trong tay chúng tôi”, ở đây diễn tả việc đem theo hoặc giữ trong tay; “mang theo” là cách nói tiếng Việt tự nhiên.
- source_word: לִשְׁבָּר אֹכֶל
  choice: để mua lương thực
  rationale: שׁבר trong ngữ cảnh này là mua lương thực, thường là ngũ cốc; אֹכֶל rộng hơn riêng “ngũ cốc”, nên “lương thực” cân bằng độ chính xác và ngữ cảnh.
- source_word: לֹא יָדַעְנוּ
  choice: Chúng tôi không biết
  rationale: Dạng hoàn thành Hê-bơ-rơ ở đây có thể diễn tả tình trạng hiện tại phát sinh từ việc trước đó không hay biết; thì hiện tại tự nhiên trong tiếng Việt.
- source_word: מִי שָׂם
  choice: ai đã bỏ
  rationale: שׂים có nghĩa đặt hoặc để; “bỏ ... vào” là cách nói tự nhiên khi nói về bạc ở trong bao.
- source_word: כַּסְפֵּנוּ
  choice: bạc của chúng tôi
  rationale: Lặp lại “bạc” để phản ánh việc nguyên văn lặp cùng từ כֶּסֶף và duy trì hình ảnh tiền bạc bằng kim loại.
- source_word: בְאַמְתְּחֹתֵינוּ
  choice: vào bao
  rationale: אַמְתַּחַת là bao hoặc túi dùng để chở lương thực; “bao” phù hợp bối cảnh truyện Giô-sép. Tiếng Việt có thể dùng danh từ không đánh dấu số sau chủ thể số nhiều.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: giữ “bạc” và hướng chuyển động “xuống”, nhưng chuyển thành ngữ “trong tay chúng tôi” thành “mang theo” cho tự nhiên trong tiếng Việt. Các khả năng từ vựng chân thực được bảo lưu bằng chú thích.'
