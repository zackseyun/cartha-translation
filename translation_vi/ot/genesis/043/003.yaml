  to: 'Bấy giờ Giu-đa nói với ông: “Người ấy đã cảnh cáo chúng con rất nghiêm khắc rằng: ‘Các ngươi sẽ không được thấy mặt ta[a], trừ khi em trai các ngươi đi cùng các ngươi.’”'
  rationale: Bản sửa dùng “trừ khi” để phản ánh trực tiếp điều kiện loại trừ của בִּלְתִּי, điều chỉnh trật tự từ cho tự nhiên hơn, và chuyển mỏ neo chú thích đến đúng thành ngữ được giải thích. Ý nghĩa, sắc thái trang trọng và các đại từ theo văn cảnh đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
