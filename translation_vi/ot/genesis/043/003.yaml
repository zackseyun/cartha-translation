  - severity: low
    issue: Mỏ neo chú thích [a] đặt ở cuối toàn bộ lời trích dẫn.
    rationale: Chú thích chỉ giải thích thành ngữ “thấy mặt ta”; nên đặt ngay sau cụm này để mỏ neo minh bạch.
