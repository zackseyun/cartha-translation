base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: vi
  text: 'Bấy giờ Giu-đa nói với ông: “Người ấy đã cảnh cáo chúng con rất nghiêm khắc rằng: ‘Các ngươi sẽ không được thấy mặt ta[a], trừ khi em trai các ngươi đi cùng các ngươi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “thấy mặt ta” cũng có thể hiểu là “đến trình diện trước mặt ta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוּדָה
  choice: Bấy giờ Giu-đa nói với ông
  rationale: Dịch diễn tiến tự sự của waw-consecutive bằng “Bấy giờ”; “ông” chỉ Gia-cốp theo văn cảnh.
- source_word: הָעֵד הֵעִד בָּנוּ הָאִישׁ
  choice: Người ấy đã nghiêm khắc cảnh cáo chúng con
  rationale: Kết cấu nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh lời cảnh cáo; “nghiêm khắc cảnh cáo” truyền đạt sức nhấn và tính nghiêm trọng. “Chúng con” phù hợp khi Giu-đa thưa với cha.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Các ngươi sẽ không được thấy mặt ta
  rationale: Giữ hình ảnh sát nguyên văn “thấy mặt ta”, đồng thời cách nói “không được” thể hiện lời cấm/điều kiện trong văn cảnh.
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: nếu em trai các ngươi không đi cùng
  rationale: בִּלְתִּי nêu điều kiện loại trừ; “em trai” tự nhiên trong tiếng Việt và chỉ Bên-gia-min, còn “đi cùng” làm rõ ý hiện diện cùng họ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng con” trong lời Giu-đa thưa với cha, nhưng giữ “các ngươi/ta” trong lời viên quan Ai Cập để phản ánh địa vị và giọng điệu nghiêm khắc. Dấu chú thích [a] được đặt ngay sau câu trích dẫn mà chú thích giải thích.
