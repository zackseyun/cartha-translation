  revised_text: Người ta dọn thức ăn riêng cho ông, riêng cho các anh em ông, và riêng cho những người Ai Cập ăn cùng ông, vì người Ai Cập không thể dùng bữa chung với người Hê-bơ-rơ[a], bởi đó là điều ghê tởm đối với người Ai Cập.
