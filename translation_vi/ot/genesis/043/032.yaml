base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: vi
  text: Người ta dọn thức ăn riêng cho ông, riêng cho các anh em ông, và riêng cho những người Ai Cập ăn cùng ông, vì người Ai Cập không thể dùng bữa chung với người Hê-bơ-rơ[a], bởi đó là điều ghê tởm đối với người Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “ăn bánh với người Hê-bơ-rơ”, một thành ngữ chỉ việc dùng chung một bữa ăn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: người ta dọn
  rationale: Động từ có nghĩa cơ bản là “đặt, để”; trong bối cảnh bàn ăn, “dọn” diễn đạt tự nhiên hành động đặt thức ăn ra cho từng nhóm mà không thêm một chủ thể cụ thể.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: riêng cho ông / riêng cho các anh em ông / riêng cho những người Ai Cập
  rationale: Giữ sự lặp lại nổi bật của nguyên văn và nhấn mạnh việc ba nhóm được bố trí ăn tách biệt.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: ăn cùng ông
  rationale: Phân từ được chuyển thành cụm bổ nghĩa tự nhiên trong tiếng Việt; “cùng ông” giữ ý những người Ai Cập dùng bữa với Giô-sép.
- source_word: לֹא יוּכְלוּן
  choice: không thể
  rationale: Giữ nguyên sắc thái bất khả thi do quy ước xã hội hoặc văn hóa, không quy định cụ thể đó là bất lực thể chất hay lệnh cấm pháp lý.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: dùng bữa chung với người Hê-bơ-rơ
  rationale: Cụm “ăn bánh” là thành ngữ chỉ việc dùng bữa; cách dịch này tự nhiên trong tiếng Việt và làm rõ ý thông công tại bàn ăn. Nghĩa đen được ghi ở chú thích.
- source_word: תוֹעֵבָה
  choice: điều ghê tởm
  rationale: Diễn đạt cường độ mạnh của từ Hê-bơ-rơ, đồng thời phù hợp với một điều bị xem là đáng ghét hoặc cấm kỵ về văn hóa, nghi lễ.
- source_word: מִצְרִים / הָעִבְרִים
  choice: người Ai Cập / người Hê-bơ-rơ
  rationale: Cách gọi dân tộc chuẩn và tự nhiên trong tiếng Việt, giữ rõ sự đối lập xã hội giữa hai nhóm.
theological_decisions:
- issue: Bản chất của “điều ghê tởm”
  choice: Không giải thích nguyên nhân cụ thể trong chính văn
  alternative: Xác định đây là sự ô uế nghi lễ, phân biệt chủng tộc, hoặc do khác biệt tập quán ăn uống
  rationale: Nguyên văn chỉ nói việc ăn chung là điều ghê tởm đối với người Ai Cập, nhưng không nêu lý do; bản dịch giữ nguyên sự để ngỏ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các anh em ông” để làm rõ đại từ số nhiều theo ngữ cảnh, nhưng không nêu tên Giô-sép vì nguyên văn chỉ dùng đại từ. Sự lặp lại “riêng” được chủ ý duy trì để tái hiện cấu trúc và trọng tâm của câu Hê-bơ-rơ.
