- from: Họ ngồi trước mặt ông, từ người con trưởng theo thứ tự sinh cho đến người con út theo tuổi tác[a]. Những người ấy kinh ngạc nhìn nhau.
  to: Họ ngồi trước mặt ông, theo thứ tự từ người con trưởng đến người con út[a]. Những người ấy kinh ngạc nhìn nhau.
  rationale: 'Bản sửa thay cách diễn đạt “theo tuổi tác” bằng một cấu trúc tiếng Việt tự nhiên, đồng thời làm rõ ý nghĩa ngữ cảnh của cặp thành ngữ Hê-bơ-rơ: các anh em được xếp chỗ theo thứ tự từ lớn đến nhỏ. Chú thích giữ lại cách diễn đạt sát chữ và sắc thái từ vựng của nguyên văn.'
