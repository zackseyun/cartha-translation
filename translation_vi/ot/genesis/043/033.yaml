base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: vi
  text: Họ ngồi trước mặt ông, theo thứ tự từ người con trưởng đến người con út[a]. Những người ấy kinh ngạc nhìn nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ nói: “người con trưởng theo địa vị con trưởng của mình, và người trẻ nhất theo sự trẻ tuổi của mình.” Cách nói này mô tả chỗ ngồi được xếp theo thứ tự sinh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Họ ngồi
  rationale: Dạng động từ chủ động kể chuyện của ישׁב; dịch trực tiếp, không biến thành thể bị động dù ngữ cảnh cho thấy chỗ ngồi đã được sắp xếp.
- source_word: לְפָנָיו
  choice: trước mặt ông
  rationale: Diễn đạt tự nhiên quan hệ không gian và giữ đại từ chỉ Giô-sép.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: người con trưởng theo thứ tự sinh
  rationale: הַבְּכֹר chỉ người con đầu lòng; trong bối cảnh xếp chỗ, כִּבְכֹרָתוֹ nói đến vị trí theo thứ tự sinh hơn là quyền thừa kế. Cách dịch giữ ý thứ bậc do việc sinh ra.
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: cho đến người con út theo tuổi tác
  rationale: Đối ứng với người con trưởng và bao quát cả nhóm, הַצָּעִיר mang nghĩa người trẻ nhất; כִּצְעִרָתוֹ diễn tả địa vị theo độ trẻ hay tuổi tác.
- source_word: וַיִּתְמְהוּ
  choice: kinh ngạc nhìn nhau
  rationale: תמה diễn tả sự kinh ngạc; kết hợp với thành ngữ tương hỗ אִישׁ אֶל־רֵעֵהוּ, cách dịch này thể hiện tự nhiên phản ứng qua lại mà không làm mất sắc thái sửng sốt.
- source_word: הָאֲנָשִׁים
  choice: Những người ấy
  rationale: Giữ danh từ chung 'những người' của nguyên văn thay vì diễn giải thành 'các anh em'; từ 'ấy' giúp quy chiếu tự nhiên trong tiếng Việt.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: nhìn nhau
  rationale: Thành ngữ chỉ hành động tương hỗ, được chuyển thành đại từ tương hỗ tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “người con trưởng” và “người con út” để làm rõ hai đầu của thứ tự anh em; không dùng “quyền trưởng nam” vì trong ngữ cảnh này trọng tâm là thứ tự chỗ ngồi theo tuổi, không phải quyền thừa kế.
