  source_fidelity: Bản nháp truyền đạt đúng việc họ ngồi trước mặt Giô-sép và sự kinh ngạc tương hỗ. Tuy nhiên, “theo tuổi tác” không diễn đạt rõ sắc thái so sánh/thứ bậc của כִּצְעִרָתוֹ; trong ngữ cảnh, cả hai vế nói về việc xếp theo thứ tự tuổi/sinh.
  naturalness: “Từ ... cho đến ... theo tuổi tác” hơi nặng và không thật tự nhiên trong tiếng Việt hiện đại. “Theo thứ tự từ ... đến ...” diễn đạt rõ ràng, tự nhiên rằng toàn nhóm được xếp theo tuổi.
