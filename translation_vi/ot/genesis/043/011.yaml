translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu giữ sắc thái nhượng bộ miễn cưỡng của người cha và chuỗi liệt kê trong nguyên văn; các tên chất thơm khó xác định được diễn đạt rộng và giải thích bằng chú thích.
