  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: vi
  text: 'Bấy giờ Israel, cha của họ, nói với họ: “Nếu đành phải vậy, thì hãy làm thế này: Hãy lấy một ít sản vật quý của xứ cho vào đồ đựng của các con, rồi đem xuống làm quà biếu người ấy: một ít nhựa thơm, một ít mật ong[b], gôm thơm và mộc dược[c], hạt dẻ cười và hạnh nhân.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Trong một số ngữ cảnh, từ được dịch là “mật ong” có thể chỉ một loại si-rô ngọt thay vì mật ong do ong tạo ra.
    reason: lexical_alternative
  - marker: c
    text: Không chắc chắn về danh tính chính xác của các từ Hê-bơ-rơ được dịch là “gôm thơm” và “mộc dược”; chúng có thể chỉ những loại gôm hoặc nhựa thơm khác, chẳng hạn gôm tragacanth hay nhựa labdanum.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: Israel, cha của họ
  rationale: Giữ tên Israel như bản Hê-bơ-rơ dùng cho Gia-cốp trong mạch truyện này, đồng thời diễn đạt quan hệ đồng vị một cách tự nhiên trong tiếng Việt.
- source_word: אִם כֵּן אֵפוֹא
  choice: Nếu đành phải vậy, thì
  rationale: Thành ngữ biểu thị sự miễn cưỡng chấp nhận hoàn cảnh; “đành phải vậy” chuyển tải sắc thái ấy rõ hơn “nếu vậy” đơn thuần.
- source_word: זֹאת עֲשׂוּ
  choice: hãy làm thế này
  rationale: Mệnh lệnh trực tiếp, gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: một ít sản vật quý của xứ
  rationale: Cụm từ chỉ những sản phẩm tuyển chọn hoặc quý giá từ đất đai, không nhất thiết chỉ là trái cây.
- source_word: בִּכְלֵיכֶם
  choice: cho vào đồ đựng của các con
  rationale: כְּלִי là từ khái quát chỉ vật dụng hay đồ chứa; cách dịch này tránh xác định quá cụ thể là bao, túi hoặc bình.
- source_word: וְהוֹרִידוּ
  choice: đem xuống
  rationale: Giữ hướng chuyển động “xuống” trong hành trình đến Ai Cập, đồng thời phù hợp với việc mang theo quà.
- source_word: לָאִישׁ
  choice: người ấy
  rationale: Chỉ viên quan Ai Cập đã được nhắc đến; “người ấy” tự nhiên hơn “người đàn ông” trong ngữ cảnh tiếng Việt.
- source_word: מִנְחָה
  choice: biếu ... [các sản vật làm quà]
  rationale: Trong bối cảnh ngoại giao này, từ chỉ một món quà dâng biếu, không phải lễ vật thờ phượng hay cống phẩm chính trị.
- source_word: מְעַט צֳרִי
  choice: một ít dầu thơm
  rationale: צֳרִי chỉ một loại nhựa hoặc dầu thơm thường được dùng làm dược liệu; “dầu thơm” dễ hiểu và không xác định quá mức nguồn thực vật.
- source_word: וּמְעַט דְּבַשׁ
  choice: một ít mật ong
  rationale: “Mật ong” là nghĩa thông thường của דְּבַשׁ, trong khi khả năng chỉ si-rô ngọt được bảo lưu ở chú thích.
- source_word: נְכֹאת
  choice: nhựa cây thơm
  rationale: Danh tính thực vật chưa chắc chắn; cách gọi khái quát này giữ được ý về một loại gôm hoặc nhựa có hương thơm.
- source_word: לֹט
  choice: mộc dược
  rationale: Đây là cách gọi quen thuộc trong truyền thống dịch, nhưng danh tính chính xác của chất thơm này không chắc chắn nên có chú thích.
- source_word: בָּטְנִים
  choice: hạt dẻ cười
  rationale: Chỉ hạt pistachio; tên gọi hiện đại “hạt dẻ cười” dễ nhận biết đối với độc giả phổ thông.
- source_word: שְׁקֵדִים
  choice: hạnh nhân
  rationale: Tương ứng trực tiếp với almond và là tên gọi thông dụng trong tiếng Việt hiện đại.
