base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/017.yaml
  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: vi
  text: Người ấy làm theo lời Giô-sép, rồi đưa[a] những người kia vào nhà Giô-sép.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “dẫn những người kia vào nhà Giô-sép.”
    reason: Phương án dịch theo ngữ cảnh cho động từ Hiphil וַיָּבֵא; nghĩa chính trong bản văn vẫn là “đưa ... vào.”
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה trong cấu trúc này diễn tả việc làm theo chỉ thị; “làm” là cách chuyển ngữ tự nhiên và sát nghĩa.
- source_word: הָאִישׁ
  choice: người ấy
  rationale: Nguyên văn chỉ nói “người” với mạo từ xác định, không nêu chức vụ. “Người ấy” dựa vào nhân vật đã được nhắc đến trong ngữ cảnh mà không thêm cách gọi như “quản gia” hay “đầy tớ”.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: đúng như lời Giô-sép truyền
  rationale: Cụm này chỉ sự tuân thủ lời Giô-sép. Trong ngữ cảnh Giô-sép vừa ra chỉ thị, “truyền” diễn đạt tự nhiên sắc thái mệnh lệnh của אָמַר mà không làm thay đổi nội dung.
- source_word: וַיָּבֵא
  choice: đưa ... vào
  rationale: Dạng Hiphil của בוא có nghĩa gây khiến chuyển động đến hoặc vào một nơi; “đưa ... vào” vừa thể hiện ý gây khiến vừa phù hợp với đích đến.
- source_word: הָאֲנָשִׁים
  choice: những người kia
  rationale: Nguyên văn dùng danh từ chung “những người”, không gọi họ là các anh em. Từ “kia” giúp phân biệt nhóm người được đưa đi với “người ấy” trong câu tiếng Việt.
- source_word: בֵּיתָה יוֹסֵף
  choice: vào nhà Giô-sép
  rationale: Hậu tố chỉ hướng trên בֵּיתָה biểu thị chuyển động hướng đến ngôi nhà; “vào nhà” phù hợp với ngữ cảnh và thể hiện việc đi vào bên trong.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ cách gọi chung của nguyên văn, không tự xác định người ấy là quản gia hay đầy tớ của Giô-sép.
