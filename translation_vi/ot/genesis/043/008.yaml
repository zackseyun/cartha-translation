base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: vi
  text: 'Giu-đa thưa với cha mình là Y-sơ-ra-ên: “Xin cha cho cậu ấy[a] đi với con. Chúng con hãy đứng dậy và lên đường, để tất cả chúng ta được sống chứ không phải chết—chúng con, cha và các con nhỏ của chúng con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “người thanh niên ấy”. Từ Hê-bơ-rơ na‘ar có thể chỉ một thiếu niên hoặc thanh niên, không nhất thiết là một trẻ nhỏ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: thưa
  rationale: Động từ אמר trong lời con nói với cha được diễn đạt tự nhiên và đúng sắc thái kính trọng bằng “thưa”; mạch kể tiếp diễn đã rõ trong ngữ cảnh nên không cần thêm một liên từ máy móc.
- source_word: יְהוּדָה אֶל יִשְׂרָאֵל אָבִיו
  choice: Giu-đa thưa với cha mình là Y-sơ-ra-ên
  rationale: Giữ tên Y-sơ-ra-ên đúng theo bản Hê-bơ-rơ, không thay bằng Gia-cốp, đồng thời thể hiện rõ quan hệ cha con.
- source_word: שִׁלְחָה הַנַּעַר אִתִּי
  choice: Xin cha cho cậu ấy đi với con
  rationale: Trong ngữ cảnh người con nói với cha, “xin cha cho… đi” chuyển tải tự nhiên mệnh lệnh mang tính khẩn khoản. “Cậu ấy” tránh khiến người đọc hiện đại hiểu lầm Bên-gia-min là một bé trai, nhưng vẫn giữ cách quy chiếu mang sắc thái trẻ hơn của נַעַר.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: Chúng con sẽ lên đường
  rationale: Hai dạng cohortative diễn tả hành động được thúc giục và sắp thực hiện. “Lên đường” là cách nói Việt tự nhiên cho ý đứng dậy và đi, còn “chúng con” phù hợp với việc Giu-đa nói với cha.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: để tất cả chúng ta được sống chứ không phải chết
  rationale: “Để” thể hiện quan hệ mục đích/kết quả trong ngữ cảnh; “được sống chứ không phải chết” giữ nguyên thế đối lập nhấn mạnh của nguyên văn.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: chúng con, cha và các con nhỏ của chúng con
  rationale: Liệt kê đủ ba nhóm được nhấn mạnh bởi גַּם lặp lại. Đại từ thân tộc tự nhiên trong tiếng Việt phân biệt người nói với người cha; טַף được dịch là “các con nhỏ” để giữ nét nghĩa chỉ những người con còn nhỏ và dễ bị tổn thương.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng hệ thống đại từ thân tộc “cha–con/chúng con” thay cho đại từ trung tính để lời thoại tự nhiên trong tiếng Việt; cụm “tất cả chúng ta” thể hiện tính bao gồm của ba lần גַּם, rồi phần liệt kê làm rõ từng nhóm.
