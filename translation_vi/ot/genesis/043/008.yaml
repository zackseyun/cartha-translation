    rationale: Nguyên ngữ bày tỏ lời kêu gọi/đề nghị cùng hành động và nêu cả hai động tác “đứng dậy” và “đi”. Bản sửa dùng “Chúng con hãy đứng dậy và lên đường” để giữ lực này mà vẫn phù hợp cách xưng hô cha–con.
