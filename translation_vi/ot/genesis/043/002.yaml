  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: vi
  text: 'Khi họ đã ăn hết số ngũ cốc đem từ Ai Cập về, cha họ bảo: “Hãy trở lại mua cho chúng ta một ít lương thực.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Khi
  rationale: Công thức tự sự dẫn vào sự việc tiếp theo; tiếng Việt chỉ cần “Khi” là tự nhiên, vẫn thể hiện quan hệ thời gian mà không dịch máy móc “Và xảy ra khi”.
- source_word: כִּלּוּ לֶאֱכֹל
  choice: đã ăn hết
  rationale: Cấu trúc כלה với động từ nguyên mẫu diễn tả việc ăn cho đến hết; “đã ăn hết” tự nhiên và chính xác trong ngữ cảnh.
- source_word: הַשֶּׁבֶר
  choice: số ngũ cốc
  rationale: Trong truyện Giô-sép, danh từ này chỉ ngũ cốc được mua trong nạn đói. “Số ngũ cốc” vừa cụ thể vừa phù hợp với lượng hàng đã mang về.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: đem từ Ai Cập về
  rationale: “Đem… về” diễn đạt tự nhiên hướng chuyển động tới nơi gia đình đang ở; “đã” ở mệnh đề chính đã đủ xác lập hành động trước đó.
- source_word: אֲבִיהֶם
  choice: cha họ
  rationale: Giữ nguyên cách gọi theo quan hệ gia đình của tiếng Hê-bơ-rơ, không tự ý thay bằng tên Gia-cốp.
- source_word: שֻׁבוּ
  choice: Hãy trở lại
  rationale: Mệnh lệnh yêu cầu họ thực hiện chuyến đi trở lại Ai Cập. “Trở lại” trang trọng vừa phải và rõ nghĩa.
- source_word: שִׁבְרוּ
  choice: mua
  rationale: Trong ngữ cảnh này, động từ chỉ việc mua ngũ cốc hoặc lương thực; tân ngữ theo sau đã nêu rõ thứ cần mua.
- source_word: לָנוּ
  choice: cho chúng ta
  rationale: Diễn đạt rõ sắc thái lợi ích của giới từ לְ; “chúng ta” bao gồm người cha và các con đang được sai đi.
- source_word: מְעַט אֹכֶל
  choice: một ít lương thực
  rationale: אֹכֶל là từ khái quát chỉ thức ăn, rộng hơn הַשֶּׁבֶר. “Lương thực” hợp với bối cảnh nạn đói và vẫn giữ sự phân biệt từ vựng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch phân biệt “ngũ cốc” ở nửa đầu câu với từ khái quát hơn “lương thực” ở lời của người cha; không cần chú thích vì sự khác biệt đã được thể hiện trực tiếp trong chính văn.
