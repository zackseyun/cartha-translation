lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: đến gần
  rationale: Động từ נגשׁ ở dạng kể chuyện chỉ việc tiến lại gần một người; “đến gần” tự nhiên trong tiếng Việt và giữ được ý hướng đến.
- source_word: הָאִישׁ
  choice: người
  rationale: Nguyên văn nói “người ấy/người đàn ông”; trong tiếng Việt, “người quản lý” vừa tự nhiên vừa không cần thêm từ chỉ giới tính vốn đã rõ theo ngữ cảnh.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: người quản lý gia đình của Giô-sép
  rationale: Cấu trúc עַל בֵּית diễn tả quyền trông coi cơ nghiệp trong nhà. “Quản lý gia đình” truyền đạt trách nhiệm quản trị toàn bộ gia thất, không chỉ tòa nhà.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: và nói với ông
  rationale: דבר với אֶל có nghĩa là nói với ai; cách diễn đạt này làm nhịp cầu tự nhiên sang nội dung lời nói ở câu kế tiếp.
- source_word: פֶּתַח הַבָּיִת
  choice: tại lối vào nhà
  rationale: פֶּתַח có thể chỉ chỗ mở, lối vào hoặc cửa ra vào. “Lối vào nhà” rõ nghĩa, tự nhiên và phù hợp với cảnh họ nói trước khi vào hẳn bên trong.
