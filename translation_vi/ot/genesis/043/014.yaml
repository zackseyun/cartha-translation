  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: vi
  text: Xin Đức Chúa Trời Toàn Năng khiến người ấy thương xót các con[a] và cho người anh em kia[b] cùng Bên-gia-min trở về với các con. Còn cha, nếu mất con[c], thì cha đành mất con vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “ban cho các con lòng thương xót trước mặt người ấy.” Từ Hê-bơ-rơ רַחֲמִים có thể chỉ lòng thương xót, trắc ẩn hoặc thương cảm.'
    reason: lexical_alternative
  - marker: b
    text: “Người anh em kia” là Si-mê-ôn, người đã bị giữ lại tại Ai Cập.
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể hiểu: “Nếu cha mất các con, thì cha mất các con vậy,” hoặc: “Như cha đã mất con, thì cha vẫn mất con.” Tiếng Hê-bơ-rơ lặp lại cùng một động từ để nhấn mạnh sự cam chịu của Gia-cốp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  rationale: Dịch tước hiệu thần linh theo nghĩa quen thuộc, thay vì phiên âm “Ên Sa-đai”; cách dịch này rõ nghĩa với độc giả hiện đại và phù hợp với lời cầu xin về quyền năng bảo hộ của Đức Chúa Trời.
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: khiến người ấy thương xót các con
  rationale: רַחֲמִים có trường nghĩa gồm lòng thương xót, trắc ẩn và thương cảm. Cách diễn đạt tiếng Việt tự nhiên này truyền đạt lời cầu xin để viên quan đối xử khoan dung với các con Gia-cốp, dù cấu trúc Hê-bơ-rơ sát chữ là “ban cho các con lòng thương xót trước mặt người ấy”.
- source_word: וְשִׁלַּח לָכֶם
  choice: và trả ... về với các con
  rationale: Động từ שׁלח trong ngữ cảnh nói đến việc cho người đang bị giữ được trở về. “Trả ... về” diễn đạt rõ hướng trở về hàm ý trong לָכֶם.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: người anh em kia
  rationale: אַחֵר phân biệt người anh em đang bị giữ với Bên-gia-min. “Kia” tự nhiên trong mạch kể và không buộc phải xác định quan hệ anh hay em theo tuổi.
- source_word: וַאֲנִי
  choice: Còn cha
  rationale: Đại từ được đặt nổi bật để chuyển sang sự cam chịu riêng của Gia-cốp. Trong lời cha nói với các con, đại từ thân tộc “cha” tự nhiên và rõ hơn “tôi”.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: nếu phải mất con, thì cha đành mất con vậy
  rationale: Giữ sự lặp lại của động từ שׁכל và sắc thái cam chịu. “Đành” chuyển tải thái độ chấp nhận đau đớn mà không làm mất cấu trúc nhấn mạnh.
theological_decisions:
- issue: Cách dịch tước hiệu אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  alternative: Ên Sa-đai
  rationale: Dịch nghĩa giúp độc giả hiểu chức năng của tước hiệu trong lời khẩn cầu, đồng thời không gán thêm một cách giải thích giáo phái nào về nguồn gốc hoặc nội hàm chính xác của שַׁדַּי.
- issue: Sắc thái của lời kết về sự mất con
  choice: nếu phải mất con, thì cha đành mất con vậy
  alternative: như cha đã mất con, thì cha vẫn mất con
  rationale: כַּאֲשֶׁר có thể được hiểu theo sắc thái điều kiện trong công thức cam chịu; bản dịch giữ sự căng thẳng và lặp lại, nhưng ghi nhận cách hiểu liên hệ với nỗi mất con trước đó trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ thân tộc “cha—các con” theo ngữ cảnh gia đình; dùng “người ấy” cho viên quan Ai Cập vì Gia-cốp chưa biết đó là Giô-sép. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
