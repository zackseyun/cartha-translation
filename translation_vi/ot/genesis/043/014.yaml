  source_fidelity: Câu dịch truyền đạt đúng lời cầu chúc của Gia-cốp, tước hiệu אֵל שַׁדַּי, lòng thương xót trước viên quan, và lời cam chịu ở cuối câu. Tuy nhiên, “trả ... về” không thật phù hợp khi tân ngữ gồm cả Bên-gia-min, người chưa bị viên quan giữ để có thể được “trả” về. Động từ וְשִׁלַּח diễn tả việc viên quan cho cả người anh em đang bị giữ lẫn Bên-gia-min được trở về với các con.
