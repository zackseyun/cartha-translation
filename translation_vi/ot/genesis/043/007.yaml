  to: 'Họ đáp: “Người ấy đã hỏi cặn kẽ về chúng con và gia đình chúng con rằng: ‘Cha các anh còn sống không? Các anh còn người em nào không?’ Vì thế, chúng con đã trả lời ông ấy theo những điều đó. Làm sao chúng con có thể biết được ông ấy sẽ bảo: ‘Hãy đưa em các anh xuống đây’?”'
