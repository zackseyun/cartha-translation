base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: vi
  text: 'Họ đáp: “Người ấy đã hỏi cặn kẽ về chúng con và gia đình chúng con rằng: ‘Cha các anh còn sống không? Các anh còn người em nào không?’ Vì thế, chúng con đã trả lời ông ấy theo những điều đó. Làm sao chúng con có thể biết được ông ấy sẽ bảo: ‘Hãy đưa em các anh xuống đây’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: đã hỏi cặn kẽ
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh mức độ hoặc tính kỹ lưỡng của việc hỏi.
- source_word: מוֹלֶדֶת
  choice: gia đình
  rationale: Trong ngữ cảnh này, từ chỉ quan hệ huyết thống/gia tộc; “gia đình” là cách nói tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: theo những câu hỏi đó
  rationale: Nghĩa đen là “theo những lời/việc ấy”; trong mạch đối thoại, đây là lời đáp tương ứng với các điều người ấy đã hỏi.
- source_word: הֲיָדוֹעַ נֵדַע
  choice: Làm sao chúng con có thể biết được
  rationale: Cấu trúc nhấn mạnh kèm nghi vấn tu từ, diễn tả rằng họ không thể nào biết trước.
- source_word: הוֹרִידוּ
  choice: Hãy đưa ... xuống đây
  rationale: Giữ hình ảnh địa lý “đi xuống” Ai Cập, đồng thời thêm “đây” để lời truyền đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên; giữ lời biện giải mang tính nghi vấn tu từ của các con Gia-cốp. Đại từ “chúng con” phù hợp khi họ thưa với cha; “ông ấy/người ấy” chỉ người cai trị Ai Cập mà họ chưa nhận ra là Giô-sép.
