  terminology: “Quà biếu” phù hợp ngữ cảnh phi tế tự hơn “lễ vật”. “Số tiền gấp đôi,” “đi xuống Ai Cập,” “đứng trước mặt Giô-sép,” và các tên riêng theo bản nháp đều phù hợp.
  issues:
