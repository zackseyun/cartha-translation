revisions:
- from: Vậy, những người ấy mang theo lễ vật này, cầm theo số tiền gấp đôi và dẫn Bên-gia-min theo. Họ đứng dậy, đi xuống Ai Cập[a] và đứng trước mặt Giô-sép.
  to: Vậy, những người ấy lấy quà biếu này, mang theo số tiền gấp đôi và Bên-gia-min. Họ đứng dậy, đi xuống Ai Cập[a] và đứng trước mặt Giô-sép.
  rationale: Sửa “lễ vật” thành “quà biếu” để tránh hàm ý tế tự không có trong ngữ cảnh; sửa cách đưa Bên-gia-min theo để không thêm sắc thái “dẫn dắt”. Giữ nguyên trình tự kể chuyện, số tiền gấp đôi, thành ngữ địa lý “đi xuống,” và tư thế trình diện trước Giô-sép.
  reviewer_model: gpt-5.6-terra
