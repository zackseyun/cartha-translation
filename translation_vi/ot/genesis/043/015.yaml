    issue: “lễ vật”
    rationale: Trong tiếng Việt hiện đại, “lễ vật” thường gợi vật dâng trong nghi lễ, thờ cúng hoặc tế tự. מִנְחָה trong ngữ cảnh này là quà biếu gửi một quan chức, không nên tạo hàm ý tế tự.
  - severity: low
    issue: “dẫn Bên-gia-min theo”
    rationale: Cách nói này có thể gợi rằng họ dẫn dắt hoặc áp giải Bên-gia-min. Nguyên văn chỉ liệt kê Bên-gia-min như đối tượng họ lấy/đưa theo; nên diễn đạt trung tính hơn.
