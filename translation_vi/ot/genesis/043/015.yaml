base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: vi
  text: Vậy, những người ấy lấy quà biếu này, mang theo số tiền gấp đôi và Bên-gia-min. Họ đứng dậy, đi xuống Ai Cập[a] và đứng trước mặt Giô-sép.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đi xuống Ai Cập” là cách nói địa lý thông thường trong tiếng Hê-bơ-rơ về hành trình từ Ca-na-an đến Ai Cập.
    reason: cultural_note
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: lễ vật
  rationale: Trong trình thuật này, từ này chỉ món quà được đem biếu một người có địa vị cao để lấy thiện cảm, không phải của lễ thờ phượng. “Lễ vật” vừa trang trọng vừa phù hợp ngữ cảnh.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: số tiền gấp đôi
  rationale: Cụm từ chỉ lượng tiền gấp đôi so với khoản đã mang trước đó; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: כֶּסֶף
  choice: tiền
  rationale: Nghĩa đen là “bạc”, nhưng trong ngữ cảnh giao dịch, từ này chỉ phương tiện thanh toán, nên “tiền” truyền đạt đúng chức năng.
- source_word: בְיָדָם
  choice: cầm theo
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “trong tay họ”, diễn tả việc mang theo hoặc đang có trong tay; “cầm theo” tự nhiên trong tiếng Việt.
- source_word: וְאֶת־בִּנְיָמִן
  choice: và dẫn Bên-gia-min theo
  rationale: Bên-gia-min là tân ngữ tiếp theo của động từ “lấy/mang”; với một người, “dẫn ... theo” tự nhiên hơn mà vẫn giữ quan hệ cú pháp.
- source_word: וַיָּקֻמוּ
  choice: họ đứng dậy
  rationale: Giữ nghĩa cụ thể của động từ “đứng dậy”, đồng thời trong văn cảnh đây là hành động mở đầu việc lên đường.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: đi xuống Ai Cập
  rationale: Giữ cách diễn đạt địa lý quen thuộc trong tiếng Hê-bơ-rơ về hành trình từ Ca-na-an đến Ai Cập.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: đứng trước mặt Giô-sép
  rationale: Bám sát hình ảnh và tư thế trong nguyên văn, đồng thời diễn đạt rõ việc họ vào trình diện Giô-sép.
- source_word: הָאֲנָשִׁים
  choice: những người ấy
  rationale: Nguyên văn gọi họ là “những người”, không trực tiếp gọi là “các anh em”; “những người ấy” giữ cách gọi của câu và liên kết với văn cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp kể liên tiếp của nguyên văn, nhưng dùng “cầm theo” và “dẫn ... theo” để tránh lối diễn đạt gượng trong tiếng Việt. Tất cả tên riêng được phiên âm theo lối quen dùng trong bản dịch Kinh Thánh tiếng Việt.
