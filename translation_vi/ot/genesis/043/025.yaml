  text: And they prepared the gift until Joseph came at noon[a], because they had heard that they would eat bread there.
translation:
  language: vi
  text: Họ chuẩn bị sẵn món quà, chờ Giô-sép đến vào buổi trưa, vì họ đã nghe rằng họ sẽ dùng bữa ở đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ viết là “ăn bánh”, một cách nói chỉ việc dùng bữa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: Họ chuẩn bị
  rationale: Động từ Hiphil của כון có nghĩa làm cho sẵn sàng; “chuẩn bị” tự nhiên và giữ rõ lễ vật là đối tượng.
- source_word: הַמִּנְחָה
  choice: lễ vật
  rationale: Trong ngữ cảnh này, מִנְחָה là món quà kính biếu Giô-sép, không phải tế lễ. “Lễ vật” diễn đạt món quà được kính cẩn dâng biếu mà không nhất thiết mang nghĩa nghi lễ.
- source_word: עַד בּוֹא יוֹסֵף
  choice: để chờ Giô-sép đến
  rationale: עַד với בּוֹא chỉ việc chuẩn bị được duy trì cho tới lúc Giô-sép đến. Cách nói “để chờ ... đến” tự nhiên trong tiếng Việt và không hàm ý họ mất toàn bộ khoảng thời gian ấy mới chuẩn bị xong.
- source_word: בַּצָּהֳרָיִם
  choice: vào buổi trưa
  rationale: Danh từ chỉ thời điểm giữa ngày; “vào buổi trưa” là cách diễn đạt tiếng Việt tự nhiên.
- source_word: כִּי שָׁמְעוּ
  choice: vì họ đã nghe
  rationale: כִּי thứ nhất nêu nguyên nhân; “đã nghe” biểu thị thông tin có trước việc chuẩn bị.
- source_word: כִּי שָׁם
  choice: rằng ... tại đó
  rationale: כִּי thứ hai dẫn nội dung điều họ nghe, còn שָׁם chỉ nơi chốn.
- source_word: יֹאכְלוּ לָחֶם
  choice: họ sẽ dùng bữa
  rationale: Nghĩa đen là “ăn bánh”, nhưng đây là thành ngữ Hê-bơ-rơ chỉ việc ăn một bữa. “Dùng bữa” truyền đạt nghĩa trong tiếng Việt hiện đại; nghĩa đen được ghi ở chú thích.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dạng tên quen thuộc và nhất quán trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “lễ vật” theo nghĩa món quà kính biếu trong ngữ cảnh, không theo nghĩa tế lễ. Dấu chú thích được đặt sau mệnh đề “dùng bữa tại đó” vì chú thích giải thích thành ngữ יֹאכְלוּ לָחֶם.
