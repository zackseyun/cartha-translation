  source_fidelity: 'Bản dịch truyền đạt đúng mạch câu: họ chuẩn bị quà trước/sẵn để đợi Giô-sép đến vào buổi trưa, bởi đã nghe rằng họ sẽ ăn tại đó. Tuy nhiên, “lễ vật” dễ gợi một vật dâng trong nghi lễ hay tế tự, trong khi הַמִּנְחָה ở ngữ cảnh này là món quà biếu Giô-sép. Cụm “để chờ” có thể giữ được ý hướng chờ đợi, nhưng “chuẩn bị sẵn ... chờ” tự nhiên hơn và làm rõ hành động hoàn tất trước lúc ông đến.'
