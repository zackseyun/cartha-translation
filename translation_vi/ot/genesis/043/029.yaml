base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: vi
  text: 'Ông ngước mắt lên và thấy Bên-gia-min, em trai cùng mẹ với mình, rồi hỏi: “Đây có phải là người em út của các anh, người mà các anh đã nói với tôi không?” Rồi ông nói: “Nguyện Đức Chúa Trời ban ơn cho con, con ơi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Ông ngước mắt lên
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ nhưng diễn đạt tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: וַיַּרְא אֶת בִּנְיָמִין
  choice: thấy Bên-gia-min
  rationale: ראה mang nghĩa trực tiếp là “thấy”; tên riêng được phiên âm theo quy ước Kinh Thánh tiếng Việt.
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: em trai mình, là con trai của mẹ mình
  rationale: Giữ nguyên cấu trúc bổ nghĩa nhấn mạnh Bên-gia-min và Giô-sép cùng mẹ, thay vì nén nghĩa thành “em ruột”.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: người em út
  rationale: Trong bối cảnh gia đình, הַקָּטֹן chỉ người nhỏ tuổi nhất trong các anh em, không nói về vóc dáng.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: mà các ngươi đã nói với ta
  rationale: Bám sát cách diễn đạt của nguyên văn, đồng thời vẫn rõ và tự nhiên trong tiếng Việt.
- source_word: אֱלֹהִים יָחְנְךָ
  choice: xin Đức Chúa Trời ban ơn cho con
  rationale: Thể hiện đúng sắc thái cầu chúc của thể động từ và ý nghĩa gracious favor của חנן.
- source_word: בְּנִי
  choice: Con ơi
  rationale: Chuyển tải lối xưng hô thân ái “con trai của ta/con ta” bằng cách gọi tự nhiên, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Công thức chúc phước dùng אֱלֹהִים và động từ ở sắc thái cầu chúc
  choice: xin Đức Chúa Trời ban ơn cho con
  alternative: Đức Chúa Trời ban ơn cho con
  rationale: Từ “xin” làm rõ lực cầu chúc của nguyên văn mà không thêm nội dung thần học; danh xưng không bị đổi thành danh giao ước YHWH.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi/ta” để phản ánh lời của một quan chức Ai Cập đang nói với nhóm anh em trong bối cảnh cổ đại; dùng “Con ơi” để giữ sự chuyển giọng thân ái đối với Bên-gia-min.
