base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: vi
  text: 'Khi Giô-sép thấy Bên-gia-min ở cùng họ, ông nói với người quản lý nhà mình[a]: “Hãy đưa những người ấy vào nhà, làm thịt một con vật[b] và chuẩn bị sẵn, vì họ sẽ ăn với ta vào buổi trưa[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “người ở trên nhà mình”; cũng có thể dịch là “quản gia của mình.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng thành ngữ “giết một cuộc giết,” chỉ việc giết mổ một con vật để làm thức ăn.
    reason: cultural_note
  - marker: c
    text: Hay “vào giữa trưa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Động từ ראה ở đây diễn tả việc Giô-sép nhận thấy Bên-gia-min hiện diện cùng những người kia; “thấy” là cách dịch trực tiếp và tự nhiên.
- source_word: אִתָּם
  choice: đi cùng họ
  rationale: Giới từ kèm hậu tố cho biết Bên-gia-min ở cùng đoàn người ấy. “Đi cùng họ” phù hợp với ngữ cảnh họ vừa đến gặp Giô-sép.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: với người quản lý nhà mình
  rationale: Cụm Hê-bơ-rơ nói theo nghĩa đen về “người ở trên nhà mình,” tức người chịu trách nhiệm trông coi nhà và gia nhân. “Người quản lý nhà mình” rõ nghĩa, tự nhiên và không gán một chức danh quá chuyên biệt.
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: Hãy đưa những người này vào nhà
  rationale: Dạng chỉ hướng הַבָּיְתָה biểu thị chuyển động vào trong nhà. “Những người này” xác định nhóm người đang được Giô-sép nhắc đến trong tình huống.
- source_word: וּטְבֹחַ טֶבַח
  choice: làm thịt một con vật
  rationale: Kết cấu động từ–danh từ cùng gốc, theo nghĩa đen “giết một cuộc giết,” là thành ngữ chỉ việc giết mổ súc vật để làm thức ăn. Bản dịch nêu đối tượng hàm ẩn nhưng không xác định loài vật.
- source_word: וְהָכֵן
  choice: và chuẩn bị sẵn
  rationale: Mệnh lệnh Hiphil của כון có nghĩa “chuẩn bị, làm cho sẵn sàng.” Không thêm tân ngữ nhằm giữ độ mở của nguyên văn, dù theo ngữ cảnh điều được chuẩn bị là thức ăn hoặc bữa ăn.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: vì họ sẽ ăn với ta
  rationale: כִּי nêu lý do cho các mệnh lệnh. Đại từ “họ” tránh lặp nặng nề mà vẫn có tiền ngữ rõ; “ta” phù hợp lời của một người có địa vị cao nói với người thuộc quyền.
- source_word: בַּצָּהֳרָיִם
  choice: vào buổi trưa
  rationale: Danh từ chỉ thời điểm giữa ngày; “vào buổi trưa” là cách nói thông dụng trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các tên quen thuộc “Giô-sép” và “Bên-gia-min.” Các mệnh lệnh ngắn, trực tiếp, phù hợp lời chủ nhà truyền cho người quản lý; “ta” thể hiện tương quan địa vị trong ngữ cảnh mà không làm câu quá cổ.
