  terminology: Tên “Giô-sép” và “Bên-gia-min” nhất quán với cách phiên âm quen thuộc. “Người quản lý nhà mình” là cách diễn đạt trung tính, phù hợp với cụm “người ở trên nhà ông,” không áp đặt chức danh chuyên biệt. “Làm thịt một con vật” truyền đạt thành ngữ giết mổ để dùng trong bữa ăn mà không xác định loài vật.
