  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của tiếng Hê-bơ-rơ: Giô-sép thấy Bên-gia-min ở cùng nhóm, truyền cho người phụ trách nhà mình đưa nhóm người vào nhà, giết mổ con vật, chuẩn bị, vì họ sẽ ăn với ông vào buổi trưa. Tuy nhiên, “đi cùng họ” có thể gợi riêng hành động di chuyển, trong khi אִתָּם chỉ nói Bên-gia-min ở cùng họ; “ở cùng họ” sát nghĩa hơn. “Những người này” cũng được chỉnh thành “những người ấy” để phản ánh nhóm đã được nhắc đến, không thêm sắc thái chỉ trỏ gần.'
