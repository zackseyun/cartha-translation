  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: vi
  text: 'Họ thưa[a]: “Cha chúng tôi, là đầy tớ của ngài, bình an; người vẫn còn sống.” Rồi họ cúi mình và phủ phục.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “bình an” (shalom), ở đây chỉ tình trạng an lành hoặc khỏe mạnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: vẫn bình an
  rationale: Trong lời đáp về tình trạng của người cha, שָׁלוֹם chỉ sự an lành, khỏe mạnh. “Vẫn bình an” tự nhiên trong tiếng Việt và giữ được sắc thái của danh từ Hê-bơ-rơ.
- source_word: לְעַבְדְּךָ לְאָבִינוּ
  choice: Cha chúng tôi, là đầy tớ của ngài
  rationale: Hai cụm từ cùng chỉ một người. Cách diễn đạt này giữ lời xưng hô khiêm nhường trước bậc trên mà không khiến עבד bị hiểu quá mức là nô lệ theo nghĩa sở hữu.
- source_word: עוֹדֶנּוּ חָי
  choice: người vẫn còn sống
  rationale: “Vẫn còn” bảo toàn ý tiếp diễn của עוֹדֶנּוּ; đại từ “người” là cách gọi cha mẹ trang trọng, tự nhiên trong tiếng Việt.
- source_word: וַיִּקְּדוּ
  choice: họ cúi mình
  rationale: קדד mô tả động tác hạ thấp hoặc cúi thân thể.
- source_word: וישתחו
  choice: sấp mình xuống
  rationale: Động từ chỉ hành động phủ phục trước người có địa vị; cách dịch nêu rõ cử chỉ thân thể và không hàm ý đây là sự thờ phượng.
theological_decisions:
- issue: Ý nghĩa của động từ וישתחו trong ngữ cảnh triều kiến
  choice: sấp mình xuống
  alternative: thờ lạy
  rationale: Ngữ cảnh nói đến sự tôn kính mang tính xã hội đối với Giô-sép, không khẳng định hành vi thờ phượng. Bản dịch giữ hành động phủ phục mà không đưa thêm kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa”, “ngài” và “người” để thể hiện sự kính trọng trong lời nói; giữ hai động từ liên tiếp nhằm phản ánh hai cử chỉ cúi và phủ phục trong nguyên văn.
