- from: 'Họ thưa[a]: “Cha chúng tôi, là đầy tớ của ngài, vẫn bình an; người vẫn còn sống.” Rồi họ cúi mình và sấp mình xuống.'
  to: 'Họ thưa[a]: “Cha chúng tôi, là đầy tớ của ngài, bình an; người vẫn còn sống.” Rồi họ cúi mình và phủ phục.'
  rationale: Chỉnh nhẹ để không đưa sắc thái tiếp diễn vào “bình an,” vì nguyên văn dành ý này cho mệnh đề “vẫn còn sống.” Thay “sấp mình xuống” bằng “phủ phục” nhằm phản ánh chính xác và tự nhiên hơn hành vi được diễn tả bởi וישתחוו. Các lựa chọn xưng hô và chú thích được giữ lại.
