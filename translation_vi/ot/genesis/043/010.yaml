  text: כִּ֖י לוּלֵ֣א הִתְמַהְמָ֑הְנוּ כִּֽי עַתָּ֥ה שַׁ֖בְנוּ זֶ֥ה פַעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/010.yaml
  text: For if we had not delayed[b][a], by now we would have returned twice.
translation:
  language: vi
  text: Vì nếu chúng ta không chậm trễ[a], thì đến bây giờ chúng ta đã trở về hai lần rồi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nấn ná” hoặc “do dự.” Động từ Hê-bơ-rơ có thể chỉ việc chậm trễ, nấn ná hoặc do dự.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn có thể sát chữ là “trở về lần này hai lần.” Đây là một thành ngữ có nghĩa là “trở về hai lần.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Liên từ mở đầu lời giải thích của Giu-đa, nối câu này với lập luận trước đó.
- source_word: לוּלֵא
  choice: nếu ... không
  rationale: Diễn đạt điều kiện phản thực trong quá khứ một cách tự nhiên bằng tiếng Việt.
- source_word: הִתְמַהְמָהְנוּ
  choice: chúng ta không trì hoãn
  rationale: Động từ chỉ việc chậm trễ, nấn ná hoặc do dự; “trì hoãn” rõ nghĩa và phù hợp với việc chuyến đi bị hoãn lại.
- source_word: כִּי עַתָּה
  choice: thì đến bây giờ
  rationale: Trong kết cấu phản thực, cụm từ hướng đến kết quả lẽ ra đã hoàn tất trước thời điểm hiện tại.
- source_word: שַׁבְנוּ
  choice: chúng ta đã trở về được
  rationale: Dạng hoàn thành trong mệnh đề kết quả phản thực được diễn đạt tự nhiên bằng “đã ... được” sau mệnh đề “nếu ... không”.
- source_word: זֶה פַעֲמָיִם
  choice: hai lần
  rationale: Đây là một thành ngữ Hê-bơ-rơ có nghĩa “hai lần”; trong ngữ cảnh, họ lẽ ra đã hoàn tất hai lượt đi về.
