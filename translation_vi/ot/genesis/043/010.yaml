  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “nếu ... không ... thì ... đã ... rồi” giữ rõ sắc thái phản thực; “được” nhấn mạnh rằng thời gian đã đủ để hoàn tất hai lượt đi về.
