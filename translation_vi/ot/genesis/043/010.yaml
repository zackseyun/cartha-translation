- from: Vì nếu chúng ta không trì hoãn[a], thì đến bây giờ chúng ta đã trở về được hai lần[b] rồi.
  to: Vì nếu chúng ta không chậm trễ[a], thì đến bây giờ chúng ta đã trở về hai lần rồi[b].
  rationale: Đổi “trì hoãn” thành “chậm trễ” để câu tiếng Việt tự nhiên hơn mà không đổi nghĩa. Chỉnh chú thích b để ghi nhận yếu tố chỉ định trong thành ngữ Hê-bơ-rơ và tránh khẳng định một lối diễn đạt Việt ngữ gượng ép là nguyên văn.
