source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: vi
  text: 'Ngài phán: “Đừng giơ tay hại cậu bé, và đừng làm gì nó, vì bây giờ Ta biết con kính sợ Đức Chúa Trời, bởi con đã không giữ lại khỏi Ta con trai của con, người con duy nhất của con[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “con trai con, người duy nhất của con.” Cách gọi này nhấn mạnh địa vị độc nhất của người con trong ngữ cảnh giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: tra tay trên
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về việc đưa tay ra để dùng sức làm hại, đồng thời là cách diễn đạt trang trọng và dễ hiểu trong tiếng Việt.
- source_word: הַנַּעַר
  choice: cậu bé
  rationale: Từ này có thể chỉ bé trai hoặc người trẻ; “cậu bé” phù hợp với cách kể trong ngữ cảnh mà không dùng từ cổ.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: đừng làm gì nó
  rationale: 'Diễn đạt tự nhiên lệnh cấm tuyệt đối trong nguyên văn: không được làm bất cứ điều gì với người con.'
- source_word: עַתָּה יָדַעְתִּי
  choice: bây giờ ta biết
  rationale: Phản ánh trực tiếp nguyên văn và không giải thích giảm nhẹ sự căng thẳng thần học của lời tuyên bố.
- source_word: יְרֵא אֱלֹהִים
  choice: kính sợ Đức Chúa Trời
  rationale: “Kính sợ” vừa giữ yếu tố sợ vừa hàm ý tôn kính, là cách nói tự nhiên trong tiếng Việt Kinh Thánh.
- source_word: חָשַׂכְתָּ
  choice: không tiếc với ta
  rationale: Động từ có nghĩa là giữ lại, không trao hoặc không tiếc. Trong ngữ cảnh hiến dâng, “không tiếc” tự nhiên hơn “không giữ lại”, trong khi “với ta” giữ quan hệ của giới từ מִן.
- source_word: בִּנְךָ אֶת יְחִידְךָ
  choice: chính con trai mình, đứa con duy nhất
  rationale: Giữ cấu trúc nhấn mạnh đồng vị “con trai con, đứa con duy nhất của con”; “chính” làm rõ trọng tâm mà không thêm ý “yêu dấu” vốn không có trực tiếp trong từ.
- source_word: מִמֶּנִּי
  choice: với ta
  rationale: Trong kết cấu tiếng Việt “không tiếc ... với ta”, lựa chọn này truyền đạt tự nhiên ý không giữ người con lại khỏi Đức Chúa Trời; cách sát hình thức hơn là “khỏi ta” được ghi ở chú thích.
theological_decisions:
- issue: Tri thức của Đức Chúa Trời trong câu “bây giờ ta biết”
  choice: Giữ nguyên lời trực tiếp “bây giờ ta biết”.
  alternative: “bây giờ ta thấy rõ” hoặc “bây giờ điều đó đã được chứng tỏ”
  rationale: Nguyên văn nói rõ “bây giờ ta biết”. Bản dịch giữ nguyên sức căng thần học và không diễn giải câu này nhằm giải quyết trước vấn đề về sự toàn tri của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài/ta/con” phù hợp lời của sứ giả Đức Chúa Trời trong mạch văn; “nó” dùng tự nhiên để chỉ cậu bé, không mang sắc thái miệt thị. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
