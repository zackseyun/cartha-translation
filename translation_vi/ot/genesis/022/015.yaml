  yaml_path: translation/ot/genesis/022/015.yaml
  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: vi
  text: Thiên sứ của Yahweh gọi Áp-ra-ham lần thứ hai từ trời:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Sứ giả của Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: Động từ ở dạng wayyiqtol tiếp nối mạch kể chuyện; trong ngữ cảnh trực tiếp ngỏ lời, “gọi” là cách diễn đạt tự nhiên và không hàm ý phải kêu lớn.
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: מַלְאָךְ có thể chỉ “sứ giả” hoặc một hữu thể thiên giới; trong công thức lặp lại ở Sáng Thế Ký, “thiên sứ” phù hợp ngữ cảnh, còn chú thích giữ lại nghĩa từ nguyên khả dĩ “sứ giả”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự quen dùng, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל אַבְרָהָם
  choice: gọi Áp-ra-ham
  rationale: אֶל đánh dấu người nhận lời gọi; cấu trúc tiếng Việt “gọi Áp-ra-ham” tự nhiên hơn “gọi đến Áp-ra-ham” mà vẫn truyền đạt đúng quan hệ cú pháp.
- source_word: שֵׁנִית
  choice: lần thứ hai
  rationale: Diễn đạt rõ sắc thái số thứ tự của từ Hê-bơ-rơ, chính xác hơn cách nói khái quát “lại”.
- source_word: מִן הַשָּׁמַיִם
  choice: từ trời
  rationale: Dù שָׁמַיִם có hình thức số nhiều, “từ trời” là thành ngữ tiếng Việt tự nhiên trong ngữ cảnh tiếng phán từ cõi trời.
theological_decisions:
- issue: Cách dịch מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  alternative: sứ giả của Yahweh
  rationale: Bản dịch dùng cách gọi tự nhiên cho một hữu thể thiên giới nhưng không xác định thiên sứ này là thọ tạo hay là một sự hiện hiện đặc biệt của Đức Chúa Trời; chú thích bảo tồn khả năng dịch theo chức năng là “sứ giả”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Áp-ra-ham” theo lối phiên âm Kinh Thánh tiếng Việt; giữ “Yahweh” như danh riêng. Dấu hai chấm cuối câu báo trước nội dung lời phán ở câu kế tiếp.
