  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: vi
  text: 'Nhưng thiên sứ[a] của Yahweh từ trời gọi ông: “Áp-ra-ham, Áp-ra-ham!” Ông nói: “Tôi đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ giả của Yahweh”. Từ Hê-bơ-rơ מַלְאָךְ có thể chỉ “sứ giả” hoặc “thiên sứ”; ở đây, việc vị ấy gọi từ trời khiến nghĩa “thiên sứ” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֵלָיו
  choice: gọi ông
  rationale: Động từ קרא trong ngữ cảnh này chỉ việc cất tiếng gọi trực tiếp Áp-ra-ham; “gọi ông” tự nhiên và giữ đúng hướng của אֵלָיו.
- source_word: מַלְאַךְ יְהוָה
  choice: thiên sứ của Yahweh
  rationale: מַלְאָךְ có thể là “sứ giả” hoặc “thiên sứ”; bối cảnh tiếng gọi từ trời nghiêng về “thiên sứ”. Danh riêng giao ước יְהוָה được phiên là “Yahweh”.
- source_word: מִן הַשָּׁמַיִם
  choice: từ trời
  rationale: Dù הַשָּׁמַיִם có hình thức số nhiều trong tiếng Hê-bơ-rơ, “từ trời” là cách nói tự nhiên trong tiếng Việt và diễn đạt đúng cõi trời.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: Áp-ra-ham! Áp-ra-ham!
  rationale: Giữ nguyên sự lặp lại tên, thể hiện tính khẩn thiết và trực tiếp của tiếng gọi.
- source_word: הִנֵּנִי
  choice: Tôi đây
  rationale: Đây là công thức đáp lời biểu thị sự có mặt và sẵn sàng; “Tôi đây” tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Dùng “Yahweh” để thể hiện trực tiếp danh riêng trong nguyên văn, không thay bằng một tước hiệu.
- issue: Có nên hiểu מַלְאַךְ יְהוָה là chính Yahweh hiện ra hay không
  choice: thiên sứ của Yahweh
  alternative: Yahweh hiện ra trong hình dạng thiên sứ
  rationale: Bản dịch giữ cấu trúc và sự phân biệt trong câu, không áp đặt kết luận thần học về căn tính của thiên sứ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Dùng “ông” để nối mạch chỉ Áp-ra-ham; đặt dấu chấm than sau mỗi lần gọi tên nhằm truyền đạt tính khẩn thiết của lời gọi.
