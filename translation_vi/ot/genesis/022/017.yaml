  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: vi
  text: thì Ta chắc chắn sẽ ban phước cho con và làm cho dòng dõi con gia tăng thật nhiều, như sao trên trời và như cát ở bờ biển; dòng dõi con sẽ chiếm lấy cổng của những kẻ thù của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng “dòng dõi” ở dạng số ít mang nghĩa tập thể và dùng đại từ số ít trong cụm “kẻ thù của mình/người.” Cũng có thể dịch: “con cháu con sẽ chiếm lấy cổng của những kẻ thù của họ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: thì
  rationale: Trong mạch lời thề bắt đầu ở câu trước, כִּי dẫn vào nội dung lời Đức Chúa Trời tuyên phán. “Thì” nối câu tự nhiên trong tiếng Việt; sức nhấn mạnh được thể hiện ở các kết cấu tiếp theo.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: Ta chắc chắn sẽ ban phước cho con
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn và cường độ của hành động; cách dịch này tự nhiên mà vẫn giữ được sắc thái ấy.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: và làm cho dòng dõi con gia tăng thật nhiều
  rationale: Kết cấu nguyên mẫu tuyệt đối cộng động từ hữu hạn vừa nhấn mạnh vừa gợi mức độ lớn. “Gia tăng thật nhiều” tự nhiên hơn lối lặp sát chữ trong tiếng Việt.
- source_word: זַרְעֲךָ
  choice: dòng dõi con
  rationale: זֶרַע là danh từ số ít mang nghĩa tập thể, chỉ hậu duệ. “Dòng dõi” giữ được ý nghĩa tập thể và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: như sao trên trời
  rationale: Cách nói tiếng Việt tự nhiên, trang trọng, truyền đạt đầy đủ hình ảnh số lượng vô vàn mà không sao chép máy móc hình thái số nhiều của שָׁמַיִם.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: và như cát ở bờ biển
  rationale: שְׂפַת הַיָּם theo nghĩa đen là “mép/môi biển,” nhưng thành ngữ tự nhiên là “bờ biển.” Mệnh đề quan hệ אֲשֶׁר עַל được diễn đạt gọn bằng “ở” mà không mất nghĩa.
- source_word: וְיִרַשׁ
  choice: sẽ chiếm lấy
  rationale: יָרַשׁ có thể mang nghĩa thừa hưởng, sở hữu hoặc chiếm hữu. Với “cổng thành của kẻ thù,” “chiếm lấy” thể hiện hành động giành quyền kiểm soát rõ hơn “thừa hưởng.”
- source_word: שַׁעַר
  choice: cổng thành
  rationale: “Cổng” là nghĩa trực tiếp, nhưng trong bối cảnh chiến thắng trước kẻ thù, đây là cổng của thành và là hình ảnh hoán dụ về quyền kiểm soát thành ấy. “Cổng thành” làm rõ sở chỉ tự nhiên trong tiếng Việt.
- source_word: אֹיְבָיו
  choice: của những kẻ thù mình
  rationale: Hậu tố đại từ trong tiếng Hê-bơ-rơ là số ít, hòa hợp với danh từ tập thể số ít זֶרַע. Đại từ phản thân “mình” trong tiếng Việt không đánh dấu số, nhờ đó giữ được tính tập thể và không ép câu theo hướng một cá nhân hay nhiều cá nhân.
theological_decisions:
- issue: Danh từ tập thể số ít זֶרַע và hậu tố đại từ số ít trong mệnh đề cuối
  choice: “dòng dõi con ... những kẻ thù mình”
  alternative: “con cháu con ... những kẻ thù của họ” hoặc “dòng dõi con ... những kẻ thù của người”
  rationale: “Dòng dõi” bảo tồn ý nghĩa tập thể của danh từ số ít; “mình” tránh áp đặt số lên đại từ sở hữu. Cách dịch này duy trì sự căng giữa nghĩa tập thể và hình thức số ít trong nguyên văn, không tự ý quyết định cách hiểu thần học theo hướng cá nhân hay thuần túy số nhiều.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” phù hợp lời Đức Chúa Trời phán trực tiếp với Áp-ra-ham. Cụm “cổng thành” giữ hình ảnh Kinh Thánh đồng thời giúp độc giả hiện đại nhận ra đây không chỉ là một chiếc cổng thông thường.
