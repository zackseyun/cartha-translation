  to: thì Ta chắc chắn sẽ ban phước cho con và làm cho dòng dõi con gia tăng thật nhiều, như sao trên trời và như cát ở bờ biển; dòng dõi con sẽ chiếm lấy cổng của những kẻ thù của mình.[a]
