  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּ/בֹּ֗קֶר וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י נְעָרָי/ו֙ אִתּ֔/וֹ וְ/אֵ֖ת יִצְחָ֣ק בְּנ֑/וֹ וַ/יְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ אֶל הַ/מָּק֖וֹם אֲשֶׁר אָֽמַר ל֥/וֹ הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: vi
  text: Áp-ra-ham dậy từ sáng sớm, thắng yên cho con lừa của mình, đem theo hai người trai trẻ[a] và Y-sác, con trai ông. Ông bổ củi cho lễ thiêu, rồi đứng dậy và đi đến nơi Đức Chúa Trời đã bảo ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hai người đầy tớ của ông” hoặc “hai người hầu cận của ông”; từ Hê-bơ-rơ נְעָרִים có thể chỉ những người trai trẻ hoặc những người nam phục dịch, tùy theo ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: dậy sớm vào buổi sáng
  rationale: Diễn đạt cả ý dậy sớm của động từ và mốc thời gian buổi sáng, đồng thời giữ sắc thái Áp-ra-ham mau chóng thực hiện lời truyền bảo.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: thắng yên cho con lừa của mình
  rationale: Trong bối cảnh chuẩn bị lên đường, חבש chỉ việc buộc yên hoặc hành trang vào lừa; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: שְׁנֵי נְעָרָיו
  choice: hai người trai trẻ
  rationale: נַעַר có thể chỉ người trẻ tuổi hoặc người hầu cận. Bản dịch chính giữ nghĩa tuổi tác mà không xác định quá mức địa vị của họ; chú thích bảo tồn các khả năng theo ngữ cảnh.
- source_word: יִצְחָק בְּנוֹ
  choice: Y-sác, con trai ông
  rationale: Giữ quan hệ đồng vị và nhấn mạnh mối quan hệ cha con như trật tự Hê-bơ-rơ.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: bổ củi cho lễ thiêu
  rationale: בקע có nghĩa là bổ hoặc chẻ; עֹלָה là thuật ngữ tế lễ chỉ lễ vật được thiêu dâng. Cách diễn đạt này gọn, tự nhiên và giữ đúng hành động cụ thể.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: rồi đứng dậy đi
  rationale: Giữ lại cả hai động từ nối tiếp của nguyên văn thay vì rút gọn thành một động từ như “lên đường”.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: Đức Chúa Trời đã phán bảo ông
  rationale: Thì quá khứ hoàn thành được thể hiện bằng “đã”, vì lời chỉ dẫn có trước chuyến đi; “phán bảo” phù hợp với lời Đức Chúa Trời truyền cho Áp-ra-ham mà không thêm nội dung giải thích.
theological_decisions:
- issue: Cách dịch thuật ngữ tế lễ עֹלָה
  choice: lễ thiêu
  alternative: lễ thiêu toàn phần
  rationale: “Lễ thiêu” giữ thuật ngữ tế lễ rõ ràng và quen hiểu, trong khi không thêm từ “toàn phần” vốn giải thích đặc điểm của nghi lễ hơn là dịch trực tiếp hình thức ngắn gọn của từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu chữ dễ hiểu đối với độc giả phổ thông. Dùng cách phiên âm tên riêng quen thuộc “Áp-ra-ham” và “Y-sác”. Dấu chú thích được đặt ngay sau cụm từ thực sự có điểm mơ hồ về từ vựng.
