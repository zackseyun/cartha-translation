  to: Áp-ra-ham dậy từ sáng sớm, thắng yên cho con lừa của mình, đem theo hai người trai trẻ[a] và Y-sác, con trai ông. Ông bổ củi cho lễ thiêu, rồi đứng dậy và đi đến nơi Đức Chúa Trời đã bảo ông.
