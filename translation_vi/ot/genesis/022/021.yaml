base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
translation:
  language: vi
  text: Út-xơ, con trai đầu lòng của Na-cô; Bu-xơ, em trai của Na-cô; và Kê-mu-ên, cha của A-ram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Kê-mu-ên, tổ phụ của A-ram.” Trong các gia phả, “cha” đôi khi có thể chỉ một tổ tiên hoặc người khai tổ, chứ không nhất thiết là cha trực tiếp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וּץ
  choice: Út-xơ
  rationale: Tên riêng được phiên âm theo lối quen thuộc và dễ đọc trong tiếng Việt.
- source_word: בְּכֹר֖וֹ
  choice: con trưởng nam của ông
  rationale: בכור chỉ người con trai đầu lòng; cách diễn đạt này giữ cả thứ tự sinh lẫn sắc thái gia phả. Đại từ sở hữu tiếp nối ngữ cảnh nói về Na-cô.
- source_word: בּ֣וּז
  choice: Bu-xơ
  rationale: Phiên âm tên riêng sang tiếng Việt, không dịch nghĩa.
- source_word: אָחִ֑יו
  choice: người anh em của Út-xơ
  rationale: אָח nghĩa là anh hoặc em trai. Vì tiếng Hê-bơ-rơ không tự xác định anh hay em, bản dịch dùng “người anh em” để tránh thêm điều văn bản không nói trực tiếp; đại từ được làm rõ là chỉ Út-xơ theo cấu trúc liệt kê.
- source_word: קְמוּאֵ֖ל
  choice: Kê-mu-ên
  rationale: Phiên âm tên riêng sang tiếng Việt theo dạng rõ âm và quen dùng.
- source_word: אֲבִ֥י
  choice: cha của
  rationale: Đây là nghĩa trực tiếp, tự nhiên trong gia phả; nghĩa rộng hơn là tổ phụ hoặc người khai tổ được giữ trong chú thích.
- source_word: אֲרָֽם
  choice: A-ram
  rationale: Phiên âm tên riêng; không đồng nhất tên này với một dân tộc hay lãnh thổ ngoài điều câu văn nói.
theological_decisions:
- issue: Ý nghĩa gia phả của אֲבִי אֲרָם
  choice: Kê-mu-ên, cha của A-ram
  alternative: Kê-mu-ên, tổ phụ của A-ram
  rationale: “Cha của” phản ánh trực tiếp cấu trúc Hê-bơ-rơ. Tuy nhiên, trong gia phả, אָב đôi khi có thể chỉ tổ tiên hoặc người khai tổ, nên khả năng ấy được nêu ở chú thích mà không áp đặt vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu chấm phẩy để thể hiện rõ ba thành phần của danh sách vốn tiếp nối câu trước. Chú thích [a] được đặt sau “A-ram”, đúng với từ ngữ mà chú thích giải thích.
