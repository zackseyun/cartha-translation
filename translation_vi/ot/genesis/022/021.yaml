  source_fidelity: Cần sửa quan hệ thân tộc của Bu-xơ. Hậu tố sở hữu trong אָחִיו (“anh/em trai của ông ấy”) quy chiếu về Na-cô, nhân vật chủ đạo của câu trước trong gia phả, không phải về Út-xơ. Bản dịch hiện tại vì thế đảo sai quan hệ gia phả. “Cha của A-ram” phản ánh trực tiếp אֲבִי אֲרָם; chú thích về nghĩa rộng trong gia phả là phù hợp.
