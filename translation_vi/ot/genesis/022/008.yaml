base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: vi
  text: 'Áp-ra-ham đáp: “Đức Chúa Trời sẽ tự lo liệu con vật dùng cho lễ toàn thiêu, con ơi.”[a] Thế là hai cha con cùng đi tiếp.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát nghĩa hơn: “Đức Chúa Trời sẽ thấy con vật dùng cho lễ toàn thiêu cho chính Ngài.” Động từ Hê-bơ-rơ có nghĩa là “thấy”, hoặc theo nghĩa thành ngữ trong ngữ cảnh này là “lo liệu, cung cấp”. “Con vật” dịch một từ có thể chỉ chiên hoặc dê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Áp-ra-ham đáp
  rationale: Động từ nói tiếp nối lời hỏi của Y-sác, nên “đáp” tự nhiên trong tiếng Việt và vẫn giữ diễn tiến của câu chuyện.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh xưng thông dụng, trang trọng trong tiếng Việt dành cho Đức Chúa Trời trong lời Áp-ra-ham.
- source_word: יִרְאֶה לּוֹ
  choice: chính Đức Chúa Trời sẽ lo liệu cho mình
  rationale: יִרְאֶה có nghĩa đen là “sẽ thấy” nhưng trong ngữ cảnh mang nghĩa thành ngữ “sẽ lo liệu/cung ứng”; “cho mình” phản ánh לּוֹ, còn “chính” giúp câu tiếng Việt tự nhiên mà vẫn nhấn mạnh Đức Chúa Trời đích thân lo liệu.
- source_word: הַשֶּׂה
  choice: con vật
  rationale: שֶׂה chỉ một con thuộc đàn gia súc nhỏ, có thể là chiên hoặc dê; “con vật” tránh thu hẹp nghĩa thành “chiên con” khi nguyên ngữ không xác định loài.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: עֹלָה là sinh tế được thiêu trọn; “lễ thiêu” là cách diễn đạt rõ, gọn và trang trọng.
- source_word: בְּנִי
  choice: Con ơi
  rationale: Giữ lời xưng hô thân tình của người cha với con và phù hợp khẩu ngữ trang trọng trong tiếng Việt.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: Rồi hai cha con tiếp tục cùng đi
  rationale: “Hai cha con” diễn đạt tự nhiên “cả hai người” theo quan hệ đã rõ; “cùng đi” giữ sự nhấn mạnh của יַחְדָּו, còn “tiếp tục” thể hiện họ lại đi sau đoạn đối thoại.
theological_decisions:
- issue: Ý nghĩa lời Áp-ra-ham về hành động của Đức Chúa Trời
  choice: Đức Chúa Trời sẽ lo liệu cho mình con vật làm lễ thiêu
  alternative: Đức Chúa Trời sẽ thấy cho mình con vật làm lễ thiêu
  rationale: Bản dịch chính chuyển nghĩa thành ngữ trong ngữ cảnh nhưng chú thích giữ nghĩa đen “thấy”. Cách dịch không quyết định Áp-ra-ham đang né tránh, bày tỏ đức tin hay nói tiên tri, nhờ đó bảo toàn sức căng của câu chuyện.
- issue: Phạm vi nghĩa của הַשֶּׂה
  choice: con vật
  alternative: con chiên
  rationale: Từ Hê-bơ-rơ có thể chỉ chiên hoặc dê thuộc đàn gia súc nhỏ. Không thu hẹp thành “con chiên” giúp tránh đưa một cách hiểu thần học cụ thể vào chỗ nguyên văn còn rộng nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Trật tự lời gọi “Con ơi” được đưa lên đầu câu nói cho tự nhiên. Dùng “hai cha con” thay cho “cả hai người” vì quan hệ đã rõ trong ngữ cảnh; giữ “cùng đi” để bảo toàn mô-típ lặp lại của câu chuyện.
