base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: vi
  text: 'Áp-ra-ham nói với các chàng trai của ông: “Hãy ở lại đây với con lừa. Tôi và cậu bé sẽ đi tới đằng kia, thờ phượng[a], và chúng tôi sẽ trở lại với các anh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sấp mình xuống”; động từ Hê-bơ-rơ có thể chỉ hành động phủ phục, thường là để thờ phượng.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn lời Áp-ra-ham ở dạng số nhiều: “chúng tôi sẽ trở lại với các anh.” Bản văn không giải thích đây là lời che giấu, sự kỳ vọng hay lòng tin vào sự chu cấp của Đức Chúa Trời.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: hai người trai trẻ của mình
  rationale: נַעַר có thể chỉ người trẻ, người hầu hoặc người theo hầu. Cách dịch này phù hợp với hai người cùng đi được nhắc ở câu 3, đồng thời giữ sắc thái tuổi tác mà không mặc nhiên xác định địa vị của họ là đầy tớ.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: Hãy ở lại đây
  rationale: יָשַׁב có nghĩa cơ bản là ngồi, ở hoặc lưu lại; trong mệnh lệnh không được đi tiếp, “ở lại đây” là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: עִם הַחֲמוֹר
  choice: với con lừa
  rationale: חֲמוֹר là từ thông dụng chỉ con lừa; cách dịch trực tiếp này tự nhiên trong tiếng Việt hiện đại.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: Tôi và cậu bé
  rationale: נַעַר ở đây chỉ Y-sác theo cách Áp-ra-ham nói về con mình. “Cậu bé” giữ được góc nhìn ấy mà không buộc phải xác định chính xác tuổi của Y-sác.
- source_word: נֵלְכָה עַד כֹּה
  choice: sẽ đi đến đằng kia
  rationale: Cụm này diễn tả ý định đi tới một địa điểm khác được chỉ ra; “đến đằng kia” truyền đạt tự nhiên sắc thái chỉ nơi chốn.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: thờ phượng
  rationale: שָׁחָה về nghĩa cụ thể là cúi hoặc sấp mình, nhưng trong bối cảnh dâng tế lễ, hành động ấy mang ý nghĩa thờ phượng. Chú thích giữ lại nghĩa động tác.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: rồi chúng tôi sẽ trở lại với các anh
  rationale: Động từ ở ngôi thứ nhất số nhiều được giữ rõ bằng “chúng tôi”; “rồi” thể hiện trình tự tự nhiên của các hành động mà không giải thích động cơ hay mức độ chắc chắn trong lời Áp-ra-ham.
theological_decisions:
- issue: Dạng số nhiều trong lời Áp-ra-ham nói về việc trở lại
  choice: 'Giữ nguyên nghĩa số nhiều: “chúng tôi sẽ trở lại với các anh.”'
  alternative: Diễn giải đây là lời che giấu ý định, hoặc là lời bày tỏ đức tin rằng cả Áp-ra-ham lẫn Y-sác đều sẽ trở về.
  rationale: Bản Hê-bơ-rơ dùng dạng ngôi thứ nhất số nhiều cho cả việc thờ phượng lẫn trở lại. Bản dịch giữ nguyên sự căng thẳng thần học và không quyết định thay văn bản rằng Áp-ra-ham đang che giấu, kỳ vọng hay tin chắc vào sự chu cấp của Đức Chúa Trời.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “tôi”, “các anh” tự nhiên trong lời trực tiếp; tên riêng dùng dạng Việt hóa quen thuộc. Các chú thích được đặt đúng ngay sau những cụm từ cần giải thích.
