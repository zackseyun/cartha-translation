  rationale: Bản sửa bỏ số từ không có trong chính câu, cải thiện cách diễn đạt chỉ hướng đi, và dời mốc chú thích b đến đúng lời tuyên bố số nhiều về việc trở lại. Các hình thức số nhiều trong tiếng Hê-bơ-rơ được giữ nguyên; bản dịch không quyết định liệu lời nói của Áp-ra-ham là che giấu, mong đợi, hay tin cậy vào sự chu cấp của Đức Chúa Trời.
