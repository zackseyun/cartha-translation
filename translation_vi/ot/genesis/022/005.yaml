revisions:
- from: 'Áp-ra-ham nói với hai người trai trẻ của mình: “Hãy ở lại đây với con lừa. Tôi và cậu bé sẽ đi đến đằng kia, thờ phượng[a], rồi chúng tôi sẽ trở lại với các anh[b].”'
