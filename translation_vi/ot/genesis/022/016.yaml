id: GEN.22.16
reference: Genesis 22:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: vi
  text: 'và phán: “Ta đã lấy chính mình mà thề—Yahweh tuyên phán—vì ngươi đã làm điều này và không giữ lại[a] con trai ngươi, đứa con duy nhất[b] của ngươi,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không tiếc” hoặc “không giữ riêng lại.”
    reason: Động từ Hê-bơ-rơ có thể mang nghĩa giữ lại, kìm lại hoặc, trong ngữ cảnh này, không tiếc.
  - marker: b
    text: Từ Hê-bơ-rơ có thể có nghĩa là “duy nhất” hoặc “độc nhất, có một không hai.”
    reason: Giữ lại phạm vi nghĩa của יָחִיד và sự căng thẳng trong ngữ cảnh thay vì xác định quá mức.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: và phán
  rationale: Động từ tiếp nối mạch kể; chủ ngữ đã rõ từ ngữ cảnh nên không cần thêm đại từ. “Phán” phù hợp với lời nói long trọng của Đức Chúa Trời.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Ta lấy chính mình mà thề
  rationale: Giữ nguyên công thức thề bằng chính bản thân người nói và sắc thái của thể hoàn thành có hiệu lực hiện tại.
- source_word: נְאֻם יְהוָה
  choice: Yahweh tuyên phán
  rationale: נְאֻם là công thức công bố trang trọng; dùng danh riêng Yahweh cho יהוה thay vì thay thế bằng một tước hiệu.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: vì
  rationale: Cụm từ nhấn mạnh quan hệ nguyên nhân; “vì” truyền đạt tự nhiên trong tiếng Việt mà không tạo sự lặp thừa.
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: ngươi đã làm điều này
  rationale: דָּבָר ở đây chỉ hành động vừa được kể; “điều này” rõ ràng và tự nhiên.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: và không giữ lại
  rationale: חָשַׂךְ có nghĩa giữ lại hoặc không trao; cách dịch này bảo toàn ý cơ bản mà không mặc nhiên chọn sắc thái mạnh hơn là “không tiếc”.
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: con trai ngươi, đứa con duy nhất của ngươi
  rationale: Giữ cấu trúc đồng vị và sự nhấn mạnh của nguyên văn. יָחִיד có thể chỉ người con duy nhất hoặc độc nhất/đặc biệt, nên ghi chú phương án từ vựng.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của יְחִידְךָ đối với Y-sác
  choice: đứa con duy nhất của ngươi
  alternative: đứa con độc nhất của ngươi; đứa con có một không hai của ngươi
  rationale: Bản dịch giữ cách diễn đạt nổi bật của tiếng Hê-bơ-rơ và không giải quyết ngầm sự căng thẳng do Áp-ra-ham còn có Ích-ma-ên; chú thích nêu phạm vi nghĩa “duy nhất/độc nhất” mà không gia tăng hàm ý thần học về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/ngươi” để phản ánh lời tuyên phán trực tiếp, long trọng mà không thêm quan hệ thân tộc không có trong đại từ Hê-bơ-rơ. Dấu gạch ngang làm rõ công thức xen giữa “Yahweh tuyên phán”.
