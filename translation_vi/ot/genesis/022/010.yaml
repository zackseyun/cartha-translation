  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: vi
  text: Rồi Áp-ra-ham đưa tay ra, cầm lấy con dao để sát tế con trai mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ được dịch là “sát tế” cụ thể hơn từ “giết” nói chung; từ này thường chỉ việc giết mổ và có thể mang sắc thái hiến tế.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: đưa ... ra
  rationale: Trong ngữ cảnh này, động từ chỉ việc đưa tay ra, không phải sai phái; cách diễn đạt này tự nhiên và giữ được hành động cụ thể.
- source_word: יָדוֹ
  choice: tay
  rationale: Dịch trực tiếp danh từ số ít với hậu tố sở hữu; tiếng Việt diễn đạt tự nhiên là “đưa tay ra,” không cần lặp “của mình”.
- source_word: וַיִּקַּח
  choice: cầm lấy
  rationale: Diễn tả hành động lấy dụng cụ trong chuỗi kể chuyện, tự nhiên hơn “lấy” đơn thuần mà không nhấn quá mức như “nắm chặt”.
- source_word: הַמַּאֲכֶלֶת
  choice: con dao
  rationale: Danh từ chỉ dụng cụ cắt dùng khi giết thịt; “con dao” rõ ràng, tự nhiên và không thêm độ chuyên biệt mà ngữ cảnh chưa buộc phải có.
- source_word: לִשְׁחֹט
  choice: để giết tế
  rationale: Động từ שׁחט cụ thể hơn “giết” nói chung và thường được dùng cho việc giết súc vật, kể cả trong hiến tế. “Giết tế” giữ sắc thái nghi lễ và sức nặng của cảnh này.
- source_word: בְּנוֹ
  choice: con trai mình
  rationale: Chuyển đạt trực tiếp quan hệ sở hữu; “mình” quy chiếu tự nhiên về Áp-ra-ham trong tiếng Việt.
- source_word: וַ
  choice: Rồi
  rationale: Liên từ kể chuyện thúc đẩy trình tự sự việc; “Rồi” tự nhiên trong văn kể tiếng Việt hiện đại.
theological_decisions:
- issue: Có nên dịch שָׁחַט bằng một từ mang sắc thái hiến tế hay không
  choice: để giết tế
  alternative: để giết; để sát tế
  rationale: Trong bối cảnh việc dâng Y-sác và theo phạm vi nghĩa thông dụng của động từ, “giết tế” bảo tồn cả hành động giết và sắc thái nghi lễ mà không áp đặt một kết luận thần học về ý nghĩa của biến cố.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “Áp-ra-ham” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc; câu giữ nhịp hành động liên tiếp của nguyên văn.
