  text: וַ/יִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא יְהוָ֣ה יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר הַ/יּ֔וֹם בְּ/הַ֥ר יְהוָ֖ה יֵרָאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: vi
  text: 'Áp-ra-ham đặt tên nơi ấy là “ĐỨC CHÚA sẽ liệu cho.”[a] Như người ta vẫn nói cho đến ngày nay: “Trên núi của ĐỨC CHÚA, điều ấy sẽ được liệu cho.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ĐỨC CHÚA sẽ thấy.” Trong ngữ cảnh này, “thấy” cũng hàm ý nhìn thấy nhu cầu và liệu cho.'
    reason: Bảo tồn nghĩa từ vựng cơ bản và lối chơi chữ của nguyên văn.
  - marker: b
    text: 'Nguyên văn có thể dịch là: “Trên núi của ĐỨC CHÚA, điều ấy sẽ được thấy,” hoặc “ĐỨC CHÚA sẽ hiện ra.” Câu này lặp lại động từ “thấy” trong tên gọi ở vế trước.'
    reason: Ghi nhận hình thức bị động và sự mơ hồ có thật của יֵרָאֶה, vốn không thể tái hiện trọn vẹn bằng một cách dịch tiếng Việt duy nhất.
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: đặt tên nơi ấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt cho thành ngữ Hê-bơ-rơ mang nghĩa đen là “gọi tên của nơi ấy”.
- source_word: יְהוָה
  choice: ĐỨC CHÚA
  rationale: Dùng cách gọi trang trọng, quen thuộc trong tiếng Việt để biểu thị danh riêng YHWH, đồng thời tránh áp đặt một cách phiên âm riêng của truyền thống hệ phái.
- source_word: יִרְאֶה
  choice: sẽ liệu cho
  rationale: Động từ có nghĩa cơ bản là “sẽ thấy”, nhưng trong ngữ cảnh Đức Chúa Trời nhìn thấy nhu cầu và cung ứng con sinh tế, “liệu cho” truyền đạt hàm ý ngữ cảnh mà vẫn giữ được sự súc tích của tên gọi.
- source_word: יֵרָאֶה
  choice: sẽ được liệu cho
  rationale: Hình thức bị động của động từ “thấy” tạo lối chơi chữ với יִרְאֶה. Bản dịch dùng cấu trúc bị động tương ứng với câu trước để tái tạo phần nào sự liên kết, còn nghĩa đen được ghi trong chú thích.
- source_word: אֲשֶׁר יֵאָמֵר הַיּוֹם
  choice: Vì vậy, cho đến ngày nay người ta vẫn nói
  rationale: Chuyển cấu trúc bị động vô nhân xưng sang cách nói tự nhiên trong tiếng Việt; “ngày nay” ở đây chỉ thời điểm của người kể.
theological_decisions:
- issue: Mối liên hệ giữa nghĩa “thấy/hiện ra” và nghĩa “liệu cho/cung ứng”
  choice: Dùng “liệu cho” trong chính văn và bảo tồn nghĩa đen cùng lối chơi chữ trong chú thích
  alternative: Dịch sát là “ĐỨC CHÚA sẽ thấy” và “sẽ được thấy/Ngài sẽ hiện ra”
  rationale: Ngữ cảnh con chiên đực được cung ứng ủng hộ nghĩa hàm ẩn “liệu cho”, nhưng nguyên văn vẫn cố ý dùng động từ “thấy”; chú thích giữ lại độ mở và căng thẳng ngữ nghĩa thay vì xóa bỏ chúng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, câu văn dễ đọc đối với độc giả phổ thông. “Liệu cho” tự nhiên và gọn hơn “cung cấp” trong một tên địa danh, đồng thời phù hợp với bối cảnh Đức Chúa Trời chuẩn bị sinh tế. Viết hoa “ĐỨC CHÚA” để biểu thị danh YHWH.
