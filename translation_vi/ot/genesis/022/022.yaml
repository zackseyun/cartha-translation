  text: וְ/אֶת כֶּ֣שֶׂד וְ/אֶת חֲז֔וֹ וְ/אֶת פִּלְדָּ֖שׁ וְ/אֶת יִדְלָ֑ף וְ/אֵ֖ת בְּתוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/022.yaml
  text: Kesed[a], Hazo, Pildash, Jidlaph, and Bethuel.
translation:
  language: vi
  text: Kê-sết, Ha-xô, Phi-đát, Díp-láp và Bê-tu-ên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּשֶׂד
  choice: Kê-sết
  rationale: Tên riêng được phiên âm theo âm Hebrew và trình bày bằng chính tả tiếng Việt dễ đọc; không dịch nghĩa tên.
- source_word: חֲזוֹ
  choice: Ha-xô
  rationale: Phiên âm tên riêng theo cách đọc gần với Hebrew, đồng thời phù hợp cấu trúc âm tiết tiếng Việt.
- source_word: פִּלְדָּשׁ
  choice: Phi-đát
  rationale: Phiên âm trực tiếp tên riêng; âm cuối Hebrew được Việt hóa tự nhiên để người đọc phổ thông dễ phát âm.
- source_word: יִדְלָף
  choice: Díp-láp
  rationale: Phiên âm tên riêng theo quy ước tên Kinh Thánh quen thuộc trong tiếng Việt, với phụ âm đầu yod được thể hiện bằng D.
- source_word: בְּתוּאֵל
  choice: Bê-tu-ên
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tên riêng Bethuel.
- source_word: וְאֶת / וְאֵת
  choice: dấu phẩy và “và” trước tên cuối
  rationale: אֵת là dấu hiệu tân ngữ xác định nên không cần dịch; waw lặp lại được thể hiện tự nhiên trong tiếng Việt bằng phép liệt kê, với “và” trước thành phần cuối.
