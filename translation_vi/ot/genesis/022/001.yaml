source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/הָ֣/אֱלֹהִ֔ים נִסָּ֖ה אֶת אַבְרָהָ֑ם וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַבְרָהָ֖ם וַ/יֹּ֥אמֶר הִנֵּֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: vi
  text: 'Sau những việc ấy[a], Đức Chúa Trời thử[b] Áp-ra-ham và nói với ông: “Áp-ra-ham!” Ông đáp: “Tôi đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau những sự việc ấy” hoặc “Sau những biến cố ấy”.'
    reason: דְּבָרִים là một từ có nghĩa rộng, có thể chỉ sự việc, vấn đề hoặc các biến cố đã xảy ra.
  - marker: b
    text: 'Hay: “thử thách”.'
    reason: נסה có thể được diễn đạt bằng “thử” hoặc “thử thách”; trong ngữ cảnh này, từ này nói đến việc đưa ra thử nghiệm, không nhất thiết là cám dỗ làm điều ác.
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sau những việc ấy
  rationale: וַיְהִי mở một chặng kể chuyện mới và không cần dịch thành một công thức riêng trong tiếng Việt; cụm này giữ rõ mối liên hệ thời gian với phần trước. דְּבָרִים có nghĩa rộng, nên “việc” tự nhiên hơn mà vẫn ít diễn giải.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, אֱלֹהִים chỉ Đức Chúa Trời; đây không phải danh YHWH, nên không dịch là “Đức Giê-hô-va” hay “CHÚA”.
- source_word: נִסָּה
  choice: thử
  rationale: Dạng Piel của נסה diễn tả việc đem ra thử để bộc lộ hay chứng nghiệm phẩm chất. “Thử” ngắn gọn, tự nhiên và không mang nghĩa dụ dỗ phạm điều ác như “cám dỗ”.
- source_word: אֶת אַבְרָהָם
  choice: Áp-ra-ham
  rationale: אֶת là dấu hiệu tân ngữ trực tiếp nên không dịch; tên riêng được phiên âm theo cách quen thuộc trong tiếng Việt.
- source_word: וַיֹּאמֶר אֵלָיו אַבְרָהָם
  choice: 'Ngài gọi ông: “Áp-ra-ham!”'
  rationale: Trong ngữ cảnh gọi đích danh, cách diễn đạt này tự nhiên hơn “nói với ông” trong tiếng Việt, đồng thời giữ nguyên lời gọi trực tiếp.
- source_word: הִנֵּנִי
  choice: Con đây
  rationale: Thành ngữ này biểu thị sự có mặt, chú ý và sẵn sàng đáp lời. Khi một người thưa với Đức Chúa Trời, “Con đây” là cách nói tiếng Việt tự nhiên và trang trọng hơn “Tôi đây”, dù đại từ xưng hô không được nêu tường minh trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Ý nghĩa của נסה khi Đức Chúa Trời là chủ thể
  choice: Đức Chúa Trời thử Áp-ra-ham
  alternative: Đức Chúa Trời cám dỗ Áp-ra-ham
  rationale: Trong văn cảnh này, động từ nói đến việc thử nghiệm hay chứng nghiệm, không tự nó nói đến sự dụ dỗ làm điều ác. Bản dịch giữ sức căng của câu chuyện nhưng tránh gán cho động từ một nghĩa dễ gây hiểu sai trong tiếng Việt.
- issue: Đại từ trong lời đáp הִנֵּנִי
  choice: Con đây
  alternative: Tôi đây / Có tôi đây
  rationale: Nguyên văn không xác định đại từ xã hội. “Con đây” thể hiện lối xưng hô tự nhiên của một người với Đức Chúa Trời trong tiếng Việt, nhưng không thêm một tuyên bố thần học về quan hệ của Áp-ra-ham.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng câu trực tiếp gọn để tái hiện nhịp gọi–đáp của nguyên văn. Danh xưng “Đức Chúa Trời” phân biệt אֱלֹהִים với danh riêng YHWH.
