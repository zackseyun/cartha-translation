  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: vi
  text: Vào ngày thứ ba, Áp-ra-ham ngước mắt lên và thấy nơi ấy từ đằng xa[a].
  philosophy: optimal-equivalence
