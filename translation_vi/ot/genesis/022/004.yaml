    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Đến ngày thứ ba
  rationale: Cụm từ chỉ thời gian được chuyển tự nhiên trong mạch kể tiếng Việt; “đến” diễn tả sự tiến triển của câu chuyện mà không thêm ý “của cuộc hành trình” vốn không có trong tiếng Hê-bơ-rơ.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: ngước mắt lên
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ “nâng mắt mình lên” bằng cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: וַיַּרְא
  choice: và thấy
  rationale: Diễn đạt hành động tiếp nối đơn giản của động từ ראה, không thêm sắc thái giải thích.
- source_word: הַמָּקוֹם
  choice: nơi ấy
  rationale: Danh từ xác định chỉ địa điểm đã được xác định trong ngữ cảnh. “Nơi ấy” tự nhiên hơn “cái nơi” trong tiếng Việt và không nói rõ thêm địa điểm đó là gì.
- source_word: מֵרָחֹק
  choice: từ đằng xa
  rationale: Diễn đạt khoảng cách bằng một cụm từ tiếng Việt tự nhiên, có sắc thái kể chuyện; “từ xa” cũng là một khả năng sát nghĩa.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
