  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: vi
  text: Rồi họ đến nơi Đức Chúa Trời đã phán bảo ông. Tại đó, Áp-ra-ham dựng bàn thờ, xếp củi, trói Y-sác, con trai mình, rồi đặt con trên bàn thờ, trên đống củi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Khi họ đến
  rationale: Giữ chủ ngữ số nhiều, chỉ Áp-ra-ham và Y-sác; cấu trúc “khi” nối tự nhiên việc đến nơi với chuỗi hành động tiếp theo trong tiếng Việt.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: Đức Chúa Trời đã phán bảo ông
  rationale: אמר với tân ngữ gián tiếp ở đây nhắc lại chỉ dẫn đã được ban trước đó; “phán bảo” vừa tự nhiên vừa phù hợp với lời Đức Chúa Trời.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Tiếng Việt thường không biểu thị tính xác định bằng mạo từ; ngữ cảnh cho thấy đây là bàn thờ cụ thể được dựng cho lễ dâng này.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: xếp củi lên
  rationale: ערך diễn tả việc sắp xếp cho có thứ tự; “xếp củi” là cách nói rõ ràng, tự nhiên trong bối cảnh chuẩn bị bàn thờ.
- source_word: וַיַּעֲקֹד
  choice: trói
  rationale: Diễn đạt trực tiếp hành động buộc chặt mà không làm nhẹ hoặc thêm cách thức ngoài nguyên văn.
- source_word: יִצְחָק בְּנוֹ
  choice: Y-sác, con trai mình
  rationale: Giữ tên riêng theo sau bởi quan hệ cha con như tiếng Hê-bơ-rơ, đồng thời dùng cấu trúc tiếng Việt tự nhiên.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: rồi đặt con trên bàn thờ
  rationale: שׂים là động từ đặt để có nghĩa rộng; “đặt” không suy diễn tư thế hay cách di chuyển. “Con” làm rõ quan hệ trong văn cảnh và tránh đại từ thiếu tự nhiên.
- source_word: מִמַּעַל לָעֵצִים
  choice: phía trên đống củi
  rationale: Giữ quan hệ không gian ‘ở phía trên’ củi đã được xếp; “đống củi” giúp câu tiếng Việt tự nhiên mà không thay đổi hình ảnh.
theological_decisions:
- issue: Tính xác định của bàn thờ hiến tế
  choice: bàn thờ
  alternative: một bàn thờ
  rationale: Danh từ Hê-bơ-rơ có mạo từ xác định. Vì tiếng Việt không bắt buộc có từ tương đương với “the”, bản dịch để “bàn thờ” và dựa vào ngữ cảnh để bảo toàn tính xác định, tránh thêm “một” vốn có thể gợi tính bất định.
- issue: Cách diễn đạt hành động buộc Y-sác
  choice: Ông trói Y-sác, con trai mình
  alternative: Ông buộc Y-sác, con trai mình
  rationale: “Trói” truyền đạt rõ lực của עקד và tính nghiêm trọng của hành động, nhưng không đưa thêm ý nghĩa thần học hoặc chi tiết về cách trói.
translation_notes:
  register: Văn phong trần thuật trang trọng, sáng rõ và hiện đại. Dùng “Đức Chúa Trời” cho הָאֱלֹהִים và cách phiên âm quen thuộc “Áp-ra-ham”, “Y-sác”. Không cần chú thích vì các sắc thái nguồn có thể được bảo toàn tự nhiên trong chính văn.
