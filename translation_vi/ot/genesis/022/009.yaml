revisions:
- from: Khi họ đến nơi Đức Chúa Trời đã phán bảo ông, Áp-ra-ham dựng bàn thờ tại đó và xếp củi lên. Ông trói Y-sác, con trai mình, rồi đặt con trên bàn thờ, phía trên đống củi.
  to: Rồi họ đến nơi Đức Chúa Trời đã phán bảo ông. Tại đó, Áp-ra-ham dựng bàn thờ, xếp củi, trói Y-sác, con trai mình, rồi đặt con trên bàn thờ, trên đống củi.
  rationale: 'Bản sửa thay cấu trúc mệnh đề thời gian bằng trình tự trần thuật, bỏ ý hướng thêm vào ở “xếp củi lên,” và giữ nguyên mọi thành tố ngữ nghĩa của tiếng Hê-bơ-rơ: họ đến, Đức Chúa Trời đã nói với Áp-ra-ham, ông dựng bàn thờ, sắp củi, trói Y-sác là con trai mình, và đặt con trên bàn thờ ở trên củi. Không cần chú thích vì không có sắc thái tranh chấp hoặc không thể biểu đạt trong chính văn.'
