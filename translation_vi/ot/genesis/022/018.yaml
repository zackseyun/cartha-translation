base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: vi
  text: Và trong dòng dõi con, mọi dân tộc trên đất sẽ được ban phước[a], vì con đã vâng theo lời Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ tự chúc phước cho mình.” Động từ Hê-bơ-rơ ở đây có thể được hiểu theo nghĩa phản thân.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: sẽ được ban phước
  rationale: Dạng Hitpael của ברך trong công thức lời hứa với các tổ phụ có thể mang nghĩa thụ động hoặc phản thân. Cách dịch thụ động tự nhiên trong tiếng Việt và phù hợp với mạch lời hứa; nghĩa phản thân được giữ trong chú thích.
- source_word: בְזַרְעֲךָ
  choice: nhờ dòng dõi con
  rationale: זֶרַע là danh từ tập hợp, chỉ dòng dõi hoặc hậu duệ. “Dòng dõi” giữ được nét tập hợp; “nhờ” diễn đạt vai trò trung gian có thể có của giới từ ב trong tiếng Việt tự nhiên, mà không xác định dòng dõi là một cá nhân.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: mọi dân tộc trên đất
  rationale: גּוֹיִם trực tiếp chỉ các dân tộc; הָאָרֶץ ở đây có phạm vi toàn cầu. Cụm từ này trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: עֵקֶב אֲשֶׁר
  choice: vì
  rationale: Cụm từ nêu nguyên nhân làm nền cho việc tái xác nhận lời hứa; “vì” truyền đạt gọn và tự nhiên quan hệ nhân quả.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: con đã vâng lời Ta
  rationale: Thành ngữ שׁמע בקול nói đến việc nghe theo và làm theo, không chỉ nghe bằng tai. “Vâng lời” chuyển tải đúng ý tuân phục; “Ta” duy trì lời phán trực tiếp với sắc thái trang trọng.
theological_decisions:
- issue: Ý nghĩa của động từ ברך ở dạng Hitpael trong lời hứa dành cho Áp-ra-ham
  choice: Các dân tộc nhận phước lành nhờ dòng dõi của Áp-ra-ham (“sẽ được ban phước”).
  alternative: Các dân tộc lấy dòng dõi của Áp-ra-ham làm mẫu hoặc công thức để tự chúc phước (“sẽ tự chúc phước”).
  rationale: Ngữ cảnh giao ước nghiêng về nghĩa thụ động hoặc kết quả, nhưng hình thái Híp-ri cũng cho phép cách hiểu phản thân. Bản chính chọn nghĩa phù hợp hơn với mạch lời hứa và ghi cách hiểu kia trong chú thích, không áp đặt một kết luận thần học về bản tính hoặc số lượng của “dòng dõi”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “dòng dõi” để giữ nghĩa tập hợp của זֶרַע; đại từ “con—Ta” phù hợp với lời Đức Chúa Trời trực tiếp phán với Áp-ra-ham. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
