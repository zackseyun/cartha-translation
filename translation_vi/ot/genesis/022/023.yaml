  register: Văn phong gia phả ngắn gọn, trang trọng nhưng hiện đại. Câu thứ hai được tái cấu trúc nhẹ để tránh lối nói gượng “tám người này Minh-ca sinh cho Na-cô”, đồng thời giữ trọng tâm của nguyên văn nơi tám người con.
