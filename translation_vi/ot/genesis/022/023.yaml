- from: Bê-tu-ên sinh Rê-bê-ca. Tám người con này là do Minh-ca sinh cho Na-cô, em trai của Áp-ra-ham.
  to: Bê-tu-ên sinh Rê-bê-ca. Đó là tám người con Minh-ca sinh cho Na-cô, người anh em của Áp-ra-ham.
  rationale: Sửa “em trai” thành “người anh em” để không thêm thông tin về thứ bậc tuổi mà nguyên văn câu này không xác định. Đồng thời, đổi câu thứ hai sang chủ động để tiếng Việt gọn và tự nhiên hơn, vẫn duy trì ý “tám người” là các con do Minh-ca sinh cho Na-cô.
