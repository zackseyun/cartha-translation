  text: וּ/בְתוּאֵ֖ל יָלַ֣ד אֶת רִבְקָ֑ה שְׁמֹנָ֥ה אֵ֨לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְ/נָח֖וֹר אֲחִ֥י אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: vi
  text: Bê-tu-ên sinh Rê-bê-ca. Đó là tám người con Minh-ca sinh cho Na-cô, người anh em của Áp-ra-ham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְתוּאֵל
  choice: Bê-tu-ên
  rationale: Liên từ ו tiếp nối gia phả; trong tiếng Việt không cần dịch thành “và” ở đầu câu vì câu văn vẫn liên kết tự nhiên. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: יָלַד
  choice: sinh
  rationale: Với chủ thể nam trong công thức gia phả, “sinh” là cách nói ngắn gọn, trang trọng và tự nhiên; ngữ cảnh cho thấy Bê-tu-ên là cha của Rê-bê-ca.
- source_word: אֶת רִבְקָה
  choice: Rê-bê-ca
  rationale: אֶת là dấu chỉ tân ngữ nên không dịch; tên riêng được phiên âm theo quy ước tiếng Việt.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: Tám người con này
  rationale: Bổ sung “người con” vốn được ngữ cảnh liệt kê gia đình hàm ý, giúp câu tiếng Việt rõ nghĩa mà vẫn giữ sự nhấn mạnh vào con số tám.
- source_word: יָלְדָה
  choice: là do … sinh
  rationale: Cách diễn đạt này phân biệt tự nhiên với động từ có chủ thể nam ở câu trước và thể hiện rõ Minh-ca là người sinh tám người con.
- source_word: מִלְכָּה
  choice: Minh-ca
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לְ/נָחוֹר
  choice: cho Na-cô
  rationale: Giới từ ל trong công thức gia phả được chuyển là “cho”, diễn tả Minh-ca sinh các con cho Na-cô.
- source_word: אֲחִי אַבְרָהָם
  choice: em trai của Áp-ra-ham
  rationale: Cụm Hê-bơ-rơ chỉ “anh/em trai của Áp-ra-ham”; theo trình tự gia đình trong Sáng Thế Ký 11:26–27 và cách gọi tự nhiên bằng tiếng Việt, chọn “em trai”, trong khi quan hệ cốt lõi vẫn là anh em ruột.
theological_decisions: []
