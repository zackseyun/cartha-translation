source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: vi
  text: Áp-ra-ham lấy củi dùng cho lễ thiêu[a], chất lên Y-sác, con trai mình; còn ông cầm lửa và con dao trong tay. Rồi hai cha con cùng đi với nhau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “củi của lễ thiêu”.
    reason: lexical_alternative
  - marker: b
    text: Hay “cả hai cùng đi với nhau”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: củi dùng cho lễ thiêu
  rationale: Cụm danh từ liên kết theo sát nghĩa là “củi của lễ thiêu”; cách diễn đạt “củi dùng cho lễ thiêu” tự nhiên trong tiếng Việt và nêu rõ công dụng của củi mà không làm mất thuật ngữ tế lễ.
- source_word: וַיָּשֶׂם עַל
  choice: chất lên
  rationale: Động từ שׂים đi với עַל diễn tả việc đặt vật lên trên; “chất lên” tự nhiên khi nói đến một bó củi được đặt làm gánh nặng trên người.
- source_word: יִצְחָק בְּנוֹ
  choice: Y-sác, con trai mình
  rationale: Giữ thứ tự nêu tên rồi xác định quan hệ như tiếng Hê-bơ-rơ, đồng thời dùng “mình” để chỉ rõ Y-sác là con của chủ ngữ Áp-ra-ham.
- source_word: בְּיָדוֹ
  choice: trong tay
  rationale: Phản ánh trực tiếp danh từ số ít trong nguyên văn và là cách nói tự nhiên trong tiếng Việt về vật một người tự cầm.
- source_word: הָאֵשׁ
  choice: lửa
  rationale: Nguyên văn chỉ nói “lửa”, không xác định vật đựng hay phương tiện tạo lửa; vì vậy không thêm “bình lửa” hoặc “đuốc”.
- source_word: הַמַּאֲכֶלֶת
  choice: con dao
  rationale: Danh từ chỉ dao có thể dùng để giết sinh vật tế lễ; “con dao” rõ ràng, tự nhiên, còn sắc thái tế lễ đã có trong ngữ cảnh.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: hai cha con cùng đi với nhau
  rationale: “Hai cha con” diễn đạt tự nhiên cặp người vừa được nêu, còn “cùng đi với nhau” bảo toàn sự nhấn mạnh của cả שְׁנֵיהֶם lẫn יַחְדָּו.
theological_decisions:
- issue: Thuật ngữ tế lễ עֹלָה
  choice: lễ thiêu
  alternative: lễ toàn thiêu; lễ dâng lên
  rationale: Trong ngữ cảnh này, עֹלָה là loại lễ vật được thiêu trên bàn thờ. “Lễ thiêu” truyền đạt loại tế lễ mà không biến nghĩa gốc liên quan đến việc “đi lên” thành một cách giải nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cách phiên âm tên quen thuộc “Áp-ra-ham” và “Y-sác”. Dấu chấm phẩy giúp phân biệt việc Y-sác mang củi với việc Áp-ra-ham tự cầm lửa và dao; không thêm chi tiết về cách mang hoặc vật chứa lửa.
