  text: וַ/יָּ֤שָׁב אַבְרָהָם֙ אֶל נְעָרָ֔י/ו וַ/יָּקֻ֛מוּ וַ/יֵּלְכ֥וּ יַחְדָּ֖ו אֶל בְּאֵ֣ר שָׁ֑בַע וַ/יֵּ֥שֶׁב אַבְרָהָ֖ם בִּ/בְאֵ֥ר שָֽׁבַע־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: vi
  text: Rồi Áp-ra-ham trở lại với các đầy tớ trẻ của mình[a]. Họ đứng dậy, cùng nhau đi đến Bê-e Sê-ba; và Áp-ra-ham ở lại Bê-e Sê-ba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “Áp-ra-ham trở lại với các đầy tớ trẻ của mình.” Y-sác không được nhắc đến trong mệnh đề này, dù ông có mặt trong phần ký thuật trước đó.'
    reason: Giữ lại điểm đáng chú ý và sự không xác định của nguyên văn, không bổ sung Y-sác vào chính văn.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: trở lại
  rationale: Động từ שׁוב ở thể qal trong mạch kể chuyện có nghĩa thông thường là “trở lại”; cách dịch này trực tiếp và tự nhiên.
- source_word: נְעָרָיו
  choice: các đầy tớ trẻ của mình
  rationale: נַעַר có thể chỉ người trẻ, đầy tớ hoặc người hầu cận. Trong ngữ cảnh này, họ là những người đi theo Áp-ra-ham (22:3, 5); “đầy tớ trẻ” vừa thể hiện vai trò theo ngữ cảnh vừa giữ sắc thái tuổi tác của từ Hê-bơ-rơ.
- source_word: וַיָּקֻמוּ
  choice: họ đứng dậy
  rationale: קוּם trong văn kể chuyện thường đánh dấu việc bắt đầu hành động; “đứng dậy” tự nhiên, trang trọng vừa phải và không cổ kính.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: cùng nhau đi
  rationale: הלך kết hợp với יחדו diễn tả việc cùng đi; cách dịch này gọn, tự nhiên và không thêm phương thức di chuyển.
- source_word: בְּאֵר שָׁבַע
  choice: Bê-e Sê-ba
  rationale: Địa danh được phiên âm theo lối quen dùng trong tiếng Việt thay vì dịch nghĩa.
- source_word: וַיֵּשֶׁב
  choice: ở lại
  rationale: ישׁב có thể mang nghĩa ngồi, cư ngụ hoặc ở lại. Trong câu này, “ở lại” giữ được độ mở về thời gian cư trú và tránh hàm ý mạnh hơn như “định cư”.
theological_decisions:
- issue: Chỉ Áp-ra-ham được nói rõ là trở lại từ núi, dù Y-sác xuất hiện trong phần ký thuật trước đó
  choice: Dịch đúng chủ ngữ được nêu trong nguyên văn, không thêm Y-sác vào chính văn
  alternative: Hiểu rằng Y-sác cũng trở về và tác giả chỉ tập trung vào Áp-ra-ham như nhân vật chính
  rationale: Nguyên văn Hê-bơ-rơ chỉ nêu Áp-ra-ham là người trở lại với các đầy tớ trẻ. Bản dịch giữ nguyên sự căng thẳng này thay vì hài hòa hóa bằng cách thêm Y-sác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc kể chuyện được làm tự nhiên trong tiếng Việt; dấu chấm phẩy giúp phân biệt hành trình chung với lời kết về nơi Áp-ra-ham ở lại.
