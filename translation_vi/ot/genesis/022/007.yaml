  to: 'I-sác nói với Áp-ra-ham, cha mình: “Cha ơi!” Ông đáp: “Cha đây, con ơi.” I-sác nói: “Lửa và củi đây, nhưng chiên con[a] dùng làm lễ thiêu ở đâu?”'
