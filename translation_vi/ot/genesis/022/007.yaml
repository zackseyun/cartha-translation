  terminology: “Lễ thiêu” là thuật ngữ phù hợp cho עֹלָה. Tên I-sác và Áp-ra-ham nhất quán với dạng phiên âm đã chọn. Chú thích từ vựng nên nêu trực tiếp từ Hê-bơ-rơ để làm rõ lý do của phương án dịch.
