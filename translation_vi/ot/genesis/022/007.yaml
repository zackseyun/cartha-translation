base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: vi
  text: 'I-sác nói với Áp-ra-ham, cha mình: “Cha ơi!” Ông đáp: “Cha đây, con ơi.” I-sác nói: “Lửa và củi đây, nhưng chiên con[a] dùng làm lễ thiêu ở đâu?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שֶׂה có nghĩa rộng hơn, chỉ một con vật nhỏ thuộc bầy, chẳng hạn chiên con hoặc dê con.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói / đáp
  rationale: Động từ אמר được dịch tự nhiên theo chức năng hội thoại; “đáp” ở lượt lời của Áp-ra-ham làm rõ phản hồi mà không thêm nội dung.
- source_word: אָבִיו
  choice: cha mình
  rationale: Giữ rõ quan hệ cha con trong lời dẫn, đồng thời phù hợp văn phong kể chuyện tiếng Việt.
- source_word: אָבִי
  choice: Cha ơi!
  rationale: Cách xưng gọi tự nhiên trong tiếng Việt, thể hiện hậu tố ngôi thứ nhất và sắc thái trực tiếp, tha thiết của lời gọi.
- source_word: הִנֶּנִי
  choice: Cha đây
  rationale: Trong ngữ cảnh cha đáp lời con, “Cha đây” chuyển tải tự nhiên công thức tự trình diện “Này, ta đây/ tôi đây” và giữ sắc thái sẵn sàng lắng nghe.
- source_word: בְּנִי
  choice: con trai của cha
  rationale: Thể hiện cả danh từ “con trai” và hậu tố sở hữu; cách diễn đạt này duy trì sự trìu mến và tạo cặp xưng hô tương ứng với “Cha ơi”.
- source_word: הִנֵּה
  choice: đây
  rationale: Tiểu từ chỉ xuất được thể hiện bằng cấu trúc “Lửa và củi đây”, tự nhiên trong câu hỏi tiếng Việt và hướng sự chú ý đến các vật đang có.
- source_word: הָאֵשׁ
  choice: lửa
  rationale: Tiếng Việt không có mạo từ tương ứng; danh từ không định từ là cách nói tự nhiên trong phép liệt kê này.
- source_word: הָעֵצִים
  choice: củi
  rationale: Trong bối cảnh chuẩn bị đốt lễ vật, “củi” chính xác và tự nhiên hơn từ rộng “gỗ”, dù danh từ Hê-bơ-rơ ở số nhiều.
- source_word: אַיֵּה
  choice: ở đâu?
  rationale: Chuyển tải trực tiếp từ nghi vấn chỉ vị trí bằng cú pháp tiếng Việt tự nhiên.
- source_word: הַשֶּׂה
  choice: chiên con
  rationale: שֶׂה chỉ chung một con vật nhỏ thuộc bầy, có thể là chiên hoặc dê; “chiên con” phù hợp ngữ cảnh tế lễ và quen thuộc trong tiếng Việt, còn phạm vi nghĩa rộng hơn được nêu ở chú thích.
- source_word: לְעֹלָה
  choice: dùng làm lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn; cách dịch này biểu đạt tự nhiên mục đích của con vật trong câu hỏi.
theological_decisions:
- issue: Phạm vi nghĩa của הַשֶּׂה, con vật dùng làm lễ thiêu
  choice: chiên con[a]
  alternative: một con vật nhỏ trong bầy; chiên hoặc dê con
  rationale: Bản văn Hê-bơ-rơ không xác định tuyệt đối loài hay tuổi của con vật. “Chiên con” là cách gọi tự nhiên trong ngữ cảnh tiếng Việt, nhưng chú thích bảo tồn độ rộng từ vựng để không áp đặt tính xác định mà nguyên văn không có.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng gần gũi. Cặp xưng hô “Cha ơi / Cha đây, con trai của cha” giữ sự thân mật và sức nặng cảm xúc của cảnh; tên riêng dùng dạng phiên âm quen thuộc I-sác và Áp-ra-ham.
