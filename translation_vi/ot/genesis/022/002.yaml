  text: וַ/יֹּ֡אמֶר קַח נָ֠א אֶת בִּנְ/ךָ֨ אֶת יְחִֽידְ/ךָ֤ אֲשֶׁר אָהַ֨בְתָּ֙ אֶת יִצְחָ֔ק וְ/לֶךְ לְ/ךָ֔ אֶל אֶ֖רֶץ הַ/מֹּרִיָּ֑ה וְ/הַעֲלֵ֤/הוּ שָׁם֙ לְ/עֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽ/הָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: vi
  text: 'Ngài phán: “Xin hãy đem con trai ngươi, người con độc nhất[a] mà ngươi yêu thương—Y-sác—đi đến xứ Mô-ri-a. Tại đó, hãy dâng con làm lễ thiêu trên một trong các ngọn núi mà Ta sẽ nói cho ngươi biết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con trai duy nhất của ngươi.” Từ Hê-bơ-rơ יְחִידְךָ có thể nhấn mạnh một người là duy nhất hoặc có địa vị đặc biệt; tại đây, từ này làm nổi bật địa vị đơn nhất của Y-sác trong mệnh lệnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: xin hãy
  rationale: Diễn đạt sắc thái khẩn khoản hoặc làm nhẹ mệnh lệnh của tiểu từ, đồng thời vẫn giữ câu nói ở thể mệnh lệnh tự nhiên trong tiếng Việt.
- source_word: בִּנְךָ
  choice: con trai ngươi
  rationale: Chuyển trực tiếp danh từ בֵּן cùng hậu tố ngôi hai số ít giống đực.
- source_word: יְחִידְךָ
  choice: người con độc nhất
  rationale: Giữ sắc thái duy nhất, độc nhất và địa vị đặc biệt của Y-sác, nhưng không tự ý giải thích đó hoàn toàn là sự độc nhất về sinh học.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: mà ngươi yêu thương
  rationale: Thể hoàn thành Hê-bơ-rơ ở đây diễn tả tình yêu đã được xác lập và vẫn hiện hữu; hiện tại tiếng Việt truyền đạt tự nhiên nhất.
- source_word: וְלֶךְ לְךָ
  choice: đi đến
  rationale: Chuyển thành mệnh lệnh tự nhiên; đại từ phản thân trong thành ngữ Hê-bơ-rơ không cần được diễn rộng thành một ý nghĩa không chắc chắn.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: xứ Mô-ri-a
  rationale: “Xứ” diễn đạt אֶרֶץ theo cách trang trọng, quen thuộc và dễ hiểu, không xác định quá mức đây là đất nước hay chỉ một vùng.
- source_word: וְהַעֲלֵהוּ
  choice: hãy dâng con
  rationale: Trong kết hợp với לְעֹלָה, dạng Hiphil của עלה mang nghĩa hiến dâng làm sinh tế; “dâng” tự nhiên hơn cách dịch máy móc là “đưa lên”.
- source_word: לְעֹלָה
  choice: làm lễ thiêu
  rationale: Đây là thuật ngữ chỉ sinh tế được thiêu trọn; “lễ thiêu” ngắn gọn và rõ nghĩa trong tiếng Việt.
- source_word: עַל אַחַד הֶהָרִים
  choice: trên một trong các ngọn núi
  rationale: Giữ đúng ý một ngọn chưa được xác định trong số nhiều ngọn núi.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: mà Ta sẽ nói cho ngươi biết
  rationale: Giữ động từ אמר là “nói” thay vì đổi thành “chỉ cho xem”; thêm “cho… biết” tạo câu tiếng Việt tự nhiên mà không thay đổi nội dung.
theological_decisions:
- issue: Ý nghĩa của יְחִידְךָ đối với Y-sác khi Ích-ma-ên vẫn tồn tại
  choice: người con độc nhất
  alternative: con trai duy nhất; người con có một không hai
  rationale: 'Bản dịch giữ sức căng của nguyên văn: từ này nhấn mạnh địa vị đơn nhất của Y-sác trong mệnh lệnh và mối quan hệ với Áp-ra-ham, nhưng chính câu không giải thích sự đơn nhất ấy thuần túy theo sinh học, giao ước hay tình cảm.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta—ngươi” giữ sắc thái lời phán trong bối cảnh cổ đại; tên riêng được phiên âm theo lối quen thuộc. Dấu gạch ngang làm rõ Y-sác là phần đồng vị mà không thay đổi trật tự nhấn mạnh của nguyên văn.
