  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và nội dung Hê-bơ-rơ: mốc thời gian “sau những việc ấy,” lời báo được diễn đạt vô nhân xưng mà không nêu người báo, hạt từ gây chú ý הִנֵּה, việc Minh-ca “cũng đã sinh” các con trai, và quan hệ anh em của Na-hô với Áp-ra-ham. Cụm “người anh em của ông” phù hợp vì nguyên ngữ không xác định Na-hô là anh hay em. Dấu hai chấm cuối lời báo là cần thiết, vì danh sách tên các con tiếp tục ở câu kế.'
