  yaml_path: translation/ot/genesis/022/020.yaml
  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: vi
  text: 'Sau những việc ấy, có người báo cho Áp-ra-ham rằng: “Này, Minh-ca cũng đã sinh các con trai cho Na-hô, người anh em của ông:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Sau những việc ấy
  rationale: Diễn đạt tự nhiên công thức chuyển tiếp của tiếng Hê-bơ-rơ, không thêm một từ mang nghĩa ‘bây giờ’ vốn không có trong nguồn.
- source_word: וַיֻּגַּד לְאַבְרָהָם
  choice: có người báo cho Áp-ra-ham
  rationale: Thể bị động vô nhân xưng trong nguyên bản được chuyển thành cấu trúc tiếng Việt tự nhiên mà vẫn không xác định người báo tin.
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của lời báo tin, với sắc thái trang trọng nhưng dễ hiểu.
- source_word: יָלְדָה ... בָּנִים
  choice: đã sinh các con trai
  rationale: Giữ rõ nghĩa số nhiều và giới tính nam của בָּנִים trong phần dẫn vào gia phả.
- source_word: אָחִיךָ
  choice: người anh em của ông
  rationale: Tiếng Hê-bơ-rơ không phân biệt anh hay em; cách dịch này tránh tự ý xác định thứ bậc tuổi tác.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng ‘ông’ trong lời được thuật lại để thể hiện ngôi thứ hai số ít với sắc thái kính trọng; giữ dấu hai chấm cuối câu vì danh sách các con của Na-hô tiếp tục ở câu sau.
