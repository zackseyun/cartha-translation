  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: vi
  text: Còn vợ lẽ của ông, tên là Rê-u-ma, cũng sinh Tê-bác, Ga-ham, Ta-hách và Ma-a-ca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: Người vợ lẽ của ông
  rationale: פִּילֶגֶשׁ chỉ một người vợ có địa vị thứ yếu so với người vợ chính; “vợ lẽ” là cách diễn đạt tự nhiên, ngắn gọn trong tiếng Việt và giữ được sự phân biệt xã hội-pháp lý.
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: tên là Rê-u-ma
  rationale: Cụm Hê-bơ-rơ có nghĩa sát là “và tên nàng là Rê-u-ma”; tiếng Việt tự nhiên có thể đặt thành phần này đồng vị sau “người vợ lẽ của ông” mà không làm đổi quan hệ quy chiếu.
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Trong danh sách gia phả, ילד diễn tả việc người phụ nữ sinh con; “sinh” súc tích và phù hợp văn phong tiếng Việt.
- source_word: גַּם הִוא
  choice: cũng
  rationale: Cụm này nhấn mạnh rằng Rê-u-ma, ngoài Minh-ca đã nói ở câu trước, cũng sinh con. “Cũng” truyền đạt tự nhiên ý bổ sung ấy trong tiếng Việt.
- source_word: טֶבַח וְגַּחַם וְתַּחַשׁ וּמַעֲכָה
  choice: Tê-bác, Ga-ham, Ta-hách và Ma-a-ca
  rationale: Đây là bốn tên riêng làm tân ngữ của động từ “sinh”; các tên được phiên âm theo lối quen dùng trong tiếng Việt và nối thành danh sách tự nhiên.
