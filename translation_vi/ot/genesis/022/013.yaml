language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַבְרָהָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּה אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּ/סְּבַ֖ךְ בְּ/קַרְנָ֑י/ו וַ/יֵּ֤לֶךְ אַבְרָהָם֙ וַ/יִּקַּ֣ח אֶת הָ/אַ֔יִל וַ/יַּעֲלֵ֥/הוּ לְ/עֹלָ֖ה תַּ֥חַת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: vi
  text: Bấy giờ, Áp-ra-ham ngước mắt lên và nhìn. Kìa, phía sau ông[a] có một con chiên đực bị mắc sừng vào bụi rậm. Áp-ra-ham đi lấy con chiên đực ấy và dâng nó làm lễ thiêu thay cho con trai mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ chỉ nói “phía sau”, không có đại từ “ông”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thế chỗ cho con trai mình”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: ngước mắt lên
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ hành động nâng tầm mắt để nhìn, đồng thời giữ được trình tự kể chuyện.
- source_word: וַיַּרְא
  choice: nhìn
  rationale: Giữ hành động riêng sau “ngước mắt lên”; không gộp hai động từ thành một.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Bảo tồn chức năng hướng sự chú ý và sắc thái phát hiện bất ngờ của tiểu từ kể chuyện.
- source_word: אַיִל
  choice: con chiên đực
  rationale: Cách gọi chính xác, dễ hiểu trong tiếng Việt hiện đại đối với chiên đực trưởng thành dùng trong bối cảnh tế lễ.
- source_word: אַחַר
  choice: phía sau ông
  rationale: Hiểu từ này theo nghĩa trạng từ chỉ nơi chốn là phù hợp nhất với ngữ cảnh; đại từ “ông” được thêm để câu tiếng Việt rõ và tự nhiên, nhưng sự bổ sung này được ghi chú.
- source_word: נֶאֱחַז
  choice: mắc
  rationale: Truyền đạt trạng thái bị giữ lại hoặc vướng vào, phù hợp với hình ảnh sừng bị mắc trong bụi.
- source_word: בַּסְּבַךְ
  choice: trong bụi rậm
  rationale: Diễn tả tự nhiên một vùng cây bụi dày, rối, có thể giữ mắc con vật.
- source_word: בְּקַרְנָיו
  choice: sừng mắc
  rationale: Cấu trúc tiếng Việt tự nhiên, cho thấy chính phần sừng của con chiên bị mắc trong bụi.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: dâng nó làm lễ thiêu
  rationale: Trong ngữ cảnh tế lễ, động từ cùng danh từ עֹלָה chỉ việc dâng con vật làm lễ thiêu; cách dịch này chính xác và dễ hiểu.
- source_word: תַּחַת בְּנוֹ
  choice: thay cho con trai mình
  rationale: תַּחַת mang nghĩa thay thế trong ngữ cảnh này; “thay cho” truyền đạt trực tiếp ý nghĩa ấy mà không thêm diễn giải thần học.
theological_decisions:
- issue: Ý nghĩa thay thế trong תַּחַת בְּנוֹ
  choice: thay cho con trai mình
  alternative: thế chỗ cho con trai mình
  rationale: Ngữ cảnh cho thấy con chiên được dâng thay cho người con. Bản dịch giữ rõ sự thay thế trong chính câu chuyện nhưng không suy rộng thành một khẳng định giáo lý vượt quá câu này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Áp-ra-ham”, “con chiên đực” và “lễ thiêu” theo lối gọi Kinh Thánh quen thuộc; giữ “Kìa” để tái hiện điểm nhấn trần thuật của nguyên văn.
