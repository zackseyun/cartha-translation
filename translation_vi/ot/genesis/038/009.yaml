  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: vi
  text: Nhưng Ô-nan biết rằng dòng dõi ấy sẽ không thuộc về mình[a]; nên mỗi khi ăn nằm với vợ của anh mình, ông để nó đổ xuống đất[b], để không sinh con nối dõi cho anh mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “hạt giống”; tại đây từ này chỉ dòng dõi hoặc người thừa tự trong bối cảnh người em sinh con nối dõi cho anh đã chết.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn có thể dịch sát là “ông làm hỏng/làm phí nó xuống đất”, mô tả hành vi của Ô-nan nhằm ngăn việc thụ thai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: biết
  rationale: Cách dịch trực tiếp và tự nhiên của ידע trong lời kể.
- source_word: הַזָּרַע
  choice: dòng dõi
  rationale: Trong bối cảnh nghĩa vụ sinh con cho người anh đã chết, זרע chỉ con cháu hay người nối dõi, không phải tinh dịch ở mệnh đề này.
- source_word: לֹא לוֹ יִהְיֶה הַזָּרַע
  choice: dòng dõi ấy sẽ không thuộc về mình
  rationale: Giữ sát cấu trúc Hê-bơ-rơ và diễn đạt ý pháp lý-gia đình rằng con sinh ra sẽ được kể cho người anh, không phải cho Ô-nan.
- source_word: וְהָיָה אִם־בָּא
  choice: mỗi khi
  rationale: Diễn đạt hành động có tính lặp lại trong lời kể quá khứ.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: ăn nằm với vợ của anh mình
  rationale: Thành ngữ tiếng Việt hiện đại, trang trọng vừa phải và đủ rõ để chuyển tải lối nói tránh về quan hệ tình dục.
- source_word: וְשִׁחֵת אַרְצָה
  choice: ông để nó đổ xuống đất
  rationale: Diễn đạt tự nhiên hành vi ngăn thụ thai, đồng thời không đưa từ 'tinh dịch' vốn không được nêu minh nhiên vào chính văn; đại từ 'nó' giữ lại đối tượng ngầm trong tiếng Hê-bơ-rơ.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: hầu không tạo dòng dõi cho anh mình
  rationale: Giữ rõ mệnh đề chỉ mục đích và nghĩa 'dòng dõi' của זרע trong bối cảnh này.
theological_decisions:
- issue: Bản chất hành vi của Ô-nan và nghĩa của זרע
  choice: Dịch זרע là 'dòng dõi' trong các mệnh đề pháp lý-gia đình, còn hành vi thể chất được diễn đạt là 'để nó đổ xuống đất'.
  alternative: Dùng 'hạt giống' nhất quán, hoặc nói minh nhiên 'để tinh dịch đổ xuống đất'.
  rationale: Câu này vừa nói đến dòng dõi được kể cho người anh đã chết, vừa nói đến cách Ô-nan cố ý ngăn việc thụ thai. Cách dịch đã chọn phân biệt hai bình diện ấy mà không biến câu thành một lời giải thích đạo lý hay du nhập kết luận giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Ăn nằm với” giữ tính uyển ngữ của nguyên văn nhưng vẫn rõ nghĩa; “dòng dõi” phù hợp bối cảnh gia đình-pháp lý. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
