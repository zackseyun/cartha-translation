base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/027.yaml
  text: When it was time for her to give birth, behold, there were twins in her womb.
translation:
  language: vi
  text: Đến lúc nàng sinh con, thì kìa, trong bụng nàng có một cặp song sinh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Đến
  rationale: Trong mạch kể chuyện, dạng này đưa câu chuyện sang sự việc kế tiếp; kết hợp với בְּעֵת thành cách diễn đạt thời gian tự nhiên trong tiếng Việt, không thêm một từ chỉ thời điểm như “bấy giờ” vốn không có từ tương ứng rõ ràng trong nguyên văn.
- source_word: בְּעֵת
  choice: lúc
  rationale: Cụm giới từ này xác lập thời điểm; “đến lúc” là cách nói tiếng Việt hiện đại, tự nhiên và chính xác trong ngữ cảnh.
- source_word: לִדְתָּהּ
  choice: nàng sinh con
  rationale: Động từ nguyên mẫu với hậu tố ngôi thứ ba giống cái có nghĩa là nàng sinh hoặc sinh con; “sinh con” rõ nghĩa và tự nhiên.
- source_word: וְהִנֵּה
  choice: thì kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái bất ngờ của הִנֵּה, thay vì lược bỏ khiến lời kể trở nên phẳng.
- source_word: תְאוֹמִים
  choice: một cặp song sinh
  rationale: Danh từ số nhiều chỉ hai trẻ sinh đôi; “một cặp song sinh” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: בְּבִטְנָהּ
  choice: trong bụng nàng
  rationale: בֶּטֶן có thể chỉ bụng hoặc dạ con; trong ngữ cảnh mang thai, “trong bụng nàng” vừa tự nhiên với độc giả phổ thông vừa truyền đạt đúng vị trí của thai nhi.
