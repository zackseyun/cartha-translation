  terminology: “Sinh con,” “một cặp song sinh,” và “trong bụng nàng” đều phù hợp ngữ cảnh. “Bụng” là cách nói phổ thông, tự nhiên để chỉ nơi thai nhi trong ngữ cảnh này; không làm sai nghĩa “womb.”
