id: GEN.38.12
reference: Genesis 38:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/תָּ֖מָת בַּת שׁ֣וּעַ אֵֽשֶׁת יְהוּדָ֑ה וַ/יִּנָּ֣חֶם יְהוּדָ֗ה וַ/יַּ֜עַל עַל גֹּֽזֲזֵ֤י צֹאנ/וֹ֙ ה֗וּא וְ/חִירָ֛ה רֵעֵ֥/הוּ הָ/עֲדֻלָּמִ֖י תִּמְנָֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: vi
  text: Sau một thời gian dài[a], con gái của Su-a, vợ Giu-đa, qua đời. Sau khi Giu-đa được an ủi[b], ông cùng bạn mình là Hi-ra, người A-đu-lam, đi lên Tim-na, đến chỗ những người xén lông đàn chiên của ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “những ngày trở nên nhiều”; cũng có thể dịch: “Sau nhiều ngày.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Khi Giu-đa được an ủi” hoặc “Giu-đa được an ủi.” Động từ Hê-bơ-rơ ở đây nói đến sự an ủi sau thời gian tang chế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: Sau một thời gian dài
  rationale: Thành ngữ Hê-bơ-rơ nói sát nghĩa là “những ngày trở nên nhiều”; cách dịch này diễn đạt tự nhiên ý một khoảng thời gian đáng kể đã trôi qua.
- source_word: וַתָּמָת
  choice: qua đời
  rationale: Diễn đạt tự nhiên, trang trọng động từ מות trong lời kể về cái chết.
- source_word: בַּת שׁוּעַ
  choice: con gái của Su-a
  rationale: Giữ cấu trúc quan hệ thân tộc rõ ràng của tiếng Hê-bơ-rơ, thay vì mặc nhiên coi cụm này là tên riêng Bát Su-a.
- source_word: אֵשֶׁת יְהוּדָה
  choice: vợ Giu-đa
  rationale: Cách diễn đạt sở hữu tự nhiên trong tiếng Việt.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: Khi đã nguôi buồn
  rationale: Niphal của נחם ở đây chỉ việc được an ủi và dần qua thời kỳ tang chế, không mang nghĩa ăn năn.
- source_word: וַיַּעַל
  choice: đi lên
  rationale: Giữ sắc thái phương hướng của עלה.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: đến chỗ những người xén lông đàn chiên của ông
  rationale: Phản ánh giới từ cùng phân từ số nhiều, chỉ những người đang làm công việc xén lông đàn chiên, thay vì nói chính Giu-đa đi xén lông.
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: Giu-đa cùng bạn mình là Hi-ra
  rationale: Chuyển cấu trúc đồng hành sang tiếng Việt tự nhiên và giữ רֵעַ theo nghĩa “bạn”.
- source_word: הָעֲדֻלָּמִי
  choice: người A-đu-lam
  rationale: Diễn đạt tính từ chỉ quê quán/xuất thân bằng cấu trúc tự nhiên trong tiếng Việt.
- source_word: תִּמְנָתָה
  choice: lên Tim-na
  rationale: Âm ה chỉ hướng được thể hiện bằng chuyển động đến Tim-na; “lên” đồng thời bảo toàn sắc thái của וַיַּעַל.
theological_decisions:
- issue: Ý nghĩa của וַיִּנָּחֶם sau cái chết của vợ Giu-đa
  choice: Khi đã nguôi buồn
  alternative: Khi Giu-đa được an ủi
  rationale: Ngữ cảnh tang chế ủng hộ nghĩa được an ủi/nguôi ngoai; bản dịch không hiểu động từ này theo nghĩa Giu-đa ăn năn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “xén lông” theo cách nói phổ thông; giữ các tên riêng dưới dạng phiên âm tiếng Việt nhất quán.
