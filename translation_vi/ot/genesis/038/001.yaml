  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng khung trần thuật, sự rời khỏi các anh em, hướng ‘đi xuống’, và việc Giu-đa chuyển hướng đến một người quê A-đu-lam. Tuy nhiên, “ghé đến chỗ” thường gợi một cuộc ghé thăm ngắn hoặc tạm thời, một sắc thái không có trong וַיֵּט עַד. “Rẽ đến với” gần hơn với ý ‘turn aside to’ mà vẫn tự nhiên.
