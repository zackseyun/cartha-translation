base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: vi
  text: Bấy giờ, Giu-đa rời các anh em mình, đi xuống và rẽ đến với một người A-đu-lam tên là Hi-ra.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Và xảy ra vào thời ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một người nam quê A-đu-lam”; tiếng Hê-bơ-rơ có thể chỉ đơn giản xác định quê quán của người ấy, nhưng cách diễn đạt cũng có thể dùng để giới thiệu một cá nhân cụ thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Bấy giờ
  rationale: Cụm này mở đầu một diễn biến mới và xác định thời điểm. “Bấy giờ” tự nhiên, trang trọng và giữ chức năng trần thuật mà không dịch nặng nề từng chữ.
- source_word: וַיֵּרֶד
  choice: đi xuống
  rationale: Giữ nguyên nét nghĩa chỉ hướng của động từ ירד trong lời kể.
- source_word: מֵאֵת אֶחָיו
  choice: rời các anh em mình
  rationale: Diễn đạt rõ sự tách khỏi các anh em; đại từ “mình” quy chiếu tự nhiên về Giu-đa trong tiếng Việt.
- source_word: וַיֵּט עַד
  choice: ghé đến chỗ
  rationale: Trong ngữ cảnh này, נטה diễn tả việc rẽ hoặc ghé về phía một người. “Ghé đến chỗ” tự nhiên trong tiếng Việt, đồng thời không hàm ý quá mức rằng đây chỉ là một cuộc thăm viếng ngắn.
- source_word: אִישׁ עֲדֻלָּמִי
  choice: một người A-đu-lam
  rationale: אִישׁ cùng danh xưng chỉ xuất xứ giới thiệu một người nam cụ thể từ A-đu-lam. Cách dịch này giữ thông tin về nguồn gốc mà không gượng ép.
- source_word: וּשְׁמוֹ חִירָה
  choice: tên là Hi-ra
  rationale: Cách kết nối tự nhiên trong tiếng Việt, vẫn truyền đạt đầy đủ mệnh đề định danh của tiếng Hê-bơ-rơ.
- source_word: יְהוּדָה / עֲדֻלָּמִי / חִירָה
  choice: Giu-đa / A-đu-lam / Hi-ra
  rationale: Phiên âm các tên riêng theo lối quen thuộc, rõ âm tiết và dễ đọc đối với độc giả Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Bấy giờ” làm công thức chuyển cảnh; giữ “đi xuống” để bảo toàn nét chỉ hướng của nguyên văn, và dùng “ghé đến chỗ” để diễn đạt thành ngữ chuyển động một cách tự nhiên.
