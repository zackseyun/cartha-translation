  terminology: Các tên riêng Giu-đa, A-đu-lam và Hi-ra được phiên âm nhất quán và dễ đọc. “Một người A-đu-lam” giữ được cả danh từ ‘người nam’ lẫn xuất xứ của האיש העדולמי mà không cần làm nặng câu chính.
