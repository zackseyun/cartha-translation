- from: 'Ông trở về gặp Giu-đa và nói: “Tôi không tìm thấy cô ấy. Hơn nữa, những người đàn ông ở nơi đó nói: ‘Ở đây chưa từng có gái mại dâm trong nghi lễ[a].’”'
  to: 'Ông trở lại với Giu-đa và nói: “Tôi không tìm thấy cô ấy; hơn nữa, những người đàn ông ở đó nói: ‘Ở đây chưa hề có gái mại dâm nghi lễ[a].’”'
