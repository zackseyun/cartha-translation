  text: וַ/יָּ֨שָׁב֙ אֶל יְהוּדָ֔ה וַ/יֹּ֖אמֶר לֹ֣א מְצָאתִ֑י/הָ וְ/גַ֨ם אַנְשֵׁ֤י הַ/מָּקוֹם֙ אָֽמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: vi
  text: 'Ông trở lại với Giu-đa và nói: “Tôi không tìm thấy cô ấy; hơn nữa, những người đàn ông ở đó nói: ‘Ở đây chưa hề có gái mại dâm nghi lễ[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ qĕdēšâ, có liên hệ với ý niệm “được thánh hiến.” Trong văn cảnh, từ này được phân biệt với từ thông thường chỉ gái mại dâm; có thể dịch là “gái mại dâm đền thờ” hoặc “người nữ được biệt riêng.” Ý nghĩa chính xác và mối liên hệ lịch sử với thực hành nghi lễ vẫn còn được tranh luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Ông trở về
  rationale: Động từ wayyiqtol tiếp nối diễn tiến câu chuyện. Tiếng Việt không cần thêm “và” hoặc “rồi” vì trình tự đã rõ; “ông” chỉ người đàn ông được sai đi trong văn cảnh.
- source_word: אֶל־יְהוּדָה
  choice: gặp Giu-đa
  rationale: אֶל chỉ hướng trở về phía Giu-đa; trong tiếng Việt, “trở về gặp Giu-đa” tự nhiên hơn “trở về với Giu-đa” và không làm thay đổi quan hệ được diễn tả.
- source_word: לֹא מְצָאתִיהָ
  choice: Tôi không tìm thấy cô ấy
  rationale: Dạng hoàn thành có phủ định báo cáo kết quả của cuộc tìm kiếm đã diễn ra; không thêm sắc thái bất lực như “không thể tìm thấy”.
- source_word: וְגַם
  choice: Hơn nữa
  rationale: Giữ lực bổ sung của cụm từ, đưa ra lời người địa phương như một thông tin hỗ trợ thứ hai; cách diễn đạt tự nhiên trong lời kể tiếng Việt.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: những người đàn ông ở nơi đó
  rationale: Giữ nghĩa giống đực số nhiều cụ thể của אֲנָשִׁים và quan hệ sở thuộc với “nơi đó”, thay vì khái quát thành “người dân”.
- source_word: לֹא הָיְתָה בָזֶה
  choice: Ở đây chưa từng có
  rationale: Cấu trúc tồn tại với phủ định bác bỏ việc một người như thế đã hiện diện tại địa điểm này. “Chưa từng có” truyền đạt tự nhiên giá trị quá khứ của הָיְתָה trong lời xác nhận của dân địa phương.
- source_word: קְדֵשָׁה
  choice: gái mại dâm trong nghi lễ
  rationale: Danh từ giống cái có liên hệ từ nguyên với phạm vi “thánh/được biệt riêng” và trong văn cảnh chỉ một phụ nữ gắn với hoạt động tình dục mang tính nghi lễ. Cách dịch này giữ sắc thái thờ cúng mà không mặc nhiên xác định hoạt động ấy thuộc một cơ sở đền thờ chính thức.
theological_decisions:
- issue: Bản chất chính xác của קְדֵשָׁה và mối liên hệ giữa mại dâm với nghi lễ
  choice: gái mại dâm trong nghi lễ
  alternative: gái mại dâm đền thờ; người nữ được biệt riêng
  rationale: Văn cảnh phân biệt từ này với זֹנָה ở các câu lân cận, nhưng bằng chứng từ nguyên và lịch sử không cho phép xác định chắc chắn một chức vụ chính thức trong đền thờ. Bản dịch chính nêu liên hệ nghi lễ mà không giải quyết quá mức sự mơ hồ; chú thích cung cấp các cách hiểu khác.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Tách lời báo cáo thành hai câu để lời thoại tự nhiên trong tiếng Việt. Đại từ “ông” và “cô ấy” phù hợp với các nhân vật trưởng thành trong văn cảnh, không thêm quan hệ thân sơ ngoài nguyên văn.
