  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: vi
  text: Sau đó, người anh em của cậu bé ấy ra đời, trên tay cậu có sợi chỉ đỏ thắm[a], và người ta đặt tên cậu là Xê-rách[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ chỉ nói “đỏ thắm” trên tay; “sợi chỉ” được bổ sung theo ngữ cảnh ngay trước đó ở câu 28.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “và [ông ấy] gọi tên cậu là Xê-rách.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Sau đó
  rationale: Diễn tả hành động xảy ra tiếp theo trong trình tự sinh nở, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: יָצָא
  choice: ra đời
  rationale: Động từ nghĩa đen là “đi/ra”; trong ngữ cảnh sinh nở, “ra đời” truyền đạt tự nhiên việc đứa trẻ ra khỏi lòng mẹ.
- source_word: אָחִיו
  choice: người anh em của cậu bé
  rationale: Giữ nghĩa từ thân tộc “anh/em trai” mà không quyết định người này là anh hay em, vì diễn tiến bất thường của cuộc sinh đôi khiến cách gọi theo thứ tự sinh có thể gây hiểu sai.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: trên tay có sợi chỉ đỏ thắm
  rationale: Diễn đạt tự nhiên mệnh đề quan hệ dùng dấu chỉ trên tay để nhận diện đứa trẻ; “sợi chỉ” được bổ sung từ ngữ cảnh trực tiếp ở câu 28.
- source_word: הַשָּׁנִי
  choice: sợi chỉ đỏ thắm
  rationale: Từ Hê-bơ-rơ chỉ màu hoặc vật liệu đỏ thắm; danh từ “sợi chỉ” được tỉnh lược tại đây nhưng đã xuất hiện trong ngữ cảnh trước.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: người ta đặt tên cậu
  rationale: Thành ngữ nghĩa đen là “gọi tên nó”; cách dùng chủ ngữ phiếm chỉ tránh xác định quá mức người đặt tên, trong khi vẫn truyền đạt tự nhiên bằng tiếng Việt.
- source_word: זָרַח
  choice: Xê-rách
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc đối với độc giả Việt.
theological_decisions:
- issue: Chủ thể của וַיִּקְרָא (“gọi/đặt tên”)
  choice: người ta đặt tên cậu
  alternative: bà ấy đặt tên cậu / ông ấy đặt tên cậu
  rationale: Dạng động từ Hê-bơ-rơ là giống đực số ít, nhưng ngữ cảnh không xác định chắc chắn chủ thể. Tiếng Việt dùng chủ ngữ phiếm chỉ để không gán người đặt tên khi bản văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ra đời” phù hợp ngữ cảnh sinh nở; dùng “người anh em” để bảo toàn sự không phân định anh/em trong אָחִיו; dùng “người ta” nhằm tránh xác định chủ thể đặt tên vượt quá điều bản văn cho biết.
