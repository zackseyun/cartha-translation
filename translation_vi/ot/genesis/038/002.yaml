  text: וַ/יַּרְא שָׁ֧ם יְהוּדָ֛ה בַּת אִ֥ישׁ כְּנַעֲנִ֖י וּ/שְׁמ֣/וֹ שׁ֑וּעַ וַ/יִּקָּחֶ֖/הָ וַ/יָּבֹ֥א אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: vi
  text: Tại đó, Giu-đa thấy con gái của một người Ca-na-an tên là Su-a[a]. Ông lấy nàng và ăn ở với nàng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “và tên ông ấy là Su-a”; tên này chỉ người cha Ca-na-an, không phải người con gái.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “đi vào với nàng”, một thành ngữ Hê-bơ-rơ chỉ việc quan hệ tình dục.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Động từ ראה trong mạch kể chuyện có nghĩa trực tiếp là “thấy”; không nên diễn giải thêm thành “gặp”.
- source_word: שָׁם
  choice: tại đó
  rationale: Giữ rõ trạng từ chỉ nơi chốn, đồng thời phù hợp văn phong kể chuyện tiếng Việt.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: con gái của một người Ca-na-an
  rationale: 'Phản ánh rõ chuỗi sở thuộc trong tiếng Hê-bơ-rơ: “con gái của một người, một người Ca-na-an”.'
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: tên là Su-a
  rationale: Đại từ giống đực trong “tên ông ấy là” chỉ người cha Ca-na-an, không chỉ người con gái; chú thích làm rõ điểm có thể gây nhập nhằng trong tiếng Việt.
- source_word: וַיִּקָּחֶהָ
  choice: Ông cưới nàng làm vợ
  rationale: Trong ngữ cảnh một người đàn ông “lấy” một phụ nữ rồi sinh con với nàng, לקח mang nghĩa lấy làm vợ; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ăn ở với nàng
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ quan hệ tình dục. “Ăn ở với” là cách nói trang trọng, dễ hiểu trong văn phong Kinh Thánh tiếng Việt; chú thích nêu nghĩa trực tiếp.
theological_decisions:
- issue: Mức độ hàm ý hôn nhân của וַיִּקָּחֶהָ
  choice: cưới nàng làm vợ
  alternative: đem nàng về / lấy nàng
  rationale: Dù động từ đơn lẻ có nghĩa “lấy”, cấu trúc và ngữ cảnh ở đây thường chỉ việc lấy một phụ nữ làm vợ. Bản dịch diễn đạt hàm ý ngữ cảnh mà không thêm một nhận định thần học về tính chính đáng của cuộc hôn nhân.
- issue: Cách thể hiện thành ngữ tình dục וַיָּבֹא אֵלֶיהָ
  choice: ăn ở với nàng
  alternative: đến với nàng
  rationale: “Đến với nàng” có thể quá mơ hồ đối với độc giả hiện đại; “ăn ở với nàng” giữ sắc thái kín đáo nhưng truyền đạt đúng nghĩa, còn chú thích bảo toàn hình ảnh nguyên ngữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Giu-đa”, “Ca-na-an”, “Su-a” theo lối phiên âm Kinh Thánh quen thuộc; dùng “ông” và “nàng” để duy trì giọng kể dignified mà không quá cổ.
