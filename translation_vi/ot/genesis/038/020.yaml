  to: Bấy giờ, Giu-đa sai người bạn là người A-đu-lam mang dê con đến để lấy lại vật làm tin từ tay người phụ nữ[a], nhưng người bạn ấy không tìm thấy nàng.
  rationale: Đổi “nhờ” thành “sai” để phản ánh trực tiếp hành động sai phái trong nguyên văn, và đổi “người ấy” thành “người bạn ấy” để xác định chính xác người không tìm thấy người phụ nữ. Các lựa chọn còn lại được giữ vì trung thành với văn bản và tự nhiên trong tiếng Việt hiện đại.
