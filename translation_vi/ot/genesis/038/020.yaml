  text: וַ/יִּשְׁלַ֨ח יְהוּדָ֜ה אֶת גְּדִ֣י הָֽ/עִזִּ֗ים בְּ/יַד֙ רֵעֵ֣/הוּ הָֽ/עֲדֻלָּמִ֔י לָ/קַ֥חַת הָ/עֵרָב֖וֹן מִ/יַּ֣ד הָ/אִשָּׁ֑ה וְ/לֹ֖א מְצָאָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: vi
  text: Bấy giờ, Giu-đa sai người bạn là người A-đu-lam mang dê con đến để lấy lại vật làm tin từ tay người phụ nữ[a], nhưng người bạn ấy không tìm thấy nàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “từ tay người phụ nữ”; cách nói này chỉ việc lấy lại từ người phụ nữ đang giữ vật ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Bấy giờ, ... nhờ ... mang ... đến
  rationale: Động từ với waw liên tiếp đưa câu chuyện tiến sang hành động kế tiếp. Trong ngữ cảnh sai một người đem vật đi, cấu trúc “nhờ ... mang ... đến” tự nhiên trong tiếng Việt và vẫn diễn đạt quan hệ sai phái.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: גְּדִי הָעִזִּים
  choice: con dê con
  rationale: Cụm từ chỉ một con dê còn non; cách nói này tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: בְּיַד
  choice: nhờ
  rationale: Thành ngữ nguyên văn là “bởi tay”, ở đây biểu thị trung gian hay người được sai đi. “Nhờ” chuyển tải đúng chức năng ấy bằng tiếng Việt tự nhiên.
- source_word: רֵעֵהוּ
  choice: người bạn
  rationale: Danh từ chỉ bạn bè hoặc người đồng hành; “người bạn” phù hợp ngữ cảnh và không xác định quá mức quan hệ.
- source_word: הָעֲדֻלָּמִי
  choice: quê ở A-đu-lam
  rationale: Tính từ chỉ người đến từ A-đu-lam. Tiếng Việt diễn đạt tự nhiên bằng cụm chỉ quê quán.
- source_word: לָקַחַת
  choice: để lấy lại
  rationale: Động từ nguyên mẫu nêu mục đích. Ngữ cảnh cho thấy Giu-đa muốn thu hồi những vật đã giao làm bảo chứng, nên “lấy lại” thể hiện đúng ý hồi phục quyền sở hữu.
- source_word: הָעֵרָבוֹן
  choice: vật làm tin
  rationale: Danh từ chỉ đồ vật được giao làm bảo chứng. “Vật làm tin” rõ ràng, tự nhiên và phù hợp bối cảnh giao dịch trong câu chuyện.
- source_word: מִיַּד הָאִשָּׁה
  choice: từ tay người phụ nữ
  rationale: Giữ hình ảnh cụ thể “từ tay” của tiếng Hê-bơ-rơ, đồng thời câu vẫn tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: וְלֹא מְצָאָהּ
  choice: nhưng người ấy không tìm thấy nàng
  rationale: “Nhưng” nêu bật kết quả trái với mục đích chuyến đi. Chủ ngữ được diễn đạt là “người ấy” để tránh đại từ mơ hồ; hậu tố giống cái được chuyển là “nàng” theo văn phong kể chuyện trang trọng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hình ảnh “từ tay” của nguyên bản nhưng dùng “nhờ ... mang ... đến” thay cho lối dịch sát chữ “sai qua tay” vốn không tự nhiên trong tiếng Việt.
