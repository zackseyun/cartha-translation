  register: Bản dịch dùng tiếng Việt hiện đại, tự nhiên và trang trọng vừa phải. Cấu trúc bị động Hê-bơ-rơ được chuyển thành chủ ngữ phiếm chỉ “có người” để tránh câu bị động nặng nề; không có khác biệt thần học cần chú thích.
