  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: vi
  text: 'Người ta báo cho Ta-ma rằng: “Này, cha chồng cô đang lên Tim-na để xén lông đàn chiên của ông ấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: Có người báo cho Ta-ma
  rationale: Dạng Hophal diễn tả hành động thông báo theo thể bị động, nhưng tiếng Việt tự nhiên thường dùng chủ ngữ phiếm chỉ “có người” thay cho “Ta-ma được báo”; לְתָמָר xác định người nhận tin.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức dẫn lời được chuyển tự nhiên bằng “rằng” và dấu hai chấm, vừa phản ánh chức năng của từ Hê-bơ-rơ vừa tránh lối dịch cứng “nói rằng”.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý của thán từ trong lời báo, bằng một từ hiện đại và trang trọng vừa phải.
- source_word: חָמִיךְ
  choice: cha chồng cô
  rationale: Danh từ chỉ quan hệ thân thuộc với hậu tố ngôi hai giống cái số ít, nói với Ta-ma; “cô” thể hiện người nữ được xưng hô mà không thêm sắc thái kính trọng quá mức.
- source_word: עֹלֶה
  choice: đang lên
  rationale: Phân từ Qal biểu thị hành động đang diễn ra hoặc sắp xảy ra; “đang lên” giữ sắc thái tiến hành và hướng đi lên.
- source_word: תִמְנָתָה
  choice: Tim-na
  rationale: Địa danh kèm ה chỉ hướng được chuyển là điểm đến; phiên âm theo âm dạng Hê-bơ-rơ.
- source_word: לָגֹז
  choice: để xén lông
  rationale: Động từ nguyên mẫu với ל biểu thị mục đích; trong ngữ cảnh chiên, tiếng Việt tự nhiên nói “xén lông”.
- source_word: צֹאנוֹ
  choice: chiên của ông ấy
  rationale: צֹאן có thể chỉ đàn gia súc nhỏ, nhưng ngữ cảnh xén lông ủng hộ nghĩa cụ thể là chiên; hậu tố ngôi ba số ít được diễn đạt rõ là “của ông ấy”.
