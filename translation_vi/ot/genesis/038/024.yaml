revisions:
- from: 'Khoảng ba tháng sau, người ta báo cho Giu-đa rằng: “Ta-ma, con dâu ông, đã hành nghề mại dâm[a]; hơn nữa, cô ấy đã mang thai do việc mại dâm.” Giu-đa nói: “Hãy đem cô ấy ra và thiêu cô ấy đi.”'
  to: 'Khoảng ba tháng sau, người ta báo cho Giu-đa rằng: “Ta-ma, con dâu ông, đã sống như một gái mại dâm[a]; và này, cô ấy cũng đã mang thai do mại dâm.” Giu-đa nói: “Hãy đem cô ấy ra, và để cô ấy bị thiêu.”'
  rationale: Sửa “hành nghề mại dâm” thành “sống như một gái mại dâm” để giữ hình ảnh từ vựng của nguyên ngữ mà không thêm khẳng định rằng Ta-ma có nghề mại dâm. Khôi phục sắc thái nhấn mạnh của הִנֵּה bằng “và này,” và sửa mệnh lệnh cuối sang bị động để phản ánh Niphal, không xác định người trực tiếp thi hành án.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:33:20Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mốc thời gian xấp xỉ, việc Giu-đa nhận được lời báo, quan hệ con dâu, lời cáo buộc liên kết giữa זָנְתָה và לִזְנוּנִים, cùng mệnh lệnh đem Ta-ma ra để bị thiêu. Tuy nhiên, “hành nghề mại dâm” thêm sắc thái đây là một nghề nghiệp ổn định, điều động từ זָנְתָה không tự nó khẳng định. Cú pháp chủ động “thiêu cô ấy đi” cũng làm mờ dạng bị động Niphal của nguyên văn.
  naturalness: Câu văn nhìn chung hiện đại và rõ ràng. “Đã sống như một gái mại dâm” diễn đạt tự nhiên hơn mà không hàm ý không cần thiết về nghề nghiệp; “để cô ấy bị thiêu” giữ được sắc thái bản án bị động và vẫn dễ hiểu trong văn phong trang nghiêm.
  terminology: Giữ “mại dâm” là phù hợp với trường nghĩa זנה/זְנוּנִים trong chính lời cáo buộc, tốt hơn cách khái quát hóa thành “vô luân tình dục.” Tên “Giu-đa” và “Ta-ma” nhất quán với dạng Việt hóa thông dụng.
  issues:
  - severity: medium
    issue: “đã hành nghề mại dâm” xác định quá mức ý nghĩa của זָנְתָה.
    rationale: Cụm này thường nói đến việc theo mại dâm như một nghề; nguyên văn dùng động từ về hành vi/sống như người mại dâm trong lời tố cáo, không xác định tình trạng nghề nghiệp.
  - severity: low
    issue: “và thiêu cô ấy đi” chuyển mệnh lệnh bị động thành chủ động.
    rationale: וְתִשָּׂרֵף là Niphal, nghĩa là “để cô ấy bị thiêu.” Bản sửa giữ tính không nêu tác nhân của nguyên văn.
  revised_text: 'Khoảng ba tháng sau, người ta báo cho Giu-đa rằng: “Ta-ma, con dâu ông, đã sống như một gái mại dâm[a]; và này, cô ấy cũng đã mang thai do mại dâm.” Giu-đa nói: “Hãy đem cô ấy ra, và để cô ấy bị thiêu.”'
