  text: וַ/יְהִ֣י כְּ/מִ/שְׁלֹ֣שׁ חֳדָשִׁ֗ים וַ/יֻּגַּ֨ד לִֽ/יהוּדָ֤ה לֵֽ/אמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔/ךָ וְ/גַ֛ם הִנֵּ֥ה הָרָ֖ה לִ/זְנוּנִ֑ים וַ/יֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּ/הָ וְ/תִשָּׂרֵֽף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: vi
  text: 'Khoảng ba tháng sau, người ta báo cho Giu-đa rằng: “Ta-ma, con dâu ông, đã sống như một gái mại dâm[a]; và này, cô ấy cũng đã mang thai do mại dâm.” Giu-đa nói: “Hãy đem cô ấy ra, và để cô ấy bị thiêu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã làm điếm”; hoặc, theo nghĩa rộng hơn, “đã phạm tội vô luân tình dục.” Nguyên ngữ dùng từ ngữ gắn với mại dâm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: Khoảng ba tháng sau
  rationale: Diễn đạt tự nhiên trong tiếng Việt lời chuyển tiếp tự sự và mốc thời gian xấp xỉ, không dùng công thức cổ kính không cần thiết.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: người ta báo cho Giu-đa rằng
  rationale: Chuyển cấu trúc bị động vô nhân xưng của động từ נגד sang lối nói tiếng Việt tự nhiên, đồng thời không xác định người báo tin.
- source_word: זָנְתָה
  choice: đã hành nghề mại dâm
  rationale: Giữ hình ảnh mại dâm cụ thể của זנה trong lời cáo buộc, thay vì làm rộng nghĩa thành sự vô luân tình dục nói chung.
- source_word: וְגַם הִנֵּה
  choice: hơn nữa
  rationale: Truyền đạt sức nhấn mạnh và ý bổ sung của tổ hợp này bằng cách nói hiện đại, tự nhiên; tránh từ cảm thán “kìa” vốn gượng trong lời báo cáo gián tiếp.
- source_word: הָרָה לִזְנוּנִים
  choice: đã mang thai do việc mại dâm
  rationale: Giữ quan hệ nguyên nhân và liên hệ từ vựng với זָנְתָה, dù cách diễn đạt Hê-bơ-rơ có thể hiểu là mang thai do hoặc từ những hành vi mại dâm.
- source_word: הוֹצִיאוּהָ
  choice: Hãy đem cô ấy ra
  rationale: Phản ánh mệnh lệnh số nhiều có hậu tố giống cái số ít mà không bổ sung địa điểm hay thủ tục không có trong nguyên văn.
- source_word: וְתִשָּׂרֵף
  choice: và thiêu cô ấy đi
  rationale: Lối mệnh lệnh tự nhiên trong tiếng Việt truyền đạt bản án thiêu; tuy chuyển thành cú pháp chủ động ở bề mặt, câu không xác định cụ thể người thi hành.
theological_decisions:
- issue: Thuật ngữ chỉ tội tình dục trong lời cáo buộc
  choice: 'Dùng ngôn ngữ mại dâm: “đã hành nghề mại dâm” và “do việc mại dâm.”'
  alternative: “đã phạm tội gian dâm/vô luân tình dục” và “do sự gian dâm.”
  rationale: Hai từ Hê-bơ-rơ זנה và זנונים cùng một trường từ vựng, gợi trực tiếp đến mại dâm. Cách dịch này giữ nguyên sắc thái lời cáo buộc và mối liên hệ giữa hai vế, không áp đặt một phạm trù giáo lý rộng hơn.
- issue: Sức nặng bản án của Giu-đa
  choice: “Hãy đem cô ấy ra và thiêu cô ấy đi.”
  alternative: “Hãy đem cô ấy ra để bị thiêu” hoặc “hãy để cô ấy bị thiêu.”
  rationale: Nguyên văn là mệnh lệnh tức thời dẫn đến việc bị thiêu. Tiếng Việt chủ động tự nhiên hơn, nhưng không nói rõ ai thi hành hay liệu đây là thiêu sống hay thiêu xác, là những điều câu Hê-bơ-rơ không giải quyết.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “cô ấy” trong lời báo cáo và mệnh lệnh để tránh sắc thái miệt thị ngoài nguyên văn. Giữ tên riêng theo dạng Việt hóa thông dụng. Dấu chân chú [a] xuất hiện ngay sau cụm từ liên quan.
