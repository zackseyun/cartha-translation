translation:
  language: vi
  text: Giu-đa cưới vợ cho Ê-rơ, con trai đầu lòng của ông; nàng tên là Ta-ma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: cưới cho
  rationale: Trong cấu trúc “lấy một người vợ cho Ê-rơ,” động từ לָקַח diễn tả việc Giu-đa tìm hoặc thu xếp vợ cho con. “Cưới cho” là cách nói tự nhiên trong tiếng Việt, giữ đúng vai trò chủ động của Giu-đa mà không diễn giải quá mức thành một nghi thức cụ thể.
- source_word: אִשָּׁה
  choice: một người vợ
  rationale: Ngữ cảnh hôn nhân xác định אִשָּׁה mang nghĩa “vợ,” không chỉ đơn thuần là “người phụ nữ.”
- source_word: לְעֵר
  choice: cho Ê-rơ
  rationale: Giới từ לְ đánh dấu người nhận hoặc người được hưởng hành động; “cho Ê-rơ” là cách diễn đạt tự nhiên và sát nghĩa.
- source_word: בְּכוֹרוֹ
  choice: con trai đầu lòng của mình
  rationale: בְּכוֹר chỉ con trai sinh đầu tiên. “Con trai đầu lòng” giữ sắc thái gia đình của nguyên văn và làm rõ người được nói đến là con của Giu-đa.
- source_word: וּשְׁמָהּ
  choice: tên là
  rationale: Công thức đặt tên trong tiếng Hê-bơ-rơ được chuyển thành lối nói gọn, tự nhiên trong tiếng Việt; ý nghĩa “và tên nàng là” vẫn được bảo toàn trong cấu trúc câu.
- source_word: תָּמָר
  choice: Ta-ma
  rationale: Tên riêng được phiên âm theo cách đọc quen thuộc và dễ tiếp nhận trong tiếng Việt.
theological_decisions: []
translation_notes:
