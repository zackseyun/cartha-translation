  to: 'Trong lúc nàng đang bị đưa ra, nàng gửi lời đến cha chồng rằng: “Tôi có thai với người mà những vật này thuộc về.” Rồi nàng nói: “Xin ông nhận ra[a] chiếc ấn, những sợi dây và cây gậy này là của ai.”'
