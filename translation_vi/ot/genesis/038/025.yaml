  text: הִ֣וא מוּצֵ֗את וְ/הִ֨יא שָׁלְחָ֤ה אֶל חָמִ֨י/הָ֙ לֵ/אמֹ֔ר לְ/אִישׁ֙ אֲשֶׁר אֵ֣לֶּה לּ֔/וֹ אָנֹכִ֖י הָרָ֑ה וַ/תֹּ֨אמֶר֙ הַכֶּר נָ֔א לְ/מִ֞י הַ/חֹתֶ֧מֶת וְ/הַ/פְּתִילִ֛ים וְ/הַ/מַּטֶּ֖ה הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: vi
  text: 'Trong lúc nàng đang bị đưa ra, nàng gửi lời đến cha chồng rằng: “Tôi có thai với người mà những vật này thuộc về.” Rồi nàng nói: “Xin ông nhận ra[a] chiếc ấn, những sợi dây và cây gậy này là của ai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xác định”. Động từ Hê-bơ-rơ có thể mang nghĩa nhận ra hoặc xác định; ở đây lời yêu cầu có sức nặng như việc đưa ra chứng cứ.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: đang bị đưa ra
  rationale: Phân từ bị động của יצא diễn tả hành động đang diễn tiến; cách dịch này giữ sắc thái nàng bị đưa đi để chịu hình phạt mà không thêm địa điểm hay hình thức hành quyết không có trong câu.
- source_word: שָׁלְחָה אֶל חָמִיהָ
  choice: gửi lời đến cha chồng
  rationale: Trong ngữ cảnh có lời nhắn theo sau, שָׁלְחָה được diễn đạt tự nhiên là “gửi lời”; חָמִיהָ chỉ trực tiếp người cha chồng.
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ
  choice: với người đàn ông là chủ của những vật này
  rationale: Cụm giới từ cùng mệnh đề quan hệ nêu người sở hữu các vật; với הָרָה, tiếng Việt tự nhiên dùng “có thai với” để chỉ người cha của thai nhi.
- source_word: הָרָה
  choice: có thai
  rationale: Cách nói hiện đại, rõ nghĩa và trực tiếp tương ứng với tính từ “mang thai” trong tiếng Hê-bơ-rơ.
- source_word: הַכֶּר נָא
  choice: Xin ông nhận ra
  rationale: Giữ nghĩa căn bản “nhận ra/nhận biết” của נכר và sắc thái thỉnh cầu của נָא; cách gọi “ông” phù hợp khi Ta-ma nói với cha chồng, đồng thời lời nói có sức buộc ông đối diện với chứng vật.
- source_word: חֹתֶמֶת
  choice: chiếc ấn
  rationale: Chỉ con dấu cá nhân dùng để xác nhận danh tính; nguyên ngữ không nhất thiết nói đến một chiếc nhẫn, nên “chiếc ấn” tránh xác định quá mức.
- source_word: פְּתִילִים
  choice: những sợi dây
  rationale: Giữ số nhiều của danh từ và không suy đoán quá mức về cấu tạo hoặc công dụng chính xác của các dây.
- source_word: מַטֶּה
  choice: cây gậy
  rationale: Tương ứng tự nhiên với chiếc gậy mang theo trong bối cảnh truyện tổ phụ.
- source_word: לְמִי ... הָאֵלֶּה
  choice: này là của ai
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu nghi vấn của tiếng Hê-bơ-rơ và giữ sự quy chiếu đến ba chứng vật.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “nàng” cho Ta-ma và “ông” trong lời nàng nói với Giu-đa để câu văn tự nhiên, tôn trọng quan hệ gia đình. Dấu chú thích được đặt ngay sau động từ mà chú thích giải nghĩa.
