revisions:
- from: 'Ông rẽ đến chỗ nàng bên đường và nói: “Nào, cho tôi ăn nằm với cô[a],” vì ông không biết nàng là con dâu mình. Nàng hỏi: “Ông sẽ cho tôi gì để được ăn nằm với tôi[b]?”'
  to: 'Ông rẽ sang chỗ nàng bên đường và nói: “Nào, hãy để tôi đến với cô[a],” vì ông không biết nàng là con dâu mình. Nàng hỏi: “Ông sẽ cho tôi gì để ông đến với tôi[b]?”'
  rationale: Bản sửa bảo toàn nghĩa của động từ «rẽ sang», sắc thái lời đề nghị của הָבָה נָּא, và nhất là uyển ngữ lặp lại בוא אל. Chú thích a tiếp tục giải thích nghĩa tình dục mà không làm chính văn trở nên trực diện hơn nguồn Hê-bơ-rơ. Chú thích b vẫn nêu khả năng ngữ cảnh là khoản trả công, đồng thời giữ động từ rộng nghĩa «cho» trong chính văn.
  reviewer_model: gpt-5.6-terra
