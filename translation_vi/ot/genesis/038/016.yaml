base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: vi
  text: 'Ông rẽ sang chỗ nàng bên đường và nói: “Nào, hãy để tôi đến với cô[a],” vì ông không biết nàng là con dâu mình. Nàng hỏi: “Ông sẽ cho tôi gì để ông đến với tôi[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ nói “đến với cô/tôi”, một lối nói uyển chuyển chỉ quan hệ tình dục.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “Ông sẽ trả tôi gì để ông đến với tôi?” Nguyên văn sát chữ là: “Ông sẽ cho tôi gì...?”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: Ông rẽ đến chỗ nàng bên đường
  rationale: נטה diễn tả việc Giu-đa đổi hướng khỏi lộ trình để tiến đến chỗ Ta-ma; “rẽ đến chỗ” tự nhiên trong tiếng Việt và vẫn giữ chuyển động của nguyên văn. אֶל־הַדֶּרֶךְ được hiểu theo bối cảnh là vị trí bên đường.
- source_word: הָבָה נָּא
  choice: Nào, cho tôi
  rationale: Tổ hợp này mang sắc thái thúc giục hoặc đề nghị. “Nào, cho tôi...” là lời nói tự nhiên, phù hợp với sự trực tiếp của câu mà không thêm sắc thái lịch sự quá mức.
- source_word: אָבוֹא אֵלַיִךְ / תָבוֹא אֵלָי
  choice: ăn nằm với cô / ăn nằm với tôi
  rationale: Cụm בוא אל là lối nói uyển chuyển chỉ quan hệ tình dục trong ngữ cảnh này. Tiếng Việt không thể sao chép tự nhiên hình ảnh “đi vào với”; “ăn nằm với” giữ được tính uyển ngữ, rõ nghĩa và có sắc thái kể chuyện trang trọng.
- source_word: כִּי לֹא יָדַע כִּי כַלָּתוֹ הִוא
  choice: vì ông không biết nàng là con dâu mình
  rationale: Hai lần כִּי lần lượt có chức năng giải thích và dẫn mệnh đề nội dung. Cách dịch này gọn, rõ và giữ nguyên lý do người kể đưa ra.
- source_word: מַה תִּתֶּן לִּי
  choice: Ông sẽ cho tôi gì
  rationale: Giữ động từ rộng nghĩa נתן là “cho” thay vì diễn giải thành “trả”, dù trong ngữ cảnh lời hỏi hàm ý khoản thù lao.
- source_word: כִּי תָבוֹא אֵלָי
  choice: để được ăn nằm với tôi
  rationale: כִּי ở đây liên kết món được cho với hành động sắp diễn ra. “Để được” diễn đạt tự nhiên quan hệ trao đổi hàm chứa trong câu mà vẫn giữ câu hỏi về điều sẽ được cho.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Dùng “ông/nàng” trong lời trần thuật để phù hợp bối cảnh cổ, còn lời thoại dùng “tôi/cô” theo quan hệ giữa hai người xa lạ. “Ăn nằm với” được chọn như một uyển ngữ tiếng Việt tự nhiên; các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
