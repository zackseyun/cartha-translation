base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/004.yaml
  text: She conceived again and bore a son, and she named him Onan.
translation:
  language: vi
  text: Nàng lại mang thai, sinh một con trai và đặt tên là Ô-nan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: mang thai
  rationale: Động từ הרה chỉ việc thụ thai hoặc có thai. “Mang thai” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và phù hợp với mạch kể.
- source_word: עוֹד
  choice: lại
  rationale: Trong chuỗi sinh con này, עוֹד diễn tả sự lặp lại; “lại” truyền đạt gọn và tự nhiên.
- source_word: וַתֵּלֶד בֵּן
  choice: sinh một con trai
  rationale: Cụm ילד + בֵּן là cách diễn đạt thông thường về việc sinh con trai; bản dịch giữ sự ngắn gọn của tiếng Hê-bơ-rơ.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: đặt tên là
  rationale: Nghĩa đen là “gọi tên nó,” nhưng “đặt tên là” là thành ngữ tự nhiên trong tiếng Việt và bảo toàn ý nghĩa.
- source_word: אוֹנָן
  choice: Ô-nan
  rationale: Phiên âm tên riêng theo lối viết tiếng Việt quen thuộc trong các bản Kinh Thánh.
theological_decisions: []
