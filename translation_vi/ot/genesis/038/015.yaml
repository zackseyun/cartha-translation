  text: וַ/יִּרְאֶ֣/הָ יְהוּדָ֔ה וַֽ/יַּחְשְׁבֶ֖/הָ לְ/זוֹנָ֑ה כִּ֥י כִסְּתָ֖ה פָּנֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/015.yaml
  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: vi
  text: Khi Giu-đa thấy nàng, ông tưởng nàng là gái mại dâm[a], vì nàng đã che mặt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ông coi nàng là gái mại dâm.”'
    reason: Giữ lại khả năng diễn đạt חשב theo nghĩa “coi/cho là”, bên cạnh cách dịch tự nhiên “tưởng ... là”.
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: Khi Giu-đa thấy nàng
  rationale: Động từ ראה có nghĩa là “thấy”; cấu trúc “Khi... thấy” diễn đạt tự nhiên trình tự tự sự và quan hệ thời gian với mệnh đề tiếp theo.
- source_word: וַיַּחְשְׁבֶהָ
  choice: ông tưởng nàng là
  rationale: חשב ở đây chỉ sự nhận định trong tâm trí của Giu-đa về thân phận của Ta-ma; “tưởng” diễn đạt gọn và tự nhiên một nhận định hóa ra sai.
- source_word: לְזוֹנָה
  choice: gái mại dâm
  rationale: זוֹנָה chỉ một phụ nữ hành nghề mại dâm. “Gái mại dâm” rõ nghĩa trong tiếng Việt hiện đại và không mang sắc thái cổ như một số cách gọi khác.
- source_word: כִּי
  choice: vì
  rationale: כִּי nêu nguyên nhân khiến Giu-đa đi đến nhận định ấy; “vì” là liên từ nhân quả trực tiếp và tự nhiên.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: nàng đã che mặt
  rationale: כסה nghĩa là “che”, còn פָּנֶיהָ là “mặt nàng”. Từ “đã” thể hiện đây là tình trạng có trước và là căn cứ cho nhận định của Giu-đa.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “nàng” cho Ta-ma và “ông” cho Giu-đa để câu tự nhiên, rõ chủ thể; tránh từ cổ và thuật ngữ xã hội học hiện đại.
