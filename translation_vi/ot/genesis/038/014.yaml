source:
  edition: WLC
  text: וַ/תָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜/הּ מֵֽ/עָלֶ֗י/הָ וַ/תְּכַ֤ס בַּ/צָּעִיף֙ וַ/תִּתְעַלָּ֔ף וַ/תֵּ֨שֶׁב֙ בְּ/פֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל דֶּ֣רֶךְ תִּמְנָ֑תָ/ה כִּ֤י רָאֲתָה֙ כִּֽי גָדַ֣ל שֵׁלָ֔ה וְ/הִ֕וא לֹֽא נִתְּנָ֥ה ל֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: vi
  text: Nàng cởi bỏ y phục góa bụa, lấy khăn che mặt, quấn kín mình, rồi ngồi tại lối vào Ê-na-im[a], trên đường đi Thim-na. Vì nàng thấy Sê-la đã trưởng thành mà người ta vẫn không gả nàng cho chàng làm vợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ này có thể chỉ lối vào một địa danh tên Ê-na-im; một số cách hiểu coi toàn cụm là tên địa điểm Pê-tha Ê-na-im.
    reason: Ghi nhận sự không chắc chắn về cách phân tích địa danh פתח עינים mà không làm nặng câu chính.
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: y phục góa bụa
  rationale: Diễn đạt tự nhiên tình trạng góa bụa được biểu thị bằng trang phục, đồng thời giữ sắc thái trang trọng của nguyên văn.
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: lấy khăn che mặt, quấn kín mình
  rationale: 'Giữ riêng hai động tác trong tiếng Hê-bơ-rơ: che bằng khăn và quấn/che kín bản thân; không lược bỏ động từ thứ hai.'
- source_word: בְּפֶתַח עֵינַיִם
  choice: tại lối vào Ê-na-im[a]
  rationale: Hiểu עֵינַיִם là địa danh và פֶּתַח là lối vào; thêm chú thích vì cấu trúc và tên địa điểm có thể được hiểu khác.
- source_word: גָדַל שֵׁלָה
  choice: Sê-la đã trưởng thành
  rationale: Trong ngữ cảnh hôn nhân, גָדַל nói đến việc đã lớn và đến tuổi trưởng thành, không chỉ tăng kích thước.
- source_word: לֹא נִתְּנָה לוֹ לְאִשָּׁה
  choice: người ta vẫn không gả nàng cho chàng làm vợ
  rationale: Chuyển thể bị động vô chủ sang cách nói tiếng Việt tự nhiên mà không xác định tác nhân; 'vẫn' thể hiện sự trái ngược với việc Sê-la đã trưởng thành.
theological_decisions:
- issue: Mức độ mô tả việc Ta-ma cải trang
  choice: Giữ cả việc che mặt và quấn kín mình
  alternative: Chỉ nói nàng quấn mình trong khăn che mặt
  rationale: Nguyên văn có hai động từ liên tiếp; bản dịch không suy diễn động cơ hay định danh nàng là gái mại dâm ở câu này.
- issue: Tác nhân không gả Ta-ma cho Sê-la
  choice: Dùng chủ thể phiếm chỉ 'người ta'
  alternative: Nêu đích danh Giu-đa
  rationale: Ngữ cảnh cho thấy Giu-đa có trách nhiệm, nhưng câu Hê-bơ-rơ dùng thể bị động và không nêu tác nhân; bản dịch giữ sự dè dặt ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng tên riêng phiên âm nhất quán; tránh từ cổ và tránh thêm phán đoán đạo đức không có trong câu.
