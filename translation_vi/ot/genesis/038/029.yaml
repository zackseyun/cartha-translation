base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: vi
  text: 'Khi đứa bé rụt tay lại, thì kìa, người anh em của nó ra. Bà nói: “Con đã tự mở một lối mà ra như thế nào vậy!” Vì thế, người ta đặt tên nó là Pê-rết.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tên Pê-rết liên hệ với gốc từ Hê-bơ-rơ פָּרַץ, nghĩa là “phá vỡ, đột phá.” Câu nói này lặp lại gốc từ ấy; có thể hiểu sát là: “Con đã phá cho mình một chỗ phá vỡ thế nào vậy!”'
    reason: wordplay
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: khi đứa bé rụt tay lại
  rationale: Động từ Hiphil của שוב cùng với יָד chỉ hành động rút bàn tay trở vào. Thêm “đứa bé” làm rõ chủ thể tự nhiên trong tiếng Việt mà không thay đổi nghĩa.
- source_word: וְהִנֵּה
  choice: thì kìa
  rationale: “Thì kìa” giữ được sắc thái bất ngờ và tính sống động của הִנֵּה trong lời kể.
- source_word: יָצָא אָחִיו
  choice: anh em nó chui ra
  rationale: Trong ngữ cảnh sinh nở, “chui ra” diễn đạt cụ thể và tự nhiên hành động יָצָא; “anh em nó” giữ nguyên cách gọi không xác định anh hay em của tiếng Hê-bơ-rơ.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: Con đã tự phá đường mà ra!
  rationale: Câu cảm thán diễn tả việc đứa trẻ đột phá ra ngoài. “Tự” phản ánh sắc thái khó xác định của עָלֶיךָ theo hướng hành động vì/chính cho bản thân, còn “phá đường mà ra” duy trì liên hệ ý nghĩa với tên פֶּרֶץ.
- source_word: פָּרֶץ
  choice: Pê-rết
  rationale: Phiên âm tên riêng theo cách đọc Hê-bơ-rơ, đồng thời chú thích mối liên hệ với động từ “phá đường mà ra”.
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: người ta đặt tên nó là Pê-rết
  rationale: Nguyên văn dùng công thức đặt tên với chủ thể không được nêu rõ. “Người ta” giữ tính phiếm chỉ, không gán hành động đặt tên cho Ta-ma hay một nhân vật cụ thể.
