  text: וַ/יִּשְׁאַ֞ל אֶת אַנְשֵׁ֤י מְקֹמָ/הּ֙ לֵ/אמֹ֔ר אַיֵּ֧ה הַ/קְּדֵשָׁ֛ה הִ֥וא בָ/עֵינַ֖יִם עַל הַ/דָּ֑רֶךְ וַ/יֹּ֣אמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: vi
  text: 'Ông hỏi những người đàn ông ở nơi ấy: “Người nữ mại dâm có liên hệ với việc thờ cúng[a] ở Ê-na-im[b], bên đường, ở đâu?” Họ đáp: “Ở đây chưa từng có người nữ mại dâm có liên hệ với việc thờ cúng nào.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người nữ mại dâm tại đền thờ.” Từ Hê-bơ-rơ này thường được hiểu là chỉ một người nữ mại dâm có liên hệ với thực hành thờ cúng; bản chất chính xác của mối liên hệ ấy không chắc chắn. Cách dịch ở đây không hàm ý nhất thiết có một kiến trúc đền thờ cụ thể.
    reason: lexical_alternative
  - marker: b
    text: Ê-na-im là một địa danh. Dạng Hê-bơ-rơ của tên này có liên hệ với từ chỉ “đôi mắt,” hoặc có thể là “các suối nước.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Ông hỏi
  rationale: Dùng động từ kể chuyện tự nhiên trong tiếng Việt; đại từ “ông” nối với người nam được nhắc đến trong ngữ cảnh trước.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: những người đàn ông ở nơi ấy
  rationale: Cụm Hê-bơ-rơ sát nghĩa là “những người đàn ông của nơi nàng/nó”; cách dịch này diễn đạt tự nhiên địa điểm đang được nói đến mà không áp đặt một quan hệ cư trú cụ thể.
- source_word: לֵאמֹר
  choice: dấu hai chấm mở lời nói trực tiếp
  rationale: Trong lối kể tiếng Việt, chức năng dẫn lời của “rằng/nói rằng” được thể hiện tự nhiên bằng dấu hai chấm, tránh câu nặng nề.
- source_word: אַיֵּה
  choice: đâu rồi?
  rationale: Câu hỏi nhằm tìm người phụ nữ đã ở đó trước đó; “đâu rồi?” tự nhiên trong hội thoại tiếng Việt và vẫn giữ ý hỏi vị trí.
- source_word: הַקְּדֵשָׁה / קְדֵשָׁה
  choice: người nữ mại dâm tín ngưỡng
  rationale: Phân biệt קְדֵשָׁה với từ thông thường chỉ gái mại dâm trong chương này, đồng thời diễn tả sự liên hệ với thực hành thờ cúng mà không mặc nhiên cho rằng có một đền thờ cụ thể.
- source_word: בָעֵינַיִם
  choice: ở Ê-na-im
  rationale: Hiểu là địa danh theo ngữ cảnh Sáng Thế 38:14 và phiên âm thay vì dịch theo nghĩa từ nguyên.
- source_word: עַל הַדָּרֶךְ
  choice: bên đường
  rationale: Diễn đạt vị trí cạnh đường một cách tự nhiên và chính xác trong tiếng Việt.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: Ở đây chưa từng có người nữ mại dâm tín ngưỡng nào
  rationale: Thể hiện lời phủ nhận của dân địa phương rằng một người như vậy đã hiện diện tại đó; “chưa từng có” phù hợp với thì hoàn thành trong lời đáp.
theological_decisions:
- issue: Mức độ xác định của mối liên hệ giữa קְדֵשָׁה và hoạt động thờ cúng
  choice: người nữ mại dâm tín ngưỡng
  alternative: gái điếm đền thờ; gái mại dâm
  rationale: Giữ nét liên hệ tín ngưỡng của thuật ngữ và sự phân biệt từ vựng trong nguyên văn, nhưng không khẳng định một cơ cấu đền thờ cụ thể hay một mô hình giáo phái vượt quá điều câu văn cho biết.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dấu hai chấm thay cho việc dịch máy móc לֵאמֹר. Các dấu chú thích được đặt ngay sau đúng thuật ngữ và địa danh mà chúng giải thích.
