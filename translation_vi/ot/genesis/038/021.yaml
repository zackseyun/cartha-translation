revisions:
- from: 'Ông hỏi những người đàn ông ở nơi ấy: “Người nữ mại dâm tín ngưỡng[a] từng ở Ê-na-im[b], bên đường, đâu rồi?” Họ đáp: “Ở đây chưa từng có người nữ mại dâm tín ngưỡng nào.”'
  to: 'Ông hỏi những người đàn ông ở nơi ấy: “Người nữ mại dâm có liên hệ với việc thờ cúng[a] ở Ê-na-im[b], bên đường, ở đâu?” Họ đáp: “Ở đây chưa từng có người nữ mại dâm có liên hệ với việc thờ cúng nào.”'
  rationale: Chỉnh câu hỏi thành “ở đâu?” để không thêm hàm ý thời gian không có trong nguyên văn. Thay thuật ngữ không tự nhiên “mại dâm tín ngưỡng” bằng một diễn đạt mô tả rõ ràng, thận trọng về mặt lịch sử, đồng thời vẫn phân biệt קְדֵשָׁה với từ thông thường chỉ người mại dâm. Giữ nguyên các mỏ neo chú thích sau thuật ngữ và địa danh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:33:21Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc tường thuật, địa danh Ê-na-im, vị trí bên đường và lời phủ nhận của dân địa phương. Tuy nhiên, “đâu rồi?” dễ gợi rằng người phụ nữ đã rời khỏi đó, trong khi câu hỏi tiếng Hê-bơ-rơ chỉ hỏi địa điểm của người nữ được mô tả là ở Ê-na-im, bên đường. Thuật ngữ קְדֵשָׁה nên được diễn đạt thận trọng hơn vì bản chất chính xác của mối liên hệ nghi lễ/tín ngưỡng vẫn là vấn đề được thảo luận.
  naturalness: “Người nữ mại dâm tín ngưỡng” có thể hiểu được nhưng không phải là một cụm từ tự nhiên trong tiếng Việt hiện đại. “Người nữ mại dâm có liên hệ với việc thờ cúng” rõ nghĩa hơn, dù dài hơn; trong văn cảnh này độ rõ và tính thận trọng quan trọng hơn sự cô đọng.
  terminology: Giữ “người nữ mại dâm” để phân biệt với từ thông thường khác chỉ người mại dâm trong chương, đồng thời thêm mô tả “có liên hệ với việc thờ cúng” để phản ánh cách hiểu từ vựng của קְדֵשָׁה mà không khẳng định một định chế đền thờ cụ thể. Chú thích thay “gái điếm đền thờ” bằng “người nữ mại dâm tại đền thờ” như một phương án diễn đạt, và nêu rõ tính không chắc chắn của liên hệ nghi lễ.
  issues:
  - severity: medium
    issue: “đâu rồi?” thêm sắc thái người ấy đã rời đi
    rationale: אַיֵּה là câu hỏi địa điểm; ngữ cảnh không đòi hỏi hàm ý “đã từng ở đây nhưng nay không còn ở đây.” Dịch “ở đâu?” bảo tồn trung tính hơn.
  - severity: medium
    issue: “mại dâm tín ngưỡng” chưa tự nhiên và có thể tạo ấn tượng về một loại hình đã được xác định chắc chắn
    rationale: Cụm này không thông dụng trong tiếng Việt hiện đại. Bản chất lịch sử-chức năng của קְדֵשָׁה không nên bị trình bày như một thực hành được xác định dứt khoát; cách diễn đạt mô tả giữ được sắc thái từ vựng và sự thận trọng.
