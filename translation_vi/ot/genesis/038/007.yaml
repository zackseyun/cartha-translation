source:
  edition: WLC
  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: vi
  text: Ê-rơ, con trưởng của Giu-đa, là kẻ gian ác trước mắt Yahweh, và Yahweh khiến ông chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Yahweh làm cho ông chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: là
  rationale: Trong mạch kể chuyện, động từ היה làm chức năng liên kết với vị ngữ רַע; tiếng Việt diễn đạt tự nhiên bằng “là”, không cần thêm một trạng từ thời gian vốn không có trong nguyên văn.
- source_word: עֵר
  choice: Ê-rơ
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết dễ đọc trong tiếng Việt.
- source_word: בְּכוֹר יְהוּדָה
  choice: con trưởng của Giu-đa
  rationale: Cụm sở thuộc chỉ Ê-rơ là người con sinh đầu của Giu-đa; “con trưởng” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: רַע
  choice: gian ác
  rationale: Từ này trong sự đánh giá của Đức Chúa Trời mang nghĩa đạo đức nghiêm trọng, không chỉ là “xấu” nói chung.
- source_word: בְּעֵינֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ “trong mắt YHWH” theo cách trang trọng, tự nhiên, đồng thời giữ ý rằng đây là sự đánh giá của Ngài.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng giao ước đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: וַיְמִתֵהוּ
  choice: khiến ông phải chết
  rationale: Giữ nghĩa gây khiến của thể Hiphil và quy trực tiếp tác nhân cho YHWH; “phải chết” truyền đạt sắc thái phán xét mà không nói thêm phương cách.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng theo dạng quen thuộc trong tiếng Việt, không thay bằng tước hiệu; tiền tố “Đức” phù hợp văn phong tôn kính.
- issue: Vai trò trực tiếp của Đức Chúa Trời trong cái chết của Ê-rơ
  choice: Đức Giê-hô-va khiến ông phải chết
  alternative: Đức Giê-hô-va giết ông; Đức Giê-hô-va làm cho ông chết
  rationale: Động từ Hiphil của מות nêu rõ tác động gây khiến của YHWH. Cách dịch không làm nhẹ vai trò ấy nhưng cũng không thêm chi tiết về phương tiện hay lý do ngoài nhận định rằng Ê-rơ gian ác.
- issue: Quan hệ giữa sự gian ác và việc chịu chết
  choice: nên
  alternative: và
  rationale: Chuỗi tự sự đặt phán quyết ngay sau sự đánh giá đạo đức, cho thấy hệ quả trong văn cảnh. “Nên” làm rõ quan hệ tự nhiên ấy nhưng không giải thích thêm bản chất tội của Ê-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho Ê-rơ để tránh đại từ thiếu tôn trọng; giữ cấu trúc ngắn gọn của câu kể và không suy đoán bản chất sự gian ác của Ê-rơ.
