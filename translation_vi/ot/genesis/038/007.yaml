  rationale: Bỏ “nên” để giữ liên kết tự sự không đánh dấu của nguyên văn; đổi danh יהוה thành “Yahweh” theo quyết định thuật ngữ POB; và chuyển vị trí neo chú thích đến ngay sau động từ Hiphil được chú giải. Bản sửa không suy đoán về bản chất sự gian ác hay phương cách Ê-rơ chết.
