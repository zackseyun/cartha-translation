  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: vi
  text: Rồi nàng đứng dậy, ra đi, cởi khăn che mặt và mặc y phục góa bụa của mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: nàng đứng dậy
  rationale: Động từ קום ở thể Qal trong chuỗi trần thuật diễn tả hành động kế tiếp; “đứng dậy” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: וַתֵּלֶךְ
  choice: ra đi
  rationale: הלך sau “đứng dậy” hàm ý rời khỏi nơi ấy; “ra đi” diễn đạt rõ sự rời đi mà vẫn giữ sắc thái trần thuật trang trọng.
- source_word: וַתָּסַר ... מֵעָלֶיהָ
  choice: cởi
  rationale: Thể Hiphil của סור cùng מֵעָלֶיהָ diễn tả việc gỡ vật đang ở trên người nàng; với khăn che mặt, “cởi” là cách nói tự nhiên, không cần dịch riêng cụm “khỏi người nàng” vốn dư thừa trong tiếng Việt.
- source_word: צְעִיפָהּ
  choice: khăn che mặt
  rationale: צָעִיף chỉ vật che phủ, trong ngữ cảnh này là chiếc khăn Tamar dùng để che mặt và cải trang; “khăn che mặt” rõ nghĩa hơn “mạng che mặt” đối với độc giả hiện đại.
- source_word: וַתִּלְבַּשׁ
  choice: mặc lại
  rationale: לבש nghĩa là mặc vào. “Lại” được dùng theo ngữ cảnh vì trước đó Tamar đã cởi y phục góa bụa để cải trang, nay nàng mặc trở lại.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: y phục góa bụa của mình
  rationale: Cụm sở hữu chỉ y phục gắn với tình trạng góa bụa của Tamar; cách dịch này giữ sắc thái về thân phận, thay vì chỉ nói chung là quần áo của một góa phụ.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật hiện đại, trang nghiêm và dễ hiểu. Dùng “nàng” để theo mạch nói về Tamar; giữ ý niệm “y phục góa bụa” của nguyên văn nhưng lược bỏ cấu trúc Hebrew dư thừa trong tiếng Việt.
