base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: vi
  text: 'Khi Ta-ma đang sinh con, một đứa bé thò tay ra.[a] Bà đỡ liền nắm lấy tay nó, buộc một sợi chỉ đỏ vào đó và nói: “Đứa này ra trước.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ sát chữ là “đưa ra một bàn tay”, chỉ việc bàn tay của một trong hai đứa trẻ ló ra trong lúc sinh.
    reason: lexical_alternative
  - marker: b
    text: Sợi chỉ đỏ được buộc vào tay để làm dấu nhận biết đứa trẻ nào đã xuất hiện trước.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: Khi Ta-ma đang sinh con
  rationale: Cấu trúc giới từ בְּ với động từ nguyên mẫu và hậu tố ngôi thứ ba giống cái diễn tả hoàn cảnh thời gian đang diễn ra. Nêu tên Ta-ma theo ngữ cảnh giúp câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: וַיִּתֶּן יָד
  choice: một đứa bé thò tay ra
  rationale: Nguyên văn sát chữ là “đưa/cho một bàn tay”, một cách diễn đạt về bàn tay của thai nhi ló ra lúc sinh. “Một đứa bé” giữ được ý chưa xác định đó là người con nào, còn “thò tay ra” tự nhiên trong tiếng Việt.
- source_word: הַמְיַלֶּדֶת
  choice: bà đỡ
  rationale: Danh từ chỉ người phụ nữ trợ giúp việc sinh nở; “bà đỡ” là cách gọi ngắn gọn, thông dụng và phù hợp bối cảnh cổ đại.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: buộc một sợi chỉ đỏ vào đó
  rationale: שָׁנִי chỉ vật liệu có màu đỏ thắm/đỏ điều. Tiếng Việt cần bổ sung danh từ chỉ vật; “sợi chỉ đỏ” phù hợp với chức năng làm dấu trong câu chuyện mà không diễn giải quá mức.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: Đứa này ra trước
  rationale: Cách dịch này giữ đúng lời xác định đứa trẻ được cho là xuất hiện trước; không dùng “con trưởng” vì nguyên văn ở đây nói về thứ tự đi ra, chưa trực tiếp dùng thuật ngữ chỉ địa vị con trưởng.
theological_decisions:
- issue: Quan hệ giữa việc đưa tay ra trước và địa vị con trưởng
  choice: Dịch là “Đứa này ra trước”
  alternative: “Đứa này là con trưởng”
  rationale: Nguyên văn chỉ nói đứa này “đi ra trước”. Bản dịch không đồng nhất hành động thò tay ra với địa vị pháp lý hoặc thần học của con trưởng, nhờ đó giữ nguyên diễn tiến và sự căng thẳng của câu chuyện.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ta-ma” để làm rõ chủ thể nữ theo ngữ cảnh; dùng “một đứa bé” và đại từ “nó” tự nhiên trong lời kể về trẻ đang chào đời, không xác định quá sớm đó là người con nào.
