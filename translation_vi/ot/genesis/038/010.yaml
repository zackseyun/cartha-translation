  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: vi
  text: Điều ông làm là ác trước mắt Yahweh, vì thế Ngài cũng khiến ông chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: là điều ác
  rationale: Động từ רעע ở nghĩa trạng thái đánh giá hành động ấy là xấu xa về mặt đạo đức; “là điều ác” giữ sức nặng này, thay vì làm nhẹ thành “không đẹp lòng”.
- source_word: בְּעֵינֵי יְהוָה
  choice: dưới mắt Đức Yahweh
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về sự đánh giá của Đức Chúa Trời, đồng thời vẫn tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Yahweh
  rationale: Phiên âm danh riêng giao ước thay vì thay bằng một tước hiệu; thêm “Đức” theo cách xưng danh trang trọng trong tiếng Việt.
- source_word: אֲשֶׁר עָשָׂה
  choice: Điều ông làm
  rationale: Mệnh đề quan hệ chỉ hành động của Ô-nan trong câu trước; cách diễn đạt này tự nhiên, không thêm lời giải thích về chính xác hành động ấy.
- source_word: וַיָּמֶת
  choice: khiến ông phải chết
  rationale: Dạng Hiphil của מות mang nghĩa khiến chết; bản dịch giữ quan hệ nhân quả và tác nhân thần linh, nhưng diễn đạt tự nhiên trong tiếng Việt.
- source_word: גַּם אֹתוֹ
  choice: cũng ... ông
  rationale: “Cũng” nối cái chết của Ô-nan với sự phán xét dành cho Ê-rơ trước đó; đại từ “ông” phù hợp văn mạch kể chuyện.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước. Giữ “Yahweh” tránh thay danh riêng bằng tước hiệu và tránh dạng “Giê-hô-va” vốn dựa trên lối đọc lai muộn hơn.
- issue: Tác nhân của sự chết trong וַיָּמֶת
  choice: Ngài cũng khiến ông phải chết
  alternative: ông cũng chết; Ngài cũng giết ông
  rationale: Dạng sai khiến quy cái chết trực tiếp cho Yahweh. “Khiến ông phải chết” bảo toàn nghĩa sai khiến mà không làm câu thô hơn nguyên văn.
- issue: Đối tượng bị đánh giá là ác
  choice: Điều ông làm là điều ác
  alternative: Ông là người ác
  rationale: Mệnh đề אֲשֶׁר עָשָׂה xác định hành động là điều bị đánh giá; không mở rộng lời phán xét thành một mô tả toàn diện về con người Ô-nan.
translation_notes:
  register: Văn phong kể chuyện trang nghiêm, rõ ràng và hiện đại. Dùng “ông” cho Ô-nan và “Ngài” cho Yahweh để phân biệt hai chủ thể. Không giải thích hành động của Ô-nan ngay trong câu, vì câu Hê-bơ-rơ chỉ hồi chỉ đến văn mạch trước.
