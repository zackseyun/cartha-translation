- from: 'Ông hỏi: “Tôi phải đưa vật gì làm tin cho cô?” Nàng đáp: “Con dấu, sợi dây và cây gậy đang ở trong tay ông.” Ông trao những vật ấy cho nàng, rồi ăn nằm với nàng[a], và nàng thụ thai bởi ông.'
  to: 'Ông hỏi: “Tôi phải đưa vật gì làm tin cho cô?” Nàng đáp: “Con dấu, sợi dây và cây gậy đang ở trong tay ông.” Ông trao những vật ấy cho nàng, rồi đến với nàng[a], và nàng đã thụ thai với ông.'
  rationale: Sửa lối nói về quan hệ tình dục thành một uyển ngữ tiếng Việt tương ứng với uyển ngữ Hê-bơ-rơ, và thay cụm “bởi ông” bằng cách diễn đạt tự nhiên hơn. Các từ ngữ chỉ vật làm tin được giữ nguyên vì phản ánh đúng nguyên văn mà không diễn giải quá mức.
