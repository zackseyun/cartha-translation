base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: vi
  text: 'Ông hỏi: “Tôi phải đưa vật gì làm tin cho cô?” Nàng đáp: “Con dấu, sợi dây và cây gậy đang ở trong tay ông.” Ông trao những vật ấy cho nàng, rồi đến với nàng[a], và nàng đã thụ thai với ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ nói theo nghĩa đen là “đi vào với nàng”, một lối nói giảm chỉ việc quan hệ tình dục.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: vật gì làm tin
  rationale: Chỉ vật được giao để bảo đảm lời hứa trả công sau đó; cách nói này tự nhiên trong tiếng Việt và phù hợp bối cảnh.
- source_word: חֹתָמְךָ
  choice: con dấu
  rationale: Chỉ vật dùng để đóng dấu nhận dạng; không thêm ý 'nhẫn' vì nguyên văn không xác định hình dạng.
- source_word: פְתִילֶךָ
  choice: sợi dây
  rationale: Giữ nghĩa trực tiếp của danh từ, có thể là sợi dây gắn với con dấu, nhưng nguyên văn không nói rõ.
- source_word: מַטְּךָ
  choice: cây gậy
  rationale: Chỉ cây gậy cá nhân đang được cầm; đây là cách diễn đạt thông dụng, cụ thể trong tiếng Việt.
- source_word: אֲשֶׁר בְּיָדֶךָ
  choice: đang ở trong tay ông
  rationale: Giữ hình ảnh cụ thể của nguyên văn và để mệnh đề quan hệ bổ nghĩa gần nhất cho cây gậy.
- source_word: וַיִּתֶּן לָּהּ
  choice: Ông trao những vật ấy cho nàng
  rationale: Tiếng Việt cần nêu rõ các vật đã được yêu cầu, dù đại từ tân ngữ không được biểu thị riêng trong dạng động từ Hê-bơ-rơ.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ăn nằm với nàng
  rationale: Truyền đạt đúng lối nói giảm chỉ quan hệ tình dục bằng một thành ngữ tiếng Việt trang trọng, dễ hiểu.
- source_word: וַתַּהַר לוֹ
  choice: nàng thụ thai bởi ông
  rationale: Sát với động từ 'thụ thai' và giữ rõ quan hệ tác nhân được diễn đạt bằng לוֹ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng cặp xưng hô “ông—cô” trong lời thoại và “ông—nàng” trong lời kể để vừa tự nhiên vừa giữ sắc thái tường thuật. Không xác định con dấu là nhẫn và không giải thích sợi dây vượt quá điều nguyên văn cho biết.
