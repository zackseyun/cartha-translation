  yaml_path: translation/ot/genesis/038/017.yaml
  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: vi
  text: 'Ông nói: “Tôi sẽ gửi một con dê con từ đàn.” Nàng đáp: “Nếu ông đưa cho tôi một vật làm tin[a] cho đến khi ông gửi nó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một vật bảo chứng” hoặc “một vật bảo đảm” (עֵרָבוֹן).
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: một con dê con
  rationale: Cụm từ chỉ một con non thuộc loài dê. “Dê con” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מִן הַצֹּאן
  choice: từ trong đàn
  rationale: צֹאן chỉ chung đàn gia súc nhỏ, nhất là chiên và dê. Vì con vật đã được xác định là dê, “từ trong đàn” vừa tự nhiên vừa tránh lặp thừa.
- source_word: עֵרָבוֹן
  choice: một vật làm tin
  rationale: Danh từ này chỉ vật được giao để bảo đảm lời hứa sẽ được thực hiện. “Vật làm tin” phù hợp với bối cảnh trao một đồ vật cụ thể và dễ hiểu đối với độc giả phổ thông.
- source_word: עַד שָׁלְחֶךָ
  choice: cho đến khi ông gửi con dê đến
  rationale: Nguyên văn có nghĩa đen là “cho đến khi ông gửi”; đối tượng được gửi được hiểu từ câu trước. Nêu lại “con dê” giúp câu tiếng Việt rõ ràng mà không thay đổi ý nghĩa.
- source_word: אִם תִּתֵּן
  choice: Nếu ông đưa cho tôi
  rationale: Giữ hình thức điều kiện trong lời đáp của Ta-ma. “Cho tôi” được ngữ cảnh đòi hỏi và là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: Tôi sẽ gửi
  rationale: Đại từ độc lập אָנֹכִי có thể tạo sắc thái nhấn mạnh, nhưng trong ngữ cảnh này “Tôi sẽ gửi” truyền đạt tự nhiên lời hứa ở ngôi thứ nhất mà không cường điệu sắc thái.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông/cô” trong lời Giu-đa và “nàng” ở lời dẫn để phản ánh tình huống đối thoại mà không dùng lối xưng hô cổ. Dấu chú thích [a] được đặt ngay sau thuật ngữ tương ứng, thay vì sau động từ “nói” như trong lớp tham khảo tiếng Anh.
