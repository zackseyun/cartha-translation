  - severity: low
    issue: “đang ở” thêm sắc thái tiếp diễn
    rationale: וְהָיָה là hình thức “he was”; nguyên ngữ không đòi hỏi cách diễn đạt tiếp diễn. “Ông ở Kê-xíp” trung tính và sát hơn.
  - severity: low
