base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: vi
  text: Nàng lại sinh một con trai và đặt tên là Sê-la. Khi nàng sinh nó, ông ở Kê-xíp[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số chứng cứ cổ và cách giải thích hiểu là: “Khi nàng sinh nó, nàng ở Kê-xíp.” Bản Hê-bơ-rơ chép “ông”, nhưng chủ ngữ ở đây vẫn còn được tranh luận.'
    reason: alternative_reading
  - marker: b
    text: Kê-xíp cũng được gọi là Cơ-xíp ở những chỗ khác; cả hai chỉ cùng một địa điểm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: Nàng lại sinh một con trai
  rationale: Cụm יסף + עוד diễn tả một hành động được lặp lại; trong mạch kể này, tiếng Việt tự nhiên có thể diễn đạt gọn là “lại sinh”, không cần thêm ý “thụ thai” vốn không được nói rõ trong câu Hê-bơ-rơ.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: và đặt tên là Sê-la
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại cho thành ngữ Hê-bơ-rơ “gọi tên nó là”, đồng thời giữ tên riêng bằng lối phiên âm dễ đọc.
- source_word: וְהָיָה
  choice: ông đang ở
  rationale: Động từ trong bản Hê-bơ-rơ Masoret ở ngôi thứ ba giống đực số ít, nên bản chính giữ chủ ngữ giống đực; “ông” nhiều khả năng quy chiếu về Giu-đa trong văn cảnh rộng hơn, nhưng câu vẫn có độ mơ hồ.
- source_word: בִכְזִיב
  choice: ở Kê-xíp
  rationale: Giữ đây là địa danh và phiên âm כזיב thành Kê-xíp; giới từ “ở” phù hợp tự nhiên với địa điểm trong tiếng Việt.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: Khi nàng sinh con
  rationale: Giới từ בְּ với động từ nguyên mẫu mang nghĩa thời gian, được chuyển tự nhiên thành “khi”; “con” chỉ chính đứa trẻ vừa được nhắc đến.
theological_decisions:
- issue: Chủ ngữ của וְהָיָה tại Kê-xíp
  choice: 'Giữ cách đọc giống đực: “ông đang ở”'
  alternative: “nàng đang ở”
  rationale: Văn bản Masoret có hình thái giống đực số ít, nhưng một số chứng cứ cổ và cách giải thích hiểu chủ ngữ là người mẹ. Không nên âm thầm giải quyết sự căng thẳng văn bản; bản chính theo hình thái Hê-bơ-rơ và ghi cách hiểu khác trong chú thích.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dùng “nàng” cho người phụ nữ đang được nói đến và “ông” cho chủ ngữ giống đực không được nêu tên. Hai dấu chú thích được đặt ngay sau mệnh đề có địa danh vì cả vấn đề chủ ngữ lẫn dạng tên địa điểm đều liên quan trực tiếp đến mệnh đề này.
