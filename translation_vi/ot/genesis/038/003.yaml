  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ עֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: vi
  text: Nàng mang thai và sinh một con trai; Giu-đa đặt tên con là Ê-rơ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ sát nghĩa là “ông gọi tên nó là Ê-rơ”; động từ ở giống đực số ít, nên chủ ngữ tự nhiên nhất là Giu-đa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: Nàng mang thai
  rationale: Động từ הרה chỉ việc thụ thai hoặc mang thai. “Mang thai” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và phù hợp với trình tự kể chuyện.
- source_word: וַתֵּלֶד בֵּן
  choice: và sinh một con trai
  rationale: ילד ở thể Qal có nghĩa là sinh con; בֵּן là con trai. Cách diễn đạt này gọn, tự nhiên và giữ rõ quan hệ gia đình.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: Giu-đa đặt tên con là
  rationale: Động từ ở giống đực số ít, khác với hai động từ giống cái đi trước. Nêu lại “Giu-đa” làm chủ ngữ giúp tiếng Việt tự nhiên đồng thời bảo toàn sự chuyển đổi chủ ngữ trong tiếng Hê-bơ-rơ.
- source_word: עֵר
  choice: Ê-rơ
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết dễ đọc và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Chủ ngữ của וַיִּקְרָא (“đặt tên”)
  choice: 'Hiểu chủ ngữ là Giu-đa và dịch rõ: “Giu-đa đặt tên con là Ê-rơ.”'
  alternative: Một số bản dịch đổi thành người mẹ đặt tên, hoặc dùng lối bị động để không nêu chủ thể.
  rationale: Hình thái động từ Hê-bơ-rơ là giống đực số ít, trong khi các động từ “mang thai” và “sinh” trước đó là giống cái số ít. Giu-đa là tiền tố nam gần nhất và là chủ ngữ tự nhiên nhất theo ngữ cảnh; bản dịch không hòa đồng sự chuyển đổi ngữ pháp này.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nàng” để nối tự nhiên với người vợ của Giu-đa trong ngữ cảnh; nêu rõ “Giu-đa” nhằm tránh đại từ mơ hồ trong tiếng Việt.
