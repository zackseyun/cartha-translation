  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ לְ/אוֹנָ֔ן בֹּ֛א אֶל אֵ֥שֶׁת אָחִ֖י/ךָ וְ/יַבֵּ֣ם אֹתָ֑/הּ וְ/הָקֵ֥ם זֶ֖רַע לְ/אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: vi
  text: 'Bấy giờ Giu-đa nói với Ô-nan: “Hãy đến với vợ anh con, làm tròn bổn phận của người em chồng đối với chị ấy[a], và sinh con nối dõi cho anh con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, theo cách nói chuyên biệt: “thực hiện nghĩa vụ nối dõi của người em chồng đối với chị ấy.”'
    reason: Nêu cách dịch mang tính thuật ngữ hơn cho động từ יִבֵּם.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt trình tự tự nhiên trong tiếng Việt.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Dạng phiên âm quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: בֹּא אֶל
  choice: Hãy đến với
  rationale: Giữ lối nói uyển chuyển của tiếng Hê-bơ-rơ về quan hệ vợ chồng mà không diễn giải thô hoặc quá mức; văn cảnh và mệnh lệnh kế tiếp làm rõ ý nghĩa.
- source_word: אֵשֶׁת אָחִיךָ
  choice: vợ anh con
  rationale: Cách nói tự nhiên trong tiếng Việt; văn cảnh xác định người anh đã qua đời, còn Giu-đa đang nói với Ô-nan trong tư cách người cha.
- source_word: וְיַבֵּם אֹתָהּ
  choice: làm tròn bổn phận của người em chồng đối với chị ấy
  rationale: Động từ kỹ thuật này chỉ nghĩa vụ của người em trai đối với vợ góa của anh mình. Cách dịch vừa dễ hiểu vừa giữ nội dung pháp lý-gia tộc, không thu hẹp thành riêng việc kết hôn hay quan hệ tình dục.
- source_word: וְהָקֵם
  choice: gây dựng
  rationale: Trong kết hợp với זֶרַע, động từ mang nghĩa làm cho dòng dõi của người anh đã chết được tiếp nối; “gây dựng” giữ được sắc thái chủ động của nguyên văn.
- source_word: זֶרַע
  choice: dòng dõi
  rationale: Trong văn cảnh này, từ chỉ con cái sẽ tiếp nối gia hệ của người đã chết; “dòng dõi” tự nhiên hơn “hạt giống” và phù hợp với ý nghĩa gia tộc.
- source_word: לְאָחִיךָ
  choice: cho anh con
  rationale: Giới từ לְ biểu thị người được hưởng lợi hoặc người mà đứa con sẽ được kể thuộc về; “cho anh con” ngắn gọn và trung thành.
theological_decisions:
- issue: Cách diễn đạt nghĩa vụ hôn nhân nối dõi mà không du nhập các quy định pháp lý hoặc giáo lý về sau
  choice: làm tròn bổn phận của người em chồng đối với chị ấy
  alternative: thực hiện nghĩa vụ nối dõi của người em chồng đối với chị ấy
  rationale: Nguyên văn dùng động từ chuyên biệt יִבֵּם, bao hàm nghĩa vụ gia tộc nhằm có con nối dõi cho người anh đã chết. Bản dịch chính giữ cả yếu tố quan hệ thân tộc lẫn nghĩa vụ, đồng thời không đồng nhất thuật ngữ chỉ với việc cưới hỏi hay giao hợp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hãy đến với” giữ lối nói uyển chuyển của nguyên văn; “làm tròn bổn phận” và “gây dựng dòng dõi” truyền đạt rõ nghĩa vụ gia tộc mà không dùng thuật ngữ học thuật khó hiểu.
