revisions:
- from: 'Bấy giờ Giu-đa nói với Ô-nan: “Hãy đến với vợ anh con, làm tròn bổn phận của người em chồng đối với chị ấy[a], và gây dựng dòng dõi cho anh con.”'
  to: 'Bấy giờ Giu-đa nói với Ô-nan: “Hãy đến với vợ anh con, làm tròn bổn phận của người em chồng đối với chị ấy[a], và sinh con nối dõi cho anh con.”'
  rationale: Giữ nguyên uyển ngữ “đến với”, quan hệ “vợ anh con”, và cách diễn đạt nghĩa vụ gia tộc. Thay “gây dựng dòng dõi” bằng “sinh con nối dõi” để câu tiếng Việt tự nhiên hơn và để diễn đạt rõ ý “làm cho có dòng dõi/offspring” cho người anh trong nguyên văn.
  reviewer_model: gpt-5.6-terra
