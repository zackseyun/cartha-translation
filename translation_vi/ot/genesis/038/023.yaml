  terminology: “Giu-đa” là dạng tên Kinh Thánh Việt ngữ thông dụng. “Con dê con” là cách gọi rõ ràng cho גְּדִי. “Trò cười” là lựa chọn tự nhiên cho ý bị khinh miệt/chế giễu, và chú thích nêu đầy đủ các khả năng nghĩa gần.
