  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của tiếng Hê-bơ-rơ: lời nhượng bộ để người phụ nữ giữ các vật làm tin được hàm ý; nỗi lo "kẻo chúng ta trở thành trò cười" diễn đạt tốt לָבוּז; הִנֵּה được giữ bằng “Này”; dê non, từ chỉ định, và sự tương phản trong mệnh đề cuối đều được truyền đạt. “Những thứ đó” làm rõ hợp lý các vật làm tin số nhiều theo văn mạch mà không thêm ý nghĩa mới.'
