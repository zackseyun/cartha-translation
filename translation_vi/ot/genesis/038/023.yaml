base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: vi
  text: 'Giu-đa nói: “Cứ để cô ấy giữ những thứ đó, kẻo chúng ta trở thành trò cười[a]. Này, tôi đã gửi con dê con này, nhưng anh không tìm thấy cô ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kẻo chúng ta bị nhục” hoặc “kẻo chúng ta bị chế giễu.” Cách nói Hê-bơ-rơ chỉ việc trở thành đối tượng bị khinh miệt hoặc chế nhạo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: Cứ để cô ấy giữ những thứ đó
  rationale: 'Dạng động từ giống cái số ít trong ngữ cảnh mang sắc thái cho phép/nhượng bộ: Giu-đa chấp nhận để người phụ nữ giữ các vật làm tin. Tân ngữ không được nói rõ trong câu Hê-bơ-rơ nhưng chỉ các vật làm tin đã nêu trước đó; “những thứ đó” diễn đạt tự nhiên và giữ ý số nhiều theo ngữ cảnh.'
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: kẻo chúng ta trở thành trò cười
  rationale: בּוּז diễn tả sự khinh miệt, chế giễu hoặc nhục nhã. “Trở thành trò cười” truyền đạt rõ nỗi lo bị người khác chế nhạo trong bối cảnh xã hội của câu chuyện, đồng thời chú thích bảo lưu các sắc thái khác.
- source_word: הִנֵּה
  choice: Này
  rationale: Tiểu từ này thu hút sự chú ý vào lời theo sau. “Này” tự nhiên trong lời nói hiện đại và không mang sắc thái cổ.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: tôi đã gửi con dê con này
  rationale: גְּדִי là dê non; “dê con” rõ nghĩa trong tiếng Việt. Từ chỉ định הַזֶּה được giữ bằng “này”.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: nhưng anh không tìm thấy cô ấy
  rationale: Liên từ וְ ở đây biểu thị sự tương phản giữa việc Giu-đa đã gửi dê và việc người bạn không tìm được người phụ nữ, nên dịch là “nhưng”. Hậu tố giống cái chỉ người phụ nữ.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Đại từ “tôi—anh” phù hợp lời Giu-đa nói với người bạn; “cô ấy” chỉ người phụ nữ mà họ đang tìm kiếm.
