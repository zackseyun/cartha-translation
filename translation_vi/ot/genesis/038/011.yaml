  to: 'Bấy giờ, Giu-đa nói với Ta-ma, con dâu mình: “Con hãy ở góa tại nhà cha con cho đến khi Sê-la, con trai ta, trưởng thành.” Vì ông nghĩ[a]: “E rằng nó cũng chết như các anh nó.” Vậy Ta-ma đi đến ở tại nhà cha mình.'
