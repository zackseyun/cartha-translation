  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/תָמָ֨ר כַּלָּת֜/וֹ שְׁבִ֧י אַלְמָנָ֣ה בֵית אָבִ֗י/ךְ עַד יִגְדַּל֙ שֵׁלָ֣ה בְנִ֔/י כִּ֣י אָמַ֔ר פֶּן יָמ֥וּת גַּם ה֖וּא כְּ/אֶחָ֑י/ו וַ/תֵּ֣לֶךְ תָּמָ֔ר וַ/תֵּ֖שֶׁב בֵּ֥ית אָבִֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: vi
  text: 'Bấy giờ, Giu-đa nói với Ta-ma, con dâu mình: “Con hãy ở góa tại nhà cha con cho đến khi Sê-la, con trai ta, trưởng thành.” Vì ông nghĩ[a]: “E rằng nó cũng chết như các anh nó.” Vậy Ta-ma đi đến ở tại nhà cha mình.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ông nói”; trong tiếng Hê-bơ-rơ, “nói” cũng có thể dẫn vào lời suy nghĩ trong lòng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: hãy ở góa
  rationale: Mệnh lệnh của ישׁב kết hợp với danh từ אַלְמָנָה chỉ việc tiếp tục sống trong thân phận góa bụa; “ở góa” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: בֵית אָבִיךְ
  choice: tại nhà cha con
  rationale: Diễn đạt nơi cư trú trong gia đình bên cha, đồng thời giữ cách xưng hô phù hợp giữa cha chồng và con dâu.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: cho đến khi Sê-la, con trai ta, trưởng thành
  rationale: יגדל ở đây nói đến việc đạt độ tuổi thích hợp; “trưởng thành” rõ ràng mà không thêm chi tiết về hôn nhân vốn không được nói trực tiếp.
- source_word: כִּי אָמַר
  choice: Vì ông nghĩ
  rationale: Động từ “nói” trong tiếng Hê-bơ-rơ có thể dẫn vào lời nói nội tâm. Ngữ cảnh cho thấy đây là suy nghĩ không nói ra của Giu-đa; chú thích bảo lưu cách dịch sát chữ.
- source_word: פֶּן
  choice: E rằng
  rationale: Diễn đạt nỗi lo về một kết quả có thể xảy ra, tự nhiên và trang trọng trong tiếng Việt.
- source_word: כְּאֶחָיו
  choice: như các anh nó
  rationale: Er và Ô-nan là các anh của Sê-la; cách dịch thể hiện đúng quan hệ từ góc nhìn của Sê-la.
- source_word: וַתֵּלֶךְ ... וַתֵּשֶׁב
  choice: trở về sống
  rationale: Hai động từ lần lượt chỉ việc đi và cư trú. “Trở về sống” diễn đạt tự nhiên hướng đi được ngữ cảnh xác định mà không làm mất ý định cư.
- source_word: כַּלָּתוֹ
  choice: con dâu mình
  rationale: Thuật ngữ thân tộc có nghĩa rõ là con dâu; “mình” quy chiếu tự nhiên về Giu-đa trong câu kể.
- source_word: בֵּית אָבִיהָ
  choice: tại nhà cha mình
  rationale: Giữ sự tương ứng với cụm từ trước và diễn đạt nơi Ta-ma về cư trú.
theological_decisions:
- issue: Lý do Giu-đa trì hoãn việc gả Ta-ma cho Sê-la
  choice: Giữ nguyên lời lo sợ rằng Sê-la có thể chết, không nêu nguyên nhân hay phán xét Ta-ma
  alternative: Giải thích rằng Giu-đa cho Ta-ma là nguyên nhân khiến các con trai mình chết
  rationale: Bản Hê-bơ-rơ chỉ ghi nỗi lo của Giu-đa; việc quy kết nguyên nhân cho Ta-ma là suy luận vượt quá câu văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “con/ta” phản ánh quan hệ cha chồng–con dâu; “ông/nó” trong lời kể và độc thoại giúp các đối tượng quy chiếu rõ ràng. Tên riêng được phiên âm theo lối Việt hóa thông dụng.
