  text: וַ/יַּכֵּ֣ר יְהוּדָ֗ה וַ/יֹּ֨אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔/נִּי כִּֽי עַל כֵּ֥ן לֹא נְתַתִּ֖י/הָ לְ/שֵׁלָ֣ה בְנִ֑/י וְ/לֹֽא יָסַ֥ף ע֖וֹד לְ/דַעְתָּֽ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: vi
  text: 'Giu-đa nhận ra những vật ấy và nói: “Nàng công chính hơn tôi,[a] vì tôi đã không gả nàng cho Sê-la, con trai tôi.” Ông không còn ăn nằm với nàng nữa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nàng có lý hơn tôi.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “biết nàng,” một cách nói giảm chỉ quan hệ tình dục.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: nhận ra những vật ấy
  rationale: Động từ נכר chỉ việc Giu-đa nhận ra các vật làm tin được đưa ra ở câu 25; thêm tân ngữ theo văn cảnh để câu tiếng Việt rõ và tự nhiên.
- source_word: צָדְקָה מִמֶּנִּי
  choice: Nàng có lẽ phải hơn tôi
  rationale: Cách nói này giữ sắc thái so sánh của מִן và sức nặng đạo đức của צדק, đồng thời giới hạn nhận định vào sự việc đang xét chứ không tuyên bố Ta-ma hoàn toàn vô tội.
- source_word: כִּי עַל כֵּן
  choice: vì
  rationale: Cụm từ nêu lý do cho lời thừa nhận của Giu-đa; “vì” truyền đạt quan hệ nhân quả tự nhiên trong tiếng Việt.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: tôi đã không gả nàng cho Sê-la, con trai tôi
  rationale: Nguyên văn là “không trao nàng cho Sê-la”; trong văn cảnh, việc trao làm vợ được hàm ý. “Gả” diễn đạt ý này rõ ràng, tự nhiên trong tiếng Việt.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: Sau đó, ông không ăn nằm với nàng nữa
  rationale: ידע là lối nói giảm chỉ quan hệ tình dục; “ăn nằm với” là cách nói tiếng Việt trang trọng vừa phải, dễ hiểu, còn “nữa” thể hiện יָסַף עוֹד là không tái diễn.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: שֵׁלָה
  choice: Sê-la
  rationale: Phiên âm tên riêng theo cách dùng tiếng Việt dễ đọc.
theological_decisions:
- issue: Đánh giá đạo đức trong lời thú nhận của Giu-đa
  choice: “Nàng có lẽ phải hơn tôi” trình bày Ta-ma là người có lẽ phải hơn Giu-đa trong sự việc này.
  alternative: “Nàng công chính hơn tôi” hoặc “Nàng đúng, còn tôi sai.”
  rationale: Lối dịch giữ tính so sánh và lực đạo đức của צָדְקָה מִמֶּנִּי mà không biến lời nhận lỗi theo tình huống thành tuyên bố về sự vô tội tuyệt đối của Ta-ma; đồng thời tránh tuyệt đối hóa thành hai phán quyết đối lập hoàn toàn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Có lẽ phải hơn” là cách nói tiếng Việt tự nhiên để diễn đạt người có lý và hành xử đúng hơn trong vụ việc; “ăn nằm với” chuyển tải uyển ngữ Hê-bơ-rơ mà không thô tục. Các dấu chú thích [a], [b] đều có trong chính văn.
