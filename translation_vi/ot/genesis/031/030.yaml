    rationale: Cụm này hàm ý Gia-cốp quyết tâm ra đi. Nguyên văn הָלֹךְ הָלַכְתָּ chỉ nhấn mạnh động tác “đã đi/ra đi hẳn,” không xác định động cơ quyết chí.
  - severity: low
    issue: Thêm “Nhưng” trước câu hỏi
    rationale: Nguyên văn chuyển thẳng từ mệnh đề nguyên nhân sang câu chất vấn. “Nhưng” có thể gợi một tương phản diễn giải; không cần thiết trong bản dịch tối ưu tương đương.
  - severity: low
    issue: Cách diễn đạt chú thích “các thần trong nhà”
    rationale: Cách này có thể gợi vị trí các thần ở trong nhà, thay vì nghĩa chuyên biệt “thần hộ gia đình/tượng thần gia đình” mà ngữ cảnh có thể chỉ đến.
