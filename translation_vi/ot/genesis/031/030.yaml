base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: vi
  text: Bây giờ, con đã đi hẳn vì con quá tha thiết mong nhớ nhà cha mình. Tại sao con lại lấy trộm các thần của ta?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các thần hộ gia đình của ta.” Tiếng Hê-bơ-rơ ở đây chỉ nói “các thần của ta”; theo ngữ cảnh, có lẽ câu này nói đến những tượng thần gia đình của La-ban.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Dùng như dấu hiệu chuyển ý trong lời chất vấn; tiếng Việt không cần thêm liên từ để diễn đạt tự nhiên.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: con nhất quyết ra đi
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động ra đi; trong mạch lời, sắc thái quyết chí phù hợp và tự nhiên.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do La-ban thừa nhận cho việc Gia-cốp ra đi.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: quá mong nhớ
  rationale: Cấu trúc nhấn mạnh diễn tả nỗi khát khao mãnh liệt; “quá mong nhớ” truyền đạt cường độ bằng tiếng Việt tự nhiên.
- source_word: לְבֵית אָבִיךָ
  choice: nhà cha mình
  rationale: Giữ hình ảnh “nhà của cha,” bao hàm gia đình và mái nhà bên cha, thay vì thu hẹp thành quê hương.
- source_word: לָמָּה
  choice: tại sao
  rationale: Cách hỏi nguyên nhân trực tiếp, tự nhiên trong tiếng Việt hiện đại.
- source_word: גָנַבְתָּ
  choice: lấy trộm
  rationale: Diễn đạt trực tiếp hành vi trộm lấy trong lời cáo buộc.
- source_word: אֶת אֱלֹהָי
  choice: các thần của ta
  rationale: Giữ đúng danh từ số nhiều kèm hậu tố ngôi thứ nhất của tiếng Hê-bơ-rơ, không đưa cách giải thích theo ngữ cảnh vào chính văn.
theological_decisions:
- issue: Cách dịch אֱלֹהָי trong lời La-ban
  choice: các thần của ta
  alternative: các thần trong nhà của ta
  rationale: Nguyên văn chỉ nói “các thần của ta.” Ngữ cảnh cho thấy đây là những tượng thần gia đình, nhưng chi tiết ấy được nêu trong chú thích thay vì thêm vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải. Đại từ “con/ta” phản ánh quan hệ cha vợ với con rể và giọng La-ban đang chất vấn Gia-cốp. “Nhưng” làm rõ sự chuyển từ việc thừa nhận lý do ra đi sang lời cáo buộc, dù không biểu thị một từ riêng biệt trong nguyên văn.
