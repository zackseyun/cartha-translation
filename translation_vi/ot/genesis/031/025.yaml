base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: vi
  text: La-ban đuổi kịp Gia-cốp.[a] Gia-cốp đã dựng lều trong miền núi, còn La-ban cùng bà con mình[b] đóng trại tại miền núi Ga-la-át.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo kịp Gia-cốp.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: “anh em mình”; ở đây có lẽ chỉ bà con hoặc những người cùng thị tộc với La-ban.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “trên núi Ga-la-át” hoặc “trong các núi của Ga-la-át.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: đuổi kịp
  rationale: Động từ נשׂג trong bối cảnh truy đuổi có nghĩa là bắt kịp hoặc theo kịp; “đuổi kịp” diễn đạt tự nhiên cả hành động truy đuổi lẫn việc La-ban đã đến chỗ Gia-cốp, nhưng không hàm ý bắt giữ.
- source_word: תָּקַע ... אָהֳלוֹ
  choice: đã dựng lều
  rationale: תקע đi với אהל là thành ngữ chỉ việc dựng lều. Từ “đã” cho thấy Gia-cốp đã dựng lều trước khi La-ban đuổi kịp.
- source_word: בָּהָר
  choice: trong miền núi
  rationale: הַר có thể chỉ một ngọn núi hoặc một vùng đồi núi. Trong mạch văn địa lý này, “miền núi” là cách diễn đạt tự nhiên mà vẫn giữ khả năng hiểu đây là vùng cao.
- source_word: תָּקַע אֶת אֶחָיו
  choice: cùng bà con mình đóng trại
  rationale: 'Cụm Hê-bơ-rơ có tính tỉnh lược: La-ban dựng trại với những người đi cùng. “Đóng trại” bổ sung ý từ vế song song mà không khẳng định số lều; “cùng” phản ánh vai trò của nhóm người đi với ông.'
- source_word: אֶחָיו
  choice: bà con mình
  rationale: Nghĩa đen là “anh em của ông,” nhưng אָח có thể chỉ người cùng họ hàng hoặc cùng thị tộc. Trong bối cảnh đoàn người của La-ban, “bà con” phù hợp hơn “anh em” theo nghĩa ruột thịt.
- source_word: בְּהַר הַגִּלְעָד
  choice: tại miền núi Ga-la-át
  rationale: Cụm từ có thể được hiểu là trên núi Ga-la-át hoặc trong vùng núi Ga-la-át. “Miền núi Ga-la-át” phù hợp với bối cảnh một vùng cao nguyên và vẫn để chú thích bảo tồn cách hiểu khác.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đuổi kịp” để giữ sắc thái truy đuổi; dùng “đóng trại” trong vế La-ban vì nguyên văn tỉnh lược, tránh thêm rõ ràng “các lều”. Các dấu chú thích đều xuất hiện trong câu chính.
