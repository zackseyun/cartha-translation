  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Gia-cốp: “Hãy trở về xứ của tổ tiên con và về với thân tộc con[a]. Ta sẽ ở cùng con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi con sinh ra” hoặc “xứ sở xuất thân của con.” Từ Hê-bơ-rơ có thể chỉ thân tộc hoặc nơi xuất thân, tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng waw liên tiếp đẩy câu chuyện tiến tới. “Bấy giờ” thể hiện trình tự tự nhiên; “phán” phù hợp khi Đức Chúa Trời trực tiếp nói mà vẫn là tiếng Việt hiện đại, trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng phiên âm Yahweh, thay vì thay bằng một tước hiệu.
- source_word: שׁוּב
  choice: Hãy trở về
  rationale: Mệnh lệnh của שׁוב mang nghĩa quay lại nơi đã rời đi; “hãy trở về” vừa chính xác vừa tự nhiên.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: quê hương của tổ tiên con
  rationale: אֶרֶץ ở đây là đất/xứ gắn với các bậc cha ông. “Quê hương của tổ tiên con” tự nhiên hơn “đất của các cha con” trong tiếng Việt và truyền đạt chiều kích địa lý lẫn gia tộc.
- source_word: מוֹלַדְתֶּךָ
  choice: nơi chôn nhau cắt rốn của con
  rationale: מוֹלֶדֶת có thể chỉ nơi sinh quán hoặc thân tộc. Trong cấu trúc song song với “quê hương của tổ tiên,” cách dịch này giữ nghĩa nơi xuất thân một cách tự nhiên, đồng thời chú thích nghĩa thân tộc có thể có.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: Ta sẽ ở cùng con
  rationale: Diễn đạt trực tiếp lời hứa về sự hiện diện của Đức Chúa Trời. Đại từ “Ta–con” phù hợp quan hệ và giọng phán trong ngữ cảnh.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH; giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Quan hệ giữa mệnh lệnh trở về và lời hứa hiện diện
  choice: 'Giữ hai vế nối bằng một câu riêng trong lời nói: “Hãy... Ta sẽ...”'
  alternative: 'Diễn giải thành điều kiện: “Nếu con trở về, Ta sẽ...”'
  rationale: Nguyên văn dùng mệnh lệnh rồi đến lời hứa nối bằng וְ, không minh nhiên đặt thành mệnh đề điều kiện; vì vậy không thêm ý “nếu”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nơi chôn nhau cắt rốn” là thành ngữ Việt tự nhiên chỉ nơi sinh quán; chú thích bảo tồn nghĩa thân tộc khả hữu của מוֹלֶדֶת.
