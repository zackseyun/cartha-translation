base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: vi
  text: Ông trốn đi cùng tất cả những gì thuộc về mình. Ông đứng dậy, vượt qua con sông[a] và hướng mặt về phía miền đồi núi Ga-la-át.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vượt qua sông Ơ-phơ-rát.” Tiếng Hê-bơ-rơ chỉ nói “con sông,” rất có thể ám chỉ sông Ơ-phơ-rát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: trốn đi
  rationale: Động từ ברח diễn tả việc bỏ trốn; “trốn đi” tự nhiên trong tiếng Việt và giữ sắc thái rời đi kín đáo dưới áp lực.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: cùng tất cả những gì thuộc về mình
  rationale: Cách diễn đạt này đủ rộng để bao gồm người trong gia đình, tôi tớ, gia súc và tài sản, không thu hẹp đối tượng chỉ còn đồ vật.
- source_word: וַיָּקָם
  choice: ông lên đường
  rationale: Trong mạch kể, קום đánh dấu việc bắt đầu hành động tiếp theo; “lên đường” truyền đạt tự nhiên ý khởi hành, thay vì dịch máy móc là “đứng dậy”.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: vượt qua Sông Cả
  rationale: עבר có nghĩa là vượt hoặc đi qua. Danh từ có mạo từ chỉ con sông đã được xác định trong ngữ cảnh, rất có thể là sông Ơ-phơ-rát; “Sông Cả” giữ cách gọi quy ước mà chưa đưa tên riêng vào chính văn.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: hướng về
  rationale: Thành ngữ nguyên văn là “đặt mặt mình”; “hướng về” truyền đạt rõ sự định hướng có chủ ý bằng tiếng Việt tự nhiên.
- source_word: הַר הַגִּלְעָד
  choice: miền đồi núi Ga-la-át
  rationale: הַר ở đây có thể chỉ vùng núi hoặc miền đồi núi, không nhất thiết một đỉnh núi riêng lẻ; lựa chọn này phù hợp với địa lý và giữ đúng độ rộng nghĩa.
