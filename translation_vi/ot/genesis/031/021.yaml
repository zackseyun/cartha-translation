  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng “ông” để chỉ Gia-cốp theo ngữ cảnh; giữ tên địa danh Ga-la-át theo dạng quen dùng. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
