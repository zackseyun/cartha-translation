  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ן רֹאֶ֤ה אָנֹכִי֙ אֶת פְּנֵ֣י אֲבִי/כֶ֔ן כִּֽי אֵינֶ֥/נּוּ אֵלַ֖/י כִּ/תְמֹ֣ל שִׁלְשֹׁ֑ם וֵֽ/אלֹהֵ֣י אָבִ֔/י הָיָ֖ה עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: vi
  text: 'Ông nói với họ: “Tôi thấy nét mặt cha các em không còn như trước đối với tôi[a], nhưng Đức Chúa Trời của cha tôi vẫn ở cùng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “như hôm qua và hôm kia,” một thành ngữ Hê-bơ-rơ có nghĩa là “như trước.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: Ông nói với họ
  rationale: Dịch tự nhiên lối kể chuyện bằng wayyiqtol; “họ” chỉ Ra-chên và Lê-a trong ngữ cảnh, không cần thêm tên vào câu.
- source_word: רֹאֶה אָנֹכִי
  choice: Tôi thấy
  rationale: Phân từ đi với đại từ độc lập diễn tả nhận thức hiện tại của Gia-cốp; thì hiện tại tiếng Việt là tương đương tự nhiên.
- source_word: אֶת פְּנֵי אֲבִיכֶן
  choice: nét mặt cha các em
  rationale: פָּנִים vừa là “mặt” vừa biểu lộ thái độ. “Nét mặt” giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: כִּי אֵינֶנּוּ אֵלַי
  choice: đối với tôi không còn
  rationale: Cụm từ mô tả nét mặt của La-ban không còn hướng về Gia-cốp như trước, hàm ý thái độ đã thay đổi; “đối với tôi” giữ được quan hệ hướng đến mà không giải thích quá mức.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: như trước nữa
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ thời gian trước đây. Bản dịch chính truyền đạt ý nghĩa tự nhiên; nghĩa sát chữ được nêu trong chú thích.
- source_word: וֵאלֹהֵי אָבִי
  choice: nhưng Đức Chúa Trời của cha tôi
  rationale: Liên từ ו được hiểu theo sắc thái tương phản giữa thái độ thay đổi của La-ban và sự hiện diện bền vững của Đức Chúa Trời. Cấu trúc “Đức Chúa Trời của cha tôi” bám sát cụm danh từ Hê-bơ-rơ.
- source_word: הָיָה עִמָּדִי
  choice: vẫn ở cùng tôi
  rationale: Dạng hoàn thành tổng kết sự hiện diện và nâng đỡ kéo dài đến hiện tại; “vẫn” diễn đạt sự tiếp diễn và làm rõ thế tương phản trong câu.
theological_decisions:
- issue: Cách dịch אֱלֹהֵי אָבִי
  choice: Đức Chúa Trời của cha tôi
  alternative: Đức Chúa Trời mà cha tôi thờ
  rationale: Cách chọn giữ sát cấu trúc sở thuộc và sắc thái giao ước gia tộc của nguyên văn, không thêm ý giải thích về hành vi thờ phượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các em” phù hợp lời Gia-cốp nói với hai người vợ và phân biệt rõ “cha các em” với “cha tôi”; “nét mặt” bảo tồn hình ảnh Hê-bơ-rơ mà không gây tối nghĩa.
