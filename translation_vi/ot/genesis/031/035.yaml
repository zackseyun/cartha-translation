  text: וַ/תֹּ֣אמֶר אֶל אָבִ֗י/הָ אַל יִ֨חַר֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י כִּ֣י ל֤וֹא אוּכַל֙ לָ/ק֣וּם מִ/פָּנֶ֔י/ךָ כִּי דֶ֥רֶךְ נָשִׁ֖ים לִ֑/י וַ/יְחַפֵּ֕שׂ וְ/לֹ֥א מָצָ֖א אֶת הַ/תְּרָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: vi
  text: 'Nàng thưa với cha: “Xin cha đừng giận con vì con không thể đứng dậy trước mặt cha, bởi con đang đến kỳ kinh nguyệt[a].” Ông lục soát nhưng không tìm thấy các tượng thần trong nhà[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng lối nói giảm, nói tránh chỉ việc đang có kinh nguyệt.
    reason: clarification
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: tê-ra-phim, tức những hình tượng được dùng trong tín ngưỡng gia đình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר בְּעֵינֵי אֲדֹנִי
  choice: Xin cha đừng giận
  rationale: Đây là một thành ngữ diễn tả sự tức giận hoặc không hài lòng. Cách dịch này tự nhiên trong tiếng Việt, đồng thời lời xưng hô “cha–con” truyền đạt sự kính trọng của Ra-chên đối với cha mình; אֲדֹנִי ở đây là lối thưa gửi tôn kính, không phải danh xưng dành cho Đức Chúa Trời.
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: con không thể đứng dậy trước mặt cha
  rationale: Giữ nghĩa thể chất của קום và sắc thái ở trước mặt người bề trên của מִפָּנֶיךָ, bằng lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: con đang đến kỳ của phụ nữ
  rationale: Giữ lối nói giảm, nói tránh của tiếng Hê-bơ-rơ về kinh nguyệt, nhưng vẫn đủ rõ đối với độc giả hiện đại.
- source_word: וַיְחַפֵּשׂ
  choice: Ông lục soát
  rationale: Động từ chỉ việc tìm kiếm kỹ; chủ thể được nêu rõ là người cha trong ngữ cảnh, tức La-ban.
- source_word: הַתְּרָפִים
  choice: các tượng thần gia đình
  rationale: תְּרָפִים chỉ những hình tượng thờ cúng trong phạm vi gia đình. Cách dịch này truyền đạt cả tính chất tôn giáo lẫn bối cảnh gia đình, thay vì dùng một từ phiên âm khó hiểu.
theological_decisions:
- issue: Cách dịch תְּרָפִים
  choice: các tượng thần gia đình
  alternative: các thần gia đình; các tê-ra-phim
  rationale: Bản dịch gọi rõ đây là các hình tượng thờ cúng trong gia đình nhưng không suy đoán thêm về kích thước, công dụng bói toán hay địa vị pháp lý của chúng.
- issue: Lối nói về kinh nguyệt
  choice: đến kỳ của phụ nữ
  alternative: đang có kinh; theo lệ thường của phụ nữ
  rationale: Cách dịch giữ sắc thái kín đáo của nguyên văn mà không che khuất ý nghĩa sinh lý trong ngữ cảnh.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “nàng” theo mạch kể và cặp xưng hô “cha–con” tạo lời thoại tự nhiên trong tiếng Việt, đồng thời giữ sự kính trọng của Ra-chên. Hai lối nói khó trong nguyên văn được dịch dễ hiểu nhưng không diễn giải quá mức.
