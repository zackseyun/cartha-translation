  revision_rationale: Sửa hai cụm từ để tiếng Việt hiện đại tự nhiên và chính xác hơn, không thay đổi nội dung hay thêm diễn giải. “Xin cha đừng giận con” diễn đạt thành ngữ xin đừng nổi giận; “đến kỳ kinh nguyệt” thay cho cách nói gượng; và “tượng thần trong nhà” làm rõ tự nhiên phạm vi hộ gia đình của תְּרָפִים. Các neo chú thích được giữ ngay sau hai thuật ngữ cần giải thích.
