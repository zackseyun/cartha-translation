- from: Ra-chên đã lấy các tượng thần trong nhà[a], đặt chúng vào tấm đệm yên lạc đà[b], rồi ngồi lên trên. La-ban sờ tìm khắp lều nhưng không thấy chúng.
  to: Ra-chên đã lấy các tượng thần trong nhà[a], đặt chúng trong đệm yên của lạc đà[b], rồi ngồi lên chúng. La-ban sờ tìm khắp lều nhưng không tìm thấy chúng.
  rationale: Bản sửa làm rõ rằng Ra-chên ngồi trực tiếp lên các tượng thần, thay “không thấy” bằng “không tìm thấy” để phản ánh động từ nguyên ngữ, và làm mượt cách nói về phần đệm của yên lạc đà. Các chú thích từ vựng được giữ nguyên vì phản ánh thích đáng sự không chắc chắn về תְּרָפִים và כַּר.
  reviewer_model: gpt-5.6-terra
