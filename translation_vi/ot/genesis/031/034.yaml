base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: vi
  text: Ra-chên đã lấy các tượng thần trong nhà[a], đặt chúng trong đệm yên của lạc đà[b], rồi ngồi lên chúng. La-ban sờ tìm khắp lều nhưng không tìm thấy chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tê-ra-phim” hoặc “các thần trong nhà.” Từ Hê-bơ-rơ này chỉ những vật thờ cúng trong gia đình.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong yên lạc đà” hoặc “trong bộ yên lạc đà.” Từ Hê-bơ-rơ có lẽ chỉ một phần có lót đệm trong bộ đồ cưỡi lạc đà.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: các tượng thần trong nhà
  rationale: Danh từ תְּרָפִים chỉ những vật thờ cúng hoặc thần tượng gắn với gia đình. Cách dịch này rõ nghĩa trong tiếng Việt hiện đại mà vẫn giữ được tính chất vật thể và bối cảnh thờ cúng.
- source_word: בְּכַר הַגָּמָל
  choice: vào tấm đệm yên lạc đà
  rationale: כַּר thường chỉ đệm hoặc vật có lót; trong bối cảnh này, đó có lẽ là phần đệm thuộc bộ yên cưỡi lạc đà.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: rồi ngồi lên trên
  rationale: Giữ trình tự hành động trong lời kể và diễn đạt tự nhiên việc Ra-chên dùng thân mình che giấu các vật ấy.
- source_word: וַיְמַשֵּׁשׁ
  choice: sờ tìm
  rationale: Động từ מששׁ nhấn mạnh việc dò tìm bằng tay, cụ thể hơn từ chung chung 'lục soát'.
- source_word: כָּל הָאֹהֶל
  choice: khắp lều
  rationale: Diễn đạt tự nhiên ý 'toàn bộ căn lều' trong tiếng Việt.
- source_word: וְלֹא מָצָא
  choice: nhưng không thấy chúng
  rationale: Bổ sung đại từ 'chúng' theo ngữ cảnh để câu tiếng Việt rõ nghĩa; 'nhưng' thể hiện kết quả trái với mục đích tìm kiếm.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Dùng 'sờ tìm' để giữ sắc thái dò xét bằng xúc giác của nguyên ngữ; các tên riêng được phiên âm theo lối quen dùng trong bản dịch Kinh Thánh tiếng Việt.
