  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: đại từ nữ tính số nhiều được nhấn mạnh trong “Chính các con”, nội dung nhận biết do “rằng” dẫn nhập, sự tận lực trong “đã hết sức”, và động từ עבד với tân ngữ “cha của các con”. Thì “đã ... phục vụ” phù hợp với lời Gia-cốp nhìn lại quãng thời gian làm việc cho La-ban.'
  naturalness: Câu văn hiện đại, rõ nghĩa, và cách xưng hô “cha—các con” phù hợp với ngữ cảnh Gia-cốp nói cùng hai con gái mình. Sự lặp lại của “cha” là hệ quả tự nhiên của hai quy chiếu khác nhau (Gia-cốp tự xưng và La-ban) và không gây trở ngại đáng kể.
  terminology: “Phục vụ” là lựa chọn có cơ sở cho עבד khi đi với một người làm tân ngữ; chú thích đã bảo lưu cách hiểu hợp ngữ cảnh lao động là “làm việc cho”. Tên riêng trong chú thích, “Gia-cốp” và “La-ban”, nhất quán với chính tả Việt ngữ thông dụng.
