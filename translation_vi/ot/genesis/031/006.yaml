  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: vi
  text: Chính các con biết rằng cha đã hết sức phục vụ cha của các con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm việc cho cha của các con.” Động từ Hê-bơ-rơ có thể có nghĩa là “phục vụ” hoặc “làm việc”, và cả hai nghĩa đều phù hợp với những năm Gia-cốp lao động dưới quyền La-ban.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֵּנָה
  choice: Chính các con
  rationale: Đại từ ngôi thứ hai giống cái số nhiều đứng độc lập tạo sắc thái nhấn mạnh khi Gia-cốp nói với Ra-chên và Lê-a; “chính các con” diễn đạt tự nhiên sắc thái ấy. Liên từ וְ không cần tách riêng thành “và” trong tiếng Việt vì mạch nối đã rõ và câu mở đầu tự nhiên hơn.
- source_word: יְדַעְתֶּן
  choice: biết
  rationale: Dạng hoàn thành Qal ngôi thứ hai giống cái số nhiều của ידע diễn tả trạng thái nhận biết hiện tại; “biết” là cách nói tự nhiên trong tiếng Việt.
- source_word: כִּי
  choice: rằng
  rationale: Từ này dẫn vào nội dung mà hai người con gái biết, nên “rằng” phù hợp với cấu trúc câu.
- source_word: בְּ/כָל כֹּחִי
  choice: đã hết sức
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “với tất cả sức lực của cha”; “hết sức” truyền đạt trọn vẹn ý dốc toàn bộ sức lực và tự nhiên trong ngữ cảnh lao động.
- source_word: עָבַדְתִּי
  choice: phục vụ
  rationale: Động từ עבד có thể mang nghĩa “phục vụ” hoặc “làm việc cho”. “Phục vụ” giữ được sắc thái quan hệ với một người làm tân ngữ, trong khi chú thích bảo lưu nghĩa thay thế phù hợp với những năm Gia-cốp lao động cho La-ban.
- source_word: אֶת אֲבִיכֶן
  choice: cha của các con
  rationale: אֶת đánh dấu tân ngữ trực tiếp; với “phục vụ”, tiếng Việt có thể diễn đạt trực tiếp là “phục vụ cha của các con”. Cách gọi “cha của các con” cũng tránh nhầm với đại từ tự xưng “cha” của Gia-cốp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cách xưng hô “cha—các con” phù hợp với lời Gia-cốp nói cùng hai con gái của La-ban; cụm “chính các con” bảo lưu sự nhấn mạnh của đại từ Hê-bơ-rơ.
