  text: אִם כֹּ֣ה יֹאמַ֗ר נְקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן נְקֻדִּ֑ים וְ/אִם כֹּ֣ה יֹאמַ֗ר עֲקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן עֲקֻדִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: vi
  text: 'Nếu ông ấy nói thế này: ‘Những con có đốm sẽ là tiền công của con,’ thì cả bầy đều sinh ra con có đốm; còn nếu ông ấy nói thế này: ‘Những con có vằn sẽ là tiền công của con,’ thì cả bầy đều sinh ra con có vằn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: có đốm
  rationale: Chỉ các con vật có những đốm hay chấm trên bộ lông; cách dịch tự nhiên và phân biệt với עֲקֻדִּים.
- source_word: עֲקֻדִּים
  choice: có vằn
  rationale: Chỉ các con vật mang những dải hoặc vệt màu trên bộ lông; “có vằn” diễn đạt rõ nét hình thái này trong tiếng Việt hiện đại.
- source_word: שְׂכָרֶךָ
  choice: tiền công của con
  rationale: Trong ngữ cảnh quan hệ giữa La-ban và Gia-cốp, שָׂכָר là khoản trả công; đại từ ngôi hai số ít được diễn đạt theo quan hệ gia đình trong lời Gia-cốp thuật lại.
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: thì cả bầy đều sinh ra con
  rationale: Dịch theo nghĩa sinh sản của động từ ילד với chủ thể là toàn bầy; thêm “con” để câu tiếng Việt rõ và tự nhiên.
- source_word: אִם כֹּה יֹאמַר
  choice: Nếu ông ấy nói thế này
  rationale: Giữ cấu trúc điều kiện và sắc thái dẫn lời trực tiếp của כֹּה; “ông ấy” phù hợp khi Gia-cốp nhắc đến La-ban với các bà vợ.
theological_decisions: []
