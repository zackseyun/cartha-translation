base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: vi
  text: “Đống đá này làm chứng, và trụ đá này cũng làm chứng rằng tôi sẽ không vượt qua đống đá này về phía anh, và anh cũng sẽ không vượt qua đống đá này và trụ đá này về phía tôi mà gây hại[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “mà gây hại” chỉ việc vượt qua ranh giới với ý đồ thù địch hoặc gây tổn hại. Do đứng ở cuối câu Hê-bơ-rơ, cụm này có thể được hiểu là áp dụng cho cả hai cam kết.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד / וְעֵדָה
  choice: làm chứng
  rationale: Hai cách dùng song song xác định chức năng chứng giám của đống đá và trụ đá. “Làm chứng” tự nhiên trong tiếng Việt và giữ được sự lặp lại có chủ ý.
- source_word: גַּל
  choice: đống đá
  rationale: Trong ngữ cảnh, đây là đống đá được dựng làm dấu mốc giao ước; thêm “đá” làm rõ hình ảnh hơn từ “đống” đứng riêng.
- source_word: מַצֵּבָה
  choice: trụ đá
  rationale: Chỉ một tảng đá được dựng đứng làm dấu mốc. “Trụ đá” vừa rõ nghĩa vừa phù hợp văn phong trang trọng hiện đại.
- source_word: אִם ... לֹא
  choice: rằng ... sẽ không
  rationale: Trong công thức thề ước, cấu trúc này nêu điều cam kết chứ không phải một điều kiện thông thường; cách dịch này truyền đạt chức năng ấy mà không thêm lời thề không có trong câu.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: vượt qua
  rationale: Diễn tả việc đi qua dấu mốc ranh giới, giữ được sắc thái không gian của động từ.
- source_word: אֵלֶיךָ / אֵלַי
  choice: về phía anh / về phía tôi
  rationale: Giữ hướng chuyển động về phía bên kia mà không tự thêm sắc thái đối nghịch; ý đồ gây hại được nêu riêng ở cuối câu.
- source_word: לְרָעָה
  choice: để làm hại
  rationale: Diễn tả mục đích hoặc ý đồ gây tổn hại, không phải cấm mọi sự đi qua ranh giới trong bất kỳ hoàn cảnh nào.
theological_decisions:
- issue: Phạm vi bổ nghĩa của לְרָעָה ở cuối câu
  choice: Giữ cụm “để làm hại” ở cuối toàn bộ hai cam kết
  alternative: Lặp lại “để làm hại” trong từng vế
  rationale: Vị trí cuối câu trong tiếng Hê-bơ-rơ cho phép cụm này chi phối cả hai hành động vượt qua. Không lặp lại tránh thêm hình thức không có trong nguyên văn, còn chú thích làm rõ phạm vi hợp lý của cụm từ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc song song và sự lặp lại của “làm chứng”; dùng “anh/tôi” phù hợp lời La-ban trực tiếp nói với Gia-cốp trong ngữ cảnh.
