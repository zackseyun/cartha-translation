    issue: Phối hợp danh từ bằng “cùng” trong vế thứ hai
    rationale: 'Nguyên văn dùng liên từ “và” giữa đống đá và trụ đá. “Và” tự nhiên, rõ ràng hơn trong tiếng Việt hiện đại: “đống đá này và trụ đá này.”'
  - severity: low
    issue: Neo chú thích đặt sau dấu chấm câu
    rationale: Chú thích giải thích trực tiếp cụm chỉ mục đích gây hại, nên được đặt ngay sau “mà gây hại” để neo chú thích minh bạch.
