base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: vi
  text: 'La-ban đáp lời và nói với Gia-cốp: “Các con gái là con gái của ta, các con trai là con trai của ta, đàn chiên dê là đàn chiên dê của ta, và mọi thứ con thấy đều là của ta. Nhưng hôm nay ta có thể làm gì cho các con gái này của ta, hoặc cho con cái mà các con gái ấy đã sinh ra?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hoặc cho những con trai mà chúng đã sinh ra”, nếu בְּנֵיהֶן được hiểu theo nghĩa hẹp là con trai thay vì con cái nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: La-ban đáp lời Gia-cốp
  rationale: Trong lối kể chuyện Hê-bơ-rơ, cặp động từ theo nghĩa đen là “đáp và nói”. Tiếng Việt tự nhiên dùng “đáp lời” để diễn đạt đầy đủ chức năng giới thiệu lời hồi đáp mà không tạo sự trùng lặp gượng gạo.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: Các con gái là con gái của ta
  rationale: Giữ nguyên phép lặp nhấn mạnh cùng lời khẳng định quan hệ sở hữu/gia tộc của La-ban.
- source_word: וְהַבָּנִים בָּנַי
  choice: các con trai là con trai của ta
  rationale: בָּנִים ở mệnh đề song song này được dịch theo nghĩa cụ thể là “con trai”, giữ sự phân biệt với “các con gái” ngay trước đó.
- source_word: וְהַצֹּאן צֹאנִי
  choice: bầy gia súc là bầy gia súc của ta
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ như chiên và dê; “bầy gia súc” vừa tự nhiên vừa không thu hẹp thành riêng chiên.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: và mọi thứ con thấy đều là của ta
  rationale: Diễn đạt trực tiếp lời tuyên bố sở hữu; “đều” truyền tải sắc thái bao quát của כֹל.
- source_word: מָה אֶעֱשֶׂה הַיּוֹם
  choice: hôm nay ta có thể làm gì
  rationale: Dạng chưa hoàn thành trong ngữ cảnh là câu hỏi tu từ về khả năng hành động hiện tại; “có thể làm gì” tự nhiên và giữ được sắc thái ấy.
- source_word: וְלִבְנֹתַי ... לָאֵלֶּה
  choice: cho các con gái này của ta
  rationale: Giữ cả ý hướng đến/đối với, từ chỉ định “này”, và lời nhận là “của ta”, đồng thời sắp xếp theo trật tự tiếng Việt hiện đại.
- source_word: אוֹ לִבְנֵיהֶן אֲשֶׁר יָלָדוּ
  choice: hoặc cho những đứa con mà chúng đã sinh ra
  rationale: בְּנֵיהֶן có thể chỉ “các con trai” hoặc rộng hơn là “con cái”; ngữ cảnh hậu duệ khiến “những đứa con” phù hợp, còn khả năng hẹp hơn được ghi chú. Đại từ “chúng” quy chiếu đến các con gái của La-ban.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ta/con” phù hợp với lời của người cha nói với con rể trong bối cảnh gia trưởng cổ đại. Giữ các phép lặp có chủ ý trong lời La-ban, nhưng rút gọn công thức “đáp và nói” thành “đáp lời” để tránh tiếng Việt gượng ép. Dấu chú thích [a] xuất hiện trong chính văn.
