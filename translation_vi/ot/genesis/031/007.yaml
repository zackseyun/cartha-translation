revisions:
- from: Thế nhưng cha các em đã lừa dối tôi[a] và thay đổi tiền công của tôi đến mười lần;[b] nhưng Đức Chúa Trời không cho phép ông ấy làm hại tôi.[c]
  to: Cha các em đã lừa dối tôi[a] và thay đổi tiền công của tôi mười lần[b], nhưng Đức Chúa Trời không cho phép ông ấy làm hại tôi.[c]
  rationale: Bản sửa thay “đến mười lần” bằng “mười lần” để theo sát cụm từ nguồn, bỏ liên từ đối lập dư ở đầu câu, và chỉnh chú thích c để giải thích thành ngữ tiếng Hê-bơ-rơ mà không gợi thêm một đối tượng của động từ “trao/ban.” Ý nghĩa của câu và các điểm mơ hồ cần thiết đều được bảo toàn.
  reviewer_model: gpt-5.6-terra
