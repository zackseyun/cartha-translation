  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: vi
  text: Cha các em đã lừa dối tôi[a] và thay đổi tiền công của tôi mười lần[b], nhưng Đức Chúa Trời không cho phép ông ấy làm hại tôi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã chơi khăm tôi” hoặc “đã giễu cợt tôi”. Động từ Hê-bơ-rơ có thể chỉ sự đối xử gian dối hoặc mang tính nhạo báng.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “mười lần”; đây có thể là cách nói chỉ sự thay đổi lặp đi lặp lại, không nhất thiết là con số chính xác.'
    reason: cultural_note
  - marker: c
    text: 'Cấu trúc Hê-bơ-rơ theo sát nghĩa đen là: “Đức Chúa Trời không ban cho ông ấy để làm hại tôi”; đây là cách nói có nghĩa là Đức Chúa Trời không cho phép ông ấy gây hại cho tôi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: lừa dối
  rationale: Dạng Hiphil của התל có thể chỉ cách đối xử gian dối hoặc nhạo báng. Trong ngữ cảnh La-ban liên tục thay đổi tiền công của Gia-cốp, “lừa dối” diễn đạt tự nhiên và sát trọng tâm của lời tố cáo, đồng thời chú thích giữ lại sắc thái “giễu cợt/chơi khăm” có thể có.
- source_word: וְהֶחֱלִף
  choice: và thay đổi
  rationale: Dạng Hiphil của חלף ở đây nói đến việc sửa đổi khoản thù lao đã thỏa thuận; “thay đổi” là cách nói rõ ràng, tự nhiên trong ngữ cảnh lao động.
- source_word: מַשְׂכֻּרְתִּי
  choice: tiền công của tôi
  rationale: Danh từ này chỉ tiền công hoặc thù lao cho lao động. “Tiền công” thông dụng và phù hợp với ngữ cảnh.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: đến mười lần
  rationale: Cụm Hê-bơ-rơ theo nghĩa bề mặt là “mười lần”; “đến” làm nổi bật tính lặp lại nhưng không biến con số thành một cách diễn giải khác. Chú thích cho biết đây có thể là thành ngữ, không nhất thiết là số đếm chính xác.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: nhưng Đức Chúa Trời không cho phép ông ấy
  rationale: Theo nghĩa đen là “Đức Chúa Trời không trao/ban cho ông ấy”, một thành ngữ chỉ việc không cho cơ hội hay quyền thực hiện. “Không cho phép ông ấy” truyền đạt rõ ý Đức Chúa Trời ngăn cản mà không nói quá điều bản văn khẳng định.
- source_word: לְהָרַע עִמָּדִי
  choice: làm hại tôi
  rationale: Động từ רעע đi với עִם ở đây có nghĩa đối xử tệ hoặc gây hại cho một người. “Làm hại tôi” ngắn gọn, tự nhiên và trung thành với ý nghĩa.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong lời của Gia-cốp, אֱלֹהִים chỉ Đức Chúa Trời; danh xưng này trang trọng, rõ nghĩa và quen thuộc trong tiếng Việt Kinh Thánh.
theological_decisions:
- issue: Sự ngăn giữ của Đức Chúa Trời trong thành ngữ “Đức Chúa Trời không trao cho ông ấy”
  choice: Đức Chúa Trời không cho phép La-ban làm hại Gia-cốp
  alternative: Đức Chúa Trời không để La-ban thành công trong việc làm hại Gia-cốp; hoặc Đức Chúa Trời không phó Gia-cốp vào tay La-ban
  rationale: Cách dịch “không cho phép” giữ được ý Đức Chúa Trời chủ động ngăn cản hành động gây hại, nhưng không xác định thêm phương cách ngăn cản hay mức độ ý định của La-ban.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Cha các em” phản ánh số nhiều của כֶן trong bối cảnh Gia-cốp nói với Ra-chên và Lê-a; “tôi” được dùng để tránh lối xưng hô quá cổ hoặc áp đặt sắc thái thân mật không có trong hình thái Hê-bơ-rơ. Các chú thích bảo tồn độ rộng nghĩa của הֵתֶל, tính thành ngữ có thể có của “mười lần”, và cấu trúc đặc thù của lời khẳng định về sự ngăn giữ của Đức Chúa Trời.
