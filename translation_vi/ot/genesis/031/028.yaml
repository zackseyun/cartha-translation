  yaml_path: translation/ot/genesis/031/028.yaml
  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: vi
  text: Con đã không để cha hôn các con trai và con gái của cha[a]. Bây giờ, con đã hành động dại dột.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Con đã không để cha được hôn các con trai và con gái của cha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: không để cha
  rationale: Động từ נטשׁ thường có nghĩa là “bỏ, để lại”, nhưng khi đi với động từ nguyên mẫu “hôn” trong cấu trúc này, nó diễn đạt việc không cho cơ hội hoặc không cho phép. “Không để cha” tự nhiên trong tiếng Việt và phù hợp với lời một người cha nói với con rể.
- source_word: לְנַשֵּׁק
  choice: hôn
  rationale: Từ này đơn giản có nghĩa là “hôn”. Ngữ cảnh ra đi hàm ý một nụ hôn từ biệt, nhưng bản Hê-bơ-rơ không nói rõ “từ biệt”, nên bản dịch chính giữ nguyên sự hàm súc.
- source_word: לְבָנַי וְלִבְנֹתָי
  choice: các con trai và con gái của cha
  rationale: Bản Hê-bơ-rơ nêu rõ cả con trai lẫn con gái. Cách dịch này bảo toàn hai danh xưng, đồng thời dùng “cha” theo quan hệ gia đình trong lời La-ban nói với Gia-cốp; “con trai” ở đây có thể bao gồm các cháu trai được xem là con cháu của La-ban.
- source_word: עַתָּה
  choice: Giờ đây
  rationale: Diễn đạt tự nhiên dấu hiệu thời gian/chuyển ý dùng để mở đầu lời La-ban đánh giá hành động của Gia-cốp.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: con đã hành động dại dột
  rationale: Cụm Hê-bơ-rơ mang nghĩa làm hoặc hành xử một cách dại dột. Cách dịch này tự nhiên, trang trọng vừa phải và không tăng nặng thành lời quy kết bản chất con người.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, tự nhiên và có phẩm cách. Đại từ “cha–con” phản ánh quan hệ bố vợ–con rể và giọng trách móc trực tiếp của La-ban. Giữ riêng “con trai” và “con gái” theo bản Hê-bơ-rơ, không gộp thành “con cái”.
