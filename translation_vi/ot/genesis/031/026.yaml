base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: vi
  text: 'Bấy giờ, La-ban nói với Gia-cốp: “Ngươi đã làm gì vậy? Ngươi đã lừa ta[a] và đưa các con gái ta đi như những nữ tù binh chiến tranh[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “đánh cắp lòng ta”, một cách nói có nghĩa là hành động lén lút sau lưng hoặc lừa dối người khác.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dịch sát là “những nữ tù binh của gươm”, tức những phụ nữ bị bắt làm tù binh trong chiến tranh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Ngươi đã làm gì vậy?
  rationale: Câu hỏi mang sắc thái buộc tội; “vậy” diễn đạt tự nhiên sức nặng của lời chất vấn trong tiếng Việt.
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: Ngươi đã lừa ta
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “đánh cắp lòng ta” nhưng trong ngữ cảnh chỉ hành động lén lút khiến La-ban không hay biết, tức lừa dối ông. Dịch nguyên văn trong tiếng Việt dễ gợi ý chiếm được tình cảm, không phù hợp với lời cáo buộc ở đây.
- source_word: וַתְּנַהֵג
  choice: đưa ... đi
  rationale: Động từ נהג có thể chỉ dẫn hoặc lùa đi. Cụm so sánh với tù binh đã truyền đạt sắc thái cưỡng ép, nên “đưa ... đi” giữ câu tiếng Việt tự nhiên mà không thêm quá mức.
- source_word: בְּנֹתַי
  choice: các con gái ta
  rationale: Giữ nguyên lời khẳng định quan hệ gia đình của La-ban.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: như những nữ tù binh chiến tranh
  rationale: Danh từ “tù binh” ở dạng giống cái, còn “của gươm” là hình ảnh chỉ những người bị bắt trong chiến tranh. Cách dịch này truyền đạt đúng ý và giới tính ngữ pháp một cách tự nhiên trong tiếng Việt; nghĩa đen được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng văn phong hiện đại, trang trọng. Cặp đại từ “ngươi—ta” thể hiện giọng trách cứ và vị thế bề trên mà không đưa thêm cách giải thích vào nội dung. Cấu trúc thành ngữ Hê-bơ-rơ được chuyển sang nghĩa tự nhiên trong chính văn, còn hình ảnh nguyên ngữ được bảo tồn trong chú thích.
