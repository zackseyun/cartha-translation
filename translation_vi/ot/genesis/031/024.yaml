  terminology: “Đức Chúa Trời,” “La-ban,” “Gia-cốp,” và “người A-ram” nhất quán với văn phong Kinh Thánh Việt ngữ và sát nghĩa ngữ tộc A-ram hơn cách gọi truyền thống “người Sy-ri.”
