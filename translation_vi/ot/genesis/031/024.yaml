  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל לָבָ֥ן הָ/אֲרַמִּ֖י בַּ/חֲלֹ֣ם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִשָּׁ֧מֶר לְ/ךָ֛ פֶּן תְּדַבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: vi
  text: 'Nhưng Đức Chúa Trời đến với La-ban, người A-ram, trong một giấc mơ vào ban đêm và phán với ông: “Hãy cẩn thận, đừng nói với Gia-cốp bất cứ điều gì, dù tốt hay xấu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ tốt đến xấu,” một thành ngữ chỉ bất cứ điều gì, dù thuận lợi hay bất lợi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đến với
  rationale: Động từ בוא ở thể kể chuyện có nghĩa cơ bản là “đến”; không thêm ý “hiện ra,” vì nguyên văn không dùng động từ chỉ sự hiện ra.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít và ngữ cảnh cho thấy danh từ này chỉ Đức Chúa Trời, không phải nhiều thần.
- source_word: לָבָן הָאֲרַמִּי
  choice: La-ban, người A-ram
  rationale: אֲרַמִּי là tên dân tộc “người A-ram”; cách dịch này sát nguyên ngữ hơn lối gọi truyền thống “người Sy-ri.”
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: ban đêm ... trong một giấc mơ
  rationale: Diễn đạt tự nhiên trong tiếng Việt cả phương tiện mặc khải là giấc mơ lẫn thời điểm ban đêm.
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy cẩn thận
  rationale: Đây là công thức cảnh báo mang nghĩa phải đề phòng hoặc giữ mình; “Hãy cẩn thận” rõ ràng và tự nhiên.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: đừng nói với Gia-cốp
  rationale: פֶּן sau lời cảnh báo thể hiện điều bị ngăn cấm; דבר עם được diễn đạt tự nhiên là “nói với.”
- source_word: מִטּוֹב עַד רָע
  choice: điều gì, dù tốt hay xấu
  rationale: Nghĩa đen là “từ tốt đến xấu,” một thành ngữ bao quát mọi lời nói. Thêm “điều gì” làm rõ lực thành ngữ mà vẫn giữ cặp đối cực tốt–xấu.
theological_decisions:
- issue: Danh tính của אֱלֹהִים
  choice: Đức Chúa Trời
  alternative: một vị thần / các thần
  rationale: Các dạng động từ số ít và ngữ cảnh tường thuật xác định chủ thể là Đức Chúa Trời; đây là quyết định dựa trên ngữ pháp và văn mạch.
- issue: Phạm vi lời Đức Chúa Trời cấm La-ban nói
  choice: không được nói bất cứ điều gì với Gia-cốp, dù tốt hay xấu
  alternative: chỉ không được đe dọa hoặc làm hại Gia-cốp
  rationale: Cụm “từ tốt đến xấu” bao quát toàn bộ phạm vi và không nên bị thu hẹp thành chỉ lời ác hay lời đe dọa.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng tên riêng theo dạng phiên âm Kinh Thánh tiếng Việt quen thuộc; giữ “người A-ram” sát tên dân tộc trong tiếng Hê-bơ-rơ. Đặt trạng ngữ “ban đêm” đầu câu để câu tiếng Việt tự nhiên và không làm thay đổi quan hệ ý nghĩa.
