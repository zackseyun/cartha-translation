source:
  edition: WLC
  text: וְ/הַ/מִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהוָ֖ה בֵּינִ֣/י וּ/בֵינֶ֑/ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵ/רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: vi
  text: 'Còn Mích-pa[a] là vì ông nói: “Nguyện Yahweh canh chừng giữa tôi và ông khi chúng ta khuất mắt nhau[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Mích-pa tương ứng với từ Hê-bơ-rơ có nghĩa là “tháp canh” hoặc “nơi quan sát,” liên kết tên địa điểm này với lời “Nguyện Yahweh canh chừng.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “khi chúng ta không còn nhìn thấy nhau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: Và Mích-pa
  rationale: Giữ địa danh theo chức năng định danh trong ngữ cảnh, đồng thời dùng chú thích để bảo tồn lối chơi chữ với động từ צפה (‘canh chừng’). Liên từ ‘Và’ phản ánh וְ và cho thấy câu tiếp nối lời đặt tên ở câu trước.
- source_word: אֲשֶׁר אָמַר
  choice: vì ông nói
  rationale: Mệnh đề quan hệ ở đây giải thích tên gọi. Không thêm ‘ông gọi nơi ấy là’ vì những từ đó không hiện diện trong câu Hebrew.
- source_word: יִצֶף
  choice: canh chừng
  rationale: Dạng ý nguyện của צפה diễn tả lời cầu mong Yahweh theo dõi, trông coi; ‘canh chừng’ vừa tự nhiên vừa giữ liên hệ từ nguyên với Mích-pa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời trong bản nguồn thay vì thay bằng một tước hiệu.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: giữa tôi với ông
  rationale: Giữ thứ tự ngôi của bản nguồn và diễn đạt tự nhiên trong tiếng Việt.
- source_word: כִּי
  choice: khi
  rationale: Trong ngữ cảnh này, כִּי giới thiệu hoàn cảnh mà sự canh chừng được cầu xin, nên ‘khi’ phù hợp hơn nghĩa nguyên nhân ‘vì’.
- source_word: נִסָּתֵר
  choice: chúng ta khuất mắt
  rationale: Dạng Niphal số nhiều có nghĩa là bị che khuất/không còn thấy được. ‘Khuất mắt’ giữ hình ảnh của nguyên ngữ mà vẫn tự nhiên.
- source_word: אִישׁ מֵרֵעֵהוּ
  choice: nhau
  rationale: Cụm phân phối theo nghĩa đen ‘mỗi người khỏi người bạn mình’ mang nghĩa tương hỗ trong ngữ cảnh hai bên; ‘nhau’ là cách diễn đạt tiếng Việt rõ và gọn.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; chuyển tự ‘Yahweh’ bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của lời ‘canh chừng’
  choice: Giữ như một lời cầu xin Yahweh canh chừng giữa hai bên
  alternative: Diễn giải thành lời chúc phước hoặc lời đe dọa
  rationale: Câu Hebrew không nói rõ việc canh chừng nhằm bảo vệ hay giám sát để làm chứng; bản dịch không giải quyết thay sự căng thẳng đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc mở đầu hơi phụ thuộc vào câu trước (‘Và Mích-pa’) để phản ánh tính liên tục của nguyên văn; dùng ‘ông’ cho đại từ số ít giống đực trong lời đối thoại. Dấu chú thích [b] được đặt tại cụm từ mà chú thích thực sự giải nghĩa.
