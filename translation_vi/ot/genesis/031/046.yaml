base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: vi
  text: 'Gia-cốp nói với anh em mình[a]: “Hãy gom đá lại.” Họ liền lấy đá, chất thành một đống, rồi ăn tại đó, bên đống đá[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây có thể chỉ rộng hơn là những người nam thuộc họ hàng hoặc cùng đi với Gia-cốp, chứ không nhất thiết chỉ là anh em ruột.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “trên đống đá.” Giới từ Hê-bơ-rơ có nghĩa sát chữ là “trên”, nhưng cũng có thể chỉ vị trí bên cạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: với anh em mình
  rationale: אָח trước hết có nghĩa là “anh/em”, nhưng trong ngữ cảnh này có thể chỉ rộng hơn những người nam thuộc họ hàng hoặc cùng đi với Gia-cốp. Bản dịch giữ cách gọi gần nguyên văn và ghi chú phạm vi nghĩa rộng.
- source_word: לִקְטוּ אֲבָנִים
  choice: Hãy nhặt đá lại
  rationale: Động từ לקט diễn tả việc nhặt, gom các vật lại; cách nói này tự nhiên trong tiếng Việt và phù hợp với việc tập hợp đá.
- source_word: וַיַּעֲשׂוּ גָל
  choice: chất thành một đống
  rationale: גַּל là một đống, đặc biệt là đống đá. “Chất thành một đống” truyền đạt rõ cả hành động lẫn kết quả, không dùng thuật ngữ chuyên biệt khó hiểu.
- source_word: עַל הַגָּל
  choice: bên đống đá
  rationale: עַל có thể mang nghĩa sát chữ là “trên”, nhưng trong ngữ cảnh không gian cũng có thể là “bên/cạnh”. Cách dịch chính tự nhiên, còn nghĩa sát chữ được bảo lưu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Gia-cốp” theo cách phiên âm Kinh Thánh quen thuộc; giữ nhịp kể chuyện ngắn gọn của nguyên văn.
