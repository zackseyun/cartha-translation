  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: vi
  text: Ta là Đức Chúa Trời của Bê-tên[a], nơi con đã xức dầu cho một trụ đá và đã lập một lời khấn với Ta. Bây giờ, hãy đứng dậy, rời khỏi xứ này và trở về quê hương của con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bê-tên” nghĩa là “nhà của Đức Chúa Trời”; ở đây, từ này là tên một địa điểm.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: Đức Chúa Trời của Bê-tên
  rationale: Mạo từ xác định cùng lời tự xưng của Đức Chúa Trời nhận diện Đấng đã gặp Gia-cốp tại Bê-tên; Bê-tên được giữ như địa danh.
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: nơi con đã xức dầu cho một trụ đá
  rationale: Giữ hành động cụ thể מָשַׁח là xức dầu và diễn đạt מַצֵּבָה là một khối đá được dựng đứng làm trụ; cách nói này cũng phù hợp với Sáng Thế Ký 28:18.
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: đã khấn nguyện với Ta
  rationale: Cụm động từ–danh từ cùng gốc nhấn mạnh việc lập lời nguyện; tiếng Việt tự nhiên dùng “khấn nguyện,” còn “với Ta” giữ đối tượng hướng đến của lời nguyện.
- source_word: עַתָּה קוּם
  choice: Bây giờ, hãy đứng dậy
  rationale: עַתָּה chuyển từ hồi tưởng sang mệnh lệnh; קוּם là mệnh lệnh chuẩn bị lên đường, được diễn đạt tự nhiên là “hãy đứng dậy.”
- source_word: צֵא מִן הָאָרֶץ הַזֹּאת
  choice: rời khỏi xứ này
  rationale: Trong ngữ cảnh rời một vùng cư trú, צֵא מִן được chuyển tự nhiên là “rời khỏi”; אֶרֶץ chỉ vùng đất hay xứ, không phải toàn thể trái đất.
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: và trở về quê hương của con
  rationale: שׁוּב chỉ việc quay lại nơi xuất thân; אֶרֶץ מוֹלַדְתֶּךָ có thể nói đến xứ sinh quán hoặc quê gốc, nên “quê hương” truyền đạt tự nhiên mà không giới hạn nghĩa vào thân tộc.
theological_decisions:
- issue: Lời tự nhận là הָאֵל בֵּית אֵל
  choice: Ta là Đức Chúa Trời của Bê-tên
  alternative: Ta là Đức Chúa Trời tại Bê-tên
  rationale: Cách dịch được chọn giữ cấu trúc sở thuộc tự nhiên nhất và nối người phán với cuộc gặp trước đây của Gia-cốp tại Bê-tên, nhưng không thêm lời giải thích rằng Ngài là một thần linh chỉ thuộc riêng địa phương ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” cho lời Đức Chúa Trời phán trực tiếp với Gia-cốp. “Trụ đá” làm rõ vật được dựng lên mà không thêm sắc thái thờ phượng ngoài văn bản. Dấu chú thích [a] được đặt ngay sau địa danh tương ứng.
