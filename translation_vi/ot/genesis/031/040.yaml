  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ thế đối xứng “ban ngày—ban đêm” và hình ảnh “giấc ngủ lìa khỏi mắt tôi”; dấu chấm phẩy làm rõ bước chuyển sang hậu quả là mất ngủ.
