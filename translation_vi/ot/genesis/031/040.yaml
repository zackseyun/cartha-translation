  yaml_path: translation/ot/genesis/031/040.yaml
  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: vi
  text: 'Tôi đã như thế này: cái nóng ban ngày và sương giá ban đêm bào mòn tôi; giấc ngủ lìa khỏi mắt tôi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ban ngày cái nóng thiêu đốt tôi, và ban đêm là sương giá.” Bản Hê-bơ-rơ mở đầu bằng “tôi đã là/đã ở,” giới thiệu tình cảnh của Gia-cốp; ý này được diễn đạt tự nhiên bằng “Tôi đã như thế này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי
  choice: '[được hàm ý trong cấu trúc câu]'
  rationale: Động từ “tôi đã ở/đã là” mở đầu lời mô tả tình cảnh của Gia-cốp. Trong tiếng Việt tự nhiên, ý này được chuyển tải bằng toàn bộ cấu trúc câu thay vì dịch riêng một cách gượng ép.
- source_word: בַיּוֹם
  choice: Ban ngày
  rationale: Cụm từ chỉ thời gian, tạo thế đối xứng trực tiếp với “ban đêm”.
- source_word: אֲכָלַנִי
  choice: thiêu đốt tôi
  rationale: Động từ אכל có nghĩa đen là “ăn, nuốt”, ở đây diễn tả sức nóng khắc nghiệt làm hao mòn con người. “Thiêu đốt tôi” giữ được hình ảnh mạnh và phù hợp tự nhiên với chủ ngữ “cái nóng”.
- source_word: חֹרֶב
  choice: cái nóng
  rationale: Trong thế đối lập với sương giá ban đêm, từ này chỉ sức nóng khô hoặc nóng gay gắt ban ngày.
- source_word: וְקֶרַח
  choice: sương giá
  rationale: Danh từ có thể chỉ băng hoặc giá rét; trong bối cảnh thời tiết ban đêm, “sương giá” vừa chính xác vừa tự nhiên.
- source_word: בַּלָּיְלָה
  choice: ban đêm
  rationale: Giữ sự cân xứng với “ban ngày” trong nguyên văn.
- source_word: וַתִּדַּד
  choice: lìa khỏi
  rationale: Động từ hiếm này diễn tả việc rời đi hoặc chạy trốn. “Lìa khỏi” duy trì phép nhân hóa của giấc ngủ mà vẫn trang trọng, dễ hiểu.
- source_word: שְׁנָתִי
  choice: giấc ngủ
  rationale: Chỉ trạng thái ngủ của người nói; đây là cách diễn đạt phổ thông và tự nhiên trong tiếng Việt.
- source_word: מֵעֵינָי
  choice: khỏi mắt tôi
  rationale: Giữ nguyên hình ảnh Hê-bơ-rơ về sự mất ngủ và vẫn rõ nghĩa trong tiếng Việt.
theological_decisions: []
