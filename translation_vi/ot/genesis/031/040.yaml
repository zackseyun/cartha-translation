- from: Ban ngày, cái nóng thiêu đốt tôi[a], ban đêm, sương giá hành hạ tôi; giấc ngủ lìa khỏi mắt tôi.
  to: 'Tôi đã như thế này: cái nóng ban ngày và sương giá ban đêm bào mòn tôi; giấc ngủ lìa khỏi mắt tôi.[a]'
  rationale: Bản sửa diễn đạt rõ động từ mở đầu “tôi đã là/đã ở,” vốn giới thiệu tình cảnh được mô tả, và dùng “bào mòn” cho cả nóng lẫn sương giá để bảo toàn một động từ chung trong nguyên văn. Hình ảnh giấc ngủ lìa khỏi mắt vẫn được giữ nguyên.
