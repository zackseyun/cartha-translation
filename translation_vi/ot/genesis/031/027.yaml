  to: Tại sao con lại lẩn trốn để bỏ đi, lẻn bỏ đi khỏi cha[a], mà không cho cha biết, để cha có thể tiễn con đi trong niềm vui và với những bài hát[b], cùng trống tay[c] và đàn lia[d]?
