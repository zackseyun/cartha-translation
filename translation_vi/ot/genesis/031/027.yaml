  text: לָ֤/מָּה נַחְבֵּ֨אתָ֙ לִ/בְרֹ֔חַ וַ/תִּגְנֹ֖ב אֹתִ֑/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י וָֽ/אֲשַׁלֵּחֲ/ךָ֛ בְּ/שִׂמְחָ֥ה וּ/בְ/שִׁרִ֖ים בְּ/תֹ֥ף וּ/בְ/כִנּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: vi
  text: Tại sao con lại lẩn trốn để bỏ đi, lẻn bỏ đi khỏi cha[a], mà không cho cha biết, để cha có thể tiễn con đi trong niềm vui và với những bài hát[b], cùng trống tay[c] và đàn lia[d]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “con đã đánh cắp cha.” Đây là một thành ngữ Hê-bơ-rơ chỉ việc lén rời khỏi một người mà họ không hay biết.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “với tiếng ca hát.”'
    reason: lexical_alternative
  - marker: c
    text: 'Một loại trống cầm tay, có thể là trống khung; cách dịch truyền thống thường dùng: “trống cơm” hoặc “timbrel.”'
    reason: lexical_alternative
  - marker: d
    text: Cũng thường được dịch là “đàn hạc,” nhưng từ Hê-bơ-rơ cụ thể hơn, chỉ một loại đàn lia.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Tại sao
  rationale: Cách hỏi nguyên nhân tự nhiên trong tiếng Việt hiện đại, giữ nguyên giọng trách cứ.
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: lén trốn đi
  rationale: Kết hợp sắc thái tự giấu mình của נַחְבֵּאתָ với ý chạy trốn của לִבְרֹחַ thành cách diễn đạt tự nhiên mà vẫn giữ tính bí mật và chủ ý bỏ trốn.
- source_word: וַתִּגְנֹב אֹתִי
  choice: bỏ đi mà không cho cha biết
  rationale: Nguyên văn sát chữ là “đánh cắp cha/tôi”, nhưng đây là thành ngữ chỉ việc lén rời khỏi một người. Bản dịch nêu rõ ý thành ngữ; chú thích giữ lại hình ảnh nguyên văn.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: mà không cho cha biết
  rationale: נגד ở thể Hifil có nghĩa là báo hoặc nói cho biết. Đại từ “cha/con” phù hợp quan hệ và lời thoại tiếng Việt, dù tiếng Hê-bơ-rơ chỉ dùng “tôi/anh”.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: cha đã có thể tiễn con lên đường
  rationale: 'Trong lời trách của La-ban, vav mang ý hệ quả trái với thực tế: nếu được báo trước, ông đã có thể tổ chức tiễn Gia-cốp. “Tiễn ... lên đường” tự nhiên hơn “sai đi” trong bối cảnh chia tay.'
- source_word: בְּשִׂמְחָה
  choice: trong niềm vui
  rationale: Diễn đạt trực tiếp trạng thái vui mừng của cuộc tiễn đưa.
- source_word: וּבְשִׁרִים
  choice: với những bài hát
  rationale: Giữ số nhiều của שִׁירִים; “ca hát” cũng có thể là cách hiểu theo hoạt động.
- source_word: בְּתֹף
  choice: tiếng trống tay
  rationale: תֹף là nhạc cụ gõ cầm tay, có thể là trống khung; “trống tay” dễ hiểu và tránh từ cổ “trống cơm/tambourine” không hoàn toàn chính xác.
- source_word: וּבְכִנּוֹר
  choice: đàn lia
  rationale: כִּנּוֹר chỉ loại đàn dây gần với lyre hơn là đàn hạc theo nghĩa rộng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cặp xưng hô “cha/con” vì La-ban đang nói với con rể Gia-cốp và tiếng Việt thường cần biểu thị quan hệ trong lời thoại. Câu được tái cấu trúc thành hai câu để tránh một chuỗi hỏi dài, nhưng vẫn giữ giọng trách cứ và điều kiện trái thực tế hàm ẩn. Tất cả dấu chú thích đều xuất hiện trong chính văn.
