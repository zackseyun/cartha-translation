  to: Con vật bị thú dữ xé, tôi không đem đến cho ông; chính tôi phải bồi thường thiệt hại đó.[a] Ông đòi tôi bồi thường cả con vật bị trộm ban ngày lẫn con vật bị trộm ban đêm.[b]
  rationale: Bản sửa dùng «bồi thường» để phản ánh rõ hơn sắc thái chịu trách nhiệm và làm bù tổn thất. Cụm «cả... lẫn...» bảo toàn quan hệ bổ sung của liên từ Hê-bơ-rơ giữa hai trường hợp bị trộm, thay vì biến chúng thành các khả năng loại trừ. Chú thích được chỉnh cho tự nhiên và thận trọng hơn về cú pháp.
