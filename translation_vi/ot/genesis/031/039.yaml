  text: טְרֵפָה֙ לֹא הֵבֵ֣אתִי אֵלֶ֔י/ךָ אָנֹכִ֣י אֲחַטֶּ֔/נָּה מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נָּה גְּנֻֽבְתִ֣י י֔וֹם וּ/גְנֻֽבְתִ֖י לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: vi
  text: Con vật bị thú dữ xé, tôi không đem đến cho ông; chính tôi phải bồi thường thiệt hại đó.[a] Ông đòi tôi bồi thường cả con vật bị trộm ban ngày lẫn con vật bị trộm ban đêm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «chính tôi gánh lấy tổn thất ấy» hoặc «chính tôi bồi thường cho nó».'
    reason: Động từ Hê-bơ-rơ ở đây có thể diễn tả việc tự chịu tổn thất hoặc bồi hoàn tổn thất đó.
  - marker: b
    text: 'Sát chữ: «Ông đòi nó từ tay tôi—bị trộm ban ngày và bị trộm ban đêm». Thành ngữ «đòi từ tay tôi» nghĩa là đòi một người phải chịu trách nhiệm hoặc bồi hoàn.'
    reason: Cấu trúc Hê-bơ-rơ cô đọng; hai cụm cuối nêu song song các trường hợp bị trộm vào ban ngày và ban đêm.
lexical_decisions:
- source_word: טְרֵפָה
  choice: con vật nào bị thú dữ xé
  rationale: Trong bối cảnh chăn gia súc, danh từ này chỉ con vật bị thú săn mồi xé chết. Cách dịch làm rõ đối tượng mà vẫn giữ hình ảnh cụ thể của nguyên ngữ.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: tôi không đem đến cho ông
  rationale: Động từ בוא với אֶל diễn tả việc đem vật gì đến cho một người; tân ngữ được hiểu từ טְרֵפָה.
- source_word: אָנֹכִי
  choice: chính tôi
  rationale: Đại từ độc lập tạo sắc thái nhấn mạnh trong lời tự biện hộ của Gia-cốp.
- source_word: אֲחַטֶּנָּה
  choice: phải bù tổn thất ấy
  rationale: Dạng Piel của חטא ở đây nói đến việc gánh trách nhiệm hoặc bồi hoàn một mất mát, chứ không mang nghĩa thông thường là phạm tội.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: Ông đòi tôi phải chịu trách nhiệm
  rationale: Thành ngữ בקש מן־יד diễn tả việc đòi một người chịu trách nhiệm hoặc bồi hoàn. Dịch theo nghĩa tự nhiên của thành ngữ trong tiếng Việt.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: con vật bị trộm ban ngày cũng như con vật bị trộm ban đêm
  rationale: Hai cụm song song nêu các gia súc bị lấy trộm trong cả hai thời điểm; “cũng như” giữ quan hệ bổ sung của וְ và tránh tạo cảm giác đây chỉ là hai khả năng loại trừ nhau.
