  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” phù hợp với lời Gia-cốp nói trực tiếp với La-ban; giữ nhịp đối xứng “ban ngày… ban đêm” của nguyên ngữ.
