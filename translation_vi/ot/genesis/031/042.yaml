source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: vi
  text: Nếu Đức Chúa Trời của cha tôi, Đức Chúa Trời của Áp-ra-ham và Nỗi Kinh Sợ của Y-sác[a] không ở cùng tôi, thì chắc hẳn đến lúc này ông đã đuổi tôi đi tay trắng. Đức Chúa Trời đã thấy nỗi khốn khổ của tôi và sự lao nhọc của đôi tay tôi, và đêm qua Ngài đã phân xử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng mà Y-sác kính sợ.” Nguyên văn Hê-bơ-rơ là “Nỗi Kinh Sợ của Y-sác,” một tước hiệu đặc biệt dành cho Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: Nếu ... không ... thì
  rationale: Diễn đạt tự nhiên điều kiện trái với thực tế trong tiếng Việt.
- source_word: אֱלֹהֵי אָבִי
  choice: Đức Chúa Trời của cha tôi
  rationale: Giữ rõ cấu trúc sở hữu và lời viện dẫn đến Đức Chúa Trời của tổ phụ Gia-cốp.
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: Đức Chúa Trời của Áp-ra-ham
  rationale: Bản dịch trực tiếp, tự nhiên của cụm từ Hê-bơ-rơ.
- source_word: וּפַחַד יִצְחָק
  choice: Nỗi Kinh Sợ của Y-sác
  rationale: Giữ nguyên hình ảnh và tước hiệu thần học khác thường của nguyên văn; viết hoa để giúp người đọc nhận ra đây là cách chỉ về Đức Chúa Trời.
- source_word: הָיָה לִי
  choice: ở cùng tôi
  rationale: Trong văn cảnh, thành ngữ diễn tả sự hiện diện và nâng đỡ của Đức Chúa Trời.
- source_word: כִּי עַתָּה
  choice: chắc hẳn đến lúc này
  rationale: Thể hiện cả sắc thái nhấn mạnh lẫn kết quả lẽ ra đã xảy ra vào thời điểm ấy.
- source_word: רֵיקָם
  choice: tay trắng
  rationale: Thành ngữ tiếng Việt tự nhiên, chỉ việc ra đi mà không nhận được tài sản hay công xá.
- source_word: שִׁלַּחְתָּנִי
  choice: ông đã đuổi tôi đi
  rationale: Phù hợp với lời Gia-cốp nói trực tiếp với La-ban và sắc thái bị cho ra đi mà không có gì.
- source_word: עָנְיִי
  choice: nỗi khốn khổ của tôi
  rationale: Bao quát sự khổ sở và ngược đãi của Gia-cốp, không giới hạn vào cảnh nghèo túng.
- source_word: יְגִיעַ כַּפַּי
  choice: công lao khó nhọc của đôi tay tôi
  rationale: Giữ hình ảnh đôi tay trong nguyên văn đồng thời diễn đạt cả lao động lẫn sự nhọc nhằn.
- source_word: רָאָה אֱלֹהִים
  choice: Đức Chúa Trời đã thấy
  rationale: Dịch trực tiếp hành động Đức Chúa Trời nhận biết cảnh ngộ của Gia-cốp.
- source_word: וַיּוֹכַח
  choice: Ngài đã phân xử
  rationale: Động từ có thể mang nghĩa phân xử, phán quyết hoặc quở trách. 'Phân xử' giữ sắc thái pháp lý và không thêm một tân ngữ vốn không có trong nguyên văn.
theological_decisions:
- issue: Tước hiệu וּפַחַד יִצְחָק
  choice: Nỗi Kinh Sợ của Y-sác
  alternative: Đấng mà Y-sác kính sợ
  rationale: Bản chính giữ cách nói đặc thù và sự căng thẳng thần học của nguyên văn; chú thích cung cấp cách hiểu giải nghĩa mà không âm thầm thay thế tước hiệu.
- issue: Ý nghĩa của וַיּוֹכַח trong văn cảnh
  choice: Ngài đã phân xử
  alternative: Ngài đã quở trách; Ngài đã phán xét
  rationale: Lời cảnh báo La-ban trong giấc mơ có thể được hiểu là sự quở trách, nhưng động từ cũng có sắc thái xét xử hoặc giải quyết tranh chấp. 'Phân xử' bảo toàn sắc thái pháp lý và tránh thêm 'ông' làm tân ngữ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “ông” phù hợp với lời Gia-cốp nói với La-ban; “Ngài” dùng cho Đức Chúa Trời. Bản dịch giữ tước hiệu khác thường của tiếng Hê-bơ-rơ và dùng chú thích để giải thích.
