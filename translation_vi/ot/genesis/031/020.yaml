  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đánh lừa” để chuyển nghĩa thành ngữ trong câu chính, đồng thời bảo tồn hình ảnh nguyên ngữ trong chú thích; giữ tên sắc tộc “A-ram” theo tiếng Hê-bơ-rơ.
