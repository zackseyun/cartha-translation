  yaml_path: translation/ot/genesis/031/020.yaml
  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: vi
  text: Gia-cốp đã đánh lừa La-ban, người A-ram, bằng cách không cho ông biết rằng mình đang bỏ trốn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Gia-cốp đánh cắp lòng của La-ban, người A-ram”; đây là một thành ngữ Hê-bơ-rơ có nghĩa là ông đánh lừa La-ban hoặc khiến La-ban không kịp hay biết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת לֵב
  choice: đã đánh lừa
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “đánh cắp lòng”, nhưng trong ngữ cảnh là một thành ngữ chỉ việc hành động kín đáo để lừa hoặc khiến người khác không kịp hay biết. “Đánh lừa” truyền đạt rõ nghĩa thành ngữ mà không gây liên tưởng sai đến tình cảm.
- source_word: הָאֲרַמִּי
  choice: người A-ram
  rationale: Phản ánh trực tiếp danh xưng sắc tộc–địa lý trong tiếng Hê-bơ-rơ, chính xác hơn cách gọi truyền thống “người Sy-ri”.
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: bằng cách không cho ông biết
  rationale: 'Giữ được sắc thái phương thức/phương tiện của cấu trúc: Gia-cốp đánh lừa La-ban bằng việc không báo cho ông.'
- source_word: כִּי בֹרֵחַ הוּא
  choice: rằng mình đang bỏ trốn
  rationale: “Đang bỏ trốn” thể hiện tính tiếp diễn của phân từ בֹרֵחַ và sự ra đi kín đáo; đại từ phản thân “mình” chỉ rõ chủ thể là Gia-cốp trong tiếng Việt tự nhiên.
theological_decisions: []
