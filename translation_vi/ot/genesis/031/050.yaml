  terminology: Giữ «ngược đãi», «Đức Chúa Trời», và «chứng nhân» là phù hợp ngữ cảnh giao ước. Cặp xưng hô «ta/con» phù hợp lời La-ban nói với Gia-cốp trong bản dịch trang trọng hiện đại.
