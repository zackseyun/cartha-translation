  to: Nếu con ngược đãi các con gái ta, hoặc lấy thêm những người vợ khác ngoài các con gái ta—dù không có người nào ở cùng chúng ta[a]—thì kìa, Đức Chúa Trời là chứng nhân giữa ta và con.
