id: GEN.31.50
reference: Genesis 31:50
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: vi
  text: Nếu con ngược đãi các con gái ta, hoặc lấy thêm những người vợ khác ngoài các con gái ta—dù không có người nào ở cùng chúng ta[a]—thì kìa, Đức Chúa Trời là chứng nhân giữa ta và con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không có người nào ở cùng chúng ta”; ý nói không có nhân chứng là con người hiện diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: ngược đãi
  rationale: Thể Piel của ענה trong bối cảnh hôn nhân chỉ việc gây khổ hoặc đối xử tệ bạc; “ngược đãi” tự nhiên, rõ nghĩa và không gợi sai sang nghĩa “hạ mình”.
- source_word: בְּנֹתַי
  choice: các con gái ta
  rationale: Giữ rõ sở hữu và số nhiều; cụm từ được lặp lại hai lần theo nguyên văn để duy trì sự nhấn mạnh.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: cưới thêm vợ ngoài các con gái ta
  rationale: Thành ngữ “lấy vợ trên/ngoài các con gái ta” nói đến việc lấy thêm những người vợ khác, không phải thay thế các con gái của La-ban.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: dù không có người nào ở cùng chúng ta
  rationale: Trong ngữ cảnh, mệnh đề có sắc thái nhượng bộ và nhấn mạnh rằng không có nhân chứng phàm nhân hiện diện. “Người nào” truyền đạt nghĩa chỉ con người của אִישׁ một cách tự nhiên trong tiếng Việt.
- source_word: רְאֵה
  choice: hãy xem
  rationale: Giữ mệnh lệnh trực tiếp nhằm lưu ý Gia-cốp đến lời viện dẫn long trọng ngay sau đó.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong công thức giao ước này, אֱלֹהִים chỉ Đức Chúa Trời ở số ít, Đấng được viện dẫn làm chứng.
- source_word: עֵד
  choice: chứng nhân
  rationale: Danh từ vị ngữ trong công thức giao ước; “chứng nhân” tự nhiên và trang trọng trong tiếng Việt.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: giữa ta và con
  rationale: Diễn đạt quan hệ chịu trách nhiệm giao ước giữa La-ban và Gia-cốp; “ta/con” phù hợp quan hệ cha vợ với con rể và tránh lối xưng hô quá cổ.
theological_decisions:
- issue: Ý nghĩa chỉ con người của אִישׁ
  choice: không có người nào ở cùng chúng ta
  alternative: không có một người đàn ông nào ở cùng chúng ta
  rationale: Trọng tâm ngữ cảnh là không có nhân chứng phàm nhân hiện diện, chứ không phải giới tính của người vắng mặt. Cách dịch “người nào” giữ đúng ý nghĩa bao quát tự nhiên của אִישׁ trong câu mà không làm lu mờ sự đối chiếu với Đức Chúa Trời là chứng nhân.
- issue: Sắc thái của אֵין אִישׁ עִמָּנוּ
  choice: dù không có người nào ở cùng chúng ta
  alternative: không có người nào ở cùng chúng ta
  rationale: '“Dù” làm rõ quan hệ nhượng bộ hợp với ngữ cảnh: tuy không có nhân chứng con người, Đức Chúa Trời vẫn làm chứng. Chú thích bảo lưu cách đọc cú pháp trực tiếp hơn.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp xưng hô “ta/con” theo quan hệ La-ban—Gia-cốp; giữ cấu trúc điều kiện và lời viện dẫn chứng nhân long trọng của nguyên văn.
