base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: vi
  text: 'Bấy giờ Gia-cốp nổi giận và tranh cãi với La-ban. Gia-cốp đáp lời La-ban rằng: “Tôi đã phạm điều gì? Tôi có tội gì mà ông ráo riết đuổi theo tôi[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông đuổi theo tôi.” Động từ Hê-bơ-rơ gợi sự truy đuổi hăng hái hoặc quyết liệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: Bấy giờ Gia-cốp nổi giận
  rationale: Thành ngữ חרה + ל diễn tả cơn giận bùng lên nơi một người. “Nổi giận” tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái khởi phát.
- source_word: וַיָּרֶב בְּלָבָן
  choice: và tranh luận với La-ban
  rationale: ריב ở đây chỉ sự tranh chấp hay đối chất. “Tranh luận” giữ sắc thái đối kháng mà không mặc nhiên biến cuộc đối đáp thành lời quở trách.
- source_word: וַיַּעַן יַעֲקֹב וַיֹּאמֶר לְלָבָן
  choice: Gia-cốp đáp lời La-ban
  rationale: Cặp công thức “đáp và nói” trong lối kể Hê-bơ-rơ được chuyển tự nhiên sang tiếng Việt là “đáp lời”, tránh câu rườm rà mà vẫn giữ chức năng hồi đáp.
- source_word: מַה פִּשְׁעִי
  choice: Tôi đã phạm điều gì?
  rationale: פֶּשַׁע có sắc thái vi phạm hoặc phản nghịch. Trong lời tự biện trực tiếp, cách hỏi này tự nhiên, rõ nghĩa và vẫn giữ sắc thái quy trách nhiệm.
- source_word: מַה חַטָּאתִי
  choice: Tôi có tội gì?
  rationale: חַטָּאת chỉ tội hoặc lỗi phạm. “Có tội gì” giữ thuật ngữ thần học quen thuộc và tạo thế song song với câu hỏi trước.
- source_word: כִּי
  choice: mà
  rationale: 'כִּי liên kết hai câu hỏi với hành động bị chất vấn. “Mà” là cấu trúc hỏi nguyên nhân tự nhiên trong tiếng Việt: “có tội gì mà...”'
- source_word: דָלַקְתָּ אַחֲרָי
  choice: ông ráo riết đuổi theo tôi
  rationale: דלק theo nghĩa mở rộng diễn tả sự truy đuổi hăng hái, quyết liệt; “ráo riết đuổi theo” truyền đạt cường độ ấy bằng tiếng Việt tự nhiên mà không dùng hình ảnh “nóng/bốc cháy” gượng ép.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại; dùng đại từ “tôi—ông” phù hợp với lời Gia-cốp chất vấn La-ban. Tên riêng theo dạng phiên âm Kinh Thánh quen dùng. Dấu chân chú [a] được đặt ngay sau cụm từ mà chú thích giải thích.
