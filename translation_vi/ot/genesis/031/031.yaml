base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: vi
  text: 'Gia-cốp đáp lời La-ban: “Vì tôi sợ; tôi tự nhủ: ‘E rằng ông sẽ dùng vũ lực đem các con gái ông rời khỏi tôi.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: đáp lời
  rationale: Công thức Hê-bơ-rơ theo nghĩa đen là “đáp và nói”; tiếng Việt tự nhiên gói cả hai động từ trong “đáp lời” mà vẫn giữ chức năng đối đáp.
- source_word: כִּי יָרֵאתִי
  choice: Vì tôi sợ
  rationale: כִּי mang nghĩa nguyên nhân, còn יָרֵאתִי diễn tả nỗi sợ của Gia-cốp.
- source_word: כִּי אָמַרְתִּי
  choice: tôi tự nhủ
  rationale: אמרתי theo nghĩa đen là “tôi nói”, nhưng ở đây chỉ lời nói trong lòng; “tự nhủ” diễn đạt tự nhiên mà không làm thay đổi nội dung.
- source_word: פֶּן
  choice: E rằng
  rationale: Diễn tả điều Gia-cốp lo sợ có thể xảy ra, phù hợp sắc thái của פֶּן.
- source_word: תִּגְזֹל
  choice: dùng vũ lực cướp
  rationale: Động từ גזל chỉ hành vi chiếm đoạt hoặc giật lấy một cách sai trái, thường hàm ý cưỡng ép; cách dịch này giữ được sức mạnh của từ.
- source_word: בְּנוֹתֶיךָ מֵעִמִּי
  choice: các con gái ông khỏi tôi
  rationale: Giữ trực tiếp quan hệ “các con gái ông” và ý tách họ khỏi Gia-cốp; “khỏi tôi” trang trọng, rõ nghĩa trong văn cảnh.
