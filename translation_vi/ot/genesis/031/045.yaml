base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: vi
  text: Bấy giờ, Gia-cốp lấy một hòn đá và dựng nó lên làm trụ đá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đá đứng” hoặc “đá kỷ niệm”. Từ Hê-bơ-rơ מַצֵּבָה chỉ một khối đá được dựng lên làm dấu mốc hoặc trụ đá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Động từ לקח ở thể Qal trong mạch kể chuyện có nghĩa thông thường là “lấy”; cách dịch này tự nhiên và không thêm ý rằng ông nhặt đá lên.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אָבֶן
  choice: một hòn đá
  rationale: Danh từ số ít chỉ một viên đá; “một hòn đá” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: וַיְרִימֶהָ
  choice: dựng nó lên
  rationale: Động từ mang nghĩa nâng hoặc dựng lên; đại từ bổ ngữ giống cái số ít chỉ lại hòn đá. Trong ngữ cảnh lập một khối đá đứng, “dựng nó lên” vừa sát nghĩa vừa tự nhiên.
- source_word: מַצֵּבָה
  choice: làm trụ đá
  rationale: Danh từ chỉ một khối đá được dựng đứng làm cột hoặc dấu mốc. “Trụ đá” giữ trọng tâm ở hình thể và chức năng chung, không mặc nhiên xác định đây là vật thờ hay đài tưởng niệm.
theological_decisions:
- issue: Sắc thái của מַצֵּבָה, vốn có thể chỉ trụ đá mang chức năng tưởng niệm hoặc nghi lễ
  choice: trụ đá
  alternative: đá dựng đứng; đá kỷ niệm
  rationale: Câu này chỉ thuật lại việc dựng hòn đá, chưa nói rõ chức năng tôn giáo hay tưởng niệm. “Trụ đá” bảo toàn độ mở của nguyên văn và tránh đưa thêm một cách giải thích thần học.
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. “Bấy giờ” nối diễn tiến tự nhiên; “dựng nó lên làm trụ đá” phản ánh cấu trúc vị ngữ của nguyên văn mà không xác định quá mức công dụng của hòn đá.
