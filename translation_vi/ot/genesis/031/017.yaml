  yaml_path: translation/ot/genesis/031/017.yaml
  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: vi
  text: Bấy giờ, Gia-cốp đứng dậy, đặt các con trai và các người vợ của mình lên lạc đà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên lạc đà.” Giới từ Hê-bơ-rơ trong ngữ cảnh này có thể chỉ hướng đi lên hoặc vị trí ở trên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: đứng dậy
  rationale: Động từ קום ở thể kể chuyện tiếp nối diễn tiến, diễn tả Gia-cốp đứng lên để hành động. “Đứng dậy” tự nhiên trong tiếng Việt hiện đại và giữ rõ trình tự câu chuyện.
- source_word: וַיִּשָּׂא
  choice: đặt
  rationale: נשׂא có nghĩa cơ bản là “nâng, mang”, nhưng khi đi với עַל הַגְּמַלִּים, ý theo ngữ cảnh là đưa người lên lạc đà. “Đặt” diễn đạt tự nhiên hành động khiến họ ở trên lạc đà mà không thêm chi tiết ngoài nguyên văn.
- source_word: בָּנָיו
  choice: các con trai
  rationale: Danh từ בנים là dạng số nhiều giống đực; “các con trai” giữ chính xác đặc điểm giới tính của từ Hê-bơ-rơ.
- source_word: נָשָׁיו
  choice: các vợ mình
  rationale: Số nhiều của אִשָּׁה cùng hậu tố sở hữu chỉ rõ các người vợ của Gia-cốp. “Các vợ mình” là cách diễn đạt gọn, rõ trong tiếng Việt.
- source_word: עַל הַגְּמַלִּים
  choice: lên lạc đà
  rationale: Trong ngữ cảnh có chuyển động sau נשׂא, עַל có thể được hiểu là hướng “lên” hoặc vị trí “trên”. Bản chính dùng “lên” vì tự nhiên với động từ “đặt”, đồng thời chú thích giữ cách hiểu còn lại.
