  source_fidelity: 'Bản dịch phản ánh đúng mạch câu Hê-bơ-rơ: việc La-ban đã khám xét toàn bộ đồ đạc của Gia-cốp; lời thách thức hỏi đã tìm được vật nào thuộc tài sản nhà La-ban; yêu cầu đem vật đó ra trước những người của hai bên; và để họ phân xử vụ việc giữa hai người. “Lục soát” diễn đạt phù hợp sắc thái khám xét kỹ lưỡng của מִשַּׁשְׁתָּ. “Vật gì thuộc về nhà ông” truyền đạt tự nhiên ý phân xuất của מִכָּל־כְּלֵי בֵיתֶךָ mà không thu hẹp כְּלִי thành một loại vật dụng cụ thể.'
  naturalness: Tiếng Việt hiện đại, rõ nghĩa và giữ được sắc thái đối chất trang trọng. Đại từ “ông/tôi” nhất quán trong lời Gia-cốp nói với La-ban. “Hãy đặt nó ở đây trước mặt…” và “để họ phân xử giữa hai chúng ta” tự nhiên trong ngữ cảnh tranh chấp công khai.
  terminology: “Đồ đạc” và “vật” phù hợp cho כְּלִי trong bối cảnh tài sản di động. “Anh em” giữ cách gọi thân tộc của nguyên ngữ, đồng thời không loại trừ nét nghĩa rộng hơn là người bà con/người thuộc phe mỗi bên trong ngữ cảnh. “Phân xử” phản ánh tốt sắc thái pháp lý/trọng tài của וְיוֹכִיחוּ mà không áp đặt một thủ tục pháp đình cụ thể. Chú thích [a] được đặt đúng tại “lục soát” và giải thích chính xác lực nghĩa cụ thể của động từ.
