  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: vi
  text: Vì ông đã lục soát[a] tất cả đồ đạc của tôi, ông đã tìm thấy vật gì thuộc về nhà ông? Hãy đặt nó ở đây trước mặt anh em tôi và anh em ông, để họ phân xử giữa hai chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có nghĩa đen là “sờ, lần tay để tìm”, gợi một cuộc khám xét kỹ lưỡng.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: đã lục soát
  rationale: Động từ này có nghĩa cụ thể là sờ, lần tay để tìm; trong ngữ cảnh La-ban khám xét đồ đạc nhằm tìm vật bị lấy cắp, “lục soát” diễn đạt tự nhiên một cuộc tìm kiếm kỹ lưỡng và trực tiếp.
- source_word: כָּל כֵּלַי
  choice: tất cả đồ đạc của tôi
  rationale: כְּלִי có thể chỉ vật dụng, dụng cụ hoặc tài sản di động. “Đồ đạc” phù hợp với bối cảnh gia đình và bao quát hơn “bình, lọ” hay “dụng cụ”.
- source_word: מִכֹּל כְּלֵי בֵיתֶךָ
  choice: vật gì thuộc về nhà ông
  rationale: 'מִן mang nghĩa phân xuất trong câu hỏi: trong toàn bộ tài sản của nhà La-ban, đã tìm thấy được vật nào. Cách dịch này làm rõ quyền sở hữu mà không khiến câu tiếng Việt nặng nề.'
- source_word: שִׂים כֹּה נֶגֶד
  choice: Hãy đặt nó ở đây trước mặt
  rationale: Mệnh lệnh yêu cầu công khai đưa ra bất cứ vật nào bị cho là đã lấy cắp, ngay trước những người có mặt.
- source_word: אַחַי וְאַחֶיךָ
  choice: anh em tôi và anh em ông
  rationale: Giữ cách gọi thân tộc trực tiếp của tiếng Hê-bơ-rơ; trong ngữ cảnh, từ này cũng có thể bao gồm những người bà con hoặc người cùng phe đi theo mỗi bên.
- source_word: וְיוֹכִיחוּ
  choice: để họ phân xử
  rationale: 'Dạng Hiphil của יכח ở đây mang sắc thái pháp lý: xét và quyết định một vụ tranh chấp. “Phân xử” tự nhiên, trang trọng vừa phải và giữ đúng vai trò trọng tài của những người chứng kiến.'
- source_word: בֵּין שְׁנֵינוּ
  choice: giữa hai chúng ta
  rationale: Giữ rõ ý số đôi trong nguyên văn, nhấn mạnh cuộc tranh chấp giữa chính Gia-cốp và La-ban.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm nhưng dễ hiểu. Đại từ “ông/tôi” phù hợp với lời Gia-cốp đối chất trực tiếp với La-ban. Câu cuối dùng “phân xử” để thể hiện sắc thái trọng tài của động từ Hê-bơ-rơ mà không làm câu quá nặng tính pháp đình.
