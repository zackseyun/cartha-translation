  text: וַ/יְהִ֗י בְּ/עֵת֙ יַחֵ֣ם הַ/צֹּ֔אן וָ/אֶשָּׂ֥א עֵינַ֛/י וָ/אֵ֖רֶא בַּ/חֲל֑וֹם וְ/הִנֵּ֤ה הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: vi
  text: 'Vào mùa phối giống của đàn chiên dê, tôi ngước mắt lên và thấy trong giấc mơ: Kìa, những con dê đực đang nhảy phối giống với các con cái trong đàn đều có sọc[a], có đốm và loang lổ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “có khoang vòng”; từ Hê-bơ-rơ chỉ những dấu dạng dải hoặc vòng trên mình con vật.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “có màu loang” hoặc “lốm đốm”. Ba từ Hê-bơ-rơ ở đây dường như chỉ ba kiểu dấu màu khác nhau trên bộ lông.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Khi
  rationale: Diễn đạt tự nhiên khung thời gian của câu chuyện trong tiếng Việt; không cần chuyển máy móc công thức kể chuyện וַיְהִי thành một mệnh đề riêng.
- source_word: יַחֵם הַצֹּאן
  choice: bầy chiên dê giao phối
  rationale: יחם trong ngữ cảnh chăn nuôi chỉ thời kỳ động dục và phối giống. “Giao phối” rõ nghĩa, hiện đại; הַצֹּאן có thể bao gồm cả chiên lẫn dê nên dịch “bầy chiên dê” thay vì chỉ “bầy chiên”.
- source_word: וָאֶשָּׂא עֵינַי
  choice: tôi ngước mắt lên
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: và thấy trong giấc mơ
  rationale: Thể hiện giấc mơ là môi trường của điều Gia-cốp nhìn thấy, không áp đặt tính xác định không cần thiết.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Bảo toàn sắc thái trình hiện đột ngột, sống động của הִנֵּה.
- source_word: הָעַתֻּדִים
  choice: những con dê đực
  rationale: Chỉ rõ các dê đực dùng để phối giống, bằng cách nói thông dụng trong tiếng Việt hiện đại.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: đang nhảy lên bầy súc vật
  rationale: Giữ hình ảnh cụ thể của עלה על trong hành vi phối giống. “Bầy súc vật” ở lần nhắc lại giúp tránh cách hiểu dê đực nhảy lên cả tập thể như một khối, đồng thời vẫn bao quát הַצֹּאן.
- source_word: עֲקֻדִּים
  choice: có sọc
  rationale: Từ chỉ các dấu dạng dải hoặc vòng trên lông; “có sọc” dễ hiểu, còn khả năng “có khoang vòng” được ghi ở chú thích.
- source_word: נְקֻדִּים
  choice: có đốm
  rationale: Diễn tả các chấm hoặc đốm trên bộ lông và phân biệt được với kiểu màu loang ở từ kế tiếp.
- source_word: וּבְרֻדִּים
  choice: có vằn loang
  rationale: Diễn đạt bộ lông pha màu, loang lổ hoặc lốm đốm không đều; chú thích bảo lưu độ bất định của thuật ngữ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “Kìa” để giữ sức gợi thị giác của nguyên văn; dùng thuật ngữ sinh học trực tiếp nhưng không thô. Tất cả dấu chú thích [a], [b] đều có mặt trong chính văn.
