  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: vi
  text: 'Ra-chên và Lê-a đáp lời ông: “Chúng ta còn phần hay cơ nghiệp gì trong nhà cha chúng ta nữa không?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nhà cha chúng ta” có thể chỉ không chỉ căn nhà vật chất mà còn hộ gia đình hoặc gia sản của cha.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַרְנָה לֹו
  choice: đáp lời ông
  rationale: Hai động từ dẫn lời nói tạo thành một công thức phát ngôn; tiếng Việt tự nhiên có thể gộp thành “đáp lời ông”, vẫn giữ ý trả lời và đối tượng là Gia-cốp.
- source_word: רָחֵל וְלֵאָה
  choice: Ra-chên và Lê-a
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: הַעוֹד לָנוּ
  choice: liệu chúng ta còn ... gì nữa không?
  rationale: Cấu trúc nghi vấn với עוֹד hỏi xem quyền lợi ấy còn tồn tại hay không; cách diễn đạt này tự nhiên và giữ sắc thái thời gian.
- source_word: חֵלֶק וְנַחֲלָה
  choice: phần hay cơ nghiệp
  rationale: “Phần” chỉ phần được chia; “cơ nghiệp” chỉ tài sản hay quyền sở hữu được truyền lại. Liên từ được diễn đạt là “hay” trong câu hỏi tiếng Việt, không nhất thiết biến hai danh từ thành hai lựa chọn loại trừ nhau.
- source_word: בְּבֵית אָבִינוּ
  choice: trong nhà cha chúng ta
  rationale: Giữ hình ảnh “nhà” của nguyên văn, có thể bao gồm gia đình, gia sản và phạm vi thừa kế chứ không chỉ một căn nhà vật chất.
theological_decisions: []
