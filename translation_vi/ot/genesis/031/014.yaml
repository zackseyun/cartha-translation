  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đảo cụm “trong nhà cha chúng ta” lên đầu câu hỏi để câu tiếng Việt tự nhiên, đồng thời giữ nguyên phạm vi của cụm từ Hê-bơ-rơ.
