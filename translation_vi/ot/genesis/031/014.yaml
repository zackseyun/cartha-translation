  to: 'Ra-chên và Lê-a đáp lời ông: “Chúng ta còn phần hay cơ nghiệp gì trong nhà cha chúng ta nữa không?[a]”'
  rationale: Chỉnh sửa ghi chú để phản ánh phạm vi ngữ nghĩa của “nhà cha” một cách thận trọng hơn, tránh thêm khái niệm “dòng họ” và đồng nhất hóa với quyền thừa kế. Điều chỉnh nhẹ vị trí cụm giới từ giúp câu bám sát cấu trúc bổ nghĩa của nguyên văn mà vẫn tự nhiên.
