  text: הֲ/ל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖/וֹ כִּ֣י מְכָרָ֑/נוּ וַ/יֹּ֥אכַל גַּם אָכ֖וֹל אֶת כַּסְפֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: vi
  text: Chẳng phải cha coi chúng ta như người ngoài sao? Vì cha đã bán chúng ta, lại còn ăn hết cả tiền của chúng ta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lại còn ăn sạch cả bạc của chúng ta.” Tiếng Hê-bơ-rơ dùng thành ngữ “ăn” cùng một cấu trúc nhấn mạnh để diễn tả việc tiêu dùng hết hoàn toàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Chẳng phải ... sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ mong đợi câu trả lời khẳng định.
- source_word: נָכְרִיּוֹת
  choice: người ngoài
  rationale: Trong ngữ cảnh gia đình, từ này chỉ những người bị xem là xa lạ, không còn thuộc về gia đình; “người ngoài” tự nhiên hơn “người ngoại quốc”.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: cha coi chúng ta như
  rationale: Giữ ý nghĩa “bị xem là” của thể Niphal nhưng chuyển sang cấu trúc chủ động tự nhiên trong tiếng Việt; đại từ “cha” làm rõ người được nói đến từ ngữ cảnh.
- source_word: כִּי
  choice: Vì
  rationale: Giới thiệu lý do cho lời khẳng định hàm ý trong câu hỏi tu từ.
- source_word: מְכָרָנוּ
  choice: cha đã bán chúng ta
  rationale: Phản ánh hành động đã hoàn tất và lời tố cáo trực tiếp của hai người con gái.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: lại còn ăn hết cả
  rationale: Giữ hình ảnh “ăn” của nguyên văn, đồng thời dùng “lại còn” và “hết cả” để chuyển tải sắc thái nhấn mạnh của גַּם cùng động từ nguyên thể tuyệt đối.
- source_word: אֶת כַּסְפֵּנוּ
  choice: tiền của chúng ta
  rationale: כֶּסֶף có thể là “bạc” hoặc “tiền”; trong lời than phiền về tài sản và sính lễ, “tiền” rõ và tự nhiên hơn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cha” thay cho đại từ ngôi ba để lời của hai chị em tự nhiên trong tiếng Việt; giữ phép ẩn dụ “ăn” của tiếng Hê-bơ-rơ và giải thích trong chú thích.
