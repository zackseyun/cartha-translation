base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: vi
  text: 'La-ban nói: “Hôm nay, đống đá này là chứng nhân giữa tôi và ông.” Vì thế, ông gọi nó là Ga-lê-ết.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ga-lê-ết là dạng phiên âm của tên Hê-bơ-rơ có nghĩa là “đống đá của chứng nhân.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָבָן
  choice: La-ban nói
  rationale: Dùng lối kể chuyện tự nhiên trong tiếng Việt; tên riêng được phiên âm theo cách quen thuộc.
- source_word: הַגַּל הַזֶּה
  choice: đống đá này
  rationale: גַּל chỉ một đống, trong ngữ cảnh là đống đá; thêm “đá” làm rõ vật liệu đã được nêu trong mạch truyện.
- source_word: עֵד
  choice: làm chứng
  rationale: Diễn đạt tự nhiên chức năng chứng nhận của đống đá, đồng thời giữ sắc thái pháp lý-giao ước.
- source_word: בֵּינִי וּבֵינְךָ
  choice: giữa tôi và ông
  rationale: Giữ cách nêu trực tiếp cả hai bên của nguyên văn; “ông” phù hợp với lời nói giữa hai người trưởng thành.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Tương đương hiện đại, rõ nghĩa với trạng từ thời gian trong tiếng Hê-bơ-rơ.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Giữ quan hệ nhân quả trong công thức giải thích việc đặt tên.
- source_word: קָרָא שְׁמוֹ
  choice: ông gọi nó là
  rationale: Chủ ngữ ngầm là La-ban; cách nói này tự nhiên hơn trong tiếng Việt so với dịch sát “gọi tên nó”.
- source_word: גַּלְעֵד
  choice: Ga-lê-ết
  rationale: Phiên âm địa danh/tên gọi thay vì dịch nghĩa trong chính văn; lối chơi chữ được giải thích ở chú thích.
