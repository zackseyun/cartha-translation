base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: vi
  text: Ông đem theo những người bà con[a], đuổi theo Gia-cốp một quãng đường bảy ngày, rồi bắt kịp ông tại miền đồi núi Ga-la-át[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các anh em của mình”; từ Hê-bơ-rơ này có thể chỉ anh em theo nghĩa hẹp hoặc bà con, họ hàng theo nghĩa rộng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tại Núi Ga-la-át”; từ Hê-bơ-rơ có thể chỉ một ngọn núi cụ thể hoặc miền đồi núi Ga-la-át.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: những người bà con
  rationale: Danh từ אָח có thể chỉ anh em ruột hoặc rộng hơn là người cùng họ hàng; trong ngữ cảnh La-ban tập hợp người trong gia tộc, cách dịch này tự nhiên và không thu hẹp nghĩa.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: đuổi theo Gia-cốp
  rationale: Động từ רדף cùng giới từ אַחַר diễn tả việc truy đuổi phía sau. Nêu tên Gia-cốp giúp tiếng Việt tránh chuỗi đại từ nam giới mơ hồ mà không thêm nội dung mới.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: suốt chặng đường bảy ngày
  rationale: דֶּרֶךְ ở đây chỉ hành trình hoặc quãng đường, còn cụm bảy ngày cho biết mức độ kéo dài; cách dịch giữ sắc thái hành trình và vẫn tự nhiên trong tiếng Việt.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: bắt kịp ông
  rationale: Trong bối cảnh truy đuổi, דבק diễn tả việc đuổi tới và bắt kịp, chứ không mang nghĩa đen là bám dính.
- source_word: בְּהַר הַגִּלְעָד
  choice: tại miền đồi núi Ga-la-át
  rationale: הַר có thể chỉ một ngọn núi hoặc vùng núi/đồi núi. Ngữ cảnh địa lý phù hợp với nghĩa khu vực, nhưng chú thích vẫn bảo lưu khả năng chỉ Núi Ga-la-át.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, tự nhiên trong tiếng Việt hiện đại. Dùng tên riêng “Gia-cốp” để phân biệt đối tượng bị đuổi theo với La-ban; các đại từ còn lại được giữ rõ theo mạch văn. Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
