source:
  edition: WLC
  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: vi
  text: “Xin Đức Chúa Trời của Áp-ra-ham và thần của Na-hô, là thần của cha họ, phân xử giữa chúng ta.”[a] Rồi Gia-cốp lấy Đấng Khiếp Sợ của cha mình là Y-sác mà thề.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin Đức Chúa Trời của Áp-ra-ham và Đức Chúa Trời của Na-hô, là Đức Chúa Trời của cha họ, phân xử giữa chúng ta.” Tiếng Hê-bơ-rơ có thể được hiểu là cùng một Đức Chúa Trời xuyên suốt câu; bản dịch chính giữ lại khả năng phân biệt trong lời viện dẫn.'
    reason: alternative_reading
  - marker: b
    text: “Đấng Khiếp Sợ của cha mình là Y-sác” là một danh xưng khác thường dành cho Đức Chúa Trời; nguyên văn dùng danh từ có nghĩa là “sự khiếp sợ” hoặc “nỗi kinh hãi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: Đức Chúa Trời của Áp-ra-ham
  rationale: Cụm số nhiều về hình thái được dùng theo nghĩa số ít để chỉ Đức Chúa Trời của Áp-ra-ham; cách viết hoa thể hiện danh xưng thần linh trong tiếng Việt.
- source_word: וֵאלֹהֵי נָחוֹר
  choice: thần của Na-hô
  rationale: Dùng “thần” viết thường để không vội đồng nhất vị thần được gắn với Na-hô với Đức Chúa Trời mà Gia-cốp tuyên xưng, đồng thời giữ lại sức căng của lời khấn.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: là thần của cha họ
  rationale: Hiểu như cụm đồng vị làm rõ lời viện dẫn trước đó; thêm “là” giúp câu tiếng Việt tự nhiên nhưng không loại bỏ khả năng cụm này chỉ cùng một thần linh.
- source_word: יִשְׁפְּטוּ
  choice: xin ... phân xử
  rationale: Thể chưa hoàn thành ngôi ba số nhiều trong lời viện dẫn mang sắc thái cầu chúc; “phân xử” phù hợp với việc một thần linh làm trọng tài giữa hai bên.
- source_word: בֵינֵינוּ
  choice: giữa chúng ta
  rationale: Chuyển trực tiếp cụm chỉ quan hệ tương hỗ trong bối cảnh giao ước.
- source_word: וַיִּשָּׁבַע
  choice: Rồi ... thề
  rationale: Diễn đạt diễn tiến tự sự nối tiếp một cách tự nhiên trong tiếng Việt.
- source_word: בְּפַחַד
  choice: lấy Đấng Khiếp Sợ ... mà thề
  rationale: Giữ danh từ bất thường “khiếp sợ/kinh hãi” như một danh xưng thần linh; “lấy ... mà thề” là công thức tuyên thệ tự nhiên trong tiếng Việt.
- source_word: אָבִיו יִצְחָק
  choice: của cha mình là Y-sác
  rationale: Làm rõ Y-sác là cha của Gia-cốp; đại từ phản thân “mình” tự nhiên và tránh nhầm chủ thể.
theological_decisions:
- issue: Có nên đồng nhất tất cả các danh xưng thần linh trong lời của La-ban bằng cách viết hoa đồng loạt hay không
  choice: Viết “Đức Chúa Trời của Áp-ra-ham” nhưng “thần của Na-hô, là thần của cha họ”.
  alternative: “Đức Chúa Trời của Áp-ra-ham và Đức Chúa Trời của Na-hô, là Đức Chúa Trời của cha họ”.
  rationale: Tiếng Hê-bơ-rơ cho phép hiểu là cùng một Đức Chúa Trời, nhưng động từ số nhiều và lời viện dẫn mang tính gia tộc cũng để ngỏ sự phân biệt. Cách viết khác nhau giữ lại sự mơ hồ và sức căng thần học thay vì hài hòa hóa.
- issue: Cách chuyển danh xưng בְּפַחַד אָבִיו יִצְחָק
  choice: “lấy Đấng Khiếp Sợ của cha mình là Y-sác mà thề”
  alternative: “nhân danh Đức Chúa Trời mà cha mình là Y-sác kính sợ để thề”
  rationale: Nguyên văn dùng chính danh từ “sự khiếp sợ/nỗi kinh hãi” như một danh xưng. Giữ cách nói khác thường tránh diễn giải danh xưng thành một mệnh đề thần học rõ nghĩa hơn nguyên bản.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc. Lời nói trực tiếp được đặt trong ngoặc kép; danh xưng bất thường “Đấng Khiếp Sợ” được giữ nguyên sức nặng thay vì giải nghĩa ngay trong câu.
