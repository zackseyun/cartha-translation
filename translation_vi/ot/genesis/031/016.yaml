source:
  edition: WLC
  text: כִּ֣י כָל הָ/עֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽ/אָבִ֔י/נוּ לָ֥/נוּ ה֖וּא וּ/לְ/בָנֵ֑י/נוּ וְ/עַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖י/ךָ עֲשֵֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: vi
  text: Vì tất cả của cải mà Đức Chúa Trời đã lấy[a] khỏi cha chúng ta đều thuộc về chúng ta và con cái chúng ta. Vậy bây giờ, anh hãy làm mọi điều Đức Chúa Trời đã phán với anh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã giải cứu” hoặc “đã giải thoát”. Động từ Hê-bơ-rơ thường mang nghĩa giải cứu, nhưng ở đây nói đến việc Đức Chúa Trời lấy của cải khỏi La-ban và ban cho gia đình Gia-cốp.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: 'Giữ chức năng giải thích: câu này nêu lý do Ra-chên và Lê-a đồng ý với Gia-cốp.'
- source_word: כָל הָעֹשֶׁר
  choice: tất cả của cải
  rationale: עֹשֶׁר chỉ sự giàu có, tài sản; “của cải” tự nhiên trong tiếng Việt và phù hợp với đàn súc vật cùng tài sản trong văn cảnh.
- source_word: הִצִּיל
  choice: đã lấy
  rationale: Động từ thường mang nghĩa “giải cứu/giải thoát”, nhưng ở đây đối tượng là của cải được Đức Chúa Trời đưa khỏi tay La-ban và chuyển sang gia đình Gia-cốp. “Đã lấy” diễn đạt trực tiếp sự chuyển khỏi nguồn sở hữu cũ mà không thêm sắc thái bạo lực.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi tiêu chuẩn, trang trọng và dễ hiểu đối với אֱלֹהִים khi chỉ Đức Chúa Trời trong trình thuật này.
- source_word: מֵאָבִינוּ
  choice: từ cha chúng ta
  rationale: Giới từ מן chỉ nguồn xuất phát; cách dịch trực tiếp giữ nguyên quan hệ gia đình trong lời của hai chị em.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: đều thuộc về chúng ta và con cái chúng ta
  rationale: Diễn đạt rõ ý sở hữu hoặc quyền hưởng vốn được cấu trúc tiếng Hê-bơ-rơ hàm ý.
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Đánh dấu bước chuyển có tính suy luận từ lý do sang lời khuyên.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: mọi điều Đức Chúa Trời đã phán với anh
  rationale: Giữ ý toàn thể của כֹּל אֲשֶׁר; “phán” phù hợp với lời Đức Chúa Trời, còn “anh” phản ánh lời hai người vợ nói trực tiếp với Gia-cốp.
- source_word: עֲשֵׂה
  choice: hãy làm
  rationale: Giữ mệnh lệnh ngắn gọn của nguyên văn; đối tượng của hành động đã được nêu ở mệnh đề trước.
theological_decisions:
- issue: Hành động của Đức Chúa Trời đối với của cải của La-ban
  choice: Dịch là “đã lấy” và ghi chú nghĩa từ vựng “giải cứu/giải thoát”.
  alternative: “đã giải cứu” hoặc “đã giải thoát”
  rationale: Trong câu này, của cải là đối tượng được chuyển khỏi La-ban sang gia đình Gia-cốp. “Đã lấy” phù hợp với tác dụng ngữ cảnh, còn chú thích bảo tồn trường nghĩa giải cứu thực sự có trong động từ Hê-bơ-rơ, tránh biến lựa chọn ngữ cảnh thành một khẳng định giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh” tự nhiên vì Ra-chên và Lê-a đang cùng nói với chồng là Gia-cốp. Dấu chú thích được đặt ngay sau từ ngữ mà chú thích giải thích.
