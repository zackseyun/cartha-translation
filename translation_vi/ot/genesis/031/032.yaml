  text: עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת אֱלֹהֶי/ךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧י/נוּ הַֽכֶּר לְ/ךָ֛ מָ֥ה עִמָּדִ֖/י וְ/קַֽח לָ֑/ךְ וְ/לֹֽא יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: vi
  text: “Người nào mà ông tìm thấy có các thần của ông thì người ấy sẽ không sống.[a] Trước mặt anh em chúng ta,[b] hãy xác định vật gì của ông đang ở với tôi, rồi lấy về.” Gia-cốp không biết rằng Ra-chên đã lấy trộm các thần ấy.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Người mà ông tìm thấy các thần của ông ở cùng.”'
    reason: lexical_alternative
  - marker: b
    text: “Anh em” ở đây có thể chỉ nhóm bà con hoặc thân tộc nam giới có mặt, chứ không nhất thiết chỉ là anh em ruột.
    reason: cultural_note
  - marker: c
    text: Đây là các thần gia đình của La-ban mà Ra-chên đã lấy trộm.
    reason: contextual_note
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: Người nào bị ông tìm thấy đang giữ
  rationale: Giữ cấu trúc chủ động của động từ ngôi hai số ít, trong khi diễn đạt tự nhiên mệnh đề quan hệ bất định và ý nghĩa sở hữu trong ngữ cảnh.
- source_word: אֱלֹהֶיךָ
  choice: các thần của ông
  rationale: Dịch trực tiếp danh từ số nhiều và hậu tố sở hữu; không đưa từ 'thần tượng gia đình' vào chính văn vì câu này không dùng תְּרָפִים.
- source_word: לֹא יִחְיֶה
  choice: sẽ không được sống
  rationale: Bảo tồn sức nặng của lời tuyên bố án chết hoặc lời nguyền mà không quyết định dứt khoát đó là mệnh lệnh pháp lý hay dự báo.
- source_word: נֶגֶד אַחֵינוּ
  choice: Trước mặt anh em chúng ta
  rationale: Diễn đạt tự nhiên ý 'trước mặt, trước sự chứng kiến'; giữ từ 'anh em' của nguyên văn, dù ở đây có thể chỉ bà con nam giới theo nghĩa rộng.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: hãy nhận ra vật nào của ông đang ở chỗ tôi
  rationale: Làm rõ ý sở hữu được ngữ cảnh hàm chứa, nhưng vẫn giữ động từ 'nhận ra' và lời thách thức Laban xác định tài sản của mình.
- source_word: וְקַח לָךְ
  choice: rồi lấy về
  rationale: Tiếng Việt tự nhiên dùng 'lấy về' để chuyển tải hành động lấy lại cho mình; liên từ được thể hiện bằng 'rồi'.
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: Gia-cốp không biết
  rationale: Lời xen giải thích của người kể chuyện được dịch trực tiếp; không cần giữ liên từ mở đầu trong tiếng Việt.
- source_word: גְּנָבָתַם
  choice: đã lấy trộm các thần ấy
  rationale: Dùng 'đã' để chỉ hành động xảy ra trước lời nói; lặp lại đối tượng thay vì đại từ 'chúng' để rõ nghĩa và tự nhiên.
theological_decisions:
- issue: Bản chất của לֹא יִחְיֶה
  choice: sẽ không được sống
  alternative: người ấy phải chết / người ấy sẽ không sống
  rationale: Cách dịch này giữ sự căng thẳng giữa lời nguyền, lời tuyên án và tuyên bố hậu quả, không áp đặt một cách hiểu thần học hoặc pháp lý duy nhất.
- issue: Cách gọi אֱלֹהֶיךָ
  choice: các thần của ông
  alternative: các tượng thần gia đình của ông
  rationale: Giữ nguyên cách gọi của nhân vật trong câu, không tự ý hạ cấp thành 'tượng' hay giải thích đó là tê-ra-phim trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cách xưng hô 'ông/tôi' phù hợp cuộc đối chất giữa Gia-cốp và La-ban; bảo tồn cách gọi 'các thần' và sự mơ hồ về hiệu lực của lời 'không được sống'.
