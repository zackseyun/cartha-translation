    rationale: בַּיּוֹם הַשְּׁלִישִׁי nghĩa cơ bản là “vào/ngày thứ ba”; “Vào ngày thứ ba” tránh sắc thái diễn tiến có thể có ở “Đến ngày thứ ba.”
  - severity: low
    issue: “La-ban được báo rằng” hơi lược và kém tự nhiên trong văn xuôi tiếng Việt.
    rationale: “La-ban được báo tin rằng” vẫn bảo toàn bị động và chủ thể không xác định của וַיֻּגַּד, đồng thời tạo câu tiếng Việt trôi chảy hơn.
