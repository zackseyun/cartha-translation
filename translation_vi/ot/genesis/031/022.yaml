translation:
  language: vi
  text: Vào ngày thứ ba, La-ban được báo tin rằng Gia-cốp đã trốn đi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: được báo
  rationale: Dạng Hofal diễn tả việc thông tin được truyền đến La-ban theo thể bị động; “được báo” tự nhiên trong tiếng Việt và không thêm chủ thể không được nêu.
- source_word: לְלָבָן
  choice: La-ban
  rationale: Giới từ לְ đánh dấu người tiếp nhận tin; cấu trúc tiếng Việt tự nhiên là “La-ban được báo”.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Đến ngày thứ ba
  rationale: Cụm từ chỉ thời gian là “vào/đến ngày thứ ba”. Trong mạch kể chuyện, “Đến ngày thứ ba” diễn đạt tự nhiên sự tiếp nối mà không xác định thêm một mốc thời gian ngoài nguyên văn.
- source_word: כִּי
  choice: rằng
  rationale: Ở đây כִּי dẫn nội dung của tin được báo, nên “rằng” là từ nối thích hợp.
- source_word: בָרַח
  choice: đã trốn đi
  rationale: Động từ ברח chỉ việc bỏ trốn hoặc chạy trốn. “Đã trốn đi” vừa tự nhiên vừa cho thấy hành động xảy ra trước lúc La-ban nhận tin.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
