  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của tiếng Hê-bơ-rơ: quãng hai mươi năm, chiên cái và dê cái, việc không mất thai/mất con, và Gia-cốp không ăn chiên đực của đàn La-ban. Tuy nhiên, cách nói bị động “các chiên cái và dê cái ... không bị sẩy thai” chưa tự nhiên trong tiếng Việt; động vật là chủ thể của hành động này. Bản sửa dùng “không con nào sẩy thai,” đồng thời giữ chú thích để bảo toàn nghĩa rộng hơn là mất con non.'
