  terminology: “Chiên cái,” “dê cái,” và “chiên đực” phản ánh đúng tính đặc thù giới tính của רְחֵלִים, עִזִּים, và אֵילִים. Cách xưng hô “tôi/ông” phù hợp ngữ cảnh Gia-cốp trực tiếp nói với La-ban.
  issues:
