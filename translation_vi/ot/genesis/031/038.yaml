base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: vi
  text: Suốt hai mươi năm qua, tôi đã ở với ông; chiên cái và dê cái của ông không con nào sẩy thai[a], còn chiên đực trong bầy của ông thì tôi không hề ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không bị mất con”. Động từ Hê-bơ-rơ có thể chỉ việc bị mất con; trong bối cảnh chăn nuôi ở đây, từ này nói đến sẩy thai hoặc mất con non.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: Suốt hai mươi năm nay
  rationale: Diễn đạt tự nhiên thành ngữ chỉ quãng thời gian kéo dài đến lúc nói, đồng thời giữ sắc thái nhấn mạnh của đại từ chỉ định זֶה.
- source_word: אָנֹכִי עִמָּךְ
  choice: tôi đã ở với ông
  rationale: Mệnh đề Hê-bơ-rơ không có động từ hữu hạn nhưng theo ngữ cảnh tóm lược hai mươi năm Gia-cốp ở và phục vụ La-ban; tiếng Việt cần bổ sung “đã ở” cho rõ và tự nhiên.
- source_word: רְחֵלֶיךָ
  choice: các chiên cái của ông
  rationale: רְחֵלִים chỉ riêng chiên cái; cách dịch này giữ đúng nét nghĩa về giới tính và dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְעִזֶּיךָ
  choice: dê cái của ông
  rationale: Danh từ trong ngữ cảnh chỉ dê cái; cách dịch trực tiếp, tự nhiên và bảo toàn tính cụ thể của nguyên văn.
- source_word: לֹא שִׁכֵּלוּ
  choice: không bị sẩy thai
  rationale: Động từ có nghĩa bị mất con hoặc mất thai; trong bối cảnh chăn nuôi, “sẩy thai” là cách diễn đạt ngắn gọn và phù hợp nhất, còn nghĩa rộng hơn được ghi ở chú thích.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: chiên đực trong bầy của ông
  rationale: אֵילִים là chiên đực trưởng thành; “chiên đực” thông dụng và dễ hiểu hơn “cừu đực” trong văn cảnh đã dùng “chiên”, còn cụm “trong bầy” giữ quan hệ với צֹאן.
- source_word: לֹא אָכָלְתִּי
  choice: tôi không hề ăn
  rationale: “Không hề” làm rõ lời khẳng định hồi tưởng về cách Gia-cốp cư xử trong suốt thời gian ấy mà không thêm nội dung ngoài nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” phù hợp lời Gia-cốp nói trực tiếp với La-ban; giữ cách gọi cụ thể “chiên cái”, “dê cái”, “chiên đực”. Cấu trúc “còn... thì” tạo thế đối ứng tự nhiên giữa sự sinh sản của đàn cái và việc Gia-cốp không ăn chiên đực.
