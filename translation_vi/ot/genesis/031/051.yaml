base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: vi
  text: 'Rồi La-ban nói với Gia-cốp: “Hãy xem đống đá này[a], và hãy xem trụ đá[b] mà tôi đã dựng lên giữa tôi và ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gò đá.” Từ Hê-bơ-rơ chỉ đống đá được chất lên làm chứng giữa La-ban và Gia-cốp.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tảng đá dựng đứng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Dạng waw liên tiếp đưa câu chuyện tiến sang hành động kế tiếp; “Rồi” tự nhiên trong tiếng Việt hiện đại và giữ được trình tự tường thuật.
- source_word: הִנֵּה ... וְהִנֵּה
  choice: Hãy xem ... và hãy xem
  rationale: Hai lần הִנֵּה cùng hướng sự chú ý vào các vật trước mặt; lặp lại “hãy xem” để giữ cấu trúc song song và sắc thái chỉ thị.
- source_word: הַגַּל הַזֶּה
  choice: đống đá này
  rationale: Trong ngữ cảnh, גַּל là đống đá được chất lên làm chứng. “Đống đá” diễn đạt rõ vật liệu và tự nhiên hơn cách gọi chung chung “gò”.
- source_word: הַמַּצֵּבָה
  choice: trụ đá
  rationale: מַצֵּבָה chỉ một tảng đá được dựng đứng làm dấu; “trụ đá” ngắn gọn, rõ nghĩa và phù hợp ngữ cảnh.
- source_word: יָרִיתִי
  choice: tôi đã dựng lên
  rationale: Với đối tượng là מַצֵּבָה, động từ ở đây diễn tả việc đặt hoặc dựng vật làm mốc; “đã dựng lên” vừa tự nhiên vừa giữ ý hành động đã hoàn tất.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: giữa tôi và ông
  rationale: Giữ nguyên quan hệ “giữa tôi và anh/ngươi”; “tôi ... ông” là cách xưng hô hiện đại, trang trọng vừa phải và không tự ý áp đặt quan hệ gia trưởng vào đại từ Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Phép lặp “hãy xem” bảo toàn điểm nhấn song song của nguyên văn; các tên riêng dùng dạng quen thuộc La-ban và Gia-cốp.
