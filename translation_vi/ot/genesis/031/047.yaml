base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/047.yaml
  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: vi
  text: La-ban gọi nó là Yê-ga Sa-ha-đu-tha[a], còn Gia-cốp gọi nó là Ga-lê-ết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yê-ga Sa-ha-đu-tha là tiếng A-ram, nghĩa là “đống đá làm chứng.”
    reason: lexical_alternative
  - marker: b
    text: Ga-lê-ết là tiếng Hê-bơ-rơ, nghĩa là “đống đá làm chứng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ל֣וֹ
  choice: gọi nó là
  rationale: Trong ngữ cảnh đặt tên, קרא kết hợp với ל và đại từ hậu tố mang nghĩa “gọi/đặt tên là.” “Gọi nó là” tự nhiên trong tiếng Việt và cho thấy tên được đặt cho đống đá.
- source_word: לָבָן
  choice: La-ban
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: Yê-ga Sa-ha-đu-tha
  rationale: Giữ tên gọi tiếng A-ram trong chính văn để bảo toàn hành động đặt tên và sự đối chiếu ngôn ngữ; nghĩa của tên được nêu trong chú thích.
- source_word: וְיַעֲקֹב
  choice: còn Gia-cốp
  rationale: Liên từ ו ở đây nối hai mệnh đề đồng thời tạo thế đối chiếu giữa tên tiếng A-ram của La-ban và tên tiếng Hê-bơ-rơ của Gia-cốp. “Còn” diễn đạt sự đối chiếu tự nhiên mà không làm sắc thái mạnh như “nhưng.”
- source_word: קָרָא ל֖וֹ
  choice: gọi nó là
  rationale: Giữ cách diễn đạt nhất quán với vế đầu; đại từ chỉ đống đá nên tiếng Việt dùng “nó.”
- source_word: גַּלְעֵד
  choice: Ga-lê-ết
  rationale: Giữ tên gọi tiếng Hê-bơ-rơ trong chính văn; nghĩa tương ứng với tên tiếng A-ram được giải thích ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Hai tên được phiên âm thay vì dịch ngay trong chính văn nhằm giữ sự đối chiếu giữa tiếng A-ram và tiếng Hê-bơ-rơ; dùng “còn” để thể hiện tương phản nhẹ giữa hai cách gọi.
