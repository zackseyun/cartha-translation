base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: vi
  text: 'Bấy giờ, thiên sứ của Đức Chúa Trời nói với tôi trong giấc mơ[a]: “Gia-cốp!” Tôi đáp: “Tôi đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một giấc mơ.” Tiếng Hê-bơ-rơ dùng dạng xác định: “trong giấc mơ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... phán
  rationale: Động từ wayyiqtol tiếp nối diễn tiến câu chuyện; “Bấy giờ” tự nhiên trong tiếng Việt. Dùng “phán” vì chủ thể là thiên sứ của Đức Chúa Trời đang truyền lời trong khải tượng.
- source_word: אֵלַי
  choice: với tôi
  rationale: Diễn đạt tự nhiên giới từ אֶל kèm hậu tố ngôi thứ nhất số ít trong cấu trúc nói với một người.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: thiên sứ của Đức Chúa Trời
  rationale: מַלְאָךְ có thể là “sứ giả” hoặc “thiên sứ”; trong bối cảnh này là một hữu thể từ trời. Cách dịch giữ nguyên danh xưng của câu mà không quyết định thêm về căn tính thần học của vị ấy.
- source_word: בַּחֲלוֹם
  choice: trong giấc mơ
  rationale: Tiếng Hê-bơ-rơ có mạo từ xác định, nhưng tiếng Việt không có mạo từ tương ứng bắt buộc; “trong giấc mơ” vừa tự nhiên vừa có thể chỉ giấc mơ đang được thuật lại.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: וָאֹמַר
  choice: Tôi thưa
  rationale: Wayyiqtol ngôi thứ nhất tiếp nối lời đáp. “Thưa” thể hiện tự nhiên lời đáp kính trọng trong tiếng Việt mà không thêm nội dung.
- source_word: הִנֵּנִי
  choice: Có con đây
  rationale: Công thức Hê-bơ-rơ biểu thị sự hiện diện và sẵn sàng đáp lời. “Có con đây” là lời đáp tự nhiên, phù hợp với đại từ kính trọng đã chọn trong tiếng Việt.
theological_decisions:
- issue: Cách dịch מַלְאַךְ הָאֱלֹהִים trong văn cảnh có thể gợi câu hỏi về mối liên hệ giữa thiên sứ và chính Đức Chúa Trời
  choice: thiên sứ của Đức Chúa Trời
  alternative: sứ giả của Đức Chúa Trời
  rationale: Câu này gọi nhân vật là מַלְאַךְ הָאֱלֹהִים nhưng không tự giải quyết căn tính sâu hơn của vị ấy. Bản dịch giữ danh xưng đó, không đồng nhất vị ấy với Đức Chúa Trời cũng không phủ nhận khả năng văn mạch rộng hơn tạo nên sự căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán/thưa” tạo sắc thái kính trọng quen thuộc trong tiếng Việt; “Có con đây” chuyển tải tự nhiên công thức đáp lời הִנֵּנִי. Dấu [a] được đặt ngay sau cụm từ liên quan.
