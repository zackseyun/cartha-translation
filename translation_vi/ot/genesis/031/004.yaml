  rationale: Sửa để không thêm một người được sai đi, không áp đặt quan hệ nhân quả ở đầu câu, và dùng thuật ngữ tự nhiên hơn cho đàn gia súc nhỏ. Cấu trúc “ra đồng, đến chỗ...” vẫn phản ánh hai cụm chỉ hướng/địa điểm liên tiếp trong nguyên văn mà không làm rõ quá mức quan hệ chính xác giữa chúng.
