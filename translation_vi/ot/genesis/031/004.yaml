  text: Gia-cốp sai gọi Ra-chên và Lê-a ra đồng, đến chỗ đàn chiên của mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sai người
  rationale: Động từ diễn tả việc Gia-cốp phái người đi; trong ngữ cảnh gọi hai người đến, “sai người” tự nhiên và không hàm ý ông tự đi.
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: קרא với לְ chỉ việc gọi người đến; “gọi” giữ được lối kể đơn giản, còn “triệu tập” trang trọng quá mức.
- source_word: לְרָחֵל וּלְלֵאָה
  choice: Ra-chên và Lê-a
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: הַשָּׂדֶה
  choice: ra ngoài đồng
  rationale: שׂדה chỉ đồng ruộng hay vùng đất trống; “ra ngoài đồng” diễn đạt tự nhiên hướng chuyển động trong câu.
- source_word: אֶל צֹאנוֹ
  choice: đến chỗ đàn gia súc của mình
  rationale: Cụm từ theo sát nghĩa là “đến đàn vật nuôi của ông”; trong tiếng Việt, thêm “chỗ” làm rõ đây là địa điểm cụ thể ngoài đồng mà không thay đổi nội dung.
