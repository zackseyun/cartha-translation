  text: יֶשׁ לְ/אֵ֣ל יָדִ֔/י לַ/עֲשׂ֥וֹת עִמָּ/כֶ֖ם רָ֑ע וֵֽ/אלֹהֵ֨י אֲבִי/כֶ֜ם אֶ֣מֶשׁ אָמַ֧ר אֵלַ֣/י לֵ/אמֹ֗ר הִשָּׁ֧מֶר לְ/ךָ֛ מִ/דַּבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: vi
  text: 'Ta đủ sức làm hại các ngươi, nhưng đêm qua Đức Chúa Trời của cha các ngươi đã phán với ta: “Hãy cẩn thận, đừng nói với Gia-cốp điều lành hay điều dữ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “từ điều lành đến điều dữ”; đây có thể là thành ngữ chỉ bất cứ điều gì, dù thuận lợi hay bất lợi.'
    reason: Giữ cách nói đối cực của nguyên văn trong chính văn đồng thời giúp người đọc hiểu ý nghĩa thành ngữ.
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: Ta đủ sức
  rationale: Thành ngữ nói đến năng lực nằm trong tay người nói. “Đủ sức” tự nhiên trong tiếng Việt và diễn đạt khả năng thực hiện hành động, không hàm ý quyền hạn chính đáng.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: làm hại các ngươi
  rationale: רָע trong ngữ cảnh này chỉ điều gây tổn hại cho những người được nói đến; đại từ số nhiều được giữ bằng “các ngươi”.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: nhưng ... Đức Chúa Trời của cha các ngươi
  rationale: Liên từ được dịch là “nhưng” để thể hiện sự tương phản giữa khả năng của La-ban và lời ngăn cấm của Đức Chúa Trời. Hậu tố sở hữu số nhiều trong אֲבִיכֶם được giữ là “các ngươi”, còn danh từ “cha” vẫn ở số ít.
- source_word: אֶמֶשׁ
  choice: đêm qua
  rationale: Trong ngữ cảnh, từ này chỉ đêm ngay trước đó; “đêm qua” là cách nói hiện đại và rõ ràng.
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy cẩn thận
  rationale: Mệnh lệnh này là lời cảnh báo phải dè chừng; cách dịch giữ được sắc thái cảnh cáo mà không thêm nội dung.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: đừng nói với Gia-cốp
  rationale: Cấu trúc הִשָּׁמֶר với מִן mang ý cấm đoán; “đừng nói” là cách diễn đạt trực tiếp, tự nhiên trong tiếng Việt.
- source_word: מִטּוֹב עַד רָע
  choice: điều lành hay điều dữ
  rationale: Bản dịch giữ nguyên cặp đối cực của tiếng Hê-bơ-rơ thay vì âm thầm thay bằng “bất cứ điều gì”; chú thích nêu ý nghĩa thành ngữ có thể có.
theological_decisions:
- issue: Cách dịch אֱלֹהִים khi chỉ Đấng đã phán với La-ban
  choice: Đức Chúa Trời của cha các ngươi
  alternative: Thần của cha các ngươi
  rationale: Trong mạch truyện, danh xưng chỉ Đức Chúa Trời đã hiện đến và ngăn La-ban làm hại Gia-cốp. “Đức Chúa Trời” phù hợp ngữ cảnh mà không thêm một nhận định thần học ngoài câu.
- issue: Số của đại từ sở hữu trong אֲבִיכֶם
  choice: cha các ngươi
  alternative: cha ngươi
  rationale: Hậu tố כֶם là số nhiều, phù hợp với עִמָּכֶם ở mệnh đề trước. Giữ số nhiều tôn trọng hình thức của bản Hê-bơ-rơ, dù lời cảnh báo sau đó trực tiếp nhắc đến Gia-cốp.
- issue: Ý nghĩa của מִטּוֹב עַד רָע
  choice: giữ hình ảnh “điều lành hay điều dữ” trong chính văn
  alternative: đừng nói gì cả với Gia-cốp
  rationale: Cụm từ có thể là thành ngữ bao quát mọi lời nói, nhưng hình thức đối cực cũng tạo sức căng trong lời cảnh báo. Chính văn giữ cách nói Hê-bơ-rơ, còn chú thích trình bày nghĩa thành ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta—các ngươi” phản ánh lời La-ban nói với cả nhóm và giữ sắc thái của lời đối đầu; câu trích dẫn chuyển sang lời cảnh báo trực tiếp. Tên riêng dùng dạng quen thuộc “Gia-cốp”.
