base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: vi
  text: La-ban đã đi xén lông đàn chiên của mình, còn Ra-chên lấy trộm các tượng thần trong nhà thuộc về cha nàng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: tê-ra-phim; cũng có thể dịch là “các thần trong nhà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: đã đi
  rationale: 'Dạng qatal cung cấp bối cảnh cho hành động chính tiếp theo: La-ban vắng mặt khi Ra-chên hành động. Tiếng Việt dùng “đã đi” tự nhiên mà không cần thêm một từ chỉ thời gian không có trong nguyên văn.'
- source_word: לִגְזֹז
  choice: xén lông
  rationale: Động từ chỉ việc xén lông các con vật trong đàn, đặc biệt là chiên; “xén lông” là cách diễn đạt chính xác và tự nhiên.
- source_word: צֹאנוֹ
  choice: đàn chiên của mình
  rationale: צֹאן chỉ đàn gia súc nhỏ, thường là chiên và dê. Trong ngữ cảnh xén lông, “đàn chiên” là cách nói thông dụng, rõ nghĩa trong tiếng Việt; “của mình” quy chiếu tự nhiên về La-ban.
- source_word: וַתִּגְנֹב
  choice: lấy trộm
  rationale: Giữ nguyên ý nghĩa đạo đức-pháp lý rõ ràng của גנב là trộm cắp, không làm nhẹ thành chỉ “lén lấy”.
- source_word: הַתְּרָפִים
  choice: các tượng thần gia đình
  rationale: תְּרָפִים là những vật tượng thờ gắn với gia đình. Cách dịch này vừa cho thấy tính chất tôn giáo vừa dễ hiểu; dạng số nhiều được giữ bằng “các”.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: thuộc về cha nàng
  rationale: Cụm từ biểu thị quyền sở hữu. “Thuộc về cha nàng” rõ ràng, tự nhiên và giữ đúng quan hệ được nêu trong tiếng Hê-bơ-rơ.
- source_word: וְ / וַ
  choice: còn
  rationale: Liên từ nối phần bối cảnh với hành động của Ra-chên. “Còn” diễn đạt sự chuyển chủ thể và tương quan giữa hai mệnh đề mà không thêm một trạng từ thời gian như “bấy giờ”.
theological_decisions:
- issue: Cách dịch תְּרָפִים trong ngữ cảnh các vật thờ của gia đình
  choice: các tượng thần gia đình
  alternative: các tê-ra-phim; các thần gia đình
  rationale: Danh từ Hê-bơ-rơ chỉ các hình tượng hay vật thờ trong gia đình. “Các tượng thần gia đình” truyền đạt chức năng tôn giáo mà không áp đặt một cách giải thích giáo phái; thuật ngữ phiên âm và cách dịch khác được giữ trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng cách phiên âm tên riêng quen thuộc “La-ban” và “Ra-chên”; không thêm từ mở đầu tương đương “bấy giờ” vì nguyên văn không có một từ chỉ thời gian riêng như vậy.
