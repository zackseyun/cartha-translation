base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: vi
  text: Vậy bây giờ, nào, chúng ta hãy lập một giao ước[a], tôi và ông; và giao ước ấy sẽ là nhân chứng giữa tôi với ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “cắt một giao ước.” Đây là thành ngữ Hê-bơ-rơ có nghĩa là lập hoặc thiết lập một giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ liên từ chuyển ý và cho thấy đây là bước tiếp theo được đề nghị trong cuộc đối thoại.
- source_word: לְכָה
  choice: hãy đến
  rationale: Dù bắt nguồn từ động từ 'đi', dạng mệnh lệnh này thường là lời mời hoặc thúc giục; 'hãy đến' tự nhiên trong ngữ cảnh.
- source_word: נִכְרְתָה בְרִית
  choice: chúng ta hãy lập giao ước
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là 'cắt một giao ước', nhưng là thành ngữ chỉ việc thiết lập giao ước. 'Lập giao ước' vừa rõ nghĩa vừa trang trọng.
- source_word: אֲנִי וָאָתָּה
  choice: tôi và ông
  rationale: Giữ cách nêu đích danh cả hai bên; đại từ 'ông' phù hợp lời La-ban nói với Gia-cốp trong văn cảnh và vẫn giữ sắc thái trang trọng.
- source_word: וְהָיָה לְעֵד
  choice: và giao ước ấy sẽ làm chứng
  rationale: Nêu rõ chủ thể hàm ẩn là giao ước, đồng thời diễn đạt chức năng làm nhân chứng một cách tự nhiên trong tiếng Việt.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: giữa tôi với ông
  rationale: Bảo toàn thứ tự và tính chất trực tiếp, song phương của nguyên văn.
theological_decisions:
- issue: Chủ thể của וְהָיָה ('và nó sẽ...')
  choice: giao ước ấy
  alternative: một vật hoặc dấu hiệu giao ước được thiết lập sau đó
  rationale: Danh từ gần nhất là 'giao ước', nên đây là quy chiếu tự nhiên nhất; bản dịch không phát triển thêm một cách giải thích thần học ngoài câu.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'giao ước' để giữ sức nặng quan hệ và pháp lý của בְרִית; cấu trúc được điều chỉnh vừa đủ cho tự nhiên mà vẫn bám sát nguyên văn.
