- from: Vậy bây giờ, hãy đến, chúng ta hãy lập giao ước[a], tôi và ông; và giao ước ấy sẽ làm chứng giữa tôi với ông.
  to: Vậy bây giờ, nào, chúng ta hãy lập một giao ước[a], tôi và ông; và giao ước ấy sẽ là nhân chứng giữa tôi với ông.
  rationale: Sửa “hãy đến” thành “nào” để phản ánh lời mời/thúc giục tự nhiên của לְכָה. Sửa “sẽ làm chứng” thành “sẽ là nhân chứng” để dịch trực tiếp לְעֵד và duy trì cách hiểu quy chiếu tự nhiên đến “giao ước,” không áp đặt thêm chi tiết diễn giải.
