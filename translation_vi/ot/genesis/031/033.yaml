source:
  edition: WLC
  text: וַ/יָּבֹ֨א לָבָ֜ן בְּ/אֹ֥הֶל יַעֲקֹ֣ב וּ/בְ/אֹ֣הֶל לֵאָ֗ה וּ/בְ/אֹ֛הֶל שְׁתֵּ֥י הָ/אֲמָהֹ֖ת וְ/לֹ֣א מָצָ֑א וַ/יֵּצֵא֙ מֵ/אֹ֣הֶל לֵאָ֔ה וַ/יָּבֹ֖א בְּ/אֹ֥הֶל רָחֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: vi
  text: La-ban vào lều của Gia-cốp, lều của Lê-a và lều của hai nữ tỳ, nhưng không tìm thấy[a]. Rồi ông ra khỏi lều Lê-a và vào lều Ra-chên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ chỉ nói “không tìm thấy” mà không nêu đối tượng; theo văn cảnh, đó là các tượng thần gia đình mà La-ban đang tìm.
    reason: Làm rõ tân ngữ được hàm ý trong văn cảnh, đồng thời bảo toàn cách diễn đạt không nêu tân ngữ của nguyên văn.
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: vào lều
  rationale: Động từ בוא đi với giới từ בְּ diễn tả chuyển động vào bên trong. “Vào lều” tự nhiên trong văn kể tiếng Việt và giữ rõ trình tự khám xét.
- source_word: אֹהֶל
  choice: lều
  rationale: Giữ nghĩa cụ thể thông thường của từ Hê-bơ-rơ và phù hợp với bối cảnh gia trưởng.
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: hai nữ tỳ
  rationale: אָמָה chỉ người nữ ở địa vị tôi tớ hoặc nô lệ trong gia hộ. “Nữ tỳ” ngắn gọn, trang trọng, quen thuộc trong văn Kinh Thánh tiếng Việt và không làm nhẹ đi địa vị lệ thuộc như “người giúp việc”.
- source_word: וְלֹא מָצָא
  choice: nhưng không tìm thấy[a]
  rationale: Nguyên văn không nêu tân ngữ; tiếng Việt cũng có thể để trống tân ngữ một cách tự nhiên. “Nhưng” thể hiện sắc thái tương phản sau cuộc khám xét, còn chú thích xác định đối tượng theo văn cảnh mà không đưa điều đó vào chính văn.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: Rồi ông ra khỏi lều Lê-a
  rationale: “Ra khỏi” truyền đạt trực tiếp động tác יצא מן; “rồi” thể hiện diễn tiến liên tiếp của lời kể.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: và vào lều Ra-chên
  rationale: Dùng lại “vào” để duy trì tính nhất quán của động từ và nhịp tuần tự trong cuộc tìm kiếm.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, sáng rõ và trang trọng vừa phải. Các tên riêng dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt: La-ban, Gia-cốp, Lê-a và Ra-chên. Cấu trúc liệt kê được giữ gọn nhưng vẫn thể hiện cuộc khám xét lần lượt qua từng lều.'
