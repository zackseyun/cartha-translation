base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: vi
  text: 'Đã hai mươi năm nay tôi ở trong nhà ông: tôi đã phục vụ ông mười bốn năm vì hai con gái ông, và sáu năm vì đàn chiên dê của ông; ông đã đổi tiền công của tôi mười lần.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: Suốt hai mươi năm này
  rationale: Diễn đạt tự nhiên khoảng thời gian được nhấn mạnh, đồng thời giữ sắc thái chỉ định của זֶה và ý nghĩa liên hệ với người nói của לִּי.
- source_word: בְּבֵיתֶךָ
  choice: trong nhà ông
  rationale: Giữ hình ảnh cụ thể của בַּיִת; trong ngữ cảnh cũng có thể bao hàm gia đình và cơ nghiệp của La-ban.
- source_word: עֲבַדְתִּיךָ
  choice: tôi đã phục vụ ông
  rationale: Động từ עבד chỉ việc phục dịch và lao động cho La-ban; “phục vụ” giữ được cả sắc thái quan hệ lẫn công việc.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: mười bốn năm để cưới hai con gái ông
  rationale: Giới từ בְּ biểu thị điều mà Gia-cốp phục vụ để nhận được. Tiếng Việt cần làm rõ quan hệ mục đích; “để cưới” diễn đạt tự nhiên thỏa thuận lao động làm sính lễ mà ngữ cảnh đã xác lập.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: và sáu năm để chăn bầy gia súc của ông
  rationale: צֹאן là đàn gia súc nhỏ, gồm chiên và dê; “bầy gia súc” tránh thu hẹp thành riêng chiên. “Để chăn” làm rõ loại công việc theo ngữ cảnh.
- source_word: וַתַּחֲלֵף
  choice: thế mà ông đã đổi
  rationale: חלף ở thể Hiphil có nghĩa thay đổi hoặc thay thế. “Thế mà” thể hiện quan hệ tương phản và lời trách cứ vốn rõ trong mạch phát biểu.
- source_word: מַשְׂכֻּרְתִּי
  choice: tiền công của tôi
  rationale: “Tiền công” là cách nói hiện đại, minh bạch cho khoản thù lao lao động.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: mười lần
  rationale: Đây là thành ngữ chỉ sự thay đổi lặp đi lặp lại; dịch sát theo nghĩa “lần đếm” sẽ tối nghĩa trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ “tôi—ông” để phản ánh lời đối chất trực tiếp của Gia-cốp với La-ban mà không thêm sắc thái thân mật. Câu được chia làm hai để tiếng Việt sáng rõ, nhưng vẫn giữ nhịp liệt kê và cao trào của lời khiếu trách.
