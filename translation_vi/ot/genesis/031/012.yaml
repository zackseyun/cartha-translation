  to: 'Ngài phán: “Hãy ngước mắt lên và nhìn xem: tất cả những con dê đực đang nhảy giống trong đàn[a] đều có sọc, có đốm nhỏ và có đốm loang[b], vì Ta đã thấy mọi điều La-ban đang làm đối với con.”'
