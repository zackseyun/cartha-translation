  text: וַ/יֹּ֗אמֶר שָׂא נָ֨א עֵינֶ֤י/ךָ וּ/רְאֵה֙ כָּל הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּ֑ים כִּ֣י רָאִ֔יתִי אֵ֛ת כָּל אֲשֶׁ֥ר לָבָ֖ן עֹ֥שֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: vi
  text: 'Ngài phán: “Hãy ngước mắt lên và nhìn xem: tất cả những con dê đực đang nhảy giống trong đàn[a] đều có sọc, có đốm nhỏ và có đốm loang[b], vì Ta đã thấy mọi điều La-ban đang làm đối với con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đang nhảy lên đàn.” Đây là một thành ngữ Hê-bơ-rơ trong ngữ cảnh chăn nuôi, chỉ việc con đực giao phối với các con cái trong đàn.'
    reason: lexical_alternative
  - marker: b
    text: Ba từ Hê-bơ-rơ mô tả các kiểu hoa văn khác nhau trên lông súc vật; từ đầu cũng có thể dịch là “vằn khoang”, còn từ cuối có thể dịch là “lốm đốm” hoặc “loang màu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ וּרְאֵה
  choice: Hãy ngước mắt lên và nhìn xem
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ ‘nâng mắt lên’ và giữ mệnh lệnh nhìn; נָא làm lời yêu cầu nhẹ hơn nhưng không nhất thiết phải dịch riêng thành ‘xin’ trong lời của Đức Chúa Trời.
- source_word: הָעַתֻּדִים
  choice: những con dê đực
  rationale: עתודים ở đây chỉ dê đực; cách gọi này rõ nghĩa và tránh nhầm với cừu đực.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: đang phối giống với đàn
  rationale: Đây là thành ngữ chăn nuôi nói về con đực nhảy lên con cái để giao phối; ‘phối giống với đàn’ tự nhiên, trang nhã và rõ nghĩa trong tiếng Việt.
- source_word: עֲקֻדִּים
  choice: có sọc
  rationale: Từ này mô tả dấu vằn, dải hoặc sọc; ‘có sọc’ dễ hiểu trong tiếng Việt hiện đại.
- source_word: נְקֻדִּים
  choice: có đốm nhỏ
  rationale: נְקֻדִּים chỉ những chấm hay đốm nhỏ; thêm ‘nhỏ’ giúp phân biệt với loại hoa văn loang của từ kế tiếp.
- source_word: וּבְרֻדִּים
  choice: có đốm loang
  rationale: Từ này chỉ màu sắc lốm đốm, loang hoặc pha tạp; ‘đốm loang’ vừa dễ hiểu vừa duy trì sự phân biệt với נְקֻדִּים.
- source_word: כִּי רָאִיתִי
  choice: vì Ta đã thấy
  rationale: Giữ quan hệ nguyên nhân của כִּי và sắc thái hoàn thành của động từ; viết hoa ‘Ta’ theo quy ước tiếng Việt khi nhân vật thần linh trong giấc mộng tự xưng.
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: mọi điều La-ban đang làm với con
  rationale: Phân từ עֹשֶׂה biểu thị hành động đang diễn ra; ‘làm với con’ giữ được phạm vi nghĩa của לְךָ mà không diễn giải quá mức thành ‘ngược đãi’.
theological_decisions:
- issue: Chủ thể của וַיֹּאמֶר và đại từ ngôi thứ nhất
  choice: Dùng ‘Ngài’ và ‘Ta’
  alternative: Dùng ‘người ấy’ và ‘ta’ hoặc nêu rõ ‘thiên sứ của Đức Chúa Trời’
  rationale: Ngữ cảnh ngay trước đó xác định người nói là thiên sứ của Đức Chúa Trời, nhưng câu Hê-bơ-rơ chỉ dùng đại từ và lời tự xưng. ‘Ngài/Ta’ bảo toàn liên kết ngữ cảnh mà không chèn danh xưng không có trong câu này hay giải quyết quan hệ giữa vị thiên sứ và Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ chăn nuôi ‘phối giống’ thay cho cách dịch sát ‘nhảy lên đàn’. Tên riêng viết ‘La-ban’. Dấu chú thích [a] được đặt ngay sau cụm ba kiểu hoa văn.
