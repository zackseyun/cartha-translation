base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: vi
  text: Ông lùa đi tất cả gia súc và mọi tài sản ông đã có được—tức số gia súc ông đã có được tại Pha-đan A-ram—để đến với cha mình là Y-sác, ở xứ Ca-na-an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến xứ Ca-na-an.” Tiếng Hê-bơ-rơ dùng dạng chỉ hướng, theo sát nghĩa là “về phía Ca-na-an,” diễn tả sự di chuyển hướng đến Ca-na-an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: lùa đi
  rationale: Động từ נהג ở đây chỉ việc điều khiển đàn vật nuôi di chuyển; “lùa đi” tự nhiên trong bối cảnh chăn nuôi và thể hiện hướng chuyển động.
- source_word: מִקְנֵהוּ
  choice: gia súc
  rationale: מִקְנֶה là từ chỉ chung đàn vật nuôi, không chỉ riêng bò; “gia súc” giữ được phạm vi rộng ấy.
- source_word: רְכֻשׁוֹ
  choice: mọi tài sản
  rationale: רְכוּשׁ chỉ của cải, tài vật đã tích lũy; “tài sản” là cách diễn đạt hiện đại, rộng và rõ.
- source_word: רָכָשׁ
  choice: đã gây dựng
  rationale: רכש mang nghĩa thu được hoặc tạo lập tài sản. “Gây dựng” phù hợp văn cảnh Gia-cốp tích lũy của cải và có thể được lặp lại tự nhiên trong tiếng Việt.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: số gia súc ông đã gây dựng
  rationale: Cụm Hê-bơ-rơ có tính nhấn mạnh và lặp ý về phần gia súc thuộc tài sản ông thu được; cách dịch này giữ sự lặp lại mà không quá gượng.
- source_word: בְּפַדַּן אֲרָם
  choice: tại Pha-đan A-ram
  rationale: Tên địa danh được phiên âm theo cách đọc quen thuộc trong tiếng Việt.
- source_word: לָבוֹא אֶל יִצְחָק אָבִיו
  choice: để trở về với cha mình là Y-sác
  rationale: לָבוֹא diễn tả mục đích đi/đến. Trong ngữ cảnh Gia-cốp đang quay về nơi cha mình sống, “trở về với” tự nhiên và không làm thay đổi đích đến.
- source_word: אַרְצָה כְּנָעַן
  choice: tại xứ Ca-na-an
  rationale: Dạng định hướng -ה biểu thị chuyển động về phía Ca-na-an; trong câu chính, “tại xứ Ca-na-an” gắn tự nhiên với nơi Y-sác ở, còn sắc thái hướng đến được ghi rõ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ phép lặp “đã gây dựng” của nguyên văn để phản ánh sự nhấn mạnh, đồng thời dùng dấu gạch ngang làm rõ cụm giải thích. Đại từ “ông” theo mạch kể về Gia-cốp.
