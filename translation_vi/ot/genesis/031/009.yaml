  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: vi
  text: Vậy, Đức Chúa Trời đã lấy đàn gia súc của cha các cô và ban cho tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giật lấy” hoặc “giải cứu”. Động từ Hê-bơ-rơ có thể diễn tả việc lấy khỏi một bên và chuyển sang bên khác; trong ngữ cảnh này, ý chuyển giao là nổi bật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: đã lấy ... mà
  rationale: Dạng Hiphil của נצל ở đây diễn tả việc lấy khỏi một bên để chuyển sang bên khác; cách dịch này giữ rõ ý chuyển giao mà không nhất thiết hàm ý giải cứu khỏi nguy hiểm.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ chỉ chính Đức Chúa Trời đang hành động vì Gia-cốp; đây là cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: מִקְנֵה
  choice: đàn gia súc
  rationale: Trong bối cảnh chăn nuôi, từ này chỉ tập hợp vật nuôi thuộc sở hữu; “đàn gia súc” tự nhiên và cụ thể hơn “tài sản”.
- source_word: אֲבִיכֶם
  choice: của cha các con
  rationale: Danh từ số ít với hậu tố ngôi hai số nhiều chỉ người cha chung của Ra-chên và Lê-a; lời này do Gia-cốp nói với các con gái của La-ban.
- source_word: וַיִּתֶּן לִי
  choice: ban cho cha
  rationale: נתן diễn tả sự trao cho; tiếng Việt có thể lược đối tượng đã nêu ngay trước đó. “Cha” thể hiện tự nhiên cách Gia-cốp tự xưng với hai người vợ trong quan hệ gia đình.
theological_decisions:
- issue: Vai trò chủ động của Đức Chúa Trời trong sự thịnh vượng của Gia-cốp
  choice: Nói trực tiếp rằng Đức Chúa Trời lấy đàn gia súc của La-ban và ban cho Gia-cốp.
  alternative: Diễn đạt nhẹ hơn rằng Đức Chúa Trời chỉ ban phước cho Gia-cốp.
  rationale: Hai động từ וַיַּצֵּל và וַיִּתֶּן quy hành động chuyển giao trực tiếp cho Đức Chúa Trời; bản dịch không làm yếu đi khẳng định ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “cha—các con” theo ngữ cảnh Gia-cốp nói với Ra-chên và Lê-a; dùng “ban” để diễn tả hành động Đức Chúa Trời trao cho, nhưng không làm giảm sắc thái chuyển giao mạnh của câu gốc.
