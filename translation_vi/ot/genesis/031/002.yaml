base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: vi
  text: Gia-cốp nhìn nét mặt La-ban và thấy rằng ông không còn như trước đối với mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “kìa, ông ấy không ở với mình như hôm qua và hôm kia”; đây là cách nói cho biết thái độ của La-ban đối với Gia-cốp đã thay đổi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: nhìn ... và thấy rằng
  rationale: Động từ ראה trong mạch kể diễn tả sự quan sát dẫn đến nhận biết; cách diễn đạt này tự nhiên trong tiếng Việt mà không thêm nội dung ngoài câu.
- source_word: פְּנֵי לָבָן
  choice: nét mặt La-ban
  rationale: פָּנִים nghĩa đen là “mặt”, nhưng tại đây nét mặt biểu lộ thái độ. “Nét mặt” giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ và phù hợp tiếng Việt hiện đại.
- source_word: וְהִנֵּה
  choice: và thấy rằng
  rationale: הִנֵּה hướng sự chú ý vào điều Gia-cốp nhận ra. Trong văn kể tiếng Việt, “và thấy rằng” truyền đạt tự nhiên chức năng này hơn cách dịch cổ kính “kìa”.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: ông không còn đối xử với mình
  rationale: Nghĩa đen là “ông ấy không ở với mình”; trong ngữ cảnh, đây là cách nói về thái độ của La-ban đối với Gia-cốp. Đại từ “ông” chỉ La-ban, còn “mình” phản ánh điểm nhìn của Gia-cốp và tránh nhập nhằng.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: như trước nữa
  rationale: Cụm từ nghĩa đen “như hôm qua và hôm kia” là thành ngữ chỉ thời gian trước đây. “Như trước nữa” truyền đạt đúng ý và tự nhiên.
