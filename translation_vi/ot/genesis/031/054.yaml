reference: Genesis 31:54
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֨בַח֙ בָּ/הָ֔ר וַ/יִּקְרָ֥א לְ/אֶחָ֖י/ו לֶ/אֱכָל לָ֑חֶם וַ/יֹּ֣אכְלוּ לֶ֔חֶם וַ/יָּלִ֖ינוּ בָּ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: vi
  text: Rồi Gia-cốp dâng một sinh tế trên núi và gọi anh em mình đến ăn bánh[a]. Họ ăn bánh và nghỉ đêm trên núi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bà con mình” hoặc “thân tộc mình”; từ Hê-bơ-rơ dịch là “anh em” trong ngữ cảnh có thể chỉ rộng hơn đến những người nam thuộc họ hàng hoặc cùng nhóm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... זֶבַח
  choice: dâng một sinh tế
  rationale: Cấu trúc đồng căn diễn tả hành động hiến tế. Tiếng Việt tự nhiên tránh lặp kiểu “tế một tế lễ” nhưng vẫn giữ rõ ý nghĩa nghi lễ của động từ và danh từ.
- source_word: בָּהָר
  choice: trên núi
  rationale: הַר có thể chỉ núi hoặc vùng đồi núi; dạng xác định và sự lặp lại địa điểm trong câu phù hợp với “trên núi”.
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: Giữ nghĩa trực tiếp của קרא; trong ngữ cảnh, lời gọi này đồng thời mang chức năng mời đến dùng bữa.
- source_word: לְאֶחָיו
  choice: anh em mình
  rationale: אָח có nghĩa cơ bản là anh/em trai nhưng trong ngữ cảnh có thể mở rộng đến thân tộc nam hoặc người cùng nhóm. Bản chính giữ cách gọi thân tộc của nguyên văn, còn nghĩa rộng được nêu ở chú thích.
- source_word: לֶאֱכָל לָחֶם
  choice: đến ăn bánh
  rationale: Giữ hình ảnh “ăn bánh” của tiếng Hê-bơ-rơ, dù cụm này cũng có thể mang nghĩa rộng là dùng bữa.
- source_word: וַיֹּאכְלוּ לֶחֶם
  choice: Họ ăn bánh
  rationale: Giữ sự lặp lại có chủ ý của לֶחֶם và sắc thái bữa ăn chung trong trình thuật.
- source_word: וַיָּלִינוּ
  choice: nghỉ đêm
  rationale: לון chỉ việc lưu lại qua đêm; “nghỉ đêm” là cách diễn đạt tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
theological_decisions:
- issue: Phạm vi nghĩa của “anh em” trong bối cảnh lập giao ước
  choice: Giữ “anh em mình” trong bản chính.
  alternative: bà con mình; thân tộc mình
  rationale: Nguyên văn dùng từ thân tộc אָח, có thể không chỉ anh em ruột. Giữ “anh em” bảo toàn cách diễn đạt và sự mơ hồ chân thực của nguồn; chú thích cho biết các khả năng rộng hơn mà không áp đặt một cách hiểu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Sinh tế” giữ sắc thái hiến tế rõ hơn “lễ vật”; “ăn bánh” được giữ để phản ánh thành ngữ và sự lặp lại của nguyên văn.
