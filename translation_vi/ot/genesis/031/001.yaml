base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: vi
  text: 'Gia-cốp nghe các con trai của La-ban nói: “Gia-cốp đã lấy tất cả những gì thuộc về cha chúng ta, và từ những gì thuộc về cha chúng ta, đã có được tất cả của cải này[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả vinh hoa này.” Từ Hê-bơ-rơ có thể chỉ danh dự, vẻ huy hoàng hoặc của cải vật chất; tại đây, từ này nói đến sự thịnh vượng thấy rõ của Gia-cốp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Gia-cốp nghe
  rationale: Động từ wayyiqtol tiếp tục mạch kể chuyện. Chủ ngữ được xác định từ văn cảnh là Gia-cốp; không thêm một trạng từ thời gian như “bấy giờ” vì nguyên văn không có từ chỉ thời gian tương ứng.
- source_word: דִּבְרֵי בְנֵי לָבָן
  choice: các con trai của La-ban nói
  rationale: דִּבְרֵי là “những lời/lời nói”; tiếng Việt tự nhiên diễn đạt việc nghe lời của họ bằng cấu trúc “nghe … nói”, đồng thời giữ rõ người phát ngôn.
- source_word: לָקַח
  choice: đã lấy
  rationale: Động từ mô tả hành động đã hoàn tất trong lời cáo buộc. “Lấy” giữ được tính trung tính về mặt từ vựng, không tăng mức độ thành “chiếm đoạt” dù ngữ cảnh mang giọng bất bình.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: tất cả những gì thuộc về cha chúng ta
  rationale: Tiền tố לְ diễn tả sự sở hữu; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: và từ những gì thuộc về cha chúng ta
  rationale: Giữ nguyên ý nguồn gốc do מִן biểu thị và giữ sự lặp lại có chủ ý của “thuộc về cha chúng ta” trong nguyên văn.
- source_word: עָשָׂה
  choice: đã gây dựng nên
  rationale: Nghĩa cơ bản là “làm, tạo nên”; trong ngữ cảnh tài sản, “gây dựng nên” diễn đạt tự nhiên việc tạo lập của cải mà vẫn gần với hình ảnh của nguyên văn hơn “thu được”.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: tất cả của cải này
  rationale: כָּבוֹד thường có nghĩa “vinh quang, danh dự, vẻ huy hoàng”, nhưng trong ngữ cảnh này chỉ sự thịnh vượng vật chất thấy được của Gia-cốp. “Của cải” phù hợp với văn cảnh; nghĩa sát chữ được bảo lưu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Lời của các con trai La-ban giữ sắc thái cáo buộc qua nội dung nhưng không thêm những từ miệt thị không có trong nguyên văn. Đại từ “ông ta” giúp câu trích dẫn tự nhiên mà không làm tăng thái độ thù địch.
