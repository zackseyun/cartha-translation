  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung chính của nguyên văn: Gia-cốp nghe lời các con trai La-ban, rồi lời họ cáo buộc rằng ông đã lấy tài sản của cha họ và có được của cải từ đó. Tuy nhiên, “gây dựng nên” dễ gợi quá trình kiến tạo/phát triển và có thể làm nhẹ sắc thái cáo buộc về nguồn gốc tài sản. “Đã có được” phù hợp hơn với עָשָׂה trong ngữ cảnh này và với ý “gained” của bản audit tiếng Anh.'
