  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: vi
  text: 'Viên quan đứng đầu những người hầu rượu kể giấc mơ của mình cho Giô-sép và nói với ông: “Trong giấc mơ của tôi, kìa, có một cây nho ở trước mặt tôi.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong giấc mơ của tôi, có một cây nho ở trước mặt tôi.” Tiếng Hê-bơ-rơ dùng từ thu hút sự chú ý “kìa” (וְהִנֵּה) để giới thiệu hình ảnh trong giấc mơ một cách sống động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: kể
  rationale: Động từ ספר ở thể piel có nghĩa là kể lại; “kể” tự nhiên và phù hợp với bổ ngữ “giấc mơ”.
- source_word: שַׂר הַמַּשְׁקִים
  choice: viên quan chước tử
  rationale: Cụm từ chỉ quan chức đứng đầu việc dâng đồ uống cho vua. “Quan chước tử” là cách gọi trang trọng, quen thuộc trong văn cảnh Kinh Thánh tiếng Việt và phân biệt chức vụ này với người hầu rượu thông thường.
- source_word: אֶת חֲלֹמוֹ
  choice: giấc mơ của mình
  rationale: Danh từ có hậu tố ngôi ba số ít giống đực chỉ giấc mơ của viên quan; “của mình” tự nhiên trong tiếng Việt và quy chiếu rõ về chủ ngữ.
- source_word: לְיוֹסֵף
  choice: cho Giô-sép
  rationale: Giới từ לְ đánh dấu người tiếp nhận lời kể; tên riêng được phiên âm theo cách dùng tiếng Việt.
- source_word: וַיֹּאמֶר לוֹ
  choice: và nói với ông
  rationale: Giữ lại đại từ tân ngữ được nêu rõ trong tiếng Hê-bơ-rơ; “ông” quy chiếu về Giô-sép và phù hợp với lối kể trang trọng.
- source_word: בַּחֲלוֹמִי
  choice: Trong giấc mơ của tôi
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt để mở đầu phần thuật lại giấc mơ.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: “Kìa” bảo tồn chức năng thu hút sự chú ý và nét sống động của הִנֵּה mà không dùng lối cổ khó hiểu.
- source_word: גֶפֶן
  choice: một cây nho
  rationale: גֶפֶן chỉ dây hoặc cây nho; “cây nho” là cách gọi thông dụng, rõ nghĩa trong tiếng Việt.
- source_word: לְפָנַי
  choice: ở trước mặt tôi
  rationale: Phản ánh trực tiếp nghĩa không gian “trước tôi”; thêm “có” để câu tiếng Việt trôi chảy.
theological_decisions: []
