  source_fidelity: 'Bản dịch truyền đạt đúng mạch câu Hê-bơ-rơ: quan trưởng thợ làm bánh thấy việc giải nghĩa là tốt, rồi kể giấc mơ của mình với ba giỏ trên đầu. “Tôi cũng có một giấc mơ” là cách làm trơn tự nhiên, không thêm ý đáng kể, đối với cấu trúc tỉnh lược אַף אֲנִי בַּחֲלֹמִי. Cách hiểu chính “bánh trắng” phù hợp với lựa chọn của bản đối chiếu tiếng Anh, đồng thời chú thích đã bảo toàn bất định từ vựng của חֹרִי.'
