  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: vi
  text: 'Khi quan trưởng thợ làm bánh thấy Giô-sép đã giải nghĩa tốt, ông nói với Giô-sép: “Tôi cũng có một giấc mơ. Kìa, có ba giỏ bánh trắng[a] ở trên đầu tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ba giỏ bánh nướng.” Từ Hê-bơ-rơ חֹרִי không chắc nghĩa; từ này có thể chỉ bánh trắng/bánh nướng ở trong giỏ, hoặc mô tả những chiếc giỏ đan hay có lỗ thưa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: quan trưởng thợ làm bánh
  rationale: שַׂר chỉ người đứng đầu hay viên chức phụ trách; cách dịch này giữ sắc thái chức vụ và vẫn dễ hiểu trong văn mạch cung đình.
- source_word: כִּי טוֹב פָּתָר
  choice: đã giải nghĩa tốt
  rationale: Giữ nghĩa trực tiếp rằng Giô-sép giải giấc mơ một cách tốt/thỏa đáng, không thu hẹp thành 'giải theo điềm lành'.
- source_word: אַף אֲנִי ... בַּחֲלוֹמִי
  choice: Tôi cũng có một giấc mơ
  rationale: Câu Hê-bơ-rơ có tính tỉnh lược; cách diễn đạt tự nhiên này bảo toàn ý người thợ làm bánh cũng thuật lại giấc mơ của mình.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Tái hiện dấu hiệu diễn ngôn làm hình ảnh trong giấc mơ trở nên sống động.
- source_word: שְׁלֹשָׁה סַלֵּי
  choice: ba giỏ
  rationale: Dịch trực tiếp cụm danh từ chỉ ba chiếc giỏ.
- source_word: חֹרִי
  choice: bánh trắng
  rationale: Từ này không chắc nghĩa; 'bánh trắng' theo cách hiểu truyền thống và phù hợp với nghề của người nói, còn khả năng từ này mô tả giỏ đan/thưa được giữ trong chú thích.
- source_word: עַל רֹאשִׁי
  choice: ở trên đầu tôi
  rationale: Cách diễn đạt vị trí rõ ràng, tự nhiên và sát nguyên văn.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên riêng quen thuộc, rõ nghĩa đối với độc giả Kinh Thánh tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ 'Kìa' để truyền đạt nét sống động của lời kể giấc mơ; dùng chú thích để bảo toàn sự bất định thực sự của חֹרִי.
