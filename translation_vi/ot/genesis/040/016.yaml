  terminology: “Giô-sép” nhất quán trong câu và phù hợp cách viết tên riêng Kinh Thánh tiếng Việt. “Giải nghĩa” phù hợp văn cảnh giải mộng. Chú thích dùng thuật ngữ “Từ Hê-bơ-rơ” chính xác và không áp đặt một lời giải quyết cho từ khó.
