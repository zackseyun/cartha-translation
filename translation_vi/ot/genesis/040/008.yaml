  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: vi
  text: 'Họ nói với ông: “Chúng tôi đã nằm mơ, nhưng không có ai giải nghĩa.” Giô-sép nói với họ: “Chẳng phải việc giải nghĩa thuộc về Đức Chúa Trời sao? Xin hãy kể cho tôi nghe.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: Chúng tôi đã nằm mơ
  rationale: Cụm Hê-bơ-rơ dùng tân ngữ đồng gốc, sát chữ là “một giấc mơ, chúng tôi đã mơ”. Tiếng Việt tự nhiên diễn đạt là “đã nằm mơ”; ngữ cảnh vẫn cho thấy cả hai người đều có giấc mơ.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: nhưng không có ai giải nghĩa
  rationale: Phân từ פֹתֵר chỉ người giải nghĩa; cách diễn đạt bằng mệnh đề động từ vừa tự nhiên trong tiếng Việt vừa giữ ý rằng không có người giải mộng sẵn có.
- source_word: הֲלוֹא
  choice: Chẳng phải ... sao?
  rationale: Giữ nguyên lực của câu hỏi tu từ mong đợi sự đồng tình.
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: việc giải nghĩa thuộc về Đức Chúa Trời
  rationale: Giới từ ל diễn tả sự sở thuộc hoặc nguồn gốc. Danh hóa bằng “việc giải nghĩa” tự nhiên trong tiếng Việt và vẫn chuyển tải ý quyền năng giải nghĩa thuộc về Đức Chúa Trời.
- source_word: פִּתְרֹנִים
  choice: việc giải nghĩa
  rationale: Từ này ở số nhiều trong tiếng Hê-bơ-rơ và có thể mang nghĩa khái quát. Tiếng Việt không bắt buộc đánh dấu số; “việc giải nghĩa” giữ nghĩa phạm trù mà không tạo cách nói gượng.
- source_word: סַפְּרוּ נָא לִי
  choice: Xin hãy kể giấc mơ cho tôi nghe
  rationale: סַפְּרוּ là mệnh lệnh số nhiều, נָא làm lời yêu cầu mềm hơn. Tân ngữ được hiểu từ ngữ cảnh là nội dung các giấc mơ; dùng “giấc mơ” theo nghĩa tập hợp để câu tiếng Việt rõ và tự nhiên.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi bằng אֱלֹהִים trong lời Giô-sép
  choice: Đức Chúa Trời
  alternative: thần/các thần
  rationale: Trong mạch truyện Giô-sép, đây là lời xác nhận Đức Chúa Trời là nguồn của sự giải nghĩa, không phải một phát biểu đa thần chung chung.
- issue: Ý nghĩa của לֵאלֹהִים đối với quyền giải mộng
  choice: việc giải nghĩa thuộc về Đức Chúa Trời
  alternative: Đức Chúa Trời ban lời giải nghĩa
  rationale: Bản dịch giữ cấu trúc sở thuộc/nguồn gốc của nguyên văn, không diễn giải thêm về phương thức Đức Chúa Trời ban sự giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ được giữ rõ. Không thêm chú thích vì các nét khác biệt của nguyên văn có thể được chuyển tải tự nhiên mà không cần một phương án thay thế thiết yếu.
