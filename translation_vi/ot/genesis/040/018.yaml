  text: 'Giô-sép đáp: “Đây là lời giải: ba cái giỏ là ba ngày.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: đáp
  rationale: Trong lời thoại kể chuyện, cụm kép Hê-bơ-rơ này giới thiệu lời hồi đáp. Tiếng Việt tự nhiên chỉ cần “đáp”; dịch cả hai động từ thành “đáp và nói” sẽ nặng nề mà không thêm nội dung.
- source_word: פִּתְרֹנוֹ
  choice: lời giải
  rationale: Trong bối cảnh giải mộng, từ này chỉ lời giải thích ý nghĩa của giấc mơ; “lời giải” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: ba cái giỏ
  rationale: סַל là giỏ; bản nguồn không buộc phải xác định vật liệu đan nên không thêm “mây” hay “liễu gai”.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: là ba ngày
  rationale: Giữ cấu trúc đồng nhất hóa không động từ của tiếng Hê-bơ-rơ, thay vì diễn giải thành “tượng trưng cho” hay “có nghĩa là”.
