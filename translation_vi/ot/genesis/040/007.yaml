base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: vi
  text: 'Bấy giờ, Giô-sép hỏi các quan của Pha-ra-ôn[a] đang bị giam cùng ông trong nhà của chủ ông: “Hôm nay, tại sao nét mặt các ông lại buồn bã?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các hoạn quan của Pha-ra-ôn”; từ Hê-bơ-rơ ở đây có thể chỉ các hoạn quan theo nghĩa đen hoặc các quan chức triều đình nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Vì thế, Giô-sép hỏi
  rationale: Dạng wayyiqtol tiếp nối mạch kể; “Vì thế” diễn đạt tự nhiên sự tiếp diễn theo ngữ cảnh. Nêu tên Giô-sép để đại từ không gây mơ hồ trong tiếng Việt.
- source_word: סְרִיסֵי פַרְעֹה
  choice: các quan của Pha-ra-ôn
  rationale: סָרִיס có thể chỉ hoạn quan theo nghĩa đen hoặc quan chức triều đình. “Các quan” phù hợp chức vụ trong ngữ cảnh mà không khẳng định họ là hoạn quan; khả năng kia được giữ trong chú thích.
- source_word: אֲשֶׁר אִתּוֹ בְמִשְׁמַר
  choice: đang bị giam cùng mình
  rationale: Diễn đạt cả ý ở cùng Giô-sép và tình trạng bị giam giữ, đồng thời giữ đại từ phản thân tự nhiên trong tiếng Việt.
- source_word: בֵּית אֲדֹנָיו
  choice: trong nhà chủ mình
  rationale: אָדוֹן trong ngữ cảnh là chủ của Giô-sép; “nhà” có thể bao gồm khu giam giữ thuộc cơ ngơi ấy.
- source_word: לֵאמֹר
  choice: dấu hai chấm trước lời nói trực tiếp
  rationale: Phân từ dẫn lời tiêu chuẩn trong tiếng Hê-bơ-rơ được thể hiện tự nhiên bằng dấu hai chấm trong văn kể tiếng Việt, tránh từ “rằng” thừa.
- source_word: מַדּוּעַ פְּנֵיכֶם רָעִים
  choice: tại sao nét mặt các ông lại buồn bã
  rationale: Cụm từ có nghĩa đen là “mặt các ông xấu”, nhưng là thành ngữ chỉ vẻ mặt buồn rầu hoặc ủ rũ. “Nét mặt ... buồn bã” tự nhiên và giữ trọng tâm nơi biểu hiện trên gương mặt.
- source_word: הַיּוֹם
  choice: Hôm nay
  rationale: Tương đương trực tiếp, tự nhiên của trạng từ chỉ thời gian.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “các ông” phù hợp khi Giô-sép nói với hai quan chức hoàng gia; tránh cách gọi quá cổ. Cấu trúc câu làm rõ Giô-sép là người hỏi nhưng không giải thích thêm danh tính người chủ.
