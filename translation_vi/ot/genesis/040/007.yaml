  - severity: low
    issue: “trong nhà chủ mình” hơi gượng và neo chú thích [a] đặt quá xa thuật ngữ được chú thích.
    rationale: “Nhà của chủ ông” là cấu trúc sở hữu tự nhiên hơn; chú thích về סָרִיס nên gắn với “các quan của Pha-ra-ôn”.
