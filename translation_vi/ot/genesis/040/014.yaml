base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: vi
  text: Nhưng khi ông được thuận lợi, xin ông nhớ đến tôi và đối đãi nhân từ với tôi; xin nhắc đến tôi với Pha-ra-ôn và đưa tôi ra khỏi nhà này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “nhà này”; trong ngữ cảnh, đây là nơi giam giữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Nhưng khi
  rationale: Trong mạch lời giải nghĩa chắc chắn về việc quan tửu chánh sẽ được phục chức, cụm này mở đầu một lời khẩn cầu có sắc thái đối lập. Dù אִם thường là “nếu”, ngữ cảnh cho phép diễn đạt tự nhiên bằng “khi” mà không biến sự phục chức thành điều Giô-sép hoài nghi.
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: xin anh nhớ đến tôi
  rationale: זכר là “nhớ”, còn אִתְּךָ bổ sung sắc thái giữ Giô-sép trong tâm trí. Tiếng Việt tự nhiên không cần dịch cứng là “với anh”; “nhớ đến tôi” truyền đạt đầy đủ ý chính.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: khi mọi sự tốt đẹp với anh
  rationale: Cụm này chỉ lúc hoàn cảnh của quan tửu chánh trở nên thuận lợi sau khi được phục chức. Cách dịch giữ sắc thái rộng của ייטב thay vì giới hạn vào một biến cố duy nhất.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: xin anh ... lấy lòng nhân từ đối đãi với tôi
  rationale: נָא được thể hiện bằng “xin”, còn חֶסֶד trong lời thỉnh cầu giữa hai người ở đây là lòng nhân từ được biểu lộ bằng hành động, không nhất thiết mang nghĩa giao ước chuyên biệt.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: hãy nhắc đến tôi với Pha-ra-ôn
  rationale: Dạng Hiphil của זכר mang ý đưa Giô-sép vào sự chú ý của Pha-ra-ôn. “Nhắc đến tôi với” là rõ ràng và tự nhiên trong tiếng Việt.
- source_word: וְהוֹצֵאתַנִי מִן הַבַּיִת הַזֶּה
  choice: đưa tôi ra khỏi nhà giam này
  rationale: Hiphil của יצא được giữ bằng “đưa ... ra”. בַּיִת theo nghĩa đen là “nhà”, nhưng trong ngữ cảnh chỉ nơi Giô-sép bị giam; “nhà giam” vừa giữ hình ảnh từ vựng vừa làm rõ nghĩa hiện tại.
theological_decisions:
- issue: Tính điều kiện hay tính thời điểm của lời cầu xin
  choice: “khi mọi sự tốt đẹp với anh”
  alternative: “nếu anh nhớ đến tôi khi mọi sự tốt đẹp với anh”
  rationale: אִם có thể tạo sắc thái điều kiện, nhưng lời giải nghĩa ngay trước đó trình bày việc phục chức như điều sẽ xảy ra. Bản dịch dùng “khi” cho thời điểm phục chức, đồng thời giữ lời yêu cầu “xin anh nhớ đến tôi”, tránh ngụ ý Giô-sép không chắc về lời giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh/tôi” phù hợp lời Giô-sép nói trực tiếp với một viên quan đồng cảnh tù; dùng dạng tên quen thuộc “Pha-ra-ôn”. Dấu hai chấm làm rõ rằng việc nhắc đến Giô-sép và đưa ông ra là hành động nhân từ được cầu xin.
