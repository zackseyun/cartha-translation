- from: 'Nhưng khi mọi sự tốt đẹp với anh, xin anh nhớ đến tôi và lấy lòng nhân từ đối đãi với tôi: hãy nhắc đến tôi với Pha-ra-ôn và đưa tôi ra khỏi nhà giam này.[a]'
  to: Nhưng khi ông được thuận lợi, xin ông nhớ đến tôi và đối đãi nhân từ với tôi; xin nhắc đến tôi với Pha-ra-ôn và đưa tôi ra khỏi nhà này.[a]
  rationale: Bản sửa giữ sắc thái đối lập của כִּי אִם bằng “Nhưng” và mốc thời điểm của כַּאֲשֶׁר יִיטַב לָךְ bằng “khi ông được thuận lợi.” Cụm “nhớ đến tôi” diễn đạt tự nhiên thành ngữ זְכַרְתַּנִי אִתְּךָ mà không ép dịch giới từ theo lối khó hiểu. “Nhà này” khôi phục cách nói theo mặt chữ của בַּיִת; chú thích cung cấp nghĩa theo ngữ cảnh. Dấu chấm phẩy nối các hành động cụ thể mà Giô-sép xin quan tửu chánh thực hiện.
