source:
  edition: WLC
  text: כִּֽי גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵ/אֶ֖רֶץ הָ/עִבְרִ֑ים וְ/גַם פֹּה֙ לֹא עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי שָׂמ֥וּ אֹתִ֖/י בַּ/בּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: vi
  text: Vì tôi quả đã bị bắt cóc[a] khỏi xứ của người Hê-bơ-rơ; ngay cả ở đây, tôi cũng chẳng làm điều gì đáng để họ tống tôi vào hố[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “tôi chắc chắn đã bị lấy trộm đi” hoặc “tôi đã bị đem đi mất.” Tiếng Hê-bơ-rơ dùng nguyên mẫu tuyệt đối cùng với động từ hữu hạn để nhấn mạnh.
    reason: lexical_alternative
  - marker: b
    text: Trong ngữ cảnh này, “hố” có thể chỉ hầm ngục hoặc buồng giam.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích/nguyên nhân của lời Giô-sép nói với quan dâng rượu.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: tôi quả đã bị bắt cóc
  rationale: “Bắt cóc” diễn đạt tự nhiên việc một người bị cưỡng ép đưa đi; “quả” thể hiện sắc thái nhấn mạnh của cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: khỏi xứ của người Hê-bơ-rơ
  rationale: Giữ nguyên cách gọi sắc tộc và không xác định quá mức đây là một thực thể địa chính trị cụ thể.
- source_word: וְגַם פֹּה
  choice: ngay cả ở đây ... cũng
  rationale: 'Diễn đạt tự nhiên sắc thái bổ sung có nhấn mạnh: sau khi bị bắt cóc, tại nơi này Giô-sép cũng vô tội.'
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: tôi cũng chẳng làm điều gì
  rationale: “Chẳng ... điều gì” giữ lời phủ nhận hoàn toàn mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: כִּי שָׂמוּ אֹתִי
  choice: đáng để họ tống tôi vào
  rationale: Diễn đạt mối liên hệ giữa việc không phạm lỗi và việc bị giam; “tống ... vào” phù hợp với hành động cưỡng bức trong ngữ cảnh.
- source_word: בַּבּוֹר
  choice: vào hố
  rationale: Giữ hình ảnh cụ thể của בּוֹר (“hố/hầm”), đồng thời chú thích nghĩa chỉ nơi giam giữ trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ sự nhấn mạnh của câu Hê-bơ-rơ và hình ảnh “hố”, đồng thời dùng “bắt cóc” để diễn đạt tự nhiên việc một người bị cưỡng ép đưa khỏi quê hương.
