  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giô-sép” theo cách phiên âm Kinh Thánh quen thuộc; đại từ “ông” thể hiện sự tôn trọng và không bổ sung chức danh ngoài nguyên văn.
