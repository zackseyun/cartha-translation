  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: vi
  text: 'Giô-sép nói với ông: “Đây là lời giải nghĩa của giấc mơ ấy: ba nhánh nho[a] là ba ngày.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cành nho” hoặc “tua nho”.
