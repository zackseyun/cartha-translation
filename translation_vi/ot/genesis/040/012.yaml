lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ với waw liên tiếp tiếp diễn mạch kể; tiếng Việt tự nhiên không cần thêm “rồi” vì trình tự đã rõ trong ngữ cảnh.
- source_word: לוֹ
  choice: với ông
  rationale: Giữ đại từ chỉ người nghe như nguyên văn, không đưa danh xưng “quan dâng rượu” vào câu.
- source_word: פִּתְרֹנוֹ
  choice: lời giải nghĩa giấc mơ
  rationale: Diễn đạt tự nhiên ý nghĩa của danh từ “sự giải nghĩa” cùng hậu tố ngôi ba số ít; “giấc mơ” làm rõ đối tượng đã có trong ngữ cảnh mà không thay đổi nội dung.
- source_word: שְׁלֹשֶׁת
  choice: ba
  rationale: Giữ nguyên cả hai lần xuất hiện của số từ để bảo toàn cấu trúc đối chiếu giữa biểu tượng và thời gian.
- source_word: הַשָּׂרִגִים
  choice: nhánh nho
  rationale: Trong ngữ cảnh cây nho của giấc mơ, “nhánh nho” rõ ràng và tự nhiên; chú thích bảo lưu những khả năng gần nghĩa như cành hoặc tua nho.
- source_word: יָמִים
  choice: ngày
  rationale: Chuyển dịch trực tiếp danh từ chỉ thời gian.
- source_word: הֵם
  choice: là
  rationale: Thể hiện phép đồng nhất có tính giải nghĩa; đại từ độc lập trong tiếng Hê-bơ-rơ không cần dịch thành một đại từ riêng trong cú pháp tiếng Việt.
