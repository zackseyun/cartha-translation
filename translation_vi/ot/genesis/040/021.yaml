  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: vi
  text: Vua phục chức cho quan tửu chánh[a], và quan ấy lại dâng chén vào tay Pha-ra-ôn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “đưa quan tửu chánh trở lại việc dâng rượu của ông ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ chỉ có động từ “và [người ấy] đặt/dâng”, không nêu lại chủ thể. Theo ngữ cảnh, người dâng chén là quan tửu chánh.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: phục chức
  rationale: Dạng Hiphil của שׁוב ở đây diễn tả việc khiến một người trở lại địa vị trước đó; “phục chức” truyền đạt tự nhiên việc quan chánh chước được khôi phục chức vụ.
- source_word: שַׂר הַמַּשְׁקִים
  choice: quan chánh chước
  rationale: Đây là quan đứng đầu những người phục vụ đồ uống trong triều đình; “quan chánh chước” là cách gọi trang trọng, gọn và phù hợp bối cảnh cung đình.
- source_word: עַל מַשְׁקֵהוּ
  choice: cho ... trở lại chức vụ
  rationale: Cụm Hê-bơ-rơ nói sát là đưa người ấy trở lại công việc châm rượu; bản dịch dùng cách diễn đạt tự nhiên trong tiếng Việt và giữ nghĩa được phục hồi nhiệm vụ trước đây.
- source_word: וַיִּתֵּן
  choice: dâng
  rationale: נתן cơ bản là “đưa/trao/đặt”; trong bối cảnh viên quan phục vụ vua bằng cách đưa chén vào tay vua, “dâng” tự nhiên và thể hiện đúng quan hệ cung đình.
- source_word: הַכּוֹס
  choice: chén
  rationale: “Chén” là từ thông dụng, trang trọng vừa phải và phù hợp dụng cụ uống trong bối cảnh cổ đại.
- source_word: עַל כַּף פַּרְעֹה
  choice: vào tay Pha-ra-ôn
  rationale: כַּף sát nghĩa là “lòng bàn tay”, nhưng cả cụm chỉ hành động trao hoặc đặt chén vào tay; cách dịch này tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Chủ thể không được nêu rõ của וַיִּתֵּן
  choice: quan ấy lại dâng
  alternative: và vua đặt / và ông đặt
  rationale: Động từ Hê-bơ-rơ chỉ có chủ thể ngôi thứ ba số ít giống đực, không nêu danh từ. Về cú pháp có thể nối với chủ thể trước là vua, nhưng hành động phục vụ và ngữ cảnh cho thấy quan chánh chước là chủ thể hợp lý hơn. Bản chính làm rõ cách hiểu theo ngữ cảnh, còn chú thích bảo lưu tính hàm hồ hình thức của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quan chánh chước” giữ sắc thái chức quan cung đình; “phục chức” tránh lối dịch sát nhưng gượng là “trở lại việc châm rượu”. Đại từ “quan ấy” được dùng để làm rõ chủ thể theo ngữ cảnh, đồng thời chú thích ghi nhận sự không tường minh trong tiếng Hê-bơ-rơ.
