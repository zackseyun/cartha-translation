base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: vi
  text: Sau những việc ấy[a], người dâng rượu của vua Ai Cập và người làm bánh đã phạm tội với chủ của họ, là vua Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau những biến cố ấy.” Công thức kể chuyện trong tiếng Hê-bơ-rơ, nếu dịch sát hơn, là: “Và xảy ra rằng sau những việc ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sau những việc ấy
  rationale: Diễn đạt tự nhiên công thức chuyển tiếp trong lời kể tiếng Hê-bơ-rơ, đồng thời giữ sát hình ảnh 'những việc ấy'; dạng đầy đủ hơn là 'Và xảy ra rằng sau những việc ấy' sẽ nặng nề trong tiếng Việt hiện đại.
- source_word: חָטְאוּ
  choice: đã phạm tội với
  rationale: Giữ sức nặng đạo đức và quan hệ của động từ חטא khi đi với ל chỉ người bị xúc phạm; 'đắc tội với' cũng khả dĩ nhưng mang sắc thái cổ hơn.
- source_word: מַשְׁקֵה
  choice: quan dâng rượu
  rationale: Chỉ viên chức phụ trách dâng thức uống cho vua. 'Quan dâng rượu' rõ nghĩa trong bối cảnh cung đình và không thêm cấp bậc 'trưởng' vốn chưa được nêu trong câu này.
- source_word: הָאֹפֶה
  choice: quan làm bánh
  rationale: Danh từ hóa phân từ có nghĩa là 'người làm bánh'. Thêm 'quan' để thể hiện tự nhiên đây là chức vụ trong triều, nhưng không thêm quan hệ sở hữu không có trực tiếp trong nguyên văn.
- source_word: לַאֲדֹנֵיהֶם
  choice: với chủ mình
  rationale: אדון ở đây chỉ người chủ hoặc bề trên của hai viên chức, không phải danh xưng thần linh. 'Chủ mình' tự nhiên hơn 'chúa của họ' và đại từ 'mình' quy chiếu chung về chủ của cả hai.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: tức vua Ai Cập
  rationale: Cụm đồng vị xác định 'chủ mình' chính là vua Ai Cập. 'Tức' làm rõ quan hệ đồng vị trong tiếng Việt mà vẫn giữ sự lặp nhấn mạnh của nguyên văn.
theological_decisions:
- issue: Sức nặng đạo đức của חָטְאוּ
  choice: phạm tội với
  alternative: đắc tội với; xúc phạm
  rationale: Không làm nhẹ động từ thành việc chỉ khiến nhà vua phật ý, nhưng cũng không giải thích thêm bản chất cụ thể của lỗi mà câu này chưa nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'quan dâng rượu' và 'quan làm bánh' để phản ánh bối cảnh triều đình; tránh từ quá cổ như 'tửu chánh' và tránh thêm cấp bậc không có trong câu.
