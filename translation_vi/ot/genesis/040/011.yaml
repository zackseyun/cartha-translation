  text: וְ/כ֥וֹס פַּרְעֹ֖ה בְּ/יָדִ֑/י וָ/אֶקַּ֣ח אֶת הָֽ/עֲנָבִ֗ים וָֽ/אֶשְׂחַ֤ט אֹתָ/ם֙ אֶל כּ֣וֹס פַּרְעֹ֔ה וָ/אֶתֵּ֥ן אֶת הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: vi
  text: Chén của Pha-ra-ôn ở trong tay tôi; tôi cầm lấy những trái nho, vắt chúng vào chén của Pha-ra-ôn, rồi đặt chén vào tay Pha-ra-ôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đặt chén trên lòng bàn tay Pha-ra-ôn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: chén
  rationale: Chỉ một vật dùng để uống; “chén” tự nhiên trong tiếng Việt và phù hợp với bối cảnh cung đình mà không thêm sắc thái không có trong nguyên văn.
- source_word: בְּיָדִי
  choice: ở trong tay tôi
  rationale: Giữ hình ảnh cụ thể của lời thuật lại giấc mơ và diễn đạt tự nhiên trong tiếng Việt.
- source_word: וָאֶקַּח
  choice: tôi cầm lấy
  rationale: Diễn đạt hành động לקח trực tiếp, không suy diễn rằng người nói hái nho khỏi cây.
- source_word: הָעֲנָבִים
  choice: những trái nho
  rationale: Tương đương từ vựng rõ ràng, giữ ý số nhiều và tính xác định theo ngữ cảnh.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: vắt chúng vào chén của Pha-ra-ôn
  rationale: שׂחט ở đây chỉ việc bóp/vắt cho nước nho chảy ra; “vắt… vào chén” vừa gọn vừa truyền đạt đúng hướng của hành động.
- source_word: וָאֶתֵּן אֶת הַכּוֹס עַל כַּף פַּרְעֹה
  choice: rồi đặt chén vào tay Pha-ra-ôn
  rationale: נתן trong ngữ cảnh là đặt hoặc trao vật; cách diễn đạt này tự nhiên trong tiếng Việt, còn nghĩa đen của כַּף và עַל được ghi ở chú thích.
