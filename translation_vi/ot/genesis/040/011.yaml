  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng dấu chấm phẩy để nối trạng thái mở đầu với chuỗi hành động liên tiếp; không thêm từ chỉ thời gian tương đương với “bấy giờ” vì nguyên văn không có từ ấy.
