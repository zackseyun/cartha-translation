  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch ưu tiên tiếng Việt tự nhiên nhưng vẫn giữ cấu trúc phân phối của nguyên văn và sự gắn kết riêng giữa từng giấc mơ với lời giải của nó.
