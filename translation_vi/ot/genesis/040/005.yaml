base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: vi
  text: Cả hai người đều nằm mơ trong cùng một đêm, mỗi người một giấc mơ, và mỗi giấc mơ có lời giải riêng[a]—người dâng rượu và người làm bánh của vua Ai Cập, là những người đang bị giam trong nhà tù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mỗi người nằm mơ một giấc, mỗi giấc có lời giải tương ứng.” Tiếng Hê-bơ-rơ lặp cấu trúc “mỗi người” và nhấn mạnh rằng mỗi giấc mơ có lời giải riêng phù hợp với nó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם שְׁנֵיהֶם
  choice: Cả hai người đều nằm mơ
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ rõ ý cả hai người. Cấu trúc đồng nguyên từ của tiếng Hê-bơ-rơ không thể giữ nguyên một cách tự nhiên bằng cụm kiểu 'mơ một giấc mơ' trong ngữ cảnh này.
- source_word: אִישׁ חֲלֹמוֹ
  choice: mỗi người một giấc mơ
  rationale: 'Giữ lực phân phối: mỗi người trong hai viên quan có giấc mơ của riêng mình.'
- source_word: בְּלַיְלָה אֶחָד
  choice: trong cùng một đêm
  rationale: Truyền đạt rõ rằng hai giấc mơ xảy ra trong một đêm chung; 'một đêm' cũng khả dĩ nhưng dễ kém rõ về sự đồng thời.
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: mỗi giấc mơ có lời giải riêng
  rationale: Diễn đạt tự nhiên ý tương ứng giữa từng giấc mơ và cách giải của nó, đồng thời tránh câu tiếng Việt nặng nề nếu bám sát 'mỗi người theo lời giải giấc mơ mình'.
- source_word: הַמַּשְׁקֶה
  choice: người dâng rượu
  rationale: Chỉ viên quan phục vụ thức uống cho vua; cách gọi này sáng rõ và quen thuộc hơn 'quan chước tử' đối với độc giả hiện đại.
- source_word: הָאֹפֶה
  choice: người làm bánh
  rationale: Dịch trực tiếp chức năng, không thêm ý 'trưởng' vốn không có trong câu này.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: của vua Ai Cập
  rationale: Giữ quan hệ thuộc về hoặc trực thuộc nhà vua mà không xác định quá mức bản chất chức vụ.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: đang bị giam trong nhà tù
  rationale: Phản ánh phân từ bị động אֲסוּרִים trong bối cảnh tù ngục; 'nhà tù' là cách nói tự nhiên và trang trọng vừa phải.
