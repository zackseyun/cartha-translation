  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: vi
  text: Vua giam họ trong nhà của viên chỉ huy đội cận vệ[a], tại nhà tù[b], là nơi Giô-sép bị giam giữ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Danh xưng Hê-bơ-rơ này cũng có thể dịch sát hơn là “viên chỉ huy những người hành hình” hoặc “viên trưởng toán đồ tể”.
    reason: lexical_alternative
  - marker: b
    text: 'Cấu trúc Hê-bơ-rơ cũng có thể hiểu là: “trong nhà của viên chỉ huy đội cận vệ, vào nhà tù”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: Vua giam họ
  rationale: Động từ נָתַן theo nghĩa đen là “đặt/giao”, nhưng khi đi với מִשְׁמָר thì diễn tả việc đặt ai dưới sự canh giữ. “Giam họ” tự nhiên trong tiếng Việt và truyền đạt đúng bối cảnh câu lưu.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: trong nhà viên chỉ huy đội cận vệ
  rationale: Giữ danh xưng quen thuộc, phù hợp với bối cảnh triều đình và nhà tù. Từ טַבָּחִים có nghĩa gốc liên quan đến việc giết hoặc hành hình; sắc thái ấy được ghi ở chú thích thay vì đưa vào chính văn một cách khó hiểu.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: tại nhà tù
  rationale: בֵּית הַסֹּהַר chỉ nơi giam giữ. “Nhà tù” là cách nói tự nhiên, trang trọng vừa phải; giới từ “tại” thể hiện địa điểm sau động từ “giam”, dù אֶל thường có hướng nghĩa “đến/vào”.
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: là nơi Giô-sép đang bị giam giữ
  rationale: אָסוּר có nghĩa đen là “bị trói” và trong ngữ cảnh này là “bị giam”. “Đang bị giam giữ” diễn đạt trạng thái của Giô-sép; שָׁם được bao hàm tự nhiên trong “nơi”.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Vua” làm rõ chủ thể đã được nêu trong văn cảnh trước; dấu phẩy và “là nơi” giúp chuỗi cụm chỉ địa điểm trong tiếng Hê-bơ-rơ trở nên tự nhiên mà không xóa bỏ khả năng hiểu khác về quan hệ giữa nhà của viên chỉ huy và nhà tù.
