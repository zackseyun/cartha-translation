  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: vi
  text: Buổi sáng, Giô-sép đến với họ, thấy họ; và kìa, họ đang buồn rầu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ủ rũ”, “phiền muộn” hoặc “nét mặt sa sầm”. Từ Hê-bơ-rơ mô tả một trạng thái bất an hay buồn bực biểu lộ ra bên ngoài.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: đến chỗ họ
  rationale: Diễn đạt tự nhiên chuyển động hướng về hai tù nhân, không thêm ý rằng Giô-sép bước vào một địa điểm cụ thể.
- source_word: בַּבֹּקֶר
  choice: Buổi sáng
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, đồng thời giữ vị trí nổi bật của cụm từ trong mạch kể.
- source_word: וַיַּרְא אֹתָם
  choice: thấy họ
  rationale: Giữ nghĩa tri giác trực tiếp, đơn giản của động từ ראה, không diễn giải quá mức thành “quan sát” hay “nhìn kỹ”.
- source_word: וְהִנָּם זֹעֲפִים
  choice: thấy họ có vẻ buồn rầu
  rationale: 'Trong tiếng Việt, “có vẻ” truyền đạt tự nhiên sắc thái trình hiện của הִנֵּה: tình trạng của họ hiện rõ trước mắt Giô-sép. “Buồn rầu” phù hợp ngữ cảnh và vẫn để ngỏ sắc thái ủ rũ, phiền muộn của זֹעֲפִים.'
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Tránh dịch máy móc וְהִנָּם là “và kìa”, vì trong câu tiếng Việt này “có vẻ” chuyển tải tự nhiên hơn việc Giô-sép nhận thấy tình trạng hiện rõ của họ.
