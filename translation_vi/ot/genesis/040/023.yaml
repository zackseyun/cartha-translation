  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “không nhớ đến... mà quên” của tiếng Hê-bơ-rơ thay vì rút gọn, nhằm bảo toàn nét nhấn mạnh của câu.
