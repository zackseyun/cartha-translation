  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: vi
  text: Nhưng viên quan đứng đầu những người dâng rượu không nhớ đến Giô-sép[a], mà quên ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và viên quan đứng đầu những người dâng rượu không nhớ đến Giô-sép, mà quên ông.”'
    reason: Liên từ וְ có thể được hiểu theo nghĩa nối tiếp đơn giản là “Và”, thay vì sắc thái tương phản “Nhưng”.
lexical_decisions:
- source_word: וְ/לֹא
  choice: Nhưng ... không
  rationale: Liên từ kèm phủ định nối với việc lời giải mộng vừa được ứng nghiệm, đồng thời tạo nét tương phản; “Nhưng” diễn đạt tự nhiên chức năng diễn ngôn này.
- source_word: זָכַר
  choice: nhớ đến
  rationale: Giữ nghĩa thông thường là “nhớ”; trong ngữ cảnh, điều này hàm ý nhớ và hành động giúp Giô-sép, nhưng bản dịch không diễn giải quá mức.
- source_word: שַׂר הַמַּשְׁקִים
  choice: quan chánh chước
  rationale: Đây là chức quan cao cấp phụ trách đồ uống của Pha-ra-ôn; “quan chánh chước” là cách gọi ngắn gọn, trang trọng và quen thuộc trong văn mạch Kinh Thánh tiếng Việt.
- source_word: אֶת יוֹסֵף
  choice: Giô-sép
  rationale: Dấu chỉ trực tiếp túc từ không cần biểu đạt riêng trong tiếng Việt; tên riêng được phiên âm theo lối quen dùng.
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: mà quên ông
  rationale: Động từ có nghĩa là “quên”, với hậu tố ngôi ba số ít chỉ Giô-sép. “Mà” giữ sự nối tiếp có sắc thái đối chiếu và phép nhắc lại nhấn mạnh của nguyên văn.
theological_decisions: []
