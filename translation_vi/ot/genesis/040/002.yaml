  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: vi
  text: 'Pha-ra-ôn nổi giận với hai quan chức[a] của mình: viên chánh dâng rượu và viên chánh làm bánh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “hai quan trong triều” hay “hai hoạn quan”; từ Hê-bơ-rơ này có thể mang các nghĩa ấy tùy văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: nổi giận
  rationale: Động từ קצף diễn tả sự tức giận; “nổi giận” tự nhiên trong văn kể chuyện và thể hiện diễn tiến của động từ wayyiqtol mà không cường điệu mức độ.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm quen thuộc trong tiếng Việt đối với tước hiệu vua Ai Cập.
- source_word: שְׁנֵי סָרִיסָיו
  choice: hai quan chức của mình
  rationale: סָרִיס có thể chỉ quan chức triều đình hoặc hoạn quan. Trong ngữ cảnh này, hai người được xác định bằng chức vụ trong cung, nên “quan chức” truyền đạt đúng vai trò mà không khẳng định tình trạng thể chất không chắc chắn.
- source_word: שַׂר הַמַּשְׁקִים
  choice: quan chánh chước tửu
  rationale: Cụm từ chỉ người đứng đầu những người phục vụ đồ uống cho vua. “Quan chánh chước tửu” là tước gọi ngắn gọn, trang trọng và quen thuộc trong văn cảnh cung đình.
- source_word: שַׂר הָאֹפִים
  choice: quan chánh đầu bếp
  rationale: Cụm từ chỉ người đứng đầu các thợ làm bánh. “Quan chánh đầu bếp” diễn đạt rõ đây là chức vụ đứng đầu trong cung.
- source_word: עַל ... עַל ... וְעַל
  choice: với ... với ... và với
  rationale: Sau động từ chỉ sự tức giận, עַל đánh dấu đối tượng của cơn giận. Việc lặp “với” vừa tự nhiên trong tiếng Việt vừa giữ cấu trúc lặp của nguyên văn, trong đó hai chức danh giải thích cụ thể hai quan chức.
