  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ וַ/הֲשִֽׁיבְ/ךָ֖ עַל כַּנֶּ֑/ךָ וְ/נָתַתָּ֤ כוֹס פַּרְעֹה֙ בְּ/יָד֔/וֹ כַּ/מִּשְׁפָּט֙ הָֽ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽ/הוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: vi
  text: Còn ba ngày nữa, Pha-ra-ôn sẽ cất đầu ngươi lên[a] và phục chức cho ngươi. Ngươi sẽ đặt chén của Pha-ra-ôn vào tay vua như lệ trước, khi ngươi còn làm quan dâng rượu cho vua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “cất đầu ngươi lên.” Ở đây, thành ngữ này nói đến việc được đoái đến và phục chức; cách nói sát nguyên văn cũng tạo sự tương phản với câu 19.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Còn ba ngày nữa
  rationale: Diễn đạt tự nhiên khoảng thời gian còn lại trước khi sự việc xảy ra, đồng thời giữ sắc thái hướng tới tương lai của thành ngữ Hê-bơ-rơ.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: sẽ cất đầu ngươi lên
  rationale: Giữ hình ảnh sát nguyên văn và mối liên hệ văn chương với cách dùng tương phản ở câu 19; mệnh đề kế tiếp cho thấy tại đây thành ngữ mang nghĩa thuận lợi.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: và phục chức cho ngươi
  rationale: כֵּן ở đây chỉ vị trí hay chức vụ đã được ấn định trong triều đình; “phục chức” diễn đạt gọn và rõ hành động đưa người ấy trở lại chức vụ cũ.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: Ngươi sẽ đặt chén của Pha-ra-ôn vào tay vua
  rationale: Giữ hành động cụ thể của נתן và hình ảnh nghi lễ của quan dâng rượu; dùng “vua” để quy chiếu tự nhiên về Pha-ra-ôn mà không gây lặp nặng.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: như lệ trước
  rationale: מִשְׁפָּט trong ngữ cảnh này là lệ hay cách thức phục vụ đã có trước kia, không nhất thiết mang nghĩa luật pháp hoặc phán quyết.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: khi ngươi còn làm quan dâng rượu cho vua
  rationale: מַשְׁקֶה chỉ chức vụ triều đình chuyên dâng rượu; cách gọi này rõ nghĩa hơn “quan tửu chánh” đối với độc giả hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đại từ “ngươi” phù hợp lời Giô-sép nói trực tiếp trong bối cảnh cổ đại; dùng “quan dâng rượu” thay cho thuật ngữ Hán-Việt ít thông dụng. Dấu chân chú [a] xuất hiện ngay sau thành ngữ cần giải thích.
