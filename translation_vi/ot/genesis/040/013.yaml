  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành tố của tiếng Hê-bơ-rơ: khoảng thời gian còn lại (“Còn ba ngày nữa”), thành ngữ “cất đầu ngươi lên,” sự phục hồi chức vị, hành động đặt chén vào tay Pha-ra-ôn, và lệ phục vụ trước đây khi người nghe là quan dâng rượu. Cách giữ nguyên thành ngữ ở mệnh đề đầu bảo toàn chủ ý liên kết với cách dùng tương phản ở câu 19.'
