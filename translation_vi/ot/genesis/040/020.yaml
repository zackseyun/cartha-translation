  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י י֚וֹם הֻלֶּ֣דֶת אֶת פַּרְעֹ֔ה וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָ֑י/ו וַ/יִּשָּׂ֞א אֶת רֹ֣אשׁ שַׂ֣ר הַ/מַּשְׁקִ֗ים וְ/אֶת רֹ֛אשׁ שַׂ֥ר הָ/אֹפִ֖ים בְּ/ת֥וֹךְ עֲבָדָֽי/ו׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: vi
  text: Đến ngày thứ ba, là sinh nhật Pha-ra-ôn, vua mở tiệc đãi tất cả bề tôi mình. Vua cất đầu của quan chánh tửu và đầu của quan chánh bánh lên giữa các bề tôi mình[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, theo cách diễn ý: “vua đưa quan chánh tửu và quan chánh bánh ra trước” hoặc “vua xét đến hai viên quan ấy.” Nguyên văn tiếng Hê-bơ-rơ là “cất đầu ... lên”; cách nói này được giữ lại vì phần chung quanh dùng cùng một thành ngữ nhưng dẫn đến hai kết cục khác nhau cho hai viên quan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Đến ngày thứ ba
  rationale: Diễn đạt tự nhiên diễn tiến của câu chuyện và giữ nguyên mốc thời gian của tiếng Hê-bơ-rơ.
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: là sinh nhật Pha-ra-ôn
  rationale: Cách nói hiện đại, tự nhiên cho ý 'ngày Pha-ra-ôn được sinh ra'.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: vua mở tiệc
  rationale: Diễn đạt tự nhiên hành động tổ chức một yến tiệc; dùng 'vua' để tránh đại từ mơ hồ trong tiếng Việt.
- source_word: לְכָל עֲבָדָיו
  choice: đãi tất cả bề tôi mình
  rationale: Trong bối cảnh triều đình, עֲבָדִים chỉ những người phục vụ và thuộc viên của vua; 'bề tôi' trang trọng, dễ hiểu và không áp đặt nghĩa 'nô lệ'.
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: cất đầu ... lên
  rationale: 'Giữ hình ảnh nguyên văn và lối chơi chữ xuyên suốt câu chuyện: cùng một thành ngữ dẫn đến hai kết cục trái ngược cho hai viên quan.'
- source_word: שַׂר הַמַּשְׁקִים
  choice: quan chánh tửu
  rationale: Chức quan đứng đầu việc dâng rượu trong cung; cách gọi ngắn gọn, trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: שַׂר הָאֹפִים
  choice: quan chánh bánh
  rationale: Chức quan đứng đầu nhóm làm bánh; giữ cấu trúc song song với 'quan chánh tửu'.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: Giữa các bề tôi
  rationale: Thể hiện hành động diễn ra công khai giữa những người phục vụ vua.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ thành ngữ 'cất đầu… lên' nhằm bảo toàn lối chơi chữ của nguyên tác, đồng thời chú thích nghĩa diễn ý. 'Bề tôi' phù hợp bối cảnh hoàng cung; các chức danh dùng lối gọi quen thuộc trong tiếng Việt.
