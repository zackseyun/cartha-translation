  source_fidelity: 'Bản nháp chuyển tải đúng ngày thứ ba, sinh nhật Pha-ra-ôn, yến tiệc dành cho toàn thể bề tôi, và cố ý giữ thành ngữ Hê-bơ-rơ “cất đầu ... lên.” Tuy nhiên, cụm trạng ngữ “Giữa các bề tôi” được đặt đầu câu làm liên hệ cú pháp với hành động “cất đầu” chưa thật rõ. Đặt cụm này sát cuối mệnh đề phản ánh rõ hơn בְּתוֹךְ עֲבָדָיו: hành động diễn ra công khai giữa các bề tôi của vua.'
