  terminology: Giữ “Pha-ra-ôn,” “bề tôi,” “quan chánh tửu,” và “quan chánh bánh” nhất quán với bối cảnh triều đình. Chú thích cần nêu rõ đây là thành ngữ theo nghĩa đen và giải thích các cách hiểu diễn ý mà không quyết định trước kết cục của từng viên quan.
