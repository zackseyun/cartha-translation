revisions:
- from: Còn ba ngày nữa, Pha-ra-ôn sẽ nhấc đầu ngươi lên khỏi thân ngươi[a], rồi treo ngươi trên một cây[b]; chim chóc sẽ ăn thịt ngươi khỏi thân ngươi.
  to: Còn ba ngày nữa, Pha-ra-ôn sẽ nhấc đầu ngươi lên khỏi thân thể ngươi[a], rồi treo ngươi trên một cây[b]; chim chóc sẽ ăn thịt trên thân thể ngươi.
  rationale: Bản sửa chỉ cải thiện tính tự nhiên và khả năng hiểu của tiếng Việt. Cụm “nhấc đầu ngươi lên khỏi thân thể ngươi” tiếp tục giữ lối nói cố ý gây căng thẳng của tiếng Hê-bơ-rơ, với chú thích giải thích hàm ý. Câu cuối chuyển sự lặp lại mặt chữ vốn gượng trong tiếng Việt thành hình ảnh tương đương “thịt trên thân thể ngươi”, không xác định thêm phương thức hành quyết hay làm nhẹ tính khắc nghiệt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:33:48Z'
