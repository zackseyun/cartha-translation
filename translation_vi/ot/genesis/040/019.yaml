source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת רֹֽאשְׁ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/תָלָ֥ה אוֹתְ/ךָ֖ עַל עֵ֑ץ וְ/אָכַ֥ל הָ/ע֛וֹף אֶת בְּשָׂרְ/ךָ֖ מֵ/עָלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: vi
  text: Còn ba ngày nữa, Pha-ra-ôn sẽ nhấc đầu ngươi lên khỏi thân thể ngươi[a], rồi treo ngươi trên một cây[b]; chim chóc sẽ ăn thịt trên thân thể ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “nhấc đầu ngươi lên khỏi ngươi”. Có lẽ đây là lối chơi chữ nghiệt ngã với cùng cách nói mang nghĩa tích cực trong lời giải giấc mơ của quan dâng rượu; ở đây, nó hàm ý đầu bị lấy khỏi thân.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “treo ngươi trên gỗ” hoặc “đóng ngươi trên một cọc”. Tiếng Hê-bơ-rơ nói: “trên một cây”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Còn ba ngày nữa
  rationale: Diễn đạt tự nhiên khoảng thời gian còn lại trước khi sự việc xảy ra, sát với thành ngữ Hê-bơ-rơ.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: sẽ nhấc đầu ngươi lên khỏi thân ngươi
  rationale: Giữ hình ảnh nguyên văn và lối chơi chữ nghiệt ngã với cùng cụm từ mang nghĩa tích cực ở câu 13; phần “khỏi thân ngươi” cho thấy ở đây đầu bị lấy khỏi thân.
- source_word: וְתָלָה אֹתְךָ עַל עֵץ
  choice: rồi treo ngươi trên một cây
  rationale: תלה là “treo”, còn עֵץ có thể chỉ cây, gỗ hoặc một cọc bằng gỗ. “Một cây” giữ được hình thức từ vựng và sự mơ hồ của nguyên bản.
- source_word: וְאָכַל הָעוֹף
  choice: chim chóc sẽ ăn
  rationale: עוֹף là danh từ tập hợp chỉ loài chim hoặc sinh vật có cánh; “chim chóc” là cách nói tập hợp tự nhiên trong tiếng Việt, còn “ăn” phản ánh nghĩa thông thường của אכל.
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: thịt ngươi khỏi thân ngươi
  rationale: Giữ hình ảnh cụ thể, khủng khiếp của בשר và cố ý bảo toàn sự lặp lại của מֵעָלֶיךָ, dù cấu trúc tiếng Việt có phần gồ ghề.
theological_decisions:
- issue: Diễn đạt hình ảnh hành quyết mà không làm nhẹ lời phán xét hoặc giải nghĩa quá mức lối chơi chữ
  choice: Giữ cách nói “nhấc đầu ngươi lên khỏi thân ngươi” và “treo ngươi trên một cây”.
  alternative: 'Diễn giải trực tiếp: “Pha-ra-ôn sẽ chém đầu ngươi rồi treo xác ngươi trên một cọc”.'
  rationale: Cách diễn giải trực tiếp làm rõ phương thức hành quyết nhưng xóa đi tiếng vọng văn chương với câu 13 và quyết định dứt khoát rằng đây là chém đầu rồi đóng hoặc treo trên cọc. Bản dịch được chọn giữ sự căng thẳng và mức độ mơ hồ của tiếng Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm và trực diện. Dùng đại từ “ngươi” phù hợp lời Giô-sép nói với viên quan trong bối cảnh cổ đại; giữ hình ảnh khắc nghiệt và sự lặp lại đáng chú ý của nguyên bản.
