  source_fidelity: Bản dịch phản ánh đúng mốc thời gian, lối chơi chữ đen tối của נשא את־ראשך מעליך, hình ảnh treo trên עץ, và chi tiết chim ăn xác thịt. Tuy nhiên, cụm kết “ăn thịt ngươi khỏi thân ngươi” không tự nhiên trong tiếng Việt; việc giữ lặp lại theo mặt chữ không cần dẫn đến cú pháp gượng ép.
  naturalness: “Còn ba ngày nữa”, “Pha-ra-ôn”, “ngươi”, và “chim chóc” phù hợp tiếng Việt hiện đại trong văn cảnh Kinh Thánh trang trọng. Đổi “thân” thành “thân thể” trong hai chỗ giúp rõ nghĩa và tự nhiên hơn; câu cuối được điều chỉnh để diễn đạt mạch lạc mà vẫn giữ hình ảnh xác thịt ở trên thân thể.
  terminology: “Pha-ra-ôn”, “Hê-bơ-rơ”, “treo”, “cây”, và “thịt” đều thích hợp. Chú thích b bảo lưu đúng sự mơ hồ của עץ và các khả năng diễn giải về dụng cụ hành hình. Chú thích a giải thích lối chơi chữ mà không biến phần thân văn thành một cách diễn giải quá mức.
