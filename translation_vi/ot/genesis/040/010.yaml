  yaml_path: translation/ot/genesis/040/010.yaml
  text: and on the vine were three branches[a]. As it was budding, its blossoms came up[b], and its clusters ripened into grapes.
translation:
  language: vi
  text: Trên cây nho có ba nhánh[a]. Khi cây đang đâm chồi, hoa của nó nở ra[b], rồi các chùm nho của nó chín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ba tua cuốn” hoặc “ba chồi”.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ sát nghĩa là: “và nó, như đang đâm chồi, hoa của nó mọc lên”; câu này mô tả cây nho nhanh chóng chuyển từ đâm chồi sang nở hoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: Trên cây nho
  rationale: Giới từ ב trong ngữ cảnh chỉ các nhánh mọc trên cây nho; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: שָׂרִיגִם
  choice: nhánh
  rationale: Từ này chỉ phần mọc ra của cây nho; “nhánh” phổ thông và phù hợp hơn “tua cuốn”, trong khi khả năng “chồi” được ghi ở chú thích.
- source_word: כְפֹרַחַת
  choice: Khi cây vừa đâm chồi
  rationale: Diễn đạt giai đoạn đầu trong tiến trình phát triển nhanh của cây nho, giữ sắc thái thời gian của כְּ với phân từ.
- source_word: עָלְתָה נִצָּהּ
  choice: hoa liền nở ra
  rationale: Chuyển hình ảnh hoa xuất hiện thành cách nói tự nhiên, đồng thời “liền” làm rõ diễn tiến nhanh được cấu trúc câu gợi lên.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: các chùm kết thành nho chín
  rationale: Tái hiện tự nhiên ý các chùm trên cây đạt đến độ chín thành những chùm nho, tránh lối dịch sát chữ khó hiểu.
