translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cây nho” để xác định rõ vật quy chiếu; giữ chuỗi phát triển đâm chồi—nở hoa—nho chín và đặt đầy đủ các ký hiệu chú thích trong chính văn.
