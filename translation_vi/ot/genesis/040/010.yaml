  to: Trên cây nho có ba nhánh[a]. Khi cây đang đâm chồi, hoa của nó nở ra[b], rồi các chùm nho của nó chín.
  rationale: Sửa mệnh đề cuối để phản ánh đúng hơn quan hệ giữa “chùm” và “nho” trong tiếng nguồn, đồng thời tạo câu tiếng Việt tự nhiên. Loại bỏ “liền” để không tăng cường sắc thái ngoài chính văn. Các chú thích giữ nguyên neo [a] và [b] và tiếp tục phản ánh những lựa chọn từ vựng liên quan.
