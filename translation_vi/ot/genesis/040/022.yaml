  yaml_path: translation/ot/genesis/040/022.yaml
  text: But he hanged the chief baker[a], just as Joseph had interpreted to them.
translation:
  language: vi
  text: Còn quan trưởng ban bánh thì vua treo lên[a], đúng như Giô-sép đã giải nghĩa cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “treo”. Động từ Hê-bơ-rơ có nghĩa là treo; trong một số ngữ cảnh, người ta hiểu là đóng đinh hay cắm trên cọc, hoặc treo thi thể sau khi hành quyết.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Còn
  rationale: Liên từ mở đầu cùng dấu chỉ tân ngữ tạo thế tương phản với việc quan chước tửu được phục chức ở câu trước; “Còn” diễn đạt tự nhiên mạch đối chiếu ấy trong tiếng Việt.
- source_word: שַׂר הָאֹפִים
  choice: quan quan bánh
  rationale: שַׂר chỉ một viên chức đứng đầu; “quan quan bánh” là cách gọi ngắn gọn, dễ hiểu về người phụ trách việc làm bánh trong triều.
- source_word: תָּלָה
  choice: treo lên
  rationale: Động từ cơ bản có nghĩa là treo; cách dịch này giữ được độ rộng ngữ nghĩa của tiếng Hê-bơ-rơ, không xác quyết phương thức hành hình là treo cổ hay đóng/cắm trên cọc.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Cụm từ nhấn mạnh sự việc xảy ra tương ứng chính xác với lời giải nghĩa trước đó.
- source_word: פָּתַר
  choice: đã giải nghĩa
  rationale: Trong ngữ cảnh giấc mơ, động từ có nghĩa là giải nghĩa; “đã” thể hiện hành động này xảy ra trước sự ứng nghiệm.
- source_word: לָהֶם
  choice: cho họ
  rationale: Đại từ số nhiều quy về cả hai viên quan; tiếng Việt tự nhiên dùng “giải nghĩa cho họ”.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dạng phiên âm tên riêng quen dùng và rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Phương thức mà quan quan bánh bị giết hoặc bị bêu xác
  choice: Giữ động từ rộng nghĩa “treo lên” và chú thích khả năng diễn giải
  alternative: “treo cổ” hoặc “đóng/cắm trên cọc”
  rationale: תָּלָה tự nó diễn tả việc treo, còn ngữ cảnh không đủ để ấn định chắc chắn kỹ thuật hành hình; bản dịch không nên thu hẹp sự mơ hồ thực có của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Còn ... thì ...” làm rõ sự tương phản với câu trước; chú thích bảo tồn sự không chắc chắn về phương thức hành hình.
