  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: vi
  text: Và trong giỏ trên cùng có đủ loại thức ăn dành cho Pha-ra-ôn, do thợ làm bánh làm ra; chim đang ăn những thứ ấy từ chiếc giỏ ở trên đầu tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “công việc của thợ làm bánh,” tức các món do thợ làm bánh làm ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: còn trong giỏ trên cùng
  rationale: עֶלְיוֹן chỉ chiếc giỏ ở vị trí cao nhất; “giỏ trên cùng” tự nhiên và giữ rõ quan hệ không gian.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: có đủ loại thức ăn dành cho Pha-ra-ôn
  rationale: מִכֹּל đi với danh từ tập hợp מַאֲכַל diễn tả nhiều loại thức ăn; thêm “có” để câu không động từ trong tiếng Hê-bơ-rơ tự nhiên trong tiếng Việt.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: là sản phẩm của thợ làm bánh
  rationale: Cụm từ có nghĩa đen là “công việc của thợ làm bánh,” nhưng trong ngữ cảnh chỉ các món do thợ làm bánh làm ra; “sản phẩm” vừa rõ nghĩa vừa không thu hẹp vào một loại bánh cụ thể.
- source_word: וְהָעוֹף
  choice: và chim chóc
  rationale: עוֹף là danh từ tập hợp chỉ loài chim hoặc sinh vật có cánh; “chim chóc” truyền đạt tự nhiên ý nghĩa tập hợp.
- source_word: אֹכֵל
  choice: đang ăn
  rationale: Phân từ diễn tả hành động đang tiếp diễn trong cảnh chiêm bao.
- source_word: אֹתָם
  choice: những thứ ấy
  rationale: Hậu tố số nhiều giống đực quy chiếu đến các món ăn; cách diễn đạt này giữ số nhiều và tự nhiên hơn việc dùng đại từ chỉ người.
- source_word: מִן הַסַּל
  choice: từ chiếc giỏ
  rationale: מִן đánh dấu nguồn hoặc nơi lấy ra; “từ chiếc giỏ” sát nghĩa và tự nhiên.
- source_word: מֵעַל רֹאשִׁי
  choice: ở trên đầu tôi
  rationale: מֵעַל biểu thị vị trí phía trên; cách dịch này giữ khả năng chiếc giỏ ở trên hoặc trên đầu mà không khẳng định quá mức sắc thái tiếp xúc trực tiếp.
