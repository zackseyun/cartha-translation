    rationale: וּ־ là liên từ nối đơn thuần (“và”); “còn” có thể gợi thế đối lập hoặc chuyển ý. Dùng “Và” sát nguồn hơn mà vẫn tự nhiên trong ngữ cảnh lời thuật giấc mơ.
  - severity: low
    issue: “sản phẩm của thợ làm bánh”
    rationale: Cách nói này có sắc thái sản xuất/thương mại. Cụm “do thợ làm bánh làm ra” diễn đạt tự nhiên hơn מַעֲשֵׂה אֹפֶה mà không giới hạn thức ăn vào một loại bánh.
  - severity: medium
    issue: Chú thích thu hẹp nghĩa thành “các món bánh”
    rationale: מַעֲשֵׂה אֹפֶה có nghĩa sát chữ là “công việc của thợ làm bánh” và có thể chỉ các món do thợ làm bánh chế biến; “các món bánh” là diễn giải hẹp hơn. Chú thích nên nêu cách dịch sát chữ, rồi giải thích khả năng nghĩa trong ngữ cảnh.
