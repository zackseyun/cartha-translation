    rationale: Nguyên văn không nói sát nghĩa “ở trong nơi giam giữ” hoặc “ở đó”; cần phân biệt cấu trúc sát nghĩa với lời giải thích thành ngữ, và không thêm “nhiều” như một chi tiết có mặt rõ ràng trong câu.
