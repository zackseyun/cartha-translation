    rationale: Cụm “ở bên họ” chủ yếu nêu vị trí, trong khi động từ chính nói đến việc viên chỉ huy cử hoặc giao Giô-sép trong quan hệ với họ. “Cử Giô-sép đến với họ” giữ được sự không xác định về mức độ giám sát.
  - severity: medium
