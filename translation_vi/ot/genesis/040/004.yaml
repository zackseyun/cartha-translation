  text: וַ֠/יִּפְקֹד שַׂ֣ר הַ/טַּבָּחִ֧ים אֶת יוֹסֵ֛ף אִתָּ֖/ם וַ/יְשָׁ֣רֶת אֹתָ֑/ם וַ/יִּהְי֥וּ יָמִ֖ים בְּ/מִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: vi
  text: Quan chỉ huy thị vệ cử Giô-sép đến với họ[a], và ông phục vụ họ; họ bị giam giữ một thời gian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giao Giô-sép phụ trách họ” hoặc “cử Giô-sép ở với họ”. Động từ Hê-bơ-rơ có thể chỉ việc bổ nhiệm vào một trách nhiệm; vì thế, quan hệ của Giô-sép với các tù nhân có thể được hiểu là phục vụ họ hoặc trông coi họ.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa sát: “họ đã ở trong sự giam giữ nhiều ngày.” Đây là một cách nói Hê-bơ-rơ chỉ việc họ ở trong tình trạng ấy một khoảng thời gian.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּפְקֹד ... אֶת־יוֹסֵף אִתָּם
  choice: chỉ định Giô-sép ở bên họ
  rationale: Động từ פקד diễn tả việc chỉ định hay giao trách nhiệm; cụm אִתָּם theo nghĩa sát là “với họ”. Cách dịch này giữ được quan hệ giữa Giô-sép và hai tù nhân mà không khẳng định quá mức rằng ông cai quản họ.
- source_word: שַׂר הַטַּבָּחִים
  choice: quan chỉ huy thị vệ
  rationale: Danh xưng này theo nghĩa từ nguyên liên quan đến người hành quyết, nhưng trong bối cảnh Sáng Thế Ký chỉ một viên quan cao cấp phụ trách an ninh hoàng gia và việc giam giữ. “Quan chỉ huy thị vệ” tự nhiên và phù hợp ngữ cảnh.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: và ông phục vụ họ
  rationale: שרת có nghĩa là phục vụ hoặc hầu cận. “Phục vụ họ” là cách diễn đạt trực tiếp, trang trọng vừa phải và không thêm sắc thái tôn giáo.
- source_word: וַיִּהְיוּ יָמִים
  choice: một thời gian
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “họ ở đó nhiều ngày”, một lối nói chỉ một khoảng thời gian không xác định.
- source_word: בְּמִשְׁמָר
  choice: bị giam giữ
  rationale: מִשְׁמָר nhấn mạnh tình trạng bị canh giữ hoặc câu lưu; “bị giam giữ” chính xác hơn việc mặc định một loại nhà tù cụ thể.
theological_decisions:
- issue: Vai trò của Giô-sép đối với hai tù nhân
  choice: Dịch là “chỉ định Giô-sép ở bên họ” và ghi chú khả năng ông được giao phụ trách họ.
  alternative: “giao Giô-sép phụ trách họ”
  rationale: Nguyên văn vừa có thể gợi việc chỉ định để phục vụ vừa có thể hàm ý trao trách nhiệm giám sát. Bản chính không loại bỏ quan hệ phục vụ được nêu ngay sau đó, còn chú thích bảo lưu cách hiểu về quyền phụ trách.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, rõ ràng và trang nghiêm. Cấu trúc câu giữ tính nối tiếp của nguyên văn nhưng được chia nhịp tự nhiên; tránh thuật ngữ tôn giáo chuyên biệt và bảo lưu sự mơ hồ thật sự về mức độ trách nhiệm của Giô-sép.
