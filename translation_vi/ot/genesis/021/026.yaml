  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: vi
  text: 'A-bi-mê-léc đáp: “Tôi không biết ai đã làm việc này. Ông cũng không nói cho tôi biết, và chính tôi cũng chỉ mới nghe nói đến việc ấy hôm nay.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: A-bi-mê-léc đáp
  rationale: Động từ nói tiếp nối lời của Áp-ra-ham trong đối thoại; “đáp” diễn đạt tự nhiên chức năng ngữ cảnh của וַיֹּאמֶר mà không thêm nội dung.
- source_word: לֹא יָדַעְתִּי
  choice: Tôi không biết
  rationale: Dạng qatal diễn tả tình trạng không biết của A-bi-mê-léc; tiếng Việt không bắt buộc đánh dấu thì và cách dịch này giữ được phạm vi thời gian theo ngữ cảnh.
- source_word: מִי עָשָׂה
  choice: ai đã làm
  rationale: “Đã” cho thấy hành động xảy ra trước lời nói, còn “ai” giữ nguyên câu hỏi gián tiếp về tác nhân.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: việc này
  rationale: דָּבָר trong ngữ cảnh chỉ sự việc đang bị khiếu trách; “việc này” tự nhiên và đủ rộng trong tiếng Việt.
- source_word: וְגַם אַתָּה לֹא הִגַּדְתָּ לִּי
  choice: Ông cũng không nói cho tôi biết
  rationale: “Cũng” giữ sắc thái bao hàm/nhấn mạnh của גַּם; “nói cho tôi biết” là cách diễn đạt hiện đại, tự nhiên của הגיד לִי.
- source_word: וְגַם אָנֹכִי לֹא שָׁמַעְתִּי
  choice: và chính tôi cũng chưa hề nghe nói đến việc ấy
  rationale: “Chính tôi” phản ánh đại từ אָנֹכִי có tính nhấn mạnh; “chưa hề nghe nói đến” diễn đạt việc hoàn toàn chưa nhận được tin về sự việc.
- source_word: בִּלְתִּי הַיּוֹם
  choice: cho mãi đến hôm nay
  rationale: Cụm này giới hạn tình trạng chưa nghe biết đến ngày hiện tại; “cho mãi đến hôm nay” truyền đạt rõ sắc thái thời gian và nhấn mạnh.
theological_decisions: []
translation_notes:
  register: Văn phong đối thoại trang trọng, tự nhiên và dễ hiểu. Dùng “ông” phù hợp lời nói giữa hai nhân vật trưởng thành có địa vị; tên riêng được phiên âm theo quy ước tiếng Việt. Không thêm chú thích vì “việc này” truyền đạt tự nhiên độ rộng nghĩa của דָּבָר trong chính văn.
