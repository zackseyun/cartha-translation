translation:
  language: vi
  text: Áp-ra-ham sống kiều ngụ trong đất của người Phi-li-tin trong nhiều ngày[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ở lại trong đất của người Phi-li-tin một thời gian dài.” Động từ Hê-bơ-rơ có thể nhấn mạnh việc cư trú với tư cách người ngoại kiều.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: kiều ngụ
  rationale: Động từ גּוּר chỉ việc cư trú với tư cách người ngoại kiều hoặc người tạm trú. “Kiều ngụ” giữ được sắc thái này, thay vì chỉ nói chung là “ở lại”.
- source_word: בְּאֶרֶץ
  choice: trong đất
  rationale: אֶרֶץ ở đây chỉ vùng lãnh thổ; “trong đất” là cách dịch gọn, phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: פְּלִשְׁתִּים
  choice: người Phi-li-tin
  rationale: Tên gọi quen thuộc trong tiếng Việt cho dân tộc Philistines; cấu trúc sở hữu được diễn đạt tự nhiên là “đất của người Phi-li-tin”.
- source_word: יָמִים רַבִּים
  choice: nhiều ngày
  rationale: Giữ sát thành ngữ Hê-bơ-rơ, nghĩa đen là “nhiều ngày”; trong ngữ cảnh cũng có thể hiểu là một thời gian dài.
- source_word: וַ
  choice: không dịch thành từ nối riêng
  rationale: Tiền tố waw tiếp nối mạch kể chuyện. Trong một câu tiếng Việt đứng riêng, bỏ từ “và” ở đầu câu tự nhiên hơn mà không làm mất nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kiều ngụ” hơi mang sắc thái văn chương nhưng diễn đạt chính xác địa vị cư trú như một người ngoại kiều; chú thích cung cấp cách nói thông dụng hơn.
