base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/015.yaml
  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: vi
  text: Khi nước trong túi da đã cạn[a], bà ném đứa trẻ dưới một trong những bụi cây[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Túi da” là vật chứa làm từ da thú, thường dùng để đựng nước.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ mang nghĩa mạnh là “ném” hoặc “quăng”, chứ không chỉ là “đặt” đứa trẻ dưới bụi cây.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ
  choice: đã cạn
  rationale: Động từ כלה ở đây diễn tả nước đã hết hoặc bị dùng hết; “đã cạn” tự nhiên trong tiếng Việt và giữ được ý nguồn nước trong vật chứa không còn nữa.
- source_word: הַמַּיִם
  choice: nước
  rationale: Dù hình thức Hê-bơ-rơ là số nhiều, מַיִם thường là danh từ khối; tiếng Việt tự nhiên dùng “nước”.
- source_word: מִן הַחֵמֶת
  choice: trong túi da
  rationale: חֵמֶת chỉ vật chứa làm bằng da thú, dùng đựng chất lỏng. “Túi da” vừa rõ nghĩa vừa giữ hình ảnh của nguyên văn; “trong” diễn đạt tự nhiên rằng nước chứa trong đó đã cạn.
- source_word: וַתַּשְׁלֵךְ
  choice: bà ném ... xuống
  rationale: שלך có nghĩa mạnh là ném/quăng, không chỉ đơn thuần đặt. “Ném ... xuống” giữ sự đột ngột và đau đớn của hành động mà không làm nhẹ động từ.
- source_word: אֶת הַיֶּלֶד
  choice: đứa trẻ
  rationale: יֶלֶד có thể chỉ một đứa trẻ hoặc con trai. “Đứa trẻ” là cách gọi tự nhiên, không áp đặt độ tuổi cụ thể hơn mức nguyên văn.
- source_word: תַּחַת אַחַד הַשִּׂיחִם
  choice: dưới một trong những bụi cây
  rationale: Cụm từ có nghĩa đen là “dưới một [cây] trong số các bụi cây”; bản dịch giữ cả vị trí và cấu trúc lựa chọn của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” cho chủ thể nữ đã được xác định trong ngữ cảnh; giữ động từ mạnh “ném” để không làm nhẹ sắc thái của nguyên văn.
