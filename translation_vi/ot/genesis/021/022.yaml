  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ אֶל אַבְרָהָ֖ם לֵ/אמֹ֑ר אֱלֹהִ֣ים עִמְּ/ךָ֔ בְּ/כֹ֥ל אֲשֶׁר אַתָּ֖ה עֹשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: vi
  text: 'Vào thời ấy, A-bi-mê-léc cùng Phi-côn, tư lệnh quân đội của A-bi-mê-léc, nói với Áp-ra-ham: “Đức Chúa Trời[a] ở cùng ông trong mọi việc ông làm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu, dù ít phù hợp với ngữ cảnh hơn: “một vị thần.” Từ Hê-bơ-rơ אֱלֹהִים có thể được hiểu theo những cách khác nhau tùy ngữ cảnh, nhưng ở đây tự nhiên nhất là chỉ Đức Chúa Trời, Đấng ban phước cho Áp-ra-ham.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Vào thời ấy
  rationale: Cụm này mở đầu một cảnh mới và xác định thời điểm. “Vào thời ấy” tự nhiên trong tiếng Việt hiện đại, đồng thời giữ được chức năng trần thuật của nguyên văn.
- source_word: אֲבִימֶלֶךְ
  choice: A-bi-mê-léc
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: וּפִיכֹל
  choice: cùng Phi-côn
  rationale: Phiên âm tên riêng; “cùng” diễn đạt tự nhiên liên từ nối hai nhân vật là chủ thể của lời nói.
- source_word: שַׂר צְבָאוֹ
  choice: chỉ huy trưởng quân đội của vua
  rationale: שַׂר chỉ người đứng đầu hoặc chỉ huy, còn צָבָא ở đây là lực lượng quân sự. Dùng “của vua” thay cho đại từ có thể mơ hồ trong tiếng Việt, vì hậu tố ngôi ba số ít chỉ về A-bi-mê-léc.
- source_word: וַיֹּאמֶר ... אֶל־אַבְרָהָם לֵאמֹר
  choice: nói với Áp-ra-ham
  rationale: Động từ số ít đứng trước chủ ngữ ghép là cấu trúc Hê-bơ-rơ bình thường. לֵאמֹר là công thức dẫn lời trực tiếp; không dịch riêng thành “rằng rằng” hay “mà rằng” để câu tiếng Việt tự nhiên hơn.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong mạch văn, từ này tự nhiên nhất chỉ Đức Chúa Trời là Đấng đang ban phước và ở cùng Áp-ra-ham; chú thích vẫn bảo lưu khả năng hiểu bất định là “một vị thần”.
- source_word: עִמְּךָ
  choice: ở cùng ông
  rationale: Diễn đạt sự hiện diện và nâng đỡ của Đức Chúa Trời. “Ông” phù hợp với lời một vị vua nói với Áp-ra-ham mà không tự ý thêm sắc thái thân mật.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: trong mọi việc ông làm
  rationale: Giữ phạm vi bao quát của בְּכֹל và chuyển phân từ עֹשֶׂה thành hiện tại khái quát tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được אֱלֹהִים chỉ đến trong lời A-bi-mê-léc
  choice: Đức Chúa Trời
  alternative: một vị thần
  rationale: Dù אֱלֹהִים về hình thái có dạng số nhiều và đôi khi có thể được hiểu theo nghĩa khác, ngữ cảnh gần nói đến sự phù trợ dành cho Áp-ra-ham nên cách hiểu “Đức Chúa Trời” là tự nhiên nhất. Chú thích ghi nhận cách hiểu khác mà không xóa bỏ độ mở từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dẫn được làm gọn theo cú pháp tiếng Việt; công thức Hê-bơ-rơ לֵאמֹר không được dịch thành một từ riêng vì lời trực tiếp ngay sau dấu hai chấm đã thể hiện đầy đủ chức năng ấy.
