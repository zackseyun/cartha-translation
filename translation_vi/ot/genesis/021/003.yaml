  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: vi
  text: Áp-ra-ham đặt tên Y-sác cho con trai mình, người đã được sinh cho ông và do Sa-ra sinh cho ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֶׁם
  choice: đặt tên
  rationale: Trong cấu trúc này, קרא + שׁם mang nghĩa đặt tên. Tiếng Việt tự nhiên dùng “đặt tên”, thay vì sao phỏng thành “gọi tên của”.
- source_word: בְּנוֹ
  choice: người con trai
  rationale: Danh từ kèm hậu tố ngôi ba số ít chỉ người con trai của Áp-ra-ham; sở hữu đã rõ nhờ “cho ông” và chủ ngữ trong câu.
- source_word: הַנּוֹלַד לוֹ
  choice: đã sinh ra cho ông
  rationale: Giữ dạng bị động của phân từ và thành phần לוֹ, diễn tả người con được sinh ra cho Áp-ra-ham.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: người mà Sa-ra đã sinh cho ông
  rationale: Giữ mệnh đề quan hệ, nêu rõ Sa-ra là người sinh con và bảo toàn thành phần לוֹ được lặp lại trong nguyên văn.
- source_word: יִצְחָק
  choice: Y-sác
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt cho יִצְחָק.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ thứ tự thông tin của tiếng Hê-bơ-rơ, với tên Y-sác ở cuối làm bổ ngữ cho hành động đặt tên; sự lặp lại “cho ông” được bảo lưu vì có chủ ý trong nguyên văn.
