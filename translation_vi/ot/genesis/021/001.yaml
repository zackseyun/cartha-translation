base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: vi
  text: Yahweh đã đoái đến Sa-ra[a] như Ngài đã nói, và Yahweh đã làm cho Sa-ra đúng như Ngài đã phán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thăm viếng Sa-ra.” Động từ Hê-bơ-rơ có thể chỉ việc Đức Chúa Trời hướng sự chú ý đến một người để hành động vì người ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh giao ước bằng dạng chuyển tự quen dùng, thay vì thay bằng một tước hiệu.
- source_word: פָּקַד
  choice: đoái đến
  rationale: Trong ngữ cảnh này, động từ chỉ việc Đức Chúa Trời hướng sự quan tâm đến Sa-ra để hành động cho bà; “đoái đến” diễn đạt sự quan tâm đầy ân huệ và có hiệu quả mà không giới hạn nghĩa vào một cuộc viếng thăm theo không gian.
- source_word: אֶת שָׂרָה
  choice: Sa-ra
  rationale: Dấu chỉ trực tiếp túc từ không cần thể hiện riêng trong tiếng Việt; tên riêng được phiên âm theo lối quen thuộc.
- source_word: כַּאֲשֶׁר אָמָר
  choice: như Ngài đã nói
  rationale: Diễn tả sự ứng nghiệm lời đã nói trước đó, đồng thời dùng “nói” để giữ sự phân biệt phong cách với דִּבֵּר ở vế sau.
- source_word: וַיַּעַשׂ
  choice: đã làm
  rationale: Giữ tính khái quát của động từ Hê-bơ-rơ, không nói rõ trước kết quả được thuật lại ở câu kế tiếp.
- source_word: לְשָׂרָה
  choice: cho Sa-ra
  rationale: 'Thể hiện sắc thái thụ hưởng của giới từ ל: hành động được thực hiện cho Sa-ra và vì lợi ích của bà.'
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: như Ngài đã phán
  rationale: “Phán” phù hợp với lời Đức Chúa Trời và giúp phản ánh sự thay đổi động từ so với אָמַר trong vế đầu.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng của Đức Chúa Trời; chuyển tự “Yahweh” bảo tồn danh ấy mà không thay bằng một tước hiệu.
- issue: Mức độ xác định hành động của Đức Chúa Trời đối với Sa-ra
  choice: đoái đến
  alternative: khiến Sa-ra thụ thai
  rationale: Câu này chưa trực tiếp nêu việc thụ thai; bản dịch giữ cách nói rộng của פָּקַד và để câu sau xác định kết quả, tránh diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hai vế song song của nguyên văn, lặp lại danh Yahweh và phân biệt nhẹ giữa “nói” với “phán”; không thêm từ nối thời gian vì nguyên văn không có từ tương đương với “bấy giờ” hay “nay”.
