revisions:
- from: Yahweh đã đoái đến Sa-ra[a] như Ngài đã nói, và Yahweh đã làm cho Sa-ra như Ngài đã phán.
  to: Yahweh đã đoái đến Sa-ra[a] như Ngài đã nói, và Yahweh đã làm cho Sa-ra đúng như Ngài đã phán.
  rationale: Chỉ điều chỉnh vế thứ hai để tránh sự mơ hồ và thiếu tự nhiên của cấu trúc “làm cho Sa-ra” trong tiếng Việt hiện đại. Bản sửa không thêm kết quả cụ thể như sự thụ thai, vẫn giữ sự song hành, sự lặp lại danh Yahweh, và tính khái quát có chủ ý của nguyên văn.
