base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: vi
  text: Đức Chúa Trời ở cùng cậu bé, và cậu lớn lên. Cậu sống trong hoang mạc và trở thành một cung thủ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “trở thành người bắn cung.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: Đức Chúa Trời ở cùng cậu bé
  rationale: Thành ngữ היה את diễn tả sự hiện diện hoặc nâng đỡ. “Ở cùng” tự nhiên trong tiếng Việt, đồng thời không diễn giải quá mức bản chất của sự chăm sóc dành cho Ích-ma-ên.
- source_word: וַיִּגְדָּל
  choice: cậu lớn lên
  rationale: Trong ngữ cảnh này, động từ גדל chỉ sự trưởng thành của cậu bé; “lớn lên” tự nhiên và rõ nghĩa hơn cách dịch sát từng chữ là “trở nên lớn”.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: cậu sống trong hoang mạc
  rationale: ישב ở đây chỉ việc cư trú, còn מִדְבָּר là vùng đất hoang vắng, thưa người, không nhất thiết chỉ là sa mạc cát. “Hoang mạc” giữ được sắc thái rộng này.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: trở thành một cung thủ
  rationale: Cụm từ mô tả người bắn cung. “Cung thủ” là cách diễn đạt ngắn gọn, hiện đại và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Công thức nói về sự hiện diện của Đức Chúa Trời đối với Ích-ma-ên
  choice: Đức Chúa Trời ở cùng cậu bé
  alternative: Đức Chúa Trời giúp đỡ cậu bé
  rationale: Bản dịch giữ nguyên lời khẳng định về sự hiện diện và nâng đỡ của Đức Chúa Trời mà không thu hẹp ý nghĩa chỉ còn hành động giúp đỡ hoặc suy diễn thêm hệ quả thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cậu bé/cậu” để chỉ הַנַּעַר, tránh từ cổ “thiếu niên” trong ngữ cảnh kể chuyện; dùng “hoang mạc” để giữ phạm vi nghĩa của מִדְבָּר.
