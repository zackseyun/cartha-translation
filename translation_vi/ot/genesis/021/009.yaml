  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: vi
  text: Sa-ra thấy người con trai mà Ha-ga, người Ai Cập, đã sinh cho Áp-ra-ham đang cười.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang chế nhạo” hoặc “đang vui đùa.” Phân từ Hê-bơ-rơ có thể chỉ việc cười, vui đùa, hoặc hành vi giễu cợt; ngữ cảnh có thể gợi sắc thái thù nghịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Sa-ra thấy
  rationale: Dạng wayyiqtol của ראה tiếp nối diễn tiến câu chuyện; tiếng Việt không cần thêm liên từ để thể hiện trình tự này.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: con trai của Ha-ga, người Ai Cập
  rationale: Giữ cách nhận diện người con qua mẹ và thành phần chỉ dân tộc הַמִּצְרִית, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: là đứa con nàng đã sinh cho Áp-ra-ham
  rationale: Mệnh đề quan hệ trong nguyên văn quy chiếu tự nhiên về người con đã được nhắc đến; từ 'đã' thể hiện việc sinh xảy ra trước lúc Sa-ra nhìn thấy.
- source_word: מְצַחֵק
  choice: đang cười đùa
  rationale: Phân từ của צחק có thể chỉ cười, vui đùa hoặc mang sắc thái chế nhạo. 'Đang cười đùa' giữ nghĩa rộng và trạng thái đang diễn ra mà không áp đặt sắc thái thù nghịch.
theological_decisions:
- issue: Sắc thái hành động của con trai Ha-ga trong מְצַחֵק
  choice: Dịch trung tính là 'đang cười đùa' trong chính văn
  alternative: đang chế nhạo
  rationale: Bản thân phân từ Hê-bơ-rơ không nêu đối tượng và không buộc phải mang nghĩa thù nghịch. Ngữ cảnh và cách hiểu về sau có thể ủng hộ nghĩa 'chế nhạo', nên phương án ấy được giữ trong chú thích thay vì dùng để khép lại sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng dạng tên riêng quen thuộc trong tiếng Việt; 'nàng' giúp tránh lặp tên Ha-ga mà vẫn giữ sắc thái văn chương vừa phải.
