  rationale: Bản sửa đặt mệnh đề quan hệ đúng với người con và nêu rõ Ha-ga là chủ thể của hành động sinh, đồng thời dùng “đang cười” để bảo toàn độ mở ngữ nghĩa của מְצַחֵק. Chú thích giữ các khả năng diễn giải có cơ sở, kể cả sắc thái chế nhạo, mà không áp đặt chúng vào chính văn.
