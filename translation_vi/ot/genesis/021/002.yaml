base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: vi
  text: Sa-ra thụ thai và sinh cho Áp-ra-ham một con trai khi ông đã cao tuổi, vào thời điểm đã định mà Đức Chúa Trời đã phán với ông về thời điểm ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vào thời điểm đã định, là thời điểm Đức Chúa Trời đã phán với ông.”'
    reason: Cấu trúc mệnh đề quan hệ trong tiếng Hê-bơ-rơ quy chiếu về “thời điểm đã định”; cách dịch thay thế diễn đạt quan hệ này mà không hiểu rằng Đức Chúa Trời phán vào chính thời điểm đó.
lexical_decisions:
- source_word: וַתַּהַר
  choice: thụ thai
  rationale: Diễn đạt trực tiếp động từ הרה, chỉ việc mang thai/thụ thai, đồng thời kết hợp tự nhiên với động từ kế tiếp trong văn kể chuyện.
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Động từ ילד ở đây thuật lại việc sinh con; “sinh” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בֵּן
  choice: một con trai
  rationale: Xác định đứa trẻ là con trai; “một” phù hợp với cú pháp tiếng Việt trong lần đầu giới thiệu nhân vật.
- source_word: לְאַבְרָהָם
  choice: cho Áp-ra-ham
  rationale: 'Giữ quan hệ lợi ích/thuộc về được biểu thị bằng giới từ ל: Sa-ra sinh một người con cho Áp-ra-ham.'
- source_word: לִזְקֻנָיו
  choice: khi ông đã cao tuổi
  rationale: Diễn đạt thành ngữ chỉ hoàn cảnh thời gian lúc Áp-ra-ham đã già, không hiểu giới từ theo nghĩa mục đích.
- source_word: לַמּוֹעֵד
  choice: đúng thời điểm
  rationale: מוֹעֵד chỉ thời điểm đã được ấn định; “đúng” làm nổi bật sự trùng khớp với lời báo trước mà không thêm diễn giải thần học.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: Đức Chúa Trời đã phán với ông
  rationale: Giữ động từ “phán” và người nhận lời là Áp-ra-ham; trong tiếng Việt, mệnh đề này có thể gắn tự nhiên với “thời điểm”, nhưng cấu trúc Hê-bơ-rơ cũng cho phép lưu ý cách hiểu cụ thể hơn trong chú thích.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, thông dụng trong văn Kinh Thánh tiếng Việt dành cho אֱלֹהִים.
- source_word: וַ
  choice: và
  rationale: Giữ chức năng nối tiếp mạch kể chuyện của waw mà không nhấn mạnh quan hệ kết quả hơn mức văn bản nguồn.
theological_decisions:
- issue: Cách diễn đạt sự ứng nghiệm của lời Đức Chúa Trời về thời điểm sinh con
  choice: đúng thời điểm Đức Chúa Trời đã phán với ông
  alternative: vào thời điểm đã định mà Đức Chúa Trời đã phán với ông
  rationale: Bản dịch giữ trọng tâm về thời điểm đã được báo trước và sự ứng nghiệm, nhưng không thêm các từ như “lời hứa” hay “thành tín” vốn là suy luận thần học từ văn cảnh chứ không hiện diện trực tiếp trong câu.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “cao tuổi” thay cho cách nói cổ “tuổi già”; giữ tên riêng theo dạng phiên âm Kinh Thánh tiếng Việt quen thuộc. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
