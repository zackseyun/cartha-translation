    rationale: Động từ Hebrew diễn tả việc cho/gửi bà đi hoặc đuổi đi tùy ngữ cảnh, không nhất thiết là tiễn đưa. “cho bà đi” giữ tính trung hòa và không thêm ý hộ tống.
  - severity: low
    issue: Cụm “trao cho Ha-ga, đặt lên vai bà” chưa nêu rõ vật được đặt.
    rationale: Nguyên văn cô đọng, nhưng tiếng Việt có thể nêu “các thứ ấy” mà không thêm nghĩa, đồng thời cho thấy cụm “đặt lên vai” trước hết quy chiếu bánh và bầu nước.
  revised_text: Sáng sớm, Áp-ra-ham thức dậy, lấy bánh và một bầu da đựng nước, trao cho Ha-ga, đặt các thứ ấy lên vai bà; ông cũng giao đứa trẻ cho bà[a], rồi cho bà đi. Bà ra đi và lang thang trong hoang mạc Bê-e Sê-ba.
