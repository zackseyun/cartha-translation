language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: vi
  text: Sáng sớm, Áp-ra-ham thức dậy, lấy bánh và một bầu da đựng nước, trao cho Ha-ga, đặt các thứ ấy lên vai bà; ông cũng giao đứa trẻ cho bà[a], rồi cho bà đi. Bà ra đi và lang thang trong hoang mạc Bê-e Sê-ba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dịch sát là: “đặt lên vai bà, và đứa trẻ.” Cú pháp ở đây cô đọng; cũng có thể hiểu là Áp-ra-ham đặt bánh và bầu nước lên vai Ha-ga rồi giao đứa trẻ cho bà.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: Sáng sớm, Áp-ra-ham thức dậy
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nghĩa Hiphil của שׁכם là dậy sớm, đồng thời giữ sắc thái thời gian của בַּבֹּקֶר.
- source_word: לֶחֶם
  choice: bánh
  rationale: Giữ nghĩa cụ thể thông thường là bánh, thay vì khái quát hóa thành lương thực.
- source_word: חֵמַת מַיִם
  choice: một bầu da đựng nước
  rationale: חֵמֶת chỉ vật chứa bằng da; cách dịch này rõ chất liệu và công dụng, không gợi vật đựng hiện đại.
- source_word: וַיִּתֵּן אֶל הָגָר שָׂם עַל שִׁכְמָהּ
  choice: trao cho Ha-ga, đặt lên vai bà
  rationale: Giữ lối diễn đạt cô đọng của tiếng Hê-bơ-rơ và liên hệ tự nhiên hành động đặt lên vai với bánh cùng bầu nước.
- source_word: וְאֶת הַיֶּלֶד
  choice: ông cũng giao đứa trẻ cho bà
  rationale: Bổ sung động từ được hàm ý để tiếng Việt rõ nghĩa, tránh tạo ấn tượng chắc chắn rằng đứa trẻ cũng được đặt lên vai Ha-ga.
- source_word: וַיְשַׁלְּחֶהָ
  choice: rồi tiễn bà đi
  rationale: Diễn đạt tự nhiên hành động cho Ha-ga rời đi; vẫn giữ sắc thái trang trọng của trình thuật.
- source_word: וַתֵּתַע
  choice: lang thang
  rationale: Giữ nghĩa đi lang thang hoặc lạc lối mà không xác quyết quá mức nguyên nhân hay thời gian.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: trong hoang mạc Bê-e Sê-ba
  rationale: Hoang mạc diễn đạt vùng đất hoang vắng mà không nhất thiết chỉ một sa mạc cát; địa danh được phiên âm dễ đọc theo tiếng Việt.
theological_decisions:
- issue: Quan hệ cú pháp giữa “đứa trẻ” và cụm “đặt lên vai bà”
  choice: Bánh và bầu nước được đặt lên vai Ha-ga; đứa trẻ được giao cho bà trước khi bà được tiễn đi.
  alternative: Có thể đọc sát chuỗi từ là Áp-ra-ham đặt các vật lên vai Ha-ga “và đứa trẻ,” hoặc hiểu ông trao cả vật dụng lẫn đứa trẻ cho bà.
  rationale: Cú pháp Hê-bơ-rơ cô đọng và không nói lại động từ trước “đứa trẻ.” Bản dịch làm rõ cách hiểu hợp lý trong ngữ cảnh nhưng dùng chú thích để bảo tồn cấu trúc và độ mơ hồ thực sự của nguyên văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “bà” cho Ha-ga để tránh lối xưng hô hạ thấp; giữ nhịp liên tiếp của các hành động trong nguyên văn, đồng thời chú thích điểm cú pháp chưa hoàn toàn minh định.
