- from: Sáng sớm, Áp-ra-ham thức dậy, lấy bánh và một bầu da đựng nước trao cho Ha-ga, đặt lên vai bà; ông cũng giao đứa trẻ cho bà[a], rồi tiễn bà đi. Bà ra đi và lang thang trong hoang mạc Bê-e Sê-ba.
  to: Sáng sớm, Áp-ra-ham thức dậy, lấy bánh và một bầu da đựng nước, trao cho Ha-ga, đặt các thứ ấy lên vai bà; ông cũng giao đứa trẻ cho bà[a], rồi cho bà đi. Bà ra đi và lang thang trong hoang mạc Bê-e Sê-ba.
  rationale: Bản sửa chỉ thay những chỗ cần thiết để sát nghĩa hơn và trôi chảy hơn trong tiếng Việt. Cách hiểu rằng các vật dụng được đặt lên vai Ha-ga, còn đứa trẻ được giao cho bà, vẫn được giữ cùng chú thích để phản ánh cú pháp Hebrew cô đọng và cách đọc thay thế.
