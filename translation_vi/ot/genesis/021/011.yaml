  text: וַ/יֵּ֧רַע הַ/דָּבָ֛ר מְאֹ֖ד בְּ/עֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/011.yaml
  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: vi
  text: Việc ấy khiến Áp-ra-ham rất buồn lòng vì con trai mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Việc ấy rất xấu trong mắt Áp-ra-ham, liên quan đến con trai ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: khiến ... rất buồn lòng
  rationale: Động từ רעע kết hợp với thành ngữ בְּעֵינֵי diễn tả việc một điều bị xem là xấu, đau lòng hoặc không vừa ý. Trong ngữ cảnh Áp-ra-ham phản ứng trước lời yêu cầu liên quan đến con trai mình, “buồn lòng” diễn đạt tự nhiên sắc thái đau buồn mà không gán cho sự việc một phán quyết đạo đức tuyệt đối.
- source_word: הַדָּבָר
  choice: việc ấy
  rationale: דבר ở đây chỉ sự việc hoặc lời đề nghị vừa được nêu trong câu trước. “Việc ấy” tự nhiên trong tiếng Việt và vẫn giữ cách quy chiếu khái quát của nguyên văn.
- source_word: מְאֹד
  choice: rất
  rationale: Giữ nguyên chức năng nhấn mạnh mức độ của trạng từ Hebrew bằng từ thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: khiến Áp-ra-ham ... buồn lòng
  rationale: Thành ngữ nguyên văn là “xấu trong mắt Áp-ra-ham”. Chuyển thành cấu trúc cảm nghiệm tự nhiên trong tiếng Việt, đồng thời chú thích cách nói sát chữ để bảo tồn hình ảnh nguồn.
- source_word: עַל אֹדוֹת
  choice: vì
  rationale: Cụm này có thể chỉ nguyên nhân hoặc nội dung liên quan. “Vì” phù hợp mạch văn, nhưng chú thích giữ lại khả năng hiểu là “liên quan đến”.
- source_word: בְּנוֹ
  choice: con trai mình
  rationale: בן xác định giới tính là con trai. Đại từ phản thân “mình” quy chiếu tự nhiên về Áp-ra-ham và tránh sự mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của nỗi phản ứng nơi Áp-ra-ham
  choice: buồn lòng
  alternative: thấy việc ấy rất xấu / rất không vừa ý
  rationale: Nguyên văn có thể diễn tả sự việc là xấu, đau buồn hoặc không vừa ý trong mắt Áp-ra-ham. “Buồn lòng” hợp với quan hệ cha-con trong ngữ cảnh, nhưng không loại bỏ sắc thái đánh giá của thành ngữ; vì vậy cách dịch sát chữ được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Tên riêng dùng dạng Việt hóa quen thuộc “Áp-ra-ham”. Dấu chú thích [a] xuất hiện ngay sau câu chính.
