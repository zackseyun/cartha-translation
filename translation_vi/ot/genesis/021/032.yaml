base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: vi
  text: Vậy, họ lập giao ước tại Bê-e-sê-ba[a]. A-bi-mê-léc đứng dậy, cùng với Phi-côn, chỉ huy quân đội của ông; rồi họ trở về đất của người Phi-li-tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “cắt một giao ước”, một thành ngữ có nghĩa là lập giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: họ lập giao ước
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “cắt một giao ước”, nhưng đây là thành ngữ chỉ việc thiết lập giao ước. “Lập giao ước” tự nhiên trong tiếng Việt hiện đại và giữ đúng ý nghĩa.
- source_word: בִּבְאֵר שָׁבַע
  choice: tại Bê-e-sê-ba
  rationale: Giới từ ב chỉ địa điểm; “tại” phù hợp với nơi diễn ra việc lập giao ước. Địa danh được phiên âm theo cách quen thuộc trong tiếng Việt.
- source_word: וַיָּקָם
  choice: đứng dậy
  rationale: Động từ קום nghĩa là đứng lên hoặc trỗi dậy; trong trình tự tường thuật này, “đứng dậy” rõ ràng và tự nhiên.
- source_word: וּפִיכֹל
  choice: cùng Phi-côn
  rationale: Liên từ וְ về hình thức là “và”, nhưng “cùng” diễn đạt tự nhiên rằng Phi-côn đi với A-bi-mê-léc và cả hai là chủ thể của động từ số nhiều tiếp theo.
- source_word: שַׂר צְבָאוֹ
  choice: chỉ huy quân đội của vua
  rationale: שַׂר là người đứng đầu hoặc chỉ huy, còn צָבָא ở đây là quân đội. Hậu tố “của ông” quy về A-bi-mê-léc; dùng “của vua” giúp tiếng Việt tránh khả năng hiểu lầm đại từ mà không thay đổi sở thuộc.
- source_word: וַיָּשֻׁבוּ
  choice: trở về
  rationale: שׁוּב trong ngữ cảnh này chỉ hành động quay trở lại một nơi; “trở về” phù hợp với văn phong tường thuật.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: về đất của người Phi-li-tin
  rationale: Bám sát cấu trúc “đến/về đất của người Phi-li-tin”, đồng thời dùng “về” tự nhiên sau động từ “trở về”.
