revisions:
- from: Vậy, họ lập giao ước tại Bê-e-sê-ba[a]. A-bi-mê-léc cùng Phi-côn, chỉ huy quân đội của vua, đứng dậy và trở về đất của người Phi-li-tin.
  to: Vậy, họ lập giao ước tại Bê-e-sê-ba[a]. A-bi-mê-léc đứng dậy, cùng với Phi-côn, chỉ huy quân đội của ông; rồi họ trở về đất của người Phi-li-tin.
  rationale: Sửa cấu trúc câu để giữ sự phân biệt của nguyên văn giữa hành động số ít của A-bi-mê-léc («đứng dậy») và hành động số nhiều của A-bi-mê-léc cùng Phi-côn («họ trở về»). Thay «của vua» bằng «của ông» để không bổ sung danh xưng không được nêu trong câu Hê-bơ-rơ. Giữ nguyên ý nghĩa, địa danh, tên riêng và chú thích thành ngữ.
