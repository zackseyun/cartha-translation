  - severity: low
    issue: «quân đội của vua» thêm danh xưng vào câu dịch.
    rationale: Hậu tố trong שַׂר צְבָאוֹ có nghĩa là «quân đội của ông/ông ấy». Dùng «của ông» giữ sát sở thuộc được nêu trong nguyên văn mà vẫn rõ người quy chiếu là A-bi-mê-léc.
