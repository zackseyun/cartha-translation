source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: vi
  text: Vậy, bây giờ hãy thề với tôi tại đây nhân danh Đức Chúa Trời rằng ông sẽ không dối gạt tôi, con cái tôi và dòng dõi tôi. Tôi đã đối đãi nhân hậu với ông thế nào, thì ông cũng hãy đối đãi như vậy với tôi và với xứ nơi ông đã sống như một ngoại kiều.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả liên từ chuyển ý và ý nghĩa thời điểm rõ ràng của עַתָּה; khác với việc xem đây chỉ là một dấu hiệu diễn ngôn trong tiếng Anh.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: hãy nhân danh Đức Chúa Trời mà thề với tôi
  rationale: Diễn đạt tự nhiên hành vi thề có Đức Chúa Trời làm Đấng chứng giám, đồng thời giữ đối tượng gián tiếp 'với tôi'.
- source_word: אִם תִּשְׁקֹר לִי
  choice: rằng ông sẽ không dối gạt tôi
  rationale: Sau lời thề, אִם mang lực phủ định trong công thức tuyên thệ; 'dối gạt' thể hiện hành vi đối xử giả dối hơn là chỉ nói sai sự thật.
- source_word: לְנִינִי וּלְנֶכְדִּי
  choice: con cái tôi hay dòng dõi tôi
  rationale: Hai danh từ chỉ các thế hệ kế tiếp có phạm vi không hoàn toàn chắc chắn; cách dịch này tự nhiên và giữ sự tiến triển từ hậu duệ gần đến hậu duệ rộng hơn.
- source_word: חֶסֶד
  choice: đối xử nhân từ
  rationale: Trong bối cảnh quan hệ giao ước, từ này nói đến lòng nhân hậu và sự trung tín thể hiện qua cách đối xử; bản dịch không thu hẹp nó thành một thuật ngữ hệ phái.
- source_word: גַּרְתָּה בָּהּ
  choice: ông đang cư ngụ như một ngoại kiều
  rationale: Động từ גּוּר chỉ việc sống tại một nơi với tư cách người ngoại trú, không hàm ý sở hữu quê hương tại đó.
theological_decisions:
- issue: Ý nghĩa của אִם trong công thức thề
  choice: 'dịch thành mệnh đề phủ định: ''sẽ không dối gạt'''
  alternative: dịch sát hình thức là 'nếu ông dối gạt'
  rationale: Trong công thức tuyên thệ tiếng Hê-bơ-rơ, אִם thường tạo lời thề phủ định với hậu quả nguyền rủa được lược bỏ; dịch phủ định truyền đạt đúng lực ngữ dụng mà không thêm nội dung hậu quả.
- issue: Đối tượng của חֶסֶד
  choice: giữ yêu cầu đáp lại sự đối xử nhân từ đối với cả người nói và xứ
  alternative: diễn giải thành lòng trung thành giao ước hoặc ân điển
  rationale: Câu văn áp dụng hành động tương xứng cho A-bi-mê-léc và xứ; không nên áp đặt một nghĩa thần học chuyên biệt vượt quá văn cảnh.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng đại từ 'ông—tôi' phù hợp lời đối thoại giữa các nhân vật nam có địa vị, tránh sắc thái quá cổ. Giữ 'Vậy bây giờ' vì bản Hê-bơ-rơ có וְעַתָּה rõ ràng.
