  terminology: “Đức Chúa Trời,” “Áp-ra-ham,” “Sa-ra,” “Y-sác,” “nữ nô lệ,” và “dòng dõi” đều nhất quán, phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Nữ nô lệ” bảo toàn địa vị xã hội được nêu trong אָמָה.
