- from: 'Nhưng Đức Chúa Trời phán với Áp-ra-ham: “Con đừng buồn phiền vì đứa trẻ và nữ nô lệ của con. Sa-ra nói với con điều gì, hãy nghe theo lời nàng,[a] vì qua Y-sác, dòng dõi của con sẽ được gọi.[b]”'
