  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: vi
  text: 'Nhưng Đức Chúa Trời phán với Áp-ra-ham: “Con đừng buồn phiền vì đứa trẻ và nữ nô lệ của con. Sa-ra bảo con điều gì, hãy nghe theo lời nàng,[a] vì qua Y-sác, dòng dõi sẽ được gọi là dòng dõi của con.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “hãy nghe tiếng nàng”, tức là hãy nghe theo điều Sa-ra nói.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “vì trong Y-sác, dòng dõi của con sẽ được gọi.” Cách nói này chỉ việc dòng dõi của Áp-ra-ham được xác định qua Y-sác.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: đừng buồn phiền
  rationale: Thành ngữ Hê-bơ-rơ diễn tả điều khiến một người đau buồn hoặc không vừa lòng. “Đừng buồn phiền” tự nhiên trong tiếng Việt và phù hợp với nỗi đau của Áp-ra-ham trong ngữ cảnh.
- source_word: הַנַּעַר
  choice: đứa trẻ
  rationale: Chỉ Ích-ma-ên; cách dịch này hiện đại, trung tính và không gán một độ tuổi quá cụ thể.
- source_word: אֲמָתֶךָ
  choice: nữ nô lệ của con
  rationale: Giữ rõ địa vị lệ thuộc của Ha-ga trong xã hội cổ đại, không làm nhẹ nghĩa thành người giúp việc thông thường.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: hãy nghe theo lời nàng
  rationale: Chuyển thành ngữ sát chữ “hãy nghe tiếng nàng” sang tiếng Việt tự nhiên, mang nghĩa chú ý và làm theo điều Sa-ra nói mà không nhất thiết nâng thành một thuật ngữ tuyệt đối về sự vâng phục.
- source_word: בְּיִצְחָק
  choice: qua Y-sác
  rationale: Diễn đạt Y-sác là người qua đó dòng dõi được xác lập, đồng thời tránh cách nói “trong Y-sác” kém tự nhiên trong tiếng Việt.
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: dòng dõi của con sẽ được gọi
  rationale: Giữ động từ “gọi” và sắc thái thụ động của nguyên văn, đồng thời dùng sở hữu “của con” cho לְךָ. Câu vẫn để ngỏ sắc thái được gọi, được xác định hay được nhìn nhận là dòng dõi của Áp-ra-ham.
- source_word: זָרַע
  choice: dòng dõi
  rationale: “Dòng dõi” thể hiện danh từ tập hợp chỉ hậu duệ và phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: Nhưng Đức Chúa Trời phán
  rationale: “Nhưng” biểu thị sự tương phản với nỗi buồn của Áp-ra-ham ở câu trước; “phán” là động từ trang trọng, tự nhiên khi Đức Chúa Trời nói.
theological_decisions:
- issue: Địa vị của Ha-ga
  choice: nữ nô lệ của con
  alternative: nữ tỳ của con
  rationale: Nguyên văn nêu rõ địa vị lệ thuộc của Ha-ga. “Nữ nô lệ” minh bạch hơn “nữ tỳ” đối với độc giả hiện đại và không che nhẹ thực trạng xã hội.
- issue: Ý nghĩa của lời hứa về Y-sác
  choice: qua Y-sác, dòng dõi của con sẽ được gọi
  alternative: nơi Y-sác, dòng dõi sẽ được kể là của con
  rationale: Cách dịch giữ ngôn ngữ “gọi” của קרא và sự mơ hồ chân thực giữa việc đặt tên, chỉ định và nhìn nhận dòng giao ước, không diễn giải quá mức thành một công thức thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” trong lời Đức Chúa Trời nói với Áp-ra-ham để tự nhiên trong tiếng Việt và biểu thị quan hệ bề trên với người nghe; dùng “nàng” cho Sa-ra để tránh sắc thái suồng sã. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
