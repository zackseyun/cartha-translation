  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của tiếng Hê-bơ-rơ: lời Đức Chúa Trời, nỗi buồn liên quan đến đứa trẻ và nữ nô lệ, mệnh lệnh nghe Sa-ra, và việc dòng dõi được xác định qua Y-sác. Tuy nhiên, cụm “dòng dõi của con sẽ được gọi” thiếu bổ ngữ cần thiết trong tiếng Việt và không truyền đạt rõ cấu trúc ‘dòng dõi được gọi là/được nhìn nhận là của con’ của יִקָּרֵא לְךָ זָרַע.'
