  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: vi
  text: 'Rồi bà đi và ngồi xuống đối diện với nó, cách xa chừng một tầm tên bắn, vì bà nói: “Tôi không muốn nhìn thấy đứa trẻ chết.” Bà ngồi đối diện với nó, cất tiếng lên và khóc.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: đối diện với nó
  rationale: Giữ nghĩa không gian là ở phía đối diện và bảo toàn sự lặp lại có chủ ý của cụm từ Hê-bơ-rơ; khoảng cách được diễn đạt ngay sau đó.
- source_word: הַרְחֵק
  choice: cách xa
  rationale: Diễn đạt tự nhiên giá trị trạng từ nhấn mạnh khoảng cách của dạng từ רחק.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: chừng một tầm tên bắn
  rationale: Thành ngữ Việt tự nhiên, giữ hình ảnh về cự ly bắn cung và sắc thái ước lượng của כִּ.
- source_word: הַיָּלֶד
  choice: đứa trẻ
  rationale: ילד có thể chỉ một đứa trẻ hoặc thiếu niên; lựa chọn này tự nhiên trong lời đau đớn của người mẹ và không xác định tuổi quá hẹp.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: Ta không muốn nhìn thấy đứa trẻ chết
  rationale: Truyền đạt tự nhiên ý nguyện phủ định ở ngôi thứ nhất, đồng thời thể hiện thành ngữ danh hóa 'khi/cái chết của đứa trẻ' bằng cấu trúc Việt rõ ràng.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ
  choice: cất tiếng lên
  rationale: Giữ thành ngữ Hê-bơ-rơ về việc cất cao tiếng; động từ 'khóc' theo sau xác định đây là tiếng than khóc.
- source_word: וַתֵּבְךְּ
  choice: khóc
  rationale: Từ Việt thông dụng và chính xác cho hành động khóc than trong ngữ cảnh.
- source_word: לָהּ
  choice: không dịch riêng
  rationale: Đại từ dữ cách đi với động từ 'ngồi' không nhất thiết mang nghĩa từ vựng độc lập trong tiếng Việt; thêm 'một mình' có thể gây ấn tượng rằng bà không ở gần ai, trong khi מִנֶּגֶד đã xác định vị trí tương quan với đứa trẻ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” cho Ha-ga và “nó/đứa trẻ” cho Ích-ma-ên theo mạch văn; giữ sự lặp lại “đối diện với nó” của nguyên văn. Không thêm chú thích vì phương án dịch trong câu đã diễn đạt trực tiếp cách hiểu tự nhiên của thành ngữ.
