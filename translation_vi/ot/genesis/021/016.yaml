  to: 'Rồi bà đi và ngồi xuống đối diện với nó, cách xa chừng một tầm tên bắn, vì bà nói: “Tôi không muốn nhìn thấy đứa trẻ chết.” Bà ngồi đối diện với nó, cất tiếng lên và khóc.'
  rationale: Chỉnh nhẹ về ngôi xưng và liên kết câu để đạt văn phong Việt hiện đại, không thay đổi nghĩa. Cách diễn đạt «Tôi không muốn nhìn thấy đứa trẻ chết» chuyển tải tự nhiên lời ý nguyện phủ định trong ngữ cảnh, đồng thời tránh thêm một đối tượng cầu khẩn vốn không có trong nguyên văn.
