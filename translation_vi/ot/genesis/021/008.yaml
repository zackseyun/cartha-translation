base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/008.yaml
  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: vi
  text: Đứa trẻ lớn lên và được cai sữa. Vào ngày Y-sác được cai sữa, Áp-ra-ham mở một bữa tiệc lớn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: lớn lên
  rationale: Trong ngữ cảnh sự phát triển của một đứa trẻ, động từ גדל chỉ việc lớn lên, chứ không nói đến địa vị hay sự vĩ đại.
- source_word: הַיֶּלֶד
  choice: đứa trẻ
  rationale: יֶלֶד có thể chỉ một đứa trẻ hoặc bé trai. “Đứa trẻ” tự nhiên trong tiếng Việt và không xác định tuổi cụ thể hơn mức văn bản nguồn.
- source_word: וַיִּגָּמַל
  choice: được cai sữa
  rationale: Dạng Nifal của גמל ở đây chỉ việc đứa trẻ thôi bú; cấu trúc bị động “được cai sữa” phản ánh sát hình thái và rõ nghĩa.
- source_word: וַיַּעַשׂ
  choice: mở
  rationale: Khi đi với “bữa tiệc”, “mở một bữa tiệc” là cách nói tự nhiên trong tiếng Việt, truyền đạt đúng ý tổ chức hay khoản đãi của עשה.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: một bữa tiệc lớn
  rationale: מִשְׁתֶּה là tiệc ăn uống mang tính khoản đãi hoặc ăn mừng; “bữa tiệc lớn” giữ được sắc thái ấy và tính từ גָדוֹל.
- source_word: בְּיוֹם
  choice: vào ngày
  rationale: Cách dịch này giữ rõ cấu trúc thời gian của giới từ בְּ đi với יוֹם.
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: Y-sác được cai sữa
  rationale: Cụm nguyên ngữ diễn tả sự kiện cai sữa của Y-sác. Mệnh đề bị động là cách diễn đạt rõ và tự nhiên trong tiếng Việt.
theological_decisions: []
