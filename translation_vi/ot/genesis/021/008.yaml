  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc “Y-sác” và “Áp-ra-ham”. Việc lặp lại “được cai sữa” phản ánh sự lặp có chủ ý trong câu Hê-bơ-rơ.
