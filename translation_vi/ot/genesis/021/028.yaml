translation:
  language: vi
  text: Áp-ra-ham đặt riêng bảy con chiên cái non của đàn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Áp-ra-ham đặt bảy con chiên cái non của đàn sang một bên.” Động từ Hê-bơ-rơ có thể gợi ý việc đặt chúng ở một vị trí riêng biệt; trong bối cảnh lập giao ước, hành động này có ý nghĩa đáng chú ý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: đặt riêng
  rationale: Động từ Hiphil của נצב diễn tả việc khiến một vật đứng hoặc được đặt vào vị trí xác định. Trong câu này, kết hợp với לְבַדְּהֶן, “đặt riêng” diễn đạt tự nhiên cả hành động đặt và sự tách biệt, nhưng không nói thêm mục đích.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: אֶת
  choice: '[dấu chỉ tân ngữ xác định, không dịch]'
  rationale: Dấu chỉ tân ngữ trực tiếp trong tiếng Hê-bơ-rơ không có từ tương đương cần biểu hiện trong tiếng Việt.
- source_word: שֶׁבַע
  choice: bảy
  rationale: Số từ chỉ số lượng, bổ nghĩa cho danh từ theo sau.
- source_word: כִּבְשֹׂת
  choice: chiên con cái
  rationale: Danh từ chỉ những con chiên non giống cái; cách dịch này giữ cả ý về loài, độ non và giới tính.
- source_word: הַצֹּאן
  choice: trong đàn
  rationale: צֹאן là danh từ tập hợp chỉ đàn gia súc nhỏ, thường gồm chiên và dê. Vì đối tượng đã được xác định là chiên con cái, “trong đàn” tự nhiên và không thu hẹp danh từ tập hợp thành chỉ đàn chiên.
- source_word: לְבַדְּהֶן
  choice: riêng
  rationale: Cụm từ cho biết bảy con chiên cái được tách khỏi phần còn lại; “riêng” ngắn gọn và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và tự nhiên. “Chiên con cái” dễ hiểu hơn cách nói chuyên ngành, đồng thời giữ đúng giới tính và độ non của con vật. Dấu chú thích [a] được đặt ngay sau câu.
