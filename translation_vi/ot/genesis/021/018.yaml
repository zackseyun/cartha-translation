base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: vi
  text: Hãy đứng dậy, đỡ cậu bé lên và lấy tay giữ cậu thật chắc[a], vì Ta sẽ làm cho cậu thành một dân tộc lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nắm chặt lấy cậu.” Cụm từ Hê-bơ-rơ nhấn mạnh việc dùng tay giữ hoặc nâng đỡ cách vững chắc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמִי
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh giống cái số ít, nói trực tiếp với Ha-ga. “Hãy đứng dậy” tự nhiên trong tiếng Việt hiện đại và giữ nguyên sức mạnh của mệnh lệnh.
- source_word: שְׂאִי אֶת־הַנַּעַר
  choice: đỡ cậu bé lên
  rationale: נשׂא có nghĩa nâng hoặc nhấc lên; trong ngữ cảnh cậu bé đang kiệt sức, “đỡ ... lên” vừa giữ hình ảnh nâng lên vừa hàm ý trợ giúp mà không buộc phải hiểu là bế hoặc cõng.
- source_word: הַנַּעַר
  choice: cậu bé
  rationale: נַעַר có thể chỉ một bé trai hoặc thiếu niên. “Cậu bé” là cách gọi tự nhiên, phù hợp với ngữ cảnh và không xác định tuổi quá cụ thể.
- source_word: וְהַחֲזִיקִי אֶת־יָדֵךְ בּוֹ
  choice: và dùng tay giữ chắc lấy cậu
  rationale: Cụm từ diễn tả việc dùng tay nắm giữ hoặc nâng đỡ cách vững chắc. Bản dịch giữ hình ảnh cụ thể của bàn tay và sắc thái mạnh của החזיק.
- source_word: כִּי
  choice: vì
  rationale: Liên từ giới thiệu lý do cho các mệnh lệnh trước đó.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימֶנּוּ
  choice: Ta sẽ làm cho cậu thành một dân tộc lớn
  rationale: Cấu trúc שׂים với ל diễn tả kết quả. Cách dịch giữ lối nói nguồn, trong đó chính cậu bé được nói là sẽ thành một dân tộc lớn, tức hậu duệ phát triển thành dân ấy.
theological_decisions:
- issue: Lời hứa của Đức Chúa Trời về tương lai của Ích-ma-ên
  choice: Trình bày trực tiếp lời hứa rằng Đức Chúa Trời sẽ làm cho cậu thành một dân tộc lớn.
  alternative: Diễn giải thành “Ta sẽ khiến dòng dõi cậu trở thành một dân tộc lớn.”
  rationale: Nguyên văn dùng đại từ chỉ chính cậu bé và nói Đức Chúa Trời sẽ làm cậu thành một dân lớn. Giữ lối nói này bảo toàn tính cô đọng và không đưa thêm sự phân loại thần học về bản chất của lời hứa.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” thể hiện lời phán của Đức Chúa Trời; “cậu” tránh cách gọi người bằng “nó” trong tiếng Việt hiện đại. Câu giữ phép hoán dụ của nguyên văn: cậu bé sẽ “thành một dân tộc lớn” qua hậu duệ của mình.'
