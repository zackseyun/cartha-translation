revisions:
- from: Hãy đứng dậy, đỡ cậu bé lên và dùng tay giữ chắc lấy cậu[a], vì Ta sẽ làm cho cậu thành một dân tộc lớn.
  to: Hãy đứng dậy, đỡ cậu bé lên và lấy tay giữ cậu thật chắc[a], vì Ta sẽ làm cho cậu thành một dân tộc lớn.
  rationale: Chỉ chỉnh nhẹ trật tự từ trong mệnh đề thứ hai để tiếng Việt tự nhiên hơn. Bản sửa vẫn giữ hai mệnh lệnh phân biệt—nâng cậu bé lên, rồi dùng tay giữ cậu vững chắc—và không làm rõ quá mức sắc thái nắm giữ hay nâng đỡ vốn có thể cùng hiện diện trong cụm Hê-bơ-rơ.
  reviewer_model: gpt-5.6-terra
