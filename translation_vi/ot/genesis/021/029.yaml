  rationale: Đổi câu hỏi sang “là gì?” để giữ độ mở của nguyên ngữ, không áp đặt rằng A-bi-mê-léc chỉ hỏi về ý nghĩa hay mục đích. Điều chỉnh cách gọi con vật cho tự nhiên hơn mà vẫn giữ thông tin từ vựng của tiếng Híp-ri. Không cần chú thích, vì “để riêng” đã diễn đạt đầy đủ ý đặt/tách riêng và không tạo mơ hồ đáng kể.
