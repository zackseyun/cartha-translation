translation:
  language: vi
  text: 'A-bi-mê-léc hỏi Áp-ra-ham: “Bảy con chiên cái còn non này mà ông để riêng là gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: hỏi
  rationale: Động từ nguyên nghĩa là “nói”, nhưng lời trực tiếp là một câu hỏi; “hỏi” tự nhiên trong tiếng Việt và diễn đạt đúng chức năng của lời nói trong ngữ cảnh.
- source_word: אֲבִימֶלֶךְ
  choice: A-bi-mê-léc
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: אֶל־אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Người nhận lời nói được thể hiện tự nhiên như bổ ngữ của động từ “hỏi”; tên riêng được phiên âm theo cách dùng quen thuộc.
- source_word: מָה הֵנָּה
  choice: có ý nghĩa gì
  rationale: Cấu trúc sát chữ là “những con này là gì?”, nhưng trong ngữ cảnh, A-bi-mê-léc hỏi về ý nghĩa hoặc mục đích của nhóm chiên được tách riêng. Cách dịch này tự nhiên mà không chuyển thành câu hỏi trực tiếp về nguyên nhân “tại sao”.
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: bảy con chiên cái con ... kia
  rationale: כְּבָשֹׂת là dạng giống cái, chỉ chiên cái còn non. “Chiên cái con” bảo toàn cả giới tính lẫn độ non; “kia” phù hợp với nhóm vật đang được chỉ ra.
- source_word: אֲשֶׁר הִצַּבְתָּ לְבַדָּנָה
  choice: mà ông để riêng
  rationale: הִצַּבְתָּ có nghĩa đặt/để, còn לְבַדָּנָה chỉ trạng thái tách riêng. “Để riêng” gọn, tự nhiên và truyền đạt đầy đủ hai yếu tố mà không lặp ý.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ “ông” phù hợp cuộc đối thoại giữa hai nhân vật có địa vị; giữ rõ chi tiết bảy con chiên là con cái còn non.
