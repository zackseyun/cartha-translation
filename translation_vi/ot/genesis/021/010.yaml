  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: vi
  text: 'Bà nói với Áp-ra-ham: “Hãy đuổi nữ nô lệ này cùng con trai bà ta đi, vì con trai của nữ nô lệ này sẽ không được cùng thừa kế với con trai tôi là Y-sác.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: Bà nói với Áp-ra-ham
  rationale: Chủ ngữ nữ được xác định từ ngữ cảnh là Sa-ra. Không nhất thiết dịch waw tự sự thành “và” trong tiếng Việt; cách này tự nhiên mà vẫn giữ trình tự kể chuyện.
- source_word: גָּרֵשׁ
  choice: Hãy đuổi ... đi
  rationale: Mệnh lệnh mang nghĩa trục xuất, mạnh hơn “hãy cho đi”; cấu trúc “đuổi ... đi” tự nhiên và giữ được sắc thái cứng rắn.
- source_word: הָאָמָה
  choice: nữ nô lệ
  rationale: אָמָה chỉ một phụ nữ ở địa vị nô lệ hoặc lệ thuộc. “Nữ nô lệ” thể hiện rõ địa vị xã hội-pháp lý trong ngữ cảnh, thay vì làm nhẹ thành “đầy tớ gái”.
- source_word: בְּנָהּ
  choice: con trai nó
  rationale: Đại từ “nó” phản ánh lối nói xa cách, khinh miệt của Sa-ra đối với người nữ vừa bị gọi là “nữ nô lệ này”; đồng thời diễn đạt rõ sở hữu.
- source_word: כִּי לֹא יִירַשׁ
  choice: vì ... sẽ không được thừa kế
  rationale: כִּי nêu lý do cho mệnh lệnh; ירשׁ trong ngữ cảnh nói đến quyền hưởng gia tài. Dạng bị động “được thừa kế” là cách nói tự nhiên trong tiếng Việt.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: con trai của nữ nô lệ này
  rationale: Giữ nguyên cụm danh từ được lặp lại và từ chỉ định “này”, qua đó bảo tồn giọng điệu xa cách, nhấn mạnh của Sa-ra.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: cùng với con trai tôi là Y-sác
  rationale: Hai lần עִם tạo cấu trúc nhấn mạnh/đồng vị. Tiếng Việt tự nhiên diễn đạt quan hệ đồng vị bằng “là”, vẫn giữ trọng tâm rằng Y-sác chính là người con của Sa-ra được đặt đối lập ở đây.
