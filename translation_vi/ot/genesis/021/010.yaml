- from: 'Bà nói với Áp-ra-ham: “Hãy đuổi nữ nô lệ này cùng con trai nó đi, vì con trai của nữ nô lệ này sẽ không được thừa kế cùng với con trai tôi là Y-sác.”'
  to: 'Bà nói với Áp-ra-ham: “Hãy đuổi nữ nô lệ này cùng con trai bà ta đi, vì con trai của nữ nô lệ này sẽ không được cùng thừa kế với con trai tôi là Y-sác.”'
  rationale: Chỉnh “con trai nó” thành “con trai bà ta” để quy chiếu một người phụ nữ theo cách tự nhiên hơn mà không làm mất giọng điệu xa cách; chỉnh mệnh đề về thừa kế sang cấu trúc chủ động rõ nghĩa hơn trong tiếng Việt. Các yếu tố khác được giữ nguyên vì trung thành với nguyên ngữ và phù hợp văn phong hiện đại.
  reviewer_model: gpt-5.6-terra
