source:
  edition: WLC
  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: vi
  text: Ông trồng một cây liễu bách tại Bê-e-sê-ba, rồi tại đó ông kêu cầu danh Yahweh[a], Đức Chúa Trời Hằng Hữu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “công bố danh Yahweh” hoặc “khẩn cầu danh Yahweh.” Thành ngữ Hê-bơ-rơ có thể bao hàm cả việc công bố lẫn kêu cầu trong bối cảnh thờ phượng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đức Chúa Trời đời đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: trồng
  rationale: Động từ נטע ở thể Qal thường có nghĩa là “trồng”; đây là cách diễn đạt tự nhiên khi nói đến việc trồng cây.
- source_word: אֶשֶׁל
  choice: cây liễu bách
  rationale: Danh từ số ít אֶשֶׁל nhiều khả năng chỉ cây tamarisk (chi Tamarix). “Cây liễu bách” giữ được tính cụ thể của loài cây, thay vì khái quát thành “cây” hay diễn giải thành “bụi cây”.
- source_word: בִּבְאֵר שָׁבַע
  choice: tại Bê-e-sê-ba
  rationale: Giới từ בְּ chỉ địa điểm; “tại” tự nhiên trong tiếng Việt và phù hợp với một địa danh. “Bê-e-sê-ba” là dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: rồi tại đó ông kêu cầu danh
  rationale: Cụm קרא בשם có thể bao hàm việc kêu cầu, khẩn nguyện hoặc công bố danh trong bối cảnh thờ phượng. “Kêu cầu danh” giữ gần thành ngữ Hê-bơ-rơ mà không thu hẹp nghĩa hoàn toàn vào cầu nguyện hay công bố.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời bằng dạng chuyển tự “Yahweh”, thay vì thay thế bằng một tước hiệu.
- source_word: אֵל עוֹלָם
  choice: Đức Chúa Trời Hằng Hữu
  rationale: אֵל nghĩa là “Đức Chúa Trời”, còn עוֹלָם ở đây diễn tả sự tồn tại không cùng. “Đức Chúa Trời Hằng Hữu” tự nhiên, trang trọng và giữ được sắc thái danh xưng.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng Tứ Tự Danh. Dạng “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu, nhưng không đưa thêm một lập trường hệ phái.
- issue: Sắc thái của công thức thờ phượng קרא בשם יהוה
  choice: kêu cầu danh Yahweh
  alternative: công bố danh Yahweh; khẩn cầu danh Yahweh
  rationale: Công thức này có thể chỉ cả việc hướng lời kêu cầu lên Đức Chúa Trời lẫn việc tuyên xưng, công bố danh Ngài. Bản chính giữ thành ngữ rộng nghĩa, còn chú thích nêu các khả năng để không âm thầm giải quyết sự mơ hồ.
- issue: Ý nghĩa của אֵל עוֹלָם
  choice: Đức Chúa Trời Hằng Hữu
  alternative: Đức Chúa Trời đời đời
  rationale: Cả hai đều diễn đạt tính vĩnh cửu. “Hằng Hữu” tự nhiên hơn như một danh xưng trong tiếng Việt và không xác định quá mức sắc thái thời gian của עוֹלָם.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” tiếp nối chủ thể Áp-ra-ham từ văn cảnh mà không lặp tên vốn không có trong câu Hê-bơ-rơ. Các chữ đầu trong danh xưng “Đức Chúa Trời Hằng Hữu” được viết hoa để thể hiện chức năng danh hiệu; không thêm nội dung thần học ngoài nguyên văn.
