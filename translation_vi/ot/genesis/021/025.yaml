translation:
  language: vi
  text: Áp-ra-ham khiển trách A-bi-mê-léc về giếng nước mà các đầy tớ của A-bi-mê-léc đã chiếm đoạt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: khiển trách
  rationale: Động từ יכח ở dạng Hifil trong ngữ cảnh này diễn tả việc Áp-ra-ham đối chất và trách A-bi-mê-léc về một hành vi sai trái; “khiển trách” tự nhiên, trang trọng và không làm nhẹ sắc thái.
- source_word: עַל אֹדוֹת
  choice: về
  rationale: Cụm giới từ nêu vấn đề hoặc nguyên do của lời khiển trách; “về” diễn đạt gọn và đúng chức năng trong tiếng Việt.
- source_word: בְּאֵר הַמַּיִם
  choice: một giếng nước
  rationale: Danh từ có mạo từ trong tiếng Hê-bơ-rơ chỉ giếng nước đang được nói đến; tiếng Việt tự nhiên dùng “một” khi lần đầu đưa sự vật vào lời thuật.
- source_word: גָּזְלוּ
  choice: đã chiếm đoạt
  rationale: גזל chỉ hành động cưỡng chiếm hoặc tước đoạt trái phép; “chiếm đoạt” giữ được sắc thái mạnh hơn “lấy” và phù hợp với giếng nước.
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: các đầy tớ của A-bi-mê-léc
  rationale: Giữ nghĩa trực tiếp của עבד trong bối cảnh thuộc hạ phục vụ vua, đồng thời dùng cách diễn đạt quen thuộc trong văn phong Kinh Thánh tiếng Việt.
