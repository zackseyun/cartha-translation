  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: vi
  text: Áp-ra-ham được một trăm tuổi khi Y-sác, con trai ông, chào đời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ theo sát từng chữ: “Áp-ra-ham là con trai của một trăm năm vào lúc Y-sác, con trai ông, được sinh ra cho ông.”'
    reason: Giải thích thành ngữ Hê-bơ-rơ chỉ tuổi và cấu trúc nguyên văn của mệnh đề chỉ thời gian.
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Không dịch riêng liên từ וְ vì trong tiếng Việt, mở câu bằng “Và” ở đây kém tự nhiên; mạch kể vẫn được giữ qua sự tiếp nối văn cảnh. Tên riêng dùng dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: בֶּן מְאַת שָׁנָה
  choice: được một trăm tuổi
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “con trai của một trăm năm”, một thành ngữ chỉ tuổi; “được một trăm tuổi” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: בְּ/הִוָּלֶד
  choice: khi ... được sinh ra
  rationale: 'Giới từ בְּ đi với động từ nguyên mẫu cấu trúc Nifal diễn tả thời điểm và giữ sắc thái bị động: “khi ... được sinh ra”.'
- source_word: ל֔/וֹ
  choice: cho ông
  rationale: Giữ quan hệ ngữ pháp của לְ, trình bày Áp-ra-ham là người mà đứa con được sinh ra cho; cách này cũng bảo tồn nét diễn đạt đặc trưng của nguyên văn.
- source_word: אֵת יִצְחָק
  choice: Y-sác
  rationale: אֵת là dấu hiệu chỉ tân ngữ trực tiếp nên không dịch riêng; tên יִצְחָק được thể hiện bằng dạng quen thuộc “Y-sác”.
- source_word: בְּנֽ/וֹ
  choice: con trai ông
  rationale: Giữ cụm đồng vị xác định Y-sác là con trai của Áp-ra-ham mà không thêm sắc thái nhấn mạnh như “con ruột” hay “chính con ông”.
theological_decisions: []
translation_notes:
  register: 'Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: chuyển thành ngữ chỉ tuổi sang cách nói tự nhiên, đồng thời giữ sắc thái bị động và cụm “cho ông” của nguyên văn. Dấu chú thích [a] xuất hiện trong chính văn.'
