base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: vi
  text: Áp-ra-ham lấy chiên và bò trao cho A-bi-mê-léc, rồi cả hai lập giao ước với nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cắt một giao ước”, một thành ngữ Hê-bơ-rơ thông dụng chỉ việc chính thức lập giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Động từ לקח ở thể Qal trong mạch kể chuyện có nghĩa thông thường là “lấy”; cách dịch này tự nhiên và giữ nguyên trình tự hành động.
- source_word: צֹאן
  choice: chiên
  rationale: צֹאן chỉ gia súc nhỏ, nhất là chiên và dê. Trong thế đối ứng với בָּקָר, “chiên” là cách diễn đạt ngắn gọn, quen thuộc, dù từ Hê-bơ-rơ có thể bao hàm cả dê.
- source_word: וּבָקָר
  choice: và bò
  rationale: בָּקָר chỉ gia súc lớn, đặc biệt là bò; “bò” tạo thành cặp tự nhiên với “chiên” trong tiếng Việt.
- source_word: וַיִּתֵּן לַאֲבִימֶלֶךְ
  choice: trao cho A-bi-mê-léc
  rationale: נתן có nghĩa cơ bản là “cho”. “Trao cho” vẫn giữ nghĩa trực tiếp ấy, đồng thời tự nhiên khi nói đến việc chuyển giao gia súc trong bối cảnh thỏa thuận.
- source_word: וַיִּכְרְתוּ
  choice: lập
  rationale: Trong thành ngữ כרת ברית, nghĩa đen là “cắt một giao ước”, còn nghĩa thông dụng là chính thức lập giao ước. “Lập” truyền đạt rõ ý nghĩa thành ngữ trong tiếng Việt hiện đại.
- source_word: שְׁנֵיהֶם
  choice: cả hai
  rationale: Cụm từ nhấn mạnh hai bên cùng tham gia; “cả hai” là cách diễn đạt tự nhiên và chính xác.
- source_word: בְּרִית
  choice: giao ước
  rationale: “Giao ước” bảo tồn thuật ngữ Kinh Thánh chủ chốt và phù hợp hơn “hiệp ước” hay “thỏa thuận” để duy trì sắc thái rộng của בְּרִית.
theological_decisions:
- issue: Cách dịch thành ngữ giao ước כרת ברית
  choice: lập giao ước
  alternative: cắt giao ước
  rationale: “Lập giao ước” là tiếng Việt tự nhiên và truyền đạt đúng chức năng của thành ngữ, trong khi chú thích bảo tồn hình thức nghĩa đen “cắt một giao ước” để minh bạch với nguyên văn.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Tên riêng được phiên âm theo lối Việt hóa quen dùng. Dấu chú thích [a] đặt sau toàn bộ mệnh đề “lập giao ước” vì chú thích giải thích thành ngữ Hê-bơ-rơ tương ứng.
