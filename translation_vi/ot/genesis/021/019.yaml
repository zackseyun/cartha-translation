  text: וַ/יִּפְקַ֤ח אֱלֹהִים֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא בְּאֵ֣ר מָ֑יִם וַ/תֵּ֜לֶךְ וַ/תְּמַלֵּ֤א אֶת הַ/חֵ֨מֶת֙ מַ֔יִם וַ/תַּ֖שְׁקְ אֶת הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: vi
  text: Bấy giờ, Đức Chúa Trời mở mắt nàng, và nàng thấy một giếng nước. Nàng đi lấy nước đổ đầy bầu da rồi cho đứa trẻ uống.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: mở
  rationale: Giữ nguyên hình ảnh cụ thể của động từ פקח trong thành ngữ “mở mắt”, đồng thời để ngỏ cách thức Đức Chúa Trời khiến nàng nhận thấy giếng.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong mạch truyện, danh từ này chỉ Đức Chúa Trời duy nhất và đi với động từ số ít; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: עֵינֶיהָ
  choice: mắt nàng
  rationale: Chuyển thành ngữ Hê-bơ-rơ sang cách nói tự nhiên trong tiếng Việt; tiếng Việt thường dùng danh từ “mắt” không đánh dấu số nhiều.
- source_word: וַתֵּרֶא
  choice: nàng thấy
  rationale: Diễn đạt trực tiếp động từ ראה và giữ trình tự kể chuyện sau khi Đức Chúa Trời mở mắt nàng.
- source_word: בְּאֵר מָיִם
  choice: một giếng nước
  rationale: “Giếng nước” là cách nói tự nhiên trong tiếng Việt và phản ánh đầy đủ cụm từ Hê-bơ-rơ.
- source_word: וַתֵּלֶךְ
  choice: Nàng đi
  rationale: Giữ động tác di chuyển và trình tự của lời kể bằng tiếng Việt tự nhiên.
- source_word: וַתְּמַלֵּא
  choice: lấy nước đổ đầy
  rationale: Trong tiếng Việt, cách diễn đạt này tự nhiên với vật chứa và làm rõ nước là thứ được đưa vào bầu da mà không thêm ý ngoài văn bản.
- source_word: הַחֵמֶת
  choice: bầu da
  rationale: חֵמֶת là vật chứa bằng da dùng để mang chất lỏng; “bầu da” vừa gọn vừa nêu đúng chất liệu và công dụng theo ngữ cảnh.
- source_word: מַיִם
  choice: nước
  rationale: Giữ nguyên danh từ chỉ chất được đổ vào vật chứa.
- source_word: וַתַּשְׁקְ
  choice: cho ... uống
  rationale: Diễn đạt tự nhiên thể Hiphil của שׁקה, nghĩa là cho người khác uống.
- source_word: הַנַּעַר
  choice: đứa trẻ
  rationale: נַעַר ở đây chỉ Ích-ma-ên; “đứa trẻ” phù hợp ngữ cảnh gần và không cổ kính như “chàng trai trẻ” hay “thiếu niên”.
theological_decisions:
- issue: Có nên giải thích “Đức Chúa Trời mở mắt nàng” chỉ là khiến nàng chú ý đến một giếng vốn đã có hay không
  choice: 'Giữ nguyên hành động thần linh theo nghĩa đen của thành ngữ: “Đức Chúa Trời mở mắt nàng”'
  alternative: “Đức Chúa Trời khiến nàng nhìn thấy/nhận ra giếng nước”
  rationale: Bản Hê-bơ-rơ trực tiếp quy hành động mở mắt cho Đức Chúa Trời nhưng không giải thích cơ chế; bản dịch giữ nguyên sự căng thẳng và tính mơ hồ đó.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “nàng” để nối tự nhiên với nhân vật nữ đã được xác định trong ngữ cảnh; giữ thành ngữ “mở mắt” thay vì diễn giải. Không dùng chú thích vì bản dịch trực tiếp “bầu da” đã nêu rõ loại vật chứa, và chú thích tiếng Anh được cung cấp có dấu hiệu đặt nhầm sau “her eyes” thay vì sau từ chỉ vật chứa.
