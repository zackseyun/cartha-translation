  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: vi
  text: 'Đức Chúa Trời nghe tiếng cậu bé[a]. Thiên sứ của Đức Chúa Trời từ trời gọi Ha-ga và nói với bà: “Ha-ga, bà làm sao vậy? Đừng sợ, vì Đức Chúa Trời đã nghe tiếng cậu bé ở nơi nó đang ở.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiếng khóc của cậu bé” ở cả hai chỗ; từ Hê-bơ-rơ qol có thể chỉ tiếng kêu khóc trong cơn khốn khó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: Đức Chúa Trời nghe
  rationale: Động từ שׁמע ở thể qal mang nghĩa thông thường là “nghe”; cách dịch này không diễn giải quá mức thành “đáp lời” và vẫn thể hiện diễn tiến của câu chuyện.
- source_word: אֶת קוֹל הַנַּעַר / אֶל קוֹל הַנַּעַר
  choice: tiếng của cậu bé
  rationale: קוֹל trước hết là “tiếng/giọng”; “tiếng” tự nhiên trong tiếng Việt và giữ được sự lặp lại ở cả hai lần, còn “tiếng khóc” là khả năng theo ngữ cảnh nên được nêu trong chú thích.
- source_word: הַנַּעַר
  choice: cậu bé
  rationale: נַעַר chỉ Ích-ma-ên là một người nam còn trẻ; “cậu bé” là cách gọi hiện đại, tự nhiên, không mang sắc thái cổ.
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: Thiên sứ của Đức Chúa Trời ... gọi
  rationale: Giữ nguyên cấu trúc danh từ מַלְאַךְ אֱלֹהִים và không xác định thêm bản thể của vị sứ giả.
- source_word: מִן הַשָּׁמַיִם
  choice: từ trời
  rationale: שׁמים có hình thức số nhiều nhưng trong thành ngữ chỉ nơi chốn này, “từ trời” là cách diễn đạt tiếng Việt tự nhiên và chính xác.
- source_word: מַה לָּךְ
  choice: bà làm sao vậy?
  rationale: Thành ngữ này hỏi tình trạng hoặc điều đang khiến một người khốn khó; cách diễn đạt trên tự nhiên, có sắc thái quan tâm và không hàm ý trách móc.
- source_word: אַל תִּירְאִי
  choice: Đừng sợ
  rationale: Mệnh lệnh phủ định trực tiếp, ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: vì Đức Chúa Trời đã nghe
  rationale: כִּי nêu lý do cho lời trấn an; thì hoàn thành được thể hiện bằng “đã nghe”, nhấn mạnh hành động đã xảy ra mà không thêm ý “đáp lời”.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: tại nơi nó đang nằm
  rationale: Cụm từ có nghĩa đen là “nơi nó ở đó”. Trong mạch truyện trước đó, cậu bé được đặt dưới bụi cây, nên “đang nằm” diễn đạt tự nhiên vị trí hiện thời mà không biến cụm này thành lời mô tả tình trạng nội tâm.
theological_decisions:
- issue: Danh tính của מַלְאַךְ אֱלֹהִים, vị sứ giả có thể được trình bày trong mối liên hệ rất gần với chính Đức Chúa Trời
  choice: Thiên sứ của Đức Chúa Trời
  alternative: một thiên sứ của Đức Chúa Trời; thiên sứ Đức Chúa Trời
  rationale: Cách dịch giữ nguyên biểu thức Hê-bơ-rơ, không quyết định thay cho bản văn rằng vị sứ giả này là một thiên sứ bất kỳ hay phải được đồng nhất bản thể với Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho אֱלֹהִים và “thiên sứ” cho מַלְאַךְ. Đại từ “bà” dành cho Ha-ga thể hiện sự tôn trọng; “nó” dành cho cậu bé phù hợp với lời nói trực tiếp hướng đến người mẹ và tránh lặp danh từ nặng nề.
