  rationale: 'Chỉnh nhẹ để bản văn tự nhiên hơn trong tiếng Việt hiện đại mà không thay đổi nghĩa: thay “chàng” bằng “ông” và dùng thành ngữ “cưới vợ cho ông.” Các chú thích vẫn được neo đúng tại địa danh và hành động thu xếp hôn nhân; chú thích b bảo lưu cách diễn đạt sát chữ cùng khả năng từ אִשָּׁה là “người nữ,” trong khi chính văn dùng “vợ” theo ngữ cảnh.'
  reviewer_model: gpt-5.6-terra
