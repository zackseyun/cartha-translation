  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: vi
  text: Ích-ma-ên sống trong hoang mạc Pha-ran,[a] và mẹ ông cưới vợ cho ông từ đất Ai Cập.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cư ngụ trong vùng hoang vu Pha-ran.”
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “mẹ ông lấy cho ông một người nữ từ đất Ai Cập”; ngữ cảnh cho thấy đây là việc thu xếp một cuộc hôn nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: sống
  rationale: Động từ יָשַׁב có thể chỉ việc ở, cư ngụ hoặc định cư. Trong câu tóm lược này, “sống” tự nhiên trong tiếng Việt hiện đại và không hàm ý sự định cư lâu dài quá mức nguyên văn.
- source_word: בְּמִדְבַּר פָּארָן
  choice: trong hoang mạc Pha-ran
  rationale: מִדְבָּר chỉ vùng hoang vu hoặc hoang mạc, không nhất thiết hoàn toàn là sa mạc cát. “Hoang mạc” vừa trang trọng vừa đủ rộng; tên địa danh פָּארָן được phiên âm là “Pha-ran”.
- source_word: וַתִּקַּח לוֹ אִמּוֹ אִשָּׁה
  choice: mẹ chàng cưới cho chàng một người vợ
  rationale: Nghĩa đen gần với “mẹ chàng lấy cho chàng một người nữ/vợ”, nhưng ngữ cảnh cho thấy bà thu xếp hôn nhân. “Cưới cho” là cách diễn đạt tự nhiên, vẫn giữ vai trò chủ động của người mẹ và ý nghĩa của לוֹ, “cho chàng”.
- source_word: אִשָּׁה
  choice: một người vợ
  rationale: אִשָּׁה có thể nghĩa là “người phụ nữ” hoặc “vợ”. Trong ngữ cảnh người mẹ tìm người phối ngẫu cho con, “người vợ” là nghĩa thích hợp.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: từ đất Ai Cập
  rationale: Giữ lại danh từ אֶרֶץ, “đất/xứ”, thay vì rút gọn thành chỉ “Ai Cập”; “đất Ai Cập” tự nhiên và sát cấu trúc Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Chủ ngữ “Ích-ma-ên” được nêu rõ theo ngữ cảnh thay cho đại từ Hê-bơ-rơ để câu đứng riêng vẫn sáng nghĩa; “chàng” tránh sự mơ hồ của “ông” và phù hợp với một người con trai trẻ trong mạch truyện. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
