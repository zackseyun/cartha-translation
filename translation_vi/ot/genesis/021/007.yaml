  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: vi
  text: 'Bà nói: “Ai có thể nói với Áp-ra-ham rằng Sa-ra sẽ cho con bú?[a] Vì tôi đã sinh một con trai khi ông đã già.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Sa-ra sẽ cho các con trai bú?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Bà nói
  rationale: Thể wayyiqtol tiếp nối mạch kể chuyện; tiếng Việt không cần thêm liên từ nếu ngữ cảnh đã rõ.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: Ai có thể nói với Áp-ra-ham
  rationale: Câu hỏi tu từ bộc lộ sự kinh ngạc trước điều không ai ngờ tới; “có thể nói” giữ được sắc thái ấy mà không biến thành một lời kể đơn thuần trong quá khứ.
- source_word: הֵינִיקָה
  choice: sẽ cho con bú
  rationale: Hiphil của ינק chỉ việc người mẹ cho bú; cách diễn đạt này tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: בָנִים
  choice: con
  rationale: Nguyên văn dùng danh từ số nhiều “các con trai”; trong tiếng Việt, “cho con bú” là cách nói tự nhiên và không đánh mất ý nghĩa theo ngữ cảnh. Dị bản sát chữ được ghi ở chú thích.
- source_word: שָׂרָה
  choice: Sa-ra
  rationale: Phiên âm tên riêng theo lối quen dùng trong bản văn Kinh Thánh tiếng Việt.
- source_word: כִּי
  choice: Thế mà
  rationale: Trong lời cảm thán này, כִּי dẫn vào sự kiện làm nền cho nỗi kinh ngạc. “Thế mà” chuyển tải tự nhiên sắc thái bất ngờ, dù cũng có thể hiểu theo hướng giải thích là “Vì”.
- source_word: יָלַדְתִּי בֵן
  choice: tôi đã sinh cho ông một con trai
  rationale: “Sinh một con trai” thể hiện trực tiếp nội dung; thêm “cho ông” làm rõ quan hệ của לִזְקֻנָיו với Áp-ra-ham và tự nhiên trong tiếng Việt.
- source_word: לִזְקֻנָיו
  choice: khi ông đã già
  rationale: Diễn đạt tự nhiên ý Áp-ra-ham đã ở tuổi cao khi đứa con được sinh ra.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Câu hỏi tu từ được giữ để diễn tả niềm kinh ngạc của Sa-ra; tên riêng dùng dạng Áp-ra-ham và Sa-ra quen thuộc với độc giả tiếng Việt.
