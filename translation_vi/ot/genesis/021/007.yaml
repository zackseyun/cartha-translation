  - severity: medium
    issue: “Sinh cho ông một con trai” thêm quan hệ thụ hưởng không được diễn đạt trong tiếng Hê-bơ-rơ.
    rationale: יָלַדְתִּי בֵן chỉ nói “tôi đã sinh một con trai”; לִזְקֻנָיו nghĩa là “khi/trong tuổi già của ông ấy.” Bỏ “cho ông” tránh thêm sắc thái không cần thiết.
  revised_text: 'Bà nói: “Ai có thể nói với Áp-ra-ham rằng Sa-ra sẽ cho con bú?[a] Vì tôi đã sinh một con trai khi ông đã già.”'
