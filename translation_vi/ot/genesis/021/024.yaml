  text: And Abraham said[a], “I swear it.”
translation:
  language: vi
  text: 'Áp-ra-ham nói: “Tôi sẽ thề.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi thề” hoặc “Tôi sẽ lập một lời thề.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: đáp
  rationale: Động từ אמר với waw liên tiếp tiếp nối lời đối thoại. Trong ngữ cảnh Áp-ra-ham trả lời yêu cầu của A-bi-mê-léc, “đáp” tự nhiên hơn “nói” mà không thêm ý nghĩa ngoài văn cảnh.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אָנֹכִי
  choice: Tôi
  rationale: Đại từ độc lập làm chủ thể được nêu rõ và có thể mang sắc thái nhấn mạnh; tiếng Việt tự nhiên diễn đạt bằng “Tôi” mà không cần thêm “chính tôi”.
- source_word: אִשָּׁבֵעַ
  choice: xin thề
  rationale: Dạng Nifal imperfect của שבע có nghĩa “thề, lập lời thề”. Trong lời đáp chấp thuận một yêu cầu, “xin thề” vừa tự nhiên vừa giữ lực ý nguyện của động từ; cũng có thể hiểu là “tôi sẽ thề”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn. “Đáp” phù hợp với lượt lời trong đối thoại; “xin thề” không mang nghĩa cầu xin mà là cách tiếng Việt tự nhiên để long trọng nhận lời thề.
