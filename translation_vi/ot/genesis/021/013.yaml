source:
  edition: WLC
  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: vi
  text: Ta cũng sẽ làm cho con trai của người nữ nô lệ[a] thành một dân tộc, vì người ấy là dòng dõi của con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “con trai của nữ tỳ” hoặc “con trai của đầy tớ gái.”
    reason: Phương án từ vựng cho אָמָה; bản chính giữ rõ địa vị nô lệ, còn chú thích ghi nhận các cách dịch truyền thống hoặc ít trực tiếp hơn.
lexical_decisions:
- source_word: וְגַם
  choice: Ta cũng sẽ
  rationale: וְ kết hợp với גַם tiếp nối lời phán trước và nhấn mạnh ý bổ sung; cách đặt “cũng” trước động từ tự nhiên trong tiếng Việt.
- source_word: אֶת בֶּן הָאָמָה
  choice: con trai của người nữ nô lệ
  rationale: בֶּן là “con trai”, còn אָמָה chỉ một phụ nữ ở địa vị nô lệ hoặc tôi tớ. “Người nữ nô lệ” diễn đạt rõ thân phận lệ thuộc của Ha-ga mà không làm nhẹ thực tại xã hội trong câu chuyện.
- source_word: לְגוֹי
  choice: thành một dân tộc
  rationale: 'Kết hợp với שׂים, giới từ לְ biểu thị kết quả: người con ấy sẽ trở thành một dân tộc.'
- source_word: אֲשִׂימֶנּוּ
  choice: sẽ làm cho ... thành
  rationale: Trong ngữ cảnh này, שׂים mang nghĩa thiết lập hoặc khiến trở thành; cấu trúc “làm cho ... thành” vừa chính xác vừa tự nhiên.
- source_word: כִּי
  choice: vì
  rationale: כִּי nêu lý do cho lời hứa của Đức Chúa Trời đối với con trai Ha-ga.
- source_word: זַרְעֲךָ
  choice: dòng dõi của con
  rationale: זֶרַע có thể chỉ hạt giống, con cháu hoặc dòng dõi; ở đây chỉ người con thuộc huyết thống của Áp-ra-ham. “Dòng dõi” giữ được sắc thái gia tộc và phạm vi nghĩa của từ Hê-bơ-rơ.
- source_word: הוּא
  choice: nó là
  rationale: Đại từ số ít giống đực được nêu rõ để nhấn mạnh chủ thể. Trong lời Đức Chúa Trời nói với Áp-ra-ham, “nó” là cách gọi một người con tự nhiên theo văn phong Việt ngữ.
theological_decisions:
- issue: Cách dịch אָמָה và địa vị xã hội của Ha-ga
  choice: người nữ nô lệ
  alternative: nữ tỳ; người nữ đầy tớ
  rationale: Từ Hê-bơ-rơ chỉ một phụ nữ có địa vị lệ thuộc. “Người nữ nô lệ” không che mờ thân phận bị ràng buộc vốn có ý nghĩa trong mạch truyện, đồng thời không thêm diễn giải giáo phái.
- issue: Phạm vi nghĩa của זֶרַע
  choice: dòng dõi
  alternative: con cháu; hậu duệ
  rationale: Trong câu này, từ ấy quy chiếu trực tiếp đến Ích-ma-ên như con của Áp-ra-ham nhưng vẫn mang sắc thái gia hệ rộng hơn; “dòng dõi” giữ được độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” để thể hiện lời Đức Chúa Trời phán trực tiếp với Áp-ra-ham. Không thêm chú thích vì các phương án “nữ tỳ” và “người nữ đầy tớ” không cần thiết để hiểu câu, còn bản chính đã phản ánh rõ nghĩa xã hội của אָמָה.
