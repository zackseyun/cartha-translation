  to: Ta cũng sẽ làm cho con trai của người nữ nô lệ[a] thành một dân tộc, vì người ấy là dòng dõi của con.
  rationale: Chỉnh sửa chỉ thay đại từ “nó” bằng “người ấy” để tránh sắc thái bất kính/phi nhân hóa không có trong nguyên ngữ, và bổ sung chú thích có neo cho אָמָה nhằm duy trì các phương án từ vựng trong audit trail. Không thay đổi ý nghĩa, quan hệ nhân thân, hay mức độ xác định của nguyên văn.
