base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: vi
  text: 'Ông nói: “Ông hãy nhận bảy con chiên cái này từ tay tôi, để việc này[a] là bằng chứng cho tôi rằng tôi đã đào giếng này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để chúng làm chứng cho tôi.” Động từ Hê-bơ-rơ ở số ít, dù đối tượng vừa được nhắc đến là bảy con chiên cái; số ít có thể xem chúng như một tập thể hoặc chỉ về hành vi hay thỏa thuận này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ông nói
  rationale: Thể wayyiqtol tiếp nối mạch kể; tiếng Việt không cần thêm liên từ “và” trong ngữ cảnh này.
- source_word: כִּי אֶת שֶׁבַע כְּבָשֹׂת תִּקַּח
  choice: Ông hãy nhận bảy chiên con cái này
  rationale: כִּי dẫn vào nội dung lời giải thích/chỉ thị; תִּקַּח mang sắc thái yêu cầu. כְּבָשֹׂת chỉ chiên cái, còn “này” được bổ sung tự nhiên theo vật đang hiện diện trong cảnh.
- source_word: מִיָּדִי
  choice: từ tay tôi
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ về việc trao nhận chính thức.
- source_word: בַּעֲבוּר
  choice: để
  rationale: Diễn đạt mục đích một cách tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: תִּהְיֶה לִּי לְעֵדָה
  choice: việc ấy làm chứng cho tôi
  rationale: Động từ ở số ít giống cái, nên bản dịch dùng một chủ thể số ít hàm chỉ việc trao nhận/sự sắp đặt này, thay vì làm động từ hòa hợp trực tiếp với bảy con chiên.
- source_word: כִּי חָפַרְתִּי
  choice: rằng chính tôi đã đào
  rationale: כִּי giới thiệu nội dung lời chứng. “Chính tôi” làm rõ giá trị xác nhận quyền đào giếng mà không đổi nội dung mệnh đề.
- source_word: הַבְּאֵר הַזֹּאת
  choice: giếng này
  rationale: Cách diễn đạt trực tiếp, tự nhiên của cụm danh từ xác định kèm đại từ chỉ định.
theological_decisions:
- issue: Chủ thể số ít của תִּהְיֶה dù tiền ngữ gần là bảy chiên con cái
  choice: việc ấy làm chứng cho tôi
  alternative: chúng làm chứng cho tôi
  rationale: Giữ số ít rõ ràng của động từ Hê-bơ-rơ và để ngỏ việc nó quy chiếu tập thể đến bảy con chiên hoặc đến hành vi/thỏa thuận trao nhận; chú thích bảo tồn cách hiểu thay thế.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” cho lời đối thoại giữa hai người trưởng thành, “chiên con cái” để giữ rõ giới tính của כְּבָשֹׂת, và đặt dấu chú thích ngay sau câu có điểm cần giải thích.
