  rationale: Sửa “làm phép cắt bì” thành “cắt bì” để bám sát động từ מול; thay đại từ khẩu ngữ “cậu” bằng tên riêng để giữ thanh vực trang trọng và quy chiếu rõ. Chú thích được chỉnh để phản ánh sát hơn thành ngữ בן שמנת ימים, trong khi bản văn chính vẫn dùng cách diễn đạt tuổi tác tự nhiên trong tiếng Việt.
