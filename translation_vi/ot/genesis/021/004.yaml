  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: vi
  text: Áp-ra-ham cắt bì cho I-sác, con trai ông, khi I-sác được tám ngày tuổi[a], đúng như Đức Chúa Trời đã truyền cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một con trai tám ngày tuổi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  choice: làm phép cắt bì
  rationale: Động từ מול chỉ cụ thể việc cắt bì; cách diễn đạt này chính xác, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: אֶת יִצְחָק
  choice: I-sác
  rationale: Dấu hiệu trực bổ ngữ đi cùng tên riêng; tên được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: בְּנוֹ
  choice: con trai mình
  rationale: Giữ lại sự nhấn mạnh về quan hệ cha con trong nguyên văn, đồng thời dùng “mình” để quy chiếu tự nhiên về Áp-ra-ham.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: khi cậu được tám ngày tuổi
  rationale: Chuyển thành ngữ Hê-bơ-rơ về tuổi tác sang cách nói tự nhiên trong tiếng Việt; “cậu” quy chiếu rõ đến I-sác là con trẻ.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn đạt sự làm theo chính xác mệnh lệnh đã ban, phù hợp lực nghĩa của liên từ so sánh.
- source_word: צִוָּה אֹתוֹ
  choice: đã truyền cho ông
  rationale: Từ “đã” cho thấy mệnh lệnh có trước hành động trong diễn tiến câu chuyện mà không thêm ý ngoài nguyên văn.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh, danh từ chỉ Đức Chúa Trời duy nhất và đi với động từ số ít; đây là cách gọi trang trọng, phổ biến trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách thể hiện thời điểm của mệnh lệnh Đức Chúa Trời
  choice: đã truyền cho ông
  alternative: truyền cho ông
  rationale: Nguyên văn Hê-bơ-rơ không đánh dấu thì quá khứ hoàn thành như tiếng Anh, nhưng ngữ cảnh cho thấy mệnh lệnh có trước hành động. “Đã truyền” thể hiện quan hệ thời gian ấy một cách tự nhiên mà không áp đặt nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu bám sát nguyên văn nhưng chuyển thành ngữ tuổi tác sang tiếng Việt tự nhiên; giữ rõ quan hệ cha con và sự vâng theo mệnh lệnh của Đức Chúa Trời.
