  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc giải thích tên gọi của nguyên văn; chú thích bảo tồn lối chơi chữ Hê-bơ-rơ vốn không thể chuyển trọn vẹn vào chính văn.
