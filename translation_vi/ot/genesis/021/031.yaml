source:
  edition: WLC
  text: עַל כֵּ֗ן קָרָ֛א לַ/מָּק֥וֹם הַ/ה֖וּא בְּאֵ֣ר שָׁ֑בַע כִּ֛י שָׁ֥ם נִשְׁבְּע֖וּ שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/031.yaml
  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
translation:
  language: vi
  text: Vì thế, ông gọi nơi ấy là Bê-e Sê-ba[a], vì tại đó cả hai đã thề.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Bê-e Sê-ba có âm gần với tiếng Hê-bơ-rơ chỉ cả “giếng của bảy” lẫn “giếng của lời thề”; lời giải thích ở đây đặc biệt liên hệ tên ấy với lời thề được lập tại đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân-kết quả và nối trực tiếp việc đặt tên với sự kiện vừa kể.
- source_word: קָרָא
  choice: gọi ... là
  rationale: Giữ sát nghĩa động từ 'gọi/đặt tên' và phù hợp tự nhiên với cấu trúc đặt địa danh trong tiếng Việt.
- source_word: לַמָּקוֹם הַהוּא
  choice: nơi ấy
  rationale: Giữ sắc thái xác định và chỉ xuất của cụm Hê-bơ-rơ, đồng thời trang trọng mà vẫn dễ hiểu.
- source_word: בְּאֵר שָׁבַע
  choice: Bê-e Sê-ba
  rationale: Phiên âm địa danh theo dạng quen dùng trong Kinh Thánh tiếng Việt; lối chơi chữ giữa 'giếng', 'bảy' và 'lời thề' được giải thích trong chú thích thay vì ép vào chính văn.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu trực tiếp lý do của việc gọi tên.
- source_word: שָׁם
  choice: tại đó
  rationale: Chuyển tải rõ trạng từ chỉ nơi chốn, quy chiếu về địa điểm vừa được nhắc đến.
- source_word: נִשְׁבְּעוּ
  choice: đã thề với nhau
  rationale: Động từ Niphal có nghĩa 'thề, lập lời thề'; thêm 'với nhau' làm rõ hành động hỗ tương của hai bên trong ngữ cảnh mà không thêm nội dung thần học.
- source_word: שְׁנֵיהֶם
  choice: hai người
  rationale: Phản ánh trực tiếp ý nghĩa song đôi của từ Hê-bơ-rơ và nhấn mạnh hai bên cùng tham gia lời thề.
