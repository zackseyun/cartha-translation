base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: vi
  text: 'Sa-ra nói: “Đức Chúa Trời đã làm nên tiếng cười cho tôi; bất cứ ai nghe cũng sẽ cười cùng tôi.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ cười nhạo tôi” hoặc “sẽ cười vì tôi.” Tiếng Hê-bơ-rơ cho phép nhiều sắc thái; trong ngữ cảnh này, nghĩa có khả năng nhất là cùng chung vui với Sa-ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: nói
  rationale: Dạng waw-consecutive tiếp nối mạch kể chuyện; tiếng Việt không cần dịch liên từ một cách máy móc, và “Sa-ra nói” là tự nhiên, trang trọng.
- source_word: שָׂרָה
  choice: Sa-ra
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong tiếng Việt.
- source_word: צְחֹק
  choice: tiếng cười
  rationale: Giữ dạng danh từ và mối chơi chữ với động từ יִצְחַק, đồng thời gợi liên hệ với tên Y-sác.
- source_word: עָשָׂה לִי
  choice: đã làm nên ... cho tôi
  rationale: Bám sát cấu trúc “đã làm cho tôi” của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, danh từ chỉ Đức Chúa Trời duy nhất và động từ đi kèm ở số ít.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: bất cứ ai nghe chuyện này
  rationale: Cụm từ có hình thức số ít nhưng mang nghĩa phân phối. “Chuyện này” làm rõ đối tượng được nghe vốn được ngữ cảnh ngầm hiểu.
- source_word: יִצְחַק
  choice: sẽ cười
  rationale: Giữ nghĩa trực tiếp “cười” và sự lặp lại cùng gốc từ với צְחֹק, thay vì diễn giải thành “vui mừng”.
- source_word: לִי
  choice: cùng tôi
  rationale: Trong ngữ cảnh mừng vui vì Y-sác ra đời, cách hiểu có khả năng nhất là người nghe cùng chia sẻ tiếng cười với Sa-ra; các sắc thái khác được giữ trong chú thích.
theological_decisions:
- issue: Sắc thái của יִצְחַק לִי ở mệnh đề cuối
  choice: sẽ cười cùng tôi
  alternative: sẽ cười tôi / sẽ cười vì tôi
  rationale: Ngữ cảnh tích cực về việc Đức Chúa Trời ban con cho Sa-ra nghiêng về tiếng cười chung vui. Tuy nhiên, giới từ לִי cho phép hơn một sắc thái, nên bản văn chính chọn nghĩa phù hợp ngữ cảnh nhất và chú thích bảo lưu tính mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “làm nên tiếng cười” giữ hình ảnh cụ thể cùng lối chơi chữ của nguyên văn; “cùng tôi” diễn đạt cách hiểu chính nhưng không xóa bỏ nghĩa khác, được nêu ở chú thích.
