base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: vi
  text: Khi Nô-ê tỉnh dậy sau cơn say rượu, ông biết điều người con trai út[a] của ông đã làm với ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người con trai nhỏ hơn”. Tính từ Hê-bơ-rơ có thể mang nghĩa “nhỏ”, “trẻ hơn” hoặc “trẻ nhất”, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: tỉnh dậy
  rationale: Động từ יקץ chỉ việc thức dậy khỏi giấc ngủ. Cách dịch này giữ nghĩa trực tiếp, không diễn giải thành “tỉnh rượu”.
- source_word: מִיֵּינוֹ
  choice: sau men rượu
  rationale: Nguyên văn là “khỏi/từ rượu của mình”, chỉ việc Nô-ê thức dậy sau trạng thái do rượu gây ra. “Sau men rượu” vừa tự nhiên trong tiếng Việt vừa không diễn giải quá mức thành “cơn say”.
- source_word: וַיֵּדַע
  choice: ông biết
  rationale: ידע thường có nghĩa là “biết”. Trong mạch kể, từ này cũng có thể hàm ý nhận biết hoặc biết được, nhưng “ông biết” giữ sát cách diễn đạt của tiếng Hê-bơ-rơ.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: điều ... đã làm với mình
  rationale: Mệnh đề không xác định cụ thể hành động, chỉ nói Nô-ê biết điều đã được làm đối với mình. Từ “đã” thể hiện hành động xảy ra trước khi ông tỉnh dậy và biết việc ấy.
- source_word: בְּנוֹ הַקָּטָן
  choice: người con trai út
  rationale: קָטָן có thể mang nghĩa nhỏ, trẻ hơn hoặc trẻ nhất. Trong quan hệ tuổi tác giữa các con, “con trai út” là cách diễn đạt tự nhiên, còn khả năng “con trai nhỏ hơn” được giữ trong chú thích.
theological_decisions:
- issue: Bản chất hành động đã làm đối với Nô-ê
  choice: 'Giữ cách nói khái quát: “điều ... đã làm với mình”.'
  alternative: Giải thích đó là việc nhìn thấy rồi kể lại sự trần truồng của Nô-ê, hoặc là một hành vi xâm phạm nghiêm trọng hơn.
  rationale: Câu Hê-bơ-rơ không nói rõ hành động ấy là gì. Bản dịch không thêm một cách giải thích cụ thể, nhờ đó giữ nguyên sự mơ hồ và căng thẳng của bản văn.
- issue: Người được gọi là “con trai út”
  choice: Dịch בְּנוֹ הַקָּטָן là “người con trai út” trong chính văn.
  alternative: “người con trai nhỏ hơn” hoặc “người con trai trẻ hơn”.
  rationale: Cách hiểu theo thứ bậc tuổi là tự nhiên trong ngữ cảnh gia đình, nhưng tính từ Hê-bơ-rơ vẫn có thể mang nghĩa so sánh; chú thích bảo lưu khả năng đó mà không xác định thêm người được nhắc đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sau men rượu” giữ hình ảnh của nguyên văn nhưng vẫn tự nhiên trong tiếng Việt; đại từ “ông” giúp câu kể rõ ràng mà không thêm nội dung.
