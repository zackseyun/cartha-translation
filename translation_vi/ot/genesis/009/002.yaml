revisions:
- from: Nỗi sợ và kinh hãi về các con sẽ bao trùm mọi loài vật trên đất, mọi loài chim trên trời, mọi vật bò trên mặt đất và mọi loài cá dưới biển. Chúng đã được trao vào tay các con.[a]
  to: Nỗi sợ các con gây ra và sự kinh hãi các con gây ra sẽ bao trùm mọi loài vật trên đất, mọi loài chim trên trời, mọi loài bò trườn trên mặt đất và mọi loài cá biển. Chúng đã được phó vào tay các con.[a]
  rationale: Bản sửa làm rõ quan hệ sở hữu/genitive của hai danh từ chỉ sự sợ hãi, cải thiện cách gọi nhóm sinh vật bò trườn và cá biển, đồng thời bảo toàn cấu trúc, sắc thái tuyên bố, thể bị động và ẩn dụ "vào tay" của tiếng Hê-bơ-rơ. Không thêm diễn giải về phạm vi hay tính chất quyền của con người.
