source:
  edition: WLC
  text: וּ/מוֹרַאֲ/כֶ֤ם וְ/חִתְּ/כֶם֙ יִֽהְיֶ֔ה עַ֚ל כָּל חַיַּ֣ת הָ/אָ֔רֶץ וְ/עַ֖ל כָּל ע֣וֹף הַ/שָּׁמָ֑יִם בְּ/כֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽ/אֲדָמָ֛ה וּֽ/בְ/כָל דְּגֵ֥י הַ/יָּ֖ם בְּ/יֶדְ/כֶ֥ם נִתָּֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: vi
  text: Nỗi sợ các con gây ra và sự kinh hãi các con gây ra sẽ bao trùm mọi loài vật trên đất, mọi loài chim trên trời, mọi loài bò trườn trên mặt đất và mọi loài cá biển. Chúng đã được phó vào tay các con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Được phó vào tay” là thành ngữ chỉ việc được đặt dưới quyền hoặc sự kiểm soát của một người.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: Nỗi sợ và kinh hãi về các con
  rationale: Hai danh từ diễn tả nỗi sợ do con người gây ra; cách dịch này giữ cặp từ tăng cường mà vẫn tự nhiên trong tiếng Việt.
- source_word: יִהְיֶה עַל
  choice: sẽ bao trùm
  rationale: Cụm này chỉ một trạng thái sẽ ở trên mọi loài vật; “bao trùm” truyền đạt hình ảnh và quan hệ ấy tự nhiên hơn cách dịch sát chữ “sẽ ở trên”.
- source_word: חַיַּת הָאָרֶץ
  choice: mọi loài vật trên đất
  rationale: Trong ngữ cảnh liệt kê các nhóm sinh vật, חַיָּה chỉ các loài vật sống trên đất; không thu hẹp không cần thiết thành thú hoang.
- source_word: עוֹף הַשָּׁמָיִם
  choice: mọi loài chim trên trời
  rationale: “Chim trên trời” là cách nói tự nhiên, trang trọng vừa phải và phản ánh thành ngữ Hê-bơ-rơ.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: mọi vật bò trên mặt đất
  rationale: רמשׂ gợi chuyển động bò hoặc trườn sát đất; “mặt đất” phân biệt אֲדָמָה với הָאָרֶץ ở vế trước.
- source_word: דְּגֵי הַיָּם
  choice: mọi loài cá dưới biển
  rationale: Diễn đạt tự nhiên phạm vi toàn thể cá biển; “dưới biển” phù hợp cách dùng tiếng Việt trong chuỗi môi trường sống.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: Chúng đã được trao vào tay các con
  rationale: Giữ thể bị động và ẩn dụ Hê-bơ-rơ về việc được đặt dưới quyền kiểm soát, đồng thời dùng thì hoàn thành thích hợp với động từ perfect.
theological_decisions:
- issue: Quyền của con người trên các loài vật sau trận lụt
  choice: Giữ hình ảnh “được trao vào tay các con”, hàm ý các loài vật được đặt dưới quyền con người.
  alternative: Diễn giải trực tiếp là “được đặt dưới quyền cai quản của các con”.
  rationale: Bản dịch giữ mức độ khẳng định của nguyên văn nhưng không mở rộng thành một hệ thống thần học hay đạo đức vượt quá câu này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các con” vì lời phán hướng đến Nô-ê và các con trai ông; tránh lối cổ “các ngươi”. Dấu chú thích được đặt ngay sau mệnh đề chứa thành ngữ cần giải thích.
