  - severity: low
    issue: Dấu chú thích [a] đang đặt sau toàn bộ lời trích dẫn thay vì ngay sau từ “đất”.
    rationale: Chú thích chỉ liên quan đến הָאָרֶץ/“đất”; đặt mốc sau từ này làm rõ phạm vi chú thích.
