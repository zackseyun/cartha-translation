source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: vi
  text: 'Đức Chúa Trời ban phước cho Nô-ê và các con trai ông, rồi phán với họ: “Hãy sinh sôi, gia tăng và làm cho đầy dẫy đất[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xứ”; tuy nhiên, trong bối cảnh sau hồng thủy và do sự tương ứng với Sáng Thế Ký 1:28, “đất” ở đây nhiều khả năng chỉ toàn thể địa cầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ban phước
  rationale: Dạng piel của ברך nói đến việc Đức Chúa Trời thực sự ban phước, không chỉ nói lời tốt lành; “ban phước” tự nhiên và trang trọng trong tiếng Việt.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong mạch truyện này, từ này chỉ Đức Chúa Trời duy nhất; cách gọi này rõ nghĩa và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Tiếng Hê-bơ-rơ nói cụ thể đến các con trai của Nô-ê, không dùng từ chung chỉ con cái.
- source_word: וַיֹּאמֶר לָהֶם
  choice: rồi phán với họ
  rationale: “Phán” phù hợp khi Đức Chúa Trời trực tiếp nói; “rồi” diễn đạt tự nhiên trình tự của lối kể chuyện Hê-bơ-rơ mà không làm thay đổi quan hệ ý nghĩa.
- source_word: פְּרוּ
  choice: Hãy sinh sôi
  rationale: Diễn đạt mệnh lệnh về khả năng sinh sản và giữ được sự tương ứng với ngôn ngữ của Sáng Thế Ký 1:28.
- source_word: וּרְבוּ
  choice: gia tăng
  rationale: Truyền đạt sự tăng lên về số lượng; kết hợp “sinh sôi, gia tăng” vừa tự nhiên vừa giữ hai động từ riêng biệt của nguyên văn.
- source_word: וּמִלְאוּ
  choice: làm đầy dẫy
  rationale: Giữ nghĩa cơ bản là làm cho đầy, không thêm hàm ý phải tái lập dân số mà động từ Hê-bơ-rơ tự nó không bắt buộc.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Từ אֶרֶץ có thể chỉ đất, xứ hoặc toàn thể địa cầu. “Đất” giữ được độ rộng nghĩa vốn có trong tiếng Hê-bơ-rơ, trong khi ngữ cảnh hậu hồng thủy và sự vọng lại Sáng Thế Ký 1:28 thiên về phạm vi toàn thế giới.
theological_decisions:
- issue: Mối liên hệ với mệnh lệnh sáng tạo trong Sáng Thế Ký 1:28
  choice: Giữ chuỗi mệnh lệnh ngắn gọn “Hãy sinh sôi, gia tăng và làm đầy dẫy đất” để bảo tồn sự lặp lại có chủ ý của ngôn ngữ sáng tạo.
  alternative: Diễn giải thành “Hãy sinh nhiều con và làm cho loài người đông đảo khắp thế giới.”
  rationale: Nguyên văn lặp lại lời ban phước trong trình thuật sáng tạo, qua đó nối nhân loại sau hồng thủy với sứ mạng ban đầu; bản dịch không nên diễn giải thêm hoặc làm mờ mối liên hệ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời và giữ cấu trúc ba mệnh lệnh cô đọng nhằm tái hiện nhịp điệu cùng sự liên văn bản của nguyên văn. Dấu chú thích [a] được đặt ngay sau từ có phương án dịch khác.
