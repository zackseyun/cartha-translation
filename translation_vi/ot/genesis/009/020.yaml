base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: vi
  text: Nô-ê, một người làm nông[a], bắt đầu trồng một vườn nho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một người của đất”; cách nói này chỉ một người gắn với công việc canh tác.'
    reason: literal_rendering
  - marker: b
    text: Cách diễn đạt tiếng Hê-bơ-rơ rất cô đọng. Cũng có thể diễn đạt sát cấu trúc là “bắt đầu rồi trồng một vườn nho,” hoặc hiểu là “là người đầu tiên trồng một vườn nho.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: bắt đầu
  rationale: Động từ Hiphil của חלל trong ngữ cảnh này tự nhiên nhất mang nghĩa “bắt đầu”; ý nghĩa của nó tiếp tục sang động từ “trồng” theo lối diễn đạt cô đọng của tiếng Hê-bơ-rơ.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dạng phiên âm tên riêng đã quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: אִישׁ הָאֲדָמָה
  choice: một người canh tác đất đai
  rationale: Cụm từ theo sát nghĩa đen là “một người của đất”; bản dịch dùng cách nói tự nhiên trong tiếng Việt để diễn đạt nghề nghiệp và mối liên hệ với việc canh tác, nhưng vẫn ghi nhận sắc thái nguyên văn trong chú thích.
- source_word: וַיִּטַּע
  choice: trồng
  rationale: Cách dịch trực tiếp và thông dụng của נטע.
- source_word: כָּרֶם
  choice: một vườn nho
  rationale: Chỉ khu đất được trồng nho; đây là cách diễn đạt chính xác, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách hiểu chuỗi diễn đạt cô đọng וַיָּחֶל ... וַיִּטַּע
  choice: bắt đầu trồng một vườn nho
  alternative: là người đầu tiên trồng một vườn nho; bắt đầu rồi trồng một vườn nho
  rationale: “Bắt đầu trồng” thể hiện tự nhiên quan hệ giữa hai động từ trong mạch kể chuyện mà không thêm ý rằng Nô-ê là người đầu tiên. Chú thích giữ lại tính cô đọng và khả năng hiểu khác của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Canh tác đất đai” tránh cách nói quá cổ như “người cày ruộng,” đồng thời truyền đạt tự nhiên thành ngữ Hê-bơ-rơ. Câu giữ sự mơ hồ của cấu trúc động từ trong chú thích thay vì quyết đoán rằng Nô-ê là người đầu tiên trồng nho.
