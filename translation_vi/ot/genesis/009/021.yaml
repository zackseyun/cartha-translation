  - severity: medium
    issue: “Tự để mình trần truồng” không thật tự nhiên và có thể nhấn ý hành động có chủ ý quá mức.
    rationale: Hình Hitpael cho phép cách hiểu phản thân, nhưng động từ cũng có thể được hiểu theo nghĩa trạng thái. “Phơi trần” là cách kể tự nhiên hơn và chú thích bảo tồn các khả năng dịch khác.
