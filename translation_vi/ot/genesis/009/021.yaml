base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: vi
  text: Ông uống một ít rượu ấy[a], say rượu, rồi phơi trần[b] trong lều mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “uống từ rượu ấy.” Cụm này có lẽ mang nghĩa phân lượng: “uống một ít rượu ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tự phơi mình” hoặc “bị phơi trần.” Động từ Hê-bơ-rơ có thể được hiểu theo nghĩa phản thân hoặc theo nghĩa trạng thái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: Ông uống
  rationale: Động từ Qal wayyiqtol của שׁתה diễn tả hành động kế tiếp trong mạch kể. Tiếng Việt không cần lặp liên từ ở đầu mọi mệnh đề.
- source_word: מִן הַיַּיִן
  choice: rượu ấy
  rationale: מִן có sắc thái phân lượng, nghĩa đen là “từ rượu ấy”; trong tiếng Việt, “uống rượu ấy” tự nhiên và theo ngữ cảnh đã hàm ý uống một phần lượng rượu, còn chú thích giữ cách dịch sát hơn.
- source_word: וַיִּשְׁכָּר
  choice: say rượu
  rationale: Qal của שׁכר chỉ việc đi vào tình trạng say. “Say rượu” rõ nghĩa, tự nhiên và trang trọng vừa phải.
- source_word: וַיִּתְגַּל
  choice: tự để mình trần truồng
  rationale: Hitpael của גלה ở đây thuận theo nghĩa phản thân, chỉ việc Nô-ê làm thân thể mình bị phơi bày; cách dịch này giữ sắc thái phản thân mà không thêm diễn giải về động cơ.
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: ở trong lều mình
  rationale: בְּתוֹךְ chỉ vị trí bên trong; “ở trong lều mình” là cách diễn đạt tiếng Việt tự nhiên và chính xác.
theological_decisions:
- issue: Cách trình bày tình trạng say và sự phơi bày thân thể của Nô-ê
  choice: 'Dịch theo lối mô tả: “say rượu, rồi tự để mình trần truồng”'
  alternative: “nằm trần truồng” hoặc “bị phơi trần”
  rationale: Câu Hê-bơ-rơ thuật lại các sự việc mà không trực tiếp đưa ra phán xét đạo đức hay giải thích tính chất của sự phơi bày. Lối dịch phản thân giữ được hình thái động từ nhưng không áp đặt động cơ hoặc diễn giải mang tính tình dục.
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang nghiêm vừa phải. Dùng “ông” để nối chủ thể Nô-ê từ ngữ cảnh trước; tránh thêm lời phán xét không có trong nguyên văn.
