  terminology: “Say rượu” và “lều mình” phù hợp. “Phơi trần” diễn đạt việc thân thể không được che phủ mà không giới hạn nghĩa vào việc cởi một loại y phục cụ thể; chú thích giữ phương án phản thân và phương án trạng thái.
