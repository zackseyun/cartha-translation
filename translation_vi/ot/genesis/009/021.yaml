  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng chuỗi hành động của tiếng Hê-bơ-rơ: Nô-ê uống rượu, trở nên say, rồi bị/phơi thân trong lều của mình. Tuy nhiên, “uống rượu ấy” làm mờ sắc thái phân lượng của מִן, và “tự để mình trần truồng” hơi gượng trong tiếng Việt hiện đại, đồng thời diễn đạt ý chủ động rõ hơn mức cần thiết trong một động từ có cách hiểu còn được bàn luận.'
