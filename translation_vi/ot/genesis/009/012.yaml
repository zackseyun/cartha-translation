  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: vi
  text: 'Đức Chúa Trời phán: “Đây là dấu hiệu của giao ước mà Ta lập giữa Ta với các ngươi và với mọi sinh vật ở cùng các ngươi, cho các thế hệ mãi về sau:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ tiếp diễn mạch kể; với chủ thể là Đức Chúa Trời, “phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt. Không cần dịch riêng liên từ וַ־ vì trình tự đã rõ.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Chỉ Đức Chúa Trời đang phán với Nô-ê; đây là cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Đây là dấu hiệu của giao ước
  rationale: Giữ quan hệ xác định giữa “dấu hiệu” và “giao ước”; thêm “là” theo cú pháp tự nhiên của tiếng Việt.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: mà Ta lập
  rationale: נֹתֵן có nghĩa đen là “ban/đặt”, nhưng trong ngữ cảnh giao ước, “lập” truyền đạt tự nhiên hành động thiết lập dấu hiệu giao ước mà không làm thay đổi nội dung.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: giữa Ta với các ngươi và với
  rationale: Giữ đủ các bên trong quan hệ giao ước, đồng thời dùng cấu trúc tiếng Việt tự nhiên.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: mọi sinh vật
  rationale: Cụm từ bao gồm các loài vật sống trong ngữ cảnh này; “sinh vật” tránh gán cho נֶפֶשׁ nghĩa thần học hẹp là “linh hồn”.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: đang ở cùng các ngươi
  rationale: Diễn đạt rõ mệnh đề quan hệ chỉ những sinh vật hiện ở cùng Nô-ê và gia đình ông.
- source_word: לְדֹרֹת עוֹלָם
  choice: cho các thế hệ mãi về sau
  rationale: Giữ cả ý nối tiếp qua nhiều thế hệ và tính lâu dài của עוֹלָם bằng cách nói hiện đại, tự nhiên.
theological_decisions:
- issue: Cách dịch נֹתֵן trong ngữ cảnh giao ước
  choice: mà Ta lập
  alternative: mà Ta ban / mà Ta đặt
  rationale: “Lập” là kết hợp từ tự nhiên với “giao ước” trong tiếng Việt. Cách dịch này diễn đạt việc Đức Chúa Trời thiết lập dấu hiệu giao ước, không thêm một khẳng định giáo lý ngoài nguyên văn.
- issue: Phạm vi của נֶפֶשׁ חַיָּה
  choice: mọi sinh vật
  alternative: mọi sinh linh / mọi vật sống
  rationale: Trong mạch văn về Nô-ê, cụm từ bao gồm các loài vật. “Mọi sinh vật” giữ phạm vi rộng và không nhập vào văn bản một quan niệm riêng về bản chất linh hồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta—các ngươi” để phản ánh một Đấng phán với một nhóm người; giữ dấu hai chấm cuối câu vì lời giải thích về dấu hiệu tiếp tục ở câu sau.
