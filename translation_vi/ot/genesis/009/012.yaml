- from: 'Đức Chúa Trời phán: “Đây là dấu hiệu của giao ước mà Ta lập giữa Ta với các ngươi và với mọi sinh vật đang ở cùng các ngươi, cho các thế hệ mãi về sau:”'
  to: 'Đức Chúa Trời phán: “Đây là dấu hiệu của giao ước mà Ta lập giữa Ta với các ngươi và với mọi sinh vật ở cùng các ngươi, cho các thế hệ mãi về sau:”'
