source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: vi
  text: 'và với mọi sinh vật sống ở với các ngươi: chim chóc, gia súc và mọi thú hoang trên đất ở với các ngươi, từ tất cả những con vật đã ra khỏi con tàu, cho mọi thú hoang trên đất.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm cuối trong tiếng Hê-bơ-rơ khó hiểu. Dịch sát: “từ tất cả những con vật đã ra khỏi con tàu, cho mọi thú hoang trên đất.” Cũng có thể hiểu là một cụm nhắc lại hoặc nhấn mạnh “mọi thú hoang trên đất.”'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: sinh vật sống
  rationale: Cụm này chỉ rộng mọi hữu thể có sự sống, trong văn cảnh này đặc biệt là động vật; “sinh vật sống” tự nhiên và không gợi nghĩa linh hồn theo cách quá hẹp.
- source_word: בָּעוֹף
  choice: chim chóc
  rationale: עוֹף có thể bao gồm các loài bay nói chung, nhưng trong danh sách này “chim chóc” là cách nói tiếng Việt tự nhiên và phù hợp.
- source_word: בַּבְּהֵמָה
  choice: gia súc
  rationale: בְּהֵמָה ở đây đối lập với thú hoang và chỉ nhóm động vật thuần dưỡng; “gia súc” giữ rõ sự phân loại ấy.
- source_word: חַיַּת הָאָרֶץ
  choice: thú hoang trên đất
  rationale: Cụm này chỉ động vật hoang dã sống trên cạn, phân biệt với chim chóc và gia súc; “thú hoang” rõ hơn từ chung “thú vật”.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: tức mọi loài đã ra khỏi con tàu
  rationale: מִן có thể mang lực phân định/giải thích ở đây. “Tức” diễn đạt tự nhiên rằng các sinh vật đang được nói đến là những loài ra khỏi tàu.
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: cho đến mọi thú hoang trên đất
  rationale: Giữ dấu vết của giới từ לְ và sắc thái mở rộng phạm vi, đồng thời tránh biến cụm kết khó hiểu thành một mệnh đề mục đích chắc chắn.
theological_decisions:
- issue: Phạm vi các loài vật dự phần trong giao ước và cú pháp của cụm kết
  choice: Bao gồm mọi sinh vật ở với Nô-ê—chim chóc, gia súc và thú hoang—và giữ cụm kết như một sự mở rộng/nhấn mạnh phạm vi.
  alternative: 'Có thể hiểu cụm cuối theo lối lặp lại đồng vị: “tức là mọi thú hoang trên đất”, hoặc dịch hình thức hơn: “cho mọi thú hoang trên đất”.'
  rationale: Cú pháp Hê-bơ-rơ cô đọng và lặp lại. Bản dịch không thu hẹp phạm vi giao ước, cũng không quyết đoán biến לְ thành quan hệ mục đích; chú thích bảo tồn sự khó hiểu thật sự của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phù hợp lời phán trực tiếp số nhiều trong ngữ cảnh; “con tàu” diễn đạt תֵּבָה tự nhiên, không đồng nhất nó với tàu thuyền thông thường. Dấu gạch ngang làm rõ phần giải thích nhưng không xóa sự căng thẳng cú pháp ở cụm cuối.
