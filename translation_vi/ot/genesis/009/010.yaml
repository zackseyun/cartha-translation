revisions:
- from: 'và với mọi sinh vật sống ở cùng các ngươi: chim chóc, gia súc và mọi thú hoang trên đất ở cùng các ngươi—tức mọi loài đã ra khỏi con tàu, cho đến mọi thú hoang trên đất.[a]'
  to: 'và với mọi sinh vật sống ở với các ngươi: chim chóc, gia súc và mọi thú hoang trên đất ở với các ngươi, từ tất cả những con vật đã ra khỏi con tàu, cho mọi thú hoang trên đất.[a]'
  rationale: Sửa “ở cùng” thành “ở với” cho tự nhiên. Thay “tức” và “cho đến” bằng cách dịch gần cấu trúc “từ ... cho ...” của nguyên văn, vì chức năng chính xác của các giới từ trong cụm kết không chắc chắn. Chú thích nêu rõ tính khó của cú pháp và cách hiểu nhắc lại/nhấn mạnh mà không áp đặt nó lên thân văn.
