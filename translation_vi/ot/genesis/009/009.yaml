  source_fidelity: 'Bản nháp chuyển tải đúng các thành tố chính: sắc thái nhấn mạnh của וַאֲנִי הִנְנִי, động từ thiết lập, “giao ước,” và dòng dõi tiếp theo. Tuy nhiên, “các con” thêm một quan hệ con cái không được thể hiện trong nguyên văn; đại từ số nhiều Hê-bơ-rơ chỉ những người được Đức Chúa Trời phán cùng. “Sau này” cũng làm mờ tương quan trực tiếp “sau các ngươi.”'
