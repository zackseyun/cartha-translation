  terminology: “Giao ước” và “dòng dõi” là các lựa chọn phù hợp, nhất quán và tự nhiên. Nên dùng “các ngươi” ở đây như một đại từ số nhiều trang trọng, trung tính trong văn cảnh Kinh Thánh; tự nó không hàm ý miệt thị.
