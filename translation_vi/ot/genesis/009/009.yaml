  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: vi
  text: “Về phần Ta, này, Ta thiết lập giao ước của Ta với các ngươi và với dòng dõi[a] của các ngươi sau các ngươi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hạt giống.” Từ Hê-bơ-rơ này là một danh từ tập hợp, có thể chỉ con cháu hoặc dòng dõi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Còn Ta
  rationale: Liên từ đi với đại từ độc lập tạo sắc thái nhấn mạnh và chuyển trọng tâm sang lời Đức Chúa Trời; “Còn Ta” thể hiện tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: הִנְנִי
  choice: này, Ta
  rationale: Hình thức này kêu gọi chú ý và tăng tính long trọng. “Này, Ta” giữ được sức nhấn mà không diễn giải thành lời tự giới thiệu như “Ta đây”.
- source_word: מֵקִים
  choice: thiết lập
  rationale: Phân từ Hiphil của קום ở đây diễn tả hành động làm cho giao ước được lập nên. “Thiết lập” trang trọng, tự nhiên và không hàm ý đây chỉ là việc xác nhận lại một giao ước đã có.
- source_word: בְּרִיתִי
  choice: giao ước của Ta
  rationale: “Giao ước” là cách dịch chuẩn và phù hợp cho בְּרִית trong quan hệ giữa Đức Chúa Trời với con người; cấu trúc “của Ta” diễn đạt rõ hậu tố sở hữu.
- source_word: אִתְּכֶם
  choice: với các con
  rationale: Giới từ chỉ những người cùng tham dự giao ước, còn hậu tố ngôi thứ hai số nhiều hướng đến Nô-ê và những người đi với ông. “Các con” phù hợp với lời Đức Chúa Trời trực tiếp phán với họ.
- source_word: וְאֶת זַרְעֲכֶם
  choice: và với dòng dõi các con
  rationale: זֶרַע là danh từ tập hợp có nghĩa đen là “hạt giống” và có thể chỉ con cháu hay dòng dõi. “Dòng dõi” tự nhiên trong tiếng Việt và vẫn giữ ý nghĩa tập hợp; “với” được lặp lại để câu rõ ràng.
- source_word: אַחֲרֵיכֶם
  choice: sau này
  rationale: Trong ngữ cảnh nói về dòng dõi, cụm từ chỉ các thế hệ đến sau những người đang nghe. “Sau này” diễn đạt gọn và tự nhiên mối quan hệ thời gian ấy.
theological_decisions:
- issue: Thuật ngữ chỉ בְּרִית trong quan hệ giữa Đức Chúa Trời và con người
  choice: giao ước của Ta
  alternative: cam kết của Ta; hiệp ước của Ta
  rationale: “Giao ước” bảo tồn phạm trù Kinh Thánh của בְּרִית mà không thu hẹp nó thành một hiệp ước chính trị hay diễn giải thêm nội dung thần học.
- issue: Cách xưng hô của Đức Chúa Trời với nhóm người nghe
  choice: Ta / các con
  alternative: Ta / các ngươi
  rationale: “Ta / các con” giữ quan hệ ngôi xưng rõ ràng, trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại; “các ngươi” có thể tạo sắc thái xa cách hoặc miệt thị không có trong bản Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Còn Ta, này, Ta…” cố ý giữ hai lớp nhấn mạnh của וַאֲנִי הִנְנִי. Dấu chú thích [a] được đặt ngay sau “dòng dõi,” đúng với từ Hê-bơ-rơ cần giải thích.
