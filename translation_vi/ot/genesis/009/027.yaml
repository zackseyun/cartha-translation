revisions:
- from: Nguyện Đức Chúa Trời mở rộng cho Gia-phết; nguyện người ở trong các lều của Sem[a], và nguyện Ca-na-an làm nô lệ cho họ.
  to: Nguyện Đức Chúa Trời làm cho Gia-phết được mở rộng; nguyện ở trong các lều của Sem, và nguyện Ca-na-an làm nô lệ cho họ.
  rationale: Sửa mệnh đề đầu để tiếng Việt diễn đạt đầy đủ ý Đức Chúa Trời ban sự mở rộng cho Gia-phết. Lược chủ ngữ của mệnh đề «ở» để không giải quyết thay nguyên ngữ về việc chủ thể là Đức Chúa Trời hay Gia-phết; chú thích được điều chỉnh cho khớp với cách bảo toàn mơ hồ này. Các phần còn lại đã sát nghĩa và tự nhiên.
  reviewer_model: gpt-5.6-terra
