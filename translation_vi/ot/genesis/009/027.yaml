  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: vi
  text: Nguyện Đức Chúa Trời làm cho Gia-phết được mở rộng; nguyện ở trong các lều của Sem, và nguyện Ca-na-an làm nô lệ cho họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַפְתְּ
  choice: mở rộng
  rationale: Động từ cầu khiến diễn tả việc làm cho rộng rãi và tạo lối chơi chữ với tên Gia-phết; “mở rộng” giữ sát nghĩa dù không thể tái hiện trọn vẹn âm vang trong tiếng Việt.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Dù hình thức danh từ là số nhiều, động từ và ngữ cảnh chỉ về Đức Chúa Trời duy nhất; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: לְיֶפֶת
  choice: cho Gia-phết
  rationale: Giữ giới từ theo nghĩa Đức Chúa Trời làm cho không gian trở nên rộng rãi vì lợi ích của Gia-phết, đồng thời phiên âm tên riêng theo cách quen dùng.
- source_word: וְיִשְׁכֹּן
  choice: nguyện người ở
  rationale: Thể cầu khiến được chuyển bằng “nguyện”; đại từ “người” không xác định rõ là Đức Chúa Trời hay Gia-phết, nhờ đó giữ sự mơ hồ thật có trong tiếng Hê-bơ-rơ.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: trong các lều của Sem
  rationale: Giữ hình ảnh cụ thể “các lều” và quan hệ sở hữu của Sem thay vì khái quát hóa thành nơi cư ngụ.
- source_word: וִיהִי
  choice: và nguyện ... làm
  rationale: Tiếp tục sắc thái cầu khiến của lời tuyên bố; cấu trúc “nguyện ... làm” tự nhiên trong tiếng Việt.
- source_word: כְנַעַן
  choice: Ca-na-an
  rationale: Giữ tên riêng theo lối phiên âm quen thuộc, ở đây chỉ nhân vật hoặc dòng dõi nằm dưới lời tuyên bố của Nô-ê.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Ngữ cảnh nhấn mạnh địa vị bị khuất phục, nên “nô lệ” chính xác hơn từ nhẹ nghĩa “đầy tớ”.
- source_word: לָמוֹ
  choice: cho họ
  rationale: Hình thức đại từ được hiểu theo số nhiều, tự nhiên quy về Sem và Gia-phết trong mạch văn.
theological_decisions:
- issue: Chủ thể của mệnh đề “nguyện ... ở trong các lều của Sem”
  choice: Giữ đại từ không xác định rõ “người” trong chính văn.
  alternative: Hiểu là “nguyện Đức Chúa Trời ở trong các lều của Sem” hoặc “nguyện Gia-phết ở trong các lều của Sem”.
  rationale: Động từ Hê-bơ-rơ ở ngôi giống đực số ít nhưng chủ thể không được nêu; cả Đức Chúa Trời lẫn Gia-phết đều có thể là chủ thể theo cú pháp và ngữ cảnh. Bản dịch không nên tự ý giải quyết sự mơ hồ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nguyện” để thể hiện chuỗi động từ cầu khiến; giữ hình ảnh “các lều” và thuật ngữ mạnh “nô lệ”. Đại từ “người” được dùng có chủ ý để bảo toàn sự mơ hồ của nguyên ngữ.
