base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: vi
  text: 'Bấy giờ, Đức Chúa Trời phán với Nô-ê và các con trai đang ở cùng ông rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Động từ có waw liên tiếp đẩy mạch kể tiến tới. “Bấy giờ” diễn đạt tự nhiên trình tự sự kiện; “phán” là cách nói trang trọng, thông dụng khi Đức Chúa Trời nói.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, danh từ chỉ Đức Chúa Trời, Đấng đang phán với Nô-ê; đây là cách dịch chuẩn, trang trọng trong tiếng Việt.
- source_word: אֶל נֹחַ
  choice: với Nô-ê
  rationale: Sau động từ “phán”, tiếng Việt tự nhiên dùng “phán với” để chỉ người được nói với.
- source_word: וְאֶל בָּנָיו
  choice: và các con trai
  rationale: Cụm từ phối hợp nhóm người nghe thứ hai; בָּנִים ở đây chỉ cụ thể các con trai của Nô-ê, nên không dịch chung là “các con”.
- source_word: אִתּוֹ
  choice: đang ở cùng ông
  rationale: Diễn đạt rõ các con trai hiện diện cùng Nô-ê. “Ông” có sở chỉ trực tiếp là Nô-ê.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Phân từ nguyên mẫu này giới thiệu lời trực tiếp theo sau. Trong tiếng Việt, “rằng:” tự nhiên hơn “mà rằng” hay lặp lại “phán”, đồng thời vẫn giữ chức năng dẫn nhập.
