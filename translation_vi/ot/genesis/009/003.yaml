source:
  edition: WLC
  text: כָּל רֶ֨מֶשׂ֙ אֲשֶׁ֣ר הוּא חַ֔י לָ/כֶ֥ם יִהְיֶ֖ה לְ/אָכְלָ֑ה כְּ/יֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָ/כֶ֖ם אֶת כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: vi
  text: Mọi sinh vật chuyển động[a] đang sống sẽ là thức ăn cho các con. Như Ta đã ban cây cỏ xanh cho các con, Ta đã ban cho các con mọi thứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi sinh vật bò, trườn hoặc lúc nhúc đang sống.” Danh từ Hê-bơ-rơ רֶמֶשׂ thường chỉ các sinh vật bò, trườn hoặc di chuyển lúc nhúc, nhưng trong văn cảnh này có lẽ được dùng với nghĩa rộng hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: Mọi sinh vật chuyển động
  rationale: כָּל dùng theo nghĩa phân phối với danh từ số ít mang tính tập hợp. רֶמֶשׂ thường chỉ sinh vật bò, trườn hoặc lúc nhúc, nhưng trong văn cảnh này phạm vi có vẻ rộng; cách dịch này vừa tự nhiên trong tiếng Việt vừa không thu hẹp quá mức.
- source_word: אֲשֶׁר הוּא חַי
  choice: và đang sống
  rationale: Diễn đạt rõ đặc tính sống của sinh vật được nói đến, đồng thời giữ sắc thái của חַי và phân biệt với xác chết.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: đều sẽ là thức ăn cho các con
  rationale: Giữ cấu trúc vị ngữ và ý nghĩa về sự cho phép, cung cấp làm thức ăn; “các con” phù hợp với lời Đức Chúa Trời phán cùng Nô-ê và các con trai ông.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: Như Ta đã ban cây cỏ xanh cho các con
  rationale: יֶרֶק עֵשֶׂב chỉ chung cây cỏ xanh dùng làm thức ăn. Việc lặp lại động từ “ban” trong tiếng Việt làm rõ phép so sánh vốn được diễn đạt cô đọng trong tiếng Hê-bơ-rơ.
- source_word: נָתַתִּי לָכֶם אֶת כֹּל
  choice: Ta ban cho các con mọi vật
  rationale: Thể hoàn thành của נָתַתִּי diễn tả một sự ban cho có hiệu lực trong lời tuyên bố hiện tại; tiếng Việt không cần đánh dấu thì bằng một trợ từ riêng. “Mọi vật” giữ sức khái quát của אֶת כֹּל.
theological_decisions:
- issue: Phạm vi của quyền dùng sinh vật làm thức ăn sau trận lụt
  choice: Câu chính diễn đạt một sự ban cho rộng, bao gồm mọi sinh vật đang sống, mà không giới hạn vào riêng các loài bò hoặc lúc nhúc.
  alternative: Hiểu רֶמֶשׂ theo nghĩa hẹp, chỉ các sinh vật bò, trườn hoặc lúc nhúc.
  rationale: Dù רֶמֶשׂ thường có nghĩa hẹp hơn trong những văn cảnh khác, כָּל và cụm kết “mọi vật” củng cố cách hiểu bao quát ở đây. Chú thích vẫn giữ lại nghĩa từ vựng hẹp như một khả năng chân thực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—các con” thể hiện lời Đức Chúa Trời phán với Nô-ê và các con trai ông mà không mang sắc thái cổ quá mức. Cấu trúc câu giữ sự lặp lại có chủ ý để phép so sánh giữa cây cỏ và sinh vật làm thức ăn được rõ ràng.
