review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng trình tự hành động và ý hai người con cố ý tránh nhìn thấy cha. Tuy nhiên, cụm lặp lại עֶרְוַת אֲבִיהֶם nên được dịch nhất quán là “sự trần truồng của cha họ”, sát với danh từ trừu tượng trong tiếng Hê-bơ-rơ và tránh chuyển thành cách mô tả thân thể quá cụ thể.
  naturalness: “Đặt lên vai của cả hai” hơi gượng và có thể gây lúng túng trong tiếng Việt. “Đặt chiếc áo lên vai cả hai người” tự nhiên hơn trong văn kể chuyện. “Cha họ” cũng rõ và tự nhiên hơn “cha mình” khi chủ ngữ là số nhiều.
  terminology: “Sự trần truồng” giữ được từ ngữ trang trọng, tính lặp có chủ ý, và không áp đặt cách hiểu tình dục. “Áo choàng” là một lựa chọn có thể chấp nhận được cho שִׂמְלָה; chú thích nêu phương án “áo ngoài” thích hợp.
  issues:
