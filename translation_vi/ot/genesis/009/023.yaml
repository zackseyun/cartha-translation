  to: Sem và Gia-phết lấy chiếc áo choàng[a], đặt chiếc áo lên vai cả hai người, rồi đi lùi và che sự trần truồng của cha họ. Mặt họ hướng về phía sau, nên họ không nhìn thấy sự trần truồng của cha họ.
