id: GEN.9.23
reference: Genesis 9:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: vi
  text: Sem và Gia-phết lấy chiếc áo choàng[a], đặt chiếc áo lên vai cả hai người, rồi đi lùi và che sự trần truồng của cha họ. Mặt họ hướng về phía sau, nên họ không nhìn thấy sự trần truồng của cha họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chiếc áo ngoài.” Từ Hê-bơ-rơ chỉ một loại áo mặc bên ngoài, được dùng ở đây để che cho Nô-ê.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Động từ לקח trong mạch kể diễn tả hành động lấy vật; “lấy” tự nhiên và không thêm sắc thái.
- source_word: שֵׁם וָיֶפֶת
  choice: Sem và Gia-phết
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: הַשִּׂמְלָה
  choice: chiếc áo choàng
  rationale: שׂמלה chỉ một loại áo ngoài; “áo choàng” vừa cụ thể, tự nhiên, vừa phù hợp với công dụng che phủ trong ngữ cảnh.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: đặt lên vai của cả hai
  rationale: Bám sát cấu trúc Hê-bơ-rơ “đặt trên vai của cả hai người,” đồng thời cho thấy họ cùng mang chiếc áo.
- source_word: אֲחֹרַנִּית
  choice: giật lùi / quay về phía sau
  rationale: Ở hành động di chuyển, “đi giật lùi” là cách nói tự nhiên; ở tư thế khuôn mặt, “quay về phía sau” rõ nghĩa hơn. Cả hai đều giữ ý hướng về phía sau của từ Hê-bơ-rơ.
- source_word: וַיְכַסּוּ
  choice: che
  rationale: Diễn đạt trực tiếp hành động dùng áo phủ lên cơ thể người cha.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: thân thể trần truồng của cha mình
  rationale: עֶרְוָה ở đây chỉ tình trạng thân thể bị phơi bày. Cách dịch này rõ ràng, trang trọng và giữ sắc thái hổ thẹn, không áp đặt một nghĩa tình dục chuyên biệt.
- source_word: לֹא רָאוּ
  choice: không nhìn thấy
  rationale: Diễn đạt nghĩa trực tiếp của ראה trong câu phủ định và phù hợp với việc hai người chủ ý quay mặt đi.
theological_decisions:
- issue: Ý nghĩa của cụm “sự trần truồng của cha họ”
  choice: Tình trạng thân thể Nô-ê bị phơi bày, được Sem và Gia-phết kính cẩn che lại
  alternative: Một cách nói giảm mang nghĩa tình dục, tương tự một số cách dùng trong Lê-vi Ký
  rationale: Hành động cụ thể trong câu—lấy áo, đi giật lùi, che cha và tránh nhìn—ủng hộ nghĩa trực tiếp về thân thể bị phơi bày. Bản dịch không đưa một cách giải thích tình dục chuyên biệt vào câu, nhưng cũng không diễn giải vượt quá chứng cứ của văn cảnh.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Giữ sự lặp lại của ý “thân thể trần truồng của cha mình” để phản ánh cấu trúc nhấn mạnh trong nguyên bản; dùng “đi giật lùi” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
