id: GEN.9.13
reference: Genesis 9:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: vi
  text: Ta đã đặt cây cung của Ta trong đám mây[a], và nó sẽ là dấu hiệu của giao ước giữa Ta với đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “cầu vồng của Ta”. Tiếng Hê-bơ-rơ nói sát nghĩa là “cây cung của Ta”, dùng từ thông thường chỉ cây cung; trong ngữ cảnh này, từ ấy chỉ cầu vồng trong đám mây.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: cây cung của Ta
  rationale: קֶשֶׁת là từ thông thường chỉ cây cung; trong ngữ cảnh đám mây, nó nói đến cầu vồng. Giữ hình ảnh nguyên ngữ trong câu chính và nêu nghĩa theo ngữ cảnh ở chú thích.
- source_word: נָתַתִּי
  choice: Ta đã đặt
  rationale: נתן có thể có nghĩa là cho, để hoặc đặt; ở đây “đặt” diễn đạt tự nhiên việc đặt cây cung trong đám mây, còn “đã” thể hiện hành động hoàn tất với hiệu lực hiện tại.
- source_word: בֶּעָנָן
  choice: trong đám mây
  rationale: Danh từ ở số ít; “đám mây” là cách nói tự nhiên trong tiếng Việt và giữ số ít của nguyên ngữ.
- source_word: וְהָיְתָה
  choice: và nó sẽ là
  rationale: Trong mạch văn, động từ diễn tả chức năng mà cây cung sẽ đảm nhận từ nay về sau.
- source_word: לְאוֹת
  choice: dấu hiệu
  rationale: אוֹת chỉ một dấu hiệu hoặc vật làm chứng; “dấu hiệu” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּרִית
  choice: giao ước
  rationale: Ngữ cảnh ngay trước đó xác định đây là giao ước Đức Chúa Trời đã lập; tiếng Việt không cần mạo từ để biểu thị tính xác định.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: giữa Ta với đất
  rationale: אֶרֶץ ở đây mang phạm vi toàn thể trong trình thuật lũ lụt; “đất” giữ cách diễn đạt cụ thể của nguyên ngữ và chỉ toàn cõi đất.
theological_decisions:
- issue: Đối tượng được chỉ bởi קַשְׁתִּי trong bối cảnh giao ước
  choice: Giữ nghĩa đen “cây cung của Ta” trong câu chính, với cầu vồng là đối tượng được hiểu theo ngữ cảnh
  alternative: cầu vồng của Ta
  rationale: Nguyên ngữ dùng chính từ thông thường chỉ cây cung, có thể gợi hình ảnh vũ khí được đặt sang một bên. Không nên xóa hình ảnh ấy, nhưng chú thích cần giúp độc giả nhận ra hiện tượng được nói đến là cầu vồng.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Bản dịch ưu tiên tương đương tối ưu, giữ hình ảnh “cây cung” của nguyên ngữ và giải thích nghĩa theo ngữ cảnh bằng chú thích.
