  text: וַ/יִּֽהְיוּ֙ כָּל יְמֵי נֹ֔חַ תְּשַׁ֤ע מֵאוֹת֙ שָׁנָ֔ה וַ/חֲמִשִּׁ֖ים שָׁנָ֑ה וַ/יָּמֹֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/029.yaml
  text: So all the days of Noah were nine hundred and fifty years, and he died.
translation:
  language: vi
  text: Tổng cộng, Nô-ê sống được chín trăm năm mươi năm, rồi ông qua đời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי נֹחַ
  choice: Tổng cộng, Nô-ê sống được
  rationale: Cụm Hê-bơ-rơ là công thức tổng kết toàn bộ số năm của một đời người. Cách dịch này truyền đạt tự nhiên ý nghĩa ấy trong tiếng Việt hiện đại mà vẫn giữ sắc thái tổng kết.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: chín trăm năm mươi năm
  rationale: Tiếng Hê-bơ-rơ phối hợp hai thành phần số lượng, nghĩa đen là 'chín trăm năm và năm mươi năm'; tiếng Việt tự nhiên gộp thành một số duy nhất.
- source_word: וַיָּמֹת
  choice: rồi ông qua đời
  rationale: Động từ số ít chỉ lại Nô-ê và khép lại công thức về tuổi thọ. 'Qua đời' là cách nói trang trọng, tự nhiên; 'rồi' thể hiện diễn tiến kế tiếp của וַ־.
