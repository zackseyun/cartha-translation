base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: vi
  text: Ta sẽ nhớ giao ước của Ta giữa Ta với các ngươi và với mọi sinh vật sống thuộc mọi loài xác thịt[a]; nước sẽ không bao giờ trở thành nước lụt nữa để hủy diệt mọi loài xác thịt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi sinh vật sống, tức mọi loài xác thịt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Ta sẽ nhớ
  rationale: Động từ Qal ngôi thứ nhất số ít cùng liên từ mang ý nghĩa tương lai trong lời Đức Chúa Trời. Giữ nguyên ngôn ngữ “nhớ” của giao ước, không diễn giải thành “lưu tâm” hay “hành động theo”.
- source_word: בְּרִיתִי
  choice: giao ước của Ta
  rationale: “Giao ước” là cách dịch chuẩn, bảo toàn sắc thái quan hệ chính thức và lời hứa của בְּרִית.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: mọi sinh vật sống thuộc mọi loài xác thịt
  rationale: נֶפֶשׁ חַיָּה chỉ sinh vật có sự sống; בְּכָל בָּשָׂר xác định phạm vi bao gồm mọi loài có thân xác. “Thuộc” tự nhiên hơn “ở giữa” trong tiếng Việt mà vẫn giữ quan hệ phân loại.
- source_word: וְלֹא יִהְיֶה עוֹד הַמַּיִם לְמַבּוּל
  choice: nước sẽ không bao giờ trở lại thành trận lụt
  rationale: Kết hợp phủ định với עוֹד diễn tả điều không tái diễn; לְמַבּוּל được hiểu theo kết quả/chức năng, tức nước trở thành trận lụt.
- source_word: לְשַׁחֵת כָּל בָּשָׂר
  choice: để hủy diệt mọi loài xác thịt
  rationale: Động từ nguyên mẫu diễn tả mục đích hoặc kết quả. “Hủy diệt” giữ được sức nặng của שׁחת; “mọi loài xác thịt” bảo toàn phạm vi rộng, gồm cả người và động vật.
theological_decisions:
- issue: Ngôn ngữ nhân hình về việc Đức Chúa Trời nhớ
  choice: Giữ nguyên “Ta sẽ nhớ”
  alternative: Ta sẽ lưu tâm đến / Ta sẽ hành động theo giao ước
  rationale: Nguyên văn dùng trực tiếp động từ “nhớ”. Giữ cách nói này bảo toàn thành ngữ giao ước và sự căng thẳng thần học, không giải thích thay cho bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” và “các ngươi” phù hợp lời phán trực tiếp trang nghiêm trong ngữ cảnh. Cụm “mọi loài xác thịt” được giữ ở cả hai vị trí để phản ánh sự lặp lại và phạm vi bao gồm người cùng động vật.
