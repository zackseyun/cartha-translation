    rationale: “Giữa mọi loài xác thịt” và “trong mọi xác thịt” không truyền đạt tự nhiên quan hệ phân loại/phạm vi của בְּכָל־בָּשָׂר. Nên nêu gọn một cách hiểu thay thế có thể dùng được mà không áp đặt một nghĩa không có trong tiếng Việt.
