  text: וַֽ/יְחִי נֹ֖חַ אַחַ֣ר הַ/מַּבּ֑וּל שְׁלֹ֤שׁ מֵאוֹת֙ שָׁנָ֔ה וַֽ/חֲמִשִּׁ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/028.yaml
  text: After the flood, Noah lived three hundred and fifty years.
translation:
  language: vi
  text: Sau trận lụt, Nô-ê sống thêm ba trăm năm mươi năm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Động từ חיה ở dạng kể chuyện nói về quãng đời Nô-ê tiếp tục sống sau trận lụt. “Sống thêm” diễn đạt tự nhiên mốc thời gian và khoảng thời gian tiếp theo, mà không nhấn mạnh ý được giải cứu như “sống sót”.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng tên riêng đã quen thuộc và phổ biến trong tiếng Việt.
- source_word: אַחַר
  choice: sau
  rationale: Giới từ chỉ thời gian tiếp sau một biến cố; “sau” là cách diễn đạt ngắn gọn, tự nhiên.
- source_word: הַמַּבּוּל
  choice: trận lụt
  rationale: Danh từ xác định chỉ trận lụt đã được thuật lại trong văn mạch. “Trận lụt” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: ba trăm năm mươi năm
  rationale: Gộp cấu trúc số đếm Hê-bơ-rơ thành cách nói số lượng năm tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng và dễ hiểu. Từ “thêm” làm rõ đây là số năm Nô-ê sống sau trận lụt, đúng với quan hệ thời gian trong nguyên văn.
