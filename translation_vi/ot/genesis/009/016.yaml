revisions:
- from: Cây cung sẽ ở trong đám mây[a], và Ta sẽ nhìn thấy nó để nhớ đến giao ước đời đời giữa Đức Chúa Trời với mọi sinh vật sống thuộc mọi loài xác thịt trên đất.
  to: Cây cung sẽ ở trong đám mây[a], và Ta sẽ nhìn thấy nó để nhớ đến giao ước đời đời giữa Đức Chúa Trời với mọi sinh vật sống, tức là mọi xác thịt trên đất.
  rationale: 'Chỉ sửa cách diễn đạt bְּכָל־בָּשָׂר thành một cụm đồng vị tự nhiên hơn: “mọi sinh vật sống, tức là mọi xác thịt trên đất.” Cách này giữ cả hai cụm lặp của nguyên văn, phạm vi phổ quát “trên đất”, và không áp đặt một quan hệ phân loại hay diễn giải thần học thêm.'
