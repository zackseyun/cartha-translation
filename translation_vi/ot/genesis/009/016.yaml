  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: vi
  text: Cây cung sẽ ở trong đám mây[a], và Ta sẽ nhìn thấy nó để nhớ đến giao ước đời đời giữa Đức Chúa Trời với mọi sinh vật sống, tức là mọi xác thịt trên đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cầu vồng”. Từ Hê-bơ-rơ có nghĩa đen là “cung”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: sẽ ở
  rationale: Dạng hoàn thành nối tiếp trong lời phán hướng về tương lai; “sẽ ở” vừa giữ ý tương lai vừa bám sát động từ “là/ở”, không thêm ý “xuất hiện”.
- source_word: הַקֶּשֶׁת
  choice: cây cung
  rationale: Danh từ Hê-bơ-rơ có nghĩa đen là “cung”; ngữ cảnh chỉ chiếc cung trên trời, tức cầu vồng. Giữ hình ảnh nguồn trong chính văn và ghi cách hiểu theo ngữ cảnh ở chú thích.
- source_word: בֶּעָנָן
  choice: trong đám mây
  rationale: Giữ số ít và mạo từ xác định của nguyên văn theo cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: וּרְאִיתִיהָ
  choice: và Ta sẽ nhìn thấy nó
  rationale: Giữ mệnh đề phối hợp và đại từ chỉ cây cung, không tự ý chuyển thành mệnh đề thời gian “khi Ta thấy”.
- source_word: לִזְכֹּר
  choice: để nhớ đến
  rationale: Động từ nguyên mẫu với לְ biểu thị mục đích hoặc kết quả; “để nhớ đến” trực tiếp, tự nhiên và bảo toàn quan hệ cú pháp.
- source_word: בְּרִית עוֹלָם
  choice: giao ước đời đời
  rationale: Diễn đạt rõ tính bền lâu xuyên qua các thời đại mà không thu hẹp ý nghĩa.
- source_word: בֵּין אֱלֹהִים וּבֵין
  choice: giữa Đức Chúa Trời với
  rationale: Chuyển thành cấu trúc “giữa… với…” tự nhiên trong tiếng Việt, đồng thời giữ hai phía của giao ước.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: mọi sinh vật sống
  rationale: Cụm từ chỉ rộng mọi sinh thể, không riêng linh hồn con người; cách dịch này phù hợp ngữ cảnh giao ước sau trận lụt.
- source_word: בְּכָל בָּשָׂר
  choice: thuộc mọi loài xác thịt
  rationale: Cụm giới từ bổ nghĩa/xác định thêm cho “mọi sinh vật sống”. “Thuộc mọi loài xác thịt” giữ thuật ngữ cụ thể của nguyên văn, dù hơi trang trọng, và tránh hiểu là các sinh vật chỉ ở giữa loài người.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: trên đất
  rationale: Giữ phạm vi phổ quát của mệnh đề quan hệ; tiếng Việt có thể lược đại từ quan hệ mà nghĩa vẫn rõ.
theological_decisions:
- issue: Cách nói nhân hình về việc Đức Chúa Trời nhớ
  choice: giữ “Ta sẽ nhìn thấy nó để nhớ đến”
  alternative: diễn giải thành “Ta sẽ nhìn thấy nó và hành động theo giao ước”
  rationale: Nguyên văn dùng ngôn ngữ giao ước về việc Đức Chúa Trời nhớ. Bản dịch giữ nguyên sức căng thần học và không giải thích thay cho văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ta” theo ngữ cảnh Đức Chúa Trời phán. Giữ “cây cung” trong chính văn để bảo toàn hình ảnh Hê-bơ-rơ, còn “cầu vồng” được nêu trong chú thích. Cụm “mọi loài xác thịt” hơi trang trọng nhưng giúp giữ nét từ vựng và phạm vi phổ quát của nguyên văn.
