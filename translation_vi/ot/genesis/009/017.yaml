base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán với Nô-ê: “Đây là dấu hiệu của giao ước mà Ta đã lập giữa Ta với mọi xác thịt[a] đang ở trên đất.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi sinh vật.” Tiếng Hê-bơ-rơ là “mọi xác thịt,” một cách diễn đạt rộng về sự sống có sinh khí trên đất trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Dạng kể chuyện tiếp nối đưa trình thuật tiến về phía trước. Trong tiếng Việt, “phán” là cách diễn đạt tự nhiên và trang trọng khi Đức Chúa Trời nói, không cần thêm liên từ một cách máy móc.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, từ này chỉ Đức Chúa Trời là Đấng đang phán với Nô-ê; đây là cách gọi chuẩn, trang trọng và quen thuộc trong tiếng Việt.
- source_word: אֶל נֹחַ
  choice: với Nô-ê
  rationale: Giới từ đánh dấu người được nói với; “Nô-ê” là dạng tên riêng quen dùng trong tiếng Việt.
- source_word: זֹאת
  choice: Đây là
  rationale: Đại từ chỉ định mở đầu một mệnh đề đồng nhất; tiếng Việt tự nhiên cần “Đây là”.
- source_word: אוֹת
  choice: dấu hiệu
  rationale: Từ này chỉ một dấu hoặc vật làm bằng chứng có thể nhận biết. “Dấu hiệu” rõ nghĩa trong ngữ cảnh dấu hiệu của giao ước.
- source_word: הַבְּרִית
  choice: giao ước
  rationale: Đây là thuật ngữ thần học trọng yếu chỉ mối cam kết ràng buộc; “giao ước” duy trì tính nhất quán trong Kinh Thánh.
- source_word: הֲקִמֹתִי
  choice: Ta đã lập
  rationale: Thể Hiphil của קום đi với בְּרִית thường có nghĩa là lập hoặc xác lập một giao ước. “Đã lập” diễn đạt hành động hoàn tất, vẫn có hiệu lực trong ngữ cảnh.
- source_word: בֵּינִי וּבֵין
  choice: giữa Ta với
  rationale: Diễn đạt quan hệ giữa hai phía của giao ước bằng cấu trúc tiếng Việt tự nhiên.
- source_word: כָּל בָּשָׂר
  choice: mọi xác thịt
  rationale: Giữ hình ảnh và phạm vi rộng của nguyên văn, vốn trong Sáng Thế Ký 9 bao gồm sự sống hữu hình trên đất chứ không chỉ loài người; chú thích cung cấp cách diễn đạt tự nhiên hơn.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: trên đất
  rationale: Cụm quan hệ bổ nghĩa cho “mọi xác thịt.” “Trên đất” tự nhiên và phù hợp với phạm vi phổ quát của giao ước trong ngữ cảnh.
theological_decisions:
- issue: Phạm vi của כָּל בָּשָׂר trong giao ước với Nô-ê
  choice: mọi xác thịt
  alternative: mọi sinh vật; toàn thể loài người
  rationale: Trong Sáng Thế Ký 9, cụm từ này có chủ ý rộng hơn loài người và bao gồm các sinh vật trên đất. Giữ “mọi xác thịt” bảo toàn cách nói của nguyên văn và tránh thu hẹp phạm vi; chú thích làm rõ nghĩa rộng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời tự xưng của Đức Chúa Trời và “phán” cho lời Ngài nói. Cấu trúc câu gọn, tự nhiên; giữ cụm “mọi xác thịt” để bảo toàn nét nghĩa và độ rộng của nguyên văn, kèm chú thích giải nghĩa.
