source:
  edition: WLC
  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: vi
  text: Nhưng các con không được ăn thịt cùng với sự sống của nó[a]—tức là máu của nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Nhưng các con không được ăn thịt cùng với sự sống của nó—máu của nó.” Nguyên văn đặt “sự sống của nó” và “máu của nó” cạnh nhau mà không có từ tương đương với “tức là”.'
    reason: Bảo lưu cấu trúc đồng vị cô đọng và mức độ hàm ẩn của nguyên văn Hê-bơ-rơ.
lexical_decisions:
- source_word: אַךְ
  choice: Nhưng
  rationale: Từ này giới hạn quyền ăn thịt vừa được ban ở câu 3. “Nhưng” diễn đạt tự nhiên sự tương phản và ngoại lệ trong tiếng Việt hiện đại.
- source_word: בָּשָׂר
  choice: thịt
  rationale: Trong ngữ cảnh nói về việc ăn, “thịt” tự nhiên hơn “xác thịt” mà vẫn diễn đạt đúng nghĩa cụ thể của từ Hê-bơ-rơ.
- source_word: בְּנַפְשׁוֹ
  choice: cùng với sự sống của nó
  rationale: נֶפֶשׁ ở đây chỉ sự sống của sinh vật, không nhất thiết mang nghĩa thần học về một linh hồn phi vật chất. “Cùng với” giữ được quan hệ liên kết do giới từ בְּ biểu thị mà không đồng nhất hai ý quá sớm.
- source_word: דָמוֹ
  choice: máu của nó
  rationale: Giữ nghĩa trực tiếp của דָם là “máu” và bảo toàn cách câu đặt “sự sống” bên cạnh “máu”.
- source_word: בְּנַפְשׁוֹ דָמוֹ
  choice: cùng với sự sống của nó—tức là máu của nó
  rationale: Cụm Hê-bơ-rơ ngắn gọn và có tính đồng vị. Dấu gạch ngang cùng “tức là” giúp người đọc tiếng Việt nhận ra quan hệ giải thích giữa “sự sống” và “máu”, nhưng chú thích vẫn lưu lại cấu trúc cô đọng hơn của nguyên văn.
- source_word: לֹא תֹאכֵלוּ
  choice: các con không được ăn
  rationale: Động từ ngôi thứ hai số nhiều với לֹא mang lực cấm đoán. “Không được ăn” là cách diễn đạt pháp lệnh tự nhiên, rõ ràng trong tiếng Việt; “các con” phản ánh lời Đức Chúa Trời nói với Nô-ê và các con trai ông trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của נֶפֶשׁ trong quan hệ với máu
  choice: Dịch là “sự sống”, không dịch là “linh hồn”
  alternative: “linh hồn” hoặc gộp cả cụm thành “máu sống”
  rationale: Ngữ cảnh nói đến sự sống của sinh vật gắn với máu. “Sự sống” phản ánh nghĩa Hê-bơ-rơ phù hợp nhất và tránh đưa vào câu một quan niệm nhân học về linh hồn mà nguyên văn không đòi hỏi.
- issue: Quan hệ cú pháp giữa “sự sống của nó” và “máu của nó”
  choice: Thể hiện như một quan hệ đồng vị giải thích bằng “—tức là”
  alternative: Giữ nguyên chuỗi cô đọng “sự sống của nó—máu của nó” hoặc hiểu là hai thành phần tách biệt
  rationale: Cách hiểu đồng vị phù hợp với cú pháp và ngữ cảnh, nhưng chú thích ghi nhận rằng nguyên văn không có từ tương đương trực tiếp với “tức là” và có thể được trình bày cô đọng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thịt” theo ngữ cảnh ăn uống, “sự sống” thay cho “linh hồn”, và “không được ăn” để diễn đạt rõ lực cấm đoán. Đại từ “các con” phù hợp với lời Đức Chúa Trời phán cùng Nô-ê và các con trai ông, tránh sắc thái cổ của “các ngươi”.
