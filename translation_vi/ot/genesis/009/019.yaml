- from: Ba người này là các con trai của Nô-ê; và từ họ, toàn thể cư dân trên đất đã phân tán ra.[a]
  to: Ba người này là các con trai của Nô-ê; từ họ, cư dân trên khắp đất đã tản ra.[a]
  rationale: Sửa bản dịch chính để diễn đạt tự nhiên việc dân cư trên toàn đất xuất phát từ các con trai Nô-ê, thay vì nói “toàn thể cư dân” như một cách giải nghĩa quá đầy đủ. Chú thích giữ cách nói sát nguyên văn và nêu rõ tính hoán dụ, đồng thời duy trì khả năng hiểu động từ là “tản ra” hoặc “lan rộng ra.”
