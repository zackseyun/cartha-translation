  edition: WLC
  text: שְׁלֹשָׁ֥ה אֵ֖לֶּה בְּנֵי נֹ֑חַ וּ/מֵ/אֵ֖לֶּה נָֽפְצָ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: vi
  text: Ba người này là các con trai của Nô-ê; từ họ, cư dân trên khắp đất đã tản ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát nguyên văn: “và từ những người này, cả đất đã tản ra” hoặc “đã lan rộng ra.” “Cả đất” là cách nói hoán dụ chỉ dân cư trên đất.'
    reason: Bảo lưu chủ ngữ hoán dụ của כָל הָאָרֶץ và nét nghĩa trực tiếp, có thể hiểu là “tản ra/lan rộng ra,” của נָפְצָה.
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: Ba người này
  rationale: Cụm danh từ được đưa lên đầu câu để nhấn mạnh. “Ba người này” tự nhiên trong tiếng Việt và giữ được trọng tâm chỉ định.
- source_word: בְּנֵי נֹחַ
  choice: là các con trai của Nô-ê
  rationale: Tiếng Hê-bơ-rơ không có động từ hữu hạn; “là” được thêm để câu tiếng Việt trôi chảy. “Các con trai của Nô-ê” chuyển tải trực tiếp kết cấu sở hữu.
- source_word: וּמֵאֵלֶּה
  choice: và từ họ
  rationale: Giới từ מִן đi với đại từ chỉ định có nghĩa “từ những người này.” Sau khi chủ thể đã được nêu rõ, “từ họ” là cách diễn đạt tự nhiên, đồng thời vẫn liên kết với ba người con trai.
- source_word: נָפְצָה
  choice: đã phân tán ra
  rationale: Động từ נפץ mang ý cốt lõi là bị phân tán hoặc tản ra. Bản dịch giữ hình ảnh ấy thay vì giải thích thành “được sinh sôi khắp nơi,” qua đó bảo toàn sắc thái và tính hàm súc của nguyên văn.
- source_word: כָל הָאָרֶץ
  choice: toàn thể cư dân trên đất
  rationale: Về mặt từ ngữ, cụm này là “toàn thể đất/địa cầu,” nhưng chính mặt đất không phải đối tượng phân tán. Đây là phép hoán dụ chỉ dân cư trên đất; cách dịch này làm rõ chủ thể hàm ẩn mà vẫn giữ phạm vi phổ quát của ngữ cảnh hậu hồng thủy.
theological_decisions:
- issue: Phạm vi của הָאָרֶץ trong bối cảnh hậu hồng thủy
  choice: toàn thể cư dân trên đất
  alternative: toàn thể cư dân trong xứ
  rationale: Câu này tóm lược sự lan rộng của nhân loại từ ba con trai Nô-ê; vì vậy, phạm vi toàn cầu phù hợp với ngữ cảnh hơn nghĩa địa phương “xứ.”
- issue: Chủ thể ngữ pháp của hành động phân tán
  choice: hiểu כָל הָאָרֶץ theo phép hoán dụ là toàn thể cư dân trên đất
  alternative: 'dịch sát hình thức: “cả đất đã phân tán ra”'
  rationale: Nguyên văn dùng “toàn thể đất” làm chủ thể, nhưng ý nghĩa tự nhiên là người trên đất lan ra. Bản dịch làm sáng phép hoán dụ mà không chuyển thành một khẳng định giáo lý chi tiết về cách thức dân số phát triển.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Nô-ê” theo cách phiên âm Kinh Thánh quen thuộc; dấu chấm phẩy giữ quan hệ chặt chẽ giữa hai vế. Chú thích bảo lưu cách diễn đạt sát nguyên văn và sự mơ hồ giữa việc dân cư “phân tán” và “lan rộng.”
