source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ בְנֵי נֹ֗חַ הַ/יֹּֽצְאִים֙ מִן הַ/תֵּבָ֔ה שֵׁ֖ם וְ/חָ֣ם וָ/יָ֑פֶת וְ/חָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: vi
  text: Các con trai của Nô-ê đã ra khỏi con tàu là Sem, Cham và Gia-phết; Cham là cha của Ca-na-an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Trong câu này, dạng động từ היה nối chủ ngữ với phần liệt kê, không hàm ý sự biến đổi trạng thái; tiếng Việt tự nhiên dùng “là”.
- source_word: בְנֵי נֹחַ
  choice: các con trai của Nô-ê
  rationale: Diễn đạt rõ quan hệ gia đình của cấu trúc sở hữu Hê-bơ-rơ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: đã ra khỏi con tàu
  rationale: Phân từ có mạo từ bổ nghĩa cho các con trai của Nô-ê; “đã ra khỏi” diễn đạt hành động rời khỏi không gian bên trong, còn “con tàu” phù hợp với vật thể được nói đến trong trình thuật lũ lụt.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: Sem, Cham và Gia-phết
  rationale: Dùng các dạng tên riêng Kinh Thánh quen thuộc, dễ nhận biết trong tiếng Việt, với liên từ tự nhiên trước tên cuối.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: Cham là cha của Ca-na-an
  rationale: Giữ nguyên mệnh đề định danh trực tiếp, làm nền cho phần trình thuật tiếp theo mà không thêm cách giải thích ngoài văn bản.
theological_decisions:
- issue: Ghi chú gia phả về Cham và Ca-na-an
  choice: Giữ mệnh đề “Cham là cha của Ca-na-an” trong chính văn như một thông tin định danh có chủ ý.
  alternative: Hạ nhẹ hoặc xem mệnh đề này chỉ là chi tiết phụ.
  rationale: Nguyên văn nêu rõ quan hệ giữa Cham và Ca-na-an để chuẩn bị cho diễn biến kế tiếp; bản dịch giữ điểm nhấn ấy nhưng không đưa vào các kết luận thần học hay sắc tộc vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu bám sát quan hệ cú pháp của nguyên văn nhưng tránh lối diễn đạt gượng; không cần chú thích vì câu không có dị bản hay nét mơ hồ đáng kể cần trình bày.
