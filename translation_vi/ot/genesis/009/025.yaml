base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: vi
  text: 'Ông nói: “Ca-na-an[a] bị nguyền rủa; người ấy sẽ làm nô lệ thấp hèn nhất cho anh em mình.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chính văn ghi rõ “Ca-na-an”, không phải Cham.
    reason: textual_clarification
  - marker: b
    text: Theo sát chữ, cụm Hê-bơ-rơ là “nô lệ của các nô lệ”, một lối nói tăng cường, diễn tả tình trạng nô lệ cùng cực.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ông nói
  rationale: Dạng kể chuyện wayyiqtol của אָמַר tiếp nối mạch thuật sự và mở đầu lời nói trực tiếp; tiếng Việt không cần thêm liên từ một cách máy móc.
- source_word: אָרוּר
  choice: bị nguyền rủa
  rationale: Tính từ vị ngữ diễn tả tình trạng chịu lời nguyền. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ lực tuyên cáo của mệnh đề không có động từ trong tiếng Hê-bơ-rơ.
- source_word: כְּנָעַן
  choice: Ca-na-an
  rationale: Phiên âm tên riêng theo cách quen dùng trong tiếng Việt; chính văn nêu đích danh Ca-na-an.
- source_word: עֶבֶד עֲבָדִים
  choice: nô lệ của các nô lệ
  rationale: Giữ phép lặp và cấu trúc nhấn mạnh của nguyên văn. Trong ngữ cảnh lời nguyền, “nô lệ” truyền đạt rõ tình trạng lệ thuộc khắc nghiệt hơn “đầy tớ”; chú thích giải thích sắc thái cực cấp của thành ngữ.
- source_word: יִהְיֶה
  choice: sẽ làm
  rationale: Thể chưa hoàn thành của הָיָה chỉ kết quả tương lai trong lời tuyên án. Trong tiếng Việt, “sẽ làm nô lệ” tự nhiên hơn cách ghép sát chữ “sẽ là một nô lệ”.
- source_word: לְאֶחָיו
  choice: cho anh em mình
  rationale: Dịch sát danh từ số nhiều giống đực kèm hậu tố ngôi ba số ít; “anh em” cũng có thể mang nghĩa quan hệ thân tộc hoặc bộ tộc như trong nguyên văn.
theological_decisions:
- issue: Đối tượng của lời nguyền
  choice: Ca-na-an là người bị nguyền rủa, đúng theo chính văn.
  alternative: Hiểu lời nguyền trực tiếp nhằm vào Cham.
  rationale: Bản Hê-bơ-rơ nêu rõ Ca-na-an, không phải Cham; bản dịch không chuyển đối tượng theo một truyền thống giải thích bên ngoài câu.
- issue: Cách diễn đạt tình trạng nô lệ
  choice: Giữ “nô lệ của các nô lệ” trong chính văn và giải thích sắc thái tăng cường ở chú thích.
  alternative: Dịch diễn ý là “kẻ nô lệ thấp hèn nhất” hoặc làm nhẹ thành “đầy tớ của các đầy tớ”.
  rationale: Lựa chọn này giữ cả mức độ nghiêm trọng của sự lệ thuộc lẫn phép lặp giàu sức nhấn của tiếng Hê-bơ-rơ, nhưng không biến một thành ngữ nhấn mạnh thành một hệ thống cấp bậc được xác định quá cụ thể.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Ông” để tiếp nối chủ thể Nô-ê từ ngữ cảnh, “Ca-na-an” theo lối phiên âm tiếng Việt, và giữ thành ngữ Hê-bơ-rơ trong chính văn thay vì diễn giải hoàn toàn.
