source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: vi
  text: 'Ta sẽ lập giao ước của Ta với các ngươi: mọi sinh vật[a] sẽ không bao giờ còn bị diệt trừ[b] bởi nước của trận đại hồng thủy, và sẽ không bao giờ còn có trận đại hồng thủy để hủy diệt trái đất nữa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa sát chữ: “mọi xác thịt”; cụm này chỉ chung các sinh vật sống, không chỉ riêng loài người.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bị hủy diệt”; động từ Hê-bơ-rơ có nghĩa đen là “bị cắt khỏi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Ta sẽ lập
  rationale: Thể Hifil của קום trong công thức giao ước mang nghĩa thiết lập hoặc xác lập. Cách dịch ở thì tương lai phù hợp với lời hứa trong ngữ cảnh, còn “lập” giữ được sắc thái trang trọng mà không quyết định quá mức giao ước này hoàn toàn mới hay được xác nhận.
- source_word: בְּרִיתִי
  choice: giao ước của ta
  rationale: “Giao ước” là thuật ngữ tiếng Việt trang trọng, quen thuộc và nhất quán cho בְּרִית trong Sáng Thế Ký.
- source_word: אִתְּכֶם
  choice: với các ngươi
  rationale: Đại từ Hê-bơ-rơ ở số nhiều. “Các ngươi” diễn đạt rõ đối tượng tập thể và phù hợp với lời phán trực tiếp trang trọng.
- source_word: יִכָּרֵת
  choice: bị diệt trừ
  rationale: Thể Niphal của כרת có nghĩa đen là “bị cắt khỏi”, nhưng trong ngữ cảnh phán xét bằng lụt, “bị diệt trừ” vừa tự nhiên trong tiếng Việt vừa giữ được hình ảnh loại bỏ gần với nguyên ngữ.
- source_word: כָּל־בָּשָׂר
  choice: mọi loài có xác thịt
  rationale: Cụm này bao gồm rộng rãi các sinh vật sống, chứ không chỉ loài người. Cách dịch giữ yếu tố “xác thịt” của nguyên ngữ và dùng “mọi loài” để làm rõ phạm vi.
- source_word: עוֹד
  choice: không bao giờ còn ... nữa
  rationale: Khi đi với phủ định trong lời hứa này, עוֹד có nghĩa tự nhiên là “không bao giờ còn ... nữa”; cách diễn đạt cũng phản ánh sự lặp lại nhấn mạnh trong câu.
- source_word: מִמֵּי הַמַּבּוּל
  choice: bởi nước đại hồng thủy
  rationale: Giới từ מן ở đây chỉ tác nhân hoặc nguồn gây hủy diệt. “Bởi nước đại hồng thủy” thể hiện rõ quan hệ ấy.
- source_word: מַבּוּל
  choice: đại hồng thủy
  rationale: Đây là cách gọi quen thuộc, trang trọng cho trận lụt đặc thù trong trình thuật Nô-ê và phân biệt nó với một trận lụt thông thường.
- source_word: לְשַׁחֵת
  choice: để hủy diệt
  rationale: שׁחת trong ngữ cảnh này chỉ sự phá hủy do phán xét; “hủy diệt” truyền đạt trực tiếp cường độ của động từ.
- source_word: הָאָרֶץ
  choice: đất
  rationale: הָאָרֶץ có thể chỉ đất, xứ hoặc trái đất. “Đất” giữ được độ rộng từ vựng của nguyên ngữ và trong bối cảnh đại hồng thủy vẫn tự nhiên chỉ toàn cõi đất.
theological_decisions:
- issue: Phạm vi của כָּל־בָּשָׂר trong lời hứa giao ước
  choice: Dịch là “mọi loài có xác thịt”, bao gồm rộng rãi con người và các sinh vật.
  alternative: “toàn thể loài người” hoặc “mọi sinh vật”
  rationale: Bối cảnh sau đại hồng thủy nói đến cả con người lẫn động vật. Cách dịch này không thu hẹp lời hứa vào nhân loại, đồng thời giữ hình ảnh “xác thịt” của tiếng Hê-bơ-rơ.
- issue: Sắc thái của קום trong công thức giao ước
  choice: Dịch là “lập giao ước”.
  alternative: “xác nhận giao ước” hoặc “duy trì giao ước”
  rationale: “Lập” giữ sắc thái giao ước trang trọng nhưng không áp đặt một kết luận thần học quá cụ thể về việc giao ước được khởi lập mới hoàn toàn hay được chính thức xác nhận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/các ngươi” phù hợp với lời Đức Chúa Trời phán cho một nhóm người. Giữ hai lần diễn đạt “không bao giờ còn” để phản ánh cấu trúc nhấn mạnh của nguyên ngữ.
