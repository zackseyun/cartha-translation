  rationale: Chỉ thay “các con” bằng “các ngươi” để bản dịch bao quát đúng nhóm người được trực tiếp nói đến và giữ sắc thái nhấn mạnh của וְאַתֶּם. Chú thích được chỉnh nhẹ để diễn đạt hình ảnh từ vựng của שׁרץ mà không gọi trực tiếp con người là “sinh vật” hay nhấn quá mức hình ảnh bầy đàn.
