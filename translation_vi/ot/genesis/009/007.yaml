  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: vi
  text: Còn các ngươi, hãy sinh sôi nảy nở; hãy sinh sôi thật nhiều trên đất[a] và gia tăng trên đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy sinh sôi đầy dẫy trên đất.” Động từ Hê-bơ-rơ gợi sự sinh sôi dồi dào, đông đúc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Còn các con
  rationale: Liên từ cùng đại từ độc lập tạo sắc thái nhấn mạnh và chuyển trở lại đối tượng được nói đến. “Còn” thể hiện sự đối chiếu ấy; “các con” là cách xưng hô số nhiều tự nhiên, trang trọng vừa phải trong lời Đức Chúa Trời phán với Nô-ê và các con trai ông.
- source_word: פְּרוּ וּרְבוּ
  choice: hãy sinh sôi nảy nở
  rationale: Thành ngữ Việt tự nhiên diễn đạt việc sinh sản và tăng thêm đông đúc, đồng thời giữ âm hưởng của mệnh lệnh chúc phước trong trình thuật sáng tạo.
- source_word: שִׁרְצוּ
  choice: hãy sinh sôi thật nhiều
  rationale: Động từ Hê-bơ-rơ gợi sự sinh sôi dồi dào như bầy đàn lúc nhúc. Bản dịch chính truyền đạt mức độ gia tăng mạnh mẽ mà không dùng một từ dễ mang sắc thái miệt thị khi áp dụng cho con người; hình ảnh mạnh hơn được ghi trong chú thích.
- source_word: בָאָרֶץ
  choice: trên đất
  rationale: אֶרֶץ ở đây chỉ trái đất như phạm vi loài người sinh sống và gia tăng sau trận lụt; “trên đất” là cách nói tự nhiên trong tiếng Việt.
- source_word: וּרְבוּ בָהּ
  choice: và gia tăng trên đó
  rationale: Giữ lại lần lặp thứ hai của רבה để bảo toàn sự nhấn mạnh và cấu trúc song song. Đại từ hậu tố giống cái quy chiếu về אֶרֶץ, được diễn đạt tự nhiên là “trên đó”.
theological_decisions:
- issue: Mối liên hệ với mệnh lệnh sáng tạo và lời chúc phước sau trận lụt
  choice: Dịch như một mệnh lệnh chúc phước được tái ban cho Nô-ê và các con trai ông, không thêm lời giải thích thần học vào câu.
  alternative: Xem câu này chỉ là sự lặp lại Sáng Thế Ký 1:28, hoặc diễn rộng thành một công thức giao ước mang nội dung giáo lý.
  rationale: Nguyên văn dùng các mệnh lệnh song song với Sáng Thế Ký 1:28. Bản dịch giữ sự cộng hưởng ấy nhưng không xác định thêm những kết luận vượt quá lời văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Sinh sôi thật nhiều” tránh sắc thái tiêu cực của “lúc nhúc” hoặc “tràn lan”, còn chú thích bảo lưu hình ảnh mạnh của động từ Hê-bơ-rơ. Dấu chấm phẩy giữ hai vế mệnh lệnh cân xứng.
