    rationale: “Lõa thể” thường là vị ngữ hoặc mô tả trạng thái của một người; kết hợp với “thấy sự ...” có sắc thái hành chính và gượng. “Thấy cha mình trần truồng” diễn đạt cùng nghĩa bề mặt của “saw his father's nakedness” một cách tự nhiên hơn.
