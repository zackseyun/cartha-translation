    rationale: Khi câu chính dùng lối diễn đạt tự nhiên “thấy cha mình trần truồng,” chú thích nên nêu cụm Hê-bơ-rơ theo lối dịch sát “sự trần truồng của cha mình” và bảo toàn khả năng đây là một uyển ngữ trong các văn cảnh khác.
