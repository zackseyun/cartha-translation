  text: וַ/יַּ֗רְא חָ֚ם אֲבִ֣י כְנַ֔עַן אֵ֖ת עֶרְוַ֣ת אָבִ֑י/ו וַ/יַּגֵּ֥ד לִ/שְׁנֵֽי אֶחָ֖י/ו בַּ/חֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: vi
  text: Cham, cha của Ca-na-an, thấy cha mình trần truồng, rồi thuật lại cho hai người anh em mình ở bên ngoài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn, theo sát chữ: “sự trần truồng của cha mình.” Trong một số văn cảnh Cựu Ước, cách nói này có thể là một uyển ngữ mang hàm ý tình dục; ở đây bản dịch giữ nghĩa bề mặt và để ngỏ vấn đề diễn giải.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Động từ ראה trong mạch kể chuyện đơn giản có nghĩa là “thấy”; không cần thêm sắc thái như cố ý nhìn chằm chằm.
- source_word: חָם
  choice: Cham
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: אֲבִי כְנַעַן
  choice: cha của Ca-na-an
  rationale: Giữ nguyên thông tin đồng vị xác định Cham là cha của Ca-na-an, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: עֶרְוַת אָבִיו
  choice: sự lõa thể của cha mình
  rationale: Cách dịch sát giữ được thành ngữ Hê-bơ-rơ và không tự ý xác định một hành vi tình dục cụ thể; “mình” quy chiếu tự nhiên về Cham.
- source_word: וַיַּגֵּד
  choice: kể
  rationale: Động từ נגד ở thể Hiphil có nghĩa là nói, kể hoặc báo cho biết; “kể” phù hợp với văn mạch thuật chuyện.
- source_word: לִשְׁנֵי אֶחָיו
  choice: cho hai người anh em mình
  rationale: Thể hiện rõ số lượng hai và quan hệ anh em mà không đoán họ lớn hay nhỏ tuổi hơn Cham.
- source_word: בַּחוּץ
  choice: ở bên ngoài
  rationale: Giữ ý nghĩa chỉ địa điểm, tương phản với nơi người cha đang nằm; vị trí cuối câu bám sát trật tự và độ mở cú pháp của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của cụm “sự lõa thể của cha mình” trong trình thuật
  choice: Dịch sát là “sự lõa thể của cha mình”, không xác định một hành vi tình dục nào ngoài việc nhìn thấy tình trạng lõa thể.
  alternative: Hiểu đây là thành ngữ ám chỉ một hành vi xâm phạm tình dục nghiêm trọng hơn, hoặc theo cách dùng trong luật pháp về sau, là lối nói giảm liên quan đến quan hệ loạn luân với mẹ.
  rationale: Trong một số văn cảnh Cựu Ước, cụm từ này có thể mang hàm ý tình dục rộng hơn. Tuy nhiên, câu này chỉ nói Cham “thấy” rồi “kể” cho các anh em, còn văn cảnh trực tiếp nói đến tình trạng người cha bị phơi bày. Bản dịch chính giữ nguyên cách nói để không giải quyết thay cho người đọc sự căng thẳng diễn giải.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Dùng “lõa thể” thay vì từ khẩu ngữ, giữ tên riêng theo truyền thống tiếng Việt. Cụm “hai người anh em mình” tránh việc tiếng Việt buộc phải xác định đó là anh hay em.
