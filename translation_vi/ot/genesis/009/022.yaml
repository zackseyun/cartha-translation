- from: Cham, cha của Ca-na-an, thấy sự lõa thể của cha mình[a], rồi kể cho hai người anh em mình ở bên ngoài.
  to: Cham, cha của Ca-na-an, thấy cha mình trần truồng, rồi thuật lại cho hai người anh em mình ở bên ngoài.[a]
  rationale: Bản sửa thay cấu trúc danh từ trừu tượng “sự lõa thể” bằng cách diễn đạt Việt ngữ tự nhiên “thấy cha mình trần truồng,” trong khi chú thích bảo lưu cách dịch sát của cụm Hê-bơ-rơ và tính mơ hồ diễn giải. “Thuật lại” phản ánh tốt động từ báo cho biết; vị trí “ở bên ngoài” vẫn quy chiếu hai người anh em.
