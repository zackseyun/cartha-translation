  text: וַ/יֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: vi
  text: 'Ông nói:

    “Đáng chúc tụng thay ĐỨC CHÚA,

    Đức Chúa Trời của Sem!

    Nguyện Ca-na-an làm nô lệ cho họ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ Hê-bơ-rơ cũng có thể dịch: “làm nô lệ cho người ấy”, có lẽ chỉ về Sem.'
    reason: לָמוֹ có thể được hiểu là đại từ số nhiều “cho họ” hoặc cách dùng thi ca mang nghĩa số ít “cho người ấy”; cần bảo tồn sự mơ hồ thật của nguyên văn.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Đáng chúc tụng thay
  rationale: Diễn đạt tự nhiên lời tuyên xưng chúc tụng hướng về Đức Chúa Trời, thay vì khiến câu bị hiểu là con người ban phước cho Ngài.
- source_word: יְהוָה
  choice: ĐỨC CHÚA
  rationale: Theo quy ước tiếng Việt trang trọng dành cho danh giao ước YHWH; kiểu chữ hoa giúp phân biệt với tước hiệu thông thường.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Trong lời nguyền và quan hệ phục dịch ở ngữ cảnh gần, từ này chỉ địa vị lệ thuộc mạnh; “nô lệ” truyền đạt rõ hơn “đầy tớ”.
- source_word: לָמוֹ
  choice: cho họ
  rationale: Hình thức đại từ có thể được hiểu là số nhiều, phù hợp với cách đọc được phản ánh trong lớp tham khảo tiếng Anh, đồng thời sự mơ hồ của cách dùng thi ca được giữ lại bằng chú thích.
theological_decisions:
- issue: Đối tượng mà Ca-na-an phải phục dịch trong לָמוֹ
  choice: cho họ
  alternative: cho người ấy / cho ông (tức Sem)
  rationale: לָמוֹ thường mang nghĩa “cho họ”, nhưng trong thi ca cũng có thể được dùng với nghĩa số ít “cho người ấy”. Bản chính không âm thầm loại bỏ cách đọc số nhiều; chú thích ghi nhận cách đọc số ít.
translation_notes:
  register: 'Văn phong trang trọng nhưng hiện đại; giữ cấu trúc thi ca ngắn gọn. Tên riêng được phiên âm quen dùng trong tiếng Việt: Sem, Ca-na-an.'
