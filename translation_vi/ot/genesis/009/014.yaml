  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: vi
  text: Khi Ta kéo mây phủ trên đất, cây cung[a] sẽ hiện ra trong đám mây.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cầu vồng.” Tiếng Hê-bơ-rơ dùng từ thông thường chỉ “cây cung”; trong ngữ cảnh này, từ ấy chỉ cầu vồng, dấu hiệu của giao ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Khi
  rationale: Cấu trúc này mở đầu một hoàn cảnh thời gian trong tương lai; “Khi” diễn đạt tự nhiên chức năng ấy trong tiếng Việt.
- source_word: בְּעַנְנִי עָנָן
  choice: Ta phủ mây
  rationale: Động từ ענן ở dạng này mang nghĩa làm cho mây che phủ hoặc đem mây đến; “phủ mây” tự nhiên, gọn và giữ được hình ảnh của nguyên văn.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: “Đất” phù hợp với phạm vi toàn cõi đất trong bối cảnh giao ước sau trận lụt, đồng thời không giới hạn nghĩa vào một vùng đất cụ thể.
- source_word: וְנִרְאֲתָה
  choice: sẽ hiện ra
  rationale: Dạng Niphal của ראה có thể mang nghĩa “được nhìn thấy” hoặc “hiện ra”; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ ý trở nên thấy được.
- source_word: הַקֶּשֶׁת
  choice: cây cung
  rationale: קשת là từ thông thường chỉ cây cung; trong văn cảnh này nó chỉ cầu vồng, là dấu hiệu giao ước. Dịch “cây cung” bảo tồn hình ảnh từ vựng của tiếng Hê-bơ-rơ, còn chú thích làm rõ nghĩa theo văn cảnh.
- source_word: בֶּעָנָן
  choice: trong mây
  rationale: Giữ số ít và cách diễn đạt trực tiếp của nguyên văn Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch קשת trong bối cảnh giao ước với Nô-ê
  choice: cây cung
  alternative: cầu vồng
  rationale: Nguyên văn dùng danh từ thông thường chỉ cây cung, đồng thời văn cảnh xác định đây là cầu vồng. Giữ “cây cung” trong chính văn bảo tồn hình ảnh giao ước mà không xóa đi lớp nghĩa từ vựng; chú thích nêu cách hiểu theo hiện tượng tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời Đức Chúa Trời đang phán trong ngữ cảnh. Câu giữ cấu trúc thời gian và hình ảnh “cây cung” của nguyên văn, nhưng dùng “hiện ra” thay cho dạng bị động cứng để tiếng Việt tự nhiên.
