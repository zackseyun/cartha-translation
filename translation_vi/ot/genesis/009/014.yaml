  to: Khi Ta kéo mây phủ trên đất, cây cung[a] sẽ hiện ra trong đám mây.
  rationale: Chỉnh cách diễn đạt về mây để phản ánh rõ hành động “đem/làm mây phủ” của động từ Hê-bơ-rơ và chỉnh “trong đám mây” theo danh từ số ít xác định. Không thay đổi ý nghĩa, đại từ, thì tương lai, hay lựa chọn từ vựng chủ đạo “cây cung”; chú thích tiếp tục bảo toàn phương án “cầu vồng”.
