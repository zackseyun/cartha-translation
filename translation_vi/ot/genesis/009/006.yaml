source:
  edition: WLC
  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: vi
  text: Ai làm đổ máu người thì máu kẻ ấy sẽ bị người làm đổ[a], vì Đức Chúa Trời đã làm nên con người theo hình ảnh của Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “bởi người” trong tiếng Hê-bơ-rơ cũng có thể được hiểu là “giữa loài người”; bản dịch chính hiểu theo nghĩa chỉ tác nhân.
    reason: textual_ambiguity
  - marker: b
    text: 'Sát nguyên văn: “vì theo hình ảnh Đức Chúa Trời, Ngài đã làm nên con người.”'
    reason: literal_rendering
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: Ai làm đổ
  rationale: Phân từ Qal mang nghĩa khái quát, như một mệnh đề pháp lý có tính châm ngôn. “Ai làm đổ” tự nhiên trong tiếng Việt và giữ được thành ngữ “làm đổ máu”.
- source_word: דַּם הָאָדָם
  choice: máu người
  rationale: Diễn đạt sự sống của một con người bị tước đoạt bằng bạo lực. “Người” ở đây có nghĩa chung, không chỉ nam giới.
- source_word: בָּאָדָם
  choice: bởi người
  rationale: 'Hiểu giới từ ב theo nghĩa chỉ tác nhân: máu kẻ giết người sẽ bị đổ bởi con người. Cách dịch này giữ sự lặp lại của אָדָם, nhưng chú thích ghi nhận khả năng hiểu khác của cụm từ.'
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: máu kẻ ấy sẽ bị đổ
  rationale: Giữ thể bị động của Niphal và cấu trúc đối xứng về máu; “kẻ ấy” làm rõ đại từ chỉ người đã làm đổ máu mà không thêm ý ngoài câu.
- source_word: כִּי
  choice: vì
  rationale: Dẫn vào lý do làm nền cho lời phán trước đó.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: theo hình ảnh Ngài
  rationale: Trong tiếng Việt, “theo hình ảnh Ngài” diễn đạt tự nhiên việc con người được dựng nên tương ứng với hình ảnh của Đức Chúa Trời; chú thích cung cấp trật tự sát nguyên văn hơn.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít và ngữ cảnh đòi hỏi nghĩa số ít, chỉ Đức Chúa Trời.
- source_word: עָשָׂה
  choice: đã dựng nên
  rationale: עָשָׂה là “làm nên”; “dựng nên” trang trọng, tự nhiên trong văn cảnh sáng tạo, đồng thời không đồng nhất từ này với ברא.
- source_word: הָאָדָם
  choice: loài người
  rationale: Ở mệnh đề cuối, אָדָם chỉ nhân loại nói chung. “Loài người” chuyển tải rõ phạm vi bao quát và không giới hạn ở nam giới.
theological_decisions:
- issue: Ý nghĩa chung của אָדָם
  choice: “người” và “loài người” theo ngữ cảnh
  alternative: “người nam” hoặc lặp lại một từ duy nhất ở cả ba chỗ
  rationale: Ba lần dùng אָדָם liên kết nạn nhân, tác nhân thi hành phán quyết và nhân loại mang hình ảnh Đức Chúa Trời. Tiếng Việt cần thay đổi nhẹ để tự nhiên, nhưng vẫn giữ nghĩa bao quát mọi con người.
- issue: Vai trò của con người trong việc làm đổ máu kẻ giết người
  choice: “bởi người” theo nghĩa tác nhân
  alternative: “giữa loài người” hoặc lời dự báo sự báo trả mà không nêu tác nhân
  rationale: Cách hiểu tác nhân phù hợp nhất với cú pháp và phép đối xứng của câu. Bản dịch không mở rộng câu thành một hệ thống giáo lý về hình phạt tử hình.
- issue: Mệnh đề về hình ảnh Đức Chúa Trời
  choice: “Đức Chúa Trời đã dựng nên loài người theo hình ảnh Ngài”
  alternative: “theo hình ảnh Đức Chúa Trời, Ngài đã dựng nên loài người”
  rationale: 'Cách chọn tự nhiên trong tiếng Việt mà vẫn giữ nguyên nền tảng thần học của câu: giá trị đặc biệt của mạng sống con người gắn với việc nhân loại mang hình ảnh Đức Chúa Trời.'
translation_notes:
  register: Văn phong trang trọng, súc tích và dễ hiểu trong tiếng Việt hiện đại. Giữ phép đối xứng “làm đổ máu… máu… sẽ bị đổ” và tránh cách dùng “đàn ông” vì אָדָם ở đây chỉ con người nói chung.
