source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: vi
  text: Quả thật, Ta sẽ truy cứu huyết của các con, tức mạng sống của các con.[a] Ta sẽ truy cứu huyết ấy từ tay mọi loài thú,[b] và từ tay con người—từ tay người anh em của mình—Ta sẽ truy cứu mạng sống con người.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “huyết của các con, vì/cho mạng sống của các con.” Nguyên văn nêu riêng “huyết” và “mạng sống”; “tức” diễn đạt mối liên hệ giữa huyết và sự sống trong ngữ cảnh này.'
    reason: lexical_alternative
  - marker: b
    text: '“Truy cứu” ở đây mang nghĩa tư pháp: đòi hỏi sự giải trình về huyết đã đổ.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát chữ: “từ tay con người, từ tay một người, anh em của mình.” Cụm này nhấn mạnh trách nhiệm của con người đối với mạng sống của người khác.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְאַךְ
  choice: Nhưng chắc chắn
  rationale: וְ nối với mạch trước, còn אַךְ mang sắc thái nhấn mạnh và giới hạn. “Nhưng chắc chắn” diễn đạt tự nhiên sự chuyển ý từ việc cho phép dùng động vật làm thức ăn sang việc nghiêm cấm và truy cứu việc làm đổ huyết.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: huyết của các con vì mạng sống của các con
  rationale: Giữ riêng hai khái niệm דָּם (huyết) và נֶפֶשׁ (mạng sống), đồng thời dùng “vì” để thể hiện quan hệ do לְ đánh dấu mà không đồng nhất hoàn toàn huyết với sự sống.
- source_word: אֶדְרֹשׁ / אֶדְרְשֶׁנּוּ
  choice: Ta sẽ đòi lại / Ta sẽ đòi lại huyết ấy
  rationale: Trong ngữ cảnh tư pháp, דרשׁ chỉ việc đòi hỏi sự đền trả hoặc truy cứu trách nhiệm. “Đòi lại” vừa gọn vừa giữ sắc thái Đức Chúa Trời yêu cầu trả lời về huyết đã đổ.
- source_word: מִיַּד
  choice: từ tay
  rationale: Giữ thành ngữ Hê-bơ-rơ theo nghĩa đen và sự lặp lại có chủ ý; trong văn cảnh, “tay” biểu thị tác nhân phải chịu trách nhiệm.
- source_word: כָּל חַיָּה
  choice: mọi loài thú
  rationale: חַיָּה ở đây chỉ động vật, đối lập với con người. “Mọi loài thú” phù hợp văn phong trang trọng và không mở rộng thành mọi sinh vật sống.
- source_word: אִישׁ אָחִיו
  choice: mỗi người là anh em của đồng loại mình
  rationale: Cụm từ sát chữ là “một người, anh em của mình.” Cách dịch này giữ hình ảnh anh em nhưng làm rõ rằng đó là quan hệ giữa người với người, không nhất thiết chỉ anh em ruột.
- source_word: נֶפֶשׁ הָאָדָם
  choice: mạng sống con người
  rationale: נֶפֶשׁ trong ngữ cảnh huyết và giết chóc chỉ mạng sống, không chủ yếu nói đến một linh hồn phi vật chất. הָאָדָם ở đây mang ý nghĩa đại diện cho loài người.
theological_decisions:
- issue: Ý nghĩa của נֶפֶשׁ trong ngữ cảnh đổ huyết
  choice: mạng sống
  alternative: linh hồn
  rationale: Mạch văn liên kết huyết với sự sống và nói về trách nhiệm khi lấy mạng người. “Linh hồn” có thể đưa vào một khẳng định nhị nguyên thân xác–linh hồn mà câu Hê-bơ-rơ không nhấn mạnh.
- issue: Phạm vi của אָדָם
  choice: con người
  alternative: người đàn ông
  rationale: אָדָם được đặt đối lập với loài thú và mang nghĩa con người nói chung; dịch “con người” bảo toàn phạm vi nhân loại mà không giới hạn theo giới tính.
- issue: Trách nhiệm được diễn đạt bằng מִיַּד אִישׁ אָחִיו
  choice: giữ hình ảnh “từ tay” và “anh em”
  alternative: diễn giải hoàn toàn là “bắt mỗi người chịu trách nhiệm về đồng loại”
  rationale: Bản chính giữ được hình ảnh pháp lý và quan hệ thân thuộc của nguyên văn; chú thích giải thích rằng “anh em” ở đây có thể chỉ một người đồng loại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời phán trực tiếp của Đức Chúa Trời; giữ sự lặp lại “Ta sẽ đòi lại” và hình ảnh “từ tay” để phản ánh nhịp điệu cùng sắc thái tư pháp của tiếng Hê-bơ-rơ. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
