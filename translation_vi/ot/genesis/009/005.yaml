revisions:
- from: Nhưng chắc chắn, Ta sẽ đòi lại huyết của các con vì mạng sống của các con.[a] Ta sẽ đòi lại huyết ấy từ tay mọi loài thú,[b] và từ tay con người—từ tay mỗi người là anh em của đồng loại mình—Ta sẽ đòi lại mạng sống con người.[c]
  to: Quả thật, Ta sẽ truy cứu huyết của các con, tức mạng sống của các con.[a] Ta sẽ truy cứu huyết ấy từ tay mọi loài thú,[b] và từ tay con người—từ tay người anh em của mình—Ta sẽ truy cứu mạng sống con người.[c]
  rationale: Sửa tối thiểu để động từ pháp lý được dịch chính xác và tiếng Việt tự nhiên hơn. Bản sửa vẫn giữ sự lặp lại có chủ ý của “Ta sẽ truy cứu” và “từ tay,” giữ “anh em” trong chính văn, đồng thời không quyết định vượt quá nguyên văn về quan hệ chính xác giữa “huyết” và “mạng sống.” Các dấu chú thích [a], [b], [c] đều được neo đúng trong chính văn.
