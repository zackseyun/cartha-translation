base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: vi
  text: “Hãy đặt chén của ta, tức chén bạc, vào miệng bao[a] của người em út, cùng với số bạc mua lương thực của người ấy.” Người quản gia làm đúng theo lời Giô-sép đã nói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng thành ngữ “miệng bao” để chỉ phần mở của chiếc bao.
    reason: cultural_note
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: cái chén của ta, tức cái chén bạc
  rationale: גְּבִיעַ chỉ một chiếc chén hoặc cốc; “chén” tự nhiên trong tiếng Việt và giữ được cấu trúc đồng vị nhấn mạnh của tiếng Hê-bơ-rơ.
- source_word: תָּשִׂים
  choice: hãy đặt
  rationale: שׂים có nghĩa thông dụng là đặt, để; “hãy đặt” phù hợp với lời sai bảo trong ngữ cảnh.
- source_word: בְּפִי אַמְתַּחַת
  choice: vào miệng bao
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ, trong đó “miệng” chỉ phần mở của chiếc bao.
- source_word: הַקָּטֹן
  choice: người em út
  rationale: Nghĩa đen là người nhỏ hoặc trẻ; trong ngữ cảnh gia đình này, cụm từ chỉ người em út và cách dịch này tự nhiên, rõ ràng trong tiếng Việt.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: số bạc mua lương thực của cậu ấy
  rationale: כֶּסֶף là bạc dùng làm tiền, còn שִׁבְרוֹ trong trình thuật nạn đói chỉ lương thực được mua. Cách dịch giữ cả sắc thái vật chất lẫn giao dịch.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: Người quản gia làm theo lời Giô-sép đã truyền
  rationale: Chủ thể ngầm được xác định từ ngữ cảnh là người quản gia. “Làm theo lời” diễn đạt tự nhiên כִּדְבַר; “đã truyền” phản ánh đây là lời chỉ thị mà Giô-sép vừa nói, không nâng thành thuật ngữ thần học.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Giữ hình ảnh “miệng bao” của nguyên văn và giải thích bằng chú thích; dùng “số bạc” thay vì chỉ “tiền” để bảo toàn từ ngữ cụ thể của tiếng Hê-bơ-rơ.
