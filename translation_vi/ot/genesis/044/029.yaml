base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: vi
  text: Nếu các con cũng đem đứa này đi khỏi cha, mà nó gặp tai họa, thì các con sẽ khiến mái đầu bạc của cha phải đau khổ mà đi xuống Sheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mồ mả” hoặc “cõi người chết.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקַחְתֶּם גַּם אֶת־זֶה
  choice: Nếu các con cũng đưa đứa này
  rationale: Mệnh đề tiếp nối điều kiện trong lời Gia-cốp; “nếu… cũng” diễn đạt tự nhiên quan hệ điều kiện và ý thêm một người con nữa.
- source_word: מֵעִם פָּנַי
  choice: rời khỏi cha
  rationale: Thành ngữ chỉ việc bị đưa ra khỏi sự hiện diện của người nói; cách dịch này tự nhiên trong tiếng Việt và giữ rõ sự chia lìa với Gia-cốp.
- source_word: וְקָרָהוּ אָסוֹן
  choice: rồi nó gặp tai họa
  rationale: Diễn đạt trực tiếp ý tai ương xảy đến với Bên-gia-min, không xác định quá mức đó là thương tích hay cái chết.
- source_word: וְהוֹרַדְתֶּם
  choice: các con sẽ khiến … đi xuống
  rationale: Giữ sắc thái gây khiến của thể Hiphil và hình ảnh đi xuống cõi chết.
- source_word: שֵׂיבָתִי
  choice: cha bạc đầu này
  rationale: Giữ hình ảnh tóc bạc như cách tự chỉ bản thân trong tuổi già, đồng thời tạo câu tiếng Việt tự nhiên trong lời người cha nói với các con.
- source_word: בְּרָעָה
  choice: đau khổ
  rationale: Trong ngữ cảnh, từ này nói đến tình trạng khốn khổ, đau buồn chứ không phải điều ác về luân lý.
- source_word: שְׁאֹלָה
  choice: xuống Sheol
  rationale: Giữ nguyên thuật ngữ Hê-bơ-rơ nhằm bảo toàn phạm vi nghĩa về cõi người chết, thay vì thu hẹp thành phần mộ.
theological_decisions:
- issue: Cách dịch שְׁאֹל
  choice: Sheol
  alternative: mồ mả; cõi người chết
  rationale: Phiên âm bảo tồn thế giới quan và độ rộng nghĩa của nguyên ngữ mà không áp đặt quan niệm hậu kỳ; chú thích cung cấp các cách hiểu tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cha/các con” để phản ánh quan hệ gia đình trong lời trực tiếp; giữ “Sheol” kèm chú thích nhằm bảo toàn thuật ngữ nguồn.
