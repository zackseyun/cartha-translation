base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: vi
  text: Chẳng phải đây là chiếc chén mà chủ tôi dùng để uống, và ông ấy quả thật bói bằng chiếc chén ấy sao? Các người đã làm điều ác khi làm việc này.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và ông ấy chắc chắn bói bằng chiếc chén ấy.” Tiếng Hê-bơ-rơ dùng nguyên mẫu tuyệt đối cùng với động từ hữu hạn để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “Các người đã làm điều ác trong điều các người đã làm.”'
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: Chẳng phải đây là chiếc chén... sao?
  rationale: Giữ dạng câu hỏi tu từ mong đợi sự đồng tình; danh từ “chiếc chén” được làm rõ tự nhiên từ ngữ cảnh trực tiếp.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: chủ tôi dùng để uống
  rationale: ב với động từ “uống” chỉ vật chứa hoặc phương tiện; “chủ tôi” phù hợp lời của quản gia nói về Giô-sép và tránh sắc thái thần học không cần thiết.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: và cũng dùng để bói
  rationale: “Bói” truyền đạt nghĩa của נחש trong ngữ cảnh; cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn có tính nhấn mạnh, được phản ánh phần nào bằng “cũng” và được ghi rõ trong chú thích.
- source_word: הֲרֵעֹתֶם
  choice: Các người đã làm điều ác
  rationale: Giữ sức nặng đạo đức của động từ Hiphil רעע, thay vì làm nhẹ thành “làm sai”.
- source_word: אֲשֶׁר עֲשִׂיתֶם
  choice: khi làm việc này
  rationale: Diễn đạt tự nhiên trong tiếng Việt, xác định chính hành động vừa nêu là điều ác mà không tạo lối lặp vụng về.
theological_decisions:
- issue: Lời quản gia có khẳng định Giô-sép thực sự bói hay chỉ thuộc vai diễn trong phép thử
  choice: 'Dịch thẳng lời cáo buộc trong diễn ngôn: chủ ông dùng chiếc chén để bói.'
  alternative: Làm nhẹ thành “có thể bói bằng chén ấy” hoặc ngụ ý đây chỉ là tiếng đồn.
  rationale: Tiếng Hê-bơ-rơ trực tiếp dùng ngôn ngữ bói toán trong lời nhân vật. Bản dịch không nên tự giải quyết câu hỏi về thực hành thực tế của Giô-sép hay hài hòa hóa lời này với những nhận định thần học khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chẳng phải... sao?” cho câu hỏi tu từ; “các người” phù hợp lời quở trách hướng đến một nhóm. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
