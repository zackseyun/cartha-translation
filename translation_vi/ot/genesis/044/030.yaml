  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: vi
  text: “Bây giờ, khi con đến với cha con, tôi tớ của ngài, mà người con trai ấy không ở cùng chúng con—sự sống của cha gắn chặt với sự sống của người ấy[a]—[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “linh hồn của cha gắn chặt với linh hồn của người ấy.” Từ Hê-bơ-rơ נֶפֶשׁ có thể mang nghĩa “linh hồn”, “sự sống” hoặc “chính con người”; ở đây cùng một từ được dùng cho cả người cha và Bên-gia-min.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu vế cuối theo nghĩa giải thích: “mà người con trai ấy không ở cùng chúng con, vì sự sống của cha gắn chặt với sự sống của người ấy—”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ chức năng chuyển tiếp của וְ và ý nghĩa thời điểm của עַתָּה, đồng thời mở đầu tự nhiên cho bước kế tiếp trong lời khẩn cầu của Giu-đa.
- source_word: כְּבֹאִי
  choice: khi con trở về
  rationale: Cấu trúc כְּ với động từ nguyên mẫu và hậu tố ngôi thứ nhất diễn tả thời điểm. Trong ngữ cảnh, Giu-đa nói đến việc trở về chỗ cha mình, nên “trở về” tự nhiên và rõ hơn “đến” trong tiếng Việt.
- source_word: אֶל־עַבְדְּךָ אָבִי
  choice: với cha con là tôi tớ ngài
  rationale: Bảo tồn cả quan hệ gia đình (“cha con”) lẫn cách tự hạ mình trước Giô-sép (“tôi tớ ngài”), theo lối diễn đạt trang trọng nhưng dễ hiểu.
- source_word: הַנַּעַר
  choice: cậu ấy
  rationale: נַעַר có thể chỉ một thiếu niên hoặc người nam trẻ tuổi, không nhất thiết là trẻ nhỏ. “Cậu ấy” giữ sắc thái trẻ hơn và thân thuộc mà không khiến người đọc hiểu Bên-gia-min là một đứa bé.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: không ở cùng chúng con
  rationale: Chuyển đạt trực tiếp và tự nhiên cấu trúc phủ định chỉ sự vắng mặt.
- source_word: נַפְשׁוֹ
  choice: mạng sống của cha
  rationale: Trong ngữ cảnh, נֶפֶשׁ nói đến chính sự sống và con người của người cha, không phải một thuật ngữ kỹ thuật về bản thể. Nêu rõ “của cha” giúp phân biệt hai đại từ giống nhau trong tiếng Hê-bơ-rơ.
- source_word: קְשׁוּרָה בְנַפְשׁוֹ
  choice: gắn chặt với mạng sống của cậu ấy
  rationale: קְשׁוּרָה diễn tả tình trạng bị buộc hoặc gắn kết mạnh mẽ. Cụm này giữ hình ảnh của nguyên văn và làm rõ rằng hậu tố cuối chỉ Bên-gia-min.
