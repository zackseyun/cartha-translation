source:
  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: vi
  text: Ai trong số các tôi tớ[a] của ngài mà người ta tìm thấy nó nơi người ấy thì người ấy phải chết[b]; và cả chúng tôi cũng sẽ trở thành nô lệ của chúa tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tôi tớ” và “nô lệ” về sau trong câu này dịch cùng một từ Hê-bơ-rơ. Ở đây từ ấy là lối tự xưng kính cẩn; về sau nó chỉ thân phận nô lệ thật sự.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người ấy sẽ chết.”'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: Nếu tìm thấy nó ở người nào trong số các tôi tớ của ngài
  rationale: Mệnh đề quan hệ bất định được diễn đạt bằng cấu trúc “nếu… người nào” tự nhiên trong tiếng Việt. “Nó” chỉ chiếc chén trong văn cảnh; “ở” diễn tả vật được tìm thấy nơi hoặc thuộc quyền giữ của người ấy; מִן mang nghĩa phân bộ, nên dịch là “trong số”.
- source_word: וָמֵת
  choice: người ấy phải chết
  rationale: Diễn tả hậu quả mang tính án phạt trong lời đề nghị đầy quả quyết của các anh em. “Phải chết” tự nhiên và giữ được sắc thái có thể hiểu là quy định/hệ quả, thay vì thêm mệnh lệnh trực tiếp không hiện rõ trong hình thái động từ.
- source_word: וְגַם אֲנַחְנוּ נִהְיֶה
  choice: và cả chúng tôi cũng sẽ trở thành
  rationale: Giữ sắc thái bổ sung, nhấn mạnh của וְגַם và ý bước vào một tình trạng mới của נִהְיֶה.
- source_word: לַאדֹנִי
  choice: của chúa tôi
  rationale: Đây là tước xưng kính trọng dành cho một người có thẩm quyền, không phải danh xưng thần linh. “Chúa tôi” giữ lối xưng hô trang trọng trong bối cảnh cung đình cổ đại.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: các tôi tớ / nô lệ
  rationale: Lần đầu là cách tự xưng khiêm nhường trước người có thẩm quyền, nên “tôi tớ” phù hợp; lần sau nói đến tình trạng bị lệ thuộc như hình phạt, nên “nô lệ” biểu đạt rõ hơn.
theological_decisions:
- issue: Cách dịch hai lần xuất hiện của עבד
  choice: “tôi tớ” ở lần đầu và “nô lệ” ở lần sau
  alternative: Dịch cả hai lần là “tôi tớ” hoặc cả hai lần là “nô lệ”
  rationale: 'Cùng một từ Hê-bơ-rơ nhưng chức năng ngữ cảnh khác nhau: lần đầu là lời tự xưng kính cẩn, lần sau là thân phận lệ thuộc thật sự do hình phạt. Sự phân biệt này không áp đặt một quan niệm giáo phái.'
- issue: Sắc thái của וָמֵת
  choice: “người ấy phải chết”
  alternative: “người ấy sẽ chết” hoặc “hãy để người ấy chết”
  rationale: Dạng động từ có thể được hiểu là hậu quả được tuyên bố hoặc đề nghị mang lực ý chí. “Phải chết” giữ sắc thái án phạt mà không giải quyết quá mức sự căng thẳng giữa hai cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” trong lời thưa trực tiếp và “chúa tôi” để bảo tồn tước xưng cung kính ở ngôi thứ nhất; viết thường để tránh nhầm với danh xưng dành cho Đức Chúa Trời.
