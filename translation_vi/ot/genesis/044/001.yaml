  text: וַ/יְצַ֞ו אֶת אֲשֶׁ֣ר עַל בֵּית/וֹ֮ לֵ/אמֹר֒ מַלֵּ֞א אֶת אַמְתְּחֹ֤ת הָֽ/אֲנָשִׁים֙ אֹ֔כֶל כַּ/אֲשֶׁ֥ר יוּכְל֖וּ/ן שְׂאֵ֑ת וְ/שִׂ֥ים כֶּֽסֶף אִ֖ישׁ בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: vi
  text: 'Sau đó, ông truyền cho người quản lý nhà mình: “Hãy đổ đầy các bao của những người ấy bằng lương thực, đến mức họ có thể mang được, rồi đặt bạc của mỗi người vào miệng bao[a] của người đó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng thành ngữ “miệng bao”, tức là chỗ mở của bao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Sau đó, ông truyền
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “Sau đó” diễn đạt trình tự tự nhiên, còn “truyền” giữ sắc thái ra lệnh.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: người quản lý nhà mình
  rationale: Cụm này theo nghĩa đen là “người ở trên nhà ông”, chỉ người chịu trách nhiệm quản lý gia thất. Cách dịch đã chọn tự nhiên trong tiếng Việt mà không áp đặt một chức danh chuyên biệt.
- source_word: מַלֵּא
  choice: Hãy đổ đầy
  rationale: Mệnh lệnh của מלא có nghĩa làm cho đầy; “đổ đầy” hợp tự nhiên với việc cho lương thực vào bao.
- source_word: אַמְתְּחֹת
  choice: các bao
  rationale: Chỉ những bao dùng để chuyên chở lương thực trong hành trình; “bao” phù hợp bối cảnh hơn từ khái quát “túi”.
- source_word: הָאֲנָשִׁים
  choice: của những người ấy
  rationale: Giữ nguyên cách gọi “những người” của câu Hê-bơ-rơ, không thay bằng “các anh em” dù ngữ cảnh cho biết họ là anh em.
- source_word: אֹכֶל
  choice: lương thực
  rationale: אֹכֶל là từ rộng chỉ thức ăn. “Lương thực” tự nhiên trong bối cảnh đồ ăn dự trữ và vận chuyển, nhưng không thu hẹp hẳn thành “ngũ cốc”.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: nhiều hết mức họ có thể mang
  rationale: Diễn đạt cả khả năng và sức mang theo của nguyên ngữ bằng một cấu trúc tiếng Việt rõ ràng.
- source_word: וְשִׂים
  choice: rồi đặt
  rationale: שׂים có nghĩa “đặt/để”; “rồi” thể hiện bước tiếp theo trong chuỗi mệnh lệnh một cách tự nhiên.
- source_word: כֶּסֶף אִישׁ
  choice: bạc của mỗi người
  rationale: Giữ nghĩa cơ bản “bạc” của כֶּסֶף và lực phân phối của אִישׁ, không giải thích thêm ngay trong chính văn rằng đây là tiền thanh toán.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: vào miệng bao của người đó
  rationale: Giữ hình ảnh nguyên ngữ “miệng bao”; đại từ được diễn đạt thành “của người đó” để mối liên hệ với “mỗi người” rõ ràng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” cho chủ thể được tiếp nối từ ngữ cảnh; không thêm tên Giô-sép vốn không xuất hiện trong câu này. Cụm “người quản lý nhà mình” vừa dễ hiểu vừa phản ánh sát chức năng được nguyên ngữ mô tả.
