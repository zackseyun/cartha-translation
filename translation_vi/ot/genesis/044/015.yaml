  source_fidelity: Bản nháp giữ đúng cấu trúc đối thoại, câu hỏi tu từ phủ định và trường nghĩa bói toán của נחש. Tuy nhiên, “chắc chắn sẽ dùng thuật bói toán” đặt hành động ở thì tương lai và diễn đạt như một hành vi sẽ diễn ra, trong khi cấu trúc nguyên thể tuyệt đối + động từ chưa hoàn thành chủ yếu nhấn mạnh lời khẳng định rằng người như Giô-sép thực sự/ắt biết thực hành bói toán, không nhất thiết dự báo một hành động tương lai.
  naturalness: “Việc các người đã làm là thế nào?” không tự nhiên trong tiếng Việt hiện đại. “Các người đã làm việc gì thế này?” là lời quở trách tự nhiên, trực tiếp, đồng thời vẫn giữ sắc thái của מַעֲשֶׂה. “Hẳn biết bói toán” tự nhiên hơn “sẽ dùng thuật bói toán” và phù hợp với ngữ cảnh.
  terminology: Giữ “Giô-sép,” “các người,” và “ta” phù hợp văn phong trang trọng cùng địa vị của nhân vật. “Bói toán” phản ánh trực tiếp gốc נחש mà không phán quyết Giô-sép thực sự làm điều ấy hay chỉ nói theo vai quan Ai Cập.
