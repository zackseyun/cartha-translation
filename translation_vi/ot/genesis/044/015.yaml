base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: vi
  text: 'Giô-sép nói với họ: “Các người đã làm việc gì thế này? Các người không biết rằng một người như ta hẳn biết bói toán sao?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quả thật bói toán,” “ắt sẽ bói ra,” “chắc chắn sẽ tìm ra bằng thuật bói toán,” hoặc “ắt có thể khám phá ra những chuyện như thế.” Tiếng Hê-bơ-rơ dùng một cấu trúc nhấn mạnh với động từ thuộc gốc từ chỉ việc bói toán.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: Việc các người đã làm là thế nào?
  rationale: מַעֲשֶׂה chỉ việc làm hay hành động. Cách diễn đạt này tự nhiên trong tiếng Việt, đồng thời giữ sắc thái quở trách của câu hỏi.
- source_word: עֲשִׂיתֶם
  choice: các người đã làm
  rationale: Thể hoàn thành nói về hành động đã xảy ra nhưng đang là căn cứ của lời buộc tội hiện tại.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Các người không biết rằng ... sao?
  rationale: Giữ nguyên hình thức câu hỏi phủ định có tính tu từ và chờ đợi câu trả lời khẳng định.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: chắc chắn sẽ dùng thuật bói toán
  rationale: Động từ nguyên thể tuyệt đối đi kèm động từ hữu hạn nhấn mạnh ý niệm bói toán. “Chắc chắn sẽ dùng” truyền đạt sắc thái nhấn mạnh trong ngữ cảnh phát hiện chiếc chén, nhưng chú thích bảo lưu các khả năng hiểu khác của cấu trúc.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: một người như ta
  rationale: Dịch trực tiếp danh từ số ít אִישׁ và cấu trúc so sánh, phù hợp với lời của một nhân vật có địa vị cao.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Lời Giô-sép nói về bói toán là lời xác nhận thực hành thật, lời đe dọa trong vai quan Ai Cập, hay lời nói rằng ông có thể phát hiện sự việc
  choice: Dịch trực tiếp bằng ngôn ngữ bói toán và không giải thích động cơ của Giô-sép
  alternative: “một người như ta ắt có thể khám phá ra những chuyện như thế”
  rationale: Bản Hê-bơ-rơ lặp căn נחש, vốn chỉ việc bói toán. Bản dịch không nên xóa bỏ yếu tố này hoặc quyết định thay cho người đọc rằng Giô-sép thật sự hành nghề hay chỉ đang duy trì vai trò của mình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta” và cách gọi “các người” phản ánh địa vị cùng giọng quở trách của Giô-sép trong vai quan cai trị Ai Cập; không thêm lời giải thích nhằm hóa giải căng thẳng trong lời ông.
