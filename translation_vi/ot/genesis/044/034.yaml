base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: vi
  text: Vì làm sao con có thể trở về với cha con mà không có cậu bé đi cùng? E rằng con phải chứng kiến tai họa xảy đến với cha con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: trở về
  rationale: Động từ có nghĩa đen là “đi lên”, nhưng trong ngữ cảnh Giu-đa nói về việc quay về Ca-na-an với cha, “trở về” truyền đạt tự nhiên hướng chuyển động theo ngữ cảnh.
- source_word: הַנַּעַר
  choice: cậu bé
  rationale: Giữ cách gọi nhấn mạnh vị thế người con trẻ là Bên-gia-min trong lời Giu-đa, dù ông đã là người trưởng thành.
- source_word: בָרָע
  choice: tai họa
  rationale: רָע ở đây chỉ điều dữ hay tai họa ập đến với Gia-cốp, không nhất thiết là sự gian ác về mặt đạo đức.
- source_word: יִמְצָא אֶת אָבִי
  choice: sẽ giáng xuống cha con
  rationale: Thành ngữ nghĩa đen là “sẽ gặp/ập đến cha con”; “giáng xuống” diễn đạt tự nhiên một tai họa xảy đến với ông.
theological_decisions:
- issue: Sắc thái của פֶּן
  choice: Con không thể nào chứng kiến
  alternative: E rằng con sẽ chứng kiến
  rationale: Trong câu hỏi tu từ đầy cảm xúc, פֶּן nêu kết cục Giu-đa quyết không muốn phải nhìn thấy. Cách dịch giữ sức nặng của lời van xin mà không xác định cụ thể tai họa là cái chết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu cảm xúc; dùng đại từ “con” phù hợp với lời Giu-đa nói về cha mình. Không thêm chú thích vì câu có thể được diễn đạt rõ mà không cần giải thích văn bản.
