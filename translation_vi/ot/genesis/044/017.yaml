revisions:
- from: 'Nhưng ông nói: “Ta quyết không làm điều đó! Người nào bị phát hiện có chiếc chén trong tay, chính người ấy sẽ làm nô lệ cho ta[a]. Còn các ngươi, hãy bình an trở về với cha mình.”'
  to: 'Nhưng ông nói: “Ta quyết không làm điều đó! Người mà chiếc chén được tìm thấy trong tay người ấy, chính người ấy sẽ là nô lệ của ta[a]. Còn các ngươi, hãy bình an trở về với cha mình.”'
  rationale: Sửa “làm nô lệ cho ta” thành “là nô lệ của ta” để chuyển đạt chính xác hơn הוּא יִהְיֶה לִּי עָבֶד. Đồng thời, sắp xếp lại mệnh đề về chiếc chén để chủ thể được “tìm thấy” là chiếc chén, như nguyên văn, mà vẫn giữ hình ảnh “trong tay người ấy.”
