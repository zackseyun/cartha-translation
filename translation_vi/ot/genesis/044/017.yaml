base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: vi
  text: 'Nhưng ông nói: “Ta quyết không làm điều đó! Người mà chiếc chén được tìm thấy trong tay người ấy, chính người ấy sẽ là nô lệ của ta[a]. Còn các ngươi, hãy bình an trở về với cha mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể dịch là “đầy tớ”; trong ngữ cảnh này, “nô lệ” nhấn mạnh tình trạng lệ thuộc được áp đặt như một hình phạt.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Ta quyết không
  rationale: Thành ngữ bày tỏ sự khước từ mạnh mẽ; cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái dứt khoát.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: làm điều đó
  rationale: Diễn đạt trực tiếp hành động mà người nói cương quyết từ chối.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: Người nào bị phát hiện có chiếc chén trong tay
  rationale: Giữ hình ảnh cụ thể của nguyên văn ‘trong tay’, đồng thời diễn đạt tự nhiên ý sở hữu trong ngữ cảnh.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: chính người ấy sẽ làm nô lệ cho ta
  rationale: Đại từ nhấn mạnh הוּא được thể hiện bằng ‘chính người ấy’; עָבֶד ở đây chỉ tình trạng lệ thuộc mang tính trừng phạt, nên ‘nô lệ’ phù hợp hơn ‘đầy tớ’, dù từ Hê-bơ-rơ có thể mang cả hai nghĩa.
- source_word: וְאַתֶּם עֲלוּ
  choice: Còn các ngươi, hãy ... trở về
  rationale: ‘Còn’ thể hiện tương phản giữa người bị giữ lại và những người được phép đi; ‘trở về’ chuyển đạt tự nhiên chuyển động đi lên về phía quê cha trong ngữ cảnh.
- source_word: לְשָׁלוֹם
  choice: bình an
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ việc ra đi an toàn, không bị gây khó dễ.
- source_word: אֶל אֲבִיכֶם
  choice: với cha mình
  rationale: Trong tiếng Việt, ‘trở về với cha mình’ tự nhiên và xác định rõ người cha chung của những người được nói đến.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ ‘ta/các ngươi’ phù hợp với lời của một quan chức có thẩm quyền nói với nhóm anh em. Dấu chấm than truyền đạt sức mạnh của thành ngữ khước từ trong nguyên văn.
