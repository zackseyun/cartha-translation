  - marker: a
    text: 'Cũng có thể dịch: “Khi buổi sáng vừa rạng” hoặc “Khi trời đã sáng vào buổi sớm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: Vừa khi trời sáng
  rationale: Cụm thời gian diễn tả lúc ánh sáng ban mai vừa xuất hiện. Cách nói này tự nhiên trong tiếng Việt, đồng thời giữ ý nghĩa thời điểm bắt đầu sáng.
- source_word: וְהָאֲנָשִׁים
  choice: những người ấy
  rationale: Danh từ xác định chỉ nhóm người đã được nhắc đến trong văn cảnh; “những người ấy” giúp biểu đạt tính xác định tự nhiên trong tiếng Việt.
- source_word: שֻׁלְּחוּ
  choice: được cho đi
  rationale: Giữ thể bị động của động từ Pual שלח và phù hợp với bối cảnh họ được phép rời đi; tránh hàm ý mạnh hơn không cần thiết của “đuổi đi”.
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: cùng với lừa của họ
  rationale: Diễn đạt tự nhiên việc cả những người ấy lẫn lừa của họ đều lên đường, không thêm ý nghĩa ngoài quan hệ phối hợp trong tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. “Vừa khi” nêu bật thời điểm rạng sáng; “được cho đi” bảo toàn thể bị động của nguyên văn.
