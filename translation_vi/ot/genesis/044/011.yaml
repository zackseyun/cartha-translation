  register: Tiếng Việt hiện đại, rõ ràng và trang nghiêm vừa phải. Giữ động từ đầu ở số nhiều (“Họ vội vàng”) theo nguyên văn, rồi dùng “ai nấy” để thể hiện cấu trúc phân phối được lặp lại trong tiếng Hê-bơ-rơ; dấu chú thích đặt sau câu vì liên quan đến toàn bộ cấu trúc hai hành động.
