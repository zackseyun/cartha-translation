  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: vi
  text: Họ vội vàng, ai nấy hạ bao của mình xuống đất rồi mở bao ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn lặp lại cấu trúc “mỗi người ... bao của mình” với cả hai hành động, nhấn mạnh rằng từng người đều hạ và mở chính bao của mình.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: Họ vội vàng
  rationale: Động từ מהר diễn tả hành động khẩn trương; cách dịch này tự nhiên, trang trọng vừa phải và giữ chủ ngữ số nhiều của tiếng Hê-bơ-rơ.
- source_word: וַיּוֹרִדוּ
  choice: hạ ... xuống
  rationale: Dạng Hiphil của ירד mang nghĩa khiến vật đi xuống; trong ngữ cảnh này, họ hạ các bao từ chỗ chuyên chở xuống đất.
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: ai nấy ... bao của mình
  rationale: אִישׁ được dùng theo nghĩa phân phối. “Ai nấy” diễn đạt tự nhiên rằng từng người đều tự xử lý bao của mình.
- source_word: אַמְתַּחַת
  choice: bao
  rationale: Danh từ chỉ bao đựng lương thực hoặc hành lý; “bao” phù hợp bối cảnh chuyên chở ngũ cốc và nhất quán với câu chuyện.
- source_word: אָרְצָה
  choice: xuống đất
  rationale: Dạng có hậu tố chỉ hướng diễn tả chuyển động về phía mặt đất; “xuống đất” giữ rõ cả hướng đi xuống lẫn đích đến.
- source_word: וַיִּפְתְּחוּ
  choice: mở ... ra
  rationale: פתח có nghĩa trực tiếp là mở; “mở ... ra” là cách nói tự nhiên trong tiếng Việt đối với một cái bao.
