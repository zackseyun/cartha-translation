  text: וַ/יְחַפֵּ֕שׂ בַּ/גָּד֣וֹל הֵחֵ֔ל וּ/בַ/קָּטֹ֖ן כִּלָּ֑ה וַ/יִּמָּצֵא֙ הַ/גָּבִ֔יעַ בְּ/אַמְתַּ֖חַת בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: vi
  text: Ông bắt đầu lục soát từ người anh cả và kết thúc ở người em út; chiếc chén[a] được tìm thấy trong bao của Bên-gia-min.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chiếc cốc có chân”. Từ Hê-bơ-rơ có thể chỉ một chiếc chén hoặc cốc có chân.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: lục soát
  rationale: Động từ חפשׂ ở đây chỉ việc khám xét hành lý để tìm đồ vật; “lục soát” tự nhiên và cụ thể hơn “tìm kiếm” trong ngữ cảnh này.
- source_word: בַּגָּדוֹל הֵחֵל
  choice: bắt đầu ... từ người anh cả
  rationale: Trong ngữ cảnh các anh em được xét theo thứ tự tuổi, גָּדוֹל chỉ người lớn tuổi nhất; “anh cả” diễn đạt tự nhiên mối quan hệ gia đình.
- source_word: וּבַקָּטֹן כִּלָּה
  choice: kết thúc ở người em út
  rationale: קָטֹן đối lập với người anh cả và chỉ người trẻ tuổi nhất, còn כִּלָּה đánh dấu điểm kết thúc của cuộc lục soát.
- source_word: וַיִּמָּצֵא
  choice: được tìm thấy
  rationale: Giữ thể bị động của dạng Niphal, không đổi thành chủ động “ông tìm thấy”.
- source_word: הַגָּבִיעַ
  choice: chiếc chén
  rationale: גָּבִיעַ có thể chỉ chén hoặc cốc có chân; “chiếc chén” ngắn gọn, tự nhiên và phù hợp với mạch truyện.
- source_word: בְּאַמְתַּחַת
  choice: trong bao
  rationale: אַמְתַּחַת là bao dùng để đựng lương thực hoặc hàng hóa; “bao” phù hợp với bối cảnh vận chuyển ngũ cốc.
- source_word: בִּנְיָמִן
  choice: Bên-gia-min
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Cặp “anh cả—em út” truyền đạt rõ thứ tự tuổi trong gia đình. Đại từ “ông” giữ chủ ngữ nam số ít hàm ẩn của nguyên văn mà không lặp lại chức danh từ ngữ cảnh trước.
