base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: vi
  text: 'Vì đầy tớ ngài đã đứng ra bảo lãnh cho cậu ấy với cha tôi,[a] rằng: ‘Nếu con không đưa em ấy về với cha, thì con sẽ mắc tội với cha suốt đời.’[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã cam kết chịu trách nhiệm về cậu ấy với cha tôi.” Động từ Hê-bơ-rơ chỉ việc tự nhận trách nhiệm như một người bảo lãnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “thì con sẽ phạm tội với cha suốt đời.” Ý nói Giu-đa sẽ mang tội hoặc chịu lỗi đối với cha mình trọn đời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lời giải thích của Giu-đa, nối câu này với lời khẩn cầu trong văn cảnh.
- source_word: עַבְדְּךָ
  choice: đầy tớ ngài
  rationale: Lối tự xưng khiêm nhường trước bậc trên; giữ sắc thái cung kính mà không nhấn quá mức ý nghĩa nô lệ.
- source_word: עָרַב אֶת הַנַּעַר
  choice: đã đứng ra bảo lãnh cho cậu ấy
  rationale: Diễn đạt việc Giu-đa tự nhận trách nhiệm như người bảo lãnh. “Đứng ra bảo lãnh” tự nhiên trong tiếng Việt và giữ sắc thái cam kết trách nhiệm.
- source_word: הַנַּעַר
  choice: cậu ấy / em ấy
  rationale: Từ này có thể chỉ một người trẻ, không nhất thiết là trẻ nhỏ. Trong lời thuật dùng “cậu ấy”; trong lời nói với cha, “em ấy” thể hiện tự nhiên quan hệ của Giu-đa với Bên-gia-min.
- source_word: מֵעִם אָבִי
  choice: với cha tôi
  rationale: Trong kết cấu với động từ “bảo lãnh”, cụm này chỉ người mà Giu-đa đã đưa ra lời cam kết; “với cha tôi” là cách diễn đạt tự nhiên.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: Nếu con không đưa em ấy về với cha
  rationale: Giữ rõ điều kiện của lời cam kết. Đại từ được điều chỉnh theo lời Giu-đa nói trực tiếp với cha; “đưa ... về” phù hợp với việc đưa Bên-gia-min trở lại.
- source_word: וְחָטָאתִי לְאָבִי
  choice: thì con sẽ mang tội với cha
  rationale: Giữ gần nghĩa “phạm tội/mắc tội” của động từ hơn cách chỉ nói “chịu trách nhiệm”, đồng thời diễn đạt sự mắc lỗi lâu dài trong quan hệ với cha.
- source_word: כָּל הַיָּמִים
  choice: suốt đời
  rationale: Thành ngữ tiếng Việt tự nhiên diễn đạt trách nhiệm và tội lỗi kéo dài trọn đời.
theological_decisions:
- issue: Sắc thái của וְחָטָאתִי
  choice: mang tội với cha
  alternative: chịu trách nhiệm trước cha / mang tiếng có lỗi với cha
  rationale: Bản dịch giữ ngôn ngữ về tội/lỗi vốn có trong tiếng Hê-bơ-rơ, nhưng không xác định thêm đây là phạm trù pháp lý hay giáo lý; văn cảnh nhấn mạnh trách nhiệm của Giu-đa đối với cha.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đầy tớ ngài” giữ phép xưng hô cung kính trong lời Giu-đa nói với Giô-sép; trong câu trích dẫn, “con...cha” tái hiện tự nhiên lời ông nói với cha mình. Mọi dấu chú thích đều xuất hiện trong chính văn.
