  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: vi
  text: 'Chúng tôi thưa với ngài: “Chúng tôi có một người cha già và một người con trai còn trẻ, sinh ra khi cha đã cao tuổi.[a] Anh của cậu ấy đã chết, nên chỉ còn cậu ấy là người con của mẹ mình,[b] và cha cậu ấy yêu thương cậu ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một đứa con nhỏ của tuổi già”; đây là thành ngữ chỉ người con sinh ra khi cha đã cao tuổi.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “chỉ còn một mình cậu ấy cho mẹ mình”, nghĩa là cậu ấy là người con duy nhất của mẹ còn sống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: chúa tôi
  rationale: Lời xưng hô kính trọng dành cho người có địa vị cao hơn; giữ được trật tự xã hội và lối xưng hô lặp lại trong trình thuật, dù tiếng Việt hiện đại có thể thấy trang trọng.
- source_word: זָקֵן
  choice: già
  rationale: Diễn đạt trực tiếp việc người cha đã cao tuổi; tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: một con trai nhỏ sinh ra khi cha đã cao tuổi
  rationale: “Con trai” phù hợp với quan hệ gia đình trong ngữ cảnh; “nhỏ” giữ sắc thái của קָטָן, còn cách diễn đạt “sinh ra khi cha đã cao tuổi” truyền đạt rõ thành ngữ Hê-bơ-rơ “đứa con của tuổi già”.
- source_word: וְאָחִיו מֵת
  choice: Anh của cậu ấy đã chết
  rationale: Diễn đạt tình trạng đã chết với kết quả còn hiệu lực trong hiện tại và phù hợp mạch kể.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: nên chỉ còn một mình cậu ấy là con của mẹ mình
  rationale: 'Làm rõ ý quan hệ của לְאִמּוֹ: cậu là người con duy nhất của mẹ còn lại, đồng thời giữ trọng tâm độc nhất của לְבַדּוֹ.'
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: và cha cậu ấy yêu thương cậu ấy
  rationale: “Yêu thương” là cách diễn đạt tự nhiên, trực tiếp cho tình yêu đặc biệt của người cha dành cho Bên-gia-min.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu. Dùng “chúa tôi” để bảo tồn sắc thái tôn kính và địa vị trong nguyên ngữ; lời thoại dùng “cậu ấy” để tránh lặp “người con trai” quá nặng nề. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
