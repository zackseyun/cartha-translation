  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: vi
  text: 'Thưa ngài, ngài đã hỏi những tôi tớ của ngài rằng: ‘Các ngươi có cha hoặc một người anh em trai không?’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Chúa tôi
  rationale: Cách xưng hô kính trọng của Giu-đa với người cai trị Ai Cập; giữ sắc thái cung kính và số ít của nguyên ngữ.
- source_word: שָׁאַל
  choice: đã hỏi
  rationale: Diễn đạt tự nhiên hành động hỏi trong ngữ cảnh câu hỏi trực tiếp.
- source_word: עֲבָדָיו
  choice: các đầy tớ của ngài
  rationale: Trong lời nói cung kính nơi triều chính, các anh em tự xưng là đầy tớ; cách dịch này không áp đặt nghĩa nô lệ sở hữu trong ngữ cảnh.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dẫn trực tiếp nội dung lời hỏi một cách tự nhiên trong tiếng Việt, thay cho lối dịch sát chữ nhưng nặng nề là ‘mà rằng’.
- source_word: הֲיֵשׁ לָכֶם
  choice: Các ngươi còn ... nào không?
  rationale: Cấu trúc יֵשׁ với ל diễn tả sự hiện hữu hoặc sở hữu. ‘Còn ... nào không?’ tự nhiên trong ngữ cảnh hỏi về người thân đang sống, nhưng không khẳng định thêm tình trạng cụ thể của họ.
- source_word: אָב
  choice: cha
  rationale: Giữ danh từ số ít và cách gọi thân thuộc tự nhiên trong tiếng Việt.
- source_word: אָח
  choice: anh em trai
  rationale: Tiếng Hê-bơ-rơ אָח không phân biệt anh hay em; ‘anh em trai’ bảo toàn sự không xác định ấy và cho biết đây là người nam.
