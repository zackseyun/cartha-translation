translation_notes:
  register: Văn phong hiện đại, trang trọng, thể hiện lời thưa kính cẩn trước người cai trị. Đại từ ‘ngài’ chỉ người được thưa chuyện; ‘các ngươi’ phản ánh lời của vị cai trị đối với nhóm anh em mà không dùng lối quá cổ.
