base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: vi
  text: 'Người quản gia nói: “Được, cứ theo lời các ông. Người nào bị phát hiện có chiếc chén sẽ làm nô lệ cho tôi, còn các ông sẽ không mắc tội.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Người quản gia nói
  rationale: Chủ ngữ được xác định từ ngữ cảnh gần là người quản gia; nêu rõ chủ ngữ giúp tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: גַּם עַתָּה
  choice: Được
  rationale: Trong lời đáp này, cụm từ biểu thị sự chấp thuận trước mắt; “Được” truyền đạt tự nhiên chức năng hội thoại ấy, không gây cảm giác thời gian khó hiểu như dịch máy móc “ngay cả bây giờ”.
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: cứ theo lời các ông
  rationale: Diễn đạt sự tiếp nhận lời đề nghị bằng tiếng Việt tự nhiên. Dấu chấm sau câu giữ khoảng ngắt lớn của bản Hê-bơ-rơ và không khiến hình phạt tiếp theo bị hiểu là lặp nguyên đề nghị ở câu trước.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: Người nào bị phát hiện có chiếc chén
  rationale: Đại từ chỉ vật trong nguyên văn được làm rõ là “chiếc chén” theo ngữ cảnh; cấu trúc này giữ trọng tâm ở việc vật ấy được tìm thấy nơi người đó.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: sẽ làm nô lệ cho tôi
  rationale: עֶבֶד ở đây chỉ địa vị cưỡng bức mang tính trừng phạt, nên “nô lệ” chính xác hơn “đầy tớ”; “làm nô lệ cho tôi” là cách nói tự nhiên trong tiếng Việt.
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: còn các ông sẽ không mắc tội
  rationale: נְקִיִּם chỉ việc không mang tội hoặc trách nhiệm pháp lý. “Không mắc tội” rõ nghĩa trong bối cảnh này, còn “các ông” đối lập với người bị phát hiện có chén.
theological_decisions:
- issue: Mức độ người quản gia chấp thuận đề nghị trước đó
  choice: Tách lời chấp thuận và phán quyết bằng dấu chấm
  alternative: Dùng dấu hai chấm, khiến phần sau có vẻ là nội dung nguyên vẹn của lời đề nghị
  rationale: 'Athnah sau הוּא tạo một khoảng ngắt chính. Cách chấm câu này giữ được căng thẳng của lời nói: ông chấp thuận theo nghĩa chung nhưng sau đó chỉ bắt người có chén làm nô lệ, còn những người khác được miễn trách nhiệm.'
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” phù hợp lời người quản gia nói với một nhóm đàn ông; chọn “nô lệ” để phản ánh địa vị cưỡng bức trong hình phạt.
