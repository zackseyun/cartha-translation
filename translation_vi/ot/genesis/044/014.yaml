base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: vi
  text: Giu-đa cùng các anh em của ông vào nhà Giô-sép. Giô-sép vẫn còn ở đó, và họ sấp mình xuống đất trước mặt ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “họ ngã xuống đất trước mặt ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vào
  rationale: Động từ בוא ở dạng kể chuyện đưa trình thuật tiến tới; kết hợp với בֵּיתָה, “vào nhà” diễn đạt tự nhiên hướng chuyển động đến và vào trong nhà.
- source_word: יְהוּדָה וְאֶחָיו
  choice: Giu-đa cùng các anh em mình
  rationale: Giữ Giu-đa ở vị trí nổi bật trong nhóm, đồng thời diễn đạt tự nhiên rằng những người đi cùng là anh em của ông.
- source_word: בֵּיתָה יוֹסֵף
  choice: nhà Giô-sép
  rationale: Dạng chỉ hướng בֵּיתָה cho biết chuyển động hướng đến nhà; đi với “vào” tạo thành cách diễn đạt tiếng Việt tự nhiên.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: Giô-sép vẫn còn ở đó
  rationale: עוֹדֶנּוּ diễn tả trạng thái tiếp diễn, nên “vẫn còn” vừa rõ nghĩa vừa tự nhiên. Lặp tên Giô-sép giúp tránh sự mơ hồ đại từ trong tiếng Việt.
- source_word: וַיִּפְּלוּ ... אָרְצָה
  choice: họ sấp mình xuống đất
  rationale: Cụm từ theo nghĩa sát là “họ ngã xuống đất”, nhưng trong ngữ cảnh diện kiến người có quyền, hành động này biểu thị sự phủ phục. “Sấp mình xuống đất” giữ được cả chuyển động thân thể lẫn sắc thái tôn kính mà không diễn giải quá mức.
- source_word: לְפָנָיו
  choice: trước mặt ông
  rationale: Đây là cách diễn đạt tự nhiên của thành ngữ Hê-bơ-rơ mang nghĩa ở trước mặt hoặc trong sự hiện diện của một người.
theological_decisions:
- issue: Ý nghĩa của hành động ngã xuống đất trước Giô-sép
  choice: sấp mình xuống đất
  alternative: ngã xuống đất
  rationale: Bản văn mô tả một cử chỉ phục tùng hoặc tôn kính trước người có quyền, không nhất thiết là hành vi thờ phượng. Bản dịch chính diễn đạt tư thế ấy, còn chú thích giữ lại nghĩa từ vựng sát hơn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho Giô-sép để phù hợp ngữ cảnh xã hội; tách mệnh đề chỉ hoàn cảnh thành câu riêng nhằm làm rõ Giô-sép đang hiện diện khi họ phủ phục.
