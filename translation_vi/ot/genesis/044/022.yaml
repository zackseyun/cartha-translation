  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: vi
  text: 'Chúng tôi thưa với ngài: “Cậu ấy không thể rời cha mình; nếu cậu ấy rời cha mình, cha cậu ấy sẽ chết.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “và cậu ấy rời cha mình, rồi người ấy chết.” Tiếng Hê-bơ-rơ không nêu rõ chủ thể của động từ “chết”; ngữ cảnh cho thấy đó là người cha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Chúng tôi thưa
  rationale: Động từ wayyiqtol ngôi thứ nhất số nhiều tiếp nối mạch kể. “Thưa” diễn đạt tự nhiên lời nói kính cẩn của Giu-đa với Giô-sép.
- source_word: אֶל אֲדֹנִי
  choice: với chúa tôi
  rationale: אֲדֹנִי là lối xưng hô kính trọng trong bối cảnh triều đình; “chúa tôi” giữ sắc thái tôn kính mà không đồng nhất với danh xưng thần linh.
- source_word: לֹא יוּכַל
  choice: không thể
  rationale: Diễn đạt trực tiếp sự không có khả năng, tự nhiên trong tiếng Việt hiện đại.
- source_word: הַנַּעַר
  choice: cậu ấy
  rationale: נַעַר có thể chỉ một thiếu niên hoặc người nam trẻ tuổi. Trong lời nói mang sắc thái gia đình này, “cậu ấy” tự nhiên và tránh xác định tuổi quá chính xác.
- source_word: לַעֲזֹב
  choice: rời
  rationale: עָזַב ở đây là rời xa hoặc để lại, không nhất thiết mang nghĩa đạo đức là ruồng bỏ.
- source_word: אָבִיו
  choice: cha mình
  rationale: Dịch cấu trúc sở hữu theo cách tự nhiên trong tiếng Việt; lần xuất hiện thứ hai được diễn đạt tương ứng trong mệnh đề điều kiện.
- source_word: וְעָזַב
  choice: nếu cậu ấy rời
  rationale: Liên từ cùng thể động từ trong ngữ cảnh mang giá trị điều kiện; “nếu” làm rõ quan hệ cú pháp bằng tiếng Việt mà không thêm nội dung.
- source_word: וָמֵת
  choice: cha cậu sẽ chết
  rationale: Động từ ngôi thứ ba giống đực số ít không nêu chủ thể. Ngữ cảnh gần và phần tiếp theo của lời Giu-đa cho thấy người chết là người cha; bản dịch nêu rõ để tiếng Việt không mơ hồ ngoài ý muốn, đồng thời ghi chú dạng sát chữ.
theological_decisions:
- issue: Chủ thể hàm ẩn của וָמֵת (“sẽ chết”)
  choice: 'Nêu rõ là người cha: “cha cậu sẽ chết”'
  alternative: “cậu ấy sẽ chết” hoặc giữ đại từ “người ấy sẽ chết”
  rationale: Tiếng Hê-bơ-rơ không nêu danh từ làm chủ thể, nhưng ngữ cảnh trong Sáng Thế Ký 44:22 và 44:31 hướng đến người cha sẽ chết vì đau buồn. Chú thích bảo tồn hình thức và độ mơ hồ ngữ pháp của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” và “chúa tôi” để giữ phép xưng hô kính cẩn; tránh từ cổ “cậu bé” theo nghĩa tuổi tác tuyệt đối và tránh “ruồng bỏ,” vốn thêm sắc thái đạo đức không có trong ngữ cảnh.
