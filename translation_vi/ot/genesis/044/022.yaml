  to: 'Chúng tôi thưa với ngài: “Cậu ấy không thể rời cha mình; nếu cậu ấy rời cha mình, cha cậu ấy sẽ chết.”[a]'
  rationale: Sửa cách xưng hô thành “ngài” để giữ sự kính trọng của nguyên văn trong tiếng Việt hiện đại mà không gợi danh xưng thần linh. Giữ mệnh đề điều kiện và nêu rõ “cha cậu ấy” theo ngữ cảnh, đồng thời chú thích bảo lưu sự không nêu rõ chủ thể trong tiếng Hê-bơ-rơ. Dời neo chú thích đến điểm được chú giải.
