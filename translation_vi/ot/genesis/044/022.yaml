    issue: “chúa tôi” không tự nhiên và có thể gợi danh xưng thần linh.
    rationale: אֲדֹנִי là lối xưng hô tôn kính dành cho Joseph; trong tiếng Việt hiện đại, “thưa ngài” là tương đương tự nhiên và chính xác hơn về ngữ dụng.
  - severity: low
    issue: Dấu neo chú thích không nằm tại từ/cụm từ đang được chú giải.
    rationale: Chú thích giải thích chủ thể không nêu rõ của “chết”; đặt [a] sau “chết” cho thấy rõ phạm vi chú giải.
