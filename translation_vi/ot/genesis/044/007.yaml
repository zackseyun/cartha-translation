  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: vi
  text: 'Họ thưa với ông: “Thưa ngài[a], tại sao ngài lại nói những lời như thế? Các đầy tớ[b] của ngài quyết không làm việc như vậy!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chủ tôi”; đây là cách xưng hô kính trọng dành cho một người.'
    reason: lexical_alternative
  - marker: b
    text: “Đầy tớ” là cách tự xưng khiêm nhường của người dưới quyền trong bối cảnh triều đình.
    reason: register_and_historical_context
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Họ thưa với ông
  rationale: Động từ אמר mở đầu lời đáp trong mạch kể. “Thưa” diễn đạt tự nhiên thái độ kính trọng của những người anh em đối với viên quản gia, còn “với ông” giữ đại từ chỉ người của אֵלָיו.
- source_word: לָמָּה יְדַבֵּר אֲדֹנִי
  choice: Tại sao chúa tôi lại nói
  rationale: “Tại sao ... lại nói” là câu hỏi tự nhiên trong tiếng Việt và giữ sắc thái phản đối, kinh ngạc. אֲדֹנִי là cách xưng hô kính trọng dành cho một người, nên dịch là “chúa tôi”, không phải danh xưng thần linh.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: những lời như thế
  rationale: Giữ nghĩa cụ thể của דְּבָרִים là những lời vừa được nói, đồng thời diễn đạt tự nhiên cấu trúc so sánh כַּ־.
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: Các đầy tớ của ngài quyết không thể
  rationale: חָלִילָה là lời dứt khoát bác bỏ một hành vi bị xem là không thể chấp nhận. Cách dịch này truyền đạt cường độ phủ nhận tự nhiên trong tiếng Việt mà không thêm sự viện dẫn đến trời hay thần linh.
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: làm một việc như vậy
  rationale: Diễn đạt thành ngữ tự nhiên trong tiếng Việt, chỉ về hành vi bị cáo buộc và giữ lực chỉ định của הַזֶּה.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” cùng các cách xưng hô “chúa tôi”, “đầy tớ của ngài” duy trì phép nói khiêm nhường trong bối cảnh quyền bính tại triều đình. Dấu chấm than thể hiện sức mạnh của חָלִילָה.
