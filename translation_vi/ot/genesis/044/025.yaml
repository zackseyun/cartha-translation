  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: vi
  text: 'Bấy giờ cha chúng tôi nói: “Hãy trở lại, mua cho chúng ta một ít lương thực.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên quan hệ tuần tự trong tiếng Việt.
- source_word: אָבִינוּ
  choice: cha chúng tôi
  rationale: Trong ngữ cảnh, từ này chỉ Gia-cốp, người cha trực tiếp của các anh em.
- source_word: שֻׁבוּ
  choice: Hãy trở lại
  rationale: Mệnh lệnh của שׁוב yêu cầu họ quay lại để thực hiện chuyến đi thêm một lần nữa; “trở lại” vừa rõ hướng vừa trang trọng tự nhiên.
- source_word: שִׁבְרוּ
  choice: mua
  rationale: Trong trình thuật về Giô-sép, động từ שבר thường nói đến việc mua lương thực hoặc ngũ cốc. Vì אֹכֶל xuất hiện ngay sau đó, “mua” là đủ và không thu hẹp nghĩa.
- source_word: לָנוּ
  choice: cho chúng ta
  rationale: Diễn đạt rõ sắc thái thụ hưởng của giới từ ל trong lời người cha nói với các con, trong đó người nói thuộc nhóm được hưởng lợi.
- source_word: מְעַט
  choice: một ít
  rationale: Giữ đúng ý chỉ số lượng nhỏ và phù hợp cách nói tự nhiên trong tiếng Việt.
- source_word: אֹכֶל
  choice: lương thực
  rationale: אֹכֶל là danh từ tổng quát chỉ thức ăn. “Lương thực” tự nhiên trong bối cảnh mua thực phẩm dự trữ mà không thu hẹp cụ thể thành ngũ cốc.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Lời truyền khiến được diễn đạt bằng “Hãy”; “chúng ta” giữ góc nhìn bao gồm người cha trong nhóm thụ hưởng. Không thêm chú thích vì bản dịch chính giữ được nghĩa rộng của אֹכֶל.
