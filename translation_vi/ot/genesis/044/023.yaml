    issue: “xuống đây” thêm từ “đây” ngoài nguyên văn.
    rationale: יִרְדֶּה chỉ diễn đạt việc “xuống”; góc nhìn quy chiếu tại Ai Cập có thể được suy ra từ ngữ cảnh nhưng không cần được bổ sung trong bản văn tiếng Việt.
  - severity: low
    issue: Cụm sở hữu “các đầy tớ ngài” có thể gây lửng hoặc kém tự nhiên.
    rationale: “Các đầy tớ của ngài” diễn đạt quan hệ sở hữu minh bạch hơn mà không thay đổi nghĩa.
