base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: vi
  text: 'Ngài đã nói với các đầy tớ của ngài rằng: “Nếu em út của các ngươi không xuống cùng các ngươi, các ngươi sẽ không còn được thấy mặt ta[a] nữa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói theo nghĩa thành ngữ: “các ngươi sẽ không được đến trình diện trước mặt ta nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ngài đã nói
  rationale: Động từ wayyiqtol của אמר tiếp nối mạch thuật chuyện; thì quá khứ tự nhiên trong tiếng Việt. Đại từ “Ngài” phù hợp với lời Giu-đa kính cẩn thưa với Giô-sép.
- source_word: עֲבָדֶיךָ
  choice: các đầy tớ ngài
  rationale: עבד có thể chỉ nô lệ hoặc đầy tớ; trong lời thưa mang tính cung đình ở đây, “đầy tớ” giữ được lối tự xưng khiêm nhường mà không nhấn mạnh tình trạng nô lệ.
- source_word: אִם לֹא
  choice: Nếu ... không
  rationale: Giữ rõ cấu trúc điều kiện phủ định của tiếng Hê-bơ-rơ, thay vì chuyển thành “trừ khi”.
- source_word: יֵרֵד
  choice: xuống đây
  rationale: Giữ nét nghĩa phương hướng “xuống” của ירד và thêm “đây” để thể hiện góc nhìn của người đang ở Ai Cập một cách tự nhiên trong tiếng Việt.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: em út của các ngươi
  rationale: Trong ngữ cảnh các anh em, הַקָּטֹן chỉ người nhỏ tuổi nhất; “em út” tự nhiên và chính xác hơn “em nhỏ” hoặc “em trai trẻ hơn”.
- source_word: אִתְּכֶם
  choice: cùng các ngươi
  rationale: Diễn đạt trực tiếp ý đồng hành của אֵת, phù hợp với văn phong trang trọng.
- source_word: לֹא תֹסִפוּן
  choice: sẽ không còn ... nữa
  rationale: Cấu trúc יסף + động từ nguyên mẫu diễn tả việc không tiếp tục hoặc không tái diễn; “không còn ... nữa” là cách nói tự nhiên trong tiếng Việt.
- source_word: לִרְאוֹת פָּנָי
  choice: được thấy mặt ta
  rationale: Giữ hình ảnh sát nghĩa “thấy mặt ta”, đồng thời “được” thể hiện rằng họ không được phép hoặc không có cơ hội yết kiến nữa; nghĩa thành ngữ được nêu trong chú thích.
