base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: vi
  text: Bấy giờ, họ xé áo mình[a]. Mỗi người chất đồ lên lừa của mình, rồi họ trở về thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “y phục mình.” Từ Hê-bơ-rơ có thể chỉ chung quần áo, nhất là áo ngoài.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: họ xé
  rationale: Động từ קרע chỉ hành động xé áo, trong ngữ cảnh này biểu lộ sự đau buồn, bàng hoàng hoặc khốn quẫn; “xé” là cách diễn đạt tự nhiên và giữ nguyên hành động cụ thể.
- source_word: שִׂמְלֹתָם
  choice: áo mình
  rationale: שִׂמְלָה có thể chỉ y phục nói chung, đặc biệt là áo ngoài. Trong thành ngữ tiếng Việt “xé áo mình,” “áo” tự nhiên hơn “y phục” mà vẫn truyền đạt đúng ý.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: Mỗi người chất đồ lên lừa của mình
  rationale: עמס có nghĩa là chất hoặc đặt vật nặng lên. אִישׁ mang nghĩa phân phối “mỗi người”; “chất đồ” diễn đạt tự nhiên hành động chất lại hành lý hoặc hàng hóa lên lừa mà không xác định quá mức vật được chất.
- source_word: אִישׁ
  choice: mỗi người
  rationale: Danh từ số ít được dùng theo nghĩa phân phối. “Mỗi người” tự nhiên trong tiếng Việt và phù hợp với nhóm các anh em trong ngữ cảnh.
- source_word: חֲמֹרוֹ
  choice: lừa của mình
  rationale: חֲמוֹר là từ thông thường chỉ con lừa; cấu trúc “của mình” thể hiện quan hệ sở hữu phân phối rõ ràng trong tiếng Việt.
- source_word: וַיָּשֻׁבוּ
  choice: họ trở về
  rationale: שׁוּב có nghĩa là quay lại hoặc trở về; “trở về” phù hợp với văn phong tường thuật trang trọng, tự nhiên.
- source_word: הָעִירָה
  choice: về thành
  rationale: Hậu tố chỉ hướng ה־ biểu thị chuyển động hướng đến thành. “Về thành” diễn đạt gọn và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “bấy giờ” để nối diễn tiến câu chuyện; giữ thành ngữ cụ thể “xé áo” và ý nghĩa phân phối của “mỗi người.”
