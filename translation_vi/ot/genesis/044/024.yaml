  text: וַ/יְהִי֙ כִּ֣י עָלִ֔ינוּ אֶֽל עַבְדְּ/ךָ֖ אָבִ֑/י וַ/נַּ֨גֶּד ל֔/וֹ אֵ֖ת דִּבְרֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: vi
  text: Khi chúng tôi đã đi lên đến chỗ cha tôi, đầy tớ của ngài[a], chúng tôi đã thuật lại cho ông những lời của chủ tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát thứ tự từ trong tiếng Hê-bơ-rơ: “đến đầy tớ của ngài, cha tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Khi
  rationale: Công thức tự sự dẫn vào sự việc kế tiếp; tiếng Việt tự nhiên chỉ cần “Khi”, vì mạch nối đã rõ trong ngữ cảnh.
- source_word: עָלִינוּ
  choice: chúng tôi đi lên
  rationale: 'Giữ nghĩa cơ bản của עלה và góc nhìn địa lý: từ Ai Cập đi lên Ca-na-an.'
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: gặp cha tôi, là đầy tớ ngài
  rationale: “Gặp” diễn đạt tự nhiên hướng đến một người trong tiếng Việt; đảo phần đồng vị để câu rõ nghĩa, đồng thời vẫn giữ cách Giu-đa khiêm nhường gọi cha mình là đầy tớ của người nghe.
- source_word: וַנַּגֶּד לוֹ
  choice: chúng tôi đã thuật lại cho ông
  rationale: נגד ở thể Hiphil mang nghĩa cho biết hoặc thuật lại. “Thuật lại” phù hợp vì họ truyền đạt lời đã nghe; “cho ông” thể hiện rõ đối tượng là người cha.
- source_word: אֵת דִּבְרֵי אֲדֹנִי
  choice: những lời của chúa tôi
  rationale: Giữ sát số nhiều “những lời” và tước xưng kính trọng אֲדֹנִי dành cho một người có địa vị, không phải danh xưng thần linh.
theological_decisions:
- issue: Cách hiểu אֲדֹנִי
  choice: chúa tôi
  alternative: chủ tôi; ngài
  rationale: Trong ngữ cảnh, đây là tước xưng kính trọng dành cho Giô-sép. “Chúa tôi” bảo tồn sắc thái quy phục của nguyên văn mà không đồng nhất với danh Đức Chúa Trời; viết thường để làm rõ đây là tước hiệu của con người.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Cụm “cha tôi, là đầy tớ ngài” tự nhiên hơn trong tiếng Việt so với việc giữ nguyên thứ tự từ Hê-bơ-rơ, còn chú thích bảo tồn cấu trúc gốc và sắc thái kính cẩn.
