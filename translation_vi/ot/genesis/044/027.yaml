    rationale: 'Tiếng Hê-bơ-rơ có cách xưng danh appositionally: “đầy tớ của ngài, cha tôi.” Đổi thành “Cha tôi, đầy tớ của ngài, đã nói...” giúp tiếng Việt rõ ràng, tự nhiên, và vẫn giữ nguyên quan hệ kính cẩn.'
