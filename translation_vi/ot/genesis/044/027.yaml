  yaml_path: translation/ot/genesis/044/027.yaml
  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: vi
  text: 'Bấy giờ, cha tôi, đầy tớ của ngài, đã nói với chúng tôi: ‘Các con biết rằng vợ ta đã sinh cho ta hai con trai.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “đã sinh cho ta hai.” Từ “con trai” được hiểu theo ngữ cảnh và được nói rõ trong bản dịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” tạo mạch kể tự nhiên và vẫn giữ sắc thái tuần tự.
- source_word: עַבְדְּךָ אָבִי
  choice: cha tôi, là đầy tớ ngài
  rationale: Giữ cả cách Giu-đa kính cẩn tự hạ khi thưa với Giô-sép lẫn việc xác định người được nói đến là cha mình.
- source_word: אֵלֵינוּ
  choice: với chúng tôi
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho lời nói hướng đến một nhóm người.
- source_word: אַתֶּם יְדַעְתֶּם
  choice: Các con biết
  rationale: Đại từ số nhiều được thể hiện rõ; trong lời của người cha nói với các con, “các con” tự nhiên và bảo toàn quan hệ xưng hô. Thì hiện tại diễn đạt điều họ vẫn biết.
- source_word: כִּי
  choice: rằng
  rationale: Ở đây כִּי dẫn vào nội dung được biết.
- source_word: שְׁנַיִם
  choice: hai con trai
  rationale: Tiếng Hê-bơ-rơ chỉ nói “hai”; ngữ cảnh cho thấy đó là hai con trai, nên danh từ được bổ sung để tiếng Việt rõ và tự nhiên.
- source_word: יָלְדָה לִּי
  choice: đã sinh cho ta
  rationale: Giữ ý sinh con cho người nói và diễn đạt hành động đã xảy ra một cách tự nhiên.
- source_word: אִשְׁתִּי
  choice: vợ ta
  rationale: Trong ngữ cảnh, אִשָּׁה kèm hậu tố ngôi thứ nhất rõ ràng có nghĩa là “vợ ta”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Cặp xưng hô “ngài/tôi” thể hiện lời Giu-đa kính cẩn với Giô-sép; “ta/các con” phù hợp với lời người cha nói cùng các con. Dấu chú thích [a] được đặt ngay sau câu trích dẫn mà chú thích giải thích.
