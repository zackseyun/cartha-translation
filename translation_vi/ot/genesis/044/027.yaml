revisions:
- from: 'Bấy giờ, cha tôi, là đầy tớ ngài, nói với chúng tôi: ‘Các con biết rằng vợ ta đã sinh cho ta hai con trai.’[a]'
  to: 'Bấy giờ, cha tôi, đầy tớ của ngài, đã nói với chúng tôi: ‘Các con biết rằng vợ ta đã sinh cho ta hai con trai.’[a]'
  rationale: 'Chỉ điều chỉnh cách diễn đạt cụm xưng danh để tiếng Việt hiện đại rõ và tự nhiên hơn: cha của Giu-đa được gọi là “đầy tớ của ngài.” Không thay đổi nội dung, quan hệ xưng hô, hay phần làm rõ có chú thích về “hai con trai.”'
