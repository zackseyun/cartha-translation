base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: vi
  text: 'Giu-đa nói: “Chúng tôi còn biết nói gì với ngài? Biết thưa điều gì? Hay làm sao biện minh cho mình được?[a] Đức Chúa Trời đã phơi bày tội lỗi[b] của các tôi tớ ngài. Này, chúng tôi là nô lệ của ngài[c], cả chúng tôi lẫn người mà chiếc chén được tìm thấy trong tay người ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm sao chứng tỏ mình là đúng?” Động từ Hê-bơ-rơ có thể chỉ việc chứng tỏ mình đúng hoặc tự biện minh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã tìm ra tội trạng” hoặc “đã vạch trần sự gian ác”. Từ Hê-bơ-rơ có thể chỉ điều gian ác, tình trạng mắc tội hoặc hậu quả phải gánh vì tội.'
    reason: lexical_alternative
  - marker: c
    text: Ở câu trước, “tôi tớ” là lối tự xưng kính cẩn trước người có địa vị cao hơn; còn “nô lệ” ở đây nói đến thân phận lệ thuộc mà các anh em xin nhận.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: với ngài / của ngài
  rationale: Trong ngữ cảnh này, אָדוֹן chỉ Giô-sép ở địa vị cầm quyền, không phải danh xưng dành cho Đức Chúa Trời. “Ngài” truyền đạt lời xưng hô kính cẩn một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: מַה נֹּאמַר ... מַה נְּדַבֵּר
  choice: Chúng tôi còn biết nói gì ...? Biết thưa điều gì?
  rationale: Hai động từ gần nghĩa tạo nên nhịp điệp và diễn tả sự bất lực của Giu-đa. “Thưa” ở câu thứ hai vừa phân biệt sắc thái vừa phù hợp với lời nói trước người có thẩm quyền.
- source_word: וּמַה נִּצְטַדָּק
  choice: Hay làm sao biện minh cho mình được?
  rationale: Dạng hitpael của צדק có nghĩa chứng tỏ mình đúng hoặc tự biện minh. Cách dịch này giữ được sắc thái pháp lý mà vẫn tự nhiên.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong mạch truyện Sáng Thế Ký, từ này chỉ Đức Chúa Trời duy nhất; mạo từ và ngữ cảnh không ủng hộ cách hiểu số nhiều hay bất định.
- source_word: מָצָא אֶת עֲוֺן
  choice: đã phơi bày tội lỗi
  rationale: Thành ngữ diễn tả việc lỗi lầm kín giấu bị Đức Chúa Trời phát hiện và đưa ra ánh sáng, chứ không chỉ đơn giản là thấy một hành vi.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: các tôi tớ ngài / nô lệ của ngài
  rationale: Lần đầu là lối tự xưng khiêm nhường trước bề trên; lần sau nói đến thân phận bị lệ thuộc mà họ tự nguyện nhận, nên dùng “nô lệ” để giữ sự khác biệt theo ngữ cảnh.
- source_word: הִנֶּנּוּ
  choice: Này, chúng tôi đều là
  rationale: “Này” giữ chức năng trình hiện của הִנֵּה, còn toàn cụm diễn tả việc họ tự nộp mình làm nô lệ.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: cả chúng tôi lẫn người bị tìm thấy chiếc chén trong tay
  rationale: Cặp גַּם ... גַּם bao gồm cả nhóm anh em lẫn riêng người giữ chén; “trong tay” giữ sát hình ảnh và sắc thái phát hiện trong nguyên văn.
- source_word: הַגָּבִיעַ
  choice: chiếc chén
  rationale: “Chiếc chén” là cách gọi phổ thông, tự nhiên, không thêm sắc thái trang sức vốn không bắt buộc trong danh từ Hê-bơ-rơ.
theological_decisions:
- issue: Đối tượng của אֱלֹהִים trong lời thú nhận của Giu-đa
  choice: Giu-đa quy việc phơi bày tội lỗi của họ cho chính Đức Chúa Trời.
  alternative: Một thần linh nói chung đã phát hiện việc làm sai trái của họ.
  rationale: Ngữ cảnh rộng của Sáng Thế Ký và lời thú nhận của Giu-đa cho thấy đây là Đức Chúa Trời duy nhất, Đấng đưa lỗi lầm kín giấu của các anh em ra ánh sáng.
- issue: Phạm vi của עֲוֺן
  choice: Giữ nghĩa rộng là “tội lỗi”, không xác định đó chỉ là vụ chiếc chén.
  alternative: Hiểu là tội lấy cắp chiếc chén đang bị cáo buộc.
  rationale: Giu-đa có thể nhìn nhận sự việc hiện tại như việc Đức Chúa Trời phơi bày lỗi lầm sâu xa từ trước của các anh em. Bản dịch không nên thu hẹp sự mơ hồ đầy ý nghĩa này vào riêng cáo buộc hiện tại.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Ngài” được dùng cho Giô-sép để tránh khiến độc giả hiểu lầm danh xưng này là thần danh, trong khi “thưa” thể hiện rõ thái độ kính cẩn. Nhịp ba câu hỏi được giữ lại, và sự chuyển từ “tôi tớ” sang “nô lệ” được bảo tồn vì có ý nghĩa trong diễn tiến lời nói.
