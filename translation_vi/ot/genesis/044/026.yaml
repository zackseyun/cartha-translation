  text: וַ/נֹּ֕אמֶר לֹ֥א נוּכַ֖ל לָ/רֶ֑דֶת אִם יֵשׁ֩ אָחִ֨י/נוּ הַ/קָּטֹ֤ן אִתָּ֨/נוּ֙ וְ/יָרַ֔דְנוּ כִּי לֹ֣א נוּכַ֗ל לִ/רְאוֹת֙ פְּנֵ֣י הָ/אִ֔ישׁ וְ/אָחִ֥י/נוּ הַ/קָּטֹ֖ן אֵינֶ֥/נּוּ אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: vi
  text: 'Nhưng chúng tôi thưa: “Chúng tôi không thể xuống đó. Nếu em út đi cùng chúng tôi thì chúng tôi sẽ xuống, vì chúng tôi không thể gặp mặt người ấy nếu em út không đi cùng chúng tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Nhưng chúng tôi thưa
  rationale: Liên từ וַ tiếp nối lời thuật lại nhưng trong ngữ cảnh có sắc thái đối lập với yêu cầu trước đó. “Thưa” tự nhiên trong lời của Giu-đa khi nhắc lại cách họ nói với cha, đồng thời vẫn chuyển tải động từ אמר.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: Chúng tôi không thể xuống đó
  rationale: יכל diễn tả khả năng; ירד nghĩa đen là “đi xuống”, phù hợp với hành trình từ Ca-na-an xuống Ai Cập. Thêm “đó” giúp câu tiếng Việt tự nhiên mà không thay đổi đích đến đã rõ trong ngữ cảnh.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ
  choice: Nếu em út đi cùng chúng tôi
  rationale: Giữ cấu trúc điều kiện tích cực אִם của tiếng Hê-bơ-rơ. הַקָּטֹן trong quan hệ gia đình chỉ người em nhỏ tuổi nhất; “em út” là cách nói tiếng Việt chính xác và tự nhiên. “Đi cùng” hợp với ngữ cảnh hành trình hơn cách dịch cứng “ở với”.
- source_word: וְיָרַדְנוּ
  choice: thì chúng tôi sẽ xuống
  rationale: Mệnh đề này nêu kết quả của điều kiện; cặp “nếu… thì…” thể hiện rõ quan hệ ấy trong tiếng Việt và giữ ý tương lai theo ngữ cảnh.
- source_word: כִּי
  choice: vì
  rationale: כִּי đưa ra lý do cho lời từ chối; “vì” là liên từ nguyên nhân tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: gặp mặt người ấy
  rationale: Cụm nghĩa đen “thấy mặt người đàn ông” là thành ngữ chỉ việc đến trình diện hoặc vào gặp người đó. “Gặp mặt người ấy” giữ được hình ảnh “mặt” phần nào nhưng tránh lối diễn đạt gượng trong tiếng Việt.
- source_word: הָאִישׁ
  choice: người ấy
  rationale: הָאִישׁ đơn giản là “người đàn ông/người ấy”, chỉ Giô-sép; không thêm chức danh mà nguyên văn không có.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: nếu em út không đi cùng chúng tôi
  rationale: Dù tiếng Hê-bơ-rơ nối mệnh đề bằng וְ, ý nghĩa trong câu là hoàn cảnh điều kiện khiến họ không thể gặp người ấy. Dùng “nếu” diễn đạt quan hệ này rõ ràng và tự nhiên.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ hai bước tu từ của nguyên văn: trước hết là lời khẳng định không thể đi xuống, sau đó là điều kiện duy nhất để họ đi. Không có vấn đề thần học chuyên biệt trong câu này.'
