base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: vi
  text: Này, số bạc chúng tôi đã tìm thấy ở miệng các bao của chúng tôi[a], chúng tôi đã đem từ xứ Ca-na-an trả lại cho ông. Vậy làm sao chúng tôi có thể lấy trộm bạc hay vàng từ nhà của chủ ông được?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói theo nghĩa đen là “ở miệng các bao”, chỉ phần mở hoặc phía trên của bao.
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: Kìa
  rationale: Tiểu từ thu hút sự chú ý và nhấn mạnh lời biện luận; “Kìa” giữ được sắc thái khẩn thiết mà vẫn trang trọng, dễ hiểu.
- source_word: כֶּסֶף
  choice: bạc
  rationale: Nghĩa đen là “bạc”; trong ngữ cảnh đây là tiền bằng bạc. Giữ “bạc” bảo toàn cách diễn đạt cụ thể và sự đối ứng với “vàng” ở cuối câu.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: nơi miệng các bao của mình
  rationale: Giữ hình ảnh Hê-bơ-rơ “ở miệng bao”, tức phần mở phía trên của bao; “các bao” phù hợp với bao đựng ngũ cốc trong trình thuật.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: chúng tôi đã ... đem trả lại cho ông
  rationale: Thể Hiphil của שוב diễn tả việc làm cho vật trở về; “đem trả lại” tự nhiên trong tiếng Việt và nêu rõ số bạc được hoàn trả.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: từ xứ Ca-na-an
  rationale: Cách gọi địa lý tự nhiên, trang trọng; “xứ” diễn đạt אֶרֶץ phù hợp trong văn cảnh cổ.
- source_word: וְאֵיךְ נִגְנֹב
  choice: Vậy làm sao chúng tôi có thể lấy trộm
  rationale: Câu hỏi tu từ suy luận từ hành động trước đó; “Vậy” thể hiện quan hệ lập luận, còn “có thể” truyền đạt sắc thái tình thái của dạng chưa hoàn thành trong ngữ cảnh.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: từ nhà của chủ ông
  rationale: אֲדֹנֶיךָ chỉ người chủ của viên quản gia, không phải danh xưng thần linh. “Nhà” giữ cách nói nguyên bản, có thể bao hàm dinh cơ hay gia sản.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: bạc hay vàng
  rationale: Giữ nguyên cặp kim loại cụ thể trong tiếng Hê-bơ-rơ và lặp lại “bạc” để củng cố lập luận của các anh em.
