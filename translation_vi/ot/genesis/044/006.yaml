  yaml_path: translation/ot/genesis/044/006.yaml
  text: He caught up with them and spoke these words to them:[a]
translation:
  language: vi
  text: Ông đuổi kịp họ và nói với họ những lời này:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông bắt kịp họ và nói với họ những lời này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: Ông đuổi kịp họ
  rationale: Động từ נשׂג ở thể Hifil, kèm hậu tố ngôi ba số nhiều, diễn tả việc người quản gia theo sau rồi bắt kịp họ trên đường. “Đuổi kịp” tự nhiên trong tiếng Việt và giữ rõ bối cảnh truy đuổi.
- source_word: וַיְדַבֵּר
  choice: và nói
  rationale: דבר có nghĩa là “nói, phán, phát biểu”. Trong tiếng Việt, “nói ... những lời này” là cách diễn đạt tự nhiên hơn “phát biểu những lời này”, đồng thời vẫn giữ được cấu trúc dẫn nhập lời nói.
- source_word: אֲלֵהֶם
  choice: với họ
  rationale: Giới từ אֶל chỉ hướng lời nói đến những người anh em. Trong kết hợp tiếng Việt “nói với họ”, cách dịch này chính xác và tự nhiên.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: những lời này
  rationale: Cụm từ có nghĩa đen là “những lời này” và dẫn vào lời nói trực tiếp ở câu kế tiếp; bản dịch giữ sát hình thức Hê-bơ-rơ mà vẫn trang trọng, dễ hiểu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” nối tự nhiên với người quản gia được nhắc đến trong ngữ cảnh trước; “đuổi kịp” thể hiện cả chuyển động theo sau lẫn việc đến được chỗ họ.
