  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: vi
  text: Vậy bây giờ, xin cho đầy tớ ngài ở lại thay cho cậu ấy, làm nô lệ cho ngài; còn cậu ấy hãy đi lên cùng các anh mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đi lên” là cách nói thông dụng về hành trình từ Ai Cập hướng về Ca-na-an.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả sắc thái liên kết và lực chuyển ý, mở đầu lời khẩn cầu cao trào của Giu-đa một cách tự nhiên.
- source_word: יֵשֶׁב נָא
  choice: xin cho ... ở lại
  rationale: Dạng cầu khiến đi với נָא diễn đạt lời thỉnh cầu lễ phép; trong ngữ cảnh này, ישׁב là ở lại thay Bên-gia-min.
- source_word: עַבְדְּךָ
  choice: đầy tớ ngài
  rationale: Đây là cách Giu-đa tự xưng khiêm nhường trước Giô-sép, không nhất thiết mô tả thân phận nô lệ thực tế.
- source_word: תַּחַת הַנַּעַר
  choice: thay cho cậu ấy
  rationale: תחת mang nghĩa thay thế chứ không phải vị trí ở bên dưới; cách dịch này tự nhiên và rõ ý.
- source_word: הַנַּעַר
  choice: cậu ấy
  rationale: נער chỉ Bên-gia-min trong cách nói mang tính bảo bọc của Giu-đa. Đại từ này tự nhiên hơn việc gọi một người đã trưởng thành là “cậu bé”, đồng thời không làm mất sắc thái trìu mến.
- source_word: עֶבֶד
  choice: làm nô lệ
  rationale: Khác với lối tự xưng lịch sự עבדך, ở đây từ này nói đến thân phận bị giữ lại phục dịch trong nhà Giô-sép, nên “nô lệ” làm rõ tính ràng buộc.
- source_word: לַאדֹנִי
  choice: cho chúa tôi
  rationale: אדני là tước xưng kính trọng dành cho Giô-sép. Viết thường “chúa” cho thấy đây là người có thẩm quyền, không phải danh xưng thần linh.
- source_word: וְהַנַּעַר יַעַל
  choice: còn cậu ấy hãy đi lên
  rationale: Giữ lực cầu khiến tiếp nối và giữ động từ עלה, cách nói thông dụng về hành trình từ Ai Cập lên Ca-na-an.
- source_word: עִם אֶחָיו
  choice: cùng các anh mình
  rationale: Trong tình huống cụ thể, những người đi cùng đều là anh của Bên-gia-min; “các anh mình” tự nhiên và chính xác hơn từ khái quát “anh em”.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ lối xưng hô cung kính của Giu-đa với Giô-sép. Phân biệt “đầy tớ” trong lời tự xưng khiêm nhường với “nô lệ” là thân phận Giu-đa tình nguyện nhận thay. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
