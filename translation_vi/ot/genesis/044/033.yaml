revisions:
- from: Vậy bây giờ, xin cho đầy tớ ngài ở lại thay cho cậu ấy, làm nô lệ cho chúa tôi; còn cậu ấy hãy đi lên cùng các anh mình.[a]
  to: Vậy bây giờ, xin cho đầy tớ ngài ở lại thay cho cậu ấy, làm nô lệ cho ngài; còn cậu ấy hãy đi lên cùng các anh mình.[a]
  rationale: Chỉ điều chỉnh tước xưng “chúa tôi” thành “ngài” để bảo đảm cách dùng hiện đại, tránh liên tưởng thần linh, đồng thời vẫn giữ đúng ý kính trọng đối với Giô-sép. Các lựa chọn còn lại phản ánh tốt bản Hê-bơ-rơ và ngữ cảnh.
