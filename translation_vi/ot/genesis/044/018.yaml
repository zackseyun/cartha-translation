- from: 'Bấy giờ Giu-đa đến gần ông và thưa: “Xin chúa tôi cho phép đầy tớ ngài được nói một lời để chúa tôi nghe, và xin ngài đừng nổi giận với đầy tớ ngài, vì ngài cũng như Pha-ra-ôn.”'
  to: 'Bấy giờ, Giu-đa tiến lại gần ông và thưa: “Xin chúa tôi, xin cho đầy tớ ngài nói một lời để chúa tôi nghe[a], và xin ngài đừng nổi giận với đầy tớ ngài[b], vì ngài như Pha-ra-ôn.”'
  rationale: Sửa nhẹ để phản ánh chính xác hơn cấu trúc khẩn cầu trong tiếng Hê-bơ-rơ, tránh thêm sắc thái không cần thiết trong phép so sánh, và giữ văn phong trang trọng, tự nhiên. Các chú thích được neo ngay tại hai thành ngữ được chuyển dịch theo nghĩa để bảo đảm tính minh bạch với nguyên văn.
