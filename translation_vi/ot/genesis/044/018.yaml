    issue: «Xin chúa tôi cho phép» diễn giải thêm ý «cho phép» và chưa tách rõ lời khẩn cầu mở đầu khỏi mệnh đề xin được nói.
    rationale: בִּי אֲדֹנִי là lời thỉnh cầu kính cẩn («xin/chỉ xin, chúa tôi»), tiếp theo là lời xin «xin cho đầy tớ ngài nói». Bản sửa giữ trật tự và lực ngôn hành này rõ hơn.
  - severity: low
    issue: «cũng như Pha-ra-ôn» thêm từ «cũng», không cần thiết trong phép so sánh.
    rationale: כָמוֹךָ כְּפַרְעֹה chỉ nói «ngài như Pha-ra-ôn». Bỏ «cũng» giúp bản dịch trực tiếp hơn mà vẫn tự nhiên.
