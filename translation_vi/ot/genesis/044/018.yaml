  text: וַ/יִּגַּ֨שׁ אֵלָ֜י/ו יְהוּדָ֗ה וַ/יֹּאמֶר֮ בִּ֣י אֲדֹנִ/י֒ יְדַבֶּר נָ֨א עַבְדְּ/ךָ֤ דָבָר֙ בְּ/אָזְנֵ֣י אֲדֹנִ֔/י וְ/אַל יִ֥חַר אַפְּ/ךָ֖ בְּ/עַבְדֶּ֑/ךָ כִּ֥י כָמ֖וֹ/ךָ כְּ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: vi
  text: 'Bấy giờ, Giu-đa tiến lại gần ông và thưa: “Xin chúa tôi, xin cho đầy tớ ngài nói một lời để chúa tôi nghe[a], và xin ngài đừng nổi giận với đầy tớ ngài[b], vì ngài như Pha-ra-ôn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: «vào tai chúa tôi», một thành ngữ có nghĩa là để chúa tôi nghe.'
    reason: cultural_note
  - marker: b
    text: 'Hoặc: «xin ngài đừng giận đầy tớ ngài». Nguyên văn sát chữ: «xin cơn giận của ngài đừng bừng cháy chống lại đầy tớ ngài».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו יְהוּדָה
  choice: Bấy giờ Giu-đa đến gần ông
  rationale: Giữ nghĩa cụ thể của נגשׁ là tiến đến gần, đồng thời dùng lối kể tự nhiên trong tiếng Việt; đại từ “ông” chỉ Giô-sép.
- source_word: בִּי אֲדֹנִי
  choice: Xin chúa tôi cho phép
  rationale: בִּי là lời khẩn khoản kính cẩn, không phải giới từ theo nghĩa thông thường. Cách dịch này truyền đạt sắc thái xin phép trong ngữ cảnh triều chính.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: đầy tớ ngài được nói một lời
  rationale: Giữ cách Giu-đa tự xưng khiêm nhường là “đầy tớ ngài” và giữ danh từ số ít דָבָר, nhưng diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: để chúa tôi nghe
  rationale: Đây là thành ngữ Hê-bơ-rơ, sát chữ là “vào tai chúa tôi”; bản dịch chuyển tải chức năng của thành ngữ mà không tạo câu tối nghĩa trong tiếng Việt.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: xin ngài đừng nổi giận với đầy tớ ngài
  rationale: “Nổi giận” là thành ngữ tiếng Việt tự nhiên, vẫn phản ánh hình ảnh cơn giận bùng lên của cụm חרה אף; “với” diễn tả đối tượng mà cơn giận hướng đến.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: vì ngài cũng như Pha-ra-ôn
  rationale: Giữ nguyên phép so sánh của nguyên văn và sự trang trọng trong lời Giu-đa, không giải thích quá mức rằng Giô-sép ngang hàng tuyệt đối với Pha-ra-ôn.
theological_decisions:
- issue: Ý nghĩa của lời so sánh Giô-sép với Pha-ra-ôn
  choice: Giữ nguyên “ngài cũng như Pha-ra-ôn”
  alternative: Diễn giải là “ngài có quyền ngang với Pha-ra-ôn”
  rationale: Nguyên văn chỉ nêu phép so sánh và có thể nhấn mạnh địa vị hoặc quyền hành. Bản dịch không thu hẹp ý nghĩa vào một cách giải thích duy nhất.
translation_notes:
  register: Văn phong trang trọng, kính cẩn, phù hợp lời thỉnh cầu trước một quan chức tối cao nhưng vẫn dễ hiểu với độc giả Việt Nam hiện đại. Dùng “chúa tôi” như tước xưng thế tục trong ngữ cảnh, còn “đầy tớ ngài” bảo tồn cách tự xưng khiêm nhường của Giu-đa.
