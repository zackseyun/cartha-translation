  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: vi
  text: 'Một đứa đã rời khỏi cha, và cha nói: ‘Chắc hẳn nó đã bị xé xác.’ Cho đến nay, cha vẫn chưa thấy nó.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: Một đứa đã rời khỏi cha
  rationale: Trong lời trực tiếp của Giu-đa thuật lại lời Gia-cốp, dùng “cha” thay cho đại từ ngôi thứ nhất giúp tiếng Việt tự nhiên và giữ đúng quan hệ thân tộc trong ngữ cảnh; הָאֶחָד là “một đứa/người con này” trong số hai con.
- source_word: אַךְ טָרֹף טֹרָף
  choice: Chắc chắn nó đã bị thú dữ xé xác
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ nhấn mạnh tính chắc chắn và mức độ của việc bị xé; “thú dữ” được hàm ý bởi cách dùng động từ và bối cảnh trước đó.
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: Từ đó đến nay, cha vẫn chưa thấy lại nó
  rationale: Diễn đạt tự nhiên giá trị kéo dài đến hiện tại của עַד הֵנָּה; “thấy lại” phù hợp vì người cha đã từng thấy con trước khi con rời đi.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, tự nhiên, dễ hiểu. Duy trì lời xưng “cha” theo ngữ cảnh Gia-cốp nói với các con, đồng thời không biến lời suy đoán của ông thành lời xác nhận khách quan về số phận Giô-sép.
