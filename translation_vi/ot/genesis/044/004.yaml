  text: הֵ֠ם יָֽצְא֣וּ אֶת הָ/עִיר֮ לֹ֣א הִרְחִיקוּ֒ וְ/יוֹסֵ֤ף אָמַר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ ק֥וּם רְדֹ֖ף אַחֲרֵ֣י הָֽ/אֲנָשִׁ֑ים וְ/הִשַּׂגְתָּ/ם֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לָ֛/מָּה שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: vi
  text: 'Họ ra khỏi thành chưa được bao xa thì Giô-sép nói với người quản lý nhà của ông[a]: “Hãy đứng dậy, đuổi theo những người ấy. Khi đuổi kịp họ, ngươi hãy nói với họ: ‘Tại sao các người lấy điều ác báo đáp điều thiện?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “người cai quản nhà của ông”; cũng có thể dịch là “quản gia của ông” hoặc “người coi sóc gia thất của ông.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר לֹא הִרְחִיקוּ
  choice: Họ ra khỏi thành chưa được bao xa
  rationale: 'Diễn đạt tự nhiên trình tự của câu chuyện: họ đã rời thành nhưng vẫn chưa đi xa; giữ đại từ số nhiều được nêu rõ trong tiếng Hê-bơ-rơ.'
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: với người quản lý nhà mình
  rationale: Cụm này có nghĩa đen là “với người ở trên nhà của ông,” chỉ người chịu trách nhiệm quản lý gia thất; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: קוּם רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: Hãy đứng dậy, đuổi theo những người ấy
  rationale: Giữ hai mệnh lệnh liên tiếp và sắc thái khẩn trương của קוּם; הָאֲנָשִׁים được dịch đúng là những người đàn ông đã rời đi, trong ngữ cảnh có thể diễn đạt tự nhiên là “những người ấy.”
- source_word: וְהִשַּׂגְתָּם
  choice: Khi đuổi kịp họ
  rationale: Động từ Hiphil của נשׂג mang nghĩa bắt kịp hoặc đuổi kịp; “khi” thể hiện tự nhiên quan hệ kế tiếp trước mệnh lệnh phải nói với họ.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: ngươi hãy nói với họ
  rationale: Giữ lời truyền trực tiếp ở ngôi thứ hai số ít. “Ngươi” phù hợp với lời chủ sai bảo thuộc hạ trong văn kể trang trọng.
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: các người lấy điều ác báo đáp điều thiện
  rationale: שִׁלַּמְתֶּם ở đây là báo trả hoặc báo đáp; cấu trúc “lấy điều ác báo đáp điều thiện” giữ nguyên sự đối lập đạo đức và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giô-sép” theo dạng tên quen thuộc trong tiếng Việt; lời sai bảo dùng “ngươi,” còn lời buộc tội dùng “các người” để phản ánh sự chuyển từ người quản lý số ít sang nhóm người bị truy đuổi.
