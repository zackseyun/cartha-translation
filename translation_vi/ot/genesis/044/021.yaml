translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Tôi tớ” phản ánh lối xưng hô trong bối cảnh quan quyền; “ta” thể hiện địa vị của Giô-sép trong lời được trích dẫn. Dùng “cậu ấy” vì người được nhắc đến là người em trai, tránh từ quá khẩu ngữ hoặc hàm ý trẻ nhỏ.
