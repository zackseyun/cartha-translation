  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: vi
  text: 'Bấy giờ, ngài đã bảo các đầy tớ ngài: “Hãy đưa người ấy xuống gặp ta, để ta tận mắt nhìn người ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “để ta đặt mắt ta trên người ấy.” Thành ngữ Hê-bơ-rơ này có thể mang nghĩa nhìn thấy, xem xét, hoặc đặc biệt lưu tâm đến một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Bấy giờ, ông đã nói
  rationale: Động từ wayyiqtol tiếp nối trình tự thuật chuyện; “Bấy giờ” diễn đạt tự nhiên sắc thái tuần tự, còn đại từ “ông” giữ lời Giu-đa trực tiếp nói với Giô-sép.
- source_word: עֲבָדֶיךָ
  choice: các tôi tớ ông
  rationale: Trong bối cảnh triều chính, עבד chỉ những người ở địa vị phục vụ hoặc thuộc quyền Giô-sép; “tôi tớ” phù hợp hơn “nô lệ” và giữ sắc thái kính trọng trong lời thưa.
- source_word: הוֹרִדֻהוּ אֵלַי
  choice: Hãy đưa cậu ấy xuống đây với ta
  rationale: Thể Hiphil mệnh lệnh số nhiều của ירד với hậu tố ngôi ba số ít mang nghĩa khiến người ấy đi xuống. “Xuống đây” giữ hướng đi xuống Ai Cập, còn “với ta” diễn đạt אֵלַי và phù hợp với lời trực tiếp của người có thẩm quyền.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: để ta tận mắt nhìn cậu ấy
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “đặt mắt ta trên cậu ấy”. Cách dịch “tận mắt nhìn” tự nhiên trong tiếng Việt, vẫn giữ ý đích thân nhìn hoặc xem xét mà không diễn giải quá mức thành chăm sóc hay bảo vệ.
