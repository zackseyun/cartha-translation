revisions:
- from: thì khi ông thấy đứa con không có mặt, ông sẽ chết; và các đầy tớ của ngài sẽ khiến mái đầu bạc của cha chúng tôi, là đầy tớ ngài, phải đau buồn đi xuống Sheol.[a]
  to: thì khi ông thấy cậu ấy không có mặt, ông sẽ chết; và chúng tôi, là các tôi tớ ngài, sẽ đưa mái đầu bạc của cha chúng tôi, là tôi tớ ngài, xuống Sheol trong đau buồn.[a]
  rationale: Bản sửa thay “đứa con” bằng “cậu ấy” để phản ánh הַנַּעַר mà không thêm quan hệ thân tộc vào từ vựng câu. Câu cũng chuyển cụm “đau buồn” thành “trong đau buồn”, phản ánh chính xác và tự nhiên bְּיָגוֹן, đồng thời giữ thành ngữ “đưa mái đầu bạc ... xuống Sheol”. “Chúng tôi, là các tôi tớ ngài” bảo toàn lối tự xưng số nhiều của עֲבָדֶיךָ và sắc thái cung kính.
