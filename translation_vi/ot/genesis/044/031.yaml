  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: vi
  text: thì khi ông thấy cậu ấy không có mặt, ông sẽ chết; và chúng tôi, là các tôi tớ ngài, sẽ đưa mái đầu bạc của cha chúng tôi, là tôi tớ ngài, xuống Sheol trong đau buồn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mồ mả” hoặc “cõi người chết”. Tiếng Hê-bơ-rơ là “Sheol”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: thì
  rationale: Đánh dấu kết quả của điều kiện ở câu trước, tự nhiên hơn lối dịch sát chữ “và sẽ xảy ra”.
- source_word: כִּרְאוֹתוֹ
  choice: khi ông thấy
  rationale: Cấu trúc nguyên mẫu với כ và hậu tố ngôi ba số ít diễn tả hoàn cảnh thời gian.
- source_word: כִּי אֵין הַנַּעַר
  choice: đứa con không có mặt
  rationale: אֵין trong ngữ cảnh chỉ sự vắng mặt; “đứa con” thể hiện cách Giu-đa nói về Bên-gia-min trong tương quan với cha mà vẫn tự nhiên trong tiếng Việt.
- source_word: וָמֵת
  choice: ông sẽ chết
  rationale: 'Chỉ kết quả tương lai: Gia-cốp sẽ chết khi thấy Bên-gia-min không trở về.'
- source_word: וְהוֹרִידוּ
  choice: sẽ khiến ... đi xuống
  rationale: Giữ nghĩa tác khiến của thể Hiphil và hình ảnh đi xuống Sheol.
- source_word: עֲבָדֶיךָ
  choice: các đầy tớ của ngài
  rationale: Đây là lối tự xưng khiêm nhường trước người có quyền, không nhất thiết nhấn mạnh thân phận nô lệ.
- source_word: שֵׂיבַת
  choice: mái đầu bạc
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ, đồng thời diễn đạt tự nhiên hơn “tóc bạc” khi chỉ con người tuổi già.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: cha chúng tôi, là đầy tớ ngài
  rationale: Bảo toàn cả hai quan hệ trong cụm đồng vị và làm rõ bằng cú pháp tiếng Việt.
- source_word: בְּיָגוֹן
  choice: đau buồn
  rationale: Diễn đạt trạng thái đau khổ đi kèm việc xuống Sheol một cách tự nhiên.
- source_word: שְׁאֹלָה
  choice: xuống Sheol
  rationale: Giữ nguyên thuật ngữ Hê-bơ-rơ để không thu hẹp nghĩa thành riêng phần mộ hay áp đặt một mô hình về cõi chết.
theological_decisions:
- issue: Cách dịch שְׁאוֹל
  choice: Sheol
  alternative: mồ mả; cõi người chết
  rationale: Phiên âm giữ được phạm vi nghĩa rộng và thế giới quan cổ của bản văn, không đồng nhất thuật ngữ với riêng nơi chôn cất hoặc một quan niệm giáo lý cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài/đầy tớ” để phản ánh lời thưa kính cẩn của Giu-đa; giữ hình ảnh “mái đầu bạc” và thuật ngữ “Sheol” của nguyên văn.
