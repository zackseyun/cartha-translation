  text: וְ/עַתָּ֣ה לְכ֣וּ וְ/נַֽהַרְגֵ֗/הוּ וְ/נַשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הַ/בֹּר֔וֹת וְ/אָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ וְ/נִרְאֶ֕ה מַה יִּהְי֖וּ חֲלֹמֹתָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: vi
  text: '“Nào, bây giờ chúng ta hãy giết nó rồi ném nó xuống một trong các hố[a], và chúng ta sẽ nói: ‘Một con thú dữ[b] đã ăn thịt nó.’ Rồi chúng ta sẽ xem những giấc mơ của nó sẽ ra sao!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các bể chứa nước”. Từ Hê-bơ-rơ בּוֹר có thể chỉ hố, bể chứa nước hoặc một chỗ chứa sâu giống như giếng, tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Hay “một con thú hoang hung dữ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לְכוּ
  choice: Vậy bây giờ, nào
  rationale: “Vậy bây giờ” giữ sắc thái liên kết và tính cấp thời của וְעַתָּה; “nào” diễn đạt tự nhiên chức năng thúc giục của mệnh lệnh số nhiều לְכוּ trong ngữ cảnh này.
- source_word: וְנַהַרְגֵהוּ
  choice: chúng ta hãy giết nó
  rationale: “Hãy” thể hiện sắc thái đề nghị cùng hành động của dạng cohortative ngôi thứ nhất số nhiều; “nó” phản ánh cách những người anh hạ thấp và xa cách Giô-sép.
- source_word: וְנַשְׁלִכֵהוּ
  choice: ném nó xuống
  rationale: “Ném” là tương đương trực tiếp, hiện đại của động từ; thêm “xuống” làm rõ hướng vào hố vốn tự nhiên trong tiếng Việt.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: xuống một trong các hố
  rationale: בּוֹר có thể chỉ hố hoặc bể chứa nước. “Hố” giữ nghĩa khái quát của từ trong câu, còn khả năng “bể chứa nước” được nêu ở chú thích.
- source_word: וְאָמַרְנוּ
  choice: và chúng ta sẽ nói
  rationale: Diễn đạt hành động kế tiếp trong kế hoạch mà các anh của Giô-sép đang bàn bạc.
- source_word: חַיָּה רָעָה
  choice: một con thú dữ
  rationale: “Thú dữ” là cách nói tự nhiên, trang trọng vừa phải, chuyển tải cả yếu tố thú hoang và tính nguy hiểm của cụm Hê-bơ-rơ.
- source_word: אֲכָלָתְהוּ
  choice: đã ăn thịt nó
  rationale: Động từ cơ bản có nghĩa là “ăn”; “ăn thịt” phù hợp với chủ thể là thú dữ và tự nhiên hơn trong tiếng Việt mà không tăng mức độ diễn giải như “xé xác” hay “nuốt chửng”.
- source_word: וְנִרְאֶה
  choice: Rồi chúng ta sẽ xem
  rationale: Giữ sắc thái kết quả và lời thách thức chế nhạo trong kế hoạch của các anh.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: những giấc mơ của nó sẽ ra sao
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ được định hướng tương lai và sự mơ hồ có chủ ý về kết cục hoặc hiệu lực của các giấc mơ.
theological_decisions:
- issue: Ý nghĩa của câu chế nhạo về các giấc mơ
  choice: giữ cách nói “sẽ ra sao”
  alternative: “có thành sự thật không”
  rationale: Nguyên văn hỏi các giấc mơ sẽ trở nên thế nào, không nói thẳng rằng vấn đề chỉ là chúng có ứng nghiệm hay không; bản dịch vì thế không thu hẹp hàm ý thần học và tự sự.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm vừa phải. “Nào” thể hiện lời thúc giục; đại từ “nó” giữ giọng khinh miệt, lạnh lùng của những người anh trong lời bàn giết Giô-sép. Các dấu chú thích được đặt ngay sau những từ ngữ mà chúng giải thích.
