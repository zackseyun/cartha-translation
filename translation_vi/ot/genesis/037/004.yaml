translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chàng” để chỉ Giô-sép, tránh sự mơ hồ của chuỗi đại từ nam số ít; “các anh” phản ánh đúng vị thế của những người anh trong ngữ cảnh.
