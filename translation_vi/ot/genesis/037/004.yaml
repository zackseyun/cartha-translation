  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: vi
  text: Khi các anh em của Giô-sép thấy cha yêu chàng hơn tất cả các anh em khác, họ ghét chàng và không thể nói năng hòa nhã với chàng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thể nói chuyện hòa thuận với chàng” hoặc, sát chữ hơn: “không thể nói với chàng trong hòa thuận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Khi ... thấy
  rationale: Dạng kể chuyện với waw tiếp nối diễn tiến và dẫn vào phản ứng sau đó; “Khi” diễn đạt tự nhiên quan hệ thời gian trong tiếng Việt.
- source_word: אֶחָיו
  choice: các anh của Giô-sép
  rationale: Chỉ những người anh/em trai của Giô-sép; trong ngữ cảnh họ đều là các anh của chàng, và nêu tên Giô-sép giúp câu tiếng Việt rõ chủ thể sở hữu.
- source_word: כִּי
  choice: '[thấy] ...'
  rationale: כִּי giới thiệu nội dung họ nhận thấy; tiếng Việt có thể nối trực tiếp sau “thấy” mà không cần thêm “rằng”.
- source_word: אָהַב
  choice: yêu
  rationale: Giữ nghĩa thông thường của động từ Hebrew là “yêu”; ý thiên vị được thể hiện bằng phép so sánh, không đổi thành “ưu ái”.
- source_word: אֲבִיהֶם
  choice: cha
  rationale: Đây là cha chung của các anh em; tiếng Việt tự nhiên có thể dùng “cha” trong cấu trúc này mà không làm mất quy chiếu.
- source_word: מִכָּל אֶחָיו
  choice: hơn tất cả các anh em mình
  rationale: Giữ sát cấu trúc so sánh “hơn tất cả anh em của chàng”, không thêm từ “khác” vốn chỉ được hàm ý.
- source_word: וַיִּשְׂנְאוּ
  choice: họ ghét
  rationale: Diễn đạt trực tiếp động từ שׂנא và giữ nhịp kể chuyện.
- source_word: וְלֹא יָכְלוּ
  choice: và không thể
  rationale: Giữ nguyên ý bất lực hoặc không có khả năng hành xử khác, thay vì chuyển thành một mệnh đề mục đích hay hệ quả mạnh hơn.
- source_word: דַּבְּרוֹ
  choice: nói chuyện ... với chàng
  rationale: Hậu tố chỉ Giô-sép; “nói chuyện với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לְשָׁלֹם
  choice: thân thiện
  rationale: Trong thành ngữ này, שָׁלוֹם chỉ quan hệ hòa thuận, thiện chí khi giao tiếp; “thân thiện” truyền đạt tự nhiên ý nghĩa theo ngữ cảnh.
