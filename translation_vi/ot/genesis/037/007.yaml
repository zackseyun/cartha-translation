source:
  edition: WLC
  text: וְ֠/הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּ/ת֣וֹךְ הַ/שָּׂדֶ֔ה וְ/הִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖/י וְ/גַם נִצָּ֑בָה וְ/הִנֵּ֤ה תְסֻבֶּ֨ינָה֙ אֲלֻמֹּ֣תֵי/כֶ֔ם וַ/תִּֽשְׁתַּחֲוֶ֖יןָ לַ/אֲלֻמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: vi
  text: Kìa, chúng ta đang bó lúa thành từng bó giữa đồng; kìa, bó lúa của tôi đứng dậy và cũng đứng thẳng; kìa, các bó lúa của các anh quây quanh và cúi rạp xuống trước bó lúa của tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các bó lúa của các anh quay quanh rồi sấp mình xuống trước bó lúa của tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: kìa ... kìa ... và kìa
  rationale: Giữ nguyên ba lần lặp của từ chỉ thị trong lời kể giấc mơ, tạo cảm giác sống động và trực tiếp; “kìa” tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: đang bó lúa thành từng bó
  rationale: Diễn đạt cả động từ và danh từ đồng gốc, đồng thời làm rõ hoạt động gom và buộc lúa thành bó trong bối cảnh nông nghiệp.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: giữa đồng
  rationale: Bảo toàn sắc thái không gian của בְּתוֹךְ và dùng cách nói gọn, tự nhiên trong tiếng Việt.
- source_word: קָמָה
  choice: đứng dậy
  rationale: Thể hiện chuyển động đi lên của bó lúa và chuẩn bị cho động từ chỉ trạng thái đứng vững theo sau.
- source_word: וְגַם נִצָּבָה
  choice: rồi còn đứng thẳng nữa
  rationale: Giữ trình tự hành động và sắc thái bổ sung, nhấn mạnh của וְגַם; “đứng thẳng” truyền đạt trạng thái dựng đứng sau khi đứng dậy.
- source_word: תְסֻבֶּינָה
  choice: vây quanh
  rationale: Diễn đạt chuyển động quay hoặc tụ lại xung quanh; phù hợp tự nhiên với hình ảnh các bó lúa bao quanh bó lúa của Giô-sép.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: cúi rạp xuống trước
  rationale: Truyền đạt tư thế cúi mình sâu mà không tự động giải thích đó là hành vi thờ phượng; giới từ “trước” làm rõ hướng quy phục đối với bó lúa kia.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: bó lúa của tôi / các bó lúa của các anh
  rationale: Giữ nhất quán hình ảnh nông nghiệp và phân biệt rõ sở hữu số ít với số nhiều; “các anh” phản ánh ngôi thứ hai số nhiều giống đực trong bối cảnh Giô-sép nói với các anh mình.
theological_decisions:
- issue: Mức độ hàm ý thờ phượng hoặc thần phục trong וַתִּשְׁתַּחֲוֶיןָ
  choice: cúi rạp xuống trước
  alternative: sấp mình thờ lạy
  rationale: Động từ có thể chỉ cúi mình, phủ phục hoặc thờ lạy tùy ngữ cảnh. Vì chủ thể trong giấc mơ là các bó lúa và câu chưa giải thích biểu tượng, bản dịch giữ hành động thân thể cùng hàm ý thần phục nhưng không thêm nghĩa thờ phượng.
translation_notes:
  register: Văn phong kể chuyện sống động, trang nghiêm nhưng dễ hiểu. Dấu chấm phẩy phân tách ba cảnh của giấc mơ mà vẫn giữ nhịp lặp “kìa”. Đại từ “tôi/các anh” phù hợp lời Giô-sép nói với các anh mình và tránh sắc thái cổ.
