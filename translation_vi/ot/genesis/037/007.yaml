  naturalness: «Rồi còn đứng thẳng nữa» hơi khẩu ngữ và trùng sắc thái; «và cũng đứng thẳng» tự nhiên, trang trọng vừa phải hơn. «Quây quanh» diễn tả chuyển động tụ/quay quanh thành ngữ hơn «vây quanh» trong ngữ cảnh này.
