  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: vi
  text: 'Bấy giờ, Giu-đa nói với các anh em mình: “Nếu chúng ta giết em mình rồi che giấu việc đổ máu ấy thì có lợi gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên trình tự ấy trong tiếng Việt.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Dạng phiên âm tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: אֶל אֶחָיו
  choice: với các anh em mình
  rationale: Danh từ số nhiều giống đực chỉ những người anh em trai của Giu-đa đang hiện diện; “anh em” là cách gọi tự nhiên trong ngữ cảnh gia đình.
- source_word: מַה בֶּצַע
  choice: có lợi gì
  rationale: בֶּצַע chỉ lợi lộc, món lợi hay điều thu được, thường hàm ý tính toán vì tư lợi; câu hỏi ngắn gọn này giữ được sắc thái thực dụng.
- source_word: כִּי נַהֲרֹג
  choice: Nếu chúng ta giết
  rationale: כִּי trong câu hỏi tu từ này được hiểu theo quan hệ điều kiện; động từ ngôi thứ nhất số nhiều được diễn đạt trực tiếp.
- source_word: אָחִינוּ
  choice: em mình
  rationale: Từ Hê-bơ-rơ nghĩa đen là “anh/em trai của chúng ta”; trong mạch truyện, Giô-sép là em của những người đang bàn bạc, nên “em mình” tự nhiên và chính xác theo quan hệ gia đình.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: rồi che giấu việc đổ máu ấy
  rationale: Thành ngữ nghĩa đen là “che máu của nó/người ấy”, chỉ việc che giấu vụ đổ máu hoặc trách nhiệm về cái chết. Bản dịch giữ hình ảnh “đổ máu” nhưng diễn đạt rõ và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Trật tự câu hỏi được điều chỉnh theo cú pháp tiếng Việt nhưng vẫn giữ động cơ vụ lợi cùng sức nặng đạo đức của cách gọi “em mình”.
