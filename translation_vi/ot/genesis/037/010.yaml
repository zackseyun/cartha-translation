  text: וַ/יְסַפֵּ֣ר אֶל אָבִי/ו֮ וְ/אֶל אֶחָי/ו֒ וַ/יִּגְעַר בּ֣/וֹ אָבִ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מָ֛ה הַ/חֲל֥וֹם הַ/זֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲ/ב֣וֹא נָב֗וֹא אֲנִי֙ וְ/אִמְּ/ךָ֣ וְ/אַחֶ֔י/ךָ לְ/הִשְׁתַּחֲוֺ֥ת לְ/ךָ֖ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: vi
  text: 'Cậu kể giấc mơ ấy cho cha và anh em mình nghe. Cha cậu quở trách cậu và nói: “Con đã mơ giấc mơ gì thế này? Chẳng lẽ cha, mẹ con và anh em con thật sự sẽ đến sấp mình xuống đất trước mặt con[a] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phủ phục trước con.” Động từ Hê-bơ-rơ diễn tả việc cúi rạp để tỏ sự quy phục hoặc tôn kính; ở đây không nhất thiết có nghĩa là thờ phượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: Cậu kể giấc mơ ấy
  rationale: Động từ ספר ở thể piel có nghĩa là kể lại. Nêu rõ “giấc mơ ấy” theo ngữ cảnh giúp câu tiếng Việt tự nhiên mà không thêm nội dung mới.
- source_word: וַיִּגְעַר בּוֹ
  choice: quở trách cậu
  rationale: גער chỉ lời trách mắng hay khiển trách trực tiếp; “quở trách” giữ được sắc thái mạnh và trang trọng vừa phải.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: Con đã mơ giấc mơ gì thế này?
  rationale: Cách diễn đạt này giữ sự lặp lại cùng gốc giữa danh từ “giấc mơ” và động từ “mơ”, đồng thời truyền đạt sắc thái chất vấn của tiếng Hê-bơ-rơ bằng tiếng Việt tự nhiên.
- source_word: הֲבוֹא נָבוֹא
  choice: Chẳng lẽ ... thật sự sẽ đến
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động; “chẳng lẽ” thể hiện câu hỏi hoài nghi và “thật sự” giữ lực nhấn mạnh.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: cha, mẹ con và các anh con
  rationale: Trong lời người cha nói với con, chuyển ngôi “tôi” thành cách tự xưng thân tộc “cha” là tự nhiên trong tiếng Việt; “các anh” phù hợp với vị trí của Giô-sép trong gia đình ở ngữ cảnh.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה
  choice: sấp mình xuống đất trước mặt con
  rationale: Cụm này diễn tả hành vi cúi rạp để tỏ sự quy phục hay tôn kính. “Sấp mình xuống đất” giữ mức độ sâu của động tác và tránh hàm ý thờ phượng không tất yếu trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của השתחוה trong ngữ cảnh không thuộc nghi lễ thờ phượng
  choice: sấp mình xuống đất trước mặt con
  alternative: thờ lạy con
  rationale: Động từ có thể chỉ sự thờ phượng trong các ngữ cảnh hướng về thần linh, nhưng ở đây nói về việc người trong gia đình cúi rạp trước Giô-sép. Bản dịch giữ ý phục tùng hoặc tôn kính mà không áp đặt ý nghĩa thờ phượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng lối xưng hô gia đình “cha—con” trong lời thoại; phần trần thuật dùng “cậu” để chỉ Giô-sép, tránh sự lặp đại từ khó hiểu. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
