  terminology: Ích-ma-ên, Ga-la-át và Ai Cập phù hợp. “Nhựa thơm, dầu thơm và nhựa la-đa-num” là cách chuyển ngữ thận trọng cho các tên sản vật chưa xác định chắc chắn. Chú thích giữ đúng mức độ dè dặt và ghi nhận truyền thống dịch “mộc dược” cho từ cuối, không khẳng định đồng nhất.
