  text: וַ/יֵּשְׁבוּ֮ לֶֽ/אֱכָל לֶחֶם֒ וַ/יִּשְׂא֤וּ עֵֽינֵי/הֶם֙ וַ/יִּרְא֔וּ וְ/הִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִ/גִּלְעָ֑ד וּ/גְמַלֵּי/הֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּ/צְרִ֣י וָ/לֹ֔ט הוֹלְכִ֖ים לְ/הוֹרִ֥יד מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: vi
  text: Rồi họ ngồi xuống ăn bánh. Họ ngước mắt lên và nhìn, kìa, một đoàn lữ hành của người Ích-ma-ên đang từ Ga-la-át đến. Lạc đà của đoàn ấy chở nhựa thơm, dầu thơm và nhựa la-đa-num[a]; đoàn ấy đang trên đường mang những thứ này xuống Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên chính xác của ba sản vật thơm trong câu này không hoàn toàn chắc chắn. Từ cuối thường được hiểu là la-đa-num, một loại nhựa thơm, nhưng cũng có truyền thống dịch là “mộc dược”.
    reason: Bảo lưu sự không chắc chắn về nhận dạng thực vật của נְכֹאת, צְרִי và đặc biệt לֹט, đồng thời giải thích khác biệt với cách dịch tiếng Anh tham khảo.
lexical_decisions:
- source_word: לֶחֶם (leḥem)
  choice: bánh
  rationale: Giữ nghĩa cụ thể thông thường là “bánh” trong ngữ cảnh họ ngồi xuống dùng bữa, thay vì khái quát hóa thành “thức ăn”.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים (ʾorḥat yišmeʿelim)
  choice: một đoàn lữ hành người Ích-ma-ên
  rationale: אֹרְחָה chỉ một đoàn người đi đường, trong ngữ cảnh này là đoàn buôn; “đoàn lữ hành” tự nhiên và không thêm từ “thương nhân” vốn không được nêu trực tiếp.
- source_word: נְכֹאת (nekhoʾt)
  choice: nhựa thơm
  rationale: Danh từ chỉ một loại sản vật thơm dạng nhựa, thường được liên hệ với nhựa tragacanth; cách dịch rộng phản ánh sự chưa chắc chắn về nhận dạng thực vật.
- source_word: צְרִי (ṣeri)
  choice: dầu thơm
  rationale: Chỉ chất thơm/chữa bệnh nổi tiếng từ vùng Ga-la-át, thường gọi là balm; “dầu thơm” là cách nói dễ hiểu trong tiếng Việt hiện đại dù vật chất có thể là nhựa thơm.
- source_word: לֹט (loṭ)
  choice: nhựa la-đa-num
  rationale: Theo nhận dạng từ nguyên-thực vật phổ biến là ladanum, một loại nhựa thơm; tránh đồng nhất chắc chắn với mộc dược khi nguyên ngữ dùng một từ khác với từ Hê-bơ-rơ thông thường chỉ mộc dược.
- source_word: מִצְרָיְמָה (miṣraymah)
  choice: xuống Ai Cập
  rationale: Hậu tố chỉ hướng được thể hiện bằng “xuống”, đồng thời giữ cách nhìn địa lý của câu nguồn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Giữ nhịp tuần tự của tiếng Hê-bơ-rơ và từ cảm thán “kìa” để tái hiện khoảnh khắc bất ngờ, nhưng chia câu nhằm giúp độc giả phổ thông dễ theo dõi.
