- from: Rồi họ ngồi xuống ăn bánh. Họ ngước mắt lên và nhìn, kìa, một đoàn lữ hành người Ích-ma-ên từ Ga-la-át đang đến. Lạc đà của họ chở nhựa thơm, dầu thơm và nhựa la-đa-num[a]; họ đang trên đường mang những thứ ấy xuống Ai Cập.
  to: Rồi họ ngồi xuống ăn bánh. Họ ngước mắt lên và nhìn, kìa, một đoàn lữ hành của người Ích-ma-ên đang từ Ga-la-át đến. Lạc đà của đoàn ấy chở nhựa thơm, dầu thơm và nhựa la-đa-num[a]; đoàn ấy đang trên đường mang những thứ này xuống Ai Cập.
