  text: His brothers went to pasture their father's flock at Shechem[a].
translation:
  language: vi
  text: Các anh của Giô-sép đi chăn đàn gia súc nhỏ của cha họ tại Si-chem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Si-chem.” Giới từ Hê-bơ-rơ có thể chỉ vị trí trong địa điểm, hoặc tại địa điểm ấy hay vùng phụ cận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: đi
  rationale: Thể wayyiqtol của הלך tiếp nối chuỗi sự việc trong lời kể. “Đi” là cách diễn đạt tự nhiên; không thêm từ chỉ thời gian như “bấy giờ” vì nguyên文 không có từ tương ứng rõ ràng.
- source_word: אֶחָיו
  choice: các anh của Giô-sép
  rationale: Nghĩa đen là “các anh/em trai của ông”. Trong ngữ cảnh, đây là các anh của Giô-sép; nêu tên Giô-sép giúp tiếng Việt tránh đại từ sở hữu mơ hồ.
- source_word: לִרְעוֹת
  choice: chăn
  rationale: Động từ רעה ở đây chỉ việc chăm nom và cho đàn vật ăn cỏ. “Chăn” ngắn gọn, tự nhiên và bao quát hoạt động ấy.
- source_word: אֶת
  choice: '[dấu hiệu tân ngữ trực tiếp, không dịch]'
  rationale: אֵת đánh dấu tân ngữ xác định và không có từ tương ứng độc lập trong tiếng Việt.
- source_word: צֹאן
  choice: đàn gia súc
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, chủ yếu là chiên và dê. “Đàn gia súc” tránh thu hẹp nghĩa thành riêng loài chiên, dù kém chuyên biệt hơn cụm “đàn gia súc nhỏ” trong văn phong thông thường.
- source_word: אֲבִיהֶם
  choice: của cha mình
  rationale: Dạng liên kết với hậu tố chỉ quyền sở hữu, nghĩa là “của cha họ”. Trong tiếng Việt, “cha mình” tự nhiên và quy chiếu về chủ ngữ số nhiều.
- source_word: בִּשְׁכֶם
  choice: tại Si-chem
  rationale: Tên địa danh שְׁכֶם được phiên âm là “Si-chem”. Giới từ בְּ có thể chỉ ở trong địa điểm hoặc tại địa điểm/vùng phụ cận; “tại” giữ được độ rộng ấy tốt hơn “trong”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “các anh” theo ngữ cảnh thay vì “các anh em” để tránh hiểu gồm cả em trai; dùng “tại” nhằm giữ sự mơ hồ địa điểm của giới từ Hê-bơ-rơ.
