  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: vi
  text: 'Giô-sép đáp: “Tôi đang tìm các anh tôi. Xin cho tôi biết họ đang chăn bầy ở đâu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Cậu đáp
  rationale: Động từ אמר ở dạng trần thuật nối tiếp có nghĩa cơ bản là “nói”. Trong ngữ cảnh người ấy vừa hỏi Giô-sép, “đáp” tự nhiên trong tiếng Việt và làm rõ lượt lời mà không thêm nội dung.
- source_word: אֶת אַחַי
  choice: các anh tôi
  rationale: אַחַי nghĩa là “những người anh/em trai của tôi”; trong ngữ cảnh đây là các anh trai của Giô-sép, nên “các anh tôi” chính xác và tự nhiên.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: Tôi đang tìm
  rationale: Đại từ độc lập đi với phân từ diễn tả hành động đang tiếp diễn; “đang tìm” giữ được sắc thái ấy bằng tiếng Việt hiện đại.
- source_word: הַגִּידָה נָּא לִי
  choice: Xin cho tôi biết
  rationale: Mệnh lệnh Hiphil của נגד cùng נָא tạo lời thỉnh cầu lịch sự. “Xin cho tôi biết” trang trọng vừa phải và tự nhiên.
- source_word: אֵיפֹה הֵם
  choice: họ ... ở đâu
  rationale: Giữ nguyên câu hỏi về địa điểm và đại từ số nhiều chỉ các anh của Giô-sép, đồng thời theo trật tự câu hỏi tự nhiên trong tiếng Việt.
- source_word: רֹעִים
  choice: đang chăn đàn vật
  rationale: Phân từ Qal của רעה chỉ việc trông nom gia súc ngoài đồng. Tiếng Việt thường cần nêu đối tượng của “chăn”; “đàn vật” diễn đạt khái quát, không thu hẹp thành riêng chiên hay dê.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, sáng rõ và trang nghiêm vừa phải. Dùng “cậu” vì người nói là Giô-sép, một thanh niên trong ngữ cảnh; lời trực tiếp giữ cách xưng “tôi” tự nhiên. Không đặt chú thích vì khác biệt từ vựng của רֹעִים có thể được diễn đạt đầy đủ trong chính văn mà không tạo vấn đề thần học hay mơ hồ đáng kể.
