  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Joseph has surely been torn to pieces.”
translation:
  language: vi
  text: 'Ông nhận ra chiếc áo và nói: “Áo của con trai ta! Thú dữ đã ăn thịt con trai ta. Giô-sép chắc chắn đã bị xé xác!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dùng một cấu trúc lặp của động từ để nhấn mạnh: Giô-sép chắc chắn đã bị xé xác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: Ông nhận ra chiếc áo
  rationale: Động từ Hifil נכר có nghĩa là nhận ra hoặc nhận diện. Đại từ giống cái số ít chỉ כְּתֹנֶת; tiếng Việt tự nhiên nhắc lại “chiếc áo” để làm rõ đối tượng.
- source_word: כְּתֹנֶת בְּנִי
  choice: áo dài của con trai ta
  rationale: כְּתֹנֶת là loại áo mặc dài, không nhất thiết tương ứng với áo khoác hiện đại. “Áo dài” ở đây diễn đạt chiều dài của y phục cổ; “của con trai ta” giữ sát kết cấu sở hữu và hợp với lời của Gia-cốp.
- source_word: חַיָּה רָעָה
  choice: thú dữ
  rationale: חַיָּה trong ngữ cảnh là thú hoang, còn רָעָה mô tả tính nguy hiểm hoặc hung dữ chứ không nhất thiết mang nghĩa xấu về đạo đức. “Thú dữ” là cách nói tự nhiên, gọn và đúng ngữ cảnh săn mồi.
- source_word: אֲכָלָתְהוּ
  choice: đã ăn thịt nó
  rationale: Động từ אכל theo nghĩa cơ bản là ăn; trong ngữ cảnh thú dữ tấn công con người, “ăn thịt” tự nhiên và rõ hơn “ăn”, đồng thời không thêm quá nhiều sắc thái ngoài nguyên văn.
- source_word: טָרֹף טֹרַף
  choice: chắc chắn đã bị xé xác
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ thể bị động nhấn mạnh tính chắc chắn. “Chắc chắn” chuyển tải sự nhấn mạnh, còn “bị xé xác” diễn đạt tự nhiên hậu quả của thú dữ vồ xé.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt hiện đại, tương ứng với יוֹסֵף.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng “ông” trong lời dẫn và “ta/nó” trong lời Gia-cốp để phản ánh lời của người cha trong bối cảnh cổ đại. Dấu chấm than thể hiện sự nhận biết đau đớn và quyết đoán trong chuỗi câu cảm thán. Marker [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
