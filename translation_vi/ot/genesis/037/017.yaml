source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: vi
  text: 'Người ấy nói: “Họ đã rời khỏi đây, vì tôi nghe họ nói[a]: ‘Chúng ta hãy đi đến Đô-than[b].’” Vậy Giô-sép đi theo các anh mình và tìm thấy họ tại Đô-than.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “tôi nghe có người nói”; nguyên văn không nêu tường minh chủ thể của động từ “nói.”'
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hê-bơ-rơ, tên Đô-than mang hậu tố chỉ hướng, sát nghĩa là “về phía Đô-than.”
    reason: cultural_note
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: đã rời khỏi đây
  rationale: Động từ נסע có thể chỉ việc nhổ trại rồi lên đường; trong ngữ cảnh này, “đã rời khỏi đây” tự nhiên, rõ nghĩa và không thêm chi tiết về việc nhổ trại mà câu Hê-bơ-rơ không nhấn mạnh.
- source_word: כִּי
  choice: vì
  rationale: Liên từ này nêu lý do người ấy biết các anh của Giô-sép đã đi nơi khác.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: tôi nghe họ nói
  rationale: Cụm từ nguyên văn gồm “tôi nghe” và phân từ số nhiều “đang nói”; đại từ “họ” được suy ra tự nhiên từ ngữ cảnh, nhưng chủ thể không được nêu tường minh nên ghi phương án khác trong chú thích.
- source_word: נֵלְכָה
  choice: Chúng ta hãy đi
  rationale: Dạng khích lệ ngôi thứ nhất số nhiều được thể hiện bằng “hãy”, giữ sắc thái cùng nhau đề nghị hoặc quyết định lên đường.
- source_word: דֹּתָיְנָה
  choice: đến Đô-than
  rationale: Hậu tố chỉ hướng trên địa danh diễn tả chuyển động hướng đến Đô-than; tiếng Việt tự nhiên dùng “đến”.
- source_word: אַחַר אֶחָיו
  choice: đi theo các anh mình
  rationale: אַחַר trong ngữ cảnh này chỉ việc theo sau để tìm gặp. “Các anh mình” diễn đạt quan hệ giữa Giô-sép và những người anh một cách tự nhiên trong tiếng Việt.
- source_word: וַיִּמְצָאֵם
  choice: tìm thấy họ
  rationale: מצא trong văn thuật chuyện mang nghĩa thông thường là tìm thấy hoặc gặp được người đang tìm.
- source_word: בְּדֹתָן
  choice: tại Đô-than
  rationale: Giới từ בְּ ở đây chỉ địa điểm nơi Giô-sép tìm thấy các anh; “tại” phù hợp với một địa danh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ấy” để nối với nhân vật đã xuất hiện ở câu trước; giữ nguyên địa danh theo dạng phiên âm tiếng Việt “Đô-than”. Cấu trúc lời dẫn và lời trích lồng nhau được phân biệt bằng dấu ngoặc kép và ngoặc đơn.
