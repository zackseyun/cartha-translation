- from: Khi Ru-bên trở lại bên hố[a], thì thấy Giô-sép không còn ở trong hố nữa. Ông liền xé áo mình[b].
  to: Khi Ru-bên trở lại hố[a] thì thấy Giô-sép không ở trong hố. Ông xé áo mình[b].
  rationale: Bản sửa loại bỏ định vị không có trong nguyên ngữ («bên») và sắc thái thời gian không được nêu rõ («không còn ... nữa»), đồng thời duy trì nhịp kể, tính tự nhiên và các neo chú thích của bản nháp.
