  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: vi
  text: Khi Ru-bên trở lại hố[a] thì thấy Giô-sép không ở trong hố. Ông xé áo mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bể chứa nước”. Từ Hê-bơ-rơ bor có thể chỉ một cái hố hoặc bể chứa nước.
    reason: lexical_alternative
  - marker: b
    text: Xé áo mình là cách người thời ấy thường biểu lộ nỗi đau buồn, sự bàng hoàng hoặc đau khổ.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: trở lại
  rationale: Động từ שוב ở thể kể chuyện chỉ việc Ru-bên quay lại địa điểm trước đó; “trở lại” tự nhiên và không xác định quá mức cách di chuyển.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: hố / trong hố
  rationale: בּוֹר có thể chỉ hố hoặc bể chứa nước. “Hố” dễ hiểu, phù hợp trực tiếp với mạch truyện; phương án “bể chứa nước” được giữ trong chú thích.
- source_word: וְהִנֵּה
  choice: thì thấy
  rationale: הִנֵּה thu hút sự chú ý vào phát hiện bất ngờ. Trong tiếng Việt kể chuyện, “thì thấy” truyền đạt tự nhiên sức đột ngột ấy mà không dùng lối cổ “kìa” hay “này”.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: Giô-sép không còn ở trong hố nữa
  rationale: Cụm với אֵין diễn tả sự vắng mặt. “Không còn ở trong hố nữa” diễn đạt tự nhiên phát hiện của Ru-bên, không nói thêm Giô-sép đã đi đâu hoặc bằng cách nào.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: Ông liền xé áo mình
  rationale: Cụm này chỉ hành động xé y phục theo tập tục để biểu lộ đau buồn, kinh hoàng hoặc tuyệt vọng. “Xé áo mình” trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “thì thấy” để thể hiện sức bất ngờ của וְהִנֵּה; tách thành hai câu nhằm giữ nhịp tự nhiên trong tiếng Việt. Tên riêng theo dạng phiên âm quen thuộc “Ru-bên” và “Giô-sép”.
