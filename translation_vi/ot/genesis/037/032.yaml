source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֞וּ אֶת כְּתֹ֣נֶת הַ/פַּסִּ֗ים וַ/יָּבִ֨יאוּ֙ אֶל אֲבִי/הֶ֔ם וַ/יֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר נָ֗א הַ/כְּתֹ֧נֶת בִּנְ/ךָ֛ הִ֖וא אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: vi
  text: 'Rồi họ gửi chiếc áo dài tay ấy[a], đem nó đến cho cha mình và nói: “Chúng con tìm thấy cái này. Xin cha xác định[b] xem có phải là áo của con trai cha hay không.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chiếc áo trang trí”, “chiếc áo được trang hoàng lộng lẫy”; theo truyền thống là “chiếc áo nhiều màu”. Nghĩa của cụm từ Hê-bơ-rơ không chắc chắn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Xin cha nhận ra”. Cách dùng từ này đáng chú ý trong toàn bộ câu chuyện, nơi việc nhận ra và nhận lầm nhiều lần tái diễn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Rồi họ gửi
  rationale: Động từ שׁלח ở đây mang nghĩa tự nhiên là “gửi”; “rồi” thể hiện diễn tiến của mạch kể.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: chiếc áo dài tay
  rationale: כְּתֹנֶת là một loại áo dài mặc sát người; nghĩa chính xác của פַּסִּים không chắc chắn, nhưng có thể chỉ chiếc áo dài đến cổ tay hoặc cổ chân. Cách dịch này tránh đưa truyền thống “nhiều màu” vào chính văn khi tiếng Hê-bơ-rơ không nói rõ.
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: đem nó đến cho cha mình
  rationale: “Nó” chỉ chiếc áo vừa được nhắc đến; “cha mình” giữ nguyên cách gọi trong tiếng Hê-bơ-rơ mà không thêm tên Gia-cốp.
- source_word: זֹאת מָצָאנוּ
  choice: Chúng con tìm thấy cái này
  rationale: Giữ nguyên lời nói ngắn gọn và có tính đánh lừa của các anh; “chúng con” phù hợp với lời con cái thưa với cha trong tiếng Việt.
- source_word: הַכֶּר נָא
  choice: Xin cha xác định
  rationale: Dạng khiến khiến của נכר có nghĩa là nhận ra hoặc xác định danh tính. “Xin cha xác định” tự nhiên trong câu hỏi gián tiếp tiếp theo, còn sắc thái “nhận ra” được bảo lưu trong chú thích.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: xem có phải là áo của con trai cha hay không
  rationale: Giữ cấu trúc câu hỏi gián tiếp “có phải… hay không” và giữ cách nói xa cách “con trai cha” của các anh đối với Giô-sép.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “chúng con—cha” phù hợp quan hệ gia đình; cách nói “con trai cha” được giữ lại để thể hiện sự xa cách có chủ ý của các anh mà không giải thích thêm trong chính văn.
