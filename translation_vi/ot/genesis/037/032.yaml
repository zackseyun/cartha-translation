  source_fidelity: 'Bản dịch bảo toàn đầy đủ diễn tiến của nguyên văn: họ gửi chiếc áo, đem nó đến cho cha, rồi yêu cầu ông xác định. “Con trai cha” giữ được lối nói tạo khoảng cách của các anh em đối với Giô-sép. Câu hỏi gián tiếp “có phải ... hay không” phản ánh tốt אִם לֹא.'
