  text: וַ/יִּקְרַ֤ע יַעֲקֹב֙ שִׂמְלֹתָ֔י/ו וַ/יָּ֥שֶׂם שַׂ֖ק בְּ/מָתְנָ֑י/ו וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ יָמִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: vi
  text: Bấy giờ, Gia-cốp xé áo mình, quấn vải thô quanh hông[a] và để tang con trai mình suốt nhiều ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có thể chỉ vùng eo hoặc vùng hông.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: xé
  rationale: Động từ קרע trong bối cảnh tang chế chỉ hành động xé áo như dấu hiệu đau buồn; “xé” diễn đạt trực tiếp và tự nhiên.
- source_word: שִׂמְלֹתָיו
  choice: áo mình
  rationale: שִׂמְלָה chỉ y phục nói chung. “Áo mình” tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành một loại áo cụ thể.
- source_word: שַׂק
  choice: vải thô
  rationale: שַׂק là loại vải thô được dùng trong nghi thức than khóc. “Vải thô” rõ nghĩa với độc giả hiện đại và giữ được nét văn hóa của hành động tang chế.
- source_word: בְּמָתְנָיו
  choice: quanh hông
  rationale: מָתְנַיִם chỉ vùng eo/hông. “Quanh hông” diễn đạt tự nhiên vị trí quấn vải, còn nghĩa rộng hơn được ghi ở chú thích.
- source_word: וַיִּתְאַבֵּל
  choice: để tang
  rationale: Dạng Hitpael của אבל nói đến việc bước vào và thực hành trạng thái tang chế, không chỉ cảm xúc đau buồn; “để tang” phù hợp với hành động nghi lễ trong ngữ cảnh.
- source_word: עַל־בְּנוֹ
  choice: con trai mình
  rationale: Với động từ chỉ tang chế, עַל nêu người được để tang. Cấu trúc “để tang con trai mình” tự nhiên trong tiếng Việt, không cần dịch riêng giới từ.
- source_word: יָמִים רַבִּים
  choice: suốt nhiều ngày
  rationale: Cụm từ có nghĩa đen là “nhiều ngày”; thêm “suốt” làm rõ ý kéo dài mà không thay đổi nội dung.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và giữ chuỗi hành động tang chế cụ thể của nguyên văn. Dấu chú thích được đặt sau “hông”, đúng với từ בְּמָתְנָיו mà chú thích giải thích.
