base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: vi
  text: 'Nhưng khi Ru-bên nghe vậy, ông giải cứu Giô-sép khỏi tay họ và nói: “Chúng ta đừng lấy mạng nó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: khi ... nghe vậy
  rationale: שׁמע có nghĩa cơ bản là “nghe”. “Nghe vậy” tự nhiên trong tiếng Việt và quy chiếu về lời bàn giết Giô-sép ở câu trước; “khi” diễn đạt mạch thời gian của lời kể.
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: וַיַּצִּלֵהוּ
  choice: ông giải cứu Giô-sép
  rationale: Dạng Hiphil của נצל mang nghĩa “giải thoát, cứu khỏi nguy hiểm”. Lặp lại tên “Giô-sép” giúp câu tiếng Việt rõ chủ thể và đối tượng hơn so với hai đại từ liên tiếp, mà không thay đổi nghĩa.
- source_word: מִיָּדָם
  choice: khỏi tay họ
  rationale: Giữ hình ảnh Hê-bơ-rơ về bàn tay như biểu tượng của quyền lực và sự khống chế; cách nói này cũng tự nhiên trong tiếng Việt.
- source_word: וַיֹּאמֶר
  choice: và nói
  rationale: Cách dẫn lời trực tiếp đơn giản, phù hợp văn kể chuyện.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: Chúng ta đừng lấy mạng nó
  rationale: Cụm này theo sát nghĩa của thành ngữ Hê-bơ-rơ chỉ việc giáng đòn đến mất mạng. “Lấy mạng” truyền đạt rõ ý gây chết người và vẫn giữ sắc thái trực tiếp, trang trọng vừa phải.
theological_decisions:
- issue: Mức độ hành động cứu của Ru-bên
  choice: giải cứu Giô-sép khỏi tay họ
  alternative: cố giải cứu Giô-sép khỏi tay họ
  rationale: Động từ וַיַּצִּלֵהוּ được trình bày như một hành động trong mạch kể, không có từ tương đương với “cố”. Bản dịch không thêm sự giảm nhẹ về mức độ thành công.
- issue: Ý nghĩa của נֶפֶשׁ trong lời ngăn cản
  choice: đừng lấy mạng nó
  alternative: đừng đánh nó / đừng giết nó
  rationale: Trong cấu trúc với נכה, נֶפֶשׁ xác định đòn đánh là chí mạng. Cách dịch tránh hiểu câu này như cấm mọi hành vi đánh đập, đồng thời không thêm một động cơ thần học cho Ru-bên.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho Ru-bên và “nó” trong lời Ru-bên nói với các anh em về Giô-sép, phù hợp quan hệ gia đình và sắc thái hội thoại trong ngữ cảnh. Không cần chú thích vì thành ngữ được chuyển nghĩa rõ trong chính văn.
