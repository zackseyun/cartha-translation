    reason: lexical_alternative
  revision_rationale: Sửa cách diễn đạt tình trạng của các anh và đàn vật để truyền đạt tự nhiên hơn nghĩa của שָׁלוֹם, đồng thời duy trì sự lặp lại có chủ ý trong nguyên ngữ. Thu hẹp “đàn gia súc” thành cách gọi phù hợp hơn với צֹאן và thêm chú thích để không loại trừ dê. Các quan hệ xưng hô, địa danh và ý “báo tin trở lại” được giữ nguyên.
