  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: vi
  text: 'Ông nói với cậu: “Con hãy đi xem các anh con có được yên ổn không, và đàn chiên có được yên ổn không, rồi về báo tin cho cha.” Vậy ông sai cậu đi từ thung lũng Hếp-rôn, và cậu đến Si-chem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Con hãy đi
  rationale: Mệnh lệnh לֶךְ được diễn đạt là “hãy đi”; tiểu từ נָא làm lời sai bảo nhẹ hơn. Thêm “con” phù hợp quan hệ cha–con đã rõ trong ngữ cảnh và tự nhiên trong tiếng Việt.
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: xem ... có bình an không
  rationale: Giữ động từ cụ thể ראה là “xem”, đồng thời diễn đạt tự nhiên việc hỏi thăm tình trạng. “Bình an” bảo toàn trường nghĩa rộng của שׁלום, gồm sự yên ổn và khỏe mạnh.
- source_word: אַחֶיךָ
  choice: các anh con
  rationale: Trong ngữ cảnh, từ số nhiều giống đực chỉ những người anh của Giô-sép; “các anh” chính xác hơn từ chung “anh em” về quan hệ tuổi tác.
- source_word: הַצֹּאן
  choice: đàn gia súc
  rationale: צאן chỉ đàn súc vật nhỏ, thường gồm chiên và dê. “Đàn gia súc” tránh thu hẹp thành riêng đàn chiên, dù không thể hiện đầy đủ nét nghĩa ‘gia súc nhỏ’.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: rồi về báo tin cho cha
  rationale: Thể Hiphil của שוב cùng דָּבָר tạo thành ý báo tin trở lại. “Về báo tin” thể hiện rõ hành động quay về; “cho cha” tự nhiên hóa đại từ ngôi thứ nhất theo cách xưng hô cha–con trong tiếng Việt.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: từ thung lũng Hếp-rôn
  rationale: Dịch minh thị עֵמֶק là “thung lũng” và giữ quan hệ địa danh với Hếp-rôn.
- source_word: שְׁכֶמָה
  choice: đến Si-chem
  rationale: Hậu tố chỉ hướng -ה được diễn đạt bằng “đến”; Si-chem là dạng phiên âm tiếng Việt của địa danh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải. Dùng “ông/cậu” trong lời kể và “con/cha” trong lời thoại để phản ánh tự nhiên quan hệ cha–con; lặp “có bình an không” nhằm giữ sự lặp lại có chủ ý của שְׁלוֹם trong tiếng Hê-bơ-rơ.
