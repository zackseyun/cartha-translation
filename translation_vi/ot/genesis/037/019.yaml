  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: vi
  text: 'Họ nói với nhau: “Kìa, tay chuyên nằm mộng này[a] đang đến.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “chủ/người của những giấc mộng.” Trong ngữ cảnh này, cách gọi mang giọng chế nhạo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Động từ wayyiqtol tiếp nối diễn tiến câu chuyện; trong tiếng Việt, không cần thêm “và” hay “rồi” vì mạch kể đã rõ.
- source_word: אִישׁ אֶל־אָחִיו
  choice: với nhau
  rationale: Thành ngữ nghĩa đen là “mỗi người với anh em mình”, nhưng ở đây mang nghĩa tương hỗ; “với nhau” tự nhiên và chính xác trong tiếng Việt.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Thán từ hướng sự chú ý đến người đang tiến lại gần; “Kìa” tự nhiên, hiện đại và phù hợp với cảnh các anh em vừa trông thấy Giô-sép.
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: tay chuyên nằm mộng
  rationale: בַּעַל có thể chỉ người gắn liền hoặc nổi bật bởi điều gì. Cách nói “tay chuyên…” vừa truyền đạt ý “kẻ gắn với những giấc mộng” vừa giữ giọng chế nhạo của các anh em.
- source_word: הַלָּזֶה
  choice: tay ... ấy
  rationale: Đại từ chỉ thị này nhận diện Giô-sép với sắc thái xa cách hoặc khinh miệt; cấu trúc “tay… ấy” chuyển tải sắc thái đó tự nhiên trong tiếng Việt.
- source_word: בָּא
  choice: đang đến
  rationale: Phân từ của בוא diễn tả hành động đang diễn ra khi người nói quan sát; “đang đến” phản ánh đúng thể và ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. “Tay chuyên nằm mộng” là khẩu ngữ có kiểm soát, dùng trong lời thoại để tái hiện sắc thái khinh miệt mà không thô tục; dấu [a] được đặt ngay sau cụm từ cần chú thích.
