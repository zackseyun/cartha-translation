  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: vi
  text: Các anh của Giô-sép ghen tị với cậu, nhưng cha cậu ghi nhớ chuyện ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cha cậu giữ lời ấy trong lòng” hoặc “cha cậu giữ điều ấy”; nghĩa là ông lưu tâm và tiếp tục suy xét về điều đã được nói đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ ב֖וֹ
  choice: ghen tị với cậu
  rationale: Động từ קנא với giới từ ב diễn tả lòng ghen tị hướng về Giô-sép. “Ghen tị với” là cách nói tự nhiên trong tiếng Việt và phù hợp với phản ứng của các anh trước địa vị cùng những giấc mơ của cậu.
- source_word: אֶחָיו
  choice: các anh của Giô-sép
  rationale: Danh từ giống đực số nhiều chỉ những người anh em trai của Giô-sép; trong mạch truyện, họ là các anh của cậu. Cách diễn đạt này rõ đối tượng và tự nhiên trong tiếng Việt.
- source_word: וְאָבִיו
  choice: nhưng cha cậu
  rationale: 'וְ về hình thức là “và”, song ở đây nối hai phản ứng tương phản: các anh ghen tị, còn người cha lưu tâm. “Nhưng” thể hiện quan hệ diễn ngôn ấy một cách tự nhiên.'
- source_word: שָׁמַר
  choice: vẫn ghi nhớ
  rationale: שׁמר có nghĩa cơ bản là giữ, canh giữ; trong ngữ cảnh này là giữ điều đã nghe trong tâm trí và tiếp tục lưu tâm. “Vẫn ghi nhớ” truyền đạt sắc thái kéo dài mà không giải thích quá mức.
- source_word: אֶת־הַדָּבָר
  choice: chuyện ấy
  rationale: דבר có thể chỉ lời nói, sự việc hay vấn đề. “Chuyện ấy” tự nhiên trong tiếng Việt và đủ rộng để bao gồm lời kể về giấc mơ lẫn ý nghĩa của nó.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cậu” cho Giô-sép trong quan hệ với cha và các anh để tránh lặp tên, đồng thời giữ giọng kể tự nhiên. Dấu chú thích [a] được đặt sau mệnh đề liên quan đến cách hiểu שָׁמַר אֶת־הַדָּבָר.
