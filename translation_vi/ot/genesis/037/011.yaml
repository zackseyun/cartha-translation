- from: Các anh của Giô-sép ghen tị với cậu, nhưng cha cậu vẫn ghi nhớ chuyện ấy.[a]
  to: Các anh của Giô-sép ghen tị với cậu, nhưng cha cậu ghi nhớ chuyện ấy.[a]
  rationale: Bỏ “vẫn” để không thêm sắc thái tiếp diễn mà nguyên văn không nêu rõ. Chú thích vẫn bảo tồn các khả năng dịch của שָׁמַר אֶת־הַדָּבָר (“giữ lời/điều ấy”), đồng thời giải thích theo hướng không thu hẹp quy chiếu của הַדָּבָר.
