base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: vi
  text: 'Các anh nói với cậu: “Chẳng lẽ cậu sẽ thật sự làm vua trên chúng tôi sao? Chẳng lẽ cậu sẽ thật sự cai trị chúng tôi sao?” Vì những giấc mơ và những lời nói của cậu, họ lại càng ghét cậu hơn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: thật sự sẽ làm vua cai trị
  rationale: Giữ sắc thái nhấn mạnh của cấu trúc nguyên thể tuyệt đối đi với động từ cùng gốc, đồng thời thể hiện rõ gốc מלך mang ý nghĩa làm vua/cai trị.
- source_word: מָשׁוֹל תִּמְשֹׁל
  choice: thật sự sẽ thống trị
  rationale: Phân biệt với מלך bằng “thống trị”, đồng thời giữ phép nhấn mạnh và giọng chất vấn đầy hoài nghi.
- source_word: עַל חֲלֹמֹתָיו וְעַל דְּבָרָיו
  choice: vì những giấc mơ và những lời cậu kể
  rationale: עַל trong ngữ cảnh này nêu nguyên nhân. “Những lời cậu kể” tự nhiên trong tiếng Việt và chỉ các lời Giô-sép vừa nói về giấc mơ, nhưng không thu hẹp “giấc mơ” thành chỉ nội dung lời kể.
theological_decisions:
- issue: Hai động từ מלך và משל có phải cùng chỉ một hành động hay mang sắc thái khác nhau
  choice: Dùng hai cách diễn đạt “làm vua cai trị” và “thống trị”
  alternative: Dùng cùng một từ “cai trị” cho cả hai vế
  rationale: Bản dịch giữ sự song hành nhưng không xóa khác biệt từ vựng trong nguyên văn; câu không quyết định sâu hơn về bản chất quyền cai trị tương lai của Giô-sép.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải. Đại từ “các anh—cậu/chúng tôi” phù hợp quan hệ anh em và cho thấy thái độ xa cách, đối kháng trong lời nói.
