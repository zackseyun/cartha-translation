  yaml_path: translation/ot/genesis/037/005.yaml
  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: vi
  text: Giô-sép nằm mơ[a] và kể giấc mơ ấy cho các anh mình; họ lại càng ghét Giô-sép hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ nói sát nghĩa: “Giô-sép mơ một giấc mơ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: Giô-sép nằm mơ
  rationale: Cấu trúc đồng căn trong tiếng Hê-bơ-rơ có nghĩa đen là “Giô-sép mơ một giấc mơ.” Tiếng Việt tự nhiên diễn đạt là “nằm mơ”; chú thích giữ lại đặc điểm nguyên văn.
- source_word: וַיַּגֵּד
  choice: kể giấc mơ ấy
  rationale: Động từ נגד ở dạng này có nghĩa là kể, báo hoặc cho biết. Lặp lại “giấc mơ ấy” tự nhiên và làm rõ đối tượng được kể.
- source_word: לְאֶחָיו
  choice: cho các anh mình
  rationale: Trong ngữ cảnh, אחים chỉ các anh em trai của Giô-sép, và các nhân vật này là những người anh; “mình” là đại từ sở hữu tự nhiên trong lối kể tiếng Việt.
- source_word: וַיּוֹסִפוּ עוֹד
  choice: lại càng ... hơn
  rationale: Cụm từ diễn tả mức độ gia tăng thêm; “lại càng ... hơn” vừa tự nhiên vừa giữ sắc thái leo thang.
- source_word: שְׂנֹא אֹתוֹ
  choice: ghét chàng
  rationale: Dạng nguyên mẫu đi sau יסף tạo nghĩa “càng ghét người ấy hơn.” “Chàng” là đại từ kể chuyện trang trọng, tránh lặp tên mà vẫn chỉ rõ Giô-sép.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, sáng rõ và trang trọng vừa phải. Không thêm từ tương đương với “bấy giờ” hay “nay” ở đầu câu vì nguyên văn chỉ có liên từ nối tiếp diễn tiến truyện. Dùng dấu chấm phẩy để thể hiện chuyển biến từ việc kể giấc mơ sang phản ứng gia tăng của các anh.
