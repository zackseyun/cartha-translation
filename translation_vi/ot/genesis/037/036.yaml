base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: vi
  text: Còn người Mê-đa-nít[a] đã bán chàng sang Ai Cập cho Phô-ti-pha, một quan chức[b] của Pha-ra-ôn, chỉ huy đội cận vệ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ chép “người Mê-đa-nít”; theo mạch truyện chung quanh và một số bản dịch cổ, theo truyền thống có thể hiểu là “người Ma-đi-an.”
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “một hoạn quan của Pha-ra-ôn” hoặc “một viên chức trong triều của Pha-ra-ôn.” Từ Hê-bơ-rơ này có thể chỉ một hoạn quan theo nghĩa đen hoặc một quan chức hoàng gia.
    reason: lexical_alternative
  - marker: c
    text: 'Nghĩa đen: “người đứng đầu những kẻ giết mổ.” Trong bối cảnh hoàng gia, cụm từ này có lẽ chỉ người chỉ huy đội cận vệ hoặc lực lượng thi hành án.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: Còn người Mê-đa-nít
  rationale: Dịch sát tên dân tộc trong bản Hê-bơ-rơ là מְדָנִים (Mê-đa-nít). Liên từ וְ được chuyển là “Còn” để đánh dấu sự chuyển cảnh trong mạch kể.
- source_word: מָכְרוּ אֹתוֹ
  choice: đã bán chàng
  rationale: Động từ hoàn thành trong mạch tự sự được dịch tự nhiên bằng “đã bán”; “chàng” chỉ Giô-sép và phù hợp văn phong kể chuyện trang trọng.
- source_word: אֶל מִצְרָיִם
  choice: sang Ai Cập
  rationale: Giới từ אֶל diễn tả hướng đến; “sang Ai Cập” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái chuyển dịch đến nơi ấy.
- source_word: לְפוֹטִיפַר
  choice: cho Phô-ti-pha
  rationale: Giới từ לְ đánh dấu người mua; tên riêng được phiên âm theo cách quen dùng trong tiếng Việt.
- source_word: סְרִיס פַרְעֹה
  choice: một quan chức của Pha-ra-ôn
  rationale: סָרִיס có thể chỉ hoạn quan theo nghĩa đen hoặc một viên chức hoàng gia. “Quan chức” không quyết đoán quá mức và hợp với chức vụ được nêu tiếp theo.
- source_word: שַׂר הַטַּבָּחִים
  choice: chỉ huy đội cận vệ
  rationale: Nghĩa đen liên quan đến người giết mổ hoặc hành quyết, nhưng trong bối cảnh triều đình, cụm từ có khả năng chỉ người đứng đầu lực lượng cận vệ hoặc thi hành án của vua.
