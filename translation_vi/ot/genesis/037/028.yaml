  rationale: Chỉ thay “cậu” bằng tên riêng “Giô-sép” để duy trì giọng kể trung tính, trang trọng vừa phải và gần với sự lặp lại tên trong nguyên văn. Không thay đổi ý nghĩa, chuỗi hành động, hay mức độ mơ hồ về chủ thể.
