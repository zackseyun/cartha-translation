source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: vi
  text: Bấy giờ, những người Ma-đi-an, là các thương nhân, đi ngang qua. Họ kéo Giô-sép lên, đưa Giô-sép ra khỏi hố, rồi bán Giô-sép cho người Ích-ma-ên với giá hai mươi miếng bạc[a]. Sau đó, họ đưa Giô-sép sang Ai Cập.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “hai mươi bạc”; đơn vị không được nêu rõ.'
    reason: lexical_alternative
  - marker: b
    text: Các động từ “kéo”, “đưa lên”, “bán” và “đưa đi” trong tiếng Hê-bơ-rơ đều ở số nhiều. Vì câu nhắc đến cả thương nhân Ma-đi-an lẫn người Ích-ma-ên, chủ thể của từng hành động có phần không rõ.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: đi ngang qua
  rationale: Diễn đạt tự nhiên chuyển động đi qua địa điểm, không thêm ý rằng họ vừa đến nơi.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: những người Ma-đi-an, là các thương nhân
  rationale: Giữ cả danh từ chỉ người, tên dân tộc và vai trò buôn bán của nhóm này, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: kéo Giô-sép lên, đưa cậu ra
  rationale: Phản ánh hai động từ liên tiếp—kéo và đưa lên khỏi hố—mà tránh lặp từ vụng về trong tiếng Việt.
- source_word: מִן הַבּוֹר
  choice: ra khỏi hố
  rationale: בּוֹר có thể là hố hoặc bể chứa nước; “hố” là cách gọi rõ ràng, phù hợp với văn cảnh mà không xác định quá mức.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: cho người Ích-ma-ên
  rationale: Giữ nguyên nhóm người được nêu rõ là bên nhận trong giao dịch.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: với giá hai mươi miếng bạc
  rationale: Nguyên văn chỉ nói “hai mươi bạc” mà không nêu đơn vị; “miếng bạc” là cách bổ sung tự nhiên nhưng không xác quyết đó là siếc-lơ.
- source_word: מִצְרָיְמָה
  choice: sang Ai Cập
  rationale: Hậu tố chỉ hướng diễn tả chuyển động tới Ai Cập; “sang Ai Cập” tự nhiên trong lời kể tiếng Việt.
theological_decisions:
- issue: Chủ thể của các động từ số nhiều sau khi câu nhắc đến người Ma-đi-an và người Ích-ma-ên
  choice: Dùng đại từ số nhiều “họ” mà không xác định thêm nhóm nào thực hiện từng hành động
  alternative: Xác định tất cả các hành động là do thương nhân Ma-đi-an thực hiện, hoặc cho rằng việc vận chuyển là do người Ích-ma-ên thực hiện
  rationale: Bản Hê-bơ-rơ dùng các động từ số nhiều và để ngỏ phần nào chủ thể quy chiếu trong chuỗi hành động. Bản dịch không áp đặt một cách dung hòa hay giải thích vượt quá câu văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cậu” cho Giô-sép ở lần nhắc thứ hai để câu tự nhiên, nhưng lặp lại tên ở hành động bán nhằm giữ trọng tâm của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
