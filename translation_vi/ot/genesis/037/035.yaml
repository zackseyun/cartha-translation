  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: vi
  text: 'Bấy giờ, tất cả các con trai và con gái ông đều đứng dậy để an ủi ông, nhưng ông không chịu để ai an ủi và nói: “Ta sẽ để tang mà đi xuống Sheol[a], đến với con trai ta.”[b] Cha ông cũng khóc thương ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cõi người chết”; tiếng Hê-bơ-rơ là “Sheol.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ta sẽ đi xuống Sheol đến với con trai ta trong cảnh tang tóc.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: đều đứng dậy
  rationale: Giữ nghĩa cơ bản của động từ קום trong mạch kể chuyện, đồng thời dùng “đều” để thể hiện כָל.
- source_word: כָל־בָּנָיו וְכָל־בְּנֹתָיו
  choice: tất cả các con trai và con gái ông
  rationale: Giữ nguyên sự phân biệt rõ giữa con trai và con gái trong tiếng Hê-bơ-rơ, thay vì gộp thành “các con”.
- source_word: לְנַחֲמוֹ / לְהִתְנַחֵם
  choice: để an ủi ông / không chịu được an ủi
  rationale: Hai dạng của נחם được diễn đạt bằng cùng một trường từ vựng, phản ánh hành động an ủi của gia đình và sự khước từ của Gia-cốp.
- source_word: וַיְמָאֵן
  choice: không chịu
  rationale: Diễn đạt tự nhiên sự khước từ hoặc không sẵn lòng tiếp nhận sự an ủi.
- source_word: אֵרֵד
  choice: ta sẽ … đi xuống
  rationale: Giữ hình ảnh chuyển động đi xuống của ירד, vốn gắn với Sheol trong câu.
- source_word: אֶל־בְּנִי
  choice: đến với con trai ta
  rationale: Giữ hướng nghĩa của giới từ אֶל mà không thêm lời giải thích về nơi chốn hay tình trạng của người con.
- source_word: אָבֵל
  choice: để tang
  rationale: Thể hiện trạng thái của một người đang chịu tang; cách nói này tự nhiên trong tiếng Việt và vẫn gắn với hành động đi xuống.
- source_word: שְׁאֹלָה
  choice: xuống Sheol
  rationale: Phiên âm thuật ngữ Hê-bơ-rơ để không thu hẹp nghĩa thành riêng phần mộ và không áp đặt một quan niệm hậu thế về đời sau.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: Rồi cha cậu khóc thương cậu
  rationale: Giữ chủ ngữ “cha cậu” và đối tượng được khóc thương là người con; “rồi” nối tiếp mạch kể tự nhiên.
theological_decisions:
- issue: Cách dịch שְׁאוֹל
  choice: Sheol
  alternative: mồ mả; cõi người chết
  rationale: Thuật ngữ này có phạm vi nghĩa rộng hơn một ngôi mộ cụ thể. Giữ “Sheol” bảo toàn nét mơ hồ và sức nặng thần học của bản Hê-bơ-rơ mà không đồng nhất nó với một giáo lý hậu thế.
- issue: Quan hệ cú pháp giữa “đến với con trai ta,” “để tang” và “xuống Sheol”
  choice: “Ta sẽ để tang mà đi xuống Sheol, đến với con trai ta”
  alternative: “Ta sẽ đi xuống Sheol đến với con trai ta trong cảnh tang tóc”
  rationale: Trật tự Hê-bơ-rơ cô đọng và có thể được sắp xếp theo hơn một cách trong tiếng Việt. Bản chính ưu tiên câu tự nhiên nhưng không giải thích thêm con trai đang ở đâu; chú thích lưu lại phương án bám sát cấu trúc hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách xưng “ta” trong lời Gia-cốp để phù hợp với lời của người cha cao niên trong bối cảnh cổ đại. Dùng “Sheol” kèm chú thích nhằm bảo toàn thuật ngữ nguồn; tránh diễn giải thành “địa ngục.”
