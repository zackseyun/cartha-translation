revisions:
- from: Họ thấy cậu từ đằng xa, và trước khi cậu đến gần họ, họ đã lập mưu chống lại cậu[a] để giết cậu.
  to: Họ thấy cậu từ đằng xa, và trước khi cậu đến gần họ, họ lập mưu chống lại cậu[a] để giết cậu.
  rationale: Chỉ bỏ “đã” để giữ trình tự trần thuật không đánh dấu của nguyên ngữ và chỉnh chú thích để phương án thay thế sát hơn với động từ Hê-bơ-rơ trong ngữ cảnh. Các yếu tố nghĩa khác, gồm khoảng cách, thời điểm trước khi đến gần, đối tượng của âm mưu và mục đích giết người, đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
