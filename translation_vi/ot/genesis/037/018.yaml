base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: vi
  text: Họ thấy cậu từ đằng xa, và trước khi cậu đến gần họ, họ lập mưu chống lại cậu[a] để giết cậu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ mưu tính chống lại cậu.” Động từ Hê-bơ-rơ có thể chỉ việc mưu tính hoặc hành động gian xảo; ở đây, cụm “để giết cậu” nói rõ mục đích sát hại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: Họ thấy cậu từ đằng xa
  rationale: Diễn đạt tự nhiên ý nghĩa trực tiếp của động từ ראה cùng מֵרָחֹק; đại từ “cậu” phù hợp với Giô-sép trong quan hệ với các anh mà không thêm tên riêng vốn không có trong câu.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: và trước khi cậu đến gần họ
  rationale: Giữ quan hệ nối tiếp và mệnh đề thời gian của וּבְטֶרֶם; “đến gần họ” bảo toàn sắc thái không gian của קרב.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: họ đã lập mưu chống lại cậu
  rationale: Dạng Hitpael của נכל chỉ việc mưu tính hoặc hành động gian xảo với ác ý. “Lập mưu chống lại” vừa tự nhiên vừa giữ đối tượng của âm mưu.
- source_word: לַהֲמִיתוֹ
  choice: để giết cậu
  rationale: 'Động từ מות ở Hiphil, dạng nguyên mẫu với tiền tố ל, nêu mục đích của âm mưu: làm cho cậu chết.'
