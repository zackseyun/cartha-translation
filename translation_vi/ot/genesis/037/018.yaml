review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: họ nhìn thấy Giô-sép từ xa, trước khi cậu đến gần họ, họ mưu tính nhằm giết cậu. Tuy nhiên, thì quá khứ hoàn thành trong “họ đã lập mưu” không được nguyên ngữ đòi hỏi và có thể làm lệch trình tự kể chuyện: việc lập mưu xảy ra sau khi họ thấy cậu và trước khi cậu đến gần, không phải là một hành động đã hoàn tất trước mốc quá khứ khác.'
  naturalness: “Từ đằng xa” và “lập mưu chống lại” đều tự nhiên. Bỏ “đã” tạo nhịp trần thuật hiện đại, rõ ràng hơn. “Cậu” phù hợp với ngữ cảnh Giô-sép và các anh, tuy có sắc thái thân mật vừa phải; trong mạch truyện này vẫn chấp nhận được.
  terminology: “Lập mưu ... để giết” diễn đạt chính xác ý nghĩa thù nghịch có chủ ý của וַיִּתְנַכְּלוּ ... לַהֲמִיתוֹ. Chú thích nên giữ phương án từ vựng gần với nghĩa “mưu tính/chống lại” hơn là “dùng mưu gian đối phó”, vốn có thể nghe như một cách ứng xử thay vì một âm mưu.
  issues:
  - severity: low
    issue: Thì quá khứ hoàn thành “đã lập mưu”
    rationale: Wayyiqtol וַיִּתְנַכְּלוּ tiếp tục chuỗi hành động trần thuật. Tiếng Việt không cần “đã”; bỏ từ này tránh gợi ý không cần thiết rằng âm mưu hoàn tất trước một sự kiện quá khứ làm mốc.
  - severity: low
    issue: Cách diễn đạt trong chú thích “dùng mưu gian đối phó với cậu”
    rationale: Đây là khả năng diễn giải được, nhưng không sát bằng “mưu tính/chống lại cậu” đối với động từ trong ngữ cảnh âm mưu giết người. Điều chỉnh giúp chú thích phản ánh lựa chọn từ vựng mà không làm yếu ý định sát hại.
  revised_text: Họ thấy cậu từ đằng xa, và trước khi cậu đến gần họ, họ lập mưu chống lại cậu[a] để giết cậu.
