    rationale: אֶחָיו nghĩa là “anh em của chàng”; từ “anh” trong tiếng Việt mặc định chỉ người anh lớn tuổi và có thể loại các em trai của Giô-sép.
  - severity: low
    issue: “Cậu” trong lời kể
    rationale: Từ này có sắc thái hội thoại và kém phù hợp với văn phong tường thuật trang trọng của bản dịch.
  - severity: medium
