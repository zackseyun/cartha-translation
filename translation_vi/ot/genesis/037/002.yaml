  edition: WLC
  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: vi
  text: 'Đây là dòng dõi[a] của Gia-cốp: Giô-sép, lúc mười bảy tuổi, chăn bầy cùng các anh em mình. Chàng còn trẻ, ở cùng các con trai của Bi-la và các con trai của Xinh-pa; Bi-la và Xinh-pa là các vợ của cha chàng.[b] Giô-sép trình cho cha họ chuyện xấu về họ.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đây là câu chuyện” hoặc “Đây là lịch sử gia đình của Gia-cốp.” Từ Hê-bơ-rơ này thường mở đầu một phần mới trong Sáng Thế Ký và có thể nói đến những gì phát sinh từ một người, chứ không chỉ các hậu duệ của người ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cấu trúc câu Hê-bơ-rơ ở đây khó xác định. Cũng có thể ngắt: “Chàng chăn bầy cùng các anh em mình, và chàng còn trẻ, ở cùng các con trai của Bi-la và các con trai của Xinh-pa.” Cụm “các vợ của cha chàng” trong nguyên văn chỉ Bi-la và Xinh-pa.'
    reason: source_ambiguity
  - marker: c
    text: Nguyên văn là “cha của họ”, dùng sở hữu số nhiều và nói đến Gia-cốp là người cha chung của Giô-sép và các anh em ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: dòng dõi
  rationale: Giữ sắc thái về dòng tộc và vai trò tiêu đề cấu trúc quen thuộc của từ này trong Sáng Thế Ký; chú thích nêu nghĩa rộng hơn là “câu chuyện/lịch sử gia đình” để tránh giới hạn từ này vào danh sách hậu duệ.
- source_word: הָיָה רֹעֶה
  choice: chăn bầy
  rationale: Diễn đạt hoạt động chăn giữ đang diễn ra, tự nhiên trong tiếng Việt và vẫn giữ hình ảnh người chăn.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: chăn bầy cùng các anh mình
  rationale: Phản ánh cách hiểu tự nhiên rằng Giô-sép làm công việc chăn bầy cùng các anh, chứ không phải chăn các anh mình.
- source_word: נַעַר
  choice: một thiếu niên
  rationale: Phù hợp với tuổi mười bảy đã được nêu rõ và giữ sắc thái còn trẻ mà không khiến người đọc nghĩ đến một trẻ nhỏ.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: ở cùng các con trai của Bi-la và các con trai của Xinh-pa
  rationale: Cấu trúc Hê-bơ-rơ khó xác định chính xác; “ở cùng” giữ quan hệ đồng hành/liên kết mà không áp đặt ý rằng Giô-sép phục vụ họ.
- source_word: נְשֵׁי אָבִיו
  choice: hai người này là vợ của cha cậu
  rationale: Xác định rõ Bi-la và Xinh-pa là các bà vợ của Gia-cốp, đồng thời tránh sự nhập nhằng trong tiếng Việt rằng “các con trai” là vợ của ông.
- source_word: דִּבָּתָם רָעָה
  choice: những điều không hay về họ
  rationale: Diễn đạt tự nhiên một báo cáo bất lợi hoặc xấu về các anh; không quyết định rằng nội dung ấy nhất thiết là đúng hay là lời vu khống.
- source_word: אֶל אֲבִיהֶם
  choice: cho cha của họ
  rationale: Giữ đại từ sở hữu số nhiều của nguyên văn, cho thấy Gia-cốp là người cha chung của Giô-sép và các anh.
theological_decisions:
- issue: Tính xác thực hay vu khống của lời Giô-sép báo
  choice: Không xác định; dịch là “những điều không hay về họ”
  alternative: “lời vu cáo họ” hoặc “việc xấu họ đã làm”
  rationale: Nguyên văn mô tả báo cáo là xấu/bất lợi nhưng câu này không tự nó phân định rõ đó là lời vu khống hay một báo cáo đúng về hành vi xấu.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Gia-cốp, Giô-sép, Bi-la, Xinh-pa. Câu được chia vừa phải để tránh kéo dài, nhưng vẫn giữ mối liên hệ giữa việc chăn bầy và nhóm anh em được nêu cụ thể.'
