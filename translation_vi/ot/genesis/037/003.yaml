base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: vi
  text: Ít-ra-ên yêu Giô-sép hơn tất cả các con trai của mình, vì Giô-sép là người con ông có vào lúc ông đã cao tuổi; và ông làm cho Giô-sép một chiếc áo được trang trí lộng lẫy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “một chiếc áo nhiều màu sắc.” Nghĩa của cụm từ Hê-bơ-rơ này không chắc chắn; nó có thể chỉ một chiếc áo được trang trí lộng lẫy, hoặc một chiếc áo dài đến cổ tay và mắt cá chân, chứ không nhất thiết nói riêng về màu sắc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: Ít-ra-ên
  rationale: Giữ tên riêng được dùng trong bản Hê-bơ-rơ thay vì đổi thành Gia-cốp. Liên từ וְ không cần được dịch riêng ở đầu câu vì tiếng Việt kể chuyện tự nhiên không đòi hỏi từ nối tại đây.
- source_word: אָהַב
  choice: yêu
  rationale: Dịch theo nghĩa thông thường của động từ; bối cảnh cho thấy sự thiên vị, nhưng không thay nghĩa từ vựng thành “ưu ái”.
- source_word: מִכָּל בָּנָיו
  choice: hơn tất cả các con trai mình
  rationale: Diễn đạt rõ cấu trúc so sánh của מִן và giữ nghĩa giống đực số nhiều của בָּנִים.
- source_word: כִּי
  choice: vì
  rationale: Trong câu này, כִּי giới thiệu lý do Ít-ra-ên đặc biệt yêu Giô-sép.
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: Giô-sép là người con ông có khi tuổi đã cao
  rationale: Diễn đạt tự nhiên thành ngữ chỉ người con gắn với tuổi già của người cha, đồng thời làm rõ đại từ để tránh nhập nhằng trong tiếng Việt.
- source_word: וְעָשָׂה לוֹ
  choice: và ông may cho Giô-sép
  rationale: “May” là cách diễn đạt tự nhiên trong tiếng Việt khi vật được làm là y phục; tên Giô-sép được lặp lại để xác định rõ người nhận.
- source_word: כְּתֹנֶת
  choice: áo choàng
  rationale: Từ này chỉ một loại áo dài mặc trên thân; “áo choàng” dễ hiểu với độc giả hiện đại hơn thuật ngữ chuyên môn “áo tunic”.
- source_word: פַּסִּים
  choice: được trang trí lộng lẫy
  rationale: Chọn một cách diễn đạt dễ đọc và phù hợp với khả năng từ này mô tả một y phục đặc biệt, nhưng đánh dấu chú thích vì nghĩa chính xác còn chưa chắc chắn.
