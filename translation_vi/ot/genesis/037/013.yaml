  text: וַ/יֹּ֨אמֶר יִשְׂרָאֵ֜ל אֶל יוֹסֵ֗ף הֲ/ל֤וֹא אַחֶ֨י/ךָ֙ רֹעִ֣ים בִּ/שְׁכֶ֔ם לְכָ֖/ה וְ/אֶשְׁלָחֲ/ךָ֣ אֲלֵי/הֶ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: vi
  text: 'Bấy giờ, Ít-ra-ên nói với Giô-sép: “Các anh con chẳng đang chăn đàn[a] ở Si-chem sao? Nào, cha sẽ sai con đến với họ.” Giô-sép thưa: “Con đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chăn dắt” hoặc “trông nom đàn vật”.
    reason: Từ Hê-bơ-rơ chỉ hoạt động chăn giữ, trông nom đàn vật; các cách dịch này nêu những phương án tự nhiên mà không xác định loài vật.
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Ít-ra-ên
  rationale: Giữ đúng tên được dùng trong bản Hê-bơ-rơ ở câu này, thay vì đổi thành Gia-cốp; dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: הֲלוֹא
  choice: chẳng ... sao?
  rationale: Giữ hình thức câu hỏi tu từ mong đợi sự đồng tình, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: אַחֶיךָ
  choice: các anh con
  rationale: Trong ngữ cảnh, từ này chỉ các anh của Giô-sép; cách xưng hô “con” thể hiện tự nhiên quan hệ cha-con mà không làm thay đổi đối tượng quy chiếu.
- source_word: רֹעִים
  choice: đang chăn bầy
  rationale: Phân từ diễn tả hoạt động chăn giữ đàn vật; “đang chăn bầy” vừa sát nghĩa vừa tự nhiên, đồng thời tránh giới hạn đàn vật thành một loài không được nêu rõ tại đây.
- source_word: בִּשְׁכֶם
  choice: ở Si-chem
  rationale: Giới từ בְּ chỉ địa điểm; “ở” là cách diễn đạt tiếng Việt tự nhiên, và địa danh được phiên âm là “Si-chem”.
- source_word: לְכָה
  choice: Con hãy đi
  rationale: Mệnh lệnh của động từ הלך có thể mang sắc thái thúc giục “nào/hãy đi”; trong bối cảnh người cha sai con đến nơi khác, “Con hãy đi” truyền đạt hướng chuyển động tự nhiên nhất.
- source_word: וְאֶשְׁלָחֲךָ
  choice: cha sẽ sai con
  rationale: Ngôi thứ nhất được chuyển thành “cha” theo quan hệ người nói-người nghe trong tiếng Việt; thì tương lai và ý sai phái được giữ rõ.
- source_word: אֲלֵיהֶם
  choice: đến với họ
  rationale: Giữ đại từ số nhiều quy chiếu về các anh của Giô-sép, không lặp lại danh từ khi không cần thiết.
- source_word: הִנֵּנִי
  choice: Con đây
  rationale: Đây là công thức tự trình diện, bày tỏ sự sẵn sàng đáp lời; “Con đây” tự nhiên trong lời người con thưa với cha và giữ được tính ngắn gọn của nguyên văn.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ thân tộc “cha/con” và cách gọi “các anh con” được dùng để lời thoại tự nhiên trong tiếng Việt. Tên riêng được phiên âm theo lối quen thuộc: Ít-ra-ên, Giô-sép, Si-chem.'
