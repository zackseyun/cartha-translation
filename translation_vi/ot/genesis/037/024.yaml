  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: vi
  text: Rồi họ đem chàng ném xuống hố[a]. Hố ấy trống không, không có nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bể chứa nước”; từ Hê-bơ-rơ bor có thể chỉ một hố hoặc bể dùng để chứa nước, phù hợp với lời giải thích rằng trong đó không có nước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: Rồi họ bắt chàng
  rationale: Dạng kể chuyện với waw nối tiếp đưa diễn biến tiến lên. לקח cơ bản là “lấy/bắt”; trong ngữ cảnh họ khống chế Giô-sép, “bắt chàng” tự nhiên hơn “đem chàng đi” mà không tăng sắc thái mạnh đến mức “tóm lấy”.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: và ném
  rationale: השליך thường có nghĩa “ném/quăng”. “Ném” là cách diễn đạt hiện đại, rõ ràng, thể hiện hành động bạo lực mà không cường điệu như “quẳng mạnh”.
- source_word: הַבֹּרָה
  choice: xuống hố[a]
  rationale: בּוֹר có thể chỉ hố, bể chứa nước hoặc một hốc sâu. “Hố” giữ được nghĩa rộng của từ Hê-bơ-rơ; “xuống” diễn đạt tự nhiên hậu tố chỉ hướng -ָה. Khả năng đây là bể chứa nước được giữ trong chú thích.
- source_word: וְהַבּוֹר רֵק
  choice: Hố ấy trống không
  rationale: Mệnh đề cung cấp lời giải thích về cái hố. “Trống không” chuyển tải rõ רֵק và phù hợp văn phong kể chuyện tiếng Việt.
- source_word: אֵין בּוֹ מָיִם
  choice: không có nước
  rationale: Câu này xác định cụ thể cái hố trống theo nghĩa không có nước. Tiếng Việt có thể lược đại từ chỉ nơi chốn sau khi vừa nêu “hố ấy” mà vẫn giữ nguyên nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chàng” để chỉ Giô-sép nhằm tránh lặp và giữ sắc thái tường thuật; cấu trúc ngắn tái hiện nhịp câu Hê-bơ-rơ. Mọi dấu chú thích trong phần văn bản đều có mục chú thích tương ứng.
