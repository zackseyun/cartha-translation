  terminology: “Hố” là lựa chọn rộng, thích hợp cho בּוֹר; chú thích “bể chứa nước” bảo lưu khả năng nghĩa cụ thể hơn. “Chàng” phù hợp văn phong tường thuật trang trọng vừa phải trong ngữ cảnh này.
