  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: vi
  text: 'Ông trở lại chỗ các anh em mình và nói[a]: “Cậu bé không còn ở đó nữa! Còn tôi—tôi sẽ đi đâu đây?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Cậu bé không có ở đó; còn tôi—tôi sẽ đi đâu?” Câu hỏi thành ngữ Hê-bơ-rơ này diễn tả tình thế bế tắc, có thể hiểu là: “Tôi phải làm sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Ông trở lại
  rationale: Động từ שׁוב ở dạng kể chuyện chỉ việc trở lại; “trở lại” tự nhiên và giữ đúng trình tự tự sự.
- source_word: אֶל אֶחָיו
  choice: chỗ các anh em mình
  rationale: אֶל chỉ hướng đến; אֶחָיו là “các anh em của ông”. Thêm “chỗ” giúp câu tiếng Việt tự nhiên khi chỉ nơi họ đang ở.
- source_word: וַיֹּאמַר
  choice: và nói
  rationale: Giữ liên kết tự sự và lời nói trực tiếp một cách gọn, tự nhiên.
- source_word: הַיֶּלֶד
  choice: thằng bé
  rationale: יֶלֶד nghĩa là cậu bé hoặc đứa trẻ. Trong lời nói đầy hoảng hốt của Ru-bên về em trai mình, “thằng bé” là cách gọi khẩu ngữ tự nhiên, không mang sắc thái cổ.
- source_word: אֵינֶנּוּ
  choice: không còn ở đó nữa
  rationale: Cụm này nói đến sự vắng mặt, theo nghĩa đen gần với “nó không ở đó”; cách dịch này không hàm ý chắc chắn rằng Giô-sép đã chết.
- source_word: וַאֲנִי
  choice: Còn tôi—tôi
  rationale: Đại từ được nêu rõ tạo chuyển hướng nhấn mạnh sang tình cảnh của Ru-bên; dấu gạch ngang và việc lặp “tôi” giữ sự đứt quãng, hoảng hốt của câu Hê-bơ-rơ.
- source_word: אָנָה אֲנִי בָא
  choice: tôi biết đi đâu bây giờ?
  rationale: 'Theo sát chữ là “tôi đi/đến đâu?”, nhưng trong ngữ cảnh đây là thành ngữ diễn tả sự bế tắc: “tôi biết đi đâu?” hoặc “tôi phải làm sao?”. “Bây giờ” làm rõ sắc thái cấp bách vốn có trong ngữ cảnh mà không giải quyết quá mức sự mơ hồ.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời thoại giữ nhịp đứt quãng cùng sự hoảng hốt của Ru-bên. “Không còn ở đó nữa” bảo toàn ý vắng mặt, không diễn giải thành cái chết.
