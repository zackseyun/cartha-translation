  naturalness: “Thằng bé” có sắc thái khẩu ngữ và có thể hơi thiếu tôn trọng trong văn phong Kinh Thánh hiện đại. “Cậu bé” tự nhiên, trung tính hơn. Câu “Còn tôi—tôi sẽ đi đâu đây?” vẫn giữ được nhịp ngắt và tâm trạng hoảng hốt.
  terminology: Không có thuật ngữ thần học cần điều chỉnh. Giữ “các anh em mình” và không thêm tên Ru-bên vì tên không xuất hiện trong chính câu Hê-bơ-rơ.
