base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: vi
  text: Nào, chúng ta hãy bán nó cho những người Ích-ma-ên, nhưng đừng động tay đến nó, vì nó là em chúng ta, là người ruột thịt của chúng ta.” Các anh em ông nghe theo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nghe theo” cũng có thể dịch là “nghe” hoặc “đồng ý” trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Nào
  rationale: Mệnh lệnh số nhiều của הלך được dùng như lời thúc giục cùng hành động; “Nào” tự nhiên trong lời bàn bạc và không hàm ý di chuyển theo nghĩa đen.
- source_word: וְנִמְכְּרֶנּוּ
  choice: chúng ta hãy bán nó
  rationale: Dạng khích lệ ngôi thứ nhất số nhiều diễn đạt một đề nghị; “hãy” giữ rõ sắc thái ý chí.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: cho những người Ích-ma-ên
  rationale: Chuyển đúng tên tộc người có giới từ; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: chứ đừng tra tay vào nó
  rationale: Giữ hình ảnh “tay” của nguyên văn đồng thời dùng thành ngữ tiếng Việt dễ hiểu, chỉ việc không trực tiếp làm hại Giô-sép.
- source_word: כִּי אָחִינוּ בְשָׂרֵנוּ הוּא
  choice: vì nó là em chúng ta, là thịt xương của chúng ta
  rationale: “Em” phù hợp quan hệ của Giô-sép với những người đang nói; “thịt xương” bảo tồn hình ảnh thân tộc cụ thể của בשר mà vẫn tự nhiên trong tiếng Việt.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: Các anh em nó nghe theo
  rationale: שמע trong ngữ cảnh có thể là nghe, lưu ý hoặc thuận theo; “nghe theo” diễn đạt sự tiếp nhận đề nghị mà không khẳng định quá mức một sự đồng thuận chính thức.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “nó” phản ánh cách những người anh nói về Giô-sép trong ngữ cảnh và tránh thêm sắc thái kính trọng không có trong nguyên văn; “thịt xương” giữ hình ảnh Hê-bơ-rơ về quan hệ huyết thống.
