  - severity: low
    issue: “Các anh em nó nghe theo” có quy chiếu sở hữu kém rõ trong tiếng Việt.
    rationale: Trong nguyên ngữ, hậu tố “của người ấy” quy chiếu người vừa phát biểu, tức Giu-đa. “Các anh em ông” giữ quy chiếu này rõ ràng mà không cần chèn tên riêng.
