base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: vi
  text: 'Ru-bên nói với họ: “Đừng làm đổ máu. Hãy ném cậu ấy xuống hố[a] này trong vùng hoang dã, nhưng đừng ra tay hại cậu ấy.” Ông nói vậy để cứu cậu ấy khỏi tay họ và đưa cậu ấy trở về với cha cậu ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể chỉ một bể chứa nước.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: Đừng làm đổ máu
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về việc gây chết người và mắc tội đổ máu, thay vì diễn giải thẳng thành “Đừng giết nó”.
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: Hãy ném nó xuống
  rationale: Diễn đạt trực tiếp hành động quăng người xuống hố; thêm “xuống” theo hướng chuyển động do ngữ cảnh xác định.
- source_word: הַבּוֹר
  choice: cái hố
  rationale: בּוֹר có thể chỉ hố hoặc bể chứa nước. “Hố” là cách gọi rộng, tự nhiên trong câu chính; nghĩa cụ thể hơn được ghi ở chú thích.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: này ở nơi hoang dã
  rationale: מִדְבָּר chỉ vùng hoang vắng, không nhất thiết là sa mạc cát; cách dịch này cũng thể hiện mệnh đề quan hệ אֲשֶׁר một cách tự nhiên trong tiếng Việt.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: nhưng đừng ra tay hại nó
  rationale: Chuyển thành ngữ sát chữ “đừng đưa tay chống lại nó” sang thành ngữ tiếng Việt tự nhiên, vẫn giữ ý cấm trực tiếp dùng bạo lực.
- source_word: לְמַעַן הַצִּיל אֹתוֹ מִיָּדָם
  choice: Ông nói vậy để cứu nó khỏi tay họ
  rationale: Thể hiện đây là lời giải thích của người kể về mục đích kín của Ru-bên, không phải phần tiếp theo trong lời nói trực tiếp; “khỏi tay họ” giữ hình ảnh Hê-bơ-rơ về quyền lực và sự khống chế.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: và đưa nó trở về với cha nó
  rationale: 'Diễn đạt thể sai khiến của שׁוּב: khiến người ấy trở lại, tức đưa người ấy về với cha.'
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Phiên âm tên riêng theo lối quen thuộc và dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “nó” phản ánh cách các anh đang nói về Giô-sép trong tình thế thù nghịch, đồng thời tránh bổ sung tên riêng không có trong câu Hê-bơ-rơ. Dấu chấm kết thúc lời trực tiếp, rồi câu “Ông nói vậy...” đánh dấu rõ lời giải thích của người kể.
