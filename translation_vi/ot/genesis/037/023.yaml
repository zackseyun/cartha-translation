  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: vi
  text: Khi Giô-sép đến chỗ các anh mình, họ lột áo của Giô-sép, tức chiếc áo đặc biệt[a] mà Giô-sép đang mặc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chiếc áo có tay dài”, “chiếc áo được trang trí cầu kỳ” hoặc, theo cách dịch truyền thống, “chiếc áo nhiều màu”. Nghĩa của cụm từ Hê-bơ-rơ כְּתֹנֶת הַפַּסִּים không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Khi
  rationale: Công thức tự sự này chuyển sang biến cố kế tiếp; “Khi” diễn đạt tự nhiên quan hệ thời gian mà không sao chép máy móc thành ngữ Hê-bơ-rơ.
- source_word: בָּא
  choice: đến
  rationale: Động từ chỉ đơn giản việc Giô-sép đến nơi các anh mình đang ở.
- source_word: אֶל אֶחָיו
  choice: đến chỗ các anh mình
  rationale: Trong ngữ cảnh, danh từ số nhiều giống đực nói đến các anh trai của Giô-sép; cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ hướng đến nơi họ ở.
- source_word: וַיַּפְשִׁיטוּ
  choice: họ lột ... ra
  rationale: Động từ diễn tả việc cưỡng ép cởi bỏ y phục khỏi một người; “lột ... ra” giữ được sắc thái mạnh của hành động.
- source_word: כֻּתָּנְתּוֹ
  choice: chiếc áo dài của Giô-sép
  rationale: כֻּתֹּנֶת là loại áo mặc sát thân hoặc áo dài; “áo dài” dễ hiểu hơn “áo chẽn” trong tiếng Việt hiện đại, còn việc lặp tên phản ánh sự nhấn mạnh của nguyên văn.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: chiếc áo dài đặc biệt
  rationale: Nghĩa chính xác của פַּסִּים không chắc chắn. “Đặc biệt” tránh khẳng định thiếu căn cứ rằng áo có nhiều màu, tay dài hay trang trí cầu kỳ, đồng thời cho thấy đây là chiếc áo nổi bật.
- source_word: אֲשֶׁר עָלָיו
  choice: mà chàng đang mặc
  rationale: Diễn đạt tự nhiên trong tiếng Việt rằng chiếc áo đang ở trên người Giô-sép vào lúc ấy.
theological_decisions: []
translation_notes:
  register: Văn phong tự sự hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các anh” vì những người này là các anh trai của Giô-sép; dùng “chàng” để tránh lặp tên ở mệnh đề cuối. Dấu chú thích [a] đặt ngay sau cụm từ có cách hiểu chưa chắc chắn.
