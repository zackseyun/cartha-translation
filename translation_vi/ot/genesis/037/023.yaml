revisions:
- from: Khi Giô-sép đến chỗ các anh mình, họ lột chiếc áo dài của Giô-sép ra, tức chiếc áo dài đặc biệt[a] mà chàng đang mặc.
  to: Khi Giô-sép đến chỗ các anh mình, họ lột áo của Giô-sép, tức chiếc áo đặc biệt[a] mà Giô-sép đang mặc.
  rationale: Sửa “áo dài” thành “áo” để tránh một liên tưởng sai lệch trong tiếng Việt hiện đại về kiểu trang phục, nhưng vẫn giữ mệnh đề giải thích và chú thích để phản ánh sự bất định của כְּתֹנֶת הַפַּסִּים. Câu cũng được chỉnh nhẹ để tự nhiên và nhất quán về văn phong.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:44:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và hành động cưỡng ép: khi Giô-sép đến với các anh, họ lột áo khỏi ông. Tuy nhiên, “áo dài” trong tiếng Việt hiện đại gợi mạnh đến trang phục Việt Nam đặc thù, không phải loại כֻּתֹּנֶת trong nguyên văn. “Áo” tránh gán một kiểu dáng không được xác định. “Áo đặc biệt” thận trọng thích hợp cho כְּתֹנֶת הַפַּסִּים, vốn có nghĩa còn tranh luận.'
  naturalness: Cần bỏ “ra” sau “lột ... áo” và thay “mà chàng đang mặc” bằng cách lặp tên Giô-sép. Bản sửa tự nhiên, trang trọng vừa phải, đồng thời không dùng đại từ “chàng” có sắc thái văn chương hơi không đồng đều với phần còn lại.
  terminology: Giữ Giô-sép và “các anh”. Dùng “áo” cho כֻּתֹּנֶת thay vì “áo dài”; chú thích nêu các khả năng “áo có tay dài,” “áo được trang trí cầu kỳ,” và cách dịch truyền thống “áo nhiều màu,” không quyết định thay cho nguyên văn.
  issues:
  - severity: medium
    issue: “Áo dài” có thể bị hiểu là áo dài Việt Nam.
    rationale: Từ này trong tiếng Việt hiện đại thường chỉ một loại quốc phục/trang phục đặc thù; nguyên văn chỉ một loại áo/tunic cổ đại và không bảo đảm kiểu “áo dài” theo nghĩa Việt hiện nay.
  - severity: low
    issue: “mà chàng đang mặc” thêm sắc thái văn chương và làm giảm sự lặp lại tên riêng trong câu.
    rationale: Nguyên văn lặp “Giô-sép”; “mà Giô-sép đang mặc” rõ ràng và đồng nhất hơn với văn phong tự sự hiện đại.
  revised_text: Khi Giô-sép đến chỗ các anh mình, họ lột áo của Giô-sép, tức chiếc áo đặc biệt[a] mà Giô-sép đang mặc.
