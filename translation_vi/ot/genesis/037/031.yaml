  text: וַ/יִּקְח֖וּ אֶת כְּתֹ֣נֶת יוֹסֵ֑ף וַֽ/יִּשְׁחֲטוּ֙ שְׂעִ֣יר עִזִּ֔ים וַ/יִּטְבְּל֥וּ אֶת הַ/כֻּתֹּ֖נֶת בַּ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/031.yaml
  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: vi
  text: Rồi họ lấy áo của Giô-sép[a], giết một con dê đực và nhúng áo ấy vào máu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “áo choàng” hoặc “áo khoác”; từ Hê-bơ-rơ chỉ một loại áo kiểu tunic.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Rồi họ lấy
  rationale: Thể wayyiqtol tiếp nối diễn tiến câu chuyện; “Rồi” diễn đạt tự nhiên trình tự ấy trong tiếng Việt hiện đại.
- source_word: כְּתֹנֶת יוֹסֵף
  choice: áo dài của Giô-sép
  rationale: כְּתֹנֶת chỉ một loại áo dài mặc sát thân hoặc áo kiểu tunic; cách dịch này gần nghĩa gốc và tránh gợi đến áo khoác hiện đại.
- source_word: וַיִּשְׁחֲטוּ
  choice: giết
  rationale: Động từ chỉ việc cắt tiết hoặc giết súc vật. Trong ngữ cảnh này, “giết” rõ ràng, tự nhiên và không tự ý gợi nghi lễ hiến tế.
- source_word: שְׂעִיר עִזִּים
  choice: một con dê đực
  rationale: Cụm từ xác định đây là dê giống đực; bản dịch giữ lại sự phân biệt giới tính của con vật.
- source_word: וַיִּטְבְּלוּ
  choice: nhúng
  rationale: Động từ có nghĩa nhúng hoặc dìm vào chất lỏng; “nhúng” là cách nói tự nhiên đối với việc đưa áo vào máu.
- source_word: הַכֻּתֹּנֶת
  choice: chiếc áo
  rationale: Danh từ xác định nhắc lại chính chiếc áo vừa nói đến; tiếng Việt tự nhiên có thể dùng “chiếc áo” mà vẫn giữ liên kết rõ ràng.
- source_word: בַּדָּם
  choice: vào trong máu
  rationale: Giới từ ב với mạo từ chỉ việc nhúng áo vào lượng máu của con dê vừa bị giết; “vào trong máu” làm rõ hướng và môi trường của hành động.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giô-sép” theo lối phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt; giữ chú thích để phản ánh khoảng nghĩa của כְּתֹנֶת.
