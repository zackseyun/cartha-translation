  terminology: Dùng “áo” trong câu chính giữ được độ rộng nghĩa của כְּתֹנֶת mà không áp đặt một kiểu trang phục hiện đại. Chú thích nêu khả năng “áo choàng” và giải thích đây là loại áo kiểu tunic, không đồng nhất nó với áo dài Việt Nam.
