  to: Rồi họ lấy áo của Giô-sép[a], giết một con dê đực và nhúng áo ấy vào máu.
  rationale: 'Thay “áo dài” bằng “áo” để tránh liên tưởng đến áo dài Việt Nam và bảo toàn độ rộng nghĩa của từ Hê-bơ-rơ. Giữ “giết một con dê đực” như bản dịch hiện có: cách này trung tính, tự nhiên và truyền đạt đúng hành động giết súc vật trong ngữ cảnh. Chú thích được chỉnh để mô tả kiểu áo mà không biến nó thành một loại y phục Việt Nam cụ thể.'
