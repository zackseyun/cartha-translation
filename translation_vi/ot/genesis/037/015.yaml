base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: vi
  text: 'Một người đàn ông gặp cậu, thấy cậu đang lang thang ngoài đồng. Người ấy hỏi cậu: “Cậu đang tìm gì?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Cậu đang tìm kiếm điều gì?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: bắt gặp cậu
  rationale: Động từ מצא ở thể Qal có nghĩa là tìm thấy hoặc gặp thấy. “Bắt gặp cậu” tự nhiên trong văn kể chuyện và không hàm ý người đàn ông đã chủ ý đi tìm Giô-sép.
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: אִישׁ chỉ một cá nhân nam không được nêu tên; cách dịch này giữ nguyên tính cụ thể và giống của danh từ Hê-bơ-rơ.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: הִנֵּה hướng sự chú ý đến cảnh tượng được trình bày cách sống động. “Kìa” giữ được chức năng diễn ngôn ấy, dù mang sắc thái văn chương nhẹ.
- source_word: תֹעֶה
  choice: đang đi lang thang
  rationale: Phân từ của תעה diễn tả việc đi lạc hướng hoặc đi quanh quẩn. “Đang đi lang thang” giữ được hành động tiếp diễn mà không khẳng định quá mức rằng Giô-sép hoàn toàn bị lạc.
- source_word: בַּשָּׂדֶה
  choice: ngoài đồng
  rationale: שָׂדֶה có thể chỉ cánh đồng hoặc vùng đất trống. “Ngoài đồng” là cách nói tự nhiên trong tiếng Việt ở ngữ cảnh này.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: hỏi cậu
  rationale: שאל có nghĩa thông thường là hỏi. Đại từ “cậu” phù hợp với Giô-sép, một người nam trẻ trong ngữ cảnh, và tránh lặp tên không có trong nguyên văn.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức לֵאמֹר giới thiệu lời nói trực tiếp. “Hỏi cậu rằng” phản ánh cấu trúc ấy bằng lối diễn đạt tiếng Việt trang trọng, dễ hiểu.
- source_word: מַה תְּבַקֵּשׁ
  choice: Cậu đang tìm gì?
  rationale: בקש nghĩa là tìm hoặc tìm kiếm. “Đang tìm gì?” vừa thể hiện hành động hiện tại vừa tự nhiên trong lời thoại tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm nhưng dễ hiểu. Dấu chấm phẩy giúp giữ hai vế của câu Hê-bơ-rơ, còn “kìa” bảo tồn nét trình bày sống động của הִנֵּה. Dấu chú thích được đặt sau cụm từ mà phương án dịch thay thế thực sự liên quan.
