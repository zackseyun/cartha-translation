  text: וַ/יַּחֲלֹ֥ם עוֹד֙ חֲל֣וֹם אַחֵ֔ר וַ/יְסַפֵּ֥ר אֹת֖/וֹ לְ/אֶחָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּ֨ה חָלַ֤מְתִּֽי חֲלוֹם֙ ע֔וֹד וְ/הִנֵּ֧ה הַ/שֶּׁ֣מֶשׁ וְ/הַ/יָּרֵ֗חַ וְ/אַחַ֤ד עָשָׂר֙ כּֽוֹכָבִ֔ים מִֽשְׁתַּחֲוִ֖ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: vi
  text: 'Rồi cậu lại nằm mơ một giấc mơ khác và kể cho các anh mình nghe. Cậu nói: “Này, em lại nằm mơ một giấc mơ nữa: mặt trời, mặt trăng và mười một ngôi sao đang cúi mình trước em[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phủ phục trước em.” Động từ Hê-bơ-rơ có thể chỉ sự phủ phục sâu để bày tỏ lòng tôn kính hoặc quy phục; trong bối cảnh này, từ này nói về sự bái phục chứ không phải thờ phượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: Rồi cậu lại nằm mơ một giấc mơ khác
  rationale: “Rồi” chuyển tiếp mạch kể của wayyiqtol; “lại” cùng “khác” phản ánh ý lặp lại trong עוֹד ... אַחֵר mà vẫn tự nhiên trong tiếng Việt.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: và kể cho các anh mình nghe
  rationale: סִפֵּר là “kể, thuật lại”. Trong ngữ cảnh, אֶחָיו chỉ các anh của Giô-sép; cách nói này tự nhiên và làm rõ quan hệ tuổi tác đã có trong câu chuyện.
- source_word: הִנֵּה
  choice: Này
  rationale: “Này” giữ chức năng thu hút sự chú ý của הִנֵּה trong lời nói trực tiếp, với sắc thái hiện đại và không cổ kính quá mức.
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: em lại nằm mơ một giấc mơ nữa
  rationale: Giữ phép lặp cùng gốc “nằm mơ—giấc mơ” và ý “lại/nữa” của עוֹד; đại từ “em” phù hợp khi Giô-sép nói với các anh.
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: mặt trời, mặt trăng và mười một ngôi sao
  rationale: Chuyển trực tiếp, rõ ràng các thiên thể và con số trong nguyên văn.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: đang cúi mình xuống trước em
  rationale: Phân từ diễn tả cảnh đang diễn ra trong giấc mơ. “Cúi mình xuống trước” truyền đạt hành động tỏ lòng quy phục hoặc tôn kính mà không mặc nhiên biến nó thành sự thờ phượng.
theological_decisions:
- issue: Ý nghĩa của מִשְׁתַּחֲוִים trong giấc mơ của Giô-sép
  choice: cúi mình xuống trước em
  alternative: thờ lạy em; phủ phục trước em
  rationale: Ngữ cảnh trực tiếp nói đến sự quy phục và tôn kính trong gia đình, được ứng nghiệm về sau qua hành động bái phục, chứ không khẳng định sự thờ phượng mang tính thần linh. Bản dịch chính giữ nghĩa xã hội-chính trị, còn chú thích bảo lưu mức độ mạnh của động từ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cậu/các anh/em” để thể hiện tự nhiên quan hệ giữa Giô-sép với các anh trong tiếng Việt; không thêm tên riêng vốn không xuất hiện trong câu Hê-bơ-rơ này.
