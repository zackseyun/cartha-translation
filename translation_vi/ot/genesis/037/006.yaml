  language: vi
  text: 'Giô-sép nói với các anh: “Xin các anh nghe giấc mơ này mà em đã mơ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ lặp lại danh từ và động từ cùng gốc, theo sát nghĩa là: “giấc mơ này mà em đã mơ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Cậu nói
  rationale: Dạng kể chuyện nối tiếp đưa trình thuật tiến lên. “Nói” diễn đạt trực tiếp động từ; “cậu” giữ ngôi thứ ba số ít và phù hợp với Giô-sép còn trẻ trong ngữ cảnh.
- source_word: אֲלֵיהֶם
  choice: với họ
  rationale: Diễn đạt trực tiếp giới từ cùng hậu tố đại từ, không thay các đại từ của nguyên văn bằng danh tính được suy ra từ ngữ cảnh.
- source_word: שִׁמְעוּ נָא
  choice: Xin hãy nghe
  rationale: Mệnh lệnh số nhiều שִׁמְעוּ kêu gọi người nghe chú ý; tiểu từ נָא làm lời yêu cầu mềm hơn. “Xin hãy nghe” vừa lịch sự vừa tự nhiên trong tiếng Việt.
- source_word: הַחֲלוֹם הַזֶּה
  choice: giấc mơ này
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho danh từ xác định đi với đại từ chỉ định.
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: mà tôi đã mơ thấy
  rationale: Mệnh đề quan hệ bổ nghĩa cho “giấc mơ”; cách dịch này giữ lại sự lặp từ cùng gốc giữa danh từ חֲלוֹם và động từ חָלַם.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu hai chấm được dùng tự nhiên để dẫn lời nói trực tiếp. Cấu trúc “giấc mơ… mơ thấy” cố ý giữ nét lặp của tiếng Hê-bơ-rơ mà vẫn chấp nhận được trong tiếng Việt.
