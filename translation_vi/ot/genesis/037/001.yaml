revisions:
- from: Gia-cốp cư ngụ tại vùng đất mà cha ông từng sống như một ngoại kiều[a], tức là đất Ca-na-an.
  to: Gia-cốp cư ngụ trong vùng đất cha của ông từng kiều ngụ[a], trong đất Ca-na-an.
  rationale: Bản sửa giữ nghĩa cư trú của וַיֵּשֶׁב, diễn đạt מְגוּרֵי אָבִיו bằng “từng kiều ngụ”, làm rõ “cha” ở số ít, và khôi phục sự lặp lại “trong đất ... trong đất Ca-na-an” của nguyên văn. Chú thích được chỉnh để nêu lựa chọn sát cấu trúc mà không đưa thêm hàm ý “định cư”.
  reviewer_model: gpt-5.6-terra
