  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: vi
  text: Gia-cốp cư ngụ trong vùng đất cha của ông từng kiều ngụ[a], trong đất Ca-na-an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát cấu trúc: “Gia-cốp cư ngụ trong đất của những cuộc kiều ngụ của cha ông, trong đất Ca-na-an.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Gia-cốp cư ngụ
  rationale: Động từ יָשַׁב ở dạng kể chuyện diễn tả việc ở, cư trú. “Cư ngụ” tự nhiên và trang trọng, nhưng không hàm ý định cư vĩnh viễn; không thêm “bấy giờ” vì nguyên văn không có từ chỉ thời gian tương ứng.
- source_word: בְּאֶרֶץ
  choice: tại vùng đất
  rationale: אֶרֶץ trong ngữ cảnh địa lý chỉ một vùng đất; cách dịch này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מְגוּרֵי אָבִיו
  choice: mà cha ông từng sống như một ngoại kiều
  rationale: מְגוּרִים chỉ việc cư trú với thân phận người tạm trú hoặc ngoại kiều. Cách diễn đạt bằng mệnh đề tự nhiên hơn lối dịch sát cấu trúc “đất của những lần kiều ngụ của cha ông”, đồng thời giữ được sắc thái quan trọng của nguyên ngữ.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: tức là đất Ca-na-an
  rationale: Cụm từ xác định vùng đất vừa nói là Ca-na-an. “Tức là” thể hiện quan hệ đồng vị tự nhiên trong tiếng Việt, tránh lặp vụng về mà không làm mất thông tin địa lý.
