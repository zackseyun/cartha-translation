  naturalness: “Phần đất khô” và “khối nước đã tụ lại” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại. Cụm “gọi ... là các biển” cũng tự nhiên trong công thức đặt tên và phản ánh tốt số nhiều tiếng Hê-bơ-rơ.
  terminology: Giữ “Đức Chúa Trời,” “Đất,” và chú thích về אֶרֶץ. “Đất” viết hoa có thể biểu thị tên được đặt; chú thích đã bảo toàn phương án danh từ chung. “các biển” tránh biến tên gọi số nhiều thành số ít.
  issues:
