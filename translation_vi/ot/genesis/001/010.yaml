source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: vi
  text: Đức Chúa Trời gọi phần đất khô là Đất[a], còn khối nước đã tụ lại thì Ngài gọi là các biển. Đức Chúa Trời thấy điều đó là tốt đẹp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đất” hoặc “đất đai” và không viết hoa; từ Hê-bơ-rơ אֶרֶץ có thể là danh từ chung hoặc, trong công thức đặt tên ở đây, là tên được đặt cho phần đất khô.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: gọi ... là
  rationale: Trong ngữ cảnh này, động từ diễn tả hành động đặt tên. Cách nói “gọi ... là” tự nhiên trong tiếng Việt và giữ được cấu trúc lặp của câu.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thức số nhiều nhưng đi với động từ số ít và chỉ Đấng Tạo Hóa duy nhất; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: לַיַּבָּשָׁה
  choice: phần đất khô
  rationale: Từ này chỉ phần khô ráo đối lập với khối nước đã tụ lại. “Phần đất khô” rõ nghĩa và tự nhiên trong văn cảnh phân chia.
- source_word: אֶרֶץ
  choice: Đất
  rationale: Ở đây từ này xuất hiện trong công thức đặt tên cho phần đất khô. Viết hoa “Đất” làm rõ chức năng tên gọi nhưng không nhất thiết đồng nhất với khái niệm khoa học hiện đại về hành tinh.
- source_word: מִקְוֵה
  choice: nơi ... tụ lại
  rationale: Danh từ chỉ sự tập hợp hoặc nơi chứa phần đã tụ lại. Chuyển thành cụm “nơi nước tụ lại” giúp câu tiếng Việt tự nhiên mà vẫn giữ ý nghĩa nguồn.
- source_word: הַמַּיִם
  choice: nước
  rationale: Tiếng Hê-bơ-rơ dùng hình thức số nhiều, nhưng “nước” là danh từ khối tự nhiên trong tiếng Việt; “các dòng nước” sẽ thêm một nét nghĩa không có trong nguồn.
- source_word: יַמִּים
  choice: Biển
  rationale: Danh từ Hê-bơ-rơ ở số nhiều, chỉ các vùng nước tụ lại. Tiếng Việt thường dùng danh từ loại “Biển” trong công thức đặt tên; viết hoa biểu thị tên được ban cho.
- source_word: וַיַּרְא
  choice: thấy
  rationale: Giữ nghĩa thông thường của động từ và sự nhất quán với công thức đánh giá lặp lại trong Sáng Thế Ký 1.
- source_word: כִּי טוֹב
  choice: điều đó là tốt đẹp
  rationale: “Tốt đẹp” giữ được phạm vi rộng của טוֹב, bao gồm sự đúng đắn, thích hợp và đáng hài lòng, mà không thu hẹp vào vẻ đẹp hay công dụng.
theological_decisions:
- issue: Nên hiểu אֶרֶץ là danh từ chung hay tên gọi trong công thức đặt tên
  choice: Dịch là tên gọi “Đất”
  alternative: Dịch bằng danh từ chung “đất” hoặc “đất đai”
  rationale: Vì câu nói rõ Đức Chúa Trời đang gọi tên phần đất khô, viết hoa giúp biểu thị hành động đặt tên. Cách dịch này không nhằm đưa vào quan niệm khoa học hiện đại về Trái Đất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “còn” để thể hiện sự đối ứng giữa đất khô và nước tụ lại; dùng “Ngài” ở vế thứ hai để tránh lặp nặng nhưng vẫn giữ rõ chủ thể.
