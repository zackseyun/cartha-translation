  revision_rationale: Bản sửa giữ nguyên lựa chọn ‘là’ (không phải ‘trở nên’), giữ liên từ mở đầu phản ánh וְ, và bảo tồn sự mơ hồ của רוּחַ אֱלֹהִים bằng chú thích. Các điều chỉnh chỉ tăng tính tự nhiên, độ chính xác của hình ảnh không gian và sắc thái chuyển động tiếp diễn trong tiếng Việt hiện đại.
