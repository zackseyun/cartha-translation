source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: vi
  text: Và đất là hoang vu, trống không; bóng tối phủ trên mặt vực sâu, và Thần Khí của Đức Chúa Trời[a] đang lượn trên mặt nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một luồng gió từ Đức Chúa Trời” hoặc “gió của Đức Chúa Trời”.'
    reason: Cụm רוּחַ אֱלֹהִים có thể chỉ Thần Khí của Đức Chúa Trời hoặc một luồng gió có nguồn gốc hay liên hệ với Đức Chúa Trời.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Và đất
  rationale: הָאָרֶץ chỉ đất/địa cầu; tiền tố וְ liên kết câu này với câu trước, nên giữ bằng “Và” mà không thêm một dấu hiệu diễn ngôn như “Bấy giờ”.
- source_word: הָיְתָה
  choice: là
  rationale: Dạng Qal hoàn thành của היה ở đây tự nhiên nhất là hệ từ chỉ trạng thái, không hàm ý đất đã “trở nên” như vậy.
- source_word: תֹהוּ וָבֹהוּ
  choice: hoang vu, trống không
  rationale: Cặp từ diễn tả tình trạng chưa được định hình, vắng trống và hoang vu; cách dịch này tự nhiên, trang trọng và giữ được hai vế cân xứng.
- source_word: וְחֹשֶׁךְ
  choice: bóng tối
  rationale: Danh từ được chuyển trực tiếp là “bóng tối”; quan hệ tiếp nối trong chuỗi mệnh đề được thể hiện tự nhiên bằng dấu phẩy.
- source_word: עַל־פְּנֵי
  choice: bao phủ mặt / trên mặt
  rationale: Thành ngữ nghĩa đen là “trên mặt”. Với bóng tối, “bao phủ mặt” diễn đạt tự nhiên quan hệ không gian; với hành động bay lượn, “trên mặt” giữ sát hình ảnh nguồn.
- source_word: תְהוֹם
  choice: vực sâu
  rationale: Chỉ khối nước sâu nguyên thủy; “vực sâu” rõ nghĩa mà không đưa thêm các liên tưởng thần thoại không có trong câu.
- source_word: וְרוּחַ אֱלֹהִים
  choice: Thần của Đức Chúa Trời
  rationale: רוּחַ có thể là thần, gió hoặc hơi thở. Bản chính chọn cách hiểu chỉ Thần của Đức Chúa Trời, đồng thời ghi chú cách hiểu “một luồng gió từ Đức Chúa Trời/gió của Đức Chúa Trời” để bảo tồn sự mơ hồ thực sự.
- source_word: מְרַחֶפֶת
  choice: bay lượn
  rationale: Phân từ biểu thị hành động đang tiếp diễn, với sắc thái chuyển động lơ lửng hoặc chao lượn bên trên.
- source_word: הַמָּיִם
  choice: nước
  rationale: מַיִם có hình thức số nhiều trong tiếng Hê-bơ-rơ nhưng tiếng Việt thông thường dùng danh từ khối “nước”; ngữ cảnh vẫn bảo toàn hình ảnh khối nước nguyên thủy.
theological_decisions:
- issue: הָיְתָה diễn tả trạng thái “là” hay sự biến đổi “trở nên”
  choice: là
  alternative: trở nên
  rationale: Câu mô tả tình trạng của đất tại giai đoạn này trong trình thuật; ngữ pháp không đòi hỏi ý nghĩa biến đổi trạng thái. “Là” tránh đưa vào một giả thuyết thần học mà bản văn không khẳng định.
- issue: וְרוּחַ אֱלֹהִים chỉ Thần của Đức Chúa Trời hay một luồng gió đến từ Đức Chúa Trời
  choice: Thần của Đức Chúa Trời
  alternative: một luồng gió từ Đức Chúa Trời; gió của Đức Chúa Trời
  rationale: Cụm từ Hê-bơ-rơ thực sự có thể được hiểu theo cả nghĩa thần linh lẫn khí tượng. Bản chính dùng cách hiểu truyền thống và vững chắc, còn chú thích giữ lại các cách hiểu về gió thay vì xóa bỏ sự căng thẳng diễn giải.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ liên từ mở đầu “Và” để phản ánh וְ; tránh “Bấy giờ” vì có thể nghe như phần bổ sung. Dùng “Đức Chúa Trời” nhất quán cho אֱלֹהִים và viết hoa “Thần” theo cách hiểu được chọn trong bản chính.
