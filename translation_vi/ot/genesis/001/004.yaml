revisions:
- from: Đức Chúa Trời thấy ánh sáng là tốt đẹp, rồi Đức Chúa Trời phân cách ánh sáng với bóng tối.[a]
  to: Đức Chúa Trời thấy rằng ánh sáng là tốt, rồi Đức Chúa Trời phân cách ánh sáng với bóng tối.[a]
  rationale: Chỉnh “tốt đẹp” thành “tốt” để phản ánh phạm vi nghĩa rộng, không thiên về thẩm mỹ, của טוֹב; thêm “rằng” để biểu thị rõ mệnh đề nội dung do כִּי giới thiệu. Phần còn lại bảo tồn trật tự kể chuyện, sự lặp lại chủ ngữ, và tính không xác định của động từ “phân cách.”
