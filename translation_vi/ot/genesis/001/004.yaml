source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/א֖וֹר כִּי ט֑וֹב וַ/יַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָ/א֖וֹר וּ/בֵ֥ין הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: vi
  text: Đức Chúa Trời thấy rằng ánh sáng là tốt, rồi Đức Chúa Trời phân cách ánh sáng với bóng tối.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phân chia ánh sáng khỏi bóng tối”; động từ Hê-bơ-rơ cũng có thể diễn tả việc phân biệt giữa hai điều.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Động từ ראה ở dạng kể chuyện được dịch tự nhiên là “thấy”; trong ngữ cảnh, từ này cũng bao hàm sự nhận định, nhưng không cần diễn giải thêm.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thức số nhiều nhưng đi với động từ số ít và chỉ về Đấng Tạo Hóa duy nhất; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ trực tiếp trong tiếng Hê-bơ-rơ; chức năng của nó được thể hiện bằng trật tự từ tiếng Việt.
- source_word: הָאוֹר
  choice: ánh sáng
  rationale: Tiếng Việt thường không dùng từ tương đương với mạo từ xác định trong trường hợp này; ngữ cảnh vẫn cho thấy đây là ánh sáng vừa được gọi xuất hiện.
- source_word: כִּי
  choice: là
  rationale: כִּי giới thiệu nội dung điều Đức Chúa Trời thấy. Cấu trúc tự nhiên trong tiếng Việt là “thấy ánh sáng là tốt đẹp”.
- source_word: טוֹב
  choice: tốt đẹp
  rationale: טוֹב là từ đánh giá thông dụng mang nghĩa “tốt”; “tốt đẹp” vừa tự nhiên vừa giữ sắc thái tích cực rộng, không thu hẹp thành “đẹp lòng” hay “hữu ích”.
- source_word: וַיַּבְדֵּל
  choice: phân cách
  rationale: בדל có nghĩa là tách ra, phân chia hoặc tạo sự phân biệt. “Phân cách” phù hợp với hành động sắp đặt trong ngữ cảnh mà không xác định cơ chế là không gian, thời gian hay ý niệm.
- source_word: בֵּין ... וּבֵין
  choice: với
  rationale: Sau động từ “phân cách”, cấu trúc “phân cách A với B” là tự nhiên trong tiếng Việt và truyền đạt đúng quan hệ giữa hai đối tượng.
- source_word: הַחֹשֶׁךְ
  choice: bóng tối
  rationale: “Bóng tối” là cách diễn đạt tự nhiên, trang trọng cho חֹשֶׁךְ; ngữ cảnh xác định đó là bóng tối đã được nhắc đến trước đó.
theological_decisions:
- issue: Lặp lại chủ ngữ אֱלֹהִים trong cả hai mệnh đề
  choice: 'Lặp lại “Đức Chúa Trời”: “Đức Chúa Trời thấy… Đức Chúa Trời phân cách…”'
  alternative: 'Dùng đại từ hoặc lược bỏ chủ ngữ ở mệnh đề thứ hai: “Ngài phân cách…” hoặc “rồi phân cách…”'
  rationale: Bản Hê-bơ-rơ nêu lại chủ ngữ thần linh, tạo nhịp điệu và sự nhấn mạnh; bản dịch giữ sự lặp lại này mà không thêm diễn giải giáo lý.
- issue: Bản chất của việc phân cách ánh sáng và bóng tối
  choice: Dùng “phân cách” mà không xác định đó là sự tách biệt về không gian, thời gian hay khái niệm
  alternative: “phân chia” hoặc “phân biệt”
  rationale: Câu này khẳng định Đức Chúa Trời phân cách ánh sáng với bóng tối nhưng không giải thích cơ chế; cách dịch giữ nguyên độ mở thần học và vũ trụ luận của nguyên văn.
- issue: Quan hệ nối tiếp giữa hai hành động
  choice: Dùng “rồi” cho וַ־ trước וַיַּבְדֵּל
  alternative: Dùng “và”
  rationale: Trong mạch kể chuyện Hê-bơ-rơ, וַ־ thường đánh dấu hành động tiếp theo. “Rồi” diễn đạt tự nhiên trình tự này trong tiếng Việt mà không hàm ý một khoảng thời gian cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể ngắn gọn của nguyên văn, lặp lại danh xưng “Đức Chúa Trời”, đồng thời đặt chú thích ngay sau cụm từ mà chú thích giải thích.
