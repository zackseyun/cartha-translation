  naturalness: Câu nhìn chung tự nhiên và trang trọng. Thêm “rằng” làm rõ rằng mệnh đề “ánh sáng là tốt” là nội dung điều Đức Chúa Trời thấy, tránh khả năng đọc “thấy ánh sáng” chỉ như một hành vi tri giác. “Tốt” là cách diễn đạt hiện đại, gọn và sát nghĩa hơn trong câu này.
  terminology: “Đức Chúa Trời,” “ánh sáng,” “bóng tối,” và “phân cách” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Không cần thay đổi thuật ngữ chính hay chú thích từ vựng.
