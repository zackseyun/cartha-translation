  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: vi
  text: 'Đức Chúa Trời phán: “Đất hãy sinh ra các sinh vật sống[a] tùy theo loài: gia súc, các loài vật bò sát và thú hoang trên đất, tùy theo loài.” Và đã thành như vậy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các hữu thể sống”; sát nghĩa: “một sinh thể sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצֵא
  choice: hãy sinh ra
  rationale: Dạng Hiphil mệnh lệnh gián tiếp, ngôi ba giống cái số ít, với “đất” làm chủ ngữ, diễn tả lệnh truyền để đất làm cho các sinh vật xuất hiện. “Hãy sinh ra” tự nhiên trong tiếng Việt và giữ được sắc thái nguyên nhân.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Trong ngữ cảnh sáng tạo, từ này chỉ cõi đất đối lập với biển và trời. “Đất” cũng tự nhiên hơn “trái đất” khi chính đất được truyền phải sinh ra các loài vật.
- source_word: נֶפֶשׁ חַיָּה
  choice: các sinh vật sống
  rationale: Cụm từ chỉ các hữu thể có sự sống; danh từ tập hợp số ít trong tiếng Hê-bơ-rơ mang nghĩa nhiều theo các nhóm được liệt kê sau đó. Cách dịch này tránh gán cho “linh hồn” một nghĩa siêu hình mà câu không xác định.
- source_word: לְמִינָהּ
  choice: tùy theo loài
  rationale: Cụm từ mang ý nghĩa phân loại hoặc phân bố theo từng loài. Cách nói này gọn, tự nhiên và không buộc tiếng Việt phải thể hiện hậu tố giống cái số ít của danh từ tập hợp.
- source_word: בְּהֵמָה
  choice: gia súc
  rationale: Trong danh sách đối chiếu với thú hoang, từ này chủ yếu chỉ lớp thú lớn thuần dưỡng. “Gia súc” rõ nghĩa và quen thuộc trong tiếng Việt hiện đại.
- source_word: רֶמֶשׂ
  choice: loài bò sát
  rationale: Từ này bao quát các sinh vật nhỏ di chuyển sát mặt đất. “Loài bò sát” giữ hình ảnh vận động sát đất trong cách dùng Kinh Thánh tiếng Việt, dù phạm vi Hê-bơ-rơ có thể rộng hơn phân loại động vật học hiện đại.
- source_word: חַיְתוֹ אֶרֶץ
  choice: thú hoang trên đất
  rationale: Cụm từ chỉ các thú sống trên đất, đặc biệt là nhóm không thuần dưỡng, phân biệt với gia súc. “Thú hoang trên đất” thể hiện cả sự tương phản lẫn phạm vi cư trú.
- source_word: וַיְהִי כֵן
  choice: Mọi sự liền diễn ra như vậy
  rationale: Đây là công thức xác nhận sự ứng nghiệm trong Sáng Thế Ký 1. “Liền” phản ánh diễn tiến trực tiếp của lời phán, còn “diễn ra như vậy” truyền đạt tự nhiên ý nghĩa “và đã thành như thế”.
theological_decisions:
- issue: Có nên dịch נֶפֶשׁ bằng thuật ngữ “linh hồn” mang hàm ý thần học hay không
  choice: các sinh vật sống
  alternative: các linh hồn sống; các hữu thể sống
  rationale: Trong ngữ cảnh này, cụm Hê-bơ-rơ nói về các loài vật có sự sống nói chung, không xác quyết một học thuyết về cấu tạo siêu hình của động vật. Bản dịch chính tránh nhập thêm kết luận thần học, còn chú thích bảo lưu sắc thái từ vựng nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp lời phán cùng công thức ứng nghiệm của trình thuật sáng tạo; dùng “Đức Chúa Trời” theo lối gọi phổ biến trong Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
