- from: 'Đức Chúa Trời phán: “Đất hãy sinh ra các sinh vật sống[a] tùy theo loài: gia súc, loài bò sát và thú hoang trên đất, tùy theo loài.” Mọi sự liền diễn ra như vậy.'
  to: 'Đức Chúa Trời phán: “Đất hãy sinh ra các sinh vật sống[a] tùy theo loài: gia súc, các loài vật bò sát và thú hoang trên đất, tùy theo loài.” Và đã thành như vậy.'
  rationale: Bản sửa giữ nguyên nghĩa của bản thảo nhưng phục hồi công thức ứng nghiệm ngắn gọn của tiếng Hê-bơ-rơ, tránh mở rộng phạm vi רֶמֶשׂ thành một phạm trù động vật học hiện đại, và làm chú thích từ vựng rõ ràng hơn trong tiếng Việt. Tính tập hợp của “sinh vật sống” và “tùy theo loài” được giữ nguyên.
