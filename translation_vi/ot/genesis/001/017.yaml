base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: vi
  text: Đức Chúa Trời đặt chúng trên vòm trời[a] để soi sáng mặt đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong khoảng không của trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: đặt
  rationale: Động từ נָתַן ở đây diễn tả việc Đức Chúa Trời chủ ý bố trí các nguồn sáng vào vị trí của chúng; “đặt” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: אֹתָם
  choice: chúng
  rationale: Đại từ làm tân ngữ, quy chiếu về các nguồn sáng và các ngôi sao đã được nhắc đến ở câu trước.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong Sáng Thế Ký 1, danh từ có hình thức số nhiều này đi với động từ số ít và chỉ về Đấng Tạo Hóa duy nhất; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: בִּרְקִיעַ
  choice: trong khoảng không
  rationale: רָקִיעַ chỉ một vùng trải rộng. “Khoảng không” dễ hiểu đối với độc giả hiện đại và tránh áp đặt một mô hình vũ trụ học cụ thể; cách dịch “vòm trời” được ghi ở chú thích như một khả năng khác.
- source_word: הַשָּׁמַיִם
  choice: của trời
  rationale: Cụm sở thuộc trong tiếng Hê-bơ-rơ được chuyển tự nhiên thành “khoảng không của trời”, giữ sắc thái trang trọng mà không làm câu nặng nề.
- source_word: לְהָאִיר
  choice: để chiếu sáng
  rationale: Dạng Hiphil của אוֹר mang nghĩa khiến ánh sáng tỏa ra hoặc cung cấp ánh sáng; “chiếu sáng” diễn đạt rõ chức năng của các nguồn sáng.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Giữ quan hệ không gian của עַל và đối tượng nhận ánh sáng là הָאָרֶץ, không thêm các chi tiết không có trong nguyên văn.
theological_decisions:
- issue: Thuật ngữ vũ trụ học רָקִיעַ trong trình thuật sáng tạo
  choice: khoảng không
  alternative: vòm trời
  rationale: “Khoảng không” giữ nghĩa rộng về một vùng trải ra mà không biến câu thành sự khẳng định về một cấu trúc vũ trụ cụ thể. Chú thích bảo tồn cách hiểu truyền thống “vòm trời” và sự mở nghĩa vốn có của thuật ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu bám sát nguyên văn nhưng vẫn tự nhiên trong tiếng Việt; không dùng thuật ngữ khoa học hiện đại để giải thích thay cho hình ảnh của bản văn cổ.
