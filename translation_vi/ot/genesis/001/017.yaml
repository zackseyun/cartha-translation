- from: Đức Chúa Trời đặt chúng trong khoảng không của trời[a] để chiếu sáng trên đất.
  to: Đức Chúa Trời đặt chúng trên vòm trời[a] để soi sáng mặt đất.
  rationale: Đổi cách diễn đạt chính để câu tự nhiên hơn trong tiếng Việt hiện đại và diễn đạt rõ hơn bối cảnh các vật sáng ở רָקִיעַ הַשָּׁמַיִם. Chú thích giữ phương án “khoảng không của trời”, phản ánh nghĩa không gian rộng của thuật ngữ Hê-bơ-rơ mà không áp đặt một mô hình vũ trụ học.
