  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: vi
  text: Đức Chúa Trời sáng tạo những sinh vật biển lớn[a], cùng mọi sinh vật sống chuyển động mà nước đầy dẫy theo từng loài của chúng, và mọi chim có cánh theo loài của chúng. Đức Chúa Trời thấy điều đó là tốt đẹp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những quái vật biển lớn” hoặc “những con rồng lớn”. Từ Hê-bơ-rơ tanninim có thể chỉ các sinh vật lớn có hình rắn hoặc mang tính quái dị; trong câu này, ngữ cảnh về nước ủng hộ cách dịch “sinh vật biển”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: sáng tạo
  rationale: Giữ động từ sáng tạo nổi bật ברא và văn phong trang trọng của trình thuật.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Dạng số nhiều đi với động từ số ít ở đây chỉ một Đức Chúa Trời; đây là cách gọi tự nhiên, trang trọng và quen thuộc trong tiếng Việt.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: các sinh vật biển khổng lồ
  rationale: תנינים có thể chỉ những sinh vật lớn, dài như rắn hoặc đáng sợ; ngữ cảnh dưới nước ủng hộ cách dịch rộng, không áp đặt sắc thái thần thoại.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: mọi sinh vật sống
  rationale: נפש חיה ở đây nói về sự sống động vật, không phải khái niệm thần học thu hẹp về 'linh hồn'.
- source_word: הָרֹמֶשֶׂת
  choice: đang chuyển động
  rationale: רמש có nghĩa rộng là di chuyển hoặc bò; cách dịch này không giới hạn vào loài bò sát.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: mà nước sinh ra lúc nhúc
  rationale: Giữ ý nước làm phát sinh vô số sinh vật chen chúc của שרץ, đồng thời phản ánh cấu trúc trong đó 'nước' là chủ ngữ.
- source_word: לְמִינֵהֶם
  choice: theo từng loài
  rationale: Diễn đạt tự nhiên sự phân loại trong trật tự sáng tạo và phù hợp với tiền ngữ số nhiều.
- source_word: כָּל עוֹף כָּנָף
  choice: mọi loài chim có cánh
  rationale: Phản ánh cả danh từ chỉ loài bay/chim עוף lẫn yếu tố 'cánh' כנף bằng tiếng Việt dễ hiểu.
- source_word: לְמִינֵהוּ
  choice: theo từng loài
  rationale: Tiếng Việt không cần biểu thị hậu tố sở hữu số ít; cụm này tự nhiên mà vẫn giữ ý phân loại.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Đức Chúa Trời thấy điều đó là tốt đẹp
  rationale: Giữ công thức đánh giá lặp lại của Sáng Thế Ký 1 bằng tiếng Việt tự nhiên và trang trọng.
theological_decisions:
- issue: Cách dịch תַּנִּינִם trong ngữ cảnh sáng tạo, nơi từ này có thể gợi các sinh vật đáng sợ hoặc hình tượng thần thoại
  choice: các sinh vật biển khổng lồ
  alternative: các quái vật biển khổng lồ; các con rồng lớn
  rationale: Ngữ cảnh trực tiếp trình bày chúng như sinh vật dưới nước do Đức Chúa Trời sáng tạo. Bản chính không nhấn quá mức sắc thái thần thoại, còn chú thích bảo tồn phạm vi nghĩa thực sự của từ Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” nhất quán; giữ nhịp liệt kê của câu Hê-bơ-rơ và đặt đầy đủ ký hiệu chú thích [a] ngay sau cụm liên quan.
