  - severity: low
    issue: Vị trí dấu chú thích chưa neo trực tiếp vào cụm “các ngôi sao”.
    rationale: Chú thích giải thích riêng cụm cuối; nên đặt [a] ngay sau “các ngôi sao”, trước dấu chấm câu.
