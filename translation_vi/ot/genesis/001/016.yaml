id: GEN.1.16
reference: Genesis 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: vi
  text: 'Đức Chúa Trời làm nên hai nguồn sáng lớn: nguồn sáng lớn hơn để cai quản ban ngày, nguồn sáng nhỏ hơn để cai quản ban đêm, và các ngôi sao[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch rõ hơn: “và cả các ngôi sao.”'
    reason: Cụm וְאֵת הַכּוֹכָבִים là một thành phần bổ sung; “cả” có thể làm rõ sắc thái thêm vào, nhưng không được biểu thị bằng một tiểu từ riêng trong nguyên văn.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm nên
  rationale: Động từ עשה có nghĩa thông thường là “làm, tạo nên”. “Làm nên” tự nhiên và trang trọng trong tiếng Việt, không diễn giải quá mức thành “chỉ định”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong Sáng Thế Ký 1, danh từ này đi với động từ số ít và chỉ một Đức Chúa Trời; đây là cách gọi quen thuộc, trang trọng trong tiếng Việt.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: hai nguồn sáng lớn
  rationale: מָאוֹר chỉ vật phát sáng hoặc nguồn sáng. Cách dịch này dễ hiểu, đồng thời giữ nguyên lối diễn đạt của tiếng Hê-bơ-rơ thay vì gọi thẳng là mặt trời và mặt trăng.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: nguồn sáng lớn hơn
  rationale: Dạng gốc theo nghĩa đen là “nguồn sáng lớn”, nhưng trong cặp đối chiếu với nguồn sáng nhỏ, tiếng Việt tự nhiên dùng cấp so sánh “lớn hơn”.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: để cai quản ban ngày
  rationale: מֶמְשֶׁלֶת biểu thị quyền cai trị hoặc sự quản trị. “Để cai quản” vừa phản ánh chức năng vừa giữ sắc thái thống trị của từ gốc.
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: nguồn sáng nhỏ hơn
  rationale: קָטֹן có nghĩa là nhỏ hoặc nhỏ hơn; cấp so sánh tạo thế cân xứng tự nhiên với “nguồn sáng lớn hơn”.
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: để cai quản ban đêm
  rationale: Giữ cùng cấu trúc và ý nghĩa với mệnh đề song song về ban ngày.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: cùng các ngôi sao
  rationale: Liên từ và dấu hiệu tân ngữ giới thiệu thêm một đối tượng được tạo nên. “Cùng các ngôi sao” giữ được tính chất bổ sung ngắn gọn của câu Hê-bơ-rơ.
theological_decisions:
- issue: Cách gọi hai thiên thể mà không nêu tên mặt trời và mặt trăng
  choice: Giữ “nguồn sáng lớn hơn” và “nguồn sáng nhỏ hơn”.
  alternative: Dịch trực tiếp là “mặt trời” và “mặt trăng”.
  rationale: Bản Hê-bơ-rơ dùng מָאוֹר (“nguồn sáng/vật phát sáng”), không dùng tên gọi thông thường của mặt trời và mặt trăng. Giữ cách nói này tôn trọng dụng ý từ ngữ của nguyên bản và không đưa vào câu những danh từ không có trong nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép song song “lớn hơn/nhỏ hơn” và động từ “cai quản”; không thay các “nguồn sáng” bằng tên gọi thiên văn. Dấu chú thích [a] xuất hiện ngay sau cụm liên quan.
