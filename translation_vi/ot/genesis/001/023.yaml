  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם חֲמִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: vi
  text: Rồi có buổi tối, và có buổi sáng—ngày thứ năm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “Và đã có buổi tối, và đã có buổi sáng—ngày thứ năm.”'
    reason: Nêu phương án giữ rõ hơn liên từ lặp lại và dạng trần thuật של וַיְהִי, không thêm hình ảnh “trời tối/trời sáng” không có trong nguyên văn.
lexical_decisions:
- source_word: וַיְהִי
  choice: rồi có
  rationale: Trong công thức trần thuật lặp lại của Sáng Thế Ký 1, cách dịch này tự nhiên trong tiếng Việt, vẫn giữ ý xuất hiện/chuyển sang buổi tối và buổi sáng cùng nhịp điệu của nguyên văn.
- source_word: עֶרֶב
  choice: buổi tối
  rationale: Tương đương trực tiếp và thông dụng của danh từ chỉ thời gian chiều tối.
- source_word: בֹּקֶר
  choice: buổi sáng
  rationale: Tương đương trực tiếp, đồng thời giữ thế song song với “buổi tối”.
- source_word: יוֹם
  choice: ngày
  rationale: Danh từ này gọi tên ngày sáng tạo được đánh số; không thêm cách hiểu cụ thể về độ dài của ngày.
- source_word: חֲמִישִׁי
  choice: thứ năm
  rationale: Số thứ tự bổ nghĩa cho “ngày”, được diễn đạt tự nhiên trong tiếng Việt là “ngày thứ năm”.
theological_decisions:
- issue: Bản chất của công thức về ngày sáng tạo
  choice: Giữ nguyên điệp thức thời gian “có buổi tối, và có buổi sáng—ngày thứ năm” mà không giải thích độ dài hay bản chất của ngày.
  alternative: Diễn giải theo hướng một ngày 24 giờ hoặc theo hướng một thời đại/kỷ nguyên.
  rationale: Bản Hê-bơ-rơ nêu buổi tối, buổi sáng và ngày có số thứ tự, nhưng câu này tự nó không giải quyết các tranh luận thần học về độ dài hoặc tính chất văn chương của những ngày sáng tạo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp điệp của công thức sáng tạo; dấu gạch ngang làm rõ “ngày thứ năm” là phần kết luận. Dấu chú thích [a] xuất hiện trong chính văn.
