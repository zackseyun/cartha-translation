id: GEN.1.30
reference: Genesis 1:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: vi
  text: Còn mọi loài thú trên đất, mọi loài chim trên trời và mọi loài vật bò trên mặt đất có sự sống[a], thì mọi cây cỏ xanh đều dùng làm thức ăn. Và có như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: «trong đó có sinh vật sống.» Cũng có thể dịch rất sát chữ là «trong đó có một linh hồn sống»; cụm này không phải là «hơi thở sự sống» trong Sáng Thế Ký 2:7.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: mọi loài thú trên đất
  rationale: Diễn đạt nhóm động vật sống trên đất mà không thu hẹp quá mức thành chỉ thú hoang.
- source_word: עוֹף הַשָּׁמַיִם
  choice: mọi loài chim trên trời
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại; עוֹף có thể rộng hơn 'chim', nhưng trong ngữ cảnh này 'loài chim' rõ ràng và phù hợp.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: mọi loài bò sát trên mặt đất
  rationale: Giữ hình ảnh các sinh vật bò/trườn trên đất; 'bò sát' ở đây được dùng theo nghĩa thông thường rộng, không nhằm chỉ riêng lớp Reptilia.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: có sự sống
  rationale: Phản ánh chức năng của נֶפֶשׁ חַיָּה trong mệnh đề này mà không nhầm với נִשְׁמַת חַיִּים, 'hơi thở sự sống'; cách dịch sát hơn được ghi ở chú thích.
- source_word: כָּל יֶרֶק עֵשֶׂב
  choice: mọi cây cỏ xanh
  rationale: Truyền đạt tự nhiên ý nghĩa toàn bộ thảm thực vật xanh dùng làm thức ăn.
- source_word: לְאָכְלָה
  choice: dùng làm thức ăn
  rationale: Diễn đạt rõ mục đích ăn/uống của cấu trúc có לְ.
- source_word: וַיְהִי כֵן
  choice: Và sự việc đã diễn ra như vậy
  rationale: Giữ công thức hoàn tất quen thuộc của Sáng Thế Ký 1 bằng lối văn trang trọng, dễ hiểu.
theological_decisions:
- issue: Ý nghĩa của נֶפֶשׁ חַיָּה khi nói về động vật
  choice: Dịch trong chính văn là 'có sự sống' và chú thích cách dịch sát chữ 'có một sinh vật sống'.
  alternative: '''có một sinh vật sống'' hoặc sát chữ hơn ''có một linh hồn sống'''
  rationale: Cụm Hê-bơ-rơ chỉ một hữu thể/sinh vật sống, không phải cụm 'hơi thở sự sống' trong Sáng Thế Ký 2:7. Cách dịch này tránh áp đặt quan niệm hệ phái về 'linh hồn' của động vật, đồng thời giữ phương án sát chữ trong chú thích.
- issue: Động từ được hiểu ngầm trong mệnh đề về thức ăn
  choice: Không thêm 'Ta ban cho' vào chính văn; dùng 'đều dùng làm thức ăn'.
  alternative: '''Ta ban mọi cây cỏ xanh làm thức ăn'' theo động từ được hiểu từ câu 29'
  rationale: Câu Hê-bơ-rơ không lặp lại động từ נָתַתִּי của câu trước. Bản dịch tạo một câu tiếng Việt hoàn chỉnh nhưng không biến động từ được hiểu theo văn cảnh thành từ ngữ hiển nhiên có mặt trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ nhịp liệt kê của nguyên văn. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan trong chính văn.
