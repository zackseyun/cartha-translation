  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: vi
  text: Đức Chúa Trời gọi khoảng không[a] là Trời[b]. Có buổi chiều và có buổi sáng—ngày thứ hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vòm” hoặc theo cách truyền thống là “thương khung.” Từ Hê-bơ-rơ רָקִיעַ chỉ điều gì đó được giăng rộng ra; ở đây dịch là “khoảng không” để tránh xác định quá mức hình dạng hay cấu tạo của nó.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bầu trời” hoặc “các tầng trời.” Từ Hê-bơ-rơ שָׁמַיִם có thể chỉ bầu trời hay các tầng trời; tại đây đó là tên Đức Chúa Trời đặt cho khoảng không.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gọi … là
  rationale: Động từ קרא đi với ל trong ngữ cảnh này diễn tả việc đặt tên. Cấu trúc “gọi … là” tự nhiên trong tiếng Việt và giữ rõ hành động định danh.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Dạng số nhiều này đi với động từ số ít và chỉ Đấng Tạo Hóa duy nhất trong Sáng Thế Ký 1; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: לָרָקִיעַ
  choice: khoảng không
  rationale: רָקִיעַ chỉ vật hoặc vùng được giăng rộng ra. “Khoảng không” dễ hiểu, tự nhiên và ít áp đặt một mô hình vũ trụ cụ thể hơn “vòm,” đồng thời tránh từ cổ “thương khung.”
- source_word: שָׁמָיִם
  choice: Trời
  rationale: Ở đây שָׁמַיִם là tên Đức Chúa Trời đặt cho khoảng không. “Trời” giữ được tính chất định danh và sự hàm súc của nguyên văn; viết hoa để cho thấy đây là tên được đặt trong câu.
- source_word: וַיְהִי
  choice: có
  rationale: Trong điệp khúc đánh dấu các ngày sáng tạo, “có” diễn đạt tự nhiên sự xuất hiện của buổi chiều và buổi sáng mà không làm nặng câu.
- source_word: עֶרֶב
  choice: buổi chiều
  rationale: Cách dịch thông dụng, rõ nghĩa trong công thức lặp lại về các ngày sáng tạo.
- source_word: בֹקֶר
  choice: buổi sáng
  rationale: Cách dịch thông dụng, rõ nghĩa trong công thức lặp lại về các ngày sáng tạo.
- source_word: יוֹם שֵׁנִי
  choice: ngày thứ hai
  rationale: Đây là cách ghi thứ tự tự nhiên trong tiếng Việt và phù hợp chức năng đánh số ngày của cụm từ Hê-bơ-rơ.
theological_decisions:
- issue: Cách hiểu שָׁמָיִם là tên được đặt cho רָקִיעַ
  choice: Trời
  alternative: bầu trời; các tầng trời
  rationale: “Trời” duy trì giọng văn trang trọng và hành động đặt tên mà không buộc cụm từ phải chỉ nơi ngự của Đức Chúa Trời hay một mô hình vũ trụ về sau. Chú thích giữ lại các khả năng chỉ bầu trời hoặc các tầng trời.
- issue: Hình dung vật lý hàm chứa trong רָקִיעַ
  choice: khoảng không
  alternative: vòm; thương khung
  rationale: Nguyên ngữ gợi điều được giăng rộng nhưng không tự nó giải quyết mọi câu hỏi về hình dạng hay cấu tạo. “Khoảng không” giữ mức độ khái quát ấy, còn chú thích nêu các cách dịch khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc “gọi … là” làm rõ hành động đặt tên; nhịp lặp “Có buổi chiều và có buổi sáng” giữ nét công thức của trình thuật sáng tạo. Các dấu chú thích được đặt ngay sau đúng từ ngữ cần giải thích.
