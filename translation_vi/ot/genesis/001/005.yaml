source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לָ/אוֹר֙ י֔וֹם וְ/לַ/חֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם אֶחָֽד׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: vi
  text: Đức Chúa Trời gọi ánh sáng là Ngày, còn bóng tối thì Ngài gọi là Đêm. Có buổi chiều, rồi có buổi sáng—ngày thứ nhất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “ngày một.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: Động từ קרא trong cấu trúc đặt tên có nghĩa là “gọi/đặt tên”; “gọi” vừa tự nhiên trong tiếng Việt vừa giữ sát cách diễn đạt của tiếng Hê-bơ-rơ.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thức số nhiều nhưng đi với động từ số ít và chỉ Đấng Tạo Hóa duy nhất; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: לָאוֹר
  choice: ánh sáng
  rationale: Giới từ ל thuộc cấu trúc gọi tên; tiếng Việt diễn đạt tự nhiên là “gọi ánh sáng là…”, không cần dịch giới từ riêng.
- source_word: יוֹם
  choice: Ngày
  rationale: Đây là tên được đặt cho ánh sáng; viết hoa giúp thể hiện hành động gọi tên.
- source_word: וְלַחֹשֶׁךְ
  choice: còn bóng tối
  rationale: “Bóng tối” thể hiện nghĩa cơ bản của חֹשֶׁךְ; “còn” làm rõ sự đối xứng với ánh sáng mà vẫn giữ nhịp câu tự nhiên.
- source_word: קָרָא
  choice: Ngài gọi
  rationale: Lặp lại động từ để giữ phép song hành của nguyên văn; đại từ “Ngài” chỉ Đức Chúa Trời một cách rõ ràng và trang trọng.
- source_word: לָיְלָה
  choice: Đêm
  rationale: Đây là tên được đặt cho bóng tối; viết hoa để đánh dấu tên gọi.
- source_word: וַיְהִי
  choice: có
  rationale: Trong công thức “có buổi chiều, có buổi sáng”, “có” là cách diễn đạt tồn tại ngắn gọn, tự nhiên và giữ được sự lặp lại của tiếng Hê-bơ-rơ.
- source_word: עֶרֶב
  choice: buổi chiều
  rationale: Giữ nghĩa rộng, thông thường của עֶרֶב, không thu hẹp thành “lúc mặt trời lặn”.
- source_word: בֹקֶר
  choice: buổi sáng
  rationale: Giữ nghĩa thông thường của בֹקֶר, không thu hẹp thành “rạng đông”.
- source_word: יוֹם אֶחָד
  choice: ngày thứ nhất
  rationale: Cụm Hê-bơ-rơ dùng số đếm “một”, nhưng trong chuỗi tường thuật, “ngày thứ nhất” là cách diễn đạt tiếng Việt tự nhiên nhất; nghĩa sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch יוֹם אֶחָד ở cuối công thức ngày sáng tạo
  choice: ngày thứ nhất
  alternative: một ngày / ngày một
  rationale: Nguyên văn dùng số đếm אֶחָד (“một”), không dùng số thứ tự “thứ nhất”. Tuy vậy, trong trình tự kể chuyện tiếng Việt, “ngày thứ nhất” truyền đạt chức năng của cụm từ rõ và tự nhiên hơn. Chú thích bảo tồn hình thức nguyên văn để không xóa đi sắc thái có thể có ý nghĩa diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép song hành của hai hành động gọi tên và nhịp lặp “có buổi chiều, có buổi sáng”. Dấu gạch ngang nối công thức thời gian với kết luận về ngày.
