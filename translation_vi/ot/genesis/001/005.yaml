revisions:
- from: Đức Chúa Trời gọi ánh sáng là Ngày, còn bóng tối thì Ngài gọi là Đêm. Có buổi chiều, có buổi sáng—ngày thứ nhất.[a]
  to: Đức Chúa Trời gọi ánh sáng là Ngày, còn bóng tối thì Ngài gọi là Đêm. Có buổi chiều, rồi có buổi sáng—ngày thứ nhất.[a]
  rationale: Chỉ sửa chú thích để bảo tồn chính xác cách diễn đạt tiếng Hê-bơ-rơ “ngày một”, thay vì đưa vào phương án “một ngày” có thể gây lệch nghĩa. Thêm “rồi” giúp liên kết hai mệnh đề tồn tại tự nhiên trong tiếng Việt, đồng thời vẫn phản ánh trình tự do liên từ lặp lại trong nguyên văn.
