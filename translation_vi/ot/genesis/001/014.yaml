  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán: “Phải có các nguồn sáng trong khoảng không trên bầu trời để phân cách ngày với đêm; chúng sẽ dùng làm dấu hiệu, để xác định các thời điểm đã định[a], ngày và năm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các mùa” hoặc “các kỳ lễ”. Từ Hê-bơ-rơ מוֹעֲדִים chỉ những thời điểm được ấn định và trong các văn cảnh khác có thể bao gồm những kỳ lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: các nguồn sáng
  rationale: Danh từ chỉ những vật mang hoặc phát ánh sáng; “các nguồn sáng” tự nhiên và chính xác hơn “các ánh sáng” trong tiếng Việt.
- source_word: רָקִיעַ הַשָּׁמַיִם
  choice: khoảng không của trời
  rationale: Giữ ý về vùng không gian trải rộng trên cao mà không áp đặt hình ảnh cụ thể như mái vòm.
- source_word: לְהַבְדִּיל בֵּין הַיּוֹם וּבֵין הַלָּיְלָה
  choice: để phân cách ngày với đêm
  rationale: Diễn đạt rõ mục đích và duy trì mô-típ phân cách trong Sáng Thế Ký 1.
- source_word: לְאֹתֹת
  choice: dùng làm dấu hiệu
  rationale: Giữ phạm vi nghĩa rộng của אות là dấu hiệu hoặc vật chỉ dấu, không thu hẹp loại dấu hiệu.
- source_word: לְמוֹעֲדִים
  choice: xác định các thời điểm đã định
  rationale: מוֹעֲדִים chỉ những thời điểm được ấn định, có thể bao gồm các kỳ lễ nhưng trong ngữ cảnh này không nhất thiết chỉ về lễ nghi.
- source_word: לְיָמִים וְשָׁנִים
  choice: ngày và năm
  rationale: Chuyển dịch trực tiếp các đơn vị thời gian được nêu trong tiếng Hê-bơ-rơ.
- source_word: יְהִי ... וְהָיוּ
  choice: Phải có ... chúng dùng làm
  rationale: “Phải có” truyền đạt lời phán tạo dựng; mệnh đề tiếp theo được diễn đạt tự nhiên như chức năng được định cho các nguồn sáng.
theological_decisions:
- issue: Nghĩa của מוֹעֲדִים trong bối cảnh sáng tạo
  choice: các thời điểm đã định
  alternative: các mùa; các kỳ lễ
  rationale: Bối cảnh nói về việc sắp đặt thời gian trong vũ trụ. Cách dịch này giữ được nghĩa rộng và khả năng liên hệ đến các kỳ lễ về sau nhưng không áp nghĩa nghi lễ vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời phán” theo lối Kinh Thánh Việt ngữ quen thuộc; tránh thuật ngữ cổ “vòm trời” vì có thể diễn giải quá cụ thể hình dạng của רָקִיעַ.
