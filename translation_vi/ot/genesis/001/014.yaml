  to: 'Đức Chúa Trời phán: “Phải có các nguồn sáng trong khoảng không trên bầu trời để phân cách ngày với đêm; chúng sẽ dùng làm dấu hiệu, để xác định các thời điểm đã định[a], ngày và năm.”'
