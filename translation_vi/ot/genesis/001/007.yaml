  terminology: “Đức Chúa Trời,” “làm nên,” “phân cách,” và “khoảng không” đều có thể chấp nhận được. “Khoảng không” là lựa chọn thận trọng cho רָקִיעַ, không áp đặt một mô hình vũ trụ học; chú thích nêu “vòm trời” như một khả năng từ vựng thích hợp.
