  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: vi
  text: Đức Chúa Trời làm nên khoảng không và phân cách nước ở dưới khoảng không với nước ở trên khoảng không.[a] Và đã có như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vòm trời.” Từ Hê-bơ-rơ chỉ một vật hoặc miền được trải rộng ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm nên
  rationale: Động từ עשה thường có nghĩa là “làm, tạo nên”. “Làm nên” trực tiếp, tự nhiên trong văn cảnh sáng tạo và không thêm sắc thái chuyên biệt của “nắn tạo” hay “tạo hình”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong Sáng Thế Ký 1, danh từ אֱלֹהִים đi với động từ số ít và chỉ một Đấng Tạo Hóa; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: הָרָקִיעַ
  choice: khoảng không
  rationale: רָקִיעַ chỉ một vật hay miền được trải rộng ra. “Khoảng không” diễn đạt được ý nghĩa không gian bằng tiếng Việt hiện đại mà không xác định quá mức hình dạng vũ trụ học như “vòm trời”.
- source_word: וַיַּבְדֵּל
  choice: phân cách
  rationale: בדל có nghĩa là tách hoặc phân chia. “Phân cách” vừa tự nhiên trong cấu trúc “phân cách… với…”, vừa giữ chủ đề Đức Chúa Trời thiết lập các ranh giới trong Sáng Thế Ký 1.
- source_word: בֵּין ... וּבֵין
  choice: … với …
  rationale: Cấu trúc Hê-bơ-rơ đánh dấu sự phân biệt giữa hai đối tượng. Sau động từ “phân cách”, cấu trúc tiếng Việt “phân cách X với Y” truyền đạt tự nhiên cùng ý nghĩa.
- source_word: הַמַּיִם
  choice: nước
  rationale: מַיִם có hình thức số nhiều trong tiếng Hê-bơ-rơ nhưng thường là danh từ khối. Tiếng Việt dùng “nước” tự nhiên và không cần đánh dấu số nhiều.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: ở dưới khoảng không
  rationale: Cụm từ chỉ vị trí phía dưới, tạo thế đối xứng theo chiều thẳng đứng với “ở trên khoảng không”.
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: ở trên khoảng không
  rationale: Cụm từ chỉ vị trí phía trên và là vế tương ứng rõ ràng với “ở dưới khoảng không”.
- source_word: וַיְהִי כֵן
  choice: Sự việc diễn ra như thế
  rationale: Đây là công thức lặp lại trong Sáng Thế Ký 1, xác nhận điều Đức Chúa Trời phán đã được thực hiện. Cách dịch này tự nhiên trong tiếng Việt và giữ chức năng xác nhận của câu.
theological_decisions:
- issue: Cách dịch רָקִיעַ trong văn cảnh sáng tạo có hàm ý vũ trụ học
  choice: khoảng không
  alternative: vòm trời
  rationale: “Khoảng không” giữ ý niệm về một miền được trải rộng mà không buộc bản văn vào một mô hình vũ trụ học cụ thể. “Vòm trời” vẫn là khả năng từ vựng hợp lý nhưng xác định hình dạng rõ hơn điều từ ngữ tự nó đòi hỏi, nên được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể cô đọng của nguyên văn; dùng “Đức Chúa Trời” theo lối gọi phổ biến trong văn chương Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt ngay sau lần mô tả hoàn chỉnh về khoảng không.
