  source_fidelity: 'Bản dịch truyền đạt đúng các hành động chính và thế đối xứng không gian của nguyên văn: Đức Chúa Trời làm ra רָקִיעַ, phân cách nước phía dưới với nước phía trên, rồi công thức xác nhận וַיְהִי כֵן. Tuy nhiên, “Sự việc diễn ra như thế” diễn giải công thức cuối thành một sự kiện ‘diễn ra’, trong khi nguyên văn là công thức ngắn, lặp lại, xác nhận rằng điều đã được phán/làm là như vậy.'
