base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: vi
  text: 'Đức Chúa Trời thấy mọi điều Ngài đã làm, và kìa, mọi điều ấy rất tốt. Có buổi tối, rồi có buổi sáng: ngày thứ sáu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Động từ ראה ở dạng kể chuyện được dịch trực tiếp là “thấy”; trong ngữ cảnh có sắc thái nhận định, nhưng không cần diễn giải thêm.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong Sáng Thế Ký 1, danh từ có hình thức số nhiều này đi với động từ số ít và chỉ về Đấng Tạo Hóa duy nhất; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: mọi điều Ngài đã làm
  rationale: Diễn đạt trọn vẹn toàn bộ những gì Đức Chúa Trời đã hoàn tất; “đã làm” thể hiện hành động có trước sự xem xét của Ngài.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: “Kìa” giữ chức năng thu hút sự chú ý và sắc thái sống động của הִנֵּה; liên từ “và” phản ánh וְ.
- source_word: טוֹב מְאֹד
  choice: thật rất tốt đẹp
  rationale: “Tốt đẹp” diễn đạt tự nhiên phạm vi rộng của טוֹב, còn “thật rất” giữ sức nhấn mạnh của מְאֹד mà không thu hẹp ý nghĩa thành riêng đạo đức, thẩm mỹ hay công dụng.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Có buổi tối và có buổi sáng
  rationale: Giữ công thức lặp của היה với các danh từ chỉ thời gian, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: יוֹם הַשִּׁשִּׁי
  choice: ngày thứ sáu
  rationale: Phản ánh danh từ יוֹם cùng số thứ tự xác định הַשִּׁשִּׁי bằng cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất của sự tốt đẹp trong טוֹב מְאֹד
  choice: thật rất tốt đẹp
  alternative: vô cùng tốt lành
  rationale: Cách dịch này giữ lời khẳng định rộng về toàn thể công trình sáng tạo, không giới hạn “tốt” vào phạm trù đạo đức, thẩm mỹ hay chức năng.
- issue: Công thức ngày sáng tạo và các tranh luận về bản chất của “ngày”
  choice: 'Có buổi tối và có buổi sáng: ngày thứ sáu'
  alternative: Rồi có buổi tối, rồi có buổi sáng—ngày thứ sáu
  rationale: Bám sát công thức Hê-bơ-rơ mà không thêm lời giải thích về độ dài hay chức năng văn chương của ngày; dấu hai chấm cho thấy “ngày thứ sáu” kết luận công thức nhưng không quyết định tranh luận diễn giải.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu Đức Chúa Trời, “kìa” để bảo toàn sức gợi chú ý của nguyên văn, và giữ nhịp công thức ở cuối câu. Không cần chú thích vì không có dị bản hay độ mơ hồ nào đòi hỏi giải thích trong bản văn chính.
