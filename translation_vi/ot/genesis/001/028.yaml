revisions:
- from: 'Đức Chúa Trời ban phước cho họ và phán với họ: “Hãy sinh sôi, nảy nở thật nhiều, làm đầy dẫy đất, chinh phục đất ấy, và cai trị cá biển, chim trời cùng mọi sinh vật di chuyển trên mặt đất.”[a]'
  to: 'Đức Chúa Trời ban phước cho họ và phán với họ: “Hãy sinh sôi, nảy nở, làm cho đất đầy dẫy, chinh phục đất ấy, và cai trị trên cá biển, chim trời cùng mọi sinh vật di chuyển trên mặt đất[a].”'
  rationale: Bản sửa bỏ phần nhấn mạnh thêm ngoài nguyên văn, làm rõ mệnh lệnh “làm đầy đất,” cải thiện kết hợp từ với “cai trị,” và di chuyển ký hiệu chú thích đến ngay cụm רֹמֶשֶׂת עַל־הָאָרֶץ. Các lựa chọn chủ đạo về “chinh phục” và “cai trị” được giữ nguyên để phản ánh lực của כבש và רדה.
