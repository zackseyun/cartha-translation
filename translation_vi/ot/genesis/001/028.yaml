base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: vi
  text: 'Đức Chúa Trời ban phước cho họ và phán với họ: “Hãy sinh sôi, nảy nở, làm cho đất đầy dẫy, chinh phục đất ấy, và cai trị trên cá biển, chim trời cùng mọi sinh vật di chuyển trên mặt đất[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “di chuyển trên mặt đất” là “bò trên mặt đất.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ban phước
  rationale: Thể piel của ברך tại đây chỉ hành động Đức Chúa Trời thực sự ban phước, không chỉ nói lời tốt lành; “ban phước” tự nhiên và mang tính thực hiện trong tiếng Việt.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ hình thức số nhiều đi với động từ số ít trong Sáng Thế Ký 1 chỉ Đức Chúa Trời duy nhất; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: פְּרוּ וּרְבוּ
  choice: Hãy sinh sôi, nảy nở thật nhiều
  rationale: Cặp mệnh lệnh nói về khả năng sinh sản và gia tăng số lượng. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được hai ý liên tiếp của nguyên văn.
- source_word: וּמִלְאוּ אֶת־הָאָרֶץ
  choice: làm đầy dẫy đất
  rationale: מלא có nghĩa là làm cho đầy; trong bối cảnh sáng tạo mang tính toàn cầu, הָאָרֶץ là toàn thể đất/địa cầu chứ không phải một lãnh thổ riêng.
- source_word: וְכִבְשֻׁהָ
  choice: chinh phục đất ấy
  rationale: כבש mang nghĩa mạnh là đặt dưới quyền kiểm soát hoặc khuất phục. “Chinh phục” giữ sức nặng của động từ mà không tự thêm ý khai thác hay chăm sóc.
- source_word: וּרְדוּ
  choice: cai trị
  rationale: רדה diễn tả việc thi hành quyền cai quản. “Cai trị” rõ nghĩa, hiện đại và giữ nguyên sắc thái thẩm quyền.
- source_word: בִּדְגַת הַיָּם
  choice: cá biển
  rationale: Cụm từ chỉ cá ở biển một cách cụ thể, không phải toàn bộ sinh vật biển.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: chim trời
  rationale: עוֹף có thể rộng hơn là các loài bay, nhưng “chim trời” là cách diễn đạt tự nhiên, trang trọng và phù hợp ngữ cảnh.
- source_word: בְכָל־חַיָּה הָרֹמֶשֶׂת עַל־הָאָרֶץ
  choice: mọi sinh vật di chuyển trên mặt đất
  rationale: חַיָּה là sinh vật hay loài vật; רמש ở đây chỉ sự chuyển động trên đất. Cách dịch rộng này tránh thu hẹp không cần thiết thành riêng loài bò sát hoặc côn trùng.
theological_decisions:
- issue: Mức độ mạnh của mệnh lệnh dành cho con người đối với đất và sinh vật trong כבש và רדה
  choice: 'Giữ ngôn ngữ mạnh: “chinh phục” và “cai trị”'
  alternative: “chăm sóc”, “quản lý” hoặc “làm người quản gia”
  rationale: Các động từ Hê-bơ-rơ mạnh hơn ý chăm sóc đơn thuần. Bản dịch không làm nhẹ mệnh lệnh nhưng cũng không thêm hàm ý bóc lột mà nguyên văn không nói.
- issue: Phạm vi của הָאָרֶץ
  choice: Hiểu là toàn thể đất/địa cầu trong bối cảnh sáng tạo
  alternative: Một vùng đất hay lãnh thổ cụ thể
  rationale: Sáng Thế Ký 1 trình bày công cuộc sáng tạo với phạm vi phổ quát, nên mệnh lệnh này không bị giới hạn vào một lãnh thổ địa phương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng nhịp câu mệnh lệnh cân đối; tránh thuật ngữ giáo phái. Dấu chú thích [a] được đặt ngay sau câu có từ cần chú giải.
