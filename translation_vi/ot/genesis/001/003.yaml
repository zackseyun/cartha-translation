  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: vi
  text: 'Đức Chúa Trời phán[a]: “Hãy có ánh sáng,” và có ánh sáng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ước có ánh sáng.” Tiếng Hê-bơ-rơ dùng thể jussive, diễn tả ý muốn hoặc mệnh lệnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ wayyiqtol của אמר tiếp nối mạch tường thuật. Trong ngữ cảnh lời nói của Đức Chúa Trời, “phán” là cách diễn đạt tự nhiên, trang trọng và không cần thêm liên từ vốn có thể làm câu tiếng Việt nặng nề.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thức số nhiều nhưng đi với động từ số ít và chỉ Đấng Tạo Hóa duy nhất; “Đức Chúa Trời” là cách gọi tiếng Việt chuẩn, trang trọng.
- source_word: יְהִי
  choice: Phải có
  rationale: Thể jussive của היה diễn tả ý muốn hoặc mệnh lệnh. “Phải có” truyền đạt rõ sắc thái mệnh lệnh sáng tạo trong tiếng Việt hiện đại, đồng thời không diễn giải cách thức ánh sáng xuất hiện.
- source_word: אוֹר
  choice: ánh sáng
  rationale: Nghĩa cơ bản của từ là “ánh sáng”; ngữ cảnh không đòi hỏi thu hẹp thành một nguồn sáng cụ thể hay hiểu theo nghĩa ẩn dụ.
- source_word: וַיְהִי
  choice: thì có
  rationale: Động từ wayyiqtol của היה thuật lại kết quả trực tiếp của lời phán. “thì có” diễn đạt tự nhiên quan hệ mệnh lệnh–ứng nghiệm và giữ câu cô đọng.
- source_word: אוֹר
  choice: ánh sáng
  rationale: Giữ nguyên danh từ được lặp lại như trong tiếng Hê-bơ-rơ để nhấn mạnh lời phán được thực hiện đúng như vậy.
theological_decisions:
- issue: Cách dịch mệnh lệnh sáng tạo của Đức Chúa Trời
  choice: Phải có ánh sáng
  alternative: Nguyện có ánh sáng
  rationale: Thể jussive có thể biểu thị ý muốn hoặc mệnh lệnh. Trong lời phán sáng tạo này, “Phải có” giữ được sức mạnh của mệnh lệnh hữu hiệu mà không biến câu thành lời cầu xin; chú thích bảo tồn cách hiểu gần với sắc thái mong muốn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời và cấu trúc “Phải có… thì có…” để tái hiện ngắn gọn lời truyền cùng sự ứng nghiệm tức thì.
