  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם רְבִיעִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: vi
  text: Rồi có buổi tối, rồi có buổi sáng—ngày thứ tư.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa về hình thức hơn: “Rồi có buổi tối, rồi có buổi sáng, một ngày thứ tư.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: rồi có
  rationale: Động từ היה ở dạng wayyiqtol trong điệp khúc tường thuật này mang nghĩa hiện hữu và đánh dấu diễn tiến, khép lại một ngày. “Rồi có” tự nhiên trong tiếng Việt, đồng thời không diễn giải quá mức thành “trở nên”.
- source_word: עֶרֶב
  choice: buổi tối
  rationale: Danh từ này chỉ thời điểm buổi tối; cách dịch trực tiếp và quen thuộc này phù hợp với điệp khúc về các ngày sáng tạo.
- source_word: וַיְהִי
  choice: rồi có
  rationale: Lần lặp lại của động từ được dịch nhất quán để giữ nhịp và cấu trúc cân xứng của câu Hê-bơ-rơ.
- source_word: בֹקֶר
  choice: buổi sáng
  rationale: Danh từ này chỉ buổi sáng; đây là cách dịch trực tiếp, tự nhiên và tương ứng với “buổi tối”.
- source_word: יוֹם רְבִיעִי
  choice: ngày thứ tư
  rationale: Cụm từ xác định ngày bằng số thứ tự. “Ngày thứ tư” là cách nói tự nhiên trong tiếng Việt và không cần thêm mạo từ như trong tiếng Anh.
theological_decisions:
- issue: Diễn đạt điệp khúc về ngày sáng tạo mà không áp đặt một quan điểm cụ thể về niên đại hoặc độ dài của các ngày
  choice: Rồi có buổi tối, rồi có buổi sáng—ngày thứ tư.
  alternative: 'Rồi có buổi tối và có buổi sáng: một ngày thứ tư.'
  rationale: Bản dịch giữ nguyên các yếu tố của điệp khúc Hê-bơ-rơ và chỉ xác định thứ tự của ngày, không dùng từ ngữ nhằm giải quyết những tranh luận rộng hơn về bản chất hay độ dài của các ngày sáng tạo.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc lặp “rồi có… rồi có…” giữ nhịp điệu của nguyên văn; dấu gạch ngang làm nổi bật lời xác định “ngày thứ tư” mà không thêm cách giải thích thần học.
