base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán: “Này, Ta đã ban cho các ngươi mọi cây cỏ sinh hạt trên khắp mặt đất, cùng mọi cây có quả sinh hạt. Những thứ ấy sẽ làm thức ăn cho các ngươi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Từ dẫn nhập tự nhiên và trang trọng trong tiếng Việt, giữ chức năng thu hút sự chú ý của từ Hê-bơ-rơ.
- source_word: נָתַתִּי
  choice: Ta ban cho
  rationale: Trong ngữ cảnh lời tuyên bố ban cấp, cách nói hiện tại trang trọng này diễn đạt hành động đã được Đức Chúa Trời quyết định và thực hiện, có hiệu lực ngay lúc ấy.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: mọi loài cây cỏ sinh hạt
  rationale: “Cây cỏ” diễn đạt עֵשֶׂב theo nghĩa thực vật nói chung, còn “sinh hạt” giữ ý của cụm phân từ זֹרֵעַ זֶרַע.
- source_word: אֲשֶׁר עַל פְּנֵי כָל הָאָרֶץ
  choice: trên khắp mặt đất
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, vẫn giữ phạm vi toàn thể và hình ảnh bề mặt của đất.
- source_word: כָּל הָעֵץ
  choice: mọi loài cây
  rationale: כָּל đi với danh từ số ít có ý nghĩa phân bố; “mọi loài cây” tự nhiên hơn “mỗi cây” trong văn cảnh này.
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: có quả sinh hạt
  rationale: Diễn đạt gọn, tự nhiên và giữ ý cốt lõi rằng quả ở trên cây có hạt, tránh lặp từ vụng về theo cấu trúc Hê-bơ-rơ.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: Những thứ ấy sẽ làm thức ăn cho các con
  rationale: Đại từ số nhiều quy chiếu tự nhiên đến cả cây cỏ và cây có quả; “làm thức ăn” diễn đạt rõ công dụng được ban.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời”, đại từ tự xưng “Ta” trong lời phán và “các con” cho đại từ số nhiều לָכֶם; không bổ sung ý nghĩa giáo phái hay giải thích vượt quá câu Hê-bơ-rơ.
