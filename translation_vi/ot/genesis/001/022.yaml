base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: vi
  text: 'Đức Chúa Trời ban phước cho chúng và phán: “Hãy sinh sôi, nảy nở và làm đầy các vùng biển; còn các sinh vật bay[a] hãy gia tăng trên đất.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chim”; từ Hê-bơ-rơ עוֹף có thể chỉ rộng hơn, gồm các sinh vật có cánh hoặc biết bay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ban phước
  rationale: Dạng piel của ברך diễn tả việc Đức Chúa Trời ban phước; “ban phước” tự nhiên, trang trọng và giữ rõ hành động của Ngài.
- source_word: אֹתָם
  choice: cho chúng
  rationale: Đại từ làm tân ngữ, chỉ các sinh vật biển và các loài bay ở câu trước; tiếng Việt dùng “cho chúng” tự nhiên với động từ “ban phước”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong Sáng Thế Ký 1, danh từ này đi với động từ số ít và chỉ Đấng Tạo Hóa duy nhất; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: và phán
  rationale: Cấu trúc nguyên mẫu giới thiệu lời nói trực tiếp. Trong ngữ cảnh lời Đức Chúa Trời, “phán” tự nhiên và trang trọng; liên từ được diễn đạt để câu tiếng Việt trôi chảy.
- source_word: פְּרוּ
  choice: Hãy sinh sôi
  rationale: Mệnh lệnh của פרה nói về khả năng sinh sản; “sinh sôi” giữ sắc thái phồn sinh mà không thu hẹp thành sự tăng số lượng đơn thuần.
- source_word: וּרְבוּ
  choice: nảy nở
  rationale: Mệnh lệnh của רבה chỉ sự gia tăng đông đảo. Cặp “sinh sôi, nảy nở” là thành ngữ tiếng Việt tự nhiên và phân biệt tương đối hai động từ Hê-bơ-rơ.
- source_word: וּמִלְאוּ
  choice: làm đầy
  rationale: מלא có nghĩa là làm cho đầy. “Làm đầy” giữ tính ngoại động và phù hợp với tân ngữ “nước”.
- source_word: אֶת הַמַּיִם
  choice: nước
  rationale: מַיִם có hình thức số nhiều trong tiếng Hê-bơ-rơ nhưng tiếng Việt tự nhiên dùng danh từ khối “nước”; ý nghĩa không bị thay đổi.
- source_word: בַּיַּמִּים
  choice: trong các biển
  rationale: Giữ số nhiều của יַמִּים và quan hệ không gian được biểu thị bằng בְּ.
- source_word: וְהָעוֹף
  choice: các loài bay
  rationale: עוֹף có thể chỉ rộng hơn chim, bao gồm các sinh vật có cánh hoặc biết bay. “Các loài bay” bảo toàn độ rộng từ vựng; chú thích nêu cách hiểu hẹp hơn.
- source_word: יִרֶב
  choice: hãy gia tăng
  rationale: Dạng jussive/imperfect của רבה có lực ý nguyện. “Hãy gia tăng” giữ sắc thái chúc phước mang hình thức truyền lệnh, thay vì biến thành lời dự báo đơn thuần.
- source_word: בָּאָרֶץ
  choice: trên đất
  rationale: אָרֶץ ở đây là cõi đất đối lập với biển; “trên đất” trực tiếp, tự nhiên và không buộc phải hiểu là toàn bộ địa cầu.
theological_decisions:
- issue: Bản chất của lời nói trong sự ban phước
  choice: 'Giữ các mệnh lệnh và thể ý nguyện như lời ban phước được diễn đạt dưới hình thức truyền lệnh: “Hãy sinh sôi, nảy nở… hãy gia tăng.”'
  alternative: 'Có thể dịch tất cả như mệnh lệnh thuần túy, hoặc biến mệnh đề cuối thành lời dự báo: “các loài chim sẽ gia tăng.”'
  rationale: Nguyên văn đặt lời ban phước của Đức Chúa Trời trong các hình thức mệnh lệnh và ý nguyện. Bản dịch giữ nguyên sức căng giữa lời chúc phước và lời truyền, không giản lược thành chỉ mệnh lệnh hay chỉ dự báo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng nhịp quen thuộc “sinh sôi, nảy nở,” nhưng giữ “các loài bay” để phản ánh phạm vi nghĩa rộng của עוֹף. Dấu chấm phẩy giúp phân biệt lời hướng đến sinh vật dưới nước với lời dành cho các loài bay.
