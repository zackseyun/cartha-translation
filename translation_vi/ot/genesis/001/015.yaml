  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: vi
  text: Và chúng sẽ là các vật sáng trong khoảng không của bầu trời để chiếu sáng trên đất. Và đã có như vậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: và chúng phải làm
  rationale: Trong lời phán sáng tạo này, dạng động từ tiếp nối sắc thái mệnh lệnh của câu trước; “phải làm” diễn đạt tự nhiên việc chỉ định chức năng, thay vì chỉ nói về tương lai.
- source_word: לִמְאוֹרֹת
  choice: những vật phát sáng
  rationale: מָאוֹר chỉ vật thể hay nguồn phát ra ánh sáng, không phải ánh sáng trừu tượng. Cách dịch này chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: trên khoảng không của trời
  rationale: רָקִיעַ chỉ khoảng trải rộng trên cao; “khoảng không” giữ được hình ảnh không gian mà không dùng từ cổ hoặc áp đặt một mô hình vũ trụ học cụ thể. Giới từ “trên” tự nhiên trong tiếng Việt khi nói các thiên thể ở khoảng không.
- source_word: לְהָאִיר
  choice: để chiếu sáng
  rationale: Dạng Hiphil của אור mang nghĩa tác động, làm cho có ánh sáng; “chiếu sáng” diễn đạt rõ và tự nhiên chức năng này.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Cách nói gọn, tự nhiên, diễn đạt phạm vi nhận ánh sáng; הָאָרֶץ trong ngữ cảnh này chỉ mặt đất/đất bên dưới.
- source_word: וַיְהִי כֵן
  choice: Mọi việc liền diễn ra như vậy
  rationale: Giữ công thức hoàn tất lời phán trong Sáng Thế Ký 1, đồng thời dùng câu tiếng Việt tự nhiên để cho thấy điều được truyền đã thành hiện thực.
theological_decisions:
- issue: Sắc thái ý nguyện/mệnh lệnh của וְהָיוּ trong lời phán sáng tạo
  choice: Dịch là “chúng phải làm”, tiếp nối mệnh lệnh chỉ định chức năng
  alternative: “chúng sẽ làm” như một lời nói về tương lai
  rationale: Ngữ pháp và văn cảnh đặt mệnh đề này trong lời phán chỉ định vai trò cho các vật sáng. Bản dịch giữ cấu trúc lời truyền rồi sự hoàn tất, không thêm nội dung giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “những vật phát sáng” để phân biệt các thiên thể phát sáng với ánh sáng trừu tượng; tránh thuật ngữ cổ như “vòm trời” hoặc “thương khung”.
