  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: vi
  text: Đức Chúa Trời làm nên thú hoang trên đất theo từng loại, gia súc theo từng loại, và mọi vật bò trên mặt đất theo từng loại.[a] Đức Chúa Trời thấy rằng điều đó tốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Loại” ở đây chỉ các nhóm sinh vật theo cách phân chia của bản văn, không nhất thiết tương ứng với khái niệm “loài” trong hệ thống phân loại sinh học hiện đại.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm nên
  rationale: Động từ עשה thường có nghĩa là “làm, tạo nên”. “Làm nên” tự nhiên trong văn cảnh sáng tạo mà không thêm sắc thái không có trong nguyên văn.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong Sáng Thế Ký 1, danh từ có hình thức số nhiều này đi với động từ số ít và chỉ Đấng Tạo Hóa duy nhất; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: חַיַּת הָאָרֶץ
  choice: các loài thú hoang trên đất
  rationale: Cụm từ chỉ nhóm thú sống trên đất, đặc biệt là thú hoang, được phân biệt với gia súc và các loài vật di chuyển sát mặt đất.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: theo từng loại
  rationale: מִין chỉ một loại hay nhóm sinh vật. “Theo từng loại” vừa tự nhiên trong tiếng Việt vừa tránh đồng nhất từ này với một bậc phân loại sinh học hiện đại.
- source_word: הַבְּהֵמָה
  choice: các loài gia súc
  rationale: בְּהֵמָה ở đây chỉ nhóm động vật lớn, nhất là vật nuôi, đối lập với thú hoang. “Gia súc” rõ nghĩa và không thu hẹp thành riêng loài bò.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: mọi loài vật bò trên mặt đất
  rationale: רֶמֶשׂ chỉ các sinh vật nhỏ di chuyển sát mặt đất. “Vật bò” giữ nghĩa rộng hơn “bò sát”, vốn dễ bị hiểu là lớp Reptilia; “mặt đất” thể hiện הָאֲדָמָה và giúp phân biệt với הָאָרֶץ ở đầu câu.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Đức Chúa Trời thấy điều đó thật tốt đẹp
  rationale: Đây là điệp khúc đánh giá trong Sáng Thế Ký 1. “Điều đó” diễn đạt tự nhiên đối tượng được đánh giá; “thật tốt đẹp” truyền đạt sắc thái khẳng định của כִּי־טוֹב trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt các nhóm thụ tạo mà không áp đặt hệ thống phân loại khoa học hiện đại
  choice: theo từng loại
  alternative: theo từng loài / theo từng chủng loài
  rationale: מִין nói đến các nhóm hay loại theo cách phân chia của bản văn. “Loại” bảo toàn độ rộng nghĩa và không biến câu này thành một tuyên bố về khái niệm “loài” trong sinh học hiện đại.
- issue: Phân biệt הָאָרֶץ và הָאֲדָמָה trong cùng câu
  choice: trên đất … trên mặt đất
  alternative: trên đất … trên đất
  rationale: Cách dịch này giữ được sự phân biệt từ vựng giữa “đất/xứ” và “mặt đất/đất nền” trong tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ nhịp liệt kê ba nhóm sinh vật của nguyên văn; dùng “thú hoang”, “gia súc” và “vật bò trên mặt đất” để duy trì sự phân biệt giữa các nhóm. Tránh “bò sát” vì từ đó trong tiếng Việt hiện đại dễ bị hiểu theo nghĩa phân loại khoa học quá hẹp.
