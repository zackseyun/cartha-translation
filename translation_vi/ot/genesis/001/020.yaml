id: GEN.1.20
reference: Genesis 1:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán: “Nước hãy đầy dẫy các sinh vật sống[a], và các loài chim[b] hãy bay trên mặt đất, ngang qua khoảng không của bầu trời[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn lặp một động từ và một danh từ cùng gốc, đều mang ý “đầy dẫy/lúc nhúc”, để nhấn mạnh sự sống phong phú và đông đúc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các sinh vật bay” hoặc “các loài có cánh”; từ Hê-bơ-rơ có thể có phạm vi rộng hơn “các loài chim” theo cách phân loại hiện đại.
    reason: lexical_alternative
  - marker: c
    text: “Khoảng không” cũng có thể dịch là “vòm trời” hoặc “thiên khung”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ kể chuyện được chuyển bằng “phán”, cách nói tự nhiên và trang trọng khi Đức Chúa Trời truyền lệnh sáng tạo; quan hệ tiếp nối đã rõ từ mạch văn nên không cần thêm từ nối.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong Sáng Thế Ký 1, danh từ này đi với động từ số ít và chỉ Đấng Tạo Hóa duy nhất; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  choice: Các vùng nước hãy lúc nhúc vô số
  rationale: Cụm này giữ sắc thái sinh sôi và chuyển động dày đặc của động từ cùng danh từ đồng gốc שׁרץ. “Vô số” diễn đạt sự phong phú mà không lặp từ một cách gượng gạo trong tiếng Việt.
- source_word: נֶפֶשׁ חַיָּה
  choice: sinh vật sống
  rationale: Trong ngữ cảnh này, cụm từ chỉ các sinh vật có sự sống, không nhất thiết đưa ra một khẳng định kỹ thuật về “linh hồn”.
- source_word: וְעוֹף
  choice: và chim chóc
  rationale: “Chim chóc” là cách diễn đạt tự nhiên cho עוֹף trong ngữ cảnh các loài bay, đồng thời chú thích ghi nhận phạm vi nghĩa có thể rộng hơn.
- source_word: יְעוֹפֵף
  choice: hãy bay
  rationale: Thể mệnh lệnh gián tiếp được thể hiện rõ bằng “hãy”; “bay” chuyển đúng nghĩa chuyển động trên không.
- source_word: עַל הָאָרֶץ
  choice: bên trên mặt đất
  rationale: Với động từ bay, עַל diễn tả vị trí hoặc chuyển động ở phía trên đất, không hàm ý tiếp xúc với đất.
- source_word: עַל פְּנֵי
  choice: ngang qua
  rationale: Cách diễn đạt này chuyển hình ảnh chuyển động trên hoặc trước bề mặt của khoảng không mà vẫn tự nhiên trong tiếng Việt.
- source_word: רְקִיעַ הַשָּׁמָיִם
  choice: khoảng không của trời
  rationale: “Khoảng không” giữ ý về vùng rộng trải ra và tránh áp đặt một mô hình vũ trụ học cụ thể; “của trời” phản ánh kết cấu sở hữu trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch נֶפֶשׁ trong trình thuật sáng tạo
  choice: sinh vật sống
  alternative: sinh linh; linh hồn sống
  rationale: Ở đây נֶפֶשׁ חַיָּה chỉ sự sống động vật nói chung. “Sinh vật sống” tránh đưa quan niệm thần học về linh hồn vào một câu không nhằm xác định cấu tạo của sinh vật.
- issue: Cách dịch רְקִיעַ
  choice: khoảng không
  alternative: vòm trời; bầu trời; thiên khung
  rationale: Từ này có ý nghĩa vũ trụ học còn được tranh luận. “Khoảng không” giữ được hình ảnh một vùng trải rộng mà không ngầm quyết định đó là một mái vòm cứng hay chỉ là bầu trời.
- issue: Phạm vi nghĩa của עוֹף
  choice: chim chóc
  alternative: các sinh vật bay; các loài có cánh
  rationale: “Chim chóc” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh, nhưng chú thích bảo lưu khả năng danh từ Hê-bơ-rơ có phạm vi rộng hơn các loài chim theo phân loại hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp hai mệnh lệnh của nguyên văn; dùng “lúc nhúc vô số” để tái hiện sắc thái phong phú của lối lặp đồng gốc trong tiếng Hê-bơ-rơ mà không tạo một câu tiếng Việt gượng ép.
