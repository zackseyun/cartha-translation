  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּ/ת֣וֹךְ הַ/מָּ֑יִם וִ/יהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán: “Hãy có một khoảng không[a] ở giữa nước, để phân cách nước với nước[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vòm trời,” “vòm” hoặc “bầu trời.” Từ Hê-bơ-rơ רָקִיעַ chỉ điều được trải hoặc giăng rộng; các bản dịch khác nhau tùy mức độ chúng diễn đạt cụ thể quan niệm vũ trụ cổ đại.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “phân cách giữa nước với nước,” tức là phân biệt một khối nước với một khối nước khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ với waw liên tiếp đưa trình thuật tiến tới. Trong ngữ cảnh lời truyền của Đấng Tạo Hóa, “phán” là cách diễn đạt tự nhiên, trang trọng và không cần thêm “rồi” hoặc “và” ở đầu câu tiếng Việt.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thức số nhiều nhưng đi với động từ số ít và chỉ về một Đấng Tạo Hóa trong Sáng Thế Ký 1. “Đức Chúa Trời” là cách gọi rõ ràng, trang trọng trong tiếng Việt.
- source_word: יְהִי
  choice: Phải có
  rationale: Thể mệnh lệnh gián tiếp của היה diễn tả lời truyền sáng tạo. “Phải có” giữ được sức truyền lệnh và tự nhiên hơn “nguyện có” trong tiếng Việt hiện đại.
- source_word: רָקִיעַ
  choice: một khoảng không
  rationale: Từ này chỉ một thực thể hay miền được giăng rộng ra. “Khoảng không” chuyển tải ý niệm về một vùng trải rộng mà không buộc câu chính vào một mô hình vũ trụ cụ thể; những cách hiểu cụ thể hơn được ghi ở chú thích.
- source_word: בְּתוֹךְ הַמָּיִם
  choice: ở giữa các vùng nước
  rationale: בְּתוֹךְ chỉ vị trí ở giữa hoặc bên trong; מַיִם có hình thức số nhiều và ở đây nói đến nước nguyên thủy. “Các vùng nước” giữ hình ảnh nhiều khối nước mà vẫn tự nhiên trong tiếng Việt.
- source_word: וִיהִי מַבְדִּיל
  choice: và nó phải phân cách
  rationale: וִיהִי tiếp tục sắc thái mệnh lệnh gián tiếp, còn phân từ Hiphil מַבְדִּיל diễn tả việc làm cho tách biệt. Đại từ “nó” nêu rõ chủ thể là khoảng không vừa được truyền phải có.
- source_word: בֵּין מַיִם לָמָיִם
  choice: vùng nước này với vùng nước kia
  rationale: Cụm Hê-bơ-rơ có nghĩa sát là “giữa nước với nước.” Cách diễn đạt này cho thấy hai vùng nước được phân biệt, đồng thời phù hợp với cú pháp tiếng Việt sau “phân cách”.
theological_decisions:
- issue: Cách dịch רָקִיעַ trong quan hệ với quan niệm vũ trụ cổ đại
  choice: khoảng không
  alternative: vòm trời; vòm; một bề mặt giăng rộng
  rationale: Nguyên văn mô tả thứ Đức Chúa Trời đặt giữa các vùng nước để phân cách chúng, nhưng bản thân câu không giải thích đầy đủ cấu tạo vật lý của nó. “Khoảng không” giữ ý về một miền trải rộng và tránh âm thầm quyết định một mô hình vũ trụ cụ thể; chú thích bảo tồn các khả năng cụ thể hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu trực tiếp giữ sức mạnh của lời truyền sáng tạo; thuật ngữ chính được chọn theo lối tương đương tối ưu, còn sự không chắc chắn về hình dạng của רָקִיעַ được bảo tồn trong chú thích.
