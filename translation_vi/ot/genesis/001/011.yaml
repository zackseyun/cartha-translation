source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: vi
  text: 'Đức Chúa Trời phán: “Đất hãy nảy sinh thảm thực vật: cây cỏ sinh hạt giống và cây ăn quả kết trái theo loài của nó, mà hạt giống ở trong nó,[a] trên đất.” Và đã có như vậy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “mà hạt giống của nó ở trong nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: Đất hãy mọc lên
  rationale: Dạng Hiphil chỉ ý cầu khiến, hướng mệnh lệnh đến đất; cách dịch này giữ hình ảnh cây cối nảy mọc mà vẫn tự nhiên trong tiếng Việt.
- source_word: דֶּשֶׁא
  choice: thảm thực vật
  rationale: Danh từ tập hợp chỉ cây cối xanh tươi nói chung, rộng hơn nghĩa riêng của “cỏ”.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: cây cỏ sinh hạt giống
  rationale: עֵשֶׂב chỉ nhóm thực vật thân thảo; cụm phân từ nhấn mạnh đặc tính tạo ra hạt giống.
- source_word: עֵץ פְּרִי עֹשֶׂה פְּרִי
  choice: cây ăn quả sinh trái
  rationale: Giữ sự lặp ý có chủ đích của nguyên văn và diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: לְמִינוֹ
  choice: tùy theo loài
  rationale: Nguyên văn dùng số ít theo nghĩa phân phối; tiếng Việt không cần đánh dấu số và cụm này giữ được ý mỗi loại theo loài của mình.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: có hạt giống ở trong trái
  rationale: Đại từ số ít בוֹ có thể quy chiếu về “trái”; cách hiểu này phù hợp ngữ cảnh gần nhất nhưng sự mơ hồ được ghi nhận trong chú thích.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Cụm chỉ vị trí được dịch trực tiếp, đồng thời nối với “đất” là chủ thể ở đầu câu.
- source_word: וַיְהִי כֵן
  choice: Và điều đó xảy ra như vậy
  rationale: Giữ công thức xác nhận sự ứng nghiệm trong Sáng Thế Ký 1 với nhịp văn trang trọng, rõ nghĩa.
theological_decisions:
- issue: Phạm vi các nhóm thực vật được tạo dựng
  choice: Giữ các nhóm rộng là “thảm thực vật”, “cây cỏ” và “cây ăn quả”.
  alternative: Thu hẹp thành các thuật ngữ thực vật học hiện đại, hoặc gộp tất cả thành “mọi loài cây”.
  rationale: Nguyên văn mô tả thế giới theo các nhóm quan sát thông thường, không đưa ra hệ thống phân loại khoa học; bản dịch giữ các phân biệt của câu mà không áp đặt cách phân loại về sau.
- issue: Điểm quy chiếu của אֲשֶׁר זַרְעוֹ בוֹ
  choice: Trong câu chính, hiểu hạt giống ở trong trái.
  alternative: Hiểu rộng là mỗi cây có hạt giống ở trong nó.
  rationale: Cú pháp Hê-bơ-rơ cho phép độ mơ hồ nhất định; “trái” là tiền ngữ gần và phù hợp tự nhiên, nhưng không nên xóa cách hiểu khác nên đã ghi chú.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời” phù hợp lối gọi Elohim quen thuộc trong tiếng Việt; câu mệnh lệnh “Đất hãy mọc lên” giữ sắc thái thiêng liêng mà không cổ hóa quá mức.
