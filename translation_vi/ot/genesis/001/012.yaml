  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: vi
  text: 'Đất sinh ra cây cỏ: những cây kết hạt tùy theo từng loại[a], và những cây ra quả, có hạt ở trong quả, tùy theo từng loại[b]. Đức Chúa Trời thấy điều đó là tốt lành.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “theo loại của nó”. Từ Hê-bơ-rơ ở đây chỉ các loại hay phạm trù tạo vật, không nhất thiết tương ứng với thuật ngữ sinh học hiện đại “loài” (species).
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc dịch sát: “mà hạt của nó ở trong đó”.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: sinh ra
  rationale: Động từ Hiphil của יצא diễn tả đất làm cho cây cỏ nảy sinh; “sinh ra” tự nhiên, trang trọng và giữ được sắc thái phát sinh hơn “sản xuất”.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Trong ngữ cảnh sáng tạo, הָאָרֶץ chỉ đất/địa cầu đối lập với trời; ở đây “đất” tự nhiên vì chính mặt đất làm cây cỏ mọc lên.
- source_word: דֶּשֶׁא
  choice: cây cỏ
  rationale: Danh từ tập hợp này chỉ cây xanh mới mọc nói chung, không chỉ riêng cỏ; “cây cỏ” là cách nói phổ thông và đủ rộng trong tiếng Việt.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: những cây kết hạt
  rationale: עֵשֶׂב chỉ thảo mộc/cây xanh, còn cụm phân từ מַזְרִיעַ זֶרַע mô tả khả năng tạo hạt; “cây kết hạt” gọn và tự nhiên.
- source_word: לְמִינֵהוּ
  choice: tùy theo từng loại
  rationale: מין là loại hay hạng loại theo cách phân loại của bản văn cổ, không phải thuật ngữ sinh học hiện đại “loài” theo nghĩa species.
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: và những cây sinh quả
  rationale: עֵץ ở số ít nhưng mang nghĩa tập hợp; “những cây sinh quả” thể hiện rõ hành động liên tục của phân từ עֹשֶׂה.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: có hạt ở trong
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt, giữ ý hạt nằm bên trong mà không thêm một chủ thể không có trong nguyên văn.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Đức Chúa Trời thấy điều đó là tốt lành
  rationale: Giữ nguyên điệp khúc đánh giá của Sáng Thế Ký 1; “điều đó” quy chiếu tự nhiên đến công trình vừa được thuật lại.
theological_decisions:
- issue: Cách chuyển ngữ các phạm trù tạo vật mà không áp đặt hệ thống phân loại sinh học hiện đại
  choice: tùy theo từng loại
  alternative: tùy theo từng loài
  rationale: מין nói đến những loại hay phạm trù trong thế giới quan của bản văn, không xác định khái niệm kỹ thuật “species”; “từng loại” tránh đưa tranh luận khoa học hoặc giáo phái về sau vào câu.
- issue: Chủ thể được quy chiếu trong אֲשֶׁר זַרְעוֹ בוֹ
  choice: có hạt ở trong
  alternative: mà hạt của cây ở trong quả
  rationale: Các đại từ số ít giống đực trong tiếng Hê-bơ-rơ có thể liên hệ về mặt ngữ pháp với “cây” hoặc “quả”; bản dịch chính giữ cách nói gọn, còn chú thích nêu sát cấu trúc để không giải quyết quá mức điều bản văn để mở.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong Kinh Thánh tiếng Việt; dấu hai chấm làm rõ rằng hai nhóm cây tiếp theo triển khai ý nghĩa của danh từ tập hợp “cây cỏ”.
