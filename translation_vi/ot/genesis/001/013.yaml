base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: vi
  text: Rồi có buổi tối, rồi có buổi sáng—ngày thứ ba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: rồi có
  rationale: Trong điệp khúc kể chuyện này, וַיְהִי đánh dấu diễn tiến tiếp theo. “Rồi có” tự nhiên trong tiếng Việt, đồng thời giữ được sự lặp lại và nhịp điệu của nguyên văn.
- source_word: עֶרֶב
  choice: buổi tối
  rationale: עֶרֶב chỉ khoảng chiều tối hoặc buổi tối; “buổi tối” là cách dịch trực tiếp, quen thuộc và phù hợp với điệp khúc sáng tạo.
- source_word: בֹּקֶר
  choice: buổi sáng
  rationale: בֹּקֶר có nghĩa là buổi sáng; cách dịch này giữ sự song song rõ ràng với “buổi tối”.
- source_word: יוֹם
  choice: ngày
  rationale: Trong điệp khúc, יוֹם gọi tên ngày được đánh số trong trình tự sáng tạo; “ngày” là cách dịch trực tiếp và không tự quyết định những tranh luận về độ dài hay chức năng văn chương của ngày.
- source_word: שְׁלִישִׁי
  choice: thứ ba
  rationale: Tính từ thứ tự שְׁלִישִׁי có nghĩa là “thứ ba” và bổ nghĩa cho “ngày”.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Rồi có buổi tối, rồi có buổi sáng
  rationale: Lặp lại “rồi có” tương ứng với hai lần וַיְהִי, bảo toàn cấu trúc và nhịp điệu của điệp khúc Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Dịch điệp khúc về ngày sáng tạo mà không áp đặt một cách hiểu niên đại cụ thể
  choice: Rồi có buổi tối, rồi có buổi sáng—ngày thứ ba.
  alternative: Rồi có buổi tối và có buổi sáng, ngày thứ ba.
  rationale: Cách dịch trình bày thẳng trình tự của bản văn Hê-bơ-rơ, nhưng không xác định độ dài hoặc chức năng văn chương của các “ngày”, nhờ đó không giải quyết thay bản văn những tranh luận thần học về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giúp câu tự nhiên trong tiếng Việt, còn chú thích bảo lưu trật tự cú pháp sát nguyên văn.
