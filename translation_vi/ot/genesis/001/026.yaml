  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: vi
  text: 'Rồi Đức Chúa Trời phán: “Chúng ta hãy làm nên loài người[a] theo hình ảnh chúng ta, giống như chúng ta[b]; và họ hãy cai quản[c] cá biển, chim trời[d], gia súc, toàn cõi đất và mọi loài vật bò trên mặt đất.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “con người” hoặc “nhân loại”. Từ Hê-bơ-rơ אָדָם (adam) ở đây là danh từ số ít mang nghĩa tập thể, chỉ loài người như một toàn thể; vì vậy phần sau dùng số nhiều: “họ hãy cai quản”.'
    reason: lexical_alternative
  - marker: b
    text: 'Các cách nói số nhiều “Chúng ta hãy làm” và “chúng ta” được giữ nguyên như trong tiếng Hê-bơ-rơ. Có nhiều cách hiểu: Đức Chúa Trời tự nghị luận, ngỏ lời với thiên đình, hoặc—trong cách đọc toàn bộ Kinh Thánh của Cơ Đốc giáo—đây là một dấu chỉ phù hợp với mặc khải về Ba Ngôi về sau.'
    reason: alternative_reading
  - marker: c
    text: Cũng có thể dịch là “thống trị” hoặc “có quyền cai trị trên”.
    reason: lexical_alternative
  - marker: d
    text: 'Nguyên văn: “chim của trời/các tầng trời”; cũng có thể dịch là “chim trên trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... phán
  rationale: Dạng tự sự với waw nối tiếp đưa câu chuyện tiến sang hành động kế tiếp; “Bấy giờ” diễn đạt trình tự tự nhiên, còn “phán” phù hợp với lời nói của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít trong ngữ cảnh này cho thấy danh từ chỉ một Đức Chúa Trời; đây là cách gọi chuẩn, trang trọng và quen thuộc trong tiếng Việt.
- source_word: נַעֲשֶׂה
  choice: Chúng ta hãy làm nên
  rationale: Giữ nguyên ngôi thứ nhất số nhiều và sắc thái đề nghị/quyết định của dạng động từ, không giải quyết thay cho bản văn ý nghĩa thần học của số nhiều.
- source_word: אָדָם
  choice: loài người
  rationale: Ở đây אָדָם là danh từ số ít mang nghĩa tập thể, chỉ nhân loại như một loài; “loài người” tự nhiên trong tiếng Việt và giải thích được việc động từ tiếp theo ở số nhiều.
- source_word: בְּצַלְמֵנוּ
  choice: theo hình ảnh chúng ta
  rationale: Giữ danh từ “hình ảnh” và ý nghĩa tương ứng/khuôn mẫu của giới từ ב trong kết cấu này mà không diễn giải thêm bản chất của hình ảnh ấy.
- source_word: כִּדְמוּתֵנוּ
  choice: tương ứng với hình dạng chúng ta
  rationale: דמות diễn tả hình dạng hay sự tương đồng; cách dịch này phân biệt nó với צלם và giữ ý tương ứng do כ biểu thị, dù tiếng Việt phải diễn đạt dài hơn để rõ nghĩa.
- source_word: וְיִרְדּוּ
  choice: và họ hãy cai quản
  rationale: Giữ sắc thái mệnh lệnh/ước định ở ngôi thứ ba số nhiều của động từ, đồng thời dùng “cai quản” là cách nói hiện đại, dễ hiểu hơn “thống trị”.
- source_word: בִדְגַת הַיָּם
  choice: cá biển
  rationale: Cách diễn đạt gọn và tự nhiên trong tiếng Việt cho kết cấu “cá của biển”.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: chim trời
  rationale: Cụm từ tự nhiên và trang trọng, chỉ các loài chim bay trong bầu trời; “chim trên các tầng trời” sẽ quá sát chữ và kém tự nhiên.
- source_word: וּבַבְּהֵמָה
  choice: gia súc
  rationale: בהמה trong danh sách sáng tạo này chỉ lớp động vật lớn, đặc biệt là vật nuôi; “gia súc” chính xác và hiện đại hơn “súc vật”.
- source_word: וּבְכָל הָאָרֶץ
  choice: toàn cõi đất
  rationale: Trong Sáng Thế Ký 1, הָאָרֶץ có phạm vi toàn thế giới chứ không chỉ một vùng đất địa phương; “toàn cõi đất” giữ phạm vi rộng và văn phong trang trọng.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: mọi loài vật bò
  rationale: Giữ phép lặp từ nguyên của רמש ở mức tự nhiên trong tiếng Việt và không thu hẹp nghĩa vào riêng lớp bò sát theo phân loại hiện đại.
theological_decisions:
- issue: Lối nói số nhiều trong “Chúng ta hãy làm ... hình ảnh chúng ta ... hình dạng chúng ta”
  choice: Giữ nguyên tất cả các hình thức số nhiều, không xác định người được Đức Chúa Trời ngỏ lời trong chính văn.
  alternative: Hiểu là Đức Chúa Trời tự nghị luận, nói với thiên đình, hoặc—trong cách đọc toàn bộ Kinh Thánh của Cơ Đốc giáo—là dấu chỉ phù hợp với mặc khải về Ba Ngôi về sau.
  rationale: Nguyên văn Hê-bơ-rơ thật sự dùng ngôi thứ nhất số nhiều nhưng riêng câu này không giải thích đối tượng được nói đến; bản dịch cần bảo tồn sự căng thẳng và tính mở đó.
- issue: Nghĩa tập thể của אָדָם
  choice: Dùng “loài người” trong chính văn.
  alternative: “con người”, “nhân loại”, hoặc “người”.
  rationale: Danh từ số ít ở đây đại diện cho toàn thể nhân loại, điều được xác nhận bằng động từ số nhiều “họ hãy cai quản”. “Loài người” bảo tồn nét phân loại trong trình thuật sáng tạo và tránh khiến độc giả hiểu là chỉ một người nam.
- issue: Quan hệ giữa צלם và דמות
  choice: 'Dịch bằng hai cụm phân biệt: “hình ảnh” và “hình dạng”, không định nghĩa quan hệ thần học giữa chúng.'
  alternative: Xem hai từ là hoàn toàn đồng nghĩa và dịch gộp thành “giống hình ảnh chúng ta”.
  rationale: Bản văn đặt hai danh từ gần nhau nhưng không nói rõ chúng chỉ hai khía cạnh khác nhau hay là hai cách diễn đạt song song; giữ cả hai tránh áp đặt một hệ thống nhân học thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu giữ nhịp liệt kê của nguyên văn nhưng dùng các cụm danh từ tự nhiên trong tiếng Việt. Các đại từ số nhiều được bảo tồn để không làm mất tính mơ hồ thần học của bản Hê-bơ-rơ.
