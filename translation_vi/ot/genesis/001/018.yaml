  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: vi
  text: để cai quản ban ngày và ban đêm, và để phân cách ánh sáng với bóng tối.[a] Đức Chúa Trời thấy điều đó là tốt lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phân biệt ánh sáng với bóng tối.”'
    reason: Động từ הַבְדִּיל có thể nhấn mạnh sự phân cách hoặc sự phân biệt; chú thích bảo tồn sắc thái từ vựng này. Dấu chú thích được đặt ngay sau mệnh đề liên quan.
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: để cai quản
  rationale: Động từ nguyên mẫu với các tiền tố diễn tả mục đích hoặc chức năng tiếp nối câu trước. “Cai quản” truyền đạt vai trò chi phối của các nguồn sáng mà không hàm ý chúng là thần linh hay có quyền độc lập.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: ban ngày và ban đêm
  rationale: Cặp từ tiếng Việt tự nhiên này giữ sự đối xứng của nguyên văn; trong ngữ cảnh, giới từ tiếng Hê-bơ-rơ được bao hàm tự nhiên trong động từ “cai quản”.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: và để phân cách
  rationale: “Phân cách” giữ nét nghĩa thiết lập ranh giới hoặc sự tách biệt trong trình thuật sáng tạo, đồng thời vẫn cho phép nét nghĩa “phân biệt” được ghi ở chú thích.
- source_word: בֵּין הָ/אוֹר וּ/בֵין הַ/חֹשֶׁךְ
  choice: ánh sáng với bóng tối
  rationale: Cấu trúc “phân cách X với Y” là tiếng Việt tự nhiên và phản ánh thành ngữ Hê-bơ-rơ “giữa X và giữa Y” mà không cần lặp từ “giữa”.
- source_word: וַ/יַּרְא אֱלֹהִים
  choice: Đức Chúa Trời thấy
  rationale: Giữ nhịp kể chuyện lặp lại của Sáng Thế Ký 1. Danh xưng “Đức Chúa Trời” là cách gọi trang trọng, phổ thông trong tiếng Việt Kinh Thánh.
- source_word: כִּי טוֹב
  choice: điều đó là tốt đẹp
  rationale: “Tốt đẹp” diễn đạt sự tốt lành, thích hợp và đúng trật tự của công trình sáng tạo; “điều đó” bổ sung chủ thể cần thiết cho câu tiếng Việt mà không thu hẹp đối tượng đánh giá quá mức.
theological_decisions:
- issue: Chức năng của các nguồn sáng trong công trình sáng tạo
  choice: Câu này trình bày các nguồn sáng được giao chức năng cai quản ban ngày và ban đêm, đồng thời phân cách ánh sáng với bóng tối.
  alternative: Có thể nhân cách hóa mạnh hơn, khiến các nguồn sáng dường như tự mình thực thi quyền thống trị như các hữu thể thần linh.
  rationale: Nguyên văn dùng ngôn ngữ cai quản nhưng đặt các nguồn sáng trong trật tự do Đức Chúa Trời thiết lập và đánh giá. Bản dịch giữ sức nặng của động từ mà không thêm ý niệm thần hóa hoặc quyền năng độc lập.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu giữ sự song hành của nguyên văn nhưng dùng các kết hợp từ tự nhiên trong tiếng Việt. Dấu chú thích [a] xuất hiện trong chính văn ngay tại mệnh đề mà chú thích giải thích.
