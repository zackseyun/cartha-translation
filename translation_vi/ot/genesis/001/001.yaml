revisions:
- from: Ban đầu, khi Đức Chúa Trời tạo dựng các tầng trời và đất[a]—
  to: Ban đầu, khi Đức Chúa Trời tạo dựng trời và đất[a]—
  rationale: Thay “các tầng trời và đất” bằng “trời và đất” để tránh thêm ý “tầng” và dùng cặp từ Việt ngữ tự nhiên, tương ứng với phép bao nghĩa “the heavens and the earth”. Điều chỉnh chú thích để phản ánh rằng cách đọc phụ thuộc là một phân tích được hỗ trợ nhưng vẫn có tranh luận, trong khi vẫn giữ nguyên lựa chọn dịch của POB và dấu chú thích [a] sau toàn cụm liên quan.
  reviewer_model: gpt-5.6-terra
