  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: vi
  text: Ban đầu, khi Đức Chúa Trời tạo dựng trời và đất[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Theo truyền thống, câu này được dịch như một câu hoàn chỉnh: “Ban đầu, Đức Chúa Trời tạo dựng trời và đất.” Cấu trúc tiếng Hê-bơ-rơ (בְּרֵאשִׁית không có mạo từ, theo sau bởi động từ hữu hạn בָּרָא) cũng có thể được hiểu tự nhiên là một mệnh đề thời gian phụ thuộc, tương tự Sáng Thế 2:4b. Theo cách hiểu này, mệnh đề chính nằm ở câu 3: “Đức Chúa Trời phán: ‘Phải có ánh sáng.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Ban đầu, khi … tạo dựng
  rationale: Dạng không có mạo từ בְּרֵאשִׁית, theo sau bởi động từ hữu hạn בָּרָא, tự nhiên có thể được hiểu là một mệnh đề thời gian phụ thuộc. Cách dịch này vừa giữ ý nghĩa “ban đầu”, vừa cho thấy câu tiếp tục sang các câu sau.
- source_word: בָּרָא
  choice: tạo dựng
  rationale: Đây là động từ tiêu chuẩn nói về hành động sáng tạo của Đức Chúa Trời. “Tạo dựng” trang trọng, tự nhiên trong tiếng Việt và không diễn giải quá mức cách thức sáng tạo.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Tuy hình thức từ có dạng số nhiều, động từ đi kèm ở số ít, nên đối tượng được nói đến là Đức Chúa Trời duy nhất.
- source_word: אֵת
  choice: không dịch trực tiếp
  rationale: Đây là dấu hiệu chỉ tân ngữ xác định trong tiếng Hê-bơ-rơ; chức năng của nó được thể hiện bằng trật tự từ tiếng Việt.
- source_word: הַשָּׁמַיִם
  choice: các tầng trời
  rationale: Giữ dạng số nhiều của từ Hê-bơ-rơ và phù hợp với cặp diễn đạt bao quát “các tầng trời và đất”.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Trong cặp với “các tầng trời”, từ này chỉ phần đất của toàn thể trật tự thọ tạo. Không thêm “trái” để tránh thu hẹp thành hành tinh theo cách hiểu hiện đại.
theological_decisions:
- issue: Cú pháp của mệnh đề mở đầu
  choice: 'Mệnh đề thời gian phụ thuộc: “Ban đầu, khi Đức Chúa Trời tạo dựng các tầng trời và đất—”'
  alternative: 'Câu độc lập: “Ban đầu, Đức Chúa Trời tạo dựng các tầng trời và đất.”'
  rationale: Dạng không có mạo từ của בְּרֵאשִׁית và cấu trúc theo sau bằng động từ hữu hạn nghiêng về cách hiểu mệnh đề thời gian, tương tự Sáng Thế 2:4b và Ô-sê 1:2. Dấu gạch ngang cho thấy ý văn chưa kết thúc, trong khi chú thích bảo lưu cách đọc truyền thống vốn có lịch sử tiếp nhận lâu dài.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” cho אֱלֹהִים, “tạo dựng” cho בָּרָא, và giữ cấu trúc mở bằng dấu gạch ngang để phản ánh cách đọc mệnh đề phụ thuộc. Dấu chú thích [a] xuất hiện ngay sau cụm danh từ mà chú thích liên quan.
