  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: vi
  text: 'Vậy, Đức Chúa Trời sáng tạo con người[a] theo hình ảnh của Ngài;

    theo hình ảnh Đức Chúa Trời, Ngài sáng tạo người;

    Ngài sáng tạo họ, nam và nữ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “loài người”. Từ Hê-bơ-rơ ʼadam ở đây ở số ít và mang tính đại diện, chỉ toàn thể nhân loại.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: sáng tạo
  rationale: Giữ nguyên động từ qua cả ba lần lặp, phản ánh nhịp điệu và sự nhấn mạnh của nguyên văn; “sáng tạo” cũng diễn đạt tự nhiên hành động tạo dựng của Đức Chúa Trời.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thái số nhiều nhưng đi với động từ số ít và tại đây chỉ Đức Chúa Trời duy nhất; cách dịch này rõ ràng, trang trọng và quen thuộc trong tiếng Việt.
- source_word: הָאָדָם
  choice: con người
  rationale: Ở đây danh từ số ít mang tính đại diện cho toàn thể nhân loại, như việc câu chuyển từ đại từ số ít sang số nhiều và nói “nam và nữ” cho thấy. “Con người” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái số ít đại diện.
- source_word: בְּצַלְמוֹ
  choice: theo hình ảnh của Ngài
  rationale: “Theo hình ảnh” là cách diễn đạt tự nhiên trong tiếng Việt cho quan hệ được biểu thị bởi בְּ; “của Ngài” quy chiếu về Đức Chúa Trời.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: theo hình ảnh Đức Chúa Trời
  rationale: Lặp lại “hình ảnh” để bảo toàn cấu trúc song song và điểm nhấn thần học của tiếng Hê-bơ-rơ.
- source_word: אֹתוֹ
  choice: người
  rationale: Đại từ số ít giống đực quy chiếu về הָאָדָם đại diện. Tiếng Việt dùng “người” tự nhiên hơn “người ấy” và vẫn duy trì bước chuyển từ số ít sang “họ” ở vế sau.
- source_word: זָכָר וּנְקֵבָה
  choice: nam và nữ
  rationale: Hai từ Hê-bơ-rơ chỉ giới tính, không phải cặp từ mang tính quan hệ như “người chồng/người vợ”; “nam và nữ” là cách dịch chính xác và tự nhiên khi nói về con người.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ số nhiều đánh dấu sự chuyển từ nhân loại được trình bày bằng số ít đại diện sang con người trong tính đa thể; “họ” bảo toàn chuyển động này.
theological_decisions:
- issue: Cách dịch אָדָם trong ngữ cảnh chỉ nhân loại bằng một danh từ số ít đại diện
  choice: con người
  alternative: loài người; người nam
  rationale: Nguyên văn dùng הָאָדָם ở số ít và đại từ số ít, rồi chuyển sang “họ” cùng với “nam và nữ”. “Con người” giữ được hình thức đại diện ở số ít mà không thu hẹp đối tượng vào một cá nhân nam; chú thích bảo lưu cách hiểu “loài người”.
- issue: Quan hệ được diễn tả bởi בְּ trong cụm “hình ảnh”
  choice: theo hình ảnh
  alternative: trong hình ảnh; làm hình ảnh
  rationale: “Theo hình ảnh” là tiếng Việt tự nhiên và giữ cách hiểu truyền thống của בְּ mà không quyết định dứt khoát rằng con người là chính hình ảnh ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc ba vế cùng sự lặp lại “sáng tạo” và “hình ảnh” được giữ để tái hiện nhịp thơ, tính song song và điểm nhấn của nguyên văn.
