base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: vi
  text: 'Đức Chúa Trời phán: “Nước ở dưới bầu trời[a] hãy tụ về một chỗ, và đất khô hãy lộ ra.” Và đã xảy ra như vậy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שָׁמַיִם cũng có thể chỉ “các trời” hoặc “các tầng trời”, tùy văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ với waw liên tiếp đẩy câu chuyện tiến tới; trong văn cảnh lời truyền của Đức Chúa Trời, “phán” tự nhiên, trang trọng và phù hợp hơn “nói”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ đi với động từ số ít và chỉ về Đấng Tạo Hóa duy nhất; “Đức Chúa Trời” là cách gọi chuẩn, trang trọng trong tiếng Việt.
- source_word: יִקָּווּ
  choice: hãy tụ lại
  rationale: Thể mệnh lệnh gián tiếp diễn tả ý chỉ truyền khiến; “tụ lại” truyền đạt việc nước quy tụ vào một chỗ mà không cần dùng cấu trúc bị động gượng ép.
- source_word: הַמַּיִם
  choice: nước
  rationale: Dù tiếng Hê-bơ-rơ có hình thức số nhiều, tiếng Việt thông thường dùng danh từ khối “nước”; dịch “các nước” dễ bị hiểu là các quốc gia.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: ở dưới các tầng trời
  rationale: “Ở dưới” diễn đạt vị trí của nước một cách tự nhiên; “các tầng trời” giữ sắc thái số nhiều và văn phong vũ trụ luận của שָׁמַיִם, đồng thời chú thích nêu khả năng hiểu là “bầu trời”.
- source_word: אֶל מָקוֹם אֶחָד
  choice: lại một nơi
  rationale: Kết hợp với “tụ” thành “tụ lại một nơi”, diễn đạt rõ chuyển động quy tụ và giữ nguyên ý “một” của אֶחָד.
- source_word: וְתֵרָאֶה
  choice: và đất khô hãy lộ ra
  rationale: Thể Niphal mệnh lệnh gián tiếp tiếp tục lời truyền; “lộ ra” tự nhiên trong tiếng Việt và diễn tả phần đất trước đó bị nước che phủ nay trở nên thấy được.
- source_word: הַיַּבָּשָׁה
  choice: đất khô
  rationale: Chỉ phần đất khô đối lập với nước đã tụ lại; cách dịch này ngắn gọn và chuẩn bị cho việc gọi tên ở câu 10.
- source_word: וַיְהִי כֵן
  choice: Mọi việc liền diễn ra như vậy
  rationale: Giữ công thức xác nhận lời truyền của Đức Chúa Trời được thực hiện; “liền” thể hiện diễn tiến kể chuyện, còn “như vậy” bám sát כֵן.
theological_decisions:
- issue: Ý nghĩa của שָׁמַיִם trong trình thuật sáng tạo
  choice: các tầng trời
  alternative: bầu trời
  rationale: Từ Hê-bơ-rơ có thể chỉ bầu trời hữu hình hoặc các tầng trời. Bản chính giữ cách diễn đạt trang trọng, rộng nghĩa của trình thuật, còn chú thích bảo tồn cách hiểu theo cảnh tượng trực tiếp mà không áp đặt một mô hình vũ trụ học chi tiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ nhịp lời truyền trong trình thuật sáng tạo. Tránh dịch hình thức số nhiều của “nước” một cách máy móc vì tiếng Việt có thể hiểu sai, đồng thời bảo tồn sự mơ hồ thật sự của שָׁמַיִם bằng chú thích.
