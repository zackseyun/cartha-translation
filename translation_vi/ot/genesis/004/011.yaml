  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: vi
  text: Và giờ đây, ngươi bị nguyền rủa từ đất[a], đất đã há miệng nhận lấy máu[b] của người anh em ngươi từ tay ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị đất nguyền rủa” hoặc “bị nguyền rủa, phải lìa khỏi đất”; giới từ Hê-bơ-rơ có thể chỉ nguồn gốc hoặc sự phân cách.'
    reason: alternative_reading
  - marker: b
    text: Nguyên văn Hê-bơ-rơ dùng dạng số nhiều “các máu”, một cách nói chỉ máu đã đổ hoặc hành vi đổ máu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Và giờ đây
  rationale: Giữ cả liên từ và ý nghĩa thời gian, đồng thời dẫn vào hậu quả tức thời của hành động Ca-in.
- source_word: אָרוּר אָתָּה
  choice: ngươi bị nguyền rủa
  rationale: Diễn đạt tự nhiên trạng thái bị nguyền rủa mà cấu trúc vị ngữ tiếng Hê-bơ-rơ nêu bật.
- source_word: מִן הָאֲדָמָה
  choice: từ đất
  rationale: Giữ sát giới từ מִן và phần nào bảo lưu sự nhập nhằng giữa nguồn/phương tiện của lời nguyền và sự lìa khỏi đất; chú thích nêu rõ các khả năng.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: là đất đã há miệng
  rationale: Giữ phép nhân hóa rõ nét của nguyên văn; lặp lại “đất” giúp mệnh đề quan hệ tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: לָקַחַת
  choice: nhận lấy
  rationale: Phù hợp hình ảnh đất tiếp nhận máu đã đổ, tự nhiên hơn cách dịch máy móc là “lấy”.
- source_word: דְּמֵי אָחִיךָ
  choice: máu của người anh em ngươi
  rationale: Dùng “máu” số ít theo cách nói tự nhiên trong tiếng Việt; “người anh em” không tự ý xác định anh hay em trong khi אָח không mã hóa tuổi tác.
- source_word: מִיָּדֶךָ
  choice: từ tay ngươi
  rationale: Giữ nguyên hình ảnh cụ thể của tiếng Hê-bơ-rơ và nhấn mạnh trách nhiệm trực tiếp của Ca-in.
theological_decisions:
- issue: Mối quan hệ giữa lời nguyền và đất trong cụm מִן הָאֲדָמָה
  choice: Dịch “bị nguyền rủa từ đất”, không xác định dứt khoát đất là tác nhân hay Ca-in bị tách lìa khỏi đất.
  alternative: “bị đất nguyền rủa” hoặc “bị nguyền rủa, phải lìa khỏi đất”
  rationale: Giới từ מִן có thể gợi nguồn gốc hoặc sự phân cách. Bản dịch chính giữ cách diễn đạt gần nguyên văn, còn chú thích bảo tồn cả hai hướng hiểu thay vì giải quyết căng thẳng thần học thay cho văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ngươi” trong lời Đức Chúa Trời phán trực tiếp để giữ sắc thái nghiêm nghị; tránh gọi A-bên là “em trai” vì danh từ Hê-bơ-rơ ở đây chỉ nói “anh em”, không tự thân xác định tuổi tác.
