  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với ông: “Vì thế, bất cứ ai giết Ca-in sẽ bị báo thù gấp bảy lần.” Rồi Đức Giê-hô-va đặt một dấu cho Ca-in[a], để không ai gặp ông mà đánh ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một dấu hiệu.” Nguyên văn không cho biết dấu ấy có hình thức như thế nào hoặc được đặt ở đâu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi riêng quen thuộc trong tiếng Việt cho danh YHWH, thay vì thay thế bằng tước hiệu chung “CHÚA”.
- source_word: לָכֵן
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ suy luận trong lời đáp của Đức Chúa Trời.
- source_word: כָּל הֹרֵג קַיִן
  choice: bất cứ ai giết Ca-in
  rationale: Giữ phạm vi khái quát, bất định của cấu trúc Hê-bơ-rơ.
- source_word: שִׁבְעָתַיִם יֻקָּם
  choice: sẽ bị báo thù gấp bảy lần
  rationale: Giữ thể bị động cô đọng và mức độ “gấp bảy lần”; theo ngữ cảnh, chủ thể bị báo thù là kẻ giết Ca-in.
- source_word: אוֹת
  choice: một dấu
  rationale: Từ này có thể chỉ dấu hiệu hoặc dấu phân biệt; “một dấu” tự nhiên trong ngữ cảnh mà không xác định hình thức của nó.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ כָּל מֹצְאוֹ
  choice: để không một ai gặp ông lại đánh ông
  rationale: Diễn đạt mệnh đề mục đích ngăn ngừa một cách tự nhiên, đồng thời giữ nghĩa trực tiếp của נכה là “đánh” thay vì thu hẹp thành “giết”.
theological_decisions:
- issue: Bản chất của dấu đặt trên Ca-in
  choice: Dịch là “một dấu” và không xác định hình thức hay nội dung của dấu ấy.
  alternative: “một dấu hiệu” hoặc diễn giải thành một dấu thể chất cụ thể
  rationale: Nguyên văn không mô tả dấu ấy; bản dịch tránh đưa suy đoán hậu kỳ vào câu.
- issue: Người chịu sự báo thù gấp bảy lần
  choice: Diễn đạt kẻ giết Ca-in là người “sẽ bị báo thù gấp bảy lần”.
  alternative: “Ca-in sẽ được báo thù gấp bảy lần”
  rationale: Thể bị động Hê-bơ-rơ rất cô đọng, nhưng ngữ cảnh cho thấy đây là lời cảnh cáo dành cho người giết Ca-in; cách dịch tiếng Việt làm rõ quy chiếu mà không nêu tác nhân báo thù vốn vẫn hàm ẩn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” để chỉ Ca-in; tránh lối diễn đạt cổ như “e rằng”. Giữ cấu trúc bị động ở lời cảnh cáo để phản ánh tính cô đọng của nguyên văn.
