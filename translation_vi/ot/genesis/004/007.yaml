  naturalness: Lối xưng hô “con” phù hợp ngữ cảnh Đức Chúa Trời nói với Ca-in. “Nằm phục ở cửa” là cách nói hiện đại, rõ nét và tự nhiên hơn “rình rập nơi cửa”. Các chú thích được chỉnh nhẹ để dùng thuật ngữ tiếng Việt tự nhiên và nhất quán.
  terminology: “Tội lỗi”, “lễ vật chuộc tội”, và “chế ngự” đều phù hợp. Giữ “khao khát con” để phản ánh cách nói cô đọng và cố ý chưa xác định đầy đủ của תְּשׁוּקָתוֹ; chú thích nêu các khả năng gần nghĩa và liên hệ Sáng Thế Ký 3:16.
