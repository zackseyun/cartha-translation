source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: vi
  text: Nếu con làm điều tốt, chẳng phải con sẽ được chấp nhận sao?[a] Nhưng nếu con không làm điều tốt, tội lỗi đang nằm phục ở cửa[b]; nó khao khát con[c], nhưng con phải chế ngự nó.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “nâng lên”; có thể hiểu rằng nét mặt của Ca-in sẽ được ngẩng lên hoặc ông sẽ được chấp nhận.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một lễ vật chuộc tội đang nằm phục ở cửa”; tuy nhiên, hình ảnh trực tiếp trong câu tự nhiên hơn khi tội lỗi được nhân cách hóa như một con thú đang nằm phục.'
    reason: alternative_reading
  - marker: c
    text: Cũng có thể dịch là “nó mong mỏi con” hoặc “nó thôi thúc hướng về con.” So sánh cách diễn đạt tương tự trong Sáng Thế Ký 3:16.
    reason: cross_reference
  - marker: d
    text: 'Cũng có thể dịch: “con sẽ chế ngự nó” hoặc “con có thể chế ngự nó.” Câu Hê-bơ-rơ có thể được hiểu là lời khuyên răn, lời dự báo hoặc lời nói về khả năng.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: làm điều tốt
  rationale: Dạng Hiphil của יטב ở đây nói đến việc hành động đúng hoặc tốt, không chỉ cảm thấy dễ chịu. Cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái đạo đức của điều kiện.
- source_word: שְׂאֵת
  choice: được chấp nhận
  rationale: Từ này theo nghĩa đen liên quan đến việc “nâng lên,” có thể chỉ nét mặt của Ca-in được ngẩng lên hoặc việc ông được Đức Chúa Trời chấp nhận. Bản chính dùng cách diễn đạt rõ nghĩa, còn nghĩa đen và sự mơ hồ được giữ trong chú thích.
- source_word: לַפֶּתַח
  choice: nơi cửa
  rationale: Cụm từ chỉ vị trí ngay tại cửa hoặc ngưỡng cửa; “nơi cửa” ngắn gọn và phù hợp với hình ảnh một mối đe dọa đang chực sẵn.
- source_word: חַטָּאת
  choice: tội lỗi
  rationale: חַטָּאת có thể mang nghĩa “tội lỗi” hoặc “lễ vật chuộc tội,” nhưng động từ “rình rập/nằm phục” trong ngữ cảnh này tự nhiên hơn khi tội lỗi được nhân cách hóa như thú săn mồi. Cách hiểu kia được ghi ở chú thích.
- source_word: רֹבֵץ
  choice: đang rình rập
  rationale: Phân từ này mô tả việc nằm phục hoặc thu mình chực vồ. “Đang rình rập” truyền đạt rõ hình ảnh thú săn mồi và mối nguy cận kề trong tiếng Việt hiện đại.
- source_word: תְּשׁוּקָתוֹ
  choice: nó khao khát con
  rationale: Danh từ chỉ sự ham muốn, khao khát hoặc thôi thúc. “Khao khát” giữ được sức mạnh của từ và mối liên hệ ngôn từ với Sáng Thế Ký 3:16 mà không xác định quá mức bản chất của ham muốn ấy.
- source_word: תִּמְשָׁל בּוֹ
  choice: con phải chế ngự nó
  rationale: Dạng vị hoàn có thể được hiểu là lời khuyên truyền, lời dự báo hoặc khả năng. Trong lời cảnh báo dành cho Ca-in, “phải chế ngự” giữ sức nặng khuyên răn; các khả năng khác được nêu trong chú thích.
theological_decisions:
- issue: Mệnh đề cuối là mệnh lệnh Ca-in phải làm chủ tội lỗi, lời dự báo rằng ông sẽ làm chủ nó, hay lời khẳng định ông có thể làm chủ nó
  choice: 'Dịch như lời khuyên truyền: “con phải chế ngự nó.”'
  alternative: “con sẽ chế ngự nó” hoặc “con có thể chế ngự nó.”
  rationale: Dạng vị hoàn Hê-bơ-rơ cho phép nhiều sắc thái. Ngữ cảnh là lời Đức Chúa Trời cảnh báo và khuyên bảo Ca-in, nên cách dịch khuyên truyền phù hợp nhất mà không biến câu này thành lời hứa tất định hay một khẳng định giáo lý về năng lực con người. Chú thích bảo tồn các cách hiểu khác.
- issue: חַטָּאת chỉ “tội lỗi” được nhân cách hóa hay “lễ vật chuộc tội”
  choice: Hiểu là “tội lỗi” được nhân cách hóa như một con thú rình mồi.
  alternative: “một lễ vật chuộc tội đang nằm nơi cửa.”
  rationale: Sự kết hợp với רֹבֵץ và các đại từ tiếp theo tạo nên hình ảnh nhất quán về tội lỗi như một thế lực muốn khống chế Ca-in. Tuy vậy, nghĩa “lễ vật chuộc tội” có căn cứ từ vựng nên được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp, dùng lối xưng hô “con” phù hợp với lời Đức Chúa Trời nói cùng Ca-in. “Rình rập” và “chế ngự” duy trì hình ảnh tội lỗi như thú săn mồi mà vẫn dễ hiểu với độc giả phổ thông. Các điểm mơ hồ thật sự của nguyên văn được giữ trong chú thích.
