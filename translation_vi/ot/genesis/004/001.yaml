    issue: Cách dịch “nhờ Đức Giê-hô-va” cho אֶת יְהוָה
    rationale: Cách này thêm sắc thái “với sự giúp đỡ của”, còn bản chính đã chọn “từ Yahweh” để diễn đạt nguồn gốc của việc sinh con. Tính mơ hồ của cấu trúc cần được giữ trong chú thích, không chuyển thành ý trợ giúp ở bản chính.
