  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: And Adam knew Eve his wife[a]; and she conceived and bore Cain, and said[b], “I have acquired a man from Yahweh.”
translation:
  language: vi
  text: 'A-đam ăn ở với Ê-va, vợ mình. Ê-va thụ thai, sinh Ca-in[b] và nói: “Tôi đã có được một người từ Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dịch sát là: “Tôi đã có được một người với Yahweh.” Cụm này cũng có thể được hiểu là “từ Yahweh”; ít có khả năng hơn là: “Tôi đã có được một người—Yahweh.” Bản chính hiểu lời Ê-va là sự nhìn nhận Yahweh là nguồn của việc bà có được đứa con.'
    reason: alternative_reading
  - marker: b
    text: Tên Ca-in (Qayin) gần âm với động từ Hê-bơ-rơ mang nghĩa “có được” (qaniti).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  choice: A-đam
  rationale: Trong mạch truyện này, הָאָדָם chỉ người nam cụ thể là A-đam; liên từ וְ được thể hiện qua sự tiếp nối tự nhiên của câu tiếng Việt.
- source_word: יָדַע
  choice: ăn ở với
  rationale: Động từ nghĩa đen là “biết” nhưng tại đây là uyển ngữ chỉ quan hệ vợ chồng. “Ăn ở với” là cách nói trang trọng, dễ hiểu trong văn phong Kinh Thánh tiếng Việt, tránh lối dịch sát chữ gây khó hiểu.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: Ê-va, vợ mình
  rationale: Giữ tên riêng rồi nêu quan hệ theo trật tự Hê-bơ-rơ; “mình” quy chiếu tự nhiên về A-đam.
- source_word: וַתַּהַר
  choice: bà thụ thai
  rationale: “Thụ thai” là cách diễn đạt ngắn gọn, trang trọng và chính xác trong trình thuật sinh nở.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: sinh Ca-in
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ tính cô đọng của nguyên văn.
- source_word: קַיִן
  choice: Ca-in
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong tiếng Việt; lối chơi chữ với קָנִיתִי được giải thích trong chú thích.
- source_word: קָנִיתִי
  choice: tôi đã có được
  rationale: קנה tại đây mang nghĩa “có được/đạt được”. “Có được” tự nhiên hơn “mua được” hoặc “thu được” khi nói về một đứa trẻ, nhưng vẫn bảo toàn ý nghĩa căn bản.
- source_word: אִישׁ
  choice: một người
  rationale: Giữ nghĩa thông thường của אִישׁ thay vì diễn giải thành “con trai” hay “bé trai”, qua đó không làm phẳng cách nói đáng chú ý của nguyên văn.
- source_word: אֶת יְהוָה
  choice: nhờ Đức Giê-hô-va
  rationale: Cụm này rất khó và có thể hiểu theo nhiều cách. “Nhờ Đức Giê-hô-va” diễn đạt tự nhiên ý Ê-va nhìn nhận sự can dự của Đức Chúa Trời, còn nghĩa sát chữ và các cách hiểu khác được bảo lưu trong chú thích.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng hình thức danh riêng quen thuộc, trang trọng trong tiếng Việt để biểu thị Danh YHWH, không thay bằng một tước hiệu chung.
theological_decisions:
- issue: Cách hiểu אֶת יְהוָה trong lời Ê-va
  choice: nhờ Đức Giê-hô-va
  alternative: với Đức Giê-hô-va; từ Đức Giê-hô-va; tôi đã có được một người—Đức Giê-hô-va
  rationale: Cấu trúc Hê-bơ-rơ thực sự mơ hồ. Bản chính chọn cách hiểu tự nhiên rằng Ê-va nhìn nhận Đức Giê-hô-va là Đấng khiến bà có được đứa con, nhưng chú thích vẫn nêu nghĩa sát chữ và những cách phân tích đáng kể khác, không xác quyết một cách giải nghĩa mang tính hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ăn ở với” như một uyển ngữ tự nhiên cho quan hệ vợ chồng; giữ “một người” để phản ánh אִישׁ; đưa cả hai dấu chú thích vào sau lời nói vì cả sự mơ hồ của אֶת יְהוָה lẫn lối chơi chữ đều thuộc câu nói của Ê-va.
