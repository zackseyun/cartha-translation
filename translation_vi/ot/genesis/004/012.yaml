source:
  edition: WLC
  text: כִּ֤י תַֽעֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה לֹֽא תֹסֵ֥ף תֵּת כֹּחָ֖/הּ לָ֑/ךְ נָ֥ע וָ/נָ֖ד תִּֽהְיֶ֥ה בָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: vi
  text: Khi con canh tác đất,[a] đất sẽ không còn ban sức lực cho con nữa.[b] Con sẽ phải phiêu bạt, lưu lạc trên đất.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì khi con canh tác đất” hoặc “Nếu con canh tác đất.” Liên từ Hê-bơ-rơ có thể được hiểu theo nghĩa nguyên nhân, thời gian hoặc điều kiện.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “đất sẽ không tiếp tục ban sức lực của nó cho con.” “Sức lực” ở đây chỉ khả năng sinh sản, đem lại hoa lợi của đất.'
    reason: lexical_alternative
  - marker: c
    text: “Trên đất” cũng có thể dịch là “trong xứ.” Hai từ được dịch là “phiêu bạt, lưu lạc” gần nghĩa với nhau và cùng nhấn mạnh tình trạng không ổn định của Ca-in.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Liên từ có thể mang sắc thái thời gian, điều kiện hoặc nguyên nhân. “Khi” diễn đạt tự nhiên hoàn cảnh mà lời phán xét xảy ra, đồng thời không biến câu này thành một lời giải thích thuần túy về nguyên nhân.
- source_word: תַעֲבֹד אֶת־הָאֲדָמָה
  choice: con canh tác đất đai
  rationale: Động từ עבד ở đây chỉ việc lao động, trồng trọt trên אֲדָמָה. “Canh tác đất đai” rõ nghĩa trong ngữ cảnh Ca-in làm nông và vẫn giữ được sự phân biệt với אֶרֶץ ở cuối câu.
- source_word: לֹא־תֹסֵף תֵּת
  choice: sẽ không còn ban ... nữa
  rationale: Cấu trúc יסף với động từ nguyên mẫu diễn tả việc không tiếp tục làm điều gì. Cách dịch này vừa tự nhiên trong tiếng Việt vừa khá sát hình ảnh đất chủ động trao sức lực.
- source_word: כֹּחָהּ
  choice: sức lực của nó
  rationale: Giữ nghĩa đen “sức lực/sức mạnh”, hàm ý khả năng sinh sản của đất, thay vì diễn giải trực tiếp thành “hoa lợi”.
- source_word: נָע וָנָד
  choice: phiêu bạt, lưu lạc
  rationale: Hai từ gần nghĩa cùng nhấn mạnh tình trạng không nơi ổn định. Cặp từ tiếng Việt giữ được phép tăng cường ý nghĩa mà không áp đặt sắc thái pháp lý của “kẻ chạy trốn”.
- source_word: בָאָרֶץ
  choice: trên đất
  rationale: אֶרֶץ có thể là “đất” theo nghĩa rộng hoặc “xứ”. Trong bối cảnh nguyên thủy của Sáng Thế Ký, “trên đất” phù hợp hơn, nhưng tính đa nghĩa được ghi chú.
theological_decisions:
- issue: Phạm vi lời phán xét dành cho Ca-in
  choice: Giữ cả sự thất bại trong canh tác lẫn đời sống bất định, không nơi ổn định
  alternative: Chỉ hiểu là trạng thái bất an tâm lý, hoặc chỉ là sự lưu đày khỏi một vùng địa lý
  rationale: Câu Hê-bơ-rơ nêu rõ cả việc đất không tiếp tục trao sức lực và tình trạng נָע וָנָד. Bản dịch không thu hẹp lời phán xét vào riêng khía cạnh tâm lý hay địa lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “con” phù hợp lời Đức Chúa Trời trực tiếp phán với Ca-in. Giữ hình ảnh đất “ban sức lực” để bảo tồn tính cụ thể và chất thơ của nguyên văn.
