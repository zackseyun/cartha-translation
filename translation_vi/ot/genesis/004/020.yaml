  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תֵּ֥לֶד עָדָ֖ה אֶת יָבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י יֹשֵׁ֥ב אֹ֖הֶל וּ/מִקְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: vi
  text: A-đa sinh Gia-banh[a]. Ông là cha của những người sống trong lều và chăn nuôi gia súc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông tổ của những người ở lều và chăn nuôi gia súc.” Trong tiếng Hê-bơ-rơ, “cha của” có thể chỉ tổ tiên, người khai sáng hoặc người tiêu biểu khởi đầu một lối sống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Động từ ילד ở thể Qal trong văn mạch gia phả có nghĩa là sinh con; “sinh” ngắn gọn, tự nhiên và phù hợp với công thức kể chuyện.
- source_word: עָדָה
  choice: A-đa
  rationale: Phiên âm tên riêng עָדָה theo cách đọc quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: אֶת
  choice: '[dấu chỉ định tân ngữ, không dịch]'
  rationale: Từ này đánh dấu יָבָל là tân ngữ trực tiếp và không có từ tương ứng độc lập trong tiếng Việt.
- source_word: יָבָל
  choice: Gia-banh
  rationale: Phiên âm tên riêng יָבָל theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: הוּא הָיָה
  choice: Ông là
  rationale: Cụm đại từ cùng động từ היה xác định vai trò của Gia-banh; “là” diễn đạt trực tiếp hơn “trở thành” trong câu ghi chép gia phả này.
- source_word: אֲבִי
  choice: cha của
  rationale: Giữ hình ảnh “cha” của nguyên văn, đồng thời chú thích rằng từ này ở đây có thể chỉ tổ tiên, người khai sáng hoặc người tiêu biểu khởi đầu một lối sống.
- source_word: יֹשֵׁב אֹהֶל
  choice: những người sống trong lều
  rationale: Phân từ số ít mang nghĩa tập thể, chỉ một lớp người có đặc trưng là sống trong lều; chuyển sang số nhiều trong tiếng Việt để ý tập thể được rõ ràng.
- source_word: וּמִקְנֶה
  choice: và chăn nuôi gia súc
  rationale: מִקְנֶה chỉ đàn vật nuôi hoặc gia súc. Cách diễn đạt này làm rõ lối sống gắn với việc sở hữu và chăm nuôi đàn vật, phù hợp tự nhiên trong tiếng Việt; nguyên văn có cấu trúc danh từ cô đọng hơn.
theological_decisions:
- issue: Ý nghĩa của “cha” trong lời mô tả Gia-banh
  choice: Giữ “cha của” trong chính văn và giải thích độ rộng nghĩa trong chú thích
  alternative: Dịch thẳng là “tổ phụ của” hoặc “người khai sáng”
  rationale: Nguyên văn có thể chỉ tổ tiên, người khai sáng hoặc hình mẫu khởi nguyên của một lối sống, chứ không nhất thiết chỉ quan hệ cha con trực tiếp. Giữ ẩn dụ gốc tránh quyết định thay cho độc giả một nghĩa duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng câu ngắn theo nhịp kể gia phả; giữ ẩn dụ “cha của” của tiếng Hê-bơ-rơ và đặt dấu chú thích ngay sau tên Gia-banh theo lớp tham khảo đã cung cấp.
