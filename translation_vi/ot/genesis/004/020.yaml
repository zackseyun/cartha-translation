  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của tiếng Hê-bơ-rơ: A-đa sinh Gia-banh; ông được gọi là “cha” theo nghĩa người khởi nguyên/tổ phụ của nhóm sống trong lều gắn với gia súc. “Chăn nuôi gia súc” diễn đạt hợp lý hàm ý lối sống mục súc của cụm danh từ cô đọng וּמִקְנֶה, không làm thay đổi nghĩa.'
