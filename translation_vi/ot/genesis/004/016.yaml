base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: vi
  text: Rồi Ca-in rời khỏi trước mặt Đức Giê-hô-va và định cư trong xứ Nốt[a], ở phía đông Ê-đen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Nốt gợi đến từ Hê-bơ-rơ nghĩa là “lang thang,” tạo lối chơi chữ nhắc lại lời phán xét dành cho Ca-in ở phần trước của chương này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: đi khỏi
  rationale: Diễn đạt trực tiếp hành động đi ra và kết hợp tự nhiên với cụm מִלִּפְנֵי, không thêm ý về cách thức rời đi.
- source_word: מִלִּפְנֵי
  choice: khỏi trước mặt
  rationale: Giữ hình ảnh không gian–quan hệ của thành ngữ Hê-bơ-rơ “từ trước mặt,” thay vì giải thích rộng thành “khỏi sự hiện diện của.”
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
- source_word: וַיֵּשֶׁב
  choice: định cư
  rationale: Trong ngữ cảnh địa lý này, động từ chỉ việc đến cư ngụ tại một nơi; “định cư” tự nhiên và rõ hơn nghĩa đen “ngồi.”
- source_word: בְּאֶרֶץ נוֹד
  choice: tại xứ Nốt
  rationale: נוֹד là địa danh nên được phiên âm; lối chơi chữ liên hệ với sự lang thang được bảo lưu trong chú thích.
- source_word: קִדְמַת עֵדֶן
  choice: về phía đông Ê-đen
  rationale: Truyền đạt tự nhiên hướng/vị trí ở phía đông so với Ê-đen mà không mở rộng quá mức.
- source_word: עֵדֶן
  choice: Ê-đen
  rationale: Phiên âm địa danh theo cách quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt việc Ca-in rời khỏi vị trí tương quan với Đức Giê-hô-va
  choice: Ca-in đi khỏi trước mặt Đức Giê-hô-va
  alternative: Ca-in rời khỏi sự hiện diện của Đức Giê-hô-va
  rationale: “Khỏi trước mặt” bám sát thành ngữ Hê-bơ-rơ và giữ nguyên sức căng thần học về sự xa cách, không giải thích rằng Ca-in có thể hoàn toàn ra ngoài sự hiện diện của Đức Chúa Trời.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc nguồn ở mức tự nhiên trong tiếng Việt; dùng các dạng tên riêng quen thuộc Ca-in, Nốt và Ê-đen.
