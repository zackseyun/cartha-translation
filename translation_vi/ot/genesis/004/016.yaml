  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu Hê-bơ-rơ: Ca-in rời khỏi trước mặt YHWH, cư ngụ trong xứ Nốt, và vị trí của xứ ấy ở phía đông Ê-đen. Tuy nhiên, “đi khỏi trước mặt” kém tự nhiên trong tiếng Việt hiện đại và có thể được làm rõ hơn mà vẫn giữ thành ngữ nguồn.'
  naturalness: 'Cần chỉnh nhẹ để câu kể tự nhiên hơn: “rời khỏi trước mặt” diễn đạt rõ quan hệ của cụm מִלִּפְנֵי; “ở phía đông Ê-đen” rõ là vị trí của xứ Nốt.'
