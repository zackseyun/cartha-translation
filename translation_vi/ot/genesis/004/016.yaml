    rationale: Cụm này có thể gây cảm giác thiếu thành phần hoặc mơ hồ trong tiếng Việt. “Rời khỏi trước mặt Đức Giê-hô-va” vẫn bảo lưu sát nghĩa không gian–quan hệ của מִלִּפְנֵי mà trôi chảy hơn.
  - severity: low
    issue: Chú thích “có âm gần với” làm yếu liên hệ từ vựng của Nốt.
    rationale: Chú thích tiếng Anh nêu lối chơi chữ với từ Hê-bơ-rơ chỉ sự lang thang. Nên diễn đạt đây là sự gợi liên hệ/lối chơi chữ, không chỉ là sự giống âm tình cờ.
  revised_text: Rồi Ca-in rời khỏi trước mặt Đức Giê-hô-va và định cư trong xứ Nốt[a], ở phía đông Ê-đen.
