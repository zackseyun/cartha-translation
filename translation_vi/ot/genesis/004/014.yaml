  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của nguyên văn: sự bị đuổi khỏi mặt đất, sự xa cách khỏi “mặt” Đức Chúa Trời, tình trạng bất định trên đất, và nỗi sợ bị giết. Tuy nhiên, “sẽ phải lang thang” thêm sắc thái bắt buộc không được biểu thị trực tiếp bởi dạng động từ hoàn cảnh/tương lai trong tiếng Hê-bơ-rơ; chỉ cần “sẽ lang thang, phiêu bạt” là sát hơn. Cụm “bị khuất khỏi mặt Ngài” có thể hiểu được nhưng hơi gượng trong tiếng Việt hiện đại; “khuất khỏi mặt Ngài” tự nhiên hơn và vẫn không buộc phải chọn giữa sắc thái phản thân và bị động của Niphal.'
  naturalness: Cách xưng hô “Ngài–con” phù hợp với lời Ca-in thưa cùng Đức Chúa Trời. “Này,”, “mặt đất,” và “bất cứ ai gặp con cũng sẽ giết con” đều tự nhiên. Điều chỉnh hai điểm nêu trên làm câu văn trôi chảy hơn mà vẫn giữ nhịp đôi của נָע וָנָד.
