  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: vi
  text: Này, hôm nay Ngài đã đuổi con khỏi mặt đất, và con sẽ khuất khỏi mặt Ngài.[a] Con sẽ lang thang, phiêu bạt trên đất[b], và bất cứ ai gặp con cũng sẽ giết con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con sẽ ẩn mình khỏi sự hiện diện của Ngài” hoặc “con sẽ bị khuất khỏi sự hiện diện của Ngài.” Tiếng Hê-bơ-rơ viết sát nghĩa là “khỏi mặt Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong xứ.” Từ אֶרֶץ trong tiếng Hê-bơ-rơ có thể có nghĩa là “đất” theo nghĩa rộng hoặc “xứ, vùng đất,” tùy văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Này
  rationale: Tiểu từ dùng để nhấn mạnh và thu hút sự chú ý; “Này” ngắn gọn, trang trọng vừa phải và tự nhiên trong lời nói trực tiếp.
- source_word: גֵּרַשְׁתָּ
  choice: Ngài đã đuổi con
  rationale: Giữ rõ sức mạnh của hành động trục xuất trong גרשׁ, đồng thời dùng cách diễn đạt phổ thông, tự nhiên.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: khỏi mặt đất
  rationale: Giữ hình ảnh nguyên văn “khỏi mặt của đất” và mối liên hệ với אֲדָמָה, tức đất mà Ca-in từng canh tác và đã bị rủa trong văn cảnh.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: con sẽ bị khuất khỏi mặt Ngài
  rationale: Dạng Niphal cho phép nghĩa bị động hoặc phản thân. Bản dịch giữ cách nói cụ thể “mặt Ngài” và không quyết đoán quá mức giữa việc Ca-in tự ẩn mình với việc bị che khuất khỏi sự hiện diện của Đức Chúa Trời.
- source_word: נָע וָנָד
  choice: phải lang thang, phiêu bạt
  rationale: Hai động từ tiếng Việt giữ được hai yếu tố song đôi, diễn tả đời sống bất định, không chốn ổn định; “phải” thể hiện đây là tình trạng hệ quả đã được tuyên bố.
- source_word: בָּאָרֶץ
  choice: trên đất
  rationale: אֶרֶץ có thể chỉ toàn thể đất hoặc một vùng đất. “Trên đất” phù hợp với phạm vi rộng của trình thuật nguyên thủy, còn cách hiểu địa phương hơn được ghi ở chú thích.
- source_word: כָל מֹצְאִי
  choice: bất cứ ai gặp con
  rationale: Diễn đạt tự nhiên cấu trúc phổ quát bất định כָל cộng phân từ; trong ngữ cảnh, “gặp” tự nhiên hơn “tìm thấy” mà vẫn giữ ý người nào bắt gặp Ca-in.
- source_word: יַהַרְגֵנִי
  choice: sẽ giết con
  rationale: “Giết” là từ tương đương trực tiếp, rõ ràng và hiện đại của הרג.
theological_decisions:
- issue: Cách dịch thành ngữ về sự hiện diện của Đức Chúa Trời trong וּמִפָּנֶיךָ אֶסָּתֵר
  choice: con sẽ bị khuất khỏi mặt Ngài
  alternative: con sẽ ẩn mình khỏi sự hiện diện của Ngài / con sẽ bị khuất khỏi sự hiện diện của Ngài
  rationale: Giữ hình ảnh “mặt Ngài” bảo tồn sức nặng quan hệ của việc xa cách Đức Chúa Trời. Cách dịch bị động phản ánh tự nhiên dạng Niphal, nhưng chú thích vẫn bảo lưu khả năng phản thân và nghĩa thành ngữ “sự hiện diện”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài–con” phù hợp với lời Ca-in thưa trực tiếp với Đức Chúa Trời. Bản dịch giữ các hình ảnh “mặt đất” và “mặt Ngài,” đồng thời dùng cặp “lang thang, phiêu bạt” để tái hiện nhịp song đôi của nguyên văn.
