  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: vi
  text: Lê-méc lấy cho mình hai người vợ[a]. Một người tên là A-đa, còn người kia[b] tên là Xi-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch tự nhiên hơn: “Lê-méc cưới hai người phụ nữ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “người thứ hai”.'
    reason: source_form
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Động từ לקח có nghĩa cơ bản là “lấy”; khi đi với “vợ” trong ngữ cảnh này, từ ấy diễn tả việc lấy làm vợ mà không cần thêm lời giải thích.
- source_word: לוֹ
  choice: cho mình
  rationale: Cụm này diễn đạt sắc thái vì lợi ích hoặc cho chính chủ thể, tương ứng tự nhiên với “cho mình” trong tiếng Việt.
- source_word: שְׁתֵּי נָשִׁים
  choice: hai người vợ
  rationale: Danh từ có thể chỉ “phụ nữ” hoặc “vợ”, nhưng kết hợp với לקח ở đây xác định rõ quan hệ hôn nhân.
- source_word: שֵׁם הָאַחַת
  choice: Một người tên là
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sự đối ứng giữa hai người được nêu tên.
- source_word: עָדָה
  choice: A-đa
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo âm tiết, phù hợp với cách đọc tiếng Việt.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: còn người kia
  rationale: Nguyên văn là “người thứ hai”; vì câu chỉ nói đến hai người, “người kia” tự nhiên hơn trong tiếng Việt mà vẫn giữ nguyên ý.
- source_word: צִלָּה
  choice: Xi-la
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Có nên nói rõ đây là một cuộc hôn nhân đa thê và kèm theo nhận định đạo đức hay không
  choice: Dịch rõ là “hai người vợ” nhưng không thêm lời đánh giá
  alternative: hai người phụ nữ; cưới hai người phụ nữ
  rationale: Câu này thuật lại việc Lê-méc lấy hai vợ nhưng không trực tiếp đưa ra phán xét đạo đức; bản dịch không nên thêm một kết luận thần học mà câu không nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ động từ “lấy” gần với nguyên văn, còn cấu trúc gọi tên được diễn đạt tự nhiên trong tiếng Việt; không thêm lời bình về chế độ đa thê.
