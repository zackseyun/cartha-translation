  source_fidelity: Câu Hê-bơ-rơ גָּדוֹל עֲוֺנִי מִנְּשֹׂא có nghĩa đen gần là “tội/tội trạng/hình phạt của tôi quá lớn để mang chịu.” Danh từ עָוֹן có thể chỉ tội lỗi, tội trạng, hoặc hậu quả/hình phạt của tội. Trong mạch văn trực tiếp sau khi Yahweh tuyên án, “hình phạt ... không thể chịu nổi” là cách hiểu phù hợp nhất cho bản chính, trong khi các nghĩa khác cần được duy trì ở chú thích.
