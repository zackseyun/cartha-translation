  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: vi
  text: 'Ca-in thưa với Yahweh[a]: “Hình phạt của con quá nặng, con không thể chịu nổi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tội lỗi của con quá lớn, con không thể gánh nổi”; hoặc: “Tội trạng của con quá lớn, con không thể gánh nổi.” Một cách hiểu khác là: “Tội lỗi của con quá lớn, không thể được tha thứ.” Các từ Hê-bơ-rơ ở đây có thể chỉ tội lỗi, tội trạng hoặc hình phạt, và động từ có thể mang nghĩa “gánh chịu” hoặc, trong một số ngữ cảnh, “tha thứ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: thưa
  rationale: Động từ אָמַר mở lời nói trong mạch kể; khi Ca-in nói với Đức Chúa Trời, “thưa” là cách diễn đạt tự nhiên và đúng sắc thái kính trọng trong tiếng Việt.
- source_word: קַיִן
  choice: Ca-in
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: אֶל
  choice: với
  rationale: Giới từ chỉ đối tượng được nói với; kết cấu “thưa với” tự nhiên trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: גָּדוֹל
  choice: quá lớn
  rationale: Trong cấu trúc גָּדוֹל ... מִן, tính từ diễn tả mức độ vượt quá khả năng chịu đựng; “quá lớn” truyền đạt tự nhiên ý này.
- source_word: עֲוֺנִי
  choice: tội lỗi của con
  rationale: עָוֹן có thể chỉ tội lỗi, tội trạng hoặc hình phạt do tội. Bản chính giữ nghĩa trực tiếp “tội lỗi”, còn sự đa nghĩa được nêu trong chú thích.
- source_word: מִנְּשֹׂא
  choice: con không thể gánh nổi
  rationale: נָשָׂא có nghĩa cơ bản là mang, gánh, chịu; giới từ מִן tạo ý so sánh vượt quá khả năng. Cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh “gánh”.
theological_decisions:
- issue: Sự đa nghĩa của עֲוֺנִי מִנְּשֹׂא
  choice: “Tội lỗi của con quá lớn, con không thể gánh nổi.”
  alternative: “Hình phạt của con quá nặng, con không thể chịu nổi”; hoặc “Tội lỗi của con quá lớn, không thể được tha.”
  rationale: עָוֹן có thể là tội lỗi, tội trạng hoặc hình phạt, còn נָשָׂא có thể là gánh chịu và trong một số ngữ cảnh là tha thứ. Bản chính phản ánh nghĩa từ vựng trực tiếp, còn chú thích bảo tồn khả năng Ca-in than về hình phạt hoặc nói đến sự tha thứ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp với lời Ca-in thưa cùng Đức Chúa Trời; không thêm đại từ xưng hô cho Yahweh vì nguyên văn không có lời đáp trực tiếp trong câu này.
