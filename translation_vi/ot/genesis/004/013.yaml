  terminology: Giữ “Ca-in” và “Yahweh” nhất quán với bản thảo. “Hình phạt” phản ánh nghĩa theo ngữ cảnh của עָוֹן mà không loại trừ các nghĩa “tội lỗi/tội trạng” và cách hiểu “tha thứ” trong chú thích.
