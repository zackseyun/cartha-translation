- from: 'Rồi Yahweh phán với Ca-in: “A-bên, em trai con, ở đâu?” Ca-in thưa: “Con không biết.[a] Con là người canh giữ em con sao?”'
  to: 'Rồi Yahweh phán với Ca-in: “A-bên, em trai con, ở đâu?” Ca-in thưa: “Con không biết.[a] Con là người trông nom em con sao?”'
  rationale: Chỉ điều chỉnh những chỗ có thể cải thiện an toàn về cách dùng tiếng Việt và độ bao quát ngữ nghĩa. Bản sửa vẫn giữ tên riêng, quan hệ anh em, câu hỏi địa điểm, lời phủ nhận hiện tại, và câu hỏi tu từ của nguyên văn; không giải thích thêm trách nhiệm đạo đức của Ca-in.
