source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑י/ךָ וַ/יֹּ֨אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Ca-in: “A-bên, em trai con, ở đâu?” Ca-in thưa: “Con không biết.[a] Con là người trông nom em con sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con đã không hề biết.” Dạng hoàn thành trong tiếng Hê-bơ-rơ có thể diễn tả một lời phủ nhận ở quá khứ, dù trong văn cảnh này, lời khẳng định rằng hiện tại mình không biết là cách hiểu tự nhiên hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu; cách này giữ sự phân biệt có trong nguyên văn.
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán / Ca-in thưa
  rationale: Liên từ với động từ kể chuyện đưa trình thuật tiến tới. “Phán” phù hợp khi Yahweh nói, còn “thưa” tự nhiên trong tiếng Việt khi Ca-in đáp lời Đức Chúa Trời.
- source_word: אֵי
  choice: ở đâu?
  rationale: Từ nghi vấn chỉ địa điểm; cấu trúc đặt tên và quan hệ thân thuộc trước “ở đâu” là tự nhiên trong tiếng Việt.
- source_word: הֶבֶל
  choice: A-bên
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: אָחִיךָ / אָחִי
  choice: em trai con / em con
  rationale: Danh từ Hê-bơ-rơ chỉ anh hoặc em trai; trong mạch truyện A-bên là người em. Tiếng Việt cần biểu thị quan hệ tuổi tác để lời văn tự nhiên, và “em trai” cũng giữ rõ giới tính nam của từ nguồn.
- source_word: לֹא יָדַעְתִּי
  choice: Con không biết
  rationale: Dù hình thái hoàn thành có thể được hiểu theo quá khứ, trong đối thoại đây tự nhiên là lời Ca-in khẳng định hiện tại rằng mình không biết. Đại từ “con” phù hợp với lời người phàm đáp Đức Chúa Trời.
- source_word: הֲשֹׁמֵר
  choice: người canh giữ
  rationale: Phân từ của שמר mang nghĩa canh, giữ, trông nom. “Người canh giữ” bảo toàn hình ảnh và câu hỏi về trách nhiệm mà không diễn giải thêm.
- source_word: אָנֹכִי
  choice: Con
  rationale: Đại từ độc lập có sắc thái nhấn mạnh; trong tiếng Việt, câu hỏi tu từ “Con là ... sao?” truyền đạt tự nhiên sức nhấn ấy.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo tồn đây là danh riêng thay vì âm thầm thay bằng tước hiệu.
- issue: Sắc thái câu hỏi “Con là người canh giữ em con sao?”
  choice: Giữ nguyên câu hỏi tu từ, không thêm lời giải thích về trách nhiệm
  alternative: Diễn giải thành “Chẳng lẽ con phải chịu trách nhiệm trông nom em con sao?”
  rationale: Nguyên văn để sức căng đạo đức nằm trong lời đáp của Ca-in; bản dịch không nên giải quyết hoặc chú giải sức căng ấy ngay trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Yahweh và “thưa/con” cho lời Ca-in để hội thoại tự nhiên trong tiếng Việt. Câu hỏi cuối giữ cấu trúc ngắn, trực diện của nguyên văn.
