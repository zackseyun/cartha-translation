reference: Genesis 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: vi
  text: A-bên cũng dâng một số con đầu lòng trong bầy chiên dê của mình, cùng những phần mỡ của chúng.[a] Yahweh đoái đến A-bên và lễ vật của ông,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “những phần mỡ của chúng”; có lẽ chỉ những phần mỡ quý nhất của các con vật được dâng.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Yahweh nhìn đến A-bên và lễ vật của ông với lòng ưu ái.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶבֶל
  choice: A-bên
  rationale: Liên từ וְ tiếp nối mạch kể; trong tiếng Việt không nhất thiết phải dịch thành “và” ở đầu câu. Tên הֶבֶל được phiên âm theo cách dùng quen thuộc là “A-bên”.
- source_word: הֵבִיא גַם הוּא
  choice: cũng dâng
  rationale: גַם הוּא nhấn mạnh rằng A-bên cũng làm như Ca-in; “cũng” diễn đạt tự nhiên. Trong ngữ cảnh lễ vật, “dâng” phù hợp hơn “mang đến” nhưng không thêm ý vượt quá hành động đem lễ vật đến.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: một số con đầu lòng trong bầy chiên dê của mình
  rationale: מִן có sắc thái phân chia, nên “một số” tránh hàm ý A-bên dâng tất cả con đầu lòng. צֹאן chỉ chung đàn gia súc nhỏ, gồm chiên và dê, vì vậy “bầy chiên dê” chính xác hơn chỉ nói “bầy chiên”.
- source_word: וּמֵחֶלְבֵהֶן
  choice: cùng những phần mỡ của chúng
  rationale: חֵלֶב ở đây có thể chỉ phần mỡ theo nghĩa cụ thể, đặc biệt là những phần mỡ quý trong lễ dâng. Bản dịch giữ hình ảnh “mỡ” thay vì diễn giải thành “phần tốt nhất”.
- source_word: וַיִּשַׁע
  choice: đoái đến
  rationale: Động từ diễn tả việc hướng sự chú ý đến, trong văn cảnh hàm ý thiện ý. “Đoái đến” giữ sắc thái trang trọng và tích cực nhưng không khẳng định phương thức Yahweh bày tỏ sự chấp nhận.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự יהוה, không thay bằng một tước hiệu.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: đến A-bên và lễ vật của ông
  rationale: Giới từ אֶל được diễn đạt tự nhiên cùng động từ “đoái đến”; cả A-bên lẫn lễ vật đều là đối tượng của sự đoái đến.
- source_word: מִנְחָתוֹ
  choice: lễ vật của ông
  rationale: מִנְחָה là quà biếu hoặc vật dâng; “lễ vật” phù hợp với ngữ cảnh thờ phượng mà không quy định một loại sinh tế chuyên biệt.
theological_decisions:
- issue: Tính chất phản ứng của Yahweh trong וַיִּשַׁע
  choice: “Yahweh đoái đến A-bên và lễ vật của ông” — hàm ý thái độ thuận nhận nhưng không nói cách thái độ ấy được biểu lộ.
  alternative: “Yahweh nhìn đến A-bên và lễ vật của ông với lòng ưu ái” hoặc “Yahweh chấp nhận A-bên và lễ vật của ông.”
  rationale: Nguyên ngữ cho thấy sự lưu tâm mang ý tích cực, nhưng không mô tả dấu hiệu hay cơ chế của sự chấp nhận. “Đoái đến” bảo toàn hàm ý ấy mà không đưa thêm chi tiết thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bầy chiên dê” để phản ánh phạm vi của צֹאן; dùng “đoái đến” nhằm giữ sắc thái tích cực nhưng không giải thích quá mức. Dấu phẩy cuối câu được giữ vì câu Hê-bơ-rơ tiếp tục trực tiếp sang câu 5.
