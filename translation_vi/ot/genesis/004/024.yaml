  source_fidelity: Bản dịch giữ đúng liên từ nguyên nhân כִּי (“Vì”), thể bị động của יֻקַּם (“được báo thù”), và thế song song tăng cấp giữa Ca-in với La-méc. “Gấp bảy lần” và “gấp bảy mươi bảy lần” truyền đạt thích đáng sắc thái bảy lần/bảy mươi bảy lần của câu thơ. Cách hiểu bảy mươi bảy, thay vì bảy mươi lần bảy, phù hợp trực tiếp với cấu trúc Hê-bơ-rơ שִׁבְעִים וְשִׁבְעָה.
