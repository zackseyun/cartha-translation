  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֥י שִׁבְעָתַ֖יִם יֻקַּם קָ֑יִן וְ/לֶ֖מֶךְ שִׁבְעִ֥ים וְ/שִׁבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: vi
  text: Vì Ca-in được báo thù gấp bảy lần[a], còn La-méc thì gấp bảy mươi bảy lần[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ được báo thù”; động từ Hê-bơ-rơ có thể diễn tả sự báo thù chắc chắn sẽ xảy ra.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ viết theo nghĩa đen là “bảy mươi và bảy,” tức bảy mươi bảy. Cũng có thể diễn đạt: “bảy mươi bảy lần.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Liên từ nêu cơ sở cho lời khoe khoang của La-méc ở câu trước; “Vì” giữ rõ quan hệ lý do và tự nhiên trong tiếng Việt.
- source_word: שִׁבְעָתַיִם
  choice: gấp bảy lần
  rationale: Dạng này diễn tả mức độ báo thù tăng lên bảy lần; cách nói này rõ nghĩa và tự nhiên hơn một lối dịch quá sát hình thức.
- source_word: יֻקַּם
  choice: được báo thù
  rationale: Dạng Hophal của נקם mang nghĩa bị động, tức là được báo thù hoặc được trả thù cho. Thể chưa hoàn thành trong lời thơ có thể diễn tả một điều chắc chắn hoặc mang sắc thái tương lai.
- source_word: קָיִן
  choice: Ca-in
  rationale: Phiên âm tên riêng theo cách quen thuộc và dễ đọc trong tiếng Việt.
- source_word: וְלֶמֶךְ
  choice: còn La-méc thì
  rationale: Liên từ nối hai vế so sánh; “còn… thì” làm nổi bật thế đối chiếu song song trong câu thơ mà không thêm ý nghĩa mới.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: gấp bảy mươi bảy lần
  rationale: Cụm từ theo nghĩa đen là “bảy mươi và bảy,” tự nhiên nhất là số bảy mươi bảy; thêm cấu trúc “gấp… lần” để giữ phép song song với “gấp bảy lần.”
theological_decisions:
- issue: Giá trị số trong công thức báo thù của La-méc
  choice: gấp bảy mươi bảy lần
  alternative: bảy mươi lần bảy; bảy mươi bảy lần
  rationale: Cấu trúc Hê-bơ-rơ שִׁבְעִים וְשִׁבְעָה tự nhiên nhất có nghĩa là “bảy mươi bảy,” không phải “bảy mươi lần bảy.” Cách dịch này giữ phép song song thi ca với mức “gấp bảy lần” dành cho Ca-in và không đưa cách diễn đạt về sau trong Ma-thi-ơ 18:22 vào Sáng Thế Ký.
- issue: Thời và sắc thái của יֻקַּם
  choice: được báo thù
  alternative: sẽ được báo thù
  rationale: Nguyên văn có thể được hiểu như lời khẳng định mang tính cách ngôn hoặc như tương lai chắc chắn. Bản văn chính giữ cách nói cô đọng, còn chú thích bảo tồn sắc thái tương lai có thật trong tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “còn… thì” tái hiện phép đối chiếu thi ca; “báo thù” giữ đúng trường nghĩa của נקם. Các dấu chú thích [a], [b] đều xuất hiện ngay sau cụm từ liên quan trong chính văn.
