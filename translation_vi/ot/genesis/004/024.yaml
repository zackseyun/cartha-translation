  terminology: “Báo thù” phản ánh đúng trường nghĩa נקם trong ngữ cảnh này mà không diễn giải thêm. Các dạng tên “Ca-in” và “La-méc” phù hợp lối phiên âm Kinh Thánh Việt ngữ quen dùng. Chú thích a bảo tồn cách hiểu sắc thái tương lai chắc chắn của thể chưa hoàn thành; chú thích b làm rõ cách đọc số đếm và không nhập cách đọc “bảy mươi lần bảy”.
