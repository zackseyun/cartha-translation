base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: vi
  text: Kha-nốc có một con trai là Y-rát. Y-rát sinh Mê-hu-gia-ên[a]; Mê-hu-gia-ên sinh Mê-tu-sa-ên; và Mê-tu-sa-ên sinh La-méc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong câu này, bản Hê-bơ-rơ viết cùng tên này theo hai dạng chính tả: Mê-hu-gia-ên và Mê-hi-gia-ên.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד לַחֲנוֹךְ
  choice: Kha-nốc có một con trai là
  rationale: Động từ Nifal của ילד diễn tả việc một người con được sinh ra cho Kha-nốc. Cách nói này tự nhiên trong tiếng Việt, giữ Kha-nốc là người cha trong gia phả và tránh lối dịch bị động gượng gạo.
- source_word: עִירָד
  choice: Y-rát
  rationale: Phiên âm tên riêng trực tiếp từ dạng Hê-bơ-rơ, theo cách viết dễ đọc trong tiếng Việt.
- source_word: יָלַד
  choice: sinh
  rationale: Trong các mệnh đề gia phả chủ động, ילד chỉ việc người nam sinh ra hoặc làm cha của người được nêu. “Sinh” là cách diễn đạt ngắn gọn, quen thuộc trong gia phả tiếng Việt; ngữ cảnh cho thấy quan hệ cha-con.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: Mê-hu-gia-ên
  rationale: Hai dạng chính tả trong câu được quy về một dạng tên nhất quán trong chính văn để dễ đọc; khác biệt của bản Hê-bơ-rơ được giữ trong chú thích.
- source_word: מְתוּשָׁאֵל
  choice: Mê-tu-sa-ên
  rationale: Phiên âm tên riêng từ tiếng Hê-bơ-rơ, với dấu gạch nối giúp người đọc tiếng Việt nhận biết các âm tiết.
- source_word: לָמֶךְ
  choice: La-méc
  rationale: Phiên âm trực tiếp tên riêng Hê-bơ-rơ theo chính tả tiếng Việt dễ đọc.
- source_word: חֲנוֹךְ
  choice: Kha-nốc
  rationale: Phiên âm tên riêng từ tiếng Hê-bơ-rơ thay vì dùng dạng Anh hóa; âm đầu được thể hiện gần với phụ âm ח.
