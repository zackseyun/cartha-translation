  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: vi
  text: Tên người anh em của ông là Giu-banh; người ấy là tổ phụ của mọi người chơi đàn lia và ống sáo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ được dịch là “chơi” có nghĩa đen là “nắm” hoặc “cầm”; trong ngữ cảnh này, từ ấy nói đến việc sử dụng nhạc cụ.
    reason: lexical_alternative
  - marker: b
    text: “Ống sáo” cũng có thể dịch là “sáo” hoặc “ống tiêu”; không rõ chính xác từ Hê-bơ-rơ עוּגָב chỉ loại nhạc cụ cổ nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: Em trai ông tên là
  rationale: Cụm từ chỉ người anh em của Gia-banh ở câu trước; tiếng Hê-bơ-rơ không tự nó xác định anh hay em, nhưng theo trình tự kể về các con, “em trai” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: יוּבָל
  choice: Giu-banh
  rationale: Phiên âm tên riêng Jubal theo lối Việt hóa dễ đọc và phân biệt với Gia-banh ở câu trước.
- source_word: הוּא הָיָה אֲבִי
  choice: ông là tổ phụ
  rationale: Ở ngữ cảnh nói về nguồn gốc văn hóa, אֲבִי chỉ người khởi đầu hay thủy tổ của một nhóm, không nhất thiết là cha ruột trực tiếp của từng người; “tổ phụ” giữ được hình ảnh thân tộc của nguyên văn.
- source_word: כָּל תֹּפֵשׂ
  choice: mọi người chơi
  rationale: תֹּפֵשׂ có nghĩa đen là “nắm, cầm”; khi đi với nhạc cụ, ý trong ngữ cảnh là sử dụng hoặc chơi nhạc cụ.
- source_word: כִּנּוֹר
  choice: đàn lia
  rationale: כִּנּוֹר là một nhạc cụ dây cổ, gần với đàn lia hơn đàn hạc theo cách phân loại hiện đại.
- source_word: עוּגָב
  choice: ống sáo
  rationale: Danh tính chính xác của nhạc cụ cổ này chưa chắc chắn; “ống sáo” diễn đạt một nhạc cụ hơi mà không xác định quá mức.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để quy chiếu nhân vật nam trong lời kể. “Tổ phụ” truyền đạt thành ngữ nguồn gốc văn hóa; không thêm chú thích riêng vì lựa chọn này đã làm rõ nghĩa ngay trong chính văn. Mọi dấu chú thích đều xuất hiện trong chính văn.
