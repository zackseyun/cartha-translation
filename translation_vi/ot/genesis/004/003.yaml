  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: vi
  text: Sau một thời gian[a], Ca-in đem hoa lợi từ đất[b] làm lễ vật dâng lên Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ sát nghĩa là “từ cuối các ngày,” tức là sau khi một khoảng thời gian đã trôi qua.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sản vật của đất.”'
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” là cách phiên âm danh riêng của Đức Chúa Trời, được viết bằng bốn phụ âm Hê-bơ-rơ YHWH; một số bản dịch dùng “CHÚA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Sau một thời gian
  rationale: Trong mạch kể chuyện, וַיְהִי nối sang sự việc tiếp theo; tiếng Việt tự nhiên không cần dịch máy móc là “và đã xảy ra.” Ý nối tiếp được thể hiện cùng cụm thời gian.
- source_word: מִקֵּץ יָמִים
  choice: sau một thời gian
  rationale: Đây là thành ngữ chỉ một khoảng thời gian đã trôi qua. Cách dịch này truyền đạt nghĩa kể chuyện thông thường, không gán cho câu sắc thái cánh chung.
- source_word: וַיָּבֵא
  choice: đem ... dâng lên
  rationale: Dạng Hiphil của בוא có nghĩa là đem hoặc mang đến. Kết cấu “đem ... dâng lên” tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh lễ vật.
- source_word: קַיִן
  choice: Ca-in
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: hoa lợi từ đất
  rationale: פְּרִי có thể chỉ trái hoặc sản vật, còn אֲדָמָה là đất. “Hoa lợi từ đất” diễn đạt tự nhiên sản vật nông nghiệp mà không thu hẹp thành trái cây.
- source_word: מִנְחָה
  choice: lễ vật
  rationale: מִנְחָה là quà biếu, cống vật hoặc vật dâng. Trong ngữ cảnh thờ phượng, “lễ vật” rõ nghĩa nhưng không quy định quá mức loại lễ.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giới từ לְ chỉ hướng hoặc người nhận lễ vật; danh YHWH được phiên âm là “Yahweh” để giữ danh riêng trong nguyên văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của מִקֵּץ יָמִים
  choice: 'thành ngữ thời gian không mang nghĩa cánh chung: “sau một thời gian”'
  alternative: “vào cuối các ngày”
  rationale: Ngữ cảnh chỉ một khoảng thời gian trôi qua trước khi Ca-in dâng lễ; cách dịch sát chữ có thể gây ra một sắc thái cánh chung không được ngữ cảnh hỗ trợ.
- issue: Bản chất lễ vật của Ca-in
  choice: không thêm đánh giá về phẩm chất hoặc động cơ
  alternative: hàm ý lễ vật kém hơn hoặc được dâng cách miễn cưỡng
  rationale: Câu này chỉ thuật lại rằng Ca-in đem hoa lợi từ đất làm lễ vật; nguyên văn chưa nêu phán xét về chất lượng hay động cơ của ông.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Hoa lợi” giữ sắc thái nông nghiệp, còn “lễ vật” tránh xác định đây là một loại tế lễ cụ thể. Các dấu chú thích đều được đặt ngay sau cụm từ liên quan.
