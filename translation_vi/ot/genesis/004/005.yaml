base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: vi
  text: Nhưng Ngài không đoái đến Ca-in và lễ vật của ông.[a] Vì thế, Ca-in vô cùng tức giận, và nét mặt ông buồn rầu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài không nhìn đến Ca-in và lễ vật của ông với thiện ý.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “mặt ông sa xuống”, một thành ngữ chỉ vẻ buồn bực hoặc ủ ê hiện rõ trên gương mặt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל ... וְאֶל
  choice: đến ... và ...
  rationale: Đi với שָׁעָה, giới từ lặp lại đánh dấu cả Ca-in lẫn lễ vật là đối tượng của sự đoái đến; cách diễn đạt này giữ được cấu trúc song song của tiếng Hê-bơ-rơ.
- source_word: מִנְחָתוֹ
  choice: lễ vật của ông
  rationale: Trong bối cảnh dâng lên Đức Chúa Trời, “lễ vật” là cách dịch tự nhiên và có sắc thái thờ phượng, nhưng không quy định cụ thể loại tế lễ.
- source_word: לֹא שָׁעָה
  choice: không đoái đến
  rationale: שָׁעָה diễn tả việc nhìn đến hoặc lưu tâm với thiện ý. “Không đoái đến” vừa trang trọng, dễ hiểu, vừa tránh giải thích quá mức thành một lý do thần học cụ thể.
- source_word: וַיִּחַר ... מְאֹד
  choice: vô cùng tức giận
  rationale: Thành ngữ Hê-bơ-rơ gợi ý cơn giận bùng cháy; tiếng Việt tự nhiên diễn đạt trạng thái và mức độ bằng “vô cùng tức giận”.
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: mặt ông sa sầm
  rationale: Cách nói này giữ hình ảnh nét mặt hạ xuống và diễn tả tự nhiên vẻ buồn bực, ủ ê hoặc bất mãn hiện ra trên gương mặt.
theological_decisions:
- issue: Bản chất phản ứng của Đức Chúa Trời đối với Ca-in và lễ vật
  choice: Dịch là “không đoái đến”, không nêu nguyên nhân hay cơ chế của sự không chấp nhận.
  alternative: “không chấp nhận” hoặc “không nhìn đến với thiện ý”
  rationale: Câu Hê-bơ-rơ chỉ nói Đức Chúa Trời không đoái đến Ca-in và lễ vật của ông, nhưng không giải thích lý do; bản dịch cần giữ sự tiết chế và căng thẳng thần học đó.
- issue: Chủ ngữ hàm ẩn của לֹא שָׁעָה
  choice: Dùng đại từ “Ngài”, quy chiếu về Đức Giê-hô-va ở câu trước.
  alternative: Lặp lại “Đức Giê-hô-va”
  rationale: Động từ Hê-bơ-rơ không nêu danh xưng trong câu này; “Ngài” giữ liên kết tự nhiên với chủ ngữ của câu 4 mà không thêm sự lặp lại không có trong nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đoái đến” giữ sắc thái kính văn vừa phải; “mặt ông sa sầm” chuyển tải hình ảnh thành ngữ tự nhiên hơn lối dịch sát chữ “mặt ông sa xuống”. Mọi dấu chú thích đều có mặt trong chính văn.
