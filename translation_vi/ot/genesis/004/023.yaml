  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: vi
  text: 'Lê-méc nói với các vợ mình:


    “A-đa và Xi-la, hãy nghe tiếng ta;

    hỡi các vợ Lê-méc, hãy lắng nghe lời ta!

    Vì ta đã giết[a] một người vì hắn làm ta bị thương,

    giết một thanh niên vì hắn đánh ta.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số người hiểu lời Lê-méc là lời đe dọa hoặc khoe khoang tổng quát: “Ta sẽ giết một người…” chứ không phải lời thuật lại một vụ giết người đã xảy ra.'
    reason: alternative_reading
  - marker: b
    text: 'Dịch sát hơn: “Ta đã giết một người vì vết thương của ta, một thanh niên vì vết bầm của ta.” Tiếng Hê-bơ-rơ dùng các danh từ “vết thương” và “vết bầm”, nên quan hệ chính xác giữa những thương tích ấy với hành động giết người vẫn có phần hàm súc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: với các vợ mình
  rationale: Danh từ אִשָּׁה ở số nhiều kèm hậu tố ngôi ba số ít giống đực chỉ các bà vợ của Lê-méc trong ngữ cảnh này; “các vợ mình” tự nhiên và chính xác.
- source_word: שְׁמַעַן קוֹלִי
  choice: hãy nghe tiếng ta
  rationale: Giữ hình ảnh cụ thể “tiếng ta” và sắc thái trực tiếp của mệnh lệnh số nhiều, đồng thời duy trì phép song hành thi ca.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: hãy lắng nghe lời ta
  rationale: “Lắng nghe” thể hiện sự chú tâm của dạng Hiphil הַאְזֵנָּה; “lời ta” giữ danh từ số ít אִמְרָה và phù hợp văn phong thi ca.
- source_word: כִּי
  choice: vì
  rationale: Từ này dẫn vào nội dung hoặc căn cứ cho lời khoe khoang của Lê-méc mà không giải thích quá mức.
- source_word: אִישׁ
  choice: một người
  rationale: Trong tiếng Việt, “một người” là cách diễn đạt tự nhiên cho אִישׁ ở đây; sự đối ứng với יֶלֶד vẫn được thể hiện qua “một thanh niên” ở vế sau.
- source_word: הָרַגְתִּי
  choice: ta đã giết
  rationale: Dạng qatal được hiểu theo nghĩa thông thường là thuật lại một hành động đã xảy ra; “đã giết” rõ ràng, mạnh và không thêm ý tự vệ.
- source_word: לְפִצְעִי
  choice: vì hắn làm ta bị thương
  rationale: Cụm giới từ לְ với danh từ “vết thương” và hậu tố ngôi một có thể chỉ nguyên cớ hoặc sự trả đũa. Cách dịch bằng mệnh đề động từ dễ hiểu trong tiếng Việt nhưng cách đọc sát danh từ được ghi ở chú thích.
- source_word: יֶלֶד
  choice: một thanh niên
  rationale: יֶלֶד có thể chỉ đứa trẻ, thiếu niên hoặc người trẻ. “Thanh niên” phù hợp với phép song hành cùng אִישׁ mà không buộc người đọc hình dung một trẻ nhỏ.
- source_word: לְחַבֻּרָתִי
  choice: vì hắn đánh ta
  rationale: חַבּוּרָה chỉ vết bầm, lằn roi hoặc thương tích. Cách diễn đạt này truyền đạt tự nhiên nguyên cớ của hành động trả đũa và phân biệt nhẹ với “làm ta bị thương” ở vế trước.
theological_decisions:
- issue: Lời Lê-méc là lời thuật lại một vụ giết người hay một lời đe dọa/khoe khoang tổng quát
  choice: “ta đã giết” được dùng như lời thuật lại một hành động đã xảy ra
  alternative: “ta sẽ giết” hoặc “ta có thể giết”, hiểu dạng hoàn thành theo nghĩa tình thái hay khái quát
  rationale: Dạng qatal trước hết phù hợp với việc thuật lại hành động đã xảy ra. Tuy nhiên, khả năng đây là lời đe dọa hoặc khoe khoang tổng quát là có thật nên được bảo lưu trong chú thích.
- issue: Hành động của Lê-méc là trả đũa hay tự vệ
  choice: Dịch các cụm לְ theo nguyên cớ—“vì hắn làm ta bị thương… vì hắn đánh ta”—mà không gọi đó là tự vệ
  alternative: Thêm ý rằng Lê-méc giết người để tự vệ
  rationale: Bản Hê-bơ-rơ không xác định rõ động cơ đạo đức. Bản dịch giữ sức căng của lời khoe khoang và không biện minh cho hành động.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “ta” phù hợp với lời thơ khoe khoang đầy uy quyền của Lê-méc. Cấu trúc xuống dòng giữ phép song hành của nguyên văn; các tên riêng dùng dạng quen thuộc trong tiếng Việt.
