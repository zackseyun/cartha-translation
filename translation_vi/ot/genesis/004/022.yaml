  rationale: Chỉ sửa chú thích a để loại bỏ quan hệ “cho” do tiếng Việt thêm vào và để phản ánh rõ hơn tính mơ hồ cú pháp/ngữ nghĩa của cụm Hê-bơ-rơ. Bản văn chính, các mốc chú thích và chú thích từ vựng về “đồng” được giữ nguyên.
