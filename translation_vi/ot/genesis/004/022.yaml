  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: vi
  text: Xi-la cũng sinh Tu-banh-Ca-in[a], người rèn mọi loại dụng cụ bằng đồng[b] và sắt. Chị hoặc em gái của Tu-banh-Ca-in là Na-a-ma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Phần tiếng Hê-bơ-rơ theo sau tên “Tu-banh-Ca-in” khó hiểu. Cũng có thể dịch: “người mài hoặc đập rèn mọi thợ thủ công về đồng và sắt”; theo cách hiểu này, câu mô tả ông là thợ làm kim loại hơn là người làm ra mọi loại dụng cụ kim loại.'
    reason: alternative_reading
  - marker: b
    text: Từ này cũng có thể dịch là “đồng thiếc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: cũng
  rationale: 'Diễn đạt tự nhiên ý bổ sung: Xi-la, cũng như A-đa trước đó, sinh một người con.'
- source_word: יָלְדָה
  choice: sinh
  rationale: Cách diễn đạt ngắn gọn, tự nhiên trong văn mạch gia phả.
- source_word: תּוּבַל קַיִן
  choice: Tu-banh-Ca-in
  rationale: Phiên âm tên riêng, không dịch nghĩa.
- source_word: לֹטֵשׁ כָּל חֹרֵשׁ
  choice: người rèn mọi loại dụng cụ
  rationale: Cụm Hê-bơ-rơ khó hiểu; cách dịch này giữ hình ảnh nghề luyện kim và tạo câu tiếng Việt rõ nghĩa, đồng thời ghi nhận cách hiểu khác trong chú thích.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ này có thể chỉ đồng hoặc đồng thiếc; “đồng” là cách gọi tự nhiên và đủ rộng trong tiếng Việt, còn nghĩa cụ thể hơn được nêu ở chú thích.
- source_word: בַרְזֶל
  choice: sắt
  rationale: Nghĩa thông thường, rõ ràng của tên kim loại này.
- source_word: אֲחוֹת
  choice: chị hoặc em gái
  rationale: Tiếng Hê-bơ-rơ chỉ quan hệ chị/em gái mà không xác định lớn hay nhỏ; cách dịch tránh bổ sung điều nguyên văn không nói.
- source_word: נַעֲמָה
  choice: Na-a-ma
  rationale: Phiên âm tên riêng, không dịch nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng cấu trúc “chị hoặc em gái” để bảo toàn sự không xác định về thứ bậc tuổi tác trong אֲחוֹת; các tên riêng được phiên âm nhất quán theo âm tiết tiếng Việt.
