  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל קָ֑יִן לָ֚/מָּה חָ֣רָה לָ֔/ךְ וְ/לָ֖/מָּה נָפְל֥וּ פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Ca-in: “Tại sao con nổi giận, và tại sao mặt con sầm xuống[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa sát, “tại sao khuôn mặt con đã sa xuống?” Đây là một thành ngữ Hê-bơ-rơ; cũng có thể dịch: “tại sao mặt con cúi xuống?”'
    reason: Giữ hình ảnh sát chữ của thành ngữ נָפְלוּ פָנֶיךָ, đồng thời cung cấp cách diễn đạt tự nhiên trong tiếng Việt mà không thu hẹp sắc thái vào chỉ buồn rầu hay tức giận.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Rồi” tự nhiên trong văn kể tiếng Việt. Dùng “phán” vì chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng cách chuyển tự, thay vì thay bằng một tước hiệu.
- source_word: אֶל קָיִן
  choice: với Ca-in
  rationale: Cách nói tự nhiên trong tiếng Việt với động từ “phán”; tên קָיִן được chuyển tự theo dạng quen thuộc Ca-in.
- source_word: לָמָּה חָרָה לָךְ
  choice: Tại sao con nổi giận
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen nói cơn giận “bừng cháy”; “nổi giận” truyền đạt rõ nghĩa trong tiếng Việt hiện đại. Đại từ “con” phù hợp với lời Đức Chúa Trời nói trực tiếp với Ca-in.
- source_word: וְלָמָּה נָפְלוּ פָנֶיךָ
  choice: và tại sao mặt con sa sầm
  rationale: “Mặt sa sầm” là thành ngữ tiếng Việt tự nhiên, giữ hình ảnh nét mặt hạ xuống và diễn tả vẻ buồn bực, khó chịu trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; chuyển tự “Yahweh” bảo tồn danh ấy mà không thay bằng tước hiệu.
- issue: Sắc thái của נָפְלוּ פָנֶיךָ
  choice: mặt con sa sầm
  alternative: mặt con cúi xuống / con buồn rầu
  rationale: Không quy thành riêng nỗi buồn, vì ngữ cảnh có thể bao gồm tức giận, thất vọng hoặc vẻ ủ rũ; cách dịch giữ hình ảnh khuôn mặt thay đổi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi trực tiếp giữ cấu trúc song song của nguyên văn; “sa sầm” tự nhiên hơn lối dịch sát chữ nhưng hình ảnh nguyên văn được bảo tồn trong chú thích.
