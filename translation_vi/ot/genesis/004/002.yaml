source:
  edition: WLC
  text: וַ/תֹּ֣סֶף לָ/לֶ֔דֶת אֶת אָחִ֖י/ו אֶת הָ֑בֶל וַֽ/יְהִי הֶ֨בֶל֙ רֹ֣עֵה צֹ֔אן וְ/קַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: vi
  text: Bà lại sinh A-bên, em trai của Ca-in.[a] A-bên là người chăn bầy chiên dê,[b] còn Ca-in canh tác đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bà tiếp tục sinh” hoặc “Bà lại sinh.” Tiếng Hê-bơ-rơ dùng thành ngữ có nghĩa đen là “thêm vào để sinh”, nhằm diễn tả sự lặp lại hoặc tiếp diễn.'
    reason: lexical_alternative
  - marker: b
    text: “Bầy chiên dê” ở đây dịch từ một từ chung chỉ gia súc nhỏ, đặc biệt là chiên và dê.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: Bà lại sinh
  rationale: Thành ngữ יסף kết hợp với động từ nguyên mẫu diễn tả việc lặp lại hoặc tiếp tục. “Lại sinh” tự nhiên trong tiếng Việt và phù hợp với trình tự sinh nở ở đây.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: em trai của Ca-in là A-bên
  rationale: Cụm từ giới thiệu đứa con mới sinh trong quan hệ với Ca-in rồi nêu tên A-bên. Tiếng Việt cần nói rõ chủ thể sở hữu mà đại từ Hê-bơ-rơ chỉ đến; “em trai” phù hợp với thứ tự sinh trong mạch truyện.
- source_word: הֶבֶל
  choice: A-bên
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: וַיְהִי
  choice: trở thành
  rationale: Ở đây היה giới thiệu nghề nghiệp của A-bên trong diễn tiến câu chuyện; “trở thành” giữ được sắc thái phát triển, dù “là” cũng có thể hiểu được.
- source_word: רֹעֵה צֹאן
  choice: người chăn bầy gia súc nhỏ
  rationale: רעה là chăn dắt, còn צאן chỉ chung các đàn gia súc nhỏ, nhất là chiên và dê. Cách dịch này tránh thu hẹp nghĩa chỉ còn chiên.
- source_word: קַיִן
  choice: Ca-in
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: là người canh tác đất đai
  rationale: עבד + אדמה chỉ việc lao động, canh tác đất. “Người canh tác đất đai” tự nhiên, trang trọng và không diễn giải rộng thành một loại hình nghề nông cụ thể.
- source_word: אֲדָמָה
  choice: đất đai
  rationale: Giữ ý nghĩa đất/đất canh tác và mối liên hệ từ vựng với motif אֲדָמָה trong phần đầu Sáng Thế Ký.
- source_word: וְ
  choice: còn
  rationale: Liên từ đặt hai nghề nghiệp cạnh nhau để tương phản nhẹ. “Còn” tự nhiên hơn “và” trong tiếng Việt mà không gán giá trị đạo đức cho nghề nào.
theological_decisions:
- issue: Cách trình bày nghề nghiệp của hai anh em
  choice: Mô tả trung tính hai nghề nghiệp khác nhau, không hàm ý nghề nào cao quý hay thấp kém hơn.
  alternative: Dùng cách diễn đạt ngầm đề cao nghề chăn nuôi hoặc nghề canh tác.
  rationale: Bản Hê-bơ-rơ ở câu này chỉ nêu nghề nghiệp; chưa đưa ra sự đánh giá đạo đức hay thần học về hai nghề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà” để tiếp nối người mẹ đã được nêu ở câu trước; giữ các tên riêng theo dạng Việt hóa quen thuộc. Cấu trúc “còn” thể hiện đối chiếu nghề nghiệp nhẹ nhàng, không tạo phán xét đạo đức.
