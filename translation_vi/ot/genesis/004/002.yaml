revisions:
- from: Bà lại sinh em trai của Ca-in là A-bên.[a] A-bên trở thành người chăn bầy gia súc nhỏ,[b] còn Ca-in là người canh tác đất đai.
  to: Bà lại sinh A-bên, em trai của Ca-in.[a] A-bên là người chăn bầy chiên dê,[b] còn Ca-in canh tác đất.
  rationale: Bản sửa làm rõ và tự nhiên hóa cú pháp tiếng Việt, thay cách diễn đạt nghề nghiệp của A-bên bằng mô tả trung tính hơn, và dùng cụm từ thông dụng cho đàn צאן. Không thay đổi trình tự, quan hệ anh em, tính chất đối chiếu nhẹ của liên từ, hay sự trung tính thần học của câu.
  reviewer_model: gpt-5.6-terra
