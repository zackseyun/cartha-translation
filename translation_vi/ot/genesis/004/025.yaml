  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính: A-đam lại quan hệ với vợ, sinh con trai, đặt tên Sết, và lời giải thích quy sự thay thế A-bên cho Đức Chúa Trời. Tuy nhiên, “đặt cho tôi một dòng dõi khác” không diễn đạt tự nhiên ý Đức Chúa Trời ban/cung ứng một đứa con thay cho A-bên; “dòng dõi” thường chỉ một dòng hoặc hậu duệ tập thể, không phù hợp với một trẻ sơ sinh trong ngữ cảnh trực tiếp này. Cách diễn đạt “đã ban cho tôi một con trai khác” truyền đạt chính xác hơn giá trị quy chiếu của זֶרַע ở đây, còn chú thích giữ nghĩa từ nguyên và lối chơi chữ của שָׁת/Sết.'
