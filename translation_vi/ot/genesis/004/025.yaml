source:
  edition: WLC
  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: vi
  text: 'A-đam lại ăn ở với vợ mình. Bà sinh một con trai và đặt tên là Sết[a], vì bà nói: “Đức Chúa Trời đã ban cho tôi một con trai khác thay cho A-bên, vì Ca-in đã giết A-bên.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên “Sết” nghe gần với động từ Hê-bơ-rơ có nghĩa là “đặt” hoặc “để”, tạo nên một lối chơi chữ.
    reason: Giải thích lối chơi chữ giữa tên Sết và động từ Hê-bơ-rơ trong nguyên văn, vốn không thể tái hiện đầy đủ trong bản dịch tiếng Việt.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: ăn ở với
  rationale: Trong ngữ cảnh vợ chồng, יָדַע là cách nói giảm chỉ quan hệ tình dục. Tiếng Việt hiện đại không dùng “biết” theo nghĩa này; “ăn ở với” giữ được tính kín đáo và sắc thái văn chương mà vẫn rõ nghĩa.
- source_word: אָדָם
  choice: A-đam
  rationale: Ở đây từ này được dùng như tên riêng; phiên âm theo cách gọi quen thuộc trong tiếng Việt.
- source_word: עוֹד
  choice: lại
  rationale: Diễn tả hành động được lặp lại và là cách nói tự nhiên, gọn trong tiếng Việt.
- source_word: וַתֵּלֶד בֵּן
  choice: Bà sinh một con trai
  rationale: Chuyển tải trực tiếp động từ ילד cùng danh từ בן bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: đặt tên là
  rationale: Đây là cách diễn đạt tự nhiên của công thức đặt tên trong tiếng Việt, thay vì dịch máy móc là “gọi tên người là”.
- source_word: שֵׁת
  choice: Sết
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo hình thức quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: שָׁת
  choice: đã đặt
  rationale: Giữ nghĩa cơ bản “đặt/để” của שִׁית và giúp chú thích làm rõ lối chơi chữ giữa động từ này với tên Sết.
- source_word: זֶרַע
  choice: dòng dõi
  rationale: Giữ được sắc thái sinh sản và khả năng mang nghĩa tập thể của זֶרַע; “một người con” tuy tự nhiên hơn nhưng sẽ thu hẹp nghĩa của từ nguồn.
- source_word: אַחֵר
  choice: khác
  rationale: Tương đương trực tiếp, bổ nghĩa tự nhiên cho “dòng dõi”.
- source_word: תַּחַת
  choice: thay cho
  rationale: Trong câu này, תַּחַת biểu thị sự thay thế, không phải vị trí không gian.
- source_word: הֶבֶל
  choice: A-bên
  rationale: Tên riêng được phiên âm theo hình thức quen thuộc trong tiếng Việt.
- source_word: הֲרָגוֹ
  choice: đã giết A-bên
  rationale: הרג là động từ thông dụng mang nghĩa “giết”. Lặp lại tên A-bên thay cho đại từ “người ấy/nó” để câu tiếng Việt rõ ràng, tự nhiên mà không tăng mức độ đặc thù thành “sát hại” hay “ám sát”.
theological_decisions:
- issue: Lời giải thích của người mẹ về tên Sết
  choice: Đức Chúa Trời đã đặt cho tôi một dòng dõi khác
  alternative: Đức Chúa Trời đã ban cho tôi một người con khác
  rationale: “Đã đặt” bám sát động từ nguồn và bảo toàn cơ sở cho lối chơi chữ với tên Sết; “dòng dõi” giữ độ rộng nghĩa của זֶרַע, không giới hạn hoàn toàn vào cá nhân đứa trẻ mới sinh.
- issue: Mức độ minh thị của cách nói giảm về quan hệ vợ chồng
  choice: A-đam lại ăn ở với vợ mình
  alternative: A-đam lại biết vợ mình
  rationale: Bản Hê-bơ-rơ dùng một cách nói giảm quen thuộc. “Ăn ở với” giữ sự kín đáo nhưng dễ hiểu trong tiếng Việt hiện đại; dịch sát là “biết” sẽ không truyền đạt đúng nghĩa cho phần lớn độc giả.
- issue: Quan niệm Đức Chúa Trời là Đấng cung ứng người thay thế A-bên
  choice: Giữ nguyên lời quy hành động cho Đức Chúa Trời mà không giải thích thêm
  alternative: Diễn giải rằng Đức Chúa Trời đã phục hồi dòng dõi được chọn
  rationale: Câu nguồn chỉ thuật lại lời người mẹ rằng Đức Chúa Trời đã đặt một dòng dõi khác thay cho A-bên. Bản dịch không thêm một hệ thống thần học hay xác định chi tiết vai trò của dòng dõi này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ăn ở với” là cách nói giảm tự nhiên; “dòng dõi” hơi trang trọng nhưng cần thiết để giữ độ rộng nghĩa của זֶרַע. Dấu chú thích được đặt ngay sau tên “Sết”, nơi lối chơi chữ cần được giải thích.
