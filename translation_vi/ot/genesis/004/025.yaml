  to: 'A-đam lại ăn ở với vợ mình. Bà sinh một con trai và đặt tên là Sết[a], vì bà nói: “Đức Chúa Trời đã ban cho tôi một con trai khác thay cho A-bên, vì Ca-in đã giết A-bên.”'
  rationale: Bản sửa thay cụm “một dòng dõi khác” bằng “một con trai khác” nhằm phản ánh rõ và tự nhiên đối tượng mà người mẹ hiểu là Đức Chúa Trời đã cung ứng thay cho A-bên. Không cần ép động từ שָׁת thành “đặt” trong bản văn tiếng Việt khi kết quả bất tự nhiên; chú thích bảo lưu nghĩa “đặt/để” và lối chơi chữ. Các yếu tố còn lại được giữ nguyên.
