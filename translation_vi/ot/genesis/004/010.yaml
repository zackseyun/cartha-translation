source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: vi
  text: 'Ngài phán: “Con đã làm gì vậy? Tiếng máu của anh/em con đang kêu lên với Ta từ đất.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng dạng số nhiều của từ “máu”, một cách dùng thường gặp trong ngữ cảnh đổ máu; tiếng Việt thường nói đơn giản là “máu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngài phán
  rationale: Động từ kể chuyện wayyiqtol tiếp nối diễn tiến. Tiếng Việt không cần dịch máy móc liên từ וַ; “Ngài phán” tự nhiên, trang trọng và phù hợp lời Đức Chúa Trời trong ngữ cảnh.
- source_word: מֶה עָשִׂיתָ
  choice: Con đã làm gì vậy?
  rationale: Câu hỏi trực tiếp mang sức nặng cáo buộc. “Đã làm” diễn đạt hành động đã hoàn tất, còn “vậy” tạo sắc thái chất vấn tự nhiên mà không thêm một cách giải thích.
- source_word: קוֹל
  choice: Tiếng
  rationale: קוֹל có thể là “tiếng” hoặc “giọng”. “Tiếng” kết hợp tự nhiên với “máu ... kêu”, đồng thời giữ phép nhân hóa thay vì biến hình ảnh thành một ý niệm trừu tượng.
- source_word: דְּמֵי
  choice: máu
  rationale: Dạng số nhiều trong tiếng Hê-bơ-rơ thường xuất hiện trong ngữ cảnh đổ máu; tiếng Việt dùng danh từ khối “máu” tự nhiên hơn. Dạng số nhiều được ghi chú để không che khuất đặc điểm của nguyên văn.
- source_word: אָחִיךָ
  choice: của em con
  rationale: Trong ngữ cảnh A-bên là em của Ca-in, “em con” tự nhiên và cụ thể hơn “anh/em của con”; kết cấu sở hữu được diễn đạt bằng “của” để gắn rõ với “máu”.
- source_word: צֹעֲקִים
  choice: đang kêu thấu
  rationale: Phân từ diễn tả tiếng kêu đang tiếp diễn. “Kêu thấu đến” giữ sắc thái tiếng kêu khẩn thiết hướng tới Đức Chúa Trời và phù hợp với phép nhân hóa.
- source_word: אֵלַי
  choice: đến ta
  rationale: Diễn đạt trực tiếp hướng của tiếng kêu về phía Đức Chúa Trời. Đại từ “ta” trang trọng, rõ quan hệ người nói với Ca-in mà không thêm danh xưng không có trong câu.
- source_word: מִן הָאֲדָמָה
  choice: từ dưới đất
  rationale: אֲדָמָה chỉ đất/đất đai, có vai trò nổi bật trong trình thuật Ca-in. “Từ dưới đất” là cách nói tiếng Việt tự nhiên cho tiếng máu của người bị giết vọng lên từ nơi đất đã nhận máu.
theological_decisions:
- issue: Phép nhân hóa máu A-bên bị đổ
  choice: Giữ hình ảnh chính máu của A-bên đang kêu thấu đến Đức Chúa Trời.
  alternative: Diễn giải trừu tượng rằng tội làm đổ máu đang đòi công lý.
  rationale: Nguyên văn trình bày một hình ảnh nhân hóa sống động. Giữ nguyên hình ảnh bảo toàn sức nặng đạo đức và thần học, không thu hẹp câu vào một cách giải thích giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài phán” cho lời Đức Chúa Trời, “con/ta” trong lời trực tiếp, và giữ hình ảnh nhân hóa nổi bật của nguyên văn. Dấu chú thích [a] đặt ngay sau câu có từ được giải thích.
