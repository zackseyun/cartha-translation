  source_fidelity: 'Cần sửa mệnh đề đầu để không khiến Sết, một người nam, trở thành chủ thể trực tiếp của hành động sinh con. Hê-bơ-rơ dùng bị động: “một con trai được sinh ra cho Sết.” Bản chính giữ cách hiểu thông dụng của הוּחַל là khởi đầu, đồng thời chú thích bảo lưu cách hiểu thiểu số “bị làm ô uế/xúc phạm.”'
