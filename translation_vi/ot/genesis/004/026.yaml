  text: וּ/לְ/שֵׁ֤ת גַּם הוּא֙ יֻלַּד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ אֱנ֑וֹשׁ אָ֣ז הוּחַ֔ל לִ/קְרֹ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: vi
  text: Sết cũng có một con trai được sinh ra, và ông đặt tên con là Ê-nốt. Bấy giờ, người ta bắt đầu kêu cầu danh của Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, dịch sát hơn: “Bấy giờ, việc kêu cầu danh của Yahweh bắt đầu.” Một cách hiểu thiểu số hiểu động từ này theo nghĩa “bị làm ô uế,” dẫn đến: “Bấy giờ, người ta bắt đầu xúc phạm danh của Yahweh.”'
    reason: Bảo lưu cấu trúc bị động của הוּחַל và cách hiểu thiểu số có cơ sở của động từ này.
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: Sết cũng sinh được một con trai
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt việc Sết cũng có một con trai; đại từ הוּא có tác dụng nhấn mạnh nhẹ và được thể hiện qua “cũng” trong toàn mệnh đề.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: và ông đặt tên con là Ê-nốt
  rationale: “Đặt tên con là” là cách chuyển ngữ tự nhiên của thành ngữ Hê-bơ-rơ “gọi tên nó là,” đồng thời xác định rõ Sết là chủ thể.
- source_word: אֱנוֹשׁ
  choice: Ê-nốt
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong tiếng Việt; ở đây từ này có chức năng là tên người, dù có liên hệ từ nguyên với danh từ chỉ con người phàm mortal.
- source_word: אָז
  choice: Bấy giờ
  rationale: Diễn đạt cô đọng, trang trọng và tự nhiên ý nghĩa thời gian của אָז.
- source_word: הוּחַל
  choice: người ta bắt đầu
  rationale: Hiểu dạng Hophal theo nghĩa khởi đầu, sát với cách giải thích phổ biến “việc ấy bắt đầu/ người ta bắt đầu”; chủ thể phiếm chỉ “người ta” giúp câu tiếng Việt tự nhiên nhưng vẫn không xác định một nhóm cụ thể.
- source_word: לִקְרֹא בְּשֵׁם
  choice: kêu cầu danh
  rationale: Thành ngữ này thường chỉ việc khẩn cầu hoặc thờ phượng; “kêu cầu danh” giữ được hình ảnh và sắc thái tôn giáo của nguyên văn.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm thánh danh đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách hiểu הוּחַל לִקְרֹא בְּשֵׁם יְהוָה
  choice: người ta bắt đầu kêu cầu danh Đức Giê-hô-va
  alternative: 'Bấy giờ, việc kêu cầu danh Đức Giê-hô-va bắt đầu; hoặc theo cách hiểu thiểu số: bấy giờ người ta bắt đầu xúc phạm danh Đức Giê-hô-va'
  rationale: Cách hiểu khởi đầu phù hợp với lối dùng thành ngữ קרא בשם ở các chỗ khác và tạo nghĩa tự nhiên trong ngữ cảnh. Tuy vậy, hình thái הוּחַל có thể được gắn với nghĩa “làm ô uế/xúc phạm,” nên cách hiểu thiểu số được bảo lưu trong chú thích thay vì bị loại bỏ.
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng chứ không đổi thành tước hiệu; dạng “Đức Giê-hô-va” là cách gọi trang trọng và quen thuộc với độc giả Kinh Thánh tiếng Việt.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Sết,” “Ê-nốt” và “Đức Giê-hô-va” theo các dạng phiên âm quen thuộc; câu cuối giữ thành ngữ “kêu cầu danh” để bảo toàn sắc thái thờ phượng và sự gần gũi với nguyên văn.
