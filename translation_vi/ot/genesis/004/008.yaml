  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל הֶ֣בֶל אָחִ֑י/ו וַֽ/יְהִי֙ בִּ/הְיוֹתָ֣/ם בַּ/שָּׂדֶ֔ה וַ/יָּ֥קָם קַ֛יִן אֶל הֶ֥בֶל אָחִ֖י/ו וַ/יַּהַרְגֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: vi
  text: Ca-in nói với A-bên, em mình.[a] Rồi, khi họ đang ở ngoài đồng, Ca-in xông vào A-bên, em mình, và giết em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bản văn Hê-bơ-rơ Masoret chỉ chép: “Ca-in nói với A-bên, em mình,” nhưng không ghi nội dung lời nói. Một số chứng nhân cổ, gồm Bản Bảy Mươi, Ngũ Kinh Sa-ma-ri và Vulgata, có thêm: “Chúng ta hãy ra ngoài đồng.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ca-in nói
  rationale: Động từ אָמַר thông thường có nghĩa là “nói”. Bản Masoret được cung cấp không ghi lại nội dung lời nói, nên bản dịch giữ nguyên câu dẫn bị bỏ lửng thay vì tự bổ sung vào chính văn.
- source_word: אֶל
  choice: với
  rationale: Giới từ אֶל ở đây chỉ người mà lời nói hướng đến. Trong tiếng Việt, “nói với A-bên” tự nhiên hơn “nói đến A-bên” mà vẫn truyền đạt đúng quan hệ cú pháp.
- source_word: אָחִיו
  choice: em mình
  rationale: אָחִיו có nghĩa đen là “anh/em trai của mình”. Theo mạch gia phả, A-bên là em của Ca-in; dùng “em mình” vừa tự nhiên vừa duy trì sự nhấn mạnh bi thảm về tình ruột thịt khi cụm này lặp lại.
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: Rồi, khi họ đang
  rationale: Cấu trúc này mở khung thời gian cho diễn biến kế tiếp. “Rồi, khi họ đang…” là cách kể chuyện tự nhiên trong tiếng Việt hiện đại.
- source_word: בַּשָּׂדֶה
  choice: ở ngoài đồng
  rationale: שָׂדֶה chỉ cánh đồng hoặc vùng đất trống. “Ngoài đồng” là cách diễn đạt tự nhiên, phù hợp bối cảnh.
- source_word: וַיָּקָם ... אֶל
  choice: xông vào
  rationale: Thành ngữ có nghĩa đứng dậy chống lại hoặc tấn công một người. “Xông vào” truyền đạt hành động thù nghịch và trực tiếp, tự nhiên hơn lối dịch sát chữ “đứng dậy chống lại” trong tiếng Việt.
- source_word: וַיַּהַרְגֵהוּ
  choice: giết em
  rationale: Động từ הָרַג nghĩa là “giết”. Đại từ được chuyển thành “em” để tránh một đại từ tiếng Việt mơ hồ và giữ rõ quan hệ anh em, nhưng không thêm sắc thái pháp lý của “sát hại” hay “giết người”.
theological_decisions:
- issue: Có nên đưa lời nói của Ca-in vốn không có trong Bản Masoret vào chính văn hay không
  choice: 'Giữ cách đọc ngắn của Bản Masoret trong chính văn: “Ca-in nói với A-bên, em mình.”'
  alternative: Bổ sung “Chúng ta hãy ra ngoài đồng” theo Bản Bảy Mươi, Ngũ Kinh Sa-ma-ri và Vulgata.
  rationale: Nguồn tiếng Hê-bơ-rơ được cung cấp không có nội dung lời nói, dù câu văn vì thế bị bỏ lửng. Nhiều chứng nhân cổ bảo tồn một mệnh đề hợp lý và có thể phản ánh nguyên bản, nhưng không đủ cơ sở để âm thầm đưa mệnh đề ấy vào chính văn. Chú thích ghi rõ biến thể nhằm bảo tồn cả chứng cứ văn bản lẫn sự không chắc chắn.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Tên riêng dùng dạng quen thuộc “Ca-in” và “A-bên”. Cụm “em mình” được lặp lại có chủ ý để giữ sự nhấn mạnh của nguyên văn về tình anh em. Dấu chú thích [a] đặt sau “Rồi” theo cấu trúc bản tham khảo, nhưng nội dung chú thích giải thích trực tiếp chỗ lời nói bị bỏ lửng ngay trước đó.
