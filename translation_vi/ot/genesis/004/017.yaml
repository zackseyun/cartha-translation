base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: vi
  text: Ca-in ăn ở với vợ mình[a], và vợ ông thụ thai, sinh Hê-nóc. Ông đang xây một thành[b] và đặt tên thành ấy theo tên con trai mình là Hê-nóc.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “biết vợ mình”, một thành ngữ Hê-bơ-rơ chỉ quan hệ vợ chồng.
    reason: cultural_note
  - marker: b
    text: 'Cấu trúc Hê-bơ-rơ có thể hàm ý hành động đang diễn ra: “đang xây một thành”, chứ không nhất thiết nói rằng ông đã xây xong thành ấy.'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn sát nghĩa là “gọi tên của thành theo tên của con trai mình”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: ăn ở với
  rationale: Động từ יָדַע có nghĩa đen là “biết”, nhưng tại đây là thành ngữ Hê-bơ-rơ chỉ quan hệ vợ chồng. “Ăn ở với” là cách nói nhã nhặn, quen thuộc trong tiếng Việt và truyền đạt đúng nghĩa theo ngữ cảnh.
- source_word: אִשְׁתּוֹ
  choice: vợ mình
  rationale: אִשָּׁה có thể chỉ “người nữ” hoặc “vợ”; hậu tố sở hữu và ngữ cảnh xác định nghĩa “vợ”. “Mình” quy chiếu tự nhiên về Ca-in trong câu tiếng Việt.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: thụ thai và sinh
  rationale: 'Giữ rõ chuỗi sự việc của nguyên văn: người vợ thụ thai rồi sinh con.'
- source_word: חֲנוֹךְ
  choice: Hê-nóc
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: Bấy giờ, ông đang xây một thành
  rationale: Cấu trúc היה kết hợp phân từ בֹּנֶה có thể biểu thị hành động đang diễn tiến. “Đang xây” bảo toàn sắc thái này; “một thành” phù hợp hơn “thành phố” trong bối cảnh cổ đại.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: đặt tên thành theo tên con trai mình
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý của thành ngữ Hê-bơ-rơ theo nghĩa đen là “gọi tên của thành theo tên của con trai mình”.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật trang trọng nhưng hiện đại. Dùng “ăn ở với” để chuyển thành ngữ về quan hệ vợ chồng một cách nhã nhặn và dễ hiểu; dùng “đang xây” để giữ sắc thái tiếp diễn của cấu trúc Hê-bơ-rơ. Các đại từ “nàng/ông” giúp tránh lặp mà vẫn xác định rõ chủ thể.
