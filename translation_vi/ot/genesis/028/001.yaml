base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: vi
  text: 'Bấy giờ, Y-sác gọi Gia-cốp đến, chúc phước cho ông, ra lệnh cho ông và nói: “Con không được lấy vợ trong số các con gái Ca-na-an.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các con gái Ca-na-an” là cách nói chỉ những phụ nữ thuộc dân Ca-na-an.
    reason: Giải thích thành ngữ Hê-bơ-rơ được giữ lại trong bản dịch chính.
lexical_decisions:
- source_word: וַיִּקְרָא יִצְחָק אֶל יַעֲקֹב
  choice: Y-sác gọi Gia-cốp đến
  rationale: קרא אל trong ngữ cảnh này là gọi một người đến; thêm “đến” diễn đạt tự nhiên ý triệu gọi mà không làm câu quá trang trọng.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: chúc phước cho ông
  rationale: ברך là động từ thông dụng chỉ hành động ban hoặc cầu phước; “chúc phước” phù hợp văn phong Kinh Thánh tiếng Việt và giữ sắc thái trang trọng.
- source_word: וַיְצַוֵּהוּ
  choice: truyền lệnh
  rationale: צוה diễn tả mệnh lệnh có thẩm quyền, mạnh hơn lời khuyên hay chỉ dẫn đơn thuần.
- source_word: וַיֹּאמֶר לוֹ
  choice: rằng
  rationale: Dùng “rằng” để dẫn lời trực tiếp, tránh lặp nặng nề chuỗi “và... và...”, đồng thời vẫn thể hiện động từ nói trong nguyên văn.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: Con không được lấy vợ
  rationale: Trong ngữ cảnh hôn nhân, לקח אשה có nghĩa là lấy một người nữ làm vợ. “Không được” truyền đạt rõ lực cấm đoán; “con” thể hiện tự nhiên quan hệ cha–con được ngữ cảnh xác định.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: trong số các con gái Ca-na-an
  rationale: Giữ hình ảnh sát nguyên văn “các con gái Ca-na-an”; giới từ מן mang nghĩa chọn một người từ trong nhóm ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc kể chuyện tuần tự nhưng điều chỉnh chuỗi liên từ cho tự nhiên trong tiếng Việt. Đại từ “ông” trong lời kể dành cho Gia-cốp và “con” trong lời trực tiếp làm rõ quan hệ theo ngữ cảnh mà không thêm nội dung thần học.
