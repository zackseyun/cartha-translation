  text: וַ/יִּפְגַּ֨ע בַּ/מָּק֜וֹם וַ/יָּ֤לֶן שָׁם֙ כִּי בָ֣א הַ/שֶּׁ֔מֶשׁ וַ/יִּקַּח֙ מֵ/אַבְנֵ֣י הַ/מָּק֔וֹם וַ/יָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑י/ו וַ/יִּשְׁכַּ֖ב בַּ/מָּק֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: vi
  text: Gia-cốp đến một nơi kia và nghỉ đêm tại đó[a], vì mặt trời đã lặn. Ông lấy một hòn trong số những hòn đá ở nơi ấy[b], đặt ở phía đầu mình[c], rồi nằm xuống tại chính nơi đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ có nghĩa sát là “tại nơi chốn đó” (với mạo từ xác định). Ở lần nhắc đầu, dịch là “một nơi kia” cho tự nhiên, đồng thời gợi rằng địa điểm này sẽ có ý nghĩa trong câu chuyện.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ông lấy một số hòn đá ở nơi ấy.” Cấu trúc Hê-bơ-rơ có thể được hiểu là lấy một hòn trong số nhiều hòn hoặc lấy một số hòn đá.'
    reason: alternative_reading
  - marker: c
    text: Cụm từ Hê-bơ-rơ chỉ vị trí nơi đầu hoặc chỗ kê đầu; cũng có thể dịch là “đặt dưới đầu mình” hoặc “dùng làm gối đầu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: đến một nơi kia
  rationale: Động từ פגע trong bối cảnh hành trình mang nghĩa đến hoặc gặp một địa điểm. Cụm “một nơi kia” vừa tự nhiên trong tiếng Việt, vừa phản ánh phần nào sắc thái xác định của הַמָּקוֹם và báo trước tầm quan trọng của địa điểm này.
- source_word: וַיָּלֶן שָׁם
  choice: nghỉ đêm tại đó
  rationale: Động từ לון chỉ việc ở lại qua đêm; “nghỉ đêm” là cách diễn đạt hiện đại, tự nhiên và không khẳng định quá mức rằng Gia-cốp đã ngủ ngay lúc ấy.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: vì mặt trời đã lặn
  rationale: Khi chủ ngữ là mặt trời, בוא là lối nói chỉ mặt trời lặn. “Đã lặn” diễn đạt rõ quan hệ thời gian và nguyên nhân của việc dừng lại nghỉ đêm.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: Ông lấy một hòn trong số những hòn đá ở nơi ấy
  rationale: 'מִן đi với danh từ số nhiều có thể mang nghĩa phân chia: lấy một hòn từ số đá tại đó. Bản dịch chính dùng cách hiểu số ít phổ biến nhưng ghi chú cách hiểu “một số hòn đá” vì cấu trúc Hê-bơ-rơ có thể cho phép điều ấy.'
- source_word: מְרַאֲשֹׁתָיו
  choice: ở phía đầu mình
  rationale: Từ này chỉ vị trí nơi đầu hoặc vật kê đầu. “Ở phía đầu mình” giữ được nét nghĩa không gian của nguyên ngữ mà không buộc phải xác định hòn đá nằm ngay dưới đầu.
- source_word: וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא
  choice: rồi nằm xuống tại chính nơi đó
  rationale: “Nằm xuống” diễn đạt hành động ngả mình mà chưa thay bằng ý “ngủ”. Từ “chính” giúp giữ sự nhấn mạnh và lặp lại về địa điểm trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “Gia-cốp” để nêu rõ chủ thể theo ngữ cảnh, sau đó dùng “ông”. Việc lặp lại “nơi” được duy trì vì địa điểm là điểm nhấn của câu.
