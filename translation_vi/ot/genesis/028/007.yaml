  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: vi
  text: và rằng Gia-cốp đã nghe theo cha mẹ mình[a] và đi đến Pha-đan A-ram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã vâng lời cha mẹ mình.” Động từ Hê-bơ-rơ trong ngữ cảnh này có thể bao hàm cả việc nghe và làm theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: đã nghe theo
  rationale: Động từ שׁמע đi với אֶל trong ngữ cảnh này diễn tả việc lắng nghe và làm theo lời chỉ dẫn. “Nghe theo” tự nhiên trong tiếng Việt và giữ được cả sắc thái nghe lẫn vâng lời mà không thu hẹp nghĩa chỉ còn “vâng lời”.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: cha mẹ mình
  rationale: Cụm này chỉ rõ cha và mẹ của Gia-cốp. Tiếng Việt tự nhiên gộp thành “cha mẹ mình”; đại từ “mình” quy chiếu về chủ ngữ Gia-cốp.
- source_word: וַיֵּלֶךְ
  choice: đi
  rationale: הלך là động từ thông dụng chỉ sự đi. “Đi” trực tiếp, tự nhiên và không thêm sắc thái không có trong nguồn.
- source_word: פַּדֶּנָה אֲרָם
  choice: đến Pha-đan A-ram
  rationale: Đây là địa danh; hậu tố chỉ hướng -ָה được thể hiện bằng “đến”. Phiên âm “Pha-đan A-ram” phù hợp cách đọc dễ tiếp cận trong tiếng Việt.
- source_word: וַ
  choice: và rằng
  rationale: Waw tiếp nối mệnh đề phụ thuộc vào câu trước. “Và rằng” bảo toàn sự liên kết cú pháp của câu 28:7 thay vì làm câu này thành một phát biểu hoàn toàn độc lập.
