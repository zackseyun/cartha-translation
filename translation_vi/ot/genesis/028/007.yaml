translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc nối tiếp của nguyên văn bằng “và rằng”; dùng “nghe theo” để bảo tồn độ rộng nghĩa của động từ Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
