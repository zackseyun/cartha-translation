source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: vi
  text: Dòng dõi con sẽ đông như bụi đất, và con sẽ lan rộng về phía tây, phía đông, phía bắc và phía nam. Mọi gia tộc trên đất sẽ được ban phước trong con và trong dòng dõi con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi gia tộc trên đất sẽ lấy con và dòng dõi con làm lời chúc phước cho mình.” Động từ Hê-bơ-rơ cũng có thể được hiểu theo nghĩa phản thân hoặc trung động.'
    reason: alternative_reading
lexical_decisions:
- source_word: זַרְעֲךָ / וּבְזַרְעֶךָ
  choice: dòng dõi con
  rationale: זֶרַע là danh từ tập hợp, chỉ hậu duệ. “Dòng dõi” tự nhiên trong tiếng Việt, giữ được tính tập hợp và không áp đặt số ít hay số nhiều vào đối tượng được nói đến.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: đông như bụi đất
  rationale: Nguyên văn là “như bụi đất”; thêm “đông” làm rõ ý so sánh về số lượng vốn hàm chứa trong lời hứa, đồng thời vẫn giữ hình ảnh Hê-bơ-rơ.
- source_word: וּפָרַצְתָּ
  choice: con sẽ lan rộng
  rationale: פרץ gợi ý bứt phá hoặc tràn ra. Trong chuỗi bốn phương hướng, “lan rộng” diễn đạt tự nhiên sự mở rộng của dòng dõi và địa bàn mà không thu hẹp vào một cách hiểu riêng.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: về phía tây, phía đông, phía bắc và phía nam
  rationale: Các hậu tố chỉ hướng được thể hiện bằng “về phía”. Trong chuỗi này, נֶגֶב mang nghĩa phương nam chứ không phải tên riêng Nê-ghép.
- source_word: וְנִבְרֲכוּ
  choice: sẽ ... được ban phước
  rationale: Dạng Niphal của ברך được hiểu theo nghĩa bị động trong lời hứa này. Cách diễn đạt “được ban phước” trang trọng, rõ nghĩa trong tiếng Việt; khả năng phản thân/trung gian được bảo lưu ở chú thích.
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: nhờ con và dòng dõi con mà
  rationale: Trong tiếng Việt, “nhờ ... mà” diễn đạt tự nhiên vai trò trung gian/phương tiện của ב trong công thức lời hứa. Nó tránh lối dịch gượng “trong con” nhưng không xác định cơ chế thần học của phước lành.
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: mọi gia tộc trên đất
  rationale: מִשְׁפָּחוֹת chỉ các nhóm thân tộc nên “gia tộc” chính xác hơn “gia đình” trong ngữ cảnh phổ quát. הָאֲדָמָה ở đây chỉ đất/thế gian có người cư ngụ; “trên đất” tự nhiên và giữ liên hệ từ vựng với “bụi đất”.
theological_decisions:
- issue: Nghĩa của וְנִבְרֲכוּ trong công thức lời hứa tổ phụ
  choice: 'Bị động: “sẽ ... được ban phước”'
  alternative: 'Phản thân/trung gian: “sẽ lấy con và dòng dõi con làm lời chúc phước cho mình” hoặc “sẽ cầu phước cho mình”'
  rationale: Dạng Niphal cho phép tranh luận giữa nghĩa bị động và phản thân/trung gian. Nghĩa bị động phù hợp tự nhiên với văn cảnh lời hứa, nhưng phương án kia là một khả năng ngữ pháp thực sự nên được ghi ở chú thích thay vì bị loại bỏ.
- issue: Phạm vi và số của זֶרַע
  choice: Dùng danh từ tập hợp “dòng dõi”
  alternative: “hậu duệ” hoặc “hạt giống”
  rationale: Bản văn Hê-bơ-rơ dùng danh từ tập hợp có thể quy chiếu đến hậu duệ nói chung mà không tự nó giải quyết mọi chiều kích thần học về số ít hay số nhiều. “Dòng dõi” bảo lưu độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo lời Đức Chúa Trời phán trực tiếp với Gia-cốp. Cấu trúc câu được tách làm hai để đọc tự nhiên; dấu chú thích [a] được đặt ngay sau mệnh đề có cách hiểu thay thế.
