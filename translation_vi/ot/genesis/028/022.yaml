base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: vi
  text: Hòn đá này mà tôi đã dựng làm trụ đá sẽ là nhà của Đức Chúa Trời[a]; từ mọi điều Ngài ban cho tôi, tôi nhất định sẽ dâng cho Ngài một phần mười[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ là một nhà của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng lối nói nhấn mạnh: “tôi nhất định sẽ dâng một phần mười cho Ngài”; cũng có thể dịch: “tôi nhất định sẽ dâng phần mười cho Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצֵּבָה
  choice: trụ
  rationale: Chỉ một hòn đá được dựng đứng làm dấu hoặc đài kỷ niệm. “Trụ” ngắn gọn, cụ thể và không thêm ý nghĩa nghi lễ ngoài nguyên văn.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: sẽ là nhà của Đức Chúa Trời
  rationale: Giữ sát cấu trúc “nhà của Đức Chúa Trời”, đồng thời dùng cách nói tự nhiên trong tiếng Việt; không diễn giải hòn đá thành đền thờ theo nghĩa về sau.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong mạch văn, từ này chỉ chính Đức Chúa Trời đã hiện ra với Gia-cốp, không phải một thần linh bất định.
- source_word: תִּתֶּן לִי
  choice: Ngài ban cho tôi
  rationale: “Ban” phù hợp với hành động Đức Chúa Trời trao cho Gia-cốp, còn đại từ kính ngữ “Ngài” làm rõ chủ thể đã được nêu trong câu.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: tôi chắc chắn sẽ dâng Ngài một phần mười
  rationale: Diễn đạt cả ý một phần mười và sức nhấn mạnh của nguyên thể tuyệt đối đi với động từ hữu hạn; “dâng” tự nhiên hơn “đánh thuế thập phân” và hợp với lời khấn nguyện.
- source_word: לָךְ
  choice: Ngài
  rationale: Đánh dấu Đức Chúa Trời là Đấng nhận phần mười; được kết hợp tự nhiên với động từ “dâng” trong tiếng Việt.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: hòn đá này, là hòn đá tôi đã dựng
  rationale: Làm rõ đại từ quan hệ trong tiếng Việt và diễn đạt hành động đặt hòn đá theo tư thế dựng đứng.
theological_decisions:
- issue: Bản chất lời khấn của Gia-cốp về hòn đá
  choice: Giữ nguyên lời tuyên bố rằng hòn đá “sẽ là nhà của Đức Chúa Trời”, hiểu trong mạch văn là địa điểm hay dấu tích thánh gắn với cuộc gặp Đức Chúa Trời.
  alternative: Diễn giải hòn đá là một đền miếu, hoặc coi đây là lời tiên báo trực tiếp về đền thờ về sau.
  rationale: Nguyên văn gắn hòn đá với “nhà của Đức Chúa Trời” nhưng không giải thích cơ chế hay đưa vào thần học đền thờ thời kỳ sau; bản dịch giữ nguyên độ căng và không mở rộng.
- issue: Cách diễn đạt một phần mười
  choice: Trình bày đây là lời hứa dâng cho Đức Chúa Trời một phần mười trong mọi điều Ngài ban, đồng thời giữ sắc thái nhấn mạnh.
  alternative: Dùng thuật ngữ định chế “dâng phần mười” theo luật pháp Môi-se hoặc thực hành hội thánh về sau.
  rationale: Câu này ghi lại lời khấn riêng của Gia-cốp trước thời luật pháp Môi-se; bản dịch không áp đặt cơ cấu tôn giáo phát triển về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ kính ngữ “Ngài”; tránh thuật ngữ giáo hội mang tính định chế. Hai dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong chính văn.
