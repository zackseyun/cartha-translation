revisions:
- from: Và hòn đá này, là hòn đá tôi đã dựng làm trụ, sẽ là nhà của Đức Chúa Trời[a]; trong mọi điều Ngài ban cho tôi, tôi chắc chắn sẽ dâng Ngài một phần mười[b].
  to: Hòn đá này mà tôi đã dựng làm trụ đá sẽ là nhà của Đức Chúa Trời[a]; từ mọi điều Ngài ban cho tôi, tôi nhất định sẽ dâng cho Ngài một phần mười[b].
