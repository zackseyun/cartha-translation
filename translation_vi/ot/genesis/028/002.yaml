revisions:
- from: Hãy đứng dậy, đi đến Pha-đan A-ram, đến nhà Bê-tu-ên, cha của mẹ con, và từ đó hãy cưới một người vợ trong số các con gái của La-ban, anh của mẹ con.[a]
  to: Hãy đứng dậy, đi đến Pha-đan A-ram, đến nhà Bê-tu-ên, cha của mẹ con, và từ đó hãy cưới một người vợ trong số các con gái của La-ban, anh em trai của mẹ con.[a]
  rationale: Chỉ thay “anh của mẹ con” bằng “anh em trai của mẹ con” để không xác định La-ban là anh lớn hay em trai của mẹ. Các thành phần khác của bản dịch phản ánh đầy đủ và tự nhiên nội dung nguyên ngữ, kể cả ý “từ đó” và ngữ cảnh lấy vợ.
