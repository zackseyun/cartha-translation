base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: vi
  text: Hãy đứng dậy, đi đến Pha-đan A-ram, đến nhà Bê-tu-ên, cha của mẹ con, và từ đó hãy cưới một người vợ trong số các con gái của La-ban, anh em trai của mẹ con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Có thể diễn đạt gọn hơn: “ông ngoại con” và “cậu con.” Chính văn giữ rõ hơn cách gọi quan hệ thân tộc của tiếng Hê-bơ-rơ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh của קום, diễn tả việc đứng dậy để bắt đầu hành động; cách nói này tự nhiên trong tiếng Việt hiện đại và vẫn giữ sắc thái mệnh lệnh.
- source_word: לֵךְ֙
  choice: đi
  rationale: Mệnh lệnh thông dụng của הלך; “đi” là cách dịch trực tiếp và tự nhiên.
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: đến Pha-đan A-ram
  rationale: Địa danh được phiên âm; đuôi chỉ hướng được thể hiện bằng “đến”.
- source_word: בֵּ֥יתָ/ה בְתוּאֵ֖ל
  choice: đến nhà Bê-tu-ên
  rationale: בַּיִת ở dạng liên kết và có yếu tố chỉ hướng, nói đến nhà hoặc gia đình của Bê-tu-ên như điểm đến.
- source_word: אֲבִ֣י אִמֶּ֑/ךָ
  choice: cha của mẹ con
  rationale: Giữ rõ cấu trúc thân tộc nguyên văn “cha của mẹ con” thay vì chuyển ngay thành “ông ngoại”.
- source_word: וְ/קַח לְ/ךָ֤
  choice: và ... hãy cưới
  rationale: לקח theo nghĩa đen là “lấy”, nhưng trong ngữ cảnh chọn một người làm vợ, “cưới” truyền đạt tự nhiên hành động được yêu cầu; sắc thái vì chính mình của לְךָ đã hàm chứa trong việc cưới vợ.
- source_word: מִ/שָּׁם֙
  choice: từ đó
  rationale: Giữ giới từ מִן và ý nghĩa xuất xứ rõ ràng.
- source_word: אִשָּׁ֔ה
  choice: một người vợ
  rationale: Trong ngữ cảnh hôn nhân, אִשָּׁה mang nghĩa “vợ”, không chỉ chung là “người phụ nữ”.
- source_word: מִ/בְּנ֥וֹת לָבָ֖ן
  choice: trong số các con gái của La-ban
  rationale: 'Diễn đạt tự nhiên sắc thái phân chọn của מִן: chọn một người trong số các con gái của La-ban.'
- source_word: אֲחִ֥י אִמֶּֽ/ךָ
  choice: anh của mẹ con
  rationale: Giữ biểu thức thân tộc cụ thể của tiếng Hê-bơ-rơ. Tiếng Việt buộc phải chọn “anh” hoặc “em”; ngữ cảnh gia phả cho thấy La-ban là anh của Rê-bê-ca.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng vừa phải, rõ và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “con” theo lời người cha nói với con trai. Tên riêng được phiên âm theo lối quen thuộc trong các bản Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt sau toàn bộ các cách gọi thân tộc mà chú thích giải thích.
