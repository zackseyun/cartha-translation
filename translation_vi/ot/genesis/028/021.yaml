  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: vi
  text: và con được bình an trở về nhà cha con[a], thì Yahweh sẽ là Đức Chúa Trời của con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và con được an toàn trở về nhà cha con.” Cụm từ Hê-bơ-rơ “bình an” cũng có thể nhấn mạnh việc trở về an toàn hoặc trong tình trạng an lành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: và con trở về
  rationale: Động từ שׁוב có nghĩa là “trở về”; trong chuỗi điều kiện của lời khấn, tiếng Việt dùng dạng không đánh dấu thì để diễn tả hành động hướng tới tương lai. Đại từ “con” phù hợp với lời Gia-cốp thưa cùng Đức Chúa Trời trong ngữ cảnh.
- source_word: בְשָׁלוֹם
  choice: bình an
  rationale: שָׁלוֹם bao hàm sự bình an, an toàn và nguyên vẹn; “bình an” giữ được độ rộng nghĩa, còn sắc thái trở về an toàn được nêu trong chú thích.
- source_word: אֶל בֵּית אָבִי
  choice: đến nhà cha con
  rationale: Cách dịch tự nhiên của cụm cấu trúc sở hữu, giữ cả ý nơi ở lẫn gia đình thuộc nhà cha.
- source_word: וְהָיָה
  choice: thì ... sẽ là
  rationale: Dù וְ là liên từ “và”, mệnh đề này nằm trong cấu trúc lời khấn có điều kiện bắt đầu ở câu trước; “thì” biểu thị quan hệ hệ quả tự nhiên trong tiếng Việt mà không xóa căng thẳng thần học của câu.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng יהוה đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: לִי לֵאלֹהִים
  choice: là Đức Chúa Trời của con
  rationale: Cụm Hê-bơ-rơ nghĩa đen là “làm Đức Chúa Trời cho con”; cách diễn đạt sở hữu trong tiếng Việt truyền đạt tự nhiên quan hệ và sự quy phục được nói đến.
theological_decisions:
- issue: Lời Gia-cốp là sự chấp nhận Đức Giê-hô-va có điều kiện hay một lời xác nhận vô điều kiện
  choice: Giữ lực điều kiện–hệ quả bằng từ “thì” trong mạch lời khấn.
  alternative: Dịch đơn thuần “và Đức Giê-hô-va sẽ là Đức Chúa Trời của con”, làm nhẹ quan hệ với các điều kiện ở câu trước.
  rationale: Câu Hê-bơ-rơ tiếp nối lời khấn bắt đầu bằng אִם ở câu 20. Cách dịch không phân xử động cơ hay mức độ đức tin của Gia-cốp, nhưng bảo toàn sự căng thẳng vốn có trong cú pháp và ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; duy trì ngôi “con” theo lời cầu khấn trong ngữ cảnh. Dùng “Đức Giê-hô-va” cho danh יהוה và “Đức Chúa Trời” cho אֱלֹהִים. Dấu chú thích [a] được đặt ngay sau cụm liên quan.
