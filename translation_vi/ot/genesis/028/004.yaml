  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: vi
  text: Nguyện Ngài ban cho con phước lành của Áp-ra-ham, cho con và dòng dõi con cùng với con, để con chiếm hữu[a] miền đất nơi con đang kiều ngụ, là đất Đức Chúa Trời đã ban cho Áp-ra-ham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để con thừa hưởng miền đất nơi con kiều ngụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Nguyện Ngài ban
  rationale: Thể ý nguyện trong lời chúc phước được diễn đạt tự nhiên bằng “Nguyện Ngài ban”; liên từ וְ được hòa vào mạch lời chúc thay vì dịch máy móc.
- source_word: בִּרְכַּת אַבְרָהָם
  choice: phước lành của Áp-ra-ham
  rationale: Giữ nguyên cấu trúc sở hữu và âm hưởng giao ước của lời hứa dành cho Áp-ra-ham.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: cho con và dòng dõi con cùng với con
  rationale: “Dòng dõi” diễn đạt danh từ số ít mang nghĩa tập thể זֶרַע một cách tự nhiên trong tiếng Việt; “cùng với con” được giữ lại vì có mặt rõ ràng trong tiếng Hê-bơ-rơ.
- source_word: לְרִשְׁתְּךָ
  choice: để con chiếm hữu
  rationale: Cấu trúc nguyên mẫu với לְ chỉ mục đích hoặc kết quả; “chiếm hữu” giữ nghĩa đi vào quyền sở hữu mà không buộc phải hiểu riêng theo nét nghĩa thừa kế.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: miền đất nơi con đang kiều ngụ
  rationale: מָגוּר nói đến việc cư trú như ngoại kiều hoặc người tạm trú. Cách dịch này rõ nghĩa hơn lối danh hóa sát chữ nhưng vẫn giữ mô-típ các tổ phụ sống kiều ngụ trong đất hứa.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: là đất Đức Chúa Trời đã ban cho Áp-ra-ham
  rationale: Diễn đạt mệnh đề quan hệ tự nhiên trong tiếng Việt và dịch אֱלֹהִים theo cách gọi trang trọng, quen thuộc trong văn mạch Kinh Thánh.
theological_decisions:
- issue: Sắc thái giao ước trong lời hứa với Áp-ra-ham
  choice: Giữ nguyên “phước lành của Áp-ra-ham” và ngôn ngữ chiếm hữu đất.
  alternative: Diễn giải thành “phước lành đã được hứa cho Áp-ra-ham” hoặc dùng “thừa hưởng miền đất”.
  rationale: Nguyên văn trực tiếp gắn lời chúc phước cho Gia-cốp với lời hứa dành cho Áp-ra-ham. Bản dịch bảo toàn mối liên hệ ấy nhưng không thêm từ “đã được hứa”; “chiếm hữu” giữ nét nghĩa trực tiếp của ירש, trong khi “thừa hưởng” vẫn là một khả năng diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo quan hệ cha chúc phước cho con; “kiều ngụ” giữ sắc thái cư trú như người ngoại kiều, không đơn thuần là lang thang.
