  to: Nguyện Ngài ban cho con phước lành của Áp-ra-ham, cho con và dòng dõi con cùng với con, để con chiếm hữu[a] miền đất nơi con đang kiều ngụ, là đất Đức Chúa Trời đã ban cho Áp-ra-ham.
