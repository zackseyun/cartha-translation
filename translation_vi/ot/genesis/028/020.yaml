base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: vi
  text: 'Gia-cốp khấn nguyện rằng: “Nếu Đức Chúa Trời ở cùng tôi, gìn giữ tôi trên con đường này tôi đang đi, ban cho tôi bánh để ăn và y phục để mặc,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: Gia-cốp lập một lời thề nguyện
  rationale: Cấu trúc động từ–danh từ đồng gốc nhấn mạnh hành vi thề nguyện trang trọng; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ danh từ được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dẫn trực tiếp nội dung lời thề nguyện một cách tự nhiên trong tiếng Việt.
- source_word: אִם
  choice: Nếu
  rationale: Giữ nguyên hình thức điều kiện của nguyên văn, không chuyển thành ‘khi’ hoặc ‘vì’ để tránh giải quyết thay người đọc sắc thái thần học.
- source_word: אֱלֹהִים עִמָּדִי
  choice: Đức Chúa Trời ở cùng tôi
  rationale: Ngữ cảnh chỉ về Đức Chúa Trời đã hiện ra với Gia-cốp; ‘ở cùng tôi’ truyền đạt trực tiếp ý về sự hiện diện.
- source_word: וּשְׁמָרַנִי
  choice: gìn giữ tôi
  rationale: שׁמר mang nghĩa gìn giữ, bảo vệ hoặc trông nom; ‘gìn giữ’ vừa trang trọng vừa tự nhiên và giữ được phạm vi nghĩa rộng.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: trên đường tôi đang đi
  rationale: Giữ hình ảnh ‘đường’ và hành động đang diễn ra trong nguyên văn, đồng thời tránh lối nói nặng nề ‘trên con đường này mà tôi đang đi’.
- source_word: וְנָתַן לִי לֶחֶם לֶאֱכֹל
  choice: ban cho tôi bánh ăn
  rationale: Giữ từ cụ thể ‘bánh’ của nguyên văn và diễn đạt tự nhiên quan hệ giữa vật được ban với mục đích ăn.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: và áo mặc
  rationale: Diễn đạt cô đọng và tự nhiên trong tiếng Việt, tương ứng trực tiếp với ‘y phục để mặc’.
theological_decisions:
- issue: Tính chất điều kiện trong lời thề nguyện của Gia-cốp
  choice: Dùng ‘Nếu’ theo אִם
  alternative: ‘Khi Đức Chúa Trời ở cùng tôi’ hoặc ‘Vì Đức Chúa Trời sẽ ở cùng tôi’
  rationale: Nguyên văn trình bày một mệnh đề điều kiện. Bản dịch giữ sự căng thẳng giữa lòng tin và tính điều kiện trong lời Gia-cốp, không diễn giải thành chắc chắn hay hoài nghi.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘Gia-cốp’ và ‘Đức Chúa Trời’ theo lối gọi quen thuộc trong văn bản Kinh Thánh tiếng Việt. Câu kết bằng dấu phẩy vì lời thề nguyện còn tiếp tục sang câu sau.
