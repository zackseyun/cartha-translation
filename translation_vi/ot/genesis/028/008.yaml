  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: vi
  text: Ê-sau thấy rằng các con gái Ca-na-an không đẹp lòng cha mình là Y-sác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát chữ: “là xấu/tệ trong mắt cha mình là Y-sác.” Tính từ Hê-bơ-rơ cũng có thể mang nghĩa “ác”; trong ngữ cảnh này, cụm từ có lẽ nói đến việc Y-sác không tán thành các phụ nữ Ca-na-an làm vợ cho Ê-sau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Giữ nghĩa thông thường của ראה và nhịp kể chuyện; trong ngữ cảnh, người đọc có thể hiểu đây cũng là sự nhận ra.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: כִּי
  choice: rằng
  rationale: Ở đây כִּי mở đầu nội dung điều Ê-sau thấy/nhận biết, không phải một mệnh đề chỉ nguyên nhân.
- source_word: רָעוֹת
  choice: là điều xấu
  rationale: Phản ánh trực tiếp tính từ Hê-bơ-rơ mang nghĩa “xấu/tệ/ác”, đồng thời kết hợp tự nhiên với thành ngữ “trong mắt”; số nhiều giống cái phù hợp với chủ thể tập hợp nhưng tiếng Việt không cần đánh dấu số hay giống.
- source_word: בְּנוֹת כְּנָעַן
  choice: các con gái Ca-na-an
  rationale: Giữ sát cách diễn đạt mang tính gia tộc-dân tộc của nguyên văn; trong ngữ cảnh, cụm này chỉ những phụ nữ Ca-na-an.
- source_word: בְּעֵינֵי
  choice: trong mắt
  rationale: Bảo tồn thành ngữ Hê-bơ-rơ chỉ sự đánh giá hay quan điểm; cách nói này vẫn rõ và tự nhiên trong tiếng Việt.
- source_word: יִצְחָק אָבִיו
  choice: cha mình là Y-sác
  rationale: Diễn đạt rõ quan hệ sở hữu của אָבִיו và nhận diện người cha là Y-sác, theo trật tự tự nhiên của tiếng Việt.
