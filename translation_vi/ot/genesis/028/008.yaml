revisions:
- from: Ê-sau thấy rằng các con gái Ca-na-an là điều xấu trong mắt cha mình là Y-sác.[a]
  to: Ê-sau thấy rằng các con gái Ca-na-an không đẹp lòng cha mình là Y-sác.[a]
  rationale: Sửa vị ngữ để chủ thể “các con gái Ca-na-an” được mô tả đúng theo cú pháp Hê-bơ-rơ và để câu tiếng Việt tự nhiên. “Không đẹp lòng” là cách chuyển ngữ thành ngữ đánh giá “xấu trong mắt của” trong ngữ cảnh Y-sác không tán thành hôn nhân; chú thích bảo lưu nghĩa sát chữ và khả năng từ vựng “ác” mà không biến nó thành khẳng định chính văn.
