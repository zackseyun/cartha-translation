id: GEN.28.3
reference: Genesis 28:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: vi
  text: Nguyện Đức Chúa Trời Toàn Năng[a] ban phước cho con, làm cho con sinh sôi và trở nên đông đảo, để con trở thành một cộng đồng gồm nhiều dân tộc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “El Shaddai”; theo truyền thống được dịch là “Đức Chúa Trời Toàn Năng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  rationale: Dịch tước hiệu thần linh theo nghĩa quen thuộc trong tiếng Việt, đồng thời giữ dạng Hê-bơ-rơ “El Shaddai” trong chú thích vì nghĩa nguyên thủy của שַׁדַּי không hoàn toàn chắc chắn.
- source_word: יְבָרֵךְ
  choice: nguyện ... ban phước
  rationale: Thể vị lai ở đây mang sắc thái cầu chúc; cấu trúc “Nguyện ...” diễn đạt tự nhiên lời chúc phước của Y-sác dành cho Gia-cốp.
- source_word: וְיַפְרְךָ
  choice: làm cho con sinh sôi
  rationale: Dạng Hiphil của פרה có nghĩa khiến trở nên sinh sản, sinh hoa kết quả; “sinh sôi” tự nhiên trong ngữ cảnh lời hứa về dòng dõi.
- source_word: וְיַרְבֶּךָ
  choice: làm cho con ... trở nên đông đảo
  rationale: Dạng Hiphil của רבה chỉ việc làm gia tăng số lượng, đặc biệt là dòng dõi; cách dịch này giữ nghĩa gây khiến mà không dùng lối diễn đạt gượng ép.
- source_word: וְהָיִיתָ
  choice: để con trở thành
  rationale: Trong chuỗi lời chúc phước, mệnh đề này nêu kết quả hoặc mục tiêu của việc sinh sôi và gia tăng; “để” truyền đạt quan hệ ấy tự nhiên nhưng không khẳng định quá mức đó chỉ là mục đích.
- source_word: לִקְהַל עַמִּים
  choice: một cộng đồng gồm nhiều dân tộc
  rationale: קהל là một tập thể hay cộng đồng tụ họp; עַמִּים ở số nhiều được giữ bằng “nhiều dân tộc”, tránh làm thành chỉ một đám đông cá nhân.
theological_decisions:
- issue: Cách dịch tước hiệu אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  alternative: El Shaddai
  rationale: Dùng cách dịch tước hiệu đã quen thuộc và dễ hiểu trong phần chính, nhưng ghi dạng phiên âm ở chú thích để bảo tồn hình thức Hê-bơ-rơ và sự không chắc chắn về từ nguyên.
- issue: Quan hệ của וְהָיִיתָ với các lời chúc trước đó
  choice: để con trở thành
  alternative: và con sẽ trở thành
  rationale: Ngữ cảnh lời chúc cho phép hiểu đây là kết quả hoặc mục tiêu. Bản dịch chọn cách diễn đạt kết quả tự nhiên, nhưng không mở rộng thành một khẳng định thần học vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Nguyện” duy trì sắc thái cầu chúc; đại từ “con” phù hợp lời người cha chúc phước cho con trai. Cấu trúc “một cộng đồng gồm nhiều dân tộc” giữ số nhiều của עַמִּים mà vẫn tự nhiên trong tiếng Việt.
