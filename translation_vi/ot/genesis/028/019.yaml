source:
  edition: WLC
  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֵּֽית אֵ֑ל וְ/אוּלָ֛ם ל֥וּז שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/019.yaml
  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: vi
  text: Ông gọi nơi ấy là Bê-tên[a], nhưng trước kia thành ấy có tên là Lu-xơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bê-tên nghĩa là “nhà của Đức Chúa Trời.”
    reason: Giải thích ý nghĩa của địa danh Híp-ri בֵּית אֵל.
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: Ông gọi ... là
  rationale: Cụm Híp-ri theo sát nghĩa là “ông gọi tên”; trong tiếng Việt hiện đại, cấu trúc “gọi ... là” diễn đạt hành động đặt tên tự nhiên, rõ ràng mà vẫn giữ nội dung của động từ קרא.
- source_word: הַמָּקוֹם הַהוּא
  choice: nơi ấy
  rationale: Diễn đạt đầy đủ danh từ מקום và từ chỉ định ההוא bằng lối văn trang trọng, tự nhiên.
- source_word: בֵּית אֵל
  choice: Bê-tên
  rationale: Giữ địa danh dưới dạng phiên âm quen thuộc trong tiếng Việt; ý nghĩa cấu tạo của tên được nêu ở chú thích.
- source_word: וְאוּלָם
  choice: nhưng
  rationale: Thể hiện rõ sắc thái tương phản giữa tên mới của nơi ấy và tên trước kia của thành.
- source_word: לוּז
  choice: Lu-xơ
  rationale: Phiên âm địa danh Híp-ri theo cách đọc tự nhiên và quen dùng trong tiếng Việt.
- source_word: שֵׁם הָעִיר
  choice: thành ấy có tên
  rationale: Chuyển cấu trúc “tên của thành” sang cú pháp tiếng Việt tự nhiên, đồng thời giữ rõ đối tượng là thành.
- source_word: לָרִאשֹׁנָה
  choice: trước kia
  rationale: Trong ngữ cảnh, từ này chỉ tên gọi có từ trước; “trước kia” sáng rõ và tự nhiên hơn cách dịch sát chữ “lúc đầu”.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể là Gia-cốp đã rõ từ văn cảnh; giữ sự phân biệt trong nguyên văn giữa “nơi ấy” và “thành ấy”.
