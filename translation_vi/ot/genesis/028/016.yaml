base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: vi
  text: 'Gia-cốp tỉnh giấc, rồi nói: “Quả thật[a], Yahweh ở nơi này, còn tôi đã không biết!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Quả thật” diễn tả sự chợt nhận ra và xác tín của Gia-cốp rằng Yahweh đang ở chính nơi ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: tỉnh giấc
  rationale: Động từ chỉ việc thức dậy sau khi ngủ; “tỉnh giấc” tự nhiên, trang trọng vừa phải và hợp với văn kể chuyện.
- source_word: מִשְּׁנָתוֹ
  choice: tỉnh giấc
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “thức dậy khỏi giấc ngủ của mình”; tiếng Việt diễn đạt tự nhiên bằng “tỉnh giấc” mà không cần lặp ý “khỏi giấc ngủ”.
- source_word: אָכֵן
  choice: quả thật
  rationale: Tiểu từ nhấn mạnh sự xác nhận và nhận ra đột ngột; “quả thật” giữ được sắc thái kinh ngạc của Gia-cốp.
- source_word: יֵשׁ
  choice: ở
  rationale: Tiểu từ hiện hữu diễn tả sự hiện diện. “Yahweh ở tại nơi này” vừa tự nhiên trong tiếng Việt vừa không diễn giải quá mức.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: tại nơi này
  rationale: Chỉ chính địa điểm Gia-cốp đã nằm ngủ và nhận khải tượng; cách diễn đạt này rõ ràng và tự nhiên.
- source_word: וְאָנֹכִי
  choice: thế mà tôi
  rationale: Đại từ độc lập אָנֹכִי tạo sự nhấn mạnh, còn liên từ וְ trong ngữ cảnh biểu thị sự tương phản giữa sự hiện diện của Yahweh và sự không hay biết trước đó của Gia-cốp.
- source_word: לֹא יָדָעְתִּי
  choice: tôi không biết
  rationale: Dạng hoàn thành nói đến tình trạng không hay biết của Gia-cốp cho đến lúc tỉnh dậy; tiếng Việt không cần thêm một tân ngữ như “điều đó”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” bảo tồn tư cách tên riêng và tránh thay thế bằng tước hiệu.
- issue: Ý nghĩa sự hiện diện của Yahweh tại địa điểm này
  choice: “Yahweh ở tại nơi này”
  alternative: “Yahweh hiện diện đặc biệt tại nơi này”
  rationale: Bản dịch giữ lời khẳng định ngắn gọn của nguyên văn, không xác định thêm bản chất hay mức độ của sự hiện diện.
translation_notes:
  register: Văn phong kể chuyện hiện đại, sáng rõ và trang nghiêm. “Tỉnh giấc” tránh lối diễn đạt nặng tính dịch từng chữ; “thế mà tôi” làm rõ nét tương phản vốn có trong câu mà không thay đổi nội dung.
