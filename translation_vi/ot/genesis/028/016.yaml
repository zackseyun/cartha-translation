- from: 'Gia-cốp tỉnh giấc và nói: “Quả thật[a], Yahweh ở tại nơi này, thế mà tôi không biết!”'
  to: 'Gia-cốp tỉnh giấc, rồi nói: “Quả thật[a], Yahweh ở nơi này, còn tôi đã không biết!”'
