  text: וַ/יֵּצֵ֥א יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יֵּ֖לֶךְ חָרָֽנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/010.yaml
  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: vi
  text: Gia-cốp rời Bê-e-sê-ba và đi về phía Ha-ran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ có nghĩa là “đến/về phía Ha-ran”; tên “Ha-ran” mang đuôi chỉ hướng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: rời
  rationale: Động từ יצא diễn tả việc đi ra hoặc rời khỏi một nơi; “rời” tự nhiên trong tiếng Việt và phù hợp với cụm chỉ nơi xuất phát theo sau.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: מִבְּאֵר שָׁבַע
  choice: Bê-e-sê-ba
  rationale: Giới từ מִן, được đồng hóa thành מִ־, chỉ nơi xuất phát; địa danh בְּאֵר שֶׁבַע được phiên âm theo cách quen thuộc trong tiếng Việt.
- source_word: וַיֵּלֶךְ
  choice: đi
  rationale: הלך là động từ thông dụng chỉ sự đi lại; “đi” là cách dịch trực tiếp, không thêm sắc thái hành trình vốn không được nêu rõ.
- source_word: חָרָנָה
  choice: về phía Ha-ran
  rationale: Đuôi ה chỉ hướng gắn với địa danh biểu thị chuyển động hướng đến Ha-ran. “Về phía” giữ được sắc thái hướng đích mà không khẳng định trong chính động từ rằng Gia-cốp đã tới nơi.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. Các địa danh và tên người dùng dạng phiên âm quen thuộc; cấu trúc câu bám sát hai động tác nối tiếp trong tiếng Hê-bơ-rơ.
