- from: 'Kìa, Đức Giê-hô-va đứng phía trên nó[a] và phán: “Ta là Đức Giê-hô-va, Đức Chúa Trời của Áp-ra-ham, tổ phụ con, và là Đức Chúa Trời của Y-sác. Đất mà con đang nằm trên đó, Ta sẽ ban cho con và dòng dõi con[b].”'
  to: 'Kìa, Yahweh đứng phía trên nó[a] và phán: “Ta là Yahweh, Đức Chúa Trời của Áp-ra-ham, cha con, và là Đức Chúa Trời của Y-sác. Đất con đang nằm trên đó, Ta sẽ ban cho con và dòng dõi con[b].”'
  rationale: Bản sửa tuân theo cách chuyển Danh Thánh của nguồn là “Yahweh”, giảm diễn giải ở cụm chỉ Áp-ra-ham là “cha” của Gia-cốp, và làm câu tiếng Việt gọn tự nhiên hơn. Chú thích a tiếp tục bảo lưu sự bất định có tranh luận về đối tượng của đại từ עָלָיו; chú thích b được chỉnh ngữ pháp tiếng Việt và vẫn giải thích nghĩa tập hợp của זֶרַע.
  reviewer_model: gpt-5.6-terra
