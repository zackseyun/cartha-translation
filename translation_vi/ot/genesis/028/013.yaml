  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: vi
  text: 'Kìa, Yahweh đứng phía trên nó[a] và phán: “Ta là Yahweh, Đức Chúa Trời của Áp-ra-ham, cha con, và là Đức Chúa Trời của Y-sác. Đất con đang nằm trên đó, Ta sẽ ban cho con và dòng dõi con[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đứng bên cạnh ông” hoặc “đứng phía trên ông”, nếu đại từ chỉ về Gia-cốp thay vì chiếc thang.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “hạt giống của con”; từ Hê-bơ-rơ này là danh từ tập hợp, chỉ dòng dõi hoặc hậu duệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ sắc thái trình hiện sống động của tiểu từ Hê-bơ-rơ trong lời thuật, với cách diễn đạt trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho Danh Thánh, thay vì thay thế bằng một tước hiệu; yếu tố “Đức” phù hợp quy ước kính xưng tiếng Việt.
- source_word: נִצָּב
  choice: đứng
  rationale: Phân từ diễn tả tư thế đang hiện hữu trong khải tượng; tiếng Việt tự nhiên không cần thêm “đang” trong ngữ cảnh này.
- source_word: עָלָיו
  choice: phía trên nó
  rationale: Đại từ giống đực số ít có thể quy chiếu về chiếc thang trong câu trước; “phía trên nó” giữ cách hiểu ấy mà không hàm ý nhất thiết đứng trên đỉnh. Khả năng quy chiếu về Gia-cốp được ghi chú.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Đức Chúa Trời của Áp-ra-ham, tổ phụ con
  rationale: “Tổ phụ” diễn đạt tự nhiên việc Áp-ra-ham là bậc cha ông của Gia-cốp, tránh khiến độc giả hiểu ông là cha ruột, đồng thời giữ quan hệ bổ nghĩa của nguyên văn.
- source_word: הָאָרֶץ אֲשֶׁר אַתָּה שֹׁכֵב עָלֶיהָ
  choice: Đất mà con đang nằm trên đó
  rationale: “Đất” phù hợp ngữ cảnh lời hứa về xứ sở; “đang nằm” thể hiện hành động đang tiếp diễn của phân từ.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: Ta sẽ ban cho con
  rationale: Thể chưa hoàn thành trong ngữ cảnh lời hứa được diễn đạt bằng tương lai; “ban” tự nhiên và trang trọng khi Đức Chúa Trời là chủ thể.
- source_word: וּלְזַרְעֶךָ
  choice: và dòng dõi con
  rationale: “Dòng dõi” là cách diễn đạt tự nhiên trong tiếng Việt cho danh từ tập hợp זֶרַע, bao gồm hậu duệ như một tập thể.
theological_decisions:
- issue: Cách chuyển dịch Danh Thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Hằng Hữu; CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh Thánh. Bản dịch giữ tên riêng thay vì thay bằng tước hiệu; “Giê-hô-va” là dạng đã quen thuộc và dễ nhận biết trong tiếng Việt.
- issue: Đối tượng được עָלָיו quy chiếu
  choice: phía trên nó, tức phía trên chiếc thang
  alternative: bên cạnh người; phía trên người, tức Gia-cốp
  rationale: Danh từ giống đực số ít gần nhất trong văn cảnh là chiếc thang, nên chọn cách quy chiếu này. Tuy nhiên, hình thái đại từ không tự nó quyết định đối tượng, vì vậy giữ cách hiểu liên quan đến Gia-cốp trong chú thích.
- issue: Quan hệ của Áp-ra-ham với Gia-cốp trong אָבִיךָ
  choice: tổ phụ con
  alternative: cha con
  rationale: אָב có thể chỉ tổ tiên, không chỉ cha ruột. “Tổ phụ” truyền đạt đúng quan hệ phả hệ trong ngữ cảnh mà không xóa bỏ ý niệm Áp-ra-ham là “cha” theo nghĩa tổ tiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; dùng đại từ “Ta–con” trong lời phán của Đức Chúa Trời. Giữ “Kìa” để tái hiện tính sống động của lời thuật. Các tên riêng theo dạng phiên âm quen dùng trong truyền thống Kinh Thánh tiếng Việt.
