    rationale: אָבִיךָ có thể mang nghĩa tổ tiên trong văn cảnh, nhưng nguyên văn vẫn dùng từ “cha”; “tổ phụ” xác định nghĩa này hơn mức cần thiết. Cách “Áp-ra-ham, cha con” giữ sự căng thẳng ngữ nghĩa của nguồn.
  - severity: low
    issue: Cụm “Đất mà con đang nằm trên đó” có phần nặng trong tiếng Việt hiện đại.
    rationale: Có thể bỏ “mà” mà vẫn giữ đầy đủ quan hệ không gian và sắc thái phân từ tiếp diễn.
