base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: vi
  text: Sáng sớm, Gia-cốp dậy, lấy hòn đá ông đã đặt bên đầu mình, dựng lên làm một trụ đá[a], rồi đổ dầu trên đỉnh trụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hòn đá dựng đứng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trên đầu nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: Sáng sớm, ... thức dậy
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ rõ ý Gia-cốp dậy sớm vào buổi sáng.
- source_word: הָאֶבֶן
  choice: hòn đá
  rationale: Danh từ xác định số ít; “hòn đá” là cách gọi tự nhiên đối với vật thể cụ thể này.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: ông đã đặt ở phía đầu mình
  rationale: Giữ nghĩa gần với thành ngữ Hê-bơ-rơ chỉ vị trí ở đầu chỗ nằm, không xác quyết rằng hòn đá nằm ngay dưới đầu như một chiếc gối.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: dựng lên làm một trụ đá
  rationale: “Dựng lên” thể hiện hành động đặt hòn đá đứng; “trụ đá” truyền đạt vật thể מַצֵּבָה rõ hơn “cột” đơn thuần.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: đổ dầu
  rationale: Dịch trực tiếp hành động được nói đến, không diễn giải thành “xức dầu,” vốn có thể đưa thêm sắc thái nghi lễ.
- source_word: עַל רֹאשָׁהּ
  choice: trên đỉnh trụ
  rationale: Nghĩa đen là “trên đầu nó”; “trên đỉnh trụ” tự nhiên hơn trong tiếng Việt khi nói về vật vô tri và làm rõ sở chỉ của đại từ giống cái.
theological_decisions:
- issue: Ý nghĩa nghi lễ của מַצֵּבָה và hành động đổ dầu
  choice: Mô tả hành động bằng “trụ đá” và “đổ dầu,” không đánh giá hay giải thích thêm
  alternative: “bia kỷ niệm” hoặc “xức dầu cho trụ đá”
  rationale: Bản văn chỉ thuật lại việc Gia-cốp dựng hòn đá và đổ dầu lên đó. Cách dịch mô tả bảo toàn sắc thái của câu chuyện mà không áp đặt cách đánh giá từ những phân đoạn khác hoặc một cách hiểu hệ phái.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Chuỗi hành động được trình bày gọn, giữ nhịp nhanh của các động từ nối tiếp trong tiếng Hê-bơ-rơ. Dùng “Gia-cốp” theo hình thức tên riêng quen thuộc trong tiếng Việt.
