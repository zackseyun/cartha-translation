  rationale: Chỉ điều chỉnh hai chỗ nhỏ để câu tự nhiên hơn và để động từ mở đầu phản ánh chính xác hơn hành động ‘dậy sớm’ của nguyên ngữ. Các lựa chọn còn lại được giữ nguyên, gồm cách dịch mô tả “trụ đá” và “đổ dầu.”
