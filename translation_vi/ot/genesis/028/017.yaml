base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: vi
  text: 'Ông sợ hãi và nói: “Nơi này thật đáng kính sợ biết bao![a] Nơi này không gì khác hơn là nhà của Đức Chúa Trời, và đây là cổng trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nơi này đáng sợ biết bao!” Từ Hê-bơ-rơ có thể diễn tả nỗi sợ, sự kinh hãi hoặc lòng kính sợ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: Ông sợ hãi
  rationale: Động từ ירא diễn tả phản ứng sợ hãi của Gia-cốp; cách dịch này tự nhiên trong tiếng Việt và không thu hẹp ý nghĩa thành lòng tôn kính בלבד.
- source_word: מַה נּוֹרָא
  choice: thật đáng kính sợ biết bao
  rationale: נוֹרָא có thể gợi cả nỗi sợ lẫn lòng kính畏 trước sự hiện diện thiêng liêng. Cụm này giữ được hai sắc thái ấy, còn cấu trúc cảm thán diễn đạt מַה.
- source_word: הַמָּקוֹם הַזֶּה
  choice: nơi này
  rationale: Cách diễn đạt trực tiếp, tự nhiên của cụm danh từ có đại từ chỉ định.
- source_word: אֵין זֶה כִּי אִם
  choice: Đây chẳng phải nơi nào khác mà chính là
  rationale: Diễn đạt sự xác định mang tính hạn định và nhấn mạnh của thành ngữ Hê-bơ-rơ, đồng thời giữ giọng trang trọng.
- source_word: בֵּית אֱלֹהִים
  choice: nhà của Đức Chúa Trời
  rationale: Giữ hình ảnh 'nhà' và sắc thái thiêng liêng của cụm từ nguyên ngữ, nhưng không ngụ ý rằng tại đây đã có một đền thờ được xây dựng.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: cổng trời
  rationale: Cách nói gọn, tự nhiên trong tiếng Việt, giữ hình ảnh cánh cổng nối nơi trần thế với cõi trời.
theological_decisions:
- issue: Sắc thái của נוֹרָא trong bối cảnh thiêng liêng
  choice: đáng kính sợ
  alternative: đáng sợ; uy nghiêm
  rationale: Bản dịch giữ sự căng thẳng giữa nỗi sợ và lòng kính畏 trước sự hiện diện của Đức Chúa Trời, thay vì biến câu này thành sự kinh hãi đơn thuần hoặc ngưỡng mộ chung chung.
- issue: Cách hiểu אֱלֹהִים trong ngữ cảnh quy chiếu số ít
  choice: Đức Chúa Trời
  alternative: các thần
  rationale: Dù hình thức từ có dạng số nhiều, văn cảnh về khải tượng và giao ước của Gia-cốp xác định rõ một chủ thể duy nhất.
- issue: Ý nghĩa của 'nhà của Đức Chúa Trời'
  choice: giữ nguyên hình ảnh 'nhà'
  alternative: đền thờ của Đức Chúa Trời
  rationale: Nguyên văn nói 'nhà', không nói một công trình đền thờ đã hình thành; cách dịch này giữ hình ảnh và không đưa diễn tiến thần học về sau vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đáng kính sợ” để bảo toàn sắc thái vừa sợ hãi vừa tôn kính; dùng “cổng trời” theo cách nói tự nhiên của tiếng Việt. Mọi ký hiệu chú thích đều có mặt trong chính văn.
