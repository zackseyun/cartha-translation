    rationale: מִשָּׁם có nghĩa là “từ đó”; ở đây nêu nguồn gốc/xuất xứ của người vợ, không chỉ địa điểm thực hiện cuộc hôn nhân.
  - severity: low
    issue: Điểm neo chú thích cần gắn với cụm được giải thích
    rationale: Chú thích giải thích “các con gái Ca-na-an”/“phụ nữ Ca-na-an”; đặt dấu [a] ngay sau “Ca-na-an” bảo đảm liên kết rõ ràng.
