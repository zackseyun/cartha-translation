id: GEN.28.6
reference: Genesis 28:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: vi
  text: 'Ê-sau thấy rằng I-sác đã chúc phước cho Gia-cốp và sai ông đến Pha-đan A-ram để lấy vợ từ đó, và khi chúc phước cho ông, I-sác đã truyền cho ông rằng: “Con không được lấy vợ trong số các con gái Ca-na-an[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong số những phụ nữ Ca-na-an.” Tiếng Hê-bơ-rơ viết sát nghĩa là “trong số các con gái Ca-na-an.”'
    reason: Nêu cách diễn đạt tự nhiên hơn cho thành ngữ chỉ phụ nữ thuộc dân Ca-na-an, trong khi bản văn chính giữ hình thức sát nguyên ngữ.
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: Ê-sau thấy rằng
  rationale: Động từ wayyiqtol tiếp diễn mạch kể chuyện; tiếng Việt không cần thêm một từ chỉ thời gian như “bấy giờ” vì nguyên văn không có từ tương ứng.
- source_word: כִּי בֵרַךְ יִצְחָק אֶת יַעֲקֹב
  choice: I-sác đã chúc phước cho Gia-cốp
  rationale: “Đã” làm rõ việc chúc phước xảy ra trước khi Ê-sau nhận biết, còn “chúc phước” giữ sắc thái trang trọng và ý nghĩa của ברך.
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: và sai ông đến Pha-đan A-ram
  rationale: “Sai” diễn đạt tự nhiên hành động phái đi; “ông” quy chiếu về Gia-cốp theo cú pháp và ngữ cảnh. Địa danh được phiên âm theo lối quen dùng trong tiếng Việt.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: để cưới vợ tại đó
  rationale: Diễn đạt tự nhiên mục đích của chuyến đi. Trong ngữ cảnh hôn nhân, “cưới vợ” truyền đạt đầy đủ ý của “lấy cho mình một người vợ”; “tại đó” giữ thành tố מִשָּׁם.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: Khi chúc phước cho ông
  rationale: Giữ quan hệ thời gian/hoàn cảnh do giới từ בְּ biểu thị.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: I-sác đã truyền rằng
  rationale: “Truyền” giữ lực mệnh lệnh của צוה và phù hợp văn phong trang trọng; lặp lại tên I-sác giúp câu tiếng Việt rõ chủ thể.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: Con không được lấy vợ
  rationale: “Không được” diễn đạt mệnh lệnh cấm ở ngôi thứ hai; “con” tự nhiên trong lời cha nói với con mà không làm giảm lực của lệnh.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: trong số các con gái Ca-na-an
  rationale: Giữ gần hình ảnh nguyên văn “các con gái Ca-na-an”, đồng thời cụm “trong số” diễn đạt giới từ מִן tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu dài của tiếng Hê-bơ-rơ được tách thành hai câu để tránh nặng nề, trong khi vẫn giữ trình tự và quan hệ logic của các mệnh đề. Đại từ “ông” được dùng cho Gia-cốp trong lời trần thuật, còn “con” được dùng trong lời trực tiếp của người cha.
