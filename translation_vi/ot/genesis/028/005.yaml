    rationale: Tiếng Hê-bơ-rơ chuyển chủ ngữ từ Y-sác sang Gia-cốp. Trong tiếng Việt, đại từ sau mệnh đề có Y-sác làm chủ ngữ gần nhất có thể bị hiểu là chỉ Y-sác.
  - severity: medium
    issue: “Là anh của Rê-bê-ca” thêm thông tin về thứ bậc tuổi.
    rationale: אֲחִי chỉ “anh/em trai, người anh em trai của” và không cho biết La-ban lớn hay nhỏ tuổi hơn Rê-bê-ca. Cần bảo lưu sự không xác định này.
  - severity: low
    issue: Không có chú thích tương ứng cho danh xưng A-ram.
    rationale: Bản chính “người A-ram” là đúng; một chú thích ngắn tại chính danh xưng này giúp lưu vết lựa chọn từ vựng và nêu cách gọi “người Sy-ri” của truyền thống cũ.
