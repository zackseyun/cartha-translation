  to: Vậy, Y-sác sai Gia-cốp đi, và Gia-cốp lên đường đến Pha-đan A-ram, đến gặp La-ban, con trai của Bê-tu-ên, người A-ram[a], là người anh/em trai của Rê-bê-ca, mẹ của Gia-cốp và Ê-sau.
