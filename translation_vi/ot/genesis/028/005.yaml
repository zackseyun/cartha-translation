base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: vi
  text: Vậy, Y-sác sai Gia-cốp đi, và Gia-cốp lên đường đến Pha-đan A-ram, đến gặp La-ban, con trai của Bê-tu-ên, người A-ram[a], là người anh/em trai của Rê-bê-ca, mẹ của Gia-cốp và Ê-sau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách gọi tiếng Anh truyền thống: “người Sy-ri”. Từ Hê-bơ-rơ chỉ chính xác hơn là người A-ram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sai ... đi
  rationale: Động từ שׁלח trong ngữ cảnh này diễn tả việc Y-sác cho Gia-cốp lên đường; “sai ... đi” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: וַיֵּלֶךְ
  choice: và ông lên đường
  rationale: הלך là động từ thông dụng nghĩa là “đi”; “lên đường” tránh lặp từ “đi” ngay sau “sai ... đi” mà vẫn giữ trình tự hành động.
- source_word: פַּדֶּנָה אֲרָם
  choice: đến Pha-đan A-ram
  rationale: Giữ nguyên địa danh bằng chuyển tự; hậu tố chỉ hướng được thể hiện bằng “đến”.
- source_word: בֶּן בְּתוּאֵל
  choice: con trai Bê-tu-ên
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho quan hệ phụ tử, đồng thời tránh khả năng hiểu “con” theo nghĩa không xác định giới tính.
- source_word: הָאֲרַמִּי
  choice: người A-ram
  rationale: Danh xưng chỉ dân tộc/xuất thân A-ram; “người A-ram” chính xác hơn cách gọi truyền thống “người Sy-ri”.
- source_word: אֲחִי רִבְקָה
  choice: là anh của Rê-bê-ca
  rationale: אח có thể chỉ anh hoặc em trai mà không xác định tuổi tương đối. Theo mạch gia đình, tiếng Việt cần chọn cách gọi; “anh” là cách dùng quen thuộc, nhưng nguồn không xác định rõ thứ bậc.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: mẹ của Gia-cốp và Ê-sau
  rationale: Giữ nguyên phần đồng vị giải thích về Rê-bê-ca trong tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt; giữ “A-ram” thay vì cách gọi lịch sử kém chính xác hơn. Không thêm chú thích vì bản tiếng Anh gắn chú thích [a] nhầm vị trí: nội dung chú thích nói về הָאֲרַמִּי chứ không phải וַיִּשְׁלַח; bản dịch chính đã diễn đạt trực tiếp là “người A-ram”.'
