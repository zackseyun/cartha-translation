  to: Ê-sau liền đến với Ích-ma-ên và lấy Ma-ha-lát, con gái của Ích-ma-ên, con trai Áp-ra-ham, chị/em gái của Nê-ba-ốt, làm một người vợ nữa, bên cạnh những người vợ ông đã có.[a]
