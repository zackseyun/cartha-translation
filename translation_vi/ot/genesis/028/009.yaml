base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: vi
  text: Ê-sau liền đến với Ích-ma-ên và lấy Ma-ha-lát, con gái của Ích-ma-ên, con trai Áp-ra-ham, chị/em gái của Nê-ba-ốt, làm một người vợ nữa, bên cạnh những người vợ ông đã có.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “ngoài những người vợ ông đã có.” Cụm từ Hê-bơ-rơ cho biết Ma-ha-lát được lấy làm một người vợ thêm, chứ không thay thế những người vợ trước của Ê-sau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: đi đến
  rationale: Động từ wayyiqtol của הלך kể hành động tiếp theo trong mạch truyện; “đi đến” diễn đạt tự nhiên hướng đến một người được nêu sau אֶל.
- source_word: וַיִּקַּח
  choice: lấy ... làm vợ
  rationale: לקח có nghĩa cơ bản là “lấy”; kết hợp với לוֹ לְאִשָּׁה, tiếng Việt tự nhiên dùng thành ngữ hôn nhân “lấy ... làm vợ”.
- source_word: מָחֲלַת
  choice: Ma-ha-lát
  rationale: Phiên âm tên riêng theo cách đọc Hê-bơ-rơ, có gạch nối để độc giả Việt dễ đọc.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: con gái của Ích-ma-ên, con trai Áp-ra-ham
  rationale: Giữ nguyên chuỗi gia hệ của bản Hê-bơ-rơ, đồng thời dùng dấu phẩy để câu tiếng Việt rõ nghĩa.
- source_word: אֲחוֹת נְבָיוֹת
  choice: em gái của Nê-ba-ốt
  rationale: Trong gia phả Sáng Thế Ký 25:13, Nê-ba-ốt được nêu là con đầu lòng của Ích-ma-ên; vì vậy “em gái” là cách diễn đạt quan hệ tự nhiên trong tiếng Việt, dù từ אֲחוֹת tự thân chỉ có nghĩa chung là “chị/em gái”.
- source_word: עַל נָשָׁיו
  choice: ngoài những người vợ ông đã có
  rationale: עַל ở đây biểu thị sự thêm vào; cách dịch này cho thấy Ma-ha-lát là một người vợ bổ sung chứ không thay thế các vợ trước.
- source_word: לוֹ לְאִשָּׁה
  choice: làm vợ
  rationale: Cụm này chỉ mục đích hoặc kết quả hôn nhân. Thành ngữ “lấy ... làm vợ” đã hàm ý “cho mình”, nên không cần lặp lại đại từ phản thân.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật trang trọng nhưng hiện đại; dùng cấu trúc gia hệ sát nguyên văn và thành ngữ hôn nhân tự nhiên trong tiếng Việt. Dấu chân chú [a] được đặt ngay sau “làm vợ”, là điểm mà cách hiểu bổ sung được giải thích.
