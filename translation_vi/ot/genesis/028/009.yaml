    rationale: אֲחוֹת có nghĩa “chị/em gái” và bản thân câu không cho biết Ma-ha-lát nhỏ tuổi hơn Nê-ba-ốt. Thông tin Nê-ba-ốt được kể đầu trong một gia phả khác không đủ để biến nghĩa của từ này thành “em gái” trong bản dịch câu hiện tại.
  - severity: low
    issue: Dấu chú thích [a] hiện đặt sau “làm vợ”, trong khi nội dung chú thích giải thích “ngoài những người vợ...”.
    rationale: Nên đặt mốc tại cụm diễn đạt ý bổ sung của עַל נָשָׁיו để liên kết chú thích với từ ngữ được giải thích rõ hơn.
