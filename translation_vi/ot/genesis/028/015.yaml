id: GEN.28.15
reference: Genesis 28:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: vi
  text: Này, Ta ở cùng con; Ta sẽ gìn giữ con[a] bất cứ nơi nào con đi, và sẽ đưa con trở về miền đất này[b]. Vì Ta sẽ không lìa bỏ con[c] cho đến khi Ta đã làm xong điều Ta phán với con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trông nom con” hoặc “bảo vệ con.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ cũng có thể dịch là “mảnh đất này” hoặc “vùng đất này.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “không bỏ con” hoặc “không bỏ mặc con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái sống động của tiểu từ Hê-bơ-rơ, đồng thời tự nhiên hơn trong lời phán tiếng Việt hiện đại.
- source_word: אָנֹכִי עִמָּךְ
  choice: Ta ở cùng con
  rationale: Diễn đạt trực tiếp lời khẳng định về sự hiện diện của Đức Chúa Trời; đại từ độc lập אָנֹכִי tạo điểm nhấn nhưng không cần thêm từ nặng nề như “chính Ta”.
- source_word: וּשְׁמַרְתִּיךָ
  choice: Ta sẽ gìn giữ con
  rationale: “Gìn giữ” bao quát ý bảo vệ, canh giữ và chăm nom của שׁמר mà vẫn trang trọng, tự nhiên.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: bất cứ nơi nào con đi
  rationale: Chuyển thành lối nói tiếng Việt tự nhiên, diễn đạt phạm vi mọi nơi Gia-cốp sẽ đi.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: sẽ đưa con trở về
  rationale: 'Giữ lực nguyên nhân của dạng Hiphil động từ שוב: Đức Chúa Trời khiến hoặc đưa Gia-cốp trở lại.'
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: về miền đất này
  rationale: Trong bối cảnh lời hứa cho các tổ phụ, אֲדָמָה chỉ vùng đất cụ thể hơn là riêng đất hay thổ nhưỡng; “miền đất” thể hiện rõ nghĩa địa lý.
- source_word: כִּי
  choice: Vì
  rationale: Giữ quan hệ giải thích, nêu cơ sở bảo đảm cho lời hứa vừa phán.
- source_word: לֹא אֶעֱזָבְךָ
  choice: Ta sẽ không lìa bỏ con
  rationale: “Lìa bỏ” giữ được cả ý rời xa lẫn bỏ mặc của עזב, phù hợp với lời hứa về sự hiện diện mà không cường điệu.
- source_word: עַד אֲשֶׁר אִם
  choice: cho đến khi
  rationale: Đây là cách diễn đạt tự nhiên của tiếng Việt cho thành ngữ chỉ mốc hoàn tất trong tiếng Hê-bơ-rơ.
- source_word: עָשִׂיתִי
  choice: Ta đã làm xong
  rationale: Dạng hoàn thành sau עַד được hiểu theo nghĩa hoàn tất tại một thời điểm tương lai; “đã làm xong” thể hiện quan hệ thời gian đó.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: điều Ta phán với con
  rationale: Bám sát động từ דּבר là “phán/nói” thay vì diễn giải thành “hứa,” dù nội dung lời phán quả có tính chất lời hứa.
theological_decisions:
- issue: Ngôn ngữ về sự hiện diện, bảo vệ và thành tín trong giao ước
  choice: Diễn đạt trực tiếp rằng Đức Chúa Trời ở cùng, gìn giữ, đưa Gia-cốp trở về và hoàn thành lời Ngài đã phán.
  alternative: Dùng các từ ngữ truyền thống hoặc diễn giải mạnh hơn như “không bao giờ ruồng bỏ,” “trông nom” hay “đưa về quê hương.”
  rationale: Cách chọn này bảo toàn các chủ đề thần học hiện diện trong câu mà không thu hẹp hoặc mở rộng lời hứa bằng những khái niệm không được nói rõ trong nguyên văn.
- issue: Hàm ý của cụm “cho đến khi”
  choice: Giữ nguyên cấu trúc thời hạn của nguyên văn mà không thêm “và cả sau đó.”
  alternative: Diễn giải rõ rằng sự hiện diện của Đức Chúa Trời chắc chắn vẫn tiếp tục sau khi lời phán được hoàn thành.
  rationale: Cụm từ nhấn mạnh sự bảo đảm cho tới lúc hoàn tất lời phán, nhưng bản văn không trực tiếp bàn về thời gian sau mốc ấy. Bản dịch giữ nguyên sự căng thẳng và không suy diễn thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” phù hợp với lời Đức Chúa Trời phán trực tiếp với Gia-cốp. Nhịp câu giữ tính long trọng nhưng tránh từ cổ khó hiểu; dấu chấm phẩy giúp phân tách lời bảo đảm về sự hiện diện với các hành động gìn giữ và đưa trở về.
