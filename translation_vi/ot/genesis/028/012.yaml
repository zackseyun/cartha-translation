id: GEN.28.12
reference: Genesis 28:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: vi
  text: Ông nằm mơ và kìa, một cầu thang[a] được dựng trên đất, đầu cầu thang vươn tới trời; và kìa, các thiên sứ của Đức Chúa Trời đang lên xuống trên đó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cái thang”. Từ Hê-bơ-rơ có thể chỉ rộng hơn một cấu trúc dùng để đi lên.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “trên ông”, tức trên Gia-cốp; tuy nhiên, trong văn cảnh, từ quy chiếu tự nhiên nhất là cầu thang.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: Ông nằm mơ
  rationale: Dạng wayyiqtol tiếp nối mạch kể chuyện; “nằm mơ” là cách diễn đạt tự nhiên trong tiếng Việt mà không thêm nội dung.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ sắc thái trình hiện sống động của הִנֵּה trong khải tượng, đồng thời dùng lối diễn đạt trang trọng nhưng dễ hiểu.
- source_word: סֻלָּם
  choice: cầu thang
  rationale: Từ Hê-bơ-rơ chỉ một cấu trúc dùng để đi lên và xuống, không nhất thiết là chiếc thang có các bậc ngang; “cầu thang” giữ được độ rộng nghĩa ấy.
- source_word: מֻצָּב אַרְצָה
  choice: được dựng trên đất
  rationale: Diễn đạt trạng thái một cấu trúc đã được đặt dựng, với chân ở trên đất, và giữ thế tương phản đất–trời.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: đầu cầu thang vươn tới trời
  rationale: “Đầu” giữ hình ảnh của רֹאשׁ; “vươn tới” truyền đạt chiều hướng và sự kéo dài lên trời của phân từ מַגִּיעַ.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: các thiên sứ của Đức Chúa Trời
  rationale: Trong bối cảnh giấc mơ này, từ מַלְאָךְ chỉ các hữu thể thiên thượng; cách gọi này rõ ràng và quen thuộc trong tiếng Việt.
- source_word: עֹלִים וְיֹרְדִים
  choice: đang lên xuống
  rationale: “Đang” phản ánh hai phân từ mô tả chuyển động đang diễn ra; “lên xuống” tự nhiên và gọn trong tiếng Việt.
- source_word: בּוֹ
  choice: trên đó
  rationale: Đại từ giống đực số ít tự nhiên nhất quy chiếu về סֻלָּם; “trên đó” thể hiện chuyển động dọc theo cấu trúc mà không buộc nó phải là thang dây hay thang bậc.
theological_decisions:
- issue: Hình ảnh của סֻלָּם
  choice: cầu thang
  alternative: cái thang
  rationale: Nguyên ngữ không xác định rõ một chiếc thang có các thanh ngang. “Cầu thang” phù hợp với cảnh nhiều thiên sứ lên xuống, nhưng chú thích vẫn bảo lưu cách hiểu truyền thống là “cái thang”.
- issue: Từ quy chiếu của בּוֹ
  choice: trên đó, chỉ cầu thang
  alternative: trên ông, chỉ Gia-cốp
  rationale: Danh từ gần nhất và tự nhiên nhất làm tiền ngữ là “cầu thang”. Tuy vậy, hình thức Hê-bơ-rơ cũng có thể được hiểu là “trên ông”, nên giữ khả năng ấy trong chú thích thay vì loại bỏ.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng “kìa” để giữ tính sống động của cảnh mộng; dùng “Đức Chúa Trời” theo cách gọi Kinh Thánh tiếng Việt phổ biến. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
