id: GEN.50.10
reference: Genesis 50:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: vi
  text: Khi đến sân đạp lúa A-tát[a], ở bên kia sông Giô-đanh[b], họ cử hành tại đó một lễ than khóc rất lớn và thảm thiết[c]. Rồi ông để tang cha mình trong bảy ngày[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên A-tát có thể bắt nguồn từ một từ có nghĩa là “bụi gai” hoặc “cây gai”, nhưng tại đây được dùng làm địa danh.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ở phía bên kia sông Giô-đanh.” Cách nói Hê-bơ-rơ không tự nó xác định phía đông hay phía tây.'
    reason: alternative_reading
  - marker: c
    text: 'Nguyên văn: “một cuộc than khóc rất lớn và nặng nề”; đây là cách nói nhấn mạnh mức độ đau thương sâu sắc.'
    reason: cultural_note
  - marker: d
    text: Động từ Hê-bơ-rơ ở số ít (“ông để tang”), có lẽ chỉ riêng Giô-sép; một số bản dịch dùng số nhiều “họ”.
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן הָאָטָד
  choice: sân đạp lúa A-tát
  rationale: גֹּרֶן là địa điểm dùng để đạp hoặc đập lúa; הָאָטָד trong cụm này có chức năng như địa danh, nên được phiên âm.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ở bên kia sông Giô-đanh
  rationale: Giữ cách diễn đạt không gian của tiếng Hê-bơ-rơ mà không xác định thêm bên đông hay bên tây.
- source_word: וַיִּסְפְּדוּ ... מִסְפֵּד
  choice: họ cử hành ... một lễ than khóc
  rationale: Động từ và danh từ cùng gốc chỉ sự than khóc công khai, trang trọng dành cho người chết; cách dịch này truyền đạt sắc thái tang lễ và tránh lặp từ vụng về.
- source_word: גָּדוֹל וְכָבֵד מְאֹד
  choice: rất lớn và thảm thiết
  rationale: כָבֵד theo nghĩa đen là 'nặng', nhưng trong ngữ cảnh than khóc diễn tả mức độ đau thương dữ dội; 'thảm thiết' tự nhiên trong tiếng Việt mà vẫn giữ cường độ.
- source_word: וַיַּעַשׂ לְאָבִיו אֵבֶל שִׁבְעַת יָמִים
  choice: ông để tang cha mình trong bảy ngày
  rationale: עשה với אֵבֶל là thành ngữ chỉ việc thực hiện hoặc giữ tang; 'để tang' là cách nói tiếng Việt tự nhiên. Đại từ số ít bảo toàn sự chuyển đổi từ chủ thể số nhiều sang số ít trong bản Hê-bơ-rơ.
theological_decisions:
- issue: Chủ thể của động từ số ít וַיַּעַשׂ sau các động từ số nhiều
  choice: Dùng đại từ số ít 'ông', theo hình thái của bản Hê-bơ-rơ, có lẽ chỉ Giô-sép.
  alternative: Dịch 'họ để tang' theo chủ thể tập thể trong ngữ cảnh.
  rationale: Bản Masoret chuyển rõ từ số nhiều ('họ đến', 'họ than khóc') sang số ít ('ông để tang'). Giữ số ít bảo tồn nét chuyển đổi của nguyên văn mà không đưa tên Giô-sép, vốn không xuất hiện trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “sân đạp lúa” phù hợp bối cảnh nông nghiệp cổ; “cử hành một lễ than khóc” diễn đạt tính công khai, nghi lễ của ספד; giữ đại từ “ông” để phản ánh số ít trong nguyên văn.
