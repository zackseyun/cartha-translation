  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: vi
  text: Rồi Giô-sép ngã sấp trên mặt cha mình, khóc thương cha và hôn cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “Rồi Giô-sép ngã xuống trên mặt cha mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: phủ phục
  rationale: Động từ נפל diễn tả Giô-sép hạ người xuống trên thi thể cha. “Phủ phục” giữ được chuyển động cụ thể và sắc thái trang nghiêm, tự nhiên hơn cách dịch máy móc “ngã” trong tiếng Việt.
- source_word: עַל פְּנֵי אָבִיו
  choice: trên mặt cha mình
  rationale: Cụm Hê-bơ-rơ nói cụ thể “trên mặt cha mình”. Bản dịch giữ hình ảnh thân thể sống động và không giản lược thành một cử chỉ đau buồn chung chung; chú thích nêu cách diễn đạt tự nhiên hơn.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: khóc thương cha
  rationale: בכה là “khóc”, còn עַל trong ngữ cảnh này chỉ việc khóc trên hoặc vì người đã chết. “Khóc thương cha” diễn đạt tự nhiên hành động than khóc mà không thêm ý niệm thần học.
- source_word: וַיִּשַּׁק לוֹ
  choice: hôn cha
  rationale: נשק ở thể Qal có nghĩa thông thường là “hôn”; giới từ לֹו đánh dấu đối tượng theo cách dùng Hê-bơ-rơ. Lặp lại “cha” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
