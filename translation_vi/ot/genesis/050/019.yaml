  naturalness: Cấu trúc “vì chẳng lẽ tôi ở địa vị của ... sao?” có thể hiểu được, nhưng hơi gượng trong tiếng Việt hiện đại. Mẫu “vì tôi có ở địa vị ... đâu?” tự nhiên hơn, vẫn là câu hỏi tu từ phủ định và giữ được sự nhấn mạnh của đại từ “tôi”. Chú thích hiện dùng “ở dưới Đức Chúa Trời” không tự nhiên; cần diễn đạt khả năng thay thế ấy thành “ở dưới quyền Đức Chúa Trời”.
  terminology: “Giô-sép” và “Đức Chúa Trời” phù hợp với cách dùng Kinh Thánh tiếng Việt trang trọng. “Ở địa vị Đức Chúa Trời” truyền đạt thành ngữ tốt hơn cách dịch theo bề mặt “ở dưới”.
