base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: vi
  text: 'Nhưng Giô-sép nói với họ: “Đừng sợ, vì tôi có ở địa vị Đức Chúa Trời đâu?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Tôi có ở dưới quyền Đức Chúa Trời không?” Cụm từ Hê-bơ-rơ này là thành ngữ; trong ngữ cảnh này, rất có thể có nghĩa là “ở địa vị Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: nói với họ
  rationale: Cách diễn đạt tự nhiên trong văn thuật chuyện, đồng thời nêu rõ những người được nói với.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אַל תִּירָאוּ
  choice: Đừng sợ
  rationale: Diễn đạt trực tiếp mệnh lệnh phủ định ở số nhiều; ngắn gọn, tự nhiên và trang trọng.
- source_word: כִּי
  choice: vì
  rationale: Giữ chức năng giải thích lý do cho lời trấn an của Giô-sép.
- source_word: הֲתַחַת אֱלֹהִים אָֽנִי
  choice: chẳng lẽ tôi ở địa vị của Đức Chúa Trời sao?
  rationale: Câu hỏi tu từ phủ nhận việc Giô-sép chiếm địa vị hay quyền phán xét của Đức Chúa Trời; “ở địa vị của” chuyển tải thành ngữ תַּחַת tự nhiên hơn cách dịch sát là “ở dưới”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, danh từ chỉ Đức Chúa Trời duy nhất; cách gọi này trang trọng và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Sắc thái câu hỏi tu từ của Giô-sép về đặc quyền thuộc về Đức Chúa Trời
  choice: Giô-sép phủ nhận rằng mình ở địa vị của Đức Chúa Trời để xét xử hoặc báo trả.
  alternative: Giô-sép hỏi liệu mình có ở dưới quyền Đức Chúa Trời hay không.
  rationale: Trong bối cảnh các anh em lo sợ bị trả thù, thành ngữ תַּחַת אֱלֹהִים hợp lý nhất khi chỉ việc đứng vào địa vị của Đức Chúa Trời. Bản dịch vẫn ghi nhận khả năng hiểu sát khác trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi tu từ được diễn đạt bằng cấu trúc “chẳng lẽ... sao?” để giữ sức nhấn của đại từ độc lập אָֽנִי và ý phủ nhận hàm ẩn.
