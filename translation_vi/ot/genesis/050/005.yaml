base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: vi
  text: 'Cha tôi đã buộc tôi thề như sau: ‘Này, ta sắp chết. Con hãy chôn ta ở đó, trong ngôi mộ ta đã đào cho mình tại xứ Ca-na-an.’ Vậy bây giờ, xin cho tôi lên đó chôn cất cha tôi, rồi tôi sẽ trở về.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: đã buộc tôi thề
  rationale: Giữ rõ sắc thái khiến một người phải thề của dạng Hifil, đồng thời tự nhiên trong tiếng Việt.
- source_word: הִנֵּה
  choice: Này
  rationale: Thể hiện từ thu hút sự chú ý trong lời trích dẫn mà vẫn trang trọng, dễ hiểu.
- source_word: כָּרִיתִי
  choice: đã đào
  rationale: Theo nghĩa thông thường của động từ כרה trong ngữ cảnh chuẩn bị một ngôi mộ; không đổi thành ‘mua’ dù bối cảnh rộng hơn có nhắc đến việc mua phần mộ.
- source_word: אֶעֱלֶה נָּא
  choice: xin cho tôi lên đó
  rationale: Diễn đạt lời thỉnh cầu có tiểu từ נָא; ‘lên’ giữ hướng chuyển động trong nguyên văn, còn ‘đó’ làm rõ đích đến là Ca-na-an theo ngữ cảnh ngay trước.
