  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: vi
  text: Sau khi chôn cất cha mình, Giô-sép trở về Ai Cập, cùng với các anh em ông và tất cả những người đã đi lên với ông để chôn cất cha ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng cách nói “đi lên với ông”, một thành ngữ địa lý quen thuộc trong Kinh Thánh để chỉ hành trình từ Ai Cập lên Ca-na-an.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: trở về
  rationale: Động từ שוב trong mạch kể chỉ hành động quay lại nơi đã rời đi; “trở về” tự nhiên và chính xác trong tiếng Việt.
- source_word: מִצְרַיְמָה
  choice: Ai Cập
  rationale: Hậu tố chỉ hướng biểu thị chuyển động về phía Ai Cập; sau “trở về”, tiếng Việt không cần thêm giới từ.
- source_word: הוּא וְאֶחָיו
  choice: cùng về với ông có các anh em ông
  rationale: Đại từ הוּא nhấn mạnh và đồng vị với Giô-sép. Cách diễn đạt này giữ Giô-sép làm chủ thể chính, đồng thời nêu rõ các anh em cùng trở về.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: và tất cả những người đã từ Ai Cập đi lên với ông
  rationale: Phân từ עֹלִים mang thành ngữ địa lý “đi lên” từ Ai Cập đến Ca-na-an; thêm “từ Ai Cập” làm rõ điểm xuất phát vốn có trong ngữ cảnh mà vẫn giữ hình ảnh của nguyên văn.
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: để chôn cất cha ông
  rationale: Cấu trúc ל + động từ nguyên mẫu diễn tả mục đích. “Chôn cất” có sắc thái trang trọng, tự nhiên trong bối cảnh tang lễ.
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: Sau khi chôn cất cha mình
  rationale: אַחֲרֵי diễn tả thời gian tiếp sau. Đưa mệnh đề thời gian lên đầu giúp câu tiếng Việt rõ ràng, tránh lặp nặng nề mà vẫn bảo toàn trình tự sự việc.
