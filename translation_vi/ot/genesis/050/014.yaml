  to: Sau khi chôn cất cha mình, Giô-sép trở về Ai Cập, cùng với các anh em ông và tất cả những người đã đi lên với ông để chôn cất cha ông.[a]
  rationale: Bản sửa loại bỏ chi tiết suy diễn “từ Ai Cập” khỏi bản văn chính, chuyển tải đầy đủ bằng chú thích, và chỉnh cấu trúc câu để tiếng Việt hiện đại tự nhiên hơn. Mệnh đề “Sau khi chôn cất cha mình” vẫn diễn đạt đúng quan hệ thời gian của אַחֲרֵי קָבְרוֹ אֶת אָבִיו; “cha mình” quy chiếu rõ đến Giô-sép, còn “cha ông” trong cụm mục đích quy chiếu theo văn cảnh.
