translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho Giô-sép và “cha mình/cha ông” theo quy chiếu tự nhiên của tiếng Việt; giữ thành ngữ “đi lên” của nguyên văn và giải thích bằng chú thích.
