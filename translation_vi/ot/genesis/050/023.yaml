  text: וַ/יַּ֤רְא יוֹסֵף֙ לְ/אֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל בִּרְכֵּ֥י יוֹסֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: vi
  text: Giô-sép thấy các con cháu của Ép-ra-im đến đời thứ ba.[a] Các con của Ma-ki, con trai của Ma-na-se, cũng được sinh ra trên đầu gối của Giô-sép.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giô-sép sống để thấy con cháu của Ép-ra-im đến đời thứ ba.” Nguyên văn Hê-bơ-rơ nói theo nghĩa đen: “Giô-sép thấy.”'
    reason: lexical_alternative
  - marker: b
    text: “Được sinh ra trên đầu gối của Giô-sép” là một thành ngữ Hê-bơ-rơ, có thể hàm ý rằng ông công nhận, tiếp nhận vào gia đình, hoặc đặc biệt đón nhận những đứa trẻ ấy.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: được thấy
  rationale: Giữ nghĩa trực tiếp là “thấy”, đồng thời cách nói “được thấy” tự nhiên trong ngữ cảnh Giô-sép sống lâu đến mức chứng kiến các thế hệ hậu duệ.
- source_word: לְאֶפְרַיִם בְּנֵי שִׁלֵּשִׁים
  choice: các con cháu của Ép-ra-im đến đời thứ ba
  rationale: לְאֶפְרַיִם diễn tả quan hệ dòng dõi; “con cháu” tránh khiến độc giả hiểu בְּנֵי chỉ là con trực hệ, còn “đến đời thứ ba” bảo toàn phạm vi phả hệ mà không xác định quá mức.
- source_word: גַּם
  choice: cũng
  rationale: Diễn đạt tự nhiên ý bổ sung song song với mệnh đề trước.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: các con của Ma-ki, con trai Ma-na-se
  rationale: Trong vế này, “các con” phù hợp với ngữ cảnh sinh nở; cụm đồng vị xác định Ma-ki là con trai Ma-na-se.
- source_word: יֻלְּדוּ
  choice: được sinh ra
  rationale: Phản ánh thể bị động của động từ ילד và giữ cấu trúc sát nguyên văn.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: trên đầu gối Giô-sép
  rationale: Giữ nguyên hình ảnh cụ thể và sự mơ hồ văn hóa của thành ngữ Hê-bơ-rơ, thay vì đưa một cách giải thích vào chính văn.
theological_decisions:
- issue: Ý nghĩa của việc được sinh ra “trên đầu gối Giô-sép”
  choice: Giữ nguyên thành ngữ trong chính văn và giải thích các khả năng trong chú thích
  alternative: Diễn giải trực tiếp là Giô-sép công nhận, tiếp nhận hoặc nhận làm con
  rationale: Nguyên văn không xác định chính xác hành động pháp lý hay nghi lễ nào; giữ hình ảnh bảo toàn sự mơ hồ và tránh áp đặt một cách hiểu riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “con cháu” ở vế đầu để biểu đạt các thế hệ hậu duệ; giữ thành ngữ “trên đầu gối” trong chính văn và đặt lời giải thích ở chú thích.
