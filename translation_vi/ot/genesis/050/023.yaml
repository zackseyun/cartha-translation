  to: Giô-sép thấy các con cháu của Ép-ra-im đến đời thứ ba.[a] Các con của Ma-ki, con trai của Ma-na-se, cũng được sinh ra trên đầu gối của Giô-sép.[b]
  rationale: Sửa động từ đầu câu từ “được thấy” thành “thấy” để phản ánh đúng thể chủ động của tiếng Hê-bơ-rơ. Các điều chỉnh nhỏ về “của” làm câu tiếng Việt rõ và tự nhiên hơn, không thay đổi ý nghĩa. Thành ngữ “trên đầu gối” được giữ nguyên trong chính văn; chú thích chỉ nêu các khả năng diễn giải, không xác định một nghi thức hay hệ quả pháp lý cụ thể.
  reviewer_model: gpt-5.6-terra
