  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: vi
  text: 'Các anh em của ông cũng đến, sấp mình trước mặt ông và nói: “Chúng tôi đây, làm nô lệ[a] cho ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi tớ của ông.” Từ Hê-bơ-rơ עֲבָדִים có thể chỉ tôi tớ hoặc nô lệ; “nô lệ” ở đây nhấn mạnh lời tự quy phục mạnh mẽ của các anh em.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: đến
  rationale: Động từ הלך có nghĩa cơ bản là “đi”, nhưng ở đây các anh em tiến đến chỗ Giô-sép; “đến” diễn đạt tự nhiên điểm nhìn của cảnh thuật.
- source_word: גַּם אֶחָיו
  choice: các anh em của ông cũng
  rationale: 'גַּם đánh dấu sự bổ sung: sau lời nhắn trước đó, chính các anh em cũng đích thân đến. “Anh em” bao quát các anh và em trai của Giô-sép.'
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: sấp mình trước mặt ông
  rationale: Cấu trúc נפל + לפני mô tả hành động phủ phục trước một người để bày tỏ sự quy phục; “sấp mình” vừa tự nhiên vừa giữ được ý nghĩa thể chất và thái độ kính phục.
- source_word: הִנֶּנּוּ
  choice: Chúng tôi đây
  rationale: Đây là công thức tự trình diện, nhấn mạnh sự có mặt và sẵn sàng của người nói; cách dịch này tự nhiên trong tiếng Việt hiện đại.
- source_word: לְךָ לַעֲבָדִים
  choice: là nô lệ của ông
  rationale: Cụm từ diễn tả việc họ tự đặt mình hoàn toàn dưới quyền Giô-sép. עֲבָדִים có thể chỉ “tôi tớ” hoặc “nô lệ”; trong tư thế quy phục mạnh ở đây, “nô lệ” giữ rõ hơn sức nặng của lời tự hạ mình.
theological_decisions:
- issue: Sắc thái của עֲבָדִים trong lời tự quy phục
  choice: nô lệ
  alternative: tôi tớ
  rationale: Ngữ cảnh không chỉ diễn tả sự phục vụ lịch sự mà là lời xin đặt bản thân dưới toàn quyền của Giô-sép. Tuy vậy, từ Hê-bơ-rơ có phạm vi nghĩa rộng nên phương án “tôi tớ” được ghi trong chú thích, không biến lựa chọn từ vựng thành một khẳng định giáo lý.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” cho Giô-sép theo cách quy chiếu tự nhiên trong lời kể; “sấp mình” diễn đạt rõ hành động phủ phục. Cụm “Chúng tôi đây” giữ sắc thái tự trình diện của הִנֶּנּוּ mà không dùng lối nói cổ.
