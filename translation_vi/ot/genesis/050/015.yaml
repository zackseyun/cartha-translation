base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: vi
  text: 'Khi các anh của Giô-sép thấy cha mình đã qua đời, họ nói: “Nếu Giô-sép thù ghét chúng ta và nhất định báo trả đầy đủ chúng ta vì mọi điều ác chúng ta đã làm cho Giô-sép thì sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ יִשְׂטְמֵנוּ
  choice: Nếu Giô-sép căm ghét chúng ta ... thì sao?
  rationale: לוּ trong ngữ cảnh này diễn tả nỗi lo sợ về một khả năng; cấu trúc “Nếu... thì sao?” tự nhiên trong tiếng Việt. שׂטם là nuôi lòng thù ghét/căm ghét, nên chọn “căm ghét”.
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: nhất định báo trả chúng ta
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ hữu hạn tạo sắc thái nhấn mạnh; “nhất định” giữ sự quả quyết đáng sợ ấy. “Báo trả” truyền đạt hành động trả lại điều ác đã chịu.
- source_word: אֵת כָּל־הָרָעָה
  choice: mọi điều ác
  rationale: Giữ nội dung đạo đức rõ ràng của רָעָה và phạm vi toàn thể của כָּל.
- source_word: אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: chúng ta đã làm cho nó
  rationale: Trong ngữ cảnh, גמל chỉ cách họ đã đối xử/gây điều ác cho Giô-sép. “Làm cho nó” là cách nói tự nhiên, đồng thời giữ quan hệ trực tiếp với đối tượng.
theological_decisions:
- issue: Nỗi lo của các anh về thái độ và sự báo trả của Giô-sép
  choice: 'Giữ dưới dạng giả định lo sợ: “Nếu... thì sao?”'
  alternative: Khẳng định rằng Giô-sép thực sự căm ghét và sẽ báo trả họ
  rationale: לוּ ở đây không xác nhận động cơ của Giô-sép mà trình bày điều các anh ông e ngại; bản dịch không nên biến nỗi sợ của họ thành sự thật khách quan.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các anh của Giô-sép” để xác định quan hệ; trong lời thoại dùng “chúng ta” và “nó” phù hợp lời nói giữa các anh em trong bối cảnh kể chuyện cổ, không làm lời văn quá kiểu cách.
