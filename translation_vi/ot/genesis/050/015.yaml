  to: 'Khi các anh của Giô-sép thấy cha mình đã qua đời, họ nói: “Nếu Giô-sép thù ghét chúng ta và nhất định báo trả đầy đủ chúng ta vì mọi điều ác chúng ta đã làm cho Giô-sép thì sao?”'
  rationale: Bản sửa giữ lời nói dưới dạng giả định lo sợ (“Nếu ... thì sao?”), giữ mức độ nhấn mạnh của động từ “báo trả đầy đủ,” và thay những kết hợp từ/đại từ chưa tự nhiên bằng cách diễn đạt trung tính, rõ nghĩa trong tiếng Việt hiện đại.
