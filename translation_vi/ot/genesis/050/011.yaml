revisions:
- from: 'Khi dân trong xứ, tức là người Ca-na-an, thấy cảnh tang chế tại sân đập lúa A-tát, họ nói: “Đây là một tang lễ rất trọng thể của người Ai Cập.” Vì thế, nơi ấy được đặt tên là A-bên Mích-ra-im[a], ở bên kia sông Giô-đanh[b].'
  to: 'Khi dân trong xứ, tức người Ca-na-an, thấy cảnh để tang tại sân đập lúa A-tát, họ nói: “Đây là một cuộc để tang lớn lao của người Ai Cập.” Vì thế, nơi ấy được gọi là A-bên Mích-ra-im[a], ở bên kia sông Giô-đanh[b].'
  rationale: Thay cách dịch nhấn vào nghi thức “tang lễ rất trọng thể” bằng cách dịch nêu đúng nội dung và cường độ của sự để tang. Điều chỉnh chú thích (a) cho tương ứng với cách dịch chính và chú thích (b) để diễn đạt chính xác tính phụ thuộc điểm quy chiếu.
