base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: vi
  text: 'Khi dân trong xứ, tức người Ca-na-an, thấy cảnh để tang tại sân đập lúa A-tát, họ nói: “Đây là một cuộc để tang lớn lao của người Ai Cập.” Vì thế, nơi ấy được gọi là A-bên Mích-ra-im[a], ở bên kia sông Giô-đanh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-bên Mích-ra-im nghe gần với cụm từ Hê-bơ-rơ có nghĩa là “sự để tang của Ai Cập”, nhắc lại lời người Ca-na-an mô tả sự việc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ở phía bên kia sông Giô-đanh”; cách nói này tùy thuộc vào điểm quy chiếu địa lý của người nói hoặc người kể.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: dân trong xứ, tức là người Ca-na-an
  rationale: Danh từ phân từ số ít mang nghĩa tập thể; phần đồng vị xác định cư dân ấy là người Ca-na-an. Cách dịch này vừa giữ quan hệ đồng vị vừa tự nhiên trong tiếng Việt.
- source_word: הָאֵבֶל
  choice: cảnh tang chế
  rationale: אֵבֶל chỉ sự than khóc và các nghi thức để tang người chết; “cảnh tang chế” phù hợp với việc những người chứng kiến quan sát toàn bộ sự kiện.
- source_word: בְּגֹרֶן הָאָטָד
  choice: tại sân đập lúa A-tát
  rationale: גֹּרֶן là sân dùng để đập hoặc rê lúa; giới từ בְּ ở đây chỉ địa điểm.
- source_word: אֵבֶל כָּבֵד
  choice: một tang lễ rất trọng thể
  rationale: כָּבֵד theo nghĩa đen là “nặng”, tại đây diễn tả mức độ lớn và nghiêm trọng của việc tang. “Rất trọng thể” tự nhiên trong tiếng Việt và phù hợp với nghi thức tang quy mô lớn trong văn cảnh.
- source_word: לְמִצְרָיִם
  choice: của người Ai Cập
  rationale: Danh xưng địa lý “Ai Cập” ở đây chỉ đoàn người Ai Cập gắn với việc tang; tiếng Việt diễn đạt tự nhiên bằng “người Ai Cập”.
- source_word: קָרָא שְׁמָהּ
  choice: nơi ấy được đặt tên
  rationale: Giữ công thức đặt tên ở thể bị động mà không thêm một chủ thể không được nêu trong nguyên văn.
- source_word: אָבֵל מִצְרַיִם
  choice: A-bên Mích-ra-im
  rationale: Phiên âm địa danh, đồng thời giải thích lối chơi chữ với אֵבֶל, “tang chế”, trong chú thích.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ở bên kia sông Giô-đanh
  rationale: Cụm từ chỉ phía bên kia hoặc phía đối diện của sông Giô-đanh; điểm quy chiếu địa lý không được xác định ngay trong câu.
