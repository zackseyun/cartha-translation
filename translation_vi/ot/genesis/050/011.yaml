translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các địa danh được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt; chú thích bảo tồn lối chơi chữ và tính phụ thuộc điểm nhìn của cụm từ địa lý.
