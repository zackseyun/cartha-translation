  text: So they sent word to Joseph[a], saying, “Your father commanded before his death, saying,”
translation:
  language: vi
  text: 'Thế là, họ nhắn cho Giô-sép[a] rằng: “Trước khi qua đời, cha của em đã truyền rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “họ truyền lệnh cho Giô-sép, nói rằng.” Động từ Hê-bơ-rơ thường có nghĩa là “truyền lệnh”, nhưng trong ngữ cảnh này có lẽ chỉ việc sai người chuyển lời đến Giô-sép.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: họ nhắn
  rationale: Động từ צוה thường có nghĩa là “truyền lệnh”, nhưng với אֶל יוֹסֵף và lời gián tiếp theo sau, ngữ cảnh nhiều khả năng nói đến việc sai người chuyển lời cho Giô-sép. “Nhắn” diễn đạt tự nhiên hành động truyền đạt này.
- source_word: אֶל יוֹסֵף
  choice: với Giô-sép
  rationale: Giô-sép là người nhận lời nhắn; “nhắn với” là kết hợp từ tự nhiên trong tiếng Việt hiện đại.
- source_word: לֵאמֹר
  choice: dấu hai chấm
  rationale: Phân từ giới thiệu lời nói được thể hiện tự nhiên bằng dấu hai chấm trước lời trích dẫn, thay vì dịch máy móc là “rằng rằng”.
- source_word: אָבִיךָ
  choice: cha của em
  rationale: Đại từ sở hữu ngôi thứ hai số ít hướng đến Giô-sép. “Em” phù hợp với lời các anh nói với người em của mình mà không làm thay đổi nội dung.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Giữ sắc thái mệnh lệnh của צוה, đồng thời “truyền rằng” tự nhiên trong văn kể trang trọng và mở sang nội dung mệnh lệnh ở câu kế tiếp.
- source_word: לִפְנֵי מוֹתוֹ
  choice: trước khi qua đời
  rationale: 'Diễn đạt rõ nghĩa thời gian: lời truyền được đưa ra trước cái chết của người cha.'
- source_word: לֵאמֹר
  choice: rằng
  rationale: Lần xuất hiện thứ hai giới thiệu nội dung lời truyền sẽ được trích ở câu tiếp theo; “rằng” giữ chức năng cú pháp ấy mà vẫn tự nhiên trong tiếng Việt.
