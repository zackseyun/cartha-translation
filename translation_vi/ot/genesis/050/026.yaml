base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: vi
  text: Vậy[a] Giô-sép chết lúc một trăm mười tuổi. Họ ướp xác ông và đặt ông vào một quan tài ở Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và Giô-sép chết lúc một trăm mười tuổi.” Liên từ mở đầu có thể dịch đơn giản là “Và”; “Vậy” thể hiện sắc thái kết thúc của mạch kể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Động từ מות chỉ sự chết. “Qua đời” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và không làm thay đổi nghĩa.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: hưởng thọ một trăm mười tuổi
  rationale: Thành ngữ Hê-bơ-rơ dùng cấu trúc “con của ... năm” để nói tuổi. Trong văn cảnh cáo phó về một người sống lâu, “hưởng thọ ... tuổi” truyền đạt tự nhiên con số tuổi lúc qua đời.
- source_word: וַיַּחַנְטוּ
  choice: người ta ướp xác ông
  rationale: Động từ חנט nói đến việc xử lý thi hài để bảo quản, đặc biệt phù hợp với bối cảnh Ai Cập. “Ướp xác” chính xác và dễ hiểu hơn cách diễn giải cụ thể là “làm xác ướp”.
- source_word: וַיִּישֶׂם
  choice: đặt ông
  rationale: Động từ שׂים có nghĩa thông dụng là đặt hoặc để. “Đặt” phù hợp với giọng kể trang trọng.
- source_word: בָּאָרוֹן
  choice: vào một quan tài
  rationale: אָרוֹן có thể chỉ hòm, rương hoặc hòm giao ước; trong bối cảnh thi hài đã được ướp, nghĩa thích hợp là “quan tài”. Giới từ được diễn đạt là “vào” vì hành động đặt thi hài hướng vào bên trong quan tài.
- source_word: בְּמִצְרָיִם
  choice: tại Ai Cập
  rationale: Cách dịch địa danh tiêu chuẩn; “tại” tự nhiên khi chỉ nơi diễn ra và duy trì tình trạng an táng.
- source_word: וַ
  choice: Vậy
  rationale: Liên từ mở đầu tiếp nối mạch kể và mang sắc thái kết thúc toàn bộ trình thuật Sáng Thế Ký. “Vậy” thể hiện dòng kết luận tự nhiên; cũng có thể dịch đơn giản là “Và”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giô-sép” theo dạng tên quen thuộc trong Kinh Thánh tiếng Việt; tránh thuật ngữ chuyên môn như “ướp xác theo phương pháp Ai Cập” hoặc “quách”. Dấu chú thích [a] được đặt sau toàn câu vì chú thích liên quan đến cách mở đầu và cách diễn đạt tuổi.
