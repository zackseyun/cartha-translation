  verdict: revise
  source_fidelity: 'Bản dịch phản ánh tốt các nét chính của tiếng Hê-bơ-rơ: ý định ác chống lại Giô-sép, ý định tốt của Đức Chúa Trời, mục đích bảo toàn sự sống cho số đông. “Đã định dùng điều ấy cho điều tốt” diễn đạt tự nhiên đại từ quy chiếu về điều ác và vẫn giữ động từ cốt lõi song song. Tuy nhiên, “kết quả như ngày nay” có thể được hiểu là một kết quả tương tự hôm nay, thay vì tình trạng/kết quả hiện thấy vào ngày này mà כַּיּוֹם הַזֶּה chỉ đến.'
