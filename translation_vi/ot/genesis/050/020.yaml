  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: vi
  text: Còn các anh, các anh đã định làm điều ác chống lại tôi, nhưng Đức Chúa Trời đã định dùng điều ấy cho điều tốt, để làm nên kết quả đang thấy ngày nay[a]—giữ cho nhiều người được sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát chữ: “làm như ngày nay.” Cụm từ Hê-bơ-rơ chỉ đến kết quả hiện đang thấy rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: đã định / đã định dùng điều ấy
  rationale: Giữ cùng một động từ cốt lõi cho ý định của các anh và ý định của Đức Chúa Trời, phản ánh phép song song có chủ ý trong tiếng Hê-bơ-rơ. Ở vế sau, “dùng điều ấy” diễn đạt tự nhiên đại từ giống cái quy chiếu về רָעָה mà không hàm ý chỉ là biến điều ác thành điều tốt.
- source_word: עָלַי
  choice: chống lại tôi
  rationale: Trong kết cấu với חשב và ý định thù nghịch, עַל mang sắc thái đối nghịch; “chống lại tôi” thể hiện rõ hướng gây hại.
- source_word: רָעָה
  choice: điều ác
  rationale: Ngữ cảnh nói đến hành vi đáng trách về mặt đạo đức, không chỉ một tai họa hay thiệt hại; “điều ác” giữ được sự đối lập với “điều tốt”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ mang nghĩa số ít ở đây và chỉ Đức Chúa Trời đang hành động trong sự quan phòng.
- source_word: לְטֹבָה
  choice: cho điều tốt
  rationale: Giữ sự đối lập trực tiếp với “điều ác” và diễn đạt mục đích tốt lành.
- source_word: לְמַעַן
  choice: để
  rationale: Đánh dấu rõ quan hệ mục đích bằng lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: עֲשֹׂה כַּיּוֹם הַזֶּה
  choice: làm nên kết quả như ngày nay
  rationale: “Làm nên” chuyển tải tác động tạo ra kết quả của עשה; “như ngày nay” giữ tính chỉ xuất của thành ngữ, hướng đến kết quả hiện đang thấy rõ.
- source_word: לְהַחֲיוֹת
  choice: giữ cho ... được sống
  rationale: Thể Hiphil của חיה có nghĩa bảo toàn sự sống hoặc giữ sống; cách dịch này rõ ràng và tự nhiên.
- source_word: עַם רָב
  choice: nhiều người
  rationale: Diễn đạt một số đông được bảo toàn mạng sống mà không nhất thiết giới hạn vào một dân tộc duy nhất.
theological_decisions:
- issue: Sự quan phòng của Đức Chúa Trời và ý định gian ác của con người trong hai lần dùng חשב
  choice: Dùng cùng động từ “định” cho cả các anh và Đức Chúa Trời
  alternative: Dùng hai động từ khác nhau, chẳng hạn “toan” cho con người và “biến” cho Đức Chúa Trời
  rationale: 'Tiếng Hê-bơ-rơ cố ý đặt hai ý định song song: các anh thực sự định điều ác, còn Đức Chúa Trời thực sự định chính điều ấy cho điều tốt. Giữ cùng động từ bảo tồn sự căng thẳng thần học mà không đồng nhất cách Đức Chúa Trời hành động với tội lỗi của con người.'
- issue: Sắc thái đạo đức hay chỉ hoàn cảnh của רָעָה
  choice: Dịch là “điều ác”
  alternative: “điều hại” hoặc “tai họa”
  rationale: Hành động của các anh đối với Giô-sép mang trách nhiệm đạo đức; “điều ác” bảo tồn sức nặng ấy và sự tương phản với điều tốt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc đối chiếu của câu Hê-bơ-rơ, lặp “các anh” để nhấn mạnh chủ thể đối lập với Đức Chúa Trời; dùng dấu gạch ngang để nối mục đích cụ thể là bảo toàn sự sống của nhiều người.
