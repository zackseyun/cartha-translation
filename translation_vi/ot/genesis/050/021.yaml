base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: vi
  text: “Bây giờ, đừng sợ. Chính tôi sẽ chu cấp cho các anh và con nhỏ của các anh.” Giô-sép an ủi họ và nói những lời làm họ yên lòng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “nói với lòng họ”; cũng có thể dịch: “dịu dàng nói với họ” hoặc “nói lời trấn an họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả sắc thái liên kết của וְ và ý thời gian của עַתָּה, đồng thời tự nhiên trong lời kết luận trấn an.
- source_word: אַל תִּירָאוּ
  choice: đừng sợ
  rationale: Cách nói hiện đại, trực tiếp, giữ nguyên lực của lời ngăn cấm mang tính trấn an.
- source_word: אָנֹכִי
  choice: Chính tôi
  rationale: 'Thể hiện sự nhấn mạnh của đại từ độc lập: Giô-sép đích thân cam kết chăm lo.'
- source_word: אֲכַלְכֵּל
  choice: sẽ chu cấp cho
  rationale: Diễn đạt việc tiếp tục cung ứng nhu yếu phẩm và nuôi sống gia đình trong bối cảnh nạn đói.
- source_word: טַפְּכֶם
  choice: con nhỏ của các anh
  rationale: Giữ sắc thái chỉ trẻ nhỏ của טַף và phù hợp với quan hệ giữa Giô-sép với các anh mình.
- source_word: וַיְנַחֵם אֹתָם
  choice: Giô-sép an ủi họ
  rationale: נחם ở đây chỉ hành động an ủi, trấn an; dùng tên riêng giúp câu tiếng Việt rõ chủ thể sau lời thoại.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: nói những lời làm họ yên lòng
  rationale: Chuyển tải tự nhiên thành ngữ Hê-bơ-rơ chỉ lời nói dịu dàng, trấn an, đồng thời chú thích giữ hình ảnh nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các anh” vì Giô-sép đang nói với các anh trai; dùng “con nhỏ” để giữ sắc thái của טַף. Thành ngữ cuối câu được dịch theo nghĩa tự nhiên và kèm chú thích về hình ảnh nguyên văn.
