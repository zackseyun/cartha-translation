base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: vi
  text: Các con trai ông đã làm cho ông đúng như lời ông đã truyền cho họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: đã làm
  rationale: Động từ עשה có nghĩa rộng là “làm, thực hiện”; trong ngữ cảnh thi hành chỉ thị mai táng, “đã làm” tự nhiên và giữ được cách diễn đạt khái quát của tiếng Hê-bơ-rơ.
- source_word: בָנָיו
  choice: các con trai ông
  rationale: Danh từ chỉ rõ các con trai của Gia-cốp, không phải cách gọi chung cho mọi người con.
- source_word: לוֹ
  choice: cho ông
  rationale: Giới từ ל ở đây diễn tả hành động được thực hiện vì ông và theo ý nguyện của ông; “cho ông” là cách nói tự nhiên trong tiếng Việt.
- source_word: כֵּן כַּאֲשֶׁר
  choice: đúng như
  rationale: Cụm từ diễn tả sự phù hợp giữa việc các con trai thực hiện và điều Gia-cốp đã truyền; “đúng như” chuyển tải rõ cả ý cách thức lẫn sự tuân thủ.
- source_word: צִוָּם
  choice: ông đã truyền cho họ
  rationale: צוה mang nghĩa ra lệnh hoặc truyền bảo. “Đã truyền” có sắc thái trang trọng, tự nhiên trong văn thuật chuyện Kinh Thánh và cho thấy mệnh lệnh có trước hành động.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” duy trì mạch quy chiếu về Gia-cốp mà không thêm tên riêng vốn không có trong câu Hê-bơ-rơ.
