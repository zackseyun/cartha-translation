  yaml_path: translation/ot/genesis/050/022.yaml
  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: vi
  text: Giô-sép tiếp tục ở tại Ai Cập[a], ông và cả nhà cha mình. Giô-sép sống được 110 tuổi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cư ngụ tại Ai Cập, ông và nhà cha mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tiếp tục ở
  rationale: Động từ יָשַׁב có thể mang nghĩa ngồi, cư ngụ hoặc tiếp tục ở. Trong phần tóm lược sau cái chết của Gia-cốp, “tiếp tục ở” diễn đạt tự nhiên ý Giô-sép vẫn cư trú tại Ai Cập, đồng thời tránh lặp từ “sống” với וַיְחִי ở vế sau.
- source_word: בְּמִצְרַיִם
  choice: tại Ai Cập
  rationale: Cụm giới từ chỉ địa điểm cư trú của Giô-sép.
- source_word: הוּא וּבֵית אָבִיו
  choice: ông và cả nhà cha mình
  rationale: בֵּית אָבִיו theo nghĩa đen là “nhà của cha ông”, nhưng trong ngữ cảnh chỉ toàn thể gia đình hoặc gia hộ của cha. “Cả nhà cha mình” giữ được hình ảnh Hê-bơ-rơ và vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וַיְחִי
  choice: sống được
  rationale: Động từ חיה ở đây dẫn vào tổng số tuổi thọ; “sống được ... tuổi” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 110 tuổi
  rationale: Diễn đạt chính xác tuổi thọ một trăm mười năm bằng dạng số dễ đọc; khi đi với “sống được”, tiếng Việt tự nhiên dùng “tuổi”.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch phân biệt יָשַׁב (“tiếp tục ở”) với חיה (“sống được”), đồng thời giữ cách nói giàu sắc thái gia tộc “nhà cha mình” và chú thích phương án sát chữ hơn.
