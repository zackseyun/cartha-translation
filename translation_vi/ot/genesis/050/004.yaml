  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa,” “xin,” “quý vị” để thể hiện thái độ nhún nhường của Giô-sép trước hoàng gia; giữ câu chưa khép lại vì nội dung lời nhắn tiếp tục ở câu 5.
