base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: vi
  text: 'Khi những ngày khóc tang cha đã qua[a], Giô-sép thưa với triều đình Pha-ra-ôn: “Nếu tôi được quý vị chiếu cố, xin hãy thưa với Pha-ra-ôn rằng[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi những ngày than khóc ông ấy đã qua.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “nói vào tai Pha-ra-ôn,” một thành ngữ có nghĩa là nói để Pha-ra-ôn nghe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: đã qua
  rationale: Động từ עבר chỉ thời gian trôi qua hoặc kết thúc; cách diễn đạt này tự nhiên và giữ đúng trình tự kể chuyện.
- source_word: יְמֵי בְכִיתוֹ
  choice: những ngày khóc tang cha
  rationale: בכי nghĩa đen là sự khóc; trong bối cảnh tang lễ, “khóc tang” truyền đạt đúng ý. Đại từ hậu tố có thể chỉ Gia-cốp là người được khóc thương; thêm “cha” làm rõ quan hệ theo văn cảnh mà không đổi đối tượng.
- source_word: אֶל־בֵּית פַּרְעֹה
  choice: với người trong hoàng gia Pha-ra-ôn
  rationale: בֵּית פַּרְעֹה ở đây chỉ những người thuộc hoàng gia hoặc triều đình, là trung gian chuyển lời, chứ không đơn thuần là tòa nhà.
- source_word: אִם־נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: Nếu tôi được đẹp lòng quý vị
  rationale: Giữ cấu trúc thỉnh cầu có điều kiện và chuyển thành thành ngữ tiếng Việt tự nhiên; נָא góp phần tạo sắc thái nhún nhường.
- source_word: דַּבְּרוּ־נָא
  choice: xin quý vị trình lại
  rationale: Mệnh lệnh số nhiều kèm tiểu từ khẩn khoản; “xin” giữ phép lịch sự, còn “trình lại” phù hợp lời thỉnh cầu được chuyển lên vua.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: để Pha-ra-ôn nghe
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ nghĩa đen là “vào tai Pha-ra-ôn,” tức nói cho ông nghe.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dấu hai chấm và “rằng” cho thấy lời nhắn tiếp tục sang câu sau, tương ứng với công thức dẫn lời trong tiếng Hê-bơ-rơ.
