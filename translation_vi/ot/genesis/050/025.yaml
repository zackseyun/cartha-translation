  text: וַ/יַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִתֶ֥ם אֶת עַצְמֹתַ֖/י מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: vi
  text: 'Giô-sép bắt con cháu Y-sơ-ra-ên thề rằng: “Đức Chúa Trời chắc chắn sẽ đoái đến anh em; anh em phải đem hài cốt tôi lên khỏi nơi này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע ... אֶת
  choice: bắt ... thề
  rationale: Cấu trúc Híp-ri ở dạng khiến khiến người khác tuyên thệ; cách dịch này tự nhiên và giữ rõ lực của động từ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  rationale: Trong ngữ cảnh này, cụm từ chỉ cộng đồng hậu duệ của Y-sơ-ra-ên, không chỉ các con trai trực tiếp.
- source_word: פָּקֹד יִפְקֹד
  choice: chắc chắn sẽ đoái đến
  rationale: Động từ nguyên thể tuyệt đối đi với động từ hữu hạn tạo sắc thái nhấn mạnh chắc chắn; 'đoái đến' diễn tả sự lưu tâm và can thiệp của Đức Chúa Trời mà không thu hẹp thành một hành động cụ thể.
- source_word: וְהַעֲלִתֶם
  choice: anh em phải đem ... lên
  rationale: Hình thái hoàn thành nối tiếp trong lời thề mang lực nghĩa vụ; 'lên' bảo toàn hướng chuyển động trong nguyên văn.
- source_word: עַצְמֹתַי
  choice: hài cốt tôi
  rationale: '''Hài cốt'' là cách nói tiếng Việt tự nhiên, trang trọng đối với xương của người đã khuất.'
- source_word: מִזֶּה
  choice: khỏi nơi này
  rationale: Diễn đạt tự nhiên ý rời khỏi địa điểm hiện tại.
theological_decisions:
- issue: Ý nghĩa của פקד khi Đức Chúa Trời hành động
  choice: đoái đến
  alternative: thăm viếng / chăm nom
  rationale: Giữ được độ rộng nghĩa về việc Đức Chúa Trời lưu tâm và can thiệp giải cứu, không áp đặt một cơ chế thần học cụ thể.
- issue: Lực tình thái của וְהַעֲלִתֶם trong lời thề
  choice: phải đem
  alternative: sẽ đem
  rationale: Vì lời này nằm trong việc bắt thề, mệnh đề mang nghĩa vụ chứ không đơn thuần là dự báo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' để xưng hô với cộng đồng con cháu Y-sơ-ra-ên; thêm 'khi ấy' nhằm thể hiện quan hệ thời điểm ngầm giữa việc Đức Chúa Trời đoái đến họ và việc họ đem hài cốt Giô-sép đi, không làm thay đổi nội dung.
