  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְצַ֨ו יוֹסֵ֤ף אֶת עֲבָדָי/ו֙ אֶת הָ/רֹ֣פְאִ֔ים לַ/חֲנֹ֖ט אֶת אָבִ֑י/ו וַ/יַּחַנְט֥וּ הָ/רֹפְאִ֖ים אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: vi
  text: Rồi Giô-sép truyền cho các đầy tớ mình[a], là những thầy thuốc, ướp xác cha mình[b]; và các thầy thuốc ướp xác Y-sơ-ra-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nô lệ của mình”; từ Hê-bơ-rơ có thể chỉ đầy tớ hoặc nô lệ tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “Y-sơ-ra-ên,” tức Gia-cốp.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền cho
  rationale: Động từ צוה diễn tả việc đưa ra chỉ thị có thẩm quyền; “truyền cho” giữ được sắc thái ấy và phù hợp văn phong tường thuật trang trọng.
- source_word: עֲבָדָיו
  choice: các đầy tớ mình
  rationale: עבד có thể chỉ đầy tớ hoặc nô lệ. Trong ngữ cảnh này, từ này nói đến những người phục vụ trong bộ máy gia đình hoặc triều đình của Giô-sép, cụ thể là các thầy thuốc; địa vị lệ thuộc không phải trọng tâm.
- source_word: הָרֹפְאִים
  choice: những thầy thuốc
  rationale: Danh từ hóa từ רפא chỉ những người hành nghề chữa trị. “Thầy thuốc” tự nhiên, trang trọng và thích hợp với bối cảnh cung đình cổ đại.
- source_word: לַחֲנֹט
  choice: ướp xác
  rationale: Trong bối cảnh Ai Cập, חנט chỉ việc bảo quản thi thể bằng phương pháp ướp xác; cách dịch này rõ nghĩa và chính xác hơn cách nói chung chung về chuẩn bị mai táng.
- source_word: אָבִיו
  choice: cha mình
  rationale: Cụm sở hữu chỉ cha của Giô-sép; “mình” giúp quy chiếu tự nhiên về chủ ngữ trong tiếng Việt.
- source_word: וַיַּחַנְטוּ
  choice: ướp xác
  rationale: Lặp lại cùng động từ חנט để giữ sự liên kết và nhịp kể của nguyên văn.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Nguyên văn dùng tên Y-sơ-ra-ên chứ không dùng Gia-cốp; bản dịch giữ nguyên lựa chọn tên gọi này.
theological_decisions:
- issue: Cách dịch עבד trong bối cảnh nhân sự thuộc nhà Giô-sép
  choice: đầy tớ
  alternative: nô lệ
  rationale: Câu này tập trung vào mệnh lệnh Giô-sép giao cho những người phục vụ mình, được xác định cụ thể là các thầy thuốc, chứ không nhấn mạnh địa vị pháp lý của họ. Chú thích giữ lại khả năng dịch là “nô lệ” để không xóa bỏ độ rộng nghĩa của từ Hê-bơ-rơ.
- issue: Tên gọi của người cha ở cuối câu
  choice: Y-sơ-ra-ên
  alternative: Gia-cốp
  rationale: Việc giữ “Y-sơ-ra-ên” tôn trọng cách gọi có chủ ý của nguyên văn và không tự ý đồng nhất hóa tên trong chính văn; chú thích làm rõ đây là Gia-cốp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thầy thuốc” thay vì “bác sĩ” để phù hợp bối cảnh cổ đại; dùng “ướp xác” vì rõ nghĩa trong bối cảnh Ai Cập. Cấu trúc lặp “các thầy thuốc… các thầy thuốc” được giữ để phản ánh sự lặp lại trong nguyên văn.
