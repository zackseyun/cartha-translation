review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt các yếu tố chính của tiếng Hê-bơ-rơ: các con trai, việc mang thi hài đến đất Ca-na-an, hang tại cánh đồng Mác-pê-la, giao dịch mua cánh đồng từ Ép-rôn người Hê-tít để làm phần đất chôn cất, và vị trí đối diện Mam-rê. Tuy nhiên, “về đất Ca-na-an” thêm sắc thái trở về không được đánh dấu trực tiếp trong câu, và cấu trúc “hang thuộc cánh đồng..., là cánh đồng...” có thể gây lúng túng về quan hệ hồi chỉ.'
  naturalness: Câu văn trang trọng và nhìn chung dễ hiểu, nhưng cụm “là cánh đồng Áp-ra-ham đã mua” ngay sau “hang thuộc cánh đồng” chưa thật trôi chảy. Dùng “tức là cánh đồng mà...” làm rõ rằng chính cánh đồng là đối tượng được mua. “Phần đất sở hữu để chôn cất” được chỉnh nhẹ thành “phần đất sở hữu cho việc chôn cất” để tự nhiên hơn.
  terminology: Các tên riêng Áp-ra-ham, Ép-rôn, Hê-tít và Mam-rê phù hợp cách phiên âm Kinh Thánh tiếng Việt. “Phần đất sở hữu” giữ được ý אֲחֻזַּת (một bất động sản/phần sở hữu) và mục đích chôn cất; không cần chú thích cho câu này.
  issues:
  - severity: low
    issue: “về đất Ca-na-an” có sắc thái trở về.
    rationale: Hậu tố chỉ hướng trong אַרְצָה כְּנַעַן chỉ đích đến “đến đất Ca-na-an”; dù bối cảnh khiến “về” có thể hiểu được, “đến” bám sát văn bản hơn và không thêm sắc thái.
  - severity: medium
    issue: Mệnh đề hồi chỉ về cánh đồng chưa rõ và hơi gượng.
    rationale: Trong tiếng Hê-bơ-rơ, אֶת־הַשָּׂדֶה là tân ngữ được nhắc lại của động từ “mua”. Cấu trúc Việt ngữ “hang thuộc cánh đồng..., là cánh đồng...” dễ làm người đọc khựng lại. “tức là cánh đồng mà Áp-ra-ham đã mua” làm rõ đối tượng mua mà vẫn giữ quan hệ giữa hang và cánh đồng.
  revised_text: Các con trai của ông mang ông đến đất Ca-na-an và chôn ông trong hang thuộc cánh đồng Mác-pê-la, tức là cánh đồng mà Áp-ra-ham đã mua của Ép-rôn, người Hê-tít, làm phần đất sở hữu cho việc chôn cất, đối diện Mam-rê.
