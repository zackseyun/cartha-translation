  text: וַ/יִּשְׂא֨וּ אֹת֤/וֹ בָנָי/ו֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יִּקְבְּר֣וּ אֹת֔/וֹ בִּ/מְעָרַ֖ת שְׂדֵ֣ה הַ/מַּכְפֵּלָ֑ה אֲשֶׁ֣ר קָנָה֩ אַבְרָהָ֨ם אֶת הַ/שָּׂדֶ֜ה לַ/אֲחֻזַּת קֶ֗בֶר מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י עַל פְּנֵ֥י מַמְרֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: vi
  text: Các con trai của ông mang ông đến đất Ca-na-an và chôn ông trong hang thuộc cánh đồng Mác-pê-la, tức là cánh đồng mà Áp-ra-ham đã mua của Ép-rôn, người Hê-tít, làm phần đất sở hữu cho việc chôn cất, đối diện Mam-rê.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: đưa ông
  rationale: Trong ngữ cảnh vận chuyển thi hài Gia-cốp, נשׂא chỉ việc mang/đưa thi hài đi; “đưa ông” tự nhiên và trang trọng trong tiếng Việt, còn ý mai táng được câu sau xác định rõ.
- source_word: בָנָיו
  choice: các con trai ông
  rationale: Danh từ Hê-bơ-rơ là giống đực số nhiều và ở đây chỉ chính các con trai của Gia-cốp.
- source_word: אַרְצָה כְּנַעַן
  choice: về đất Ca-na-an
  rationale: Hậu tố chỉ hướng được thể hiện bằng “về”; “đất Ca-na-an” phản ánh đầy đủ אֶרֶץ và hợp với việc trở về nơi chôn cất.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: trong hang thuộc cánh đồng Mác-pê-la
  rationale: Cách diễn đạt này giữ quan hệ sở thuộc trong chuỗi cấu trúc “hang—cánh đồng—Mác-pê-la” mà vẫn tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: là cánh đồng Áp-ra-ham đã mua
  rationale: Mệnh đề Hê-bơ-rơ dùng cấu trúc hồi chỉ với tân ngữ “cánh đồng”; tiếng Việt diễn đạt tự nhiên bằng cách nêu rõ cánh đồng là vật Áp-ra-ham mua, tránh hiểu sai rằng ông dùng cánh đồng làm phương tiện thanh toán.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: làm phần đất sở hữu để chôn cất
  rationale: אֲחֻזָּה nhấn mạnh một tài sản hay phần đất được nắm giữ, còn קֶבֶר nêu mục đích chôn cất; bản dịch giữ cả quyền sở hữu lẫn công dụng.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: của Ép-rôn, người Hê-tít
  rationale: “Mua của” là kết hợp từ tự nhiên cho nguồn giao dịch; “người Hê-tít” là cách gọi dân tộc rõ ràng trong tiếng Việt hiện đại.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: đối diện Mam-rê
  rationale: Cụm giới từ diễn tả vị trí ở phía trước hoặc đối diện một địa điểm; “đối diện” giữ quan hệ không gian mà không giản lược thành “gần”.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật trang trọng, sáng rõ và hiện đại. Giữ các danh xưng riêng theo lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt; không thêm diễn giải thần học. Cấu trúc câu được điều chỉnh để làm rõ cánh đồng là đối tượng được mua, phù hợp cú pháp Hê-bơ-rơ và tránh sự tối nghĩa.
