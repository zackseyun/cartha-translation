  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: Pha-ra-ôn, mệnh lệnh “đi lên”, việc chôn cất cha, và ý sai khiến của Hiphil הִשְׁבִּיעֶךָ (“đã bắt ngươi thề”). Tuy nhiên, cụm “như lời ông đã bắt ngươi thề” thêm ý “lời” không có trong nguyên văn và làm quan hệ cú pháp mơ hồ.'
