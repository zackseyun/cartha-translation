translation:
  language: vi
  text: 'Pha-ra-ôn nói: “Hãy đi lên và chôn cất cha ngươi, như ông đã bắt ngươi thề.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ với waw liên tiếp tiếp nối mạch tường thuật; tiếng Việt tự nhiên không cần dịch waw bằng một liên từ riêng trong câu này.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Danh hiệu quen dùng trong tiếng Việt dành cho vua Ai Cập.
- source_word: עֲלֵה
  choice: hãy đi lên
  rationale: Giữ sắc thái phương hướng của עלה khi đi từ Ai Cập lên Ca-na-an, thay vì giản lược thành “hãy đi”.
- source_word: וּקְבֹר
  choice: và chôn cất
  rationale: Diễn đạt rõ nghĩa קבר bằng cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: אֶת אָבִיךָ
  choice: cha ngươi
  rationale: Thể hiện trực tiếp danh từ với hậu tố ngôi hai số ít giống đực; “ngươi” phù hợp với lời của vua nói với một bề tôi trong bối cảnh cổ đại.
- source_word: כַּאֲשֶׁר
  choice: như lời
  rationale: Trong tiếng Việt, “như lời ...” liên kết tự nhiên sự cho phép với lời thề đã được yêu cầu trước đó.
- source_word: הִשְׁבִּיעֶךָ
  choice: ông đã bắt ngươi thề
  rationale: 'Giữ thể sai khiến Hiphil của שׁבע: người cha khiến Giô-sép phải thề, chứ không chỉ đơn thuần là Giô-sép tự thề.'
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Giữ “đi lên” vì có giá trị phương hướng; dùng “cha ngươi” để phù hợp quan hệ vua–bề tôi và bối cảnh cổ đại.
