revisions:
- from: '“Các con hãy nói với Giô-sép thế này: ‘Xin em tha cho sự vi phạm và tội lỗi của các anh em, vì họ đã lấy điều ác đối lại với em. Bây giờ, xin em tha cho sự vi phạm của những tôi tớ Đức Chúa Trời của cha em.’” Giô-sép khóc khi họ nói với ông những lời ấy.'
  to: '“Hãy nói với Giô-sép thế này: ‘Xin em tha sự vi phạm và tội lỗi của các anh, vì các anh đã lấy điều ác báo đáp em. Bây giờ, xin em tha sự vi phạm của những tôi tớ của Đức Chúa Trời của cha em.’” Giô-sép khóc khi họ nói với ông.'
