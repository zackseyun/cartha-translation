source:
  edition: WLC
  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Joseph: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Joseph wept when they spoke to him.'
translation:
  language: vi
  text: '“Hãy nói với Giô-sép thế này: ‘Xin em tha sự vi phạm và tội lỗi của các anh, vì các anh đã lấy điều ác báo đáp em. Bây giờ, xin em tha sự vi phạm của những tôi tớ của Đức Chúa Trời của cha em.’” Giô-sép khóc khi họ nói với ông.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: xin ... tha
  rationale: Động từ נָשָׂא theo nghĩa đen là “mang/cất đi”, nhưng trong kết hợp với “sự vi phạm” mang nghĩa tha thứ; tiểu từ נָא được diễn đạt bằng “xin” để giữ lời khẩn cầu.
- source_word: פֶּשַׁע ... וְחַטָּאתָם
  choice: sự vi phạm và tội lỗi
  rationale: 'Giữ hai thuật ngữ riêng biệt: פֶּשַׁע nhấn mạnh hành vi xâm phạm hoặc phản nghịch, còn חַטָּאת chỉ tội lỗi nói chung.'
- source_word: כִּי
  choice: vì
  rationale: Trong ngữ cảnh này, liên từ nêu lý do cho lời xin tha; cách dịch “vì” tự nhiên và không làm nhẹ nghịch lý rằng chính việc làm ác là điều cần được tha.
- source_word: רָעָה גְמָלוּךָ
  choice: họ đã lấy điều ác đối lại với em
  rationale: גמל với bổ ngữ רעה diễn tả việc đối xử hoặc báo đáp bằng điều ác; cách dịch này giữ sắc thái hành động có chủ ý mà vẫn tự nhiên trong tiếng Việt.
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  choice: những tôi tớ Đức Chúa Trời của cha em
  rationale: Giữ cấu trúc sở thuộc và lời tự nhận khiêm nhường của các anh; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: khi họ nói với ông những lời ấy
  rationale: Danh động từ số nhiều có chủ thể là “họ”; thêm “những lời ấy” để diễn đạt tự nhiên đối tượng ngầm của hành động nói trong tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa tội lỗi đối với Giô-sép và tư cách tôi tớ của Đức Chúa Trời
  choice: Giữ nguyên hai lời xin tha song song, không giải thích rằng tư cách tôi tớ là căn cứ bảo đảm sự tha thứ.
  alternative: Diễn giải rằng Giô-sép phải tha họ vì họ cùng thờ Đức Chúa Trời.
  rationale: Bản Hê-bơ-rơ đặt hai ý cạnh nhau nhưng không xác định tường minh quan hệ thần học vượt quá lời khẩn cầu; bản dịch không nên bổ sung lập luận giáo lý.
- issue: Cách hiểu “Đức Chúa Trời của cha em”
  choice: Giữ số ít “cha em” và không đồng nhất hóa bằng chú giải trong chính văn.
  alternative: Đổi thành “Đức Chúa Trời của tổ phụ chúng ta” hoặc nêu đích danh Gia-cốp.
  rationale: אָבִיךָ là “cha của em/ngươi”; giữ nguyên cách xưng hô và độ cụ thể của nguồn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “các anh em/em” phản ánh quan hệ gia đình trong lời được thuật lại; ở câu trần thuật dùng “ông” cho Giô-sép. Tên riêng dùng dạng quen thuộc trong tiếng Việt: Giô-sép.'
