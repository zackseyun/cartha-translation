  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: vi
  text: Cả chiến xa[b] lẫn kỵ binh đều đi lên cùng ông[a], và đoàn người ấy rất đông đảo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đi lên” cũng có thể hiểu là “cùng đi” hoặc “lên đường” trong ngữ cảnh hành trình.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng “chiến xa” ở số ít với nghĩa tập hợp, tức là một lực lượng chiến xa.
    reason: lexical_alternative
  - marker: c
    text: 'Dịch sát: “đoàn ấy rất nặng”; trong ngữ cảnh, nghĩa là rất đông đảo hoặc có quy mô rất lớn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: đi lên
  rationale: Giữ nghĩa thông thường của עלה và sắc thái phương hướng trong hành trình từ Ai Cập lên Ca-na-an; chủ ngữ ghép là chiến xa và kỵ binh.
- source_word: עִמּוֹ
  choice: cùng ông
  rationale: Dịch trực tiếp giới từ với hậu tố đại từ; trong ngữ cảnh, “ông” chỉ Giô-sép.
- source_word: גַּם ... גַּם
  choice: cả ... lẫn ... cũng
  rationale: Cấu trúc này diễn đạt sự bổ sung có nhấn mạnh và liên kết chiến xa với kỵ binh thành một chủ ngữ ghép tự nhiên trong tiếng Việt.
- source_word: רֶכֶב
  choice: các chiến xa
  rationale: Danh từ số ít có nghĩa tập hợp, chỉ lực lượng chiến xa; dùng số nhiều trong tiếng Việt để diễn đạt tự nhiên.
- source_word: פָּרָשִׁים
  choice: kỵ binh
  rationale: Chỉ những người cưỡi ngựa trong một lực lượng hộ tống; “kỵ binh” ngắn gọn, rõ nghĩa và phù hợp văn phong trang trọng hiện đại.
- source_word: הַמַּחֲנֶה
  choice: đoàn người ấy
  rationale: Trong bối cảnh đoàn tang đang di chuyển, từ này chỉ toàn thể đoàn tùy tùng hơn là một nơi đóng trại; “đoàn người ấy” tránh gợi ý một doanh trại cố định.
- source_word: כָּבֵד מְאֹד
  choice: rất đông đảo
  rationale: Nghĩa đen là “rất nặng,” nhưng khi nói về một đoàn người, thành ngữ này biểu thị quy mô lớn, hùng hậu hoặc đáng kể; “rất đông đảo” truyền đạt rõ nét nghĩa chính trong ngữ cảnh.
