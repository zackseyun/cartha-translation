base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: vi
  text: Vậy, Giô-sép đi lên để chôn cất cha mình[a]. Cùng ông đi lên là tất cả các bề tôi của Pha-ra-ôn, các trưởng lão trong triều đình của Pha-ra-ôn, và tất cả các trưởng lão của đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “đi lên” phản ánh cách nói quen thuộc khi mô tả hành trình từ Ai Cập đến Ca-na-an.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: đi lên
  rationale: Giữ nghĩa cơ bản của עָלָה và cách nói địa lý quen thuộc khi kể hành trình từ Ai Cập đến Ca-na-an.
- source_word: לִקְבֹּר
  choice: để chôn cất
  rationale: Diễn đạt trực tiếp mục đích của chuyến đi; “chôn cất” tự nhiên và trang trọng trong văn cảnh tang lễ.
- source_word: אָבִיו
  choice: cha mình
  rationale: Phản ánh đại từ sở hữu ngôi thứ ba mà không thêm sắc thái nhấn mạnh.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: Cùng đi lên với ông
  rationale: Giữ sự lặp lại của động từ עָלָה và đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: tất cả các bề tôi của Pha-ra-ôn
  rationale: Trong bối cảnh triều đình, “bề tôi” giữ ý những người phục vụ vua mà không thu hẹp họ thành một cấp quan chức cụ thể hay nhấn mạnh thân phận nô lệ.
- source_word: זִקְנֵי בֵיתוֹ
  choice: các trưởng lão trong hoàng gia của vua
  rationale: Giữ nghĩa “trưởng lão” của זָקֵן; “hoàng gia” diễn đạt בַּיִת theo nghĩa tập thể thuộc triều đình Pha-ra-ôn, còn “của vua” làm rõ hậu tố “của ông” quy về Pha-ra-ôn.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: và tất cả các trưởng lão của đất Ai Cập
  rationale: Bảo toàn cả “trưởng lão” và “đất,” cho thấy nhóm lãnh đạo rộng hơn ngoài hoàng gia.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách nói địa lý “đi lên” cùng nhịp lặp của nguyên văn Hê-bơ-rơ; dùng “bề tôi” và “trưởng lão” để tránh xác định quá mức chức vị trong triều đình.
