source:
  edition: WLC
  text: וְ/כֹל֙ בֵּ֣ית יוֹסֵ֔ף וְ/אֶחָ֖י/ו וּ/בֵ֣ית אָבִ֑י/ו רַ֗ק טַפָּ/ם֙ וְ/צֹאנָ֣/ם וּ/בְקָרָ֔/ם עָזְב֖וּ בְּ/אֶ֥רֶץ גֹּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: vi
  text: cùng toàn thể gia quyến của Giô-sép[a], các anh em ông và gia quyến của cha ông; họ chỉ để lại con nhỏ[b], các bầy chiên dê[c] và các đàn bò của mình tại xứ Gô-sen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gia quyến” dịch từ từ Hê-bơ-rơ có nghĩa đen là “nhà”; tại đây từ này chỉ gia đình hoặc những người thuộc một hộ, không phải tòa nhà.
    reason: lexical_alternative
  - marker: b
    text: “Con nhỏ” chỉ những trẻ còn nhỏ tuổi.
    reason: lexical_clarification
  - marker: c
    text: Từ Hê-bơ-rơ chỉ chung các gia súc nhỏ, chủ yếu là chiên và dê.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכֹל בֵּית יוֹסֵף
  choice: cùng toàn thể gia quyến của Giô-sép
  rationale: וְ nối tiếp danh sách ở câu trước; כֹל diễn tả tính toàn thể. בֵּית יוֹסֵף ở đây chỉ gia đình hay gia quyến của Giô-sép, không phải một tòa nhà.
- source_word: וְאֶחָיו
  choice: các anh em ông
  rationale: Dạng số nhiều của אָח trong ngữ cảnh này chỉ các anh em trai của Giô-sép; tiếng Việt tự nhiên không cần lặp liên từ trước từng thành phần trong danh sách.
- source_word: וּבֵית אָבִיו
  choice: và gia quyến của cha ông
  rationale: בֵּית cũng mang nghĩa đơn vị gia đình; 'cha ông' giữ đúng quan hệ sở hữu trong tiếng Hê-bơ-rơ.
- source_word: רַק
  choice: chỉ
  rationale: Đánh dấu phần ngoại lệ, tức những người và vật duy nhất được để lại; đặt trước động từ là tự nhiên trong tiếng Việt mà vẫn giữ phạm vi giới hạn rõ ràng.
- source_word: טַפָּם
  choice: con nhỏ của mình
  rationale: טַף chỉ trẻ nhỏ chứ không phải mọi người con; 'con nhỏ' là cách nói hiện đại, rõ nghĩa.
- source_word: וְצֹאנָם
  choice: các bầy chiên dê của mình
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, nhất là chiên và dê; diễn đạt cụ thể tránh khiến người đọc hiểu là chỉ có chiên.
- source_word: וּבְקָרָם
  choice: các đàn bò của mình
  rationale: בָּקָר chỉ bò hay đại gia súc; 'đàn bò' tự nhiên và tạo cặp tương ứng với 'bầy chiên dê'.
- source_word: עָזְבוּ
  choice: họ để lại
  rationale: Động từ mang nghĩa để lại phía sau, không hàm ý bỏ rơi; thêm chủ ngữ 'họ' giúp câu tiếng Việt trọn vẹn.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: tại xứ Gô-sen
  rationale: Giữ rõ אֶרֶץ là một vùng đất; 'xứ' là từ trang trọng, quen thuộc và phù hợp với địa danh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được nối với ngữ cảnh trước bằng 'cùng'; dấu chấm phẩy phân định danh sách người đi với nhóm duy nhất được để lại. Đại từ 'ông' quy chiếu về Giô-sép; 'của mình' dùng chung cho ba danh từ sở hữu để tránh lặp nặng nề.
