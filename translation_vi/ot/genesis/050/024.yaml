base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: vi
  text: 'Giô-sép nói với các anh em mình: “Tôi sắp qua đời, nhưng Đức Chúa Trời chắc chắn sẽ đoái đến anh em[a] và đưa anh em lên khỏi xứ này, đến xứ mà Ngài đã thề với Áp-ra-ham, Y-sác và Gia-cốp.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chắc chắn sẽ viếng thăm anh em.” Thành ngữ Hê-bơ-rơ có thể chỉ việc Đức Chúa Trời quyết định lưu tâm và can thiệp vì dân Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: các anh em mình
  rationale: Danh từ giống đực số nhiều kèm hậu tố ngôi ba số ít chỉ các anh em trai của Giô-sép trong ngữ cảnh Sáng Thế Ký.
- source_word: אָנֹכִי מֵת
  choice: Tôi sắp qua đời
  rationale: Cấu trúc với phân từ diễn tả cái chết đang đến gần; cách nói này tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt.
- source_word: פָּקֹד יִפְקֹד
  choice: chắc chắn sẽ đoái đến
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ chưa hoàn thành nhấn mạnh tính chắc chắn. “Đoái đến” giữ được ý Đức Chúa Trời lưu tâm và can thiệp, nhưng không quy định quá cụ thể cách Ngài hành động.
- source_word: וֵאלֹהִים
  choice: nhưng Đức Chúa Trời
  rationale: 'Liên từ được diễn đạt theo sắc thái tương phản tự nhiên: Giô-sép sắp chết, nhưng Đức Chúa Trời vẫn sẽ hành động.'
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: và đưa anh em lên
  rationale: Giữ hình ảnh phương hướng của thể Hiphil động từ עלה, tức khiến đi lên hoặc đưa lên.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: khỏi xứ này
  rationale: Diễn đạt trực tiếp việc rời khỏi Ai Cập, là nơi Giô-sép đang nói.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: đến xứ mà Ngài đã thề ban
  rationale: Tiếng Hê-bơ-rơ nói sát nghĩa là “xứ mà Ngài đã thề”; thêm “ban” làm rõ bổ ngữ được ngầm hiểu từ lời hứa về đất mà không làm thay đổi nội dung.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: cho Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Giữ đầy đủ ba tên trong công thức tổ phụ, đồng thời dùng cấu trúc tiếng Việt tự nhiên.
theological_decisions:
- issue: Bản chất hành động được hứa trong פָּקֹד יִפְקֹד
  choice: Đức Chúa Trời chắc chắn sẽ đoái đến dân Ngài, hàm ý Ngài lưu tâm và hành động cho họ.
  alternative: Đức Chúa Trời chắc chắn sẽ viếng thăm anh em.
  rationale: “Đoái đến” tránh để người đọc hiểu đây chỉ là một cuộc viếng thăm theo nghĩa thông thường, đồng thời giữ được độ rộng và sắc thái giao ước của động từ.
- issue: Bổ ngữ ngầm hiểu của lời thề về đất
  choice: “đã thề ban”
  alternative: “đã thề”
  rationale: “Ban” được ngầm hiểu rõ trong ngữ cảnh lời hứa về đất và cần thiết để câu tiếng Việt tự nhiên, nhưng không thêm một nội dung thần học mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; “anh em” phù hợp với lời Giô-sép nói cùng các anh em trai. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
