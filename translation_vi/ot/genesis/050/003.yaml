base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: vi
  text: Người ta dành đủ bốn mươi ngày cho ông, vì đó là thời gian dành cho việc ướp xác. Người Ai Cập khóc thương ông bảy mươi ngày.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: Người ta dành đủ bốn mươi ngày cho ông
  rationale: Động từ מלא nói đến việc một khoảng thời gian quy định được hoàn tất. Cách diễn đạt với chủ thể phiếm chỉ “người ta” tự nhiên trong tiếng Việt và không xác định tác nhân cụ thể ngoài văn bản.
- source_word: כִּי כֵּן
  choice: vì ... cần đủ từng ấy ngày
  rationale: Giữ chức năng giải thích của cụm từ và liên kết tự nhiên thời hạn bốn mươi ngày với quy trình ướp xác.
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: việc ướp xác cần đủ từng ấy ngày
  rationale: Trong ngữ cảnh câu trước, חֲנֻטִים chỉ việc ướp xác; bản dịch diễn đạt tự nhiên ý các ngày dành cho quy trình này phải được hoàn tất.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: khóc thương ông
  rationale: Giữ nghĩa chính của בכה là khóc, đồng thời diễn đạt tự nhiên đối tượng được khóc thương mà không biến thành thuật ngữ nghi lễ.
- source_word: מִצְרַיִם
  choice: Người Ai Cập
  rationale: Địa danh “Ai Cập” được dùng tập thể để chỉ dân Ai Cập; tiếng Việt cần nêu rõ con người là chủ thể khóc thương để câu tự nhiên.
- source_word: שִׁבְעִים יוֹם
  choice: trong bảy mươi ngày
  rationale: Chuyển trực tiếp con số và thêm “trong” để biểu thị khoảng thời gian tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ướp xác” phù hợp ngữ cảnh Ai Cập cổ đại; dùng “ông” để chỉ Gia-cốp một cách kính trọng, nhất quán với lối kể chuyện.
