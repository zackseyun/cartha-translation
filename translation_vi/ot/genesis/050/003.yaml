review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các dữ kiện chính: bốn mươi ngày liên hệ với việc ướp xác và người Ai Cập khóc thương ông bảy mươi ngày. Tuy nhiên, từ “cần” thêm sắc thái tất yếu/quy định không được nêu trực tiếp trong tiếng Hê-bơ-rơ; “đó là thời gian dành cho việc ướp xác” sát hơn với mệnh đề giải thích כִּי כֵּן.'
  naturalness: Văn phong rõ ràng, hiện đại và tự nhiên. Bản sửa giữ cách nói phiếm chỉ “người ta” phù hợp với động từ số nhiều không nêu chủ thể, đồng thời tránh lặp cách diễn đạt “đủ từng ấy ngày”.
  terminology: “Ướp xác” là thuật ngữ đúng và tự nhiên cho חֲנֻטִים trong bối cảnh Ai Cập cổ đại. “Khóc thương” truyền đạt tốt động từ “khóc/wept” mà không áp đặt ý nghĩa nghi lễ mạnh hơn. “Người Ai Cập” làm rõ địa danh tập thể מִצְרַיִם một cách tự nhiên.
  issues:
  - severity: low
    issue: Cụm “việc ướp xác cần đủ từng ấy ngày” thêm sắc thái “cần” và diễn đạt tham chiếu gián tiếp.
    rationale: Nguyên văn giải thích rằng đây là cách/số ngày của việc ướp xác được hoàn tất, chứ không trực tiếp khẳng định một yêu cầu. Đổi thành “đó là thời gian dành cho việc ướp xác” giữ ý giải thích mà không thêm sắc thái tình thái.
  revised_text: Người ta dành đủ bốn mươi ngày cho ông, vì đó là thời gian dành cho việc ướp xác. Người Ai Cập khóc thương ông bảy mươi ngày.
