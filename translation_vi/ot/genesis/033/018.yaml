  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: vi
  text: Gia-cốp đến nơi an toàn tại thành Si-chem[a], trong xứ Ca-na-an, khi ông từ Pha-đan A-ram đến; rồi ông đóng trại phía trước thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Gia-cốp đến Sa-lem, một thành của Si-chem.” Từ Hê-bơ-rơ שָׁלֵם (shalem) có thể được hiểu là “an toàn, bình an” hoặc được đọc như địa danh “Sa-lem.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đến
  rationale: Động từ בוא ở dạng kể chuyện diễn tả việc Gia-cốp đến nơi; “đến” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: שָׁלֵם
  choice: bình an
  rationale: 'Hiểu từ này theo chức năng trạng ngữ, mô tả tình trạng của Gia-cốp khi đến: nguyên vẹn, an toàn, bình an. Cách hiểu như địa danh “Sa-lem” vẫn được giữ trong chú thích vì văn bản Hê-bơ-rơ cho phép cả hai cách đọc.'
- source_word: עִיר שְׁכֶם
  choice: thành Si-chem
  rationale: Cụm kết cấu được hiểu tự nhiên là thành mang tên Si-chem; “thành Si-chem” rõ ràng và phù hợp cách nói tiếng Việt.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: trong xứ Ca-na-an
  rationale: Mệnh đề quan hệ xác định vị trí địa lý của Si-chem. Tiếng Việt có thể lược đại từ quan hệ mà vẫn giữ đầy đủ ý nghĩa.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: khi ông từ Pha-đan A-ram trở về
  rationale: Giới từ בְּ với động từ nguyên thể và hậu tố mang nghĩa thời gian, “khi ông đến từ”. Trong ngữ cảnh hành trình hồi hương của Gia-cốp, “trở về” tự nhiên trong tiếng Việt và không làm thay đổi điểm xuất phát được nêu rõ.
- source_word: פַּדַּן אֲרָם
  choice: Pha-đan A-ram
  rationale: Phiên âm địa danh theo lối quen thuộc, dễ đọc đối với độc giả Kinh Thánh tiếng Việt.
- source_word: וַיִּחַן
  choice: đóng trại
  rationale: Động từ חנה ở đây có nghĩa dựng hoặc đóng trại; “đóng trại” là cách nói hiện đại, tự nhiên.
- source_word: אֶת־פְּנֵי הָעִיר
  choice: phía trước thành
  rationale: Thành ngữ chỉ khu vực ở trước hoặc đối diện thành; “phía trước thành” giữ rõ ý nghĩa không gian.
theological_decisions:
- issue: שָׁלֵם có thể là trạng ngữ hoặc địa danh
  choice: Dịch là “bình an” trong chính văn
  alternative: “Gia-cốp đến Sa-lem, một thành thuộc Si-chem”
  rationale: Cách hiểu trạng ngữ phù hợp cú pháp và bối cảnh Gia-cốp vượt qua hiểm nguy để trở lại Ca-na-an, nhưng cách đọc như tên riêng là khả dĩ thực sự nên được bảo tồn trong chú thích, không quyết đoán loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ trình tự ý chính của nguyên văn nhưng dùng dấu chấm phẩy để tránh chuỗi mệnh đề nặng nề. Các địa danh được phiên âm theo lối quen thuộc trong tiếng Việt.
