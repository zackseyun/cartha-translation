revisions:
- from: 'Nhưng Gia-cốp thưa với ông: “Chúa tôi biết rằng bọn trẻ còn yếu, còn đàn chiên và đàn bò đang cho con bú thì tôi phải chăm nom.[a] Nếu bị lùa gấp chỉ một ngày, cả đàn sẽ chết.”'
  to: 'Gia-cốp thưa với ông: “Thưa chúa, ngài biết các con trẻ còn yếu, và đàn chiên cùng đàn bò đang nuôi con thuộc trách nhiệm của tôi.[a] Nếu chúng bị thúc đi quá gấp chỉ một ngày, cả đàn vật sẽ chết.”'
  rationale: Bản sửa giữ nguyên ý nghĩa và tính dè dặt của cụm từ Hê-bơ-rơ khó עָלוֹת עָלָי, đồng thời cải thiện thanh giọng trang trọng, làm rõ quan hệ giữa gia súc đang nuôi con và trách nhiệm của Gia-cốp, và diễn đạt chính xác hơn hành động thúc đàn vật đi quá gấp. “Thưa chúa” bảo toàn sắc thái xưng hô kính cẩn của אֲדֹנִי trong bối cảnh con người, không dùng như danh xưng thần linh.
