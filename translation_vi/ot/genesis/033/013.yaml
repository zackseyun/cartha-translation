  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” và “Chúa tôi” để giữ phép kính trọng của Gia-cốp đối với Ê-sau; dùng “lùa gấp” theo ngữ cảnh chăn dắt gia súc.
