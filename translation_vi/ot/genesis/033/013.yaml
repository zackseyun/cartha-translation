  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֲדֹנִ֤/י יֹדֵ֨עַ֙ כִּֽי הַ/יְלָדִ֣ים רַכִּ֔ים וְ/הַ/צֹּ֥אן וְ/הַ/בָּקָ֖ר עָל֣וֹת עָלָ֑/י וּ/דְפָקוּ/ם֙ י֣וֹם אֶחָ֔ד וָ/מֵ֖תוּ כָּל הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: vi
  text: 'Gia-cốp thưa với ông: “Thưa chúa, ngài biết các con trẻ còn yếu, và đàn chiên cùng đàn bò đang nuôi con thuộc trách nhiệm của tôi.[a] Nếu chúng bị thúc đi quá gấp chỉ một ngày, cả đàn vật sẽ chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đàn chiên và đàn bò có con đang bú là trách nhiệm của tôi.” Cụm từ Hê-bơ-rơ mang tính thành ngữ, vừa nói đến tình trạng gia súc đang nuôi con, vừa nói đến trách nhiệm chăm sóc của Gia-cốp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Chúa tôi
  rationale: Đây là cách Gia-cốp kính cẩn xưng hô với Ê-sau, một người, chứ không phải danh xưng dành cho Đức Chúa Trời. “Chúa tôi” giữ sắc thái tôn kính và trật tự xã hội của lời nói trong bối cảnh cổ đại.
- source_word: הַיְלָדִים רַכִּים
  choice: bọn trẻ còn yếu
  rationale: רַכִּים chỉ sự non nớt, mềm yếu và dễ tổn thương. “Còn yếu” diễn đạt tự nhiên tình trạng của trẻ nhỏ khi phải đi đường dài mà không nhấn quá mức đến bệnh tật.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: đàn chiên và đàn bò
  rationale: Hai danh từ tập hợp chỉ gia súc nhỏ và gia súc lớn; cách dịch cụ thể này tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: עָלוֹת עָלָי
  choice: đang cho con bú thì tôi phải chăm nom
  rationale: 'Cụm từ khó và mang tính thành ngữ: עָלוֹת nhiều khả năng nói đến những con vật mẹ đang nuôi con bú, còn עָלָי diễn tả trách nhiệm đè trên Gia-cốp. Bản dịch thể hiện cả hai ý, đồng thời ghi chú khả năng diễn đạt khác.'
- source_word: וּדְפָקוּם
  choice: Nếu bị lùa gấp
  rationale: Động từ ở đây nói đến việc thúc hoặc lùa đàn vật quá mạnh, quá nhanh. Thể bị động giữ được chủ thể bất định trong tiếng Hê-bơ-rơ.
- source_word: יוֹם אֶחָד
  choice: chỉ một ngày
  rationale: Diễn tả khoảng thời gian một ngày và nhấn mạnh rằng chỉ cần lùa gấp trong thời gian ngắn như vậy cũng gây hậu quả nghiêm trọng.
- source_word: וָמֵתוּ כָּל הַצֹּאן
  choice: cả đàn sẽ chết
  rationale: הַצֹּאן là danh từ tập hợp; sau khi đã nhắc đàn chiên và đàn bò, “cả đàn” diễn đạt tự nhiên toàn bộ số gia súc đang được nói đến.
theological_decisions: []
