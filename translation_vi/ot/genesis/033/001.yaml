  to: Bấy giờ, Gia-cốp ngước mắt lên và nhìn[a]. Kìa[b], Ê-sau đang tiến đến cùng với bốn trăm người. Vì vậy, Gia-cốp phân các con cho Lê-a, Ra-chên và hai nữ gia nhân[c].
  rationale: Sửa cách diễn đạt việc phân các con để phản ánh rõ cấu trúc phân phối của nguyên văn và dùng từ tự nhiên hơn trong tiếng Việt hiện đại. Các lựa chọn còn lại, gồm tên riêng, “Kìa”, sắc thái tiếp diễn của Ê-sau đang đến, và các mốc chú thích, đều được giữ lại.
