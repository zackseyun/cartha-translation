base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: vi
  text: Bấy giờ, Gia-cốp ngước mắt lên và nhìn[a]. Kìa[b], Ê-sau đang tiến đến cùng với bốn trăm người. Vì vậy, Gia-cốp phân các con cho Lê-a, Ra-chên và hai nữ gia nhân[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngước nhìn lên.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ ở đây là một dấu hiệu kể chuyện sống động, nhằm thu hút sự chú ý đến việc Ê-sau đang tiến đến.
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ có thể chỉ các nữ gia nhân trong nhà; cũng có thể dịch là “hai tỳ nữ” hoặc “hai nữ nô lệ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב עֵינָיו וַיַּרְא
  choice: Gia-cốp ngước mắt lên và nhìn
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ ‘nâng mắt lên’ đồng thời diễn đạt tự nhiên hành động hướng tầm nhìn về phía trước.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Tái hiện dấu hiệu diễn ngôn sống động, hướng sự chú ý của người đọc ngay vào cảnh Ê-sau đang đến.
- source_word: בָּא
  choice: đang tiến đến
  rationale: Phân từ diễn tả hành động đang tiếp diễn; ‘đang tiến đến’ làm rõ việc Ê-sau đang áp sát Gia-cốp.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: cùng với ông có bốn trăm người
  rationale: Giữ trọng tâm rằng Ê-sau có một đoàn người đông đảo đi cùng, đồng thời dùng cú pháp tiếng Việt dễ hiểu.
- source_word: וַיַּחַץ אֶת הַיְלָדִים עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: chia các con thành từng nhóm bên Lê-a, Ra-chên và hai nữ đầy tớ
  rationale: Trong ngữ cảnh này, động từ và giới từ lặp lại mô tả việc phân các con thành những nhóm gắn với từng người mẹ; ‘bên’ tránh hàm ý Gia-cốp đem con cái trao quyền sở hữu cho các phụ nữ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải nhưng hiện đại. ‘Kìa’ bảo tồn sắc thái sống động của nguyên văn; ‘nữ đầy tớ’ dễ hiểu hơn ‘tỳ nữ’, còn chú thích giữ lại sắc thái địa vị xã hội có thể có của từ Hê-bơ-rơ.
