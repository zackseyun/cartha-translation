    rationale: Ý “thần phục” vượt quá điều động từ tự nó xác định trong ngữ cảnh này. Vì động từ xuất hiện hai lần, chú thích nên nói rõ phương án thay thế áp dụng cho cả hai lần để tránh mơ hồ về neo chú thích.
