base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: vi
  text: Lê-a và các con bà cũng tiến đến[a] và cúi mình xuống[b]. Sau đó, Giô-sép và Ra-chên tiến đến, rồi cúi mình xuống[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đến gần”; áp dụng cho cả hai lần “tiến đến” trong câu.
    reason: lexical_alternative
  - marker: b
    text: Hay “sấp mình”; động từ Hê-bơ-rơ có thể chỉ hành động cúi rạp sâu để bày tỏ sự kính trọng. Áp dụng cho cả hai lần “cúi mình xuống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: tiến đến
  rationale: Động từ נגשׁ chỉ việc đến gần hoặc tiến lại gần. “Tiến đến” tự nhiên trong tiếng Việt, diễn tả chuyển động về phía Ê-sau mà không suy diễn thêm về cách thức.
- source_word: גַּם
  choice: cũng
  rationale: גַּם biểu thị sự bổ sung trong trình tự các nhóm ra trình diện trước Ê-sau; “cũng” truyền đạt chức năng này rõ ràng.
- source_word: וִילָדֶיהָ
  choice: cùng các con bà
  rationale: יְלָדִים có thể chỉ chung con cái, không nhất thiết chỉ con trai. “Các con bà” vừa chính xác vừa tự nhiên.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: cúi mình xuống
  rationale: Dạng động từ của שׁחה ở đây diễn tả hành động bày tỏ sự kính trọng hoặc thần phục. “Cúi mình xuống” trang trọng, dễ hiểu và không xác định quá mức tư thế cơ thể.
- source_word: וְאַחַר
  choice: Sau đó
  rationale: Cụm từ đánh dấu bước tiếp theo trong trình tự đoàn người tiến đến; “Sau đó” là cách diễn đạt tự nhiên trong lời kể hiện đại.
- source_word: יוֹסֵף וְרָחֵל
  choice: Giô-sép và Ra-chên
  rationale: Giữ nguyên thứ tự tên trong tiếng Hê-bơ-rơ, đặt Giô-sép trước Ra-chên.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “bà” để quy chiếu Lê-a một cách tự nhiên; giữ nguyên trật tự Giô-sép trước Ra-chên theo nguyên văn.
