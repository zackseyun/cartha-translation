  source_fidelity: 'Bản dịch giữ đúng trình tự của tiếng Hê-bơ-rơ: Lê-a cùng con cái đến trước, rồi đến Giô-sép và Ra-chên; đồng thời giữ đúng thứ tự bất thường nhưng có chủ ý là “Giô-sép và Ra-chên”. “Các con” phản ánh chính xác ילָדֶיהָ, không giới hạn là con trai. Tuy nhiên, chú thích về hành động cúi lạy nên được neo và diễn đạt sao cho áp dụng minh bạch cho cả hai lần xuất hiện của động từ.'
