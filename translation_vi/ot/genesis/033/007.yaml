  terminology: Tên riêng theo dạng phiên âm có gạch nối nhất quán. Không nên thêm “thần phục” vào chú thích, vì שׁחה tại đây chỉ hành vi bái lạy/cúi rạp biểu thị sự kính trọng, không tự nó xác định một quan hệ thần phục. “Sấp mình” là phương án từ vựng phù hợp, nhưng cần nêu rõ nó áp dụng cho cả hai lần.
