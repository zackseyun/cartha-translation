base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: vi
  text: Ông sắp xếp các nữ tỳ và con cái họ ở phía trước[a], Lê-a và các con bà ở phía sau, còn Ra-chên và Giô-sép ở cuối cùng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nữ gia nhân” hoặc “các nữ nô lệ”; từ Hê-bơ-rơ chỉ những nữ đầy tớ có địa vị thấp trong gia đình.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ông xếp
  rationale: Động từ שׂוּם có nghĩa là đặt, để, sắp xếp; trong ngữ cảnh bố trí ba nhóm theo thứ tự, “xếp” tự nhiên và chính xác.
- source_word: הַשְּׁפָחוֹת
  choice: các nữ tỳ
  rationale: שִׁפְחָה chỉ nữ gia nhân có địa vị thấp và có thể hàm nghĩa nữ nô lệ. “Nữ tỳ” vừa trang trọng, dễ hiểu, vừa tránh diễn giải quá mức địa vị pháp lý trong câu này.
- source_word: יַלְדֵיהֶן
  choice: con cái họ
  rationale: Danh từ יֶלֶד ở đây chỉ chung con cái, không chỉ riêng con trai.
- source_word: רִאשֹׁנָה
  choice: đi đầu
  rationale: Dạng dùng như trạng từ biểu thị vị trí đầu tiên; “đi đầu” phù hợp với cảnh các nhóm tiến về phía Ê-sau.
- source_word: לֵאָה
  choice: Lê-a
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt.
- source_word: וִילָדֶיהָ
  choice: và các con nàng
  rationale: Giữ nghĩa bao quát của יֶלֶד và liên kết trực tiếp Lê-a với các con.
- source_word: אַחֲרֹנִים
  choice: ở phía sau
  rationale: Ở nhóm thứ hai, từ này diễn tả vị trí sau nhóm đầu chứ không phải cuối toàn bộ đoàn.
- source_word: רָחֵל
  choice: Ra-chên
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Phiên âm tên riêng theo lối quen thuộc trong tiếng Việt.
- source_word: אַחֲרֹנִים
  choice: ở cuối cùng
  rationale: Ở nhóm thứ ba, từ này chỉ vị trí cuối của toàn bộ thứ tự sắp xếp.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “ông” để nối tự nhiên với chủ thể Gia-cốp trong ngữ cảnh; dùng “nàng” cho Lê-a để tránh lặp và giữ sắc thái văn chương vừa phải. Cấu trúc ba vế làm rõ thứ tự không gian của ba nhóm.
