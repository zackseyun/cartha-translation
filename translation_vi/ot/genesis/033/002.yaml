    issue: “nàng” có sắc thái hơi cổ.
    rationale: Để phù hợp hơn với tiếng Việt chuẩn hiện đại, thay bằng “bà” trong cụm “Lê-a và các con bà”; thay đổi này không ảnh hưởng nghĩa hay quan hệ sở hữu trong nguyên ngữ.
  - severity: low
    issue: “đi đầu” có thể gợi hành động dẫn đầu hơn là vị trí được bố trí.
    rationale: Tiếng Hê-bơ-rơ mô tả việc đặt nhóm này ở vị trí thứ nhất. “Ở phía trước” nêu rõ hơn quan hệ vị trí trong đoàn.
