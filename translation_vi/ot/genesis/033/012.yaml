  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: vi
  text: 'Rồi Ê-sau nói: “Chúng ta hãy lên đường và đi; tôi sẽ đi trước em[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “tôi sẽ đi đối diện em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi Ê-sau nói
  rationale: Waw liên tiếp đẩy câu chuyện tiến tới; “Rồi ... nói” tự nhiên trong tiếng Việt. Chủ ngữ Ê-sau được nêu rõ theo ngữ cảnh vì động từ Hê-bơ-rơ chỉ hàm chứa chủ ngữ.
- source_word: נִסְעָה
  choice: Chúng ta hãy lên đường
  rationale: Dạng cohortative ngôi thứ nhất số nhiều diễn tả lời đề nghị cùng khởi hành; “lên đường” phù hợp ngữ cảnh hành trình và tự nhiên trong tiếng Việt hiện đại.
- source_word: וְנֵלֵכָה
  choice: và đi
  rationale: הלך ở đây chỉ việc đi tiếp trong hành trình. Cách dịch ngắn gọn giữ phép phối hợp với động từ cohortative trước đó mà không lặp lại “hãy” không cần thiết.
- source_word: וְאֵלְכָה
  choice: tôi sẽ đi
  rationale: Dạng ngôi thứ nhất số ít trong ngữ cảnh là lời Ê-sau đề nghị cùng di chuyển, nên dịch với sắc thái tương lai/chủ ý.
- source_word: לְנֶגְדֶּךָ
  choice: bên cạnh em
  rationale: נגד có thể chỉ vị trí đối diện, phía trước hoặc tương ứng với ai. Trong ngữ cảnh Ê-sau đề nghị đồng hành, “bên cạnh em” diễn đạt tự nhiên mà không buộc phải hiểu là ông dẫn đầu; khả năng “đi trước em” được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi/em” phù hợp quan hệ anh em và lời Ê-sau nói với Gia-cốp; dấu chấm phẩy giúp tách lời đề nghị cùng đi khỏi lời đề nghị đồng hành. Mọi nét nghĩa vị trí hợp lý của לְנֶגְדֶּךָ được bảo tồn giữa chính văn và chú thích.
