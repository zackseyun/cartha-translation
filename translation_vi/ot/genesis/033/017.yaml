base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: vi
  text: Gia-cốp đi đến Su-cốt[a]. Ông xây cho mình một ngôi nhà và làm các lều cho đàn gia súc. Vì thế, ông đặt tên nơi ấy là Su-cốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Su-cốt là dạng phiên âm của từ Hê-bơ-rơ có nghĩa là “các lều” hoặc “các chòi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסַע
  choice: đi
  rationale: Động từ diễn tả việc lên đường hoặc di chuyển từ nơi này sang nơi khác; “đi” tự nhiên trong lời kể tiếng Việt và không thêm ý vượt quá nguyên văn.
- source_word: סֻכֹּתָה
  choice: đến Su-cốt
  rationale: Hậu tố chỉ hướng diễn tả chuyển động về phía địa danh; trong ngữ cảnh, “đến Su-cốt” là cách nói tự nhiên.
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: Ông xây cho mình một ngôi nhà
  rationale: Giữ rõ ý ngôi nhà được xây cho chính Gia-cốp, đồng thời dùng cú pháp tiếng Việt tự nhiên.
- source_word: מִקְנֵהוּ
  choice: đàn gia súc
  rationale: Danh từ chỉ các súc vật thuộc sở hữu của Gia-cốp; “đàn gia súc” bao quát hơn “đàn bò” và phù hợp ngữ cảnh.
- source_word: עָשָׂה סֻכֹּת
  choice: làm các lều che
  rationale: סֻכּוֹת là những chỗ che trú tạm thời. “Lều che” diễn đạt rõ chức năng đối với gia súc và duy trì mối liên hệ từ nguyên với địa danh qua chú thích.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Cụm từ mở đầu lời giải thích nguyên nhân đặt tên; “Vì thế” ngắn gọn và tự nhiên.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: ông đặt tên nơi ấy
  rationale: Đây là cách chuyển tự nhiên trong tiếng Việt cho thành ngữ Hê-bơ-rơ “gọi tên của nơi đó”, vẫn giữ đầy đủ ý đặt địa danh.
- source_word: סֻכּוֹת
  choice: Su-cốt
  rationale: Giữ địa danh dưới dạng phiên âm; lối chơi chữ với danh từ “các lều” được giải thích trong chú thích.
