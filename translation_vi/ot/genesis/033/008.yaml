  - severity: medium
    issue: “để được đẹp lòng chúa tôi” không tự nhiên và có thể đảo chiều quan hệ của thành ngữ.
    rationale: לִמְצֹא חֵן בְּעֵינֵי אֲדֹנִי nghĩa là nhằm nhận được sự ưu ái/thiện cảm của “chúa tôi,” tức Ê-sau.
