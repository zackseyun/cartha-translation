  to: 'Ê-sau hỏi: “Cả đoàn này mà tôi đã gặp là để làm gì?” Gia-cốp đáp: “Để được chúa tôi[a] ưu ái.”'
  rationale: Bản sửa chuyển câu hỏi sang cách hỏi mục đích rõ ràng hơn, giữ nghĩa tập thể của “đoàn,” và diễn đạt thành ngữ “tìm được ân huệ trong mắt chúa tôi” bằng tiếng Việt hiện đại, tự nhiên. Chú thích bảo vệ cách hiểu đúng của “chúa tôi.”
