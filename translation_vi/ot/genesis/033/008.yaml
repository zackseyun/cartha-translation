base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: vi
  text: 'Ê-sau hỏi: “Cả đoàn này mà tôi đã gặp là để làm gì?” Gia-cốp đáp: “Để được chúa tôi[a] ưu ái.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chúa tôi” là cách Gia-cốp kính cẩn xưng hô với Ê-sau, không phải một danh xưng dành cho Đức Chúa Trời.
    reason: Làm rõ giá trị xã hội, không thần linh, của tiếng Hê-bơ-rơ אַדֹנִי trong ngữ cảnh này.
lexical_decisions:
- source_word: מִי לְךָ
  choice: có ý nghĩa gì
  rationale: Trong ngữ cảnh, thành ngữ này hỏi về mục đích hoặc ý định của đoàn vật mà Ê-sau gặp, chứ không hỏi danh tính. Cách dịch này tự nhiên trong tiếng Việt và giữ được lực hỏi của nguyên văn.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: tất cả đoàn này
  rationale: מַחֲנֶה thường có nghĩa là “trại” hoặc “đoàn,” nhưng tại đây chỉ toàn bộ các đàn vật cùng những người hầu được Gia-cốp sai đi trước. “Đoàn” phù hợp ngữ cảnh hơn “trại” mà vẫn giữ nghĩa tập thể.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: mà tôi đã gặp
  rationale: Diễn đạt trực tiếp nghĩa “gặp, bắt gặp” của פָּגַשׁ và phù hợp lời Ê-sau nói về đoàn đi trước.
- source_word: לִמְצֹא חֵן
  choice: để được đẹp lòng
  rationale: Cấu trúc động từ nguyên thể diễn tả mục đích. Thành ngữ tiếng Việt “được đẹp lòng” chuyển tải việc mong nhận được thiện cảm hoặc sự ưu ái.
- source_word: בְּעֵינֵי
  choice: đẹp lòng
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “trong mắt,” một thành ngữ chỉ sự đánh giá thuận lợi. Tiếng Việt tự nhiên gói ý này trong “đẹp lòng.”
- source_word: אֲדֹנִי
  choice: chúa tôi
  rationale: Đây là lời Gia-cốp kính cẩn xưng hô với Ê-sau, không phải danh xưng dành cho Đức Chúa Trời. “Chúa tôi” giữ sắc thái tôn kính và quan hệ xã hội trong lời nói cổ trang trọng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Danh từ riêng được nêu thay cho các đại từ liên tiếp để người đọc dễ xác định người nói; lời đáp ngắn giữ đúng cấu trúc mục đích của nguyên văn.
