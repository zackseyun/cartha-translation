base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/009.yaml
  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: vi
  text: 'Nhưng Ê-sau nói[a]: “Anh có nhiều rồi, em ạ. Những gì thuộc về em, em cứ giữ lấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ê-sau nói: ‘Anh có đủ rồi, em ạ. Những gì thuộc về em, em cứ giữ lấy.’”'
    reason: Từ רָב có thể được hiểu theo ngữ cảnh là “nhiều” hoặc “đủ”; liên từ mở đầu cũng có thể dịch đơn giản là “rồi/và” thay vì nêu rõ nét tương phản.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng ... nói
  rationale: Dạng waw nối tiếp đưa câu chuyện tiến triển; trong ngữ cảnh, “nhưng” diễn đạt sự tương phản nhẹ khi Ê-sau khước từ món quà của Gia-cốp.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: יֶשׁ לִי רָב
  choice: Em đã có nhiều rồi
  rationale: Thành ngữ diễn đạt sự sở hữu, còn רָב nhấn mạnh số lượng dồi dào. “Có nhiều rồi” tự nhiên trong lời nói và không thu hẹp nghĩa thành chỉ vừa đủ.
- source_word: אָחִי
  choice: anh ạ
  rationale: אָחִי nghĩa đen là “anh/em trai của tôi”; vì Gia-cốp là anh em sinh đôi nhưng Ê-sau ra đời trước, lối xưng hô “anh ạ” truyền đạt tự nhiên sự thân tình của lời gọi trực tiếp trong tiếng Việt.
- source_word: יְהִי לְךָ
  choice: anh cứ giữ lấy
  rationale: 'Thể mệnh lệnh nhẹ của היה mang ý cho phép hoặc lịch sự: Ê-sau bảo Gia-cốp giữ lại tài sản đang định biếu. Cách nói này diễn đạt đúng chức năng trong ngữ cảnh.'
- source_word: אֲשֶׁר לָךְ
  choice: những gì thuộc về anh
  rationale: Cụm quan hệ chỉ những tài sản thuộc về Gia-cốp; cách dịch này rõ ràng và tự nhiên.
