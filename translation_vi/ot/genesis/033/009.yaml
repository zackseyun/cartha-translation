  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp đối thoại gia đình. Đại từ “em/anh” làm rõ quan hệ giữa Ê-sau và Gia-cốp trong tiếng Việt mà không làm thay đổi nội dung câu.
