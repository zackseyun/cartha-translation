- from: Xin chúa tôi cứ đi trước tôi tớ mình; còn tôi sẽ đi thong thả, theo nhịp của đàn gia súc ở trước mặt tôi và theo nhịp của con trẻ, cho đến khi tôi đến cùng chúa tôi tại Sê-i-rơ.
  to: Xin chúa tôi cứ đi trước tôi tớ của chúa; còn tôi sẽ đi thong thả, theo nhịp của đàn gia súc ở trước mặt tôi và theo nhịp của con trẻ, cho đến khi tôi đến gặp chúa tôi ở Sê-i-rơ.
  rationale: Sửa hai chỗ diễn đạt để làm rõ lối tự xưng khiêm nhường ngôi thứ ba và quan hệ “đến với” Ê-sau, đồng thời giữ nguyên nghĩa, sắc thái lịch sự, và tính mơ hồ tối thiểu của nguyên văn. “Đến gặp” diễn đạt tự nhiên kết quả ngữ dụng của “đến với chúa tôi” trong câu hứa này, không thêm chi tiết lịch sử hay thần học.
