base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: vi
  text: Xin chúa tôi cứ đi trước tôi tớ của chúa; còn tôi sẽ đi thong thả, theo nhịp của đàn gia súc ở trước mặt tôi và theo nhịp của con trẻ, cho đến khi tôi đến gặp chúa tôi ở Sê-i-rơ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: Xin ... cứ đi trước
  rationale: Thể mệnh lệnh nhẹ kèm נָא diễn tả lời thỉnh cầu lễ phép; “xin... cứ” tự nhiên trong tiếng Việt và giữ sắc thái nhún nhường.
- source_word: אֲדֹנִי
  choice: chúa tôi
  rationale: Đây là cách Gia-cốp kính cẩn xưng hô với Ê-sau, không phải danh xưng thần linh; “chúa tôi” giữ sắc thái xã hội trang trọng và tương ứng với “tôi tớ”.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: đi trước tôi tớ mình
  rationale: לִפְנֵי chỉ vị trí phía trước, còn ngôi thứ ba trong “tôi tớ của người” là lối tự xưng nhún nhường. “Mình” quy chiếu tự nhiên về người được gọi là chúa.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: tôi sẽ đi thong thả
  rationale: Động từ hitpael diễn tả việc di chuyển có điều tiết, cẩn thận; לְאִטִּי thêm ý chậm rãi. “Đi thong thả” truyền đạt cả hai mà không khẳng định quá mức rằng Gia-cốp đang dẫn đoàn.
- source_word: לְרֶגֶל
  choice: theo nhịp của
  rationale: Thành ngữ nghĩa đen là “theo chân của,” chỉ việc điều chỉnh tốc độ theo đối tượng khác; “theo nhịp của” rõ ràng và tự nhiên.
- source_word: הַמְּלָאכָה
  choice: đàn gia súc
  rationale: Từ này thường có nghĩa “công việc,” “tài sản” hoặc “sản nghiệp,” nhưng trong bối cảnh đoàn mục súc đang di chuyển, nó chỉ các con vật; “đàn gia súc” làm rõ sở chỉ theo ngữ cảnh.
- source_word: אֲשֶׁר לְפָנַי
  choice: ở trước mặt tôi
  rationale: Giữ hình ảnh không gian của nguyên văn mà không thêm ý “thuộc quyền chăm sóc” vốn chỉ hàm ẩn trong bối cảnh.
- source_word: הַיְלָדִים
  choice: con trẻ
  rationale: Chỉ các con của Gia-cốp trong đoàn; “con trẻ” trang trọng, dễ hiểu và giữ được sắc thái tuổi nhỏ hơn “các con”.
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: cho đến khi tôi đến cùng chúa tôi tại Sê-i-rơ
  rationale: Giữ mệnh đề thời gian và đích đến. “Tại Sê-i-rơ” diễn đạt tự nhiên việc gặp chúa mình ở địa điểm ấy, trong khi ה locative trên שֵׂעִירָה mang hướng nghĩa “đến Sê-i-rơ”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ lối xưng hô nhún nhường ngôi thứ ba giữa “chúa tôi” và “tôi tớ mình”; không dùng “Chúa” viết hoa để tránh gợi danh xưng dành cho Đức Chúa Trời. Không đặt chú thích vì các nét nghĩa quan trọng có thể thể hiện trực tiếp trong câu mà không cần giải thích bản văn.
