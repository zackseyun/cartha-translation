  source_fidelity: 'Bản nháp phản ánh đúng các yếu tố chính: đại từ nhấn mạnh, Gia-cốp đi trước đoàn người, hành vi cúi mình lặp lại bảy lần, và giới hạn là lúc đến gần Ê-sau. Tuy nhiên, “đi lên phía trước họ” thêm nét hướng động “lên” không có trong עָבַר לִפְנֵיהֶם; “đi trước họ” diễn đạt chính xác và tự nhiên hơn. “Cúi mình xuống đất” cũng phản ánh rõ hướng của אַרְצָה hơn “cúi mình sát đất”.'
