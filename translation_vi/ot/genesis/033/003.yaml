  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: vi
  text: Chính ông đi trước họ và cúi mình xuống đất bảy lần[a], cho đến khi ông đến gần anh mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phủ phục”; động từ Hê-bơ-rơ có thể chỉ một hành động khấu bái sâu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Còn chính ông
  rationale: Đại từ độc lập nhấn mạnh rằng chính Gia-cốp đích thân đi đầu; cách diễn đạt này giữ được sắc thái nhấn mạnh mà không cần lặp tên riêng.
- source_word: עָבַר לִפְנֵיהֶם
  choice: đi lên phía trước họ
  rationale: Trong ngữ cảnh, cụm từ diễn tả việc Gia-cốp vượt lên để dẫn đầu đoàn người khi tiến về phía Ê-sau, hơn là chỉ đi ngang qua.
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: cúi mình sát đất
  rationale: Động từ chỉ hành vi cúi lạy hoặc phủ phục, còn אַרְצָה xác định hướng xuống đất. Cách dịch giữ hình ảnh cụ thể nhưng không mặc nhiên biến hành động này thành sự thờ phượng.
- source_word: שֶׁבַע פְּעָמִים
  choice: bảy lần
  rationale: Chuyển dịch trực tiếp biểu thức số lượng.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: cho đến khi đến gần anh mình
  rationale: 'Cấu trúc với עַד và động từ nguyên thể diễn tả giới hạn của hành động lặp lại: ông tiếp tục cúi mình trong lúc tiến đến gần người anh.'
theological_decisions:
- issue: Hành động וַיִּשְׁתַּחוּ có phải là thờ phượng hay không
  choice: Diễn tả tư thế kính cẩn bằng “cúi mình sát đất”
  alternative: “sấp mình thờ lạy”
  rationale: Ngữ cảnh là cuộc gặp giữa Gia-cốp và Ê-sau, và từ Hê-bơ-rơ có thể chỉ sự bày tỏ lòng tôn kính đối với con người. Vì vậy không nên thêm ý nghĩa thờ phượng mà câu văn không buộc phải có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chính ông” bảo toàn sự nhấn mạnh của đại từ Hê-bơ-rơ; “anh mình” tự nhiên trong tiếng Việt và phản ánh quan hệ của Ê-sau với Gia-cốp. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
