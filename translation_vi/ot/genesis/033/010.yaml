source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: vi
  text: 'Gia-cốp nói: “Không, xin anh vui lòng nhận. Nếu em được anh thương tình, xin anh nhận món quà của em từ tay em[a], vì em đã thấy mặt anh như thấy mặt Đức Chúa Trời[b], và anh đã vui lòng đón nhận em[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lễ vật của em” hoặc “tặng phẩm của em”. Từ Hê-bơ-rơ minchah ở đây chỉ món quà Gia-cốp dâng để hòa giải với Ê-sau, không nhất thiết là lễ vật thờ phượng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc có thể hiểu: “mặt một vị thần”. Trong văn mạch, “Đức Chúa Trời” phù hợp với cuộc gặp gỡ của Gia-cốp tại Phê-ni-ên (Sáng Thế Ký 32:30).'
    reason: alternative_reading
  - marker: c
    text: 'Hoặc: “anh đã chấp nhận em” hay “anh đã hài lòng về em”. Động từ Hê-bơ-rơ diễn tả sự tiếp nhận thuận tình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵן בְּעֵינֶיךָ
  choice: được đẹp lòng anh
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ ‘tìm được ân huệ trong mắt anh’, giữ ý được người đối diện chấp thuận mà không mang sắc thái thần học không cần thiết.
- source_word: מִנְחָתִי
  choice: món quà này
  rationale: Trong ngữ cảnh, đây là lễ vật hòa giải Gia-cốp trao cho Ê-sau; ‘món quà’ rõ nghĩa và tránh khiến người đọc hiểu là lễ vật thờ phượng.
- source_word: מִיָּדִי
  choice: từ tay em
  rationale: Giữ hình ảnh cụ thể của nguyên văn và phù hợp với cảnh Gia-cốp trực tiếp dâng quà.
- source_word: כִּי עַל־כֵּן
  choice: vì
  rationale: Chuyển tải chức năng nêu lý do của cụm từ trong văn mạch bằng tiếng Việt hiện đại, tự nhiên.
- source_word: כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: như thấy mặt Đức Chúa Trời
  rationale: Giữ nguyên phép so sánh mạnh và hình ảnh ‘mặt’; văn mạch ngay sau biến cố Phê-ni-ên ủng hộ cách hiểu אֱלֹהִים là Đức Chúa Trời.
- source_word: וַתִּרְצֵנִי
  choice: anh đã vui lòng tiếp nhận em
  rationale: Bao quát cả ý chấp nhận lẫn thái độ thuận tình của Ê-sau, đồng thời nghe tự nhiên trong tiếng Việt.
- source_word: אַל נָא אִם נָא
  choice: Không, xin anh vui lòng nhận. Nếu
  rationale: Thể hiện lời từ chối rồi nài xin tha thiết của Gia-cốp; bổ sung ‘nhận’ theo ngữ cảnh trực tiếp để câu tiếng Việt trọn ý.
theological_decisions:
- issue: Đối tượng của אֱלֹהִים trong câu so sánh
  choice: Đức Chúa Trời
  alternative: một vị thần
  rationale: Dù אֱלֹהִים có thể có nghĩa rộng hơn trong một số văn cảnh, mối liên hệ gần với việc Gia-cốp thấy Đức Chúa Trời tại Phê-ni-ên (Sáng Thế Ký 32:30) nghiêng mạnh về danh xưng chỉ Đức Chúa Trời. Bản dịch không làm nhẹ đi phép so sánh đầy căng thẳng thần học của Gia-cốp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ ‘anh/em’ theo quan hệ anh em giữa Ê-sau và Gia-cốp; giữ hình ảnh ‘mặt’ và ‘từ tay em’ của nguyên văn.
