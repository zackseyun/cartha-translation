- from: 'Gia-cốp nói: “Không, xin anh vui lòng nhận. Nếu em được đẹp lòng anh, xin anh nhận món quà này từ tay em, vì em được thấy mặt anh như thấy mặt Đức Chúa Trời, và anh đã vui lòng tiếp nhận em.”'
  to: 'Gia-cốp nói: “Không, xin anh vui lòng nhận. Nếu em được anh thương tình, xin anh nhận món quà của em từ tay em[a], vì em đã thấy mặt anh như thấy mặt Đức Chúa Trời[b], và anh đã vui lòng đón nhận em[c].”'
