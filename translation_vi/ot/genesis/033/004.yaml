base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: vi
  text: Ê-sau chạy đến đón Gia-cốp, ôm lấy ông, bá lấy cổ ông, hôn ông[a], và cả hai cùng khóc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong Bản văn Masoret, từ được dịch là “hôn ông” có những dấu chấm bất thường ở phía trên. Một số nhà giải thích cho rằng các dấu ấy biểu thị sự nghi ngờ hoặc nhấn mạnh, nhưng nghĩa trực tiếp của tiếng Hê-bơ-rơ tại đây vẫn là “hôn ông.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: chạy
  rationale: Động từ רוץ chỉ hành động chạy; cách dịch này giữ được nhịp chuyển động nhanh và trực tiếp của câu chuyện.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt hiện đại.
- source_word: לִקְרָאתוֹ
  choice: đến đón Gia-cốp
  rationale: Thành ngữ לקראת diễn tả việc tiến ra gặp một người. Nêu tên Gia-cốp giúp câu tiếng Việt rõ nghĩa trong một câu có nhiều đại từ nam giống nhau.
- source_word: וַיְחַבְּקֵהוּ
  choice: ôm lấy ông
  rationale: חבק nghĩa là ôm; cách nói này tự nhiên, trang trọng vừa phải và truyền đạt cử chỉ thân tình.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: bá lấy cổ ông
  rationale: Thành ngữ Hê-bơ-rơ mô tả một cử chỉ ôm đầy xúc động. “Bá lấy cổ” giữ hình ảnh cụ thể của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: וַיִּשָּׁקֵהוּ
  choice: hôn ông
  rationale: Ở dạng này, נשק có nghĩa trực tiếp là hôn. Dấu chấm Masoret bất thường được ghi chú thay vì làm thay đổi nghĩa hiển nhiên trong chính văn.
- source_word: וַיִּבְכּוּ
  choice: cả hai cùng khóc
  rationale: Động từ số nhiều cho biết cả hai người đều khóc; cách diễn đạt này làm rõ chủ thể chung một cách tự nhiên.
theological_decisions:
- issue: Cách hiểu hành động của Ê-sau đối với Gia-cốp
  choice: Trình bày chuỗi hành động theo nghĩa bề mặt là cuộc gặp gỡ đầy tình cảm và hòa giải, không thêm hàm ý nghi ngờ.
  alternative: Hiểu nụ hôn theo hướng đáng ngờ hoặc mỉa mai dựa trên các truyền thống giải thích về sau.
  rationale: Bản văn Hê-bơ-rơ kể liên tiếp các cử chỉ trìu mến. Bản dịch không nên đưa sự hoài nghi của truyền thống giải thích vào chính văn, nhưng ghi nhận dấu Masoret bất thường trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. Dùng “bá lấy cổ” để giữ hình ảnh Hê-bơ-rơ, đồng thời dùng tên Gia-cốp một lần nhằm tránh chuỗi đại từ mơ hồ. Dấu chú thích [a] được đặt sau tên Gia-cốp theo lớp tham khảo tiếng Anh, dù nội dung chú thích liên quan đến động từ “hôn”; nếu biên tập bố cục, nên cân nhắc chuyển dấu này ngay sau “hôn ông” để quan hệ chú thích rõ hơn.
