base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: vi
  text: 'Ê-sau nói: “Xin để tôi để lại bên em một số người đi cùng tôi.” Nhưng Gia-cốp đáp: “Việc ấy để làm gì? Mong tôi được anh thương tình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: Xin để tôi để lại
  rationale: Động từ יצג ở thể hifil diễn tả việc cho một số người ở lại; נָא tạo sắc thái đề nghị lịch sự.
- source_word: עִמְּךָ
  choice: bên em
  rationale: Trong ngữ cảnh, Ê-sau đề nghị để người của mình ở lại với Gia-cốp; “bên em” tự nhiên hơn “với em” trong tiếng Việt ở cấu trúc này.
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: một số người đi cùng tôi
  rationale: מִן mang nghĩa lấy một phần trong nhóm người đang ở với Ê-sau.
- source_word: לָמָּה זֶּה
  choice: Làm thế để làm gì?
  rationale: Cụm hỏi ngắn có sắc thái từ chối lịch sự; cách dịch này giữ chức năng ngữ dụng mà vẫn không bổ sung lý do cụ thể.
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: Chỉ cần tôi được đẹp lòng anh là đủ
  rationale: Thành ngữ חֵן בְּעֵינֵי nghĩa là được thiện cảm/đẹp lòng. “Anh” phản ánh việc Gia-cốp kính trọng xưng hô với người anh Ê-sau; “chỉ cần…là đủ” làm rõ lực của lời đáp trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và tự nhiên trong đối thoại anh em. Dùng cặp xưng hô “tôi/em” cho lời Ê-sau và “tôi/anh” cho lời Gia-cốp để phản ánh quan hệ tuổi tác cùng thái độ kính nhường, nhưng tránh lối xưng hô quá cổ.
