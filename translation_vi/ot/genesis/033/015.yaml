- from: 'Ê-sau nói: “Xin để tôi để lại bên em một số người đi cùng tôi.” Nhưng Gia-cốp đáp: “Làm thế để làm gì? Chỉ cần tôi được đẹp lòng anh là đủ.”'
  to: 'Ê-sau nói: “Xin để tôi để lại bên em một số người đi cùng tôi.” Nhưng Gia-cốp đáp: “Việc ấy để làm gì? Mong tôi được anh thương tình.”'
  rationale: Sửa vế đáp của Gia-cốp để không thêm ý “chỉ cần/là đủ”, đồng thời diễn đạt thành ngữ xin ân huệ bằng tiếng Việt hiện đại, tự nhiên và vẫn giữ thái độ kính nhường của lời nói.
