base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: vi
  text: “Xin anh nhận món quà của em đã được mang đến cho anh, vì Đức Chúa Trời đã ban ơn cho em, và vì em có đủ mọi thứ.” Gia-cốp nài ép Ê-sau, và Ê-sau nhận lấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: món quà của em
  rationale: Nghĩa đen là “phước lành của tôi”, nhưng trong ngữ cảnh chỉ lễ vật Gia-cốp biếu Ê-sau (x. câu 10); “món quà” truyền đạt đúng chức năng ngữ cảnh trong tiếng Việt, đồng thời tránh khiến độc giả hiểu đây là lời chúc phước.
- source_word: חַנַּנִי
  choice: đã ban ơn cho em
  rationale: Động từ חנן diễn tả việc đối xử nhân từ, ưu ái; “ban ơn” vừa tự nhiên vừa giữ sắc thái ân huệ đến từ Đức Chúa Trời.
- source_word: יֶשׁ לִי כֹל
  choice: em có đủ mọi thứ
  rationale: Cụm này có thể dịch sát là “tôi có mọi sự”; “có đủ mọi thứ” biểu đạt ý Gia-cốp không thiếu thốn mà không cường điệu thành sở hữu tuyệt đối.
- source_word: וַיִּפְצַר בּוֹ
  choice: Gia-cốp nài ép Ê-sau
  rationale: Động từ פצר mang nghĩa thúc ép, khẩn khoản đến mức người kia chấp thuận. Dùng tên riêng làm rõ các đại từ nam giống liên tiếp trong tiếng Hê-bơ-rơ.
- source_word: וַיִּקָּח
  choice: nên ông nhận lấy
  rationale: Chủ thể là Ê-sau theo mạch văn; “nhận lấy” phù hợp với việc chấp nhận lễ vật hơn nghĩa chung “lấy”.
theological_decisions:
- issue: Ý nghĩa của בִּרְכָתִי trong lời Gia-cốp
  choice: món quà của em
  alternative: phước lành của em
  rationale: Từ này thường có nghĩa “phước lành”, nhưng ở đây là cách gọi lễ vật đã được đem đến. Bản dịch chính ưu tiên nghĩa ngữ cảnh, không áp đặt liên hệ thần học với phước lành Gia-cốp đã nhận ở chương 27.
- issue: Phạm vi của כֹל
  choice: đủ mọi thứ
  alternative: mọi sự
  rationale: Cách dịch giữ lời xác nhận về sự sung túc do ân Đức Chúa Trời, nhưng không biến nó thành tuyên bố sở hữu tất cả theo nghĩa tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “anh—em” phù hợp quan hệ anh em giữa Ê-sau và Gia-cốp; thêm tên riêng ở câu kể để tránh sự mơ hồ không tự nhiên của chuỗi đại từ tiếng Việt.
