  yaml_path: translation/ot/genesis/033/016.yaml
  text: So Esau returned that day on his way to Seir[a].
translation:
  language: vi
  text: Vậy, hôm ấy Ê-sau trở lại hành trình của mình, đi về Sê-i-rơ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: trở về
  rationale: Động từ שׁוב ở dạng kể chuyện chỉ hành động quay lại; “trở về” tự nhiên trong tiếng Việt và phù hợp với bối cảnh hành trình.
- source_word: בַּיּוֹם הַהוּא
  choice: ngay trong ngày ấy
  rationale: Cụm từ có nghĩa đen là “trong/vào ngày ấy.” Thêm “ngay” diễn đạt tự nhiên việc Ê-sau khởi hành trở về chính ngày đó, mà không hiểu thành “cùng ngày” theo một mốc khác.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לְדַרְכּוֹ
  choice: lên đường
  rationale: Cụm từ nghĩa đen là “về phía/con đường của mình”; trong ngữ cảnh tiếp tục hành trình, “lên đường” truyền đạt tự nhiên ý bắt đầu đi theo đường trở về.
- source_word: שֵׂעִירָה
  choice: về Sê-i-rơ
  rationale: Hậu tố chỉ hướng -ָה trên địa danh biểu thị chuyển động hướng đến Sê-i-rơ; tiếng Việt diễn đạt tự nhiên bằng “về Sê-i-rơ”.
