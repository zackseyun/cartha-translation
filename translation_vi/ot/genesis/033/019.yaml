    rationale: Trong lời tường thuật trang trọng, “ông” rõ chủ ngữ và tự nhiên hơn, đồng thời phản ánh cách quy chiếu đến Gia-cốp từ ngữ cảnh.
  - severity: low
    issue: Cụm “từ tay các con trai của Hê-mô”
    rationale: Đây là lối bám sát thành ngữ מִיַּד nhưng không tự nhiên trong tiếng Việt. “Từ các con trai của Hê-mô” bảo toàn ý mua từ những người đang nắm quyền chuyển nhượng mà không tạo thành ngữ gượng.
  - severity: low
    issue: “Phần ruộng” có thể gợi riêng ruộng lúa
    rationale: חֶלְקַת הַשָּׂדֶה chỉ một phần/parcela của cánh đồng hay đất đai. “Mảnh đất” phù hợp và tự nhiên hơn trong bối cảnh mua đất.
