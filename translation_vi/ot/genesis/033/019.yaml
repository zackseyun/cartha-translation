revisions:
- from: Ông mua phần ruộng nơi mình đã dựng lều, từ tay các con trai của Hê-mô, cha của Si-chem, với giá một trăm kê-si-ta.[a]
  to: Ông mua mảnh đất nơi ông đã dựng lều từ các con trai của Hê-mô, cha của Si-chem, với giá một trăm kê-si-ta.[a]
  rationale: 'Chỉnh sửa hạn chế nhằm tăng tính tự nhiên của tiếng Việt hiện đại: thay “mình” bằng “ông”, bỏ thành ngữ “từ tay” vốn gượng trong tiếng Việt, và dùng “mảnh đất” để tránh sắc thái quá hẹp của “ruộng”. Nội dung, quan hệ cú pháp và tính bất định của kê-si-ta đều được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:43:14Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng giao dịch mua, mảnh đất/cánh đồng, địa điểm Gia-cốp đã dựng lều, những người bán, quan hệ cha–con và giá một trăm qesitah. Thuật ngữ kê-si-ta cùng chú thích phù hợp vì giá trị chính xác của từ Hê-bơ-rơ còn bất định.
  naturalness: Cụm “nơi mình đã dựng lều” hơi khẩu ngữ và đại từ “mình” không phù hợp bằng “ông” trong văn phong tường thuật trang trọng. “Từ tay các con trai của” là lối dịch sát nhưng kém tự nhiên trong tiếng Việt hiện đại; “từ các con trai của” vẫn bảo toàn đầy đủ ý nghĩa giao dịch.
  terminology: Tên riêng Hê-mô và Si-chem được giữ nhất quán. “Kê-si-ta” là phiên âm thận trọng, không áp đặt một giá trị hay loại tiền tệ cụ thể. “Mảnh đất” diễn đạt tự nhiên hơn “phần ruộng” mà không thêm nghĩa đất trồng lúa.
