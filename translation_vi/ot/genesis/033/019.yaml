base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: vi
  text: Ông mua mảnh đất nơi ông đã dựng lều từ các con trai của Hê-mô, cha của Si-chem, với giá một trăm kê-si-ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: kê-si-ta; một đơn vị hoặc vật dùng để thanh toán thời cổ, có giá trị chính xác chưa rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: mua
  rationale: Trong bối cảnh giao dịch đất đai và có nêu giá, động từ קנה tự nhiên nhất là “mua”.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: phần ruộng
  rationale: חֶלְקָה chỉ một phần hoặc thửa đất xác định; “phần ruộng” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: nơi mình đã dựng lều
  rationale: נטה đi với אֹהֶל là thành ngữ chỉ việc dựng lều; “đã dựng” thể hiện hành động xảy ra trước việc mua.
- source_word: מִיַּד
  choice: từ tay
  rationale: Giữ hình ảnh nguyên ngữ “từ tay”, đồng thời diễn đạt việc tài sản được chuyển từ quyền sở hữu hoặc kiểm soát của người bán.
- source_word: בְּנֵי חֲמוֹר
  choice: các con trai của Hê-mô
  rationale: Dịch trực tiếp chuỗi sở hữu, không thu hẹp số nhiều của nguyên văn.
- source_word: אֲבִי שְׁכֶם
  choice: cha của Si-chem
  rationale: Cụm đồng vị xác định Hê-mô là cha của nhân vật Si-chem.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: với giá một trăm kê-si-ta
  rationale: “Với giá” diễn đạt tự nhiên giá mua; phiên âm קְשִׂיטָה vì đây là đơn vị hoặc vật dùng thanh toán thời cổ có giá trị chính xác chưa rõ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể là Gia-cốp từ ngữ cảnh trước; giữ “từ tay” để bảo tồn sắc thái giao dịch của nguyên ngữ. Dấu chú thích [a] được đặt ngay sau thuật ngữ cần giải thích.
