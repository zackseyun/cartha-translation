  text: וַ/יִּשָּׂ֣א אֶת עֵינָ֗י/ו וַ/יַּ֤רְא אֶת הַ/נָּשִׁים֙ וְ/אֶת הַ/יְלָדִ֔ים וַ/יֹּ֖אמֶר מִי אֵ֣לֶּה לָּ֑/ךְ וַ/יֹּאמַ֕ר הַ/יְלָדִ֕ים אֲשֶׁר חָנַ֥ן אֱלֹהִ֖ים אֶת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: vi
  text: 'Ông ngước mắt lên, thấy những phụ nữ và trẻ em, thì hỏi: “Những người này là ai đối với em?”[a] Gia-cốp đáp: “Đó là những đứa con mà Đức Chúa Trời đã ân ban cho đầy tớ anh.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Những người này là ai đối với em?” Cách nói Hê-bơ-rơ hỏi về mối quan hệ của họ với Gia-cốp; cũng có thể hiểu là: “Những người đi với em là ai?”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đó là những đứa con mà Đức Chúa Trời đã ban cho đầy tớ anh.” Động từ Hê-bơ-rơ cũng hàm ý Đức Chúa Trời ban với ân huệ hoặc lòng nhân từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: Ông ngước mắt lên
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ việc ngước nhìn, đồng thời giữ sắc thái trần thuật của nguyên văn.
- source_word: הַנָּשִׁים
  choice: các phụ nữ
  rationale: Giữ nghĩa rộng của danh từ Hê-bơ-rơ, không tự ý cụ thể hóa thành “các bà vợ” dù văn cảnh cho biết mối quan hệ của họ với Gia-cốp.
- source_word: הַיְלָדִים
  choice: trẻ em / những đứa con
  rationale: Ở lời kể, “trẻ em” tự nhiên và không định trước quan hệ; trong câu trả lời, “những đứa con” làm rõ chính quan hệ mà Ê-sau đang hỏi.
- source_word: מִי אֵלֶּה לָּךְ
  choice: Những người này là ai đối với em?
  rationale: Phản ánh sát cấu trúc “ai là những người này đối với ngươi”, tức hỏi mối quan hệ của những người đi cùng Gia-cốp; cách xưng hô “anh–em” phù hợp quan hệ anh em và lời tự hạ của Gia-cốp.
- source_word: חָנַן
  choice: đã ban ơn cho
  rationale: Giữ sắc thái ân huệ, ưu ái của động từ חנן, thay vì giản lược thành “đã ban”.
- source_word: עַבְדֶּךָ
  choice: đầy tớ anh
  rationale: Thể hiện lối Gia-cốp tự xưng khiêm nhường với Ê-sau mà không cường điệu thành địa vị nô lệ.
theological_decisions:
- issue: Sắc thái ân huệ của Đức Chúa Trời trong lời Gia-cốp
  choice: Dịch חָנַן là “đã ban ơn cho”
  alternative: “đã ban cho”
  rationale: Động từ nguyên ngữ biểu thị việc tỏ ơn hoặc ưu ái; bản dịch giữ sắc thái thần học vốn có mà không thêm ý ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “anh–em” theo quan hệ Ê-sau là anh, Gia-cốp là em; cụm “đầy tớ anh” bảo tồn phép tự xưng khiêm nhường trong cuộc đối thoại. Tên “Gia-cốp” được nêu ở vế đáp để tránh sự mơ hồ do hai chủ thể nam liên tiếp trong tiếng Việt.
