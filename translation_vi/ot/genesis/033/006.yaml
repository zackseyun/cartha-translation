  source_fidelity: 'Bản dịch giữ đúng trình tự tường thuật và các thành tố chính: các שְׁפָחוֹת cùng con cái họ đến gần rồi thực hiện cử chỉ השתחוה. Tuy nhiên, “tiến đến” hơi thiếu rõ nét nghĩa đến gần; “tiến lại gần” phản ánh נגשׁ trực tiếp hơn. “Phủ phục” diễn đạt tự nhiên và đầy đủ cử chỉ cúi/sấp mình tỏ lòng quy phục hay kính trọng, nhưng không áp đặt một diễn giải thần học.'
  naturalness: “Rồi các nữ tỳ cùng con cái họ tiến lại gần và phủ phục” là câu kể tự nhiên, trang trọng vừa phải, và phù hợp tiếng Việt hiện đại trong văn mạch Kinh Thánh. “Nữ tỳ” vẫn có thể dùng trong văn phong này; chú thích làm rõ địa vị xã hội mà không làm nặng câu chính.
  terminology: “Nữ tỳ” là cách gọi ngắn gọn, xác định giới tính và phù hợp với שִׁפְחָה; chú thích nêu khả năng “nữ nô lệ” là cần thiết. “Phủ phục” phù hợp với השתחוה hơn một cử chỉ cúi nhẹ, đồng thời tránh khẳng định hành vi này là thờ phượng.
