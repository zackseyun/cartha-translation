  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: vi
  text: Rồi các nữ tỳ cùng con cái họ tiến lại gần và phủ phục.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nữ nô lệ”; từ Hê-bơ-rơ chỉ những phụ nữ ở địa vị tôi tớ hoặc nô lệ.
    reason: lexical_alternative
  - marker: b
    text: Hay “cúi mình xuống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: tiến đến
  rationale: Động từ נגשׁ ở thể trần thuật nối tiếp, ngôi thứ ba số nhiều giống cái, diễn tả họ tiến lại gần Ê-sau; “tiến đến” tự nhiên và giữ được ý chuyển động.
- source_word: הַשְּׁפָחוֹת
  choice: các nữ tỳ
  rationale: שִׁפְחָה chỉ nữ đầy tớ hoặc nữ nô lệ. “Nữ tỳ” ngắn gọn, trang trọng và xác định rõ giới tính; chú thích nêu cách dịch trực diện hơn về thân phận.
- source_word: הֵנָּה
  choice: cùng
  rationale: Đại từ độc lập giống cái số nhiều nhấn mạnh hoặc đồng vị với “các nữ tỳ” trong cấu trúc “họ và con cái họ”. Tiếng Việt tự nhiên diễn đạt cả nhóm bằng “các nữ tỳ cùng con cái họ”.
- source_word: וְיַלְדֵיהֶן
  choice: cùng con cái họ
  rationale: Cụm từ có nghĩa là “và con cái của họ”; “cùng” diễn đạt tự nhiên việc các bà và con cái đồng thời tiến đến.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: sấp mình xuống
  rationale: Động từ השתחוה diễn tả hành động cúi thấp hoặc phủ phục để bày tỏ sự kính trọng. “Sấp mình xuống” giữ được sắc thái thân thể đầy đủ hơn “cúi chào” mà vẫn tự nhiên.
