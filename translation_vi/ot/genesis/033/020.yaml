  rationale: Giữ nguyên bản văn chính vì sát nghĩa và tự nhiên. Chỉnh chú thích để không thay thế El/Elohei bằng một danh xưng có thể gợi tên riêng không có trong nguyên văn, đồng thời làm rõ cách diễn đạt của phương án tuyên xưng.
