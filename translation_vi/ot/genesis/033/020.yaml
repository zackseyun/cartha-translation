  yaml_path: translation/ot/genesis/033/020.yaml
  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: vi
  text: Tại đó, ông dựng một bàn thờ và gọi bàn thờ ấy là Ên Ê-lô-hê Y-sơ-ra-ên[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tại đó, ông dựng một bàn thờ và kêu cầu Ngài: ‘Thượng Đế, Thượng Đế của Y-sơ-ra-ên,’” hoặc: “và tuyên xưng về bàn thờ ấy: ‘Thượng Đế là Thượng Đế của Y-sơ-ra-ên.’” Tiếng Hê-bơ-rơ có thể được hiểu là đặt tên cho bàn thờ, hoặc là kêu cầu hay tuyên xưng về Thượng Đế.'
    reason: alternative_reading
  - marker: b
    text: Ên Ê-lô-hê Y-sơ-ra-ên có nghĩa là “Thượng Đế, Thượng Đế của Y-sơ-ra-ên” hoặc “Ên, Thượng Đế của Y-sơ-ra-ên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: dựng
  rationale: Động từ נצב ở thể Hifil có nghĩa là dựng hoặc thiết lập; “dựng” tự nhiên và phù hợp với việc lập một bàn thờ.
- source_word: שָׁם
  choice: tại đó
  rationale: Trạng từ này trực tiếp chỉ địa điểm; “tại đó” rõ ràng và có sắc thái trang trọng vừa phải.
- source_word: מִזְבֵּחַ
  choice: bàn thờ
  rationale: Đây là cách gọi thông dụng trong tiếng Việt đối với công trình dùng để dâng tế lễ.
- source_word: וַיִּקְרָא לוֹ
  choice: gọi bàn thờ ấy là
  rationale: Cấu trúc קרא + ל có thể chỉ việc đặt tên. Việc nói rõ “bàn thờ ấy” giúp tiếng Việt tự nhiên và tránh đại từ mơ hồ, nhưng khả năng hiểu là kêu cầu hoặc tuyên xưng được giữ trong chú thích.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: Ên Ê-lô-hê Y-sơ-ra-ên
  rationale: Toàn cụm được giữ dưới dạng phiên âm vì trong cách hiểu chính nó là tên của bàn thờ; chú thích cung cấp nghĩa của cụm tiếng Hê-bơ-rơ. “Ên” phản ánh אֵל (El) theo lối phiên âm tiếng Việt quen dùng trong tên này.
theological_decisions:
- issue: Cụm cuối là tên của bàn thờ hay lời kêu cầu/tuyên xưng về Đức Chúa Trời
  choice: Hiểu là tên Gia-cốp đặt cho bàn thờ
  alternative: 'Ông kêu cầu: “Đức Chúa Trời, Đức Chúa Trời của Y-sơ-ra-ên,” hoặc tuyên bố trên bàn thờ: “Đức Chúa Trời là Đức Chúa Trời của Y-sơ-ra-ên.”'
  rationale: Cú pháp ngay sau việc dựng bàn thờ và các công thức đặt tên tương tự trong Sáng Thế Ký ủng hộ cách hiểu là đặt tên. Tuy vậy, cấu trúc Hê-bơ-rơ cô đọng cũng cho phép cách hiểu là kêu cầu hoặc tuyên xưng, nên sự mơ hồ được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Tên bàn thờ được phiên âm, còn ý nghĩa và sự mơ hồ thực sự của nguyên văn được trình bày trong chú thích.
