revisions:
- from: Bấy giờ, Giô-sép truyền lệnh đổ đầy lương thực vào các đồ đựng của họ[a], trả lại bạc của mỗi người vào bao người ấy[b], và cấp lương thực cho họ dùng dọc đường. Người ta đã làm cho họ đúng như vậy[c].
  to: Bấy giờ, Giô-sép truyền lệnh làm đầy các đồ đựng của họ[a] bằng ngũ cốc, trả lại bạc của mỗi người vào bao của người ấy[b], và cấp cho họ đồ ăn đi đường. Người ta đã làm như thế cho họ[c].
  rationale: Bản sửa giữ nguyên ý nghĩa và tính không xác định về chủ thể ở mệnh đề cuối, đồng thời dùng “ngũ cốc” cho בָּר và “đồ ăn đi đường” cho צֵדָה để bảo toàn phân biệt từ vựng của nguyên văn. Các chỉnh sửa còn lại nhằm tăng độ tự nhiên của tiếng Việt hiện đại.
