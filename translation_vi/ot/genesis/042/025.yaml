translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giô-sép” theo lối phiên âm Kinh Thánh quen thuộc; giữ phân biệt giữa “đồ đựng” và “bao”, đồng thời bảo tồn sự không xác định của tác nhân trong mệnh đề cuối.
