base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: vi
  text: Bấy giờ, Giô-sép truyền lệnh làm đầy các đồ đựng của họ[a] bằng ngũ cốc, trả lại bạc của mỗi người vào bao của người ấy[b], và cấp cho họ đồ ăn đi đường. Người ta đã làm như thế cho họ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các vật dụng của họ”; từ Hê-bơ-rơ ở đây có nghĩa rộng hơn từ “bao” xuất hiện sau đó trong câu.
    reason: lexical_alternative
  - marker: b
    text: “Bạc” trong ngữ cảnh này cũng có nghĩa là “tiền”.
    reason: lexical_alternative
  - marker: c
    text: Hay “Ông đã làm như vậy cho họ.” Chủ thể của động từ số ít không được nêu đích danh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Động từ צוה diễn tả việc ban lệnh; “truyền lệnh” tự nhiên, trang trọng và phù hợp với chuỗi mệnh lệnh gián tiếp theo sau.
- source_word: כְּלֵיהֶם
  choice: các đồ đựng của họ
  rationale: כְּלִי là từ rộng chỉ vật dụng hay đồ chứa. Cách dịch này giữ sự phân biệt với שַׂק, từ cụ thể hơn chỉ “bao”, xuất hiện ngay sau đó.
- source_word: בָּר
  choice: lương thực
  rationale: Trong bối cảnh nạn đói và việc mua lúa tại Ai Cập, בָּר chỉ ngũ cốc dùng làm lương thực. “Lương thực” đọc tự nhiên trong tiếng Việt và tránh thu hẹp thành một loại hạt cụ thể.
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם
  choice: trả lại bạc của họ
  rationale: כֶּסֶף có nghĩa đen là “bạc” và trong ngữ cảnh cũng là tiền. Giữ “bạc” bảo tồn hình ảnh cụ thể xuyên suốt câu chuyện.
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: bạc của mỗi người vào bao người ấy
  rationale: אִישׁ được dùng theo nghĩa phân phối, “mỗi người”; שַׂק là bao, khác với từ rộng hơn chỉ đồ đựng ở đầu câu.
- source_word: וְלָתֵת לָהֶם צֵדָה לַדָּרֶךְ
  choice: cấp lương thực cho họ dùng dọc đường
  rationale: צֵדָה chỉ thức ăn hay vật dụng dự trữ cho chuyến đi. Cách diễn đạt này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Người ta đã làm cho họ đúng như vậy
  rationale: Động từ số ít có chủ thể không được nêu rõ. “Người ta” giữ tính bất định của tác nhân tốt hơn việc quy trực tiếp hành động cho Giô-sép, đồng thời diễn đạt tự nhiên hơn câu bị động trong tiếng Việt.
