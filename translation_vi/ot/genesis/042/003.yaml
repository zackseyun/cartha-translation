  yaml_path: translation/ot/genesis/042/003.yaml
  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: vi
  text: Vậy, mười anh em trai của Giô-sép đi xuống Ai Cập để mua ngũ cốc từ Ai Cập.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để mua ngũ cốc tại Ai Cập.” Tiếng Hê-bơ-rơ sát nghĩa hơn là “để mua ngũ cốc từ Ai Cập,” nhấn mạnh nguồn cung cấp ngũ cốc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: đi xuống Ai Cập
  rationale: Động từ ירד có nghĩa cơ bản là “đi xuống.” Trong ngữ cảnh này, cụm từ diễn tả hành trình xuống Ai Cập; thêm “Ai Cập” ngay sau động từ giúp câu tiếng Việt tự nhiên, còn giới từ מִן ở cuối câu được thể hiện bằng “từ đó.”
- source_word: אֲחֵי יוֹסֵף עֲשָׂרָה
  choice: mười người anh em của Giô-sép
  rationale: Giữ rõ số lượng mười và quan hệ thân thuộc với Giô-sép. “Anh em” bảo tồn khả năng chỉ các anh/em trai, dù theo mạch truyện đây là những người anh của Giô-sép.
- source_word: לִשְׁבֹּר
  choice: để mua
  rationale: Trong trình thuật nạn đói, שׁבר là động từ dùng cho việc mua hoặc kiếm mua lương thực, đặc biệt là ngũ cốc. “Để mua” là cách diễn đạt rõ ràng, tự nhiên.
- source_word: בָּר
  choice: ngũ cốc
  rationale: בָּר chỉ lương thực dạng hạt. “Ngũ cốc” chính xác hơn “lương thực” và tự nhiên trong tiếng Việt hiện đại.
- source_word: מִמִּצְרָיִם
  choice: từ đó
  rationale: Giới từ מִן mang nghĩa nguồn gốc “từ.” Vì “Ai Cập” đã được đặt sau “đi xuống” để câu tự nhiên, “từ đó” giữ lại ý ngũ cốc có nguồn từ Ai Cập mà không lặp địa danh nặng nề.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ thành ngữ địa lý “đi xuống” và sắc thái nguồn gốc của giới từ Hê-bơ-rơ, đồng thời tránh lặp “Ai Cập” bằng đại từ “đó.”
