  text: וַ/יַּכֵּ֥ר יוֹסֵ֖ף אֶת אֶחָ֑י/ו וְ/הֵ֖ם לֹ֥א הִכִּרֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/008.yaml
  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: vi
  text: Giô-sép nhận ra các anh mình[a], nhưng họ không nhận ra ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ lặp lại cùng một động từ trong cả hai vế: “Giô-sép nhận ra các anh mình, nhưng họ không nhận ra ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: nhận ra
  rationale: Dạng Hifil của נכר ở đây chỉ việc nhận diện một người đã từng biết; “nhận ra” tự nhiên trong tiếng Việt và phù hợp với sự tương phản trong câu.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֶת־אֶחָיו
  choice: các anh mình
  rationale: אָח ở số nhiều giống đực chỉ những người anh em trai của Giô-sép; trong bối cảnh này họ đều là anh của ông, nên “các anh mình” chính xác và tự nhiên hơn “các anh em mình”.
- source_word: וְהֵם
  choice: nhưng họ
  rationale: Liên từ ו về hình thức có thể là “và”, nhưng tại đây mang sắc thái tương phản giữa việc Giô-sép nhận ra họ và việc họ không nhận ra ông.
- source_word: לֹא
  choice: không
  rationale: Cách phủ định trực tiếp, tự nhiên trong tiếng Việt.
- source_word: הִכִּרֻהוּ
  choice: nhận ra ông
  rationale: Giữ nguyên cách dịch động từ נכר như ở vế đầu để bảo tồn sự lặp từ và nét trớ trêu của câu chuyện; hậu tố đại từ chỉ Giô-sép được diễn đạt là “ông”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để chỉ Giô-sép trong lời kể; “mình” làm đại từ sở hữu phản thân tự nhiên. Giữ sự lặp lại của “nhận ra” trong hai vế.
