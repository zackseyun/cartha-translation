base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: vi
  text: Nhưng họ không biết rằng Giô-sép hiểu[a] lời họ nói, vì có người thông ngôn ở giữa họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «đang nghe»; trong ngữ cảnh, hàm ý rằng ông hiểu lời họ nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Nhưng họ
  rationale: Liên từ cùng đại từ tạo nét tương phản với mạch văn trước; “Nhưng họ” diễn đạt tự nhiên và vẫn giữ chủ ngữ tường minh.
- source_word: לֹא יָדְעוּ
  choice: không biết
  rationale: Động từ ידע ở thể hoàn thành diễn tả việc họ không có nhận thức này; “không biết” là cách dịch trực tiếp và tự nhiên.
- source_word: כִּי
  choice: rằng
  rationale: כִּי thứ nhất dẫn vào nội dung điều họ không biết.
- source_word: שֹׁמֵעַ
  choice: hiểu lời họ nói
  rationale: Nghĩa cơ bản là “nghe”, nhưng trong bối cảnh có người thông ngôn, trọng tâm là Giô-sép hiểu được ngôn ngữ và lời anh em nói. Cách dịch này làm rõ nghĩa theo ngữ cảnh mà không đổi ý câu.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Phiên âm tên riêng theo lối dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: כִּי thứ hai nêu lý do khiến các anh không biết Giô-sép hiểu họ.
- source_word: הַמֵּלִיץ
  choice: một người thông ngôn
  rationale: Trong ngữ cảnh này, danh từ chỉ người trung gian truyền đạt lời nói giữa hai bên dùng ngôn ngữ khác nhau; “người thông ngôn” chính xác và trang trọng.
- source_word: בֵּינֹתָם
  choice: giữa ông và họ có
  rationale: Cụm từ chỉ vị trí hoặc vai trò trung gian giữa Giô-sép và các anh; đảo thành cấu trúc hiện hữu giúp câu tiếng Việt tự nhiên và xác định rõ hai phía.
