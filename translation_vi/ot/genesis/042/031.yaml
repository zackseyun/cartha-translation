  terminology: “Ngay thật” diễn đạt phù hợp כֵּנִים trong lời tự biện hộ, và “gián điệp” là thuật ngữ chuẩn cho מְרַגְּלִים. Không cần chú thích vì không có điểm mơ hồ cần thiết phải giữ trong bản văn.
