  source_fidelity: 'Bản nháp chuyển tải đúng ý chính: các anh em thuật lại rằng họ đã khẳng định mình là người ngay thật và không phải gián điệp. Tuy nhiên, “thưa” đưa vào sắc thái kính cẩn không được biểu thị bởi אמר (“nói”); tuy bối cảnh có thể khiến cách nói này hợp lý, bản dịch tương đương tối ưu nên không mã hóa thêm sắc thái ấy. “Đã nói” giữ được thì quá khứ của wayyiqtol mà không thêm hàm ý.'
