  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thưa” để phản ánh tương quan giao tiếp với vị quan Ai Cập, không thêm danh xưng hay sắc thái thần học không có trong nguyên văn.
