  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: vi
  text: 'Chúng tôi đã nói với ông: “Chúng tôi là người ngay thật; chúng tôi không phải là gián điệp.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Chúng tôi đã thưa
  rationale: Động từ wayyiqtol của אמר tiếp nối lời thuật lại. Trong ngữ cảnh nói với một người có địa vị, “thưa” tự nhiên và phù hợp hơn “nói”, còn “đã” biểu thị hành động trong quá khứ.
- source_word: אֵלָיו
  choice: với ông ấy
  rationale: Giới từ אֶל cùng hậu tố ngôi ba số ít giống đực chỉ người được nói với; “với ông ấy” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: כֵּנִים
  choice: những người ngay thật
  rationale: Tính từ số nhiều כֵּנִים mô tả họ là người chân thật, đáng tin, đối lập với lời buộc tội làm gián điệp. “Ngay thật” giữ được cả sắc thái trung thực lẫn ngay thẳng.
- source_word: אֲנָחְנוּ
  choice: chúng tôi
  rationale: Đại từ độc lập mang sắc thái nhấn mạnh; “chúng tôi” phù hợp khi nhóm người nói với một người không thuộc nhóm.
- source_word: לֹא הָיִינוּ
  choice: chúng tôi không phải là
  rationale: Cấu trúc phủ định היה với phân từ diễn tả việc phủ nhận thân phận hoặc hoạt động trong quá khứ. Trong lời thuật lại trực tiếp này, tiếng Việt tự nhiên dùng “không phải là” mà không cần lặp dấu hiệu quá khứ.
- source_word: מְרַגְּלִים
  choice: gián điệp
  rationale: Phân từ của רגל trong ngữ cảnh này chỉ những người hoạt động do thám; danh từ “gián điệp” là cách gọi thông dụng và chính xác trong tiếng Việt.
