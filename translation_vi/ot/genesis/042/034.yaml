  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: vi
  text: Hãy đưa em trai út của các ngươi đến với ta, để ta biết rằng các ngươi không phải là gián điệp, nhưng là những người trung thực. Bấy giờ, ta sẽ trả người anh em của các ngươi cho các ngươi, và các ngươi có thể buôn bán trong xứ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và các ngươi có thể đi lại trong xứ.” Động từ Hê-bơ-rơ có thể được hiểu rộng hơn là đi đây đó, dù nghĩa thương mại “buôn bán” phù hợp nhất với văn cảnh này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: Hãy đưa
  rationale: Thể Hiphil mệnh lệnh của בוא diễn đạt lời truyền trực tiếp; “hãy đưa” tự nhiên và giữ sắc thái mệnh lệnh.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: em trai út của các ngươi
  rationale: הַקָּטֹן chỉ người nhỏ hoặc trẻ hơn; trong quan hệ anh em ở văn cảnh này, “em trai út” là cách diễn đạt chính xác và tự nhiên.
- source_word: אֵלַי
  choice: đến gặp ta
  rationale: Diễn đạt hướng về người nói bằng tiếng Việt tự nhiên; không thêm ý ngoài việc đưa người em đến chỗ người nói.
- source_word: וְאֵדְעָה
  choice: để ta biết
  rationale: Dạng cohortative sau mệnh lệnh nêu mục đích hoặc kết quả dự kiến; “để ta biết” thể hiện rõ quan hệ ấy.
- source_word: כִּי לֹא מְרַגְּלִים אַתֶּם
  choice: các ngươi không phải là gián điệp
  rationale: מְרַגְּלִים là danh từ/chủ thể nghề nghiệp số nhiều, phù hợp với “gián điệp” trong bối cảnh lời cáo buộc.
- source_word: כִּי כֵנִים אַתֶּם
  choice: nhưng là những người trung thực
  rationale: כֵנִים mô tả sự chân thật, đáng tin; “những người trung thực” giữ thế đối lập với “gián điệp” mà không nâng nghĩa thành một phẩm chất thần học chuyên biệt.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: ta sẽ trả người anh em của các ngươi lại cho các ngươi
  rationale: Trong văn cảnh người anh em đang bị giữ lại, “trả ... lại” diễn đạt tự nhiên sự hoàn trả vốn được hàm ý trong câu Hê-bơ-rơ.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: và các ngươi có thể buôn bán trong xứ
  rationale: סחר thường mang nghĩa giao thương hoặc buôn bán; văn cảnh nạn đói và việc mua lương thực ủng hộ nghĩa thương mại, đồng thời chú thích bảo lưu nghĩa rộng hơn.
