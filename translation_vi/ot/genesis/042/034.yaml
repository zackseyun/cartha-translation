translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/các ngươi” phù hợp với lời của viên quan Ai Cập nói với một nhóm người trong bối cảnh cổ đại. Dấu chú thích [a] được đặt sau mệnh đề có từ ngữ cần giải thích.
