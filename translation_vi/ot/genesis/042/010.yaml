  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: vi
  text: 'Nhưng họ thưa với ông: “Không, thưa ngài; các tôi tớ của ngài đến để mua lương thực.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngũ cốc.” Tiếng Hê-bơ-rơ nói “lương thực,” dù trong bối cảnh nạn đói, thứ được nói đến rất có thể là ngũ cốc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Nhưng họ thưa với ông
  rationale: Liên từ וַ tiếp nối lời đối đáp nhưng ở đây mang sắc thái tương phản với lời buộc tội ngay trước đó, nên “nhưng” tự nhiên. “Thưa” diễn đạt lời nói kính cẩn với một quan chức cấp cao; “với ông” thể hiện אֵלָיו.
- source_word: לֹא
  choice: Không phải vậy
  rationale: Từ phủ định ở đây là lời bác bỏ dứt khoát lời buộc tội. “Không phải vậy” rõ nghĩa và tự nhiên hơn một tiếng “Không” đứng riêng trong tiếng Việt.
- source_word: אֲדֹנִי
  choice: thưa chúa
  rationale: Đây là lối xưng hô kính cẩn dành cho người có địa vị cao, không phải danh xưng thần linh trong ngữ cảnh này. “Thưa chúa” giữ được khoảng cách xã hội và thái độ phục tùng hơn “thưa ông”.
- source_word: וַעֲבָדֶיךָ
  choice: các đầy tớ của ngài
  rationale: עֶבֶד có thể chỉ nô lệ hoặc tôi tớ, nhưng ở đây là cách tự xưng khiêm nhường theo nghi thức, không khẳng định thân phận nô lệ. “Các đầy tớ của ngài” giữ được sắc thái ấy.
- source_word: בָּאוּ
  choice: đến
  rationale: Động từ hoàn thành nêu việc họ đã đến và mục đích hiện tại của chuyến đi. Trong lời thoại tiếng Việt, “đến để” tự nhiên và không cần đánh dấu thì quá khứ riêng.
- source_word: לִשְׁבָּר
  choice: để mua
  rationale: Trong bối cảnh nạn đói và việc phân phối lương thực, động từ mang nghĩa mua; cấu trúc לִ־ diễn tả mục đích.
- source_word: אֹכֶל
  choice: lương thực
  rationale: Danh từ có nghĩa rộng là thức ăn, nhưng trong bối cảnh nạn đói chỉ thực phẩm dự trữ, rất có thể là ngũ cốc. “Lương thực” vừa tự nhiên trong tiếng Việt vừa tránh xác định quá hẹp là “ngũ cốc”.
theological_decisions: []
translation_notes:
  register: Văn phong đối thoại trang trọng, dễ hiểu trong tiếng Việt hiện đại. Cách xưng “các đầy tớ của ngài” và lời gọi “thưa chúa” giữ nguyên sắc thái kính cẩn, phục tùng trong cuộc đối chất với quan chức Ai Cập. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
