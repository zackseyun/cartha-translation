  to: 'Nhưng họ thưa với ông: “Không, thưa ngài; các tôi tớ của ngài đến để mua lương thực.[a]”'
  rationale: Chỉ điều chỉnh hai cách xưng hô để bản dịch phù hợp hơn với tiếng Việt hiện đại, đồng thời giữ nguyên ý nghĩa, mức độ kính trọng, và sự mơ hồ từ vựng của nguyên ngữ. Dấu neo chú thích vẫn đặt ngay sau “lương thực,” là từ được chú giải.
