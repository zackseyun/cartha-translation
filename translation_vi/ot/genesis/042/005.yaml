base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: vi
  text: Vì thế, các con trai của Israel đến mua lương thực cùng với những người khác đang đến, vì trong xứ Canaan đang có nạn đói.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: đến
  rationale: Động từ בוא ở dạng wayyiqtol kể sự việc tiếp theo và được nhìn theo hướng họ đến nơi mua lương thực; “đến” tự nhiên trong mạch truyện.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Israel
  rationale: Cụm từ chỉ chính các con trai của Jacob, chứ không chỉ dân Israel nói chung; cách dịch này giữ đúng giới tính và quan hệ gia đình trong ngữ cảnh.
- source_word: לִשְׁבֹּר
  choice: mua lương thực
  rationale: Nghĩa cơ bản là “mua”; trong trình thuật về nạn đói, động từ này chỉ việc mua ngũ cốc hay lương thực. “Lương thực” tự nhiên trong tiếng Việt và không thu hẹp quá mức vào một loại hạt cụ thể.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: cùng với những người khác đang kéo đến
  rationale: בְּתוֹךְ diễn tả ở giữa hay thuộc trong một nhóm, còn phân từ הַבָּאִים chỉ những người đang đến. Cách diễn đạt này cho thấy họ thuộc dòng người cùng kéo đến mà tránh lối lặp gượng “đến giữa những người đang đến”.
- source_word: כִּי
  choice: bởi
  rationale: Liên từ nêu lý do họ đến cùng những người khác; “bởi” rõ và trang trọng vừa phải.
- source_word: הָיָה הָרָעָב
  choice: nạn đói đang hoành hành
  rationale: Mệnh đề nói về tình trạng nạn đói đã biết trong câu chuyện. “Đang hoành hành” truyền đạt tự nhiên rằng nạn đói hiện diện và tác động trong vùng, thay vì câu Việt gượng “nạn đói đã ở”.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: trong xứ Canaan
  rationale: Giữ danh ngữ địa lý cụ thể “xứ Canaan”, phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các con trai của Israel” để giữ đúng quy chiếu gia đình trong ngữ cảnh; dùng “lương thực” thay vì chỉ “ngũ cốc” vì động từ Hebrew không nêu tân ngữ và ngữ cảnh nạn đói cho phép nghĩa rộng hơn.
