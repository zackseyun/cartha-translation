    rationale: הָיָה הָרָעָב chỉ xác nhận tình trạng có nạn đói trong xứ Canaan; động từ này không tự nó diễn tả nạn đói ‘hoành hành’.
  - severity: low
    issue: “kéo đến” thêm sắc thái đoàn người ùn ùn đổ về.
    rationale: הַבָּאִים chỉ nói đến ‘những người đang đến’; bản dịch nên giữ cách nói trung tính.
  - severity: low
    issue: Chú thích hiện có bảo vệ một cách dịch sát nhưng không cần thiết sau khi câu chính được chỉnh.
    rationale: “Trong xứ Canaan đang có nạn đói” vừa tự nhiên vừa gần với mệnh đề Hebrew, nên không cần nêu một lựa chọn thay thế.
  revised_text: Vì thế, các con trai của Israel đến mua lương thực cùng với những người khác đang đến, vì trong xứ Canaan đang có nạn đói.
