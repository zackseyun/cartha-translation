base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: vi
  text: 'Vào ngày thứ ba, Giô-sép nói với họ: “Hãy làm điều này thì các anh sẽ sống[a], vì tôi kính sợ Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy làm điều này và sống.” Tiếng Hê-bơ-rơ có thể diễn tả mệnh lệnh tiếp theo, hoặc kết quả hàm ý của mệnh lệnh trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: nói với họ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho động từ אמר kèm giới từ và đại từ chỉ đối tượng tiếp nhận lời nói.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Đến ngày thứ ba
  rationale: Diễn đạt thời điểm tự nhiên trong mạch kể tiếng Việt, tương ứng với cụm thời gian Hê-bơ-rơ.
- source_word: זֹאת עֲשׂוּ
  choice: Hãy làm điều này
  rationale: Giữ nguyên sắc thái mệnh lệnh của động từ số nhiều và ý chỉ định của זֹאת.
- source_word: וִחְיוּ
  choice: thì các anh sẽ sống
  rationale: Diễn đạt tự nhiên hệ quả của mệnh lệnh trước đó; chú thích lưu lại khả năng hiểu đây là mệnh lệnh trực tiếp thứ hai.
- source_word: אֶת הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh Sáng Thế Ký, danh từ xác định chỉ Đức Chúa Trời; cách gọi này trang trọng và quen thuộc trong tiếng Việt.
- source_word: אֲנִי יָרֵא
  choice: tôi kính sợ
  rationale: Phân từ vị ngữ cùng đại từ nhấn mạnh diễn tả thái độ kính sợ mang tính thường xuyên; “kính sợ” bảo toàn cả lòng tôn kính lẫn ý thức trách nhiệm trước Đức Chúa Trời.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Phiên âm tên riêng theo hình thức Kinh Thánh tiếng Việt quen thuộc.
theological_decisions:
- issue: Ý nghĩa lời tuyên bố אֶת הָאֱלֹהִים אֲנִי יָרֵא
  choice: Giô-sép viện dẫn lòng kính sợ Đức Chúa Trời làm cơ sở cho cách ông đối xử với các anh mình.
  alternative: Giô-sép chỉ nói chung rằng mình kính sợ thần linh trong bối cảnh triều đình Ai Cập.
  rationale: Mạo từ xác định và văn mạch Sáng Thế Ký ủng hộ cách hiểu quy chiếu đến Đức Chúa Trời, nhưng bản dịch không thêm lời giải thích vượt quá nguyên văn.
- issue: Quan hệ cú pháp giữa זֹאת עֲשׂוּ và וִחְיוּ
  choice: 'Mệnh lệnh thứ nhất dẫn đến hệ quả: “Hãy làm điều này thì các anh sẽ sống.”'
  alternative: 'Hai mệnh lệnh nối tiếp: “Hãy làm điều này và hãy sống.”'
  rationale: Cấu trúc Hê-bơ-rơ có thể mang cả hai sắc thái; bản chính chọn lối nói tự nhiên trong tiếng Việt và ghi nhận cách hiểu kia ở chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Đại từ “các anh” phù hợp với việc Giô-sép nói với một nhóm đàn ông lớn tuổi hơn mình trong quan hệ gia đình, đồng thời không làm lộ thêm điều gì ngoài bối cảnh truyện.
