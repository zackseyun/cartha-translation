  text: And he put them in custody for three days[a].
translation:
  language: vi
  text: Rồi ông giam họ trong ba ngày.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Rồi ông đưa họ vào nơi canh giữ trong ba ngày.” Động từ Hê-bơ-rơ theo nghĩa đen là “thu gom, tập hợp”, nhưng ở đây được dùng theo thành ngữ với nghĩa đưa vào nơi canh giữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: giam ... lại
  rationale: Động từ אָסַף thường có nghĩa là “thu gom, tập hợp”, nhưng khi đi với אֶל מִשְׁמָר, nó mang nghĩa thành ngữ là đưa người ta vào nơi canh giữ. “Giam ... lại” tự nhiên trong tiếng Việt và diễn đạt đúng hành động trong ngữ cảnh.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ làm tân ngữ, giống đực số nhiều, chỉ các anh em của Giô-sép.
- source_word: אֶל מִשְׁמָר
  choice: giam ... lại
  rationale: Cụm này chỉ việc đưa họ vào tình trạng hoặc nơi bị canh giữ. Cách dịch không nói quá cụ thể thành một nhà tù chính thức.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: ba ngày
  rationale: Cụm từ chỉ khoảng thời gian; tiếng Việt tự nhiên không cần thêm giới từ tương đương với “trong”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “giam họ lại” thay vì “bỏ tù” để tránh xác định quá mức tính chất của מִשְׁמָר; giữ liên từ kể chuyện bằng “Rồi”.
