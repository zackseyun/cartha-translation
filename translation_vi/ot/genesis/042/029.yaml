  to: 'Rồi họ trở về xứ Ca-na-an, đến gặp Gia-cốp, cha mình, và kể với ông mọi việc đã xảy ra với họ, rằng:'
  rationale: Sửa trật tự cú pháp để phản ánh rõ họ trở về/đến xứ Ca-na-an rồi đến gặp Gia-cốp, cha mình. Bản sửa không áp đặt cách giải thích về cú pháp khó của nguyên văn, đồng thời tránh biến cụm chỉ hướng thành cụm định vị. Loại bỏ chú thích vì bản dịch không còn dựa trên sự diễn giải “tại xứ Ca-na-an”.
