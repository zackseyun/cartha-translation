  language: en
  yaml_path: translation/ot/genesis/042/029.yaml
  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: vi
  text: 'Rồi họ trở về xứ Ca-na-an, đến gặp Gia-cốp, cha mình, và kể với ông mọi việc đã xảy ra với họ, rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Rồi họ về
  rationale: Động từ wayyiqtol của בוא tiếp nối diễn tiến câu chuyện. Trong ngữ cảnh các con trở lại với cha, “về” tự nhiên hơn “đến” trong tiếng Việt.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: với cha mình là Gia-cốp
  rationale: אֶל chỉ hướng đến; אֲבִיהֶם là “cha của họ”. Cách diễn đạt này tự nhiên, rõ quan hệ đồng vị và không làm thay đổi ý nghĩa.
- source_word: אַרְצָה כְּנָעַן
  choice: tại xứ Ca-na-an
  rationale: Dạng có hậu tố chỉ hướng theo nghĩa đen là “đến xứ Ca-na-an”. Sau cụm “về với cha mình”, tiếng Việt dùng “tại” để xác định nơi Gia-cốp đang ở, tránh hai đích đến nối tiếp vụng về.
- source_word: וַיַּגִּידוּ לוֹ
  choice: và kể cho ông
  rationale: Hiphil của נגד mang nghĩa kể hoặc thuật lại. “Kể cho ông” phù hợp với việc thuật lại toàn bộ biến cố cho người cha.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: mọi điều đã xảy đến với họ
  rationale: Cụm phân từ của קרה chỉ những việc đã xảy ra hoặc giáng đến với họ; cách dịch giữ sắc thái những biến cố họ đã trải qua.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Từ này dẫn vào lời nói trực tiếp ở câu kế tiếp. “Rằng:” là dấu hiệu dẫn lời tự nhiên trong văn kể tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “xứ Ca-na-an” theo lối gọi địa danh Kinh Thánh quen thuộc; giữ dấu hai chấm cuối câu để báo hiệu lời kể trực tiếp tiếp nối ở câu sau.
