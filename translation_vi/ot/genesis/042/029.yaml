  naturalness: Câu sửa vẫn giữ văn phong kể chuyện hiện đại, tự nhiên. “Kể với ông mọi việc đã xảy ra với họ, rằng:” dẫn hợp lý sang lời trực tiếp ở câu tiếp theo.
  terminology: 'Giữ cách viết tên và địa danh quen thuộc: “Gia-cốp”, “Ca-na-an”. Không có thuật ngữ thần học đặc thù cần điều chỉnh.'
