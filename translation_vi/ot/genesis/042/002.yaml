  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: vi
  text: 'Ông nói: “Này, cha nghe nói ở Ai Cập có ngũ cốc. Hãy xuống đó mua ngũ cốc ở đó cho chúng ta, để chúng ta sống và không chết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Tiểu từ thu hút sự chú ý; “Này” tự nhiên, trang trọng vừa phải và giữ được tính trực tiếp của lời nói.
- source_word: שָׁמַעְתִּי
  choice: cha nghe nói
  rationale: Động từ hoàn thành chỉ thông tin Gia-cốp đã nhận được và hiện vẫn có giá trị. Trong lời nói với các con, đại từ thân tộc “cha” tự nhiên hơn “ta” trong tiếng Việt hiện đại.
- source_word: שֶׁבֶר
  choice: lương thực
  rationale: Trong bối cảnh nạn đói và việc mua bán tại Ai Cập, từ này chỉ lương thực, cụ thể chủ yếu là ngũ cốc; “lương thực” vừa chính xác theo ngữ cảnh vừa tự nhiên hơn việc thu hẹp tuyệt đối thành “ngũ cốc”.
- source_word: רְדוּ
  choice: Hãy xuống
  rationale: Giữ sắc thái phương hướng của động từ, phản ánh hành trình từ Ca-na-an xuống Ai Cập.
- source_word: שָׁמָּה
  choice: đó
  rationale: Phó từ chỉ hướng được diễn đạt tự nhiên bằng “đó” sau động từ “xuống”.
- source_word: וְשִׁבְרוּ
  choice: mua lương thực
  rationale: Trong ngữ cảnh này, động từ có nghĩa chuyên biệt là mua ngũ cốc hoặc lương thực. Lặp lại “lương thực” giúp câu tiếng Việt rõ nghĩa vì không có đại từ tương đương tự nhiên với “some” của tiếng Anh.
- source_word: לָנוּ
  choice: cho chúng ta
  rationale: Diễn đạt đối tượng hưởng lợi; “chúng ta” bao gồm người nói và những người đang được sai đi.
- source_word: מִשָּׁם
  choice: từ đó về
  rationale: Giữ giới từ “từ” trong nguyên văn; thêm “về” làm rõ hướng mang lương thực trở lại mà không thay đổi nội dung.
- source_word: וְנִחְיֶה
  choice: để chúng ta được sống
  rationale: Diễn đạt mục đích hoặc kết quả mong muốn của thể động từ trong ngữ cảnh.
- source_word: וְלֹא נָמוּת
  choice: chứ không phải chết
  rationale: Giữ thế đối xứng và tính cấp bách giữa sống và chết; cách nói này tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Dùng cách xưng hô “cha” phù hợp quan hệ Gia-cốp với các con; giữ sắc thái địa lý “xuống” và cấu trúc mục đích sống còn của nguyên văn.
