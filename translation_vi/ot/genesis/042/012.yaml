base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/012.yaml
  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: vi
  text: 'Nhưng ông nói với họ: “Không! Các người đến để xem những chỗ hở của xứ này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Nhưng ông nói với họ
  rationale: Liên từ וַ tiếp nối lời thoại nhưng mang sắc thái đối lập với lời phủ nhận ở câu trước; “nhưng” diễn đạt tự nhiên mạch tranh luận. Đại từ “ông” chỉ Giô-sép theo ngữ cảnh.
- source_word: לֹא כִּי
  choice: Không phải đâu!
  rationale: לֹא bác bỏ dứt khoát lời vừa nói của các anh em. כִּי dẫn vào lời khẳng định đối nghịch; trong tiếng Việt, tách thành câu cảm thán rồi nêu lời buộc tội giữ được sức mạnh và tự nhiên hơn cách dịch máy móc.
- source_word: עֶרְוַת הָאָרֶץ
  choice: chỗ sơ hở của xứ này
  rationale: עֶרְוָה có nghĩa đen là “sự trần truồng” nhưng ở đây là ẩn dụ về những nơi phơi lộ, yếu thế hoặc không được phòng bị. “Chỗ sơ hở” truyền đạt rõ ẩn dụ quân sự trong tiếng Việt hiện đại mà không thu hẹp thành một địa điểm duy nhất.
- source_word: בָּאתֶם
  choice: các người đến
  rationale: Động từ hoàn thành chỉ việc họ đã đến, còn lời buộc tội nhấn mạnh mục đích hiện tại. “Các người” phù hợp giọng chất vấn nghiêm khắc của Giô-sép.
- source_word: לִרְאוֹת
  choice: để xem
  rationale: Giữ nghĩa cơ bản của ראה là “xem/nhìn thấy”, thay vì đổi thẳng thành “do thám”; ý trinh sát đã được hàm chứa trong ngữ cảnh và cụm “chỗ sơ hở”.
