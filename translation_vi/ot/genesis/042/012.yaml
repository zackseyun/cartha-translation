  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Bản dịch ưu tiên diễn đạt tự nhiên của ẩn dụ Hê-bơ-rơ; “chỗ sơ hở của xứ này” giữ ý vùng dễ bị khai thác mà tránh cụm “sự trần truồng của đất” vốn khó hiểu và kém tự nhiên trong tiếng Việt.
