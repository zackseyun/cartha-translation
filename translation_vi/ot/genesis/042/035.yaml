  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: vi
  text: Khi họ đang lấy đồ trong các bao của mình ra, thì kìa, mỗi người thấy gói bạc của mình ở trong bao. Họ và cha họ thấy các gói bạc ấy thì sợ hãi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: Khi họ đang trút các bao ra
  rationale: Cấu trúc וַיְהִי kết hợp với phân từ diễn tả hoàn cảnh đang diễn ra. Tiếng Việt tự nhiên có thể dùng “khi... đang...” mà không cần dịch máy móc thành “và chuyện xảy ra là”.
- source_word: שַׂקֵּיהֶם
  choice: các bao
  rationale: שַׂק là bao dùng đựng lương thực hoặc hàng hóa; “bao” ngắn gọn, tự nhiên và hợp với bối cảnh ngũ cốc.
- source_word: וְהִנֵּה
  choice: thì kìa
  rationale: Giữ sắc thái phát hiện bất ngờ và sự chú ý do הִנֵּה tạo ra, đồng thời nối tự nhiên với mệnh đề thời gian trong tiếng Việt.
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: trong bao của mỗi người đều có gói bạc của mình
  rationale: אִישׁ có nghĩa phân phối là “mỗi người”; צְרוֹר là vật được buộc hoặc gói lại, còn כֶּסֶף trong ngữ cảnh là bạc dùng làm tiền. Cách diễn đạt giữ hình ảnh cụ thể và làm rõ quan hệ sở hữu.
- source_word: צְרֹרוֹת כַּסְפֵּיהֶם
  choice: các gói bạc ấy
  rationale: Giữ danh từ số nhiều và hình ảnh những lượng bạc được gói lại; “ấy” hồi chỉ các gói vừa được phát hiện.
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: Họ và cha mình
  rationale: Giữ sự nêu rõ và nhấn mạnh rằng cả các anh em lẫn người cha đều chứng kiến sự việc.
- source_word: וַיִּירָאוּ
  choice: thì sợ hãi
  rationale: Diễn đạt phản ứng sợ hãi trực tiếp sau khi nhìn thấy bạc, bằng lối văn hiện đại nhưng trang trọng.
