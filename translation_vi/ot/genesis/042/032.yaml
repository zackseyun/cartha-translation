  terminology: “Anh em,” “con trai,” “em út,” và “xứ Ca-na-an” phù hợp ngữ cảnh và thông lệ tiếng Việt. Tuy nhiên, lời chú hiện tại gọi “không có” là bản dịch sát hơn, nhưng cách này không phải là một diễn đạt tiếng Việt dùng được cho mệnh đề “người ấy không hiện diện/không còn”; cần chỉnh chú thích để mô tả thành ngữ chính xác hơn.
