base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: vi
  text: Chúng tôi là mười hai anh em, đều là con trai của cha chúng tôi. Một người không còn nữa[a], còn người em út hôm nay đang ở với cha chúng tôi tại xứ Ca-na-an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát theo cấu trúc Hê-bơ-rơ: “một người thì không hiện diện.” Thành ngữ này có thể nói một người đang vắng mặt, đã mất tích hoặc được cho là đã chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: Chúng tôi là mười hai anh em
  rationale: Diễn đạt tự nhiên mệnh đề không động từ trong tiếng Hê-bơ-rơ; “anh em” chỉ các anh em trai trong ngữ cảnh gia đình này.
- source_word: בְּנֵי אָבִינוּ
  choice: đều là con trai của cha chúng tôi
  rationale: Giữ rõ quan hệ gia đình và chức năng đồng vị của nguyên văn; “đều” giúp câu tiếng Việt liền mạch mà không thêm nội dung mới.
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: Một người không còn nữa
  rationale: Thành ngữ có thể chỉ người vắng mặt, mất tích hoặc được cho là đã chết. “Không còn nữa” giữ sắc thái uyển chuyển, không khẳng định quá mức rằng người ấy đã chết.
- source_word: וְהַקָּטֹן
  choice: còn người em út
  rationale: Trong danh sách anh em, tính từ “nhỏ/trẻ” được dùng theo nghĩa người trẻ nhất; “em út” là cách nói tự nhiên trong tiếng Việt.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Dịch trực tiếp trạng từ thời gian, giữ tính cụ thể và sắc thái hiện thời của nguyên văn.
- source_word: אֶת אָבִינוּ
  choice: đang ở với cha chúng tôi
  rationale: אֶת ở đây biểu thị sự đồng hành/ở cùng, không phải dấu hiệu của tân ngữ trực tiếp.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: tại xứ Ca-na-an
  rationale: Giữ danh từ “xứ/đất” trong cụm Hê-bơ-rơ và dùng dạng địa danh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Tình trạng của người anh em vắng mặt
  choice: không còn nữa
  alternative: không có mặt / đã chết
  rationale: Nguyên văn אֵינֶנּוּ không tự nó quyết định dứt khoát giữa vắng mặt, mất tích và bị cho là đã chết; bản dịch không nên giải quyết sự mơ hồ này theo một hướng duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp “cha chúng tôi” được giữ vì có trong nguyên văn; “còn… thì” được rút gọn thành “còn” để câu gọn mà vẫn thể hiện sự đối chiếu.
