  source_fidelity: 'Bản văn truyền đạt đúng các thành phần chính của tiếng Hê-bơ-rơ: mười hai anh em, cùng là con của một cha, một người vắng/không còn, và người út hiện ở với cha tại xứ Ca-na-an. “Không còn nữa” giữ được tính uyển chuyển của אֵינֶנּוּ trong ngữ cảnh này, không khẳng định trực tiếp người ấy đã chết.'
