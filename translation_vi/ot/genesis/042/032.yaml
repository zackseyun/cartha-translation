  to: Chúng tôi là mười hai anh em, đều là con trai của cha chúng tôi. Một người không còn nữa[a], còn người em út hôm nay đang ở với cha chúng tôi tại xứ Ca-na-an.
  rationale: Giữ nguyên bản dịch vì bản văn trung thành và tự nhiên. Chỉ sửa chú thích để tránh trình bày “không có” như một bản dịch tiếng Việt sát nghĩa có thể đứng độc lập, đồng thời bảo toàn tính mơ hồ của thành ngữ Hê-bơ-rơ.
