  terminology: Giữ «Ru-bên», «đứa trẻ», «phạm tội», và hình ảnh pháp lý mơ hồ «máu nó ... bị đòi lại». Không nêu tác nhân đòi máu, phù hợp với thể bị động của נִדְרָשׁ.
