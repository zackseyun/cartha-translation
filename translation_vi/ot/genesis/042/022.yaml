  source_fidelity: 'Bản dịch nhìn chung bám sát câu Hê-bơ-rơ: Ru-bên trả lời các anh em, nhắc lời cảnh báo không phạm tội đối với cậu bé, và nêu việc máu của cậu đang bị đòi lại. Tuy nhiên, «Giờ đây» không có từ tương ứng trực tiếp trong nguyên văn; cụm גַם הִנֵּה nhấn mạnh «cũng/quả thật, kìa».'
