base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: vi
  text: 'Rồi Ru-bên đáp lời họ: “Chẳng phải tôi đã bảo các anh: ‘Đừng phạm tội đối với đứa trẻ’ sao? Nhưng các anh đã không nghe. Kìa, máu nó cũng đang bị đòi lại.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... אֹתָם
  choice: Rồi Ru-bên đáp lời họ
  rationale: Giữ động từ ‘đáp lời’ của nguyên văn và diễn đạt tự nhiên trong tiếng Việt.
- source_word: אַל תֶּחֶטְאוּ בַיֶּלֶד
  choice: Đừng phạm tội với đứa trẻ
  rationale: Phản ánh trực tiếp động từ חטא và giới từ ב, không làm nhẹ trách nhiệm đạo đức.
- source_word: דָּמוֹ ... נִדְרָשׁ
  choice: máu của nó đang bị đòi lại
  rationale: Giữ hình ảnh ‘máu’ và thể bị động, diễn tả việc trách nhiệm về máu đang bị truy đòi mà không chỉ rõ tác nhân vốn không được nêu trong câu.
theological_decisions:
- issue: Tác nhân đòi lại máu của Giô-sép không được nêu rõ
  choice: 'Dùng thể bị động: ‘máu của nó đang bị đòi lại’'
  alternative: ‘Đức Chúa Trời đang đòi các anh trả giá cho máu của nó’
  rationale: Nguyên văn dùng נִדְרָשׁ ở thể bị động và không nêu Đức Chúa Trời; bản dịch không nên bổ sung tác nhân hay giải nghĩa hậu quả quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘các anh’ vì Ru-bên nói với các anh em trai; ‘đứa trẻ’ giữ sắc thái của הַיֶּלֶד trong lời nhắc lại. ‘Kìa’ truyền đạt הִנֵּה với sắc thái nhấn mạnh, cảnh báo.
