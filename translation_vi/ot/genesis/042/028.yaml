- from: 'Người nói với các anh em mình[b]: “Bạc của tôi đã được trả lại; kìa, nó còn ở ngay trong bao của tôi!” Lòng họ như lìa khỏi họ[a], và họ run sợ, người này nói với người kia: “Đức Chúa Trời đã làm gì với chúng ta thế này?”'
