  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: vi
  text: 'Người nói với các anh em mình: “Bạc của tôi đã được trả lại; kìa, nó cũng ở ngay trong bao của tôi!” Lòng họ rụng rời[a], và họ run rẩy; ai nấy nói với anh em mình[b]: “Đức Chúa Trời đã làm gì cho chúng ta thế này?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “họ mất hết can đảm”; sát nghĩa: “lòng họ đi ra.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “với nhau”; sát nghĩa: “mỗi người nói với anh em mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: đã được trả lại
  rationale: 'Thể Hophal của שוב diễn tả hành động bị động: số bạc đã được làm cho trở về, tức được trả lại.'
- source_word: כַּסְפִּי
  choice: bạc của tôi
  rationale: כסף vừa có nghĩa là bạc vừa có thể chỉ tiền; “bạc” giữ được hình ảnh vật chất và bối cảnh giao dịch cổ đại.
- source_word: אַמְתַּחַת
  choice: bao
  rationale: Chỉ vật đựng lương thực hoặc hành lý; “bao” tự nhiên trong bối cảnh các bao lúa của câu chuyện.
- source_word: וְגַם הִנֵּה
  choice: kìa, nó còn ở ngay
  rationale: “Kìa” chuyển tải sự chỉ trỏ và ngạc nhiên của הִנֵּה, còn “còn… ngay” thể hiện sắc thái nhấn mạnh của גַם.
- source_word: וַיֵּצֵא לִבָּם
  choice: lòng họ như lìa khỏi họ
  rationale: Giữ hình ảnh nguyên ngữ “lòng họ đi ra” nhưng thêm “như” để thành tiếng Việt dễ hiểu, diễn tả sự kinh hãi và mất hết can đảm mà không khóa nghĩa vào một cách giải thích duy nhất.
- source_word: וַיֶּחֶרְדוּ
  choice: họ run sợ
  rationale: חרד bao hàm cả sự run rẩy lẫn nỗi sợ hãi; “run sợ” chuyển tải gọn cả phản ứng thể chất và cảm xúc.
- source_word: אִישׁ אֶל אָחִיו
  choice: người này nói với người kia
  rationale: Diễn đạt tự nhiên lực phân phối của thành ngữ trong ngữ cảnh lời nói qua lại; chú thích bảo tồn nghĩa đen về quan hệ anh em.
- source_word: מַה זֹּאת עָשָׂה
  choice: đã làm gì … thế này
  rationale: Giữ câu hỏi trực tiếp “gì” thay vì diễn giải thành “tại sao,” đồng thời dùng “thế này” để chuyển tải sắc thái kinh ngạc của זֹאת.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Ngữ pháp và mạch truyện chỉ một Đấng; cách gọi này trang trọng, quen thuộc trong tiếng Việt và không đưa thêm lời giải thích thần học.
theological_decisions:
- issue: Cách dịch אֱלֹהִים trong câu hỏi đầy sợ hãi của các anh em
  choice: Đức Chúa Trời
  alternative: thần; các thần
  rationale: Dù hình thức từ có dạng số nhiều, cú pháp và ngữ cảnh kể chuyện cho thấy đối tượng số ít. Bản dịch giữ sự nhìn nhận tác động thần linh của họ nhưng không giải thích động cơ hay mục đích của Đức Chúa Trời.
- issue: Thành ngữ וַיֵּצֵא לִבָּם và mức độ diễn giải
  choice: lòng họ như lìa khỏi họ
  alternative: họ mất hết can đảm
  rationale: Cách chọn giữ hình ảnh “lòng” và sự căng thẳng của nguyên văn, đồng thời chú thích nghĩa thành ngữ thay vì âm thầm thu hẹp nó vào riêng ý mất can đảm.
- issue: Cụm quan hệ giống đực אִישׁ אֶל אָחִיו
  choice: người này nói với người kia
  alternative: mỗi người nói với anh em mình
  rationale: Văn cảnh đã xác định đây là các anh em nam; lời chính ưu tiên tiếng Việt tự nhiên, còn chú thích ghi rõ cấu trúc nguyên văn để không làm mất sắc thái quan hệ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “kìa” để giữ sức sống của lời nói trực tiếp; tránh từ cổ khó hiểu. Các dấu chú thích được đặt ngay sau đúng cụm từ mà chú thích giải thích.
