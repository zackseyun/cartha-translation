base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: vi
  text: Ông quay đi khỏi họ và khóc. Rồi ông trở lại với họ và nói với họ. Ông đem Si-mê-ôn ra từ giữa họ và trói ông ấy trước mắt họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: Ông quay đi khỏi họ
  rationale: Diễn đạt động tác quay khỏi và tách khỏi sự hiện diện của các anh em, phù hợp với mạch kể mà không thêm ý rằng Giô-sép đã rời hẳn nơi đó.
- source_word: וַיֵּבְךְּ
  choice: và khóc
  rationale: בכה chỉ hành động khóc; cách dịch ngắn gọn, tự nhiên và chính xác trong văn kể.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: ông trở lại
  rationale: שוב diễn tả việc trở lại với họ sau khi quay đi.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: nói với họ
  rationale: Bám sát nghĩa thông thường của דבר và không xác định nội dung hay sắc thái lời nói khi nguyên văn không nêu.
- source_word: וַיִּקַּח מֵאִתָּם אֶת־שִׁמְעוֹן
  choice: ông bắt Si-mê-ôn ra khỏi nhóm họ
  rationale: מֵאִתָּם biểu thị Si-mê-ôn được tách ra từ giữa nhóm; trong ngữ cảnh giam giữ, “bắt” tự nhiên hơn “lấy” nhưng vẫn không đồng nhất hành động này với việc bỏ tù.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: trói ông ấy
  rationale: אסר ở đây chỉ hành động trói/buộc cụ thể, không nên diễn giải rộng thành “giam giữ”.
- source_word: לְעֵינֵיהֶם
  choice: ngay trước mắt họ
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ và nhấn mạnh rằng họ tận mắt chứng kiến.
