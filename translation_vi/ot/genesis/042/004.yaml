  terminology: Các tên riêng Gia-cốp, Bên-gia-min và Giô-sép nhất quán với lối phiên âm Kinh Thánh Việt ngữ quen thuộc. “Tai họa” là tương đương rộng và thích đáng cho אָסוֹן, không áp đặt một loại tổn hại cụ thể.
