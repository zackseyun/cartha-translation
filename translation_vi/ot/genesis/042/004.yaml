  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: vi
  text: 'Nhưng Gia-cốp không cho Bên-gia-min, em của Giô-sép, đi cùng các anh, vì ông nói: “Kẻo nó gặp tai họa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: Nhưng
  rationale: 'Liên từ וְ nối với câu trước nhưng mang sắc thái tương phản: các con trai khác đi, còn Bên-gia-min thì không. Dấu chỉ tân ngữ אֶת không được dịch riêng.'
- source_word: בִּנְיָמִין
  choice: Bên-gia-min
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: אֲחִי יוֹסֵף
  choice: em của Giô-sép
  rationale: Cụm sở hữu xác định Bên-gia-min theo quan hệ với Giô-sép. Tiếng Hê-bơ-rơ chỉ nói 'anh/em trai'; theo mạch truyện, Bên-gia-min là em của Giô-sép.
- source_word: לֹא שָׁלַח ... אֶת אֶחָיו
  choice: không cho ... đi cùng các anh
  rationale: שׁלח có nghĩa là sai hoặc cho đi; trong ngữ cảnh người cha không để Bên-gia-min đi cùng các anh, cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ quan hệ đồng hành vốn được ngữ cảnh hàm ý.
- source_word: כִּי אָמַר
  choice: vì ông nói
  rationale: כִּי nêu lý do, còn אָמַר là 'nói'; giữ nguyên lời dẫn trực tiếp thay vì diễn giải thành 'nghĩ'.
- source_word: פֶּן
  choice: Kẻo
  rationale: Diễn tả một khả năng đáng lo sợ mà người nói muốn tránh; 'kẻo' ngắn gọn, tự nhiên và chính xác.
- source_word: יִקְרָאֶנּוּ אָסוֹן
  choice: nó gặp tai họa
  rationale: Thành ngữ có nghĩa một tai họa có thể xảy đến với người ấy. 'Gặp tai họa' là cách nói tự nhiên, vẫn giữ phạm vi rộng của אָסוֹן.
theological_decisions:
- issue: Mức độ nghiêm trọng cụ thể của אָסוֹן
  choice: tai họa
  alternative: tai nạn; điều bất hạnh; tổn hại
  rationale: Từ này chỉ tai họa hay tổn hại nghiêm trọng nhưng không xác định chính xác loại biến cố. Bản dịch không thu hẹp thành thương tích hoặc cái chết.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các dạng tên quen thuộc Gia-cốp, Bên-gia-min và Giô-sép. Đại từ 'ông' chỉ Gia-cốp và 'nó' trong lời của người cha phù hợp khẩu ngữ tự nhiên của tiếng Việt mà không thêm sắc thái thần học.
