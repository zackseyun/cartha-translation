  source_fidelity: 'Bản dịch chuyển tải chính xác cấu trúc và ý nghĩa của tiếng Hê-bơ-rơ: Gia-cốp không để Bên-gia-min đi cùng các anh; lý do là nỗi sợ một tai họa có thể xảy đến với ông ấy. “Nhưng” phản ánh hợp lý sắc thái tương phản của liên từ trong mạch văn. “Em của Giô-sép” phù hợp với nhân thân của Bên-gia-min trong ngữ cảnh truyện, và không làm thay đổi nghĩa câu.'
