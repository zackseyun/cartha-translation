base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: vi
  text: Nếu các ngươi là người thật thà[a], thì hãy để một người trong số anh em các ngươi bị giam giữ tại nơi các ngươi đang bị giữ[b]; còn các ngươi, hãy đi mang ngũ cốc về cho các gia đình đang chịu nạn đói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu các ngươi là những người nói thật.” Tính từ Hê-bơ-rơ có nghĩa là chân thật, đáng tin.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “trong nhà giam giữ của các ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: người thật thà
  rationale: Trong bối cảnh Giô-sép đang kiểm chứng lời khai của các anh em, cụm này chỉ những người nói thật và đáng tin; “người thật thà” tự nhiên trong tiếng Việt mà vẫn giữ trọng tâm về tính chân thật.
- source_word: אֲחִיכֶם אֶחָד
  choice: một người trong số anh em các ngươi
  rationale: Diễn đạt rõ ý một người được chọn trong nhóm anh em, tương ứng với sắc thái bộ phận của cấu trúc Hê-bơ-rơ.
- source_word: יֵאָסֵר
  choice: bị giam
  rationale: Thể Niphal của אסר ở đây mang nghĩa bị giữ hoặc giam giữ; “bị giam” phù hợp với bối cảnh nơi canh giữ mà không nhất thiết hàm ý bị trói.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: tại nơi các ngươi đang bị giữ
  rationale: Cách dịch này diễn đạt tự nhiên ý đen “trong nhà giam giữ của các ngươi” và hiểu hậu tố là việc/nơi họ hiện đang bị canh giữ, không áp đặt khái niệm nhà tù hiện đại.
- source_word: וְאַתֶּם לְכוּ
  choice: còn các ngươi, hãy đi
  rationale: “Còn” làm rõ sự tương phản giữa một người phải ở lại và những người kia được đi, đồng thời đại từ độc lập được giữ để bảo toàn sự nhấn mạnh.
- source_word: הָבִיאוּ
  choice: mang ... về
  rationale: Hiphil của בוא chỉ việc đem vật đến; trong mạch truyện, họ phải mang lương thực từ Ai Cập về nhà, nên “mang ... về” là tương đương tự nhiên.
- source_word: שֶׁבֶר
  choice: lương thực
  rationale: Trong truyện Giô-sép, từ này thường chỉ ngũ cốc mua trong nạn đói. “Lương thực” vừa tự nhiên vừa phù hợp với chức năng nuôi sống các gia đình, dù rộng hơn “ngũ cốc” đôi chút.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: cứu đói cho gia đình mình
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “nạn đói của nhà các ngươi”; cách dịch này chuyển đạt tự nhiên mục đích đem lương thực về vì các hộ gia đình đang chịu đói.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phản ánh lời của một người có quyền đang thẩm vấn một nhóm người, đồng thời duy trì sắc thái lịch sử của lời kể. Dấu chấm phẩy làm rõ thế đối lập giữa người ở lại và những người được sai đi.
