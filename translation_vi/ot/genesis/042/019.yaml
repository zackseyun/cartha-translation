  to: Nếu các ngươi là người thật thà[a], thì hãy để một người trong số anh em các ngươi bị giam giữ tại nơi các ngươi đang bị giữ[b]; còn các ngươi, hãy đi mang ngũ cốc về cho các gia đình đang chịu nạn đói.
