base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: vi
  text: 'Các ngươi sẽ bị thử bằng cách này: Ta thề bởi mạng sống Pha-ra-ôn, các ngươi sẽ không được rời khỏi đây, trừ khi người em út của các ngươi đến đây.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ là “nếu các ngươi rời khỏi đây”; trong cấu trúc lời thề này, “nếu” biểu thị sự phủ định mạnh: “các ngươi sẽ không được rời khỏi đây.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: bằng cách này
  rationale: Giới từ בְּ mang nghĩa phương tiện hoặc tiêu chuẩn; cách diễn đạt này tự nhiên và cho biết điều tiếp theo là cách xác minh lời khai.
- source_word: תִּבָּחֵנוּ
  choice: các ngươi sẽ được thử
  rationale: Thể Niphal của בחן diễn tả việc bị thử hoặc kiểm tra nhằm xác minh lời nói của các anh em.
- source_word: חֵי פַרְעֹה
  choice: Ta chỉ mạng sống Pha-ra-ôn mà thề
  rationale: Đây là công thức thề dựa vào mạng sống của Pha-ra-ôn; cách dịch này truyền đạt rõ lực của lời thề trong tiếng Việt hiện đại.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: các ngươi sẽ không được rời khỏi đây
  rationale: Sau công thức thề, אִם có giá trị xác quyết phủ định; מִזֶּה được diễn đạt tự nhiên là “rời khỏi đây”.
- source_word: כִּי אִם
  choice: trừ khi
  rationale: Cặp tiểu từ nêu ngoại lệ duy nhất đối với lời phủ định phía trước.
- source_word: בְּבוֹא
  choice: đến
  rationale: Động từ nguyên mẫu với בְּ chỉ hoàn cảnh hoặc điều kiện; sau “trừ khi”, động từ hữu hạn là cách nói tự nhiên trong tiếng Việt.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: em út của các ngươi
  rationale: Trong ngữ cảnh quan hệ anh em, הַקָּטֹן chỉ người em nhỏ tuổi nhất, tức Bên-gia-min.
- source_word: הֵנָּה
  choice: đến đây
  rationale: Trạng từ có hướng nghĩa là “tới đây”; “đến đây” giữ rõ sắc thái chuyển động.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” phù hợp với lời của một người có quyền đang nghiêm khắc nói với một nhóm; “Ta chỉ mạng sống Pha-ra-ôn mà thề” làm rõ công thức thề cổ mà không làm giảm sức nặng của câu.
