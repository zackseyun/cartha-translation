base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: vi
  text: Hãy đưa em trai út của các ngươi đến với ta, để lời các ngươi được chứng thực[a], và các ngươi sẽ không chết.” Họ đã làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được xác nhận” hoặc “được tin.” Động từ Hê-bơ-rơ có thể chỉ việc được xác lập là đúng hoặc được chấp nhận là đáng tin; trong văn cảnh này, ý kiểm chứng phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: em trai út của các ngươi
  rationale: Trong ngữ cảnh anh em và câu chuyện về Bên-gia-min, הַקָּטֹן chỉ người em nhỏ tuổi nhất; “em trai út” diễn đạt tự nhiên và rõ thứ bậc tuổi tác.
- source_word: תָּבִיאוּ אֵלַי
  choice: đưa ... đến với ta
  rationale: Dạng Hiphil của בוא mang nghĩa “đem/đưa đến”; “đến với ta” giữ trực tiếp ý của אֵלַי và hợp với lời của Giô-sép.
- source_word: וְיֵאָמְנוּ
  choice: để ... được chứng thực
  rationale: Dạng Niphal của אמן ở đây có thể chỉ việc được xác nhận là đúng hoặc được tin là đáng tin; “được chứng thực” phù hợp với bối cảnh Giô-sép kiểm tra lời khai của các anh.
- source_word: דִבְרֵיכֶם
  choice: lời các ngươi
  rationale: Giữ hình ảnh và cấu trúc của nguyên văn, đồng thời tự nhiên trong tiếng Việt trang trọng.
- source_word: וְלֹא תָמֻתוּ
  choice: và các ngươi sẽ không phải chết
  rationale: Giữ phép nối bằng וְ và diễn đạt hệ quả của việc tuân theo yêu cầu; “không phải chết” tự nhiên trong tiếng Việt mà vẫn giữ sức nặng của lời đe dọa/bảo đảm.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Họ làm như vậy
  rationale: Cách diễn đạt tự nhiên của công thức tường thuật, cho biết họ đã làm theo.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta/các ngươi” để phản ánh lời của một người có thẩm quyền nói với một nhóm người, không thêm sắc thái giáo phái. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
