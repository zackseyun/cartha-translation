  to: Hãy đưa em trai út của các ngươi đến với ta, để lời các ngươi được chứng thực[a], và các ngươi sẽ không chết.” Họ đã làm như vậy.
  rationale: Chỉ điều chỉnh “sẽ không phải chết” thành “sẽ không chết” để phản ánh trực tiếp hơn mệnh đề Hê-bơ-rơ, không thay đổi sắc thái điều kiện do mệnh lệnh trước đó thiết lập. Thêm “đã” trong câu cuối là cách kể chuyện tiếng Việt tự nhiên cho thì tường thuật, phù hợp với וַיַּעֲשׂוּ כֵן.
