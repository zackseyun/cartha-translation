language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: vi
  text: 'Nhưng ông nói: “Con trai ta sẽ không đi xuống cùng các con, vì anh nó đã chết, và chỉ còn lại nó. Nếu nó gặp nạn[a] trên con đường các con đi, thì các con sẽ đưa mái đầu bạc của ta xuống Sheol[b] trong đau buồn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tai họa.”'
    reason: lexical_alternative
  - marker: b
    text: Sheol là thuật ngữ Hê-bơ-rơ chỉ cõi người chết; cũng có thể dịch là “mồ mả.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: đi xuống
  rationale: Giữ nghĩa cụ thể của ירד và cách Sáng Thế Ký mô tả hành trình từ Ca-na-an xuống Ai Cập.
- source_word: בְּנִי
  choice: con trai ta
  rationale: Dịch trực tiếp danh từ בן với hậu tố ngôi thứ nhất số ít, đồng thời dùng cách xưng hô trang trọng, tự nhiên trong lời người cha nói với các con.
- source_word: אָחִיו מֵת
  choice: anh nó đã chết
  rationale: Trong ngữ cảnh, người anh là Giô-sép; tiếng Việt cần thể hiện quan hệ tuổi tác để câu tự nhiên. Cách dịch vẫn giữ quan điểm của Gia-cốp rằng Giô-sép đã chết.
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: chỉ còn lại một mình nó
  rationale: 'Giữ sắc thái nhấn mạnh của לְבַדּוֹ: theo góc nhìn của Gia-cốp, Bên-gia-min là người con duy nhất của Ra-chên còn lại.'
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: nếu nó gặp nạn
  rationale: Mệnh đề mang ý nghĩa điều kiện; “gặp nạn” tự nhiên trong tiếng Việt và vẫn diễn đạt một biến cố nguy hại nghiêm trọng.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: trên con đường các con đi
  rationale: Giữ hình ảnh cụ thể của דֶּרֶךְ và cấu trúc tương đối của nguyên văn mà không làm câu tiếng Việt nặng nề.
- source_word: וְהוֹרַדְתֶּם
  choice: các con sẽ đưa ... xuống
  rationale: Phản ánh thể Hiphil của ירד, nghĩa là khiến hoặc đưa xuống, trong hậu quả của điều kiện vừa nêu.
- source_word: שֵׂיבָתִי
  choice: mái đầu bạc của ta
  rationale: Giữ hình ảnh cụ thể về tóc bạc, một hoán dụ chỉ chính Gia-cốp trong tuổi già, thay vì làm phẳng thành “tuổi già”.
- source_word: בְּיָגוֹן
  choice: trong đau buồn
  rationale: Diễn đạt trạng thái đau đớn, sầu khổ của יָגוֹן và gắn tự nhiên với việc đi xuống Sheol.
- source_word: שְׁאֹלָה
  choice: xuống Sheol
  rationale: Giữ nguyên thuật ngữ Hê-bơ-rơ để không thu hẹp nghĩa thành một ngôi mộ vật chất; hậu tố chỉ hướng được thể hiện bằng “xuống”.
theological_decisions:
- issue: Dịch שְׁאוֹל là Sheol hay mồ mả
  choice: Sheol
  alternative: mồ mả; cõi người chết
  rationale: שְׁאוֹל có thể chỉ cõi của người chết và không phải trong mọi ngữ cảnh đều đồng nhất với một ngôi mộ vật chất. Phiên âm thuật ngữ và chú thích nghĩa giúp bảo toàn độ rộng cùng sự căng thẳng khái niệm của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/các con” phù hợp lời một người cha lớn tuổi nói với các con; “ông” trong lời dẫn giữ giọng kể tự nhiên. Các dấu chú thích [a], [b] được đặt ngay sau những từ ngữ mà chú thích giải thích.
