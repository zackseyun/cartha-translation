  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו אֲבָל֮ אֲשֵׁמִ֣ים אֲנַחְנוּ֮ עַל אָחִי/נוּ֒ אֲשֶׁ֨ר רָאִ֜ינוּ צָרַ֥ת נַפְשׁ֛/וֹ בְּ/הִתְחַֽנְנ֥/וֹ אֵלֵ֖י/נוּ וְ/לֹ֣א שָׁמָ֑עְנוּ עַל כֵּן֙ בָּ֣אָה אֵלֵ֔י/נוּ הַ/צָּרָ֖ה הַ/זֹּֽאת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: vi
  text: 'Bấy giờ, họ nói với nhau: “Quả thật, chúng ta có tội đối với anh em mình, vì chúng ta đã thấy nỗi thống khổ trong lòng người ấy[a] khi người ấy van xin chúng ta, mà chúng ta không chịu nghe. Vì thế, nỗi thống khổ này đã đến trên chúng ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “nỗi khốn khổ của linh hồn người ấy”, một cách nói chỉ nỗi đau đớn sâu xa của toàn thể con người.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng cùng một gốc từ cho “nỗi thống khổ” của người anh em và “nỗi thống khổ” hiện đang đến trên họ, qua đó liên kết sự tàn nhẫn trước kia với cảnh khốn khó hiện tại.
    reason: wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: Bấy giờ, họ nói với nhau
  rationale: Thành ngữ phân phối אִישׁ אֶל־אָחִיו diễn tả việc họ trao đổi với nhau; “Bấy giờ” chuyển tiếp tự nhiên cho waw tường thuật.
- source_word: אֲבָל
  choice: Quả thật
  rationale: Trong ngữ cảnh này, từ này nhấn mạnh lời thú nhận, không chủ yếu biểu thị sự tương phản.
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: chúng ta có tội về chuyện người anh em mình
  rationale: “Có tội” diễn đạt rõ tình trạng mắc lỗi và chịu trách nhiệm; “về chuyện” giữ chức năng chỉ vấn đề của עַל mà không tự ý tăng sắc thái “phạm tội chống lại”.
- source_word: צָרַת נַפְשׁוֹ
  choice: nỗi thống khổ trong lòng người ấy
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ chiều sâu nội tâm của thành ngữ Hê-bơ-rơ theo nghĩa đen là “nỗi khốn khổ của linh hồn/sinh mạng người ấy”.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: khi người ấy van xin chúng ta
  rationale: Động từ diễn tả lời khẩn cầu tha thiết; “van xin” truyền đạt cường độ ấy mà không thêm một đối tượng cầu xin không được nêu rõ.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: mà chúng ta không chịu nghe
  rationale: שׁמע ở đây mang nghĩa nghe theo, đáp lại lời cầu xin; “không chịu nghe” thể hiện sự khước từ chứ không chỉ là không nghe thấy.
- source_word: עַל־כֵּן
  choice: Vì thế
  rationale: Diễn đạt trực tiếp quan hệ hậu quả do cụm từ Hê-bơ-rơ đánh dấu.
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: nỗi thống khổ này đã đến trên chúng ta
  rationale: Lặp lại “nỗi thống khổ” để bảo tồn mối liên kết từ vựng giữa đau khổ của Giô-sép và hoàn cảnh hiện tại của các anh; “đến trên chúng ta” giữ hình ảnh của nguyên văn.
theological_decisions:
- issue: Mối liên hệ giữa hành vi trước đây và hoạn nạn hiện tại
  choice: Giữ nguyên lời suy luận của các anh em bằng “Vì thế”
  alternative: Diễn giải đây là sự trừng phạt trực tiếp của Đức Chúa Trời
  rationale: Câu Hê-bơ-rơ ghi lại nhận định của các anh em nhưng không nêu đích danh tác nhân gây ra hoạn nạn; bản dịch không nên bổ sung một kết luận thần học không được nói rõ trong câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp độc giả phổ thông. Dùng “người anh em mình/người ấy” để tránh áp đặt tuổi tác từ riêng câu này; lặp “nỗi thống khổ” nhằm giữ phép vọng từ của nguyên văn.
