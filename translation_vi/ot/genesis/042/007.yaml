  text: וַ/יַּ֥רְא יוֹסֵ֛ף אֶת אֶחָ֖י/ו וַ/יַּכִּרֵ֑/ם וַ/יִּתְנַכֵּ֨ר אֲלֵי/הֶ֜ם וַ/יְדַבֵּ֧ר אִתָּ֣/ם קָשׁ֗וֹת וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מֵ/אַ֣יִן בָּאתֶ֔ם וַ/יֹּ֣אמְר֔וּ מֵ/אֶ֥רֶץ כְּנַ֖עַן לִ/שְׁבָּר אֹֽכֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: vi
  text: 'Khi Giô-sép thấy các anh em mình, ông nhận ra họ, nhưng lại làm ra vẻ như người xa lạ đối với họ[a] và nói với họ một cách nghiêm khắc. Ông hỏi: “Các ngươi từ đâu đến?” Họ đáp: “Chúng tôi từ xứ Ca-na-an đến để mua lương thực[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho mình trở nên khó nhận ra đối với họ.” Tiếng Hê-bơ-rơ có thể chỉ việc ông tỏ ra như một người ngoại quốc hoặc người họ không quen biết, chứ không nhất thiết nói đến việc hóa trang.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mua ngũ cốc.” Trong bối cảnh nạn đói, động từ Hê-bơ-rơ thường nói cụ thể đến việc mua ngũ cốc, dù danh từ ở đây mang nghĩa rộng hơn là “thức ăn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: Khi Giô-sép thấy các anh em mình
  rationale: Dùng “khi” để diễn đạt tự nhiên chuỗi tự sự do waw-consecutive dẫn dắt; “các anh em mình” chỉ những anh em trai của Giô-sép trong ngữ cảnh.
- source_word: וַיַּכִּרֵם
  choice: ông nhận ra họ
  rationale: Dạng Hiphil của נכר ở đây có nghĩa là nhận biết hoặc nhận ra danh tính.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: làm ra vẻ như người xa lạ đối với họ
  rationale: Dạng Hitpael diễn tả việc Giô-sép tự tỏ ra xa lạ hay không quen biết đối với họ, không nhất thiết hàm ý ông thay đổi diện mạo hoặc hóa trang.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: nói với họ một cách nghiêm khắc
  rationale: קָשׁוֹת bổ nghĩa cho cách nói năng, diễn tả lời lẽ cứng rắn, gay gắt; “một cách nghiêm khắc” tự nhiên và trang trọng trong tiếng Việt.
- source_word: מֵאַיִן בָּאתֶם
  choice: Các ngươi từ đâu đến?
  rationale: Phản ánh trực tiếp câu hỏi về nơi xuất phát; “các ngươi” phù hợp với thái độ quyền uy và xa cách mà Giô-sép đang thể hiện.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: từ xứ Ca-na-an
  rationale: “Xứ Ca-na-an” là cách gọi địa lý trang trọng, tự nhiên, phản ánh אֶרֶץ כְּנַעַן.
- source_word: לִשְׁבָּר אֹכֶל
  choice: để mua lương thực
  rationale: שבר trong bối cảnh nạn đói là mua nhu yếu phẩm, thường là ngũ cốc; אֹכֶל có nghĩa rộng hơn là thức ăn, nên “lương thực” giữ được cả bối cảnh và độ rộng của cụm từ.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ông” dùng trong lời kể; “các ngươi” trong lời Giô-sép thể hiện khoảng cách và quyền thế, còn “chúng tôi” là lời đáp kính cẩn. Các lựa chọn giữ sự phân biệt giữa việc nhận ra các anh em và việc cố ý tỏ ra xa lạ với họ.
