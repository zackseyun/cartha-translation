  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: vi
  text: 'Khi Gia-cốp thấy Ai Cập có ngũ cốc, ông nói với các con trai mình: “Sao các con cứ nhìn nhau?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sao các con cứ tỏ mình ra?” Động từ Hê-bơ-rơ có thể được hiểu theo nhiều cách, nhưng trong ngữ cảnh này rất có thể nói đến việc các anh em nhìn nhau vì chần chừ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Khi Gia-cốp biết
  rationale: Động từ ראה theo nghĩa tri nhận có thể là “thấy” hoặc “biết được”. Trong ngữ cảnh Gia-cốp nhận được tin về lương thực tại Ai Cập, “biết” tự nhiên hơn trong tiếng Việt; cấu trúc “Khi...” thể hiện quan hệ thời gian với lời nói tiếp theo.
- source_word: כִּי יֶשׁ
  choice: ở Ai Cập có
  rationale: כִּי giới thiệu nội dung Gia-cốp biết, còn יֶשׁ diễn tả sự hiện hữu. Trật tự “ở Ai Cập có...” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: שֶׁבֶר
  choice: lương thực
  rationale: Trong trình thuật nạn đói, từ này chỉ ngũ cốc được bán. “Lương thực” vừa phù hợp bối cảnh vừa tự nhiên, dù ít chuyên biệt hơn “ngũ cốc”.
- source_word: בְּמִצְרָיִם
  choice: ở Ai Cập
  rationale: Giới từ בְּ mang nghĩa vị trí; “ở” là cách chuyển tương ứng tự nhiên trong tiếng Việt.
- source_word: לְבָנָיו
  choice: với các con trai mình
  rationale: Danh từ chỉ các con trai của Gia-cốp trong bối cảnh này; “mình” quy chiếu tự nhiên về chủ ngữ Gia-cốp.
- source_word: לָמָּה
  choice: Sao
  rationale: “Sao” là từ nghi vấn tự nhiên trong lời nói trực tiếp, vẫn giữ sắc thái chất vấn của “tại sao”.
- source_word: תִּתְרָאוּ
  choice: cứ nhìn nhau
  rationale: 'Dạng hitpael của ראה ở đây nhiều khả năng mang nghĩa tương hỗ: các anh em nhìn nhau vì chần chừ. “Cứ” diễn đạt sắc thái hành động kéo dài; cách hiểu “tỏ mình ra” vẫn được bảo lưu trong chú thích.'
