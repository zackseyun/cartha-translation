  rationale: Sửa động từ tri nhận theo nghĩa trực tiếp của tiếng Hê-bơ-rơ và thay thuật ngữ rộng “lương thực” bằng “ngũ cốc” để phản ánh שֶׁבֶר chính xác hơn. Giữ nguyên cách hiểu ngữ cảnh của תִּתְרָאוּ và chú thích về khả năng từ vựng thay thế.
