base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: vi
  text: 'Người ấy, chúa tể của xứ, đã nói với chúng tôi: “Qua việc này, ta sẽ biết các ngươi là những người thành thật: Hãy để một người trong số anh em các ngươi ở lại với ta; hãy mang lương thực[a] cho gia đình các ngươi đang chịu nạn đói, rồi đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ theo mặt chữ là “hãy lấy nạn đói của các nhà các ngươi”; ý nói hãy mang lương thực cho các gia đình đang chịu nạn đói.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: Người ấy, vị chúa của xứ
  rationale: Giữ danh từ thông thường הָאִישׁ và cụm đồng vị chỉ thẩm quyền אֲדֹנֵי הָאָרֶץ. “Vị chúa của xứ” trang trọng, tự nhiên trong bối cảnh cổ đại và không đồng nhất nhân vật với Đức Chúa Trời.
- source_word: בְּזֹאת
  choice: Nhờ điều này
  rationale: Diễn tả phương tiện hoặc tiêu chuẩn qua đó người nói sẽ xác minh lời của họ.
- source_word: אֵדַע
  choice: ta sẽ biết
  rationale: Dạng yiqtol ở đây diễn tả kết quả tương lai tùy thuộc việc họ thực hiện mệnh lệnh.
- source_word: כֵנִים
  choice: người ngay thật
  rationale: Trong trình thuật này, từ chỉ những người chân thật, không phải gián điệp; “ngay thật” giữ sắc thái tư cách và lời khai.
- source_word: אֲחִיכֶם הָאֶחָד
  choice: một người trong số anh em các ngươi
  rationale: Chuyển thành lối nói tiếng Việt tự nhiên để chỉ một người được chọn trong nhóm anh em.
- source_word: הַנִּיחוּ אִתִּי
  choice: Hãy để ... ở lại với ta
  rationale: Hiphil của נוח ở đây có nghĩa để một người lưu lại với người nói.
- source_word: וְאֶת רַעֲבוֹן בָּתֵּיכֶם קְחוּ
  choice: hãy mang lương thực về cứu đói cho gia đình mình
  rationale: Nguyên văn có lối nói tỉnh lược, theo mặt chữ là “hãy lấy nạn đói của nhà các ngươi.” Bối cảnh mua lúa cho thấy đối tượng được ngầm hiểu là lương thực cần để đối phó nạn đói.
- source_word: וָלֵכוּ
  choice: rồi đi đi
  rationale: Giữ lực trực tiếp của mệnh lệnh kết thúc và trình tự sau khi nhận lương thực.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/các ngươi” phản ánh địa vị của vị quan Ai Cập đối với những người đang bị thẩm vấn. Dùng “gia đình” cho בָּתִּים theo nghĩa các hộ gia đình trong ngữ cảnh.
