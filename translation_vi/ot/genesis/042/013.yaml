  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: vi
  text: 'Họ thưa: “Chúng tôi, các đầy tớ của ngài, là mười hai anh em, con trai của một người ở xứ Ca-na-an. Này, hôm nay người em út đang ở với cha chúng tôi, còn một người thì không còn nữa[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “còn một người thì không có/không còn”; đây là lối nói giảm có thể mang nghĩa “đã mất” hoặc hàm ý đã chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ thưa
  rationale: Động từ nói trong mạch kể được chuyển tự nhiên; “thưa” thể hiện đúng thái độ kính cẩn của những người đang nói với quan cai trị mà không thêm nội dung.
- source_word: עֲבָדֶיךָ
  choice: các đầy tớ của ngài
  rationale: Đây là lối tự xưng hạ mình trước một quan chức, không nhất thiết chỉ thân phận nô lệ; “đầy tớ” giữ được sắc thái cung kính.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: chúng tôi ... vốn là mười hai anh em
  rationale: Giữ cả số lượng và quan hệ anh em, đồng thời dùng trật tự câu tự nhiên trong tiếng Việt.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: con trai của cùng một người
  rationale: Giữ ngôn ngữ thân tộc giống đực của nguyên văn và nhấn mạnh họ có chung một cha.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: ở xứ Ca-na-an
  rationale: “Xứ” chuyển tải אֶרֶץ tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: וְהִנֵּה
  choice: Này
  rationale: Giữ chức năng trình bày và thu hút sự chú ý của הִנֵּה bằng một từ trang trọng nhưng dễ hiểu.
- source_word: הַקָּטֹן
  choice: người em út
  rationale: Trong ngữ cảnh gia đình, từ này chỉ người trẻ nhất trong số các anh em; cách dịch làm rõ quan hệ đã có trong văn cảnh.
- source_word: אֶת אָבִינוּ
  choice: đang ở với cha chúng tôi
  rationale: אֶת ở đây biểu thị sự đồng hành; “ở với” là cách diễn đạt tự nhiên.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Chuyển trực tiếp ý nghĩa thời gian của nguyên văn.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: còn một người thì không còn nữa
  rationale: Giữ lối nói giảm, nói tránh “không còn” của tiếng Hê-bơ-rơ, không quyết đoán rằng người ấy đã chết hay chỉ vắng mặt/mất tích.
theological_decisions:
- issue: Ngôn ngữ thân tộc theo giới tính
  choice: con trai của cùng một người
  alternative: các con của cùng một người
  rationale: Nguyên văn dùng danh từ giống đực và câu chuyện nói đến các con trai của Gia-cốp, nên giữ nghĩa cụ thể thay vì trung tính hóa.
- issue: Sự mơ hồ về tình trạng của Giô-sép
  choice: không còn nữa
  alternative: đã chết; không có ở đây
  rationale: Cụm tiếng Hê-bơ-rơ có nghĩa đen là “không còn/không có” và có thể là lối nói tránh hàm ý mất hoặc chết. Bản dịch giữ nguyên độ mơ hồ thay vì xác định mạnh hơn nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thưa”, “ngài”, “đầy tớ” để phản ánh lời nói kính cẩn trước quan cai trị; giữ lối nói giảm ở cuối câu và giải thích bằng chú thích.
