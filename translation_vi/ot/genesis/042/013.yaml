    rationale: 'וְהָאֶחָד אֵינֶנּוּ là “còn một người thì không có/không còn” (nghĩa đen sát chữ: ‘và người ấy không có mặt/không hiện hữu’). Nêu “một người” trong chú thích giúp làm rõ điều đang được nói giảm.'
