  text: דִּ֠בֶּר הָ/אִ֨ישׁ אֲדֹנֵ֥י הָ/אָ֛רֶץ אִתָּ֖/נוּ קָשׁ֑וֹת וַ/יִּתֵּ֣ן אֹתָ֔/נוּ כִּֽ/מְרַגְּלִ֖ים אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/030.yaml
  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: vi
  text: Người ấy, vị chúa tể của xứ, đã nói với chúng con rất gay gắt và coi chúng con như những kẻ do thám xứ này.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: đã nói với chúng con rất gay gắt
  rationale: Diễn đạt tự nhiên cấu trúc ‘nói với chúng tôi những lời gay gắt’, giữ sắc thái nghiêm khắc, khắc nghiệt của קָשׁוֹת.
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: vị chúa tể của xứ
  rationale: Giữ nghĩa người cai quản, người có quyền trên xứ; ‘chúa tể’ phân biệt với danh xưng dành cho Đức Chúa Trời trong văn mạch.
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: và coi chúng con như những kẻ do thám
  rationale: Động từ נָתַן ở đây mang nghĩa đặt/xem ai vào một địa vị; ‘coi ... như’ truyền đạt đúng chức năng ngữ cảnh mà không hàm ý ông thực sự biến họ thành gián điệp.
- source_word: אֶת הָאָרֶץ
  choice: xứ này
  rationale: Cụm từ bổ nghĩa cho ‘những kẻ do thám’; ‘xứ này’ tự nhiên trong lời thuật lại và chỉ chính vùng đất đang được nói đến.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng ‘chúng con’ vì các con trai đang thuật lại sự việc với cha mình; dùng ‘người ấy’ và ‘vị chúa tể’ để giữ sự phân biệt giữa nhân vật và chức vị.
