base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: vi
  text: 'Bấy giờ, Giô-sép nhớ lại những giấc mơ ông đã mơ về họ. Ông nói với họ: “Các ngươi là gián điệp! Các ngươi đến để xem sự trần trụi của xứ này!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “sự trần trụi của xứ”; đây là thành ngữ chỉ những vùng phơi lộ, yếu hoặc không được phòng thủ, dễ bị tấn công.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: nhớ lại
  rationale: Diễn đạt tự nhiên hành động Giô-sép hồi tưởng ngay lúc ấy trong mạch kể chuyện.
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: những giấc mơ mình đã mơ
  rationale: Giữ phép lặp cùng gốc của tiếng Hê-bơ-rơ nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: לָהֶם
  choice: về họ
  rationale: Trong ngữ cảnh, các giấc mơ liên quan đến những người anh của Giô-sép; “về họ” truyền đạt đúng quan hệ này.
- source_word: מְרַגְּלִים
  choice: gián điệp
  rationale: Chỉ những người bị cáo buộc bí mật do thám xứ; đây là cách gọi rõ ràng và thông dụng trong tiếng Việt.
- source_word: לִרְאוֹת
  choice: để dò xem
  rationale: “Xem” là nghĩa trực tiếp, còn “dò” làm rõ sắc thái trinh sát vốn có trong lời cáo buộc mà không biến nó thành một hành động khác.
- source_word: עֶרְוַת הָאָרֶץ
  choice: chỗ sơ hở của xứ này
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “sự trần trụi của xứ,” chỉ những nơi phơi lộ, yếu hoặc không được phòng thủ. “Chỗ sơ hở” chuyển tải chức năng của hình ảnh một cách tự nhiên; chú thích bảo tồn nghĩa đen.
- source_word: בָּאתֶם
  choice: các ngươi đến
  rationale: Thì quá khứ được hiểu từ ngữ cảnh; cách nói này tự nhiên trong lời buộc tội trực tiếp và nhấn mạnh mục đích chuyến đi.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. “Các ngươi” thể hiện lời buộc tội gay gắt của một người cầm quyền đối với những người đang bị thẩm vấn; “xứ này” giúp lời thoại tự nhiên và làm rõ vùng đất đang được nói đến.
