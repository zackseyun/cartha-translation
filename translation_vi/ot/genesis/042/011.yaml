  text: כֻּלָּ֕/נוּ בְּנֵ֥י אִישׁ אֶחָ֖ד נָ֑חְנוּ כֵּנִ֣ים אֲנַ֔חְנוּ לֹא הָי֥וּ עֲבָדֶ֖י/ךָ מְרַגְּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: vi
  text: Tất cả chúng tôi đều là con trai của một người. Chúng tôi là người thật thà[a]; tôi tớ của ngài chưa từng là gián điệp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngay thật”, “chân thật” hoặc “đáng tin”. Tiếng Hê-bơ-rơ mô tả họ là những người chân chính, đáng tin, đối lập với lời cáo buộc làm gián điệp.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi tớ của ngài không phải là gián điệp” hoặc “tôi tớ của ngài đã không là gián điệp”. Cấu trúc tiếng Hê-bơ-rơ có thể được diễn đạt tự nhiên theo nhiều cách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: Tất cả chúng tôi đều
  rationale: Diễn đạt trọn nhóm người nói và giữ sắc thái nhấn mạnh của כֻּלָּנוּ bằng cách nói tự nhiên trong tiếng Việt.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: con trai của cùng một người
  rationale: Giữ nghĩa cụ thể 'các con trai của một người'; 'cùng một người' làm rõ rằng họ có chung một người cha mà không thêm danh từ không có trong câu.
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: chúng tôi
  rationale: Hai đại từ độc lập mang sắc thái nhấn mạnh; bản dịch giữ chủ ngữ minh nhiên ở cả hai mệnh đề chính.
- source_word: כֵּנִים
  choice: những người ngay thật
  rationale: Trong lời tự biện hộ trước cáo buộc làm gián điệp, từ này mô tả họ là đáng tin, thành thật hoặc chân chính. 'Ngay thật' trang trọng, tự nhiên và không thu hẹp nghĩa chỉ còn việc nói thật.
- source_word: עֲבָדֶיךָ
  choice: các tôi tớ của ngài
  rationale: Đây là lối tự xưng khiêm nhường trước người cầm quyền, nên 'tôi tớ' phù hợp hơn 'nô lệ'; 'ngài' thể hiện địa vị của người được thưa chuyện.
- source_word: מְרַגְּלִים
  choice: gián điệp
  rationale: Chỉ những người bí mật dò xét đất nước; đây là từ rõ nghĩa và thông dụng trong tiếng Việt hiện đại.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: chưa từng làm gián điệp
  rationale: Cấu trúc היה với phân từ cho phép hiểu là phủ nhận tình trạng hoặc hoạt động ấy. Cách dịch này tự nhiên trong lời biện hộ và diễn đạt sự phủ nhận đối với quá khứ, đồng thời chú thích phương án hiện tại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ lối tự xưng khiêm nhường “các tôi tớ của ngài” trong bối cảnh thưa chuyện với một quan chức cấp cao; dùng “ngay thật” để bảo toàn phạm vi nghĩa của כֵּנִים.
