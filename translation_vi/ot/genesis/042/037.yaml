base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: vi
  text: 'Rồi Ru-bên thưa với cha mình: “Nếu con không đưa em ấy trở về với cha, cha cứ xử tử hai con trai của con. Xin trao em ấy vào tay con,[a] chính con sẽ đưa em ấy trở về với cha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “Xin giao em ấy cho con.” Nguyên văn: “Hãy đặt em ấy trên tay con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר רְאוּבֵן אֶל אָבִיו
  choice: Rồi Ru-bên thưa với cha mình
  rationale: “Rồi” thể hiện diễn tiến của mạch kể; “thưa” là cách nói tự nhiên, kính trọng của người con với cha trong tiếng Việt hiện đại.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: cha cứ xử tử hai con trai của con
  rationale: Động từ Hiphil của מות mang nghĩa khiến cho chết. “Xử tử” giữ sắc thái chủ động, nghiêm trọng của lời cam kết; “cứ” diễn đạt sự cho phép/thách nguyện trong ngữ cảnh điều kiện, thay vì biến hình thức động từ thành một mệnh lệnh đơn thuần.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: nếu con không đưa em ấy trở về với cha
  rationale: בוא ở Hiphil là “đưa/mang đến”; “trở về” được nêu rõ theo ngữ cảnh Bên-gia-min phải được đưa về lại với Gia-cốp. Đại từ “em ấy” phản ánh quan hệ của Bên-gia-min với Ru-bên và tự nhiên trong lời nói với cha.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: Xin trao em ấy vào tay con
  rationale: Giữ hình ảnh cụ thể “vào tay” của thành ngữ Hê-bơ-rơ, đồng thời “trao” truyền đạt ý giao phó. “Xin” phù hợp quan hệ kính trọng giữa con và cha.
- source_word: וַאֲנִי אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: chính con sẽ đưa em ấy trở về với cha
  rationale: “Chính con” thể hiện sự nhấn mạnh của đại từ độc lập וַאֲנִי; Hiphil của שוב được dịch là “đưa ... trở về”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trong lời thoại, dùng cặp xưng hô “con—cha” thay cho “tôi—cha” để phản ánh tự nhiên quan hệ cha con; “Ru-bên” theo lối phiên âm tên riêng Kinh Thánh quen thuộc. Dấu chú thích [a] đặt ngay sau thành ngữ được giải thích.
