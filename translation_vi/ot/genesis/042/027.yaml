base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: vi
  text: Rồi một người trong số họ mở bao của mình để cho lừa mình ăn tại chỗ nghỉ đêm. Người ấy thấy bạc của mình[a]—thì kìa, nó ở ngay miệng túi của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bạc” ở đây là số tiền người ấy đã trả để mua lương thực.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: mở
  rationale: Động từ פתח mang nghĩa cơ bản là “mở”; cách dịch trực tiếp phù hợp với lối kể chuyện.
- source_word: הָאֶחָד
  choice: một người trong số họ
  rationale: Nguyên văn là “một người”; thêm “trong số họ” làm rõ rằng đây là một trong các anh em mà không bổ sung ý mới.
- source_word: שַׂקּוֹ
  choice: bao của mình
  rationale: שַׂק là bao dùng để chuyên chở; “bao” tự nhiên trong ngữ cảnh chở lương thực và vẫn phân biệt với אַמְתַּחַת ở cuối câu.
- source_word: לָתֵת מִסְפּוֹא
  choice: để lấy thức ăn cho
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “để cho thức ăn”; trong tiếng Việt, “lấy thức ăn cho lừa” diễn đạt tự nhiên hành động mở bao nhằm cho lừa ăn.
- source_word: לַחֲמֹרוֹ
  choice: cho lừa
  rationale: Giới từ ל đánh dấu đối tượng nhận; tiếng Việt dùng “cho” tự nhiên trong cụm “thức ăn cho lừa”.
- source_word: בַּמָּלוֹן
  choice: tại chỗ nghỉ đêm
  rationale: מָלוֹן chỉ nơi dừng chân hoặc trú qua đêm, không nhất thiết là một quán trọ thương mại.
- source_word: וַיַּרְא אֶת־כַּסְפּוֹ
  choice: Người ấy thấy bạc của mình
  rationale: כֶּסֶף nghĩa đen là “bạc” và tại đây chỉ số bạc dùng làm tiền thanh toán; giữ hình ảnh cụ thể của nguyên văn.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: Tiểu từ này đánh dấu sự phát hiện bất ngờ; “kìa” giữ được sức sống của lời kể trong tiếng Việt hiện đại.
- source_word: הוּא
  choice: nó
  rationale: Đại từ quay lại chỉ số bạc vừa được nhắc đến.
- source_word: בְּפִי
  choice: ngay miệng
  rationale: פֶּה, “miệng”, được dùng theo hình ảnh để chỉ chỗ mở của vật đựng; “miệng túi” là thành ngữ tự nhiên trong tiếng Việt.
- source_word: אַמְתַּחְתּוֹ
  choice: túi
  rationale: Dùng “túi” để bảo tồn sự phân biệt từ vựng với שַׂק, đã dịch là “bao” ở đầu câu.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “chỗ nghỉ đêm” thay vì “quán trọ” để tránh hàm ý về một cơ sở thương mại. Bảo tồn hai từ chỉ vật đựng bằng “bao” và “túi”, đồng thời giữ hình ảnh Hê-bơ-rơ tự nhiên “miệng túi”.
