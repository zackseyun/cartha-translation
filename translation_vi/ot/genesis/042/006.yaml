  text: וְ/יוֹסֵ֗ף ה֚וּא הַ/שַּׁלִּ֣יט עַל הָ/אָ֔רֶץ ה֥וּא הַ/מַּשְׁבִּ֖יר לְ/כָל עַ֣ם הָ/אָ֑רֶץ וַ/יָּבֹ֨אוּ֙ אֲחֵ֣י יוֹסֵ֔ף וַ/יִּשְׁתַּֽחֲווּ ל֥/וֹ אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: vi
  text: Giô-sép là người cai trị xứ; chính ông là người bán lương thực cho toàn dân trong xứ. Các anh của Giô-sép đến và cúi lạy ông[a], mặt sát đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sấp mình trước mặt ông.” Động từ Hê-bơ-rơ có thể chỉ việc cúi mình thật thấp hoặc phủ phục để bày tỏ lòng tôn kính và quy phục.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: người cai trị
  rationale: Diễn đạt tự nhiên địa vị cầm quyền của Giô-sép mà không gán cho ông một chức danh hành chính cụ thể hơn nguyên văn.
- source_word: עַל הָאָרֶץ
  choice: xứ
  rationale: Trong văn cảnh, אֶרֶץ chỉ xứ Ai Cập đang được nói đến, không phải toàn thể trái đất.
- source_word: הַמַּשְׁבִּיר
  choice: người bán lương thực
  rationale: Phân từ Hifil của שׁבר trong bối cảnh nạn đói chỉ việc bán ngũ cốc; “lương thực” là cách nói tự nhiên, dễ hiểu trong tiếng Việt và phù hợp với mạch truyện.
- source_word: לְכָל עַם הָאָרֶץ
  choice: cho toàn dân trong xứ
  rationale: עַם là danh từ tập hợp; cách dịch này giữ phạm vi địa phương của הָאָרֶץ và tự nhiên trong tiếng Việt.
- source_word: אֲחֵי יוֹסֵף
  choice: các anh của Giô-sép
  rationale: Trong mạch truyện đây là những anh trai của Giô-sép; tiếng Việt cần thể hiện quan hệ tuổi tác mà từ “anh em” có thể làm mơ hồ.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: cúi lạy ông
  rationale: Cụm từ diễn tả hành động hạ mình bày tỏ sự quy phục hoặc tôn kính. “Cúi lạy” giữ được ý nghĩa xã hội của cử chỉ mà không nhất thiết hàm ý thờ phượng thần linh.
- source_word: אַפַּיִם אָרְצָה
  choice: mặt sát đất
  rationale: Thành ngữ mô tả tư thế cúi rạp hoàn toàn; cách dịch ngắn gọn này rõ ràng và tự nhiên hơn lối dịch sát từng chữ liên quan đến “lỗ mũi” hoặc “khuôn mặt”.
- source_word: וְ
  choice: và
  rationale: Liên từ nối và tiếp diễn trình thuật; tiếng Việt không cần thêm một trạng từ thời gian như “bấy giờ”.
theological_decisions:
- issue: Hành động của các anh Giô-sép đối với ông
  choice: cúi lạy ông
  alternative: sấp mình trước mặt ông; thờ lạy ông
  rationale: Văn cảnh mô tả sự quy phục trước người cầm quyền và liên hệ đến các giấc mơ trước đó, nhưng không nói họ thờ phượng Giô-sép như thần linh. “Cúi lạy” giữ được chiều sâu của cử chỉ mà không áp đặt ý nghĩa thờ phượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xứ” để chỉ lãnh thổ Ai Cập trong văn cảnh; dùng “các anh” thay vì “anh em” để tránh hiểu nhầm rằng Giô-sép cũng nằm trong nhóm người đến. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
