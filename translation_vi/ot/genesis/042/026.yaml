  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: vi
  text: Rồi họ chất ngũ cốc của mình lên lưng lừa và rời khỏi đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lương thực của mình” hoặc “ngũ cốc họ đã mua”. Từ Hê-bơ-rơ này có thể chỉ lương thực nói chung, nhưng trong văn cảnh này nhiều khả năng chỉ ngũ cốc mua tại Ai Cập.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: họ chất
  rationale: Động từ נשׂא có nghĩa cơ bản là “nhấc, mang”; trong ngữ cảnh đặt hàng hóa lên súc vật để vận chuyển, “chất” diễn đạt tự nhiên và sát ý.
- source_word: שִׁבְרָם
  choice: số ngũ cốc của mình
  rationale: Trong truyện Giô-sép, שֶׁבֶר thường chỉ ngũ cốc mua được giữa nạn đói. Cách dịch này cụ thể theo ngữ cảnh, còn chú thích bảo lưu nghĩa rộng hơn.
- source_word: עַל חֲמֹרֵיהֶם
  choice: lên lưng lừa
  rationale: עַל sau động từ chỉ việc chất hàng biểu thị sự đặt lên trên; “lên lưng lừa” là cách nói tự nhiên trong tiếng Việt và không cần lặp đại từ sở hữu vì chủ thể đã rõ.
- source_word: וַיֵּלְכוּ מִשָּׁם
  choice: rời khỏi đó
  rationale: Cụm này nói họ đi khỏi địa điểm ấy; “rời khỏi đó” gọn, tự nhiên và giữ đúng hướng chuyển động của מִן.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngũ cốc” để thể hiện nghĩa cụ thể trong văn cảnh, đồng thời giữ các khả năng từ vựng khác trong chú thích.
