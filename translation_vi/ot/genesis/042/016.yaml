base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: vi
  text: Hãy sai một người trong các ngươi đi, để người ấy đưa em trai các ngươi về đây[a]; còn các ngươi sẽ bị giam giữ[b], để lời các ngươi được kiểm chứng, xem sự thật có ở với các ngươi không[c]. Nếu không, ta lấy mạng sống Pha-ra-ôn mà thề[d], các ngươi quả là gián điệp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “để người ấy lấy em trai các ngươi.” Động từ Hê-bơ-rơ thường có nghĩa là “lấy,” nhưng ở đây nói đến việc đi đón người em và đưa người ấy trở về.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “còn các ngươi hãy bị giam” hoặc “hãy ở lại dưới sự canh giữ.” Động từ Hê-bơ-rơ có thể chỉ việc bị trói hoặc bị giữ trong tình trạng giam cầm.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “xem sự thật có ở với các ngươi không,” tức là xem các ngươi có nói thật hay không.'
    reason: lexical_alternative
  - marker: d
    text: “Lấy mạng sống Pha-ra-ôn mà thề” là một công thức thề viện dẫn sự sống của Pha-ra-ôn.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: Hãy sai một người trong các ngươi đi
  rationale: Mệnh lệnh số nhiều của שׁלח cùng cấu trúc מן + số từ chỉ việc chọn một người từ trong nhóm. Cách dịch này trực tiếp, trang trọng và tự nhiên trong tiếng Việt.
- source_word: וְיִקַּח אֶת־אֲחִיכֶם
  choice: để người ấy đưa em trai các ngươi về đây
  rationale: לקח thường có nghĩa là “lấy/đem,” nhưng trong ngữ cảnh người được sai đi phải dẫn người em trở lại chỗ Giô-sép, “đưa ... về đây” diễn đạt rõ hướng chuyển động hàm ẩn mà không thay đổi ý chính.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: còn các ngươi phải ở lại trong vòng giam giữ
  rationale: Dạng Niphal của אסר chỉ việc bị trói hoặc bị giữ trong tình trạng giam cầm. Cách dịch này giữ sắc thái thụ động/cưỡng chế nhưng tránh lối nói tiếng Việt gượng gạo như “hãy bị giam”.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: lời các ngươi sẽ được kiểm chứng
  rationale: בחן ở đây mang nghĩa thử nghiệm, xem xét để xác minh. “Lời” bảo tồn hình ảnh của nguyên văn, còn “được kiểm chứng” diễn đạt tự nhiên mục đích của phép thử.
- source_word: הַאֱמֶת אִתְּכֶם
  choice: xem sự thật có ở nơi các ngươi không
  rationale: Giữ tương đối sát thành ngữ Hê-bơ-rơ “sự thật ở với/cùng các ngươi,” thay vì giải thích hoàn toàn thành “các ngươi có nói thật không,” nhờ đó bảo tồn hình ảnh và độ căng của nguyên văn.
- source_word: חֵי פַרְעֹה
  choice: ta lấy mạng sống Pha-ra-ôn mà thề
  rationale: Đây là công thức thề dựa vào sự sống của Pha-ra-ôn. Cách nói tiếng Việt nêu rõ chức năng lời thề và vẫn giữ đối tượng được viện dẫn.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: các ngươi quả là gián điệp
  rationale: כִּי có sắc thái khẳng định mạnh trong kết luận này; “quả là” truyền đạt sự nhấn mạnh, còn מְרַגְּלִים được dịch thẳng là “gián điệp”.
theological_decisions:
- issue: Công thức thề nhân danh sự sống của Pha-ra-ôn
  choice: Giữ nguyên nội dung lời thề trong bản văn và giải thích bằng chú thích văn hóa.
  alternative: Làm nhẹ thành “ta thề” hoặc thay bằng một công thức thề mang màu sắc tôn giáo khác.
  rationale: Nguyên văn cố ý đặt lời thề trong bối cảnh triều đình Ai Cập. Không nên xóa yếu tố này hoặc du nhập một công thức thần học không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “các ngươi” phù hợp với lời của một người cầm quyền nói với một nhóm bị cáo buộc; “em trai” làm rõ quan hệ tuổi tác được ngữ cảnh Sáng Thế Ký xác nhận. Dấu chấm tách mệnh lệnh giam giữ khỏi mục đích kiểm chứng để câu tiếng Việt sáng rõ mà vẫn giữ mạch lập luận của nguyên văn.
