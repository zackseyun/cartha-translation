  source_fidelity: 'Bản dịch truyền đạt đúng mệnh đề xác nhận của Giô-sép (הוּא אֲשֶׁר) và nội dung lời buộc tội: “Các anh là gián điệp.” Cách dùng “các anh” phản ánh đúng ngôi thứ hai số nhiều trong ngữ cảnh Giô-sép nói với các anh mình. Dấu hai chấm chuyển chức năng dẫn lời của לֵאמֹר một cách trung thành và tự nhiên.'
  naturalness: '“Giô-sép nói với họ: ‘Đúng như tôi đã nói với các anh: …’” là tiếng Việt hiện đại, rõ ràng, phù hợp văn phong tường thuật trang trọng. Câu không giữ lối lặp Hebraic thiếu tự nhiên “đã nói... rằng/nói rằng” trong thân văn.'
  terminology: “Gián điệp” là tương đương chuẩn, rõ nghĩa cho מְרַגְּלִים. Tên “Giô-sép” và lối xưng hô “tôi/các anh” nhất quán với bối cảnh và thanh ghi bản dịch.
