  text: Joseph said to them[a], “It is as I said to you, saying[b], ‘You are spies.’”
translation:
  language: vi
  text: 'Giô-sép nói với họ: “Đúng như tôi đã nói với các anh[a]: ‘Các anh là gián điệp.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dịch sát là: “Ấy là điều tôi đã nói với các anh rằng: ‘Các anh là gián điệp.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: Giô-sép nói với họ
  rationale: Dùng thì kể chuyện tự nhiên trong tiếng Việt; liên từ וַ được hòa vào mạch văn thay vì dịch máy móc là “và”.
- source_word: הוּא אֲשֶׁר
  choice: Đúng như
  rationale: Diễn đạt tự nhiên sắc thái nhấn mạnh và xác nhận lại lời Giô-sép đã nói trước đó.
- source_word: דִּבַּרְתִּי אֲלֵכֶם לֵאמֹר
  choice: 'tôi đã nói với các anh:'
  rationale: Dấu hai chấm thể hiện tự nhiên chức năng của לֵאמֹר là dẫn vào nội dung lời nói, tránh lối diễn đạt dư thừa “nói rằng” nhưng vẫn ghi nhận cấu trúc sát chữ trong chú thích.
- source_word: מְרַגְּלִים אַתֶּם
  choice: Các anh là gián điệp
  rationale: Dịch trực tiếp vị ngữ phân từ cùng đại từ số nhiều; “các anh” phù hợp với nhóm anh em trai mà Giô-sép đang nói trực tiếp.
theological_decisions: []
