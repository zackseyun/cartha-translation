  to: 'Gia-cốp, cha của họ, nói với họ: “Các con đã khiến cha phải mất con[a]: Giô-sép không còn nữa, Si-mê-ôn cũng không còn nữa, thế mà các con còn muốn đem Bên-gia-min đi. Tất cả những điều này đều đổ dồn lên cha[b].”'
