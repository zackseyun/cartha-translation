base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: vi
  text: 'Gia-cốp, cha của họ, nói với họ: “Các con đã khiến cha phải mất con[a]: Giô-sép không còn nữa, Si-mê-ôn cũng không còn nữa, thế mà các con còn muốn đem Bên-gia-min đi. Tất cả những điều này đều đổ dồn lên cha[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các con đã khiến cha không còn con cái.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Tất cả những điều ấy đều chống lại cha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: đã khiến cha phải mất con
  rationale: Động từ Piel diễn tả việc gây cảnh mất con hoặc khiến một người trở nên không còn con. Cách dịch này giữ được đối tượng được nhấn mạnh אֹתִי (“cha/tôi”) và sức nặng cảm xúc, đồng thời tự nhiên trong lời than của một người cha Việt Nam.
- source_word: אֵינֶנּוּ
  choice: không còn nữa
  rationale: Cụm từ diễn tả sự vắng mặt hoặc mất mát, không chỉ là phủ định sự tồn tại. Cách dịch này giữ nguyên việc câu không nói rõ Giô-sép và Si-mê-ôn vắng mặt theo cùng một cách hay không.
- source_word: תִּקָּחוּ
  choice: còn muốn đem ... đi
  rationale: Dạng chưa hoàn thành chỉ hành động đang được đề nghị hoặc dự định theo góc nhìn phản đối của Gia-cốp. “Muốn đem đi” tự nhiên hơn một tương lai đơn thuần và “còn” thể hiện tính dồn thêm của lời than.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: Tất cả những điều này đều ập xuống trên cha
  rationale: Cách diễn đạt giữ cả ý tích tụ lẫn sắc thái bất lợi của עָלַי, trình bày các biến cố như cùng đổ xuống Gia-cốp.
- source_word: אֹתִי
  choice: cha
  rationale: Đại từ được giữ rõ trong tiếng Việt vì tiếng Hê-bơ-rơ đặt nó lên trước để nhấn mạnh chính Gia-cốp là người chịu cảnh mất con; “cha” phù hợp tự nhiên với lời ông nói cùng các con.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Gia-cốp, cha của họ
  rationale: Giữ trật tự và quan hệ đồng vị của nguyên văn bằng một cấu trúc tiếng Việt rõ ràng, trang trọng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm nhưng gần gũi. Trong lời thoại, dùng cách xưng hô “cha—các con” để thể hiện quan hệ gia đình vốn được ngữ cảnh xác định. Các tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt. Dấu chú thích được đặt ngay sau cụm từ mà mỗi chú thích giải thích.
