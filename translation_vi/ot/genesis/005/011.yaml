  yaml_path: translation/ot/genesis/005/011.yaml
  text: So all the days of Enosh were nine hundred and five years, and he died.
translation:
  language: vi
  text: Tổng cộng, Ê-nốt sống được chín trăm lẻ năm năm, rồi qua đời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: Tổng cộng, ... sống được
  rationale: Cụm Hê-bơ-rơ theo công thức gia phả nói đến toàn bộ tuổi thọ. Cách dịch này truyền đạt trọn ý một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: אֱנוֹשׁ
  choice: Ê-nốt
  rationale: Phiên âm tên riêng theo dạng Hê-bơ-rơ Enosh và theo lối ghi âm quen thuộc, dễ đọc trong tiếng Việt.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: chín trăm lẻ năm năm
  rationale: Tiếng Hê-bơ-rơ nêu năm trước rồi đến chín trăm; tiếng Việt tự nhiên sắp xếp thành 905. “Lẻ” làm rõ hàng chục bằng không.
- source_word: וַיָּמֹת
  choice: rồi qua đời
  rationale: Liên từ nối sự kiện cuối cùng trong công thức gia phả. “Qua đời” là cách diễn đạt tự nhiên, trang trọng và vẫn truyền đạt rõ nghĩa chết.
