base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi Lê-méc sinh ra Nô-ê, ông sống thêm năm trăm chín mươi lăm năm và sinh các con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả ở Sáng Thế Ký 5, động từ חיה chỉ quãng đời tiếp tục sau biến cố được nêu; “sống thêm” diễn đạt tự nhiên và rõ quan hệ thời gian trong tiếng Việt.
- source_word: אַחֲרֵי
  choice: sau khi
  rationale: Giới từ chỉ thời gian tiếp sau việc Nô-ê ra đời; kết hợp “sau khi sinh Nô-ê” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: הוֹלִידוֹ
  choice: sinh
  rationale: Hiphil của ילד với chủ thể nam trong gia phả mang nghĩa làm cha, sinh ra. Tiếng Việt thường dùng “sinh” cho cả cha lẫn mẹ; ngữ cảnh xác định Lê-méc là người cha mà không cần lối diễn đạt nặng nề.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: חָמֵשׁ וְתִשְׁעִים ... וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: năm trăm chín mươi lăm năm
  rationale: Tiếng Hê-bơ-rơ biểu thị 95 + 500; tiếng Việt tự nhiên sắp xếp thành tổng số 595.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Giữ sự nhất quán với הוֹלִידוֹ và bảo toàn sắc thái quan hệ cha-con của công thức gia phả.
- source_word: בָּנִים וּבָנוֹת
  choice: các con trai, con gái
  rationale: Bản Hê-bơ-rơ nêu rõ cả con trai lẫn con gái; không rút gọn thành từ khái quát “con cái”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc thời gian được đặt ở đầu câu để câu tiếng Việt trôi chảy, còn “sống thêm” làm rõ đây là số năm Lê-méc sống sau khi Nô-ê ra đời.
