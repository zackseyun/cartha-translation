  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Vậy, ... là
  rationale: Dạng tự sự của היה kèm waw dẫn vào câu tổng kết trong gia phả. “Vậy” truyền đạt quan hệ tiếp nối và tổng kết một cách tự nhiên trong tiếng Việt.
- source_word: כָּל יְמֵי
  choice: tổng số ngày của
  rationale: Cụm này theo sát hình ảnh Hê-bơ-rơ “tất cả những ngày của” nhưng dùng cách nói tiếng Việt tự nhiên để chỉ toàn bộ tuổi thọ.
- source_word: חֲנוֹךְ
  choice: Hê-nóc
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: ba trăm sáu mươi lăm
  rationale: Sắp xếp các thành tố số đếm theo trật tự tự nhiên của tiếng Việt, tương ứng chính xác với tổng số 365.
- source_word: שָׁנָה ... שָׁנָה
  choice: năm
  rationale: Hai lần dùng danh từ số ít trong cấu trúc số đếm Hê-bơ-rơ được diễn đạt bằng một đơn vị “năm” sau toàn bộ số đếm, đúng ngữ pháp tiếng Việt.
