base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi Kê-nan sinh Ma-ha-la-ên, ông sống thêm tám trăm bốn mươi năm và sinh các con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, động từ חיה nói về quãng đời tiếp tục sau khi người con được nêu tên ra đời; “sống thêm” diễn đạt tự nhiên quan hệ thời gian này trong tiếng Việt.
- source_word: קֵינָן
  choice: Kê-nan
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ קֵינָן theo lối viết dễ đọc trong tiếng Việt.
- source_word: אַחֲרֵי
  choice: sau khi
  rationale: Giới từ chỉ thời gian, đánh dấu giai đoạn sau khi Ma-ha-la-ên ra đời.
- source_word: הוֹלִידוֹ
  choice: sinh
  rationale: Hiphil của ילד với chủ thể nam mang nghĩa làm cha/sinh ra. Tiếng Việt thường dùng “sinh” cho cả cha lẫn mẹ; ngữ cảnh và chủ ngữ nam giữ rõ ý nghĩa.
- source_word: מַהֲלַלְאֵל
  choice: Ma-ha-la-ên
  rationale: Phiên âm tên Hê-bơ-rơ מַהֲלַלְאֵל theo dạng dễ đọc, đồng thời giữ cấu trúc âm tiết của tên gốc.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: tám trăm bốn mươi năm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang trật tự tự nhiên của tiếng Việt mà vẫn giữ nguyên tổng số 840 năm.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Giữ nhất quán từ vựng với הוֹלִידוֹ và diễn đạt tự nhiên hành động có thêm con của một người cha.
- source_word: בָּנִים וּבָנוֹת
  choice: các con trai, con gái
  rationale: Giữ rõ hai nhóm giới tính được văn bản Hê-bơ-rơ nêu, thay vì khái quát thành “các con”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp theo trật tự thời gian tự nhiên trong tiếng Việt; “sống thêm” làm rõ rằng 840 năm là quãng thời gian sau khi Ma-ha-la-ên ra đời. Dấu phẩy trong “các con trai, con gái” tạo cách liệt kê gọn, tránh lặp từ “các”.
