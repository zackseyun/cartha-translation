  yaml_path: translation/ot/genesis/005/025.yaml
  text: Methuselah lived one hundred and eighty-seven years and fathered Lamech[a].
translation:
  language: vi
  text: Mê-tu-sê-la sống được một trăm tám mươi bảy năm thì trở thành cha của La-méc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sinh con là La-méc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה giới thiệu số tuổi trước khi người con được sinh ra; “sống được” tự nhiên trong tiếng Việt và gắn rõ với khoảng thời gian nêu sau đó.
- source_word: מְתוּשֶׁלַח
  choice: Mê-tu-sê-la
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen dùng trong các bản Kinh Thánh tiếng Việt.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: một trăm tám mươi bảy năm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách nói tự nhiên, chính xác trong tiếng Việt.
- source_word: וַיּוֹלֶד
  choice: thì sinh
  rationale: Hiphil của ילד trong gia phả chỉ việc người nam có con; “sinh” là cách diễn đạt ngắn gọn, quen thuộc trong văn phong gia phả tiếng Việt, còn nghĩa trang trọng và minh thị hơn được ghi ở chú thích.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ trực tiếp, không có từ tương đương cần biểu đạt riêng trong tiếng Việt.
- source_word: לָמֶךְ
  choice: La-méc
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen dùng trong các bản Kinh Thánh tiếng Việt.
