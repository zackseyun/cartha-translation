  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: vi
  text: Sau khi sinh được Ê-nốt, Sết sống thêm tám trăm lẻ bảy năm và sinh được các con trai, con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả này, động từ חיה nói về quãng đời tiếp tục sau một biến cố đã nêu; “sống thêm” diễn đạt tự nhiên và rõ quan hệ thời gian trong tiếng Việt.
- source_word: אַחֲרֵי
  choice: sau khi
  rationale: Giới từ thời gian kết hợp với cấu trúc động từ phía sau, tự nhiên nhất trong tiếng Việt là “sau khi”.
- source_word: הוֹלִידוֹ אֶת־אֱנוֹשׁ
  choice: sinh Ê-nốt
  rationale: Hiphil của ילד trong gia phả chỉ việc người nam sinh ra/làm cha của người con được nêu. “Sinh” là cách nói gọn, thông dụng trong gia phả tiếng Việt và ngữ cảnh xác định Sết là chủ thể nam.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: tám trăm lẻ bảy năm
  rationale: Tiếng Hê-bơ-rơ đặt số đơn vị trước số trăm; tiếng Việt đảo về trật tự tự nhiên mà vẫn giữ đúng tổng số 807. “Lẻ” làm rõ hàng chục bằng không.
- source_word: וַיּוֹלֶד
  choice: và sinh
  rationale: Giữ sự nhất quán với động từ ילד trước đó và dùng lối diễn đạt gia phả tự nhiên, không cổ hóa.
- source_word: בָּנִים וּבָנוֹת
  choice: các con trai, con gái
  rationale: Giữ nguyên việc nguyên văn nêu rõ cả con trai lẫn con gái, thay vì khái quát thành “con cái”.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sống thêm” để làm rõ đây là số năm sau khi Ê-nốt ra đời; tên riêng được phiên âm theo lối Việt hóa quen thuộc: Sết, Ê-nốt.'
