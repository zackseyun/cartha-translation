  rationale: Sửa để tránh việc tiếng Việt hiểu A-đam là người trực tiếp sinh nở, đồng thời giữ nguyên quan hệ cha-con, trình tự sau khi Sết chào đời, thời lượng tám trăm năm, và việc có cả con trai lẫn con gái. Chú thích được chỉnh để khớp với cách diễn đạt đã sửa và neo tại thành ngữ được giải thích.
