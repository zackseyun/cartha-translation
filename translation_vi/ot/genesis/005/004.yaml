base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: vi
  text: Sau khi A-đam làm cha của Sết, ông sống thêm tám trăm năm[a] và có các con trai và con gái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dịch sát: “Những ngày của A-đam ... là tám trăm năm” sau khi ông làm cha của Sết.'
    reason: Giải thích thành ngữ Hê-bơ-rơ về “những ngày” của một người, được diễn đạt tự nhiên bằng “ông sống thêm tám trăm năm”; đồng thời phản ánh rõ nghĩa người cha của động từ trong ngữ cảnh này.
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: A-đam sống
  rationale: Cụm từ Hê-bơ-rơ dịch sát là “những ngày của A-đam là”, một thành ngữ chỉ thời gian sống. “A-đam sống” diễn đạt tự nhiên và đúng nghĩa trong tiếng Việt hiện đại.
- source_word: אָדָם
  choice: A-đam
  rationale: Trong gia phả này, từ này là tên riêng của nhân vật A-đam, không phải danh từ chung chỉ loài người.
- source_word: אַחֲרֵי
  choice: Sau khi
  rationale: Giới từ thời gian này cho biết quãng tám trăm năm bắt đầu sau sự kiện sinh Sết.
- source_word: הוֹלִידוֹ אֶת שֵׁת
  choice: sinh Sết
  rationale: Dạng Hiphil của ילד diễn tả việc làm cha hay sinh ra một người con. Trong văn phong gia phả tiếng Việt, “sinh Sết” ngắn gọn, tự nhiên và giữ được quan hệ cha-con.
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: tám trăm năm
  rationale: Đây là cách diễn đạt trực tiếp khoảng thời gian tám trăm năm.
- source_word: וַיּוֹלֶד
  choice: và sinh
  rationale: Giữ nhất quán với cùng gốc ילד ở đầu câu và phù hợp với lối trình bày gia phả.
- source_word: בָּנִים וּבָנוֹת
  choice: các con trai, con gái
  rationale: Bản Hê-bơ-rơ nêu rõ cả con trai lẫn con gái; không rút gọn thành từ chung “con cái”.
theological_decisions:
- issue: Cách hiểu אָדָם
  choice: Tên riêng “A-đam”
  alternative: Danh từ chung “người” hoặc “loài người”
  rationale: Ngữ cảnh gia phả và việc nêu tên Sết cho thấy đây là cá nhân mang tên A-đam.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sống thêm” làm rõ đây là tám trăm năm sau khi Sết ra đời, còn “sinh” giữ sắc thái gia phả súc tích của nguyên văn.
