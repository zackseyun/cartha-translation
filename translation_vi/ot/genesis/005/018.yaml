base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/018.yaml
  text: Jered lived one hundred sixty-two years and fathered Enoch.
translation:
  language: vi
  text: Giê-rết sống được một trăm sáu mươi hai năm, rồi trở thành cha của Hê-nóc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה mở đầu lời ghi tuổi; “sống được” tự nhiên trong tiếng Việt khi đi với số năm.
- source_word: יֶרֶד
  choice: Giê-rết
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt cho tên Yered/Jered.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: một trăm sáu mươi hai năm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách nói tự nhiên, chính xác trong tiếng Việt.
- source_word: וַיּוֹלֶד
  choice: thì sinh
  rationale: Trong gia phả theo dòng nam, ילד ở thể Hifil diễn tả việc người cha sinh ra/con nối dòng; “sinh” là cách nói tiếng Việt gọn và quen thuộc, còn “thì” thể hiện quan hệ thời gian sau số tuổi.
- source_word: אֶת חֲנוֹךְ
  choice: Hê-nóc
  rationale: Không dịch dấu chỉ tân ngữ אֶת; dùng dạng phiên âm tiếng Việt quen thuộc của tên Hanoch/Enoch.
theological_decisions:
- issue: Mức độ trực tiếp của quan hệ cha con trong וַיּוֹלֶד
  choice: sinh
  alternative: trở thành cha của
  rationale: Ngữ cảnh gia phả cho phép cách dịch “sinh” theo lối nói về người cha; bản dịch không thêm khẳng định ngoài văn bản về cơ chế sinh học hay loại trừ khả năng gia phả có tính chọn lọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc ngắn gọn của công thức gia phả. Không cần chú thích.
