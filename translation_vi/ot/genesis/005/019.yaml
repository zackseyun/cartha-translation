base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi sinh Hê-nóc[a], Giê-rết sống thêm tám trăm năm và sinh con trai và con gái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hê-nóc phiên âm sát tiếng Hebrew là Kha-nốc (Khanokh).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, động từ חיה diễn tả quãng đời tiếp tục sau biến cố vừa nêu; “sống thêm” là cách nói tự nhiên trong tiếng Việt và làm rõ quan hệ thời gian với אַחֲרֵי.
- source_word: יֶרֶד
  choice: Giê-rết
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt, đồng thời gần với âm Hebrew Yered hơn dạng tiếng Anh Jared.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת חֲנוֹךְ
  choice: Sau khi sinh Hê-nóc
  rationale: Cấu trúc thời gian được chuyển tự nhiên sang tiếng Việt; “sinh” trong văn cảnh gia phả có thể dùng cho người cha mà không cần lối nói cổ “sinh ra” hay thuật ngữ nặng tính kỹ thuật.
- source_word: חֲנוֹךְ
  choice: Hê-nóc
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt; chú thích cung cấp dạng phiên âm sát Hebrew hơn.
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: tám trăm năm
  rationale: Diễn đạt trực tiếp khoảng thời gian theo nguyên văn Hebrew.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: và sinh những con trai, con gái
  rationale: Giữ rõ cả hai nhóm hậu duệ nam và nữ như Hebrew, thay vì khái quát thành “con cái”; “những” cho thấy số nhiều.
