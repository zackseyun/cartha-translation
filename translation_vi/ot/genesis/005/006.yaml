  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: vi
  text: Sết sống được 105 tuổi rồi làm cha của Ê-nót.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה nói đến số năm một người đã sống trước sự kiện kế tiếp; “sống được” tự nhiên trong tiếng Việt và phù hợp với cách nêu tuổi.
- source_word: שֵׁת
  choice: Sết
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tên Hê-bơ-rơ שֵׁת.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 tuổi
  rationale: Cụm số Hê-bơ-rơ theo nghĩa đen là “năm năm và một trăm năm”, tức 105 năm; trong ngữ cảnh nói một người sống đến một độ tuổi trước khi sinh con, “105 tuổi” là cách diễn đạt tự nhiên và chính xác.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Trong gia phả, ילד ở thể Hifil chỉ việc sinh ra/làm cha của một người. Tiếng Việt thường dùng “sinh” cho cả người cha trong văn gia phả; cách này ngắn gọn và không cổ kính.
- source_word: אֶת אֱנוֹשׁ
  choice: Ê-nốt
  rationale: Không dịch dấu chỉ tân ngữ אֶת; tên אֱנוֹשׁ được phiên âm theo dạng tiếng Việt quen thuộc “Ê-nốt”.
theological_decisions:
- issue: וַיּוֹלֶד có thể nhấn mạnh việc sinh ra hoặc việc trở thành cha
  choice: sinh
  alternative: trở thành cha của
  rationale: “Sinh” là lối diễn đạt gia phả tự nhiên trong tiếng Việt nhưng có thể bị hiểu theo nghĩa người mẹ sinh con; vì vậy ghi phương án trang trọng, minh thị hơn trong chú thích mà không áp đặt thêm ý nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ câu ngắn theo công thức gia phả; dùng chữ số Ả Rập và các dạng tên riêng quen thuộc trong tiếng Việt.
