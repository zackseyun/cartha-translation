revisions:
- from: Sết sống được 105 tuổi thì sinh Ê-nốt[a].
  to: Sết sống được 105 tuổi rồi làm cha của Ê-nót.
  rationale: Đổi “thì sinh” thành “rồi làm cha của” để phản ánh rõ chủ ngữ nam của động từ Hifil ילד và giữ nhịp công thức gia phả. Chuẩn hóa “Ê-nót”. Bỏ ký hiệu và chú thích vì phương án chính đã truyền đạt trực tiếp sắc thái từ vựng cần thiết.
