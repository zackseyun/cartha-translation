  text: Kenan lived seventy years and fathered Mahalalel[a].
translation:
  language: vi
  text: Kê-nan sống đến bảy mươi tuổi thì làm cha của Ma-ha-la-lê.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch theo lối gia phả truyền thống: “Kê-nan sống bảy mươi năm rồi sinh ra Ma-ha-la-lê.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả này, חיה diễn tả số năm một người đã sống trước khi sinh người con được nêu; “sống được” tự nhiên trong tiếng Việt và nối rõ với mốc tuổi.
- source_word: קֵינָן
  choice: Kê-nan
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ theo lối viết dễ đọc trong tiếng Việt hiện đại.
- source_word: שִׁבְעִים שָׁנָה
  choice: bảy mươi năm
  rationale: Cụm từ chỉ khoảng thời gian, trong ngữ cảnh xác định tuổi của Kê-nan khi sinh Ma-ha-la-lê.
- source_word: וַיּוֹלֶד
  choice: thì sinh
  rationale: Dạng Hifil của ילד trong gia phả chỉ việc người nam sinh ra, tức làm cha của, người con được kể tên. “Sinh” ngắn gọn, tự nhiên trong lối nói gia phả tiếng Việt; “thì” thể hiện diễn tiến sau mốc bảy mươi năm.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu đánh dấu tân ngữ xác định trong tiếng Hê-bơ-rơ, không có từ tương ứng cần biểu đạt riêng trong tiếng Việt.
- source_word: מַהֲלַלְאֵל
  choice: Ma-ha-la-lê
  rationale: Phiên âm tên Hê-bơ-rơ theo âm tiết, dễ đọc đối với độc giả tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “sống được… năm thì sinh…” phù hợp công thức gia phả tiếng Việt; tên riêng được phiên âm có gạch nối. Dấu chú thích [a] được đặt ngay sau tên ở cuối câu.
