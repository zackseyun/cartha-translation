base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: vi
  text: Khi Nô-ê được năm trăm tuổi, ông làm cha của Sem, Cham và Gia-phết[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thứ tự “Sem, Cham và Gia-phết” theo nguyên văn Hê-bơ-rơ; thứ tự này không nhất thiết cho biết ai chào đời trước, cũng không có nghĩa cả ba đều chào đời trong cùng một năm.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי נֹחַ בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: Khi Nô-ê được năm trăm tuổi
  rationale: Cấu trúc וַיְהִי cùng thành ngữ בן + số tuổi nêu hoàn cảnh thời gian; cách diễn đạt này tự nhiên trong tiếng Việt và giữ đúng chức năng của mệnh đề.
- source_word: וַיּוֹלֶד
  choice: ông sinh
  rationale: Dạng Hiphil của ילד với chủ thể nam có nghĩa là sinh ra, làm cha của. Trong văn gia phả tiếng Việt, “ông sinh” vừa gọn, trang trọng, vừa tự nhiên hơn “ông làm cha của”.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: שֵׁם
  choice: Sem
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: חָם
  choice: Cham
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: יָפֶת
  choice: Gia-phết
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Cham và Gia-phết
  rationale: Không dịch các dấu hiệu tân ngữ אֶת; trình bày danh sách theo cú pháp tự nhiên của tiếng Việt và giữ nguyên thứ tự trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Hàm ý về thứ tự sinh và thời điểm sinh của Sem, Cham, Gia-phết
  choice: Giữ nguyên thứ tự tên trong bản Hê-bơ-rơ, nhưng thêm chú thích để tránh hiểu rằng đây nhất thiết là thứ tự sinh hoặc cả ba cùng sinh trong một năm.
  alternative: Sắp xếp lại theo thứ tự sinh được suy đoán, hoặc diễn đạt như thể cả ba đều sinh khi Nô-ê đúng năm trăm tuổi.
  rationale: Câu này liệt kê ba người con sau mốc Nô-ê năm trăm tuổi, nhưng không buộc phải hiểu danh sách theo thứ tự sinh hay cả ba cùng chào đời trong năm ấy. Giữ nguyên sự căng thẳng của văn bản, không áp đặt cách dung hòa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Được năm trăm tuổi” là cách nói tuổi tự nhiên; “ông sinh” phù hợp với lối kể gia phả. Tên riêng dùng các dạng quen thuộc trong tiếng Việt.
