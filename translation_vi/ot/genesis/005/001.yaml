  source_fidelity: Bản dịch phân biệt đúng A-đam (tên riêng) trong đề mục với אָדָם theo nghĩa chung trong mệnh đề sáng tạo; đồng thời giữ được sự phân biệt giữa ברא (“sáng tạo”) và עשה (“làm nên”). Tuy nhiên, “theo hình dạng giống Đức Chúa Trời” dễ gợi hình dáng thể lý và diễn đạt quá mức nghĩa của דְּמוּת, vốn là “sự giống/điều tương tự, likeness.”
  naturalness: “Đây là sách ghi chép dòng dõi” và nhất là “theo hình dạng giống Đức Chúa Trời” không tự nhiên trong tiếng Việt hiện đại. “Sách về dòng dõi” và “theo sự giống như Đức Chúa Trời” rõ ràng, trang trọng, và sát nghĩa hơn. Lặp lại “con người” ở cuối câu giúp câu Việt minh bạch mà không buộc đại từ số ít Hê-bơ-rơ phải chỉ một cá nhân riêng lẻ.
