base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: vi
  text: Đây là sách về dòng dõi[a] A-đam. Vào ngày[b] Đức Chúa Trời sáng tạo con người[c], Ngài đã làm nên con người theo sự giống như Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thế hệ”, “con cháu”, hoặc “bản ký thuật về dòng dõi”.'
    reason: lexical_alternative
  - marker: b
    text: Thành ngữ Hê-bơ-rơ “vào ngày” cũng có thể mang nghĩa thời gian là “khi”.
    reason: lexical_alternative
  - marker: c
    text: Từ Hê-bơ-rơ ở đây cũng là từ được dùng làm tên “A-đam”; trong ngữ cảnh này, nó có thể chỉ “con người” hoặc “loài người”.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: Đây là sách ghi chép
  rationale: Cụm danh từ Hê-bơ-rơ mở đầu một đề mục; tiếng Việt tự nhiên cần thêm “là”. “Sách ghi chép” giữ ý về một văn bản hay bản ký thuật mà không ấn định hình thức vật liệu.
- source_word: תּוֹלְדֹת
  choice: dòng dõi
  rationale: Trong phần mở đầu gia phả này, từ chỉ các thế hệ, hậu duệ, hoặc bản ký thuật về họ. “Dòng dõi” tự nhiên trong tiếng Việt và phù hợp với danh sách con cháu tiếp theo, còn chú thích giữ lại phạm vi nghĩa rộng hơn.
- source_word: אָדָם (lần thứ nhất)
  choice: A-đam
  rationale: Trong đề mục gia phả, từ này chỉ vị tổ tiên mang tên riêng A-đam.
- source_word: בְּיוֹם בְּרֹא
  choice: Vào ngày ... sáng tạo
  rationale: Giữ cấu trúc thời gian và âm hưởng trang trọng của nguyên văn; chú thích cho biết thành ngữ này cũng có thể hiểu tự nhiên là “khi”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ đi với ý nghĩa số ít trong ngữ cảnh này; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: אָדָם (lần thứ hai)
  choice: con người
  rationale: Ở mệnh đề sáng tạo, từ được dùng theo nghĩa chung, chỉ loài người/con người, chứ không nhất thiết chỉ là tên riêng A-đam.
- source_word: בִּדְמוּת אֱלֹהִים
  choice: theo hình dạng giống Đức Chúa Trời
  rationale: Giữ riêng nghĩa “hình dạng/sự giống” của דְּמוּת, không đồng nhất với צֶלֶם (“hình ảnh”), đồng thời diễn đạt được sự tương đồng trong tiếng Việt.
- source_word: עָשָׂה אֹתוֹ
  choice: Ngài làm nên người
  rationale: Phân biệt động từ עשה (“làm nên”) với ברא (“sáng tạo”). “Người” chuyển đại từ tân ngữ số ít giống đực theo cách tự nhiên hơn trong tiếng Việt và vẫn giữ nét đại diện số ít.
theological_decisions:
- issue: Hai cách dùng אָדָם trong cùng câu
  choice: Dùng tên riêng “A-đam” ở đề mục và danh từ chung “con người” trong mệnh đề sáng tạo
  alternative: Dùng “A-đam” ở cả hai chỗ, hoặc “người đàn ông” ở chỗ thứ hai
  rationale: Ngữ cảnh gia phả xác định lần thứ nhất là tên vị tổ tiên; tiếng vọng từ trình thuật sáng tạo khiến lần thứ hai có nghĩa khái quát. “Con người” giữ nghĩa bao quát mà không buộc nguyên văn chỉ nói đến một người nam riêng lẻ.
- issue: Quan hệ giữa דְּמוּת và ngôn ngữ về hình ảnh Đức Chúa Trời
  choice: Dịch theo nghĩa “hình dạng giống”
  alternative: Dịch là “hình ảnh của Đức Chúa Trời”
  rationale: Nguyên văn dùng דְּמוּת chứ không dùng צֶלֶם. Không hòa đồng hai từ giúp bảo toàn sắc thái từ vựng và sức căng thần học của bản văn.
- issue: Đại từ số ít trong עָשָׂה אֹתוֹ
  choice: “Ngài làm nên người”
  alternative: “Ngài làm nên họ” hoặc “Ngài làm nên người ấy”
  rationale: Nguyên văn có tân ngữ số ít giống đực. Cách dịch “người” tránh biến nó thành số nhiều, đồng thời không khiến câu tiếng Việt hiểu sai rằng chỉ một cá nhân đã được nhắc đích danh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Sách ghi chép dòng dõi” được ưu tiên hơn cách dịch sát chữ nhưng gượng là “sách các thế hệ”. Câu giữ “Vào ngày” để bảo toàn âm hưởng nguyên văn, có chú thích giải thích nghĩa thành ngữ. Cụm “theo hình dạng giống Đức Chúa Trời” hơi trang trọng có chủ ý nhằm phân biệt דְּמוּת với từ Hê-bơ-rơ thường dịch là “hình ảnh”.
