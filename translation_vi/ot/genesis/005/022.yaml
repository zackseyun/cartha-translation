base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi sinh Mê-tu-sê-la, Hê-nóc đi với Đức Chúa Trời ba trăm năm[a] và sinh con trai, con gái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sống trong sự tương giao với Đức Chúa Trời.” Nguyên văn là “đi với Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: đồng đi với
  rationale: Giữ lại hình ảnh ẩn dụ của thành ngữ Hê-bơ-rơ về nếp sống và mối tương giao của Hê-nóc với Đức Chúa Trời; cách nói này trang trọng, quen thuộc và không diễn giải quá mức.
- source_word: אֶת הָאֱלֹהִים
  choice: với Đức Chúa Trời
  rationale: Trong thành ngữ này, אֶת mang nghĩa đồng hành, liên hệ; danh xưng được chuyển theo cách gọi tự nhiên và trang trọng trong tiếng Việt.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: sau khi sinh Mê-tu-sê-la
  rationale: 'Diễn đạt rõ quan hệ thời gian: giai đoạn ba trăm năm bắt đầu sau khi Hê-nóc sinh Mê-tu-sê-la.'
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: ba trăm năm
  rationale: Chuyển trực tiếp con số và khoảng thời gian, đặt sau cụm động từ mà nó bổ nghĩa để câu tiếng Việt rõ ràng.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: và sinh thêm con trai, con gái
  rationale: Giữ sự phân biệt rõ con trai và con gái trong nguyên văn; thêm 'thêm' để thể hiện tự nhiên rằng đây là những người con ngoài Mê-tu-sê-la mà không thay đổi nội dung.
- source_word: מְתוּשֶׁלַח
  choice: Mê-tu-sê-la
  rationale: Phiên âm tên riêng theo lối dễ đọc, quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Bản chất mối quan hệ của Hê-nóc với Đức Chúa Trời trong thành ngữ 'đi với Đức Chúa Trời'
  choice: Giữ hình ảnh quan hệ bằng cụm 'đồng đi với Đức Chúa Trời'
  alternative: sống trong sự tương giao với Đức Chúa Trời
  rationale: Nguyên văn dùng ẩn dụ 'đi', vừa gợi một nếp sống vừa gợi sự gần gũi với Đức Chúa Trời. Giữ ẩn dụ tránh thu hẹp ý nghĩa thần học vào một cách giải thích duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh để xác định rõ 'ba trăm năm' là thời gian Hê-nóc đồng đi với Đức Chúa Trời sau khi sinh Mê-tu-sê-la, tránh lối ghép mơ hồ.
