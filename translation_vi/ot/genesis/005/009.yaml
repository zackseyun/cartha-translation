base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/009.yaml
  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: vi
  text: Ê-nót sống được chín mươi năm thì trở thành cha của Kê-nan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên này cũng được viết là “Cai-nan” trong một số bản dịch theo dạng tên Hy Lạp; bản văn Hê-bơ-rơ ghi Kê-nan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả đi cùng số tuổi, động từ חיה nói về quãng đời đã sống đến mốc tuổi được nêu; “sống được” tự nhiên trong tiếng Việt.
- source_word: אֱנוֹשׁ
  choice: Ê-nốt
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ Enosh theo lối viết tên riêng tự nhiên trong tiếng Việt.
- source_word: תִּשְׁעִים שָׁנָה
  choice: chín mươi năm
  rationale: Chuyển chính xác con số và diễn đạt theo cú pháp tiếng Việt hiện đại.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Ở dạng Hiphil trong gia phả với chủ thể nam, ילד chỉ việc sinh ra con hay làm cha của người con ấy. “Sinh” là cách nói gọn, tự nhiên trong gia phả tiếng Việt và không mang sắc thái cổ của “sinh ra” theo nghĩa đen về tiến trình sinh nở.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu đánh dấu tân ngữ xác định trong tiếng Hê-bơ-rơ, không có từ tương ứng cần biểu đạt riêng trong tiếng Việt.
- source_word: קֵינָן
  choice: Kê-nan
  rationale: Phiên âm từ dạng Hê-bơ-rơ Qênan/Kenan; không dùng dạng Cai-nan chịu ảnh hưởng của truyền thống Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng nhưng hiện đại. Cấu trúc “sống được… năm thì sinh…” truyền đạt tự nhiên quan hệ nối tiếp trong câu Hê-bơ-rơ. Giữ tên riêng gần dạng Hê-bơ-rơ và chỉ chú thích biến thể quen thuộc có nguồn gốc Hy Lạp.
