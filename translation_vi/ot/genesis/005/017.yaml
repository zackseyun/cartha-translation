translation:
  language: vi
  text: Tổng số ngày của Ma-ha-la-lê-ên là tám trăm chín mươi lăm năm, rồi ông qua đời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: sống tổng cộng
  rationale: Cụm Hê-bơ-rơ theo sát nghĩa là “tất cả những ngày ... là”, dùng để tổng kết toàn bộ tuổi thọ. “Sống tổng cộng” truyền đạt đầy đủ ý nghĩa ấy bằng tiếng Việt tự nhiên, đồng thời giữ chức năng công thức của gia phả.
- source_word: מַהֲלַלְאֵל
  choice: Ma-ha-la-lê
  rationale: Phiên âm tên riêng Hê-bơ-rơ thành các âm tiết rõ ràng, phù hợp cách đọc tự nhiên trong tiếng Việt.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: tám trăm chín mươi lăm năm
  rationale: Sắp xếp lại thứ tự các thành tố số theo cú pháp tiếng Việt hiện đại, nhưng giữ nguyên chính xác tổng số 895 năm.
- source_word: וַיָּמֹת
  choice: rồi qua đời
  rationale: Giữ trình tự và nhịp kết thúc lặp lại của gia phả. “Qua đời” là cách diễn đạt trang trọng, tự nhiên; “rồi” thể hiện sự tiếp nối của liên từ tường thuật.
