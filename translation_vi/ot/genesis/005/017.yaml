  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc được diễn đạt tự nhiên thay vì sao chép máy móc thành ngữ Hê-bơ-rơ “tất cả những ngày ... là”, nhưng vẫn bảo toàn ý tổng kết trọn tuổi thọ và nhịp điệu trang nghiêm của công thức gia phả.
