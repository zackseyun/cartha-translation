base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/031.yaml
  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: vi
  text: Lê-méc sống tất cả bảy trăm bảy mươi bảy năm[a], rồi ông qua đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen sắp xếp con số là “bảy và bảy mươi năm, và bảy trăm năm,” tức 777 năm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Vậy, ... là
  rationale: Dạng waw-consecutive của היה mở đầu lời tổng kết về tuổi thọ của Lê-méc; “Vậy” chuyển tải tự nhiên sắc thái nối tiếp và tổng kết trong mạch gia phả.
- source_word: כָּל יְמֵי
  choice: tổng số ngày của
  rationale: Giữ hình ảnh nguyên ngữ “mọi ngày” nhưng dùng cấu trúc tiếng Việt tự nhiên để chỉ toàn bộ quãng đời.
- source_word: לֶמֶךְ
  choice: Lê-méc
  rationale: Phiên âm tên riêng theo lối quen thuộc, rõ ràng trong tiếng Việt.
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: bảy trăm bảy mươi bảy
  rationale: Nguyên ngữ liệt kê hàng đơn vị, hàng chục rồi hàng trăm, nhưng tổng số là 777; tiếng Việt hiện đại diễn đạt theo thứ tự hàng trăm, hàng chục, hàng đơn vị.
- source_word: שָׁנָה
  choice: năm
  rationale: “Năm” là danh từ chỉ đơn vị thời gian tự nhiên sau số đếm trong tiếng Việt.
- source_word: וַיָּמֹת
  choice: rồi ông qua đời
  rationale: Giữ công thức kết thúc lặp lại trong Sáng Thế Ký 5; “rồi” thể hiện diễn tiến, còn “qua đời” trang trọng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Công thức tuổi thọ trong gia phả Sáng Thế Ký 5
  choice: Trình bày con số như lời tổng kết trực tiếp về tuổi thọ, không thêm lời giải thích mang tính biểu tượng.
  alternative: Diễn giải các con số theo nghĩa biểu tượng ngay trong bản văn.
  rationale: Bản Hê-bơ-rơ nêu trực tiếp tuổi thọ và sự qua đời; bản dịch không nên đưa một cách giải thích thần học hoặc hoài nghi vào câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tổng số ngày” bảo tồn thành ngữ Hê-bơ-rơ mà vẫn tự nhiên; nhịp câu duy trì tính công thức của gia phả.
