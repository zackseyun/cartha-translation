  to: Lê-méc sống tất cả bảy trăm bảy mươi bảy năm[a], rồi ông qua đời.
  rationale: Bản sửa diễn đạt tự nhiên ý của thành ngữ Hê-bơ-rơ «mọi ngày của Lê-méc» bằng công thức tuổi thọ tiếng Việt, vẫn giữ nguyên số 777, tên riêng và lời thông báo qua đời. Chú thích được giữ để cho thấy thứ tự số đếm của nguyên ngữ mà không áp đặt diễn giải.
