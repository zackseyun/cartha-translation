review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng tổng tuổi thọ 777 năm và lời kết thúc «ông qua đời», phù hợp với công thức gia phả của tiếng Hê-bơ-rơ. Tuy nhiên, «tổng số ngày ... là ... năm» là cách giữ sát thành ngữ nguồn nhưng không tự nhiên trong tiếng Việt hiện đại.
  naturalness: 'Nên chuyển thành ngữ «mọi ngày của Lê-méc» theo nghĩa tương đương tự nhiên: «Lê-méc sống tất cả ... năm». Cách này vẫn bao quát trọn đời người, tránh sự lệch đơn vị giữa «ngày» và «năm», đồng thời giữ nhịp công thức của đoạn gia phả.'
  terminology: «Lê-méc» là cách phiên âm phù hợp. «Qua đời» có sắc thái trang trọng, thích hợp với văn cảnh; không cần thay đổi. Chú thích phản ánh chính xác thứ tự khác thường của các thành tố số đếm trong tiếng Hê-bơ-rơ.
  issues:
  - severity: low
    issue: Cụm «tổng số ngày của Lê-méc là ... năm» không tự nhiên trong tiếng Việt hiện đại.
    rationale: Dù bám sát thành ngữ כָּל יְמֵי, sự kết hợp «ngày» với tổng số tính bằng «năm» gây vấp về cách diễn đạt. Chuyển sang «sống tất cả ... năm» bảo toàn nghĩa tổng quát của toàn bộ đời người.
  - severity: low
    issue: «Vậy» ở đầu câu không cần thiết.
    rationale: וַיְהִי có thể đánh dấu diễn tiến/tổng kết, nhưng tiếng Việt không cần một liên từ tương ứng tại đây; bỏ đi giúp câu gia phả gọn và tự nhiên hơn mà không mất nghĩa.
  revised_text: Lê-méc sống tất cả bảy trăm bảy mươi bảy năm[a], rồi ông qua đời.
