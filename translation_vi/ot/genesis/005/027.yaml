translation:
  language: vi
  text: Tổng số ngày của Mê-tu-sê-la là chín trăm sáu mươi chín năm; rồi ông qua đời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: Vậy, tổng số ngày... là
  rationale: Diễn đạt tự nhiên công thức tổng kết gia phả, đồng thời giữ hình ảnh sát nguyên văn “tất cả các ngày” qua cụm “tổng số ngày”, thay vì diễn giải thành “tuổi thọ”.
- source_word: מְתוּשֶׁלַח
  choice: Mê-tu-sê-la
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối rõ âm tiết và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת שָׁנָה
  choice: chín trăm sáu mươi chín năm
  rationale: Sắp xếp các thành tố số theo cú pháp tiếng Việt hiện đại; nguyên văn nêu sáu mươi chín trước rồi chín trăm sau.
- source_word: וַיָּמֹת
  choice: rồi ông qua đời
  rationale: “Rồi” thể hiện sự tiếp nối của thể kể chuyện; “qua đời” là cách nói tự nhiên, trang trọng cho hành động chết trong công thức gia phả.
