base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: vi
  text: Hê-nóc bước đi với Đức Chúa Trời; ông không còn nữa,[a] vì Đức Chúa Trời đã đem ông đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát nghĩa: “và ông không có mặt.” Cách nói Hê-bơ-rơ cho biết Hê-nóc không còn hiện diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: đồng đi
  rationale: Dạng Hitpael diễn tả lối sống hay sự gắn bó liên tục, không chỉ là chuyển động thể chất. “Đồng đi” giữ được hình ảnh Hê-bơ-rơ và sắc thái tương giao.
- source_word: אֶת הָאֱלֹהִים
  choice: với Đức Chúa Trời
  rationale: Sau động từ הלך, אֶת biểu thị sự đồng hành. Cách dịch này giữ nguyên ý nghĩa gần gũi, mang tính tương giao.
- source_word: וְאֵינֶנּוּ
  choice: rồi ông không còn nữa
  rationale: Nguyên văn là “và ông không [còn]”. Cách diễn đạt này tự nhiên trong tiếng Việt, nói lên việc Hê-nóc không còn hiện diện mà không xác định thêm ông đã ra đi theo cách nào.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu nguyên nhân khiến Hê-nóc không còn hiện diện.
- source_word: לָקַח אֹתוֹ
  choice: đã đem ông đi
  rationale: לקח có nghĩa cơ bản là “lấy, đem”. Trong tiếng Việt, “đem ông đi” diễn đạt tự nhiên hành động Đức Chúa Trời đưa Hê-nóc khỏi đời sống thông thường, nhưng không thêm địa điểm hay cách thức mà câu Hê-bơ-rơ không nói rõ.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong văn mạch này, danh từ chỉ Đức Chúa Trời duy nhất; “Đức Chúa Trời” là cách gọi trang trọng và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Có nên nói rõ Hê-nóc không chết hoặc được đưa lên trời hay không
  choice: 'Giữ cách nói dè dặt của nguyên văn: “rồi ông không còn nữa, vì Đức Chúa Trời đã đem ông đi.”'
  alternative: “ông không chết”; “Đức Chúa Trời đưa ông lên trời”; “ông được cất lên”
  rationale: Câu này gợi đến một hành động đặc biệt của Đức Chúa Trời, nhưng bản Hê-bơ-rơ không nói rõ “lên trời” và cũng không trực tiếp tuyên bố trong câu này rằng Hê-nóc không chết. Bản dịch vì thế không đưa cách giải thích về sau vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đồng đi với Đức Chúa Trời” được dùng để giữ thành ngữ Hê-bơ-rơ về một đời sống liên tục trong sự gắn bó với Ngài; dấu chấm phẩy giúp thể hiện hai vế ngắn, cô đọng của câu.
