    issue: “đồng đi với” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này có vẻ là lối ghép từ sát chữ hơn là cách dùng thông thường. “Bước đi với Đức Chúa Trời” vừa tự nhiên trong đăng ký Kinh Thánh vừa duy trì ẩn dụ về nếp sống gắn bó liên tục.
  - severity: low
    issue: Chú thích gọi “và ông không [còn]” là cách nói sát hơn nguyên văn.
    rationale: Từ “còn” không hiện diện trong mệnh đề Hê-bơ-rơ. Có thể giải thích thành ngữ là “ông không còn hiện diện,” nhưng phần được gọi là sát nghĩa nên là “và ông không có mặt/không còn ở đó” hoặc ghi rõ đây là cách diễn đạt theo nghĩa.
