base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/015.yaml
  text: Mahalalel lived sixty-five years and fathered Jared.
translation:
  language: vi
  text: Ma-ha-la-lê sống được sáu mươi lăm tuổi thì làm cha của Gia-rết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה chỉ số năm một người đã sống trước sự kiện kế tiếp; “sống được” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מַהֲלַלְאֵל
  choice: Ma-ha-la-lê
  rationale: Tên riêng được phiên âm theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt, thay vì dịch nghĩa.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: sáu mươi lăm tuổi
  rationale: Tiếng Hê-bơ-rơ nói theo thứ tự “năm năm và sáu mươi năm”; tiếng Việt hiện đại đảo lại thành “sáu mươi lăm tuổi” nhưng giữ nguyên giá trị số.
- source_word: וַיּוֹלֶד
  choice: thì sinh
  rationale: Trong gia phả, ילד ở dạng này nói về việc người nam sinh ra hoặc làm cha của người con được nêu; “sinh” là cách diễn đạt gọn, tự nhiên và quen thuộc trong văn phong gia phả tiếng Việt.
- source_word: אֶת יָרֶד
  choice: Gia-rết
  rationale: Dấu chỉ tân ngữ אֶת không được dịch; tên יָרֶד được phiên âm theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Mức độ trực tiếp của quan hệ cha con trong động từ ילד
  choice: sinh
  alternative: làm cha của
  rationale: Ngữ cảnh là công thức gia phả và không đòi hỏi thêm một cách giải thích thần học; “sinh” giữ lối nói cô đọng của nguyên bản mà không bổ sung chi tiết ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; dùng cấu trúc “sống được ... tuổi thì sinh ...” tự nhiên trong tiếng Việt, đồng thời giữ tính cô đọng của câu gia phả Hê-bơ-rơ.
