  text: וַ/יִּֽהְיוּ֙ כָּל יְמֵי יֶ֔רֶד שְׁתַּ֤יִם וְ/שִׁשִּׁים֙ שָׁנָ֔ה וּ/תְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/020.yaml
  text: So all the days of Yered were nine hundred and sixty-two years[a], and he died.
translation:
  language: vi
  text: Tổng số năm sống của Yê-rết là chín trăm sáu mươi hai năm,[a] rồi ông chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hê-bơ-rơ là Yered; trong nhiều bản dịch, tên này được dịch là Gia-rết (Jared).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Vậy, ... là
  rationale: Động từ wayyiqtol của היה mở đầu lời tổng kết trong gia phả. “Vậy” diễn đạt tự nhiên sắc thái tiếp nối và tổng kết.
- source_word: כָּל יְמֵי
  choice: tất cả những ngày đời của
  rationale: Giữ hình ảnh của thành ngữ gia phả Hê-bơ-rơ, đồng thời thêm “đời” để câu rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: יֶרֶד
  choice: Yê-rết
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ Yered theo cách đọc dễ nhận biết trong tiếng Việt.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: chín trăm sáu mươi hai năm
  rationale: Gộp hai cụm số theo trật tự tự nhiên của tiếng Việt, vẫn biểu đạt chính xác tổng số 962 năm.
- source_word: וַיָּמֹת
  choice: rồi ông qua đời
  rationale: Diễn đạt công thức kết thúc quen thuộc của Sáng Thế Ký 5 bằng tiếng Việt trang trọng, tự nhiên; “rồi” giữ mạch kể tiếp nối.
