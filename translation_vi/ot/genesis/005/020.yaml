translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ “tất cả những ngày đời” khá sát nguyên văn thay vì rút gọn hoàn toàn thành “tuổi thọ”; dùng “qua đời” thay cho “chết” để phù hợp văn phong gia phả trang nghiêm.
