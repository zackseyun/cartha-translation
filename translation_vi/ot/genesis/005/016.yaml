    rationale: Trong tiếng Việt hiện đại, “sinh” thường gợi hành động sinh nở của người mẹ. Nguyên văn Hebrew dùng ילד ở thể Hiphil với chủ ngữ nam, nghĩa là làm cha/sinh con theo vai trò người cha. Cần diễn đạt tránh chuyển nghĩa vai trò này.
  revised_text: Sau khi trở thành cha của Giê-rết, Ma-ha-la-lê sống thêm tám trăm ba mươi năm và có thêm các con trai và con gái.
