revisions:
- from: Sau khi sinh Giê-rết, Ma-ha-la-lê sống thêm tám trăm ba mươi năm và sinh các con trai, con gái.
  to: Sau khi trở thành cha của Giê-rết, Ma-ha-la-lê sống thêm tám trăm ba mươi năm và có thêm các con trai và con gái.
  rationale: Thay “sinh” bằng cách diễn đạt xác định Ma-ha-la-lê là cha của Giê-rết, đồng thời dùng “có thêm các con trai và con gái” cho mệnh đề kết để tránh hàm ý sinh nở nơi một chủ ngữ nam. “Sống thêm” vẫn phản ánh quãng đời tiếp tục sau khi Giê-rết ra đời; “thêm” ở vế cuối phù hợp ngữ cảnh hậu sinh mà không thêm thông tin thực chất.
