base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: vi
  text: Sau khi trở thành cha của Giê-rết, Ma-ha-la-lê sống thêm tám trăm ba mươi năm và có thêm các con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả này, động từ חיה chỉ quãng đời tiếp tục sau khi người con được nêu tên ra đời; “sống thêm” diễn đạt tự nhiên và làm rõ quan hệ thời gian.
- source_word: מַהֲלַלְאֵל
  choice: Ma-ha-la-lê
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Sau khi sinh
  rationale: Cụm từ chỉ thời gian sau việc người cha sinh ra người con; tiếng Việt thường dùng “sinh” cho việc có con mà không cần thêm từ cổ hoặc nặng tính kỹ thuật.
- source_word: יֶרֶד
  choice: Giê-rết
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong tiếng Việt.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: tám trăm ba mươi năm
  rationale: Sắp xếp số theo trật tự tự nhiên của tiếng Việt, giữ nguyên tổng số 830 năm.
- source_word: וַיּוֹלֶד
  choice: và sinh
  rationale: Giữ sự tương ứng với động từ ילד trước đó và dùng cách nói gọn, tự nhiên trong văn cảnh gia phả.
- source_word: בָּנִים וּבָנוֹת
  choice: các con trai, con gái
  rationale: Giữ nguyên việc nguyên văn nêu rõ cả con trai lẫn con gái, thay vì khái quát thành “con cái”.
theological_decisions: []
