lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: tổng số năm ... sống là
  rationale: Cụm này tổng kết toàn bộ tuổi thọ. Cách diễn đạt tiếng Việt tự nhiên này truyền đạt đầy đủ ý nghĩa của công thức Hê-bơ-rơ mà không cần giữ nguyên thành ngữ “tất cả các ngày”.
- source_word: שֵׁת
  choice: Sết
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: chín trăm mười hai năm
  rationale: Tiếng Hê-bơ-rơ nêu mười hai rồi chín trăm; tiếng Việt sắp xếp theo trật tự số đếm tự nhiên, vẫn giữ nguyên tổng số 912 năm.
- source_word: וַיָּמֹת
  choice: rồi ông qua đời
  rationale: “Rồi” thể hiện sự tiếp nối của lối kể chuyện; “qua đời” là cách nói trang trọng, tự nhiên trong tiếng Việt và giữ sắc thái nghiêm trang của công thức gia phả.
