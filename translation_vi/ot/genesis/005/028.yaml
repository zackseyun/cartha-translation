  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: vi
  text: Lê-méc sống được một trăm tám mươi hai năm thì sinh một con trai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה nêu số năm nhân vật đã sống trước sự kiện kế tiếp; “sống được” tự nhiên trong tiếng Việt khi đi với một khoảng tuổi.
- source_word: לֶמֶךְ
  choice: Lê-méc
  rationale: Phiên âm tên riêng theo lối quen thuộc, rõ âm tiết trong tiếng Việt.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: một trăm tám mươi hai năm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang trật tự tự nhiên của tiếng Việt mà giữ nguyên trị số 182.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Hiphil của ילד với chủ ngữ nam diễn tả việc sinh ra/làm cha của một người con; trong công thức gia phả tiếng Việt, “sinh” ngắn gọn, tự nhiên và không hàm ý người cha trực tiếp mang thai.
- source_word: בֵּן
  choice: một con trai
  rationale: בֵּן có nghĩa là “con trai”; “một” thể hiện tính chưa xác định vì người con chưa được nêu tên trong câu này.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc “sống được … năm thì sinh” để diễn đạt tự nhiên mối tiếp nối thời gian của hai động từ trong công thức gia phả, không thêm nội dung thần học.
