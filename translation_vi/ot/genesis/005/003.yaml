source:
  edition: WLC
  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: vi
  text: A-đam sống một trăm ba mươi năm, rồi sinh được một con trai giống như mình, theo hình ảnh mình, và đặt tên con là Sết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Khi A-đam được ... tuổi
  rationale: Trong công thức gia phả này, động từ חיה cùng số năm diễn tả tuổi của A-đam vào lúc sinh người con được nói đến; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ đúng quan hệ thời gian.
- source_word: אָדָם
  choice: A-đam
  rationale: Ở đây אָדָם là tên riêng của người đứng đầu mục gia phả, không phải danh từ chung chỉ loài người.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: một trăm ba mươi tuổi
  rationale: Chuyển chính xác con số 130 và dùng cách nói tuổi thông dụng trong tiếng Việt.
- source_word: וַיּוֹלֶד
  choice: sinh một con trai
  rationale: Hiphil của ילד với chủ thể nam có nghĩa là sinh ra/làm cha. Tiếng Việt thường dùng 'sinh một con trai'; danh từ 'con trai' được bổ sung theo ngữ cảnh Sết được đặt tên ngay sau đó.
- source_word: בִּדְמוּתוֹ
  choice: giống như mình
  rationale: דמות chỉ sự tương đồng hoặc giống nhau. Cách dịch này rõ nghĩa, tự nhiên và vẫn duy trì tiếng vọng với Sáng Thế Ký 1:26.
- source_word: כְּצַלְמוֹ
  choice: theo hình ảnh mình
  rationale: Giữ riêng thuật ngữ צלם là 'hình ảnh' và biểu đạt tiền tố כ bằng 'theo', không đồng nhất cụm này với דמות.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: và đặt tên là Sết
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ Hê-bơ-rơ nghĩa đen là 'gọi tên của nó là Sết'.
- source_word: שֵׁת
  choice: Sết
  rationale: Phiên âm tên riêng theo lối dùng Kinh Thánh tiếng Việt quen thuộc.
theological_decisions:
- issue: Mối liên hệ giữa người con của A-đam với sự giống và hình ảnh của A-đam
  choice: Dịch thẳng là người con giống A-đam và theo hình ảnh A-đam, đồng thời giữ hai thuật ngữ tương ứng riêng biệt.
  alternative: Diễn giải câu này như khẳng định hình ảnh Đức Chúa Trời đã bị suy giảm hoặc mất đi sau sự sa ngã.
  rationale: Cách diễn đạt cố ý gợi lại Sáng Thế Ký 1:26–27, nhưng chính câu này không giải thích hệ quả thần học của mối liên hệ ấy. Bản dịch giữ nguyên tiếng vọng và sự căng thẳng thần học thay vì quyết định thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc tuổi tự nhiên trong tiếng Việt; giữ riêng 'giống' và 'hình ảnh' để phản ánh hai danh từ Hê-bơ-rơ và tiếng vọng liên văn bản.
