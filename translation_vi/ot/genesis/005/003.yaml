- from: Khi A-đam được một trăm ba mươi tuổi, ông sinh một con trai giống như mình[a], theo hình ảnh mình[b], và đặt tên là Sết.
  to: A-đam sống một trăm ba mươi năm, rồi sinh được một con trai giống như mình, theo hình ảnh mình, và đặt tên con là Sết.
  rationale: Sửa cách diễn đạt về hành động làm cha cho tự nhiên và chính xác hơn trong tiếng Việt hiện đại; sửa chú thích a theo giới từ Hê-bơ-rơ. Bản văn vẫn giữ trật tự, hai thuật ngữ riêng biệt, và tiếng vọng liên văn bản của nguyên văn, không áp đặt diễn giải thần học.
