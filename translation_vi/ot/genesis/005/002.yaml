  terminology: “Loài Người” bảo toàn cách hiểu tập thể của אָדָם trong ngữ cảnh cả nam lẫn nữ cùng mang một tên. Viết hoa có thể được giữ vì đây là tên gọi được đặt; chú thích cần được chỉnh thành câu tiếng Việt tự nhiên hơn và duy trì khả năng đọc là tên riêng A-đam.
