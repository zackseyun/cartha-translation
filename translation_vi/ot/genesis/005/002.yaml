source:
  edition: WLC
  text: זָכָ֥ר וּ/נְקֵבָ֖ה בְּרָאָ֑/ם וַ/יְבָ֣רֶךְ אֹתָ֗/ם וַ/יִּקְרָ֤א אֶת שְׁמָ/ם֙ אָדָ֔ם בְּ/י֖וֹם הִבָּֽרְאָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: vi
  text: Ngài tạo dựng họ, cả nam lẫn nữ; Ngài ban phước cho họ và gọi tên chung của họ là Loài Người[a] vào ngày họ được tạo dựng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ʾadam có thể chỉ “con người” hoặc “loài người” theo nghĩa tập thể; đồng thời cũng là tên riêng A-đam.
    reason: alternative_reading
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: có nam có nữ
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ cặp thuật ngữ chỉ giới tính “nam” và “nữ” của nguyên văn.
- source_word: בְּרָאָם
  choice: Ngài sáng tạo họ
  rationale: Động từ Qal hoàn thành với hậu tố số nhiều chỉ hành động sáng tạo của Đức Chúa Trời đối với cả hai; “sáng tạo” phù hợp văn mạch tạo dựng.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: ban phước cho họ
  rationale: Cách dịch quen thuộc, trang trọng và trực tiếp của ברך trong văn mạch này.
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: gọi tên chung của họ là
  rationale: Giữ ý nguyên văn rằng cả hai được gọi bằng một tên số ít; thêm “chung” làm rõ cấu trúc và ý nghĩa tập thể một cách tự nhiên trong tiếng Việt.
- source_word: אָדָם
  choice: Loài Người
  rationale: Trong câu này từ ấy bao gồm cả nam lẫn nữ, nên nghĩa tập thể “loài người” là chính; viết hoa để phản ánh chức năng đặt tên, trong khi chú thích bảo tồn khả năng đọc là “A-đam”.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: vào ngày họ được sáng tạo
  rationale: Giữ hình ảnh thời gian “vào ngày” và thể bị động của động từ Hebrew.
theological_decisions:
- issue: Nghĩa của אָדָם khi một tên được áp dụng cho cả người nam và người nữ
  choice: Loài Người
  alternative: A-đam
  rationale: Văn cảnh trực tiếp nói về cả nam lẫn nữ và cho họ một tên chung, vì vậy nghĩa tập thể được đặt trong chính văn. Tuy nhiên, cùng một dạng Hebrew cũng là tên riêng A-đam trong gia phả, nên khả năng ấy được ghi ở chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch quy chiếu về Đức Chúa Trời từ câu trước; cấu trúc “có nam có nữ” tự nhiên hơn lối dịch rập khuôn nhưng vẫn giữ sự đối xứng của nguyên văn. Dấu chú thích [a] xuất hiện ngay sau thuật ngữ có tính đa nghĩa.
