  text: וַֽ/יְחִ֣י מְתוּשֶׁ֗לַח אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת לֶ֔מֶךְ שְׁתַּ֤יִם וּ/שְׁמוֹנִים֙ שָׁנָ֔ה וּ/שְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/026.yaml
  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: vi
  text: Sau khi Mê-tu-sê-la làm cha của Lê-méc, ông sống thêm 782 năm và có các con trai lẫn con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, động từ חיה chỉ quãng đời tiếp tục sau khi người con được nêu tên ra đời; “sống thêm” diễn đạt tự nhiên và làm rõ quan hệ thời gian với “sau khi”.
- source_word: מְתוּשֶׁלַח
  choice: Mê-tu-sê-la
  rationale: Phiên âm tên riêng theo lối quen dùng, dễ đọc trong tiếng Việt.
- source_word: אַחֲרֵי
  choice: sau khi
  rationale: Giới từ thời gian đánh dấu giai đoạn tiếp sau việc sinh Lê-méc.
- source_word: הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: sinh Lê-méc
  rationale: Dạng Hiphil của ילד nói về việc Mê-tu-sê-la sinh ra hay làm cha của Lê-méc. Trong công thức gia phả tiếng Việt, “sinh” vừa tự nhiên vừa giữ được quan hệ cha-con theo ngữ cảnh.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 782 năm
  rationale: Cụm số Hê-bơ-rơ có tổng là 782; dùng chữ số giúp câu gia phả gọn và rõ mà không mất ý nghĩa.
- source_word: וַיּוֹלֶד
  choice: và sinh
  rationale: Giữ nhất quán với động từ ילד ở đầu câu; cách nói này tự nhiên trong văn gia phả tiếng Việt.
- source_word: בָּנִים וּבָנוֹת
  choice: con trai, con gái
  rationale: Bản Hê-bơ-rơ nêu rõ cả con trai lẫn con gái; giữ hai thành phần thay vì khái quát thành “các con”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích, phù hợp công thức gia phả. Dùng “sống thêm” để tránh cảm giác 782 năm là toàn bộ tuổi thọ, và dùng “sinh” theo cách diễn đạt gia phả quen thuộc trong tiếng Việt.
