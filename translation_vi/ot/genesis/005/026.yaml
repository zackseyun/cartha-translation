  naturalness: Câu hiện tại nhìn chung gọn, nhưng cụm mở đầu «Sau khi sinh Lê-méc, Mê-tu-sê-la...» tạo liên kết chủ ngữ khiến cách hiểu Mê-tu-sê-la trực tiếp sinh nở càng nổi bật. «Làm cha của» và «có các con trai lẫn con gái» tự nhiên, rõ nghĩa trong văn phong gia phả hiện đại.
