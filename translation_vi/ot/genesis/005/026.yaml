  to: Sau khi Mê-tu-sê-la làm cha của Lê-méc, ông sống thêm 782 năm và có các con trai lẫn con gái.
  rationale: Đổi «sinh» thành «làm cha của» ở mệnh đề đầu để phản ánh chính xác quan hệ do Hiphil của ילד diễn đạt và tránh nghĩa sinh nở của người mẹ. Đổi vế cuối thành «có các con trai lẫn con gái» để câu tiếng Việt tự nhiên, đồng thời vẫn nêu rõ hai nhóm con như bản Hê-bơ-rơ. «Sống thêm» được giữ vì diễn tả quãng đời sau khi Lê-méc ra đời.
