source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: vi
  text: 'Ông đặt tên cho con là Nô-ê[a] và nói: “Đứa con này sẽ an ủi chúng ta về công việc và sự nhọc nhằn của đôi tay chúng ta, do đất mà Đức Giê-hô-va đã nguyền rủa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên “Nô-ê” gợi liên tưởng đến sự nghỉ ngơi. Động từ dịch là “an ủi” thuộc một từ Hê-bơ-rơ khác, nghĩa là an ủi hoặc làm khuây khỏa; câu này có lối chơi chữ theo âm giữa tên và động từ ấy.
    reason: Bảo tồn lối chơi chữ của tiếng Hê-bơ-rơ, đồng thời phân biệt nghĩa từ vựng của động từ “an ủi” với liên tưởng về sự nghỉ ngơi trong tên Nô-ê.
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: Ông đặt tên cho con là
  rationale: Diễn đạt tự nhiên công thức đặt tên trong tiếng Việt, đồng thời giữ chủ thể nam số ít và đối tượng là người con theo ngữ cảnh.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: זֶה
  choice: Đứa con này
  rationale: Làm rõ sở chỉ của đại từ chỉ định mà không làm thay đổi ý nghĩa; phù hợp lời người cha nói về trẻ sơ sinh.
- source_word: יְנַחֲמֵנוּ
  choice: sẽ an ủi chúng ta
  rationale: Phản ánh trực tiếp nghĩa thông thường của động từ נחם là an ủi; mối liên hệ âm thanh với tên Nô-ê và ý niệm nghỉ ngơi/khuây khỏa được giữ trong chú thích.
- source_word: מִמַּעֲשֵׂנוּ וּמֵעִצְּבוֹן יָדֵינוּ
  choice: trong công việc và nỗi nhọc nhằn của đôi tay chúng ta
  rationale: Trong tiếng Việt, “an ủi khỏi công việc” không tự nhiên; “trong” truyền đạt sự an ủi giữa cảnh lao động và nhọc nhằn, còn “của đôi tay” giữ hình ảnh Hê-bơ-rơ.
- source_word: מִן־הָאֲדָמָה
  choice: vì đất
  rationale: Ở đây cụm giới từ có thể chỉ nguồn hoặc nguyên nhân của nỗi nhọc nhằn. “Vì đất” tạo quan hệ tự nhiên trong tiếng Việt với mệnh đề nguyền rủa, nhưng không loại bỏ hoàn toàn sắc thái lao nhọc phát sinh từ đất.
- source_word: אֲשֶׁר אֵרְרָהּ
  choice: mà ... đã nguyền rủa
  rationale: Giữ mệnh đề quan hệ bổ nghĩa cho đất và thể hoàn thành của động từ.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng giao ước đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Lối chơi chữ giữa tên נֹחַ và động từ יְנַחֲמֵנוּ
  choice: Thân bài dùng “sẽ an ủi chúng ta”; chú thích nêu liên hệ với nghỉ ngơi/khuây khỏa.
  alternative: sẽ cho chúng ta được nghỉ ngơi; sẽ đem lại khuây khỏa cho chúng ta
  rationale: Động từ trong câu thuộc gốc נחם, thường có nghĩa an ủi, chứ không phải chính động từ “nghỉ”. Tuy vậy, lời đặt tên tạo liên tưởng âm thanh với Nô-ê và ý niệm nghỉ ngơi; chú thích bảo tồn cả nghĩa từ vựng lẫn lối chơi chữ mà không đồng nhất chúng.
- issue: Quan hệ của מִן־הָאֲדָמָה với sự lao nhọc
  choice: Dịch “vì đất mà Đức Giê-hô-va đã nguyền rủa”.
  alternative: từ đất mà Đức Giê-hô-va đã nguyền rủa
  rationale: Giới từ מִן có thể được hiểu là nguồn phát sinh hoặc nguyên nhân. “Vì đất” tự nhiên hơn trong tiếng Việt và nối sự nhọc nhằn với lời nguyền trong Sáng Thế Ký 3, nhưng vẫn giữ đất là căn nguyên của hoàn cảnh ấy.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Đứa con này” dễ hiểu đối với độc giả phổ thông; “nỗi nhọc nhằn của đôi tay” giữ hình ảnh nguyên văn mà vẫn tự nhiên. Dùng “Đức Giê-hô-va” nhất quán như một danh riêng.
