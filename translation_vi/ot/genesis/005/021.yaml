  text: Enoch lived sixty-five years and fathered Methuselah.
translation:
  language: vi
  text: Hê-nóc sống được sáu mươi lăm tuổi, rồi làm cha của Mê-tu-sê-la.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được ... tuổi
  rationale: Trong công thức gia phả, động từ חיה nêu quãng đời tính đến lúc sinh người con được nhắc đến; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: חֲנוֹךְ
  choice: Hê-nóc
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc và dễ đọc trong tiếng Việt.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: sáu mươi lăm tuổi
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách nói tự nhiên của tiếng Việt và dùng “tuổi” để diễn đạt tuổi đời.
- source_word: וַיּוֹלֶד
  choice: thì sinh
  rationale: Với chủ ngữ nam trong gia phả, ילד chỉ việc sinh ra hoặc làm cha của một người con; “sinh” ngắn gọn, tự nhiên và giữ được công thức gia phả.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ trực tiếp trong tiếng Hê-bơ-rơ, không có từ tương ứng cần biểu đạt riêng trong tiếng Việt.
- source_word: מְתוּשָׁלַח
  choice: Mê-tu-sê-la
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo dạng rõ ràng, dễ đọc trong tiếng Việt.
theological_decisions: []
