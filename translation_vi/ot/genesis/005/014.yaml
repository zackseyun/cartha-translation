    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: Tổng cộng, số ngày ... là
  rationale: Diễn đạt tự nhiên công thức tổng kết gia phả, đồng thời giữ hình ảnh nguyên văn “tất cả những ngày” qua cụm “số ngày”.
- source_word: קֵינָן
  choice: Kê-nan
  rationale: Phiên âm trực tiếp dạng tên Hê-bơ-rơ, có dấu và gạch nối để người Việt dễ đọc.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: chín trăm mười năm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách nói tự nhiên trong tiếng Việt.
- source_word: וַיָּמֹת
  choice: rồi ông qua đời
  rationale: “Rồi” tiếp nối trình tự của công thức gia phả; “qua đời” là cách diễn đạt trang trọng, rõ nghĩa trong tiếng Việt hiện đại.
