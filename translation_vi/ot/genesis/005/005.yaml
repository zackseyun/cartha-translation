  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: vi
  text: Tổng số năm A-đam đã sống là chín trăm ba mươi năm[a], và ông chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ, A-đam cũng có thể có nghĩa là “người” hoặc “loài người” trong một số văn cảnh; nhưng tại đây, từ này chỉ cá nhân A-đam trong gia phả.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: Tổng số ngày ... sống là
  rationale: Diễn đạt tự nhiên công thức tổng kết gia phả, đồng thời giữ hình ảnh Hê-bơ-rơ tính đời người bằng “ngày”.
- source_word: אָדָם
  choice: A-đam
  rationale: Trong văn cảnh gia phả, từ này là tên riêng chỉ cá nhân A-đam, không phải danh từ chung “người” hay “loài người”.
- source_word: אֲשֶׁר חַי
  choice: sống
  rationale: Gộp mệnh đề quan hệ vào cấu trúc tiếng Việt “Tổng số ngày ... sống” để câu rõ ràng, tự nhiên mà không làm thay đổi nghĩa.
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: chín trăm ba mươi năm
  rationale: Viết số bằng chữ phù hợp văn phong trang trọng của gia phả và phản ánh đầy đủ con số trong nguyên văn.
- source_word: וַיָּמֹת
  choice: rồi ông qua đời
  rationale: “Qua đời” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt; “rồi” thể hiện diễn tiến của waw kể chuyện mà không giải thích thêm nguyên nhân hay ý nghĩa thần học.
theological_decisions:
- issue: Nghĩa của אָדָם
  choice: A-đam, tên riêng
  alternative: người / loài người
  rationale: Cấu trúc gia phả và việc tổng kết tuổi thọ xác định đây là cá nhân mang tên A-đam; dịch thành danh từ chung sẽ làm mờ đối tượng được nhắc đến.
- issue: Giữ công thức về sự chết
  choice: rồi ông qua đời
  alternative: và ông chết
  rationale: Bản dịch vẫn giữ nguyên lời kết luận rõ ràng về cái chết và nhịp lặp của gia phả, nhưng dùng cách nói trang trọng, tự nhiên trong tiếng Việt hiện đại.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ thành ngữ “số ngày” để bảo tồn công thức gia phả Hê-bơ-rơ; dùng cách viết tên Kinh Thánh quen thuộc “A-đam”.
