    rationale: Nguyên ngữ dùng thành ngữ “mọi ngày ... đã sống” để chỉ toàn bộ đời sống, rồi nêu tổng số theo năm. Dịch sát mặt chữ như bản nháp gây gượng và dễ gây khó hiểu trong tiếng Việt. “Tổng số năm ... đã sống” chuyển đúng nghĩa của công thức trong tiếng Việt tự nhiên.
  - severity: medium
    issue: “Rồi ông qua đời” làm uyển ngữ hóa động từ וַיָּמֹת.
    rationale: Nguyên văn dùng động từ trực tiếp “và ông chết”, là lời kết có tính công thức và nhấn mạnh sự chết trong gia phả. “Và ông chết” giữ sắc thái này tốt hơn; “rồi” cũng thêm một sắc thái trình tự không cần thiết.
