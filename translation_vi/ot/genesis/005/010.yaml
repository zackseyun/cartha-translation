  terminology: «Ê-nốt» và «Kê-nan» nhất quán với dạng phiên âm đã chọn. «Sinh» trong ngữ cảnh gia phả với chủ ngữ là Ê-nốt có thể dùng cho hành vi làm cha; không cần đưa vào một cách diễn đạt nặng nề hơn. Không có thuật ngữ thần học hoặc dị bản nào đòi hỏi chú thích.
