  text: וַֽ/יְחִ֣י אֱנ֗וֹשׁ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת קֵינָ֔ן חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi sinh Kê-nan, Ê-nốt sống thêm tám trăm mười lăm năm và sinh các con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, động từ חיה diễn tả quãng đời tiếp tục sau khi sinh người con được nêu; “sống thêm” là tự nhiên trong tiếng Việt và làm rõ quan hệ thời gian với אַחֲרֵי.
- source_word: אֱנוֹשׁ
  choice: Ê-nốt
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc, đồng thời dựa trên tên Hê-bơ-rơ Enosh.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת קֵינָן
  choice: Sau khi sinh Kê-nan
  rationale: Diễn đạt tự nhiên mệnh đề thời gian; Hiphil của ילד trong ngữ cảnh gia phả chỉ việc làm cha/sinh ra, và tiếng Việt có thể dùng “sinh” cho người cha khi chủ thể đã rõ.
- source_word: קֵינָן
  choice: Kê-nan
  rationale: Phiên âm trực tiếp dạng Hê-bơ-rơ Kenan, thay vì dạng truyền thống chịu ảnh hưởng Hy Lạp là Cainan.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: tám trăm mười lăm năm
  rationale: Chuyển trật tự cộng 15 + 800 của tiếng Hê-bơ-rơ sang cách nói số tự nhiên trong tiếng Việt mà vẫn giữ nguyên tổng thời gian.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: và sinh các con trai, con gái
  rationale: Giữ rõ hai nhóm hậu duệ nam và nữ được bản Hê-bơ-rơ nêu, thay vì khái quát thành “các con”.
