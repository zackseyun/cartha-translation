  source_fidelity: Bản dịch truyền đạt đúng trình tự thời gian, quan hệ “vợ của chủ Giô-sép,” sự chú ý mang tính ham muốn qua thành ngữ, và lời mời tình dục trực tiếp. Tuy nhiên, “chàng” không có trong nguyên văn và làm mờ tên Giô-sép; vị trí ký hiệu chú thích hiện cũng không gắn trực tiếp với cách dịch thành ngữ cần chú thích.
