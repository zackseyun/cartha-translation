  terminology: Giữ “Giô-sép” theo dạng tên Kinh Thánh tiếng Việt đã chọn. “Vợ của chủ Giô-sép” giữ đúng chuỗi sở thuộc. “Nằm với ta” bảo toàn tính trực tiếp và hàm ý tình dục của lời nói nguồn.
