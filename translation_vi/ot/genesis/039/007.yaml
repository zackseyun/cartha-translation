base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/007.yaml
  text: And after these things[a], his master's wife cast her eyes on Joseph and said, “Lie with me.”
translation:
  language: vi
  text: 'Sau những việc ấy, vợ của chủ Giô-sép để mắt đến Giô-sép[a] và nói: “Hãy nằm với ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “ngước mắt về phía Giô-sép”; trong ngữ cảnh, đây là cách nói diễn tả sự chú ý đầy ham muốn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sau những việc ấy
  rationale: Cụm từ Hê-bơ-rơ mở ra một diễn biến xảy đến sau các sự việc vừa thuật lại. Cách dịch này giữ sát cấu trúc nguồn mà vẫn tự nhiên trong lời kể tiếng Việt.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: để mắt đến
  rationale: Nghĩa đen là “ngước mắt về phía”, nhưng trong ngữ cảnh diễn tả sự chú ý có ham muốn. “Để mắt đến” truyền đạt sắc thái ấy mà không diễn giải quá mức.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: vợ của chủ Giô-sép
  rationale: Chuỗi sở thuộc xác định người phụ nữ qua quan hệ với chủ của Giô-sép. Cách diễn đạt này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt và giữ nhất quán cho nhân vật.
- source_word: שִׁכְבָה עִמִּי
  choice: Hãy nằm với ta
  rationale: Mệnh lệnh cùng giới từ là một lời đề nghị tình dục trực tiếp. “Nằm với” giữ được cách nói của nguyên văn và sắc thái thẳng thừng, còn đại từ “ta” phù hợp tương quan địa vị trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ lời đề nghị trực tiếp nhưng không thô tục; dùng “chàng” để tránh lặp tên ngay sau cụm “chủ Giô-sép” và dùng “ta” để phản ánh địa vị của người vợ chủ nhà.
