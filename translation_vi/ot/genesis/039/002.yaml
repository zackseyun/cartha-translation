  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַ/יְהִ֕י בְּ/בֵ֥ית אֲדֹנָ֖י/ו הַ/מִּצְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: vi
  text: Yahweh ở cùng Giô-sép; ông là một người thành công[a], và ông ở trong nhà của chủ mình, là người Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một người thịnh đạt.” Phân từ Hê-bơ-rơ có thể chỉ người đang hanh thông hoặc thành công.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu, để giữ đúng tên được dùng trong bản Hê-bơ-rơ.
- source_word: אֶת יוֹסֵף
  choice: ở cùng Giô-sép
  rationale: Cấu trúc này diễn tả sự hiện diện và phù trợ của Yahweh đối với Giô-sép; “Giô-sép” là dạng tên quen dùng trong tiếng Việt.
- source_word: אִישׁ מַצְלִיחַ
  choice: một người thành công
  rationale: Diễn đạt tự nhiên ý một người đang thành công, hanh thông trong công việc; không thu hẹp nghĩa vào sự giàu có về tiền bạc.
- source_word: בְּבֵית אֲדֹנָיו
  choice: ở trong nhà của chủ mình
  rationale: Giữ hình ảnh cụ thể “trong nhà” và dùng “chủ” để phản ánh quan hệ quyền hành của người chủ đối với Giô-sép trong bối cảnh này.
- source_word: הַמִּצְרִי
  choice: một người Ai Cập
  rationale: Đặt thành thành phần đồng vị sau “chủ mình”, vừa tự nhiên trong tiếng Việt vừa giữ cách xác định người chủ là người Ai Cập.
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: ở ... trở thành ... ở
  rationale: Giữ chuỗi trạng thái của câu Hê-bơ-rơ; “trở thành” diễn đạt tự nhiên sự tiến triển trong hoàn cảnh của Giô-sép.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giữ mối liên hệ chặt giữa sự hiện diện của Yahweh và hoàn cảnh thành công của Giô-sép mà không biến quan hệ ấy thành một mệnh đề nhân quả được nói rõ hơn nguyên văn.
