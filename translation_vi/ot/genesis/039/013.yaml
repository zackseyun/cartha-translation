  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: vi
  text: Và khi bà thấy ông đã bỏ lại chiếc áo của ông trong tay bà và chạy trốn ra ngoài,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Và
  rationale: Trong mạch kể chuyện, וַיְהִי chuyển tiếp sang mệnh đề thời gian; tiếng Việt tự nhiên chỉ cần “Và khi,” thay vì diễn đạt nặng nề “Và chuyện xảy ra là khi.”
- source_word: כִּרְאוֹתָהּ
  choice: khi bà thấy
  rationale: 'כְּ kết hợp với động từ nguyên mẫu ראה và hậu tố ngôi 3 giống cái số ít mang nghĩa thời gian: “khi bà thấy.”'
- source_word: כִּי
  choice: '[rằng] (được thể hiện bằng cấu trúc trực tiếp sau “thấy”)'
  rationale: כִּי dẫn nội dung bà nhận thấy. Tiếng Việt thường lược “rằng” sau “thấy,” nên câu vẫn rõ và tự nhiên.
- source_word: עָזַב
  choice: đã để ... lại
  rationale: Trong ngữ cảnh này, עזב chỉ việc bỏ lại vật đang mặc; “đã để ... lại” thể hiện hành động xảy ra trước lúc bà nhận thấy mà không hàm ý từ bỏ vĩnh viễn.
- source_word: בִּגְדוֹ
  choice: áo mình
  rationale: בֶּגֶד là từ khái quát chỉ áo hoặc y phục, không nhất thiết là áo choàng. “Áo” tự nhiên trong tiếng Việt và không đặc định quá mức; “mình” quy chiếu về chủ thể nam của hành động.
- source_word: בְּיָדָהּ
  choice: trong tay bà
  rationale: Giữ nguyên hình ảnh cụ thể của tiếng Hê-bơ-rơ và phù hợp với cách nói tiếng Việt.
- source_word: וַיָּנָס
  choice: rồi chạy trốn
  rationale: נוּס diễn tả việc chạy thoát; “chạy trốn” giữ được tính khẩn cấp. “Rồi” thể hiện sự tiếp nối của hai hành động trong nội dung bà nhận thấy.
- source_word: הַחוּצָה
  choice: ra ngoài
  rationale: Hậu tố chỉ hướng הָ־ biểu thị chuyển động hướng ra ngoài; “ra ngoài” truyền đạt đầy đủ phương hướng ấy.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” cho người phụ nữ đã có chồng và “chàng” cho Giô-sép để giữ mạch quy chiếu tự nhiên; không thêm diễn giải thần học. Câu kết bằng dấu phẩy vì câu Hê-bơ-rơ tiếp tục sang câu kế tiếp.
