  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: vi
  text: Giô-sép được ông quý mến và hầu việc ông. Ông đặt Giô-sép cai quản nhà mình và trao mọi thứ mình có vào tay Giô-sép.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “trao vào tay Giô-sép”; đây là thành ngữ chỉ việc giao cho Giô-sép quyền quản lý và trông coi.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא יוֹסֵף חֵן בְּעֵינָיו
  choice: Giô-sép được ông quý mến
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “Giô-sép tìm được ân huệ trong mắt ông.” Cách dịch “được ông quý mến” diễn đạt tự nhiên sự đánh giá và thiện cảm của Phô-ti-pha trong văn kể hiện đại, không gán sắc thái thần học không cần thiết cho חֵן.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: và hầu việc ông
  rationale: Động từ שׁרת ở đây chỉ việc Giô-sép trực tiếp phục vụ Phô-ti-pha; “hầu việc” vừa trang trọng vừa phù hợp với quan hệ gia nhân–chủ nhân.
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: Ông đặt Giô-sép cai quản nhà mình
  rationale: Dạng động từ này diễn tả việc bổ nhiệm và giao trách nhiệm trông coi. Lặp lại tên Giô-sép giúp câu tiếng Việt rõ đối tượng được giao quyền, trong khi “ông” vẫn phản ánh chủ ngữ đại từ của nguyên văn.
- source_word: בֵּיתוֹ
  choice: nhà mình
  rationale: בַּיִת có thể bao gồm cả nhà, gia nhân và cơ nghiệp thuộc hộ gia đình. “Nhà mình” giữ hình ảnh nguyên ngữ và trong ngữ cảnh vẫn có nghĩa rộng là cả gia thất.
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: mọi thứ mình có
  rationale: Cách diễn đạt bao quát toàn bộ tài sản và những gì thuộc quyền sở hữu của Phô-ti-pha, tương ứng với cấu trúc khái quát của tiếng Hê-bơ-rơ.
- source_word: נָתַן בְּיָדוֹ
  choice: trao vào tay chàng
  rationale: Giữ hình ảnh “tay” của nguyên văn, đồng thời chú thích nghĩa thành ngữ là giao cho Giô-sép quyền quản lý và chăm nom.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho Phô-ti-pha và “chàng” cho Giô-sép để phân biệt hai nhân vật tự nhiên hơn trong tiếng Việt; lặp tên Giô-sép ở mệnh đề bổ nhiệm nhằm tránh chuỗi đại từ khó hiểu. Bản dịch giữ hình ảnh “trao vào tay” nhưng giải thích thành ngữ bằng chú thích.
