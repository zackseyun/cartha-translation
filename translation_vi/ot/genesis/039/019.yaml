  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: vi
  text: 'Khi người chủ của chàng nghe những lời vợ mình nói với ông rằng: “Nô lệ[b] của ông đã làm những chuyện như thế này[a] với tôi,” thì cơn giận của ông bừng lên.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ cũng có thể hiểu là “theo những lời này,” tức là phù hợp với lời tố cáo mà người vợ vừa kể.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “đầy tớ.” Từ Hê-bơ-rơ עבד có thể mang cả hai nghĩa; “nô lệ” phù hợp hơn với địa vị của Giô-sép trong nhà này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Khi ... thì
  rationale: Trong mạch kể chuyện, cấu trúc này dẫn vào sự việc kế tiếp. Tiếng Việt tự nhiên có thể gộp sắc thái chuyển tiếp vào kết cấu thời gian “Khi ... thì” mà không cần dịch máy móc là “Và chuyện xảy ra rằng”.
- source_word: כִשְׁמֹעַ
  choice: khi ... nghe
  rationale: כְּ đi với động từ nguyên mẫu שמע biểu thị hoàn cảnh thời gian; “khi ... nghe” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: אֲדֹנָיו
  choice: người chủ của chàng
  rationale: Danh từ chỉ chủ của Giô-sép trong quan hệ gia chủ và nô lệ. “Người chủ” đúng ngữ cảnh; “của chàng” giữ đại từ số ít nam mà không thêm tên riêng vào nguyên văn.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: những lời vợ mình nói với ông
  rationale: Giữ danh từ “những lời” và mệnh đề quan hệ của tiếng Hê-bơ-rơ, đồng thời dùng đại từ tiếng Việt để cho thấy người vợ nói với chính người chủ.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Đây là động từ nguyên mẫu dùng để dẫn lời; “rằng” đưa vào lời trích dẫn tự nhiên trong tiếng Việt.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: những chuyện như thế này
  rationale: Cách dịch này giữ cả sắc thái so sánh/phân loại của כְּ và lực chỉ định của הָאֵלֶּה. Chú thích nêu khả năng hiểu theo nội dung những lời tố cáo vừa thuật lại.
- source_word: עָשָׂה לִי
  choice: đã làm ... với tôi
  rationale: Giữ nghĩa thông thường của עשה và giới từ לְ, không diễn giải mạnh hơn thành “làm hại” hay “chống lại”.
- source_word: עַבְדְּךָ
  choice: nô lệ của ông
  rationale: עבד có thể là “đầy tớ” hoặc “nô lệ”; trong bối cảnh Giô-sép thuộc quyền sở hữu của gia chủ, “nô lệ” diễn tả chính xác địa vị bị ràng buộc.
- source_word: וַיִּחַר אַפּוֹ
  choice: cơn giận ông bừng lên
  rationale: Giữ hình ảnh cơn giận bốc cháy trong thành ngữ Hê-bơ-rơ, đồng thời dùng cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại.
