  terminology: '“Người chủ,” “nô lệ,” và “cơn giận ... bừng lên” nhất quán với bối cảnh và không áp đặt diễn giải thần học. Các chú thích được gắn đúng vị trí: [b] với “Nô lệ” và [a] với cụm chỉ định trong lời tố cáo.'
