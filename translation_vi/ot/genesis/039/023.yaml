source:
  edition: WLC
  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: vi
  text: Người đứng đầu nhà tù không phải bận tâm đến bất cứ việc gì được giao cho Giô-sép phụ trách[a], vì Yahweh ở cùng ông; bất cứ việc gì Giô-sép làm, Yahweh đều khiến cho thành công.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong tay ông ấy”, một thành ngữ chỉ những gì được giao cho Giô-sép quản lý.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Yahweh đều làm cho được thịnh đạt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: người đứng đầu nhà tù
  rationale: שַׂר chỉ người đứng đầu hay viên chức có thẩm quyền, còn בֵּית הַסֹּהַר là nhà tù. Cách dịch này giữ rõ vai trò quản lý và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: không phải bận tâm đến bất cứ việc gì
  rationale: Trong ngữ cảnh, lối nói này không chỉ có nghĩa đen là “không thấy gì” mà diễn tả việc người đứng đầu nhà tù không cần kiểm tra hoặc lo liệu những việc đã giao cho Giô-sép.
- source_word: בְּיָדוֹ
  choice: được giao cho Giô-sép phụ trách
  rationale: Nghĩa đen là “trong tay ông ấy”, một thành ngữ chỉ điều được trao vào quyền quản lý. Nêu tên Giô-sép làm rõ sở chỉ của đại từ trong tiếng Việt mà vẫn giữ đúng ý của ngữ cảnh.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: vì Yahweh ở cùng ông
  rationale: בַּאֲשֶׁר mang ý nguyên nhân tại đây; “vì” diễn đạt tự nhiên lý do người đứng đầu nhà tù hoàn toàn tin cậy Giô-sép.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: bất cứ việc gì Giô-sép làm
  rationale: Mệnh đề quan hệ này bao quát mọi việc Giô-sép thực hiện. Việc nêu tên Giô-sép tránh đại từ tiếng Việt bị hiểu nhầm là chỉ người đứng đầu nhà tù.
- source_word: מַצְלִיחַ
  choice: khiến cho thành công
  rationale: 'Dạng Hiphil của צלח có ý nguyên nhân: Yahweh làm cho những việc Giô-sép thực hiện đạt kết quả tốt. “Khiến cho thành công” giữ rõ tác nhân và sắc thái nguyên nhân.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng YHWH thay vì thay thế bằng một tước hiệu, qua đó phản ánh trực tiếp danh Đức Chúa Trời trong bản Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng danh riêng יהוה. “Yahweh” bảo tồn danh ấy dưới dạng chuyển tự, không thay bằng tước hiệu và không áp đặt một cách đọc mang tính hệ phái.
- issue: Tác nhân đem lại thành công
  choice: Yahweh đều khiến cho thành công
  alternative: mọi việc đều thành công
  rationale: Dạng động từ nguyên nhân מַצְלִיחַ nêu Yahweh là Đấng làm cho công việc thành công; bản dịch giữ rõ điểm thần học và ngữ pháp này thay vì biến nó thành kết quả tự phát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người đứng đầu nhà tù” thể hiện địa vị hành chính rõ hơn “lính canh”; “không phải bận tâm” chuyển tải đúng chức năng của thành ngữ Hê-bơ-rơ. Tên Giô-sép được lặp lại để tránh sự mơ hồ không tự nhiên của đại từ tiếng Việt.
