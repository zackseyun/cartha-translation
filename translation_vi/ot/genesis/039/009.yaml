- from: “Trong nhà này không ai lớn hơn tôi[a]. Ông ấy chẳng giữ lại thứ gì không cho tôi, ngoại trừ bà, vì bà là vợ ông ấy. Vậy làm sao tôi có thể làm điều đại ác này[b] mà phạm tội với Đức Chúa Trời?”
  to: “Trong nhà này không ai lớn hơn tôi[a]. Ông ấy không hề từ chối tôi điều gì, ngoại trừ bà, vì bà là vợ ông ấy. Vậy làm sao tôi có thể làm điều ác lớn này[b] mà phạm tội chống lại Đức Chúa Trời?”
  rationale: Bản sửa thay các cụm chưa tự nhiên bằng cách diễn đạt tiếng Việt hiện đại, đồng thời làm rõ rằng tội lỗi hướng chống lại Đức Chúa Trời. Trật tự lập luận, mức độ luân lý của «điều ác lớn này», và tính ngoại lệ của người vợ đều được giữ nguyên. Các ký hiệu chú thích vẫn được đặt đúng sau mệnh đề về địa vị và sau cụm chỉ điều ác.
