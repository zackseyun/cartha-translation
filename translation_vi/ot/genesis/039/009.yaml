  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: vi
  text: “Trong nhà này không ai lớn hơn tôi[a]. Ông ấy không hề từ chối tôi điều gì, ngoại trừ bà, vì bà là vợ ông ấy. Vậy làm sao tôi có thể làm điều ác lớn này[b] mà phạm tội chống lại Đức Chúa Trời?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Không một ai trong nhà này lớn hơn tôi.” Trong văn cảnh, “lớn hơn” nói về địa vị và thẩm quyền.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự gian ác lớn lao này” hoặc “điều sai trái nghiêm trọng này.” Từ Hê-bơ-rơ רָעָה có thể chỉ điều ác, sự gian ác hoặc điều sai trái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: Trong nhà này không ai lớn hơn tôi
  rationale: Cấu trúc אֵין phủ định sự hiện hữu của bất kỳ người nào lớn hơn Giô-sép trong phạm vi ngôi nhà. Cách dịch này giữ lối diễn đạt của tiếng Hê-bơ-rơ và, trong văn cảnh, nói về địa vị cùng thẩm quyền quản lý.
- source_word: בַּבַּיִת הַזֶּה
  choice: trong nhà này
  rationale: בַּיִת có thể chỉ ngôi nhà hoặc toàn bộ gia đình/cơ nghiệp. “Nhà này” tự nhiên trong tiếng Việt và vẫn giữ được độ rộng nghĩa của nguyên văn.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: chẳng giữ lại thứ gì không cho tôi
  rationale: חָשַׂךְ mang nghĩa giữ lại hoặc không trao; với từ phủ định מְאוּמָה, mệnh đề có nghĩa ông chủ không giữ lại bất cứ thứ gì khỏi Giô-sép.
- source_word: כִּי אִם אוֹתָךְ
  choice: ngoại trừ bà
  rationale: כִּי אִם sau một mệnh đề phủ định đánh dấu ngoại lệ. Đại từ “bà” phù hợp với việc Giô-sép kính cẩn nói với vợ chủ mình.
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: vì bà là vợ ông ấy
  rationale: Cụm từ nêu lý do bà là ngoại lệ; “vì” truyền đạt rõ quan hệ nguyên nhân trong tiếng Việt hiện đại.
- source_word: וְאֵיךְ אֶעֱשֶׂה
  choice: Vậy làm sao tôi có thể làm
  rationale: וְאֵיךְ dẫn vào kết luận luân lý từ những điều vừa nói. “Vậy” diễn đạt sắc thái suy luận, còn “làm” bám sát động từ thông dụng עשה.
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: điều đại ác này
  rationale: רָעָה có thể là điều ác, sự gian ác hoặc điều sai trái. “Điều đại ác này” giữ sức nặng luân lý, mức độ lớn và yếu tố chỉ định của nguyên văn.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: mà phạm tội với Đức Chúa Trời
  rationale: חטא với ל ở đây diễn tả phạm tội chống lại hay xúc phạm đến Đức Chúa Trời. “Phạm tội với” là cách nói tự nhiên trong tiếng Việt và tránh cấu trúc cứng.
theological_decisions:
- issue: Đối tượng được gọi là אֱלֹהִים trong lời Giô-sép
  choice: Đức Chúa Trời
  alternative: một vị thần
  rationale: Trong mạch truyện Sáng Thế Ký, Giô-sép quy chiếu đến Đức Chúa Trời mà ông thờ phượng; lời ông cũng xác định hành vi này là tội trước mặt Ngài, chứ không chỉ là sự xúc phạm xã hội.
- issue: Tính chất của hành vi được diễn tả bằng רָעָה
  choice: điều đại ác
  alternative: sự gian ác lớn lao; điều sai trái nghiêm trọng
  rationale: Bản dịch giữ nguyên phán đoán luân lý mạnh của nguyên văn mà không thu hẹp hành vi vào một phạm trù giáo lý riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “tôi—bà—ông ấy” phản ánh quan hệ giữa Giô-sép, vợ chủ và chủ nhà mà không thêm danh xưng không có trong câu Hê-bơ-rơ. “Điều đại ác” có sắc thái trang trọng vừa phải, phù hợp sức nặng của lời từ chối.
