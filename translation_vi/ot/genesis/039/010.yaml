language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Joseph day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: vi
  text: Và khi nàng nói với Giô-sép ngày này qua ngày khác, chàng vẫn không nghe theo nàng, không nằm bên nàng hay ở cùng nàng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nằm với nàng.” Trong ngữ cảnh này, tiếng Hê-bơ-rơ có thể mang nghĩa tình dục; “nằm bên nàng” giữ cách diễn đạt của nguyên văn, đồng thời để cụm từ tiếp theo, “ở cùng nàng,” giữ sắc thái riêng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Và khi
  rationale: Trong mạch kể chuyện, וַיְהִי mở ra diễn biến tiếp theo và kết hợp với mệnh đề thời gian כְּדַבְּרָהּ. Cách dịch gọn này giữ chức năng trần thuật mà không dùng lối nói cổ hoặc nặng nề như “và chuyện xảy ra là”.
- source_word: כְּדַבְּרָהּ
  choice: khi nàng nói
  rationale: Tiền tố כְּ ở đây mang nghĩa thời gian; ý lặp đi lặp lại được biểu đạt rõ bởi יוֹם יוֹם ở ngay sau.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Đây là dạng tên quen dùng và dễ nhận biết đối với độc giả Kinh Thánh tiếng Việt hiện đại.
- source_word: יוֹם יוֹם
  choice: ngày này qua ngày khác
  rationale: Danh từ được lặp lại diễn tả hành động liên tục, dai dẳng; cách nói này tự nhiên trong tiếng Việt và giữ sắc thái ấy.
- source_word: שָׁמַע אֵלֶיהָ
  choice: không nghe theo nàng
  rationale: שׁמע đi với אֶל có thể chỉ việc nghe, chú ý hoặc làm theo. “Nghe theo” tự nhiên trong ngữ cảnh Giô-sép khước từ lời dụ dỗ, nhưng không thu hẹp thành một thuật ngữ riêng về sự vâng phục.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: để nằm bên nàng
  rationale: שׁכב có thể chỉ việc nằm xuống và trong ngữ cảnh này có hàm ý tình dục; אֵצֶל mang nghĩa ở bên/cạnh. “Nằm bên nàng” giữ hình ảnh không gian của nguyên văn và để ngỏ hàm ý tình dục.
- source_word: לִהְיוֹת עִמָּהּ
  choice: hay ở cùng nàng
  rationale: היה עם có nghĩa rộng là ở với hoặc ở cùng ai. Cách dịch này giữ sự phân biệt với mệnh đề “nằm bên nàng” và có thể bao gồm cả việc tránh ở gần nàng.
theological_decisions:
- issue: Mức độ minh thị của hàm ý tình dục trong לִשְׁכַּב אֶצְלָהּ
  choice: Giữ cách nói “nằm bên nàng” trong chính văn và nêu nghĩa tình dục ở chú thích.
  alternative: Dịch thẳng là “ăn nằm với nàng” hoặc “nằm với nàng”.
  rationale: Bối cảnh rõ ràng mang tính tình dục, nhưng אֵצֶל có nghĩa không gian là “bên/cạnh”, còn mệnh đề kế tiếp “ở cùng nàng” vẫn có lực riêng. Cách dịch được chọn bảo tồn cả hàm ý lẫn cấu trúc căng mở của nguyên văn.
translation_notes:
  register: Văn phong trần thuật hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nàng/chàng” để theo dõi hai nhân vật tự nhiên, tránh lặp tên và tránh đại từ quá khẩu ngữ. Từ “vẫn” làm rõ sự khước từ bền bỉ trước lời dụ dỗ lặp lại hằng ngày; quan hệ đối lập vốn thể hiện qua וְלֹא được chuyển thành sắc thái này trong tiếng Việt.
