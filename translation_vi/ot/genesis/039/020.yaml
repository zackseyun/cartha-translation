base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: vi
  text: Vậy, người chủ của Giô-sép đem ông bỏ vào nhà tù[a], nơi các tù nhân của vua bị giam giữ[b]. Ông ở đó trong nhà tù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “nhà của sohar”; sohar được cho là một thuật ngữ có nguồn gốc Ai Cập, chỉ nhà tù hoặc nơi giam giữ.
    reason: cultural_note
  - marker: b
    text: 'Tiếng Hê-bơ-rơ lặp lại căn từ có nghĩa “trói/giam”: theo nghĩa đen, “nơi những người bị giam của vua bị giam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: chủ của Giô-sép
  rationale: Trong bối cảnh này, אֲדֹנֵי chỉ người chủ phàm trần của Giô-sép, không phải tước hiệu dành cho Đức Chúa Trời. “Chủ” tự nhiên và phù hợp với hoàn cảnh nô lệ trong gia đình.
- source_word: וַיִּקַּח
  choice: bắt
  rationale: לקח có nghĩa cơ bản là “lấy, đem”; khi người chủ đưa Giô-sép đi giam, “bắt” truyền đạt tự nhiên hành động cưỡng chế nhưng không nhấn mạnh quá mức như “tóm bắt”.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: tống vào
  rationale: נתן kết hợp với אֶל ở đây diễn tả việc đưa một người vào một địa điểm. “Tống vào” là cách nói hiện đại, tự nhiên trong ngữ cảnh bỏ tù và thể hiện sự cưỡng chế vốn có trong tình huống.
- source_word: בֵּית הַסֹּהַר
  choice: nhà tù
  rationale: Cụm từ theo nghĩa đen là “nhà của sohar”; trong ngữ cảnh, nó rõ ràng chỉ nơi giam giữ. “Nhà tù” là tương đương tiếng Việt tự nhiên, đồng thời giữ hình ảnh “nhà” tốt hơn chỉ nói “tù”.
- source_word: מְקוֹם אֲשֶׁר
  choice: nơi
  rationale: “Nơi” giữ chức năng đồng vị giải thích của cụm Hê-bơ-rơ mà không tạo câu tiếng Việt nặng nề.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: các tù nhân của vua bị giam giữ
  rationale: 'Nguyên văn lặp căn אסר: những người bị trói/giam của vua bị trói/giam. Bản dịch giữ cả danh từ “tù nhân” và vị ngữ “bị giam giữ”, qua đó phản ánh phần nào sự lặp có chủ ý mà vẫn tự nhiên.'
- source_word: וַיְהִי שָׁם
  choice: Ông ở đó
  rationale: היה với שָׁם nói đơn giản về sự hiện diện của Giô-sép tại đó; “ở đó” không thêm sắc thái kéo dài như “ở lại”.
- source_word: בְּבֵית הַסֹּהַר
  choice: trong nhà tù
  rationale: Giữ lại cụm địa điểm được lặp ở cuối câu, vì sự lặp này có trong tiếng Hê-bơ-rơ và nhấn mạnh hoàn cảnh giam cầm của Giô-sép.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng tên quen thuộc “Giô-sép”. Hai dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong chính văn. Câu cuối giữ sự lặp “nhà tù” của nguyên văn.
