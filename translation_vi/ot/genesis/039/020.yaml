- from: Vậy, chủ của Giô-sép bắt ông và tống vào nhà tù[a], nơi các tù nhân của vua bị giam giữ[b]. Ông ở đó, trong nhà tù.
  to: Vậy, người chủ của Giô-sép đem ông bỏ vào nhà tù[a], nơi các tù nhân của vua bị giam giữ[b]. Ông ở đó trong nhà tù.
  rationale: Sửa các động từ để không thêm mức độ cưỡng chế vượt quá nguyên văn, đồng thời duy trì rõ ràng việc Giô-sép bị bỏ tù theo ngữ cảnh. Giữ “nhà tù” ở cả hai lần để phản ánh sự lặp của בֵּית הַסֹּהַר, và giữ hai neo chú thích tại đúng các cụm có liên quan.
