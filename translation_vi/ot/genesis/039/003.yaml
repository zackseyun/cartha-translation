  text: וַ/יַּ֣רְא אֲדֹנָ֔י/ו כִּ֥י יְהוָ֖ה אִתּ֑/וֹ וְ/כֹל֙ אֲשֶׁר ה֣וּא עֹשֶׂ֔ה יְהוָ֖ה מַצְלִ֥יחַ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: vi
  text: Chủ của Giô-sép thấy rằng Yahweh ở cùng ông, và Yahweh khiến mọi việc ông làm[a] đều thành công.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “qua tay ông” hoặc “dưới sự điều hành của ông”; tiếng Hê-bơ-rơ dịch sát là “trong tay ông”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Động từ ראה ở thể tự sự mang nghĩa trực tiếp là “thấy”; trong ngữ cảnh cũng hàm ý nhận ra qua những điều quan sát được, nhưng không cần diễn giải thêm.
- source_word: אֲדֹנָיו
  choice: chủ của Giô-sép
  rationale: Chỉ Phô-ti-pha trong quan hệ chủ–đầy tớ. Nêu tên Giô-sép giúp tránh sự mơ hồ do hệ thống đại từ tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự Danh, thay vì thay bằng một tước hiệu.
- source_word: אִתּוֹ
  choice: ở cùng chàng
  rationale: Diễn đạt tự nhiên sự hiện diện của Yahweh với Giô-sép; “chàng” phù hợp với lối kể chuyện trang trọng mà vẫn dễ hiểu.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: mọi việc chàng làm
  rationale: Truyền đạt đầy đủ phạm vi bao quát của cụm Hê-bơ-rơ bằng cách nói tự nhiên trong tiếng Việt.
- source_word: מַצְלִיחַ
  choice: khiến thành công
  rationale: Dạng Hiphil của צלח có ý nghĩa gây khiến, nên cách dịch này giữ rõ Yahweh là tác nhân ban sự thành công.
- source_word: בְּיָדוֹ
  choice: trong tay chàng
  rationale: Giữ hình ảnh cụ thể và sự mơ hồ của nguyên văn “trong tay người ấy”, thay vì quyết định dứt khoát rằng cụm này chỉ phương tiện hay phạm vi quản lý.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của בְּיָדוֹ
  choice: giữ “trong tay chàng” trong chính văn
  alternative: qua tay chàng; dưới sự điều hành của chàng
  rationale: Cách dịch sát giữ được hình ảnh Hê-bơ-rơ và không loại bỏ khả năng cụm từ nói về phương tiện, quyền quản lý hoặc phạm vi hoạt động.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “chàng” cho Giô-sép để phân biệt với người chủ và tránh lặp tên quá nhiều; trật tự mệnh đề cuối hơi mang sắc thái Hê-bơ-rơ nhằm giữ rõ tác nhân Yahweh cùng thành ngữ “trong tay chàng”.
