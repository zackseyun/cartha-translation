    rationale: Trong tiếng Việt, “khiến thành công” thường cần đối tượng được khiến thành công; vị trí “trong tay chàng” sau đó không diễn đạt thành ngữ בְּיָדוֹ một cách rõ ràng. Đưa nghĩa thành ngữ vào cách nói “mọi việc ông làm” và chú thích nghĩa đen bảo toàn ý nghĩa mà không tạo cú pháp gượng.
  - severity: low
