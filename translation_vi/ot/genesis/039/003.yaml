review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: chủ của Giô-sép nhận thấy sự hiện diện của Yahweh với ông và sự thành công Yahweh ban cho công việc của ông. Tuy nhiên, cụm “khiến thành công trong tay chàng” đặt thành ngữ Hê-bơ-rơ vào tiếng Việt theo cách không tự nhiên và làm quan hệ cú pháp của “trong tay chàng” kém rõ.'
  naturalness: “Chàng” có sắc thái văn chương cũ và câu cuối gượng trong tiếng Việt hiện đại. Dùng “ông” cho Giô-sép trong lời kể trung tính, cùng cấu trúc “khiến mọi việc ông làm đều thành công,” tự nhiên và vẫn trang trọng.
  terminology: Giữ “Yahweh” theo quyết định về Tứ Tự Danh. “Chủ của Giô-sép” phù hợp với bối cảnh quan hệ chủ–nô lệ mà không thêm diễn giải. Chú thích cần được neo tại cụm “ông làm,” nơi nó giải thích thành ngữ cuối câu Hê-bơ-rơ.
  issues:
