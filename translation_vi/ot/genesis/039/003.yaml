  to: Chủ của Giô-sép thấy rằng Yahweh ở cùng ông, và Yahweh khiến mọi việc ông làm[a] đều thành công.
  rationale: Bản sửa dùng cú pháp Việt hiện đại, tự nhiên hơn, đồng thời giữ Yahweh là tác nhân trực tiếp khiến công việc của Giô-sép thành công. Thành ngữ בְּיָדוֹ không bị áp đặt vào chính văn theo cách gượng; nghĩa đen và các khả năng diễn đạt của nó được giữ trong chú thích, neo đúng vị trí.
