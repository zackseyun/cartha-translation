  text: So she kept his garment beside her until his master came home.
translation:
  language: vi
  text: Và bà để áo của chàng ở bên mình cho đến khi chủ của chàng về nhà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: bà giữ
  rationale: Trong ngữ cảnh, động từ נוח ở dạng Hifil diễn tả việc bà để lại và giữ chiếc áo tại chỗ; “giữ” tự nhiên trong tiếng Việt và phù hợp với hành động lưu vật chứng.
- source_word: בִּגְדוֹ
  choice: áo của chàng
  rationale: בֶּגֶד có thể chỉ áo hoặc y phục; “áo” phù hợp với vật bị nắm và bỏ lại trong mạch truyện.
- source_word: אֶצְלָהּ
  choice: bên mình
  rationale: Giữ nghĩa không gian “ở bên bà” đồng thời diễn đạt tự nhiên việc bà giữ chiếc áo trong tay mình.
- source_word: אֲדֹנָיו
  choice: chủ của chàng
  rationale: Đại từ hậu tố chỉ chủ của Giô-sép; “chủ” bảo toàn quan hệ chủ–đầy tớ trong câu.
- source_word: אֶל־בֵּיתוֹ
  choice: về nhà
  rationale: Nghĩa đen là “vào/đến nhà mình”; trong tiếng Việt, “về nhà” diễn đạt tự nhiên việc người chủ trở lại nhà mà không làm thay đổi nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà/chàng” để nối tự nhiên với các nhân vật đã được xác định trong văn cảnh; câu không thêm cách giải thích động cơ.
