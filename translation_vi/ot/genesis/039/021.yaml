source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: vi
  text: Nhưng Đức Giê-hô-va ở cùng Giô-sép, bày tỏ lòng nhân từ với ông[a], và khiến ông được người đứng đầu nhà tù ưu ái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bày tỏ tình yêu bền vững với ông” hoặc “bày tỏ lòng thành tín với ông.” Từ Hê-bơ-rơ חָסֶד có thể chỉ lòng nhân từ, tình yêu bền vững, lòng trung thành hoặc sự thành tín.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu; thêm “Đức” để phù hợp với cách xưng gọi trang trọng tự nhiên.
- source_word: וַיְהִי ... אֶת
  choice: ở cùng
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ sự hiện diện và đồng hành, đồng thời giữ công thức lặp lại trong câu chuyện Giô-sép.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: tỏ lòng nhân từ thành tín với ông
  rationale: “Tỏ ... với” chuyển đạt tự nhiên thành ngữ có động từ נָטָה; “nhân từ thành tín” giữ cả sắc thái ân hậu lẫn lòng trung thành bền vững của חָסֶד mà không khẳng định quá mức rằng câu này trực tiếp nói đến một giao ước chính thức.
- source_word: חִנּוֹ בְּעֵינֵי
  choice: khiến ông được ... ưu ái
  rationale: Chuyển thành ngữ “ban ơn của ông trong mắt...” sang tiếng Việt hiện đại, rõ nghĩa; vẫn giữ Đức Giê-hô-va là tác nhân làm cho Giô-sép nhận được thiện cảm.
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: người đứng đầu nhà tù
  rationale: Phản ánh trực tiếp chức vụ của שַׂר trong cụm sở hữu, đồng thời tự nhiên và dễ hiểu hơn cách dịch sát chữ “quan trưởng của nhà tù”.
- source_word: וַ
  choice: Nhưng
  rationale: Nêu bật sự tương phản giữa việc Giô-sép bị giam trong văn cảnh trước đó và việc Đức Giê-hô-va vẫn ở cùng ông.
theological_decisions:
- issue: Sắc thái của חָסֶד
  choice: lòng nhân từ thành tín
  alternative: lòng thương xót bền vững; lòng nhân từ
  rationale: Cách dịch chính giữ chiều sâu về sự tận tâm, trung thành và ân hậu, nhưng không thêm từ “giao ước” khi giao ước không được nói rõ trong câu.
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Hằng Hữu
  rationale: Giữ đây là danh riêng theo văn bản Hê-bơ-rơ, bằng dạng phiên âm quen thuộc với độc giả tiếng Việt, thay vì âm thầm đổi thành một tước hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” cho Giô-sép để tránh lối kể cổ; “người đứng đầu nhà tù” rõ chức năng mà không áp đặt một chức danh hành chính hiện đại quá cụ thể.
