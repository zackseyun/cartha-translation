base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/018.yaml
  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: vi
  text: Khi tôi cất tiếng kêu lên, người ấy bỏ y phục[a] của mình lại bên tôi rồi chạy trốn ra ngoài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “áo choàng”. Từ Hê-bơ-rơ בֶּגֶד chỉ chung một y phục/trang phục và không xác định rõ loại nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: Khi tôi cất
  rationale: Cấu trúc וַיְהִי với כַּהֲרִימִי mở đầu mệnh đề thời gian. Trong tiếng Việt, “khi tôi cất tiếng” diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “nâng giọng” mà vẫn giữ diễn tiến của câu chuyện.
- source_word: קוֹלִי וָאֶקְרָא
  choice: tiếng kêu lên
  rationale: קוֹלִי là “tiếng/giọng của tôi,” còn קרא trong ngữ cảnh báo động là “kêu lên.” Cụm “cất tiếng kêu lên” truyền đạt tiếng kêu khẩn cấp mà không xác định quá mức âm lượng.
- source_word: וַיַּעֲזֹב
  choice: bỏ ... lại
  rationale: עזב ở đây chỉ việc để vật ở lại khi bỏ chạy. “Bỏ ... lại” tự nhiên và chính xác trong tiếng Việt.
- source_word: בִּגְדוֹ
  choice: áo
  rationale: בֶּגֶד là danh từ chung chỉ y phục. “Áo” là cách gọi tự nhiên, đủ rộng trong tiếng Việt và không tự ý xác định đó là áo choàng hay lễ phục.
- source_word: אֶצְלִי
  choice: bên tôi
  rationale: אצל diễn tả vị trí gần hoặc bên cạnh. “Bên tôi” giữ sắc thái không gian và tránh hàm ý sở hữu rõ hơn của “với tôi.”
- source_word: וַיָּנָס הַחוּצָה
  choice: rồi chạy trốn ra ngoài
  rationale: נוס có nghĩa là chạy trốn; הַחוּצָה mang hướng chuyển động ra phía ngoài. “Chạy trốn ra ngoài” giữ cả tính khẩn cấp lẫn hướng đi.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, tự nhiên và trang trọng vừa phải. Đại từ “hắn” phù hợp lời buộc tội của người vợ đối với Giô-sép trong ngữ cảnh, đồng thời không bổ sung nội dung thần học. Không thêm chú thích vì “áo” trong tiếng Việt đã có thể hoạt động như một từ chỉ y phục tương đối khái quát; bản văn Hê-bơ-rơ không xác định loại áo.
