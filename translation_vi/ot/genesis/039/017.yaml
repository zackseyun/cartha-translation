translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘nô lệ’ để phản ánh đúng địa vị xã hội; giữ sự mơ hồ có chủ ý của צחק bằng bản dịch chính và chú thích. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
