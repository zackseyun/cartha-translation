revisions:
- from: 'Rồi bà nói với chồng những lời như thế này: “Tên nô lệ người Hê-bơ-rơ mà ông đem về cho chúng ta đã đến gần tôi để giễu cợt tôi[a].”'
  to: 'Rồi bà nói với ông ấy bằng những lời như thế này: “Người nô lệ Hê-bơ-rơ mà ông đã đem đến cho chúng ta đã đến chỗ tôi để giễu cợt tôi[a].”'
  rationale: Sửa các chỗ bổ sung sắc thái không có trong nguyên văn, đồng thời giữ đại từ, đại từ số nhiều «chúng ta», địa vị «nô lệ», và tính đa nghĩa có chủ ý của động từ צחק. Chú thích tiếp tục đặt ngay tại cụm từ được giải thích.
