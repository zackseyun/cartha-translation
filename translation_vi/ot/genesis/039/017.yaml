  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: vi
  text: 'Rồi bà nói với ông ấy bằng những lời như thế này: “Người nô lệ Hê-bơ-rơ mà ông đã đem đến cho chúng ta đã đến chỗ tôi để giễu cợt tôi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để lấy tôi làm trò”; trong ngữ cảnh, cụm từ này có thể mang hàm ý tình dục hoặc hành vi xâm phạm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: Rồi bà nói với chồng
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện. Đại từ ‘với ông ấy’ chỉ người chồng trong ngữ cảnh; tiếng Việt tự nhiên cần làm rõ đối tượng để tránh nhầm với Giô-sép.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: những lời như thế này
  rationale: Giữ sắc thái so sánh của כְּ và chức năng dẫn vào nội dung lời thuật lại.
- source_word: הָעֶבֶד הָעִבְרִי
  choice: tên nô lệ người Hê-bơ-rơ
  rationale: ‘Nô lệ’ phản ánh địa vị lệ thuộc của עֶבֶד chính xác hơn ‘đầy tớ’; ‘tên’ chuyển tải giọng miệt thị trong lời buộc tội mà không biến thành tên riêng.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: mà ông đem về cho chúng ta
  rationale: Giữ lời quy trách hướng đến người chồng và đại từ số nhiều ‘chúng ta’; ‘đem về’ tự nhiên trong bối cảnh gia hộ.
- source_word: בָּא אֵלַי
  choice: đã đến gần tôi
  rationale: Diễn đạt chuyển động hướng đến bà; tránh dùng một thành ngữ có thể tự nó khẳng định quan hệ tình dục mạnh hơn nguyên văn.
- source_word: לְצַחֶק בִּי
  choice: để giễu cợt tôi
  rationale: צחק với giới từ בְּ có thể chỉ chế nhạo hoặc lấy ai làm trò; trong ngữ cảnh lời cáo buộc có hàm ý tình dục hay xâm phạm, nhưng câu chính không nên giải quyết dứt khoát sự đa nghĩa ấy.
