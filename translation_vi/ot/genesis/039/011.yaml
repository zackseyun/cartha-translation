base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: vi
  text: Một ngày kia[a], Giô-sép vào nhà để làm công việc của mình, và không một người đàn ông nào thuộc nhà ấy có mặt ở đó, trong nhà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “vào ngày như thế này.” Cách nói Hê-bơ-rơ có thể hiểu là “vào một dịp như thế” hoặc “một ngày kia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Một ngày kia
  rationale: Công thức kể chuyện mở đầu một biến cố tiếp theo. Trong tiếng Việt, cách diễn đạt này tự nhiên hơn lối dịch sát từng chữ như “Và đã xảy ra,” đồng thời kết hợp phù hợp với cụm thời gian theo sau.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: một ngày kia
  rationale: Trong văn cảnh, cụm này mang tính thành ngữ, chỉ một dịp cụ thể trong diễn tiến câu chuyện hơn là nhấn mạnh ngày theo lịch. Chú thích giữ lại nghĩa sát chữ và độ mở của cách nói Hê-bơ-rơ.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: Giô-sép vào nhà
  rationale: Động từ בוא cùng hậu tố chỉ hướng diễn tả chuyển động vào bên trong nhà. Dùng tên Giô-sép thay cho đại từ ngôi ba giúp câu tiếng Việt rõ chủ thể mà không thay đổi đối tượng được nói đến trong văn cảnh.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: để làm công việc của mình
  rationale: מְלָאכָה ở đây chỉ công việc hay nhiệm vụ thường ngày; “công việc của mình” là cách diễn đạt trực tiếp, tự nhiên và không suy đoán cụ thể đó là việc gì.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: không một người đàn ông nào thuộc nhà ấy có mặt
  rationale: Bản Hê-bơ-rơ nói rõ “người đàn ông,” vì vậy không khái quát thành “không một ai.” “Thuộc nhà ấy” giữ ý họ là những người thuộc gia hộ mà không mặc nhiên xác định họ là thân nhân hay tôi tớ.
- source_word: שָׁם בַּבָּיִת
  choice: ở đó trong nhà
  rationale: Giữ cả שָׁם (“ở đó”) lẫn בַּבָּיִת (“trong nhà”), phản ánh sự lặp lại có tính định vị và nhấn mạnh của nguyên văn, dù câu tiếng Việt vì thế mang sắc thái lặp nhẹ.
