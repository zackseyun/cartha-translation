  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến chính: Giô-sép đi vào nhà để làm công việc mình, và không có người đàn ông nào thuộc gia hộ ở trong nhà. Từ chỉ giới tính trong אִישׁ và sự lặp lại định vị של שָׁם בַּבַּיִת đều được dự liệu. Tuy nhiên, việc tách thành hai câu rồi thêm “Khi ấy” làm câu Việt hơi dư thừa và làm yếu liên kết trực tiếp của mệnh đề tường thuật Hê-bơ-rơ.'
