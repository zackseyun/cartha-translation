  terminology: “Giô-sép,” “công việc của mình,” và “người đàn ông nào thuộc nhà ấy” đều phù hợp, rõ nghĩa, và không áp đặt cách hiểu về địa vị của những người trong nhà. Chú thích phản ánh hợp lý tính thành ngữ và sự bất định diễn giải của cụm thời gian.
