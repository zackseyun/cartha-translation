source:
  edition: WLC
  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: vi
  text: Kể từ khi ông giao cho Giô-sép quản lý nhà mình và mọi thứ mình có[a], Yahweh ban phước cho nhà của người Ai Cập ấy vì Giô-sép. Phước lành của Yahweh ở trên mọi thứ ông có[b], trong nhà cũng như ngoài đồng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Từ đó trở đi, sau khi ông giao cho Giô-sép coi sóc nhà mình và mọi thứ mình có.”'
    reason: Ngữ đoạn מֵאָז הִפְקִיד có thể được diễn đạt như một mốc thời gian gắn trực tiếp với hành động trao quyền, hoặc như trạng thái bắt đầu từ đó trở đi.
  - marker: b
    text: 'Hay: “trên toàn bộ tài sản của ông, trong nhà và ngoài đồng.”'
    reason: Cụm “mọi thứ ông có” có thể được diễn đạt bằng danh từ khái quát “toàn bộ tài sản”; hai cụm cuối xác định phạm vi bao quát của tài sản ấy.
lexical_decisions:
- source_word: מֵאָז
  choice: Kể từ khi
  rationale: Diễn đạt tự nhiên mốc thời gian bắt đầu từ lúc Giô-sép được trao quyền quản lý, đồng thời giữ quan hệ thời gian của câu Hê-bơ-rơ.
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ
  choice: giao cho Giô-sép quản lý nhà mình và mọi thứ mình có
  rationale: Động từ Hiphil của פקד trong ngữ cảnh này chỉ việc trao trách nhiệm coi sóc. “Quản lý” truyền đạt rõ thẩm quyền hành chính; việc nêu “Giô-sép” giúp câu tiếng Việt sáng nghĩa mà không thay đổi đối tượng đã được xác định trong văn cảnh.
- source_word: וַיְבָרֶךְ
  choice: ban phước
  rationale: Giữ nghĩa trực tiếp của ברך và sự quy nguồn rõ ràng cho Đức Chúa Trời, thay vì chỉ diễn đạt kết quả là làm cho thịnh vượng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, không thay bằng một tước hiệu.
- source_word: בֵּית הַמִּצְרִי
  choice: nhà của người Ai Cập ấy
  rationale: Giữ hình ảnh cụ thể “nhà” và chỉ đúng Pô-ti-pha bằng cách diễn đạt tự nhiên trong tiếng Việt; “nhà” tại đây cũng có thể bao hàm gia hộ.
- source_word: בִּגְלַל יוֹסֵף
  choice: vì Giô-sép
  rationale: בגלל biểu thị nguyên nhân; cách dịch ngắn gọn này giữ nguyên ý rằng người Ai Cập được ban phước do Giô-sép.
- source_word: בִּרְכַּת יְהוָה
  choice: Phước lành của Yahweh
  rationale: Giữ cấu trúc sở hữu và việc phước lành được quy trực tiếp cho Yahweh.
- source_word: בְּכָל אֲשֶׁר יֶשׁ־לוֹ
  choice: ở trên mọi thứ ông có
  rationale: “Ở trên” phản ánh hình ảnh phước lành ngự trên toàn bộ tài sản, còn “mọi thứ ông có” bám sát phạm vi bao quát của nguyên văn.
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: trong nhà cũng như ngoài đồng
  rationale: Giữ hai phạm vi cụ thể của nguyên văn và diễn đạt tự nhiên phép toàn thể chỉ cả tài sản gia dụng lẫn nông nghiệp.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Nguồn của sự thịnh vượng trong nhà Pô-ti-pha
  choice: Yahweh ban phước ... vì Giô-sép
  alternative: Yahweh làm cho nhà người Ai Cập thịnh vượng nhờ Giô-sép
  rationale: Giữ động từ thần học “ban phước” và mối liên hệ nhân quả của nguyên văn, không thu hẹp phước lành thành thành công vật chất đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” theo chủ thể nam đã có trong văn cảnh; tên “Giô-sép” được nêu thay cho đại từ tân ngữ để tránh mơ hồ trong tiếng Việt. Giữ nhịp hai câu nhằm tránh một câu ghép quá dài, đồng thời bảo tồn tiến trình ý của nguyên văn.
