revisions:
- from: 'Bấy giờ, bà gọi những người đàn ông trong nhà đến và nói với họ: “Hãy xem! Ông ấy đã đưa một người Hê-bơ-rơ đến với chúng ta để giễu cợt chúng ta[a]. Hắn đến gần tôi để nằm với tôi[b], và tôi đã kêu thật lớn.”'
  to: 'Bấy giờ bà gọi những người đàn ông trong nhà và nói với họ: “Hãy xem! Ông ấy đã đưa một người Hê-bơ-rơ đến với chúng ta để giễu cợt chúng ta[a]. Hắn đã đến chỗ tôi để ăn nằm với tôi[b], và tôi đã kêu lớn tiếng.”'
  rationale: 'Bản sửa làm rõ hai thành ngữ nguồn mà không thêm chi tiết: בָּא אֵלַי được dịch là “đã đến chỗ tôi,” còn לִשְׁכַּב עִמִּי là “để ăn nằm với tôi.” Đồng thời bỏ “đến” sau “gọi” để không gợi thêm hành động triệu tập. Nghĩa rộng, có thể gây nhục mang hàm ý tình dục của לְצַחֶק בָּנוּ được giữ nguyên cùng chú thích.'
  reviewer_model: gpt-5.6-terra
