  text: וַ/תִּקְרָ֞א לְ/אַנְשֵׁ֣י בֵיתָ֗/הּ וַ/תֹּ֤אמֶר לָ/הֶם֙ לֵ/אמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛/נוּ אִ֥ישׁ עִבְרִ֖י לְ/צַ֣חֶק בָּ֑/נוּ בָּ֤א אֵלַ/י֙ לִ/שְׁכַּ֣ב עִמִּ֔/י וָ/אֶקְרָ֖א בְּ/ק֥וֹל גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: vi
  text: 'Bấy giờ bà gọi những người đàn ông trong nhà và nói với họ: “Hãy xem! Ông ấy đã đưa một người Hê-bơ-rơ đến với chúng ta để giễu cợt chúng ta[a]. Hắn đã đến chỗ tôi để ăn nằm với tôi[b], và tôi đã kêu lớn tiếng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để cười nhạo chúng ta” hoặc “để đem chúng ta ra làm trò.” Động từ Hê-bơ-rơ có thể chỉ sự chế giễu hay hành vi làm nhục; trong lời tố cáo này, nó có thể mang hàm ý tình dục.
    reason: lexical_alternative
  - marker: b
    text: “Ăn nằm với” là thành ngữ chỉ việc quan hệ tình dục.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: Bấy giờ, bà gọi những người đàn ông trong nhà đến
  rationale: Wayyiqtol tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt trình tự tự nhiên. אַנְשֵׁי là danh từ số nhiều giống đực, nên giữ rõ “những người đàn ông”; בֵיתָהּ ở đây chỉ nhà hay gia nhân thuộc nhà bà.
- source_word: רְאוּ
  choice: Hãy xem!
  rationale: Mệnh lệnh dùng để lôi kéo sự chú ý của người nghe; cách nói này hiện đại mà vẫn giữ sắc thái thúc giục.
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: Ông ấy đã đưa một người Hê-bơ-rơ đến với chúng ta
  rationale: Hiphil của בוא mang nghĩa “đưa/đem đến”; לָנוּ được giữ bằng “đến với chúng ta”, phản ánh cách người phụ nữ lôi cả gia nhân vào lời tố cáo. אִישׁ עִבְרִי được dịch rõ là “một người Hê-bơ-rơ”.
- source_word: לְצַחֶק בָּנוּ
  choice: để giễu cợt chúng ta
  rationale: צחק trong cấu trúc này có thể chỉ cười nhạo, đem ai ra làm trò hoặc làm nhục. “Giễu cợt” giữ được nghĩa rộng và giọng tố cáo, không xác định quá mức sắc thái tình dục vốn chỉ do ngữ cảnh gợi ra.
- source_word: בָּא אֵלַי
  choice: Hắn đến gần tôi
  rationale: בוא אֶל có nghĩa là đến với hay tiến lại gần một người. “Đến gần tôi” tự nhiên trong tiếng Việt và phù hợp với lời cáo buộc; đại từ “hắn” thể hiện giọng miệt thị của người nói đối với Giô-sép.
- source_word: לִשְׁכַּב עִמִּי
  choice: để nằm với tôi
  rationale: Giữ sát thành ngữ Hê-bơ-rơ chỉ quan hệ tình dục, đồng thời tránh lối nói quá khẩu ngữ.
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: và tôi đã kêu thật lớn
  rationale: Giữ liên từ ו bằng “và”; “kêu thật lớn” diễn đạt tự nhiên hành động kêu la trong tình huống khẩn cấp và phản ánh בְּקוֹל גָּדוֹל.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Lời thoại giữ sắc thái kích động, miệt thị và lôi kéo sự đồng tình của những người trong nhà, nhưng không thêm các chi tiết ngoài bản Hê-bơ-rơ.
