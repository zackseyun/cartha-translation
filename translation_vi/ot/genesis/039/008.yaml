base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: vi
  text: 'Nhưng Giô-sép từ chối và nói với vợ của chủ tôi: “Này, chủ tôi không phải bận tâm đến những gì trong nhà[a], và ông đã giao vào tay tôi mọi thứ thuộc về ông[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ dịch sát: “chủ tôi không biết với tôi điều gì trong nhà”; đây là cách nói cho biết người chủ để Giô-sép trông coi các việc trong nhà và không trực tiếp bận tâm đến chúng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã giao phó cho tôi.” Hê-bơ-rơ dịch sát: “đã đặt vào tay tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: Nhưng Giô-sép từ chối
  rationale: Động từ có nghĩa là “từ chối”; liên từ “nhưng” thể hiện sự tương phản với lời đề nghị ở câu trước. Nêu tên Giô-sép giúp tiếng Việt tự nhiên và rõ chủ thể.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: và nói với vợ chủ mình
  rationale: Giữ đúng quan hệ sở hữu và địa vị trong gia đình, đồng thời diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: הֵן
  choice: Này
  rationale: Tiểu từ thu hút sự chú ý đến lời giải thích tiếp theo; “Này” trang trọng vừa phải và tự nhiên trong lời nói.
- source_word: אֲדֹנִי
  choice: chủ tôi
  rationale: Trong bối cảnh gia nhân, “chủ tôi” diễn đạt đúng quan hệ xã hội hơn “chúa tôi” và tránh sắc thái thần học không có trong câu.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: không cần bận tâm đến bất cứ việc gì trong nhà khi đã có tôi
  rationale: Cụm Hê-bơ-rơ dịch sát là “không biết với tôi điều gì trong nhà,” một lối nói khó hiểu nếu giữ nguyên. Bản dịch truyền đạt ý rằng vì Giô-sép quản lý nên người chủ không phải trực tiếp để tâm đến công việc trong nhà, đồng thời ghi chú nghĩa sát chữ.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: mọi thứ thuộc về ông
  rationale: Diễn đạt tự nhiên toàn bộ tài sản người chủ có.
- source_word: נָתַן בְּיָדִי
  choice: đã giao vào tay tôi
  rationale: Giữ hình ảnh cụ thể “vào tay tôi” của nguyên văn, đồng thời “giao” làm rõ ý trao quyền quản lý.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Giô-sép” để xác định chủ thể theo ngữ cảnh; giữ hình ảnh “vào tay tôi” của nguyên văn và dùng chú thích để bảo tồn nét mơ hồ của thành ngữ לֹא יָדַע אִתִּי.
