  text: And the chief of the prison put into Joseph’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: vi
  text: Viên quản ngục giao tất cả tù nhân trong ngục vào tay Giô-sép[a]. Mọi việc được làm tại đó đều do chính Giô-sép đảm trách[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ “vào tay Giô-sép” là một thành ngữ, có nghĩa là giao các tù nhân cho Giô-sép quản lý.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc dịch: “Mọi việc người ta làm tại đó, chính ông là người làm.” Câu Hê-bơ-rơ nhấn mạnh vai trò chủ động và trách nhiệm thường xuyên của Giô-sép đối với mọi hoạt động trong ngục.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: viên quản ngục
  rationale: Chỉ viên chức đứng đầu và phụ trách nhà tù; cách nói này tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: בְּיַד יוֹסֵף
  choice: vào tay Giô-sép
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, đồng thời ngữ cảnh cho thấy ý nghĩa là giao cho Giô-sép quản lý và chịu trách nhiệm.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: כָּל הָאֲסִירִם
  choice: tất cả tù nhân
  rationale: Diễn đạt trực tiếp những người bị giam giữ trong bối cảnh nhà tù.
- source_word: אֲשֶׁר בְּבֵית הַסֹּהַר
  choice: trong ngục
  rationale: Chuyển đạt tự nhiên mệnh đề xác định nơi các tù nhân đang bị giam.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: Mọi việc người ta làm tại đó
  rationale: Giữ dạng chủ động không xác định của phân từ số nhiều עֹשִׂים mà không gán một chủ thể cụ thể.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: chính Giô-sép là người lo liệu
  rationale: “Chính” phản ánh đại từ nhấn mạnh הוּא; “lo liệu” truyền đạt vai trò thực hiện, điều hành và chịu trách nhiệm thường xuyên trong ngữ cảnh, thay vì hàm ý ông tự tay làm từng việc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ thành ngữ “vào tay” vì hình ảnh này vẫn tự nhiên trong tiếng Việt, nhưng giải thích bằng chú thích. Tách thành hai câu để tránh câu ghép nặng nề và làm nổi bật trách nhiệm của Giô-sép.
