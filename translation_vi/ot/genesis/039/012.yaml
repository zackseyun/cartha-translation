base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: vi
  text: 'Bà nắm lấy áo[a] chàng và nói: “Hãy nằm với ta!”[b] Nhưng chàng bỏ áo chàng lại trong tay bà, rồi chạy trốn và ra ngoài.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây chỉ chung một món y phục; cũng có thể dịch là “áo choàng”.
    reason: lexical_alternative
  - marker: b
    text: “Nằm với ta” là lối nói giảm trong tiếng Hê-bơ-rơ để đề nghị quan hệ tình dục.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: Bà túm lấy
  rationale: Động từ תפשׂ diễn tả hành động nắm giữ chắc; “túm lấy” tự nhiên, sống động và phù hợp với hành động bất ngờ trong ngữ cảnh.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: áo chàng / áo mình
  rationale: בגד là từ khái quát chỉ một món y phục. “Áo” tự nhiên trong tiếng Việt và không xác định quá mức đó là áo choàng hay loại y phục cụ thể nào.
- source_word: לֵאמֹר
  choice: và nói
  rationale: Dạng nguyên mẫu này dẫn vào lời nói trực tiếp; chuyển thành “và nói” tạo câu kể tự nhiên trong tiếng Việt.
- source_word: שִׁכְבָה עִמִּי
  choice: Hãy nằm với ta!
  rationale: שׁכב đi với עִם là lối nói giảm chỉ quan hệ tình dục. “Nằm với ta” giữ được hình ảnh và sắc thái văn chương của nguyên ngữ.
- source_word: וַיַּעֲזֹב
  choice: để ... lại
  rationale: עזב ở đây nói đến việc Giô-sép bỏ lại y phục đang nằm trong tay người phụ nữ; “để ... lại” rõ ràng và tự nhiên.
- source_word: בְּיָדָהּ
  choice: trong tay bà
  rationale: Giữ nghĩa cụ thể của יָד, cho thấy chiếc áo vẫn ở ngay trong tay bà.
- source_word: וַיָּנָס
  choice: chạy trốn
  rationale: נוס diễn tả sự tháo chạy để thoát thân; “chạy trốn” giữ được tính khẩn cấp của hành động.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: và ra ngoài
  rationale: יצא kết hợp với החוצה chỉ sự di chuyển từ bên trong ra bên ngoài; cách dịch này giữ riêng động tác đi ra sau khi chạy trốn.
theological_decisions:
- issue: Tính chất tình dục của lời mời שִׁכְבָה עִמִּי
  choice: Giữ lối nói “Hãy nằm với ta!” và giải thích ở chú thích
  alternative: Dịch trực tiếp thành “Hãy ăn nằm với ta!”
  rationale: Nguyên ngữ dùng một lối nói giảm nhưng ngữ cảnh mang nghĩa tình dục rõ ràng. Bản dịch giữ hình thức văn chương và không làm thô hơn nguyên văn, còn chú thích giúp độc giả hiện đại hiểu đúng.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chàng” để chỉ Giô-sép và “bà” cho người phụ nữ, tránh lặp tên nhưng vẫn giữ quan hệ xã hội trong mạch truyện. Hai chú thích được đặt đúng ngay sau từ ngữ cần giải thích.
