base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: vi
  text: Vậy, ông giao mọi thứ mình có vào tay Giô-sép[a] và không bận tâm đến bất cứ điều gì Giô-sép quản lý, ngoại trừ thức ăn ông dùng[b]. Giô-sép có vóc dáng đẹp và diện mạo tuấn tú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “để mọi thứ mình có trong tay Giô-sép”; “tay” chỉ quyền quản lý hoặc sự phụ trách.'
    reason: hebrew_idiom
  - marker: b
    text: 'Nguyên văn: “bánh ông ăn”; ở đây “bánh” có lẽ chỉ thức ăn nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: ông giao
  rationale: Động từ עזב có nghĩa cơ bản là “để lại”; trong bối cảnh quản lý tài sản, “giao” diễn đạt tự nhiên việc Phô-ti-pha để mọi sự cho Giô-sép trông coi.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: mọi thứ mình có
  rationale: Diễn đạt phạm vi toàn bộ tài sản và công việc thuộc về Phô-ti-pha, đồng thời giữ cách nói rộng của nguyên văn.
- source_word: בְּיַד יוֹסֵף
  choice: vào tay Giô-sép
  rationale: Giữ hình ảnh “tay” của tiếng Hê-bơ-rơ, chỉ sự quản lý và quyền phụ trách.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: không bận tâm đến bất cứ điều gì Giô-sép quản lý
  rationale: Cụm này sát chữ là “không biết gì với người ấy”; trong ngữ cảnh, nó nói Phô-ti-pha không phải để tâm hoặc theo dõi những việc Giô-sép phụ trách. Bản dịch diễn đạt nghĩa thành ngữ mà không làm câu tiếng Việt tối nghĩa.
- source_word: כִּי אִם
  choice: ngoại trừ
  rationale: Thể hiện rõ cấu trúc nêu ngoại lệ của nguyên văn.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: thức ăn ông dùng
  rationale: לֶחֶם nghĩa đen là “bánh”, nhưng thường chỉ thức ăn nói chung; “dùng” là cách nói tự nhiên về việc ăn uống trong văn phong trang trọng.
- source_word: וַיְהִי יוֹסֵף
  choice: Giô-sép có
  rationale: Ở đây cấu trúc này mô tả tình trạng của Giô-sép và chuyển sang chi tiết mở đầu cho diễn biến tiếp theo.
- source_word: יְפֵה תֹאַר
  choice: vóc dáng đẹp
  rationale: תֹאַר chỉ hình thể hoặc vóc dáng; cách dịch này phân biệt với diện mạo ở vế sau.
- source_word: וִיפֵה מַרְאֶה
  choice: diện mạo tuấn tú
  rationale: מַרְאֶה nhấn mạnh vẻ ngoài nhìn thấy được; “tuấn tú” tự nhiên khi mô tả vẻ đẹp của một người nam.
