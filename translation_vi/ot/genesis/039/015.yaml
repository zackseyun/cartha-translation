review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng diễn tiến chính, nhưng «tôi cất tiếng kêu lên» gộp và làm mờ hai yếu tố trong tiếng Hê-bơ-rơ: «cất/giơ cao giọng» và «kêu lên». Cần diễn đạt rõ hơn mà vẫn tự nhiên. «Áo của anh ta» cũng phản ánh rõ sở hữu cách của בִּגְדוֹ.'
  naturalness: Câu sửa vẫn giữ văn phong kể chuyện hiện đại, tự nhiên. «lớn tiếng kêu lên» là cách nói thông dụng, hàm cả việc nâng giọng và kêu lớn; «chạy trốn ra ngoài» diễn đạt trôi chảy chuỗi «trốn chạy và đi ra ngoài».
  terminology: «Áo» phù hợp với danh từ số ít בֶּגֶד trong ngữ cảnh. Không cần xác định loại áo hay thêm chi tiết về ngôi nhà. «Anh ta» phù hợp với ngữ cảnh lời thuật cáo buộc và không thêm diễn giải.
  issues:
  - severity: low
    issue: Cụm «cất tiếng kêu lên» chưa biểu đạt rõ yếu tố «cất cao/giơ cao giọng» của הֲרִימֹתִי קוֹלִי.
    rationale: 'Nguyên văn dùng hai động từ phối hợp: người nói đã nâng giọng mình và kêu lên. «Lớn tiếng kêu lên» giữ được cường độ của tiếng kêu trong tiếng Việt tự nhiên.'
  - severity: low
    issue: «Bỏ áo lại» không nói rõ chiếc áo thuộc về người đàn ông.
    rationale: בִּגְדוֹ có hậu tố sở hữu «áo của anh ta». Việc nêu rõ sở hữu giúp duy trì chi tiết nguồn mà không làm câu gượng.
  revised_text: Khi anh ta nghe tôi lớn tiếng kêu lên[a], anh ta liền bỏ lại áo của mình bên tôi[b], rồi chạy trốn ra ngoài.
