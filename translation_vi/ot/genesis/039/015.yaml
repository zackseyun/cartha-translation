base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/015.yaml
  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: vi
  text: Khi anh ta nghe tôi lớn tiếng kêu lên[a], anh ta liền bỏ lại áo của mình bên tôi[b], rồi chạy trốn ra ngoài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi cất cao giọng và kêu lên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để áo lại chỗ tôi” hoặc “để áo lại với tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: Khi anh ta nghe
  rationale: Công thức tự sự וַיְהִי kết hợp với כְּ và động từ nguyên mẫu tạo mệnh đề thời gian; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ trình tự sự việc.
- source_word: כִּי
  choice: '[hàm ý nội dung được nghe, không dịch riêng]'
  rationale: כִּי dẫn vào nội dung điều người ấy nghe. Trong tiếng Việt, bổ ngữ trực tiếp sau “nghe” tự nhiên hơn là thêm “rằng” trong câu này.
- source_word: הֲרִימֹתִי קוֹלִי וָאֶקְרָא
  choice: tôi cất tiếng kêu lên
  rationale: Cụm này diễn tả việc cất cao tiếng và kêu; cách dịch gọn, tự nhiên, truyền đạt sự khẩn cấp mà không xác định quá mức nội dung tiếng kêu.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: anh ta liền bỏ áo lại
  rationale: בֶּגֶד ở số ít chỉ chiếc áo/vật mặc đang được nhắc đến; “áo” tự nhiên trong ngữ cảnh tiếng Việt. “Liền” thể hiện diễn tiến tức thời của chuỗi động từ tự sự.
- source_word: אֶצְלִי
  choice: bên tôi
  rationale: Giữ nghĩa chỉ sự gần gũi/vị trí của אֶצְלִי, đồng thời không loại bỏ khả năng hiểu là “để lại chỗ tôi” hoặc “giao trong tay tôi”.
- source_word: וַיָּנָס
  choice: chạy trốn
  rationale: נוס diễn tả hành động bỏ chạy để thoát thân; “chạy trốn” rõ nghĩa và tự nhiên.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: và ra ngoài
  rationale: Diễn đạt tự nhiên hướng chuyển động ra phía ngoài mà không thêm địa điểm không có trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh ta” vì đây là lời người vợ thuật lại về Giô-sép với người nhà; giữ sắc thái tạo khoảng cách trong lời cáo buộc. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
