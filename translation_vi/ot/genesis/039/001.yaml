source:
  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: vi
  text: Giô-sép đã bị đưa xuống Ai Cập, và Pô-ti-pha, một quan chức[a] của Pha-ra-ôn, viên chỉ huy đội cận vệ, một người Ai Cập[b], đã mua ông từ những người Ích-ma-ên đã đưa ông xuống đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây có thể có nghĩa là “quan chức trong triều” hoặc “hoạn quan”.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “một người đàn ông Ai Cập”.'
    reason: literal_rendering
lexical_decisions:
- source_word: הוּרַד
  choice: đã bị đưa xuống
  rationale: Thể Hofal của ירד diễn tả việc Giô-sép bị người khác đưa xuống; “đã” cũng cho thấy việc này xảy ra trước khi Pô-ti-pha mua ông.
- source_word: מִצְרָיְמָה
  choice: xuống Ai Cập
  rationale: Hậu tố chỉ hướng diễn tả chuyển động đến Ai Cập; “xuống” đồng thời giữ được mô-típ lặp lại của động từ ירד trong câu.
- source_word: וַיִּקְנֵהוּ
  choice: đã mua Giô-sép
  rationale: Trong bối cảnh buôn bán nô lệ, קנה mang nghĩa trực tiếp là mua; lặp lại tên riêng giúp câu tiếng Việt rõ nghĩa hơn dùng một đại từ dễ mơ hồ.
- source_word: סְרִיס פַּרְעֹה
  choice: một quan chức của Pha-ra-ôn
  rationale: סְרִיס có thể chỉ quan chức hoàng gia hoặc hoạn quan. Nghĩa chức vụ phù hợp làm cách dịch chính, còn nghĩa sinh học được giữ trong chú thích.
- source_word: שַׂר הַטַּבָּחִים
  choice: chỉ huy đội cận vệ
  rationale: Cụm từ chỉ người đứng đầu một lực lượng hoàng gia có thể gồm thị vệ hoặc người thi hành án. Cách dịch này truyền đạt chức vụ rõ ràng mà không khẳng định quá mức sắc thái còn tranh luận.
- source_word: אִישׁ מִצְרִי
  choice: là người Ai Cập
  rationale: Cách nói tự nhiên trong tiếng Việt truyền đạt quốc tịch của Pô-ti-pha; nghĩa sát chữ có danh từ “người đàn ông” được ghi ở chú thích.
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: từ những người Ích-ma-ên
  rationale: Thành ngữ “từ tay” trong ngữ cảnh mua bán đơn giản có nghĩa là mua từ ai; bản dịch chính dùng cách nói tự nhiên và không thêm ý “thương nhân” vốn chỉ được suy ra từ bối cảnh.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: đã đưa ông xuống đó
  rationale: Giữ đại từ quan hệ quy về những người Ích-ma-ên, giữ “xuống” để phản ánh sự lặp lại của ירד, và dịch שָׁמָּה là “đó” để chỉ Ai Cập.
theological_decisions:
- issue: Ý nghĩa của סְרִיס trong chức danh của Pô-ti-pha
  choice: quan chức của Pha-ra-ôn
  alternative: hoạn quan của Pha-ra-ôn
  rationale: Từ Hê-bơ-rơ có thể mang nghĩa sinh học hoặc chỉ một chức vụ trong triều. Văn mạch không buộc phải hiểu theo nghĩa sinh học, nên bản chính dùng nghĩa hành chính và chú thích giữ lại cách hiểu kia.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu được chia sau mệnh đề mở đầu để tránh chuỗi bổ nghĩa quá dài. Dùng các tên riêng quen thuộc trong truyền thống phiên âm tiếng Việt; không thêm từ “bấy giờ” vì nguyên văn không có từ chỉ thời gian tương ứng.
