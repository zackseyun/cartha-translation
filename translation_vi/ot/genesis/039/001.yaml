  - severity: low
    issue: Câu bị tách sau “Ai Cập”, và “chỉ huy đội cận vệ” thiếu danh từ đứng đầu trong chuỗi đồng vị.
    rationale: Nguyên văn liên kết mệnh đề về Giô-sép với việc Pô-ti-pha mua ông trong cùng một câu. “Viên chỉ huy đội cận vệ” tự nhiên và song song hơn trong tiếng Việt.
