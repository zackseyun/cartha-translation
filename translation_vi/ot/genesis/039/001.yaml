revisions:
- from: Giô-sép đã bị đưa xuống Ai Cập. Pô-ti-pha, một quan chức của Pha-ra-ôn[a], chỉ huy đội cận vệ và là người Ai Cập[b], đã mua Giô-sép từ những người Ích-ma-ên đã đưa ông xuống đó.
  to: Giô-sép đã bị đưa xuống Ai Cập, và Pô-ti-pha, một quan chức[a] của Pha-ra-ôn, viên chỉ huy đội cận vệ, một người Ai Cập[b], đã mua ông từ những người Ích-ma-ên đã đưa ông xuống đó.
