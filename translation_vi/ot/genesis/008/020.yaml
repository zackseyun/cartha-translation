  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: vi
  text: Rồi Nô-ê xây một bàn thờ cho Yahweh[a]. Ông lấy một số con từ mỗi loài vật thanh sạch và mỗi loài chim thanh sạch[b], rồi dâng chúng làm lễ thiêu trên bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng danh יהוה (YHWH), cũng thường được dịch là “CHÚA”.
    reason: Giải thích cách thể hiện danh riêng của Đức Chúa Trời.
  - marker: b
    text: 'Sát nghĩa hơn: “lấy từ mọi loài vật thanh sạch và từ mọi loài chim thanh sạch.”'
    reason: Ghi lại cấu trúc phân bộ của nguyên văn, vốn không nêu trực tiếp từ “một số”.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: xây
  rationale: Động từ בנה có nghĩa thông thường là “xây”; cách diễn đạt này tự nhiên và phù hợp với việc dựng một bàn thờ.
- source_word: מִזְבֵּחַ
  choice: bàn thờ
  rationale: Từ מזבח chỉ nơi dâng sinh tế; “bàn thờ” là cách gọi chuẩn, rõ nghĩa trong tiếng Việt.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ tên riêng giao ước יהוה dưới dạng “Yahweh”; giới từ ל được diễn đạt tự nhiên là “cho” trong quan hệ với việc xây bàn thờ.
- source_word: מִכֹּל
  choice: một số con thuộc mỗi loài
  rationale: Nguyên văn có cấu trúc phân bộ “từ mọi...”. Trong ngữ cảnh, Nô-ê chọn các cá thể từ từng nhóm thanh sạch chứ không hiến tế toàn bộ; cách dịch này làm rõ hàm ý mà không thay đổi ý nghĩa.
- source_word: הַבְּהֵמָה
  choice: loài vật
  rationale: בהמה có thể chỉ thú vật, nhất là các loài gia súc; “loài vật” đủ rộng và dễ hiểu trong ngữ cảnh phân loại các sinh vật.
- source_word: הַטְּהוֹרָה / הַטָּהֹר
  choice: thanh sạch
  rationale: טהור ở đây nói đến tình trạng thích hợp về nghi lễ. “Thanh sạch” giữ sắc thái nghi lễ mà không diễn giải quá mức.
- source_word: הָעוֹף
  choice: loài chim
  rationale: עוֹף chỉ các sinh vật bay, và trong ngữ cảnh hiến tế, “loài chim” là cách diễn đạt tự nhiên, chính xác.
- source_word: וַיַּעַל עֹלֹת
  choice: dâng chúng làm lễ thiêu
  rationale: Dạng Hiphil của עלה kết hợp với עֹלֹת là thành ngữ hiến tế, nghĩa là dâng lễ thiêu; thêm “chúng” nối rõ các con vật đã được chọn với sinh tế.
- source_word: בַּמִּזְבֵּחַ
  choice: trên bàn thờ
  rationale: Diễn đạt trực tiếp nghĩa chỉ vị trí của giới từ ב trong ngữ cảnh hiến tế.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh xưng bốn phụ âm יהוה. Phiên âm “Yahweh” bảo tồn tên riêng trong bản văn, còn chú thích cho biết quy ước dịch phổ biến.
- issue: Ý nghĩa phân bộ trong việc chọn sinh vật để hiến tế
  choice: một số con thuộc mỗi loài vật thanh sạch và mỗi loài chim thanh sạch
  alternative: từ mọi con vật thanh sạch và từ mọi chim thanh sạch
  rationale: Cấu trúc Hê-bơ-rơ theo sát mặt chữ là “từ mọi...”, nhưng ngữ cảnh cho thấy việc chọn một phần từ từng nhóm. Bản dịch chính diễn đạt hàm ý này, còn chú thích bảo tồn cấu trúc sát chữ.
translation_notes:
  register: Văn phong trần thuật trang trọng nhưng hiện đại, dùng câu ngắn và từ ngữ phổ thông. “Thanh sạch” duy trì sắc thái nghi lễ; “lễ thiêu” rõ nghĩa hơn với độc giả phổ thông so với thuật ngữ chuyên biệt hoặc mang màu sắc hệ phái.
