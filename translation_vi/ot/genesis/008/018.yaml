  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: vi
  text: Rồi Nô-ê đi ra, cùng với các con trai, vợ ông và các vợ của các con trai ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bấy giờ Nô-ê đi ra” hoặc “Và Nô-ê đi ra.” Dạng kể chuyện trong tiếng Hê-bơ-rơ có thể được diễn đạt bằng một số từ nối đơn giản trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Vậy, Nô-ê ra khỏi tàu
  rationale: Dạng kể chuyện với וַ tiếp nối và đẩy câu chuyện tiến lên; trong ngữ cảnh, động từ יָצָא chỉ việc ra khỏi tàu. Bổ sung “tàu” theo ngữ cảnh để câu tiếng Việt tự nhiên và rõ nghĩa, không thay đổi nội dung.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: וּבָנָיו
  choice: cùng với các con trai
  rationale: בָּנִים ở đây chỉ các con trai cụ thể của Nô-ê; “cùng với” diễn đạt tự nhiên quan hệ giữa những người đồng đi ra.
- source_word: וְאִשְׁתּוֹ
  choice: vợ ông
  rationale: Danh từ số ít với hậu tố ngôi ba giống đực số ít có nghĩa trực tiếp là “vợ ông”; cách xưng “ông” trang trọng và rõ chủ thể trong tiếng Việt.
- source_word: וּנְשֵׁי בָנָיו
  choice: các vợ của các con trai ông
  rationale: Bám sát cấu trúc Hê-bơ-rơ “các vợ của các con trai ông”, tránh chuyển thành thuật ngữ quan hệ họ hàng rộng hơn như “các con dâu”.
- source_word: אִתּוֹ
  choice: cùng với
  rationale: Ý “với ông” được thể hiện tự nhiên bằng “cùng với” ở đầu danh sách; không cần lặp lại ở cuối câu tiếng Việt.
