  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: vi
  text: Rồi ông thả con quạ ra; nó cứ bay đi bay lại[a] cho đến khi nước trên mặt đất khô cạn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “nó đi ra, cứ đi ra rồi trở lại.” Cách diễn đạt Hê-bơ-rơ nhấn mạnh chuyển động lặp đi lặp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Rồi ông thả ... ra
  rationale: Động từ wayyiqtol tiếp nối mạch kể chuyện; “rồi” diễn đạt trình tự tự nhiên, còn “thả ... ra” phù hợp với hành động đưa con chim ra khỏi tàu.
- source_word: הָעֹרֵב
  choice: con quạ
  rationale: Danh từ xác định chỉ loài chim; “con quạ” là cách gọi thông dụng và chính xác trong tiếng Việt.
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: nó cứ bay đi bay lại
  rationale: Cụm động từ hữu hạn cùng hai nguyên mẫu tuyệt đối diễn tả chuyển động lặp lại hoặc liên tục. “Cứ ... đi ... lại” giữ sắc thái kéo dài; “bay” là cách diễn đạt tự nhiên đối với chim, dù động từ gốc chỉ nói “đi ra”.
- source_word: עַד יְבֹשֶׁת
  choice: cho đến khi ... khô cạn
  rationale: עַד đánh dấu điểm kết thúc theo thời gian, còn יבשׁ mô tả nước khô đi; cấu trúc này tự nhiên trong tiếng Việt.
- source_word: הַמַּיִם
  choice: nước
  rationale: מַיִם có hình thức số nhiều trong tiếng Hê-bơ-rơ nhưng tiếng Việt tự nhiên dùng danh từ khối “nước”.
- source_word: מֵעַל הָאָרֶץ
  choice: trên mặt đất
  rationale: Diễn đạt tự nhiên ý nước ở trên bề mặt đất; quan hệ “khỏi/trên” được hàm chứa trong việc nước khô cạn.
