  terminology: “Con quạ,” “thả ... ra,” “mặt đất,” và cách gọi “Hê-bơ-rơ” đều chuẩn trong tiếng Việt hiện đại. Không có thuật ngữ thần học hoặc tên riêng cần điều chỉnh.
