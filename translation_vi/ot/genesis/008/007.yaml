translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” vì chủ thể Nô-ê đã rõ từ ngữ cảnh; không thêm tên vào câu. Bản chính ưu tiên tiếng Việt tự nhiên, còn chú thích bảo lưu cấu trúc lặp của nguyên văn.
