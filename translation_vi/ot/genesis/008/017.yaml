  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: vi
  text: Hãy đem ra cùng con mọi sinh vật có xác thịt đang ở với con—chim, gia súc và mọi loài vật bò trên mặt đất—để chúng sinh sôi đông đúc trên đất[a], sinh sản và gia tăng trên đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đầy dẫy trên đất.” Động từ Hê-bơ-rơ diễn tả sự sinh sôi đông đúc, tràn đầy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: mọi sinh vật
  rationale: Diễn đạt phạm vi bao quát của חַיָּה trong ngữ cảnh, không thu hẹp thành thú hoang hay chỉ một nhóm động vật.
- source_word: אֲשֶׁר אִתְּךָ
  choice: đang ở với con
  rationale: Mệnh đề quan hệ tự nhiên trong tiếng Việt, chỉ các sinh vật đang cùng Nô-ê ở trong tàu.
- source_word: מִכָּל בָּשָׂר
  choice: thuộc mọi loài xác thịt
  rationale: Giữ hình ảnh tập thể của בָּשָׂר, đồng thời thêm 'loài' để câu tiếng Việt rõ và tự nhiên hơn.
- source_word: בָּעוֹף
  choice: chim chóc
  rationale: Cách gọi tự nhiên, có tính tập hợp đối với các loài có cánh trong chuỗi liệt kê này.
- source_word: וּבַבְּהֵמָה
  choice: gia súc
  rationale: Phù hợp nghĩa thông dụng của בְּהֵמָה trong cách phân loại động vật ở Sáng Thế Ký, nhất là các thú vật lớn hoặc được thuần dưỡng.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: và mọi loài bò sát bò trên mặt đất
  rationale: Dùng cùng họ từ 'bò' để tái hiện sự lặp từ רֶמֶשׂ/רֹמֵשׂ; ở đây 'bò sát' được hiểu theo nghĩa rộng là sinh vật di chuyển sát mặt đất.
- source_word: הוֹצֵא אִתָּךְ
  choice: Hãy đem ra cùng con
  rationale: 'Giữ lực khiến khiến của thể Hiphil: Nô-ê phải đưa các sinh vật ra, và chính ông cũng đi ra cùng chúng.'
- source_word: וְשָׁרְצוּ
  choice: Hãy để chúng sinh sôi đầy dẫy
  rationale: Truyền đạt sắc thái sinh sôi đông đảo, tràn đầy của שׁרץ và phù hợp với mệnh lệnh hướng đến kết quả.
- source_word: בָאָרֶץ / עַל הָאָרֶץ
  choice: trên đất / trên mặt đất
  rationale: Trong bối cảnh sau trận lụt, אֶרֶץ chỉ đất/địa cầu rộng lớn; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: וּפָרוּ וְרָבוּ
  choice: sinh sản và gia tăng
  rationale: 'Giữ hai ý phân biệt của cặp động từ trong công thức phước lành sáng tạo: sinh con đẻ cái và trở nên đông đảo.'
theological_decisions:
- issue: Tiếng vọng của phước lành sáng tạo sau trận lụt
  choice: Giữ chuỗi diễn đạt 'sinh sôi đầy dẫy... sinh sản và gia tăng'.
  alternative: Rút gọn thành 'sinh sôi nảy nở thật nhiều'.
  rationale: Ba động từ tiếng Hê-bơ-rơ gợi lại ngôn ngữ sáng tạo trong Sáng Thế Ký 1, qua đó trình bày sự tái lập đời sống sau sự phán xét; bản dịch giữ sự lặp ý có chủ đích thay vì làm phẳng thành một động từ chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ 'con' phản ánh lời Đức Chúa Trời trực tiếp phán với Nô-ê. Dấu hai chấm làm rõ rằng các nhóm động vật sau đó giải thích cho cụm 'mọi loài xác thịt'.
