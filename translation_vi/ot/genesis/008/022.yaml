base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: vi
  text: Bao lâu trái đất còn tồn tại,[a] thì mùa gieo và mùa gặt, lạnh và nóng, mùa hạ và mùa đông, ngày và đêm sẽ không ngừng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “suốt mọi ngày của trái đất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: Bao lâu trái đất còn tồn tại
  rationale: Cụm từ chỉ khoảng thời gian kéo dài trong tương lai. Cách dịch này tự nhiên trong tiếng Việt và giữ giới hạn thời gian của nguyên văn; nghĩa sát chữ được ghi ở chú thích.
- source_word: זֶרַע וְקָצִיר
  choice: mùa gieo và mùa gặt
  rationale: Trong cặp từ nông nghiệp này, זֶרַע chỉ thời kỳ hoặc hoạt động gieo hạt, đối ứng với קָצִיר là mùa gặt.
- source_word: קֹר וָחֹם
  choice: lạnh và nóng
  rationale: Giữ nguyên cặp đối lập về khí hậu của tiếng Hê-bơ-rơ bằng cách diễn đạt ngắn gọn, phổ thông.
- source_word: קַיִץ וָחֹרֶף
  choice: mùa hạ và mùa đông
  rationale: Đây là các từ tương đương thông dụng trong tiếng Việt; chú thích bảo lưu sắc thái mùa khô và mùa mưa trong khí hậu vùng đất Kinh Thánh.
- source_word: יוֹם וָלַיְלָה
  choice: ngày và đêm
  rationale: Giữ cặp từ cố định chỉ chu kỳ thời gian liên tục.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: sẽ không ngừng
  rationale: Động từ שׁבת ở đây có nghĩa là ngừng hoặc chấm dứt; chủ thể là toàn bộ các chu kỳ vừa được kể ra.
theological_decisions:
- issue: Phạm vi và thời hạn của lời hứa về các chu kỳ đều đặn của công trình sáng tạo
  choice: Lời hứa có hiệu lực bao lâu trái đất còn tồn tại.
  alternative: Các chu kỳ này sẽ tiếp tục tuyệt đối và đời đời, không có bất cứ giới hạn nào.
  rationale: Cụm כָּל יְמֵי הָאָרֶץ đặt lời khẳng định trong phạm vi 'mọi ngày của trái đất'. Bản dịch giữ giới hạn thời gian ấy, không biến câu này thành một khẳng định siêu hình về cõi vĩnh hằng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Bao lâu… thì…” diễn đạt tự nhiên quan hệ thời gian trong tiếng Việt; các cặp từ ngắn giữ nhịp điệu cân xứng của nguyên văn.
