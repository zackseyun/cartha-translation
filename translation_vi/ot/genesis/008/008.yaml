  yaml_path: translation/ot/genesis/008/008.yaml
  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: vi
  text: Rồi ông thả chim bồ câu từ chỗ ông đi để xem nước trên mặt đất đã giảm bớt chưa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã giảm xuống.” Động từ Hê-bơ-rơ cho biết nước lụt đã ít đi.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “từ trên mặt đất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Rồi ông thả ... ra
  rationale: Dạng wayyiqtol tiếp nối trình tự câu chuyện. Trong ngữ cảnh Nô-ê cho chim rời tàu, “thả ... ra” tự nhiên và chính xác hơn cách nói chung chung “sai đi”.
- source_word: הַיּוֹנָה
  choice: chim bồ câu
  rationale: יוֹנָה có thể chỉ bồ câu nói chung; “chim bồ câu” là cách gọi quen thuộc, phù hợp với trình thuật lụt lớn.
- source_word: מֵאִתּוֹ
  choice: ra khỏi chỗ mình
  rationale: Cụm giới từ diễn tả chuyển động rời khỏi người hoặc nơi người ấy đang ở. Cách dịch này giữ nét nghĩa của nguyên văn mà không diễn giải thành “khỏi tàu”.
- source_word: לִרְאוֹת
  choice: để xem
  rationale: Động từ nguyên mẫu của ראה nêu mục đích; “để xem” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: הֲקַלּוּ
  choice: đã rút ... chưa
  rationale: Trong ngữ cảnh này, קלל nói đến việc nước giảm bớt. Cấu trúc nghi vấn הֲ được thể hiện tự nhiên bằng “đã ... chưa”.
- source_word: הַמַּיִם
  choice: nước
  rationale: Dù hình thức Hê-bơ-rơ là số nhiều, tiếng Việt thông thường dùng danh từ khối “nước”; dịch “các dòng nước” sẽ thêm sắc thái không có trong câu.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: khỏi mặt đất
  rationale: 'Cách nói gọn, tự nhiên, vẫn giữ hình ảnh không gian của nguyên văn: nước rút khỏi bề mặt đất.'
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” vì chủ thể Nô-ê đã rõ trong văn cảnh; tránh tự ý chèn tên riêng hoặc biến מֵאִתּוֹ thành “khỏi tàu.”
