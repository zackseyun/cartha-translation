base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: vi
  text: Nước cứ rút dần khỏi mặt đất[a]; đến cuối một trăm năm mươi ngày, nước đã giảm xuống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ sát nghĩa là “đi và trở lại”, một lối nói diễn tả nước tiếp tục rút dần.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: rút
  rationale: Động từ שׁוב có nghĩa cơ bản là “trở lại, quay lại”; khi nói về nước đang phủ trên đất, “rút” diễn đạt tự nhiên việc nước lui đi mà không nhân cách hóa chuyển động.
- source_word: מֵעַל הָאָרֶץ
  choice: khỏi mặt đất
  rationale: מֵעַל chỉ sự chuyển dịch ra khỏi vị trí ở trên hoặc phủ trên một bề mặt; “khỏi mặt đất” giữ được hình ảnh không gian và tự nhiên trong tiếng Việt.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: cứ … dần
  rationale: Cụm nguyên mẫu tuyệt đối này, theo sau động từ chính, nhấn mạnh diễn tiến liên tục hoặc tăng dần. “Cứ rút dần” truyền đạt lực tiến triển ấy mà không khiến người đọc hiểu nước dao động tới lui.
- source_word: וַיַּחְסְרוּ
  choice: đã giảm xuống
  rationale: חסר diễn tả nước trở nên ít hơn. “Giảm xuống” phân biệt động từ này với “rút” ở vế trước và phù hợp với văn cảnh mực nước hạ.
- source_word: מִקְצֵה
  choice: đến cuối
  rationale: Trong cách dùng chỉ thời gian, מִקְצֵה nói đến điểm kết thúc của một khoảng thời gian; “đến cuối” vừa trực tiếp vừa tự nhiên.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: một trăm năm mươi ngày
  rationale: Cách diễn đạt số lượng trực tiếp, chuẩn trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cứ rút dần” để thể hiện tiến trình liên tục của cấu trúc Hê-bơ-rơ, đồng thời giữ hai động từ khác nhau bằng “rút” và “giảm xuống”.
