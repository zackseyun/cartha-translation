  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: vi
  text: Rồi ông đợi thêm bảy ngày nữa và thả chim bồ câu ra; nó không trở về với ông nữa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và nó không còn trở về với ông.” Cấu trúc phủ định trong tiếng Hê-bơ-rơ với יָסְפָה + שׁוּב có thể hiểu là “không trở về nữa” hoặc “không còn trở về.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: Rồi ông đợi
  rationale: Động từ יחל trong mạch truyện này mang nghĩa chờ đợi; “rồi” thể hiện diễn tiến của lối kể chuyện bằng waw liên tiếp.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: thêm bảy ngày nữa
  rationale: Cụm từ chỉ một khoảng bảy ngày bổ sung; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý lặp lại theo ngữ cảnh.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: và thả chim bồ câu ra
  rationale: שׁלח thường có nghĩa là sai hoặc phái đi; trong bối cảnh Nô-ê cho chim ra khỏi tàu, “thả ... ra” là cách nói tự nhiên, không hàm ý phóng sinh.
- source_word: וְלֹא יָסְפָה שׁוּב
  choice: nó không trở về ... nữa
  rationale: יסף bị phủ định và đi với שׁוּב tạo nghĩa “không trở lại nữa” hoặc “không còn trở lại”; bản dịch giữ lối diễn đạt tự nhiên và độ mở của cấu trúc.
- source_word: אֵלָיו
  choice: với ông
  rationale: Giới từ chỉ hướng về Nô-ê; trong tiếng Việt, “trở về với ông” tự nhiên và thể hiện đúng đích đến.
- source_word: עוֹד
  choice: nữa
  rationale: Ở cuối câu, עוֹד trong cấu trúc phủ định diễn đạt việc không tái diễn hoặc không còn tiếp diễn.
