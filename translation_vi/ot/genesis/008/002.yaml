  rationale: 'Chỉnh nhẹ hai điểm để sát từ vựng và quan hệ cú pháp của nguyên văn hơn: dùng “mạch nước” cho các springs, và thay liên từ mang sắc thái đối lập bằng liên từ phối hợp. Các thuật ngữ chủ chốt, thể bị động và các neo chú thích được giữ nguyên đúng vị trí.'
