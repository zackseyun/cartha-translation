  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: vi
  text: Các mạch nước của vực sâu và các cửa sổ trên trời[a] đều bị đóng lại, và mưa từ trời bị ngăn lại[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các cửa xả nước trên trời.” Tiếng Hê-bơ-rơ nói sát nghĩa đến những chỗ mở hoặc cửa sổ trên trời.
    reason: lexical_alternative
  - marker: b
    text: Hay “mưa từ trời ngừng lại.” Động từ Hê-bơ-rơ có thể nhấn mạnh việc mưa bị giữ lại, dẫn đến ngừng rơi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: đều bị đóng lại
  rationale: Dạng Nifal diễn tả việc bị đóng hoặc bít lại; cách dịch bị động phản ánh hình thái Hê-bơ-rơ và phù hợp với cả các nguồn nước lẫn các cửa sổ.
- source_word: מַעְיְנֹת תְּהוֹם
  choice: các nguồn nước của vực sâu
  rationale: מַעְיְנֹת chỉ các nguồn hay mạch nước, còn תְּהוֹם là vực nước sâu mang sắc thái vũ trụ trong Sáng Thế Ký. Cụm này vừa rõ nghĩa trong tiếng Việt hiện đại vừa giữ liên hệ với Sáng Thế Ký 1:2 và 7:11.
- source_word: אֲרֻבֹּת הַשָּׁמָיִם
  choice: các cửa sổ trên trời
  rationale: אֲרֻבֹּת theo nghĩa sát là các cửa sổ hay lỗ mở. Cách dịch này giữ nguyên hình ảnh những chỗ mở trên trời, thay vì diễn giải mạnh hơn thành các cửa xả nước.
- source_word: וַיִּכָּלֵא
  choice: bị ngăn lại
  rationale: Động từ diễn tả việc bị giữ hoặc ngăn không cho tiếp tục. Cách dịch này bảo tồn sắc thái bị kìm giữ, đồng thời hàm ý rằng mưa đã ngừng.
- source_word: הַגֶּשֶׁם מִן הַשָּׁמָיִם
  choice: mưa từ trời
  rationale: Dịch trực tiếp danh từ 'mưa' và giữ cụm chỉ nguồn gốc 'từ trời', qua đó bảo tồn sự lặp lại của הַשָּׁמַיִם trong câu Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh vũ trụ học của nguyên văn qua các cụm “vực sâu” và “cửa sổ trên trời”; dùng thể bị động để phản ánh cấu trúc Hê-bơ-rơ mà không xác định tác nhân.
