id: GEN.8.1
reference: Genesis 8:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: vi
  text: Nhưng Đức Chúa Trời nhớ đến Nô-ê[a], cùng mọi loài thú hoang và mọi gia súc ở với ông trong tàu. Đức Chúa Trời khiến một luồng gió thổi qua mặt đất[b], và nước rút xuống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời lưu tâm đến Nô-ê.” Trong tiếng Hê-bơ-rơ, “nhớ đến” thường hàm ý hành động thành tín, chứ không chỉ là hồi tưởng.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ רוּחַ có thể có nghĩa là “gió,” “hơi thở” hoặc “thần linh.” Ở đây, “gió” phù hợp nhất với văn cảnh, dù cách diễn đạt có thể gợi lại Thần Linh hoặc luồng gió trên mặt nước trong Sáng Thế Ký 1:2.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: nhớ đến
  rationale: Giữ nguyên thành ngữ nhân hình của tiếng Hê-bơ-rơ; trong mạch truyện, từ này hàm ý Đức Chúa Trời lưu tâm và hành động vì Nô-ê, chứ không ngụ ý trước đó Ngài quên ông.
- source_word: כָּל הַחַיָּה
  choice: mọi loài thú hoang
  rationale: Khi đứng song song với בְּהֵמָה, חַיָּה thích hợp nhất để chỉ các loài thú hoang, nhờ đó giữ được sự phân biệt giữa hai nhóm động vật.
- source_word: כָּל הַבְּהֵמָה
  choice: mọi gia súc
  rationale: Trong cặp đối ứng với חַיָּה, từ này chỉ các động vật đã được thuần hóa; “gia súc” là cách diễn đạt tự nhiên và gọn trong tiếng Việt.
- source_word: בַּתֵּבָה
  choice: trong tàu
  rationale: Trong văn cảnh Nô-ê, תֵּבָה chỉ chiếc tàu dùng để bảo toàn người và vật qua nước lụt; “tàu” là cách gọi rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: khiến một luồng gió thổi qua
  rationale: רוּחַ có thể là gió, hơi thở hoặc thần linh, nhưng tác dụng làm nước rút cho thấy nghĩa khí tượng là phù hợp nhất. Cách dịch này cũng thể hiện sắc thái gây khiến của dạng Hiphil.
- source_word: עַל הָאָרֶץ
  choice: qua mặt đất
  rationale: Ở đây אֶרֶץ chỉ bề mặt đất mà gió đi qua; “mặt đất” tự nhiên trong tiếng Việt và không quyết định quá mức tranh luận về phạm vi địa lý của trận lụt.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: nước rút xuống
  rationale: Động từ diễn tả nước dịu đi hoặc giảm xuống; “rút xuống” rõ nghĩa và phù hợp tự nhiên với nước lụt.
- source_word: וַ
  choice: Nhưng
  rationale: Liên từ mở đầu đánh dấu bước ngoặt của trình thuật, từ cảnh phán xét sang hành động cứu giúp, nên “Nhưng” truyền đạt tốt chức năng diễn ngôn này.
theological_decisions:
- issue: Ngôn ngữ nhân hình trong câu “Đức Chúa Trời nhớ đến Nô-ê”
  choice: Giữ cách nói “Đức Chúa Trời nhớ đến Nô-ê”
  alternative: Đức Chúa Trời lưu tâm đến Nô-ê
  rationale: Giữ hình ảnh và sức nặng thần học của nguyên văn. Trong văn cảnh, “nhớ đến” dẫn đến hành động thành tín, không nhất thiết hàm ý Đức Chúa Trời từng quên.
- issue: Nghĩa của רוּחַ trong trình thuật nước lụt
  choice: Dịch là “gió” trong chính văn
  alternative: Thần Linh
  rationale: Tác dụng trực tiếp là khiến nước rút, nên nghĩa “gió” phù hợp nhất với văn cảnh. Tuy vậy, chú thích giữ lại độ đa nghĩa của từ Hê-bơ-rơ và khả năng gợi lại Sáng Thế Ký 1:2.
- issue: Phạm vi nghĩa của הָאָרֶץ
  choice: Dịch là “mặt đất”
  alternative: trái đất
  rationale: Từ Hê-bơ-rơ có thể chỉ đất, xứ hoặc trái đất. “Mặt đất” phù hợp với chuyển động của gió trong câu và tránh dùng bản dịch để giải quyết một vấn đề mà chính từ ngữ ở đây vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt Kinh Thánh; giữ thành ngữ “nhớ đến” và giải thích trong chú thích. “Thú hoang” và “gia súc” bảo toàn cặp phân loại của nguyên văn.
