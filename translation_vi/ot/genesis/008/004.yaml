base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: vi
  text: Vào ngày mười bảy của tháng thứ bảy, chiếc tàu dừng lại trên các núi của A-ra-rát.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các núi của A-ra-rát”; câu này nói đến một vùng núi, không nhất thiết là một đỉnh riêng lẻ như ngọn núi ngày nay được gọi là A-ra-rát.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: dừng lại
  rationale: Động từ נוח ở dạng kể chuyện diễn tả chiếc tàu đi đến trạng thái dừng và nằm yên; “dừng lại” tự nhiên trong tiếng Việt và giữ được sắc thái sự kiện.
- source_word: הַתֵּבָה
  choice: chiếc tàu
  rationale: Trong trình thuật Nô-ê, תֵּבָה chỉ phương tiện lớn chở người và động vật qua nước lụt. “Chiếc tàu” rõ nghĩa và tự nhiên hơn cách dịch sát hình dạng như “cái hòm”.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: vào tháng thứ bảy
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, tương ứng trực tiếp với cụm Hê-bơ-rơ.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ngày mười bảy trong tháng
  rationale: Phản ánh công thức ghi ngày tháng của tiếng Hê-bơ-rơ bằng lối nói tiếng Việt rõ ràng, hiện đại.
- source_word: עַל
  choice: trên
  rationale: Giữ nghĩa vị trí cơ bản của giới từ trong ngữ cảnh chiếc tàu dừng lại trên vùng núi.
- source_word: הָרֵי אֲרָרָט
  choice: các núi thuộc vùng A-ra-rát
  rationale: הָרֵי là danh từ số nhiều ở dạng liên kết. Cách dịch này giữ số nhiều và làm rõ A-ra-rát là vùng địa lý, không thu hẹp thành một đỉnh núi duy nhất.
theological_decisions:
- issue: Cách hiểu địa danh הָרֵי אֲרָרָט
  choice: các núi thuộc vùng A-ra-rát
  alternative: núi A-ra-rát
  rationale: Nguyên văn dùng “núi” ở số nhiều, vì vậy không nên theo truyền thống mà biến thành tên của một ngọn núi đơn lẻ. Bản dịch giữ nguyên mức độ xác định về địa lý của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chiếc tàu” thay vì thuật ngữ cổ hoặc cách gọi có thể gợi một chiếc hòm; phiên âm địa danh là “A-ra-rát”. Dấu chú thích được đặt ngay sau cụm địa lý mà chú thích giải thích.
