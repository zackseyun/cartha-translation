base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: vi
  text: Mọi loài thú, mọi loài vật bò sát và mọi loài chim—tất cả những gì di chuyển trên mặt đất—đều ra khỏi tàu theo từng họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo các họ của chúng.” Cách nói Hê-bơ-rơ gợi đến những nhóm có cùng dòng giống hoặc những phân nhóm giữa các loài vật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: Mọi loài thú
  rationale: Trong danh sách này, חַיָּה chỉ nhóm thú trên cạn, được phân biệt với các loài bò sát và chim. “Mọi loài” diễn đạt sắc thái phân phối của כָּל mà không giới hạn vào thú hoang hay thú nuôi.
- source_word: כָּל הָרֶמֶשׂ
  choice: mọi loài vật bò sát
  rationale: רֶמֶשׂ chỉ các sinh vật di chuyển sát mặt đất. Cách dịch này giữ hình ảnh vận động của từ Hê-bơ-rơ; ở đây “bò sát” được dùng theo nghĩa thông thường, không nhằm giới hạn vào lớp Bò sát trong phân loại học hiện đại.
- source_word: וְכָל הָעוֹף
  choice: và mọi loài chim
  rationale: עוֹף có thể bao quát các sinh vật bay, nhưng trong danh sách này “chim” là cách diễn đạt tự nhiên và phù hợp ngữ cảnh nhất.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: tất cả những gì di chuyển trên mặt đất
  rationale: רוֹמֵשׂ cùng trường nghĩa với רֶמֶשׂ, nhưng tại đây có phạm vi khái quát. “Di chuyển” tránh lặp nặng nề mà vẫn giữ ý về sự vận động trên mặt đất.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: theo từng họ
  rationale: מִשְׁפָּחָה thường có nghĩa là “gia đình, họ, thị tộc.” Trong ngữ cảnh động vật, cụm từ diễn tả việc chúng ra theo các nhóm có quan hệ dòng giống; “theo từng họ” giữ hình ảnh ấy mà không đồng nhất với thuật ngữ “loài.”
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: đều ra khỏi tàu
  rationale: יָצְאוּ là động từ đơn giản nghĩa là “đi ra.” “Ra khỏi tàu” tự nhiên trong tiếng Việt và giữ rõ điểm xuất phát; “tàu” là cách gọi dễ hiểu cho תֵּבָה trong trình thuật Nô-ê.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ rằng cụm “tất cả những gì di chuyển trên mặt đất” có chức năng khái quát danh sách phía trước. Dấu chú thích được đặt ngay sau “theo từng họ,” đúng với cụm từ mà chú thích giải thích.
