id: GEN.8.11
reference: Genesis 8:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תָּבֹ֨א אֵלָ֤י/ו הַ/יּוֹנָה֙ לְ/עֵ֣ת עֶ֔רֶב וְ/הִנֵּ֥ה עֲלֵה זַ֖יִת טָרָ֣ף בְּ/פִ֑י/הָ וַ/יֵּ֣דַע נֹ֔חַ כִּי קַ֥לּוּ הַ/מַּ֖יִם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: vi
  text: Chim bồ câu đến với ông vào lúc chiều tối[a]; kìa, trong mỏ nó có một chiếc lá ôliu vừa mới bị bứt[b]. Vì thế, Nô-ê biết nước đã rút bớt[c] khỏi mặt đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trở về với ông”; động từ Hê-bơ-rơ tự nó có nghĩa là “đến”, còn ngữ cảnh cho thấy đây là sự trở về.
    reason: lexical_alternative
  - marker: b
    text: “Vừa mới bị bứt” dịch một từ Hê-bơ-rơ chỉ vật bị xé hoặc bứt lìa, hàm ý chiếc lá mới được lấy từ một cây ôliu còn sống.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “nước đã giảm bớt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: đến
  rationale: Động từ בוא có nghĩa thông thường là “đến”; ngữ cảnh cho thấy chim bồ câu quay về, nhưng ý “trở về” không nằm tường minh trong chính động từ nên được giữ ở chú thích.
- source_word: לְעֵת עֶרֶב
  choice: vào lúc chiều tối
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại và giữ được ý chỉ thời điểm của cụm Hê-bơ-rơ.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái sống động, bất ngờ của הִנֵּה.
- source_word: עֲלֵה זַיִת
  choice: một chiếc lá ôliu
  rationale: Cụm từ có nghĩa đen là “lá của cây ôliu”; cách diễn đạt này rõ ràng, tự nhiên và không biến “lá” thành “nhánh”.
- source_word: טָרָף
  choice: vừa mới bị bứt
  rationale: Từ này chỉ vật bị xé hoặc bứt lìa; “vừa mới bị bứt” vừa giữ hành động vật lý vừa chuyển tải hàm ý chiếc lá còn mới từ cây sống.
- source_word: בְּפִיהָ
  choice: trong mỏ nó
  rationale: “Mỏ” tự nhiên và chính xác hơn “miệng” khi nói về chim trong tiếng Việt; đại từ “nó” tránh gán giới tính sinh học chỉ dựa trên giống ngữ pháp Hê-bơ-rơ.
- source_word: וַיֵּדַע
  choice: Vì thế, Nô-ê biết
  rationale: '“Vì thế” làm rõ quan hệ suy luận: chiếc lá là dấu hiệu khiến Nô-ê nhận biết tình trạng nước.'
- source_word: קַלּוּ הַמַּיִם
  choice: nước đã rút bớt
  rationale: Động từ קלל ở đây chỉ sự giảm bớt hoặc hạ xuống của nước; “rút bớt” phù hợp với nước lụt và không hàm ý nước đã biến mất hoàn toàn.
- source_word: מֵעַל הָאָרֶץ
  choice: khỏi mặt đất
  rationale: 'Giữ ý không gian của מֵעַל: nước đang rút khỏi phần trên bề mặt đất.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ “kìa” để bảo toàn nét kể chuyện sống động của nguyên văn; dùng “ôliu” là tên cây quen thuộc trong văn liệu Kinh Thánh tiếng Việt. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
