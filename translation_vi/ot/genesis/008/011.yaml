  source_fidelity: 'Bản dịch chuyển tải sát ý câu Hê-bơ-rơ: chim bồ câu đến vào buổi chiều, mang lá ôliu vừa bị bứt trong mỏ, và Nô-ê từ đó biết nước đã rút bớt khỏi mặt đất. “Đến” giữ nghĩa trực tiếp của וַתָּבֹא mà không đưa ý “trở về” vào thân văn; ý ngữ cảnh này được nêu đúng trong chú thích. “Nước đã rút bớt” phản ánh phù hợp ý nước đã giảm/abated, không hàm ý nước đã biến mất hoàn toàn.'
