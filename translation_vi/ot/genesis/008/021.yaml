revisions:
- from: 'ĐỨC GIÊ-HÔ-VA ngửi thấy hương thơm làm đẹp lòng Ngài. ĐỨC GIÊ-HÔ-VA tự nhủ: “Ta sẽ không bao giờ nguyền rủa đất đai vì loài người nữa, dù khuynh hướng trong lòng con người là xấu xa từ thuở thiếu thời. Ta cũng sẽ không bao giờ đánh diệt mọi sinh vật như Ta đã làm nữa.”'
  to: 'ĐỨC GIÊ-HÔ-VA ngửi thấy hương thơm dễ chịu. ĐỨC GIÊ-HÔ-VA tự nhủ: “Ta sẽ không bao giờ nguyền rủa đất đai vì loài người nữa, vì khuynh hướng lòng con người là xấu xa từ thuở thiếu thời. Ta cũng sẽ không bao giờ giáng xuống mọi sinh vật như Ta đã làm nữa.”'
  rationale: Bản sửa phục hồi quan hệ nguyên nhân của כִּי bằng “vì”, giảm phần diễn giải trong “hương thơm làm đẹp lòng Ngài”, và dịch לְהַכּוֹת theo nghĩa cơ bản “giáng xuống”. Các yếu tố còn lại, gồm danh xưng, “tự nhủ”, “khuynh hướng lòng con người”, và “từ thuở thiếu thời”, đều được giữ vì phù hợp với nguồn và tiếng Việt hiện đại.
