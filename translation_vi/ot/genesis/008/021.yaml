  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: vi
  text: 'ĐỨC GIÊ-HÔ-VA ngửi thấy hương thơm dễ chịu. ĐỨC GIÊ-HÔ-VA tự nhủ: “Ta sẽ không bao giờ nguyền rủa đất đai vì loài người nữa, vì khuynh hướng lòng con người là xấu xa từ thuở thiếu thời. Ta cũng sẽ không bao giờ giáng xuống mọi sinh vật như Ta đã làm nữa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ĐỨC GIÊ-HÔ-VA
  rationale: Dùng cách gọi quen thuộc, trang trọng trong tiếng Việt để biểu thị danh riêng của Đức Chúa Trời.
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: hương thơm làm đẹp lòng Ngài
  rationale: Diễn đạt tự nhiên ý về một mùi hương đem lại sự hài lòng, thay vì chỉ mô tả mùi dễ chịu.
- source_word: אֶל־לִבּוֹ
  choice: tự nhủ
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là 'nói với lòng mình'; 'tự nhủ' truyền đạt tự nhiên hành động nói trong nội tâm.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: khuynh hướng trong lòng con người
  rationale: יֵצֶר chỉ sự hình thành, xu hướng hay ý hướng; 'khuynh hướng' giữ độ rộng nghĩa và tránh biến câu thành một phán quyết chuyên biệt chỉ về ý định có ý thức.
- source_word: מִנְּעֻרָיו
  choice: từ thuở thiếu thời
  rationale: Chỉ giai đoạn tuổi trẻ hoặc thời niên thiếu, không nhất thiết khẳng định từ lúc mới sinh.
- source_word: לְהַכּוֹת אֶת־כָּל־חַי
  choice: đánh diệt mọi sinh vật
  rationale: הכה là 'đánh/giáng đòn'; trong ngữ cảnh trận lụt dẫn đến hủy diệt, 'đánh diệt' vừa giữ hình ảnh vừa nêu rõ kết quả.
theological_decisions:
- issue: Quan hệ logic của כִּי giữa lời hứa không nguyền rủa đất và sự xấu xa của lòng người
  choice: dù
  alternative: vì
  rationale: כִּי thường có nghĩa 'vì', nhưng ở đây lý do lòng người xấu xa dường như tương phản với lời cam kết không tái diễn sự phán xét. 'Dù' diễn đạt mạch nhượng bộ hợp lý trong tiếng Việt mà không biến sự xấu xa thành nguyên nhân trực tiếp để tiếp tục nguyền rủa.
- issue: Phạm vi của lời hứa sau trận lụt
  choice: không bao giờ đánh diệt mọi sinh vật như Ta đã làm nữa
  alternative: không bao giờ giáng phạt bất kỳ sinh vật nào nữa
  rationale: Giữ phạm vi gắn với hành động toàn diện 'như Ta đã làm', không mở rộng thành lời phủ nhận mọi sự phán xét về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/Ngài” phù hợp lời phán và lời kể về Đức Chúa Trời. Cấu trúc được chia thành các câu vừa phải để đọc tự nhiên; không thêm thuật ngữ giáo phái.
