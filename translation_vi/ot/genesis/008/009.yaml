language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לֹֽא מָצְאָה֩ הַ/יּוֹנָ֨ה מָנ֜וֹחַ לְ/כַף רַגְלָ֗/הּ וַ/תָּ֤שָׁב אֵלָי/ו֙ אֶל הַ/תֵּבָ֔ה כִּי מַ֖יִם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יִּקָּחֶ֔/הָ וַ/יָּבֵ֥א אֹתָ֛/הּ אֵלָ֖י/ו אֶל הַ/תֵּבָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: vi
  text: Nhưng chim bồ câu không tìm được chỗ nào cho chân nó đậu, nên nó trở về với ông, đến tàu, vì nước còn trên khắp mặt đất. Ông đưa tay ra, đón lấy nó và đem nó vào trong tàu với mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצְאָה
  choice: tìm được
  rationale: Động từ מצא ở thể Qal thường có nghĩa là “tìm thấy/tìm được”; trong câu phủ định, “không tìm được” tự nhiên trong tiếng Việt và đúng với mạch kể.
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: chỗ đậu cho bàn chân mình
  rationale: מָנוֹחַ chỉ nơi nghỉ; đối với chim, “chỗ đậu” diễn đạt cụ thể và tự nhiên. Cụm “cho bàn chân mình” giữ lại hình ảnh כַּף רֶגֶל mà không dùng cách nói gượng “lòng bàn chân”.
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: nên nó trở về với ông, về phía con tàu
  rationale: '“Nên” thể hiện quan hệ kết quả trong diễn tiến. Hai thành phần אֵלָיו và אֶל־הַתֵּבָה đều được giữ: trở về với Nô-ê và hướng về con tàu; אֶל ở đây chưa nhất thiết có nghĩa là đã vào trong.'
- source_word: כִּי
  choice: vì
  rationale: כִּי nêu nguyên nhân chim bồ câu quay lại; “vì” là tương đương tiếng Việt rõ ràng.
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: nước vẫn phủ trên bề mặt toàn cõi đất
  rationale: “Bề mặt” bảo tồn hình ảnh פְּנֵי; “toàn cõi đất” giữ phạm vi của כָל־הָאָרֶץ mà không buộc הָאָרֶץ phải mang nghĩa kỹ thuật là toàn hành tinh. “Vẫn” làm rõ trạng thái tiếp diễn trong văn cảnh.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: ông đưa tay ra
  rationale: Thành ngữ với שׁלח và “tay” chỉ động tác vươn/đưa tay; “đưa tay ra” tự nhiên và trang trọng vừa phải trong tiếng Việt.
- source_word: וַיִּקָּחֶהָ
  choice: bắt lấy nó
  rationale: לקח có nghĩa rộng là “lấy”; trong ngữ cảnh tiếp nhận một con chim bằng tay, “bắt lấy” diễn đạt rõ hành động mà không hàm ý bạo lực.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: đem nó vào trong tàu với mình
  rationale: Cách dịch giữ cả đích đến là bên trong con tàu và ý אֵלָיו là đem con chim đến với chính ông, đồng thời tránh cấu trúc tiếng Việt gượng.
theological_decisions:
- issue: Phạm vi của כָל־הָאָרֶץ
  choice: toàn cõi đất
  alternative: toàn trái đất
  rationale: הָאָרֶץ có thể chỉ đất, miền đất hoặc trái đất tùy văn cảnh. “Toàn cõi đất” giữ độ rộng và sự mơ hồ chân thực của tiếng Hê-bơ-rơ, không áp đặt trước một cách hiểu địa lý-thần học cụ thể.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Dùng “con tàu” thay cho thuật ngữ cổ hoặc chuyên biệt; đại từ “ông” chỉ Nô-ê và “nó” chỉ chim bồ câu theo cách dùng tự nhiên của tiếng Việt.
