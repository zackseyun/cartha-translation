base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/006.yaml
  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: vi
  text: Sau bốn mươi ngày[a], Nô-ê mở cửa sổ của con tàu mà ông đã làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vào cuối bốn mươi ngày.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: lược trong câu chính, chuyển chức năng sang mệnh đề thời gian “Sau...”
  rationale: Công thức kể chuyện này dẫn vào sự kiện tiếp theo. Tiếng Việt hiện đại diễn đạt tự nhiên hơn bằng mệnh đề thời gian trực tiếp mà vẫn giữ đúng trình tự tường thuật.
- source_word: מִקֵּץ
  choice: sau
  rationale: Trong cách nói về một khoảng thời gian, cụm này chỉ thời điểm đạt tới khi khoảng thời gian đã trôi qua; “sau” là cách diễn đạt tự nhiên trong tiếng Việt. Cách sát cấu trúc hơn là “vào cuối” được ghi ở chú thích.
- source_word: אַרְבָּעִים יוֹם
  choice: bốn mươi ngày
  rationale: Chuyển dịch trực tiếp và tự nhiên của kết cấu số đếm với danh từ.
- source_word: וַיִּפְתַּח
  choice: mở
  rationale: Động từ פתח ở đây mang nghĩa thông thường là mở.
- source_word: חַלּוֹן
  choice: cửa sổ
  rationale: Danh từ này thường chỉ cửa sổ hoặc một ô mở giống cửa sổ; “cửa sổ” là nghĩa phù hợp nhất trong ngữ cảnh.
- source_word: הַתֵּבָה
  choice: con tàu
  rationale: Trong trình thuật Nô-ê, תֵּבָה chỉ phương tiện nổi mà Nô-ê đóng. “Con tàu” rõ nghĩa và tự nhiên đối với độc giả tiếng Việt hiện đại, không hàm ý cấu tạo chi tiết ngoài văn bản.
- source_word: אֲשֶׁר עָשָׂה
  choice: mà ông đã làm
  rationale: Mệnh đề quan hệ bổ nghĩa cho con tàu; “đã làm” thể hiện tự nhiên rằng việc làm con tàu xảy ra trước lúc mở cửa sổ mà không thêm chủ thể ngoài Nô-ê.
