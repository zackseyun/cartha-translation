translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để nối tự nhiên với nhân vật Nô-ê trong ngữ cảnh; “con tàu” là cách gọi thông dụng, rõ nghĩa của תֵּבָה.
