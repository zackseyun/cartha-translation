translation:
  language: vi
  text: Rồi ông chờ thêm bảy ngày nữa[a], và lại thả chim bồ câu ra khỏi con tàu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Rồi ông bắt đầu chờ thêm bảy ngày nữa”; động từ Hê-bơ-rơ theo nghĩa sát chữ có thể là “bắt đầu”, nhưng trong ngữ cảnh này được dùng với nghĩa “chờ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: ông chờ
  rationale: Trong mạch kể và đi với khoảng thời gian, động từ này mang nghĩa thành ngữ là chờ đợi, dù nghĩa sát chữ có thể là “bắt đầu”.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: thêm bảy ngày nữa
  rationale: עוֹד cùng אֲחֵרִים nhấn mạnh đây là một khoảng bảy ngày bổ sung; cách diễn đạt này tự nhiên và tránh lặp ý trong tiếng Việt.
- source_word: וַיֹּסֶף שַׁלַּח
  choice: lại thả
  rationale: Cấu trúc וַיֹּסֶף với động từ kế tiếp diễn tả việc làm lại một hành động. Trong ngữ cảnh con chim rời tàu để do thám, “thả” tự nhiên hơn “sai đi”.
- source_word: הַיּוֹנָה
  choice: chim bồ câu
  rationale: Danh từ xác định chỉ con chim bồ câu đã được nhắc đến trước đó.
- source_word: מִן הַתֵּבָה
  choice: ra khỏi con tàu
  rationale: Giới từ מִן diễn tả chuyển động từ bên trong ra ngoài; תֵּבָה trong trình thuật Nô-ê chỉ con tàu.
