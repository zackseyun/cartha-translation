base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: vi
  text: Nước cứ rút dần cho đến tháng thứ mười. Vào ngày mồng một tháng thứ mười, các đỉnh núi hiện ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được nhìn thấy” hoặc “trở nên thấy rõ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: Nước
  rationale: Trong tiếng Việt, “nước” tự nhiên là danh từ khối; ngữ cảnh xác định đây là nước lụt, nên không cần dùng dạng số nhiều.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: cứ rút dần
  rationale: Kết cấu với היה và các nguyên mẫu tuyệt đối diễn tả tiến trình liên tục. “Cứ rút dần” vừa tự nhiên vừa giữ được sắc thái nước tiếp tục hạ xuống từng bước.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: cho đến tháng thứ mười
  rationale: חֹדֶשׁ ở đây là đơn vị thời gian “tháng”; cách dịch giữ nguyên mốc thời gian của câu Hê-bơ-rơ.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: Vào ngày mồng một tháng thứ mười
  rationale: Diễn đạt ngày tháng theo trật tự tự nhiên trong tiếng Việt, đồng thời bảo toàn chính xác ngày đầu tiên của tháng thứ mười.
- source_word: נִרְאוּ
  choice: hiện ra
  rationale: Dạng Niphal của ראה có thể mang nghĩa “được nhìn thấy” hoặc “trở nên thấy được”. “Hiện ra” tự nhiên trong bối cảnh các đỉnh núi dần lộ ra khi nước rút và không nêu một người quan sát cụ thể.
- source_word: רָאשֵׁי הֶהָרִים
  choice: các đỉnh núi
  rationale: רֹאשׁ theo nghĩa địa hình chỉ phần trên cùng; “các đỉnh núi” là cách nói tiếng Việt tự nhiên và trang trọng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang nghiêm. Dùng “mồng một” theo cách gọi ngày đầu tháng thông dụng trong tiếng Việt; tránh lặp “trong tháng thứ mười” như bản tiếng Anh vì một cụm ngày tháng gọn hơn và vẫn phản ánh đầy đủ nguyên văn.
