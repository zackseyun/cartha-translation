  text: צֵ֖א מִן הַ/תֵּבָ֑ה אַתָּ֕ה וְ/אִשְׁתְּ/ךָ֛ וּ/בָנֶ֥י/ךָ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: vi
  text: Hãy ra khỏi con tàu, con cùng vợ, các con trai và các con dâu của con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא מִן־הַתֵּבָה
  choice: Hãy ra khỏi con tàu
  rationale: Mệnh lệnh số ít của יצא cùng מן diễn tả việc rời khỏi nơi đang ở. “Ra khỏi” tự nhiên và sát nghĩa trong tiếng Việt; תֵּבָה ở đây là con tàu của Nô-ê.
- source_word: אַתָּה
  choice: con
  rationale: Đại từ độc lập nêu rõ người được truyền lệnh. Trong lời Đức Chúa Trời phán với Nô-ê, “con” là cách xưng hô tự nhiên, trang trọng và dễ hiểu.
- source_word: וְאִשְׁתְּךָ
  choice: cùng vợ
  rationale: אִשָּׁה với hậu tố sở hữu trong ngữ cảnh này có nghĩa là “vợ”; “cùng” nối người vợ vào nhóm đi ra.
- source_word: וּבָנֶיךָ
  choice: các con trai
  rationale: בָּנִים ở đây chỉ các con trai, như được xác nhận bởi cụm tiếp theo nói đến vợ của họ.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: và các con dâu của con
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “những người vợ của các con trai con.” “Các con dâu của con” truyền đạt chính xác quan hệ gia đình và tự nhiên hơn trong tiếng Việt.
- source_word: אִתָּךְ
  choice: cùng
  rationale: Giới từ chỉ sự đi kèm. Trong câu tiếng Việt, ý “với con” được thể hiện tự nhiên bằng “con cùng…” mà không cần lặp lại ở cuối.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ mệnh lệnh trực tiếp; dùng “con” theo quan hệ xưng hô trong lời phán với Nô-ê. Không thêm chú thích vì cách diễn đạt “các con dâu của con” không tạo ra dị nghĩa đáng kể cần ghi chú.
