  text: 'Bấy giờ Đức Chúa Trời phán với Nô-ê rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ ... phán
  rationale: Động từ với waw liên tiếp đẩy câu chuyện tiến tới sự kiện kế tiếp; “Bấy giờ” diễn đạt tự nhiên quan hệ trình tự, còn “phán” phù hợp với lời nói của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, danh từ chỉ Đức Chúa Trời duy nhất; cách dịch này là tên gọi quen thuộc, trang trọng và rõ nghĩa trong tiếng Việt.
- source_word: אֶל
  choice: với
  rationale: Giới từ đánh dấu người tiếp nhận lời nói; trong cấu trúc tiếng Việt “phán với” là cách diễn đạt tự nhiên và chính xác.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Dạng nguyên mẫu này giới thiệu nội dung lời phán theo sau; “rằng:” chuyển chức năng ấy tự nhiên sang tiếng Việt và dẫn trực tiếp vào câu trích dẫn.
