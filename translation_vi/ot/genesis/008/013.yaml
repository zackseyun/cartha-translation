id: GEN.8.13
reference: Genesis 8:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: vi
  text: Đến năm thứ sáu trăm lẻ một,[a] vào ngày mồng một tháng thứ nhất, nước trên mặt đất đã khô cạn. Nô-ê dỡ tấm che của tàu ra, nhìn xem, và kìa, bề mặt đất đã khô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “năm một và sáu trăm”; theo ngữ cảnh, có lẽ đây là năm thứ 601 trong cuộc đời Nô-ê.'
    reason: Giải thích thành ngữ số đếm và thông tin được ngữ cảnh gợi ra nhưng câu này không nói rõ.
lexical_decisions:
- source_word: וַיְהִי
  choice: Đến
  rationale: Trong câu ghi mốc thời gian của thể văn tường thuật, cách này chuyển tự nhiên diễn tiến của וַיְהִי sang tiếng Việt mà không dùng lối cổ như “xảy ra rằng”.
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: năm thứ sáu trăm lẻ một
  rationale: Diễn đạt số thứ tự theo tiếng Việt tự nhiên; câu này không nói rõ đây là năm tuổi của Nô-ê nên bản dịch cũng để ngỏ.
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: vào ngày mồng một tháng thứ nhất
  rationale: Làm rõ thành ngữ chỉ ngày tháng của tiếng Hê-bơ-rơ; “mồng một” là cách nói hiện đại, thông dụng cho ngày đầu tháng.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: nước trên mặt đất đã khô cạn
  rationale: חרב diễn tả nước khô cạn; “đã” phù hợp với trạng thái đã đạt tới tại mốc thời gian được kể.
- source_word: וַיָּסַר
  choice: dỡ ... ra
  rationale: Thể Hiphil của סור mang nghĩa loại bỏ hoặc lấy ra; “dỡ ... ra” tự nhiên đối với một tấm che.
- source_word: מִכְסֵה הַתֵּבָה
  choice: tấm che của tàu
  rationale: מִכְסֵה có nghĩa rộng là vật che phủ, không nhất thiết là mái; “tàu” diễn đạt תֵּבָה trong ngữ cảnh Nô-ê bằng từ quen thuộc với độc giả Việt.
- source_word: וַיַּרְא
  choice: nhìn xem
  rationale: Trong chuỗi hành động sau khi dỡ tấm che, cụm này thể hiện hành động quan sát, không chỉ kết quả là thấy.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ sức gợi chú ý và tính bất ngờ của הִנֵּה trong giọng kể trang trọng nhưng dễ hiểu.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: bề mặt đất đã khô
  rationale: פְּנֵי mang nghĩa “bề mặt”; “đất” phù hợp với אֲדָמָה và tránh diễn giải quá mức.
theological_decisions:
- issue: Mốc “năm thứ sáu trăm lẻ một” thuộc về ai
  choice: Không thêm “đời Nô-ê” hoặc “tuổi Nô-ê” vào chính văn
  alternative: Đến năm Nô-ê sáu trăm lẻ một tuổi
  rationale: Ngữ cảnh có thể cho thấy đây là cách tính theo tuổi Nô-ê, nhưng chính câu Hê-bơ-rơ chỉ nêu con số năm; giữ cách nói hàm ẩn bảo toàn mức độ xác định của nguồn.
translation_notes:
  register: Văn phong tường thuật trang trọng, hiện đại và dễ hiểu. Dùng “kìa” để giữ sắc thái hướng sự chú ý của nguyên văn; tránh lối cổ nặng nề. Dùng “tấm che” thay vì “mái” để không xác định quá mức cấu trúc của tàu.
