base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/014.yaml
  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: vi
  text: Vào tháng thứ hai, ngày hai mươi bảy của tháng ấy, đất đã khô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trái đất đã khô” hoặc “mặt đất đã khô.” Từ Hê-bơ-rơ אֶרֶץ có thể có nghĩa là “đất,” “trái đất,” “xứ” hoặc “mặt đất.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשֵּׁנִי
  choice: Đến tháng thứ hai
  rationale: Liên từ ו cùng giới từ ב mở đầu mốc thời gian tiếp theo trong trình thuật. “Đến” diễn đạt tự nhiên sự chuyển tiếp theo thời gian trong tiếng Việt mà không làm nặng câu.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: vào ngày hai mươi bảy trong tháng
  rationale: Đây là công thức ghi ngày tháng theo tiếng Hê-bơ-rơ. Cách dịch này rõ ràng, tự nhiên trong tiếng Việt hiện đại và giữ đủ các thành tố của nguyên văn.
- source_word: יָבְשָׁה
  choice: đã khô
  rationale: Động từ Qal hoàn thành, ngôi ba giống cái số ít, mô tả trạng thái đạt được tại mốc thời gian này. “Đã khô” vừa thể hiện kết quả hoàn tất vừa tự nhiên trong mạch kể.
- source_word: הָאָרֶץ
  choice: đất
  rationale: אֶרֶץ có thể chỉ trái đất, đất đai hoặc mặt đất. “Đất” giữ được độ rộng nghĩa tự nhiên trong tiếng Việt và phù hợp với cảnh nước lụt rút, không buộc người đọc phải chọn trước giữa nghĩa toàn cầu và địa phương.
theological_decisions:
- issue: Phạm vi của הָאָרֶץ trong trình thuật nước lụt
  choice: đất
  alternative: trái đất; xứ; mặt đất
  rationale: Nguyên ngữ có phạm vi nghĩa linh hoạt. Chọn “đất” để bảo toàn sự mơ hồ chân thực, tránh dùng “trái đất” như một cách tự động xác định phạm vi địa lý hoặc thần học mà câu này tự nó không buộc phải xác định.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu gọn và dễ hiểu. Dùng “đất” thay vì từ chuyên biệt hơn để giữ độ mở nghĩa của nguyên văn; dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
