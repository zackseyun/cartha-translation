  yaml_path: translation/ot/genesis/049/019.yaml
  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: vi
  text: Gát—một toán cướp sẽ cướp phá người,[a] nhưng người sẽ cướp phá từ phía sau chúng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ chơi chữ giữa tên Gát và các từ “toán cướp” và “cướp phá” (gad / gedud / yagud).
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “nhưng người sẽ cướp phá sát gót chúng.” Cụm từ nguyên văn là “gót chân”, có thể hàm ý tấn công từ phía sau hoặc truy kích sát gót.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: Gát
  rationale: Tên riêng của con trai/gia tộc Gia-cốp, được phiên âm theo cách dùng tiếng Việt.
- source_word: גְּדוּד
  choice: một toán cướp
  rationale: Danh từ chỉ một toán quân chuyên đột kích hoặc cướp phá; cách dịch này tự nhiên và phần nào duy trì sự lặp từ với động từ kế tiếp.
- source_word: יְגוּדֶנּוּ
  choice: sẽ cướp phá người
  rationale: Động từ ở đây diễn tả hành động xâm kích/cướp phá, với hậu tố ngôi ba số ít chỉ Gát; dùng 'cướp phá' để liên kết với 'toán cướp'.
- source_word: וְהוּא
  choice: nhưng người
  rationale: 'Liên từ ו có thể là ''và'', nhưng mạch đối ứng cho thấy sắc thái tương phản: Gát bị cướp phá rồi phản công.'
- source_word: יָגֻד
  choice: sẽ đánh úp
  rationale: Cùng gốc גדד với động từ trước, nhưng tiếng Việt khó giữ trọn lối chơi chữ mà vẫn diễn đạt tự nhiên; 'đánh úp' làm rõ hành động phản kích từ phía sau.
- source_word: עָקֵב
  choice: gót chân chúng
  rationale: Nghĩa đen là 'gót chân'; trong ngữ cảnh có thể chỉ phía sau hoặc việc truy kích sát gót. Giữ hình ảnh cụ thể để không loại bỏ sự mơ hồ của nguyên văn.
