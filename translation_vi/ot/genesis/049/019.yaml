  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc đối ứng: Gát bị một toán đột kích/cướp phá, rồi đáp trả. Tuy nhiên, “sẽ đánh úp gót chân chúng” không phản ánh tự nhiên quan hệ của עָקֵב (“gót chân; phía sau; sát gót”) với động từ, và việc đổi “cướp phá” thành “đánh úp” làm mờ sự lặp từ גדד được duy trì ở hai vế Hebrew.'
