  terminology: Giữ “Gát”, “toán cướp”, và “cướp phá” là phù hợp. Việc lặp “cướp phá” ở cả hai vế tái hiện, trong mức tiếng Việt có thể, lối chơi chữ giữa Gad / gedud / yagud. Không có vấn đề thuật ngữ thần học.
