  - severity: low
    issue: Chú thích a dùng “Đấng có quyền ấy”.
    rationale: Từ “Đấng” có thể gợi một sự tôn xưng hoặc định danh thần học. Dùng “người có quyền ấy” phản ánh sát hơn lựa chọn thay thế “he comes whose right it is” và giữ tính không xác định của điểm văn bản khó.
