source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: vi
  text: 'Vương trượng sẽ không rời khỏi Giu-đa,

    cũng không gậy cai trị rời khỏi giữa hai chân người ấy,

    cho đến khi Si-lô đến[a];

    và các dân sẽ vâng phục người[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cho đến khi người có quyền ấy đến.” Từ Hê-bơ-rơ שילה rất khó xác định; từ này cũng được hiểu là một tước hiệu, một địa danh, hoặc có liên quan đến cống vật.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “các dân sẽ quy tụ về người,” hay “các dân sẽ quy phục người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: vương trượng
  rationale: Trong văn cảnh thi ca mang hình ảnh vương quyền và song song với מְחֹקֵק, từ này chỉ biểu tượng quyền cai trị hơn là “bộ tộc” hay một cây gậy thông thường.
- source_word: מִיהוּדָה
  choice: khỏi Giu-đa
  rationale: Giới từ diễn tả sự lìa khỏi; “Giu-đa” là dạng tên quen thuộc trong tiếng Việt.
- source_word: מְחֹקֵק
  choice: gậy cai trị
  rationale: Từ này có thể chỉ người ban hành sắc lệnh hoặc vật tượng trưng cho quyền cai trị. Cách dịch này giữ sự song song với “vương trượng” và phù hợp với cụm “giữa hai chân” mà không thu hẹp nghĩa thành hoạt động lập pháp.
- source_word: מִבֵּין רַגְלָיו
  choice: khỏi giữa hai chân người
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ; hình ảnh có thể gợi tư thế của vị vua đang ngồi hoặc dòng dõi, nhưng bản dịch chính không giải nghĩa thay cho nguyên văn.
- source_word: עַד כִּי
  choice: cho đến khi
  rationale: Diễn đạt tự nhiên mốc kết thúc được nêu cho lời khẳng định phía trước.
- source_word: שילה
  choice: Si-lô
  rationale: Dạng Hê-bơ-rơ rất khó xác định và đã được giải thích theo nhiều cách. Bản dịch giữ cách đọc truyền thống như một tên riêng, đồng thời nêu các khả năng chính trong chú thích.
- source_word: וְלוֹ
  choice: người
  rationale: Trong cấu trúc “vâng phục người”, đại từ chỉ đối tượng tiếp nhận sự vâng phục. Cách dịch theo ngôi người phù hợp với việc đọc “Si-lô” là một nhân vật nhưng không xác định thêm danh tính.
- source_word: יִקְּהַת
  choice: vâng phục
  rationale: Từ hiếm này có nghĩa chưa chắc chắn. Trong văn cảnh vương quyền, “vâng phục” diễn đạt hợp lý thái độ của các dân đối với vị cai trị; khả năng “quy tụ” được giữ trong chú thích.
- source_word: עַמִּים
  choice: các dân
  rationale: Phản ánh trực tiếp danh từ số nhiều và giữ phạm vi rộng của nhiều cộng đồng dân tộc.
theological_decisions:
- issue: Danh tính và cách dịch שילה trong câu có truyền thống giải thích theo hướng Đấng Mê-si-a
  choice: Giữ “Si-lô” trong bản văn chính như một tên được phiên âm, không trực tiếp xác định người này là Đấng Mê-si-a.
  alternative: “Đấng có quyền ấy”; “cho đến khi cống vật được đem đến cho người”; hoặc “cho đến khi người đến Si-lô”.
  rationale: Cách xử lý này tôn trọng tính khó hiểu thực sự của nguyên văn, không áp đặt một cách giải nghĩa thần học vào bản dịch chính, nhưng vẫn để ngỏ cách đọc theo mạch vương quyền và Đấng Mê-si-a.
- issue: Sắc thái vương quyền của lời chúc phước dành cho Giu-đa
  choice: Dùng “vương trượng”, “gậy cai trị” và “vâng phục” để giữ hình ảnh vương quyền của nguyên văn.
  alternative: Diễn giải thuần túy theo nghĩa chính trị-dòng tộc, hoặc minh nhiên thêm danh xưng Đấng Mê-si-a.
  rationale: Nguyên văn rõ ràng dùng ngôn ngữ vương quyền, nhưng không trực tiếp nêu danh tính của nhân vật được mong đợi; bản dịch vì thế giữ cả sức nặng vương quyền lẫn sự dè dặt của câu.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng dùng từ hiện đại, dễ hiểu. Các dòng được ngắt theo các vế song song của câu Hê-bơ-rơ. “Người” được dùng trang trọng làm đại từ chỉ nhân vật được nói đến, không viết hoa để tránh thêm một sự xác định thần học mà nguyên văn không minh nhiên nêu.
