  source_fidelity: 'Bản dịch giữ đúng cấu trúc và hình ảnh vương quyền của tiếng Hê-bơ-rơ: שֵׁבֶט là “vương trượng”; מְחֹקֵק được hiểu hợp lý là gậy/biểu tượng cai trị; và יִקְּהַת עַמִּים được dịch thận trọng là sự vâng phục của các dân. “Si-lô” bảo toàn một điểm văn bản khó và gây tranh luận, không áp đặt việc đồng nhất nhân vật này. Chỉnh nhẹ đại từ sở hữu để làm rõ rằng “giữa hai chân” quy về Giu-đa, đồng thời làm câu song song tự nhiên hơn.'
  naturalness: Văn phong trang trọng, hiện đại và phù hợp thể thơ. Bỏ “nào” trong vế thứ hai giúp phép tỉnh lược động từ song song với vế đầu trôi chảy hơn; thêm “ấy” sau “người” làm rõ quy chiếu mà không diễn giải thêm.
  terminology: “Vương trượng,” “gậy cai trị,” “Giu-đa,” “Si-lô,” và “các dân” đều nhất quán với ngữ cảnh và cách dùng Kinh Thánh tiếng Việt hiện đại. Chú thích a nên dùng “người có quyền ấy” thay vì “Đấng có quyền ấy,” vì cách sau có thể tạo sắc thái tôn xưng/thần học không có trong lựa chọn thay thế của nguyên văn.
  issues:
