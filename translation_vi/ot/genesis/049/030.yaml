source:
  edition: WLC
  text: בַּ/מְּעָרָ֞ה אֲשֶׁ֨ר בִּ/שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה אֲשֶׁ֥ר עַל פְּנֵי מַמְרֵ֖א בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁר֩ קָנָ֨ה אַבְרָהָ֜ם אֶת הַ/שָּׂדֶ֗ה מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: vi
  text: trong hang đá ở cánh đồng Mác-pê-la, đối diện với Mam-rê[a], tại xứ Ca-na-an—cánh đồng mà Áp-ra-ham đã mua của Ép-rôn, người Hê-tít, để làm phần đất sở hữu dùng cho việc chôn cất.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hướng về Mam-rê” hoặc “ở trước Mam-rê”; cụm từ Hê-bơ-rơ diễn tả vị trí tương quan với Mam-rê.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn nhấn mạnh đây là một phần tài sản thuộc quyền sở hữu, được dành cho việc chôn cất.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: trong hang đá
  rationale: Giới từ ב kết hợp với danh từ xác định מְעָרָה chỉ vị trí; “hang đá” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: ở cánh đồng Mác-pê-la
  rationale: Mệnh đề quan hệ xác định vị trí của hang đá. Lược “là nơi” giúp câu tiếng Việt tự nhiên mà không làm mất quan hệ định vị.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: đối diện với Mam-rê
  rationale: Thành ngữ chỉ vị trí tương quan với Mam-rê, có thể mang nghĩa “đối diện”, “hướng về” hoặc “ở trước”; bản dịch chính chọn cách hiểu không gian trực tiếp nhất và giữ phương án khác trong chú thích.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: tại xứ Ca-na-an
  rationale: Cụm địa lý được chuyển dịch trực tiếp; “xứ Ca-na-an” là cách gọi quen thuộc, trang trọng và dễ hiểu.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: cánh đồng mà Áp-ra-ham đã mua
  rationale: אֶת đánh dấu הַשָּׂדֶה là tân ngữ trực tiếp của “mua”. Cấu trúc được sắp xếp lại bằng phép đồng vị sau dấu gạch ngang để tránh hiểu sai rằng hang đá là vật được mua riêng “cùng với” cánh đồng.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: của Ép-rôn, người Hê-tít
  rationale: מֵאֵת chỉ nguồn hay người bán trong giao dịch; “mua của” là cách nói tự nhiên trong tiếng Việt. Danh xưng dân tộc được dịch là “người Hê-tít”.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: để làm phần đất sở hữu dùng cho việc chôn cất
  rationale: אֲחֻזָּה nhấn mạnh quyền sở hữu hay phần sản nghiệp hợp pháp, còn קֶבֶר chỉ việc chôn cất hoặc mộ phần. Cách dịch này giữ cả mục đích mai táng lẫn sắc thái pháp lý của tài sản.
theological_decisions:
- issue: Đối tượng của động từ “mua” trong chuỗi mệnh đề quan hệ
  choice: Xác định “cánh đồng” là đối tượng Áp-ra-ham mua
  alternative: Hiểu hang đá là tiền ngữ của mệnh đề và dịch rằng Áp-ra-ham mua hang đá cùng với cánh đồng
  rationale: Cấu trúc Hê-bơ-rơ đặt אֶת הַשָּׂדֶה, “cánh đồng”, làm tân ngữ trực tiếp của קָנָה. Việc tái cấu trúc câu tiếng Việt bảo toàn dữ kiện pháp lý mà không áp đặt cách hiểu ngoài ngữ pháp nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được giữ như một thành phần tiếp nối câu trước, phù hợp cấu trúc của nguyên văn. Dấu gạch ngang làm rõ “cánh đồng” là tân ngữ của hành động mua, đồng thời tránh chuỗi mệnh đề quan hệ tối nghĩa.
