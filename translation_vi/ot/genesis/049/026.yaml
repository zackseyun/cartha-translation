source:
  edition: WLC
  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: vi
  text: 'Phước lành của cha con trỗi hơn phước lành của các tổ phụ cha,

    cho đến tận ranh giới của những ngọn đồi muôn thuở.[a]

    Nguyện các phước lành ấy ở trên đầu Giô-sép,

    trên đỉnh đầu người được biệt riêng khỏi các anh em mình.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm Hê-bơ-rơ khó hiểu; cũng có thể dịch: “cho đến điều ao ước của những ngọn đồi muôn thuở” hoặc “cho đến sự phong phú của những ngọn đồi muôn thuở.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người đứng đầu giữa các anh em mình” hoặc “người được hiến riêng khỏi các anh em mình.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: phước lành của cha con
  rationale: Giữ dạng số nhiều theo ngữ cảnh thi ca và thể hiện trực tiếp việc Gia-cốp nói với Giô-sép.
- source_word: גָּבְרוּ עַל
  choice: trội hơn
  rationale: Diễn đạt tự nhiên ý mạnh hơn, vượt quá hoặc hơn hẳn trong cấu trúc so sánh.
- source_word: בִּרְכֹת הוֹרַי
  choice: phước lành của tổ tiên cha
  rationale: הוֹרַי chỉ những người sinh ra Gia-cốp; “tổ tiên cha” vừa tự nhiên trong lời người cha nói với con, vừa không giới hạn ý nghĩa vào cha mẹ trực tiếp.
- source_word: עַד תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: vươn đến tận những báu vật của các ngọn đồi muôn thuở
  rationale: תַּאֲוָה thường chỉ điều đáng ao ước; trong hình ảnh địa lý này, “những báu vật” diễn đạt những sản vật quý báu được mong muốn mà vẫn giữ chất thơ. עוֹלָם được dịch là “muôn thuở,” gợi các ngọn đồi có từ thời xa xưa và bền vững lâu dài.
- source_word: תִּהְיֶיןָ לְרֹאשׁ
  choice: Nguyện các phước lành ấy giáng trên đầu
  rationale: Thể chưa hoàn thành có sắc thái cầu chúc trong lời ban phước; “giáng trên đầu” là cách diễn đạt tự nhiên cho hình ảnh phước lành đặt trên một người.
- source_word: קָדְקֹד
  choice: đỉnh đầu
  rationale: Chỉ phần cao nhất của đầu và duy trì phép song đối với “đầu” ở dòng trước.
- source_word: נְזִיר אֶחָיו
  choice: người được biệt riêng giữa các anh em mình
  rationale: Giữ nghĩa căn bản của נְזִיר là người được tách riêng hoặc hiến riêng, đồng thời tránh áp đặt chế định Na-xi-rê xuất hiện rõ hơn về sau hay thu hẹp từ này thành một tước hiệu chính trị.
theological_decisions:
- issue: Ý nghĩa danh xưng נְזִיר אֶחָיו dành cho Giô-sép
  choice: người được biệt riêng giữa các anh em mình
  alternative: người đứng đầu giữa các anh em mình; người được hiến riêng giữa các anh em mình
  rationale: Bản dịch chính giữ ý phân biệt hoặc biệt riêng vốn có của từ Hê-bơ-rơ, phù hợp hoàn cảnh Giô-sép nổi bật giữa anh em, nhưng không quyết đoán rằng đây là tước vị “lãnh tụ” hoặc địa vị Na-xi-rê theo nghĩa kỹ thuật.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng hiện đại; chia thành bốn dòng để làm rõ phép song đối. Dùng “cha con” và “tổ tiên cha” nhằm giữ điểm nhìn của Gia-cốp đang trực tiếp chúc phước cho Giô-sép.
