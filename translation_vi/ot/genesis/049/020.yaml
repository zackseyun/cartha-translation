translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc thơ hai vế. Dùng “A-se” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc. Dấu chú thích [a] xuất hiện ngay sau cụm từ có phương án dịch khác.
