  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: vi
  text: 'Thức ăn của A-se sẽ dồi dào[a],

    và người sẽ cung cấp những món ngon của vua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Từ A-se sẽ có lương thực phong phú, và người sẽ ban những món ngon của vua.”'
    reason: Giữ phương án sát hơn cho giới từ מִן trong מֵאָשֵׁר (“từ A-se”); לֶחֶם cũng có thể hiểu là “bánh” hoặc “lương thực.”
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: của A-se
  rationale: Giới từ מִן chỉ nguồn gốc, có thể dịch sát là “từ A-se”; trong câu thơ không có động từ, tiếng Việt tự nhiên có thể diễn đạt quan hệ nguồn gốc bằng “thức ăn của A-se” mà không đổi ý chính.
- source_word: שְׁמֵנָה
  choice: béo bổ
  rationale: Tính từ giống cái số ít này hòa hợp với לֶחֶם và chỉ sự béo, phong phú, bổ dưỡng. “Béo bổ” giữ được hình ảnh cụ thể của nguyên ngữ mà vẫn tự nhiên khi nói về thức ăn.
- source_word: לַחְמוֹ
  choice: thức ăn của A-se
  rationale: לֶחֶם nghĩa đen là “bánh”, nhưng cũng thường chỉ thức ăn nói chung. Hậu tố ngôi ba số ít được thể hiện qua cụm “của A-se”.
- source_word: וְהוּא
  choice: và người
  rationale: Đại từ độc lập nhấn mạnh và tiếp tục lấy A-se làm chủ thể. “Người” phù hợp với cách nhân cách hóa chi tộc trong lời chúc phước.
- source_word: יִתֵּן
  choice: sẽ cung cấp
  rationale: נָתַן nghĩa cơ bản là “cho”; trong ngữ cảnh sản vật và thức ăn, “cung cấp” diễn đạt tự nhiên ý đem lại hoặc chu cấp.
- source_word: מַעֲדַנֵּי
  choice: những món ngon
  rationale: Từ này chỉ những thức ngon, tinh tuyển hoặc cao sang. “Những món ngon” rõ ràng, hiện đại và phù hợp ngữ cảnh ẩm thực.
- source_word: מֶלֶךְ
  choice: dành cho vua
  rationale: Cụm kết cấu nghĩa đen là “những món ngon của một vua”. “Dành cho vua” diễn đạt tự nhiên phẩm chất xứng với bàn ăn hoàng gia mà không xác định một vị vua cụ thể.
