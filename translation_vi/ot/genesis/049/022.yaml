translation_notes:
  register: Văn phong thi ca, trang trọng nhưng hiện đại. “Người con trĩu quả” chủ ý giữ cấu trúc và ẩn dụ cô đọng của nguyên văn; các dòng thơ được ngắt theo ba vế Hê-bơ-rơ. Dấu chú thích được đặt ngay sau cụm từ mà mỗi chú thích giải thích.
