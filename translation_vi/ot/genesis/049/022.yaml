  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: vi
  text: 'Giô-sép là người con sinh hoa kết quả[a],

    người con sinh hoa kết quả bên suối;

    các con gái[b] bước qua bức tường.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giô-sép là cành sai quả, cành sai quả bên suối.” Câu Hê-bơ-rơ mang tính thi ca và rất cô đọng; cách dịch truyền thống “cành” diễn giải hình ảnh rõ hơn.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “các con gái”. Từ này có thể được hiểu theo nghĩa ẩn dụ là những cành hoặc chồi vươn qua tường.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן פֹּרָת
  choice: người con trĩu quả
  rationale: Giữ nghĩa thông thường của בֵּן là “người con” và sắc thái sinh hoa kết quả của פֹּרָת, đồng thời bảo tồn lối nói thi ca cô đọng thay vì trực tiếp biến hình ảnh thành “cành cây”.
- source_word: עֲלֵי עָיִן
  choice: bên suối
  rationale: עַיִן có thể chỉ “mắt” hoặc “mạch nước/suối”; trong ngữ cảnh về sự sinh sôi và cây cối, “bên suối” là cách hiểu tự nhiên nhất.
- source_word: בָּנוֹת
  choice: các con gái
  rationale: Dịch theo nghĩa từ vựng trực tiếp của בָּנוֹת, không âm thầm giải nghĩa thành “cành” hoặc “chồi”, qua đó giữ nguyên tính ẩn dụ và sự cô đọng của câu Hê-bơ-rơ.
- source_word: צָעֲדָה
  choice: bước
  rationale: Động từ diễn tả hành động bước hoặc sải bước; “bước” ngắn gọn và giữ được chuyển động trong hình ảnh thi ca.
- source_word: עֲלֵי שׁוּר
  choice: qua bức tường
  rationale: שׁוּר ở đây được hiểu là “tường”; “qua bức tường” diễn đạt tự nhiên hình ảnh vươn vượt một ranh giới.
