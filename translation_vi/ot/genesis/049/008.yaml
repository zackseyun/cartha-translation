  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của tiếng Hê-bơ-rơ: Giu-đa được các anh em ca ngợi, tay ở trên gáy quân thù, và các con trai của cha phủ phục trước ông. Cách thêm “sẽ đặt” trong mệnh đề hai là có thể chấp nhận để thành câu tiếng Việt, nhưng “sẽ ở trên” gần với mệnh đề danh từ không có động từ của nguyên ngữ hơn và không gợi một động tác cụ thể ngoài ý văn.'
