base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: vi
  text: 'Giu-đa[a], các anh em con sẽ ca ngợi con;

    tay con sẽ ở trên gáy kẻ thù;

    các con trai của cha con sẽ phủ phục trước con.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ, tên “Giu-đa” có âm vang với động từ được dịch là “ca ngợi”; động từ này cũng có thể mang nghĩa “cảm tạ” hoặc “thừa nhận”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Tên riêng được phiên âm theo cách dùng tiếng Việt phổ biến trong Kinh Thánh; đồng thời giữ được mối liên hệ âm thanh với động từ “ca ngợi” trong câu.
- source_word: יוֹדוּךָ
  choice: sẽ ca ngợi con
  rationale: Dạng Hiphil của ידה ở đây diễn tả việc công nhận và tôn vinh. “Ca ngợi” phù hợp với lời chúc phước và giữ được lối chơi chữ với tên Giu-đa; “cảm tạ con” là một khả năng từ vựng nhưng kém tự nhiên hơn trong ngữ cảnh.
- source_word: אַחֶיךָ
  choice: các anh em con
  rationale: Danh từ số nhiều giống đực với hậu tố ngôi hai số ít, chỉ các anh em trai của Giu-đa trong bối cảnh các con trai của Gia-cốp.
- source_word: יָדְךָ בְּעֹרֶף אֹיְבֶיךָ
  choice: tay con sẽ đặt trên gáy kẻ thù
  rationale: Giữ hình ảnh cụ thể của nguyên văn về quyền lực và chiến thắng. Tiếng Hê-bơ-rơ không có động từ hiện rõ trong mệnh đề này; thêm “sẽ đặt” để câu tiếng Việt tự nhiên mà không xác định quá mức cách hành động.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: sẽ phủ phục trước con
  rationale: Động từ chỉ hành động cúi mình hoặc phủ phục để bày tỏ sự quy phục, kính trọng hay thờ lạy tùy ngữ cảnh. Ở đây “phủ phục trước” giữ được sắc thái mạnh mà không mặc nhiên biến hành động thành sự thờ phượng thần linh.
- source_word: בְּנֵי אָבִיךָ
  choice: các con trai của cha con
  rationale: Dịch sát thành ngữ “các con trai của cha con”, tức các anh em của Giu-đa, đồng thời bảo toàn cách diễn đạt trang trọng của lời chúc phước.
theological_decisions:
- issue: Sắc thái của יִשְׁתַּחֲווּ לְךָ
  choice: Sự phủ phục biểu thị quy phục và tôn kính đối với một người
  alternative: Hiểu là thờ lạy theo nghĩa phụng thờ thần linh
  rationale: Người được nói trực tiếp là Giu-đa trong lời chúc phước của Gia-cốp. Bản dịch giữ ngôn ngữ tôn kính mang sắc thái vương quyền nhưng không đưa vào câu một khẳng định thần học vượt quá ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp thơ phù hợp với lời chúc phước. Dùng “con” vì Gia-cốp đang trực tiếp nói với Giu-đa; dùng “gáy” để diễn đạt chính xác עֹרֶף và “phủ phục” để giữ sắc thái mạnh của hành động quy phục.
