base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: vi
  text: Hãy tụ họp lại và lắng nghe, hỡi các con trai của Gia-cốp; hãy lắng nghe Y-sơ-ra-ên, cha các con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: Hãy tụ họp lại
  rationale: Động từ mệnh lệnh số nhiều thể Nifal kêu gọi các con trai tự quy tụ với nhau; “tụ họp lại” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái cùng nhau tập hợp.
- source_word: שִׁמְעוּ
  choice: lắng nghe
  rationale: Trong ngữ cảnh lời kêu gọi, động từ chỉ việc nghe chăm chú và tiếp nhận, không chỉ đơn thuần nghe thấy; “lắng nghe” diễn đạt rõ lực mệnh lệnh ấy.
- source_word: בְּנֵי יַעֲקֹב
  choice: các con trai của Gia-cốp
  rationale: Cụm Hê-bơ-rơ ở giống đực số nhiều và tại đây chỉ các con trai của Gia-cốp đang được triệu tập; cách dịch giữ rõ giới tính và quan hệ gia đình.
- source_word: שִׁמְעוּ אֶל
  choice: hãy lắng nghe
  rationale: Sự lặp lại động từ cùng giới từ אֶל nhấn mạnh lời kêu gọi chú tâm đến người đang nói; tiếng Việt không cần thêm “đến” sau “lắng nghe”.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Giữ tên riêng theo dạng phiên âm quen dùng trong tiếng Việt; đây là tên Y-sơ-ra-ên của chính Gia-cốp, tạo thế song song thi ca giữa hai tên.
- source_word: אֲבִיכֶם
  choice: cha các con
  rationale: 'Dịch trực tiếp cấu trúc sở hữu và đặt sau “Y-sơ-ra-ên” để giữ chức năng đồng vị: “Y-sơ-ra-ên, cha các con”.'
theological_decisions:
- issue: Cách thể hiện hai tên song song Gia-cốp / Y-sơ-ra-ên
  choice: 'Giữ riêng cả hai tên: “các con trai của Gia-cốp ... Y-sơ-ra-ên, cha các con”'
  alternative: Đồng nhất thành một tên để câu trôi chảy hơn
  rationale: Nguyên văn chủ ý dùng cả hai tên trong cấu trúc song song, mang hiệu quả thi ca và có thể gợi căn tính giao ước; không nên làm phẳng sự phân biệt này.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “hỡi” để thể hiện lời trực tiếp mang tính thi ca; lặp lại “hãy lắng nghe” theo nguyên văn nhằm giữ nhịp và sức nhấn mạnh.
