  terminology: “Gia-cốp,” “các con trai mình,” “trút hơi thở cuối cùng,” và “dân mình” đều phù hợp. “Truyền dặn” giữ được sắc thái trang trọng của צוה trong ngữ cảnh lời cuối, không áp đặt cách hiểu giáo phái nào.
  issues:
