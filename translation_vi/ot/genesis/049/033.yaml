  text: וַ/יְכַ֤ל יַעֲקֹב֙ לְ/צַוֺּ֣ת אֶת בָּנָ֔י/ו וַ/יֶּאֱסֹ֥ף רַגְלָ֖י/ו אֶל הַ/מִּטָּ֑ה וַ/יִּגְוַ֖ע וַ/יֵּאָ֥סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: vi
  text: Sau khi truyền dặn các con trai mình xong, Gia-cốp thu chân lên giường, trút hơi thở cuối cùng và được quy tụ về cùng dân mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Được quy tụ về cùng dân mình” là một thành ngữ Hê-bơ-rơ gắn với cái chết và sự đoàn tụ với dân mình; cụm từ này không chỉ đơn thuần nói đến việc chôn cất.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: xong
  rationale: Diễn tả việc Gia-cốp hoàn tất lời truyền dặn, đồng thời giữ mạch kể tiếp nối tự nhiên trong tiếng Việt.
- source_word: לְצַוֹּת
  choice: truyền dặn
  rationale: צוה có nghĩa là truyền lệnh hoặc căn dặn. Trong bối cảnh lời cuối dành cho các con, “truyền dặn” vừa trang trọng, tự nhiên, vừa không làm nhẹ đi thẩm quyền của lời nói.
- source_word: בָּנָיו
  choice: các con trai mình
  rationale: Bản Hê-bơ-rơ nói rõ đến các con trai của Gia-cốp; cách dịch này giữ chính xác giới tính và quan hệ sở hữu.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: thu chân lên giường
  rationale: Giữ hình ảnh cụ thể của động từ “gom, thu lại” nhưng diễn đạt tự nhiên hành động đưa chân trở lại lên giường.
- source_word: הַמִּטָּה
  choice: giường
  rationale: מִטָּה có thể chỉ giường hoặc trường kỷ; “giường” là cách hiểu trực tiếp và phù hợp nhất với cảnh lâm chung.
- source_word: וַיִּגְוַע
  choice: trút hơi thở cuối cùng
  rationale: Diễn đạt sắc thái “tắt thở, qua đời” của גוע và không gộp nó với mệnh đề kế tiếp.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: được quy tụ về với dân mình
  rationale: Giữ lại thành ngữ Hê-bơ-rơ và dạng bị động, thay vì giản lược thành việc chôn cất hoặc xác định quá mức ý niệm về tình trạng sau khi chết.
theological_decisions:
- issue: Ý nghĩa của cụm “được quy tụ về với dân mình”
  choice: Giữ nguyên hình ảnh quy tụ mà không đồng nhất với việc an táng.
  alternative: được chôn cùng tổ tiên; qua đời và về với tổ tiên
  rationale: Việc chôn cất Gia-cốp chỉ diễn ra ở chương sau. Vì vậy, cụm này không nên bị thu hẹp thành một thông báo về an táng; cách dịch được chọn bảo tồn sự căng mở của bản văn về cái chết và sự đoàn tụ với dân mình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Truyền dặn” phù hợp với bối cảnh lời cuối của người cha; “được quy tụ về với dân mình” cố ý giữ nét lạ và chiều sâu của thành ngữ nguồn.
