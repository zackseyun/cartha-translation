  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: vi
  text: Mắt người đỏ vì rượu, răng người trắng vì sữa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mắt người sẫm hơn rượu, răng người trắng hơn sữa”; hoặc vế đầu: “Mắt người long lanh vì rượu.” Tính từ Hê-bơ-rơ חַכְלִילִי rất hiếm, còn giới từ מִן có thể diễn tả nguyên nhân (“vì, do”) hoặc sự so sánh (“hơn”).'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: đỏ
  rationale: Tính từ hiếm này có thể chỉ sắc đỏ, sẫm hoặc vẻ long lanh. “Đỏ” phù hợp với liên hệ từ vựng trong Châm Ngôn 23:29 và với hình ảnh rượu dồi dào trong ngữ cảnh gần.
- source_word: עֵינַיִם
  choice: mắt
  rationale: Cách dịch trực tiếp và tự nhiên của danh từ số đôi chỉ đôi mắt.
- source_word: מִיָּיִן
  choice: vì rượu
  rationale: Giới từ מִן có thể chỉ nguyên nhân hoặc dùng trong so sánh. Ở đây chọn nghĩa nguyên nhân vì phù hợp với hình ảnh về sự dư dật trong câu trước, đồng thời ghi nhận cách hiểu so sánh trong chú thích.
- source_word: וּלְבֶן
  choice: răng người trắng
  rationale: Tính từ לָבָן mang nghĩa “trắng”; tiếng Việt cần nêu lại chủ thể một cách tự nhiên trong vế song song.
- source_word: שִׁנַּיִם
  choice: răng
  rationale: Cách dịch trực tiếp của danh từ số đôi chỉ răng.
- source_word: מֵחָלָב
  choice: vì sữa
  rationale: Hiểu מִן theo nghĩa nguyên nhân, song song với “vì rượu”; cách hiểu “trắng hơn sữa” vẫn có thể có và được bảo tồn trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong thơ ca trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Đại từ “người” giữ giọng chúc phước nói về Giu-đa; cấu trúc song song được bảo tồn. Bản chính ưu tiên cách hiểu nguyên nhân, còn chú thích giữ lại cách hiểu so sánh và sắc thái từ vựng chưa chắc chắn.
