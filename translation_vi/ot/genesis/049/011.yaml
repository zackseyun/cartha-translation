base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: vi
  text: 'Người ấy buộc con lừa non của mình vào cây nho[a],

    và lừa con của lừa cái của mình vào cây nho quý[b];

    người ấy giặt y phục của mình trong rượu,

    và áo choàng của mình trong máu nho[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hebrew עַיִר có thể chỉ lừa non hoặc lừa con.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cây nho tuyển chọn” hoặc “cây nho cao quý”; từ Hebrew שֹׂרֵקָה chỉ một cây hay giống nho hảo hạng.
    reason: lexical_alternative
  - marker: c
    text: “Máu nho” là hình ảnh thi ca Hebrew chỉ nước nho hoặc rượu; cách nói này được giữ lại để bảo tồn hình ảnh của nguyên văn.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: Người buộc
  rationale: Dạng phân từ Qal diễn tả một cảnh tượng sống động. Tiếng Việt không bắt buộc đánh dấu thì, nên “Người buộc” vừa tự nhiên vừa giữ được sắc thái miêu tả của lời chúc phước.
- source_word: לַגֶּפֶן
  choice: vào cây nho
  rationale: גֶּפֶן là cây nho. Giới từ chỉ sự gắn buộc được diễn đạt tự nhiên bằng “buộc ... vào”; danh từ số ít được giữ lại.
- source_word: עִירֹה
  choice: con lừa non của mình
  rationale: עַיִר chỉ lừa non hay lừa con. Cách dịch này biểu đạt rõ loài vật, độ non trẻ và hậu tố sở hữu.
- source_word: וְלַשֹּׂרֵקָה
  choice: và ... vào cây nho quý
  rationale: שֹׂרֵקָה chỉ giống/cây nho được tuyển chọn, có phẩm chất tốt. “Cây nho quý” ngắn gọn, trang trọng và giữ sắc thái phẩm chất đặc biệt.
- source_word: בְּנִי אֲתֹנוֹ
  choice: lừa con của lừa cái mình
  rationale: Cụm từ có nghĩa đen là “con của lừa cái của người ấy”. Bản dịch giữ quan hệ mẹ-con và quyền sở hữu mà không biến nó thành một loài vật khác.
- source_word: כִּבֵּס
  choice: người giặt
  rationale: Dạng hoàn thành trong thi ca có thể trình bày một hành động đặc trưng hoặc cảnh tượng mang hướng tương lai. Tiếng Việt không đánh dấu thì ở đây, nhờ đó giữ được độ mở của hình thái Hebrew.
- source_word: בַּיַּיִן
  choice: trong rượu
  rationale: Giữ hình ảnh cụ thể và phóng đại về việc giặt y phục trong rượu, thay vì làm nhẹ thành dùng rượu như một phương tiện.
- source_word: לְבֻשׁוֹ
  choice: y phục mình
  rationale: Danh từ số ít có thể mang nghĩa tập hợp là quần áo. “Y phục” tự nhiên trong văn phong trang trọng và đứng song song với “áo choàng”.
- source_word: וּבְדַם עֲנָבִים
  choice: và ... trong máu nho
  rationale: Giữ nguyên ẩn dụ thi ca cụ thể “máu nho”, thay vì giải nghĩa trực tiếp thành nước nho hay rượu.
- source_word: סוּתוֹ
  choice: áo choàng mình
  rationale: Đây là một từ chỉ trang phục, song song với לְבֻשׁוֹ. “Áo choàng” là cách gọi rõ ràng, trang trọng nhưng không xác định quá mức kiểu áo.
theological_decisions:
- issue: Hình ảnh về Đấng Mê-si hay về chi phái trong lời chúc phước dành cho Giu-đa
  choice: Giữ nguyên hình ảnh thi ca về sự dư dật phi thường và vẻ thịnh vượng vương giả, không thêm cách giải thích Mê-si trực tiếp vào câu dịch.
  alternative: Hiểu đây là lời tiên tri trực tiếp về Đấng Mê-si, hoặc chỉ là lời mô tả lịch sử về sự thịnh vượng của chi phái Giu-đa.
  rationale: Bản Hebrew trình bày cảnh tượng thi ca về nho và rượu dư dật. Mạch văn rộng hơn có thể được đọc theo nhiều hướng thần học, nhưng câu dịch không nên giải quyết thay người đọc điều bản văn không nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và có nhịp thơ. Phép lược động từ ở vế thứ hai và thứ tư phản ánh cấu trúc song song của Hebrew; “mình” được dùng làm từ sở hữu hồi chỉ, tránh cách nói quá cổ.
