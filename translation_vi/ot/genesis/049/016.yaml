  text: דָּ֖ן יָדִ֣ין עַמּ֑/וֹ כְּ/אַחַ֖ד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/016.yaml
  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: vi
  text: Đan sẽ xét xử dân mình như một trong các chi phái Y-sơ-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đan sẽ bênh vực dân mình”; động từ Hê-bơ-rơ có thể bao hàm ý bảo vệ hoặc đem lại công lý, chứ không chỉ tuyên án.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: Đan
  rationale: Tên riêng của con trai Gia-cốp và của chi phái mang tên ông; dùng dạng phiên âm quen thuộc trong tiếng Việt. Tên này có lối chơi chữ với động từ יָדִין (“xét xử”), dù khó giữ trọn trong bản dịch.
- source_word: יָדִין
  choice: sẽ xét xử
  rationale: Động từ Qal chưa hoàn thành ngôi ba số ít giống đực của דין, mang ý nghĩa tương lai trong lời chúc phước mang tính tiên báo. “Xét xử” giữ được nghĩa trực tiếp là thi hành sự phán xét hoặc quyền cai quản, đồng thời phần chú thích bảo lưu sắc thái bênh vực và đem lại công lý.
- source_word: עַמּוֹ
  choice: dân mình
  rationale: Danh từ עם với hậu tố ngôi ba số ít giống đực nghĩa là “dân của mình/người ấy”. Trong ngữ cảnh, đó nhiều khả năng là cộng đồng thuộc chi phái Đan; cách dịch không xác định cụ thể hơn nguyên văn.
- source_word: כְּאַחַד
  choice: như một
  rationale: Giới từ so sánh כ kết hợp với אחד tạo nghĩa “như một”. Cụm này trình bày Đan trong tư cách một chi phái giữa các chi phái Y-sơ-ra-ên.
- source_word: שִׁבְטֵי
  choice: các chi phái
  rationale: Dạng số nhiều liên kết của שֵׁבֶט. Trong ngữ cảnh dân Y-sơ-ra-ên, nghĩa rõ ràng là “các chi phái”, không phải nghĩa vật thể “gậy” hay “vương trượng”.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Tên riêng chỉ dân tộc Y-sơ-ra-ên; dùng dạng phiên âm Kinh Thánh quen thuộc và dễ nhận biết trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa vai trò của Đan trong lời chúc phước
  choice: Đan thi hành việc xét xử hoặc quyền cai quản dân mình với tư cách một trong các chi phái Y-sơ-ra-ên.
  alternative: Đan sẽ bênh vực dân mình hoặc đem lại công lý cho họ.
  rationale: Động từ דין có thể bao hàm xét xử, cai quản, bênh vực hoặc minh oan. Cụm so sánh “như một trong các chi phái Y-sơ-ra-ên” phù hợp với ý Đan có địa vị và thẩm quyền của một chi phái, nhưng không loại bỏ sắc thái bảo vệ hoặc đem lại công lý; vì vậy bản chính dùng “xét xử” và chú thích nêu phương án kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Xét xử” tự nhiên hơn “phán xét” khi nói về việc thi hành quyền tư pháp hoặc cai quản; “dân mình” giữ nguyên sự súc tích và độ mở của עַמּוֹ.
