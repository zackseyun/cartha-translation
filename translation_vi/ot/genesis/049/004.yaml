  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: vi
  text: Bồng bột như nước, con sẽ không vượt trội, vì con đã lên giường của cha con; lúc ấy con đã làm ô uế giường ta—nó đã lên đó![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt trôi chảy hơn: “Lúc ấy con đã làm ô uế giường ta—con đã lên đó.” Trong tiếng Hê-bơ-rơ, mệnh đề cuối đột ngột chuyển sang ngôi thứ ba: “nó đã lên”; đây có thể là lời cảm thán nhắc lại hành động của Ru-bên.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: Bồng bột
  rationale: Danh từ này diễn tả tính thiếu ổn định, liều lĩnh và không tự kiềm chế. “Bồng bột” là cách nói tự nhiên trong tiếng Việt, phù hợp với lời đánh giá về tính khí của Ru-bên mà không thu hẹp nghĩa chỉ còn sự bất ổn.
- source_word: כַּמַּיִם
  choice: như nước
  rationale: Giữ nguyên hình ảnh so sánh trực tiếp của tiếng Hê-bơ-rơ; nước gợi sự chuyển động khó giữ trong khuôn khổ.
- source_word: אַל תּוֹתַר
  choice: con sẽ không được trổi hơn
  rationale: Trong bối cảnh quyền trưởng nam, động từ יתר nói đến sự vượt trội hay địa vị ưu tiên. Cách dịch này vừa tự nhiên vừa không diễn giải quá cụ thể thành việc mất một chức vị nhất định.
- source_word: כִּי עָלִיתָ
  choice: vì con đã lên
  rationale: Giữ quan hệ nguyên nhân của כִּי và giữ lối nói giảm nhưng dễ hiểu của động từ “lên”, thay vì diễn giải rõ hành vi tình dục từ bối cảnh rộng hơn.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: giường của cha con
  rationale: Dạng Hê-bơ-rơ có hình thức số nhiều, nhưng ở đây chỉ nơi nằm hay giường hôn nhân của người cha; số ít là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: חִלַּלְתָּ
  choice: con đã làm ô uế
  rationale: Động từ mang nghĩa làm tục hóa hoặc làm ô uế. Trong bối cảnh tình dục và gia đình, “làm ô uế” truyền đạt rõ sức nặng luân lý mà không biến câu thành thuật ngữ nghi lễ.
- source_word: יְצוּעִי
  choice: giường ta
  rationale: Danh từ chỉ giường hoặc chỗ nằm; “giường ta” giữ nguyên ngôi thứ nhất và giọng nói trang trọng, trực tiếp của Gia-cốp.
- source_word: עָלָה
  choice: hắn đã lên đó
  rationale: Giữ sự chuyển đột ngột sang ngôi thứ ba số ít của bản Masoret. “Đó” được thêm theo nghĩa hàm ẩn để câu tiếng Việt có thể hiểu được, còn đại từ “hắn” bảo tồn cú sốc tu từ của sự đổi ngôi.
theological_decisions:
- issue: Lối nói giảm về hành vi tình dục và lời đánh giá đạo đức đối với Ru-bên
  choice: Giữ cách nói “lên giường của cha con” và dịch חִלַּלְתָּ là “làm ô uế”.
  alternative: Diễn giải rõ thành “ăn nằm với vợ lẽ của cha” hoặc dùng từ thiên về nghi lễ như “xúc phạm sự thánh”.
  rationale: Nguyên văn dùng lối nói giảm nhưng vẫn đủ rõ và không nêu trực tiếp mọi chi tiết của Sáng Thế Ký 35:22. Bản dịch giữ nguyên mức độ hàm ý ấy và sức nặng đạo đức của lời kết án.
- issue: Sự mơ hồ và đổi ngôi ở mệnh đề cuối עָלָה
  choice: 'Giữ ngôi thứ ba trong chính văn: “hắn đã lên đó”.'
  alternative: Làm trơn thành “con đã lên đó”, nối trực tiếp với lời Gia-cốp nói với Ru-bên.
  rationale: Hình thái Hê-bơ-rơ là ngôi thứ ba số ít và tạo ra một chỗ chuyển ngôi đột ngột. Giữ hình thức này trong chính văn bảo tồn sự căng thẳng của bản nguồn; chú thích cung cấp cách hiểu trôi chảy hơn mà không âm thầm quyết định vấn đề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp, dùng cách xưng hô “ta—con” thích hợp với lời người cha tuyên phán cho con. Câu giữ hình ảnh nước, lối nói giảm về tình dục và sự đổi ngôi bất thường ở cuối nguyên văn.
