revisions:
- from: Bồng bột như nước, con sẽ không được trổi hơn, vì con đã lên giường của cha con; bấy giờ con đã làm ô uế giường ta—hắn đã lên đó![a]
  to: Bồng bột như nước, con sẽ không vượt trội, vì con đã lên giường của cha con; lúc ấy con đã làm ô uế giường ta—nó đã lên đó![a]
  rationale: Chỉnh “con sẽ không được trổi hơn” thành “con sẽ không vượt trội” để diễn đạt rõ và tự nhiên hơn ý mất sự ưu trội. Đổi “bấy giờ” thành “lúc ấy” cho văn phong hiện đại. Mệnh đề cuối vẫn giữ ngôi thứ ba số ít theo bản Masoret và chú thích vẫn nêu cách làm trơn ở ngôi thứ hai.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:36:15Z'
