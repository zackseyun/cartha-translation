    rationale: עָז ở đây chỉ sức mạnh/mãnh lực trong thế song hành thi ca; “sức mạnh” là lựa chọn trung tính, sát nghĩa và tránh gợi liên tưởng thần học không cần thiết.
  - severity: low
    issue: Chú thích b dùng “hơn hết,” dễ chuyển lực so sánh thành tuyệt đối.
    rationale: יֶתֶר diễn tả sự vượt trội/preeminence; nên giữ “vượt trội” trong phương án thay thế.
