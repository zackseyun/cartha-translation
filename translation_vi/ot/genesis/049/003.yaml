base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: vi
  text: Ru-bên, con là con đầu lòng của cha, là sức mạnh của cha, là hoa quả đầu mùa của sinh lực cha[a], vượt trội về sự cao trọng và vượt trội về sức mạnh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khởi đầu sức lực của cha.” Cụm Hê-bơ-rơ nói đến kết quả hoặc biểu hiện đầu tiên của sinh lực sinh thành nơi người cha.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vượt trội về phẩm giá và vượt trội về sức mạnh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: con đầu lòng của cha
  rationale: Giữ cả thứ tự sinh lẫn địa vị đặc biệt của người con đầu lòng; tự nhiên hơn trong lời người cha nói trực tiếp với con.
- source_word: כֹּחִי
  choice: sức mạnh của cha
  rationale: Diễn đạt nghĩa thông dụng của כֹּחַ và giữ hình ảnh thơ về sức lực của người cha.
- source_word: רֵאשִׁית אוֹנִי
  choice: khởi đầu sinh lực của cha
  rationale: רֵאשִׁית chỉ sự khởi đầu hay biểu hiện đầu tiên, còn אוֹן ở đây có thể gợi sức sống và khả năng sinh thành. Cách dịch giữ được hàm ý ấy mà không quá lâm sàng.
- source_word: יֶתֶר שְׂאֵת
  choice: vượt trội về sự cao trọng
  rationale: יֶתֶר diễn tả tính hơn trội; שְׂאֵת có thể chỉ sự nâng cao, phẩm giá hoặc vinh dự. “Sự cao trọng” giữ được độ rộng nghĩa và sắc thái thi ca.
- source_word: יֶתֶר עָז
  choice: vượt trội về quyền năng
  rationale: Giữ cấu trúc song song với vế trước; עָז chỉ sức mạnh, uy lực hay quyền năng.
- source_word: אַתָּה
  choice: con là
  rationale: Đại từ độc lập mang tính nhấn mạnh trong lời xưng hô trực tiếp; tiếng Việt tự nhiên dùng “con là” trong ngữ cảnh người cha nói với con.
theological_decisions:
- issue: Hàm ý sinh thành của רֵאשִׁית אוֹנִי
  choice: khởi đầu sinh lực của cha
  alternative: đầu tiên của sức mạnh cha
  rationale: Bản dịch chính giữ hàm ý sức lực sinh thành của người cha nhưng không thu hẹp אוֹן thành một thuật ngữ sinh lý cụ thể.
- issue: Mức độ ưu việt trong יֶתֶר
  choice: vượt trội
  alternative: cao trọng nhất
  rationale: “Vượt trội” bảo toàn lực so sánh và ý niệm ưu thế mà không tự ý biến câu thành một khẳng định tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu nhịp điệu; dùng cách xưng hô “cha–con” để làm rõ lời trực tiếp của Gia-cốp với Rưu-bên. Phép lặp “vượt trội” tái hiện cấu trúc song song của nguyên văn.
