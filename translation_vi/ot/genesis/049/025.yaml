  terminology: “Đức Chúa Trời” và “Đấng Toàn Năng” phù hợp với văn cảnh và với quyết định dịch tước hiệu שַׁדַּי. “Phước lành” là thuật ngữ nhất quán, tự nhiên. Cần điều chỉnh cụm cuối để biểu thị số nhiều của “vú” và nghĩa “womb” của רָחַם.
