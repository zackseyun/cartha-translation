base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: vi
  text: 'nhờ Đức Chúa Trời của cha con[a], Đấng sẽ giúp đỡ con,

    nhờ Đấng Toàn Năng, Đấng sẽ ban phước cho con:

    những phước lành từ trời cao,

    những phước lành từ vực sâu nằm bên dưới[b],

    những phước lành của đôi vú và dạ con.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ Đức Chúa Trời của cha con… và với Đấng Toàn Năng.” Các giới từ và tiểu từ đứng trước “Đấng Toàn Năng” trong tiếng Hê-bơ-rơ có cú pháp cô đọng; câu này có thể được hiểu theo nghĩa nguồn, tác nhân hoặc đồng vị gần.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “vực sâu phục bên dưới.” Động từ Hê-bơ-rơ có thể mang nghĩa “nằm xuống” hoặc “phục”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל
  choice: nhờ Đức Chúa Trời
  rationale: Giới từ מִן ở đây có cú pháp cô đọng và có thể chỉ nguồn hoặc tác nhân. “Nhờ” diễn đạt tự nhiên tác nhân/nguồn của sự trợ giúp, đồng thời vẫn để chú thích bảo lưu cách hiểu “từ”.
- source_word: אָבִיךָ
  choice: của cha con
  rationale: Danh từ số ít với hậu tố ngôi hai số ít chỉ cha của Giô-sép trong lời chúc phước của Gia-cốp.
- source_word: יַעְזְרֶךָ
  choice: Đấng sẽ giúp đỡ con
  rationale: Động từ ngôi ba số ít giống đực cùng hậu tố tân ngữ ngôi hai được diễn đạt thành mệnh đề quan hệ để làm rõ Đức Chúa Trời là chủ thể.
- source_word: אֵת שַׁדַּי
  choice: nhờ Đấng Toàn Năng
  rationale: אֵת trước שַׁדַּי có chức năng bất thường, có thể biểu thị sự phối hợp hoặc đồng vị. “Nhờ” giữ thế song song với vế trước mà không coi từ này đơn thuần là dấu hiệu tân ngữ.
- source_word: שַׁדַּי
  choice: Đấng Toàn Năng
  rationale: Dịch tước hiệu thay vì phiên âm, theo cách dùng rõ ràng và trang trọng trong tiếng Việt.
- source_word: וִיבָרְכֶךָ
  choice: Đấng sẽ ban phước cho con
  rationale: Mệnh đề quan hệ làm rõ chủ thể ngôi ba số ít và giữ sắc thái hướng tới tương lai trong lời chúc phước.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: những phước lành từ trời cao
  rationale: Cách dịch tự nhiên, bảo toàn hình ảnh phương vị phía trên và sự đối xứng với vực sâu bên dưới.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: vực sâu nằm bên dưới
  rationale: תְּהוֹם chỉ vực nước sâu; רֹבֶצֶת có thể là “nằm” hoặc “phục”. “Nằm” tự nhiên khi nói về những khối nước ngầm, còn nghĩa kia được ghi chú.
- source_word: שָׁדַיִם
  choice: bầu vú
  rationale: Giữ hình ảnh cụ thể về sự nuôi dưỡng và khả năng sinh sản; “bầu vú” tự nhiên và trang trọng hơn “vú” đứng riêng trong ngữ cảnh thơ.
- source_word: רָחַם
  choice: dạ mẹ
  rationale: Chỉ tử cung/dạ con trong cặp hình ảnh về sự sinh sản. “Dạ mẹ” dễ hiểu, giàu tính thi ca và không mang sắc thái y khoa.
theological_decisions:
- issue: Cách dịch tước hiệu שַׁדַּי
  choice: Đấng Toàn Năng
  alternative: Sa-đai
  rationale: Dịch nghĩa tước hiệu truyền đạt chức năng của danh xưng trong lời chúc phước mà không thêm một khẳng định giáo lý ngoài văn bản.
- issue: Quan hệ cú pháp giữa מֵאֵל, אֵת שַׁדַּי và các động từ
  choice: Hai cụm “nhờ...” chỉ nguồn/tác nhân, theo sau là các mệnh đề quan hệ
  alternative: “từ Đức Chúa Trời của cha con... và với Đấng Toàn Năng” hoặc xem “Đấng Toàn Năng” là đồng vị
  rationale: Bản dịch chính cần sáng nghĩa trong tiếng Việt, nhưng cú pháp Hê-bơ-rơ thực sự cô đọng; chú thích bảo lưu các quan hệ nguồn, tác nhân và đồng vị có thể có.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu; giữ nhịp thơ bằng cách xuống dòng và duy trì thế đối xứng “trời cao/vực sâu bên dưới”. Đại từ “cha con/con” phù hợp lời Gia-cốp trực tiếp nói với Giô-sép. Hình ảnh sinh sản cụ thể của nguyên văn được giữ lại, không uyển ngữ hóa.
