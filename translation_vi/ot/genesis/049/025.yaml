  source_fidelity: 'Bản dịch tái hiện đúng các yếu tố chính của câu: nguồn/tác nhân thần linh được diễn đạt bằng “nhờ,” hai động từ ở ngôi ba số ít được làm rõ bằng mệnh đề quan hệ, và các phước lành trời cao, vực sâu bên dưới, cùng khả năng sinh sản được giữ lại. Chú thích a bảo lưu thích đáng cú pháp Hê-bơ-rơ cô đọng và đang tranh luận. Tuy nhiên, “bầu vú” ở số ít không phản ánh rõ danh từ số nhiều שָׁדַיִם; “dạ con” cũng là tương đương chính xác và hiện hành hơn cho רָחַם trong cặp hình ảnh này.'
