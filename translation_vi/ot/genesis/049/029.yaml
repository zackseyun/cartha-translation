  text: וַ/יְצַ֣ו אוֹתָ֗/ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל עַמִּ֔/י קִבְר֥וּ אֹתִ֖/י אֶל אֲבֹתָ֑/י אֶל הַ֨/מְּעָרָ֔ה אֲשֶׁ֥ר בִּ/שְׂדֵ֖ה עֶפְר֥וֹן הַֽ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: vi
  text: 'Rồi ông truyền lệnh cho họ và nói: “Ta sắp được quy tụ về với dân ta.[a] Hãy chôn ta cùng với tổ phụ ta, trong hang ở cánh đồng của Ép-rôn, người Hê-tít,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đang được quy tụ về với dân ta.” Thành ngữ Hê-bơ-rơ nói đến cái chết cận kề và việc được đoàn tụ với dân mình hoặc tổ tiên trong sự chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền dặn
  rationale: Động từ צוה mang sắc thái giao mệnh lệnh hoặc lời căn dặn trang trọng. “Truyền dặn” giữ được sức nặng của lời chỉ thị mà vẫn tự nhiên trong lời trăng trối.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: họ rằng
  rationale: Kết hợp tự nhiên với “truyền dặn” trong tiếng Việt, tránh lặp cứng “và nói với họ” nhưng vẫn bảo toàn hành vi phát ngôn.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: Ta sắp được quy tụ về với dân ta
  rationale: Giữ nguyên hình ảnh bị động của אסף và ý nghĩa cận kề trong ngữ cảnh, thay vì giản lược thành “Ta sắp chết”. “Về với” diễn đạt tự nhiên hướng đến cộng đồng của mình.
- source_word: עַמִּי
  choice: dân ta
  rationale: Dịch sát “my people”, giữ âm hưởng cộng đồng và chiều kích thần học của thành ngữ chỉ cái chết, thay vì thu hẹp thành “họ hàng” hay “tổ tiên”.
- source_word: קִבְרוּ אֹתִי
  choice: Hãy chôn ta
  rationale: Mệnh lệnh số nhiều được diễn đạt bằng “hãy”; đại từ “ta” phù hợp lời của vị gia trưởng đang nói với các con.
- source_word: אֶל־אֲבֹתָי
  choice: bên tổ phụ ta
  rationale: Trong ngữ cảnh mai táng, אֶל chỉ việc được chôn cùng hoặc cạnh các tổ phụ. “Bên” tự nhiên và tránh khiến người đọc hiểu rằng chính tổ phụ là đích đến theo nghĩa trừu tượng.
- source_word: הַמְּעָרָה
  choice: hang đá
  rationale: Dịch danh từ theo nghĩa thông thường, không thêm ý “mộ” vốn không có trực tiếp trong từ Hê-bơ-rơ.
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: ở cánh đồng của Ép-rôn
  rationale: Giữ quan hệ sở hữu và vị trí của mệnh đề Hê-bơ-rơ trong cách diễn đạt tiếng Việt rõ ràng.
- source_word: הַחִתִּי
  choice: người Hê-tít
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với danh xưng dân tộc của Ép-rôn.
theological_decisions:
- issue: Ý nghĩa của thành ngữ “được quy tụ về với dân ta”
  choice: Giữ thành ngữ thay vì chỉ dịch là “Ta sắp chết”
  alternative: Ta sắp chết
  rationale: Cụm từ nói đến cái chết sắp xảy ra nhưng đồng thời gợi sự hội tụ với cộng đồng hoặc tổ tiên trong cõi chết. Giữ hình ảnh này bảo toàn độ mở và sức căng thần học của nguyên văn mà không xây dựng thêm một giáo lý chi tiết về đời sau.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông/họ” trong lời dẫn và “ta” trong lời trực tiếp để phù hợp bối cảnh gia trưởng. Tên riêng được phiên âm có dấu: Ép-rôn, Hê-tít.'
