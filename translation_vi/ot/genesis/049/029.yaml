revisions:
- from: 'Rồi ông truyền dặn họ rằng: “Ta sắp được quy tụ về với dân ta.[a] Hãy chôn ta bên tổ phụ ta, trong hang đá ở cánh đồng của Ép-rôn, người Hê-tít,”'
  to: 'Rồi ông truyền lệnh cho họ và nói: “Ta sắp được quy tụ về với dân ta.[a] Hãy chôn ta cùng với tổ phụ ta, trong hang ở cánh đồng của Ép-rôn, người Hê-tít,”'
  rationale: Bản sửa khôi phục rõ hai hành động “truyền lệnh” và “nói” của nguyên văn, làm cách diễn đạt về việc mai táng tự nhiên hơn, và điều chỉnh chú thích để giải thích thành ngữ mà không xác định quá mức về đời sau. Dấu phẩy cuối câu được giữ vì câu nói tiếp tục sang câu kế.
