  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: vi
  text: 'Hồn tôi chớ dự vào hội đồng của chúng[a];

    danh dự tôi chớ hiệp với hội chúng của chúng[b].

    Vì trong cơn giận của chúng, chúng đã giết một người;

    và theo ý riêng của mình, chúng đã cắt gân kheo một con bò đực[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hội kín của chúng”; סוֹד có thể chỉ một hội đồng thân cận hoặc kín đáo.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vinh quang tôi chớ hiệp với hội chúng của chúng.”'
    reason: lexical_alternative
  - marker: c
    text: 'Bản Hê-bơ-rơ Masoret đọc שׁוֹר là “bò đực/bò”. Một số cách hiểu khác dịch vế này là: “chúng đã phá đổ một bức tường.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: hội bàn của chúng
  rationale: סוֹד có thể chỉ một nhóm thân cận cùng bàn bạc, đôi khi mang tính kín đáo. “Hội bàn” giữ được ý một nhóm nghị bàn và tạo thế song song với קָהָל mà không mặc nhiên khẳng định tính bí mật.
- source_word: תָּבֹא נַפְשִׁי
  choice: Hồn tôi đừng bước vào
  rationale: Cấu trúc אַל với động từ dạng mệnh lệnh gián tiếp diễn tả lời mong muốn hoặc ngăn cấm. Giữ “hồn tôi” bảo tồn hình ảnh và sức thơ của נֶפֶשׁ thay vì giản lược thành “tôi”.
- source_word: בִּקְהָלָם
  choice: hội chúng của chúng
  rationale: קָהָל chỉ một cộng đồng hay đoàn người tụ họp. “Hội chúng” vừa trang trọng, dễ hiểu, vừa giữ sự đối xứng với “hội bàn” ở vế trước.
- source_word: תֵּחַד כְּבֹדִי
  choice: danh dự tôi đừng nhập vào
  rationale: יָחַד ở đây có ý kết hợp hay nhập chung; כָּבוֹד có thể là vinh quang, danh dự hoặc thanh danh. “Danh dự” phù hợp với việc Gia-cốp tách mình khỏi hành động bạo lực, còn “nhập vào” diễn đạt tự nhiên sự liên kết với hội chúng.
- source_word: בְאַפָּם
  choice: trong cơn giận
  rationale: אַף theo nghĩa thành ngữ là cơn giận hay thịnh nộ. Cách dịch này rõ ràng, tự nhiên và giữ sắc thái mạnh.
- source_word: הָרְגוּ אִישׁ
  choice: chúng đã giết một người
  rationale: Giữ số ít của אִישׁ và không khái quát hóa câu nói, nhờ đó vẫn có thể gợi đến biến cố tại Si-chem.
- source_word: וּבִרְצֹנָם
  choice: theo ý riêng mình
  rationale: רָצוֹן có thể chỉ ý muốn, sự ưa thích hay điều làm người ta hài lòng. Trong ngữ cảnh lên án này, “theo ý riêng mình” truyền đạt hành động cố ý và buông theo ý mình mà không diễn giải quá mức.
- source_word: עִקְּרוּ
  choice: cắt gân chân
  rationale: עקר khi dùng với súc vật thường chỉ việc cắt gân làm con vật bị què. “Cắt gân chân” cụ thể và dễ hiểu hơn một thuật ngữ kỹ thuật.
- source_word: שׁוֹר
  choice: một con bò đực
  rationale: Theo cách ghi nguyên âm của bản Masoret, שׁוֹר là bò đực/bò. “Một con bò đực” giữ cách đọc truyền thống và hợp với động từ chỉ việc cắt gân.
theological_decisions:
- issue: Cách hiểu כְּבֹדִי trong lời thơ Gia-cốp tách mình khỏi hành động của Si-mê-ôn và Lê-vi
  choice: danh dự tôi
  alternative: vinh quang tôi
  rationale: “Danh dự” diễn đạt tự nhiên phẩm giá hoặc thanh danh cá nhân trong ngữ cảnh này, đồng thời tránh gán cho từ “vinh quang” một hàm ý thần học không bắt buộc. Cách đọc thay thế được ghi ở chú thích.
- issue: Cách hiểu שׁוֹר ở vế cuối
  choice: một con bò đực
  alternative: một bức tường
  rationale: Cách ghi nguyên âm Masoret đọc từ này là “bò đực/bò”, và sự kết hợp với עקר hỗ trợ ý cắt gân con vật. Tuy nhiên, cách hiểu phụ âm theo hướng “bức tường” là một phương án giải thích đáng kể nên được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong thơ trang trọng nhưng hiện đại, dùng các dòng song song để phản ánh cấu trúc Hê-bơ-rơ. “Hồn tôi” giữ sắc thái thi ca; “cắt gân chân” là cách nói cụ thể, dễ hiểu. Tránh từ ngữ mang dấu ấn hệ phái.
