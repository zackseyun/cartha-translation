- from: Người thấy chốn nghỉ ngơi thật tốt[a], và đất đai thật dễ chịu; người bèn ghé vai mang gánh, và trở thành người phục dịch lao dịch cưỡng bức[b].
  to: Người thấy chốn nghỉ ngơi thật tốt[a], và đất đai thật dễ chịu; người bèn cúi vai để mang vác, và trở thành người phải làm lao dịch cưỡng bức[b].
  rationale: Bản sửa làm rõ hình ảnh cúi vai để chịu gánh và thay cụm danh từ không tự nhiên bằng một cách diễn đạt tiếng Việt hiện đại, rõ nghĩa. Văn bản chính vẫn chọn nghĩa lao dịch cưỡng bức có khả năng cao hơn cho לְמַס עֹבֵד; chú thích bảo lưu các cách hiểu xã hội khác của cụm từ đang được tranh luận.
