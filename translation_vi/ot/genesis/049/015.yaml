source:
  edition: WLC
  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: vi
  text: Người thấy chốn nghỉ ngơi thật tốt[a], và đất đai thật dễ chịu; người bèn cúi vai để mang vác, và trở thành người phải làm lao dịch cưỡng bức[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự nghỉ ngơi thật tốt.” Từ Hê-bơ-rơ có thể chỉ “sự nghỉ ngơi” hoặc “chốn nghỉ ngơi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trở thành người phục dịch chịu cống nạp” hoặc “trở thành lao nô.” Cụm từ Hê-bơ-rơ thường nói đến lao dịch cưỡng bức, nhưng sắc thái chính xác còn được tranh luận.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: chốn nghỉ ngơi
  rationale: Danh từ có thể chỉ sự nghỉ ngơi hoặc nơi nghỉ ngơi. Trong thế song song với “đất đai”, nghĩa cụ thể “chốn nghỉ ngơi” phù hợp hơn, nhưng nghĩa trừu tượng được giữ trong chú thích.
- source_word: טוֹב
  choice: thật tốt
  rationale: Giữ nét nghĩa rộng và giản dị của tính từ Hê-bơ-rơ; “thật” diễn đạt tự nhiên kết cấu כִּי dùng để nêu điều người nhận thấy.
- source_word: הָאָרֶץ
  choice: đất đai
  rationale: Trong lời chúc phước dành cho một chi phái, từ này chỉ vùng đất hay lãnh thổ, không phải toàn thể trái đất.
- source_word: נָעֵמָה
  choice: thật dễ chịu
  rationale: Diễn tả vùng đất đáng ưa, thuận lợi; cách nói tiết chế và tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיֵּט שִׁכְמוֹ
  choice: người bèn ghé vai
  rationale: 'Giữ hình ảnh thân thể của nguyên văn: nghiêng hoặc hạ vai xuống để nhận lấy một gánh nặng.'
- source_word: לִסְבֹּל
  choice: mang gánh
  rationale: Động từ chỉ việc mang hoặc chịu một vật nặng; thêm “gánh” làm rõ hình ảnh vốn hàm chứa trong động từ mà vẫn súc tích.
- source_word: לְמַס עֹבֵד
  choice: người phục dịch lao dịch cưỡng bức
  rationale: מַס thường chỉ chế độ lao dịch bắt buộc; עֹבֵד chỉ người phục dịch. Cách dịch giữ cả hai thành tố mà không khẳng định quá mức rằng đây là chế độ nô lệ sở hữu.
theological_decisions:
- issue: Tính chất sự lệ thuộc của Y-sa-ca trong mệnh đề cuối
  choice: trở thành người phục dịch lao dịch cưỡng bức
  alternative: trở thành người phục dịch nộp cống; trở thành lao nô
  rationale: מַס thường nghiêng về lao dịch cưỡng bức, nhưng sắc thái xã hội chính xác của cụm từ vẫn còn được tranh luận. Bản chính phản ánh nghĩa có khả năng cao hơn, còn các cách hiểu khác được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong thơ trang trọng nhưng dễ hiểu. Dùng đại từ “người” để chỉ Y-sa-ca được nhân cách hóa trong lời chúc phước; giữ hình ảnh “ghé vai mang gánh” và sự mơ hồ thực sự ở hai cụm מְנֻחָה và לְמַס עֹבֵד.
