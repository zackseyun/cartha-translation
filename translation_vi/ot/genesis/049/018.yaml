  text: לִֽ/ישׁוּעָתְ/ךָ֖ קִוִּ֥יתִי יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: vi
  text: Tôi trông đợi sự cứu rỗi của Ngài, lạy Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi đã trông đợi sự giải cứu của Ngài, lạy Yahweh.” Động từ Hê-bơ-rơ cũng có thể được dịch là “đã trông đợi,” và “sự cứu rỗi” cũng có thể dịch là “sự giải cứu.” Danh Đức Chúa Trời trong nguyên văn là YHWH.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: sự cứu rỗi của Ngài
  rationale: Danh từ יְשׁוּעָה chỉ sự cứu thoát hoặc cứu rỗi; “sự cứu rỗi” giữ được phạm vi rộng của từ trong lời thơ này. Giới từ לִ được diễn đạt tự nhiên qua cấu trúc “trông đợi” trong tiếng Việt.
- source_word: קִוִּיתִי
  choice: con trông đợi
  rationale: Động từ קוה diễn tả sự chờ đợi đầy hy vọng. “Trông đợi” vừa tự nhiên vừa bảo toàn sắc thái mong chờ; ngôi thứ nhất “con” phù hợp với lời trực tiếp hướng về Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng bốn phụ âm YHWH, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH; phiên âm “Yahweh” bảo toàn đây là danh riêng, không biến nó thành tước hiệu.
- issue: Phạm vi nghĩa của יְשׁוּעָה
  choice: sự cứu rỗi
  alternative: sự giải cứu
  rationale: “Sự cứu rỗi” giữ ý nghĩa rộng, trong khi “sự giải cứu” là một khả năng từ vựng hợp lệ và được nêu trong chú thích, tránh thu hẹp câu vào một loại nguy biến cụ thể.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và có chất thơ. Trật tự tiếng Việt ưu tiên tính tự nhiên, trong khi lời xưng hô “lạy Yahweh” giữ rõ sắc thái cầu khẩn trực tiếp.
