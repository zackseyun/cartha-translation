  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: vi
  text: 'Nép-ta-li là một con nai cái được thả tự do,

    và nói những lời đẹp đẽ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một con hươu cái được thả ra.” Hình ảnh Hê-bơ-rơ là con vật giống cái thuộc họ hươu nai được thả để chạy tự do. Mệnh đề cuối cũng được hiểu theo những cách khác nhau: có thể là Nép-ta-li ban hoặc nói những lời đẹp đẽ; theo một cách đọc/giải thích khác về các từ cuối, có thể là con nai sinh những nai con đẹp.'
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: Nép-ta-li
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt cho tên riêng Náp-ta-li/Naphtali.
- source_word: אַיָּלָה
  choice: nai cái
  rationale: Danh từ chỉ con hươu hoặc nai giống cái; “nai cái” rõ nghĩa, tự nhiên và giữ nguyên hình ảnh giống cái của tiếng Hê-bơ-rơ.
- source_word: שְׁלֻחָה
  choice: được thả tự do
  rationale: Dạng bị động của שלח trong hình ảnh thơ này diễn tả con vật được tháo thả để chạy tự do; cách dịch này tự nhiên hơn lối dịch máy móc “được sai đi”.
- source_word: הַנֹּתֵן
  choice: người thốt ra
  rationale: Phân từ giống đực số ít có mạo từ nhiều khả năng quy về Nép-ta-li, chứ không hòa hợp với “nai cái”; “thốt ra” phù hợp với đối tượng trực tiếp là lời nói và giữ nhịp thơ.
- source_word: אִמְרֵי
  choice: những lời lẽ
  rationale: Dạng số nhiều liên kết của אֵמֶר chỉ những lời nói hoặc lời phát biểu; “lời lẽ” tự nhiên trong tiếng Việt và hợp với sắc thái thi ca.
- source_word: שָׁפֶר
  choice: đẹp đẽ
  rationale: Diễn tả vẻ đẹp, sự thanh nhã hoặc dễ chịu; “đẹp đẽ” giữ được ý rộng và sắc thái thi ca.
theological_decisions:
- issue: Chủ thể cú pháp của mệnh đề phân từ cuối câu
  choice: Dịch “người thốt ra những lời lẽ đẹp đẽ”, để phân từ giống đực quy về Nép-ta-li qua hình ảnh ẩn dụ.
  alternative: Có thể hiểu mệnh đề cuối tiếp tục nói về con nai cái, hoặc theo một cách giải thích khác là “sinh ra những nai con xinh đẹp”.
  rationale: Nguyên văn rất cô đọng. Cách chấm nguyên âm Masoret ủng hộ nghĩa “ban/thốt ra những lời đẹp đẽ”, còn giống đực của phân từ thích hợp với Nép-ta-li. Chú thích vẫn bảo lưu cách hiểu khác thay vì loại bỏ sự mơ hồ của câu thơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp thơ. Xuống dòng làm nổi bật cấu trúc song hành; “nai cái” dễ hiểu với độc giả phổ thông, còn chú thích ghi nhận lựa chọn “hươu cái” và sự bất định của vế cuối.
