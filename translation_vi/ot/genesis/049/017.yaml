source:
  edition: WLC
  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: vi
  text: 'Nguyện Đan là con rắn bên đường,

    là rắn độc[a] bên lối đi,

    cắn vào gót ngựa,

    khiến người cưỡi ngã ngửa ra sau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שְׁפִיפֹן rất hiếm; cũng có thể dịch là “rắn sừng”. Không xác định chắc chắn được loài rắn, nhưng ngữ cảnh cho thấy đây là một loài rắn nguy hiểm.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Nguyện ... là
  rationale: Dạng mệnh lệnh gián tiếp của היה trong lời chúc phước vừa mang sắc thái ước nguyện vừa có sức nặng tuyên bố; “Nguyện ... là” bảo toàn sắc thái này tự nhiên hơn một câu tương lai thuần túy.
- source_word: דָן
  choice: Đan
  rationale: Tên riêng của con trai và chi tộc của Gia-cốp, được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: נָחָשׁ
  choice: con rắn
  rationale: Danh từ chỉ rắn nói chung; lựa chọn phổ thông, rõ nghĩa và phù hợp với hình ảnh thơ.
- source_word: עֲלֵי דֶרֶךְ
  choice: bên đường
  rationale: Diễn tả vị trí con rắn phục ở cạnh đường; cách nói ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: שְׁפִיפֹן
  choice: rắn độc
  rationale: Từ Hê-bơ-rơ hiếm, chỉ một loại rắn nguy hiểm nhưng không thể xác định chắc chắn loài; “rắn độc” truyền đạt nét nghĩa chính mà không khẳng định quá mức về động vật học.
- source_word: עֲלֵי אֹרַח
  choice: bên lối đi
  rationale: Giữ phép song đối với “bên đường” đồng thời phân biệt hai từ gần nghĩa דֶרֶךְ và אֹרַח.
- source_word: הַנֹּשֵׁךְ
  choice: cắn vào
  rationale: Phân từ mô tả hành động đặc trưng của con rắn; “cắn vào” nối tự nhiên với đối tượng là gót ngựa.
- source_word: עִקְּבֵי סוּס
  choice: gót ngựa
  rationale: Cụm từ chỉ phần gót hoặc phía sau chân ngựa; số ít mang nghĩa khái quát.
- source_word: וַיִּפֹּל
  choice: khiến ... ngã
  rationale: Quan hệ nối tiếp trong ngữ cảnh thể hiện kết quả của cú cắn; “khiến” làm rõ quan hệ nhân quả vốn có trong hình ảnh.
- source_word: רֹכְבוֹ
  choice: người cưỡi
  rationale: Hậu tố sở hữu quy chiếu tự nhiên về con ngựa; trong tiếng Việt, “người cưỡi” đủ rõ trong ngữ cảnh và tránh lối diễn đạt nặng nề.
- source_word: אָחוֹר
  choice: ngã ngửa ra sau
  rationale: Diễn tả hướng ngã về phía sau; thành ngữ tiếng Việt này vừa tự nhiên vừa giữ trọn hình ảnh.
theological_decisions:
- issue: Lời nói về Đan là ước nguyện hay lời tiên báo
  choice: Dùng “Nguyện Đan là” để giữ sắc thái ý nguyện của hình thái Hê-bơ-rơ.
  alternative: “Đan sẽ là” theo cách hiểu như một lời tiên báo trực tiếp.
  rationale: Ngữ pháp cho phép nhận thấy sức nặng tuyên bố trong lời chúc phước, nhưng hình thái động từ có sắc thái mệnh lệnh gián tiếp; bản dịch không nên giản lược thành một thì tương lai thuần túy.
translation_notes:
  register: Thể thơ tự do bốn dòng giữ phép song đối và nhịp cô đọng của lời chúc phước. Ngôn ngữ hiện đại, trang trọng nhưng dễ hiểu; hình ảnh ẩn dụ trực tiếp “Đan là con rắn” được giữ nguyên, không đổi thành phép so sánh.
