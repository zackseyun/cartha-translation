revisions:
- from: Cánh đồng và hang ở trong đó là tài sản đã mua từ con cháu Hếch[a][b].
  to: Cánh đồng và hang trong đó đã được mua từ con cháu Hết[a][b].
  rationale: Bản sửa dùng câu bị động tự nhiên để diễn đạt điều đã được mua, giữ nguyên cánh đồng, hang ở trong cánh đồng, nguồn mua, và cách gọi “con cháu” của nguyên văn. Tên riêng được chuẩn hóa thành “Hết”; hai chú thích được cập nhật đồng nhất với bản văn.
  reviewer_model: gpt-5.6-terra
