translation_notes:
  register: Dùng văn phong hiện đại, trang trọng và dễ hiểu. “Tài sản đã mua” thể hiện câu danh từ cô đọng của nguyên văn nhưng tránh cấu trúc gượng trong tiếng Việt; các chú thích bảo lưu cách gọi dân tộc và khả năng dịch sát cấu trúc hơn.
