lexical_decisions:
- source_word: מִקְנֵה
  choice: tài sản đã mua
  rationale: Danh từ này chỉ điều có được bằng việc mua. Trong ngữ cảnh, cách dịch này vừa giữ ý về quyền sở hữu đã được xác lập qua giao dịch, vừa tạo thành một câu tiếng Việt tự nhiên.
- source_word: הַשָּׂדֶה
  choice: cánh đồng
  rationale: Cách dịch thông dụng và phù hợp với ngữ cảnh sở hữu đất.
- source_word: וְהַמְּעָרָה
  choice: và hang
  rationale: Giữ nguyên hai đối tượng được mua và liên từ nối chúng.
- source_word: אֲשֶׁר בּוֹ
  choice: ở trong đó
  rationale: Diễn đạt tự nhiên quan hệ vị trí của hang đối với cánh đồng; đại từ “đó” quy chiếu về cánh đồng.
- source_word: מֵאֵת
  choice: từ
  rationale: Biểu thị nguồn mà tài sản được mua; không cần dịch dài thành “từ tay” trong tiếng Việt.
- source_word: בְּנֵי חֵת
  choice: con cháu Hếch
  rationale: Giữ cách gọi theo quan hệ dòng dõi trong tiếng Hê-bơ-rơ; “người Hê-tít” là cách diễn đạt tương đương theo tên dân tộc.
