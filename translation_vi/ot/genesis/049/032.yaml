  text: Cánh đồng và hang trong đó đã được mua từ con cháu Hết[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người Hê-tít.” Tiếng Hê-bơ-rơ chép là “con cháu Hết.”
    reason: lexical_alternative
