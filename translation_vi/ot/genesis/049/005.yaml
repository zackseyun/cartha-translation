base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/005.yaml
  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: vi
  text: Si-mê-ôn và Lê-vi là anh em; khí cụ bạo lực là gươm của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Từ Hê-bơ-rơ được dịch là “gươm của họ” rất hiếm và nghĩa không chắc. Có thể hiểu là “dụng cụ của họ”; khi đó cả vế có thể dịch: “khí cụ bạo lực là dụng cụ của họ.” Một số bản dịch xưa dịch là “nơi cư ngụ của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן
  choice: Si-mê-ôn
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: וְלֵוִי
  choice: và Lê-vi
  rationale: Dịch liên từ וְ là “và” và phiên âm tên riêng theo cách viết quen thuộc trong tiếng Việt.
- source_word: אַחִים
  choice: là anh em
  rationale: Danh từ chỉ anh em trai; thêm “là” để diễn đạt tự nhiên mệnh đề không động từ trong tiếng Hê-bơ-rơ.
- source_word: כְּלֵי
  choice: khí cụ
  rationale: Từ có nghĩa rộng là đồ dùng, dụng cụ hoặc vũ khí. “Khí cụ” giữ được nghĩa công cụ dùng cho bạo lực mà không xác định quá mức.
- source_word: חָמָס
  choice: bạo lực
  rationale: Diễn đạt trực tiếp ý nghĩa bạo lực hoặc hành vi sai trái mang tính bạo lực.
- source_word: מְכֵרֹתֵיהֶם
  choice: vũ khí của họ
  rationale: Từ Hê-bơ-rơ hiếm và không chắc nghĩa. Ngữ cảnh ủng hộ cách hiểu là vật dụng hoặc vũ khí, nhưng bản dịch chính tránh cụ thể hóa thành “gươm” khi căn cứ từ vựng không chắc chắn.
