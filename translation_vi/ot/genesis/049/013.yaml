revisions:
- from: '“Sa-bu-lôn sẽ ở bên bờ các biển[a];

    người sẽ ở bên bờ tàu thuyền,

    và sườn đất của người sẽ hướng về Si-đôn.[b]”'
  to: '“Sa-bu-lôn sẽ ở bên bờ các biển[a];

    người sẽ ở bên bờ biển dành cho tàu thuyền,

    và vùng rìa của người sẽ hướng về Si-đôn.[b]”'
  rationale: Sửa hai cụm từ để tiếng Việt hiện đại tự nhiên và rõ hơn. Bản sửa vẫn giữ số nhiều «các biển», đại từ nhân cách hóa chi phái, hình ảnh bờ biển gắn với tàu thuyền, và sự mơ hồ có chủ ý của từ chỉ cạnh/phần xa của lãnh thổ. Các mỏ chú thích [a] và [b] được giữ đúng vị trí.
