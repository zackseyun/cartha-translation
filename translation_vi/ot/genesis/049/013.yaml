base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: vi
  text: '“Sa-bu-lôn sẽ ở bên bờ các biển[a];

    người sẽ ở bên bờ biển dành cho tàu thuyền,

    và vùng rìa của người sẽ hướng về Si-đôn.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng số nhiều, “các biển”; cũng có thể hiểu theo cách nói thông thường là “biển”.
    reason: lexical_alternative
  - marker: b
    text: “Vùng rìa” cũng có thể dịch là “phía bên”, “ranh giới” hoặc “phần tận cùng”; câu cuối cũng có thể được hiểu là phần đất ấy vươn về phía Si-đôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: Sa-bu-lôn
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc trong tiếng Việt, đồng thời giữ rõ đây là tên chi phái được nhân cách hóa.
- source_word: לְחוֹף
  choice: bên bờ
  rationale: Diễn đạt tự nhiên ý nghĩa vị trí của giới từ לְ đi với חוֹף, không làm mạnh hơn thành một hải cảng.
- source_word: יַמִּים
  choice: các biển
  rationale: Giữ dạng số nhiều của tiếng Hê-bơ-rơ; dù tiếng Việt có thể dùng số ít theo lối thành ngữ, số nhiều giúp phản ánh hình thức của nguyên văn.
- source_word: יִשְׁכֹּן
  choice: sẽ ở
  rationale: Truyền đạt tự nhiên nghĩa cư ngụ/định cư của động từ שכן trong lời chúc phước mang tính thi ca.
- source_word: וְהוּא
  choice: người
  rationale: Giữ đại từ được nêu rõ trong nguyên văn và sự song song của câu thơ; “người” phù hợp khi chi phái được nhân cách hóa qua tổ phụ Sa-bu-lôn.
- source_word: לְחוֹף אֳנִיּוֹת
  choice: bên bờ tàu thuyền
  rationale: Bám sát hình ảnh nguyên văn “bờ của tàu thuyền”, tránh tự ý giải nghĩa thành “hải cảng”, dù ý ấy có thể được hàm chứa.
- source_word: וְיַרְכָתוֹ
  choice: sườn đất của người
  rationale: יַרְכָה có thể chỉ sườn, phía bên, phần tận cùng hay rìa. Thêm “đất” để tiếng Việt hiểu đây là hình ảnh địa lý, nhưng vẫn giữ ẩn dụ “sườn” thay vì xác định quá mức là biên giới.
- source_word: עַל
  choice: hướng về
  rationale: Trong phát biểu địa lý với địa danh, từ này có thể chỉ hướng hoặc sự vươn tới; “hướng về” tự nhiên và thận trọng hơn “đến tận”.
- source_word: צִידֹן
  choice: Si-đôn
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của địa danh Sidon.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và có nhịp thơ. Bản dịch giữ số nhiều “các biển”, sự lặp lại “bên bờ”, và hình ảnh địa lý còn hàm hồ của יַרְכָה. Dùng “tàu thuyền” thay cho “các con tàu” để tự nhiên trong tiếng Việt; không thêm cách hiểu mang tính giải nghĩa như “hải cảng” vào chính văn.
