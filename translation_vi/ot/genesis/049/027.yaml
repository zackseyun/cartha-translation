base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: vi
  text: Bên-gia-min là con sói xé mồi[a]; ban sáng, nó ăn con mồi[b], và ban chiều, nó chia chiến lợi phẩm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con sói hung hãn” hoặc “con sói vồ mồi.” Động từ Hê-bơ-rơ diễn tả việc vồ, xé hoặc ăn thịt con mồi.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “con mồi” cũng có thể chỉ của cướp hoặc chiến lợi phẩm.
    reason: lexical_ambiguity
  - marker: c
    text: 'Cũng có thể dịch: “của cướp” hoặc “chiến lợi thu được.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: Bên-gia-min
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: זְאֵב יִטְרָף
  choice: con sói xé mồi
  rationale: Danh từ זְאֵב là “sói”; động từ טרף diễn tả hành động vồ, xé hoặc ăn thịt con mồi. “Sói xé mồi” giữ hình ảnh dữ dội và cấu trúc thơ cô đọng của tiếng Hê-bơ-rơ.
- source_word: בַּבֹּקֶר
  choice: ban sáng
  rationale: Cụm từ chỉ thời gian, được diễn đạt tự nhiên và song song với “ban chiều”.
- source_word: יֹאכַל
  choice: ăn
  rationale: Đây là nghĩa trực tiếp của động từ אכל. Trong ngữ cảnh con sói, “ăn con mồi” đã đủ sức gợi hình nên không cần tăng nghĩa thành “ngấu nghiến” hay “nuốt chửng”.
- source_word: עַד
  choice: con mồi
  rationale: Trong vế nói về sói ăn, “con mồi” phù hợp với hình ảnh động vật; tuy nhiên từ này cũng có thể chỉ của cướp hay chiến lợi phẩm.
- source_word: וְלָעֶרֶב
  choice: và ban chiều
  rationale: Giữ liên từ và thế song song với “ban sáng” trong câu thơ.
- source_word: יְחַלֵּק
  choice: chia
  rationale: Thể Piel của חלק ở đây có nghĩa chia hoặc phân phát phần thu được.
- source_word: שָׁלָל
  choice: chiến lợi phẩm
  rationale: שָׁלָל thường chỉ của cải chiếm được trong chiến trận; “chiến lợi phẩm” rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa ẩn dụ trong lời Gia-cốp nói về Bên-gia-min
  choice: Giữ nguyên hình ảnh con sói săn mồi và việc chia chiến lợi phẩm, không xác định một biến cố lịch sử hay nhân vật ứng nghiệm cụ thể.
  alternative: Diễn giải đây là lời tiên báo trực tiếp về tính hiếu chiến trong lịch sử chi phái Bên-gia-min.
  rationale: Bản Hê-bơ-rơ chỉ đưa ra một hình ảnh thơ giàu sức gợi, không nêu rõ sự ứng nghiệm lịch sử. Bản dịch vì thế để ngỏ phạm vi quy chiếu của ẩn dụ.
translation_notes:
  register: Văn phong thơ cô đọng, trang trọng nhưng dễ hiểu. Đại từ “nó” duy trì trực tiếp hình ảnh Bên-gia-min như một con sói; hai cụm “ban sáng” và “ban chiều” giữ nhịp song song của nguyên văn.
