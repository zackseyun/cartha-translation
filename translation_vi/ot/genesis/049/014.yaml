  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: vi
  text: Y-sa-ca là con lừa có bộ xương chắc khỏe, nằm giữa hai chuồng chiên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giữa hai túi yên.” Từ Hê-bơ-rơ này hiếm gặp và nghĩa của nó còn được tranh luận; “hai chuồng chiên” là cách hiểu truyền thống và có lẽ phù hợp với bối cảnh mục đồng của lời chúc phước này.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: Y-sa-ca
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, rõ ràng và dễ nhận biết.
- source_word: חֲמֹר
  choice: con lừa
  rationale: Nghĩa cơ bản là “lừa”; cách dịch này tự nhiên trong tiếng Việt hiện đại và không xác định giới tính quá mức nguyên văn.
- source_word: גָּרֶם
  choice: xương cốt vạm vỡ
  rationale: Danh từ “xương” được dùng theo chức năng miêu tả, gợi thân hình chắc khỏe; cụm này giữ hình ảnh cụ thể mà không gây ấn tượng con vật gầy trơ xương.
- source_word: רֹבֵץ
  choice: nằm
  rationale: Phân từ chỉ tư thế con vật nằm hoặc phục xuống; “nằm” tự nhiên, cô đọng và hợp với hình ảnh mục đồng.
- source_word: בֵּין
  choice: giữa
  rationale: Diễn đạt trực tiếp vị trí ở giữa hai hoặc nhiều nơi/vật trong tiếng Việt.
- source_word: הַמִּשְׁפְּתָיִם
  choice: các chuồng chiên
  rationale: Từ Hê-bơ-rơ hiếm và còn tranh luận; “chuồng chiên” giữ cách hiểu truyền thống, phù hợp với bối cảnh mục đồng, còn cách hiểu khác được nêu trong chú thích.
