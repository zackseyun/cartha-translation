base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/023.yaml
  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: vi
  text: 'Các cung thủ đã tấn công người một cách cay nghiệt,

    bắn vào người và căm ghét người.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các cung thủ đã làm cho người cay đắng, chống lại người và căm ghét người.” Động từ thứ hai trong tiếng Hê-bơ-rơ khó xác định; cũng có thể được hiểu khái quát hơn là “tranh đấu với người” hoặc “tấn công người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: đã cay nghiệt tấn công người
  rationale: Động từ מרר ở thể piel với hậu tố tân ngữ ngôi thứ ba số ít có nghĩa làm cho cay đắng, khiến khốn khổ hoặc đối xử cay nghiệt. Trong mạch thơ về hành động thù địch, cách dịch này giữ được sắc thái cay đắng mà vẫn tự nhiên trong tiếng Việt.
- source_word: וָרֹבּוּ
  choice: bắn vào người
  rationale: Dạng Hê-bơ-rơ này khó xác định; xét hình ảnh 'những kẻ cầm cung' ở cuối câu và phép song song của câu thơ, nghĩa bắn hoặc tập kích bằng tên là hợp lý. Sự bất định được ghi rõ trong chú thích.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: căm ghét người
  rationale: Động từ שטם diễn tả lòng thù ghét hoặc thái độ thù địch sâu sắc; 'căm ghét' truyền đạt rõ cường độ ấy.
- source_word: בַּעֲלֵי חִצִּים
  choice: những kẻ cầm cung
  rationale: Nghĩa đen là 'những người sở hữu tên'; đây là thành ngữ chỉ người bắn cung. 'Những kẻ cầm cung' tự nhiên, trang trọng và phù hợp sắc thái thù địch của ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong thơ trang trọng nhưng hiện đại. Dùng “người” để chỉ Giô-sép trong lời chúc mang tính thi ca; đưa chủ thể “những kẻ cầm cung” lên đầu để câu tiếng Việt tự nhiên, đồng thời không làm thay đổi quan hệ ngữ pháp hay hình ảnh của nguyên văn.
