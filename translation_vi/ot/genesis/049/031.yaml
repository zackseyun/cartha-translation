  yaml_path: translation/ot/genesis/049/031.yaml
  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: vi
  text: Tại đó, người ta đã chôn Áp-ra-ham và Sa-ra, vợ ông; tại đó, người ta đã chôn Y-sác và Rê-bê-ca, vợ ông; và tại đó, tôi đã chôn Lê-a.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: tại đó
  rationale: Trạng từ chỉ về nơi chôn cất vừa được nhắc đến; “tại đó” tự nhiên, rõ nghĩa và giữ được sự lặp lại ba lần trong tiếng Hê-bơ-rơ.
- source_word: קָבְרוּ
  choice: người ta đã chôn
  rationale: Động từ Qal hoàn thành ngôi ba số nhiều có chủ thể không xác định. “Người ta đã chôn” giữ thể chủ động và không tự ý xác định tác nhân.
- source_word: אִשְׁתּוֹ
  choice: vợ ông
  rationale: Danh từ kèm hậu tố ngôi ba giống đực số ít được diễn đạt tự nhiên là “vợ ông”; lặp lại với Sa-ra và Rê-bê-ca để bảo toàn cấu trúc nguồn.
- source_word: קָבַרְתִּי
  choice: tôi đã chôn
  rationale: Động từ Qal hoàn thành ngôi thứ nhất số ít nói về hành động trong quá khứ của Gia-cốp đối với Lê-a.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: đã chôn ... đã chôn ... đã chôn
  rationale: Giữ cùng một động từ nhằm bảo toàn phép lặp có chủ ý trong nguyên văn.
- source_word: לֵאָה
  choice: Lê-a
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ta” cho chủ thể số nhiều không xác định, tránh chuyển sang bị động; giữ ba lần “tại đó” và động từ “chôn” để phản ánh nhịp liệt kê của nguyên văn.
