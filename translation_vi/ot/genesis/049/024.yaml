  text: וַ/תֵּ֤שֶׁב בְּ/אֵיתָן֙ קַשְׁתּ֔/וֹ וַ/יָּפֹ֖זּוּ זְרֹעֵ֣י יָדָ֑י/ו מִ/ידֵי֙ אֲבִ֣יר יַעֲקֹ֔ב מִ/שָּׁ֥ם רֹעֶ֖ה אֶ֥בֶן יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: vi
  text: 'Nhưng cung người vẫn vững chắc,

    cánh tay người được làm cho linh hoạt

    nhờ tay Đấng Mạnh Mẽ của Gia-cốp;

    từ đó mà có Đấng Chăn Dắt, là Tảng Đá của Y-sơ-ra-ên.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “từ đó mà có” dịch sát một cách hiểu của tiếng Hê-bơ-rơ; cũng có thể hiểu là “bởi Đấng Chăn Dắt, Tảng Đá của Y-sơ-ra-ên.”
    reason: Nguyên văn מִשָּׁם (‘từ đó/từ nơi ấy’) và quan hệ cú pháp của nó với hai danh hiệu tiếp theo khó xác định; chú thích bảo lưu một cách hiểu quan trọng khác.
lexical_decisions:
- source_word: וַתֵּשֶׁב בְּאֵיתָן קַשְׁתּוֹ
  choice: Nhưng cung người vẫn vững chắc
  rationale: Thành ngữ Hê-bơ-rơ nói cây cung 'ở trong sự bền vững'; dịch tự nhiên là vẫn vững chắc, diễn tả khả năng chống chịu trước các cuộc tấn công ở câu trước.
- source_word: וַיָּפֹזּוּ זְרֹעֵי יָדָיו
  choice: cánh tay người trở nên nhanh nhẹn
  rationale: Động từ hiếm פזז ở đây nhiều khả năng nói đến sự linh hoạt, nhanh nhẹn hoặc mạnh mẽ của cánh tay khi giương cung; lựa chọn này phù hợp ngữ cảnh chiến đấu mà không thêm ý ngoài văn bản.
- source_word: אֲבִיר יַעֲקֹב
  choice: Đấng Quyền Năng của Gia-cốp
  rationale: Danh hiệu אֲבִיר chỉ Đấng mạnh mẽ, quyền năng; viết hoa để biểu thị danh hiệu dành cho Đức Chúa Trời.
- source_word: רֹעֶה
  choice: Đấng Chăn Dắt
  rationale: Giữ hình ảnh người chăn chiên nhưng diễn đạt như một danh hiệu, đồng thời tránh cách nói kém tự nhiên 'Người Chăn' trong tiếng Việt.
- source_word: אֶבֶן יִשְׂרָאֵל
  choice: Vầng Đá của Y-sơ-ra-ên
  rationale: Giữ nguyên ẩn dụ אֶבֶן 'đá' như một danh hiệu về sự vững bền và nâng đỡ; 'Vầng Đá' có sắc thái trang trọng, tự nhiên trong văn phong Kinh Thánh.
theological_decisions:
- issue: Cú pháp và chủ thể của מִשָּׁם רֹעֶה אֶבֶן יִשְׂרָאֵל
  choice: từ đó mà có Đấng Chăn Dắt, là Vầng Đá của Y-sơ-ra-ên
  alternative: bởi Đấng Chăn Dắt, Vầng Đá của Y-sơ-ra-ên
  rationale: Cụm מִשָּׁם theo nghĩa đen là 'từ đó/từ nơi ấy', nhưng quan hệ cú pháp với các danh hiệu sau đó khó xác định. Bản chính giữ cách đọc bám sát văn bản Masoret và dùng chú thích để bảo tồn phương án hiểu theo nghĩa tác nhân.
- issue: Quan hệ giữa 'Đấng Chăn Dắt' và 'Vầng Đá'
  choice: dùng 'là' để đọc hai cụm như hai danh hiệu đồng quy chiếu
  alternative: 'đặt cạnh nhau không có từ nối: ''Đấng Chăn Dắt, Vầng Đá của Y-sơ-ra-ên'''
  rationale: Hai danh từ số ít đứng liền nhau có thể là các danh hiệu đồng vị. Thêm 'là' làm tiếng Việt rõ hơn nhưng không xác định danh tính vượt quá điều văn bản nói.
translation_notes:
  register: Văn phong trang trọng, giàu hình ảnh nhưng dùng từ hiện đại, dễ hiểu. Giữ nhịp thơ bằng cách xuống dòng theo các vế song song; dùng 'người' để chỉ Giô-sép theo lối kể trang trọng và tránh lặp tên.
