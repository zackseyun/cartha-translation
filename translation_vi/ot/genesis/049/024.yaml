    rationale: Động từ וַיָּפֹזּוּ diễn tả cánh tay được làm cho linh hoạt/nhanh nhẹn, với “tay Đấng Mạnh Mẽ của Gia-cốp” là tác nhân. Bản sửa biểu thị quan hệ này rõ hơn.
  - severity: low
    issue: “Đấng Quyền Năng” thiên về thuộc tính trừu tượng hơn là danh hiệu אֲבִיר.
    rationale: אֲבִיר nghĩa là đấng mạnh mẽ, hùng mạnh. “Đấng Mạnh Mẽ” bám sát hơn mà vẫn trang trọng.
