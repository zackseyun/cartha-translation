revisions:
- from: 'Tất cả những người này là mười hai chi tộc Israel. Đây là điều cha họ nói với họ khi ông chúc phước cho họ: ông chúc phước cho từng người bằng phước lành thích hợp với người ấy.[a]'
  to: Tất cả những người này là mười hai chi tộc của Israel. Đây là điều cha họ nói với họ, và ông chúc phước cho họ; ông chúc phước cho họ, mỗi người theo phước lành của từng người.[a]
  rationale: Sửa bản dịch để phản ánh liên từ nối tiếp trong Hebrew thay vì diễn giải thành “khi,” và dùng “theo phước lành của từng người” để giữ độ mở của כְּבִרְכָתוֹ. Cấu trúc lặp “ông chúc phước cho họ” được giữ để phản ánh sự lặp của ברך trong câu gốc.
