  text: כָּל אֵ֛לֶּה שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁנֵ֣ים עָשָׂ֑ר וְ֠/זֹאת אֲשֶׁר דִּבֶּ֨ר לָ/הֶ֤ם אֲבִי/הֶם֙ וַ/יְבָ֣רֶךְ אוֹתָ֔/ם אִ֛ישׁ אֲשֶׁ֥ר כְּ/בִרְכָת֖/וֹ בֵּרַ֥ךְ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: vi
  text: Tất cả những người này là mười hai chi tộc của Israel. Đây là điều cha họ nói với họ, và ông chúc phước cho họ; ông chúc phước cho họ, mỗi người theo phước lành của từng người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “ông chúc phước cho họ; mỗi người theo phước lành của mình, ông chúc phước cho họ.” Cụm này có thể hàm ý lời chúc phước dành riêng cho từng người.'
    reason: Bảo tồn trật tự nhấn mạnh và sự lặp lại của động từ “chúc phước” trong tiếng Hebrew, đồng thời ghi nhận cách hiểu theo ngữ cảnh mà không áp đặt nó vào thân bài.
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Tất cả những người này
  rationale: Cụm chỉ định được dịch theo nghĩa tập hợp; “những người này” tự nhiên trong tiếng Việt và quy chiếu đến các con trai vừa được nhắc đến.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: mười hai chi tộc Israel
  rationale: Giữ trực tiếp cấu trúc định danh và cách gọi quen thuộc trong tiếng Việt; “Israel” có thể vừa chỉ tổ phụ vừa chỉ dân tộc phát sinh từ ông.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: Đây là điều cha họ nói với họ
  rationale: “Nói với” chuyển tải tự nhiên động từ דִּבֶּר và giữ rõ đối tượng tiếp nhận lời nói.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: khi ông chúc phước cho họ
  rationale: Trong văn cảnh, mệnh đề này giải thích lời vừa nói là lời chúc phước; dùng “khi” tạo câu tiếng Việt lưu loát mà không thay đổi nội dung.
- source_word: אִישׁ
  choice: từng người
  rationale: Danh từ số ít mang chức năng phân phối, chỉ mỗi người trong số các con trai; “từng người” là cách diễn đạt tự nhiên và chính xác.
- source_word: כְּבִרְכָתוֹ
  choice: bằng phước lành thích hợp với người ấy
  rationale: Nghĩa sát là “theo phước lành của người ấy”; trong ngữ cảnh, cụm từ chỉ lời chúc phước tương ứng với từng người. Bản dịch chính làm sáng nghĩa ngữ cảnh, còn cách nói sát chữ được giữ trong chú thích.
- source_word: בֵּרַךְ אֹתָם
  choice: ông chúc phước
  rationale: Lặp lại động từ “chúc phước” để phản ánh sự lặp có tính nhấn mạnh của căn ברך trong nguyên văn.
