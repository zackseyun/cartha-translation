base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: vi
  text: 'Rồi Gia-cốp gọi các con trai mình đến và nói: “Hãy tụ họp lại, để cha báo cho các con biết điều sẽ xảy đến với các con trong những ngày về sau[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong những ngày sau rốt.” Cụm từ Hê-bơ-rơ này trong một số văn cảnh có thể mang sắc thái cánh chung.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gọi ... đến
  rationale: Trong mạch kể chuyện, קרא có nghĩa là gọi hoặc triệu tập; cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với việc Gia-cốp tập hợp các con.
- source_word: בָּנָיו
  choice: các con trai mình
  rationale: Ở đây בנים chỉ các con trai của Gia-cốp, những người sẽ được nêu tên trong phần tiếp theo.
- source_word: הֵאָסְפוּ
  choice: Hãy tụ họp lại
  rationale: Mệnh lệnh Niphal của אסף yêu cầu họ cùng tập hợp; “tụ họp lại” giữ được sắc thái chủ động quy tụ và giọng trang trọng.
- source_word: וְאַגִּידָה לָכֶם
  choice: để cha báo cho các con biết
  rationale: Dạng cohortative diễn tả mục đích hoặc ý định sau mệnh lệnh. Đại từ xưng hô cha–con là tự nhiên trong tiếng Việt và phù hợp quan hệ được nói rõ trong câu.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: điều sẽ xảy đến với các con
  rationale: Cụm dùng קרה theo nghĩa một việc xảy ra hoặc giáng đến; “xảy đến với” vừa rõ nghĩa vừa giữ được ý sự việc đến trên họ.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: trong những ngày về sau
  rationale: Cụm này có thể chỉ thời gian tương lai nói chung, đồng thời trong một số văn cảnh có sắc thái cánh chung. Bản dịch chính giữ cách nói rộng và gần hình thức Hê-bơ-rơ.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים có nên được dịch như một thuật ngữ cánh chung rõ rệt hay không
  choice: trong những ngày về sau
  alternative: vào thời kỳ cuối cùng
  rationale: Văn cảnh trực tiếp nói về tương lai của các con trai và các chi tộc của Gia-cốp, nhưng cụm Hê-bơ-rơ cũng có thể mang sắc thái cánh chung ở những văn cảnh khác. Bản chính không thu hẹp nghĩa; chú thích bảo lưu cách hiểu mạnh hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cách xưng hô “cha–các con” được dùng trong lời trực tiếp để diễn đạt tự nhiên quan hệ Gia-cốp với các con trai; không thêm nội dung thần học ngoài văn bản.
