    rationale: בְּאַחֲרִית הַיָּמִים nghĩa cơ bản là “trong những ngày về sau/latter days”; trong ngữ cảnh này không nên xác định dứt khoát là một “thời kỳ cuối cùng.” “Trong những ngày sau rốt” bảo lưu tốt hơn cách hiểu thay thế truyền thống mà không áp đặt cách giải thích.
