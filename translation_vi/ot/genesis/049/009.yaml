  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: vi
  text: Giu-đa là sư tử con; hỡi con trai ta, con đã đi lên từ mồi săn. Nó khom mình, nằm xuống như sư tử, như sư tử cái[a]—ai sẽ đánh thức nó?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như sư tử lớn.” Từ Hê-bơ-rơ tại đây khác với từ “sư tử” đứng trước và có thể chỉ một con sư tử trưởng thành, mạnh mẽ, hoặc sư tử cái.'
    reason: lexical_alternative
  - marker: b
    text: Hình tượng sư tử dành cho Giu-đa thường được đọc theo hướng dự biểu, liên hệ với niềm hy vọng về vương quyền và Đấng Mê-si trong các phần Kinh Thánh về sau; tuy nhiên, chính câu này trực tiếp nói về Giu-đa trong lời chúc phước của Gia-cốp.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: sư tử con
  rationale: Cụm danh từ chỉ con non của sư tử. “Sư tử con” tự nhiên trong tiếng Việt hiện đại và giữ nguyên hình ảnh ẩn dụ.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: מִטֶּרֶף
  choice: từ mồi săn
  rationale: טֶרֶף là con mồi bị thú săn bắt hoặc xé thịt. “Mồi săn” giữ rõ hình ảnh của loài sư tử mà không diễn giải thêm.
- source_word: בְּנִי
  choice: con trai ta
  rationale: Hiểu là lời Gia-cốp trực tiếp gọi Giu-đa; cách dịch giữ quan hệ gia đình và sắc thái thi ca.
- source_word: עָלִיתָ
  choice: con đã đi lên
  rationale: Giữ nghĩa chuyển động đi lên và ngôi thứ hai của nguyên văn, không xác định thêm nơi chốn hay mục đích.
- source_word: כָּרַע
  choice: nó khom mình
  rationale: Trong hình tượng thú săn, động từ diễn tả tư thế hạ thấp thân mình; “khom mình” tránh sắc thái thờ lạy không phù hợp ngữ cảnh.
- source_word: רָבַץ
  choice: nằm xuống
  rationale: Động từ thường dùng cho con vật nằm nghỉ; cách dịch rõ ràng, tự nhiên.
- source_word: כְּאַרְיֵה
  choice: như sư tử
  rationale: Giữ phép so sánh trực tiếp với sư tử.
- source_word: וּכְלָבִיא
  choice: như sư tử cái
  rationale: לָבִיא có thể chỉ sư tử trưởng thành, mạnh mẽ và đôi khi được hiểu là sư tử cái. “Sư tử cái” giữ sự phân biệt từ vựng với אַרְיֵה; phương án khác được ghi ở chú thích.
- source_word: מִי יְקִימֶנּוּ
  choice: ai sẽ khiến nó đứng dậy?
  rationale: Dạng Hiphil của קום có nghĩa làm cho đứng lên, tức đánh động hoặc khuấy nó dậy. Cách dịch này sát cấu trúc nguyên văn và không thêm ý “dám” vốn chỉ được hàm ý bởi hình tượng.
theological_decisions:
- issue: Hình tượng sư tử chỉ chi phái Giu-đa hay mang ý nghĩa Đấng Mê-si
  choice: Bản văn chính trình bày trực tiếp lời chúc phước dành cho Giu-đa, không thêm danh xưng hay lời khẳng định về Đấng Mê-si.
  alternative: Đọc hình tượng sư tử theo hướng dự biểu, liên hệ với vương quyền và niềm hy vọng về Đấng Mê-si trong các phần Kinh Thánh về sau.
  rationale: Câu này trực tiếp nói với Giu-đa trong lời chúc phước của Gia-cốp. Ý nghĩa dự biểu có thể thuộc cách đọc thần học rộng hơn, nhưng không nên được đưa thành lời khẳng định ngay trong bản dịch.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ nhịp thơ cô đọng. Sự chuyển đổi đột ngột từ ngôi thứ hai (“con”) sang ngôi thứ ba (“nó”) được bảo lưu vì có trong nguyên văn. Dấu gạch ngang làm nổi bật câu hỏi kết thúc mà không thêm ý diễn giải.
