  source_fidelity: 'Bản dịch giữ đúng cấu trúc cơ bản: lời nguyền nhắm vào cơn giận và thịnh nộ, hai mệnh đề nguyên nhân song song, rồi hai động từ phân biệt về việc chia/phân tán trong Gia-cốp và Y-sơ-ra-ên. Tuy nhiên, “tàn khốc” diễn giải mạnh hơn קָשָׁתָה, vốn nhấn vào tính cứng rắn, nghiệt ngã/khắc nghiệt; cần điều chỉnh để sát nguồn hơn. Đại từ “chúng” cũng không tự nhiên khi chỉ Si-mê-ôn và Lê-vi.'
  naturalness: “Đáng nguyền rủa thay” phù hợp văn phong thơ ca Kinh Thánh trang trọng. Dùng “họ” thay “chúng” là tiếng Việt hiện đại tự nhiên hơn khi quy chiếu đến hai người/nhóm người. “Khắc nghiệt” giữ được văn phong trang trọng và phù hợp hơn với ngữ cảnh.
  terminology: “Cơn giận,” “cơn thịnh nộ,” “Gia-cốp,” và “Y-sơ-ra-ên” đều thích hợp. Giữ “phân chia” và “làm tản mác” bảo tồn sự phân biệt giữa אֲחַלְּקֵם và וַאֲפִיצֵם. Chú thích cần được neo ngay sau cụm “cơn giận của họ,” tương ứng với vị trí neo trong audit trail.
