source:
  edition: WLC
  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: vi
  text: Đáng nguyền rủa thay cơn giận của họ[a], vì nó thật dữ dội; và cơn thịnh nộ của họ, vì nó thật khắc nghiệt. Ta sẽ phân chia họ trong Gia-cốp, và làm họ tản mác trong Y-sơ-ra-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đáng nguyền rủa thay cơn giận của họ ... và cơn cuồng nộ của họ, vì nó thật khắc nghiệt.”'
    reason: 'Bảo lưu cách hiểu từ vựng thay thế: עֶבְרָה có thể là “cuồng nộ,” và cách diễn đạt vị ngữ của אָרוּר cũng có thể được hiểu là “đáng bị nguyền rủa.”'
lexical_decisions:
- source_word: אָרוּר
  choice: Đáng nguyền rủa thay
  rationale: Phân từ bị động được dùng làm vị ngữ trong một lời tuyên án; cách diễn đạt này giữ được sức nặng của lời nguyền mà vẫn tự nhiên trong văn phong trang trọng.
- source_word: אַפָּם
  choice: cơn giận của chúng
  rationale: Dù danh từ vốn liên hệ với mũi hoặc lỗ mũi, ở đây nó là thành ngữ chỉ sự tức giận; dịch theo nghĩa thành ngữ.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do cho lời nguyền, đồng thời giữ mạch song song của câu thơ.
- source_word: עָז
  choice: dữ dội
  rationale: Trong ngữ cảnh nói về cơn giận, từ này diễn tả cường độ hung bạo hơn là sức mạnh trung tính.
- source_word: וְעֶבְרָתָם
  choice: và cơn thịnh nộ của chúng
  rationale: עֶבְרָה chỉ cơn giận bùng tràn; “thịnh nộ” giữ sắc thái mạnh và trang trọng.
- source_word: קָשָׁתָה
  choice: thật tàn khốc
  rationale: Từ này biểu thị sự cứng rắn, khắc nghiệt; trong ngữ cảnh cơn thịnh nộ dẫn đến bạo lực, “tàn khốc” truyền đạt rõ sức hủy hoại mà không làm nhẹ câu.
- source_word: אֲחַלְּקֵם
  choice: Ta sẽ phân chia chúng
  rationale: Giữ nghĩa của thể Piel và phân biệt động từ này với động từ “làm tản mác” ở vế kế tiếp.
- source_word: בְּיַעֲקֹב
  choice: trong Gia-cốp
  rationale: “Gia-cốp” được dùng theo nghĩa tập thể về dân tộc; cách dịch trực tiếp bảo toàn phép song song với “trong Y-sơ-ra-ên”.
- source_word: וַאֲפִיצֵם
  choice: và làm chúng tản mác
  rationale: Thể Hiphil diễn tả việc khiến họ bị phân tán; “làm ... tản mác” giữ sắc thái gây khiến.
- source_word: בְּיִשְׂרָאֵל
  choice: trong Y-sơ-ra-ên
  rationale: Giữ nguyên tên gọi thứ hai trong cấu trúc song song thi ca, không nhập hai tên thành một.
theological_decisions:
- issue: Đối tượng của lời nguyền
  choice: Lời nguyền nhắm vào cơn giận và cơn thịnh nộ của Si-mê-ôn và Lê-vi, không trực tiếp nhắm vào chính hai người.
  alternative: Hiểu rằng chính hai anh em là đối tượng bị nguyền rủa.
  rationale: Cú pháp Hê-bơ-rơ nêu đích danh “cơn giận của chúng” và “cơn thịnh nộ của chúng” là đối tượng của lời nguyền; bản dịch bảo toàn sự phân biệt này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ nhịp song song thi ca, hai tên Gia-cốp/Y-sơ-ra-ên, cùng sự phân biệt giữa “phân chia” và “làm tản mác”. Đại từ “chúng” quy chiếu đến Si-mê-ôn và Lê-vi theo ngữ cảnh trước đó.
