source:
  edition: WLC
  text: וַ/יִּבֶן֩ יְהוָ֨ה אֱלֹהִ֧ים אֶֽת הַ/צֵּלָ֛ע אֲשֶׁר לָקַ֥ח מִן הָֽ/אָדָ֖ם לְ/אִשָּׁ֑ה וַ/יְבִאֶ֖/הָ אֶל הָֽ/אָדָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: vi
  text: Giê-hô-va Đức Chúa Trời dùng chiếc xương sườn đã lấy từ người đàn ông mà dựng nên một người nữ, rồi đưa nàng đến với người đàn ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: dựng nên
  rationale: Giữ hình ảnh cụ thể của động từ 'xây dựng' nhưng diễn đạt tự nhiên trong tiếng Việt khi nói về việc tạo dựng người nữ.
- source_word: יְהוָה אֱלֹהִים
  choice: Giê-hô-va Đức Chúa Trời
  rationale: Thể hiện danh riêng YHWH và tước hiệu Elohim, phù hợp văn phong Kinh Thánh tiếng Việt quen thuộc.
- source_word: הַצֵּלָע
  choice: chiếc xương sườn
  rationale: Nghĩa truyền thống và phù hợp nhất trong ngữ cảnh; danh từ cũng có thể chỉ 'mạn/bên', nhưng vật được lấy khỏi người đàn ông rồi dùng để dựng nên người nữ được diễn đạt tự nhiên là 'xương sườn'.
- source_word: הָאָדָם
  choice: người đàn ông
  rationale: Trong ngữ cảnh đối ứng với אִשָּׁה, cách dịch này làm rõ giới tính mà chưa nhất thiết biến danh từ thành tên riêng A-đam.
- source_word: לְאִשָּׁה
  choice: một người nữ
  rationale: Diễn đạt kết quả của hành động dựng nên; giữ đối ứng nam–nữ trong câu.
- source_word: וַיְבִאֶהָ
  choice: rồi đưa nàng đến
  rationale: Đại từ giống cái chỉ người nữ; 'nàng' trang trọng, tự nhiên và tránh lặp từ.
theological_decisions:
- issue: Sắc thái của động từ וַיִּבֶן trong việc tạo nên người nữ
  choice: dựng nên
  alternative: làm thành
  rationale: Giữ được hình ảnh 'xây/dựng' khác với động từ tạo dựng thông thường, mà không suy diễn ý nghĩa thần học vượt quá câu chữ.
- issue: Danh xưng YHWH
  choice: Giê-hô-va
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Dùng một hình thức danh riêng quen thuộc trong tiếng Việt, phân biệt YHWH với tước hiệu 'Đức Chúa Trời', đồng thời không thay danh riêng bằng tước hiệu.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt, nhưng vẫn giữ chuỗi hành động của bản Hê-bơ-rơ: lấy xương sườn, dựng nên người nữ, rồi đưa nàng đến với người đàn ông.'
