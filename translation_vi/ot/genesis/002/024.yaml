  source_fidelity: 'Bản dịch bảo toàn đầy đủ các yếu tố chính của tiếng Hê-bơ-rơ: quan hệ suy luận của עַל־כֵּן (“Vì thế”), chủ ngữ giống đực số ít mang tính đại diện (“người nam”), việc nêu riêng cha và mẹ, sự gắn kết bền chặt của דבק, “vợ mình”, và kết quả “họ sẽ trở nên một thịt”. Cách dùng “sẽ” diễn đạt phù hợp tính chất nguyên tắc khái quát của các dạng yiqtol, không chuyển câu thành mệnh lệnh trực tiếp.'
