  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: vi
  text: Vì thế, người nam sẽ lìa cha mình và mẹ mình, gắn bó với vợ mình[a], và họ sẽ trở nên một thịt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bám chặt lấy” hoặc “kết hợp với”. Động từ Hê-bơ-rơ diễn tả sự gắn kết rất chặt chẽ.
    reason: lexical_alternative
  - marker: b
    text: “Một thịt” là thành ngữ Hê-bơ-rơ, bao gồm sự kết hợp thân xác và việc hình thành một mối liên hệ thân tộc mới.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn tả kết luận rút ra từ trình thuật ngay trước đó, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: יַעֲזָב
  choice: sẽ lìa
  rationale: Thể chưa hoàn thành ở đây nêu một nguyên tắc tổng quát có tính định hướng. “Sẽ lìa” giữ được sắc thái ấy mà không biến câu thành mệnh lệnh trực tiếp; “lìa bỏ” có thể gợi ý ruồng bỏ quá mạnh.
- source_word: אִישׁ
  choice: người nam
  rationale: Giữ giống đực số ít được nêu rõ trong tiếng Hê-bơ-rơ và phù hợp với công thức hôn nhân trong ngữ cảnh.
- source_word: אָבִיו ... אִמּוֹ
  choice: cha mình và mẹ mình
  rationale: Giữ cách nguyên văn gọi riêng từng người cha và mẹ, thay vì gộp thành “cha mẹ”.
- source_word: וְדָבַק
  choice: gắn bó với
  rationale: Diễn đạt sự kết hợp và quyến luyến bền chặt, đồng thời tự nhiên trong tiếng Việt; chú thích giữ các khả năng mạnh hơn như “bám chặt” hoặc “kết hợp”.
- source_word: בְּאִשְׁתּוֹ
  choice: vợ mình
  rationale: Trong ngữ cảnh này, אִשָּׁה với hậu tố sở hữu chỉ người vợ, không chỉ một người phụ nữ nói chung.
- source_word: וְהָיוּ
  choice: và họ sẽ trở nên
  rationale: Diễn tả kết quả hay sự chuyển thành trạng thái mới; “họ” làm rõ chủ thể số nhiều vốn hàm chứa trong động từ Hê-bơ-rơ.
- source_word: לְבָשָׂר אֶחָד
  choice: một thịt
  rationale: Giữ hình ảnh và thành ngữ Hê-bơ-rơ, không thu hẹp ý nghĩa vào riêng thân thể hay tình dục; chú thích giải thích phạm vi của thành ngữ.
theological_decisions:
- issue: Ngôn ngữ đại diện có chỉ rõ giới tính trong công thức hôn nhân
  choice: người nam
  alternative: một người; người ta
  rationale: אִישׁ là danh từ giống đực số ít. Bản dịch giữ đặc điểm này thay vì trung tính hóa điều nguyên văn nói rõ.
- issue: Tính chất của lời tuyên bố
  choice: 'một nguyên tắc tổng quát có tính định hướng: “sẽ lìa ... sẽ trở nên”'
  alternative: mệnh lệnh trực tiếp; chỉ là lời mô tả một tập tục
  rationale: Các dạng động từ trình bày một nguyên tắc tổng quát bắt nguồn từ trình thuật sáng tạo, nhưng không phải hình thức mệnh lệnh trực tiếp.
- issue: Phạm vi ý nghĩa của “một thịt”
  choice: giữ nguyên thành ngữ và giải thích bằng chú thích
  alternative: diễn giải thành “một thân thể” hoặc chỉ “kết hợp tình dục”
  rationale: Thành ngữ bao gồm sự kết hợp thân xác nhưng không nhất thiết chỉ giới hạn ở đó; nó cũng gợi đến một mối liên hệ thân tộc mới. Giữ hình ảnh giúp tránh giải quyết quá mức độ rộng của câu.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Mình” được dùng làm từ sở hữu phản thân tự nhiên cho cùng một chủ thể; cấu trúc gọi riêng “cha mình và mẹ mình” bảo toàn hình thức nhấn mạnh của nguyên văn. Thành ngữ “một thịt” được giữ vì giá trị hình ảnh và thần học, kèm chú thích để người đọc hiện đại hiểu đúng phạm vi.
