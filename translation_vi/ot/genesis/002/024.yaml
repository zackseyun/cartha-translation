  terminology: “Người nam”, “vợ mình” và “một thịt” nhất quán với ngữ cảnh hôn nhân và không thêm diễn giải giáo phái. Chú thích a phản ánh đúng dải nghĩa của דבק; chú thích b giải thích thành ngữ בלי thu hẹp nó chỉ còn quan hệ thân xác.
