source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: vi
  text: 'Rồi Giê-hô-va Đức Chúa Trời phán: “Người nam sống một mình thì không tốt. Ta sẽ làm cho người ấy một người trợ giúp tương xứng với người ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một người trợ giúp thích hợp với người ấy,” “một người trợ giúp phù hợp với người ấy,” hoặc “một người trợ giúp tương ứng với người ấy.” Cụm từ Hê-bơ-rơ có thể chỉ một người ở đối diện và tương ứng với người nam, chứ không chỉ là một phụ tá có địa vị thấp hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt để thể hiện Danh Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh xưng tự nhiên và trang trọng trong tiếng Việt; trong tổ hợp יְהוָה אֱלֹהִים, cách dịch giữ cả tên riêng lẫn danh xưng thần linh.
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: “Rồi” thể hiện diễn tiến tự sự của waw-consecutive; “phán” là động từ tiếng Việt tự nhiên, trang trọng khi chủ thể là Đức Chúa Trời.
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: Người nam ở một mình thì không tốt
  rationale: Giữ nguyên sự đánh giá “không tốt” và diễn đạt cấu trúc nguyên nhân/chủ đề tự nhiên trong tiếng Việt; “người nam” chỉ cá nhân nam giới trong bối cảnh này.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: Ta sẽ làm cho người
  rationale: Thể hiện ý định của Đức Chúa Trời và giữ giới từ chỉ đối tượng hưởng lợi; “Ta” phù hợp với lời phán trực tiếp trang trọng.
- source_word: עֵזֶר
  choice: một người trợ giúp
  rationale: Diễn đạt một nhân vị cung cấp sự giúp đỡ; bản thân từ Hê-bơ-rơ không hàm ý địa vị thấp kém.
- source_word: כְּנֶגְדּוֹ
  choice: tương xứng với người
  rationale: Giữ ý nghĩa đối diện, tương ứng hay phù hợp với người nam, đồng thời tránh biến “trợ giúp” thành quan hệ mặc nhiên thấp hơn.
theological_decisions:
- issue: Cách dịch הָאָדָם trong ngữ cảnh
  choice: người nam
  alternative: con người; người ấy; A-đam
  rationale: Câu này nói đến cá nhân nam giới vừa được tạo dựng. “Người nam” giữ tính cụ thể về giới mà không vội dùng tên riêng “A-đam” hay chuyển thành nhân loại nói chung.
- issue: Khả năng hiểu עֵזֶר כְּנֶגְדּוֹ theo thứ bậc
  choice: một người trợ giúp tương xứng với người
  alternative: một người giúp đỡ thích hợp cho người; một người trợ giúp đối diện với người
  rationale: Nguyên văn nói về sự trợ giúp và tính tương ứng, nhưng không xác định người ấy thấp hơn hay cao hơn. Bản dịch không đưa kết luận xã hội hoặc giáo phái vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” và đại từ “Ta” trong lời trực tiếp của Đức Chúa Trời; dùng “người” để chỉ người nam nhằm tránh lặp nặng nề, nhưng vẫn giữ rõ đối tượng ở đầu câu.
