  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: vi
  text: Đến ngày thứ bảy, Đức Chúa Trời đã hoàn tất công việc Ngài đã làm[a]; vào ngày thứ bảy, Ngài nghỉ ngơi, ngừng làm mọi công việc Ngài đã làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Vào ngày thứ bảy, Đức Chúa Trời hoàn tất công việc Ngài đã làm.” Cách diễn đạt Hê-bơ-rơ thường được dịch như vậy; “Đến ngày thứ bảy” trong câu chính truyền đạt ý nghĩa có khả năng phù hợp hơn với ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: đã hoàn tất
  rationale: Động từ כלה có nghĩa là hoàn tất hoặc làm xong. Cách dịch này diễn đạt rằng công việc sáng tạo đã hoàn thành khi ngày thứ bảy đến.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thức số nhiều nhưng đi với động từ số ít và trong ngữ cảnh chỉ về Đức Chúa Trời duy nhất; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Đến ngày thứ bảy / trong ngày thứ bảy
  rationale: Cụm từ theo hình thức là “trong/vào ngày thứ bảy”. Ở mệnh đề đầu, “Đến ngày thứ bảy” truyền đạt hợp lý rằng công việc đã hoàn tất khi ngày ấy đến; ở mệnh đề sau, “trong ngày thứ bảy” giữ nghĩa thời gian trực tiếp.
- source_word: מְלַאכְתּוֹ
  choice: công việc Ngài
  rationale: מְלָאכָה chỉ công việc hay lao tác. “Công việc” tự nhiên và phù hợp với trình thuật sáng tạo.
- source_word: אֲשֶׁר עָשָׂה
  choice: Ngài làm / Ngài đã làm
  rationale: עשה là động từ nghĩa rộng, có thể là “làm” hoặc “tạo nên”. “Làm” giữ được độ rộng nghĩa của nguyên văn.
- source_word: וַיִּשְׁבֹּת
  choice: Ngài nghỉ, không làm ... nữa
  rationale: שבת về căn bản nghĩa là ngừng hoặc thôi. Kết hợp “nghỉ” với lời giải thích theo chính bổ ngữ của câu giúp tránh hàm ý Đức Chúa Trời nghỉ vì mệt, đồng thời giữ cách diễn đạt quen thuộc.
- source_word: מִכָּל
  choice: không làm bất cứ ... nào ... nữa
  rationale: מן kết hợp với כל biểu thị sự ngừng đối với toàn bộ công việc. Cấu trúc tiếng Việt này diễn đạt tự nhiên tính toàn diện ấy.
theological_decisions:
- issue: Câu này có hàm ý Đức Chúa Trời vẫn làm việc trong ngày thứ bảy hay không
  choice: Mệnh đề đầu được dịch “Đến ngày thứ bảy, Đức Chúa Trời đã hoàn tất”, cho thấy công việc đã hoàn tất khi ngày thứ bảy đến.
  alternative: “Trong ngày thứ bảy, Đức Chúa Trời hoàn tất công việc Ngài đã làm” là cách dịch sát hình thức hơn.
  rationale: Nguyên văn dùng cụm có nghĩa hình thức là “trong/vào ngày thứ bảy”, nhưng ngữ cảnh liền sau nói Ngài nghỉ trong ngày ấy. Bản chính dùng cách diễn đạt thời gian tự nhiên trong tiếng Việt, còn cách dịch sát hình thức được giữ trong chú thích để không che khuất sự mơ hồ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để tránh lặp danh xưng nhưng vẫn giữ sắc thái tôn kính. Dấu chấm phẩy phản ánh hai mệnh đề song song của nguyên văn.
