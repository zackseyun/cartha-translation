  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: vi
  text: Thế là trời đất và toàn thể vạn vật trong đó[a] đã được hoàn tất[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ dùng một từ có thể chỉ “toàn thể đạo quân” hay “toàn bộ đội ngũ” của trời đất, tức mọi vật thuộc về và làm đầy trời đất.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đã được làm xong.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: đã được hoàn tất
  rationale: Động từ כלה ở thể thụ động diễn tả việc trời đất đạt đến trạng thái hoàn thành; cách dịch này giữ sắc thái thụ động và kết quả.
- source_word: הַשָּׁמַיִם
  choice: trời
  rationale: Trong cặp thành ngữ chỉ toàn thể vũ trụ, tiếng Việt tự nhiên dùng “trời đất”; “trời” ở đây rộng hơn bầu trời nhìn thấy.
- source_word: וְהָאָרֶץ
  choice: đất
  rationale: Trong bối cảnh sáng tạo, אֶרֶץ là cõi đất thuộc toàn thể vũ trụ, không phải một vùng đất địa phương.
- source_word: וְכָל צְבָאָם
  choice: cùng toàn thể muôn loài trong đó
  rationale: צָבָא chỉ toàn bộ đội ngũ hay vô số thành phần thuộc về trời đất. “Muôn loài trong đó” chuyển đạt tự nhiên ý toàn thể những gì làm đầy và thuộc về hai cõi, mà không thu hẹp chỉ vào các thiên thể.
theological_decisions:
- issue: Phạm vi của צְבָאָם
  choice: Toàn thể muôn loài thuộc về hoặc làm đầy trời và đất
  alternative: Chỉ các thiên thể, hoặc nhấn mạnh hình ảnh những đạo quân có hàng ngũ
  rationale: Ngữ cảnh tổng kết công cuộc sáng tạo ủng hộ phạm vi bao quát. Bản dịch tránh thu hẹp vào các ngôi sao, còn chú thích ghi nhận hình ảnh nguyên ngữ về một đoàn ngũ đông đảo, có trật tự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thế là” diễn đạt chức năng tổng kết của וַ־; trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt nhưng vẫn giữ ý thụ động của động từ.
