  source_fidelity: Bản nháp giữ đúng cấu trúc tổng kết và sắc thái bị động của וַיְכֻלּוּ. Tuy nhiên, “muôn loài” thường nghiêng về các sinh vật, trong khi צְבָאָם trong ngữ cảnh này bao quát mọi thành phần thuộc về/làm đầy trời và đất, gồm cả những thực thể không phải sinh vật. Đổi thành “vạn vật” tránh thu hẹp phạm vi.
