  text: שֵׁ֥ם הָֽ/אֶחָ֖ד פִּישׁ֑וֹן ה֣וּא הַ/סֹּבֵ֗ב אֵ֚ת כָּל אֶ֣רֶץ הַֽ/חֲוִילָ֔ה אֲשֶׁר שָׁ֖ם הַ/זָּהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: vi
  text: Tên nhánh sông thứ nhất là Pi-sôn; đó là nhánh chảy quanh toàn xứ Ha-vi-la[a], nơi có vàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bao quanh toàn xứ Ha-vi-la.” Phân từ Hê-bơ-rơ có thể mang nghĩa “đi vòng quanh” hoặc “bao quanh”; “chảy quanh” làm rõ hình ảnh của một dòng sông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: Tên nhánh sông thứ nhất
  rationale: Trong mạch văn về bốn nhánh sông, הָאֶחָד mang chức năng chỉ thứ tự. Thêm “nhánh sông” làm rõ đối tượng đã được nêu ở câu trước mà không thay đổi ý nghĩa.
- source_word: פִּישׁוֹן
  choice: Pi-sôn
  rationale: Phiên âm tên riêng của sông theo cách đọc tự nhiên và quen thuộc trong tiếng Việt.
- source_word: הַסֹּבֵב
  choice: chảy quanh
  rationale: Phân từ của סבב có nghĩa đi vòng quanh hoặc bao quanh. Vì chủ thể là một nhánh sông, “chảy quanh” tự nhiên trong tiếng Việt, đồng thời chú thích bảo lưu sắc thái “bao quanh” của nguyên ngữ.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: toàn xứ Ha-vi-la
  rationale: “Xứ” phù hợp với một vùng đất mang tên riêng; “toàn” thể hiện כָּל.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: nơi có vàng
  rationale: Diễn đạt tự nhiên cấu trúc quan hệ chỉ nơi chốn và sự hiện hữu của vàng; mạo từ Hê-bơ-rơ không cần được thể hiện bằng một từ xác định trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nhánh sông” theo ngữ cảnh trực tiếp của Sáng Thế 2:10; tên riêng được phiên âm theo lối tiếng Việt.
