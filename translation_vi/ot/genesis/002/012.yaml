    rationale: טוֹב có nghĩa là “tốt”; không có yếu tố cường điệu tương đương “rất” trong nguyên văn.
  - severity: medium
    issue: “đá mã não” cho שֹׁהַם
    rationale: Mã não (agate) không đồng nhất với onyx. Dù cả hai thuộc nhóm chalcedony theo cách phân loại hiện đại, bản dịch này làm thay đổi cách nhận diện truyền thống mà không có cơ sở từ nguyên văn. “Đá ô-ních” sát hơn với audit trail và chú thích có thể giữ sự dè dặt cần thiết.
  revised_text: Vàng của vùng đất ấy tốt. Tại đó có bê-đô-la[a] và đá ô-ních[b].
