- from: Vàng của vùng đất ấy rất tốt. Tại đó có bê-đô-la[a] và đá mã não[b].
  to: Vàng của vùng đất ấy tốt. Tại đó có bê-đô-la[a] và đá ô-ních[b].
  rationale: Bỏ “rất” để không thêm sắc thái cường điệu vào טוֹב. Đổi “đá mã não” thành “đá ô-ních” để phù hợp hơn với cách hiểu truyền thống của שֹׁהַם trong khi chú thích tiếp tục bảo lưu bất định về định danh khoáng vật. Chỉnh nhẹ chú thích a cho tự nhiên và chính xác hơn trong tiếng Việt.
