base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/012.yaml
  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: vi
  text: Vàng của vùng đất ấy tốt. Tại đó có bê-đô-la[a] và đá ô-ních[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc có thể là “nhựa thơm”; chưa xác định chắc chắn thuật ngữ Hê-bơ-rơ này chỉ loại chất nào.
    reason: lexical_alternative
  - marker: b
    text: Hoặc có thể là một loại đá quý khác, chẳng hạn “beryl”; chưa xác định chắc chắn loại đá mà từ Hê-bơ-rơ שֹׁהַם chỉ đến.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב
  choice: Vàng
  rationale: Danh từ זָהָב có nghĩa trực tiếp là “vàng”. Liên từ וּ nối câu này với phần mô tả trước; trong tiếng Việt, mối liên kết đã rõ trong mạch văn nên không nhất thiết phải dịch thành “và” ở đầu câu.
- source_word: הָאָרֶץ הַהִוא
  choice: của vùng đất ấy
  rationale: אֶרֶץ chỉ đất hoặc xứ; “vùng đất” tự nhiên trong ngữ cảnh địa lý. Đại từ chỉ định הַהִוא quy chiếu về vùng đất Ha-vi-la ở câu trước.
- source_word: טוֹב
  choice: rất tốt
  rationale: טוֹב đánh giá phẩm chất của vàng. “Rất tốt” diễn đạt tự nhiên trong tiếng Việt; từ này không nhất thiết mô tả độ tinh khiết theo nghĩa kỹ thuật.
- source_word: שָׁם
  choice: Tại đó có
  rationale: שָׁם nghĩa là “ở đó/tại đó”; cách đặt đầu câu phù hợp với cú pháp tiếng Việt khi giới thiệu hai vật hiện diện tại nơi ấy.
- source_word: הַבְּדֹלַח
  choice: bê-đô-la[a]
  rationale: Danh tính chính xác của בְּדֹלַח chưa chắc chắn. Dùng dạng phiên âm giữ được nét riêng của thuật ngữ Hê-bơ-rơ và tránh khẳng định quá mức rằng đó chắc chắn là một loại nhựa thơm.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: và đá mã não[b]
  rationale: אֶבֶן là “đá”, còn שֹׁהַם là tên một loại đá quý chưa được xác định chắc chắn. “Đá mã não” theo cách hiểu truyền thống, còn chú thích bảo lưu sự bất định.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Hai thuật ngữ chỉ vật chất chưa được nhận diện chắc chắn được xử lý thận trọng: một từ được phiên âm, một từ dùng tên truyền thống kèm chú thích. Dấu câu chia câu Hê-bơ-rơ thành hai câu tiếng Việt để lời văn tự nhiên mà không thay đổi quan hệ ý nghĩa.'
