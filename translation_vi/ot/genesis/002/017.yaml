  source_fidelity: Câu dự thảo giữ đúng thế tương phản với mệnh lệnh cho phép ở câu trước, lệnh cấm, thành ngữ thời gian בְּיוֹם, và sự nhấn mạnh của מוֹת תָּמוּת. Tuy nhiên, “cây biết điều thiện và điều ác” trong tiếng Việt hiện đại có thể được hiểu là cái cây tự nó ‘biết’; nguyên ngữ nói về cây gắn với ‘sự biết/tri thức’ điều thiện và điều ác.
  naturalness: Cấu trúc “nhưng về cây ... thì” và “con không được ăn trái của nó” tự nhiên, trang trọng, và phù hợp lời phán trực tiếp. “Vào ngày con ăn trái cây ấy” có thể rút thành “vào ngày con ăn trái ấy” để tránh lặp từ không cần thiết.
