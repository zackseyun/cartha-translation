source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: vi
  text: nhưng về cây của sự biết điều thiện và điều ác thì con không được ăn trái của nó[a], vì vào ngày con ăn trái ấy[b], chắc chắn con sẽ chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa tiếng Hê-bơ-rơ: “nhưng từ cây của sự biết điều thiện và điều ác, con không được ăn từ nó.”'
    reason: Câu Hê-bơ-rơ đưa đối tượng lên đầu rồi dùng lại đại từ; chính văn diễn đạt tự nhiên hơn trong tiếng Việt.
  - marker: b
    text: Cụm từ Hê-bơ-rơ “vào ngày con ăn” cũng có thể được hiểu là “khi con ăn”.
    reason: Ghi nhận cách hiểu thành ngữ khác mà không giải quyết sức căng về thời điểm của cái chết trong chính văn.
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: nhưng cây ... thì
  rationale: Liên từ וּ trong ngữ cảnh tạo thế tương phản với sự cho phép ở câu trước; cấu trúc chủ đề “cây ... thì” diễn đạt tự nhiên trong tiếng Việt và phản ánh việc cụm từ chỉ cây được đưa lên đầu câu.
- source_word: הַדַּעַת טוֹב וָרָע
  choice: biết điều thiện và điều ác
  rationale: דַּעַת chỉ sự biết hoặc tri thức. Cách diễn đạt này rõ ràng với độc giả phổ thông, đồng thời giữ cặp “điều thiện và điều ác” cùng sức nặng luân lý của רָע.
- source_word: לֹא תֹאכַל
  choice: con không được ăn
  rationale: Thể chưa hoàn thành đi với phủ định diễn tả lệnh cấm. “Không được ăn” tự nhiên trong tiếng Việt hiện đại và giữ rõ hiệu lực của mệnh lệnh.
- source_word: מִמֶּנּוּ
  choice: trái của nó / trái cây ấy
  rationale: Tiếng Hê-bơ-rơ nói sát là “từ nó”. Tiếng Việt cần một bổ ngữ tự nhiên cho động từ “ăn”, nên “trái” được bổ sung theo ngữ cảnh cây; đại từ được giữ để phản ánh sự lặp lại trong nguyên văn.
- source_word: כִּי
  choice: vì
  rationale: כִּי nêu lý do cho lệnh cấm; “vì” là tương đương trực tiếp và tự nhiên.
- source_word: בְּיוֹם אֲכָלְךָ
  choice: vào ngày con ăn
  rationale: Giữ hình ảnh thời gian “vào ngày” của nguyên văn, thay vì giải nghĩa dứt khoát là “khi”, để bảo tồn độ mở và sức căng của câu.
- source_word: מוֹת תָּמוּת
  choice: chắc chắn con sẽ chết
  rationale: Động từ nguyên mẫu tuyệt đối đi với động từ đã chia nhấn mạnh tính chắc chắn của cái chết. Cách dịch này truyền đạt rõ sự nhấn mạnh mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa thời gian của בְּיוֹם (“vào ngày”) đối với việc án chết được thực hiện
  choice: Giữ “vào ngày con ăn” trong chính văn
  alternative: Dịch linh hoạt là “khi con ăn”, hoặc giải thích thành cái chết thể xác tức thì hay sự bắt đầu của tình trạng phải chết
  rationale: Nguyên văn giữ một sức căng với diễn tiến tiếp theo của trình thuật. Bản dịch không nên tự quyết rằng cụm từ này chỉ cái chết thể xác ngay lập tức, sự khởi đầu của tính hữu tử, hay việc tuyên án chết.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ “con” phù hợp lời Đức Chúa Trời trực tiếp phán với người nam. Cấu trúc chủ đề “cây ... thì” là tự nhiên trong tiếng Việt; từ “trái” được bổ sung vì tiếng Việt khó nói “ăn từ cây”, nhưng không nhằm xác định loại trái nào.
