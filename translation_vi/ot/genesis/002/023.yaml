base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: vi
  text: 'Rồi người nam nói:


    “Cuối cùng, đây là xương từ xương tôi,

    thịt từ thịt tôi.

    Người này sẽ được gọi là ‘người nữ’[a],

    vì người này đã được lấy ra từ ‘người nam’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ, “người nữ” (ishah) và “người nam” (ish) tạo thành một lối chơi chữ; sự tương ứng này không thể hiện trọn vẹn trong tiếng Việt.
    reason: wordplay
lexical_decisions:
- source_word: הָאָדָם
  choice: người nam
  rationale: Trong câu này, אָדָם chỉ người nam đang nói và được đặt trong bối cảnh phân biệt với אִשָּׁה; cách dịch này tự nhiên hơn “con người” và chuẩn bị cho cặp từ người nữ/người nam.
- source_word: זֹאת הַפַּעַם
  choice: Lần này, đây chính là
  rationale: Giữ nghĩa cơ bản “lần này” của הַפַּעַם và sắc thái nhấn mạnh của זֹאת; “chính là” truyền đạt cảm giác nhận ra, mãn nguyện mà không biến thành một mốc thời gian không có trong nguyên văn.
- source_word: עֶצֶם מֵעֲצָמַי וּבָשָׂר מִבְּשָׂרִי
  choice: xương bởi xương tôi, thịt bởi thịt tôi
  rationale: “Bởi” giữ nét nghĩa nguồn gốc của מִן và tạo hai vế song song trang trọng, dễ hiểu; đồng thời tránh cách nói “xương từ những xương của tôi” quá cứng trong tiếng Việt.
- source_word: לְזֹאת יִקָּרֵא
  choice: Người này sẽ được gọi là
  rationale: “Người này” giữ lực chỉ định của זֹאת, còn “sẽ được gọi là” phản ánh thể bị động của יִקָּרֵא trong công thức đặt tên.
- source_word: אִשָּׁה ... אִישׁ
  choice: người nữ ... người nam
  rationale: Đây là các tương đương chính xác và tự nhiên trong tiếng Việt. Do tiếng Việt không tái tạo được lối chơi âm của tiếng Hê-bơ-rơ, chú thích nêu rõ mối liên hệ âm thanh.
- source_word: כִּי מֵאִישׁ לֻקֳחָה זֹּאת
  choice: vì nàng đã được lấy ra từ ‘người nam’
  rationale: Giữ quan hệ nguyên nhân của כִּי, ý nguồn gốc của מִן và thể bị động giống cái của לֻקֳחָה. Đại từ “nàng” tự nhiên trong tiếng Việt; lực chỉ định của זֹאת đã được thể hiện bằng “Người này” ở mệnh đề trước.
theological_decisions:
- issue: Cách hiểu אָדָם trong văn cảnh
  choice: người nam
  alternative: con người; loài người
  rationale: Dù אָדָם có thể chỉ con người nói chung, tại đây nhân vật được đặt trong tương quan giới tính với אִשָּׁה và אִישׁ. “Người nam” bảo toàn văn cảnh mà không suy diễn thêm về bản chất hay vai trò giới.
- issue: Cặp từ אִישׁ / אִשָּׁה
  choice: người nữ ... người nam
  alternative: vợ ... chồng
  rationale: Nguyên văn dùng danh từ chỉ nữ và nam, đồng thời tạo lối chơi chữ. Dịch là “vợ/chồng” sẽ thu hẹp nghĩa và đưa quan hệ hôn nhân vào ngay trong các danh xưng nhiều hơn mức câu này diễn đạt.
- issue: Ý nghĩa của זֹאת הַפַּעַם
  choice: Lần này, đây chính là
  alternative: Cuối cùng; phen này
  rationale: Cách chọn giữ cấu trúc và nghĩa từ vựng của tiếng Hê-bơ-rơ, đồng thời vẫn truyền đạt sắc thái nhận ra. “Cuối cùng” là cách diễn đạt thành ngữ khả dĩ nhưng làm rõ hàm ý hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “bởi” trong hai dòng thơ để giữ ý xuất phát từ và nhịp song song của nguyên văn; dùng dấu nháy cho hai danh xưng liên hệ trong lối chơi chữ. Marker [a] xuất hiện ngay sau “người nữ”.
