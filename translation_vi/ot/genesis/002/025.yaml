base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: vi
  text: Người đàn ông và vợ mình, cả hai đều trần truồng[a], và họ không hổ thẹn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói sát nghĩa là “hai người họ ... trần truồng”, nhấn mạnh rằng cả hai người trong đôi vợ chồng đều không mặc quần áo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: đều
  rationale: Dạng kể chuyện của היה nối tiếp mạch văn và kết hợp với vị ngữ chỉ trạng thái; trong tiếng Việt, ý 'ở trong tình trạng' được diễn đạt tự nhiên mà không cần dịch riêng một động từ 'là/ở'.
- source_word: שְׁנֵיהֶם
  choice: cả hai đều
  rationale: Diễn đạt rõ sự nhấn mạnh rằng điều được nói áp dụng cho cả hai người trong đôi vợ chồng.
- source_word: עֲרוּמִּים
  choice: trần truồng
  rationale: Diễn đạt trực tiếp trạng thái không mặc quần áo, tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: הָאָדָם
  choice: người đàn ông
  rationale: Trong ngữ cảnh này, nhân vật được đặt bên cạnh 'vợ mình', nên nghĩa cụ thể là người nam, không phải loài người nói chung.
- source_word: וְאִשְׁתּוֹ
  choice: và vợ mình
  rationale: Danh từ אִשָּׁה cùng hậu tố ngôi ba số ít giống đực ở đây chỉ người vợ của người đàn ông; 'mình' tránh cách diễn đạt tiếng Việt dễ gây cảm giác đứng ngoài câu chuyện.
- source_word: לֹא
  choice: không
  rationale: Từ phủ định thông thường.
- source_word: יִתְבֹּשָׁשׁוּ
  choice: hổ thẹn
  rationale: Dạng động từ này diễn tả việc cảm thấy xấu hổ; 'hổ thẹn' giữ được sắc thái sâu hơn 'ngượng ngùng' hay 'bối rối'.
theological_decisions:
- issue: Cách dịch הָאָדָם trong ngữ cảnh
  choice: người đàn ông
  alternative: con người; loài người
  rationale: Câu này phân biệt nhân vật nam với 'vợ mình', vì vậy cách dịch cụ thể theo giới tính phù hợp với ngữ cảnh mà không suy diễn thêm về bản tính con người.
- issue: Quan hệ giữa hai mệnh đề
  choice: nhưng họ không hổ thẹn
  alternative: và họ không hổ thẹn
  rationale: Liên từ וְ có thể đơn thuần nối hai mệnh đề, nhưng trong tiếng Việt, 'nhưng' diễn đạt tự nhiên sự tương phản hàm ý giữa tình trạng trần truồng và việc không hổ thẹn, mà không làm thay đổi nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc 'Người đàn ông và vợ mình, cả hai đều...' giữ sự nhấn mạnh của שְׁנֵיהֶם; 'hổ thẹn' trang trọng và sát sắc thái hơn 'xấu hổ' hoặc 'ngượng'.
