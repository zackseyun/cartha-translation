  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: người đàn ông, vợ ông, sự nhấn mạnh rằng cả hai đều trần truồng, và việc họ không hổ thẹn. Tuy nhiên, וְ trước mệnh đề cuối là liên từ nối đơn thuần; dịch là “nhưng” diễn giải một quan hệ tương phản không được biểu thị rõ trong nguyên ngữ.'
  naturalness: Câu tiếng Việt nhìn chung tự nhiên, rõ ràng và có văn phong trang trọng vừa phải. “Cả hai đều trần truồng” diễn đạt tốt trọng tâm của שְׁנֵיהֶם. “Không hổ thẹn” phù hợp sắc thái trang trọng của bản văn.
  terminology: “Người đàn ông” phù hợp với הָאָדָם trong ngữ cảnh đối chiếu với vợ ông; “vợ mình” tự nhiên trong tiếng Việt. “Trần truồng” là từ trực tiếp, chuẩn xác cho עֲרוּמִּים. Không cần cố tạo liên hệ âm thanh với từ “xảo quyệt” ở câu kế tiếp, vì tiếng Việt không có tương ứng tự nhiên.
