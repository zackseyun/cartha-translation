base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: vi
  text: Tên con sông thứ ba là Hi-đê-ke[a]; đó là con sông chảy ở phía đông A-su-rơ[b]. Còn con sông thứ tư là Ơ-phơ-rát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hi-đê-ke theo truyền thống được đồng nhất với sông Ti-gơ-rơ.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “ở phía đông A-si-ri”; nguyên văn Hê-bơ-rơ là “ở phía đông A-su-rơ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: tên
  rationale: Nghĩa thông thường của từ này; cách nói “tên con sông” tự nhiên và sát nguyên văn.
- source_word: נָּהָר
  choice: con sông
  rationale: Chỉ một dòng sông; thêm loại từ “con” phù hợp cách dùng tiếng Việt hiện đại.
- source_word: שְּׁלִישִׁי
  choice: thứ ba
  rationale: Chuyển trực tiếp số thứ tự trong tiếng Hê-bơ-rơ.
- source_word: חִדֶּקֶל
  choice: Hi-đê-ke
  rationale: Phiên âm tên Hê-bơ-rơ thay vì thay thế bằng tên được nhận diện theo truyền thống; tên Ti-gơ-rơ được nêu trong chú thích.
- source_word: הוּא
  choice: đó là
  rationale: Diễn đạt tự nhiên chức năng xác định của đại từ độc lập trong câu.
- source_word: הֹלֵךְ
  choice: chảy
  rationale: Động từ có nghĩa gốc là “đi”; khi chủ thể là sông, “chảy” là cách diễn đạt tự nhiên và đúng ngữ cảnh địa lý.
- source_word: קִדְמַת
  choice: về phía đông
  rationale: Trong ngữ cảnh địa lý, từ này chỉ phía đông; giữ sắc thái hướng đi của phân từ הֹלֵךְ mà không khẳng định quá mức rằng toàn bộ dòng sông nằm ở phía đông.
- source_word: אַשּׁוּר
  choice: A-su-rơ
  rationale: Phiên âm tên riêng Hê-bơ-rơ, đồng thời giữ khả năng từ này chỉ A-si-ri qua chú thích.
- source_word: רְבִיעִי
  choice: thứ tư
  rationale: Chuyển trực tiếp số thứ tự trong tiếng Hê-bơ-rơ.
- source_word: פְרָת
  choice: Ơ-phơ-rát
  rationale: Dùng tên gọi tiếng Việt quen thuộc của sông Euphrates để người đọc hiện đại dễ nhận biết.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Còn” ở vế cuối để nối mạch liệt kê tự nhiên. Các tên Hi-đê-ke và A-su-rơ được phiên âm từ Hê-bơ-rơ; tên sông Ơ-phơ-rát dùng dạng tiếng Việt đã quen thuộc.
