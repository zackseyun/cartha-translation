id: GEN.2.4
reference: Genesis 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֵ֣לֶּה תוֹלְד֧וֹת הַ/שָּׁמַ֛יִם וְ/הָ/אָ֖רֶץ בְּ/הִבָּֽרְאָ֑/ם בְּ/י֗וֹם עֲשׂ֛וֹת יְהוָ֥ה אֱלֹהִ֖ים אֶ֥רֶץ וְ/שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: vi
  text: Đây là lịch sử[a] của trời và đất khi chúng được tạo dựng, vào thời[b] Yahweh Đức Chúa Trời[c] làm nên đất và trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ tô-lê-đốt thường được dịch là “các thế hệ” hoặc “dòng dõi”; trong các tiêu đề phân đoạn của sách Sáng Thế, từ này cũng có thể mang nghĩa “lịch sử”, “ký thuật” hay “nguồn gốc”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “trong ngày”; đây là một thành ngữ Hê-bơ-rơ có nghĩa “khi” hoặc “vào thời”.
    reason: lexical_alternative
  - marker: c
    text: Danh riêng trong tiếng Hê-bơ-rơ là YHWH, ở đây được phiên là “Yahweh”; theo truyền thống, danh này thường được dịch là “ĐỨC CHÚA”, và cũng có cách phiên âm “Giê-hô-va”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: Đây là lịch sử
  rationale: Đại từ số nhiều אֵלֶּה mở đầu một công thức phân đoạn, nhưng tiếng Việt tự nhiên dùng “đây là”. תוֹלְדוֹת có thể chỉ dòng dõi, nguồn gốc hoặc phần lịch sử được thuật lại; với “trời và đất”, “lịch sử” vừa rõ nghĩa vừa phù hợp chức năng tiêu đề.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: trời và đất
  rationale: Cụm này chỉ toàn thể trật tự thọ tạo. “Trời và đất” là cách nói tự nhiên, quen thuộc trong tiếng Việt; tiếng Việt không đánh dấu hình thái số nhiều của שָׁמַיִם.
- source_word: בְּהִבָּרְאָם
  choice: khi chúng được tạo dựng
  rationale: Giữ ý nghĩa thời gian của giới từ בְּ và thể bị động của động từ ברא; “chúng” quy chiếu về trời và đất.
- source_word: בְּיוֹם עֲשׂוֹת
  choice: vào thời … làm nên
  rationale: בְּיוֹם ở đây là thành ngữ chỉ thời điểm, không nhất thiết giới hạn vào một ngày theo nghĩa đen. “Vào thời” giữ sắc thái thời gian mà vẫn tự nhiên.
- source_word: עֲשׂוֹת
  choice: làm nên
  rationale: Diễn đạt trực tiếp động từ עשה, đồng thời phân biệt nhẹ với ברא đã được dịch là “tạo dựng” ở vế trước.
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: đất và trời
  rationale: Giữ nguyên thứ tự đảo ngược so với “trời và đất” ở đầu câu, nhằm bảo tồn hiệu ứng văn chương của nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp bốn phụ âm YHWH. Dùng “Yahweh” cho thấy đây là danh riêng, còn chú thích ghi nhận lối dịch truyền thống và cách phiên âm khác mà không khẳng định chắc chắn tuyệt đối về cách phát âm cổ.
- issue: Quan hệ giữa יְהוָה và אֱלֹהִים
  choice: Yahweh Đức Chúa Trời
  alternative: Đức Chúa Trời Yahweh
  rationale: Giữ thứ tự của cụm Hê-bơ-rơ, trong đó danh riêng יְהוָה đứng trước danh xưng אֱלֹהִים, và tránh giải thích thêm về quan hệ thần học giữa hai từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc tiêu đề của nguyên văn, duy trì thứ tự “trời và đất” rồi đảo thành “đất và trời”. Các điểm đa nghĩa của תוֹלְדוֹת, thành ngữ בְּיוֹם và cách thể hiện danh YHWH được nêu trong chú thích thay vì bị giải quyết ngầm.
