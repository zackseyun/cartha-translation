source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: vi
  text: 'Yahweh, Đức Chúa Trời, truyền lệnh cho người nam rằng: “Ngươi được tự do ăn[a] trái từ mọi cây trong vườn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chắc chắn được ăn.” Tiếng Hebrew dùng nguyên thể tuyệt đối cùng với động từ hữu hạn để nhấn mạnh.'
    reason: Bảo tồn cách hiểu khác về sắc thái nhấn mạnh của אָכֹל תֹּאכֵל.
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Động từ צוה diễn tả một mệnh lệnh có thẩm quyền; “truyền lệnh” vừa rõ nghĩa vừa trang trọng trong tiếng Việt hiện đại.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Đức Chúa Trời
  rationale: Giữ nguyên danh riêng Yahweh của Đức Chúa Trời, đồng thời dịch אֱלֹהִים bằng cách gọi tự nhiên và trang trọng trong tiếng Việt.
- source_word: הָאָדָם
  choice: người nam
  rationale: Trong mạch truyện, cụm từ chỉ cá nhân vừa được dựng nên và đặt trong vườn, không phải toàn thể nhân loại; “người nam” giữ được quy chiếu số ít và giới tính trong ngữ cảnh.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Đây là công thức dẫn lời trực tiếp; “rằng” tự nhiên hơn việc dịch máy móc là “nói rằng” sau động từ “truyền lệnh”.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: trái từ mọi cây trong vườn
  rationale: Tiếng Hebrew nói sát là “từ mọi cây trong vườn”. Trong tiếng Việt, thêm “trái” làm rõ đối tượng được ăn theo nghĩa hiển nhiên của ngữ cảnh, tránh cách hiểu là ăn chính thân cây.
- source_word: אָכֹל תֹּאכֵל
  choice: được tự do ăn
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động ăn. Trong ngữ cảnh, đây là sự cho phép rộng rãi, nên “được tự do ăn” diễn đạt tự nhiên cả sắc thái cho phép lẫn nhấn mạnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn trực tiếp dùng danh riêng יהוה. Phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi quy chiếu của הָאָדָם
  choice: người nam
  alternative: con người; loài người
  rationale: Câu này nói với cá nhân trong vườn. Dịch “loài người” sẽ mở rộng sai phạm vi, còn “người nam” giữ được quy chiếu cá nhân trong mạch truyện.
- issue: Sắc thái của אָכֹל תֹּאכֵל
  choice: được tự do ăn
  alternative: chắc chắn được ăn; cứ ăn
  rationale: Cấu trúc Hebrew có tính nhấn mạnh nhưng ở đây nằm trong lời cho phép. Bản dịch không biến lời cho phép thành mệnh lệnh bắt buộc phải ăn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” giữ sắc thái lời phán trực tiếp có thẩm quyền trong bối cảnh cổ, còn cấu trúc câu được làm gọn theo cú pháp tiếng Việt. Không dùng lối diễn đạt quá Hán-Việt hoặc cổ hóa ngoài mức cần thiết.
