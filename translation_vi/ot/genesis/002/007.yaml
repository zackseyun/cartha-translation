source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: vi
  text: Bấy giờ, Giê-hô-va Đức Chúa Trời nắn nên con người từ bụi đất và thổi hơi thở sự sống vào lỗ mũi người; con người trở thành một sinh vật sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một hữu thể sống”; theo cách dịch truyền thống: “một linh hồn sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Giê-hô-va Đức Chúa Trời
  rationale: Giữ danh riêng giao ước bằng dạng phiên âm quen thuộc trong tiếng Việt, đồng thời dịch אֱלֹהִים là tước hiệu “Đức Chúa Trời”.
- source_word: וַיִּיצֶר
  choice: tạo nên
  rationale: Diễn đạt hành động nắn tạo thành hình một cách tự nhiên trong tiếng Việt, không làm mất hình ảnh cụ thể của động từ יצר.
- source_word: הָאָדָם
  choice: người nam
  rationale: Trong ngữ cảnh này, từ chỉ cá nhân con người đang được tạo dựng; “người nam” giữ nét quy chiếu giới tính mà mạch truyện tiếp theo làm rõ, thay vì dịch thành nhân loại nói chung.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: bụi đất từ mặt đất
  rationale: Giữ cả chất liệu עָפָר và nguồn gốc מִן־הָאֲדָמָה, đồng thời phần nào phản ánh mối liên hệ từ ngữ giữa אָדָם và אֲדָמָה.
- source_word: בְּאַפָּיו
  choice: vào lỗ mũi người
  rationale: Giữ tính cụ thể về thân thể của cách diễn đạt Hê-bơ-rơ và tránh đại từ có thể gây mơ hồ trong tiếng Việt.
- source_word: נִשְׁמַת חַיִּים
  choice: sinh khí
  rationale: “Sinh khí” là cách diễn đạt trang trọng, tự nhiên cho hơi thở ban sự sống; số nhiều חַיִּים mang nghĩa trừu tượng/cường điệu chứ không cần dịch sát là “các sự sống”.
- source_word: לְנֶפֶשׁ חַיָּה
  choice: một sinh vật sống
  rationale: Diễn tả toàn thể hữu thể có sự sống, phù hợp với phạm vi nghĩa của נֶפֶשׁ và cách cụm này cũng được dùng cho động vật, không áp đặt ý niệm linh hồn phi vật chất tách khỏi thân thể.
theological_decisions:
- issue: Cách dịch הָאָדָם và tính đại diện của con người
  choice: người nam
  alternative: con người; loài người
  rationale: Câu chuyện nói đến một cá nhân cụ thể được tạo dựng. Lựa chọn này không phủ nhận ý nghĩa đại diện cho nhân loại, nhưng không biến số ít cụ thể thành danh từ tập thể.
- issue: Cách dịch לְנֶפֶשׁ חַיָּה
  choice: một sinh vật sống
  alternative: một hữu thể sống; một linh hồn sống
  rationale: Cụm Hê-bơ-rơ nói đến một hữu thể sống toàn vẹn. “Linh hồn sống” trong tiếng Việt hiện đại dễ bị hiểu là một phần phi vật chất tách biệt, điều câu này không tự xác quyết.
- issue: Danh giao ước יְהוָה
  choice: Giê-hô-va
  alternative: ĐỨC GIÊ-HÔ-VA; Đức Chúa
  rationale: Dùng một dạng danh riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt nhằm phân biệt danh giao ước với tước hiệu אֱלֹהִים, dù cách phát âm nguyên thủy thường được phục dựng là Yahweh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Bấy giờ” để nối mạch kể chuyện; giữ cấu trúc ba hành động liên tiếp. Tránh cách hiểu nhị nguyên không có sẵn trong נֶפֶשׁ, đồng thời dùng thuật ngữ Việt quen thuộc cho danh Đức Chúa Trời.
