id: GEN.2.9
reference: Genesis 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: vi
  text: Yahweh Đức Chúa Trời khiến từ đất mọc lên mọi cây đẹp mắt và tốt cho thức ăn, cùng cây sự sống ở giữa vườn, và cây tri thức về điều thiện và điều ác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ “tri thức về điều thiện và điều ác” được dịch sát nguyên văn. Có nhiều cách hiểu, chẳng hạn: khả năng phân định đạo đức, sự trưởng thành, hoặc tri thức bao quát.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: khiến ... mọc lên
  rationale: Dạng Hiphil mang ý nghĩa tác khiến; cách dịch này vừa phản ánh thể sai khiến vừa tự nhiên trong tiếng Việt.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Đức Chúa Trời
  rationale: Giữ danh riêng giao ước Yahweh và dùng danh xưng tiếng Việt quen thuộc cho אֱלֹהִים.
- source_word: מִן הָאֲדָמָה
  choice: từ đất
  rationale: Ở đây אֲדָמָה chỉ đất nơi cây cối mọc lên; “từ đất” ngắn gọn và tự nhiên.
- source_word: כָּל עֵץ
  choice: mọi thứ cây
  rationale: Diễn đạt ý phân bố của כָּל với danh từ số ít, đồng thời phù hợp cách nói tiếng Việt.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: trông đẹp mắt
  rationale: Truyền đạt sự hấp dẫn về thị giác bằng lối diễn đạt hiện đại, tự nhiên.
- source_word: וְטוֹב לְמַאֲכָל
  choice: và có trái dùng làm thức ăn
  rationale: Trong ngữ cảnh cây, “có trái” được hàm hiểu hơn là được nói trực tiếp; cách diễn đạt làm rõ cây cung cấp thức ăn mà không hàm ý ăn gỗ hay toàn bộ cây.
- source_word: וְעֵץ הַחַיִּים
  choice: cùng cây sự sống
  rationale: Giữ nguyên cấu trúc danh từ thần học truyền thống và minh bạch.
- source_word: בְּתוֹךְ הַגָּן
  choice: ở giữa vườn
  rationale: Phản ánh vị trí bên trong hoặc trung tâm do בְּתוֹךְ biểu thị mà vẫn tự nhiên.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: và cây biết điều thiện điều ác
  rationale: Giữ công thức Hê-bơ-rơ ở mức sát nghĩa, không quyết định rằng đó riêng là sự phân định đạo đức, sự trưởng thành hay tri thức toàn diện.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Dùng danh riêng Yahweh để biểu thị trực tiếp Danh trong nguyên văn, thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của דַּעַת טוֹב וָרָע
  choice: giữ cách nói “biết điều thiện điều ác”
  alternative: khả năng phân định đạo đức / biết mọi sự / biết điều có lợi và có hại
  rationale: Cụm từ có nhiều cách giải thích; bản dịch không thu hẹp ý nghĩa vào một cách hiểu thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Trật tự câu được điều chỉnh vừa phải theo tiếng Việt, trong khi vẫn giữ chuỗi ba nhóm cây và sự mơ hồ thần học của vế cuối.
