  terminology: Giữ “Đức Chúa Trời” và “Ngài” theo đăng ký Kinh Thánh phổ thông của bản thảo. “Nên thánh” giữ thuật ngữ thánh khiết mà không dùng một cách nói quá hàn lâm. “Nghỉ” bảo tồn liên hệ từ vựng với ngày Sa-bát; chú thích bảo lưu nghĩa “ngừng/thôi làm”.
