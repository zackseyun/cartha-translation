  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các động từ chính: Đức Chúa Trời ban phước, làm ngày thứ bảy nên thánh, và nghỉ/ngừng công việc. Cụm אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת quả thực khó về cú pháp; bản chính nên giữ độ căng này, với chú thích nêu các cách hiểu khác.'
