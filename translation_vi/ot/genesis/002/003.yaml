  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: vi
  text: Đức Chúa Trời ban phước cho ngày thứ bảy và làm cho ngày ấy nên thánh[a], vì vào ngày ấy, Ngài nghỉ mọi công việc[b] mà Đức Chúa Trời đã sáng tạo để làm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thánh hóa ngày ấy” hoặc “dành riêng ngày ấy làm ngày thánh.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ cũng có thể có nghĩa là “ngừng” hoặc “thôi làm.”
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hê-bơ-rơ: “mà Đức Chúa Trời đã sáng tạo để làm.” Cụm cuối câu khó hiểu; cũng có thể hiểu là “mà Đức Chúa Trời đã sáng tạo và làm nên” hoặc “mà Đức Chúa Trời đã sáng tạo bằng cách làm nên.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: ban phước
  rationale: Diễn đạt tự nhiên động từ ברך ở thể piel, nói về việc Đức Chúa Trời ban phước cho ngày thứ bảy.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ đi với động từ số ít và chỉ về Đức Chúa Trời duy nhất trong mạch văn sáng tạo.
- source_word: יּוֹם הַשְּׁבִיעִי
  choice: ngày thứ bảy
  rationale: Chuyển ngữ trực tiếp danh từ kèm số thứ tự có mạo từ.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: thánh hóa ngày ấy
  rationale: Giữ rõ ý khiến ngày ấy nên thánh hoặc biệt riêng ngày ấy làm thánh, đồng thời dùng lối diễn đạt trang trọng và quen thuộc trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do Đức Chúa Trời ban phước và thánh hóa ngày thứ bảy.
- source_word: בּוֹ
  choice: trong ngày ấy
  rationale: Đại từ giới từ quy chiếu về ngày thứ bảy; cách nói này tự nhiên trong tiếng Việt và giữ quan hệ thời gian.
- source_word: שָׁבַת
  choice: nghỉ
  rationale: Giữ mối liên hệ từ vựng với sự nghỉ ngày Sa-bát; chú thích nêu nghĩa khả dĩ là ngừng hoặc thôi.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: khỏi mọi công việc
  rationale: Giữ giới từ chỉ sự chấm dứt khỏi hoạt động cùng nghĩa rộng của מְלָאכָה là công việc.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: mà Đức Chúa Trời đã sáng tạo để làm nên
  rationale: Bám sát hai động từ ברא và עשה cùng cấu trúc nguyên mẫu có ל, không tự ý giải quyết hoàn toàn cú pháp khó của cụm cuối câu.
theological_decisions:
- issue: Ý nghĩa của שָׁבַת trong mối liên hệ với ngày Sa-bát
  choice: nghỉ
  alternative: ngừng; thôi làm
  rationale: “Nghỉ” duy trì mối liên hệ thần học và từ vựng với ngày Sa-bát nhưng không nhất thiết hàm ý Đức Chúa Trời mệt mỏi; nghĩa “ngừng” được bảo lưu trong chú thích.
- issue: Cách diễn đạt וַיְקַדֵּשׁ אֹתוֹ
  choice: thánh hóa ngày ấy
  alternative: làm cho ngày ấy nên thánh; biệt riêng ngày ấy làm thánh
  rationale: Giữ ngôn ngữ về sự thánh khiết mà không thu hẹp hành động chỉ còn một khía cạnh nghi lễ hay giáo phái.
- issue: Cú pháp khó của אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: đã sáng tạo để làm nên
  alternative: đã sáng tạo và làm nên; đã sáng tạo bằng cách làm nên
  rationale: Bản chính giữ sự căng thẳng và nét mơ hồ của cấu trúc Hê-bơ-rơ; chú thích cung cấp các cách hiểu khả dĩ mà không xác quyết một cách duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ “Ngài” theo văn phong Kinh Thánh phổ thông; giữ cấu trúc hơi khác thường ở cuối câu vì nguyên văn có điểm khó thực sự, đồng thời giải thích bằng chú thích.
