id: GEN.2.20
reference: Genesis 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: vi
  text: Người nam đặt tên cho mọi gia súc, chim trời và mọi thú đồng,[a] nhưng người nam không tìm thấy một người trợ giúp tương xứng với mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mọi thú hoang”.
    reason: “Thú đồng” dịch sát hình ảnh Hê-bơ-rơ; trong ngữ cảnh, cụm từ chỉ các động vật hoang dã sống ngoài đồng.
  - marker: b
    text: Hay “nhưng đối với người nam, không tìm thấy một người trợ giúp tương xứng với mình.”
    reason: Nguyên văn có thể được diễn đạt trong tiếng Việt theo hướng nhấn mạnh kết quả là không có ai được tìm thấy, thay vì chủ thể người nam không tìm thấy.
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: người nam
  rationale: Trong ngữ cảnh này, từ có mạo từ và chỉ cá nhân người nam trong câu chuyện, không phải toàn thể loài người. Cách dịch này giữ nghĩa danh từ chung nổi bật ở giai đoạn này, thay vì sớm coi đó là tên riêng A-đam.
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: đặt tên
  rationale: Thành ngữ Hê-bơ-rơ chỉ hành động gán tên; “đặt tên” tự nhiên, rõ nghĩa và sát với cách diễn đạt tiếng Việt hiện đại.
- source_word: הַבְּהֵמָה
  choice: gia súc
  rationale: Từ này ở đây chỉ lớp động vật đã được con người nuôi, đối lập với thú đồng; “gia súc” là cách gọi gọn và quen thuộc.
- source_word: עוֹף הַשָּׁמַיִם
  choice: chim trời
  rationale: Cụm từ chỉ các loài chim bay trên trời; “chim trời” giữ hình ảnh nguyên ngữ và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: mọi thú đồng
  rationale: Cụm từ chỉ các động vật sống ngoài đồng, không thuộc gia súc. “Thú đồng” giữ hình ảnh cụ thể của nguyên ngữ mà vẫn trang trọng và dễ hiểu.
- source_word: עֵזֶר
  choice: người trợ giúp
  rationale: Trong ngữ cảnh này, danh từ nói đến một hữu thể có thể giúp đỡ và làm bạn tương ứng với người nam. Cách dịch không hàm ý địa vị thấp kém.
- source_word: כְּנֶגְדּוֹ
  choice: tương xứng với mình
  rationale: Từ này mang ý ở đối diện và tương ứng với người nam. “Tương xứng với mình” giữ sắc thái quan hệ ấy mà không thu hẹp thành chỉ “thích hợp”.
- source_word: לֹא מָצָא
  choice: không tìm thấy
  rationale: 'Động từ Hê-bơ-rơ ở thể chủ động, ngôi thứ ba số ít: “người ấy không tìm thấy.” Tiếng Việt dùng chủ động tự nhiên và trung thành trực tiếp với hình thái nguyên văn.'
theological_decisions:
- issue: Cách dịch אָדָם trong Sáng Thế Ký 2:20
  choice: người nam
  alternative: A-đam
  rationale: Câu này nói về cá nhân người nam trong vườn, nhưng nghĩa danh từ chung vẫn nổi bật do lần xuất hiện đầu có mạo từ. Dịch “người nam” duy trì tiến trình văn chương trước khi tên riêng A-đam trở nên rõ hơn; cách hiểu như tên riêng vẫn có thể có.
- issue: Sắc thái của עֵזֶר כְּנֶגְדּוֹ
  choice: một người trợ giúp tương xứng với mình
  alternative: một người trợ giúp thích hợp cho mình
  rationale: “Tương xứng” bảo tồn ý vừa đối diện vừa tương ứng trong כְּנֶגְדּוֹ, đồng thời không đưa vào quan niệm rằng người trợ giúp mang địa vị thấp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “người nam” để giữ nghĩa danh từ chung của הָאָדָם; dùng “chim trời” và “thú đồng” nhằm bảo tồn hình ảnh nguyên ngữ. Tất cả dấu chú thích đều xuất hiện trong câu chính.
