  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần của tiếng Hê-bơ-rơ: người nam thực hiện việc đặt tên cho gia súc, chim trời và mọi thú đồng; rồi chính người nam không tìm thấy một trợ giúp tương ứng với mình. Cách dùng chủ động “không tìm thấy” phản ánh trực tiếp động từ מָצָא ngôi ba số ít. “Thú đồng” bảo tồn hình ảnh חַיַּת הַשָּׂדֶה, và chú thích giải thích hợp lý sắc thái động vật hoang dã trong ngữ cảnh.'
