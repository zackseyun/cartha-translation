id: GEN.2.19
reference: Genesis 2:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: vi
  text: Giê-hô-va Đức Chúa Trời đã tạo nên từ đất mọi loài thú đồng và mọi loài chim trời[a], rồi Ngài đem chúng đến với người nam để xem người sẽ gọi chúng là gì. Người nam gọi mỗi sinh vật sống bằng tên nào thì đó là tên của nó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ cũng có thể dịch đơn giản là “tạo nên”. Cách nói “đã tạo nên” trong tiếng Việt không nhất thiết xác định hành động này xảy ra trước hay sau các sự việc vừa kể.
    reason: alternative_reading
  - marker: b
    text: “Người nam” dịch từ ha’adam, nghĩa đen là “người nam”; cũng có thể được hiểu là tên riêng “A-đam”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: đã tạo nên
  rationale: Động từ chỉ hành động tạo thành; tiếng Việt không buộc phải phân biệt quá khứ đơn và quá khứ hoàn thành như tiếng Anh. “Đã tạo nên” diễn đạt hành động quá khứ tự nhiên mà không quyết định cứng thứ tự thời gian.
- source_word: יְהוָה אֱלֹהִים
  choice: Giê-hô-va Đức Chúa Trời
  rationale: Giữ danh riêng giao ước YHWH bằng dạng phiên âm quen thuộc trong tiếng Việt và kết hợp với tước hiệu אֱלֹהִים.
- source_word: מִן הָאֲדָמָה
  choice: từ đất
  rationale: Diễn đạt ngắn gọn chất liệu/nguồn gốc từ mặt đất, đồng thời giữ liên hệ từ vựng với việc con người được dựng nên từ đất trong ngữ cảnh.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: mọi loài thú đồng
  rationale: “Thú đồng” là cách nói trang trọng, dễ hiểu, phản ánh các loài vật thuộc đồng ruộng hoặc vùng hoang dã mà không thu hẹp quá mức vào thú dữ.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: mọi loài chim trời
  rationale: Cách diễn đạt tự nhiên và trang trọng cho các loài chim bay trên trời.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: Ngài đem chúng đến với người nam
  rationale: Bổ sung đại từ số nhiều “chúng” theo đối tượng đã nêu; הָאָדָם còn mang nghĩa danh từ chung nên dịch là “người nam” thay vì mặc nhiên coi là tên riêng.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: để xem người sẽ gọi chúng là gì
  rationale: Giữ nguyên ý mục đích và động từ “gọi”, đồng thời dùng số nhiều tự nhiên trong tiếng Việt theo các loài vật vừa nhắc đến.
- source_word: נֶפֶשׁ חַיָּה
  choice: sinh vật sống
  rationale: Trong ngữ cảnh này, cụm từ chỉ một hữu thể có sự sống; cách dịch này tránh đưa vào khái niệm thần học về “linh hồn” không do câu Hebrew đòi hỏi.
- source_word: הוּא שְׁמוֹ
  choice: đó là tên của nó
  rationale: Diễn đạt tự nhiên mệnh đề không có động từ trong Hebrew và quy chiếu về từng sinh vật được đặt tên.
theological_decisions:
- issue: Thời thể của וַיִּצֶר và trật tự sáng tạo
  choice: Dịch “đã tạo nên”, không thêm từ chỉ rõ “đã tạo nên trước đó”
  alternative: “tạo nên” hoặc “đã tạo nên từ trước”
  rationale: Wayyiqtol thường kể hành động quá khứ nhưng bản thân hình thái không đánh dấu quá khứ hoàn thành. Tiếng Việt cho phép “đã tạo nên” giữ hành động quá khứ mà không buộc giải quyết quan hệ thời gian với Sáng Thế Ký 1.
- issue: הָאָדָם là danh từ chung hay tên riêng
  choice: người nam
  alternative: A-đam
  rationale: Mạo từ xác định và lối chơi chữ với אֲדָמָה ủng hộ nghĩa danh từ chung “người nam/người ấy” tại đây; khả năng đọc theo tên riêng truyền thống được ghi chú.
- issue: Cách thể hiện danh יהוה
  choice: Giê-hô-va
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Phiên âm danh riêng giúp phân biệt יהוה với אֱלֹהִים trong danh xưng kép và phù hợp lối dùng Kinh Thánh quen thuộc của nhiều độc giả Việt, không áp đặt một cách đọc giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ngài” cho Đức Chúa Trời; giữ cấu trúc lặp “gọi… là gì” của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
