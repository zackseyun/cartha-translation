revisions:
- from: Giê-hô-va Đức Chúa Trời đã tạo nên từ đất mọi loài thú đồng và mọi loài chim trời[a], rồi Ngài đem chúng đến với người nam để xem người sẽ gọi chúng là gì. Người nam gọi mỗi sinh vật sống là gì thì đó là tên của nó[b].
  to: Giê-hô-va Đức Chúa Trời đã tạo nên từ đất mọi loài thú đồng và mọi loài chim trời[a], rồi Ngài đem chúng đến với người nam để xem người sẽ gọi chúng là gì. Người nam gọi mỗi sinh vật sống bằng tên nào thì đó là tên của nó[b].
  rationale: Chỉ chỉnh mệnh đề cuối để tiếng Việt tự nhiên và minh bạch hơn, đồng thời tinh gọn chú thích b cho sát với cách dùng ha’adam trong câu. Các lựa chọn về danh xưng thần linh, thời thể, và thuật ngữ chính được giữ nguyên.
