base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: vi
  text: Giê-hô-va Đức Chúa Trời khiến một giấc ngủ mê giáng xuống trên người nam, và ông ngủ. Rồi Ngài lấy một chiếc xương sườn[a] của ông và khép chỗ ấy lại bằng thịt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một phần bên sườn của ông.” Từ Hê-bơ-rơ này có thể chỉ một bên hoặc một phần bên sườn, cũng như một chiếc xương sườn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: khiến ... phủ xuống
  rationale: Dạng Hiphil của נפל mang nghĩa khiến xảy ra; cách diễn đạt này giữ hình ảnh giấc ngủ được khiến cho phủ xuống mà vẫn tự nhiên trong tiếng Việt.
- source_word: יְהוָה אֱלֹהִים
  choice: Giê-hô-va Đức Chúa Trời
  rationale: Giữ danh riêng giao ước יהוה bằng dạng Việt hóa quen thuộc “Giê-hô-va”, đồng thời dịch אֱלֹהִים là “Đức Chúa Trời”.
- source_word: תַּרְדֵּמָה
  choice: một giấc ngủ mê
  rationale: Danh từ chỉ trạng thái ngủ rất sâu, nặng, thường do Đức Chúa Trời khiến đến; “giấc ngủ mê” rõ nghĩa và hợp ngữ cảnh.
- source_word: הָאָדָם
  choice: người nam
  rationale: Trong mạch truyện trực tiếp, từ này chỉ cá nhân nam cụ thể, không phải toàn thể loài người; “người nam” phân biệt đúng giới tính mà chưa dùng tên riêng A-đam.
- source_word: וַיִּישָׁן
  choice: và ông ngủ
  rationale: Chuyển sát động từ đơn “ngủ”, giữ nhịp kể tuần tự của nguyên văn.
- source_word: וַיִּקַּח
  choice: Rồi Ngài lấy
  rationale: “Rồi” thể hiện diễn tiến của chuỗi động từ wayyiqtol; viết hoa đại từ giúp tham chiếu rõ về Đức Chúa Trời mà không thêm nội dung.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: một chiếc xương sườn của ông
  rationale: צֵלָע có thể chỉ xương sườn hoặc bên/sườn. Hình ảnh lấy một bộ phận rồi khép thịt lại làm cho “xương sườn” là cách hiểu tự nhiên; nghĩa khác được giữ trong chú thích.
- source_word: וַיִּסְגֹּר בָּשָׂר
  choice: khép thịt lại
  rationale: סגר nghĩa là đóng hoặc khép; cách dịch này truyền đạt hành động khép kín chỗ lấy bộ phận cơ thể và tự nhiên trong tiếng Việt.
- source_word: תַּחְתֶּנָּה
  choice: ở chỗ đó
  rationale: Nghĩa đen liên quan đến vị trí bên dưới/thay vào đó; trong ngữ cảnh, cụm từ chỉ chỗ bộ phận vừa được lấy ra. “Ở chỗ đó” giữ tham chiếu vị trí mà không diễn giải quá mức.
theological_decisions:
- issue: Cách dịch אָדָם trong ngữ cảnh
  choice: người nam
  alternative: con người; loài người; A-đam
  rationale: Câu này nói về một cá nhân nam cụ thể mà từ người ấy người nữ sẽ được dựng nên ở câu tiếp theo. Tuy nhiên, nguyên văn vẫn dùng danh từ có mạo từ chứ chưa nhất thiết là tên riêng, nên không chuyển thành “A-đam”.
- issue: Cách hiểu צֵלָע
  choice: xương sườn
  alternative: bên; phần sườn
  rationale: Ngữ cảnh giải phẫu và việc khép thịt lại hỗ trợ cách hiểu “xương sườn”. Vì “bên/phần sườn” vẫn là khả năng từ vựng thực sự và có ý nghĩa giải thích, phương án ấy được nêu trong chú thích thay vì bị loại bỏ.
- issue: Chủ thể của các động từ sau giấc ngủ
  choice: Ngài
  alternative: Đức Chúa Trời
  rationale: Chủ thể vẫn là Giê-hô-va Đức Chúa Trời. Đại từ “Ngài” giúp câu tự nhiên và rõ tham chiếu, không thay đổi nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngủ mê” để diễn tả trạng thái ngủ sâu; giữ cấu trúc kể chuyện ngắn gọn. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
