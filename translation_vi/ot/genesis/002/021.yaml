revisions:
- from: Giê-hô-va Đức Chúa Trời khiến một giấc ngủ mê phủ xuống người nam, và ông ngủ. Rồi Ngài lấy một chiếc xương sườn[a] của ông và khép thịt lại ở chỗ đó.
  to: Giê-hô-va Đức Chúa Trời khiến một giấc ngủ mê giáng xuống trên người nam, và ông ngủ. Rồi Ngài lấy một chiếc xương sườn[a] của ông và khép chỗ ấy lại bằng thịt.
  rationale: Chỉ điều chỉnh hai chỗ để văn phong tự nhiên và rõ tham chiếu hơn. Bản sửa vẫn giữ cách dịch “xương sườn” trong thân văn và duy trì chú thích về nghĩa thay thế “bên/phần bên sườn,” vì צֵלָע có phạm vi nghĩa rộng hơn và sự lựa chọn này còn được tranh luận. Không có thay đổi thần học hoặc thêm chi tiết ngoài nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:26:59Z'
