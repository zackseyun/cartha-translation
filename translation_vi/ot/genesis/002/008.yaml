language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: vi
  text: Yahweh Đức Chúa Trời trồng một khu vườn tại Ê-đen, ở phía đông[a], rồi đặt người mà Ngài đã tạo nên vào đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “về phía đông.” Cụm từ Hê-bơ-rơ có thể chỉ vị trí hoặc phương hướng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: trồng
  rationale: Động từ נטע trong ngữ cảnh này chỉ việc trồng cây cối; “trồng” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: יְהוָה אֱלֹהִים
  choice: Giê-hô-va Đức Chúa Trời
  rationale: Danh xưng kép gồm thánh danh יהוה và אֱלֹהִים; bản dịch giữ tên riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: גַּן
  choice: một khu vườn
  rationale: גַּן chỉ một khu đất có trồng cây, thường có ranh giới; “khu vườn” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: בְעֵדֶן
  choice: tại Ê-đen
  rationale: עֵדֶן là địa danh; “tại” diễn đạt tự nhiên quan hệ vị trí, còn tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: מִקֶּדֶם
  choice: ở phía đông
  rationale: Trong mạch văn, cụm từ này có thể xác định vị trí của khu vườn. Tuy nhiên, khả năng chỉ hướng “về phía đông” được giữ trong chú thích.
- source_word: וַיָּשֶׂם שָׁם
  choice: rồi đặt ... vào đó
  rationale: שׂים có nghĩa “đặt, để”, còn שָׁם chỉ nơi chốn. “Đặt ... vào đó” tự nhiên trong tiếng Việt và quy chiếu rõ về khu vườn.
- source_word: הָאָדָם
  choice: người
  rationale: Danh từ có mạo từ xác định chỉ chính con người đã được tạo nên trước đó. Trong câu tiếng Việt này, “người” vừa tự nhiên vừa giữ được mối liên kết với ngữ cảnh mà không biến danh từ chung thành tên riêng.
- source_word: אֲשֶׁר יָצָר
  choice: mà Ngài đã tạo nên
  rationale: יצר mang nghĩa nắn, tạo hình hoặc tạo nên. “Đã tạo nên” truyền đạt hành động xảy ra trước việc đặt người vào vườn và phù hợp văn phong trang trọng, phổ thông.
theological_decisions:
- issue: Cách dịch thánh danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp thánh danh bốn phụ âm. Bản dịch giữ đây là tên riêng của Đức Chúa Trời; “Giê-hô-va” là dạng tên quen thuộc, dễ nhận biết trong tiếng Việt hiện đại.
- issue: Cách dịch הָאָדָם
  choice: người
  alternative: người nam; con người; A-đam
  rationale: Ở đây từ này chỉ cá nhân cụ thể đã được Đức Chúa Trời tạo nên, nhưng nguyên văn vẫn dùng danh từ אָדָם có mạo từ chứ chưa nhất thiết dùng nó như tên riêng. “Người” giữ được sắc thái ấy và tránh thêm ý ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt; đại từ “Ngài” quy chiếu về Đức Chúa Trời. Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
