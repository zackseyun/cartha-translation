id: GEN.2.5
reference: Genesis 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: vi
  text: Chưa có một bụi cây ngoài đồng nào trên đất[a], cũng chưa có một cây cỏ ngoài đồng nào mọc lên, vì Yahweh Đức Chúa Trời chưa làm mưa xuống trên đất, và chưa có con người để canh tác đất đai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “một bụi cây nơi đồng ruộng nào trên đất.”'
    reason: Ghi nhận cách chuyển sát cấu trúc sở thuộc שִׂיחַ הַשָּׂדֶה; “ngoài đồng” tự nhiên hơn trong chính văn.
  - marker: b
    text: 'Cũng có thể dịch: “chưa có người nào để làm đất.”'
    reason: Nêu cách dịch sát hơn cho אָדָם và לַעֲבֹד אֶת הָאֲדָמָה, đồng thời giữ lối chơi âm giữa אָדָם và אֲדָמָה ở mức có thể trong tiếng Việt.
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: bụi cây ngoài đồng
  rationale: שִׂיחַ chỉ bụi cây hơn là thực vật nói chung; cách dịch này giữ sự phân biệt với עֵשֶׂב trong vế kế tiếp. הַשָּׂדֶה được diễn đạt tự nhiên là “ngoài đồng”.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: chưa có ... trên đất
  rationale: טֶרֶם diễn tả tình trạng chưa xảy ra, còn יִהְיֶה בָאָרֶץ nói đến sự hiện hữu trên đất.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: cây cỏ ngoài đồng
  rationale: עֵשֶׂב chỉ lớp thực vật thân thảo nói chung; “cây cỏ” dễ hiểu và vẫn khác với “bụi cây”.
- source_word: טֶרֶם יִצְמָח
  choice: chưa ... mọc lên
  rationale: צמח có nghĩa nảy, mọc hoặc phát triển lên; “mọc lên” tự nhiên và không đặc tả quá mức.
- source_word: כִּי
  choice: vì
  rationale: Ở đây כִּי dẫn vào nguyên nhân của tình trạng chưa có cây cối ngoài đồng.
- source_word: הִמְטִיר
  choice: làm mưa xuống
  rationale: Thể Hiphil của מטר mang nghĩa gây khiến; “làm mưa xuống” giữ sắc thái gây khiến ấy trong tiếng Việt tự nhiên.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Đức Chúa Trời
  rationale: Giữ danh riêng giao ước יְהוָה dưới dạng Yahweh và dịch אֱלֹהִים bằng cách gọi trang trọng, quen thuộc “Đức Chúa Trời”.
- source_word: וְאָדָם אַיִן
  choice: chưa có con người
  rationale: אָדָם ở đây nói đến con người với tư cách người canh tác, trước khi câu chuyện xác định nhân vật nam; “con người” giữ nghĩa đại diện của danh từ số ít.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: để canh tác đất đai
  rationale: עבד trong ngữ cảnh này là làm việc hay canh tác, còn אֲדָמָה là đất canh tác; cách dịch này diễn đạt rõ quan hệ giữa con người và đất.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: đất / đất đai
  rationale: 'Hai cách diễn đạt khác nhau nhằm phản ánh hai danh từ liên hệ nhưng không đồng nhất: אֶרֶץ là đất theo nghĩa rộng, אֲדָמָה là mặt đất hay đất canh tác.'
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” cho thấy đây là danh riêng thay vì thay bằng một tước hiệu.
- issue: Nghĩa của אָדָם trong ngữ cảnh
  choice: con người
  alternative: người nam; loài người
  rationale: Cấu trúc số ít nói đến sự vắng mặt của một người có thể canh tác đất. “Con người” giữ được tính đại diện và không áp đặt giới tính mà riêng câu này chưa nêu rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Không thêm từ nối thời gian tương ứng với “bấy giờ” vì nguyên văn không có từ chỉ thời gian như vậy. Dấu chân chú thích được đặt ngay sau thành phần liên quan trong chính văn.
