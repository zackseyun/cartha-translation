  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: vi
  text: Một con sông chảy ra từ Ê-đen để tưới khu vườn. Từ đó, sông phân ra thành bốn nhánh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “bốn đầu,” chỉ bốn phần phân nhánh chính của dòng sông.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: Một con sông
  rationale: נָהָר là “sông.” Liên từ וְ nối tiếp mạch kể chuyện, nhưng không cần dịch thành một từ riêng ở đầu câu trong tiếng Việt.
- source_word: יֹצֵא מֵעֵדֶן
  choice: chảy ra từ Ê-đen
  rationale: Phân từ יֹצֵא diễn tả dòng sông đang tuôn/chảy ra; מִן chỉ nguồn xuất phát. “Chảy ra từ” tự nhiên trong tiếng Việt và phù hợp hình ảnh dòng sông.
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: để tưới khu vườn
  rationale: Dạng nguyên mẫu với לְ diễn tả mục đích; “tưới” là cách nói thông dụng, ít mang sắc thái kỹ thuật hơn “tưới tiêu.”
- source_word: וּמִשָּׁם
  choice: Từ đó
  rationale: Cụm từ đánh dấu giai đoạn tiếp theo trong dòng chảy. Tách thành câu mới giúp tiếng Việt sáng rõ mà vẫn giữ quan hệ ý nghĩa.
- source_word: יִפָּרֵד
  choice: sông phân ra
  rationale: Niphal của פרד có thể mang nghĩa “bị chia” hoặc “phân ra.” Ở đây “phân ra” diễn đạt tự nhiên việc một dòng sông tách thành nhiều nhánh mà không áp đặt tác nhân.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: thành bốn nhánh
  rationale: היה với לְ diễn tả trạng thái kết quả. רָאשִׁים theo nghĩa đen là “các đầu,” nhưng trong ngữ cảnh dòng sông chỉ các phần phân nhánh chính; “bốn nhánh” rõ nghĩa và tránh từ “đầu nguồn,” vốn có thể khiến độc giả hiểu sai hướng dòng chảy.
theological_decisions: []
