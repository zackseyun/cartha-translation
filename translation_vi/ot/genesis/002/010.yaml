  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ê-đen” theo lối phiên âm Kinh Thánh quen thuộc trong tiếng Việt; lặp lại “sông” ở câu thứ hai để tránh đại từ mơ hồ.
