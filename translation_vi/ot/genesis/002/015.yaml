source:
  edition: WLC
  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: vi
  text: Rồi Yahweh Đức Chúa Trời đem người ấy đặt vào vườn Ê-đen[b] để làm việc trong vườn và gìn giữ nó[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để canh tác và canh giữ vườn.” Hai động từ Hê-bơ-rơ có thể mang các nghĩa “làm việc/canh tác/phục vụ” và “giữ gìn/canh giữ/trông nom.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ được dịch là “đặt” cũng có thể mang nghĩa “cho nghỉ ngơi” hoặc “cho định cư.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời bằng dạng chuyển tự phổ biến, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi tự nhiên, trang trọng và quen thuộc trong tiếng Việt; trong cụm יְהוָה אֱלֹהִים, cách dịch này bảo toàn cả danh riêng lẫn danh xưng thần linh.
- source_word: הָאָדָם
  choice: người ấy
  rationale: Chỉ cá nhân đã được tạo dựng ở ngữ cảnh trước; “người ấy” tự nhiên hơn “người đàn ông” ở đây và không biến từ này thành tên riêng A-đam.
- source_word: וַיִּקַּח
  choice: đem
  rationale: Trong chuỗi hành động đưa người vào vườn, “đem ... đặt vào” diễn đạt tự nhiên ý nghĩa của לקח mà không thêm cách thức không có trong bản nguồn.
- source_word: וַיַּנִּחֵהוּ
  choice: đặt
  rationale: Thể Hiphil của נוח có thể mang nghĩa đặt, cho an nghỉ hoặc cho định cư; “đặt” phù hợp nhất với hành động trong ngữ cảnh, còn sắc thái khác được giữ trong chú thích.
- source_word: בְּגַן עֵדֶן
  choice: vào vườn Ê-đen
  rationale: Giới từ “vào” phù hợp với động tác đặt một người vào địa điểm; “vườn Ê-đen” là cách gọi rõ ràng, quen thuộc.
- source_word: לְעָבְדָהּ
  choice: để canh tác ... vườn
  rationale: Với khu vườn làm đối tượng, עבד tự nhiên mang nghĩa làm đất hoặc canh tác; cách dịch này vẫn để chú thích ghi nhận nghĩa rộng hơn là làm việc/phục vụ.
- source_word: וּלְשָׁמְרָהּ
  choice: và gìn giữ vườn
  rationale: שמר bao gồm giữ gìn, trông nom và bảo vệ. “Gìn giữ” tự nhiên, không thu hẹp quá mức vào việc canh gác có tính quân sự.
theological_decisions:
- issue: Chức trách của con người trong Ê-đen
  choice: Diễn tả công việc của người ấy là canh tác và gìn giữ khu vườn, không gán thêm một phạm trù thần học chuyên biệt.
  alternative: Hiểu cặp động từ chủ yếu như ngôn ngữ phục vụ và canh giữ nơi thánh, hoặc chỉ như công việc nông nghiệp.
  rationale: עבד và שמר có thể gợi cả lao động nông nghiệp lẫn các sắc thái phục vụ, trông nom và bảo vệ. Câu này không tự nó buộc phải chọn một cách đọc mang tính biểu tượng hay chức tế lễ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “đem ... đặt vào” tạo dòng kể tự nhiên. Đại từ “người ấy” duy trì liên kết với nhân vật đã xuất hiện trước đó. Các dấu chú thích [a], [b] đều có mặt trong chính văn.
