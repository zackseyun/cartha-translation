  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: vi
  text: Nhưng hơi nước từ đất bốc lên và tưới khắp mặt đất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dòng nước” hoặc “mạch nước”; từ Hê-bơ-rơ này hiếm và có thể chỉ nước trào lên từ lòng đất hơn là hơi nước trong không khí.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: Nhưng hơi nước
  rationale: אֵד là từ hiếm và nghĩa còn được tranh luận. “Hơi nước” phù hợp tự nhiên với động từ “bốc lên”; וְ được dịch là “Nhưng” để nêu sự tương phản với việc chưa có mưa ở câu trước.
- source_word: יַעֲלֶה
  choice: bốc lên
  rationale: Dạng Qal chưa hoàn thành của עלה chỉ sự đi lên. Trong mạch văn miêu tả quá khứ, tiếng Việt có thể diễn đạt hành động có tính thường xuyên bằng cụm tự nhiên “bốc lên” mà không cần thêm dấu hiệu thì.
- source_word: מִן הָ/אָ֑רֶץ
  choice: từ đất
  rationale: אֶרֶץ có thể là “đất” hoặc “xứ”; ở đây “đất” hợp với bối cảnh sáng tạo và nguồn của hơi nước.
- source_word: וְ/הִשְׁקָה
  choice: và tưới
  rationale: Dạng Hiphil của שקה nghĩa là cho uống hoặc tưới. “Tưới” là cách diễn đạt thông dụng, rõ ràng và không quá kỹ thuật.
- source_word: אֶת כָּל פְּנֵי
  choice: khắp mặt
  rationale: Thành ngữ này chỉ toàn bộ bề mặt. “Khắp mặt” tự nhiên trong tiếng Việt và giữ được ý về phạm vi bao phủ.
- source_word: הָֽ/אֲדָמָֽה
  choice: đất
  rationale: אֲדָמָה chỉ mặt đất hoặc đất trồng. Tiếng Việt khó duy trì tự nhiên sự phân biệt từ vựng với אֶרֶץ ngay trong câu ngắn này; “mặt đất” truyền đạt đúng ý không gian.
theological_decisions:
- issue: Cách hiểu אֵד
  choice: hơi nước
  alternative: dòng nước hoặc mạch nước
  rationale: Chọn “hơi nước” vì phù hợp trực tiếp với động từ chỉ sự bốc lên, nhưng vì từ Hê-bơ-rơ hiếm và có thể nói đến nước trào lên từ dưới đất, chú thích giữ lại các cách hiểu thủy văn khác thay vì khẳng định quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Hơi nước… bốc lên” tự nhiên hơn “sương mù… đi lên” trong tiếng Việt; cấu trúc gọn giữ tính chất miêu tả của câu Hê-bơ-rơ.
