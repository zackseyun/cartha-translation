base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: vi
  text: Tên con sông thứ hai là Ghi-hôn; đó là con sông chảy quanh toàn xứ Cút.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bao quanh toàn xứ Cút.”'
    reason: lexical_alternative
  - marker: b
    text: Cút là một địa danh cổ, theo truyền thống thường gắn với những vùng ở phía nam Ai Cập; bản Hê-bơ-rơ giữ nguyên tên cổ này.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: Tên
  rationale: Trong tiếng Hê-bơ-rơ, וְ nối tiếp phần mô tả các con sông; tiếng Việt không cần dịch máy móc là “và” ở đầu câu vì sự liên kết đã rõ trong mạch văn. שֵׁם có nghĩa trực tiếp là “tên”.
- source_word: הַ/נָּהָר הַ/שֵּׁנִי
  choice: con sông thứ hai
  rationale: נָהָר thường chỉ sông, còn הַשֵּׁנִי là số thứ tự “thứ hai”; cách diễn đạt này trực tiếp và tự nhiên trong tiếng Việt.
- source_word: גִּיחוֹן
  choice: Ghi-hôn
  rationale: Giữ tên riêng cổ bằng hình thức phiên âm dễ đọc theo quy ước tiếng Việt.
- source_word: הוּא
  choice: đó là con sông
  rationale: Đại từ này nhắc lại và nhận diện con sông vừa được nêu tên; “đó là con sông” diễn đạt rõ lực xác định trong tiếng Việt.
- source_word: הַ/סּוֹבֵב
  choice: chảy quanh
  rationale: Phân từ của סבב có thể mang nghĩa đi quanh, bao quanh. Vì chủ thể là sông, “chảy quanh” tự nhiên, đồng thời không khẳng định quá mức rằng dòng sông bao bọc hoàn toàn vùng đất.
- source_word: אֵת כָּל אֶרֶץ
  choice: toàn xứ
  rationale: אֵת đánh dấu tân ngữ; כָּל אֶרֶץ ở đây được diễn đạt gọn và trang trọng là “toàn xứ”.
- source_word: כּוּשׁ
  choice: Cút
  rationale: Giữ địa danh cổ dưới dạng phiên âm tiếng Việt, thay vì đồng nhất theo lối diễn giải với một quốc gia hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lược liên từ mở đầu để câu tiếng Việt tự nhiên nhưng vẫn giữ sự tiếp nối của mạch văn. Các dấu chú thích [a], [b] được đặt ngay sau mệnh đề mà chúng giải thích.
