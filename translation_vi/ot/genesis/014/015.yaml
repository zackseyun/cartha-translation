  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: vi
  text: Trong đêm, ông cùng các đầy tớ chia thành các toán để tấn công họ, đánh họ rồi truy đuổi họ đến tận Hô-ba, ở phía bắc Đa-mách.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: chia nhau ra đánh họ
  rationale: Động từ ở dạng số ít có thể diễn tả Áp-ram bố trí lực lượng thành nhiều toán; cách dịch này giữ ý phân chia chiến thuật và làm rõ hướng tấn công của cụm עֲלֵיהֶם.
- source_word: עֲבָדָיו
  choice: các đầy tớ
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ; trong ngữ cảnh đoàn người thuộc nhà Áp-ram, “các đầy tớ” là cách gọi tự nhiên mà không xác định quá mức địa vị pháp lý.
- source_word: וַיַּכֵּם
  choice: đánh bại họ
  rationale: נכה trong ngữ cảnh chiến trận nghĩa là đánh hoặc giáng đòn; “đánh bại” truyền đạt kết quả quân sự mà không nhất thiết hàm ý giết hết.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: ở phía bắc Đa-mách
  rationale: Theo cách định hướng khi quay mặt về phía đông trong tiếng Hê-bơ-rơ cổ, “bên trái” tương ứng với phía bắc.
