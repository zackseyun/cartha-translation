- from: Ban đêm, ông cùng các đầy tớ chia nhau ra đánh họ, đánh bại họ rồi truy đuổi đến tận Hô-ba, ở phía bắc Đa-mách.
  to: Trong đêm, ông cùng các đầy tớ chia thành các toán để tấn công họ, đánh họ rồi truy đuổi họ đến tận Hô-ba, ở phía bắc Đa-mách.
  rationale: Chỉnh cách diễn đạt việc chia lực lượng để loại mơ hồ và phản ánh chính xác hơn động từ “chia” đi với cụm “chống lại họ.” Đổi “đánh bại” thành “đánh” để giữ sát nghĩa của động từ Hê-bơ-rơ mà không thêm mức độ kết quả. Các địa danh và cách gọi “các đầy tớ” được giữ nguyên.
