  terminology: Các tên riêng được phiên âm nhất quán. Việc giữ “Gô-im” như một địa danh trong bản văn chính, đồng thời nêu khả năng nghĩa chung “các dân tộc” trong chú thích, bảo tồn đúng tính chưa dứt khoát của גּוֹיִם. Không có thuật ngữ thần học cần điều chỉnh.
