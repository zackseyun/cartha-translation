  source_fidelity: 'Bản dịch truyền đạt chính xác cấu trúc liệt kê của tiếng Hê-bơ-rơ: bốn vị vua được nêu tên cùng các vương quốc của họ, rồi được tổng kết là đối đầu với nhóm năm vua. Cách hiểu אֶת trong ngữ cảnh giao chiến là “đối đầu với” là phù hợp. “Năm vua kia” diễn đạt tự nhiên nhóm xác định mà nguyên văn gọi là “năm [vua]” với danh từ được hiểu ngầm.'
