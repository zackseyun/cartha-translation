language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: vi
  text: Kê-đô-la-ô-me, vua Ê-lam; Ti-đanh, vua Gô-im[a]; Am-ra-phên, vua Si-nê-a; và A-ri-ốc, vua Ê-la-sa—bốn vua đối đầu với năm vua kia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Ti-đanh, vua của các dân tộc.” Từ Hê-bơ-rơ גּוֹיִם có thể là danh từ chung nghĩa là “các dân tộc”, nhưng ở đây cũng có thể là địa danh “Gô-im”.
    reason: Giữ lại hai cách hiểu khả dĩ của גּוֹיִם trong ngữ cảnh một tước hiệu hoàng gia.
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: đối đầu với
  rationale: Trong danh sách các bên tham chiến, אֵת thứ hai biểu thị quan hệ đối địch giữa bốn vua và năm vua; “đối đầu với” diễn đạt tự nhiên ý nghĩa theo ngữ cảnh.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kê-đô-la-ô-me
  rationale: Phiên âm tên riêng theo âm đọc Hê-bơ-rơ và cách viết dễ đọc trong tiếng Việt.
- source_word: מֶלֶךְ עֵילָם
  choice: vua Ê-lam
  rationale: Chuyển trực tiếp kết cấu sở thuộc, giữ nguyên địa danh thay vì đồng nhất với một vùng lịch sử khác.
- source_word: תִדְעָל
  choice: Ti-đanh
  rationale: Phiên âm tên riêng theo quy ước tiếng Việt, trong đó phụ âm cuối biểu thị âm /l/ của tên nguồn theo lối phiên âm Kinh Thánh quen thuộc.
- source_word: גּוֹיִם
  choice: Gô-im
  rationale: Trong tước hiệu hoàng gia này, từ có thể là địa danh; bản chính giữ cách hiểu ấy nhưng chú thích nghĩa danh từ chung “các dân tộc” để bảo toàn sự mơ hồ.
- source_word: אַמְרָפֶל
  choice: Am-ra-phên
  rationale: Phiên âm tên riêng, không gán một nhận dạng lịch sử còn tranh luận.
- source_word: שִׁנְעָר
  choice: Si-nê-a
  rationale: Giữ địa danh Hê-bơ-rơ bằng phiên âm thay vì thay bằng cách đồng nhất diễn giải như Ba-by-lôn.
- source_word: אַרְיֹוךְ
  choice: A-ri-ốc
  rationale: Phiên âm tên riêng theo cách đọc tự nhiên trong tiếng Việt.
- source_word: אֶלָּסָר
  choice: Ê-la-sa
  rationale: Phiên âm địa danh, không suy đoán đồng nhất với một khu vực khác.
- source_word: אַרְבָּעָה מְלָכִים
  choice: bốn vua
  rationale: Dịch trực tiếp cụm số từ và danh từ.
- source_word: הַחֲמִשָּׁה
  choice: năm vua kia
  rationale: Nguyên văn là “năm [người] ấy”, trong đó “vua” được tỉnh lược; tiếng Việt bổ sung “vua” cho rõ và dùng “kia” để thể hiện tính xác định của nhóm đã được nhắc đến.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng, phù hợp cấu trúc liệt kê của nguyên văn. Dấu chấm phẩy phân tách rõ bốn vua; dấu gạch ngang làm nổi bật lời tổng kết. Mọi tên người và địa danh đều được phiên âm nhất quán, dễ đọc đối với độc giả tiếng Việt.
