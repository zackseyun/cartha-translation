  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: vi
  text: Người đem về tất cả tài sản; người cũng đem Lót, người họ hàng của mình, cùng tài sản của Lót trở về, và cả phụ nữ lẫn dân chúng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: đem về
  rationale: Động từ שוב ở thể Hiphil diễn tả việc khiến người hoặc vật trở lại; “đem về” tự nhiên trong ngữ cảnh giải cứu và thu hồi.
- source_word: כָּל הָרְכֻשׁ
  choice: tất cả tài sản
  rationale: רְכוּשׁ chỉ của cải, đồ đạc hoặc tài sản; “tài sản” đủ rộng và phù hợp với văn cảnh.
- source_word: וְגַם
  choice: cũng; và cả... lẫn...
  rationale: Giữ sắc thái bổ sung và nhấn mạnh của tiểu từ xuất hiện hai lần, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: לוֹט אָחִיו
  choice: Lót, người bà con của mình
  rationale: אָחִיו theo nghĩa đen là “anh/em của mình” nhưng có thể chỉ họ hàng rộng hơn; trong mạch truyện Lót là cháu của Áp-ram, nên “người bà con” truyền đạt đúng quan hệ mà không thu hẹp quá mức.
- source_word: וּרְכֻשׁוֹ
  choice: cùng tài sản của ông ấy
  rationale: Dùng lại “tài sản” cho cùng danh từ רְכוּשׁ; hậu tố sở hữu quy chiếu đến Lót.
- source_word: הֵשִׁיב
  choice: đem ... trở về
  rationale: Đây cũng là שוב ở thể Hiphil; cách diễn đạt này giữ động tác đưa người và tài sản trở lại, đồng thời tránh lặp vụng trong tiếng Việt.
- source_word: הַנָּשִׁים
  choice: phụ nữ
  rationale: Danh từ chỉ phụ nữ nói chung; văn cảnh không buộc phải thu hẹp thành “các bà vợ”.
- source_word: הָעָם
  choice: dân chúng
  rationale: עָם chỉ toàn thể những người bị bắt đi; “dân chúng” không giới hạn nhóm này ở nam giới.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người” để tiếp nối chủ thể Áp-ram từ câu trước; dấu chấm phẩy phản ánh hai mệnh đề chính của tiếng Hê-bơ-rơ. Không thêm chú thích vì các lựa chọn từ vựng có thể được thể hiện rõ ngay trong bản văn.
