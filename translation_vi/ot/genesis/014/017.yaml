  - severity: medium
    issue: “các vua đồng minh với vua ấy”
    rationale: אֲשֶׁר אִתּוֹ chỉ nói “các vua ở/cùng với ông ấy”; “đồng minh” là suy diễn hợp lý theo ngữ cảnh nhưng không cần thiết. Nên giữ cách nói trung tính hơn.
  - severity: low
    issue: “đón ông”
    rationale: לִקְרָאתוֹ có nghĩa cơ bản là đi ra để gặp ông ấy. “Gặp” tránh thêm sắc thái tiếp rước và sát nguyên ngữ hơn.
