revisions:
- from: Sau khi ông trở về từ trận đánh bại Kê-đô-la-ô-me và các vua đồng minh với vua ấy, vua Sô-đôm đi ra đến thung lũng Sa-vê để đón ông (tức là Thung lũng Vua).
  to: Sau khi ông trở về, sau khi đánh bại Kê-đô-la-ô-me và các vua cùng với ông ấy, vua Sô-đôm đi ra gặp ông tại thung lũng Sa-vê (tức là Thung lũng Vua).
  rationale: Sửa cấu trúc thời gian để diễn đạt đúng מֵהַכּוֹת và tự nhiên trong tiếng Việt; thay “đồng minh” bằng cách nói không diễn giải thêm; thay “đón” bằng “gặp” để phản ánh trực tiếp לִקְרָאתוֹ. Cụm “tại thung lũng Sa-vê” diễn đạt địa điểm của cuộc gặp một cách tự nhiên, trong khi vẫn tôn trọng chức năng hướng đến địa điểm của אֶל trong ngữ cảnh này.
