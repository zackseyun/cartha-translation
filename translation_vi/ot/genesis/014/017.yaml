base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: vi
  text: Sau khi ông trở về, sau khi đánh bại Kê-đô-la-ô-me và các vua cùng với ông ấy, vua Sô-đôm đi ra gặp ông tại thung lũng Sa-vê (tức là Thung lũng Vua).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: đi ra
  rationale: Giữ chuyển động được diễn tả bằng động từ Hê-bơ-rơ, đồng thời để mạch kể chuyện tự nhiên trong tiếng Việt.
- source_word: מֶלֶךְ סְדֹם
  choice: vua Sô-đôm
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu của nguyên ngữ; địa danh được phiên âm theo cách dễ đọc trong tiếng Việt.
- source_word: לִקְרָאתוֹ
  choice: để đón ông
  rationale: Trong bối cảnh một vị vua đi ra gặp người chiến thắng đang trở về, “đón” tự nhiên hơn “gặp” mà vẫn giữ ý đi ra để hội kiến.
- source_word: אַחֲרֵי שׁוּבוֹ מֵהַכּוֹת
  choice: Sau khi ông trở về từ trận đánh bại
  rationale: Thể hiện cả ý trở về và chiến thắng quân sự của נכה; “từ trận đánh bại” tránh cách diễn đạt nặng nề “trở về sau khi đánh bại” trong câu dài.
- source_word: כְּדָרלָעֹמֶר
  choice: Kê-đô-la-ô-me
  rationale: Phiên âm trực tiếp tên riêng Hê-bơ-rơ theo âm tiết dễ đọc đối với độc giả Việt.
- source_word: וְאֶת הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: và các vua đồng minh với vua ấy
  rationale: “Ở với ông ấy” trong bối cảnh chiến trận chỉ các vua cùng phe. Dùng “vua ấy” làm rõ đại từ này chỉ Kê-đô-la-ô-me, không phải người đang trở về.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: đến thung lũng Sa-vê
  rationale: Giữ lực chỉ hướng của אֶל và phiên âm địa danh; đặt cụm này sau “đi ra” tạo câu tiếng Việt tự nhiên.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: (tức là Thung lũng Vua)
  rationale: Giữ nguyên lời giải thích đồng nhất địa điểm trong bản Hê-bơ-rơ và thể hiện nó như một lời chú giải trong câu.
theological_decisions:
- issue: Đại từ trong “sau khi ông trở về” và “đón ông”
  choice: Giữ đại từ “ông” như nguyên ngữ
  alternative: Nêu đích danh “Áp-ram”
  rationale: Nguyên ngữ dùng hậu tố đại từ giống đực số ít chứ không lặp tên Áp-ram. Ngữ cảnh trước đó xác định người trở về là Áp-ram; bản dịch không tự ý thay đại từ bằng tên riêng.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Câu được sắp xếp lại vừa phải để tiếng Việt rõ nghĩa, đồng thời giữ trình tự thời gian, chuyển động đến địa điểm và lời giải thích tên thung lũng của nguyên ngữ.
