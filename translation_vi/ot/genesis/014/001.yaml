base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: vi
  text: 'Vào thời Am-ra-phên, vua Si-nê-a, A-ri-ốc, vua Ê-la-sa, Kê-đô-la-ô-me, vua Ê-lam, và Ti-đanh, vua các dân tộc[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vua Gô-im.” Từ Hê-bơ-rơ thường có nghĩa là “các dân tộc,” nhưng tại đây có thể được dùng như một địa danh, tương ứng với các tước hiệu hoàng gia khác trong câu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּימֵי
  choice: Vào thời
  rationale: Cụm này mở đầu bối cảnh thời gian của câu chuyện. “Vào thời” chuyển tải tự nhiên ý của công thức Hê-bơ-rơ mà không dùng lối diễn đạt cổ hoặc nặng nề.
- source_word: אַמְרָפֶל
  choice: Am-ra-phên
  rationale: Phiên âm tên riêng sang cách đọc quen thuộc và rõ ràng trong tiếng Việt.
- source_word: מֶלֶךְ שִׁנְעָר
  choice: vua Si-nê-a
  rationale: 'Giữ nguyên quan hệ danh hiệu–địa danh: vua của vùng Si-nê-a.'
- source_word: אַרְיוֹךְ
  choice: A-ri-ốc
  rationale: Phiên âm tên riêng theo âm dạng Hê-bơ-rơ và quy ước tiếng Việt.
- source_word: מֶלֶךְ אֶלָּסָר
  choice: vua Ê-la-sa
  rationale: Dịch trực tiếp danh hiệu và phiên âm địa danh.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kê-đô-la-ô-me
  rationale: Phiên âm tên riêng thành dạng dễ đọc trong tiếng Việt, đồng thời phản ánh các thành phần âm chính của nguyên ngữ.
- source_word: מֶלֶךְ עֵילָם
  choice: vua Ê-lam
  rationale: Dịch trực tiếp danh hiệu; Ê-lam là dạng địa danh đã quen thuộc trong tiếng Việt.
- source_word: וְתִדְעָל
  choice: và Ti-đanh
  rationale: Giữ liên từ và phiên âm tên riêng; phụ âm cuối được diễn đạt theo cách đọc tự nhiên trong tiếng Việt.
- source_word: מֶלֶךְ גּוֹיִם
  choice: vua các dân tộc
  rationale: גּוֹיִם theo nghĩa thông thường là “các dân tộc”; tuy nhiên, vị trí song song với các địa danh khác khiến khả năng đây là tên vùng “Gô-im” vẫn cần được ghi nhận trong chú thích.
