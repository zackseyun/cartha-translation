id: GEN.14.18
reference: Genesis 14:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: vi
  text: Mên-chi-xê-đéc, vua Sa-lem, đem bánh và rượu ra.[a] Ông là thầy tế lễ của Đức Chúa Trời Tối Cao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mang bánh và rượu ra.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “Êl Êlyôn”, nghĩa là “Đức Chúa Trời Tối Cao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: Mên-chi-xê-đéc
  rationale: Phiên âm tên riêng theo cách quen thuộc và dễ đọc trong tiếng Việt, thay vì dịch nghĩa hàm ẩn của tên, vì ở đây từ này có chức năng là tên người.
- source_word: מֶלֶךְ
  choice: vua
  rationale: Từ tương đương trực tiếp và tự nhiên trong tiếng Việt cho người cai trị hoàng gia.
- source_word: שָׁלֵם
  choice: Sa-lem
  rationale: Phiên âm địa danh theo dạng quen thuộc trong tiếng Việt, không dịch nghĩa địa danh.
- source_word: הוֹצִיא
  choice: đem ... ra
  rationale: Dạng Hiphil của יצא diễn tả việc làm cho vật đi ra, nên “đem ... ra” vừa tự nhiên vừa giữ được hướng chuyển động cụ thể của động từ.
- source_word: לֶחֶם
  choice: bánh
  rationale: Trong văn cảnh này từ chỉ bánh làm lương thực; “bánh” là cách diễn đạt tự nhiên hơn “bánh mì” khi không cần xác định loại bánh.
- source_word: יָיִן
  choice: rượu
  rationale: Tương đương thông dụng của từ Hê-bơ-rơ chỉ rượu nho; không làm nhẹ hoặc diễn giải thêm ý nghĩa.
- source_word: כֹהֵן
  choice: thầy tế lễ
  rationale: Diễn đạt chức vụ phụng tự một cách dễ hiểu, đồng thời không áp đặt toàn bộ cơ cấu tế lễ của Ít-ra-ên thời kỳ sau lên nhân vật.
- source_word: אֵל עֶלְיוֹן
  choice: Đức Chúa Trời Tối Cao
  rationale: Dịch danh xưng thần linh thay vì chỉ phiên âm; “Tối Cao” chuyển tải trực tiếp עֶלְיוֹן và giữ sắc thái trang trọng.
- source_word: וְהוּא
  choice: Ông là
  rationale: Tách thành câu mới tự nhiên trong tiếng Việt; đại từ “ông” quy chiếu rõ ràng và kính trọng đến Mên-chi-xê-đéc, còn động từ “là” được bổ sung theo cú pháp tiếng Việt.
theological_decisions:
- issue: Có nên dùng cách diễn đạt về bánh và rượu nhằm gợi trước ý nghĩa bí tích về sau hay không
  choice: 'Giữ lời kể lịch sử đơn giản: “đem bánh và rượu ra”'
  alternative: Dùng cách diễn đạt gợi rõ việc cử hành Tiệc Thánh hoặc Thánh Thể
  rationale: Sáng Thế Ký 14:18 chỉ kể hành động đem bánh và rượu ra; bản dịch không đưa cách giải thích thần học xuất hiện về sau vào chính văn.
- issue: Nên xem אֵל עֶלְיוֹן là tên riêng được phiên âm hay danh xưng được dịch
  choice: Dịch là “Đức Chúa Trời Tối Cao”
  alternative: Phiên âm là “Êl Êlyôn”
  rationale: Cụm từ có thể được nhận diện qua dạng Hê-bơ-rơ nhưng trong câu nó hoạt động như một danh xưng thần linh; dịch nghĩa giúp độc giả hiểu ngay mà chú thích vẫn bảo tồn dạng nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu đầu giữ cấu trúc đồng vị cô đọng; câu thứ hai tách riêng để làm rõ vai trò của Mên-chi-xê-đéc. Không thêm hàm ý bí tích và không đồng nhất chức vụ của ông với một hệ thống giáo phái cụ thể.
