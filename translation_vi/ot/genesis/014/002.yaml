  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: vi
  text: họ giao chiến với Bê-ra, vua Sô-đôm; Bi-rê-sa, vua Gô-mô-rơ; Si-nê-áp, vua Át-ma; Sêm-ê-be, vua Xê-bô-im; và vua thành Bê-la (tức là Xô-a).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: họ giao chiến
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “làm chiến tranh”. “Giao chiến” diễn đạt tự nhiên trong tiếng Việt hiện đại và giữ đúng ý tiến hành chiến tranh trong ngữ cảnh này.
- source_word: אֶת ... וְאֶת
  choice: với
  rationale: Các tiểu từ đánh dấu những vua là đối phương trong cuộc chiến. Sau động từ “giao chiến”, giới từ “với” là cách diễn đạt tự nhiên; dấu chấm phẩy làm rõ rằng cả năm vị vua đều thuộc cùng một danh sách đối phương.
- source_word: בֶּרַע
  choice: Bê-ra
  rationale: Tên người được phiên âm sang tiếng Việt, không dịch nghĩa.
- source_word: מֶלֶךְ סְדֹם
  choice: vua Sô-đôm
  rationale: Chuỗi liên kết được diễn đạt tự nhiên theo cấu trúc tước hiệu cộng địa danh trong tiếng Việt.
- source_word: בִּרְשַׁע
  choice: Bi-rê-sa
  rationale: Tên người được phiên âm theo âm đọc Hê-bơ-rơ.
- source_word: עֲמֹרָה
  choice: Gô-mô-rơ
  rationale: Dùng dạng địa danh quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: שִׁנְאָב
  choice: Si-náp
  rationale: Tên người được phiên âm theo âm đọc Hê-bơ-rơ.
- source_word: אַדְמָה
  choice: Át-ma
  rationale: Địa danh được phiên âm sang tiếng Việt.
- source_word: שֶׁמְאֵבֶר
  choice: Sêm-ê-be
  rationale: Tên người được phiên âm theo âm đọc Hê-bơ-rơ.
- source_word: צביים
  choice: Xê-bô-im
  rationale: Phiên âm địa danh theo dạng đọc Masoretic ṣəḇōyîm, giữ thành tố số nhiều -im.
- source_word: מֶלֶךְ בֶּלַע
  choice: vua thành Bê-la
  rationale: Bản Hê-bơ-rơ không nêu tên riêng của vị vua cuối cùng mà chỉ xác định ông qua thành Bê-la. Thêm “thành” để tiếng Việt rõ nghĩa và không khiến Bê-la bị hiểu là tên vua.
- source_word: הִיא צֹעַר
  choice: tức là Xô-a
  rationale: Đại từ cùng địa danh có chức năng chú giải, đồng nhất Bê-la với Xô-a; “tức là” truyền đạt tự nhiên chức năng này.
theological_decisions: []
translation_notes:
  register: Văn phong tường thuật trang trọng nhưng dễ hiểu. Dùng dấu chấm phẩy để phân tách từng cặp tên vua–vương quốc trong danh sách dài. Không đặt chú thích vì các biến thể tiếng Anh không thuộc văn bản nguồn, còn cấu trúc Hê-bơ-rơ được truyền đạt rõ trong câu chính.
