  terminology: Các tước hiệu và địa danh nhìn chung nhất quán. Giữ “tức là Xô-a” là cách chuyển tự nhiên của mệnh đề chú giải הִיא צֹעַר. Không cần chuyển các chú thích lựa chọn từ bản tiếng Anh, vì chúng không nêu biến thể hay vấn đề văn bản tiếng Hê-bơ-rơ cần chú thích trong tiếng Việt.
