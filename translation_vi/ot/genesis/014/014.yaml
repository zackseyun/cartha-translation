  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: vi
  text: Khi Áp-ram nghe tin người anh em của ông[a] đã bị bắt làm tù binh, ông huy động[b] những người được huấn luyện, sinh trong gia hộ ông, gồm ba trăm mười tám người, rồi đuổi theo đến tận Đan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng từ thường nghĩa là “anh/em trai của ông”; từ Hê-bơ-rơ này cũng có thể chỉ một nam thân thuộc gần gũi, như cháu trai.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ ở đây cũng có thể được hiểu là “dẫn ra”, “đưa ra” hoặc, có lẽ, là “trang bị vũ khí”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: đã bị bắt làm tù binh
  rationale: Dạng Niphal của שׁבה chỉ việc bị bắt trong chiến tranh; cách diễn đạt này tự nhiên và giữ rõ sắc thái quân sự.
- source_word: אָחִיו
  choice: người anh em của mình
  rationale: Giữ cách gọi thân tộc trực tiếp của tiếng Hê-bơ-rơ, đồng thời chú thích rằng אָח có thể chỉ một nam thân thuộc gần gũi, như cháu trai.
- source_word: וַיָּרֶק
  choice: huy động
  rationale: Động từ này khó xác định chính xác; trong ngữ cảnh, nó nói đến việc Áp-ram tập hợp và triển khai người của mình. “Huy động” phù hợp ngữ cảnh quân sự mà không quyết đoán rằng ông chỉ “dẫn ra” hay “trang bị vũ khí” cho họ.
- source_word: חֲנִיכָיו
  choice: những người đã được huấn luyện
  rationale: Chỉ những người thuộc quyền Áp-ram đã được rèn luyện hoặc chuẩn bị; cách dịch này rõ nghĩa và không thêm chữ “đầy tớ” khi nguyên văn tại đây không dùng danh từ ấy.
- source_word: יְלִידֵי בֵיתוֹ
  choice: những người sinh ra trong nhà ông
  rationale: Bảo tồn ý nghĩa những người sinh trưởng trong gia hộ của Áp-ram, bằng lối nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: ba trăm mười tám người
  rationale: Chuyển đầy đủ số đếm Hê-bơ-rơ và thêm loại từ “người” để câu tiếng Việt rõ ràng, tự nhiên.
- source_word: וַיִּרְדֹּף
  choice: đuổi theo
  rationale: Trong ngữ cảnh quân sự, רדף diễn tả sự truy đuổi; “đuổi theo” là cách nói tự nhiên, sáng rõ.
- source_word: עַד דָּן
  choice: đến tận Đan
  rationale: עַד diễn tả giới hạn của cuộc truy đuổi; “đến tận” thể hiện rõ mức độ không gian ấy.
theological_decisions:
- issue: Từ chỉ quan hệ thân tộc dành cho Lót
  choice: Giữ “người anh em của mình” trong chính văn
  alternative: người bà con của mình; cháu trai của mình
  rationale: Nguyên văn dùng אָחִיו, nghĩa bề mặt là “anh/em của ông”, nhưng từ này cũng có thể chỉ một nam thân thuộc gần gũi. Giữ cách gọi của nguyên văn tránh thay thế nó bằng một lời giải thích; chú thích nêu nghĩa rộng trong ngữ cảnh.
translation_notes:
  register: Văn phong trần thuật trang trọng nhưng hiện đại. Dùng “người anh em” để giữ từ ngữ thân tộc của nguyên văn, “huy động” để bảo tồn độ mở của động từ khó, và đặt các ký hiệu chú thích ngay sau từ ngữ liên quan.
