  - severity: low
    issue: Cấu trúc “dù chỉ ... hay ...”
    rationale: Cách này diễn đạt ý không lấy vật nhỏ nhất, nhưng nguyên văn dùng thành ngữ phạm vi “từ một sợi chỉ cho đến một quai dép.” Khôi phục cấu trúc ấy sẽ sát nguồn hơn mà vẫn tự nhiên.
