  to: 'rằng ta sẽ không lấy, từ một sợi chỉ cho đến một quai dép,[a] hay bất cứ thứ gì thuộc về ngươi, kẻo ngươi nói: ‘Ta đã làm cho Áp-ram trở nên giàu có.’'
  rationale: Sửa mệnh đề cuối thành “kẻo ngươi nói” để tránh thêm ý “không thể” và để phản ánh chính xác mục đích/ngăn ngừa lời nhận công. Khôi phục cách nói “từ ... cho đến ...” của thành ngữ Hê-bơ-rơ, đồng thời giữ rõ ràng rằng Áp-ram sẽ không lấy bất cứ thứ gì thuộc về vua Sô-đôm. Chú thích vẫn cần thiết và chính xác.
