  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: vi
  text: 'rằng ta sẽ không lấy, từ một sợi chỉ cho đến một quai dép,[a] hay bất cứ thứ gì thuộc về ngươi, kẻo ngươi nói: ‘Ta đã làm cho Áp-ram trở nên giàu có.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dùng một công thức thề rút gọn, dịch sát là: “nếu từ một sợi chỉ cho đến một quai dép, và nếu ta lấy bất cứ thứ gì thuộc về ngươi...” Ý nghĩa là một lời thề khước từ dứt khoát.'
    reason: Giải thích công thức thề rút gọn và cách diễn đạt thành ngữ của nguyên văn.
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: sẽ không ... bất cứ ... dù chỉ
  rationale: Trong ngữ cảnh lời thề tiếp nối câu 22, אִם là công thức thề rút gọn, hàm ý một sự khước từ dứt khoát chứ không phải điều kiện thông thường.
- source_word: מִחוּט וְעַד שְׂרוֹךְ נַעַל
  choice: dù chỉ một sợi chỉ hay một quai dép
  rationale: Giữ nguyên hai vật cụ thể trong thành ngữ Hê-bơ-rơ, đồng thời dùng cấu trúc tiếng Việt tự nhiên để diễn đạt rằng Áp-ram không nhận ngay cả vật nhỏ bé nào.
- source_word: אֶקַּח מִכָּל אֲשֶׁר לָךְ
  choice: ta sẽ không lấy bất cứ thứ gì thuộc về ngươi
  rationale: Diễn đạt tự nhiên phạm vi toàn diện của כָּל và quan hệ sở hữu của לָךְ trong khuôn khổ lời thề phủ định.
- source_word: וְלֹא תֹאמַר
  choice: để ngươi không thể nói
  rationale: Thể hiện mục đích của việc từ chối chiến lợi phẩm và hàm ý ngăn người kia có cơ sở tuyên bố như vậy.
- source_word: הֶעֱשַׁרְתִּי
  choice: đã làm cho ... trở nên giàu có
  rationale: 'Truyền đạt thể sai khiến Hiphil của עשר: làm cho một người trở nên giàu.'
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Công thức thề rút gọn
  choice: 'Diễn đạt thành lời thề khước từ rõ ràng: “ta sẽ không lấy...”'
  alternative: 'Dịch sát hình thức: “nếu từ một sợi chỉ... và nếu ta lấy...”'
  rationale: Nguyên văn bảo tồn một công thức thề có phần hậu quả bị lược bỏ. Ngữ cảnh câu 22 cho thấy Áp-ram đang thề không nhận tài sản của vua Sô-đôm; bản dịch cần làm rõ ý này mà không thêm nội dung của lời nguyền bị lược.
- issue: Mục đích của sự khước từ
  choice: “để ngươi không thể nói”
  alternative: “và ngươi sẽ không nói” hoặc “kẻo ngươi nói”
  rationale: 'Mệnh đề nêu lý do Áp-ram không nhận gì: ông không để vua Sô-đôm có cơ sở nhận công làm cho mình giàu có.'
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “ta/ngươi” phù hợp với lời đối đáp trực tiếp trong bối cảnh cổ đại; “quai dép” phản ánh loại giày dép thời ấy rõ hơn “dây giày”.
