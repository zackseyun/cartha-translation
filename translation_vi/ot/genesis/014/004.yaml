  text: שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה עָבְד֖וּ אֶת כְּדָרְלָעֹ֑מֶר וּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה מָרָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: vi
  text: Trong mười hai năm, họ phục vụ Kê-đô-la-ô-me; nhưng đến năm thứ mười ba, họ nổi loạn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Trong mười hai năm
  rationale: Cụm Hê-bơ-rơ chỉ khoảng thời gian kéo dài; cách diễn đạt này tự nhiên trong tiếng Việt và nối rõ với hành động phục vụ.
- source_word: עָבְדוּ
  choice: họ phục vụ
  rationale: Động từ עבד có nghĩa là phục vụ; trong bối cảnh chính trị, từ này hàm ý các vua ấy thần phục và phục dịch một bá chủ, nhưng giữ cách dịch rộng là “phục vụ” để không thu hẹp sắc thái của nguyên văn.
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: Kê-đô-la-ô-me
  rationale: Tên riêng được phiên âm theo dạng Hê-bơ-rơ, với cách viết có dấu và âm tiết phù hợp quy ước tiếng Việt.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: nhưng đến năm thứ mười ba
  rationale: Nguyên văn sát chữ là “và mười ba năm”, nhưng trong mạch kể, cụm này chỉ năm thứ mười ba và tạo thế tương phản với mười hai năm phục vụ; “nhưng đến” diễn đạt tự nhiên bước ngoặt ấy.
- source_word: מָרָדוּ
  choice: họ nổi loạn
  rationale: מרד diễn tả việc chống lại quyền cai trị; “nổi loạn” rõ nghĩa và thích hợp với bối cảnh chư hầu chống bá chủ.
