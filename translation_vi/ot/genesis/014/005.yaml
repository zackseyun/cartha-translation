    rationale: Tiếng Hê-bơ-rơ nói đơn giản “các vua ở/cùng với ông.” Bối cảnh có thể gợi liên minh, nhưng bản dịch nên không xác định rõ bản chất chính trị của quan hệ này.
  - severity: medium
