  source_fidelity: 'Cần sửa hai điểm nhỏ để sát tiếng Hê-bơ-rơ hơn: cụm “các vua liên minh với ông” xác định quan hệ liên minh mạnh hơn điều văn chỉ nói là “các vua ở/cùng với ông”; và “Xu-xi” không bảo toàn đầy đủ tên dân tộc הַזּוּזִים (Zuzim), đặc biệt là yếu tố cuối -im.'
