  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: vi
  text: Năm thứ mười bốn, Kê-đô-la-ô-me đã đến cùng các vua đi với ông, và họ đánh bại người Rê-pha-im[a] tại Ách-tê-rốt Cạt-na-im, người Xu-xim tại Ham, và người Ê-mim tại Sa-vê Ki-ri-a-tha-im[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản dịch dịch “Rê-pha-im” là “người khổng lồ”; tại đây bản dịch giữ nguyên tên của tộc người này.
    reason: lexical_alternative
  - marker: b
    text: “Sa-vê Ki-ri-a-tha-im” cũng có thể được hiểu là “đồng bằng Ki-ri-a-tha-im.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: Năm thứ mười bốn
  rationale: Diễn đạt tự nhiên một trạng ngữ thời gian trong tiếng Việt; liên từ mở đầu được hàm chứa trong mạch kể.
- source_word: בָּא
  choice: kéo đến
  rationale: Động từ cơ bản nghĩa là “đến”; trong bối cảnh liên quân tiến đánh, “kéo đến” tự nhiên hơn mà không nhất thiết xác định phương thức hành quân.
- source_word: כְדָרְלָעֹמֶר
  choice: Kê-đô-la-ô-me
  rationale: Phiên âm tên riêng theo dạng Hê-bơ-rơ, dùng âm tiết rõ ràng cho độc giả Việt.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: cùng các vua liên minh với ông
  rationale: “Ở với ông” trong ngữ cảnh quân sự chỉ các vua cùng phe; “liên minh” làm rõ quan hệ theo văn cảnh mà vẫn giữ ý đồng hành.
- source_word: וַיַּכּוּ
  choice: đánh bại
  rationale: נכה có nghĩa đánh, hạ; trong danh sách các dân bị chinh phục, “đánh bại” truyền đạt đúng kết quả quân sự.
- source_word: רְפָאִים
  choice: người Rê-pha-im
  rationale: Giữ đây là tên một tộc người, không diễn giải thành “người khổng lồ”.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: tại Ách-tê-rốt Cạt-na-im
  rationale: Giữ địa danh bằng phiên âm; “tại” phù hợp với địa điểm giao chiến.
- source_word: הַזּוּזִים
  choice: người Xu-xi
  rationale: Phiên âm tên tộc người và thêm “người” để câu tiếng Việt rõ nghĩa.
- source_word: בְּהָם
  choice: tại Ham
  rationale: Hiểu là địa danh và phiên âm trực tiếp, không thêm nghĩa suy đoán.
- source_word: הָאֵימִים
  choice: người Ê-mim
  rationale: Phiên âm tên tộc người, giữ song song với hai nhóm trước.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: tại Sa-vê Ki-ri-a-tha-im
  rationale: Giữ toàn cụm như địa danh, tránh quyết định dứt khoát rằng שָׁוֵה phải được dịch là “đồng bằng”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Tên người, tộc người và địa danh được phiên âm nhất quán theo hình thức Hê-bơ-rơ; không mang sang chú thích tiếng Anh về lối viết tên Kedorlaomer vì đó là vấn đề riêng của truyền thống chính tả tiếng Anh.
