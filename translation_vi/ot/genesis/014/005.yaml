  to: Năm thứ mười bốn, Kê-đô-la-ô-me đã đến cùng các vua đi với ông, và họ đánh bại người Rê-pha-im[a] tại Ách-tê-rốt Cạt-na-im, người Xu-xim tại Ham, và người Ê-mim tại Sa-vê Ki-ri-a-tha-im[b].
