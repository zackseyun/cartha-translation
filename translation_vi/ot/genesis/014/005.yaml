  terminology: Giữ Rê-pha-im và Ê-mim như tên các nhóm người là phù hợp. Đổi “Xu-xi” thành “Xu-xim” để nhất quán với cách bảo toàn hậu tố -im trong Rê-pha-im và Ê-mim. Các địa danh và chú thích về Sa-vê Ki-ri-a-tha-im được giữ nguyên vì không cần quyết định nghĩa từ nguyên của שָׁוֵה.
