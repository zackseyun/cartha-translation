    rationale: Nguyên văn dùng một động từ “lấy” cho cả Lót và tài sản, sau đó là một động từ riêng “đi”. Trong tiếng Việt, “bắt Lót ... cùng tài sản” không tự nhiên bằng việc nêu rõ bắt người và lấy tài sản.
  - severity: low
