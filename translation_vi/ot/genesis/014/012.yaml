  to: Họ bắt Lót[a], cháu trai của Áp-ram, và lấy tài sản của ông, rồi đi[b]. Lót đang sống ở Sô-đôm.
  rationale: Bản sửa phân biệt tự nhiên trong tiếng Việt giữa việc bắt Lót và lấy tài sản của ông, trong khi vẫn chuyển tải ý của động từ “lấy” trong ngữ cảnh chinh phạt và động từ tiếp theo “rồi đi”. Câu cuối giữ giá trị thông tin nền của phân từ “đang sống”. Chú thích [b] được sửa để mô tả chính xác trật tự cú pháp nguyên văn, thay vì tạo ra một cách hiểu thay thế.
