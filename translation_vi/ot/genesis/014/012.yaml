  yaml_path: translation/ot/genesis/014/012.yaml
  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: vi
  text: Họ bắt Lót[a], cháu trai của Áp-ram, và lấy tài sản của ông, rồi đi[b]. Lót đang sống ở Sô-đôm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “con trai của anh/em trai Áp-ram”, tức là cháu trai của Áp-ram.'
    reason: lexical_alternative
  - marker: b
    text: Theo trật tự nguyên văn, cụm “con trai của anh/em trai Áp-ram” được đặt sau cụm “tài sản của ông”.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Họ bắt
  rationale: Động từ לקח cơ bản là “lấy”; trong ngữ cảnh chiến thắng, cướp bóc và bắt người, “bắt” diễn đạt tự nhiên việc đưa Lót đi mà không dùng từ mạnh hơn như “bắt cóc”.
- source_word: רְכֻשׁוֹ
  choice: tài sản của ông
  rationale: רְכוּשׁ chỉ tài sản, đặc biệt là của cải có thể mang đi; “tài sản” rõ nghĩa và phù hợp văn cảnh.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: cháu trai của Áp-ram
  rationale: Nguyên văn là “con trai của anh/em trai Áp-ram”; tiếng Việt tự nhiên gọi quan hệ này là “cháu trai”, còn cách nói sát chữ được giữ trong chú thích.
- source_word: וַיֵּלֵכוּ
  choice: rồi mang đi
  rationale: הלך nghĩa đen là “đi”; sau động từ bắt/lấy và với cả người lẫn tài sản làm đối tượng, “mang đi” diễn đạt tự nhiên việc họ rời đi cùng chiến lợi phẩm.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: Lúc ấy, Lót đang sống tại Sô-đôm
  rationale: Phân từ יֹשֵׁב nêu hoàn cảnh nền đang tiếp diễn. Lặp lại “Lót” giúp tiếng Việt tránh đại từ mơ hồ, còn “đang sống” tự nhiên hơn “đang cư ngụ” đối với độc giả phổ thông.
