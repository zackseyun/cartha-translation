  yaml_path: translation/ot/genesis/014/003.yaml
  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: vi
  text: Tất cả những người này liên kết với nhau tại thung lũng Si-đim (tức là Biển Muối[a]).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo tên gọi về sau: Biển Chết.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Tất cả những người này
  rationale: Cụm từ Hê-bơ-rơ mang nghĩa tập hợp. Vì văn cảnh nói đến các vua, tiếng Việt cần danh từ chỉ người để câu tự nhiên, nhưng không thêm cụ thể “các vua” vào nguyên văn.
- source_word: חָבְרוּ
  choice: liên kết với nhau
  rationale: Động từ חבר ở thể Qal diễn tả việc kết hợp hay liên kết; cách dịch này giữ được nghĩa cơ bản và phù hợp với bối cảnh quân sự-chính trị mà không khẳng định quá mức rằng họ lập một liên minh chính thức.
- source_word: אֶל
  choice: tại
  rationale: Dù אֶל thường chỉ hướng đến, với động từ tụ họp trong câu này, “tại” diễn đạt tự nhiên địa điểm nơi họ liên kết.
- source_word: עֵמֶק
  choice: thung lũng
  rationale: עֵמֶק thường chỉ một thung lũng; đây là cách dịch trực tiếp và tự nhiên.
- source_word: הַשִּׂדִּים
  choice: Si-đim
  rationale: Đây là địa danh, được phiên âm sang tiếng Việt; mạo từ Hê-bơ-rơ được thể hiện tự nhiên trong cụm “thung lũng Si-đim”.
- source_word: הוּא
  choice: tức là
  rationale: Đại từ này giới thiệu lời đồng nhất hoặc giải thích địa danh, nên “tức là” truyền đạt rõ chức năng đồng vị.
- source_word: יָם הַמֶּלַח
  choice: Biển Muối
  rationale: Cụm Hê-bơ-rơ có nghĩa trực tiếp là “Biển Muối”. Cách gọi quen thuộc về sau “Biển Chết” được giữ trong chú thích thay vì thay thế tên trong nguyên văn.
