  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: vi
  text: và dân Hô-rít trong vùng núi của họ, tức Sê-i-rơ, cho đến Êl-Pha-ran[a], nơi ở cạnh hoang mạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể viết “Êl Pha-ran”; nếu hiểu tên này theo từ nguyên thay vì là một địa danh cố định, có thể dịch là “cây sồi/cây đoan của Pha-ran”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: và dân…
  rationale: Liên từ cùng dấu hiệu chỉ tân ngữ tiếp nối danh sách các dân bị đánh bại ở câu trước; tiếng Việt không biểu đạt riêng dấu hiệu tân ngữ, nên động từ được hiểu theo ngữ cảnh.
- source_word: הַחֹרִי
  choice: dân Hô-rít
  rationale: Danh từ chỉ dân tộc mang nghĩa tập thể; thêm “dân” giúp câu tiếng Việt rõ ràng, tự nhiên.
- source_word: בְּהַרְרָם
  choice: trong vùng núi của họ
  rationale: Giữ nghĩa số nhiều “các núi của họ” nhưng diễn đạt tự nhiên như một miền núi do dân ấy cư trú.
- source_word: שֵׂעִיר
  choice: là Sê-i-rơ
  rationale: Tên địa danh đứng sau cụm “vùng núi của họ”; “là” thể hiện quan hệ đồng vị mà không buộc phải hiểu thành sở hữu.
- source_word: עַד
  choice: cho đến
  rationale: Diễn tả giới hạn địa lý của cuộc tiến quân.
- source_word: אֵיל פָּארָן
  choice: Ên-Pha-ran
  rationale: Giữ như một địa danh thay vì quyết định dứt khoát nghĩa từ nguyên của אֵיל; dạng phiên âm này phù hợp cách gọi địa danh Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: nơi ở bên hoang mạc
  rationale: Mệnh đề quan hệ xác định vị trí của Ên-Pha-ran; “ở bên” giữ nghĩa không gian rộng của עַל trong ngữ cảnh này.
