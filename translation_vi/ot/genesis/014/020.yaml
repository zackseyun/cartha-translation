source:
  edition: WLC
  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: vi
  text: Và đáng chúc tụng là Đức Chúa Trời Tối Cao, Đấng đã trao kẻ thù của ngươi vào tay ngươi! Rồi ông trao cho người một phần mười của mọi thứ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không nhắc lại chủ ngữ của động từ “trao”; theo ngữ cảnh, cách hiểu tự nhiên nhất là Áp-ram trao cho Mên-chi-xê-đéc một phần mười của mọi thứ.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Và đáng chúc tụng thay
  rationale: Giữ liên từ và sắc thái của công thức chúc tụng ở dạng phân từ bị động, đồng thời diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: אֵל עֶלְיוֹן
  choice: Đức Chúa Trời Chí Cao
  rationale: Diễn đạt danh hiệu thần linh bằng cách gọi quen thuộc, dễ hiểu; 'Chí Cao' thể hiện tước hiệu עֶלְיוֹן.
- source_word: אֲשֶׁר
  choice: Đấng
  rationale: Đại từ quan hệ trang trọng và tự nhiên khi quy chiếu về Đức Chúa Trời.
- source_word: מִגֵּן
  choice: đã trao
  rationale: Động từ ở đây có nghĩa trao nộp hoặc phó vào quyền người khác, không phải 'che chở'; 'trao ... vào tay' giữ hình ảnh quân sự của nguyên văn.
- source_word: צָרֶיךָ
  choice: quân thù của con
  rationale: Danh từ số nhiều với hậu tố ngôi hai giống đực số ít, chỉ các đối thủ thù nghịch; 'quân thù' hợp với ngữ cảnh chiến trận.
- source_word: בְּיָדֶךָ
  choice: vào tay con
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ việc đặt đối phương dưới quyền kiểm soát của một người.
- source_word: וַיִּתֶּן
  choice: Rồi ông dâng
  rationale: Thể kể chuyện nối tiếp được diễn đạt bằng 'Rồi'; 'dâng' phù hợp với hành động Áp-ram trao một phần mười cho vua kiêm thầy tế lễ, nhưng không biến nó thành thuật ngữ luật định.
- source_word: לוֹ
  choice: cho người
  rationale: Đại từ gián tiếp tự nhiên nhất quy chiếu đến Mên-chi-xê-đéc; 'người' giữ lối văn trang trọng và tránh lặp tên.
- source_word: מַעֲשֵׂר
  choice: một phần mười
  rationale: Chuyển tải nghĩa trực tiếp của danh từ mà không mặc nhiên nhập các liên tưởng thể chế về thuế phần mười có ở giai đoạn sau.
- source_word: מִכֹּל
  choice: mọi thứ
  rationale: Diễn đạt tự nhiên ý nghĩa bao quát của toàn bộ những gì đang được nói đến trong ngữ cảnh.
theological_decisions:
- issue: Chủ ngữ không được nhắc lại của וַיִּתֶּן
  choice: 'Hiểu Áp-ram là chủ ngữ hàm ẩn: ''Rồi ông dâng cho người...'''
  alternative: Mên-chi-xê-đéc có thể được xem là chủ ngữ theo riêng cấu trúc bề mặt, dù ngữ cảnh ít ủng hộ hơn.
  rationale: Ngữ cảnh gần nhất và mạch kể tự nhiên cho thấy Áp-ram trao một phần mười cho Mên-chi-xê-đéc. Tuy vậy, nguyên văn không nêu lại chủ ngữ, nên bản dịch dùng đại từ và ghi chú sự hàm ẩn này thay vì chèn tên riêng vào câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ thành ngữ 'vào tay', dùng 'một phần mười' để minh bạch nghĩa gốc, và đặt dấu chú thích ngay sau mệnh đề có cả điểm từ vựng lẫn sự mơ hồ về chủ ngữ.
