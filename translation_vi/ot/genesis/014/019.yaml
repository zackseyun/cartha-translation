base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: vi
  text: 'Ông chúc phước cho Áp-ram và nói: “Nguyện Áp-ram được Đức Chúa Trời Chí Cao, Đấng sở hữu[a] trời và đất[b], ban phước.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng sáng tạo.” Phân từ Hê-bơ-rơ có thể mang nghĩa “đấng sở hữu,” “chủ nhân,” hoặc trong ngữ cảnh này là “đấng sáng tạo.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các tầng trời và đất.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: Ông chúc phước cho Áp-ram
  rationale: Dạng tự sự wayyiqtol với hậu tố tân ngữ ngôi ba số ít. Dùng tên Áp-ram thay cho đại từ để câu tiếng Việt rõ và tự nhiên trong phạm vi câu này.
- source_word: וַיֹּאמַר
  choice: và nói
  rationale: Giữ quan hệ phối hợp và dòng kể chuyện của nguyên văn Hê-bơ-rơ.
- source_word: בָּרוּךְ אַבְרָם לְאֵל עֶלְיוֹן
  choice: Nguyện Áp-ram được Đức Chúa Trời Chí Cao ... ban phước
  rationale: Diễn đạt tự nhiên công thức chúc phước, đồng thời giữ Đức Chúa Trời là nguồn ban phước và bảo toàn tước hiệu אֵל עֶלְיוֹן.
- source_word: קֹנֵה
  choice: Đấng sở hữu
  rationale: Phân từ קנה có thể chỉ sự sở hữu hoặc, trong ngữ cảnh này, sự sáng tạo. Bản chính giữ nghĩa sở hữu gần với phạm vi từ vựng rộng; nghĩa 'Đấng sáng tạo' được ghi ở chú thích.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: trời và đất
  rationale: Cách nói đôi chỉ toàn thể vũ trụ; 'trời và đất' là lối diễn đạt trang trọng, tự nhiên và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Nghĩa của קֹנֵה trong tước hiệu dành cho Đức Chúa Trời
  choice: Đấng sở hữu trời và đất
  alternative: Đấng sáng tạo trời và đất
  rationale: קנה có thể mang nghĩa sở hữu, thủ đắc, và trong một số ngữ cảnh là tạo dựng. Chọn 'Đấng sở hữu' trong bản chính nhưng ghi nhận 'Đấng sáng tạo' ở chú thích để không loại bỏ sự đa nghĩa thật của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Nguyện ... được ... ban phước” chuyển tải sắc thái chúc phước; “Đấng sở hữu” duy trì tính chất tước hiệu và sự mơ hồ từ vựng của nguyên văn.
