  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: vi
  text: Thung lũng Si-đim đầy những hố nhựa đường[a]. Các vua của Sô-đôm và Gô-mô-rơ chạy trốn rồi ngã xuống tại đó[b], còn những người còn lại chạy trốn lên vùng đồi núi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hố bitum” hoặc “hố hắc ín”; từ Hê-bơ-rơ chỉ những hố chứa bitum, một chất giống nhựa đường.
    reason: lexical_alternative
  - marker: b
    text: Tức là họ ngã xuống tại đó, trong thung lũng Si-đim, có lẽ vào những hố nhựa đường; nguyên văn không nói rõ họ ngã vào đâu.
    reason: ambiguity_preservation
  - marker: c
    text: Hay “lên núi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: Thung lũng Si-đim
  rationale: Dịch עֵמֶק là “thung lũng” và phiên âm địa danh הַשִּׂדִּים theo cách rõ ràng, quen thuộc trong tiếng Việt.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: đầy những hố nhựa đường
  rationale: Cách nói lặp “hố, hố nhựa đường” nhấn mạnh số lượng lớn; “đầy những hố” chuyển đạt tự nhiên trong tiếng Việt. חֵמָר chỉ bitum, một chất giống nhựa đường.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: các vua của Sô-đôm và Gô-mô-rơ
  rationale: Dù מֶלֶךְ có hình thức số ít, hai động từ số nhiều và văn cảnh cho thấy mỗi thành có một vua; tiếng Việt dùng “các vua” để biểu đạt ý tập hợp.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: rồi ngã xuống tại đó
  rationale: Giữ nghĩa thông thường của נפל là “ngã” và không thêm một tân ngữ không được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: וְהַנִּשְׁאָרִים
  choice: những người khác
  rationale: Chỉ những người còn lại trong nhóm; cách diễn đạt này tự nhiên và không mặc nhiên xác định họ là những người sống sót sau trận đánh.
- source_word: הֶרָה נָסוּ
  choice: chạy trốn lên vùng đồi núi
  rationale: הֶרָה gồm danh từ הַר với hậu tố chỉ hướng; “lên vùng đồi núi” diễn đạt cả hướng chuyển động lẫn địa hình một cách tự nhiên.
