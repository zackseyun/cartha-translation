translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu chữ dễ hiểu. Dùng các địa danh phiên âm Si-đim, Sô-đôm và Gô-mô-rơ; không thêm từ chỉ thời gian ở đầu câu vì nguyên văn chỉ có liên từ kể chuyện.
