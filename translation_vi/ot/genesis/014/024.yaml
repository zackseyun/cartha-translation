  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: vi
  text: Tôi sẽ không lấy gì cả, ngoại trừ những gì các thanh niên đã ăn[a] và phần của những người đã đi cùng tôi—A-ne, Ếch-côn và Mam-rê. Họ hãy nhận phần của mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những gì các tôi tớ” hoặc “những người tùy tùng đã ăn.” Từ Hê-bơ-rơ có thể chỉ các thanh niên hoặc những người phục vụ, tùy ngữ cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Họ sẽ nhận phần của mình.” Dạng động từ Hê-bơ-rơ có thể được hiểu là tương lai đơn, dù ngữ cảnh nghiêng về ý cho phép.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: Tôi sẽ không lấy gì cả, ngoại trừ
  rationale: Cụm mở đầu mang nghĩa loại trừ và nối tiếp lời khước từ ở câu trước; bổ sung ý động từ được hàm ẩn giúp câu tiếng Việt trọn nghĩa. “Ngoại trừ” diễn đạt tự nhiên sức hạn định của cả בִּלְעָדַי và רַק mà không tạo lối nói thừa.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: những gì các thanh niên đã ăn
  rationale: נְעָרִים có thể chỉ thanh niên hoặc người hầu/cận vệ. “Các thanh niên” giữ nghĩa trực tiếp và không quyết định quá mức địa vị xã hội của họ; chú thích nêu phương án theo ngữ cảnh.
- source_word: וְחֵלֶק הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי
  choice: và phần của những người đã đi cùng tôi
  rationale: “Phần” phù hợp với חֵלֶק trong bối cảnh phân chia chiến lợi phẩm; “đã đi cùng tôi” giữ hình ảnh chuyển động của הלך và tự nhiên trong tiếng Việt.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: A-ne, Ếch-côn và Mam-rê
  rationale: Phiên âm các tên riêng theo lối đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: Họ hãy nhận phần của mình
  rationale: Dạng chưa hoàn thành trong ngữ cảnh diễn đạt sự cho phép hoặc nhượng phần, không nhất thiết là dự báo tương lai. “Hãy nhận” tự nhiên hơn “hãy lấy” khi nói về phần được hưởng.
theological_decisions:
- issue: Ý động từ được hàm ẩn từ lời thề và sự khước từ ở câu trước
  choice: Bổ sung “Tôi sẽ không lấy gì cả”
  alternative: 'Giữ một mảnh câu: “Ngoại trừ những gì…”'
  rationale: Tiếng Hê-bơ-rơ dựa vào câu trước, còn tiếng Việt cần nhắc lại ý khước từ để câu độc lập và sáng rõ; việc bổ sung không thay đổi nội dung thần học.
- issue: Sắc thái của יִקְחוּ
  choice: 'Hiểu là sự cho phép: “Họ hãy nhận”'
  alternative: 'Hiểu như tương lai đơn: “Họ sẽ nhận”'
  rationale: Mạch văn nghiêng về việc Áp-ram cho phép các đồng minh nhận phần của họ, nhưng hình thái Hê-bơ-rơ cũng có thể được hiểu là tương lai đơn; chú thích bảo tồn khả năng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngoại trừ” để tránh lối dịch cứng tương đương với “ngoại trừ mà thôi”; giữ tên riêng và cấu trúc phân chia chiến lợi phẩm rõ ràng.
