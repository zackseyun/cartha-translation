  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và mạch lạc. Tên riêng được phiên âm theo lối quen thuộc trong văn bản Kinh Thánh tiếng Việt. Cấu trúc câu được chia thành ba câu để làm rõ chủ thể của từng mệnh đề mà không loại bỏ các quan hệ bổ nghĩa trong tiếng Hê-bơ-rơ.
