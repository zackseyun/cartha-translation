base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: vi
  text: Bấy giờ, một người trốn thoát đến báo tin cho Áp-ram, người Hê-bơ-rơ. Lúc ấy, ông đang cư ngụ bên những cây sồi của Mam-rê[a], người A-mô-rít, là anh em của Êch-côn và A-ne[b]. Họ là những đồng minh của Áp-ram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bên những cây terebinth của Mam-rê.” Từ Hê-bơ-rơ ở đây có thể chỉ những cây lớn, thường được nhận diện là cây sồi hoặc cây terebinth.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “người bà con của Êch-côn và A-ne.” Từ Hê-bơ-rơ được dịch là “anh em” cũng có thể chỉ quan hệ họ hàng rộng hơn.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “những người làm chủ một giao ước” với Áp-ram, tức những người đã kết ước liên minh với ông.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: một người trốn thoát
  rationale: Danh từ chỉ người đã thoát khỏi hiểm nguy hoặc chiến trận. Cách dịch này tự nhiên trong tiếng Việt và nhấn mạnh hành động thoát thân, thay vì chỉ nói người ấy còn sống sót.
- source_word: וַיַּגֵּד
  choice: báo tin
  rationale: Động từ có nghĩa là kể lại hoặc trình báo. Trong bối cảnh người vừa thoát nạn mang tin chiến trận đến, “báo tin” là cách diễn đạt tự nhiên và chính xác.
- source_word: הָעִבְרִי
  choice: người Hê-bơ-rơ
  rationale: Giữ nguyên danh xưng sắc tộc-xã hội được dùng cho Áp-ram trong nguyên văn, không diễn giải thêm nguồn gốc của tên gọi.
- source_word: שֹׁכֵן
  choice: đang cư ngụ
  rationale: Phân từ diễn tả tình trạng cư trú đang tiếp diễn vào thời điểm ấy. “Đang cư ngụ” vừa giữ sắc thái kéo dài vừa có văn phong trang trọng, dễ hiểu.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: bên những cây sồi của Mam-rê
  rationale: אֵלֹנֵי chỉ những cây lớn và thường được hiểu là sồi hoặc cây thông nhựa. Chọn “cây sồi” trong chính văn vì quen thuộc, đồng thời giữ khả năng khác trong chú thích.
- source_word: הָאֱמֹרִי
  choice: người A-mô-rít
  rationale: Danh xưng dân tộc bổ nghĩa cho Mam-rê được chuyển trực tiếp sang tiếng Việt.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: anh em của Ét-côn và A-ne
  rationale: אָח thường có nghĩa là anh hoặc em trai nhưng cũng có thể chỉ bà con rộng hơn. “Anh em” giữ cách nói tự nhiên mà không đoán thứ bậc tuổi tác; khả năng chỉ họ hàng được nêu trong chú thích.
- source_word: בַּעֲלֵי בְרִית
  choice: đồng minh
  rationale: Cụm từ có nghĩa đen là những người sở hữu hoặc làm chủ một giao ước, tức những người kết ước liên minh. “Đồng minh” truyền đạt rõ quan hệ chính trị-giao ước trong tiếng Việt hiện đại.
