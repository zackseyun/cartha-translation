  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: vi
  text: 'Vua Sô-đôm nói với Áp-ram: “Hãy trả những người[a] cho ta, còn của cải thì ngươi cứ lấy cho mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng danh từ số ít, nghĩa đen là “sinh thể/người”, nhưng ở đây được dùng theo nghĩa tập hợp để chỉ những người đã được giải cứu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng kể chuyện với waw nối tiếp thúc đẩy trình tự câu chuyện; tiếng Việt không cần thêm “rồi” vì mạch văn đã thể hiện sự tiếp nối.
- source_word: מֶלֶךְ סְדֹם
  choice: Vua Sô-đôm
  rationale: Diễn đạt tự nhiên chuỗi liên kết chỉ vua của thành Sô-đôm; dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: אֶל אַבְרָם
  choice: với Áp-ram
  rationale: Trong cấu trúc động từ “nói”, אֶל được diễn đạt tự nhiên là “với”; Áp-ram là dạng phiên âm tiếng Việt thông dụng.
- source_word: תֶּן לִי
  choice: Hãy giao ... cho ta
  rationale: Động từ mệnh lệnh נתן trong ngữ cảnh này mang nghĩa trao/giao lại; “cho ta” bảo toàn đại từ ngôi thứ nhất của người nói.
- source_word: הַנֶּפֶשׁ
  choice: những người ấy
  rationale: נֶפֶשׁ ở số ít nhưng được dùng theo nghĩa tập hợp, chỉ những người đã được giải cứu. “Những người ấy” tự nhiên và rõ hơn cách dịch sát chữ “linh hồn”.
- source_word: וְהָרְכֻשׁ
  choice: còn của cải
  rationale: רְכוּשׁ chỉ tài sản hay của cải, đặc biệt là những vật sở hữu; “còn” thể hiện sự đối lập trong lời đề nghị mà liên từ וְ tạo ra ở ngữ cảnh này.
- source_word: קַח לָךְ
  choice: thì ngươi cứ lấy cho mình
  rationale: Mệnh lệnh קַח cùng לָךְ diễn tả việc lấy để thuộc về hoặc làm lợi cho chính người được nói đến; “cứ” truyền đạt sắc thái cho phép trong lời đề nghị.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “ta—ngươi” phù hợp lời của một vị vua trong bối cảnh cổ đại mà không quá cổ kính. Giữ sự tương phản giữa con người và của cải.
