  source_fidelity: 'Cần sửa “trước Yahweh”: giới từ אֶל trong thành ngữ הֲרִימֹתִי יָדִי hướng lời thề đến Yahweh, không chủ yếu chỉ vị trí “trước” Ngài. Bản sửa giữ cử chỉ cụ thể mà không diễn giải thành lời thề trong văn bản chính.'
  naturalness: “Giơ tay lên Yahweh” là cách diễn đạt văn chương Kinh Thánh tự nhiên hơn “giơ tay lên trước Yahweh” trong tiếng Việt hiện đại. Các tước hiệu được giữ trang trọng và rõ nghĩa.
  terminology: Giữ nhất quán Yahweh cho יהוה, “Đức Chúa Trời Chí Cao” cho אֵל עֶלְיוֹן, và “Đấng sở hữu trời và đất” cho קֹנֵה, với chú thích riêng bảo lưu khả năng “Đấng tạo dựng.”
