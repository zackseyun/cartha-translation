    rationale: Ghi chú về cử chỉ giơ tay cần neo ngay sau cụm này; lựa chọn từ vựng “sở hữu/tạo dựng” cần neo sau tước hiệu liên quan để người đọc nhận rõ phạm vi từng chú thích.
