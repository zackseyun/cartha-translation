source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: vi
  text: 'Nhưng Áp-ram nói với vua Sô-đôm: “Tôi đã giơ tay lên Yahweh[a], Đức Chúa Trời Chí Cao, Đấng sở hữu trời và đất[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Giơ tay” là một cử chỉ thề nguyện của người Hê-bơ-rơ.
    reason: cultural_note
  - marker: b
    text: 'Hoặc: “Đấng tạo dựng trời và đất.” Từ Hê-bơ-rơ có thể mang nghĩa “sở hữu,” “chủ sở hữu,” hoặc, trong ngữ cảnh này, “tạo dựng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng ... nói
  rationale: Liên từ nối tiếp diễn tiến câu chuyện; trong ngữ cảnh, “Nhưng” diễn đạt tự nhiên sự tương phản giữa đề nghị của vua Sô-đôm và lời đáp của Áp-ram.
- source_word: הֲרִימֹתִי יָדִי
  choice: Tôi đã giơ tay lên trước
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ về cử chỉ thề nguyện; “trước” diễn đạt hướng quy chiếu của אֶל một cách tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֵל עֶלְיוֹן
  choice: Đức Chúa Trời Chí Cao
  rationale: Cách dịch trang trọng, tự nhiên và quen thuộc của tước hiệu, thể hiện địa vị tối cao.
- source_word: קֹנֵה
  choice: Đấng sở hữu
  rationale: Động tính từ của קנה có thể chỉ việc sở hữu hoặc tạo dựng. “Đấng sở hữu” giữ gần nghĩa từ vựng trực tiếp mà không loại bỏ cách hiểu “Đấng Tạo Hóa”.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: trời và đất
  rationale: Cặp từ bao quát toàn thể thế giới được diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; giữ “Yahweh” phân biệt danh này với các tước hiệu.
- issue: Nghĩa của קֹנֵה שָׁמַיִם וָאָרֶץ
  choice: Đấng sở hữu trời và đất
  alternative: Đấng tạo dựng trời và đất
  rationale: Từ Hê-bơ-rơ có phạm vi nghĩa gồm sở hữu và, trong ngữ cảnh nhất định, tạo dựng. Bản văn chính giữ nghĩa sở hữu, còn chú thích bảo tồn cách hiểu quan trọng kia.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ thành ngữ cụ thể của nguyên văn và giải thích bằng chú thích; không giải quyết dứt khoát sự đa nghĩa của קֹנֵה.
