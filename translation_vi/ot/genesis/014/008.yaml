  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: vi
  text: Bấy giờ, vua Sô-đôm, vua Gô-mô-rơ, vua Át-ma, vua Xê-bô-im và vua Bê-la (tức là Xô-a) xuất quân; họ dàn trận giao chiến với các vua kia[a] tại thung lũng Si-đim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chống lại các vua kia.” Tiếng Hê-bơ-rơ nói sát nghĩa là “với họ—trận chiến,” nên ngữ cảnh cho thấy đây là giao chiến đối địch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Bấy giờ ... xuất quân
  rationale: Động từ theo mạch kể chuyện có nghĩa đen là “đi ra”; trong bối cảnh các vua tiến ra chiến trường, “xuất quân” tự nhiên và truyền đạt đúng hành động quân sự. Dạng số ít đứng trước một chủ ngữ ghép được diễn đạt theo cách tự nhiên trong tiếng Việt.
- source_word: מֶלֶךְ
  choice: vua
  rationale: Giữ nguyên sự lặp lại danh hiệu trước từng địa danh, phản ánh nhịp trang trọng của tiếng Hê-bơ-rơ.
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים
  choice: Sô-đôm / Gô-mô-rơ / Át-ma / Xê-bô-im
  rationale: Phiên âm các địa danh theo lối quen thuộc và dễ đọc trong tiếng Việt hiện đại.
- source_word: בֶּלַע הִוא צֹעַר
  choice: Bê-la (tức là Xô-a)
  rationale: Cụm đồng vị xác định Bê-la chính là Xô-a; dấu ngoặc thể hiện rõ lời giải thích chen vào.
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: họ dàn trận giao chiến
  rationale: Trong ngữ cảnh quân sự, ערך chỉ việc bố trí lực lượng thành thế trận; “dàn trận giao chiến” vừa tự nhiên vừa giữ sắc thái cụ thể hơn “chuẩn bị chiến đấu”.
- source_word: אִתָּם
  choice: với các vua kia
  rationale: Giữ nghĩa cơ bản “với họ” của giới từ, đồng thời dùng “các vua kia” để làm rõ đại từ chỉ các vua đã nêu ở câu trước mà không thêm tên.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: tại thung lũng Si-đim
  rationale: “Thung lũng” là cách dịch hiện đại của עֵמֶק; Si-đim được phiên âm như một địa danh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Câu giữ phép liệt kê lặp lại “vua” của nguyên văn; “xuất quân” và “dàn trận giao chiến” giúp người đọc phổ thông nhận ra rõ bối cảnh quân sự.
