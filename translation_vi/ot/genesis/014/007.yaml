  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: vi
  text: Rồi họ quay lại, đến Ên Mích-pát (tức là Ca-đe)[a], đánh khắp vùng đất của người A-ma-léc[b], và cả người A-mô-rít đang cư ngụ tại Hát-xát-xôn Tha-ma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ên Mích-pát có nghĩa là “suối phán xét.”
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “khắp đồng ruộng của người A-ma-léc.” Nguyên văn Hê-bơ-rơ viết theo nghĩa đen là “toàn bộ đồng ruộng của người A-ma-léc,” có lẽ chỉ vùng đất người A-ma-léc chiếm giữ.
    reason: lexical_alternative
  - marker: c
    text: Hát-xát-xôn Tha-ma được đồng nhất với Ên Ghê-đi trong 2 Sử ký 20:2.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Rồi họ quay lại
  rationale: Diễn đạt diễn tiến tuần tự của lối kể chuyện Hê-bơ-rơ và giữ sắc thái đổi hướng của động từ שוב.
- source_word: וַיָּבֹאוּ אֶל
  choice: đến
  rationale: Cách nói tự nhiên trong tiếng Việt cho chuyển động tới một địa điểm.
- source_word: עֵין מִשְׁפָּט
  choice: Ên Mích-pát
  rationale: Đây là địa danh nên được phiên âm trong chính văn; ý nghĩa tên gọi được nêu ở chú thích.
- source_word: הִוא קָדֵשׁ
  choice: (tức là Ca-đe)
  rationale: Diễn đạt rõ chức năng đồng nhất địa danh của đại từ và tên riêng trong nguyên văn.
- source_word: וַיַּכּוּ
  choice: đánh
  rationale: Giữ phạm vi nghĩa tương đối rộng của נכה, không tự ý khẳng định họ đã tiêu diệt hay hoàn toàn chinh phục đối phương.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: khắp vùng đất của người A-ma-léc
  rationale: שׂדה có nghĩa đen là 'đồng ruộng' nhưng ở đây nhiều khả năng chỉ cả vùng do dân A-ma-léc chiếm giữ; 'khắp vùng đất' vừa tự nhiên vừa giữ ý địa lý.
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: và cả người A-mô-rít
  rationale: Giữ sắc thái bổ sung của וְגַם; danh từ chỉ dân tộc số ít trong tiếng Hê-bơ-rơ mang nghĩa tập thể.
- source_word: הַיֹּשֵׁב
  choice: đang cư ngụ
  rationale: Phân từ mô tả tình trạng cư trú tiếp diễn; cách dịch trang trọng nhưng vẫn hiện đại.
- source_word: בְּחַצְצֹן תָּמָר
  choice: tại Hát-xát-xôn Tha-ma
  rationale: Phiên âm địa danh và dùng 'tại' phù hợp tự nhiên với động từ 'cư ngụ'.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Các địa danh được phiên âm nhất quán; “người A-ma-léc” và “người A-mô-rít” được hiểu theo nghĩa tập thể. Vị trí các dấu chú thích được đặt ngay sau nội dung tương ứng.
