revisions:
- from: Rồi họ lấy tất cả tài sản của Sô-đôm và Gô-mô-rơ, cùng tất cả lương thực của hai thành[a], rồi bỏ đi.
  to: Rồi họ lấy tất cả tài sản của Sô-đôm và Gô-mô-rơ, cùng toàn bộ lương thực[a] của Sô-đôm và Gô-mô-rơ, rồi ra đi.
  rationale: Sửa vị trí neo chú thích để nó gắn với từ được giải nghĩa. Thay «của hai thành» bằng việc lặp lại các địa danh nhằm tránh thêm một cách gọi không có trong câu Hê-bơ-rơ, và đổi «bỏ đi» thành «ra đi» để giữ nghĩa trung tính của động từ «đi». Không thay đổi ý nghĩa của câu.
