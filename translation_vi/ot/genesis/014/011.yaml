  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: vi
  text: Rồi họ lấy tất cả tài sản của Sô-đôm và Gô-mô-rơ, cùng toàn bộ lương thực[a] của Sô-đôm và Gô-mô-rơ, rồi ra đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thức ăn” hoặc “đồ tiếp tế”. Từ Hê-bơ-rơ có thể chỉ thức ăn nói chung hoặc lương thực, đồ dự trữ cho một cuộc hành trình hay chiến dịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: họ lấy
  rationale: Động từ לקח ở dạng kể chuyện có nghĩa cơ bản là “lấy”. Cách dịch này trực tiếp, tự nhiên và không diễn giải quá mức thành “cướp lấy” hay “mang đi”.
- source_word: כָּל
  choice: tất cả
  rationale: Từ chỉ toàn thể được lặp lại trước cả “tài sản” lẫn “lương thực”; việc lặp “tất cả” giữ nguyên sắc thái bao quát và nhấn mạnh của bản Hê-bơ-rơ.
- source_word: רְכֻשׁ
  choice: tài sản
  rationale: Chỉ của cải hoặc đồ đạc có thể chiếm lấy. “Tài sản” là cách diễn đạt hiện đại, rộng nghĩa và phù hợp với ngữ cảnh chiến lợi phẩm.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sô-đôm và Gô-mô-rơ
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho hai địa danh.
- source_word: אָכְלָם
  choice: lương thực của hai thành
  rationale: Danh từ từ gốc אכל mang nghĩa “thức ăn, lương thực”, kèm hậu tố ngôi thứ ba số nhiều. “Của hai thành” làm rõ sở hữu theo ngữ cảnh mà không đổi đối tượng quy chiếu.
- source_word: וַיֵּלֵכוּ
  choice: rồi bỏ đi
  rationale: Động từ הלך trong chuỗi kể chuyện chỉ việc rời đi sau khi lấy chiến lợi phẩm. “Bỏ đi” tự nhiên trong tiếng Việt và vẫn gần với nghĩa nguồn.
