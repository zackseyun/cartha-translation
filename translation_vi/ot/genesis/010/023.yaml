  yaml_path: translation/ot/genesis/010/023.yaml
  text: 'The sons of Aram: Uz[a], Hul, Gether, and Mash.'
translation:
  language: vi
  text: Các con trai của A-ram là Út, Hul, Ghê-the và Mash.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ ở đây chép Mash; 1 Sử Ký 1:17 chép Mê-siếc.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: Dịch trực tiếp danh từ số nhiều ở dạng liên kết בְּנֵי. Liên từ וּ không cần thể hiện riêng vì câu này tiếp tục danh sách gia phả và tiếng Việt tự nhiên không cần mở đầu bằng “Và”.
- source_word: אֲרָם
  choice: A-ram
  rationale: Tên riêng được phiên âm theo lối quen thuộc, rõ âm tiết đối với độc giả Việt.
- source_word: עוּץ
  choice: Út
  rationale: Phiên âm tên riêng Hê-bơ-rơ עוּץ theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: חוּל
  choice: Hun
  rationale: Phiên âm tên riêng חוּל; phụ âm cuối được thể hiện theo cách đọc tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: גֶתֶר
  choice: Ghê-te
  rationale: Phiên âm trực tiếp tên riêng Hê-bơ-rơ, dùng “gh” trước “ê” để giữ âm /g/ trong chính tả tiếng Việt.
- source_word: מַשׁ
  choice: Mách
  rationale: Theo bản Masoret WLC tại Sáng Thế Ký 10:23, không thay bằng tên Mê-siếc trong câu chính.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ công thức gia phả “các con trai của” và phiên âm các tên riêng theo lối Kinh Thánh tiếng Việt. Dấu chú thích được đặt ngay sau “Mách” vì chú thích liên quan riêng đến tên này.
