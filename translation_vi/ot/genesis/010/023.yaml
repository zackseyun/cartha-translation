  source_fidelity: Bản dịch giữ đúng cấu trúc gia phả và thứ tự bốn tên trong tiếng Hê-bơ-rơ. Tuy nhiên, «Hun» không phản ánh tên חוּל (Hul), vì phụ âm cuối là l, không phải n. «Ghê-te» cũng làm mất phụ âm cuối r của גֶתֶר; nên giữ dạng phiên âm minh bạch hơn.
  naturalness: Câu văn ngắn gọn, tự nhiên và phù hợp văn phong gia phả tiếng Việt hiện đại. Việc dùng các dạng tên gần với dạng gốc/La-tinh hóa giúp tránh gây nhầm lẫn do các tên Việt hóa không nhất quán.
  terminology: «Các con trai của» phù hợp với công thức בְנֵי trong ngữ cảnh gia phả. A-ram và Út có thể giữ theo lối phiên âm đang dùng. Dạng «Mash» bảo toàn chính xác tên מַשׁ của WLC và phân biệt rõ với Mê-siếc trong 1 Sử Ký 1:17.
