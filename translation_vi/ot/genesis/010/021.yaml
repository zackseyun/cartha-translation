base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: vi
  text: Sêm cũng có con. Ông là tổ phụ của mọi con cháu Ê-be và là em trai của Gia-phết, người lớn tuổi hơn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ông là tổ phụ của mọi con cháu Ê-be và là anh trai của Gia-phết.” Trong tiếng Híp-ri, từ “lớn tuổi hơn” có thể bổ nghĩa cho Sêm hoặc cho Gia-phết.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם יֻלַּד גַּם הוּא
  choice: Sêm cũng sinh con
  rationale: Cách diễn đạt chủ động tự nhiên trong tiếng Việt truyền đạt thành ngữ bị động Híp-ri về việc có con cháu, đồng thời giữ ý bổ sung của גַּם הוּא.
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  choice: tổ phụ của tất cả con cháu Ê-be
  rationale: Trong văn cảnh gia phả, אָב chỉ người tổ tiên; “tổ phụ” chính xác hơn “cha” theo nghĩa trực hệ, còn בְּנֵי được diễn đạt tự nhiên là “con cháu” mà vẫn giữ tên Ê-be.
- source_word: אֲחִי יֶפֶת
  choice: anh của Gia-phết
  rationale: אָחִי là “anh/em trai của”; tiếng Việt cần chọn cách xưng hô theo tuổi khi gắn הַגָּדוֹל với Sêm trong cách đọc chính.
- source_word: הַגָּדוֹל
  choice: anh ... người lớn tuổi hơn
  rationale: Trong quan hệ anh em, גָּדוֹל thường chỉ người lớn tuổi hơn. Cách đặt này theo cách hiểu tính từ bổ nghĩa cho Sêm, nhưng sự nhập nhằng được ghi rõ trong chú thích.
theological_decisions:
- issue: Quan hệ cú pháp của הַגָּדוֹל với Sêm hay Gia-phết
  choice: Hiểu Sêm là người anh lớn tuổi hơn Gia-phết
  alternative: 'Hiểu Gia-phết là người lớn tuổi hơn: “em của Gia-phết”'
  rationale: Cú pháp Híp-ri cho phép tính từ liên hệ với Sêm hoặc Gia-phết. Bản chính chọn một cách đọc khả dĩ nhưng giữ cách đọc kia trong chú thích, không giải quyết quá mức sự nhập nhằng nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “tổ phụ” trong văn cảnh gia phả; câu được chia đôi để tránh cấu trúc nhiều thành phần chen giữa, đồng thời marker [a] đặt ngay sau mệnh đề có cách đọc nhập nhằng.
