  to: Sêm cũng có con. Ông là tổ phụ của mọi con cháu Ê-be và là em trai của Gia-phết, người lớn tuổi hơn.[a]
  rationale: Bản sửa chọn cách đọc mà tính từ “lớn tuổi hơn” bổ nghĩa cho Gia-phết, phù hợp với trật tự gần nhất trong tiếng Híp-ri và với bản tiếng Anh trong audit trail (“the brother of Japheth the elder”). Chú thích giữ cách đọc hợp lệ khác, theo đó Sêm là người anh lớn tuổi hơn. Cách diễn đạt “có con” giúp câu tiếng Việt hiện đại tự nhiên mà vẫn phản ánh công thức gia phả nguyên ngữ.
