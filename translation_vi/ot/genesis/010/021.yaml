  source_fidelity: 'Bản nháp truyền đạt đúng ý gia phả: Sêm cũng có con và là tổ phụ của dòng dõi Ê-be. Tuy nhiên, câu chính hiện tại đặt “người lớn tuổi hơn” sau “Gia-phết”, nên theo cách đọc tiếng Việt tự nhiên lại quy tính từ này cho Gia-phết, trong khi phần quyết định từ vựng nói đang chọn Sêm là người anh lớn tuổi hơn. Cần làm cách đọc chính nhất quán, đồng thời chú thích phải bảo lưu sự nhập nhằng của tiếng Híp-ri.'
  naturalness: “Sêm cũng sinh con” có thể hiểu được nhưng hơi gượng trong tiếng Việt hiện đại; “Sêm cũng có con” tự nhiên hơn trong lối văn gia phả. Cấu trúc “Gia-phết, người lớn tuổi hơn” cũng kém gọn; khi chọn cách hiểu Gia-phết là người lớn tuổi hơn, “là em trai của Gia-phết, người lớn tuổi hơn” rõ và tự nhiên hơn.
