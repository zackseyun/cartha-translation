  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: vi
  text: và Rê-sen, nằm giữa Ni-ni-ve và Ca-lách[a]; đó là thành phố lớn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể gọi là “Kalhu”, theo dạng A-si-ri của địa danh Ca-lách.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “đó là thành phố lớn” có thể chỉ riêng Rê-sen, hoặc chỉ một vùng đô thị rộng hơn giữa Ni-ni-ve và Ca-lách.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: và
  rationale: Liên từ וְ cùng dấu hiệu tân ngữ אֵת đưa thêm một địa danh vào chuỗi; tiếng Việt chỉ cần “và”.
- source_word: רֶסֶן
  choice: Rê-sen
  rationale: Phiên âm địa danh Hê-bơ-rơ theo cách đọc tự nhiên trong tiếng Việt.
- source_word: בֵּין ... וּבֵין
  choice: nằm giữa ... và ...
  rationale: Diễn đạt tự nhiên quan hệ vị trí do cấu trúc giới từ tương liên chỉ ra; “nằm” được thêm để câu tiếng Việt trọn nghĩa mà không thêm nội dung.
- source_word: נִינְוֵה
  choice: Ni-ni-ve
  rationale: Dùng dạng phiên âm quen thuộc và dễ đọc trong tiếng Việt.
- source_word: כָּלַח
  choice: Ca-lách
  rationale: Phiên âm trực tiếp địa danh trong bản Hê-bơ-rơ; chú thích giữ lại dạng A-si-ri “Kalhu” như một lựa chọn danh xưng.
- source_word: הִוא
  choice: đó là
  rationale: Đại từ độc lập ở đây có chức năng nối/nhắc lại; “đó là” giữ sắc thái giải thích và không buộc xác định rõ tiền ngữ.
- source_word: הָעִיר הַגְּדֹלָה
  choice: thành phố lớn
  rationale: Dịch trực tiếp danh từ xác định và tính từ; trong tiếng Việt, “thành phố lớn” tự nhiên hơn “thành lớn” và vẫn có thể hàm ý quy mô hoặc tầm quan trọng.
theological_decisions:
- issue: Đối tượng được gọi là “thành phố lớn”
  choice: Giữ nguyên câu “đó là thành phố lớn” mà không xác định rõ “đó” chỉ riêng Rê-sen hay một vùng đô thị rộng hơn.
  alternative: Hiểu là chỉ riêng Rê-sen; hoặc hiểu là toàn vùng đô thị giữa Ni-ni-ve và Ca-lách.
  rationale: Cú pháp Hê-bơ-rơ không giải quyết dứt khoát tiền ngữ của mệnh đề cuối; bản dịch giữ sự mơ hồ có thật thay vì diễn giải thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu chấm phẩy để tách mệnh đề định vị khỏi lời nhận định cuối. Mọi dấu chú thích đều xuất hiện trong chính văn, và dấu [a] được đặt đúng sau “Ca-lách”, địa danh mà chú thích giải thích.
