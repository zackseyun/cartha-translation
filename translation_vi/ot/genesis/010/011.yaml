  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: vi
  text: Từ xứ ấy, A-sua đi ra và xây thành Ni-ni-ve[a], Rê-hô-bốt-Ir và Ca-lách.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Từ xứ ấy, ông đi vào A-si-ri và xây thành Ni-ni-ve, Rê-hô-bốt-Ir và Ca-lách,” nếu hiểu chủ ngữ là Nim-rốt ở câu trước và אַשּׁוּר là vùng A-si-ri chứ không phải nhân vật A-sua.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: Từ xứ ấy
  rationale: מִן chỉ nguồn gốc hay điểm xuất phát; אֶרֶץ trong ngữ cảnh này là một vùng lãnh thổ. “Từ xứ ấy” tự nhiên và giữ được sắc thái địa lý.
- source_word: יָצָא
  choice: đi ra
  rationale: יצא thường có nghĩa là “đi ra”; cách dịch này diễn tả sự di chuyển khỏi vùng đất vừa được nhắc đến mà không thêm ý.
- source_word: אַשּׁוּר
  choice: A-sua
  rationale: Danh từ riêng này có thể chỉ nhân vật A-sua hoặc xứ A-si-ri. Cú pháp trực tiếp cho phép hiểu A-sua là chủ ngữ, nên bản chính giữ tên người; cách hiểu theo địa danh được ghi ở chú thích.
- source_word: וַיִּבֶן
  choice: xây thành
  rationale: בנה có nghĩa cơ bản là “xây”. Thêm “thành” trong tiếng Việt làm rõ các tân ngữ là đô thị mà không chuyển sang nghĩa hẹp hơn như “sáng lập”.
- source_word: נִינְוֵה
  choice: Ni-ni-ve
  rationale: Dạng phiên âm tiếng Việt quen dùng cho địa danh Nineveh.
- source_word: רְחֹבֹת עִיר
  choice: Rê-hô-bốt-Ir
  rationale: Trong danh sách các đô thị, cụm này hợp lý nhất khi được xem là địa danh. Phiên âm bảo toàn tên riêng và tránh quyết đoán theo nghĩa từ nguyên như “các quảng trường của thành”.
- source_word: כָּלַח
  choice: Ca-lách
  rationale: Phiên âm địa danh theo cách đọc gần với tiếng Hê-bơ-rơ và dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Chủ ngữ và nghĩa của אַשּׁוּר
  choice: 'Hiểu A-sua là chủ ngữ: “A-sua đi ra”'
  alternative: 'Hiểu Nim-rốt là chủ ngữ ngầm từ câu trước: “Từ xứ ấy, ông đi vào A-si-ri”'
  rationale: Văn bản Hê-bơ-rơ cho phép cả hai cách vì אַשּׁוּר có thể là tên người A-sua hoặc tên vùng A-si-ri. Trật tự câu có thể được đọc tự nhiên với A-sua là chủ ngữ được nêu rõ sau động từ; tuy nhiên, cách đọc Nim-rốt đi vào A-si-ri là một khả năng có thật nên được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xứ” cho vùng lãnh thổ cổ; phiên âm các tên riêng bằng dạng tiếng Việt dễ đọc. Chú thích giữ nguyên sự mơ hồ thật sự của nguyên văn.
