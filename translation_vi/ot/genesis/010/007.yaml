  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: vi
  text: Các con trai của Cút[a] là Xê-ba, Ha-vi-la, Sáp-ta, Ra-a-ma và Sáp-tê-ca[b]. Và các con trai của Ra-a-ma là Sê-ba và Đê-đan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong các gia phả, cụm từ Hê-bơ-rơ được dịch là “các con trai của” cũng có thể chỉ hậu duệ hoặc nguồn gốc của một thị tộc hay một dân tộc, chứ không nhất thiết chỉ các con trai trực tiếp.
    reason: cultural_note
  - marker: b
    text: Một số tên trong câu này có thể chỉ các dân tộc, vùng đất hoặc tổ tiên được dùng để gọi tên một dân tộc, chứ không nhất thiết chỉ các cá nhân.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: Dịch trực tiếp dạng số nhiều liên kết của בֵּן trong công thức gia phả. Trong ngữ cảnh này, cụm từ có thể chỉ con trai trực tiếp, hậu duệ, hoặc nguồn gốc của một thị tộc/dân tộc; chú thích giữ lại độ rộng nghĩa đó.
- source_word: כּוּשׁ
  choice: Cút
  rationale: Tên riêng được phiên âm theo cách quen thuộc và dễ đọc trong tiếng Việt.
- source_word: סְבָא
  choice: Sê-ba
  rationale: Phiên âm tên riêng, không tự ý xác định đây chỉ là một cá nhân, một địa danh hay một dân tộc.
- source_word: חֲוִילָה
  choice: Ha-vi-la
  rationale: Phiên âm tên riêng theo âm tiết tự nhiên trong tiếng Việt.
- source_word: סַבְתָּה
  choice: Sáp-ta
  rationale: Phiên âm tên riêng, phản ánh các phụ âm chính của tiếng Hê-bơ-rơ và giữ cách đọc rõ ràng.
- source_word: רַעְמָה
  choice: Ra-a-ma
  rationale: Phiên âm theo các âm tiết của tên Hê-bơ-rơ; dấu gạch nối giúp người đọc không gộp nhầm các nguyên âm quanh phụ âm ע.
- source_word: סַבְתְּכָא
  choice: Sáp-tê-ca
  rationale: Phiên âm tên riêng theo cách dễ đọc trong tiếng Việt, không diễn giải danh tính địa lý hoặc sắc tộc.
- source_word: וּבְנֵי רַעְמָה
  choice: Các con trai của Ra-a-ma
  rationale: Giữ nguyên công thức gia phả lặp lại trong nguyên văn; không thêm từ nối vì câu tiếng Việt vẫn tự nhiên và quan hệ cấu trúc đã rõ.
- source_word: שְׁבָא
  choice: Sê-ba
  rationale: Phiên âm tên riêng. Tên này có phụ âm đầu khác với סְבָא trong nguyên văn, dù khi Việt hóa cả hai có thể cùng được viết là “Sê-ba” theo lối quen dùng.
- source_word: דְדָן
  choice: Đê-đan
  rationale: Phiên âm trực tiếp tên riêng, không chuyển thành tên gọi của một sắc dân.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và gọn, phù hợp với danh sách gia phả. Giữ cấu trúc song song của nguyên văn và dùng lối phiên âm có gạch nối để người đọc tiếng Việt dễ nhận biết các âm tiết.
