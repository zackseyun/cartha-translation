  text: וְ/אֶת עוֹבָ֥ל וְ/אֶת אֲבִֽימָאֵ֖ל וְ/אֶת שְׁבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/028.yaml
  text: and Obal[a], and Abimael, and Sheba.
translation:
  language: vi
  text: và Ô-banh, và A-bi-ma-ên, và Sê-ba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: và
  rationale: וְ là liên từ “và”; אֶת là dấu hiệu chỉ tân ngữ xác định trong tiếng Hê-bơ-rơ và không có từ tương đương cần biểu đạt trong tiếng Việt. Việc lặp “và” trước mỗi tên giữ được nhịp liệt kê của nguyên văn.
- source_word: עוֹבָל
  choice: Ô-banh
  rationale: Tên riêng được phiên âm sang tiếng Việt theo âm Hê-bơ-rơ gần đúng; phụ âm cuối ל được thể hiện bằng “nh” theo quy ước phiên âm tên Kinh Thánh quen thuộc.
- source_word: אֲבִימָאֵל
  choice: A-bi-ma-ên
  rationale: Tên riêng được phiên âm, không dịch nghĩa các yếu tố cấu tạo bên trong tên.
- source_word: שְׁבָא
  choice: Sê-ba
  rationale: Tên riêng được phiên âm theo dạng שְׁבָא trong ngữ cảnh này; không đồng nhất với một tên khác có cách viết Hê-bơ-rơ khác.
theological_decisions: []
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, phù hợp một danh sách gia phả. Giữ liên từ “và” trước cả ba tên để phản ánh cấu trúc lặp וְאֶת của nguyên văn; không thêm chú thích vì dấu hiệu tân ngữ אֶת không tạo ra khác biệt nội dung cần thiết cho độc giả tiếng Việt.
