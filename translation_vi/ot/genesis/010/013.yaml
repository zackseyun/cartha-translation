  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: vi
  text: 'Mích-ra-im là tổ phụ của[a] các dân: Lu-đim[b], A-na-mim, Lê-ha-bim và Náp-tu-him.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sinh ra” hoặc “sinh thành”; động từ Hê-bơ-rơ là thuật ngữ gia phả thông dụng, chỉ việc sinh ra con cháu hoặc quan hệ tổ tiên–hậu duệ.'
    reason: lexical_alternative
  - marker: b
    text: Các tên trong câu này được phiên âm như tên các nhóm dân, chứ không được dịch thành địa danh hoặc đồng nhất với các sắc dân về sau.
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mích-ra-im
  rationale: Phiên âm như tên riêng của nhân vật tổ tiên trong bảng các dân tộc, thay vì dịch là “Ai Cập”; cách này giữ đúng chức năng của tên trong gia phả.
- source_word: יָלַד
  choice: sinh ra
  rationale: Đây là động từ gia phả thông dụng, chỉ việc sinh thành hoặc phát sinh dòng dõi. “Sinh ra” tự nhiên trong tiếng Việt và vẫn giữ được sắc thái trực tiếp của nguyên văn.
- source_word: לוּדִים / עֲנָמִים / לְהָבִים / נַפְתֻּחִים
  choice: các dân Lu-đim, A-na-mim, Lê-ha-bim và Náp-tu-him
  rationale: Các dạng số nhiều này được hiểu là tên những nhóm dân và được phiên âm, không đồng nhất chúng với những địa danh hay sắc dân về sau chưa thể xác định chắc chắn. Cụm “các dân” làm rõ chức năng dân tộc danh trong tiếng Việt.
- source_word: אֶת
  choice: không dịch riêng
  rationale: Đây là dấu hiệu đánh dấu tân ngữ trực tiếp trong tiếng Hê-bơ-rơ; chức năng ngữ pháp đã được thể hiện bằng trật tự câu tiếng Việt.
- source_word: וְ
  choice: và
  rationale: Liên từ thông thường nối thành phần cuối của danh sách.
theological_decisions:
- issue: Quan hệ giữa Mích-ra-im và các nhóm dân được kể tên
  choice: Giữ cách diễn đạt gia phả “sinh ra”, đồng thời gọi các đối tượng là “các dân”.
  alternative: Diễn giải là “trở thành tổ phụ của” hoặc xem đây là những người con trực tiếp.
  rationale: Nguyên văn dùng động từ gia phả nhưng các tân ngữ là dân tộc danh số nhiều. Bản dịch không quyết định quá mức rằng đây chỉ là quan hệ sinh học trực tiếp hay quan hệ tổ tiên–hậu duệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo âm tiết phù hợp với tiếng Việt; cấu trúc câu ngắn gọn theo lối gia phả, nhưng thêm “các dân” để người đọc nhận ra đây là những dân tộc danh số nhiều.
