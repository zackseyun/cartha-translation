base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: vi
  text: Từ những người này, các miền duyên hải của các dân tộc[a] được phân chia[b] trong các miền đất của họ, mỗi người theo ngôn ngữ mình[c], theo các thị tộc của họ, trong các dân tộc của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các hải đảo của các dân tộc.” Từ Hê-bơ-rơ có thể chỉ các đảo hoặc những miền ven biển; cả cụm cũng có thể được hiểu theo nghĩa hoán dụ là cư dân tại các vùng ấy.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tách ra.” Nguyên văn không nói rõ đây là việc phân chia các vùng hay sự phân tán của những cư dân tại đó.
    reason: source_ambiguity
  - marker: c
    text: Hê-bơ-rơ theo nghĩa sát chữ là “mỗi người theo ngôn ngữ của người ấy,” một lối nói phân phối; trong ngữ cảnh này, cách nói ấy chỉ sự phân chia theo ngôn ngữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Từ những người này
  rationale: Giới từ מִן cùng đại từ chỉ định אֵלֶּה diễn tả nguồn gốc; ngữ cảnh cho thấy “những người này” là các hậu duệ vừa được kể tên.
- source_word: נִפְרְדוּ
  choice: được phân chia
  rationale: Dạng Niphal của פרד mang nghĩa bị hoặc trở nên tách biệt, phân chia. Cách dịch này giữ sắc thái bị động/phản thân mà không thêm ý “di cư” vốn không được nói rõ.
- source_word: אִיֵּי הַגּוֹיִם
  choice: các miền duyên hải của các dân tộc
  rationale: אִיִּים có thể chỉ đảo hoặc các vùng ven biển; “miền duyên hải” tự nhiên trong tiếng Việt và phù hợp với phạm vi địa lý rộng ở đây, đồng thời giữ quan hệ sở thuộc của cụm Hê-bơ-rơ.
- source_word: בְּאַרְצֹתָם
  choice: trong các miền đất của họ
  rationale: אֶרֶץ ở đây chỉ những vùng đất hay lãnh thổ do các nhóm cư trú; “miền đất” vừa phổ thông vừa đủ rộng.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: mỗi dân theo ngôn ngữ mình
  rationale: אִישׁ theo nghĩa đen là “một người/người”, nhưng trong cấu trúc phân phối có nghĩa “mỗi”; “mỗi dân” giúp tiếng Việt rõ chủ thể tập thể trong ngữ cảnh các dân tộc mà vẫn giữ lực phân phối.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo các thị tộc mình
  rationale: מִשְׁפָּחָה trong bảng gia phả-dân tộc thường là nhóm họ hàng rộng hơn gia đình hạt nhân; “thị tộc” diễn đạt đúng cấp độ xã hội ấy.
- source_word: בְּגוֹיֵהֶם
  choice: trong các dân tộc mình
  rationale: גּוֹי chỉ một dân hay dân tộc. Giữ “trong” để phản ánh giới từ בְּ và cấu trúc liệt kê của nguyên văn.
theological_decisions:
- issue: 'Chủ thể của động từ נִפְרְדוּ: vùng duyên hải hay cư dân vùng duyên hải'
  choice: Giữ cách diễn đạt hình thức “các miền duyên hải của các dân tộc được phân chia”
  alternative: “các dân cư miền duyên hải tản ra”
  rationale: Nguyên văn đặt אִיֵּי הַגּוֹיִם làm chủ thể ngữ pháp. Hiểu đó là hoán dụ chỉ cư dân là khả dĩ, nhưng đưa thẳng “dân cư” và “tản ra” vào chính văn sẽ giải quyết một sự mơ hồ mà tiếng Hê-bơ-rơ vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu nhưng giữ cấu trúc địa lý-dân tộc của nguyên văn cùng sự mơ hồ thật sự về việc các vùng đất hay cư dân của chúng được phân chia. “Thị tộc” được dùng thay cho “gia đình” để tránh gợi nghĩa gia đình hạt nhân hiện đại.
