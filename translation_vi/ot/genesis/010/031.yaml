  to: Đó là các con trai của Sem[a], theo các thị tộc của họ, theo các ngôn ngữ của họ, trong các vùng đất của họ, theo các dân tộc của họ.
  rationale: Bản sửa bổ sung rõ ràng các hậu tố sở hữu “của họ” có mặt trong nguyên văn, giữ nhịp lặp phân loại của các giới từ, và thay “đất đai” bằng “các vùng đất” để tiếng Việt hiện đại tự nhiên hơn mà không thu hẹp nghĩa của אַרֶץ thành quốc gia hiện đại.
