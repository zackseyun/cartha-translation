  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: vi
  text: Đó là các con trai của Sem[a], theo các thị tộc của họ, theo các ngôn ngữ của họ, trong các vùng đất của họ, theo các dân tộc của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo thị tộc của họ ... theo ngôn ngữ của họ ... theo dân tộc của họ.” Tiếng Hê-bơ-rơ lặp lại các giới từ để biểu thị sự phân loại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Mở đầu câu tổng kết bằng đại từ chỉ định; tiếng Việt cần thêm hệ từ để câu tự nhiên.
- source_word: בְנֵי
  choice: các con trai của
  rationale: Giữ cách diễn đạt gia phả theo dòng nam của tiếng Hê-bơ-rơ, thay vì mở rộng thành “hậu duệ”.
- source_word: שֵׁם
  choice: Sem
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc
  rationale: מִשְׁפָּחָה trong ngữ cảnh bộ tộc-gia phả chỉ nhóm thân tộc; לְ mang ý phân loại, được diễn đạt tự nhiên bằng “theo từng”.
- source_word: לִלְשֹׁנֹתָם
  choice: theo từng ngôn ngữ
  rationale: לָשׁוֹן theo nghĩa đen là “lưỡi”, nhưng ở đây chỉ ngôn ngữ của các nhóm người; “ngôn ngữ” rõ ràng trong tiếng Việt hiện đại.
- source_word: בְּאַרְצֹתָם
  choice: trong đất đai của họ
  rationale: Giữ giới từ chỉ nơi chốn בְּ và nghĩa địa lý rộng của אֶרֶץ, không áp đặt khái niệm quốc gia hiện đại.
- source_word: לְגוֹיֵהֶם
  choice: theo từng dân tộc
  rationale: גּוֹי ở đây là cộng đồng dân tộc; “theo từng” giữ chức năng phân loại của לְ và nhịp lặp trong nguyên văn.
