  terminology: Tên riêng “Cút” và “Nim-rốt” nhất quán với cách phiên âm Kinh Thánh tiếng Việt thông dụng. “Sinh” phù hợp cách diễn đạt gia phả. Các chú thích về phạm vi của גִּבּוֹר và אֶרֶץ hữu ích, không quyết định thay cho nguyên văn.
