  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: vi
  text: Cút sinh Nim-rốt; ông bắt đầu trở thành một người hùng mạnh trên đất.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người hùng mạnh” cũng có thể dịch là “dũng sĩ” hoặc “chiến binh.”
    reason: lexical_alternative
  - marker: b
    text: “Trên đất” cũng có thể hiểu là “trong xứ”; từ Hê-bơ-rơ có thể mang cả hai nghĩa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכּוּשׁ
  choice: Cút
  rationale: Liên từ וְ nối tiếp gia phả nên không nhất thiết phải diễn đạt riêng trong tiếng Việt; כּוּשׁ được phiên âm theo tên riêng quen dùng.
- source_word: יָלַד
  choice: sinh
  rationale: Trong văn cảnh gia phả, động từ này chỉ việc người cha sinh ra con; “sinh” tự nhiên, ngắn gọn và giữ đúng quan hệ phả hệ.
- source_word: נִמְרֹד
  choice: Nim-rốt
  rationale: Phiên âm tên riêng sang cách viết dễ đọc trong tiếng Việt.
- source_word: הוּא
  choice: ông
  rationale: Đại từ độc lập nối lại chủ thể Nim-rốt; “ông” phù hợp văn phong kể chuyện trang trọng và tự nhiên hơn lặp tên.
- source_word: הֵחֵל לִהְיוֹת
  choice: bắt đầu trở thành
  rationale: Phản ánh trực tiếp ý khởi đầu của cấu trúc động từ với nguyên mẫu, không thêm ý rằng Nim-rốt là người đầu tiên trong lịch sử đạt địa vị này.
- source_word: גִּבֹּר
  choice: một người hùng mạnh
  rationale: Giữ nghĩa rộng về sức mạnh và tầm vóc, không thu hẹp quá sớm thành “chiến binh” hay nâng thành “anh hùng” theo nghĩa đạo đức.
- source_word: בָּאָרֶץ
  choice: trên đất
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ được độ mở của אֶרֶץ giữa nghĩa “đất” và “xứ”.
theological_decisions:
- issue: Phạm vi nghĩa của אֶרֶץ
  choice: đất
  alternative: xứ
  rationale: Trong bảng các dân tộc, nghĩa rộng là hợp lý, nhưng từ Hê-bơ-rơ vẫn có thể chỉ một xứ hay vùng đất; bản dịch chính không thêm từ “toàn” để tránh quyết định quá mức.
- issue: Sắc thái của הֵחֵל לִהְיוֹת
  choice: bắt đầu trở thành
  alternative: là người đầu tiên trở thành
  rationale: Nguyên văn chắc chắn diễn đạt sự khởi đầu, nhưng không nhất thiết khẳng định thứ tự ưu tiên tuyệt đối; chọn cách dịch gần nguồn và bảo toàn độ căng giải nghĩa.
- issue: Phạm vi nghĩa của גִּבּוֹר
  choice: người hùng mạnh
  alternative: dũng sĩ; chiến binh
  rationale: Từ này có thể nói đến người mạnh, dũng sĩ, anh hùng hoặc chiến binh. Văn cảnh câu này chưa đủ để giới hạn nghĩa vào quân sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc gia phả ngắn gọn; tránh cách dịch “là người đầu tiên” vì có thể thêm một khẳng định mà nguyên văn không buộc phải có. Mọi dấu chú thích trong bản văn đều có chú thích tương ứng.
