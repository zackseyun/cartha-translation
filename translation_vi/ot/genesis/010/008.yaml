  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa cơ bản của nguyên văn: Cút là cha của Nim-rốt; đại từ nối lại Nim-rốt; הֵחֵל לִהְיוֹת được dịch sát là “bắt đầu trở thành”; và גִּבּוֹר được giữ theo nghĩa rộng, không áp đặt nghĩa quân sự. “Trên đất” diễn đạt tự nhiên cho bָּאָרֶץ trong khi chú thích bảo lưu khả năng “trong xứ.”'
