base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: vi
  text: người Pát-ru-sim, người Cát-lu-him—từ đó dân Phi-li-tin đi ra—, và người Cáp-tô-rim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “từ đó dân Phi-li-tin đi ra.” Câu Hê-bơ-rơ có thể được hiểu là liên hệ nguồn gốc của dân Phi-li-tin với người Cát-lu-him vừa được nhắc đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: người Pát-ru-sim
  rationale: Phiên âm tên dân tộc theo âm dạng Hê-bơ-rơ, dùng “người” để diễn đạt tự nhiên đây là một nhóm dân.
- source_word: כַּסְלֻחִים
  choice: người Cát-lu-him
  rationale: Đây là tên một dân tộc chưa được xác định chắc chắn ngoài Kinh Thánh; phiên âm giúp tránh gán cho tên này một ý nghĩa không có trong nguồn.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: từ đó … xuất phát
  rationale: Giữ nghĩa trạng từ “từ đó” và ý niệm đi ra từ một nơi hay nguồn gốc, đồng thời không diễn giải mạnh hơn thành quan hệ huyết thống trực tiếp.
- source_word: פְּלִשְׁתִּים
  choice: dân Phi-li-tin
  rationale: Dùng tên gọi quen thuộc trong tiếng Việt hiện đại; thêm “dân” để làm rõ đây là tên một cộng đồng.
- source_word: כַּפְתֹּרִים
  choice: người Cáp-tô-rim
  rationale: Phiên âm tên dân tộc liên hệ với Cáp-tô, theo cùng cách xử lý các tên dân trong câu.
- source_word: וְאֶת
  choice: và
  rationale: Trong danh sách gia phả, liên từ được thể hiện bằng “và”, còn dấu chỉ tân ngữ không cần dịch riêng trong tiếng Việt.
theological_decisions:
- issue: Sở chỉ của mệnh đề “từ đó dân Phi-li-tin xuất phát”
  choice: Giữ nguyên cách nói trạng từ “từ đó” và đặt mệnh đề ngay sau người Cát-lu-him.
  alternative: Diễn giải rõ thành “từ người Cát-lu-him mà dân Phi-li-tin phát sinh”.
  rationale: Trật tự câu khiến người Cát-lu-him là sở chỉ gần nhất và có thể là cách hiểu tự nhiên, nhưng nguyên văn dùng “từ đó” chứ không nói thẳng “từ họ”. Bản dịch vì thế giữ được cả mối liên hệ cú pháp gần và độ mơ hồ thật sự của câu.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và phù hợp với một danh sách gia phả. Các tên dân được phiên âm nhất quán, có từ “người” hoặc “dân” để người đọc tiếng Việt dễ nhận biết.
