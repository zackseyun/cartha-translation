source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: vi
  text: Còn Hê-be sinh được hai con trai. Tên một người là Phê-léc, vì trong thời ông, đất đã bị phân chia[a]; còn người anh/em trai của ông tên là Giốc-than.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xứ sở đã bị phân chia.” Từ Hê-bơ-rơ này có thể chỉ toàn thể mặt đất hoặc một vùng đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: Hai con trai được sinh ra cho Hê-be
  rationale: Giữ thể bị động của יֻלַּד và cấu trúc ‘cho Hê-be’, đồng thời diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: שֵׁם הָאֶחָד
  choice: Người con thứ nhất tên là
  rationale: Trong cặp hai người con, הָאֶחָד chỉ người này đối lại với người anh em được nêu sau; ‘người con thứ nhất’ là cách diễn đạt tiếng Việt tự nhiên mà không thêm thứ tự niên trưởng ngoài mạch kể.
- source_word: פֶּלֶג
  choice: Bê-léc
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: כִּי בְיָמָיו
  choice: vì vào thời người
  rationale: כִּי nêu lời giải thích cho tên gọi; בְיָמָיו là thành ngữ chỉ thời kỳ người ấy sống. Đại từ ‘người’ giữ văn phong trang trọng và quy chiếu về Bê-léc.
- source_word: נִפְלְגָה
  choice: đã bị phân chia
  rationale: Giữ ý bị động của thể Niphal và nghĩa căn bản ‘bị/chịu phân chia’; đồng thời bảo tồn liên hệ âm-nghĩa với tên Bê-léc ở mức có thể trong bản dịch.
- source_word: הָאָרֶץ
  choice: đất
  rationale: אֶרֶץ có thể chỉ toàn thể đất/địa cầu hoặc một vùng đất. ‘Đất’ giữ được phần nào độ mở nghĩa của nguyên ngữ; chú thích nêu rõ hai phạm vi khả dĩ.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: em trai người tên là Giốc-tan
  rationale: אָחִיו nghĩa là ‘anh/em trai của người’. Vì người con kia đã được giới thiệu trước trong cặp, ‘em trai’ tạo câu tiếng Việt tự nhiên, dù nguyên ngữ tự nó chỉ nói ‘anh/em’; điểm này được cân nhắc để tránh văn dịch cứng.
theological_decisions:
- issue: Phạm vi của הָאָרֶץ trong lời giải thích tên Bê-léc
  choice: đất
  alternative: mặt đất; xứ/đất đai
  rationale: Ngữ cảnh bảng các dân tộc có thể gợi phạm vi toàn địa cầu, nhưng danh từ Hê-bơ-rơ cũng có thể chỉ một vùng đất. Bản dịch không xác định cơ chế hay quy mô lịch sử của sự phân chia và giữ phương án ‘xứ/đất đai’ trong chú thích.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng các dạng tên quen thuộc Hê-be, Bê-léc và Giốc-tan. Cấu trúc bị động được giữ để phản ánh nguyên ngữ; chú thích bảo tồn sự mơ hồ thực sự của אֶרֶץ.
