  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: vi
  text: 'Ranh giới của dân Ca-na-an kéo dài từ Si-đôn, theo hướng Ghê-ra, đến tận Ga-xa; rồi theo hướng Sô-đôm, Gô-mô-rơ, Át-ma và Xê-bô-im, đến tận La-sa.[a]


    [a] Cũng có thể phiên âm là “Lê-sa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể phiên âm là “Lê-sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: kéo dài
  rationale: Trong công thức mô tả địa giới, động từ היה kết hợp với chủ ngữ גְּבוּל được diễn đạt tự nhiên trong tiếng Việt là “ranh giới ... kéo dài”, thay vì dịch máy móc là “và ... là”.
- source_word: גְּבוּל הַכְּנַעֲנִי
  choice: ranh giới của dân Ca-na-an
  rationale: גְּבוּל chỉ đường biên hay giới hạn lãnh thổ; danh từ chỉ dân tộc ở số ít được hiểu theo nghĩa tập thể, nên dịch là “dân Ca-na-an”.
- source_word: מִצִּידֹן
  choice: từ Si-đôn
  rationale: Giới từ מִן đánh dấu điểm khởi đầu; “Si-đôn” là cách phiên âm quen thuộc trong tiếng Việt.
- source_word: בֹּאֲכָה
  choice: theo hướng
  rationale: Thành ngữ địa lý này biểu thị hướng đi hoặc hướng kéo dài của đường biên. “Theo hướng” tự nhiên, súc tích và không biến lời mô tả thành mệnh lệnh trực tiếp cho người đọc.
- source_word: עַד
  choice: đến tận
  rationale: Trong công thức địa giới, עַד nêu điểm tận cùng; “đến tận” làm rõ phạm vi kéo dài.
- source_word: גְרָרָה / עַזָּה
  choice: Ghê-ra / Ga-xa
  rationale: Các địa danh được phiên âm theo lối Việt hóa thông dụng; hậu tố chỉ hướng trong גְרָרָה được thể hiện qua cụm “theo hướng”.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: Sô-đôm, Gô-mô-rơ, Át-ma và Xê-bô-im
  rationale: Giữ nguyên chuỗi địa danh xác định đường biên, đồng thời dùng dấu câu và liên từ tự nhiên trong tiếng Việt.
- source_word: לָשַׁע
  choice: La-sa
  rationale: “La-sa” phản ánh trực tiếp cách đọc Masoretic; biến thể “Lê-sa” được bảo lưu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc mô tả địa giới của nguyên văn nhưng dùng “kéo dài” và “theo hướng” để tiếng Việt tự nhiên. Dấu chú thích được đặt sau “La-sa”, đúng với địa danh có biến thể phiên âm.
