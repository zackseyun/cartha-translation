base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: vi
  text: Lúc đầu, vương quốc của ông gồm Ba-bên[a], Ê-réc, A-cát[b] và Can-nê, trong xứ Si-nê-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ba-bên cũng được gọi là Ba-by-lôn.
    reason: lexical_alternative
  - marker: b
    text: Ê-réc thường được đồng nhất với thành Uruk cổ; A-cát thường được đồng nhất với Akkad cổ.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי רֵאשִׁית מַמְלַכְתּוֹ
  choice: Vương quốc của ông lúc đầu gồm
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, thể hiện rằng các thành được liệt kê là phần khởi đầu hoặc phạm vi ban đầu của vương quốc, đồng thời không biến một thành nào thành thủ đô.
- source_word: בָּבֶל
  choice: Ba-bên
  rationale: Phiên âm tên riêng theo dạng Hê-bơ-rơ, giữ mối liên hệ văn chương với Sáng Thế Ký 11; chú thích nêu tên gọi Ba-by-lôn.
- source_word: אֶרֶךְ
  choice: Ê-réc
  rationale: Phiên âm tên địa danh theo dạng trong bản Hê-bơ-rơ; chú thích cho biết địa điểm này thường được đồng nhất với Uruk cổ.
- source_word: אַכַּד
  choice: A-cát
  rationale: Phiên âm tên riêng theo dạng Hê-bơ-rơ; chú thích nêu cách nhận diện lịch sử là Akkad.
- source_word: כַלְנֵה
  choice: Can-nê
  rationale: Phản ánh cách đọc כַלְנֵה của Bản Masoret mà không thay bằng một địa danh liên hệ ở chỗ khác.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: trong xứ Si-nê-a
  rationale: “Xứ” là cách diễn đạt tự nhiên, trang trọng cho אֶרֶץ trong một chỉ dẫn địa lý; Si-nê-a phiên âm tên Shinar.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “lúc đầu gồm” tránh lối dịch sát chữ thiếu tự nhiên, nhưng chú thích vẫn bảo lưu phạm vi nghĩa của רֵאשִׁית. Các địa danh được phiên âm nhất quán sang tiếng Việt.
