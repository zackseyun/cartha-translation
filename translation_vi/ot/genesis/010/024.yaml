  text: וְ/אַרְפַּכְשַׁ֖ד יָלַ֣ד אֶת שָׁ֑לַח וְ/שֶׁ֖לַח יָלַ֥ד אֶת עֵֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/024.yaml
  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: vi
  text: Ác-pác-sát sinh Sê-lách,[a] và Sê-lách sinh Ê-be.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Các bản dịch tiếng Anh truyền thống thường dùng các dạng tên “Ạc-pha-xát” và “Sa-lách,” phản ánh các dạng tên chịu ảnh hưởng của tiếng Hy Lạp; bản văn chính theo các dạng Hê-bơ-rơ “Ác-pác-sát” và “Sê-lách.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Ác-pác-sát
  rationale: Phiên âm tên riêng trực tiếp từ dạng Hê-bơ-rơ אַרְפַּכְשַׁד, theo cách viết dễ đọc đối với độc giả Việt; liên từ וְ không cần dịch riêng ở đầu câu tiếng Việt.
- source_word: יָלַד
  choice: sinh
  rationale: Trong gia phả, khi chủ ngữ là nam, יָלַד diễn tả việc người ấy sinh ra hoặc là cha của người kế tiếp. “Sinh” là lối diễn đạt gia phả ngắn gọn, tự nhiên trong tiếng Việt và không buộc văn bản phải nói rõ mức độ trực tiếp của quan hệ thế hệ.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ xác định trong tiếng Hê-bơ-rơ, không có từ tương đương độc lập cần thể hiện trong tiếng Việt.
- source_word: שָׁלַח / שֶׁלַח
  choice: Sê-lách
  rationale: Phiên âm theo dạng Hê-bơ-rơ trong câu, thay vì dùng dạng truyền thống chịu ảnh hưởng Hy Lạp.
- source_word: וְ/שֶׁלַח
  choice: và Sê-lách
  rationale: Dịch וְ là “và” và giữ nhất quán cách phiên âm tên שֶׁלַח.
- source_word: עֵבֶר
  choice: Ê-be
  rationale: Phiên âm tên riêng עֵבֶר theo âm Hê-bơ-rơ ở mức tự nhiên, dễ đọc trong tiếng Việt; phụ âm đầu ayin không có âm tương đương trực tiếp trong tiếng Việt.
theological_decisions:
- issue: Mức độ trực tiếp của quan hệ gia phả trong động từ יָלַד
  choice: Giữ cách nói “sinh” ngắn gọn của gia phả
  alternative: “là cha của” hoặc “sinh ra”
  rationale: Cách dịch không thêm nhận định rằng mọi mắt xích gia phả nhất thiết phải là quan hệ cha–con trực tiếp, đồng thời vẫn phản ánh công thức Hê-bơ-rơ.
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và hiện đại. Các tên riêng được phiên âm từ tiếng Hê-bơ-rơ và dùng dấu gạch nối để độc giả Việt dễ nhận biết từng âm tiết.
