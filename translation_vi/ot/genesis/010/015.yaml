  yaml_path: translation/ot/genesis/010/015.yaml
  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: vi
  text: Ca-na-an sinh Si-đôn, con trai đầu lòng của ông, và Hết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hết là tổ phụ gắn với người Hê-tít trong bảng gia phả này.
    reason: Đối chiếu văn cảnh gia phả và giải thích mối liên hệ dân tộc.
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Ca-na-an
  rationale: Liên từ ו được thể hiện tự nhiên qua sự tiếp nối của câu gia phả; כנען được phiên âm theo cách gọi tên quen thuộc trong tiếng Việt.
- source_word: יָלַד
  choice: sinh
  rationale: Trong văn cảnh gia phả, động từ ילד chỉ việc sinh ra hoặc làm cha của hậu duệ; “sinh” ngắn gọn, tự nhiên và vẫn giữ quan hệ trực hệ.
- source_word: אֶת
  choice: '[không dịch]'
  rationale: Dấu hiệu chỉ định tân ngữ trực tiếp trong tiếng Hê-bơ-rơ không có từ tương ứng cần biểu đạt trong tiếng Việt.
- source_word: צִידֹן
  choice: Si-đôn
  rationale: Tên riêng được phiên âm theo cách đọc phổ biến trong truyền thống Kinh Thánh tiếng Việt.
- source_word: בְּכֹר/וֹ
  choice: con trưởng nam của mình
  rationale: Danh từ בְּכוֹר kèm hậu tố ngôi ba số ít giống đực xác định Si-đôn là con đầu lòng của Ca-na-an; “con trưởng nam” làm rõ giới tính vốn hiển nhiên từ nhân vật nam trong gia phả.
- source_word: וְ/אֶת
  choice: và
  rationale: Liên từ mở đầu tân ngữ thứ hai; dấu hiệu tân ngữ אֶת không cần dịch riêng.
- source_word: חֵת
  choice: Hếch
  rationale: Giữ đây là tên riêng, không đưa thông tin giải thích về người Hê-tít vào chính văn.
