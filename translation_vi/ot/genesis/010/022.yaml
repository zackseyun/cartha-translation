  text: בְּנֵ֥י שֵׁ֖ם עֵילָ֣ם וְ/אַשּׁ֑וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֥וּד וַֽ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: vi
  text: 'Các con trai của Sem là: Ê-lam, A-sua[a], A-rơ-pác-sát, Lút và A-ram.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên A-sua về sau thường gắn với vùng đất và dân tộc A-si-ri.
    reason: cultural_note
  - marker: b
    text: Tên A-ram về sau thường gắn với các vùng đất và dân tộc A-ram; tên này cũng có liên hệ với vùng thường được gọi là Sy-ri.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Giữ sát danh từ số nhiều ở dạng liên kết và khuôn khổ nam hệ của bảng gia phả; không mở rộng thành “con cháu”.
- source_word: שֵׁם
  choice: Sem
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: עֵילָם
  choice: Ê-lam
  rationale: Phiên âm tên riêng theo âm Hebrew, đồng thời phù hợp lối ghi tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: אַשּׁוּר
  choice: A-sua
  rationale: Phiên âm tên riêng Asshur thay vì diễn giải thành tên vùng hoặc dân tộc “A-si-ri” trong danh sách gia phả.
- source_word: אַרְפַּכְשַׁד
  choice: Ạc-pác-sát
  rationale: Phiên âm dựa trực tiếp trên dạng Hebrew, không theo dạng chịu ảnh hưởng Hy Lạp Arphaxad.
- source_word: לוּד
  choice: Lút
  rationale: Giữ dạng số ít của tên riêng Hebrew; không thay bằng Ludim, vốn là một dạng khác.
- source_word: אֲרָם
  choice: A-ram
  rationale: Phiên âm tên Hebrew, không đồng nhất hóa với địa danh hậu kỳ “Sy-ri”.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và dễ hiểu. Các tên riêng được phiên âm theo Hebrew bằng dạng Việt hóa, có gạch nối để dễ đọc; chú thích chỉ nêu liên hệ lịch sử-địa lý mà không biến tên người trong cấu trúc gia phả thành địa danh.
