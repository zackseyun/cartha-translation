revisions:
- from: 'Các con trai của Sem là: Ê-lam, A-sua[a], Ạc-pác-sát, Lút và A-ram.[b]'
  to: 'Các con trai của Sem là: Ê-lam, A-sua[a], A-rơ-pác-sát, Lút và A-ram.[b]'
  rationale: Chỉ điều chỉnh tên A-rơ-pác-sát để bảo lưu phụ âm r của dạng Hê-bơ-rơ, và làm dè dặt chú thích lịch sử về A-ram/Sy-ri. Thứ tự, cấu trúc “các con trai,” và việc dùng các tên riêng thay vì địa danh đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:03:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Câu dịch giữ đúng cấu trúc gia phả của tiếng Hê-bơ-rơ: “các con trai của Sem” và năm tên theo đúng thứ tự. Tuy nhiên, cách phiên âm “Ạc-pác-sát” không phản ánh đầy đủ phụ âm r có trong אַרְפַּכְשַׁד (ʾArpakhshad).'
  naturalness: Cú pháp “Các con trai của Sem là:” ngắn gọn, tự nhiên và phù hợp văn phong gia phả. Dạng tên có gạch nối nhất quán, dễ đọc trong tiếng Việt.
  terminology: “Sem,” “Ê-lam,” “A-sua,” “Lút,” và “A-ram” được dùng nhất quán như tên riêng, không chuyển thành các địa danh/dân tộc hậu kỳ. Chú thích về A-ram nên tránh phát biểu rằng chính dân A-ram “đôi khi được gọi là Sy-ri”; đây là quan hệ lịch sử-địa lý phức tạp hơn và không cần thiết cho câu.
  issues:
  - severity: medium
    issue: Tên “Ạc-pác-sát” bỏ mất phụ âm r của tên Hê-bơ-rơ אַרְפַּכְשַׁד.
    rationale: Dạng nguồn bắt đầu bằng ʾar-, không phải ʾa-. Cần một dạng phiên âm có yếu tố “r” để không làm biến đổi tên riêng.
  - severity: low
    issue: Chú thích b diễn đạt liên hệ giữa A-ram và Sy-ri quá trực tiếp.
    rationale: A-ram là tên riêng trong gia phả; về sau tên này liên hệ với các vùng và dân Aram, trong khi “Sy-ri” là cách gọi địa lý/hậu kỳ có phạm vi và lịch sử sử dụng không hoàn toàn đồng nhất. Có thể nêu liên hệ vùng miền một cách dè dặt.
  revised_text: 'Các con trai của Sem là: Ê-lam, A-sua[a], A-rơ-pác-sát, Lút và A-ram.[b]'
  revised_footnotes:
