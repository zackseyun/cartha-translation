  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: vi
  text: 'Ông là một thợ săn dũng mãnh trước mặt Yahweh; vì thế có câu rằng[a]: “Như Nim-rốt, một thợ săn dũng mãnh trước mặt Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu: “chống lại Yahweh,” nếu cụm từ này được dùng theo nghĩa thù nghịch dựa trên ngữ cảnh rộng hơn.'
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: một thợ săn dũng mãnh
  rationale: Cụm Hê-bơ-rơ mô tả một người có tài năng và sức mạnh nổi bật trong việc săn bắn. Cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái mạnh mẽ của גִבֹּר.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Giữ nghĩa không gian/quan hệ cơ bản là “trước, trong sự hiện diện của”, đồng thời không quyết định thay cho độc giả liệu cụm từ có hàm ý đối nghịch hay không.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: עַל כֵּן יֵאָמַר
  choice: vì thế có câu rằng
  rationale: Diễn đạt tự nhiên công thức dẫn vào một câu nói lưu truyền, đồng thời phản ánh quan hệ kết quả của עַל כֵּן và thể bị động vô nhân xưng יֵאָמַר.
- source_word: כְּנִמְרֹד
  choice: Như Nim-rốt
  rationale: Tiền tố כְּ đánh dấu sự so sánh; “như” là cách diễn đạt gọn và tự nhiên trong câu tục truyền.
theological_decisions:
- issue: Sắc thái của לִפְנֵי יְהוָה khi nói về Nim-rốt
  choice: trước mặt Yahweh
  alternative: chống lại Yahweh
  rationale: Nghĩa trực tiếp của לִפְנֵי là “trước mặt/trong sự hiện diện của”. Ngữ cảnh rộng hơn có thể khiến một số người hiểu theo sắc thái thù nghịch, nhưng bản văn không nói rõ; vì vậy bản chính giữ sự mơ hồ và chú thích nêu cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Nim-rốt” dùng dạng phiên âm quen thuộc trong tiếng Việt; dấu hai chấm sau “rằng” dẫn vào câu nói được trích.
