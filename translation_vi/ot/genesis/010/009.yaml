  terminology: “Yahweh” nhất quán với quyết định dịch danh riêng יהוה. “Nim-rốt” là dạng phiên âm quen thuộc và dễ nhận diện trong tiếng Việt. “Trước mặt Yahweh” giữ được tính mơ hồ cần thiết của cụm từ nguồn.
