  text: וְ/אֶת הַ/יְבוּסִי֙ וְ/אֶת הָ֣/אֱמֹרִ֔י וְ/אֵ֖ת הַ/גִּרְגָּשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/016.yaml
  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: vi
  text: và người Giê-bu-sít[a], người A-mô-rít, cùng người Ghi-rê-ga-sít.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ, các tên dân tộc ở câu này đều có hình thức số ít (“người Giê-bu-sít,” “người A-mô-rít,” “người Ghi-rê-ga-sít”), nhưng trong bảng gia phả này chúng được dùng theo nghĩa tập thể để chỉ các dân tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: người Giê-bu-sít
  rationale: Danh từ chỉ dân tộc ở dạng số ít có mạo từ nhưng mang nghĩa tập thể trong bảng các dân tộc; tiếng Việt tự nhiên dùng “người” để chỉ cả một dân tộc mà không cần đánh dấu số nhiều.
- source_word: הָאֱמֹרִי
  choice: người A-mô-rít
  rationale: Dạng chỉ dân tộc số ít được hiểu theo nghĩa tập thể, chỉ dân A-mô-rít.
- source_word: הַגִּרְגָּשִׁי
  choice: người Ghi-rê-ga-sít
  rationale: Dạng chỉ dân tộc số ít được dùng theo nghĩa tập thể; cách phiên âm này rõ ràng và phù hợp với tiếng Việt hiện đại.
- source_word: וְאֶת / וְאֵת
  choice: và …, …, cùng …
  rationale: ו nối các mục trong danh sách, còn אֵת là dấu hiệu tân ngữ xác định nên không dịch riêng. Biến đổi nhẹ liên từ giúp câu liệt kê tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên. Giữ cấu trúc một phần của danh sách tiếp nối câu trước; dùng “người” theo nghĩa tập thể, vốn không phân biệt số ít và số nhiều trong tiếng Việt.
