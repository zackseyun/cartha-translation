source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: vi
  text: 'Đây là dòng dõi[a] của các con trai Nô-ê: Sem, Cham và Gia-phết. Sau trận lụt, họ có các con trai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Đây là hậu duệ của các con trai Nô-ê.” Từ Hê-bơ-rơ dùng làm tiêu đề ở đây có thể chỉ dòng dõi, các thế hệ, hoặc rộng hơn là những gì phát xuất từ một người.'
    reason: Bảo lưu phạm vi nghĩa của công thức tiêu đề תּוֹלְדֹת.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Cụm này mở đầu một phần mới trong trình thuật. “Đây là” tự nhiên trong tiếng Việt và không thêm một ý nghĩa thời gian vốn không có trong nguyên văn.
- source_word: תּוֹלְדֹת
  choice: dòng dõi
  rationale: Đây là công thức tiêu đề lặp lại trong sách Sáng Thế. “Dòng dõi” vừa tự nhiên, trang trọng, vừa giữ được ý niệm về thế hệ và những gì phát xuất từ một người; chú thích ghi nhận nghĩa rộng hơn của từ này.
- source_word: בְּנֵי נֹחַ
  choice: các con trai Nô-ê
  rationale: Phản ánh trực tiếp kết cấu sở hữu của nguyên văn và giữ rõ nghĩa giống đực của בְּנֵי.
- source_word: שֵׁם חָם וָיָפֶת
  choice: Sem, Cham và Gia-phết
  rationale: Dùng các dạng tên riêng quen thuộc, dễ nhận biết trong tiếng Việt hiện đại.
- source_word: וַיִּוָּלְדוּ לָהֶם בָּנִים
  choice: họ sinh được những người con trai
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “các con trai được sinh ra cho họ”, đồng thời giữ cả ý sinh ra và đối tượng là con trai.
- source_word: אַחַר הַמַּבּוּל
  choice: sau trận lụt
  rationale: Diễn đạt rõ mốc thời gian sau biến cố lụt lớn đã được thuật lại trong văn cảnh.
theological_decisions:
- issue: Cách dịch công thức תּוֹלְדֹת trong sách Sáng Thế
  choice: dòng dõi
  alternative: gia phả; câu chuyện về hậu duệ
  rationale: “Dòng dõi” giữ mối liên hệ với cấu trúc gia hệ của sách mà không thu hẹp công thức này thành một danh sách tên đơn thuần. Chú thích bảo lưu độ rộng nghĩa của tiếng Hê-bơ-rơ.
- issue: Từ giống đực בָּנִים
  choice: những người con trai
  alternative: con cái
  rationale: Nguyên văn nói rõ đến các con trai, và phần gia hệ tiếp theo nêu các hậu duệ nam; vì vậy không trung tính hóa thành “con cái”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu thứ hai được chuyển sang cấu trúc chủ động tự nhiên trong tiếng Việt thay vì giữ lối bị động gượng gạo “được sinh ra cho họ”.
