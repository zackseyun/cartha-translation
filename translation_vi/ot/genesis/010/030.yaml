- from: Địa bàn cư trú của họ trải từ Mê-sa đến Sê-pha[a], vùng núi phía đông.
  to: Địa bàn cư trú của họ trải từ Mê-sa về phía Sê-pha[a], vùng núi ở phía đông.
  rationale: Đổi «đến Sê-pha» thành «về phía Sê-pha» để bảo toàn sắc thái hướng của nguyên ngữ. Giữ «vùng núi ở phía đông» trong bản chính vì tự nhiên trong tiếng Việt và phù hợp với nghĩa địa lý của הַר; chú thích cung cấp phương án số ít mà không áp đặt một cách xác định địa điểm đang được tranh luận.
