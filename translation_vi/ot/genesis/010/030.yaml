  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: vi
  text: Địa bàn cư trú của họ trải từ Mê-sa về phía Sê-pha[a], vùng núi ở phía đông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nơi cư ngụ của họ là từ Mê-sa, theo hướng Sê-pha, ngọn núi ở phía đông.”'
    reason: Cụm chỉ hướng בֹּאֲכָה có thể được dịch là “theo hướng”; הַר có thể chỉ một ngọn núi hoặc một vùng núi trong mô tả địa lý.
lexical_decisions:
- source_word: וַיְהִי
  choice: trải
  rationale: Trong câu mô tả địa giới này, động từ היה kết hợp với các cụm chỉ phương hướng được diễn đạt tự nhiên bằng “trải”, cho biết phạm vi địa bàn cư trú mà không làm thay đổi nội dung địa lý.
- source_word: מוֹשָׁבָם
  choice: địa bàn cư trú của họ
  rationale: מוֹשָׁבָם chỉ nơi hoặc vùng họ sinh sống; “địa bàn cư trú” phù hợp với ngữ cảnh địa lý của bảng liệt kê các dân tộc.
- source_word: מִמֵּשָׁא
  choice: từ Mê-sa
  rationale: Giữ đây là địa danh và phiên âm theo cách dễ đọc trong tiếng Việt.
- source_word: בֹּאֲכָה
  choice: đến
  rationale: Trong công thức địa lý, dạng của בוא chỉ hướng tiến về một địa điểm. “Đến” diễn đạt gọn và tự nhiên ranh giới kéo từ Mê-sa về phía Sê-pha.
- source_word: סְפָרָה
  choice: Sê-pha
  rationale: Phiên âm địa danh; hậu tố chỉ hướng trong tiếng Hê-bơ-rơ đã được thể hiện qua từ “đến”.
- source_word: הַר
  choice: vùng núi
  rationale: Trong lời mô tả địa lý, הַר có thể chỉ một miền núi chứ không nhất thiết một ngọn núi riêng lẻ.
- source_word: הַקֶּדֶם
  choice: phía đông
  rationale: קֶדֶם ở đây chỉ phương đông hoặc miền đông; “vùng núi phía đông” là cách diễn đạt tự nhiên và vẫn giữ phạm vi nghĩa.
