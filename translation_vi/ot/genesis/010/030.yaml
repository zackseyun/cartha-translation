    rationale: Nên nêu ngắn gọn phương án «nơi cư ngụ… theo hướng… ngọn núi ở phía đông», vừa phản ánh các lựa chọn từ vựng vừa không quyết định dứt khoát giữa núi đơn lẻ và vùng núi.
