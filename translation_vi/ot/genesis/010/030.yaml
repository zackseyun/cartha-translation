    rationale: Cụm bōʾăkāh Səfārāh trong công thức địa lý chỉ hướng đi/tiến về Sê-pha. «Về phía Sê-pha» bảo toàn sắc thái này tốt hơn, không biến Sê-pha thành ranh giới cuối được xác định dứt khoát.
  - severity: low
