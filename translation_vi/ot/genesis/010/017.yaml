  text: người Hê-vi,[a] người A-rơ-ki và người Si-ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch cả ba danh xưng là “thị tộc Hê-vi, thị tộc A-rơ-ki và thị tộc Si-ni.” Tiếng Hê-bơ-rơ dùng các danh từ chỉ dân tộc ở dạng số ít có mạo từ, nhưng mang nghĩa tập thể, chỉ các dân hoặc thị tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: và
  rationale: Trong danh sách gia phả này, וְ nối thêm một thành phần, còn אֶת là dấu hiệu chỉ tân ngữ và không cần dịch riêng trong tiếng Việt.
- source_word: הַחִוִּי
  choice: người Hê-vi
  rationale: Danh xưng dân tộc ở dạng số ít có mạo từ nhưng mang nghĩa tập thể; cách nói “người Hê-vi” tự nhiên trong tiếng Việt và chỉ cả một cộng đồng.
- source_word: הָעַרְקִי
  choice: người Ạt-ki
  rationale: Đây là tên gọi cư dân hoặc hậu duệ gắn với Arqa; phiên âm “Ạt-ki” giữ tính chất tên riêng và phù hợp với lối liệt kê các dân tộc.
- source_word: הַסִּינִי
  choice: người Si-ni
  rationale: Đây là danh xưng dân tộc trong danh sách các nhóm người Ca-na-an; “người Si-ni” truyền đạt nghĩa tập thể mà không biến tên riêng thành địa danh.
