base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/006.yaml
  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: vi
  text: 'Các con trai của Ham là: Cút, Mích-ra-im[a], Phút[b] và Ca-na-an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hê-bơ-rơ là “Mích-ra-im”; nhiều bản dịch dịch tên này là “Ai Cập”. Trong gia phả này, từ ấy được dùng như tên của một người tổ tiên.
    reason: alternative_reading
  - marker: b
    text: Tên “Phút” cũng có thể được phiên âm là “Pút”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Các con trai của
  rationale: Giữ cách diễn đạt gia phả sát với dạng số nhiều liên kết của tiếng Hê-bơ-rơ; lược dịch liên từ mở đầu ו vì câu tiếng Việt vẫn nối tiếp tự nhiên trong danh sách.
- source_word: חָם
  choice: Ham
  rationale: Phiên âm tên riêng theo hình thức quen thuộc trong tiếng Việt.
- source_word: כּוּשׁ
  choice: Cút
  rationale: Dùng hình thức tên riêng quen thuộc trong Kinh Thánh tiếng Việt, tương ứng với âm Hê-bơ-rơ כּוּשׁ.
- source_word: וּ/מִצְרַיִם
  choice: Mích-ra-im
  rationale: Phiên âm như tên một tổ phụ trong gia phả, thay vì dịch thành tên quốc gia “Ai Cập”; đồng thời giữ liên từ trong cấu trúc liệt kê tiếng Việt qua dấu câu và từ nối cuối danh sách.
- source_word: וּ/פוּט
  choice: Phút
  rationale: Dùng hình thức phiên âm quen thuộc trong tiếng Việt cho tên riêng פוּט.
- source_word: וּ/כְנָעַן
  choice: và Ca-na-an
  rationale: Dùng tên gọi Kinh Thánh tiếng Việt quen thuộc và thể hiện liên từ ו trước mục cuối bằng “và”.
