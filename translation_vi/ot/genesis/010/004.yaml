source:
  edition: WLC
  text: וּ/בְנֵ֥י יָוָ֖ן אֱלִישָׁ֣ה וְ/תַרְשִׁ֑ישׁ כִּתִּ֖ים וְ/דֹדָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/004.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Dodanim.'
translation:
  language: vi
  text: Các con trai của Gia-van là Ê-li-sa, Ta-rê-si, Kít-tim và Đô-đa-nim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản và 1 Sử Ký 1:7 chép “Rô-đa-nim” thay cho “Đô-đa-nim”.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Các con trai của
  rationale: Giữ sát dạng phả hệ của danh từ số nhiều ở trạng thái liên kết בְּנֵי (‘các con trai của’), thay vì diễn giải rộng thành ‘các hậu duệ của’.
- source_word: יָוָן
  choice: Gia-van
  rationale: Phiên âm tên riêng theo cách dễ đọc trong tiếng Việt hiện đại, không chuyển thành tên một dân tộc theo lối diễn giải.
- source_word: אֱלִישָׁה
  choice: Ê-li-sa
  rationale: Phiên âm tên riêng/địa danh trong bảng các dân tộc, giữ hình thức tên thay vì giải nghĩa.
- source_word: וְ/תַרְשִׁישׁ
  choice: Ta-rê-si
  rationale: Phiên âm tên riêng, có thể chỉ địa danh hoặc dân tộc; không quyết định ý nghĩa vốn chưa chắc chắn.
- source_word: כִּתִּים
  choice: Kít-tim
  rationale: Phiên âm tên dân/địa danh ở dạng số nhiều của tiếng Hê-bơ-rơ, theo hình thức quen đọc trong tiếng Việt.
- source_word: וְ/דֹדָנִים
  choice: Đô-đa-nim
  rationale: Bản văn Masoret WLC đọc דֹדָנִים, nên bản chính theo ‘Đô-đa-nim’; dị bản ‘Rô-đa-nim’ được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, tự nhiên và ngắn gọn, phù hợp cấu trúc một danh sách phả hệ. Thêm từ nối ‘là’ để câu tiếng Việt trôi chảy, trong khi vẫn giữ cấu trúc và thứ tự của nguyên văn. Dấu chú thích được đặt ngay sau tên có dị bản.
