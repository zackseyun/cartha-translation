  text: וְ/אֶת אוֹפִ֥ר וְ/אֶת חֲוִילָ֖ה וְ/אֶת יוֹבָ֑ב כָּל אֵ֖לֶּה בְּנֵ֥י יָקְטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/029.yaml
  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: vi
  text: Ô-phia, Ha-vi-la và Giô-báp. Tất cả những người này đều là con trai[a] của Giốc-tan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hậu duệ của Giốc-tan.” Trong các gia phả, từ Hê-bơ-rơ được dịch là “con trai” đôi khi có nghĩa rộng hơn; nhưng ở đây, cách hiểu tự nhiên nhất là những người con trai vừa được kể tên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: và; lược bỏ tiểu từ chỉ tân ngữ
  rationale: אֵת lặp lại để đánh dấu từng tên là tân ngữ trong danh sách tiếp nối từ câu trước; tiếng Việt không cần biểu đạt tiểu từ này. Liên từ וְ được thể hiện tự nhiên bằng “và” trước tên cuối.
- source_word: אוֹפִר
  choice: Ô-phia
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: חֲוִילָה
  choice: Ha-vi-la
  rationale: Tên riêng được phiên âm sang tiếng Việt, không dịch nghĩa.
- source_word: יוֹבָב
  choice: Giô-báp
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: כָּל אֵלֶּה
  choice: Tất cả những người này
  rationale: Cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt để tổng kết danh sách những người vừa nêu.
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Trong gia phả, từ này đôi khi có nghĩa rộng là hậu duệ, nhưng ở đây ngữ cảnh trực tiếp liệt kê các con trai mang tên riêng; bản dịch giữ nghĩa cụ thể nhất.
- source_word: יָקְטָן
  choice: Giốc-tan
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc danh sách ngắn gọn của nguyên văn; dùng “đều là” để câu tổng kết tự nhiên trong tiếng Việt. Dấu chú thích được đặt sau mệnh đề có từ ngữ cần giải thích.
