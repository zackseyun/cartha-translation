base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: vi
  text: cùng người A-vát, người Xê-ma và người Ha-mát. Sau đó, các thị tộc của dân Ca-na-an[a] phân tán ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng danh từ chỉ dân tộc ở số ít (“người Ca-na-an”) theo nghĩa tập thể, để nói về toàn thể dân này.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: người Át-vát
  rationale: Danh từ chỉ dân tộc ở dạng số ít được dùng theo nghĩa tập thể; cách dịch này chỉ dân cư của Át-vát và tự nhiên trong tiếng Việt.
- source_word: הַצְּמָרִי
  choice: người Xê-ma
  rationale: Đây là danh từ chỉ dân tộc mang nghĩa tập thể trong danh sách các nhóm dân; “người Xê-ma” diễn đạt rõ nhóm người gắn với Xê-ma.
- source_word: הַחֲמָתִי
  choice: người Ha-mát
  rationale: Dạng chỉ dân tộc số ít được hiểu theo nghĩa tập thể; “người Ha-mát” là cách diễn đạt tự nhiên cho dân cư Ha-mát.
- source_word: וְאַחַר
  choice: Sau đó
  rationale: Giữ rõ quan hệ thời gian với những nhóm vừa được liệt kê mà không làm câu tiếng Việt nặng nề.
- source_word: נָפֹצוּ
  choice: phân tán ra
  rationale: Dạng Niphal diễn tả sự phân tán; lựa chọn này giữ được sắc thái kết quả nhưng không xác định tác nhân khi nguyên văn không nêu.
- source_word: מִשְׁפְּחוֹת
  choice: các thị tộc
  rationale: Trong văn cảnh phả hệ–dân tộc học, từ này chỉ những nhóm thân tộc rộng hơn gia đình hạt nhân; “thị tộc” phù hợp hơn “gia đình”.
- source_word: הַכְּנַעֲנִי
  choice: dân Ca-na-an
  rationale: Tuy về hình thái là danh từ chỉ dân tộc số ít có mạo từ, từ này mang nghĩa tập thể, chỉ toàn thể dân Ca-na-an.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thị tộc” để phản ánh bối cảnh Bảng Các Dân Tộc; các tên dân được diễn đạt bằng “người” cộng với địa danh nhằm tránh những dạng phiên âm hậu tố dân tộc thiếu tự nhiên trong tiếng Việt.
