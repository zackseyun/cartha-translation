  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng ba tộc danh tập thể, trình tự thời gian của וְאַחַר, và ý nghĩa phân tán của dạng Niphal נָפֹצוּ. “Các thị tộc” phù hợp với מִשְׁפְּחוֹת trong văn mạch Bảng Các Dân Tộc. Tuy nhiên, tên Át-vát không phải dạng phiên âm Việt ngữ thông dụng cho Arvad trong truyền thống Kinh Thánh tiếng Việt; nên chuẩn hóa là A-vát.
  naturalness: Câu văn hiện đại, rõ ràng và giữ được tính liên kết với danh sách ở câu trước qua “cùng”. “Phân tán ra” là tự nhiên và không thêm một tác nhân mà nguyên văn không nêu.
  terminology: “Thị tộc” là lựa chọn thích hợp hơn “gia đình” cho các nhóm thân tộc/dòng tộc rộng. “Dân Ca-na-an” diễn đạt đúng danh từ chỉ dân tộc số ít mang nghĩa tập thể. Ghi chú cần nói rõ đây là dạng số ít tập thể, không hàm ý chỉ một cá nhân.
