source:
  edition: WLC
  text: וְ/יָקְטָ֣ן יָלַ֔ד אֶת אַלְמוֹדָ֖ד וְ/אֶת שָׁ֑לֶף וְ/אֶת חֲצַרְמָ֖וֶת וְ/אֶת יָֽרַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/026.yaml
  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: vi
  text: Giốc-tan sinh Almô-đát, Sê-lép, Hát-sa-ma-vết và Giê-rách.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ lặp lại từ “và” trước mỗi tên: “Giốc-tan sinh Almô-đát, và Sê-lép, và Hát-sa-ma-vết, và Giê-rách.”'
    reason: Giải thích việc làm mượt phép nối lặp trong bản dịch tiếng Việt.
lexical_decisions:
- source_word: וְיָקְטָן
  choice: Giốc-tan
  rationale: Tên riêng được phiên âm theo lối quen thuộc, dễ đọc trong tiếng Việt; liên từ mở đầu được lược vì câu đứng riêng không cần nối rõ với câu trước.
- source_word: יָלַד
  choice: sinh
  rationale: Trong gia phả, động từ này nói về việc người nam sinh ra hoặc trở thành tổ phụ của những người được kể tên; “sinh” ngắn gọn, tự nhiên và không xác định quá mức quan hệ thế hệ.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Dấu hiệu chỉ tân ngữ xác định trong tiếng Hê-bơ-rơ không có từ tương ứng riêng trong tiếng Việt; chức năng được thể hiện qua trật tự câu.
- source_word: אַלְמוֹדָד
  choice: Almô-đát
  rationale: Tên riêng được phiên âm để gần âm Hê-bơ-rơ và dễ đọc trong tiếng Việt.
- source_word: שָׁלֶף
  choice: Sê-lép
  rationale: Tên riêng được phiên âm theo cách đọc Hê-bơ-rơ, với phụ âm cuối được thể hiện bằng “p” theo chính tả tiếng Việt.
- source_word: חֲצַרְמָוֶת
  choice: Hát-sa-ma-vết
  rationale: Tên riêng được phiên âm gần âm nguồn; cách viết có gạch nối giúp độc giả tiếng Việt nhận rõ các âm tiết.
- source_word: יָרַח
  choice: Giê-rách
  rationale: Tên riêng được phiên âm gần cách đọc Hê-bơ-rơ; phụ âm cuối ח được biểu thị gần đúng bằng “ch”.
theological_decisions:
- issue: Phạm vi quan hệ gia phả của יָלַד
  choice: Dùng “sinh”
  alternative: “là cha của” hoặc “sinh ra”
  rationale: “Sinh” giữ cách nói gia phả súc tích và không buộc phải hiểu rằng tất cả các tên đều nhất thiết là con trực tiếp, dù đó vẫn là cách hiểu tự nhiên.
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và dễ hiểu. Các tên riêng được phiên âm theo âm Hê-bơ-rơ thay vì sao chép dạng tiếng Anh; dấu gạch nối hỗ trợ cách đọc tiếng Việt. Phép lặp liên từ của nguyên văn được làm mượt trong câu chính và ghi rõ ở chú thích.
