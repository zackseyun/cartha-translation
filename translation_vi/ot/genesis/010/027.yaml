  terminology: Các tên riêng nên được xử lý nhất quán và gần nguyên ngữ. Ha-đô-ram và Đích-la có thể giữ theo lối phiên âm đang dùng; riêng Uzal nên giữ dạng La-tinh trực tiếp để bảo toàn tên nguồn. Chú thích hiện hữu có khẳng định về “ý nghĩa” của các biến thể phiên âm mà không cần thiết và không được văn bản câu này xác lập.
