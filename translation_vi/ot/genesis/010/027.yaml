  source_fidelity: 'Bản nháp giữ đúng cấu trúc liệt kê và hai tên Ha-đô-ram, Đích-la nhìn chung phản ánh các tên Hê-bơ-rơ. Tuy nhiên, “U-xan” không phản ánh trung thực אוּזָל (ʾÛzāl): phụ âm cuối l của tên nguồn bị đổi thành n. Dùng dạng phiên tự trực tiếp “Uzal” tránh làm mất phụ âm này và không tạo ra một dạng tên tiếng Việt không có cơ sở rõ ràng.'
