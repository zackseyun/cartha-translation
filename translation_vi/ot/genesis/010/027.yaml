lexical_decisions:
- source_word: וְ/אֶת
  choice: và; lược dịch dấu chỉ tân ngữ khi cần
  rationale: אֵת là dấu chỉ tân ngữ xác định, không có từ tương đương tự nhiên trong tiếng Việt; וְ biểu thị sự nối tiếp trong danh sách. Tiếng Việt dùng “và” để liên kết, đồng thời tránh lặp từ một cách gượng ép.
- source_word: הֲדוֹרָם
  choice: Ha-đô-ram
  rationale: Tên riêng được phiên âm theo âm tiết sang chữ Quốc ngữ, không dịch nghĩa.
- source_word: אוּזָל
  choice: U-xan
  rationale: Tên riêng được phiên âm từ tiếng Hê-bơ-rơ; phụ âm cuối ל được thể hiện tự nhiên bằng “n” theo quy tắc âm cuối tiếng Việt.
- source_word: דִּקְלָה
  choice: Đích-la
  rationale: Tên riêng được phiên âm theo âm tiết sang chữ Quốc ngữ, giữ gần dạng Hê-bơ-rơ thay vì dịch nghĩa.
