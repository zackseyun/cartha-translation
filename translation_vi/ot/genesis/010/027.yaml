  text: và Ha-đô-ram[a], Uzal, và Đích-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đây là các tên riêng trong bảng liệt kê các dân tộc; cách phiên âm có thể khác nhau đôi chút.
