  text: 'And the sons of Gomer: Ashkenaz[a], Riphath, and Togarmah.'
translation:
  language: vi
  text: Các con trai của Gô-me là Ách-ca-na, Ri-phát[a] và Tô-ga-ma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 Sử Ký 1:6 chép “Đi-phát” thay vì “Ri-phát”.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Các con trai của
  rationale: Dịch danh từ số nhiều ở dạng liên kết בְּנֵי là “các con trai của”, phù hợp với cấu trúc gia phả. Liên từ וּ được thể hiện tự nhiên qua sự tiếp nối của danh sách trong tiếng Việt, không cần dịch máy móc là “và” ở đầu câu.
- source_word: גֹּמֶר
  choice: Gô-me
  rationale: Tên riêng được phiên âm theo cách đọc Hê-bơ-rơ và quy ước tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: אַשְׁכֲּנַז
  choice: Ách-kê-na
  rationale: Tên riêng được phiên âm sang tiếng Việt, không dịch nghĩa.
- source_word: וְ/רִיפַת
  choice: Ri-phát
  rationale: Theo bản Masoret WLC là רִיפַת; liên từ được diễn đạt trong phép liệt kê tiếng Việt. Dị bản ở 1 Sử Ký 1:6 được ghi chú.
- source_word: וְ/תֹגַרְמָה
  choice: và Tô-ga-ma
  rationale: Tên riêng được phiên âm; liên từ trước thành viên cuối được giữ bằng “và” theo lối liệt kê tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ cấu trúc gia phả súc tích. Các tên riêng được phiên âm nhất quán sang tiếng Việt, và dấu chú thích [a] xuất hiện ngay sau tên có dị bản.
