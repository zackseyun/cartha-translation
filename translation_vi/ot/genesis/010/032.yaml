language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: vi
  text: Đây là các dòng họ của các con trai Nô-ê[a], theo các thế hệ của họ, trong các dân tộc của họ; từ những người này, các dân tộc đã phân tách ra trên mặt đất sau trận lụt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các gia tộc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: các dòng họ
  rationale: Danh từ chỉ những nhóm người có quan hệ huyết thống. “Dòng họ” tự nhiên trong tiếng Việt và phù hợp với phần tổng kết gia phả; “gia tộc” cũng có thể dùng nhưng mang sắc thái trang trọng hơn.
- source_word: לְתוֹלְדֹתָם
  choice: theo gia phả của họ
  rationale: תּוֹלְדוֹת có thể chỉ các thế hệ, hậu duệ hoặc dòng gia phả. Trong câu tổng kết bảng các dân tộc này, “theo gia phả của họ” diễn đạt rõ chức năng phân loại của cụm từ.
- source_word: בְּגוֹיֵהֶם
  choice: trong các dân tộc của họ
  rationale: Giữ nghĩa liên kết/phạm vi của giới từ ב và ý nghĩa dân tộc–cộng đồng của גּוֹי, đồng thời không biến hai cụm phân loại thành một quan hệ nhân quả.
- source_word: וּמֵאֵלֶּה
  choice: từ những dòng họ này
  rationale: Đại từ “những người/nhóm này” quy chiếu về các dòng họ vừa nêu; lặp lại “dòng họ” giúp câu tiếng Việt rõ nghĩa mà không thêm nội dung.
- source_word: נִפְרְדוּ
  choice: đã phân tách ra
  rationale: Dạng Niphal của פרד diễn tả sự tách rời hoặc phân chia. “Phân tách ra” giữ được sắc thái trung động/thụ động và cũng hàm ý các dân tộc lan ra thành những nhóm riêng.
- source_word: הַגּוֹיִם
  choice: các dân tộc
  rationale: Trong Sáng Thế Ký 10, từ này chỉ những cộng đồng dân tộc riêng biệt bắt nguồn từ các con trai Nô-ê.
- source_word: בָּאָרֶץ
  choice: trên khắp đất
  rationale: Ở đây אֶרֶץ có phạm vi rộng trong lời tổng kết về sự phân bố các dân tộc. “Trên khắp đất” diễn đạt tự nhiên phạm vi toàn thể mà không buộc phải dùng thuật ngữ hiện đại “Trái Đất”.
- source_word: אַחַר הַמַּבּוּל
  choice: sau trận lụt
  rationale: Cách dịch trực tiếp, tự nhiên, quy chiếu đến trận đại hồng thủy trong phần ký thuật trước.
theological_decisions:
- issue: Phạm vi của אֶרֶץ trong lời tổng kết về sự phân tán sau trận lụt
  choice: “trên khắp đất,” theo nghĩa phạm vi rộng/toàn thể
  alternative: “trong xứ,” theo nghĩa một vùng đất địa phương
  rationale: Sáng Thế Ký 10 tổng kết sự hình thành và phân bố các dân tộc từ hậu duệ Nô-ê. Ngữ cảnh này nghiêng về phạm vi toàn thể, nhưng cách diễn đạt không thêm các khẳng định ngoài văn bản.
- issue: Sắc thái của נִפְרְדוּ
  choice: “đã phân tách ra,” giữ ý các nhóm trở nên riêng biệt
  alternative: “đã lan ra” hoặc “đã bị phân chia”
  rationale: Động từ có thể nhấn mạnh sự tách rời, còn kết quả trong ngữ cảnh là sự phân bố. Bản dịch giữ căng thẳng giữa hai sắc thái, không quy rõ một tác nhân gây ra sự phân chia.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Nô-ê” theo lối phiên âm Kinh Thánh quen thuộc; giữ cấu trúc tổng kết gia phả của nguyên văn nhưng điều chỉnh vừa đủ để câu tiếng Việt tự nhiên.
