base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/002.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: vi
  text: 'Các con trai của Gia-phết là: Gô-me[a], Ma-gốc, Ma-đai, Gia-van, Tu-banh, Mê-siếc và Ti-ra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong cách dùng về sau, một số tên có thể chỉ dân tộc hoặc vùng địa lý: “Ma-đai” là người Mê-đi, còn “Gia-van” có thể là Ionia hoặc người Hy Lạp. Chính văn giữ các tên phả hệ Hê-bơ-rơ bằng cách phiên âm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Dạng số nhiều liên kết của בֵּן mở đầu một gia phả; cách dịch này trực tiếp giữ nguyên khung phả hệ theo dòng nam của tiếng Hê-bơ-rơ.
- source_word: יֶפֶת
  choice: Gia-phết
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: גֹּמֶר
  choice: Gô-me
  rationale: Tên riêng trong danh sách các con trai của Gia-phết; được phiên âm thay vì diễn giải theo dân tộc hay địa lý.
- source_word: מָגוֹג
  choice: Ma-gốc
  rationale: Ở đây từ này giữ chức năng tên riêng trong gia phả, dù về sau có những liên hệ dân tộc hoặc địa lý.
- source_word: מָדַי
  choice: Ma-đai
  rationale: Giữ dạng tên riêng theo cách trình bày phả hệ của bản Hê-bơ-rơ, không chuyển ngay thành tên dân Mê-đi.
- source_word: יָוָן
  choice: Gia-van
  rationale: Giữ tên phả hệ bằng phiên âm; không áp đặt nghĩa diễn giải là Ionia hay người Hy Lạp trong chính văn.
- source_word: תֻבָל
  choice: Tu-banh
  rationale: Tên riêng được phiên âm sang tiếng Việt.
- source_word: מֶשֶׁךְ
  choice: Mê-siếc
  rationale: Tên riêng được phiên âm sang tiếng Việt, giữ sự phân biệt với các địa danh hay dân danh được suy đoán.
- source_word: תִירָס
  choice: Ti-ra
  rationale: Tên riêng được phiên âm sang tiếng Việt.
