  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: vi
  text: Đó là các con trai của Cham, theo các thị tộc của họ, các ngôn ngữ của họ, trong các xứ sở của họ và theo các dân tộc của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ định mở đầu một câu tổng kết và nhận diện; “Đó là” tự nhiên trong tiếng Việt khi quy chiếu danh sách vừa nêu.
- source_word: בְנֵי חָם
  choice: các con trai của Cham
  rationale: Giữ nghĩa hình thức của cụm từ phả hệ “các con trai của”; tên חָם được phiên âm là “Cham” theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc
  rationale: Giới từ לְ biểu thị sự phân loại; “thị tộc” diễn đạt nhóm thân tộc rộng hơn gia đình hạt nhân.
- source_word: לִלְשֹׁנֹתָם
  choice: từng ngôn ngữ
  rationale: לָשׁוֹן theo nghĩa đen là “lưỡi”, nhưng trong ngữ cảnh này chỉ ngôn ngữ; “từng” tiếp nối ý phân loại.
- source_word: בְאַרְצֹתָם
  choice: trong các xứ sở của họ
  rationale: Giữ nghĩa vị trí của בְ và số nhiều của אֶרֶץ; “xứ sở” tránh hàm ý quốc gia-dân tộc hiện đại quá rõ.
- source_word: בְגוֹיֵהֶם
  choice: theo từng dân tộc
  rationale: Trong công thức tổng kết này, cụm từ nêu một phương diện phân loại xã hội-chính trị; “dân tộc” phân biệt với “thị tộc” và “xứ sở”.
