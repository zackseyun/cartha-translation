base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: vi
  text: 'Khi họ đưa họ ra ngoài, một người nói: “Hãy chạy thoát để cứu lấy mạng sống mình! Đừng ngoái nhìn phía sau[a], cũng đừng dừng lại ở bất cứ nơi nào trong đồng bằng. Hãy chạy thoát lên vùng núi[b], kẻo bị cuốn đi[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng nhìn lại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lên núi” hoặc “lên miền đồi núi.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “kẻo bị hủy diệt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: ra ngoài
  rationale: Dạng chỉ hướng diễn tả chuyển động từ trong thành hoặc nơi ở ra bên ngoài; “ra ngoài” tự nhiên và giữ rõ hướng chuyển động.
- source_word: הִמָּלֵט
  choice: hãy chạy thoát
  rationale: Mệnh lệnh Niphal của מלט mang ý khẩn cấp thoát khỏi hiểm họa. Lặp lại cùng một cách dịch ở cả hai chỗ để giữ phép lặp của nguyên văn.
- source_word: עַל נַפְשֶׁךָ
  choice: để cứu lấy mạng sống mình
  rationale: Đây là thành ngữ chỉ việc bảo toàn mạng sống. Cách dịch này rõ nghĩa, khẩn thiết và không hiểu נֶפֶשׁ theo nghĩa trừu tượng là “linh hồn”.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: đừng ngoái nhìn phía sau
  rationale: Giữ hình ảnh nhìn về phía sau của tiếng Hê-bơ-rơ, đồng thời dùng lối nói tự nhiên trong tiếng Việt.
- source_word: וְאַל תַּעֲמֹד
  choice: cũng đừng dừng lại
  rationale: Trong bối cảnh chạy trốn, עמד chỉ việc ngừng tiến bước hoặc nấn ná, không đơn thuần là đứng bằng tư thế thẳng.
- source_word: בְּכָל הַכִּכָּר
  choice: ở bất cứ nơi nào trong đồng bằng
  rationale: כִּכָּר ở đây chỉ vùng đồng bằng; cấu trúc בְּכָל trong lời cấm có nghĩa phân bố là không được dừng ở bất cứ chỗ nào trong vùng ấy.
- source_word: הָהָרָה
  choice: lên vùng núi
  rationale: Dạng có hậu tố chỉ hướng nghĩa là đi về phía núi hoặc miền đồi núi. “Vùng núi” giữ được tính địa hình tập thể mà không buộc phải hiểu là một ngọn núi riêng biệt.
- source_word: פֶּן תִּסָּפֶה
  choice: kẻo bị cuốn đi
  rationale: Động từ נספה ở thể Niphal có thể chỉ bị quét sạch, bị hủy diệt hoặc cùng chung số phận trong tai họa. “Bị cuốn đi” giữ hình ảnh bị tai họa ập đến cuốn mất; phương án rộng hơn được ghi chú.
theological_decisions:
- issue: Danh tính và số lượng của người nói
  choice: “một vị nói”
  alternative: “họ nói” hoặc xác định rõ “thiên sứ nói”
  rationale: Động từ וַיֹּאמֶר ở số ít, trong khi chủ thể của hành động đưa ra ngoài ở số nhiều. Bản dịch giữ người nói ở số ít nhưng không xác quyết đó là thiên sứ nào, tránh giải quyết quá mức điều bản văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Các mệnh lệnh ngắn giữ nhịp khẩn cấp của nguyên văn. Đại từ ngôi thứ hai được lược bỏ khi tiếng Việt cho phép, tránh áp đặt sắc thái quan hệ như “anh,” “ông” hay cách xưng hô cổ “ngươi,” nhưng mệnh lệnh vẫn hướng đến một người theo ngữ pháp Hê-bơ-rơ.
