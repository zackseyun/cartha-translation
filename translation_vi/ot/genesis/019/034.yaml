base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: vi
  text: 'Hôm sau, người con gái đầu lòng nói với người em: “Này, đêm qua chị đã nằm với cha. Đêm nay, chúng ta cũng hãy cho cha uống rượu; rồi em vào nằm với cha, để chúng ta duy trì dòng dõi qua cha chúng ta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Hôm sau
  rationale: Chuyển tự nhiên công thức kể chuyện Hê-bơ-rơ sang tiếng Việt hiện đại; liên từ mở đầu không cần dịch máy móc.
- source_word: הַבְּכִירָה ... הַצְּעִירָה
  choice: người con gái đầu lòng ... người em
  rationale: “Con gái đầu lòng” giữ sắc thái thứ tự sinh của בְּכִירָה; “người em” tự nhiên trong lời tường thuật và phù hợp ngữ cảnh hai chị em.
- source_word: הֵן
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý, với giọng trang trọng nhưng vẫn hiện đại.
- source_word: שָׁכַבְתִּי אֶת־אָבִי
  choice: chị đã nằm với cha
  rationale: Giữ lối nói giảm mang nghĩa tình dục của nguyên văn; đại từ “chị” làm rõ quan hệ người nói trong tiếng Việt.
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: chúng ta ... hãy cho cha uống rượu
  rationale: Thể hiện thể sai khiến của động từ שׁקה mà không hàm ý cưỡng ép quá mức; “cha” tự nhiên hơn “ông ấy” trong lời hai con gái.
- source_word: גַּם הַלַּיְלָה
  choice: Đêm nay, chúng ta cũng
  rationale: Giữ cả ý thời gian và sắc thái thêm/lặp lại của גַּם.
- source_word: וּבֹאִי שִׁכְבִי עִמּוֹ
  choice: rồi em vào nằm với cha
  rationale: “Rồi” thể hiện trình tự; “nằm với” bảo tồn lối nói giảm của nguyên văn.
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: để chúng ta duy trì dòng dõi của cha
  rationale: Diễn đạt tự nhiên ý “làm cho hạt giống/dòng giống từ cha chúng ta sống còn”; “dòng dõi” giữ sắc thái nối tiếp hậu duệ rõ hơn cách dịch sát chữ “hạt giống”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Giữ lối nói giảm “nằm với” của tiếng Hê-bơ-rơ, không làm câu văn lâm sàng hơn hoặc giảm nhẹ hơn nguyên tác. Dùng cách xưng hô chị–em và gọi “cha” phù hợp quan hệ gia đình trong tiếng Việt.
