review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng diễn tiến, quan hệ chị–em, uyển ngữ tình dục của שׁכב, ý sai khiến «cho cha uống rượu», và mục đích duy trì hậu tự. Tuy nhiên, «dòng dõi của cha» có thể hiểu là dòng họ vốn thuộc về người cha, trong khi מֵאָבִינוּ nêu rõ hậu tự có được qua/từ cha chúng ta.
  naturalness: Văn phong hiện đại, rõ ràng và giữ được sắc thái trang nghiêm. «Người con gái đầu lòng» và «người em» phù hợp trong lời tường thuật; «chị/em» phù hợp trong lời thoại. Điều chỉnh cụm cuối giúp tự nhiên hơn mà làm rõ quan hệ nguồn gốc trong nguyên ngữ.
  terminology: «Nằm với» là uyển ngữ thích hợp cho hành vi tình dục trong văn cảnh. «Dòng dõi» là cách dịch tự nhiên của זֶרַע trong ngữ cảnh này; chú thích ghi nhận nghĩa đen «hạt giống».
  issues:
  - severity: medium
    issue: Cụm «dòng dõi của cha» chưa phản ánh rõ giới từ מִן trong מֵאָבִינוּ.
    rationale: Nguyên văn nói đến «hậu tự/dòng dõi từ cha chúng ta», tức hậu tự được có qua người cha. «Của cha» dễ chuyển trọng tâm sang quan hệ sở hữu hoặc dòng họ của cha.
  revised_text: 'Hôm sau, người con gái đầu lòng nói với người em: “Này, đêm qua chị đã nằm với cha. Đêm nay, chúng ta cũng hãy cho cha uống rượu; rồi em vào nằm với cha, để chúng ta duy trì dòng dõi qua cha chúng ta.”'
  revised_footnotes:
