  to: 'Hôm sau, người con gái đầu lòng nói với người em: “Này, đêm qua chị đã nằm với cha. Đêm nay, chúng ta cũng hãy cho cha uống rượu; rồi em vào nằm với cha, để chúng ta duy trì dòng dõi qua cha chúng ta.”'
