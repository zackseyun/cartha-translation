  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: vi
  text: Vậy, cả hai con gái của Lót đều có thai với chính cha mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ cha mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: mang thai
  rationale: Động từ הרה ở dạng chỉ hai người nữ cho biết cả hai đã có thai. “Mang thai” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại; “thụ thai” cũng có thể dùng nhưng trang trọng và thiên về thời điểm bắt đầu thai kỳ hơn.
- source_word: שְׁתֵּי בְנוֹת לוֹט
  choice: cả hai con gái của Lót
  rationale: שְׁתֵּי xác định hai người con gái và trong ngữ cảnh nhấn mạnh rằng cả hai đều mang thai. Cấu trúc “cả hai con gái của Lót” tự nhiên và giữ đúng phạm vi của nguyên văn.
- source_word: מֵאֲבִיהֶן
  choice: với chính cha mình
  rationale: Giới từ מִן theo nghĩa đen chỉ nguồn gốc, ở đây nói người cha là người khiến họ có thai. Trong tiếng Việt, “mang thai với” diễn đạt quan hệ sinh học tự nhiên hơn “mang thai từ”; từ “chính” làm rõ quan hệ loạn luân vốn hiển nhiên trong nguyên văn mà không thêm cách giải thích thần học.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Lót” theo cách phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt. Đại từ phản thân “mình” quy chiếu chung về cha của hai người con gái.
