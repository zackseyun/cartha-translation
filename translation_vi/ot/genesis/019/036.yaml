  source_fidelity: 'Bản dịch giữ đúng các thành phần chính của tiếng Hê-bơ-rơ: cả hai con gái của Lót đều có thai, và thai là từ người cha của họ. Tuy nhiên, cách kết hợp “mang thai với” không phải là cách dùng tự nhiên và chính xác nhất trong tiếng Việt cho ý này. “Có thai với” diễn đạt quan hệ phụ hệ/nguồn gốc thai một cách tự nhiên hơn, đồng thời không thêm chi tiết ngoài nguyên văn.'
