  text: וַ/יֹּאמְר֣וּ גֶּשׁ הָ֗לְאָה וַ/יֹּֽאמְרוּ֙ הָ/אֶחָ֤ד בָּֽא לָ/גוּר֙ וַ/יִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְ/ךָ֖ מֵ/הֶ֑ם וַ/יִּפְצְר֨וּ בָ/אִ֤ישׁ בְּ/לוֹט֙ מְאֹ֔ד וַֽ/יִּגְּשׁ֖וּ לִ/שְׁבֹּ֥ר הַ/דָּֽלֶת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: vi
  text: 'Họ nói: “Lùi lại![a]” Rồi họ nói: “Tên này đến đây cư ngụ như một người ngoại kiều mà bây giờ cứ làm người xét xử! Bây giờ, chúng tao sẽ làm hại mày còn hơn họ.” Họ xô ép Lót rất dữ dội, rồi tiến lại để phá cửa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tránh ra!”'
    reason: Cụm từ Hê-bơ-rơ có thể chỉ việc lùi lại hoặc tránh sang một bên.
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: Lùi lại!
  rationale: Mệnh lệnh này yêu cầu Lót tránh ra hoặc lùi ra sau; “Lùi lại!” tự nhiên, mạnh và phù hợp với thái độ thù địch trong ngữ cảnh.
- source_word: הָאֶחָד
  choice: Tên này
  rationale: Cụm từ mang sắc thái khinh miệt. “Tên này” truyền đạt sự miệt thị tự nhiên trong tiếng Việt mà không thêm ý nghĩa ngoài ngữ cảnh.
- source_word: בָּא לָגוּר
  choice: đến đây cư ngụ như một người ngoại kiều
  rationale: Động từ גור chỉ việc cư trú với địa vị người từ nơi khác đến, không thuộc cộng đồng bản địa; cách dịch này vừa rõ nghĩa xã hội vừa giữ sắc thái nguyên ngữ.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: mà nay cứ làm quan xét xử
  rationale: Động từ kèm động từ nguyên thể tuyệt đối nhấn mạnh lời cáo buộc rằng Lót tự đặt mình vào vai trò phán xét họ. “Cứ làm quan xét xử” giữ sắc thái chế giễu và nhấn mạnh.
- source_word: נָרַע לְךָ מֵהֶם
  choice: chúng tao sẽ làm hại mày còn hơn họ
  rationale: Hiphil của רעע ở đây có nghĩa gây điều ác hoặc tổn hại; cách dịch trực tiếp giữ nguyên lời đe dọa so sánh mà không xác định cụ thể hình thức bạo lực.
- source_word: וַיִּפְצְרוּ
  choice: xô ép
  rationale: Trong bối cảnh họ tiến đến phá cửa, động từ diễn tả sức ép mạnh mang tính thể chất, không chỉ là nài ép bằng lời.
- source_word: בָאִישׁ בְּלוֹט
  choice: người ấy, tức là Lót
  rationale: Hai giới từ lặp lại cùng danh từ và tên riêng nhấn mạnh chính Lót là đối tượng bị xô ép; cấu trúc giải thích này tự nhiên trong tiếng Việt.
- source_word: מְאֹד
  choice: rất dữ dội
  rationale: Trạng từ tăng cường mức độ của hành động xô ép; “rất dữ dội” diễn đạt cường độ tự nhiên trong tiếng Việt.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: tiến đến để phá cửa
  rationale: Cấu trúc diễn tả việc tiến lại với mục đích phá cánh cửa. “Phá cửa” tự nhiên và không cần thêm từ “sập,” vốn cụ thể hơn nguyên ngữ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “chúng tao—mày” thể hiện rõ thái độ khinh miệt, đe dọa của đám đông. “Ngoại kiều” giữ ý về địa vị người cư trú không thuộc cộng đồng bản địa; “quan xét xử” truyền đạt hình ảnh tự đặt mình làm người phán xét.
