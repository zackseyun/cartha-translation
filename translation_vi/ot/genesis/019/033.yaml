base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: vi
  text: Đêm ấy, họ cho cha mình uống rượu. Người con gái cả vào nằm với cha mình; ông không biết lúc cô nằm xuống và lúc cô dậy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “trong lúc cô nằm xuống và trong lúc cô dậy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: họ cho cha mình uống rượu
  rationale: Dạng Hiphil của שׁקה mang nghĩa khiến hoặc cho ai uống; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ ý gây khiến.
- source_word: יַיִן
  choice: rượu
  rationale: Trong ngữ cảnh Kinh Thánh, יין chỉ rượu nho; tiếng Việt thường dùng từ tự nhiên, phổ thông là “rượu” khi không cần nhấn mạnh loại rượu.
- source_word: בַּלַּיְלָה הוּא
  choice: Đêm ấy
  rationale: Cách diễn đạt thời gian tự nhiên, trang trọng vừa phải và giữ nguyên sự quy chiếu xác định của nguyên văn.
- source_word: הַבְּכִירָה
  choice: người con gái đầu lòng
  rationale: Danh từ giống cái có nghĩa đen là người nữ sinh đầu; lựa chọn này giữ rõ quan hệ gia đình và thứ tự sinh.
- source_word: וַתָּבֹא
  choice: vào
  rationale: Động từ בוא ở đây diễn tả việc cô đi vào chỗ cha mình; “vào” gọn, tự nhiên và không thêm chi tiết ngoài nguyên văn.
- source_word: וַתִּשְׁכַּב אֶת אָבִיהָ
  choice: nằm với cha mình
  rationale: Cấu trúc này là lối nói giảm chỉ quan hệ tình dục; “nằm với” giữ được tính uyển ngữ và sắc thái trần thuật của nguyên văn.
- source_word: וְלֹא יָדַע
  choice: ông không hề hay biết
  rationale: ידע trong ngữ cảnh này nói về sự nhận biết hoặc ý thức. “Không hề hay biết” diễn đạt tự nhiên mức độ hoàn toàn không nhận biết mà không giải thích thêm nguyên nhân.
- source_word: בְּשִׁכְבָהּ וּבְקוּמָהּ
  choice: lúc cô nằm xuống cũng như khi cô đứng dậy
  rationale: Hai kết cấu với giới từ בְּ và động từ nguyên thể chỉ thời điểm hoặc hoàn cảnh; bản dịch giữ phép song song, đồng thời dùng cú pháp tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “nằm với” để bảo toàn lối nói giảm của tiếng Hê-bơ-rơ, và “người con gái đầu lòng” để giữ trọng tâm về thứ tự sinh. Dấu chú thích được đặt sau mệnh đề mà chú thích giải thích.
