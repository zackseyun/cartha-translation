base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: vi
  text: 'Người nói với ông[a]: “Này, Ta cũng đã nhận lời ông về việc này: Ta sẽ không lật đổ thành mà ông đã nói đến.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “Ta đã nâng mặt ông lên”, một thành ngữ có nghĩa là tỏ lòng ưu ái hoặc chấp thuận lời thỉnh cầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của từ Hê-bơ-rơ bằng một cách diễn đạt trang trọng nhưng tự nhiên trong tiếng Việt.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: Ta cũng nhận lời ông
  rationale: Đây là thành ngữ, nghĩa đen là “Ta đã nâng mặt ông lên”, nhưng trong ngữ cảnh diễn tả việc chấp thuận lời thỉnh cầu. “Nhận lời” truyền đạt tự nhiên ý nghĩa ấy mà không biến דָּבָר thành chính ân huệ.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: cả trong việc này
  rationale: Giữ lực bổ sung của גַּם và nghĩa rộng của דָּבָר là sự việc/vấn đề Lot vừa nêu, thay vì làm hẹp quá mức thành một danh từ chỉ lời thỉnh cầu.
- source_word: לְבִלְתִּי הָפְכִּי
  choice: Ta sẽ không lật đổ
  rationale: Diễn đạt kết quả cụ thể của việc nhận lời và giữ hình ảnh của căn הפך, “lật, đảo ngược”, thay vì dùng từ rộng hơn là “hủy diệt”.
- source_word: הָעִיר
  choice: thành
  rationale: Cách gọi tự nhiên, trang trọng trong văn thuật chuyện Kinh Thánh; danh từ xác định được nhận diện rõ từ ngữ cảnh.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: mà ông đã nói đến
  rationale: Thể hiện rõ đây là thành Lot vừa nhắc tới, đồng thời bám sát động từ “nói” của nguyên văn.
theological_decisions:
- issue: Chủ thể của động từ וַיֹּאמֶר không được nêu danh trong chính câu này
  choice: Người
  alternative: Ngài / thiên sứ
  rationale: Dùng “Người” để nối với chủ thể trong văn mạch mà không tự ý xác định thêm danh tính hoặc bản tính thần học vốn không được ghi rõ trong chính câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—ông” phù hợp lời của nhân vật có thẩm quyền nói với Lot. Dấu [a] đặt ngay sau mệnh đề chứa thành ngữ được chú thích.
