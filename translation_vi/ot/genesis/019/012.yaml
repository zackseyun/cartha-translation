source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: vi
  text: 'Những người đàn ông ấy nói với Lót: “Ông còn ai khác ở đây không? Con rể, các con trai, các con gái của ông, và mọi người thuộc về ông trong thành[b]—hãy đưa họ ra khỏi nơi này.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ “con rể” cũng có thể có nghĩa là “chú rể”; ở đây có lẽ chỉ người đã cưới hoặc sắp cưới con gái của Lót.
    reason: lexical_alternative
  - marker: b
    text: Cụm “mọi người thuộc về ông” dịch một thành ngữ Hê-bơ-rơ sát chữ là “tất cả những gì thuộc về ông”; trong ngữ cảnh, câu này nói đến những người thuộc gia đình hoặc gia quyến của Lót trong thành.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: những người đàn ông ấy
  rationale: Danh từ Hê-bơ-rơ có nghĩa thông thường là “những người đàn ông.” Dù văn mạch cho biết họ là các thiên sứ, bản dịch giữ cách gọi của chính câu này, không đưa sự nhận diện ấy vào sớm hơn nguyên văn.
- source_word: עֹד מִי לְךָ פֹה
  choice: Ông còn có ai khác ở đây không
  rationale: Diễn đạt tự nhiên thành ngữ hỏi xem Lót còn có người nào có quan hệ với mình ở đó hay không; “còn” và “khác” cùng thể hiện sắc thái עֹד trong ngữ cảnh.
- source_word: חָתָן
  choice: con rể
  rationale: Trong ngữ cảnh, từ này hợp lý nhất là chỉ chồng hoặc người sắp cưới của con gái Lót. Tiếng Việt “con rể” không bắt buộc biểu thị số lượng, nhờ đó tránh nhấn mạnh sai rằng chỉ có một người.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: các con trai, các con gái
  rationale: Giữ rõ dạng số nhiều của cả hai danh từ sở hữu; quan hệ với Lót đã rõ từ cách xưng hô và toàn bộ danh sách.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: tất cả những người thuộc về ông trong thành
  rationale: Nguyên văn rộng hơn, sát chữ là “tất cả những gì thuộc về ông trong thành,” nhưng mệnh lệnh đưa ra khỏi thành và danh sách ngay trước đó tập trung vào người. Cách dịch này truyền đạt đúng ý theo ngữ cảnh mà vẫn giữ quan hệ sở thuộc khá rộng.
- source_word: הוֹצֵא
  choice: Hãy đưa họ ra
  rationale: Động từ mệnh lệnh giống đực số ít hướng đến Lót. Đại từ “họ” được bổ sung tự nhiên từ danh sách những người vừa nêu.
- source_word: מִן הַמָּקוֹם
  choice: khỏi nơi này
  rationale: Nguyên văn là “khỏi nơi ấy/nơi đó” với mạo từ xác định. Trong lời nói trực tiếp khi các nhân vật đang ở Sô-đôm, “nơi này” là cách chỉ xuất tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Có nên gọi הָאֲנָשִׁים là các thiên sứ trong chính văn hay không
  choice: Giữ “những người đàn ông ấy”
  alternative: “các thiên sứ” hoặc “các sứ giả”
  rationale: Văn mạch nhận diện hai vị khách là thiên sứ, nhưng câu này dùng danh từ thông thường chỉ người đàn ông. Giữ nguyên cách gọi bảo toàn tiến trình tự sự và không đưa cách giải thích thần học vào thay cho từ ngữ của câu.
- issue: חָתָן chỉ con rể đã cưới hay người đã đính hôn
  choice: Dùng từ quan hệ rộng “con rể” và ghi chú tính khả hữu
  alternative: “chú rể” hoặc “người đã đính hôn với con gái ông”
  rationale: Từ Hê-bơ-rơ có thể chỉ chú rể hoặc con rể; Sáng Thế Ký 19:14 cũng có thể được hiểu theo hơn một cách về tình trạng hôn nhân. Không nên giải quyết dứt khoát điều nguyên văn còn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng “ông” để xưng hô lịch sự với Lót; giữ danh xưng “những người đàn ông” theo câu Hê-bơ-rơ. Dấu gạch ngang giúp danh sách bổ nghĩa cho câu hỏi mà không làm câu tiếng Việt nặng nề.
