    rationale: Chú thích b giải thích cách dịch וְכֹל אֲשֶׁר לְךָ (“tất cả những gì thuộc về ông”), vì vậy ký hiệu nên đặt ngay sau “mọi người thuộc về ông trong thành,” thay vì sau mệnh lệnh “Hãy đưa họ ra khỏi nơi này.”
  - severity: low
    issue: Cấu trúc câu hỏi kèm danh sách sau dấu gạch ngang hơi nặng.
    rationale: Tiếng Việt tự nhiên hơn khi câu hỏi “Ông còn ai khác ở đây không?” được theo sau bằng danh sách các người được nói đến và mệnh lệnh. Cách này vẫn bảo toàn quan hệ cú pháp và ý nghĩa của nguyên văn.
