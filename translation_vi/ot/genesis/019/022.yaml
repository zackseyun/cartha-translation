  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: vi
  text: “Hãy mau trốn đến đó, vì ta không thể làm gì cho đến khi ngươi tới đó.” Vì thế, thành ấy được gọi là Xô-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Xô-a nghe gần giống từ Hê-bơ-rơ có nghĩa là “nhỏ” hoặc “không đáng kể”; xem Sáng Thế Ký 19:20.
    reason: cross_reference
lexical_decisions:
- source_word: מַהֵר
  choice: Hãy mau
  rationale: Mệnh lệnh diễn tả sự khẩn cấp; cách nói này tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: הִמָּלֵט
  choice: trốn
  rationale: Động từ Niphal mang nghĩa thoát thân hoặc chạy đến nơi an toàn; trong ngữ cảnh chạy khỏi sự hủy diệt, “trốn” ngắn gọn và tự nhiên.
- source_word: שָׁמָּה
  choice: đến đó
  rationale: Trạng từ có hậu tố chỉ hướng, nên “đến đó” thể hiện rõ chuyển động hướng tới địa điểm.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho mệnh lệnh preceding.
- source_word: לֹא אוּכַל
  choice: ta không thể
  rationale: Giữ nguyên lời khẳng định trực tiếp về sự không thể, không chuyển thành ý cấm đoán hay trì hoãn tự nguyện.
- source_word: לַעֲשׂוֹת דָּבָר
  choice: làm gì
  rationale: Nguyên văn là “làm một việc”; trong câu phủ định, “không thể làm gì” là cách diễn đạt tự nhiên và giữ phạm vi khái quát.
- source_word: עַד בֹּאֲךָ
  choice: cho đến khi ngươi tới
  rationale: Cấu trúc nguyên mẫu với hậu tố ngôi hai số ít giống đực; “tới” phù hợp với việc đến thành.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Công thức suy luận dẫn vào lời giải thích địa danh.
- source_word: קָרָא שֵׁם הָעִיר
  choice: thành ấy được gọi là
  rationale: Nguyên văn gần sát là “ông gọi tên thành”; thể bị động tiếng Việt tự nhiên hơn mà vẫn bảo toàn ý nghĩa, đồng thời không xác định chủ thể vốn không được nêu rõ trong câu.
- source_word: צֹעַר
  choice: Xô-a
  rationale: Phiên âm địa danh Hê-bơ-rơ theo lối dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Lời tuyên bố không thể hành động trong bối cảnh phán xét
  choice: “ta không thể làm gì”
  alternative: “ta sẽ không làm gì” hoặc “ta không được làm gì”
  rationale: לֹא אוּכַל diễn đạt sự không thể. Bản dịch giữ nguyên sức căng thần học của lời nói, không giải thích đó là giới hạn của thiên sứ, sự cho phép của Đức Chúa Trời hay một sự tự nguyện trì hoãn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta—ngươi” phù hợp với lời của sứ giả dành cho Lót trong văn thuật Kinh Thánh. Dấu chú thích được đặt sau địa danh vì chú thích giải thích tên Xô-a.
