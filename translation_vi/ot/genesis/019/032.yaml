base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: vi
  text: “Nào, chúng ta hãy cho cha uống rượu và nằm với cha, để chúng ta duy trì nòi giống nhờ cha chúng ta[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “hạt giống từ cha chúng ta”; trong ngữ cảnh, “hạt giống” có nghĩa là con cái hoặc dòng dõi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: Nào
  rationale: Đây là thán từ mang ý thúc giục hành động; “Nào” tự nhiên trong tiếng Việt và giữ được sắc thái khích lệ của nguyên ngữ.
- source_word: נַשְׁקֶה אֶת־אָבִינוּ יַיִן
  choice: chúng ta hãy cho cha uống rượu
  rationale: Dạng Hiphil của שׁקה mang nghĩa khiến hoặc cho ai uống; cách dịch này giữ rõ ý sai khiến mà vẫn tự nhiên.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: rồi nằm với cha
  rationale: שׁכב đi với עִם là lối nói giảm chỉ quan hệ tình dục. “Nằm với” giữ lối diễn đạt kín đáo nhưng rõ nghĩa của tiếng Hê-bơ-rơ; “cha” được lặp lại để tiếng Việt không mơ hồ.
- source_word: וּנְחַיֶּה
  choice: để duy trì
  rationale: Dạng Piel cohortative của חיה có nghĩa làm cho sống hoặc giữ cho tồn tại; với זרע, “duy trì” diễn đạt tự nhiên ý tiếp nối nòi giống.
- source_word: מֵאָבִינוּ זָרַע
  choice: dòng dõi từ cha mình
  rationale: זרע ở đây chỉ con cái hoặc hậu duệ, còn מִן đánh dấu nguồn gốc. Cách dịch này giữ cả ý dòng dõi lẫn ý xuất phát từ người cha.
