  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Nào” giữ sắc thái thúc giục; “nằm với” bảo tồn lối nói giảm của nguyên ngữ mà không làm nhẹ đi nội dung. Không thêm cách giải thích mang tính hệ phái.
