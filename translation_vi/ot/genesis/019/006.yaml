  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: vi
  text: Lót đi ra gặp họ tại lối vào[a], rồi đóng cánh cửa sau lưng mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở cửa ra vào.” Trong tiếng Hê-bơ-rơ, פֶּתַח chỉ lối mở/lối vào, khác với דֶּלֶת, chỉ cánh cửa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: đi ra
  rationale: Động từ יצא ở dạng wayyiqtol tiếp diễn mạch kể bằng một hành động quá khứ; “đi ra” tự nhiên và giữ hướng chuyển động từ trong nhà ra ngoài.
- source_word: אֲלֵהֶם
  choice: với họ
  rationale: Giới từ אֶל kèm đại từ số nhiều chỉ việc Lót đi về phía những người ở bên ngoài; trong tiếng Việt, “đi ra với họ” diễn đạt tự nhiên ý ông ra chỗ họ.
- source_word: לוֹט
  choice: Lót
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: הַפֶּתְחָה
  choice: đến chỗ cửa ra vào
  rationale: פֶּתַח chỉ lối mở hoặc cửa ra vào, còn hậu tố chỉ hướng diễn tả chuyển động đến đó. Cách dịch này giữ nó khác với דֶּלֶת là cánh cửa trong vế sau.
- source_word: וְהַדֶּלֶת
  choice: rồi cánh cửa
  rationale: דֶּלֶת chỉ chính tấm/cánh cửa, phân biệt với פֶּתַח là lối cửa; “rồi” thể hiện tự nhiên sự tiếp nối của hành động mà không làm mất liên từ.
- source_word: סָגַר
  choice: đóng ... lại
  rationale: סגר có nghĩa là đóng kín; “đóng cánh cửa lại” là cách nói tự nhiên, rõ ràng trong văn kể tiếng Việt.
- source_word: אַחֲרָיו
  choice: sau lưng mình
  rationale: 'Ở đây cụm từ mang nghĩa không gian: sau khi bước ra ngoài, Lót đóng cửa ở phía sau mình. Đại từ phản thân “mình” quy chiếu rõ về chủ ngữ Lót.'
