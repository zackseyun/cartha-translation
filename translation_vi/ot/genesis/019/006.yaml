  source_fidelity: Bản nháp phân biệt đúng פֶּתַח (lối vào/lối mở) với דֶּלֶת (cánh cửa) và diễn đạt đúng hành động đóng cửa ở phía sau Lót. Tuy nhiên, “đi ra với họ” trong tiếng Việt thường hàm ý Lót cùng đi với họ, trong khi אֲלֵהֶם nghĩa là Lót đi ra về phía/gặp họ. Cần sửa để tránh đảo chiều quan hệ hành động.
