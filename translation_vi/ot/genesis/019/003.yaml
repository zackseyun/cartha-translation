base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: vi
  text: Nhưng Lót hết sức khẩn khoản mời họ[a], nên họ rẽ vào chỗ ông và bước vào nhà ông. Ông dọn cho họ một bữa tiệc, nướng bánh không men[b], rồi họ ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hết sức nài nỉ họ” hoặc “tha thiết thúc giục họ.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hebrew dùng dạng số nhiều, có thể hiểu là “những chiếc bánh không men”; tức bánh làm không dùng men.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: nài ép họ hết sức
  rationale: Động từ פצר diễn tả sự thúc giục hoặc nài ép mạnh mẽ; מְאֹד tăng cường mức độ. Cách dịch này tự nhiên và giữ được sức nặng của nguyên văn.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: họ rẽ vào chỗ ông
  rationale: Giữ hình ảnh cơ bản của סור là đổi hướng/rẽ vào, đồng thời אֵלָיו được thể hiện bằng “vào chỗ ông” trong ngữ cảnh lời mời trú tại nhà.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: bước vào nhà ông
  rationale: Diễn đạt rõ chuyển động vào trong nhà bằng tiếng Việt tự nhiên.
- source_word: מִשְׁתֶּה
  choice: một bữa tiệc
  rationale: Từ này chỉ một bữa tiệc hay yến tiệc, có thể bao hàm đồ uống nhưng ngữ cảnh không đòi hỏi phải nêu riêng ý uống rượu.
- source_word: מַצּוֹת אָפָה
  choice: nướng bánh không men
  rationale: מַצּוֹת là các loại bánh không dùng men; אָפָה nghĩa là nướng. “Bánh không men” là cách gọi rõ ràng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: וַיֹּאכֵלוּ
  choice: rồi họ ăn
  rationale: “Rồi” nối tự nhiên hành động cuối với việc chuẩn bị bữa ăn, đồng thời giữ diễn tiến của lời kể Hebrew.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Lót” để làm rõ chủ thể theo ngữ cảnh dù nguyên văn chỉ có đại từ; giữ nét hình tượng “rẽ vào” của Hebrew mà không khiến câu tối nghĩa.
