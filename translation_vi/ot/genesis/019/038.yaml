base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: vi
  text: Người con gái trẻ hơn cũng sinh một con trai và đặt tên là Bên-Am-mi[a]. Người con trai ấy là tổ phụ của dân Am-môn[b] cho đến ngày nay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Bên-Am-mi có lẽ có nghĩa là “con trai của dân tôi” hoặc “con trai của người bà con tôi.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “các con trai của Am-môn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: Người con gái trẻ hơn
  rationale: Tính từ có mạo từ được dùng như danh từ và theo ngữ cảnh chỉ người con gái trẻ hơn của Lót; nói rõ “con gái” giúp câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: גַם הִוא
  choice: cũng
  rationale: Diễn tả rằng người con gái trẻ hơn cũng sinh con như chị mình; “cũng” chuyển tải tự nhiên sắc thái tương ứng này.
- source_word: יָלְדָה בֵּן
  choice: sinh một con trai
  rationale: Cách diễn đạt thông dụng, chính xác trong tiếng Việt cho thành ngữ Hê-bơ-rơ ילד + בן.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: đặt tên là
  rationale: Chuyển tải tự nhiên công thức đặt tên trong tiếng Hê-bơ-rơ mà không giữ cấu trúc gượng “gọi tên nó là”.
- source_word: בֶּן עַמִּי
  choice: Bên-Am-mi
  rationale: Giữ tên riêng theo lối phiên âm; ý nghĩa có liên quan đến câu chuyện được giải thích trong chú thích.
- source_word: הוּא אֲבִי
  choice: Người ấy là tổ phụ
  rationale: Trong ngữ cảnh nguồn gốc một dân tộc, אָב mang nghĩa vị tổ tiên; “tổ phụ” rõ hơn “cha” trong tiếng Việt hiện đại.
- source_word: בְנֵי עַמּוֹן
  choice: dân Am-môn
  rationale: Cụm từ có nghĩa đen là “các con trai của Am-môn” nhưng chỉ dân Am-môn; bản dịch tự nhiên được dùng trong câu chính, còn nghĩa đen được ghi chú.
- source_word: עַד הַיּוֹם
  choice: cho đến ngày nay
  rationale: Thành ngữ tiếng Việt tương ứng với công thức thời gian trong lời kể, quy chiếu đến thời của người thuật chuyện.
