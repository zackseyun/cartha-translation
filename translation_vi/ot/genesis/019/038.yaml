translation_notes:
  register: Văn phong kể chuyện trang trọng, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “tổ phụ” để thể hiện quan hệ nguồn gốc dân tộc, đồng thời giữ tên riêng theo lối phiên âm nhất quán.
