  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: vi
  text: Nhưng vợ ông, ở phía sau ông, nhìn lại và hóa thành một cột muối.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: nhìn lại
  rationale: Động từ נבט có nghĩa là nhìn hoặc hướng mắt xem. Trong ngữ cảnh lời cấm ngoái nhìn và cụm מֵאַחֲרָיו theo sau, “nhìn lại” diễn đạt tự nhiên hành động nhìn về phía sau mà không gán thêm động cơ.
- source_word: אִשְׁתּוֹ
  choice: vợ ông
  rationale: Danh từ có hậu tố ngôi ba số ít giống đực nghĩa là “vợ của ông ấy”, theo ngữ cảnh là vợ của Lót.
- source_word: מֵאַחֲרָיו
  choice: từ phía sau
  rationale: Cụm từ có nghĩa sát là “từ đằng sau ông ấy”. Tiếng Việt có thể lược đại từ trong cụm này để câu tự nhiên hơn; vị trí của người vợ ở phía sau ông vẫn được bảo toàn.
- source_word: וַתְּהִי
  choice: hóa thành
  rationale: Trong chuỗi tự sự này, היה chỉ sự trở thành hay chuyển sang một trạng thái mới; “hóa thành” truyền đạt rõ kết quả biến đổi.
- source_word: נְצִיב
  choice: một cột
  rationale: נְצִיב chỉ một vật đứng hoặc được dựng lên; “cột” là cách dịch tự nhiên và quen thuộc trong ngữ cảnh này.
- source_word: מֶלַח
  choice: muối
  rationale: Cụm danh từ נְצִיב מֶלַח được diễn đạt tự nhiên trong tiếng Việt là “một cột muối”.
theological_decisions:
- issue: Bản chất việc biến đổi của vợ Lót
  choice: Dịch trực tiếp là “hóa thành một cột muối”.
  alternative: “trở nên giống như một cột muối” hoặc “đứng đó như một cột muối”
  rationale: Câu Hê-bơ-rơ không có dấu hiệu so sánh. Bản dịch giữ nguyên lời khẳng định của trình thuật, không làm yếu thành phép ví von và cũng không thêm lời giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “từ phía sau nhìn lại” giữ được cả vị trí của người vợ lẫn hướng nhìn, đồng thời tránh sự nặng nề của cách dịch hoàn toàn sát chữ “từ phía sau ông”.
