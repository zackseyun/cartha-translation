revisions:
- from: Vì chúng tôi sắp hủy diệt nơi này, bởi tiếng kêu của họ đã trở nên quá lớn trước mặt Yahweh,[a] và Yahweh đã sai chúng tôi đến hủy diệt nó.
  to: Vì chúng tôi sắp hủy diệt nơi này, bởi vì tiếng kêu của họ đã trở nên lớn trước mặt Yahweh,[a] và Yahweh đã sai chúng tôi để hủy diệt nơi này.
  rationale: Sửa tối thiểu để tránh tăng cường nghĩa của גָדְלָה bằng “quá”, đồng thời dùng cấu trúc mục đích tự nhiên hơn và làm rõ quy chiếu của hậu tố giống cái trong לְשַׁחֲתָהּ. Chú thích vẫn giữ cả cách đọc hình thức lẫn cách hiểu theo ngữ cảnh.
