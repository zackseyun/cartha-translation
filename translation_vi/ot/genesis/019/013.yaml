id: GEN.19.13
reference: Genesis 19:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: vi
  text: Vì chúng tôi sắp hủy diệt nơi này, bởi vì tiếng kêu của họ đã trở nên lớn trước mặt Yahweh,[a] và Yahweh đã sai chúng tôi để hủy diệt nơi này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi vì tiếng kêu tố cáo họ đã trở nên lớn trước mặt Yahweh.” Theo hình thức, tiếng Hê-bơ-rơ là “tiếng kêu của họ”, nhưng trong ngữ cảnh, nhiều người hiểu đây là tiếng kêu được cất lên tố cáo những người ở nơi này.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: sắp hủy diệt
  rationale: Phân từ Hifil số nhiều có thể chỉ hành động đang diễn ra hoặc sắp xảy ra; trong lời báo trước về sự phán xét, “sắp hủy diệt” diễn đạt tự nhiên sắc thái cận tương lai.
- source_word: הַמָּקוֹם הַזֶּה
  choice: nơi này
  rationale: Giữ nguyên nghĩa chỉ nơi chốn và sắc thái chỉ định của cụm từ Hê-bơ-rơ.
- source_word: גָדְלָה
  choice: đã trở nên quá lớn
  rationale: Động từ Qal hoàn thành mô tả mức độ đã gia tăng và đạt đến tình trạng lớn; “quá lớn” diễn đạt tự nhiên mức độ nghiêm trọng trong ngữ cảnh.
- source_word: צַעֲקָתָם
  choice: tiếng kêu của họ
  rationale: Danh từ chỉ tiếng kêu đau khổ hoặc tố cáo, với hậu tố ngôi ba số nhiều. Cách dịch này giữ nguyên cấu trúc hình thức và không quyết định thay câu hỏi tiếng kêu do họ cất lên hay là lời kêu tố cáo họ.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ chỉ điều đến trước sự hiện diện và sự xét xử của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: đã sai chúng tôi
  rationale: Diễn đạt hành động sai phái đã hoàn tất nhưng có hiệu lực trong sứ mạng hiện tại.
- source_word: לְשַׁחֲתָהּ
  choice: đến hủy diệt nó
  rationale: Động từ nguyên thể nêu mục đích của việc sai phái; đại từ giống cái trong tiếng Hê-bơ-rơ quy chiếu về nơi hoặc thành, được dịch tự nhiên trong tiếng Việt là “nó”.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản văn dùng trực tiếp danh riêng YHWH; “Yahweh” bảo tồn danh riêng thay vì thay thế bằng tước hiệu.
- issue: Ý nghĩa của צַעֲקָתָם
  choice: tiếng kêu của họ
  alternative: tiếng kêu tố cáo họ
  rationale: Hậu tố Hê-bơ-rơ theo hình thức là “của họ”, nhưng ngữ cảnh có thể chỉ tiếng kêu được cất lên chống lại dân thành. Bản chính giữ sự mơ hồ, còn cách hiểu theo ngữ cảnh được ghi ở chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “hủy diệt” để giữ sức nặng của lời phán xét và lặp lại cùng một gốc động từ trong hai vế. Đặt dấu chú thích ngay sau mệnh đề có cách hiểu khác.
