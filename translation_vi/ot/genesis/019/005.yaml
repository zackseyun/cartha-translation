  text: וַ/יִּקְרְא֤וּ אֶל לוֹט֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ אַיֵּ֧ה הָ/אֲנָשִׁ֛ים אֲשֶׁר בָּ֥אוּ אֵלֶ֖י/ךָ הַ/לָּ֑יְלָה הוֹצִיאֵ֣/ם אֵלֵ֔י/נוּ וְ/נֵדְעָ֖ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: vi
  text: 'Họ gọi Lót và nói với ông: “Những người đàn ông đến chỗ ông đêm nay đâu rồi? Hãy đưa họ ra cho chúng tôi để chúng tôi biết họ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong văn cảnh, câu này có thể nói rõ hơn là: “để chúng tôi quan hệ tình dục với họ.” Tiếng Hê-bơ-rơ viết là “biết họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: Họ gọi Lót
  rationale: Động từ קרא kèm אֶל trong văn cảnh này có nghĩa tự nhiên là gọi một người; bản dịch không tự ý thêm sắc thái mạnh như “gào” hay “hét”.
- source_word: הָאֲנָשִׁים
  choice: những người đàn ông
  rationale: Danh từ số nhiều giống đực ở đây chỉ các vị khách nam, nên cần dịch rõ giới tính thay vì dùng từ chung “những người”.
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: đến chỗ ông đêm nay
  rationale: “Đến chỗ ông” diễn đạt tự nhiên hướng đến nơi Lót đang ở; “đêm nay” chuyển tải nghĩa thời gian của הַלָּיְלָה trong văn cảnh.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: Hãy đưa họ ra cho chúng tôi
  rationale: Dạng Hiphil của יצא mang nghĩa khiến ai đó đi ra; “đưa họ ra” vừa tự nhiên vừa giữ nguyên lực của mệnh lệnh.
- source_word: וְנֵדְעָה אֹתָם
  choice: để chúng tôi biết họ
  rationale: ידע theo nghĩa từ vựng cơ bản là “biết”. Cách dịch này giữ nguyên lối diễn đạt và sự căng thẳng của nguyên văn; hàm ý tình dục rất có khả năng trong văn cảnh được giải thích ở chú thích.
theological_decisions:
- issue: Có nên nói rõ ý định tình dục trong וְנֵדְעָה אֹתָם ngay ở chính văn hay không
  choice: Giữ cách nói “biết họ” trong chính văn và giải thích nghĩa tình dục trong chú thích.
  alternative: Dịch trực tiếp là “quan hệ tình dục với họ” hoặc diễn giải là “xâm hại tình dục họ”.
  rationale: Nguyên văn dùng động từ thông thường “biết”; dù văn cảnh cho thấy rõ một ý định tình dục mang tính cưỡng ép và thù địch, đưa cách diễn giải ấy thẳng vào chính văn sẽ thu hẹp lối nói của tiếng Hê-bơ-rơ. Chú thích giúp người đọc hiểu hàm ý mà vẫn bảo toàn hình thức và độ căng của nguyên tác.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” để chỉ Lót và cấu trúc hỏi “đâu rồi?” cho lời thoại tự nhiên. Cụm “biết họ” hơi khác cách nói thông thường của tiếng Việt nhưng được chủ ý giữ lại để phản ánh lối diễn đạt của nguyên văn; chú thích làm rõ hàm ý.
