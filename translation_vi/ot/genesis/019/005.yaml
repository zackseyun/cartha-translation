  terminology: “Lót”, “những người đàn ông”, và “Tiếng Hê-bơ-rơ” nhất quán, chuẩn hiện đại. Chú thích nêu nghĩa tình dục theo văn cảnh mà không biến bản dịch chính thành một diễn giải mạnh hơn nguyên văn.
