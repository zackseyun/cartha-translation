  source_fidelity: 'Bản dịch bám sát trình tự và các yếu tố chính của tiếng Hê-bơ-rơ: họ gọi Lót, hỏi về các người đàn ông đã đến với ông trong đêm, ra lệnh đưa họ ra, rồi nêu mục đích bằng động từ “biết”. “Đưa họ ra cho chúng tôi” phản ánh đúng sắc thái sai khiến của הוֹצִיאֵם אֵלֵינוּ. Việc giữ “biết họ” trong chính văn bảo toàn cách nói của nguyên ngữ và không áp đặt một diễn giải vào bản văn.'
