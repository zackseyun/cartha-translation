base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: vi
  text: Mặt trời đã mọc trên đất[a], và Lót đã đến Xô-a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trên trái đất”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Mặt trời mọc trên đất, và Lót đến Xô-a.” Các động từ hoàn thành trong tiếng Hê-bơ-rơ không tự chúng xác định rằng phải dịch bằng cấu trúc “đã… rồi” hay bằng thì quá khứ đơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: mặt trời
  rationale: Danh từ có mạo từ xác định; đây là cách diễn đạt tự nhiên và chuẩn trong tiếng Việt.
- source_word: יָצָא
  choice: đã mọc
  rationale: Động từ יצא theo nghĩa đen là “đi ra”, nhưng khi chủ ngữ là mặt trời thì chỉ việc mặt trời mọc.
- source_word: עַל הָאָרֶץ
  choice: trên vùng đất
  rationale: עַל mang nghĩa “trên”; אֶרֶץ có thể là “đất/vùng đất” hoặc “trái đất”. Trong bối cảnh địa phương của câu chuyện, “vùng đất” tự nhiên hơn mà không mở rộng ý thành toàn thể địa cầu.
- source_word: וְלוֹט
  choice: và Lót
  rationale: Liên từ đơn giản đi với tên riêng; “Lót” là dạng phiên âm quen thuộc, rõ ràng trong tiếng Việt.
- source_word: בָּא
  choice: đã đến
  rationale: Động từ בוא có nghĩa “đến, đi vào”. “Đã đến” diễn đạt tự nhiên một hành động hoàn tất, đồng thời không áp đặt quan hệ thời gian quá mức giữa hai động từ hoàn thành trong tiếng Hê-bơ-rơ.
- source_word: צֹעֲרָה
  choice: đến Xô-a
  rationale: Tên địa danh có hậu tố chỉ hướng, biểu thị chuyển động về phía hoặc vào địa điểm ấy; “đến Xô-a” là cách nói tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đã” để biểu thị hai hành động hoàn tất nhưng tránh thêm “khi… thì” hoặc “trước khi”, vì nguyên văn chỉ nối hai mệnh đề bằng “và” và không minh định quan hệ thời gian chính xác hơn.
