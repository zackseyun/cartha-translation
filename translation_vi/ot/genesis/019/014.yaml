revisions:
- from: 'Lót đi ra nói với các chàng rể[a], là những người sắp cưới các con gái ông: “Hãy đứng dậy, ra khỏi nơi này, vì Yahweh sắp hủy diệt thành.” Nhưng các chàng rể tưởng ông đang nói đùa.[b]'
  to: 'Lót đi ra và nói với các chàng rể[a], là những người sắp cưới các con gái ông: “Hãy đứng dậy, ra khỏi nơi này, vì Yahweh sắp hủy diệt thành phố này.” Nhưng các chàng rể tưởng ông chỉ nói đùa.[b]'
  rationale: 'Bản sửa chỉ điều chỉnh độ tự nhiên và độ chính xác sắc thái: nối rõ trình tự hành động, dùng cụm từ tiếng Việt thông dụng cho thành phố bị hủy diệt, và diễn đạt câu cuối như nhận định của các chàng rể. Tính mơ hồ có chủ ý của חֲתָנָיו và לֹקְחֵי בְנֹתָיו vẫn được giữ trong bản văn và chú thích.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:06:20Z'
