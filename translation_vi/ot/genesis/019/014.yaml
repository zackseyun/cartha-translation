  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: vi
  text: 'Lót đi ra và nói với các chàng rể[a], là những người sắp cưới các con gái ông: “Hãy đứng dậy, ra khỏi nơi này, vì Yahweh sắp hủy diệt thành phố này.” Nhưng các chàng rể tưởng ông chỉ nói đùa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các con rể của ông, là những người đã cưới các con gái ông.” Cụm từ Hê-bơ-rơ có thể chỉ những người đã cưới hoặc những người đã đính hôn và sắp cưới các con gái của Lót.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “ông như một người nói đùa trong mắt các chàng rể của mình.”'
    reason: literal_rendering
lexical_decisions:
- source_word: חֲתָנָיו
  choice: các chàng rể
  rationale: חָתָן có thể chỉ chàng rể hoặc con rể. “Các chàng rể” là cách gọi tự nhiên, đồng thời không tự nó quyết định hôn lễ đã hoàn tất hay chưa.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: là những người sắp cưới các con gái ông
  rationale: Phân từ לֹקְחֵי trong ngữ cảnh hôn nhân có thể chỉ những người lấy các con gái của Lót làm vợ. Cách dịch “sắp cưới” phù hợp mạch truyện, nhưng sự mơ hồ về tình trạng hôn nhân được ghi nhận trong chú thích.
- source_word: קוּמוּ צְּאוּ
  choice: Hãy đứng dậy, ra khỏi
  rationale: Hai mệnh lệnh liên tiếp diễn tả sự khẩn cấp; cách dịch giữ đủ cả ý đứng dậy và rời khỏi nơi ấy.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: khỏi nơi này
  rationale: Giữ sát giới từ chỉ sự rời khỏi và đại từ chỉ định “này”, bằng lối nói tự nhiên trong tiếng Việt.
- source_word: מַשְׁחִית
  choice: sắp hủy diệt
  rationale: Phân từ Hiphil diễn tả hành động hủy diệt đang cận kề nhưng chưa xảy ra; “sắp” truyền đạt rõ tính sắp xảy đến.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng יהוה thay vì thay thế bằng một tước hiệu.
- source_word: הָעִיר
  choice: thành
  rationale: Danh từ xác định chỉ thành đang được nói đến; tiếng Việt có thể lược từ chỉ định mà vẫn xác định rõ theo ngữ cảnh.
- source_word: כִּמְצַחֵק
  choice: đang nói đùa
  rationale: Dạng Piel của צחק ở đây chỉ việc đùa cợt hoặc nói không nghiêm túc; “nói đùa” phù hợp tự nhiên và không diễn giải quá mức thành chế nhạo.
- source_word: בְּעֵינֵי חֲתָנָיו
  choice: các chàng rể tưởng
  rationale: Thành ngữ “trong mắt” diễn tả cách họ nhìn nhận Lót; “tưởng” chuyển tải tự nhiên nhận định chủ quan ấy trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời. Giữ “Yahweh” giúp phân biệt danh này với các tước hiệu.
- issue: Tình trạng hôn nhân của các chàng rể
  choice: những người sắp cưới các con gái ông
  alternative: những người đã cưới các con gái ông
  rationale: Cụm phân từ Hê-bơ-rơ có thể được hiểu theo cả hai cách. Mạch truyện nghiêng về hôn ước chưa hoàn tất, nhưng bản dịch không che giấu cách hiểu khác và nêu rõ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời cảnh báo dùng các mệnh lệnh ngắn để giữ sắc thái khẩn cấp. Cách nói tự nhiên “các chàng rể tưởng” được dùng trong câu chính, còn hình ảnh nguyên văn “trong mắt” được bảo lưu ở chú thích.
