  text: וַֽ/יִּתְמַהְמָ֓הּ וַ/יַּחֲזִ֨קוּ הָ/אֲנָשִׁ֜ים בְּ/יָד֣/וֹ וּ/בְ/יַד אִשְׁתּ֗/וֹ וּ/בְ/יַד֙ שְׁתֵּ֣י בְנֹתָ֔י/ו בְּ/חֶמְלַ֥ת יְהוָ֖ה עָלָ֑י/ו וַ/יֹּצִאֻ֥/הוּ וַ/יַּנִּחֻ֖/הוּ מִ/ח֥וּץ לָ/עִֽיר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: vi
  text: Nhưng ông vẫn chần chừ, nên những người đàn ông ấy[a] nắm chặt lấy tay ông, tay vợ ông và tay hai con gái ông[b], vì Yahweh thương xót ông. Họ đưa ông ra và đặt ông ở bên ngoài thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ gọi họ là “những người đàn ông”; theo ngữ cảnh, họ là các sứ giả thiên thượng.
    reason: Giữ nguyên cách gọi trong câu đồng thời làm rõ nhận diện từ ngữ cảnh.
  - marker: b
    text: 'Nguyên văn lặp từ “tay”: “tay ông, tay vợ ông và tay hai con gái ông”.'
    reason: Cho biết cấu trúc lặp nhấn mạnh trong tiếng Hê-bơ-rơ và cách hiểu tự nhiên rằng mỗi con gái được nắm một tay.
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: ông vẫn chần chừ
  rationale: Động từ diễn tả việc trì hoãn, nấn ná giữa tình thế khẩn cấp; “vẫn chần chừ” tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành chỉ sự do dự trong tâm trí.
- source_word: הָאֲנָשִׁים
  choice: những người đàn ông ấy
  rationale: Giữ nguyên cách gọi của câu Hê-bơ-rơ là “những người đàn ông”, thay vì giải nghĩa ngay trong chính văn là các thiên sứ.
- source_word: וַיַּחֲזִקוּ
  choice: nắm chặt lấy
  rationale: Trong cấu trúc này, động từ chỉ việc giữ hoặc nắm một cách mạnh mẽ; cách dịch thể hiện tính khẩn cấp của cuộc giải cứu.
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: tay ông, tay vợ ông và tay hai con gái ông
  rationale: Giữ sự lặp lại của “tay” ở mức tự nhiên trong tiếng Việt; cụm cuối có thể hiểu là mỗi người con gái được nắm một tay.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: vì Yahweh thương xót ông
  rationale: Truyền đạt tự nhiên quan hệ nguyên nhân và giữ rõ lòng thương xót của Yahweh là động lực của hành động giải cứu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng tên riêng của Đức Chúa Trời theo cách phiên âm được dự án chọn, thay vì thay bằng một tước hiệu.
- source_word: וַיֹּצִאֻהוּ
  choice: họ đưa ông ra
  rationale: Thể sai khiến của יצא có nghĩa làm cho một người đi ra; “đưa ông ra” phù hợp với hành động cứu thoát trong ngữ cảnh.
- source_word: וַיַּנִּחֻהוּ
  choice: đặt ông
  rationale: Diễn đạt hành động đưa ông đến và đặt ông tại một vị trí, không hàm ý bỏ mặc như “bỏ ông lại” có thể gợi ra.
- source_word: מִחוּץ לָעִיר
  choice: ở bên ngoài thành
  rationale: Chỉ vị trí ngoài ranh giới thành sau khi ông được đưa ra.
theological_decisions:
- issue: Cách nhận diện những người giải cứu
  choice: những người đàn ông ấy
  alternative: các thiên sứ
  rationale: Ngữ cảnh rộng hơn cho thấy họ là các sứ giả thiên thượng, nhưng chính câu này gọi họ là “những người đàn ông”. Bản dịch giữ cách gọi của nguyên văn và để thông tin ngữ cảnh trong chú thích.
- issue: Động lực của việc giải cứu
  choice: vì Yahweh thương xót ông
  alternative: trong lòng thương xót của Yahweh đối với ông
  rationale: Giới từ בְּ ở đây tự nhiên nhất mang ý nghĩa nguyên nhân hoặc hoàn cảnh. Cách dịch đã chọn giữ Yahweh là chủ thể của lòng thương xót mà không thêm cách giải thích thần học.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu ngắn và rõ. Dùng “ông” cho Lót theo ngữ cảnh, “thành” thay vì từ cổ hơn, đồng thời giữ tên Yahweh và sự lặp từ có ý nghĩa của nguyên văn.
