base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: vi
  text: Hai vị ấy đánh những người đàn ông ở lối vào nhà, khiến họ bị mù lòa[a], từ nhỏ đến lớn, đến nỗi họ kiệt sức vì cố tìm lối vào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị lóa mắt” hoặc “bị rối loạn thị giác”; từ Hê-bơ-rơ hiếm gặp này có thể chỉ một tình trạng khác với chứng mù thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: đánh cho bị
  rationale: Thể Hiphil của נכה mang nghĩa “đánh” hoặc “giáng họa”; kết hợp với tình trạng mù lòa, “đánh cho bị” giữ sắc thái tác động gây nên mà vẫn tự nhiên trong tiếng Việt.
- source_word: הָאֲנָשִׁים
  choice: những người đàn ông
  rationale: Danh từ số nhiều giống đực ở đây chỉ đám đàn ông tụ tập bên ngoài nhà Lót; cách dịch này chính xác theo ngữ cảnh.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: ở trước lối vào nhà
  rationale: Cụm này xác định vị trí của những người đàn ông. “Lối vào nhà” bao quát hơn “cửa” và giữ được nghĩa của פֶּתַח.
- source_word: בַּסַּנְוֵרִים
  choice: bị mù lòa
  rationale: סַנְוֵרִים là từ hiếm, chỉ tình trạng thị giác bị tác động khiến người ta không thể nhìn hoặc định hướng bình thường. “Mù lòa” truyền đạt nghĩa chính, còn sắc thái chưa chắc chắn được giữ trong chú thích.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: từ người nhỏ đến người lớn
  rationale: Giữ nguyên thành ngữ bao quát của tiếng Hê-bơ-rơ mà không tự ý xác định là tuổi tác hay địa vị.
- source_word: וַיִּלְאוּ
  choice: kiệt sức
  rationale: Động từ לָאָה diễn tả sự mệt mỏi, kiệt quệ do nỗ lực vô ích; “kiệt sức” gọn và rõ trong tiếng Việt hiện đại.
- source_word: לִמְצֹא
  choice: vì cố tìm
  rationale: Động từ nguyên mẫu nêu mục tiêu của nỗ lực khiến họ mệt kiệt; “cố tìm” thể hiện đúng sự tìm kiếm kéo dài nhưng thất bại.
- source_word: הַפָּתַח
  choice: lối vào
  rationale: פֶּתַח có thể là lối vào, ô cửa hoặc cửa ra vào; “lối vào” tránh ngụ ý về cánh cửa và phù hợp với việc họ không thể định vị chỗ đi vào.
theological_decisions:
- issue: Bản chất của tình trạng סַנְוֵרִים
  choice: một tình trạng mù lòa được gây ra cách siêu nhiên
  alternative: lóa mắt hoặc rối loạn thị giác, mất khả năng định hướng
  rationale: Mạch truyện cho thấy thị giác của đám đông bị tác động khiến họ không tìm được lối vào, nhưng từ Hê-bơ-rơ hiếm này có thể hàm ý nhiều hơn chứng mù thông thường. Bản dịch chính dùng cách diễn đạt rõ nghĩa, còn chú thích bảo lưu độ bất định.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Đại từ “họ” chỉ hai vị khách thiên sứ; “chúng” chỉ đám đàn ông có hành vi thù nghịch, giúp phân biệt hai chủ thể trong cùng câu. Dùng “từ người nhỏ đến người lớn” để bảo lưu tính mở của thành ngữ Hê-bơ-rơ về tuổi tác, địa vị hoặc mức độ quan trọng.
