language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: vi
  text: 'Ông nói: “Thưa các ngài, xin hãy ghé vào nhà đầy tớ các ngài, nghỉ lại qua đêm và rửa chân. Sáng sớm, các ngài có thể dậy rồi lên đường.” Nhưng họ đáp: “Không, chúng tôi sẽ nghỉ đêm tại quảng trường[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ một khoảng đất công cộng rộng, thoáng trong thành, như quảng trường hay khu họp chợ, chứ không chỉ là đường phố.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: Thưa ... xin
  rationale: Cụm từ có chức năng thu hút sự chú ý và bày tỏ lời khẩn khoản lịch sự; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ sắc thái kính trọng.
- source_word: אֲדֹנַי
  choice: các ngài
  rationale: Ngữ cảnh và các động từ, đại từ số nhiều cho thấy Lót đang kính cẩn nói với hai vị khách; “các ngài” trang trọng và không khiến người đọc hiểu đây là danh xưng thần linh.
- source_word: סוּרוּ נָא אֶל בֵּית עַבְדְּכֶם
  choice: xin hãy ghé vào nhà đầy tớ các ngài
  rationale: “Ghé vào” diễn đạt tự nhiên hành động rời đường để vào nhà; “đầy tớ các ngài” giữ công thức tự hạ mình của Lót.
- source_word: וְלִינוּ
  choice: nghỉ lại qua đêm
  rationale: Diễn đạt rõ việc lưu trú tại nhà của Lót trong đêm.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: rửa chân
  rationale: Giữ nguyên hình ảnh cụ thể và tập tục tiếp khách cổ đại.
- source_word: וְהִשְׁכַּמְתֶּם וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: Sáng sớm, các ngài có thể lên đường
  rationale: Truyền đạt việc dậy sớm rồi tiếp tục hành trình trong khuôn khổ lời mời, không biến nó thành mệnh lệnh cứng.
- source_word: לֹא כִּי
  choice: Không
  rationale: Trong lời đáp, כִּי sau lời phủ định có sắc thái đối lập/đính chính; tiếng Việt tự nhiên có thể thể hiện quan hệ ấy bằng câu tiếp theo mà không cần dịch máy móc là “nhưng”.
- source_word: בָרְחוֹב
  choice: ngoài quảng trường
  rationale: Danh từ chỉ khu đất công cộng rộng, thoáng trong thành, không đơn thuần là lòng đường; “ngoài quảng trường” cũng làm rõ họ định ngủ ở không gian công cộng.
- source_word: נָלִין
  choice: nghỉ đêm
  rationale: Giữ cùng ý nghĩa của gốc לין nhưng tránh lặp nặng nề trong câu tiếng Việt.
theological_decisions:
- issue: אֲדֹנַי là danh xưng thần linh hay lời xưng hô với người
  choice: Dịch là “các ngài”, một lời xưng hô kính trọng ở số nhiều
  alternative: “ngài” ở số ít, hoặc “Chúa” như danh xưng thần linh
  rationale: Lót đang nói với hai vị khách, và toàn câu dùng các hình thức số nhiều. Bản dịch chính không áp đặt việc ông trực tiếp xưng hô với Đức Chúa Trời, đồng thời vẫn giữ sự kính trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa các ngài, xin hãy...” giữ phép lịch sự khẩn khoản; “đầy tớ các ngài” chủ ý bảo tồn lối tự xưng khiêm nhường của nguyên văn. Dấu chân chú [a] xuất hiện ngay sau từ được chú giải.
