base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: vi
  text: 'Người con gái đầu lòng nói với cô em: “Cha chúng ta đã già, mà trong xứ không có người đàn ông nào để đến ăn ở với chúng ta[a] theo lẽ thường của cả thế gian[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng lối nói giảm nói tránh, theo nghĩa đen là “đến/vào với chúng ta”, chỉ việc quan hệ tình dục.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “theo lẽ thường của cả thế gian” chỉ tập quán hoặc quy luật thông thường của loài người; trong ngữ cảnh này, cụm từ nói đến việc nam nữ kết hợp để duy trì dòng dõi.
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: người con gái đầu lòng
  rationale: Giữ ý về thứ tự sinh của danh từ giống cái trong tiếng Hê-bơ-rơ, đồng thời nêu rõ đây là người con gái theo ngữ cảnh.
- source_word: הַצְּעִירָה
  choice: cô em
  rationale: Diễn đạt tự nhiên quan hệ đối ứng với người con gái đầu lòng; giống cái và quan hệ chị em đã rõ trong ngữ cảnh.
- source_word: אָבִינוּ זָקֵן
  choice: Cha chúng ta đã già
  rationale: Diễn đạt tự nhiên mệnh đề không có động từ trong tiếng Hê-bơ-rơ; “đã già” nhấn mạnh tình trạng tuổi tác hiện tại mà không thêm ý ngoài văn bản.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: mà trong xứ này không có người đàn ông nào
  rationale: Giữ rõ nghĩa chỉ nam giới của אִישׁ. “Trong xứ này” là cách nói tự nhiên và phù hợp với điểm nhìn địa phương trong lời của hai người con gái, dù הָאָרֶץ cũng có thể mang nghĩa rộng hơn là “đất/thế gian”.
- source_word: לָבוֹא עָלֵינוּ
  choice: để vào với chúng ta
  rationale: Giữ lối nói giảm nói tránh về quan hệ tình dục của nguyên văn thay vì chuyển thẳng thành một diễn giải minh nhiên; chú thích làm rõ nghĩa trong ngữ cảnh.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: theo lẽ thường của cả thế gian
  rationale: Chuyển thành tiếng Việt tự nhiên ý về lệ thường phổ quát của loài người, trong khi vẫn giữ phạm vi rộng của “cả thế gian”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Bản dịch giữ lối nói giảm nói tránh của nguyên văn, đồng thời dùng chú thích để bảo đảm độc giả phổ thông hiểu đúng; không làm nhẹ đi hoặc biện minh cho ý định của các nhân vật.
