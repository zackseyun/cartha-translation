  to: 'Người con gái đầu lòng nói với cô em: “Cha chúng ta đã già, mà trong xứ không có người đàn ông nào để đến ăn ở với chúng ta[a] theo lẽ thường của cả thế gian[b].”'
  rationale: Chỉnh một cụm từ theo hướng tự nhiên hơn trong tiếng Việt, đồng thời giữ uyển ngữ của bản văn và làm rõ qua chú thích rằng cách diễn đạt tiếng Việt không phải là bản dịch từng chữ của thành ngữ Hê-bơ-rơ. Bỏ “này” sau “xứ” để không thêm chỉ định ngữ không có trong nguyên văn.
