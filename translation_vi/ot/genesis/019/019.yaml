source:
  edition: WLC
  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: vi
  text: “Thưa ngài, tôi tớ ngài đã được ơn trước mắt ngài, và ngài đã bày tỏ đối với tôi lòng nhân từ lớn lao[a] của ngài qua việc bảo toàn mạng sống tôi. Nhưng tôi không thể chạy thoát lên núi; e rằng tai họa[b] sẽ bắt kịp tôi và tôi sẽ chết.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tình yêu thành tín” hoặc “lòng thương xót.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “điều dữ”; trong ngữ cảnh này chỉ tai họa có thể ập đến với Lót.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Này, xin ngài đoái xem
  rationale: הִנֵּה kêu gọi người nghe chú ý, còn נָא biểu thị lời khẩn khoản lịch sự. Cách dịch này giữ cả hai sắc thái và phù hợp với lời cầu xin trang trọng trong tiếng Việt.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: đã được ơn trước mắt ngài
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về việc được người khác nhìn đến với thiện cảm, đồng thời vẫn dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
- source_word: עַבְדְּךָ
  choice: tôi tớ ngài
  rationale: Trong lời thưa với bậc trên, từ này là cách tự xưng khiêm nhường; ngữ cảnh không nhấn mạnh địa vị nô lệ.
- source_word: וַתַּגְדֵּל חַסְדְּךָ אֲשֶׁר עָשִׂיתָ עִמָּדִי
  choice: ngài đã tỏ lòng nhân từ lớn lao đối với tôi
  rationale: Diễn đạt tự nhiên hành động làm cho חֶסֶד trở nên lớn lao qua việc thực thi nó, không biến cấu trúc Hê-bơ-rơ thành một câu tiếng Việt gượng ép.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: bằng cách bảo toàn mạng sống tôi
  rationale: נֶפֶשׁ ở đây chỉ chính mạng sống của Lót; cách dịch này diễn tả việc giữ cho ông còn sống mà không đưa thêm hàm ý cứu rỗi.
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: Nhưng tôi không thể
  rationale: Liên từ mở đầu tạo thế tương phản với ân huệ vừa được nhắc đến; đại từ אָנֹכִי nhấn mạnh người nói.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: chạy thoát lên núi
  rationale: Giữ ý thoát nạn của động từ và hướng chuyển động về phía núi được biểu thị bằng hậu tố chỉ hướng.
- source_word: פֶּן תִּדְבָּקַנִי הָרָעָה
  choice: e rằng tai họa sẽ bắt kịp tôi
  rationale: פֶּן dẫn vào hậu quả đáng sợ; דבק theo ngữ cảnh mang nghĩa đuổi kịp hoặc chạm tới, còn רָעָה chỉ tai họa đang đe dọa.
theological_decisions:
- issue: Ý nghĩa của חֶסֶד trong lời Lót thưa với vị đại diện thi hành quyền của Đức Chúa Trời
  choice: lòng nhân từ
  alternative: tình yêu thành tín; lòng thương xót
  rationale: “Lòng nhân từ” truyền đạt hành động ưu ái, đầy ân tình đã bảo toàn mạng sống Lót, đồng thời không áp đặt rằng từ này tại đây nhất thiết là một thuật ngữ giao ước chuyên biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “ngài” giữ thái độ kính trọng của Lót mà không tự ý xác định rõ hơn căn tính của người được ông trực tiếp thưa chuyện. Cấu trúc “được ơn trước mắt” được giữ có chủ ý để bảo tồn hình ảnh Hê-bơ-rơ.
