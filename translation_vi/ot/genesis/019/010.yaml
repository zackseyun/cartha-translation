base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: vi
  text: Nhưng những người đàn ông ấy[b] đưa tay ra[a], đưa Lót vào trong nhà với họ, rồi đóng cửa lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giơ tay ra.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ gọi họ là “những người đàn ông”; ngữ cảnh rộng hơn cho biết họ là các sứ giả thiên thượng.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: đưa tay ra
  rationale: Đây là một thành ngữ chỉ hành động chìa hoặc giơ tay ra. “Đưa tay ra” tự nhiên trong tiếng Việt và không diễn giải quá mức thành “kéo”.
- source_word: הָאֲנָשִׁים
  choice: hai người đàn ông ấy
  rationale: Danh từ Hê-bơ-rơ có nghĩa thông thường là “những người đàn ông”; số “hai” được xác định rõ từ ngữ cảnh gần. Cách dịch này giữ cách gọi của câu thay vì đổi thành “các thiên sứ”.
- source_word: וַיָּבִיאוּ
  choice: đưa ... vào
  rationale: Dạng khiến khiến của בוא mang nghĩa “đem/đưa vào”. “Đưa Lót vào” sát nghĩa hơn cách diễn giải mạnh hơn là “kéo Lót vào”.
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: vào trong nhà với mình
  rationale: Cụm từ vừa chỉ hướng chuyển động vào nhà, vừa cho biết Lót được đưa đến chỗ họ. “Với mình” diễn đạt đại từ phản thân số nhiều tự nhiên trong tiếng Việt.
- source_word: הַדֶּלֶת סָגָרוּ
  choice: đóng cửa lại
  rationale: “Đóng cửa lại” là cách diễn đạt tự nhiên, rõ ràng cho hành động đóng cánh cửa trong mạch kể khẩn cấp.
- source_word: וַ
  choice: Nhưng ... rồi
  rationale: Liên từ đầu câu mang sắc thái tương phản với hành động của đám đông ở câu trước, còn liên từ sau nối tiếp chuỗi hành động nhanh.
theological_decisions:
- issue: Có nên gọi הָאֲנָשִׁים trực tiếp là các thiên sứ hay không
  choice: Giữ cách gọi “hai người đàn ông ấy” trong chính văn
  alternative: hai thiên sứ; hai vị khách
  rationale: Ngữ cảnh rộng hơn cho biết họ là sứ giả thiên thượng, nhưng chính câu này dùng danh từ thông thường “những người đàn ông”. Bản dịch giữ cách gọi của nguyên văn và giải thích căn tính của họ trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc liên hoàn giữ nhịp hành động nhanh của nguyên văn; không thêm mức độ bạo lực mà động từ Hê-bơ-rơ không nói rõ.
