id: GEN.19.25
reference: Genesis 19:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: vi
  text: Ngài lật đổ các thành ấy[a], toàn vùng đồng bằng[b], tất cả cư dân trong các thành và cây cỏ mọc lên từ đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lật nhào.” Động từ Hê-bơ-rơ có thể nhấn mạnh việc bị đảo lộn một cách thảm khốc.
    reason: lexical_alternative
  - marker: b
    text: “Vùng đồng bằng” ở đây chỉ địa hạt đồng bằng sông Giô-đanh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: lật đổ
  rationale: Động từ הפך ở đây diễn tả sự lật nhào, hủy diệt thảm khốc. “Lật đổ” giữ được hình ảnh cụ thể hơn “tiêu diệt” và vẫn tự nhiên trong tiếng Việt.
- source_word: הֶעָרִים הָאֵל
  choice: các thành ấy
  rationale: Đại từ chỉ định אֵל quy chiếu về những thành đã được nhắc đến; “các thành ấy” phù hợp với mạch kể tiếng Việt.
- source_word: כָּל הַכִּכָּר
  choice: toàn vùng đồng bằng
  rationale: Trong ngữ cảnh Sáng Thế Ký, כִּכָּר chỉ vùng đồng bằng thuộc khu vực sông Giô-đanh. Thêm “vùng” giúp diễn đạt đây là cả một địa hạt, không chỉ một bề mặt bằng phẳng.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: tất cả cư dân trong các thành
  rationale: Phân từ của ישב chỉ những người cư ngụ tại các thành; “cư dân” ngắn gọn, chính xác và trang trọng tự nhiên.
- source_word: צֶמַח הָאֲדָמָה
  choice: cây cỏ mọc lên từ đất
  rationale: צֶמַח chỉ những gì nảy mọc, còn אֲדָמָה là đất/đất đai. Cách diễn đạt này giữ hình ảnh sinh trưởng từ đất và dễ hiểu hơn lối danh hóa cứng.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của động từ số ít
  choice: Dùng “Ngài” nhưng không nêu đích danh chủ thể trong câu này.
  alternative: Nêu rõ “Đức Giê-hô-va” hoặc “Đức Chúa Trời”.
  rationale: Bản Hê-bơ-rơ dùng động từ số ít nhưng không lặp lại chủ ngữ trong chính mệnh đề này; ngữ cảnh trước xác định Đức Giê-hô-va là Đấng hành động. “Ngài” duy trì tính liên kết mà không thêm danh xưng vắng mặt trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo ngữ cảnh gần để chỉ Đức Giê-hô-va mà không đưa danh xưng vào nơi nguyên văn chỉ có chủ ngữ hàm ẩn; dùng “cây cỏ” theo nghĩa bao quát về thực vật mọc từ đất.
