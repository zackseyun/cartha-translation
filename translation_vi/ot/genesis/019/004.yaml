source:
  edition: WLC
  text: טֶרֶם֮ יִשְׁכָּבוּ֒ וְ/אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל הַ/בַּ֔יִת מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן כָּל הָ/עָ֖ם מִ/קָּצֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: vi
  text: Trước khi họ nằm xuống, những người đàn ông trong thành, tức là những người đàn ông Sô-đôm, đã vây quanh[a] ngôi nhà—từ trẻ đến già,[b] toàn thể dân chúng từ khắp nơi trong thành.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tụ tập quanh” hoặc “bao quanh”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “từ người trẻ đến người già”, một cách nói bao quát mọi độ tuổi.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “từ đầu mút/rìa”. Trong ngữ cảnh, cụm này chỉ người đến từ mọi phía, hay mọi nơi, trong thành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: Trước khi họ nằm xuống
  rationale: Diễn đạt trực tiếp quan hệ thời gian và giữ nghĩa cụ thể của động từ שׁכב là nằm xuống, trong ngữ cảnh là để nghỉ đêm.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: những người đàn ông trong thành, tức những người đàn ông Sô-đôm
  rationale: Giữ cách gọi mang giới tính nam của אַנְשֵׁי và thể hiện cụm thứ hai như lời đồng vị xác định thành ấy là Sô-đôm.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: đã vây quanh ngôi nhà
  rationale: נסב với עַל có thể chỉ việc bao quanh hoặc tụ tập xung quanh; “vây quanh” truyền đạt tự nhiên sắc thái đám đông khép kín quanh nhà trong ngữ cảnh.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: từ trẻ đến già
  rationale: Giữ phép chỉ toàn thể bằng hai đầu độ tuổi, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: כָּל הָעָם
  choice: toàn thể dân chúng
  rationale: Phản ánh danh từ tập thể עָם và không tự ý đổi nó thành một lần nhắc lại “những người đàn ông”.
- source_word: מִקָּצֶה
  choice: từ khắp các khu vực trong thành
  rationale: Từ này có nghĩa đen liên quan đến đầu mút hoặc rìa; trong câu, nó thường được hiểu theo nghĩa bao quát rằng dân chúng đến từ mọi khu vực. Bổ sung “trong thành” làm rõ đối tượng được ngầm hiểu.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính khi mô tả đám đông
  choice: Giữ “những người đàn ông” cho hai lần אַנְשֵׁי, nhưng dịch כָּל הָעָם là “toàn thể dân chúng”.
  alternative: Dịch tất cả các cụm đều theo nghĩa chung là “người dân trong thành”, hoặc thu hẹp כָּל הָעָם thành “tất cả đàn ông”.
  rationale: Bản Hê-bơ-rơ trước hết dùng cách gọi cụ thể là “những người đàn ông”, rồi dùng danh từ tập thể עָם. Giữ sự thay đổi này tránh làm phẳng cách diễn đạt của nguyên bản.
- issue: Phạm vi nghĩa của מִקָּצֶה
  choice: Dịch trong chính văn là “từ khắp các khu vực trong thành” và ghi chú nghĩa đen cùng cách hiểu khác.
  alternative: “đến người cuối cùng” hoặc “không sót một ai”.
  rationale: Cụm từ ngắn trong tiếng Hê-bơ-rơ có thể nhấn mạnh nguồn gốc từ mọi phía hoặc tính toàn diện của đám đông. Chính văn theo cách hiểu địa lý phù hợp ngữ cảnh, còn chú thích bảo tồn cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Giữ sự lặp lại có chủ ý của “những người đàn ông” nhưng dùng “tức” để quan hệ đồng vị được tự nhiên trong tiếng Việt. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
