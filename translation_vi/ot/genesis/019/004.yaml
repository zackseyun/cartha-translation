  source_fidelity: 'Chính văn nhìn chung phản ánh đúng cấu trúc và ý nghĩa tiếng Hê-bơ-rơ: “những người đàn ông” giữ được אַנְשֵׁי, “vây quanh” phù hợp với נָסַבּוּ עַל, và “từ trẻ đến già” bảo tồn phép nói bao quát. Tuy nhiên, chú thích [c] nêu cách hiểu “đến người cuối cùng” không phải là một cách thay thế trực tiếp, đủ vững của מִקָּצֶה trong cấu trúc câu này; cụm này ở đây tự nhiên chỉ nguồn gốc từ mọi phía/mọi nơi trong thành.'
