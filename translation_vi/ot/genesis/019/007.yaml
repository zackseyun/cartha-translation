  text: וַ/יֹּאמַ֑ר אַל נָ֥א אַחַ֖/י תָּרֵֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/007.yaml
  text: And he said, “Please, my brothers, do not do evil.”
translation:
  language: vi
  text: 'Ông nói: “Xin anh em đừng làm điều ác.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Ông nói
  rationale: Động từ kể chuyện thường dùng, với chủ thể được xác định từ văn cảnh; tiếng Việt không cần dịch riêng yếu tố nối וַ־ thành “và” trong câu này.
- source_word: אַל־נָא
  choice: xin ... đừng
  rationale: Kết hợp lời cấm אַל với tiểu từ khẩn khoản נָא, diễn đạt tự nhiên bằng cấu trúc cầu xin “xin ... đừng”.
- source_word: אַחַי
  choice: anh em
  rationale: Nghĩa đen là “anh em của tôi”, nhưng ở đây là cách Lot xưng hô với những người đàn ông cùng cộng đồng; “anh em” giữ được sắc thái thân tình và khẩn khoản.
- source_word: תָּרֵעוּ
  choice: làm điều ác
  rationale: Dạng động từ từ רעע ở đây chỉ việc hành động gian ác; “làm điều ác” sát nghĩa, rõ ràng và phù hợp với bản tham khảo đã được thẩm định.
theological_decisions:
- issue: Mức độ cụ thể của hành vi bị lên án
  choice: Giữ cách nói khái quát “làm điều ác”
  alternative: “hành động gian ác” hoặc nêu cụ thể hành vi theo văn cảnh
  rationale: Nguyên văn dùng động từ khái quát và chưa gọi đích danh hành vi trong chính câu này; bản dịch không nên diễn giải vượt quá câu nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời khẩn khoản ngắn gọn giữ nhịp mạnh của nguyên văn; không cần chú thích.
