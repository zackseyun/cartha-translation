  text: וַ/יַּעַל֩ ל֨וֹט מִ/צּ֜וֹעַר וַ/יֵּ֣שֶׁב בָּ/הָ֗ר וּ/שְׁתֵּ֤י בְנֹתָי/ו֙ עִמּ֔/וֹ כִּ֥י יָרֵ֖א לָ/שֶׁ֣בֶת בְּ/צ֑וֹעַר וַ/יֵּ֨שֶׁב֙ בַּ/מְּעָרָ֔ה ה֖וּא וּ/שְׁתֵּ֥י בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: vi
  text: Sau đó, Lót rời Xô-a, đi lên vùng núi và sống tại đó; hai con gái ông ở cùng ông, vì ông sợ sống tại Xô-a. Ông sống trong một hang đá[a] cùng với hai con gái mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “hang đá ấy”; mạo từ xác định có thể chỉ chính hang đá ông cư ngụ, dù khi lần đầu nhắc đến nơi ở này, tiếng Việt thường nói tự nhiên là “một hang đá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... מִצּוֹעַר
  choice: rời Xô-a, đi lên
  rationale: Giữ cả ý rời khỏi địa điểm do giới từ מִן và hướng đi lên theo địa hình của động từ עלה; cách diễn đạt tự nhiên hơn trong tiếng Việt so với chỉ nói “đi lên khỏi Xô-a”.
- source_word: וַיֵּשֶׁב
  choice: sống
  rationale: Trong ngữ cảnh này, ישב chỉ việc cư trú; “sống” là cách nói hiện đại, rõ ràng và không hàm ý định cư vĩnh viễn.
- source_word: בָּהָר
  choice: vùng núi
  rationale: Danh từ số ít הַר ở đây có thể chỉ địa hình theo nghĩa tập hợp. “Vùng núi” vừa gần với nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: hai con gái ông ở cùng ông
  rationale: Bổ sung động từ “ở” để chuyển cụm không có động từ của tiếng Hê-bơ-rơ thành câu tiếng Việt tự nhiên, đồng thời giữ nguyên quan hệ đồng hành.
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: vì ông sợ sống tại Xô-a
  rationale: כִּי nêu lý do; יָרֵא diễn tả trạng thái sợ hãi; לָשֶׁבֶת chỉ việc cư trú. Bản dịch giữ quan hệ nhân quả rõ ràng.
- source_word: בַּמְּעָרָה
  choice: trong một hang đá
  rationale: Dù tiếng Hê-bơ-rơ có mạo từ xác định, đây là lần đầu hang đá được nhắc đến trong diễn ngôn; “một hang đá” tự nhiên trong tiếng Việt. Dạng xác định được ghi ở chú thích để bảo toàn dữ kiện nguyên văn.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: cùng với hai con gái mình
  rationale: Chuyển cụm đồng vị nhấn mạnh những người ở trong hang thành cách diễn đạt tiếng Việt trôi chảy mà vẫn giữ đủ các nhân vật.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Xô-a” theo lối phiên âm tên riêng quen thuộc trong tiếng Việt; tránh từ cổ “cư ngụ” trong chính văn. Dấu chấm phẩy giúp tách mạch hành động khỏi chi tiết về hai con gái mà không làm đứt câu kể.
