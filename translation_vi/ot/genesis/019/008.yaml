source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: vi
  text: Này, tôi có hai con gái chưa từng quan hệ với đàn ông.[a] Xin cho tôi đưa chúng ra cho các người; các người thấy điều gì là tốt thì cứ làm với chúng. Chỉ xin đừng làm gì những người đàn ông này,[b] vì họ đã vào nương dưới bóng mái nhà tôi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “chưa biết đàn ông”; đây là cách nói chỉ việc chưa từng có quan hệ tình dục với đàn ông. Theo cách dịch truyền thống: “còn trinh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát trật tự câu: “Chỉ đối với những người đàn ông này, đừng làm gì cả.”'
    reason: source_syntax
  - marker: c
    text: “Dưới bóng mái nhà tôi” là hình ảnh diễn tả việc khách đã vào nhà và được đặt dưới sự che chở của gia chủ.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Này
  rationale: הִנֵּה thu hút sự chú ý khẩn cấp; נָא làm dịu lời nói theo sắc thái khẩn khoản. Trong tiếng Việt, “Này” mở lời tự nhiên, còn sắc thái van xin được thể hiện rõ hơn qua “xin” ở các mệnh đề tiếp theo.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: chưa từng ăn nằm với đàn ông
  rationale: יָדַע trong kết cấu này là cách nói chỉ quan hệ tình dục. “Ăn nằm với” là thành ngữ tiếng Việt rõ nghĩa, trang trọng vừa phải và không diễn giải thành một danh xưng như “trinh nữ”.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: Xin để tôi đưa chúng ra cho các người
  rationale: Dạng cohortative diễn tả lời đề nghị hoặc ý định của Lót; נָא mang sắc thái khẩn khoản. “Xin để tôi” giữ cả hai nét nghĩa ấy.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: các người thấy điều gì là tốt thì cứ làm cho chúng
  rationale: Giữ hình ảnh “tốt trong mắt các người” ở dạng tiếng Việt tự nhiên, đồng thời không làm nhẹ đi tính chất gây sốc của lời đề nghị.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: Chỉ xin đừng làm gì hai người này
  rationale: רַק đặt ra ngoại lệ mạnh đối với lời đề nghị trước đó. “Chỉ xin đừng” vừa tự nhiên trong tiếng Việt vừa giữ giọng van nài; “hai người” phù hợp với hai vị khách nam trong ngữ cảnh.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: vì họ đã đến
  rationale: 'Giữ quan hệ nguyên nhân: việc họ đến trú dưới mái nhà Lót là cơ sở cho nghĩa vụ bảo vệ khách.'
- source_word: בְּצֵל קֹרָתִי
  choice: nương dưới bóng mái nhà tôi
  rationale: Giữ hình ảnh nguyên văn về “bóng mái nhà”, đồng thời thêm động từ “nương” để ý nghĩa trú ẩn và được gia chủ che chở trở nên tự nhiên, dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Có nên làm nhẹ lời đề nghị gây sốc của Lót hay không
  choice: Giữ nguyên sức nặng trực tiếp của tiếng Hê-bơ-rơ, không uyển ngữ hóa
  alternative: Dùng cách nói giảm nhẹ như “hãy tùy ý đối xử với chúng”
  rationale: Bản văn thuật lại một đề nghị nghiêm trọng mà không yêu cầu người dịch xác nhận nó là đúng về đạo đức. Làm nhẹ lời văn sẽ che khuất sự căng thẳng và mức độ gây sốc vốn có.
- issue: Cụm “dưới bóng mái nhà” chỉ địa điểm hay hàm ý sự bảo hộ của chủ nhà
  choice: Giữ hình ảnh nguyên văn trong chính văn và giải thích hàm ý văn hóa ở chú thích
  alternative: Dịch thẳng thành “dưới sự bảo vệ của tôi”
  rationale: Nguyên văn dùng hình ảnh mái nhà. Việc giữ hình ảnh tránh thay thế ẩn dụ bằng lời giải nghĩa, còn chú thích giúp độc giả nhận ra nghĩa vụ tiếp khách và bảo vệ khách.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Bản dịch giữ giọng khẩn khoản của Lót, sức nặng gây sốc của lời đề nghị, cùng hình ảnh Hê-bơ-rơ về bóng mái nhà mà không hàm ý tán thành hành động của ông.
