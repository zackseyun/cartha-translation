  to: Này, tôi có hai con gái chưa từng quan hệ với đàn ông.[a] Xin cho tôi đưa chúng ra cho các người; các người thấy điều gì là tốt thì cứ làm với chúng. Chỉ xin đừng làm gì những người đàn ông này,[b] vì họ đã vào nương dưới bóng mái nhà tôi.[c]
  rationale: Bản sửa giữ giọng khẩn khoản và tính chất gây sốc của lời đề nghị, nhưng làm rõ rằng đám đông được bảo làm điều tùy ý đối với các con gái, không phải làm điều gì cho lợi ích của họ. Các sửa đổi về từ ngữ và cú pháp nâng mức tự nhiên, trang nghiêm của tiếng Việt hiện đại, đồng thời duy trì hình ảnh và hàm ý tiếp khách của nguyên văn.
