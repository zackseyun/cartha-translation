  text: וַ/תַּשְׁקֶ֜יןָ גַּ֣ם בַּ/לַּ֧יְלָה הַ/ה֛וּא אֶת אֲבִי/הֶ֖ן יָ֑יִן וַ/תָּ֤קָם הַ/צְּעִירָה֙ וַ/תִּשְׁכַּ֣ב עִמּ֔/וֹ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קֻמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: vi
  text: Đêm ấy, họ cũng cho cha mình uống rượu. Người em đứng dậy và nằm với ông; ông không hay biết lúc cô nằm xuống hay lúc cô đứng dậy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “ông không hay biết việc cô nằm xuống hay việc cô đứng dậy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: họ … cho … uống
  rationale: Dạng Hiphil của שׁקה diễn tả việc cho hoặc khiến ai uống. Cách dịch này giữ sắc thái khiến khiến mà không đưa thêm ý mạnh hơn là “chuốc say” vào chính động từ.
- source_word: גַּם
  choice: cũng
  rationale: Từ này nối sự việc với đêm trước; “cũng” tự nhiên và giữ đúng chức năng tiếp nối của câu chuyện.
- source_word: בַּלַּיְלָה הַהוּא
  choice: Đêm ấy
  rationale: Đây là cách diễn đạt thời gian gọn, tự nhiên trong tiếng Việt hiện đại.
- source_word: אֶת אֲבִיהֶן יָיִן
  choice: cho cha mình uống rượu
  rationale: Cấu trúc Hê-bơ-rơ nêu người cha là đối tượng được cho uống và rượu là thứ được uống; cách diễn đạt này rõ ràng, tự nhiên trong tiếng Việt.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: Người em đứng dậy
  rationale: הַצְּעִירָה chỉ người nữ trẻ hơn. Trong ngữ cảnh hai chị em, “người em” vừa tự nhiên vừa rõ nghĩa.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: nằm với ông
  rationale: Giữ thành ngữ của nguyên văn về quan hệ tình dục mà không diễn giải thô hoặc làm giảm tính trang nghiêm của lời kể.
- source_word: וְלֹא יָדַע
  choice: ông không hay biết
  rationale: ידע ở đây nói về sự nhận biết. “Không hay biết” truyền đạt tự nhiên trạng thái không nhận thức, đồng thời để các cụm tiếp theo xác định phạm vi.
- source_word: בְּשִׁכְבָהּ
  choice: lúc cô nằm xuống
  rationale: Giới từ ב với danh động từ và hậu tố có chức năng chỉ thời gian ở đây; “lúc cô nằm xuống” là cách nói tự nhiên.
- source_word: וּבְקֻמָהּ
  choice: lúc cô đứng dậy
  rationale: Dịch song song với vế trước, giữ nhịp đối xứng của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Dùng “người em” theo ngữ cảnh hai chị em; dùng “nằm với” để giữ thành ngữ kín đáo của nguyên văn. Dấu chú thích được đặt sau mệnh đề mà chú thích giải thích.
