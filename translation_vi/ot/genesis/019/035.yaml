  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố của tiếng Hê-bơ-rơ: hành động lặp lại vào đêm ấy (גַּם), việc hai người con gái cho cha uống rượu, người con gái trẻ hơn đứng dậy và nằm với cha, cùng sự không nhận biết của ông về việc cô nằm xuống và đứng dậy. Cách nói “nằm với ông” giữ lối nói kín đáo của nguyên văn về quan hệ tình dục mà không thêm diễn giải.'
