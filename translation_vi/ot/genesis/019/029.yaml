    rationale: Từ này có thể biểu thị kết luận hoặc hệ quả trong tiếng Việt, trong khi וַיְהִי chủ yếu mở khung cảnh tự sự-thời gian.
  - severity: medium
    issue: “cảnh lật đổ” là cách kết hợp từ chưa tự nhiên
    rationale: Danh từ hַהֲפֵכָה chỉ biến cố/sự lật đổ. “Cuộc lật đổ” tự nhiên hơn và vẫn bảo toàn tiếng vọng với động từ “lật đổ” kế tiếp.
  - severity: low
    issue: Neo chú thích b đặt ở cuối câu thay vì ngay sau “nhớ đến Áp-ra-ham”
    rationale: Chú thích giải thích trực tiếp thành ngữ “nhớ đến Áp-ra-ham”; đặt dấu neo sát cụm này tránh mơ hồ về phạm vi chú thích.
