base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: vi
  text: Khi Đức Chúa Trời hủy diệt các thành trong đồng bằng, Ngài nhớ đến Áp-ra-ham[b] và đưa Lót ra khỏi giữa cuộc lật đổ[a], lúc Ngài lật đổ các thành mà Lót đã ở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ra khỏi giữa sự hủy diệt.” Từ Hê-bơ-rơ ở đây là danh từ cùng gốc với động từ “lật đổ” ngay sau đó.'
    reason: lexical_alternative
  - marker: b
    text: “Ngài nhớ đến Áp-ra-ham” là một thành ngữ Hê-bơ-rơ nói về việc Đức Chúa Trời quan tâm cách thành tín và hành động đối với Áp-ra-ham, chứ không ngụ ý rằng trước đó Ngài đã quên ông.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בְּשַׁחֵת
  choice: Vậy, khi ... hủy diệt
  rationale: Cụm mở đầu đặt bối cảnh thời gian trong mạch kể. “Vậy, khi” diễn đạt tự nhiên chức năng tự sự của וַיְהִי và giá trị thời gian của בְּשַׁחֵת mà không dùng lối cổ.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời / Ngài
  rationale: Ngữ cảnh và cú pháp chỉ về Đức Chúa Trời duy nhất. Đại từ “Ngài” ở lần nhắc lại giúp câu tiếng Việt tự nhiên mà vẫn rõ chủ thể.
- source_word: עָרֵי הַכִּכָּר
  choice: các thành trong đồng bằng
  rationale: Trong Sáng Thế Ký 13 và 19, הַכִּכָּר chỉ vùng đồng bằng thuộc khu vực sông Giô-đanh; “trong đồng bằng” diễn đạt tự nhiên quan hệ địa lý.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: Ngài nhớ đến Áp-ra-ham
  rationale: Giữ nguyên thành ngữ Kinh Thánh “nhớ đến”, không diễn giải ngay trong chính văn thành “hành động vì” hoặc “chiếu cố”.
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: và đưa Lót ra
  rationale: Trong ngữ cảnh giải thoát khỏi vùng bị lật đổ, “đưa ... ra” truyền đạt chuyển động do Đức Chúa Trời khiến xảy ra, tự nhiên hơn cách dịch máy móc “sai ... ra”.
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: ra khỏi giữa cảnh lật đổ
  rationale: “Ra khỏi giữa” phản ánh מִתּוֹךְ; “cảnh lật đổ” giữ liên hệ từ vựng với động từ הֲפֹךְ ngay sau đó, dù cách nói này hơi khác thường trong tiếng Việt.
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  choice: lúc Ngài lật đổ các thành
  rationale: Dạng nguyên mẫu với בְּ mang ý nghĩa thời gian; “lúc” tránh lặp “khi” quá gần mà vẫn giữ mối liên hệ giữa danh từ và động từ cùng gốc הפך.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: nơi Lót từng cư ngụ
  rationale: “Từng cư ngụ” diễn tả việc Lót đã sống tại các thành ấy trước biến cố; trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của câu “Đức Chúa Trời nhớ đến Áp-ra-ham”
  choice: Giữ thành ngữ “Ngài nhớ đến Áp-ra-ham” trong chính văn.
  alternative: “Đức Chúa Trời hành động vì Áp-ra-ham” hoặc “Đức Chúa Trời đoái đến Áp-ra-ham”.
  rationale: Trong lối kể Hê-bơ-rơ, việc Đức Chúa Trời “nhớ” thường hàm ý Ngài quan tâm cách thành tín và hành động tương ứng; tuy nhiên, diễn giải điều đó ngay trong chính văn sẽ thu hẹp sắc thái của nguyên ngữ. Chú thích làm rõ rằng câu này không ngụ ý Đức Chúa Trời từng quên.
- issue: Mối liên hệ giữa Áp-ra-ham và việc Lót được đưa ra
  choice: Đặt hai mệnh đề cạnh nhau đúng như nguyên văn, không thêm “vì vậy” hoặc “nhờ Áp-ra-ham”.
  alternative: Nói rõ rằng Lót được cứu “vì Áp-ra-ham”.
  rationale: Trình tự câu cho thấy sự liên hệ, nhưng nguyên văn không dùng một giới từ hoặc liên từ nhân quả minh nhiên tại đây; bản dịch không nên giải quyết quá mức sắc thái thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo cách gọi phổ biến trong Kinh Thánh tiếng Việt; tên riêng theo dạng quen thuộc Áp-ra-ham và Lót. Giữ sự lặp lại có chủ ý giữa “cảnh lật đổ” và “lật đổ” để phản ánh phép nối từ trong tiếng Hê-bơ-rơ.
