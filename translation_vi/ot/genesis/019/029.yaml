  to: Khi Đức Chúa Trời hủy diệt các thành trong đồng bằng, Ngài nhớ đến Áp-ra-ham[b] và đưa Lót ra khỏi giữa cuộc lật đổ[a], lúc Ngài lật đổ các thành mà Lót đã ở.
