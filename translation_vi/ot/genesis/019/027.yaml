  naturalness: «Áp-ra-ham dậy từ sáng sớm, rồi đến nơi...» là tiếng Việt hiện đại, tự nhiên, giữ cả ý dậy sớm lẫn hướng đến địa điểm. «Trước Yahweh» trang trọng và rõ nghĩa trong ngữ cảnh này.
