  text: וַ/יַּשְׁכֵּ֥ם אַבְרָהָ֖ם בַּ/בֹּ֑קֶר אֶל הַ֨/מָּק֔וֹם אֲשֶׁר עָ֥מַד שָׁ֖ם אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: vi
  text: Áp-ra-ham dậy từ sáng sớm, rồi đến nơi ông đã đứng trước Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “trước mặt Yahweh”; đây là một thành ngữ có nghĩa là “trước Yahweh” hoặc “trong sự hiện diện của Yahweh”.'
    reason: Giải thích thành ngữ אֶת־פְּנֵי mà vẫn giữ cách chuyển dịch danh YHWH nhất quán với bản văn chính.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: Sáng sớm, Áp-ra-ham dậy
  rationale: Dạng Hiphil của שׁכם diễn tả việc dậy sớm. Kết hợp với בַּבֹּקֶר, cách dịch này tự nhiên trong tiếng Việt và giữ rõ ý thời gian.
- source_word: בַּבֹּקֶר
  choice: Sáng sớm
  rationale: בוקר nghĩa là buổi sáng; trong kết cấu với וַיַּשְׁכֵּם, cụm này nhấn mạnh hành động xảy ra từ sáng sớm.
- source_word: אֶל הַמָּקוֹם
  choice: đi đến nơi
  rationale: מקום là từ thông dụng chỉ một nơi. Giới từ אֶל biểu thị hướng đến; thêm “đi” giúp câu tiếng Việt tự nhiên, dù chuyển động đã được hàm ý bởi giới từ hơn là bởi động từ וַיַּשְׁכֵּם.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: nơi ông đã đứng
  rationale: Mệnh đề quan hệ nhắc lại một sự việc trước đó. “Đã đứng” thể hiện quan hệ hồi chỉ, còn שָׁם được diễn đạt tự nhiên trong từ “nơi”.
- source_word: אֶת־פְּנֵי
  choice: trước mặt
  rationale: Trong kết cấu עמד את־פני, cụm này có nghĩa đứng trước ai hoặc ở trong sự hiện diện của người ấy. “Trước mặt” vừa gần hình thức Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Đây là danh riêng của Đức Chúa Trời, Tứ Tự YHWH. “Đức Giê-hô-va” là dạng danh xưng quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt; chú thích nêu dạng phiên âm gần với cách phục nguyên hiện đại.
theological_decisions:
- issue: Cách dịch danh YHWH (יְהוָה)
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản văn dùng trực tiếp danh YHWH. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu “CHÚA”. “Đức Giê-hô-va” phù hợp văn phong Kinh Thánh tiếng Việt quen thuộc, trong khi chú thích ghi nhận dạng Yahweh thường được giới học thuật phục nguyên.
- issue: Ý nghĩa của עָמַד ... אֶת־פְּנֵי יְהוָה
  choice: đã đứng trước mặt Đức Giê-hô-va
  alternative: đã đứng trong sự hiện diện của Đức Giê-hô-va
  rationale: Cách dịch chính giữ hình ảnh “mặt” của nguyên ngữ mà không diễn giải thêm bản chất của cuộc gặp; chú thích làm rõ đây là một thành ngữ chỉ sự hiện diện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên Áp-ra-ham theo dạng quen thuộc trong tiếng Việt. Câu thêm động từ “đi” để diễn đạt tự nhiên hướng đích của אֶל, nhưng không hàm ý ông lên đường đến một địa điểm khác ngoài nơi đã được nhắc trước đó.
