    rationale: Cấu trúc «..., từ Đức Giê-hô-va, từ các tầng trời» dễ bị đọc ngập ngừng hoặc không rõ phạm vi bổ nghĩa. Gạch ngang là phương án phân cách tự nhiên hơn mà không xóa sự lặp lại trong nguyên văn.
  - severity: low
    issue: Chú thích b nói danh Đức Chúa Trời được lặp lại “trong tiếng Hê-bơ-rơ”.
    rationale: Nên nói rõ danh này được lặp lại trong nguyên văn và được giữ lại trong bản dịch, phù hợp hơn với chức năng chú thích và với chính văn tiếng Việt.
