  text: וַֽ/יהוָ֗ה הִמְטִ֧יר עַל סְדֹ֛ם וְ/עַל עֲמֹרָ֖ה גָּפְרִ֣ית וָ/אֵ֑שׁ מֵ/אֵ֥ת יְהוָ֖ה מִן הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: vi
  text: Bấy giờ, Đức Giê-hô-va làm mưa lưu huỳnh và lửa xuống Sô-đôm và Gô-mô-rơ—từ Đức Giê-hô-va, từ các tầng trời.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lưu huỳnh” là nghĩa của từ Hê-bơ-rơ גָּפְרִית; một số bản dịch truyền thống dùng từ “diêm sinh”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “từ Đức Giê-hô-va, từ các tầng trời.” Danh Đức Chúa Trời được lặp lại trong nguyên văn và được giữ lại trong bản dịch, thay vì giản lược.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc, trang trọng trong tiếng Việt cho danh riêng YHWH; giữ nguyên cả hai lần xuất hiện trong câu.
- source_word: הִמְטִיר
  choice: làm mưa ... xuống
  rationale: Phản ánh dạng Hiphil với nghĩa ‘khiến mưa xuống’, đồng thời giữ hình ảnh sự phán xét đổ xuống từ trên cao.
- source_word: גָּפְרִית
  choice: lưu huỳnh
  rationale: Từ hiện đại và chính xác cho sulfur; rõ nghĩa hơn cách gọi cổ ‘diêm sinh’.
- source_word: אֵשׁ
  choice: lửa
  rationale: Tương đương trực tiếp, được giữ như yếu tố thứ hai đi cùng ‘lưu huỳnh’.
- source_word: עַל סְדֹם וְעַל עֲמֹרָה
  choice: xuống Sô-đôm và Gô-mô-rơ
  rationale: ‘Xuống’ diễn đạt tự nhiên đích đến của vật được làm cho mưa xuống; hai địa danh dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: מֵאֵת יְהוָה
  choice: từ Đức Giê-hô-va
  rationale: Giữ rõ nguồn gốc được nêu trong nguyên văn, không lược bỏ lần lặp lại danh Đức Chúa Trời.
- source_word: מִן הַשָּׁמָיִם
  choice: từ các tầng trời
  rationale: Giữ hình thức số nhiều và hình ảnh không gian của tiếng Hê-bơ-rơ, thay vì giản lược thành ‘từ trời’.
- source_word: וַ
  choice: Bấy giờ
  rationale: Diễn đạt bước tiếp theo của trình thuật bằng lối văn trang trọng nhưng tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Danh YHWH được lặp lại trong cấu trúc ‘Đức Giê-hô-va ... từ Đức Giê-hô-va’
  choice: Giữ nguyên sự lặp lại trong chính văn.
  alternative: Lược lần thứ hai và dịch ‘Đức Giê-hô-va ... từ các tầng trời’ hoặc giải thích là ‘từ chính Ngài’.
  rationale: Nguyên văn nêu danh YHWH hai lần. Bản dịch không giản lược hay giải thích sự lặp lại, nhờ đó bảo toàn nét căng và khả năng diễn giải thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘lưu huỳnh’ thay cho ‘diêm sinh’; giữ cú pháp hơi khác thường ở phần cuối nhằm phản ánh sự lặp lại có chủ ý trong nguyên văn.
