source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: vi
  text: Hai thiên sứ đến Sô-đôm vào buổi tối, lúc ấy Lót đang ngồi tại cổng thành Sô-đôm.[a] Khi thấy họ, Lót đứng dậy đi đón và sấp mình xuống đất.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cổng thành Sô-đôm” là khu vực công cộng quanh cổng thành, nơi thường diễn ra các sinh hoạt dân sự.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “cúi rạp xuống, mặt chạm đất.” Tiếng Hê-bơ-rơ mô tả một cử chỉ cúi mình thật thấp để bày tỏ lòng tôn kính.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: đến
  rationale: Động từ בוא ở thể kể chuyện diễn tả việc đi đến một nơi; “đến” tự nhiên và phù hợp với hậu tố chỉ hướng trong סְדֹמָה.
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: hai thiên sứ
  rationale: מַלְאָךְ có thể là “sứ giả” hoặc “thiên sứ”; ngữ cảnh nối tiếp chương trước xác định đây là các vị khách thuộc thiên giới.
- source_word: בָּעֶרֶב
  choice: vào buổi tối
  rationale: Cụm từ chỉ thời điểm họ đến; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: יֹשֵׁב
  choice: đang ngồi
  rationale: Phân từ diễn tả trạng thái đang tiếp diễn làm bối cảnh cho hành động chính.
- source_word: בְּשַׁעַר סְדֹם
  choice: tại cổng thành Sô-đôm
  rationale: “Cổng thành” chỉ khu vực cổng của đô thị, không chỉ riêng cánh cửa; “tại” tự nhiên hơn lối dịch sát “trong cổng”.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: đứng dậy đi đón
  rationale: Giữ cả ý đứng lên và tiến ra gặp những người đang đến.
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: sấp mình, mặt sát đất
  rationale: Diễn đạt tự nhiên tư thế cúi rạp sâu được thành ngữ Hê-bơ-rơ mô tả, không mặc nhiên giải thích hành động ấy là thờ phượng.
theological_decisions:
- issue: Hành động וַיִּשְׁתַּחוּ là thờ phượng hay cúi rạp bày tỏ sự tôn kính
  choice: sấp mình, mặt sát đất
  alternative: thờ lạy
  rationale: Động từ có thể chỉ sự thờ phượng hoặc cúi mình trước người khác. Trong câu này, bản dịch mô tả hành động thể chất và giữ nguyên khả năng diễn giải, thay vì đưa vào một khẳng định thần học mạnh hơn văn bản.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “thiên sứ” theo ngữ cảnh, “cổng thành” để người đọc hiểu đúng không gian đô thị cổ, và mô tả tư thế cúi mình mà không áp đặt ý nghĩa thờ phượng.
