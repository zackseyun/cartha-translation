  to: Hai thiên sứ đến Sô-đôm vào buổi tối, lúc ấy Lót đang ngồi tại cổng thành Sô-đôm.[a] Khi thấy họ, Lót đứng dậy đi đón và sấp mình xuống đất.[b]
  rationale: Chỉ điều chỉnh cách diễn đạt cử chỉ cuối câu để tiếng Việt tự nhiên hơn và phản ánh rõ hơn thành ngữ chỉ sự phủ phục trong tiếng Hê-bơ-rơ. Các chân chú thích giữ đúng neo [a] cho “cổng thành” và [b] cho hành động phủ phục.
