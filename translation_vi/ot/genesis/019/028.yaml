  to: Ông nhìn xuống Sô-đôm, Gô-mô-rơ và toàn vùng đất của đồng bằng. Ông thấy, kìa, khói từ đất bốc lên như khói của một lò nung.[a]
  rationale: Sửa mệnh đề đầu để thể hiện minh bạch các địa điểm/vùng đất được quan sát và dùng chữ thường cho “đồng bằng”, đồng thời giữ nguyên các lựa chọn trung thành khác của bản nháp, kể cả dấu chú thích đặt sau cụm “lò nung”.
