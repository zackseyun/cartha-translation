  text: וַ/יַּשְׁקֵ֗ף עַל פְּנֵ֤י סְדֹם֙ וַ/עֲמֹרָ֔ה וְ/עַֽל כָּל פְּנֵ֖י אֶ֣רֶץ הַ/כִּכָּ֑ר וַ/יַּ֗רְא וְ/הִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָ/אָ֔רֶץ כְּ/קִיטֹ֖ר הַ/כִּבְשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: vi
  text: Ông nhìn xuống Sô-đôm, Gô-mô-rơ và toàn vùng đất của đồng bằng. Ông thấy, kìa, khói từ đất bốc lên như khói của một lò nung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “như khói của một lò đốt.”'
    reason: כִּבְשָׁן có phạm vi nghĩa gồm cả lò nung và lò đốt; nguyên văn không xác định chính xác loại lò.
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: nhìn xuống
  rationale: Động từ ở thể Hifil diễn tả việc nhìn ra hoặc nhìn xuống từ một vị trí cao; ngữ cảnh trước đó đặt Áp-ra-ham tại nơi nhìn xuống vùng đồng bằng.
- source_word: עַל פְּנֵי
  choice: khắp
  rationale: Thành ngữ không gian theo nghĩa đen là “trên bề mặt”; trong tiếng Việt, “khắp” diễn đạt tự nhiên hành động quan sát toàn vùng mà không giữ lối nói gượng ép.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sô-đôm và Gô-mô-rơ
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt hiện đại cho hai địa danh.
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: khắp miền đất thuộc vùng Đồng Bằng
  rationale: כִּכָּר ở đây chỉ vùng đồng bằng hay khu vực hình lòng chảo; cách dịch này giữ cả ý về miền đất và địa vực, đồng thời dùng “Đồng Bằng” như tên gọi địa lý trong mạch truyện.
- source_word: וַיַּרְא
  choice: Ông thấy
  rationale: Giữ động từ tri giác đơn giản và trình tự kể chuyện của nguyên văn.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: Bảo tồn dấu hiệu diễn ngôn nhấn mạnh điều bất ngờ, hiện ra sống động trước mắt nhân vật.
- source_word: עָלָה
  choice: bốc lên
  rationale: Diễn đạt tự nhiên chuyển động đi lên của khói đang hiện ra trước mắt.
- source_word: קִיטֹר
  choice: khói
  rationale: Giữ nghĩa từ vựng cơ bản, không thêm các sắc thái như “dày đặc” hay “cuồn cuộn” vốn không được nói rõ.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Trong ngữ cảnh địa phương, từ này chỉ mặt đất hay miền đất đang bị hủy diệt, không phải toàn thể trái đất.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: như khói của một lò nung
  rationale: כִּבְשָׁן có thể chỉ lò nung hoặc lò đốt; “lò nung” tạo hình ảnh rõ ràng, tự nhiên và phù hợp với làn khói lớn bốc lên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Giữ “kìa” để tái hiện sự chú ý đột ngột của וְהִנֵּה; tránh lặp máy móc cấu trúc liên từ Hê-bơ-rơ. Dấu chân chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
