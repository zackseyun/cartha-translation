  text: וּ/כְמוֹ֙ הַ/שַּׁ֣חַר עָלָ֔ה וַ/יָּאִ֥יצוּ הַ/מַּלְאָכִ֖ים בְּ/ל֣וֹט לֵ/אמֹ֑ר קוּם֩ קַ֨ח אֶֽת אִשְׁתְּ/ךָ֜ וְ/אֶת שְׁתֵּ֤י בְנֹתֶ֨י/ךָ֙ הַ/נִּמְצָאֹ֔ת פֶּן תִּסָּפֶ֖ה בַּ/עֲוֺ֥ן הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: vi
  text: 'Khi rạng đông vừa ló, các thiên sứ giục Lót: “Hãy đứng dậy, dẫn vợ và hai con gái đang ở đây đi, kẻo ông bị cuốn đi trong án phạt của thành này[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong sự gian ác của thành này” hoặc “vì tội trạng của thành này.” Từ Hê-bơ-rơ có thể chỉ sự gian ác, tội trạng, hoặc hình phạt phát sinh từ tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: Khi rạng đông vừa ló
  rationale: Diễn đạt tự nhiên cấu trúc chỉ thời gian cùng hình ảnh bình minh đang lên; “vừa ló” giữ sắc thái thời khắc rạng đông bắt đầu xuất hiện.
- source_word: וַיָּאִיצוּ
  choice: giục
  rationale: Động từ diễn tả việc thúc ép ai hành động nhanh chóng; “giục” ngắn gọn, tự nhiên và thể hiện tính khẩn cấp.
- source_word: הַמַּלְאָכִים
  choice: các thiên sứ
  rationale: Trong ngữ cảnh Sáng Thế Ký 19, đây là các sứ giả thiên giới; “thiên sứ” truyền đạt đúng đối tượng được nói đến.
- source_word: קוּם קַח
  choice: Hãy đứng dậy, dẫn ... đi
  rationale: 'Giữ riêng mệnh lệnh קוּם, còn קַח được diễn đạt theo ngữ cảnh rời khỏi thành: Lót phải đem người nhà theo mình. “Dẫn ... đi” tự nhiên hơn cách dịch máy móc “lấy” khi tân ngữ là người.'
- source_word: אֶת אִשְׁתְּךָ וְאֶת שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת
  choice: vợ và hai con gái đang ở đây
  rationale: “Hai con gái” phản ánh đúng con số xác định; “đang ở đây” chuyển tải tự nhiên phân từ mang nghĩa hiện diện/được tìm thấy, phân biệt họ với những người được nhắc đến trước đó.
- source_word: פֶּן תִּסָּפֶה
  choice: kẻo ông bị cuốn đi
  rationale: Dạng Niphal của ספה có thể chỉ việc bị quét sạch hoặc cùng chung số phận với người khác. “Bị cuốn đi” giữ hình ảnh ấy và sắc thái cảnh báo.
- source_word: בַּעֲוֺן הָעִיר
  choice: trong án phạt của thành này
  rationale: Trong bối cảnh phán xét, עָוֹן có thể chỉ sự gian ác, tội trạng, hoặc hậu quả/hình phạt do tội. “Án phạt” phù hợp với nguy cơ thành sắp bị hủy diệt, còn các nghĩa khác được giữ trong chú thích.
theological_decisions:
- issue: Cách hiểu עָוֹן trong bối cảnh phán xét
  choice: án phạt của thành này
  alternative: sự gian ác của thành này; vì tội trạng của thành này
  rationale: Từ Hê-bơ-rơ có phạm vi nghĩa bao gồm điều gian ác, tội trạng và hình phạt phát sinh từ tội. Ngữ cảnh trực tiếp là lời cảnh báo Lót khỏi bị hủy diệt cùng thành, nên bản chính dùng nghĩa hậu quả phán xét, đồng thời chú thích bảo lưu sự đa nghĩa thực sự của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Lời truyền lệnh ngắn và gấp; đại từ “ông” dành cho Lót tự nhiên trong lời tường thuật, không thêm sắc thái hệ phái.
