  to: 'Nhưng Lót nói với họ: “Không, thưa các ngài[a], xin đừng!”'
  rationale: Bản sửa loại bỏ phần diễn giải không có trong nguyên văn, đồng thời dùng “xin đừng” để diễn đạt tự nhiên lời phản đối tỉnh lược trước đề nghị ở câu trước. “Các ngài” bảo toàn cách hiểu số nhiều phù hợp với “họ”; chú thích giữ khả năng đọc số ít mà không áp đặt một diễn giải thần học.
