  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: vi
  text: 'Nhưng Lót nói với họ: “Không, thưa các ngài[a], xin đừng!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thưa Chúa tôi.” Dạng Hê-bơ-rơ אֲדֹנָי có thể được hiểu là lời xưng hô kính trọng số ít trong một số cách đọc; tuy nhiên, ngữ cảnh số nhiều (“với họ”) thiên về “các ngài” ở đây.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng ... nói
  rationale: Liên từ nối tiếp diễn tiến câu chuyện; trong ngữ cảnh này, “nhưng” diễn đạt tự nhiên lời phản đối của Lót trước chỉ dẫn vừa được đưa ra.
- source_word: לוֹט
  choice: Lót
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt.
- source_word: אֲלֵהֶם
  choice: với họ
  rationale: Giữ đại từ số nhiều của nguyên văn, chỉ hai vị khách/thiên sứ, thay vì giải thích thêm ngay trong chính văn.
- source_word: אַל
  choice: Không ... đừng
  rationale: Trong lời khẩn cầu không có động từ này, tiểu từ phủ định bác bỏ đề nghị vừa nêu. Tiếng Việt tự nhiên cần bổ sung “đừng bắt tôi làm vậy” để chuyển tải lực ngăn cản của câu.
- source_word: נָא
  choice: xin
  rationale: Diễn đạt sắc thái khẩn khoản, lễ phép bằng từ ngữ hiện đại và trang trọng.
- source_word: אֲדֹנָי
  choice: các ngài
  rationale: Ngữ cảnh số nhiều (“với họ”) thiên về lời xưng hô kính trọng dành cho hai vị khách. “Các ngài” tự nhiên hơn “các chúa của tôi” trong tiếng Việt mà vẫn giữ sắc thái tôn kính.
theological_decisions:
- issue: אֲדֹנָי là lời gọi số nhiều dành cho các vị khách hay tước hiệu số ít dành cho Đức Chúa Trời
  choice: 'Lời gọi kính trọng số nhiều: “các ngài”'
  alternative: 'Lời gọi số ít: “Chúa của con”'
  rationale: Đại từ số nhiều trong “nói với họ” và ngữ cảnh hai vị khách ủng hộ cách hiểu số nhiều. Tuy vậy, hình thái Hê-bơ-rơ cũng có thể được đọc là lời thưa với Chúa, nên giữ cách đọc ấy trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu nói được diễn đạt thành lời khẩn cầu tự nhiên; phần bổ sung “đừng bắt tôi làm vậy” làm rõ lực của tiểu từ phủ định אַל trong tiếng Việt mà không xác định cụ thể hành động hơn nguyên cảnh.
