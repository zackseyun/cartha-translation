base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: vi
  text: Xin xem, thành này ở gần để tôi chạy trốn đến đó, và nó nhỏ. Xin hãy để tôi chạy thoát đến đó—chẳng phải nó nhỏ sao?—để tôi được sống.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Kìa, xin ngài xem
  rationale: הִנֵּה thu hút sự chú ý khẩn thiết, còn נָא làm dịu lời thỉnh cầu. Cách dịch này tự nhiên trong tiếng Việt và giữ được cả hai sắc thái.
- source_word: הָעִיר הַזֹּאת
  choice: thành kia
  rationale: Trong ngữ cảnh, Lót chỉ đến một thành ở gần nhưng chưa hiện diện tại chỗ người nói; “thành kia” truyền đạt tự nhiên giá trị chỉ định của cụm từ.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: đủ gần để chạy trốn đến đó
  rationale: קְרֹבָה diễn tả khoảng cách thuận tiện cho việc lánh nạn; שָׁמָּה chỉ hướng đến nơi ấy. “Đủ gần” làm rõ quan hệ hàm ý mà không thêm ý mới.
- source_word: וְהִיא מִצְעָר
  choice: mà nó lại nhỏ
  rationale: מִצְעָר nói đến sự nhỏ bé; “lại” thể hiện đây là lý do bổ sung trong lời nài xin, đồng thời giữ sự lặp lại với câu hỏi kế tiếp.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: Xin cho tôi chạy thoát đến đó
  rationale: Dạng cohortative cùng נָא biểu thị lời khẩn cầu. “Chạy thoát” vừa giữ ý lánh chạy vừa nhấn mạnh thoát nạn.
- source_word: הֲלֹא מִצְעָר הִוא
  choice: chẳng phải nó nhỏ sao?
  rationale: Giữ nguyên hình thức câu hỏi tu từ và sự lặp lại của מִצְעָר.
- source_word: וּתְחִי נַפְשִׁי
  choice: để tôi được sống
  rationale: נַפְשִׁי ở đây là cách nói quy chiếu đến chính con người; mệnh đề theo sau lời xin chạy thoát diễn tả kết quả hoặc mục đích. Cách dịch này truyền đạt thành ngữ tự nhiên, tránh câu tối nghĩa “mạng sống tôi sẽ sống”.
theological_decisions: []
translation_notes:
  register: Văn phong khẩn thiết, trang trọng vừa phải và dễ hiểu đối với độc giả Việt Nam hiện đại. Đại từ “ngài” phản ánh lời thỉnh cầu kính trọng của Lót với vị thiên sứ mà không xác định quá mức địa vị thần học của người nghe.
