  text: וַ/תֵּ֤לֶד הַ/בְּכִירָה֙ בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ מוֹאָ֑ב ה֥וּא אֲבִֽי מוֹאָ֖ב עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: vi
  text: Người con gái đầu lòng sinh một con trai và đặt tên là Mô-áp. Người ấy là tổ phụ của dân Mô-áp cho đến ngày nay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Động từ ילד ở thể Qal trong ngữ cảnh này có nghĩa là sinh con; “sinh” tự nhiên và gọn trong văn kể chuyện tiếng Việt.
- source_word: הַבְּכִירָה
  choice: Người con gái đầu lòng
  rationale: Dạng giống cái chỉ người con đầu lòng; ngữ cảnh cho thấy đây là con gái lớn của Lót. Cách dịch này vừa giữ ý “đầu lòng” vừa làm rõ giới tính vốn được đánh dấu trong tiếng Hê-bơ-rơ.
- source_word: בֵּן
  choice: một con trai
  rationale: Diễn đạt tự nhiên đối tượng được sinh ra và giữ rõ giới tính của đứa trẻ.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: đặt tên là
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ Hê-bơ-rơ nghĩa đen là “gọi tên nó”; tránh lối dịch cứng “gọi tên của nó là”.
- source_word: מוֹאָב
  choice: Mô-áp
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: הוּא
  choice: Người ấy
  rationale: Đại từ độc lập nhắc lại người con trai vừa được đặt tên; “người ấy” trang trọng, rõ nghĩa và tránh đại từ có sắc thái khẩu ngữ.
- source_word: אֲבִי מוֹאָב
  choice: tổ phụ của dân Mô-áp
  rationale: “Cha của Mô-áp” theo nghĩa đen chỉ người khai tổ của dân tộc mang tên ấy. “Tổ phụ của dân Mô-áp” truyền đạt đúng ý trong tiếng Việt hiện đại.
- source_word: עַד הַיּוֹם
  choice: cho đến ngày nay
  rationale: Thành ngữ Hê-bơ-rơ nói về sự tiếp diễn tới thời của người kể; đây là cách tương đương tự nhiên và trang trọng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: giữ cách gọi “con gái đầu lòng” của nguyên văn, nhưng diễn đạt thành ngữ đặt tên và ý nghĩa dân tộc học của “cha của Mô-áp” bằng tiếng Việt tự nhiên.'
