source:
  edition: WLC
  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: vi
  text: Ta sẽ ban phước cho nàng, và hơn nữa, Ta sẽ ban cho con một con trai qua nàng. Ta sẽ ban phước cho nàng, và nàng sẽ trở thành nhiều dân tộc[a]; các vua của các dân sẽ ra từ nàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nàng sẽ là mẹ của nhiều dân tộc.” Nguyên văn tiếng Hê-bơ-rơ sát nghĩa hơn là: “nàng sẽ trở thành nhiều dân tộc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵרַכְתִּי / וּבֵרַכְתִּיהָ
  choice: Ta sẽ ban phước cho nàng / Ta sẽ ban phước cho nàng
  rationale: Giữ nghĩa giao ước và thần học của ברך, đồng thời giữ nguyên sự lặp lại có dụng ý trong tiếng Hê-bơ-rơ.
- source_word: וְגַם
  choice: và hơn nữa
  rationale: Diễn đạt cả ý bổ sung lẫn sắc thái nhấn mạnh của tiểu từ, bằng tiếng Việt tự nhiên.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: Ta sẽ ban cho con một con trai bởi nàng
  rationale: Dạng hoàn thành được hiểu theo nghĩa tương lai trong lời hứa; “bởi nàng” bảo toàn ý người con sinh ra qua Sa-ra.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: nàng sẽ trở thành nhiều dân tộc
  rationale: Bám sát cách nói nổi bật của nguyên văn, không tự ý thêm “mẹ của”; “nhiều” giúp danh từ số nhiều tự nhiên và rõ hơn trong tiếng Việt.
- source_word: מַלְכֵי עַמִּים
  choice: các vua của nhiều dân
  rationale: Phản ánh עַמִּים là “các dân/nhiều dân”, phân biệt với גוֹיִם ở mệnh đề trước.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: sẽ ra từ nàng
  rationale: Diễn đạt tự nhiên quan hệ nguồn gốc và dòng dõi của nghĩa đen “sẽ có từ nàng”.
theological_decisions:
- issue: Lời hứa về các dân tộc và các vua phát xuất từ Sa-ra
  choice: nàng sẽ trở thành nhiều dân tộc; các vua của nhiều dân sẽ ra từ nàng
  alternative: nàng sẽ là mẹ của nhiều dân tộc; các vua của nhiều dân sẽ ra từ nàng
  rationale: Giữ phạm vi tập thể và vương quyền của lời hứa giao ước, đồng thời không đưa danh xưng “mẹ” vốn chỉ là ý hàm chứa chứ không có mặt trong nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại, dễ hiểu. Dùng “Ta/con/nàng” phù hợp lời Đức Chúa Trời phán với Áp-ra-ham về Sa-ra; giữ sự lặp lại và cách nói gây ấn tượng của nguyên văn.
