base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/026.yaml
  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: vi
  text: Chính ngày hôm ấy, Áp-ra-ham và Ích-ma-ên, con trai ông, đã được cắt bì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Chính trong ngày ấy
  rationale: Cụm thành ngữ nhấn mạnh rằng sự việc xảy ra đúng ngay trong ngày đã được nói đến; cách dịch này giữ sắc thái nhấn mạnh và tự nhiên trong tiếng Việt.
- source_word: נִמּוֹל
  choice: đã chịu cắt bì
  rationale: Động từ Niphal mang nghĩa bị động. Trong tiếng Việt, “chịu cắt bì” diễn đạt tự nhiên việc hai người được thực hiện phép cắt bì, đồng thời giữ giá trị hoàn thành của câu thuật sự.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: וְיִשְׁמָעֵאל
  choice: và Ích-ma-ên
  rationale: Giữ liên từ và dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: בְּנוֹ
  choice: con trai ông
  rationale: Hậu tố ngôi ba số ít chỉ Ích-ma-ên là con của Áp-ra-ham; “con trai ông” rõ nghĩa và tự nhiên.
