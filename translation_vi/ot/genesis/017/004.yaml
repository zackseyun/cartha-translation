base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: vi
  text: Về phần ta[a], này, giao ước của ta là với ngươi, và ngươi sẽ trở thành cha của nhiều dân tộc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta—này, giao ước của ta là với ngươi.” Đại từ mở đầu và tiểu từ tiếp theo đều mang sắc thái nhấn mạnh trong tiếng Hê-bơ-rơ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ngươi sẽ là cha của nhiều dân tộc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Về phần ta
  rationale: Đại từ độc lập đứng đầu câu mang sắc thái nhấn mạnh và chuyển trọng tâm diễn ngôn. “Về phần ta” thể hiện sắc thái ấy tự nhiên hơn việc chỉ dịch là “ta”.
- source_word: הִנֵּה
  choice: này
  rationale: Tiểu từ này kêu gọi người nghe chú ý đến lời tuyên bố tiếp theo; “này” giữ được tính trực tiếp và trang trọng mà không làm câu quá cổ.
- source_word: בְרִיתִי
  choice: giao ước của ta
  rationale: “Giao ước” là cách dịch chính xác, quen thuộc của בְּרִית trong trình thuật về Áp-ra-ham và giữ nguyên sức nặng thần học của từ nguồn.
- source_word: אִתָּךְ
  choice: với ngươi
  rationale: Giới từ cùng hậu tố đại từ có nghĩa trực tiếp là “với ngươi”; không mở rộng thành “giữa ta với ngươi” vì ý ấy không được nói rõ trong nguyên văn.
- source_word: וְהָיִיתָ
  choice: và ngươi sẽ trở thành
  rationale: Trong lời tuyên bố giao ước này, động từ có lực hướng tới tương lai và kết quả. “Sẽ trở thành” diễn tả rõ sự chuyển sang vai trò được hứa ban.
- source_word: לְאָב
  choice: cha của
  rationale: Giữ hình ảnh trực tiếp “cha” của nguyên văn, thay vì diễn giải thành “tổ tiên”, đồng thời phù hợp với vai trò được xác lập cho Áp-ram.
- source_word: הֲמוֹן
  choice: vô số
  rationale: “Vô số” diễn đạt tự nhiên ý một số lượng rất đông và duy trì mối liên hệ với lời giải thích về tên mới trong câu kế tiếp.
- source_word: גּוֹיִם
  choice: dân tộc
  rationale: Từ này chỉ rộng rãi các dân hay các quốc gia, không mang nghĩa chuyên biệt về “dân ngoại” trong ngữ cảnh này. “Dân tộc” tự nhiên khi nói về nguồn gốc từ một người cha.
theological_decisions:
- issue: Công thức giao ước và vai trò của Áp-ram
  choice: 'Giữ lời tuyên bố trực tiếp: “giao ước của ta là với ngươi, và ngươi sẽ trở thành cha của vô số dân tộc.”'
  alternative: Diễn giải thành “ta lập giao ước với ngươi” hoặc “ngươi sẽ là tổ tiên của nhiều dân tộc.”
  rationale: Nguyên văn tuyên bố giao ước và kết quả được hứa mà không dùng động từ “lập” tại đây. Bản dịch không thêm hành động ngoài câu Hebrew và giữ hình ảnh thần học “cha” thay vì giải nghĩa thành “tổ tiên”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta/ngươi” để phản ánh lời Đức Chúa Trời phán trực tiếp với Áp-ram; giữ “này” vì lực chỉ xuất và nhấn mạnh của הִנֵּה. Cấu trúc “giao ước của ta là với ngươi” cố ý không thêm động từ “lập” vốn không xuất hiện trong câu nguồn.
