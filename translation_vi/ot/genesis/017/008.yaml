  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: vi
  text: Ta sẽ ban cho con và dòng dõi con về sau vùng đất con kiều ngụ[a]—tức toàn xứ Ca-na-an—làm cơ nghiệp đời đời[b], và Ta sẽ là Đức Chúa Trời của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vùng đất nơi con cư trú như một ngoại kiều.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để làm cơ nghiệp đời đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Ta sẽ ban
  rationale: Dạng hoàn thành Qal ngôi thứ nhất số ít, nối bằng וְ trong lời giao ước, mang lực của một lời hứa hướng đến tương lai; “sẽ ban” diễn đạt tự nhiên điều đó.
- source_word: לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: cho con và dòng dõi con về sau
  rationale: זֶרַע là danh từ tập hợp; “dòng dõi” giữ được ý nghĩa tập thể mà không buộc phải hiểu là một cá nhân hay chỉ một thế hệ. “Về sau” diễn đạt sự tiếp nối sau Áp-ra-ham.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: vùng đất con đang kiều ngụ
  rationale: מְגוּרִים chỉ nơi một người cư trú với thân phận ngoại kiều, không phải quê hương thuộc quyền sở hữu của mình. “Kiều ngụ” vừa gọn vừa giữ được sắc thái ấy.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: tức toàn xứ Ca-na-an
  rationale: Cụm tân ngữ thứ hai đồng vị và xác định rõ “vùng đất” vừa nói đến; “toàn xứ” giữ trọn ý bao quát của כָּל.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: làm cơ nghiệp đời đời
  rationale: אֲחֻזָּה là phần đất thuộc quyền chiếm hữu; “cơ nghiệp” phù hợp với ngữ cảnh đất đai trong giao ước. “Đời đời” giữ sức nặng lâu bền của עוֹלָם mà không giải thích quá mức phạm vi thời gian ngay trong bản văn.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: và Ta sẽ là Đức Chúa Trời của họ
  rationale: Đây là công thức quan hệ giao ước. Cách dịch này tự nhiên trong tiếng Việt và không hàm ý rằng bản thể của Đức Chúa Trời thay đổi.
theological_decisions:
- issue: Diễn đạt công thức giao ước mà không đưa thêm sắc thái giáo phái hoặc giáo lý về sự biến đổi nơi Đức Chúa Trời
  choice: Ta sẽ là Đức Chúa Trời của họ
  alternative: Ta sẽ làm Đức Chúa Trời cho họ
  rationale: Nguyên văn nói đến mối quan hệ giao ước. “Sẽ là ... của họ” diễn đạt rõ quan hệ ấy và tránh khiến người đọc hiểu rằng Đức Chúa Trời bắt đầu trở thành thần linh theo nghĩa bản thể.
- issue: Phạm vi thời gian của עוֹלָם
  choice: đời đời
  alternative: lâu dài; vĩnh viễn
  rationale: “Đời đời” bảo tồn lực giao ước mạnh của từ Hê-bơ-rơ, đồng thời để nguyên sự căng thẳng về phạm vi thời gian thay vì thu hẹp hoặc giải quyết nó bằng diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta/con” phù hợp với lời phán trực tiếp trong ngữ cảnh giao ước. Dấu gạch ngang làm rõ rằng “toàn xứ Ca-na-an” là thành phần đồng vị giải thích cho vùng đất kiều ngụ.
