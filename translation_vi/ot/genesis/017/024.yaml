  text: And Abraham was ninety-nine years old when the flesh of his foreskin was circumcised.
translation:
  language: vi
  text: Áp-ra-ham đã chín mươi chín tuổi khi phần thịt bao quy đầu của ông được cắt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Liên từ ו tiếp nối mạch thuật chuyện nhưng không nhất thiết phải dịch riêng trong câu tiếng Việt; tên riêng được phiên âm theo cách dùng tiếng Việt.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: được chín mươi chín tuổi
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ, nghĩa đen là “một người con của chín mươi chín năm”, mà vẫn giữ chính xác tuổi của Áp-ra-ham.
- source_word: בְּ/הִמֹּל/וֹ
  choice: khi ... được cắt
  rationale: Giới từ בְּ đi với động từ nguyên mẫu và hậu tố đại từ diễn tả hoàn cảnh thời gian; thể bị động phản ánh việc Áp-ra-ham chịu phép cắt.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: phần thịt bao quy đầu của ông
  rationale: Giữ hình ảnh thân thể cụ thể và cấu trúc của cụm Hê-bơ-rơ, thay vì rút gọn thành “ông chịu cắt bì”.
