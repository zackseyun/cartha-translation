  source_fidelity: Bản dịch giữ đúng công thức đổi tên, sắc thái hoàn thành của נְתַתִּיךָ (“Ta đã lập”), và nghĩa chung của “cha ... các dân tộc.” Tuy nhiên, “vô số” thường hàm ý không thể đếm được, mạnh hơn הֲמוֹן, vốn chỉ một đoàn thể/số lượng đông đảo.
  naturalness: Câu văn tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Rất nhiều dân tộc” tự nhiên hơn một cách dịch sát chữ nhưng vẫn truyền đạt đầy đủ ý số đông của nguyên văn.
  terminology: “Ta—con,” “Áp-ram,” “Áp-ra-ham,” “cha,” và “dân tộc” đều nhất quán với văn cảnh. Chú thích nên diễn đạt cách nói sát chữ của nguyên văn mà không khiến “ban” bị hiểu là ban tặng một vật.
