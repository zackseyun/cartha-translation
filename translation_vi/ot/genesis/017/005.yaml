language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: vi
  text: Tên con sẽ không còn được gọi là Áp-ram nữa, nhưng tên con sẽ là Áp-ra-ham, vì Ta đã lập con làm cha của rất nhiều dân tộc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “vì Ta đã ban con [làm] cha của một đoàn thể đông đảo các dân tộc.”'
    reason: Bảo tồn cách diễn đạt nguyên văn của נְתַתִּיךָ (“Ta đã ban con”), bên cạnh cách dịch tự nhiên “Ta đã lập con làm.”
lexical_decisions:
- source_word: יִקָּרֵא
  choice: được gọi
  rationale: Dạng Nifal của קרא mang nghĩa bị động trong công thức đặt hoặc đổi tên; “được gọi” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: עוֹד
  choice: không còn ... nữa
  rationale: Kết hợp với לֹא, từ này diễn tả việc tên cũ chấm dứt từ thời điểm ấy trở đi.
- source_word: שִׁמְךָ
  choice: tên con
  rationale: Dịch trực tiếp danh từ có hậu tố ngôi hai số ít giống đực; “con” phù hợp với lời Đức Chúa Trời trực tiếp phán với Áp-ram trong văn cảnh.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng theo cách viết quen thuộc, rõ âm tiết trong tiếng Việt.
- source_word: וְהָיָה
  choice: nhưng ... sẽ là
  rationale: Liên từ được diễn đạt theo quan hệ tương phản giữa tên cũ và tên mới; “sẽ là” giữ lực tuyên bố đổi tên.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do giải thích cho tên mới.
- source_word: אַב
  choice: cha
  rationale: Giữ nghĩa thông thường và hình ảnh gia tộc của từ Hê-bơ-rơ, thay vì diễn giải thành “tổ phụ” hay “tổ tiên”.
- source_word: הֲמוֹן
  choice: vô số
  rationale: Diễn đạt tự nhiên ý nghĩa một số lượng rất đông; đồng thời giữ mối liên hệ giải thích giữa tên Áp-ra-ham và nhiều dân tộc.
- source_word: גּוֹיִם
  choice: dân tộc
  rationale: Trong văn cảnh giao ước ở Sáng Thế Ký, từ này chỉ nhiều dân hoặc nhiều quốc gia nói chung, không riêng dân ngoại.
- source_word: נְתַתִּיךָ
  choice: Ta đã lập con làm
  rationale: Động từ có nghĩa đen là “Ta đã ban/đặt con”; trong cấu trúc vị ngữ này, “lập con làm” là tự nhiên và vẫn giữ thể hoàn thành của lời tuyên bố.
theological_decisions:
- issue: Thể hoàn thành trong lời Đức Chúa Trời tuyên bố về vai trò của Áp-ra-ham
  choice: vì Ta đã lập con làm cha của vô số dân tộc
  alternative: vì Ta sẽ lập con làm cha của vô số dân tộc
  rationale: Bản Hê-bơ-rơ dùng נְתַתִּיךָ ở thể hoàn thành. Giữ “đã lập” bảo tồn sức nặng của lời hứa được tuyên bố như một thực tại đã được thiết lập, thay vì chuyển thành tương lai.
- issue: Nghĩa của נְתַתִּיךָ trong cấu trúc vị ngữ
  choice: đã lập con làm
  alternative: đã ban con làm
  rationale: “Lập ... làm” truyền đạt tự nhiên chức năng đặt một người vào vai trò nào đó, nhưng chú thích vẫn bảo tồn cách diễn đạt sát chữ “ban/đặt con làm” của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” thể hiện lời Đức Chúa Trời phán trực tiếp với Áp-ram. Cấu trúc đổi tên được giữ cân đối; dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
