  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: vi
  text: Còn Ích-ma-ên, con trai ông, mười ba tuổi khi phần thịt bao quy đầu của Ích-ma-ên được cắt bì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: Ích-ma-ên
  rationale: Tên riêng được phiên âm theo cách quen thuộc trong tiếng Việt; liên từ וְ mang chức năng nối tiếp lời thuật và không cần dịch riêng ở đầu câu này.
- source_word: בְּנ֔/וֹ
  choice: con trai ông
  rationale: Danh từ kèm hậu tố ngôi ba số ít chỉ Ích-ma-ên là con trai của Áp-ra-ham; đại từ “ông” theo mạch văn trước.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: được mười ba tuổi
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ tuổi; cách diễn đạt này tự nhiên và trang trọng trong tiếng Việt.
- source_word: בְּ/הִמֹּל/וֹ
  choice: khi cậu được cắt bì
  rationale: Giới từ בְּ với động từ nguyên mẫu cấu trúc mang nghĩa thời gian; thể Niphal được diễn đạt bằng cấu trúc bị động.
- source_word: אֵת
  choice: '[không dịch riêng]'
  rationale: Dấu hiệu chỉ tân ngữ xác định không có từ tương ứng độc lập trong tiếng Việt.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: nơi phần thịt bao quy đầu
  rationale: Giữ hình ảnh cụ thể của nguyên văn, đồng thời dùng “nơi” để câu tiếng Việt tự nhiên hơn và cho thấy bộ phận chịu tác động của phép cắt bì.
