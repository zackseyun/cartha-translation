  to: Còn Ích-ma-ên, con trai ông, mười ba tuổi khi phần thịt bao quy đầu của Ích-ma-ên được cắt bì.
  rationale: Sửa cấu trúc cắt bì để phản ánh rõ đối tượng cụ thể được nêu trong tiếng Hê-bơ-rơ, đồng thời thay lối nói tuổi và đại từ khẩu ngữ bằng diễn đạt tự nhiên, trang trọng hơn. Không cần chú thích, vì câu không có dị bản hay điểm mơ hồ cần giữ bằng chú thích.
