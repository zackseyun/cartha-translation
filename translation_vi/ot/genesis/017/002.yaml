base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/002.yaml
  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: vi
  text: Ta sẽ lập giao ước của Ta giữa Ta và con[a], và Ta sẽ khiến con sinh sôi nảy nở vô cùng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “Ta sẽ ban/đặt giao ước của Ta giữa Ta và con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: Ta sẽ lập
  rationale: Động từ נתן có nghĩa cơ bản là “ban, đặt”, nhưng khi đi với בְּרִית trong ngữ cảnh này, “lập giao ước” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt; liên từ וְ được thể hiện qua mạch nối của câu.
- source_word: בְרִיתִי
  choice: giao ước của ta
  rationale: “Giao ước” giữ được sắc thái trang trọng và nội dung quan hệ cam kết của בְּרִית; hậu tố ngôi thứ nhất số ít được diễn đạt là “của ta”.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: giữa ta với con
  rationale: Diễn đạt trực tiếp hai bên của giao ước, đồng thời dùng đại từ phù hợp với lời Đức Chúa Trời phán trực tiếp với Áp-ram.
- source_word: וְאַרְבֶּה
  choice: và ta sẽ khiến … sinh sôi nảy nở
  rationale: Thể Hiphil của רבה mang nghĩa khiến gia tăng. “Khiến … sinh sôi nảy nở” tự nhiên trong tiếng Việt và phù hợp với lời hứa về sự gia tăng đông đảo.
- source_word: אֹתְךָ
  choice: con
  rationale: Giữ nguyên đối tượng trực tiếp ngôi thứ hai số ít là Áp-ram, không thay bằng “dòng dõi con”, dù hậu duệ được hàm ý trong lời hứa.
- source_word: בִּמְאֹד מְאֹד
  choice: vô cùng
  rationale: Cụm lặp מְאֹד מְאֹד nhấn mạnh mức độ rất lớn; “vô cùng” truyền đạt sức nhấn ấy một cách trang trọng và tự nhiên.
theological_decisions:
- issue: Cách hiểu thành ngữ נתן + בְּרִית
  choice: lập giao ước của ta
  alternative: ban/đặt giao ước của ta
  rationale: “Lập giao ước” truyền đạt hành động thiết lập quan hệ giao ước mà không biến giao ước thành một vật chỉ được trao chuyển; chú thích vẫn bảo lưu nghĩa sát chữ của động từ.
- issue: Đối tượng của lời hứa gia tăng
  choice: khiến con sinh sôi nảy nở
  alternative: làm cho dòng dõi con gia tăng
  rationale: Bản Hê-bơ-rơ trực tiếp nói “con” ở số ít với Áp-ram. Bản dịch không thay đối tượng bằng “dòng dõi”, dù ý về hậu duệ nằm trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta—con” thể hiện lời Đức Chúa Trời phán với Áp-ram; cách nói “sinh sôi nảy nở” giữ sắc thái lời hứa về sự gia tăng mà không thêm rõ “dòng dõi” vào nguyên văn.
