id: GEN.17.1
reference: Genesis 17:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: vi
  text: 'Khi Áp-ram chín mươi chín tuổi, Yahweh hiện ra với ông và phán: “Ta là Đức Chúa Trời Toàn Năng[a]. Hãy bước đi trước mặt Ta và sống trọn vẹn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: El Shaddai; nghĩa chính xác của Shaddai vẫn còn được tranh luận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַבְרָם בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: Khi Áp-ram được chín mươi chín tuổi
  rationale: Diễn đạt thành ngữ chỉ tuổi trong tiếng Hê-bơ-rơ bằng cấu trúc tự nhiên của tiếng Việt, đồng thời dùng “Khi” để thể hiện bối cảnh thời gian của câu chuyện.
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Trong cấu trúc Niphal này, động từ nói về việc Yahweh xuất hiện cho Áp-ram thấy; “hiện ra” là cách diễn đạt tự nhiên và trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng phiên âm phổ biến, thay vì thay thế bằng một tước hiệu.
- source_word: אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  rationale: Dịch tước hiệu theo cách rõ nghĩa trong tiếng Việt; chú thích giữ dạng El Shaddai vì sắc thái chính xác của שַׁדַּי còn gây tranh luận.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: Hãy bước đi trước mặt Ta
  rationale: Giữ hình ảnh “bước đi” và sắc thái giao ước, trong đó việc bước đi chỉ cách sống thường xuyên trước sự hiện diện của Đức Chúa Trời.
- source_word: וֶהְיֵה תָמִים
  choice: và sống trọn vẹn
  rationale: תָמִים có thể chỉ sự toàn vẹn, nguyên vẹn hay không chỗ trách được. “Sống trọn vẹn” phù hợp ngữ cảnh đạo đức và giao ước mà không hàm ý sự hoàn hảo tuyệt đối, vô tội.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; giữ “Yahweh” bảo tồn chức năng của danh giao ước thay vì đổi thành một tước hiệu.
- issue: Cách chuyển dịch אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  alternative: El Shaddai
  rationale: Bản chính dịch tước hiệu để độc giả hiểu ngay, còn chú thích bảo tồn dạng Hê-bơ-rơ và thừa nhận rằng nghĩa chính xác của Shaddai chưa chắc chắn.
- issue: Sắc thái của תָמִים
  choice: sống trọn vẹn
  alternative: không chỗ trách được
  rationale: Lựa chọn này giữ ý về đời sống toàn tâm, chính trực trong mối quan hệ giao ước, không biến mệnh lệnh thành lời đòi hỏi sự hoàn hảo tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp lời phán trực tiếp của Đức Chúa Trời. Giữ hình ảnh Kinh Thánh “bước đi trước mặt Ta”, nhưng dùng “sống trọn vẹn” để tiếng Việt tự nhiên và tránh cách hiểu là sự hoàn hảo tuyệt đối.
