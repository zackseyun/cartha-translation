base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: vi
  text: Tất cả những người nam trong nhà ông, gồm những người sinh ra trong nhà và những người được mua bằng tiền từ người ngoại quốc, đều chịu cắt bì cùng với ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל
  choice: Tất cả
  rationale: כָּל diễn tả tính toàn thể; quan hệ nối tiếp của וְ được thể hiện tự nhiên trong dòng thuật sự tiếng Việt mà không nhất thiết phải thêm “và” ở đầu câu.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: những người nam trong nhà ông
  rationale: Cụm từ chỉ những người nam thuộc đại gia đình/hộ gia đình của Áp-ra-ham; “trong nhà ông” tự nhiên và vẫn giữ phạm vi xã hội của בַּיִת.
- source_word: יְלִיד בָּיִת
  choice: những người sinh ra trong nhà
  rationale: Giữ nghĩa chỉ người được sinh ra trong phạm vi hộ gia đình, đồng thời tránh cách diễn đạt cổ hoặc khó hiểu.
- source_word: וּמִקְנַת כֶּסֶף
  choice: những người được mua bằng tiền
  rationale: Danh ngữ chỉ những người được thu nhận qua việc mua; cách dịch này giữ rõ tính giao dịch của nguyên văn.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: từ người ngoại quốc
  rationale: בֶּן נֵכָר là thành ngữ chỉ người ngoại quốc/người ngoài; dịch theo nghĩa thành ngữ thay vì sát chữ “con trai của người xa lạ”.
- source_word: נִמֹּלוּ
  choice: đều chịu cắt bì
  rationale: Dạng Niphal được hiểu theo nghĩa bị động; “chịu cắt bì” là cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: אִתּוֹ
  choice: cùng với ông
  rationale: Diễn tả sự đồng hành và cùng thời điểm với Áp-ra-ham trong việc cắt bì.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Trong nhà” được dùng theo nghĩa hộ gia đình rộng hơn nơi cư trú; “người nam” xác định đúng đối tượng trong bối cảnh cắt bì. Không cần chú thích vì thành ngữ בֶּן נֵכָר đã được chuyển nghĩa rõ ràng là “người ngoại quốc”.
