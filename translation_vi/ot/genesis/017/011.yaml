source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: vi
  text: Các ngươi phải cắt da bao quy đầu của mình; đó sẽ là dấu hiệu[a] của giao ước giữa ta với các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dấu chứng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: Các ngươi phải cắt
  rationale: Trong lời chỉ thị về giao ước, động từ mang lực bắt buộc hướng đến hành động phải thực hiện. Cách dịch chủ động tự nhiên trong tiếng Việt và phù hợp với tân ngữ được đánh dấu trong câu.
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: phần thịt nơi bao quy đầu của mình
  rationale: Giữ nghĩa cụ thể của בְּשַׂר là “thịt” và nghĩa giải phẫu của עָרְלָה là “bao quy đầu”, đồng thời diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וְהָיָה
  choice: đó sẽ là
  rationale: Đại từ “đó” quy chiếu tự nhiên về việc cắt bao quy đầu vừa được truyền dạy; “sẽ là” giữ sắc thái tương lai của mệnh đề.
- source_word: לְאוֹת
  choice: dấu hiệu
  rationale: אוֹת chỉ một dấu hiệu hay dấu chứng. “Dấu hiệu” minh bạch, thông dụng và không thêm hàm ý thần học ngoài câu.
- source_word: בְּרִית
  choice: giao ước
  rationale: Đây là thuật ngữ chuẩn, trang trọng và dễ hiểu cho בְּרִית trong ngữ cảnh quan hệ giao ước giữa Đức Chúa Trời và Áp-ra-ham.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: giữa ta với các ngươi
  rationale: Giữ ngôi thứ nhất của người phán và số nhiều của đối tượng được phán với; không tự ý mở rộng thành “dòng dõi” dù văn mạch rộng hơn có đề cập đến họ.
theological_decisions:
- issue: Bản chất của phép cắt bao quy đầu như dấu hiệu giao ước
  choice: dấu hiệu của giao ước
  alternative: dấu chứng của giao ước
  rationale: 'Bản dịch xác nhận đúng điều câu văn nói: phép cắt bao quy đầu là אוֹת của giao ước, nhưng không xác định thêm đây chỉ là biểu tượng hay mang hiệu lực bí tích.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “ta—các ngươi” để thể hiện lời Đức Chúa Trời phán với một nhóm người trong bối cảnh cổ đại, đồng thời giữ rõ số nhiều của tiếng Hê-bơ-rơ.
