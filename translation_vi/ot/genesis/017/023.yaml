source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: vi
  text: Vậy, Áp-ra-ham đem con trai mình là Ích-ma-ên, tất cả những người sinh ra trong nhà ông, và tất cả những người được ông dùng tiền mua về—tức mọi người nam trong nhà Áp-ra-ham—rồi cắt bì phần thịt bao quy đầu của họ ngay chính ngày hôm ấy[a], đúng như Đức Chúa Trời đã phán với ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ngay chính ngày này”; thành ngữ này nhấn mạnh rằng Áp-ra-ham đã thi hành ngay trong chính ngày hôm đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đúng như Đức Chúa Trời đã phán bảo ông.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: đem
  rationale: Trong mạch kể này, לקח mở đầu hành động Áp-ra-ham tập hợp và đưa những người thuộc nhà mình ra để chịu cắt bì; “đem” tự nhiên hơn “lấy” trong tiếng Việt mà vẫn giữ ý chính.
- source_word: יְלִידֵי בֵיתוֹ
  choice: những người sinh ra trong nhà ông
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ và không xác định quá mức địa vị xã hội của họ trong chính văn.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: những người được ông dùng tiền mua về
  rationale: Diễn đạt rõ đây là những người được mua để thuộc về gia hộ của Áp-ra-ham; “tiền” truyền đạt tự nhiên nghĩa của כֶּסֶף trong ngữ cảnh giao dịch.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵית אַבְרָהָם
  choice: mọi người nam trong nhà Áp-ra-ham
  rationale: Giữ rõ giới tính nam do זָכָר nêu ra, đồng thời tránh lối diễn đạt trùng lặp và nặng nề kiểu “mọi người nam trong số những người nam”.
- source_word: וַיָּמָל
  choice: cắt bì
  rationale: Đây là thuật ngữ tiếng Việt chuẩn, chính xác cho nghi thức được nói đến.
- source_word: בְּשַׂר עָרְלָתָם
  choice: phần thịt bao quy đầu của họ
  rationale: Giữ cách diễn đạt cụ thể về thân thể trong nguyên văn và thuật ngữ giao ước của phân đoạn.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ngay chính ngày hôm ấy
  rationale: Truyền đạt sắc thái nhấn mạnh của thành ngữ Hê-bơ-rơ rằng Áp-ra-ham thi hành ngay trong chính ngày đó.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: đúng như Đức Chúa Trời đã phán với ông
  rationale: “Phán với” vừa trang trọng, tự nhiên trong văn mạch Kinh Thánh, vừa giữ khả năng đối thoại của דִּבֶּר אִתּוֹ; thì hoàn thành trước được thể hiện bằng “đã”.
theological_decisions:
- issue: Cách dịch אֱלֹהִים trong văn mạch giao ước
  choice: Đức Chúa Trời
  alternative: Thiên Chúa
  rationale: Ở đây từ này chỉ Đức Chúa Trời duy nhất đang phán với Áp-ra-ham. “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt và không thêm nét giáo phái vào câu.
- issue: Ngôn ngữ chỉ giới tính trong mô tả gia hộ
  choice: mọi người nam trong nhà Áp-ra-ham
  alternative: mọi thành viên trong nhà Áp-ra-ham
  rationale: Nguyên văn nêu rõ זָכָר, “người nam/giống đực”; giữ “người nam” tránh trung tính hóa một chi tiết liên quan trực tiếp đến nghi thức cắt bì.
- issue: Sắc thái của דִּבֶּר אִתּוֹ
  choice: đã phán với ông
  alternative: đã phán bảo ông
  rationale: Giới từ אִתּוֹ có thể gợi “với ông,” trong khi toàn cụm cũng có thể được hiểu tự nhiên là “phán bảo ông.” Chính văn giữ sắc thái đối thoại; chú thích bảo tồn cách hiểu thay thế.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc liệt kê của nguyên văn nhưng dùng dấu gạch ngang để làm rõ rằng “mọi người nam” tóm gồm các nhóm vừa nêu. Các danh xưng riêng dùng dạng Việt hóa quen thuộc: Áp-ra-ham, Ích-ma-ên.'
