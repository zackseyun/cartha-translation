base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: vi
  text: 'Bấy giờ, Áp-ram sấp mặt xuống đất, và Đức Chúa Trời phán với ông rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: sấp ... xuống đất
  rationale: Động từ נפל ở thể Qal kể một hành động đã xảy ra; kết hợp với עַל־פָּנָיו, cách diễn đạt này tự nhiên trong tiếng Việt và thể hiện tư thế phủ phục.
- source_word: עַל פָּנָיו
  choice: mặt xuống đất
  rationale: Thành ngữ Hê-bơ-rơ mô tả việc phủ phục với mặt hướng xuống đất; bản dịch giữ hình ảnh thân thể mà vẫn rõ nghĩa đối với độc giả hiện đại.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt; ở điểm này tên ông chưa được đổi thành Áp-ra-ham.
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר ở thể Piel có nghĩa là nói. Khi chủ thể là Đức Chúa Trời, “phán” là từ trang trọng, tự nhiên và quen thuộc trong tiếng Việt.
- source_word: אִתּוֹ
  choice: với ông
  rationale: Giới từ אֵת kèm đại từ hậu tố có nghĩa sát là “với ông”, giữ được sắc thái tương tác của nguyên văn.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Dù hình thức từ có dạng số nhiều, động từ đi kèm ở số ít và ngữ cảnh chỉ về Đức Chúa Trời duy nhất; “Đức Chúa Trời” là cách gọi chuẩn, trang trọng trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dạng nguyên mẫu của אמר làm công thức dẫn lời trực tiếp. “Rằng” dẫn tự nhiên sang lời phán ở câu kế tiếp mà không lặp vụng “phán... nói”.
- source_word: וַ
  choice: Bấy giờ
  rationale: Liên từ mở đầu đánh dấu diễn tiến của câu chuyện; “Bấy giờ” tự nhiên trong văn kể trang trọng và thể hiện trình tự mà không chỉ đơn thuần nối bằng “và”.
theological_decisions:
- issue: Số và đối tượng quy chiếu của אֱלֹהִים
  choice: Đức Chúa Trời ở số ít
  alternative: các thần, dựa riêng vào hình thái số nhiều của danh từ
  rationale: Ngữ cảnh nói về Đức Chúa Trời của giao ước đang phán với Áp-ram, và động từ dùng ở số ít. Dịch số nhiều sẽ trái với cú pháp và ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sấp mặt xuống đất” truyền đạt tự nhiên hình ảnh phủ phục; “phán với ông rằng” giữ cả sắc thái của אִתּוֹ và chức năng dẫn lời của לֵאמֹר.
