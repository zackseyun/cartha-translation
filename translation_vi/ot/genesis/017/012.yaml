base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: vi
  text: 'Mọi người nam trong các ngươi, khi được tám ngày tuổi[a], đều phải chịu cắt bao quy đầu trải qua các thế hệ của các ngươi, dù là người sinh ra trong nhà hay người được mua bằng bạc[b] từ bất cứ người ngoại quốc nào không thuộc dòng dõi ngươi.[c]


    [a] Nguyên văn: “một con trai tám ngày”.


    [b] Cũng có thể dịch: “được mua bằng tiền”.


    [c] Nguyên văn: “từ mọi con trai của người ngoại quốc, là người không thuộc hạt giống của ngươi”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một con trai tám ngày”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được mua bằng tiền”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “từ mọi con trai của người ngoại quốc, là người không thuộc hạt giống của ngươi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: khi được tám ngày tuổi
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “một con trai tám ngày”, chỉ trẻ sơ sinh đã đủ tám ngày tuổi. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ thời điểm phải thực hiện nghi thức.
- source_word: יִמּוֹל
  choice: đều phải chịu cắt bao quy đầu
  rationale: Dạng Niphal mang nghĩa bị động hoặc phản thân và trong ngữ cảnh này có giá trị mệnh lệnh. “Phải chịu cắt bao quy đầu” truyền đạt đầy đủ tính bắt buộc mà không xác định thêm người thực hiện.
- source_word: לָכֶם כָּל זָכָר
  choice: mọi người nam trong vòng các ngươi
  rationale: Giữ nghĩa bao quát của כָּל זָכָר và diễn đạt לָכֶם theo nghĩa những người thuộc cộng đồng đang được nói đến.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua các thế hệ của các ngươi
  rationale: Diễn đạt sự tiếp tục áp dụng trong các thế hệ kế tiếp, đồng thời giữ hậu tố số nhiều của bản Hê-bơ-rơ.
- source_word: יְלִיד בָּיִת
  choice: người sinh ra trong nhà
  rationale: Bám sát cụm từ chỉ người được sinh ra bên trong gia hộ, nhưng vẫn tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: וּמִקְנַת כֶּסֶף
  choice: người được mua bằng bạc
  rationale: Giữ hình ảnh kinh tế cụ thể của כֶּסֶף là “bạc”; chú thích nêu cách hiểu rộng hơn là “tiền”.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: từ bất cứ người ngoại quốc nào
  rationale: “Con trai của người ngoại quốc” là lối nói Hê-bơ-rơ chỉ người ngoại quốc hoặc người ngoài dân tộc. Bản chính dùng cách diễn đạt tự nhiên, còn nghĩa đen được bảo lưu trong chú thích.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: không thuộc dòng dõi ngươi
  rationale: זֶרַע có nghĩa đen là “hạt giống” và trong ngữ cảnh này chỉ hậu duệ. “Dòng dõi” diễn đạt rõ quan hệ huyết thống; đại từ số ít “ngươi” giữ sự chuyển đổi số ngữ pháp của nguyên văn khi nói trực tiếp với Áp-ra-ham.
theological_decisions:
- issue: Phạm vi của lệnh cắt bao quy đầu trong gia hộ giao ước của Áp-ra-ham
  choice: Câu này bao gồm mọi người nam thuộc phạm vi gia hộ, kể cả người sinh ra trong nhà và người được mua từ người ngoại quốc, chứ không chỉ hậu duệ sinh học.
  alternative: Hiểu mệnh lệnh chủ yếu hoặc chỉ áp dụng cho hậu duệ thể xác của Áp-ra-ham.
  rationale: Nguyên văn minh nhiên nhắc đến cả người sinh trong nhà và người được mua, rồi nói họ không thuộc dòng dõi Áp-ra-ham. Bản dịch giữ phạm vi rộng ấy nhưng không suy diễn các kết luận thần học về sau.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Bản dịch giữ sự khác biệt giữa các hậu tố số nhiều (“các ngươi”) và số ít (“ngươi”) trong nguyên văn; dùng “cắt bao quy đầu” là thuật ngữ phổ thông, rõ nghĩa. Dấu phẩy và cấu trúc “dù là... hay...” làm sáng tỏ hai nhóm trong gia hộ mà không thêm nội dung.
