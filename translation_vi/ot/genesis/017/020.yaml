base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: vi
  text: Còn về Ích-ma-ên, Ta đã nghe con. Này, Ta đã ban phước cho người ấy; Ta sẽ làm cho người ấy sinh sôi nảy nở và trở nên đông đúc vô cùng. Người ấy sẽ là cha của mười hai thủ lĩnh, và Ta sẽ làm cho người ấy trở thành một dân tộc lớn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל
  choice: Còn về Ích-ma-ên
  rationale: Cấu trúc לְ mở chủ đề, chuyển tự nhiên sang tiếng Việt là “Còn về”; tên riêng dùng dạng quen thuộc trong tiếng Việt.
- source_word: שְׁמַעְתִּיךָ
  choice: Ta đã nghe lời con
  rationale: Động từ שׁמע với hậu tố chỉ người nghe theo nghĩa chấp nhận lời thỉnh cầu; “nghe lời con” tự nhiên và không thêm đối tượng ngoài văn bản.
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của tiểu từ Hê-bơ-rơ.
- source_word: הִפְרֵיתִי אֹתוֹ
  choice: Ta sẽ làm cho nó sinh sôi nảy nở
  rationale: Hifil của פרה diễn tả khiến trở nên đông đúc/sinh sản; thì hoàn thành mang giá trị chắc chắn trong lời hứa, được diễn đạt bằng tương lai tiếng Việt.
- source_word: וְהִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד
  choice: và gia tăng vô cùng
  rationale: Truyền đạt cường độ lặp מְאֹד מְאֹד bằng cách nói Việt tự nhiên, mạnh mà không rườm rà.
- source_word: נְשִׂיאִם
  choice: thủ lĩnh
  rationale: נָשִׂיא chỉ người đứng đầu hoặc thủ lĩnh bộ tộc; “thủ lĩnh” phù hợp bối cảnh và tránh áp đặt mô hình quân chủ.
- source_word: לְגוֹי גָּדוֹל
  choice: trở thành một dân lớn
  rationale: גּוֹי là một dân/dân tộc; “dân lớn” giữ gần cấu trúc nguồn và hàm ý đông mạnh.
theological_decisions:
- issue: Quan hệ giữa lời ban phước cho Ích-ma-ên và giao ước qua Y-sác
  choice: Dịch nguyên lời ban phước trong câu này, không thêm hoặc giảm giá trị giao ước
  alternative: Chú giải ngay trong câu rằng đây không phải lời hứa giao ước
  rationale: Câu 20 khẳng định phước lành dành cho Ích-ma-ên; sự phân biệt với giao ước được nêu trong ngữ cảnh kế tiếp, không nên nhập vào câu này.
- issue: Giá trị thời gian của các động từ hoàn thành trong lời hứa
  choice: “đã ban phước” cho בֵּרַכְתִּי, nhưng dùng “sẽ” cho các kết quả tiếp theo
  alternative: Dịch tất cả bằng quá khứ hoặc tất cả bằng tương lai
  rationale: 'Cách này vừa phản ánh hình thái nguồn vừa tạo tiếng Việt rõ nghĩa: phước lành được tuyên bố như đã xác lập, còn sinh sôi và thành dân lớn là sự thực hiện trong tương lai.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con/nó” phản ánh lời Đức Chúa Trời phán với Áp-ra-ham và cách quy chiếu nhất quán đến Ích-ma-ên; tránh lối cổ quá mức.
