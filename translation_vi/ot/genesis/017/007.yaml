  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: vi
  text: Ta sẽ lập giao ước của Ta giữa Ta, con và dòng dõi[a] con sau con, qua các thế hệ của họ—một giao ước đời đời—để Ta là Đức Chúa Trời của con[b] và của dòng dõi con sau con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dòng dõi” dịch một danh từ số ít mang nghĩa tập hợp trong tiếng Hê-bơ-rơ; từ này cũng có thể được dịch là “hạt giống” hoặc “hậu duệ.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để Ta là Đức Chúa Trời cho con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Ta sẽ lập
  rationale: Động từ הֵקִים đi với בְּרִית thường có nghĩa là thiết lập hoặc xác lập một giao ước. “Lập” tự nhiên, trang trọng và không thu hẹp nghĩa thành chỉ duy trì một giao ước đã có.
- source_word: בְּרִיתִי
  choice: giao ước của Ta
  rationale: Giữ nguyên danh từ giao ước và hậu tố sở hữu ngôi thứ nhất của tiếng Hê-bơ-rơ.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: giữa Ta với con và với
  rationale: Diễn đạt tự nhiên trong tiếng Việt cấu trúc בֵּין được lặp lại để xác định các bên của giao ước.
- source_word: זַרְעֲךָ
  choice: dòng dõi con
  rationale: זֶרַע là danh từ số ít mang nghĩa tập hợp, có thể chỉ hạt giống, hậu duệ hoặc dòng dõi. “Dòng dõi” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái tập hợp mà không buộc nghĩa thành một cá nhân hay nhiều cá nhân riêng lẻ.
- source_word: אַחֲרֶיךָ
  choice: sau con
  rationale: Giữ trực tiếp ý nghĩa thời gian và phả hệ của cụm từ Hê-bơ-rơ.
- source_word: לְדֹרֹתָם
  choice: trải qua các thế hệ của họ
  rationale: Thể hiện sự tiếp nối qua nhiều thế hệ và giữ đại từ số nhiều quy chiếu đến dòng dõi mang nghĩa tập hợp.
- source_word: לִבְרִית עוֹלָם
  choice: làm một giao ước đời đời
  rationale: עוֹלָם trong ngữ cảnh giao ước diễn tả tính bền vững lâu dài. “Đời đời” là cách nói quen thuộc, dễ hiểu và trang trọng.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: để làm Đức Chúa Trời của con
  rationale: Diễn đạt tự nhiên công thức quan hệ giao ước trong tiếng Việt. Chú thích ghi nhận cấu trúc sát chữ hơn, “làm Đức Chúa Trời cho con”.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: và của dòng dõi con sau con
  rationale: Lặp lại nhất quán cách dịch זֶרַע và אַחֲרֶיךָ, đồng thời phối hợp tự nhiên với cụm “Đức Chúa Trời của con” trong tiếng Việt.
theological_decisions:
- issue: Phạm vi ý nghĩa của זֶרַע trong lời hứa giao ước
  choice: dòng dõi
  alternative: hạt giống; hậu duệ
  rationale: “Dòng dõi” giữ được nghĩa tập hợp của danh từ số ít Hê-bơ-rơ, không giải quyết trước căng thẳng giữa ý nghĩa cộng đồng và khả năng quy chiếu đại diện trong văn mạch Kinh Thánh rộng hơn.
- issue: Cách diễn đạt công thức giao ước לִהְיוֹת לְךָ לֵאלֹהִים
  choice: để làm Đức Chúa Trời của con
  alternative: để làm Đức Chúa Trời cho con
  rationale: Bản văn chính dùng tiếng Việt tự nhiên nhưng không thêm nội dung thần học; chú thích bảo tồn cấu trúc quan hệ sát chữ của nguyên ngữ.
- issue: Ý nghĩa thời hạn của עוֹלָם
  choice: đời đời
  alternative: vĩnh viễn; lâu dài
  rationale: “Đời đời” bảo tồn sức nặng của công thức giao ước mà không thêm lời giải thích nhằm giới hạn hay mở rộng thời hạn ngay trong bản dịch.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” phù hợp lời Đức Chúa Trời phán trực tiếp với Áp-ra-ham. Câu giữ nhịp lặp của giao ước trong nguyên ngữ nhưng điều chỉnh giới từ và sở hữu để tự nhiên trong tiếng Việt.
