  - severity: low
    issue: “Ra từ con” trong hai mệnh đề hậu duệ
    rationale: Không sai nghĩa, nhưng “phát xuất từ con” tự nhiên và chính xác hơn trong ngữ cảnh nguồn gốc dòng dõi; nó vẫn bảo toàn hình ảnh các dân tộc và vua có nguồn gốc từ Áp-ra-ham.
