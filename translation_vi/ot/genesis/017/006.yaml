  terminology: “Sinh sôi nảy nở,” “dân tộc,” và “các vua” đều thích hợp. Không nên dùng “dân ngoại” cho גּוֹיִם trong ngữ cảnh này. Bản sửa không biến lời hứa thành một diễn giải thần học cụ thể hơn điều bản văn nói.
  issues:
