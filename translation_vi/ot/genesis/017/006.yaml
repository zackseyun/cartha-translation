base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: vi
  text: Ta sẽ làm cho con sinh sôi nảy nở thật nhiều[a]; Ta sẽ làm cho nhiều dân tộc phát xuất từ con, và các vua sẽ phát xuất từ con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “rất, rất nhiều.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát chữ: “sẽ đi ra từ con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: Ta sẽ làm cho con sinh sôi nảy nở
  rationale: Dạng Hiphil của פרה mang nghĩa khiến cho sinh sản, kết quả dồi dào; cách diễn đạt này giữ sắc thái tác động và tự nhiên trong tiếng Việt.
- source_word: בִּמְאֹד מְאֹד
  choice: vô cùng
  rationale: Hai lần מְאֹד tạo mức nhấn mạnh cao; “vô cùng” truyền đạt tự nhiên cường độ ấy, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: Ta sẽ khiến nhiều dân tộc ra từ con
  rationale: 'נתן kết hợp với ל ở đây chỉ kết quả: Áp-ra-ham trở thành nguồn gốc của nhiều dân tộc. Cách dịch này bám sát mạch nói về dòng dõi mà không biến chính Áp-ra-ham theo nghĩa đen thành các dân tộc.'
- source_word: לְגוֹיִם
  choice: nhiều dân tộc
  rationale: גּוֹיִם là số nhiều, chỉ các dân tộc hay các cộng đồng dân tộc; “nhiều dân tộc” rõ nghĩa trong lời hứa về dòng dõi và không giới hạn thành “dân ngoại”.
- source_word: וּמְלָכִים
  choice: và các vua
  rationale: מְלָכִים chỉ cụ thể các vua; không nên làm rộng nghĩa thành “những người cai trị”.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: sẽ ra từ con
  rationale: יצא nghĩa cơ bản là “đi ra/ra”; trong ngữ cảnh phả hệ, cụm này nói các vua phát xuất từ dòng dõi của Áp-ra-ham. Giữ “ra từ con” vừa hiểu được vừa bảo toàn hình ảnh của nguyên văn.
theological_decisions:
- issue: Phạm vi của lời hứa về hậu duệ Áp-ra-ham
  choice: Câu này hứa rằng nhiều dân tộc và các vua sẽ phát xuất từ Áp-ra-ham.
  alternative: Có thể hiểu trừu tượng hơn rằng Áp-ra-ham được đặt vào một địa vị liên quan đến các dân tộc.
  rationale: Ngữ cảnh giao ước trực tiếp nhấn mạnh sự sinh sôi và dòng dõi; cách diễn đạt theo nghĩa phát sinh từ Áp-ra-ham phù hợp nhất với cú pháp và ngữ cảnh, đồng thời không áp đặt một hệ thống thần học về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—con” cho lời Đức Chúa Trời phán trực tiếp với Áp-ra-ham; “sinh sôi nảy nở” là cách nói quen thuộc, truyền đạt sắc thái gây nên sự kết quả dồi dào.
