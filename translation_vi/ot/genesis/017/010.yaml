base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: vi
  text: Đây là giao ước của ta mà các ngươi phải giữ, giữa ta với các ngươi và với dòng dõi ngươi về sau:[a] mọi người nam trong số các ngươi đều phải chịu cắt bì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “con cháu ngươi về sau” hoặc “hậu duệ ngươi về sau.” Từ Hê-bơ-rơ זֶרַע là danh từ tập hợp, có thể chỉ dòng dõi hoặc hậu duệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: Đây là giao ước của ta
  rationale: Tiếng Hê-bơ-rơ không có hệ từ hiện rõ; “Đây là” diễn đạt tự nhiên cấu trúc giới thiệu điều khoản giao ước. “Giao ước” là thuật ngữ chuẩn cho בְּרִית trong Sáng Thế Ký.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: mà các ngươi phải gìn giữ
  rationale: Thể chưa hoàn thành trong ngữ cảnh giao ước biểu thị nghĩa vụ. “Gìn giữ” giữ được ý tuân thủ và bảo toàn giao ước, còn “phải” truyền đạt rõ lực bắt buộc.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: giữa ta với các ngươi và với dòng dõi các ngươi sau này
  rationale: “Dòng dõi” thể hiện nghĩa tập hợp của זֶרַע và phù hợp văn phong Kinh Thánh hiện đại. Đại từ Hê-bơ-rơ chuyển từ số nhiều “các ngươi” sang số ít “ngươi”; tiếng Việt dùng số nhiều xuyên suốt để câu tự nhiên vì lời phán hướng đến Áp-ra-ham cùng cộng đồng giao ước, nhưng không làm thay đổi phạm vi hậu duệ.
- source_word: הִמּוֹל
  choice: đều phải chịu cắt bì
  rationale: Dạng nguyên mẫu tuyệt đối ở đây nêu yêu cầu giao ước. “Chịu cắt bì” diễn đạt tự nhiên việc mỗi người nam được thực hiện nghi thức, còn “phải” giữ lực mệnh lệnh.
- source_word: לָכֶם כָּל זָכָר
  choice: mọi người nam trong các ngươi
  rationale: לָכֶם trong ngữ cảnh xác định nhóm áp dụng; “trong các ngươi” diễn đạt ý đó. כָּל זָכָר được dịch cụ thể là “mọi người nam”, không khái quát thành toàn thể mọi người.
theological_decisions:
- issue: Phạm vi theo giới tính của dấu hiệu giao ước
  choice: mọi người nam trong các ngươi đều phải chịu cắt bì
  alternative: tất cả các ngươi đều phải chịu cắt bì
  rationale: Bản Hê-bơ-rơ nói rõ כָּל זָכָר, “mọi người nam”; vì vậy bản dịch giữ nguyên phạm vi theo giới tính, không mở rộng điều răn vượt quá lời văn.
- issue: Quan hệ giữa giao ước và nghi thức cắt bì
  choice: giữ cấu trúc trong đó “giao ước” được giới thiệu rồi yêu cầu cắt bì được nêu sau dấu hai chấm
  alternative: diễn giải cắt bì chỉ là dấu hiệu của giao ước
  rationale: Câu này gọi yêu cầu cắt bì là giao ước phải gìn giữ; bản dịch giữ nguyên sức căng trong cách diễn đạt đó, không chèn lời giải thích thần học từ câu kế tiếp.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “ta/các ngươi” để phản ánh lời phán có thẩm quyền của Đức Chúa Trời với người nhận số nhiều; dùng “cắt bì” là thuật ngữ tiếng Việt phổ thông và chính xác.
