revisions:
- from: 'Đây là giao ước của ta mà các ngươi phải gìn giữ, giữa ta với các ngươi và với dòng dõi các ngươi sau này: mọi người nam trong các ngươi đều phải chịu cắt bì.[a]'
  to: Đây là giao ước của ta mà các ngươi phải giữ, giữa ta với các ngươi và với dòng dõi ngươi về sau:[a] mọi người nam trong số các ngươi đều phải chịu cắt bì.
  rationale: Bản sửa giữ sát cấu trúc và phạm vi giới tính của tiếng Hê-bơ-rơ, cải thiện cách nói tiếng Việt ở cụm chỉ nhóm áp dụng, và thay chú thích về לָכֶם bằng chú thích từ vựng thích hợp cho זֶרַע. Số ít trong “dòng dõi ngươi” được giữ để phản ánh bản nguồn, dù câu trước dùng “các ngươi”.
