    rationale: Trong ngữ cảnh, “trong số các ngươi” đã diễn đạt thỏa đáng lực phân bố của לָכֶם. Hồ sơ đối chiếu tiếng Anh xác định điểm cần chú thích là tính tập hợp của זֶרַע, có thể dịch là “dòng dõi” hoặc “con cháu/hậu duệ”.
