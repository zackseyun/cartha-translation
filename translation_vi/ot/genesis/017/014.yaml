revisions:
- from: Còn người nam nào không chịu cắt bao quy đầu nơi phần thịt bao quy đầu mình, thì người ấy phải bị dứt khỏi dân mình[a][b]; người ấy đã vi phạm giao ước của Ta.
  to: Còn người nam nào không cắt phần thịt bao quy đầu của mình thì người ấy sẽ bị cắt khỏi dân mình[a][b]; người ấy đã vi phạm giao ước của Ta.
  rationale: Bản sửa loại bỏ sắc thái cố ý không có trong nguyên văn, phục hồi quan hệ trực tiếp giữa động từ và “phần thịt bao quy đầu”, và dùng “bị cắt khỏi” để bảo toàn thành ngữ chế tài mà không quyết định trước bản chất hình phạt. Các chú thích được chỉnh để khớp với chính văn và vẫn giữ sự mơ hồ của nguyên ngữ.
