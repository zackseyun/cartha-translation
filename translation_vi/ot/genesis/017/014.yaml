  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: vi
  text: Còn người nam nào không cắt phần thịt bao quy đầu của mình thì người ấy sẽ bị cắt khỏi dân mình[a][b]; người ấy đã vi phạm giao ước của Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng từ có thể nghĩa là “người” hoặc “linh hồn”; trong ngữ cảnh này, từ ấy chỉ chính người chịu chế tài.
    reason: lexical_alternative
  - marker: b
    text: “Bị cắt khỏi” là thành ngữ về chế tài giao ước. Tùy ngữ cảnh, nó có thể bao hàm việc bị loại khỏi cộng đồng hoặc cái chết; riêng câu này không nói rõ hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: Còn người nam nào không chịu cắt bao quy đầu
  rationale: Cụm Hê-bơ-rơ chỉ một người thuộc nam giới vẫn chưa chịu phép cắt bao quy đầu. Cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với điều kiện pháp lý của mạch văn.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: không chịu cắt bao quy đầu
  rationale: Dạng Niphal có nghĩa bị động hoặc phản thân. Trong ngữ cảnh mệnh lệnh giao ước, cách dịch này diễn đạt tình trạng chưa được cắt bao quy đầu mà không xác định ai thực hiện thủ thuật.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: nơi phần thịt bao quy đầu mình
  rationale: Giữ lại cách nói cụ thể về thân thể trong nguyên văn thay vì lược bỏ như thể câu chỉ nói chung về tình trạng chưa cắt bao quy đầu.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: thì người ấy phải bị dứt khỏi
  rationale: נפש ở đây chỉ chính cá nhân chịu hình phạt, nên dịch là “người ấy” thay vì “linh hồn ấy”. “Bị dứt khỏi” giữ hình ảnh và tính không xác định của thành ngữ chế tài giao ước.
- source_word: מֵעַמֶּיהָ
  choice: dân mình
  rationale: עם chỉ cộng đồng dân giao ước. Đại từ giống cái trong tiếng Hê-bơ-rơ hòa hợp ngữ pháp với נפש, nhưng người được nói đến là người nam, nên tiếng Việt dùng “mình” tự nhiên và không gây nhầm lẫn.
- source_word: אֶת בְּרִיתִי
  choice: giao ước của Ta
  rationale: “Giao ước” là thuật ngữ tiếng Việt chuẩn cho ברית và giữ trọng lượng thần học của chương này.
- source_word: הֵפַר
  choice: đã vi phạm
  rationale: Động từ có thể mang nghĩa phá bỏ, vi phạm hoặc làm mất hiệu lực một giao ước. “Vi phạm” tự nhiên trong ngữ cảnh quy định giao ước và không hàm ý rằng toàn bộ giao ước đã bị cá nhân ấy hủy bỏ.
theological_decisions:
- issue: Ý nghĩa của chế tài giao ước כרת (“bị dứt khỏi”)
  choice: Giữ thành ngữ “phải bị dứt khỏi dân mình” và không xác định thêm hình phạt.
  alternative: Bị khai trừ khỏi cộng đồng giao ước; hoặc bị xử tử.
  rationale: Chính câu này không nói rõ chế tài là khai trừ, cái chết hay một hình thức phán xét nghiêm khắc khác. Giữ thành ngữ bảo toàn sự hàm hồ và sức nặng của nguyên văn.
- issue: Cách dịch נפש
  choice: người ấy
  alternative: linh hồn ấy
  rationale: Trong quy định pháp lý này, נפש chỉ toàn thể cá nhân chịu chế tài, chứ không nhất thiết chỉ một thành phần phi vật chất của con người.
- issue: Sắc thái của הֵפַר đối với giao ước
  choice: đã vi phạm giao ước của Ta
  alternative: đã phá bỏ giao ước của Ta
  rationale: “Vi phạm” nêu rõ hành động bất tuân của cá nhân mà không giải quyết quá mức câu hỏi liệu một cá nhân có thể làm cho toàn bộ giao ước mất hiệu lực hay không.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Trời theo văn phong Kinh Thánh tiếng Việt; giữ thuật ngữ “giao ước”. Cụm chỉ bộ phận cơ thể được diễn đạt trực tiếp nhưng trang nghiêm. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
