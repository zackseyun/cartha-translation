  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: vi
  text: 'Áp-ra-ham thưa với Đức Chúa Trời: “Ước gì Ích-ma-ên sống trước mặt Ngài![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Chỉ mong Ích-ma-ên sống trong sự hiện diện của Ngài,” hoặc “dưới ân huệ của Ngài.”'
    reason: Nêu sắc thái nguyện ước của לוּ và những hàm ý có thể có của לְפָנֶיךָ mà không đưa cách giải thích rộng hơn vào chính văn.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: thưa
  rationale: Động từ mở đầu tiếp nối mạch kể chuyện. Trong ngữ cảnh Áp-ra-ham nói với Đức Chúa Trời, “thưa” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt mà không thêm nội dung vào lời nói.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Mạo từ xác định cho thấy đây là chính Đức Chúa Trời đang được nói đến trong ngữ cảnh; danh xưng quen thuộc này tự nhiên và trang trọng trong tiếng Việt.
- source_word: לוּ
  choice: Ước gì
  rationale: Ở đây לוּ diễn tả một nguyện ước tha thiết chứ không phải điều kiện. “Ước gì” giữ được sắc thái cảm xúc ấy bằng tiếng Việt hiện đại.
- source_word: יִשְׁמָעֵאל
  choice: Ích-ma-ên
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc và dễ đọc.
- source_word: יִחְיֶה
  choice: được sống
  rationale: Dạng chưa hoàn thành đi sau tiểu từ chỉ nguyện ước diễn tả mong muốn Ích-ma-ên tiếp tục sống và được tồn tại; “được sống” phù hợp tự nhiên với cấu trúc “ước gì”.
- source_word: לְפָנֶיךָ
  choice: trước mặt Ngài
  rationale: Cụm từ có nghĩa sát là “trước mặt/trong sự hiện diện của Ngài.” Cách dịch này giữ hình ảnh và để ngỏ hàm ý về sự hiện diện, chấp nhận hay ân huệ của Đức Chúa Trời.
theological_decisions:
- issue: Nội hàm lời cầu mong của Áp-ra-ham về Ích-ma-ên trước Đức Chúa Trời
  choice: trước mặt Ngài
  alternative: trong sự hiện diện của Ngài; dưới ân huệ của Ngài
  rationale: Cụm Hê-bơ-rơ có thể hàm ý sống trong sự hiện diện và ân huệ của Đức Chúa Trời, nhưng câu này không xác định đầy đủ địa vị giao ước của Ích-ma-ên. Bản dịch chính giữ cách nói ngắn gọn để không giải quyết thay sự căng thẳng thần học của mạch văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” thể hiện ngữ cảnh nói với Đức Chúa Trời; “Ước gì” truyền đạt lời mong cầu tha thiết. Đại từ “Ngài” được viết hoa theo lối dùng tiếng Việt kính trọng dành cho Đức Chúa Trời.
