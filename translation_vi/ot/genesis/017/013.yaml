  text: הִמּ֧וֹל יִמּ֛וֹל יְלִ֥יד בֵּֽיתְ/ךָ֖ וּ/מִקְנַ֣ת כַּסְפֶּ֑/ךָ וְ/הָיְתָ֧ה בְרִיתִ֛/י בִּ/בְשַׂרְ/כֶ֖ם לִ/בְרִ֥ית עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: vi
  text: Người sinh trong gia đình ngươi và người được mua bằng tiền của ngươi nhất định phải chịu cắt bì.[a][b] Giao ước của Ta sẽ ở trong thân thể các ngươi như một giao ước đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chắc chắn phải chịu cắt bì.” Tiếng Hê-bơ-rơ dùng nguyên thể tuyệt đối cùng với động từ hữu hạn để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: Các cụm “người sinh trong gia đình” và “người được mua bằng tiền” chỉ những người thuộc gia hộ của Áp-ra-ham, gồm người sinh trong gia hộ và người được mua.
    reason: cultural_note
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: đều nhất thiết phải chịu cắt bì
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động; cách dịch này diễn đạt cả tính bắt buộc trong ngữ cảnh lẫn sắc thái nhấn mạnh.
- source_word: יְלִיד בֵּיתְךָ
  choice: người sinh ra trong nhà ngươi
  rationale: Giữ nghĩa sát là người được sinh ra trong gia hộ, không đưa tình trạng nô lệ vào chính văn khi cụm từ này tự nó không nói rõ điều đó.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: người được mua bằng tiền của ngươi
  rationale: Diễn đạt tự nhiên việc một người được thu nhận qua mua bán; 'tiền' chuyển tải đúng nghĩa kinh tế của 'bạc' trong thành ngữ Hê-bơ-rơ.
- source_word: בְרִיתִי
  choice: giao ước của Ta
  rationale: Cách dịch chuẩn, minh nhiên giữ ngôn ngữ giao ước và hậu tố ngôi thứ nhất.
- source_word: בִּבְשַׂרְכֶם
  choice: ở trong thân thể các ngươi
  rationale: Giữ giới từ 'trong' và mối liên hệ trực tiếp giữa giao ước với dấu hiệu nơi thân thể; 'thân thể' tự nhiên hơn 'xác thịt' trong tiếng Việt hiện đại ở ngữ cảnh này.
- source_word: לִבְרִית עוֹלָם
  choice: như một giao ước đời đời
  rationale: Giới từ ל diễn tả vai trò hoặc kết quả; 'giao ước đời đời' giữ nguyên sức nặng và tính mở của עוֹלָם.
theological_decisions:
- issue: Mối quan hệ giữa dấu cắt bì nơi thân thể và giao ước
  choice: Giữ lời khẳng định trực tiếp rằng giao ước của Đức Chúa Trời sẽ ở trong thân thể họ, không giải thích dấu này chỉ mang tính biểu tượng hay mang hiệu lực theo một hệ thống thần học cụ thể.
  alternative: Diễn giải dấu thể chất chỉ tượng trưng cho tư cách thành viên giao ước, hoặc đồng nhất dấu với giao ước theo nghĩa bí tích mạnh hơn.
  rationale: Câu Hê-bơ-rơ nói trực tiếp 'giao ước của Ta sẽ ở trong thân thể các ngươi'; bản dịch bảo tồn sự căng thẳng thần học ấy thay vì giải quyết nó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ 'Ta/ngươi/các ngươi' để giữ sắc thái lời phán trong ngữ cảnh Kinh Thánh; tránh từ cổ khó hiểu. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
