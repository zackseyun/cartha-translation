  edition: WLC
  text: וַ/יִּפֹּ֧ל אַבְרָהָ֛ם עַל פָּנָ֖י/ו וַ/יִּצְחָ֑ק וַ/יֹּ֣אמֶר בְּ/לִבּ֗/וֹ הַ/לְּ/בֶ֤ן מֵאָֽה שָׁנָה֙ יִוָּלֵ֔ד וְ/אִ֨ם שָׂרָ֔ה הֲ/בַת תִּשְׁעִ֥ים שָׁנָ֖ה תֵּלֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: vi
  text: 'Áp-ra-ham liền sấp mặt xuống và cười. Ông tự nhủ: “Liệu một người đã một trăm tuổi mà có con[a] được sao? Còn Sa-ra, đã chín mươi tuổi, mà sinh con được sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “có con trai”. Từ Hê-bơ-rơ ở đây nghĩa đen là “con trai”.'
    reason: Bảo tồn phương án dịch sát chữ của danh từ בן, trong khi chính văn dùng “có con” tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו
  choice: Áp-ra-ham liền sấp mặt xuống
  rationale: Diễn đạt tự nhiên tư thế ngã hoặc phủ phục với mặt hướng xuống, nhưng không tự ý xác định đây là hành vi thờ phượng.
- source_word: וַיִּצְחָק
  choice: và cười
  rationale: Động từ צחק có nghĩa trực tiếp là “cười”; cách dịch trung tính cũng giữ mối liên hệ với tên Y-sác trong văn mạch.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: Ông tự nhủ
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “nói trong lòng”; “tự nhủ” truyền đạt tự nhiên rằng đây là lời nói thầm trong tâm trí.
- source_word: הַלְּבֶן
  choice: Liệu một đứa con[a]
  rationale: בן thường có nghĩa là “con trai” nhưng trong câu hỏi này cũng có thể nhấn mạnh rộng hơn đến việc có con; chú thích bảo tồn sắc thái từ vựng.
- source_word: יִוָּלֵד
  choice: có thể được sinh ra
  rationale: Giữ thể bị động của Niphal ילד và sắc thái câu hỏi về khả năng một đứa trẻ chào đời.
- source_word: מֵאָה שָׁנָה
  choice: người đã trăm tuổi
  rationale: Cách nói tuổi tác tự nhiên, trang trọng trong tiếng Việt.
- source_word: וְאִם שָׂרָה
  choice: Còn Sa-ra
  rationale: Trong cặp câu hỏi tu từ, וְאִם dẫn vào vế thứ hai; “Còn” tạo sự đối chiếu tự nhiên trong tiếng Việt.
- source_word: הֲבַת תִּשְׁעִים שָׁנָה
  choice: đã chín mươi tuổi
  rationale: Chuyển thành ngữ Hê-bơ-rơ “con gái của chín mươi năm” sang cách nói tuổi tác tự nhiên mà không thêm danh từ không có trong nguyên văn.
- source_word: תֵּלֵד
  choice: sinh con
  rationale: Động từ Qal ילד với Sa-ra làm chủ ngữ chỉ việc sinh nở; “sinh con” là cách diễn đạt rõ ràng, hiện đại.
theological_decisions:
- issue: Sắc thái tiếng cười của Áp-ra-ham
  choice: Dịch trung tính là “cười”
  alternative: “cười vì không tin” hoặc “cười vì vui mừng”
  rationale: Câu này thuật lại hành động và câu hỏi thầm của Áp-ra-ham nhưng không nói rõ phẩm chất đạo đức hay động cơ của tiếng cười; bản dịch không nên tự giải quyết sự căng thẳng ấy.
- issue: Sắc thái của hai câu hỏi
  choice: Giữ dưới dạng câu hỏi tu từ về điều tưởng như không thể
  alternative: Chuyển thành lời khẳng định rằng việc ấy không thể xảy ra
  rationale: Nguyên văn dùng cấu trúc nghi vấn; giữ câu hỏi bảo tồn cả sự kinh ngạc lẫn khả năng chưa được xác định rõ là hoài nghi hay kinh ngạc trong đức tin.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Sấp mặt xuống” giữ hình ảnh cụ thể mà không diễn giải tư thế ấy theo một ý nghĩa nghi lễ nhất định; “tự nhủ” diễn đạt tự nhiên lời nói trong lòng.
