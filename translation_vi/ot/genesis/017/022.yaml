  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: vi
  text: Khi Đức Chúa Trời nói với Áp-ra-ham xong, Ngài từ chỗ Áp-ra-ham đi lên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát: “Đức Chúa Trời đi lên từ trên Áp-ra-ham.” Tiếng Hê-bơ-rơ dùng động từ “đi lên,” diễn tả sự kết thúc cuộc hiện ra của Đức Chúa Trời bằng ngôn ngữ không gian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל לְדַבֵּר אִתּוֹ
  choice: Khi Đức Chúa Trời nói chuyện với ông xong
  rationale: Cấu trúc כלה + động từ nguyên mẫu mang nghĩa “nói xong.” Chủ ngữ được nêu rõ là Đức Chúa Trời theo mệnh đề kế tiếp và ngữ cảnh; “nói chuyện với ông” giữ sắc thái tương tác của אִתּוֹ, trong đó “ông” chỉ Áp-ra-ham.
- source_word: וַיַּעַל
  choice: Ngài đi lên
  rationale: Động từ עלה diễn tả chuyển động đi lên. Cách dịch này giữ nguyên hình ảnh không gian cụ thể của bản Hê-bơ-rơ, thay vì làm phẳng thành “rời đi.”
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít và ngữ cảnh xác định đây là Đức Chúa Trời; danh xưng quen thuộc này phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: מֵעַל אַבְרָהָם
  choice: khỏi Áp-ra-ham
  rationale: מֵעַל có nghĩa đen là “từ bên trên/trên.” Trong ngữ cảnh cuộc hiện ra kết thúc, “khỏi Áp-ra-ham” tự nhiên hơn trong tiếng Việt nhưng vẫn giữ quan hệ xuất phát gắn với động từ “đi lên.”
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách diễn tả mang tính không gian về việc Đức Chúa Trời kết thúc cuộc hiện ra
  choice: Giữ hình ảnh “Ngài đi lên khỏi Áp-ra-ham”
  alternative: “Đức Chúa Trời rời Áp-ra-ham” hoặc “Đức Chúa Trời lui khỏi Áp-ra-ham”
  rationale: Bản Hê-bơ-rơ dùng động từ chỉ sự đi lên. Giữ cách diễn tả này bảo toàn hình ảnh của trình thuật mà không suy diễn rằng Đức Chúa Trời bị giới hạn về không gian.
- issue: Chủ thể của hành động “nói xong”
  choice: Nêu rõ “Đức Chúa Trời”
  alternative: Giữ đại từ “Ngài” ngay từ đầu
  rationale: Tiếng Hê-bơ-rơ có thể dựa vào ngữ cảnh để xác định chủ thể; tiếng Việt rõ và tự nhiên hơn khi nêu danh xưng trước, rồi dùng “Ngài” ở mệnh đề sau. Điều này không thay đổi quan hệ ngữ pháp hay nội dung thần học.
translation_notes:
  register: Văn phong trang trọng vừa phải, tự nhiên và dễ hiểu. “Nói chuyện với” thể hiện đúng tính tương tác của giới từ Hê-bơ-rơ; “đi lên khỏi” cố ý giữ hình ảnh không gian của nguyên văn. Dấu chú thích [a] được đặt ngay sau câu liên quan.
