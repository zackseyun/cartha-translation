- from: Khi Đức Chúa Trời nói chuyện với ông xong, Ngài đi lên khỏi Áp-ra-ham.[a]
  to: Khi Đức Chúa Trời nói với Áp-ra-ham xong, Ngài từ chỗ Áp-ra-ham đi lên.[a]
  rationale: Bản sửa giữ trọn cấu trúc thời gian («Khi ... xong»), chủ thể Đức Chúa Trời, quan hệ nói với Áp-ra-ham, và động từ «đi lên». «Từ chỗ Áp-ra-ham» làm câu tiếng Việt tự nhiên hơn, còn chú thích bảo lưu cách hiểu sát chữ của giới từ מֵעַל và hình ảnh không gian của nguyên văn.
