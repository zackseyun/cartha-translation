  timestamp: '2026-07-19T02:05:39Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng diễn tiến tự sự, Đức Chúa Trời là chủ thể phát ngôn, quan hệ “Sa-rai, vợ ông,” mệnh lệnh không gọi bằng tên cũ, và lời tuyên bố tên mới. Tuy nhiên, cụm “gọi tên bà là Sa-rai” chưa tự nhiên trong tiếng Việt hiện đại; “gọi bà bằng tên Sa-rai” vừa rõ nghĩa vừa vẫn giữ yếu tố “tên” của công thức Hê-bơ-rơ.
  naturalness: “Rồi Đức Chúa Trời phán” và cách xưng hô “ông/bà” phù hợp văn phong trang trọng, hiện đại. Cần điều chỉnh cú pháp của mệnh đề cấm truyền để câu đọc tự nhiên hơn. Đặt ký hiệu chú thích ngay sau tên cũ giúp xác định rõ chú thích liên quan đến công thức đổi tên.
  terminology: “Đức Chúa Trời,” “Áp-ra-ham,” “Sa-rai,” và “Sa-ra” nhất quán, trang trọng, và bảo toàn sự đối lập giữa hai tên. Không có vấn đề thần học hay tên riêng cần thay đổi.
  issues:
  - severity: low
    issue: Cú pháp “ông không được gọi tên bà là Sa-rai” gượng trong tiếng Việt hiện đại.
    rationale: Tiếng Việt tự nhiên thường nói “gọi bà bằng tên Sa-rai” hoặc “gọi bà là Sa-rai.” Cách sửa thứ nhất vẫn biểu đạt tường minh danh từ “tên” có trong nguyên ngữ.
  - severity: low
    issue: Ký hiệu chú thích đang đặt ở cuối cả câu thay vì sát với công thức gọi tên mà chú thích giải thích.
    rationale: Đặt [a] sau “Sa-rai” làm neo chú thích chính xác hơn, không thay đổi nghĩa.
