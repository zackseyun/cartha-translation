  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּ/ךָ֔ לֹא תִקְרָ֥א אֶת שְׁמָ֖/הּ שָׂרָ֑י כִּ֥י שָׂרָ֖ה שְׁמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: vi
  text: 'Rồi Đức Chúa Trời phán với Áp-ra-ham: “Về Sa-rai, vợ ông, ông không được gọi bà bằng tên Sa-rai[a], vì tên bà là Sa-ra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, diễn đạt tự nhiên hơn: “Ông không được gọi bà là Sa-rai nữa; tên bà sẽ là Sa-ra.”'
    reason: Nêu cách diễn đạt Việt ngữ tự nhiên hơn, nhưng có thêm sắc thái “nữa” và tương lai (“sẽ”) chỉ được hàm ý trong ngữ cảnh.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện. “Rồi” thể hiện trình tự tự nhiên trong tiếng Việt; “phán” phù hợp với lời Đức Chúa Trời mà vẫn trang trọng, dễ hiểu.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi thông dụng, trang trọng trong tiếng Việt đối với אֱלֹהִים khi từ này chỉ Đức Chúa Trời duy nhất trong ngữ cảnh.
- source_word: אֶל אַבְרָהָם
  choice: với Áp-ra-ham
  rationale: Giới từ אֶל xác định người tiếp nhận lời nói; “phán với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: שָׂרַי
  choice: Sa-rai
  rationale: Phiên âm tên riêng và giữ rõ sự tương phản giữa tên cũ Sa-rai với tên mới Sa-ra.
- source_word: אִשְׁתְּךָ
  choice: vợ ông
  rationale: Chuyển đúng cấu trúc sở hữu ngôi thứ hai số ít. “Ông” là đại từ trung tính, tôn trọng, phù hợp khi nói trực tiếp với Áp-ra-ham và tránh thêm sắc thái thần học không được biểu thị riêng trong đại từ Hê-bơ-rơ.
- source_word: לֹא תִקְרָא
  choice: ông không được gọi
  rationale: Thể chưa hoàn thành trong lời phán trực tiếp mang lực cấm truyền. “Không được” truyền đạt mệnh lệnh rõ ràng mà không quá cổ kính.
- source_word: אֶת שְׁמָהּ שָׂרָי
  choice: gọi tên bà là Sa-rai
  rationale: Giữ lại công thức đặt tên và từ “tên”, đồng thời diễn đạt bằng cú pháp tiếng Việt tự nhiên.
- source_word: כִּי
  choice: vì
  rationale: Biểu thị lý do hoặc lời giải thích cho lệnh đổi cách gọi tên.
- source_word: שָׂרָה שְׁמָהּ
  choice: Sa-ra là tên bà
  rationale: Giữ trật tự nhấn mạnh của mệnh đề danh từ Hê-bơ-rơ, trong đó tên mới đứng đầu; không tự ý thêm dấu hiệu tương lai như “sẽ là”.
theological_decisions:
- issue: Cách chuyển công thức đổi tên
  choice: “ông không được gọi tên bà là Sa-rai, vì Sa-ra là tên bà”
  alternative: “ông sẽ không còn gọi bà là Sa-rai; tên bà sẽ là Sa-ra”
  rationale: Bản chính giữ cả lệnh cấm và lời tuyên bố đặt tên theo cấu trúc Hê-bơ-rơ. Cách dịch này không thêm “không còn” hay trợ từ tương lai “sẽ”, vốn không được nêu tường minh, đồng thời giữ tính trang trọng của hành động đổi tên.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời; dùng “ông/bà” để chỉ Áp-ra-ham và Sa-ra, tránh đại từ cổ “ngươi” cũng như tránh đưa thêm sắc thái quan hệ qua đại từ “con”. Tên riêng được phiên âm theo lối quen thuộc: Áp-ra-ham, Sa-rai, Sa-ra.'
