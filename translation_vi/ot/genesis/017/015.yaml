  to: 'Rồi Đức Chúa Trời phán với Áp-ra-ham: “Về Sa-rai, vợ ông, ông không được gọi bà bằng tên Sa-rai[a], vì tên bà là Sa-ra.”'
  rationale: Sửa duy nhất cách diễn đạt “gọi tên bà là” thành “gọi bà bằng tên” để tiếng Việt tự nhiên hơn mà vẫn giữ công thức đổi tên và từ vựng cốt yếu của tiếng Hê-bơ-rơ. Neo chú thích được chuyển đến đúng cụm từ mà chú thích diễn giải. Bản dịch chính không thêm “nữa” hoặc “sẽ,” nhờ đó bảo toàn hình thức mệnh lệnh và mệnh đề danh từ của nguồn.
