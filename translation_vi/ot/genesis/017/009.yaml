  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: Đức Chúa Trời phán với Áp-ra-ham, sự chuyển trọng tâm nhấn mạnh ở “còn ngươi,” mệnh lệnh giữ giao ước, và nghĩa tập hợp của זַרְעֲךָ. Tuy nhiên, “con” đặt Áp-ra-ham vào quan hệ xưng hô cha-con với Đức Chúa Trời; đây không phải là sắc thái được biểu thị bởi đại từ אַתָּה trong câu. “Ngươi” giữ được ngôi thứ hai trực tiếp, tính nhấn mạnh lặp lại, và văn phong trang trọng của lời phán.'
