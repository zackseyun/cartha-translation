base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán với Áp-ra-ham: “Còn ngươi, ngươi phải giữ giao ước của Ta, ngươi và dòng dõi[a] ngươi sau ngươi, qua các thế hệ của họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “hạt giống,” một danh từ số ít mang nghĩa tập hợp, chỉ dòng dõi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ mở đầu tiếp nối mạch kể chuyện. “Phán” là cách diễn đạt trang trọng, tự nhiên khi Đức Chúa Trời trực tiếp truyền lời, mà không thêm sắc thái ngoài văn bản.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Đây là cách gọi tiêu chuẩn, trang trọng và dễ hiểu trong tiếng Việt dành cho אֱלֹהִים khi chỉ Đức Chúa Trời của giao ước.
- source_word: אֶל־אַבְרָהָם
  choice: với Áp-ra-ham
  rationale: Tên trong bản Hê-bơ-rơ ở đây là Áp-ra-ham, sau khi ông được đổi tên; “phán với” chuyển tải tự nhiên giới từ אֶל.
- source_word: וְאַתָּה
  choice: Còn con
  rationale: Đại từ được đặt lên trước để nhấn mạnh và chuyển từ lời hứa của Đức Chúa Trời sang bổn phận của Áp-ra-ham. “Còn con” thể hiện rõ chức năng diễn ngôn ấy.
- source_word: אֶת־בְּרִיתִי
  choice: giao ước của Ta
  rationale: Giữ nguyên thuật ngữ giao ước và ngôi thứ nhất của Đấng đang phán. Cách viết hoa “Ta” phù hợp văn phong Kinh Thánh tiếng Việt mà không thay đổi ý nghĩa.
- source_word: תִשְׁמֹר
  choice: con phải giữ
  rationale: שׁמר trong ngữ cảnh giao ước có nghĩa là giữ, tuân giữ. “Phải giữ” diễn đạt rõ hiệu lực mệnh lệnh của thể vị hoàn, đồng thời không diễn giải thêm nội dung của việc giữ giao ước.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: con và dòng dõi con
  rationale: זֶרַע là danh từ số ít mang nghĩa tập hợp. “Dòng dõi” là cách diễn đạt tự nhiên trong tiếng Việt, vừa chỉ hậu duệ nói chung vừa duy trì tính tập hợp tốt hơn “các hậu duệ”.
- source_word: אַחֲרֶיךָ
  choice: sau con
  rationale: Diễn đạt trực tiếp sự kế tiếp theo dòng dõi, không thêm ý giải thích.
- source_word: לְדֹרֹתָם
  choice: trải qua các thế hệ của họ
  rationale: Cụm từ chỉ sự tiếp nối lâu dài qua những thế hệ thuộc về dòng dõi Áp-ra-ham; bản dịch giữ cả ý kéo dài lẫn hậu tố ngôi thứ ba số nhiều.
theological_decisions:
- issue: Diễn đạt nghĩa vụ đối với giao ước mà không thêm sắc thái luật pháp hay nghi lễ
  choice: con phải giữ giao ước của Ta
  alternative: con sẽ giữ giao ước của Ta; con phải tuân giữ giao ước của Ta
  rationale: “Phải giữ” truyền đạt tính bắt buộc của lời truyền trong ngữ cảnh, còn “giữ giao ước” bảo toàn thuật ngữ trung tâm mà không xác định thêm cách thức hay phạm vi thực hiện.
- issue: Phạm vi của danh từ tập hợp זֶרַע
  choice: dòng dõi
  alternative: hạt giống; hậu duệ
  rationale: “Dòng dõi” giữ được nghĩa tập hợp và không buộc văn bản phải nói về từng hậu duệ riêng lẻ hay chỉ một cá nhân. Chú thích ghi nhận hình ảnh nguyên thủy “hạt giống” mà không áp đặt một kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cặp xưng hô “Ta—con” thể hiện quan hệ giữa Đức Chúa Trời và Áp-ra-ham trong lời phán trực tiếp. Dấu gạch ngang làm rõ rằng “con và dòng dõi con” nhắc lại và mở rộng chủ thể phải giữ giao ước.
