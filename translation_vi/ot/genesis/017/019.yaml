source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּ/ךָ֗ יֹלֶ֤דֶת לְ/ךָ֙ בֵּ֔ן וְ/קָרָ֥אתָ אֶת שְׁמ֖/וֹ יִצְחָ֑ק וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֥/י אִתּ֛/וֹ לִ/בְרִ֥ית עוֹלָ֖ם לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán: “Không, nhưng Sa-ra, vợ con, sẽ sinh cho con một con trai, và con sẽ đặt tên nó là Y-sác.[a] Ta sẽ lập giao ước của Ta với người ấy—một giao ước đời đời cho dòng dõi người ấy về sau.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Y-sác nghe giống một động từ Hê-bơ-rơ có nghĩa là “người ấy cười” hoặc “người ấy sẽ cười.”
    reason: Giải thích lối chơi chữ gắn tên יִצְחָק với động từ צחק.
lexical_decisions:
- source_word: אֲבָל
  choice: Không, nhưng
  rationale: Trong ngữ cảnh, lời này trực tiếp điều chỉnh lời cầu xin trước đó của Áp-ra-ham về Ích-ma-ên. Cách dịch này giữ cả sắc thái phủ định lẫn đối lập của câu Hê-bơ-rơ.
- source_word: יֹלֶדֶת
  choice: sẽ sinh
  rationale: Dù có hình thái phân từ, từ này mang ý nghĩa tương lai trong lời hứa tiên báo ở đây.
- source_word: וְקָרָאתָ אֶת שְׁמוֹ
  choice: con phải đặt tên nó là
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái mệnh lệnh của công thức đặt tên.
- source_word: יִצְחָק
  choice: Y-sác
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt; chú thích giữ lối chơi chữ trong tiếng Hê-bơ-rơ.
- source_word: וַהֲקִמֹתִי
  choice: Ta sẽ lập
  rationale: Trong ngôn ngữ giao ước, cách dịch này diễn đạt việc Đức Chúa Trời khiến giao ước được thiết lập và có hiệu lực.
- source_word: בְּרִיתִי
  choice: giao ước của Ta
  rationale: “Giao ước” là thuật ngữ tiếng Việt rõ ràng và thích hợp cho בְּרִית trong ngữ cảnh thần học này.
- source_word: אִתּוֹ
  choice: với con ấy
  rationale: Giữ quan hệ giao ước trực tiếp với Y-sác, thay vì chỉ diễn tả lợi ích dành cho người ấy.
- source_word: לִבְרִית עוֹלָם
  choice: làm một giao ước đời đời
  rationale: “Làm” thể hiện vai trò hoặc kết quả của việc thiết lập, còn “đời đời” giữ đặc tính bền lâu của giao ước mà không thêm hàm ý triết học.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: cho dòng dõi của con ấy về sau
  rationale: “Dòng dõi” giữ được ý nghĩa tập thể của danh từ số ít זֶרַע và tự nhiên hơn cách dịch sát chữ “hạt giống”.
theological_decisions:
- issue: Phạm vi và tính liên tục của lời hứa giao ước
  choice: Dịch trực tiếp rằng Đức Chúa Trời lập giao ước với Y-sác và giao ước ấy dành cho dòng dõi của ông về sau.
  alternative: Giải thích câu này như chỉ nói về một lời hứa sắc tộc-quốc gia, hoặc như trực tiếp xác định toàn bộ thần học giao ước về sau.
  rationale: Bản văn khẳng định giao ước với Y-sác và dòng dõi ông nhưng không tự giới hạn hay mở rộng phạm vi ấy theo một hệ thống thần học về sau; bản dịch vì thế giữ nguyên sức căng của lời tuyên bố.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta–con” thể hiện lời Đức Chúa Trời phán với Áp-ra-ham; “con ấy” tránh sắc thái thiếu trang trọng của việc lặp lại “nó” trong lời tuyên bố về giao ước.
