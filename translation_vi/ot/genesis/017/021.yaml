  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: vi
  text: Nhưng Ta sẽ lập giao ước của Ta với Y-sác[a], người con mà Sa-ra sẽ sinh cho con vào thời điểm này năm sau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và Ta sẽ lập giao ước của Ta với Y-sác.” Liên từ Hê-bơ-rơ có thể dịch đơn giản là “và”, nhưng ngữ cảnh nghiêng về ý tương phản với lời hứa dành cho Ích-ma-ên trong câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Nhưng
  rationale: Liên từ וְ về mặt hình thức có thể dịch là “và”, nhưng trong mạch văn nó tạo thế tương phản giữa phước lành dành cho Ích-ma-ên ở câu trước và việc giao ước được lập với Y-sác.
- source_word: בְּרִיתִי
  choice: giao ước của Ta
  rationale: בְּרִית là “giao ước”; hậu tố ngôi thứ nhất số ít được diễn đạt là “của Ta”, phù hợp với lời Đức Chúa Trời đang phán.
- source_word: אָקִים
  choice: sẽ lập
  rationale: Dạng Hiphil của קום trong ngữ cảnh giao ước mang nghĩa thiết lập, làm cho có hiệu lực vững chắc; “lập” tự nhiên và trang trọng trong tiếng Việt.
- source_word: אֶת יִצְחָק
  choice: với Y-sác
  rationale: Dù אֶת là dấu hiệu tân ngữ trực tiếp, tiếng Việt tự nhiên nói “lập giao ước với” một bên tham dự giao ước.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: người con mà Sa-ra sẽ sinh cho con
  rationale: Bổ sung “người con” làm rõ tiền ngữ chỉ người của mệnh đề quan hệ trong tiếng Việt, đồng thời giữ ý לְךָ là Sa-ra sinh con cho Áp-ra-ham.
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: vào thời điểm này năm sau
  rationale: מוֹעֵד chỉ thời điểm đã định; trong toàn cụm, “vào thời điểm này năm sau” truyền đạt tự nhiên ý một thời điểm tương ứng trong năm kế tiếp mà không thêm diễn giải.
theological_decisions:
- issue: Dòng giao ước qua Y-sác thay vì Ích-ma-ên
  choice: Câu này khẳng định Đức Chúa Trời sẽ lập giao ước của Ngài với Y-sác.
  alternative: Diễn đạt theo cách khiến Ích-ma-ên cũng được xem là người nhận chính giao ước này.
  rationale: Bản dịch giữ nguyên sự phân biệt của bản văn giữa phước lành đã hứa cho Ích-ma-ên và giao ước được lập với Y-sác, nhưng không suy diễn thêm các kết luận thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” theo ngữ cảnh Đức Chúa Trời phán với Áp-ra-ham; giữ cách phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
