base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: vi
  text: 'Ông nói: “Hãy thề với cha.” Giô-sép liền thề với cha. Rồi Y-sơ-ra-ên cúi mình trên đầu giường[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên đầu gậy.” Các phụ âm Hê-bơ-rơ có thể được đọc theo cách này; đây cũng là cách hiểu được phản ánh trong Bản Bảy Mươi và Hê-bơ-rơ 11:21.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: Hãy thề với cha
  rationale: Mệnh lệnh trực tiếp trong công thức thề; đại từ thân tộc “cha” làm rõ quan hệ Gia-cốp–Giô-sép một cách tự nhiên trong tiếng Việt, không thay đổi nội dung.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: Giô-sép liền thề với cha
  rationale: Nêu lại chủ thể để tránh sự mơ hồ do chuỗi đại từ trong tiếng Việt, đồng thời giữ cùng động từ “thề” với mệnh lệnh trước đó.
- source_word: וַיִּשְׁתַּחוּ
  choice: cúi mình
  rationale: Diễn tả cử chỉ hạ mình/cúi xuống mà không quyết định rằng hành động này nhất thiết là thờ phượng, vì câu không nêu rõ đối tượng.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Giữ đúng tên được văn bản Hê-bơ-rơ sử dụng thay vì đổi thành Gia-cốp.
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: nơi đầu giường
  rationale: Phản ánh cách đọc theo nguyên âm Masoret là “giường” và diễn đạt vị trí bằng tiếng Việt tự nhiên; tránh hình ảnh dễ gây hiểu lầm rằng ông ở ngay trên bề mặt đầu giường.
theological_decisions:
- issue: Các phụ âm הַמטה có thể được đọc là “giường” theo văn bản Masoret hoặc “gậy” theo truyền thống Bản Bảy Mươi và Hê-bơ-rơ 11:21.
  choice: giường
  alternative: gậy
  rationale: Bản chính theo cách ghi nguyên âm của WLC, nhưng chú thích bảo tồn cách đọc cổ khác có ý nghĩa đối với mối liên hệ với Hê-bơ-rơ 11:21.
- issue: וַיִּשְׁתַּחוּ có thể chỉ sự cúi mình hoặc hành vi thờ phượng.
  choice: cúi mình
  alternative: thờ lạy
  rationale: Trong câu này không có bổ ngữ nêu đối tượng được thờ phượng; vì vậy bản chính giữ cử chỉ thân thể và không áp đặt một kết luận thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cách xưng hô cha–con phù hợp với ngữ cảnh gia đình; giữ tên Y-sơ-ra-ên theo văn bản nguồn. Dấu chú thích được đặt ngay sau cụm từ có cách đọc khác.
