  to: 'Ông nói: “Hãy thề với cha.” Giô-sép liền thề với cha. Rồi Y-sơ-ra-ên cúi mình trên đầu giường[a].'
  rationale: Sửa duy nhất cụm không gian để phản ánh sát hơn עַל רֹאשׁ הַמִּטָּה, đồng thời chuyển ký hiệu chú thích sát cụm từ được chú giải. Các lựa chọn về quan hệ cha–con, tên Y-sơ-ra-ên, động từ “cúi mình,” và chú thích về cách đọc “gậy” được giữ nguyên.
