  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” để biểu thị lời thưa kính trọng với Giô-sép; giữ “nô lệ” nhằm phản ánh địa vị lệ thuộc kinh tế-pháp lý trong ngữ cảnh.
