  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: vi
  text: 'Họ nói: “Ngài đã giữ cho chúng tôi được sống. Xin cho chúng tôi được đẹp lòng ngài, và chúng tôi sẽ làm nô lệ cho Pha-ra-ôn.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Dạng tự sự waw-consecutive tiếp nối mạch kể và dẫn vào lời nói trực tiếp; tiếng Việt không cần thêm “và” một cách máy móc.
- source_word: הֶחֱיִתָנוּ
  choice: Ngài đã giữ cho chúng tôi được sống
  rationale: Thể Hiphil của חיה mang nghĩa khiến cho sống hoặc bảo toàn sự sống; cách dịch này giữ rõ sắc thái nguyên nhân mà không gợi nghĩa cứu rỗi thuộc linh.
- source_word: נִמְצָא חֵן
  choice: Xin chúng tôi được ơn
  rationale: Yiqtol ngôi thứ nhất số nhiều được hiểu là lời thỉnh cầu mang sắc thái ý nguyện trong ngữ cảnh này. “Được ơn” diễn đạt tự nhiên ý được tiếp nhận thuận lợi.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: trước mắt ngài
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ “trong mắt chúa tôi” nhưng dùng lối nói tiếng Việt trang trọng, dễ hiểu. “Ngài” truyền đạt cách xưng hô kính trọng với Giô-sép mà tránh khiến độc giả hiện đại hiểu “chúa” ở đây là tước hiệu thần linh.
- source_word: וְהָיִינוּ
  choice: và chúng tôi sẽ làm
  rationale: Dạng hoàn thành có liên từ ở đây diễn đạt hệ quả hoặc lời cam kết; thì tương lai trong tiếng Việt phù hợp với lời họ tự nguyện ràng buộc mình.
- source_word: עֲבָדִים
  choice: nô lệ
  rationale: Trong bối cảnh người Ai Cập trao thân vào tình trạng lệ thuộc Pha-ra-ôn để được sống, từ này chỉ địa vị bị ràng buộc chứ không chỉ việc phục vụ thông thường.
- source_word: לְפַרְעֹה
  choice: cho Pha-ra-ôn
  rationale: Giới từ לְ đánh dấu người mà họ sẽ thuộc quyền và phục dịch; “làm nô lệ cho” là kết cấu tự nhiên trong tiếng Việt.
