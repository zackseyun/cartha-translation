base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: vi
  text: Giô-sép đưa cha mình là Gia-cốp vào, cho ông đứng trước Pha-ra-ôn[a]. Gia-cốp chúc phước cho Pha-ra-ôn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “khiến ông đứng trước Pha-ra-ôn.”'
    reason: lexical_alternative
  - marker: b
    text: “Chúc phước” có thể chỉ một lời chúc phước được nói ra theo nghi thức, chứ không chỉ là lời chào lịch sự.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: đưa ... vào
  rationale: Dạng Hifil của בוא mang ý khiến một người đi vào; trong bối cảnh yết kiến, “đưa ... vào” vừa tự nhiên vừa giữ được sắc thái nguyên nhân.
- source_word: אָבִיו
  choice: cha mình
  rationale: Hậu tố ngôi ba số ít giống đực quy về Giô-sép; “cha mình” diễn đạt tự nhiên và tránh nhầm quan hệ sở hữu.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: cho ông đứng trước
  rationale: Giữ khá sát dạng Hifil “khiến/cho đứng” và nghi thức yết kiến, thay vì diễn giải mạnh hơn thành một hành vi giới thiệu.
- source_word: לִפְנֵי פַרְעֹה
  choice: trước Pha-ra-ôn
  rationale: Diễn đạt ngắn gọn nghĩa “trước mặt, trong sự hiện diện của” trong bối cảnh triều kiến.
- source_word: וַיְבָרֶךְ
  choice: chúc phước
  rationale: ברך có nghĩa thông thường là ban hoặc nói lời chúc phước; lựa chọn này không làm yếu hành động thành một lời chào xã giao.
- source_word: פַרְעֹה
  choice: Pha-ra-ôn
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tước hiệu vua Ai Cập.
- source_word: וַ
  choice: (liên kết bằng trình tự câu kể)
  rationale: Các waw liên tiếp thúc đẩy mạch kể; tiếng Việt tự nhiên không cần lặp “rồi/và” ở mọi động từ.
theological_decisions:
- issue: Ý nghĩa hành động của Gia-cốp đối với Pha-ra-ôn
  choice: Gia-cốp thực sự chúc phước cho Pha-ra-ôn
  alternative: Gia-cốp chỉ chào Pha-ra-ôn theo phép lịch sự
  rationale: Nghĩa thông thường của ברך là “chúc phước”. Giữ nghĩa này bảo toàn sự căng thẳng đáng chú ý khi vị tổ phụ chúc phước cho một quân vương quyền thế, thay vì thu hẹp thành lời chào.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. “Cho ông đứng trước” giữ nét cụ thể của nguyên văn Hê-bơ-rơ; tên riêng theo lối phiên âm Kinh Thánh tiếng Việt thông dụng.
