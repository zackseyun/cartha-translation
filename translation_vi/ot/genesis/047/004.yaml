source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֶל פַּרְעֹ֗ה לָ/ג֣וּר בָּ/אָרֶץ֮ בָּאנוּ֒ כִּי אֵ֣ין מִרְעֶ֗ה לַ/צֹּאן֙ אֲשֶׁ֣ר לַ/עֲבָדֶ֔י/ךָ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/עַתָּ֛ה יֵֽשְׁבוּ נָ֥א עֲבָדֶ֖י/ךָ בְּ/אֶ֥רֶץ גֹּֽשֶׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: vi
  text: 'Họ thưa với Pha-ra-ôn: “Chúng tôi đến tạm trú trong xứ này[a], vì không có đồng cỏ cho đàn chiên của các tôi tớ ngài, bởi nạn đói rất trầm trọng tại xứ Ca-na-an. Vậy bây giờ, xin cho các tôi tớ ngài được cư ngụ tại xứ Gô-sen.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đến sống như những ngoại kiều trong xứ này.”'
    reason: Giữ nghĩa khả dĩ của גור là cư trú với tư cách người ngoài, trong khi bản văn chính nhấn mạnh tính tạm thời bằng “tạm trú”.
lexical_decisions:
- source_word: לָגוּר
  choice: đến tạm trú
  rationale: Động từ גור chỉ việc cư trú với tư cách người ngoài hoặc cư trú không thường xuyên; “tạm trú” tự nhiên trong tiếng Việt hiện đại và không hàm ý định cư vĩnh viễn.
- source_word: בָּאָרֶץ
  choice: trong xứ này
  rationale: אֶרֶץ ở đây chỉ lãnh thổ Ai Cập. Thêm “này” theo ngữ cảnh lời nói trực tiếp giúp câu tiếng Việt tự nhiên mà không thay đổi sở chỉ.
- source_word: מִרְעֶה
  choice: đồng cỏ
  rationale: Danh từ này chỉ nơi chăn thả hoặc bãi cỏ dành cho súc vật; “đồng cỏ” rõ nghĩa và phù hợp văn cảnh nông mục.
- source_word: לַצֹּאן
  choice: cho đàn gia súc
  rationale: צֹאן là danh từ tập hợp, thường chỉ gia súc nhỏ như chiên và dê. “Đàn gia súc” giữ sắc thái tập hợp mà không giới hạn vào một loài.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: của các tôi tớ ngài
  rationale: Cụm từ biểu thị quyền sở hữu; cách diễn đạt này gọn, tự nhiên và giữ lời tự xưng khiêm nhường trước Pha-ra-ôn.
- source_word: כָבֵד הָרָעָב
  choice: nạn đói rất trầm trọng
  rationale: כָבֵד có nghĩa đen là “nặng” nhưng khi nói về nạn đói thì diễn tả mức độ nghiêm trọng. “Rất trầm trọng” truyền đạt cường độ của cấu trúc Hê-bơ-rơ.
- source_word: יֵשְׁבוּ נָא
  choice: xin cho ... được cư ngụ
  rationale: Thể thỉnh cầu cùng נָא diễn tả lời khẩn khoản lịch sự. “Xin cho ... được” thể hiện đúng sắc thái ấy; “cư ngụ” không khẳng định việc định cư vĩnh viễn.
- source_word: עֲבָדֶיךָ
  choice: các tôi tớ ngài
  rationale: Trong lời tâu với Pha-ra-ôn, עבד là cách tự xưng khiêm nhường theo nghi thức triều đình, nên “tôi tớ” phù hợp hơn “nô lệ”.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: xứ Gô-sen
  rationale: Cách dịch này giữ rõ địa danh và ý nghĩa lãnh thổ của cấu trúc Hê-bơ-rơ, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa với” cùng cách tự xưng “các tôi tớ ngài” giữ phép tôn kính trong bối cảnh triều đình; “tạm trú” và “cư ngụ” tránh hàm ý định cư vĩnh viễn.
