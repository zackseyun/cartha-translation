base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: vi
  text: Vậy, Giô-sép sắp xếp cho cha và các anh em mình định cư, rồi cấp cho họ một phần đất làm sở hữu trong xứ Ai Cập, ở phần tốt nhất của xứ[a], trong miền Ra-mê-se, đúng như Pha-ra-ôn đã truyền.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ở phần tuyển chọn nhất của xứ.”'
    reason: Giữ khả năng diễn đạt khác của מֵיטַב, chỉ phần tốt nhất hoặc đáng chọn nhất.
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: cho ... định cư
  rationale: Dạng Hiphil của יָשַׁב mang nghĩa khiến ai cư ngụ; cách dịch này tự nhiên trong tiếng Việt và giữ rõ vai trò của Giô-sép trong việc sắp xếp nơi ở cho gia đình.
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: cha và các anh em mình
  rationale: Giữ nguyên hai quan hệ thân tộc được nêu cụ thể trong tiếng Hê-bơ-rơ, không mở rộng thành toàn thể gia đình.
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: cấp cho họ một phần đất thuộc quyền sở hữu
  rationale: אֲחֻזָּה chỉ một phần đất nắm giữ hoặc sở hữu. Cách diễn đạt này làm rõ ý nghĩa đất đai và tránh hàm ý thừa kế giao ước mà từ “cơ nghiệp” có thể gợi ra.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trong xứ Ai Cập
  rationale: Giữ danh từ אֶרֶץ là “xứ”, phù hợp văn phong tường thuật và sự lặp lại có chủ ý trong câu.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: tại vùng tốt nhất của xứ
  rationale: מֵיטַב chỉ phần tốt nhất hoặc đáng chọn nhất; “vùng tốt nhất của xứ” vừa rõ nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: trong miền Ra-mê-se
  rationale: Ở đây אֶרֶץ có thể chỉ một địa hạt hoặc miền mang tên Ra-mê-se; “miền” tránh cách lặp cứng nhắc nhưng vẫn giữ ý nghĩa địa lý.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: đúng như Pha-ra-ôn đã truyền
  rationale: Diễn tả sự thi hành phù hợp với mệnh lệnh Pha-ra-ôn đã ban trước đó trong mạch truyện.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong tiếng Việt: Giô-sép, Ra-mê-se và Pha-ra-ôn. Cấu trúc câu giữ tiến trình hành động của nguyên văn nhưng tránh lối diễn đạt quá sát chữ.'
