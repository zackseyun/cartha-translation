base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: vi
  text: 'Bấy giờ, Giô-sép vào trình lên Pha-ra-ôn: “Cha tôi và các anh em tôi, cùng với đàn chiên dê, đàn gia súc và mọi thứ họ có, đã đến từ xứ Ca-na-an; kìa[a], họ đang ở trong xứ Gô-sen.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hiện giờ, họ đang ở trong xứ Gô-sen” hoặc “và họ đang ở ngay trong xứ Gô-sen.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vào
  rationale: בוא có thể là đến, đi vào hoặc vào; trong bối cảnh triều kiến, “vào” tự nhiên và hàm ý Giô-sép vào gặp Pha-ra-ôn.
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: trình với Pha-ra-ôn
  rationale: Hai động từ nối tiếp dùng để dẫn lời. “Trình với” diễn đạt sắc thái báo cáo lên vua và tránh lối lặp gượng “báo... rồi nói” trong tiếng Việt.
- source_word: אָבִי וְאַחַי
  choice: Cha tôi, các anh em tôi
  rationale: Giữ nguyên quan hệ gia đình và ngôi sở hữu; “các anh em” không xác định tuổi tương đối, phù hợp nghĩa rộng của אַחַי.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: cùng với đàn chiên dê, đàn gia súc
  rationale: צאן chỉ gia súc nhỏ, thường gồm chiên và dê; בקר chỉ gia súc lớn, nhất là bò. Cách dịch này giữ sự phân biệt mà không thu hẹp quá mức.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: và mọi tài sản của họ
  rationale: Diễn đạt tự nhiên toàn bộ những gì thuộc về họ trong ngữ cảnh di chuyển cả gia sản.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: đã từ xứ Ca-na-an đến đây
  rationale: Thể hoàn thành chỉ việc đến đã hoàn tất và có kết quả hiện tại; “đến đây” tự nhiên trong lời báo cáo tại Ai Cập, còn nguồn xuất phát được giữ rõ.
- source_word: וְהִנָּם
  choice: hiện giờ họ đang
  rationale: הנה kèm đại từ thu hút sự chú ý đến tình trạng hiện diện trước mắt. “Hiện giờ... đang” truyền đạt lực chỉ xuất hiện/trạng thái hiện tại tự nhiên hơn “này, họ” trong tiếng Việt.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ở trong xứ Gô-sen
  rationale: Giữ danh từ אֶרֶץ và tên địa danh theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Trình với” phù hợp bối cảnh cung đình; “hiện giờ” chuyển tải chức năng chỉ xuất của וְהִנָּם mà không dùng từ cổ. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
