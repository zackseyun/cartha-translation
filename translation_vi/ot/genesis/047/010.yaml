  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: vi
  text: Rồi Gia-cốp chúc phước cho Pha-ra-ôn và lui ra khỏi sự hiện diện của Pha-ra-ôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “chào Pha-ra-ôn” hoặc “cáo biệt Pha-ra-ôn”; động từ Hê-bơ-rơ thường có nghĩa là “chúc phước”, nhưng trong bối cảnh yết kiến vua, nó có thể bao hàm lời chào kính hoặc cáo biệt theo nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: chúc phước
  rationale: Động từ ברך thông thường có nghĩa là “chúc phước”. Trong bối cảnh yết kiến vua, hành động này cũng có thể mang sắc thái chào kính hoặc cáo biệt; tuy nhiên, nghĩa từ vựng trực tiếp phù hợp với cả câu 7 lẫn câu 10.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dạng tên riêng theo cách phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: אֶת
  choice: '[không dịch: dấu chỉ định túc từ trực tiếp]'
  rationale: Tiếng Việt không có từ tương đương cần biểu đạt trong câu.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm quen thuộc của tước hiệu hoàng gia Ai Cập trong tiếng Việt.
- source_word: וַיֵּצֵא
  choice: lui ra
  rationale: יצא có nghĩa cơ bản là “đi ra”. Trong khung cảnh triều kiến, “lui ra” diễn đạt tự nhiên và trang trọng việc Gia-cốp rời khỏi nơi vua hiện diện.
- source_word: מִלִּפְנֵי
  choice: khỏi hiện diện của Pha-ra-ôn
  rationale: Thành ngữ này theo nghĩa đen là “khỏi trước mặt”; cách dịch đã chọn giữ ý rời khỏi buổi yết kiến mà không quá cứng.
