  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lui ra” phù hợp với bối cảnh triều kiến; “chúc phước” giữ nghĩa chính của nguyên ngữ và để chú thích bảo tồn các sắc thái khả dĩ.
