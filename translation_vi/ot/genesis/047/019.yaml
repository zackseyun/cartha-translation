  to: Tại sao cả chúng tôi lẫn đất đai của chúng tôi phải chết trước mắt ông? Xin hãy mua chúng tôi cùng đất đai của chúng tôi để đổi lấy lương thực[a]; chúng tôi và đất đai của chúng tôi sẽ là nô lệ của Pha-ra-ôn[b]. Xin cho chúng tôi hạt giống để chúng tôi được sống, không phải chết, và đất đai không trở nên hoang vu[c].
