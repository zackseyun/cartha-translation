source:
  edition: WLC
  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: vi
  text: Tại sao cả chúng tôi lẫn đất đai của chúng tôi phải chết trước mắt ông? Xin hãy mua chúng tôi cùng đất đai của chúng tôi để đổi lấy lương thực[a]; chúng tôi và đất đai của chúng tôi sẽ là nô lệ của Pha-ra-ôn[b]. Xin cho chúng tôi hạt giống để chúng tôi được sống, không phải chết, và đất đai không trở nên hoang vu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để đổi lấy thức ăn”; theo nghĩa đen là “để đổi lấy bánh”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đầy tớ”; từ Hê-bơ-rơ có thể chỉ nhiều hình thức phục dịch hoặc lệ thuộc, nhưng trong bối cảnh này sắc thái lệ thuộc kinh tế-pháp lý là nổi bật.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “không bị bỏ hoang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: Tại sao ... phải chết
  rationale: Diễn đạt tự nhiên sức nặng của câu hỏi tu từ và lời khẩn cầu trong tiếng Hê-bơ-rơ.
- source_word: לְעֵינֶיךָ
  choice: ngay trước mắt ông
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ, nghĩa là chết trong sự hiện diện và tầm nhìn của Giô-sép.
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: chúng tôi và đất đai của chúng tôi
  rationale: Cặp גַּם ... גַּם liên kết cả dân chúng lẫn đất canh tác như hai đối tượng cùng đứng trước nguy cơ.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: Xin hãy mua chúng tôi cùng đất đai của chúng tôi
  rationale: קנה chỉ việc mua hoặc thủ đắc theo giao dịch; cách dịch thẳng giữ được tính khắc nghiệt của hoàn cảnh đói kém.
- source_word: בַּלָּחֶם
  choice: để đổi lấy lương thực
  rationale: Giới từ בְּ đánh dấu giá hoặc phương tiện trao đổi; לֶחֶם theo nghĩa đen là bánh nhưng trong ngữ cảnh này cũng chỉ lương thực nói chung.
- source_word: וְנִהְיֶה
  choice: sẽ làm
  rationale: Diễn tả kết quả của việc được mua; kết hợp tự nhiên trong tiếng Việt với cụm 'làm nô lệ'.
- source_word: עֲבָדִים
  choice: nô lệ
  rationale: Trong bối cảnh kinh tế-pháp lý này, từ chỉ tình trạng lệ thuộc và mất tự do, mạnh hơn nghĩa thông thường của 'đầy tớ'.
- source_word: וְתֶן זֶרַע
  choice: Xin cấp hạt giống
  rationale: זֶרַע ở đây là giống để gieo trồng; 'cấp' phù hợp với lời thỉnh cầu xin nguồn giống từ nhà chức trách.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: đất đai không trở nên hoang vu
  rationale: תֵשָׁם diễn tả đất bị bỏ hoang hoặc trở nên tiêu điều vì không còn người canh tác.
theological_decisions:
- issue: Tình trạng עֲבָדִים của người Ai Cập đối với Pha-ra-ôn
  choice: nô lệ
  alternative: đầy tớ
  rationale: Bản dịch giữ rõ sự lệ thuộc kinh tế-pháp lý mà người dân tự đề nghị trong cơn đói, nhưng không bổ sung đánh giá đạo đức hay hệ thống hóa chế độ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì dân chúng đang trực tiếp thưa với Giô-sép; dùng “Pha-ra-ôn” theo lối phiên âm quen thuộc. Bản dịch giữ lời khẩn cầu dồn dập và sự song hành giữa dân chúng với đất đai.
