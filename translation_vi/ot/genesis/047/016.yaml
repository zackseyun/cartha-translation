  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: vi
  text: 'Giô-sép nói: “Hãy đem gia súc của các ông đến đây, tôi sẽ cấp lương thực[a] cho các ông để đổi lấy gia súc ấy, nếu tiền đã hết.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ không nêu tân ngữ sau câu “tôi sẽ cấp cho các ông”; “lương thực” được bổ sung theo ngữ cảnh trực tiếp.
    reason: lexical_alternative
  - marker: b
    text: Từ được dịch là “nếu” trong ngữ cảnh cũng có thể hiểu là “vì” hoặc “bởi vì”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Hãy giao ... đây
  rationale: Mệnh lệnh số nhiều yêu cầu người dân đem và giao tài sản của họ; cách nói này tự nhiên trong bối cảnh trao đổi do Giô-sép quản lý.
- source_word: מִקְנֵיכֶם
  choice: gia súc của các ông
  rationale: מִקְנֶה chỉ chung các loài vật nuôi thuộc sở hữu, không chỉ riêng bò.
- source_word: וְאֶתְּנָה לָכֶם
  choice: tôi sẽ cấp lương thực cho các ông
  rationale: Động từ có nghĩa là “tôi sẽ cho/cấp cho các ông”, còn tân ngữ không được nêu. “Lương thực” được bổ sung từ ngữ cảnh trực tiếp về nạn đói và việc mua thức ăn để câu tiếng Việt rõ nghĩa.
- source_word: בְּמִקְנֵיכֶם
  choice: để đổi lấy gia súc
  rationale: 'Giới từ בְּ ở đây biểu thị giá trao đổi: lương thực được cấp để đổi lấy gia súc.'
- source_word: אִם
  choice: nếu
  rationale: Giữ nghĩa điều kiện thông thường của אִם và không tự ý chuyển thành quan hệ nguyên nhân “vì/bởi vì”, dù trong ngữ cảnh câu này điều kiện có thể hàm ý một sự việc đã xảy ra.
- source_word: אָפֵס כָּסֶף
  choice: tiền đã hết
  rationale: אָפֵס diễn tả tiền đã cạn hoặc không còn; “đã hết” ngắn gọn và tự nhiên.
theological_decisions: []
