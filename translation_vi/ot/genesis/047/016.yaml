  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” theo ngữ cảnh Giô-sép nói với nhóm người đến giao dịch; giữ sắc thái điều kiện của nguyên văn, đồng thời chú thích cách hiểu theo nguyên nhân.
