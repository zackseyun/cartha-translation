  text: וַ/יָּבִ֣יאוּ אֶת מִקְנֵי/הֶם֮ אֶל יוֹסֵף֒ וַ/יִּתֵּ֣ן לָ/הֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּ/סּוּסִ֗ים וּ/בְ/מִקְנֵ֥ה הַ/צֹּ֛אן וּ/בְ/מִקְנֵ֥ה הַ/בָּקָ֖ר וּ/בַ/חֲמֹרִ֑ים וַ/יְנַהֲלֵ֤/ם בַּ/לֶּ֨חֶם֙ בְּ/כָל מִקְנֵ/הֶ֔ם בַּ/שָּׁנָ֖ה הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: vi
  text: Họ đem gia súc đến cho Giô-sép, và Giô-sép cấp lương thực cho họ để đổi lấy ngựa, các bầy chiên dê, các đàn bò và lừa. Trong suốt năm ấy, ông nuôi sống họ[a] bằng lương thực để đổi lấy toàn bộ gia súc của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “ông dẫn dắt họ bằng lương thực.” Động từ Hê-bơ-rơ có thể mang nghĩa “dẫn dắt, hướng dẫn, quản lý”; trong văn cảnh này, có lẽ chỉ việc nuôi sống hoặc chu cấp cho họ qua nạn đói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: gia súc của họ / toàn bộ gia súc của họ
  rationale: Danh từ này chỉ chung các loài vật nuôi thuộc sở hữu, không chỉ riêng bò; “gia súc” phù hợp với câu khái quát mở đầu và kết luận.
- source_word: לֶחֶם
  choice: lương thực
  rationale: Từ này có thể chỉ bánh theo nghĩa hẹp hoặc thức ăn, lương thực theo nghĩa rộng. Trong bối cảnh nạn đói và việc đổi gia súc lấy đồ ăn, “lương thực” tự nhiên và chính xác hơn trong tiếng Việt.
- source_word: בַּסּוּסִים
  choice: để đổi lấy ngựa
  rationale: Giới từ ב ở đây biểu thị vật được dùng trong cuộc trao đổi; dịch rõ ý trao đổi để tránh hiểu là phương tiện hoặc địa điểm.
- source_word: מִקְנֵה הַצֹּאן
  choice: các bầy chiên dê
  rationale: צֹאן là nhóm gia súc nhỏ, có thể gồm cả chiên lẫn dê; “các bầy chiên dê” bảo toàn phạm vi nghĩa tốt hơn chỉ dịch là “chiên”.
- source_word: מִקְנֵה הַבָּקָר
  choice: các đàn bò
  rationale: Cụm từ chỉ gia súc lớn thuộc loài bò theo nghĩa tập thể; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: חֲמֹרִים
  choice: lừa
  rationale: Từ tương đương thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וַיְנַהֲלֵם
  choice: ông nuôi sống họ
  rationale: Động từ נהל thường có nghĩa dẫn dắt, hướng dẫn hoặc quản lý; trong bối cảnh này, khi đi với lương thực, nó diễn tả việc Giô-sép duy trì sự sống và chu cấp cho dân. Chú thích giữ lại nghĩa sát chữ.
- source_word: בַּלֶּחֶם
  choice: bằng lương thực
  rationale: Giới từ biểu thị phương tiện Giô-sép dùng để duy trì sự sống cho họ.
- source_word: בְּכָל מִקְנֵהֶם
  choice: để đổi lấy toàn bộ gia súc của họ
  rationale: Cụm từ tóm kết cuộc trao đổi; nói rõ “để đổi lấy” tránh khả năng hiểu rằng lương thực được cấp cho gia súc.
- source_word: בַּשָּׁנָה הַהִוא
  choice: trong suốt năm ấy
  rationale: Cụm từ chỉ thời gian diễn ra sự sắp xếp này; “trong suốt” diễn đạt tự nhiên sắc thái kéo dài trong năm.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lương thực” thay vì “bánh” vì לֶחֶם trong bối cảnh nạn đói mang nghĩa rộng; giữ rõ cấu trúc trao đổi và dùng chú thích để bảo toàn nét nghĩa sát chữ của נהל.
