  source_fidelity: Bản dịch phản ánh đúng giao dịch đổi lương thực lấy gia súc, các nhóm vật nuôi được liệt kê, và việc Giô-sép chu cấp cho dân trong năm đó. “Lương thực” là cách chuyển nghĩa có thể chấp nhận trong ngữ cảnh nạn đói cho לֶחֶם, dù nghĩa đen là “bánh”.
  naturalness: Văn phong tự nhiên, rõ ràng và phù hợp tiếng Việt hiện đại. Tuy nhiên, dấu chú thích hiện đặt ở cuối câu, xa cụm “nuôi sống họ” mà chú thích đang giải thích; nên đặt ngay sau cụm này để neo chú thích minh bạch.
  terminology: “Gia súc,” “bầy chiên dê,” “đàn bò,” và “lừa” chuyển tải đúng các phạm trù chăn nuôi trong tiếng Hê-bơ-rơ. “Nuôi sống” diễn đạt hợp ngữ cảnh cho וַיְנַהֲלֵם; chú thích thích hợp để giữ phương án nghĩa sát chữ.
