  text: וַ/תִּתֹּם֮ הַ/שָּׁנָ֣ה הַ/הִוא֒ וַ/יָּבֹ֨אוּ אֵלָ֜י/ו בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא נְכַחֵ֣ד מֵֽ/אֲדֹנִ֔/י כִּ֚י אִם תַּ֣ם הַ/כֶּ֔סֶף וּ/מִקְנֵ֥ה הַ/בְּהֵמָ֖ה אֶל אֲדֹנִ֑/י לֹ֤א נִשְׁאַר֙ לִ/פְנֵ֣י אֲדֹנִ֔/י בִּלְתִּ֥י אִם גְּוִיָּתֵ֖/נוּ וְ/אַדְמָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: vi
  text: 'Khi năm ấy kết thúc, họ đến với ông vào năm thứ hai và nói: “Chúng tôi không giấu chủ tôi điều này: tiền đã cạn[a], đàn gia súc cũng đã về tay chủ tôi. Trước mặt chủ tôi, chẳng còn lại gì ngoài thân thể chúng tôi[b] và đất đai của chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “bạc đã cạn”. Trong tiếng Hê-bơ-rơ, “bạc” thường được dùng với nghĩa là tiền.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chính chúng tôi”. Tiếng Hê-bơ-rơ nói theo nghĩa đen là “thân thể chúng tôi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: Khi năm ấy kết thúc
  rationale: תמם diễn tả sự hoàn tất hoặc chấm dứt; cách dịch này tự nhiên trong tiếng Việt và giữ rõ mệnh đề thời gian.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: vào năm thứ hai
  rationale: Giữ cách đếm năm của nguyên văn, thay vì diễn giải thành “năm sau”, vốn rõ hơn theo ngữ cảnh nhưng kém sát hình thức.
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: Chúng tôi không giấu chúa tôi điều này
  rationale: כחד ở thể piel có nghĩa là giấu hoặc che giấu. “Chúa tôi” giữ lối xưng hô kính trọng ở số ít của tiếng Hê-bơ-rơ; “điều này” giúp câu tiếng Việt đầy đủ tự nhiên.
- source_word: תַּם הַכֶּסֶף
  choice: tiền đã cạn
  rationale: תם ở đây có nghĩa là bị dùng hết; הַכֶּסֶף theo nghĩa đen là “bạc” nhưng trong ngữ cảnh chỉ phương tiện thanh toán, nên “tiền” là cách diễn đạt rõ và tự nhiên hơn.
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: đàn gia súc cũng đã về tay chúa tôi
  rationale: מִקְנֵה הַבְּהֵמָה chỉ số gia súc thuộc quyền sở hữu; אֶל אֲדֹנִי trong ngữ cảnh hàm ý chúng đã được chuyển cho Giô-sép. “Đã về tay” diễn đạt sự chuyển quyền sở hữu mà không làm câu nặng nề.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: Trước mặt chúa tôi, chẳng còn lại gì
  rationale: Giữ hình ảnh לִפְנֵי, “trước mặt”, đồng thời dùng trật tự câu dễ hiểu trong tiếng Việt.
- source_word: בִּלְתִּי אִם גְּוִיָּתֵנוּ וְאַדְמָתֵנוּ
  choice: ngoài thân thể chúng tôi và đất đai của chúng tôi
  rationale: בִּלְתִּי אִם mở đầu ngoại lệ “ngoài/ngoại trừ”. גְּוִיָּה ở đây chỉ thân thể hoặc chính con người còn sống; “thân thể” bảo tồn tính cụ thể và sức nặng của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “chúa tôi” được viết thường để chỉ tước vị kính trọng dành cho Giô-sép, không phải danh xưng dành cho Đức Chúa Trời. Các lần lặp lại “chúa tôi” được giữ nhằm phản ánh giọng cầu khẩn và kính cẩn của nguyên văn.
