revisions:
- from: 'Khi năm ấy kết thúc, họ đến với ông vào năm thứ hai và nói: “Chúng tôi không giấu chúa tôi điều này: tiền đã cạn[a], đàn gia súc cũng đã về tay chúa tôi. Trước mặt chúa tôi, chẳng còn lại gì ngoài thân thể chúng tôi[b] và đất đai của chúng tôi.”'
  to: 'Khi năm ấy kết thúc, họ đến với ông vào năm thứ hai và nói: “Chúng tôi không giấu chủ tôi điều này: tiền đã cạn[a], đàn gia súc cũng đã về tay chủ tôi. Trước mặt chủ tôi, chẳng còn lại gì ngoài thân thể chúng tôi[b] và đất đai của chúng tôi.”'
  rationale: Chỉ thay “chúa tôi” bằng “chủ tôi” ở cả ba chỗ. Sửa đổi này làm rõ đây là cách thưa gửi một chủ/quyền lực trần thế, phù hợp với אַדֹנִי và với ngữ cảnh Giô-sép, đồng thời giữ nguyên nội dung, giọng điệu kính cẩn, các điểm mơ hồ, và toàn bộ hệ thống chú thích.
