base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: vi
  text: Vậy, Giô-sép mua toàn bộ đất đai Ai Cập cho Pha-ra-ôn[a], vì mỗi người Ai Cập đều bán ruộng mình, bởi nạn đói đè nặng trên họ[b]. Thế là đất đai thuộc về Pha-ra-ôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thu mua toàn bộ đất đai Ai Cập cho Pha-ra-ôn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “nạn đói mạnh trên họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: mua
  rationale: Động từ קנה trong ngữ cảnh người Ai Cập bán ruộng chỉ một giao dịch mua bán; “mua” là cách diễn đạt trực tiếp và tự nhiên nhất.
- source_word: אַדְמַת מִצְרַיִם
  choice: đất đai Ai Cập
  rationale: אַדְמָה ở đây chỉ đất như tài sản có thể sở hữu và chuyển nhượng; “đất đai” phù hợp hơn “đất” theo nghĩa vật chất hay thổ nhưỡng.
- source_word: לְפַרְעֹה
  choice: cho Pha-ra-ôn
  rationale: Giới từ לְ cho biết Pha-ra-ôn là người được hưởng hoặc nhận quyền sở hữu từ việc mua này; “cho Pha-ra-ôn” giữ được quan hệ ấy.
- source_word: מָכְרוּ מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: mỗi người Ai Cập đều bán ruộng mình
  rationale: Cụm Hê-bơ-rơ kết hợp chủ thể tập thể với אִישׁ mang ý phân phối; cách dịch này diễn đạt tự nhiên rằng từng người đều bán phần ruộng của mình.
- source_word: שָׂדֵהוּ
  choice: ruộng mình
  rationale: שָׂדֶה ở đây là thửa đất canh tác. “Ruộng” phù hợp với bối cảnh nông nghiệp và đại từ phản thân “mình” quy chiếu rõ về từng người Ai Cập.
- source_word: חָזַק עֲלֵהֶם הָרָעָב
  choice: nạn đói đè nặng trên họ
  rationale: חזק theo nghĩa đen là “mạnh”, còn עַל mô tả tai họa tác động trên con người. “Đè nặng trên họ” truyền đạt tự nhiên mức độ khốc liệt mà vẫn giữ hình ảnh áp lực của nguyên văn.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: Thế là đất đai thuộc về Pha-ra-ôn
  rationale: Mệnh đề nêu kết quả chuyển quyền sở hữu. “Thuộc về” rõ ràng, tự nhiên và không hàm ý vượt quá nguyên văn.
