revisions:
- from: 'Khi những ngày của Israel gần đến lúc ông qua đời, ông gọi con trai mình là Giô-sép đến và nói: “Nếu cha được đẹp lòng con, xin con đặt tay dưới đùi cha[a] và lấy lòng nhân từ cùng sự thành tín mà đối đãi với cha[b]. Xin đừng chôn cha tại Ai Cập.”'
  to: 'Khi Israel sắp qua đời, ông gọi con trai mình là Giô-sép đến và nói với con: “Nếu cha được lòng con, xin con đặt tay dưới đùi cha[a] và hãy đối đãi với cha bằng lòng nhân từ và sự thành tín[b]. Xin đừng chôn cha ở Ai Cập.”'
  rationale: Bản sửa ưu tiên tiếng Việt hiện đại, tự nhiên, đồng thời bảo toàn nội dung gốc. Thành ngữ Hê-bơ-rơ về những ngày đến gần được chuyển bằng ý nghĩa tương đương “Israel sắp qua đời”; hình ảnh nghi thức “đặt tay dưới đùi” vẫn được giữ nguyên và được giải thích bằng chú thích. Cặp từ חֶסֶד וֶאֱמֶת được diễn đạt không chuyên biệt hóa thành thuật ngữ thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:36:00Z'
