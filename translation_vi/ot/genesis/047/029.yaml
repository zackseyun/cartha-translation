source:
  edition: WLC
  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Joseph and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: vi
  text: 'Khi Israel sắp qua đời, ông gọi con trai mình là Giô-sép đến và nói với con: “Nếu cha được lòng con, xin con đặt tay dưới đùi cha[a] và hãy đối đãi với cha bằng lòng nhân từ và sự thành tín[b]. Xin đừng chôn cha ở Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đặt tay dưới đùi” là một cử chỉ dùng khi lập lời thề trang trọng trong các trình thuật về các tổ phụ; xem Sáng Thế Ký 24:2.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đối đãi với cha bằng lòng nhân từ bền vững và sự thành tín.” Cặp từ Hê-bơ-rơ חֶסֶד וֶאֱמֶת chỉ lòng nhân từ trung kiên và đáng tin cậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: Khi những ngày của Israel gần đến lúc ông qua đời
  rationale: Giữ hình ảnh Hê-bơ-rơ về “những ngày” đang đến gần, đồng thời thêm đại từ “ông” để câu tiếng Việt rõ nghĩa và tự nhiên.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nguyên văn dùng tên Israel chứ không dùng Jacob; bản dịch giữ đúng tên xuất hiện tại đây.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: con trai mình là Giô-sép
  rationale: Giô-sép là dạng tên quen thuộc trong tiếng Việt; cấu trúc này thể hiện rõ ông gọi chính người con trai tên Giô-sép.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Nếu cha được đẹp lòng con
  rationale: Diễn đạt tự nhiên công thức thỉnh cầu “tìm được ân huệ trong mắt”; cách xưng hô cha–con phù hợp quan hệ trong ngữ cảnh mà không thay đổi nội dung.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: xin con đặt tay dưới đùi cha
  rationale: Giữ nguyên hình ảnh cụ thể của cử chỉ tuyên thệ và chuyển נָא bằng “xin” để thể hiện lời khẩn cầu.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: lấy lòng nhân từ cùng sự thành tín mà đối đãi với cha
  rationale: “Đối đãi” truyền đạt thành ngữ làm/ứng xử với một người; “lòng nhân từ” và “sự thành tín” giữ cả tình nghĩa trung kiên lẫn tính đáng tin cậy của cặp từ Hê-bơ-rơ.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: Xin đừng chôn cha tại Ai Cập
  rationale: Thể hiện đây là lời khẩn khoản phủ định và dùng địa danh tiếng Việt thông dụng.
theological_decisions:
- issue: Ý nghĩa của חֶסֶד וֶאֱמֶת trong lời yêu cầu trang trọng giữa các thành viên gia đình
  choice: lòng nhân từ cùng sự thành tín
  alternative: tình yêu bền vững và lòng thành tín; lòng trung tín và chân thật
  rationale: Cách dịch được chọn giữ sắc thái nghĩa tình trung kiên và đáng tin cậy mà không tự động biến cụm từ thành một thuật ngữ giao ước chuyên biệt; chú thích bảo tồn độ rộng ngữ nghĩa.
- issue: Cử chỉ đặt tay dưới đùi
  choice: Dịch trực tiếp trong chính văn và giải thích bằng chú thích
  alternative: Diễn ý là “hãy thề với cha”
  rationale: Nguyên văn mô tả một cử chỉ cụ thể gắn với lời thề. Giữ hình ảnh tránh làm phẳng nét văn hóa của trình thuật, còn chú thích giúp độc giả hiện đại hiểu chức năng của cử chỉ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cách xưng hô “cha–con” làm rõ quan hệ gia đình vốn được ngữ cảnh và danh từ “con trai” xác định. Hai lần “xin” phản ánh hai lần xuất hiện của tiểu từ thỉnh cầu נָא. Dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích.
