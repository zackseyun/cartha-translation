  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: vi
  text: 'Pha-ra-ôn hỏi Gia-cốp: “Ông đã sống được bao nhiêu năm?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hê-bơ-rơ: “Những ngày của những năm trong đời ông là bao nhiêu?” Đây là cách nói Hê-bơ-rơ để hỏi tuổi của Gia-cốp.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: hỏi
  rationale: Động từ אמר theo nghĩa cơ bản là “nói”, nhưng vì lời trực tiếp là một câu hỏi nên “hỏi” diễn đạt tự nhiên và chính xác chức năng của lời nói trong tiếng Việt; yếu tố waw tiếp nối mạch kể không cần chuyển thành “và” một cách máy móc.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm quen thuộc của tước hiệu vua Ai Cập trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֶל יַעֲקֹב
  choice: Gia-cốp
  rationale: אֶל đánh dấu người được nói với; trong kết cấu tiếng Việt “hỏi Gia-cốp”, giới từ không cần biểu đạt riêng. “Gia-cốp” là dạng tên quen thuộc.
- source_word: כַּמָּה יְמֵי שְׁנֵי חַיֶּיךָ
  choice: Ông đã sống được bao nhiêu năm rồi?
  rationale: Cụm Hê-bơ-rơ theo sát mặt chữ là “Số ngày trong những năm của đời ông là bao nhiêu?”, một thành ngữ trang trọng dùng để hỏi tuổi. Bản chính chuyển theo nghĩa tự nhiên trong tiếng Việt, còn chú thích bảo tồn cấu trúc nguyên ngữ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” phù hợp với việc Pha-ra-ôn nói với một người đàn ông cao tuổi; câu chính dùng thành ngữ tiếng Việt tự nhiên, còn chú thích giữ lại nét diễn đạt đặc thù của tiếng Hê-bơ-rơ.
