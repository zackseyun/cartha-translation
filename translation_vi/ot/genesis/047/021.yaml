  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: vi
  text: Còn dân chúng, ông chuyển họ vào các thành, từ đầu này đến đầu kia của lãnh thổ Ai Cập.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông dời họ đến các thành.” Một số bản dịch, theo một cách hiểu văn bản khác, nói rằng Giô-sép bắt dân chúng làm tôi tớ; nhưng tiếng Hê-bơ-rơ ở đây trực tiếp nói đến việc chuyển dời họ.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: dân chúng
  rationale: Danh từ tập hợp chỉ dân cư Ai Cập chịu tác động bởi chính sách của Giô-sép; “dân chúng” tự nhiên trong tiếng Việt và không giới hạn vào một nhóm riêng.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: ông chuyển họ
  rationale: Dạng Hiphil của עבר diễn tả việc khiến đi qua, di chuyển hoặc chuyển dời. “Chuyển họ” giữ được ý chuyển nơi cư trú; đại từ số nhiều thuận với nghĩa tập hợp của “dân chúng” trong tiếng Việt.
- source_word: לֶעָרִים
  choice: vào các thành
  rationale: Giới từ ל được hiểu theo hướng đích đến; “vào các thành” diễn đạt rõ việc đưa dân đến các đô thị, đồng thời không thêm ý “từ thành này sang thành khác” vốn không được nêu trực tiếp.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: từ đầu này đến đầu kia của lãnh thổ Ai Cập
  rationale: Cụm từ chỉ toàn bộ chiều rộng của xứ. גְבוּל ở đây được dịch là “lãnh thổ” thay vì “biên giới” để tránh gợi ý chỉ một đường ranh giới.
theological_decisions:
- issue: Hành động của Giô-sép đối với dân cư Ai Cập
  choice: ông chuyển họ vào các thành
  alternative: ông bắt họ làm tôi tớ; ông chuyển họ từ thành này sang thành khác
  rationale: Bản Masoretic trực tiếp nói đến việc chuyển dời dân chúng. Cách dịch không đưa ý nô dịch vào câu này, cũng không xác định một mô hình di chuyển chi tiết hơn điều tiếng Hê-bơ-rơ nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Còn dân chúng” giữ cấu trúc nêu chủ đề của וְאֶת הָעָם; “ông” tiếp nối chủ thể Giô-sép từ ngữ cảnh. Dấu chú thích [a] được đặt ngay sau toàn câu vì chú thích liên quan đến cách hiểu hành động chính.
