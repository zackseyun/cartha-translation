  source_fidelity: 'Bản dịch bám sát Bản Masoretic: וְאֶת־הָעָם được diễn đạt tự nhiên là “Còn dân chúng”; הֶעֱבִיר אֹתוֹ là “ông chuyển họ”; và לֶעָרִים được hiểu đúng theo hướng đích đến là “vào các thành”. Thành ngữ chỉ toàn cõi Ai Cập “từ đầu này đến đầu kia của lãnh thổ Ai Cập” truyền đạt thích đáng ý bao quát của מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ. Bản dịch không thêm ý bắt làm nô lệ/tôi tớ vào câu chính.'
