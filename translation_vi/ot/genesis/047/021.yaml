  terminology: “Dân chúng,” “chuyển,” “các thành,” và “lãnh thổ Ai Cập” nhất quán với nghĩa từ vựng và không áp đặt một diễn giải giáo phái. Chú thích phản ánh công bằng cách hiểu thay thế, đồng thời xác định đúng rằng văn bản Hê-bơ-rơ được dùng ở đây nói trực tiếp về việc chuyển dời.
