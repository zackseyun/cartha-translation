base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: vi
  text: Gia-cốp sống tại xứ Ai Cập mười bảy năm. Những ngày của Gia-cốp, tức số năm ông sống,[a] là một trăm bốn mươi bảy năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “những ngày của Gia-cốp, những năm đời ông”; đây là một lối diễn đạt chỉ toàn bộ tuổi thọ của ông.'
    reason: Giải thích thành ngữ Hê-bơ-rơ được giữ tương đối sát trong bản dịch.
lexical_decisions:
- source_word: וַיְחִי
  choice: sống
  rationale: Động từ חיה ở đây nói rằng Gia-cốp tiếp tục sống trong khoảng thời gian được nêu; “sống” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: tại xứ Ai Cập
  rationale: Giữ thành tố אֶרֶץ (“xứ, đất”) của nguyên văn, đồng thời dùng cách nói tự nhiên trong văn kể trang trọng.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: mười bảy năm
  rationale: Chuyển chính xác số từ và đơn vị thời gian sang trật tự thông dụng trong tiếng Việt.
- source_word: יְמֵי יַעֲקֹב
  choice: số ngày của Gia-cốp
  rationale: Giữ hình ảnh Hê-bơ-rơ “những ngày của Gia-cốp”; thêm “số” để câu tổng kết tuổi thọ rõ và tự nhiên hơn trong tiếng Việt.
- source_word: שְׁנֵי חַיָּיו
  choice: những năm đời ông
  rationale: Cụm đồng vị giải thích “số ngày của Gia-cốp”; “những năm đời ông” vừa phản ánh cấu trúc nguyên văn vừa dễ hiểu.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: một trăm bốn mươi bảy năm
  rationale: Sắp xếp các thành phần của con số theo trật tự tự nhiên trong tiếng Việt và giữ nguyên tổng số 147.
