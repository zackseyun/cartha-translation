translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại; giữ tên riêng quen dùng “Gia-cốp” và địa danh “Ai Cập”. Dấu chấm tách hai mệnh đề giúp câu tiếng Việt sáng rõ mà không làm thay đổi quan hệ tiếp nối trong nguyên văn.
