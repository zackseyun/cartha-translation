base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: vi
  text: 'Rồi Giô-sép nói với dân chúng: “Này, hôm nay tôi đã mua các người và ruộng đất của các người cho Pha-ra-ôn. Đây là hạt giống cho các người; hãy gieo hạt trên đất.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Dạng waw liên tiếp đẩy diễn tiến câu chuyện về phía trước; “Rồi” diễn đạt tự nhiên trình tự ấy trong tiếng Việt.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ tập thể dân Ai Cập đang được Giô-sép trực tiếp nói với; “dân chúng” rõ nghĩa và tự nhiên.
- source_word: הֵן
  choice: Này
  rationale: Tiểu từ nhấn mạnh, thu hút sự chú ý vào lời công bố; “Này” trang trọng vừa phải và phù hợp tiếng Việt hiện đại.
- source_word: קָנִיתִי
  choice: tôi đã mua
  rationale: קנה trong bối cảnh giao dịch kinh tế này mang nghĩa mua/thu nhận quyền sở hữu; “đã mua” trực tiếp và giữ được sự gay gắt của việc cả con người lẫn đất đai được chuyển cho Pha-ra-ôn.
- source_word: אֶתְכֶם
  choice: các người
  rationale: Đại từ làm tân ngữ chỉ chính những người dân; cách dịch trực tiếp này không làm nhẹ đi nội dung pháp lý-xã hội của câu.
- source_word: הַיּוֹם
  choice: hôm nay
  rationale: Giữ nguyên mốc thời gian của giao dịch hiện tại.
- source_word: אַדְמַתְכֶם
  choice: ruộng đất của các người
  rationale: Trong bối cảnh nông nghiệp, אֲדָמָה chỉ phần đất canh tác của họ; “ruộng đất” rõ hơn “đất” đơn thuần.
- source_word: לְפַרְעֹה
  choice: cho Pha-ra-ôn
  rationale: Giới từ לְ biểu thị việc mua nhân danh hoặc để thuộc quyền Pha-ra-ôn; “cho” giữ được cả hướng chuyển giao và tư cách người thụ hưởng.
- source_word: הֵא
  choice: Đây là
  rationale: Tiểu từ trình hiện, giới thiệu thứ Giô-sép trao cho dân; “Đây là” tự nhiên trong tiếng Việt.
- source_word: זֶרַע
  choice: hạt giống
  rationale: Chỉ giống dùng để gieo; “hạt giống” rõ nghĩa đối với độc giả phổ thông.
- source_word: וּזְרַעְתֶּם
  choice: các người hãy gieo trồng
  rationale: Dạng động từ trong lời nói trực tiếp có lực chỉ thị; “hãy” diễn đạt mệnh lệnh, còn “gieo trồng” tự nhiên trong ngữ cảnh canh tác.
- source_word: הָאֲדָמָה
  choice: trên đất
  rationale: Chỉ đất canh tác sẽ được gieo; tiếng Việt tự nhiên cần giới từ “trên” với động từ “gieo trồng”.
theological_decisions:
- issue: Tình trạng của người dân sau giao dịch
  choice: Giữ cách nói trực tiếp “đã mua các người”
  alternative: Diễn giải thành “đã thu nhận các người làm tôi tớ” hoặc “đã mua sức lao động của các người”
  rationale: Bản Hê-bơ-rơ đặt chính người dân song song với ruộng đất làm tân ngữ của קנה. Không nên giải thích trước bản chất pháp lý hoặc thần học của tình trạng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Pha-ra-ôn” theo lối phiên âm Kinh Thánh quen thuộc; giữ lời công bố sắc nét, không uyển ngữ hóa việc mua người dân và ruộng đất.
