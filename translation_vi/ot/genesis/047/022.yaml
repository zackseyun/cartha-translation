revisions:
- from: Chỉ có đất của các tư tế là ông không mua, vì các tư tế được Pha-ra-ôn cấp một phần lương thực[a], và họ sống nhờ phần lương thực Pha-ra-ôn cấp cho mình. Vì thế, họ không bán đất của mình.
  to: Chỉ có đất của các tư tế là ông không mua, vì các tư tế có một phần được Pha-ra-ôn cấp, và họ ăn phần mà Pha-ra-ôn cấp cho họ. Vì thế, họ không bán đất của mình.
  rationale: Sửa “phần lương thực” thành “phần được cấp” để không thu hẹp nghĩa của חֹק / חֻקָּם, và sửa “sống nhờ” thành “ăn” để giữ động từ cụ thể của nguyên văn. Các yếu tố còn lại được giữ nguyên vì sát nghĩa và tự nhiên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:35:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng ngoại lệ về đất của các tư tế, việc Pha-ra-ôn chu cấp cho họ, và hệ quả là họ không bán đất. Tuy nhiên, “lương thực” quy định hóa חֹק / חֻקָּם quá mức: từ này chỉ phần cấp phát/khẩu phần được ấn định, dù động từ “ăn” cho thấy phần ấy được dùng làm thức ăn trong ngữ cảnh.'
  naturalness: Câu văn nhìn chung tự nhiên và phù hợp văn phong hiện đại. Có thể giữ động từ cụ thể “ăn” của tiếng Hê-bơ-rơ thay vì diễn giải thành “sống nhờ”, mà vẫn đọc rõ ràng trong tiếng Việt.
  terminology: “Tư tế” và “Pha-ra-ôn” nhất quán, phù hợp ngữ cảnh Kinh Thánh. “Phần được cấp” bảo toàn độ mở nghĩa của thuật ngữ Hê-bơ-rơ tốt hơn “phần lương thực”.
  issues:
  - severity: medium
    issue: “một phần lương thực / phần lương thực” thu hẹp nghĩa của חֹק / חֻקָּם.
    rationale: Từ này ở đây là phần chu cấp hoặc phần được ấn định; văn cảnh cho biết họ “ăn” phần đó, nhưng không buộc bản dịch phải xác định danh từ ấy là lương thực.
  - severity: low
    issue: “họ sống nhờ” thay cho “họ ăn” làm giảm tính cụ thể của động từ וְאָכְלוּ.
    rationale: Bản văn dùng động từ “ăn”; có thể dịch trực tiếp và vẫn tự nhiên.
  revised_text: Chỉ có đất của các tư tế là ông không mua, vì các tư tế có một phần được Pha-ra-ôn cấp, và họ ăn phần mà Pha-ra-ôn cấp cho họ. Vì thế, họ không bán đất của mình.
