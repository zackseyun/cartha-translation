base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: vi
  text: Chỉ có đất của các tư tế là ông không mua, vì các tư tế có một phần được Pha-ra-ôn cấp, và họ ăn phần mà Pha-ra-ôn cấp cho họ. Vì thế, họ không bán đất của mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Chỉ có
  rationale: Đánh dấu trường hợp ngoại lệ đối với lời tóm lược trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: đất của các tư tế
  rationale: Diễn đạt rõ cụm sở hữu chỉ đất đai thuộc về giới tư tế.
- source_word: קָנָה
  choice: mua
  rationale: Phù hợp với bối cảnh Giô-sép mua đất của dân Ai Cập.
- source_word: חֹק / חֻקָּם
  choice: một phần lương thực / phần lương thực
  rationale: Trong ngữ cảnh này, từ Hê-bơ-rơ chỉ phần cấp phát được ấn định từ Pha-ra-ôn; việc họ 'ăn' phần ấy cho thấy đây là nhu yếu phẩm, nhất là lương thực, chứ không chủ yếu là luật lệ.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: họ sống nhờ phần lương thực
  rationale: Truyền đạt tự nhiên ý họ ăn và sinh sống bằng phần cấp phát, tránh lối nói gượng 'ăn phần cấp phát' trong tiếng Việt.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Biểu thị kết quả hợp lý từ sự chu cấp của Pha-ra-ôn.
- source_word: מָכְרוּ אֶת אַדְמָתָם
  choice: bán đất của mình
  rationale: Cách diễn đạt thương mại rõ ràng, tự nhiên và sát nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tư tế” cho כֹּהֲנִים và phiên âm “Pha-ra-ôn” theo cách gọi Kinh Thánh quen thuộc. Cụm “sống nhờ” ưu tiên tiếng Việt tự nhiên nhưng vẫn giữ ý cụ thể rằng phần cấp phát dùng làm thức ăn.
