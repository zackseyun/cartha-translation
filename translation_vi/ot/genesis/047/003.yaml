  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: vi
  text: 'Pha-ra-ôn hỏi các anh em của Giô-sép: “Các ngươi làm nghề gì?[a]” Họ thưa với Pha-ra-ôn: “Tôi tớ của ngài là những người chăn đàn chiên dê[b], cả chúng tôi lẫn cha ông chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Công việc của các ngươi là gì?”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “những người chăn đàn”; từ chỉ “đàn” thường nói về gia súc nhỏ, nhất là chiên và dê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Các ngươi làm nghề gì?
  rationale: Danh từ מַעֲשֶׂה chỉ việc làm, công việc hay hoạt động; trong bối cảnh triều kiến này, câu hỏi nhắm đến nghề nghiệp. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ đúng ý nghĩa nghề nghiệp.
- source_word: רֹעֵה צֹאן
  choice: những người chăn chiên và dê
  rationale: Cụm phân từ này chỉ người chăm nom צֹאן, tức các đàn gia súc nhỏ, đặc biệt là chiên và dê. Nêu cả chiên lẫn dê tránh thu hẹp nghĩa vào riêng loài chiên.
- source_word: עֲבָדֶיךָ
  choice: các đầy tớ ngài
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ, nhưng ở đây là lối tự xưng khiêm nhường trước Pha-ra-ôn, không nhấn mạnh thân phận nô lệ.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: cả chúng tôi lẫn tổ phụ chúng tôi đều làm nghề ấy
  rationale: Cấu trúc גַּם...גַּם nhấn mạnh sự liên tục qua các thế hệ. Bổ sung “đều làm nghề ấy” trong tiếng Việt làm câu trọn nghĩa mà không thêm nội dung mới.
- source_word: אֶל אֶחָיו
  choice: hỏi các anh em của Giô-sép
  rationale: Hậu tố “của ông” theo ngữ cảnh quy chiếu về Giô-sép. Nêu tên Giô-sép giúp tránh cách hiểu lầm trong tiếng Việt rằng họ là anh em của Pha-ra-ôn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ngươi” thể hiện lời của vua nói với thần dân; “các đầy tớ ngài” giữ lối thưa gửi khiêm nhường trong triều đình. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
