  to: 'Pha-ra-ôn hỏi các anh em của Giô-sép: “Các ngươi làm nghề gì?[a]” Họ thưa với Pha-ra-ôn: “Tôi tớ của ngài là những người chăn đàn chiên dê[b], cả chúng tôi lẫn cha ông chúng tôi.”'
