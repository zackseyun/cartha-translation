  - severity: low
    issue: “lập điều ấy thành một luật lệ” hơi gượng
    rationale: Cấu trúc này hiểu được nhưng không phải cách nói trôi chảy nhất trong tiếng Việt hiện đại; “ban hành điều này làm luật lệ” giữ nguyên nghĩa của שׂים ... לְחֹק.
