  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: vi
  text: 'Vậy, Giô-sép ban hành điều này làm luật lệ, vẫn còn hiệu lực cho đến ngày nay, về đất đai Ai Cập: một phần năm thuộc về Pha-ra-ôn.[a] Chỉ riêng đất của các tư tế không trở thành sở hữu của Pha-ra-ôn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Một phần năm” tức là 20 phần trăm sản lượng.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ לְחֹק
  choice: lập điều ấy thành một luật lệ
  rationale: Trong ngữ cảnh hành chính-pháp lý, שׂים với לְחֹק có nghĩa là thiết lập một quy định có tính cố định. “Điều ấy” quy chiếu tự nhiên về chính sách được nêu ở câu trước.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: còn hiệu lực cho đến ngày nay
  rationale: Cách diễn đạt này gắn cụm thời gian với sự tồn tại liên tục của luật lệ, phù hợp ngữ cảnh hơn là với riêng hành động ban hành.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: trên đất Ai Cập
  rationale: עַל chỉ phạm vi áp dụng của luật lệ; “trên đất Ai Cập” vừa gần cấu trúc nguồn vừa tự nhiên trong tiếng Việt.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: một phần năm thuộc về Pha-ra-ôn
  rationale: חֹמֶשׁ là một phần năm; לְפַרְעֹה chỉ người nhận hoặc bên được hưởng phần ấy. Tiếng Việt cần “một phần năm” để diễn đạt tỷ lệ tự nhiên.
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: Chỉ riêng đất của các tư tế
  rationale: Kết hợp “chỉ riêng” truyền đạt cả sức hạn định của רַק lẫn sự nhấn mạnh của לְבַדָּם mà không gây nặng nề.
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: không trở thành sở hữu của Pha-ra-ôn
  rationale: Cụm היה + ל diễn tả tình trạng thuộc quyền sở hữu; trong mạch kể về việc đất được chuyển sang cho Pha-ra-ôn, “không trở thành sở hữu” giữ rõ sắc thái kết quả.
