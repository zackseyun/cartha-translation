revisions:
- from: 'Vậy, Giô-sép lập điều ấy thành một luật lệ còn hiệu lực cho đến ngày nay trên đất Ai Cập: một phần năm thuộc về Pha-ra-ôn.[a] Chỉ riêng đất của các tư tế là không trở thành sở hữu của Pha-ra-ôn.'
  to: 'Vậy, Giô-sép ban hành điều này làm luật lệ, vẫn còn hiệu lực cho đến ngày nay, về đất đai Ai Cập: một phần năm thuộc về Pha-ra-ôn.[a] Chỉ riêng đất của các tư tế không trở thành sở hữu của Pha-ra-ôn.'
