  terminology: “Pha-ra-ôn” và “Giô-sép” nhất quán với lối phiên âm Kinh Thánh Việt ngữ. “Các anh em” giữ đúng nghĩa số nhiều nam tính của אַחֶיךָ; không nên khái quát thành “gia đình”.
