  text: Then Pharaoh said to Joseph[a], “Your father and your brothers have come to you.”
translation:
  language: vi
  text: 'Bấy giờ, Pha-ra-ôn nói với Giô-sép[a]: “Cha và các anh em của ông đã đến với ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Và Pha-ra-ôn nói với Giô-sép rằng: ‘Cha và các anh em của ông đã đến với ông.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt tự nhiên sắc thái tuần tự trong tiếng Việt hiện đại.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt đối với tước hiệu của vua Ai Cập.
- source_word: אֶל יוֹסֵף
  choice: với Giô-sép
  rationale: Sau động từ “nói”, tiếng Việt tự nhiên dùng “nói với” để chỉ người được nói đến.
- source_word: לֵאמֹר
  choice: không dịch riêng
  rationale: Đây là công thức Hê-bơ-rơ giới thiệu lời nói trực tiếp; dịch thêm “rằng” hoặc “mà rằng” sau “nói với” sẽ kém tự nhiên và không cần thiết.
- source_word: אָבִיךָ
  choice: cha ... của ngươi
  rationale: Giữ quan hệ thân tộc và đại từ ngôi thứ hai số ít, phù hợp lời của Pha-ra-ôn nói với Giô-sép.
- source_word: וְאַחֶיךָ
  choice: và các anh em của ngươi
  rationale: אַחִים chỉ những người anh em trai; “các anh em” giữ đúng giới tính và có thể bao quát cả anh lẫn em trai mà không suy diễn thành toàn thể gia đình.
- source_word: בָּאוּ
  choice: đã đến
  rationale: Động từ hoàn thành diễn tả hành động đã xảy ra; “đã đến” tự nhiên trong tiếng Việt và vẫn cho thấy kết quả hiện tại.
- source_word: אֵלֶיךָ
  choice: với ngươi
  rationale: Diễn tả hướng đến Giô-sép. Trong ngữ cảnh người thân đến đoàn tụ với một người, “đến với ngươi” vừa sát nghĩa vừa tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phản ánh lời của vua nói với bề tôi trong bối cảnh cổ đại mà không mang sắc thái khinh miệt quá mức; giữ cách phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
