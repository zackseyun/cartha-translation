  text: וְ/הָיָה֙ בַּ/תְּבוּאֹ֔ת וּ/נְתַתֶּ֥ם חֲמִישִׁ֖ית לְ/פַרְעֹ֑ה וְ/אַרְבַּ֣ע הַ/יָּדֹ֡ת יִהְיֶ֣ה לָ/כֶם֩ לְ/זֶ֨רַע הַ/שָּׂדֶ֧ה וּֽ/לְ/אָכְלְ/כֶ֛ם וְ/לַ/אֲשֶׁ֥ר בְּ/בָתֵּי/כֶ֖ם וְ/לֶ/אֱכֹ֥ל לְ/טַפְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: vi
  text: Đến kỳ thu hoạch, anh em phải nộp một phần năm cho Pha-ra-ôn; còn bốn phần năm[a] sẽ thuộc về anh em, để làm giống để gieo ngoài đồng, làm lương thực cho anh em, cho những người trong nhà anh em và cho con trẻ anh em ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ viết sát nghĩa là “bốn tay”, một thành ngữ chỉ bốn phần còn lại trong năm phần, tức bốn phần năm.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: Đến kỳ thu hoạch
  rationale: Danh từ תְּבוּאָה chỉ hoa lợi hoặc sản lượng; với giới từ ב trong bối cảnh quy định về phần nộp, cách dịch theo thời điểm thu hoạch vừa tự nhiên vừa truyền đạt đúng lúc hoa lợi được thu vào.
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: anh em phải nộp một phần năm cho Pha-ra-ôn
  rationale: חֲמִישִׁית là một phần năm. Động từ 'nộp' phù hợp với việc giao phần hoa lợi bắt buộc cho Pha-ra-ôn trong quy định này.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: còn bốn phần năm[a]
  rationale: Cụm từ nguyên văn là 'bốn tay/phần', một thành ngữ chỉ bốn phần còn lại trong tổng số năm phần. Dịch rõ là 'bốn phần năm' để người đọc hiện đại hiểu ngay, đồng thời chú thích dạng diễn đạt Hê-bơ-rơ.
- source_word: יִהְיֶה לָכֶם
  choice: sẽ thuộc về anh em
  rationale: Cụm này diễn tả phần hoa lợi còn lại được dành cho và thuộc quyền sử dụng của dân chúng.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: để làm giống gieo ngoài đồng
  rationale: Giới từ ל mang ý chỉ mục đích; số hạt này được giữ lại để gieo trồng vụ sau. Cách diễn đạt này tự nhiên hơn lối dịch sát chữ 'hạt giống của đồng ruộng'.
- source_word: וּלְאָכְלְכֶם
  choice: làm lương thực cho anh em
  rationale: Dạng từ gốc אכל ở đây chỉ mục đích ăn uống; 'làm lương thực' phù hợp với hoa lợi và mạch liệt kê.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: cho những người trong nhà anh em
  rationale: Mệnh đề quan hệ chỉ những người thuộc hộ gia đình, không phải đồ vật trong nhà. Bản dịch làm rõ đối tượng mà không xác định hẹp hơn nguyên văn.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: và cho con trẻ anh em ăn
  rationale: טַף thường chỉ trẻ nhỏ hoặc những người nhỏ bé lệ thuộc trong gia đình. 'Con trẻ' giữ sắc thái gia đình và phù hợp với ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” thể hiện lời Joseph nói với dân chúng theo số nhiều, tránh sắc thái cổ hoặc miệt thị có thể phát sinh từ “các ngươi”. Cấu trúc câu giữ rõ quy định một phần năm nộp cho Pha-ra-ôn và các mục đích sử dụng phần còn lại.
