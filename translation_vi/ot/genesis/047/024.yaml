  terminology: “Pha-ra-ôn,” “một phần năm,” “bốn phần năm,” “lương thực,” và “con trẻ” đều phù hợp. Đại từ “anh em” có thể giữ vì phản ánh cách xưng hô số nhiều trong văn cảnh mà vẫn trang trọng, tự nhiên.
  issues:
