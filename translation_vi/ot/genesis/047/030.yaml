source:
  edition: WLC
  text: וְ/שָֽׁכַבְתִּי֙ עִם אֲבֹתַ֔/י וּ/נְשָׂאתַ֨/נִי֙ מִ/מִּצְרַ֔יִם וּ/קְבַרְתַּ֖/נִי בִּ/קְבֻרָתָ֑/ם וַ/יֹּאמַ֕ר אָנֹכִ֖י אֶֽעֱשֶׂ֥ה כִ/דְבָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: vi
  text: '“Khi tôi nằm xuống[a] cùng các tổ phụ[b], hãy đưa tôi ra khỏi Ai Cập và chôn tôi tại nơi chôn cất của họ[c].” Ông đáp: “Tôi sẽ làm như lời cha nói.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “và tôi nằm xuống”; đây là cách nói Hê-bơ-rơ quen thuộc gắn với cái chết và sự chôn cất.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tổ tiên”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “trong mộ của họ” hoặc “trong lăng mộ của họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: Khi tôi nằm xuống
  rationale: Động từ שׁכב có nghĩa đen là “nằm xuống” và trong ngữ cảnh này là cách nói gắn với cái chết. Dịch “khi” làm rõ chức năng thời gian tự nhiên của liên từ וְ trong lời yêu cầu, đồng thời vẫn giữ hình ảnh Hê-bơ-rơ thay vì diễn giải thẳng thành “chết”.
- source_word: עִם אֲבֹתַי
  choice: cùng các tổ phụ
  rationale: אָבוֹת ở đây chỉ những người cha thuộc các thế hệ trước. “Các tổ phụ” giữ được sắc thái gia tộc và phù hợp với công thức nói về cái chết và sự an táng; chú thích nêu cách nói thông dụng hơn là “tổ tiên”.
- source_word: וּנְשָׂאתַנִי
  choice: hãy đưa tôi
  rationale: נשא trong ngữ cảnh tang lễ mang nghĩa mang hoặc đưa thi hài đi. “Đưa tôi” tự nhiên trong tiếng Việt và bao hàm việc chuyên chở ra khỏi Ai Cập.
- source_word: מִמִּצְרַיִם
  choice: ra khỏi Ai Cập
  rationale: Giới từ מִן biểu thị sự rời khỏi một nơi; “ra khỏi Ai Cập” diễn đạt rõ hướng chuyển động.
- source_word: וּקְבַרְתַּנִי
  choice: và chôn tôi
  rationale: קבר có nghĩa trực tiếp là “chôn”; không cần diễn giải thêm.
- source_word: בִּקְבֻרָתָם
  choice: tại nơi chôn cất của họ
  rationale: קְבֻרָה có thể chỉ mộ, phần mộ hoặc nơi chôn cất. Cách dịch này giữ nghĩa rộng, không xác định hình thức kiến trúc của địa điểm.
- source_word: וַיֹּאמַר
  choice: Ông đáp
  rationale: Trong mạch đối thoại, wayyiqtol của אמר giới thiệu lời trả lời của Giô-sép. “Ông đáp” tự nhiên hơn “và ông nói” trong tiếng Việt mà không thêm nội dung.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: Tôi sẽ làm
  rationale: Đại từ độc lập אָנֹכִי có thể tạo nhấn mạnh, nhưng trong câu trả lời ngắn này, chủ ngữ “tôi” đã hiện rõ và trang trọng tự nhiên; không cần thêm “chính” nếu văn cảnh không đòi hỏi đối lập.
- source_word: כִדְבָרֶךָ
  choice: như lời cha nói
  rationale: Nghĩa đen là “theo lời của ông/ngài”. Vì người nói là con trả lời cha, “cha” là đại từ xưng hô tự nhiên, còn “như lời ... nói” giữ ý thuận theo lời yêu cầu mà không biến thành một thuật ngữ thần học.
theological_decisions:
- issue: Cách nói về cái chết trong וְשָׁכַבְתִּי עִם אֲבֹתַי
  choice: Giữ hình ảnh “nằm xuống cùng các tổ phụ”
  alternative: Diễn giải thành “khi tôi qua đời” hoặc “khi tôi được an nghỉ cùng tổ tiên”
  rationale: Nguyên văn dùng thành ngữ gắn với cái chết và chôn cất nhưng không trực tiếp dùng động từ “chết”. Giữ hình ảnh tránh quyết định thay độc giả về hàm ý thần học của việc “cùng các tổ phụ”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các tổ phụ” giữ sắc thái gia tộc của nguyên văn; “nơi chôn cất” tránh xác định quá mức là mộ đất hay lăng mộ. Cặp xưng hô “tôi—cha” phản ánh tự nhiên lời Giô-sép thưa với Gia-cốp trong tiếng Việt.
