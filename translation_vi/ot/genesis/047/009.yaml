  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: vi
  text: 'Gia-cốp thưa với Pha-ra-ôn: “Những năm tháng kiều ngụ của tôi là một trăm ba mươi năm. Những năm tháng đời tôi thật ngắn ngủi và khốn khó, không dài bằng những năm tháng đời các tổ phụ tôi trong thời họ sống kiều ngụ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: tôi sống kiều ngụ / họ sống kiều ngụ
  rationale: Từ Hê-bơ-rơ chỉ việc cư trú như người ngoại kiều, không định cư lâu dài. “Sống kiều ngụ” giữ được địa vị khách trú của các tổ phụ mà không diễn giải thành một cuộc hành hương thuộc linh.
- source_word: יְמֵי שְׁנֵי
  choice: những năm tháng
  rationale: Cụm Hê-bơ-rơ chồng hai ý “ngày” và “năm” để chỉ quãng đời. “Những năm tháng” tái hiện phần nào sắc thái trang trọng, lặp lại ấy nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: một trăm ba mươi năm
  rationale: Cách diễn đạt số đếm tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: מְעַט
  choice: ngắn ngủi
  rationale: Trong ngữ cảnh so sánh tuổi thọ với các tổ phụ, từ này nói quãng đời ít về số năm; “ngắn ngủi” truyền đạt ý ấy tự nhiên hơn “ít” khi bổ nghĩa cho đời người.
- source_word: רָעִים
  choice: khốn khó
  rationale: Ở đây רַע mô tả những nghịch cảnh trong đời Gia-cốp, không nhất thiết phán đoán đạo đức rằng các ngày là gian ác. “Khốn khó” giữ được sức nặng tiêu cực và phù hợp ngữ cảnh.
- source_word: חַיַּי / חַיֵּי אֲבֹתַי
  choice: đời tôi / đời các tổ phụ tôi
  rationale: Các dạng liên kết nói đến đời sống hay tuổi đời; cách dịch này tự nhiên, đồng thời giữ sự đối chiếu giữa Gia-cốp và các tổ phụ.
- source_word: הִשִּׂיגוּ
  choice: không dài bằng
  rationale: Động từ có nghĩa đạt tới hoặc theo kịp. Trong phép so sánh tuổi thọ, “không dài bằng” diễn đạt rõ rằng tuổi đời Gia-cốp chưa đạt đến tuổi đời các tổ phụ.
- source_word: אֲבֹתַי
  choice: các tổ phụ tôi
  rationale: Ngữ cảnh nhắm đến những người cha thuộc dòng tộc trước Gia-cốp, đặc biệt là Áp-ra-ham và Y-sác; “các tổ phụ” rõ nghĩa hơn “các cha tôi” trong tiếng Việt.
- source_word: וַיֹּאמֶר ... אֶל־פַּרְעֹה
  choice: thưa với Pha-ra-ôn
  rationale: Động từ cơ bản là “nói”, nhưng “thưa” thể hiện tự nhiên hoàn cảnh Gia-cốp đáp lời vua mà không làm thay đổi nội dung phát ngôn.
theological_decisions:
- issue: Các tổ phụ tự mô tả là người cư trú tạm thời
  choice: sống kiều ngụ
  alternative: hành hương
  rationale: Nguyên ngữ trực tiếp nói đến việc sống như người ngoại kiều hay khách trú. Bản dịch không thuộc linh hóa từ này thành “hành hương”, nhưng vẫn bảo toàn chủ đề các tổ phụ chưa định cư lâu dài trong đất.
- issue: Ý nghĩa của רָעִים khi mô tả đời Gia-cốp
  choice: khốn khó
  alternative: gian ác
  rationale: Câu nói tổng kết những gian truân Gia-cốp đã trải qua. Dịch “khốn khó” tránh hàm ý rằng chính những ngày tháng mang tội lỗi đạo đức, nhưng không giảm nhẹ lời than của ông.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “thưa” theo quan hệ giao tiếp với vua; giữ sự lặp lại “những năm tháng” để phản ánh nhịp trang nghiêm của nguyên văn, đồng thời tránh cấu trúc quá gượng theo từng chữ Hê-bơ-rơ.
