  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: vi
  text: Ông chọn năm người trong số các anh em mình và đưa họ ra trước mặt Pha-ra-ôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu theo nghĩa đen là «từ đầu/mép của các anh em mình», hoặc theo một cách hiểu truyền thống là «từ những người ưu tú nhất trong số các anh em mình». Cụm từ Hê-bơ-rơ có nghĩa đen liên quan đến «đầu» hay «mép», nhưng trong ngữ cảnh này nhiều khả năng có nghĩa bộ phận: Giô-sép chọn năm người trong số các anh em mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה אֶחָיו
  choice: trong số các anh em mình
  rationale: 'מִקְצֵה nghĩa đen là “từ đầu/mép của,” nhưng trong ngữ cảnh này nhiều khả năng mang nghĩa bộ phận: lấy một số người từ nhóm anh em. Cách dịch này tự nhiên và không áp đặt cách hiểu “những người ưu tú nhất.”'
- source_word: לָקַח
  choice: chọn
  rationale: Động từ thường có nghĩa “lấy,” nhưng ở đây nói đến việc lấy năm người từ một nhóm; “chọn” diễn đạt rõ hành động trong tiếng Việt mà không thêm ý về phẩm chất của họ.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: năm người
  rationale: Cụm số từ và danh từ này chỉ năm người nam; vì họ đã được xác định là các anh em của Giô-sép, “năm người” là tự nhiên và đầy đủ trong tiếng Việt.
- source_word: וַיַּצִּגֵם
  choice: đưa họ đến trình diện
  rationale: Thể Hifil của יָצַג có nghĩa đặt hoặc đưa ai ra trước mặt người khác. Trong bối cảnh triều đình, “đưa họ đến trình diện” truyền đạt tự nhiên việc Giô-sép đưa các anh em ra trước Pha-ra-ôn.
- source_word: לִפְנֵי פַרְעֹה
  choice: Pha-ra-ôn
  rationale: Ý “trước mặt Pha-ra-ôn” đã được bao hàm tự nhiên trong động từ “trình diện”; cách diễn đạt này tránh lặp ý nhưng vẫn giữ đúng bối cảnh diện kiến.
