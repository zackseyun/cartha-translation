translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Đại từ “ông” nối với Giô-sép trong ngữ cảnh; tên Pha-ra-ôn được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
