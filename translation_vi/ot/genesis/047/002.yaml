  terminology: «Pha-ra-ôn» và «các anh em mình» nhất quán, rõ nghĩa. Chú thích hiện tại gán «chọn năm người» cho các cách dịch thay thế của riêng מִקְצֵה; nên chỉnh để các phương án thay thế chỉ phản ánh phạm vi ngữ nghĩa của cụm từ Hê-bơ-rơ, không biến chúng thành một bản dịch nguyên câu thiếu chính xác.
