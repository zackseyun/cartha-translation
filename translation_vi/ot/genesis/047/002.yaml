  source_fidelity: Bản dịch diễn đạt đúng ý tuyển chọn năm người trong nhóm các anh em và việc đưa họ ra diện kiến Pha-ra-ôn. Tuy nhiên, cụm «đến trình diện Pha-ra-ôn» chỉ hàm ý, thay vì diễn đạt trực tiếp, giới từ לִפְנֵי («trước mặt»). Nên giữ yếu tố này trong câu để phản ánh đầy đủ bản văn.
