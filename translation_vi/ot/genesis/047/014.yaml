base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: vi
  text: Giô-sép thu gom tất cả số bạc có trong xứ Ai Cập và xứ Ca-na-an, là số bạc người ta dùng để mua lương thực[a], rồi đem số bạc ấy vào nhà Pha-ra-ôn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lương thực” ở đây, trong bối cảnh nạn đói, đặc biệt chỉ ngũ cốc. “Bạc” cũng có thể được hiểu là tiền, vì bạc được dùng làm phương tiện thanh toán.
    reason: lexical_clarification
  - marker: b
    text: “Nhà Pha-ra-ôn” có thể chỉ không chỉ cung điện mà còn hoàng gia hoặc kho bạc của Pha-ra-ôn.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: thu gom
  rationale: Động từ לקט chỉ việc gom góp, thu lại từ nhiều giao dịch; “thu gom” tự nhiên và giữ được ý tích lũy.
- source_word: כָּל הַכֶּסֶף
  choice: tất cả số bạc
  rationale: כֶּסֶף trước hết là bạc, đồng thời được dùng như tiền; giữ hình ảnh cụ thể của nguyên văn.
- source_word: הַנִּמְצָא
  choice: có
  rationale: Trong ngữ cảnh này, phân từ mang nghĩa số bạc hiện có trong hai xứ; “có” tự nhiên hơn lối dịch sát “được tìm thấy” mà không làm mất ý.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: trong xứ Ai Cập và xứ Ca-na-an
  rationale: Giữ cách diễn đạt địa lý của tiếng Hê-bơ-rơ bằng từ “xứ”, với tên riêng quen thuộc trong tiếng Việt.
- source_word: בַּשֶּׁבֶר אֲשֶׁר הֵם שֹׁבְרִים
  choice: để trả cho số lương thực người ta mua
  rationale: שֶׁבֶר ở đây là lương thực, cụ thể là ngũ cốc trong nạn đói; động từ cùng gốc mang nghĩa mua lương thực. Cách dịch làm rõ quan hệ trao đổi và giữ sắc thái hành động đang diễn ra.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: đem số bạc ấy vào nhà Pha-ra-ôn
  rationale: Dạng định hướng בֵּיתָה diễn tả chuyển động vào bên trong; “nhà Pha-ra-ôn” giữ phạm vi nghĩa có thể là cung điện, hoàng gia hoặc kho bạc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “số bạc” thay vì “tiền” để giữ hình ảnh kim loại trong nguyên văn; trật tự câu được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt.
