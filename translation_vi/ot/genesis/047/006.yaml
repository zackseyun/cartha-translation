revisions:
- from: “Đất Ai Cập đang ở trước mặt ngươi.[a] Hãy cho cha và các anh em ngươi định cư tại phần tốt nhất của xứ; họ hãy sống trong đất Gô-sen. Nếu ngươi biết trong số họ có những người có năng lực,[b] thì hãy bổ nhiệm họ làm người trông coi đàn gia súc của ta.”
  to: “Xứ Ai Cập ở trước mặt ngươi.[a] Hãy cho cha và các anh em ngươi định cư ở phần tốt nhất của xứ; hãy để họ ở trong đất Gô-sen. Nếu ngươi biết trong số họ có những người có năng lực,[b] thì hãy bổ nhiệm họ làm những người trông coi đàn gia súc của ta.”
  rationale: Chỉnh sửa hạn chế nhằm loại bỏ sắc thái tiếp diễn không có trong nguyên văn và làm câu tiếng Việt tự nhiên hơn. Không thay đổi nghĩa, mức độ chắc chắn, cách hiểu ngữ cảnh, hay vị trí các chú thích.
