  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: vi
  text: “Xứ Ai Cập ở trước mặt ngươi.[a] Hãy cho cha và các anh em ngươi định cư ở phần tốt nhất của xứ; hãy để họ ở trong đất Gô-sen. Nếu ngươi biết trong số họ có những người có năng lực,[b] thì hãy bổ nhiệm họ làm những người trông coi đàn gia súc của ta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “ở trước mặt ngươi” là một thành ngữ Hê-bơ-rơ, tại đây hàm ý rằng ngươi được tự do chọn một nơi trong xứ Ai Cập.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “những người tài giỏi”, “những người thành thạo”, hoặc sát chữ hơn là “những người có sức mạnh/khả năng”. Trong ngữ cảnh này, cụm từ không nhất thiết chỉ lòng dũng cảm trong chiến trận.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: Đất Ai Cập đang ở trước mặt ngươi
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ לְפָנֶיךָ, đồng thời chú thích hàm ý rằng xứ ấy được đặt trong phạm vi Joseph có thể lựa chọn nơi ở cho gia đình.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: tại phần tốt nhất của xứ
  rationale: מֵיטַב chỉ phần tốt nhất hoặc ưu tú nhất; thêm “phần” làm rõ rằng đây là một khu vực trong xứ.
- source_word: הוֹשֵׁב
  choice: hãy cho ... định cư
  rationale: Dạng Hiphil mệnh lệnh của ישׁב mang nghĩa khiến hoặc cho ai cư trú; cách diễn đạt này tự nhiên và giữ sắc thái sai khiến.
- source_word: יֵשְׁבוּ בְּאֶרֶץ גֹּשֶׁן
  choice: họ hãy sống trong đất Gô-sen
  rationale: Giữ động từ chỉ việc cư trú và giữ danh từ “đất” có mặt trong nguyên văn.
- source_word: וְאִם יָדַעְתָּ וְיֶשׁ בָּם
  choice: Nếu ngươi biết trong số họ có
  rationale: Phản ánh trực tiếp cấu trúc điều kiện và căn cứ vào sự hiểu biết của Joseph.
- source_word: אַנְשֵׁי חַיִל
  choice: những người có năng lực
  rationale: Trong ngữ cảnh quản lý đàn gia súc, חַיִל nói đến khả năng, sức lực hoặc sự thành thạo, không nhất thiết mang nghĩa dũng sĩ quân sự.
- source_word: וְשַׂמְתָּם שָׂרֵי מִקְנֶה
  choice: hãy bổ nhiệm họ làm người trông coi đàn gia súc
  rationale: שׂים trong ngữ cảnh giao chức vụ được dịch là “bổ nhiệm”; שָׂרֵי diễn tả người đứng đầu hoặc giám sát, còn מִקְנֶה là gia súc.
- source_word: עַל אֲשֶׁר לִי
  choice: đàn gia súc của ta
  rationale: Cụm từ theo sát nghĩa là “trên những gì thuộc về ta”; ngữ cảnh cho thấy đối tượng là đàn gia súc của Pha-ra-ôn.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi/ta” giữ sắc thái lời của Pha-ra-ôn nói với một thuộc cấp trong bối cảnh cổ đại mà không thêm quan hệ thân tộc. Các dấu chú thích đã được đặt theo đúng nội dung: [a] cho thành ngữ “ở trước mặt”, [b] cho אַנְשֵׁי חַיִל.'
