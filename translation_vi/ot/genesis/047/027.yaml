    rationale: Động từ dạng hoàn thành trong ngữ cảnh thuật chuyện nói đến việc họ đạt được sự nắm giữ hoặc được thiết lập tại đó. Cách diễn đạt hiện tại “có đất” thiên về tình trạng sẵn có, còn “đất” thu hẹp khả năng chỉ tài sản/quyền sở hữu nói chung.
