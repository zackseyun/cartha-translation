  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc then chốt: chủ ngữ số ít “Y-sơ-ra-ên” rồi chuyển sang số nhiều cho gia đình/hậu duệ; hai địa danh và cặp động từ “sinh sôi và gia tăng” đều được chuyển tải trung thành. Tuy nhiên, “họ có đất làm sản nghiệp” biến sắc thái động từ hoàn thành của וַיֵּאָחֲזוּ (“họ có được/giành được chỗ sở hữu, được thiết lập”) thành một trạng thái sở hữu và thu hẹp “sản nghiệp/tài sản” thành riêng đất đai.'
  naturalness: “Họ đã có được sản nghiệp tại đó” tự nhiên, trang trọng vừa phải, và diễn đạt rõ hành động dẫn đến việc nắm giữ tài sản/quyền sở hữu. “Trong đất Ai Cập” phù hợp hơn “trên đất Ai Cập” trong văn xuôi hiện đại khi nói đến cư trú trong một lãnh thổ.
  terminology: Giữ “Y-sơ-ra-ên,” “Ai Cập,” “Gô-sen,” “định cư,” “sinh sôi,” và “gia tăng” là nhất quán, tự nhiên, và bảo tồn các âm hưởng thuật ngữ của sách Sáng Thế. “Sản nghiệp” phản ánh phù hợp trường nghĩa về tài sản/quyền nắm giữ mà không giải quyết dứt khoát tranh luận ngữ nghĩa của Niphal אחז.
