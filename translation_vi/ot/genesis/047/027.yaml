base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: vi
  text: Vậy, Y-sơ-ra-ên định cư trong đất Ai Cập, trong vùng đất Gô-sen; họ đã có được sản nghiệp tại đó[a], sinh sôi và gia tăng rất nhiều.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ đã ổn định tại đó”; hoặc, sát nghĩa hơn, “họ đã có chỗ nắm giữ tại đó.” Động từ Hê-bơ-rơ có thể chỉ việc có được sản nghiệp hoặc trở nên vững vàng trong vùng đất ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: định cư
  rationale: Động từ יׁשב có thể chỉ việc ở, cư ngụ hoặc định cư. Trong bối cảnh này, “định cư” diễn đạt việc cư trú ổn định, chứ không chỉ tạm trú.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Giữ nguyên tên được dùng trong tiếng Hê-bơ-rơ. Chủ ngữ số ít chỉ Gia-cốp/Y-sơ-ra-ên, rồi các động từ số nhiều nói về cả gia đình ông; cách dịch này bảo tồn sự chuyển đổi có chủ ý ấy.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trên đất Ai Cập
  rationale: Giữ danh từ “đất” để phản ánh cách diễn đạt của nguyên bản và nhấn mạnh khía cạnh lãnh thổ.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: trong vùng đất Gô-sen
  rationale: Giữ yếu tố “đất” và dùng “vùng” để diễn đạt tự nhiên rằng Gô-sen là một khu vực thuộc Ai Cập.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: họ có đất làm sản nghiệp tại đó
  rationale: Thể Niphal của אחז ở đây có thể diễn tả việc có phần đất nắm giữ hoặc được lập nghiệp vững vàng. Cách dịch chính nêu bật việc họ có đất làm sản nghiệp, đồng thời chú thích giữ lại nét nghĩa khác.
- source_word: וַיִּפְרוּ
  choice: sinh sôi
  rationale: “Sinh sôi” tự nhiên trong tiếng Việt và giữ được âm hưởng chủ đề phước lành về sự sinh sản xuyên suốt sách Sáng Thế.
- source_word: וַיִּרְבּוּ
  choice: gia tăng
  rationale: Trong cặp từ với פרה, רבה nói đến sự tăng thêm về số lượng. “Gia tăng” vừa rõ nghĩa vừa trang trọng.
- source_word: מְאֹד
  choice: rất nhiều
  rationale: Diễn đạt tự nhiên sức nhấn mạnh của trạng từ Hê-bơ-rơ mà không dùng lối văn cổ.
theological_decisions:
- issue: Ý nghĩa đại diện của tên “Y-sơ-ra-ên”
  choice: Giữ “Y-sơ-ra-ên” làm chủ ngữ số ít, sau đó dùng “họ” cho gia đình và hậu duệ của ông.
  alternative: Dịch xuyên suốt là “dân Y-sơ-ra-ên” hoặc thay “Y-sơ-ra-ên” bằng “Gia-cốp”.
  rationale: Nguyên bản bắt đầu bằng động từ số ít với tên Y-sơ-ra-ên, rồi chuyển sang các động từ số nhiều. Giữ sự chuyển đổi này bảo tồn cách vị tổ phụ đại diện cho cả gia đình giao ước mà không giải quyết thay cho người đọc.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu chấm phẩy duy trì mạch liên tục của câu Hê-bơ-rơ, còn đại từ “họ” giữ sự chuyển đổi từ Y-sơ-ra-ên với tư cách cá nhân sang cả gia đình ông.
