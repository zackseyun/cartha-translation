  text: וְ/לֶ֤חֶם אֵין֙ בְּ/כָל הָ/אָ֔רֶץ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב מְאֹ֑ד וַ/תֵּ֜לַהּ אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/אֶ֣רֶץ כְּנַ֔עַן מִ/פְּנֵ֖י הָ/רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: vi
  text: Khắp vùng đất không có lương thực[a], vì nạn đói rất trầm trọng; đất Ai Cập và đất Ca-na-an kiệt quệ vì nạn đói[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “bánh”; ở đây từ này có lẽ được dùng theo nghĩa rộng là lương thực nói chung.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tàn lụi” hoặc “lả đi”. Động từ Hê-bơ-rơ được dùng theo nghĩa bóng để mô tả tác động làm suy kiệt của nạn đói đối với Ai Cập và Ca-na-an.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: lương thực
  rationale: Danh từ này có nghĩa đen là “bánh”, nhưng trong bối cảnh nạn đói được dùng theo nghĩa rộng chỉ thức ăn; “lương thực” tự nhiên và phù hợp với hoàn cảnh thiếu đói.
- source_word: אֵין
  choice: không còn
  rationale: Cấu trúc phủ định hiện hữu trong mạch kể quá khứ cho biết lương thực không có; “không còn” diễn đạt tự nhiên tình trạng cạn kiệt do nạn đói.
- source_word: בְּכָל הָאָרֶץ
  choice: khắp vùng ấy
  rationale: הָאָרֶץ ở đây chỉ toàn vùng đất đang được nói đến trong ngữ cảnh, không nhất thiết là toàn thế giới. “Vùng ấy” tránh cách hiểu toàn cầu nhưng vẫn giữ nét địa lý.
- source_word: כָבֵד ... מְאֹד
  choice: rất trầm trọng
  rationale: כָבֵד theo nghĩa đen là “nặng”, nhưng khi nói về nạn đói thì chỉ mức độ khốc liệt; “rất trầm trọng” chuyển tải cả tính từ và từ tăng cường מְאֹד.
- source_word: הָרָעָב
  choice: nạn đói
  rationale: Đây là cách gọi chuẩn và tự nhiên trong tiếng Việt cho tình trạng thiếu lương thực nghiêm trọng của câu chuyện.
- source_word: וַתֵּלַהּ
  choice: kiệt quệ
  rationale: Động từ mô tả theo nghĩa bóng tình trạng suy kiệt, rã rời vì nạn đói. “Kiệt quệ” có thể áp dụng tự nhiên cho cả đất nước và dân cư của vùng đất ấy, đồng thời giữ sắc thái mạnh của nguyên văn.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: đất Ai Cập và đất Ca-na-an
  rationale: Giữ danh từ “đất” ở cả hai vế để phản ánh cấu trúc Hê-bơ-rơ và nhấn mạnh phạm vi địa lý.
- source_word: מִפְּנֵי הָרָעָב
  choice: vì nạn đói
  rationale: Cách diễn đạt nguyên nhân ngắn gọn, tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp kể súc tích của nguyên văn; không thêm từ nối thời gian không có trong nguồn. Dấu chân chú thích [a], [b] đều xuất hiện trong chính văn, trong đó [b] được đặt ngay sau mệnh đề chứa động từ cần giải thích.
