translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xứ” cho các địa danh cổ, “Giô-sép” theo cách phiên âm Kinh Thánh quen thuộc, và đại từ “ông” phù hợp khi dân chúng thưa với một quan chức có thẩm quyền.
