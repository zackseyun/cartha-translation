  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: vi
  text: 'Khi tiền bạc ở xứ Ai Cập và xứ Ca-na-an đã cạn[a], toàn thể dân Ai Cập[b] đến gặp Giô-sép và nói: “Xin cho chúng tôi lương thực[c]. Tại sao chúng tôi phải chết trước mặt ông? Vì tiền đã hết rồi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bạc đã cạn”; từ Hê-bơ-rơ כֶּסֶף có thể có nghĩa là “bạc” hoặc “tiền”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “toàn Ai Cập”.'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “bánh”; trong bối cảnh nạn đói, từ này có thể chỉ lương thực nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם
  choice: đã cạn
  rationale: Động từ תמם diễn tả sự dùng hết hoặc đi đến chỗ chấm dứt; “đã cạn” tự nhiên trong tiếng Việt và phù hợp với tiền bạc bị tiêu hết.
- source_word: הַכֶּסֶף
  choice: tiền bạc
  rationale: כֶּסֶף có thể chỉ bạc hoặc tiền; trong bối cảnh mua lương thực, nghĩa “tiền bạc” là phù hợp nhất, đồng thời vẫn gợi được nền tảng nghĩa liên quan đến bạc.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: ở xứ Ai Cập và xứ Ca-na-an
  rationale: Dù giới từ מן thường có nghĩa “từ”, trong cấu trúc này ý chính là tiền trong hai xứ đã cạn; “ở” diễn đạt tự nhiên và rõ ràng hơn trong tiếng Việt.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: toàn thể dân Ai Cập đến
  rationale: Nguyên văn là “toàn Ai Cập đến”, một cách dùng hoán dụ chỉ dân chúng Ai Cập; bản dịch làm rõ đối tượng mà vẫn giữ sắc thái tập thể.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: Xin cho chúng tôi bánh ăn
  rationale: הָבָה לָּנוּ mang ý yêu cầu “hãy cho chúng tôi”; thêm “xin” thể hiện lời khẩn cầu tự nhiên. לֶחֶם được giữ cụ thể là “bánh ăn”, nhưng có thể bao quát lương thực trong bối cảnh nạn đói.
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: Tại sao chúng tôi phải chết ngay trước mặt ông?
  rationale: Câu hỏi tu từ bày tỏ tình thế cấp bách; “ngay trước mặt ông” truyền đạt rõ נֶגְדֶּךָ là ở trước mặt hoặc trong sự hiện diện của Giô-sép.
- source_word: כִּי אָפֵס כָּסֶף
  choice: Vì tiền đã hết rồi
  rationale: אָפֵס diễn tả không còn nữa; cách nói này ngắn gọn, tự nhiên và lặp lại nguyên nhân đã nêu đầu câu.
