- from: 'Khi tiền bạc ở xứ Ai Cập và xứ Ca-na-an đã cạn[a], toàn thể dân Ai Cập[b] đến gặp Giô-sép và nói: “Xin cho chúng tôi bánh ăn[c]. Tại sao chúng tôi phải chết ngay trước mặt ông? Vì tiền đã hết rồi.”'
  to: 'Khi tiền bạc ở xứ Ai Cập và xứ Ca-na-an đã cạn[a], toàn thể dân Ai Cập[b] đến gặp Giô-sép và nói: “Xin cho chúng tôi lương thực[c]. Tại sao chúng tôi phải chết trước mặt ông? Vì tiền đã hết rồi.”'
  rationale: Sửa tối thiểu để dùng tiếng Việt hiện đại tự nhiên hơn và phản ánh phạm vi nghĩa ngữ cảnh của לֶחֶם. Chú thích tại [c] nay nêu rõ nghĩa đen “bánh”, nhờ đó không làm mất chi tiết từ vựng của nguyên văn. Đồng thời bỏ “ngay”, là sắc thái nhấn mạnh không cần thiết.
