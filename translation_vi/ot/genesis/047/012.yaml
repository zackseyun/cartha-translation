base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: vi
  text: Giô-sép cung cấp lương thực[a] cho cha mình, các anh em mình và toàn thể gia đình cha mình, tùy theo số trẻ nhỏ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bánh”. Từ Hê-bơ-rơ thường có nghĩa đen là bánh, nhưng ở đây có lẽ chỉ lương thực nói chung.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “tùy theo miệng trẻ nhỏ”, một thành ngữ có thể nói đến số lượng hoặc nhu cầu của trẻ nhỏ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: cung cấp
  rationale: Động từ כלכל ở thể piel chỉ việc nuôi dưỡng hoặc chu cấp vật chất. Trong bối cảnh nạn đói và với לֶחֶם theo sau, “cung cấp” diễn đạt tự nhiên hành động cấp lương thực.
- source_word: לֶחֶם
  choice: lương thực
  rationale: Từ này thường có nghĩa đen là “bánh”, nhưng trong bối cảnh nạn đói có nghĩa rộng hơn là thức ăn dùng để nuôi sống. “Lương thực” vừa phù hợp ngữ cảnh vừa giữ sắc thái nhu yếu phẩm.
- source_word: כָּל בֵּית אָבִיו
  choice: toàn thể gia đình cha mình
  rationale: “Nhà” ở đây chỉ đại gia đình hay cộng đồng gia thuộc, không phải tòa nhà. “Toàn thể gia đình cha mình” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: לְפִי
  choice: tùy theo số
  rationale: Cụm này có nghĩa đen liên quan đến “miệng”, nhưng được dùng theo nghĩa mức độ, tỷ lệ hoặc định lượng. “Tùy theo số” thể hiện cách phân phối theo quy mô số người mà không làm câu nặng nề.
- source_word: הַטָּף
  choice: trẻ nhỏ
  rationale: טַף chỉ trẻ nhỏ trong gia đình, đôi khi có thể mở rộng đến những người phụ thuộc. “Trẻ nhỏ” giữ nghĩa thông thường và sát nhất trong ngữ cảnh.
- source_word: אָבִיו ... אֶחָיו
  choice: cha mình, các anh em mình
  rationale: Đây là các danh từ thân tộc trực tiếp. “Các anh em” phù hợp với những người con trai của Gia-cốp đang được nhắc đến; “mình” giúp quy chiếu tự nhiên về Giô-sép.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch dùng “lương thực” theo nghĩa rộng trong bối cảnh nạn đói, đồng thời giữ cách diễn đạt về trẻ nhỏ và ghi chú tính thành ngữ, vốn có thể hàm ý số lượng hoặc nhu cầu.
