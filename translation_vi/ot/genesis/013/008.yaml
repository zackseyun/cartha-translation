  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: vi
  text: 'Áp-ram nói với Lót: “Xin đừng để xảy ra tranh chấp giữa tôi và cháu, và giữa những người chăn gia súc của tôi và những người chăn gia súc của cháu, vì chúng ta là người thân[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “chúng ta là những người anh em”; từ “anh em” ở đây có thể chỉ những người bà con, không nhất thiết là con cùng cha mẹ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Áp-ram nói
  rationale: Động từ với waw liên tiếp tiếp diễn mạch kể. Trong tiếng Việt, trật tự kể chuyện đã biểu đạt diễn tiến tự nhiên nên không cần thêm một liên từ máy móc.
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: Xin đừng để xảy ra tranh chấp
  rationale: “Xin” chuyển tải sắc thái nhã nhặn của נָא; “đừng để xảy ra” thể hiện lời yêu cầu phủ định, còn “tranh chấp” bao quát sự bất hòa giữa cả hai chủ và những người chăn.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: giữa tôi và cháu
  rationale: Giữ cấu trúc đối xứng “giữa... và...” của nguyên văn. Dùng “cháu” vì Lót là cháu của Áp-ram, tạo cách xưng hô tự nhiên trong tiếng Việt mà không biến אַחִים thành quan hệ anh em ruột.
- source_word: רֹעַי ... רֹעֶיךָ
  choice: những người chăn gia súc của tôi ... những người chăn gia súc của cháu
  rationale: Phân từ từ רעה chỉ những người chăm nom vật nuôi; “người chăn gia súc” phù hợp với bối cảnh có nhiều loại đàn vật hơn “người chăn chiên”.
- source_word: כִּי
  choice: vì
  rationale: Biểu đạt trực tiếp quan hệ lý do cho lời đề nghị của Áp-ram.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: chúng ta là người thân
  rationale: Cụm Hê-bơ-rơ nhấn mạnh quan hệ họ hàng. Vì Áp-ram là bác/chú của Lót chứ không phải anh em ruột, “người thân” truyền đạt đúng nghĩa trong ngữ cảnh và tự nhiên hơn việc giữ cả “những người đàn ông” lẫn “anh em” một cách gượng ép.
theological_decisions:
- issue: Nghĩa của אַחִים trong quan hệ giữa Áp-ram và Lót
  choice: người thân
  alternative: anh em; bà con thân thuộc
  rationale: אַחִים theo nghĩa đen là “anh em” nhưng có thể chỉ quan hệ họ hàng rộng hơn. Ngữ cảnh gia phả xác định Lót là cháu của Áp-ram, vì vậy “người thân” tránh gợi sai rằng họ là anh em ruột, trong khi chú thích vẫn bảo tồn cách nói cụ thể của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cách xưng hô “tôi—cháu” phản ánh quan hệ bác/chú với cháu trong tiếng Việt; “chúng ta” nhấn mạnh mối liên hệ chung. Dùng “hay” ở vế thứ hai để lời yêu cầu tự nhiên, đồng thời vẫn giữ hai cặp quan hệ song song của nguyên văn.
