  source_fidelity: Bản dịch truyền đạt đúng lời thỉnh cầu lịch sự của Áp-ram, hai phạm vi tranh chấp, và lý do dựa trên quan hệ thân thuộc. “Người thân” là cách chuyển ngữ phù hợp cho אֲנָשִׁים אַחִים trong ngữ cảnh Áp-ram là cậu/chú/bác của Lót; chú thích bảo lưu cách nói “anh em” của tiếng Hê-bơ-rơ.
  naturalness: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Tuy nhiên, “hay giữa” có thể gợi một lựa chọn thay thế trong tiếng Việt, trong khi nguyên văn nối cả hai phạm vi bằng “và”. Đổi thành “và giữa” vừa tự nhiên vừa phản ánh cấu trúc song hành của câu nguồn.
  terminology: Tên riêng “Áp-ram,” “Lót,” thuật ngữ “tranh chấp,” và “người chăn gia súc” đều nhất quán, dễ hiểu, và phù hợp ngữ cảnh. Cách xưng hô “tôi—cháu” là tự nhiên theo quan hệ thế hệ trong văn cảnh và không làm thay đổi nghĩa căn bản.
  issues:
