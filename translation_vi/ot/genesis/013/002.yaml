  yaml_path: translation/ot/genesis/013/002.yaml
  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: vi
  text: Áp-ram rất giàu có, có nhiều gia súc, bạc và vàng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Áp-ram
  rationale: Tên riêng được phiên âm theo cách quen thuộc trong tiếng Việt. Liên từ וְ nối câu với mạch kể trước đó nhưng không nhất thiết phải biểu đạt bằng “và” ở đầu câu tiếng Việt.
- source_word: כָּבֵד מְאֹד
  choice: rất giàu có
  rationale: כָּבֵד theo nghĩa đen là “nặng”, nhưng khi đi với các loại tài sản thì mang nghĩa thành ngữ là giàu có; מְאֹד được diễn đạt tự nhiên bằng “rất”.
- source_word: בַּ/מִּקְנֶה
  choice: có nhiều gia súc
  rationale: מִקְנֶה ở bối cảnh này chỉ đàn vật nuôi như một loại tài sản. Thêm “có nhiều” giúp tiếng Việt diễn đạt tự nhiên phạm vi sự giàu có được đánh dấu bằng בְּ.
- source_word: בַּ/כֶּסֶף
  choice: bạc
  rationale: כֶּסֶף ở đây là bạc, được liệt kê như một dạng của cải.
- source_word: וּ/בַ/זָּהָב
  choice: và vàng
  rationale: Giữ liên từ nối mục cuối trong danh sách tài sản; זָהָב có nghĩa là vàng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “rất giàu có, có nhiều…” tránh cách nói thiếu tự nhiên “giàu về gia súc” mà vẫn giữ đủ ba loại tài sản trong nguyên văn.
