base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/006.yaml
  text: And the land could not support them living together, because their possessions were too great for them to live together.
translation:
  language: vi
  text: Đất không đủ để họ cùng ở với nhau, vì tài sản của họ quá nhiều nên họ không thể cùng ở với nhau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא
  choice: đủ sức nuôi
  rationale: Động từ theo nghĩa đen là “mang, gánh”; khi chủ ngữ là đất đai, cách diễn đạt này tự nhiên truyền đạt ý vùng đất không đủ khả năng duy trì cả hai nhóm cùng sinh sống.
- source_word: לָשֶׁבֶת יַחְדָּו
  choice: cùng sống một nơi / sống chung với nhau
  rationale: יָשַׁב có thể là ngồi, cư trú hay sinh sống; trong văn cảnh chăn nuôi và đất đai, nghĩa phù hợp là cùng cư trú trong một khu vực.
- source_word: רְכוּשָׁם רָב
  choice: tài sản của họ quá nhiều
  rationale: רְכוּשׁ chỉ tài sản, của cải tích lũy; רָב diễn tả số lượng lớn. “Quá nhiều” thể hiện hệ quả được nêu ngay sau đó mà không thêm nguyên nhân ngoài văn bản.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc nhân quả và sự lặp lại có chủ ý của “cùng sống/sống chung” trong nguyên văn, nhưng diễn đạt hai vế hơi khác nhau để câu tiếng Việt tự nhiên.
