base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: vi
  text: Ông đi từng chặng[a] từ Nê-ghép đến tận Bê-tên, đến nơi trước kia có lều của ông lúc đầu, giữa Bê-tên và A-hi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo các chặng hành trình của mình,” tức là lần lượt di chuyển từ nơi đóng trại này sang nơi đóng trại khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Ông đi
  rationale: Động từ הלך có nghĩa thông dụng là “đi”; trong ngữ cảnh hành trình, cách dịch ngắn gọn này tự nhiên và không thêm sắc thái ngoài bản nguồn.
- source_word: לְמַסָּעָיו
  choice: từng chặng
  rationale: Danh từ מַסָּע chỉ chặng đường gắn với việc nhổ trại; dạng số nhiều với ל diễn tả hành trình qua nhiều chặng liên tiếp.
- source_word: מִנֶּגֶב
  choice: từ Nê-ghép
  rationale: Trong bối cảnh địa lý của trình thuật, נֶגֶב chỉ vùng Nê-ghép hơn là hướng nam nói chung.
- source_word: וְעַד בֵּית אֵל
  choice: đến tận Bê-tên
  rationale: עַד diễn tả giới hạn hoặc điểm cuối của hành trình; “đến tận” chuyển tải rõ sắc thái ấy.
- source_word: עַד הַמָּקוֹם
  choice: đến nơi
  rationale: עַד thứ hai xác định cụ thể hơn địa điểm đến; tiếng Việt tự nhiên không cần lặp lại “đến tận”.
- source_word: אֲשֶׁר הָיָה שָׁם אָהֳלֹה
  choice: nơi lều ông đã dựng
  rationale: Nguyên văn nói lều của ông từng ở đó. “Lều ông đã dựng” là cách diễn đạt tự nhiên trong tiếng Việt, làm rõ việc đóng trại mà không thay đổi ý chính.
- source_word: בַּתְּחִלָּה
  choice: lúc ban đầu
  rationale: Cụm từ này hồi chỉ địa điểm đóng trại trước đó của Áp-ram trong trình thuật.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: giữa Bê-tên và A-hi
  rationale: Cấu trúc בֵּין ... וּבֵין xác định vị trí giữa hai địa danh; mạo từ trong הָעָי không cần thể hiện riêng trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Dùng các dạng địa danh quen thuộc trong tiếng Việt: Nê-ghép, Bê-tên và A-hi. Đại từ “ông” nối tiếp chủ thể Áp-ram từ văn mạch.'
