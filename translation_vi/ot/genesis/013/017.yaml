language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: vi
  text: Hãy đứng dậy, đi khắp xứ theo chiều dài và chiều rộng của nó, vì Ta sẽ ban xứ ấy cho con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּם
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh của קום, diễn tả việc đứng lên để bắt đầu hành động; cách nói tự nhiên, trực tiếp trong tiếng Việt hiện đại.
- source_word: הִתְהַלֵּ֣ךְ
  choice: đi khắp
  rationale: Dạng Hitpael mệnh lệnh của הלך chỉ sự đi lại, đi quanh hoặc đi xuyên qua một khu vực; “đi khắp” truyền đạt việc đi trong toàn phạm vi xứ mà không hàm ý kỹ thuật quá mức.
- source_word: בָּאָרֶץ
  choice: xứ
  rationale: אֶרֶץ trong ngữ cảnh này là vùng đất cụ thể Đức Chúa Trời chỉ cho Áp-ram, nên “xứ” phù hợp hơn nghĩa chung là “đất” hay “trái đất”.
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: theo chiều dài và chiều rộng của nó
  rationale: Giữ cặp danh từ chỉ toàn bộ phạm vi của xứ và phản ánh hai giới từ לְ trong cấu trúc Hê-bơ-rơ, đồng thời tự nhiên trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho mệnh lệnh đi khắp xứ.
- source_word: לְךָ
  choice: cho con
  rationale: Đánh dấu người nhận. “Con” phù hợp với lời Đức Chúa Trời trực tiếp phán cùng Áp-ram trong văn phong Kinh Thánh trang trọng nhưng dễ hiểu.
- source_word: אֶתְּנֶנָּה
  choice: Ta sẽ ban xứ ấy
  rationale: Dạng chưa hoàn thành ngôi thứ nhất số ít của נתן mang ý nghĩa lời hứa tương lai; hậu tố giống cái số ít quy chiếu về אֶרֶץ. Lặp “xứ ấy” thay cho “nó” giúp tiếng Việt rõ và trang trọng.
theological_decisions:
- issue: Đối tượng của hậu tố giống cái trong אֶתְּנֶנָּה
  choice: “xứ ấy” — quy chiếu về אֶרֶץ
  alternative: “nó”
  rationale: Hậu tố giống cái số ít quy chiếu tự nhiên về “xứ”; diễn đạt rõ đối tượng của lời hứa mà không thêm nội dung thần học ngoài câu.
- issue: Sắc thái thời của אֶתְּנֶנָּה
  choice: “sẽ ban”
  alternative: “đang ban” hoặc “ban”
  rationale: Trong ngữ cảnh lời hứa, dạng chưa hoàn thành phù hợp nhất với hành động được cam kết cho tương lai; vẫn giữ nguyên độ căng giữa lời hứa và sự sở hữu chưa hoàn tất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Đại từ “Ta–con” thể hiện lời Đức Chúa Trời phán trực tiếp với Áp-ram mà không dùng lối cổ quá mức. Không cần chú thích vì các nét nghĩa chính có thể được thể hiện rõ trong chính văn.
