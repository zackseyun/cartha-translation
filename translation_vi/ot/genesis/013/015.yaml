  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: vi
  text: Vì tất cả đất đai mà con thấy, Ta sẽ ban cho con và dòng dõi[a] của con mãi mãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hạt giống của con”, “con cháu của con” hoặc “hậu duệ của con”. Từ Hê-bơ-rơ זֶרַע là một danh từ tập hợp, có thể mang các nghĩa này.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng liên kết, đưa ra lời giải thích cho mệnh lệnh nhìn khắp đất ở câu trước; tiếng Việt tự nhiên dùng “Vì”.
- source_word: כָּל הָאָרֶץ
  choice: toàn bộ miền đất
  rationale: Diễn đạt trọn vẹn phạm vi của כָּל với אֶרֶץ; “miền đất” phù hợp với vùng đất đang ở trong tầm mắt.
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: con đang thấy
  rationale: Thể phân từ diễn tả điều Áp-ram hiện nhìn thấy; “đang thấy” tự nhiên và làm rõ bối cảnh hiện tại.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: Ta sẽ ban cho con
  rationale: Dạng vị lai ở đây diễn tả lời hứa; “ban” giữ sắc thái trang trọng tự nhiên của lời Đức Chúa Trời mà không thêm ý nghĩa ngoài bản văn.
- source_word: וּלְזַרְעֲךָ
  choice: và dòng dõi con
  rationale: זֶרַע là danh từ tập hợp, có thể chỉ hạt giống, con cháu hoặc hậu duệ. “Dòng dõi” tự nhiên trong tiếng Việt và giữ được nghĩa tập hợp mà không ấn định một cá nhân hay số lượng cụ thể.
- source_word: עַד עוֹלָם
  choice: mãi mãi
  rationale: Giữ sức nặng về thời gian lâu dài hoặc vĩnh viễn của cụm Hê-bơ-rơ trong lời hứa, đồng thời không áp đặt một hệ thống giải nghĩa giao ước cụ thể.
theological_decisions:
- issue: Thời hạn của lời hứa ban đất trong cụm עַד עוֹלָם
  choice: mãi mãi
  alternative: đến muôn đời; vĩnh viễn; cho một thời đại
  rationale: “Mãi mãi” phản ánh nghĩa thông thường của cụm từ trong ngữ cảnh lời hứa và giữ nguyên sức căng thần học về cách lời hứa được ứng nghiệm, thay vì giải quyết điều đó ngay trong bản dịch.
- issue: Phạm vi quy chiếu của זֶרַע
  choice: dòng dõi
  alternative: hạt giống; con cháu; hậu duệ
  rationale: Bản dịch giữ tính tập hợp và sự linh hoạt của từ Hê-bơ-rơ, không thu hẹp trước thành một hậu duệ đơn lẻ hoặc một số nhiều được xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ta–con” thể hiện lời Đức Chúa Trời phán trực tiếp với Áp-ram. Dấu chú thích [a] được đặt sau toàn bộ mệnh đề có từ “dòng dõi” để tránh làm gián đoạn câu.
