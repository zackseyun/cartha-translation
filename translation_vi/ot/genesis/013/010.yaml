  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: Lót nhìn lên, toàn vùng đồng bằng Giô-đanh, tình trạng nhiều nước, mốc thời gian trước cuộc hủy diệt Sô-đôm và Gô-mô-rơ, cùng hai phép so sánh. Tuy nhiên, việc tách câu hiện tại khiến cụm “Trước khi Yahweh hủy diệt...” dễ bổ nghĩa riêng cho mệnh đề “vùng ấy giống như...”, thay vì bao quát toàn bộ tình trạng được mô tả của vùng đất như trong tiếng Hê-bơ-rơ.'
