base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: vi
  text: Lót ngước mắt lên và thấy toàn vùng đồng bằng sông Giô-đanh[a]—trước khi Yahweh hủy diệt Sô-đôm và Gô-mô-rơ—được tưới nước dồi dào, giống như vườn của Yahweh[b], như đất Ai Cập, về hướng Xô-a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn thung lũng sông Giô-đanh”; sát chữ: “toàn vùng tròn của sông Giô-đanh”.'
    reason: lexical_alternative
  - marker: b
    text: “Vườn của Yahweh” có lẽ gợi đến sự xanh tốt của vườn Ê-đen.
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể dịch: “khi đi đến Xô-a”. Cụm từ Hê-bơ-rơ này chỉ hướng về phía Xô-a.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: ngước mắt lên
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ chỉ việc hướng mắt nhìn lên, đồng thời giữ sắc thái kể chuyện của nguyên văn.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: toàn vùng đồng bằng sông Giô-đanh
  rationale: כִּכָּר ở đây chỉ vùng đất bằng thuộc lưu vực Giô-đanh; thêm “sông” giúp địa danh rõ ràng và tự nhiên trong tiếng Việt.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: đều được tưới nước dồi dào
  rationale: Chuyển tải ý cả vùng có nguồn nước phong phú hoặc được tưới đầy đủ mà không khẳng định quá mức cơ chế tưới tiêu.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: Trước khi Yahweh hủy diệt
  rationale: לִפְנֵי mang nghĩa thời gian, còn שׁחת trong văn cảnh nói đến sự hủy diệt các thành.
- source_word: כְּגַן יְהוָה
  choice: giống như vườn của Yahweh
  rationale: Giữ phép so sánh và âm hưởng liên văn bản gợi đến khu vườn Ê-đen.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: như đất Ai Cập
  rationale: Giữ danh từ אֶרֶץ và nét so sánh về một vùng đất màu mỡ, nhiều nước.
- source_word: בֹּאֲכָה צֹעַר
  choice: về phía Xô-a
  rationale: Diễn đạt chức năng chỉ phương hướng của thành ngữ Hê-bơ-rơ, tránh biến đại từ ngôi hai mang tính quy ước thành lời nói trực tiếp.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh thánh gồm bốn phụ âm; phiên âm “Yahweh” bảo tồn đây là danh riêng thay vì thay bằng một tước hiệu, nhưng không gắn cách đọc này với một lập trường hệ phái.
- issue: Sự gợi nhắc đến Ê-đen trong כְּגַן יְהוָה
  choice: giữ nguyên “vườn của Yahweh” và giải thích bằng chú thích
  alternative: dịch thẳng là “vườn Ê-đen”
  rationale: Nguyên văn không ghi tên Ê-đen tại đây; bản dịch giữ cách nói thực tế của câu và chỉ nêu sự gợi nhắc có khả năng xảy ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tách thành hai câu để tránh một câu tiếng Việt quá dài, nhưng vẫn giữ quan hệ thời gian và hai phép so sánh của nguyên văn. Dùng các dạng địa danh quen thuộc trong truyền thống phiên âm Kinh Thánh tiếng Việt.
