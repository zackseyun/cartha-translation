base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: vi
  text: Toàn bộ vùng đất chẳng ở trước mặt cháu sao? Xin cháu hãy tách ra khỏi ta. Nếu cháu đi về bên trái[a], ta sẽ đi về bên phải; còn nếu cháu đi về bên phải, ta sẽ đi về bên trái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ tỉnh lược động từ trong hai mệnh đề điều kiện, sát nghĩa là: “Nếu bên trái, thì ta sẽ đi về bên phải; còn nếu bên phải, thì ta sẽ đi về bên trái.” Bản dịch thêm “cháu đi về” để câu tiếng Việt rõ nghĩa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Chẳng phải ... sao?
  rationale: Diễn đạt tự nhiên trong tiếng Việt một câu hỏi tu từ mong đợi sự đồng tình.
- source_word: כָל הָאָרֶץ
  choice: cả vùng đất
  rationale: Trong ngữ cảnh, אֶרֶץ chỉ toàn bộ vùng đất đang có trước mặt để hai bên chọn nơi cư trú, không phải toàn thể trái đất.
- source_word: לְפָנֶיךָ
  choice: ở trước mặt cháu
  rationale: Giữ hình ảnh không gian của thành ngữ Hê-bơ-rơ, đồng thời hàm ý vùng đất đang rộng mở để Lót lựa chọn.
- source_word: הִפָּרֶד נָא מֵעָלָי
  choice: Xin cháu hãy tách khỏi bác
  rationale: Động từ mệnh lệnh dạng Niphal được dịch trực tiếp là “tách khỏi”; “xin ... hãy” chuyển tải sắc thái đề nghị lịch sự của נָא. Cặp đại từ bác–cháu phù hợp quan hệ gia đình giữa Áp-ram và Lót trong ngữ cảnh.
- source_word: אִם הַשְּׂמֹאל
  choice: Nếu cháu đi về bên trái
  rationale: Nguyên văn tỉnh lược động từ; thêm “đi về” là phần bổ sung tối thiểu cần thiết để câu tiếng Việt rõ và tự nhiên.
- source_word: וְאֵימִנָה
  choice: bác sẽ đi về bên phải
  rationale: Dạng chỉ hướng từ ימין diễn tả chuyển động sang phía phải; “sẽ đi về” làm rõ hành động tương ứng của Áp-ram.
- source_word: וְאִם הַיָּמִין ... וְאַשְׂמְאִילָה
  choice: còn nếu cháu đi về bên phải, bác sẽ đi về bên trái
  rationale: “Còn nếu” thể hiện vế lựa chọn tương phản; cấu trúc song song giữ sự cân đối trong lời đề nghị của Áp-ram.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp xưng hô “bác–cháu” thể hiện quan hệ chú/bác với cháu giữa Áp-ram và Lót mà không dùng lối xưng hô cổ; câu hỏi tu từ và kết cấu đối xứng của nguyên văn được giữ lại.
