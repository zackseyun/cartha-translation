source:
  edition: WLC
  text: אֶל מְקוֹם֙ הַ/מִּזְבֵּ֔חַ אֲשֶׁר עָ֥שָׂה שָׁ֖ם בָּ/רִאשֹׁנָ֑ה וַ/יִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: vi
  text: đến chỗ bàn thờ mà trước kia ông đã dựng tại đó. Tại đó, Áp-ram kêu cầu danh Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “YHWH”; cũng được phiên là “Giê-hô-va”, và theo truyền thống thường được dịch là “CHÚA”. Thành ngữ “kêu cầu danh Yahweh” cũng có thể hàm ý “công bố danh Yahweh” hoặc “khẩn cầu Yahweh bằng danh Ngài”.'
    reason: Nêu dạng Hê-bơ-rơ của danh thần thánh, các cách thể hiện thay thế, và bảo tồn sắc thái mở của thành ngữ קרא בשם יהוה.
lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: nơi có bàn thờ
  rationale: Diễn đạt tự nhiên trong tiếng Việt, chỉ địa điểm của bàn thờ đã được nhắc đến trước đó.
- source_word: אֲשֶׁר עָשָׂה שָׁם בָּרִאשֹׁנָה
  choice: mà lúc đầu ông đã lập tại đó
  rationale: Dùng “đã lập” cho việc dựng bàn thờ, vừa tự nhiên vừa thể hiện hành động xảy ra trước lúc Áp-ram trở lại; “lúc đầu” giữ ý thời gian của בָּרִאשֹׁנָה.
- source_word: שָׁם ... שָׁם
  choice: tại đó ... Tại đó
  rationale: Giữ sự lặp lại có chủ ý của trạng từ chỉ nơi chốn trong tiếng Hê-bơ-rơ.
- source_word: וַיִּקְרָא ... בְּשֵׁם יְהוָה
  choice: kêu cầu danh Đức Giê-hô-va
  rationale: “Kêu cầu danh” là thành ngữ tiếng Việt trang trọng, giữ trọng tâm về sự khẩn cầu/thờ phượng mà không thu hẹp hoàn toàn sắc thái công bố có thể có của thành ngữ Hê-bơ-rơ.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng theo cách quen thuộc và dễ đọc trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng của YHWH đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt; chú thích nêu rõ nguyên dạng và các cách thể hiện khác.
theological_decisions:
- issue: Cách dịch danh thần thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản văn ghi trực tiếp danh YHWH. Bản dịch chính giữ một dạng tên riêng quen thuộc trong tiếng Việt thay vì chỉ thay bằng tước hiệu, đồng thời chú thích các cách thể hiện phổ biến khác.
- issue: Sắc thái của thành ngữ קרא בשם יהוה
  choice: kêu cầu danh Đức Giê-hô-va
  alternative: công bố danh Đức Giê-hô-va; khẩn cầu Đức Giê-hô-va bằng danh Ngài
  rationale: Thành ngữ có thể bao hàm sự khẩn cầu, thờ phượng và công bố. “Kêu cầu danh” giữ được độ rộng thần học tốt hơn, còn chú thích bảo tồn khả năng hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc nối tiếp của câu trong ngữ cảnh, sự lặp lại “tại đó”, cùng độ mở của thành ngữ thờ phượng trong nguyên văn.
