id: GEN.13.16
reference: Genesis 13:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: vi
  text: Ta sẽ làm cho dòng dõi con đông như bụi đất[a], đến nỗi nếu một người[b] có thể đếm được bụi đất thì dòng dõi con cũng có thể đếm được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “như bụi đất”. Từ “đông” làm rõ phương diện số lượng được hàm ý qua việc đếm trong phần sau của câu.
    reason: implicit_comparison
  - marker: b
    text: Hay “ai”. Từ Hê-bơ-rơ אִישׁ có hình thức giống đực số ít nhưng ở đây mang nghĩa khái quát.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Ta sẽ làm cho
  rationale: Động từ שׂוּם có nghĩa cơ bản là “đặt, để”, nhưng với tân ngữ là dòng dõi và theo sau là phép so sánh, cụm này tự nhiên mang nghĩa “làm cho, khiến cho”.
- source_word: זַרְעֲךָ
  choice: dòng dõi con
  rationale: זֶרַע là danh từ tập hợp, ở đây chỉ hậu duệ của Áp-ram. “Dòng dõi” tự nhiên trong tiếng Việt, vừa diễn đạt nhiều thế hệ vừa không biến danh từ tập hợp thành một cá nhân riêng lẻ.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: đông như bụi đất
  rationale: Nguyên văn là “như bụi của đất”. Trong ngữ cảnh đếm được hay không đếm được, thêm “đông” làm rõ phương diện so sánh vốn hàm chứa trong tiếng Hê-bơ-rơ và tạo câu tiếng Việt tự nhiên.
- source_word: אֲשֶׁר אִם
  choice: đến nỗi nếu
  rationale: Cụm này mở đầu mệnh đề nêu hệ quả và điều kiện giả định. “Đến nỗi nếu” giữ được mối liên hệ giữa lời hứa về số lượng và hình ảnh bụi đất không thể đếm xuể.
- source_word: אִישׁ
  choice: một người
  rationale: אִישׁ là danh từ giống đực số ít nhưng được dùng với nghĩa khái quát. “Một người” giữ hình thức số ít của nguyên văn; chú thích nêu cách dịch tự nhiên hơn là “ai”.
- source_word: לִמְנוֹת ... יִמָּנֶה
  choice: có thể đếm được ... cũng có thể đếm được
  rationale: מנה ở đây nói đến việc đếm hay liệt kê. Thể bị động trong vế sau và cấu trúc điều kiện giả định được diễn đạt nhất quán bằng “có thể đếm được”.
theological_decisions:
- issue: Cách dịch danh từ tập hợp זֶרַע trong lời hứa dành cho Áp-ram
  choice: dòng dõi con
  alternative: hạt giống của con; hậu duệ của con
  rationale: Câu này nói về toàn thể hậu thế đông vô số của Áp-ram. “Dòng dõi” giữ được sắc thái tập hợp mà không áp đặt cách hiểu chỉ về một cá nhân hay một cách diễn giải thần học riêng.
- issue: Ngôn ngữ giống đực mang nghĩa khái quát trong אִישׁ
  choice: một người
  alternative: ai; bất cứ ai
  rationale: Bản dịch chính giữ danh từ số ít chỉ người tương ứng với hình thức của nguyên văn, đồng thời chú thích cho biết từ này có nghĩa khái quát chứ không giới hạn khả năng đếm cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” và “con” phù hợp với lời Đức Chúa Trời trực tiếp phán với Áp-ram. Cấu trúc “đến nỗi nếu… thì…” giữ sắc thái giả định nhằm nhấn mạnh số lượng không thể đếm xuể.
