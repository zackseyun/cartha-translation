  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: vi
  text: Có sự tranh chấp giữa những người chăn gia súc của Áp-ram và những người chăn gia súc của Lót. Lúc ấy, dân Ca-na-an và dân Phê-rê-xít đang cư ngụ trong xứ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng danh xưng dân tộc ở dạng số ít với nghĩa tập thể, sát nghĩa là “người Ca-na-an và người Phê-rê-xít”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Bấy giờ xảy ra
  rationale: Cụm này dẫn vào một diễn biến trong câu chuyện, đồng thời diễn đạt tự nhiên ý hiện hữu/phát sinh của động từ היה trong tiếng Việt.
- source_word: רִיב
  choice: tranh chấp
  rationale: Danh từ chỉ sự bất hòa hoặc tranh cãi giữa hai nhóm; “tranh chấp” trang trọng, dễ hiểu và phù hợp với bối cảnh quyền sử dụng đồng cỏ, nguồn nước.
- source_word: רֹעֵי מִקְנֵה
  choice: những người chăn gia súc
  rationale: מִקְנֶה bao gồm các loại súc vật nuôi theo đàn, nên “gia súc” rộng hơn “chiên”; רֹעֵי chỉ những người trông coi và chăn dắt chúng.
- source_word: בֵּין ... וּבֵין
  choice: giữa ... và
  rationale: Giữ rõ cấu trúc song phương của cuộc tranh chấp.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: dân Ca-na-an và dân Phê-rê-xít
  rationale: Hai danh xưng dân tộc ở dạng số ít trong tiếng Hê-bơ-rơ nhưng được dùng với nghĩa tập thể; “dân” diễn đạt nghĩa ấy tự nhiên trong tiếng Việt.
- source_word: אָז יֹשֵׁב
  choice: Lúc ấy ... đang cư ngụ
  rationale: “Lúc ấy” định vị thời gian, còn “đang cư ngụ” giữ sắc thái tiếp diễn của phân từ יֹשֵׁב.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: “Xứ” là cách diễn đạt trang trọng, tự nhiên trong văn mạch Sáng Thế Ký và giữ được sắc thái địa lý có thể gắn với chủ đề đất đai.
theological_decisions:
- issue: Sắc thái giao ước có thể có của הָאָרֶץ
  choice: trong xứ
  alternative: trong vùng đất ấy
  rationale: “Xứ” không thêm ý thần học vào câu, nhưng tránh làm mờ sự cộng hưởng của chủ đề đất đai xuyên suốt Sáng Thế Ký.
- issue: Dạng số ít của các danh xưng dân tộc
  choice: dân Ca-na-an và dân Phê-rê-xít
  alternative: người Ca-na-an và người Phê-rê-xít
  rationale: Văn cảnh nói đến hai cộng đồng đang cư ngụ trong xứ; dùng “dân” thể hiện nghĩa tập thể mà không biến câu thành lời nói về chỉ hai cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt; câu giữ nhịp kể chuyện ngắn gọn và không giải thích thêm nguyên nhân cuộc tranh chấp.
