  to: Có sự tranh chấp giữa những người chăn gia súc của Áp-ram và những người chăn gia súc của Lót. Lúc ấy, dân Ca-na-an và dân Phê-rê-xít đang cư ngụ trong xứ.[a]
  rationale: Chỉ sửa câu mở đầu từ “Bấy giờ xảy ra tranh chấp” thành “Có sự tranh chấp” để phản ánh trực tiếp hơn cách dùng tồn tại của וַיְהִי và để dành “Lúc ấy” cho אָז. Các lựa chọn từ vựng còn lại và chú thích đều phù hợp với nguyên văn và với lối diễn đạt Việt ngữ hiện đại.
