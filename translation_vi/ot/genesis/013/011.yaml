base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: vi
  text: Vậy Lót chọn cho mình toàn vùng đồng bằng sông Giô-đanh, rồi Lót lên đường về phía đông[a]; hai người tách khỏi nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ phía đông.” Cụm từ Hê-bơ-rơ có thể chỉ hướng di chuyển hoặc nơi xuất phát.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: chọn cho mình
  rationale: Giữ cả nghĩa của động từ בחר là “chọn” và sắc thái vị lợi của לוֹ, nhấn mạnh đây là lựa chọn của Lót cho chính mình.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: toàn vùng đồng bằng sông Giô-đanh
  rationale: כִּכָּר chỉ vùng đất bằng bao quanh lưu vực; “vùng đồng bằng sông Giô-đanh” tự nhiên trong tiếng Việt và rõ hơn cách dịch sát chữ là “vòng tròn”.
- source_word: וַיִּסַּע
  choice: đi
  rationale: נסע thường chỉ việc nhổ trại lên đường. Trong câu tiếng Việt, “đi về phía đông” diễn đạt tự nhiên chuyển động của Lót mà không thêm chi tiết không có trong bản văn.
- source_word: מִקֶּדֶם
  choice: về phía đông
  rationale: Chọn cách hiểu theo hướng di chuyển, phù hợp nhất với mạch truyện; cách hiểu “từ phía đông” vẫn được giữ trong chú thích vì hình thức Hê-bơ-rơ có thể mang cả hai nghĩa.
- source_word: וַיִּפָּרְדוּ אִישׁ מֵעַל אָחִיו
  choice: Hai người chia tay nhau
  rationale: Diễn đạt tự nhiên ý nghĩa tương hỗ của động từ Niphal và cấu trúc phân phối “người này khỏi người anh em mình”; “hai người” xác định rõ Áp-ram và Lót, còn “nhau” tránh lối dịch gượng trong tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ thân tộc trong אִישׁ מֵעַל אָחִיו
  choice: Hai người chia tay nhau
  alternative: mỗi người lìa khỏi người anh em mình
  rationale: אָחִיו theo nghĩa đen là “anh/em của mình”, nhưng cả cụm là thành ngữ phân phối chỉ sự tách rời giữa hai người. Bản chính ưu tiên tiếng Việt tự nhiên, không suy diễn quan hệ anh em ruột; sắc thái thân tộc không tạo khác biệt thần học trong ngữ cảnh này.
- issue: Tính mơ hồ về phương hướng của מִקֶּדֶם
  choice: về phía đông
  alternative: từ phía đông
  rationale: Mạch địa lý của câu thuận hơn với hướng đi về phía đông, nhưng không loại bỏ khả năng cụm từ chỉ điểm xuất phát; vì vậy phương án kia được ghi rõ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng tên riêng “Lót” và “Giô-đanh” theo dạng quen thuộc trong tiếng Việt; tránh cấu trúc dịch sát gây gượng như “mỗi người khỏi anh em mình”.
