  source_fidelity: Bản dịch chuyển đạt đúng lựa chọn của Lót, toàn bộ vùng đồng bằng sông Giô-đanh, và tính mơ hồ của מִקֶּדֶם qua chú thích. Tuy nhiên, “đi” làm nhẹ sắc thái נסע (“nhổ trại/lên đường”), còn “chia tay nhau” trong tiếng Việt hiện đại có thể gợi sự chia tay xã giao hay tình cảm hơn là sự tách ra về nơi ở/hành trình trong văn cảnh.
