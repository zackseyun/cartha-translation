  terminology: “Lót” và “Giô-đanh” nhất quán với dạng tên quen dùng trong tiếng Việt. “Vùng đồng bằng sông Giô-đanh” diễn đạt phù hợp cho כִּכַּר הַיַּרְדֵּן. Không cần ép cấu trúc “mỗi người khỏi anh em mình” vốn gượng trong tiếng Việt; “hai người tách khỏi nhau” giữ ý tương hỗ của động từ.
