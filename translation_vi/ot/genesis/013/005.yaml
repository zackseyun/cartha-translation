  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: vi
  text: Lót, người đi cùng Áp-ram, cũng có các đàn chiên dê[a], các đàn bò và lều trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này chỉ chung các gia súc nhỏ, đặc biệt là chiên và dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: cũng
  rationale: 'Giữ sắc thái bổ sung: Lót cũng có tài sản như Áp-ram; trong tiếng Việt, đặt “cũng” trước động từ là tự nhiên, còn liên từ וְ không nhất thiết phải dịch riêng ở đầu câu.'
- source_word: לְלוֹט ... הָיָה
  choice: Lót ... có
  rationale: Đây là cấu trúc tồn tại với לְ chỉ người sở hữu, được diễn đạt tự nhiên trong tiếng Việt bằng “có”.
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: người đi cùng Áp-ram
  rationale: Phân từ xác định Lót là người đồng hành với Áp-ram; “đi cùng” giữ được ý nghĩa đồng hành mà không làm câu nặng nề.
- source_word: צֹאן
  choice: các đàn chiên dê
  rationale: Danh từ tập hợp chỉ gia súc nhỏ, đặc biệt là chiên và dê; cách dịch này cụ thể và dễ hiểu hơn chỉ nói “bầy đàn”.
- source_word: וּבָקָר
  choice: các đàn bò
  rationale: בָּקָר chỉ gia súc thuộc loài bò; “các đàn bò” vừa chính xác vừa song song tự nhiên với “các đàn chiên dê”.
- source_word: וְאֹהָלִים
  choice: và nhiều lều trại
  rationale: Danh từ số nhiều chỉ các lều; “nhiều lều trại” truyền đạt tự nhiên số lượng nhiều và bối cảnh sống du mục.
