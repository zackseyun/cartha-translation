  to: Áp-ram sống trong đất Ca-na-an, còn Lót sống giữa các thành trong đồng bằng và đóng trại cho đến tận Sô-đôm.[a]
  rationale: Thay “dựng lều” bằng “đóng trại” để tiếng Việt tự nhiên hơn, đồng thời bảo toàn hình ảnh lều trại, giới hạn không gian của עַד (“cho đến tận”), và sự mơ hồ về việc Lót có thực sự vào cư trú trong Sô-đôm hay chưa. Chú thích được chỉnh để nêu sát hơn lựa chọn từ vựng của động từ Hê-bơ-rơ.
