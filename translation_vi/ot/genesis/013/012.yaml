    rationale: וַיֶּאֱהַל là động từ “đóng/dựng lều trại”; với עַד, câu nêu phạm vi khu trại vươn tới Sô-đôm. “Đóng trại ... đến tận” truyền đạt quan hệ này tự nhiên hơn.
  - severity: low
