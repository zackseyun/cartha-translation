source:
  edition: WLC
  text: אַבְרָ֖ם יָשַׁ֣ב בְּ/אֶֽרֶץ כְּנָ֑עַן וְ/ל֗וֹט יָשַׁב֙ בְּ/עָרֵ֣י הַ/כִּכָּ֔ר וַ/יֶּאֱהַ֖ל עַד סְדֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: vi
  text: Áp-ram sống trong đất Ca-na-an, còn Lót sống giữa các thành trong đồng bằng và đóng trại cho đến tận Sô-đôm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “và dời lều trại đến tận Sô-đôm.” Động từ Hê-bơ-rơ có thể chỉ việc đóng/dựng lều trại hoặc dời lều trại; câu có thể nói rằng khu trại của Lót vươn về phía Sô-đôm, không nhất thiết ông đã vào ở trong thành lúc này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: sống
  rationale: Diễn đạt tự nhiên ý cư trú hoặc sinh sống; tránh sắc thái cổ của “cư ngụ” mà vẫn phù hợp cả hai lần xuất hiện.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: trong đất Ca-na-an
  rationale: Giữ danh từ אֶרֶץ (“đất/xứ”) của tiếng Hê-bơ-rơ và diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: giữa các thành trong đồng bằng
  rationale: כִּכָּר ở đây chỉ vùng đồng bằng Jordan; “giữa các thành” diễn đạt việc Lót cư trú trong khu vực có nhiều thành mà không buộc hiểu ông sống đồng thời trong từng thành.
- source_word: וַיֶּאֱהַל
  choice: dựng lều
  rationale: Động từ từ gốc אהל có thể chỉ việc dựng lều hoặc sống trong lều; “dựng lều” giữ hình ảnh cụ thể và tự nhiên.
- source_word: עַד סְדֹם
  choice: cho đến tận Sô-đôm
  rationale: Giữ ý giới hạn không gian của עַד, cho thấy phạm vi đóng trại vươn tới Sô-đôm nhưng không nhất thiết khẳng định Lót đã cư trú trong thành.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: לוֹט
  choice: Lót
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: סְדֹם
  choice: Sô-đôm
  rationale: Phiên âm địa danh theo cách dùng tiếng Việt quen thuộc.
theological_decisions:
- issue: Lót có vào cư trú trong thành Sô-đôm ở thời điểm này hay không
  choice: Diễn đạt phạm vi dựng lều “cho đến tận Sô-đôm,” không khẳng định ông đã ở trong thành.
  alternative: Hiểu rằng Lót đã định cư tại Sô-đôm.
  rationale: Cụm עַד סְדֹם nêu giới hạn hoặc hướng vươn tới; câu này chưa buộc phải hiểu Lót đã vào sống trong chính thành Sô-đôm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “còn” để thể hiện sự tương phản địa lý giữa Áp-ram và Lót; giữ hình ảnh lều trại và sự mơ hồ hợp lý về vị trí của Lót đối với Sô-đôm.
