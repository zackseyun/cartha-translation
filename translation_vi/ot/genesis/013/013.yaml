  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: vi
  text: Người Sô-đôm vô cùng gian ác và phạm tội chống lại Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước mặt Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַנְשֵׁי סְדֹם
  choice: Dân thành Sô-đôm
  rationale: Cụm Hê-bơ-rơ chỉ những người nam/cư dân thuộc Sô-đôm. Trong tiếng Việt, “dân thành Sô-đôm” tự nhiên hơn “những người nam của Sô-đôm” và phù hợp với ý chỉ cư dân thành; liên từ וְ không cần được dịch riêng trong câu giải thích chen vào này.
- source_word: רָעִים
  choice: gian ác
  rationale: Trong ngữ cảnh đạo đức, từ này chỉ sự xấu xa về luân lý, không chỉ điều tồi tệ nói chung.
- source_word: וְ/חַטָּאִים
  choice: và phạm tội
  rationale: Diễn đạt đặc tính tội lỗi bằng một vị ngữ tự nhiên trong tiếng Việt, đồng thời giữ cấu trúc song song với “gian ác”.
- source_word: לַ/יהוָה
  choice: chống lại Yahweh
  rationale: Với từ ngữ về phạm tội, ל có thể chỉ Đấng bị xúc phạm; “chống lại” giữ được lực quan hệ và đạo đức của câu. Cách hiểu “trước mặt Yahweh” được giữ trong chú thích.
- source_word: מְאֹד
  choice: vô cùng
  rationale: Giữ mức nhấn mạnh cao của trạng từ Hê-bơ-rơ và đặt ở cuối câu theo trật tự tự nhiên, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” giúp bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của לַיהוָה đi với חַטָּאִים
  choice: chống lại Yahweh
  alternative: trước mặt Yahweh
  rationale: Giới từ có thể diễn tả đối tượng bị xúc phạm hoặc vị trí trước mặt/nhận định của Yahweh. Bản chính chọn nghĩa thứ nhất theo cách kết hợp với động từ phạm tội, nhưng chú thích bảo tồn cách hiểu khả dĩ thứ hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Sô-đôm” theo cách phiên âm quen thuộc trong tiếng Việt; “gian ác” và “vô cùng” giữ sắc thái đạo đức mạnh và mức độ nhấn của nguyên văn.
