  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trình tự cơ bản của nguyên văn: Áp-ram dời lều, đến, cư ngụ tại vùng cây của Mam-rê ở Hếp-rôn, rồi xây bàn thờ. Tuy nhiên, “kính Đức Giê-hô-va” diễn giải quan hệ לַיהוָה theo hướng tôn kính; “cho Yahweh” sát và tự nhiên hơn trong ngữ cảnh dựng bàn thờ. Danh riêng trong chính văn cũng nên nhất quán với quyết định nguồn là “Yahweh”.'
  naturalness: Câu văn nhìn chung tự nhiên. Tách “tại Hếp-rôn” bằng dấu phẩy trong bản nháp có thể khiến cụm địa điểm gắn lỏng với “Mam-rê”; đặt thành “các cây sồi của Mam-rê, ở Hếp-rôn” làm rõ hơn. “Đến và cư ngụ” bảo toàn hai động từ nối tiếp của tiếng Hê-bơ-rơ.
  terminology: “Bàn thờ” là tương đương chuẩn của מִזְבֵּחַ. “Cây sồi” là lựa chọn chính văn có thể chấp nhận cho אֵלֹנֵי, với chú thích bảo lưu khả năng “cây thông nhựa”. Dùng “Yahweh” thay vì “Đức Giê-hô-va” để phù hợp quyết định đã nêu trong hồ sơ nguồn và giữ dạng danh riêng.
  issues:
