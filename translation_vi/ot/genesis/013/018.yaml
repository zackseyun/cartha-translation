    rationale: Hồ sơ nguồn xác định cách đọc được chọn cho יהוה là “Yahweh”. Việc đổi sang dạng “Giê-hô-va” không nhất quán với quyết định đó.
  - severity: low
    issue: “kính Đức Giê-hô-va” thêm sắc thái diễn giải cho giới từ ל־.
    rationale: Nguyên văn nói Áp-ram xây một bàn thờ “cho Yahweh”; “cho Yahweh” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
  - severity: low
    issue: Vị ngữ địa điểm của các cây cần được gắn rõ hơn với Mam-rê.
    rationale: Mệnh đề אֲשֶׁר בְּחֶבְרוֹן định vị các cây/Mam-rê ở Hếp-rôn, không đơn thuần là một trạng ngữ rời của toàn câu.
