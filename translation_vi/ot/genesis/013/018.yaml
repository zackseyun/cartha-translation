base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: vi
  text: Vậy Áp-ram dời lều, đến và cư ngụ bên các cây sồi của Mam-rê, ở Hếp-rôn; tại đó ông xây một bàn thờ cho Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các cây sồi” cũng có thể dịch là “các cây thông nhựa”; từ Hê-bơ-rơ có thể chỉ những cây lớn như cây sồi hoặc cây thông nhựa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: dời lều
  rationale: Động từ chỉ việc dựng hoặc di chuyển lều; trong mạch văn này, “dời lều” diễn đạt tự nhiên việc Áp-ram chuyển nơi đóng trại mà không lặp ý đến và cư ngụ.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: đến cư ngụ
  rationale: Giữ được chuỗi hành động đến nơi rồi ở lại, đồng thời phù hợp văn phong kể chuyện tiếng Việt hiện đại.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: bên những cây sồi của Mam-rê
  rationale: אֵלֹנֵי có thể chỉ các cây lớn thuộc loại sồi hoặc thông nhựa; chọn “cây sồi” trong chính văn và bảo lưu bất định về loài cây trong chú thích.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: tại Hếp-rôn
  rationale: Mệnh đề quan hệ xác định vị trí của các cây ở Mam-rê; tiếng Việt có thể diễn đạt gọn bằng cụm chỉ địa điểm.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: tại đó ông xây một bàn thờ
  rationale: Giữ rõ trạng từ שָׁם và dùng thuật ngữ thông dụng “bàn thờ” cho מִזְבֵּחַ.
- source_word: לַיהוָה
  choice: kính Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước của Đức Chúa Trời thay vì thay bằng một tước hiệu; “kính” diễn đạt tự nhiên hướng quy về của việc dựng bàn thờ trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn trực tiếp dùng Tứ Danh. Bản dịch giữ đây là danh riêng; dạng “Đức Giê-hô-va” quen thuộc, trang trọng và dễ hiểu trong tiếng Việt, không thay danh bằng tước hiệu.
- issue: Loài cây trong אֵלֹנֵי מַמְרֵא
  choice: những cây sồi của Mam-rê
  alternative: những cây thông nhựa của Mam-rê; những cây lớn của Mam-rê
  rationale: Từ Hê-bơ-rơ không xác định chắc chắn loài cây. Chính văn dùng cách gọi quen thuộc, còn chú thích bảo lưu sự bất định có thật.
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong tiếng Việt: Áp-ram, Mam-rê, Hếp-rôn; tránh từ cổ “trú ngụ” hoặc lối diễn đạt quá sát chữ gây gượng.'
