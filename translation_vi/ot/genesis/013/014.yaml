  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: vi
  text: 'Sau khi Lót đã tách khỏi Áp-ram, Yahweh phán với Áp-ram: “Hãy ngước mắt lên và nhìn từ nơi ngươi đang ở, về phía bắc, phía nam, phía đông và phía tây.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt cho danh riêng giao ước יְהוָה; liên từ וַ được thể hiện tự nhiên qua mạch kể tiếp nối và trật tự câu.
- source_word: אָמַר אֶל־אַבְרָם
  choice: phán với Áp-ram
  rationale: “Phán” là động từ trang trọng, tự nhiên khi chủ thể là Đức Chúa Trời; tên אַבְרָם được phiên âm theo cách dùng Kinh Thánh tiếng Việt phổ biến.
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: Sau khi Lót tách khỏi Áp-ram
  rationale: Diễn đạt rõ quan hệ thời gian và nghĩa ly cách của động từ Niphal; thay đại từ “ông” bằng “Áp-ram” để tránh mơ hồ trong tiếng Việt.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Hãy ngước mắt lên
  rationale: “Ngước mắt lên” là thành ngữ tiếng Việt tự nhiên, giữ hình ảnh của nguyên văn. Tiểu từ נָא làm nhẹ mệnh lệnh, nhưng không nhất thiết tương ứng với “xin/vui lòng” trong lời phán trang trọng.
- source_word: וּרְאֵה
  choice: và ... nhìn
  rationale: Thể hiện mệnh lệnh hướng thị giác về toàn vùng đất; cấu trúc tiếng Việt đặt trạng ngữ xen giữa vẫn giữ liên kết bằng “và”.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר־אַתָּה שָׁם
  choice: từ nơi con đang ở
  rationale: Chuyển đầy đủ điểm quan sát mà không thêm ý “đứng”; dùng “con” theo lối xưng hô trang trọng, dễ hiểu trong lời Đức Chúa Trời nói với Áp-ram.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: về phía bắc, phía nam, phía đông và phía tây
  rationale: Các hình thái định hướng -ָה được diễn đạt bằng “về phía”; thứ tự bốn hướng được giữ nguyên.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יְהוָה. “Đức Giê-hô-va” là dạng đã quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt và phân biệt danh riêng này với tước hiệu “Chúa”; chú thích ghi dạng gần với cách phục nguyên hiện đại để minh bạch.
- issue: Chủ thể ẩn trong מֵעִמּוֹ
  choice: Áp-ram
  alternative: ông
  rationale: Đại từ hậu tố chỉ Áp-ram. Nêu tên trong tiếng Việt giúp tránh khả năng người đọc hiểu nhầm Lót tách khỏi một người khác, nhưng không làm thay đổi quan hệ được nguyên văn xác định.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Giữ hình ảnh “ngước mắt lên,” thứ tự bốn hướng và nhịp mệnh lệnh của tiếng Hê-bơ-rơ; tránh lối diễn đạt quá cổ. Dùng “con” trong lời Đức Chúa Trời nói với Áp-ram để phù hợp tập quán tiếng Việt, dù nguyên văn không có đại từ xưng hô tách biệt ngoài hình thái ngôi thứ hai.
