  terminology: Các tên riêng «Áp-ram», «Ai Cập», «Nê-ghép» phù hợp. «Đi lên» bảo lưu đúng sắc thái động từ עלה. Chú thích về cách hiểu địa danh/hướng của negev là thích hợp.
