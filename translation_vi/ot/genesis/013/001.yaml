base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: vi
  text: Vậy, Áp-ram đi lên từ Ai Cập đến miền Nê-ghép[a], cùng với vợ ông, tất cả những gì ông có, và Lót đi cùng ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “về phía nam.” Từ Hê-bơ-rơ negev có thể chỉ miền nam gọi là Nê-ghép hoặc nói chung là phía nam hay miền nam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: đi lên
  rationale: Giữ nghĩa cơ bản của động từ עלה và lối diễn đạt địa lý của Kinh Thánh về hành trình từ Ai Cập lên đất Ca-na-an.
- source_word: מִמִּצְרַיִם
  choice: từ Ai Cập
  rationale: Diễn đạt trực tiếp giới từ מן cùng địa danh.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: cùng với vợ
  rationale: Trong câu tiếng Việt, cách diễn đạt này tự nhiên mà vẫn cho thấy vợ ông cùng đi; chủ thể Áp-ram đã được nêu rõ.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: mọi thứ ông có
  rationale: Giữ phạm vi rộng của cụm từ Hê-bơ-rơ, không thu hẹp vào tài sản vật chất בלבד.
- source_word: וְלוֹט עִמּוֹ
  choice: và Lót
  rationale: Đặt Lót trong danh sách những người và những gì đi cùng Áp-ram; tiếng Việt không cần lặp lại “cùng ông” để truyền đạt ý này.
- source_word: הַנֶּגְבָּה
  choice: đến miền Nê-ghép
  rationale: Xử lý נֶגֶב chủ yếu như tên vùng địa lý ở miền nam Ca-na-an, đồng thời chú thích nghĩa từ vựng thay thế là “về phía nam”.
