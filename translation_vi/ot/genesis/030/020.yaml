  text: וַ/תֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨/נִי אֱלֹהִ֥ים אֹתִ/י֮ זֵ֣בֶד טוֹב֒ הַ/פַּ֨עַם֙ יִזְבְּלֵ֣/נִי אִישִׁ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שִׁשָּׁ֣ה בָנִ֑ים וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ זְבֻלֽוּן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: vi
  text: 'Lê-a nói: “Đức Chúa Trời đã ban cho tôi một món quà quý. Lần này chồng tôi sẽ quý trọng tôi,[a] vì tôi đã sinh cho ông ấy sáu con trai.” Vì thế, bà đặt tên con là Sa-bu-lôn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sẽ ở với tôi.” Động từ Hê-bơ-rơ này hiếm gặp và có lối chơi chữ liên hệ với tên Sa-bu-lôn; ý nghĩa có thể bao hàm cả việc quý trọng lẫn ở lại với Lê-a.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי ... זֵבֶד טוֹב
  choice: đã ban cho tôi một món quà quý
  rationale: Diễn đạt tự nhiên ý của động từ זבד và danh từ cùng gốc זֵבֶד, đồng thời dùng lặp trường nghĩa “ban/quà” để phần nào giữ lối chơi chữ. “Quý” chuyển tải טוֹב theo sắc thái một ân ban có giá trị trong ngữ cảnh.
- source_word: הַפַּעַם
  choice: Lần này
  rationale: Cách nói tự nhiên, đúng với công thức phát biểu sau một lần sinh nở.
- source_word: יִזְבְּלֵנִי
  choice: sẽ quý trọng tôi
  rationale: Động từ hiếm và khó xác định; trong ngữ cảnh, Lê-a hy vọng địa vị của mình trước chồng sẽ được cải thiện. Bản dịch chính giữ nghĩa “tôn trọng/quý trọng”, còn khả năng “ở với tôi” được bảo lưu trong chú thích.
- source_word: אִישִׁי
  choice: chồng tôi
  rationale: Tương đương rõ ràng và tự nhiên trong ngữ cảnh hôn nhân.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: tôi đã sinh cho ông ấy sáu con trai
  rationale: Giữ rõ hành động sinh nở, số lượng, giới tính của các con và đối tượng gián tiếp לוֹ.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: bà đặt tên con là Sa-bu-lôn
  rationale: Chuyển công thức đặt tên Hê-bơ-rơ sang tiếng Việt hiện đại, tự nhiên.
- source_word: זְבֻלוּן
  choice: Sa-bu-lôn
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt; âm của tên vẫn phần nào gợi liên hệ với động từ יִזְבְּלֵנִי trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của động từ hiếm יִזְבְּלֵנִי
  choice: sẽ quý trọng tôi
  alternative: sẽ ở với tôi
  rationale: Ngữ cảnh hỗ trợ hy vọng được chồng coi trọng sau khi sinh sáu con trai, nhưng từ này có thể liên hệ với ý “ở/cư ngụ” và được dùng để chơi chữ với tên Sa-bu-lôn. Không quyết đoán loại bỏ cách hiểu kia nên ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Trời” theo cách gọi quen thuộc trong tiếng Việt; tránh giải thích quá mức lối chơi chữ khó tái tạo. Đại từ “ông ấy/bà” giúp câu tự nhiên mà vẫn giữ các quan hệ trong nguyên văn.
