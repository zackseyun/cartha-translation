  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố của bản Hê-bơ-rơ: Đức Chúa Trời ban một quà tặng tốt lành, hy vọng của Lê-a về cách chồng đối xử với bà, lý do bà đã sinh sáu con trai cho chồng, và việc đặt tên Sa-bu-lôn. Cách dịch chính “sẽ quý trọng tôi” là một lựa chọn ngữ cảnh hợp lý cho động từ hiếm יִזְבְּלֵנִי, đồng thời chú thích bảo lưu cách hiểu “sẽ ở với tôi.”'
