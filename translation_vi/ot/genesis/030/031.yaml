base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: vi
  text: 'La-ban hỏi: “Tôi sẽ cho cậu điều gì?” Gia-cốp đáp: “Ông không phải cho tôi bất cứ thứ gì. Nếu ông làm cho tôi điều này, tôi sẽ lại[a] chăn dắt đàn chiên dê của ông và trông nom chúng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi sẽ trở lại, chăn dắt đàn chiên dê của ông và trông nom chúng.” Động từ Hê-bơ-rơ có thể được hiểu là “trở lại” hoặc là “lại/tiếp tục” công việc chăn giữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: Tôi phải cho cậu điều gì?
  rationale: Câu hỏi đề nghị Gia-cốp nêu khoản thù lao. “Phải… điều gì?” truyền đạt tự nhiên sắc thái La-ban hỏi mình nên trao gì.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: Ông không phải cho tôi bất cứ thứ gì
  rationale: Trong ngữ cảnh, לֹא với thể chưa hoàn thành diễn tả lời từ chối nhận một khoản trả công trực tiếp; “không phải” tự nhiên hơn một mệnh lệnh cấm trong tiếng Việt.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Nếu ông làm cho tôi điều này
  rationale: Giữ nguyên cấu trúc điều kiện và từ chỉ định của tiếng Hê-bơ-rơ, không diễn giải trước nội dung đề nghị ở câu kế tiếp.
- source_word: אָשׁוּבָה
  choice: tôi sẽ lại
  rationale: Trong mạch văn, động từ שׁוב có thể chỉ việc tiếp tục hoặc làm lại công việc chăn giữ; “lại” diễn đạt gọn nghĩa ấy, đồng thời chú thích bảo lưu khả năng hiểu là “trở lại”.
- source_word: אֶרְעֶה
  choice: chăn dắt
  rationale: רעה trong ngữ cảnh đàn vật nuôi chỉ việc dẫn đi ăn và chăm sóc; “chăn dắt” là cách nói hiện đại, cụ thể và trang trọng vừa phải.
- source_word: צֹאנְךָ
  choice: đàn chiên dê của ông
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, đặc biệt là chiên và dê. Cách dịch này chính xác hơn “đàn gia súc”, vốn có thể bao gồm cả bò.
- source_word: אֶשְׁמֹר
  choice: trông nom chúng
  rationale: שׁמר bổ sung ý chăm coi và bảo vệ đàn vật nuôi. “Trông nom” tự nhiên trong tiếng Việt và bao gồm sự canh giữ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Tên riêng được nêu ở đầu câu để tránh đại từ không rõ chủ thể trong tiếng Việt; cách xưng hô “tôi—cậu” và “ông—tôi” phản ánh quan hệ lớn tuổi/chủ thuê với người trẻ hơn mà không làm lời thoại quá cổ.
