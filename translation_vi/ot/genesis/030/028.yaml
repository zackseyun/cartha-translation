translation:
  language: vi
  text: 'Rồi La-ban nói: “Cháu cứ ấn định tiền công, ta sẽ trả.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Rồi La-ban nói
  rationale: Dạng tự sự với waw nối tiếp đưa câu chuyện tiến lên; “Rồi ... nói” tự nhiên trong tiếng Việt và giữ sắc thái trình tự.
- source_word: נָקְבָה
  choice: Hãy nói rõ
  rationale: Động từ נקב ở đây có nghĩa ấn định hoặc nói rõ một cách cụ thể. “Hãy nói rõ” phù hợp ngữ cảnh thương lượng tiền công và tự nhiên hơn cách dịch máy móc “hãy gọi tên”.
- source_word: שְׂכָרְךָ
  choice: tiền công của cháu
  rationale: שָׂכָר chỉ khoản trả cho lao động. “Tiền công” chính xác và thông dụng; đại từ “cháu” phản ánh quan hệ gia đình và lối xưng hô tự nhiên giữa La-ban với Gia-cốp.
- source_word: עָלַי
  choice: với ta
  rationale: Nghĩa đen là “trên ta”, nhưng trong thành ngữ này chỉ người tiếp nhận lời ấn định. “Với ta” giữ thành phần này mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְאֶתֵּנָה
  choice: ta sẽ trả
  rationale: נתן có nghĩa cơ bản là “cho”, nhưng khi đối tượng được hiểu là tiền công, “trả” diễn đạt đúng hành động cam kết thanh toán trong tiếng Việt; đối tượng được lược vì đã rõ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ta/cháu” theo quan hệ La-ban là cậu của Gia-cốp; cách xưng hô này là lựa chọn ngôn dụng, không bổ sung nội dung thần học.
