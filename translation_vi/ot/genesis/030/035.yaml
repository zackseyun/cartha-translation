  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc liệt kê và các thuật ngữ màu lông chính: dê đực có vằn và đốm, dê cái có chấm và đốm, những con có màu trắng, cùng các con màu nâu sẫm. «Tách riêng» chuyển đạt phù hợp Hiphil của סור; «giao ... trông nom» diễn đạt đúng thành ngữ «trao vào tay». Tuy nhiên, כְּשָׂבִים chỉ chiên con/lambs cụ thể hơn «bầy chiên», nên cần chỉnh để giữ độ chính xác từ vựng.'
