revisions:
- from: Ngay trong ngày ấy, ông tách riêng những dê đực có vằn[a] và có đốm, tất cả dê cái có chấm và có đốm—mọi con có màu trắng trên mình—cùng mọi con màu nâu sẫm[b] trong bầy chiên, rồi giao chúng cho các con trai mình trông nom[c].
  to: Hôm ấy, ông tách riêng những dê đực có vằn[a] và có đốm, tất cả dê cái có chấm và có đốm—mọi con có màu trắng trên mình—cùng mọi con màu nâu sẫm[b] trong số chiên con, rồi giao chúng cho các con trai mình trông nom[c].
  rationale: Chỉnh hai chỗ để văn phong Việt tự nhiên hơn và để «chiên con» phản ánh chính xác hơn כְּשָׂבִים. Các yếu tố còn lại, bao gồm thứ tự liệt kê, phân biệt giới tính và các chú thích từ vựng, được giữ nguyên vì phù hợp nguồn Hê-bơ-rơ.
