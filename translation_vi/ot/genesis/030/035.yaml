base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: vi
  text: Hôm ấy, ông tách riêng những dê đực có vằn[a] và có đốm, tất cả dê cái có chấm và có đốm—mọi con có màu trắng trên mình—cùng mọi con màu nâu sẫm[b] trong số chiên con, rồi giao chúng cho các con trai mình trông nom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “có sọc”; từ Hê-bơ-rơ chỉ những dấu màu thành vệt hoặc dải trên thân con vật.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “màu nâu” hoặc “màu sẫm”; từ Hê-bơ-rơ chỉ một sắc nâu tối.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “trao vào tay các con trai mình,” một thành ngữ Hê-bơ-rơ có nghĩa là giao cho họ quản lý hoặc chăm nom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: ông tách riêng
  rationale: Dạng Hiphil của סור diễn tả việc khiến các con vật được tách khỏi đàn; “tách riêng” tự nhiên và làm rõ hành động phân đàn.
- source_word: הַתְּיָשִׁים
  choice: những dê đực
  rationale: תיש chỉ dê giống đực; cách dịch này rõ ràng, hiện đại và giữ sự phân biệt với nhóm dê cái tiếp theo.
- source_word: הָעֲקֻדִּים
  choice: có vằn
  rationale: Từ này chỉ những vệt hoặc dải màu trên thân con vật; “có vằn” là cách nói tự nhiên trong tiếng Việt mà không xác định quá mức hình dạng dấu màu.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: có đốm
  rationale: Từ này chỉ bộ lông có những mảng hoặc đốm màu; dùng nhất quán cho cả dạng giống đực và giống cái.
- source_word: הָעִזִּים
  choice: dê cái
  rationale: Danh từ có thể chỉ dê nói chung, nhưng sự tương phản với תישים ngay trước đó cho thấy ở đây là dê cái.
- source_word: הַנְּקֻדּוֹת
  choice: có chấm
  rationale: Từ này chỉ các chấm nhỏ; “có chấm” phân biệt với טלאות là “có đốm”.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: mọi con có màu trắng trên mình
  rationale: Giữ nghĩa phân phối của כֹּל và diễn đạt tự nhiên đặc điểm có phần lông trắng.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: cùng mọi con màu nâu sẫm trong bầy chiên
  rationale: חוּם chỉ màu nâu hoặc tối; “nâu sẫm” giữ sắc thái màu cụ thể. כְּשָׂבִים thuộc phạm vi chiên/cừu; “bầy chiên” tự nhiên hơn và không buộc phải hiểu mọi con đều còn non.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: rồi giao chúng cho các con trai mình trông nom
  rationale: Thành ngữ “trao vào tay” chỉ việc đặt dưới quyền quản lý hoặc chăm nom; cách dịch này chuyển đúng chức năng của thành ngữ sang tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “dê đực/dê cái” để giữ sự phân biệt giới tính trong nguyên văn; phân biệt “có chấm” với “có đốm” để phản ánh hai thuật ngữ Hê-bơ-rơ khác nhau. Đại từ “ông” giữ chủ thể hàm ẩn của động từ Hê-bơ-rơ mà không tự ý nêu tên.
