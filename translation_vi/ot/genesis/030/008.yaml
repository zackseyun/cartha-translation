  text: וַ/תֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים נִפְתַּ֛לְתִּי עִם אֲחֹתִ֖/י גַּם יָכֹ֑לְתִּי וַ/תִּקְרָ֥א שְׁמ֖/וֹ נַפְתָּלִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: vi
  text: 'Ra-chên nói: “Tôi đã vật lộn với chị mình trong những cuộc vật lộn của Đức Chúa Trời[a], và tôi cũng đã thắng thế.” Vì thế, bà đặt tên cho đứa trẻ là Nép-ta-li[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “những cuộc vật lộn của Đức Chúa Trời, tôi đã vật lộn.” Cụm từ này cũng có thể là một cách nói nhấn mạnh, nghĩa là “những cuộc vật lộn mãnh liệt” hoặc “phi thường.”'
    reason: lexical_alternative
  - marker: b
    text: Tên Nép-ta-li có liên hệ về âm và từ nguyên với từ Hê-bơ-rơ được dịch là “vật lộn” trong câu này.
    reason: wordplay
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: những cuộc vật lộn của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu khó hiểu nhưng giàu sức gợi của tiếng Hê-bơ-rơ, đồng thời để chú thích trình bày khả năng אֱלֹהִים được dùng như từ nhấn mạnh, nghĩa là “những cuộc vật lộn phi thường/dữ dội”.
- source_word: נִפְתַּלְתִּי
  choice: tôi đã vật lộn
  rationale: Diễn đạt hình ảnh cụ thể và giữ liên hệ từ nguyên với tên Nép-ta-li.
- source_word: עִם אֲחֹתִי
  choice: với chị mình
  rationale: עִם có nghĩa trực tiếp là “với”; trong ngữ cảnh ganh đua, cụm này tự nhiên hàm ý đối đầu mà không cần đổi thành “chống lại”.
- source_word: גַּם יָכֹלְתִּי
  choice: và tôi cũng đã thắng
  rationale: Trong cuộc ganh đua này, יכל chỉ việc thành công hoặc thắng thế; “đã thắng” rõ ràng, tự nhiên hơn cách dịch máy móc “đã có thể”.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: Vì thế, bà đặt tên cho đứa trẻ là Nép-ta-li
  rationale: Dùng công thức đặt tên tự nhiên trong tiếng Việt, đồng thời thể hiện quan hệ giữa lời giải thích và tên đứa trẻ.
- source_word: נַפְתָּלִי
  choice: Nép-ta-li
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt; chú thích nêu mối liên hệ giữa tên này và động từ “vật lộn” trong câu.
theological_decisions:
- issue: Cách hiểu אֱלֹהִים trong cụm נַפְתּוּלֵי אֱלֹהִים
  choice: Giữ nghĩa trực tiếp “của Đức Chúa Trời” trong chính văn.
  alternative: Hiểu אֱלֹהִים như từ nhấn mạnh và dịch “những cuộc vật lộn phi thường/dữ dội”.
  rationale: Nguyên văn cho phép cả cách hiểu quy chiếu trực tiếp đến Đức Chúa Trời lẫn cách hiểu thành ngữ nhấn mạnh mức độ. Giữ cách nói trực tiếp trong chính văn và nêu khả năng kia ở chú thích giúp bảo toàn sự mơ hồ thay vì quyết định thay cho người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách nói “những cuộc vật lộn của Đức Chúa Trời” được chủ ý giữ hơi lạ để phản ánh cách diễn đạt khó xác định của nguyên văn; chú thích hỗ trợ người đọc mà không xóa bỏ sự mơ hồ.
