revisions:
- from: 'Ra-chên nói: “Tôi đã vật lộn với chị mình bằng những cuộc vật lộn của Đức Chúa Trời[a], và tôi cũng đã thắng.” Vì thế, bà đặt tên cho đứa trẻ là Nép-ta-li[b].'
  to: 'Ra-chên nói: “Tôi đã vật lộn với chị mình trong những cuộc vật lộn của Đức Chúa Trời[a], và tôi cũng đã thắng thế.” Vì thế, bà đặt tên cho đứa trẻ là Nép-ta-li[b].'
  rationale: Chỉnh nhẹ giới từ để không diễn giải cụm danh từ Hê-bơ-rơ khó hiểu như một phương tiện. Giữ “của Đức Chúa Trời” trong chính văn để bảo toàn một cách hiểu trực tiếp, đồng thời chú thích nêu cách hiểu thành ngữ “mãnh liệt/phi thường”. “Thắng thế” sát với ý “đã prevailed” hơn “đã thắng” mà vẫn tự nhiên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:41:38Z'
