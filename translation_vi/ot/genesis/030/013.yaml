base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: vi
  text: 'Lê-a nói: “Tôi thật hạnh phúc! Vì phụ nữ sẽ gọi tôi là người hạnh phúc.” Vì vậy, bà đặt tên cho con là A-se[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên A-se có liên hệ với các từ Hê-bơ-rơ được dịch là “hạnh phúc” và “gọi… là người hạnh phúc” trong lời của Lê-a.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: Tôi thật hạnh phúc!
  rationale: Cụm từ diễn tả niềm hạnh phúc hoặc phúc lành của Lê-a; cách nói cảm thán này tự nhiên trong tiếng Việt và giữ được liên hệ từ vựng với động từ tiếp theo cùng tên A-se.
- source_word: אִשְּׁרוּנִי
  choice: sẽ gọi tôi là người hạnh phúc
  rationale: Dạng Piel của אשר có nghĩa là tuyên bố hay gọi một người là hạnh phúc, có phúc. Cách dịch này giữ sự lặp từ với lời cảm thán trước đó.
- source_word: בָּנוֹת
  choice: các phụ nữ
  rationale: Nghĩa từ vựng trực tiếp là “các con gái”, nhưng ở đây số nhiều có thể được dùng theo nghĩa rộng để chỉ phụ nữ nói chung; “các phụ nữ” truyền đạt tự nhiên ý nghĩa theo ngữ cảnh.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: Thế là bà đặt tên cho con là A-se
  rationale: “Đặt tên cho con” là cách diễn đạt tiếng Việt tự nhiên cho công thức đặt tên trong tiếng Hê-bơ-rơ, đồng thời giữ rõ chủ thể và người con mới sinh.
- source_word: אָשֵׁר
  choice: A-se
  rationale: Tên riêng được phiên âm sang tiếng Việt thay vì dịch nghĩa; chú thích giải thích lối chơi chữ trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các phụ nữ” theo nghĩa thành ngữ của בָּנוֹת thay vì dịch sát là “các con gái”; giữ lối chơi chữ bằng sự lặp lại “hạnh phúc” và giải thích trong chú thích.
