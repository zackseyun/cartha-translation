  rationale: Chỉnh nhẹ cách diễn đạt để tiếng Việt tự nhiên hơn và sửa chú thích nhằm trình bày chính xác lối chơi chữ theo gốc từ Hê-bơ-rơ. Không thay đổi nghĩa của câu, không thêm diễn giải thần học, và vẫn giữ tên riêng theo phiên âm.
