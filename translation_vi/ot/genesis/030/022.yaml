base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: vi
  text: Bấy giờ, Đức Chúa Trời nhớ đến Ra-chên[a]; Ngài lắng nghe bà[b] và mở tử cung của bà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đoái đến Ra-chên” hoặc “lưu tâm đến Ra-chên”. Trong tiếng Hê-bơ-rơ, “nhớ đến” là một thành ngữ Kinh Thánh chỉ việc Đức Chúa Trời lưu tâm cách ưu ái và hành động, không có nghĩa là trước đó Ngài đã quên bà.
    reason: lexical_alternative
  - marker: b
    text: Hay “nghe bà” hoặc “đoái nghe bà”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: nhớ đến
  rationale: 'Giữ thành ngữ Kinh Thánh của động từ זכר: Đức Chúa Trời lưu tâm cách ưu ái và bắt đầu hành động, chứ không hàm ý trước đó Ngài đã quên.'
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ đi với các động từ số ít và tại đây chỉ về Đức Chúa Trời duy nhất; cách gọi này tự nhiên, trang trọng trong tiếng Việt Kinh Thánh.
- source_word: אֶת רָחֵל
  choice: Ra-chên
  rationale: אֶת đánh dấu Ra-chên là tân ngữ trực tiếp; tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: Ngài lắng nghe bà
  rationale: שׁמע với אֶל diễn tả việc nghe chăm chú hoặc đoái nghe; “lắng nghe” giữ sắc thái quan hệ mà không diễn giải quá mức thành “đáp lời”.
- source_word: וַיִּפְתַּח
  choice: mở
  rationale: Giữ động từ cụ thể פתח và hình ảnh nguyên ngữ.
- source_word: רַחְמָהּ
  choice: dạ bà
  rationale: רֶחֶם nghĩa là tử cung hoặc dạ; “mở dạ” giữ thành ngữ Kinh Thánh về việc ban khả năng thụ thai, đồng thời trang trọng và dễ hiểu trong ngữ cảnh.
- source_word: וַ
  choice: Bấy giờ / và
  rationale: Waw liên tiếp thúc đẩy mạch kể; “Bấy giờ” mở câu tự nhiên, còn “và” nối các hành động kế tiếp.
theological_decisions:
- issue: Ngôn ngữ nhân hình về việc Đức Chúa Trời “nhớ đến” Ra-chên
  choice: Giữ “nhớ đến” trong chính văn như một thành ngữ Kinh Thánh về sự lưu tâm dẫn đến hành động của Đức Chúa Trời.
  alternative: đoái đến Ra-chên / lưu tâm đến Ra-chên
  rationale: Nguyên ngữ không hàm ý Đức Chúa Trời từng quên Ra-chên; tuy nhiên, thay hẳn thành ngữ sẽ làm mất một mô-típ Kinh Thánh quan trọng. Hai hành động tiếp theo giải thích cụ thể ý nghĩa của việc Ngài nhớ đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà” cho Ra-chên để tránh lặp tên; giữ các thành ngữ “nhớ đến” và “mở dạ” nhằm bảo tồn hình ảnh cùng sức căng thần học của nguyên văn. Các dấu chú thích được đặt ngay sau cụm từ liên quan và theo thứ tự [a], [b].
