base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: vi
  text: Xin cha giao các vợ và các con của con lại cho con—vì họ mà con đã phục vụ cha[a]—để con ra đi. Vì chính cha biết con đã phục vụ cha thế nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vì các người vợ mà con đã phục vụ cha”; đại từ “họ” có thể quy chiếu đặc biệt đến các người vợ, thay vì toàn bộ gia đình vừa được nhắc đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה אֶת נָשַׁי וְאֶת יְלָדַי
  choice: Xin cha giao các vợ và các con của con lại cho con
  rationale: Mệnh lệnh תְּנָה được diễn đạt thành lời thỉnh cầu tự nhiên trong quan hệ Gia-cốp–La-ban; “giao ... lại cho con” làm rõ đối tượng được yêu cầu trao mà không thêm ý sở hữu ngoài các hậu tố “của con”. Cách xưng hô “cha–con” phù hợp quan hệ nhạc phụ–con rể trong tiếng Việt.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָּהֵן
  choice: vì họ mà con đã phục vụ cha
  rationale: Giới từ בְּ với đại từ giống cái số nhiều có thể chỉ những người nữ làm căn nguyên hoặc đối tượng của thời gian phục vụ, chủ yếu quy chiếu đến các người vợ; “vì họ mà” giữ được cách nói tự nhiên và phần nào độ mở của quy chiếu.
- source_word: וְאֵלֵכָה
  choice: để con ra đi
  rationale: Thể cohortative biểu thị ý muốn của người nói; “để con ra đi” truyền đạt sắc thái xin được khởi hành mà không quá cổ.
- source_word: כִּי אַתָּה יָדַעְתָּ
  choice: Vì chính cha biết
  rationale: כִּי nêu lý do; đại từ chủ ngữ tường minh אַתָּה được thể hiện bằng “chính cha” để giữ sắc thái nhấn mạnh.
- source_word: אֶת עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: con đã phục vụ cha thế nào
  rationale: Tiếng Hê-bơ-rơ lặp danh từ và động từ cùng gốc עבד. Trong tiếng Việt, dịch sát kiểu “sự phục vụ mà con đã phục vụ cha” gượng gạo; cấu trúc “phục vụ ... thế nào” giữ trọng tâm rằng La-ban biết rõ công việc Gia-cốp đã làm, với văn phong tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng lối xưng hô “cha–con” theo quan hệ nhạc phụ–con rể. Dấu gạch ngang làm rõ ranh giới của mệnh đề quan hệ, đồng thời giữ nguyên sự mơ hồ có thật về đối tượng mà đại từ giống cái số nhiều quy chiếu.
