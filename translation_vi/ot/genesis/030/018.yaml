base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: vi
  text: 'Lê-a nói: “Đức Chúa Trời đã ban cho tôi tiền công, vì tôi đã trao nữ tỳ của mình cho chồng tôi.” Vì thế, bà đặt tên con là Y-sa-ca[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Y-sa-ca nghe gần với từ Hê-bơ-rơ chỉ “tiền công” hoặc “phần thưởng”, theo lời giải thích của Lê-a.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: Đức Chúa Trời đã ban
  rationale: Giữ Đức Chúa Trời làm chủ thể của động từ נתן và diễn đạt hành động đã hoàn tất với kết quả hiện tại trong lời giải thích của Lê-a.
- source_word: שְׂכָרִי
  choice: tiền công cho tôi
  rationale: שָׂכָר có nghĩa là tiền công, thù lao hoặc phần thưởng. “Tiền công” giữ được sắc thái trao đổi cụ thể và liên hệ âm-nghĩa với tên Y-sa-ca; cấu trúc tiếng Việt tự nhiên hóa sở hữu “của tôi” thành đối tượng “cho tôi” sau động từ “ban”.
- source_word: אֲשֶׁר
  choice: vì
  rationale: Trong ngữ cảnh này, tiểu từ quan hệ אֲשֶׁר nêu lý do theo cách hiểu của Lê-a; “vì” truyền đạt rõ quan hệ nhân quả mà không thêm lời đánh giá.
- source_word: נָתַתִּי
  choice: tôi đã trao
  rationale: Diễn tả hành động có trước của Lê-a. “Trao” tự nhiên trong tiếng Việt và vẫn giữ ý bà đưa nữ tỳ của mình cho chồng.
- source_word: שִׁפְחָתִי
  choice: nữ tỳ của mình
  rationale: “Nữ tỳ” chỉ người nữ ở địa vị phục dịch hoặc lệ thuộc trong bối cảnh cổ đại, chính xác hơn “người giúp việc” và không suy đoán tuổi tác như “cô gái nô lệ”.
- source_word: לְאִישִׁי
  choice: cho chồng
  rationale: Trong quan hệ hôn nhân đang được nói đến, אִישִׁי mang nghĩa rõ ràng là “chồng tôi”; tiếng Việt có thể lược đại từ sở hữu vì chủ thể đã rõ.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Vì thế, bà đặt tên con là
  rationale: Diễn đạt tự nhiên thành ngữ đặt tên và thể hiện sự tiếp nối mang tính kết quả giữa lời giải thích của Lê-a với việc đặt tên.
- source_word: יִשָּׂשכָר
  choice: Y-sa-ca
  rationale: Phiên âm tên riêng theo cách quen thuộc trong Kinh Thánh tiếng Việt; chú thích giải thích mối liên hệ với שָׂכָר.
theological_decisions:
- issue: Lời Lê-a giải thích hành động của Đức Chúa Trời và sự ra đời của con
  choice: Giữ nguyên lời quy việc nhận “tiền công” cho Đức Chúa Trời mà không bình luận
  alternative: Dùng “phần thưởng” để làm nhẹ sắc thái trao đổi
  rationale: Câu này thuật lại cách Lê-a tự giải thích sự việc. Bản dịch cần giữ sắc thái đền đáp trong lời bà, nhưng không xác nhận hay phê phán quan niệm thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nữ tỳ” để phản ánh địa vị xã hội cổ đại; dùng “tiền công” nhằm bảo tồn sắc thái cụ thể và lối chơi chữ trong tiếng Hê-bơ-rơ.
