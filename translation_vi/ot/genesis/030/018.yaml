revisions:
- from: 'Lê-a nói: “Đức Chúa Trời đã ban tiền công cho tôi, vì tôi đã trao nữ tỳ của mình cho chồng.” Vì thế, bà đặt tên con là Y-sa-ca.[a]'
  to: 'Lê-a nói: “Đức Chúa Trời đã ban cho tôi tiền công, vì tôi đã trao nữ tỳ của mình cho chồng tôi.” Vì thế, bà đặt tên con là Y-sa-ca[a].'
  rationale: Bản sửa phục hồi “chồng tôi,” làm trật tự từ trong cụm “ban cho tôi tiền công” tự nhiên và minh bạch hơn, đồng thời hiệu chỉnh chú thích để phản ánh thận trọng lời chơi chữ tiếng Hê-bơ-rơ mà không khẳng định một từ nguyên không có tranh luận.
  reviewer_model: gpt-5.6-terra
