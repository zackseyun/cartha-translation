  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý nghĩa của Hê-bơ-rơ: đại từ nhấn mạnh trong אַתָּה được phản ánh bằng “Chính ông”; עָבַד được dịch phù hợp là “phục vụ”; và מִקְנֶה được hiểu đúng là đàn gia súc. Cụm cuối “đã ra sao khi ở với tôi” diễn đạt tự nhiên ý tình trạng/kết quả của đàn vật trong thời gian thuộc sự chăm nom của Gia-cốp, đồng thời không biến nó thành một khẳng định rõ ràng về sự thịnh vượng.'
  naturalness: Văn bản hiện đại, rõ ràng và phù hợp lời đối thoại. Cách dùng “ông ... ông ấy” hơi lặp nhưng vẫn chấp nhận được khi bản dịch chủ ý không thay đại từ nguồn bằng tên riêng theo văn cảnh. “Chính ông biết” và “tôi đã phục vụ ông thế nào” tự nhiên trong ngữ cảnh trang trọng.
  terminology: “Đàn gia súc” là thuật ngữ bao quát và phù hợp cho מִקְנְךָ. “Phục vụ” bảo lưu sắc thái làm việc lệ thuộc cho người khác mà không áp đặt diễn giải thần học. Chú thích nêu đúng tính chất thành ngữ của mệnh đề cuối và duy trì mức độ dè dặt bằng “có lẽ”.
