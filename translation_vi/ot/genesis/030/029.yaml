  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: vi
  text: 'Ông nói với ông ấy: “Chính ông biết tôi đã phục vụ ông thế nào, và đàn gia súc của ông đã ra sao khi ở với tôi.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “và đàn gia súc của ông đã thế nào với tôi.” Thành ngữ Hê-bơ-rơ có lẽ nói đến tình trạng và sự phát triển của đàn gia súc dưới sự chăm nom của Gia-cốp, chứ không chỉ nói chúng ở đâu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Ông nói với ông ấy
  rationale: Giữ chuỗi tường thuật của wayyiqtol bằng lối kể tự nhiên trong tiếng Việt; đại từ được để theo văn cảnh mà không tự ý chèn tên riêng.
- source_word: אַתָּה יָדַעְתָּ
  choice: Chính ông biết
  rationale: '“Chính ông” thể hiện sự nhấn mạnh của đại từ độc lập אַתָּה, còn động từ hoàn thành mang nghĩa trạng thái hiện tại: “biết”.'
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: tôi đã phục vụ ông thế nào
  rationale: עבד trong văn cảnh lao động có nghĩa phục vụ hoặc làm việc cho; “phục vụ” giữ được cả sắc thái lao động lẫn vị thế phụ thuộc.
- source_word: מִקְנְךָ
  choice: đàn gia súc của ông
  rationale: מִקְנֶה là danh từ tập hợp chỉ súc vật nuôi trong bầy đàn; cách dịch này rộng hơn “bò” và tự nhiên trong tiếng Việt.
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: đàn gia súc của ông đã ra sao khi ở với tôi
  rationale: Cách diễn đạt giữ ý hỏi về tình trạng hoặc kết quả của đàn vật dưới sự chăm nom của Gia-cốp, đồng thời không khẳng định quá mức rằng câu này chỉ nói đến sự thịnh vượng.
