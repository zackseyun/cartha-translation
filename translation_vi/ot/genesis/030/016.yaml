  text: וַ/יָּבֹ֨א יַעֲקֹ֣ב מִן הַ/שָּׂדֶה֮ בָּ/עֶרֶב֒ וַ/תֵּצֵ֨א לֵאָ֜ה לִ/קְרָאת֗/וֹ וַ/תֹּ֨אמֶר֙ אֵלַ֣/י תָּב֔וֹא כִּ֚י שָׂכֹ֣ר שְׂכַרְתִּ֔י/ךָ בְּ/דוּדָאֵ֖י בְּנִ֑/י וַ/יִּשְׁכַּ֥ב עִמָּ֖/הּ בַּ/לַּ֥יְלָה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: vi
  text: 'Chiều đến, Gia-cốp từ ngoài đồng về. Lê-a ra đón ông và nói: “Chàng phải đến với em, vì em đã thuê chàng bằng những quả phong già của con trai em[a].” Đêm ấy, ông nằm với Lê-a.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì em quả thật đã thuê chàng bằng những quả phong già của con trai em.” Cấu trúc Hê-bơ-rơ nhấn mạnh lời khẳng định của Lê-a; giới từ có thể cho thấy những quả phong già là phương tiện hoặc giá của sự thỏa thuận.'
    reason: Giữ sắc thái nhấn mạnh của שָׂכֹר שְׂכַרְתִּיךָ và để mở chức năng phương tiện/giá trao đổi của בְּ, không giải quyết quá mức tính hàm nghĩa của cụm từ.
lexical_decisions:
- source_word: וַיָּבֹא יַעֲקֹב מִן הַשָּׂדֶה בָּעֶרֶב
  choice: Chiều đến, Gia-cốp từ ngoài đồng trở về
  rationale: Diễn đạt tự nhiên trình tự thời gian và sự di chuyển từ đồng ruộng về nơi ở, đồng thời giữ đủ các yếu tố của nguyên văn.
- source_word: וַתֵּצֵא לֵאָה לִקְרָאתוֹ
  choice: Lê-a ra đón ông
  rationale: “Ra đón” là cách nói tiếng Việt tự nhiên cho động tác đi ra để gặp người đang trở về.
- source_word: אֵלַי תָּבוֹא
  choice: Chàng phải đến với em
  rationale: Giữ lối nói giảm chỉ quan hệ vợ chồng trong nguyên văn; “phải” thể hiện lời khẳng định mạnh và quyền đòi hỏi của Lê-a trong bối cảnh.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: em đã thuê chàng
  rationale: Giữ hình ảnh giao dịch của động từ Hê-bơ-rơ. Ngữ cảnh và từ “phải” đã chuyển tải sắc thái quả quyết mà không cần thêm một phó từ dễ gây nặng câu.
- source_word: בְּדוּדָאֵי בְּנִי
  choice: bằng những quả phong già của con trai em
  rationale: Giới từ בְּ được hiểu là phương tiện hoặc giá trao đổi. “Quả phong già” là tên gọi quen dùng trong truyền thống Kinh Thánh tiếng Việt cho דודאים, một loài cây thường được nhận diện là mandrake.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: ông nằm với bà
  rationale: Giữ lối nói giảm trang trọng của nguyên văn về quan hệ tình dục, tránh cách diễn đạt thô hoặc quá khẩu ngữ.
- source_word: בַּלַּיְלָה הוּא
  choice: Đêm ấy
  rationale: Chuyển ngữ ngắn gọn, tự nhiên và phản ánh đúng đại từ chỉ định הוּא trong cụm thời gian.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng đại từ “chàng/em” trong lời Lê-a để phản ánh quan hệ vợ chồng, còn lời kể dùng “ông/bà”. Giữ lối nói giảm của nguyên văn trong các cụm “đến với em” và “nằm với bà”.
