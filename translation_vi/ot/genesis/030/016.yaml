  terminology: “Quả phong già” giữ thuật ngữ Kinh Thánh Việt ngữ truyền thống cho דּוּדָאִים. Vì việc định danh thực vật này không hoàn toàn chắc chắn, không nên thay bằng một tên loài cụ thể hơn. Chú thích nên nói rõ đây là cách dịch khác, đồng thời tránh diễn đạt “với giá là” như thể đã giải quyết dứt khoát chức năng của בְּ.
