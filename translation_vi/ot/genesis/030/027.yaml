  source_fidelity: Bản dịch truyền đạt đúng quan hệ lời nói, lời thỉnh cầu được tỉnh lược trong tiếng Hê-bơ-rơ, việc La-ban nhận biết qua hành vi xem/bói điềm, danh Yahweh, phước lành dành cho La-ban, và nguyên nhân là Gia-cốp. Tuy nhiên, “nhờ bói điềm mà biết” hơi gượng trong tiếng Việt hiện đại; “đã xem điềm và biết” trực tiếp hơn với נִחַשְׁתִּי. Dời ký hiệu chú thích từ vựng đến ngay sau cụm tương ứng cũng làm rõ neo chú thích.
