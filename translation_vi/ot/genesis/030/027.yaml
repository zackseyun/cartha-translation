  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: vi
  text: 'La-ban nói với ông: “Nếu tôi được đẹp lòng ông, xin ông ở lại.[a] Tôi đã xem điềm[b] và biết rằng Yahweh đã ban phước cho tôi vì ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không có cụm “ở lại”; lời thỉnh cầu được tỉnh lược và được bổ sung theo ngữ cảnh.
    reason: supplied_words
  - marker: b
    text: 'Cũng có thể dịch: “Tôi đã bói ra” hoặc “Tôi đã biết qua kinh nghiệm.” Động từ Hê-bơ-rơ thường nói đến việc bói toán hay xem điềm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Nếu tôi được đẹp lòng ông, xin ông ở lại
  rationale: Thành ngữ Hê-bơ-rơ được chuyển sang cách nói tự nhiên trong tiếng Việt. נָא làm lời thỉnh cầu mềm hơn; “ở lại” được bổ sung theo ngữ cảnh vì nguyên văn tỉnh lược lời yêu cầu.
- source_word: נִחַשְׁתִּי
  choice: Tôi đã nhờ bói điềm mà biết
  rationale: Động từ piel נחשׁ thường chỉ việc bói toán hoặc xem điềm. Cách dịch này giữ nghĩa mạnh của từ đồng thời diễn đạt rõ rằng La-ban có được sự nhận biết bằng phương thức ấy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: וַיְבָרֲכֵנִי
  choice: đã ban phước cho tôi
  rationale: Diễn đạt hành động ban phước đã xảy ra và là điều La-ban nhận biết.
- source_word: בִּגְלָלֶךָ
  choice: vì ông
  rationale: 'Giữ quan hệ nguyên nhân: La-ban cho rằng mình được ban phước vì Gia-cốp.'
- source_word: לָבָן
  choice: La-ban
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng của Đức Chúa Trời; bản dịch giữ danh ấy và không thay bằng tước hiệu.
- issue: Nguồn nhận biết của La-ban
  choice: nhờ bói điềm mà biết
  alternative: qua kinh nghiệm mà biết
  rationale: Giữ nghĩa từ vựng nổi bật của נחשׁ là bói/xem điềm, không làm nhẹ đi sự căng thẳng giữa phương thức bói toán của La-ban và việc ông quy sự ban phước cho Yahweh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” phù hợp với lời La-ban nói với Gia-cốp trong ngữ cảnh; giữ hình thức “Yahweh” theo chỉ dẫn và bảo toàn sắc thái bói điềm của nguyên văn.
