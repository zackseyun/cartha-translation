  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: vi
  text: Gia-cốp tách những chiên con ra. Ông cho đàn chiên quay mặt về phía những con có sọc và tất cả những con sẫm màu trong đàn của La-ban.[a] Rồi ông lập riêng các đàn cho mình, không nhập chúng vào đàn của La-ban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu là: “những con có sọc và tất cả những con sẫm màu sinh ra từ đàn của La-ban.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: những chiên con
  rationale: Danh từ này thường chỉ chiên non; cách dịch này cụ thể hơn từ bao quát “chiên” và phù hợp bối cảnh chăn nuôi.
- source_word: הִפְרִיד
  choice: tách ... ra
  rationale: Thể Hiphil của פרד có nghĩa là phân tách; “tách ... ra” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: פְּנֵי הַצֹּאן אֶל
  choice: cho đàn chiên quay mặt về phía
  rationale: Giữ hình ảnh cụ thể “mặt đàn chiên” của tiếng Hê-bơ-rơ nhưng diễn đạt thành một hành động tự nhiên trong tiếng Việt.
- source_word: עָקֹד
  choice: những con có sọc
  rationale: Từ này chỉ súc vật có các vệt hoặc dải màu; “có sọc” rõ ràng, hiện đại và không quá chuyên biệt.
- source_word: כָל חוּם
  choice: tất cả những con sẫm màu
  rationale: חוּם có thể chỉ màu nâu hoặc màu tối; “sẫm màu” giữ được phạm vi nghĩa mà không xác định màu quá mức.
- source_word: בְּצֹאן לָבָן
  choice: trong đàn của La-ban
  rationale: Dịch ב theo nghĩa vị trí thông dụng là “trong”; câu Hê-bơ-rơ vẫn có thể được hiểu theo hơn một cách về quan hệ của các con vật này với đàn La-ban, nên có chú thích nêu khả năng khác.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: ông lập riêng các đàn cho mình
  rationale: Diễn đạt cả hành động thiết lập các đàn và ý tách riêng của לְבַדּוֹ bằng tiếng Việt gọn, tự nhiên.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: không nhập chúng vào đàn của La-ban
  rationale: Trong ngữ cảnh phân đàn, “không nhập chúng vào” diễn đạt tự nhiên ý không đặt các đàn vừa tách chung với đàn La-ban.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chiên con” thay vì “cừu con” để phù hợp vốn từ Kinh Thánh tiếng Việt quen thuộc; giữ tên riêng theo dạng La-ban và Gia-cốp. Chú thích bảo lưu khả năng hiểu בְּצֹאן לָבָן theo nghĩa nguồn gốc thay vì âm thầm giải quyết điểm khó của mạch truyện.
