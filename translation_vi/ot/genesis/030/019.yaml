  yaml_path: translation/ot/genesis/030/019.yaml
  text: Leah conceived again and bore Jacob a sixth son.
translation:
  language: vi
  text: Lê-a lại mang thai và sinh cho Gia-cốp người con trai thứ sáu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: mang thai
  rationale: Động từ הרה ở thể qal trong mạch kể chỉ việc thụ thai hoặc có thai. “Mang thai” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và phù hợp với văn cảnh sinh nở.
- source_word: עוֹד
  choice: lại
  rationale: Trong chuỗi tường thuật này, עוֹד diễn tả sự lặp lại; “lại” truyền đạt gọn và tự nhiên ý Lê-a mang thai thêm một lần nữa.
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Động từ ילד ở dạng này có nghĩa là sinh con. “Sinh” là cách diễn đạt ngắn gọn, trang trọng vừa phải và tự nhiên trong tiếng Việt.
- source_word: בֵּן
  choice: người con trai
  rationale: Danh từ בֵּן nghĩa là “con trai”. Thêm từ loại “người” giúp cụm từ với số thứ tự tự nhiên hơn trong tiếng Việt.
- source_word: שִׁשִּׁי
  choice: thứ sáu
  rationale: Số thứ tự này bổ nghĩa cho “con trai”, cho biết đây là người con trai thứ sáu Lê-a sinh cho Gia-cốp.
- source_word: לְיַעֲקֹב
  choice: cho Gia-cốp
  rationale: Tiền tố לְ biểu thị quan hệ trong thành ngữ sinh con cho một người. Giữ “cho Gia-cốp” vừa phản ánh rõ cấu trúc Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng và dễ hiểu trong tiếng Việt hiện đại. Tên riêng dùng dạng quen thuộc “Lê-a” và “Gia-cốp”. Không cần chú thích vì câu không có dị bản hay sự mơ hồ đáng kể cần nêu.
