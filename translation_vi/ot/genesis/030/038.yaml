base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: vi
  text: Ông đặt những cành cây đã bóc vỏ trong các máng nước[a], nơi đàn chiên dê đến uống, ngay trước mặt đàn chiên dê. Khi chúng đến uống, chúng động dục[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng hai cụm từ gần nghĩa, có thể dịch là “trong các máng, tại những chỗ chứa nước uống”, nhằm mô tả đầy đủ khu vực cho đàn vật uống nước.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ có nghĩa sát là “trở nên nóng” hoặc “động dục”; trong ngữ cảnh này, việc giao phối được hàm ý.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: đặt
  rationale: Động từ chỉ việc đặt một vật vào vị trí nhất định; “đặt” tự nhiên và chính xác trong ngữ cảnh.
- source_word: הַמַּקְלוֹת
  choice: những cành cây
  rationale: Chỉ những cành cây Gia-cốp đã chuẩn bị ở câu trước; “cành cây” phù hợp ngữ cảnh hơn “gậy” trong tiếng Việt.
- source_word: אֲשֶׁר פִּצֵּל
  choice: đã bóc vỏ
  rationale: Trong ngữ cảnh, động từ nói đến việc bóc vỏ cành cây để lộ các sọc trắng.
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: trong các máng nước
  rationale: Hai cách diễn đạt gần nghĩa cùng mô tả khu vực cho đàn vật uống nước. Gộp thành “các máng nước” giúp câu tiếng Việt tự nhiên, còn chú thích bảo lưu cấu trúc kép của tiếng Hê-bơ-rơ.
- source_word: הַצֹּאן
  choice: đàn vật
  rationale: Danh từ tập hợp này chỉ đàn gia súc nhỏ, thường gồm chiên và dê. “Đàn vật” phù hợp mạch văn và tránh thu hẹp thành riêng đàn chiên.
- source_word: לְנֹכַח הַצֹּאן
  choice: ngay trước mặt chúng
  rationale: Diễn đạt vị trí trực tiếp trước hoặc đối diện đàn vật; đại từ giúp tiếng Việt tránh lặp cứng mà không làm mất đối tượng quy chiếu.
- source_word: וַיֵּחַמְנָה
  choice: chúng động dục
  rationale: Động từ theo nghĩa sát là trở nên nóng hoặc động dục; trong ngữ cảnh sinh sản, việc giao phối được hàm ý nhưng không cần thay thế nghĩa trực tiếp.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: Khi đến uống
  rationale: Cấu trúc nguyên mẫu với giới từ diễn tả hoàn cảnh thời gian; cách dịch này rõ ràng và tự nhiên.
