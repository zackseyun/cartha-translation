  text: And Zilpah[a], Leah's female servant, bore Jacob a second son.
translation:
  language: vi
  text: Xin-ba[a], nữ tỳ của Lê-a, sinh cho Gia-cốp người con trai thứ hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nữ nô lệ của Lê-a.” Từ Hê-bơ-rơ chỉ một nữ đầy tớ hoặc nữ nô lệ thuộc về Lê-a.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Động từ ילד ở thể wayyiqtol kể sự kiện tiếp theo trong mạch truyện; “sinh” tự nhiên, gọn và phù hợp với công thức thuật lại việc sinh con.
- source_word: זִלְפָּה
  choice: Xinh-pa
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc, đồng thời phản ánh tên Hê-bơ-rơ.
- source_word: שִׁפְחַת לֵאָה
  choice: nữ tỳ của Lê-a
  rationale: Cụm sở hữu chỉ địa vị của Xinh-pa đối với Lê-a. “Nữ tỳ” giữ được nét nghĩa người nữ phục dịch và địa vị lệ thuộc của שִׁפְחָה; chú thích nêu rõ sắc thái nô lệ có thể có.
- source_word: בֵּן שֵׁנִי
  choice: người con trai thứ hai
  rationale: Diễn đạt đúng nghĩa đen “một con trai, thứ hai”, tức người con trai thứ hai mà Xinh-pa sinh cho Gia-cốp trong văn cảnh.
- source_word: לְיַעֲקֹב
  choice: cho Gia-cốp
  rationale: Giữ rõ giới từ לְ, đánh dấu người cha hoặc người được hưởng việc sinh con trong công thức này; cách nói “sinh cho Gia-cốp” tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng “nữ tỳ” để tránh cách gọi quá hiện đại làm mờ địa vị lệ thuộc, đồng thời dùng chú thích để bảo toàn phạm vi nghĩa xã hội của từ Hê-bơ-rơ.
