  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: vi
  text: 'Sau khi Ra-chên sinh Giô-sép, Gia-cốp nói với La-ban: “Xin cho tôi đi, để tôi về nơi chốn của mình và xứ sở của mình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Sau khi
  rationale: Cụm dẫn nhập đánh dấu thời điểm sau biến cố; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ quan hệ thời gian của nguyên văn.
- source_word: שַׁלְּחֵנִי
  choice: Xin cho tôi đi
  rationale: Động từ piel mang ý cho phép hoặc tiễn cho đi; thêm “xin” thể hiện lời thỉnh cầu trong ngữ cảnh mà không làm câu quá sát chữ.
- source_word: מְקוֹמִי וּלְאַרְצִי
  choice: quê hương, xứ sở của mình
  rationale: מקום theo nghĩa đen là “nơi/chỗ của tôi”, nhưng trong sự song hành với “đất/xứ của tôi” chỉ nơi quê nhà; “quê hương, xứ sở của mình” truyền đạt tự nhiên ý trở về nơi thuộc về mình, đồng thời giữ hai thành tố.
