revisions:
- from: 'Nhưng Lê-a nói với nàng: “Chị lấy chồng tôi đi mà còn cho là chuyện nhỏ sao? Bây giờ chị lại muốn lấy cả những quả phong già của con trai tôi nữa sao?” Ra-chên đáp: “Vậy thì đêm nay, chàng sẽ nằm với chị để đổi lấy những quả phong già của con trai chị.”'
  to: 'Nhưng Lê-a nói với nàng: “Việc em đã lấy chồng tôi là chuyện nhỏ sao, mà em còn muốn lấy cả những quả phong già của con trai tôi?” Ra-chên đáp: “Vậy thì đêm nay chàng sẽ nằm với chị để đổi lấy những quả phong già của con trai chị.”'
  rationale: Sửa đại từ xưng hô để phản ánh đúng quan hệ Lê-a–Ra-chên, và chỉnh câu hỏi tu từ đầu câu cho tự nhiên hơn trong tiếng Việt đồng thời sát với הַמְעַט קַחְתֵּךְ אֶת־אִישִׁי. Các yếu tố còn lại được giữ nguyên vì truyền đạt đúng nghĩa nguyên văn và register kể chuyện hiện đại.
