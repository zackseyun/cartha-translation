  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: vi
  text: 'Nhưng Lê-a nói với nàng: “Việc em đã lấy chồng tôi là chuyện nhỏ sao, mà em còn muốn lấy cả những quả phong già của con trai tôi?” Ra-chên đáp: “Vậy thì đêm nay chàng sẽ nằm với chị để đổi lấy những quả phong già của con trai chị.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: mà còn cho là chuyện nhỏ sao?
  rationale: Giữ sắc thái câu hỏi tu từ trách móc của nguyên ngữ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: אִישִׁי
  choice: chồng tôi
  rationale: Nghĩa trực tiếp của danh từ kèm hậu tố ngôi thứ nhất số ít trong ngữ cảnh hôn nhân.
- source_word: דּוּדָאֵי
  choice: những quả phong già
  rationale: Chỉ mandrake, một loài cây có quả được nhắc đến trong trình thuật; dùng tên gọi tiếng Việt tương đối quen thuộc và thêm 'quả' theo ngữ cảnh câu 14.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: chàng sẽ nằm với chị
  rationale: Giữ lối nói giảm trực tiếp của tiếng Hê-bơ-rơ và không diễn giải quá mức hành vi tính dục.
- source_word: תַּחַת
  choice: để đổi lấy
  rationale: Trong ngữ cảnh thương lượng, từ này mang nghĩa thay thế hoặc trao đổi.
theological_decisions:
- issue: Quy người chồng là đối tượng bị 'lấy'
  choice: 'Giữ lời buộc tội của Lê-a: “Chị lấy chồng tôi”'
  alternative: “Chị đã cướp chồng tôi”
  rationale: Nguyên văn dùng động từ 'lấy', không nhất thiết mang sắc thái mạnh như 'cướp'; bản dịch giữ căng thẳng của lời thoại mà không tăng mức cáo buộc.
- issue: Mức độ chủ động được hàm ý trong lời Ra-chên
  choice: “chàng sẽ nằm với chị”
  alternative: “chị có thể ngủ với chàng”
  rationale: Giữ chủ ngữ giống đực số ít của động từ Hê-bơ-rơ và tránh chuyển quyền chủ động sang Lê-a.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chị/tôi” trong lời Lê-a và “chàng/chị” trong lời Ra-chên để làm rõ quan hệ đối thoại; tên riêng theo dạng Việt hóa quen thuộc.
