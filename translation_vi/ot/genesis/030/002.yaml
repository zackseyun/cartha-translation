base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: vi
  text: 'Gia-cốp nổi giận với Ra-chên[a] và nói: “Chẳng lẽ tôi ở địa vị của Đức Chúa Trời sao? Chính Ngài là Đấng đã không cho cô có con[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát hơn: “cơn giận của Gia-cốp bừng cháy đối với Ra-chên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “hoa trái của lòng mẹ”, một thành ngữ chỉ con cái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nổi giận
  rationale: Thành ngữ Hê-bơ-rơ diễn tả cơn giận bừng cháy; “nổi giận” tự nhiên trong tiếng Việt hiện đại và vẫn giữ được sắc thái mạnh của nguyên văn.
- source_word: בְּרָחֵל
  choice: với Ra-chên
  rationale: Giới từ đánh dấu người mà cơn giận hướng đến. “Nổi giận với Ra-chên” là cách nói tự nhiên, không làm tăng mức độ gay gắt quá nguyên văn.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: Chẳng lẽ tôi ở địa vị của Đức Chúa Trời sao?
  rationale: תַחַת ở đây chỉ việc đứng vào địa vị hay thay thế một người khác, chứ không chỉ vị trí ở bên dưới. Câu hỏi tu từ phủ nhận việc Gia-cốp nắm địa vị và quyền năng của Đức Chúa Trời.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Ngữ cảnh nói về Đức Chúa Trời duy nhất; cách gọi này trang trọng, rõ nghĩa và thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: אֲשֶׁר מָנַע
  choice: Chính Ngài là Đấng đã không cho
  rationale: Cách diễn đạt này xác định rõ Đức Chúa Trời là chủ thể ngăn việc thụ thai và giữ kết quả kéo dài đến hiện tại, đúng với mệnh đề quan hệ trong nguyên văn.
- source_word: מִמֵּךְ
  choice: cô
  rationale: Đại từ giống cái số ít chỉ Ra-chên. Trong lời người chồng đang tức giận nói với vợ, “cô” là tự nhiên và phù hợp với khoảng cách cảm xúc của ngữ cảnh.
- source_word: פְּרִי בָטֶן
  choice: có con
  rationale: Thành ngữ theo nghĩa đen là “hoa trái của lòng mẹ”, chỉ con cái hay khả năng sinh con. “Có con” truyền đạt rõ nghĩa trong tiếng Việt hiện đại, còn hình ảnh nguyên ngữ được bảo tồn trong chú thích.
theological_decisions:
- issue: Tác nhân trong tình trạng hiếm muộn
  choice: 'Giữ lời quy trách nhiệm trực tiếp cho Đức Chúa Trời: “Chính Ngài là Đấng đã không cho cô có con.”'
  alternative: Hiểu đây chỉ là lời nói tu từ của Gia-cốp, không hàm ý gì về tác động của Đức Chúa Trời.
  rationale: Mệnh đề אֲשֶׁר מָנַע מִמֵּךְ פְּרִי בָטֶן trực tiếp xác định Đức Chúa Trời là Đấng đã không ban con cho Ra-chên. Bản dịch giữ nguyên phát biểu của nhân vật mà không làm nhẹ đi hoặc phát triển thành một khẳng định thần học rộng hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi tu từ “Chẳng lẽ… sao?” giữ sức nặng của lời Gia-cốp; cách xưng hô “tôi—cô” phù hợp với lời vợ chồng trong lúc căng thẳng. Hình ảnh Hê-bơ-rơ khó tự nhiên trong câu chính được ghi ở chú thích.
