  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: vi
  text: Nàng bèn đưa Bil-ha, nữ tỳ[a] của mình, cho Gia-cốp làm vợ; rồi Gia-cốp đến với nàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ gái.” Từ Hê-bơ-rơ chỉ một người nữ phục dịch có địa vị lệ thuộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Vậy, nàng trao
  rationale: Động từ với waw liên tiếp đưa trình thuật tiến tới và trong ngữ cảnh diễn tả Ra-chên thực hiện điều vừa đề nghị; “Vậy” tự nhiên trong tiếng Việt mà vẫn giữ quan hệ tiếp nối.
- source_word: לּוֹ
  choice: cho chồng
  rationale: Đại từ chỉ Gia-cốp; dùng “chồng” giúp câu tiếng Việt tự nhiên và làm rõ quan hệ trong ngữ cảnh mà không thay đổi đối tượng.
- source_word: בִּלְהָה
  choice: Bil-ha
  rationale: Phiên âm tên riêng theo cách đọc Hê-bơ-rơ và quy ước tên Kinh Thánh tiếng Việt hiện đại.
- source_word: שִׁפְחָתָהּ
  choice: nữ tỳ của mình
  rationale: שִׁפְחָה chỉ một nữ đầy tớ có địa vị lệ thuộc. “Nữ tỳ” ngắn gọn, trang trọng và giữ được sắc thái giới tính cùng địa vị xã hội; chú thích cung cấp cách nói hiện đại hơn.
- source_word: לְאִשָּׁה
  choice: làm vợ
  rationale: Cụm từ chỉ việc trao người nữ vào một quan hệ hôn nhân hoặc thứ thất. “Làm vợ” giữ nguyên cách gọi quan hệ của bản Hê-bơ-rơ, không tự ý quy định chính xác địa vị pháp lý.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ăn nằm với Bil-ha
  rationale: Đây là lối nói giảm Hê-bơ-rơ về quan hệ tình dục. “Ăn nằm với” là thành ngữ tiếng Việt kín đáo, rõ nghĩa; lặp tên Bil-ha để tránh đại từ mơ hồ.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Địa vị của Bil-ha trong cụm לְאִשָּׁה
  choice: làm vợ
  alternative: làm vợ lẽ
  rationale: Bản Hê-bơ-rơ dùng אִשָּׁה, “người nữ/vợ”, chứ không ghi rõ một thuật ngữ riêng nghĩa là “vợ lẽ”. Vì thế bản dịch giữ “vợ” để không giải quyết thay văn bản sự căng thẳng giữa cách gọi quan hệ này và địa vị nữ tỳ của Bil-ha.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. “Nữ tỳ” giữ sắc thái địa vị lệ thuộc của nguyên ngữ; “ăn nằm với” truyền đạt lối nói giảm về quan hệ tình dục một cách tự nhiên trong tiếng Việt.
