base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: vi
  text: Bầy chiên và dê giao phối trước các cành cây và đẻ ra những con có vằn[a], có đốm nhỏ[b] và có mảng loang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “có khoang”; từ Hê-bơ-rơ עֲקֻדִּים chỉ các vệt dạng dải hoặc sọc.
    reason: lexical_alternative
  - marker: b
    text: Sự phân biệt giữa “có đốm nhỏ” (נְקֻדִּים) và “có mảng loang” (טְלֻאִים) chỉ mang tính tương đối; từ thứ hai cũng có thể dịch là “có đốm”, “có mảng” hoặc “lốm đốm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: giao phối
  rationale: Động từ יחם vốn chỉ việc động dục; trong ngữ cảnh gây giống vật nuôi, “giao phối” diễn đạt tự nhiên hành động sinh sản mà không buộc nghĩa thành “thụ thai”.
- source_word: הַצֹּאן
  choice: bầy vật
  rationale: צאן là danh từ tập hợp chỉ gia súc nhỏ, nhất là chiên và dê. “Bầy vật” phù hợp ngữ cảnh tiếng Việt và không thu hẹp thành riêng chiên hoặc dê.
- source_word: אֶל הַמַּקְלוֹת
  choice: trước các cành cây
  rationale: אֶל thường có nghĩa “về phía/đến”, nhưng trong cách sắp đặt ở ngữ cảnh trước, cụm này chỉ vị trí bầy vật giao phối trước các cành đã đặt ra. “Cành cây” nối kết rõ với các cành được mô tả ở câu 37–38.
- source_word: וַתֵּלַדְןָ
  choice: sinh ra những con
  rationale: ילד nghĩa là sinh hoặc đẻ. Tiếng Việt cần thêm “những con” để các tính từ mô tả hoa văn của con non có chỗ quy chiếu rõ ràng.
- source_word: עֲקֻדִּים
  choice: có vằn
  rationale: Từ này chỉ hoa văn dạng dải hoặc sọc; “có vằn” là cách nói hiện đại, tự nhiên đối với bộ lông động vật.
- source_word: נְקֻדִּים
  choice: có đốm nhỏ
  rationale: Từ này gợi các chấm hoặc đốm nhỏ. Thêm “nhỏ” giúp phân biệt tương đối với טְלֻאִים, nhưng sự phân biệt không tuyệt đối nên được ghi chú.
- source_word: וּטְלֻאִים
  choice: có đốm lớn
  rationale: Từ này chỉ hoa văn loang, vá hoặc mảng đốm. “Có đốm lớn” tạo đối sánh dễ hiểu với נְקֻדִּים, còn các khả năng “loang/lốm đốm” được bảo lưu trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Giữ hai mệnh đề nối tiếp của tiếng Hê-bơ-rơ; lược lần lặp thứ hai của “bầy vật” vì tiếng Việt tự nhiên vẫn xác định rõ cùng một chủ thể. Dùng “cành cây” thay vì “que” để liên kết với các cành cây trong văn cảnh gần.
