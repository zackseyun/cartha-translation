source:
  edition: WLC
  text: וּ/בְ/הַעֲטִ֥יף הַ/צֹּ֖אן לֹ֣א יָשִׂ֑ים וְ/הָיָ֤ה הָ/עֲטֻפִים֙ לְ/לָבָ֔ן וְ/הַ/קְּשֻׁרִ֖ים לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: vi
  text: Nhưng khi đàn gia súc yếu sức[a], Gia-cốp không đặt các cành cây trước mặt chúng[b]. Vì thế, những con yếu sức thuộc về La-ban, còn những con khỏe mạnh[c] thuộc về Gia-cốp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “yếu ớt”. Từ Hê-bơ-rơ có thể chỉ những con vật yếu; một số người hiểu cụ thể hơn là những con phối giống muộn hoặc có phẩm chất kém.
    reason: lexical_alternative
  - marker: b
    text: Tức là ông không đặt các cành cây trước mặt chúng như đã làm trong các câu trước.
    reason: cross_reference
  - marker: c
    text: Cũng có thể dịch là “cường tráng” hoặc “sung sức”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: khi đàn vật yếu sức
  rationale: Cụm ב + dạng nguyên mẫu tạo mệnh đề thời gian. Trong ngữ cảnh phối giống và đối lập với הַקְּשֻׁרִים, עטף chỉ tình trạng yếu, nhưng không nhất thiết xác định là phối giống muộn hay phẩm chất kém. “Đàn vật” chuyển tải danh từ tập hợp צֹאן, tức đàn gia súc nhỏ như chiên và dê.
- source_word: לֹא יָשִׂים
  choice: Gia-cốp không đặt các cành cây trước chúng
  rationale: שׂים có nghĩa là “đặt, để”. Tân ngữ được lược bỏ trong tiếng Hê-bơ-rơ nhưng ngữ cảnh các câu trước cho thấy đó là các cành cây; diễn đạt rõ chủ thể và tân ngữ giúp câu tiếng Việt tự nhiên mà không đổi ý.
- source_word: וְהָיָה
  choice: Vì thế ... thuộc về
  rationale: Cấu trúc này nêu kết quả của cách Gia-cốp sắp đặt việc phối giống. “Vì thế” thể hiện quan hệ kết quả, còn “thuộc về” diễn đạt tự nhiên sắc thái sở hữu/phân phần của לְ.
- source_word: הָעֲטֻפִים
  choice: những con yếu sức
  rationale: Dạng từ cùng gốc עטף được dịch nhất quán với mệnh đề đầu, giữ sự đối lập giữa những con yếu và những con khỏe.
- source_word: לְלָבָן
  choice: thuộc về La-ban
  rationale: Giới từ לְ ở đây biểu thị quyền sở hữu hoặc phần được phân cho La-ban.
- source_word: וְהַקְּשֻׁרִים
  choice: những con khỏe mạnh
  rationale: Hình thức từ này khác thường, nhưng trong sự đối lập với הָעֲטֻפִים, nó chỉ những con cường tráng, sung sức. “Khỏe mạnh” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: לְיַעֲקֹב
  choice: thuộc về Gia-cốp
  rationale: Giới từ לְ biểu thị quyền sở hữu hoặc phần thuộc về Gia-cốp.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đàn vật” để bao quát צֹאן là đàn gia súc nhỏ, tránh thu hẹp thành riêng chiên. Tên riêng theo dạng quen dùng trong Kinh Thánh tiếng Việt: Gia-cốp, La-ban. Các chú thích giữ lại độ bất định từ vựng của hai từ đối lập trong nguyên văn.'
