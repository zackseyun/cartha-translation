  to: Nhưng khi đàn gia súc yếu sức[a], Gia-cốp không đặt các cành cây trước mặt chúng[b]. Vì thế, những con yếu sức thuộc về La-ban, còn những con khỏe mạnh[c] thuộc về Gia-cốp.
