  yaml_path: translation/ot/genesis/030/010.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a son.
translation:
  language: vi
  text: Và Xinh-pa, nữ tỳ[a] của Lê-a, sinh cho Gia-cốp một con trai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nữ gia nhân.” Từ Hê-bơ-rơ שִׁפְחָה chỉ một người nữ phục dịch trong gia đình, có địa vị lệ thuộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Động từ ở dạng kể chuyện nối tiếp diễn tả sự kiện kế tiếp; “sinh” là cách nói tự nhiên trong tiếng Việt và phù hợp với bổ ngữ “một con trai”.
- source_word: זִלְפָּה
  choice: Xinh-pa
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen dùng, dễ đọc trong tiếng Việt.
- source_word: שִׁפְחַת
  choice: nữ tỳ
  rationale: שִׁפְחָה chỉ một nữ gia nhân có địa vị lệ thuộc trong gia đình; “nữ tỳ” vừa gọn, rõ giới tính và giữ được sắc thái địa vị thấp hơn, dù mang sắc thái hơi cổ.
- source_word: לֵאָה
  choice: của Lê-a
  rationale: Quan hệ cấu trúc sở hữu được diễn đạt tự nhiên bằng “của Lê-a”.
- source_word: לְיַעֲקֹב
  choice: cho Gia-cốp
  rationale: Giới từ ל trong cấu trúc với ילד xác định người cha hoặc người nhận lợi ích; “sinh cho Gia-cốp” giữ được quan hệ này một cách tự nhiên.
- source_word: בֵּן
  choice: một con trai
  rationale: Danh từ số ít không xác định trong ngữ cảnh được diễn đạt tự nhiên bằng “một con trai”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, trang trọng và dễ hiểu. Dùng “nữ tỳ” để giữ sắc thái lệ thuộc của từ nguồn; chú thích cung cấp cách diễn đạt hiện đại hơn. Không thêm liên từ “và” vì tiếng Việt nối tiếp câu chuyện tự nhiên mà không cần biểu thị riêng tiền tố kể chuyện וַ.
