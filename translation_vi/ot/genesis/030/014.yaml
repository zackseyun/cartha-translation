  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các dạng tên Ru-bên, Lê-a và Ra-chên quen thuộc trong tiếng Việt; lời thoại dùng cặp xưng hô chị–em theo quan hệ gia đình và ngữ cảnh.
