base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: vi
  text: 'Trong mùa gặt lúa mì, Ru-bên đi ra đồng, tìm được những cây phong nhự[a], rồi đem về cho mẹ mình là Lê-a. Ra-chên nói với Lê-a: “Xin chị cho em một ít phong nhự của con trai chị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc có thể hiểu là “táo tình yêu”. Từ Hê-bơ-rơ דּוּדָאִים chỉ một loài cây theo truyền thống được xác định là mandrake (cây phong nhự); trong mạch truyện chung quanh, cây này được liên hệ với khả năng sinh sản.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: Vào mùa gặt lúa mì
  rationale: Cụm chỉ thời gian được diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ rõ bối cảnh mùa thu hoạch lúa mì.
- source_word: וַיֵּלֶךְ ... בַּשָּׂדֶה
  choice: đi ra đồng
  rationale: Dù động từ chỉ nói 'đi', địa điểm 'ngoài đồng' cho phép kết hợp thành cách nói tiếng Việt tự nhiên mà không thêm thay đổi đáng kể về nghĩa.
- source_word: דּוּדָאִים
  choice: những quả cây nhân sâm
  rationale: Đây là cách gọi truyền thống bằng tiếng Việt cho mandrake trong văn cảnh Kinh Thánh; thêm 'quả' phù hợp với vật có thể hái và chia một phần, nhưng danh tính thực vật không hoàn toàn chắc chắn nên có chú thích.
- source_word: אֶל לֵאָה אִמּוֹ
  choice: cho mẹ mình là Lê-a
  rationale: Diễn đạt tự nhiên và xác định rõ Lê-a là mẹ của Ru-bên.
- source_word: תְּנִי נָא לִי
  choice: Xin chị cho em
  rationale: Giữ sắc thái khẩn khoản/lịch sự của נָא; đại từ theo quan hệ chị em đã biết trong văn cảnh giúp lời thoại tự nhiên trong tiếng Việt.
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: vài quả cây nhân sâm của con trai chị
  rationale: מִן mang nghĩa bộ phận nên được chuyển thành 'vài'; sở hữu cách chỉ những gì con trai Lê-a đã tìm thấy.
