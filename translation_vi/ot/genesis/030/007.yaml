  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: vi
  text: Binh-ha, nữ nô lệ[a] của Ra-chên, lại thụ thai và sinh cho Gia-cốp một con trai thứ hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nữ tỳ” hoặc “nữ đầy tớ.” Từ Hê-bơ-rơ chỉ một phụ nữ có địa vị lệ thuộc, thường là nữ nô lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: mang thai
  rationale: Động từ הרה chỉ việc thụ thai hoặc có thai; “mang thai” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: עוֹד
  choice: lại
  rationale: Trong mạch kể các lần sinh con, עוֹד diễn tả sự lặp lại.
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Động từ ילד ở đây có nghĩa là sinh con; “sinh” ngắn gọn và tự nhiên.
- source_word: שִׁפְחַת
  choice: nữ tỳ
  rationale: שִׁפְחָה chỉ một nữ nô lệ hoặc nữ đầy tớ thuộc địa vị lệ thuộc; “nữ tỳ” giữ được sắc thái xã hội ấy mà vẫn phù hợp với văn phong Kinh Thánh trang trọng.
- source_word: בֵּן שֵׁנִי
  choice: một con trai thứ hai
  rationale: Cụm từ có nghĩa sát là “một con trai thứ hai,” nhấn mạnh đây là con trai thứ hai do Binh-ha sinh.
- source_word: לְיַעֲקֹב
  choice: cho Gia-cốp
  rationale: Giới từ לְ biểu thị quan hệ hướng đến hoặc thuộc về; “sinh cho Gia-cốp” bảo lưu cấu trúc và ý nghĩa của nguyên văn.
- source_word: בִּלְהָה ... שִׁפְחַת רָחֵל
  choice: Binh-ha, nữ tỳ của Ra-chên
  rationale: Giữ cấu trúc đồng vị của tiếng Hê-bơ-rơ, trong đó Binh-ha được xác định qua địa vị của bà đối với Ra-chên.
