    issue: «em cũng sẽ được dựng nên» là một ẩn dụ không tự nhiên và dễ bị hiểu là nói đến việc xây dựng vật chất.
    rationale: וְאִבָּנֶה nghĩa đen là «tôi sẽ được xây dựng», nhưng trong ngữ cảnh là lối nói ẩn dụ về việc được gây dựng qua con cái. «Được gây dựng» bảo toàn phép ẩn dụ và có cách kết hợp tự nhiên hơn trong tiếng Việt.
