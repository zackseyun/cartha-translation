revisions:
- from: 'Nàng nói: “Đây là tớ gái của em, Bil-ha. Anh hãy ăn ở với nó, để nó sinh con trên đầu gối em[a], và nhờ nó, em cũng sẽ được dựng nên[b].”'
  to: 'Nàng nói: “Đây là tớ gái của em, Bil-ha. Anh hãy ăn ở với nó, để nó sinh con trên đầu gối em[a], và nhờ nó, em cũng sẽ được gây dựng[b].”'
  rationale: Chỉ thay «được dựng nên» bằng «được gây dựng» và điều chỉnh chú thích tương ứng. Sửa đổi này cải thiện tính tự nhiên của tiếng Việt, đồng thời giữ hình ảnh của gốc בנה và không thu hẹp nó thành một cách diễn giải duy nhất là «có con».
