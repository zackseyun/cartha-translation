  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: vi
  text: 'Nàng nói: “Đây là tớ gái của em, Bil-ha. Anh hãy ăn ở với nó, để nó sinh con trên đầu gối em[a], và nhờ nó, em cũng sẽ được gây dựng[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “sinh trên đầu gối em”; có lẽ nói đến một tập tục trong đó người vợ tượng trưng tiếp nhận đứa con do tớ gái sinh ra như con của mình.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “nhờ nó, em cũng sẽ có con.” Tiếng Hê-bơ-rơ dùng hình ảnh “được gây dựng” để nói về việc được gây dựng qua con cái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: tớ gái của em
  rationale: אמה chỉ một nữ đầy tớ hoặc nữ nô lệ. “Tớ gái” ngắn gọn, tự nhiên trong bối cảnh cổ đại và giữ được địa vị lệ thuộc, dù chú thích làm rõ sắc thái xã hội.
- source_word: בֹּא אֵלֶיהָ
  choice: hãy ăn ở với nó
  rationale: Đây là uyển ngữ Hê-bơ-rơ chỉ quan hệ tình dục. “Ăn ở với” là cách diễn đạt kín đáo, dễ hiểu trong tiếng Việt, không sao chép cứng hình ảnh “đi vào” vốn dễ gây khó hiểu.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: để nó sinh con trên đầu gối em
  rationale: Giữ nguyên hình ảnh văn hóa đặc thù “trên đầu gối” và dùng chú thích để giải thích nghi thức tượng trưng tiếp nhận đứa trẻ làm con của người vợ.
- source_word: וְאִבָּנֶה
  choice: em cũng sẽ được dựng nên
  rationale: Dạng Niphal của בנה mang nghĩa đen “được xây/dựng nên” và trong ngữ cảnh ám chỉ việc gây dựng gia đình qua con cái. Bản dịch giữ ẩn dụ thay vì giải nghĩa hoàn toàn trong chính văn.
- source_word: מִמֶּנָּה
  choice: nhờ nó
  rationale: Giới từ diễn tả Bil-ha là phương tiện để Ra-chên có con và được gây dựng gia đình; “nhờ nó” tự nhiên trong tiếng Việt.
- source_word: גַם אָנֹכִי
  choice: em cũng
  rationale: Giữ sắc thái nhấn mạnh sự tương phản giữa tình trạng hiếm muộn hiện tại của Ra-chên và kết quả nàng mong đợi.
theological_decisions:
- issue: Ẩn dụ “được dựng nên” có thể được hiểu là được gây dựng gia đình hay có con.
  choice: Giữ “được dựng nên” trong chính văn và giải thích trong chú thích.
  alternative: “em cũng sẽ có con nhờ nó” hoặc “gia đình em cũng sẽ được gây dựng nhờ nó”
  rationale: Cách này bảo tồn ẩn dụ và sự cô đọng của nguyên bản, không thu hẹp ý nghĩa chỉ còn hành vi sinh con.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “nàng/em/anh/nó” phản ánh lời Ra-chên nói với chồng và địa vị lệ thuộc của Bil-ha trong bối cảnh cổ đại. Tên riêng được phiên âm theo lối Việt hóa: Bil-ha.'
