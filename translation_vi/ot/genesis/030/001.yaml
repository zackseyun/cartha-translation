base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: vi
  text: 'Khi Ra-chên thấy mình không sinh cho Gia-cốp một người con nào, nàng ghen tị với chị mình và nói với Gia-cốp: “Hãy cho em con cái, nếu không, em chết mất!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל
  choice: Khi Ra-chên thấy
  rationale: Dùng mệnh đề thời gian để liên kết tự nhiên điều Ra-chên nhận thấy với phản ứng tiếp theo, đồng thời giữ tên riêng ở đầu câu.
- source_word: כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: mình không sinh cho Gia-cốp một người con nào
  rationale: יָלַד ở Qal với chủ thể nữ có nghĩa là sinh con; giới từ לְ được giữ tự nhiên bằng “cho”. Cụm “một người con nào” diễn đạt đối tượng được ngầm hiểu mà không giới hạn giới tính.
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: nàng ghen tị với chị mình
  rationale: קנא trong ngữ cảnh này chỉ sự đố kỵ trước khả năng sinh con của người chị. “Ghen tị với” là cách nói hiện đại, tự nhiên; đại từ tránh lặp tên nặng nề trong tiếng Việt.
- source_word: הָבָה לִּי בָנִים
  choice: Hãy cho em con cái
  rationale: בָנִים về hình thức là “các con trai”, nhưng trong lời cầu có con này có thể chỉ con cái nói chung. “Em” phản ánh tự nhiên cách người vợ nói với chồng trong tiếng Việt mà không thêm nội dung thần học.
- source_word: וְאִם אַיִן
  choice: nếu không
  rationale: Giữ sát cấu trúc điều kiện ngắn gọn và sức ép của lời nói.
- source_word: מֵתָה אָנֹכִי
  choice: em chết mất
  rationale: Cách nói này giữ sắc thái tuyệt vọng, trực tiếp và cường điệu có thể có của nguyên văn, tự nhiên hơn “em sẽ chết” trong lời thoại tiếng Việt.
theological_decisions:
- issue: Đòi Gia-cốp ban con cái
  choice: Giữ nguyên lời trực tiếp “Hãy cho em con cái”
  alternative: Diễn giải rằng Ra-chên chỉ bộc lộ nỗi tuyệt vọng hoặc cầu xin Đức Chúa Trời
  rationale: Nguyên văn đặt lời đòi hỏi trực tiếp với Gia-cốp; bản dịch không làm dịu nghịch lý hay giải thích động cơ thần học thay cho văn bản.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các tên truyền thống “Ra-chên” và “Gia-cốp”; dùng “nàng” trong lời kể và cặp xưng hô “em” với chồng để lời thoại tự nhiên.
