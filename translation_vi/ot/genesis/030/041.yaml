  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/כָל יַחֵם֮ הַ/צֹּ֣אן הַ/מְקֻשָּׁרוֹת֒ וְ/שָׂ֨ם יַעֲקֹ֧ב אֶת הַ/מַּקְל֛וֹת לְ/עֵינֵ֥י הַ/צֹּ֖אן בָּ/רֳהָטִ֑ים לְ/יַחְמֵ֖/נָּה בַּ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: vi
  text: Mỗi khi những con khỏe mạnh trong đàn giao phối[a], Gia-cốp đặt các cành cây trước mắt chúng, trong các máng uống nước[b], để chúng giao phối giữa những cành cây ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “động dục”; cụm từ này nói đến lúc các con vật khỏe mạnh trong đàn đến kỳ phối giống.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong các rãnh dẫn nước”; từ Hê-bơ-rơ chỉ nơi đàn vật đến uống nước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל
  choice: Mỗi khi
  rationale: Cấu trúc này diễn tả hoàn cảnh lặp đi lặp lại trong mạch kể; “Mỗi khi” tự nhiên và giữ được sắc thái thường lệ.
- source_word: יַחֵם
  choice: giao phối
  rationale: Trong ngữ cảnh chăn nuôi, động từ chỉ việc động dục/phối giống; “giao phối” diễn đạt rõ hành vi mà không đồng nhất nó với thụ thai.
- source_word: הַצֹּאן
  choice: đàn
  rationale: Danh từ tập hợp này có thể bao gồm cả chiên lẫn dê; “đàn” tránh thu hẹp quá mức vào một loài.
- source_word: הַמְקֻשָּׁרוֹת
  choice: những con khỏe mạnh
  rationale: Từ này đối lập với những con yếu ở câu kế tiếp và chỉ những con cường tráng, khỏe hơn trong đàn.
- source_word: וְשָׂם
  choice: Gia-cốp đặt
  rationale: Động từ có nghĩa là đặt hoặc để; trong hoàn cảnh lặp lại, tiếng Việt không cần thêm dấu hiệu thì riêng vì “Mỗi khi” đã biểu thị tính thường lệ.
- source_word: הַמַּקְלוֹת
  choice: các cành cây
  rationale: Đây là những cành/que Gia-cốp đã lấy và bóc vỏ ở văn cảnh trước; “cành cây” duy trì liên kết ấy tự nhiên hơn “gậy”.
- source_word: לְעֵינֵי הַצֹּאן
  choice: trước mắt chúng
  rationale: Giữ hình ảnh thị giác của nguyên văn, đồng thời dùng đại từ để tránh lặp nặng nề.
- source_word: בָּרֳהָטִים
  choice: trong các máng uống nước
  rationale: Chỉ các máng hoặc rãnh dẫn nước nơi đàn vật đến uống; cách dịch này rõ nghĩa trong bối cảnh.
- source_word: לְיַחְמֶנָּה
  choice: để chúng giao phối
  rationale: Tiền tố לְ biểu thị mục đích; cách dịch giữ ý định của Gia-cốp nhưng không khẳng định chắc chắn quan hệ nhân quả.
- source_word: בַּמַּקְלוֹת
  choice: giữa những cành cây ấy
  rationale: Giới từ בְּ ở đây có sắc thái vị trí/hoàn cảnh; “giữa” giữ gần nguyên văn và liên kết với các cành đã được đặt trước mặt đàn vật.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đàn” để không xác định riêng chiên hay dê; dùng “giao phối” vì chính xác trong ngữ cảnh chăn nuôi. Mọi ký hiệu chú thích đều được đặt trong chính văn.
