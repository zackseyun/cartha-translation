source:
  edition: WLC
  text: וַ/תֵּ֣רֶא לֵאָ֔ה כִּ֥י עָמְדָ֖ה מִ/לֶּ֑דֶת וַ/תִּקַּח֙ אֶת זִלְפָּ֣ה שִׁפְחָתָ֔/הּ וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/יַעֲקֹ֖ב לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: vi
  text: Khi Lê-a thấy mình đã thôi sinh con[a], bà đem Xinh-pa, nữ tỳ của mình[b], trao cho Gia-cốp làm vợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã ngừng sinh con”; thành ngữ Hê-bơ-rơ có nghĩa là “đã thôi sinh nở.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đầy tớ gái của mình”; từ Hê-bơ-rơ cũng có thể chỉ một nữ nô lệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Khi Lê-a thấy
  rationale: Dạng waw liên tiếp thúc đẩy mạch kể; “khi” diễn đạt tự nhiên mối liên hệ thời gian giữa điều Lê-a nhận thấy và hành động tiếp theo.
- source_word: כִּי
  choice: thấy mình đã
  rationale: כִּי ở đây dẫn nội dung Lê-a nhận thấy, không nhất thiết nêu nguyên nhân; cấu trúc tiếng Việt dùng “thấy mình đã…” truyền đạt tự nhiên quan hệ này.
- source_word: עָמְדָה מִלֶּדֶת
  choice: đã thôi sinh con
  rationale: Thành ngữ עמד + מן + động từ nguyên mẫu có nghĩa là ngừng hoặc thôi làm một việc. “Sinh con” thể hiện rõ ngữ cảnh sinh nở mà vẫn gọn và tự nhiên.
- source_word: שִׁפְחָתָהּ
  choice: nữ tỳ của mình
  rationale: שִׁפְחָה chỉ một nữ gia nhân hoặc nữ nô lệ. “Nữ tỳ” giữ được giới tính và địa vị lệ thuộc trong gia đình; chú thích nêu cách dịch hiện đại hơn.
- source_word: וַתִּקַּח ... וַתִּתֵּן
  choice: bà đem ... trao
  rationale: Hai động từ liên tiếp kể hành động Lê-a lấy/đem Xinh-pa rồi giao nàng cho Gia-cốp; “đem… trao” tự nhiên trong tiếng Việt và giữ trình tự hành động.
- source_word: לְאִשָּׁה
  choice: làm vợ
  rationale: Cụm נתן ל... לאשה là cách nói về việc trao một người nữ cho ai làm vợ. “Làm vợ” giữ nguyên ngôn ngữ hôn nhân của câu, không thay bằng thuật ngữ “vợ lẽ” vốn không xuất hiện tại đây.
- source_word: זִלְפָּה
  choice: Xinh-pa
  rationale: Phiên âm tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: לְיַעֲקֹב
  choice: cho Gia-cốp
  rationale: Giới từ לְ trong cấu trúc này đánh dấu người nhận; “cho Gia-cốp” là cách diễn đạt trực tiếp, tự nhiên.
theological_decisions:
- issue: Địa vị của Xinh-pa trong gia đình và ngôn ngữ hôn nhân
  choice: Dịch שִׁפְחָה là “nữ tỳ” và לְאִשָּׁה là “làm vợ”, giữ cả địa vị lệ thuộc lẫn cách gọi hôn nhân.
  alternative: Dịch “đầy tớ gái/nữ nô lệ” và “làm vợ lẽ”.
  rationale: Bản Hê-bơ-rơ gọi Xinh-pa là שִׁפְחָה của Lê-a, đồng thời nói bà được trao cho Gia-cốp לְאִשָּׁה. Không nên làm nhẹ địa vị lệ thuộc, nhưng cũng không nên đưa thuật ngữ kỹ thuật “vợ lẽ” vào khi câu này không dùng từ tương ứng.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng các tên quen thuộc “Lê-a”, “Xinh-pa”, “Gia-cốp”. “Nữ tỳ” hơi mang sắc thái truyền thống nhưng ngắn gọn và bảo toàn địa vị giới tính-lệ thuộc; chú thích cung cấp cách diễn đạt hiện đại và nêu chiều nghĩa nô lệ của từ nguồn.
