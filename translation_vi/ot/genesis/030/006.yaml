base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: vi
  text: 'Ra-chên nói: “Đức Chúa Trời đã xét xử vụ việc của tôi; Ngài cũng đã nghe tiếng tôi và ban cho tôi một con trai.” Vì thế, bà đặt tên cho con là Đan[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Đan chơi chữ với động từ Hê-bơ-rơ có nghĩa là “xét xử” hoặc “đã xét xử”.
    reason: Giải thích lối chơi chữ giữa דָּנַנִּי và tên דָּן mà bản dịch tiếng Việt không thể hiện trọn vẹn.
lexical_decisions:
- source_word: דָּנַנִּי
  choice: đã xét xử vụ việc của tôi
  rationale: Giữ sắc thái pháp lý của động từ דין và mối liên hệ với tên Đan, nhưng không diễn giải mạnh thành “minh oan cho tôi”; cách nói này cũng tự nhiên hơn “đã xét xử tôi” trong ngữ cảnh Ra-chên coi việc có con là phán quyết thuận lợi.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít và ngữ cảnh chỉ Đức Chúa Trời; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: שָׁמַע בְּקֹלִי
  choice: đã nghe tiếng tôi
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ thay vì giản lược thành “đã nghe tôi”.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: và ban cho tôi một con trai
  rationale: Diễn đạt trực tiếp נתן và giữ rõ giới tính nam của בֵּן; “ban” phù hợp khi chủ thể là Đức Chúa Trời.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Chuyển tải quan hệ suy luận dẫn vào lời giải thích việc đặt tên bằng tiếng Việt tự nhiên.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: bà đặt tên con là Đan
  rationale: Thành ngữ “gọi tên nó” được chuyển sang cách nói tự nhiên trong tiếng Việt, đồng thời vẫn giữ tên Đan để bảo toàn lối chơi chữ.
- source_word: דָּן
  choice: Đan
  rationale: Dạng phiên âm quen thuộc trong tiếng Việt, giữ mối liên hệ âm thanh với động từ Hê-bơ-rơ mang nghĩa xét xử.
theological_decisions:
- issue: Ý nghĩa lời Ra-chên nói về hành động xét xử của Đức Chúa Trời
  choice: Đức Chúa Trời đã xét xử vụ việc của tôi
  alternative: Đức Chúa Trời đã xét xử tôi; Đức Chúa Trời đã minh oan cho tôi
  rationale: Bản dịch duy trì ẩn dụ pháp lý và hàm ý phán quyết có lợi trong ngữ cảnh, nhưng tránh biến hàm ý ấy thành tuyên bố thần học mạnh hơn như “minh oan”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ra-chên”, “Đan” theo lối phiên âm tên riêng quen thuộc; đại từ “bà” giúp lời kể tự nhiên, còn “Ngài” thể hiện sự tôn kính mà không thêm nội dung giáo phái.
