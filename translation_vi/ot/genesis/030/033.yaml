    rationale: 'גָּנוּב הוּא אִתִּי là mệnh đề kết luận: bất cứ con vật nào thuộc các loại không được thỏa thuận mà ở/tìm thấy nơi Gia-cốp thì bị coi là của ăn cắp. Điều kiện này áp dụng cho cả dê và chiên.'
