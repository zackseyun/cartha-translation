- from: '“Sau này, sự ngay thẳng của tôi sẽ làm chứng cho tôi[a], khi ông đến kiểm tra tiền công của tôi[b]: bất cứ con dê nào ở chỗ tôi mà không có đốm nhỏ hay đốm vá, và bất cứ con chiên nào không có màu sẫm[c], đều sẽ bị kể là đồ ăn cắp[d].”


