base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: vi
  text: '“Sau này[b], sự ngay thẳng của tôi sẽ làm chứng cho tôi[a], khi ông đến kiểm tra tiền công của tôi: mọi con dê không có đốm nhỏ hay mảng đốm, và mọi con chiên không có màu sẫm[c], nếu được tìm thấy ở chỗ tôi, sẽ bị xem là của ăn cắp[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự công chính của tôi” hoặc “lòng trung thực của tôi”. Trong thỏa thuận về tiền công này, từ Hê-bơ-rơ chỉ sự ngay thẳng của Gia-cốp, điều có thể được kiểm chứng.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “vào ngày mai, khi ông đến xem xét tiền công của tôi trước mặt ông”. “Ngày mai” ở đây có thể chỉ ngày hôm sau hoặc một thời điểm về sau khi La-ban kiểm tra đàn vật.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “màu nâu”; từ Hê-bơ-rơ chỉ một con vật có màu tối.
    reason: lexical_alternative
  - marker: d
    text: 'Tiếng Hê-bơ-rơ diễn đạt ngắn gọn: “là của ăn cắp ở chỗ tôi”, nghĩa là bất cứ con vật nào như thế được tìm thấy nơi Gia-cốp đều bị xem là của ăn cắp.'
    reason: translation_clarity
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: sẽ làm chứng cho tôi
  rationale: Động từ ענה trong ngữ cảnh này mang ý nghĩa đưa ra lời đáp hay lời chứng; giới từ בִּי cho thấy sự ngay thẳng của Gia-cốp sẽ làm chứng có lợi cho ông.
- source_word: צִדְקָתִי
  choice: sự ngay thẳng của tôi
  rationale: Cách dịch này giữ sắc thái đạo đức của từ Hê-bơ-rơ nhưng phù hợp với bối cảnh một thỏa thuận tiền công có thể được kiểm chứng; chú thích bảo lưu các khả năng “sự công chính” và “lòng trung thực”.
- source_word: בְּיוֹם מָחָר
  choice: sau này
  rationale: Cụm từ có nghĩa đen là “vào ngày mai” nhưng trong ngữ cảnh có thể chỉ rộng hơn đến lần kiểm tra về sau; chú thích giữ lại nghĩa đen và sự mơ hồ về thời điểm.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: khi ông đến kiểm tra tiền công của tôi
  rationale: “Kiểm tra” diễn đạt chức năng thực tế của việc La-ban đến xem xét phần tiền công; yếu tố לְפָנֶיךָ được giải thích trong chú thích vì dịch sát là “trước mặt ông” sẽ dư thừa trong tiếng Việt.
- source_word: נָקֹד וְטָלוּא
  choice: có đốm nhỏ hay đốm vá
  rationale: 'Hai cách mô tả được phân biệt: נָקֹד là những đốm nhỏ, còn טָלוּא là các mảng hay đốm vá. “Hay” diễn đạt tự nhiên phạm vi phủ định: con dê không mang một trong hai dấu hiệu ấy.'
- source_word: חוּם
  choice: màu sẫm
  rationale: Từ này chỉ màu tối, có thể cụ thể là màu nâu; “màu sẫm” tránh xác định quá mức, còn khả năng “màu nâu” được ghi trong chú thích.
- source_word: בַּכְּשָׂבִים
  choice: con chiên
  rationale: Danh từ chỉ chiên, có thể nhấn mạnh chiên non; “con chiên” tự nhiên trong tiếng Việt và không xác định độ tuổi quá mức.
- source_word: גָּנוּב הוּא אִתִּי
  choice: đều sẽ bị kể là đồ ăn cắp
  rationale: 'Mệnh đề Hê-bơ-rơ rất cô đọng và có ý nghĩa quy kết: con vật không đúng đặc điểm đã thỏa thuận mà được tìm thấy nơi Gia-cốp sẽ bị xem là vật ăn cắp.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ông” phù hợp với lời Gia-cốp nói trực tiếp với La-ban; “tiền công” giữ rõ bối cảnh thỏa thuận lao động. Bản dịch ưu tiên sự tự nhiên của tiếng Việt nhưng dùng chú thích để bảo lưu lối nói cô đọng và những điểm mơ hồ của tiếng Hê-bơ-rơ.
