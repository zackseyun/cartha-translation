    rationale: Nguyên ngữ có נָקֹד וְטָלוּא, “có đốm nhỏ và có mảng đốm.” Dưới phủ định, tiếng Việt “không có đốm nhỏ hay mảng đốm” diễn đạt tự nhiên việc không có bất cứ dấu hiệu nào trong hai dấu hiệu này mà không thay liên từ nguồn thành một lựa chọn loại trừ.
