  rationale: Bản sửa giữ cách hiểu hợp ngữ cảnh của các cụm “sau này” và “kiểm tra tiền công,” đồng thời sửa liên từ mô tả dê, làm rõ rằng điều kiện “ở chỗ tôi” áp dụng cho toàn bộ các con vật nêu ra, và dùng lối diễn đạt hiện đại hơn cho quy kết “bị đánh cắp.” Chú thích b được neo ở “Sau này” vì chú thích này giải thích trực tiếp cụm “vào ngày mai.”
