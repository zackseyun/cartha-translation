    [b] Nguyên văn: “vào ngày mai, khi ông đến xem xét tiền công của tôi trước mặt ông”. “Ngày mai” ở đây có thể chỉ ngày hôm sau hoặc một thời điểm về sau khi La-ban kiểm tra đàn vật.

    [c] Cũng có thể dịch là “màu nâu”; từ Hê-bơ-rơ chỉ một con vật có màu tối.

    [d] Tiếng Hê-bơ-rơ diễn đạt ngắn gọn: “là đồ ăn cắp ở chỗ tôi”, nghĩa là bất cứ con vật nào như thế được tìm thấy nơi Gia-cốp đều bị kể là đồ ăn cắp.'
