lexical_decisions:
- source_word: הֵן
  choice: Được
  rationale: Trong lời đáp này, từ này biểu thị sự đồng ý, tương ứng tự nhiên với “Được” trong tiếng Việt hiện đại.
- source_word: לוּ יְהִי
  choice: cứ theo
  rationale: Cấu trúc ước nguyện thể hiện sự chấp thuận cho điều vừa đề nghị được thực hiện; “cứ theo” truyền đạt tự nhiên lực ý này.
- source_word: כִדְבָרֶךָ
  choice: lời ông nói
  rationale: Giữ hình ảnh “lời” của nguyên ngữ, đồng thời thêm “nói” để câu tiếng Việt rõ và tự nhiên; “ông” phù hợp với lời đối thoại giữa hai người nam trưởng thành.
