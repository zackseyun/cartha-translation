  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: vi
  text: 'Nàng thụ thai và sinh một con trai, rồi nói: “Đức Chúa Trời đã cất nỗi nhục của tôi đi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời đã xóa bỏ sự ô nhục của tôi” hoặc “nỗi hổ thẹn của tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: Nàng thụ thai
  rationale: Động từ הרה chỉ việc thụ thai, mang thai; “thụ thai” ngắn gọn, tự nhiên trong văn phong Kinh Thánh và giữ đúng trình tự câu chuyện.
- source_word: וַתֵּלֶד בֵּן
  choice: và sinh một con trai
  rationale: ילד đi với בֵּן có nghĩa trực tiếp là sinh một con trai; cách diễn đạt này trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại.
- source_word: וַתֹּאמֶר
  choice: rồi nói
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “rồi” thể hiện tự nhiên sự kế tiếp trong tiếng Việt mà không làm thay đổi quan hệ ý nghĩa.
- source_word: אָסַף
  choice: đã cất ... đi
  rationale: Trong ngữ cảnh này אסף mang nghĩa loại bỏ hay lấy đi; “đã cất ... đi” giữ sắc thái kết quả đã đạt được và là lối nói tự nhiên.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thái số nhiều nhưng đi với động từ số ít và trong ngữ cảnh chỉ Đức Chúa Trời duy nhất; đây là cách gọi phổ thông, trang trọng trong tiếng Việt.
- source_word: חֶרְפָּתִי
  choice: nỗi nhục của tôi
  rationale: חֶרְפָּה bao gồm sự nhục nhã, hổ thẹn hoặc ô nhục do người khác nhìn nhận; “nỗi nhục” giữ được cả chiều kích cá nhân lẫn xã hội trong bối cảnh son sẻ.
theological_decisions:
- issue: Cách hiểu אֱלֹהִים theo nghĩa số ít
  choice: Đức Chúa Trời
  alternative: các thần
  rationale: Động từ אָסַף ở số ít và ngữ cảnh xác định một chủ thể duy nhất, nên bản dịch số ít là yêu cầu của ngữ pháp, không phải sự diễn giải thêm về thần học.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Đại từ “nàng” nối tự nhiên với nhân vật nữ đã được xác định trong ngữ cảnh. Dấu chú thích [a] đặt sau toàn bộ lời nói vì chú thích giải thích cụm từ ở cuối câu.
