base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: vi
  text: 'Nàng đặt tên con là Giô-sép[a], rồi nói: “Nguyện Yahweh thêm cho tôi một con trai nữa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Giô-sép chơi chữ với động từ Hê-bơ-rơ có nghĩa là “nguyện Ngài thêm” hoặc “Ngài thêm.”
    reason: Giải thích lối chơi chữ giữa tên יוֹסֵף và động từ יֹסֵף, đồng thời giữ các sắc thái khả dĩ của động từ.
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: Nàng đặt tên con là
  rationale: Cụm Hê-bơ-rơ theo sát mặt chữ là “gọi tên nó”, nhưng trong tiếng Việt hiện đại, “đặt tên con là” diễn đạt tự nhiên và chính xác công thức đặt tên; “con” quy chiếu rõ đến đứa trẻ vừa sinh.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: và nói
  rationale: Động từ nguyên mẫu dùng để dẫn lời được chuyển thành cấu trúc kể chuyện tự nhiên trong tiếng Việt.
- source_word: יֹסֵף
  choice: Nguyện ... ban thêm
  rationale: Thể Hiphil của יסף mang nghĩa “thêm”; trong ngữ cảnh đặt tên, hình thức này diễn đạt lời ước nguyện hay cầu xin. “Ban thêm” tự nhiên trong tiếng Việt khi đối tượng được mong xin là một người con.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng tước hiệu; “Giê-hô-va” là dạng danh xưng quen thuộc và dễ nhận biết trong tiếng Việt hiện đại.
- source_word: לִי
  choice: cho tôi
  rationale: Giới từ לִי chỉ người nhận hay người được lợi; “cho tôi” là cách diễn đạt tự nhiên với động từ “ban thêm”.
- source_word: בֵּן אַחֵר
  choice: một con trai nữa
  rationale: Giữ nghĩa cụ thể của בֵּן là “con trai” và diễn đạt אַחֵר tự nhiên bằng “nữa”.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Bản dịch giữ một dạng phiên âm danh ấy, không thay bằng tước hiệu; “Đức Giê-hô-va” phù hợp lối gọi trang trọng, dễ hiểu trong tiếng Việt.
- issue: Sắc thái của יֹסֵף
  choice: 'Lời cầu chúc: “Nguyện ... ban thêm”'
  alternative: 'Lời khẳng định: “Đức Giê-hô-va sẽ ban thêm”'
  rationale: Hình thức động từ có thể được hiểu theo nét chưa hoàn thành, nhưng lời giải thích tên trong ngữ cảnh này phù hợp nhất với một lời ước nguyện. Bản dịch không biến lời nói thành một lời tiên tri chắc chắn.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “nàng” để tiếp nối nhân vật nữ trong mạch văn và “con” để nói tự nhiên về đứa trẻ; lời cầu xin ngắn gọn, dễ hiểu. Dấu chú thích [a] xuất hiện ngay sau tên gọi.
