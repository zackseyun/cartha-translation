    rationale: Nguồn có יהוה, và English POB audit trail quy định nhất quán phiên âm danh này là “Yahweh”. Thay đổi này không đụng đến nghĩa nhưng cần thiết để nhất quán thuật ngữ dự án.
  - severity: low
    issue: “Ban thêm” thêm sắc thái ‘ban cho/give’ không có trực tiếp trong יסף.
    rationale: יסף nghĩa là “thêm, gia thêm”. Cấu trúc “Yahweh thêm cho tôi một con trai nữa” giữ được nghĩa lời cầu xin mà không thêm động từ ‘ban’.
  - severity: low
    issue: Chú thích nói tên Giô-sép “có âm gần với” động từ và dùng “người” không rõ chủ thể.
    rationale: Đây là lối chơi chữ trực tiếp giữa tên יוֹסֵף và động từ יֹסֵף. Chú thích nên diễn đạt quan hệ này chính xác hơn và phản ánh các khả năng “nguyện Ngài thêm”/“Ngài thêm”.
