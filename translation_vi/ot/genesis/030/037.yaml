revisions:
- from: Bấy giờ, Gia-cốp lấy những cành mới chặt của cây bạch dương[a], cây hạnh nhân[b] và cây tiêu huyền[c], rồi bóc vỏ thành những sọc trắng, để lộ phần gỗ trắng của các cành ấy.
  to: Bấy giờ, Gia-cốp lấy cho mình những cành tươi của cây dương[a], cây hạnh nhân[b] và cây tiêu huyền[c], rồi bóc vỏ các cành ấy, tạo thành những vệt trắng, làm lộ phần gỗ trắng trên các cành.
