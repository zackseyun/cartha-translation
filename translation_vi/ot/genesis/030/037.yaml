base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: vi
  text: Bấy giờ, Gia-cốp lấy cho mình những cành tươi của cây dương[a], cây hạnh nhân[b] và cây tiêu huyền[c], rồi bóc vỏ các cành ấy, tạo thành những vệt trắng, làm lộ phần gỗ trắng trên các cành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “cây an tức hương”; việc định danh chính xác לִבְנֶה chưa chắc chắn, dù “cây dương” là cách dịch phổ biến.
    reason: lexical_alternative
  - marker: b
    text: Một số bản dịch cũ dịch לוּז là “cây phỉ”, nhưng “cây hạnh nhân” có khả năng đúng hơn.
    reason: lexical_alternative
  - marker: c
    text: Một số bản dịch cũ dịch עֶרְמוֹן là “cây dẻ”, nhưng “cây tiêu huyền” có khả năng đúng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: cành
  rationale: Trong ngữ cảnh, đây là những cành cây đã chặt dùng trong việc phối giống đàn vật; “cành” cụ thể và tự nhiên hơn “gậy” trong tiếng Việt.
- source_word: לִבְנֶה לַח
  choice: cành mới chặt của cây bạch dương
  rationale: לַח chỉ tình trạng còn tươi hoặc ẩm, nên diễn đạt là “mới chặt”; לִבְנֶה thường được hiểu là cây bạch dương/poplar, dù việc định danh chính xác còn chưa chắc chắn.
- source_word: לוּז
  choice: cây hạnh nhân
  rationale: Từ Hê-bơ-rơ này nhiều khả năng chỉ cây hạnh nhân hơn là cây phỉ theo một số truyền thống dịch cũ.
- source_word: עֶרְמוֹן
  choice: cây tiêu huyền
  rationale: Thường được định danh là plane tree; “cây tiêu huyền” là tên gọi tiếng Việt phù hợp, thay vì cây dẻ theo truyền thống cũ.
- source_word: וַיְפַצֵּל
  choice: bóc vỏ
  rationale: Hành động trong ngữ cảnh là bóc lớp vỏ ngoài của cành để phần gỗ sáng màu hiện ra.
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: thành những sọc trắng
  rationale: Cụm từ mô tả các mảng vỏ bị bóc tạo nên những vệt trắng dễ thấy; “sọc trắng” truyền đạt rõ kết quả thị giác.
- source_word: מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל הַמַּקְלוֹת
  choice: để lộ phần gỗ trắng của các cành ấy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, làm rõ phần màu trắng được lộ ra khi bóc vỏ mà không thêm ý ngoài ngữ cảnh.
