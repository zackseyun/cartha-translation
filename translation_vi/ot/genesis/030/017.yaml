base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: vi
  text: Đức Chúa Trời đã lắng nghe Lê-a[a]; bà thụ thai và sinh cho Gia-cốp người con trai thứ năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đức Chúa Trời đã nghe Lê-a.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: đã nhậm lời
  rationale: Cụm שׁמע אֶל trong ngữ cảnh này không chỉ nói đến việc nghe bằng tai mà hàm ý lắng nghe cách thuận tình và đáp lại. “Nhậm lời” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt, đồng thời chú thích giữ lại cách dịch sát hơn.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong lối văn Kinh Thánh tiếng Việt, đây là cách gọi trang trọng và quen thuộc dành cho Đức Chúa Trời duy nhất trong trình thuật.
- source_word: לֵאָה
  choice: Lê-a
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: וַתַּהַר
  choice: bà thụ thai
  rationale: “Thụ thai” ngắn gọn, trang trọng và rõ nghĩa trong trình thuật sinh nở.
- source_word: וַתֵּלֶד לְיַעֲקֹב
  choice: sinh cho Gia-cốp
  rationale: Cách nói này tự nhiên trong tiếng Việt và bảo toàn quan hệ được biểu thị bởi giới từ לְ.
- source_word: בֵּן חֲמִישִׁי
  choice: người con trai thứ năm
  rationale: Diễn đạt rõ số thứ tự của người con trai trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sắc thái về sự đáp lời của Đức Chúa Trời trong שׁמע אֶל
  choice: “Đức Chúa Trời đã nhậm lời Lê-a” — hiểu là Ngài thuận nghe và đáp lại bà.
  alternative: “Đức Chúa Trời đã nghe Lê-a.”
  rationale: Nguyên ngữ có thể dịch sát là “nghe”, nhưng cấu trúc שׁמע אֶל trong mạch văn hàm ý sự chú ý dẫn đến hành động đáp lại. Bản chính dùng “nhậm lời”, còn chú thích bảo tồn cách hiểu rộng và sát chữ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên riêng theo dạng quen thuộc trong Kinh Thánh tiếng Việt; giữ nhịp kể cô đọng của nguyên văn.
