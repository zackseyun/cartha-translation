base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/011.yaml
  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: vi
  text: 'Lê-a nói[a]: “May mắn!” Rồi bà đặt tên con là Gát.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ בגד khó hiểu. Có thể hiểu là tiếng reo “May mắn!”; theo một cách dịch truyền thống khác, là “Một đạo quân!” Tên Gát có âm gần với từ Hê-bơ-rơ liên hệ trong lối chơi chữ này.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: nói
  rationale: Động từ wayyiqtol của אמר tiếp nối trình thuật; tiếng Việt không cần dịch máy móc liên từ וַ bằng “và” ở đầu câu.
- source_word: לֵאָה
  choice: Lê-a
  rationale: Dạng phiên âm tiếng Việt rõ ràng của tên riêng Leah.
- source_word: בגד
  choice: May mắn quá!
  rationale: Cụm Hê-bơ-rơ khó xác định này nhiều khả năng là một tiếng reo liên quan đến גָּד, nghĩa là vận may; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ được sự liên hệ với việc đặt tên, còn cách hiểu truyền thống “Một đạo quân!” được ghi ở chú thích.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: Vì vậy, bà đặt tên cho con là
  rationale: Trong ngữ cảnh đặt tên, קרא את שמו được chuyển thành lối nói tự nhiên của tiếng Việt; “Vì vậy” diễn tả mạch kết quả từ lời reo đến việc đặt tên.
- source_word: גָּד
  choice: Gát
  rationale: Phiên âm tên riêng theo cách đọc gần âm Hê-bơ-rơ và thuận với chính tả tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” để quy chiếu Lê-a một cách tự nhiên; giữ dấu cảm thán và chú thích nhằm bảo toàn sự không chắc chắn của nguyên văn cùng lối chơi chữ khi đặt tên.
