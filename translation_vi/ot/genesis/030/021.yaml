  text: וְ/אַחַ֖ר יָ֣לְדָה בַּ֑ת וַ/תִּקְרָ֥א אֶת שְׁמָ֖/הּ דִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/021.yaml
  text: Afterward she bore a daughter and called her name Dinah.
translation:
  language: vi
  text: Sau đó, bà sinh một con gái và đặt tên là Đi-na.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Sau đó
  rationale: Cụm từ chỉ thời gian, nối sự kiện này với các lần sinh trước; “Sau đó” tự nhiên và giữ rõ trình tự tường thuật.
- source_word: יָלְדָה
  choice: bà sinh
  rationale: Động từ Qal hoàn thành ngôi 3 giống cái số ít của ילד; “sinh” là cách diễn đạt gọn, tự nhiên trong tiếng Việt khi có tân ngữ “một con gái”.
- source_word: בַּת
  choice: một con gái
  rationale: Danh từ số ít làm tân ngữ của động từ; “một con gái” truyền đạt đúng ý một người con thuộc giới nữ.
- source_word: וַ/תִּקְרָא אֶת שְׁמָהּ
  choice: và đặt tên là
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “gọi tên nàng”; tiếng Việt hiện đại diễn đạt tự nhiên bằng “đặt tên là” mà không làm thay đổi ý nghĩa.
- source_word: דִּינָה
  choice: Đi-na
  rationale: Phiên âm tên riêng sang tiếng Việt theo lối viết quen thuộc, dễ đọc.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “bà” để chỉ người phụ nữ đã được xác định trong ngữ cảnh trước; câu ngắn gọn, giữ nguyên tiến trình của bản Hê-bơ-rơ.
