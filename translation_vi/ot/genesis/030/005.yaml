  text: וַ/תַּ֣הַר בִּלְהָ֔ה וַ/תֵּ֥לֶד לְ/יַעֲקֹ֖ב בֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/005.yaml
  text: Bilhah conceived and bore Jacob a son[a].
translation:
  language: vi
  text: Binh-ha mang thai và sinh cho Gia-cốp một con trai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Binh-ha có thai và sinh một con trai cho Gia-cốp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: mang thai
  rationale: Động từ הרה chỉ việc thụ thai hoặc có thai; “mang thai” tự nhiên, rõ nghĩa trong tiếng Việt và phù hợp với diễn tiến kể chuyện.
- source_word: בִּלְהָה
  choice: Binh-ha
  rationale: Tên riêng được phiên âm theo lối quen dùng trong truyền thống Kinh Thánh tiếng Việt.
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Động từ ילד ở đây có nghĩa là sinh con; “sinh” ngắn gọn, tự nhiên và giữ được nhịp kể.
- source_word: לְיַעֲקֹב
  choice: cho Gia-cốp
  rationale: Giữ rõ giới từ ל, diễn tả đứa con được sinh cho Gia-cốp, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: בֵּן
  choice: một con trai
  rationale: בֵּן nghĩa là “con trai”; từ “một” phù hợp với cấu trúc bất định của câu tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại; dùng “mang thai và sinh” để diễn đạt tự nhiên cặp động từ Hê-bơ-rơ, đồng thời giữ cụm “cho Gia-cốp” nhằm phản ánh giới từ trong nguyên văn.
