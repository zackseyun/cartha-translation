source:
  edition: WLC
  text: וַ/יִּפְרֹ֥ץ הָ/אִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽ/יְהִי ל/וֹ֙ צֹ֣אן רַבּ֔וֹת וּ/שְׁפָחוֹת֙ וַ/עֲבָדִ֔ים וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: vi
  text: Người ấy trở nên vô cùng thịnh vượng và có nhiều đàn chiên dê, các nữ nô lệ và nam nô lệ, lạc đà và lừa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹץ
  choice: trở nên ... thịnh vượng
  rationale: Động từ פרץ vốn gợi ý bứt phá hoặc lan rộng; trong ngữ cảnh tài sản gia tăng mạnh, cách dịch này diễn đạt tự nhiên ý phát đạt vượt bậc.
- source_word: הָאִישׁ
  choice: người ấy
  rationale: Giữ danh từ chung có mạo từ của nguyên văn, đồng thời dùng lối quy chiếu tự nhiên trong tiếng Việt đến Gia-cốp ở ngữ cảnh trước.
- source_word: מְאֹד מְאֹד
  choice: vô cùng
  rationale: Diễn đạt sức nhấn mạnh của trạng từ được lặp đôi mà không tạo câu tiếng Việt gượng gạo.
- source_word: וַיְהִי לוֹ
  choice: có
  rationale: Cấu trúc Hê-bơ-rơ chỉ kết quả sở hữu; trong mạch câu tiếng Việt, 'có' vừa tự nhiên vừa cho thấy những tài sản ông đạt được.
- source_word: צֹאן רַבּוֹת
  choice: nhiều đàn chiên dê
  rationale: צֹאן là gia súc nhỏ, thường bao gồm cả chiên lẫn dê; 'nhiều đàn chiên dê' thể hiện rõ loại vật nuôi và sự dồi dào.
- source_word: שְׁפָחוֹת
  choice: các nữ nô lệ
  rationale: Từ này chỉ những phụ nữ ở địa vị nô thuộc trong gia đình; 'nô lệ' không làm nhẹ đi thực trạng xã hội được nguyên văn trình bày.
- source_word: עֲבָדִים
  choice: nam nô lệ
  rationale: Trong cặp song song với שְׁפָחוֹת và trong danh sách tài sản, từ này chỉ những người nam ở địa vị nô thuộc; nêu 'nam' bảo toàn sự phân biệt giới tính.
- source_word: גְמַלִּים
  choice: lạc đà
  rationale: Tương đương thông dụng và chính xác trong tiếng Việt hiện đại.
- source_word: חֲמֹרִים
  choice: lừa
  rationale: Tương đương thông dụng và chính xác trong tiếng Việt hiện đại.
theological_decisions:
- issue: Dịch các từ chỉ người lao động trong gia đình bằng ngôn ngữ 'nô lệ' hay 'đầy tớ'
  choice: các nữ nô lệ và nam nô lệ
  alternative: các nữ tỳ và tôi tớ nam; các nữ gia nhân và nam gia nhân
  rationale: Hai nhóm người được kể trong danh sách tài sản của Gia-cốp, nên 'nô lệ' phản ánh rõ hơn địa vị nô thuộc trong bối cảnh này. Cách dịch chỉ mô tả thực trạng xã hội của bản văn, không hàm ý tán thành thể chế ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp liệt kê tích lũy của tiếng Hê-bơ-rơ nhưng tránh lặp liên từ quá mức trong tiếng Việt. Không cần chú thích vì các lựa chọn chính có thể thể hiện rõ ngay trong chính văn.
