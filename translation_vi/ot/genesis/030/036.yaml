    issue: “bầy chiên” thu hẹp nghĩa của צֹאן
    rationale: צֹאן là thuật ngữ bao quát cho đàn gia súc nhỏ; ngay trong câu chuyện này đàn của La-ban gồm cả dê và chiên. Dùng “đàn” tránh thêm giới hạn không có trong nguyên văn.
  - severity: low
    issue: Cụm “đặt một khoảng cách ba ngày đường” hơi gượng
    rationale: Nguyên văn dùng “đường/lộ trình ba ngày” như một cách đo khoảng cách. “Để một quãng đường ba ngày đi” tự nhiên hơn mà vẫn bảo toàn ý nghĩa.
  revised_text: Ông để một quãng đường ba ngày đi giữa mình và Gia-cốp; còn Gia-cốp chăn đàn còn lại của La-ban.
