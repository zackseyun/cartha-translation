  text: And he put a distance of three days between himself and Jacob, and Jacob was shepherding the rest of Laban’s flock.
translation:
  language: vi
  text: Ông để một quãng đường ba ngày đi giữa mình và Gia-cốp; còn Gia-cốp chăn đàn còn lại của La-ban.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: Ông đặt một khoảng cách ba ngày đường
  rationale: Diễn đạt tự nhiên đơn vị khoảng cách theo thời gian di chuyển, đồng thời giữ động từ שׂים là “đặt”.
- source_word: בֵּינוֹ וּבֵין יַעֲקֹב
  choice: giữa mình và Gia-cốp
  rationale: Đại từ phản thân “mình” quy chiếu về chủ thể đã được nêu trong văn cảnh (La-ban), đúng cấu trúc Hê-bơ-rơ.
- source_word: רֹעֶה
  choice: chăn
  rationale: Phân từ diễn tả hoạt động đang tiếp diễn của Gia-cốp; tiếng Việt dùng “chăn” tự nhiên và đầy đủ.
- source_word: צֹאן לָבָן הַנּוֹתָרֹת
  choice: phần bầy chiên còn lại của La-ban
  rationale: הַנּוֹתָרֹת bổ nghĩa cho צֹאן theo nghĩa số gia súc còn lại; “phần ... còn lại” làm rõ quan hệ này mà không thêm nội dung.
