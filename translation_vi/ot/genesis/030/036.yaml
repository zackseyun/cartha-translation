translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “ông” theo mạch kể chuyện vì nguyên văn chỉ dùng đại từ; không tự ý thay bằng tên La-ban. Dấu chấm phẩy thể hiện sự chuyển chủ thể giữa hai vế.
