  text: כִּ֡י מְעַט֩ אֲשֶׁר הָיָ֨ה לְ/ךָ֤ לְ/פָנַ/י֙ וַ/יִּפְרֹ֣ץ לָ/רֹ֔ב וַ/יְבָ֧רֶךְ יְהוָ֛ה אֹתְ/ךָ֖ לְ/רַגְלִ֑/י וְ/עַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם אָנֹכִ֖י לְ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: vi
  text: Vì tài sản cậu có trước khi con đến vốn ít ỏi, nay đã gia tăng rất nhiều; Đức Giê-hô-va đã ban phước cho cậu từ khi con đến[a]. Bây giờ, khi nào con mới lo liệu cho gia đình mình[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ở chân con”; thành ngữ này có thể có nghĩa “từ khi con đến” hoặc “nhờ con.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Bây giờ, khi nào con mới làm điều gì đó cho nhà mình?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶר הָיָה לְךָ לְפָנַי
  choice: trước khi con đến, tài sản của cậu chỉ có ít
  rationale: Trong ngữ cảnh, cụm này chỉ số tài sản ít ỏi La-ban có trước khi Gia-cốp đến. Thêm “tài sản” làm rõ đối tượng vốn được ngầm hiểu, còn “trước khi con đến” truyền đạt tự nhiên ý thời gian của לְפָנַי.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: nhưng nay đã tăng lên dồi dào
  rationale: פרץ diễn tả sự phát triển mạnh hoặc bùng lên, còn לָרֹב chỉ kết quả phong phú, nhiều dồi dào. Cách dịch này giữ được cả sự gia tăng lẫn mức độ sung túc.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: לְרַגְלִי
  choice: từ khi con đến
  rationale: Nghĩa đen là “theo chân tôi/tại chân tôi”, nhưng tại đây là thành ngữ gắn phước lành với việc Gia-cốp đến và phục vụ. “Từ khi con đến” phù hợp với sự đối chiếu thời gian trong câu mà không loại trừ sắc thái phước lành đến vì Gia-cốp.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: đến bao giờ con mới được lo liệu cho chính gia đình mình?
  rationale: עשה לְבֵיתִי theo ngữ cảnh có nghĩa hành động nhằm gây dựng hoặc chu cấp cho gia đình mình. “Lo liệu” giữ phạm vi rộng hơn “chu cấp”, còn “chính” thể hiện sự nhấn mạnh của גַם אָנֹכִי.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng, không đồng nhất nó với tước hiệu “Chúa”; chọn hình thức Việt hóa quen thuộc với độc giả phổ thông.
- issue: Quan hệ giữa phước lành và sự hiện diện của Gia-cốp trong לְרַגְלִי
  choice: từ khi con đến
  alternative: vì con; theo chân con
  rationale: Cụm Hê-bơ-rơ có thể mang sắc thái thời gian hoặc nguyên nhân. Bản chính dùng cách diễn đạt thời gian tự nhiên, còn chú thích bảo lưu khả năng hiểu theo nghĩa nguyên nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng gần gũi. Đại từ “con/cậu” phản ánh quan hệ giữa Gia-cốp và nhạc phụ La-ban trong ngữ cảnh; “gia đình” truyền đạt nghĩa hộ gia đình của בֵּיתִי.
