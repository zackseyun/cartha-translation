  verdict: revise
  source_fidelity: 'Cần sửa chủ thể của הָסֵר מִשָּׁם. Dù hình thức có thể được phân tích như mệnh lệnh, trong cấu trúc đề nghị của Gia-cốp sau אֶעֱבֹר, cách hiểu tự nhiên và phù hợp ngữ cảnh là hành động tiếp nối do Gia-cốp thực hiện: ông đi qua đàn và tách các con vật ra. Bản nháp chuyển thành mệnh lệnh bảo La-ban thực hiện, làm thay đổi vai trò trong câu. Ngoài ra, שֶׂה ở nhóm đầu là thuật ngữ khái quát cho một con thuộc đàn gia súc nhỏ; không nên giới hạn ngay thành “con chiên”, vì bản văn chỉ định rõ “chiên” và “dê” ở hai nhóm sau.'
  naturalness: Bản sửa dùng “đàn chiên dê” và “tách ra khỏi đó” theo cách tự nhiên, rõ ràng trong tiếng Việt hiện đại. Việc đặt “hôm nay” sau cụm động từ giúp mạch câu gọn hơn, nhưng vẫn giữ nguyên phạm vi thời gian của nguyên văn.
  terminology: Giữ “lốm đốm” cho נָקֹד, “loang màu” cho טָלוּא, và “sẫm màu” cho חוּם. “Tiền công” phù hợp với שָׂכָר. “Con vật” ở nhóm đầu bảo toàn tính khái quát của שֶׂה mà không áp đặt phân loại không có trong câu.
