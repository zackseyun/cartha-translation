base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: vi
  text: Hôm nay, tôi sẽ đi qua khắp đàn chiên dê của ông, tách ra khỏi đó mọi con vật lốm đốm và loang màu, mọi con chiên sẫm màu[a], cùng mọi con dê loang màu và lốm đốm[b]; đó sẽ là tiền công của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “màu nâu”. Từ Hê-bơ-rơ חוּם chỉ màu tối hoặc nâu của chiên.
    reason: lexical_alternative
  - marker: b
    text: Hai từ được dịch là “lốm đốm” (נָקֹד) và “loang màu” (טָלוּא) đều chỉ các kiểu màu lông có đốm hoặc mảng; sự phân biệt chính xác giữa chúng không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: tôi sẽ đi qua
  rationale: Động từ Qal chưa hoàn thành ngôi thứ nhất số ít có thể mang nghĩa tương lai hoặc ý chí. Trong lời đề nghị của Gia-cốp, “tôi sẽ đi qua” giữ được sắc thái dự định mà không biến nó thành một mệnh lệnh xin phép quá rõ.
- source_word: בְּכָל צֹאנְךָ
  choice: qua toàn bộ đàn chiên dê của ông
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, đặc biệt gồm chiên và dê. “Đàn chiên dê” rõ nghĩa hơn “bầy” đối với độc giả Việt hiện đại và phù hợp với sự phân biệt chiên với dê ở phần sau.
- source_word: הָסֵר מִשָּׁם
  choice: Hãy tách khỏi đó
  rationale: הָסֵר được phân tích theo hình thức Masoret là mệnh lệnh Hifil giống đực số ít, hướng đến La-ban. Cách dịch thành một mệnh lệnh riêng phản ánh trực tiếp ngữ pháp Hê-bơ-rơ, thay vì chuyển thành phân từ “trong khi loại ra” với Gia-cốp là chủ thể.
- source_word: נָקֹד
  choice: lốm đốm
  rationale: Từ này chỉ hoa văn gồm các đốm nhỏ hoặc chấm trên lông con vật; “lốm đốm” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: טָלוּא
  choice: loang màu
  rationale: Từ này chỉ màu lông có các mảng hoặc vệt khác màu. “Loang màu” giúp phân biệt tương đối với נָקֹד, dù ranh giới chính xác giữa hai thuật ngữ không chắc chắn.
- source_word: חוּם
  choice: sẫm màu
  rationale: Tính từ này chỉ màu tối hoặc nâu. “Sẫm màu” tránh xác định quá hẹp là màu nâu, đồng thời giữ sự tương phản về màu lông.
- source_word: בַּכְּשָׂבִים
  choice: con chiên
  rationale: כֶּשֶׂב có thể chỉ chiên hoặc chiên con; trong ngữ cảnh phân loại cả đàn và đối lập với dê, “chiên” là cách gọi tự nhiên, không xác định tuổi quá mức.
- source_word: בָּעִזִּים
  choice: con dê
  rationale: עִזִּים chỉ dê theo nghĩa tập hợp; bản văn không đòi hỏi phải xác định là dê cái.
- source_word: וְהָיָה שְׂכָרִי
  choice: đó sẽ là tiền công của tôi
  rationale: שָׂכָר là tiền công hoặc phần trả cho lao động. Đại từ “đó” quy chiếu tập hợp các con vật vừa được mô tả và giữ cách nói cô đọng của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” phù hợp với lời Gia-cốp nói với La-ban. Tách “Hãy tách khỏi đó” thành mệnh lệnh độc lập để phản ánh hình thái Hê-bơ-rơ; dấu chấm phẩy giữ mối liên hệ chặt giữa các con vật được tách ra và tiền công.
