base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/016.yaml
  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: vi
  text: 'La-ban có hai con gái[a]: người chị tên là Lê-a, còn người em tên là Ra-chên.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “về La-ban có hai con gái”; đây là lối diễn đạt sở hữu trong tiếng Hê-bơ-rơ, có nghĩa là “La-ban có hai con gái.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְלָבָן
  choice: La-ban có
  rationale: Cấu trúc sở hữu tiếng Hê-bơ-rơ theo nghĩa đen là “thuộc về La-ban có”, nhưng trong tiếng Việt tự nhiên mang nghĩa “La-ban có”. Liên từ וּ־ nối với mạch văn, song không cần thêm một trạng từ thời gian như “bấy giờ”.
- source_word: שְׁתֵּי בָנוֹת
  choice: hai con gái
  rationale: Cách dịch trực tiếp và tự nhiên của cụm số từ với danh từ này.
- source_word: שֵׁם הַגְּדֹלָה לֵאָה
  choice: cô chị tên là Lê-a
  rationale: Trong quan hệ giữa hai chị em, הַגְּדֹלָה chỉ người lớn tuổi hơn. “Cô chị” diễn đạt tự nhiên trong tiếng Việt, còn “tên là” chuyển tải công thức Hê-bơ-rơ “tên của... là” mà không nặng nề.
- source_word: וְשֵׁם הַקְּטַנָּה רָחֵל
  choice: còn cô em tên là Ra-chên
  rationale: הַקְּטַנָּה ở đây chỉ người trẻ tuổi hơn, tức cô em. “Còn” thể hiện sự nối kết và đối chiếu song song của וְ־ trong tiếng Việt tự nhiên.
- source_word: לֵאָה / רָחֵל
  choice: Lê-a / Ra-chên
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc và dễ đọc.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ thế đối xứng giữa cô chị và cô em, đồng thời tránh cách diễn đạt quá sát chữ như “tên của người lớn là...” vốn thiếu tự nhiên trong tiếng Việt.
