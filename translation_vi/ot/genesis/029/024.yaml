base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: vi
  text: La-ban trao Xinh-pa, nữ tỳ của mình, cho Lê-a, con gái mình, để làm nữ tỳ cho Lê-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nữ tỳ” dịch từ một từ Hê-bơ-rơ chỉ nữ đầy tớ có địa vị lệ thuộc, rất có thể thuộc thân phận nô lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: trao
  rationale: Động từ נתן có nghĩa cơ bản là “cho”; trong ngữ cảnh một nữ tỳ được giao cho Lê-a, “trao” tự nhiên và vẫn giữ sắc thái chuyển giao mà không diễn giải quá mức.
- source_word: לָהּ
  choice: cho con gái là Lê-a
  rationale: Đại từ có nghĩa đen là “cho nàng”; danh ngữ tiếp theo xác định người nhận là Lê-a, con gái La-ban. Tiếng Việt có thể gộp hai thành phần để câu rõ và tự nhiên.
- source_word: זִלְפָּה
  choice: Xinh-pa
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc trong tiếng Việt.
- source_word: שִׁפְחָתוֹ
  choice: nữ tỳ của mình
  rationale: שִׁפְחָה chỉ một nữ đầy tớ có địa vị lệ thuộc, có thể thuộc thân phận nô lệ. “Nữ tỳ” ngắn gọn, trang trọng và giữ được cả giới tính lẫn địa vị phụ thuộc.
- source_word: לְלֵאָה בִתּוֹ
  choice: cho con gái là Lê-a
  rationale: Giới từ לְ đánh dấu người nhận, còn בִּתּוֹ xác định Lê-a là con gái của La-ban. Cách diễn đạt này tránh khả năng hiểu lầm rằng Lê-a là con gái của Xinh-pa.
- source_word: שִׁפְחָה
  choice: để nàng làm nữ tỳ cho cô
  rationale: Danh từ cuối câu nêu vai trò Xinh-pa đảm nhận đối với Lê-a. Cách diễn đạt bằng mệnh đề mục đích tự nhiên trong tiếng Việt; “nàng” chỉ Xinh-pa và “cô” chỉ Lê-a.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “trao” thay vì “cho” để diễn đạt tự nhiên việc La-ban giao Xinh-pa cho Lê-a; chú thích bảo lưu sắc thái địa vị nô lệ tiềm ẩn trong từ Hê-bơ-rơ.
