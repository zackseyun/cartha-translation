  to: 'Ông hỏi họ[a]: “Ông ấy có khỏe không?” Họ đáp: “Ông ấy khỏe. Kìa, Ra-chên, con gái ông ấy, đang đến cùng bầy chiên.”'
  rationale: Sửa cách gọi đàn vật nuôi để phản ánh đúng hơn và tự nhiên hơn từ צֹאן trong tiếng Việt. Đồng thời chỉnh câu thay thế trong chú thích cho mạch lạc, vẫn giải thích rằng shalom ở đây mang nghĩa an lành, phúc lợi hoặc sức khỏe chứ không chỉ là hòa bình trừu tượng.
