  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: vi
  text: 'Ông hỏi họ[a]: “Ông ấy có khỏe không?” Họ đáp: “Ông ấy khỏe. Kìa, Ra-chên, con gái ông ấy, đang đến cùng bầy chiên.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ông ấy có được bình an không?” Từ Hê-bơ-rơ shalom ở đây nói về tình trạng an lành hay sức khỏe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: Ông ấy có khỏe không?
  rationale: Cụm שָׁלוֹם לוֹ ở đây hỏi về tình trạng và sự an lành của La-ban; cách hỏi này tự nhiên trong tiếng Việt hiện đại và không thu hẹp nghĩa vào sự bình an theo nghĩa trừu tượng.
- source_word: שָׁלוֹם
  choice: Ông ấy khỏe
  rationale: Lời đáp lặp lại ý của câu hỏi và xác nhận La-ban vẫn an lành; thêm chủ ngữ và vị ngữ đầy đủ để câu tiếng Việt rõ ràng, tự nhiên.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: “Kìa” trực tiếp hướng sự chú ý đến người đang xuất hiện trong tầm nhìn, giữ được sắc thái chỉ xuất của הִנֵּה.
- source_word: רָחֵל
  choice: Ra-chên
  rationale: Dùng dạng phiên âm tên riêng Hê-bơ-rơ quen thuộc trong tiếng Việt.
- source_word: בִּתּוֹ
  choice: con gái ông ấy
  rationale: Hậu tố sở hữu chỉ về La-ban; cách diễn đạt này giữ rõ quan hệ gia đình mà không thay bằng tên riêng vốn không có ở cụm từ này.
- source_word: בָּאָה
  choice: đang đến
  rationale: Dạng từ diễn tả hành động đang diễn ra trong cảnh trước mắt; “đang đến” truyền đạt tự nhiên tính hiện thời ấy.
- source_word: עִם הַצֹּאן
  choice: cùng đàn gia súc
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, thường gồm chiên và dê; “đàn gia súc” tránh thu hẹp không chắc chắn thành chỉ đàn chiên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông ấy” phù hợp với việc Gia-cốp hỏi những người lạ về La-ban. Giữ dấu chỉ xuất “Kìa” và bảo toàn nghĩa rộng của צֹאן.
