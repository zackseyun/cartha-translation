base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/005.yaml
  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: vi
  text: 'Ông hỏi họ: “Các anh có biết La-ban, con trai Na-hô không?” Họ đáp: “Chúng tôi biết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Ông hỏi họ
  rationale: Trong ngữ cảnh, động từ אָמַר dẫn vào một câu hỏi; tiếng Việt tự nhiên dùng “hỏi”, còn “họ” thể hiện לָהֶם. Liên từ kể chuyện וַ được thể hiện qua trình tự tự nhiên của câu chuyện mà không cần dịch riêng là “và”.
- source_word: הֲיְדַעְתֶּם
  choice: Các anh có biết ... không?
  rationale: Dạng nghi vấn của יָדַע hỏi về việc quen biết một người. Cấu trúc “có ... không” là cách hỏi tự nhiên trong tiếng Việt; “các anh” phù hợp với số nhiều giống đực trong ngữ cảnh mà không mang sắc thái quá trang trọng.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Dấu hiệu chỉ tân ngữ xác định trong tiếng Hê-bơ-rơ không có từ tương ứng riêng trong tiếng Việt.
- source_word: לָבָן
  choice: La-ban
  rationale: Phiên âm tên riêng theo cách viết dễ đọc, quen thuộc trong tiếng Việt.
- source_word: בֶּן נָחוֹר
  choice: con trai Na-hô
  rationale: Giữ nghĩa trực tiếp của בֶּן là “con trai”; Na-hô là dạng phiên âm tự nhiên của tên נָחוֹר.
- source_word: וַיֹּאמְרוּ
  choice: Họ đáp
  rationale: Động từ “đáp” thể hiện tự nhiên rằng lời nói này là câu trả lời, đồng thời giữ diễn tiến của lời thoại.
- source_word: יָדָעְנוּ
  choice: Chúng tôi biết
  rationale: Giữ sự lặp lại của gốc יָדַע từ câu hỏi. Tiếng Hê-bơ-rơ không nêu tân ngữ trong câu đáp, và tiếng Việt cũng có thể để tân ngữ được hiểu theo ngữ cảnh nên không cần thêm “ông ấy”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để chỉ Gia-cốp theo ngữ cảnh trước đó; “các anh” và “chúng tôi” tạo lời thoại tự nhiên giữa những người đàn ông mà không quá khẩu ngữ.
