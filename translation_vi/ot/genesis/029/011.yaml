  yaml_path: translation/ot/genesis/029/011.yaml
  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: vi
  text: Rồi Gia-cốp hôn Ra-chên[a], cất tiếng lên và khóc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chào Ra-chên bằng một nụ hôn.” Động từ Hê-bơ-rơ thường có nghĩa là “hôn”, nhưng trong ngữ cảnh này nụ hôn cũng có thể là cách chào hỏi giữa người thân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: hôn
  rationale: Động từ נשק ở thể qal thường có nghĩa trực tiếp là “hôn”. Trong bối cảnh này, đó là một nụ hôn thực sự và cũng có thể mang chức năng chào hỏi giữa người thân.
- source_word: לְרָחֵל
  choice: Ra-chên
  rationale: Giới từ לְ đánh dấu đối tượng của hành động hôn; tiếng Việt diễn đạt tự nhiên bằng “hôn Ra-chên”, không cần dịch riêng giới từ.
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: cất tiếng lên
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “nâng tiếng mình lên”, chỉ việc phát ra tiếng lớn; “cất tiếng lên” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái văn chương.
- source_word: וַיֵּבְךְּ
  choice: khóc
  rationale: Động từ בכה có nghĩa là khóc hoặc than khóc. “Khóc” là cách dịch rõ ràng, tự nhiên và phù hợp với thành ngữ đứng trước.
- source_word: וַ
  choice: Rồi
  rationale: Waw liên tiếp thúc đẩy trình tự kể chuyện; “Rồi” diễn đạt tự nhiên hành động kế tiếp trong tiếng Việt.
