  naturalness: Câu văn tự nhiên, rõ ràng, có nhịp kể chuyện trang trọng vừa phải. Cụm “cất tiếng lên và khóc” là cách diễn đạt văn chương dễ hiểu trong tiếng Việt hiện đại, đồng thời không làm mất hình ảnh của thành ngữ Hê-bơ-rơ.
  terminology: Tên riêng “Gia-cốp” và “Ra-chên” nhất quán với lối phiên âm Kinh Thánh tiếng Việt. Chú thích nêu đúng nghĩa thông thường của נשק là “hôn” và bảo lưu khả năng đó là một cử chỉ chào hỏi trong quan hệ gia tộc, không biến khả năng này thành nghĩa chính của câu.
