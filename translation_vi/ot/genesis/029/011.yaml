  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ thành ngữ “cất tiếng lên” để phản ánh cấu trúc giàu hình ảnh của nguyên ngữ mà không trở nên gượng ép.
