base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: vi
  text: 'Họ đáp: “Chúng tôi không thể cho đến khi tất cả các đàn chiên được tập hợp lại và người ta lăn tảng đá khỏi miệng giếng; lúc ấy chúng tôi mới cho đàn chiên uống nước.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cho đàn gia súc nhỏ uống nước.” Từ Hê-bơ-rơ צֹאן là danh từ tập hợp, có thể chỉ gia súc nhỏ, đặc biệt là chiên và dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נוּכַל
  choice: chúng tôi chưa thể làm vậy
  rationale: Động từ יכל diễn tả khả năng. Thêm “làm vậy” theo ngữ cảnh câu trước giúp câu tiếng Việt tự nhiên mà không xác định quá mức hành động; “chưa” phù hợp với giới hạn thời gian do עַד אֲשֶׁר mở đầu.
- source_word: יֵאָסְפוּ כָּל הָעֲדָרִים
  choice: tất cả các bầy vật được tập hợp lại
  rationale: Dạng Niphal của אסף mang nghĩa thụ động hoặc quy tụ; עדר có thể chỉ bầy gia súc, nhất là gia súc nhỏ, nên “các bầy vật” tránh thu hẹp thành riêng bầy chiên.
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: và người ta lăn tảng đá
  rationale: Chủ ngữ số nhiều không được nêu rõ; “người ta” bảo tồn tính phiếm chỉ tự nhiên hơn trong tiếng Việt. גלל có nghĩa là lăn.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: khỏi miệng giếng
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ פִּי, “miệng”, đồng thời dùng “khỏi” để thể hiện việc dời vật ra khỏi phía trên cửa giếng.
- source_word: וְהִשְׁקִינוּ הַצֹּאן
  choice: lúc ấy chúng tôi mới cho đàn vật uống nước
  rationale: Hiphil của שקה nghĩa là cho uống nước. Cấu trúc “lúc ấy… mới” diễn đạt tự nhiên trình tự và điều kiện ngụ ý; צאן là danh từ tập hợp chỉ gia súc nhỏ, có thể gồm chiên và dê.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Giữ hình ảnh “miệng giếng” của nguyên văn; dùng “đàn vật” để không thu hẹp phạm vi nghĩa của צאן. Dấu chấm phẩy thể hiện khoảng ngắt lớn và mối liên hệ tuần tự giữa hai vế.
