  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: vi
  text: Đôi mắt Lê-a dịu[a], còn Ra-chên thì có vóc dáng xinh đẹp và dung mạo xinh đẹp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đôi mắt Lê-a mềm mại,” “mong manh” hoặc “yếu.” Tính từ Hê-bơ-rơ có thể chỉ sự mềm mại hay yếu ớt; sắc thái chính xác không rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: mắt
  rationale: Danh từ số nhiều ở dạng liên kết chỉ trực tiếp đôi mắt của Lê-a, không phải diện mạo nói chung.
- source_word: רַכּוֹת
  choice: dịu dàng
  rationale: Tính từ có thể mang nghĩa mềm mại, dịu dàng, yếu hoặc tinh tế. “Dịu dàng” giữ sắc thái tích cực hoặc trung tính tự nhiên trong tiếng Việt mà không áp đặt ý chê bai; sự không chắc chắn được ghi ở chú thích.
- source_word: יְפַת תֹּאַר
  choice: có vóc dáng xinh đẹp
  rationale: Cụm từ mô tả hình thể hay vóc dáng; cách dịch này tự nhiên và vẫn phân biệt với vẻ mặt bên ngoài.
- source_word: וִיפַת מַרְאֶה
  choice: dung mạo xinh đẹp
  rationale: מַרְאֶה nói đến diện mạo nhìn thấy được. “Dung mạo” bảo tồn vế mô tả thứ hai, phân biệt với “vóc dáng”.
- source_word: וְ
  choice: còn
  rationale: Liên từ theo hình thức là “và”, nhưng ở đây đặt hai chị em trong thế tương phản. “Còn” diễn đạt sự đối chiếu tự nhiên mà không làm sắc thái mạnh quá mức.
