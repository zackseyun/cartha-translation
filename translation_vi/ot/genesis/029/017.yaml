- from: Mắt của Lê-a dịu dàng[a], còn Ra-chên thì có vóc dáng và dung mạo xinh đẹp.
  to: Đôi mắt Lê-a dịu[a], còn Ra-chên thì có vóc dáng xinh đẹp và dung mạo xinh đẹp.
  rationale: Thay “dịu dàng” bằng “dịu” để không dễ gán cho Lê-a một nét tính cách hay thái độ mà nguyên văn không nói rõ. Điều chỉnh chú thích để các phương án tiếng Việt tự nhiên hơn và phản ánh tính bất định của từ Hê-bơ-rơ. Giữ nguyên sự tương phản và hai nét miêu tả vẻ đẹp của Ra-chên.
