base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/023.yaml
  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: vi
  text: Đến tối, La-ban đưa con gái mình là Lê-a đến với Gia-cốp, và Gia-cốp ăn nằm với nàng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “đi vào với nàng,” một thành ngữ chỉ quan hệ tình dục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Đến tối
  rationale: Cụm này xác định thời điểm của biến cố kế tiếp. “Đến tối” tự nhiên trong văn kể chuyện tiếng Việt và chuyển tải tiến trình thời gian mà không cần dịch máy móc công thức וַיְהִי.
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: La-ban đưa con gái mình là Lê-a
  rationale: Động từ לקח có nghĩa cơ bản là “lấy/đem”; trong ngữ cảnh này, “đưa” diễn đạt tự nhiên hành động La-ban đem Lê-a đến chỗ Gia-cốp. Chủ ngữ được nêu là La-ban theo ngữ cảnh trực tiếp của câu trước, còn cấu trúc “con gái mình là Lê-a” chuyển tải rõ quan hệ đồng vị.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: đến với Gia-cốp
  rationale: Hiphil của בוא có nghĩa là “đem/đưa đến”. Dùng tên “Gia-cốp” thay đại từ “ông” để tránh sự nhập nhằng tự nhiên trong tiếng Việt giữa La-ban và Gia-cốp.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ông ăn nằm với nàng
  rationale: בוא אל trong ngữ cảnh hôn nhân là uyển ngữ quy ước chỉ quan hệ tình dục. “Ăn nằm với” là cách nói uyển chuyển, trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại; “ông” chỉ Gia-cốp, còn “nàng” chỉ Lê-a.
