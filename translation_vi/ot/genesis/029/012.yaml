base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: vi
  text: Gia-cốp nói cho Ra-chên biết rằng ông là người bà con của cha cô và là con trai của Rê-bê-ca.[a] Cô liền chạy đi báo cho cha mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “anh/em trai của cha cô”. Từ này ở đây được dùng theo nghĩa rộng để chỉ một người bà con nam; cụ thể, Gia-cốp là cháu gọi La-ban bằng cậu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: nói cho... biết
  rationale: Thể Hiphil của נגד ở đây có nghĩa là nói hoặc cho biết; cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với lời tường thuật.
- source_word: כִּי
  choice: rằng
  rationale: Từ này dẫn vào nội dung được Gia-cốp cho Ra-chên biết.
- source_word: אֲחִי אָבִיהָ
  choice: người bà con của cha cô
  rationale: אָח theo nghĩa đen là “anh/em trai” nhưng cũng có thể được dùng rộng hơn về người bà con nam. Trong quan hệ cụ thể ở đây, Gia-cốp là cháu gọi La-ban bằng cậu, chứ không phải anh hay em của ông.
- source_word: בֶן רִבְקָה
  choice: con trai của Rê-bê-ca
  rationale: Chuyển đạt trực tiếp quan hệ mẹ-con, đồng thời giữ rõ giới tính của בֶן.
- source_word: וַתָּרָץ
  choice: liền chạy về
  rationale: רץ diễn tả hành động chạy; “liền” thể hiện diễn tiến nhanh của chuỗi động từ kể chuyện, còn “về” tự nhiên theo ngữ cảnh cô chạy đến chỗ cha mình.
- source_word: וַתַּגֵּד לְאָבִיהָ
  choice: báo cho cha mình
  rationale: נגד vẫn mang nghĩa cho biết; “báo cho” tránh lặp nặng nề mà vẫn giữ đúng hành động truyền tin, và “cha mình” quy chiếu tự nhiên về chủ ngữ Ra-chên.
