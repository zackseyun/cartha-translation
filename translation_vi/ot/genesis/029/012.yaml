translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho Gia-cốp và “cô” cho Ra-chên để các đại từ rõ ràng, tự nhiên; giữ tên riêng theo dạng phiên âm Kinh Thánh tiếng Việt quen thuộc.
