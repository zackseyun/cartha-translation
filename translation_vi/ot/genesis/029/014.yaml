base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: vi
  text: 'Bấy giờ La-ban nói với ông: “Quả thật, cháu là cốt nhục của cậu.”[a] Rồi Gia-cốp ở với ông suốt một tháng.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “xương của cậu và thịt của cậu”, một thành ngữ chỉ người có quan hệ huyết thống gần gũi.'
    reason: cultural_note
  - marker: b
    text: Nguyên văn Hê-bơ-rơ có thành ngữ “một tháng ngày”, nghĩa là một tháng trọn vẹn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng tự sự với waw liên tiếp đưa câu chuyện tiến tới; “Bấy giờ” diễn đạt trình tự tự nhiên trong tiếng Việt.
- source_word: אַךְ
  choice: Quả thật
  rationale: Ở đây từ này nhấn mạnh lời xác nhận quan hệ họ hàng, không mang nghĩa hạn định “chỉ”.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: cốt nhục của cậu
  rationale: “Cốt nhục” giữ được hình ảnh xương và thịt của thành ngữ Hê-bơ-rơ, đồng thời là cách nói tự nhiên, trang trọng trong tiếng Việt về quan hệ huyết thống.
- source_word: אָתָּה
  choice: cháu là
  rationale: Đại từ độc lập làm chủ ngữ của mệnh đề danh từ; cách xưng hô “cháu—cậu” thể hiện tự nhiên quan hệ giữa Gia-cốp và La-ban theo ngữ cảnh.
- source_word: וַיֵּשֶׁב
  choice: Rồi ... ở
  rationale: Trong ngữ cảnh này, động từ chỉ việc Gia-cốp lưu lại với La-ban trong một khoảng thời gian; “ở” là cách diễn đạt tự nhiên.
- source_word: עִמּוֹ
  choice: với ông
  rationale: Cụm giới từ quy chiếu đến La-ban; dùng “ông” trong lời trần thuật để tránh áp đặt cách xưng hô của lời thoại.
- source_word: חֹדֶשׁ יָמִים
  choice: suốt một tháng
  rationale: Thành ngữ theo nghĩa đen là “một tháng ngày”; “suốt một tháng” truyền đạt tự nhiên ý một tháng trọn vẹn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh thành ngữ Hê-bơ-rơ bằng từ Hán Việt quen thuộc “cốt nhục”; cách xưng hô “cháu—cậu” phù hợp quan hệ gia đình trong ngữ cảnh. Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
