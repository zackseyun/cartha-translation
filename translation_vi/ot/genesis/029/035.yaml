  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: vi
  text: 'Nàng lại mang thai và sinh một con trai. Nàng nói: “Lần này, ta sẽ ca ngợi Yahweh.” Vì thế, nàng đặt tên con là Giu-đa.[a] Rồi nàng ngừng sinh con.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Giu-đa trong tiếng Hê-bơ-rơ nghe gần với động từ có nghĩa là “ca ngợi” hoặc “cảm tạ”.
    reason: Giải thích lối chơi chữ giữa יְהוּדָה (Giu-đa) và אוֹדֶה, một dạng của động từ ידה.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Nàng lại mang thai
  rationale: Động từ הרה chỉ việc thụ thai hoặc mang thai; עוֹד trong chuỗi các lần sinh nở biểu thị sự lặp lại. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: וַתֵּלֶד בֵּן
  choice: sinh một con trai
  rationale: Đây là cách diễn đạt trực tiếp, tự nhiên cho thành ngữ Hê-bơ-rơ nói về việc sinh con trai.
- source_word: הַפַּעַם
  choice: Lần này
  rationale: Giữ được ý chỉ dịp hiện tại, tương phản với những lần sinh trước, mà không thêm sắc thái cảm xúc không được nói rõ.
- source_word: אוֹדֶה
  choice: ta sẽ ca ngợi
  rationale: Dạng Hiphil của ידה có thể mang nghĩa ca ngợi hoặc cảm tạ. “Ca ngợi” phù hợp với lời tuyên bố và giữ được mối liên hệ với cách giải thích tên Giu-đa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Biểu đạt rõ quan hệ nguyên nhân dẫn đến việc đặt tên.
- source_word: קָרְאָה שְׁמוֹ
  choice: nàng đặt tên con là
  rationale: Chuyển thành ngữ nguyên văn “gọi tên nó” sang cách nói tiếng Việt tự nhiên, đồng thời xác định rõ người con vừa sinh.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; chú thích giải thích lối chơi chữ trong tiếng Hê-bơ-rơ.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: Rồi nàng ngừng sinh con
  rationale: Cấu trúc עמד + מן + động từ nguyên mẫu có nghĩa là ngừng một hoạt động; “sinh con” làm rõ hoạt động được nói đến và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh. Giữ “Yahweh” bảo toàn tính chất danh riêng, không thay nó bằng một tước hiệu hay một dạng phiên âm khác.
- issue: Sắc thái của אוֹדֶה
  choice: ta sẽ ca ngợi
  alternative: ta sẽ cảm tạ
  rationale: Động từ ידה cho phép cả hai sắc thái ca ngợi và cảm tạ. Bản chính chọn “ca ngợi” vì phù hợp với lối giải thích tên Giu-đa, còn chú thích bảo lưu khả năng “cảm tạ”.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dùng “nàng” và “ta” để phù hợp với ngữ cảnh cổ mà vẫn dễ hiểu. Chia câu để lời văn tiếng Việt sáng rõ; không thêm động cơ hay cảm xúc ngoài nguyên bản.
