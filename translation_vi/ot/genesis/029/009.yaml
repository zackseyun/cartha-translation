base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: vi
  text: Khi ông còn đang nói với họ, Ra-chên đến cùng đàn chiên của cha nàng, vì nàng là người chăn chiên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng dạng giống cái của từ chỉ người chăn đàn vật, xác định vai trò của Ra-chên.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Khi ông còn đang nói
  rationale: Cụm từ Hê-bơ-rơ diễn tả một hành động vẫn đang tiếp diễn khi sự việc kế tiếp xảy ra; cách dịch này tự nhiên trong tiếng Việt và giữ rõ sự trùng thời gian.
- source_word: עִמָּם
  choice: với họ
  rationale: Dịch trực tiếp giới từ cùng hậu tố ngôi thứ ba số nhiều, chỉ những người chăn chiên mà Gia-cốp đang trò chuyện.
- source_word: וְרָחֵל
  choice: Ra-chên
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: בָּאָה
  choice: đến
  rationale: Động từ בוא trong mạch kể chuyện cho biết Ra-chên đi đến nơi Gia-cốp và những người chăn chiên đang ở.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: cùng đàn chiên của cha nàng
  rationale: Giữ cả ý Ra-chên đi cùng đàn vật và quan hệ sở hữu được nêu trong mệnh đề quan hệ Hê-bơ-rơ; cách diễn đạt bằng sở hữu tự nhiên trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lời giải thích tại sao Ra-chên đi cùng đàn chiên.
- source_word: רֹעָה הִוא
  choice: nàng là người chăn chiên
  rationale: Cụm vị ngữ xác định vai trò của Ra-chên, không chỉ mô tả một hành động nhất thời. Tiếng Việt không có hình thái giống cái tương ứng, nên dùng danh xưng nghề nghiệp trung tính và giải thích sắc thái giống cái trong chú thích.
theological_decisions: []
