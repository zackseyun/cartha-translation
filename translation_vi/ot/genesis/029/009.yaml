  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng và tự nhiên đối với độc giả Việt Nam hiện đại. Đại từ “nàng” duy trì sắc thái tự sự trang nghiêm mà không cổ hóa câu văn.
