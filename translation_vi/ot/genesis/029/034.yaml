  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר עַתָּ֤ה הַ/פַּ֨עַם֙ יִלָּוֶ֤ה אִישִׁ/י֙ אֵלַ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ לֵוִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: vi
  text: 'Nàng lại mang thai và sinh một con trai. Nàng nói: “Giờ đây, lần này chồng tôi sẽ gắn bó với tôi[a], vì tôi đã sinh cho chàng ba con trai.” Vì thế, đứa trẻ được đặt tên là Lê-vi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kết hiệp với tôi.” Động từ Hê-bơ-rơ ở đây có âm gần với tên Lê-vi.
    reason: Bảo tồn cách hiểu từ vựng khác và giải thích lối chơi chữ trong nguyên văn.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Nàng lại mang thai
  rationale: Diễn đạt tự nhiên hành động thụ thai/mang thai và giữ rõ ý lặp lại của עוֹד.
- source_word: וַתֵּלֶד בֵּן
  choice: và sinh một con trai
  rationale: Cách nói tiếng Việt hiện đại, trực tiếp và phù hợp với công thức tường thuật sinh con.
- source_word: עַתָּה הַפַּעַם
  choice: Giờ đây, lần này
  rationale: Giữ cả hai yếu tố nhấn mạnh עַתָּה và הַפַּעַם thay vì lược bỏ một yếu tố.
- source_word: יִלָּוֶה
  choice: sẽ gắn bó
  rationale: Động từ Niphal của לוה tại đây chỉ việc kết hợp hoặc gắn bó với ai; cách dịch này tự nhiên trong quan hệ vợ chồng, còn nét chơi chữ với tên Lê-vi được nêu trong chú thích.
- source_word: אִישִׁי
  choice: chồng tôi
  rationale: Trong ngữ cảnh hôn nhân, אִישִׁי có nghĩa tự nhiên là “chồng tôi”, không chỉ đơn thuần là “người đàn ông của tôi”.
- source_word: אֵלַי
  choice: với tôi
  rationale: Tiếng Việt dùng “gắn bó với tôi” tự nhiên hơn “gắn bó đến tôi”, dù giới từ Hê-bơ-rơ mang sắc thái hướng về phía người nói.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: vì tôi đã sinh cho chàng ba con trai
  rationale: Giữ quan hệ nguyên nhân của כִּי, ý hành động đã hoàn tất của thể hoàn thành, đại từ chỉ người chồng trong לוֹ và số lượng ba con trai.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Công thức này dẫn vào lời giải thích nguyên do đặt tên; “Vì thế” ngắn gọn và tự nhiên.
- source_word: קָרָא שְׁמוֹ
  choice: con được đặt tên
  rationale: Động từ số ít giống đực không nêu chủ thể rõ ràng. Cấu trúc bị động tránh tự ý xác định người đặt tên và tạo câu tiếng Việt tự nhiên.
- source_word: לֵוִי
  choice: Lê-vi
  rationale: Phiên âm tên riêng theo cách quen thuộc trong tiếng Việt; chú thích giải thích mối liên hệ âm thanh với động từ לוה.
theological_decisions:
- issue: Mối chơi chữ giữa יִלָּוֶה và לֵוִי
  choice: Dùng “gắn bó” trong chính văn và giải thích cách dịch “kết hiệp” cùng mối liên hệ âm thanh trong chú thích.
  alternative: chồng tôi sẽ kết hiệp với tôi
  rationale: “Gắn bó” dễ hiểu và tự nhiên hơn trong tiếng Việt hiện đại, nhưng nguyên văn cố ý liên kết lời hy vọng của Lê-a với tên Lê-vi. Chú thích bảo tồn nét ngữ nghĩa và âm thanh mà bản dịch không thể tái tạo đầy đủ.
- issue: Chủ thể của קָרָא
  choice: Dùng cấu trúc bị động “con được đặt tên”.
  alternative: ông đặt tên con / nàng đặt tên con
  rationale: Bản Hê-bơ-rơ có động từ giống đực số ít nhưng không nêu danh từ làm chủ thể; không nên tự ý xác định là Lê-a hoặc Gia-cốp.
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, dùng tiếng Việt hiện đại và dễ hiểu. “Nàng” duy trì mạch quy chiếu đến Lê-a; “chàng” chỉ người chồng trong lời nói của nàng mà không lặp từ nặng nề. Tên לֵוִי được phiên âm là “Lê-vi”.
