- from: 'Nàng lại mang thai và sinh một con trai. Nàng nói: “Giờ đây, lần này chồng tôi sẽ gắn bó với tôi[a], vì tôi đã sinh cho chàng ba con trai.” Vì thế, con được đặt tên là Lê-vi.'
  to: 'Nàng lại mang thai và sinh một con trai. Nàng nói: “Giờ đây, lần này chồng tôi sẽ gắn bó với tôi[a], vì tôi đã sinh cho chàng ba con trai.” Vì thế, đứa trẻ được đặt tên là Lê-vi.'
