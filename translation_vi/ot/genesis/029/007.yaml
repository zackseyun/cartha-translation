  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: vi
  text: 'Ông nói: “Này, trời còn sớm[a], chưa đến lúc tập trung đàn gia súc. Hãy cho đàn chiên uống nước[b], rồi đi chăn chúng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “ngày vẫn còn dài/lớn”, tức là vẫn còn nhiều thời gian ban ngày; cũng có thể dịch: “trời vẫn còn sáng rõ.”'
    reason: lexical_alternative
  - marker: b
    text: “Đàn gia súc” dịch một từ tập hợp chỉ vật nuôi nói chung, còn “đàn chiên” dịch một từ cụ thể hơn, thường chỉ các vật nuôi nhỏ theo bầy như chiên và dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Này
  rationale: Thán từ thu hút sự chú ý; “Này” tự nhiên, trang trọng vừa phải và phù hợp với lời thoại tiếng Việt hiện đại.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: trời còn sớm
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “ngày vẫn còn lớn/dài”, hàm ý vẫn còn nhiều thời gian ban ngày. “Trời còn sớm” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ ý chưa muộn trong ngày.
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: chưa đến lúc tập trung đàn gia súc
  rationale: עֵת chỉ thời điểm thích hợp; הֵאָסֵף mang nghĩa được gom/tập trung lại; מִקְנֶה là danh từ tập hợp rộng, chỉ gia súc chứ không riêng chiên.
- source_word: הַשְׁקוּ
  choice: Hãy cho ... uống nước
  rationale: Thể Hiphil mệnh lệnh của שׁקה có nghĩa khiến hoặc cho uống; cách diễn đạt này rõ ràng và tự nhiên hơn “tưới” khi đối tượng là vật nuôi.
- source_word: הַצֹּאן
  choice: bầy vật
  rationale: צֹאן là vật nuôi nhỏ theo bầy, thường là chiên và dê. “Bầy vật” tránh thu hẹp không chắc chắn thành riêng chiên, đồng thời phân biệt với מִקְנֶה rộng hơn.
- source_word: וּלְכוּ
  choice: rồi đi
  rationale: Liên từ cùng mệnh lệnh diễn tả bước kế tiếp sau khi cho uống nước.
- source_word: רְעוּ
  choice: chăn chúng
  rationale: רעה trong ngữ cảnh này là đưa vật nuôi đi ăn cỏ và trông nom; “chăn” là động từ tiếng Việt tự nhiên, gọn và bao quát đúng hành động.
theological_decisions: []
translation_notes:
  register: Văn phong lời thoại hiện đại, tự nhiên và trang trọng vừa phải. Giữ sự phân biệt giữa מִקְנֶה (gia súc nói chung) và צֹאן (vật nuôi nhỏ theo bầy), đồng thời dùng “trời còn sớm” để chuyển tải thành ngữ thời gian một cách dễ hiểu.
