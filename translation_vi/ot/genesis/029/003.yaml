  naturalness: Nên thay “bầy vật” và “đàn vật” bằng “đàn chiên”, cách dùng hiện đại, tự nhiên trong văn cảnh mục súc. Thêm “thường” làm rõ sắc thái hành động lặp lại của câu miêu tả.
  terminology: “Miệng giếng” là cách dịch sát và tự nhiên cho פִּי הַבְּאֵר; chú thích giải thích thành ngữ được giữ lại. “Đàn chiên” phù hợp với cách gọi tập thể cho צֹאן trong văn cảnh này, không hàm ý một phân loại giáo lý nào.
