base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: vi
  text: Mọi đàn chiên thường tụ họp tại đó; người ta lăn tảng đá khỏi miệng giếng[a], cho đàn chiên uống nước, rồi đặt tảng đá trở lại chỗ cũ trên miệng giếng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “miệng giếng”, một thành ngữ chỉ phần mở của giếng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: đều tụ họp
  rationale: Thể Niphal chưa hoàn thành trong văn cảnh miêu tả tập quán, diễn tả hành động thường xuyên; tiếng Việt không cần thêm dấu hiệu quá khứ khi ngữ cảnh đã rõ.
- source_word: כָל הָעֲדָרִים
  choice: tất cả các bầy vật
  rationale: עדרים chỉ các bầy gia súc trong khung cảnh chăn nuôi; “bầy vật” giữ nghĩa rộng và phù hợp với danh từ tập hợp צאן ở phần sau.
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: người ta lăn tảng đá
  rationale: Chủ thể số nhiều không được nêu đích danh; “người ta” tự nhiên trong tiếng Việt, còn “lăn” giữ hình ảnh cụ thể của động từ גלל.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: khỏi miệng giếng
  rationale: Giữ thành ngữ Hê-bơ-rơ “miệng giếng”; giới từ “khỏi” diễn đạt việc dời tảng đá ra khỏi phần che trên miệng giếng.
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  choice: cho đàn vật uống nước
  rationale: Thể Hiphil của שׁקה có nghĩa khiến hoặc cho uống; צאן là danh từ tập hợp chỉ gia súc nhỏ, nên “đàn vật” tránh thu hẹp không cần thiết thành riêng cừu.
- source_word: וְהֵשִׁיבוּ אֶת הָאֶבֶן
  choice: đặt tảng đá trở lại
  rationale: Thể Hiphil của שוב biểu thị làm cho vật trở về; “đặt ... trở lại” tự nhiên và chính xác trong tiếng Việt.
- source_word: עַל פִּי הַבְּאֵר לִמְקֹמָהּ
  choice: trở lại chỗ cũ trên miệng giếng
  rationale: Thể hiện cả vị trí vốn có của tảng đá và vị trí của nó trên phần mở của giếng.
theological_decisions: []
