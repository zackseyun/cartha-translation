base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: vi
  text: 'Bấy giờ Gia-cốp nói với La-ban: “Xin giao người vợ của tôi cho tôi, vì thời hạn của tôi đã mãn, để tôi đến với nàng[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “đến với nàng”, một cách nói uyển chuyển quen dùng để chỉ việc hoàn tất hôn nhân qua quan hệ vợ chồng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Xin giao ... cho tôi
  rationale: Đây là lời yêu cầu hướng đến La-ban. “Giao” phù hợp với bối cảnh La-ban thực hiện cam kết gả con gái, còn “xin” tạo lời thoại tự nhiên mà không làm yếu sắc thái thúc giục.
- source_word: אֶת אִשְׁתִּי
  choice: vợ
  rationale: אִשָּׁה có thể là “người nữ” hoặc “vợ”; trong bối cảnh Gia-cốp đã hoàn tất thời gian phục vụ theo thỏa thuận hôn nhân, “vợ” là nghĩa thích hợp.
- source_word: כִּי מָלְאוּ יָמָי
  choice: vì thời hạn của tôi đã mãn
  rationale: Cụm Hê-bơ-rơ nói sát là “những ngày của tôi đã đầy/đủ”, chỉ thời gian phục vụ theo thỏa thuận đã hoàn tất. “Thời hạn ... đã mãn” giữ hình ảnh hoàn tất mà vẫn rõ nghĩa trong tiếng Việt.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: để tôi đến với nàng
  rationale: בוא אל, sát nghĩa là “đến/vào với”, là cách nói uyển chuyển chỉ việc chung chăn gối và hoàn tất hôn nhân. Bản dịch giữ lối nói kín đáo và dùng chú thích để làm rõ; “để” thể hiện sắc thái mục đích của thể ý nguyện.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “tôi” tránh tự ý đưa quan hệ xưng hô theo vai vế vào câu Hê-bơ-rơ; “nàng” duy trì sắc thái kể chuyện trang trọng. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
