base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: vi
  text: Khi La-ban nghe tin về Gia-cốp, con trai của chị/em gái mình,[a] ông chạy ra đón, ôm hôn Gia-cốp, rồi đưa Gia-cốp về nhà mình. Gia-cốp kể cho La-ban nghe mọi chuyện ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “con trai của chị/em gái mình.” Từ Hê-bơ-rơ không xác định là chị hay em gái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: Khi ... nghe
  rationale: Cấu trúc כ với động từ nguyên thể diễn tả thời điểm; “khi ... nghe” tự nhiên và không nhấn mạnh quá mức tính tức thì.
- source_word: שֵׁמַע יַעֲקֹב
  choice: tin về Gia-cốp
  rationale: שֵׁמַע chỉ tin tức hay lời báo cáo liên quan đến Gia-cốp; cách dịch này tự nhiên trong tiếng Việt và giữ được quan hệ ngữ nghĩa có thể hiểu là “tin về”.
- source_word: בֶּן אֲחֹתוֹ
  choice: con trai của chị mình
  rationale: Giữ cách diễn đạt quan hệ họ hàng cụ thể của tiếng Hê-bơ-rơ thay vì khái quát thành “cháu trai”; theo mạch văn, người chị là Rê-bê-ca.
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: ông chạy ra đón
  rationale: לִקְרָאתוֹ nghĩa là đi hoặc chạy đến gặp; “chạy ra đón” là cách kể tự nhiên trong tiếng Việt.
- source_word: וַיְחַבֶּק לוֹ וַיְנַשֶּׁק לוֹ
  choice: ôm và hôn Gia-cốp
  rationale: Dịch trực tiếp hai hành động chào đón trong gia đình; lặp tên riêng giúp tránh chuỗi đại từ thiếu tự nhiên.
- source_word: וַיְבִיאֵהוּ אֶל־בֵּיתוֹ
  choice: đưa chàng về nhà mình
  rationale: Hifil của בוא mang nghĩa “đưa/mang đến”; “đưa ... về nhà” phù hợp ngữ cảnh và “mình” quy chiếu về La-ban.
- source_word: וַיְסַפֵּר לְלָבָן
  choice: Gia-cốp kể cho La-ban nghe
  rationale: Chủ ngữ không được nêu trong tiếng Hê-bơ-rơ nhưng theo ngữ cảnh là Gia-cốp; nêu tên giúp đánh dấu rõ sự chuyển đổi chủ thể.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: mọi chuyện ấy
  rationale: דְּבָרִים ở đây chỉ những sự việc được thuật lại, nên “mọi chuyện ấy” tự nhiên hơn cách dịch sát là “mọi lời ấy”.
theological_decisions: []
translation_notes:
  register: Văn kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho La-ban và “chàng” cho Gia-cốp để phân biệt hai nhân vật, đồng thời giữ nguyên cách mô tả quan hệ họ hàng của nguyên văn.
