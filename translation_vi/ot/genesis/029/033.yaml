  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר כִּֽי שָׁמַ֤ע יְהוָה֙ כִּֽי שְׂנוּאָ֣ה אָנֹ֔כִי וַ/יִּתֶּן לִ֖/י גַּם אֶת זֶ֑ה וַ/תִּקְרָ֥א שְׁמ֖/וֹ שִׁמְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: vi
  text: 'Nàng lại mang thai và sinh một con trai. Nàng nói: “Vì Yahweh đã nghe tôi bị ghét[a], nên Ngài cũng ban cho tôi đứa con này.” Vì thế, nàng đặt tên con là Si-mê-ôn[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “tôi không được yêu” hoặc “tôi ít được yêu hơn”. Từ Hê-bơ-rơ có nghĩa đen là “bị ghét”, nhưng trong ngữ cảnh cũng có thể chỉ việc bị khước từ hoặc được yêu ít hơn người khác.
    reason: lexical_alternative
  - marker: b
    text: Tên Si-mê-ôn có liên hệ về âm thanh với từ Hê-bơ-rơ có nghĩa là “nghe”.
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Nàng lại mang thai
  rationale: “Lại” diễn đạt עוֹד, còn mạch kể tiếp diễn của וַ được thể hiện tự nhiên bằng trật tự câu tiếng Việt.
- source_word: וַתֵּלֶד בֵּן
  choice: và sinh một con trai
  rationale: Cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại và bám sát công thức sinh nở của nguyên văn.
- source_word: כִּי שָׁמַע יְהוָה
  choice: Vì Yahweh đã nghe
  rationale: כִּי nêu lý do; dạng hoàn thành שָׁמַע được diễn đạt bằng “đã nghe”. Giữ Yahweh như tên riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: rằng tôi bị ghét
  rationale: Giữ nghĩa trực tiếp và mạnh của שְׂנוּאָה, không tự ý thêm Gia-cốp làm tác nhân; chú thích nêu các sắc thái có thể có trong ngữ cảnh.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: nên Ngài cũng ban cho tôi đứa con này
  rationale: “Cũng” bảo toàn גַּם; “đứa con này” làm rõ đối tượng của זֶה theo ngữ cảnh trực tiếp mà không thay đổi ý nghĩa.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Vì thế, nàng đặt tên con là
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ “gọi tên nó” bằng công thức đặt tên tự nhiên trong tiếng Việt; “vì thế” thể hiện quan hệ với lời giải thích vừa nêu.
- source_word: שִׁמְעוֹן
  choice: Si-mê-ôn
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt; chú thích bảo tồn lối chơi âm với động từ “nghe”.
theological_decisions:
- issue: Cách diễn đạt địa vị của Lê-a trong quan hệ với Gia-cốp
  choice: tôi bị ghét
  alternative: tôi không được yêu; tôi ít được yêu hơn
  rationale: Nguyên văn dùng từ mạnh שְׂנוּאָה, nghĩa trực tiếp là “bị ghét”. Ngữ cảnh có thể hàm ý bị khước từ hoặc được yêu ít hơn, nhưng bản chính giữ nguyên sức nặng và căng thẳng của lời nói.
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ đây là danh riêng trong nguyên văn, không thay bằng tước hiệu và không áp đặt cách đọc thuộc riêng một truyền thống hệ phái.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “nàng” cho nhân vật nữ trong lời kể, “tôi” trong lời trực tiếp và “Ngài” để quy chiếu Yahweh. Các dấu chú thích [a], [b] được đặt ngay tại từ ngữ liên quan.
