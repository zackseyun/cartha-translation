  text: וַ/יְהִ֡י כַּ/אֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת רָחֵ֗ל בַּת לָבָן֙ אֲחִ֣י אִמּ֔/וֹ וְ/אֶת צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑/וֹ וַ/יִּגַּ֣שׁ יַעֲקֹ֗ב וַ/יָּ֤גֶל אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וַ/יַּ֕שְׁקְ אֶת צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: vi
  text: Khi Gia-cốp thấy Ra-chên[a], con gái của La-ban, cậu của ông, cùng đàn chiên dê của La-ban, cậu của ông, ông bước đến, lăn hòn đá khỏi miệng giếng và cho đàn chiên dê của La-ban, cậu của ông, uống nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ lặp lại cụm “cậu của ông” ba lần trong câu này, nhấn mạnh mối quan hệ họ hàng của Gia-cốp với La-ban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Khi
  rationale: Công thức trần thuật này dẫn vào sự việc kế tiếp và mang ý nghĩa thời gian. “Khi” tự nhiên trong tiếng Việt hiện đại mà không cần dịch cứng yếu tố וַיְהִי.
- source_word: רָאָה
  choice: thấy
  rationale: Động từ chỉ sự nhận biết bằng mắt; “thấy” là cách dịch trực tiếp và tự nhiên.
- source_word: בַּת לָבָן
  choice: con gái của La-ban
  rationale: Giữ rõ quan hệ gia đình trong cụm danh từ sở thuộc.
- source_word: אֲחִי אִמּוֹ
  choice: anh trai của mẹ mình
  rationale: Tiếng Hê-bơ-rơ dùng אָח, nghĩa cơ bản là “anh/em trai”, nhưng không xác định tuổi tương đối. Trong câu chính chọn cách diễn đạt tự nhiên, đồng thời chú thích khả năng “em trai”; giữ nguyên việc lặp lại ba lần để bảo toàn nét nhấn mạnh của nguyên văn.
- source_word: צֹאן
  choice: đàn gia súc
  rationale: Từ này chỉ tập hợp gia súc nhỏ, thường gồm chiên và dê. “Đàn gia súc” tránh thu hẹp không có căn cứ thành riêng đàn chiên, dù tiếng Việt không biểu thị rõ loại gia súc nhỏ.
- source_word: וַיִּגַּשׁ
  choice: bước đến
  rationale: Diễn tả Gia-cốp tiến lại gần nơi diễn ra hành động; cách nói này tự nhiên và cụ thể trong văn kể chuyện.
- source_word: וַיָּגֶל
  choice: lăn
  rationale: Động từ diễn tả hành động lăn hòn đá, giữ nguyên hình ảnh cụ thể của nguồn.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: khỏi miệng giếng
  rationale: Giữ ẩn dụ “miệng giếng” của tiếng Hê-bơ-rơ; “khỏi” truyền đạt việc dời hòn đá ra khỏi vị trí trên miệng giếng.
- source_word: וַיַּשְׁקְ
  choice: cho ... uống nước
  rationale: Dạng Hiphil mang nghĩa cho vật nuôi uống nước; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Giữ ba lần lặp cụm quan hệ họ hàng theo nguyên văn, dù tiếng Việt thông thường có thể lược bớt. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
