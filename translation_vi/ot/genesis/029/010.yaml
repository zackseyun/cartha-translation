  - severity: low
    issue: “Đàn gia súc” có phạm vi quá rộng đối với צֹאן.
    rationale: צֹאן chỉ tập hợp gia súc nhỏ, thông thường là chiên và dê, không bao gồm toàn bộ các loại gia súc như cách hiểu phổ thông của “gia súc”.
  - severity: low
    issue: Chú thích về khả năng dịch “em trai của mẹ mình” không cần thiết và khiến người đọc hiểu sai rằng bản văn chọn một trong hai nghĩa tuổi tác.
    rationale: Sự mơ hồ về tuổi được xử lý tự nhiên bằng “cậu”; điều cần chú thích theo audit trail là việc cụm quan hệ họ hàng được lặp lại ba lần.
