base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: vi
  text: 'Gia-cốp nói với họ: “Các anh em[a] từ đâu đến?” Họ đáp: “Chúng tôi đến từ Cha-ran.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các anh em” là cách xưng hô thân tình, lịch sự ở đây, không nhất thiết có nghĩa họ là anh em ruột hay họ hàng.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם יַעֲקֹב
  choice: Gia-cốp nói với họ
  rationale: Giữ động từ phát ngôn thông dụng אמר là “nói” và thể hiện rõ đối tượng tiếp nhận bằng “với họ”; tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: אַחַי
  choice: các anh em
  rationale: Nghĩa đen là “anh em của tôi”; trong ngữ cảnh đây là lối xưng hô thân tình, lịch sự với những người nam chưa quen. Tiếng Việt tự nhiên có thể dùng “các anh em” mà không nhất thiết hàm ý quan hệ huyết thống.
- source_word: מֵאַיִן אַתֶּם
  choice: từ đâu đến
  rationale: מֵאַיִן hỏi về nguồn gốc hoặc nơi xuất phát. “Từ đâu đến?” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái “từ đâu” của nguyên văn.
- source_word: וַיֹּאמְרוּ
  choice: Họ đáp
  rationale: Động từ אמר theo nghĩa cơ bản là “nói”, nhưng ở đây lời nói trực tiếp trả lời câu hỏi ngay trước đó; “đáp” diễn đạt tự nhiên chức năng ngữ cảnh mà không thêm nội dung.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: Chúng tôi đến từ Cha-ran
  rationale: Giới từ מ־ chỉ nơi xuất phát; đại từ độc lập אֲנָחְנוּ là “chúng tôi”. Tiếng Việt thêm “đến” để tạo câu trả lời tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các anh em” để bảo toàn hình ảnh thân tộc trong nguyên văn nhưng kèm chú thích nhằm tránh hiểu theo nghĩa huyết thống. Tên יַעֲקֹב và חָרָן được viết là “Gia-cốp” và “Cha-ran” theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
