base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: vi
  text: 'La-ban nói: “Ta gả nàng cho con thì tốt hơn là gả nàng cho một người đàn ông khác. Hãy ở lại với ta.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ kể chuyện thông dụng אָמַר mở đầu lời nói trực tiếp; “nói” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: טוֹב ... מִן
  choice: thì tốt hơn là
  rationale: Cấu trúc so sánh diễn tả điều này tốt hơn điều kia; cách dịch này tự nhiên và giữ rõ phép so sánh.
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: Ta gả nàng cho con
  rationale: Trong bối cảnh hôn nhân, “gả” diễn đạt tự nhiên hành động người cha trao con gái làm vợ; đại từ “ta/con” phản ánh quan hệ và lời thoại trong ngữ cảnh.
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: là gả nàng cho một người đàn ông khác
  rationale: Giữ nguyên vế so sánh và dịch אִישׁ אַחֵר sát nghĩa là “một người đàn ông khác”, không thêm ý “người chồng” vốn không được nói rõ.
- source_word: שְׁבָה
  choice: Hãy ở lại
  rationale: Mệnh lệnh của יָשַׁב trong ngữ cảnh này mang nghĩa tiếp tục lưu lại; “hãy ở lại” rõ ràng và hiện đại.
- source_word: עִמָּדִי
  choice: với ta
  rationale: Diễn đạt trực tiếp sự tiếp tục hiện diện bên La-ban.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “gả” theo ngữ cảnh hôn nhân thay vì dịch máy móc là “cho”; giữ “một người đàn ông khác” để tránh bổ sung sắc thái không có trong nguyên văn.
