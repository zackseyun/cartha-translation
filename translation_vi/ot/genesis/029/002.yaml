base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: vi
  text: Ông nhìn, thì kìa, có một cái giếng ngoài đồng; và kìa, có ba bầy chiên đang nằm bên giếng ấy, vì người ta lấy nước từ giếng ấy cho các bầy chiên uống. Trên miệng giếng có một tảng đá lớn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ông nhìn xem
  rationale: Động từ ראה ở dạng kể chuyện đưa trình thuật tiến tới; “nhìn xem” tự nhiên trong tiếng Việt và dẫn vào cảnh vật ông thấy.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: kìa ... và kìa
  rationale: Giữ cả hai lần của tiểu từ thu hút sự chú ý để bảo tồn tính sống động và sự lặp có chủ ý của tiếng Hê-bơ-rơ.
- source_word: בְאֵר בַּשָּׂדֶה
  choice: một cái giếng ngoài đồng
  rationale: “Giếng” là nghĩa thông thường của בְּאֵר; “ngoài đồng” diễn đạt tự nhiên vị trí trong vùng đồng trống.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: ba bầy chiên
  rationale: עֵדֶר là bầy đàn, còn צֹאן chỉ gia súc nhỏ, thường là chiên và dê; trong ngữ cảnh này “bầy chiên” rõ ràng và tự nhiên.
- source_word: רֹבְצִים עָלֶיהָ
  choice: đang nằm nghỉ bên giếng
  rationale: רבץ nói về súc vật nằm xuống; עָלֶיהָ theo nghĩa đen là “trên/bên nó,” nhưng ở đây chỉ vị trí cạnh giếng. “Nằm nghỉ bên giếng” truyền đạt cảnh tượng tự nhiên.
- source_word: כִּי מִן הַבְּאֵר הַהִוא יַשְׁקוּ הָעֲדָרִים
  choice: vì người ta lấy nước từ giếng ấy cho các bầy vật uống
  rationale: כִּי nêu lý do các bầy nằm đó. Chủ thể số nhiều không xác định của יַשְׁקוּ được diễn đạt tự nhiên là “người ta”; Hiphil của שׁקה là cho uống.
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: Có một tảng đá lớn đậy trên miệng giếng
  rationale: “Miệng giếng” giữ hình ảnh trực tiếp của פִּי הַבְּאֵר; “đậy trên” làm rõ quan hệ không gian mà không loại bỏ cách nói nguyên ngữ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hai lần “kìa” để tái hiện nhịp điệu sống động của nguyên ngữ; dùng “người ta” cho chủ thể số nhiều không xác định. Mọi dấu chú thích trong bản văn đều có mục tương ứng.
