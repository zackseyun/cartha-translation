  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: vi
  text: Khi Đức Giê-hô-va thấy Lê-a bị ghét, Ngài mở dạ con nàng; còn Ra-chên thì không thể sinh con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng danh xưng riêng quen thuộc trong tiếng Việt để thể hiện danh giao ước YHWH, thay vì chuyển thành danh hiệu chung.
- source_word: שְׂנוּאָה
  choice: bị ghét
  rationale: Giữ nghĩa trực tiếp và mạnh của động tính từ Hebrew, không làm nhẹ thành “không được yêu”.
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: Ngài mở dạ con nàng
  rationale: Giữ hình ảnh cụ thể của nguyên văn về việc Đức Chúa Trời ban khả năng thụ thai.
- source_word: עֲקָרָה
  choice: hiếm muộn
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại về tình trạng không thể sinh con, ít mang sắc thái miệt thị hơn “son sẻ”.
theological_decisions:
- issue: Mức độ đối nghịch trong quan hệ của Gia-cốp với Lê-a
  choice: bị ghét
  alternative: không được yêu
  rationale: Nguyên văn dùng שְׂנוּאָה, nghĩa trực tiếp là “bị ghét”. Dù ngữ cảnh có thể hàm ý Lê-a ít được yêu hơn Ra-chên, bản dịch không âm thầm làm nhẹ sự căng thẳng của câu.
translation_notes:
  register: Văn phong kể chuyện trang trọng, tự nhiên và dễ hiểu. Dùng tên riêng theo dạng Việt hóa truyền thống; giữ cấu trúc tương phản giữa Lê-a và Ra-chên.
