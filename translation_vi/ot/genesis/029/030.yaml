  text: וַ/יָּבֹא֙ גַּ֣ם אֶל רָחֵ֔ל וַ/יֶּאֱהַ֥ב גַּֽם אֶת רָחֵ֖ל מִ/לֵּאָ֑ה וַ/יַּעֲבֹ֣ד עִמּ֔/וֹ ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/030.yaml
  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: vi
  text: Vậy Gia-cốp cũng ăn ở với Ra-chên[a]. Ông yêu Ra-chên hơn Lê-a, rồi tiếp tục làm việc cho La-ban thêm bảy năm nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “đến với Ra-chên”, một lối nói kín đáo chỉ việc hoàn tất quan hệ hôn nhân.
    reason: Giải thích thành ngữ Hê-bơ-rơ và bảo lưu hình thức nguyên văn.
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: Gia-cốp cũng ăn ở với Ra-chên
  rationale: בוא אֶל trong bối cảnh hôn nhân là một lối nói chỉ việc đến với người nữ và hoàn tất hôn nhân. “Ăn ở với” truyền đạt hàm ý quan hệ vợ chồng bằng cách nói tự nhiên, kín đáo trong tiếng Việt; “cũng” giữ lại גַּם, nối với việc Gia-cốp trước đó đã đến với Lê-a.
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: Ông yêu Ra-chên
  rationale: אָהַב có nghĩa thông thường là “yêu”; không thêm trạng từ cường điệu vì động từ Hê-bơ-rơ tự nó không có yếu tố ấy. גַּם trong mệnh đề này có chức năng bổ sung/nhấn theo mạch văn và được diễn đạt tự nhiên trong toàn câu thay vì lặp “cũng” một cách nặng nề.
- source_word: מִלֵּאָה
  choice: hơn Lê-a
  rationale: 'מִן sau động từ chỉ tình cảm tự nhiên nhất là dấu hiệu so sánh: Gia-cốp yêu Ra-chên hơn Lê-a. Cách dịch này giữ đúng quan hệ so sánh trong ngữ cảnh.'
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: tiếp tục làm việc cho La-ban
  rationale: עבד có thể là “phục vụ” hoặc “làm việc”. Trong ngữ cảnh lao động theo thỏa thuận với La-ban, “làm việc cho” là tiếng Việt tự nhiên. Đại từ “với ông ấy” được làm rõ là La-ban để tránh mơ hồ về quy chiếu; “tiếp tục” chuyển tải ý kéo dài công việc.
- source_word: עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת
  choice: thêm bảy năm nữa
  rationale: עוֹד kết hợp với שֶׁבַע שָׁנִים אֲחֵרוֹת chỉ một thời hạn bổ sung; “thêm bảy năm nữa” là cách diễn đạt hiện đại, rõ ràng và tự nhiên.
theological_decisions:
- issue: Quan hệ giữa מִן và động từ “yêu”
  choice: yêu Ra-chên hơn Lê-a
  alternative: yêu Ra-chên chứ không phải Lê-a
  rationale: מִן có thể được hiểu theo hướng đối chiếu, nhưng văn cảnh cho thấy Gia-cốp vẫn sống trong quan hệ hôn nhân với Lê-a; cách hiểu so sánh phù hợp nhất mà không biến câu thành lời phủ nhận tuyệt đối tình cảm dành cho Lê-a.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ăn ở với” theo nghĩa quan hệ vợ chồng, tránh diễn đạt quá trực diện; dùng “làm việc cho La-ban” thay cho cấu trúc sát chữ nhưng thiếu tự nhiên “phục vụ với ông ấy”. Mọi dấu chú thích trong văn bản đều có mục tương ứng.
