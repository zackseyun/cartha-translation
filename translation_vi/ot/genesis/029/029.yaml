  yaml_path: translation/ot/genesis/029/029.yaml
  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: vi
  text: La-ban trao Bi-la, nữ tỳ của ông, cho con gái mình là Ra-chên để làm nữ tỳ cho nàng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: trao
  rationale: Động từ נתן ở dạng kể chuyện chỉ hành động đã xảy ra. “Trao” diễn đạt tự nhiên việc La-ban giao Bi-la cho Ra-chên, đồng thời phù hợp hơn “cho” khi một người được đặt vào sự phục vụ của người khác.
- source_word: לָבָן
  choice: La-ban
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: לְרָחֵל
  choice: cho ... Ra-chên
  rationale: Giới từ לְ đánh dấu người nhận; cấu trúc câu tiếng Việt đặt cụm “cho con gái mình là Ra-chên” sau tân ngữ để câu rõ và tự nhiên.
- source_word: בִּתּוֹ
  choice: con gái mình
  rationale: Hậu tố ngôi ba số ít giống đực chỉ về La-ban. “Mình” tránh lặp “ông” và vẫn xác định rõ quan hệ sở hữu trong câu.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Dấu hiệu chỉ tân ngữ xác định trong tiếng Hê-bơ-rơ không có từ tương ứng cần dịch riêng trong tiếng Việt.
- source_word: בִּלְהָה
  choice: Bi-la
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: שִׁפְחָתוֹ
  choice: nữ tỳ của ông
  rationale: שִׁפְחָה chỉ một nữ gia nhân hoặc nữ nô lệ. “Nữ tỳ” giữ được giới tính và địa vị lệ thuộc trong bối cảnh cổ đại mà không suy diễn tuổi tác.
- source_word: לָהּ
  choice: cho nàng
  rationale: Đại từ giống cái chỉ về Ra-chên; khi kết hợp với לְשִׁפְחָה, tiếng Việt diễn đạt tự nhiên bằng “để làm nữ tỳ cho nàng”.
- source_word: לְשִׁפְחָה
  choice: làm nữ tỳ
  rationale: Giữ cùng một cách dịch với lần xuất hiện trước của שִׁפְחָה, qua đó bảo toàn sự lặp từ của nguyên bản và nêu rõ vai trò của Bi-la đối với Ra-chên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Dùng “nữ tỳ” để phản ánh thuật ngữ chỉ nữ gia nhân/nữ nô lệ trong xã hội cổ đại; câu không thêm chú thích vì bản dịch đã giữ được sắc thái chính của từ Hê-bơ-rơ.
