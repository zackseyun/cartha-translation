  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và nội dung câu Hê-bơ-rơ: La-ban là chủ thể, Bi-la là đối tượng được trao, Ra-chên là người nhận; “nữ tỳ của ông” và “nữ tỳ cho nàng” giữ được sự lặp lại của שִׁפְחָה và các sở hữu/quan hệ tương ứng. “Để làm nữ tỳ cho nàng” diễn đạt thành ngữ tự nhiên cho לָהּ לְשִׁפְחָה mà không thêm ý nghĩa ngoài nguyên văn.'
  naturalness: Câu văn rõ, trang trọng và tự nhiên trong tiếng Việt hiện đại dùng cho văn bản Kinh Thánh. “Trao” phù hợp ngữ cảnh giao một người thuộc gia hộ cho người khác phục vụ; “nàng” có quy chiếu rõ về Ra-chên trong văn phong kể chuyện trang trọng.
