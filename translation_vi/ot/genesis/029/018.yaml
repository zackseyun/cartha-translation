base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: vi
  text: 'Gia-cốp yêu Ra-chên và nói: “Tôi sẽ phục vụ ông bảy năm để được Ra-chên, con gái út của ông.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: yêu
  rationale: Động từ אָהַב trực tiếp chỉ tình yêu; “yêu” tự nhiên và không thêm sắc thái diễn giải như “phải lòng”.
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: אמר là động từ thông dụng để dẫn lời trực tiếp; “nói” giữ đúng mức độ cụ thể của nguyên văn.
- source_word: אֶעֱבָדְךָ
  choice: Tôi sẽ phục vụ ông
  rationale: עבד ở đây nói đến việc Gia-cốp lao động cho La-ban; “phục vụ” bảo toàn cả ý lao động lẫn quan hệ phụ thuộc, còn đại từ “ông” phù hợp ngữ cảnh xưng hô.
- source_word: שֶׁבַע שָׁנִים
  choice: bảy năm
  rationale: Cách dịch trực tiếp và rõ nghĩa của cụm số từ.
- source_word: בְּרָחֵל
  choice: để được Ra-chên
  rationale: Giới từ בְּ trong ngữ cảnh này đánh dấu đối tượng hoặc điều kiện trao đổi của thời gian phục vụ. “Để được Ra-chên” diễn đạt tự nhiên mục đích hôn nhân mà không dùng cách nói dễ khiến Ra-chên bị hiểu đơn thuần như món hàng.
- source_word: בִּתְּךָ
  choice: con gái ... của ông
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu ngôi hai giống đực số ít trong tiếng Việt.
- source_word: הַקְּטַנָּה
  choice: út
  rationale: Tính từ קָטָן nguyên nghĩa là nhỏ; khi phân biệt các con trong gia đình, nó chỉ người trẻ hơn. Vì La-ban có hai con gái, “con gái út” là cách nói Việt tự nhiên và chính xác.
- source_word: וַ
  choice: và
  rationale: Liên từ mở đầu tiếp nối mạch kể. Trong tiếng Việt, không cần dịch liên từ đầu câu một cách máy móc; “và” giữa hai mệnh đề giữ rõ sự tiếp diễn của chuỗi hành động.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ tên riêng theo dạng Việt hóa quen thuộc “Gia-cốp” và “Ra-chên”. Lời thoại dùng cặp xưng hô “tôi—ông”, tự nhiên trong quan hệ giữa hai người đàn ông trưởng thành và không hàm ý thân tộc vượt quá nguyên văn.
