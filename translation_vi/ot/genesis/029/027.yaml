translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta/con” để thể hiện lời La-ban nói với Gia-cốp. Bản dịch giữ nét phân biệt giữa Lê-a (“người này”) và Ra-chên (“người kia”), đồng thời ghi nhận cấu trúc sát chữ và hình thái động từ trong chú thích.
