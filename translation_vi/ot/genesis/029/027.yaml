  text: מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְ/נִתְּנָ֨ה לְ/ךָ֜ גַּם אֶת זֹ֗את בַּ/עֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔/י ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: vi
  text: Hãy làm trọn tuần lễ cưới của người này[a], rồi chúng tôi cũng sẽ trao người kia cho con[b], để đổi lấy việc con sẽ làm cho ta[c] thêm bảy năm nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “tuần của người này”; trong ngữ cảnh, cụm từ chỉ tuần lễ cưới theo phong tục.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “rồi người kia cũng sẽ được trao cho con.” Dạng động từ Hê-bơ-rơ là ngôi ba giống cái số ít, nhưng trong ngữ cảnh, ý câu là lời La-ban hứa trao người con gái kia.'
    reason: lexical_alternative
  - marker: c
    text: Động từ Hê-bơ-rơ có thể có nghĩa là “làm việc” hoặc “phục vụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Hãy làm trọn
  rationale: Giữ lực mệnh lệnh của động từ מלא và diễn đạt tự nhiên việc hoàn tất một khoảng thời gian đã định.
- source_word: שְׁבֻעַ זֹאת
  choice: tuần lễ cưới của người này
  rationale: שְׁבֻעַ ở đây chỉ một tuần, và ngữ cảnh cho thấy đó là tuần lễ cưới của Lê-a; “người này” giữ đại từ chỉ định giống cái mà không thêm tên riêng vào chính văn.
- source_word: וְנִתְּנָה לְךָ
  choice: rồi chúng tôi cũng sẽ trao ... cho con
  rationale: Hình thái Hê-bơ-rơ là ngôi ba giống cái số ít, có thể hiểu theo lối bị động/phiếm chỉ; trong ngữ cảnh, đây là lời La-ban cam kết trao con gái kia. Cách dịch chủ động số nhiều tự nhiên trong tiếng Việt, còn dị bản hình thức được giữ trong chú thích.
- source_word: גַּם אֶת זֹאת
  choice: cũng ... người kia
  rationale: Chỉ Ra-chên, người con gái còn lại. “Người kia” phân biệt tự nhiên với “người này” là Lê-a trong câu trước, dù nguyên văn lặp đại từ זֹאת.
- source_word: בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי
  choice: để đổi lấy việc con sẽ làm cho ta
  rationale: Diễn đạt quan hệ điều kiện/đền đổi của בְּ và nghĩa lao động, phục vụ của עבד; “làm cho ta” phù hợp quan hệ giữa Gia-cốp và La-ban hơn cách dịch sát chữ “làm với ta”.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: thêm bảy năm nữa
  rationale: Cách nói tiếng Việt tự nhiên, giữ đầy đủ ý bổ sung của עוֹד và khoảng thời gian bảy năm khác.
