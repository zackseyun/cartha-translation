lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: Rồi Gia-cốp lên đường
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “Gia-cốp nhấc chân mình lên”, nhưng trong ngữ cảnh diễn tả việc ông tiếp tục hành trình; “lên đường” truyền đạt tự nhiên ý nghĩa thành ngữ.
- source_word: בְנֵי קֶדֶם
  choice: dân phương Đông
  rationale: Cụm từ theo nghĩa đen là “con cái của phương Đông”, một cách gọi tập thể chỉ cư dân vùng phía đông; “dân phương Đông” tự nhiên trong tiếng Việt mà không xác định quá mức địa danh hay sắc tộc.
