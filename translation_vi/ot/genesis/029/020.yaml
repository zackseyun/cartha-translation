  text: וַ/יַּעֲבֹ֧ד יַעֲקֹ֛ב בְּ/רָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַ/יִּהְי֤וּ בְ/עֵינָי/ו֙ כְּ/יָמִ֣ים אֲחָדִ֔ים בְּ/אַהֲבָת֖/וֹ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: vi
  text: Vậy, Gia-cốp phục vụ vì Ra-chên bảy năm; bảy năm ấy đối với ông chỉ như vài ngày,[a] vì ông yêu nàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “chúng ở trong mắt ông như vài ngày.”'
    reason: Giữ lại thành ngữ Hê-bơ-rơ diễn tả cảm nhận chủ quan của Gia-cốp.
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: phục vụ
  rationale: Động từ עבד có thể chỉ việc phục vụ hoặc làm việc. Trong ngữ cảnh này, Gia-cốp lao động theo thỏa thuận để được cưới Ra-chên; “phục vụ” giữ được cả ý lao động lẫn quan hệ nghĩa vụ.
- source_word: בְּרָחֵל
  choice: để cưới Ra-chên
  rationale: Giới từ ב trong ngữ cảnh này chỉ mục đích của thời gian phục vụ, tức là để được lấy Ra-chên làm vợ. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ điều đã được xác lập ở câu trước.
- source_word: שֶׁבַע שָׁנִים
  choice: bảy năm
  rationale: Cách chuyển dịch trực tiếp và tự nhiên của cụm từ chỉ thời gian.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: ông thấy những năm ấy
  rationale: Thành ngữ “ở trong mắt ông” diễn tả cảm nhận chủ quan. “Ông thấy” truyền đạt tự nhiên điểm nhìn ấy trong tiếng Việt hiện đại.
- source_word: כְּיָמִים אֲחָדִים
  choice: chỉ như vài ngày
  rationale: Cụm từ có nghĩa đen gần với “như ít ngày”; “chỉ như vài ngày” diễn đạt tự nhiên cảm nhận rằng bảy năm trôi qua rất ngắn.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: vì yêu nàng
  rationale: Giới từ ב ở đây hợp lý nhất khi hiểu theo nghĩa nguyên nhân hoặc hoàn cảnh. “Vì yêu nàng” ngắn gọn, tự nhiên và giữ đúng quan hệ nhân quả của câu.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu với độc giả Việt Nam hiện đại. Dùng “nàng” để tránh lặp tên và giữ sắc thái tình cảm phù hợp; không thêm diễn giải thần học.
