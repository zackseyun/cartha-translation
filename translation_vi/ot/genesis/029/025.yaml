base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: vi
  text: 'Đến sáng, thì hóa ra nàng là Lê-a! Gia-cốp nói với La-ban: “Ông đã làm gì với tôi thế này? Chẳng phải tôi đã làm việc cho ông vì Ra-chên sao? Vậy tại sao ông lừa tôi?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: thì ra
  rationale: Diễn đạt tự nhiên sự phát hiện bất ngờ mà từ Hê-bơ-rơ này đánh dấu; dấu chấm than giúp giữ sức biểu cảm của câu.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: tôi đã làm việc cho ông
  rationale: Trong ngữ cảnh thỏa thuận lao động với La-ban, עבד mang nghĩa làm việc/phục vụ; 'cho ông' là cách nói tiếng Việt tự nhiên cho quan hệ này.
- source_word: בְרָחֵל
  choice: vì Ra-chên
  rationale: 'Giữ cách diễn đạt cô đọng và độ mở của giới từ בְּ: công việc của Gia-cốp hướng đến Ra-chên như điều đã thỏa thuận.'
- source_word: רִמִּיתָנִי
  choice: ông lại lừa tôi
  rationale: רמה chỉ hành vi đánh lừa hoặc lừa gạt; 'lừa tôi' rõ ràng, tự nhiên và phù hợp lời chất vấn trực tiếp.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Nêu rõ chủ ngữ 'Gia-cốp' thay cho đại từ Hê-bơ-rơ để tránh mơ hồ trong tiếng Việt; không thêm diễn giải về cách thức tráo cô dâu.
