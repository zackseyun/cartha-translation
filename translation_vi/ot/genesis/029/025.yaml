revisions:
- from: 'Đến sáng, thì ra đó là Lê-a! Gia-cốp nói với La-ban: “Ông đã làm gì với tôi thế này? Chẳng phải tôi đã làm việc cho ông vì Ra-chên sao? Vậy tại sao ông lại lừa tôi?”'
  to: 'Đến sáng, thì hóa ra nàng là Lê-a! Gia-cốp nói với La-ban: “Ông đã làm gì với tôi thế này? Chẳng phải tôi đã làm việc cho ông vì Ra-chên sao? Vậy tại sao ông lừa tôi?”'
  rationale: Chỉnh rất nhẹ để làm rõ đại từ chỉ Lê-a theo nguyên văn và tránh hàm ý “lừa lần nữa” không có trong tiếng Hê-bơ-rơ. Các lựa chọn còn lại được giữ vì truyền đạt trung thành lời kể và lời chất vấn trực tiếp.
