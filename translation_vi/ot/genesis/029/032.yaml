base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: vi
  text: 'Lê-a mang thai và sinh một con trai. Bà đặt tên con là Ru-bên[a], vì bà nói: “Vì Yahweh đã thấy nỗi khổ của tôi, nên giờ đây chồng tôi sẽ yêu tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ru-bên được liên hệ về âm thanh với tiếng Hê-bơ-rơ “hãy xem, một con trai”; lời giải thích của Lê-a trong câu cũng chơi chữ với từ “đã thấy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: mang thai
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại cho động từ הרה, chỉ việc thụ thai hoặc có thai.
- source_word: וַתֵּלֶד בֵּן
  choice: sinh một con trai
  rationale: Chuyển tải trực tiếp thành ngữ sinh nở của tiếng Hê-bơ-rơ bằng cách nói tự nhiên, rõ ràng trong tiếng Việt.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: bà đặt tên con là
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ công thức đặt tên và dẫn vào lối chơi chữ.
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Phiên âm tên riêng theo cách quen thuộc trong tiếng Việt; ý nghĩa chơi chữ được giải thích ở chú thích.
- source_word: כִּי רָאָה יְהוָה
  choice: Vì Đức Giê-hô-va đã thấy
  rationale: Giữ quan hệ nguyên nhân của כִּי và sắc thái kết quả hiện tại của động từ hoàn thành רָאָה.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc và trang trọng trong tiếng Việt để thể hiện trực tiếp danh YHWH, thay vì thay bằng một tước hiệu.
- source_word: בְּעָנְיִי
  choice: nỗi khổ của tôi
  rationale: Diễn đạt עֳנִי bằng ngôn ngữ tự nhiên, dễ hiểu mà vẫn giữ sức nặng về cảnh khốn khổ của Lê-a.
- source_word: כִּי עַתָּה יֶאֱהָבַנִי אִישִׁי
  choice: nên giờ đây chồng tôi sẽ yêu tôi
  rationale: Trong mạch lời nói, כִּי thứ hai dẫn đến kỳ vọng của Lê-a; “chồng tôi” là nghĩa rõ ràng của אִישִׁי trong bối cảnh hôn nhân.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” là dạng danh riêng đã quen thuộc trong tiếng Việt và không thay danh ấy bằng tước hiệu.
- issue: Mối liên hệ giữa việc sinh con và hy vọng được chồng yêu
  choice: Giữ nguyên lời kỳ vọng của Lê-a, không trình bày như lời bảo đảm của Đức Chúa Trời
  alternative: Diễn giải rằng việc sinh con chắc chắn khiến Gia-cốp yêu bà
  rationale: Nguyên văn chỉ thuật lại suy nghĩ của Lê-a; bản dịch cần giữ nguyên căng thẳng trong quan hệ gia đình và không xác nhận kỳ vọng ấy như một lời hứa thần học.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu với độc giả Việt Nam hiện đại. Dùng “bà” cho Lê-a trong câu kể và “tôi” trong lời trực tiếp để phản ánh cảm xúc cá nhân.
