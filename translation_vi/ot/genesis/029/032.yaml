    rationale: Nguồn tiếng Hê-bơ-rơ dùng danh riêng יהוה; vệt kiểm toán POB quy định cách chuyển là “Yahweh”. “Đức Giê-hô-va” là một dạng truyền thống tiếng Việt nhưng không nhất quán với quyết định thuật ngữ của dự án.
  - severity: low
    issue: Chú thích về tên Ru-bên có thể diễn đạt thận trọng hơn về lối chơi chữ.
    rationale: Tên רְאוּבֵן thường được liên hệ với cách đọc “hãy xem, một con trai” và với động từ “thấy” trong lời Lê-a, nhưng quan hệ từ nguyên chính xác có tính tranh luận. Nên nói đây là liên hệ âm thanh/lối chơi chữ trong câu.
