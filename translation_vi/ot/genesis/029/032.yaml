  to: 'Lê-a mang thai và sinh một con trai. Bà đặt tên con là Ru-bên[a], vì bà nói: “Vì Yahweh đã thấy nỗi khổ của tôi, nên giờ đây chồng tôi sẽ yêu tôi.”'
