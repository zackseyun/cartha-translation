base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: vi
  text: 'La-ban nói: “Ở nơi chúng ta, người ta không làm như vậy: gả em gái trước chị cả.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ אמר trong lối kể chuyện được chuyển tự nhiên và trực tiếp là “nói”.
- source_word: לָבָן
  choice: La-ban
  rationale: Phiên âm tên riêng theo lối viết tiếng Việt quen dùng trong bản dịch Kinh Thánh.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: người ta không làm như vậy
  rationale: Giữ sắc thái vô nhân xưng của thể Niphal và ý nghĩa về tập tục được cộng đồng chấp nhận, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: בִּמְקוֹמֵנוּ
  choice: ở nơi chúng ta
  rationale: Giữ hình ảnh cụ thể của מָקוֹם, trong ngữ cảnh chỉ địa phương và tập tục của cộng đồng.
- source_word: לָתֵת
  choice: gả
  rationale: נתן có nghĩa đen là “trao/cho”, nhưng trong ngữ cảnh trao con gái làm vợ, “gả” diễn đạt chính xác hàm ý vốn được tiếng Hê-bơ-rơ để ngầm và tránh câu tối nghĩa trong tiếng Việt.
- source_word: הַצְּעִירָה
  choice: em gái
  rationale: Tính từ giống cái dùng như danh từ, chỉ người con gái trẻ hơn; trong quan hệ đối lập với הַבְּכִירָה, “em gái” tự nhiên và rõ nghĩa.
- source_word: לִפְנֵי
  choice: trước
  rationale: Chỉ sự ưu tiên hoặc thứ tự ở đây, không phải vị trí không gian.
- source_word: הַבְּכִירָה
  choice: chị cả
  rationale: Danh từ giống cái nhấn mạnh người nữ sinh trước/đầu lòng. “Chị cả” vừa tự nhiên trong tiếng Việt vừa bảo toàn quan hệ thứ tự sinh với “em gái”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Câu trực tiếp giữ sắc thái viện dẫn tập tục địa phương; dấu hai chấm làm rõ rằng mệnh đề sau giải thích điều bị xem là không được làm.
