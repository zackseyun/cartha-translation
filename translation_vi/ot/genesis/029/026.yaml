  terminology: “La-ban” theo quy ước phiên âm Việt ngữ nhất quán. Cặp “em gái/chị cả” diễn đạt tự nhiên đối lập giống cái và trật tự sinh của הַצְּעִירָה/הַבְּכִירָה. “Chị cả” bảo toàn sắc thái người chị sinh trước/đầu lòng tốt hơn chỉ nói “chị”.
