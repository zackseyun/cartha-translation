  source_fidelity: 'Bản dịch truyền đạt đúng lời La-ban viện dẫn tập tục địa phương: không gả người em trước người chị sinh trước. “Người ta không làm như vậy” giữ tốt sắc thái vô nhân xưng và tập tục của לֹא יֵעָשֶׂה כֵן; “gả” diễn đạt hàm ý hôn nhân của לָתֵת trong ngữ cảnh mà không làm sai nghĩa.'
