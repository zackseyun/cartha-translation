  terminology: “La-ban” theo lối phiên âm Kinh Thánh Việt ngữ quen dùng. Việc giữ “những người đàn ông” bảo toàn hình thức giống đực của אַנְשֵׁי mà không suy diễn thêm. Chú thích về מִשְׁתֶּה hữu ích và thận trọng, giải thích sắc thái tiệc mừng có uống rượu.
