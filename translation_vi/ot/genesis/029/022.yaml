source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֥ף לָבָ֛ן אֶת כָּל אַנְשֵׁ֥י הַ/מָּק֖וֹם וַ/יַּ֥עַשׂ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: vi
  text: Vậy, La-ban tập hợp tất cả những người đàn ông ở nơi ấy và mở một bữa tiệc[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ một yến tiệc ăn mừng và thường bao hàm cả việc uống rượu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: tập hợp
  rationale: Động từ אסף trong ngữ cảnh này chỉ việc quy tụ người ta lại; “tập hợp” tự nhiên và sát nghĩa.
- source_word: לָבָן
  choice: La-ban
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: tất cả những người đàn ông ở nơi ấy
  rationale: אַנְשֵׁי là dạng số nhiều giống đực của אִישׁ ở trạng thái liên kết. Cách dịch này giữ hình thức giống đực của tiếng Hê-bơ-rơ và không cụ thể hóa הַמָּקוֹם thành “thành” hay “làng”.
- source_word: וַיַּעַשׂ
  choice: mở
  rationale: Dù עשה có nghĩa rộng là “làm”, khi đi với “bữa tiệc”, tiếng Việt tự nhiên dùng “mở một bữa tiệc” để diễn đạt việc tổ chức tiệc.
- source_word: מִשְׁתֶּה
  choice: một bữa tiệc
  rationale: מִשְׁתֶּה chỉ một yến tiệc có tính ăn mừng và thường bao hàm việc uống rượu; “bữa tiệc” vừa tự nhiên vừa không diễn giải quá mức.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ “người đàn ông” để phản ánh hình thức giống đực trong nguyên văn; dùng “mở một bữa tiệc” thay cho lối dịch cứng “làm một bữa tiệc”.
