  source_fidelity: 'Bản dịch phản ánh đúng các thành tố của nguyên văn: וַיֶּאֱסֹף là hành động quy tụ, אֶת־כָּל־אַנְשֵׁי הַמָּקוֹם được giữ rõ là “tất cả những người đàn ông ở nơi ấy,” và וַיַּעַשׂ מִשְׁתֶּה được diễn đạt tự nhiên là “mở một bữa tiệc.” Không thêm chi tiết về địa điểm hay nghi thức cưới mà tiếng Hê-bơ-rơ không nêu trực tiếp.'
