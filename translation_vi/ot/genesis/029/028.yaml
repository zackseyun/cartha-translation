base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: vi
  text: Gia-cốp làm như vậy và hoàn tất tuần lễ ấy[a]; rồi La-ban trao Ra-chên, con gái mình, cho ông làm vợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tuần lễ cưới này”; tiếng Hê-bơ-rơ nói theo nghĩa đen về một chu kỳ bảy ngày, trong bối cảnh này có lẽ là tuần lễ tiệc cưới.'
    reason: Ghi nhận nghĩa cơ bản của שְׁבֻעַ và bối cảnh văn hóa hôn nhân, đồng thời giữ tính dè dặt của cách hiểu “có lẽ”.
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: Gia-cốp làm theo như vậy
  rationale: Diễn đạt tự nhiên ý hồi chỉ của עשה ... כן, tức Gia-cốp làm theo điều La-ban vừa yêu cầu, nhưng không thêm chi tiết ngoài nguyên văn.
- source_word: וַיְמַלֵּא
  choice: hoàn tất
  rationale: Dạng piel của מלא ở đây chỉ việc hoàn thành một khoảng thời gian; “hoàn tất” vừa trang trọng vừa rõ nghĩa.
- source_word: שְׁבֻעַ זֹאת
  choice: tuần lễ ấy
  rationale: שְׁבֻעַ chỉ một chu kỳ bảy ngày và trong ngữ cảnh là tuần lễ cưới. “Ấy” hồi chỉ tuần lễ vừa được La-ban nhắc đến ở câu trước.
- source_word: וַיִּתֶּן לוֹ
  choice: rồi La-ban trao ... cho ông
  rationale: Chủ ngữ hàm ẩn là La-ban theo ngữ cảnh. Nêu tên giúp tiếng Việt rõ ràng; “rồi” thể hiện trình tự kể chuyện.
- source_word: אֶת רָחֵל בִּתּוֹ
  choice: con gái mình là Ra-chên
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, bảo toàn quan hệ đồng vị giữa Ra-chên và “con gái ông”.
- source_word: לוֹ לְאִשָּׁה
  choice: cho ông làm vợ
  rationale: Diễn đạt thành ngữ việc trao người nữ trong hôn nhân, phù hợp văn phong kể chuyện hiện đại mà không cổ hóa.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Không cần chú thích vì “tuần lễ ấy” đã có ngữ cảnh trực tiếp ở câu trước; nếu xuất bản riêng lẻ, có thể cân nhắc chú thích văn hóa rằng đây là tuần lễ cưới.
