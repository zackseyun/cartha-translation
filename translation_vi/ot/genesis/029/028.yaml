    issue: Cụm “làm theo như vậy” bị trùng ý.
    rationale: “Làm theo” đã mang nghĩa tuân theo, còn “như vậy” tương ứng với כֵּן. Bỏ “theo” cho câu tự nhiên hơn, vẫn bảo toàn ý hồi chỉ.
  - severity: low
    issue: Thiếu chú thích cho “tuần lễ ấy.”
    rationale: שְׁבֻעַ nghĩa đen là một chu kỳ bảy và trong bối cảnh hôn nhân nhiều khả năng là tuần lễ cưới. Chú thích giữ được sắc thái văn hóa mà không đưa diễn giải đó vào bản văn chính.
