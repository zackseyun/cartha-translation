  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cặp xưng hô “cậu–cháu” theo đúng quan hệ gia đình giữa La-ban và Gia-cốp; giữ câu hỏi tu từ và mệnh lệnh thương lượng tiền công.
