base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: vi
  text: 'La-ban nói với Gia-cốp[a]: “Chẳng lẽ chỉ vì cháu là bà con của cậu mà cháu phải làm việc cho cậu không công sao? Hãy nói cho cậu biết tiền công của cháu sẽ là bao nhiêu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “anh/em của ta”; ở đây từ này được dùng theo nghĩa rộng là người bà con.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: Chẳng lẽ chỉ vì
  rationale: Diễn đạt tự nhiên cấu trúc nghi vấn tu từ, trong đó quan hệ họ hàng được nêu làm lý do mà La-ban bác bỏ cho việc Gia-cốp lao động không công.
- source_word: אָחִי
  choice: cháu là bà con của cậu
  rationale: אָחִי theo nghĩa đen là “anh/em của ta”, nhưng tại đây chỉ quan hệ họ hàng rộng hơn. Vì Gia-cốp là cháu gọi La-ban bằng cậu, cách xưng hô cậu–cháu vừa đúng bối cảnh vừa tự nhiên; chú thích giữ lại nghĩa đen.
- source_word: וַעֲבַדְתַּנִי
  choice: cháu phải làm việc cho cậu
  rationale: עבד trong ngữ cảnh tiền công chỉ lao động phục vụ La-ban; “làm việc cho” rõ ràng và tự nhiên hơn “phục vụ” trong tiếng Việt hiện đại.
- source_word: חִנָּם
  choice: không công
  rationale: Thành ngữ tiếng Việt gọn và chính xác để chỉ lao động không được trả công.
- source_word: הַגִּידָה לִּי
  choice: Hãy nói cho cậu biết
  rationale: Giữ lực mệnh lệnh của động từ và tân ngữ gián tiếp, đồng thời phù hợp với lối xưng hô trong câu.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: cháu muốn được trả công thế nào
  rationale: Diễn đạt tự nhiên câu hỏi về mức hoặc hình thức tiền công cần thỏa thuận, không áp đặt rằng khoản công nhất thiết phải bằng tiền.
theological_decisions: []
