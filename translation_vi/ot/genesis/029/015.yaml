  terminology: «Bà con» phản ánh đúng nghĩa thân tộc rộng của אָחִי trong ngữ cảnh; chú thích bảo tồn nghĩa đen “anh/em của ta”. «Tiền công» là tương đương thích hợp cho מַשְׂכֻּרֶת.
