  source_fidelity: Câu hỏi tu từ và ý lao động không công được chuyển đạt đúng. Tuy nhiên, «cháu muốn được trả công thế nào» thêm yếu tố ý muốn của Gia-cốp và chuyển câu hỏi về mức tiền công thành câu hỏi về cách thức trả công, không sát với מַה מַשְׂכֻּרְתֶּךָ (“tiền công của cháu sẽ là bao nhiêu/là gì”).
