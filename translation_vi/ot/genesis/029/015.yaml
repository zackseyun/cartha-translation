  to: 'La-ban nói với Gia-cốp[a]: “Chẳng lẽ chỉ vì cháu là bà con của cậu mà cháu phải làm việc cho cậu không công sao? Hãy nói cho cậu biết tiền công của cháu sẽ là bao nhiêu.”'
