    issue: Vị trí neo chú thích [a]
    rationale: Chú thích giải thích “dòng dõi con”/זַרְעֶךָ nhưng hiện đặt sau toàn bộ câu trích dẫn. Nên đặt ngay sau cụm “dòng dõi con” để neo thuật ngữ rõ ràng.
  - severity: low
    issue: Từ “lại” trong “Ngài lại phán với ông”
    rationale: וַיֹּאמֶר chỉ tiếp diễn tường thuật (“rồi/ngài phán”) và không tự nó nhấn mạnh hành động lặp lại. Bỏ “lại” sát nguồn hơn mà vẫn tự nhiên.
