  terminology: “Ngài,” “dòng dõi,” và “hạt giống” trong chú thích đều phù hợp với văn phong Kinh Thánh tiếng Việt. Chú thích bảo lưu đúng độ mở ngữ nghĩa của זֶרַע, không áp đặt cách hiểu thần học đơn số hay số nhiều.
  issues:
