  text: וַ/יּוֹצֵ֨א אֹת֜/וֹ הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הַבֶּט נָ֣א הַ/שָּׁמַ֗יְמָ/ה וּ/סְפֹר֙ הַ/כּ֣וֹכָבִ֔ים אִם תּוּכַ֖ל לִ/סְפֹּ֣ר אֹתָ֑/ם וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: vi
  text: 'Rồi Ngài đưa ông ra ngoài và phán: “Hãy nhìn lên trời và đếm các ngôi sao, nếu con có thể đếm được.” Ngài phán với ông: “Dòng dõi con[a] sẽ như thế.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “hạt giống của con.” Từ Hê-bơ-rơ ở dạng số ít nhưng có thể mang nghĩa tập hợp, chỉ dòng dõi nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: Ngài đưa ông ra ngoài
  rationale: Động từ Hiphil diễn tả việc khiến một người đi ra; “đưa ... ra ngoài” tự nhiên trong tiếng Việt và giữ được sắc thái sai khiến. Đại từ “Ngài” theo ngữ cảnh chỉ Đức Chúa Trời, còn “ông” chỉ Áp-ram.
- source_word: הַבֶּט נָא הַשָּׁמַיְמָה
  choice: Hãy nhìn lên trời
  rationale: “Nhìn lên trời” diễn đạt tự nhiên hướng nhìn do dạng chỉ hướng của הַשָּׁמַיְמָה. נָא làm nhẹ hoặc nhấn lời yêu cầu; trong tiếng Việt, “hãy” truyền đạt lời truyền gọi trang trọng mà không cần thêm “xin,” vốn dễ gợi ý người nói đang cầu xin.
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: và đếm các ngôi sao
  rationale: ספר ở đây có nghĩa là đếm; “các ngôi sao” là cách nói tự nhiên, rõ ràng trong tiếng Việt.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: nếu con có thể đếm được
  rationale: Giữ nguyên mệnh đề điều kiện về khả năng; “đếm được” nhấn mạnh khả năng hoàn tất việc đếm.
- source_word: כֹּה יִהְיֶה
  choice: sẽ như thế
  rationale: Bảo toàn phép so sánh với số sao vừa nêu mà không giải thích quá mức về số lượng.
- source_word: זַרְעֶךָ
  choice: dòng dõi con
  rationale: זֶרַע là danh từ số ít về hình thức nhưng thường mang nghĩa tập hợp. “Dòng dõi” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và không buộc phải xác định một cá nhân hay nhiều hậu duệ.
theological_decisions:
- issue: Cách dịch זַרְעֶךָ trong lời hứa dành cho Áp-ram
  choice: dòng dõi con
  alternative: hạt giống của con; con cháu của con
  rationale: “Dòng dõi” giữ được nghĩa tập hợp và phần nào duy trì độ mở giữa hình thức số ít với nghĩa chỉ hậu duệ. “Hạt giống” quá sát chữ và không tự nhiên khi chỉ con người; “con cháu” làm tính số nhiều rõ hơn nguyên văn.
- issue: Chủ thể của các động từ trong câu
  choice: Ngài
  alternative: Đức Chúa Trời; người
  rationale: Nguyên văn dùng đại từ ngôi ba dựa vào ngữ cảnh. “Ngài” duy trì liên kết văn mạch và thể hiện sự tôn kính mà không chèn lại danh xưng không có trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Ngài–con” cho lời Đức Chúa Trời nói với Áp-ram; “ông” trong lời kể. Dấu chú thích [a] đặt ngay sau mệnh đề chứa từ cần giải thích.
