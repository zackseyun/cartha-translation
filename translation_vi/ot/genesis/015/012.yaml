  rationale: Sửa tối thiểu nhằm cải thiện độ tự nhiên của tiếng Việt và tránh sắc thái xuất thần không cần thiết ở bản văn chính. Bản dịch vẫn bảo toàn hình ảnh, sắc thái kể chuyện, sự khác biệt thể giữa hai động từ “giáng/ập xuống”, và tính mơ hồ của cụm “kinh hãi ... tối tăm”.
