  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ לָ/ב֔וֹא וְ/תַרְדֵּמָ֖ה נָפְלָ֣ה עַל אַבְרָ֑ם וְ/הִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: vi
  text: Khi mặt trời đang lặn, một giấc ngủ say phủ xuống Áp-ram[a]. Kìa, một nỗi kinh hãi lớn, tối tăm, đang ập xuống trên ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một trạng thái xuất thần phủ xuống Áp-ram.” Từ Hê-bơ-rơ có thể chỉ một giấc ngủ sâu khác thường, có lẽ do Đức Chúa Trời khiến xảy ra.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một nỗi kinh hoàng lớn của bóng tối” hoặc “một nỗi kinh hoàng lớn và tối tăm.” Tiếng Hê-bơ-rơ kết hợp nỗi kinh hãi và bóng tối trong một cụm từ cô đọng, giàu hình ảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: Khi mặt trời đang lặn
  rationale: Dùng mệnh đề thời gian tự nhiên trong tiếng Việt để diễn đạt sự chuyển cảnh và tiến trình mặt trời đi đến lúc lặn, không thêm một từ chỉ thời gian không có trong nguyên văn.
- source_word: תַרְדֵּמָה
  choice: một cơn ngủ mê sâu
  rationale: Diễn đạt trạng thái ngủ đặc biệt sâu; tránh mặc định đó là trạng thái xuất thần, dù ngữ cảnh có thể gợi một trạng thái do Đức Chúa Trời khiến nên.
- source_word: נָפְלָה עַל אַבְרָם
  choice: phủ xuống trên Áp-ram
  rationale: Giữ hình ảnh một trạng thái từ trên giáng xuống hay bao phủ nhân vật, đồng thời vẫn tự nhiên và trang trọng trong tiếng Việt.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và làm cảnh tượng trở nên sống động, đột ngột.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: một nỗi kinh hãi lớn, tối tăm
  rationale: Giữ cách kết hợp cô đọng và hơi bất thường của tiếng Hê-bơ-rơ giữa nỗi kinh hãi, bóng tối và mức độ lớn, thay vì giải nghĩa dứt khoát quan hệ giữa các yếu tố.
- source_word: נֹפֶלֶת עָלָיו
  choice: đang ập xuống trên ông
  rationale: Thể hiện sắc thái sống động, đang diễn ra của phân từ và bảo tồn hình ảnh 'rơi/ập xuống trên'.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Bản chất của תַּרְדֵּמָה trong bối cảnh mặc khải
  choice: một cơn ngủ mê sâu
  alternative: một trạng thái xuất thần
  rationale: Danh từ trước hết chỉ giấc ngủ hay cơn mê sâu. Dịch là 'trạng thái xuất thần' sẽ xác định rõ hơn điều mà bản thân từ Hê-bơ-rơ chưa nhất thiết khẳng định.
- issue: Quan hệ giữa nỗi kinh hãi và bóng tối trong אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: một nỗi kinh hãi lớn, tối tăm
  alternative: một nỗi kinh hãi lớn do bóng tối gây nên; một nỗi kinh hãi và bóng tối lớn
  rationale: Cấu trúc Hê-bơ-rơ cô đọng và có thể hiểu theo vài cách. Bản dịch chính giữ sự căng thẳng và hình ảnh ấy thay vì quyết định rằng bóng tối là nguyên nhân hay một yếu tố tách biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kìa” duy trì sắc thái kể chuyện sống động; dấu phẩy trong “lớn, tối tăm” cố ý giữ cấu trúc gợi nhiều cách hiểu của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
