  terminology: “Dòng dõi” diễn đạt chính xác זֶרַע trong ngữ cảnh này. “Người thuộc nhà con” giữ sự dè dặt của nguyên văn về thân phận người này, không tự thêm “nô lệ”. Cách xưng hô “Ngài—con” phù hợp văn cảnh cầu thưa.
