source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: vi
  text: 'Rồi Áp-ram nói: “Này, Ngài đã không ban cho con dòng dõi[a], và kìa, một người thuộc nhà con sẽ là người thừa kế của con[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dòng dõi” dịch từ từ Hê-bơ-rơ zeraʿ, nghĩa đen là “hạt giống”; ở đây chỉ con cái hoặc hậu duệ.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn theo nghĩa đen: “một người con của nhà tôi đang thừa kế tôi.” Cách nói có thể chỉ một người thuộc gia hộ Áp-ram; “thừa kế tôi” là cách nói hoán dụ về việc làm người thừa kế của ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Dạng waw liên tiếp thúc đẩy mạch kể; “Rồi” diễn đạt tự nhiên trình tự câu chuyện.
- source_word: הֵן
  choice: Này
  rationale: Tiểu từ thu hút sự chú ý và nhấn mạnh lời than của Áp-ram; “Này” trang trọng nhưng vẫn dễ hiểu.
- source_word: לֹא נָתַתָּה זָרַע
  choice: Ngài chẳng ban cho con một người nối dõi
  rationale: זֶרַע nghĩa đen là “hạt giống” nhưng ở đây chỉ con cái/hậu duệ; “một người nối dõi” phù hợp với ngữ cảnh thừa kế và giữ trọng tâm là Áp-ram chưa có con.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ tiểu từ chỉ thị thứ hai cùng sức nhấn mạnh và thế song hành tu từ với הֵן.
- source_word: בֶן בֵּיתִי
  choice: một người con trong nhà con
  rationale: Giữ hình ảnh nguyên văn “con của nhà tôi” mà không tự ý xác định người ấy là nô lệ; trong tiếng Việt, cách nói này chỉ một người thuộc gia hộ.
- source_word: יוֹרֵשׁ אֹתִי
  choice: sẽ thừa kế gia sản của con
  rationale: Nguyên văn là “thừa kế tôi”; tiếng Việt không dùng cấu trúc ấy với nghĩa này, nên nêu rõ đối tượng hàm ẩn là gia sản, đồng thời tránh biến mệnh đề thành danh xưng “người thừa kế của tôi”.
theological_decisions:
- issue: Thân phận của בֶן בֵּיתִי
  choice: một người con trong nhà con
  alternative: một nô lệ sinh trong nhà con
  rationale: Câu này không dùng từ “nô lệ”; bản dịch không áp đặt địa vị xã hội cụ thể hơn điều tiếng Hê-bơ-rơ nói.
- issue: Đối tượng của hành động thừa kế trong יוֹרֵשׁ אֹתִי
  choice: gia sản của con
  alternative: con; hoặc sẽ là người thừa kế của con
  rationale: Đại từ “tôi” trong nguyên văn có thể dùng hoán dụ cho tài sản/dòng dõi của Áp-ram. Cách dịch tiếng Việt làm rõ nghĩa thông dụng cần thiết nhưng ghi nhận nguyên văn trong chú thích để bảo toàn sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ hai tiểu từ nhấn mạnh “Này” và “kìa”. Dùng cách xưng hô “Ngài—con” khi Áp-ram thưa với Đức Chúa Trời. Không thêm chú thích vì câu dịch không gắn ký hiệu chú thích; các điểm ngữ nghĩa được ghi trong hồ sơ quyết định.
