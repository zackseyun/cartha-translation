  source_fidelity: 'Cần sửa “một người nối dõi”: זֶרַע là danh từ tập thể, chỉ dòng dõi/con cái nói chung, chứ không xác định một người nối dõi. “Gia sản” diễn giải hợp lý đối với “thừa kế tôi”, nhưng làm hẹp hoán dụ nguyên ngữ; “là người thừa kế của con” tự nhiên hơn và vẫn truyền đạt ý nghĩa trong ngữ cảnh.'
