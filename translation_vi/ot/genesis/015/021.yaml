  naturalness: Cấu trúc liệt kê tự nhiên, nhưng “dân” là cách gọi gọn và thông dụng hơn “người” đối với các cộng đồng sắc tộc cổ đại. Giữ “và” đầu câu vì đây là phần tiếp nối của danh sách từ câu trước.
  terminology: Các dạng A-mô-rít, Ca-na-an, Ghi-rê-ga-sít và Giê-bu-sít phù hợp với cách phiên âm Việt ngữ quen dùng. Thay “người” bằng “dân” giúp thuật ngữ chỉ dân tộc nhất quán và chính xác hơn về mặt ngữ nghĩa tập thể.
