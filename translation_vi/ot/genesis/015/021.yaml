  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: vi
  text: và dân A-mô-rít, dân Ca-na-an, dân Ghi-rê-ga-sít và dân Giê-bu-sít.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: và
  rationale: וְ nối tiếp danh sách, còn אֶת đánh dấu tân ngữ xác định. Tiếng Việt không có từ tương đương cần lặp lại cho אֶת; dùng “và” theo cú pháp liệt kê tự nhiên.
- source_word: הָאֱמֹרִי
  choice: người A-mô-rít
  rationale: Danh từ dân tộc ở số ít hình thái nhưng mang nghĩa tập thể; cấu trúc “người + tên dân” diễn đạt tự nhiên cả cộng đồng trong tiếng Việt.
- source_word: הַכְּנַעֲנִי
  choice: người Ca-na-an
  rationale: Dùng tên gọi quen thuộc trong tiếng Việt và hiểu theo nghĩa tập thể, phù hợp danh sách các dân cư trong đất.
- source_word: הַגִּרְגָּשִׁי
  choice: người Ghi-rê-ga-sít
  rationale: Phiên âm tên dân tộc và dùng “người” để thể hiện nghĩa tập thể của danh từ Hê-bơ-rơ.
- source_word: הַיְבוּסִי
  choice: người Giê-bu-sít
  rationale: Phiên âm tên dân tộc theo cách dễ đọc trong tiếng Việt và giữ nghĩa tập thể.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nguyên tính chất nối tiếp của danh sách từ câu trước; lược bớt liên từ ở giữa theo lối liệt kê tự nhiên của tiếng Việt nhưng giữ “và” ở đầu câu và trước mục cuối.
