    rationale: Các tộc danh Hê-bơ-rơ ở đây có hình thức số ít nhưng mang nghĩa tập thể trong danh sách các cư dân/nhóm dân. Tiếng Việt hiện đại diễn đạt điều này tự nhiên hơn bằng “dân”.
