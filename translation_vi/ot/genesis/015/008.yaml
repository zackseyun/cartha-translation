source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהוִ֔ה בַּ/מָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: vi
  text: 'Ông thưa: “Lạy Chúa Yahweh, dựa vào đâu con sẽ biết rằng con sẽ sở hữu đất ấy?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Làm sao con biết rằng con sẽ thừa hưởng đất ấy?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Ông thưa
  rationale: Wayyiqtol của אמר tiếp nối mạch kể. Trong ngữ cảnh Áp-ram trực tiếp kính cẩn nói với Đức Chúa Trời, “ông thưa” tự nhiên và phù hợp hơn lối dịch máy móc “và ông nói”.
- source_word: אֲדֹנָי יֱהוִה
  choice: Lạy Chúa Yahweh
  rationale: Giữ danh riêng giao ước יהוה là “Yahweh”, đồng thời diễn đạt אֲדֹנָי bằng “Chúa”; từ “Lạy” đánh dấu lời xưng hô kính cẩn trong tiếng Việt.
- source_word: בַּמָּה
  choice: dựa vào đâu
  rationale: Nghĩa đen là “bằng điều gì”; trong câu hỏi xin một căn cứ hay dấu hiệu xác nhận, “dựa vào đâu” tự nhiên và giữ sắc thái phương tiện/căn cứ rõ hơn chỉ nói “làm sao”.
- source_word: אֵדַע
  choice: con sẽ biết
  rationale: Qal vị hoàn thành chưa trọn 1cs của ידע trong câu hỏi hướng đến sự xác quyết tương lai. Đại từ “con” được thêm theo quy ước xưng hô tự nhiên khi Áp-ram nói với Đức Chúa Trời.
- source_word: כִּי
  choice: rằng
  rationale: Dẫn nội dung điều Áp-ram muốn biết; “rằng” là liên từ bổ ngữ tự nhiên trong tiếng Việt.
- source_word: אִירָשֶׁנָּה
  choice: con sẽ được sở hữu đất ấy
  rationale: ירשׁ có thể chỉ việc sở hữu, nhận làm cơ nghiệp, hoặc chiếm hữu. Dạng tiếng Việt này truyền đạt kết quả sở hữu miền đất đã nói ở câu trước mà không mặc nhiên nhấn mạnh việc thừa kế từ người đã chết; “đất ấy” làm rõ sở chỉ giống cái số ít trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh xưng kép אֲדֹנָי יֱהוִה
  choice: Lạy Chúa Yahweh
  alternative: Lạy Chúa là Đức Giê-hô-va; Lạy Chúa Hằng Hữu
  rationale: Bản văn nêu trực tiếp danh יהוה. Giữ “Yahweh” phân biệt danh riêng này với tước hiệu אֲדֹנָי, tránh tạo cụm lặp “Chúa CHÚA” và không thay danh riêng bằng một phẩm tính diễn giải.
- issue: Sắc thái của ירשׁ đối với lời hứa về đất
  choice: được sở hữu
  alternative: được thừa hưởng; chiếm hữu
  rationale: Ngữ căn cho phép cả sắc thái sở hữu và thừa hưởng. Bản chính chọn cách nói rộng, không buộc câu văn vào cơ chế thừa kế thông thường hay hàm ý quân sự; phương án “thừa hưởng” được ghi ở chú thích để bảo tồn khả năng từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ông thưa” cùng cặp xưng hô “Lạy… con” thể hiện sự kính cẩn tự nhiên trong tiếng Việt. Đại từ thay thế trong אִירָשֶׁנָּה được diễn đạt rõ là “đất ấy” theo tiền ngữ “đất này” ở câu 7.
