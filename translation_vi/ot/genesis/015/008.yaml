revisions:
- from: 'Ông thưa: “Lạy Chúa Yahweh, dựa vào đâu con sẽ biết rằng con sẽ được sở hữu đất ấy?”[a]'
  to: 'Ông thưa: “Lạy Chúa Yahweh, dựa vào đâu con sẽ biết rằng con sẽ sở hữu đất ấy?”[a]'
  rationale: Chỉ sửa «được sở hữu» thành «sở hữu» để phản ánh đúng thể chủ động của động từ ירשׁ và tránh sắc thái được cho phép/được cấp quyền không có trong nguyên ngữ. Chú thích tiếp tục nêu phương án từ vựng «thừa hưởng».
