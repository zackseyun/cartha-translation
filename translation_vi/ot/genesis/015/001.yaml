- from: 'Sau những việc ấy, lời của Yahweh đến với Áp-ram trong một khải tượng, phán rằng: “Hỡi Áp-ram, đừng sợ. Ta là khiên che chở cho con; phần thưởng của con sẽ rất lớn.”[a]'
  to: 'Sau những việc ấy, lời của Yahweh đến với Áp-ram trong một khải tượng, phán rằng: “Hỡi Áp-ram, đừng sợ. Ta là khiên che chở ngươi; phần thưởng của ngươi sẽ rất lớn.”[a]'
  rationale: Sửa cặp đại từ để không thêm quan hệ cha-con ngoài nguyên văn. Chỉnh chú thích để bảo lưu đúng sự thay đổi về cú pháp/cách hiểu động từ không được nêu rõ, đồng thời duy trì nghĩa của bản chính.
