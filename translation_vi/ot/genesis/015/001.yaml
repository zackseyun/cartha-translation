id: GEN.15.1
reference: Genesis 15:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: vi
  text: 'Sau những việc ấy, lời của Yahweh đến với Áp-ram trong một khải tượng, phán rằng: “Hỡi Áp-ram, đừng sợ. Ta là khiên che chở ngươi; phần thưởng của ngươi sẽ rất lớn.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta là khiên của ngươi; phần thưởng của ngươi rất lớn.”'
    reason: Tiếng Hê-bơ-rơ không nêu rõ động từ trong mệnh đề cuối, nên có thể hiểu theo sắc thái hiện tại; “khiên của ngươi” là một cách chuyển dịch tự nhiên khác của מָגֵן לָךְ.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sau những việc ấy
  rationale: Giữ nghĩa rộng của דְּבָרִים, có thể bao quát các sự việc vừa được thuật lại mà không giới hạn thành lời nói hay một loại biến cố cụ thể.
- source_word: דְבַר יְהוָה
  choice: lời của Yahweh
  rationale: Bảo tồn công thức mặc khải quen thuộc trong tiếng Hê-bơ-rơ và dùng thánh danh riêng như nguyên văn.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: đến với Áp-ram
  rationale: Diễn đạt tự nhiên trong tiếng Việt về việc lời mặc khải được ban cho một người, thay vì dịch máy móc là 'đã có đối với'.
- source_word: בַּמַּחֲזֶה
  choice: trong một khải tượng
  rationale: מַחֲזֶה chỉ một sự mặc khải qua thị kiến; 'khải tượng' vừa rõ nghĩa vừa phù hợp văn phong Kinh Thánh trang trọng.
- source_word: לֵאמֹר
  choice: phán rằng
  rationale: Dẫn vào lời nói trực tiếp; 'phán' là cách nói tự nhiên, trang trọng khi chủ thể là Đức Chúa Trời.
- source_word: אַל תִּירָא
  choice: đừng sợ
  rationale: Mệnh lệnh phủ định trực tiếp, ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: מָגֵן לָךְ
  choice: khiên che chở cho con
  rationale: Giữ hình ảnh 'khiên' và cấu trúc 'cho con'; thêm 'che chở' để phép ẩn dụ rõ và tự nhiên trong tiếng Việt, không biến danh từ thành sở hữu cách một cách tuyệt đối.
- source_word: שְׂכָרְךָ
  choice: phần thưởng của con
  rationale: שָׂכָר có thể là tiền công, sự đền đáp hoặc phần thưởng; 'phần thưởng' phù hợp nhất với lời hứa trong ngữ cảnh giao ước.
- source_word: הַרְבֵּה מְאֹד
  choice: sẽ rất lớn
  rationale: Cụm Hê-bơ-rơ là vị ngữ không có động từ; 'sẽ' diễn đạt sắc thái lời hứa theo ngữ cảnh, còn chú thích bảo lưu khả năng hiểu ở hiện tại.
theological_decisions:
- issue: Cách chuyển dịch thánh danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh; phiên âm 'Yahweh' bảo tồn tính chất tên riêng của Đức Chúa Trời mà không thay bằng tước hiệu.
- issue: Cấu trúc của lời hứa שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: phần thưởng của con sẽ rất lớn
  alternative: phần thưởng của con thật vô cùng lớn
  rationale: Bản chính hiểu đây là một vị ngữ riêng nói về phần thưởng và dùng thì tương lai theo lực ngôn trung của lời hứa. Vì tiếng Hê-bơ-rơ không có động từ hiện rõ, chú thích bảo lưu cách hiểu trạng thái hiện tại và mức nhấn mạnh mạnh hơn.
- issue: Đại từ trong lời Đức Chúa Trời phán với Áp-ram
  choice: Ta ... con
  alternative: Ta ... ngươi
  rationale: '''Ta ... con'' truyền đạt quan hệ bề trên–bề dưới một cách trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại, tránh sắc thái xa cách hoặc cổ của ''ngươi''.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Áp-ram” theo dạng tên quen thuộc trong Kinh Thánh tiếng Việt; dùng “khải tượng” cho ngữ cảnh mặc khải. Dấu chú thích được đặt sau chính mệnh đề có cách dịch thay thế, thay vì sau công thức mở đầu.
