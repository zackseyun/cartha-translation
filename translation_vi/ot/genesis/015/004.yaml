  to: 'Và này, lời của Đức Giê-hô-va đến với ông, phán rằng: “Người này sẽ không phải là người thừa kế của con; nhưng chính người từ thân thể con mà ra sẽ là người thừa kế của con.”'
  rationale: Chỉnh các cách diễn đạt để tiếng Việt hiện đại, tự nhiên hơn, đồng thời bảo toàn sự đối lập và sự nhấn mạnh của nguyên văn. Bản sửa không diễn giải người ấy là ‘con trai’, không nêu người mẹ, và không thêm đối tượng tài sản cụ thể.
