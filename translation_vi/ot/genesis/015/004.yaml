review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo giữ đúng cấu trúc đối lập và ý chính của tiếng Hê-bơ-rơ: người đang được nói đến không phải người kế tự của Áp-ram, còn người xuất thân từ chính Áp-ram sẽ là người kế tự. Tuy nhiên, cụm “người do thân thể con sinh ra” trong tiếng Việt dễ gợi rằng Áp-ram trực tiếp sinh con, không diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “ra từ thân thể/lòng con”. Việc thêm “gia sản” cũng cụ thể hóa đối tượng thừa kế hơn văn bản, vốn nói trực tiếp rằng người ấy sẽ ‘thừa kế con’/là người kế tự của con.'
  naturalness: “Và kìa” và “đến với ông rằng” có thể hiểu được nhưng hơi dịch sát. “Và này” và “đến với ông, phán rằng” tự nhiên, trang trọng và vẫn phản ánh công thức tường thuật. “Người thừa kế của con” rõ nghĩa và tự nhiên hơn “thừa kế gia sản của con” trong câu này.
  terminology: Giữ “Đức Giê-hô-va” theo lựa chọn danh riêng của bản thảo. Dùng “người thừa kế” để chuyển tải động từ ירש trong ngữ cảnh lời hứa về người kế tự, không thêm chi tiết về tài sản hay về người mẹ.
  issues:
  - severity: medium
    issue: “người do thân thể con sinh ra”
    rationale: Cách nói này không tự nhiên khi người được hứa là hậu tự của Áp-ram và có thể gợi nghĩa Áp-ram là người trực tiếp sinh nở. Thành ngữ nguồn chỉ người ‘ra từ’ chính thân thể/lòng của ông; nên giữ hình ảnh đó mà không xác định thêm.
  - severity: low
    issue: Thêm “gia sản” ở cả hai vế
    rationale: Ngữ cảnh hàm ý quyền thừa kế, nhưng tiếng Hê-bơ-rơ không nêu danh từ ‘gia sản’. “Người thừa kế của con” truyền đạt quan hệ kế tự mà không cụ thể hóa thêm.
  revised_text: 'Và này, lời của Đức Giê-hô-va đến với ông, phán rằng: “Người này sẽ không phải là người thừa kế của con; nhưng chính người từ thân thể con mà ra sẽ là người thừa kế của con.”'
