  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: vi
  text: 'Và này, lời của Đức Giê-hô-va đến với ông, phán rằng: “Người này sẽ không phải là người thừa kế của con; nhưng chính người từ thân thể con mà ra sẽ là người thừa kế của con.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Và kìa
  rationale: Giữ chức năng thu hút sự chú ý và đánh dấu sự can thiệp bất ngờ trong trình thuật, với cách diễn đạt trang trọng nhưng dễ hiểu.
- source_word: דְבַר יְהוָה
  choice: lời của Đức Giê-hô-va
  rationale: Dịch דָּבָר là “lời” và thể hiện danh riêng יהוה bằng cách phiên âm quen thuộc trong tiếng Việt, không thay bằng một tước hiệu.
- source_word: לֹא יִירָשְׁךָ זֶה
  choice: Người này sẽ không thừa kế gia sản của con
  rationale: Đại từ chỉ thị זֶה trong ngữ cảnh chỉ người quản gia đã được nhắc đến; thêm “gia sản” làm rõ nghĩa chuyển tiếp của động từ ירש trong tiếng Việt mà không đổi đối tượng thừa kế.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: người do thân thể con sinh ra
  rationale: Thành ngữ Hê-bơ-rơ nói sát là người “ra từ nội tạng/bụng” của Áp-ram; cách dịch này truyền đạt quan hệ huyết thống trực tiếp một cách tự nhiên và không xác định vượt quá văn bản về người mẹ.
- source_word: הוּא יִירָשֶׁךָ
  choice: chính người ... sẽ thừa kế gia sản của con
  rationale: Dùng “chính” để phản ánh đại từ chủ ngữ nhấn mạnh הוּא và giữ sự đối lập với “người này” ở vế trước.
theological_decisions:
- issue: Lời hứa về người thừa kế của Áp-ram
  choice: Giữ lời khẳng định rằng người thừa kế sẽ do chính thân thể Áp-ram sinh ra
  alternative: Diễn giải cụ thể là “con trai ruột của con” hoặc xác định người mẹ
  rationale: Văn bản nhấn mạnh nguồn gốc thân thể từ Áp-ram nhưng tại câu này chưa nói rõ thêm; bản dịch không đi trước sự mặc khải tiếp theo của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. Xưng hô “ông/con” thể hiện lời người kể và lời Đức Chúa Trời phán với Áp-ram. Không dùng chú thích vì các nét nghĩa thiết yếu có thể thể hiện ngay trong chính văn.
