id: GEN.15.20
reference: Genesis 15:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: vi
  text: cùng dân Hê-tít, dân Phê-rê-xít và dân Rê-pha-im[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “những người khổng lồ.” Từ Hê-bơ-rơ Rê-pha-im trong một số ngữ cảnh có thể được hiểu theo nghĩa mô tả, nhưng tại đây nhiều khả năng là tên một dân tộc trong xứ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחִתִּי
  choice: cùng dân Hê-tít
  rationale: Liên từ וְ tiếp nối danh sách từ câu trước, còn אֶת là dấu hiệu tân ngữ nên không dịch riêng. Danh từ chỉ dân tộc ở dạng số ít nhưng mang nghĩa tập thể, vì vậy dịch tự nhiên là “dân Hê-tít”.
- source_word: וְאֶת הַפְּרִזִּי
  choice: dân Phê-rê-xít
  rationale: Dạng số ít có mạo từ được dùng theo nghĩa tập thể để chỉ cả một dân tộc; “dân Phê-rê-xít” diễn đạt rõ chức năng này trong tiếng Việt.
- source_word: וְאֶת הָרְפָאִים
  choice: và dân Rê-pha-im
  rationale: Trong danh sách các dân cư của xứ, רְפָאִים phù hợp nhất với tên một nhóm người. Giữ tên riêng bằng cách phiên âm, thay vì đưa cách hiểu “những người khổng lồ” vào chính văn.
theological_decisions:
- issue: Nên hiểu רְפָאִים là tên một dân tộc hay một từ mô tả
  choice: Dịch là tên dân tộc “dân Rê-pha-im”
  alternative: “những người khổng lồ”
  rationale: Sáng Thế 15:19–21 đang liệt kê các dân trong miền đất được hứa ban cho Áp-ram, nên cách hiểu là tên dân tộc phù hợp nhất với ngữ cảnh. Cách hiểu truyền thống “những người khổng lồ” vẫn được giữ trong chú thích để không xóa bỏ khả năng từ vựng này.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Dân” được lặp ở mỗi tên để làm rõ đây là các nhóm dân tộc; liên từ được sắp xếp tự nhiên cho phần cuối của một danh sách kéo dài từ câu trước.
