language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: vi
  text: Vào đời thứ tư, họ sẽ trở về đây, vì cho đến lúc ấy, tội lỗi của dân A-mô-rít[a] vẫn chưa đầy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng dạng số ít “người A-mô-rít” theo nghĩa tập hợp, chỉ cả dân tộc.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “cho đến đây”; trong ngữ cảnh hướng tới tương lai, nghĩa là “cho đến lúc ấy,” tức tội lỗi của họ vẫn chưa đạt đủ mức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֹור רְבִיעִי
  choice: Đến đời thứ tư
  rationale: דּוֹר là “đời, thế hệ”; trong mạch thời gian hướng tới tương lai, “đến đời thứ tư” tự nhiên trong tiếng Việt và diễn đạt thời điểm của cuộc trở về.
- source_word: יָשׁוּבוּ
  choice: họ sẽ trở về
  rationale: שׁוּב chỉ việc quay lại, trở về; ở đây chủ thể được hiểu từ ngữ cảnh là dòng dõi Áp-ram.
- source_word: הֵנָּה
  choice: đây
  rationale: Trạng từ chỉ nơi chốn theo điểm nhìn của lời phán, tức vùng đất đang được nói đến.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do khiến cuộc trở về chưa diễn ra trước thời điểm ấy.
- source_word: לֹא שָׁלֵם
  choice: vẫn chưa đầy đủ
  rationale: שָׁלֵם diễn tả trạng thái trọn vẹn hoặc đạt đủ mức; “vẫn chưa đầy đủ” giữ hình ảnh về một mức độ chưa đạt tới mà không giải thích quá mức.
- source_word: עֲוֹן
  choice: tội lỗi
  rationale: עָוֹן có thể chỉ sự gian ác, tội lỗi hoặc hệ quả trách nhiệm do tội. Trong câu này, “tội lỗi” là cách diễn đạt rõ ràng, thông dụng, vẫn giữ trọng tâm đạo đức.
- source_word: הָאֱמֹרִי
  choice: dân A-mô-rít
  rationale: Danh từ số ít có chức năng tập hợp, chỉ cả dân tộc; “dân A-mô-rít” truyền đạt đúng giá trị tập thể trong tiếng Việt.
- source_word: עַד הֵנָּה
  choice: cho đến lúc ấy
  rationale: Nghĩa sát chữ là “cho đến đây”; do lời phán đang hướng tới đời thứ tư trong tương lai, cụm từ được hiểu theo thời gian là “cho đến lúc ấy”, nhưng nghĩa sát chữ được ghi chú.
theological_decisions:
- issue: Sự trì hoãn cuộc trở về và phán xét dân A-mô-rít
  choice: 'Giữ nguyên lý do được câu văn nêu: cuộc trở về xảy ra vào đời thứ tư vì đến lúc ấy tội lỗi của dân A-mô-rít vẫn chưa đạt mức đầy đủ.'
  alternative: Diễn giải rõ đây là sự kiên nhẫn của Đức Chúa Trời đối với dân A-mô-rít, hoặc chủ yếu là thời gian để hình thành dân Y-sơ-ra-ên tại Ai Cập.
  rationale: Câu Kinh Thánh chỉ trực tiếp nối thời điểm trở về với mức độ tội lỗi của dân A-mô-rít; bản dịch không thêm một hệ thống giải thích thần học vượt quá lời văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đời thứ tư” phù hợp với cách nói về thế hệ; “đầy đủ” giữ hình ảnh nguyên ngữ về tội lỗi chưa đạt tới mức trọn vẹn. Tất cả dấu chú thích đều có trong chính văn.
