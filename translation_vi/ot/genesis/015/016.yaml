- from: Đến đời thứ tư, họ sẽ trở về đây, vì tội lỗi của dân A-mô-rít[a] cho đến lúc ấy vẫn chưa đầy đủ[b].
  to: Vào đời thứ tư, họ sẽ trở về đây, vì cho đến lúc ấy, tội lỗi của dân A-mô-rít[a] vẫn chưa đầy[b].
  rationale: Bản sửa chỉ điều chỉnh cách diễn đạt thời điểm và sắc thái “chưa đầy” để gần nguyên ngữ hơn và tự nhiên hơn trong tiếng Việt. Chú thích giữ lại dạng số ít tập hợp của “A-mô-rít” và nghĩa sát chữ của cụm “cho đến đây.”
  reviewer_model: gpt-5.6-terra
