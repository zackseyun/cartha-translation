source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: vi
  text: 'Rồi Ngài phán với Áp-ram: “Hãy biết chắc rằng dòng dõi của con sẽ là người ngoại kiều[a] trong một xứ không thuộc về họ. Người ta sẽ bắt họ làm nô lệ[b] và áp bức họ trong bốn trăm năm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khách lạ” hoặc “người trú ngụ”. Từ Hê-bơ-rơ chỉ người sống trong một vùng đất không thuộc về mình.
    reason: lexical_alternative
  - marker: b
    text: Hay “bắt họ phục dịch”. Động từ Hê-bơ-rơ có thể chỉ việc bị buộc phải phục vụ; trong văn cảnh này, nghĩa nô dịch bị cưỡng ép là phù hợp.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: Hãy biết chắc rằng
  rationale: Kết cấu nguyên thể tuyệt đối đi với động từ cùng gốc nhấn mạnh mức độ chắc chắn. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ được sức nhấn của tiếng Hê-bơ-rơ.
- source_word: גֵר
  choice: sống như kiều dân
  rationale: Từ này chỉ người cư trú trong một vùng đất không thuộc về mình và không phải người bản xứ. Cụm từ đã chọn diễn đạt rõ tình trạng cư trú nơi đất khách mà không nhất thiết hàm ý cuộc lưu trú rất ngắn.
- source_word: זַרְעֲךָ
  choice: dòng dõi của con
  rationale: Danh từ số ít có nghĩa tập thể, chỉ những người phát xuất từ Áp-ram. “Dòng dõi” tự nhiên và trang trọng trong tiếng Việt, đồng thời bảo toàn ý nghĩa tập thể.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: trong một xứ không thuộc về họ
  rationale: Diễn đạt trực tiếp ý không sở hữu và tình trạng ở đất của người khác, sát cấu trúc nguồn nhưng vẫn tự nhiên.
- source_word: וַעֲבָדוּם
  choice: Người ta sẽ bắt họ phục dịch
  rationale: Động từ ở số nhiều kèm tân ngữ số nhiều diễn tả việc dòng dõi Áp-ram bị buộc phải phục vụ. Chủ thể không được nêu rõ trong câu Hê-bơ-rơ; “người ta” giữ tính không xác định ấy và tránh chuỗi đại từ gây hiểu ngược.
- source_word: וְעִנּוּ אֹתָם
  choice: và áp bức họ
  rationale: Ở thể piel, động từ ענה thường chỉ việc làm khổ, áp bức hoặc đối xử hà khắc. “Áp bức” phù hợp với bối cảnh cưỡng bức phục dịch.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: trong bốn trăm năm
  rationale: Tiếng Hê-bơ-rơ đặt khoảng thời gian ở cuối câu mà không có giới từ. Thêm “trong” là cách diễn đạt thời lượng tự nhiên trong tiếng Việt.
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: Rồi Ngài phán với Áp-ram
  rationale: “Rồi” thể hiện bước tiến của mạch kể; “phán” phù hợp với lời Đức Chúa Trời trong văn cảnh, còn “Ngài” nối lại chủ thể đã được xác định trước đó.
theological_decisions:
- issue: Chủ thể số nhiều của “sẽ bắt họ phục dịch và áp bức họ”
  choice: Dùng chủ thể phiếm chỉ “người ta”, hiểu là những người trong xứ ngoại bang nhưng không nêu cụ thể hơn bản văn.
  alternative: 'Dịch bị động: “họ sẽ bị bắt phục dịch và bị áp bức”; hoặc nêu rõ: “dân xứ ấy sẽ bắt họ làm nô lệ”.'
  rationale: Các động từ Hê-bơ-rơ ở chủ động số nhiều, nhưng chủ thể không được gọi tên. Lối phiếm chỉ vừa giữ dạng chủ động vừa tránh khẳng định chi tiết vượt quá câu nguồn.
- issue: Phạm vi của “bốn trăm năm”
  choice: Đặt cụm thời gian sau cả hai hành động, như trong trật tự tiếng Hê-bơ-rơ.
  alternative: Chỉ gắn khoảng thời gian với việc áp bức, hoặc diễn giải là toàn bộ thời gian kiều ngụ.
  rationale: Bản văn đặt cụm thời gian ở cuối chuỗi mệnh đề và không giải thích tường minh phạm vi chính xác; bản dịch không thêm lời nhằm giải quyết căng thẳng niên đại hay thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Xứ” giữ sắc thái Kinh Thánh vừa phải; “kiều dân” được giải thích bằng chú thích để tránh bị hiểu thuần túy theo tư cách pháp lý hiện đại. Cách xưng hô “con” trong lời phán tạo giọng tự nhiên, có thẩm quyền nhưng không cổ hóa như “ngươi”.
