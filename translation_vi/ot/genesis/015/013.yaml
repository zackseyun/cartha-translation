revisions:
- from: 'Rồi Ngài phán với Áp-ram: “Hãy biết chắc rằng dòng dõi của con sẽ sống như kiều dân[a] trong một xứ không thuộc về họ. Người ta sẽ bắt họ phục dịch[b] và áp bức họ trong bốn trăm năm.”'
  to: 'Rồi Ngài phán với Áp-ram: “Hãy biết chắc rằng dòng dõi của con sẽ là người ngoại kiều[a] trong một xứ không thuộc về họ. Người ta sẽ bắt họ làm nô lệ[b] và áp bức họ trong bốn trăm năm.”'
  rationale: Sửa thuật ngữ chỉ tình trạng cư trú để tránh nghĩa hiện đại lệch của “kiều dân”, và làm rõ ý nô dịch của động từ trong bối cảnh áp bức. Bản sửa vẫn bảo toàn chủ thể phiếm chỉ của các động từ số nhiều, không xác định cụ thể kẻ áp bức, và không giải quyết thêm phạm vi đang được tranh luận của mốc bốn trăm năm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:05:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng lời bảo đảm nhấn mạnh, tính tập thể của “dòng dõi”, tình trạng ở đất không thuộc về họ, sự cưỡng bức và áp bức, cùng thời lượng bốn trăm năm. Tuy nhiên, “kiều dân” trong tiếng Việt hiện đại thường dễ chỉ công dân sống ở nước ngoài hơn là người ngoại quốc cư trú trong một xứ; do đó không diễn đạt chính xác nhất גֵּר. “Bắt họ phục dịch” có thể dùng, nhưng không rõ ý nô dịch/cưỡng bức bằng “bắt họ làm nô lệ” trong văn cảnh này.
  naturalness: Câu văn trang trọng, hiện đại và dễ đọc. Thay “sống như kiều dân” bằng “sẽ là người ngoại kiều” vừa tự nhiên hơn vừa tránh nghĩa hành chính hoặc nghĩa “kiều bào” không mong muốn. Cụm “Người ta sẽ...” giữ được chủ thể số nhiều không xác định của tiếng Hê-bơ-rơ và tránh nhập nhằng đại từ.
  terminology: “Dòng dõi”, “xứ”, “áp bức”, “Áp-ram”, và cách gọi “Ngài phán” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. “Người ngoại kiều” cần chú thích để cho biết đây là tình trạng cư trú nơi đất không thuộc về mình, không nhất thiết là một quy chế pháp lý hiện đại. “Làm nô lệ” phản ánh rõ hơn sắc thái cưỡng bức của עבדם trong ngữ cảnh.
  issues:
  - severity: medium
    issue: “Kiều dân” không phải tương đương Việt ngữ chính xác nhất cho גֵּר.
    rationale: Trong cách dùng hiện đại, “kiều dân” thường gợi người của một nước sống ở nước khác. Câu nguồn nói về dòng dõi Áp-ram là người cư trú trong một vùng đất không thuộc về họ; “người ngoại kiều” diễn đạt sát hơn.
  - severity: low
    issue: “Bắt họ phục dịch” làm yếu ý nô dịch trong mạch văn.
    rationale: Dù động từ có thể mang nghĩa buộc phục dịch, sự song hành với “áp bức” và ngữ cảnh cho phép, đồng thời hỗ trợ, cách dịch rõ là “bắt họ làm nô lệ”. Chủ thể vẫn được để phiếm chỉ, không thêm chi tiết ngoài bản văn.
