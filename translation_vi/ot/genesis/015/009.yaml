  terminology: «Dê cái», «cừu đực», «chim cu», và «bồ câu non» phù hợp các từ nguồn. Đổi «bò cái» thành «bò cái tơ» để phản ánh chính xác hơn עֶגְלָה, đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
