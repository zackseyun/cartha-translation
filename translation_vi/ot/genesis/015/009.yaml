revisions:
- from: 'Ngài phán với ông: “Hãy đem đến cho Ta một con bò cái ba tuổi, một con dê cái ba tuổi, một con cừu đực ba tuổi,[a] một con chim cu và một con bồ câu non.”'
  to: 'Ngài phán với ông: “Hãy đem đến cho Ta một con bò cái tơ ba tuổi, một con dê cái ba tuổi, một con cừu đực ba tuổi,[a] một con chim cu và một con bồ câu non.”'
