base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: vi
  text: 'Ngài phán với ông: “Hãy đem đến cho Ta một con bò cái tơ ba tuổi, một con dê cái ba tuổi, một con cừu đực ba tuổi,[a] một con chim cu và một con bồ câu non.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được lặp lại cho ba con vật này thường được hiểu là «ba tuổi»; cũng có thể dịch sát là «gấp ba» hoặc «ba phần».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Ngài phán với ông
  rationale: Giữ mạch kể chuyện của thể wayyiqtol; dùng “phán” cho lời Đức Chúa Trời và đại từ theo ngữ cảnh, trong đó người nghe là Áp-ram.
- source_word: קְחָה לִי
  choice: Hãy đem đến cho Ta
  rationale: Nghĩa sát là “hãy lấy cho Ta”; trong nghi thức giao ước này, cách diễn đạt tự nhiên là đem hoặc kiếm các con vật đến cho Đức Chúa Trời.
- source_word: עֶגְלָה
  choice: bò cái
  rationale: Chỉ một con bò giống cái; cách gọi này rõ ràng và tự nhiên hơn thuật ngữ chuyên biệt ít thông dụng.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: ba tuổi
  rationale: Trong danh sách các con vật, cách hiểu truyền thống và phù hợp ngữ cảnh là tuổi của chúng, dù dạng Hê-bơ-rơ có thể hiểu sát hơn là “gấp ba/ba phần”.
- source_word: עֵז
  choice: dê cái
  rationale: Danh từ giống cái chỉ con dê cái; bản dịch nêu rõ giới tính.
- source_word: אַיִל
  choice: cừu đực
  rationale: Chỉ con cừu giống đực; đây là cách nói thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: תֹר
  choice: chim cu
  rationale: Chỉ loài turtledove, cụ thể hơn từ chung “chim bồ câu”.
- source_word: גוֹזָל
  choice: bồ câu non
  rationale: Trong cặp lễ vật với תֹר, từ này theo quy ước chỉ chim bồ câu non, dù tự thân có thể mang nghĩa rộng là chim non.
theological_decisions: []
