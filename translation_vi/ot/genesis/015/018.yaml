id: GEN.15.18
reference: Genesis 15:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: vi
  text: 'Vào ngày ấy, Yahweh lập giao ước[a] với Áp-ram, phán rằng: “Ta đã ban xứ này cho dòng dõi con, từ sông Ai Cập[b] đến tận sông lớn, tức sông Ơ-phơ-rát.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “cắt một giao ước”, một thành ngữ có nghĩa là lập giao ước; cách nói này có thể gợi đến nghi lễ chặt đôi các con vật trong đoạn văn chung quanh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “suối Ai Cập” hoặc “khe Ai Cập”. Nguyên văn dùng từ thường có nghĩa là “sông”, nhưng địa điểm chính xác vẫn còn được tranh luận.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Vào ngày ấy
  rationale: Diễn đạt tự nhiên một thời điểm xác định, đồng thời bám sát cấu trúc thời gian của tiếng Hê-bơ-rơ.
- source_word: כָּרַת ... בְּרִית
  choice: lập giao ước
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “cắt một giao ước”; “lập giao ước” truyền đạt đúng nghĩa trong tiếng Việt hiện đại, còn hình ảnh nguyên ngữ được giữ trong chú thích vì có liên hệ với nghi lễ trong văn mạch.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong nguyên ngữ thay vì thay bằng một tước hiệu.
- source_word: אֶת אַבְרָם
  choice: với Áp-ram
  rationale: Dù Áp-ram được đánh dấu như tân ngữ trong cấu trúc Hê-bơ-rơ, tiếng Việt tự nhiên dùng “lập giao ước với” để thể hiện quan hệ giao ước.
- source_word: לֵאמֹר
  choice: phán rằng
  rationale: Dẫn vào lời tuyên bố trực tiếp của Yahweh bằng cách diễn đạt trang trọng và tự nhiên trong tiếng Việt.
- source_word: לְזַרְעֲךָ
  choice: cho dòng dõi con
  rationale: “Dòng dõi” giữ được ý nghĩa tập thể của danh từ số ít זֶרַע mà không buộc phải giải thích đó là một cá nhân hay nhiều hậu duệ.
- source_word: נָתַתִּי
  choice: Ta đã ban
  rationale: Thể hoàn thành được giữ bằng “đã ban”, trình bày việc ban đất như một hành động được xác quyết trong lời giao ước.
- source_word: הָאָרֶץ הַזֹּאת
  choice: xứ này
  rationale: “Xứ” phù hợp với ngữ cảnh lời hứa về lãnh thổ và giữ văn phong trang trọng, dễ hiểu.
- source_word: מִנְּהַר מִצְרַיִם
  choice: từ sông Ai Cập
  rationale: נָהָר thông thường có nghĩa là “sông”; cách xác định địa lý khác được nêu trong chú thích.
- source_word: עַד הַנָּהָר הַגָּדֹל
  choice: đến tận sông lớn
  rationale: “Đến tận” diễn đạt rõ ý ranh giới của עַד.
- source_word: נְהַר פְּרָת
  choice: tức sông Ơ-phơ-rát
  rationale: Giữ quan hệ đồng vị với “sông lớn” và dùng tên gọi tiếng Việt dễ nhận biết.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn đây là danh riêng thay vì âm thầm thay bằng một tước hiệu.
- issue: Thể của lời ban đất נָתַתִּי
  choice: Ta đã ban
  alternative: Ta ban; Ta sẽ ban
  rationale: Thể hoàn thành của động từ trình bày sự ban cho như điều đã được xác lập chắc chắn trong tuyên bố giao ước. Bản dịch không đổi nó thành thì tương lai, nhưng cũng không giải thích quá mức về thời điểm hoàn tất lịch sử.
- issue: Phạm vi nghĩa của זֶרַע
  choice: dòng dõi
  alternative: hạt giống; hậu duệ
  rationale: “Dòng dõi” duy trì tính tập thể nhưng ở dạng số ít của từ Hê-bơ-rơ, tránh quyết định thay cho văn bản liệu điểm nhấn nằm trên một người hay nhiều người.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ “Ta—con” cho lời Yahweh nói với Áp-ram; giữ tên riêng Yahweh và các dạng phiên âm quen thuộc Áp-ram, Ơ-phơ-rát. Cú pháp được làm tự nhiên trong tiếng Việt nhưng vẫn bảo tồn cấu trúc lời giao ước và sự căng thẳng về thể hoàn thành của động từ “ban”.
