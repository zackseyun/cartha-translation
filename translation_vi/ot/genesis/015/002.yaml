  to: 'Nhưng Áp-ram thưa: “Lạy Chúa Yahweh, Ngài sẽ ban cho con điều gì, khi con đang đi đến cuối đời mà vẫn không có con, và người thừa kế nhà con[a] là Ê-li-ê-xe người Đa-mách?”'
