  source_fidelity: Bản chính truyền đạt tốt mạch đối đáp, lời xưng hô kính cẩn, ý Áp-ram không có con, và cách hiểu theo ngữ cảnh rằng Ê-li-ê-xe sẽ là người thừa kế. “Đang đi đến cuối đời mà vẫn không có con” diễn giải thành ngữ הוֹלֵךְ עֲרִירִי khá rõ nhưng vẫn phù hợp ngữ cảnh. Tuy nhiên, chú thích không nên xác định מֶשֶׁק là “sự chiếm hữu”, vì nghĩa của từ/cấu trúc này không chắc chắn.
  naturalness: Tiếng Việt hiện đại, trang trọng và trôi chảy. Cặp “Ngài/con” và động từ “thưa” thích hợp trong lời khẩn trình. “Ê-li-ê-xe người Đa-mách” là cách định danh tự nhiên.
  terminology: “Lạy Chúa Yahweh” bảo toàn cả tước hiệu אֲדֹנָי lẫn danh יהוה. “Người thừa kế nhà con” là cách dịch chính đáng của cụm tối nghĩa, miễn là chú thích nêu đúng mức độ bất định. Tên riêng nhất quán với chính tả đang dùng.
