    rationale: Cụm בֶן־מֶשֶׁק בֵּיתִי là một cách nói hiếm và nghĩa chính xác của מֶשֶׁק bị tranh luận. “Sự chiếm hữu” có thể là một đề xuất từ nguyên/giải thích, nhưng không nên được trình bày như bản dịch gần-sát-chữ chắc chắn. Nên phiên âm từ khó hoặc nêu rõ đây là nghĩa đề xuất, đồng thời giữ các khả năng “quản gia” và “người thừa kế.”
