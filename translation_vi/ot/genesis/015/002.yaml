source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤/י יֱהוִה֙ מַה תִּתֶּן לִ֔/י וְ/אָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּ/בֶן מֶ֣שֶׁק בֵּיתִ֔/י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: vi
  text: 'Nhưng Áp-ram thưa: “Lạy Chúa Yahweh, Ngài sẽ ban cho con điều gì, khi con đang đi đến cuối đời mà vẫn không có con, và người thừa kế nhà con[a] là Ê-li-ê-xe người Đa-mách?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “con trai của mesheq nhà con”; đây là một cách nói khác thường và nghĩa của mesheq không chắc chắn. Cũng có thể hiểu là “quản gia nhà con” hoặc “người sẽ sở hữu/thừa kế nhà con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng Áp-ram thưa
  rationale: Liên từ tiếp nối mạch kể chuyện nhưng tại đây lời Áp-ram nêu mối băn khoăn trước lời hứa vừa nhận, nên “nhưng” diễn đạt đúng chuyển hướng diễn ngôn; “thưa” tự nhiên khi ông kính cẩn nói với Đức Chúa Trời.
- source_word: אֲדֹנָי יֱהוִה
  choice: Lạy Chúa Yahweh
  rationale: Giữ cả tước hiệu אֲדֹנָי và danh riêng giao ước יֱהוִה; thêm “Lạy” để thể hiện lối xưng hô trực tiếp, trang trọng và tự nhiên trong tiếng Việt.
- source_word: מַה תִּתֶּן לִי
  choice: Ngài sẽ ban cho con điều gì
  rationale: Dạng chưa hoàn thành mang ý tương lai trong ngữ cảnh; “ban” phù hợp với ân huệ đến từ Đức Chúa Trời, còn đại từ “Ngài/con” giữ sắc thái kính trọng.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: khi con đang đi đến cuối đời mà vẫn không có con
  rationale: הוֹלֵךְ theo nghĩa đen là “đang đi” và trong ngữ cảnh gợi hành trình đời người tiến dần đến cái chết; cách dịch này giữ hình ảnh ấy mà không khẳng định Áp-ram sắp chết ngay. עֲרִירִי được diễn đạt rõ là “không có con”.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: người thừa kế nhà con
  rationale: Cụm Hê-bơ-rơ rất hiếm và khó hiểu; ngữ cảnh câu kế tiếp cho thấy người này sẽ nhận tài sản của Áp-ram. Bản dịch chính ưu tiên nghĩa rõ nhất, còn cách nói sát chữ và khả năng “quản gia” được giữ trong chú thích.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: Ê-li-ê-xe người Đa-mách
  rationale: Hiểu cụm đồng vị là xác định Ê-li-ê-xe theo quê quán hoặc mối liên hệ với Đa-mách; đây là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển danh יהוה trong tổ hợp אֲדֹנָי יֱהוִה
  choice: Lạy Chúa Yahweh
  alternative: Lạy Chúa CHÍ TÔN / Lạy Chúa là ĐỨC CHÚA
  rationale: “Yahweh” thể hiện đây là danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, đồng thời “Chúa” chuyển tải אֲדֹנָי. Cách dịch không nhập hai yếu tố thành một.
- issue: Tình trạng của Ê-li-ê-xe trong gia đình Áp-ram
  choice: người thừa kế nhà con
  alternative: quản gia nhà con / người sở hữu nhà con / con trai của sự chiếm hữu nhà con
  rationale: Nguyên văn không rõ nghĩa và không nên biến một cách giải thích về phong tục thừa kế thành điều chắc chắn tuyệt đối. Bản chính chọn nghĩa phù hợp nhất với ngữ cảnh, còn chú thích công khai sự bất định.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “thưa” và cặp xưng hô “Ngài/con” cho lời cầu trình kính cẩn. Tên riêng được phiên âm quen thuộc trong tiếng Việt: Áp-ram, Ê-li-ê-xe, Đa-mách; danh Yahweh được giữ nguyên.'
