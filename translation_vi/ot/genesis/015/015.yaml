base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: vi
  text: Còn con, con sẽ về với tổ phụ mình[a] trong bình an; con sẽ được chôn cất ở tuổi già tốt lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đến với các cha của con,” một thành ngữ chỉ việc qua đời và về cùng các thế hệ trước; cũng có thể dịch là “về với tổ tiên mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Còn con
  rationale: Liên từ cùng đại từ độc lập đánh dấu sự chuyển chủ đề và tương phản từ dòng dõi Áp-ram sang chính ông; “Còn con” tự nhiên và giữ được điểm nhấn diễn ngôn.
- source_word: תָּבוֹא
  choice: sẽ về
  rationale: Động từ בוא cơ bản là “đến/vào”; trong thành ngữ đi với “tổ phụ”, “về” diễn đạt tự nhiên ý qua đời và trở về cùng các thế hệ trước mà không giải thích quá mức.
- source_word: אֶל־אֲבֹתֶיךָ
  choice: với tổ phụ mình
  rationale: “Tổ phụ” giữ sắc thái gia tộc và gần với nghĩa đen “các cha của con”; “với” phù hợp thành ngữ tiếng Việt “về với tổ tiên/tổ phụ” hơn cách dịch máy móc “đến các tổ phụ”.
- source_word: בְּשָׁלוֹם
  choice: trong bình an
  rationale: Giữ hình thức súc tích của nguyên văn và trường nghĩa bình an, toàn vẹn, an lành của שָׁלוֹם.
- source_word: תִּקָּבֵר
  choice: sẽ được chôn cất
  rationale: Diễn đạt rõ thể bị động Nifal của קבר bằng tiếng Việt hiện đại, trang trọng và tự nhiên.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: khi tuổi già tốt đẹp
  rationale: Giữ cả ý tuổi cao của שֵׂיבָה lẫn phẩm chất tích cực do טוֹבָה biểu thị, đồng thời tránh thêm tính từ “cao” không hiện diện trực tiếp trong cụm từ.
theological_decisions:
- issue: Ý nghĩa của “về với tổ phụ mình”
  choice: Giữ thành ngữ chỉ việc Áp-ram qua đời và về cùng các thế hệ trước, không xác định chi tiết tình trạng sau khi chết.
  alternative: Hiểu thuần túy là được chôn chung với tổ tiên, hoặc hiểu là lời khẳng định rõ về sự tương giao có ý thức với tổ tiên sau khi chết.
  rationale: Cụm từ là một công thức nói về cái chết; vì Áp-ram không được chôn cạnh các tổ phụ trực hệ, ý nghĩa không thể bị giới hạn vào nơi mai táng. Tuy nhiên, câu này cũng không trình bày đầy đủ một học thuyết về trạng thái sau khi chết, nên bản dịch giữ nguyên độ mở thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phản ánh lời Đức Chúa Trời phán trực tiếp với Áp-ram trong quan hệ bề trên với người nghe; “tổ phụ” giữ sắc thái Kinh Thánh nhưng vẫn thông dụng. Dấu [a] được đặt ngay sau cụm thành ngữ cần chú thích.
