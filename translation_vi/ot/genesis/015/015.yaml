  terminology: “Tổ phụ” bảo toàn sắc thái gần nghĩa đen của אֲבֹתֶיךָ mà vẫn là thuật ngữ Kinh Thánh Việt ngữ quen thuộc. “Bình an” chuyển tải tốt בְּשָׁלוֹם mà không áp đặt diễn giải hậu thế. “Tốt lành” diễn đạt phẩm chất tích cực của טוֹבָה tốt hơn “tốt đẹp” trong kết hợp với “tuổi già”.
