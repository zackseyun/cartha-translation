  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của tiếng Hê-bơ-rơ: sự chuyển hướng nhấn mạnh sang Áp-ram, thành ngữ chết “về với tổ phụ”, “trong bình an”, thể bị động “được chôn cất”, và ý tuổi già có phẩm chất tốt. Tuy nhiên, cần đặt ký hiệu chú thích sát thành ngữ “về với tổ phụ” mà chú thích giải thích, thay vì sau “trong bình an”.'
