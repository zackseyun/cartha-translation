id: GEN.15.14
reference: Genesis 15:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: vi
  text: Nhưng Ta cũng sẽ xét xử dân tộc mà họ phục dịch[a]; sau đó, họ sẽ ra đi với rất nhiều của cải[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mà họ sẽ bị bắt làm nô lệ cho”. Động từ Hê-bơ-rơ có nghĩa đen là “phục vụ”, nhưng trong ngữ cảnh chỉ sự phục dịch cưỡng bức dưới quyền một dân tộc ngoại bang.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “với khối tài sản lớn” hoặc “với rất nhiều tài vật”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Nhưng Ta cũng
  rationale: Liên từ וְ kết hợp với גַם vừa nối tiếp vừa nhấn mạnh ý bổ sung. Trong mạch văn, “Nhưng Ta cũng” diễn đạt tự nhiên sự tương phản giữa cảnh dòng dõi Áp-ram bị áp bức và việc Đức Chúa Trời xét xử dân tộc áp bức họ.
- source_word: הַגּוֹי
  choice: dân tộc
  rationale: גּוֹי chỉ một dân tộc hay quốc gia; ở đây nói đến thế lực ngoại bang mà dòng dõi Áp-ram phải phục dịch. “Dân tộc” trực tiếp và phù hợp với ngữ cảnh.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: mà họ phục dịch
  rationale: Động từ עבד ở thể qal có nghĩa căn bản là “phục vụ, làm việc cho”. “Phục dịch” giữ được nghĩa từ vựng và gợi đúng quan hệ lệ thuộc trong ngữ cảnh, nhưng chưa biến hàm ý cưỡng bức thành nghĩa duy nhất của động từ.
- source_word: דָּן אָנֹכִי
  choice: Ta sẽ xét xử
  rationale: Phân từ דָּן cùng đại từ độc lập אָנֹכִי nhấn mạnh chính chủ thể ngôi thứ nhất thực hiện hành động, với ý tương lai do ngữ cảnh. “Xét xử” giữ sắc thái pháp lý rộng hơn “trừng phạt”.
- source_word: וְאַחֲרֵי כֵן
  choice: sau đó
  rationale: Cụm từ này đánh dấu trình tự thời gian. “Sau đó” ngắn gọn, tự nhiên và bảo toàn quan hệ kế tiếp.
- source_word: יֵצְאוּ
  choice: họ sẽ ra đi
  rationale: יצא có nghĩa “đi ra, ra khỏi”. “Ra đi” tự nhiên trong tiếng Việt và diễn tả việc rời khỏi nơi phục dịch mà không thêm địa điểm vốn không được nêu trong câu.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: với rất nhiều của cải
  rationale: רְכוּשׁ chỉ tài sản, của cải hay đồ đạc sở hữu; גָּדוֹל ở đây nói đến quy mô lớn. “Rất nhiều của cải” là cách diễn đạt tiếng Việt tự nhiên, vẫn giữ tính cụ thể hơn từ “giàu có”.
theological_decisions:
- issue: Bản chất hành động của Đức Chúa Trời đối với dân tộc áp bức
  choice: xét xử
  alternative: trừng phạt
  rationale: דָּן thuộc ngôn ngữ tư pháp. “Xét xử” giữ nguyên khung pháp lý và đạo đức của câu mà không thu hẹp hành động chỉ còn kết quả trừng phạt.
- issue: Tính chất việc dòng dõi Áp-ram phục vụ dân tộc ngoại bang
  choice: phục dịch
  alternative: bị bắt làm nô lệ cho
  rationale: עבד tự thân có nghĩa là phục vụ hay làm việc; ngữ cảnh cho thấy đó là sự phục dịch cưỡng bức. Bản dịch chính giữ nghĩa trực tiếp, còn chú thích nêu rõ cách hiểu mạnh hơn do ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” duy trì lời phán trực tiếp của Đức Chúa Trời. “Phục dịch” được chọn thay cho “phục vụ” để phản ánh quan hệ lệ thuộc trong ngữ cảnh mà vẫn tránh diễn giải quá mức thành một thuật ngữ pháp lý cụ thể.
