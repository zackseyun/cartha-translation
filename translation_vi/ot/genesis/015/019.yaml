  yaml_path: translation/ot/genesis/015/019.yaml
  text: the Kenites[a], the Kenizzites, and the Kadmonites—
translation:
  language: vi
  text: dân Kê-ni, dân Kê-nê-xít và dân Cát-mô-ni[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ קַדְמֹנִי (qadmoni) có liên hệ với “phía đông” hoặc “người miền đông”; tại đây từ này được phiên âm là tên dân Cát-mô-ni vì xuất hiện trong một danh sách các dân tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ trực tiếp, không có từ tương đương độc lập trong tiếng Việt; chức năng của nó được thể hiện qua danh sách các dân tộc làm tân ngữ trong câu lớn hơn.
- source_word: הַקֵּינִי
  choice: dân Kê-ni
  rationale: Danh xưng dân tộc có mạo từ và được dùng theo nghĩa tập thể; cấu trúc “dân + tên gọi” tự nhiên trong tiếng Việt và cho thấy đây là một cộng đồng.
- source_word: וְאֶת
  choice: '[liên kết bằng dấu phẩy]'
  rationale: Liên từ nối các mục trong danh sách; tiếng Việt tự nhiên có thể dùng dấu phẩy giữa các mục, còn dấu hiệu tân ngữ không được dịch riêng.
- source_word: הַקְּנִזִּי
  choice: dân Kê-nít
  rationale: Danh xưng dân tộc mang nghĩa tập thể trong danh sách các cư dân của xứ; phiên âm giữ chức năng tên riêng.
- source_word: וְאֵת
  choice: và
  rationale: Liên từ nối mục cuối của danh sách; dấu hiệu tân ngữ không được dịch riêng.
- source_word: הַקַּדְמֹנִי
  choice: dân Cát-mô-ni
  rationale: Tuy từ này có liên hệ với ý “phía đông/miền đông”, trong ngữ cảnh nó đứng song song với các danh xưng dân tộc khác; phiên âm bảo tồn tính chất tên riêng mà không loại bỏ khả năng nghĩa từ nguyên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dân” trước các tên tộc người để truyền đạt nghĩa tập thể của danh xưng số ít trong tiếng Hê-bơ-rơ. Giữ dấu gạch ngang cuối câu vì câu liệt kê còn tiếp nối trong văn mạch.
