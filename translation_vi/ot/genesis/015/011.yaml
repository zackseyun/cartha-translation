  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính của nguyên văn: động tác chim bay/sà xuống (וַיֵּרֶד), danh từ עַיִט được hiểu hợp lý là danh từ tập hợp, đối tượng là các xác thú (הַפְּגָרִים), và hành động Áp-ram xua chúng đi (וַיַּשֵּׁב אֹתָם). Liên từ “và” không thêm sắc thái tương phản.'
