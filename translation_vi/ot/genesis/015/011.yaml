  yaml_path: translation/ot/genesis/015/011.yaml
  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: vi
  text: Chim săn mồi sà xuống trên các xác thú[a], và Áp-ram xua chúng đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con chim săn mồi sà xuống trên các xác thú.” Danh từ Hê-bơ-rơ ở số ít nhưng có thể mang nghĩa tập hợp; trong ngữ cảnh này, nghĩa tập hợp—nhiều chim ăn xác—có vẻ phù hợp hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: sà xuống
  rationale: Động từ ירד diễn tả chuyển động đi xuống; trong ngữ cảnh chim tiến đến xác thú, “sà xuống” tự nhiên và cụ thể.
- source_word: הָעַיִט
  choice: chim săn mồi
  rationale: עַיִט có thể là danh từ số ít mang nghĩa tập hợp, chỉ các loài chim ăn thịt hoặc ăn xác; cách dịch này giữ phạm vi nghĩa rộng, không thu hẹp thành “kền kền”.
- source_word: הַפְּגָרִים
  choice: các xác thú
  rationale: פֶּגֶר chỉ xác chết hoặc xác súc vật. Ở đây đối tượng là những con vật đã bị giết trong nghi thức, nên “các xác thú” chính xác và tự nhiên hơn “các mảnh”.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: xua chúng đi
  rationale: Dạng Hiphil của שוב ở đây có nghĩa khiến chúng quay lui; “xua chúng đi” diễn đạt tự nhiên hành động chủ động của Áp-ram.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Giữ tên Áp-ram ở giai đoạn này của trình thuật, trước khi ông được đổi tên thành Áp-ra-ham.
