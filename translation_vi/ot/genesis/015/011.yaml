  terminology: “Chim săn mồi” giữ phạm vi nghĩa của עַיִט tốt hơn các lựa chọn quá chuyên biệt như “kền kền”. “Các xác thú” phù hợp với những con vật đã bị giết trong nghi thức ở ngữ cảnh trước. Tên “Áp-ram” được giữ đúng giai đoạn trình thuật.
