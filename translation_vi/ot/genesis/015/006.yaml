base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: vi
  text: Ông tin Đức Giê-hô-va[a], và Ngài kể điều đó là sự công chính cho ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông tin cậy Đức Giê-hô-va.”'
    reason: lexical_alternative
  - marker: b
    text: Cú pháp Hê-bơ-rơ thường được hiểu là Đức Giê-hô-va kể việc Áp-ram tin là sự công chính cho ông; một cách hiểu ít có khả năng hơn xem Áp-ram là chủ ngữ của động từ “kể”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הֶאֱמִן
  choice: Ông tin
  rationale: Dạng Hifil của אמן ở đây diễn tả việc đặt lòng tin nơi một người. “Tin” vừa trực tiếp, tự nhiên trong tiếng Việt, vừa giữ được mối liên hệ từ vựng với cách câu này được tiếp nhận ở những phần Kinh Thánh sau.
- source_word: בַּ/יהוָה
  choice: Đức Giê-hô-va
  rationale: Giới từ ב đánh dấu đối tượng của lòng tin. “Đức Giê-hô-va” là cách gọi danh giao ước quen thuộc, trang trọng và rõ nghĩa đối với độc giả Việt ngữ.
- source_word: וַ/יַּחְשְׁבֶהָ
  choice: và Ngài kể điều đó
  rationale: חשב có nghĩa là tính, kể hoặc quy vào. “Kể ... là” tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ sắc thái xác định một điều vào địa vị được nêu; thêm “Ngài” làm rõ chủ ngữ được hiểu theo cách đọc chính, còn chú thích bảo tồn khả năng cú pháp khác.
- source_word: לּוֹ
  choice: cho ông
  rationale: ל với hậu tố chỉ người mà điều ấy được kể hoặc quy cho. “Cho ông” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: צְדָקָה
  choice: là sự công chính
  rationale: צְדָקָה ở đây chỉ sự công chính hơn là công lý phân phối. “Sự công chính” là thuật ngữ trang trọng, dễ nhận biết và phù hợp với bối cảnh giao ước cũng như liên hệ liên văn bản.
theological_decisions:
- issue: Chủ ngữ của động từ “kể”
  choice: 'Đức Giê-hô-va là chủ ngữ: Áp-ram tin Đức Giê-hô-va, và Ngài kể điều đó cho Áp-ram là sự công chính.'
  alternative: 'Áp-ram là chủ ngữ: Áp-ram tin Đức Giê-hô-va và kể Ngài/điều ấy là sự công chính.'
  rationale: Theo mạch văn, cách hiểu tự nhiên và phổ biến hơn là Đức Giê-hô-va làm chủ ngữ của động từ. Bản dịch dùng “Ngài” để tiếng Việt rõ ràng, đồng thời ghi nhận cách phân tích ít có khả năng hơn trong chú thích.
- issue: Sở chỉ của hậu tố giống cái trong “kể điều đó”
  choice: Hậu tố chỉ hành động tin hay sự đáp ứng bằng lòng tin của Áp-ram, được dịch trung tính là “điều đó”.
  alternative: Dịch diễn giải thành “đức tin ấy” hoặc hiểu rộng hơn là toàn bộ sự đáp ứng của Áp-ram.
  rationale: Tiếng Hê-bơ-rơ có thể dùng hậu tố giống cái để quy chiếu một hành động hay sự việc trừu tượng. “Điều đó” tránh đưa danh từ “đức tin” vốn không xuất hiện trực tiếp vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ câu ngắn, gần cấu trúc Hê-bơ-rơ; dùng “ông” cho Áp-ram và “Ngài” cho Đức Giê-hô-va để tránh sự mơ hồ đại từ không tự nhiên trong tiếng Việt. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
