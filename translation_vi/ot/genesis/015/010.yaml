base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: vi
  text: Vậy, Áp-ram đem tất cả những con vật ấy đến cho Ngài[a], xẻ chúng làm đôi, rồi đặt mỗi nửa đối diện với nửa kia[b]; nhưng ông không xẻ đôi các con chim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lấy tất cả những con vật ấy cho mình.” Tuy nhiên, theo mạch văn câu 9, Áp-ram đang đem chúng đến cho Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “đặt mỗi phần bị xẻ đối diện với phần kia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: Áp-ram đem tất cả những con vật ấy đến cho Ngài
  rationale: Động từ לקח cơ bản là “lấy”; tuy nhiên, trong mạch văn đáp lại mệnh lệnh “hãy đem đến cho Ta” ở câu 9, “đem ... đến cho Ngài” diễn đạt tự nhiên nhất. Đại từ לוֹ được hiểu là chỉ Đức Chúa Trời, nhưng chú thích giữ lại khả năng ngữ pháp khác.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: xẻ chúng làm đôi
  rationale: בתר chỉ việc xẻ hoặc phân chia súc vật; בַּתָּוֶךְ cho biết đường xẻ ở giữa. “Xẻ ... làm đôi” vừa tự nhiên vừa giữ hình ảnh cụ thể của nghi thức.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: đặt mỗi nửa đối diện với nửa kia
  rationale: Thành ngữ phân phối אִישׁ ... רֵעֵהוּ có nghĩa “mỗi ... với phần tương ứng”; בִּתְרוֹ là phần đã bị xẻ. Cách dịch này thể hiện rõ cách sắp đặt mà không thêm diễn giải nghi lễ.
- source_word: וְאֶת הַצִפֹּר לֹא בָתָר
  choice: nhưng ông không xẻ đôi các con chim
  rationale: Danh từ số ít có mạo từ הַצִפֹּר được hiểu theo nghĩa tập hợp, chỉ hai con chim ở câu trước. Dùng số nhiều trong tiếng Việt giúp quy chiếu rõ ràng.
theological_decisions:
- issue: Ngôn ngữ của nghi thức lập giao ước
  choice: Mô tả trực tiếp việc xẻ các con vật và đặt hai nửa đối diện nhau
  alternative: Thêm lời giải thích rằng đây là nghi thức lập giao ước
  rationale: Bản văn mô tả hành động cụ thể nhưng chưa giải nghĩa ngay trong câu; bản dịch giữ sức gợi về giao ước mà không đưa phần giải thích thần học vào chính văn.
- issue: Sở chỉ của לוֹ
  choice: “đến cho Ngài,” hiểu là Đức Chúa Trời theo mệnh lệnh ở câu 9
  alternative: “cho mình,” hiểu đại từ theo nghĩa phản thân chỉ Áp-ram
  rationale: Ngữ cảnh gần nhất ủng hộ việc Áp-ram thực hiện mệnh lệnh đem các con vật đến cho Đức Chúa Trời. Vì cấu trúc dative vẫn có thể được hiểu theo nghĩa phản thân, khả năng ấy được ghi trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xẻ” để diễn tả rõ thao tác trên súc vật; dùng “Ngài” vì đại từ trong ngữ cảnh quy chiếu đến Đức Chúa Trời. Tên “Áp-ram” được nêu lại để tránh chuỗi đại từ mơ hồ trong tiếng Việt.
