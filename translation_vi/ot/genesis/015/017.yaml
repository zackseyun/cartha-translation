source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ בָּ֔אָה וַ/עֲלָטָ֖ה הָיָ֑ה וְ/הִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְ/לַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַ/גְּזָרִ֥ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: vi
  text: Khi mặt trời đã lặn và trời đã tối, kìa, một lò bốc khói[a] và một ngọn đuốc rực cháy đi qua giữa những phần đã xẻ ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một lò nghi ngút khói” hoặc “một vật chứa lửa bốc khói.” Từ Hê-bơ-rơ chỉ một lò hoặc vật chứa lửa dùng để nung, nướng.
    reason: lexical_alternative
  - marker: b
    text: Đây là các phần của những con vật đã được xẻ đôi để chuẩn bị cho nghi thức giao ước; xem Sáng Thế Ký 15:10.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ בָּאָה
  choice: Khi mặt trời đã lặn
  rationale: Động từ בוא dùng với mặt trời là cách nói về lúc mặt trời lặn. Cấu trúc “Khi...” chuyển tự nhiên mạch kể sang biến cố tiếp theo.
- source_word: וַעֲלָטָה הָיָה
  choice: và bóng tối bao trùm
  rationale: עֲלָטָה chỉ bóng tối hoặc cảnh âm u. “Bóng tối bao trùm” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái cảnh vật chìm vào tối tăm, mà không thêm mức độ như “tối tăm dày đặc”.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: הִנֵּה thu hút sự chú ý và trình bày cảnh tượng một cách sống động. “Kìa” giữ được sắc thái trang trọng, giàu hình ảnh.
- source_word: תַנּוּר עָשָׁן
  choice: một lò lửa nghi ngút khói
  rationale: תַנּוּר là lò hoặc vật chứa lửa dùng để nung, nướng; עָשָׁן tạo hình ảnh khói bốc lên. “Lò lửa nghi ngút khói” rõ nghĩa và tự nhiên, nhưng chú thích vẫn bảo lưu các khả năng “lò bốc khói” và “bếp lửa bốc khói”.
- source_word: לַפִּיד אֵשׁ
  choice: một ngọn đuốc rực cháy
  rationale: לַפִּיד là đuốc, còn אֵשׁ nhấn mạnh tính chất bốc lửa. “Ngọn đuốc rực cháy” diễn đạt tự nhiên hình ảnh này.
- source_word: אֲשֶׁר עָבַר
  choice: đi qua
  rationale: Động từ עבר diễn tả sự chuyển qua khoảng giữa các phần đã được xẻ. Tiếng Việt không buộc phải biểu thị số của chủ thể, nên “đi qua” giữ nguyên khả năng hai hình ảnh cùng hợp thành một cảnh tượng.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: giữa những mảnh thịt ấy
  rationale: גְּזָרִים là các phần đã bị xẻ ra trong nghi thức giao ước. Thêm “thịt” làm rõ đây là những mảnh của các con vật đã được chuẩn bị ở Sáng Thế 15:10, phù hợp ngữ cảnh tiếng Việt.
theological_decisions:
- issue: Bản chất của lò lửa và ngọn đuốc trong cảnh lập giao ước
  choice: Chỉ mô tả các hình ảnh xuất hiện, không trực tiếp đồng nhất chúng với chính Đức Giê-hô-va trong câu dịch.
  alternative: Giải thích ngay trong chính văn rằng lò lửa và ngọn đuốc là sự hiện diện hữu hình của Đức Giê-hô-va.
  rationale: Ngữ cảnh rộng hơn gợi mạnh rằng đây là sự biểu hiện của sự hiện diện thần thượng, nhưng câu Hê-bơ-rơ chỉ nêu những hình ảnh nhìn thấy. Cách dịch mô tả bảo tồn sự căng thẳng thần học và không đưa phần giải nghĩa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu hình ảnh. “Kìa” giữ điểm nhấn thị kiến của nguyên văn; “nghi ngút khói” và “rực cháy” tạo hình ảnh tự nhiên mà không giải thích biểu tượng ngay trong chính văn.
