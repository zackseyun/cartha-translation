  source_fidelity: Bản dịch truyền đạt đúng trình tự cảnh tượng, dấu hiệu trình bày sống động của הִנֵּה, hai vật thể có lửa/khói, và việc chúng đi qua ở giữa các phần đã chia. Tuy nhiên, “bóng tối bao trùm” diễn giải động hơn câu Hê-bơ-rơ chỉ nói “trời tối/đã tối”; “mảnh thịt” cũng thu hẹp גְּזָרִים thành thịt, trong khi từ này là các phần đã cắt và ngữ cảnh trước đó gồm các con vật được chia phần.
  naturalness: Văn phong trang trọng, hiện đại và giàu hình ảnh. “Kìa” phù hợp với sắc thái nhấn mạnh của הִנֵּה. “Khi mặt trời đã lặn và trời đã tối” tự nhiên hơn, đồng thời tránh thêm ý “bao trùm”. “Những phần đã xẻ ấy” tự nhiên trong văn mạch nghi thức và được chú thích làm rõ.
  terminology: 'Nên dùng “lò bốc khói” cho תַּנּוּר עָשָׁן: cách này giữ mở nghĩa lò/lò nướng/vật chứa lửa, không thêm “lửa” vào danh từ chính. “Ngọn đuốc rực cháy” diễn đạt tốt לַפִּיד אֵשׁ. Không nên đồng nhất các hình ảnh với Đức Chúa Trời trong chính văn.'
