  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אֲנִ֣י יְהוָ֗ה אֲשֶׁ֤ר הוֹצֵאתִ֨י/ךָ֙ מֵ/א֣וּר כַּשְׂדִּ֔ים לָ֧/תֶת לְ/ךָ֛ אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: vi
  text: 'Ngài phán với ông: “Ta là Yahweh, Đấng đã đưa con ra khỏi U-rơ của người Canh-đê để ban cho con vùng đất này làm sản nghiệp.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để con sở hữu nó” hoặc “để con thừa hưởng nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Ngài phán với ông
  rationale: Dạng kể chuyện wayyiqtol tiếp nối mạch văn; “phán” phù hợp với lời Đức Chúa Trời, còn “với ông” thể hiện אֵלָיו mà không lặp tên Áp-ram.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Mệnh đề danh từ Hê-bơ-rơ cần thêm “là” trong tiếng Việt; giữ tên giao ước Yahweh thay vì thay bằng một tước hiệu.
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: Đấng đã đưa con ra khỏi
  rationale: אֲשֶׁר quy chiếu về Yahweh và được diễn đạt trang trọng bằng “Đấng”; Hiphil của יצא mang nghĩa khiến người nghe đi ra, nên “đưa ... ra khỏi” là tự nhiên và sát nghĩa.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: khỏi U-rơ của người Canh-đê
  rationale: Giữ địa danh và cách xác định bằng tên dân tộc; phiên âm có gạch nối giúp độc giả Việt đọc rõ.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: để ban cho con vùng đất này
  rationale: לָתֶת diễn tả mục đích; “ban” tự nhiên khi chủ thể là Đức Chúa Trời, còn הָאָרֶץ trong ngữ cảnh chỉ vùng đất được hứa.
- source_word: לְרִשְׁתָּהּ
  choice: làm sản nghiệp
  rationale: ירשׁ có thể chỉ việc chiếm hữu, thừa hưởng hoặc nhận làm cơ nghiệp. “Làm sản nghiệp” diễn đạt tự nhiên mục đích nhận và sở hữu đất, đồng thời không buộc nghĩa vào cơ chế thừa kế gia đình.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng danh riêng giao ước יהוה; phiên âm “Yahweh” phân biệt danh này với tước hiệu và không nhập một truyền thống giáo phái riêng.
- issue: Sắc thái của ירשׁ trong lời hứa về đất
  choice: làm sản nghiệp
  alternative: để sở hữu nó / để thừa hưởng nó
  rationale: Động từ có trường nghĩa gồm nhận làm cơ nghiệp và chiếm hữu. Bản chính dùng cách nói Việt tự nhiên nhưng chú thích bảo tồn các khả năng từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta–con” thể hiện lời Đức Chúa Trời nói với Áp-ram mà không dùng lối quá cổ. Dùng “vùng đất” để tránh hiểu הָאָרֶץ là toàn thể trái đất.
