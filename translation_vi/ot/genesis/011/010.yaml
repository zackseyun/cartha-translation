  - severity: low
    issue: Thiếu chú thích về dạng tên thay thế đã được neo trong bản kiểm chứng tiếng Anh.
    rationale: Tên chính «Arpắc-sát» phù hợp trực tiếp với tiếng Hê-bơ-rơ; chú thích giúp độc giả nhận ra dạng truyền thống theo tiếng Hy Lạp mà không ưu tiên dạng đó trong bản văn.
