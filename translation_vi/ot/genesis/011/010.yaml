base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: vi
  text: Đây là dòng dõi của Sem. Sem được một trăm tuổi thì sinh Arpắc-sát[a], hai năm sau trận lụt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Arpắc-sát trong một số bản dịch thường được viết là «Ạc-phác-xát» (Arphaxad), theo dạng tiếng Hy Lạp hơn là dạng tiếng Hê-bơ-rơ.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת שֵׁם
  choice: Đây là dòng dõi của Sem
  rationale: Công thức tô-lê-đốt mở đầu một phần gia phả trong Sáng Thế Ký. “Dòng dõi” tự nhiên trong tiếng Việt và giữ được ý về những thế hệ phát xuất từ Sem.
- source_word: שֵׁם
  choice: Sem
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: בֶּן מְאַת שָׁנָה
  choice: Khi được một trăm tuổi
  rationale: Chuyển thành ngữ tuổi tác Hê-bơ-rơ, nghĩa đen là “con trai của một trăm năm”, sang cách nói tự nhiên trong tiếng Việt.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Dạng Hiphil của ילד trong gia phả chỉ việc người cha sinh ra hoặc làm cha của người con; “sinh” ngắn gọn, tự nhiên và phù hợp văn cảnh gia phả tiếng Việt.
- source_word: אַרְפַּכְשָׁד
  choice: Arpắc-sát
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ Arpakhshad theo âm vị và chính tả tiếng Việt.
- source_word: שְׁנָתַיִם אַחַר הַמַּבּוּל
  choice: hai năm sau trận lụt
  rationale: Giữ chính xác khoảng thời gian hai năm và dùng “trận lụt” để chỉ biến cố đại hồng thủy đã được xác định trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu thứ hai được sắp xếp theo cú pháp tiếng Việt tự nhiên nhưng vẫn giữ nguyên tuổi của Sem, quan hệ cha con và mốc thời gian so với trận lụt.
