source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: vi
  text: 'Đức Giê-hô-va phán: “Kìa, họ là một dân, và tất cả đều có chung một ngôn ngữ. Đây là điều họ đã bắt đầu làm. Bây giờ, sẽ không có điều gì họ dự tính làm mà họ không thể thực hiện.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ không có điều gì họ dự tính làm bị ngăn cản hoặc bị giữ lại khỏi họ.”'
    reason: בצר ở thể Niphal có thể mang nghĩa điều không thể thực hiện/ngoài tầm với, hoặc điều bị ngăn cản, bị giữ lại; chú thích bảo tồn cách hiểu thay thế.
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay bằng tước hiệu chung.
- source_word: הֵן
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý của lời nhận xét, với sắc thái trang trọng nhưng vẫn dễ hiểu.
- source_word: עַם אֶחָד
  choice: một dân
  rationale: Diễn đạt trực tiếp một cộng đồng người, không hàm ý nhất thiết là một quốc gia chính trị.
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: tất cả đều có chung một ngôn ngữ
  rationale: שָׂפָה nghĩa đen là “môi” nhưng ở đây là thành ngữ chỉ ngôn ngữ; “có chung” diễn đạt tự nhiên ý một ngôn ngữ cho mọi người.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: Đây mới chỉ là khởi đầu những gì họ sẽ làm
  rationale: חלל ở thể Hiphil có nghĩa “bắt đầu”; cách dịch này làm rõ rằng công trình hiện tại là bước đầu, phù hợp với mạch dẫn sang hệ quả kế tiếp.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: chẳng điều gì ... lại ngoài khả năng của họ
  rationale: בצר ở thể Niphal có thể chỉ điều bị ngăn cản hoặc điều bất khả thi; cách diễn đạt này tự nhiên trong tiếng Việt và giữ trọng tâm vào khả năng thực hiện.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: điều gì họ dự định làm
  rationale: יזם chỉ việc toan tính, hoạch định hoặc dự định; “dự định” rõ ràng và trung tính.
theological_decisions:
- issue: Phạm vi lời nhận định về khả năng của loài người
  choice: Lời này nói rằng trong bối cảnh câu chuyện, nhân loại thống nhất sẽ có thể thực hiện những dự định của họ.
  alternative: Không điều gì họ dự định làm sẽ bị ngăn khỏi họ.
  rationale: Bản dịch giữ sức nặng của lời nhận định mà không biến nó thành tuyên bố về quyền năng tuyệt đối của con người, cũng không ngầm tán thành công trình của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kìa” giữ sắc thái long trọng của lời phán; cấu trúc còn lại ưu tiên tiếng Việt tự nhiên. Dấu chú thích [a] được đặt ngay sau mệnh đề có phương án dịch khác.
