  text: And Reu lived thirty-two years and fathered Serug.
translation:
  language: vi
  text: Rê-u sống đến ba mươi hai tuổi thì sinh được Sê-rúc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה cùng số năm chỉ tuổi của nhân vật khi người con được sinh ra; “sống được” tự nhiên trong tiếng Việt và giữ rõ mốc tuổi.
- source_word: רְעוּ
  choice: Rê-u
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết tiếng Việt hiện đại, giúp người đọc phát âm gần với dạng nguồn.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: ba mươi hai năm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ “hai và ba mươi” sang cách nói tự nhiên của tiếng Việt mà vẫn giữ nguyên giá trị số.
- source_word: וַיּוֹלֶד
  choice: thì sinh
  rationale: Dạng Hifil của ילד trong gia phả diễn tả việc sinh ra/người cha sinh con. “Thì sinh” ngắn gọn, tự nhiên và tránh từ cổ “sinh hạ”; quan hệ cha-con đã rõ từ nhân vật nam và cấu trúc gia phả.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu đánh dấu tân ngữ xác định trong tiếng Hê-bơ-rơ, không có từ tương ứng cần biểu đạt riêng trong tiếng Việt.
- source_word: שְׂרוּג
  choice: Xê-rúc
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết tiếng Việt hiện đại.
