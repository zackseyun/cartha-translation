  source_fidelity: 'Bản dịch phản ánh đúng trình tự và ý chính của công thức gia phả Hê-bơ-rơ: Phê-léc đã sống ba mươi năm trước khi trở thành cha của Rê-u. Tuy nhiên, động từ “sinh” khi chủ ngữ là nam dễ gợi nghĩa người nam trực tiếp sinh con trong tiếng Việt hiện đại; cần diễn đạt rõ vai trò làm cha mà không thêm thông tin.'
