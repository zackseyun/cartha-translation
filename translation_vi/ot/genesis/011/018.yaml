  text: Phê-léc sống được ba mươi năm thì làm cha của Rê-u.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה diễn tả quãng đời đã trải qua trước biến cố kế tiếp; “sống được” là cách nói tự nhiên trong tiếng Việt.
- source_word: פֶלֶג
  choice: Pê-léc
  rationale: Phiên âm tên riêng theo cách viết quen thuộc trong tiếng Việt, đồng thời phản ánh gần đúng tên Hê-bơ-rơ.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: ba mươi năm
  rationale: Cụm từ chỉ độ tuổi của Pê-léc khi sự kiện kế tiếp xảy ra; kết hợp với “sống được” truyền đạt tự nhiên ý nghĩa này mà không cần thêm “tuổi”.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Ở dạng chủ động giống đực trong công thức gia phả, ילד nói về việc người cha sinh ra người con; “sinh” ngắn gọn, tự nhiên và phù hợp lối diễn đạt gia phả tiếng Việt.
- source_word: אֶת
  choice: '[không dịch]'
  rationale: Đây là dấu hiệu đánh dấu bổ ngữ trực tiếp xác định trong tiếng Hê-bơ-rơ và không có từ tương đương cần thể hiện trong tiếng Việt.
- source_word: רְעוּ
  choice: Rê-u
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
theological_decisions: []
