  rationale: Sửa tên riêng để phù hợp với tiếng Hê-bơ-rơ, đồng thời thêm «được» ở hai chỗ để tiếng Việt nhận rõ Bê-léc/Phê-léc là người cha mà vẫn bảo toàn công thức gia phả và không thay đổi ý nghĩa.
