  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi sinh được Rê-u, Phê-léc sống thêm hai trăm lẻ chín năm và sinh được con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, động từ חיה chỉ quãng đời tiếp tục sau sự kiện được nêu; “sống thêm” diễn đạt tự nhiên mối liên hệ với “sau khi”.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ
  choice: sau khi sinh Rê-u
  rationale: אַחֲרֵי đánh dấu thời gian tiếp sau, còn Hiphil của ילד trong gia phả nói đến việc người cha sinh ra một người con. Tiếng Việt dùng “sinh” tự nhiên và vẫn rõ chủ thể là Bê-léc.
- source_word: רְעוּ
  choice: Rê-u
  rationale: Phiên âm tên riêng theo âm tiết Hê-bơ-rơ, có dấu gạch nối để hỗ trợ cách đọc.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: hai trăm lẻ chín năm
  rationale: Đảo trật tự số của nguyên văn sang cách nói tự nhiên trong tiếng Việt; “lẻ” phù hợp văn phong hiện đại.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Giữ nhất quán với động từ ילד trước đó; trong ngữ cảnh gia phả, “sinh” là cách diễn đạt tiếng Việt tự nhiên cho việc có con.
- source_word: בָּנִים וּבָנוֹת
  choice: con trai, con gái
  rationale: Giữ nguyên sự phân biệt rõ ràng giữa hậu duệ nam và nữ trong nguyên văn, thay vì khái quát thành “các con”.
