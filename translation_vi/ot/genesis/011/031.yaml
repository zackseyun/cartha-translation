source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: vi
  text: Tha-rê đem theo Áp-ram, con trai mình, Lót là con trai Ha-ran và là cháu nội ông[a], cùng Sa-rai, con dâu ông, tức vợ của Áp-ram, con trai ông. Rồi họ cùng nhau[b] rời U-rơ của người Canh-đê để đi đến đất Ca-na-an. Họ đi đến tận Ha-ran và định cư tại đó.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa tiếng Hê-bơ-rơ: “Lót, con trai Ha-ran, con trai của con trai ông”; nghĩa là Lót là cháu nội của Tha-rê.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ sát chữ là “họ đi ra với họ”, một cách diễn đạt khó hiểu vì cả động từ lẫn đại từ đều ở số nhiều. Bản dịch chính truyền đạt ý cả nhóm cùng lên đường.
    reason: textual_crux
  - marker: c
    text: 'Cũng có thể dịch: “Họ đến Ha-ran và cư ngụ tại đó.” Cụm từ tiếng Hê-bơ-rơ được dịch sát hơn là “họ đến tận Ha-ran và định cư tại đó”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: đem
  rationale: Trong ngữ cảnh Tha-rê dẫn các thành viên gia đình lên đường, “đem” tự nhiên hơn “lấy” trong tiếng Việt mà vẫn giữ nghĩa cơ bản của động từ.
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  choice: Lót là con trai Ha-ran và là cháu nội ông
  rationale: 'Diễn đạt rõ quan hệ gia đình: Lót là con của Ha-ran, tức con trai của con trai Tha-rê. Chú thích giữ lại cấu trúc sát chữ khác thường của tiếng Hê-bơ-rơ.'
- source_word: כַּלָּתוֹ
  choice: con dâu ông
  rationale: Chỉ chính xác quan hệ của Sa-rai với Tha-rê và là cách nói hiện đại, tự nhiên.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: họ cùng nhau rời
  rationale: Động từ mang số nhiều, còn đại từ tiếp vĩ ngữ cũng là số nhiều, tạo cách diễn đạt sát chữ khó hiểu là “họ đi ra với họ”. “Họ cùng nhau rời” truyền đạt việc cả nhóm lên đường mà không âm thầm đổi động từ thành số ít; chú thích bảo tồn điểm khó của nguyên văn.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: từ U-rơ của người Canh-đê
  rationale: Giữ địa danh và tên dân tộc theo lối phiên âm Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: để đi đến đất Ca-na-an
  rationale: Thể hiện mục đích và hướng đến đích của động từ nguyên mẫu cùng dạng chỉ hướng của “đất”.
- source_word: וַיָּבֹאוּ עַד חָרָן
  choice: Họ đi đến tận Ha-ran
  rationale: “Đến tận” phản ánh עַד, nhấn mạnh giới hạn hành trình đến Ha-ran, thay vì chỉ nói chung chung là đến nơi.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: định cư tại đó
  rationale: Trong trình thuật di cư, “định cư” phù hợp với ý cư ngụ tại một nơi hơn cách nói có thể gợi sự tạm thời như “ở lại”.
