translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các tên riêng phiên âm quen thuộc: Tha-rê, Áp-ram, Ha-ran, Sa-rai, U-rơ, Canh-đê và Ca-na-an. Chia câu dài của tiếng Hê-bơ-rơ thành ba câu tiếng Việt để dễ đọc, nhưng vẫn giữ nguyên trình tự hành động và quan hệ gia đình.'
