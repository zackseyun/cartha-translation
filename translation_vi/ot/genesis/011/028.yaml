base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: vi
  text: Ha-ran chết trước mặt cha mình là Tha-rê, tại quê hương mình, ở U-rơ của người Canh-đê.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Động từ wayyiqtol của מות thuật lại trực tiếp một biến cố quá khứ; “qua đời” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: עַל־פְּנֵי
  choice: trước mặt
  rationale: Giữ hình ảnh cụ thể và sự mơ hồ chân thực của thành ngữ Hê-bơ-rơ, có thể chỉ việc xảy ra trước sự hiện diện của người cha hoặc trước khi người cha qua đời.
- source_word: תֶּרַח אָבִיו
  choice: cha mình là Tha-rê
  rationale: Xác định Tha-rê là cha của Ha-ran, đồng thời dùng trật tự tự nhiên trong tiếng Việt.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: tại quê hương ông
  rationale: מוֹלֶדֶת chỉ nơi sinh hoặc xứ sở bản quán; “quê hương” tự nhiên, rõ nghĩa và không thu hẹp quá mức vào địa điểm sinh chính xác.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: ở U-rơ của người Canh-đê
  rationale: U-rơ là địa danh; כַּשְׂדִּים là tên dân tộc. Cách dịch này thể hiện quan hệ định danh của cụm Hê-bơ-rơ.
