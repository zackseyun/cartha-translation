  source_fidelity: Cần đổi “qua đời” thành “chết” để phản ánh trực tiếp יותר động từ וַיָּמָת trong văn kể chuyện. “Trước mặt” bảo lưu cách hiểu không hoàn toàn đơn nghĩa của עַל־פְּנֵי; chú thích trình bày hợp lý cách hiểu thời gian. “Quê hương” phù hợp với ý xứ sở bản quán/nơi sinh, nhưng đại từ “ông” có thể tạo một thoáng mơ hồ về quy chiếu trong câu.
