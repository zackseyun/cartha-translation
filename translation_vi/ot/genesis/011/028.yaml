  rationale: Bản sửa chỉ thay cách nói uyển ngữ bằng động từ trực tiếp tương ứng với tiếng Hê-bơ-rơ, và làm rõ đại từ chỉ Ha-ran. Cách dịch “trước mặt” cùng chú thích vẫn giữ cả sắc thái hiện diện lẫn khả năng hiểu theo thời gian của thành ngữ nguồn.
