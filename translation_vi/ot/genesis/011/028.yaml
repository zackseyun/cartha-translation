  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “trước mặt” trong chính văn để bảo toàn sắc thái cụ thể cùng tính đa nghĩa của thành ngữ nguồn; chú thích nêu cách hiểu theo thời gian.
