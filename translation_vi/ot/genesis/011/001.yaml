  text: The whole earth had one language and the same words[a].
translation:
  language: vi
  text: Khắp đất chỉ có một ngôn ngữ và cùng một bộ từ ngữ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và cùng một lối nói”. Tiếng Hê-bơ-rơ dịch sát là “và những lời như nhau”; ý nghĩa chính xác của cụm này không hoàn toàn chắc chắn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: đều dùng
  rationale: Động từ היה trong mạch kể giới thiệu tình trạng đang có. Tiếng Việt tự nhiên diễn đạt tình trạng ấy qua vị ngữ “đều dùng”, không cần thêm công thức cổ “và xảy ra rằng” hay một trạng từ thời gian không có trong nguyên văn.
- source_word: כָל הָאָרֶץ
  choice: cả đất
  rationale: הָאָרֶץ có thể chỉ “đất/đất đai” hoặc “trái đất”. Trong văn cảnh này, cụm từ bao quát cư dân trên đất; “cả đất” giữ cách diễn đạt trang trọng, quen thuộc của Sáng Thế Ký và không áp đặt khái niệm địa cầu hiện đại.
- source_word: שָׂפָה אֶחָת
  choice: một ngôn ngữ
  rationale: שָׂפָה nghĩa đen là “môi” nhưng trong thành ngữ này chỉ ngôn ngữ hay lời nói; “một ngôn ngữ” rõ nghĩa và giữ được ý duy nhất của אֶחָת.
- source_word: וּדְבָרִים אֲחָדִים
  choice: và cùng những lời như nhau
  rationale: דְּבָרִים thường có nghĩa là “những lời” hoặc “những điều”. Cách dịch này giữ hình thức số nhiều và sắc thái đồng nhất của אֲחָדִים, thay vì đồng nhất hoàn toàn cụm này với “ngôn ngữ” ở vế trước.
