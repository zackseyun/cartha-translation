- from: Cả đất đều dùng một ngôn ngữ và cùng những lời như nhau[a].
  to: Khắp đất chỉ có một ngôn ngữ và cùng một bộ từ ngữ[a].
  rationale: Sửa để tiếng Việt tự nhiên hơn, loại bỏ việc gán hành động cho ‘đất’ và tránh lặp nghĩa trong vế hai. Bản sửa vẫn phản ánh phạm vi bao quát của כָּל הָאָרֶץ, tính đơn nhất của שָׂפָה אֶחָת, và giữ riêng nét nghĩa ‘lời/từ ngữ’ của דְּבָרִים אֲחָדִים. Chú thích bảo tồn tính không chắc chắn của cụm cuối mà không áp đặt một cách hiểu giáo phái hay diễn giải cụ thể.
