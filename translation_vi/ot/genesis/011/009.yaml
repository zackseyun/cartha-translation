id: GEN.11.9
reference: Genesis 11:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: vi
  text: Vì thế, thành ấy được đặt tên là Ba-bên[a], vì tại đó Yahweh đã làm rối loạn ngôn ngữ của cả thế gian, và từ đó Yahweh đã phân tán họ ra khắp mặt đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ba-bên gợi âm động từ Hê-bơ-rơ ba-lal, nghĩa là “làm rối loạn” hoặc “pha trộn”; câu này dùng lối chơi chữ ấy để giải thích tên gọi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Giữ rõ quan hệ suy luận-nguyên nhân và tự nhiên trong tiếng Việt hiện đại.
- source_word: קָרָא שְׁמָהּ
  choice: thành ấy được đặt tên là
  rationale: Nguyên văn là công thức 'gọi tên nó'; cách diễn đạt bị động tiếng Việt tránh phải bổ sung một chủ thể không được nêu, còn 'thành ấy' làm rõ đại từ giống cái chỉ về đô thị trong ngữ cảnh.
- source_word: בָּבֶל
  choice: Ba-bên
  rationale: Phiên âm địa danh theo hình thức quen thuộc trong truyền thống Kinh Thánh tiếng Việt; lối chơi chữ với בָּלַל được giải thích trong chú thích.
- source_word: כִּי שָׁם
  choice: bởi tại đó
  rationale: Diễn đạt tự nhiên ý giải thích nguyên nhân của việc đặt tên.
- source_word: בָּלַל
  choice: làm rối loạn
  rationale: Trong ngữ cảnh, động từ chỉ việc khiến lời nói/ngôn ngữ không còn thông hiểu thống nhất; cách dịch này giữ sắc thái gây ra sự hỗn loạn mà không thu hẹp thành chỉ 'pha trộn'.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng thần thánh đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: ngôn ngữ của cả thế gian
  rationale: שָׂפָה nghĩa đen là 'môi' nhưng ở đây là thành ngữ chỉ ngôn ngữ/lời nói; 'cả thế gian' diễn đạt phạm vi toàn thể nhân loại trong mạch văn.
- source_word: וּמִשָּׁם
  choice: và từ đó
  rationale: Giữ liên kết địa điểm với Ba-bên vừa được nhắc đến.
- source_word: הֱפִיצָם
  choice: đã phân tán họ
  rationale: Thể Hiphil biểu thị khiến họ tản ra về địa lý; 'phân tán' rõ nghĩa và trang trọng.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: ra khắp mặt đất
  rationale: Truyền đạt tự nhiên thành ngữ Hê-bơ-rơ 'trên bề mặt của toàn đất', đồng thời giữ hình ảnh 'mặt đất'.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự danh. Bản dịch giữ đây là danh riêng thay vì thay bằng tước hiệu; 'Đức Giê-hô-va' là hình thức quen thuộc, trang trọng đối với độc giả Việt.
- issue: Phạm vi của כָּל הָאָרֶץ
  choice: cả thế gian / khắp mặt đất
  alternative: toàn xứ / khắp vùng đất
  rationale: Mạch văn nói về ngôn ngữ chung và sự phân tán của toàn thể cộng đồng loài người được kể trong trình thuật; tuy vậy, hai cách diễn đạt tiếng Việt vẫn giữ nghĩa cơ bản của אֶרֶץ mà không thêm một học thuyết địa lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại danh Đức Giê-hô-va và các chỉ từ địa điểm của nguyên văn; dùng chú thích để bảo toàn lối chơi chữ không thể tái hiện trọn vẹn trong tiếng Việt.
