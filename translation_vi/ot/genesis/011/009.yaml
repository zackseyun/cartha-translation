  terminology: Nên dùng nhất quán “Yahweh” cho יהוה, thay vì “Đức Giê-hô-va”, để bảo toàn danh riêng được chọn trong bản nguồn/audit trail. “Ba-bên” và chú thích về lối chơi chữ là phù hợp.
  issues:
