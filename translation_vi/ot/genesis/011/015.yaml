base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi làm cha của Ê-be, Sê-lách sống thêm 403 năm và sinh con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, động từ חיה nói về quãng đời tiếp tục sau khi sinh người con được nêu; “sống thêm” diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: שֶׁלַח
  choice: Sê-lách
  rationale: Phiên âm tên riêng theo dạng Hê-bơ-rơ, với âm cuối được thể hiện bằng “ch”.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: sau khi sinh
  rationale: Trong ngữ cảnh gia phả với chủ thể nam, Hiphil của ילד chỉ việc sinh ra/làm cha của một người; “sinh” là cách nói tiếng Việt tự nhiên, gọn và vẫn giữ quan hệ phụ hệ.
- source_word: אֶת עֵבֶר
  choice: Ê-be
  rationale: Không dịch dấu hiệu tân ngữ אֶת; phiên âm עֵבֶר gần với dạng Hê-bơ-rơ.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 năm
  rationale: Cụm số Hê-bơ-rơ theo nghĩa là bốn trăm lẻ ba năm; dùng chữ số giúp câu gia phả sáng rõ và tự nhiên.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Với chủ thể nam trong bản tóm lược gia phả, ילד có nghĩa là sinh ra/làm cha; “sinh” phù hợp lối diễn đạt Kinh Thánh tiếng Việt hiện đại hơn dạng cổ “sinh hạ”.
- source_word: בָּנִים וּבָנוֹת
  choice: các con trai, con gái
  rationale: Giữ nguyên sự phân biệt hai giới được văn bản nêu rõ, thay vì khái quát thành “con cái”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đảo mệnh đề thời gian lên đầu để câu tiếng Việt tự nhiên; dùng “sống thêm” nhằm làm rõ đây là 403 năm sau khi Ê-be ra đời. Mọi dấu chú thích trong bản văn đều có chú thích tương ứng.
