base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: vi
  text: Nào, chúng ta hãy xuống đó và làm rối loạn ngôn ngữ của họ, để người này không hiểu ngôn ngữ của người kia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: Nào
  rationale: Diễn đạt tự nhiên lời thúc giục mở đầu; dạng Hê-bơ-rơ là số ít nhưng được dùng như một thán từ cố định trước lời kêu gọi cùng hành động.
- source_word: נֵרְדָה
  choice: chúng ta hãy xuống đó
  rationale: Giữ ngôi thứ nhất số nhiều mang sắc thái khích lệ/ý chí; “đó” diễn đạt שָׁם, nơi đang được nhắc tới.
- source_word: נָבְלָה
  choice: làm rối loạn
  rationale: Trong ngữ cảnh, động từ diễn tả việc khiến phương tiện giao tiếp của họ trở nên hỗn loạn, không còn hiểu nhau.
- source_word: שְׂפָתָם
  choice: ngôn ngữ của họ
  rationale: שָׂפָה theo nghĩa đen là “môi”, nhưng tại đây là hoán dụ chỉ ngôn ngữ; số ít tập hợp được giữ tự nhiên trong tiếng Việt.
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: người này không hiểu lời của người kia
  rationale: Thành ngữ phân phối “mỗi người/người nọ ... người bên cạnh mình” được chuyển thành cặp đối ứng tự nhiên; “lời” tránh lặp nặng từ “ngôn ngữ” mà vẫn phản ánh שְׂפַת.
theological_decisions:
- issue: Chủ thể số nhiều trong “chúng ta hãy xuống”
  choice: Giữ nguyên ngôi thứ nhất số nhiều mà không giải thích danh tính các bên được bao gồm.
  alternative: Diễn giải là Đức Chúa Trời nói với thiên sứ, hoặc là số nhiều nội tại trong Đức Chúa Trời.
  rationale: Bản Hê-bơ-rơ thực sự dùng số nhiều nhưng câu này không tự xác định cách hiểu thần học; bản dịch cần bảo toàn sự căng thẳng và tính mơ hồ ấy.
- issue: Mục đích của việc làm rối loạn ngôn ngữ
  choice: Dịch bằng mệnh đề mục đích “để ... không hiểu”.
  alternative: Dịch như kết quả đơn thuần “đến nỗi ... không hiểu”.
  rationale: אֲשֶׁר לֹא trong mạch lời kêu gọi hành động tại đây tự nhiên biểu đạt mục đích, đồng thời không thêm bình luận về động cơ ngoài văn bản.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. “Nào, chúng ta hãy...” giữ nhịp lời kêu gọi; “người này ... người kia” tự nhiên hơn lối dịch sát chữ “một người ... người lân cận mình” trong tiếng Việt hiện đại.
