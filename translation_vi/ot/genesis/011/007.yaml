  source_fidelity: Bản dịch giữ đúng lời kêu gọi số nhiều («chúng ta hãy»), hướng xuống «đó», hành động làm ngôn ngữ bị hỗn loạn, và mệnh đề mục đích. Tuy nhiên, «lời của người kia» thu hẹp sự lặp lại của שָׂפָה (ngôn ngữ/tiếng nói) thành một lời nói riêng lẻ; nguyên ngữ nói đến việc một người không hiểu ngôn ngữ của người đồng bạn mình.
  naturalness: Câu văn tự nhiên, trang trọng vừa phải và phù hợp tiếng Việt hiện đại. Giữ «người này ... người kia» là cách diễn đạt phân phối dễ đọc.
  terminology: Nên dùng nhất quán «ngôn ngữ» cho cả hai lần שָׂפָה để phản ánh liên kết từ vựng và ý nghĩa của câu. Không cần chú thích cho số nhiều trong «chúng ta», vì văn bản không xác định các bên được bao gồm.
