base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: vi
  text: Trên đường đi từ phương đông[a], họ tìm thấy một đồng bằng trong xứ Si-nê-a và định cư tại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “về phía đông.” Cụm từ Hê-bơ-rơ מִקֶּדֶם có thể chỉ nơi xuất phát (“từ phương đông”) hoặc hướng di chuyển (“về phía đông”).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: Khi họ lên đường
  rationale: Cấu trúc וַיְהִי kèm mệnh đề thời gian được diễn đạt tự nhiên bằng “Khi”; נסע chỉ việc nhổ trại và tiếp tục hành trình, nên “lên đường” phù hợp hơn một công thức cổ như “xảy ra khi”.
- source_word: מִקֶּדֶם
  choice: từ phương đông
  rationale: Giới từ מִן tự nhiên nhất chỉ nơi xuất phát, còn קֶדֶם ở đây có thể là “phương đông”; cách hiểu chỉ hướng “về phía đông” được giữ trong chú thích.
- source_word: וַיִּמְצְאוּ
  choice: họ tìm thấy
  rationale: Diễn đạt trực tiếp nghĩa thông thường của מצא và phù hợp với ngữ cảnh.
- source_word: בִקְעָה
  choice: một đồng bằng
  rationale: Từ này chỉ vùng đất thấp rộng, đồng bằng hoặc thung lũng rộng; “đồng bằng” phù hợp với địa lý Si-nê-a.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: trong xứ Si-nê-a
  rationale: Giữ danh từ địa lý אֶרֶץ bằng “xứ” và phiên âm địa danh שִׁנְעָר theo lối quen thuộc, trang trọng trong tiếng Việt.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: và định cư tại đó
  rationale: Trong bối cảnh một cộng đồng đang di chuyển rồi dừng lại, ישב mang sắc thái ổn định chỗ ở; “định cư” rõ hơn “ở”.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “lên đường” để diễn đạt chuyển động của cả cộng đồng một cách tự nhiên; giữ nguyên sự mơ hồ địa lý của מִקֶּדֶם bằng chú thích.
