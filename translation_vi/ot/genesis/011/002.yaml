  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các thành tố chính của tiếng Hê-bơ-rơ: mệnh đề thời gian, sự mơ hồ của מִקֶּדֶם được bảo lưu bằng chú thích, việc tìm thấy một đồng bằng tại xứ Si-nê-a, và việc định cư ở đó. Tuy nhiên, “lên đường” thường nhấn vào lúc khởi hành, trong khi בְּנָסְעָם diễn tả lúc họ đang hành trình/di chuyển. “Trên đường đi” truyền đạt sát hơn sắc thái tiếp diễn này.'
