  text: Ê-be sống được ba mươi bốn năm thì làm cha của Phê-léc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה chỉ số năm một người đã sống trước sự kiện kế tiếp; “sống được” tự nhiên trong tiếng Việt và không hàm ý đây là toàn bộ tuổi thọ.
- source_word: עֵבֶר
  choice: Ê-be
  rationale: Phiên âm tên riêng Hê-bơ theo cách đọc gần nguyên ngữ và hình thức quen dùng trong tiếng Việt.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: ba mươi bốn năm
  rationale: Đảo trật tự số đếm Hê-bơ theo cú pháp tự nhiên của tiếng Việt, vẫn giữ chính xác con số 34.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Với chủ thể là nam giới trong gia phả, ילד ở thể Hifil có nghĩa là sinh ra hoặc làm cha của người con; “sinh” là cách diễn đạt gọn, tự nhiên và quen thuộc trong văn mạch gia phả tiếng Việt.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu đánh dấu tân ngữ xác định trong tiếng Hê-bơ, được thể hiện bằng cú pháp tiếng Việt chứ không cần một từ tương ứng.
- source_word: פָּלֶג
  choice: Phê-léc
  rationale: Phiên âm tên riêng Hê-bơ theo cách đọc gần nguyên ngữ và phù hợp quy ước tên Kinh Thánh tiếng Việt.
