base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: vi
  text: 'Người này nói với người kia: “Nào, chúng ta hãy làm gạch và nung cho thật kỹ.” Gạch được họ dùng thay cho đá, còn nhựa đường[a] được dùng thay cho vữa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ bitum, tức một loại nhựa khoáng giống hắc ín được dùng làm chất kết dính trong xây dựng.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: Người này nói với người kia
  rationale: Cách nói phân phối trong tiếng Hê-bơ-rơ có nghĩa là người nọ nói với người kia. Bản dịch này giữ được hình thức số ít và diễn đạt tự nhiên hơn cách dịch máy móc “mỗi người nói với người lân cận mình”.
- source_word: הָבָה
  choice: Nào
  rationale: Tiểu từ này mở đầu lời thúc giục chung; “Nào” là cách diễn đạt hiện đại, gọn và tự nhiên trong tiếng Việt.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: chúng ta hãy làm gạch
  rationale: Động từ phái sinh từ danh từ “gạch” mang nghĩa làm hoặc đúc gạch. “Làm gạch” vừa chính xác vừa thông dụng.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: và nung cho thật kỹ
  rationale: Động từ đi với danh từ cùng gốc tạo ý nhấn mạnh. Trong ngữ cảnh sản xuất gạch, “nung cho thật kỹ” chính xác và tự nhiên hơn “đốt thật kỹ”.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: Gạch được họ dùng thay cho đá
  rationale: Cấu trúc היה + ל diễn tả sự thay thế về công dụng chứ không phải gạch biến đổi thành đá. Cách dịch này làm rõ quan hệ chức năng mà không thêm ý ngoài nguyên văn.
- source_word: הַחֵמָר
  choice: nhựa đường
  rationale: Từ này chỉ bitum, một loại nhựa khoáng giống hắc ín được dùng trong xây dựng. “Nhựa đường” là từ hiện đại, dễ hiểu đối với độc giả phổ thông.
- source_word: לַחֹמֶר
  choice: thay cho vữa
  rationale: Trong ngữ cảnh xây dựng, חֹמֶר chỉ vật liệu kết dính như vữa. Cụm “thay cho vữa” giữ sự song song với việc dùng gạch thay đá.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người này… người kia” để giữ sắc thái phân phối của nguyên văn; dùng thuật ngữ xây dựng quen thuộc và giữ cấu trúc song song giữa gạch/đá với nhựa đường/vữa.
