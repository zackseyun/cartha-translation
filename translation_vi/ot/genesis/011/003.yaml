  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: cách nói phân phối “người này ... người kia”; lời hô thúc “Nào”; việc làm gạch và nung với sắc thái nhấn mạnh; cũng như hai quan hệ thay thế công năng—gạch thay đá và bitum thay vữa. “Nung cho thật kỹ” diễn đạt tự nhiên ý nhấn mạnh của cấu trúc đồng nguyên.'
  naturalness: Tiếng Việt hiện đại, mạch lạc và có nhịp văn phù hợp. “Người này nói với người kia” là cách diễn đạt tự nhiên, vẫn gợi được ý người nọ nói với người kia mà không gán thêm chi tiết.
  terminology: “Gạch,” “đá,” và “vữa” phù hợp ngữ cảnh xây dựng. “Nhựa đường” có thể trong cách dùng hiện đại gợi vật liệu đường sá, nhưng chú thích xác định rõ đây là bitum/nhựa khoáng giống hắc ín; vì vậy thuật ngữ không gây mất nghĩa trong bản văn.
