  text: וַ/תְּהִ֥י שָׂרַ֖י עֲקָרָ֑ה אֵ֥ין לָ֖/הּ וָלָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: vi
  text: Sa-rai hiếm muộn[a]; bà không có con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sa-rai không thể sinh con; bà không có con cái.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: hiếm muộn
  rationale: Dạng וַתְּהִי của היה dẫn tiếp lời kể và làm động từ nối cho vị ngữ tính từ. Tiếng Việt không cần dịch riêng động từ 'là' trong cấu trúc này; cũng không thêm từ chỉ thời gian như 'bấy giờ' vì nguyên văn không có từ tương ứng.
- source_word: שָׂרַי
  choice: Sa-rai
  rationale: Phiên âm tên riêng theo lối quen thuộc, rõ ràng đối với độc giả Việt ngữ.
- source_word: עֲקָרָה
  choice: hiếm muộn
  rationale: Tính từ chỉ tình trạng không thể sinh con. 'Hiếm muộn' tự nhiên, trang trọng và ít mang sắc thái miệt thị hơn 'son sẻ'; 'không con' sẽ trùng ý quá mức với mệnh đề giải thích tiếp theo.
- source_word: אֵין לָהּ
  choice: bà không có
  rationale: Cấu trúc phủ định hiện hữu kèm giới từ và đại từ hậu tố được diễn đạt tự nhiên trong tiếng Việt bằng cấu trúc sở hữu phủ định.
- source_word: וָלָד
  choice: con
  rationale: Danh từ chỉ đứa trẻ hoặc người con được sinh ra; 'con' là cách diễn đạt cụ thể và tự nhiên nhất trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện ngắn gọn, hiện đại và trang trọng. Dấu chấm phẩy giữ quan hệ giải thích giữa tình trạng hiếm muộn và việc không có con; đại từ “bà” phù hợp khi nhắc lại một phụ nữ trưởng thành đã được nêu tên.
