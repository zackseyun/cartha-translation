  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: vi
  text: Vì thế, Yahweh phân tán họ từ đó ra khắp mặt đất[a], và họ ngừng xây thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “trên mặt toàn cõi đất”; cũng có thể dịch: “khắp cả đất” hoặc “trên khắp đất”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: phân tán
  rationale: Động từ פוץ ở dạng khiến làm diễn tả việc Yahweh làm cho dân chúng tản ra; “phân tán” tự nhiên, rõ nghĩa và phù hợp với bối cảnh phán xét.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: מִשָּׁם
  choice: từ đó
  rationale: Cụm chỉ nơi chốn trực tiếp, quy chiếu về địa điểm xây thành trong văn cảnh.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: ra khắp mặt đất
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ nghĩa đen là “trên bề mặt của toàn đất”; “khắp mặt đất” giữ phạm vi rộng của câu chuyện, còn chú thích bảo lưu hình ảnh nguyên văn.
- source_word: וַיַּחְדְּלוּ
  choice: họ ngừng
  rationale: חדל có nghĩa là ngừng hoặc thôi; “ngừng” là cách nói hiện đại, gọn và phù hợp với động từ theo sau.
- source_word: לִבְנֹת
  choice: xây
  rationale: Động từ nguyên mẫu “xây” đi tự nhiên sau “ngừng” trong tiếng Việt.
- source_word: הָעִיר
  choice: thành
  rationale: Danh từ xác định chỉ thành đang được xây trong văn cảnh; “thành” trang trọng, tự nhiên trong văn thuật Kinh Thánh và không cần lặp loại từ.
theological_decisions:
- issue: Cách dịch danh thần יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Tự; phiên âm “Yahweh” bảo tồn tư cách tên riêng thay vì thay thế bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vì thế” nối kết tự nhiên với hành động phán xét ở câu trước; “ra khắp mặt đất” tránh lối dịch cứng nhưng chú thích vẫn bảo lưu hình ảnh Hê-bơ-rơ.
