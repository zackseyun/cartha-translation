base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/012.yaml
  text: And Arpachshad lived thirty-five years and fathered Shelah[a][b][c].
translation:
  language: vi
  text: Arpác-sát sống được ba mươi lăm năm thì trở thành cha của Sê-lách.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số truyền thống ghi tên này là “Sa-la.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arpác-sát
  rationale: Liên từ וְ nối tiếp chuỗi gia phả nhưng không cần dịch riêng trong tiếng Việt; tên riêng được phiên âm gần với dạng Hê-bơ-rơ và theo lối viết dễ đọc.
- source_word: חַי חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: sống được ba mươi lăm năm
  rationale: Diễn đạt tự nhiên công thức tuổi tác trong gia phả; trật tự số Hê-bơ-rơ theo nghĩa đen là “năm và ba mươi” được chuyển sang trật tự số chuẩn của tiếng Việt.
- source_word: וַ/יּוֹלֶד
  choice: thì sinh
  rationale: Động từ Hifil của ילד trong gia phả nói về việc người nam sinh ra hoặc trở thành cha của người được nêu. “Sinh” là cách nói gọn, tự nhiên trong gia phả tiếng Việt, còn chú thích bảo lưu sắc thái phụ hệ.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ xác định trong tiếng Hê-bơ-rơ; chức năng của nó được thể hiện bằng trật tự từ tiếng Việt.
- source_word: שָׁלַח
  choice: Sê-lách
  rationale: Phiên âm tên riêng dựa trên dạng Hê-bơ-rơ; cách phiên âm khác được ghi trong chú thích.
theological_decisions:
- issue: Phạm vi nghĩa của וַיּוֹלֶד trong công thức gia phả
  choice: sinh
  alternative: trở thành cha của
  rationale: Bản văn xác định quan hệ phụ hệ nhưng tự nó không giải quyết mọi câu hỏi về việc chuỗi gia phả có luôn trực tiếp hay không. Bản chính dùng cách nói gia phả tự nhiên, còn chú thích nêu cách dịch sát sắc thái phụ hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp ngắn gọn của công thức gia phả; không dịch máy móc liên từ mở đầu vì tiếng Việt đã thể hiện rõ sự tiếp nối qua ngữ cảnh.
