  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi Ê-be trở thành cha của Phê-léc, ông sống thêm bốn trăm ba mươi năm và có thêm các con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, חיה có nghĩa là sống; thêm “thêm” diễn đạt tự nhiên rằng khoảng thời gian này tiếp nối sau khi sinh Phê-léc.
- source_word: עֵבֶר
  choice: Ê-be
  rationale: Phiên âm tên riêng theo lối quen dùng và tự nhiên trong tiếng Việt.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: Sau khi sinh Phê-léc
  rationale: Hifil của ילד trong gia phả chỉ việc người cha sinh ra một người con; “sinh” ngắn gọn, rõ nghĩa và không cổ kính.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: bốn trăm ba mươi năm
  rationale: Sắp xếp số theo cú pháp tự nhiên của tiếng Việt, giữ nguyên tổng thời gian 430 năm.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Giữ nhất quán với động từ ילד trong cùng câu và phù hợp với văn phong gia phả tiếng Việt.
- source_word: בָּנִים וּבָנוֹת
  choice: con trai, con gái
  rationale: Giữ nguyên sự nêu rõ cả con trai lẫn con gái trong tiếng Hê-bơ-rơ, thay vì khái quát thành “các con”.
