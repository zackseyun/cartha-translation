  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: vi
  text: Áp-ram và Na-hô cưới vợ. Vợ của Áp-ram tên là Sa-rai, còn vợ của Na-hô tên là Minh-ca, con gái của Ha-ran; Ha-ran là cha của Minh-ca và cha của Gít-ca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... לָהֶם נָשִׁים
  choice: cưới vợ
  rationale: Đây là thành ngữ chỉ việc kết hôn; dịch sát từng chữ là “lấy những người vợ cho mình”, nhưng “cưới vợ” tự nhiên và chính xác hơn trong tiếng Việt hiện đại.
- source_word: שֵׁם אֵשֶׁת
  choice: vợ của ... tên là
  rationale: Diễn đạt tự nhiên cấu trúc Hê-bơ-rơ “tên của vợ ... là”, đồng thời giữ nguyên thông tin và nhịp kể.
- source_word: שָׂרָי
  choice: Sa-rai
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: מִלְכָּה
  choice: Minh-ca
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: בַּת הָרָן
  choice: con gái của Ha-ran
  rationale: Giữ quan hệ huyết thống trực tiếp được nêu rõ trong nguyên văn.
- source_word: אֲבִי מִלְכָּה וַאֲבִי יִסְכָּה
  choice: Ha-ran là cha của Minh-ca và Gít-ca
  rationale: Làm rõ chủ ngữ trong tiếng Việt và bảo toàn việc nguyên văn lặp lại “cha của” đối với hai người con, không tạo hàm ý Minh-ca là mẹ hay chị em của Gít-ca.
- source_word: יִסְכָּה
  choice: Gít-ca
  rationale: Phiên âm tên riêng Hebrew sang dạng dễ đọc, phù hợp âm đầu yod của יִסְכָּה.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu đối với độc giả Việt Nam hiện đại. Thành ngữ hôn nhân được chuyển theo nghĩa thay vì bám sát từng chữ; các quan hệ gia đình được diễn đạt minh bạch. Không cần chú thích vì cách dịch không làm mất một sự mơ hồ hoặc dị bản có ý nghĩa.
