  to: Áp-ram và Na-hô cưới vợ. Vợ của Áp-ram tên là Sa-rai, còn vợ của Na-hô tên là Minh-ca, con gái của Ha-ran; Ha-ran là cha của Minh-ca và cha của Gít-ca.
  rationale: 'Sửa tên Na-hô để phù hợp nguyên ngữ và quy ước phiên âm Việt ngữ quen dùng. Lặp lại “cha của” trong mệnh đề cuối để phản ánh cấu trúc Hê-bơ-rơ và bảo toàn sự rõ ràng của gia hệ. Không cần chú thích: “cưới vợ” là cách nói tự nhiên, không tạo mơ hồ đáng kể trong tiếng Việt.'
  reviewer_model: gpt-5.6-terra
