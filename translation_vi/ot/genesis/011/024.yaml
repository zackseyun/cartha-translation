  source_fidelity: Câu dịch giữ đúng tuổi (hai mươi chín năm), trình tự sự kiện và tên riêng. Tuy nhiên, “sinh Ta-rê” có thể gợi hành vi sinh nở của người mẹ trong tiếng Việt hiện đại, trong khi Hiphil יָלַד ở đây là công thức gia phả nói Na-cô làm cha Ta-rê.
