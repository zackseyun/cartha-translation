  text: Na-cô sống được hai mươi chín năm, rồi làm cha của Ta-rê.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה nói đến số năm một người đã sống trước sự kiện kế tiếp; “sống được” tự nhiên trong tiếng Việt và phù hợp với cấu trúc này.
- source_word: נָחוֹר
  choice: Na-cô
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: hai mươi chín năm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ theo cách nói tự nhiên của tiếng Việt.
- source_word: וַיּוֹלֶד
  choice: thì sinh
  rationale: Hiphil của ילד trong gia phả chỉ việc người nam sinh ra hoặc làm cha của người con được nêu; “sinh” là cách diễn đạt ngắn gọn, tự nhiên và quen thuộc trong gia phả tiếng Việt.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Dấu hiệu chỉ tân ngữ trực tiếp không có từ tương đương độc lập trong tiếng Việt.
- source_word: תָּרַח
  choice: Ta-rê
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
