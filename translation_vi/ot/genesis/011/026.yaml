base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: vi
  text: Tha-rê sống được bảy mươi tuổi thì sinh Áp-ram[a], Na-cô và Ha-ran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “trở thành cha của.” Động từ gia phả trong tiếng Hê-bơ-rơ không nhất thiết cho biết các con chào đời đúng theo thứ tự được liệt kê, cũng không hàm ý họ là sinh ba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Trong công thức gia phả, động từ חיה ở đây cho biết Tha-rê đạt đến độ tuổi được nêu. “Sống được bảy mươi tuổi” là cách nói tự nhiên trong tiếng Việt và giữ rõ ý thời gian.
- source_word: שִׁבְעִים שָׁנָה
  choice: bảy mươi tuổi
  rationale: Nguyên văn là “bảy mươi năm”; tiếng Việt hiện đại diễn đạt tuổi tự nhiên bằng “bảy mươi tuổi”.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Trong văn cảnh gia phả, ילד ở dạng này nói về việc người nam có con hoặc trở thành cha. “Sinh” là lối diễn đạt gia phả gọn, quen thuộc trong tiếng Việt; chú thích làm rõ sắc thái theo phía người cha.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: Áp-ram, Na-cô và Ha-ran
  rationale: Các dấu chỉ tân ngữ lặp lại xác định riêng từng tên; danh sách tiếng Việt dùng dấu phẩy và “và” trước tên cuối một cách tự nhiên.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc, đồng thời phân biệt với tên Áp-ra-ham về sau.
- source_word: נָחוֹר
  choice: Na-cô
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: הָרָן
  choice: Ha-ran
  rationale: Phiên âm tên người theo cách dùng tiếng Việt quen thuộc; phụ âm đầu ה thuộc chính tên riêng, không phải mạo từ cần dịch riêng.
theological_decisions:
- issue: Trình tự gia phả và hàm ý về tuổi
  choice: 'Câu được dịch như một thông báo gia phả: khi Tha-rê được bảy mươi tuổi, ông sinh Áp-ram, Na-cô và Ha-ran, nhưng không khẳng định ba người là sinh ba hay thứ tự liệt kê chính là thứ tự chào đời.'
  alternative: Có thể hiểu Tha-rê bắt đầu có con lúc bảy mươi tuổi, còn ba tên được nêu là các hậu duệ chính và không nhất thiết cùng sinh ngay lúc ấy.
  rationale: Tiếng Hê-bơ-rơ nêu tuổi của Tha-rê rồi kể tên ba con trai, nhưng bản thân câu này không giải quyết dứt khoát các câu hỏi niên đại phát sinh khi đối chiếu với những câu sau. Bản dịch và chú thích giữ nguyên độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thì sinh” nối tự nhiên mốc tuổi với thông báo gia phả; chú thích ngăn cách hiểu quá mức về thứ tự sinh hoặc sinh ba.
