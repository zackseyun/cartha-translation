base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi Na-cô sinh được Tê-ra, ông sống thêm một trăm mười chín năm và sinh được các con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, động từ חיה chỉ quãng đời tiếp tục sau khi sinh người con được nêu; “sống thêm” diễn đạt tự nhiên và rõ quan hệ thời gian trong tiếng Việt.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Sau khi sinh
  rationale: Cụm này đánh dấu thời gian sau khi Na-cô sinh Tê-ra. “Sinh” là cách diễn đạt gọn, tự nhiên trong gia phả tiếng Việt và vẫn giữ chủ thể là người cha theo ngữ cảnh.
- source_word: תֶּרַח
  choice: Tê-ra
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong Kinh Thánh tiếng Việt.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: một trăm mười chín năm
  rationale: Tiếng Hê-bơ-rơ nêu 19 rồi 100; tiếng Việt tự nhiên sắp số lớn trước và viết bằng chữ phù hợp văn phong Kinh Thánh.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Giữ sự nhất quán với lần dùng ילד trước đó, đồng thời tránh lối nói cổ hoặc nặng nề.
- source_word: בָּנִים וּבָנוֹת
  choice: các con trai, con gái
  rationale: Giữ nguyên việc bản Hê-bơ-rơ nêu rõ cả con trai lẫn con gái, thay vì khái quát thành “các con”.
