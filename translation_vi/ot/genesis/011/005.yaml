  text: וַ/יֵּ֣רֶד יְהוָ֔ה לִ/רְאֹ֥ת אֶת הָ/עִ֖יר וְ/אֶת הַ/מִּגְדָּ֑ל אֲשֶׁ֥ר בָּנ֖וּ בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: vi
  text: Bấy giờ, Yahweh xuống để xem thành và tháp mà loài người đã xây[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “con cái loài người”; cụm từ Hê-bơ-rơ này chỉ chung con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ngự xuống
  rationale: Động từ ירד có nghĩa là “đi xuống/xuống”. “Ngự xuống” là cách diễn đạt trang trọng, tự nhiên khi chủ thể là Yahweh, đồng thời giữ nguyên chuyển động mang tính nhân hình của nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: לִרְאֹת
  choice: để xem
  rationale: Dịch trực tiếp động từ ראה và không diễn giải quá mức thành “thanh tra” hay “xem xét”.
- source_word: הָעִיר
  choice: thành
  rationale: Cách dịch gọn và tự nhiên của עִיר trong ngữ cảnh; tính xác định được hiểu từ câu chuyện và cấu trúc song song.
- source_word: הַמִּגְדָּל
  choice: tháp
  rationale: Cách dịch chuẩn của מִגְדָּל trong dự án xây dựng tại Ba-bên.
- source_word: אֲשֶׁר בָּנוּ
  choice: mà ... đã xây
  rationale: Mệnh đề quan hệ tự nhiên trong tiếng Việt; “đã” cho thấy công việc xây dựng có trước việc Yahweh ngự xuống mà không nhất thiết khẳng định dự án đã hoàn tất.
- source_word: בְּנֵי הָאָדָם
  choice: con cái loài người
  rationale: Giữ hình ảnh “con cái” của cấu trúc Hê-bơ-rơ, đồng thời truyền đạt nghĩa tập thể chỉ nhân loại trong tiếng Việt hiện đại.
theological_decisions:
- issue: Lối mô tả Yahweh ngự xuống theo hình thức nhân hóa
  choice: Giữ cách nói cụ thể “ngự xuống”.
  alternative: “nhìn xuống” hoặc “để ý đến”
  rationale: Nguyên văn mô tả một chuyển động cụ thể; không làm dịu nét văn chương-thần học này bằng cách diễn đạt trừu tượng.
- issue: Ý nghĩa của בְּנֵי הָאָדָם
  choice: Dùng “con cái loài người” trong chính văn.
  alternative: “nhân loại” hoặc “loài người”
  rationale: Cách dịch giữ được hình thức nguồn “con cái” nhưng vẫn diễn đạt lực nghĩa đại diện, bao gồm con người nói chung; chú thích làm rõ nghĩa tập thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bấy giờ” nối tiếp mạch kể; “ngự xuống” phù hợp với chủ thể thần linh nhưng vẫn bảo toàn nét nhân hình. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
