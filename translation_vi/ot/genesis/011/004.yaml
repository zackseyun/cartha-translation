  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: vi
  text: 'Họ nói: “Nào, chúng ta hãy xây cho mình một thành và một ngọn tháp có đỉnh ở trên trời[a]; chúng ta hãy làm nên tên tuổi cho mình, kẻo bị tản ra khắp mặt đất.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “có đỉnh ở trong các tầng trời”; cũng có thể dịch: “có đỉnh vươn tới trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Nào
  rationale: Thán từ kêu gọi cùng hành động; “Nào” tự nhiên trong tiếng Việt và giữ sắc thái thúc giục.
- source_word: נִבְנֶה לָּנוּ
  choice: chúng ta hãy xây cho mình
  rationale: Dạng khuyến dụ ngôi thứ nhất số nhiều được diễn đạt bằng “hãy”; לָּנוּ mang nghĩa lợi ích/phản thân, nên dịch “cho mình”.
- source_word: עִיר וּמִגְדָּל
  choice: một thành và một ngọn tháp
  rationale: “Thành” và “tháp” là các nghĩa cơ bản; không có căn cứ trong ngữ cảnh để thêm chức năng quân sự.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: có đỉnh ở tận trời
  rationale: Giữ hình ảnh định vị trực tiếp của nguyên văn (“đỉnh nó ở trong trời”) mà vẫn tự nhiên; “tận” truyền đạt độ cao hàm ý nhưng không biến mệnh đề thành động từ “chạm tới”.
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: chúng ta hãy làm nên danh tiếng cho mình
  rationale: Thành ngữ Hê-bơ-rơ “làm một cái tên” nói đến việc tạo danh tiếng; cách dịch này rõ nghĩa trong tiếng Việt hiện đại.
- source_word: פֶּן נָפוּץ
  choice: kẻo bị tản ra
  rationale: פֶּן nêu kết quả bị lo sợ; “kẻo” tương ứng tự nhiên. Dạng “bị tản ra” giữ cách hiểu thụ động có khả năng nhất trong ngữ cảnh.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: khắp mặt đất
  rationale: Diễn đạt tự nhiên thành ngữ “trên mặt toàn thể đất”; trong trình thuật nguyên thủy, הָאָרֶץ chỉ toàn cõi đất chứ không chỉ một vùng địa phương.
theological_decisions:
- issue: Phạm vi của הָאָרֶץ trong trình thuật Ba-bên
  choice: mặt đất
  alternative: xứ
  rationale: Bối cảnh Sáng Thế Ký 11 nói về nhân loại lan rộng trên toàn cõi đất; “mặt đất” phù hợp hơn một lãnh thổ địa phương.
- issue: Hình ảnh đỉnh tháp בַשָּׁמַיִם
  choice: có đỉnh ở tận trời
  alternative: có đỉnh chạm tới trời
  rationale: Nguyên văn nêu vị trí “ở trong trời”, không dùng động từ “chạm tới”; bản dịch tránh xác định quá mức bản chất hay khả năng của công trình.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng “Nào… hãy” để giữ lời kêu gọi tập thể; “kẻo” bảo tồn sắc thái lo ngại của פֶּן. Đại từ “mình” quy chiếu về cộng đồng đang nói.
