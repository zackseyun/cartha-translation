  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi làm cha của A-bác-sát, Sem sống thêm năm trăm năm và làm cha của các con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong văn cảnh gia phả, động từ חיה cùng khoảng thời gian sau khi sinh một người con diễn tả quãng đời tiếp tục; “sống thêm” tự nhiên và làm rõ quan hệ thời gian.
- source_word: שֵׁם
  choice: Sem
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: sau khi sinh
  rationale: אַחֲרֵי đánh dấu thời gian tiếp sau, còn Hiphil của ילד diễn tả người nam sinh ra/làm cha của một người con; tiếng Việt tự nhiên dùng “sau khi sinh” mà không làm mất vai trò của chủ thể nam đã rõ là Sem.
- source_word: אַרְפַּכְשָׁד
  choice: A-bác-sát
  rationale: Phiên âm tên riêng theo lối dễ đọc và quen thuộc với độc giả Kinh Thánh tiếng Việt.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: năm trăm năm
  rationale: Chuyển trực tiếp số từ chỉ thời lượng.
- source_word: וַיּוֹלֶד
  choice: và sinh
  rationale: Giữ nghĩa sinh thành của ילד trong công thức gia phả bằng cách diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: בָּנִים וּבָנוֹת
  choice: các con trai, con gái
  rationale: Giữ nguyên sự nêu rõ cả con trai lẫn con gái thay vì khái quát thành “các con”.
