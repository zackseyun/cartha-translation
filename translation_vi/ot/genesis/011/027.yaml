  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָ֑ן וְ/הָרָ֖ן הוֹלִ֥יד אֶת לֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: vi
  text: 'Đây là dòng dõi của Tha-rê: Tha-rê sinh Áp-ram, Na-cô và Ha-ran; Ha-ran sinh Lót.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Đây là
  rationale: Cụm liên từ và đại từ chỉ định mở đầu một phần mới. “Đây là” tự nhiên trong tiếng Việt và không thêm sắc thái thời gian không có trong nguyên văn.
- source_word: תּוֹלְדֹת
  choice: dòng dõi của
  rationale: Trong sách Sáng Thế, từ này là công thức cấu trúc nói về dòng phát sinh từ một người và phần ký thuật liên quan. “Dòng dõi” vừa trang trọng, dễ hiểu, vừa phù hợp ngữ cảnh gia phả.
- source_word: תֶּרַח
  choice: Tha-rê
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: הוֹלִיד
  choice: sinh
  rationale: Dạng Hiphil của ילד trong gia phả mang nghĩa sinh ra hoặc làm cha của. “Sinh” ngắn gọn, tự nhiên và có thể dùng cho người cha trong lối kể gia phả tiếng Việt.
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: Áp-ram, Na-cô và Ha-ran
  rationale: Các dấu hiệu tân ngữ không cần dịch; danh sách được nối tự nhiên bằng “và”, còn tên riêng được phiên âm.
- source_word: וְ/הָרָן
  choice: Ha-ran
  rationale: Liên từ nối mệnh đề này với mệnh đề trước. Trong tiếng Việt, dấu chấm phẩy đã thể hiện quan hệ tiếp nối nên không nhất thiết phải thêm “và”.
- source_word: הוֹלִיד אֶת לֽוֹט
  choice: sinh Lót
  rationale: Dịch nhất quán động từ gia phả הוֹלִיד là “sinh”; Lót là dạng phiên âm quen thuộc của tên riêng.
