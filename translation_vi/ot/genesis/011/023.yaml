- from: Sau khi sinh Na-cô, Sê-rúc sống thêm hai trăm năm và sinh các con trai, con gái.
  to: Sau khi làm cha Na-cô, Sê-rúc sống thêm hai trăm năm và có các con trai và con gái.
  rationale: Thay “sinh Na-cô” bằng “làm cha Na-cô” để bảo toàn nghĩa cha sinh con của động từ Hiphil ילד và tránh sự mơ hồ không tự nhiên trong tiếng Việt hiện đại. Vế cuối đổi sang “có các con trai và con gái” để diễn đạt tự nhiên, vẫn giữ rõ cả hai giới tính được nêu trong nguyên văn.
