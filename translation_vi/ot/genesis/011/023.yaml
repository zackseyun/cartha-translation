  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi làm cha Na-cô, Sê-rúc sống thêm hai trăm năm và có các con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, חיה chỉ việc tiếp tục sống; kết hợp với אַחֲרֵי, “sống thêm” diễn đạt tự nhiên khoảng thời gian sau khi sinh người con được nêu.
- source_word: שְׂרוּג
  choice: Sê-rúc
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết rõ ràng, quen dùng trong tiếng Việt.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת נָחוֹר
  choice: sau khi sinh Na-cô
  rationale: אַחֲרֵי mang nghĩa thời gian “sau khi”; Hiphil của ילד trong gia phả nói người cha sinh ra/có con. Tiếng Việt tự nhiên dùng “sinh” dù chủ thể là nam, và ngữ cảnh gia phả làm rõ quan hệ cha con.
- source_word: נָחוֹר
  choice: Na-cô
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo quy ước tiếng Việt.
- source_word: מָאתַיִם שָׁנָה
  choice: hai trăm năm
  rationale: Diễn đạt đúng số lượng và thời gian kéo dài trong tiếng Việt.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Giữ sự tương ứng với động từ ילד ở vế trước và phù hợp với cách diễn đạt gia phả tiếng Việt; “có” tự nhiên hơn nhưng kém sát nghĩa hơn.
- source_word: בָּנִים וּבָנוֹת
  choice: các con trai, con gái
  rationale: Giữ nguyên việc nguyên văn nêu rõ cả con trai lẫn con gái, thay vì khái quát thành “các con”.
