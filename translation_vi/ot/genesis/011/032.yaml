  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc tự nhiên của tiếng Việt thay cho việc giữ nguyên thành ngữ Hê-bơ-rơ “các ngày của…”, nhưng bảo toàn đầy đủ nội dung câu.
