  text: The days of Terah were two hundred and five years, and Terah died in Haran.
translation:
  language: vi
  text: Tê-ra sống được hai trăm lẻ năm năm, rồi chết tại Cha-ran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: Tê-ra sống được
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các ngày của Tê-ra là”, một thành ngữ chỉ tổng số năm sống. Cách dịch này tự nhiên trong tiếng Việt và phù hợp với lời tổng kết gia phả.
- source_word: תֶרַח
  choice: Tê-ra
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: hai trăm lẻ năm năm
  rationale: Chuyển trật tự số đếm Hê-bơ-rơ sang cách nói chuẩn, tự nhiên trong tiếng Việt.
- source_word: וַיָּמָת
  choice: rồi qua đời
  rationale: Diễn đạt tự nhiên, trang trọng trong tiếng Việt; từ nguồn trực tiếp nói đến cái chết, và “qua đời” vẫn truyền đạt rõ nghĩa ấy.
- source_word: בְּחָרָן
  choice: tại Cha-ran
  rationale: Giới từ בְּ chỉ địa điểm; “tại” phù hợp tự nhiên với nơi một người qua đời.
