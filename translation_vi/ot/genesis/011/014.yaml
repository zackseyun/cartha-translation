  text: Sê-lách sống được ba mươi năm thì làm cha của Ê-be[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể phiên là “Sa-la”; bản Hê-bơ-rơ tại đây chép “Sê-lách.”
