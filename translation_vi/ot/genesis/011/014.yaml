lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: Sê-lách
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ שֶׁלַח theo cách đọc gần âm gốc; giữ cách phân biệt với dạng truyền thống Sa-la.
- source_word: חַי שְׁלֹשִׁים שָׁנָה
  choice: sống được ba mươi năm
  rationale: Công thức gia phả diễn tả tuổi đã đạt tới trước sự kiện tiếp theo; cách nói này tự nhiên trong tiếng Việt và sát cấu trúc Hê-bơ-rơ.
- source_word: וַ/יּוֹלֶד
  choice: thì sinh
  rationale: Dạng Hiphil của ילד trong gia phả chỉ việc người nam sinh ra hoặc làm cha của người con; “sinh” là cách diễn đạt ngắn gọn, quen thuộc trong gia phả tiếng Việt.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ xác định, không có từ tương đương độc lập cần thể hiện trong tiếng Việt.
- source_word: עֵבֶר
  choice: Ê-be
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ עֵבֶר, gần với âm gốc hơn dạng Hê-be theo truyền thống.
