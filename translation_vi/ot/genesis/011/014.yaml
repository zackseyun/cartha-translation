  - severity: low
    issue: Cách diễn đạt trong hai chú thích tên riêng chưa chính xác về tính chất của các dạng thay thế
    rationale: Sa-la và Hê-be là các cách phiên âm/truyền thống thay thế, không nhất thiết là những tên mà nhân vật “cũng được gọi là.”
