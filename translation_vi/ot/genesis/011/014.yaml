  terminology: Các dạng tên Sê-lách và Ê-be phản ánh trực tiếp tiếng Hê-bơ-rơ. Chú thích nên nói là các cách phiên âm thay thế, thay vì “được gọi là,” để không hàm ý đây là những tên khác biệt.
