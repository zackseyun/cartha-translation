  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi sinh ra Sê-lách, A-rơ-pác-sát sống thêm 403 năm và sinh con trai, con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, động từ diễn tả quãng đời tiếp tục sau khi người con được sinh ra; “sống thêm” tự nhiên và làm rõ quan hệ thời gian.
- source_word: אַרְפַּכְשַׁד
  choice: Ác-pắc-sát
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ ʾArpakhshad theo cách đọc dễ hiểu đối với độc giả Việt hiện đại.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֶׁלַח
  choice: Sau khi sinh Sê-lách
  rationale: Giữ nguyên quan hệ thời gian của cấu trúc Hê-bơ-rơ; “sinh” trong ngữ cảnh gia phả nói tự nhiên về việc người nam sinh ra con.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 năm
  rationale: Đảo trật tự số theo cú pháp tiếng Việt hiện đại nhưng bảo toàn chính xác con số của bản Hê-bơ-rơ.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: và sinh các con trai, con gái
  rationale: Giữ chi tiết bản gốc nêu rõ cả con trai lẫn con gái, thay vì khái quát thành “các con”.
