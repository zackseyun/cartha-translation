  register: Văn phong gia phả ngắn gọn, trang trọng nhưng tự nhiên trong tiếng Việt hiện đại. Dùng “sống thêm” để tránh lối đặt thành phần câu gượng gạo khi bám sát trật tự Hê-bơ-rơ.
