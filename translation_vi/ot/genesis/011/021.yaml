  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: vi
  text: Sau khi sinh Sê-rúc, Rê-u sống thêm hai trăm lẻ bảy năm và có thêm con trai và con gái.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống thêm
  rationale: Trong công thức gia phả, động từ חיה có nghĩa là “sống”; thêm “thêm” diễn đạt tự nhiên việc khoảng thời gian này tiếp nối sau khi Sê-rúc ra đời.
- source_word: רְעוּ
  choice: Rê-u
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang cách viết dễ đọc và quen thuộc trong tiếng Việt.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: Sau khi sinh Sê-rúc
  rationale: Hiphil của ילד với chủ thể nam trong gia phả chỉ việc người cha sinh ra/làm cha của người con; “sinh” là cách diễn đạt gọn, tự nhiên trong gia phả tiếng Việt.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: hai trăm lẻ bảy năm
  rationale: Chuyển trật tự số của tiếng Hê-bơ-rơ sang trật tự tự nhiên trong tiếng Việt; “lẻ” giúp số 207 rõ ràng và trang trọng.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: và sinh các con trai, con gái
  rationale: Giữ rõ cả hai nhóm hậu duệ được nguyên văn nêu đích danh, thay vì khái quát thành “con cái”.
