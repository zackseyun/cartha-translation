translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc gia phả súc tích. Dùng “Sê-rúc” và “Rê-u” theo lối phiên âm tiếng Việt; câu được sắp xếp lại tự nhiên mà không làm mất thông tin của nguyên văn.
