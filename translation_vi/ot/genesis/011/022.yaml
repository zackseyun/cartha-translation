  language: vi
  text: Sê-rúc sống được ba mươi năm thì sinh Na-cô.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: sống được
  rationale: Động từ חיה ở dạng tự sự, mở đầu công thức tuổi tác trong gia phả; “sống được” tự nhiên trong tiếng Việt khi đi với số năm.
- source_word: שְׂרוּג
  choice: Sê-rúc
  rationale: Tên riêng được phiên âm theo cách dùng tiếng Việt phổ biến.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: ba mươi năm
  rationale: Cụm từ Hê-bơ-rơ diễn tả tuổi; trong kết cấu “sống được… năm” nghĩa tuổi tác rõ ràng và tự nhiên.
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Dạng Hiphil của ילד trong gia phả nói về việc người nam có con; “sinh” là cách diễn đạt ngắn gọn, quen thuộc trong công thức gia phả tiếng Việt mà không thêm chi tiết ngoài nguyên văn.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Tiểu từ đánh dấu tân ngữ trực tiếp, được thể hiện qua cú pháp tiếng Việt.
- source_word: נָחוֹר
  choice: Na-cô
  rationale: Tên riêng được phiên âm theo cách dùng tiếng Việt phổ biến.
