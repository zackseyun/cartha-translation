  text: And Abimelech said, “Look, my land is before you; settle wherever seems good in your eyes.”
translation:
  language: vi
  text: 'A-bi-mê-léc nói: “Này, đất của tôi ở trước mặt ông; ông hãy định cư ở nơi nào ông thấy tốt.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của lời nói trực tiếp, với sắc thái trang trọng và tự nhiên trong văn kể Kinh Thánh.
- source_word: אַרְצִי לְפָנֶיךָ
  choice: đất của tôi ở trước mặt ông
  rationale: Theo sát hình ảnh Hê-bơ-rơ về miền đất được đặt sẵn trước mặt Áp-ra-ham để ông lựa chọn.
- source_word: שֵׁב
  choice: hãy định cư
  rationale: Trong ngữ cảnh nói về việc chọn một nơi trong lãnh thổ để sống, động từ mang nghĩa cư trú hay định cư, không chỉ đơn thuần là ngồi.
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: ở nơi nào ông thấy là tốt
  rationale: Diễn đạt tự nhiên thành ngữ nguyên ngữ, đồng thời giữ tiêu chuẩn lựa chọn thuộc về nhận định của Áp-ra-ham.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” phù hợp lời một vị vua nói với một người đàn ông trưởng thành được kính trọng; giữ hình ảnh “ở trước mặt ông” thay vì diễn giải thành “tùy ông lựa chọn”.
