- from: 'Ông nói với Sa-ra: “Này, ta đã trao một ngàn miếng bạc cho anh của bà. Này, số bạc ấy là vật che mắt cho bà trước tất cả những người ở cùng bà[a]; và trước mặt mọi người, bà được minh oan[b].”'
