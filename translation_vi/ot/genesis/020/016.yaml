  rationale: Bản sửa thay “trước tất cả” bằng “đối với tất cả” để không biến giới từ לְ thành một quan hệ không gian cụ thể trong chính văn. Khả năng hiểu theo nghĩa công khai vẫn được bảo lưu trong chú thích. “Một nghìn” chuẩn hóa cách viết số lượng; các điểm khó còn lại, đặc biệt “vật che mắt” và mệnh đề וְנֹכָחַת, được giữ với mức độ dè dặt thích hợp.
