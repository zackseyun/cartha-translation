source:
  edition: WLC
  text: וּ/לְ/שָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֨סֶף֙ לְ/אָחִ֔י/ךְ הִנֵּ֤ה הוּא לָ/ךְ֙ כְּס֣וּת עֵינַ֔יִם לְ/כֹ֖ל אֲשֶׁ֣ר אִתָּ֑/ךְ וְ/אֵ֥ת כֹּ֖ל וְ/נֹכָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: vi
  text: 'Ông nói với Sa-ra: “Này, ta đã trao một nghìn miếng bạc cho anh của bà. Này, số bạc ấy là vật che mắt cho bà, đối với tất cả những người ở cùng bà[a]; và trước mặt mọi người, bà được minh oan[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một vật che mắt cho bà trước mặt tất cả những người ở cùng bà”. Thành ngữ Hê-bơ-rơ khó hiểu này có thể chỉ một khoản bồi thường công khai nhằm che phủ sự xúc phạm và phục hồi danh dự cho Sa-ra.
    reason: lexical_alternative
  - marker: b
    text: Hay “bà được giải oan”, “bà bị khiển trách”, hoặc “sự việc được giải quyết trước mặt mọi người”. Mệnh đề Hê-bơ-rơ cuối câu rất khó và đã được hiểu theo nhiều cách.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: một ngàn miếng bạc
  rationale: Nguyên văn là “một ngàn bạc”, không nêu rõ đơn vị. “Miếng bạc” diễn đạt tự nhiên một khoản bạc mà không thêm đơn vị siếc-lơ hay giả định đó là tiền đúc.
- source_word: לְאָחִיךְ
  choice: cho anh của bà
  rationale: Giữ nguyên cách gọi “anh” trong tiếng Hê-bơ-rơ, qua đó bảo toàn sự liên hệ với lời Sa-ra đã nhận Áp-ra-ham là anh mình và sắc thái trớ trêu của trình thuật.
- source_word: כְּסוּת עֵינַיִם
  choice: vật che mắt
  rationale: Đây là một thành ngữ khó hiểu. Cách dịch tương đối sát giữ lại hình ảnh của nguyên văn thay vì quyết định dứt khoát rằng đó là sự bồi thường, sự che đậy lỗi xúc phạm hay việc phục hồi danh dự.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: trước tất cả những người ở cùng bà
  rationale: Giới từ לְ có thể được hiểu là “cho/đối với”, nhưng trong ngữ cảnh này cụm từ có sắc thái công khai; “trước” diễn đạt tự nhiên rằng cử chỉ ấy được thực hiện trước những người thuộc đoàn của Sa-ra.
- source_word: וְאֵת כֹּל
  choice: và trước mặt mọi người
  rationale: Cụm từ bị tỉnh lược và khó phân tích cú pháp. Cách dịch này hiểu nó là sự mở rộng phạm vi công khai từ những người ở cùng Sa-ra đến mọi người.
- source_word: וְנֹכָחַת
  choice: bà được minh oan
  rationale: Dạng Niphal của יכח tại đây có thể chỉ việc được chứng tỏ là đúng hay được giải oan. “Được minh oan” phù hợp với hành động bồi thường công khai, đồng thời cách hiểu khác được ghi ở chú thích.
theological_decisions:
- issue: Ý nghĩa của mệnh đề cuối וְנֹכָחַת
  choice: bà được minh oan
  alternative: bà bị khiển trách; sự việc được giải quyết trước mặt mọi người
  rationale: Ngữ cảnh nhấn mạnh việc A-bi-mê-léc công khai trao bạc để đáp lại điều đã xảy ra với Sa-ra, nên ý được giải oan hợp với diễn tiến câu chuyện. Tuy nhiên, hình thái và cú pháp khó, vì vậy không loại bỏ các cách hiểu khác mà nêu chúng trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông/bà” phù hợp với lời đối thoại giữa A-bi-mê-léc và Sa-ra; lặp “Này” để giữ cấu trúc הִנֵּה hai lần. Các hình ảnh và điểm khó của nguyên văn được giữ trong chính văn, còn những cách hiểu chính được nêu ở chú thích.
