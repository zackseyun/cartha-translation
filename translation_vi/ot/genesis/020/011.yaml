  terminology: “lòng kính sợ Đức Chúa Trời” giữ được thành ngữ Kinh Thánh và trọng lượng đạo đức–tôn giáo của יִרְאַת אֱלֹהִים. Chú thích thay thế “lòng tôn kính Đức Chúa Trời” là khả dĩ và không áp đặt diễn giải giáo phái.
  issues:
