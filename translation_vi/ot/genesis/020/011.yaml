  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין יִרְאַ֣ת אֱלֹהִ֔ים בַּ/מָּק֖וֹם הַ/זֶּ֑ה וַ/הֲרָג֖וּ/נִי עַל דְּבַ֥ר אִשְׁתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: vi
  text: 'Áp-ra-ham đáp: “Vì tôi đã nói rằng: ‘Chắc chắn nơi này không có lòng kính sợ Đức Chúa Trời[a], nên họ sẽ giết tôi vì vợ tôi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng tôn kính Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Dẫn vào lời giải thích của Áp-ra-ham về hành động trước đó; cách dịch nhân quả này tự nhiên trong tiếng Việt.
- source_word: אָמַרְתִּי
  choice: tôi đã nghĩ
  rationale: Nghĩa cơ bản là “tôi đã nói”, nhưng trong ngữ cảnh đây là lời tự nhủ hoặc suy tính nội tâm; “tôi đã nghĩ” truyền đạt đúng dụng ý trong tiếng Việt hiện đại.
- source_word: רַק
  choice: Chắc chắn
  rationale: Ở đây từ này nhấn mạnh điều Áp-ra-ham cho là đúng, thay vì mang nghĩa hạn định theo lối máy móc là “chỉ”.
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: không có lòng kính sợ Đức Chúa Trời
  rationale: Giữ thành ngữ Kinh Thánh về sự kính sợ Đức Chúa Trời cùng ý nghĩa luân lý và tôn giáo, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: nơi này
  rationale: Cách dịch trực tiếp, gọn và tự nhiên của cụm từ chỉ địa điểm.
- source_word: וַהֲרָגוּנִי
  choice: nên họ sẽ giết tôi
  rationale: Liên từ được diễn đạt theo quan hệ hậu quả trong lập luận của Áp-ra-ham; động từ thể hiện hậu quả ông dự đoán.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: vì vợ tôi
  rationale: Thành ngữ có nghĩa “vì/cớ tại”; cách dịch này rõ ràng, tự nhiên và phù hợp ngữ cảnh.
theological_decisions:
- issue: Cách dịch יִרְאַת אֱלֹהִים
  choice: lòng kính sợ Đức Chúa Trời
  alternative: lòng tôn kính Đức Chúa Trời
  rationale: Bản dịch giữ hình ảnh “kính sợ” vốn có trong tiếng Hê-bơ-rơ và sức nặng luân lý–tôn giáo của thành ngữ, không thu hẹp nó thành sự tôn kính đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đáp” cho וַיֹּאמֶר theo ngữ cảnh đối thoại; giữ thành ngữ quen thuộc “kính sợ Đức Chúa Trời” nhưng thêm “lòng” để câu tiếng Việt tự nhiên.
