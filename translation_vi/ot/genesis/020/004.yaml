source:
  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: vi
  text: 'A-bi-mê-léc chưa đến gần bà[a], nên ông thưa: “Lạy Chúa, Ngài sẽ giết ngay cả một dân tộc công chính sao?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đến gần bà” là một thành ngữ Hê-bơ-rơ, trong ngữ cảnh này hàm ý rằng A-bi-mê-léc chưa quan hệ tình dục với Sa-ra.
    reason: cultural_note
  - marker: b
    text: Hay “một dân”. Từ Hê-bơ-rơ גּוֹי là danh từ tập hợp, chỉ một cộng đồng hoặc dân tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: đến gần bà
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ “đến gần bà”; trong ngữ cảnh, thành ngữ này hàm ý quan hệ tình dục, được giải thích trong chú thích.
- source_word: אֲדֹנָי
  choice: Lạy Chúa
  rationale: Đây là lời A-bi-mê-léc trực tiếp thưa với Đức Chúa Trời trong giấc mơ; “Lạy Chúa” tự nhiên, trang trọng và không thêm danh xưng không có trong nguyên văn.
- source_word: גּוֹי
  choice: dân tộc
  rationale: Danh từ tập hợp này chỉ một cộng đồng hay dân tộc; “dân tộc” giữ phạm vi tập thể trong lời cầu xin mà không thu hẹp thành riêng A-bi-mê-léc hoặc gia đình ông.
- source_word: גַּם
  choice: ngay cả
  rationale: Trong câu hỏi tu từ, từ này tạo sắc thái nhấn mạnh; “ngay cả” diễn đạt rõ hơn “cũng” đứng riêng.
- source_word: צַדִּיק
  choice: công chính
  rationale: Giữ liên hệ từ vựng với ý niệm công chính trong Kinh Thánh, đồng thời vẫn cho phép hiểu là không có tội trong sự việc đang được nói đến.
- source_word: תַּהֲרֹג
  choice: Ngài sẽ giết ... sao?
  rationale: Diễn đạt trực tiếp thể chưa hoàn thành trong câu hỏi tu từ, bằng tiếng Việt hiện đại và không dùng từ cổ.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: A-bi-mê-léc ... nên ông thưa
  rationale: Không thêm trạng từ thời gian không có trong nguyên văn; “nên” làm rõ quan hệ mạch văn giữa việc ông chưa đến gần bà và lời ông biện bạch.
theological_decisions:
- issue: Phạm vi tập thể của גּוֹי trong lời A-bi-mê-léc
  choice: một dân tộc công chính
  alternative: một dân vô tội; một gia đình vô tội
  rationale: Nguyên văn dùng danh từ tập hợp và tính từ “công chính”. Bản dịch giữ cả chiều kích tập thể lẫn sức căng thần học của lời tự nhận này, không quyết định chính xác cộng đồng ấy chỉ là gia đình hay toàn thể lãnh địa của vua.
translation_notes:
  register: 'Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cách xưng hô “ông thưa” và “Lạy Chúa, Ngài” phù hợp lời một vị vua nói với Đức Chúa Trời. Các dấu chú thích đã được đặt lại theo đúng nội dung: [a] giải thích thành ngữ “đến gần”, [b] ghi nhận cách dịch khác của “dân tộc”.'
