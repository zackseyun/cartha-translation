  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: vi
  text: Hơn nữa, nàng quả thật là chị/em gái tôi—là con gái của cha tôi, chứ không phải con gái của mẹ tôi—và nàng đã trở thành vợ tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: Hơn nữa
  rationale: Liên từ kèm tiểu từ bổ sung đưa ra một lý lẽ biện hộ thêm; “Hơn nữa” diễn đạt tự nhiên chức năng diễn ngôn này.
- source_word: אָמְנָה
  choice: quả thật
  rationale: Trạng từ này xác nhận lời nói là đúng; “quả thật” vừa trang trọng vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲחֹתִי
  choice: em gái tôi
  rationale: Trong ngữ cảnh Sa-ra là người nữ cùng cha và là vợ Áp-ra-ham; tiếng Việt cần chọn vai vế, và “em gái” phù hợp với quan hệ tuổi tác được trình bày trong Sáng Thế Ký.
- source_word: בַת אָבִי
  choice: con gái của cha tôi
  rationale: Giữ cách diễn đạt trực tiếp của tiếng Hê-bơ-rơ và cấu trúc song song với vế nói về người mẹ.
- source_word: הִוא
  choice: nàng ... là
  rationale: Mệnh đề danh từ tiếng Hê-bơ-rơ được chuyển sang hiện tại trong tiếng Việt; “nàng” phù hợp với lời người chồng nói về vợ trong văn phong trang trọng.
- source_word: אַךְ לֹא
  choice: nhưng không phải
  rationale: Diễn đạt sự giới hạn và đối lập của אַךְ לֹא mà không làm mạnh thành ý loại trừ tuyệt đối ngoài văn cảnh.
- source_word: בַת אִמִּי
  choice: con gái của mẹ tôi
  rationale: Bảo toàn sự cân xứng với “con gái của cha tôi” và nêu rõ quan hệ khác mẹ.
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: rồi nàng trở thành vợ tôi
  rationale: Động từ היה trong kết cấu này chỉ việc bước vào quan hệ hôn nhân; “trở thành vợ tôi” giữ sắc thái sự kiện, còn “rồi” chuyển tiếp tự nhiên từ quan hệ huyết thống sang hôn nhân.
theological_decisions:
- issue: Mức độ quan hệ chị em được Áp-ra-ham khẳng định
  choice: Giữ nguyên lời khẳng định rằng Sa-ra là con cùng cha nhưng khác mẹ
  alternative: Giải thích đây là cách gọi họ hàng rộng hơn hoặc tìm cách hòa giải với các truyền thống gia phả khác
  rationale: Câu Hê-bơ-rơ trình bày trực tiếp lời biện hộ của Áp-ra-ham; bản dịch không nên thêm một cách giải thích nhằm giải quyết căng thẳng gia phả hay đạo đức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “nàng” trong lời kể trực tiếp của Áp-ra-ham để tránh sắc thái quá khẩu ngữ của “cô ấy”; giữ các vế cân xứng và dấu gạch ngang để phản ánh phần giải thích chen giữa.
