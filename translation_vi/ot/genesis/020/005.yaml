  text: הֲ/לֹ֨א ה֤וּא אָֽמַר לִ/י֙ אֲחֹ֣תִ/י הִ֔וא וְ/הִֽיא גַם הִ֥וא אָֽמְרָ֖ה אָחִ֣/י ה֑וּא בְּ/תָם לְבָבִ֛/י וּ/בְ/נִקְיֹ֥ן כַּפַּ֖/י עָשִׂ֥יתִי זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: vi
  text: 'Chẳng phải chính ông ấy đã nói với con: “Cô ấy là chị/em gái tôi” sao? Và chính cô ấy cũng nói: “Ông ấy là anh/em trai tôi.” Con đã làm điều này với lòng ngay thẳng và đôi tay trong sạch.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với lòng trọn vẹn và đôi tay trong sạch.” Tiếng Hê-bơ-rơ dùng các thành ngữ đạo đức–pháp lý để chỉ sự chân thành và sự trong sạch khỏi can tội trong việc này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Chẳng phải ... sao?
  rationale: Diễn đạt tự nhiên trong tiếng Việt một câu hỏi tu từ mong đợi câu trả lời khẳng định.
- source_word: הוּא אָמַר לִי
  choice: chính ông ấy đã nói với con
  rationale: “Chính” bảo lưu sắc thái nhấn mạnh của đại từ độc lập הוּא; “với con” phản ánh לִי và hợp với lời A-bi-mê-léc thưa cùng Đức Chúa Trời.
- source_word: אֲחֹתִי הִוא
  choice: Cô ấy là em gái tôi
  rationale: Chuyển ngữ trực tiếp lời nhận quan hệ thân tộc; “em gái” tự nhiên và phù hợp quan hệ trong ngữ cảnh Sáng Thế Ký, dù tiếng Hê-bơ-rơ chỉ định nghĩa rộng là chị/em gái.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: Và chính cô ấy cũng nói
  rationale: Kết hợp “chính” và “cũng” để giữ cả sắc thái nhấn mạnh của đại từ lẫn ý bổ sung của גַם mà vẫn tự nhiên.
- source_word: אָחִי הוּא
  choice: Ông ấy là anh trai tôi
  rationale: Chuyển ngữ trực tiếp lời nhận quan hệ thân tộc; “anh trai” phù hợp ngữ cảnh, dù từ Hê-bơ-rơ có nghĩa rộng là anh/em trai.
- source_word: בְּתָם לְבָבִי
  choice: với tấm lòng ngay thẳng
  rationale: תָּם diễn tả sự trọn vẹn, liêm chính hay không chỗ trách; cách nói này truyền đạt sự chân thành về đạo đức mà không hàm ý vô tội tuyệt đối.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: và đôi tay vô tội
  rationale: Giữ hình ảnh pháp lý–đạo đức về “tay” là hành vi và trách nhiệm; נִקְיֹן ở đây biểu thị sự trong sạch hay vô tội.
- source_word: עָשִׂיתִי זֹאת
  choice: Con đã làm điều này
  rationale: Thì quá khứ hoàn thành của tiếng Việt diễn đạt tự nhiên hành động đã xảy ra mà A-bi-mê-léc đang biện hộ.
theological_decisions:
- issue: Thành ngữ đạo đức–pháp lý trong lời tự biện hộ của A-bi-mê-léc
  choice: “với tấm lòng ngay thẳng và đôi tay vô tội”
  alternative: “với lòng trọn vẹn và sự trong sạch của hai tay”
  rationale: Bản dịch giữ hai hình ảnh về nội tâm và hành vi, đồng thời giới hạn lời tuyên bố vô tội vào việc đang được xét trong ngữ cảnh, không biến nó thành lời khẳng định A-bi-mê-léc hoàn toàn vô tội trong mọi phương diện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” trong lời A-bi-mê-léc thưa với Đức Chúa Trời; “ông ấy/cô ấy” giúp lời trích dẫn tự nhiên. Dấu chú thích [a] được đặt sau toàn bộ cặp thành ngữ mà chú thích giải thích.
