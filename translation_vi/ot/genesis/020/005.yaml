revisions:
- from: 'Chẳng phải chính ông ấy đã nói với con: “Cô ấy là em gái tôi” sao? Và chính cô ấy cũng nói: “Ông ấy là anh trai tôi.” Con đã làm điều này với tấm lòng ngay thẳng và đôi tay vô tội.[a]'
  to: 'Chẳng phải chính ông ấy đã nói với con: “Cô ấy là chị/em gái tôi” sao? Và chính cô ấy cũng nói: “Ông ấy là anh/em trai tôi.” Con đã làm điều này với lòng ngay thẳng và đôi tay trong sạch.[a]'
  rationale: Sửa các từ thân tộc để không áp đặt thứ bậc tuổi tác không được nêu trong nguyên ngữ. Điều chỉnh thành ngữ thứ hai thành “đôi tay trong sạch” nhằm giữ sát hơn hình ảnh đạo đức–pháp lý của tiếng Hê-bơ-rơ. Chú thích vẫn được neo sau toàn bộ cặp thành ngữ và được diễn đạt để không ngụ ý A-bi-mê-léc tuyên bố mình vô tội tuyệt đối.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:06:36Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng câu hỏi tu từ, các đại từ nhấn mạnh, và lời tự biện hộ của A-bi-mê-léc. Tuy nhiên, אֲחוֹת/אָח chỉ quan hệ chị/em gái và anh/em trai, không xác định thứ bậc tuổi tác. Việc dịch cố định là “em gái” và “anh trai” thêm thông tin không có trong tiếng Hê-bơ-rơ.
  naturalness: Câu văn nhìn chung tự nhiên và phù hợp lời thưa với Đức Chúa Trời. “Với lòng ngay thẳng và đôi tay trong sạch” vừa tự nhiên vừa bảo lưu cặp thành ngữ nội tâm/hành vi rõ hơn “đôi tay vô tội.”
  terminology: Giữ “con” cho A-bi-mê-léc khi thưa cùng Đức Chúa Trời là phù hợp ngữ cảnh và văn phong Kinh Thánh tiếng Việt. Dùng “chị/em gái” và “anh/em trai” bảo toàn tính không xác định của từ thân tộc Hê-bơ-rơ. “Trong sạch” là tương đương trực tiếp, tự nhiên cho נִקְיוֹן trong thành ngữ đạo đức–pháp lý.
  issues:
  - severity: medium
    issue: “Em gái” và “anh trai” xác định tuổi tác mà nguyên ngữ không xác định.
    rationale: אֲחֹתִי và אָחִי có thể chỉ chị hoặc em gái, anh hoặc em trai. Dù ngữ cảnh rộng hơn có dữ liệu về quan hệ của Áp-ra-ham và Sa-ra, riêng lời trích dẫn và từ vựng của câu này không nêu thứ bậc; bản dịch nên giữ mơ hồ này.
  - severity: low
    issue: “Đôi tay vô tội” hơi kém sát hình ảnh ‘sự trong sạch của tay tôi’.
    rationale: Cách dịch hiện tại không sai, nhưng “đôi tay trong sạch” giữ hình ảnh ẩn dụ và trường nghĩa của נִקְיוֹן (sạch/trong sạch, không can tội) rõ hơn; ngữ cảnh vẫn giới hạn lời tự biện hộ vào hành vi đang nói đến.
