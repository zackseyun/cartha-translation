base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: vi
  text: 'Áp-ra-ham nói về Sa-ra, vợ mình[a]: “Bà ấy là chị/em gái tôi.” Rồi A-bi-mê-léc, vua Ghê-ra, sai người đến đem Sa-ra đi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát chữ: “nói với Sa-ra, vợ mình.” Tuy nhiên, ngữ cảnh thiên về nghĩa Áp-ra-ham nói về Sa-ra, vì lời được thuật lại là: “Bà ấy là chị/em gái tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “sai đi và lấy Sa-ra.” Câu Hê-bơ-rơ không nói rõ tại đây rằng A-bi-mê-léc lấy bà làm vợ.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל שָׂרָה אִשְׁתּוֹ
  choice: Áp-ra-ham nói về Sa-ra, vợ mình
  rationale: Dù אֶל thường có nghĩa là “với/đến”, trong ngữ cảnh này lời “Nàng là em gái tôi” là lời nói về Sa-ra. “Nói về” diễn đạt tự nhiên ý ấy, đồng thời ghi nhận cách hiểu sát chữ trong chú thích.
- source_word: אֲחֹתִי הִוא
  choice: Nàng là em gái tôi
  rationale: Mệnh đề danh từ được chuyển thành câu tiếng Việt tự nhiên. Tiếng Việt thường phải xác định chị hay em; Sáng Thế Ký 20:12 cho biết Sa-ra là con gái của cha Áp-ra-ham, nên “em gái” phù hợp với ngữ cảnh.
- source_word: וַיִּשְׁלַח
  choice: sai người đến
  rationale: Động từ nghĩa đen là “sai/gửi đi”; tác nhân được sai không nêu rõ. Thêm “người” như thành phần hàm ẩn giúp câu tiếng Việt rõ nghĩa mà không xác định họ là ai.
- source_word: מֶלֶךְ גְּרָר
  choice: vua Ghê-ra
  rationale: Bảo toàn chuỗi sở thuộc chỉ chức vị và lãnh địa của A-bi-mê-léc bằng cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: đón Sa-ra về
  rationale: לקח cơ bản là “lấy/đem”. Trong sự kết hợp “sai ... rồi lấy”, câu nói đến việc nhà vua cho người đưa Sa-ra về với mình; “đón ... về” tự nhiên hơn trong tiếng Việt, còn nghĩa đen được giữ trong chú thích.
theological_decisions:
- issue: Mức độ diễn giải hành động của A-bi-mê-léc
  choice: đón Sa-ra về
  alternative: lấy Sa-ra làm vợ
  rationale: Bản văn chỉ nói nhà vua “sai” rồi “lấy/đem” Sa-ra, không nói rõ ngay trong câu này rằng ông lấy bà làm vợ. Bản dịch tránh bổ sung ý thần học hoặc pháp lý vượt quá câu Hê-bơ-rơ.
- issue: Đối tượng lời nói của Áp-ra-ham
  choice: nói về Sa-ra
  alternative: nói với Sa-ra
  rationale: Giới từ אֶל cho phép cách hiểu sát chữ là “với”, nhưng nội dung ở ngôi thứ ba “Nàng là em gái tôi” và mạch truyện thiên về một lời tuyên bố nói về Sa-ra. Chú thích bảo tồn khả năng còn lại.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dùng các tên phiên âm quen thuộc trong tiếng Việt. “Nàng” giúp lời trích dẫn tự nhiên và phân biệt rõ Sa-ra là người được nhắc đến. Các chú thích bảo tồn sự mơ hồ của giới từ אֶל và sự ngắn gọn của cụm “sai và lấy” trong nguyên văn.
