  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל אֲבִימֶ֖לֶךְ בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִנְּ/ךָ֥ מֵת֙ עַל הָ/אִשָּׁ֣ה אֲשֶׁר לָקַ֔חְתָּ וְ/הִ֖וא בְּעֻ֥לַת בָּֽעַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: vi
  text: 'Nhưng Đức Chúa Trời đến với A-bi-mê-léc trong một giấc mơ vào ban đêm và phán với ông: “Này, ngươi chắc chắn sẽ chết[a] vì người phụ nữ mà ngươi đã lấy, bởi nàng đã có chồng[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “Này, ngươi là người chết”; cũng có thể hiểu là “ngươi sắp chết.” Cách nói Hê-bơ-rơ nhấn mạnh cái chết chắc chắn và cận kề.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “nàng là người thuộc về một người chồng,” nghĩa là nàng đã có chồng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đến với
  rationale: Động từ בוא trong mạch kể diễn tả Đức Chúa Trời hiện đến với A-bi-mê-léc trong giấc mơ; cách dịch này không hàm ý một sự di chuyển thể lý vào địa điểm nào.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: ban đêm ... trong một giấc mơ
  rationale: Diễn đạt tự nhiên bằng tiếng Việt, đồng thời giữ rõ cả phương tiện mặc khải là giấc mơ và thời điểm ban đêm.
- source_word: הִנְּךָ מֵת
  choice: Này, ngươi chắc chắn sẽ chết
  rationale: Cấu trúc với הִנֵּה và phân từ מֵת báo trước cái chết chắc chắn, cận kề. Tiếng Việt khó giữ nguyên hình thức hiện tại mà không gây hiểu lầm rằng A-bi-mê-léc đã chết, nên dùng tương lai kèm 'chắc chắn' và chú thích dị bản sát chữ.
- source_word: עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ
  choice: vì người phụ nữ mà ngươi đã lấy
  rationale: עַל nêu nguyên nhân của án chết; לקח được giữ ở nghĩa rộng 'lấy', không tự ý thêm sắc thái cưỡng đoạt hay xác định quan hệ hôn nhân với A-bi-mê-léc.
- source_word: בְּעֻלַת בָּעַל
  choice: nàng đã có chồng
  rationale: Cách nói tự nhiên và trang trọng trong tiếng Việt, truyền đạt tình trạng hôn nhân hiện hữu của người phụ nữ mà không mang sắc thái sở hữu quá mức.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít và văn mạch truyện Áp-ra-ham xác định đây là Đức Chúa Trời, không phải một thần hay nhiều thần.
theological_decisions:
- issue: Sắc thái thời và mức độ chắc chắn của הִנְּךָ מֵת
  choice: ngươi chắc chắn sẽ chết
  alternative: này, ngươi là người chết / ngươi coi như đã chết
  rationale: Nguyên ngữ để mở khả năng hình thức hiện tại hoặc lời tuyên án về cái chết cận kề. Bản chính ưu tiên ý nghĩa cảnh báo chắc chắn, còn chú thích bảo tồn lối dịch sát chữ và sự căng thẳng về thời.
- issue: Ý nghĩa của בְּעֻלַת בָּעַל
  choice: nàng đã có chồng
  alternative: nàng là người thuộc về một người chồng / nàng là phụ nữ có chồng
  rationale: Cụm Hê-bơ-rơ nhấn mạnh rằng nàng đang ở trong mối quan hệ hôn nhân. Cách dịch chính tránh biến cách diễn đạt pháp lý-cổ thành khẳng định thần học rộng hơn về quyền sở hữu.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời và “ngươi” trong lời cảnh cáo trực tiếp. Thêm “vua” để đại từ quy chiếu tự nhiên trong tiếng Việt; tước vị này phù hợp với nhân vật A-bi-mê-léc trong văn mạch, nhưng không làm thay đổi nội dung mệnh đề.
