revisions:
- from: 'Nhưng ban đêm, Đức Chúa Trời đến với A-bi-mê-léc trong một giấc mơ và phán với vua: “Này, ngươi chắc chắn sẽ chết[a] vì người phụ nữ mà ngươi đã lấy, bởi nàng đã có chồng[b].”'
