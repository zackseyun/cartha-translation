base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: vi
  text: 'Khi Đức Chúa Trời khiến tôi phải phiêu bạt khỏi nhà cha tôi[a], tôi nói với nàng: ‘Đây là lòng nhân từ nàng phải dành cho tôi[b]: bất cứ nơi nào chúng ta đến, hãy nói về tôi: “Người ấy là anh trai tôi.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khiến tôi phải lưu lạc” hoặc “làm cho tôi phiêu bạt”. Động từ Hê-bơ-rơ mang nghĩa gây khiến và có thể chỉ việc lang bạt hoặc lạc đường; ở đây, trọng tâm là rời nhà và đi đây đó, không nhất thiết là lầm lạc về đạo đức.'
    reason: lexical_alternative
  - marker: b
    text: “Lòng nhân từ” dịch từ tiếng Hê-bơ-rơ hesed, tùy ngữ cảnh cũng có thể mang nghĩa tình yêu thành tín hoặc lòng trung thành nhân hậu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: khiến tôi phải phiêu bạt
  rationale: Giữ lực khiến khiến của thể Hiphil, đồng thời diễn đạt sự rời quê và sống không ổn định mà không mặc nhiên hàm ý lầm lạc về đạo đức.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Dù hình thái là số nhiều, ngữ cảnh chỉ Đức Chúa Trời của Áp-ra-ham; cách dịch số ít phù hợp với sở chỉ.
- source_word: מִבֵּית אָבִי
  choice: khỏi nhà cha tôi
  rationale: Giữ hình ảnh gia đình–xã hội của thành ngữ Hê-bơ-rơ, với cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: חַסְדֵּךְ
  choice: lòng nhân từ nàng phải dành cho tôi
  rationale: Trong lời yêu cầu giữa hai người, “lòng nhân từ” diễn đạt tự nhiên ý nghĩa của חֶסֶד là sự tử tế, nhân hậu hay lòng thành tín; động từ “dành cho” kết hợp tự nhiên với danh từ này.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: nàng phải dành cho tôi
  rationale: Chuyển cách nói sát chữ “làm với tôi” thành tiếng Việt tự nhiên, đồng thời giữ tính chất yêu cầu rõ ràng.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: bất cứ nơi nào chúng ta đến
  rationale: Truyền đạt ý phân bố đến từng nơi họ tới, tự nhiên hơn trong tiếng Việt mà không làm mất nội dung.
- source_word: אִמְרִי לִי
  choice: hãy nói về tôi rằng
  rationale: Trong ngữ cảnh, Sa-ra phải nói với người khác về Áp-ra-ham; “về tôi rằng” làm rõ quan hệ này mà vẫn gần cấu trúc nguồn.
- source_word: אָחִי הוּא
  choice: Người ấy là anh trai tôi
  rationale: Giữ nghĩa trực tiếp “anh/em trai”; vì Áp-ra-ham là nam và lớn tuổi hơn Sa-ra theo mạch truyện, “anh trai” là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Chủ thể khiến Áp-ra-ham phiêu bạt
  choice: Đức Chúa Trời khiến Áp-ra-ham phải phiêu bạt khỏi nhà cha mình
  alternative: Đức Chúa Trời cho phép Áp-ra-ham phiêu bạt; các thần khiến ông phiêu bạt
  rationale: Bản Hê-bơ-rơ đặt אֱלֹהִים làm chủ thể của động từ gây khiến. Bản dịch giữ nguyên tác nhân thần linh và sự căng thẳng thần học, không làm nhẹ thành “cho phép”, nhưng dùng “phiêu bạt” để tránh gán ý lầm lạc đạo đức không do ngữ cảnh đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” trong lời Áp-ra-ham kể lại để phù hợp giọng kể Kinh Thánh mà không quá cổ; giữ trực tiếp tác nhân của Đức Chúa Trời và cấu trúc lời trích dẫn.
