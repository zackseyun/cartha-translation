  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán với ông trong giấc mơ ấy[a]: “Đúng vậy, chính Ta biết ngươi đã làm điều này với tấm lòng ngay thẳng. Chính Ta cũng đã ngăn ngươi phạm tội chống lại Ta. Vì thế, Ta không để ngươi chạm đến bà ấy[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong một giấc mơ”; tuy nhiên, mạo từ trong tiếng Hê-bơ-rơ nghiêng về giấc mơ cụ thể đang được nói đến.
    reason: lexical_alternative
  - marker: b
    text: “Chạm đến bà ấy” là cách nói kín đáo, trong ngữ cảnh này chỉ quan hệ tình dục.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: trong giấc mộng
  rationale: Mạo từ gắn với danh từ hướng đến giấc mộng cụ thể đang được thuật lại; “giấc mộng” giữ sắc thái trang trọng, tự nhiên trong văn kể Kinh Thánh.
- source_word: גַּם אָנֹכִי ... גַּם אָנֹכִי
  choice: Phải, chính Ta ... Chính Ta cũng
  rationale: Cách dịch này giữ sự nhấn mạnh và sự lặp lại của đại từ אָנֹכִי, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: בְתָם לְבָבְךָ
  choice: với tấm lòng ngay thẳng
  rationale: תֹּם chỉ sự toàn vẹn, ngay thẳng; cách dịch này không đẩy nghĩa xa đến chỗ tuyên bố hoàn toàn vô tội về mặt pháp lý.
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: đã ngăn con
  rationale: חָשַׂךְ trong cấu trúc này diễn tả việc giữ lại hoặc ngăn không cho thực hiện hành động.
- source_word: מֵחֲטוֹא לִי
  choice: phạm tội chống lại Ta
  rationale: מִן với động từ nguyên mẫu diễn tả sự ngăn khỏi hành động; לִי trong ngữ cảnh đạo đức xác định Đức Chúa Trời là Đấng bị xúc phạm bởi tội ấy.
- source_word: לֹא נְתַתִּיךָ
  choice: Ta không để con
  rationale: נָתַן đi với động từ nguyên mẫu ở đây mang nghĩa cho phép; “không để” là cách nói tiếng Việt hiện đại và rõ ràng.
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: chạm đến bà ấy
  rationale: Giữ cách nói kín đáo của nguyên văn; trong ngữ cảnh, cụm này hàm chỉ quan hệ tình dục.
theological_decisions:
- issue: Ý nghĩa của “phạm tội chống lại Ta” trong lời Đức Chúa Trời
  choice: Hành vi được mô tả là tội chống lại Đức Chúa Trời.
  alternative: Chỉ diễn đạt chung là xúc phạm Đức Chúa Trời hoặc mắc tội trước mặt Ngài.
  rationale: Đại từ לִי xác định rõ chiều kích hướng về Đức Chúa Trời của tội dự tính, nhưng bản dịch không thêm một hệ thống giáo lý ngoài điều câu văn nói.
- issue: Mối quan hệ giữa ý định ngay thẳng của A-bi-mê-léc và sự ngăn giữ của Đức Chúa Trời
  choice: 'Giữ cả hai lời khẳng định cạnh nhau: ông hành động với lòng ngay thẳng, và Đức Chúa Trời đã ngăn ông phạm tội.'
  alternative: Giải thích một yếu tố như nguyên nhân loại trừ hoặc làm suy yếu yếu tố kia.
  rationale: Nguyên văn duy trì sự căng thẳng giữa động cơ con người và hành động ngăn giữ của Đức Chúa Trời; không nên tự ý giải quyết theo một lập trường thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” trong lời Đức Chúa Trời phán với A-bi-mê-léc để thể hiện quan hệ ngôi vị rõ ràng mà không quá cổ; “bà ấy” phù hợp với việc nhắc đến Sa-ra là một phụ nữ trưởng thành. Mọi dấu chú thích đều xuất hiện trong chính văn.
