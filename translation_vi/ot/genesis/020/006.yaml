  terminology: Giữ “Đức Chúa Trời”, “phạm tội chống lại Ta”, và cách nói uyển ngữ “chạm đến bà ấy”. “Tấm lòng ngay thẳng” phản ánh tốt בְּתָם לְבָבְךָ mà không khẳng định sự vô tội tuyệt đối.
