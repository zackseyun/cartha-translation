translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng các dạng tên quen thuộc trong Kinh Thánh tiếng Việt: A-bi-mê-léc, Áp-ra-ham và Sa-ra. Câu giữ cấu trúc tuần tự của tiếng Hê-bơ-rơ, đồng thời nêu rõ Áp-ra-ham là người chồng để tránh nhập nhằng đại từ trong tiếng Việt.'
