base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: vi
  text: Sau đó, A-bi-mê-léc lấy chiên[a], bò, các nô lệ nam và nữ[b], rồi trao cho Áp-ra-ham; ông cũng trả Sa-ra, vợ của Áp-ra-ham, lại cho Áp-ra-ham.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có thể chỉ chung gia súc nhỏ, gồm cả chiên và dê.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các đầy tớ nam và nữ”; tuy nhiên, việc họ được trao cùng với gia súc cho thấy địa vị nô lệ nổi bật trong ngữ cảnh này.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch là: “ông cũng hoàn lại Sa-ra, vợ của Áp-ra-ham, cho Áp-ra-ham.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Động từ לקח có nghĩa cơ bản là “lấy”; cách dịch này giữ nguyên trình tự kể chuyện mà không thêm ý “mang đến” vốn không được nói rõ.
- source_word: צֹאן
  choice: chiên
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, có thể bao gồm chiên và dê. “Chiên” là cách diễn đạt ngắn gọn, quen thuộc khi đi đôi với “bò”; phạm vi rộng hơn được ghi ở chú thích.
- source_word: בָקָר
  choice: bò
  rationale: בָקָר chỉ chung gia súc thuộc loài bò; “bò” là từ tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: các nô lệ nam và nữ
  rationale: Hai từ phân biệt người lệ thuộc nam và nữ. Trong ngữ cảnh họ được chuyển giao cùng với gia súc, “nô lệ” phản ánh rõ địa vị xã hội hơn “đầy tớ”, đồng thời vẫn giữ sự phân biệt giới tính.
- source_word: וַיִּתֵּן
  choice: trao cho
  rationale: נתן có nghĩa là “cho”. “Trao cho” tự nhiên trong ngữ cảnh chuyển giao các tài sản và con người đã liệt kê, không hàm ý nghi lễ đặc biệt.
- source_word: וַיָּשֶׁב
  choice: trả ... lại
  rationale: Dạng Hiphil của שוב mang nghĩa khiến trở về, tức hoàn trả. Cụm “trả ... lại” diễn đạt tự nhiên hành động đưa Sa-ra trở về với Áp-ra-ham.
- source_word: אִשְׁתּוֹ
  choice: vợ của Áp-ra-ham
  rationale: Hậu tố sở hữu quy chiếu về Áp-ra-ham. Nêu lại tên ông giúp tiếng Việt tránh hiểu lầm Sa-ra là vợ của A-bi-mê-léc.
- source_word: לּוֹ
  choice: cho ông ấy
  rationale: Đại từ quy chiếu về Áp-ra-ham. “Ông ấy” giữ hình thức đại từ của nguyên văn, còn cụm ngay trước đó làm rõ người được nói đến.
