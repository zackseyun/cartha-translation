  to: Sau đó, A-bi-mê-léc lấy chiên[a], bò, các nô lệ nam và nữ[b], rồi trao cho Áp-ra-ham; ông cũng trả Sa-ra, vợ của Áp-ra-ham, lại cho Áp-ra-ham.[c]
