base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: vi
  text: Từ đó, Áp-ra-ham lên đường về phía Nê-ghép[a]. Ông cư ngụ giữa Ca-đe và Su-rơ, và sống như một kiều dân tại Ghê-ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “về phía nam”. Từ Hê-bơ-rơ có thể chỉ vùng phía nam mang tên Nê-ghép hoặc hướng nam nói chung; bản chính giữ cách hiểu có khả năng là địa danh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: lên đường
  rationale: Động từ נסע ở thể qal trong mạch kể diễn tả việc rời một nơi để đi tiếp; “lên đường” tự nhiên trong tiếng Việt và giữ được chuyển động của câu chuyện.
- source_word: מִשָּׁם
  choice: Từ đó
  rationale: Cụm từ chỉ nơi chốn, quy chiếu về địa điểm trước đó của Áp-ra-ham; “Từ đó” ngắn gọn và tự nhiên.
- source_word: אַרְצָה הַנֶּגֶב
  choice: về phía Nê-ghép
  rationale: Hậu tố chỉ hướng trên אַרְצָה diễn tả chuyển động về phía một vùng. הַנֶּגֶב có thể là địa danh Nê-ghép hoặc chỉ hướng nam; bản chính giữ nghĩa địa lý có khả năng hơn.
- source_word: וַיֵּשֶׁב
  choice: cư ngụ
  rationale: ישב ở đây nói đến việc ở lại trong một khu vực. “Cư ngụ” trang trọng vừa phải, tự nhiên và không nhất thiết hàm ý định cư vĩnh viễn.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: giữa Ca-đe và Su-rơ
  rationale: Cụm từ xác định vị trí địa lý giữa hai địa danh; các tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: וַיָּגָר
  choice: sống như một kiều dân
  rationale: גור diễn tả việc cư trú với tư cách người ngoài hoặc người tạm trú. Cách dịch này truyền đạt sắc thái pháp lý-xã hội rõ hơn “ở tạm” và dễ hiểu hơn từ cổ “kiều ngụ”.
- source_word: בִּגְרָר
  choice: tại Ghê-ra
  rationale: Giới từ בְּ có nghĩa chỉ địa điểm; “tại Ghê-ra” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “sống như một kiều dân” để giữ sắc thái cư trú với tư cách người ngoài của גור; tách thành hai câu nhằm tránh chuỗi liên từ nặng nề mà vẫn bảo toàn trình tự và quan hệ địa lý của nguyên văn.
