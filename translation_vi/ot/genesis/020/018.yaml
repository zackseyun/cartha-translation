revisions:
- from: Vì Đức Giê-hô-va đã đóng chặt mọi dạ con trong gia đình A-bi-mê-léc vì cớ Sa-ra,[a] vợ của Áp-ra-ham.
  to: Vì Yahweh đã đóng chặt[a] mọi dạ con trong nhà A-bi-mê-léc vì Sa-ra, vợ Áp-ra-ham.
  rationale: 'Bản sửa giữ nguyên nghĩa nguồn: câu này giải thích câu trước; Yahweh là tác nhân; việc đóng dạ con được nhấn mạnh; phạm vi là toàn thể hộ gia A-bi-mê-léc; nguyên nhân là Sa-ra, vợ Áp-ra-ham. Sửa danh riêng theo chuẩn POB, dùng «nhà» cho hộ gia, và chuyển neo chú thích đến đúng cụm động từ được giải thích.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:06:44Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng quan hệ nhân quả, hành động trực tiếp của YHWH, phạm vi «mọi dạ con», và lý do liên hệ đến Sa-ra. Tuy nhiên, danh YHWH nên theo quyết định POB là «Yahweh», không thay bằng dạng «Đức Giê-hô-va».
  naturalness: «Đóng chặt mọi dạ con trong gia đình A-bi-mê-léc» có thể hiểu được, nhưng «trong nhà A-bi-mê-léc» tự nhiên hơn cho בֵּית trong ngữ cảnh một hộ gia. Dấu chú thích hiện neo sau «Sa-ra» dù chú thích giải thích động từ mở đầu câu; cần đặt tại «đóng chặt».
  terminology: Giữ «dạ con» để phản ánh רֶחֶם cụ thể và giữ tên riêng Việt hóa nhất quán. Dùng «Yahweh» để phản ánh trực tiếp יהוה và nhất quán với audit trail của POB.
  issues:
  - severity: medium
    issue: Danh יהוה được dịch là «Đức Giê-hô-va».
    rationale: Nguồn dùng Tetragrammaton, và quyết định thuật ngữ POB cho phân đoạn này quy định cách thể hiện là «Yahweh». «Đức Giê-hô-va» là một truyền thống phiên âm khác, không khớp quyết định dự án.
  - severity: medium
    issue: Chú thích [a] được neo vào «Sa-ra» nhưng nội dung giải thích עָצֹר עָצַר («đã đóng chặt»).
    rationale: Neo chú thích phải đặt ngay sau từ/cụm từ mà nó giải thích; vị trí hiện tại có thể khiến độc giả hiểu nhầm chú thích liên quan đến Sa-ra.
  - severity: low
    issue: «gia đình A-bi-mê-léc» có thể thu hẹp nghĩa của בֵּית.
    rationale: «Nhà A-bi-mê-léc» là cách nói tự nhiên, bao quát hộ gia/quyến thuộc, và gần với nghĩa «household» hơn.
  revised_text: Vì Yahweh đã đóng chặt[a] mọi dạ con trong nhà A-bi-mê-léc vì Sa-ra, vợ Áp-ra-ham.
  revised_footnotes:
