  text: כִּֽי עָצֹ֤ר עָצַר֙ יְהוָ֔ה בְּעַ֥ד כָּל רֶ֖חֶם לְ/בֵ֣ית אֲבִימֶ֑לֶךְ עַל דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: vi
  text: Vì Yahweh đã đóng chặt[a] mọi dạ con trong nhà A-bi-mê-léc vì Sa-ra, vợ Áp-ra-ham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã đóng hẳn” hoặc “đã thật sự đóng.” Tiếng Hê-bơ-rơ dùng nguyên thể tuyệt đối cùng gốc với động từ hữu hạn để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Liên từ mở đầu nêu nguyên nhân, giải thích cho việc chữa lành và sinh con ở câu trước.
- source_word: עָצֹר עָצַר
  choice: đã đóng chặt
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh mức độ hoặc tính chắc chắn của hành động; “đóng chặt” vừa tự nhiên vừa giữ hình ảnh cụ thể.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: mọi dạ con trong gia đình A-bi-mê-léc
  rationale: Diễn đạt phạm vi tác động trong toàn gia đình A-bi-mê-léc; “dạ con” giữ hình ảnh thân thể cụ thể của רֶחֶם, còn בֵּית chỉ gia đình/gia quyến chứ không đơn thuần là ngôi nhà.
- source_word: עַל דְּבַר
  choice: vì cớ
  rationale: Cụm từ mang nghĩa nguyên nhân trong ngữ cảnh phán xét này; cách nói trang trọng, rõ nghĩa.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: vợ của Áp-ra-ham
  rationale: Chuyển chuỗi sở hữu sang cú pháp tiếng Việt tự nhiên, đồng thời giữ quan hệ nhận diện quan trọng trong trình thuật.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Giữ đây là danh riêng, không đổi thành tước hiệu “CHÚA”; “Đức Giê-hô-va” là dạng quen thuộc trong tiếng Việt hiện đại và có sắc thái tôn kính.
- issue: Tác nhân của tình trạng không sinh con
  choice: Nêu trực tiếp Đức Giê-hô-va là Đấng đóng mọi dạ con
  alternative: Diễn đạt giảm nhẹ rằng Đức Giê-hô-va chỉ cho phép tình trạng ấy xảy ra
  rationale: Bản Hê-bơ-rơ trực tiếp quy hành động cho יְהוָה; bản dịch không làm nhẹ đi sự căng thẳng thần học của lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh cụ thể “mọi dạ con,” dùng tên riêng theo dạng Việt hóa có gạch nối; dấu chú thích đặt ngay sau “Sa-ra” để phản ánh lớp tham khảo tiếng Anh, dù nội dung chú thích giải thích cụm động từ ở đầu câu.
