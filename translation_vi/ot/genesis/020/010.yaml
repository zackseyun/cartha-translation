base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: vi
  text: 'Rồi A-bi-mê-léc nói với Áp-ra-ham[a]: “Ông đã thấy gì mà làm điều này?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông đã nghĩ gì mà làm điều này?” Nguyên văn Hê-bơ-rơ là “Ông đã thấy gì...?”, trong đó “thấy” có thể được dùng theo nghĩa điều một người nhận thấy, suy tính hoặc nhắm đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... hỏi
  rationale: Dạng kể chuyện với waw nối tiếp đưa trình thuật tiến lên; “Rồi” diễn đạt tự nhiên tính kế tiếp. Vì lời nói trực tiếp là một câu hỏi, “hỏi” phù hợp ngữ cảnh hơn “nói với” mà không thay đổi nội dung.
- source_word: אֲבִימֶלֶךְ
  choice: A-bi-mê-léc
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: אֶל־אַבְרָהָם
  choice: hỏi Áp-ra-ham
  rationale: Giới từ אֶל chỉ người tiếp nhận lời nói; cấu trúc tiếng Việt với động từ “hỏi” không cần dịch riêng giới từ.
- source_word: מָה רָאִיתָ
  choice: Ông đã thấy gì
  rationale: Giữ hình ảnh nguyên văn “thấy” và đại từ xưng hô lịch sự phù hợp cuộc đối thoại; thành ngữ có thể chỉ điều người ta nhận thấy, suy tính hoặc nhắm đến, nên ghi chú phương án diễn ý.
- source_word: כִּי
  choice: mà
  rationale: Trong cấu trúc nghi vấn này, “mà” nối điều đã thấy/nghĩ với hành động xảy ra, tự nhiên trong tiếng Việt và không buộc כִּי mang nghĩa nguyên nhân trực tiếp.
- source_word: עָשִׂיתָ
  choice: làm
  rationale: Động từ thông dụng, sát nghĩa cơ bản của עשה trong ngữ cảnh hành động đã xảy ra.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: điều này
  rationale: דָּבָר ở đây chỉ sự việc hay hành động vừa được nói đến; “điều này” tự nhiên và trung tính hơn “việc làm này,” vốn có thể tăng sắc thái phán xét.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cách nói giàu hình ảnh của nguyên văn trong câu chính, đồng thời giải thích nghĩa thành ngữ ở chú thích. Dùng “ông” để lời chất vấn tự nhiên mà vẫn lịch sự.
