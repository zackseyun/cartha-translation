  text: וַ/יִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל הָ/אֱלֹהִ֑ים וַ/יִּרְפָּ֨א אֱלֹהִ֜ים אֶת אֲבִימֶ֧לֶךְ וְ/אֶת אִשְׁתּ֛/וֹ וְ/אַמְהֹתָ֖י/ו וַ/יֵּלֵֽדוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: vi
  text: Rồi Áp-ra-ham cầu nguyện với Đức Chúa Trời, và Đức Chúa Trời chữa lành cho A-bi-mê-léc, vợ ông cùng các nữ tỳ[a] của ông; rồi họ sinh con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể chỉ các nữ nô lệ.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “và họ sinh con”; trong văn cảnh, đây là điều xảy ra sau khi Đức Chúa Trời chữa lành họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: cầu nguyện
  rationale: Dạng Hitpael của פלל ở đây có nghĩa thông thường là “cầu nguyện”. Ngữ cảnh cho thấy Áp-ra-ham cầu thay cho A-bi-mê-léc, nhưng động từ không tự nó buộc phải dịch là “cầu thay”.
- source_word: אֶל הָאֱלֹהִים / אֱלֹהִים
  choice: với Đức Chúa Trời / Đức Chúa Trời
  rationale: Trong ngữ cảnh, אֱלֹהִים chỉ Đức Chúa Trời chân thật. Cụm “cầu nguyện với Đức Chúa Trời” tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיִּרְפָּא
  choice: chữa lành
  rationale: Giữ nghĩa trực tiếp của רפא, đồng thời không xác định quá mức bản chất của sự đau yếu; câu kế tiếp giải thích việc các dạ con bị đóng lại.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: A-bi-mê-léc
  rationale: Phiên âm tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: אִשְׁתּוֹ
  choice: vợ ông
  rationale: Đại từ “ông” quy chiếu tự nhiên về A-bi-mê-léc.
- source_word: אַמְהֹתָיו
  choice: các nữ tỳ
  rationale: אָמה chỉ những phụ nữ ở địa vị tôi tớ hoặc nô lệ. “Nữ tỳ” ngắn gọn, có sắc thái trang trọng và giữ được cả giới tính lẫn địa vị phục dịch; chú thích nêu rõ khả năng chỉ nữ nô lệ.
- source_word: וַיֵּלֵדוּ
  choice: rồi họ sinh con
  rationale: ילד có nghĩa là sinh hoặc sinh con. “Rồi” giữ quan hệ tiếp nối của waw mà không biến nó thành một mệnh đề mục đích hay kết quả được đánh dấu rõ hơn nguyên văn.
theological_decisions:
- issue: Quan hệ giữa động từ cuối câu và sự chữa lành
  choice: 'Dịch theo trình tự: “rồi họ sinh con”.'
  alternative: “nhờ đó họ sinh con” hoặc “để họ sinh con”
  rationale: Ngữ cảnh cho thấy việc sinh con là kết quả của sự chữa lành, nhưng liên từ Hê-bơ-rơ chỉ trực tiếp trình bày diễn tiến. “Rồi” bảo toàn trình tự và để người đọc nhận ra quan hệ kết quả từ ngữ cảnh, không giải quyết quá mức sự hàm ý.
- issue: Sắc thái địa vị xã hội của אָמָה
  choice: Dùng “các nữ tỳ” trong chính văn và giải thích trong chú thích.
  alternative: “các nữ đầy tớ” hoặc “các nữ nô lệ”
  rationale: Từ Hê-bơ-rơ có thể chỉ nữ tỳ hoặc nữ nô lệ. Chính văn dùng cách gọi tự nhiên, trang trọng, còn chú thích bảo lưu sắc thái xã hội mạnh hơn.
- issue: Chủ thể số nhiều của וַיֵּלֵדוּ
  choice: Dùng “họ” và để nguyên phạm vi quy chiếu theo văn cảnh.
  alternative: Nêu cụ thể “vợ và các nữ tỳ của ông”
  rationale: Dạng số nhiều giống cái trong tiếng Hê-bơ-rơ quy chiếu đến những phụ nữ vừa được nhắc đến. Đại từ “họ” tự nhiên trong tiếng Việt và không cần lặp lại toàn bộ danh ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “rồi” để kể diễn tiến tự nhiên; dùng dấu chấm phẩy nhằm làm rõ chủ thể “họ” là vợ và các nữ tỳ của A-bi-mê-léc, không phải gồm cả A-bi-mê-léc.
