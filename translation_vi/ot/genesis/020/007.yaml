  - severity: medium
    issue: «sẽ phải chết»
    rationale: Cấu trúc nguyên mẫu tuyệt đối + động từ hữu hạn nhấn mạnh sự chắc chắn («chắc chắn sẽ chết»), không phải nghĩa vụ hay sự cưỡng bách hàm trong «phải».
