source:
  edition: WLC
  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: vi
  text: Vậy thì, hãy trả vợ của người ấy lại, vì người ấy là một nhà tiên tri. Người ấy sẽ cầu nguyện cho ngươi, và ngươi sẽ sống. Nhưng nếu ngươi không trả nàng lại, hãy biết rằng ngươi cùng mọi người thuộc về ngươi[a] chắc chắn sẽ chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngươi và mọi sự thuộc về ngươi” hoặc “ngươi và tất cả những gì ngươi có.” Cách diễn đạt Hebrew có nghĩa rộng, có thể bao gồm cả người trong gia thuộc lẫn mọi thứ thuộc về A-bi-mê-léc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Diễn đạt dấu hiệu chuyển ý vừa có sắc thái thời gian vừa dẫn đến mệnh lệnh khẩn cấp.
- source_word: הָשֵׁב
  choice: hãy trả ... lại
  rationale: Dạng mệnh lệnh Hifil của שוב đòi hỏi hoàn trả người vợ về với người chồng; cách nói này tự nhiên trong tiếng Việt.
- source_word: אֵשֶׁת הָאִישׁ
  choice: vợ của người ấy
  rationale: Giữ quan hệ sở hữu rõ ràng của cụm cấu tạo Hebrew mà vẫn tự nhiên trong tiếng Việt.
- source_word: כִּי נָבִיא הוּא
  choice: vì người ấy là một nhà tiên tri
  rationale: כִּי nêu lý do cho mệnh lệnh; נָבִיא được dịch theo nghĩa trực tiếp là nhà tiên tri.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: Người ấy sẽ cầu nguyện cho ngươi
  rationale: Yiqtol được hiểu theo sắc thái tương lai/hệ quả; בַּעַד biểu thị cầu nguyện thay mặt hoặc vì lợi ích của người nghe.
- source_word: וֶחְיֵה
  choice: và ngươi sẽ được sống
  rationale: Trong chuỗi mệnh đề này, hình thức mệnh lệnh mang ý nghĩa kết quả. Cách dịch tránh làm mất khả năng rằng mạng sống được bảo toàn nhờ lời cầu nguyện.
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: Nhưng nếu ngươi không trả nàng lại
  rationale: Chuyển cấu trúc phủ định với phân từ thành động từ hữu hạn tự nhiên; 'nàng' được bổ sung từ đối tượng đã nêu rõ trong ngữ cảnh.
- source_word: דַּע כִּי מוֹת תָּמוּת
  choice: hãy biết chắc rằng ... sẽ phải chết
  rationale: דַּע là mệnh lệnh cảnh báo; cấu trúc nguyên mẫu tuyệt đối cộng động từ hữu hạn nhấn mạnh tính chắc chắn của cái chết.
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: ngươi và mọi người thuộc về ngươi
  rationale: Trong bối cảnh phán xét cả nhà, cách dịch ưu tiên những người trong gia thuộc, đồng thời chú thích tính rộng của biểu thức Hebrew.
theological_decisions:
- issue: Phạm vi của lời phán xét trong אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: ngươi và mọi người thuộc về ngươi
  alternative: ngươi và mọi sự thuộc về ngươi / ngươi và tất cả những gì ngươi có
  rationale: Bối cảnh gần nói đến tác động trên cả nhà A-bi-mê-léc, nên cách dịch hướng đến các thành viên và người lệ thuộc trong gia đình. Chú thích bảo lưu phạm vi rộng hơn của nguyên văn thay vì loại trừ tài sản một cách võ đoán.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ngươi” để phản ánh lời phán trực tiếp, nghiêm trọng của Đức Chúa Trời trong bối cảnh cổ đại; tránh từ ngữ giáo phái. Dùng “nhà tiên tri” là thuật ngữ Kinh Thánh quen thuộc nhưng vẫn phổ thông.
