  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/אַבְרָהָ֗ם וַ/יֹּ֨אמֶר ל֜/וֹ מֶֽה עָשִׂ֤יתָ לָּ֨/נוּ֙ וּ/מֶֽה חָטָ֣אתִי לָ֔/ךְ כִּֽי הֵבֵ֧אתָ עָלַ֛/י וְ/עַל מַמְלַכְתִּ֖/י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: vi
  text: 'Bấy giờ, A-bi-mê-léc gọi Áp-ra-ham đến và nói với ông: “Ông đã làm gì chúng tôi vậy? Tôi đã phạm tội gì đối với ông,[a] mà ông lại gây ra một tội lớn cho tôi và vương quốc tôi? Ông đã làm với tôi những điều không nên làm.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi đã xúc phạm ông thế nào?”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “những việc người ta không làm.” Trong văn cảnh, câu này hàm ý những việc không được xem là đúng hoặc được phép làm.'
    reason: source_idiom
lexical_decisions:
- source_word: וַיִּקְרָא ... לְאַבְרָהָם
  choice: gọi Áp-ra-ham đến
  rationale: Động từ קרא đi với לְ và tên người có nghĩa là gọi hoặc triệu người ấy đến. Cách dịch này tự nhiên trong tiếng Việt và không nhấn quá mức sắc thái hành chính của “triệu tập”.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: Ông đã làm gì chúng tôi vậy?
  rationale: Giữ nguyên câu hỏi trực tiếp và sắc thái trách cứ; “vậy” truyền đạt tự nhiên sức nặng tu từ của lời chất vấn trong tiếng Việt hiện đại.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: Tôi đã phạm tội gì với ông
  rationale: חטא chỉ hành vi phạm tội hoặc xúc phạm một người. “Phạm tội gì với ông” giữ được sức nặng luân lý của từ gốc mà vẫn tự nhiên.
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי חֲטָאָה גְדֹלָה
  choice: ông lại khiến tôi và vương quốc tôi mang tội lớn
  rationale: Dạng khiến của בוא diễn tả việc làm cho tội lớn giáng trên hoặc gắn với A-bi-mê-léc và vương quốc ông. “Khiến… mang tội lớn” rõ nghĩa trong tiếng Việt, đồng thời giữ ý trách nhiệm và hậu quả luân lý.
- source_word: מַמְלַכְתִּי
  choice: vương quốc tôi
  rationale: מַמְלָכָה ở đây chỉ lãnh thổ hoặc cộng đồng thuộc quyền vua; “vương quốc” là cách gọi chuẩn, rõ ràng.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: những điều không nên làm
  rationale: Cấu trúc bị động diễn tả những việc trái với điều được xã hội và luân lý chấp nhận, không chỉ những việc trên thực tế ít xảy ra. “Không nên làm” chuyển tải sắc thái chuẩn mực đó.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: Ông đã làm với tôi
  rationale: Thành ngữ עשה עם diễn tả cách một người đối xử hoặc hành động với người khác. Cách dịch này giữ liên kết với bổ ngữ “những điều không nên làm”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời chất vấn trực tiếp của một vị vua. Đại từ “tôi–ông” giữ sự nghiêm nghị mà không tạo sắc thái cổ kính không cần thiết.
