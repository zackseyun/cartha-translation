  naturalness: Cần thay “phạm tội gì với ông” bằng “phạm tội gì đối với ông” để tiếng Việt hiện đại tự nhiên và rõ quan hệ hơn. Các câu còn lại có giọng điệu trang trọng, trực tiếp, phù hợp với lời quở trách của một vị vua.
