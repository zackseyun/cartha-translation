base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: vi
  text: Sáng sớm, A-bi-mê-léc dậy, gọi tất cả các tôi tớ mình đến và nói cho họ nghe tất cả những điều này; những người đàn ông ấy vô cùng sợ hãi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: sáng sớm ... thức dậy
  rationale: Cụm Híp-ri diễn tả việc dậy sớm vào buổi sáng; cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái khẩn trương.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: gọi tất cả các tôi tớ mình đến
  rationale: קרא ל trong ngữ cảnh này là gọi hoặc triệu tập; עֲבָדָיו chỉ những người phục vụ thuộc hoàng gia, không nhất thiết nhấn mạnh thân phận nô lệ.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה בְּאָזְנֵיהֶם
  choice: kể cho họ nghe mọi việc ấy
  rationale: Thành ngữ nghĩa đen là 'nói mọi lời/việc ấy vào tai họ'; bản dịch diễn đạt tự nhiên ý ông thuật lại toàn bộ sự việc để họ trực tiếp nghe.
- source_word: הָאֲנָשִׁים
  choice: những người này
  rationale: Danh từ Híp-ri là số nhiều giống đực và trong mạch văn quy chiếu đến các tôi tớ vừa được gọi; 'những người này' giữ liên kết rõ ràng mà không thêm một nhóm mới.
- source_word: וַיִּירְאוּ ... מְאֹד
  choice: vô cùng sợ hãi
  rationale: Ở đây ירא chỉ nỗi sợ trước điều vừa được thuật lại, còn מְאֹד tăng cường mức độ; cách diễn đạt tiếng Việt vừa chính xác vừa tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Dùng 'tôi tớ' để phản ánh vai trò phục vụ trong hoàng gia mà không mặc nhiên xác định thân phận nô lệ; không cần chú thích vì câu tiếng Việt đã giữ đủ ý và không có dị bản hay hàm ý thần học cần giải thích.
