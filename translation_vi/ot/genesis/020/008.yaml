revisions:
- from: Vì vậy, sáng sớm A-bi-mê-léc thức dậy, gọi tất cả các tôi tớ mình đến và kể cho họ nghe mọi việc ấy; những người này vô cùng sợ hãi.
  to: Sáng sớm, A-bi-mê-léc dậy, gọi tất cả các tôi tớ mình đến và nói cho họ nghe tất cả những điều này; những người đàn ông ấy vô cùng sợ hãi.
