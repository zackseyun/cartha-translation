  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: vi
  text: 'Rồi A-bi-mê-léc truyền lệnh cho toàn dân rằng: “Ai đụng đến người đàn ông này hoặc vợ ông ấy thì chắc chắn sẽ bị xử tử.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Động từ צוה ở thể piel diễn tả việc ban một mệnh lệnh có thẩm quyền; “truyền lệnh” tự nhiên và giữ được sắc thái này.
- source_word: כָּל הָעָם
  choice: toàn dân
  rationale: עם ở đây chỉ toàn thể dân chúng dưới quyền A-bi-mê-léc, không nhất thiết mang nghĩa một dân tộc; “toàn dân” vừa gọn vừa bao quát.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dùng từ dẫn lời trực tiếp tự nhiên trong tiếng Việt, thay cho cách dịch máy móc là “nói rằng” sau động từ “truyền lệnh”.
- source_word: הַנֹּגֵעַ
  choice: ai đụng đến
  rationale: Phân từ có mạo từ được dùng theo nghĩa khái quát, tức “người nào/ai”; “đụng đến” giữ nghĩa cơ bản của נגע mà không tự ý nâng thành “làm hại”.
- source_word: בָּאִישׁ הַזֶּה
  choice: người đàn ông này
  rationale: Giới từ ב đánh dấu đối tượng của hành động נגע; “người đàn ông này” chuyển tải rõ danh từ איש và đại từ chỉ định.
- source_word: וּבְאִשְׁתּוֹ
  choice: hoặc vợ ông ấy
  rationale: Trong phạm vi điều kiện cấm, ו nối hai đối tượng thay thế nên tiếng Việt tự nhiên dùng “hoặc”; אשתו trong ngữ cảnh có nghĩa là “vợ ông ấy”.
- source_word: מוֹת יוּמָת
  choice: chắc chắn sẽ bị xử tử
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hophal nhấn mạnh tính chắc chắn của hình phạt; “bị xử tử” bảo toàn sắc thái bị động và tư pháp, thay vì chỉ nói “sẽ chết”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ động từ “đụng đến” để không giải nghĩa quá mức thành tấn công hay làm hại; tên riêng được phiên âm theo lối quen dùng trong tiếng Việt.
