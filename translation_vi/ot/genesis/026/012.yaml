    issue: Danh יהוה được dịch là «Đức Giê-hô-va» thay vì «Yahweh».
    rationale: Hồ sơ nguồn và quyết định thuật ngữ POB chỉ định phiên âm Yahweh cho Tetragrammaton. Việc thay bằng Giê-hô-va làm bản Việt không nhất quán với chuẩn danh riêng đã chọn.
  - severity: low
    issue: «Gieo giống» và cách giải thích «một trăm suất/phần» kém tự nhiên.
    rationale: «Gieo hạt» là cách nói canh tác thông dụng hơn. «Suất/phần» không phải cách diễn đạt sáng rõ về năng suất trong tiếng Việt và có nguy cơ tạo cảm giác đây là một đơn vị xác định, trong khi cách hiểu chính xác của שְׂעָרִים vẫn không hoàn toàn chắc chắn.
