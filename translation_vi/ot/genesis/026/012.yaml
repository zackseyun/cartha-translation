  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: vi
  text: Y-sác gieo hạt trong xứ ấy, và ngay năm đó ông thu được gấp trăm lần[a]. Đức Yahweh ban phước cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ông thu được một trăm phần.” Tiếng Hê-bơ-rơ nói sát chữ: “ông tìm thấy một trăm שְׂעָרִים”; đây là một cách nói về sản lượng đặc biệt dồi dào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: gieo giống
  rationale: Động từ זרע trong ngữ cảnh nông nghiệp chỉ việc gieo hạt; “gieo giống” tự nhiên và giữ nguyên hình ảnh canh tác.
- source_word: בָּאָרֶץ הַהִוא
  choice: trong xứ ấy
  rationale: אֶרֶץ ở đây chỉ vùng đất nơi Y-sác đang cư ngụ và canh tác; “xứ ấy” vừa sát nghĩa vừa phù hợp văn phong tường thuật.
- source_word: וַיִּמְצָא
  choice: thu được
  rationale: Nghĩa cơ bản là “tìm thấy”, nhưng trong ngữ cảnh mùa màng, động từ diễn tả kết quả Y-sác nhận được; “thu được” truyền đạt thành ngữ tự nhiên mà không thu hẹp thành riêng hành động gặt.
- source_word: בַּשָּׁנָה הַהִוא
  choice: ngay năm đó
  rationale: Cụm từ xác định chính năm ấy; “ngay năm đó” diễn đạt tự nhiên sự tương ứng giữa việc gieo và kết quả trong cùng năm.
- source_word: מֵאָה שְׁעָרִים
  choice: gấp trăm lần
  rationale: Đây là cách nói về sản lượng đặc biệt dồi dào. “Gấp trăm lần” rõ nghĩa trong tiếng Việt, đồng thời chú thích bảo lưu khả năng hiểu sát chữ là “một trăm suất/phần”.
- source_word: וַיְבָרֲכֵהוּ
  choice: ban phước cho ông
  rationale: ברך là động từ thông dụng chỉ việc ban phước; cách dịch này giữ nguyên lời quy nguồn sự thịnh vượng của Y-sác cho Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Đức Giê-hô-va” bảo lưu tính chất danh riêng và là hình thức dễ nhận biết trong tiếng Việt, không biến danh này thành một tước hiệu.
- issue: Cách diễn đạt kết quả mùa màng của Y-sác
  choice: ông thu được gấp trăm lần
  alternative: ông tìm thấy một trăm suất; ông gặt được gấp trăm lần
  rationale: “Thu được” phản ánh nghĩa theo ngữ cảnh của מצא mà vẫn gần với ý “đạt được/nhận được”; “gấp trăm lần” truyền tải cách nói về sản lượng nhưng chú thích giữ lại sự không chắc chắn của שְׁעָרִים.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng. Dùng “gieo giống” và “thu được” là các cách nói nông nghiệp tự nhiên; giữ chú thích để không che lấp sự mơ hồ của thành ngữ Hê-bơ-rơ.
