  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự và nội dung chính của tiếng Hê-bơ-rơ: Y-sác gieo, nhận sản lượng đặc biệt trong chính năm ấy, rồi được YHWH ban phước. Tuy nhiên, «Đức Giê-hô-va» không nhất quán với quyết định đã nêu trong hồ sơ POB là phiên âm יהוה là «Yahweh». «Gieo hạt» cũng là cách nói nông nghiệp trực tiếp và tự nhiên hơn «gieo giống».'
