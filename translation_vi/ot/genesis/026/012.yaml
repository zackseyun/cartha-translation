  terminology: Giữ «Y-sác» là nhất quán với hệ thống phiên âm đang dùng. Danh יהוה nên là «Yahweh» theo quyết định thuật ngữ POB. «Ban phước» bảo toàn động từ ברך và sắc thái thần học của nguyên văn.
  issues:
