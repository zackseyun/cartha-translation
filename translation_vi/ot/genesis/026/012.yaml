- from: Y-sác gieo giống trong xứ ấy, và ngay năm đó ông thu được gấp trăm lần[a]. Đức Giê-hô-va ban phước cho ông.
  to: Y-sác gieo hạt trong xứ ấy, và ngay năm đó ông thu được gấp trăm lần[a]. Đức Yahweh ban phước cho ông.
