  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: vi
  text: Tất cả các giếng mà các tôi tớ của cha ông đã đào vào thời Áp-ra-ham, cha ông, người Phi-li-tin đã bịt lại và lấp đầy chúng bằng đất.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: Tất cả các giếng
  rationale: כָל mang nghĩa bao quát “tất cả”; וְ nối câu với mạch kể trước đó nhưng không cần dịch thành một trạng từ thời gian. “Các giếng” là cách diễn đạt tự nhiên và chính xác.
- source_word: אֲשֶׁר חָפְרוּ
  choice: mà ... đã đào
  rationale: Mệnh đề quan hệ bổ nghĩa cho “các giếng”; “đã đào” cho thấy hành động này xảy ra trước việc người Phi-li-tin lấp giếng.
- source_word: עַבְדֵי אָבִיו
  choice: những người phục vụ của cha ông
  rationale: עֶבֶד có thể chỉ người phục vụ hoặc nô lệ. Ngữ cảnh này không nhấn mạnh thân phận nô lệ, nên cách dịch trung tính “người phục vụ” vừa tự nhiên vừa giữ được phạm vi nghĩa.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: trong thời Áp-ra-ham, cha ông
  rationale: Giữ cả khung thời gian của thành ngữ בִּימֵי và sự nhắc lại quan hệ cha con trong tiếng Hê-bơ-rơ.
- source_word: סִתְּמוּם פְּלִשְׁתִּים
  choice: đều bị người Phi-li-tin lấp lại
  rationale: Đổi sang cấu trúc bị động giúp câu tiếng Việt tự nhiên hơn với cụm danh từ dài đứng đầu, đồng thời vẫn xác định rõ người Phi-li-tin là tác nhân. “Lấp lại” phù hợp với hành động làm cho giếng không còn sử dụng được.
- source_word: וַיְמַלְאוּם עָפָר
  choice: bằng đất
  rationale: עָפָר trong ngữ cảnh này là đất dùng để đổ đầy giếng. “Lấp lại bằng đất” diễn đạt gọn, rõ cả việc làm tắc và vật liệu được dùng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ tên riêng “Áp-ra-ham” và “Phi-li-tin” theo dạng quen thuộc trong tiếng Việt; không thêm diễn giải thần học hay xã hội ngoài văn bản.
