- from: Tất cả các giếng mà những người phục vụ của cha ông đã đào trong thời Áp-ra-ham, cha ông, đều bị người Phi-li-tin lấp lại bằng đất.
  to: Tất cả các giếng mà các tôi tớ của cha ông đã đào vào thời Áp-ra-ham, cha ông, người Phi-li-tin đã bịt lại và lấp đầy chúng bằng đất.
  rationale: Sửa để bảo toàn hai vị từ hành động trong tiếng Hê-bơ-rơ, nêu rõ các giếng là đối tượng của cả hai hành động, và tránh hàm ý «lại» không có trong nguồn. Không cần chú thích vì «đất» là cách dịch tự nhiên, đủ rộng cho עָפָר trong ngữ cảnh này.
