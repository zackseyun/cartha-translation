base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/033.yaml
  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: vi
  text: Ông gọi giếng ấy là Si-ba[a]. Vì thế, tên của thành là Bê-e Sê-ba cho đến ngày nay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Si-ba có âm gần với từ Hê-bơ-rơ nghĩa là “bảy” và có liên hệ với lối chơi chữ trong tên Bê-e Sê-ba. Tên này có thể được hiểu là “Giếng Bảy” hoặc “Giếng Lời Thề”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: Ông gọi giếng ấy là
  rationale: Động từ קרא trong công thức đặt tên có nghĩa là “gọi/đặt tên”. Đại từ giống cái chỉ về cái giếng ở câu trước; nêu lại “giếng ấy” giúp tiếng Việt rõ và tự nhiên.
- source_word: שִׁבְעָה
  choice: Si-ba
  rationale: Giữ đây là tên riêng bằng cách phiên âm, thay vì thu hẹp lối chơi chữ tiếng Hê-bơ-rơ thành riêng “bảy” hoặc “lời thề”.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ kết quả và giải thích giữa tên giếng với tên thành.
- source_word: שֵׁם הָעִיר
  choice: tên của thành
  rationale: Chuyển sát cấu trúc sở hữu của nguyên văn, với văn phong kể chuyện trang trọng mà dễ hiểu.
- source_word: בְּאֵר שֶׁבַע
  choice: Bê-e Sê-ba
  rationale: Phiên âm địa danh theo âm Hê-bơ-rơ và giữ ý nghĩa nhiều lớp của tên trong chú thích.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: cho đến ngày nay
  rationale: Cách diễn đạt tiếng Việt tự nhiên, tương ứng trực tiếp với công thức thời gian trong nguyên văn.
theological_decisions:
- issue: Lối chơi chữ trong các tên שִׁבְעָה và בְּאֵר שֶׁבַע
  choice: Giữ tên riêng trong chính văn và giải thích cả hai liên tưởng “bảy” và “lời thề” ở chú thích.
  alternative: Dịch tên thành “Bảy”, “Lời Thề”, “Giếng Bảy” hoặc “Giếng Lời Thề”.
  rationale: Nguyên văn duy trì một lối chơi chữ có thể gợi cả số bảy lẫn lời thề. Chỉ chọn một nghĩa trong chính văn sẽ giải quyết quá mức sự đa nghĩa và làm mất mối liên hệ với địa danh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể là Y-sác trong mạch văn; thêm “giếng” để làm rõ đối tượng của đại từ giống cái trong nguyên văn. Các tên được phiên âm và lối chơi chữ được giữ trong chú thích.
