  source_fidelity: 'Chính văn truyền đạt đúng các yếu tố của tiếng Hê-bơ-rơ: Y-sác đặt tên cho cái giếng, tên là Si-ba; tên thành là Bê-e Sê-ba; và công thức thời gian “cho đến ngày nay.” Việc nêu rõ “giếng ấy” là hợp lý, vì đại từ giống cái trong nguyên văn quy về cái giếng ở câu trước.'
