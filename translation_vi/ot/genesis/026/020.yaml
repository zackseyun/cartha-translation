  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: vi
  text: 'Bấy giờ, những người chăn bầy ở Ghê-ra tranh chấp với những người chăn bầy của Y-sác và nói: “Nước là của chúng tôi.” Vì thế, ông đặt tên giếng là Ê-séc[a], vì họ đã tranh chấp với ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên “Ê-séc” có liên hệ với từ Hê-bơ-rơ mang nghĩa “tranh chấp” hoặc “tranh giành.”
    reason: Giải thích lối chơi chữ giữa tên giếng עֵשֶׂק và động từ cùng gốc trong câu.
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: tranh chấp
  rationale: Động từ ריב chỉ sự tranh cãi hoặc tranh chấp. Trong ngữ cảnh giành quyền sử dụng nước, “tranh chấp” tự nhiên và chính xác hơn “cãi nhau”.
- source_word: רֹעֵי גְרָר ... רֹעֵי יִצְחָק
  choice: những người chăn súc vật ở Ghê-ra ... những người chăn súc vật của Y-sác
  rationale: רֹעִים có thể chỉ người chăn chiên hoặc các đàn gia súc nói chung. “Người chăn súc vật” giữ được phạm vi nghĩa rộng và duy trì cấu trúc song song.
- source_word: לָנוּ הַמָּיִם
  choice: Nước này là của chúng tôi
  rationale: Cụm Hê-bơ-rơ rút gọn, sát nghĩa là “nước thuộc về chúng tôi”; thêm “này” giúp câu tiếng Việt tự nhiên trong lời khẳng định quyền sở hữu đối với nguồn nước tại giếng.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: ông đặt tên giếng
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “gọi tên của giếng”; đại từ “ông” theo mạch văn chỉ Y-sác.
- source_word: עֵשֶׂק
  choice: Ê-séc
  rationale: Giữ đây là tên riêng bằng cách phiên âm; mối liên hệ với danh từ mang nghĩa “tranh chấp” được giải thích trong chú thích.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: bởi họ đã gây tranh chấp với ông
  rationale: Động từ התעשׁק cùng gốc với tên עֵשֶׂק. Cụm “gây tranh chấp” vừa tự nhiên vừa phần nào tái hiện lối chơi chữ; “ông” chỉ Y-sác.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “người chăn súc vật” để tránh thu hẹp רֹעִים thành chỉ người chăn chiên; phiên âm tên riêng theo dạng quen thuộc trong tiếng Việt.
