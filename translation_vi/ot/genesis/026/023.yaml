  yaml_path: translation/ot/genesis/026/023.yaml
  text: From there he went up to Beersheba[a].
translation:
  language: vi
  text: Từ đó, ông đi lên Bê-e-sê-ba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng từ “đi lên”, một cách nói thông dụng về việc di chuyển, cũng có thể hàm ý đi lên nơi có độ cao lớn hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ông đi lên
  rationale: Động từ עלה có nghĩa cơ bản là “đi lên”. Trong trình thuật hành trình, từ này có thể chỉ việc đi tới một nơi cao hơn hoặc đơn giản là tiếp tục đi; “đi lên” giữ được sắc thái phương hướng và thành ngữ Hê-bơ-rơ.
- source_word: מִשָּׁם
  choice: từ đó
  rationale: Cụm từ chỉ việc rời địa điểm vừa được nhắc đến; “từ đó” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: בְּאֵר שָׁבַע
  choice: Bê-e-sê-ba
  rationale: Đây là địa danh nên được phiên âm thay vì dịch nghĩa; “Bê-e-sê-ba” là dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
