base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: vi
  text: 'Y-sác nói với họ[a]: “Tại sao các ông lại đến với tôi, trong khi các ông đã ghét tôi và đuổi tôi đi khỏi chỗ các ông?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và các ông đã ghét tôi và đuổi tôi đi khỏi chỗ các ông.” Liên từ Hí-bá-lai có nghĩa sát chữ là “và”, nhưng tại đây có thể mang sắc thái tương phản hoặc hoàn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Giữ động từ tường thuật thông dụng אָמַר; câu hỏi nằm trong lời nói trực tiếp nên không cần đổi thành “hỏi”.
- source_word: אֲלֵהֶם
  choice: với họ
  rationale: Diễn đạt tự nhiên đối tượng được nói với qua giới từ אֶל.
- source_word: יִצְחָק
  choice: Y-sác
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: מַדּוּעַ
  choice: Tại sao
  rationale: Cách hỏi nguyên nhân tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: בָּאתֶם אֵלַי
  choice: các ông đến với tôi
  rationale: Thể hoàn thành Hí-bá-lai chỉ việc họ đã đến và hiện đang có mặt; tiếng Việt không cần đánh dấu thì, còn “đến với tôi” giữ hướng của אֵלַי.
- source_word: וְאַתֶּם
  choice: trong khi các ông
  rationale: וְ có thể mang sắc thái hoàn cảnh hoặc tương phản ở đây; “trong khi” diễn đạt sự trái ngược giữa việc họ đến và thái độ trước đó, nhưng vẫn ghi nhận cách hiểu sát chữ “và” trong chú thích.
- source_word: שְׂנֵאתֶם אֹתִי
  choice: đã ghét tôi
  rationale: Giữ nghĩa mạnh và trực tiếp của שׂנא, không làm nhẹ thành “thù địch”; “đã” xác định hành động xảy ra trước cuộc gặp hiện tại.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: đuổi tôi đi
  rationale: Trong ngữ cảnh họ yêu cầu Y-sác rời khỏi địa phận mình, “đuổi đi” truyền đạt tự nhiên việc sai khiến ông rời đi; không dùng cách mạnh hơn như “xua đuổi”.
- source_word: מֵאִתְּכֶם
  choice: khỏi các ông
  rationale: Giữ ý phân cách khỏi sự hiện diện hoặc cộng đồng của họ; cách diễn đạt gọn và tự nhiên trong câu trực tiếp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” để Y-sác xưng hô với nhóm đàn ông một cách lịch sự nhưng có khoảng cách; giữ nguyên lời cáo buộc mạnh “ghét”. Dấu chú thích [a] được đặt ngay sau mệnh đề dẫn nhập vì chú thích liên quan đến cách nối hai vế trong toàn bộ lời nói.
