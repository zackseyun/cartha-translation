  to: 'Y-sác nói với họ[a]: “Tại sao các ông lại đến với tôi, trong khi các ông đã ghét tôi và đuổi tôi đi khỏi chỗ các ông?”'
  rationale: Sửa duy nhất cách diễn đạt vị trí “khỏi các ông” thành “khỏi chỗ các ông” để tiếng Việt tự nhiên hơn và phản ánh rõ sự tách khỏi cộng đồng/lãnh địa của họ. Thêm “lại” là cách diễn đạt tự nhiên cho câu hỏi tu từ. Chú thích được chỉnh để phương án sát chữ không áp đặt quan hệ thời gian bằng “rồi”.
