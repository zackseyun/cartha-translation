- from: 'Vậy A-bi-mê-léc gọi Y-sác đến và nói: “Quả thật, nàng là vợ ngươi! Thế sao ngươi lại nói: ‘Nàng là em gái tôi’?” Y-sác đáp: “Vì tôi nghĩ: ‘E rằng tôi sẽ chết vì nàng.’”[a]'
  to: 'Vậy A-bi-mê-léc gọi Y-sác đến và nói: “Quả thật, nàng là vợ ngươi! Thế sao ngươi lại nói: ‘Nàng là em gái tôi’?” Y-sác đáp: “Vì tôi đã nói: ‘E rằng tôi sẽ chết vì nàng.’”[a]'
  rationale: Chỉ thay “tôi nghĩ” bằng “tôi đã nói” để giữ nghĩa trực tiếp của אָמַרְתִּי. Các phần còn lại truyền đạt trung thành cấu trúc, sắc thái và ý nghĩa của câu Hê-bơ-rơ; chú thích vẫn hữu ích vì làm rõ hàm ý mà không đưa nó vào bản văn chính.
