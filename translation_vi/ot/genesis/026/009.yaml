base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: vi
  text: 'Vậy A-bi-mê-léc gọi Y-sác đến và nói: “Quả thật, nàng là vợ ngươi! Thế sao ngươi lại nói: ‘Nàng là em gái tôi’?” Y-sác đáp: “Vì tôi đã nói: ‘E rằng tôi sẽ chết vì nàng.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói rõ hơn: “E rằng người ta sẽ giết tôi vì nàng.”'
    reason: Nguyên văn chỉ nói “tôi sẽ chết vì nàng”; ngữ cảnh cho thấy Y-sác sợ những người đàn ông khác giết mình để chiếm lấy Rê-bê-ca.
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: gọi Y-sác đến
  rationale: Cấu trúc קרא với לְ chỉ việc gọi một người đến; cách diễn đạt này tự nhiên trong tiếng Việt và hợp với bối cảnh nhà vua chất vấn Y-sác.
- source_word: אַךְ הִנֵּה
  choice: Quả thật
  rationale: Hai tiểu từ cùng nhấn mạnh điều A-bi-mê-léc vừa nhận ra. “Quả thật” giữ được sức khẳng định mà không tạo thành câu hỏi hoặc dùng lối nói cổ.
- source_word: אִשְׁתְּךָ הִוא
  choice: nàng là vợ ngươi
  rationale: Dịch trực tiếp mệnh đề xác nhận quan hệ vợ chồng; “nàng” phù hợp với văn kể trang trọng, còn “ngươi” phản ánh lời nhà vua nói với Y-sác.
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: Thế sao ngươi lại nói
  rationale: Câu hỏi mang sắc thái trách cứ và kinh ngạc; “thế sao... lại” thể hiện tự nhiên quan hệ suy luận với lời khẳng định trước đó.
- source_word: אֲחֹתִי הִוא
  choice: Nàng là em gái tôi
  rationale: אחות có nghĩa thông thường là chị hoặc em gái; trong tiếng Việt phải chọn cách gọi, và “em gái” phù hợp cách gọi Rê-bê-ca trong mạch truyện Sáng Thế Ký.
- source_word: כִּי אָמַרְתִּי
  choice: Vì tôi nghĩ
  rationale: אמרתי theo nghĩa đen là “tôi đã nói”, nhưng ở đây chỉ lời tự nhủ hoặc suy tính của Y-sác. “Tôi nghĩ” truyền đạt đúng chức năng ngữ cảnh trong tiếng Việt.
- source_word: פֶּן אָמוּת
  choice: E rằng tôi sẽ chết
  rationale: פֶּן diễn tả điều lo sợ có thể xảy ra; “e rằng” giữ sắc thái lo ngại, còn “sẽ chết” là cách diễn đạt tự nhiên cho động từ chưa hoàn thành trong cấu trúc này.
- source_word: עָלֶיהָ
  choice: vì nàng
  rationale: 'עַל ở đây nêu nguyên do hoặc duyên cớ: Y-sác sợ bị giết vì Rê-bê-ca. Cách dịch ngắn gọn vẫn giữ sự hàm ẩn của nguyên văn.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng/ngươi/tôi” để lời thoại vừa phân biệt vai giao tiếp vừa không quá cổ kính. Dấu chấm than chuyển tải sức nhấn mạnh của אַךְ הִנֵּה.
