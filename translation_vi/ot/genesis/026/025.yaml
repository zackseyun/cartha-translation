revisions:
- from: Ông xây tại đó một bàn thờ, cầu khẩn danh Yahweh[a], rồi dựng lều tại đó. Các đầy tớ của Y-sác đào một cái giếng tại đó.
  to: Ông xây một bàn thờ tại đó, kêu cầu danh Yahweh, rồi dựng lều của mình tại đó. Các đầy tớ của Y-sác đào một giếng tại đó.
