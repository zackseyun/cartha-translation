base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: vi
  text: Ông xây một bàn thờ tại đó, kêu cầu danh Yahweh, rồi dựng lều của mình tại đó. Các đầy tớ của Y-sác đào một giếng tại đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Ông xây tại đó một bàn thờ
  rationale: Giữ nghĩa trực tiếp của בנה và מזבח, đồng thời duy trì sự nhấn mạnh địa điểm của שָׁם.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: cầu khẩn danh Yahweh
  rationale: Trong bối cảnh dựng bàn thờ, thành ngữ này tự nhiên nhất chỉ hành động khẩn cầu hoặc thờ phượng; cách dịch vẫn để ngỏ khả năng hiểu là công bố qua chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: rồi dựng lều tại đó
  rationale: נטה đi với אהל mang nghĩa thành ngữ là dựng lều; từ 'rồi' diễn đạt diễn tiến kể chuyện mà không làm thay đổi quan hệ giữa các hành động.
- source_word: עַבְדֵי יִצְחָק
  choice: các đầy tớ của Y-sác
  rationale: Trong ngữ cảnh này, עבד chỉ những người thuộc gia nhân thực hiện công việc; 'đầy tớ' không khẳng định quá mức địa vị pháp lý của họ.
- source_word: וַיִּכְרוּ שָׁם בְּאֵר
  choice: đào một cái giếng tại đó
  rationale: Cách diễn đạt tiếng Việt tự nhiên, trực tiếp cho hành động đào giếng, đồng thời giữ lại trạng từ địa điểm lặp lại.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; 'Yahweh' bảo tồn danh riêng thay vì thay bằng tước hiệu.
- issue: Nghĩa của וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: cầu khẩn danh Yahweh
  alternative: công bố danh Yahweh
  rationale: Cả nghĩa khẩn cầu và công bố đều có thể thuộc phạm vi của thành ngữ, nhưng bối cảnh dựng bàn thờ nghiêng về hành động cầu khẩn; khả năng kia được giữ trong chú thích.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Lặp lại “tại đó” để phản ánh sự nhấn mạnh địa điểm trong nguyên văn. Dùng “Y-sác” theo dạng tên quen thuộc trong tiếng Việt.
