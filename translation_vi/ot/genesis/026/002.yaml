base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: vi
  text: 'Bấy giờ Yahweh hiện ra với ông và phán[a]: “Đừng đi xuống Ai Cập. Hãy ở trong xứ Ta sẽ bảo con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát: “Hãy ở trong xứ mà Ta nói với con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Động từ ראה ở thể Niphal diễn tả việc Yahweh tỏ mình ra; “hiện ra” tự nhiên, trang trọng và không xác định quá mức cách thức Ngài xuất hiện.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אַל תֵּרֵד
  choice: Đừng đi xuống
  rationale: אַל đi với dạng chưa hoàn thành tạo thành lời cấm; “đi xuống” giữ hình ảnh địa lý và thành ngữ chỉ hành trình về Ai Cập.
- source_word: מִצְרָיְמָה
  choice: Ai Cập
  rationale: Đuôi chỉ hướng diễn tả chuyển động về phía Ai Cập; tiếng Việt tự nhiên biểu đạt bằng “đi xuống Ai Cập”.
- source_word: שְׁכֹן
  choice: Hãy cư ngụ
  rationale: Mệnh lệnh của שכן mang nghĩa ở, cư trú tại một nơi; “cư ngụ” trang trọng vừa phải và nhấn mạnh việc ở lại sinh sống.
- source_word: בָּאָרֶץ
  choice: trong vùng đất
  rationale: אֶרֶץ ở đây chỉ miền đất hay lãnh thổ nơi Y-sác phải cư trú, không phải toàn thể trái đất.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: mà Ta sẽ chỉ cho con
  rationale: Nghĩa sát là “mà Ta sẽ nói với con”; trong ngữ cảnh chỉ dẫn về địa điểm, “sẽ chỉ cho” truyền đạt tự nhiên ý Yahweh sẽ cho biết vùng đất, nhưng không thêm một địa danh cụ thể.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Giữ “Yahweh” bảo tồn tư cách tên riêng và tránh thay bằng một tước hiệu.
- issue: Đại từ trong lời Yahweh phán với Y-sác
  choice: Ta… con
  alternative: Ta… ngươi; Tôi… anh
  rationale: “Ta… con” là cách xưng hô tự nhiên, trang nghiêm trong tiếng Việt khi Đức Chúa Trời phán với một cá nhân; lựa chọn này chỉ thể hiện quan hệ giao tiếp, không nhằm xác định thêm một lập trường thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Bấy giờ” để nối mạch tự sự; giữ thành ngữ “đi xuống Ai Cập.” Không đặt chú thích vì bản chính đã diễn đạt tự nhiên; sắc thái sát chữ “mà Ta sẽ nói với con” được ghi nhận trong quyết định từ vựng.
