  naturalness: Câu văn tự nhiên, rõ ràng và phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. Cụm “cứ ngày càng lớn mạnh” truyền đạt tốt thành ngữ diễn tiến של וילך הלוך וגדל mà không gợi sai về việc di chuyển trong không gian.
  terminology: “Lớn mạnh” là lựa chọn chấp nhận được, giữ nghĩa rộng về sự tăng trưởng, địa vị và thịnh vượng mà không thu hẹp thành giàu có. “Người ấy” quy chiếu Y-sác theo văn mạch; tiếng Việt không bắt buộc phải đánh dấu giống ngữ pháp trong câu này.
