  text: And the man became great[a], and he continued to grow greater until he became very great.
translation:
  language: vi
  text: Người ấy trở nên lớn mạnh và cứ ngày càng lớn mạnh, cho đến khi trở nên rất lớn mạnh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: trở nên lớn mạnh
  rationale: Động từ גדל diễn tả sự lớn lên hoặc trở nên lớn về quy mô, địa vị hay tầm quan trọng. “Lớn mạnh” giữ được độ rộng của từ và phù hợp với bối cảnh thịnh vượng, nhưng không thu hẹp nghĩa chỉ còn sự giàu có.
- source_word: הָאִישׁ
  choice: người ấy
  rationale: Danh từ איש chỉ một người nam, ở đây là Y-sác. Tiếng Việt tự nhiên dùng “người ấy” để quy chiếu nhân vật đã được nêu trong ngữ cảnh, không cần lặp tên.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: cứ ngày càng lớn mạnh
  rationale: Cấu trúc gồm động từ hữu hạn, nguyên thể tuyệt đối và phân từ biểu thị một tiến trình liên tục, tăng dần. “Cứ ngày càng” truyền đạt tự nhiên cả tính tiếp diễn lẫn mức độ gia tăng; dịch riêng yếu tố “đi” sẽ gây hiểu lầm là chuyển động không gian.
- source_word: עַד כִּי
  choice: cho đến khi
  rationale: Cụm từ đánh dấu điểm đạt tới của tiến trình tăng trưởng; “cho đến khi” diễn đạt rõ sự tiến triển tới mức cao nhất.
- source_word: גָדַל מְאֹד
  choice: trở nên vô cùng lớn mạnh
  rationale: Cách dịch lặp lại “lớn mạnh” để phản ánh sự lặp lại của גדל, còn “vô cùng” thể hiện sức nhấn mạnh của מְאֹד.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ phép lặp có chủ ý của động từ גדל, đồng thời chuyển thành ngữ Hê-bơ-rơ về tiến trình liên tục sang cách nói tự nhiên “cứ ngày càng”; không diễn giải hẹp thành “giàu có” dù tài sản là trọng tâm của ngữ cảnh gần.
