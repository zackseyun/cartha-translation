- from: 'A-bi-mê-léc nói: “Sao ông lại làm điều này với chúng tôi? Suýt nữa một người trong dân đã ăn nằm với vợ ông, và ông đã khiến chúng tôi mắc tội.”[a]'
  to: 'A-bi-mê-léc nói: “Sao ông lại làm điều này với chúng tôi? Chỉ chút nữa thôi là một người trong dân đã ăn nằm với vợ ông, và ông đã khiến chúng tôi mắc tội.”[a]'
