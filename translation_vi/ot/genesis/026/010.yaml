  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ כִּ֠/מְעַט שָׁכַ֞ב אַחַ֤ד הָ/עָם֙ אֶת אִשְׁתֶּ֔/ךָ וְ/הֵבֵאתָ֥ עָלֵ֖י/נוּ אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: vi
  text: 'A-bi-mê-léc nói: “Sao ông lại làm điều này với chúng tôi? Chỉ chút nữa thôi là một người trong dân đã ăn nằm với vợ ông, và ông đã khiến chúng tôi mắc tội.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, nhấn mạnh sự việc rất dễ xảy ra: “Một người trong dân rất có thể đã ăn nằm với vợ ông.”'
    reason: 'Bảo tồn sắc thái khả dĩ của כִּמְעַט: một sự việc gần xảy ra, có thể được diễn đạt như một nguy cơ rất dễ xảy ra.'
lexical_decisions:
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: A-bi-mê-léc nói
  rationale: Dùng lối kể chuyện tự nhiên trong tiếng Việt; không nhất thiết dịch liên từ וַ bằng “và” ở đầu câu.
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Sao ông lại làm điều này với chúng tôi?
  rationale: Giữ sắc thái sửng sốt và trách cứ của cấu trúc מַה זֹּאת, đồng thời bảo toàn đối tượng cộng đồng “với chúng tôi”.
- source_word: כִּמְעַט
  choice: Suýt nữa
  rationale: Diễn đạt tự nhiên ý một sự việc đã gần xảy ra; cấu trúc Hê-bơ-rơ cũng có thể được hiểu theo sắc thái nguy cơ “rất có thể”.
- source_word: אַחַד הָעָם
  choice: một người trong dân
  rationale: Bám sát nghĩa đen, không thu hẹp הָעָם thành “đàn ông” dù ngữ cảnh cho thấy người được nói đến là nam giới.
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: ăn nằm với vợ ông
  rationale: “Ăn nằm với” là thành ngữ tiếng Việt rõ nghĩa về quan hệ tình dục, trang trọng vừa phải và tương ứng gần với thành ngữ Hê-bơ-rơ.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: và ông đã khiến chúng tôi mắc tội
  rationale: Truyền đạt trách nhiệm đạo đức mà hành động ấy sẽ đem đến cho cộng đồng; “mắc tội” tự nhiên hơn cách dịch máy móc “đem tội lỗi trên chúng tôi”.
theological_decisions:
- issue: Bản chất của אָשָׁם trong ngữ cảnh
  choice: mắc tội
  alternative: mang lỗi / chịu trách nhiệm
  rationale: Ở đây אָשָׁם chỉ tình trạng có tội hay trách nhiệm khách quan do một hành vi tình dục sai trái, không chỉ là bị chê trách; cách dịch không áp đặt nghĩa chuyên môn về lễ vật chuộc lỗi.
- issue: Tính phản thực của mệnh đề cuối
  choice: ông đã khiến chúng tôi mắc tội
  alternative: ông hẳn đã khiến chúng tôi mắc tội
  rationale: Động từ Hê-bơ-rơ ở dạng hoàn thành phối hợp với sự việc suýt xảy ra, nên hàm ý hậu quả phản thực. Tiếng Việt có thể hiểu điều này từ toàn câu; ghi chú làm rõ cách hiểu để tránh cho rằng tội thực tế đã xảy ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” trong lời quở trách giữa các nhân vật trưởng thành; phiên âm tên riêng theo lối Việt hóa quen thuộc. Thành ngữ “ăn nằm với” giữ sự kín đáo nhưng không làm mờ nghĩa tình dục.
