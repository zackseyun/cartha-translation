base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: vi
  text: Hãy tạm trú trong xứ này[a]. Ta sẽ ở cùng con và ban phước cho con, vì Ta sẽ ban tất cả các xứ này cho con và dòng dõi con[b], và Ta sẽ xác nhận lời thề mà Ta đã thề với Áp-ra-ham, cha con[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy cư ngụ như một người ngoại kiều trong xứ này.” Động từ Hê-bơ-rơ có thể chỉ việc sống tại một nơi với tư cách người tạm cư hoặc ngoại kiều.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ là “hạt giống”; từ này được dùng theo nghĩa tập thể ở đây, tức là “dòng dõi.”
    reason: lexical_alternative
  - marker: c
    text: “Xác nhận” cũng có thể được hiểu là “làm cho vững chắc” hoặc “thực hiện” lời thề.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: Hãy tạm trú
  rationale: Động từ גור chỉ việc cư trú với tư cách người tạm cư hoặc ngoại kiều. “Tạm trú” giữ được sắc thái này trong tiếng Việt hiện đại; mệnh lệnh trong ngữ cảnh cũng hàm ý Y-sác phải ở lại thay vì xuống Ai Cập.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: trong xứ này
  rationale: אֶרֶץ ở đây chỉ một địa vực cụ thể trong bối cảnh lời hứa. “Xứ” vừa trang trọng vừa duy trì liên hệ từ vựng với dạng số nhiều ở vế sau.
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: Ta sẽ ở cùng con
  rationale: Giữ trực tiếp công thức về sự hiện diện của Đức Chúa Trời, không diễn giải thêm nội dung giao ước.
- source_word: וַאֲבָרְכֶךָ
  choice: và ban phước cho con
  rationale: Tiếp nối lời hứa ở thì tương lai; tiếng Việt có thể lược chủ ngữ lặp lại mà nghĩa vẫn rõ.
- source_word: כִּי
  choice: vì
  rationale: Diễn đạt tự nhiên chức năng giải thích hoặc nêu cơ sở của mệnh lệnh và lời hứa.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: cho con và dòng dõi con
  rationale: זֶרַע là danh từ tập hợp. “Dòng dõi” truyền đạt nghĩa tập thể tự nhiên hơn “hạt giống”, nhưng nghĩa đen được ghi trong chú thích.
- source_word: אֶתֵּן
  choice: Ta sẽ ban
  rationale: Diễn đạt lời hứa ban tặng; “ban” phù hợp với chủ thể thần linh và văn phong trang trọng, dễ hiểu.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: tất cả các xứ này
  rationale: Giữ số nhiều của אֲרָצוֹת và liên hệ với “xứ này” ở đầu câu.
- source_word: וַהֲקִמֹתִי
  choice: và Ta sẽ xác lập
  rationale: Thể Hiphil của קום trong ngữ cảnh lời thề có thể mang nghĩa làm cho đứng vững, xác nhận hoặc thực hiện. “Xác lập” giữ sắc thái trang trọng mà không đồng nhất hoàn toàn với sự hoàn tất.
- source_word: הַשְּׁבֻעָה
  choice: lời thề
  rationale: Danh từ này chỉ lời thề cách cụ thể, mạnh và chính xác hơn từ rộng nghĩa “lời hứa”.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: mà Ta đã thề
  rationale: Giữ cấu trúc mệnh đề quan hệ và động từ cùng gốc với “lời thề”, phản ánh sự lặp có chủ ý trong tiếng Hê-bơ-rơ.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: với Áp-ra-ham, cha con
  rationale: Giới từ לְ đi với động từ “thề” được diễn đạt tự nhiên bằng “với”; cụm đồng vị xác định Áp-ra-ham là cha của Y-sác.
theological_decisions:
- issue: Cách diễn đạt việc Đức Chúa Trời làm cho lời thề có hiệu lực
  choice: Ta sẽ xác lập lời thề mà Ta đã thề
  alternative: Ta sẽ xác nhận lời thề / Ta sẽ thực hiện lời thề
  rationale: “Xác lập” gần với hình ảnh làm cho đứng vững của וַהֲקִמֹתִי, đồng thời không quyết định thay văn bản rằng trọng tâm chỉ là xác nhận hay hoàn tất lời thề.
- issue: Nghĩa tập thể của זֶרַע
  choice: dòng dõi
  alternative: hạt giống; hậu duệ
  rationale: Trong câu này, lời hứa hướng đến dòng dõi của Y-sác theo nghĩa tập thể. Bản dịch không ép từ này thành số ít cá nhân, còn nghĩa đen “hạt giống” được bảo lưu trong chú thích.
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ta—con” phản ánh lời Đức Chúa Trời trực tiếp phán với Y-sác. “Xứ” duy trì sắc thái địa lý-giao ước và sự lặp từ trong nguyên văn. Tất cả dấu chú thích [a], [b], [c] đều có mặt trong chính văn.
