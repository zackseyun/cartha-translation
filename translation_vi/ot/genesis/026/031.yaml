  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: vi
  text: Sáng sớm, họ thức dậy và thề với nhau. Sau đó, Y-sác tiễn họ lên đường, và họ rời khỏi ông trong bình an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Sáng sớm, họ thức dậy
  rationale: Động từ שׁכם ở dạng Hiphil diễn tả việc dậy sớm; kết hợp với בַבֹּקֶר, cách nói này tự nhiên trong tiếng Việt và giữ trình tự kể chuyện.
- source_word: וַיִּשָּׁבְעוּ
  choice: thề
  rationale: Dạng Niphal của שׁבע có nghĩa là thề hoặc lập lời thề. Trong tiếng Việt, “thề” đã hàm ý lời thề trang trọng, nên không cần thêm một bổ ngữ trùng nghĩa.
- source_word: אִישׁ לְאָחִיו
  choice: với nhau
  rationale: Nghĩa đen là “mỗi người với anh em mình”, nhưng trong ngữ cảnh đây là thành ngữ chỉ hành động thề mang tính tương hỗ giữa Y-sác và phái đoàn; “với nhau” truyền đạt chính xác và tự nhiên.
- source_word: וַיְשַׁלְּחֵם
  choice: tiễn họ lên đường
  rationale: Piel của שׁלח với đại từ làm tân ngữ mang nghĩa cho đi hoặc sai đi. Trong bối cảnh tiếp khách rồi chia tay hòa thuận, “tiễn họ lên đường” tự nhiên hơn “đuổi họ đi” và không gợi sự xua đuổi.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: họ rời ông
  rationale: הלך kết hợp với מֵאֵת diễn tả chuyển động rời khỏi một người; “rời ông” ngắn gọn và đúng nghĩa.
- source_word: בְּשָׁלוֹם
  choice: trong bình an
  rationale: שָׁלוֹם ở đây bao hàm cả quan hệ hòa thuận lẫn việc ra đi an toàn; “trong bình an” giữ được độ rộng nghĩa ấy.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “Y-sác” theo lối phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt. Không thêm thuật ngữ giao ước vì câu Hê-bơ-rơ chỉ nói họ thề với nhau.
