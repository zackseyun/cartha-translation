base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: vi
  text: Rồi họ đào một giếng khác; người ta cũng tranh chấp với họ về giếng ấy, nên ông gọi tên nó là Sít-na.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Sít-na nghe gần với một từ Hê-bơ-rơ chỉ sự thù nghịch hoặc chống đối.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: họ đào
  rationale: Động từ Qal số nhiều חפר mang nghĩa thông thường là “đào”; cách dịch này tự nhiên và giữ đúng diễn tiến của câu chuyện.
- source_word: בְּאֵר אַחֶרֶת
  choice: một giếng khác
  rationale: בְּאֵר là “giếng”, còn אַחֶרֶת là “khác/một cái khác”; cụm này chỉ một giếng tiếp theo, khác với giếng trước.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: người ta cũng tranh chấp với họ về giếng ấy
  rationale: ריב diễn tả việc tranh chấp hoặc tranh giành. Chủ ngữ số nhiều không được nêu rõ trong câu này; dựa vào ngữ cảnh gần, tiếng Việt cần biểu đạt tự nhiên là “người ta”, còn “với họ” làm rõ phía đối nghịch mà không thay đổi nội dung ngữ cảnh.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: ông gọi tên nó là
  rationale: Giữ khá sát công thức đặt tên trong tiếng Hê-bơ-rơ, đồng thời vẫn tự nhiên trong tiếng Việt; đại từ “ông” chỉ Y-sác theo ngữ cảnh.
- source_word: שִׂטְנָה
  choice: Sít-na
  rationale: Đây là tên riêng của giếng nên được phiên âm thay vì dịch nghĩa; sắc thái thù nghịch/chống đối được giải thích trong chú thích.
