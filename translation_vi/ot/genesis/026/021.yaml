  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tranh chấp” để phù hợp với cuộc xung đột về quyền sở hữu giếng; giữ tên riêng Sít-na và đặt dấu chú thích ngay sau tên.
