  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: vi
  text: Ta sẽ làm cho dòng dõi con đông như sao trên trời, sẽ ban cho dòng dõi con tất cả những vùng đất này; và trong dòng dõi con, mọi dân tộc trên đất sẽ được chúc phúc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi dân tộc trên đất sẽ tự chúc phúc cho mình nhờ dòng dõi con.” Động từ Hê-bơ-rơ có thể được hiểu theo nghĩa phản thân, dù nghĩa bị động phù hợp với mạch lời hứa giao ước.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Ta sẽ làm cho ... đông
  rationale: Dạng Hiphil của רבה diễn tả việc chủ động làm gia tăng số lượng; cách nói này tự nhiên trong tiếng Việt và giữ rõ hành động của Đức Chúa Trời.
- source_word: זַרְעֲךָ
  choice: dòng dõi con
  rationale: זֶרַע là danh từ tập hợp, có thể chỉ hậu duệ nói chung. “Dòng dõi” giữ được sắc thái tập hợp và phù hợp văn phong lời hứa giao ước.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: như sao trên trời
  rationale: Giữ phép so sánh minh nhiên của כ và diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: וְנָתַתִּי
  choice: sẽ ban
  rationale: נתן có nghĩa cơ bản là “cho”; trong lời phán của Đức Chúa Trời, “ban” vừa tự nhiên vừa giữ sắc thái trang trọng mà không thêm ý nghĩa thần học.
- source_word: לְזַרְעֲךָ
  choice: cho dòng dõi con
  rationale: Dịch nhất quán từ זֶרַע trong cả câu và giữ đối tượng tiếp nhận lời hứa.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: tất cả những vùng đất này
  rationale: Số nhiều אֲרָצוֹת trong ngữ cảnh lời hứa lãnh thổ phù hợp với “những vùng đất”; הָאֵל mang nghĩa chỉ định “này”.
- source_word: וְהִתְבָּרֲכוּ
  choice: sẽ được ban phước
  rationale: Cách hiểu bị động phù hợp với công thức lời hứa dành cho các tổ phụ. Tuy nhiên, khả năng hiểu phản thân vẫn được bảo lưu trong chú thích.
- source_word: בְזַרְעֲךָ
  choice: trong dòng dõi con
  rationale: “Trong” bám sát giới từ בְּ và không quyết định thay người đọc rằng quan hệ ở đây nhất thiết là phương tiện (“qua/nhờ”), nhờ đó giữ được độ mở của nguyên văn.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: mọi dân tộc trên đất
  rationale: גּוֹיִם chỉ các dân tộc; “mọi dân tộc trên đất” là cách diễn đạt rõ ràng, tự nhiên và sát nghĩa.
theological_decisions:
- issue: Ý nghĩa của công thức וְהִתְבָּרֲכוּ בְזַרְעֲךָ
  choice: trong dòng dõi con, mọi dân tộc trên đất sẽ được ban phước
  alternative: mọi dân tộc trên đất sẽ lấy dòng dõi con mà chúc phước cho mình
  rationale: Cách hiểu bị động phù hợp với mạch lời hứa giao ước dành cho các tổ phụ, trong khi dạng động từ Hithpael cũng có thể được hiểu theo nghĩa phản thân. Bản chính dùng cách hiểu bị động và chú thích giữ lại cách đọc phản thân để không xóa bỏ sự nhập nhằng thực sự của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” phù hợp lời phán trực tiếp của Đức Chúa Trời với một cá nhân; chọn “dòng dõi” để giữ tính tập hợp của זֶרַע, và đặt dấu chú thích ngay sau mệnh đề có cách đọc thay thế.
