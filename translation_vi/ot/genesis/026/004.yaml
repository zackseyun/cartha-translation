  source_fidelity: Bản dịch bám sát các động từ tương lai trong lời hứa, tính tập hợp của זַרְעֲךָ ("dòng dõi con"), số nhiều của "các vùng đất", và quan hệ còn để ngỏ của בְּ ("trong dòng dõi con"). Cách hiểu bị động của וְהִתְבָּרֲכוּ là khả dĩ và chú thích đã giữ cách hiểu phản thân.
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Tuy nhiên, "được ban phước" ít tự nhiên hơn "được chúc phúc" trong một mệnh đề bị động; "chúc phúc" cũng diễn đạt rõ hơn hành vi/ân phúc được nói đến mà không làm thay đổi cách hiểu ngữ pháp.
  terminology: '"Ta/con", "dòng dõi", "ban", "dân tộc" và "vùng đất" nhất quán, thích hợp với văn cảnh lời hứa giao ước. Đổi "ban phước" thành "chúc phúc" chỉ nhằm chuẩn hóa cách nói tiếng Việt, không áp đặt một cách giải thích thần học.'
