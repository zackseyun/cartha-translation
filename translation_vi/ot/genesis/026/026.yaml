base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: vi
  text: Bấy giờ, A-bi-mê-léc từ Ghê-ra đến gặp ông, cùng đi có A-hu-xát, bạn[a] của vua, và Phi-côn, chỉ huy quân đội của vua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người thân cận” hoặc “cố vấn”. Từ Hê-bơ-rơ có thể chỉ một người bạn, người cộng sự, hoặc người thân cận trong triều đình.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבִימֶלֶךְ
  choice: Bấy giờ, A-bi-mê-léc
  rationale: Tên riêng được phiên âm theo cách dễ đọc trong tiếng Việt. Liên từ mở đầu chuỗi tường thuật được diễn đạt là “Bấy giờ” để chuyển tiếp câu chuyện một cách tự nhiên.
- source_word: הָלַךְ אֵלָיו מִגְּרָר
  choice: từ Ghê-ra đến gặp ông
  rationale: הָלַךְ có nghĩa cơ bản là “đi”; trong tiếng Việt, khi đích đến là một người, “đến gặp ông” diễn đạt tự nhiên ý “đi đến chỗ ông”. Đại từ “ông” giữ cách quy chiếu của nguyên văn và chỉ Y-sác theo văn cảnh.
- source_word: וַאֲחֻזַּת
  choice: cùng đi có A-hu-xát
  rationale: Liên từ waw ở đây giới thiệu người tháp tùng A-bi-mê-léc; cách diễn đạt này làm rõ quan hệ đồng hành mà không biến A-hu-xát thành một chủ thể độc lập.
- source_word: מֵרֵעֵהוּ
  choice: bạn[a] của vua
  rationale: רֵעַ trước hết có thể chỉ bạn, người thân cận hoặc người cộng sự. “Bạn” giữ nghĩa trực tiếp và sự mơ hồ của từ; chú thích nêu các khả năng theo bối cảnh triều đình. Dùng “của vua” thay cho “của ông” để tránh nhầm người sở hữu trong câu có nhiều nhân vật nam.
- source_word: וּפִיכֹל שַׂר צְבָאוֹ
  choice: và Phi-côn, chỉ huy quân đội của vua
  rationale: שַׂר chỉ người đứng đầu hoặc chỉ huy, còn צָבָא ở đây là lực lượng quân sự. “Chỉ huy quân đội” là cách nói hiện đại, rõ nghĩa; “của vua” làm rõ hậu tố sở hữu chỉ A-bi-mê-léc.
theological_decisions: []
translation_notes:
  register: Văn phong tường thuật trang trọng nhưng hiện đại. Tên riêng được phiên âm có gạch nối để người đọc phổ thông dễ phát âm. Câu giữ đại từ chỉ Y-sác như nguyên văn, đồng thời dùng “vua” ở hai cụm sở hữu để tránh mơ hồ trong tiếng Việt.
