  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: vi
  text: Họ là nỗi cay đắng trong lòng Y-sác và Rê-bê-ca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Thành ngữ Hê-bơ-rơ, nghĩa đen là “sự cay đắng của tâm thần”, diễn tả nỗi phiền muộn, khổ tâm hoặc bực dọc sâu sắc. Cũng có thể dịch: “Họ đã trở thành nỗi cay đắng đối với Y-sác và Rê-bê-ca.”'
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: Họ khiến
  rationale: Động từ היה ở dạng kể chuyện, ngôi thứ ba giống cái số nhiều, tiếp nối câu trước và nói về hai người vợ của Ê-sau. Trong thành ngữ này, tiếng Việt tự nhiên diễn đạt tác động bằng “khiến”; cách dịch sát cấu trúc hơn là “đã trở thành” được ghi ở chú thích.
- source_word: מֹרַת רוּחַ
  choice: tinh thần ... cay đắng
  rationale: Cụm danh từ Hê-bơ-rơ nghĩa đen là “sự cay đắng của tinh thần”, diễn tả nỗi phiền muộn, đau buồn hoặc bực dọc sâu sắc. Bản dịch giữ hình ảnh “cay đắng” và “tinh thần” nhưng điều chỉnh trật tự cho tự nhiên trong tiếng Việt.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: của Y-sác và Rê-bê-ca
  rationale: Hai giới từ לְ đánh dấu những người chịu ảnh hưởng. Với cấu trúc “khiến ... cay đắng”, tiếng Việt dùng “của” để nối “tinh thần” với Y-sác và Rê-bê-ca một cách rõ ràng, tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “họ” chỉ hai người vợ của Ê-sau được nhắc ở câu trước; giữ hình ảnh “cay đắng” của nguyên văn, đồng thời diễn đạt thành ngữ theo cú pháp tiếng Việt tự nhiên.
