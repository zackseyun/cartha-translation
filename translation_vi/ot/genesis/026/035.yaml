  rationale: Bản sửa thay cấu trúc gây khiến bằng vị ngữ danh từ phù hợp với nguyên văn, đồng thời dùng thành ngữ tiếng Việt tự nhiên “nỗi cay đắng trong lòng”. Chú thích bảo lưu cách diễn đạt sát hơn với cấu trúc “trở thành ... đối với” và giải thích thành ngữ.
