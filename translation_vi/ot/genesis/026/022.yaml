  terminology: “Yahweh,” “Rê-hô-bốt,” “tranh chấp,” và “sinh sôi” đều phù hợp. Phiên âm Rê-hô-bốt có thể được giữ nhất quán; chú thích nên nói rõ đây là sự gần âm/ chơi chữ với từ Hê-bơ-rơ chỉ các không gian rộng rãi.
