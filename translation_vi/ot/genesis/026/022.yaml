  text: וַ/יַּעְתֵּ֣ק מִ/שָּׁ֗ם וַ/יַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְ/לֹ֥א רָב֖וּ עָלֶ֑י/הָ וַ/יִּקְרָ֤א שְׁמָ/הּ֙ רְחֹב֔וֹת וַ/יֹּ֗אמֶר כִּֽי עַתָּ֞ה הִרְחִ֧יב יְהוָ֛ה לָ֖/נוּ וּ/פָרִ֥ינוּ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: vi
  text: 'Ông rời khỏi đó, đào một giếng khác, và họ không tranh chấp về giếng ấy. Ông đặt tên giếng là Rê-hô-bốt[a] và nói: “Giờ đây, Yahweh đã làm cho chúng ta có chỗ rộng rãi, và chúng ta sẽ sinh sôi trong xứ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tên Rê-hô-bốt gần với một từ Hê-bơ-rơ có nghĩa là “những nơi rộng rãi”; lời giải thích của Y-sác chơi chữ với nghĩa ấy: “Yahweh đã làm cho chúng ta có chỗ rộng rãi.”'
    reason: Giải thích ý nghĩa tên riêng và lối chơi chữ Hê-bơ-rơ không thể hiện trọn vẹn qua phiên âm.
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: Ông dời khỏi đó
  rationale: Động từ עתק trong ngữ cảnh chỉ việc Y-sác rời địa điểm ấy để đi nơi khác; “dời khỏi đó” tự nhiên và giữ rõ ý chuyển đi.
- source_word: בְּאֵר אַחֶרֶת
  choice: một giếng khác
  rationale: Cách diễn đạt trực tiếp, tự nhiên cho cụm danh từ Hê-bơ-rơ.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: họ không tranh chấp về giếng ấy
  rationale: ריב diễn tả sự tranh giành hoặc tranh chấp; nói rõ “giếng ấy” giúp đại từ không bị mơ hồ trong tiếng Việt.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: Ông đặt tên giếng là Rê-hô-bốt
  rationale: Chuyển công thức đặt tên Hê-bơ-rơ sang cách nói tiếng Việt tự nhiên, đồng thời phiên âm địa danh.
- source_word: רְחֹבוֹת
  choice: Rê-hô-bốt
  rationale: Giữ dưới dạng tên riêng; ý nghĩa “những nơi rộng rãi” được giải thích trong chú thích và qua lời giải nghĩa ngay sau đó.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: Giờ đây, Yahweh đã mở rộng chỗ cho chúng ta
  rationale: “Mở rộng chỗ” bảo tồn hình ảnh của רחב và lối chơi chữ với Rê-hô-bốt, đồng thời vẫn dễ hiểu trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được viết trực tiếp trong nguyên bản, thay vì thay bằng một tước hiệu.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: và chúng ta sẽ sinh sôi trong xứ này
  rationale: פרה mang nghĩa sinh sôi, gia tăng; “sinh sôi” giữ được sắc thái lời chúc phước. “Xứ này” diễn đạt phạm vi đất đai nơi họ đang cư ngụ theo ngữ cảnh.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên bản dùng trực tiếp danh riêng יהוה; phiên âm “Yahweh” phân biệt danh này với các tước hiệu và không áp đặt một truyền thống giáo phái.
- issue: Sắc thái của וּפָרִינוּ
  choice: chúng ta sẽ sinh sôi
  alternative: chúng ta sẽ thịnh vượng
  rationale: “Sinh sôi” giữ nghĩa từ vựng cốt lõi của פרה và âm hưởng lời chúc phước giao ước; “thịnh vượng” có thể thu hẹp hoặc chuyển nghĩa sang phương diện kinh tế.
translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” vì chủ thể Y-sác đã rõ từ văn cảnh; lặp “giếng ấy” để tránh đại từ mơ hồ. Phiên âm tên theo dạng tiếng Việt quen thuộc: Rê-hô-bốt.'
