  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng trình tự và ý nghĩa của bản Hê-bơ-rơ: Y-sác rời đi, đào giếng khác, không còn tranh chấp, đặt tên giếng, rồi giải thích tên ấy. Tuy nhiên, “xứ này” thêm sắc thái chỉ định (“này”) không có trong בָּאָרֶץ, vốn là “trong xứ/đất”; nên giữ mạo định thay vì thêm chỉ xuất.'
