revisions:
- from: 'Khi những người đàn ông ở nơi ấy hỏi về vợ ông, ông nói: “Nàng là em gái tôi,” vì ông sợ nói: “Nàng là vợ tôi,” e rằng những người đàn ông ở nơi ấy sẽ giết ông[a] vì Rê-bê-ca, bởi nàng có dung mạo xinh đẹp.'
  to: 'Khi những người đàn ông ở nơi ấy hỏi về vợ ông, ông nói: “Nàng là chị/em gái tôi,” vì ông sợ nói: “Nàng là vợ tôi,” e rằng những người đàn ông ở nơi ấy sẽ giết tôi vì Rê-bê-ca, bởi nàng có dung mạo xinh đẹp.'
  rationale: Sửa “giết ông” thành “giết tôi” để giữ ngôi thứ nhất trong điều Y-sác lo sợ, nên chú thích giải thích sự chuyển ngôi không còn cần thiết. Sửa “em gái” thành “chị/em gái” để không ấn định tuổi tương đối vốn không có trong nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:40:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển đúng mạch câu, lý do sợ hãi, đối tượng là những người nam tại nơi ấy, và vẻ đẹp của Rê-bê-ca. Tuy nhiên, יַהַרְגֻנִי là “họ sẽ giết tôi”: đây là phần lời nói/nội tâm được tiếp tục ở ngôi thứ nhất. Việc đổi thành “giết ông” trong thân câu, rồi chuyển chi tiết ấy xuống chú thích, làm thay đổi hình thức diễn ngôn trực tiếp của nguyên văn. Ngoài ra, אֲחֹתִי không xác định là chị hay em gái.'
  naturalness: Văn phong nhìn chung rõ và trang trọng. “E rằng” và “có dung mạo xinh đẹp” phù hợp văn cảnh Kinh Thánh hiện đại. Dùng “chị/em gái” là cách tự nhiên để không áp đặt tuổi tác không có trong tiếng Hê-bơ-rơ.
  terminology: Giữ “Rê-bê-ca” nhất quán với dạng phiên âm Kinh Thánh tiếng Việt. “Những người đàn ông ở nơi ấy” bảo toàn rõ ràng nét giống đực của אַנְשֵׁי הַמָּקוֹם; không có vấn đề thuật ngữ thần học trong câu này.
  issues:
  - severity: medium
    issue: Đổi ngôi thứ nhất “giết tôi” thành ngôi thứ ba “giết ông” trong lời Y-sác sợ phải nói.
    rationale: Hậu tố -ני trong יַהַרְגֻנִי có nghĩa là “tôi”; nguyên văn duy trì góc nhìn trực tiếp của Y-sác sau “sợ nói”. Chú thích không thay thế việc bảo toàn nghĩa này trong bản văn chính.
  - severity: low
    issue: Dịch אֲחֹתִי là “em gái tôi”.
    rationale: Danh từ אָחוֹת không cho biết tương quan tuổi tác; “em gái” thêm một chi tiết không được nguồn xác nhận. “Chị/em gái tôi” giữ nguyên sự mơ hồ.
  revised_text: 'Khi những người đàn ông ở nơi ấy hỏi về vợ ông, ông nói: “Nàng là chị/em gái tôi,” vì ông sợ nói: “Nàng là vợ tôi,” e rằng những người đàn ông ở nơi ấy sẽ giết tôi vì Rê-bê-ca, bởi nàng có dung mạo xinh đẹp.'
