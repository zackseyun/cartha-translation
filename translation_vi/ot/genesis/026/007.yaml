base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: vi
  text: 'Khi những người đàn ông ở nơi ấy hỏi về vợ ông, ông nói: “Nàng là chị/em gái tôi,” vì ông sợ nói: “Nàng là vợ tôi,” e rằng những người đàn ông ở nơi ấy sẽ giết tôi vì Rê-bê-ca, bởi nàng có dung mạo xinh đẹp.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ ... לְאִשְׁתּוֹ
  choice: hỏi về vợ ông
  rationale: Động từ שׁאל kết hợp với ל ở đây chỉ điều được hỏi đến; “hỏi về” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: những người đàn ông ở nơi ấy
  rationale: אַנְשֵׁי chỉ rõ những người nam; cách dịch này giữ nét giống đực của nguyên văn và vẫn tự nhiên trong ngữ cảnh.
- source_word: אֲחֹתִי הִוא
  choice: Nàng là em gái tôi
  rationale: Tiếng Hê-bơ-rơ chỉ nói “chị/em gái” mà không phân biệt tuổi; trong mạch truyện, “em gái” là cách xưng gọi tự nhiên, còn đại từ “nàng” giữ giọng kể trang trọng.
- source_word: כִּי יָרֵא לֵאמֹר
  choice: vì ông sợ nói
  rationale: כִּי nêu lý do và לֵאמֹר chỉ điều Y-sác sợ nói; bản dịch giữ cấu trúc nhân quả gọn của nguyên văn.
- source_word: פֶּן
  choice: e rằng
  rationale: פֶּן giới thiệu hậu quả đáng sợ có thể xảy ra; “e rằng” vừa chính xác vừa tự nhiên, trang trọng hơn khẩu ngữ “sợ rằng” trong vị trí này.
- source_word: יַהַרְגֻנִי
  choice: sẽ giết ông
  rationale: הרג là động từ thông dụng chỉ hành động giết. Ngôi thứ ba giúp câu trần thuật tiếng Việt tự nhiên; sắc thái ngôi thứ nhất của nguyên văn được ghi ở chú thích.
- source_word: עַל רִבְקָה
  choice: vì Rê-bê-ca
  rationale: עַל trong ngữ cảnh này nêu nguyên nhân hay duyên cớ; “vì” chuyển tải ý đó ngắn gọn, không hàm thêm phán đoán pháp lý hay đạo đức.
- source_word: טוֹבַת מַרְאֶה
  choice: có dung mạo xinh đẹp
  rationale: Cụm từ diễn tả vẻ ngoài đẹp mắt; “có dung mạo xinh đẹp” giữ cả ý về diện mạo lẫn giọng văn trang trọng, dễ hiểu.
- source_word: רִבְקָה
  choice: Rê-bê-ca
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, gần với âm của tên Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” trong lời nói về Rê-bê-ca để tránh sắc thái quá khẩu ngữ; dùng “những người đàn ông” nhằm bảo toàn sự quy chiếu nam giới của nguyên văn.
