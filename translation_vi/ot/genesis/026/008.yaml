base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: vi
  text: Sau khi Y-sác ở đó một thời gian dài, A-bi-mê-léc, vua dân Phi-li-tin, nhìn qua cửa sổ và thấy Y-sác đang âu yếm Rê-bê-ca, vợ của Y-sác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đùa vui với” hoặc “vuốt ve”. Động từ Hê-bơ-rơ có liên hệ với tên Y-sác và có thể chỉ sự vui đùa hoặc hành vi thân mật; trong văn cảnh này, hành vi ấy cho thấy Rê-bê-ca là vợ của Y-sác.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: Sau một thời gian dài ông ở đó
  rationale: Cụm Hê-bơ-rơ mở ra một diễn biến mới và diễn tả việc Y-sác lưu lại đó đã lâu. Cách dịch này tự nhiên trong tiếng Việt hiện đại mà vẫn giữ quan hệ thời gian.
- source_word: וַיַּשְׁקֵף ... בְּעַד הַחַלּוֹן
  choice: nhìn qua cửa sổ
  rationale: Động từ chỉ việc nhìn ra từ một vị trí, còn giới từ với חַלּוֹן diễn tả nhìn xuyên qua hoặc từ cửa sổ.
- source_word: וַיַּרְא וְהִנֵּה
  choice: thì thấy
  rationale: Trong mạch kể tiếng Việt, “thì thấy” truyền đạt tự nhiên sự phát hiện bất ngờ do וְהִנֵּה nhấn mạnh, không cần dùng một thán từ cổ kính.
- source_word: מְצַחֵק
  choice: đang âu yếm
  rationale: Dạng phân từ của צחק có thể chỉ hành vi vui đùa hoặc thân mật; ở đây hành vi ấy khiến A-bi-mê-léc nhận ra quan hệ vợ chồng. “Âu yếm” giữ sắc thái thân mật nhưng không xác định quá mức hành vi cụ thể.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: Rê-bê-ca, vợ mình
  rationale: Danh ngữ đồng vị xác định Rê-bê-ca là vợ của Y-sác; “vợ mình” là cách quy chiếu tự nhiên trong tiếng Việt và tránh khả năng hiểu là vợ của A-bi-mê-léc.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các dạng tên quen thuộc trong Kinh Thánh tiếng Việt. Câu được sắp xếp tự nhiên theo cú pháp tiếng Việt, đồng thời giữ sự mơ hồ có thật của מְצַחֵק bằng chú thích.
