  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các thành tố chính của tiếng Hê-bơ-rơ: các người phục vụ của Y-sác đào tại một נחל, rồi tìm được tại đó một giếng có מַיִם חַיִּים. Tuy nhiên, “lòng suối cạn” đưa thêm ý “cạn” vào chính văn; נחל có thể là khe/thung lũng có dòng nước theo mùa nhưng bản văn không trực tiếp xác định nó đang cạn.'
