  text: וַ/יַּחְפְּר֥וּ עַבְדֵֽי יִצְחָ֖ק בַּ/נָּ֑חַל וַ/יִּ֨מְצְאוּ שָׁ֔ם בְּאֵ֖ר מַ֥יִם חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: vi
  text: Các đầy tớ của Y-sác đào trong khe suối[a] và tìm thấy ở đó một giếng có nước nguồn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong thung lũng” hoặc “trong lòng suối”; từ Hê-bơ-rơ thường chỉ một khe hay dòng nước theo mùa.
    reason: lexical_alternative
  - marker: b
    text: Sát chữ là “nước sống”, tức nước tươi hoặc nước chảy từ một mạch nguồn, chứ không phải nước tù.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: đào
  rationale: Động từ Qal חפר là từ thông dụng chỉ việc đào; “đào” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: עַבְדֵי יִצְחָק
  choice: các đầy tớ của Y-sác
  rationale: Cụm kết hợp chỉ những người phục vụ Y-sác. “Đầy tớ” giữ được sắc thái xã hội rộng của עבד mà không xác định quá mức thân phận pháp lý của họ.
- source_word: בַּנָּחַל
  choice: trong lòng suối cạn
  rationale: נחל ở đây có thể chỉ thung lũng có dòng nước theo mùa hoặc lòng suối thường khô. “Lòng suối cạn” diễn đạt địa hình rõ ràng hơn từ vay mượn “wadi” đối với độc giả Việt phổ thông.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: và tìm thấy ở đó
  rationale: Giữ trình tự kể chuyện và trạng từ chỉ nơi chốn שָׁם.
- source_word: בְּאֵר
  choice: một giếng
  rationale: באר chỉ giếng; cụm theo sau mô tả loại nước có trong giếng.
- source_word: מַיִם חַיִּים
  choice: nước nguồn
  rationale: Thành ngữ Hê-bơ-rơ, sát chữ là “nước sống”, chỉ nước tươi hoặc nước chảy từ nguồn, đối lập với nước tù. “Nước nguồn” truyền đạt nghĩa trong tiếng Việt tự nhiên, còn nghĩa sát chữ được bảo tồn trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “lòng suối cạn” thay cho từ vay mượn “wadi”; dùng “nước nguồn” trong chính văn để tiếng Việt tự nhiên, đồng thời chú thích giữ thành ngữ nguyên ngữ và dư âm Kinh Thánh của “nước sống”.
