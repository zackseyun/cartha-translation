  to: Các đầy tớ của Y-sác đào trong khe suối[a] và tìm thấy ở đó một giếng có nước nguồn[b].
  rationale: Thay “lòng suối cạn” bằng “khe suối” để giữ nghĩa địa hình của נחל mà không thêm ý rằng nó đang cạn. Chỉnh chú thích a cho nhất quán với chính văn và tránh khẳng định không cần thiết về thời gian khô cạn. Các lựa chọn còn lại được giữ nguyên vì trung thành với nguyên ngữ và tự nhiên trong tiếng Việt hiện đại.
