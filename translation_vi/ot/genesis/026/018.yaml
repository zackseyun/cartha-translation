  to: Sau đó, Y-sác lại đào những giếng nước đã được đào vào thời Áp-ra-ham, cha mình[a], mà người Phi-li-tin đã lấp sau khi Áp-ra-ham qua đời. Ông gọi các giếng ấy bằng đúng những tên mà cha mình đã gọi chúng.
  rationale: Sửa liên từ để không thêm quan hệ đối lập ngoài nguyên văn, và thêm “đúng” ở mệnh đề đặt tên để phản ánh ý các tên tương ứng/cùng những tên mà Áp-ra-ham đã gọi các giếng. Chú thích về וַיָּשָׁב vẫn phù hợp và được giữ nguyên.
