base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: vi
  text: Sau đó, Y-sác lại đào những giếng nước đã được đào vào thời Áp-ra-ham, cha mình[a], mà người Phi-li-tin đã lấp sau khi Áp-ra-ham qua đời. Ông gọi các giếng ấy bằng đúng những tên mà cha mình đã gọi chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Y-sác trở lại và đào.” Động từ Hê-bơ-rơ có thể chỉ sự trở lại, nhưng trong cấu trúc này có lẽ diễn tả việc làm lại một hành động: “lại đào.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב יִצְחָק וַיַּחְפֹּר
  choice: Y-sác lại đào
  rationale: שוב đứng trước động từ tiếp theo diễn tả việc tiếp tục hay làm lại hành động; “lại đào” tự nhiên trong tiếng Việt và không khiến người đọc hiểu nhầm là Y-sác trở về một nơi nào đó.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: những giếng nước
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ rõ ý đây là các nguồn nước.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: đã được đào vào thời Áp-ra-ham, cha mình
  rationale: Động từ số nhiều không nêu chủ thể được chuyển sang thể bị động tự nhiên; “vào thời” truyền đạt thành ngữ thời gian בימי.
- source_word: וַיְסַתְּמוּם
  choice: bị ... lấp lại
  rationale: סתם chỉ việc bịt hoặc lấp giếng. “Lấp lại” phù hợp ngữ cảnh giếng vốn có từ trước mà sau đó bị làm cho không sử dụng được.
- source_word: פְּלִשְׁתִּים
  choice: người Phi-li-tin
  rationale: Tên gọi quen dùng trong tiếng Việt cho dân tộc này.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: sau khi Áp-ra-ham qua đời
  rationale: Cách diễn đạt hiện đại, trang trọng và chính xác về quan hệ thời gian.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת
  choice: Ông đặt cho các giếng ấy ... tên
  rationale: קרא kết hợp với “tên” diễn tả việc gọi hoặc đặt tên; cách dịch này tự nhiên và giữ đối tượng quy chiếu rõ ràng.
- source_word: כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: những tên mà cha mình đã đặt
  rationale: Tiền tố כ־ biểu thị sự tương ứng với những tên Áp-ra-ham đã đặt trước đó; ngữ cảnh cho thấy Y-sác dùng lại các tên ấy.
