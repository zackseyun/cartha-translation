  source_fidelity: Bản dịch truyền đạt đúng mốc tuổi, hành động kết hôn, tên hai người nữ, quan hệ cha–con gái, và căn tính Hê-tít của Bê-ê-ri và Ê-lôn. Tuy nhiên, dấu phẩy hiện có có thể khiến cụm “người Hê-tít” được đọc là bổ nghĩa cho các người con gái thay vì cho người cha, trong khi nguyên văn đặt danh xưng này sau tên Bê-ê-ri và Ê-lôn.
  naturalness: “Khi Ê-sau được bốn mươi tuổi” là cách nói tự nhiên, phù hợp văn kể chuyện. Đặt “làm vợ” sau cả hai tên giúp câu tiếng Việt sáng rõ rằng cả Giu-đít lẫn Ba-sê-mát là vợ của Ê-sau.
  terminology: 'Các tên riêng phiên âm nhất quán và dễ đọc: Ê-sau, Giu-đít, Bê-ê-ri, Ba-sê-mát, Ê-lôn. “người Hê-tít” là cách gọi dân tộc tự nhiên, phù hợp ngữ cảnh.'
