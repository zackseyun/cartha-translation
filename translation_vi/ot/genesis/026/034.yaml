base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: vi
  text: Khi Ê-sau được bốn mươi tuổi, ông lấy Giu-đít, con gái Bê-ê-ri, người Hê-tít, và Ba-sê-mát, con gái Ê-lôn, người Hê-tít, làm vợ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ông lấy một người vợ: Giu-đít… và Ba-sê-mát…”. Tiếng Hê-bơ-rơ dùng danh từ số ít “vợ/người phụ nữ” trước khi nêu tên hai phụ nữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... בֶּן אַרְבָּעִים שָׁנָה
  choice: Khi Ê-sau được bốn mươi tuổi
  rationale: Diễn đạt tự nhiên công thức chỉ tuổi trong tiếng Hê-bơ-rơ, đồng thời thể hiện chức năng mở đầu bối cảnh thời gian của וַיְהִי.
- source_word: וַיִּקַּח אִשָּׁה
  choice: ông lấy làm vợ
  rationale: Giữ số ít của אִשָּׁה trong câu chính và chuyển tải ý kết hôn của động từ לקח trong ngữ cảnh; chú thích giải thích việc sau đó bản Hê-bơ-rơ nêu tên hai phụ nữ.
- source_word: יְהוּדִית
  choice: Giu-đít
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: בְּאֵרִי
  choice: Bê-ê-ri
  rationale: Phiên âm tên riêng Hê-bơ-rơ, giữ rõ các âm tiết.
- source_word: הַחִתִּי
  choice: người Hê-tít
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho danh từ chỉ sắc tộc có mạo từ xác định.
- source_word: בָּשְׂמַת
  choice: Ba-sê-mát
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách dễ đọc trong tiếng Việt.
- source_word: אֵילֹן
  choice: Ê-lôn
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách quen thuộc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dùng từ phổ thông hiện đại. Đại từ “ông” phù hợp với nhân vật trưởng thành và tránh lặp tên. Giữ cấu trúc số ít khác thường của nguyên văn trong câu chính, đồng thời làm rõ bằng chú thích.
