  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc “Y-sác” và “Ghê-ra”; cấu trúc câu giữ nhịp kể chuyện tuần tự của nguyên văn.
