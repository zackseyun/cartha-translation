base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: vi
  text: Vậy, Y-sác rời khỏi đó, hạ trại trong thung lũng Ghê-ra[a] và cư ngụ tại đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khe suối Ghê-ra” hoặc “lòng suối Ghê-ra.” Từ Hê-bơ-rơ có thể chỉ một lòng suối theo mùa, khe núi hoặc thung lũng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: rời khỏi đó
  rationale: Cụm này diễn tả Y-sác đi khỏi địa điểm trước đó; “rời khỏi đó” tự nhiên và thể hiện rõ sự chuyển đi trong mạch truyện.
- source_word: וַיִּחַן
  choice: hạ trại
  rationale: Động từ חנה chỉ việc dựng hoặc đóng trại. “Hạ trại” là cách diễn đạt hiện đại, gọn và phù hợp với lối sống du mục trong ngữ cảnh.
- source_word: בְּנַחַל גְּרָר
  choice: trong thung lũng Ghê-ra
  rationale: נחל có thể chỉ thung lũng, khe núi hoặc lòng suối theo mùa. “Thung lũng” dễ hiểu trong bản văn chính, còn chú thích giữ lại phạm vi nghĩa địa hình.
- source_word: וַיֵּשֶׁב
  choice: cư ngụ
  rationale: ישב ở đây nói đến việc ở lại hoặc định cư. “Cư ngụ” trang trọng vừa phải và giữ được bước chuyển từ hạ trại sang ở tại nơi ấy.
- source_word: שָׁם
  choice: tại đó
  rationale: Trạng từ địa điểm này quy chiếu trực tiếp về thung lũng Ghê-ra.
theological_decisions: []
