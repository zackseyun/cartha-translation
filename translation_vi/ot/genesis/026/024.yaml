source:
  edition: WLC
  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: vi
  text: 'Đêm ấy, Yahweh hiện ra với ông và phán: “Ta là Đức Chúa Trời của Áp-ra-ham, cha con. Đừng sợ[a], vì Ta ở cùng con. Ta sẽ ban phước cho con và làm cho dòng dõi con[b] thêm đông đảo vì cớ Áp-ra-ham, tôi tớ Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng khiếp sợ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “hạt giống”; từ Hê-bơ-rơ ở dạng số ít nhưng mang nghĩa tập hợp, chỉ dòng dõi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước của Đức Chúa Trời bằng dạng chuyển tự Yahweh, thay vì thay thế bằng một tước hiệu.
- source_word: וַיֵּרָא אֵלָיו
  choice: hiện ra với ông
  rationale: Diễn đạt tự nhiên thể Niphal của ראה, chỉ sự hiện đến hữu hình hoặc sự bày tỏ trực tiếp cho Y-sác.
- source_word: בַּלַּיְלָה הַהוּא
  choice: Đêm ấy
  rationale: Giữ sắc thái chỉ định của הַהוּא bằng cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Ta là Đức Chúa Trời của Áp-ra-ham, cha con
  rationale: Bám sát quan hệ cú pháp của nguyên văn, trong đó Áp-ra-ham được xác định là cha của người nghe.
- source_word: אַל תִּירָא
  choice: Đừng sợ
  rationale: Cách nói ngắn gọn, trực tiếp, tự nhiên, giữ nguyên sắc thái mệnh lệnh trấn an.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: vì Ta ở cùng con
  rationale: כִּי nêu lý do cho mệnh lệnh đừng sợ; 'vì' thể hiện rõ quan hệ giải thích ấy.
- source_word: וּבֵרַכְתִּיךָ
  choice: Ta sẽ ban phước cho con
  rationale: Dạng động từ trong ngữ cảnh lời hứa được diễn đạt bằng thì tương lai; 'ban phước' phù hợp văn phong Kinh Thánh hiện đại và trang trọng.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: và làm cho dòng dõi con thêm đông đảo
  rationale: Diễn đạt rõ nghĩa tác động của Hiphil רבה là làm cho nhiều lên, đồng thời dùng lối nói tự nhiên trong tiếng Việt.
- source_word: זַרְעֲךָ
  choice: dòng dõi con
  rationale: Truyền đạt nghĩa tập hợp chỉ hậu duệ của danh từ số ít זֶרַע; tự nhiên hơn nghĩa đen 'hạt giống' trong ngữ cảnh này.
- source_word: בַּעֲבוּר
  choice: vì cớ
  rationale: Giữ sắc thái nền tảng hoặc nguyên do của lời hứa, đồng thời không giải thích quá mức bản chất chính xác của mối liên hệ giao ước.
- source_word: עַבְדִּי
  choice: tôi tớ Ta
  rationale: Trong ngữ cảnh giao ước, từ này nhấn mạnh địa vị phụng sự và thuộc về Đức Chúa Trời hơn là tình trạng nô lệ xã hội.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm; dạng 'Yahweh' bảo tồn danh ấy thay vì thay bằng tước hiệu.
- issue: Cơ sở của lời hứa trong בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: vì cớ Áp-ra-ham, tôi tớ Ta
  alternative: bởi Áp-ra-ham, tôi tớ Ta; vì lợi ích của Áp-ra-ham, tôi tớ Ta
  rationale: Cách dịch giữ mối liên hệ giữa lời hứa dành cho Y-sác và Áp-ra-ham, nhưng không xác định quá mức rằng cụm từ chỉ nguyên nhân, công trạng hay lợi ích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” thể hiện lời phán trực tiếp của Đức Chúa Trời với Y-sác. Các tên riêng dùng dạng quen thuộc trong tiếng Việt; cấu trúc câu tránh lối dịch quá sát gây cứng, nhưng vẫn giữ trật tự và quan hệ ý nghĩa chính của nguyên văn.
