  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל יִצְחָ֑ק לֵ֚ךְ מֵֽ/עִמָּ֔/נוּ כִּֽי עָצַֽמְתָּ מִמֶּ֖/נּוּ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: vi
  text: 'Bấy giờ, A-bi-mê-léc nói với Y-sác: “Hãy rời khỏi chúng tôi, vì ông đã trở nên mạnh hơn chúng tôi rất nhiều.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông đã trở nên rất hùng mạnh so với chúng tôi.”'
    reason: Giữ lại sắc thái từ vựng của עָצַם, có thể nhấn mạnh sự hùng mạnh hoặc quyền thế, thay vì chỉ sức mạnh theo nghĩa rộng.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... nói
  rationale: Dạng tự sự với waw liên tiếp đẩy câu chuyện tiến lên; “Bấy giờ” diễn đạt tự nhiên trình tự ấy trong tiếng Việt hiện đại.
- source_word: אֲבִימֶלֶךְ
  choice: A-bi-mê-léc
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: אֶל יִצְחָק
  choice: với Y-sác
  rationale: אֶל giới thiệu người được nói với; “nói với Y-sác” là cách diễn đạt tự nhiên trong tiếng Việt. Tên יִצְחָק được phiên âm là “Y-sác”.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: Hãy rời khỏi chúng tôi
  rationale: Mệnh lệnh לֵךְ kết hợp với cụm chỉ sự tách khỏi מֵעִמָּנוּ mang nghĩa yêu cầu Y-sác ra đi, không còn ở giữa họ. “Hãy rời khỏi chúng tôi” giữ được cả mệnh lệnh lẫn ý phân cách.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do cho mệnh lệnh; “vì” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: עָצַמְתָ
  choice: ông đã trở nên mạnh
  rationale: Động từ diễn tả việc trở nên mạnh hoặc hùng mạnh. Đại từ “ông” phù hợp với lời nói trực tiếp giữa hai nhân vật trưởng thành và giữ sắc thái trang trọng tự nhiên.
- source_word: מִמֶּנּוּ מְאֹד
  choice: hơn chúng tôi rất nhiều
  rationale: מִן được dùng để tạo thế so sánh, còn מְאֹד nhấn mạnh mức độ; cụm tiếng Việt này diễn đạt rõ “mạnh hơn chúng tôi rất nhiều” mà không thêm ý “quá mức” vốn không được nói thẳng trong từ ngữ Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu trực tiếp giữ sắc thái dứt khoát của mệnh lệnh, đồng thời không diễn giải thêm động cơ chính trị hay hàm ý rằng Y-sác đã trở nên “quá” mạnh.
