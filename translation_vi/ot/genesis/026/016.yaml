  source_fidelity: 'Bản dịch phản ánh chính xác các thành tố chính của tiếng Hê-bơ-rơ: trình tự tự sự (“Bấy giờ”), lời nói của A-bi-mê-léc với Y-sác, mệnh lệnh rời đi, quan hệ nguyên nhân (“vì”), và so sánh được nhấn mạnh bởi מְאֹד: Y-sác đã trở nên mạnh hơn họ rất nhiều. Không thêm ý “quá mạnh” hay một động cơ chính trị cụ thể.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. “Hãy rời khỏi chúng tôi” tự nhiên trong lời yêu cầu dứt khoát; “mạnh hơn chúng tôi rất nhiều” diễn đạt mạch lạc cấu trúc so sánh.
  terminology: Cách phiên âm A-bi-mê-léc và Y-sác nhất quán với lối phiên âm Kinh Thánh Việt ngữ trong bản dự thảo. “Mạnh” là tương đương an toàn cho עָצַם trong ngữ cảnh này. Chú thích nêu khả năng “hùng mạnh” mà không áp đặt nghĩa thần học hoặc chính trị.
