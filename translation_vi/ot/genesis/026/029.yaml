  source_fidelity: Bản dịch xử lý đúng אִם theo giá trị thành ngữ trong bối cảnh lời thề và giữ được sự nhấn mạnh của רַק (“chỉ”). Tuy nhiên, “rồi để anh ra đi” làm nhẹ động từ וַנְּשַׁלֵּחֲךָ, vốn khẳng định hành động quá khứ của họ là đã sai/phái Y-sác đi. Cần dùng cách diễn đạt có tác động chủ động hơn và duy trì chuỗi hồi cố quá khứ.
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng vừa phải. “Đụng chạm đến” tự nhiên hơn “đụng đến” trong văn cảnh này, đồng thời giảm khả năng gợi liên tưởng khẩu ngữ không chủ ý. Cấu trúc “đã không... và đã chỉ...” làm rõ hai tuyên bố quá khứ song hành.
