  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִם תַּעֲשֵׂ֨ה עִמָּ֜/נוּ רָעָ֗ה כַּ/אֲשֶׁר֙ לֹ֣א נְגַֽעֲנ֔וּ/ךָ וְ/כַ/אֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּ/ךָ֙ רַק ט֔וֹב וַ/נְּשַׁלֵּֽחֲ/ךָ֖ בְּ/שָׁל֑וֹם אַתָּ֥ה עַתָּ֖ה בְּר֥וּךְ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/029.yaml
  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: vi
  text: rằng anh sẽ không làm hại chúng tôi,[a] cũng như chúng tôi đã không đụng chạm đến anh[b] và đã chỉ làm điều tốt cho anh, rồi đã cho anh ra đi bình an.[c] Nay anh là người được Yahweh ban phước.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát chữ: “nếu anh làm hại chúng tôi.” Trong ngữ cảnh này, từ Hê-bơ-rơ אִם (“nếu”) có lẽ mở đầu nội dung lời thề mà họ yêu cầu Y-sác cam kết.'
    reason: lexical_alternative
  - marker: b
    text: “Đụng chạm đến” trong ngữ cảnh này cũng có thể mang nghĩa “làm hại.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “và cho anh ra đi bình an.”'
    reason: aspectual_alternative
lexical_decisions:
- source_word: אִם
  choice: rằng ... không
  rationale: Trong mạch lời thề giao ước từ câu trước, אִם mở đầu nội dung điều họ yêu cầu Y-sác cam kết; tiếng Việt tự nhiên dùng “rằng ... không”, đồng thời ghi chú giữ nghĩa điều kiện sát chữ.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: anh sẽ không làm hại chúng tôi
  rationale: Cụm עשה עם רעה trong ngữ cảnh hiệp ước bất tương xâm có nghĩa làm điều gây hại; “làm hại” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: נְגַעֲנוּךָ
  choice: chúng tôi đã không đụng đến anh
  rationale: Giữ nghĩa cụ thể căn bản của נגע là “đụng/chạm”, không xóa sắc thái có thể ngụ ý xâm hại; sắc thái ấy được nêu trong chú thích.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: chỉ làm điều tốt cho anh
  rationale: “Chỉ” bảo toàn sự nhấn mạnh của רַק, còn “làm điều tốt cho” diễn đạt trực tiếp cấu trúc Hê-bơ-rơ bằng tiếng Việt tự nhiên.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: rồi để anh ra đi bình an
  rationale: שלח trong bối cảnh này là cho hoặc để người kia rời đi; “bình an” giữ chiều kích an toàn và quan hệ hòa bình của שָׁלוֹם. “Rồi” thể hiện sự tiếp nối của động từ mà không buộc phải xác định sắc thái hoàn thành.
- source_word: בְּרוּךְ יְהוָה
  choice: người được Yahweh ban phước
  rationale: Diễn đạt phân từ bị động בָּרוּךְ một cách tự nhiên trong tiếng Việt và giữ nguyên danh giao ước Yahweh.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh xưng יְהוָה; “Yahweh” bảo toàn tính chất tên riêng thay vì thay bằng một tước hiệu.
- issue: Tác nhân của phước lành trong בְּרוּךְ יְהוָה
  choice: được Yahweh ban phước
  alternative: người được phước của Yahweh
  rationale: Cách dịch chính diễn đạt lối hiểu tự nhiên rằng Yahweh là Đấng ban phước, nhưng không mở rộng nội dung phước lành hay gán thêm ý nghĩa giáo lý.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “anh” cho lời nhóm người nói trực tiếp với Y-sác, phù hợp quan hệ giữa các bên trưởng thành mà không thêm sắc thái tôn ti quá mức. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
