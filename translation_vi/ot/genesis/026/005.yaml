  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: vi
  text: vì Áp-ra-ham đã nghe theo tiếng ta và tuân giữ điều ta giao phó[a], các điều răn, các luật lệ và những lời chỉ dạy của ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trách nhiệm ta giao.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các luật pháp của ta.” Từ Hê-bơ-rơ torah có thể có nghĩa là luật pháp, sự chỉ dạy hoặc giáo huấn, tùy văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: vì
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân với lời hứa ở văn mạch trước.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: đã nghe theo tiếng ta
  rationale: Giữ hình ảnh nghe tiếng trong tiếng Hê-bơ-rơ, đồng thời truyền đạt ý nghe với sự vâng phục.
- source_word: וַיִּשְׁמֹר
  choice: tuân giữ
  rationale: Phù hợp với các đối tượng mang tính giao ước và pháp quy, bao hàm ý giữ gìn và thực hành.
- source_word: מִשְׁמַרְתִּי
  choice: điều ta giao phó
  rationale: Diễn tả điều được trao để gìn giữ, đồng thời phân biệt với các thuật ngữ pháp quy theo sau.
- source_word: מִצְוֺתַי
  choice: các điều răn
  rationale: Cách dịch rõ ràng, quen thuộc của מִצְוָה trong ngữ cảnh giao ước.
- source_word: חֻקּוֹתַי
  choice: các luật lệ
  rationale: Giữ sắc thái quy định đã được thiết lập và phân biệt tương đối với 'điều răn'.
- source_word: וְתוֹרֹתָי
  choice: và những lời chỉ dạy của ta
  rationale: תּוֹרָה có nghĩa nền tảng là sự chỉ dạy; dạng số nhiều được thể hiện bằng 'những lời', tránh thu hẹp từ này chỉ còn nghĩa luật pháp.
theological_decisions:
- issue: Cụm thuật ngữ giao ước/pháp quy xuất hiện trước Sinai
  choice: 'Giữ đầy đủ các hạng mục riêng biệt: điều giao phó, điều răn, luật lệ và lời chỉ dạy.'
  alternative: Gộp thành một cụm như 'mọi mệnh lệnh và luật pháp của ta', hoặc dịch תורותי là 'các luật pháp'.
  rationale: Cách dịch bảo toàn phép liệt kê nhấn mạnh sự vâng phục toàn diện của Áp-ra-ham và không giải quyết thay bản văn mối căng thẳng về các phạm trù Torah trước Sinai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta” phù hợp với lời Đức Chúa Trời trực tiếp phán; giữ nhịp liệt kê của nguyên văn và không nhập các thuật ngữ gần nghĩa thành một.
