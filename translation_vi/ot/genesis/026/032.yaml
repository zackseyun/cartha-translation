base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: vi
  text: 'Vào ngày hôm ấy[a], các đầy tớ[b] của Y-sác đến báo cho ông về giếng mà họ đã đào. Họ nói với ông: “Chúng tôi đã tìm thấy nước.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngay trong ngày ấy” hoặc “trong cùng ngày ấy”, nhấn mạnh việc họ báo tin vào chính ngày diễn ra các sự việc ngay trước đó.'
    reason: Giải thích cách hiểu khả dĩ của cụm thời gian Hê-bơ-rơ בַּיּוֹם הַהוּא, theo hồ sơ kiểm chứng tiếng Anh.
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “đầy tớ” cũng có thể chỉ “nô lệ”; ở đây ngữ cảnh không nhấn mạnh sắc thái địa vị xã hội ấy.
    reason: Ghi nhận phạm vi nghĩa của עֶבֶד và neo chú thích trực tiếp tại từ được giải thích.
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: Ngay trong ngày ấy
  rationale: Cụm dẫn nhập và thời gian nối sự việc này với các biến cố vừa kể; “ngay trong ngày ấy” diễn đạt tự nhiên đồng thời làm rõ lực chỉ định của הַהוּא.
- source_word: עַבְדֵי יִצְחָק
  choice: các đầy tớ của Y-sác
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ; trong ngữ cảnh này họ là những người thuộc nhà Y-sác làm công việc đào giếng, và câu không nhấn mạnh địa vị pháp lý của họ.
- source_word: וַיַּגִּדוּ לוֹ
  choice: đến báo cho ông
  rationale: Hiphil của נגד mang nghĩa báo hoặc thuật lại; “báo cho ông” tự nhiên trong ngữ cảnh những người đào giếng đem tin đến.
- source_word: עַל אֹדוֹת הַבְּאֵר אֲשֶׁר חָפָרוּ
  choice: về cái giếng họ đã đào
  rationale: Giữ quan hệ chỉ định của mệnh đề אֲשֶׁר; “đã đào” thể hiện việc đào xảy ra trước lúc họ báo tin.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Họ nói với ông
  rationale: Giữ nguyên lời dẫn trực tiếp tách biệt trong tiếng Hê-bơ-rơ, nhưng dùng câu mới để tiếng Việt sáng rõ và tự nhiên.
- source_word: מָצָאנוּ מָיִם
  choice: Chúng tôi đã tìm thấy nước
  rationale: מצא chỉ việc tìm thấy, còn מַיִם không xác định lượng; “đã tìm thấy nước” truyền đạt kết quả vừa được phát hiện mà không thêm ý “một ít”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng “Y-sác” theo lối phiên âm Kinh Thánh Việt quen thuộc; đại từ “ông” tránh lặp tên nhưng vẫn giữ sự kính trọng. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
