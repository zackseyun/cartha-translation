    issue: Chú thích a không tương ứng với nội dung chú thích trong hồ sơ tiếng Anh và không giải thích cụm được neo.
    rationale: Ký hiệu a hiện được đặt sau “đã đào”, nhưng chú thích tiếng Anh a liên quan đến בַּיּוֹם הַהוּא (“vào/cùng ngày ấy”), không phải thời-thể của חָפָרוּ. Cần chuyển neo a về cụm thời gian và thay nội dung chú thích.
  - severity: medium
    issue: Chú thích b được đặt sau lời trích dẫn thay vì sau “đầy tớ”.
    rationale: Nội dung chú thích giải thích עַבְדֵי יִצְחָק; neo hiện tại có thể khiến người đọc hiểu nhầm chú thích liên quan đến lời “đã tìm thấy nước”.
