id: GEN.26.28
reference: Genesis 26:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: vi
  text: 'Họ nói: “Chúng tôi đã thấy rõ rằng Yahweh ở cùng ông. Vì thế, chúng tôi đã nói: ‘Xin cho có một lời thề giữa chúng tôi, giữa chúng tôi và ông; rồi chúng ta hãy lập giao ước với nhau.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Tiếp nối mạch kể chuyện tự nhiên trong tiếng Việt; không cần dịch liên từ waw một cách máy móc.
- source_word: רָאוֹ רָאִינוּ
  choice: chúng tôi đã thấy rõ
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn có tác dụng nhấn mạnh; “đã thấy rõ” vừa tự nhiên vừa giữ lực khẳng định.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: rằng Yahweh ở cùng ông
  rationale: Diễn đạt trạng thái đã được nhận thấy và vẫn có ý nghĩa ở hiện tại; tiếng Việt không bắt buộc đánh dấu thì như tiếng Anh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong bản nguồn, thay vì thay thế bằng một tước hiệu.
- source_word: וַנֹּאמֶר
  choice: Vì thế, chúng tôi nghĩ
  rationale: Trong ngữ cảnh, lời nói này dẫn vào điều họ đã bàn bạc và nay đề nghị với Y-sác; “vì thế” thể hiện quan hệ suy luận, còn “nghĩ” tránh lối lặp “chúng tôi nói” thiếu tự nhiên trong tiếng Việt.
- source_word: תְּהִי נָא
  choice: Xin hãy lập
  rationale: Giữ sắc thái thỉnh cầu lịch sự của thể mệnh lệnh nguyện vọng kèm נָא, đồng thời diễn đạt tự nhiên với danh từ “lời thề”.
- source_word: אָלָה
  choice: một lời thề
  rationale: Trong bối cảnh hiệp ước, đây là cách dịch rõ và tự nhiên; từ này có thể hàm ý lời thề kèm lời nguyền nếu vi phạm.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: giữa đôi bên, giữa chúng tôi và ông
  rationale: Giữ được tính song phương và phần lặp nhấn mạnh của tiếng Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְנִכְרְתָה בְרִית עִמָּךְ
  choice: và chúng ta hãy lập giao ước với nhau
  rationale: “Lập giao ước” chuyển tải thành ngữ Hê-bơ-rơ nghĩa đen là “cắt giao ước”; “với nhau” diễn đạt tính tương hỗ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn dùng trực tiếp danh riêng יהוה; giữ “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của אָלָה
  choice: lời thề
  alternative: lời thề nguyền
  rationale: “Lời thề” phù hợp nhất trong chính văn; không loại bỏ sắc thái tự nguyền rủa khi vi phạm, vốn có thể được giải thích nếu cần.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” vì nhóm sứ giả đang nói với Y-sác; dùng “đôi bên” để làm rõ cấu trúc song phương nhưng vẫn giữ phần nhắc lại của nguyên văn.
