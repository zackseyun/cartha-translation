  text: Vậy, Y-sác ở lại Ghê-ra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ở lại
  rationale: Động từ ישׁב ở dạng kể chuyện chỉ hành động trong quá khứ; trong ngữ cảnh này, Y-sác lưu lại và cư trú tại nơi Đức Chúa Trời vừa bảo ông đừng rời đi. “Ở lại” tự nhiên trong tiếng Việt hiện đại và không hàm ý định cư vĩnh viễn.
- source_word: יִצְחָק
  choice: Y-sác
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: בִּגְרָר
  choice: tại Ghê-ra
  rationale: Giới từ בְּ đánh dấu địa điểm; “tại” diễn đạt rõ quan hệ vị trí với địa danh Ghê-ra.
- source_word: וַ
  choice: Vậy
  rationale: Waw nối tiếp vừa tiếp diễn mạch kể vừa cho thấy hành động của Y-sác là sự đáp lại lời truyền ở câu trước; “Vậy” thể hiện quan hệ ấy tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Câu văn ngắn gọn, trang trọng vừa phải và tự nhiên trong tiếng Việt hiện đại. Dùng “ở lại” để giữ sắc thái đáp lại mệnh lệnh ở văn cảnh trước, đồng thời tránh sắc thái cổ của “cư ngụ” và tính lâu dài quá mức của “định cư”.
