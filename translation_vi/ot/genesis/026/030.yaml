  text: וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/030.yaml
  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: vi
  text: Ông dọn một bữa tiệc cho họ[a], rồi họ ăn uống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một yến tiệc”; từ Hê-bơ-rơ này chỉ một bữa tiệc mà việc uống là một yếu tố nổi bật.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: dọn
  rationale: Động từ עשה có nghĩa cơ bản là “làm”, nhưng khi đi với מִשְׁתֶּה, tiếng Việt tự nhiên dùng “dọn” để diễn tả việc chuẩn bị và khoản đãi một bữa tiệc.
- source_word: לָהֶם
  choice: cho họ
  rationale: Giới từ ל ở đây chỉ những người được hưởng việc khoản đãi; “cho họ” là cách diễn đạt tự nhiên và sát nghĩa.
- source_word: מִשְׁתֶּה
  choice: bữa tiệc
  rationale: Danh từ này chỉ một yến tiệc hoặc bữa tiệc, thường có việc uống rượu là yếu tố đáng kể. “Bữa tiệc” rõ ràng, trang trọng vừa phải và phù hợp với hai hành động ăn và uống theo sau.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: rồi họ ăn uống
  rationale: Cụm “ăn uống” trong tiếng Việt truyền đạt tự nhiên hai hành động phối hợp, còn “rồi” thể hiện diễn tiến của chuỗi động từ kể chuyện.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, tự nhiên và trang trọng vừa phải. Đại từ “ông” duy trì chủ thể nam trong ngữ cảnh mà không lặp tên; “ăn uống” tránh lối diễn đạt cứng “ăn và uống” nhưng vẫn giữ đủ hai hành động của nguyên văn.
