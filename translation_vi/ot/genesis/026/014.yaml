base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/014.yaml
  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: vi
  text: Ông có bầy chiên dê, đàn bò và một lực lượng lao động đông đảo[a], và người Phi-li-tin ganh tị với ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “nhiều sự phục dịch/công việc”; cụm từ có lẽ chỉ một lực lượng đông đảo gồm người phục dịch hoặc người làm công.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ghen tức với ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Ông có
  rationale: Cấu trúc hiện hữu היה + ל diễn tả sự sở hữu; “ông có” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מִקְנֵה צֹאן
  choice: nhiều bầy chiên dê
  rationale: צֹאן chỉ gia súc nhỏ, gồm chiên và dê; “bầy chiên dê” truyền đạt phạm vi nghĩa rõ hơn chỉ “bầy chiên”.
- source_word: וּמִקְנֵה בָקָר
  choice: đàn bò
  rationale: בָקָר chỉ đại gia súc thuộc loài bò; “đàn bò” là cách gọi tập thể tự nhiên.
- source_word: וַעֲבֻדָּה רַבָּה
  choice: rất đông người phục dịch
  rationale: עֲבֻדָּה có thể chỉ công việc, sự phục dịch hoặc lực lượng lao động. Trong danh sách tài sản này, cụm từ nhiều khả năng nói đến một lực lượng người làm đông đảo, nhưng chú thích vẫn giữ nghĩa đen rộng hơn.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: ganh tị với ông
  rationale: קנא ở đây diễn tả lòng ganh tị trước sự thịnh vượng của Y-sác; cách nói này tự nhiên và không thêm động cơ ngoài văn bản.
- source_word: פְּלִשְׁתִּים
  choice: người Phi-li-tin
  rationale: Tên gọi quen thuộc trong tiếng Việt dành cho dân tộc này.
theological_decisions:
- issue: Quan hệ giữa sự giàu có của Y-sác và phản ứng của người Phi-li-tin
  choice: Dùng “nên” để thể hiện quan hệ hệ quả theo mạch câu
  alternative: Dùng “và” để bám sát liên từ וַ
  rationale: Trình tự và nội dung cho thấy sự ganh tị phát sinh trước tài sản cùng lực lượng lao động đông đảo của Y-sác; “nên” diễn đạt tự nhiên mà không đưa thêm một khẳng định thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chiên dê” để bao quát צֹאן, và “người phục dịch” thay vì thuật ngữ mang sắc thái thể chế hoặc quá cổ.
