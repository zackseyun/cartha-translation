  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: vi
  text: Trong xứ có một nạn đói, không kể nạn đói đầu tiên đã xảy ra vào thời Áp-ra-ham. Y-sác bèn đi đến gặp A-bi-mê-léc, vua dân Phi-li-tin, tại Ghê-ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “tại Ghê-ra” là “đến Ghê-ra”. Dạng Hê-bơ-rơ גְּרָרָה có hậu tố chỉ hướng, có thể biểu thị rõ sự chuyển động hướng đến Ghê-ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: Trong xứ xảy ra một nạn đói
  rationale: Diễn đạt tự nhiên hoàn cảnh mở đầu của trình thuật; אֶרֶץ chỉ vùng đất đang được nói đến, không phải toàn thể trái đất.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: ngoài nạn đói đầu tiên
  rationale: Giữ nghĩa bổ sung/đối chiếu của מִלְּבַד và sắc thái thứ tự của רִאשׁוֹן.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: đã xảy ra vào thời Áp-ra-ham
  rationale: Mệnh đề quan hệ xác định nạn đói trước đó bằng thời đại của Áp-ra-ham; “đã xảy ra” làm rõ sự kiện thuộc quá khứ trước mạch kể hiện tại.
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: Y-sác bèn đi
  rationale: “Bèn” chuyển mạch kể tự nhiên và gợi phản ứng trước hoàn cảnh vừa nêu mà không khẳng định quan hệ nhân quả quá mạnh.
- source_word: אֶל אֲבִימֶּלֶךְ
  choice: đến gặp A-bi-mê-léc
  rationale: אֶל hướng hành động đến một người; “đến gặp” tự nhiên hơn tiếng Việt so với chỉ “đến A-bi-mê-léc”.
- source_word: מֶלֶךְ פְּלִשְׁתִּים
  choice: vua dân Phi-li-tin
  rationale: Phản ánh minh bạch kết cấu sở thuộc và giữ danh xưng dân tộc-lịch sử theo lối phiên âm quen thuộc.
- source_word: גְּרָרָה
  choice: tại Ghê-ra
  rationale: Trong cú pháp câu, cách dịch này xác định nơi A-bi-mê-léc ở; hậu tố chỉ hướng vẫn cho phép cách hiểu “đến Ghê-ra”, được ghi ở chú thích.
theological_decisions:
- issue: Danh xưng lịch sử/dân tộc פְּלִשְׁתִּים
  choice: dân Phi-li-tin
  alternative: người Phi-li-tin
  rationale: Đây là danh xưng dân tộc-chính trị trực tiếp, không phải danh hiệu thần học; “dân Phi-li-tin” phù hợp sau từ “vua”.
- issue: Quan hệ giữa nạn đói và chuyến đi của Y-sác
  choice: bèn đi
  alternative: rồi đi
  rationale: Giữ sự nối tiếp có sắc thái đáp ứng trong וַיֵּלֶךְ nhưng không biến nó thành lời khẳng định nhân quả tuyệt đối như “vì thế” có thể hàm ý.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Tên riêng được phiên âm theo lối tiếng Việt thông dụng. Dấu chú thích được đặt sau “Ghê-ra”, đúng với từ ngữ mà chú thích giải thích.
