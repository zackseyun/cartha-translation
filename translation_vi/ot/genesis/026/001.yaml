revisions:
- from: Trong xứ xảy ra một nạn đói, ngoài nạn đói đầu tiên đã xảy ra vào thời Áp-ra-ham. Y-sác bèn đi đến gặp A-bi-mê-léc, vua dân Phi-li-tin, tại Ghê-ra.[a]
  to: Trong xứ có một nạn đói, không kể nạn đói đầu tiên đã xảy ra vào thời Áp-ra-ham. Y-sác bèn đi đến gặp A-bi-mê-léc, vua dân Phi-li-tin, tại Ghê-ra.[a]
  rationale: Bản sửa chỉ làm rõ quan hệ loại trừ của מִלְּבַד bằng “không kể” và cải thiện tính tự nhiên của câu mở đầu. Cách hiểu “tại Ghê-ra” vẫn được giữ trong thân bài, vì nó có thể xác định địa điểm của A-bi-mê-léc; chú thích bảo tồn khả năng dịch hướng đi của hậu tố chỉ hướng trên גְּרָרָה.
