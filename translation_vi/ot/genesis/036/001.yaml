id: GEN.36.1
reference: Genesis 36:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: vi
  text: Đây là dòng dõi của Ê-sau (tức là Ê-đôm).[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Và đây là dòng dõi của Ê-sau; ông là Ê-đôm.”'
    reason: Bảo lưu cách dịch sát hơn của liên từ וְ và đại từ הוּא.
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Đây là
  rationale: Cụm liên từ וְ với đại từ chỉ định אֵלֶּה mở đầu một phần mới. “Đây là” tự nhiên trong tiếng Việt và không biến וְ thành một từ chỉ thời gian vốn không có trong nguyên văn.
- source_word: תֹּלְדוֹת
  choice: dòng dõi
  rationale: תֹּלְדוֹת là công thức cấu trúc lặp lại trong Sáng Thế Ký, có thể bao hàm dòng hậu duệ và phần ký thuật liên quan. “Dòng dõi” giữ được mối liên hệ gia hệ trong ngữ cảnh này mà không thu hẹp thành một danh sách đơn thuần.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: הוּא
  choice: tức là
  rationale: Đại từ הוּא ở đây có thể được hiểu theo chức năng đồng vị, xác định Ê-sau chính là Ê-đôm. “Tức là” diễn đạt tự nhiên cách hiểu này; cách dịch sát hình thức hơn được giữ trong chú thích.
- source_word: אֱדוֹם
  choice: Ê-đôm
  rationale: Giữ tên riêng Ê-đôm, ở đây được đồng nhất với Ê-sau.
theological_decisions:
- issue: Cách dịch công thức תֹּלְדוֹת trong Sáng Thế Ký
  choice: dòng dõi
  alternative: phần ký thuật về; các hậu duệ của
  rationale: Đây chủ yếu là quyết định văn chương và từ vựng. “Dòng dõi” bảo tồn tính chất gia hệ và sự lặp lại của công thức, đồng thời tránh xác định dứt khoát rằng từ này chỉ có nghĩa là bản ký thuật hay chỉ là những hậu duệ.
- issue: Quan hệ giữa Ê-sau và Ê-đôm trong mệnh đề הוּא אֱדוֹם
  choice: tức là Ê-đôm
  alternative: ông là Ê-đôm
  rationale: Bản chính thể hiện quan hệ đồng nhất theo lối giải thích tự nhiên trong tiếng Việt, nhưng chú thích bảo lưu cấu trúc đại từ–vị ngữ trực tiếp của tiếng Hê-bơ-rơ, tránh xóa đi sắc thái mơ hồ về cú pháp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cách phiên âm Kinh Thánh quen thuộc “Ê-sau”, “Ê-đôm”; câu chính gọn như một tiêu đề gia hệ, còn chú thích giữ phương án sát cấu trúc Hê-bơ-rơ hơn.
