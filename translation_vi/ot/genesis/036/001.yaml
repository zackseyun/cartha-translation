  source_fidelity: 'Bản dịch phản ánh đúng công thức Hê-bơ-rơ: “Đây là” là cách mở đầu tự nhiên cho וְאֵלֶּה mà không thêm ý thời gian; “dòng dõi” phù hợp với תּוֹלְדוֹת trong ngữ cảnh gia hệ; và “tức là Ê-đôm” diễn đạt đúng quan hệ đồng nhất trong הוּא אֱדוֹם. Việc không đưa “và” vào bản chính là chấp nhận được trong tiếng Việt, trong khi chú thích đã bảo lưu phương án có liên từ.'
