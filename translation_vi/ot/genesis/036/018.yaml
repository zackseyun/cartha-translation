source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בְּנֵ֤י אָהֳלִֽיבָמָה֙ אֵ֣שֶׁת עֵשָׂ֔ו אַלּ֥וּף יְע֛וּשׁ אַלּ֥וּף יַעְלָ֖ם אַלּ֣וּף קֹ֑רַח אֵ֣לֶּה אַלּוּפֵ֞י אָֽהֳלִיבָמָ֛ה בַּת עֲנָ֖ה אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: vi
  text: 'Đây là các con trai của Ô-hô-li-ba-ma, vợ Ê-sau: tộc trưởng[a] Giê-úc, tộc trưởng Gia-lam và tộc trưởng Cô-ra. Đó là các tộc trưởng của Ô-hô-li-ba-ma, con gái A-na, vợ Ê-sau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thủ lĩnh.” Từ Hê-bơ-rơ chỉ những người lãnh đạo các nhóm hoặc thị tộc Ê-đôm.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Danh từ số nhiều giống đực chỉ các người con trai được nêu tên; không mở rộng thành “hậu duệ”.
- source_word: אֵשֶׁת עֵשָׂו
  choice: vợ Ê-sau
  rationale: Cách diễn đạt sở hữu tự nhiên trong tiếng Việt, được giữ nhất quán ở cả hai lần xuất hiện.
- source_word: אַלּוּף
  choice: tộc trưởng
  rationale: Trong Sáng Thế Ký 36, từ này chỉ người đứng đầu một nhóm hay thị tộc Ê-đôm; “tộc trưởng” vừa rõ nghĩa vừa phù hợp văn cảnh hơn từ cổ hoặc chức tước ngoại lai.
- source_word: יְעוּשׁ
  choice: Giê-úc
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: יַעְלָם
  choice: Gia-lam
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối tự nhiên trong tiếng Việt.
- source_word: קֹרַח
  choice: Cô-ra
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc trong tiếng Việt.
- source_word: אֵלֶּה אַלּוּפֵי
  choice: Đó là các tộc trưởng của
  rationale: Bám sát kết cấu Hê-bơ-rơ, không thêm ý “dòng dõi của”; “đó là” tạo lời tổng kết tự nhiên sau danh sách.
- source_word: בַּת עֲנָה
  choice: con gái A-na
  rationale: Chuyển ngữ trực tiếp kết cấu quan hệ thân tộc và giữ văn phong gia phả trang trọng.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: Đây là ... Đó là
  rationale: Giữ hai đại từ chỉ định tạo khung cho bản kê gia phả; tiếng Việt không cần thêm động từ quá khứ vì câu Hê-bơ-rơ không có động từ hữu hạn ở đây.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ cấu trúc gia phả súc tích. Dùng “tộc trưởng” để truyền đạt chức năng của אַלּוּף trong văn cảnh Ê-đôm, đồng thời ghi chú phương án rộng hơn. Mọi dấu chú thích đều có mặt trong chính văn.
