  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: vi
  text: Ô-hô-li-ba-ma sinh Gi-ê-út, Gia-lam và Cô-ra. Đó là những người con trai của Ê-sau, được sinh ra cho ông tại xứ Ca-na-an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: Ô-hô-li-ba-ma
  rationale: Phiên âm tên riêng theo âm tiết, phù hợp cách đọc tự nhiên trong tiếng Việt.
- source_word: יָלְדָה
  choice: sinh
  rationale: Giữ rõ chủ thể là người mẹ và văn phong gia phả súc tích.
- source_word: יעיש
  choice: Giê-út
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt; dạng văn bản WLC tương ứng tên thường được nhận diện là Jeush.
- source_word: יַעְלָם
  choice: Gia-lam
  rationale: Phiên âm tên riêng theo cách dễ đọc trong tiếng Việt.
- source_word: קֹרַח
  choice: Cô-ra
  rationale: Phiên âm tên riêng theo quy ước tiếng Việt.
- source_word: בְּנֵי
  choice: những người con trai
  rationale: Ngữ cảnh liệt kê các con trai cụ thể, nên giữ chính xác giới tính của בנים.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: sinh cho ông
  rationale: Phản ánh cấu trúc bị động và thành tố לוֹ mà không thêm chủ thể người mẹ vào mệnh đề quan hệ.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: tại xứ Ca-na-an
  rationale: Giữ danh từ אֶרֶץ và diễn đạt tự nhiên, trang trọng trong tiếng Việt.
