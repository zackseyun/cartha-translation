  source_fidelity: Bản dịch giữ đúng cấu trúc liệt kê và sự lặp lại của אַלּוּף trong tiếng Hê-bơ-rơ. “Tộc trưởng” diễn đạt phù hợp chức vị thủ lĩnh thị tộc của người Ê-đôm trong ngữ cảnh Sáng Thế Ký 36. Các tên riêng được phiên âm nhất quán và không bị diễn giải thành nghĩa từ vựng.
  naturalness: Câu ngắn gọn, trang trọng, tự nhiên trong văn phong danh sách gia phả/lãnh tụ. Cách lặp “tộc trưởng” trước từng tên bảo toàn nhịp điệu bản gốc.
  terminology: “Tộc trưởng” là lựa chọn chính xác hơn “công tước” mang tính truyền thống và cụ thể hơn “thủ lĩnh.” Chú thích nêu lựa chọn thay thế hợp lý và giải thích được phạm vi áp dụng của danh hiệu lặp lại trong câu.
