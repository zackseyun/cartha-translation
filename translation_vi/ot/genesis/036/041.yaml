  text: אַלּ֧וּף אָהֳלִיבָמָ֛ה אַלּ֥וּף אֵלָ֖ה אַלּ֥וּף פִּינֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/041.yaml
  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: vi
  text: Tộc trưởng Ô-hô-li-ba-ma[a], tộc trưởng Ê-la, tộc trưởng Pi-nôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thủ lĩnh”; từ Hê-bơ-rơ אַלּוּף chỉ người đứng đầu một thị tộc hoặc bộ tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: tộc trưởng
  rationale: Trong danh sách các thủ lĩnh Ê-đôm ở Sáng Thế Ký 36, từ này chỉ người đứng đầu một thị tộc hoặc bộ tộc. “Tộc trưởng” vừa gọn, tự nhiên trong tiếng Việt, vừa diễn đạt rõ vai trò hơn từ chung chung “thủ lĩnh”.
- source_word: אָהֳלִיבָמָה
  choice: Ô-hô-li-ba-ma
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc và quen thuộc trong tiếng Việt.
- source_word: אֵלָה
  choice: Ê-la
  rationale: Đây là tên riêng trong danh sách, không được hiểu theo nghĩa từ vựng thông thường.
- source_word: פִּינֹן
  choice: Pi-nôn
  rationale: Phiên âm trực tiếp tên riêng Hê-bơ-rơ, giữ dạng ngắn gọn và dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và cô đọng, giữ nguyên nhịp liệt kê lặp lại của bản Hê-bơ-rơ. Dấu chú thích [a] được đặt sau tên đầu tiên để giải thích danh hiệu lặp lại trong cả câu.
