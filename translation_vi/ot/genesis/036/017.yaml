revisions:
- from: 'Đây là các con trai của Rê-u-ên, con trai Ê-sau: thủ lĩnh[a] Na-hát, thủ lĩnh Xê-rách, thủ lĩnh Sam-ma và thủ lĩnh Mít-xa. Đó là các thủ lĩnh thuộc dòng Rê-u-ên trong xứ Ê-đôm. Họ là các con trai của Ba-sê-mát, vợ Ê-sau.'
  to: 'Và đây là các con trai của Rê-u-ên, con trai Ê-sau: thủ lĩnh[a] Na-hát, thủ lĩnh Xê-rách, thủ lĩnh Sam-ma, thủ lĩnh Mít-xa. Đó là các thủ lĩnh của Rê-u-ên trong xứ Ê-đôm. Đây là các con trai của Ba-sê-mát, vợ Ê-sau.'
  rationale: Bổ sung 'Và' để phản ánh liên từ đầu câu; thay cách giải thích 'thuộc dòng' bằng quan hệ sở hữu trực tiếp 'của Rê-u-ên'; và phục hồi công thức 'Đây là' ở câu cuối. Không thay đổi nội dung gia phả, thuật ngữ chủ chốt, hay chú thích từ vựng.
