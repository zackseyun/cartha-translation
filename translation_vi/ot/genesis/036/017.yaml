    rationale: '''Đây là'' bỏ liên từ וְ; thêm ''Và'' bảo toàn mạch nối của công thức gia phả mà vẫn tự nhiên.'
  - severity: low
    issue: Cụm 'thuộc dòng Rê-u-ên' giải thích thêm cho אַלּוּפֵי רְעוּאֵל.
    rationale: Nguyên văn nói trực tiếp 'các thủ lĩnh của Rê-u-ên'. 'Thuộc dòng' có thể phù hợp ngữ cảnh gia phả, nhưng xác định quan hệ theo cách diễn giải hơn bản văn.
  - severity: low
    issue: Câu kết dùng 'Họ là' thay cho công thức chỉ định 'אלה'.
    rationale: Không sai nghĩa, nhưng 'Đây là' phản ánh sát hơn sự lặp lại có chủ ý của nguyên văn.
