  text: וְ/אֵ֗לֶּה בְּנֵ֤י רְעוּאֵל֙ בֶּן עֵשָׂ֔ו אַלּ֥וּף נַ֨חַת֙ אַלּ֣וּף זֶ֔רַח אַלּ֥וּף שַׁמָּ֖ה אַלּ֣וּף מִזָּ֑ה אֵ֣לֶּה אַלּוּפֵ֤י רְעוּאֵל֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֕לֶּה בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: vi
  text: 'Và đây là các con trai của Rê-u-ên, con trai Ê-sau: thủ lĩnh[a] Na-hát, thủ lĩnh Xê-rách, thủ lĩnh Sam-ma, thủ lĩnh Mít-xa. Đó là các thủ lĩnh của Rê-u-ên trong xứ Ê-đôm. Đây là các con trai của Ba-sê-mát, vợ Ê-sau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: trưởng tộc. Từ Hê-bơ-rơ chỉ một người lãnh đạo bộ tộc hoặc thị tộc Ê-đôm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Mở đầu đơn vị gia phả mới bằng công thức tự nhiên trong tiếng Việt; mối liên kết với văn cảnh vẫn được thể hiện qua dòng kể liên tục.
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Danh sách nêu các hậu duệ nam được gọi đích danh, nên cách dịch này trực tiếp và chính xác hơn từ khái quát như “con cháu”.
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: Rê-u-ên, con trai Ê-sau
  rationale: Giữ quan hệ gia phả và chuyển cấu trúc đồng vị Hê-bơ-rơ sang tiếng Việt tự nhiên.
- source_word: אַלּוּף
  choice: thủ lĩnh
  rationale: Trong bối cảnh Ê-đôm, từ này chỉ người đứng đầu một đơn vị bộ tộc hoặc thị tộc; “thủ lĩnh” rõ nghĩa, hiện đại và không xác định quy mô tổ chức quá mức.
- source_word: נַחַת
  choice: Na-hát
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc trong tiếng Việt.
- source_word: זֶרַח
  choice: Xê-rách
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc trong tiếng Việt.
- source_word: שַׁמָּה
  choice: Sam-ma
  rationale: Phiên âm tên riêng, thể hiện phụ âm đôi của dạng Hê-bơ-rơ ở mức phù hợp với tiếng Việt.
- source_word: מִזָּה
  choice: Mít-xa
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc trong tiếng Việt.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: Đó là các thủ lĩnh thuộc dòng Rê-u-ên
  rationale: “Thuộc dòng Rê-u-ên” làm rõ quan hệ trong bản tóm lược gia phả mà không biến họ thành người do Rê-u-ên bổ nhiệm.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: trong xứ Ê-đôm
  rationale: Giữ danh từ “xứ/đất” có mặt trong nguyên văn, đồng thời dùng cách nói tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: Ba-sê-mát, vợ Ê-sau
  rationale: Giữ cụm đồng vị xác định dòng mẹ với dấu phẩy giúp câu tiếng Việt rõ ràng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ cấu trúc gia phả lặp lại của nguyên văn, nhưng dùng “Họ” ở câu cuối để tránh cách diễn đạt cứng trong tiếng Việt. Các tên riêng được phiên âm nhất quán theo âm tiết tiếng Việt.
