base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: vi
  text: Tộc trưởng Đi-sôn, tộc trưởng Ê-xe, tộc trưởng Đi-san. Đó là các tộc trưởng của người Hô-rít, theo từng thị tộc của họ[a] trong xứ Sê-i-rơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “theo các tộc trưởng của họ.” Cụm từ Hê-bơ-rơ có thể chỉ việc phân loại theo các tộc trưởng hoặc theo những nhóm, thị tộc do họ đứng đầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: tộc trưởng
  rationale: Trong Sáng Thế Ký 36, từ này chỉ người đứng đầu một nhóm thân tộc hay bộ tộc. “Tộc trưởng” vừa rõ nghĩa trong tiếng Việt hiện đại vừa giữ được bối cảnh xã hội của người Ê-đôm và Hô-rít; sự lặp lại của nguyên văn được bảo tồn.
- source_word: דִּשֹׁן / אֵצֶר / דִּישָׁן
  choice: Đi-sôn / Ê-xe / Đi-san
  rationale: Phiên âm các tên riêng theo lối viết quen thuộc trong Kinh Thánh tiếng Việt, đồng thời phân biệt rõ Đi-sôn với Đi-san như trong tiếng Hê-bơ-rơ.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: các tộc trưởng của người Hô-rít
  rationale: הַחֹרִי ở đây chỉ dân Hô-rít như một cộng đồng; cách dịch này tự nhiên và giữ rõ quan hệ giữa các tộc trưởng với dân ấy.
- source_word: לְאַלֻּפֵיהֶם
  choice: theo từng thị tộc của họ[a]
  rationale: Tiền tố לְ có chức năng phân loại, còn dạng số nhiều của אַלּוּף tại đây có thể chỉ các đơn vị hay nhóm nằm dưới quyền tộc trưởng. “Theo từng thị tộc” diễn đạt tự nhiên chức năng phân loại nhưng chú thích vẫn giữ cách hiểu sát mặt chữ.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: trong xứ Sê-i-rơ
  rationale: “Xứ Sê-i-rơ” là cách diễn đạt địa lý trang trọng, tự nhiên và phản ánh đầy đủ אֶרֶץ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc liệt kê lặp lại “tộc trưởng” được giữ theo nguyên văn; dấu chấm tách danh sách khỏi câu tổng kết để câu tiếng Việt sáng rõ.
