  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָ/זֶ֖רַח שַׁמָּ֣ה וּ/מִזָּ֑ה אֵ֣לֶּ֣ה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: vi
  text: 'Đây là các con trai của Rê-u-ên: Na-hát, Xê-rách, Sam-ma và Mít-xa. Họ là các con trai[a] của Ba-sê-mát, vợ Ê-sau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ở đây, “các con trai” được dùng theo nghĩa rộng là hậu duệ; những người này là cháu trai của Ba-sê-mát qua Rê-u-ên (xem câu 10).
    reason: Làm rõ phạm vi nghĩa của בְּנֵי và tránh cảm giác mâu thuẫn gia phả mà không thay thế cách diễn đạt của nguyên văn.
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Đây là
  rationale: Cụm liên từ và đại từ chỉ định mở đầu mục kế tiếp trong gia phả. Tiếng Việt tự nhiên không cần dịch riêng וְ là “và” ở đầu câu.
- source_word: בְּנֵי רְעוּאֵל
  choice: các con trai của Rê-u-ên
  rationale: Các cá nhân được kể tên là con trai trực tiếp của Rê-u-ên; cách dịch này chính xác và giữ công thức gia phả.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: Na-hát, Xê-rách, Sam-ma và Mít-xa
  rationale: Các tên riêng được phiên âm theo âm dạng Hê-bơ-rơ và trình bày theo quy ước liệt kê tự nhiên trong tiếng Việt.
- source_word: אֵלֶּה הָיוּ
  choice: Họ là
  rationale: Trong ngữ cảnh, đại từ “Họ” quy chiếu rõ đến bốn người vừa được kể tên; “là” diễn đạt tự nhiên công thức có động từ היה ở dạng quá khứ mà không tạo sắc thái thời gian gượng ép trong tiếng Việt.
- source_word: בְּנֵי בָשְׂמַת
  choice: các con trai của Ba-sê-mát
  rationale: Giữ nguyên từ quan hệ rộng בְּנֵי của bản Hê-bơ-rơ. Trong văn cảnh, họ là cháu trai của Ba-sê-mát qua Rê-u-ên, nhưng nguyên văn vẫn gọi họ là “các con trai” theo nghĩa hậu duệ.
- source_word: אֵשֶׁת עֵשָׂו
  choice: vợ Ê-sau
  rationale: Dịch tự nhiên cấu trúc sở thuộc Hê-bơ-rơ và giữ đúng sự nhận diện Ba-sê-mát.
theological_decisions:
- issue: Phạm vi nghĩa của בְּנֵי trong cụm “בְּנֵי בָשְׂמַת”
  choice: Giữ “các con trai” trong chính văn và chú thích nghĩa rộng là hậu duệ/cháu trai.
  alternative: Dịch thẳng là “các cháu trai của Ba-sê-mát”.
  rationale: Sáng Thế Ký 36:10 cho biết Rê-u-ên là con trai Ba-sê-mát, nên bốn người này xét theo quan hệ trực tiếp là cháu trai của bà. Tuy nhiên, בְּנֵי có thể chỉ con cái hoặc hậu duệ, và chính nguyên văn lặp lại từ này; giữ cách nói của nguồn đồng thời thêm chú thích bảo toàn cả độ chính xác văn bản lẫn sự rõ ràng về gia phả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Tên riêng được phiên âm nhất quán theo dạng Hê-bơ-rơ; câu văn giữ cấu trúc gia phả ngắn gọn. Dấu chú thích [a] xuất hiện ngay sau từ cần giải thích.
