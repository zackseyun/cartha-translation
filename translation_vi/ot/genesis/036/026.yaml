translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và dễ hiểu. Tên riêng được phiên âm nhất quán theo dạng Masoret, có dấu gạch nối để người đọc tiếng Việt nhận biết các âm tiết.
