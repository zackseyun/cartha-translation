base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: vi
  text: 'Đây là các con trai của Đi-san: Hêm-đan, Êch-ban, Dít-ran và Kê-ran.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Đây là
  rationale: Cụm liên từ và đại từ chỉ định mở đầu một danh sách gia phả. Tiếng Việt không cần dịch liên từ וְ bằng “Và” trong trường hợp này; “Đây là” tự nhiên và vẫn giữ chức năng giới thiệu của câu Hê-bơ-rơ không có động từ.
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Dạng liên kết có nghĩa trực tiếp là “các con trai của”; danh sách ngay sau đó nêu các hậu duệ nam trực tiếp, nên không mở rộng thành “con cháu”.
- source_word: דִישָׁן
  choice: Đi-san
  rationale: Tên riêng được phiên âm từ דִישָׁן theo cách đọc của bản Masoret, dùng chính tả tiếng Việt dễ đọc.
- source_word: חֶמְדָּן
  choice: Hêm-đan
  rationale: Tên riêng được phiên âm sát dạng Hê-bơ-rơ חֶמְדָּן.
- source_word: וְ/אֶשְׁבָּן
  choice: Ét-ban
  rationale: Tên riêng được phiên âm theo âm Hê-bơ-rơ; liên từ đi kèm được thể hiện tự nhiên qua cách liệt kê tiếng Việt.
- source_word: וְ/יִתְרָן
  choice: Dít-ran
  rationale: Tên riêng được phiên âm theo cách đọc Masoret của יִתְרָן; phụ âm đầu yod được biểu đạt bằng âm “D” theo quy ước phiên âm tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: וּ/כְרָן
  choice: và Kê-ran
  rationale: Liên từ được dịch rõ là “và” trước mục cuối; Kê-ran phản ánh phụ âm kaf và nguyên âm của dạng Masoret כְרָן.
