  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: vi
  text: 'Ê-sau lấy các con gái Ca-na-an làm vợ: A-đa, con gái Ê-lôn người Hê-tít, và Ô-hô-li-ba-ma, con gái A-na, con gái Xi-bê-ôn người Hê-vít.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “người Hê-vít.” Một số người đối chiếu và hài hòa các gia phả liên quan theo cách khác, kể cả việc hiểu là “người Hô-rít.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: lấy
  rationale: Giữ sát động từ Hê-bơ-rơ “lấy”; trong ngữ cảnh này, tiếng Việt tự nhiên hiểu là lấy làm vợ mà không cần diễn giải thêm thành “kết hôn với”.
- source_word: נָשָׁיו
  choice: các bà vợ mình
  rationale: Danh từ số nhiều kèm hậu tố sở hữu chỉ rõ các bà vợ của Ê-sau; “mình” quy chiếu tự nhiên về chủ ngữ trong câu tiếng Việt.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: từ những người con gái Ca-na-an
  rationale: Bảo lưu thành ngữ Hê-bơ-rơ “các con gái Ca-na-an”, đồng thời dùng “những người con gái” cho rõ đây là phụ nữ thuộc Ca-na-an.
- source_word: בַּת עֲנָה בַּת צִבְעוֹן
  choice: con gái A-na, cháu gái Xi-bê-ôn
  rationale: Ở chuỗi gia phả này, lần xuất hiện thứ hai của בַּת diễn tả quan hệ thế hệ tiếp theo; “cháu gái” là cách nói tiếng Việt rõ và tự nhiên, không làm thay đổi quan hệ được nêu.
- source_word: הַחִתִּי
  choice: người Hê-tít
  rationale: Dùng tên gọi dân tộc quen thuộc trong tiếng Việt và giữ định danh của Ê-lôn theo bản Hê-bơ-rơ.
- source_word: אָהֳלִיבָמָה
  choice: Ô-hô-li-ba-ma
  rationale: Phiên âm tên riêng theo cách đọc gần với hình thức Hê-bơ-rơ và phù hợp quy ước tên Kinh Thánh tiếng Việt.
- source_word: הַחִוִּי
  choice: người Hê-vít
  rationale: Bản Masoret đọc חִוִּי, tức “người Hê-vít”; bản dịch chính theo đúng chứng cứ văn bản nguồn.
theological_decisions:
- issue: Định danh dân tộc ở cuối câu
  choice: 'Theo bản Masoret: “người Hê-vít”.'
  alternative: Một số người đối chiếu các gia phả liên quan và hiểu là “người Hô-rít”.
  rationale: Đây là một căng thẳng về văn bản/gia phả. Bản chính giữ nguyên cách đọc của WLC thay vì âm thầm dung hòa, còn cách hiểu khác được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê gia phả, nhưng dùng “cháu gái” ở thế hệ thứ hai để câu tiếng Việt không gây hiểu nhầm rằng A-na và Xi-bê-ôn đều là cha trực tiếp của Ô-hô-li-ba-ma. Dấu chú thích được đặt sau “người Hê-vít”, đúng vị trí của vấn đề văn bản.
