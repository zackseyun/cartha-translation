base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: vi
  text: Đi-sôn, Ê-xe và Đi-san. Đó là các thủ lĩnh[a] của người Hô-rít, con cháu của Sê-i-rơ, trong xứ Ê-đôm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các trưởng tộc”.
    reason: Từ Hê-bơ-rơ אַלּוּפִים chỉ những người đứng đầu các nhóm thị tộc hoặc cộng đồng.
lexical_decisions:
- source_word: דִשׁוֹן
  choice: Đishôn
  rationale: Tên riêng được phiên âm sang tiếng Việt, đồng thời giữ khác biệt với דִישָׁן (Đi-san).
- source_word: אֵצֶר
  choice: Ê-xe
  rationale: Tên riêng được phiên âm tự nhiên theo âm nguồn Hê-bơ-rơ.
- source_word: דִישָׁן
  choice: Đi-san
  rationale: Tên riêng được phiên âm và phân biệt với Đishôn.
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Công thức chỉ định số nhiều; tiếng Việt dùng tự nhiên để giới thiệu sự đồng nhất của danh sách.
- source_word: אַלּוּפֵי
  choice: các thủ lĩnh
  rationale: Trong Sáng Thế Ký 36, từ này chỉ những người đứng đầu các nhóm thị tộc; 'thủ lĩnh' rõ nghĩa và trang trọng, không áp đặt một cơ cấu chính trị cụ thể.
- source_word: הַחֹרִי
  choice: người Hô-rít
  rationale: Danh từ dân tộc mang nghĩa tập thể; tiếng Việt tự nhiên dùng 'người Hô-rít'.
- source_word: בְּנֵי שֵׂעִיר
  choice: con cháu của Sê-i-rơ
  rationale: Trong văn cảnh gia phả, בְּנֵי có thể bao gồm hậu duệ nói chung; 'con cháu' tránh giới hạn không cần thiết vào con trai trực tiếp.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: trong xứ Ê-đôm
  rationale: Giữ đầy đủ yếu tố địa lý 'xứ/đất' của nguyên văn, bằng cách diễn đạt quen thuộc trong tiếng Việt.
theological_decisions: []
