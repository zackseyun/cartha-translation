  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp liệt kê ngắn của nguyên văn; dùng cách phiên âm tên riêng nhất quán và phân biệt hai tên gần âm Đishôn/Đi-san.
