source:
  edition: WLC
  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: vi
  text: Thủ lĩnh Mag-đi-ên[a], thủ lĩnh I-ram. Đó là các thủ lĩnh của Ê-đôm, theo các nơi cư ngụ của họ trong miền đất thuộc quyền sở hữu của họ[b]. Đó là Ê-sau[d], cha của Ê-đôm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thủ lĩnh thị tộc”. Từ Hê-bơ-rơ này có thể chỉ người đứng đầu một bộ tộc hoặc thị tộc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong miền đất họ chiếm hữu”.
    reason: lexical_alternative
  - marker: c
    text: Nghĩa là Ê-sau là tổ phụ của người Ê-đôm.
    reason: cultural_note
  - marker: d
    text: Cũng có thể dịch là “Người ấy là Ê-sau”.
    reason: previous_rendering
lexical_decisions:
- source_word: אַלּוּף
  choice: thủ lĩnh
  rationale: Trong Sáng Thế Ký 36, từ này chỉ những người đứng đầu các nhóm bộ tộc hoặc thị tộc Ê-đôm. “Thủ lĩnh” tự nhiên, trang trọng và không mang sắc thái phong tước lỗi thời.
- source_word: מַגְדִּיאֵל
  choice: Mác-đi-ên
  rationale: Tên riêng được phiên âm theo cách dễ đọc trong tiếng Việt hiện đại.
- source_word: עִירָם
  choice: Y-ram
  rationale: Tên riêng được phiên âm theo cách dễ đọc trong tiếng Việt hiện đại.
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Cụm chỉ định số nhiều mở đầu lời tổng kết danh sách; tiếng Việt không bắt buộc đánh dấu số nhiều trên động từ nối.
- source_word: אַלּוּפֵי אֱדֹם
  choice: các thủ lĩnh của Ê-đôm
  rationale: Lặp lại “thủ lĩnh” để giữ nhất quán với hai danh xưng đứng trước và thể hiện cấu trúc sở thuộc.
- source_word: לְמֹשְׁבֹתָם
  choice: theo các nơi cư ngụ của họ
  rationale: Giới từ לְ ở đây biểu thị sự phân loại hoặc sắp xếp theo địa điểm cư trú, không biểu thị chuyển động.
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: trong miền đất thuộc quyền sở hữu của họ
  rationale: Giữ ý nghĩa danh từ của אֲחֻזָּה là phần đất sở hữu, đồng thời diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: הוּא עֵשָׂו
  choice: Đó là Ê-sau
  rationale: Đây là lời xác định mang tính tổng kết cho toàn bộ gia phả; “Đó là” tránh khiến đại từ bị hiểu lầm là chỉ Y-ram, người vừa được nhắc đến.
- source_word: אֲבִי אֱדֹם
  choice: cha của Ê-đôm
  rationale: Giữ nguyên thành ngữ gia phả của tiếng Hê-bơ-rơ; “cha” ở đây có thể chỉ tổ phụ, không nhất thiết là cha trực tiếp.
theological_decisions:
- issue: Danh xưng gia phả dành cho Ê-sau với tư cách người khai sinh dân Ê-đôm
  choice: cha của Ê-đôm
  alternative: tổ phụ của Ê-đôm
  rationale: “Cha” bảo tồn hình ảnh và cách diễn đạt của nguyên văn, còn chú thích làm rõ ý nghĩa tổ tiên dân tộc mà không thêm một khẳng định thần học khác.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp với phần tổng kết gia phả. Dùng “thủ lĩnh” thay cho từ cổ hoặc danh hiệu phong kiến; giữ “cha của Ê-đôm” nhằm bảo tồn thành ngữ gia phả, kèm chú thích giải nghĩa.
