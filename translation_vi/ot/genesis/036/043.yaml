  source_fidelity: Cấu trúc câu, chức năng tổng kết của הוּא עֵשָׂו, và các cụm chỉ nơi cư ngụ तथा phần đất sở hữu đều được chuyển đạt trung thành. Tuy nhiên, tên עִירָם nên được phiên là “I-ram”, gần với nguyên ngữ và nhất quán với tên Iram trong hồ sơ tiếng Anh; “Y-ram” không phản ánh nguyên âm đầu /i/ của tên này. “Mác-đi-ên” cũng làm mất phụ âm g trong מַגְדִּיאֵל; “Mag-đi-ên” phản ánh tên Magdiel sát hơn.
  naturalness: Bản văn trang trọng, rõ ràng và tự nhiên trong văn cảnh gia phả. “Đó là” ở câu cuối làm chức năng xác nhận tổng kết một cách sáng rõ, không khiến độc giả hiểu chủ ngữ là I-ram. “Theo các nơi cư ngụ của họ” là cách diễn đạt tự nhiên cho ý phân loại theo nơi định cư.
  terminology: “Thủ lĩnh” là lựa chọn hiện đại, phù hợp cho אַלּוּף và tránh sắc thái phong kiến. “Cha của Ê-đôm” giữ thành ngữ gia phả của nguyên văn; chú thích giải thích đúng rằng đây là quan hệ tổ phụ với dân Ê-đôm. Chú thích thay thế cho אַלּוּף được chỉnh từ số nhiều sang dạng số ít để khớp đúng vị trí neo sau tên Mag-đi-ên.
