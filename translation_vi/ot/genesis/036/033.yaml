  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: vi
  text: Bê-la chết, rồi Giô-báp, con trai Xê-rách, đến từ Bốt-ra[a], lên làm vua thay ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người Bốt-ra.” Giới từ Hê-bơ-rơ có thể chỉ xuất xứ hoặc sự gắn bó với thành này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Động từ מוּת ở thể wayyiqtol kể sự kiện tiếp theo trong chuỗi tường thuật; nêu rõ chủ ngữ Bê-la theo ngữ cảnh.
- source_word: בָּלַע
  choice: Bê-la
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: וַיִּמְלֹךְ
  choice: lên làm vua
  rationale: Trong công thức kế vị, מלך diễn tả việc bắt đầu cai trị với tư cách vua; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: תַּחְתָּיו
  choice: thay ông
  rationale: תחת kèm hậu tố chỉ việc một người kế vị vào vị trí của vị vua trước.
- source_word: יוֹבָב
  choice: Giô-báp
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: בֶּן זֶרַח
  choice: con trai Xê-rách
  rationale: Chuỗi liên kết xác định Giô-báp theo phụ hệ; được chuyển dịch trực tiếp và tự nhiên.
- source_word: מִבָּצְרָה
  choice: đến từ Bốt-ra
  rationale: Tiền tố מִן trước địa danh thường biểu thị xuất xứ; trong danh sách vua, nó cũng có thể chỉ sự gắn bó với thành ấy.
