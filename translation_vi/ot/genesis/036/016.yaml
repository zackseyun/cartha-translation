  text: אַלּֽוּף קֹ֛רַח אַלּ֥וּף גַּעְתָּ֖ם אַלּ֣וּף עֲמָלֵ֑ק אֵ֣לֶּה אַלּוּפֵ֤י אֱלִיפַז֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֖לֶּה בְּנֵ֥י עָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: vi
  text: Tộc trưởng Cô-ra, tộc trưởng Ga-tham, tộc trưởng A-ma-léc. Đó là các tộc trưởng thuộc dòng Ê-li-pha trong xứ Ê-đôm; họ là con cháu của A-đa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: tộc trưởng
  rationale: Trong gia phả Ê-đôm, từ này chỉ người đứng đầu một thị tộc, nên “tộc trưởng” tự nhiên và chính xác hơn “thủ lĩnh” chung chung.
- source_word: גַּעְתָּם
  choice: Ga-tham
  rationale: Phiên âm tên riêng Hê-bơ-rơ Gaʿtam theo lối dễ đọc trong tiếng Việt, đồng thời phản ánh phụ âm họng ʿ bằng sự ngắt âm tiết.
- source_word: בְּנֵי
  choice: con cháu
  rationale: Trong văn cảnh gia phả, từ này có thể chỉ hậu duệ chứ không nhất thiết chỉ các con trai trực tiếp; “con cháu” giữ đúng quan hệ dòng dõi.
- source_word: אֵלֶּה אַלּוּפֵי אֱלִיפַז
  choice: Đó là các tộc trưởng thuộc dòng Ê-li-pha
  rationale: Cách diễn đạt làm rõ đây là các tộc trưởng xuất thân từ dòng Ê-li-pha mà không biến họ thành con trực tiếp nếu bản văn không buộc phải hiểu như vậy.
theological_decisions:
- issue: Quan hệ gia phả trong cụm “các con của A-đa”
  choice: họ là con cháu của A-đa
  alternative: đó là các con trai của A-đa
  rationale: Các tên vừa kể thuộc thế hệ hậu duệ qua Ê-li-pha; dịch “con cháu” bảo toàn cách dùng rộng của בנים và tránh tạo mâu thuẫn gia phả không cần thiết.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng dấu chấm sau danh sách để câu tiếng Việt tự nhiên; giữ cấu trúc xác nhận gia phả của nguyên văn.
