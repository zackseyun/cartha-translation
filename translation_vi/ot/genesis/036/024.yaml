base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: vi
  text: 'Đây là các con trai của Xi-bê-ôn: A-gia và A-na. Chính A-na này là người đã tìm thấy những yê-mim[a] trong hoang mạc, khi ông đang chăn đàn lừa cho cha mình là Xi-bê-ôn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa của từ Hê-bơ-rơ yê-mim không chắc chắn. Từ này được hiểu là “suối nước nóng”; một số cách giải thích cổ và về sau lại hiểu là “con la”. Chính văn giữ nguyên dạng phiên âm vì chứng cứ từ vựng chưa đủ để kết luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: các con trai của
  rationale: Trong gia phả này, từ Hê-bơ-rơ chỉ các con trai theo nghĩa trực tiếp, nên giữ cách diễn đạt rõ ràng thay vì dùng từ rộng hơn là “con cháu”.
- source_word: צִבְעוֹן
  choice: Xi-bê-ôn
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc và nhất quán trong tiếng Việt.
- source_word: אַיָּה
  choice: A-gia
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang dạng tự nhiên, dễ đọc trong tiếng Việt.
- source_word: עֲנָה
  choice: A-na
  rationale: Phiên âm nhất quán tên riêng trong phần gia phả.
- source_word: הוּא עֲנָה
  choice: Chính A-na này
  rationale: Diễn đạt tự nhiên chức năng xác định của đại từ cộng với tên riêng, nhấn mạnh đây là A-na vừa được nêu.
- source_word: מָצָא
  choice: tìm thấy
  rationale: Phản ánh nghĩa thông thường của động từ Hê-bơ-rơ mà không làm mạnh thành “khám phá”.
- source_word: הַיֵּמִם
  choice: các yê-mim
  rationale: Đây là từ hiếm, nghĩa không chắc chắn; giữ dạng phiên âm trong chính văn và trình bày các cách hiểu chính ở chú thích để không áp đặt một lời giải còn tranh luận.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: “Hoang mạc” diễn đạt vùng đất hoang vắng, không nhất thiết chỉ là sa mạc cát, phù hợp phạm vi nghĩa của מִדְבָּר.
- source_word: בִּרְעֹתוֹ אֶת הַחֲמֹרִים
  choice: khi ông đang chăn đàn lừa
  rationale: Cấu trúc nguyên ngữ với giới từ chỉ hành động đồng thời; “chăn đàn lừa” tự nhiên và chính xác trong tiếng Việt.
- source_word: לְצִבְעוֹן אָבִיו
  choice: cho cha mình là Xi-bê-ôn
  rationale: Thể hiện quan hệ phục vụ/sở hữu do giới từ לְ biểu thị, đồng thời làm rõ Xi-bê-ôn là cha của A-na.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm có dấu nối theo lối quen thuộc trong tiếng Việt. Từ khó yê-mim được bảo tồn để giữ sự bất định thực sự của nguyên văn; dấu chú thích [a] xuất hiện ngay sau từ tương ứng.
