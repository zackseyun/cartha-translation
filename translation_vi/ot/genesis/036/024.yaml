- from: 'Đây là các con trai của Xi-bê-ôn: A-gia và A-na. Chính A-na này là người đã tìm thấy các yê-mim[a] trong hoang mạc, khi ông đang chăn đàn lừa cho cha mình là Xi-bê-ôn.'
