base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: vi
  text: Hu-sam chết, rồi Ha-đát, con trai Bê-đát, lên làm vua kế vị ông. Ha-đát là người đã đánh dân Ma-đi-an[a] tại cánh đồng Mô-áp[b]; tên thành của ông là A-vít.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã đánh bại dân Ma-đi-an.” Phân từ Hê-bơ-rơ theo nghĩa đen là “người đánh Ma-đi-an.”'
    reason: lexical_alternative
  - marker: b
    text: “Cánh đồng Mô-áp” cũng có thể được hiểu theo nghĩa rộng hơn là “miền Mô-áp” hoặc “lãnh thổ Mô-áp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Động từ מות chỉ việc chết. “Qua đời” là cách diễn đạt tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: lên làm vua kế vị ông
  rationale: Cách dịch này thể hiện cả hành động trị vì của מלך lẫn quan hệ kế vị trong תַּחְתָּיו, đồng thời tự nhiên hơn lối dịch sát chữ “trị vì thay chỗ ông”.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Ha-đát, con trai Bê-đát
  rationale: Giữ các tên riêng bằng lối phiên âm dễ đọc đối với độc giả Việt Nam; בן được dịch trực tiếp là “con trai”.
- source_word: הַמַּכֶּה
  choice: người đã đánh
  rationale: Phân từ Hiphil của נכה mô tả Ha-đát qua một hành động nổi bật. “Đã đánh” giữ được độ rộng nghĩa của nguyên văn, không mặc nhiên xác định rõ là giết hay tiêu diệt.
- source_word: אֶת מִדְיָן
  choice: dân Ma-đi-an
  rationale: מִדְיָן là tên riêng nhưng trong ngữ cảnh làm đối tượng của hành động quân sự, tiếng Việt cần làm rõ nghĩa tập thể; “dân Ma-đi-an” tự nhiên hơn chỉ nói “đánh Ma-đi-an”.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: tại cánh đồng Mô-áp
  rationale: Giữ nghĩa cơ bản của שָׂדֶה là “cánh đồng”, đồng thời chú thích khả năng hiểu rộng hơn là miền hay lãnh thổ.
- source_word: וְשֵׁם עִירוֹ
  choice: thành của ông tên là
  rationale: Thể hiện tự nhiên công thức nêu tên trong tiếng Hê-bơ-rơ mà không thêm ý “kinh đô”, vốn không được nói rõ trong nguyên văn.
- source_word: עֲוִית
  choice: A-vít
  rationale: Phiên âm địa danh theo cách dễ đọc trong tiếng Việt, phản ánh gần đúng dạng phụ âm của tên Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong tường thuật trang trọng nhưng hiện đại, dùng cấu trúc kế vị rõ ràng và các tên riêng phiên âm dễ đọc. Câu Hê-bơ-rơ dài được ngắt thành hai câu tiếng Việt để tránh quan hệ đại từ mơ hồ; nội dung và trình tự thông tin vẫn được giữ nguyên.
