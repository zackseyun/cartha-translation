  text: 'These are the sons of Etser: Bilhan, Zaavan, and Akan.'
translation:
  language: vi
  text: 'Đây là các con trai của Ét-xe: Bil-han, Xa-a-van và A-can.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵצֶר
  choice: Ét-xe
  rationale: Phiên âm tên riêng Hê-bơ-rơ ʾĒṣer, dùng phụ âm “x” để gần với âm ṣ hơn và tránh đồng nhất tên này với Ê-xơ trong truyền thống phiên âm khác.
- source_word: בִּלְהָן
  choice: Binh-han
  rationale: Phiên âm Bilhān theo cách dễ đọc trong tiếng Việt, giữ hai âm tiết và phụ âm h của nguyên ngữ.
- source_word: זַעֲוָן
  choice: Xa-a-van
  rationale: Phiên âm Zaʿăwān, thể hiện cấu trúc nhiều âm tiết của tên Hê-bơ-rơ mà không gán ý nghĩa suy đoán.
- source_word: עֲקָן
  choice: A-can
  rationale: Phiên âm ʿĂqān tự nhiên trong tiếng Việt; phụ âm đầu yết hầu không có tương đương trực tiếp nên không được biểu thị riêng.
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Giữ nghĩa số nhiều và quan hệ phụ hệ rõ ràng trong danh sách gia phả.
