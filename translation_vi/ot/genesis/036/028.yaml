  text: אֵ֥לֶּה בְנֵֽי דִישָׁ֖ן ע֥וּץ וַ/אֲרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/028.yaml
  text: 'These are the sons of Dishan: Uz and Aran.'
translation:
  language: vi
  text: 'Đây là các con trai của Đi-san: Út và A-ran.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ định số nhiều mở đầu một danh sách gia phả. Tiếng Việt không biến đổi theo số, nên “Đây là” diễn đạt tự nhiên công thức câu không động từ của tiếng Hê-bơ-rơ.
- source_word: בְנֵי
  choice: các con trai của
  rationale: Trong ngữ cảnh gia phả này, từ này chỉ hai người con nam được nêu tên ngay sau đó; “các con trai của” vừa cụ thể vừa tự nhiên.
- source_word: דִישָׁן
  choice: Đi-san
  rationale: Tên riêng được phiên âm sang tiếng Việt, theo âm của hình thức Hê-bơ-rơ.
- source_word: עוּץ
  choice: Út
  rationale: Tên riêng được phiên âm sang tiếng Việt; “Út” phản ánh gần âm Hê-bơ-rơ ʿÛṣ và phù hợp lối ghi tên Kinh Thánh quen thuộc.
- source_word: וַאֲרָן
  choice: và A-ran
  rationale: Tiền tố ו được dịch là “và”, nối tên người con thứ hai; אֲרָן được phiên âm là “A-ran”.
