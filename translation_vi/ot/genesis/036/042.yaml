  language: en
  yaml_path: translation/ot/genesis/036/042.yaml
  text: chief Kenaz[a], chief Teman, chief Mibzar.
translation:
  language: vi
  text: tộc trưởng Kê-na[a], tộc trưởng Thê-man, tộc trưởng Míp-xa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch từ này ở mỗi lần xuất hiện là “thủ lĩnh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: tộc trưởng
  rationale: Trong danh sách Ê-đôm ở Sáng Thế Ký 36, từ này chỉ người đứng đầu một thị tộc hoặc nhóm bộ tộc. “Tộc trưởng” tự nhiên, trang trọng và diễn đạt rõ chức vị hơn từ cổ hoặc danh hiệu phong kiến.
- source_word: קְנַז
  choice: Kê-na
  rationale: Tên riêng được phiên âm theo cách đọc Hê-bơ-rơ và quy ước tên Kinh Thánh tiếng Việt.
- source_word: תֵּימָן
  choice: Thê-man
  rationale: Ở đây từ này là tên riêng trong danh sách các tộc trưởng Ê-đôm, nên được phiên âm chứ không dịch theo nghĩa từ nguyên liên quan đến phương nam hoặc bên phải.
- source_word: מִבְצָר
  choice: Míp-xa
  rationale: Tên riêng được phiên âm từ dạng Hê-bơ-rơ; không dịch theo nghĩa từ nguyên của danh từ cùng hình thức.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng, giữ nguyên cấu trúc liệt kê lặp lại của nguyên văn. Dùng “tộc trưởng” để thể hiện bối cảnh tổ chức thị tộc Ê-đôm mà không du nhập danh hiệu phong kiến.
