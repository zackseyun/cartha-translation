  text: וַ/יִּהְי֖וּ בְּנֵ֣י אֱלִיפָ֑ז תֵּימָ֣ן אוֹמָ֔ר צְפ֥וֹ וְ/גַעְתָּ֖ם וּ/קְנַֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/011.yaml
  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: vi
  text: Các con trai của Ê-li-pha là Thê-man, Ô-ma, Xê-phô[a], Ga-tham và Kê-na.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản dịch hoặc cách phiên âm dùng dạng “Xê-pô” thay cho “Xê-phô”. Bản Hê-bơ-rơ Masore tại đây ghi nguyên âm cho tên này theo dạng Xê-phô.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Trong danh sách gia phả, động từ היה kèm waw có chức năng liên kết, giới thiệu danh tính các con; “là” tự nhiên và chính xác hơn “trở thành” trong tiếng Việt.
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Danh từ số nhiều giống đực ở dạng liên kết chỉ rõ các con trai trong ngữ cảnh gia phả, nên không trung tính hóa thành “các con”.
- source_word: אֱלִיפָז
  choice: Ê-li-pha
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc, rõ ràng trong tiếng Việt.
- source_word: תֵּימָן
  choice: Thê-man
  rationale: Trong ngữ cảnh này đây là tên người, nên được phiên âm thay vì diễn giải theo nghĩa hoặc liên hệ địa danh.
- source_word: אוֹמָר
  choice: Ô-ma
  rationale: Phiên âm tên riêng sang tiếng Việt.
- source_word: צְפוֹ
  choice: Xê-phô
  rationale: Phiên âm theo dạng được ký âm trong bản Masore; cách viết này cũng tự nhiên trong truyền thống tên riêng Kinh Thánh tiếng Việt.
- source_word: גַעְתָּם
  choice: Ga-tham
  rationale: Phiên âm tên riêng sang tiếng Việt.
- source_word: קְנַז
  choice: Kê-na
  rationale: Phiên âm tên riêng theo dạng quen thuộc và dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. Giữ cách nói xác định giới tính “các con trai” theo nguyên văn Hê-bơ-rơ; các tên riêng được phiên âm nhất quán và dễ đọc.
