  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: vi
  text: 'Đây là các con trai của Ô-hô-li-ba-ma, con gái A-na, con gái Xi-bê-ôn, và là vợ của Ê-sau: bà sinh cho Ê-sau Giê-úc, Gia-lam và Cô-ra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ
  choice: Đây là
  rationale: Công thức mở đầu một ghi chép gia phả; tiếng Việt tự nhiên không cần dịch riêng động từ hệ từ ở thì quá khứ, còn liên từ ו được lược để tránh câu mở đầu nặng nề.
- source_word: בְּנֵי
  choice: các con trai
  rationale: Các nhân vật được nêu tên đều là nam, nên “các con trai” chính xác hơn “các con” hay “hậu duệ”.
- source_word: אָהֳלִיבָמָה
  choice: Ô-hô-li-ba-ma
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: con gái A-na, con gái Xi-bê-ôn
  rationale: Giữ nguyên việc nguồn Hê-bơ-rơ lặp lại “con gái”, không diễn giải thành “cháu gái”, qua đó bảo tồn cấu trúc và độ mơ hồ gia phả của câu.
- source_word: אֵשֶׁת עֵשָׂו
  choice: và là vợ của Ê-sau
  rationale: Thêm “và là” để chuỗi đồng vị dễ hiểu trong tiếng Việt mà không thay đổi quan hệ được nêu trong nguyên văn.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: bà sinh cho Ê-sau
  rationale: “Sinh cho” diễn đạt tự nhiên động từ ילד đi với לְ, đồng thời giữ sắc thái các con được sinh cho người cha.
- source_word: יעיש
  choice: Giê-úc
  rationale: Phiên âm tên riêng Hê-bơ-rơ יְעוּשׁ/יעיש theo dạng tiếng Việt dễ đọc.
- source_word: יַעְלָם
  choice: Gia-lam
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt.
- source_word: קֹרַח
  choice: Cô-ra
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang tiếng Việt.
theological_decisions: []
