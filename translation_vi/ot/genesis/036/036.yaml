  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שַׂמְלָ֖ה מִ/מַּשְׂרֵקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/036.yaml
  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: vi
  text: Ha-đát qua đời, rồi Sam-la, người Ma-rê-ca, lên làm vua kế vị ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sam-la từ Ma-rê-ca.” Giới từ Hê-bơ-rơ có thể chỉ xuất xứ hoặc sự gắn kết với một địa điểm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Động từ מות ở dạng wayyiqtol kể sự kiện kế tiếp trong trình thuật; “qua đời” tự nhiên, trang trọng và phù hợp với công thức kế vị.
- source_word: הֲדָד
  choice: Ha-đát
  rationale: Phiên âm tên riêng theo cách đọc Hê-bơ-rơ và quy ước tiếng Việt.
- source_word: וַיִּמְלֹךְ
  choice: lên làm vua
  rationale: Trong công thức kế vị, מלך chỉ việc bắt đầu trị vì; “lên làm vua” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: תַּחְתָּיו
  choice: kế vị ông
  rationale: תחתיו ở đây diễn tả việc thay thế trong ngôi vua; “kế vị ông” truyền đạt đúng quan hệ kế vị, thay vì chỉ nói về thứ tự thời gian.
- source_word: שַׂמְלָה
  choice: Sam-la
  rationale: Phiên âm tên riêng theo cách đọc Hê-bơ-rơ và quy ước tiếng Việt.
- source_word: מִמַּשְׂרֵקָה
  choice: người Ma-rê-ca
  rationale: Giới từ מִן có thể chỉ xuất xứ hoặc sự gắn kết với một địa điểm; trong tiếng Việt, “người Ma-rê-ca” là cách định danh tự nhiên mà vẫn giữ được mức độ khái quát ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “qua đời” cho công thức tử vong của vua và “lên làm vua kế vị ông” để diễn đạt rõ quan hệ kế vị. Tên riêng được phiên âm nhất quán sang tiếng Việt.
