base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: vi
  text: Ba-anh Ha-nan, con trai Ác-bo, chết, và Ha-đa[a] lên làm vua kế vị ông. Thành của ông tên là Pa-u[b], còn vợ ông tên là Mê-hê-ta-bên, con gái của Mát-rết—người là con gái của Mê Xa-háp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ tại đây chép Ha-đa; một số truyền thống văn bản và 1 Sử ký 1:50 chép Ha-đát.
    reason: textual_variant
  - marker: b
    text: Bản Hê-bơ-rơ tại đây chép Pa-u; 1 Sử ký 1:50 chép Pa-i.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Diễn đạt tự nhiên, trang trọng trong tiếng Việt cho động từ מות, không làm thay đổi ý nghĩa là chết.
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: Ba-anh Ha-nan, con trai Ác-bo
  rationale: Phiên âm các tên riêng theo cách dễ đọc trong tiếng Việt; בֶּן được dịch trực tiếp là “con trai”.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: lên làm vua kế vị ông
  rationale: Truyền đạt cả ý trị vì của מלך và ý thay chỗ người tiền nhiệm của תחתיו bằng lối nói tự nhiên.
- source_word: הֲדַר
  choice: Ha-đa
  rationale: Theo cách đọc Hadar của bản WLC; dị bản Hadad được ghi ở chú thích.
- source_word: פָּעוּ
  choice: Pa-u
  rationale: Phiên âm cách đọc Pau của bản Masoret; dạng Pai trong sách Sử ký được ghi ở chú thích.
- source_word: מְהֵיטַבְאֵל בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: Mê-hê-ta-bên, con gái Mát-rết, cháu ngoại Mê Xa-háp
  rationale: Chuỗi gia phả cho biết Mê-hê-ta-bên là con gái Mát-rết và thuộc thế hệ cháu của Mê Xa-háp. “Cháu ngoại” làm rõ quan hệ qua người mẹ Mát-rết trong tiếng Việt mà không lặp cấu trúc dễ gây nhập nhằng.
