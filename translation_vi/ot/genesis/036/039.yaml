  verdict: revise
  source_fidelity: 'Cần sửa cụm “cháu ngoại Mê Xa-háp”. Tiếng Hê-bơ-rơ lặp lại בַּת (“con gái”) và không cho biết Mát-rết là mẹ hay cha của Mê-hê-ta-bên; “cháu ngoại” áp đặt quan hệ qua dòng mẹ. Bản sửa giữ nguyên chuỗi gia phả: Mê-hê-ta-bên là con gái Mát-rết, và Mát-rết là con gái Mê Xa-háp. “chết” cũng phản ánh trực tiếp יותר động từ וַיָּמָת hơn cách nói uyển ngữ “qua đời”.'
  naturalness: Bản sửa vẫn dùng văn phong gia phả hiện đại, trang trọng. “Thành của ông” và “vợ ông” quy chiếu tự nhiên đến Ha-đa, tránh lặp “vua” không có trong hai mệnh đề này của nguyên văn. Cấu trúc có gạch ngang làm rõ mệnh đề thứ hai bổ nghĩa cho Mát-rết.
