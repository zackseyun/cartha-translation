base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/004.yaml
  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: vi
  text: A-đa sinh Ê-li-pha cho Ê-sau, và Ba-sê-mát sinh Rê-u-ên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: sinh
  rationale: Cả hai động từ đều thuộc gốc ילד, nghĩa là sinh con. “Sinh” ngắn gọn, tự nhiên trong gia phả và giữ rõ người mẹ là chủ thể.
- source_word: לְעֵשָׂו
  choice: cho Ê-sau
  rationale: Giới từ ל đi với ילד trong văn cảnh gia phả chỉ người cha; “sinh ... cho Ê-sau” bảo toàn quan hệ này mà không diễn giải quá mức.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ trực tiếp, không có từ tương đương độc lập trong tiếng Việt; chức năng của nó được thể hiện qua trật tự câu.
- source_word: אֱלִיפָז
  choice: Ê-li-pha
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
- source_word: בָשְׂמַת
  choice: Ba-sê-mát
  rationale: Phiên âm tên riêng từ dạng Hê-bơ-rơ trong bản Masoret.
- source_word: רְעוּאֵל
  choice: Rê-u-ên
  rationale: Phiên âm sát dạng phụ âm và nguyên âm của tên Hê-bơ-rơ trong bản Masoret.
- source_word: וּ
  choice: còn
  rationale: Liên từ nối hai thông báo sinh con. “Còn” tạo sự phối hợp tự nhiên giữa hai chủ thể trong tiếng Việt mà vẫn giữ quan hệ liên kết đơn giản.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng, phù hợp với lời thuật gia phả. Dùng “sinh ... cho” để diễn đạt tự nhiên quan hệ mẹ–cha trong câu Hê-bơ-rơ.
