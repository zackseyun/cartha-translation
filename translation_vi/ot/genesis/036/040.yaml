source:
  edition: WLC
  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: vi
  text: 'Và đây là tên các tộc trưởng của Ê-sau, theo các thị tộc của họ, theo các nơi chốn của họ, theo tên của họ: tộc trưởng Tim-na[a], tộc trưởng A-va[b], tộc trưởng Giê-tết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên này cũng có thể được chuyển tự là “Tim-nah”.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ là “Alvah”; so sánh dạng tên có liên hệ “Aliah” trong 1 Sử Ký 1:51.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Cụm này mở đầu danh sách mới nhưng vẫn nối tiếp văn mạch. Trong tiếng Việt, “Đây là” tự nhiên hơn việc dịch cứng liên từ וְ thành “Và” ở đầu câu.
- source_word: שְׁמוֹת
  choice: tên
  rationale: Danh từ ở dạng liên kết với thành phần theo sau, mang nghĩa “tên của”; cấu trúc tiếng Việt của cả câu đã thể hiện quan hệ sở hữu ấy.
- source_word: אַלּוּפֵי
  choice: các tộc trưởng
  rationale: Trong Sáng Thế Ký 36, אַלּוּף chỉ những người đứng đầu các đơn vị thị tộc Ê-đôm. “Tộc trưởng” rõ nghĩa, hợp bối cảnh và không gợi một tước hiệu quý tộc châu Âu.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Dạng phiên âm quen thuộc và dễ đọc trong tiếng Việt hiện đại.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo thị tộc
  rationale: מִשְׁפָּחָה ở đây chỉ nhóm thân tộc trong cơ cấu bộ tộc, rộng hơn gia đình hạt nhân; giới từ לְ có chức năng phân loại nên được dịch là “theo”.
- source_word: לִמְקֹמֹתָם
  choice: theo địa phương
  rationale: מָקוֹם có nghĩa cơ bản là “nơi, địa điểm”; trong danh sách này có thể hàm ý địa bàn cư trú. “Địa phương” giữ được nghĩa không gian mà không xác quyết quá mức rằng đó là các khu định cư.
- source_word: בִּשְׁמֹתָם
  choice: theo tên của họ
  rationale: Giới từ בְּ ở đây diễn tả cách liệt kê hoặc phân loại theo tên. Cách dịch này giữ sự lặp lại có chủ ý của nguyên văn và vẫn rõ ràng trong tiếng Việt.
- source_word: אַלּוּף
  choice: tộc trưởng
  rationale: Giữ nhất quán danh xưng lặp lại trước từng tên riêng và thể hiện vai trò lãnh đạo thị tộc.
- source_word: תִּמְנָע
  choice: Tim-na
  rationale: Phiên âm gần âm tiết Hê-bơ-rơ và thuận cách đọc tiếng Việt; biến thể chuyển tự Tim-nah được ghi ở chú thích.
- source_word: עַלְוָה
  choice: An-va
  rationale: Phiên âm tiếng Việt của dạng Hê-bơ-rơ trong bản Masoret; không đồng nhất hóa với dạng tên có liên hệ ở 1 Sử Ký 1:51.
- source_word: יְתֵת
  choice: Giê-tết
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ trong câu này; không hòa đồng với những tên gần giống nhưng khác dạng.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc ba lần “theo” được giữ để phản ánh nhịp phân loại của nguyên văn. Dấu chú thích [a] được đặt sau Tim-na, là từ mà chú thích thực sự giải thích, thay vì sau Ê-sau như vị trí có vẻ bị lệch trong lớp tham khảo tiếng Anh.
