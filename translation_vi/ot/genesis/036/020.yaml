lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Cách giới thiệu tự nhiên trong tiếng Việt đối với một danh sách gia phả, tương ứng với lối trình bày của tiếng Hê-bơ-rơ.
- source_word: בְנֵי
  choice: các con trai của
  rationale: Giữ nghĩa gia phả trực tiếp; các tên được liệt kê trong ngữ cảnh là nam giới.
- source_word: שֵׂעִיר
  choice: Sê-i-rơ
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: הַחֹרִי
  choice: người Hô-rít
  rationale: Danh xưng chỉ nguồn gốc dân tộc của Sê-i-rơ; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: những cư dân trong xứ
  rationale: Phân từ số nhiều ở dạng liên kết chỉ những người định cư trong vùng đất ấy; “cư dân trong xứ” vừa sát nghĩa vừa tự nhiên.
- source_word: לוֹטָן
  choice: Lô-tan
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: שׁוֹבָל
  choice: Sô-banh
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: צִבְעוֹן
  choice: Xi-bê-ôn
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: עֲנָה
  choice: A-na
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
