  text: 'These are the sons of Seir the Horite[a], the inhabitants of the land: Lotan, Shobal, Zibeon, and Anah.'
translation:
  language: vi
  text: 'Đây là các con trai của Sê-i-rơ, người Hô-rít; họ là những cư dân trong xứ[a]: Lô-tan, Sô-banh, Xi-bê-ôn và A-na.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người cư ngụ trong xứ”.
