  source_fidelity: Bản dịch nhìn chung phản ánh đúng trình tự liệt kê và sắc thái nguyên nhân của מִפְּנֵי (“vì cớ”). Tuy nhiên, “tài sản ông đã gây dựng” có thể gợi ý việc xây dựng/thiết lập, trong khi רָכַשׁ nói đến điều đã thủ đắc; nên dịch là “đã thu được” hoặc “đã có được”.
  naturalness: Văn phong rõ và trang trọng. “Các bà vợ” không tự nhiên trong văn xuôi hiện đại khi chỉ vợ của cùng một người; “những người vợ” tự nhiên hơn. Giữ toàn câu như cấu trúc nguyên văn cũng làm mạch liệt kê và hành động ra đi gắn kết hơn.
  terminology: Giữ các tên Ê-sau, Gia-cốp, Ca-na-an và Sê-i-rơ nhất quán. “Gia súc” cho מִקְנֶה và “súc vật” cho בְּהֵמָה bảo lưu được sự phân biệt từ vựng của nguyên văn. “Vì cớ” là lựa chọn thích hợp cho cách hiểu nhân quả của מִפְּנֵי mà không thêm ý “tránh xa”.
