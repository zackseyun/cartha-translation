- from: Ê-sau đem theo các bà vợ, các con trai, các con gái và mọi người trong nhà mình, cùng với các đàn gia súc, mọi súc vật và tất cả tài sản ông đã gây dựng tại xứ Ca-na-an. Ông đi đến một vùng đất[a] vì cớ Gia-cốp, em mình.
  to: Ê-sau đem theo những người vợ, các con trai, các con gái và mọi người trong nhà mình, cùng với các đàn gia súc, mọi súc vật và tất cả tài sản mà ông đã thu được tại xứ Ca-na-an, rồi đi đến một miền đất[a] vì cớ Gia-cốp, em mình.
  rationale: Sửa cụm chỉ sự thủ đắc tài sản cho sát nghĩa רָכַשׁ, thay cách gọi vợ số nhiều bằng lối diễn đạt tự nhiên hơn, và nối lại câu theo cấu trúc liệt kê–hành động của nguyên văn. Không thêm “khác” hay địa danh Sê-i-rơ vào chính văn, vì bản Masoret chỉ đọc “đến một miền đất”.
