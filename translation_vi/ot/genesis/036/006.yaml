source:
  edition: WLC
  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: vi
  text: Ê-sau đem theo những người vợ, các con trai, các con gái và mọi người trong nhà mình, cùng với các đàn gia súc, mọi súc vật và tất cả tài sản mà ông đã thu được tại xứ Ca-na-an, rồi đi đến một miền đất[a] vì cớ Gia-cốp, em mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “đến một miền đất.” Một số thủ bản và bản dịch cổ ủng hộ cách đọc “đến xứ Sê-i-rơ”; theo văn cảnh, nhiều bản dịch hiểu là “đến một miền đất khác.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: đem theo
  rationale: Động từ לקח có nghĩa cơ bản là “lấy, đem”; trong bối cảnh di cư, “đem theo” diễn đạt tự nhiên việc Ê-sau đưa người và tài sản cùng đi.
- source_word: נָשָׁיו
  choice: các bà vợ
  rationale: Dạng số nhiều ở đây chỉ những người vợ của Ê-sau; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: בָּנָיו וְאֶת בְּנֹתָיו
  choice: các con trai, các con gái
  rationale: Giữ nguyên sự phân biệt rõ ràng giữa con trai và con gái trong tiếng Hê-bơ-rơ.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: mọi người trong nhà mình
  rationale: נפשׁ trong thành ngữ này chỉ các nhân khẩu thuộc gia đình hoặc gia hộ, không nhấn mạnh khái niệm thần học về “linh hồn”.
- source_word: מִקְנֵהוּ
  choice: các đàn gia súc
  rationale: מִקְנֶה thường chỉ gia súc như một phần tài sản; “các đàn gia súc” phù hợp với bối cảnh một gia hộ lớn đang di chuyển.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: mọi súc vật
  rationale: בְּהֵמָה là từ rộng chỉ thú vật, thường là vật nuôi; lựa chọn này giữ được sự phân biệt với מִקְנֶה mà không thu hẹp thành một loại gia súc cụ thể.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: tất cả tài sản ông đã gây dựng
  rationale: קִנְיָן và רכשׁ cùng nhấn mạnh những gì đã được sở hữu hoặc tích lũy; “tài sản ... đã gây dựng” tự nhiên trong tiếng Việt và truyền đạt ý nghĩa thủ đắc.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: tại xứ Ca-na-an
  rationale: “Xứ Ca-na-an” là cách gọi địa lý trang trọng, quen thuộc và tương ứng với cụm “đất Ca-na-an” trong nguyên văn.
- source_word: אֶל אֶרֶץ
  choice: đến một vùng đất
  rationale: Bản Hê-bơ-rơ Masoret đọc đơn giản là “đến một vùng đất”; không tự ý thêm “khác” hay xác định địa danh trong chính văn.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: vì cớ Gia-cốp, em mình
  rationale: מִפְּנֵי có thể mang sắc thái không gian (“khỏi trước mặt, tránh xa”) hoặc nguyên nhân (“vì”); ở đây chọn sắc thái nguyên nhân, phù hợp với lời giải thích ở câu kế tiếp, nhưng không thêm động cơ ngoài văn bản. אָחִיו được diễn đạt là “em mình” theo quan hệ giữa Ê-sau và Gia-cốp.
theological_decisions:
- issue: Sắc thái của מִפְּנֵי trong việc Ê-sau rời đi
  choice: vì cớ Gia-cốp, em mình
  alternative: để tránh xa Gia-cốp, em mình
  rationale: Cụm từ có thể được hiểu theo nghĩa nguyên nhân hoặc không gian. “Vì cớ” bảo tồn nguyên nhân được câu 7 giải thích mà không khẳng định Ê-sau cố tình lánh mặt Gia-cốp.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “đem theo” và “mọi người trong nhà mình” để câu văn dễ hiểu; giữ “một vùng đất” trong chính văn nhằm bảo toàn cách đọc không xác định của bản Masoret. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
