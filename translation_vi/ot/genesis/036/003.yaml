  text: וְ/אֶת בָּשְׂמַ֥ת בַּת יִשְׁמָעֵ֖אל אֲח֥וֹת נְבָיֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/003.yaml
  text: and Basemath[a], the daughter of Ishmael, the sister of Nebaioth.
translation:
  language: vi
  text: và Bát-sê-mát, con gái Ích-ma-ên, chị hoặc em gái của Nê-ba-ốt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không cho biết Bát-sê-mát là chị hay em của Nê-ba-ốt.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְ/אֶת
  choice: và
  rationale: וְ nối thêm một người vợ vào danh sách; אֵת là dấu hiệu tân ngữ xác định nên không cần dịch riêng trong tiếng Việt.
- source_word: בָּשְׂמַת
  choice: Bát-sê-mát
  rationale: Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: בַּת
  choice: con gái
  rationale: Danh từ ở dạng liên kết biểu thị quan hệ cha con; tiếng Việt không cần mạo từ trong cụm đồng vị này.
- source_word: יִשְׁמָעֵאל
  choice: Ích-ma-ên
  rationale: Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: אֲחוֹת
  choice: em gái của
  rationale: Từ Hê-bơ-rơ chỉ 'chị/em gái' nhưng không tự xác định tuổi tương đối; chọn 'em gái' vì Sáng Thế Ký 25:13 đặt Nê-ba-ốt là con đầu lòng của Ích-ma-ên, đồng thời ghi chú giữ lại nghĩa rộng của nguyên văn.
- source_word: נְבָיוֹת
  choice: Nê-ba-ốt
  rationale: Tên riêng được phiên âm sát dạng Hê-bơ-rơ và phù hợp cách đọc tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Tuổi tương đối trong אֲחוֹת
  choice: em gái của Nê-ba-ốt
  alternative: chị/em gái của Nê-ba-ốt; chị gái của Nê-ba-ốt
  rationale: Bản thân אֲחוֹת không phân biệt chị hay em. Ngữ cảnh gia phả gọi Nê-ba-ốt là con đầu lòng của Ích-ma-ên (Sáng Thế Ký 25:13), nên 'em gái' là cách diễn đạt tự nhiên có căn cứ; chú thích nêu rõ độ rộng nghĩa của nguyên văn để không che khuất sự mơ hồ từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn, phù hợp cấu trúc liệt kê của câu trước. Các tên riêng dùng dạng phiên âm tiếng Việt có gạch nối.
