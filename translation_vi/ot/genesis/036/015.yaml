base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: vi
  text: 'Đây là các thủ lĩnh của các con trai Ê-sau: các con trai của Ê-li-pha, con trưởng của Ê-sau: thủ lĩnh Thê-man, thủ lĩnh Ô-ma, thủ lĩnh Xê-phô, thủ lĩnh Kê-na.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: các thủ lĩnh / thủ lĩnh
  rationale: Trong các gia phả Ê-đôm, từ này chỉ người đứng đầu một thị tộc hoặc nhóm bộ tộc. “Thủ lĩnh” giữ được chức năng danh hiệu, tự nhiên trong tiếng Việt hiện đại và không dùng thuật ngữ phong kiến như “công tước”.
- source_word: בְנֵי
  choice: con cháu / các con trai
  rationale: Ở cụm bao quát “בְנֵי עֵשָׂו”, “con cháu” phù hợp vì phần này liệt kê các thủ lĩnh thuộc hậu duệ Ê-sau; còn “בְנֵי אֱלִיפַז” trực tiếp giới thiệu những người con trai được nêu tên, nên dịch cụ thể là “các con trai”.
- source_word: בְּכוֹר
  choice: con trưởng nam
  rationale: Diễn đạt rõ thứ tự sinh và sắc thái địa vị của từ Hê-bơ-rơ, đồng thời tự nhiên trong văn phong gia phả tiếng Việt.
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Cách mở đầu tự nhiên cho công thức giới thiệu một danh sách trong tiếng Việt.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt quen thuộc.
- source_word: אֱלִיפַז
  choice: Ê-li-pha
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt quen thuộc.
- source_word: תֵּימָן
  choice: Thê-man
  rationale: Phiên âm trực tiếp tên người hoặc tên thị tộc theo dạng quen thuộc trong tiếng Việt.
- source_word: אוֹמָר
  choice: Ô-ma
  rationale: Phiên âm tên riêng theo âm Hê-bơ-rơ và quy ước tiếng Việt.
- source_word: צְפוֹ
  choice: Xê-phô
  rationale: Phiên âm dạng Hê-bơ-rơ צְפוֹ; giữ tên riêng dễ đọc trong tiếng Việt.
- source_word: קְנַז
  choice: Kê-na
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt quen thuộc.
