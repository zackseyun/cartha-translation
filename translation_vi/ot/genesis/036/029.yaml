  text: אֵ֖לֶּה אַלּוּפֵ֣י הַ/חֹרִ֑י אַלּ֤וּף לוֹטָן֙ אַלּ֣וּף שׁוֹבָ֔ל אַלּ֥וּף צִבְע֖וֹן אַלּ֥וּף עֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/029.yaml
  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: vi
  text: 'Đây là các thủ lĩnh của người Hô-rít: thủ lĩnh Lô-tan[a], thủ lĩnh Sô-banh, thủ lĩnh Xi-bê-ôn, thủ lĩnh A-na.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người đứng đầu thị tộc” hoặc “tù trưởng”; từ Hê-bơ-rơ này có thể chỉ người đứng đầu một thị tộc hay bộ tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ thị số nhiều mở đầu một danh sách; tiếng Việt tự nhiên dùng “Đây là” mà không cần biểu thị số ở đại từ.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: các thủ lĩnh / thủ lĩnh
  rationale: Trong Sáng Thế Ký 36, từ này chỉ người đứng đầu thị tộc hoặc bộ tộc. “Thủ lĩnh” vừa trang trọng, dễ hiểu, vừa giữ được ý lãnh đạo; danh xưng được lặp lại trước mỗi tên như trong tiếng Hê-bơ-rơ.
- source_word: הַחֹרִי
  choice: người Hô-rít
  rationale: Danh từ chỉ dân tộc ở dạng tập thể; “người Hô-rít” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: לוֹטָן
  choice: Lô-tan
  rationale: Phiên âm tên riêng theo âm dạng Hê-bơ-rơ và quy ước tên Kinh Thánh tiếng Việt.
- source_word: שׁוֹבָל
  choice: Sô-banh
  rationale: Phiên âm tên riêng theo âm dạng Hê-bơ-rơ, với phụ âm cuối được Việt hóa tự nhiên.
- source_word: צִבְעוֹן
  choice: Xi-bê-ôn
  rationale: Phiên âm tên riêng theo âm dạng Hê-bơ-rơ và cấu trúc âm tiết phù hợp tiếng Việt.
- source_word: עֲנָה
  choice: A-na
  rationale: Phiên âm tên riêng theo âm dạng Hê-bơ-rơ.
theological_decisions: []
