  text: וַ/יֵּ֤שֶׁב עֵשָׂו֙ בְּ/הַ֣ר שֵׂעִ֔יר עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: vi
  text: Vậy, Ê-sau định cư tại miền núi Sê-i-rơ[a]; Ê-sau chính là Ê-đôm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sống trong vùng núi Sê-i-rơ” hoặc “cư ngụ trên núi Sê-i-rơ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: định cư
  rationale: Động từ ישׁב ở dạng kể chuyện chỉ việc cư trú; trong văn cảnh Ê-sau thiết lập nơi ở tại một vùng, “định cư” vừa tự nhiên vừa diễn đạt rõ hơn “ở” đơn thuần.
- source_word: בְּהַר
  choice: tại miền núi
  rationale: הַר có thể chỉ một ngọn núi hoặc một vùng đồi núi. Vì Sê-i-rơ ở đây là một địa vực, “miền núi” truyền đạt phù hợp ý nghĩa địa lý mà không mặc nhiên coi đây là một đỉnh núi duy nhất.
- source_word: שֵׂעִיר
  choice: Sê-i-rơ
  rationale: Tên địa danh được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: הוּא אֱדוֹם
  choice: chính là Ê-đôm
  rationale: Mệnh đề danh từ này đồng nhất Ê-sau với Ê-đôm. “Chính là” thể hiện rõ quan hệ nhận diện, đồng thời giữ sắc thái trực tiếp của nguyên văn.
theological_decisions: []
