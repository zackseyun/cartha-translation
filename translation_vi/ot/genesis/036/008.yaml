  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Miền núi” giữ độ rộng nghĩa địa lý của הַר; dấu chấm phẩy bảo toàn cấu trúc hai vế ngắn của câu Hê-bơ-rơ.
