  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: vi
  text: Tim-na là vợ lẽ của Ê-li-pha, con trai Ê-sau; bà sinh A-ma-léc cho Ê-li-pha. Đó là các con cháu của A-đa[a], vợ Ê-sau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con của A-đa”; từ Hê-bơ-rơ có thể chỉ con cái hoặc hậu duệ. Trong ngữ cảnh này, họ là con của Ê-li-pha, tức thuộc dòng con cháu của A-đa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתִמְנַע
  choice: Tim-na
  rationale: Tên riêng được phiên âm theo cách đọc quen thuộc trong tiếng Việt; liên từ וְ được thể hiện tự nhiên qua sự tiếp nối câu chuyện, không cần dịch riêng.
- source_word: הָיְתָה פִילֶגֶשׁ לֶאֱלִיפַז
  choice: là vợ lẽ của Ê-li-pha
  rationale: הָיְתָה ở đây làm hệ từ; פִילֶגֶשׁ chỉ một người nữ trong quan hệ hôn phối được thừa nhận nhưng có địa vị thứ yếu. “Vợ lẽ” là cách diễn đạt tự nhiên và đúng sắc thái xã hội trong tiếng Việt.
- source_word: בֶּן עֵשָׂו
  choice: con trai Ê-sau
  rationale: Diễn đạt chuỗi liên kết sở hữu theo lối tự nhiên của tiếng Việt.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: bà sinh A-ma-léc cho Ê-li-pha
  rationale: Giữ cấu trúc phả hệ trong đó לְ nêu người cha; “bà” giúp câu tiếng Việt trang trọng, rõ chủ thể.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: Đó là các con cháu của A-đa
  rationale: בָּנִים có thể chỉ con cái hoặc hậu duệ. Trong ngữ cảnh, những người vừa kể là con của Ê-li-pha và thuộc dòng A-đa; “con cháu” vừa phù hợp phạm vi nghĩa của từ Hê-bơ-rơ vừa tránh xác định sai là con trai trực tiếp.
- source_word: אֵשֶׁת עֵשָׂו
  choice: vợ Ê-sau
  rationale: Cụm liên kết được dịch gọn và tự nhiên, đồng vị với A-đa.
theological_decisions:
- issue: Quan hệ phả hệ trong cụm אֵלֶּה בְּנֵי עָדָה
  choice: các con cháu của A-đa
  alternative: các con trai của A-đa / các cháu trai của A-đa
  rationale: Nguyên văn dùng בְּנֵי, có phạm vi rộng hơn “con trai” trực hệ. Ngữ cảnh cho thấy họ thuộc thế hệ cháu của A-đa, nhưng dịch hẳn là “cháu trai” sẽ cụ thể hóa điều văn bản Hê-bơ-rơ chỉ diễn đạt bằng một thuật ngữ phả hệ rộng. “Con cháu” bảo toàn cả nghĩa nguồn lẫn quan hệ theo ngữ cảnh.
translation_notes:
  register: Văn phong phả hệ trang trọng nhưng hiện đại, dùng cách phiên âm tên riêng quen thuộc với độc giả Kinh Thánh tiếng Việt. Dấu chấm phẩy nối hai mệnh đề có quan hệ chặt chẽ; không làm phẳng tính khái quát của thuật ngữ phả hệ Hê-bơ-rơ.
