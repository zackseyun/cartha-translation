  source_fidelity: Cấu trúc câu, quan hệ gia phả và danh sách năm tên phản ánh đúng tiếng Hê-bơ-rơ. Tuy nhiên, «Anh-van» không phải là cách phiên âm Việt ngữ phù hợp cho עַלְוָן (ʿAlwan/Alvan), và dạng «Anh-gian» trong chú thích không phản ánh thích đáng tên song song עַלְיָן (Alian) ở 1 Sử Ký 1:40.
  naturalness: «Đây là các con trai của Sô-banh» tự nhiên, rõ nghĩa và phù hợp văn phong gia phả hiện đại. Cấu trúc liệt kê với «và» trước tên cuối cũng tự nhiên.
  terminology: «Các con trai» truyền đạt chính xác בְּנֵי trong danh sách trực tiếp này. Các tên Sô-banh, Ma-na-hát, Ê-banh, Sê-phô và Ô-nam nhất quán với lối phiên âm Việt ngữ Kinh Thánh; tên đầu và dạng tên trong chú thích cần chuẩn hóa thành «An-van» và «A-li-an».
  issues:
