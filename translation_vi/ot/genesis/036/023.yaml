    issue: Tên עַלְוָן được ghi là «Anh-van».
    rationale: Âm đầu «Anh-» thêm một âm cuối /nh/ không có trong tên Hê-bơ-rơ và không phải cách phiên âm Việt ngữ thông dụng của Alvan. «An-van» là dạng Việt ngữ phù hợp và nhất quán với truyền thống phiên âm Kinh Thánh.
  - severity: medium
    issue: Chú thích a ghi dạng song song là «Anh-gian».
    rationale: Tên trong 1 Sử Ký 1:40 là עַלְיָן, thường được phiên âm «A-li-an»; «Anh-gian» vừa không phản ánh dạng này vừa có thể khiến người đọc hiểu đó là một tên khác không liên hệ.
  revised_text: 'Đây là các con trai của Sô-banh: An-van[a], Ma-na-hát, Ê-banh, Sê-phô[b] và Ô-nam.'
