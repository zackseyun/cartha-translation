base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/023.yaml
  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: vi
  text: 'Đây là các con trai của Sô-banh: An-van[a], Ma-na-hát, Ê-banh, Sê-phô[b] và Ô-nam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ ở đây chép An-van; gia phả song song trong 1 Sử Ký 1:40 chép A-li-an.
    reason: alternative_reading
  - marker: b
    text: Bản Hê-bơ-rơ ở đây chép Sê-phô; gia phả song song trong 1 Sử Ký 1:40 chép Sê-phi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Đây là
  rationale: Công thức với liên từ và đại từ chỉ định mở đầu mục kế tiếp trong gia phả; “Đây là” tự nhiên trong tiếng Việt và không nhất thiết phải thể hiện וְ bằng “và”.
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Trong câu này, từ chỉ một danh sách trực tiếp gồm các hậu duệ nam, nên “các con trai của” chính xác hơn “con cháu của”.
- source_word: שׁוֹבָל
  choice: Sô-banh
  rationale: Tên riêng được phiên âm theo âm dạng Hê-bơ-rơ, bằng chính tả tiếng Việt dễ đọc.
- source_word: עַלְוָן
  choice: Anh-van
  rationale: Phiên âm dạng עַלְוָן của bản Hê-bơ-rơ WLC; dạng khác trong 1 Sử Ký 1:40 được giữ ở chú thích.
- source_word: וּ/מָנַחַת
  choice: Ma-na-hát
  rationale: Tên riêng được phiên âm từ tiếng Hê-bơ-rơ; liên từ đứng trước được thể hiện tự nhiên qua cấu trúc liệt kê.
- source_word: וְ/עֵיבָל
  choice: Ê-banh
  rationale: Tên riêng được phiên âm trực tiếp từ dạng Hê-bơ-rơ.
- source_word: שְׁפוֹ
  choice: Sê-phô
  rationale: Phiên âm dạng của bản Masoret trong câu này; dạng Sê-phi ở gia phả song song được ghi trong chú thích.
- source_word: וְ/אוֹנָם
  choice: và Ô-nam
  rationale: Tên riêng được phiên âm từ tiếng Hê-bơ-rơ, còn liên từ được giữ trước tên cuối cùng theo lối liệt kê tự nhiên của tiếng Việt.
