  text: וַ/יָּ֖מָת יוֹבָ֑ב וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו חֻשָׁ֖ם מֵ/אֶ֥רֶץ הַ/תֵּימָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/034.yaml
  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: vi
  text: Giô-báp qua đời, rồi Hu-sam, người từ xứ Thê-man[a], lên làm vua kế vị ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xứ của người Thê-man” hoặc “xứ của dân Thê-man.” Dạng từ Hê-bơ-rơ có thể chỉ vùng đất gắn với Thê-man hoặc cư dân của vùng ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Động từ מות ở thể wayyiqtol kể một sự kiện quá khứ nối tiếp; “qua đời” tự nhiên, trang trọng và phù hợp với công thức kế vị.
- source_word: יוֹבָב
  choice: Giô-báp
  rationale: Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: וַיִּמְלֹךְ
  choice: lên làm vua
  rationale: Trong công thức vương triều này, מלך nói đến việc tiếp nhận ngôi vua; “lên làm vua” diễn đạt rõ sự đăng vị và tự nhiên trong tiếng Việt.
- source_word: תַּחְתָּיו
  choice: kế vị ông
  rationale: תחת với hậu tố ngôi thứ ba chỉ việc thay thế một người trong chức vị; “kế vị ông” phù hợp trực tiếp với ngữ cảnh kế tục ngôi vua.
- source_word: חֻשָׁם
  choice: Hu-sam
  rationale: Tên riêng được phiên âm, không dịch nghĩa.
- source_word: מֵאֶרֶץ
  choice: người từ xứ
  rationale: Giới từ מן kết hợp với אֶרֶץ chỉ nguồn gốc địa lý; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: הַתֵּימָנִי
  choice: Thê-man
  rationale: Dạng chỉ dân/địa danh gắn với Thê-man đứng sau “xứ”; bản dịch chính dùng địa danh tự nhiên trong tiếng Việt, còn chú thích giữ lại khả năng hiểu theo nghĩa chỉ dân.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và gọn theo thể thức danh sách các vua. Dùng “rồi” để thể hiện chuỗi sự kiện của hai động từ wayyiqtol; “lên làm vua kế vị ông” truyền đạt cả sự đăng vị lẫn ý thay thế trong chức vụ.
