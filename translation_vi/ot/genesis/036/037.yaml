  - severity: low
    issue: Đại từ “ông” trong “kế vị ông” có thể mơ hồ.
    rationale: Dù ngữ cảnh cho thấy chỉ Sam-la, việc lặp tên riêng làm rõ quan hệ kế vị mà không thêm ý nghĩa.
  - severity: low
    issue: Chú thích diễn giải “một con sông nổi tiếng” vượt quá điều nguyên văn xác nhận.
    rationale: הַנָּהָר có mạo từ xác định (“Sông”), nhưng bản văn không mô tả con sông là nổi tiếng hay nêu tên nó.
  revised_text: Rồi Sam-la chết, và Sau-lơ từ Rê-hô-bốt bên Sông[a] lên ngôi kế vị Sam-la.
