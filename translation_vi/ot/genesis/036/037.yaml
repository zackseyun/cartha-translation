  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: vi
  text: Rồi Sam-la chết, và Sau-lơ từ Rê-hô-bốt bên Sông[a] lên ngôi kế vị Sam-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “Rê-hô-bốt Sông”; có lẽ là Rê-hô-bốt nằm bên một con sông được xác định trong bối cảnh.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Sau đó, ... qua đời
  rationale: Dạng wayyiqtol tiếp nối mạch tường thuật; “Sau đó” diễn đạt trình tự tự nhiên, còn “qua đời” là cách nói trang trọng, thông dụng.
- source_word: שַׂמְלָה
  choice: Sam-la
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo cách dễ đọc đối với độc giả Việt.
- source_word: וַיִּמְלֹךְ
  choice: lên làm vua
  rationale: Trong công thức kế vị, động từ מלך chỉ việc một người bắt đầu nắm vương quyền; “lên làm vua” tự nhiên trong tiếng Việt và không hàm ý quan hệ triều đại mà bản văn không nói rõ.
- source_word: תַּחְתָּיו
  choice: kế vị ông
  rationale: Trong ngữ cảnh kế nhiệm vua, thành ngữ này có nghĩa là thay người trước giữ ngôi; “kế vị ông” gọn và tự nhiên.
- source_word: שָׁאוּל
  choice: Sau-lơ
  rationale: Dùng dạng phiên âm Hê-bơ-rơ quen thuộc trong tiếng Việt cho tên שָׁאוּל.
- source_word: מֵרְחֹבוֹת
  choice: từ Rê-hô-bốt
  rationale: Tiền tố מִן chỉ xuất xứ; Rê-hô-bốt được giữ như địa danh thay vì dịch theo nghĩa từ nguyên.
- source_word: הַנָּהָר
  choice: bên Sông
  rationale: Cụm từ xác định địa điểm Rê-hô-bốt theo một con sông nổi bật. Viết “Sông” hoa giúp phản ánh sắc thái xác định của הַנָּהָר mà không tự ý đồng nhất đó với một con sông cụ thể.
