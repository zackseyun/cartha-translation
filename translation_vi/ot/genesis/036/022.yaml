base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: vi
  text: Các con trai của Lô-tan là Hô-ri và Hê-mam[a]; người chị hoặc em gái của Lô-tan là Tim-na.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ tại đây chép “Hê-mam”; danh sách song song trong 1 Sử Ký 1:39 chép “Hô-mam.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: là
  rationale: Trong gia phả này, động từ היה làm hệ từ đơn giản, xác định các con trai của Lô-tan; tiếng Việt tự nhiên dùng “là”.
- source_word: בְנֵי
  choice: các con trai của
  rationale: Danh từ ở đây chỉ những người con nam, phù hợp với hai tên nam giới theo sau.
- source_word: לוֹטָן
  choice: Lô-tan
  rationale: Phiên âm tên riêng theo âm dạng Hê-bơ-rơ, đồng thời dùng lối ghi tên tự nhiên và dễ đọc trong tiếng Việt.
- source_word: חֹרִי
  choice: Hô-ri
  rationale: Đây là tên riêng, được phiên âm chứ không dịch nghĩa.
- source_word: הֵימָם
  choice: Hê-mam
  rationale: Cách phiên âm này phản ánh dạng nguyên âm của bản Hê-bơ-rơ tại câu này; dạng song song ở 1 Sử Ký 1:39 khác đôi chút.
- source_word: וַאֲחוֹת
  choice: chị em gái của
  rationale: Từ Hê-bơ-rơ אָחוֹת nghĩa là người chị hoặc em gái; vì nguyên văn không xác định lớn hay nhỏ tuổi, “chị em gái” bảo toàn sự không xác định ấy.
- source_word: תִּמְנָע
  choice: Tim-na
  rationale: Tên riêng được phiên âm sát dạng Hê-bơ-rơ trong câu này.
