  register: Văn phong tường thuật ngắn gọn, trang trọng và tự nhiên. Cấu trúc “lên làm vua kế vị ông” tái hiện công thức kế vị của nguyên văn mà tránh lối dịch cứng “trị vì thay chỗ ông”.
