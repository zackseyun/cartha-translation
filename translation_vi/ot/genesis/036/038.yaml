  text: Sau-lơ chết, và Ba-anh Ha-nan, con Ạc-bô, lên làm vua thay ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Động từ Qal wayyiqtol của מות thuật lại cái chết. “Qua đời” là cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại mà vẫn nêu rõ sự kiện.
- source_word: שָׁאוּל
  choice: Sau-lơ
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt, thích hợp với độc giả phổ thông.
- source_word: וַיִּמְלֹךְ
  choice: lên làm vua
  rationale: Trong công thức kế vị, Qal wayyiqtol của מלך diễn tả việc một người bắt đầu trị vì; “lên làm vua” tự nhiên và chính xác trong tiếng Việt.
- source_word: תַּחְתָּיו
  choice: kế vị ông
  rationale: Trong ngữ cảnh nối ngôi, תחתיו nghĩa là thay vào vị trí của người trước; “kế vị ông” diễn đạt rõ quan hệ kế tục mà không hàm ý quá mức.
- source_word: בַּעַל חָנָן
  choice: Ba-anh Ha-nan
  rationale: Phiên âm tên ghép Hê-bơ-rơ theo âm tiết dễ đọc trong tiếng Việt, đồng thời giữ hai thành tố của tên.
- source_word: בֶּן
  choice: con trai của
  rationale: Dạng cấu tạo chuẩn chỉ quan hệ cha-con trực tiếp.
- source_word: עַכְבּוֹר
  choice: Ạc-bô
  rationale: Phiên âm gần với âm Hê-bơ-rơ và phù hợp quy ước ghi tên riêng bằng tiếng Việt.
