base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: vi
  text: 'Đây là tên các con trai của Ê-sau: Ê-li-pha, con trai của A-đa, vợ Ê-sau; Rê-u-ên, con trai của Ba-sê-mát, vợ Ê-sau.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Đây là tên
  rationale: Giữ lực giới thiệu của אֵלֶּה và cấu trúc sở hữu của שְׁמוֹת, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: בְּנֵי עֵשָׂו
  choice: các con trai của Ê-sau
  rationale: בְּנֵי ở đây chỉ các hậu duệ nam được nêu tên; “con trai” chính xác hơn từ rộng nghĩa “con cái”.
- source_word: אֱלִיפַז
  choice: Ê-li-pha
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo dạng quen dùng trong Kinh Thánh tiếng Việt.
- source_word: בֶּן עָדָה
  choice: con trai của A-đa
  rationale: בֶּן diễn tả quan hệ con trai trực tiếp; tiếng Việt cần “của” để diễn đạt rõ quan hệ này.
- source_word: אֵשֶׁת עֵשָׂו
  choice: vợ Ê-sau
  rationale: Cụm trạng thái cấu tạo có nghĩa là “vợ của Ê-sau”; lược “của” là tự nhiên trong tiếng Việt. Cụm từ được giữ lại cả hai lần như nguyên văn.
- source_word: רְעוּאֵל
  choice: Rê-u-ên
  rationale: Phiên âm trực tiếp tên riêng Hê-bơ-rơ, với phụ âm cuối được Việt hóa tự nhiên.
- source_word: בֶּן בָּשְׂמַת
  choice: con trai của Ba-sê-mát
  rationale: Dịch nhất quán với cấu trúc בֶּן עָדָה ở vế trước.
- source_word: בָּשְׂמַת
  choice: Ba-sê-mát
  rationale: Phiên âm tên riêng Hê-bơ-rơ בָּשְׂמַת theo âm tiết dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả trang trọng, sáng rõ và tự nhiên. Giữ nguyên sự lặp lại “vợ Ê-sau” sau tên mỗi người mẹ vì đây là đặc điểm có chủ ý của cấu trúc Hê-bơ-rơ; không cần chú thích vì bản dịch đã thể hiện trực tiếp.
