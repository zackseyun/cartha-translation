base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: vi
  text: Vì tài sản của họ quá nhiều, khiến họ không thể sống chung với nhau; đất nơi họ tạm cư[a] không thể gánh nổi họ[b] vì đàn gia súc của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đất nơi họ đang lưu trú.” Tiếng Hê-bơ-rơ nói đến nơi họ cư trú tạm thời, không phải nơi định cư lâu dài.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “không thể gánh nổi họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lời giải thích nguyên nhân Ê-sau phải rời khỏi Gia-cốp trong văn cảnh trước.
- source_word: רְכוּשָׁם
  choice: tài sản của họ
  rationale: רְכוּשׁ chỉ của cải, tài sản sở hữu, nhất là tài sản có thể di chuyển; cách dịch này tự nhiên và đủ rộng.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: quá nhiều, khiến họ không thể sống chung với nhau
  rationale: Cấu trúc רָב với מִן và động từ nguyên mẫu diễn tả mức độ vượt quá khả năng cùng cư trú; câu tiếng Việt làm rõ hệ quả vốn hàm chứa trong tiếng Hê-bơ-rơ.
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: vùng đất họ tạm cư
  rationale: מְגוּרִים nói đến nơi cư trú tạm thời của người ngoại kiều; “tạm cư” bảo toàn sắc thái này bằng tiếng Việt hiện đại.
- source_word: לָשֵׂאת אֹתָם
  choice: không đủ sức chứa họ
  rationale: נשא theo nghĩa đen là “mang, gánh”; khi đất là chủ thể, cụm này diễn tả đất không đủ khả năng dung chứa và nâng đỡ họ.
- source_word: מִפְּנֵי
  choice: vì
  rationale: Trong câu này, giới từ nêu nguyên nhân khiến vùng đất không đủ sức chứa họ.
- source_word: מִקְנֵיהֶם
  choice: đàn gia súc của họ
  rationale: מִקְנֶה chỉ chung súc vật nuôi như tài sản, không chỉ riêng bò.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sống chung với nhau” tự nhiên hơn lối cổ “ở chung”; “tạm cư” giữ được mô-típ cư trú tạm thời. Hai dấu chú thích được đặt ngay sau cụm từ tương ứng.
