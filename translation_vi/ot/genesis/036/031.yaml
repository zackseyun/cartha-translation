  terminology: Giữ “xứ Ê-đôm,” “Y-sơ-ra-ên,” và “trị vì” là nhất quán với đăng ký trang trọng hiện đại. “Dân Y-sơ-ra-ên” là cách gọi dân tộc tự nhiên ở đây; chú thích vẫn cần nêu cách nói sát chữ “con trai Y-sơ-ra-ên” và độ mở nghĩa của לְ (“cho/trên”).
