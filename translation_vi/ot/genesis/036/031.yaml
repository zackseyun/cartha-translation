  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của câu Hê-bơ-rơ: lời giới thiệu danh sách, các vua trị vì tại xứ Ê-đôm, và mốc thời gian trước khi một vua trị vì liên hệ với dân Y-sơ-ra-ên. Tuy nhiên, “có vua” làm mờ danh từ số ít không xác định מֶלֶךְ; nên dịch rõ là “một vua.” “Con dân” không sai, nhưng là cách diễn đạt mang sắc thái tôn kính/xã hội không cần thiết cho tên gọi tập thể בְּנֵי יִשְׂרָאֵל trong ngữ cảnh này.'
