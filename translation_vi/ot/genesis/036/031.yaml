base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: vi
  text: Đây là những vua đã trị vì trong xứ Ê-đôm, trước khi một vua trị vì trên dân Y-sơ-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước khi một vua trị vì cho dân Y-sơ-ra-ên.” Tiếng Hê-bơ-rơ nói sát nghĩa: “trước khi một vua trị vì cho/trên con trai Y-sơ-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Mở đầu một danh sách mới; tiếng Việt tự nhiên không cần dịch liên từ וְ, còn “Đây là” giữ được chức năng giới thiệu.
- source_word: הַמְּלָכִים
  choice: những vua
  rationale: Danh từ số nhiều có mạo từ xác định, chỉ nhóm vua sắp được liệt kê.
- source_word: אֲשֶׁר מָלְכוּ
  choice: đã trị vì
  rationale: Động từ מלך ở đây chỉ việc thực thi vương quyền; “trị vì” trang trọng, chính xác và tự nhiên.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: trong xứ Ê-đôm
  rationale: Giữ rõ danh từ אֶרֶץ và ý nghĩa lãnh thổ, thay vì rút gọn thành “tại Ê-đôm”.
- source_word: לִפְנֵי
  choice: trước khi
  rationale: Diễn đạt quan hệ thời gian rõ ràng và tự nhiên trong tiếng Việt.
- source_word: מְלָךְ מֶלֶךְ
  choice: có vua trị vì
  rationale: Giữ danh từ số ít không xác định của tiếng Hê-bơ-rơ và diễn đạt tự nhiên việc vương quyền xuất hiện trong Y-sơ-ra-ên, không thêm ý “bất cứ vua nào”.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: trên con dân Y-sơ-ra-ên
  rationale: “Con dân Y-sơ-ra-ên” là cách gọi dân tộc tự nhiên trong tiếng Việt; “trên” thể hiện quan hệ cai trị do ngữ cảnh của động từ “trị vì”, đồng thời được chú thích vì לְ cũng có thể hiểu là “cho”.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh này, cụm từ là tên gọi tập thể của dân tộc chứ không chỉ các cá nhân nam; “con dân Y-sơ-ra-ên” vừa giữ sắc thái nguồn gốc vừa tự nhiên trong tiếng Việt.
- issue: Quan hệ do לְ trong לִבְנֵי יִשְׂרָאֵל biểu thị
  choice: trị vì trên
  alternative: trị vì cho
  rationale: Ngữ cảnh vương quyền ủng hộ quan hệ cai trị, nhưng giới từ Hê-bơ-rơ không tự nó loại trừ cách hiểu “cho”; vì vậy phương án kia được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xứ” để giữ sắc thái lãnh thổ của אֶרֶץ; dùng “vua” thay vì “các vị vua” để tránh thêm sắc thái tôn kính không có trong nguyên văn.
