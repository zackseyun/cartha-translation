  to: Đây là những vua đã trị vì trong xứ Ê-đôm, trước khi một vua trị vì trên dân Y-sơ-ra-ên.[a]
  rationale: Sửa “có vua” thành “một vua” để phản ánh trực tiếp danh từ số ít trong nguyên văn. Thay “con dân Y-sơ-ra-ên” bằng “dân Y-sơ-ra-ên” trong bản văn chính để có cách gọi tập thể hiện đại, trung tính và tự nhiên hơn, trong khi chú thích bảo lưu cách diễn đạt sát chữ và phương án nghĩa của giới từ לְ.
