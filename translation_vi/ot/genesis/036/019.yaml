  text: אֵ֧לֶּה בְנֵי עֵשָׂ֛ו וְ/אֵ֥לֶּה אַלּוּפֵי/הֶ֖ם ה֥וּא אֱדֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: vi
  text: Đây là các con trai của Ê-sau; đây là các tộc trưởng[a] của họ. Ông là Ê-đôm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các thủ lĩnh”. Từ Hê-bơ-rơ אַלּוּפִים chỉ những người đứng đầu thị tộc hoặc bộ tộc tại Ê-đôm.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ định số nhiều mở đầu lời tổng kết gia phả; tiếng Việt không cần biểu thị số nhiều trên đại từ, và cấu trúc hiện tại phản ánh mệnh đề không động từ trong tiếng Hê-bơ-rơ.
- source_word: בְנֵי
  choice: các con trai của
  rationale: Trong gia phả này, từ בֵּן chỉ cụ thể những người con thuộc nam giới; “các con trai” chính xác hơn “con cái” hay “hậu duệ”.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: וְאֵלֶּה
  choice: và các ... của họ
  rationale: Liên từ nối vế nhận diện thứ hai. Tiếng Việt tự nhiên có thể lược bỏ lần lặp “đó là” mà vẫn giữ quan hệ song song của nguyên văn.
- source_word: אַלּוּפֵיהֶם
  choice: các tộc trưởng của họ
  rationale: אַלּוּף trong Sáng Thế Ký 36 chỉ những người đứng đầu thị tộc hoặc bộ tộc tại Ê-đôm; “tộc trưởng” vừa rõ nghĩa vừa phù hợp văn cảnh gia tộc-chính trị.
- source_word: הוּא
  choice: Ông chính là
  rationale: Đại từ này quay lại chỉ Ê-sau và trực tiếp đồng nhất ông với Ê-đôm; “chính là” giữ sắc thái nhận diện nhấn mạnh.
- source_word: אֱדוֹם
  choice: Ê-đôm
  rationale: Dùng dạng phiên âm quen thuộc; trong văn cảnh, tên này nhận diện Ê-sau với Ê-đôm, tổ phụ mang tên của dân Ê-đôm.
