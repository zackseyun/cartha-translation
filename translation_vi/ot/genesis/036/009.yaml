  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּ/הַ֖ר שֵׂעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: vi
  text: Đây là gia phả của Ê-sau, cha của Ê-đôm, tại miền núi Sê-i-rơ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên núi Sê-i-rơ” hoặc “trong vùng núi Sê-i-rơ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Công thức mở đầu tự nhiên trong tiếng Việt; liên từ וְ nối với văn mạch trước nhưng không nhất thiết phải dịch thành “và” trong câu mở mục này.
- source_word: תֹּלְדוֹת
  choice: gia phả
  rationale: Trong ngữ cảnh đoạn này, từ này giới thiệu danh sách dòng dõi của Ê-sau; “gia phả” vừa tự nhiên vừa giữ chức năng cấu trúc của công thức trong Sáng Thế Ký.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: אֲבִי אֱדֹום
  choice: tổ phụ của Ê-đôm
  rationale: Ở đây Ê-đôm chỉ dân tộc phát xuất từ Ê-sau, nên “tổ phụ” truyền đạt ý nghĩa nguồn gốc dân tộc tự nhiên hơn “cha” theo nghĩa trực tiếp.
- source_word: בְּהַר שֵׂעִיר
  choice: tại miền núi Sê-i-rơ
  rationale: הַר trong địa danh có thể chỉ một ngọn núi hoặc vùng núi; “miền núi” phù hợp với Sê-i-rơ như một khu vực địa lý, đồng thời ghi nhận phương án sát hình thức hơn trong chú thích.
theological_decisions:
- issue: Ý nghĩa của “cha của Ê-đôm”
  choice: tổ phụ của Ê-đôm
  alternative: cha của Ê-đôm
  rationale: Cách dịch được chọn thể hiện quan hệ thủy tổ giữa Ê-sau và dân Ê-đôm, không coi Ê-đôm trong câu này chỉ là một người con trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Gia phả” phù hợp với danh sách hậu duệ theo sau; “miền núi” giữ được tính địa lý rộng của cụm từ Hê-bơ-rơ mà không khẳng định đây chỉ là một đỉnh núi.
