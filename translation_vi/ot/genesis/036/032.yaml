  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lên làm vua” cho công thức kế vị; giữ giới từ chỉ địa điểm bằng “tại” và ghi cách hiểu về phạm vi cai trị trong chú thích.
