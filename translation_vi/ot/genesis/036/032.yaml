  text: וַ/יִּמְלֹ֣ךְ בֶּ/אֱד֔וֹם בֶּ֖לַע בֶּן בְּע֑וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/032.yaml
  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
translation:
  language: vi
  text: Bê-la, con trai Bê-ô, lên làm vua tại Ê-đôm[a]; thành của ông tên là Đin-ha-ba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm vua cai trị Ê-đôm.” Tiếng Hê-bơ-rơ nói sát nghĩa là “làm vua tại Ê-đôm,” với giới từ chỉ địa điểm; trong ngữ cảnh, câu này cũng có thể nói đến lãnh thổ mà ông cai trị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: lên làm vua
  rationale: Trong danh sách kế vị các vua, động từ מלך ở dạng này vừa thuật lại việc đăng vị vừa hàm ý cai trị; “lên làm vua” tự nhiên trong tiếng Việt và phù hợp với công thức nối tiếp.
- source_word: בֶּאֱדוֹם
  choice: tại Ê-đôm
  rationale: Giới từ בְּ trước hết chỉ địa điểm. “Tại Ê-đôm” giữ sát cách diễn đạt của tiếng Hê-bơ-rơ mà vẫn tự nhiên; theo ngữ cảnh cũng có thể hiểu là cai trị Ê-đôm.
- source_word: בֶּלַע
  choice: Bê-la
  rationale: Tên riêng được phiên âm theo cách đọc Hê-bơ-rơ và quy ước tên Kinh Thánh bằng tiếng Việt.
- source_word: בֶּן בְּעוֹר
  choice: con trai Bê-ô
  rationale: Giữ nguyên quan hệ gia phả được nêu rõ bằng cấu trúc “con trai” trong tiếng Hê-bơ-rơ.
- source_word: וְשֵׁם עִירוֹ
  choice: thành của ông tên là
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời thể hiện đại từ sở hữu ngôi thứ ba số ít gắn với עִירוֹ.
- source_word: דִּנְהָבָה
  choice: Đin-ha-ba
  rationale: Địa danh được phiên âm thay vì dịch nghĩa.
theological_decisions: []
