lexical_decisions:
- source_word: בְנֵי
  choice: các con
  rationale: Danh sách gồm Đi-sôn và Ô-hô-li-ba-ma, người được xác định là con gái; vì vậy dùng từ bao quát tự nhiên trong tiếng Việt thay vì «các con trai».
- source_word: דִּשֹׁן
  choice: Đi-sôn
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc trong tiếng Việt.
- source_word: אָהֳלִיבָמָה
  choice: Ô-hô-li-ba-ma
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc trong tiếng Việt.
- source_word: בַּת עֲנָה
  choice: con gái của A-na
  rationale: Chuyển nghĩa trực tiếp, giữ nguyên việc văn bản lặp lại tên A-na.
