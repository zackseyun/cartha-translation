  source_fidelity: 'Cấu trúc và các động từ chính được chuyển đạt đúng: יהוה rời đi sau khi nói xong với Áp-ra-ham, và Áp-ra-ham trở về chỗ của mình. Tuy nhiên, bản dịch danh riêng יהוה là “Đức Giê-hô-va” không nhất quán với quyết định thuật ngữ của dự án và vệt kiểm tra tiếng Anh, vốn chọn “Yahweh.”'
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và phù hợp văn kể chuyện. “Rồi …, còn …” diễn tả được sự chuyển chủ thể trong tiếng Việt; “chỗ mình” giữ được tính không xác định của מָקוֹם.
  terminology: Cần đổi “Đức Giê-hô-va” thành “Yahweh” để bảo toàn cách chuyển tự danh riêng được quy định. Chú thích nên nêu YHWH và có thể ghi nhận dạng Việt hóa truyền thống “Giê-hô-va” như một cách gọi khác, không thay thế bản văn chính.
