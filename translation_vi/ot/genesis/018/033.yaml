  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: vi
  text: Rồi Yahweh[a] rời đi sau khi phán xong với Áp-ra-ham, còn Áp-ra-ham trở về chỗ mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH.” Danh này cũng thường được Việt hóa là “Giê-hô-va.”'
    reason: Nêu dạng danh riêng trong nguyên văn và một dạng Việt hóa truyền thống, trong khi bản văn chính theo quyết định thuật ngữ của dự án dùng “Yahweh.”
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: rời đi
  rationale: Trong mạch văn tường thuật, הלך chỉ việc Đức Giê-hô-va rời khỏi cuộc gặp; “rời đi” tự nhiên và không thêm ý về đích đến.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: כַּאֲשֶׁר כִּלָּה לְדַבֵּר
  choice: sau khi phán xong
  rationale: Cụm này diễn tả việc nói đã hoàn tất trước khi rời đi; “phán” thích hợp với lời nói của Đức Chúa Trời trong văn phong Kinh Thánh tiếng Việt.
- source_word: אֶל אַבְרָהָם
  choice: với Áp-ra-ham
  rationale: Dù אֶל có hướng nghĩa cơ bản là “đến/với”, tiếng Việt tự nhiên nói “phán với” một người.
- source_word: שָׁב
  choice: trở về
  rationale: שׁוב ở đây diễn tả sự quay lại nơi trước đó.
- source_word: לִמְקֹמוֹ
  choice: chỗ của mình
  rationale: Giữ nghĩa không xác định của מָקוֹם là “chỗ/nơi”, không diễn giải cụ thể thành “nhà”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Hằng Hữu; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” bảo tồn đây là danh riêng, đồng thời là dạng phiên âm đã quen thuộc trong tiếng Việt; chú thích nêu rõ dạng Hê-bơ-rơ và cách phiên âm khác.
translation_notes:
  register: Văn phong tường thuật hiện đại, trang trọng và dễ hiểu. Dùng “rồi” để nối diễn tiến, “còn” để thể hiện sự chuyển chủ thể; không xác định “chỗ” là nhà hay trại vì nguyên văn không nói rõ.
