- from: Rồi Đức Giê-hô-va[a] rời đi sau khi phán xong với Áp-ra-ham, còn Áp-ra-ham trở về chỗ của mình.
  to: Rồi Yahweh[a] rời đi sau khi phán xong với Áp-ra-ham, còn Áp-ra-ham trở về chỗ mình.
  rationale: Chỉ sửa cách chuyển danh יהוה để phù hợp với nguồn và quyết định thuật ngữ của dự án. Giữ “rời đi,” “phán xong với,” “trở về,” và “chỗ mình” vì chúng chuyển đạt sát nghĩa mà vẫn tự nhiên, không xác định thêm điểm đến hay nơi ở của Áp-ra-ham.
