base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: vi
  text: 'Bấy giờ, Áp-ra-ham đến gần và thưa: “Ngài thật sự sẽ quét sạch[a] người công chính cùng với kẻ ác sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Quét sạch” cũng có thể dịch là “tiêu diệt” hoặc “diệt sạch”; động từ Hê-bơ-rơ diễn tả việc loại bỏ trong sự phán xét.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: đến gần
  rationale: Động từ נגשׁ chỉ việc tiến lại gần; cách dịch này giữ được cả chuyển động thực tế lẫn sắc thái Áp-ra-ham bước tới để cầu thay.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: וַיֹּאמַר
  choice: thưa
  rationale: אמר thường là “nói”, nhưng trong lời Áp-ra-ham kính cẩn hướng về Đức Chúa Trời, “thưa” tự nhiên và phù hợp ngữ vực tiếng Việt mà không thêm nội dung.
- source_word: הַאַף
  choice: thật sự ... sao
  rationale: Tổ hợp nghi vấn הַ với אַף nhấn mạnh sự kinh ngạc và khẩn thiết trong câu hỏi; cấu trúc “thật sự ... sao?” chuyển tải sức nhấn tự nhiên.
- source_word: תִּסְפֶּה
  choice: quét sạch
  rationale: Động từ ספה ở đây diễn tả việc loại bỏ trong sự phán xét; “quét sạch” giữ hình ảnh mạnh của nguyên văn.
- source_word: צַדִּיק
  choice: người công chính
  rationale: Danh từ số ít được dùng theo nghĩa đại diện, chỉ người thuộc hạng công chính; cách dịch giữ số ít hình thức và phạm trù đạo đức.
- source_word: עִם
  choice: cùng với
  rationale: Diễn đạt rõ việc người công chính chịu chung số phận với kẻ gian ác trong câu hỏi.
- source_word: רָשָׁע
  choice: kẻ gian ác
  rationale: Dạng số ít mang nghĩa đại diện và đối lập trực tiếp với “người công chính”; “kẻ gian ác” là cách nói tự nhiên, rõ phạm trù đạo đức.
theological_decisions:
- issue: Các phạm trù đạo đức ở dạng số ít đại diện
  choice: Dịch צַדִּיק và רָשָׁע là “người công chính” và “kẻ gian ác”.
  alternative: Dịch theo số nhiều là “những người công chính” và “những kẻ gian ác”.
  rationale: Nguyên văn dùng số ít theo nghĩa đại diện để nêu vấn đề về công lý của Đức Chúa Trời. Giữ dạng số ít trong tiếng Việt vừa sát hình thức vừa không giới hạn câu hỏi vào hai cá nhân cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” thể hiện lời nói kính cẩn với Đức Chúa Trời; câu hỏi giữ sức nhấn và sự căng thẳng thần học của nguyên văn.
