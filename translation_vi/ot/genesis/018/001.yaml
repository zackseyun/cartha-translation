base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: vi
  text: Yahweh hiện ra với ông bên những cây sồi của Mam-rê[a], lúc ông đang ngồi ở cửa lều vào lúc trời nóng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bên những cây hồ trăn của Mam-rê.” Từ Hê-bơ-rơ có thể chỉ những cây lớn như sồi hoặc hồ trăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Động từ Niphal của ראה ở đây chỉ sự hiện hiện hữu hình; “hiện ra” tự nhiên trong văn kể chuyện và không thêm ý giải thích như “tự bày tỏ”.
- source_word: אֵלָיו
  choice: với ông
  rationale: Diễn đạt giới từ אֶל với hậu tố ngôi ba số ít giống đực, quy chiếu về Áp-ra-ham trong mạch văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: בְּאֵלֹנֵי
  choice: bên những cây sồi
  rationale: אֵלוֹן có thể chỉ cây sồi hoặc cây nhựa thông; chọn “cây sồi” cho câu chính vì rõ ràng, tự nhiên, đồng thời ghi nhận sự bất định về loài cây trong chú thích.
- source_word: מַמְרֵא
  choice: Mam-rê
  rationale: Phiên âm tên riêng theo cách đọc tự nhiên trong tiếng Việt.
- source_word: וְהוּא יֹשֵׁב
  choice: lúc ông đang ngồi
  rationale: Cụm phân từ tạo bối cảnh đồng thời cho sự hiện ra; cách dịch này tự nhiên và giữ quan hệ thời gian.
- source_word: פֶּתַח הָאֹהֶל
  choice: ở cửa lều
  rationale: פֶּתַח là chỗ mở hoặc lối vào; “cửa lều” ngắn gọn, cụ thể và tự nhiên trong tiếng Việt.
- source_word: כְּחֹם הַיּוֹם
  choice: giữa cái nóng ban ngày
  rationale: Giữ hình ảnh sức nóng của ngày mà không xác định quá mức đó chính xác là giữa trưa hay đầu giờ chiều.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / Chúa
  rationale: Nguyên văn dùng trực tiếp Tứ Tự YHWH. Phiên âm “Yahweh” bảo toàn tính chất tên riêng và không thay thế bằng tước hiệu.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “ông” vì câu này tiếp nối mạch truyện về Áp-ra-ham; giữ “Yahweh” như tên riêng. Chú thích bảo toàn sự không chắc chắn về loài cây.
