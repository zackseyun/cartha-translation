- from: Yahweh hiện ra với ông bên những cây sồi của Mam-rê[a], lúc ông đang ngồi ở cửa lều giữa cái nóng ban ngày.
  to: Yahweh hiện ra với ông bên những cây sồi của Mam-rê[a], lúc ông đang ngồi ở cửa lều vào lúc trời nóng.
  rationale: Sửa chú thích thực vật để loại bỏ cách gọi sai “cây nhựa thông” và thay bằng “cây hồ trăn,” tương ứng với terebinth. Điều chỉnh nhẹ thành ngữ chỉ cái nóng trong ngày cho tự nhiên hơn trong tiếng Việt, không thay đổi nghĩa hay mức độ bất định của nguyên văn.
