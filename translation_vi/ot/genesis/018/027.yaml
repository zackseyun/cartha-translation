source:
  edition: WLC
  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: vi
  text: 'Bấy giờ, Áp-ra-ham đáp lời, thưa rằng: “Này, tôi xin mạo muội thưa với Chúa của tôi[a], dù tôi chỉ là bụi đất và tro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chúa của tôi”. Hình thức Hê-bơ-rơ có thể dùng làm lời xưng hô kính trọng; ở đây viết hoa vì văn cảnh cho thấy Đấng Áp-ra-ham thưa chuyện được đồng nhất với Đức Giê-hô-va.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: đáp lời rằng
  rationale: Giữ sắc thái đối đáp và công thức dẫn lời kép của văn kể chuyện Hê-bơ-rơ, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: הִנֵּה נָא
  choice: Này
  rationale: “Này” giữ chức năng thu hút sự chú ý của הִנֵּה; sắc thái khẩn khoản, kính cẩn của נָא được thể hiện trong toàn câu qua cách xưng “con” và động từ “thưa”, tránh một cấu trúc có chữ “xin” nhưng gượng ép trong tiếng Việt.
- source_word: הוֹאַלְתִּי
  choice: con đã dám
  rationale: Động từ diễn tả việc tự mình mạnh dạn đảm nhận hay mạo muội làm điều gì; “đã dám” giữ được cả sự táo bạo lẫn thái độ khiêm nhường của Áp-ra-ham.
- source_word: לְדַבֵּר
  choice: thưa
  rationale: “Thưa” là cách nói tự nhiên, kính cẩn trong tiếng Việt khi người ở địa vị thấp hơn nói với bậc trên, phù hợp ngữ cảnh mà không thay đổi nội dung hành động nói.
- source_word: אֶל אֲדֹנָי
  choice: với Chúa của con
  rationale: Giữ đại từ sở hữu ngôi thứ nhất trong אֲדֹנָי. Viết hoa “Chúa” theo ngữ cảnh người được Áp-ra-ham thưa chuyện được đồng nhất với Đức Giê-hô-va, nhưng chú thích vẫn bảo lưu khả năng đây là lối xưng hô kính trọng “chúa của con”.
- source_word: וְאָנֹכִי
  choice: dù con chỉ là
  rationale: Liên từ וְ mang ý tương phản, nhượng bộ trong ngữ cảnh; “dù” diễn đạt quan hệ ấy tự nhiên. “Chỉ” làm rõ sự tự hạ mình vốn hàm chứa trong phép đối lập, không biến nó thành một khẳng định bản thể khác.
- source_word: עָפָר וָאֵפֶר
  choice: bụi đất và tro tàn
  rationale: Giữ hình ảnh song đôi về thân phận hữu hạn và thấp hèn; “bụi đất và tro tàn” là cách diễn đạt rõ ràng, trang trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch אֲדֹנָי trong lời Áp-ra-ham thưa
  choice: Chúa của con
  alternative: chúa của con
  rationale: Bản thân hình thức Hê-bơ-rơ có thể là lời xưng hô kính trọng với một bậc trên, nhưng văn cảnh trực tiếp cho thấy Áp-ra-ham đang thưa với nhân vật được đồng nhất với Đức Giê-hô-va. Viết hoa phản ánh văn cảnh ấy mà không thay אֲדֹנָי bằng danh giao ước; chú thích bảo lưu tính đa nghĩa thật sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng “con” và dùng “thưa” truyền đạt sự kính cẩn của Áp-ra-ham; “đã dám” vẫn giữ sức căng giữa lòng khiêm nhường và sự mạnh dạn. Dấu chú thích [a] xuất hiện ngay sau cụm từ có cách hiểu khác.
