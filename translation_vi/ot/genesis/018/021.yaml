base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: vi
  text: Ta sẽ xuống xem liệu những việc chúng làm có hoàn toàn đúng với tiếng kêu than về nó đã thấu đến Ta hay không[a]; nếu không, Ta sẽ biết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xem chúng có làm hoàn toàn theo tiếng kêu than về nó đã thấu đến Ta hay không.” Cụm từ Hê-bơ-rơ diễn tả việc hành vi của họ có hoàn toàn tương ứng với tiếng kêu tố cáo hay không.'
    reason: lexical_alternative
  - marker: b
    text: “Ta sẽ biết” giữ nguyên cách diễn đạt của tiếng Hê-bơ-rơ; cũng có thể hiểu theo nghĩa “Ta sẽ xác minh.”
    reason: clarification
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: Ta sẽ xuống
  rationale: Thể cohortative diễn tả ý định/quyết định của người nói; “Ta sẽ xuống” tự nhiên và giữ nguyên cách diễn tả mang tính nhân hình. Tiểu từ נָא không nhất thiết phải dịch riêng trong tiếng Việt vì sắc thái thúc đẩy/hiện thời đã được ngữ cảnh chuyển tải.
- source_word: וְאֶרְאֶה
  choice: xem
  rationale: Ở đây ראה mang nghĩa quan sát để xác minh; “xem” vừa tự nhiên vừa giữ được hình ảnh của nguyên văn.
- source_word: הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי
  choice: đúng như toàn bộ tiếng kêu than về nó đã thấu đến Ta
  rationale: צעקה là tiếng kêu phát sinh từ đau khổ hoặc bất công nghiêm trọng. Hậu tố giống cái có thể chỉ thành/thành phố đang được nói đến; “về nó” diễn đạt quan hệ theo ngữ cảnh mà không biến nó thành tiếng kêu của chính thành phố. “Đã thấu đến Ta” là cách nói tự nhiên, trang trọng cho chuyển động hướng đến người nói.
- source_word: עָשׂוּ כָּלָה
  choice: chúng có làm đúng như toàn bộ
  rationale: Cụm từ Hê-bơ-rơ khó và cô đọng, có thể hiểu rằng hành vi của dân thành hoàn toàn tương ứng với tiếng kêu tố cáo. Cách dịch đặt כָּלָה với toàn bộ nội dung của tiếng kêu, đồng thời chú thích khả năng hiểu khác.
- source_word: וְאִם לֹא אֵדָעָה
  choice: nếu không, Ta sẽ biết
  rationale: Giữ sát cấu trúc điều kiện và động từ “biết” của nguyên văn, không diễn giải thành “Ta sẽ điều tra ra”.
theological_decisions:
- issue: Cách diễn tả mang tính nhân hình về việc Đức Chúa Trời điều tra
  choice: Giữ “Ta sẽ xuống xem” và “Ta sẽ biết”.
  alternative: Diễn giải thành “Ta sẽ xem xét/phán xét” để làm nhẹ nét nhân hình.
  rationale: Nguyên văn trình bày Đức Chúa Trời bằng ngôn ngữ hành động và nhận biết của con người. Bản dịch giữ nguyên sức căng thần học này thay vì giải quyết bằng một diễn giải về sự toàn tri.
- issue: Chủ thể số nhiều không được nêu rõ của עָשׂוּ
  choice: Dịch là “chúng”, chỉ những người đã gây nên tiếng kêu than.
  alternative: Nêu rõ “dân thành Sô-đôm và Gô-mô-rơ”.
  rationale: Tiếng Hê-bơ-rơ chỉ dùng động từ số nhiều, không nêu danh từ chủ thể; vì vậy không nên bổ sung tên riêng vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Câu giữ nguyên cách nói nhân hình và sự cô đọng của nguyên văn, với chú thích cho thành ngữ עָשׂוּ כָּלָה.
