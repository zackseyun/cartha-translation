  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: vi
  text: 'Ông nói: “Này, con đã mạo muội thưa với Chúa. Biết đâu có hai mươi người được tìm thấy ở đó.” Ngài đáp: “Vì hai mươi người ấy, Ta sẽ không hủy diệt nơi đó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Này
  rationale: Diễn đạt tự nhiên lời mở đầu nhằm thu hút sự chú ý, đồng thời phù hợp với giọng khẩn khoản, kính cẩn trong ngữ cảnh.
- source_word: הוֹאַלְתִּי
  choice: con đã mạo muội
  rationale: Thể hiện việc Áp-ra-ham dám nhận lấy sự tự do để nói trong tư thế khiêm nhường; tự nhiên hơn cách dịch sát là “đã bắt đầu/đảm nhận”.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: thưa với Chúa
  rationale: “Thưa” diễn tả lời nói kính cẩn; “Chúa” nhận diện Đấng được Áp-ra-ham thưa chuyện là nhân vật thần linh trong văn cảnh mà không thay bằng danh YHWH.
- source_word: אוּלַי
  choice: Biết đâu
  rationale: Giữ sắc thái phỏng đoán dè dặt và khẩn khoản của lời cầu thay, bằng một cách nói tự nhiên trong tiếng Việt.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: tại đó sẽ tìm được hai mươi người
  rationale: Giữ ý bị động/phi tác nhân của Niphal theo cách nói tiếng Việt tự nhiên; thêm “người” do ngữ cảnh nói đến số người công chính.
- source_word: לֹא אַשְׁחִית
  choice: Ta sẽ không hủy diệt nơi đó
  rationale: Động từ chỉ sự hủy diệt; “nơi đó” bổ sung tân ngữ được hiểu ngầm từ địa điểm đang được bàn đến mà không thu hẹp thành riêng thành Sô-đôm.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: Vì hai mươi người ấy
  rationale: Diễn đạt lý do nơi ấy được tha vì nhóm hai mươi người cụ thể đang được nhắc đến; “ấy” phản ánh tính xác định của mạo từ Hebrew.
theological_decisions:
- issue: Cách dịch אֲדֹנָי trong lời Áp-ra-ham thưa
  choice: Chúa
  alternative: chúa tôi / ngài
  rationale: Văn cảnh nhận diện Đấng đối thoại là nhân vật thần linh; “Chúa” là tước hiệu kính trọng thích hợp, nhưng không nhập danh giao ước YHWH vốn không xuất hiện dưới dạng ấy trong câu này.
- issue: Đối tượng bị hủy diệt được hiểu ngầm
  choice: nơi đó
  alternative: thành ấy / nó
  rationale: Bản Hebrew không nêu tân ngữ. “Nơi đó” giúp câu tiếng Việt trọn nghĩa mà vẫn giữ phạm vi tham chiếu mở, tránh quyết định quá mức rằng chỉ một thành cụ thể được nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con—Chúa” thể hiện sự kính cẩn của Áp-ra-ham; lời đáp dùng “Ta”. “Ông” và “Ngài” giúp phân biệt hai người nói mà không lặp tên vốn không có trong nguyên văn.
