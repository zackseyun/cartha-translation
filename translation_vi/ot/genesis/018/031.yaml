revisions:
- from: 'Ông nói: “Này, con đã mạo muội thưa với Chúa. Biết đâu tại đó sẽ tìm được hai mươi người.” Ngài đáp: “Vì hai mươi người ấy, Ta sẽ không hủy diệt nơi đó.”'
  to: 'Ông nói: “Này, con đã mạo muội thưa với Chúa. Biết đâu có hai mươi người được tìm thấy ở đó.” Ngài đáp: “Vì hai mươi người ấy, Ta sẽ không hủy diệt nơi đó.”'
  rationale: Chỉ sửa cách diễn đạt mệnh đề “twenty will be found there” để tránh thêm hàm ý một người đang đi tìm, đồng thời bảo toàn nghĩa bị động và số người được ngầm hiểu từ ngữ cảnh.
  reviewer_model: gpt-5.6-terra
