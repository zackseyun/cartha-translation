  yaml_path: translation/ot/genesis/018/004.yaml
  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: vi
  text: Xin hãy cho đem một ít nước đến; các vị hãy rửa chân[a], rồi nghỉ dưới cây[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Việc rửa chân là tập tục tiếp khách trong bối cảnh người ta đi dép trên những con đường nhiều bụi.
    reason: cultural_context
  - marker: b
    text: Hay “tựa mình dưới cây”. Động từ Hê-bơ-rơ có nghĩa sát là “tựa” hoặc “ngả mình”, ở đây chỉ việc nghỉ dưới bóng cây.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: Xin cho người đem ... đến
  rationale: Thể bị động mang sắc thái thỉnh cầu lịch sự. Tiếng Việt tự nhiên thường dùng cấu trúc phiếm chỉ “cho người đem... đến”, vừa giữ ý nước được mang tới vừa thể hiện נָא.
- source_word: מְעַט מַיִם
  choice: một ít nước
  rationale: Giữ đúng ý lượng nước nhỏ và lời mời khiêm nhường của Áp-ra-ham.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: để các vị rửa chân
  rationale: Mệnh lệnh số nhiều ở đây mang sắc thái lời mời; “các vị” phù hợp phép lịch sự dành cho khách. Liên từ được diễn đạt bằng “để” cho tự nhiên trong tiếng Việt mà không thay đổi mục đích thực tế của việc mang nước.
- source_word: וְהִשָּׁעֲנוּ
  choice: rồi nghỉ
  rationale: Động từ Niphal của שען có nghĩa sát là tựa/ngả mình; trong bối cảnh tiếp khách, “nghỉ” truyền đạt tự nhiên hành động dừng chân dưới bóng cây, còn nghĩa sát hơn được ghi chú.
- source_word: תַּחַת הָעֵץ
  choice: dưới gốc cây
  rationale: Trong tiếng Việt, “dưới gốc cây” là cách nói tự nhiên về việc ngồi nghỉ dưới bóng một cây cụ thể; mạo từ xác định trong tiếng Hê-bơ-rơ được hiểu theo ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và hiếu khách. Dùng “các vị” để thể hiện ngôi thứ hai số nhiều cùng thái độ kính trọng; tránh lối diễn đạt cổ như “xin hãy lấy chút nước” vì dễ khiến người đọc hiểu chính các vị khách phải đi lấy nước.
