base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: vi
  text: 'Người ấy nói: “Tôi chắc chắn sẽ trở lại gặp ông vào khoảng thời gian này năm tới[a]; và kìa, Sa-ra, vợ ông, sẽ có một con trai.” Sa-ra đang lắng nghe ở cửa lều, và cửa lều ở phía sau người ấy.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn theo sát chữ: “vào thời điểm của sự sống.” Đây là thành ngữ, trong ngữ cảnh có nghĩa là “vào khoảng thời gian này năm tới.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc dịch sát cấu trúc hơn: “Sa-ra đang lắng nghe ở cửa lều, và nó ở phía sau người ấy.” Các đại từ Hê-bơ-rơ rất cô đọng; “nó” có lẽ chỉ lều hoặc cửa lều, nên ý là cửa lều ở phía sau người nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Người ấy nói
  rationale: Động từ ngôi ba số ít giống đực không nêu lại danh tính người nói. “Người ấy” giữ chủ thể không xác định như câu Hê-bơ-rơ, thay vì tự ý thêm “Đức Giê-hô-va” hay “một trong những người ấy”.
- source_word: שׁוֹב אָשׁוּב
  choice: Tôi chắc chắn sẽ trở lại
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ cùng gốc nhấn mạnh tính chắc chắn; “chắc chắn” diễn đạt tự nhiên lực nhấn mạnh ấy.
- source_word: כָּעֵת חַיָּה
  choice: vào khoảng thời gian này năm tới
  rationale: Đây là một thành ngữ chỉ khi mùa hoặc thời điểm này trở lại, trong ngữ cảnh là khoảng cùng thời gian vào năm sau.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của tiểu từ Hê-bơ-rơ.
- source_word: לְשָׂרָה אִשְׁתֶּךָ ... בֵן
  choice: Sa-ra, vợ ông, sẽ có một con trai
  rationale: Chuyển cấu trúc Hê-bơ-rơ theo nghĩa đen “một con trai cho Sa-ra, vợ ông” sang cách diễn đạt tiếng Việt tự nhiên mà không thay đổi nội dung lời hứa.
- source_word: שָׂרָה שֹׁמַעַת
  choice: Sa-ra đang lắng nghe
  rationale: Phân từ diễn tả hành động đang tiếp diễn trong cảnh; “đang lắng nghe” truyền đạt đúng sắc thái kéo dài và có chủ ý.
- source_word: פֶּתַח הָאֹהֶל
  choice: tại cửa lều
  rationale: Cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt cho vị trí nơi cửa mở của lều.
- source_word: וְהוּא אַחֲרָיו
  choice: ở phía sau người ấy
  rationale: Bản dịch chính kết hợp cụm này với vị trí của Sa-ra để câu tiếng Việt tự nhiên. Chú thích bảo lưu cách nối cú pháp sát chữ và sự cô đọng, mơ hồ của các đại từ Hê-bơ-rơ.
theological_decisions:
- issue: Danh tính người nói
  choice: Dùng “Người ấy” mà không xác định thêm
  alternative: “Đức Giê-hô-va phán” hoặc “một trong những người ấy nói”
  rationale: Nguyên văn câu này chỉ dùng động từ ngôi ba số ít và không nêu lại danh tính chủ thể; bản dịch không đưa quyết định giải nghĩa từ văn cảnh rộng hơn vào chính câu này.
- issue: Lời hứa về con trai của Sa-ra
  choice: “Sa-ra, vợ ông, sẽ có một con trai”
  alternative: “sẽ có một con trai cho Sa-ra, vợ ông”
  rationale: Cách dịch chính rõ nghĩa và tự nhiên, nhưng không bổ sung chi tiết về việc thụ thai hay xác định chính xác thời điểm sinh ngoài điều nguyên văn nói.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi/ông” trong lời thoại để tránh lối xưng hô quá cổ và không ngầm xác định người nói là Đức Chúa Trời. Tên riêng được phiên âm “Sa-ra”. Các chú thích giữ lại thành ngữ khó và điểm mơ hồ về cú pháp, đại từ ở cuối câu.
