  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: vi
  text: Có điều gì quá khó đối với Yahweh chăng?[a] Đến kỳ đã định, ta sẽ trở lại với con, vào khoảng thời gian này năm sau,[b] và Sa-ra sẽ có một con trai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Có điều gì quá kỳ diệu đối với Yahweh chăng?” Động từ Hê-bơ-rơ có thể chỉ điều phi thường hoặc vượt quá khả năng của con người.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn là một thành ngữ Hê-bơ-rơ: “vào khoảng thời gian của sự sống.” Trong ngữ cảnh, thành ngữ này có lẽ chỉ cùng mùa vào năm sau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: có điều gì quá khó ... chăng?
  rationale: Dạng Niphal của פלא có thể chỉ điều phi thường, kỳ diệu hoặc vượt quá khả năng. Trong câu hỏi tu từ này, “quá khó” diễn đạt tự nhiên ý điều gì đó vượt quá năng lực, nhưng không tăng cường thành “không thể”.
- source_word: מֵיְהוָה
  choice: đối với Yahweh
  rationale: Giới từ מן đi với פלא biểu thị giới hạn hoặc tương quan; “đối với Yahweh” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: דָּבָר
  choice: điều gì
  rationale: דָּבָר có nghĩa rộng là sự việc, điều hoặc vấn đề; “điều gì” phù hợp với câu hỏi tu từ tiếng Việt.
- source_word: לַמּוֹעֵד
  choice: Đến kỳ đã định
  rationale: מוֹעֵד chỉ thời điểm được ấn định. “Kỳ đã định” vừa trang trọng vừa rõ nghĩa trong lời hứa này.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: ta sẽ trở lại với con
  rationale: שׁוּב diễn tả việc trở lại; đại từ số ít giống đực chỉ Áp-ra-ham. “Ta/con” phù hợp ngữ cảnh lời phán của Đức Chúa Trời và tránh sự mơ hồ của đại từ “ngươi” trong tiếng Việt hiện đại.
- source_word: כָּעֵת חַיָּה
  choice: vào khoảng thời gian này năm sau
  rationale: Đây là một thành ngữ khó, theo ngữ cảnh chỉ cùng khoảng thời gian hoặc mùa vào năm kế tiếp. Bản dịch diễn ý giúp độc giả hiện đại hiểu rõ, còn nghĩa đen được giữ trong chú thích.
- source_word: וּלְשָׂרָה בֵן
  choice: và Sa-ra sẽ có một con trai
  rationale: Mệnh đề Hê-bơ-rơ không có động từ, nhưng ngữ cảnh lời hứa mang ý tương lai; cách diễn đạt này tự nhiên và không thêm ý ngoài văn bản.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” như một danh riêng, không thay bằng tước hiệu, phù hợp với chứng cứ nguồn và lớp tham khảo POB.
- issue: Sức nặng của câu hỏi tu từ
  choice: Có điều gì quá khó đối với Yahweh chăng?
  alternative: Có điều gì quá kỳ diệu đối với Yahweh chăng?; Có điều gì là không thể đối với Yahweh chăng?
  rationale: “Quá khó” giữ trọng tâm về quyền năng của Yahweh trong việc thực hiện lời hứa, đồng thời không thu hẹp פלא chỉ còn nghĩa “kỳ diệu” hay tăng mạnh thành một mệnh đề tuyệt đối “không thể”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “ta/con” trong lời Yahweh nói với Áp-ra-ham; giữ danh riêng “Yahweh”. Các dấu chú thích [a], [b] được đặt ngay sau phần văn bản liên quan.
