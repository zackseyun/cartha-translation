translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Dùng dạng tên quen thuộc “Áp-ra-ham” và “Sa-ra”. Chọn cách dịch minh nhiên cho uyển ngữ sinh lý thay vì giữ hình ảnh “đường lối của phụ nữ”, vì dịch sát hình thức ấy khó hiểu và thiếu tự nhiên trong tiếng Việt.
