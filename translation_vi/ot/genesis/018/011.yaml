  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: vi
  text: Áp-ra-ham và Sa-ra đều đã già, tuổi đã cao; Sa-ra không còn có kinh nguyệt nữa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְקֵנִים
  choice: đều đã già
  rationale: Diễn đạt tự nhiên tình trạng tuổi cao của cả Áp-ra-ham và Sa-ra; “đều” làm rõ tính số nhiều của câu mà không thêm ý mới.
- source_word: בָּאִים בַּיָּמִים
  choice: tuổi đã cao
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “đã đi vào trong những ngày”; “tuổi đã cao” truyền đạt đúng ý tuổi tác cao niên bằng tiếng Việt hiện đại, trang trọng và dễ hiểu.
- source_word: חָדַל לִהְיוֹת
  choice: không còn có ... nữa
  rationale: Chuyển tải ý “đã chấm dứt/không còn tồn tại” theo cấu trúc tự nhiên của tiếng Việt.
- source_word: אֹרַח כַּנָּשִׁים
  choice: kinh nguyệt như phụ nữ
  rationale: Cụm từ uyển ngữ Hê-bơ-rơ “đường lối của phụ nữ” chỉ hiện tượng kinh nguyệt. Bản dịch nêu rõ nghĩa để độc giả hiện đại hiểu ngay, đồng thời giữ yếu tố so sánh כַּ־ bằng “như”.
- source_word: לְשָׂרָה
  choice: Sa-ra không còn có
  rationale: Đưa Sa-ra lên làm chủ ngữ là cách diễn đạt tự nhiên trong tiếng Việt cho quan hệ được đánh dấu bằng לְ trong câu gốc.
