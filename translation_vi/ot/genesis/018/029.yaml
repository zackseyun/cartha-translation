base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: vi
  text: 'Ông lại thưa với Ngài: “Biết đâu tìm được bốn mươi người ở đó?” Ngài đáp: “Vì bốn mươi người ấy, Ta sẽ không làm điều đó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר אֵלָיו וַיֹּאמַר
  choice: Ông lại thưa với Ngài
  rationale: Thành ngữ יסף + עוד + động từ diễn tả sự tiếp tục hoặc lặp lại. Trong ngữ cảnh Áp-ra-ham kính cẩn ngỏ lời với Đức Chúa Trời, “lại thưa với Ngài” tự nhiên, trang trọng và tránh lặp nặng hai động từ nói.
- source_word: אוּלַי
  choice: Biết đâu
  rationale: Diễn đạt một khả năng mang tính thăm dò trong lời cầu thay; “biết đâu” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ tính dè dặt.
- source_word: יִמָּצְאוּן שָׁם אַרְבָּעִים
  choice: tìm được bốn mươi người ở đó
  rationale: Dạng Niphal của מצא có nghĩa thụ động “được tìm thấy”. Tiếng Việt thường diễn đạt tự nhiên bằng kết cấu vô nhân xưng “tìm được”; “người” được bổ sung tối thiểu theo ngữ cảnh để số đếm đứng tự nhiên.
- source_word: לֹא אֶעֱשֶׂה
  choice: Ta sẽ không làm điều đó
  rationale: Động từ עשׂה không nêu rõ bổ ngữ, mà quy chiếu về hành động đã nói trong cuộc đối thoại. “Điều đó” giữ sự hàm ẩn thay vì xác định cụ thể là hủy diệt.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: Vì bốn mươi người ấy
  rationale: בַּעֲבוּר nêu lý do hoặc sự nể vì ai đó. Cách nói này chuyển tải đúng ý “vì cớ” trong tiếng Việt tự nhiên; mạo từ được thể hiện bằng “ấy” để chỉ nhóm người đang được giả định.
theological_decisions:
- issue: Bổ ngữ hàm ẩn của hành động Đức Chúa Trời trong לֹא אֶעֱשֶׂה
  choice: Ta sẽ không làm điều đó
  alternative: Ta sẽ không hủy diệt thành ấy
  rationale: Nguyên văn chỉ nói “Ta sẽ không làm”, để hành động được hiểu từ ngữ cảnh. Bản dịch giữ độ hàm ẩn này, không xác định thêm đối tượng hoặc nội dung của hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” chỉ Áp-ra-ham; “Ngài/Ta” thể hiện người đối thoại là Đức Chúa Trời và giữ sắc thái kính trọng. Không cần chú thích vì bản dịch chính vừa tự nhiên vừa bảo toàn sự hàm ẩn của nguyên văn.
