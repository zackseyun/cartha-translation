- from: 'Ông nói: “Thưa chúa tôi,[a] xin đừng nổi giận. Tôi chỉ xin nói thêm lần này nữa: biết đâu tại đó tìm được mười người.” Ngài đáp: “Vì mười người ấy, Ta sẽ không hủy diệt thành.”[b]


