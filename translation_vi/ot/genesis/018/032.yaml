  - severity: low
    issue: Diễn đạt giả định “tìm được mười người”
    rationale: Câu hiện tại có thể hiểu được, nhưng “Biết đâu ở đó có mười người” tự nhiên hơn tiếng Việt hiện đại mà vẫn giữ tính khả năng của אוּלַי và kết quả của Niphal “được tìm thấy” trong ngữ cảnh.
