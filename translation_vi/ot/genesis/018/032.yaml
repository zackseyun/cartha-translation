base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: vi
  text: 'Ông nói: “Lạy Chúa, xin đừng nổi giận, để tôi chỉ nói thêm lần này nữa: biết đâu ở đó có mười người.” Ngài đáp: “Vì mười người ấy, Ta sẽ không hủy diệt thành ấy.”[a]


    [a] Nguyên văn Hê-bơ-rơ không nêu đối tượng của động từ “hủy diệt”; “thành ấy” được thêm vào theo văn cảnh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ không nêu đối tượng của động từ “hủy diệt”; “thành ấy” được thêm vào theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: xin đừng nổi giận
  rationale: Diễn đạt tự nhiên lời khẩn cầu lịch sự; נָא được thể hiện bằng “xin”, còn thành ngữ với חרה chỉ cơn giận bùng lên.
- source_word: לַאדֹנָי
  choice: thưa chúa tôi
  rationale: Giữ cách xưng hô trực tiếp, khiêm nhường và tôn kính của Áp-ra-ham mà không đồng nhất từ này với danh riêng YHWH; chú thích bảo lưu khả năng hiểu theo tước hiệu thần thượng.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: Tôi chỉ xin nói thêm lần này nữa
  rationale: Thể hiện sắc thái thỉnh cầu của dạng cohortative và ý giới hạn đây là lời khẩn nài cuối cùng.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: biết đâu tại đó tìm được mười người
  rationale: “Biết đâu” giữ sắc thái khả năng của אוּלַי; “tìm được” chuyển tự nhiên thể bị động của מצא trong tiếng Việt, với “mười người” được hiểu từ văn cảnh.
- source_word: לֹא אַשְׁחִית
  choice: Ta sẽ không hủy diệt thành
  rationale: שׁחת ở thể Hiphil có nghĩa “hủy diệt”. “Thành” là bổ ngữ được thêm cho rõ theo văn cảnh và được ghi chú vì nguyên văn để ngầm.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: Vì mười người ấy
  rationale: Diễn đạt lý do Đức Chúa Trời tha thành vì mười người vừa được nhắc đến; “ấy” thể hiện tính xác định của mạo từ.
theological_decisions:
- issue: Đối tượng được gọi bằng אֲדֹנָי và cách viết hoa
  choice: “chúa tôi” trong lời xưng hô, kèm chú thích “Lạy Chúa”
  alternative: “Lạy Chúa” hoặc “thưa ngài”
  rationale: Ngữ cảnh rộng cho thấy Áp-ra-ham đang thưa với Đấng thần thượng, nhưng chính từ này không phải danh YHWH. Cách dịch chính giữ hình thức xưng hô tôn kính và chú thích bảo lưu sức căng diễn giải.
- issue: Chủ thể của lời đáp thứ hai
  choice: “Ngài đáp” và đại từ tự xưng “Ta”
  alternative: “Người đáp” hoặc lặp lại “ông đáp”
  rationale: Ngữ cảnh phân biệt Đấng đáp lời với Áp-ra-ham. “Ngài” và “Ta” là lối diễn đạt trang trọng, dễ hiểu, phù hợp nhân vật thần thượng mà không thêm một danh xưng không có trong câu.
- issue: Đối tượng ngầm của “hủy diệt”
  choice: thêm “thành” trong chính văn và giải thích bằng chú thích
  alternative: 'để trống đối tượng: “Ta sẽ không hủy diệt”'
  rationale: Tiếng Hê-bơ-rơ để đối tượng ngầm theo văn cảnh. Tiếng Việt cần bổ ngữ để câu tự nhiên và rõ, nhưng chú thích công khai phần được bổ sung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Thưa chúa tôi” cố ý giữ sắc thái khiêm nhường của lời cầu xin; “biết đâu” tự nhiên hơn “có lẽ” trong câu giả định trực tiếp. Dùng dấu hai chấm trước lời giả định để lời thoại trôi chảy.
