base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: vi
  text: Ngài tuyệt đối không làm một việc như thế—giết người công chính cùng với kẻ gian ác, để người công chính cũng bị đối xử như kẻ gian ác. Ngài tuyệt đối không làm như thế! Đấng Phán Xét toàn thế gian há chẳng thực thi công lý sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה
  choice: Ngài tuyệt đối không thể làm như thế
  rationale: Thành ngữ bày tỏ sự ghê sợ và bác bỏ mạnh mẽ; cách dịch này tự nhiên trong tiếng Việt, không hàm ý nói về giới hạn năng lực của Đức Chúa Trời mà nhấn mạnh việc ấy hoàn toàn trái với bản tính công chính của Ngài.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: làm một việc như thế
  rationale: Diễn đạt tự nhiên cấu trúc giới từ đi với động từ nguyên mẫu sau lời bác bỏ mạnh mẽ.
- source_word: לְהָמִית
  choice: giết
  rationale: Thể Hiphil của מות mang nghĩa khiến phải chết; trong ngữ cảnh này, “giết” là cách nói trực tiếp, rõ ràng và tự nhiên trong tiếng Việt.
- source_word: צַדִּיק
  choice: người công chính
  rationale: Giữ cả sắc thái đạo đức lẫn pháp lý, đồng thời tạo thế đối lập rõ với “kẻ gian ác”.
- source_word: עִם רָשָׁע
  choice: cùng với kẻ gian ác
  rationale: Giữ hình thức khái quát số ít của tiếng Hê-bơ-rơ và nêu rõ việc người công chính chịu chung số phận với kẻ ác.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: khiến người công chính cũng như kẻ gian ác
  rationale: Thể hiện kết quả không thể chấp nhận được của hành động, đồng thời bảo toàn phép so sánh bằng כ.
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: Đấng Phán Xét toàn thế gian
  rationale: Phân từ được dùng như danh xưng của Đức Chúa Trời; “toàn thế gian” truyền đạt phạm vi phổ quát tự nhiên hơn cách hiểu cục bộ là “toàn xứ” trong ngữ cảnh.
- source_word: מִשְׁפָּט
  choice: công lý
  rationale: Trong câu hỏi tu từ, từ này nhấn mạnh hành động phù hợp với lẽ công chính, chứ không chỉ một phán quyết tư pháp.
theological_decisions:
- issue: Lời chất vấn tu từ của Áp-ra-ham đối với bản tính của Đức Chúa Trời
  choice: Đấng Phán Xét toàn thế gian há chẳng thực thi công lý sao?
  alternative: Đấng Phán Xét toàn thế gian chẳng lẽ không làm điều công chính sao?
  rationale: Cấu trúc câu hỏi mong đợi câu trả lời khẳng định và giữ nguyên sự mạnh dạn trong lời Áp-ra-ham kêu cầu đến bản tính công chính của Đức Chúa Trời. “Thực thi công lý” bảo toàn sắc thái vừa đạo đức vừa tư pháp của מִשְׁפָּט.
- issue: Ý nghĩa của lời חָלִילָה khi nói với Đức Chúa Trời
  choice: Ngài tuyệt đối không thể làm như thế
  alternative: Xin Ngài đừng bao giờ làm như thế
  rationale: Bản dịch chính giữ sức bác bỏ quyết liệt của nguyên văn và lời kêu cầu dựa trên bản tính Đức Chúa Trời; không chuyển câu này thành một lời cầu xin nhẹ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại lời bác bỏ như nguyên văn để duy trì cường độ tu từ; dùng “há chẳng... sao?” cho câu hỏi tu từ trang trọng nhưng vẫn quen thuộc trong tiếng Việt.
