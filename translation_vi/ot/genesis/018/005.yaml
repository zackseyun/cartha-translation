  text: וְ/אֶקְחָ֨ה פַת לֶ֜חֶם וְ/סַעֲד֤וּ לִבְּ/כֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי עַל כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל עַבְדְּ/כֶ֑ם וַ/יֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: vi
  text: 'Xin cho tôi đem một ít bánh mì, để quý vị lại sức[a]; sau đó quý vị hãy đi tiếp, vì chính lý do đó mà quý vị đã ghé qua chỗ người đầy tớ của quý vị đây.” Họ đáp: “Được, ông cứ làm như lời ông đã nói.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “nâng đỡ (hoặc làm vững) lòng quý vị”; đây là thành ngữ nói về việc ăn để hồi phục sức lực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: Xin để tôi lấy
  rationale: Dạng cohortative diễn tả lời đề nghị nhã nhặn của Áp-ra-ham; “xin để tôi” giữ sắc thái tự nguyện và hiếu khách.
- source_word: פַת לֶחֶם
  choice: một ít bánh mì
  rationale: Cụm từ chỉ một phần bánh nhỏ và là cách nói khiêm nhường trong lời mời khách; cách dịch này tự nhiên trong tiếng Việt hiện đại.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: để quý vị lại sức
  rationale: Thành ngữ Hê-bơ-rơ nói đến việc nâng đỡ hay làm vững lòng bằng thức ăn; “lại sức” truyền đạt đúng ý trong ngữ cảnh mà vẫn ghi nhận hình ảnh nguyên văn ở chú thích.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: sau đó quý vị hãy đi tiếp
  rationale: Động từ עבר ở đây nói đến việc tiếp tục hành trình; “hãy đi tiếp” tự nhiên và phù hợp ngữ cảnh.
- source_word: כִּי עַל כֵּן
  choice: vì chính bởi vậy mà
  rationale: Giữ lực giải thích và nhấn mạnh của tổ hợp Hê-bơ-rơ mà không làm câu quá cứng.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: quý vị đã đi ngang qua chỗ đầy tớ quý vị đây
  rationale: “Đi ngang qua” phản ánh trực tiếp עבר, còn “đầy tớ quý vị đây” bảo tồn lối tự xưng khiêm nhường của Áp-ra-ham, không hàm ý địa vị nô lệ theo nghĩa pháp lý.
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: Được, ông cứ làm như lời ông đã nói
  rationale: Diễn đạt lời chấp thuận ngắn gọn, dứt khoát của các vị khách bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Ý nghĩa của כִּי עַל כֵּן trong lời Áp-ra-ham
  choice: “vì chính bởi vậy mà quý vị đã đi ngang qua”
  alternative: “vì quý vị đã tình cờ đi ngang qua”
  rationale: Bản dịch giữ nguyên cách Áp-ra-ham nêu sự hiện diện của các vị khách làm lý do cho lòng hiếu khách, nhưng không thêm ý về sự tình cờ hay sự quan phòng vốn không được nói rõ trong câu.
translation_notes:
  register: Văn phong trang trọng, hiếu khách và dễ hiểu trong tiếng Việt hiện đại. Dùng “quý vị” cho số nhiều và “đầy tớ quý vị đây” để thể hiện lối tự hạ trong lời nói của Áp-ra-ham. Dấu ngoặc kép mở thuộc phần đầu câu nằm ở câu 4 trong ngữ cảnh liên tục; bản câu đơn giữ dấu đóng theo mạch lời thoại.
