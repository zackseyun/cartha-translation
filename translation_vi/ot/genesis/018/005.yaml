- from: 'Xin để tôi lấy một ít bánh mì, để quý vị lại sức[a]; sau đó quý vị hãy đi tiếp, vì chính bởi vậy mà quý vị đã đi ngang qua chỗ đầy tớ quý vị đây.” Họ đáp: “Được, ông cứ làm như lời ông đã nói.”'
  to: 'Xin cho tôi đem một ít bánh mì, để quý vị lại sức[a]; sau đó quý vị hãy đi tiếp, vì chính lý do đó mà quý vị đã ghé qua chỗ người đầy tớ của quý vị đây.” Họ đáp: “Được, ông cứ làm như lời ông đã nói.”'
  rationale: Bản sửa làm tự nhiên hơn lời mời hiếu khách và cách tự xưng hạ mình, đồng thời tránh phần thêm vào và cấu trúc gượng trong bản nháp. Chú thích về thành ngữ Hê-bơ-rơ được giữ nguyên; không cần chú thích thêm cho “một ít bánh mì,” vì cách dịch này đã chuyển đạt lời nói khiêm nhường trong ngữ cảnh.
