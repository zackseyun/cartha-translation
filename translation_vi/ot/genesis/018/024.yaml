source:
  edition: WLC
  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: vi
  text: Giả sử trong thành có năm mươi người công chính[a], lẽ nào Ngài thật sự quét sạch thành ấy mà không tha cho nơi đó vì năm mươi người công chính trong đó sao?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Biết đâu trong thành có năm mươi người công chính.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Lẽ nào Ngài thật sự quét sạch thành ấy mà không tha thứ cho nơi đó vì năm mươi người công chính trong đó sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Giả sử
  rationale: Mở đầu lời khẩn cầu mang tính giả định của Áp-ra-ham; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ sắc thái chưa chắc chắn.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: năm mươi người công chính
  rationale: צַדִּיקִם chỉ những người ngay chính, không nhất thiết chỉ nam giới; “người công chính” vừa chính xác vừa quen thuộc.
- source_word: בְּתוֹךְ הָעִיר
  choice: trong thành
  rationale: Diễn đạt tự nhiên vị trí bên trong phạm vi thành, không làm nặng câu bằng cách dịch máy móc là “ở giữa thành” trong lần xuất hiện đầu.
- source_word: הַאַף תִּסְפֶּה
  choice: lẽ nào Ngài thật sự quét sạch thành ấy
  rationale: “Lẽ nào… thật sự” giữ sức nhấn mạnh của câu hỏi tu từ; “quét sạch” truyền tải hình ảnh phán xét của ספָה. Tân ngữ “thành ấy” được bổ sung theo ngữ cảnh tiếng Việt từ “nơi đó/thành” trong câu.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: mà không tha cho nơi đó
  rationale: Trong ngữ cảnh đối lập với việc hủy diệt, נשא mang nghĩa không giáng sự hủy diệt, tức tha cho nơi ấy; không thu hẹp thành một giáo lý riêng về sự tha tội.
- source_word: לְמַעַן
  choice: vì
  rationale: Diễn tả căn cứ khiến thành được tha, tức vì sự hiện diện của những người công chính; ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: ở giữa thành
  rationale: Giữ rõ mệnh đề quan hệ và sắc thái chỉ vị trí của בְּקִרְבָּהּ, đồng thời tránh đại từ “nó” thiếu trang trọng hoặc mơ hồ.
theological_decisions:
- issue: Nghĩa của נשא trong cụm וְלֹא תִשָּׂא לַמָּקוֹם
  choice: tha cho nơi đó
  alternative: tha thứ cho nơi đó; dung thứ nơi đó
  rationale: Mạch văn đối chiếu việc quét sạch thành với việc không hủy diệt nó vì những người công chính. “Tha cho” giữ được ý pháp lý và tường thuật mà không buộc từ này chỉ mang nghĩa tha thứ tội lỗi.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” vì Áp-ra-ham đang trực tiếp thưa với Đức Chúa Trời; câu hỏi tu từ được giữ nguyên. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
