  source_fidelity: Bản dịch truyền đạt đúng trình tự tường thuật của hai động từ wayyiqtol, chủ ngữ số nhiều ở lời hỏi, đối tượng là Áp-ra-ham, câu hỏi định vị về Sa-ra là vợ ông, và lời đáp định vị bà trong lều. “Kìa” giữ được sắc thái chỉ xuất/nhấn mạnh của הִנֵּה; việc thêm “bà ấy ở” là phần hàm ẩn cần thiết để câu tiếng Việt tự nhiên, không làm thay đổi nghĩa.
