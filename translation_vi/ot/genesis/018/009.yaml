  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: vi
  text: 'Rồi họ hỏi ông: “Sa-ra, vợ ông, ở đâu?” Ông đáp: “Kìa, bà ấy ở trong lều.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Rồi họ hỏi
  rationale: Động từ אמר ở dạng wayyiqtol tiếp nối diễn tiến câu chuyện; vì lời nói trực tiếp là một câu hỏi, “hỏi” tự nhiên và chính xác theo ngữ cảnh hơn “nói” trong tiếng Việt.
- source_word: אֵלָיו
  choice: ông
  rationale: Giới từ אֶל với hậu tố ngôi ba số ít giống đực chỉ người được nói với là Áp-ra-ham; trong cấu trúc “hỏi ông”, tiếng Việt không cần thêm “với” hay “cùng”.
- source_word: אַיֵּה
  choice: ở đâu
  rationale: Trạng từ nghi vấn về vị trí được diễn đạt tự nhiên trong tiếng Việt là “ở đâu”.
- source_word: שָׂרָה
  choice: Sa-ra
  rationale: Phiên âm tên riêng theo cách viết quen thuộc, rõ âm tiết trong tiếng Việt.
- source_word: אִשְׁתֶּךָ
  choice: vợ ông
  rationale: Danh từ אִשָּׁה ở dạng liên kết với hậu tố ngôi hai số ít giống đực có nghĩa trực tiếp là “vợ của ông”; “vợ ông” là cách nói tự nhiên.
- source_word: וַיֹּאמֶר
  choice: Ông đáp
  rationale: Wayyiqtol của אמר mở đầu lời trả lời của Áp-ra-ham; “đáp” thể hiện đúng chức năng đối thoại mà vẫn giữ văn phong gọn.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Tiểu từ chỉ xuất הִנֵּה hướng sự chú ý đến nơi được hỏi. “Kìa” bảo tồn sắc thái chỉ trỏ/nhấn mạnh tốt hơn việc lược bỏ hoàn toàn.
- source_word: בָאֹהֶל
  choice: bà ấy ở trong lều
  rationale: בְּ với danh từ xác định אֹהֶל mang nghĩa “trong lều”. Tiếng Việt tự nhiên cần bổ sung chủ ngữ và vị từ được hàm ý trong câu trả lời ngắn của tiếng Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “họ” để giữ chủ ngữ số nhiều của bản Hê-bơ-rơ; dùng “ông/bà ấy” phù hợp ngữ cảnh mà không thêm cách giải thích thần học. Câu đáp giữ sắc thái chỉ xuất của הִנֵּה nhưng bổ sung thành phần hàm ẩn để tiếng Việt được tự nhiên.
