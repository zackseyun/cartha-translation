  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: vi
  text: 'Ông nói: “Xin Chúa[a] đừng nổi giận, cho tôi được nói tiếp. Biết đâu tại đó có ba mươi người.” Ngài đáp: “Nếu Ta tìm thấy tại đó ba mươi người, Ta sẽ không làm điều ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúa tôi” hoặc “thưa ngài.” Danh xưng Hê-bơ-rơ có thể là cách thưa gửi kính trọng; ở đây viết “Chúa” vì theo ngữ cảnh, người được thưa là Đức Chúa Trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: Xin ... đừng nổi giận
  rationale: Diễn đạt tự nhiên trong tiếng Việt cả lời cầu xin của נָא, ý phủ định của אַל và thành ngữ chỉ cơn giận của חרה.
- source_word: לַאדֹנָי
  choice: Chúa
  rationale: Danh xưng אֲדֹנָי kèm hậu tố ngôi thứ nhất số ít theo nghĩa sát là “chúa/chủ của tôi”; trong ngữ cảnh Áp-ra-ham thưa với Đấng thần linh, “Chúa” là cách xưng hô tôn kính và tự nhiên.
- source_word: וַאֲדַבֵּרָה
  choice: cho tôi được nói tiếp
  rationale: Dạng cohortative bộc lộ lời xin phép đầy kính cẩn để tiếp tục nói; “nói tiếp” làm rõ ý theo diễn tiến hội thoại mà không thay đổi nội dung.
- source_word: אוּלַי
  choice: Biết đâu
  rationale: Giữ sắc thái phỏng đoán dè dặt của אוּלַי và phù hợp lời cầu thay trong tiếng Việt hiện đại.
- source_word: יִמָּצְאוּן
  choice: có
  rationale: Trong tiếng Việt, “tại đó có ba mươi người” tự nhiên hơn cấu trúc bị động “ba mươi người được tìm thấy”, trong khi vẫn truyền đạt khả năng họ hiện diện và được phát hiện ở đó.
- source_word: לֹא אֶעֱשֶׂה
  choice: Ta sẽ không làm điều ấy
  rationale: Bổ sung tân ngữ “điều ấy” theo ngữ cảnh, tức hành động hủy diệt đang được bàn đến, nhưng không giải nghĩa quá mức.
- source_word: אִם אֶמְצָא
  choice: Nếu Ta tìm thấy
  rationale: Phản ánh trực tiếp cấu trúc điều kiện và động từ ngôi thứ nhất của nguyên văn.
theological_decisions:
- issue: Cách dịch אֲדֹנָי trong lời Áp-ra-ham thưa
  choice: Chúa
  alternative: chúa tôi / thưa ngài
  rationale: Ngữ cảnh cho thấy người được thưa là Đấng thần linh, nên viết hoa “Chúa”; tuy nhiên, từ Hê-bơ-rơ tự thân cũng có thể là danh xưng kính trọng dành cho bậc chủ hoặc người có địa vị. Không thay bằng danh riêng giao ước vì nguyên văn không dùng danh ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi” trong lời Áp-ra-ham để biểu thị sự khiêm nhường và “Ta” trong lời đáp của Chúa. Đại từ “Ông” nối tự nhiên với văn cảnh trước; “Ngài” xác định người đáp mà không lặp danh xưng.
