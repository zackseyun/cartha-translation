base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: vi
  text: 'Ông nói[a]: “Thưa ngài, nếu tôi được ngài ưu ái, xin ngài đừng đi qua chỗ tôi tớ ngài đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Lạy Chúa,” nếu hiểu Áp-ra-ham đang thưa riêng với Đức Chúa Trời, thay vì kính cẩn thưa với một vị khách.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Người nói
  rationale: Lối kể wayyiqtol tiếp nối mạch truyện và giới thiệu lời của Áp-ra-ham; tiếng Việt không cần giữ liên từ ‘và’ một cách máy móc.
- source_word: אֲדֹנָי
  choice: Thưa ngài
  rationale: Diễn đạt lời xưng hô kính trọng với một người nam ở địa vị cao hơn, đồng thời không buộc người đọc phải quyết định ngay đây là danh xưng dành cho Đức Chúa Trời hay lời thưa với vị khách.
- source_word: אִם נָא
  choice: nếu
  rationale: Mở đầu công thức thỉnh cầu lịch sự; sắc thái khẩn khoản của נָא được thể hiện tự nhiên bằng ‘xin’ ở mệnh đề chính, tránh lặp vụng về.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: tôi được đẹp lòng ngài
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ việc nhận được thiện cảm. Cách nói này tự nhiên, trang trọng trong tiếng Việt và không đưa thêm hàm ý thần học của từ ‘ân điển’.
- source_word: אַל נָא
  choice: xin ngài đừng
  rationale: Kết hợp lời cấm với tiểu từ khẩn khoản thành một lời thỉnh cầu nhã nhặn, tha thiết trong tiếng Việt.
- source_word: תַעֲבֹר מֵעַל
  choice: đi ngang qua
  rationale: Diễn tả việc tiếp tục đi và bỏ qua người đang thưa chuyện; giữ hình ảnh chuyển động của nguyên văn.
- source_word: עַבְדֶּךָ
  choice: tôi tớ ngài
  rationale: Trong ngữ cảnh tự xưng khiêm nhường trước người được tôn kính, ‘tôi tớ’ phù hợp hơn ‘nô lệ’ và giữ được sắc thái trang trọng.
theological_decisions:
- issue: אֲדֹנָי là danh xưng thần linh hay lời xưng hô kính trọng
  choice: Thưa ngài
  alternative: Lạy Chúa
  rationale: Toàn cảnh cho biết Đức Giê-hô-va hiện ra với Áp-ra-ham, nhưng lời nói trực tiếp ở câu này hướng đến một đối tượng số ít giữa các vị khách. Cách chấm nguyên âm Hê-bơ-rơ và truyền thống giải thích có thể ủng hộ việc thưa với Đức Chúa Trời, song diễn ngôn vẫn có độ mơ hồ đáng kể. Bản chính dùng lời xưng hô kính trọng, còn cách hiểu là danh xưng thần linh được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Thưa ngài’ cùng ‘tôi tớ ngài’ duy trì thái độ kính cẩn; chú thích bảo tồn sự mơ hồ thần học trong nguyên văn.
