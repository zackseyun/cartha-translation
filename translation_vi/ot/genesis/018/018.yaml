revisions:
- from: Áp-ra-ham chắc chắn sẽ trở thành một dân tộc lớn và hùng mạnh, và mọi dân tộc trên đất sẽ được ban phước trong ông.[a]
  to: Áp-ra-ham chắc chắn sẽ trở thành một dân tộc lớn và hùng mạnh, và mọi dân tộc trên đất sẽ được ban phước lành trong ông.[a]
  rationale: Chỉ điều chỉnh cách kết hợp từ ngữ tiếng Việt và cách diễn đạt chú thích. Bản sửa vẫn giữ thì tương lai cùng sắc thái nhấn mạnh, “dân tộc” cho גּוֹי, tính chất “lớn và hùng mạnh,” cách đọc bị động ở câu chính, và độ mở của בּוֹ là “trong ông.” Chú thích tiếp tục bảo tồn cách đọc phản thân đang được tranh luận, không giải quyết tranh luận ấy theo hướng giáo phái hay diễn giải riêng.
