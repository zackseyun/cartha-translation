source:
  edition: WLC
  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: vi
  text: Áp-ra-ham chắc chắn sẽ trở thành một dân tộc lớn và hùng mạnh, và mọi dân tộc trên đất sẽ được ban phước lành trong ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “mọi dân tộc trên đất sẽ lấy ông làm lời chúc phước cho mình.” Dạng động từ Hê-bơ-rơ có thể được hiểu theo nghĩa này, dù bản chính hiểu theo nghĩa thụ động: “sẽ được ban phước lành trong ông.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: chắc chắn sẽ trở thành
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ chưa hoàn thành nhấn mạnh mạnh mẽ điều sẽ xảy ra; cách dịch này thể hiện cả ý tương lai lẫn sự chắc chắn, đồng thời phù hợp với bổ ngữ לְגוֹי.
- source_word: לְגוֹי
  choice: một dân tộc
  rationale: גוי chỉ một cộng đồng dân tộc hay quốc gia. “Dân tộc” tự nhiên trong tiếng Việt và giữ được sự liên hệ từ vựng với “mọi dân tộc” ở cuối câu.
- source_word: גָּדוֹל
  choice: lớn
  rationale: “Lớn” giữ được cả sắc thái về quy mô lẫn tầm vóc trong lời hứa dành cho Áp-ra-ham.
- source_word: וְעָצוּם
  choice: và hùng mạnh
  rationale: עצום có thể nói đến sức mạnh, quyền thế hoặc sự đông đảo. “Hùng mạnh” kết hợp tự nhiên với “lớn” và không thu hẹp nghĩa chỉ còn số lượng.
- source_word: וְנִבְרְכוּ
  choice: sẽ được ban phước
  rationale: 'Dạng Niphal của ברך được hiểu trong câu chính theo nghĩa thụ động: các dân tộc nhận phước. Cách dịch “được ban phước” tự nhiên, rõ chủ ý thụ động và giữ sắc thái trang trọng.'
- source_word: בּוֹ
  choice: trong ông
  rationale: Giữ sát giới từ ב, diễn tả phước lành ở trong hoặc gắn với Áp-ra-ham. “Nhờ ông” hay “qua ông” tự nhiên hơn nhưng có thể diễn giải quan hệ phương tiện rõ hơn mức văn bản Hê-bơ-rơ đòi hỏi.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: mọi dân tộc trên đất
  rationale: Đây là công thức có phạm vi phổ quát. “Mọi dân tộc” duy trì sự nhất quán với גוי trước đó; “trên đất” diễn đạt tự nhiên toàn thể các dân trên thế gian.
theological_decisions:
- issue: Cách hiểu công thức phước lành dành cho các dân tộc
  choice: 'Các dân tộc là những người nhận phước trong mối liên hệ với Áp-ra-ham: “sẽ được ban phước trong ông.”'
  alternative: Các dân tộc sẽ lấy Áp-ra-ham làm mẫu hoặc phương thức để tự chúc phước cho mình.
  rationale: Dạng Niphal của ברך có thể được hiểu là thụ động hoặc phản thân. Bản chính chọn nghĩa thụ động vì phù hợp với mạch lời hứa rộng hơn, nhưng không loại bỏ nghĩa phản thân; nghĩa ấy được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng dùng dạng phiên âm quen thuộc “Áp-ra-ham”. Cụm “trong ông” hơi khác khẩu ngữ nhưng được giữ để bảo toàn độ mở của giới từ Hê-bơ-rơ; chú thích nêu cách hiểu phản thân của động từ mà không áp đặt một kết luận thần học duy nhất.
