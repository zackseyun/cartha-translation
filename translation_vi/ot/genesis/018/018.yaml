    rationale: “Ban phước lành” là cụm từ tự nhiên và rõ ràng hơn; việc thêm “lành” không gia tăng hay thu hẹp nội dung của ברך.
  - severity: low
    issue: Chú thích “lấy ông mà chúc phước cho mình” hơi gượng và chưa diễn tả sáng rõ khả năng phản thân của dạng Niphal.
