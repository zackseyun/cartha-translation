id: GEN.18.19
reference: Genesis 18:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: vi
  text: Vì Ta đã biết người[a], để người truyền lệnh cho các con trai và gia quyến của người về sau, hầu họ gìn giữ đường lối của Yahweh bằng cách thực thi điều công chính và công lý[b], để Yahweh thực hiện cho Áp-ra-ham điều Ngài đã phán về Áp-ra-ham.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đã chọn người.” Động từ Hê-bơ-rơ thường có nghĩa là “biết”, nhưng trong ngữ cảnh này có thể hàm ý sự nhìn nhận đặc biệt hoặc lựa chọn.'
    reason: alternative_reading
  - marker: b
    text: “Đường lối của Yahweh” là nếp sống mà Yahweh đòi hỏi, được biểu hiện qua việc thực thi điều công chính và công lý.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể hiểu: “điều Ngài đã hứa với Áp-ra-ham.” Nguyên văn sát hơn là “điều Ngài đã phán về Áp-ra-ham”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên nhân của mệnh đề trước.
- source_word: יְדַעְתִּיו
  choice: Ta đã biết người
  rationale: Dịch sát nghĩa cơ bản của ידע và giữ lại sắc thái quan hệ, không mặc nhiên giải quyết theo nghĩa tuyển chọn.
- source_word: לְמַעַן אֲשֶׁר
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích hoặc kết quả trong tiếng Việt.
- source_word: יְצַוֶּה
  choice: truyền lệnh
  rationale: 'Giữ lực nghĩa mạnh của dạng piel צוה: ra lệnh, truyền dạy với thẩm quyền.'
- source_word: בָּנָיו
  choice: các con trai
  rationale: Phản ánh danh từ giống đực số nhiều trong nguyên văn; cụm kế tiếp mở rộng phạm vi đến cả gia quyến.
- source_word: בֵּיתוֹ
  choice: gia quyến mình
  rationale: Chỉ cộng đồng gia đình và những người thuộc nhà Áp-ra-ham, không phải tòa nhà vật chất.
- source_word: אַחֲרָיו
  choice: sau này
  rationale: Trong ngữ cảnh chỉ thời kỳ sau Áp-ra-ham; cách nói này tự nhiên hơn 'sau người' trong tiếng Việt.
- source_word: וְשָׁמְרוּ
  choice: hầu họ gìn giữ
  rationale: שׁמר với 'đường lối' mang nghĩa trung thành tuân giữ; 'hầu' tiếp tục sắc thái mục đích.
- source_word: דֶּרֶךְ יְהוָה
  choice: đường lối của Yahweh
  rationale: Giữ hình ảnh ẩn dụ về nếp sống Yahweh đòi hỏi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước thay vì thay thế bằng một tước hiệu.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: bằng cách thực thi điều công chính và công lý
  rationale: Làm rõ sắc thái phương tiện của động từ nguyên mẫu và giữ hai khái niệm đạo đức-pháp lý phân biệt.
- source_word: הָבִיא ... עַל אַבְרָהָם
  choice: làm thành cho Áp-ra-ham
  rationale: Trong ngữ cảnh lời hứa, diễn đạt tự nhiên hành động đưa điều đã phán đến chỗ ứng nghiệm cho Áp-ra-ham.
- source_word: אֲשֶׁר דִּבֶּר עָלָיו
  choice: điều Ngài đã phán về người
  rationale: Giữ cách nói tương đối sát nguyên văn và không tự động đổi 'đã phán' thành 'đã hứa'.
theological_decisions:
- issue: ידע mang nghĩa nhận biết theo quan hệ hay tuyển chọn
  choice: Ta đã biết người
  alternative: Ta đã chọn người
  rationale: Nghĩa tuyển chọn phù hợp ngữ cảnh nhưng là hàm ý; bản chính giữ nghĩa từ vựng trực tiếp và ghi phương án kia ở chú thích.
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng danh riêng bốn phụ âm; phiên âm bảo tồn tính chất danh riêng.
- issue: Quan hệ giữa mệnh lệnh, sự vâng giữ và điều Yahweh đã phán
  choice: Giữ hai mệnh đề mục đích bằng 'để/hầu... để...'
  alternative: Diễn giải thành quan hệ điều kiện rõ rệt
  rationale: Cấu trúc לְמַעַן xuất hiện hai lần và có thể mang sắc thái mục đích/kết quả; không nên biến ngầm thành một công thức điều kiện thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ta/Ngài/người” để thể hiện lời Đức Chúa Trời nói về Áp-ra-ham mà không gây lẫn đại từ; giữ danh Yahweh và cấu trúc mục đích lặp lại của câu Hê-bơ-rơ.
