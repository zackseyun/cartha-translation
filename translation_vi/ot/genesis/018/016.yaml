  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: vi
  text: Rồi những người ấy đứng dậy từ chỗ ấy và nhìn xuống về phía Sô-đôm[a]. Áp-ra-ham đi cùng họ để tiễn họ lên đường[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhìn ra bao quát Sô-đôm.” Động từ Hê-bơ-rơ gợi ý việc nhìn từ một vị trí cao.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để đưa tiễn họ.” Cụm từ Hê-bơ-rơ chỉ việc đi cùng những vị khách sắp rời đi và tiễn họ tiếp tục lên đường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִשָּׁם
  choice: đứng dậy rời khỏi đó
  rationale: Diễn đạt tự nhiên hành động đứng dậy và chuyển đi khỏi nơi đang ở, đồng thời không thu hẹp động từ קום chỉ còn nghĩa khởi hành.
- source_word: הָאֲנָשִׁים
  choice: những người ấy
  rationale: Giữ danh từ thông thường 'những người/những người đàn ông' của tiếng Hê-bơ-rơ và không xác định trước họ là thiên sứ; 'những người ấy' tự nhiên trong mạch kể tiếng Việt.
- source_word: וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם
  choice: nhìn xuống về phía Sô-đôm
  rationale: Động từ שׁקף thường chỉ việc nhìn ra hoặc nhìn xuống từ vị trí cao; 'về phía' chuyển tải hướng nhìn mà không hàm ý họ đã ở trong thành.
- source_word: הֹלֵךְ עִמָּם
  choice: đi cùng họ
  rationale: Phân từ הֹלֵךְ diễn tả hành động đang tiếp diễn và đồng hành; tiếng Việt không cần hình thái tiếp diễn riêng để biểu đạt tự nhiên sắc thái này.
- source_word: לְשַׁלְּחָם
  choice: để tiễn họ lên đường
  rationale: Trong ngữ cảnh tiếp khách, cụm này nói đến việc chủ nhà đi cùng khách lúc họ rời đi và tiễn họ tiếp tục hành trình.
theological_decisions:
- issue: Danh tính của הָאֲנָשִׁים trong ngữ cảnh
  choice: Dịch là 'những người ấy' trong chính văn
  alternative: các vị khách; các thiên sứ
  rationale: Câu Hê-bơ-rơ dùng danh từ thông thường chỉ người và chưa gọi họ là thiên sứ. Cách dịch này giữ nguyên sự căng mở của trình thuật, không đưa nhận định thần học từ ngữ cảnh sau vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Sô-đôm' và 'Áp-ra-ham' theo dạng tên quen thuộc trong tiếng Việt. Hai chú thích được đặt ngay sau những cụm từ tương ứng, theo thứ tự [a], [b].
