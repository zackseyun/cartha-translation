base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: vi
  text: 'Nhưng Sa-ra phủ nhận điều đó[a], nói: “Tôi không cười,” vì bà sợ. Nhưng người ấy nói: “Không, bà đã cười.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Sa-ra nói dối,” hoặc đơn giản là “Sa-ra phủ nhận.” Động từ Hê-bơ-rơ có thể mang nghĩa phủ nhận hoặc nói sai sự thật; ở đây nó chỉ việc Sa-ra phủ nhận rằng mình đã cười.'
    reason: lexical_alternative
  - marker: b
    text: Mệnh đề này không nêu rõ người nói; trong ngữ cảnh chung quanh, người nói được nhận biết là ĐỨC CHÚA.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: chối
  rationale: Động từ כחשׁ ở thể piel có thể chỉ sự phủ nhận hoặc nói sai sự thật. Trong ngữ cảnh này, Sa-ra phủ nhận việc mình đã cười; “chối” diễn đạt tự nhiên mà không đưa lời phán xét đạo đức mạnh hơn nguyên văn vào chính văn.
- source_word: לֵאמֹר
  choice: dấu hai chấm trước lời nói trực tiếp
  rationale: Phân từ nguyên thể dẫn lời được thể hiện tự nhiên trong tiếng Việt bằng dấu hai chấm, không cần dịch thành một từ riêng.
- source_word: לֹא צָחַקְתִּי
  choice: Tôi không cười
  rationale: Dịch trực tiếp động từ hoàn thành ngôi thứ nhất số ít có phủ định; cách nói ngắn gọn, tự nhiên và phù hợp văn kể chuyện.
- source_word: כִּי יָרֵאָה
  choice: vì bà sợ
  rationale: כִּי nêu nguyên nhân Sa-ra chối; “vì” giữ rõ quan hệ nhân quả.
- source_word: וַיֹּאמֶר
  choice: Nhưng người nói
  rationale: “Nhưng” làm rõ sự tương phản với lời chối của Sa-ra. Tiếng Việt không có đại từ giống đực trung tính tương ứng với “he”; “người” giữ chủ thể không nêu danh tính rõ trong mệnh đề này.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: Không, bà đã cười
  rationale: לֹא bác bỏ lời phủ nhận; כִּי giới thiệu lời khẳng định đối nghịch. Trật tự và ngữ điệu tiếng Việt đã thể hiện sự bác bỏ nên không cần thêm “nhưng” lần nữa.
theological_decisions:
- issue: Danh tính người nói trong וַיֹּאמֶר
  choice: 'Dịch không nêu danh tính: “người nói”'
  alternative: “ĐỨC CHÚA phán” hoặc “một trong những người ấy nói”
  rationale: Động từ số ít giống đực không nhắc lại chủ ngữ. Ngữ cảnh rộng hơn gắn người nói với ĐỨC CHÚA, nhưng chính mệnh đề này không lặp lại danh xưng; bản dịch giữ sự không tường minh ấy và giải thích trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” khi lời đáp trực tiếp hướng đến Sa-ra để phù hợp ngữ cảnh và phép xưng hô tự nhiên; dùng “người” nhằm không thêm danh tính mà nguyên văn mệnh đề không nêu.
