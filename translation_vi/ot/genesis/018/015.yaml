  source_fidelity: 'Bản nháp truyền đạt đúng trình tự và ý chính của tiếng Hê-bơ-rơ: Sa-ra phủ nhận việc mình cười vì sợ, rồi người nói bác bỏ lời phủ nhận ấy. Tuy nhiên, “Sa-ra chối” không tự nhiên bằng một cách diễn đạt có bổ ngữ rõ ràng; “người nói” cũng dễ bị hiểu là danh từ chỉ vai trò hơn là chủ ngữ của động từ אמר.'
  naturalness: 'Cần sửa nhẹ để tiếng Việt hiện đại tự nhiên và rõ hơn: “phủ nhận điều đó” diễn đạt trọn ý của כחשׁ trong ngữ cảnh; “người ấy nói” là cách kể chuyện tự nhiên hơn “người nói.”'
  terminology: Giữ “Sa-ra,” “ĐỨC CHÚA,” và cách xưng hô “Tôi/bà” nhất quán, trang trọng vừa phải. Không nêu đích danh người nói trong chính văn, phù hợp với việc mệnh đề Hê-bơ-rơ không lặp lại chủ ngữ.
