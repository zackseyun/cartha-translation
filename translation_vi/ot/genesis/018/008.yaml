base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: vi
  text: Rồi ông lấy sữa đông[a], sữa và con bê đã được chế biến, dọn ra trước mặt họ. Ông đứng bên họ[b] dưới cây, trong khi họ ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “kem sữa” hay “bơ”. Từ Hê-bơ-rơ chỉ một sản phẩm sữa đặc; nghĩa chính xác tùy ngữ cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “đứng trên họ”. Trong ngữ cảnh này, cụm từ có lẽ chỉ việc ông đứng gần để tiếp đãi họ với tư cách chủ nhà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: sữa đông
  rationale: Từ này chỉ một sản phẩm sữa đặc, có thể là sữa đông, kem sữa hoặc bơ tùy ngữ cảnh. “Sữa đông” phù hợp với bối cảnh chăn nuôi thời các tổ phụ mà không gợi loại bơ ăn hiện đại.
- source_word: חָלָב
  choice: sữa tươi
  rationale: חָלָב có nghĩa thông thường là sữa; thêm “tươi” giúp cụm “sữa đông, sữa tươi” tự nhiên và phân biệt rõ hai sản phẩm sữa, nhưng không làm thay đổi nội dung căn bản.
- source_word: וּבֶן הַבָּקָר
  choice: thịt con bê
  rationale: Nghĩa đen là “con của đàn bò”, tức một con bò non. Trong ngữ cảnh món ăn đã được làm sẵn, “thịt con bê” tự nhiên hơn “con bê” và tránh tạo cảm giác ông đặt nguyên con vật sống trước khách.
- source_word: אֲשֶׁר עָשָׂה
  choice: đã được chuẩn bị
  rationale: Động từ עשה có nghĩa rộng là làm; trong ngữ cảnh thức ăn, “chuẩn bị” diễn đạt đúng ý. Dạng bị động tránh xác định Áp-ra-ham đích thân chế biến, vì câu trước nói người đầy tớ làm món ăn.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: dọn ra trước mặt họ
  rationale: Nghĩa đen là “đặt/trao trước mặt họ”; trong ngữ cảnh tiếp khách và thức ăn, “dọn ra trước mặt” là cách nói tiếng Việt tự nhiên.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: Ông đứng bên họ
  rationale: Nghĩa sát chữ là “ông đứng trên/ở phía trên họ”, nhưng trong bối cảnh hiếu khách, thành ngữ mô tả ông đứng gần để hầu tiếp. “Đứng bên họ” giữ được hình ảnh mà không hàm ý áp chế.
- source_word: תַּחַת הָעֵץ
  choice: dưới gốc cây
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho vị trí ở dưới cây; “gốc” không nhằm giới hạn họ chỉ đứng sát thân cây.
- source_word: וַיֹּאכֵלוּ
  choice: trong khi họ ăn
  rationale: Mệnh đề kể rằng họ ăn trong lúc Áp-ra-ham đứng hầu bên cạnh; cách diễn đạt thời gian này làm rõ quan hệ giữa hai hành động trong tiếng Việt.
theological_decisions:
- issue: Có nên làm nổi bật cách giải thích thần học về thân phận của các vị khách hay không
  choice: Dịch bằng ngôn ngữ tường thuật thông thường, tập trung vào việc Áp-ra-ham tiếp đãi khách.
  alternative: Dùng ngôn ngữ tôn kính hoặc cao trọng hơn để ngầm chỉ địa vị thần linh của các vị khách.
  rationale: Câu này trực tiếp thuật lại lòng hiếu khách của Áp-ra-ham; bản dịch không nên đưa vào những kết luận Cơ Đốc học hoặc Ba Ngôi mà riêng câu Hê-bơ-rơ này không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để nối mạch tường thuật về Áp-ra-ham; tránh thêm danh xưng thần học cho các vị khách. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
