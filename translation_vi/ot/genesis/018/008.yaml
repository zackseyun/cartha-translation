revisions:
- from: Rồi ông lấy sữa đông, sữa tươi và thịt con bê đã được chuẩn bị[a], dọn ra trước mặt họ. Ông đứng bên họ[b] dưới gốc cây trong khi họ ăn.
  to: Rồi ông lấy sữa đông[a], sữa và con bê đã được chế biến, dọn ra trước mặt họ. Ông đứng bên họ[b] dưới cây, trong khi họ ăn.
  rationale: 'Sửa các chi tiết thêm hoặc thu hẹp nghĩa so với tiếng Hê-bơ-rơ, làm cách nói về món bê tự nhiên hơn, và đặt lại chú thích a tại đúng từ có lựa chọn từ vựng. Bản dịch vẫn giữ quan hệ thời gian: Áp-ra-ham đứng gần các khách dưới cây khi họ ăn, không áp đặt diễn giải về thân phận các khách.'
  reviewer_model: gpt-5.6-terra
