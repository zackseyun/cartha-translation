base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: vi
  text: 'Yahweh phán: “Ta có nên giấu Áp-ra-ham điều Ta đang làm không?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Có phải Ta đang giấu Áp-ra-ham điều Ta đang làm không?”'
    reason: Câu hỏi tiếng Hê-bơ-rơ dùng phân từ, nên có thể được hiểu theo hình thức hiện tại tiếp diễn thay vì sắc thái cân nhắc “có nên”.
lexical_decisions:
- source_word: וַֽיהֹוָה אָמָר
  choice: Yahweh phán
  rationale: Dùng danh Yahweh để thể hiện trực tiếp danh giao ước יהוה. Động từ אָמַר được dịch là “phán” trong lời dẫn phát ngôn của Đức Chúa Trời; liên từ וַ־ nối tiếp mạch kể và không nhất thiết phải biểu đạt riêng bằng “và” trong tiếng Việt.
- source_word: הַֽמְכַסֶּה אֲנִי
  choice: Ta có nên giấu ... không?
  rationale: Cấu trúc nghi vấn với phân từ có sắc thái tự vấn, cân nhắc. Cách dịch này tự nhiên trong tiếng Việt và giữ tính chất câu hỏi tu từ, đồng thời ghi nhận cách hiểu sát hình thức hơn trong chú thích.
- source_word: מֵֽאַבְרָהָם
  choice: Áp-ra-ham
  rationale: Sau động từ “giấu”, đối tượng không được cho biết điều gì có thể làm tân ngữ trực tiếp tự nhiên trong tiếng Việt; ý nghĩa của giới từ מִן vẫn được bảo toàn trong cấu trúc.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה
  choice: điều Ta đang làm
  rationale: Dịch אֲשֶׁר bằng “điều” và giữ giá trị phân từ đang diễn tiến của עֹשֶׂה, không tự ý thêm sắc thái “sắp làm”, dù ngữ cảnh có thể hướng đến hành động sắp xảy ra.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tetragrammaton. Phiên âm “Yahweh” giúp phân biệt danh riêng giao ước với tước hiệu và không nhập một truyền thống giáo phái riêng vào bản dịch.
- issue: Sắc thái lời tự vấn của Đức Chúa Trời
  choice: Ta có nên giấu ... không?
  alternative: Ta đang giấu ... sao?
  rationale: Bản chính giữ sắc thái cân nhắc tự nhiên của nghi vấn có phân từ mà không biến câu này thành lời tuyên bố về sự thiếu hiểu biết hay do dự. Cách đọc theo hình thức hiện tại tiếp diễn được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời Đức Chúa Trời tự nói; “phán” duy trì sắc thái Kinh Thánh trang nghiêm nhưng vẫn quen thuộc với độc giả tiếng Việt.
