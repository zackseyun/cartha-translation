  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל אַבְרָהָ֑ם לָ֣/מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵ/אמֹ֗ר הַ/אַ֥ף אֻמְנָ֛ם אֵלֵ֖ד וַ/אֲנִ֥י זָקַֽנְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với Áp-ra-ham: “Tại sao Sa-ra lại cười và nói: ‘Tôi đã già rồi, lẽ nào tôi thật sự còn sinh con được sao?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để thể hiện danh riêng của Đức Chúa Trời trong nguyên văn, thay vì chuyển thành một tước hiệu chung.
- source_word: הַאַף אֻמְנָם אֵלֵד
  choice: lẽ nào tôi thật sự còn sinh con được sao?
  rationale: Giữ sắc thái nghi vấn ngờ vực của הַאַף cùng ý nhấn mạnh “thật sự” trong אֻמְנָם; “còn…được” diễn đạt tự nhiên hoàn cảnh tuổi già mà không thêm ý ‘đứa trẻ’ vốn không hiện diện trong câu Hê-bơ-rơ.
- source_word: זָקַנְתִּי
  choice: tôi đã già rồi
  rationale: Diễn đạt trực tiếp trạng thái tuổi già ở ngôi thứ nhất, với “rồi” thể hiện hoàn cảnh hiện tại dẫn đến câu hỏi.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Gia-vê
  rationale: Giữ đây là danh riêng theo chứng cứ nguyên ngữ, đồng thời chọn hình thức đã quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt; không biến danh này thành một tước hiệu thuần túy.
- issue: Mức độ ngờ vực trong lời Sa-ra
  choice: lẽ nào tôi thật sự còn sinh con được sao?
  alternative: Tôi thật sự sẽ sinh con sao?
  rationale: Cách chọn giữ cả yếu tố nghi vấn lẫn sự khó tin do tuổi già, nhưng không diễn giải thêm động cơ hay phán xét đức tin của Sa-ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lời dẫn cùng lời trích dẫn lồng bên trong; dùng “phán” phù hợp lời Đức Chúa Trời, còn “nói” cho lời Sa-ra.
