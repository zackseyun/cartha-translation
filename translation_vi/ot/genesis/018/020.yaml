id: GEN.18.20
reference: Genesis 18:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán: “Tiếng kêu tố cáo Sô-đôm và Gô-mô-rơ thật lớn[a], và tội lỗi của họ thật nặng nề[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tiếng kêu của Sô-đôm và Gô-mô-rơ thật lớn.” Nguyên văn Hê-bơ-rơ nói sát chữ như vậy; bản chính làm rõ rằng tiếng kêu ấy tố cáo hai thành.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ nói tội lỗi của họ “rất nặng”, một cách diễn đạt chỉ mức độ hết sức nghiêm trọng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng waw liên tiếp thúc đẩy mạch kể chuyện. “Bấy giờ” diễn đạt tự nhiên trình tự sự việc; “phán” phù hợp với lời nói trực tiếp của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ nguyên việc bản Hê-bơ-rơ dùng Danh Thánh thay vì thay bằng một tước hiệu.
- source_word: זַעֲקַת
  choice: tiếng kêu tố cáo
  rationale: זַעֲקָה chỉ tiếng kêu cứu hoặc tiếng kêu phát sinh vì áp bức, bất công nghiêm trọng. Trong ngữ cảnh, “tố cáo” diễn đạt tự nhiên việc tiếng kêu hướng đến sự gian ác của hai thành, nhưng chú thích vẫn bảo lưu cách hiểu sát chữ “tiếng kêu của”.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sô-đôm và Gô-mô-rơ
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho hai địa danh.
- source_word: כִּי רָבָּה
  choice: thật lớn
  rationale: Tính từ giống cái số ít tương ứng với זַעֲקַת và mô tả mức độ lớn lao của tiếng kêu; כִּי ở đây có sắc thái nhấn mạnh trong nội dung lời phán.
- source_word: וְחַטָּאתָם
  choice: và tội lỗi của họ
  rationale: חַטָּאת ở số ít mang nghĩa tập thể về sự phạm tội của cư dân hai thành; “tội lỗi của họ” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: כִּי כָבְדָה מְאֹד
  choice: thật nặng nề
  rationale: כבד có nghĩa đen là “nặng” và trong ngữ cảnh đạo đức, xét xử diễn tả mức độ nghiêm trọng. “Thật nặng nề” vừa giữ hình ảnh Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn trực tiếp dùng Tứ Tự Danh như một danh riêng. “Yahweh” bảo tồn danh giao ước thay vì thay thế bằng tước hiệu.
- issue: Chủ thể được quy chiếu bởi hậu tố số nhiều trong וְחַטָּאתָם
  choice: của họ
  alternative: của chúng
  rationale: Hậu tố Hê-bơ-rơ chỉ cư dân Sô-đôm và Gô-mô-rơ, không phải bản thân địa danh theo nghĩa đen. “Họ” là đại từ tự nhiên dành cho con người và không thêm sắc thái miệt thị không có trong nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu văn giữ nhịp kể chuyện ngắn gọn; “phán” duy trì sắc thái lời Đức Chúa Trời, còn “thật nặng nề” bảo tồn hình ảnh của thành ngữ Hê-bơ-rơ mà không trở nên tối nghĩa.
