reference: Genesis 18:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: vi
  text: 'Giả sử trong số năm mươi người công chính còn thiếu năm người, chẳng lẽ Ngài sẽ hủy diệt cả thành chỉ vì thiếu năm người sao? Ngài đáp: “Ta sẽ không hủy diệt thành nếu tìm thấy bốn mươi lăm người ở đó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: Giả sử
  rationale: Mở đầu lời thỉnh cầu mang tính giả định của Áp-ra-ham; cách diễn đạt này tự nhiên trong mạch thương lượng và vẫn giữ sắc thái khả hữu.
- source_word: יַחְסְרוּן ... חֲמִשָּׁה
  choice: còn thiếu năm người
  rationale: Động từ חסר diễn tả số lượng năm mươi bị hụt đi năm; “còn thiếu năm người” làm rõ rằng tổng số chỉ đạt bốn mươi lăm, không ám chỉ năm cá nhân cụ thể vắng mặt.
- source_word: חֲמִשִּׁים הַצַּדִּיקִם
  choice: năm mươi người công chính
  rationale: Giữ số lượng và ý nghĩa đạo đức–pháp lý của צַדִּיקִים, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: הֲתַשְׁחִית
  choice: chẳng lẽ Ngài sẽ hủy diệt
  rationale: Hiphil của שׁחת có nghĩa là hủy diệt; “chẳng lẽ” truyền đạt lực của câu hỏi tu từ mà không thay đổi nội dung.
- source_word: בַּחֲמִשָּׁה
  choice: chỉ vì thiếu năm người
  rationale: Giới từ בּ mang nghĩa nguyên nhân hoặc căn cứ; thêm “thiếu” giúp tiếng Việt nêu rõ thành bị hủy vì con số hụt năm, không phải vì năm người ấy.
- source_word: אֶת כָּל הָעִיר
  choice: cả thành
  rationale: Cách tương đương tự nhiên, giữ trọn ý nghĩa toàn thể của כָּל.
- source_word: לֹא אַשְׁחִית
  choice: Ta sẽ không hủy diệt thành
  rationale: Lặp lại cùng động từ như trong câu hỏi và nêu rõ tân ngữ được hiểu ngầm là thành.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: nếu tìm thấy bốn mươi lăm người ở đó
  rationale: Giữ nguyên cấu trúc điều kiện và địa điểm; “người” được bổ sung tự nhiên theo danh từ được hiểu ngầm trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch צַדִּיקִים
  choice: người công chính
  alternative: người ngay lành
  rationale: “Người công chính” giữ được chiều kích đạo đức và pháp lý của từ Hê-bơ-rơ trong bối cảnh Áp-ra-ham cầu thay, mà không thu hẹp nghĩa vào một hệ phái.
- issue: Chủ thể nói trong וַיֹּאמֶר
  choice: Ngài đáp
  alternative: Người đáp / Đức Giê-hô-va đáp
  rationale: Ngữ cảnh xác định người đáp là Đức Chúa Trời; “Ngài” tự nhiên và tránh chèn danh xưng không xuất hiện ngay trong câu này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Câu hỏi tu từ được thể hiện bằng “chẳng lẽ”; đại từ “Ngài/Ta” phù hợp lời đối thoại với Đức Chúa Trời. Không cần chú thích vì các sắc thái nguồn được thể hiện rõ trong chính văn.
