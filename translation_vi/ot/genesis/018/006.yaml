base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: vi
  text: 'Áp-ra-ham vội vã vào lều, đến chỗ Sa-ra và nói: “Mau lên! Hãy nhồi ba sê-a[a] bột mì mịn loại tốt rồi làm bánh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sê-a là một đơn vị đo khô thời xưa; ba sê-a tương đương khoảng 20–22 lít.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: vội vã
  rationale: Diễn đạt tự nhiên sắc thái hành động nhanh và giữ nhịp kể khẩn trương.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: vào lều gặp Sa-ra
  rationale: Hậu tố chỉ hướng ở הָאֹהֱלָה biểu thị chuyển động về phía hoặc vào lều; “gặp Sa-ra” diễn đạt tự nhiên quan hệ אֶל שָׂרָה mà không hàm ý quá mức.
- source_word: מַהֲרִי
  choice: Mau lên!
  rationale: Mệnh lệnh giống cái số ít nói trực tiếp với Sa-ra; cách nói này tự nhiên và truyền được sự gấp rút.
- source_word: שְׁלֹשׁ סְאִים
  choice: ba sê-a
  rationale: Giữ đơn vị đo khô cụ thể của thế giới cổ đại thay vì làm mờ thành “ba đấu”; chú thích giải thích dung lượng gần đúng.
- source_word: קֶמַח סֹלֶת
  choice: bột mì loại tốt
  rationale: Cụm từ chỉ bột được xay kỹ, có phẩm chất tốt; cách dịch này rõ nghĩa trong tiếng Việt hiện đại và tránh hiểu “mịn” chỉ là mô tả kết cấu.
- source_word: לוּשִׁי
  choice: nhồi
  rationale: Động từ chỉ việc nhào hoặc nhồi bột thành khối bột làm bánh, không chỉ đơn thuần trộn nguyên liệu.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: rồi làm bánh
  rationale: עֻגוֹת là những bánh tròn, có lẽ là bánh mì dẹt; “làm bánh” giữ nghĩa rộng và không xác định thêm cách nướng mà nguyên văn không nói.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu trong tiếng Việt hiện đại. Giữ tên đơn vị cổ và giải thích bằng chú thích; lời thoại ngắn, gấp để phản ánh hai động từ cùng trường nghĩa ‘mau/vội’ trong nguyên văn.
