id: GEN.18.22
reference: Genesis 18:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּפְנ֤וּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּלְכ֖וּ סְדֹ֑מָ/ה וְ/אַ֨בְרָהָ֔ם עוֹדֶ֥/נּוּ עֹמֵ֖ד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: vi
  text: Rồi những người ấy quay đi khỏi đó và đi về phía Sô-đôm[a], còn Áp-ra-ham vẫn đứng trước mặt Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số chứng cứ cổ đọc: “còn Yahweh vẫn đứng trước mặt Áp-ra-ham.” Bản Hê-bơ-rơ Masoret đọc: “còn Áp-ra-ham vẫn đứng trước mặt Yahweh.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: quay đi
  rationale: Diễn tả việc đổi hướng và rời vị trí hiện tại, tự nhiên trong mạch kể tiếng Việt.
- source_word: מִשָּׁם
  choice: khỏi đó
  rationale: Chuyển tải trực tiếp ý nghĩa chỉ nơi chốn và điểm xuất phát.
- source_word: הָאֲנָשִׁים
  choice: những người ấy
  rationale: Giữ cách gọi bề mặt của tiếng Hê-bơ-rơ là “những người”, không đưa sẵn cách giải thích về bản tính của họ vào câu chính.
- source_word: וַיֵּלְכוּ
  choice: đi
  rationale: Động từ thông dụng chỉ sự di chuyển; phù hợp với văn kể hiện đại.
- source_word: סְדֹמָה
  choice: về phía Sô-đôm
  rationale: Phản ánh hậu tố chỉ hướng trên địa danh, nhấn mạnh chuyển động hướng đến Sô-đôm mà không nhất thiết khẳng định họ đã tới nơi.
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: vẫn đứng
  rationale: Diễn đạt trạng thái tiếp diễn của phân từ cùng trạng từ chỉ sự duy trì, ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: לִפְנֵי
  choice: trước mặt
  rationale: Giữ cả sắc thái không gian “ở phía trước” lẫn ý hiện diện trước một nhân vật.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh YHWH; “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu hay dùng một dạng phiên âm thứ cấp.
- issue: Chủ thể của mệnh đề cuối trong dị bản văn bản
  choice: Áp-ra-ham vẫn đứng trước mặt Yahweh
  alternative: Yahweh vẫn đứng trước mặt Áp-ra-ham
  rationale: Bản Masoret được cung cấp đọc rằng Áp-ra-ham đứng trước Yahweh. Dị bản cổ đảo chủ thể được ghi ở chú thích để bảo tồn chứng cứ văn bản mà không thay thế bản nguồn chính.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “những người ấy” để nối tự nhiên với ngữ cảnh; giữ danh Yahweh và ghi rõ dị bản cổ trong chú thích.
