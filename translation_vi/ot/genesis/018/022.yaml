  source_fidelity: 'Bản dịch bám sát Bản Masoret: וַיִּפְנוּ מִשָּׁם được chuyển đúng là “quay đi khỏi đó”; הָאֲנָשִׁים giữ ở mức bề mặt là “những người ấy”; hướng chuyển động đến Sô-đôm được phản ánh bằng “đi về phía Sô-đôm”; và עוֹדֶנּוּ עֹמֵד được diễn đạt chính xác là “vẫn đứng”. Mệnh đề cuối theo đúng MT: Áp-ra-ham đứng trước Yahweh.'
  naturalness: Câu văn tự nhiên trong tiếng Việt hiện đại, với liên từ “Rồi” và “còn” thể hiện mạch tự sự và thế đối lập/chuyển cảnh rõ ràng. “Trước mặt Yahweh” phù hợp cả nghĩa hiện diện lẫn văn phong trang trọng của ngữ cảnh.
  terminology: “Yahweh” nhất quán với quyết định chuyển tự danh יהוה. Các dạng “Sô-đôm” và “Áp-ra-ham” là những dạng Việt hóa Kinh Thánh dễ nhận biết. Chú thích trình bày đúng dị bản về sự đảo chủ thể mà không đưa dị bản vào câu chính.
