base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: vi
  text: Ông ngước mắt lên nhìn, và kìa, có ba người đàn ông đang đứng gần ông[a]. Vừa thấy họ, ông chạy từ cửa lều ra đón họ và cúi mình xuống đất[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đứng bên cạnh ông”; giới từ Hê-bơ-rơ có thể chỉ khoảng cách rất gần.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phủ phục xuống đất.” Động từ này diễn tả một cử chỉ tôn kính sâu sắc, nhưng tự nó không nhất thiết có nghĩa là “thờ lạy.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Ông ngước mắt lên
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ được hình ảnh của thành ngữ Hê-bơ-rơ thay vì giản lược thành “ông nhìn lên”.
- source_word: וַיַּרְא
  choice: nhìn
  rationale: Ở lần xuất hiện thứ nhất, động từ đi cùng hành động ngước mắt nên “nhìn” tự nhiên hơn và tránh lặp “thấy” không cần thiết.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ chức năng trình hiện sống động và yếu tố bất ngờ của từ nối trong lời kể, với cách nói vẫn dễ hiểu trong văn phong trang trọng hiện đại.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: ba người đàn ông
  rationale: Phản ánh trực tiếp danh từ chỉ nam giới trong nguyên văn, không làm mờ cách các nhân vật được giới thiệu ở thời điểm này trong câu chuyện.
- source_word: נִצָּבִים עָלָיו
  choice: đang đứng gần ông
  rationale: Giới từ có thể chỉ vị trí ở sát hoặc bên cạnh. “Gần ông” phù hợp ngữ cảnh và không tạo ấn tượng chắc chắn rằng họ đang đứng chồm lên trên ông.
- source_word: וַיַּרְא
  choice: Vừa thấy họ
  rationale: Ở lần xuất hiện thứ hai, “vừa thấy họ” diễn đạt tự nhiên quan hệ thời gian dẫn tới phản ứng tức thì của Áp-ra-ham.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: chạy ra đón
  rationale: Giữ đúng động từ chỉ hành động chạy và thể hiện sự sốt sắng của nhân vật; “đón” chuyển tải tự nhiên ý đi ra để gặp những người đang đến.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: từ cửa lều
  rationale: Cách diễn đạt gọn, tự nhiên và chính xác cho vị trí tại chỗ mở hoặc lối vào của lều.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: cúi mình sát đất
  rationale: Diễn tả cử chỉ hạ mình sâu hướng xuống đất mà không tự động gán cho hành động này nghĩa chuyên biệt là thờ phượng.
theological_decisions:
- issue: Cử chỉ của Áp-ra-ham có nên được dịch thành hành động thờ phượng một nhân vật thần linh hay không
  choice: cúi mình sát đất
  alternative: thờ lạy; phủ phục xuống đất
  rationale: Động từ Hê-bơ-rơ có thể chỉ sự cúi lạy hoặc phủ phục trước con người hay trước Đức Chúa Trời. Trong chính câu này, các vị khách được giới thiệu là “ba người đàn ông”; vì vậy, dịch là “thờ lạy” sẽ giải quyết quá sớm một vấn đề thần học mà câu chưa nói rõ. Bản dịch giữ cử chỉ thể chất và sự tôn kính, đồng thời bảo toàn sức căng của lời kể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp kể sống động của nguyên văn qua “và kìa” và chuỗi hành động nhanh; tránh thuật ngữ tôn giáo có thể áp đặt trước một kết luận thần học.
