base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: vi
  text: Áp-ra-ham chạy đến đàn bò, bắt một con bê non, mềm và tốt, rồi trao cho người thanh niên[a]; người thanh niên ấy vội vàng chuẩn bị nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người hầu” hoặc “cậu bé”; từ Hê-bơ-rơ הַנַּעַר có thể chỉ một người trẻ tuổi hoặc một người hầu, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: đàn bò
  rationale: Danh từ chỉ chung đàn gia súc thuộc loài bò; “đàn bò” tự nhiên trong tiếng Việt và phù hợp với cảnh Áp-ra-ham đến chọn một con.
- source_word: רָץ
  choice: chạy
  rationale: Giữ nguyên nét nghĩa trực tiếp và nhịp kể sống động, nhấn mạnh sự khẩn trương trong việc tiếp khách.
- source_word: בֶּן־בָּקָר
  choice: một con bê non
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “con của bò”, chỉ một con bò còn non; “bê non” rõ nghĩa và tự nhiên trong ngữ cảnh chuẩn bị bữa ăn.
- source_word: רַךְ וָטוֹב
  choice: mềm và tốt
  rationale: 'Giữ hai đặc tính song song của nguyên văn: רַךְ là mềm/non mềm, còn טוֹב mô tả phẩm chất tốt. Không đổi “tốt” thành một ý chuyên biệt hơn như “béo tốt” hay “thượng hạng”.'
- source_word: הַנַּעַר
  choice: người thanh niên
  rationale: Từ này có thể chỉ một thiếu niên, thanh niên hoặc người hầu tùy ngữ cảnh. “Người thanh niên” giữ nghĩa từ vựng cơ bản mà không mặc nhiên xác định địa vị phục dịch.
- source_word: וַיְמַהֵר
  choice: vội vàng
  rationale: Diễn đạt tự nhiên hành động mau lẹ và bảo toàn sự nhấn mạnh của câu chuyện vào lòng hiếu khách khẩn trương.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: làm thịt và chuẩn bị con bê
  rationale: Động từ עשה có nghĩa rộng là “làm”, nhưng với một con bê được chọn cho bữa ăn, hành động bao gồm việc làm thịt và chuẩn bị. Cách dịch này làm rõ ý theo ngữ cảnh mà không chỉ giới hạn vào nấu nướng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Áp-ra-ham” theo dạng tên quen thuộc trong tiếng Việt; giữ nhịp hành động nhanh của nguyên văn. Dấu [a] được đặt ngay sau cụm từ cần chú thích.
