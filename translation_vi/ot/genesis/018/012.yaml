base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: vi
  text: 'Bấy giờ, Sa-ra cười thầm và tự nhủ: “Sau khi thân thể ta đã tàn tạ, ta còn được hưởng lạc thú[a] sao, trong khi chồng ta[b] cũng đã già rồi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “niềm vui thích” hoặc “sức trẻ”; từ Hê-bơ-rơ có thể gợi đến khoái cảm vợ chồng hoặc sức sống được phục hồi.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa sát là “chủ ta” hoặc “chúa của ta”; đây là cách Sa-ra kính trọng gọi Áp-ra-ham, không phải danh xưng thần linh.
    reason: source_term
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: cười
  rationale: Động từ צחק ở thể qal thường có nghĩa là “cười”; ngữ cảnh nói đến phản ứng kín đáo của Sa-ra, không nhất thiết là chế nhạo.
- source_word: בְּקִרְבָּהּ
  choice: cười thầm
  rationale: Cụm này theo nghĩa đen là “ở bên trong bà”; “cười thầm” diễn đạt tự nhiên một phản ứng diễn ra trong lòng.
- source_word: לֵאמֹר
  choice: và tự nhủ
  rationale: Dạng nguyên mẫu này dẫn vào lời trích dẫn; vì lời nói diễn ra trong lòng, “tự nhủ” vừa tự nhiên vừa giữ đúng ngữ cảnh.
- source_word: אַחֲרֵי בְלֹתִי
  choice: Sau khi thân thể ta đã tàn tạ
  rationale: בלה diễn tả tình trạng hao mòn, cũ nát hoặc suy kiệt. Thêm “thân thể” làm rõ ý tự nhiên trong tiếng Việt mà không đồng nhất cụm này với từ “già” dùng cho Áp-ra-ham.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: lẽ nào ta còn được vui thú
  rationale: Cấu trúc diễn tả sự ngờ vực về việc Sa-ra có thể lại được hưởng niềm vui hay sự thích thú. “Vui thú” giữ nghĩa tương đối rộng và không áp đặt một sắc thái duy nhất.
- source_word: עֶדְנָה
  choice: vui thú
  rationale: Danh từ hiếm này có thể chỉ sự thích thú, khoái lạc hoặc sức sống trẻ trung trong bối cảnh thân thể và hôn nhân. “Vui thú” giữ được độ rộng nghĩa; các sắc thái cụ thể hơn được nêu trong chú thích.
- source_word: וַאדֹנִי
  choice: chồng ta
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là “chúa/chủ của ta”, ở đây là cách Sa-ra kính trọng gọi Áp-ra-ham. “Chồng ta” xác định đúng đối tượng và tránh cách nói “chúa ta” dễ bị hiểu là danh xưng dành cho Đức Chúa Trời trong tiếng Việt.
- source_word: זָקֵן
  choice: đã già rồi
  rationale: Cách diễn đạt trực tiếp, tự nhiên cho vị ngữ chỉ tuổi già; “rồi” làm rõ trạng thái đã đạt đến.
theological_decisions:
- issue: Sắc thái của עֶדְנָה trong lời Sa-ra
  choice: Dùng cách dịch rộng “được vui thú”
  alternative: “được khoái lạc” hoặc “lại có sức trẻ”
  rationale: Ngữ cảnh có thể bao hàm khoái cảm vợ chồng, khả năng sinh sản hoặc sức sống được phục hồi, nhưng từ Hê-bơ-rơ không giới hạn rõ vào một nghĩa. Bản dịch chính vì thế giữ sự rộng nghĩa và để các khả năng cụ thể hơn trong chú thích.
- issue: Danh xưng וַאדֹנִי dành cho Áp-ra-ham
  choice: “chồng ta” trong chính văn
  alternative: “chúa/chủ của ta” theo nghĩa sát chữ
  rationale: Đây là danh xưng kính trọng dành cho Áp-ra-ham, không phải tước hiệu thần linh. Trong tiếng Việt hiện đại, “chồng ta” truyền đạt quan hệ đúng và tránh tạo hàm ý thần học không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cười thầm” và “tự nhủ” truyền đạt tính nội tâm; đại từ “ta” phù hợp với lời tự nói trong văn kể trang trọng. Cụm “thân thể ta đã tàn tạ” giữ hình ảnh hao mòn của nguyên văn, còn “chồng ta” tránh sự mơ hồ thần học mà cách dịch sát “chúa ta” có thể gây ra.
