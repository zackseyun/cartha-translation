source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: vi
  text: 'Yahweh phán: “Nếu Ta tìm thấy trong thành Sô-đôm năm mươi người công chính, thì vì họ, Ta sẽ dung tha[a] cả nơi ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tha thứ cho cả nơi ấy.” Động từ Hê-bơ-rơ có thể mang nghĩa mang đi hoặc cất đi tội lỗi, và trong ngữ cảnh này có thể chỉ việc tha hoặc không thi hành sự phán xét.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ nguyên chức năng của Danh trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Trong văn kể chuyện tiếng Việt, “phán” là cách diễn đạt trang trọng và tự nhiên khi Đức Chúa Trời nói; liên từ וַ được lược bỏ vì mạch nối đã rõ và tiếng Việt không cần lặp “và”.
- source_word: אִם אֶמְצָא
  choice: Nếu Ta tìm thấy
  rationale: Giữ nguyên cấu trúc điều kiện và ngôi thứ nhất của lời Yahweh.
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: trong thành Sô-đôm
  rationale: Gộp hai yếu tố địa điểm có phần trùng nhau thành cách nói tiếng Việt tự nhiên, vẫn xác định rõ năm mươi người phải ở bên trong thành.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: năm mươi người công chính
  rationale: צַדִּיקִם chỉ những người được xem là công chính, không nhất thiết chỉ nam giới.
- source_word: וְנָשָׂאתִי
  choice: Ta sẽ dung tha
  rationale: Trong ngữ cảnh phán xét một địa điểm, נָשָׂא mang nghĩa không thi hành hình phạt hoặc tha cho; “dung tha” truyền đạt rõ ý ấy mà vẫn để chú thích ghi nhận sắc thái tha thứ.
- source_word: לְכָל הַמָּקוֹם
  choice: cả nơi ấy
  rationale: Diễn đạt trọn phạm vi của הַמָּקוֹם và quy chiếu tự nhiên về thành Sô-đôm.
- source_word: בַּעֲבוּרָם
  choice: vì họ
  rationale: Diễn đạt ngắn gọn và tự nhiên rằng sự dung tha được thực hiện vì cớ những người công chính.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh Tetragrammaton; phiên âm “Yahweh” bảo tồn đây là danh riêng, không thay bằng tước hiệu.
- issue: Sắc thái của וְנָשָׂאתִי trong bối cảnh phán xét
  choice: dung tha
  alternative: tha thứ; tha cho
  rationale: Đối tượng trực tiếp theo nghĩa là “cả nơi ấy,” nên “dung tha” phù hợp với việc không giáng sự phán xét trên thành; chú thích bảo tồn khả năng hiểu theo sắc thái tha thứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” trong lời trực tiếp của Yahweh; “Sô-đôm” theo dạng tên riêng quen thuộc trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau từ có phương án dịch khác.
