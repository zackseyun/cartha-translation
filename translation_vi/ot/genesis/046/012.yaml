base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: vi
  text: Các con trai của Giu-đa là Ê-rơ, Ô-nan, Sê-la, Pê-rết và Xê-rách. Nhưng Ê-rơ và Ô-nan[a] đã chết tại xứ Ca-na-an. Các con trai của Pê-rết là Hết-rôn và Ha-mun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ, động từ ở số ít đứng trước chủ ngữ kép “Ê-rơ và Ô-nan”; đây là một cấu trúc Hê-bơ-rơ thông thường. Câu này có nghĩa là cả Ê-rơ lẫn Ô-nan đều đã chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: Các con trai của Giu-đa
  rationale: Diễn đạt trực tiếp kết cấu sở hữu trong danh sách gia phả; không nhất thiết dịch liên từ וְ ở đầu câu vì tiếng Việt nối mạch tự nhiên qua ngữ cảnh.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: Ê-rơ, Ô-nan, Sê-la, Pê-rết và Xê-rách
  rationale: Phiên âm các tên riêng theo lối quen dùng và dễ đọc trong tiếng Việt hiện đại.
- source_word: וַיָּמָת
  choice: đã chết
  rationale: Dù động từ Hê-bơ-rơ mang hình thức số ít và đứng trước chủ ngữ kép, ý nghĩa trong cấu trúc này áp dụng cho cả Ê-rơ lẫn Ô-nan; tiếng Việt không đánh dấu số ở động từ.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: tại xứ Ca-na-an
  rationale: Giữ danh từ אֶרֶץ, đồng thời dùng cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: Các con trai của Pê-rết là
  rationale: Trong ngữ cảnh gia phả, היה dùng để xác định danh tính các con; “là” diễn đạt tự nhiên hơn “trở thành”.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: Hết-rôn và Ha-mun
  rationale: Phiên âm tên riêng từ bản Hê-bơ-rơ theo dạng rõ ràng, dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và dễ hiểu. Dùng “xứ Ca-na-an” để vừa giữ danh từ “đất/xứ” trong nguyên văn vừa tránh cách diễn đạt nặng nề; dấu chú thích được đặt ngay sau chủ ngữ kép mà nó giải thích.
