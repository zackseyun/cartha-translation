  yaml_path: translation/ot/genesis/046/024.yaml
  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: vi
  text: 'Và các con trai của Nép-ta-li là: Giác-xê-ên, Gu-ni, Giê-xe và Si-lêm.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: בְנֵי là dạng số nhiều liên kết của “con trai”; trong gia phả, cách dịch này chính xác và tự nhiên. Liên từ וּ được thể hiện qua sự tiếp nối của danh sách trong văn cảnh, không nhất thiết phải dịch riêng là “và” ở đầu câu tiếng Việt.
- source_word: נַפְתָּלִי
  choice: Nép-ta-li
  rationale: Tên riêng được phiên âm theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: יַחְצְאֵל
  choice: Gia-xê-ên
  rationale: Phiên âm tên riêng từ tiếng Hê-bơ-rơ, thể hiện gần đúng các phụ âm chính và có hình thức tự nhiên đối với độc giả Việt.
- source_word: וְגוּנִי
  choice: Gu-ni
  rationale: Tên riêng được phiên âm; liên từ đi kèm được thể hiện bằng cấu trúc liệt kê tiếng Việt.
- source_word: וְיֵצֶר
  choice: Giê-xe
  rationale: Phiên âm tên riêng từ tiếng Hê-bơ-rơ theo cách dễ đọc trong tiếng Việt.
- source_word: וְשִׁלֵּם
  choice: Si-lêm
  rationale: Phiên âm tên riêng; âm đôi được giản lược tự nhiên vì tiếng Việt không biểu thị phụ âm đôi như tiếng Hê-bơ-rơ.
