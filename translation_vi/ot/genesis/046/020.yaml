base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: vi
  text: Tại xứ Ai Cập, A-sê-nát, con gái Phô-ti Phê-ra, tư tế của Ôn,[a] đã sinh cho Giô-sép Ma-na-se và Ép-ra-im.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ôn là một thành phố Ai Cập, về sau được người Hy Lạp gọi là Hê-li-ô-pô-lít.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: đã sinh cho Giô-sép
  rationale: Động từ Nifal diễn tả việc các con được sinh cho Giô-sép. Tiếng Việt tự nhiên hơn khi chuyển sang kết cấu chủ động với người mẹ làm chủ ngữ, điều đã được mệnh đề quan hệ tiếng Hê-bơ-rơ nêu rõ.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: Tại xứ Ai Cập
  rationale: Giữ rõ אֶרֶץ là “xứ” và đưa địa điểm lên đầu câu để câu tiếng Việt tự nhiên, đồng thời duy trì vị trí nổi bật của địa điểm trong nguồn.
- source_word: אֲשֶׁר יָלְדָה לּוֹ אָסְנַת
  choice: A-sê-nát ... đã sinh cho Giô-sép
  rationale: Chuyển mệnh đề quan hệ thành mệnh đề chính, vẫn bảo toàn hành động sinh nở của A-sê-nát và quan hệ “cho ông” được biểu thị bởi לּוֹ.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: con gái Phô-ti Phê-ra
  rationale: Giữ nguyên quan hệ thân tộc trong cụm trạng thái cấu tạo và phiên âm tên riêng theo lối Việt hóa dễ đọc.
- source_word: כֹּהֵן אֹן
  choice: tư tế thành Ôn
  rationale: כֹּהֵן chỉ chức vụ tôn giáo; “tư tế” là cách gọi hiện đại, trang trọng và không thiên về hệ phái. Thêm “thành” để người đọc nhận rõ Ôn là địa danh.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Ma-na-se và Ép-ra-im
  rationale: Các dấu hiệu tân ngữ אֶת không cần dịch; hai tên riêng được phiên âm sang tiếng Việt.
theological_decisions:
- issue: Cách gọi chức vụ כֹּהֵן của Phô-ti Phê-ra
  choice: tư tế
  alternative: thầy tế lễ
  rationale: “Tư tế” truyền đạt chức vụ tôn giáo Ai Cập một cách trung tính, trang trọng, tránh gợi rằng ông đảm nhiệm chức tế lễ của Y-sơ-ra-ên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp lại theo cú pháp tiếng Việt, dùng A-sê-nát làm chủ ngữ nhưng không thay đổi các quan hệ ý nghĩa trong bản Hê-bơ-rơ. Dấu chú thích [a] đặt ngay sau địa danh Ôn.
