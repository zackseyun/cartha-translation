  terminology: “Tư tế” là lựa chọn trung tính, phù hợp cho chức vụ tôn giáo Ai Cập. Các tên A-sê-nát, Giô-sép, Ma-na-se, Ép-ra-im và Ôn được phiên âm nhất quán. Cần dùng “của Ôn” để diễn đạt rõ quan hệ trong “tư tế của Ôn.”
