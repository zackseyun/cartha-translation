  source_fidelity: 'Bản dịch truyền đạt đúng các dữ kiện chính: hai con được sinh cho Giô-sép tại Ai Cập, mẹ là A-sê-nát, con gái Phô-ti Phê-ra, và cha bà là tư tế liên hệ với Ôn. Tuy nhiên, “tư tế thành Ôn” có thể được hiểu là một tư tế cư trú tại thành Ôn, trong khi cấu trúc כֹּהֵן אֹן xác định chức danh là “tư tế của Ôn.”'
