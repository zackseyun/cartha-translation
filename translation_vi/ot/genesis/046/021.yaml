  - severity: medium
    issue: Chú thích a nói A-hi-ram ở Dân Số 26:38 xuất hiện “tại vị trí tương ứng.”
    rationale: Gia phả trong Dân Số 26:38 có thứ tự và các dạng tên không hoàn toàn tương ứng từng vị trí với Sáng Thế Ký 46:21. Nên diễn đạt thận trọng rằng đoạn song song ghi A-hi-ram, còn câu này ghi Ê-hi.
