  rationale: Sửa tên cuối danh sách để không làm sai dạng tên Ard của Bản văn Masore, đồng thời dùng hình thức “A-rết” quen thuộc trong tiếng Việt. Chỉnh chú thích về Ê-hi/A-hi-ram để tránh khẳng định một sự tương ứng vị trí mà các danh sách gia phả không bảo đảm. Các phần khác được giữ nguyên vì phản ánh trung thành văn bản nguồn và có văn phong tự nhiên.
  reviewer_model: gpt-5.6-terra
