base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: vi
  text: 'Các con trai của Bên-gia-min là: Bê-la, Bê-ke, Ách-bên, Ghê-ra, Na-a-man, Ê-hi[a], Rốt, Múp-pim[b], Húp-pim và A-rết[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong Dân Số 26:38, một gia phả song song của chi phái Bên-gia-min ghi tên “A-hi-ram,” còn câu này ghi “Ê-hi”.
    reason: cross_reference
  - marker: b
    text: Một số truyền thống gia phả song song có dạng tên như “Súp-pim” thay cho “Múp-pim”; bản dịch này theo Bản văn Masore tại đây.
    reason: textual_variant
  - marker: c
    text: Trong 1 Sử Ký 8:3, một gia phả của Bên-gia-min có dạng tên liên hệ “Át-đa”; câu này ghi “A-rết”.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: Dạng số nhiều liên kết của בֵּן; trong gia phả, cách dịch này tự nhiên và chính xác. Không cần dịch riêng waw mở đầu vì câu tiếng Việt vẫn thể hiện rõ sự tiếp nối của danh sách.
- source_word: בִנְיָמִן
  choice: Bên-gia-min
  rationale: Phiên âm tên riêng theo hình thức quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: בֶּלַע
  choice: Bê-la
  rationale: Phiên âm tên riêng Hê-bơ-rơ.
- source_word: בֶּכֶר
  choice: Bê-ke
  rationale: Phiên âm gần âm Hê-bơ-rơ của tên בֶּכֶר; không cần chú thích về lối viết tiếng Anh vì điều đó không liên quan trực tiếp đến độc giả tiếng Việt.
- source_word: אַשְׁבֵּל
  choice: Ách-bên
  rationale: Phiên âm tên riêng, thể hiện phụ âm שׁ bằng 'ch' và âm cuối l bằng 'n' theo dạng quen thuộc trong tên Kinh Thánh tiếng Việt.
- source_word: גֵּרָא
  choice: Ghê-ra
  rationale: Phiên âm tên riêng Hê-bơ-rơ bằng chính tả tiếng Việt dễ đọc.
- source_word: נַעֲמָן
  choice: Na-a-man
  rationale: Phiên âm giữ các âm tiết của tên Hê-bơ-rơ.
- source_word: אֵחִי
  choice: Ê-hi
  rationale: Theo đúng tên trong Bản văn Masore tại câu này; tên khác trong gia phả song song được ghi chú.
- source_word: רֹאשׁ
  choice: Rốt
  rationale: Trong danh sách này, רֹאשׁ là tên riêng nên được phiên âm, không dịch thành danh từ chung 'đầu' hay 'thủ lĩnh'.
- source_word: מֻפִּים
  choice: Múp-pim
  rationale: Theo hình thức מֻפִּים của Bản văn Masore; biến thể trong truyền thống gia phả song song được ghi chú.
- source_word: חֻפִּים
  choice: Húp-pim
  rationale: Phiên âm tên riêng theo Bản văn Masore.
- source_word: אָרְדְּ
  choice: Át
  rationale: Theo hình thức tên אָרְדְּ tại câu này; dạng tên liên hệ trong 1 Sử ký được ghi chú.
