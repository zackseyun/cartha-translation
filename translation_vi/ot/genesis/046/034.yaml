source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: vi
  text: 'thì các con hãy thưa rằng: “Các đầy tớ của bệ hạ đã làm nghề chăn nuôi từ thuở niên thiếu cho đến bây giờ, cả chúng con lẫn tổ phụ chúng con,” để các con có thể ở trong miền Gô-sen, vì người Ai Cập ghê tởm mọi người chăn chiên.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “vì mọi người chăn chiên đều là điều ghê tởm đối với người Ai Cập.”'
    reason: Cách dịch sát cấu trúc danh từ của tiếng Hê-bơ-rơ, trong đó người chăn chiên được gọi là “điều ghê tởm” đối với người Ai Cập.
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: thì các con hãy thưa rằng
  rationale: Liên từ với thể hoàn thành tiếp nối lời chỉ dẫn trước đó; “thì… hãy thưa” diễn đạt tự nhiên trình tự và sắc thái chỉ dẫn. “Thưa” phù hợp lời nói với Pha-ra-ôn.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: làm nghề chăn nuôi
  rationale: Cụm Hê-bơ-rơ chỉ những người sinh sống bằng việc chăm nuôi gia súc; cách dịch này tự nhiên trong tiếng Việt và không thu hẹp vào riêng bò hay chiên.
- source_word: עֲבָדֶיךָ
  choice: các đầy tớ của bệ hạ
  rationale: Đây là lối tự xưng khiêm nhường trước quân vương, không nhất thiết nói đến thân phận nô lệ. “Bệ hạ” làm rõ đối tượng là Pha-ra-ôn.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: từ thuở niên thiếu cho đến bây giờ
  rationale: Giữ nguyên khoảng thời gian kéo dài từ tuổi trẻ đến hiện tại với văn phong trang trọng, dễ hiểu.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: cả chúng con lẫn tổ phụ chúng con
  rationale: Cấu trúc “cả… lẫn…” phản ánh hai lần גַּם và nhấn mạnh nghề nghiệp liên tục qua các thế hệ; “tổ phụ” phù hợp ngữ cảnh gia tộc.
- source_word: בַּעֲבוּר תֵּשְׁבוּ
  choice: Như vậy, các con sẽ được cư ngụ
  rationale: בַּעֲבוּר nêu mục đích hoặc kết quả của lời dặn. Dạng “sẽ được cư ngụ” diễn đạt việc họ có thể được cho phép định cư tại Gô-sen mà không áp đặt quá mức một sắc thái duy nhất.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: trong miền Gô-sen
  rationale: “Miền” chuyển tải אֶרֶץ trong nghĩa một khu vực lãnh thổ và tự nhiên hơn “đất” trong tiếng Việt hiện đại ở đây.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: người Ai Cập ghê tởm
  rationale: Chuyển cấu trúc danh từ “điều ghê tởm đối với Ai Cập” thành vị ngữ tự nhiên trong tiếng Việt, đồng thời giữ cường độ tiêu cực mạnh của תוֹעֵבָה.
- source_word: כָּל רֹעֵה צֹאן
  choice: mọi người chăn chiên
  rationale: Giữ rõ thành tố צֹאן, chỉ đàn vật nuôi nhỏ, đặc biệt chiên; “người chăn chiên” là cách nói tự nhiên và quen thuộc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” trong lời Giô-sép căn dặn anh em, “chúng con” và “bệ hạ” trong lời dự kiến thưa với Pha-ra-ôn. Dấu chân chú thích [a] được đặt ngay sau mệnh đề liên quan.
