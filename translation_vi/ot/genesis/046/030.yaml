base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: vi
  text: 'Bấy giờ, Israel nói với Giô-sép: “Giờ đây cha có thể chết được rồi, vì cha đã thấy mặt con—con vẫn còn sống.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát trật tự câu hơn: “Giờ đây cha có thể chết, sau khi đã thấy mặt con, vì con vẫn còn sống.” Câu Hê-bơ-rơ cô đọng; động từ ở đây diễn tả lời bộc lộ sự sẵn sàng hoặc thỏa lòng trước cái chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Bấy giờ” tự nhiên trong văn kể tiếng Việt và giữ sắc thái tuần tự.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Giữ đúng tên được bản Hê-bơ-rơ dùng tại đây, không đổi thành Gia-cốp.
- source_word: אֶל יוֹסֵף
  choice: với Giô-sép
  rationale: Trong cấu trúc chỉ người tiếp nhận lời nói, “nói với Giô-sép” là cách diễn đạt tự nhiên bằng tiếng Việt.
- source_word: אָמ֣וּתָה הַפָּעַם
  choice: Giờ đây cha có thể chết được rồi
  rationale: Dạng cohortative diễn tả sự sẵn lòng hoặc thanh thản trước cái chết trong hoàn cảnh này, không nhất thiết là lời xin phép “hãy để cha chết.” “Giờ đây ... được rồi” chuyển tải sắc thái mãn nguyện gắn với thời điểm hiện tại.
- source_word: אַחֲרֵי רְאוֹתִי אֶת־פָּנֶיךָ
  choice: vì cha đã thấy mặt con
  rationale: Cụm nguyên ngữ có nghĩa hình thức là “sau khi cha thấy mặt con,” nhưng trong ngữ cảnh mang quan hệ thời gian-nguyên nhân. Giữ hình ảnh cụ thể “mặt con.”
- source_word: כִּי
  choice: và biết rằng
  rationale: כִּי có thể được hiểu là “vì/rằng”; ở đây việc thấy mặt Giô-sép xác nhận rằng ông còn sống. Thêm “biết” làm rõ hàm ý trong tiếng Việt tự nhiên, nhưng cách dịch sát hình thức hơn được ghi ở chú thích.
- source_word: עוֹדְךָ חָי
  choice: con vẫn còn sống
  rationale: עוֹד với hậu tố đại từ và חָי diễn tả sự tiếp tục tồn tại; “vẫn còn sống” là cách nói hiện đại, rõ ràng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “cha—con” được dùng theo quan hệ giữa Israel và Giô-sép; đây là thông tin vốn có trong ngữ cảnh, đồng thời tạo lời thoại tự nhiên trong tiếng Việt. Tên “Israel” được giữ theo nguyên văn; “Giô-sép” theo dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
