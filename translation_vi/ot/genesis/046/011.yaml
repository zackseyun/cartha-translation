  language: vi
  text: Và các con trai của Lê-vi là Ghẹt-sôn, Kê-hát và Mê-ra-ri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Và các con trai của
  rationale: Giữ liên từ ו để thể hiện sự tiếp nối của danh sách gia phả; בְנֵי là danh từ số nhiều ở dạng liên kết, chỉ rõ các con trai.
- source_word: לֵוִי
  choice: Lê-vi
  rationale: Tên riêng được phiên âm theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: גֵּרְשׁוֹן
  choice: Ghẹt-sôn
  rationale: Phiên âm tên גֵּרְשׁוֹן theo hình thức quen thuộc trong Kinh Thánh tiếng Việt, đồng thời phân biệt với tên Ghẹt-sôm.
- source_word: קְהָת
  choice: Kê-hát
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc và dễ đọc đối với độc giả tiếng Việt.
- source_word: וּ/מְרָרִי
  choice: và Mê-ra-ri
  rationale: Giữ liên từ ו trước tên cuối trong chuỗi liệt kê; tên riêng được phiên âm theo cách dùng quen thuộc trong tiếng Việt.
