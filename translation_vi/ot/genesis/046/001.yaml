revisions:
- from: Ít-ra-ên lên đường, đem theo mọi người và mọi thứ thuộc về mình. Khi đến Bê-e Sê-ba, ông dâng sinh tế lên Đức Chúa Trời của I-sác, cha mình.
  to: Ít-ra-ên lên đường cùng tất cả những gì thuộc về mình, đến Bê-e Sê-ba và dâng các sinh tế lên Đức Chúa Trời của cha mình là I-sác.
  rationale: Sửa nhẹ để không diễn giải cụm bao quát “tất cả những gì thuộc về mình” thành một danh mục “mọi người và mọi thứ,” làm rõ I-sác là cha của Ít-ra-ên, và biểu thị số nhiều của “các sinh tế.” Trình tự lên đường, đến Bê-e Sê-ba, rồi dâng tế lễ được giữ nguyên.
  reviewer_model: gpt-5.6-terra
