base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: vi
  text: Ít-ra-ên lên đường cùng tất cả những gì thuộc về mình, đến Bê-e Sê-ba và dâng các sinh tế lên Đức Chúa Trời của cha mình là I-sác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: lên đường
  rationale: Động từ נסע trong văn kể chuyện thường chỉ việc nhổ trại và bắt đầu hành trình; “lên đường” tự nhiên và giữ đúng sắc thái khởi hành.
- source_word: יִשְׂרָאֵל
  choice: Ít-ra-ên
  rationale: Giữ nguyên tên Ít-ra-ên được bản Hê-bơ-rơ dùng, không đổi thành Gia-cốp.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: đem theo mọi người và mọi thứ thuộc về mình
  rationale: Cụm từ có phạm vi rộng, có thể bao gồm cả người trong gia quyến lẫn tài sản; cách diễn đạt này tránh thu hẹp nghĩa vào của cải vật chất.
- source_word: וַיָּבֹא בְּאֵרָה שָּׁבַע
  choice: Khi đến Bê-e Sê-ba
  rationale: בוא được dịch tự nhiên là “đến”; hậu tố chỉ hướng được thể hiện qua cấu trúc “đến Bê-e Sê-ba”.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: ông dâng sinh tế
  rationale: Cấu trúc đồng căn giữa động từ và danh từ được chuyển thành lối nói tiếng Việt tự nhiên về hành vi tế lễ.
- source_word: לֵאלֹהֵי אָבִיו יִצְחָק
  choice: lên Đức Chúa Trời của I-sác, cha mình
  rationale: Giới từ ל chỉ Đấng tiếp nhận lễ vật; cách sắp xếp này xác định rõ I-sác là cha của Ít-ra-ên và giữ nguyên danh xưng cụ thể trong nguyên văn.
theological_decisions:
- issue: Danh xưng “Đức Chúa Trời của I-sác, cha mình” thay vì công thức rộng hơn về các tổ phụ
  choice: Giữ riêng tên I-sác đúng như nguyên văn
  alternative: Đức Chúa Trời của các tổ phụ mình
  rationale: Bản Hê-bơ-rơ nêu đích danh I-sác, nhấn mạnh sự tiếp nối với người cha trực tiếp của Ít-ra-ên và mối liên hệ của I-sác với Bê-e Sê-ba; không nên khái quát hóa thành “các tổ phụ”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cách phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt. Diễn giải phạm vi bao quát của וְכָל אֲשֶׁר לוֹ ngay trong câu để tránh một chú thích không tương ứng với vị trí địa danh.
