source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֤ים לְ/יִשְׂרָאֵל֙ בְּ/מַרְאֹ֣ת הַ/לַּ֔יְלָה וַ/יֹּ֖אמֶר יַעֲקֹ֣ב יַעֲקֹ֑ב וַ/יֹּ֖אמֶר הִנֵּֽ/נִי׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: vi
  text: 'Trong những khải tượng ban đêm[a], Đức Chúa Trời phán với Y-sơ-ra-ên: “Gia-cốp, Gia-cốp!” Ông đáp: “Tôi đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong các khải tượng về đêm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán / thưa
  rationale: Động từ אמר có nghĩa cơ bản là “nói”. “Phán” phù hợp khi Đức Chúa Trời là chủ thể, còn “thưa” diễn đạt tự nhiên lời đáp kính trọng của Gia-cốp. Hai lần וַיֹּאמֶר mở đầu lời phán được thể hiện gọn bằng cấu trúc “phán… rằng” trong tiếng Việt.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, אֱלֹהִים chỉ Đức Chúa Trời duy nhất và đi với động từ ở nghĩa số ít.
- source_word: לְיִשְׂרָאֵל
  choice: với Y-sơ-ra-ên
  rationale: Giữ nguyên tên Y-sơ-ra-ên trong lời kể, không đồng nhất hóa với tên Gia-cốp xuất hiện ngay sau đó trong lời gọi.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: trong những khải tượng ban đêm
  rationale: Giữ số nhiều của מַרְאֹת và hoàn cảnh ban đêm; “khải tượng” diễn đạt một sự hiện thấy mang tính mặc khải.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: Gia-cốp! Gia-cốp!
  rationale: Giữ nguyên việc lặp lại tên, thể hiện lời gọi trực tiếp, tha thiết và nhấn mạnh.
- source_word: הִנֵּנִי
  choice: Con đây
  rationale: Đây là lời đáp theo công thức, biểu thị sự hiện diện và sẵn sàng. “Con đây” tự nhiên trong tiếng Việt khi một người đáp lời Đức Chúa Trời, dù đại từ xưng hô không được biểu thị riêng trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Sự luân phiên giữa hai tên Y-sơ-ra-ên và Gia-cốp
  choice: Giữ “Y-sơ-ra-ên” trong lời kể và “Gia-cốp” trong lời Đức Chúa Trời gọi
  alternative: Dùng chỉ một tên xuyên suốt câu để tạo sự nhất quán
  rationale: Bản Hê-bơ-rơ chủ ý dùng hai tên khác nhau. Bản dịch giữ nguyên sự chuyển đổi này mà không áp đặt một cách giải thích thần học.
- issue: Đại từ trong lời đáp הִנֵּנִי
  choice: Con đây
  alternative: Tôi đây / Có tôi đây
  rationale: Tiếng Hê-bơ-rơ không mã hóa quan hệ xưng hô trong từ này, nhưng tiếng Việt cần một cách đáp tự nhiên. “Con đây” phản ánh ngữ cảnh con người kính cẩn đáp lời Đức Chúa Trời, không thêm một khẳng định giáo lý riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán… rằng” để truyền đạt tự nhiên hai động từ mở lời liên tiếp trong tiếng Hê-bơ-rơ; dùng dấu chấm than cho lời gọi lặp tên, phù hợp ngữ điệu tiếng Việt.
