base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: vi
  text: Sau đó, Gia-cốp rời Bê-e Sê-ba[a], và các con trai của Y-sơ-ra-ên đưa Gia-cốp, cha mình, cùng các con nhỏ và những người vợ của họ lên những cỗ xe mà Pha-ra-ôn đã sai để chở ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đứng dậy từ Bê-e Sê-ba”; trong ngữ cảnh hành trình, cách nói này có nghĩa là rời nơi ấy để lên đường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: rời
  rationale: Trong ngữ cảnh khởi hành, động từ mang nghĩa đen “đứng dậy” được dùng theo lối nói chỉ việc lên đường; “rời” diễn đạt tự nhiên và giữ rõ điểm xuất phát.
- source_word: מִבְּאֵר שָׁבַע
  choice: Bê-e Sê-ba
  rationale: Phiên âm địa danh Hê-bơ-rơ theo lối quen thuộc trong Kinh Thánh tiếng Việt; tiền tố מִן được thể hiện qua động từ “rời”.
- source_word: וַיִּשְׂאוּ
  choice: đưa ... lên những cỗ xe ... để chở
  rationale: נשׂא có nghĩa là mang hoặc chở. Cách diễn đạt này phù hợp với việc đưa người đi bằng xe và tự nhiên trong tiếng Việt.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: các con trai của Y-sơ-ra-ên
  rationale: Trong ngữ cảnh trực tiếp, cụm từ chỉ các con trai của Gia-cốp chứ chưa phải toàn thể dân tộc; bản dịch giữ rõ giới tính và quan hệ gia đình.
- source_word: אֲבִיהֶם
  choice: cha mình là Gia-cốp
  rationale: Diễn đạt quan hệ sở hữu một cách tự nhiên, đồng thời giữ tên Gia-cốp có trong nguyên văn.
- source_word: טַפָּם
  choice: con nhỏ
  rationale: טַף đặc biệt chỉ trẻ nhỏ trong gia đình hoặc đoàn người; “con nhỏ” tự nhiên hơn “những đứa bé” và giữ được sắc thái tuổi nhỏ.
- source_word: נְשֵׁיהֶם
  choice: vợ của họ
  rationale: Trong bối cảnh gia đình, נָשִׁים rõ ràng chỉ các bà vợ.
- source_word: בָּעֲגָלוֹת
  choice: lên những cỗ xe
  rationale: עֲגָלוֹת là các xe dùng chuyên chở. Tiếng Việt tự nhiên nói đưa người “lên xe”; “cỗ xe” phù hợp bối cảnh cổ đại.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: mà Pha-ra-ôn đã sai đến
  rationale: “Đã” thể hiện hành động sai xe đi xảy ra trước cuộc khởi hành; “đến” làm rõ xe được phái tới mà không thay đổi nội dung.
- source_word: לָשֵׂאת אֹתוֹ
  choice: để chở ông
  rationale: Đây là cấu trúc chỉ mục đích; đại từ số ít giống đực tự nhiên nhất quy chiếu về Gia-cốp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng phiên âm quen thuộc Gia-cốp, Y-sơ-ra-ên, Bê-e Sê-ba và Pha-ra-ôn. Câu được sắp xếp để tránh lặp nặng nề nhưng vẫn giữ đầy đủ các thành phần và quan hệ trong nguyên văn.
