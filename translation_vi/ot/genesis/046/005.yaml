revisions:
- from: Rồi Gia-cốp rời Bê-e Sê-ba[a]. Các con trai của Y-sơ-ra-ên đưa cha mình là Gia-cốp, cùng con nhỏ và vợ của họ, lên những cỗ xe mà Pha-ra-ôn đã sai đến để chở ông.
