  text: וּ/בְנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְ/יִשְׁוָ֛ה וְ/יִשְׁוִ֥י וּ/בְרִיעָ֖ה וְ/שֶׂ֣רַח אֲחֹתָ֑/ם וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: vi
  text: Các con trai của A-se là Yim-na[a], Yít-va, Yít-vi và Bê-ri-a; Sê-rách[b] là chị hoặc em gái của họ. Các con trai của Bê-ri-a là Khê-ve và Man-ki-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yim-na cũng thường được phiên âm là Jim-na trong một số bản Kinh Thánh tiếng Việt.
    reason: lexical_alternative
  - marker: b
    text: Sê-rách cũng có thể được phiên âm là Sê-ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: Các con trai của A-se
  rationale: בְנֵי là dạng số nhiều liên kết của “con trai”. Trong gia phả, “các con trai của” vừa chính xác vừa tự nhiên; liên từ וּ đầu câu không cần được dịch riêng trong tiếng Việt.
- source_word: יִמְנָה
  choice: Yim-na
  rationale: Phiên âm trực tiếp tên riêng Hê-bơ-rơ, giữ phụ âm yod đầu tên thay vì phụ thuộc vào dạng tên truyền qua tiếng Anh.
- source_word: וְיִשְׁוָה
  choice: Yít-va
  rationale: Phiên âm tên riêng từ Hê-bơ-rơ; liên từ được thể hiện tự nhiên qua cấu trúc liệt kê tiếng Việt.
- source_word: וְיִשְׁוִי
  choice: Yít-vi
  rationale: Phiên âm tên riêng từ Hê-bơ-rơ, đồng thời phân biệt rõ với Yít-va.
- source_word: וּבְרִיעָה
  choice: và Bê-ri-a
  rationale: Giữ tên riêng bằng phiên âm và dùng “và” trước phần tử cuối của danh sách theo cú pháp tiếng Việt.
- source_word: וְשֶׂרַח
  choice: Sê-rách
  rationale: Phiên âm tên nữ theo âm Hê-bơ-rơ; âm cuối ח được biểu thị bằng “ch”.
- source_word: אֲחֹתָם
  choice: là người chị hay em gái của họ
  rationale: Danh từ Hê-bơ-rơ chỉ quan hệ “chị/em gái” nhưng không xác định tuổi tương đối. Cách dịch này làm câu tự nhiên mà không áp đặt Sê-rách lớn hay nhỏ tuổi hơn các anh em nam.
- source_word: וּבְנֵי בְרִיעָה
  choice: Các con trai của Bê-ri-a
  rationale: Mở đầu tiểu mục gia phả mới bằng một câu riêng; không cần dịch máy móc liên từ đầu cụm.
- source_word: חֶבֶר
  choice: Khê-ve
  rationale: 'Phiên âm theo Hê-bơ-rơ: ח được biểu thị gần đúng bằng “kh”, còn ב không có dagesh được phản ánh bằng “v”.'
- source_word: וּמַלְכִּיאֵל
  choice: và Man-ki-ên
  rationale: Phiên âm tên riêng theo cách đọc dễ tiếp nhận trong tiếng Việt; liên từ וּ được dịch là “và” để nối hai tên.
theological_decisions:
- issue: Tuổi tương đối của Sê-rách so với các con trai của A-se
  choice: người chị hay em gái của họ
  alternative: em gái của họ
  rationale: אֲחוֹת không cho biết người nữ lớn hay nhỏ tuổi hơn các anh em nam. Dịch riêng là “em gái” sẽ bổ sung một chi tiết không có trong nguyên văn.
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và dễ đọc. Tên riêng được phiên âm ưu tiên theo nguồn Hê-bơ-rơ, có gạch nối để người đọc tiếng Việt dễ nhận diện âm tiết. Cấu trúc “chị hay em gái” được dùng vì tiếng Việt không có một danh từ số ít thông dụng tương ứng hoàn toàn với אֲחוֹת mà không xác định tuổi tương đối.
