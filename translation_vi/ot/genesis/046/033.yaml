  yaml_path: translation/ot/genesis/046/033.yaml
  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: vi
  text: 'Khi Pha-ra-ôn gọi các con đến và nói: “Các con làm nghề gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Khi
  rationale: Thành ngữ Hê-bơ-rơ này mở đầu một tình huống tương lai; “Khi” tự nhiên trong tiếng Việt và giữ đúng sắc thái thời gian.
- source_word: יִקְרָא לָכֶם
  choice: gọi các con đến
  rationale: Động từ קרא đi với ל trong bối cảnh này mang nghĩa gọi hoặc triệu đến. “Gọi ... đến” phù hợp bối cảnh cung đình mà không làm câu quá trang trọng.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm danh hiệu vua Ai Cập quen thuộc trong tiếng Việt.
- source_word: וְאָמַר
  choice: và hỏi
  rationale: Nghĩa đen là “và nói”, nhưng lời tiếp theo có hình thức câu hỏi; “và hỏi” là cách diễn đạt tự nhiên, minh bạch trong tiếng Việt mà không thay đổi nội dung.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Các con làm nghề gì?
  rationale: מַעֲשֵׂיכֶם chỉ công việc hay nghề nghiệp của họ. Cấu trúc “làm nghề gì” là cách hỏi tự nhiên, hiện đại trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “các con” theo quan hệ của Gia-cốp với các con trai trong lời dặn trực tiếp; câu hỏi được diễn đạt tự nhiên trong tiếng Việt.
