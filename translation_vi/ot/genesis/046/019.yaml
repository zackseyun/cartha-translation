  register: Văn phong hiện đại, trang trọng và dễ hiểu. Thêm từ “là” để câu liệt kê tự nhiên trong tiếng Việt mà không làm thay đổi nội dung; giữ “con trai” nhằm phản ánh chính xác từ Hê-bơ-rơ.
