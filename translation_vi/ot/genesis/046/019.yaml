  yaml_path: translation/ot/genesis/046/019.yaml
  text: 'The sons of Rachel, Jacob’s wife: Joseph and Benjamin.'
translation:
  language: vi
  text: Các con trai của Ra-chên, vợ Gia-cốp, là Giô-sép và Bên-gia-min.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Đây là dạng số nhiều liên kết của từ “con trai”. Trong danh sách gia phả này, cụm từ chỉ trực tiếp hai người con trai của Ra-chên, nên không mở rộng thành “con cháu”.
- source_word: רָחֵל
  choice: Ra-chên
  rationale: Tên riêng được phiên âm theo lối quen dùng trong tiếng Việt Kinh Thánh.
- source_word: אֵשֶׁת
  choice: vợ
  rationale: Trong cấu trúc liên kết với tên Gia-cốp, từ này mang nghĩa quan hệ hôn nhân là “vợ”, không chỉ nghĩa chung là “người phụ nữ”.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Tên riêng được phiên âm theo lối quen dùng trong tiếng Việt Kinh Thánh; quan hệ sở thuộc được thể hiện tự nhiên bằng cụm “vợ Gia-cốp”.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Tên riêng được phiên âm theo lối quen dùng trong tiếng Việt Kinh Thánh.
- source_word: וּ/בִנְיָמִן
  choice: và Bên-gia-min
  rationale: Liên từ đơn giản nối tên người con trai thứ hai trong danh sách.
