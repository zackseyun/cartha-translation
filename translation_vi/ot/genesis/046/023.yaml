  text: 'Và các con trai của Đan: Hu-sim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ rất cô đọng, sát nghĩa là: “Và các con trai của Đan: Hu-sim.” Dù “các con trai” ở số nhiều, Hu-sim là tên riêng và trong gia phả này được kể là hậu duệ duy nhất của Đan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: בְנֵי là dạng số nhiều liên kết của “con trai”, phù hợp với lối liệt kê gia phả. Liên từ וּ nối tiếp danh sách; trong tiếng Việt, dấu câu và cấu trúc liệt kê đã thể hiện tự nhiên sự tiếp nối nên không cần thêm “và” ở đầu câu.
- source_word: דָן
  choice: Đan
  rationale: Tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: חֻשִׁים
  choice: Hu-sim
  rationale: Tên riêng được phiên âm sang tiếng Việt. Dù hình thức từ trông như số nhiều, trong câu này nó chỉ một người; bản dịch giữ nguyên lối nói ngắn gọn, không thêm động từ hoặc lời giải thích vào chính văn.
