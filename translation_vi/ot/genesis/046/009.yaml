base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/009.yaml
  text: 'And the sons of Reuben: Hanoch[a], Pallu, Hezron, and Carmi.'
translation:
  language: vi
  text: 'Và các con trai của Ru-bên là: Ha-nóc[a], Pha-lu, Hết-rôn và Cạt-mi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: Ha-nóc; tên này theo truyền thống cũng được phiên âm là Hê-nóc trong một số bản dịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Các con trai của ... là
  rationale: בְנֵי là dạng số nhiều liên kết, nghĩa là “các con trai của”. Trong mạch gia phả tiếng Việt, cấu trúc “Các con trai của ... là” tự nhiên và rõ ràng; liên từ וּ được thể hiện qua sự tiếp nối của danh sách, không cần dịch máy móc thành “và” ở đầu câu.
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, đồng thời gần với âm của tên Hê-bơ-rơ.
- source_word: חֲנוֹךְ
  choice: Ha-nóc
  rationale: Phiên âm trực tiếp tên Hê-bơ-rơ Ḥănôḵ theo lối dễ đọc trong tiếng Việt; tránh đồng nhất âm thầm với dạng tên truyền thống “Hê-nóc” mà không chú thích.
- source_word: וּ/פַלּוּא
  choice: Pha-lu
  rationale: Phiên âm tên פַלּוּא theo quy ước tên riêng Kinh Thánh quen thuộc trong tiếng Việt; liên từ đi kèm được thể hiện bằng cấu trúc liệt kê.
- source_word: וְ/חֶצְרוֹן
  choice: Hết-rôn
  rationale: Phiên âm gần dạng Hê-bơ-rơ Ḥeṣrôn và phù hợp cách đọc tiếng Việt; liên từ được hấp thụ vào cấu trúc liệt kê.
- source_word: וְ/כַרְמִי
  choice: Cạt-mi
  rationale: Phiên âm tên כַרְמִי theo lối dễ đọc và quen thuộc trong tiếng Việt; וְ được dịch bằng “và” trước tên cuối danh sách.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. Giữ cấu trúc liệt kê của nguyên văn nhưng không đưa liên từ đầu câu vào một cách gượng ép. Các tên riêng được phiên âm có gạch nối để người đọc phổ thông dễ đọc.
