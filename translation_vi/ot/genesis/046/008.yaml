base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: vi
  text: Đây là tên của các con trai của Y-sơ-ra-ên đã đến Ai Cập—Gia-cốp và các con trai ông.[a] Con trưởng của Gia-cốp là Ru-bên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm này cũng có thể hiểu là: “những người đã đến Ai Cập, gồm Gia-cốp và các con trai ông.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Cách mở đầu tự nhiên trong tiếng Việt hiện đại; không thêm từ chỉ thời gian như “bây giờ”, vì nguyên ngữ chỉ có liên từ nối tiếp và đại từ chỉ định.
- source_word: שְׁמוֹת
  choice: tên
  rationale: Dạng số nhiều ở trạng thái liên kết, dùng để mở đầu danh sách gia phả.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Y-sơ-ra-ên
  rationale: Giữ nghĩa chỉ nam giới của בְּנֵי trong văn cảnh đang liệt kê các con trai; giữ Y-sơ-ra-ên là tên riêng của Gia-cốp.
- source_word: הַבָּאִים מִצְרַיְמָה
  choice: đã đến Ai Cập
  rationale: Phân từ có mạo từ mô tả những người đã đến; hậu tố chỉ hướng trong מִצְרַיְמָה được diễn đạt tự nhiên bằng “đến Ai Cập”.
- source_word: יַעֲקֹב וּבָנָיו
  choice: Gia-cốp và các con trai ông
  rationale: Giữ nguyên cụm đồng vị của bản Hê-bơ-rơ, không tự ý lược bỏ Gia-cốp hoặc đổi thành một cấu trúc giải thích hẹp hơn.
- source_word: בְּכֹר יַעֲקֹב
  choice: Con trưởng nam của Gia-cốp
  rationale: Diễn đạt rõ địa vị theo thứ tự sinh; “trưởng nam” tự nhiên và chính xác trong ngữ cảnh gia phả.
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Quan hệ cú pháp của יַעֲקֹב וּבָנָיו với cụm đứng trước
  choice: Giữ cụm này dưới dạng đồng vị sau dấu gạch ngang
  alternative: Diễn giải là “đã đến Ai Cập cùng với Gia-cốp”
  rationale: Nguyên ngữ đặt “Gia-cốp và các con trai ông” cạnh cụm “các con trai của Y-sơ-ra-ên đã đến Ai Cập”, tạo một cấu trúc nén và có phần căng về mặt diễn đạt. Bản dịch chính giữ cấu trúc ấy, còn chú thích nêu cách hiểu cú pháp tự nhiên hơn mà không áp đặt vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc Y-sơ-ra-ên, Gia-cốp và Ru-bên. Dấu gạch ngang giúp thể hiện cụm đồng vị cô đọng của nguyên ngữ mà không biến nó thành một lời giải thích quá mức.
