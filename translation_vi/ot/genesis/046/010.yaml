base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: vi
  text: Các con trai của Si-mê-ôn là Giê-mu-ên, Gia-min, Ô-hát, Gia-kin, Xô-ha và Sau-lơ[a], con trai của người phụ nữ Ca-na-an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: Shaul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Các con trai của Si-mê-ôn là
  rationale: Cụm danh từ sở hữu mở đầu mục kế tiếp trong gia phả. Từ “là” được thêm theo cú pháp tiếng Việt để dẫn vào danh sách tên; liên từ וּ được thể hiện qua sự tiếp nối tự nhiên của danh sách.
- source_word: יְמוּאֵל
  choice: Giê-mu-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết quen thuộc, dễ đọc trong tiếng Việt.
- source_word: וְיָמִין
  choice: Gia-min
  rationale: Phiên âm tên riêng và giữ vai trò của וְ trong chuỗi liệt kê bằng cấu trúc liệt kê tiếng Việt.
- source_word: וְאֹהַד
  choice: Ô-hát
  rationale: Phiên âm gần âm dạng tên Hê-bơ-rơ, đồng thời phù hợp quy ước ghi tên Kinh Thánh bằng tiếng Việt.
- source_word: וְיָכִין
  choice: Gia-kin
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong tiếng Việt.
- source_word: וְצֹחַר
  choice: Xô-ha
  rationale: Phiên âm trực tiếp tên riêng Hê-bơ-rơ צֹחַר theo cách dễ đọc đối với độc giả Việt.
- source_word: וְשָׁאוּל
  choice: và Sau-lơ[a]
  rationale: “Sau-lơ” là dạng tên quen thuộc trong tiếng Việt; chú thích bảo lưu dạng phiên âm sát hơn với tên Hê-bơ-rơ Shaul.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: con trai của người phụ nữ Ca-na-an
  rationale: Danh từ chỉ dân tộc ở giống cái số ít nói rõ đây là một phụ nữ Ca-na-an. Cách diễn đạt này tự nhiên và tránh làm mất dấu giới tính được nêu trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và dễ hiểu. Tên riêng được trình bày theo các dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt; riêng Shaul được ghi chú để người đọc thấy rõ dạng Hê-bơ-rơ.
