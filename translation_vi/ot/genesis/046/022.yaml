  source_fidelity: Bản nháp truyền đạt đúng câu tổng kết, quan hệ Ra-chên–Gia-cốp và con số mười bốn. Tuy nhiên, mệnh đề quan hệ hiện tại có thể khiến “các con trai” bị hiểu là chủ thể của động từ “đã sinh”, trái với tiếng Hê-bơ-rơ, nơi các con trai là đối tượng của động từ bị động và Ra-chên là mẹ.
  naturalness: Cần nêu rõ chủ thể “bà” trong mệnh đề quan hệ để câu tiếng Việt tự nhiên, minh bạch và không tạo cách hiểu phi lý.
  terminology: “Các con trai”, “Ra-chên”, “Gia-cốp” và “tổng cộng ... người” phù hợp với bản gốc, đăng ký văn phong và cách gọi tên của bản nháp. Chú thích nên phản ánh sát hơn cấu trúc liệt kê của tiếng Hê-bơ-rơ, không thêm từ liên kết “là” như thể có mặt trong nguyên văn.
