translation:
  language: vi
  text: Đó là các con trai của Ra-chên mà bà đã sinh cho Gia-cốp, tổng cộng mười bốn người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “tất cả người/sinh mạng, mười bốn”, một thành ngữ cho biết tổng số người là mười bốn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Dùng lối chỉ hồi chiếu tự nhiên trong tiếng Việt để tổng kết danh sách vừa nêu; phù hợp mạch kể quá khứ hơn cách dịch cứng là “Đây là”.
- source_word: בְּנֵי רָחֵל
  choice: các con trai của Ra-chên
  rationale: Giữ nghĩa trực tiếp của בְּנֵי là “các con trai”, thay vì mở rộng thành “con cái” hay “hậu duệ”.
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: đã sinh cho Gia-cốp
  rationale: Trong tiếng Việt, cấu trúc chủ động “Ra-chên đã sinh cho Gia-cốp” tự nhiên và truyền đạt đúng quan hệ cha mẹ của cấu trúc bị động số ít tập hợp trong tiếng Hê-bơ-rơ.
- source_word: כָּל נֶפֶשׁ
  choice: tổng cộng ... người
  rationale: Trong văn cảnh gia phả và kiểm đếm, נֶפֶשׁ chỉ từng người; cách diễn đạt này tự nhiên, tránh khiến “linh hồn” mang hàm ý thần học không được nhấn mạnh ở đây.
- source_word: אַרְבָּעָה עָשָׂר
  choice: mười bốn
  rationale: Chuyển trực tiếp số từ Hê-bơ-rơ sang số đếm tiếng Việt.
