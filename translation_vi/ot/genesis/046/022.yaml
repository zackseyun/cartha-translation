    rationale: Cụm כָּל נֶפֶשׁ אַרְבָּעָה עָשָׂר có dạng “tất cả người/sinh mạng, mười bốn”; từ “là” có thể dùng khi diễn giải nhưng không nên đặt trong phần trích nguyên văn.
  revised_text: Đó là các con trai của Ra-chên mà bà đã sinh cho Gia-cốp, tổng cộng mười bốn người.[a]
