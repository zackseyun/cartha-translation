translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ tên riêng theo dạng Việt hóa quen thuộc. Dấu chú thích [a] được đặt ngay sau mệnh đề tổng số mà nó giải thích.
