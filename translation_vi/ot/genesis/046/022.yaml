    rationale: Theo cú pháp tiếng Việt, chủ ngữ gần nhất là “các con trai”, nên câu có thể bị đọc là các con trai đã sinh. Nguyên văn nói các con trai là những người được sinh cho Gia-cốp; cần quy chiếu rõ hành động sinh về Ra-chên.
  - severity: low
