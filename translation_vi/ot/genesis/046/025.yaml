  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: vi
  text: Đây là các con trai của Bi-la, người được La-ban cho Ra-chên, con gái của La-ban. Bi-la sinh các con trai này cho Gia-cốp; tổng số là bảy người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “tất cả người, bảy”—một thành ngữ chỉ tổng số là bảy người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: Đây là các con trai của Bi-la
  rationale: Giữ cấu trúc giới thiệu của bản Hê-bơ-rơ; בְּנֵי trong danh sách gia phả này chỉ các con trai, còn tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: người được La-ban cho Ra-chên, con gái ông
  rationale: Diễn đạt tự nhiên quan hệ bị động trong tiếng Việt, đồng thời giữ rõ Bi-la là người La-ban trao cho Ra-chên và hậu tố sở hữu trong בִּתּוֹ quy về La-ban.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: Bà sinh những người này cho Gia-cốp
  rationale: Giữ Bi-la làm chủ thể nữ của động từ ילד và bảo tồn công thức gia phả với לְיַעֲקֹב, dù cách nói này trang trọng hơn khẩu ngữ hiện đại.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: tất cả là bảy người
  rationale: נֶפֶשׁ trong ngữ cảnh kiểm đếm chỉ người, không nhấn mạnh một thực thể linh hồn tách khỏi thân thể; cách dịch này truyền đạt thành ngữ và tổng số tự nhiên trong tiếng Việt.
