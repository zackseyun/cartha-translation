    rationale: וַתֵּלֶד có Bi-la làm chủ ngữ và אֶת־אֵלֶּה quy chiếu đến các con trai được liệt kê. «Bi-la sinh các con trai này cho Gia-cốp» tái hiện quan hệ ấy minh bạch hơn.
  - severity: low
    issue: «Ra-chên, con gái ông» có thể được hiểu đúng theo ngữ cảnh, nhưng đại từ «ông» có tham chiếu hơi lỏng.
    rationale: Hậu tố trong בִּתּוֹ chỉ La-ban. «Ra-chên, con gái của La-ban» loại bỏ mọi khả năng mơ hồ.
  - severity: low
    issue: Chú thích «tất cả sinh mạng, bảy» quá sát chữ và không tự nhiên trong tiếng Việt.
    rationale: כָּל־נֶפֶשׁ là lối nói kiểm đếm tập thể; chú thích nên vừa cho biết cách diễn đạt Hê-bơ-rơ vừa giải thích rằng nó chỉ tổng số người.
