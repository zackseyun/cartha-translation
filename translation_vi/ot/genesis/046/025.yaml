translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cho” thay vì “ban cho” để tránh sắc thái tôn giáo không có trong động từ נָתַן; dùng “bà” để nối chủ thể Bi-la tự nhiên trong tiếng Việt. Dấu chú thích được đặt sau cụm từ mà nó giải thích.
