  naturalness: Câu sửa vẫn là tiếng Việt hiện đại, trang trọng và rõ chủ ngữ/đối tượng. “cùng ông” phản ánh tự nhiên cụm đầu, còn “đem họ theo mình” làm rõ hành động đưa toàn bộ nhóm người đi.
  terminology: “Con trai/con gái,” “cháu trai/cháu gái,” và “dòng dõi” phù hợp ngữ cảnh gia phả. Chú thích giữ rõ nghĩa đen đặc thù là con của các con trai, không mở rộng vô căn cứ sang mọi cháu.
