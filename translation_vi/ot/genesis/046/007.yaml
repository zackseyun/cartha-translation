  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: vi
  text: Các con trai và các cháu trai[a] cùng ông, các con gái và các cháu gái[a], cùng toàn thể dòng dõi ông[b]—ông đều đem họ theo mình đến Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của các con trai ông” và “các con gái của các con trai ông.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “toàn thể con cháu ông”; nguyên văn: “toàn thể hạt giống của ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: các con trai
  rationale: Danh từ chỉ các con trai, được phân biệt với “các con gái” ở phần sau của câu.
- source_word: וּבְנֵי בָנָיו
  choice: các cháu trai[a]
  rationale: Nguyên văn là “các con trai của các con trai ông”; “các cháu trai” tự nhiên trong tiếng Việt và giữ đúng quan hệ phả hệ.
- source_word: אִתּוֹ
  choice: theo mình
  rationale: Diễn đạt sự cùng đi với Gia-cốp một cách tự nhiên trong cấu trúc “đem theo mình”.
- source_word: בְּנֹתָיו
  choice: các con gái
  rationale: Chuyển tải trực tiếp hậu duệ nữ, đối ứng với “các con trai”.
- source_word: וּבְנוֹת בָּנָיו
  choice: các cháu gái[a]
  rationale: Nguyên văn là “các con gái của các con trai ông”; “các cháu gái” là cách nói tự nhiên, còn chú thích bảo lưu nét cụ thể của tiếng Hê-bơ-rơ.
- source_word: וְכָל זַרְעוֹ
  choice: và toàn thể dòng dõi mình[b]
  rationale: זֶרַע theo nghĩa tập thể ở đây chỉ toàn bộ hậu duệ; “dòng dõi” trang trọng, dễ hiểu và phù hợp văn cảnh gia tộc.
- source_word: הֵבִיא
  choice: Ông đem
  rationale: Dạng Hiphil của בוא mang nghĩa khiến hoặc đưa đến; “đem” phù hợp với việc Gia-cốp đưa gia đình đến Ai Cập.
- source_word: מִצְרָיְמָה
  choice: đến Ai Cập
  rationale: Hậu tố chỉ hướng biểu thị chuyển động về phía Ai Cập; “đến Ai Cập” là cách diễn đạt tự nhiên và phù hợp văn cảnh họ đã vào xứ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đưa động từ lên đầu câu giúp câu tiếng Việt tự nhiên hơn mà vẫn giữ đầy đủ các nhóm người trong nguyên văn. Dùng “mình” để quy chiếu về chủ ngữ Gia-cốp, tránh lặp “ông” nặng nề.
