  text: וּ/בְנֵ֖י יִשָׂשכָ֑ר תּוֹלָ֥ע וּ/פֻוָּ֖ה וְ/י֥וֹב וְ/שִׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/013.yaml
  text: 'And the sons of Issachar: Tola[a], Puvah, Job[b], and Shimron.'
translation:
  language: vi
  text: Các con trai của Y-sa-ca là Thô-la, Phu-va[a], Gióp[b] và Sim-rôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Phu-va cũng được phiên âm là Phu-a trong một số truyền thống.
    reason: lexical_alternative
  - marker: b
    text: 1 Sử Ký 7:1 chép Gia-súp thay vì Gióp.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Các con trai của ... là
  rationale: בְּנֵי là dạng số nhiều liên kết của “con trai”. Trong gia phả, cách diễn đạt này vừa trực tiếp vừa tự nhiên; ý nối tiếp của וּ được thể hiện qua việc câu tiếp tục danh sách, không cần dịch cứng thành “Và” ở đầu câu.
- source_word: יִשָׂשכָר
  choice: Y-sa-ca
  rationale: Tên riêng được phiên âm theo cách quen thuộc, dễ đọc trong tiếng Việt hiện đại.
- source_word: תּוֹלָע
  choice: Thô-la
  rationale: Tên riêng trong danh sách gia phả, được phiên âm thay vì dịch nghĩa.
- source_word: וּ/פֻוָּה
  choice: Phu-va
  rationale: Cách phiên âm phản ánh dạng Masoret פֻוָּה; biến thể “Phu-a” được ghi ở chú thích.
- source_word: וְ/י֥וֹב
  choice: Gióp
  rationale: Bản Masoret tại đây chép יוֹב, tương ứng với tên Gióp quen thuộc trong tiếng Việt; dị bản tên ở 1 Sử Ký 7:1 được bảo tồn trong chú thích.
- source_word: וְ/שִׁמְרֽוֹן
  choice: và Sim-rôn
  rationale: Tên riêng được phiên âm; liên từ וְ được dịch là “và” trước tên cuối danh sách.
theological_decisions:
- issue: Sự khác biệt về tên người con thứ ba giữa Sáng Thế 46:13 và 1 Sử Ký 7:1
  choice: Giữ “Gióp” trong chính văn
  alternative: Gia-súp
  rationale: Chính văn phải phản ánh cách đọc יוֹב của WLC tại câu này, đồng thời không xóa bỏ sự khác biệt với 1 Sử Ký 7:1; cách đọc kia được nêu trong chú thích.
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. Các tên riêng dùng lối phiên âm có gạch nối để người đọc phổ thông dễ phát âm. Dấu chú thích [a] được đặt sau đúng tên Phu-va mà chú thích đề cập, thay vì sau Thô-la như vị trí không khớp trong lớp tham khảo tiếng Anh.
source_grounding:
  english_pob_role: consult_only
