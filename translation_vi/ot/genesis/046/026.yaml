base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: vi
  text: Tất cả những người[a] thuộc về Gia-cốp đã đến Ai Cập, là hậu duệ ruột thịt của ông[b], không kể vợ của các con trai Gia-cốp, tổng cộng là sáu mươi sáu người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng từ thường có nghĩa là “linh hồn” hoặc “sự sống”; trong ngữ cảnh đếm người, từ này có nghĩa là “người”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những người ra từ đùi ông”, một thành ngữ chỉ các hậu duệ ruột thịt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: Tất cả những người
  rationale: Trong ngữ cảnh gia phả và thống kê, נֶפֶשׁ chỉ từng con người được tính, nên dịch là “người” vừa tự nhiên vừa đúng chức năng của từ trong câu.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: thuộc về Gia-cốp đã đến Ai Cập
  rationale: Giữ sắc thái của לְיַעֲקֹב là những người thuộc về hoặc gắn với Gia-cốp, thay vì mặc nhiên hiểu là họ chỉ đơn thuần cùng đi với ông.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: những người sinh ra từ ông
  rationale: Đây là thành ngữ Hê-bơ-rơ, nghĩa đen là “những người ra từ đùi ông”, dùng để chỉ các hậu duệ ruột thịt. Cách dịch trong câu truyền đạt ý nghĩa tự nhiên, còn nghĩa đen được ghi ở chú thích.
- source_word: מִלְּבַד
  choice: không kể
  rationale: Cụm từ này loại vợ của các con trai Gia-cốp ra khỏi con số sáu mươi sáu.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: vợ của các con trai Gia-cốp
  rationale: Cách diễn đạt rõ ràng, tự nhiên và giữ đúng quan hệ sở thuộc của nguyên văn.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: tổng cộng là sáu mươi sáu người
  rationale: Diễn đạt tự nhiên con số tổng kết, đồng thời dịch נֶפֶשׁ nhất quán là “người” trong ngữ cảnh đếm người.
