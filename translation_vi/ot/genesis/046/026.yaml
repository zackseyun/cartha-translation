  source_fidelity: 'Cần sửa nhẹ cụm “những người sinh ra từ ông”: cách nói này trong tiếng Việt thường gợi những người được chính Gia-cốp sinh ra, trong khi יֹצְאֵי יְרֵכוֹ là thành ngữ chỉ những người xuất thân từ ông, tức hậu duệ theo huyết thống (bao gồm các thế hệ sau). “Thuộc về Gia-cốp đã đến Ai Cập” phản ánh được cấu trúc tiếng Hê-bơ-rơ mà không buộc hiểu là mọi người đều trực tiếp đi cùng ông.'
