  terminology: “Gia súc,” “tài sản,” “đất Ca-na-an,” “Ai Cập,” và “Gia-cốp” đều phù hợp. Dùng “con cháu” cho זַרְעוֹ giữ nghĩa tập thể; chú thích nêu “dòng dõi” như một khả năng từ vựng khác.
