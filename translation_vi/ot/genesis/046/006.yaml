  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: vi
  text: 'Họ đem theo gia súc và tài sản mà họ đã có được trong đất Ca-na-an, rồi đến Ai Cập: Gia-cốp cùng toàn thể con cháu[a] ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “dòng dõi.” Từ Hê-bơ-rơ có thể chỉ con cái, con cháu, hoặc dòng dõi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Họ đem theo
  rationale: Động từ לקח ở thể văn thuật sự có nghĩa là lấy hoặc mang theo; “đem theo” tự nhiên trong ngữ cảnh cả gia đình di cư.
- source_word: מִקְנֵיהֶם
  choice: gia súc
  rationale: מִקְנֶה chỉ chung các loài vật nuôi thuộc sở hữu, nên “gia súc” rộng và phù hợp hơn “bò” hay “đàn vật”.
- source_word: רְכוּשָׁם
  choice: tài sản
  rationale: רְכוּשׁ chỉ của cải hoặc tài sản, nhất là những thứ có thể mang theo; “tài sản” rõ nghĩa và phân biệt với gia súc vừa nêu.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: đã gây dựng được
  rationale: רכש diễn tả việc thu gom hoặc tạo lập tài sản. “Gây dựng được” tự nhiên trong tiếng Việt và cho thấy tài sản ấy có được trước chuyến đi.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: trong đất Ca-na-an
  rationale: Giữ danh từ אֶרֶץ bằng “đất” để bảo tồn cách định danh địa lý cụ thể của nguyên văn.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: rồi đến Ai Cập
  rationale: בוא cùng dạng chỉ hướng của מִצְרַיִם diễn tả việc đi đến Ai Cập; “rồi” chuyển tải mạch kế tiếp của văn thuật sự mà không gượng ép lặp liên từ.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: Gia-cốp cùng toàn thể dòng dõi ông đi với ông
  rationale: זֶרַע ở đây chỉ con cháu thuộc dòng của Gia-cốp. “Dòng dõi” giữ được sắc thái tập thể và chiều nối tiếp thế hệ; phần “đi với ông” diễn đạt rõ אִתּוֹ trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của זֶרַע
  choice: dòng dõi
  alternative: con cháu
  rationale: “Dòng dõi” giữ được nghĩa tập thể của זֶרַע và không giới hạn vào một thế hệ, trong khi văn cảnh vẫn cho thấy đây là những người thân đang cùng Gia-cốp đi đến Ai Cập.
translation_notes:
  register: Văn phong thuật sự hiện đại, trang trọng và dễ hiểu. Dùng “đem theo” và “rồi đến” để câu tiếng Việt trôi chảy, đồng thời giữ trật tự hành động và phần đồng vị nhấn mạnh “Gia-cốp cùng toàn thể dòng dõi ông” của nguyên văn.
