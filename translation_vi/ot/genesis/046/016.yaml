base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: vi
  text: Các con trai của Gát là Xíp-giôn[a], Ha-ghi, Su-ni, Ét-bôn, Ê-ri, A-rô-đi và A-rê-li.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Híp-ri ở đây là צִפְיוֹן (Xíp-giôn); nhiều bản dịch dùng tên Xê-phôn, theo một dạng tên truyền thống khác cũng thấy trong Dân Số 26:15.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: Các con trai của Gát là
  rationale: בְנֵי là dạng số nhiều liên kết của “con trai”; trong gia phả, “các con trai của” vừa trực tiếp vừa tự nhiên. Quan hệ liệt kê do וּ biểu thị được chuyển tự nhiên trong tiếng Việt qua cấu trúc câu tiếp nối, không nhất thiết phải thêm “Và” ở đầu câu.
- source_word: צִפְיוֹן
  choice: Xíp-giôn
  rationale: Phiên âm theo dạng Masoret trong câu này, ṣipyôn/ṣifyôn; “Xíp-giôn” giúp người đọc tiếng Việt nhận ra âm đầu צ và yếu tố yod trong tên.
- source_word: וְחַגִּי
  choice: Ha-ghi
  rationale: Tên riêng חַגִּי được phiên âm gần với dạng Híp-ri và có dấu nối để dễ đọc; liên từ được thể hiện qua cách trình bày danh sách.
- source_word: שׁוּנִי
  choice: Su-ni
  rationale: Phiên âm trực tiếp tên riêng שׁוּנִי theo lối viết tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: וְאֶצְבֹּן
  choice: Ét-bôn
  rationale: Phiên âm tên אֶצְבֹּן, thể hiện hai thành tố âm tiết rõ ràng và giữ phụ âm cuối của âm tiết đầu ở mức tự nhiên đối với tiếng Việt.
- source_word: עֵרִי
  choice: Ê-ri
  rationale: Phiên âm trực tiếp tên riêng עֵרִי.
- source_word: וַאֲרוֹדִי
  choice: A-rô-đi
  rationale: Phiên âm trực tiếp tên riêng אֲרוֹדִי; liên từ đi trước được thể hiện bằng cấu trúc liệt kê.
- source_word: וְאַרְאֵלִי
  choice: A-rê-li
  rationale: Phiên âm trực tiếp tên riêng אַרְאֵלִי; dùng “và” trước mục cuối theo cách liệt kê tự nhiên trong tiếng Việt.
theological_decisions: []
