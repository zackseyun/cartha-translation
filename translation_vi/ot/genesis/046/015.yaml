base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: vi
  text: Đây là các con trai của Lê-a, mà Lê-a đã sinh cho Gia-cốp tại Pha-đan A-ram, cùng với Đi-na, con gái ông. Tổng số con trai và con gái của ông là ba mươi ba người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ, nghĩa đen: “toàn thể số người thuộc các con trai và con gái ông.” Trong ngữ cảnh này, נֶפֶשׁ là cách nói chỉ người, tức tổng số người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: các con trai của Lê-a
  rationale: Giữ nghĩa trực tiếp của danh từ giống đực số nhiều בְּנֵי trong tiêu đề gia phả, thay vì mở rộng thành “các con” hay “hậu duệ”.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: những người bà sinh cho Gia-cốp
  rationale: Động từ יָלַד với chủ ngữ nữ chỉ việc sinh con; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn nêu rõ Lê-a là người mẹ.
- source_word: בְּפַדַּן אֲרָם
  choice: tại Pha-đan A-ram
  rationale: Đây là địa danh, nên được phiên âm thay vì dịch nghĩa suy đoán.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: cùng với Đi-na, con gái ông
  rationale: “Cùng với” thể hiện lực bổ sung của וְאֵת sau tiêu đề nói về các con trai; “ông” quy chiếu tự nhiên về Gia-cốp.
- source_word: כָּל נֶפֶשׁ
  choice: tổng số ... là ... người
  rationale: Trong ngữ cảnh thống kê gia phả, נֶפֶשׁ chỉ người hay nhân khẩu, không phải khái niệm thần học “linh hồn”.
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: các con trai và con gái của ông
  rationale: Giữ nguyên sự phân biệt rõ giữa con trai và con gái trong tiếng Hê-bơ-rơ.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: ba mươi ba
  rationale: Chuyển trực tiếp số từ Hê-bơ-rơ sang cách nói chuẩn trong tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa con số ba mươi ba và danh sách gia phả
  choice: Giữ nguyên con số của bản Hê-bơ-rơ mà không giải thích cách tính trong chính văn
  alternative: Điều chỉnh hoặc diễn giải con số để hòa hợp rõ ràng với từng tên trong danh sách
  rationale: Bản dịch phải bảo tồn dữ liệu và sức căng của văn bản nguồn, không âm thầm giải quyết vấn đề thống kê.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên riêng theo lối phiên âm tiếng Việt quen thuộc. Câu cuối chuyển thành cấu trúc thống kê tự nhiên trong tiếng Việt, đồng thời chú thích thành ngữ Hê-bơ-rơ.
