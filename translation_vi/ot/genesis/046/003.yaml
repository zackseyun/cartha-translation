base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: vi
  text: 'Ngài phán: “Ta là Đức Chúa Trời, Đức Chúa Trời của cha con. Đừng sợ xuống Ai Cập[a], vì tại đó Ta sẽ làm cho con trở thành một dân lớn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng sợ việc đi xuống Ai Cập.” Tiếng Hê-bơ-rơ dùng động từ “sợ” với một động từ nguyên mẫu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Đức Chúa Trời
  rationale: Danh từ có mạo từ xác định, nhấn mạnh căn tính của Đấng đang phán. “Ta là Đức Chúa Trời” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái xác định của nguyên文.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Đức Chúa Trời của cha con
  rationale: Giữ nguyên danh từ số ít “cha” và mối liên hệ tổ phụ trong lời Đức Chúa Trời tự giới thiệu với Gia-cốp.
- source_word: אַל תִּירָא מֵרְדָה
  choice: Đừng sợ phải xuống
  rationale: Diễn đạt tự nhiên cấu trúc phủ định với động từ “sợ” và nguyên mẫu có giới từ; “xuống” giữ hình ảnh địa lý trong tiếng Hê-bơ-rơ.
- source_word: מִצְרַיְמָה
  choice: Ai Cập
  rationale: Hậu tố chỉ hướng diễn tả chuyển động đến Ai Cập; trong tiếng Việt, ý hướng đến đã được thể hiện đầy đủ bởi “xuống Ai Cập”.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימְךָ
  choice: Ta sẽ làm cho con trở thành một dân lớn
  rationale: 'Cấu trúc שׂים với ל mang nghĩa kết quả: Đức Chúa Trời sẽ khiến Gia-cốp và dòng dõi ông trở thành một dân lớn.'
- source_word: שָׁם
  choice: tại đó
  rationale: Chỉ rõ Ai Cập là nơi lời hứa sẽ được thực hiện; “tại đó” trang trọng và tự nhiên.
theological_decisions:
- issue: Danh xưng tổ phụ trong lời Đức Chúa Trời tự giới thiệu
  choice: Đức Chúa Trời của cha con
  alternative: Đức Chúa Trời của các tổ phụ con
  rationale: Nguyên文 dùng số ít “cha của con”; bản dịch giữ nguyên thay vì mở rộng thành số nhiều, qua đó bảo toàn mối liên hệ trực tiếp với tổ phụ được nhắc đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con” phù hợp với lời Đức Chúa Trời phán trực tiếp với Gia-cốp. Dùng “một dân lớn” để giữ cách diễn đạt mang tính giao ước mà không thêm nghĩa “dân tộc” theo quan niệm hiện đại.
