  text: וְ/אֶת יְהוּדָ֞ה שָׁלַ֤ח לְ/פָנָי/ו֙ אֶל יוֹסֵ֔ף לְ/הוֹרֹ֥ת לְ/פָנָ֖י/ו גֹּ֑שְׁנָ/ה וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה גֹּֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: vi
  text: Ông sai Giu-đa đi trước mình đến gặp Giô-sép, để chỉ đường cho ông đến Gô-sen[a]. Rồi họ đến đất Gô-sen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu Hê-bơ-rơ ở đây khá cô đọng. Cũng có thể hiểu là “để chỉ dẫn cho ông về đường đến Gô-sen” hoặc “để nhận chỉ dẫn trước cho ông về đường đến Gô-sen.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: sai
  rationale: Động từ Qal có nghĩa thông thường là sai hoặc phái đi; “sai” tự nhiên và phù hợp với văn kể chuyện.
- source_word: לְפָנָיו
  choice: đi trước mình
  rationale: Trong ngữ cảnh sai một người lên đường trước, thành ngữ này diễn tả việc Giu-đa đi trước Gia-cốp cả về thời gian lẫn không gian.
- source_word: לְהוֹרֹת
  choice: để dẫn đường
  rationale: Dạng Hiphil của ירה có thể mang nghĩa chỉ dẫn, hướng dẫn hoặc chỉ đường. Trong ngữ cảnh di chuyển đến Gô-sen, “dẫn đường” truyền đạt ý nghĩa cụ thể và tự nhiên, đồng thời phần chú thích giữ lại tính cô đọng và đa nghĩa của câu Hê-bơ-rơ.
- source_word: גֹּשְׁנָה
  choice: đến Gô-sen
  rationale: Hậu tố chỉ hướng trên địa danh diễn tả chuyển động hướng đến Gô-sen; tiếng Việt diễn đạt tự nhiên bằng “đến Gô-sen”.
- source_word: וַיָּבֹאוּ
  choice: Rồi họ đến
  rationale: Dịch động từ kể chuyện của בוא theo mạch nối tiếp; “rồi” thể hiện diễn tiến mà không làm câu nặng nề.
- source_word: אַרְצָה גֹּשֶׁן
  choice: đến đất Gô-sen
  rationale: Danh từ אֶרֶץ cùng yếu tố chỉ hướng nói đến lãnh thổ Gô-sen; “đất Gô-sen” giữ được sắc thái địa vực.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: Giu-đa / Giô-sép / Gô-sen
  rationale: Dùng các dạng phiên âm Kinh Thánh quen thuộc và dễ nhận biết trong tiếng Việt hiện đại.
theological_decisions:
- issue: Chủ thể và nội dung của לְהוֹרֹת לְפָנָיו
  choice: Hiểu Giu-đa được sai đi trước để dẫn đường cho Gia-cốp đến Gô-sen, nhưng đánh dấu chú thích.
  alternative: Giu-đa được sai đến Giô-sép để nhận chỉ dẫn hoặc thu xếp trước cho hành trình đến Gô-sen.
  rationale: Cú pháp Hê-bơ-rơ cô đọng, và ירה ở Hiphil có phạm vi nghĩa gồm chỉ dẫn, hướng dẫn. Bản chính theo cách hiểu trực tiếp, tự nhiên, còn chú thích bảo tồn cách hiểu khả dĩ khác mà không giải quyết dứt khoát sự mơ hồ.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “ông” tiếp nối nhân vật Gia-cốp trong ngữ cảnh, còn “mình” làm rõ rằng Giu-đa được sai đi trước chính người sai mình. Câu ngắn, dễ đọc; giữ “đất Gô-sen” để phản ánh sắc thái lãnh thổ của nguyên văn.
