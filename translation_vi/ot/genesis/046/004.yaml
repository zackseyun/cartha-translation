source:
  edition: WLC
  text: אָנֹכִ֗י אֵרֵ֤ד עִמְּ/ךָ֙ מִצְרַ֔יְמָ/ה וְ/אָנֹכִ֖י אַֽעַלְ/ךָ֣ גַם עָלֹ֑ה וְ/יוֹסֵ֕ף יָשִׁ֥ית יָד֖/וֹ עַל עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: vi
  text: Chính Ta sẽ xuống Ai Cập với con, và chính Ta cũng chắc chắn sẽ đưa con lên; Giô-sép sẽ đặt tay mình trên mắt con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói theo cách tự nhiên hơn: “Giô-sép sẽ vuốt mắt cho con,” hàm ý Giô-sép sẽ có mặt khi Gia-cốp qua đời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: chính Ta
  rationale: Đại từ độc lập xuất hiện hai lần để nhấn mạnh chủ thể; “chính Ta” giữ được sắc thái nhấn mạnh và dùng cách xưng hô trang trọng, tự nhiên trong lời Đức Chúa Trời phán với Gia-cốp.
- source_word: אֵרֵד
  choice: sẽ xuống
  rationale: Giữ hình ảnh phương hướng quen thuộc của động từ ירד khi nói về việc đi đến Ai Cập.
- source_word: עִמְּךָ
  choice: với con
  rationale: Diễn đạt trực tiếp giới từ chỉ sự đồng hành cùng hậu tố ngôi hai số ít giống đực.
- source_word: מִצְרַיְמָה
  choice: Ai Cập
  rationale: He chỉ hướng biểu thị chuyển động đến Ai Cập; trong tiếng Việt, ý hướng đến đã được động từ “xuống” và ngữ cảnh thể hiện tự nhiên, không cần thêm “đến”.
- source_word: אַעַלְךָ
  choice: sẽ đưa con lên
  rationale: Dạng Hiphil của עלה mang nghĩa khiến hoặc đưa đi lên; cách dịch này vừa tự nhiên vừa giữ ý nghĩa tác động.
- source_word: גַם עָלֹה
  choice: chắc chắn cũng
  rationale: “Cũng” giữ lực bổ sung của גַם, còn “chắc chắn” thể hiện sự nhấn mạnh của nguyên thể tuyệt đối עָלֹה đi cùng động từ hữu hạn.
- source_word: וְיוֹסֵף
  choice: còn Giô-sép
  rationale: Liên từ chuyển sang mệnh đề kế tiếp được diễn đạt tự nhiên bằng “còn”; tên riêng được phiên âm theo cách dùng tiếng Việt phổ biến.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: sẽ đặt tay mình trên mắt con
  rationale: Giữ hình ảnh cụ thể và giới từ “trên” của tiếng Hê-bơ-rơ, không thay ngay bằng cách giải nghĩa thành hành động nhắm mắt người chết.
theological_decisions:
- issue: Ý nghĩa lời hứa “đưa con lên” khỏi Ai Cập
  choice: 'Giữ lời hứa trực tiếp và rộng nghĩa: “đưa con lên”.'
  alternative: Giải thích cụ thể là đưa thi hài Gia-cốp về Ca-na-an để an táng, hoặc đưa hậu duệ ông ra khỏi Ai Cập trong cuộc xuất hành.
  rationale: Câu Hê-bơ-rơ ngắn gọn, có thể bao hàm việc thi hài Gia-cốp được đưa về chôn cất và/hoặc lời hứa mang tính đại diện dành cho dòng dõi ông. Bản dịch không thu hẹp sự căng thẳng thần học này.
- issue: Hành động của Giô-sép đối với mắt Gia-cốp
  choice: Giữ hình ảnh nguyên văn trong chính văn và giải thích trong chú thích.
  alternative: Dịch trực tiếp theo nghĩa thành ngữ là “Giô-sép sẽ vuốt mắt cho con”.
  rationale: Cách dịch sát hình ảnh bảo tồn lối diễn đạt của nguyên bản, trong khi chú thích giúp độc giả hiểu đây thường được xem là việc Giô-sép hiện diện khi Gia-cốp qua đời và khép mắt cho ông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta–con” phù hợp bối cảnh Đức Chúa Trời phán trực tiếp với Gia-cốp. Giữ cặp động từ phương hướng “xuống… lên” và sự nhấn mạnh lặp lại “chính Ta”.
