  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: vi
  text: 'Các con trai của Sa-bu-lôn là: Sê-rết, Ê-lôn và Gia-lê-ên.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Gia-lê-ên cũng có thể được phiên âm là Yah-lê-ên hoặc Giách-lê-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Các con trai của
  rationale: בְנֵי là dạng số nhiều liên kết của “con trai”; trong gia phả, dịch là “các con trai của” vừa chính xác vừa tự nhiên. Liên từ וּ đánh dấu sự tiếp nối danh sách, nhưng không cần dịch riêng thành “và” ở đầu câu tiếng Việt.
- source_word: זְבוּלֻן
  choice: Sa-bu-lôn
  rationale: Tên riêng được phiên âm theo lối quen thuộc, rõ âm tiết trong tiếng Việt.
- source_word: סֶרֶד
  choice: Sê-rết
  rationale: Phiên âm tên riêng Hê-bơ-rơ סֶרֶד sang tiếng Việt, không dịch nghĩa.
- source_word: וְ/אֵלוֹן
  choice: Ê-lôn
  rationale: Đây là tên người nên được phiên âm, không dịch theo nghĩa danh từ chung có thể là “cây sồi”; liên từ được thể hiện tự nhiên trong chuỗi liệt kê tiếng Việt.
- source_word: וְ/יַחְלְאֵל
  choice: Gia-lê-ên
  rationale: Phiên âm tên riêng יַחְלְאֵל theo cách đọc dễ nhận biết trong tiếng Việt; liên từ וְ được dịch là “và” trước mục cuối danh sách.
