  register: Văn phong gia phả ngắn gọn, trang trọng và dễ hiểu. Dùng dấu hai chấm để dẫn danh sách; không dịch máy móc liên từ mở đầu của câu Hê-bơ-rơ. Dấu chú thích [a] được đặt sau tên mà chú thích giải thích.
