  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ וְ/אֶל בֵּ֣ית אָבִ֔י/ו אֶעֱלֶ֖ה וְ/אַגִּ֣ידָה לְ/פַרְעֹ֑ה וְ/אֹֽמְרָ֣ה אֵלָ֔י/ו אַחַ֧/י וּ/בֵית אָבִ֛/י אֲשֶׁ֥ר בְּ/אֶֽרֶץ כְּנַ֖עַן בָּ֥אוּ אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: vi
  text: 'Rồi Giô-sép nói với các anh em mình và gia đình của cha mình[a]: “Tôi sẽ lên báo với Pha-ra-ôn và nói với người: ‘Các anh em tôi và gia đình của cha tôi, vốn ở xứ Ca-na-an, đã đến với tôi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nhà cha mình”; cụm Hê-bơ-rơ “nhà của cha” ở đây chỉ gia đình hay gia quyến, chứ không chỉ nơi ở.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Dạng waw liên tiếp đưa câu chuyện tiến tới; “Rồi” diễn đạt tự nhiên trình tự trong tiếng Việt.
- source_word: אֶל אֶחָיו
  choice: với các anh em mình
  rationale: Trong ngữ cảnh, từ אַח với hậu tố ngôi ba số ít chỉ những anh em trai của Giô-sép; “các anh em” chính xác và tự nhiên.
- source_word: וְאֶל בֵּית אָבִיו
  choice: và gia đình cha mình
  rationale: בַּיִת trong cấu trúc này chỉ đơn vị gia đình hay gia quyến, không chủ yếu chỉ căn nhà; “gia đình” dễ hiểu trong tiếng Việt hiện đại.
- source_word: אֶעֱלֶה
  choice: Tôi sẽ lên
  rationale: Giữ nghĩa hướng chuyển động thông thường của עלה là “đi lên”; cách nói vẫn tự nhiên trong ngữ cảnh đến yết kiến Pha-ra-ôn.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: trình với Pha-ra-ôn
  rationale: Hiphil của נגד mang nghĩa báo tin hoặc trình báo; “trình với” phù hợp ngữ cảnh cung đình và lối nói kính trọng.
- source_word: וְאֹמְרָה אֵלָיו
  choice: và thưa với người
  rationale: Diễn đạt ý định tiếp theo của Giô-sép; “thưa” hợp lời nói với vua, còn “người” là đại từ kính trọng tự nhiên, không thêm tước hiệu ngoài nguyên văn.
- source_word: אַחַי
  choice: Các anh em tôi
  rationale: Chỉ chính các anh em trai của Giô-sép; cách dịch giữ đúng quan hệ gia đình trong nguồn.
- source_word: וּבֵית אָבִי
  choice: và gia đình cha tôi
  rationale: בֵּית אָבִי ở đây chỉ gia đình thuộc về cha Giô-sép; dịch nhất quán với cụm từ ở đầu câu.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: vốn ở xứ Ca-na-an
  rationale: Mệnh đề Hê-bơ-rơ không có động từ hữu hạn; “vốn ở” thể hiện nơi cư trú trước khi họ đến với Giô-sép mà không diễn giải quá mức.
- source_word: בָּאוּ אֵלַי
  choice: đã đến với tôi
  rationale: Dạng hoàn thành trình bày hành động đã xảy ra; “đã đến” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trình” và “thưa” để phản ánh bối cảnh yết kiến Pha-ra-ôn; dùng “gia đình” thay vì cách nói cổ “nhà cha” trong chính văn, đồng thời giữ phương án sát chữ ở chú thích.
