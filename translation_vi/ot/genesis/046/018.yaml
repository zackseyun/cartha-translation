  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: vi
  text: 'Đó là các con trai của Xinh-pa, người mà La-ban đã ban cho Lê-a, con gái mình; bà đã sinh những người ấy cho Gia-cốp: tất cả là mười sáu người.[a]'
  philosophy: optimal-equivalence
  footnotes:
