    text: 'Dịch sát: “mười sáu linh hồn.” Từ Hê-bơ-rơ nephesh ở đây là cách nói dùng để đếm người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: Đó là các con trai của Xinh-pa
  rationale: אֵלֶּה giới thiệu phần tổng kết danh sách vừa nêu; “đó là” tự nhiên trong tiếng Việt khi hồi chỉ. בְּנֵי được dịch trực tiếp là “các con trai của”, giữ hình thức giống đực của nguyên văn.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: người mà La-ban đã ban cho con gái mình là Lê-a
  rationale: Mệnh đề quan hệ bổ nghĩa cho Xinh-pa. “Ban cho” giữ sắc thái của נָתַן mà vẫn trang trọng, tự nhiên; “con gái mình là Lê-a” làm rõ quan hệ sở hữu vốn được biểu thị bằng hậu tố trong בִתּוֹ.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: bà sinh những người này cho Gia-cốp
  rationale: ילד với chủ thể nữ trong gia phả có nghĩa là sinh con. Đại từ “bà” chỉ Xinh-pa; “những người này” hồi chỉ toàn nhóm đã liệt kê, không thêm một danh loại mà nguyên văn không có.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: tất cả là mười sáu người
  rationale: נֶפֶשׁ trong ngữ cảnh kiểm đếm gia tộc là cách nói chỉ từng người. “Người” truyền đạt đúng nghĩa ngữ cảnh, còn “tất cả là” thể hiện chức năng tổng kết của cụm số lượng.
