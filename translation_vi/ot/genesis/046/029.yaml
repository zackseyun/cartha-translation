translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Chính văn dùng thành ngữ tiếng Việt tự nhiên cho cảnh đoàn tụ, còn chú thích bảo tồn cách diễn đạt cụ thể và sự lặp lại giàu cảm xúc của tiếng Hê-bơ-rơ.
