base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: vi
  text: Giô-sép thắng xe của mình, rồi đi lên Gô-sen để đón cha mình là Y-sơ-ra-ên. Ông đến trước mặt cha, ôm choàng lấy cổ cha và gục trên cổ cha mà khóc hồi lâu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ lặp lại “trên cổ cha”. Từ cuối câu có thể dịch sát là “còn” hoặc “vẫn”; trong ngữ cảnh này, từ ấy nhấn mạnh việc Giô-sép tiếp tục khóc.
    reason: Bảo tồn sự lặp lại của nguyên văn và nêu lựa chọn dịch cho עוֹד mà không làm nặng chính văn.
lexical_decisions:
- source_word: וַיֶּאְסֹר מֶרְכַּבְתּוֹ
  choice: cho thắng cỗ xe của mình
  rationale: Động từ אָסַר cơ bản là “buộc”; khi đi với “xe,” cụm từ chỉ việc thắng xe, chuẩn bị xe để lên đường. Cách dịch này giữ được hình ảnh cụ thể của nguyên văn.
- source_word: וַיַּעַל
  choice: đi lên
  rationale: Giữ nghĩa thông thường của עלה và sắc thái trần thuật của tiếng Hê-bơ-rơ, dù tiếng Việt cũng có thể nói đơn giản là “đi.”
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו
  choice: để đón cha mình là Y-sơ-ra-ên
  rationale: לִקְרַאת diễn tả mục đích đi gặp hoặc đón ai. “Đón” tự nhiên trong cảnh người cha vừa đến, đồng thời giữ tên Y-sơ-ra-ên đúng như nguyên văn.
- source_word: גֹּשְׁנָה
  choice: lên Gô-sen
  rationale: Hậu tố chỉ hướng -ָה cho thấy chuyển động về phía Gô-sen. Kết hợp với “đi lên,” cách diễn đạt này tự nhiên và sát cấu trúc nguồn.
- source_word: וַיֵּרָא אֵלָיו
  choice: hiện ra trước mặt cha
  rationale: Thể Niphal của ראה có thể mang nghĩa “xuất hiện,” “để cho thấy mình” hoặc “trình diện.” Cách dịch giữ nét nghĩa Giô-sép để cha nhìn thấy mình mà không khiến câu quá trang trọng.
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: ôm choàng lấy cổ cha
  rationale: Nghĩa đen là “ngã trên cổ người,” một thành ngữ Hê-bơ-rơ mô tả cái ôm đầy xúc động. Dịch theo ý nghĩa thành ngữ giúp người đọc tiếng Việt hiểu đúng hành động.
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  choice: khóc trên vai cha hồi lâu
  rationale: “Trên vai” là cách diễn đạt tự nhiên trong tiếng Việt cho tư thế ôm cổ mà khóc. עוֹד trong ngữ cảnh biểu thị hành động tiếp diễn, được truyền đạt bằng “hồi lâu.”
