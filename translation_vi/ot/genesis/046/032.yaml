  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: vi
  text: Những người ấy làm nghề chăn chiên, vì họ vốn là những người chăn nuôi gia súc; họ đã đem theo các bầy chiên dê, các đàn bò và mọi tài sản của mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Những người ấy
  rationale: Cụm danh từ xác định chỉ những người vừa được nhắc đến; “những người ấy” tự nhiên trong tiếng Việt và làm rõ sở chỉ.
- source_word: רֹעֵי צֹאן
  choice: làm nghề chăn chiên
  rationale: Diễn đạt tự nhiên nghề nghiệp của người chăn צֹאן; “chăn chiên” là cách gọi quen thuộc, còn phạm vi rộng hơn của צֹאן được thể hiện ở vế sau.
- source_word: כִּי
  choice: vì
  rationale: Liên từ đưa ra lời giải thích cho việc gọi họ là người chăn chiên.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: những người chăn nuôi gia súc
  rationale: Chỉ những người làm nghề nuôi giữ vật nuôi; “gia súc” không thu hẹp מִקְנֶה thành riêng bò.
- source_word: הָיוּ
  choice: vốn là
  rationale: Dạng hoàn thành mô tả nghề nghiệp đã được xác lập từ trước và vẫn liên quan trong bối cảnh hiện tại; “vốn là” truyền đạt sắc thái ấy tự nhiên.
- source_word: וְצֹאנָם
  choice: các bầy chiên dê
  rationale: צֹאן là vật nuôi nhỏ theo bầy, thường gồm chiên và dê; cách dịch này tránh đồng nhất từ ấy với riêng chiên.
- source_word: וּבְקָרָם
  choice: các đàn bò
  rationale: בָּקָר chỉ đại gia súc thuộc loài bò; “các đàn bò” chính xác và tạo thế đối ứng tự nhiên với “các bầy chiên dê”.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: mọi tài sản của mình
  rationale: Diễn đạt toàn bộ những gì thuộc về họ bằng tiếng Việt gọn và tự nhiên.
- source_word: הֵבִיאוּ
  choice: họ đã đem theo
  rationale: Dạng hoàn thành chỉ hành động đã hoàn tất và có kết quả hiện tại; “đã đem theo” phù hợp với việc họ vừa đến Ai Cập cùng tài sản.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chiên dê” để phản ánh chính xác danh từ tập hợp צֹאן, đồng thời dùng “gia súc” làm thuật ngữ bao quát cho מִקְנֶה. Không cần chú thích về thì, vì “vốn là” và “đã đem theo” truyền đạt tự nhiên hai dạng hoàn thành trong tiếng Việt.
