  text: וּ/בְנֵ֥י יוֹסֵ֛ף אֲשֶׁר יֻלַּד ל֥/וֹ בְ/מִצְרַ֖יִם נֶ֣פֶשׁ שְׁנָ֑יִם כָּל הַ/נֶּ֧פֶשׁ לְ/בֵֽית יַעֲקֹ֛ב הַ/בָּ֥אָה מִצְרַ֖יְמָ/ה שִׁבְעִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: vi
  text: Các con trai của Giô-sép, được sinh ra cho ông tại Ai Cập, là hai người.[a] Tổng số người thuộc nhà Gia-cốp đến Ai Cập là bảy mươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ thường được dịch sát là “linh hồn”; trong ngữ cảnh kiểm đếm gia đình, từ này chỉ từng cá nhân.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: Các con trai của Giô-sép
  rationale: בְּנֵי là dạng số nhiều liên kết của בֵּן, trong ngữ cảnh chỉ hai con trai của Giô-sép đã được nêu tên; tiếng Việt không cần dịch liên từ וְ thành “và” khi câu này tiếp nối một phép tổng kết và mở đầu tự nhiên hơn nếu lược bỏ.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: sinh cho ông
  rationale: Giữ cấu trúc bị động của ילד với לְ chỉ người cha; trong tiếng Việt, “sinh cho ông” trang trọng, gọn và không chuyển thành lối chủ động “ông sinh ra”.
- source_word: בְמִצְרַיִם
  choice: tại Ai Cập
  rationale: Giới từ בְּ có nghĩa chỉ địa điểm; “tại” phù hợp với văn phong tường thuật trang trọng.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: hai người
  rationale: נֶפֶשׁ trong bảng gia phả và phép đếm là cách gọi từng cá nhân, không nhằm trình bày quan niệm về linh hồn; “hai người” là cách nói tự nhiên trong tiếng Việt.
- source_word: כָּל הַנֶּפֶשׁ
  choice: Tổng số người
  rationale: Cụm Hê-bơ-rơ ở số ít mang nghĩa tập hợp và dẫn đến con số tổng cộng; “Tổng số người” truyền đạt rõ chức năng thống kê hơn lối dịch sát chữ nhưng gượng “mọi linh hồn”.
- source_word: לְבֵית יַעֲקֹב
  choice: thuộc nhà Gia-cốp
  rationale: לְ biểu thị sự thuộc về; “nhà Gia-cốp” giữ nghĩa gia đình hoặc gia tộc mang tính tập thể.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: đến Ai Cập
  rationale: Phân từ có mạo từ mô tả tập thể đang được tổng kết; hậu tố chỉ hướng -ָה được diễn đạt tự nhiên bằng “đến”.
- source_word: שִׁבְעִים
  choice: là bảy mươi
  rationale: Mệnh đề Hê-bơ-rơ không có động từ nêu tổng số; tiếng Việt dùng “là” để hoàn chỉnh câu mà không thêm ý giải thích.
theological_decisions:
- issue: Cách dịch נֶפֶשׁ trong ngữ cảnh kiểm đếm gia tộc
  choice: người
  alternative: linh hồn
  rationale: Ở đây נֶפֶשׁ là thành ngữ chỉ cá nhân trong một phép đếm, không khẳng định rằng chỉ một phần vô hình của con người đi đến Ai Cập. “Người” tránh áp đặt hàm ý nhân học không có trong ngữ cảnh.
- issue: Con số bảy mươi và phạm vi của phép đếm
  choice: Giữ nguyên lời tổng kết “Tổng số người thuộc nhà Gia-cốp đến Ai Cập là bảy mươi”
  alternative: Diễn giải hoặc điều hòa con số với các cách đếm khác trong truyền thống bản văn
  rationale: Bản WLC nêu rõ bảy mươi; bản dịch không tự ý giải quyết các khác biệt về cách tính hoặc truyền thống văn bản ở nơi khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con trai”, “nhà Gia-cốp” và “tổng số người” để vừa giữ sắc thái gia phả vừa tránh câu chữ gượng. Dấu chú thích [a] được đặt ngay sau lần đầu dịch נֶפֶשׁ, nơi cần giải thích nhất.
