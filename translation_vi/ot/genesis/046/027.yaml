    rationale: Trong ngữ cảnh này נֶפֶשׁ là đơn vị chỉ cá nhân; “linh hồn” là cách dịch sát truyền thống hơn, cần được giải thích là thành ngữ kiểm đếm chứ không phải một khẳng định nhân học.
