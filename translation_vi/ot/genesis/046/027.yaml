  terminology: “con trai,” “nhà Gia-cốp,” “Ai Cập,” và “người” đều thích hợp. Chú thích nên nói “linh hồn” là cách dịch sát thường gặp của נֶפֶשׁ, rồi giải thích nghĩa thành ngữ chỉ cá nhân trong ngữ cảnh kiểm đếm; “sinh mạng” không phải là chú giải từ vựng rõ nhất tại đây.
