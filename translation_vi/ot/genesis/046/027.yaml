  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của tiếng Hê-bơ-rơ: các con trai của Giô-sép được sinh cho ông tại Ai Cập, số lượng là hai, và tổng số người thuộc nhà Gia-cốp đến Ai Cập là bảy mươi. Tuy nhiên, cụm “sinh cho ông” thiếu dấu hiệu bị động rõ ràng, nên trong tiếng Việt có thể bị hiểu lệch như thể các con trai là chủ thể sinh con.'
