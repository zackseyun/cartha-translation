    và ăn bụi đất

    suốt mọi ngày của đời ngươi.”'
  rationale: Bản sửa chỉ điều chỉnh danh xưng YHWH theo hồ sơ nguồn, thay một cách gọi động vật cổ bằng cách nói hiện đại và rõ phạm vi hơn, và sửa chú thích từ vựng để tránh thu hẹp nghĩa của נָחָשׁ. Hình ảnh cụ thể, giọng phán xét, đại từ “ngươi,” và độ mở của cụm “ăn bụi đất” đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
