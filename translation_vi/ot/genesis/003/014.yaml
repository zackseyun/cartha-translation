  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: vi
  text: 'Bấy giờ, CHÚA là Đức Chúa Trời phán với con rắn[a]:


    “Vì ngươi đã làm điều này,

    ngươi bị nguyền rủa hơn mọi loài gia súc

    và hơn mọi loài thú hoang ngoài đồng;

    ngươi sẽ đi bằng bụng[b]

    và ăn bụi đất

    suốt mọi ngày của đời ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “rắn”; cách này không dùng từ chỉ loại trong tiếng Việt.
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh “đi bằng bụng” và “ăn bụi đất” cũng có thể gợi sự hạ nhục và thất bại, chứ không nhất thiết chỉ mô tả cách di chuyển và thức ăn theo nghĩa đen.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: Giê-hô-va Đức Chúa Trời
  rationale: Chuyển danh riêng YHWH bằng dạng phiên âm quen thuộc trong tiếng Việt và giữ אֱלֹהִים là “Đức Chúa Trời,” qua đó bảo toàn cặp danh xưng trong nguyên văn.
- source_word: הַנָּחָשׁ
  choice: con rắn
  rationale: “Con rắn” là cách gọi tự nhiên, chính xác và trang trọng vừa đủ trong tiếng Việt; câu không tự đồng nhất con rắn với một nhân vật thần học khác.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: Vì ngươi đã làm điều này
  rationale: “Vì” diễn đạt rõ quan hệ nguyên nhân dẫn đến lời phán xét.
- source_word: אָרוּר אַתָּה
  choice: ngươi bị nguyền rủa
  rationale: Diễn đạt tự nhiên trong tiếng Việt nhưng vẫn giữ sắc thái tuyên án trang nghiêm của vị từ אָרוּר.
- source_word: מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: hơn mọi loài gia súc và mọi loài thú đồng
  rationale: Hiểu מִן theo nghĩa so sánh; phân biệt gia súc với thú sống ngoài đồng, đồng thời giữ hình ảnh “đồng” của הַשָּׂדֶה.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: ngươi sẽ đi bằng bụng
  rationale: Giữ động từ chung “đi” thay vì thêm ý “bò/trườn” không được biểu thị trực tiếp trong tiếng Hê-bơ-rơ.
- source_word: וְעָפָר תֹּאכַל
  choice: và ăn bụi đất
  rationale: Giữ nguyên hình ảnh cụ thể và không quyết định trong chính văn rằng đây chỉ là khẩu phần theo nghĩa đen hay thành ngữ chỉ sự nhục nhã.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: suốt mọi ngày của đời ngươi
  rationale: Bảo toàn độ đầy đủ và nhịp điệu trang trọng của thành ngữ Hê-bơ-rơ.
theological_decisions:
- issue: Căn tính của con rắn
  choice: Chỉ gọi là “con rắn” như câu Hê-bơ-rơ trực tiếp nói.
  alternative: Diễn giải ngay trong chính văn rằng con rắn là Sa-tan.
  rationale: Câu này hướng lời phán đến הַנָּחָשׁ và không nêu sự đồng nhất ấy; bản dịch không đưa cách nhận diện từ các văn bản về sau vào chính văn.
- issue: Bản chất của việc “ăn bụi đất”
  choice: Giữ nguyên hình ảnh mà không giải nghĩa trong chính văn.
  alternative: Dịch thuần túy như một ẩn dụ về nhục nhã và thất bại, hoặc chỉ như chế độ ăn theo nghĩa đen.
  rationale: Cụm từ cho phép hình ảnh cụ thể đồng thời có sức gợi về sự hạ nhục; giữ cách nói nguồn bảo toàn độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng đại từ “ngươi” trong lời phán xét trực tiếp để giữ sắc thái uy nghiêm. Trình bày theo các dòng thơ nhằm làm rõ cấu trúc song song của lời nguyền.
