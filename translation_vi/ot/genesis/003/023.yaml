  to: Vì vậy, Yahweh, Đức Chúa Trời, sai người ra khỏi vườn Ê-đen để canh tác đất mà người đã được lấy ra từ đó.[a]
  rationale: Bản sửa chỉ làm rõ cấu trúc đồng vị của danh xưng thần linh, làm mệnh đề quan hệ tự nhiên hơn, và chỉnh chú thích để phản ánh đúng việc động từ Hê-bơ-rơ có “đất” làm đối tượng trực tiếp. Ý nghĩa của câu không thay đổi.
