  - severity: low
    issue: Chú thích thay thế “làm việc trên đất”
    rationale: עבד trực tiếp nhận đối tượng là הָאֲדָמָה (“đất/đất đai”), không phải diễn tả địa điểm làm việc. Chú thích nên giữ quan hệ động từ–đối tượng này.
