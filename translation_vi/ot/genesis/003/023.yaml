  text: וַֽ/יְשַׁלְּחֵ֛/הוּ יְהוָ֥ה אֱלֹהִ֖ים מִ/גַּן עֵ֑דֶן לַֽ/עֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר לֻקַּ֖ח מִ/שָּֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: vi
  text: Vì vậy, Yahweh, Đức Chúa Trời, sai người ra khỏi vườn Ê-đen để canh tác đất mà người đã được lấy ra từ đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để làm việc đất.” Động từ Hê-bơ-rơ có thể có nghĩa là “làm việc”, “phục vụ”, hoặc, trong văn cảnh này, “canh tác”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: sai người ra khỏi
  rationale: Dạng piel của שׁלח ở đây diễn tả việc sai đi hay cho rời khỏi. Cách dịch này giữ sắc thái cơ bản của động từ và ý tách khỏi Ê-đen, nhưng không dùng sắc thái mạnh hơn là “đuổi”, vốn phù hợp với גרשׁ ở câu kế tiếp.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Đức Chúa Trời
  rationale: Giữ tên riêng giao ước Yahweh và kết hợp tự nhiên với danh xưng אֱלֹהִים theo cách dùng tiếng Việt Kinh Thánh hiện đại.
- source_word: מִגַּן עֵדֶן
  choice: ra khỏi vườn Ê-đen
  rationale: Giới từ מִן chỉ sự tách khỏi một nơi; “ra khỏi” thể hiện rõ hướng chuyển động trong tiếng Việt.
- source_word: לַעֲבֹד
  choice: để canh tác
  rationale: עבד có thể mang nghĩa làm việc, phục vụ hoặc canh tác. Khi đối tượng là đất, “canh tác” tự nhiên và chính xác trong tiếng Việt, đồng thời vẫn giữ liên hệ với công việc của con người trong trình thuật trước đó.
- source_word: אֶת הָאֲדָמָה
  choice: đất
  rationale: אֲדָמָה chỉ đất/đất đai mà con người được tạo nên từ đó. “Đất” vừa tự nhiên vừa duy trì mối liên hệ từ vựng trong Sáng Thế Ký 2–3.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: mà từ đó người đã được lấy ra
  rationale: Giữ mệnh đề quan hệ, thể bị động của לֻקַּח và tính đi trước của hành động so với việc bị đưa khỏi vườn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng tên riêng Yahweh để thể hiện trực tiếp Tứ Tự Danh, không thay bằng một tước hiệu hay áp đặt cách đọc mang tính hệ phái.
- issue: Quan hệ giữa công việc này và nhiệm vụ ban đầu của con người
  choice: để canh tác đất
  alternative: để làm việc trên đất; để phục vụ đất
  rationale: Bản dịch giữ sự liên tục từ vựng của עבד trong trình thuật, nhưng không thêm kết luận thần học về bản chất của lao động sau khi con người phạm tội.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “người” để chỉ người nam trong mạch văn, tránh lặp “ông” vốn có thể tạo sắc thái kể chuyện không cần thiết. Tên địa danh được viết theo dạng quen thuộc “Ê-đen”.
