revisions:
- from: Họ nghe tiếng Giê-hô-va Đức Chúa Trời đi lại trong vườn giữa làn gió ban ngày[a][b]. Người nam[c] và vợ mình liền ẩn trốn khỏi sự hiện diện của Giê-hô-va Đức Chúa Trời giữa những cây trong vườn.
  to: Họ nghe tiếng của Giê-hô-va Đức Chúa Trời đang đi lại trong vườn lúc có gió trong ngày[a][b]. Người nam[c] và vợ ông ẩn trốn khỏi sự hiện diện của Giê-hô-va Đức Chúa Trời giữa những cây trong vườn.
