  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: vi
  text: Họ nghe tiếng của Giê-hô-va Đức Chúa Trời đang đi lại trong vườn lúc có gió trong ngày[a][b]. Người nam[c] và vợ ông ẩn trốn khỏi sự hiện diện của Giê-hô-va Đức Chúa Trời giữa những cây trong vườn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tiếng nói của Giê-hô-va Đức Chúa Trời”. Từ Hê-bơ-rơ có thể chỉ “tiếng” hoặc “tiếng nói”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lúc trời mát”. Nghĩa sát là “trong gió của ngày”.
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hê-bơ-rơ là “người nam”; cũng có thể hiểu là tên “A-đam”.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: tiếng
  rationale: “Tiếng” tự nhiên trong tiếng Việt và giữ được độ mở của từ Hê-bơ-rơ, vốn có thể chỉ âm thanh hoặc tiếng nói, mà không khẳng định Đức Chúa Trời đang phán.
- source_word: יְהוָה
  choice: Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt để thể hiện Danh riêng YHWH, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, phổ biến trong tiếng Việt; đi cùng danh riêng tạo thành “Giê-hô-va Đức Chúa Trời”.
- source_word: מִתְהַלֵּךְ
  choice: đi lại
  rationale: Diễn đạt tự nhiên sắc thái chuyển động quanh trong vườn của phân từ Hitpael, đồng thời giữ nguyên hình ảnh nhân hình của nguyên văn.
- source_word: בַּגָּן
  choice: trong vườn
  rationale: Theo nghĩa thông thường của giới từ ב và phù hợp ngữ cảnh không gian.
- source_word: לְרוּחַ הַיּוֹם
  choice: giữa làn gió ban ngày
  rationale: Giữ danh từ רוּחַ theo nghĩa “gió” và tránh diễn giải thành “lúc trời mát”; chú thích nêu cách dịch truyền thống.
- source_word: הָאָדָם
  choice: người nam
  rationale: Trong ngữ cảnh có “vợ mình”, cụm từ chỉ cá nhân người nam; cách dịch này vẫn tránh quyết định dứt khoát rằng đây đã là tên riêng A-đam.
- source_word: וְאִשְׁתּוֹ
  choice: và vợ mình
  rationale: Diễn đạt trực tiếp liên từ và hậu tố sở hữu ngôi ba số ít; “mình” liên kết tự nhiên với chủ thể người nam.
- source_word: מִפְּנֵי
  choice: khỏi sự hiện diện của
  rationale: Bảo toàn sắc thái không gian và quan hệ của thành ngữ nghĩa đen “khỏi mặt/trước mặt”, thay vì chỉ nói chung chung là “trốn Đức Chúa Trời”.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: giữa những cây trong vườn
  rationale: עֵץ ở số ít hình thái nhưng có thể mang nghĩa tập hợp; ngữ cảnh ẩn trốn đòi hỏi cách diễn đạt số nhiều tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Hình ảnh nhân hình về Đức Chúa Trời “đi lại” trong vườn
  choice: Giữ cách nói cụ thể “đi lại” mà không làm nhẹ hoặc giải thích theo nghĩa bóng.
  alternative: Di chuyển trong vườn; tiếng về sự hiện diện của Đức Chúa Trời trong vườn.
  rationale: Nguyên văn kể bằng hình ảnh cụ thể; bản dịch cần giữ nguyên sức căng thần học thay vì giải thích hoặc hệ thống hóa hình ảnh ấy.
- issue: Cách hiểu הָאָדָם
  choice: người nam
  alternative: con người; A-đam
  rationale: Từ này có thể vừa chỉ cá nhân vừa mang tính đại diện. Cụm “vợ mình” nghiêng về cá nhân người nam, nhưng chú thích vẫn bảo lưu khả năng đọc như tên riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Duy trì cấu trúc kể chuyện, Danh riêng của Đức Chúa Trời và hình ảnh cụ thể của nguyên văn; các điểm mơ hồ thực sự được bảo lưu bằng chú thích.
