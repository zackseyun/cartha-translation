revisions:
- from: Người nữ thấy cây ấy có trái ăn ngon, trông thật thích mắt[a], và cây ấy đáng ao ước vì có thể làm cho người ta khôn ngoan[b]. Bà liền hái trái cây mà ăn, rồi cũng đưa cho chồng đang ở cùng mình, và ông ăn.
  to: Người nữ thấy cây ấy tốt để làm thức ăn, là điều thích mắt[a], và đáng ao ước để làm cho người ta khôn ngoan[b]. Nàng lấy trái của cây ấy và ăn; rồi nàng cũng đưa cho chồng mình, người đang ở cùng nàng, và ông ăn.
  rationale: Sửa “có trái ăn ngon” thành “tốt để làm thức ăn” để bám sát đánh giá của nguyên văn và không thêm ý về vị ngon. Các sửa đổi còn lại làm văn phong nhất quán, hiện đại và trung tính, đồng thời duy trì tính mơ hồ hợp lý của לְהַשְׂכִּיל trong bản chính và chú thích.
  reviewer_model: gpt-5.6-terra
