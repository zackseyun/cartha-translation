  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: vi
  text: Người nữ thấy cây ấy tốt để làm thức ăn, là điều thích mắt[a], và đáng ao ước để làm cho người ta khôn ngoan[b]. Nàng lấy trái của cây ấy và ăn; rồi nàng cũng đưa cho chồng mình, người đang ở cùng nàng, và ông ăn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đáng khao khát đối với mắt” hay “là niềm ham thích đối với mắt.” Cụm từ Hê-bơ-rơ nhấn mạnh sức hấp dẫn về mặt thị giác của cây.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để đạt được sự khôn ngoan.” Động từ Hê-bơ-rơ có thể chỉ việc trở nên khôn ngoan hoặc làm cho người khác khôn ngoan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: thấy
  rationale: Động từ kể chuyện thông thường, diễn tả cả việc nhìn thấy lẫn nhận biết những đặc tính được nêu sau đó.
- source_word: טוֹב הָעֵץ לְמַאֲכָל
  choice: cây ấy có trái ăn ngon
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt việc cây thích hợp làm thức ăn; trong ngữ cảnh, chính trái cây được ăn.
- source_word: תַאֲוָה הוּא לָעֵינַיִם
  choice: trông thật thích mắt
  rationale: Giữ trọng tâm vào sức hấp dẫn thị giác mà không đưa thêm sắc thái ham muốn tội lỗi.
- source_word: וְנֶחְמָד הָעֵץ לְהַשְׂכִּיל
  choice: cây ấy đáng ao ước vì có thể làm cho người ta khôn ngoan
  rationale: Diễn đạt sức hấp dẫn của cây cùng ý nghĩa khả năng hoặc mục đích của động từ Hiphil לְהַשְׂכִּיל, đồng thời tránh xác định quá mức chủ thể.
- source_word: מִפִּרְיוֹ
  choice: trái cây
  rationale: Tiếng Việt tự nhiên có thể dùng danh từ tập hợp này làm tân ngữ của 'hái'; ý lấy từ trái của cây đã rõ trong ngữ cảnh.
- source_word: וַתִּתֵּן גַּם לְאִישָׁהּ עִמָּהּ
  choice: rồi cũng đưa cho chồng đang ở cùng mình
  rationale: Thể hiện rõ גַּם và gắn עִמָּהּ với người chồng theo cú pháp tự nhiên của tiếng Việt.
theological_decisions:
- issue: Sắc thái đạo đức trong cách người nữ nhìn cây
  choice: 'Dùng các từ tương đối trung tính: ''ăn ngon'', ''thích mắt'', ''đáng ao ước''.'
  alternative: Dùng những từ mang phán xét rõ hơn như 'dục vọng', 'tham muốn' hoặc 'cám dỗ'.
  rationale: Bản Hê-bơ-rơ thuật lại đánh giá của người nữ bằng ngôn ngữ tích cực trước khi kể hành động ăn; bản dịch không nên đưa sự kết án vào sớm hơn nguyên văn.
- issue: Ý nghĩa của לְהַשְׂכִּיל
  choice: có thể làm cho người ta khôn ngoan
  alternative: để đạt được sự khôn ngoan
  rationale: Dạng Hiphil có thể chỉ việc làm cho khôn ngoan hoặc đem lại sự hiểu biết. Bản chính chọn cách thứ nhất, còn chú thích giữ cách hiểu kia.
- issue: Sự hiện diện của người chồng
  choice: chồng đang ở cùng mình
  alternative: chồng mình
  rationale: Giữ rõ chi tiết עִמָּהּ mà không suy diễn ông đã có mặt trong toàn bộ cuộc đối thoại trước đó.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người nữ” để giữ cách gọi của mạch văn Sáng Thế Ký; sau đó dùng “bà/ông” nhằm tránh lặp nặng nề. Hai dấu chú thích đều xuất hiện trong câu chính và nội dung chú thích tương ứng đúng vị trí.
