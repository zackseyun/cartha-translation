source:
  edition: WLC
  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: vi
  text: Người đàn ông[a] đặt tên cho vợ mình là Ê-va, vì vợ ông là mẹ của mọi loài đang sống.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “A-đam”. Tiếng Hê-bơ-rơ ở đây viết “người đàn ông” (ha’adam), có mạo từ xác định.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “mẹ của tất cả những kẻ sống”. Cũng có thể hiểu là “mẹ của mọi người đang sống” hoặc “mẹ của mọi sinh vật sống”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: đặt tên
  rationale: Trong công thức đặt tên này, động từ קרא cùng với שֵׁם diễn tả hành động ban tên. “Đặt tên” tự nhiên hơn trong tiếng Việt mà vẫn chuyển đúng chức năng của cụm Hê-bơ-rơ.
- source_word: הָאָדָם
  choice: người đàn ông
  rationale: Danh từ אָדָם có mạo từ xác định, nên ở đây ưu tiên nghĩa miêu tả “người đàn ông” thay vì tên riêng “A-đam”.
- source_word: שֵׁם אִשְׁתּוֹ
  choice: cho vợ mình
  rationale: Tiếng Hê-bơ-rơ nói sát chữ là “gọi tên của vợ mình”; cấu trúc “đặt tên cho vợ mình” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: חַוָּה
  choice: Ê-va
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt cho חַוָּה.
- source_word: כִּי
  choice: vì
  rationale: Liên từ giới thiệu lý do của việc đặt tên.
- source_word: הִוא הָיְתָה
  choice: bà là
  rationale: Động từ היה ở đây chủ yếu diễn tả trạng thái. Tiếng Việt không bắt buộc đánh dấu thì quá khứ; “bà là” tự nhiên và không biến câu thành ý nói bà “trở thành” mẹ.
- source_word: אֵם
  choice: mẹ
  rationale: Nghĩa thông thường của אֵם trong quan hệ sinh thành.
- source_word: כָּל חָי
  choice: tất cả những người sống
  rationale: חָי là tính từ được dùng như danh từ. Cách dịch này rõ ràng, tự nhiên trong ngữ cảnh nói về tổ mẫu loài người, còn phạm vi rộng hơn của nguyên văn được ghi nhận trong chú thích.
theological_decisions:
- issue: הָאָדָם là tên riêng “A-đam” hay danh xưng “người đàn ông”
  choice: người đàn ông
  alternative: A-đam
  rationale: Mạo từ xác định trong הָאָדָם nghiêng mạnh về cách hiểu miêu tả. Bản dịch giữ sắc thái ngữ pháp này và nêu cách đọc theo tên riêng trong chú thích.
- issue: Phạm vi của cụm “mẹ của tất cả những gì/những ai sống”
  choice: mẹ của tất cả những người sống
  alternative: mẹ của mọi sinh vật sống
  rationale: Ngữ cảnh hướng đến dòng dõi loài người, nhưng nguyên văn ngắn gọn và có thể được hiểu rộng hơn. Bản dịch chính dùng cách nói tự nhiên theo ngữ cảnh, đồng thời chú thích bảo lưu độ rộng từ vựng của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đặt tên” thay cho lối dịch sát chữ nhưng kém tự nhiên “gọi tên”; “bà” giữ cách quy chiếu kính trọng, trung tính trong lời kể. Các chú thích bảo lưu hai điểm mơ hồ thực sự của nguyên văn.
