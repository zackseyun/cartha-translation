  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: vi
  text: 'Người nam đáp: “Người nữ mà Ngài đã ban để ở cùng con—chính nàng đã đưa cho con trái[a] từ cây ấy, và con đã ăn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “từ cây”; từ “trái” được thêm vào theo ngữ cảnh để câu tiếng Việt rõ nghĩa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: người nam
  rationale: Trong ngữ cảnh này, từ này chỉ cá nhân nam giới đối diện với người nữ, không chỉ loài người nói chung.
- source_word: הָאִשָּׁה
  choice: người nữ
  rationale: Giữ cách gọi trực tiếp của tiếng Hê-bơ-rơ; “vợ” có thể phù hợp ở nơi khác nhưng ở đây kém sát hơn.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: mà Ngài đã ban để ở cùng con
  rationale: Diễn đạt tự nhiên ý người nữ được Đức Chúa Trời ban làm người ở cùng, đồng thời giữ nguyên hàm ý người nam quy trách nhiệm mà không tăng hoặc giảm nhẹ.
- source_word: הִוא
  choice: chính nàng
  rationale: Đại từ độc lập mang sắc thái nhấn mạnh; “chính nàng” thể hiện rõ nét nhấn mạnh ấy trong tiếng Việt.
- source_word: נָתְנָה לִי
  choice: đã đưa cho con
  rationale: “Đưa cho” tự nhiên khi nói về việc trao một vật để ăn và không thêm sắc thái diễn giải.
- source_word: מִן הָעֵץ
  choice: thứ từ cây ấy
  rationale: Tiếng Hê-bơ-rơ chỉ nói “từ cây”, không nêu danh từ “trái”; thêm “thứ” giúp câu tiếng Việt đầy đủ mà vẫn bảo toàn sự hàm ẩn của nguyên văn.
- source_word: וָאֹכֵל
  choice: và con đã ăn
  rationale: Giữ quan hệ nối tiếp đơn giản của lời kể, không thêm ý nhân quả như “nên”.
theological_decisions:
- issue: Lời đáp có thể ngầm quy trách nhiệm cho Đức Chúa Trời và người nữ
  choice: Giữ nguyên cấu trúc “người nữ mà Ngài đã ban để ở cùng con” cùng nét nhấn mạnh “chính nàng”.
  alternative: Làm nhẹ thành “người nữ ở cùng con” hoặc tăng mạnh thành “Ngài đã đem người nữ ấy đến cho con”.
  rationale: Nguyên văn tạo ra sự căng thẳng khi người nam nhắc chính Đức Chúa Trời là Đấng ban người nữ rồi nhấn mạnh hành động của nàng; bản dịch không nên hóa giải hay cường điệu hàm ý này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/con” trong lời người nam thưa với Đức Chúa Trời. Dấu gạch ngang bảo lưu nhịp nhấn của đại từ הִוא.
