  to: 'Người nam đáp: “Người nữ mà Ngài đã ban để ở cùng con—chính nàng đã đưa cho con trái[a] từ cây ấy, và con đã ăn.”'
  rationale: Sửa duy nhất cách diễn đạt đối tượng được trao để bản dịch tự nhiên và rõ nghĩa trong tiếng Việt. Việc thêm “trái” được giới hạn bởi ngữ cảnh trực tiếp và được minh bạch hóa bằng chú thích; các yếu tố quan trọng khác, gồm hàm ý quy trách nhiệm trong “Ngài đã ban để ở cùng con” và nét nhấn “chính nàng,” được giữ nguyên.
