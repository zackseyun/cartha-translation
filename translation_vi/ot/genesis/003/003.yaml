  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/מִ/פְּרִ֣י הָ/עֵץ֮ אֲשֶׁ֣ר בְּ/תוֹךְ הַ/גָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תִגְּע֖וּ בּ֑/וֹ פֶּן תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: vi
  text: 'Còn trái của cây ở giữa vườn[a], Đức Chúa Trời phán: ‘Các ngươi không được ăn trái ấy, cũng không được chạm đến nó, kẻo các ngươi chết.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ở trong vườn.”'
    reason: Cụm בְּתוֹךְ có thể được diễn đạt là «ở giữa» hoặc «ở trong», tùy cách hiểu sắc thái không gian.
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: Nhưng về trái
  rationale: Liên từ trong ngữ cảnh tạo thế tương phản với câu 2; ‘nhưng’ diễn đạt tự nhiên sắc thái ấy, còn ‘về trái’ giữ quan hệ của מִן mà không khiến tiếng Việt gượng gạo.
- source_word: הָ/עֵץ
  choice: của cây
  rationale: Danh từ xác định chỉ cây đã được nhận diện trong lời nói; cấu trúc ‘trái của cây’ rõ nghĩa trong tiếng Việt.
- source_word: אֲשֶׁר בְּ/תוֹךְ הַ/גָּן
  choice: ở giữa vườn
  rationale: בְּתוֹךְ chỉ vị trí bên trong hoặc ở giữa; ‘ở giữa vườn’ tự nhiên và giữ được điểm nhấn không gian.
- source_word: אָמַר אֱלֹהִים
  choice: Đức Chúa Trời đã phán
  rationale: Dạng qatal thuật lại lời đã nói trước đó; ‘đã phán’ phù hợp văn cảnh và giữ văn phong trang trọng khi nói về lời của Đức Chúa Trời.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: Các ngươi không được ăn trái cây ấy
  rationale: ‘Không được’ diễn đạt rõ lệnh cấm trong tiếng Việt hiện đại. Lặp ‘trái cây ấy’ tự nhiên và tránh đại từ mơ hồ.
- source_word: וְ/לֹא תִגְּעוּ בּ/וֹ
  choice: cũng không được chạm đến nó
  rationale: Giữ nguyên lệnh cấm được thêm vào trong lời người nữ; ‘chạm đến’ là cách diễn đạt trực tiếp, trang trọng vừa phải.
- source_word: פֶּן תְּמֻתוּן
  choice: kẻo các ngươi chết
  rationale: ‘Kẻo’ giữ sắc thái hậu quả cần tránh của פֶּן, không biến câu thành một lời khẳng định tuyệt đối mạnh hơn nguyên văn.
theological_decisions:
- issue: Lời người nữ thêm mệnh đề ‘cũng không được chạm đến nó’ so với mệnh lệnh được thuật lại trong Sáng Thế Ký 2:17.
  choice: Dịch đầy đủ lời người nữ đúng như văn bản Hê-bơ-rơ.
  alternative: Lược bỏ hoặc làm nhẹ mệnh đề về việc chạm đến cây để hài hòa với Sáng Thế Ký 2:17.
  rationale: Cần bảo toàn sự khác biệt và sức căng trong trình thuật, không tự ý hài hòa lời người nữ với mệnh lệnh trước đó.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng ‘Đức Chúa Trời’ và ‘phán’ theo văn phong Kinh Thánh phổ thông; ‘các ngươi’ duy trì số nhiều của các động từ Hê-bơ-rơ và sắc thái lời truyền trực tiếp.
