base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: vi
  text: 'Người phụ nữ nói với con rắn: “Chúng tôi được phép ăn trái của các cây trong vườn.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ có dạng số ít: “từ trái của cây trong vườn”; ở đây “cây” được hiểu theo nghĩa tập hợp, nên dịch là “các cây”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: nói
  rationale: Động từ có waw liên tiếp tiếp diễn mạch kể. Trong tiếng Việt, trật tự câu và động từ “nói” đã diễn đạt tự nhiên sự tiếp nối; không nhất thiết thêm “và” một cách máy móc.
- source_word: הָאִשָּׁה
  choice: người phụ nữ
  rationale: Ở đây אִשָּׁה chỉ nhân vật nữ trong câu chuyện, không nhấn mạnh vai trò làm vợ.
- source_word: אֶל הַנָּחָשׁ
  choice: với con rắn
  rationale: Cách nói tự nhiên trong tiếng Việt cho hành động ngỏ lời với một đối tượng; נָחָשׁ được dịch là “con rắn”, rõ ràng và thông dụng.
- source_word: מִפְּרִי
  choice: trái của
  rationale: Trong cấu trúc tiếng Việt với động từ “ăn”, “ăn trái của...” diễn đạt tự nhiên đối tượng và nguồn cây, thay vì sao chép cứng nhắc giới từ מִן thành “từ”.
- source_word: עֵץ הַגָּן
  choice: các cây trong vườn
  rationale: Dù עֵץ ở hình thức số ít, ngữ cảnh cho thấy nghĩa tập hợp/phân bố, chỉ các cây trong vườn nói chung.
- source_word: נֹאכֵל
  choice: chúng tôi được ăn
  rationale: Thể vị hoàn thành chưa hoàn tất ngôi thứ nhất số nhiều trong ngữ cảnh diễn đạt sự cho phép, vọng lại Sáng Thế 2:16; “được ăn” chính xác hơn ý khả năng đơn thuần.
theological_decisions:
- issue: Phạm vi những cây có trái được phép ăn
  choice: Hiểu עֵץ theo nghĩa tập hợp và dịch “trái của các cây trong vườn”.
  alternative: “trái của cây trong vườn”
  rationale: Cách dịch số nhiều làm rõ lời cho phép rộng khắp trong ngữ cảnh mà không khiến người đọc tưởng người phụ nữ mới chỉ nói đến một cây; ngoại lệ sẽ được nêu ở câu kế tiếp.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người phụ nữ” thay vì “người đàn bà” để giữ sắc thái trung tính; dùng “con rắn” thay vì từ cổ hoặc quá văn chương. Dấu chú thích [a] được đặt sau toàn bộ mệnh đề liên quan.
