  naturalness: “Chúng tôi được phép ăn...” tự nhiên và rõ hơn “Chúng tôi được ăn...”, vốn có thể nghe thiếu một bổ ngữ hoặc kém minh bạch về sắc thái được cho phép. “Nói với con rắn” phù hợp văn phong kể chuyện hiện đại.
