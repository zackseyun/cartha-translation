  source_fidelity: 'Bản dịch phản ánh sát cấu trúc và ý nghĩa của tiếng Hê-bơ-rơ: כִּי mở đầu được chuyển là “Vì”; mệnh đề nội dung với “rằng”; thành ngữ thời gian בְּיוֹם được diễn đạt tự nhiên là “khi”; hậu tố số nhiều được giữ bằng “các ngươi”; và hình ảnh Niphal “mắt ... sẽ mở ra” được bảo toàn. “Trái cây ấy” là cách quy chiếu theo ngữ cảnh, phù hợp với vật bị cấm trong câu chuyện, dù nguyên văn dùng đại từ “nó/từ nó”.'
