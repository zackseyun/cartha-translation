  terminology: “Đức Chúa Trời” được dùng nhất quán cho אֱלֹהִים khi nói về Đức Chúa Trời trong mạch văn. Cách dịch chính “giống như Đức Chúa Trời” là lựa chọn có cơ sở theo ngữ cảnh; chú thích giữ đầy đủ các khả năng “các thần” và “các hữu thể thần linh”, không xóa bỏ điểm còn tranh luận của כֵּאלֹהִים. Neo chú thích đặt ngay sau cụm được chú thích là chính xác.
