source:
  edition: WLC
  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: vi
  text: Vì Đức Chúa Trời biết rằng khi các ngươi ăn trái cây ấy, mắt các ngươi sẽ mở ra, và các ngươi sẽ giống như Đức Chúa Trời,[a] biết điều thiện và điều ác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giống như các thần” hoặc “giống như các hữu thể thần linh”. Trong một số ngữ cảnh, từ Hê-bơ-rơ אֱלֹהִים có thể mang những nghĩa này.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Liên từ mở đầu lời giải thích của con rắn cho lời khẳng định ngay trước đó; “Vì” diễn đạt tự nhiên quan hệ lập luận này.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: Đức Chúa Trời biết
  rationale: Dịch phân từ Hê-bơ-rơ bằng thì hiện tại tự nhiên trong tiếng Việt và hiểu אֱלֹהִים là Đức Chúa Trời theo ngữ cảnh trực tiếp.
- source_word: כִּי
  choice: rằng
  rationale: Ở đây liên từ dẫn vào nội dung điều Đức Chúa Trời biết; “rằng” là từ nối bổ ngữ tự nhiên.
- source_word: בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ
  choice: khi các ngươi ăn trái cây ấy
  rationale: Thành ngữ “trong ngày” mang nghĩa thời điểm hành động xảy ra, không nhất thiết chỉ một ngày 24 giờ. “Trái cây ấy” diễn đạt tự nhiên vật được ăn mà vẫn nối rõ với ngữ cảnh.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: mắt các ngươi sẽ mở ra
  rationale: Giữ hình ảnh đôi mắt được mở và ý nghĩa nhận thức, đồng thời dùng cấu trúc tiếng Việt tự nhiên phù hợp với dạng Niphal.
- source_word: וִהְיִיתֶם
  choice: các ngươi sẽ giống như
  rationale: Diễn đạt trạng thái sẽ có; kết hợp tự nhiên với cụm so sánh theo sau mà không nhấn quá mức sắc thái “trở thành”.
- source_word: כֵּאלֹהִים
  choice: giống như Đức Chúa Trời
  rationale: Ngữ cảnh gần nói đến Đức Chúa Trời ở số ít, nhưng danh từ אֱלֹהִים cũng có thể mang nghĩa “các thần” hoặc “các hữu thể thần linh”; các khả năng thật sự này được giữ trong chú thích.
- source_word: יֹדְעֵי טוֹב וָרָע
  choice: biết điều thiện và điều ác
  rationale: Giữ cấu trúc phân từ cô đọng và cặp khái niệm có sức nặng đạo đức, nhận thức của nguyên văn.
theological_decisions:
- issue: Đối tượng được chỉ đến bởi אֱלֹהִים trong כֵּאלֹהִים
  choice: giống như Đức Chúa Trời
  alternative: giống như các thần; giống như các hữu thể thần linh
  rationale: Ngữ cảnh trực tiếp dùng אֱלֹהִים để nói về Đức Chúa Trời, và ý “biết điều thiện và điều ác” phù hợp với sự so sánh ấy. Tuy nhiên, vì hình thái Hê-bơ-rơ cho phép các cách hiểu khác và vấn đề còn được tranh luận, bản dịch không xóa bỏ sự mơ hồ mà ghi các phương án trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ lời xưng hô số nhiều của con rắn với người nữ và người nam như được thể hiện trong các hậu tố số nhiều Hê-bơ-rơ; cách gọi này cũng tạo sắc thái trang trọng phù hợp văn bản cổ. Dùng “Đức Chúa Trời” nhất quán cho אֱלֹהִים khi chỉ Đức Chúa Trời.
