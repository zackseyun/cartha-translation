  text: וַ/יַּעַשׂ֩ יְהוָ֨ה אֱלֹהִ֜ים לְ/אָדָ֧ם וּ/לְ/אִשְׁתּ֛/וֹ כָּתְנ֥וֹת ע֖וֹר וַ/יַּלְבִּשֵֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: vi
  text: Yahweh Đức Chúa Trời làm những chiếc áo bằng da[b] cho người đàn ông và vợ ông[a], rồi mặc cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho A-đam và vợ ông.” Từ Hê-bơ-rơ אָדָם có thể được dùng làm tên riêng “A-đam” hoặc làm danh từ chung “người đàn ông”, tùy ngữ cảnh.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “áo tunic bằng da.” Từ Hê-bơ-rơ chỉ một loại áo mặc trên thân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Giê-hô-va Đức Chúa Trời
  rationale: Dùng cách gọi trang trọng, quen thuộc trong tiếng Việt cho danh riêng יהוה đi cùng tước hiệu אֱלֹהִים, thay vì thay danh ấy bằng một tước hiệu khác.
- source_word: לְאָדָם
  choice: cho người đàn ông
  rationale: Trong ngữ cảnh đối chiếu với “vợ ông”, אָדָם chỉ người nam cụ thể; cách dịch này vẫn giữ được khả năng hiểu như danh từ chung thay vì sớm cố định thành tên riêng A-đam.
- source_word: וּלְאִשְׁתּוֹ
  choice: và vợ ông
  rationale: Danh từ אִשָּׁה với hậu tố ngôi ba giống đực số ít có nghĩa tự nhiên là “vợ ông” trong ngữ cảnh hôn nhân.
- source_word: כָּתְנוֹת עוֹר
  choice: áo bằng da
  rationale: כָּתְנוֹת chỉ loại áo mặc trên thân; “áo” tự nhiên và cụ thể hơn “y phục” trong tiếng Việt hiện đại, còn עוֹר được diễn đạt trực tiếp là “da” mà không xác định thêm là da thuộc.
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Phản ánh nghĩa thông thường của עשה một cách giản dị, không thêm sắc thái chế tác không có trong nguyên văn.
- source_word: וַיַּלְבִּשֵׁם
  choice: rồi mặc cho họ
  rationale: Thể Hiphil của לבש mang nghĩa khiến ai đó mặc; “mặc cho họ” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn cho thấy chính Đức Chúa Trời thực hiện hành động ấy.
theological_decisions:
- issue: Nên hiểu אָדָם là tên riêng hay danh từ chung
  choice: 'Danh từ chung: “người đàn ông”'
  alternative: 'Tên riêng: “A-đam”'
  rationale: Ở giai đoạn này của trình thuật, từ này vẫn có thể là danh từ chung, và việc đặt bên cạnh “vợ ông” làm nổi bật người nam cụ thể. Chú thích bảo tồn cách hiểu tên riêng có thể có mà không giải quyết dứt khoát sự nhập nhằng của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Áo bằng da” truyền đạt cụ thể כָּתְנוֹת עוֹר mà không dùng thuật ngữ trang phục cổ ít quen thuộc. Đại từ “ông” giúp câu tự nhiên và tôn trọng trong tiếng Việt.
