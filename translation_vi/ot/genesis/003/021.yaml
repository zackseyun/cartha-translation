    rationale: Audit trail của POB chọn “Yahweh” để chuyển tự danh riêng, không dùng dạng “Jehovah”. Dùng “Yahweh” bảo đảm nhất quán với quyết định thuật ngữ của dự án.
  - severity: low
    issue: Số nhiều của כָּתְנוֹת chưa được thể hiện rõ và thiếu chú thích từ vựng tương ứng.
    rationale: “Áo” không nhất thiết sai vì có thể mang nghĩa tập hợp trong tiếng Việt, nhưng “những chiếc áo” phản ánh rõ số nhiều. Bổ sung neo chú thích cho từ này cũng hoàn tất các lựa chọn từ vựng có trong audit trail.
