  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: vi
  text: Con sẽ đổ mồ hôi trên mặt để có bánh ăn, cho đến khi con trở về với đất[a], vì từ đất con đã được lấy ra; vì con là bụi đất, và con sẽ trở về bụi đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “mồ hôi của mặt ngươi.” Cách nói thành ngữ hơn trong tiếng Việt: “mồ hôi trán.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: phải đổ mồ hôi mặt mới
  rationale: Giữ trực tiếp hình ảnh Hê-bơ-rơ “mồ hôi mặt”, đồng thời dùng cấu trúc tiếng Việt tự nhiên để diễn đạt phương cách và sự lao nhọc cần thiết.
- source_word: תֹּאכַל לֶחֶם
  choice: có bánh ăn
  rationale: Giữ danh từ cụ thể לֶחֶם là “bánh”; trong ngữ cảnh, bánh cũng có thể đại diện cho lương thực nói chung.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: cho đến khi con trở về với đất
  rationale: אֲדָמָה chỉ đất, đất trồng hoặc mặt đất. “Đất” tự nhiên trong tiếng Việt và duy trì mối liên hệ với nguồn gốc vật chất của con người.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: vì con đã được lấy ra từ đất
  rationale: Diễn đạt rõ quan hệ nguyên nhân và giữ thể bị động của לֻקָּחְתָּ; đại từ giống cái trong nguyên văn quy chiếu về אֲדָמָה nên được nói lại là “đất” để tránh mơ hồ trong tiếng Việt.
- source_word: עָפָר
  choice: bụi đất
  rationale: “Bụi đất” chuyển tải tự nhiên עָפָר trong tiếng Việt, vừa chỉ vật chất của đất vừa duy trì âm hưởng về sự hữu hạn và cái chết.
- source_word: תָּשׁוּב
  choice: con sẽ trở về
  rationale: Thể chưa hoàn thành ở đây công bố hậu quả chắc chắn; “sẽ trở về” là cách diễn đạt hiện đại, trang trọng và không cổ hóa.
theological_decisions:
- issue: Sự chết của con người và nguồn gốc vật chất
  choice: Câu được dịch như lời tuyên bố rằng con người sẽ trở về thể chất với đất và bụi đất, là nơi mình đã được lấy ra.
  alternative: Hiểu chủ yếu theo nghĩa ẩn dụ về sự hạ nhục.
  rationale: Ngữ cảnh trực tiếp cùng sự kết nối giữa אֲדָמָה (“đất”) và עָפָר (“bụi đất”) nghiêng mạnh về cái chết và việc thân thể trở về đất; bản dịch không thêm những khai triển giáo lý về sau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ “con” vì Đức Chúa Trời đang trực tiếp phán với người nam trong mạch văn. Giữ phép lặp “đất/bụi đất” để bảo toàn liên kết từ vựng và nhịp điệu trang nghiêm của nguyên văn.
