revisions:
- from: Con sẽ phải đổ mồ hôi mặt mới có bánh ăn, cho đến khi con trở về với đất[a], vì con đã được lấy ra từ đất; bởi con là bụi đất, và con sẽ trở về bụi đất.
  to: Con sẽ đổ mồ hôi trên mặt để có bánh ăn, cho đến khi con trở về với đất[a], vì từ đất con đã được lấy ra; vì con là bụi đất, và con sẽ trở về bụi đất.
