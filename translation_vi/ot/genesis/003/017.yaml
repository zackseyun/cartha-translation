source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: vi
  text: 'Ngài phán với A-đam[a]: “Vì con đã nghe theo lời vợ mình và đã ăn trái từ cây mà Ta đã truyền cho con: ‘Con không được ăn từ cây ấy,’ nên đất bị nguyền rủa vì con; con sẽ phải nhọc nhằn để ăn hoa lợi từ đất suốt mọi ngày của đời mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người nam”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְאָדָם
  choice: với A-đam
  rationale: Trong mạch truyện, từ này chỉ người nam cụ thể; dùng tên riêng “A-đam” là tự nhiên, đồng thời ghi chú khả năng dịch là “người nam”.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: con đã nghe theo lời vợ mình
  rationale: “Nghe theo lời” diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “nghe tiếng/lời của,” vừa hàm ý làm theo vừa không mạnh đến mức áp đặt nghĩa “vâng phục”.
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: và ăn trái của cây
  rationale: Trong tiếng Việt, “ăn trái của cây” làm rõ ý là ăn sản vật của cây chứ không ăn chính thân cây; “trái” được bổ sung theo ngữ cảnh trực tiếp.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: mà Ta đã truyền cho con rằng
  rationale: Giữ quan hệ của mệnh đề và chức năng dẫn lời của לֵאמֹר, đồng thời tránh lối diễn đạt cứng “cây mà Ta đã truyền con về nó”.
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: Con không được ăn trái của nó
  rationale: “Không được” truyền đạt rõ sức mạnh của lệnh cấm; “trái của nó” phù hợp với cách diễn đạt tự nhiên đã dùng ở vế trước.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: đất bị nguyền rủa
  rationale: “Đất” ở đây là đất canh tác; cấu trúc bị động tự nhiên trong tiếng Việt vẫn bảo toàn lời phán xét.
- source_word: בַּעֲבוּרֶךָ
  choice: vì con
  rationale: Diễn đạt quan hệ nguyên nhân, tránh sắc thái có lợi có thể nảy sinh từ cách nói “vì cớ con” trong một số văn cảnh.
- source_word: בְּעִצָּבוֹן
  choice: phải nhọc nhằn
  rationale: Từ này bao hàm đau đớn, cực nhọc và gian lao; trong bối cảnh kiếm thức ăn từ đất, “nhọc nhằn” là rõ và tự nhiên.
- source_word: תֹּאכֲלֶנָּה
  choice: mới có thức ăn từ đất
  rationale: Hậu tố giống cái quy chiếu về “đất”; ý nghĩa theo ngữ cảnh là ăn sản vật có được từ đất, không phải ăn đất theo nghĩa đen.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: suốt mọi ngày của đời mình
  rationale: Giữ được hình ảnh và nhịp trang trọng của thành ngữ Hê-bơ-rơ, thay vì rút gọn thành “suốt đời”.
theological_decisions:
- issue: Cách hiểu אָדָם trong lời phán
  choice: A-đam
  alternative: người nam
  rationale: Ngữ cảnh nói đến cá nhân cụ thể trong trình thuật Ê-đen; tuy nhiên hình thức Hê-bơ-rơ vẫn có thể được hiểu là “người nam,” nên ghi nhận trong chú thích.
- issue: Quan hệ giữa tội của A-đam và lời nguyền trên đất
  choice: đất bị nguyền rủa vì con
  alternative: đáng nguyền rủa thay đất vì cớ con
  rationale: Bản dịch giữ quan hệ nguyên nhân hay quy trách nhiệm của בַּעֲבוּרֶךָ mà không giải thích thêm bản chất thần học của lời nguyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài/Ta—con” đánh dấu lời Đức Chúa Trời phán với A-đam. Dùng “nghe theo lời” và “phải nhọc nhằn mới có thức ăn từ đất” để chuyển các thành ngữ Hê-bơ-rơ sang tiếng Việt tự nhiên mà vẫn giữ quan hệ nhân quả và sắc thái gian lao.
