  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của tiếng Hê-bơ-rơ: lời phán với «người nữ»; lối nhấn mạnh «Ta sẽ gia tăng gấp bội»; cặp «nỗi nhọc nhằn» và «sự thai nghén»; sinh con «trong đau đớn»; sự khao khát hướng đến chồng; và lời báo trước rằng chồng sẽ cai trị. «Nỗi nhọc nhằn» giữ được trường nghĩa rộng của עִצָּבוֹן, còn «trong đau đớn» phù hợp với בְּעֶצֶב. «Sinh con» truyền đạt cách dùng khái quát của בָּנִים trong ngữ cảnh này.'
  naturalness: Văn phong trang trọng, hiện đại và dễ hiểu. Cặp đại từ «Ta/ngươi» phù hợp với lời phán trực tiếp trong văn mạch Kinh Thánh. «Sự thai nghén» hơi trang trọng nhưng vẫn tự nhiên và có ích vì không ép nghĩa vào chỉ «thụ thai» hay chỉ «mang thai».
