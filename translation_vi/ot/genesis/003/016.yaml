id: GEN.3.16
reference: Genesis 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: vi
  text: 'Ngài phán với người nữ: “Ta sẽ gia tăng gấp bội nỗi nhọc nhằn và sự thai nghén của ngươi[a]; ngươi sẽ sinh con[b] trong đau đớn. Ngươi sẽ khao khát chồng mình[c], còn chồng sẽ cai trị ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự thụ thai của ngươi.” Từ Hê-bơ-rơ có thể chỉ sự thụ thai hoặc thời kỳ mang thai.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “các con trai”; tại đây có lẽ chỉ con cái hoặc dòng dõi nói chung.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “mong mỏi.” Từ Hê-bơ-rơ hiếm gặp này có nghĩa rộng; có người hiểu đó là ham muốn kiểm soát (so sánh Sáng Thế Ký 4:7), còn người khác hiểu là sự mong mỏi về tình cảm hoặc tình dục.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: người nữ
  rationale: Trong cảnh tuyên án này, danh từ chỉ người nữ nói chung; quan hệ hôn nhân chỉ được nêu rõ ở vế sau bằng אִישֵׁךְ, nên “người nữ” phù hợp hơn “người vợ” tại đây.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Ta sẽ gia tăng gấp bội
  rationale: Động từ nguyên mẫu tuyệt đối đi cùng động từ đã chia có tác dụng nhấn mạnh mức độ; cách dịch này vừa giữ lực nhấn mạnh vừa tự nhiên trong tiếng Việt.
- source_word: עִצְּבוֹנֵךְ
  choice: nỗi nhọc nhằn
  rationale: Danh từ có thể chỉ đau đớn, nhọc nhằn hoặc khổ sở. “Nỗi nhọc nhằn” giữ được phạm vi nghĩa rộng, trong khi בְּעֶצֶב ở vế sinh nở được dịch cụ thể là “trong đau đớn”.
- source_word: וְהֵרֹנֵךְ
  choice: sự thai nghén
  rationale: Từ Hê-bơ-rơ có thể chỉ sự thụ thai hoặc thời kỳ mang thai. “Sự thai nghén” tự nhiên hơn trong tiếng Việt và không thu hẹp hoàn toàn vào một thời điểm duy nhất.
- source_word: בְּעֶצֶב
  choice: trong đau đớn
  rationale: Cụm giới từ diễn tả hoàn cảnh hoặc cách thức sinh con; “trong đau đớn” sát nghĩa và tự nhiên.
- source_word: תֵּלְדִי בָנִים
  choice: ngươi sẽ sinh con
  rationale: בָנִים theo nghĩa đen là “các con trai” nhưng trong ngữ cảnh này chỉ con cái nói chung; “sinh con” truyền đạt đúng phạm vi của lời tuyên bố.
- source_word: אִישֵׁךְ
  choice: chồng mình
  rationale: Trong quan hệ với người nữ ở đây, אִישׁ mang nghĩa “chồng”; đại từ “mình” tạo lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: תְּשׁוּקָתֵךְ
  choice: ngươi sẽ khao khát
  rationale: Danh từ hiếm này chỉ sự ham muốn hoặc khát khao nhưng sắc thái cụ thể còn gây tranh luận. “Khao khát” giữ được độ rộng nghĩa mà không quyết định đó là tình dục, tình cảm, lệ thuộc hay muốn kiểm soát.
- source_word: יִמְשָׁל בָּךְ
  choice: chồng sẽ cai trị ngươi
  rationale: Động từ có nghĩa là cai trị hoặc thống trị. “Cai trị” phản ánh trực tiếp lời mô tả mà không tăng sắc thái thành “áp chế” hay biến nó thành một mệnh lệnh.
theological_decisions:
- issue: Ý nghĩa của sự “khao khát” hướng về chồng
  choice: Giữ cách diễn đạt rộng là “khao khát chồng mình.”
  alternative: Ham muốn tình dục; mong mỏi quan hệ hoặc lệ thuộc; muốn kiểm soát, dựa trên đối chiếu với Sáng Thế Ký 4:7.
  rationale: תְּשׁוּקָה xuất hiện rất ít và ngữ cảnh không buộc phải chọn một sắc thái duy nhất. Bản văn chính vì thế giữ nguyên sự mơ hồ thực sự, còn các cách hiểu được nêu trong chú thích.
- issue: Lời “chồng sẽ cai trị ngươi” mang tính mô tả hay quy định
  choice: 'Dịch như lời báo trước về thực trạng sau khi sa ngã: “chồng sẽ cai trị ngươi.”'
  alternative: Hiểu như một quy định ngầm về thẩm quyền của người nam.
  rationale: Hình thái động từ Hê-bơ-rơ nói điều sẽ xảy ra chứ không trực tiếp truyền lệnh về điều phải xảy ra. Bản dịch không biến câu mô tả thành một quy phạm thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/ngươi” duy trì sắc thái lời phán trực tiếp trong văn phong Kinh Thánh mà không dùng từ cổ khó hiểu. Các vế giữ cấu trúc song song và sự căng thẳng thần học của nguyên văn.
