  rationale: Bổ sung liên từ “và” để phản ánh đầy đủ cấu trúc lặp “giữa ... và giữa ...” của nguyên văn; thêm “của” trước “người nữ” ở vế thứ hai để quan hệ sở hữu tự nhiên và rõ ràng hơn trong tiếng Việt. Các lựa chọn từ vựng và toàn bộ hệ thống chú thích được giữ nguyên vì đã truyền đạt đúng tính tập hợp/cá nhân của זֶרַע và sự lặp lại của động từ שׁוּף.
