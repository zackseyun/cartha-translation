source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: vi
  text: 'Ta sẽ đặt sự thù nghịch[a] giữa ngươi và người nữ,


    và giữa dòng dõi[b] ngươi và dòng dõi của người nữ;


    người ấy[c] sẽ nghiền nát đầu ngươi[d],


    còn ngươi sẽ làm bị thương gót chân người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự đối địch”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “hạt giống” ở cả hai chỗ; từ này có thể chỉ chung các hậu duệ hoặc chỉ một cá nhân đại diện.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể hiểu là “dòng dõi ấy”. Đại từ Hê-bơ-rơ ở giống đực số ít nhưng theo sau một danh từ tập hợp.
    reason: alternative_reading
  - marker: d
    text: Nguyên văn dùng cùng một động từ trong cả hai vế. Động từ này có thể được dịch là “đánh” hoặc “làm bị thương”; “nghiền nát” ở vế đầu diễn tả mức độ nghiêm trọng hơn của một đòn nhằm vào đầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: sự thù nghịch
  rationale: Diễn tả tình trạng đối địch sâu sắc và kéo dài; trang trọng nhưng vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אָשִׁית
  choice: Ta sẽ đặt
  rationale: Phản ánh nghĩa thông thường của động từ שׂים là đặt, để hoặc thiết lập; “đặt” tự nhiên trong cấu trúc này.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: giữa ngươi và người nữ
  rationale: Giữ nguyên quan hệ đối ứng và cấu trúc song song của tiếng Hê-bơ-rơ.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: dòng dõi ngươi ... dòng dõi người nữ
  rationale: “Dòng dõi” là cách diễn đạt tự nhiên trong tiếng Việt cho danh từ tập hợp זֶרַע khi chỉ con cháu. Việc lặp lại cùng một từ giữ sự song song giữa hai phía; chú thích nêu nghĩa đen “hạt giống” và khả năng vừa chỉ tập thể vừa chỉ một cá nhân đại diện.
- source_word: הוּא
  choice: người ấy
  rationale: Đại từ Hê-bơ-rơ ở giống đực số ít và theo sau danh từ tập hợp “dòng dõi”. “Người ấy” giữ rõ khả năng quy chiếu đến một cá nhân đại diện mà không đưa một cách giải thích thần học cụ thể vào bản văn.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: sẽ nghiền nát ... sẽ làm bị thương
  rationale: Cùng một động từ hiếm được dùng trong cả hai vế, nhưng hai bộ phận bị tác động—đầu và gót chân—gợi mức độ tổn hại không ngang nhau. Cách dịch này thể hiện sự bất cân xứng ấy; chú thích bảo lưu sự lặp từ và phạm vi nghĩa không chắc chắn của động từ.
- source_word: רֹאשׁ
  choice: đầu
  rationale: Cách dịch trực tiếp và tự nhiên của danh từ chỉ bộ phận cơ thể.
- source_word: עָקֵב
  choice: gót chân
  rationale: Cách dịch trực tiếp và tự nhiên của danh từ chỉ bộ phận cơ thể.
theological_decisions:
- issue: “Dòng dõi” của người nữ mang nghĩa tập thể hay chỉ một cá nhân đại diện
  choice: Dịch זֶרַע bằng cùng một từ “dòng dõi” ở cả hai chỗ và dịch הוּא bằng “người ấy”
  alternative: Dịch hoàn toàn theo nghĩa tập thể là “con cháu ... họ”, hoặc dùng một đại từ không xác định rõ cá nhân
  rationale: Tiếng Hê-bơ-rơ dùng một danh từ tập hợp ở cả hai chỗ rồi nối bằng đại từ giống đực số ít. Bản dịch giữ đồng thời chiều kích tập thể và khả năng về một cá nhân đại diện, nhưng không xác quyết một diễn giải Đấng Mê-si trong chính câu dịch.
- issue: Mức độ mạnh của động từ שׁוּף trong hai vế
  choice: “nghiền nát” đối với đầu và “làm bị thương” đối với gót chân
  alternative: Dùng cùng một động từ “đánh” hoặc “làm bầm” trong cả hai vế
  rationale: Nguyên văn lặp cùng một động từ hiếm, nhưng sự đối lập giữa vết thương ở đầu và ở gót chân hàm ý hậu quả khác nhau. Chú thích làm rõ rằng sự khác biệt trong lời dịch không bắt nguồn từ hai động từ Hê-bơ-rơ khác nhau.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp với lời phán trực tiếp của Đức Chúa Trời. Dùng “Ta/ngươi” để giữ sắc thái uy nghiêm và quan hệ ngôi thứ trong ngữ cảnh cổ, nhưng tránh từ ngữ quá cổ. Nhịp câu song song được giữ để phản ánh cấu trúc Hê-bơ-rơ.
