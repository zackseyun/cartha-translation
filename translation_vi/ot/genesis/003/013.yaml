id: GEN.3.13
reference: Genesis 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֧ה אֱלֹהִ֛ים לָ/אִשָּׁ֖ה מַה זֹּ֣את עָשִׂ֑ית וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה הַ/נָּחָ֥שׁ הִשִּׁיאַ֖/נִי וָ/אֹכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh Đức Chúa Trời phán với người phụ nữ: “Ngươi đã làm điều gì thế này?” Người phụ nữ thưa: “Con rắn đã lừa dối tôi[a], và tôi đã ăn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã dụ dỗ tôi” hoặc “đã đánh lừa tôi.” Động từ Hebrew có thể chỉ việc lừa dối hay khiến một người lầm lạc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó giữ cấu trúc danh xưng יְהוָה אֱלֹהִים.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Đây là cách gọi trang trọng, quen thuộc và dễ hiểu trong tiếng Việt hiện đại; trong cụm này, từ được đặt sau danh riêng Yahweh.
- source_word: לָאִשָּׁה
  choice: với người phụ nữ
  rationale: אִשָּׁה có thể là “người phụ nữ” hoặc “người vợ”; cách dịch này phù hợp với cách nhân vật được gọi trong mạch kể trực tiếp và không nhấn mạnh thêm quan hệ hôn nhân.
- source_word: מַה זֹּאת עָשִׂית
  choice: Ngươi đã làm gì vậy?
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ cả ý nghi vấn “gì” và sắc thái chỉ việc vừa được thực hiện của זֹאת, mà không đổi câu hỏi thành “Tại sao”.
- source_word: הַנָּחָשׁ
  choice: con rắn
  rationale: “Con rắn” là cách gọi tự nhiên, chính xác và phổ thông trong tiếng Việt, đồng thời phù hợp với nhân vật đã xuất hiện trong câu chuyện.
- source_word: הִשִּׁיאַנִי
  choice: đã lừa dối tôi
  rationale: Động từ chỉ việc khiến ai đó lầm lạc bằng sự dối trá hoặc đánh lừa; “lừa dối” rõ nghĩa, hiện đại và không thêm sắc thái không chắc chắn từ nguyên văn.
- source_word: וָאֹכֵל
  choice: và tôi đã ăn
  rationale: Giữ quan hệ nối tiếp đơn giản của waw; không chuyển thành “nên tôi đã ăn,” vốn sẽ làm sắc thái nguyên nhân trở nên rõ hơn nguyên văn.
theological_decisions:
- issue: Lời người phụ nữ mô tả hành động của con rắn
  choice: Con rắn đã lừa dối tôi
  alternative: Con rắn đã dụ dỗ tôi
  rationale: “Lừa dối” giữ trọng tâm của động từ Hebrew là đánh lừa hoặc dẫn đến nhận định sai. “Dụ dỗ” có thể nhấn mạnh sự hấp dẫn, cám dỗ hơn mức động từ tự nó đòi hỏi, nên được ghi như một khả năng thay thế chứ không đưa vào chính văn.
- issue: Quan hệ giữa sự lừa dối và việc ăn
  choice: và tôi đã ăn
  alternative: nên tôi đã ăn
  rationale: Nguyên văn nối hai mệnh đề bằng waw. Dịch “và” giữ được sự nối tiếp mà không quyết định quá mức rằng mệnh đề sau phải được hiểu hoàn toàn như kết quả nhân quả của mệnh đề trước.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Phán” và “thưa” thể hiện hoàn cảnh đối thoại với Đức Chúa Trời; đại từ “ngươi” giữ sắc thái trang trọng của lời chất vấn, còn lời đáp dùng “tôi” để tránh thêm vào nguyên văn một quan hệ xưng hô cụ thể. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
