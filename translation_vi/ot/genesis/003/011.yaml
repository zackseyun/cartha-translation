  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: vi
  text: 'Ngài phán: “Ai đã nói cho con biết rằng con trần truồng? Có phải con đã ăn từ cây mà Ta đã truyền cho con không được ăn từ đó không?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngài phán
  rationale: Động từ wayyiqtol tiếp nối mạch kể chuyện. Tiếng Việt có thể lược liên từ; “phán” là cách diễn đạt trang trọng, tự nhiên cho lời Đức Chúa Trời.
- source_word: מִי הִגִּיד לְךָ
  choice: Ai đã nói cho con biết
  rationale: נגד ở Hiphil có nghĩa là nói, báo hoặc cho biết; cụm này vừa tự nhiên vừa chuyển tải rõ ý khiến người nghe biết điều gì.
- source_word: כִּי עֵירֹם אָתָּה
  choice: rằng con trần truồng
  rationale: כִּי dẫn nội dung lời thông báo; עֵירֹם chỉ tình trạng không mặc quần áo. Tiếng Việt không cần biểu thị thì ở vị ngữ này.
- source_word: הֲמִן הָעֵץ
  choice: Có phải con đã ăn trái từ cây
  rationale: הֲ mở câu hỏi có-không và מן biểu thị nguồn. Thêm “trái” theo hàm ý tự nhiên của hành động ăn từ cây, không xác định loại trái.
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: mà Ta đã truyền cho con
  rationale: Mệnh đề quan hệ bổ nghĩa cho “cây”; “truyền” giữ sắc thái mệnh lệnh của צוה.
- source_word: לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: không được ăn
  rationale: לְבִלְתִּי cộng nguyên mẫu diễn tả điều bị cấm; tiếng Việt tự nhiên không cần lặp lại “từ nó” vì quan hệ với cây đã rõ.
- source_word: אָכָלְתָּ
  choice: đã ăn
  rationale: Qal hoàn thành ngôi hai giống đực số ít chỉ hành động đã xảy ra; “đã” phù hợp với câu hỏi về hành vi vừa qua.
theological_decisions:
- issue: Chủ ngữ giống đực số ít không được nêu danh trong câu
  choice: Ngài
  alternative: Đức Chúa Trời
  rationale: Nguyên văn chỉ có động từ ngôi ba giống đực số ít; ngữ cảnh xác định người nói là Đức Chúa Trời nhưng câu này không nhắc lại danh xưng. “Ngài” giữ sự quy chiếu mà không thêm danh vào câu.
- issue: Cách xưng hô giữa Đức Chúa Trời và người nam
  choice: Ta–con
  alternative: Ta–ngươi
  rationale: “Ta–con” trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại, đồng thời thể hiện quan hệ giữa Đấng Tạo Hóa và con người mà không làm lời hỏi trở nên miệt thị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài phán” cho lời Đức Chúa Trời; giữ hai câu hỏi trực tiếp. Không thêm tên Đức Chúa Trời vì chủ ngữ không được nêu lại trong nguyên văn.
