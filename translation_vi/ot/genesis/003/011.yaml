- from: 'Ngài phán: “Ai đã nói cho con biết rằng con trần truồng? Có phải con đã ăn trái từ cây mà Ta đã truyền cho con không được ăn không?”'
  to: 'Ngài phán: “Ai đã nói cho con biết rằng con trần truồng? Có phải con đã ăn từ cây mà Ta đã truyền cho con không được ăn từ đó không?”'
