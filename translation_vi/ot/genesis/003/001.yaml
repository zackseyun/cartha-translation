  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: vi
  text: 'Con rắn xảo quyệt hơn mọi loài thú ngoài đồng mà Yahweh Đức Chúa Trời đã làm nên.[a] Nó nói với người nữ: “Có thật Đức Chúa Trời[b] đã phán rằng: ‘Các ngươi không được ăn trái của bất cứ cây nào trong vườn[c]’ không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tinh ranh” hoặc “láu lỉnh.” Từ Hê-bơ-rơ này trong một số văn cảnh có thể chỉ sự khôn ngoan, nhưng tại đây mang sắc thái đánh lừa.
    reason: lexical_alternative
  - marker: b
    text: Người kể dùng “Yahweh Đức Chúa Trời,” nhưng con rắn chỉ nói “Đức Chúa Trời,” đúng theo sự thay đổi cách gọi trong tiếng Hê-bơ-rơ.
    reason: alternative_reading
  - marker: c
    text: Cũng có thể dịch là “từ mọi cây trong vườn.” Trong câu hỏi phủ định này, “bất cứ cây nào” diễn đạt rõ nhất việc con rắn phóng đại điều Đức Chúa Trời đã truyền.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: Con rắn
  rationale: Danh từ xác định הַנָּחָשׁ là “con rắn.” Không thêm “bấy giờ” vì nguyên văn không có từ chỉ thời gian; liên từ וְ được thể hiện tự nhiên qua mạch kể.
- source_word: עָרוּם
  choice: xảo quyệt
  rationale: Từ này có thể chỉ sự khôn ngoan, tinh ranh hoặc láu lỉnh tùy văn cảnh. Ở đây, lời chất vấn mang tính đánh lừa khiến “xảo quyệt” chuyển tải đúng sắc thái tiêu cực mà không thêm một sự đồng nhất thần học nào.
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: hơn mọi loài thú đồng
  rationale: מִן tạo ý so sánh “hơn,” còn חַיַּת הַשָּׂדֶה chỉ các loài vật ở ngoài đồng. “Thú đồng” ngắn gọn, trang trọng và giữ hình ảnh của tiếng Hê-bơ-rơ.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Đức Chúa Trời
  rationale: Giữ danh riêng giao ước יְהוָה là “Yahweh” và danh xưng אֱלֹהִים là “Đức Chúa Trời,” đồng thời bảo tồn cấu trúc danh xưng kép.
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: Nó nói với người nữ
  rationale: Chủ thể vẫn là con rắn; “nó” tự nhiên trong tiếng Việt. “Người nữ” giữ cách gọi của nguyên văn, không gọi bà là Ê-va trước khi bản văn dùng tên ấy.
- source_word: אַף כִּי אָמַר אֱלֹהִים
  choice: Có thật Đức Chúa Trời đã phán rằng
  rationale: אַף כִּי mở đầu một câu hỏi có tính hoài nghi, gợi ý. “Có thật ... đã phán rằng” vừa tự nhiên vừa giữ lực chất vấn, còn אֱלֹהִים ở lời con rắn chỉ là “Đức Chúa Trời,” không phải danh xưng kép của người kể.
- source_word: לֹא תֹאכְלוּ
  choice: Các ngươi không được ăn
  rationale: Động từ ở số nhiều; “các ngươi” giữ số nhiều của lời cấm được trích dẫn. “Không được” diễn đạt tự nhiên hiệu lực ngăn cấm.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: trái của bất cứ cây nào trong vườn
  rationale: Trong phạm vi phủ định, מִכֹּל tự nhiên mang nghĩa “bất cứ ... nào.” Tiếng Việt cần nêu vật được ăn; “trái của” diễn đạt tự nhiên ý ăn từ cây mà không thay đổi đối tượng bị cấm.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng danh riêng “Yahweh” để giữ trực tiếp danh giao ước trong lời người kể, thay vì thay bằng một tước hiệu.
- issue: Sự thay đổi cách gọi Đức Chúa Trời giữa người kể và con rắn
  choice: Người kể dùng “Yahweh Đức Chúa Trời”; con rắn chỉ dùng “Đức Chúa Trời”
  alternative: Đồng nhất cả hai thành “Yahweh Đức Chúa Trời” hoặc “Đức Chúa Trời”
  rationale: Nguyên văn chủ ý dùng יְהוָה אֱלֹהִים trong lời kể nhưng chỉ dùng אֱלֹהִים trong câu nói của con rắn; bản dịch không san bằng khác biệt ấy.
- issue: Sắc thái đạo đức của עָרוּם
  choice: xảo quyệt
  alternative: khôn ngoan; tinh ranh; láu lỉnh
  rationale: Từ Hê-bơ-rơ có thể mang sắc thái tích cực hoặc tiêu cực, nhưng văn cảnh ngay sau đó là một lời chất vấn đánh lừa. “Xảo quyệt” phản ánh sắc thái tại đây mà không đưa các nhận diện thần học về sau vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thú đồng” giữ sắc thái Kinh Thánh nhưng vẫn rõ nghĩa; “các ngươi” được dùng để bảo tồn số nhiều của động từ Hê-bơ-rơ. Câu hỏi của con rắn được diễn đạt tự nhiên bằng “Có thật ... không?” mà vẫn giữ tính hoài nghi, gợi ý của nguyên văn.
