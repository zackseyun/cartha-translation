  to: 'Con rắn xảo quyệt hơn mọi loài thú ngoài đồng mà Yahweh Đức Chúa Trời đã làm nên.[a] Nó nói với người nữ: “Có thật Đức Chúa Trời[b] đã phán rằng: ‘Các ngươi không được ăn trái của bất cứ cây nào trong vườn[c]’ không?”'
  rationale: Bản sửa loại bỏ sắc thái không được nêu rõ bởi nguyên văn, dùng cách gọi tự nhiên hơn cho các loài vật ở ngoài đồng, hiệu chỉnh nội dung chú thích c cho sát tiếng Hê-bơ-rơ, và chuyển neo chú thích b đến đúng danh xưng mà chú thích giải thích. Ý nghĩa của câu và tính mơ hồ/giọng điệu gợi ý của câu hỏi vẫn được giữ nguyên.
