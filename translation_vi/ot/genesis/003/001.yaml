  - severity: low
    issue: Vị trí neo chú thích b
    rationale: Chú thích nói về sự thay đổi từ danh xưng kép sang chỉ “Đức Chúa Trời”, nên cần đặt ngay sau “Đức Chúa Trời” thay vì sau “rằng”.
