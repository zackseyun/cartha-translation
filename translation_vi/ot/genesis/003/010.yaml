  text: וַ/יֹּ֕אמֶר אֶת קֹלְ/ךָ֥ שָׁמַ֖עְתִּי בַּ/גָּ֑ן וָ/אִירָ֛א כִּֽי עֵירֹ֥ם אָנֹ֖כִי וָ/אֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: vi
  text: 'Người đáp: “Con đã nghe tiếng Ngài trong vườn, và con sợ vì con trần truồng, nên con ẩn mình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Người đáp
  rationale: Trong mạch đối thoại, động từ אמר mở đầu lời trả lời của người nam; “đáp” tự nhiên trong tiếng Việt và không làm thay đổi nội dung.
- source_word: אֶת קֹלְךָ
  choice: tiếng Ngài
  rationale: קוֹל có thể chỉ tiếng, âm thanh hoặc giọng nói. “Tiếng Ngài” là cách diễn đạt tự nhiên, đủ rộng để không buộc phải hiểu là lời nói thành tiếng.
- source_word: שָׁמַעְתִּי
  choice: con đã nghe
  rationale: Diễn đạt trực tiếp động từ שמע ở thể hoàn thành ngôi thứ nhất số ít; “đã” phù hợp với lời thuật lại một việc vừa xảy ra.
- source_word: בַּגָּן
  choice: trong vườn
  rationale: Giữ nguyên địa điểm đã được xác lập trong văn cảnh; tiếng Việt không cần biểu thị riêng mạo từ xác định.
- source_word: וָאִירָא
  choice: nên con sợ
  rationale: ירא ở đây diễn tả nỗi sợ. “Nên” thể hiện tự nhiên quan hệ tiếp nối từ việc nghe đến phản ứng sợ hãi.
- source_word: כִּי
  choice: vì
  rationale: כִּי nêu nguyên nhân của nỗi sợ, nên “vì” truyền đạt rõ lực nhân quả.
- source_word: עֵירֹם אָנֹכִי
  choice: con trần truồng
  rationale: Mệnh đề danh từ Hê-bơ-rơ không đánh dấu thì. Tiếng Việt cũng không cần thêm “đã” hay “đang”, nhờ đó giữ được tính không xác định về thời của nguyên văn.
- source_word: וָאֵחָבֵא
  choice: bởi vậy, con ẩn mình
  rationale: Dạng động từ mang nghĩa phản thân là tự giấu mình. “Bởi vậy” làm rõ kết quả vốn hàm ý trong chuỗi hành động mà không thêm nội dung thần học.
theological_decisions:
- issue: Nghĩa của קוֹל liên quan đến sự hiện diện của Đức Chúa Trời
  choice: tiếng Ngài
  alternative: giọng Ngài; âm thanh của Ngài
  rationale: Nguyên ngữ có thể nói đến tiếng nói hoặc âm thanh nói chung. “Tiếng Ngài” giữ được độ rộng ngữ nghĩa và không quyết định rằng người nam đã nghe lời nói rõ ràng ở thời điểm này.
- issue: Thời tính của עֵירֹם אָנֹכִי
  choice: con trần truồng
  alternative: con đã trần truồng; con đang trần truồng
  rationale: Mệnh đề Hê-bơ-rơ không có động từ chia thì. Bản dịch không thêm dấu hiệu thời để bảo toàn sự không xác định của cấu trúc nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “con” khi người nam thưa với Đức Chúa Trời và “Ngài” để chỉ Đức Chúa Trời. Không cần chú thích cho קוֹל vì “tiếng” trong tiếng Việt tự nhiên bao quát cả âm thanh lẫn giọng nói.
