base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: vi
  text: 'Rồi Yahweh Đức Chúa Trời gọi người đàn ông và phán với ông: “Ngươi ở đâu?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: Động từ קרא ở thể Qal trong mạch kể chuyện có nghĩa là gọi; cách dịch này tự nhiên và không thêm sắc thái triệu tập không bắt buộc.
- source_word: יְהוָה אֱלֹהִים
  choice: Giê-hô-va Đức Chúa Trời
  rationale: Giữ danh riêng giao ước יְהוָה dưới dạng tiếng Việt quen dùng “Giê-hô-va,” đồng thời dịch אֱלֹהִים là “Đức Chúa Trời.”
- source_word: הָאָדָם
  choice: người đàn ông
  rationale: Trong ngữ cảnh trực tiếp, từ này chỉ người nam cụ thể đang được gọi, chứ không phải toàn thể loài người.
- source_word: וַיֹּאמֶר לוֹ
  choice: và phán với ông
  rationale: Giữ đại từ bổ ngữ לוֹ; dùng “phán” phù hợp với lời nói của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: אַיֶּכָּה
  choice: Ngươi ở đâu?
  rationale: Đây là câu hỏi trực tiếp ở ngôi thứ hai giống đực số ít; “Ngươi” giữ sắc thái trực tiếp, trang trọng của lời thần linh phán với con người.
- source_word: וַ
  choice: Rồi
  rationale: Diễn đạt tự nhiên sự tiếp nối trong trình thuật của waw liên tiếp.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Giê-hô-va
  alternative: Yahweh
  rationale: Bản nguồn dùng trực tiếp Tetragrammaton. “Giê-hô-va” là dạng danh riêng đã quen thuộc trong tiếng Việt; “Yahweh” gần với cách phục dựng phát âm hiện đại hơn nhưng kém tự nhiên hơn đối với nhiều độc giả phổ thông Việt ngữ.
- issue: Sở chỉ của הָאָדָם
  choice: người đàn ông
  alternative: con người
  rationale: Trong cảnh này, Đức Chúa Trời đang hỏi một nhân vật nam cụ thể; không khái quát hóa thành nhân loại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời và “ngươi” trong lời trực tiếp để giữ sắc thái Kinh Thánh trang nghiêm mà không làm câu văn cổ kính quá mức.
