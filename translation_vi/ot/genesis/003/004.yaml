  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: vi
  text: 'Nhưng con rắn nói với người nữ: “Chắc chắn các ngươi sẽ không chết[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dùng một cấu trúc nhấn mạnh với động từ “chết”, diễn tả lời phủ nhận dứt khoát: “chắc chắn sẽ không chết”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng ... nói
  rationale: Tiền tố liên kết tiếp diễn câu chuyện, nhưng ở đây lời con rắn trực tiếp đối nghịch với lời cảnh báo trước đó của Đức Chúa Trời; “Nhưng” diễn đạt đúng chức năng tương phản trong ngữ cảnh.
- source_word: הַנָּחָשׁ
  choice: con rắn
  rationale: נָחָשׁ chỉ rắn; “con rắn” là cách gọi tự nhiên, rõ ràng và phù hợp với mạch kể tiếng Việt hiện đại.
- source_word: אֶל הָאִשָּׁה
  choice: với người nữ
  rationale: אֶל đánh dấu người tiếp nhận lời nói; אִשָּׁה ở đây được hiểu là “người nữ”, giữ cách gọi nhất quán trong trình thuật trước khi bà được đặt tên, thay vì thu hẹp thành “người vợ”.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: Chắc chắn các ngươi sẽ không chết
  rationale: Động từ nguyên mẫu tuyệt đối מוֹת đi với động từ hữu hạn תְּמֻתוּן tạo sắc thái nhấn mạnh. Đặt “chắc chắn” ở đầu câu làm rõ rằng đây là lời phủ nhận dứt khoát, không phải hàm ý rằng cái chết chỉ là điều thiếu chắc chắn. Đại từ “các ngươi” giữ số nhiều của תְּמֻתוּן.
theological_decisions:
- issue: Mức độ dứt khoát trong lời phủ nhận của con rắn
  choice: “Chắc chắn các ngươi sẽ không chết”
  alternative: “Các ngươi không chắc sẽ chết” hoặc “Các ngươi sẽ không chết”
  rationale: Cấu trúc Hê-bơ-rơ phủ định cả tổ hợp nhấn mạnh và tạo thành sự bác bỏ thẳng thừng lời cảnh báo ở Sáng Thế Ký 2:17. Bản dịch giữ sức nặng của lời phủ nhận nhưng không giải thích thêm cái chết là tức thời hay về sau.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. “Người nữ” giữ mô-típ văn chương của phân đoạn; “các ngươi” tuy trang trọng hơn khẩu ngữ nhưng thể hiện rõ ngôi thứ hai số nhiều trong nguyên văn. Dấu [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
