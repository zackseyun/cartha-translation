  text: וַ/תִּפָּקַ֨חְנָה֙ עֵינֵ֣י שְׁנֵי/הֶ֔ם וַ/יֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽ/יִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַ/יַּעֲשׂ֥וּ לָ/הֶ֖ם חֲגֹרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: vi
  text: Bấy giờ, mắt của cả hai người đều mở ra, và họ biết mình trần truồng. Họ bèn khâu các lá vả lại với nhau và làm cho mình những vật che thân[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ vật được thắt hoặc quấn quanh thân; cũng có thể dịch là “khố” hoặc “vật quấn ngang hông”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: mở ra
  rationale: Dạng Nifal diễn tả mắt được mở ra; cách nói này giữ nguyên hình ảnh và không giải thích quá mức bản chất nhận thức mới của họ.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: mắt cả hai người
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ sự nhấn mạnh rằng điều này xảy đến với cả hai.
- source_word: וַיֵּדְעוּ
  choice: họ biết
  rationale: Giữ nghĩa trực tiếp của ידע và tránh thêm ý như 'xấu hổ' hay 'ý thức' vốn không được nói rõ trong câu.
- source_word: עֵירֻמִּם
  choice: trần truồng
  rationale: Tương ứng trực tiếp với tính từ Hê-bơ-rơ và duy trì liên hệ với Sáng Thế Ký 2:25.
- source_word: וַיִּתְפְּרוּ עֲלֵה תְאֵנָה
  choice: khâu lá vả lại
  rationale: '''Lá vả'' là cách gọi tự nhiên của lá cây fig trong tiếng Việt; ''khâu ... lại'' chuyển tải hành động kết lá thành vật che thân.'
- source_word: חֲגֹרֹת
  choice: khố che thân
  rationale: Danh từ chỉ vật được quấn hoặc thắt quanh thân. 'Khố che thân' rõ nghĩa trong tiếng Việt nhưng vẫn được chú thích vì hình dạng chính xác của vật này không được xác định hoàn toàn.
theological_decisions:
- issue: Mối liên hệ giữa việc mắt mở ra, sự trần truồng và sự xấu hổ
  choice: 'Dịch theo lối mô tả: mắt họ mở ra và họ biết mình trần truồng.'
  alternative: Thêm rằng họ cảm thấy xấu hổ hoặc lương tâm họ thức tỉnh.
  rationale: Câu văn gợi đến sự tự ý thức đã thay đổi nhưng không trực tiếp nói 'xấu hổ' hay giải thích cơ chế thần học của sự thay đổi ấy.
- issue: Nghĩa cụ thể của חֲגֹרֹת
  choice: khố che thân
  alternative: tấm che; tạp dề; vật quấn ngang hông
  rationale: Vật này được thắt quanh thân, nhưng hình dạng chính xác không rõ; bản dịch dùng một cách gọi dễ hiểu và ghi nhận các khả năng khác trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Bấy giờ” để nối diễn tiến kể chuyện; không thêm ý xấu hổ hay phán đoán thần học ngoài điều câu Hê-bơ-rơ trực tiếp nói.
