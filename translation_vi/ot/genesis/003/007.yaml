revisions:
- from: Bấy giờ, mắt cả hai người đều mở ra, và họ biết mình trần truồng. Họ bèn khâu lá vả lại và làm khố che thân[a].
  to: Bấy giờ, mắt của cả hai người đều mở ra, và họ biết mình trần truồng. Họ bèn khâu các lá vả lại với nhau và làm cho mình những vật che thân[a].
  rationale: Bản sửa cải thiện tính tự nhiên của tiếng Việt và làm rõ hành động khâu các lá lại với nhau. Quan trọng hơn, “những vật che thân” tránh xác định quá mức hình dạng của חֲגֹרֹת, trong khi chú thích ghi nhận các cách hiểu cụ thể hơn. Không thêm ý xấu hổ hay giải thích thần học ngoài câu gốc.
