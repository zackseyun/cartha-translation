  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: vi
  text: 'Rồi Yahweh Đức Chúa Trời phán: “Này, người ấy đã trở nên như một trong chúng ta[a], biết điều thiện và điều ác. Bây giờ, kẻo người ấy giơ tay ra, cũng lấy quả từ cây sự sống mà ăn và sống mãi—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “như một trong chúng ta”. Đại từ số nhiều “chúng ta” được giữ nguyên; có nhiều cách hiểu, chẳng hạn ngôn ngữ về hội đồng thiên thượng, số nhiều dùng khi cân nhắc, hoặc sự gợi mở về tính đa ngôi trong Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Đức Chúa Trời
  rationale: Giữ nguyên danh riêng Yahweh và dịch אֱלֹהִים bằng cách gọi trang trọng, quen thuộc trong tiếng Việt; cả cụm thể hiện quan hệ đồng vị của nguyên văn.
- source_word: הֵן
  choice: Này
  rationale: Giữ sắc thái chỉ thị, gây chú ý và trang trọng của thán từ Hê-bơ-rơ mà vẫn tự nhiên trong lời phán.
- source_word: הָאָדָם
  choice: con người
  rationale: Trong ngữ cảnh này từ có mạo từ chỉ cá nhân vừa được nhắc đến; “con người” vẫn chỉ người ấy, đồng thời bảo lưu sự liên hệ từ vựng với אָדָם mà không biến thành tên riêng.
- source_word: הָיָה
  choice: đã trở nên
  rationale: Diễn đạt trạng thái kết quả sau hành vi phạm lệnh, tương ứng với thể hoàn thành trong ngữ cảnh.
- source_word: כְּאַחַד מִמֶּנּוּ
  choice: như một trong chúng ta
  rationale: Dịch trực tiếp cấu trúc so sánh và giữ nguyên đại từ số nhiều, không giải thích theo một lập trường thần học riêng.
- source_word: לָדַעַת טוֹב וָרָע
  choice: biết điều thiện và điều ác
  rationale: Giữ phạm vi nhận thức–đạo đức của thành ngữ; “điều thiện và điều ác” tự nhiên và trang trọng trong tiếng Việt.
- source_word: וְעַתָּה פֶּן
  choice: Bây giờ, e rằng
  rationale: Giữ bước chuyển diễn ngôn cùng sắc thái phòng ngừa của פֶּן; cách nói này cho phép bảo lưu mệnh đề bỏ lửng.
- source_word: יִשְׁלַח יָדוֹ
  choice: sẽ giơ tay ra
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ và diễn đạt tự nhiên trong tiếng Việt.
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים
  choice: cũng hái trái từ cây sự sống
  rationale: “Cũng” giữ lực bổ sung của גַּם. Động từ “hái” phù hợp hành động lấy từ cây; thêm “trái” như bổ ngữ ngầm hiển nhiên trong tiếng Việt để tránh cách nói gượng “lấy từ cây”.
- source_word: וָחַי לְעֹלָם
  choice: và sống mãi
  rationale: Diễn đạt ngắn gọn, tự nhiên ý sống đến vô hạn của לְעֹלָם trong ngữ cảnh.
theological_decisions:
- issue: Đại từ số nhiều trong “như một trong chúng ta”
  choice: Giữ nguyên “chúng ta” mà không diễn giải thêm trong chính văn.
  alternative: Giải thích là hội đồng thiên thượng, số nhiều cân nhắc/tôn nghiêm, hoặc sự đa ngôi trong Đức Chúa Trời.
  rationale: Nguyên văn dùng hậu tố ngôi thứ nhất số nhiều. Bản dịch cần giữ sự đa nghĩa và sức căng thần học thay vì quyết định thay cho độc giả.
- issue: Câu nói của Đức Chúa Trời kết thúc đột ngột
  choice: Dùng dấu gạch ngang sau “sống mãi—”.
  alternative: Hoàn chỉnh câu bằng một vế kết quả được suy ra hoặc kết thúc câu như một phát biểu trọn vẹn.
  rationale: Cấu trúc Hê-bơ-rơ bỏ lửng sau mệnh đề phòng ngừa, rồi hành động tiếp diễn ở câu kế. Dấu gạch ngang bảo lưu sự gián đoạn mà không thêm nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời của Đức Chúa Trời, “điều thiện và điều ác” để duy trì sắc thái đạo đức, và dấu gạch ngang để giữ nguyên câu nói bỏ lửng. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
