  to: 'Rồi Yahweh Đức Chúa Trời phán: “Này, người ấy đã trở nên như một trong chúng ta[a], biết điều thiện và điều ác. Bây giờ, kẻo người ấy giơ tay ra, cũng lấy quả từ cây sự sống mà ăn và sống mãi—”'
  rationale: Bản sửa làm rõ quy chiếu cá nhân của הָאָדָם, giữ động từ “lấy” gần với לָקַח, và dùng “kẻo” cho פֶּן. Không thay đổi đại từ số nhiều, thuật ngữ thần học chủ yếu, hay tính bỏ lửng của lời phán.
