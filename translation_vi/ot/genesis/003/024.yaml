  source_fidelity: 'Bản dịch truyền đạt đúng các hành động chính: đuổi người nam/nhân vật ấy ra, đặt các chê-ru-bim ở phía đông vườn Ê-đen, và canh giữ lối đến cây sự sống. Tuy nhiên, cách đặt cụm “ngọn lửa của thanh gươm xoay mọi hướng” chưa làm rõ một cách tự nhiên quan hệ cú pháp khó của tiếng Hê-bơ-rơ: danh từ “thanh gươm” là thành tố được bổ nghĩa bởi phân từ “đang/tự xoay.”'
