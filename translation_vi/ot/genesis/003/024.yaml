  to: Vậy Ngài đuổi con người ra. Ở phía đông vườn Ê-đen, Ngài đặt các chê-ru-bim và ngọn lửa của thanh gươm đang tự xoay mọi hướng[a] để canh giữ con đường dẫn đến cây sự sống.
