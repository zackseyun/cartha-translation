base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: vi
  text: Vậy Ngài đuổi con người ra. Ở phía đông vườn Ê-đen, Ngài đặt các chê-ru-bim và ngọn lửa của thanh gươm đang tự xoay mọi hướng[a] để canh giữ con đường dẫn đến cây sự sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “ngọn lửa của thanh gươm đang tự xoay”; cũng có thể dịch: “thanh gươm rực lửa xoay mọi hướng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: đuổi ... ra
  rationale: Động từ גרשׁ diễn tả hành động cưỡng buộc rời khỏi một nơi; “đuổi ra” tự nhiên trong tiếng Việt và giữ được sức mạnh của nguyên ngữ.
- source_word: הָאָדָם
  choice: người ấy
  rationale: Trong mạch truyện, từ này chỉ cá nhân đã được tạo dựng và đặt trong vườn; “người ấy” vừa xác định nhân vật vừa tránh biến câu này thành lời nói về nhân loại nói chung.
- source_word: וַיַּשְׁכֵּן
  choice: đặt
  rationale: Thể Hiphil của שכן có nghĩa khiến ở hoặc bố trí tại một nơi. “Đặt” là cách diễn đạt tự nhiên, không thêm sắc thái quân sự quá mức, còn mục đích canh giữ đã được nêu rõ ở cuối câu.
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: ở phía đông vườn Ê-đen
  rationale: Cụm từ chỉ vị trí về phía đông hoặc tại mặt phía đông của khu vườn; cách dịch này tự nhiên và giữ được phạm vi nghĩa không hoàn toàn xác định.
- source_word: הַכְּרֻבִים
  choice: các chê-ru-bim
  rationale: Phiên âm thuật ngữ chỉ các hữu thể trên trời đặc thù trong Kinh Thánh; từ “các” biểu thị số nhiều.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: ngọn lửa của thanh gươm xoay mọi hướng
  rationale: Giữ cấu trúc khác thường của tiếng Hê-bơ-rơ, sát nghĩa là “ngọn lửa của thanh gươm, vật đang tự xoay,” thay vì mặc nhiên giản lược thành “thanh gươm rực lửa.”
- source_word: לִשְׁמֹר
  choice: để canh giữ
  rationale: שׁמר ở đây diễn tả việc bảo vệ và ngăn không cho tiếp cận; “canh giữ” phù hợp với bối cảnh.
- source_word: דֶּרֶךְ עֵץ הַחַיִּים
  choice: con đường dẫn đến cây sự sống
  rationale: Nguyên văn là “đường của cây sự sống”; “dẫn đến” diễn đạt tự nhiên quan hệ chỉ lối tiếp cận trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của הָאָדָם
  choice: người ấy
  alternative: con người; loài người; người đàn ông
  rationale: Ngữ cảnh quy chiếu đến một cá nhân cụ thể vừa bị trục xuất. “Người ấy” bảo toàn tính cá thể mà không buộc từ אָדָם phải mang nghĩa khái quát hoặc nhấn mạnh giới tính hơn mức cần thiết.
- issue: Bản chất của לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: ngọn lửa của thanh gươm xoay mọi hướng
  alternative: thanh gươm rực lửa xoay mọi hướng
  rationale: Cách dịch chính giữ sự căng thẳng và hình ảnh khác thường của cấu trúc nguyên văn, không quyết định rằng “ngọn lửa” chỉ là tính chất của thanh gươm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu về Đức Chúa Trời theo chủ ngữ được tiếp nối từ ngữ cảnh; phiên âm “Ê-đen” và “chê-ru-bim” theo lối dùng Kinh Thánh tiếng Việt. Dấu [a] xuất hiện ngay sau cụm từ cần chú thích.
