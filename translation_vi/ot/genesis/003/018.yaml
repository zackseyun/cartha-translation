  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: vi
  text: Đất[a] sẽ sinh gai góc và cây tật lê cho con[b], và con sẽ ăn cây cỏ ngoài đồng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ, từ “đất” không được lặp lại ở đây; động từ giống cái số ít quy chiếu về đất trong câu trước.
    reason: implicit_antecedent
  - marker: b
    text: 'Cũng có thể dịch: “sẽ làm mọc lên gai góc và cây tật lê cho con”. Động từ Hê-bơ-rơ ở dạng sai khiến, nghĩa là đất làm cho chúng mọc lên.'
    reason: lexical_alternative
  - marker: c
    text: “Cây cỏ ngoài đồng” cũng có thể dịch là “thực vật ngoài đồng” hoặc, theo lối truyền thống, là “rau cỏ ngoài đồng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְק֥וֹץ
  choice: gai góc
  rationale: קוֹץ chỉ các loài cây có gai; “gai góc” diễn đạt tự nhiên theo nghĩa tập hợp và phù hợp với cặp từ kế tiếp.
- source_word: וְדַרְדַּ֖ר
  choice: cây tật lê
  rationale: דַּרְדַּר chỉ một loại cỏ dại có gai, phân biệt với קוֹץ. “Cây tật lê” giữ cách gọi quen thuộc mà không xác định quá mức một loài thực vật cụ thể.
- source_word: תַּצְמִ֣יחַֽ לָ֑ךְ
  choice: sẽ sinh ... cho con
  rationale: Động từ Hiphil mang nghĩa khiến mọc hoặc sinh ra; “sẽ sinh” vừa tự nhiên trong tiếng Việt khi chủ ngữ là đất, vừa giữ được ý đất tạo ra thứ cây có hại. “Cho con” thể hiện rõ לָךְ và sắc thái bất lợi trong ngữ cảnh.
- source_word: וְאָכַלְתָּ֖
  choice: và con sẽ ăn
  rationale: Dạng động từ nối tiếp lời tuyên bố về hậu quả; thì tương lai được diễn đạt tự nhiên bằng “sẽ ăn”.
- source_word: עֵ֥שֶׂב הַשָּׂדֶֽה
  choice: cây cỏ ngoài đồng
  rationale: עֵשֶׂב có nghĩa rộng là thảm thực vật, ở đây là thứ có thể dùng làm thức ăn; “cây cỏ ngoài đồng” dễ hiểu, trang trọng vừa phải và giữ quan hệ với הַשָּׂדֶה.
theological_decisions:
- issue: Chủ thể của động từ giống cái số ít תַּצְמִיחַ
  choice: Nêu rõ “Đất”, quy chiếu về đất ở câu trước
  alternative: Dùng chủ ngữ ngầm hoặc một đại từ chỉ vật
  rationale: Động từ Hê-bơ-rơ ở giống cái số ít tự nhiên quy chiếu về הָאֲדָמָה, “đất”, trong câu 17. Tiếng Việt cần nêu lại chủ ngữ để câu độc lập rõ ràng, nhưng chú thích vẫn cho biết từ “đất” không được lặp lại trực tiếp trong câu Hê-bơ-rơ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Con” duy trì lời Đức Chúa Trời trực tiếp phán với người nam trong ngữ cảnh. “Sinh” được chọn thay cho cấu trúc nặng “làm cho mọc lên”, còn chú thích bảo lưu sắc thái khiến khiến của động từ nguồn.
