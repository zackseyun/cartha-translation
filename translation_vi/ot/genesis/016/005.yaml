  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: vi
  text: 'Sa-rai nói với Áp-ram: “Nỗi bất công tôi phải chịu là do ông.[a] Chính tôi đã trao người nữ nô lệ của tôi vào lòng ông,[b] nhưng khi cô ấy thấy mình đã thụ thai, tôi trở nên bị coi thường trong mắt cô ấy. Xin Yahweh phân xử giữa tôi và ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Sự bất công của tôi ở trên ông.” Câu Hê-bơ-rơ quy trách nhiệm cho Áp-ram về điều bất công hoặc tổn hại Sa-rai đang phải chịu.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “vào lòng ông,” một cách nói kín đáo ở đây về việc tiếp nhận thân mật.'
    reason: idiom
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: Nỗi oan tôi phải chịu là do ông
  rationale: חָמָס có thể chỉ sự sai trái, bất công hay tổn hại; hậu tố ngôi thứ nhất có thể được hiểu là điều bất công Sa-rai phải chịu. עָלֶיךָ quy trách nhiệm cho Áp-ram. Cách dịch này tự nhiên trong tiếng Việt và vẫn ghi nhận cách hiểu sát chữ hơn ở chú thích.
- source_word: שִׁפְחָתִי
  choice: nữ tỳ của mình
  rationale: שִׁפְחָה chỉ một nữ đầy tớ thuộc địa vị lệ thuộc. “Nữ tỳ” ngắn gọn, trang trọng và cho thấy thân phận xã hội rõ hơn từ “người hầu” chung chung.
- source_word: בְּחֵיקֶךָ
  choice: vào lòng ông
  rationale: חֵיק nghĩa đen là lòng/ngực và tại đây là cách nói kín đáo về sự tiếp nhận thân mật. Giữ hình ảnh Hê-bơ-rơ trong một cách diễn đạt tiếng Việt dễ hiểu.
- source_word: הָרָתָה
  choice: đã thụ thai
  rationale: Dạng hoàn thành diễn tả việc thụ thai đã xảy ra; “đã thụ thai” chính xác và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: cô ấy lại khinh tôi
  rationale: Cụm này nói Sa-rai bị xem nhẹ, bị coi thường trong mắt Ha-ga. “Khinh tôi” truyền đạt tự nhiên kết quả xã hội và thái độ đánh giá, tránh câu bị động nặng nề.
- source_word: יִשְׁפֹּט
  choice: Xin ... phân xử
  rationale: Dạng ý nguyện là lời kêu cầu Đức Chúa Trời làm trọng tài. “Xin ... phân xử” thể hiện rõ sắc thái thỉnh cầu, không biến nó thành lời tiên báo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển âm danh riêng giao ước được ghi trực tiếp trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: giữa tôi và ông
  rationale: Giữ nguyên hai bên tranh chấp được nêu đích danh và sắc thái đối chất trực tiếp.
theological_decisions:
- issue: Ý nghĩa lời buộc tội חֲמָסִי עָלֶיךָ
  choice: Nỗi oan tôi phải chịu là do ông
  alternative: Tội của tôi đổ trên ông
  rationale: Cấu trúc Hê-bơ-rơ có thể được giữ rất sát là “sự sai trái của tôi ở trên ông,” nhưng trong ngữ cảnh Sa-rai đang quy trách nhiệm cho Áp-ram về nỗi nhục mình chịu, không nhất thiết thú nhận lỗi riêng. Chú thích bảo lưu độ mơ hồ của sở hữu từ.
- issue: Cách thể hiện יְהוָה
  choice: Yahweh
  alternative: CHÚA
  rationale: Bản nguồn dùng danh riêng YHWH; “Yahweh” bảo tồn sự phân biệt giữa danh riêng và tước hiệu mà không thêm một cách hiểu hệ phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp xưng hô “tôi—ông” để giữ giọng buộc tội trực tiếp giữa Sa-rai và Áp-ram; giữ hình ảnh “vào lòng ông” và giải thích bằng chú thích. Tất cả dấu chú thích [a], [b] đều xuất hiện trong chính văn.
