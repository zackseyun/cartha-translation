review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: Sa-rai là vợ Áp-ram, bà chưa sinh con cho ông; bà có một nữ nô lệ người Ai Cập tên Ha-ga. “Nữ nô lệ” phản ánh phù hợp שִׁפְחָה và không làm nhẹ địa vị lệ thuộc.'
  naturalness: Câu nhìn chung tự nhiên, nhưng “không sinh cho ông một người con nào” hơi nặng và không phải lối kết hợp thông dụng nhất trong tiếng Việt hiện đại. “Chưa sinh cho ông người con nào” tự nhiên hơn, đồng thời diễn đạt tốt bối cảnh hồi cố của thể hoàn thành trong tiếng Hê-bơ-rơ.
  terminology: Các tên Sa-rai, Áp-ram và Ha-ga nhất quán với lối phiên âm đã chọn. “Nữ nô lệ” là thuật ngữ rõ nghĩa, thích hợp hơn “đầy tớ gái” trong bản văn chính. Chú thích nên gọi phương án thay thế là “người hầu gái” thay vì “đầy tớ gái”, vốn kém tự nhiên trong tiếng Việt hiện đại.
  issues:
  - severity: low
    issue: Cụm “không sinh cho ông một người con nào” hơi gượng.
    rationale: Tiếng Việt thường nói “chưa sinh cho ông con nào/người con nào”; cách này vẫn giữ đối tượng gián tiếp “cho ông” và sắc thái bối cảnh trước thời điểm câu chuyện.
  - severity: low
    issue: Phương án “đầy tớ gái” trong chú thích không tự nhiên bằng “người hầu gái”.
    rationale: Đây là điều chỉnh phong cách chú thích, không thay đổi ghi nhận từ vựng hay ý nghĩa địa vị xã hội của שִׁפְחָה.
