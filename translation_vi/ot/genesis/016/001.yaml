  to: Sa-rai, vợ Áp-ram, chưa sinh cho ông người con nào; bà có một nữ nô lệ[a] người Ai Cập tên là Ha-ga.
  rationale: Chỉ điều chỉnh nhẹ để câu tiếng Việt hiện đại trôi chảy hơn và làm tự nhiên hóa một phương án trong chú thích. Bản sửa giữ nguyên trật tự thông tin, quan hệ hôn nhân, việc Sa-rai chưa sinh con cho Áp-ram, nguồn gốc Ai Cập, địa vị nô lệ của người phụ nữ và tên Ha-ga.
