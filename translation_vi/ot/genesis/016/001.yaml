base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: vi
  text: Sa-rai, vợ Áp-ram, chưa sinh cho ông người con nào; bà có một nữ nô lệ[a] người Ai Cập tên là Ha-ga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nữ tỳ” hoặc “người hầu gái”. Từ Hê-bơ-rơ שִׁפְחָה chỉ một phụ nữ làm nô lệ hoặc tôi tớ lệ thuộc trong gia đình; ở đây dịch “nữ nô lệ” để làm rõ địa vị bị ràng buộc của bà.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: Sa-rai
  rationale: Danh riêng được phiên âm theo cách quen thuộc trong tiếng Việt. Liên từ ו mở đầu một diễn tiến mới trong lời kể nên không cần dịch máy móc là “và” khi tiếng Việt đã thể hiện tự nhiên sự chuyển cảnh.
- source_word: אֵשֶׁת אַבְרָם
  choice: vợ Áp-ram
  rationale: Cụm sở hữu chỉ rõ quan hệ hôn nhân; cách đặt đồng vị “Sa-rai, vợ Áp-ram” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: לֹא יָלְדָה לוֹ
  choice: không sinh cho ông một người con nào
  rationale: Động từ יָלַד ở đây nói đến việc sinh con cho người chồng. “Một người con nào” làm rõ đối tượng vốn được hàm ý trong tiếng Hê-bơ-rơ và diễn đạt trọn ý phủ định.
- source_word: וְלָהּ
  choice: bà có
  rationale: Kết cấu sở hữu theo nghĩa đen là “thuộc về bà có” được chuyển sang cách nói sở hữu tự nhiên trong tiếng Việt.
- source_word: שִׁפְחָה
  choice: nữ nô lệ
  rationale: Từ này chỉ một phụ nữ thuộc địa vị nô lệ hoặc tôi tớ lệ thuộc trong gia đình. “Nữ nô lệ” giữ rõ địa vị bị ràng buộc, vốn quan trọng đối với diễn tiến câu chuyện.
- source_word: מִצְרִית
  choice: người Ai Cập
  rationale: Tính từ chỉ nguồn gốc dân tộc được diễn đạt tự nhiên sau danh từ trong tiếng Việt.
- source_word: וּשְׁמָהּ הָגָר
  choice: tên là Ha-ga
  rationale: Giữ nguyên việc câu Hê-bơ-rơ nêu tên người phụ nữ, nhưng dùng cấu trúc gọn và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giữ mối liên hệ chặt giữa hai mệnh đề hoàn cảnh mà không tạo một câu tiếng Việt quá nặng. Các tên riêng dùng dạng phiên âm quen thuộc: Sa-rai, Áp-ram, Ha-ga.'
