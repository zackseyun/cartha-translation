    rationale: Cụm này không diễn đạt rõ một nghĩa ngữ pháp khả dĩ của רֹאִי trong tên riêng và có thể làm người đọc hiểu sai. Nên thay bằng một ghi chú nêu cách hiểu chính và sự không chắc chắn của cách phân tích tên.
  - severity: low
    issue: «người ta gọi giếng ấy là»
    rationale: Cách nói này dễ gợi một hành vi gọi tên thông thường hoặc thói quen, trong khi động từ qārāʾ kể lại việc giếng đã được đặt tên. Dạng bị động tiếng Việt vẫn không xác định chủ thể như nguyên văn.
