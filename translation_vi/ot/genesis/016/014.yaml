  text: עַל כֵּן֙ קָרָ֣א לַ/בְּאֵ֔ר בְּאֵ֥ר לַחַ֖י רֹאִ֑י הִנֵּ֥ה בֵין קָדֵ֖שׁ וּ/בֵ֥ין בָּֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: vi
  text: Vì thế, giếng ấy được gọi là Bê-e La-chai Rô-i.[a] Này, nó nằm giữa Ca-đe và Bê-rết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hê-bơ-rơ này thường được hiểu là “Giếng của Đấng Hằng Sống, Đấng thấy tôi.” Cách phân tích chính xác của tên vẫn không chắc chắn.
    reason: Giải thích nghĩa được hiểu phổ biến của tên trong mạch văn (x. câu 13), đồng thời không khẳng định quá mức trước sự bất định về cách phân tích cụm Hê-bơ-rơ.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân-kết quả trong tiếng Việt.
- source_word: קָרָא לַבְּאֵר
  choice: người ta gọi giếng ấy là
  rationale: Động từ Hê-bơ-rơ ở số ít nhưng không nêu chủ thể; cách nói phiếm chỉ giữ nguyên việc chủ thể không được xác định mà vẫn tự nhiên trong tiếng Việt.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Bê-e La-chai Rô-i
  rationale: Giữ tên riêng bằng lối phiên âm gần với tiếng Hê-bơ-rơ, đồng thời chú thích nghĩa vì tên này gắn với câu trước.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Giữ tiểu từ chỉ dẫn, thu hút sự chú ý của người nghe hoặc người đọc, thay vì lược bỏ.
- source_word: בֵין קָדֵשׁ וּבֵין בָּרֶד
  choice: giữa Ca-đe và Bê-rết
  rationale: Cách diễn đạt địa điểm tự nhiên trong tiếng Việt, với các địa danh được phiên âm.
theological_decisions:
- issue: Ý nghĩa của tên בְּאֵר לַחַי רֹאִי
  choice: Đưa nghĩa tên vào chú thích với cách dịch sát cấu trúc
  alternative: Diễn giải ngay trong chính văn theo một cách hiểu thần học cụ thể
  rationale: Cụm tên có thể được phân tích và hiểu theo hơn một sắc thái; chú thích bảo tồn độ mở của nguyên văn, không quyết định thay người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Kìa” để tái hiện הִנֵּה mà không dùng sắc thái cổ quá mức; giữ các địa danh dưới dạng phiên âm tiếng Việt.
