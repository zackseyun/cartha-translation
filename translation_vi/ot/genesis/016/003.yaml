  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: vi
  text: Sau khi Áp-ram đã sống ở xứ Ca-na-an được mười năm[a], Sa-rai, vợ Áp-ram, đem Ha-ga, người Ai Cập, là nữ nô lệ của mình, trao cho Áp-ram, chồng bà, làm vợ ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “vào cuối mười năm Áp-ram sống ở xứ Ca-na-an.”'
    reason: Nêu hình thức sát chữ của cụm thời gian מִקֵּץ עֶשֶׂר שָׁנִים mà bản văn chính diễn đạt theo tiếng Việt tự nhiên.
  - marker: b
    text: Nguyên văn dùng từ “vợ”; câu này đồng thời xác định Ha-ga là nữ nô lệ của Sa-rai.
    reason: Giúp người đọc nhận thấy nguyên văn giữ cả hai địa vị mà không thay “vợ” bằng “vợ lẽ” hay “tì thiếp”.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: đem
  rationale: Trong chuỗi hành động “lấy… rồi trao”, “đem” tự nhiên hơn trong tiếng Việt và vẫn giữ ý Sa-rai chủ động đưa Ha-ga đến cho Áp-ram.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sa-rai, vợ Áp-ram
  rationale: Giữ cấu trúc đồng vị xác định Sa-rai qua quan hệ hôn nhân với Áp-ram.
- source_word: הָגָר הַמִּצְרִית
  choice: Ha-ga, người Ai Cập
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt; cụm chỉ nguồn gốc dân tộc được diễn đạt tự nhiên.
- source_word: שִׁפְחָתָהּ
  choice: nữ nô lệ của mình
  rationale: שִׁפְחָה chỉ một nữ nô lệ hoặc nữ tỳ; “nữ nô lệ” diễn đạt rõ địa vị lệ thuộc, tránh làm nhẹ nghĩa của nguyên văn.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: sau khi Áp-ram đã sống ở xứ Ca-na-an được mười năm
  rationale: Diễn đạt rõ rằng khoảng mười năm được tính theo thời gian Áp-ram cư ngụ tại Ca-na-an, đồng thời giữ quan hệ thời gian của nguyên văn.
- source_word: וַתִּתֵּן אֹתָהּ
  choice: trao cho
  rationale: “Trao cho” phù hợp với hành động chuyển giao Ha-ga cho Áp-ram và tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: לְאַבְרָם אִישָׁהּ
  choice: cho Áp-ram, chồng bà
  rationale: Dịch rõ אִישָׁהּ là “chồng bà” và giữ quan hệ được nguyên văn nhắc lại.
- source_word: לוֹ לְאִשָּׁה
  choice: làm vợ ông
  rationale: Giữ danh xưng אִשָּׁה là “vợ”, không thay bằng một thuật ngữ khác như “vợ lẽ” hay “tì thiếp” vốn không xuất hiện trong câu Hebrew.
theological_decisions:
- issue: Địa vị của Ha-ga đối với Sa-rai và Áp-ram
  choice: Giữ đồng thời “nữ nô lệ” và “làm vợ ông”.
  alternative: Dịch quan hệ với Áp-ram là “làm vợ lẽ” hoặc “làm tì thiếp”.
  rationale: Nguyên văn trực tiếp gọi Ha-ga là nữ nô lệ của Sa-rai nhưng dùng אִשָּׁה, “vợ/người nữ”, cho quan hệ được thiết lập với Áp-ram. Bản dịch giữ nguyên sự căng thẳng xã hội và pháp lý này, không tự đồng nhất “vợ” với “vợ lẽ”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà/ông” để nối các quan hệ trong câu dài mà không lặp tên quá mức; giữ rõ trình tự thời gian và hai địa vị được nguyên văn nêu về Ha-ga.
