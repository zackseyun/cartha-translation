source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: vi
  text: 'Bà gọi Yahweh, Đấng đã phán với bà, là: “Ngài là Đức Chúa Trời, Đấng thấy tôi”[a], vì bà nói: “Chẳng lẽ ngay tại đây tôi đã thấy sau Đấng thấy tôi sao?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài là Đức Chúa Trời, Đấng thấy” hoặc “Ngài là Đức Chúa Trời của sự thấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mệnh đề cuối trong tiếng Hê-bơ-rơ rất khó hiểu. Có thể hiểu là: “Chẳng lẽ ngay tại đây tôi đã thấy Ngài mà vẫn còn sống, sau khi Ngài đã thấy tôi sao?”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם
  choice: bà gọi danh ... là
  rationale: Giữ cấu trúc của thành ngữ Hê-bơ-rơ ‘gọi danh’, đồng thời thêm ‘là’ để câu tiếng Việt cho thấy Ha-ga đang gọi Yahweh bằng một danh hiệu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: Đấng đã phán với bà
  rationale: Diễn đạt tự nhiên phân từ Hê-bơ-rơ dùng để xác định Yahweh là Đấng nói với Ha-ga.
- source_word: אַתָּה אֵל רֳאִי
  choice: Ngài là Đức Chúa Trời thấy tôi
  rationale: רֳאִי khó xác định chính xác, có thể chỉ sự thấy hoặc Đấng thấy tôi. Cách dịch này phù hợp ngữ cảnh và không biến câu thành một khẳng định quá xác định hơn nguyên văn.
- source_word: כִּי אָֽמְרָה
  choice: vì bà nói
  rationale: 'Thể hiện quan hệ giải thích: lời tiếp theo nêu lý do cho danh hiệu vừa được gọi.'
- source_word: הֲגַם הֲלֹם
  choice: Chẳng lẽ ngay tại đây
  rationale: Truyền đạt sắc thái nghi vấn, ngạc nhiên và nhấn mạnh địa điểm của các tiểu từ Hê-bơ-rơ.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: tôi đã thấy sau Đấng thấy tôi
  rationale: Bám sát chuỗi từ khó và cô đọng của nguyên văn, bảo toàn sự mơ hồ thay vì tự ý thêm ý ‘vẫn còn sống’ vào chính văn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm danh ấy phân biệt danh riêng với các tước hiệu.
- issue: Ý nghĩa danh hiệu אֵל רֳאִי
  choice: Đức Chúa Trời thấy tôi
  alternative: Đức Chúa Trời là Đấng thấy / Đức Chúa Trời của sự thấy
  rationale: Cách chọn nhấn mạnh việc Đức Chúa Trời nhìn thấy Ha-ga theo ngữ cảnh, còn chú thích ghi nhận những sắc thái ngữ pháp khác có thể có.
- issue: Ý nghĩa mệnh đề cuối רָאִיתִי אַחֲרֵי רֹאִי
  choice: giữ cách diễn đạt cô đọng và khó hiểu trong chính văn
  alternative: tôi đã thấy Ngài mà vẫn còn sống sau khi Ngài thấy tôi
  rationale: Cú pháp Hê-bơ-rơ ở đây nổi tiếng khó giải. Không đưa cách giải thích về việc sống sót vào chính văn khi những từ tương ứng không được nói rõ; chú thích trình bày cách hiểu ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “bà” cho Ha-ga, “Ngài/Đấng” khi nói về Yahweh. Chính văn cố ý giữ nét lạ ở mệnh đề cuối vì nguyên văn mơ hồ; chú thích hỗ trợ người đọc mà không áp đặt một cách giải thích.
