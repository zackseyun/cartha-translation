  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: vi
  text: 'Người ấy nói: “Ha-ga, nữ nô lệ[a] của Sa-rai, ngươi từ đâu đến, và đang đi đâu?” Nàng đáp: “Tôi đang chạy trốn khỏi Sa-rai, bà chủ của tôi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nữ tỳ” hoặc “đầy tớ gái”; từ Hê-bơ-rơ chỉ một phụ nữ ở địa vị nô thuộc dưới quyền Sa-rai.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “khỏi trước mặt Sa-rai, bà chủ của tôi”, tức là khỏi sự hiện diện của bà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: nữ nô lệ
  rationale: Danh từ שִׁפְחָה chỉ một phụ nữ ở địa vị nô thuộc. “Nữ nô lệ” diễn đạt rõ giới tính và thân phận xã hội, không làm nhẹ nghĩa thành “đầy tớ”.
- source_word: אֵי מִזֶּה
  choice: từ đâu đến
  rationale: Cụm từ này hỏi về nơi xuất phát; cách diễn đạt tiếng Việt tự nhiên là “từ đâu đến”.
- source_word: וְאָנָה תֵלֵכִי
  choice: và đang đi đâu
  rationale: אָנָה cùng động từ הלך hỏi về đích đến. Dạng “đang đi đâu” tự nhiên trong ngữ cảnh hành trình hiện tại, đồng thời không loại trừ hướng đi sắp tới.
- source_word: מִפְּנֵי
  choice: khỏi
  rationale: Nghĩa sát là “khỏi mặt/sự hiện diện của”; trong ngữ cảnh chạy trốn khỏi một người, “khỏi” truyền đạt rõ quan hệ tách lìa, còn nghĩa sát được ghi trong chú thích.
- source_word: גְּבִרְתִּי
  choice: bà chủ của tôi
  rationale: Danh từ giống cái chỉ người nữ có quyền trên Ha-ga. “Bà chủ của tôi” vừa tự nhiên trong tiếng Việt vừa giữ rõ quan hệ quyền thuộc.
- source_word: בֹּרַחַת
  choice: Tôi đang chạy trốn
  rationale: Phân từ diễn tả hành động đang tiếp diễn; “đang chạy trốn” giữ được sắc thái kéo dài ấy.
- source_word: וַיֹּאמַר
  choice: Người ấy nói
  rationale: Động từ giống đực có chủ ngữ được hiểu từ câu trước. “Người ấy” giữ sự quy chiếu mà không lặp lại danh hiệu không có trong câu này.
- source_word: שָׂרַי
  choice: Sa-rai
  rationale: Phiên âm tên riêng theo lối viết rõ âm tiết, quen dùng trong tiếng Việt.
- source_word: הָגָר
  choice: Ha-ga
  rationale: Phiên âm tên riêng theo lối viết rõ âm tiết, quen dùng trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt thân phận xã hội của Ha-ga
  choice: nữ nô lệ
  alternative: nữ tỳ; đầy tớ gái
  rationale: Nguyên ngữ nêu rõ địa vị nô thuộc của Ha-ga dưới quyền Sa-rai. Bản dịch không dùng cách nói nhẹ hơn làm mờ quan hệ quyền lực này.
- issue: Có nêu rõ người nói là thiên sứ của Đức Giê-hô-va hay không
  choice: Người ấy nói
  alternative: Thiên sứ của Đức Giê-hô-va nói
  rationale: Ngữ cảnh câu trước xác định người nói, nhưng chính câu này chỉ dùng động từ với chủ ngữ ngầm. Vì vậy không đưa lại danh hiệu vào phần chính của câu.
- issue: Mức độ sát chữ của מִפְּנֵי
  choice: khỏi Sa-rai
  alternative: khỏi mặt/sự hiện diện của Sa-rai
  rationale: Cách dịch chính diễn đạt tự nhiên hành động chạy trốn khỏi một người; chú thích bảo tồn hình ảnh nguyên ngữ mà không gán thêm lý do hoặc động cơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phản ánh lời của người có thẩm quyền nói với Ha-ga trong bối cảnh cổ đại; “tôi” trong lời Ha-ga tự nhiên và không cường điệu sắc thái phục tùng. Tên riêng được viết Ha-ga và Sa-rai.
