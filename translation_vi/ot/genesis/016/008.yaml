  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải chính xác các yếu tố trọng tâm của tiếng Hê-bơ-rơ: Hagar được xác định là nữ nô lệ của Sa-rai; câu hỏi lần lượt hỏi nơi xuất phát và nơi đang hướng đến; và phân từ בֹּרַחַת được diễn đạt bằng hành động đang tiếp diễn, “đang chạy trốn.” “Người ấy” không thêm danh hiệu của nhân vật từ câu trước. Cụm “khỏi Sa-rai” là cách diễn đạt tự nhiên cho מִפְּנֵי trong ngữ cảnh này; chú thích cần nêu hình thức sát chữ bằng tiếng Việt không gây hiểu nhầm.'
  naturalness: 'Văn bản chính tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Cặp xưng hô “ngươi” / “tôi” làm rõ sự chênh lệch địa vị trong cuộc đối thoại mà không thêm nội dung. Cần chỉnh nhẹ chú thích b: “khỏi mặt” không phải cách diễn đạt tiếng Việt tự nhiên cho hình ảnh “trước mặt/sự hiện diện của” trong nguyên ngữ.'
  terminology: “Nữ nô lệ” giữ rõ thân phận lệ thuộc của שִׁפְחָה; “bà chủ của tôi” phản ánh đúng גְּבִרְתִּי là người nữ có quyền trên Hagar. Tên Ha-ga và Sa-rai nhất quán với quy ước phiên âm của bản thảo.
  issues:
