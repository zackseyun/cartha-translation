  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: vi
  text: 'Sa-rai nói với Áp-ram: “Này, Đức Giê-hô-va đã ngăn tôi sinh con. Xin ông hãy ăn ở với nữ nô lệ của tôi; có lẽ nhờ nàng mà tôi sẽ được gây dựng[a].” Áp-ram nghe theo lời Sa-rai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói theo nghĩa tự nhiên hơn: “có lẽ nhờ nàng mà tôi sẽ có con” hoặc “có lẽ nhờ nàng mà gia đình tôi sẽ được gây dựng.” Nguyên văn Hê-bơ-rơ nói sát nghĩa là “có lẽ tôi sẽ được xây dựng nhờ nàng.”'
    reason: Giải thích ẩn dụ אִבָּנֶה và bảo tồn các khả năng “có con” hay “được gây dựng thành gia đình” mà không buộc câu chính chỉ mang một nghĩa.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: nói
  rationale: Dạng động từ nối tiếp đưa trình thuật tiến lên; trật tự câu tiếng Việt tự nhiên đã thể hiện diễn tiến nên không cần thêm từ nối máy móc.
- source_word: הִנֵּה נָא
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của tổ hợp từ Hê-bơ-rơ bằng một thán từ tự nhiên trong tiếng Việt hiện đại.
- source_word: עֲצָרַנִי ... מִלֶּדֶת
  choice: đã ngăn tôi sinh con
  rationale: Diễn đạt trực tiếp ý bị ngăn không thể sinh con, không làm nhẹ việc Sa-rai quy hành động này cho Đức Giê-hô-va.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: בֹּא נָא אֶל
  choice: Xin ông hãy đến với
  rationale: Giữ lối nói giảm nói tránh về quan hệ tình dục trong nguyên văn; “xin” chuyển tải sắc thái thỉnh cầu của נָא.
- source_word: שִׁפְחָתִי
  choice: nữ nô lệ của tôi
  rationale: Phản ánh rõ địa vị lệ thuộc của שִׁפְחָה, không làm nhẹ thành một người giúp việc tự do.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: có lẽ nhờ nàng mà tôi sẽ được gây dựng
  rationale: Giữ hình ảnh thụ động “được xây/gây dựng” và đồng thời dùng “nhờ nàng” để câu tiếng Việt tự nhiên; chú thích nêu nghĩa theo văn cảnh.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: nghe theo lời
  rationale: Đây là thành ngữ tiếng Việt tự nhiên diễn đạt việc nghe và làm theo tiếng/lời của một người, phù hợp với thành ngữ Hê-bơ-rơ.
theological_decisions:
- issue: Vai trò của Đức Giê-hô-va trong tình trạng hiếm muộn của Sa-rai
  choice: Đức Giê-hô-va đã ngăn tôi sinh con
  alternative: Đức Giê-hô-va không cho tôi sinh con
  rationale: Giữ nguyên lời quy trách nhiệm trực tiếp của Sa-rai cho hành động của Đức Giê-hô-va mà không thêm lời giải thích hay phán đoán thần học.
- issue: Mức độ tường minh của lối nói về quan hệ tình dục
  choice: hãy đến với nữ nô lệ của tôi
  alternative: hãy ăn ở với nữ nô lệ của tôi
  rationale: Giữ lối nói giảm nói tránh của nguyên văn và tránh giải nghĩa thô hoặc cụ thể hơn mức văn bản.
- issue: Ẩn dụ “được gây dựng”
  choice: tôi sẽ được gây dựng
  alternative: tôi sẽ có con
  rationale: Giữ ẩn dụ và sự căng thẳng về ý nghĩa gia đình/dòng dõi trong nguyên văn; nghĩa theo văn cảnh được trình bày trong chú thích thay vì thay thế ẩn dụ.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tên người được phiên âm theo cách quen dùng: Sa-rai, Áp-ram. Câu chính giữ lối nói giảm nói tránh và ẩn dụ của nguyên văn; chú thích giúp độc giả hiểu nghĩa theo văn cảnh.'
