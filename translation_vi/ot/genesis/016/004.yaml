source:
  edition: WLC
  text: וַ/יָּבֹ֥א אֶל הָגָ֖ר וַ/תַּ֑הַר וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וַ/תֵּקַ֥ל גְּבִרְתָּ֖/הּ בְּ/עֵינֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: vi
  text: Ông ăn ở với Ha-ga, và nàng thụ thai. Khi thấy mình đã thụ thai, nàng coi thường bà chủ của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “bà chủ của nàng trở nên đáng khinh trong mắt nàng.” Câu Hê-bơ-rơ mô tả bà chủ bị hạ thấp trong sự đánh giá của Ha-ga; cũng có thể dịch: “bà chủ của nàng bị nàng khinh thường.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: Ông ăn ở với Ha-ga
  rationale: Thành ngữ בוא אל trong ngữ cảnh này chỉ việc quan hệ vợ chồng. “Ăn ở với” là cách nói kín đáo, tự nhiên trong tiếng Việt, vừa truyền đạt đúng nghĩa vừa giữ sắc thái trang nhã của lời thuật.
- source_word: הָגָר
  choice: Ha-ga
  rationale: Phiên âm tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: וַתַּהַר / הָרָתָה
  choice: thụ thai / đã thụ thai
  rationale: Giữ sự lặp lại của cùng một gốc từ הרה và diễn tiến của câu chuyện; “thụ thai” trang trọng, rõ nghĩa.
- source_word: וַתֵּרֶא כִּי
  choice: Khi thấy
  rationale: Diễn đạt nhận thức của Ha-ga cùng quan hệ thời gian trong mạch kể, không thêm ý vượt quá nguyên văn.
- source_word: וַתֵּקַל
  choice: coi thường
  rationale: Động từ קלל ở đây diễn tả việc đánh giá bà chủ là nhẹ, thấp kém hoặc đáng khinh. Cách dịch chủ động tự nhiên trong tiếng Việt và cho thấy đây là thái độ của Ha-ga, không phải phẩm chất thực của Sa-rai.
- source_word: גְּבִרְתָּהּ
  choice: bà chủ của mình
  rationale: גברת chỉ người nữ có địa vị chủ quản đối với Ha-ga. “Bà chủ” là cách gọi trực tiếp, tự nhiên và phù hợp bối cảnh xã hội.
- source_word: בְּעֵינֶיהָ
  choice: trong mắt nàng
  rationale: Thành ngữ Hê-bơ-rơ chỉ sự đánh giá hoặc cách nhìn của một người; ý này được chuyển tự nhiên bằng cấu trúc “nàng coi thường”, còn dạng sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Chủ thể và sắc thái của וַתֵּקַל ... בְּעֵינֶיהָ
  choice: nàng coi thường bà chủ của mình
  alternative: bà chủ của nàng trở nên đáng khinh trong mắt nàng
  rationale: Ngữ pháp đặt “bà chủ của nàng” làm chủ ngữ của động từ, nhưng thành ngữ “trong mắt nàng” cho thấy đây là sự thay đổi trong cách Ha-ga đánh giá Sa-rai. Bản dịch chính dùng cách nói tự nhiên, còn chú thích bảo tồn cấu trúc và sắc thái có thể hiểu theo hướng trạng thái.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Đại từ “ông” tiếp nối chủ thể nam đã nêu trong ngữ cảnh; “nàng” phân biệt Ha-ga với “bà chủ”. Dùng “ăn ở với” như một cách nói kín đáo về quan hệ tính dục.
