base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: vi
  text: Ha-ga sinh cho Áp-ram một con trai, và Áp-ram đặt tên cho con trai mình, người mà Ha-ga đã sinh, là Ích-ma-ên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: sinh
  rationale: Động từ ילד ở thể Qal với chủ ngữ nữ có nghĩa là sinh con; “sinh” tự nhiên, ngắn gọn và phù hợp văn kể chuyện.
- source_word: לְאַבְרָם
  choice: cho Áp-ram
  rationale: 'Giới từ ל biểu thị mối liên hệ hoặc người thụ hưởng: Ha-ga sinh người con được kể là con của Áp-ram.'
- source_word: בֵּן
  choice: một con trai
  rationale: Danh từ không có mạo từ được diễn đạt tự nhiên trong tiếng Việt bằng “một con trai” khi lần đầu giới thiệu.
- source_word: וַיִּקְרָא ... שֶׁם
  choice: đặt tên ... là
  rationale: Thành ngữ Hê-bơ-rơ nghĩa đen là “gọi tên”; “đặt tên ... là” là cách diễn đạt tiếng Việt hiện đại, rõ nghĩa và vẫn giữ hành động đặt tên.
- source_word: בְּנוֹ
  choice: người con trai
  rationale: Hậu tố chỉ người con thuộc về Áp-ram; sở hữu đã rõ qua chủ ngữ Áp-ram và mệnh đề trước, nên cách diễn đạt này tránh lặp nặng nề mà không đổi nghĩa.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: mà Ha-ga đã sinh
  rationale: Giữ nguyên mệnh đề quan hệ và việc bản Hê-bơ-rơ nhắc lại đích danh Ha-ga; “đã sinh” thể hiện hành động xảy ra trước việc đặt tên.
- source_word: יִשְׁמָעֵאל
  choice: Ích-ma-ên
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. Giữ sự lặp lại có chủ ý về Ha-ga và việc sinh con, đồng thời chuyển thành ngữ đặt tên sang cách nói thông dụng.
