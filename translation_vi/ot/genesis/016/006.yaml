- from: 'Áp-ram nói với Sa-rai: “Này, nữ nô lệ của bà đang ở trong tay bà; hãy làm với nàng điều bà thấy là tốt.” Sa-rai hành hạ[a] nàng, và nàng trốn khỏi mặt bà.'
  to: 'Áp-ram nói với Sa-rai: “Này, nữ nô lệ của bà ở trong tay bà; hãy đối xử với nàng theo điều bà thấy là tốt.” Sa-rai ngược đãi[a] nàng, và nàng bỏ trốn khỏi bà.'
