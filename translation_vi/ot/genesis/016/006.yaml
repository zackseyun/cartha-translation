  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: vi
  text: 'Áp-ram nói với Sa-rai: “Này, nữ nô lệ của bà ở trong tay bà; hãy đối xử với nàng theo điều bà thấy là tốt.” Sa-rai ngược đãi[a] nàng, và nàng bỏ trốn khỏi bà.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hành hạ nàng,” “đối xử hà khắc với nàng,” hoặc “làm nhục nàng.” Động từ Hê-bơ-rơ có thể chỉ việc gây khổ, làm nhục hoặc đối xử khắc nghiệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của từ Hê-bơ-rơ bằng một từ dẫn tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: שִׁפְחָתֵךְ
  choice: nữ nô lệ của bà
  rationale: Diễn đạt rõ địa vị lệ thuộc của Ha-ga, không làm nhẹ đi quan hệ quyền lực bằng từ chung chung như “người hầu”.
- source_word: בְּיָדֵךְ
  choice: ở trong tay bà
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, đồng thời hàm ý người ấy nằm dưới quyền định đoạt của Sa-rai.
- source_word: הַטּוֹב בְּעֵינַיִךְ
  choice: điều bà thấy là tốt
  rationale: Phản ánh thành ngữ “điều tốt trong mắt bà” bằng cách diễn đạt tự nhiên hơn trong tiếng Việt mà không quy định đó là điều đúng về mặt đạo đức.
- source_word: וַתְּעַנֶּהָ
  choice: hành hạ nàng
  rationale: Động từ piel ענה chỉ việc gây khổ, làm nhục hoặc đối xử khắc nghiệt. “Hành hạ” truyền đạt mức độ nghiêm trọng nhưng không xác định cụ thể hình thức ngược đãi; chú thích nêu các khả năng gần nghĩa.
- source_word: וַתִּבְרַח
  choice: nàng trốn
  rationale: Cách diễn đạt ngắn gọn, tự nhiên, giữ sắc thái nghiêm trọng của hành động chạy trốn.
- source_word: מִפָּנֶיהָ
  choice: khỏi mặt bà
  rationale: Giữ tương đối sát hình ảnh Hê-bơ-rơ “khỏi trước mặt bà”, đồng thời vẫn dễ hiểu trong văn kể chuyện tiếng Việt.
theological_decisions:
- issue: Địa vị xã hội của Ha-ga
  choice: nữ nô lệ
  alternative: nữ tỳ; người hầu gái
  rationale: Bối cảnh nhấn mạnh quyền lực của chủ đối với người bị lệ thuộc; “nữ nô lệ” không che giảm thực trạng ấy.
- issue: Mức độ đối xử được biểu thị bởi וַתְּעַנֶּהָ
  choice: hành hạ nàng
  alternative: ngược đãi nàng; đối xử khắc nghiệt với nàng; làm nhục nàng
  rationale: Nguyên ngữ cho thấy Ha-ga thực sự bị gây khổ hoặc áp bức, nhưng không nói rõ hình thức. Bản dịch giữ sức nặng của động từ và chú thích duy trì phạm vi nghĩa.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng đại từ “bà” cho Sa-rai và “nàng” cho nữ nô lệ để câu văn rõ ràng, tự nhiên; giữ các hình ảnh nguồn như “trong tay” và “khỏi mặt” khi tiếng Việt vẫn hiểu được.
