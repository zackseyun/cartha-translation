  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính của câu: Áp-ram trao Ha-ga cho quyền định đoạt của Sa-rai, Sa-rai đối xử khắc nghiệt với nàng, rồi nàng chạy trốn. “Nữ nô lệ” bảo toàn địa vị bị lệ thuộc của שִׁפְחָה. Tuy nhiên, “hành hạ” có thể gợi một hình thức ngược đãi dữ dội, kéo dài hoặc cụ thể hơn động từ ענה trong câu này; “ngược đãi” giữ sức nặng mà vẫn bao quát tính không xác định của nguyên ngữ. “Trốn khỏi mặt bà” quá sát chữ và không tự nhiên trong tiếng Việt hiện đại; “bỏ trốn khỏi bà” diễn đạt rõ việc chạy trốn khỏi Sa-rai.'
  naturalness: Cụm “hãy làm với nàng điều bà thấy là tốt” hơi gượng; “hãy đối xử với nàng theo điều bà thấy là tốt” tự nhiên hơn mà vẫn phản ánh hành động hướng đến Ha-ga. “Bỏ trốn khỏi bà” tự nhiên và rõ hơn “trốn khỏi mặt bà.”
  terminology: Giữ “Áp-ram,” “Sa-rai,” và “nữ nô lệ” là phù hợp. “Ngược đãi” là tương đương hiện đại, nghiêm túc cho ענה (Piel), không định rõ phương thức hành vi. Chú thích cần nêu cả các sắc thái “gây khổ/làm nhục” để bảo toàn phạm vi nghĩa.
  issues:
  - severity: medium
    issue: “Hành hạ” có thể quá cụ thể hoặc quá mạnh so với động từ ענה.
    rationale: ענה ở thể piel chỉ sự gây khổ, hạ nhục hoặc đối xử hà khắc, nhưng câu không xác định hành vi là tra tấn hay hành hạ theo nghĩa cụ thể. “Ngược đãi” giữ tính nghiêm trọng và độ mở của từ nguồn.
  - severity: medium
    issue: “Trốn khỏi mặt bà” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này sao chép hình ảnh מִפָּנֶיהָ quá sát chữ, dễ gợi tránh khỏi tầm mắt hơn là chạy trốn khỏi Sa-rai. “Bỏ trốn khỏi bà” truyền đạt chính xác và tự nhiên hơn.
  - severity: low
    issue: “Làm với nàng điều...” hơi gượng về kết hợp từ.
    rationale: “Đối xử với nàng theo điều bà thấy là tốt” là cách kể chuyện tự nhiên hơn, vẫn không thêm phán đoán đạo đức vào thành ngữ ‘điều tốt trong mắt bà’.
