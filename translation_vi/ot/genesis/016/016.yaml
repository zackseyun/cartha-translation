base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/016.yaml
  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: vi
  text: Áp-ram được tám mươi sáu tuổi khi Ha-ga sinh Ích-ma-ên cho ông[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì ông.” Giới từ Hê-bơ-rơ ở đây có thể được hiểu theo cả hai cách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: בֶּן
  choice: được ... tuổi
  rationale: Trong công thức nói về tuổi tác, בֶּן được diễn đạt tự nhiên trong tiếng Việt là “được ... tuổi”.
- source_word: שְׁמֹנִים שָׁנָה וְ/שֵׁשׁ שָׁנִים
  choice: tám mươi sáu tuổi
  rationale: Cụm số từ Hê-bơ-rơ là cách nói tuổi; tiếng Việt hiện đại gộp thành “tám mươi sáu tuổi”.
- source_word: בְּ/לֶדֶת
  choice: khi ... sinh
  rationale: Giới từ בְּ đi với động từ nguyên mẫu kiến tạo יָלַד tạo mệnh đề thời gian, được chuyển tự nhiên là “khi ... sinh”.
- source_word: הָגָר
  choice: Ha-ga
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: אֶת יִשְׁמָעֵאל
  choice: Ích-ma-ên
  rationale: אֶת là dấu hiệu tân ngữ trực tiếp nên không dịch; tên riêng được phiên âm theo cách dùng quen thuộc trong tiếng Việt.
- source_word: לְ/אַבְרָם
  choice: cho ông
  rationale: Giới từ לְ có thể chỉ mối liên hệ của việc sinh con với Áp-ram. “Cho ông” tự nhiên trong tiếng Việt và giữ được nghĩa gần với nguyên văn; đại từ tránh lặp tên nặng nề.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “được ... tuổi” theo lối nói tự nhiên của tiếng Việt; giữ chú thích để phản ánh khả năng diễn đạt khác của giới từ לְ.
