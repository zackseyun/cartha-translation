source:
  edition: WLC
  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: vi
  text: Thiên sứ của Yahweh[a] tìm thấy nàng bên một nguồn nước trong hoang mạc, bên nguồn nước trên đường đến Su-rơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Sứ giả của Yahweh”. Từ Hê-bơ-rơ có thể mang nghĩa “thiên sứ” hoặc “sứ giả”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: tìm thấy nàng
  rationale: Động từ מצא ở dạng kể chuyện có nghĩa tự nhiên là “tìm thấy”; hậu tố giống cái số ít chỉ Ha-ga. “Nàng” phù hợp với văn kể chuyện trang trọng và không thêm ý rằng cuộc gặp là tình cờ.
- source_word: מַלְאַךְ יְהוָה
  choice: Thiên sứ của Đức Giê-hô-va
  rationale: מַלְאַךְ có thể là “sứ giả” hoặc “thiên sứ”; trong ngữ cảnh một sứ giả thần linh, “thiên sứ” là cách diễn đạt tự nhiên, còn nghĩa từ vựng khác được giữ trong chú thích. Danh YHWH được phiên âm theo dạng quen thuộc trong tiếng Việt.
- source_word: עַל עֵין הַמַּיִם
  choice: bên một mạch nước
  rationale: עַיִן trong ngữ cảnh này chỉ nguồn nước; “mạch nước” tự nhiên trong tiếng Việt và עַל được diễn đạt theo nghĩa vị trí là “bên”.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, khô cằn, không nhất thiết là sa mạc cát; “hoang mạc” giữ được phạm vi nghĩa ấy.
- source_word: עַל הָעַיִן
  choice: mạch nước
  rationale: Cụm từ lặp lại xác định chính nguồn nước vừa nói đến; thêm “tức” giúp câu tiếng Việt tự nhiên mà vẫn giữ chức năng định vị của nguyên văn.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: trên đường đến Su-rơ
  rationale: דֶּרֶךְ là đường hoặc lối đi; “trên đường đến” diễn đạt tự nhiên ý hướng về địa danh Su-rơ.
theological_decisions:
- issue: Cách dịch מַלְאַךְ trong cụm מַלְאַךְ יְהוָה
  choice: Thiên sứ của Đức Giê-hô-va
  alternative: Sứ giả của Đức Giê-hô-va
  rationale: Chọn cách gọi thông dụng cho sứ giả thần linh nhưng ghi nhận nghĩa rộng “sứ giả”, không dùng bản dịch để xác định sâu hơn bản thể hay căn tính của nhân vật.
- issue: Cách thể hiện danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: YHWH; Gia-vê; Đức Chúa Trời
  rationale: Nguyên văn dùng danh riêng YHWH chứ không phải một tước hiệu. “Đức Giê-hô-va” là dạng danh riêng quen thuộc, trang trọng trong tiếng Việt và tránh thay danh ấy bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” vì câu đang tiếp nối chuyện kể về Ha-ga; dùng “hoang mạc” thay vì “sa mạc” để không thu hẹp địa hình quá mức. Chỉ đặt một chú thích tại cụm có phương án dịch thực sự cần bảo lưu.
