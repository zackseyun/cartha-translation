source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: vi
  text: Người ấy sẽ như một con lừa hoang[a]; tay người ấy sẽ chống lại mọi người, và tay mọi người sẽ chống lại người ấy[b]. Người ấy sẽ sống đối diện[c] với tất cả anh em mình[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một người như lừa hoang.” Nguyên văn dùng hình ảnh “lừa hoang” để ví về người ấy; không chỉ đơn giản nói rằng người ấy “hoang dã.”'
    reason: lexical_alternative
  - marker: b
    text: “Tay” ở đây tượng trưng cho hành động hoặc sức mạnh trong thế đối địch; hai vế diễn tả sự thù nghịch qua lại.
    reason: idiom_explanation
  - marker: c
    text: Cũng có thể dịch là “trước mặt” hoặc “ở trước.” Cụm Hê-bơ-rơ có thể chỉ việc sống đối diện, ở trước mặt, hoặc trong thế đối đầu, nên bản dịch không thu hẹp về một nghĩa duy nhất.
    reason: lexical_alternative
  - marker: d
    text: “Anh em” cũng có thể bao gồm họ hàng gần hoặc các dân có quan hệ thân tộc, chứ không nhất thiết chỉ là anh em ruột.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: một con người như lừa hoang
  rationale: פֶּרֶא là lừa hoang, không chỉ có nghĩa trừu tượng là “hoang dã”. Cách diễn đạt này giữ hình ảnh ví von sống động của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: אָדָם
  choice: con người
  rationale: Ở đây từ này chỉ đích danh Ích-ma-ên với tư cách một người; “con người” kết hợp tự nhiên với hình ảnh “như lừa hoang”.
- source_word: יָדוֹ בַכֹּל וְיַד כֹּל בּוֹ
  choice: tay nó sẽ chống lại mọi người, và tay mọi người sẽ chống lại nó
  rationale: “Tay” biểu thị hành động và thế đối địch. Giữ lại hình ảnh “tay” cùng cấu trúc đối xứng của hai vế, đồng thời diễn đạt rõ hàm ý thù nghịch trong ngữ cảnh.
- source_word: וְעַל־פְּנֵי
  choice: đối diện với
  rationale: Cụm từ có nghĩa không gian–quan hệ là ở phía trước, trước mặt hoặc đối diện; “đối diện với” giữ được độ mở, không ấn định phương hướng hay chỉ hiểu là chống đối.
- source_word: כָּל־אֶחָיו
  choice: tất cả anh em mình
  rationale: אָח trước hết là “anh/em”, nhưng cũng có thể mở rộng đến thân tộc hoặc các dân có quan hệ họ hàng. Bản chính giữ nghĩa trực tiếp, còn nghĩa rộng được ghi chú.
- source_word: יִשְׁכֹּן
  choice: sẽ cư ngụ
  rationale: שׁכן có nghĩa là ở, cư trú, định cư. “Cư ngụ” trang trọng vừa phải và phù hợp với lời tiên báo.
theological_decisions:
- issue: Cách mô tả Ích-ma-ên trong cụm פֶּרֶא אָדָם
  choice: 'Giữ rõ hình ảnh lừa hoang: “một con người như lừa hoang”'
  alternative: “một người hoang dã”
  rationale: Nguyên văn dùng một hình ảnh động vật cụ thể. Không làm phẳng hình ảnh thành một nhận định tính cách chung, cũng không tự thêm phán xét đạo đức vượt quá văn bản.
- issue: Sắc thái của וְעַל־פְּנֵי כָל־אֶחָיו יִשְׁכֹּן
  choice: “cư ngụ đối diện với tất cả anh em mình”
  alternative: “sống chống lại tất cả anh em mình” hoặc “sống ở phía đông tất cả anh em mình”
  rationale: Cụm Hê-bơ-rơ có thể chỉ vị trí trước mặt/đối diện và trong ngữ cảnh có thể gợi thế đối đầu, nhưng không buộc phải là sự chống đối hay một phương địa lý cụ thể. Bản dịch giữ sự mơ hồ này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “nó” nối tự nhiên với lời tiên báo về đứa trẻ ở câu trước và phản ánh đại từ giống đực số ít trong tiếng Hê-bơ-rơ mà không thêm danh xưng ngoài văn bản. Cấu trúc song song “tay nó… tay mọi người…” được giữ để bảo toàn nhịp và sức nặng của nguyên văn.
