source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה שׁ֖וּבִי אֶל גְּבִרְתֵּ֑/ךְ וְ/הִתְעַנִּ֖י תַּ֥חַת יָדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: vi
  text: 'Thiên sứ của Yahweh[a] nói với nàng: “Hãy trở về với bà chủ của ngươi và chịu hạ mình[b] dưới quyền bà ấy[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sứ giả của Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “hãy phục tùng” hoặc “hãy chịu sự áp bức.” Động từ Hê-bơ-rơ có thể hàm ý tự hạ mình và chịu khổ trong tình trạng lệ thuộc.'
    reason: lexical_alternative
  - marker: c
    text: Thành ngữ Hê-bơ-rơ, nghĩa đen là “dưới tay bà ấy,” chỉ việc ở dưới thẩm quyền hoặc quyền kiểm soát của bà ấy.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Thiên sứ của Yahweh
  rationale: מַלְאַךְ có thể là “sứ giả” hoặc “thiên sứ”; trong trình thuật về cuộc gặp gỡ thần linh này, “thiên sứ” là cách hiểu tự nhiên hơn, nhưng không xác định thêm bản thể hay danh tính của vị này.
- source_word: שׁוּבִי
  choice: Hãy trở về
  rationale: Mệnh lệnh giống cái số ít của שוב, diễn đạt trực tiếp việc quay lại nơi và quan hệ mà Hagar đã rời bỏ.
- source_word: גְּבִרְתֵּךְ
  choice: bà chủ của ngươi
  rationale: Danh từ chỉ người nữ có địa vị chủ quản đối với Hagar. “Bà chủ” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: וְהִתְעַנִּי
  choice: phục tùng
  rationale: Dạng Hitpael mệnh lệnh của ענה trong ngữ cảnh này nói đến việc tự đặt mình vào vị thế hạ mình hoặc lệ thuộc. “Phục tùng” truyền đạt rõ chiều kích quan hệ mà không biến mệnh lệnh thành lời yêu cầu tìm kiếm sự ngược đãi.
- source_word: תַּחַת יָדֶיהָ
  choice: dưới quyền bà ấy
  rationale: Thành ngữ Hê-bơ-rơ nghĩa đen là “dưới tay bà ấy”, chỉ sự ở dưới quyền kiểm soát hoặc thẩm quyền. Dịch theo nghĩa thành ngữ giúp câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Giữ danh riêng được biểu thị bởi Tứ Tự YHWH, thay vì thay bằng một tước hiệu; không thêm diễn giải thần học ngoài văn bản.
- issue: מַלְאַךְ là “thiên sứ” hay “sứ giả”
  choice: thiên sứ
  alternative: sứ giả
  rationale: Ngữ cảnh cuộc hiện ra của sứ giả thuộc thiên giới nghiêng về “thiên sứ”, trong khi chú thích bảo tồn nghĩa từ vựng rộng hơn.
- issue: Mức độ mạnh của וְהִתְעַנִּי
  choice: phục tùng
  alternative: hãy hạ mình / chịu khổ dưới quyền
  rationale: Động từ có thể gợi việc hạ mình và chịu sự áp chế. “Phục tùng” giữ trọng tâm vào vị thế lệ thuộc trong câu, còn chú thích ghi nhận sắc thái khắc nghiệt hơn mà nguyên ngữ có thể mang.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng/ngươi” để phù hợp giọng kể Kinh Thánh và lời phán trực tiếp; tránh từ quá cổ. Các dấu chú thích phải gắn vào câu, nhưng bản văn hiện tại cần được hiệu chỉnh để hiển thị đầy đủ [a], [b], [c].
