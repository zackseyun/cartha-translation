  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố của tiếng Hê-bơ-rơ: lời nói của thiên sứ, lời loan báo Hagar đang mang thai và sẽ sinh con trai, chỉ thị đặt tên, cùng lý do danh xưng gắn với việc Yahweh đã nghe cảnh ngộ của nàng. “Này” phản ánh היטנה/הִנָּךְ; thì hiện tại của “đang mang thai” và tương lai của “sẽ sinh” phù hợp ngữ cảnh. “Nàng hãy đặt tên con là” là cách chuyển ngữ tự nhiên cho công thức đặt tên, không làm sai ý nghĩa.'
  naturalness: Văn bản trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. Đại từ “nàng” nhất quán với người nghe là Hagar trong lời thuật cổ, không thô hoặc suồng sã. “Nghe thấu nỗi khốn khổ” là cách diễn đạt Việt ngữ mạch lạc cho lối nói Hê-bơ-rơ rằng Yahweh đã nghe sự khổ nạn của nàng.
  terminology: “Thiên sứ của Yahweh” giữ được cấu trúc מַלְאַךְ יְהוָה mà không áp đặt diễn giải thần học về căn tính nhân vật. Chú thích “Sứ giả của Yahweh” nêu đúng lựa chọn từ vựng thay thế. “Yahweh” nhất quán với chính sách chuyển danh YHWH. Dạng tên “Ích-ma-ên” là dạng phiên âm Kinh Thánh Việt ngữ quen thuộc và thích hợp.
