  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: vi
  text: 'Thiên sứ của Yahweh nói với nàng[a]: “Này, nàng đang mang thai và sẽ sinh một con trai. Nàng hãy đặt tên con là Ích-ma-ên, vì Yahweh đã nghe thấu nỗi khốn khổ của nàng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sứ giả của Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Thiên sứ của Yahweh
  rationale: מַלְאַךְ có thể chỉ ‘sứ giả’ hoặc ‘thiên sứ’; trong ngữ cảnh này, ‘thiên sứ’ là cách hiểu tự nhiên về một sứ giả từ trời, còn khả năng dịch sát hơn được giữ trong chú thích.
- source_word: הִנָּךְ הָרָה
  choice: Này, nàng đang mang thai
  rationale: ‘Này’ giữ chức năng thu hút sự chú ý của הִנֵּה, còn ‘đang mang thai’ diễn đạt rõ và tự nhiên tình trạng được nêu bởi הָרָה.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: và sẽ sinh một con trai
  rationale: Giữ lời báo trước về việc sinh con, với cách diễn đạt hiện đại và sát nghĩa.
- source_word: וְקָרָאת שְׁמוֹ
  choice: Nàng hãy đặt tên con là
  rationale: Diễn đạt tự nhiên công thức đặt tên trong tiếng Việt, đồng thời giữ sắc thái chỉ dẫn của lời thiên sứ.
- source_word: יִשְׁמָעֵאל
  choice: Ích-ma-ên
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt; mệnh đề tiếp theo gợi rõ lối chơi chữ với động từ ‘nghe’.
- source_word: כִּי שָׁמַע יְהוָה
  choice: vì Yahweh đã nghe thấu
  rationale: כִּי nêu lý do đặt tên; thể hoàn thành שָׁמַע được chuyển bằng ‘đã nghe’, còn ‘nghe thấu’ diễn đạt việc Thiên Chúa chú ý và đáp lại cảnh ngộ mà không thêm một hành động giải cứu chưa được nói rõ.
- source_word: עָנְיֵךְ
  choice: nỗi khốn khổ của nàng
  rationale: עֳנִי bao quát tình cảnh bị áp bức, đau khổ và khốn cùng; ‘nỗi khốn khổ’ tự nhiên hơn ‘sự hoạn nạn’ trong tiếng Việt hiện đại mà không thu hẹp nghĩa vào cảm xúc.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Giữ danh riêng của Thiên Chúa có trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- issue: Thân phận của מַלְאַךְ יְהוָה
  choice: Thiên sứ của Yahweh
  alternative: Sứ giả của Yahweh
  rationale: Không đồng nhất nhân vật này với Yahweh hoặc với một ngôi vị thần học cụ thể; bản dịch giữ nguyên cấu trúc sở thuộc và chú thích khả năng từ vựng ‘sứ giả’.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ ‘nàng’ phù hợp lời kể cổ điển ở mức vừa phải và tránh sắc thái suồng sã; các câu được tách nhẹ để lời công bố tự nhiên, rõ ràng trong tiếng Việt.
