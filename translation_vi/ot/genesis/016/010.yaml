source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: vi
  text: 'Thiên sứ của Yahweh nói với nàng[a]: “Ta sẽ làm cho dòng dõi ngươi gia tăng thật nhiều, đến nỗi không thể đếm được vì quá đông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ giả của Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng waw-consecutive tiếp diễn mạch kể; trong tiếng Việt, trình tự đã rõ từ văn cảnh nên không cần thêm một liên từ cứng nhắc.
- source_word: מַלְאַךְ יְהוָה
  choice: Thiên sứ của Yahweh
  rationale: מַלְאַךְ có thể chỉ sứ giả hoặc thiên sứ; trong công thức lặp lại này của Sáng Thế Ký, “thiên sứ” tự nhiên và phù hợp ngữ cảnh, còn khả năng “sứ giả” được giữ trong chú thích. Danh riêng יהוה được phiên âm là “Yahweh”.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Ta sẽ làm cho ... gia tăng thật nhiều
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh mức độ gia tăng. “Thật nhiều” truyền đạt cường độ mà không chuyển trọng tâm sang ý chắc chắn hay lời thề.
- source_word: זַרְעֵךְ
  choice: dòng dõi của con
  rationale: זֶרַע là danh từ tập hợp chỉ hậu duệ. “Dòng dõi” giữ được ý tập hợp và trang trọng tự nhiên hơn cách dịch sát “hạt giống”.
- source_word: וְלֹא יִסָּפֵר מֵרֹב
  choice: đến nỗi không thể đếm được vì quá đông
  rationale: 'Diễn đạt quan hệ kết quả và nguyên nhân hàm chứa trong câu Hê-bơ-rơ: dòng dõi sẽ đông đến mức không thể đếm được.'
theological_decisions:
- issue: Cách chuyển יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản nguồn dùng trực tiếp danh thánh bốn phụ âm; giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Sắc thái căn tính của מַלְאַךְ יְהוָה
  choice: Thiên sứ của Yahweh
  alternative: Sứ giả của Yahweh
  rationale: Không đồng nhất nhân vật này với chính Yahweh cũng không phủ nhận sự căng thẳng thần học trong văn cảnh; bản chính dùng cách gọi quen thuộc, còn nghĩa từ vựng thay thế được nêu ở chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “nàng” cho người nữ trong lời kể và “Ta/con” trong lời phán để giữ sắc thái trang nghiêm; tránh lối dịch quá cổ hoặc quá sát cấu trúc Hê-bơ-rơ.
