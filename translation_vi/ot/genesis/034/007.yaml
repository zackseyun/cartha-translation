base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: vi
  text: Các con trai của Gia-cốp từ ngoài đồng về; vừa nghe tin ấy, họ đau buồn và vô cùng tức giận, vì người ấy đã làm một điều ô nhục trong Y-sơ-ra-ên khi ăn nằm với con gái Gia-cốp; việc như thế không được làm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: đau buồn
  rationale: Diễn đạt nỗi đau đớn, buồn phiền của các con trai Gia-cốp mà không thu hẹp từ này thành chỉ sự xúc phạm hay phẫn nộ.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: vô cùng tức giận
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là cơn giận 'bừng cháy' nơi họ; cách dịch này tự nhiên trong tiếng Việt và giữ nguyên cường độ.
- source_word: נְבָלָה
  choice: một điều ô nhục
  rationale: Từ này chỉ hành vi đồi bại, đáng hổ thẹn và trái nghiêm trọng với trật tự luân lý; 'điều ô nhục' phù hợp ngữ cảnh mà không thêm thuật ngữ pháp lý không có trong nguyên văn.
- source_word: לִשְׁכַּב אֶת
  choice: ăn nằm với
  rationale: Giữ cách nói uyển chuyển nhưng rõ nghĩa về quan hệ tình dục, phù hợp văn phong trang trọng và thông dụng.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: một việc như thế không được phép làm
  rationale: 'Phản ánh thể bị động và sức nặng chuẩn tắc của mệnh đề: đây không chỉ là việc không nên làm mà là việc không được chấp nhận.'
theological_decisions:
- issue: Cụm 'trong Y-sơ-ra-ên' xuất hiện trước khi dân Y-sơ-ra-ên được hình thành đầy đủ trong mạch truyện
  choice: giữ nguyên 'trong Y-sơ-ra-ên'
  alternative: giữa gia đình Y-sơ-ra-ên / đối với Y-sơ-ra-ên
  rationale: Nguyên văn dùng בְיִשְׂרָאֵל; giữ cách diễn đạt này bảo toàn góc nhìn và sự căng thẳng về niên đại trong lời kể, thay vì giải thích nó theo một cách riêng.
- issue: Chủ thể của עָשָׂה được hàm ẩn trong động từ giống đực số ít
  choice: người ấy
  alternative: Si-chem
  rationale: Không đưa tên riêng vào nơi nguyên văn chỉ dùng chủ thể hàm ẩn; 'người ấy' vẫn rõ nhờ ngữ cảnh và tránh sắc thái miệt thị không có trong bản Hê-bơ-rơ.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng ''ăn nằm với'' theo lối diễn đạt Kinh Thánh tự nhiên; tránh từ quá cổ hoặc cách nói thô trực diện. Hai phản ứng cảm xúc được giữ riêng biệt: đau buồn và tức giận.'
