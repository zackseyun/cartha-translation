  source_fidelity: 'Bản dịch truyền đạt đúng các ý chính: các con trai Gia-cốp từ đồng về, đau buồn và rất tức giận vì hành vi ô nhục đối với con gái Gia-cốp. Tuy nhiên, «không được phép làm» dễ gợi một lệnh cấm/cho phép minh thị, trong khi וְכֵן לֹא יֵעָשֶׂה là lời khẳng định chuẩn tắc ở thể bị động: «việc như thế không được làm».'
