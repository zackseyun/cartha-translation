source:
  edition: WLC
  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: vi
  text: Tâm hồn chàng gắn chặt với Đi-na, con gái Gia-cốp; chàng yêu cô gái và nói những lời dịu dàng với cô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “nói vào lòng cô,” một thành ngữ có thể mang nghĩa nói dịu dàng, an ủi, trấn an hoặc lấy lòng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: Tâm hồn chàng gắn chặt
  rationale: Giữ hình ảnh Hê-bơ-rơ về נֶפֶשׁ ('tâm hồn, bản thân') kết hợp với דבק ('bám, gắn chặt'), đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: בְּדִינָה בַּת יַעֲקֹב
  choice: với Đi-na, con gái Gia-cốp
  rationale: Giới từ ב đi với דבק được diễn đạt tự nhiên là 'gắn chặt với'; cụm đồng vị 'con gái Gia-cốp' bám sát cấu trúc nguồn.
- source_word: וַיֶּאֱהַב
  choice: chàng yêu
  rationale: אהב là động từ thông dụng chỉ tình yêu; không đổi thành 'ham muốn' hay lãng mạn hóa thành 'say mê'.
- source_word: הַנַּעֲרָ
  choice: cô gái
  rationale: נַעֲרָה chỉ một thiếu nữ hoặc phụ nữ trẻ; 'cô gái' là cách gọi hiện đại, tự nhiên và không cổ hóa.
- source_word: וַיְדַבֵּר עַל לֵב הַנַּעֲרָ
  choice: nói những lời dịu dàng với cô
  rationale: Thành ngữ 'nói trên/vào lòng' có nghĩa nói nhằm an ủi, trấn an hoặc lấy lòng. Bản dịch chính chuyển nghĩa tự nhiên nhưng chú thích giữ hình ảnh nguyên văn và phạm vi nghĩa.
theological_decisions:
- issue: Ngôn ngữ tình cảm sau hành vi bạo lực trong văn cảnh trước đó
  choice: Giữ nguyên lời thuật về sự gắn bó, tình yêu và cách nói dịu dàng của chàng, không dùng câu chữ để biện minh hay lên án thêm.
  alternative: Chèn sắc thái tiêu cực để nhấn mạnh sự sai trái, hoặc dùng ngôn ngữ lãng mạn hơn để làm hài hòa diễn tiến.
  rationale: Câu Hê-bơ-rơ thuật lại cảm xúc và lời nói của Si-chem mà không đưa phán quyết đạo đức ngay trong câu này. Bản dịch không nên xóa bỏ sự căng thẳng với văn cảnh hoặc bổ sung phán xét không có trong nguyên văn.
- issue: Mức độ diễn giải của thành ngữ וַיְדַבֵּר עַל לֵב
  choice: Dịch trong chính văn là 'nói những lời dịu dàng với cô' và nêu nghĩa đen trong chú thích.
  alternative: Dịch sát từng chữ là 'nói vào lòng cô'.
  rationale: Cách dịch chính văn truyền đạt chức năng của thành ngữ bằng tiếng Việt tự nhiên; chú thích bảo tồn hình ảnh Hê-bơ-rơ và cho biết thành ngữ cũng có thể mang sắc thái an ủi, trấn an hoặc lấy lòng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'chàng/cô' để tránh lặp nặng nề nhưng không tăng sắc thái lãng mạn; giữ tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc.
