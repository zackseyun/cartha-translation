review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng câu hỏi tu từ, chủ thể số ít trong ngữ cảnh, quan hệ gia đình và ý so sánh của כְּ. Tuy nhiên, với động từ “đối xử”, cần lặp lại giới từ trong vế so sánh để diễn đạt rõ rằng em gái bị đối xử như người ta đối xử với một người mại dâm, không phải bị đồng nhất trực tiếp với người mại dâm.
