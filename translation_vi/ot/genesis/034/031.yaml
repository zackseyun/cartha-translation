  terminology: “Gái mại dâm” là thuật ngữ hiện đại, rõ nghĩa cho זֹנָה. “Em gái chúng ta” phù hợp với bối cảnh Đi-na là em của các anh trai đang nói. “Hắn” có sắc thái khinh miệt, nhưng phù hợp một cách hợp lý với lời phản ứng phẫn nộ của các anh em; không cần thay đổi.
