  yaml_path: translation/ot/genesis/034/031.yaml
  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: vi
  text: 'Nhưng họ nói[a]: “Lẽ nào hắn lại đối xử với em gái chúng ta như đối với một gái mại dâm?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lẽ nào hắn lại biến em gái chúng ta thành một gái mại dâm?” Động từ Hê-bơ-rơ có nghĩa đen là “làm, khiến”, nhưng ở đây có lẽ mang nghĩa “đối xử”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nhưng họ nói
  rationale: Dạng wayyiqtol của אמר tiếp tục lời thuật chuyện và mở đầu câu đáp của các anh em. Trong ngữ cảnh họ phản bác lời quở trách của Gia-cốp, “Nhưng” diễn đạt tự nhiên sắc thái đối lập của liên từ ו.
- source_word: הַכְזוֹנָה
  choice: như một gái mại dâm
  rationale: Tiền tố nghi vấn ה kết hợp với giới từ כ và danh từ זונה tạo nghĩa “như một gái mại dâm sao?”. “Gái mại dâm” là cách nói hiện đại, rõ nghĩa và giữ được sắc thái so sánh của כ.
- source_word: יַעֲשֶׂה
  choice: Lẽ nào hắn lại đối xử
  rationale: Động từ עשה có nghĩa rộng là “làm, khiến”, nhưng khi đi với một người làm tân ngữ trong ngữ cảnh này, “đối xử” truyền đạt tự nhiên ý nghĩa theo ngữ cảnh. Dạng chưa hoàn thành nằm trong câu hỏi tu từ được diễn đạt bằng “Lẽ nào... lại...?”
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ xác định; chức năng của nó được thể hiện qua cụm tân ngữ “em gái chúng ta”.
- source_word: אֲחוֹתֵנוּ
  choice: em gái chúng ta
  rationale: Cụm danh từ sở hữu có nghĩa “chị/em gái của chúng ta”. Đi-na là em của các anh trai trong trình thuật, nên “em gái chúng ta” là cách diễn đạt tự nhiên và chính xác theo ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lẽ nào...?” giữ sức nặng của câu hỏi tu từ; “hắn” phản ánh thái độ phẫn nộ của những người nói mà không thêm lời kết án ngoài nguyên văn.
