revisions:
- from: Tất cả những người ra vào cổng thành của ông đều nghe theo Hamor và Shechem, con trai ông. Mọi người nam—tức tất cả những người ra vào cổng thành của ông—đều chịu cắt bì.
  to: Tất cả những người ra khỏi cổng thành của ông[a] đều nghe theo Hamor và Shechem, con trai ông. Mọi nam giới, tức là tất cả những người ra khỏi cổng thành của ông, đều được cắt bì.
