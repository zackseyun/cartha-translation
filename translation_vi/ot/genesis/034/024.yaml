base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: vi
  text: Tất cả những người ra khỏi cổng thành của ông[a] đều nghe theo Hamor và Shechem, con trai ông. Mọi nam giới, tức là tất cả những người ra khỏi cổng thành của ông, đều được cắt bì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “tất cả những người ra khỏi cổng thành của ông.” Đây là một cách nói liên hệ đến những người trong thành tham gia sinh hoạt công cộng tại cổng thành; cụm từ được lặp lại trong câu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: nghe theo
  rationale: Cấu trúc שׁמע אל ở đây không chỉ nói đến việc nghe âm thanh mà còn hàm ý tiếp nhận và làm theo đề nghị; “nghe theo” diễn đạt tự nhiên mà không mạnh như “vâng phục”.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: tất cả những người ra vào cổng thành của ông
  rationale: Nguyên văn là “tất cả những người đi ra khỏi cổng thành của ông”, một thành ngữ chỉ những người nam trong thành tham gia đời sống công cộng. “Ra vào cổng thành” là cách nói tự nhiên trong tiếng Việt, giữ hình ảnh cụ thể và sự lặp lại của nguyên văn.
- source_word: בְּנוֹ
  choice: con trai ông
  rationale: Chỉ quan hệ trực tiếp giữa Shechem và Hamor; đại từ “ông” quy chiếu về Hamor.
- source_word: וַיִּמֹּלוּ
  choice: đều chịu cắt bì
  rationale: Dạng Niphal số nhiều có thể mang sắc thái bị động hoặc phản thân. “Chịu cắt bì” giữ được ý họ trải qua nghi thức mà không xác định ai trực tiếp thực hiện.
- source_word: כָּל זָכָר
  choice: mọi người nam
  rationale: זָכָר nhấn mạnh giới tính nam. “Mọi người nam” chính xác và tự nhiên hơn cách gọi chung “mọi người đàn ông”, đồng thời phù hợp với bối cảnh cư dân nam của thành.
- source_word: שַׁעַר עִירוֹ
  choice: cổng thành của ông
  rationale: Giữ hình ảnh cổng thành, nơi sinh hoạt và quyết định công cộng, thay vì diễn giải thành “công dân” hay “lãnh đạo”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nghe theo” để giữ cả ý nghe lẫn hưởng ứng; lặp lại cụm “ra vào cổng thành” như bản Hê-bơ-rơ. Dấu gạch ngang làm rõ rằng “mọi người nam” được giải thích bằng cụm lặp theo sau.
