  - severity: medium
    issue: “chịu cắt bì” không phản ánh rõ sắc thái Niphal
    rationale: Cách nói này có thể hàm ý chịu đựng hoặc tự mình làm nghi thức. “Đều được cắt bì” diễn đạt tự nhiên hơn kết quả bị động của động từ Niphal mà không quyết định ai thực hiện.
  - severity: low
    issue: “mọi người nam” hơi không tự nhiên
    rationale: “Mọi nam giới” là cách nói hiện đại, rõ nghĩa và vẫn giữ nét nhấn mạnh giới tính của כָּל זָכָר.
