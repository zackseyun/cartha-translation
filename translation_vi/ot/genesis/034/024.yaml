  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: họ hưởng ứng Hamor và Shechem, và nam giới được cắt bì. Tuy nhiên, “ra vào cổng thành” thêm ý “vào” không có trong tiếng Hê-bơ-rơ, vốn nói theo nghĩa đen là những người “đi ra khỏi cổng thành.” “Chịu cắt bì” cũng có thể gợi ý sự cam chịu hoặc tự thực hiện nghi thức, trong khi dạng Niphal ở đây phù hợp hơn với cách diễn đạt bị động “được cắt bì.”'
