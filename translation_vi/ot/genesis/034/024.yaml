  terminology: Giữ nguyên Hamor, Shechem và “cắt bì” là thích hợp. “Nghe theo” phản ánh tốt שׁמע אל trong ngữ cảnh này. “Cổng thành” giữ được hình ảnh và chức năng công cộng của nguyên văn.
  issues:
