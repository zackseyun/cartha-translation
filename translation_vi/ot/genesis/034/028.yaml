base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: vi
  text: Họ lấy các bầy chiên dê, các đàn bò và lừa của họ, cùng mọi thứ trong thành và ngoài đồng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹאנָם
  choice: các bầy chiên dê của dân thành
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, chủ yếu là chiên và dê. Cách dịch này nêu rõ phạm vi từ vựng và dùng “dân thành” để làm sáng tỏ đối tượng mà đại từ số nhiều chỉ về trong ngữ cảnh.
- source_word: בְּקָרָם
  choice: các đàn bò ... của họ
  rationale: בָּקָר chỉ bò hoặc gia súc lớn theo đàn; “các đàn bò” vừa tự nhiên trong tiếng Việt vừa giữ nghĩa tập hợp.
- source_word: חֲמֹרֵיהֶם
  choice: lừa của họ
  rationale: חֲמוֹר chỉ con lừa; “lừa” là từ hiện đại, thông dụng và chính xác.
- source_word: אֲשֶׁר בָּעִיר
  choice: mọi thứ trong thành
  rationale: Cấu trúc quan hệ làm tân ngữ của לָקָחוּ và có phạm vi bao quát; “mọi thứ trong thành” diễn đạt tự nhiên ý cướp lấy toàn bộ những gì ở đó.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: ngoài đồng
  rationale: שָׂדֶה có thể chỉ cánh đồng hoặc vùng đất trống bên ngoài khu dân cư. “Ngoài đồng” tự nhiên trong tiếng Việt và tạo thế đối ứng rõ với “trong thành”.
- source_word: לָקָחוּ
  choice: Họ lấy
  rationale: לָקַח có nghĩa cơ bản là “lấy”. Ngữ cảnh cho thấy đây là hành động cướp bóc, nhưng không cần tăng mức diễn giải bằng “cướp lấy” hay “mang đi”.
