translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Câu giữ chuỗi liệt kê của tiếng Hê-bơ-rơ, đồng thời giảm sự lặp lại đại từ sở hữu ở mức tiếng Việt tự nhiên. “Dân thành” làm rõ tiền ngữ cảnh của hậu tố sở hữu mà không thay đổi đối tượng được nói đến.
