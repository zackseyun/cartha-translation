  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: vi
  text: 'Họ nói với họ: “Chúng tôi không thể làm điều này, tức là gả em gái chúng tôi cho một người chưa cắt bì,[a] vì đó là điều ô nhục đối với chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa đen là “một người có bao quy đầu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: Họ nói với hai người
  rationale: Động từ אמר được dịch tự nhiên là “nói”; đại từ số nhiều “họ” trong ngữ cảnh chỉ Si-chem và Cha-mô, nên “hai người” làm rõ đối tượng mà không thay đổi ý nghĩa.
- source_word: לֹא נוּכַל לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: Chúng tôi không thể làm điều này
  rationale: Giữ nguyên sắc thái về khả năng của יכל và diễn đạt cụm עשה + דבר bằng tiếng Việt hiện đại, tự nhiên.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: gả em gái chúng tôi
  rationale: Trong ngữ cảnh thương lượng hôn nhân, “gả” truyền đạt tự nhiên hành động trao người nữ làm vợ; “em gái” phù hợp với quan hệ của Đi-na đối với các anh đang phát biểu.
- source_word: לְאִישׁ אֲשֶׁר לוֹ עָרְלָה
  choice: cho một người còn bao quy đầu
  rationale: Giữ hình ảnh cụ thể của nguyên văn, sát nghĩa đen “một người có bao quy đầu”, đồng thời dùng cách nói tiếng Việt dễ hiểu; cách diễn đạt quy ước “chưa chịu cắt bì” được ghi ở chú thích.
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: vì đó là điều ô nhục đối với chúng tôi
  rationale: חרפה mang nghĩa ô nhục, sỉ nhục hay điều đáng hổ thẹn trong bình diện danh dự xã hội; “điều ô nhục” trang trọng và rõ nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Bản dịch giữ lối nói cụ thể của tiếng Hê-bơ-rơ về bao quy đầu trong chính văn, còn thuật ngữ quen thuộc “chưa chịu cắt bì” được nêu ở chú thích. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
