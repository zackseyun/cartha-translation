  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: vi
  text: Các anh có thể sống cùng chúng tôi, và đất đai sẽ sẵn cho các anh.[a] Hãy cư ngụ trên đất ấy, buôn bán tại đó và tạo lập sản nghiệp tại đó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “và đất sẽ ở trước mặt các anh.” Cũng có thể hiểu là đất đai được mở ra hoặc sẵn có cho các anh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hãy có cơ nghiệp tại đó” hoặc “hãy sở hữu đất tại đó.” Từ Hê-bơ-rơ có lẽ nói đến việc có được phần đất hoặc quyền sở hữu tài sản.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: Các anh có thể sống cùng chúng tôi
  rationale: Động từ יָשַׁב có thể mang nghĩa ngồi, ở, cư ngụ hoặc định cư. Trong lời mời này, “có thể sống cùng chúng tôi” diễn đạt tự nhiên sắc thái cho phép và mời gọi của ngữ cảnh.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: và đất đai sẽ ở trước mặt các anh
  rationale: Giữ lại hình ảnh và độ mở nghĩa của thành ngữ Hê-bơ-rơ “ở trước mặt”, vốn có thể hàm ý đất ấy sẵn có hoặc rộng mở cho họ sử dụng.
- source_word: שְׁבוּ
  choice: Hãy cư ngụ trên đất ấy
  rationale: Mệnh lệnh từ יָשַׁב nói đến việc ở hoặc định cư. “Cư ngụ” trang trọng vừa phải và phù hợp với lời mời sinh sống trên đất.
- source_word: וּסְחָרוּהָ
  choice: buôn bán tại đó
  rationale: Động từ סחר chỉ hoạt động giao thương. Cách dịch này ngắn gọn, rõ nghĩa và thể hiện hậu tố giống cái chỉ về “đất”.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: và tạo lập sản nghiệp tại đó
  rationale: Dạng Niphal của אָחַז ở đây có thể nói đến việc giành được chỗ đứng, phần đất hoặc quyền sở hữu. “Tạo lập sản nghiệp” truyền đạt ý có được cơ nghiệp hay tài sản trên đất mà không thu hẹp thành hành động chiếm đoạt bằng vũ lực.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các anh” thể hiện ngôi thứ hai số nhiều trong lời Hamor nói với Gia-cốp và các con trai ông. Bản dịch giữ thành ngữ “ở trước mặt” trong câu chính và giải thích nghĩa khả dĩ ở chú thích.
