  text: וְ/לֹֽא אֵחַ֤ר הַ/נַּ֨עַר֙ לַ/עֲשׂ֣וֹת הַ/דָּבָ֔ר כִּ֥י חָפֵ֖ץ בְּ/בַֽת יַעֲקֹ֑ב וְ/ה֣וּא נִכְבָּ֔ד מִ/כֹּ֖ל בֵּ֥ית אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: vi
  text: Chàng trai ấy không chậm trễ làm việc đó[a], vì chàng say mê con gái Gia-cốp[b]; chàng được trọng vọng hơn mọi người trong nhà cha mình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không ngần ngại làm việc đó.”'
    reason: lexical_alternative
  - marker: b
    text: Từ này cũng có thể mang nghĩa “khao khát” hoặc “ưa thích.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch theo lối so sánh bậc nhất: “chàng là người được trọng vọng nhất trong cả nhà cha mình.”'
    reason: grammatical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: không chậm trễ
  rationale: Động từ diễn tả sự trì hoãn hoặc chậm trễ; trong văn cảnh, cụm này nhấn mạnh chàng hành động ngay.
- source_word: הַנַּעַר
  choice: chàng trai ấy
  rationale: Chỉ Si-chem; cách gọi này tự nhiên trong tiếng Việt hiện đại và vẫn giữ sắc thái về tuổi tác.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: làm việc đó
  rationale: Giữ cách diễn đạt khái quát của tiếng Hê-bơ-rơ và quy chiếu về điều được yêu cầu trong câu trước.
- source_word: חָפֵץ
  choice: say mê
  rationale: Động từ có thể biểu thị sự vui thích hoặc ham muốn mạnh mẽ. “Say mê” truyền đạt tình cảm và ham muốn trong văn cảnh mà không thu hẹp nghĩa chỉ còn khía cạnh tình dục.
- source_word: בְּבַת יַעֲקֹב
  choice: con gái Gia-cốp
  rationale: Cách nói sở hữu tự nhiên trong tiếng Việt; giới từ đi với חָפֵץ được thể hiện qua cấu trúc của động từ “say mê”.
- source_word: נִכְבָּד
  choice: được trọng vọng
  rationale: Phân từ Niphal của כבד chỉ địa vị được tôn trọng, coi trọng hoặc có danh giá.
- source_word: מִכֹּל בֵּית אָבִיו
  choice: hơn mọi người trong nhà cha mình
  rationale: Diễn đạt rõ phép so sánh với các thành viên thuộc gia đình hoặc gia tộc của cha chàng, đồng thời tránh khiến người đọc hiểu là so sánh chàng với một tòa nhà.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải. “Làm việc đó” giữ nguyên tính quy chiếu của nguyên văn; “nhà cha mình” được hiểu là gia đình hoặc gia tộc, không phải tòa nhà.
