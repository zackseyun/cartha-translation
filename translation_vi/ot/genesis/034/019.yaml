  source_fidelity: 'Bản dịch bám sát nguyên văn Hê-bơ-rơ: וְלֹא אֵחַר được diễn đạt đúng là “không chậm trễ”; לַעֲשׂוֹת הַדָּבָר là “làm việc đó”; כִּי nêu lý do; חָפֵץ בְּ được chuyển tự nhiên là “say mê”; và נִכְבָּד מִכֹּל bày tỏ địa vị được trọng vọng vượt hơn những người thuộc nhà cha chàng. “Hơn mọi người trong nhà cha mình” làm rõ đúng giá trị so sánh của מִכֹּל mà không biến ‘nhà’ thành nghĩa kiến trúc.'
