  text: וְ/יַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת דִּינָ֣ה בִתּ֔/וֹ וּ/בָנָ֛י/ו הָי֥וּ אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶ֑ה וְ/הֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד בֹּאָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: vi
  text: Gia-cốp nghe tin rằng người ấy đã làm ô uế[a] Đi-na, con gái ông. Các con trai ông lúc ấy đang ở ngoài đồng với đàn gia súc của ông, nên Gia-cốp giữ im lặng cho đến khi họ đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã xâm phạm Đi-na.” Động từ Hê-bơ-rơ có nghĩa đen là “làm ô uế” hoặc “khiến trở nên ô uế”; trong ngữ cảnh này, từ ấy nói đến việc Đi-na bị xâm phạm và làm nhục về tình dục.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: nghe tin
  rationale: Trong văn kể chuyện, động từ diễn tả việc Gia-cốp nhận được tin; “nghe tin” tự nhiên hơn “nghe” đơn độc mà vẫn sát nghĩa.
- source_word: כִּי
  choice: rằng (thể hiện bằng kết cấu “nghe tin…”)
  rationale: Liên từ mở đầu nội dung điều Gia-cốp nghe được; tiếng Việt có thể diễn đạt tự nhiên mà không cần nêu rõ “rằng”.
- source_word: טִמֵּא
  choice: đã làm ô uế
  rationale: Giữ nghĩa căn bản của dạng piel là “làm ô uế”, đồng thời để chú thích giải thích sắc thái xâm phạm và làm nhục về tình dục trong ngữ cảnh.
- source_word: בִתּוֹ
  choice: con gái ông
  rationale: Diễn đạt tự nhiên danh từ kèm hậu tố sở hữu, với “ông” quy chiếu về Gia-cốp.
- source_word: וּבָנָיו
  choice: Các con trai ông lúc ấy
  rationale: Liên từ mở sang hoàn cảnh giải thích sự im lặng của Gia-cốp; “lúc ấy” giúp câu tiếng Việt liền mạch mà không áp đặt đối lập quá mạnh.
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: đang ở ngoài đồng với đàn gia súc của ông
  rationale: Nguồn Hê-bơ-rơ nói họ ở cùng gia súc ngoài đồng, không nói rõ họ đang chăn; bản dịch không bổ sung hành động ấy.
- source_word: מִקְנֵהוּ
  choice: đàn gia súc của ông
  rationale: Chỉ chung vật nuôi theo bầy đàn; rộng và chính xác hơn “bò”.
- source_word: וְהֶחֱרִשׁ
  choice: giữ im lặng
  rationale: Diễn tả việc Gia-cốp không nói hay phản ứng trong lúc chờ các con trai trở về.
- source_word: עַד בֹּאָם
  choice: cho đến khi họ trở về
  rationale: Nguyên văn là “cho đến khi họ đến”; trong mạch truyện, các con đang ngoài đồng nên “trở về” là cách nói tiếng Việt tự nhiên, dù ý trở lại được suy ra từ ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “người ấy” để giữ chủ ngữ ngôi thứ ba không nêu tên trong câu Hê-bơ-rơ, tránh sắc thái miệt thị của “hắn”. Đại từ “ông” chỉ Gia-cốp; “họ” chỉ các con trai ông.
