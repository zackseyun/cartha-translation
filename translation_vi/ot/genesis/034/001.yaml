  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Không thêm từ nối tương đương “bấy giờ” vì nguyên văn không có từ chỉ thời gian riêng biệt. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
