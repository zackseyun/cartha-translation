- from: Đi-na, con gái của Lê-a mà bà đã sinh cho Gia-cốp, đi ra để gặp những người con gái trong xứ.[a]
  to: Đi-na, con gái của Lê-a, người đã sinh nàng cho Gia-cốp, đi ra để nhìn các cô gái trong xứ.[a]
  rationale: Sửa “để gặp” thành “để nhìn” để phản ánh trực tiếp động từ ראה, không áp đặt một diễn giải xã hội trong bản chính. Sửa cấu trúc mệnh đề quan hệ để rõ chủ ngữ và dùng “các cô gái trong xứ” cho tiếng Việt hiện đại tự nhiên, trong khi chú thích bảo lưu cách dịch sát và lựa chọn ngữ cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:43:17Z'
