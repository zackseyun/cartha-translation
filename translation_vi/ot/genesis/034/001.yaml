source:
  edition: WLC
  text: וַ/תֵּצֵ֤א דִינָה֙ בַּת לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/יַעֲקֹ֑ב לִ/רְא֖וֹת בִּ/בְנ֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: vi
  text: Đi-na, con gái của Lê-a, người đã sinh nàng cho Gia-cốp, đi ra để nhìn các cô gái trong xứ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “để gặp các cô gái trong xứ.” Dịch sát là “để nhìn các con gái trong xứ”; ngữ cảnh cũng có thể hàm ý việc thăm viếng phụ nữ địa phương.'
    reason: Bảo lưu nghĩa trực tiếp của לִרְאוֹת trong bản chính, đồng thời ghi nhận cách hiểu giao tiếp-xã hội và cách diễn đạt sát chữ của בנות הארץ.
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: đi ra
  rationale: Động từ Qal wayyiqtol của יצא diễn tả việc đi ra; cách dịch này tự nhiên, giữ diễn tiến của câu chuyện và không thêm địa điểm mà nguyên văn không nêu.
- source_word: דִינָה
  choice: Đi-na
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: בַּת לֵאָה
  choice: con gái của Lê-a
  rationale: Giữ rõ quan hệ mẹ con trong cụm từ đồng vị, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: mà bà đã sinh cho Gia-cốp
  rationale: Mệnh đề quan hệ quy chiếu về Lê-a; từ “bà” làm rõ chủ thể trong tiếng Việt, còn “đã sinh cho Gia-cốp” giữ quan hệ được diễn tả bởi לְ.
- source_word: לִרְאוֹת
  choice: để gặp
  rationale: ראה có nghĩa cơ bản là “thấy/nhìn thấy”, nhưng trong ngữ cảnh con người là đối tượng và có sắc thái giao tiếp xã hội, “gặp” là cách diễn đạt tiếng Việt tự nhiên mà không khẳng định quá mức ý “thăm viếng”; nghĩa sát chữ được bảo lưu trong chú thích.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: những người con gái trong xứ
  rationale: Giữ hình ảnh “các con gái” của nguyên văn, đồng thời “trong xứ” diễn đạt tự nhiên nhóm phụ nữ địa phương.
