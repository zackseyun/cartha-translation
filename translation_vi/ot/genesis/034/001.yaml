  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: Đi-na, quan hệ với Lê-a và Gia-cốp, hành động đi ra, và mục đích liên hệ với các con gái/phụ nữ địa phương. Tuy nhiên, “để gặp” là cách diễn giải ngữ cảnh của לִרְאוֹת (“để thấy/nhìn”), trong khi bản chính nên giữ nghĩa trực tiếp hơn; cách hiểu giao tiếp-xã hội có thể đặt ở chú thích.'
