  to: 'Rồi Si-chem nói với cha nàng và các anh em trai của nàng: “Mong được quý vị chấp thuận[a]. Bất cứ điều gì quý vị bảo tôi[b], tôi sẽ cho.”'
  rationale: Chỉnh “các anh trai” thành “các anh em trai” để không thêm thông tin về tuổi; thay thành ngữ chính bằng cách diễn đạt hiện đại, tự nhiên hơn nhưng vẫn giữ ý xin được chấp thuận; và hoàn chỉnh chú thích [b]. Chú thích [a] tiếp tục bảo lưu hình ảnh “trước mắt” của nguyên ngữ.
