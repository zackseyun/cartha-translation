translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “nàng” giúp xác định rõ người nữ được nhắc đến; “quý vị” biểu đạt ngôi thứ hai số nhiều một cách kính trọng trong cuộc thương lượng. Bản chính ưu tiên thành ngữ tiếng Việt tự nhiên, còn chú thích [a] bảo lưu hình ảnh sát chữ của tiếng Hê-bơ-rơ.
