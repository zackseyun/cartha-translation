base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: vi
  text: 'Rồi Si-chem nói với cha nàng và các anh em trai của nàng: “Mong được quý vị chấp thuận[a]. Bất cứ điều gì quý vị bảo tôi[b], tôi sẽ cho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin cho tôi được ơn trước mắt quý vị.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Bất cứ điều gì quý vị yêu cầu ở tôi, tôi sẽ cho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Dạng waw liên tiếp đẩy câu chuyện tiến tới; “Rồi” diễn đạt tự nhiên trình tự của lời nói trong tiếng Việt hiện đại.
- source_word: שְׁכֶם
  choice: Si-chem
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen dùng, dễ đọc trong tiếng Việt.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: với cha và các anh trai của nàng
  rationale: Giữ rõ hai nhóm người được nói với; אַחֶיהָ là danh từ số nhiều giống đực, nghĩa là các anh hoặc em trai. Trong ngữ cảnh, “các anh trai” phù hợp với những người con trai của Gia-cốp đang tham gia cuộc thương lượng.
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: Xin cho tôi được đẹp lòng quý vị
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “tìm được ân huệ trong mắt”, mang nghĩa cầu xin sự chấp thuận hoặc thiện cảm, mà không biến thành một thuật ngữ thần học.
- source_word: וַאֲשֶׁר
  choice: Bất cứ điều gì
  rationale: Truyền đạt mệnh đề quan hệ bất định và tính rộng mở của lời đề nghị; liên từ được thể hiện tự nhiên qua mạch nối của câu.
- source_word: תֹּאמְרוּ אֵלַי
  choice: quý vị bảo tôi
  rationale: Giữ gần nghĩa thông thường “nói với/bảo”; không mặc nhiên thu hẹp thành “đòi hỏi” hoặc “yêu cầu”, dù ngữ cảnh thương lượng cho phép cách hiểu ấy.
- source_word: אֶתֵּן
  choice: tôi sẽ trao
  rationale: Giữ nghĩa rộng của נָתַן là “cho/trao”; không dịch thành “trả” vì như vậy sẽ giới hạn câu vào một khoản thanh toán.
