  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל שִׁמְע֣וֹן וְ/אֶל לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִ/י֒ לְ/הַבְאִישֵׁ֨/נִי֙ בְּ/יֹשֵׁ֣ב הָ/אָ֔רֶץ בַּֽ/כְּנַעֲנִ֖י וּ/בַ/פְּרִזִּ֑י וַ/אֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְ/נֶאֶסְפ֤וּ עָלַ/י֙ וְ/הִכּ֔וּ/נִי וְ/נִשְׁמַדְתִּ֖י אֲנִ֥י וּ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: vi
  text: 'Bấy giờ, Gia-cốp nói với Si-mê-ôn và Lê-vi: “Các con đã gây họa cho cha, khiến cha bị ghét bỏ[a] giữa cư dân trong xứ, giữa người Ca-na-an và người Phê-rê-sít. Vì cha chỉ có ít người, họ sẽ hợp lại chống cha và đánh cha; cha cùng cả nhà cha sẽ bị tiêu diệt.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “khiến cha bốc mùi”, một hình ảnh chỉ việc làm cho người khác ghét bỏ hoặc khinh miệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתֶּם אֹתִי
  choice: các con đã gây họa cho cha
  rationale: Động từ עכר chỉ việc gây rắc rối hoặc tai họa cho người khác. “Gây họa cho cha” tự nhiên trong lời người cha nói với các con và giữ được sức nặng của lời buộc tội.
- source_word: לְהַבְאִישֵׁנִי
  choice: khiến cha trở nên đáng ghét
  rationale: Nghĩa đen là “làm cho bốc mùi”, nhưng tại đây là hình ảnh chỉ việc làm cho Gia-cốp bị dân trong xứ ghét bỏ. Bản dịch chính dùng cách nói tự nhiên; hình ảnh nguyên ngữ được giữ trong chú thích.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: giữa cư dân trong xứ
  rationale: Phân từ số ít được dùng theo nghĩa tập thể, chỉ những người đang cư ngụ trong vùng đất ấy.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: giữa người Ca-na-an và người Phê-rê-sít
  rationale: Giới từ tiếp tục diễn tả cộng đồng mà trong đó danh tiếng của Gia-cốp đã bị tổn hại.
- source_word: מְתֵי מִסְפָּר
  choice: người của cha chỉ có ít
  rationale: Thành ngữ Hê-bơ-rơ diễn tả một nhóm người ít ỏi về số lượng. Cách dịch này làm rõ rằng Gia-cốp nói đến lực lượng thuộc gia đình mình.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: họ hợp lại chống cha
  rationale: Thể Niphal diễn tả các nhóm người tụ lại với ý thù địch. “Hợp lại chống cha” gọn, tự nhiên và giữ rõ sắc thái đối đầu.
- source_word: וְהִכּוּנִי
  choice: đánh cha
  rationale: נכה có nghĩa rộng là đánh, tấn công hoặc đánh bại. Trong mạch văn này, “đánh cha” giữ nguyên tính trực tiếp mà không quy định quá mức cách thức hay kết quả.
- source_word: וְנִשְׁמַדְתִּי
  choice: sẽ bị tiêu diệt
  rationale: Động từ שׁמד chỉ sự hủy diệt hoặc diệt trừ; “bị tiêu diệt” truyền đạt đầy đủ mức độ nghiêm trọng.
- source_word: בֵיתִי
  choice: cả nhà
  rationale: בַּיִת ở đây chỉ toàn thể gia đình hay hộ gia đình của Gia-cốp, không phải chỉ một tòa nhà.
theological_decisions: []
