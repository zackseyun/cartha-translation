- from: 'Bấy giờ, Gia-cốp nói với Si-mê-ôn và Lê-vi: “Các con đã gây họa cho cha, khiến cha trở nên đáng ghét[a] giữa cư dân trong xứ, tức là giữa người Ca-na-an và người Phê-rê-sít. Người của cha chỉ có ít; nếu họ hợp lại chống cha và đánh cha, thì cha cùng cả nhà sẽ bị tiêu diệt.”'
  to: 'Bấy giờ, Gia-cốp nói với Si-mê-ôn và Lê-vi: “Các con đã gây họa cho cha, khiến cha bị ghét bỏ[a] giữa cư dân trong xứ, giữa người Ca-na-an và người Phê-rê-sít. Vì cha chỉ có ít người, họ sẽ hợp lại chống cha và đánh cha; cha cùng cả nhà cha sẽ bị tiêu diệt.”'
  rationale: Bản sửa giữ nguyên nghĩa và sắc thái cảnh báo của nguyên văn, đồng thời thay một cụm tiếng Việt gượng bằng cách diễn đạt hiện đại, tự nhiên hơn. Cấu trúc nhân quả được phục hồi để phản ánh lời lo ngại trực tiếp của Gia-cốp. Chú thích vẫn bảo tồn hình ảnh mạnh theo nghĩa đen của động từ Hê-bơ-rơ.
