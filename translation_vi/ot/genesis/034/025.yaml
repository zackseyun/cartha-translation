    issue: Cụm thời gian “Đến ngày thứ ba”
    rationale: Cụm này có thể hàm ý diễn tiến ‘mãi đến ngày thứ ba’, trong khi tiếng Hê-bơ-rơ chỉ đặt sự việc vào một mốc thời gian. Đổi thành “Vào ngày thứ ba” loại bỏ sắc thái không có trong nguyên văn.
  revised_text: Vào ngày thứ ba[a], khi họ đang đau đớn, hai người con trai của Gia-cốp là Si-mê-ôn và Lê-vi, anh em trai của Đi-na, mỗi người cầm lấy thanh gươm của mình, tiến đánh thành vào lúc thành đang yên ổn[b], rồi giết tất cả người nam.
