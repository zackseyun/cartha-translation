- from: Đến ngày thứ ba[a], khi họ đang đau đớn, hai người con trai của Gia-cốp là Si-mê-ôn và Lê-vi, anh em trai của Đi-na, mỗi người cầm lấy gươm mình, tiến đánh thành lúc thành vẫn yên ổn[b], rồi giết tất cả người nam.
  to: Vào ngày thứ ba[a], khi họ đang đau đớn, hai người con trai của Gia-cốp là Si-mê-ôn và Lê-vi, anh em trai của Đi-na, mỗi người cầm lấy thanh gươm của mình, tiến đánh thành vào lúc thành đang yên ổn[b], rồi giết tất cả người nam.
  rationale: Chỉ thay “Đến” bằng “Vào” để diễn đạt mốc thời gian trực tiếp của nguyên ngữ, và điều chỉnh nhẹ cách nối câu cùng diễn đạt phương án chú thích để tiếng Việt tự nhiên hơn. Không thay đổi cách hiểu chính hay ý nghĩa của câu.
