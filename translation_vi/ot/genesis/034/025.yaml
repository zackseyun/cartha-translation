source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיוֹתָ֣/ם כֹּֽאֲבִ֗ים וַ/יִּקְח֣וּ שְׁנֵֽי בְנֵי יַ֠עֲקֹב שִׁמְע֨וֹן וְ/לֵוִ֜י אֲחֵ֤י דִינָה֙ אִ֣ישׁ חַרְבּ֔/וֹ וַ/יָּבֹ֥אוּ עַל הָ/עִ֖יר בֶּ֑טַח וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: vi
  text: Vào ngày thứ ba[a], khi họ đang đau đớn, hai người con trai của Gia-cốp là Si-mê-ôn và Lê-vi, anh em trai của Đi-na, mỗi người cầm lấy thanh gươm của mình, tiến đánh thành vào lúc thành đang yên ổn[b], rồi giết tất cả người nam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc trần thuật hơn: “Chuyện xảy ra vào ngày thứ ba, khi họ đang đau đớn, thì…”'
    reason: previous_rendering
  - marker: b
    text: Cũng có thể hiểu là “tiến đánh thành một cách tự tin, không chút e ngại.” Từ Hê-bơ-rơ בֶּטַח có thể mô tả cách những người tấn công tiến đến hoặc tình trạng yên ổn, không đề phòng của thành. Bản văn chính chọn cách hiểu thứ hai theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: Đến ngày thứ ba
  rationale: Diễn đạt tự nhiên công thức trần thuật cùng cụm thời gian, đồng thời giữ rõ trình tự sự việc; chú thích bảo lưu cách dịch sát cấu trúc hơn.
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: khi họ đang đau đớn
  rationale: Cấu trúc nguyên mẫu với giới từ diễn tả hoàn cảnh đồng thời; bản dịch không nói rõ nguyên nhân của cơn đau dù văn cảnh cho thấy đó là phép cắt bì.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: hai người con trai của Gia-cốp
  rationale: Giữ ý đây là hai người trong số các con trai của Gia-cốp và dùng cách nói tự nhiên trong tiếng Việt.
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: Si-mê-ôn và Lê-vi
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: אֲחֵי דִינָה
  choice: anh em trai của Đi-na
  rationale: Cụm đồng vị xác định quan hệ của Si-mê-ôn và Lê-vi với Đi-na; thêm “trai” để truyền đạt rõ nghĩa danh từ Hê-bơ-rơ.
- source_word: אִישׁ חַרְבּוֹ
  choice: mỗi người cầm lấy gươm mình
  rationale: אִישׁ có chức năng phân phối, chỉ mỗi người cầm thanh gươm của chính mình.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: tiến đánh thành
  rationale: בוא על trong văn cảnh diễn tả việc kéo đến chống lại hoặc tấn công; “tiến đánh” tự nhiên và giữ sắc thái chuyển động thù địch.
- source_word: בֶּטַח
  choice: lúc thành vẫn yên ổn
  rationale: Chọn cách hiểu trạng từ này mô tả tình trạng an ổn, không đề phòng của thành; chú thích giữ lại khả năng nó mô tả cách hai người tiến đến.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: rồi giết tất cả người nam
  rationale: הרג mang nghĩa thông thường là giết; זָכָר chỉ người thuộc giới tính nam, nên không thu hẹp thành những người đàn ông trưởng thành.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Câu văn giữ chuỗi hành động của nguyên bản nhưng dùng “rồi” để kết nối tự nhiên trong tiếng Việt. Các tên riêng theo dạng phiên âm Kinh Thánh tiếng Việt thông dụng.
