  to: 'Chỉ với điều kiện này, những người nam ấy mới đồng ý với chúng ta[a] để sống cùng chúng ta và trở thành một dân: mọi người nam trong chúng ta phải chịu cắt bao quy đầu, như họ chịu cắt bao quy đầu.'
  rationale: Sửa “những người ấy” thành “những người nam ấy” để bảo toàn quy chiếu giống đực của nguyên văn. Sửa “đã chịu” thành “chịu” để tránh thêm sắc thái hoàn tất không được đánh dấu rõ trong phân từ Hê-bơ-rơ. Các yếu tố khác được giữ nguyên vì phản ánh đúng cấu trúc điều kiện và thuật ngữ của câu nguồn.
