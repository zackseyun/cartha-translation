base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: vi
  text: 'Chỉ với điều kiện này, những người nam ấy mới đồng ý với chúng ta[a] để sống cùng chúng ta và trở thành một dân: mọi người nam trong chúng ta phải chịu cắt bao quy đầu, như họ chịu cắt bao quy đầu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ưng thuận với chúng ta” hoặc “bằng lòng với chúng ta”; động từ Hê-bơ-rơ diễn tả sự đồng ý hay chấp thuận.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Chỉ với điều kiện này
  rationale: Cụm từ mang ý giới hạn và nêu điều kiện duy nhất; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: יֵאֹתוּ לָנוּ
  choice: mới đồng ý với chúng ta
  rationale: Động từ Niphal diễn tả sự bằng lòng hoặc chấp thuận; “mới” kết hợp với mệnh đề điều kiện để thể hiện quan hệ chỉ khi... thì.
- source_word: הָאֲנָשִׁים
  choice: những người ấy
  rationale: Giữ quy chiếu đến nhóm người đang được bàn tới mà không thêm ý ngoài văn bản; giới tính của nhóm được làm rõ hơn qua yêu cầu “mọi người nam” ở cuối câu.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: để sống cùng chúng ta
  rationale: Diễn đạt tự nhiên ý cư trú chung của ישב trong tiếng Việt hiện đại.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: và trở thành một dân
  rationale: Giữ sắc thái kết quả của היה và bản sắc cộng đồng của עַם, không nâng thành khái niệm quốc gia hiện đại.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: mọi người nam trong chúng ta phải chịu cắt bao quy đầu
  rationale: Biểu đạt rõ điều kiện được đặt ra; “người nam” giữ phạm vi giới tính của זָכָר thay vì chỉ giới hạn ở đàn ông trưởng thành.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: như họ đã chịu cắt bao quy đầu
  rationale: Giữ phép so sánh và trạng thái đã được cắt bao quy đầu của nhóm kia; tiếng Việt dùng dạng hoàn thành này tự nhiên trong ngữ cảnh.
