  - severity: low
    issue: “như họ đã chịu cắt bao quy đầu” diễn đạt thì hoàn tất mạnh hơn phân từ נִמֹּלִים.
    rationale: Phân từ bị động trong mệnh đề so sánh chủ yếu nêu tình trạng/thực hành của họ. “như họ chịu cắt bao quy đầu” giữ sự so sánh mà không thêm sắc thái thời gian.
