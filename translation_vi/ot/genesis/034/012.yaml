  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: vi
  text: Các ông cứ đòi tôi sính lễ và quà tặng thật hậu hĩnh; các ông nói thế nào, tôi sẽ trao như thế. Chỉ cần gả cô gái ấy cho tôi làm vợ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: Hãy đòi tôi ... thật nhiều
  rationale: Cụm mệnh lệnh số nhiều diễn tả việc đặt lên người nói một yêu cầu rất lớn; cách dịch này tự nhiên trong tiếng Việt và giữ mức độ nhấn mạnh của מְאֹד.
- source_word: מֹהַר
  choice: sính lễ
  rationale: Chỉ khoản lễ vật do phía chú rể trao cho gia đình cô dâu; “sính lễ” chính xác và quen thuộc hơn “của hồi môn”, vốn thường chỉ tài sản từ phía cô dâu.
- source_word: וּמַתָּן
  choice: và quà tặng
  rationale: Chỉ quà biếu thêm bên cạnh sính lễ; giữ danh từ số ít mang nghĩa khái quát của nguyên văn.
- source_word: וְאֶתְּנָה
  choice: tôi cũng sẽ trao
  rationale: Thể cohortative bày tỏ sự sẵn lòng và quyết tâm đáp ứng; “sẽ trao” phù hợp với ngữ cảnh lễ vật hơn “sẽ cho”.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: các ông bảo tôi bao nhiêu
  rationale: Trong ngữ cảnh thương lượng số sính lễ và quà tặng, cụm này chỉ bất cứ mức nào họ nêu ra; bản dịch làm rõ đối tượng ngầm mà không ấn định một con số.
- source_word: וּתְנוּ לִי
  choice: Chỉ xin gả ... cho tôi
  rationale: Liên từ mở ra lời thỉnh cầu chủ chốt sau lời cam kết trả lễ; “chỉ xin” truyền đạt sắc thái khẩn khoản, còn “gả” diễn đạt tự nhiên hành động trao người nữ làm vợ trong tiếng Việt.
- source_word: הַנַּעֲרָ
  choice: cô gái ấy
  rationale: Chỉ một thiếu nữ hoặc phụ nữ trẻ đã xác định trong ngữ cảnh; cách gọi hiện đại, dễ hiểu và không cổ kính.
- source_word: לְאִשָּׁה
  choice: làm vợ
  rationale: Diễn đạt tự nhiên công thức hôn nhân Hê-bơ-rơ, giữ đúng mục đích của lời yêu cầu.
