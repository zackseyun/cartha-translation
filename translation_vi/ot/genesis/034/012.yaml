  rationale: Bản sửa giữ lời mời gọi có tính thương lượng, mức độ nhấn mạnh “rất lớn,” và lời cam kết đáp ứng theo điều người nghe nêu ra. Cụm “Chỉ cần” phản ánh chức năng tu từ của lời thỉnh cầu chủ chốt mà không thêm một điều kiện thần học hay pháp lý. Chú thích hiện có chính xác và được giữ nguyên.
