translation_notes:
  register: Lời thoại hiện đại, trang trọng vừa phải. Dùng “các ông” vì các động từ ở số nhiều và Si-chem đang nói với cha cùng các anh của Đi-na. Dấu ngoặc kép cuối câu phản ánh đây là phần kết của lời nói trực tiếp trong văn mạch.
