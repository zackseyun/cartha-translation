  text: וְ/הִֽתְחַתְּנ֖וּ אֹתָ֑/נוּ בְּנֹֽתֵי/כֶם֙ תִּתְּנוּ לָ֔/נוּ וְ/אֶת בְּנֹתֵ֖י/נוּ תִּקְח֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: vi
  text: 'Hãy kết thông gia với chúng tôi: hãy gả con gái các ông cho chúng tôi[a], và hãy cưới con gái chúng tôi về làm vợ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có nghĩa sát hơn là “hãy trao con gái các ông cho chúng tôi”; trong ngữ cảnh này, đó là trao để kết hôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִֽתְחַתְּנוּ אֹתָנוּ
  choice: Hãy kết thông gia với chúng tôi
  rationale: Động từ hitpael của חתן diễn tả việc hai bên cùng thiết lập quan hệ hôn nhân. “Kết thông gia” tự nhiên trong tiếng Việt và giữ được sắc thái tương hỗ.
- source_word: בְּנֹתֵיכֶם תִּתְּנוּ לָנוּ
  choice: hãy gả con gái các ông cho chúng tôi
  rationale: Trong ngữ cảnh hôn nhân, נתן con gái cho ai có nghĩa là gả con gái. Dùng “gả” làm rõ nghĩa vốn có trong ngữ cảnh và tránh cách nói “trao con gái” thiếu tự nhiên hoặc dễ gây hiểu sai.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: và hãy cưới con gái chúng tôi về làm vợ
  rationale: לקח với đối tượng là con gái trong ngữ cảnh này chỉ việc lấy làm vợ. “Cưới ... về làm vợ” là cách diễn đạt tiếng Việt tự nhiên, đồng thời giữ thế đối ứng với “gả” ở vế trước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “các ông/chúng tôi” phản ánh lời đề nghị giữa hai nhóm nam giới. Cấu trúc hai vế đối ứng được giữ lại, còn các động từ “gả” và “cưới” chuyển tải rõ nghĩa hôn nhân vốn hàm chứa trong tiếng Hê-bơ-rơ.
