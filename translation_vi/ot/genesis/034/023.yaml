  terminology: “Gia súc” cho מִקְנֶה và “tài sản” cho קִנְיָן là thích hợp. Đổi “súc vật” thành “thú vật” cho בְּהֵמָה giúp cách dùng hiện đại, trung tính hơn; không thay đổi phạm vi rộng của từ gốc.
  issues:
