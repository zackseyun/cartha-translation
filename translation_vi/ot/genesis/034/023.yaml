  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: vi
  text: Chẳng phải gia súc, tài sản và mọi thú vật của họ rồi sẽ thuộc về chúng ta sao? Chỉ cần chúng ta đồng ý với họ, thì họ sẽ ở cùng chúng ta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: gia súc
  rationale: מִקְנֶה chỉ đàn vật nuôi như một phần của cải; “gia súc” tự nhiên và phù hợp với sắc thái kinh tế trong ngữ cảnh.
- source_word: קִנְיָנָם
  choice: tài sản
  rationale: קִנְיָן chỉ những gì được sở hữu hay tích lũy; “tài sản” giữ được nghĩa rộng, không giới hạn vào động sản.
- source_word: כָל בְּהֶמְתָּם
  choice: mọi súc vật của họ
  rationale: בְּהֵמָה là từ rộng chỉ thú vật, thường là vật nuôi. “Mọi súc vật” giữ sắc thái bao quát của כָל và phân biệt vừa đủ với מִקְנֶה.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: Chẳng phải ... rồi sẽ thuộc về chúng ta sao?
  rationale: הֲלוֹא mở đầu câu hỏi tu từ mong đợi sự tán thành. “Rồi sẽ thuộc về chúng ta” diễn đạt tự nhiên ý chiếm hữu mà những người nói đang dùng để thuyết phục.
- source_word: אַךְ
  choice: Chỉ cần
  rationale: אַךְ đánh dấu điều kiện giới hạn hay trọng tâm; trong tiếng Việt, “chỉ cần” nối tự nhiên với lời đề nghị theo sau.
- source_word: נֵאֹותָה
  choice: chúng ta đồng ý với họ
  rationale: Dạng này của אוה mang nghĩa bằng lòng, ưng thuận hay đồng ý. Cách dịch giữ ngôi thứ nhất số nhiều mang tính khích lệ mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: thì họ sẽ ở cùng chúng ta
  rationale: יָשַׁב có thể là ở, cư ngụ hoặc định cư. “Ở cùng chúng ta” giữ nghĩa cơ bản và không diễn giải quá mức về mức độ hội nhập.
