  text: וַ/יִּֽיטְב֥וּ דִבְרֵי/הֶ֖ם בְּ/עֵינֵ֣י חֲמ֑וֹר וּ/בְ/עֵינֵ֖י שְׁכֶ֥ם בֶּן חֲמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/018.yaml
  text: Their words seemed good to Hamor and to Shechem son of Hamor[a].
translation:
  language: vi
  text: Những lời của họ làm hài lòng Hamor và Shechem, con trai Hamor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Những lời của họ được Hamor và Shechem, con trai Hamor, xem là tốt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: làm hài lòng
  rationale: Trong thành ngữ với בְּעֵינֵי, động từ יטב diễn tả sự đánh giá thuận ý hoặc chấp thuận. “Làm hài lòng” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn giữ chủ ngữ là “những lời của họ”.
- source_word: דִבְרֵיהֶם
  choice: những lời của họ
  rationale: Giữ nghĩa số nhiều trực tiếp của דָּבָר cùng hậu tố ngôi thứ ba số nhiều; không thu hẹp nghĩa thành “đề nghị”.
- source_word: בְּעֵינֵי
  choice: làm hài lòng
  rationale: Thành ngữ nghĩa đen là “trong mắt”, nhưng trong ngữ cảnh này biểu thị điều được xem là tốt hoặc đáng chấp thuận. Nghĩa của thành ngữ được chuyển tự nhiên qua cấu trúc “làm hài lòng”.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Tên riêng được phiên chuyển nhất quán theo dạng quen dùng trong lớp tham khảo.
- source_word: שְׁכֶם
  choice: Shechem
  rationale: Tên riêng được phiên chuyển nhất quán theo dạng quen dùng trong lớp tham khảo.
- source_word: בֶּן חֲמוֹר
  choice: con trai Hamor
  rationale: Cách diễn đạt tự nhiên, trang trọng vừa phải, giữ nguyên quan hệ phụ tử và trật tự nhận diện của tiếng Hê-bơ-rơ.
