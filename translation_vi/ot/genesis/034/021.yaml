- from: “Những người này đang sống hòa thuận với chúng ta.[a] Hãy để họ cư ngụ trong xứ và buôn bán tại đây,[b] vì xứ này, anh em thấy đó, đủ rộng cho họ.[c] Chúng ta sẽ cưới con gái họ làm vợ và gả con gái chúng ta cho họ.”
  to: “Những người này có quan hệ hòa hiếu với chúng ta.[a] Hãy để họ cư ngụ trong xứ và buôn bán trong đó,[b] vì kìa, xứ này đủ rộng cho họ.[c] Chúng ta sẽ cưới con gái họ làm vợ và gả con gái chúng ta cho họ.”
  rationale: Bản sửa thay cách diễn đạt có thể gợi ý việc cùng cư trú bằng cụm chỉ quan hệ hòa hiếu, giữ dấu hiệu diễn ngôn הִנֵּה mà không thêm cách xưng hô, và chỉnh chú thích thành ngữ cho chính xác, dễ hiểu hơn. Các yếu tố về cư trú, giao thương, sự rộng rãi của xứ, và hôn nhân hỗ tương đều được giữ nguyên.
