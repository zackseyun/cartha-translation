  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc lời đề nghị: quan hệ hòa bình, cho phép cư ngụ và giao thương, đất đai rộng rãi, cùng sự sắp đặt hôn nhân hỗ tương. Tuy nhiên, “đang sống hòa thuận với chúng ta” có thể gợi ý họ đang sống chung trong cộng đồng, trong khi câu Hê-bơ-rơ nói về tình trạng quan hệ hòa bình; điều này đặc biệt không phù hợp với lời kế tiếp xin cho họ được cư ngụ trong xứ. “Anh em thấy đó” thêm cách xưng hô không có trong nguyên văn. Chú thích c cần chỉnh phần diễn dịch sát nghĩa đen của thành ngữ.'
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng vừa phải. “Có quan hệ hòa hiếu với chúng ta” diễn đạt rõ hơn trạng thái quan hệ được nói đến. “Vì kìa” giữ lực thu hút chú ý của הִנֵּה mà không thêm người nghe vào lời nói.
  terminology: “Cư ngụ,” “buôn bán trong xứ,” “cưới ... làm vợ,” và “gả ... cho họ” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại và giữ đúng các thành ngữ hôn nhân trong nguyên ngữ. “Hòa hiếu” phù hợp hơn “hòa thuận” cho quan hệ giữa hai nhóm người.
