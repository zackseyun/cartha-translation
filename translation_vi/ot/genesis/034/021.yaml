source:
  edition: WLC
  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: vi
  text: “Những người này có quan hệ hòa hiếu với chúng ta.[a] Hãy để họ cư ngụ trong xứ và buôn bán trong đó,[b] vì kìa, xứ này đủ rộng cho họ.[c] Chúng ta sẽ cưới con gái họ làm vợ và gả con gái chúng ta cho họ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang hòa bình với chúng ta” hoặc “thân thiện với chúng ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “buôn bán qua xứ này”; tiếng Hê-bơ-rơ có thể chỉ việc giao thương trong xứ hoặc đi qua lãnh thổ để giao thương.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “xứ—kìa—rộng về hai phía trước mặt họ,” một thành ngữ có nghĩa là xứ rộng rãi hoặc có nhiều chỗ cho họ.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: đang sống hòa thuận với chúng ta
  rationale: Diễn đạt trạng thái quan hệ hòa bình, tốt đẹp với cộng đồng, không hàm ý tình cảm thân thiết quá mức.
- source_word: וְיֵשְׁבוּ
  choice: Hãy để họ cư ngụ
  rationale: Dạng vị hoàn thành chưa trọn trong ngữ cảnh mang sắc thái đề nghị/khuyến nghị cho phép họ định cư; “cư ngụ” trang trọng nhưng vẫn tự nhiên.
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: và buôn bán tại đây
  rationale: סחר chỉ hoạt động thương mại; đại từ giống cái quy chiếu về xứ. “Tại đây” tự nhiên trong tiếng Việt, đồng thời chú thích giữ khả năng hiểu là buôn bán qua lãnh thổ.
- source_word: הִנֵּה
  choice: anh em thấy đó
  rationale: Giữ chức năng thu hút sự chú ý và đưa ra lý do hỗ trợ, với cách nói hiện đại phù hợp lời phát biểu trước dân thành.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: đủ rộng cho họ
  rationale: Chuyển thành ngữ “rộng hai tay trước mặt họ” sang ý nghĩa tự nhiên là có không gian rộng rãi, đủ chỗ cho họ.
- source_word: אֶת בְּנֹתָם נִקַּח לָנוּ לְנָשִׁים
  choice: Chúng ta sẽ cưới con gái họ làm vợ
  rationale: Truyền đạt ý định kết hôn và sắc thái “cho mình/chúng ta” mà không tạo lối lặp gượng gạo trong tiếng Việt.
- source_word: וְאֶת בְּנֹתֵינוּ נִתֵּן לָהֶם
  choice: và gả con gái chúng ta cho họ
  rationale: “Gả” là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ trao con gái trong hôn nhân và giữ tính hỗ tương của đề nghị.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời kêu gọi được thể hiện bằng “Hãy để”; “anh em thấy đó” tái hiện lực diễn ngôn của הִנֵּה trong lời nói công khai. Các dấu chú thích được đặt ngay sau mệnh đề liên quan, thay vì dồn sai vị trí ở cuối câu.
