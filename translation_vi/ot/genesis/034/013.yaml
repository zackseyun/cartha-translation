revisions:
- from: Các con trai Gia-cốp dùng lời gian dối[a] đáp lại Si-chem và Hê-mô, cha chàng, vì Si-chem đã làm ô uế[b] Đi-na, em gái họ.
  to: Các con trai của Gia-cốp đã đáp lại Si-chem và Hê-mô, cha của Si-chem, một cách gian dối[a], và nói như vậy vì Si-chem đã làm ô uế[b] Đi-na, người chị/em gái của họ.
  rationale: Bản sửa bảo toàn rõ cả hai động từ liên tiếp trong nguyên văn (“đáp lại ... và nói”), làm rõ rằng Hê-mô là cha của Si-chem, và không áp đặt thứ bậc tuổi tác mà tiếng Hê-bơ-rơ không nêu trong câu. Các chú thích vẫn neo đúng tại “gian dối” và “làm ô uế”, đồng thời duy trì sắc thái từ vựng của nguồn.
