  text: וַ/יַּעֲנ֨וּ בְנֵֽי יַעֲקֹ֜ב אֶת שְׁכֶ֨ם וְ/אֶת חֲמ֥וֹר אָבִ֛י/ו בְּ/מִרְמָ֖ה וַ/יְדַבֵּ֑רוּ אֲשֶׁ֣ר טִמֵּ֔א אֵ֖ת דִּינָ֥ה אֲחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: vi
  text: Các con trai của Gia-cốp đã đáp lại Si-chem và Hê-mô, cha của Si-chem, một cách gian dối[a], và nói như vậy vì Si-chem đã làm ô uế[b] Đi-na, người chị/em gái của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “bằng sự gian dối”; danh từ Hê-bơ-rơ được dùng với chức năng trạng ngữ.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể diễn đạt theo ngữ cảnh là “đã xâm phạm”. Nguyên văn dùng từ “làm ô uế”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: đáp lại
  rationale: Động từ ענה trong mạch đối thoại này diễn tả lời đáp đối với đề nghị vừa được đưa ra.
- source_word: בְנֵי יַעֲקֹב
  choice: các con trai Gia-cốp
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ rõ quan hệ gia đình trong cụm trạng thái liên kết của tiếng Hê-bơ-rơ.
- source_word: בְּמִרְמָה
  choice: dùng lời gian dối
  rationale: Danh từ מִרְמָה đi với giới từ בְּ mang chức năng trạng ngữ. Cách dịch này tự nhiên và kết hợp được hai động từ ‘đáp’ và ‘nói’ mà không làm mất ý họ cố ý lừa dối.
- source_word: וַיְדַבֵּרוּ
  choice: dùng lời … đáp lại
  rationale: Ý ‘nói’ được thể hiện trong cụm ‘dùng lời … đáp lại’, tránh lối dịch cứng ‘đáp lại… và nói’ trong tiếng Việt nhưng vẫn bảo toàn hành động phát ngôn.
- source_word: אֲשֶׁר
  choice: vì
  rationale: Trong ngữ cảnh, אֲשֶׁר dẫn vào lý do khiến các anh em trả lời cách gian dối.
- source_word: טִמֵּא
  choice: đã làm ô uế
  rationale: Giữ trường nghĩa đạo đức và nghi lễ của טמא ở thể Piel, thay vì chỉ diễn giải bằng một thuật ngữ chỉ hành vi xâm phạm.
- source_word: אֲחֹתָם
  choice: em gái họ
  rationale: Trong tiếng Việt, Đi-na là em của các con trai Gia-cốp có mặt trong câu chuyện; ‘em gái họ’ tự nhiên và xác định rõ quan hệ gia đình.
- source_word: אֶת־שְׁכֶם וְאֶת־חֲמוֹר אָבִיו
  choice: Si-chem và Hê-mô, cha chàng
  rationale: Giữ cả hai tân ngữ và cho thấy ‘cha chàng’ quy chiếu đến Hê-mô là cha của Si-chem. ‘Chàng’ phù hợp với văn kể trang trọng, tránh lặp tên.
theological_decisions:
- issue: Sắc thái của טִמֵּא trong bối cảnh bạo lực tình dục
  choice: làm ô uế
  alternative: xâm phạm
  rationale: ‘Làm ô uế’ giữ nguyên ngôn ngữ đạo đức-nghi lễ của bản Hê-bơ-rơ; chú thích nêu cách diễn đạt theo ngữ cảnh mà không thu hẹp từ gốc vào một cách giải nghĩa duy nhất.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc. Cụm ‘dùng lời gian dối đáp lại’ chuyển tải tự nhiên cả hành động đáp lời lẫn động từ ‘nói’ trong nguyên văn.
