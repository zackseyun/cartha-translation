  - severity: low
    issue: “Em gái họ” thu hẹp nghĩa của אֲחֹתָם.
    rationale: Danh từ “sister” trong tiếng Hê-bơ-rơ không xác định Đi-na lớn hay nhỏ tuổi hơn các anh em trong chính câu này. Nên dùng cách nói không ấn định thứ bậc tuổi tác.
