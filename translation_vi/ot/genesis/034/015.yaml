  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: vi
  text: 'Chúng tôi chỉ đồng ý với các ông với điều kiện này: nếu các ông trở nên giống như chúng tôi qua việc tất cả nam giới của các ông chịu cắt bì.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: chỉ ... với điều kiện này
  rationale: אַךְ mang ý giới hạn, còn בְּזֹאת giới thiệu điều kiện cụ thể; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: נֵאוֹת לָכֶם
  choice: đồng ý với các ông
  rationale: Động từ Niphal của אוה diễn tả sự thuận lòng hay chấp thuận; “đồng ý với” phù hợp với ngữ cảnh thương lượng và cách dùng tiếng Việt hiện đại.
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: các ông phải trở nên giống như chúng tôi
  rationale: אִם đặt ra điều kiện, và היה ở đây chỉ việc bước vào một tình trạng mới. Trong cấu trúc tiếng Việt “với điều kiện này”, “phải” diễn đạt tự nhiên nội dung điều kiện mà không biến nó thành mệnh lệnh độc lập.
- source_word: לְהִמֹּל
  choice: bằng cách cho ... chịu cắt bì
  rationale: Dạng Niphal nguyên mẫu diễn tả việc được cắt bì và giải thích phương cách họ trở nên giống người nói. “Cho ... chịu cắt bì” giữ ý bị động/tác động lên những người nam, tránh hàm ý rằng họ tự thực hiện nghi thức.
- source_word: לָכֶם כָּל זָכָר
  choice: mọi người nam trong các ông
  rationale: כָּל זָכָר có ý phân phối là từng người nam, còn לָכֶם xác định họ thuộc cộng đồng được nói đến.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” cho đối tượng số nhiều trong cuộc thương lượng; “cắt bì” là thuật ngữ Kinh Thánh phổ biến. Không thêm chú thích vì các sắc thái chính có thể được thể hiện rõ trong chính văn.
