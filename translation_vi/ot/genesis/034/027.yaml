base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: vi
  text: Các con trai Gia-cốp đến chỗ những người đã bị giết và cướp phá thành ấy, vì em gái họ đã bị làm ô nhục.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn có cấu trúc cô đọng: “thành mà họ đã làm ô nhục em gái họ.” Chủ thể của “họ đã làm ô nhục” không được nêu trực tiếp; ngữ cảnh chỉ những người thuộc thành, chứ không phải các con trai Gia-cốp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: Các con trai Gia-cốp
  rationale: Giữ rõ cấu trúc sở thuộc và nhấn mạnh các con trai của Gia-cốp như một nhóm hành động.
- source_word: בָּאוּ עַל הַחֲלָלִים
  choice: đến chỗ những người đã bị giết
  rationale: בוא על diễn tả sự tiến đến hoặc đến trên/đến chỗ; חֲלָלִים chỉ những người bị giết trong bạo lực. Cách dịch này tự nhiên trong tiếng Việt và không biến hành động thành một cuộc tấn công mới nhằm vào người đã chết.
- source_word: וַיָּבֹזּוּ הָעִיר
  choice: và cướp phá thành
  rationale: בזז là lấy chiến lợi phẩm, cướp bóc; “cướp phá” vừa hiện đại vừa phù hợp với việc chiếm đoạt tài sản sau cuộc tàn sát.
- source_word: אֲשֶׁר
  choice: vì ... tại đó
  rationale: Tiểu từ quan hệ mở đầu một mệnh đề cô đọng gắn với “thành”; trong ngữ cảnh, mệnh đề nêu lý do cướp phá. “Tại đó” giúp giữ liên hệ với thành và tránh khiến chủ ngữ ngầm bị hiểu sai là các con trai Gia-cốp.
- source_word: טִמְּאוּ
  choice: đã bị làm ô nhục
  rationale: Piel của טמא ở đây nói đến việc làm ô uế qua hành vi xâm phạm tình dục, đồng thời mang sắc thái đạo đức và xã hội. Dạng bị động tiếng Việt bảo toàn ý nghĩa mà không gán nhầm hành động cho các con trai Gia-cốp.
- source_word: אֲחוֹתָם
  choice: em gái họ
  rationale: Trong mạch truyện, Đi-na là em gái của các con trai Gia-cốp; “em gái họ” tự nhiên và giữ động cơ gia đình của hành động.
theological_decisions:
- issue: Chủ thể ngầm của טִמְּאוּ
  choice: 'Dùng bị động: “em gái họ đã bị làm ô nhục tại đó”'
  alternative: “vì họ đã làm ô nhục em gái mình”
  rationale: Động từ Hebrew ở số nhiều có chủ thể không được nêu trực tiếp trong mệnh đề cô đọng. Bản dịch chủ động với “họ” trong tiếng Việt rất dễ quy chiếu về các con trai Gia-cốp và đảo ngược ý nghĩa câu chuyện. Dạng bị động tránh nhận diện sai thủ phạm, còn “tại đó” nối mệnh đề với thành mà không chỉ đích danh chủ thể vượt quá câu Hebrew.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. “Làm ô nhục” giữ được sắc thái đạo đức-xã hội của טמא trong ngữ cảnh xâm phạm tình dục; câu bị động loại bỏ một sự mơ hồ quy chiếu nghiêm trọng trong tiếng Việt nhưng chú thích vẫn cho biết cấu trúc Hebrew trực tiếp.
