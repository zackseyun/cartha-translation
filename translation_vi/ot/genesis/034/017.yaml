  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: vi
  text: Nhưng nếu các ông không nghe lời chúng tôi về việc chịu cắt bì[a], thì chúng tôi sẽ đưa con gái chúng tôi đi khỏi đây.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát cấu trúc Hê-bơ-rơ: “không nghe lời chúng tôi để chịu cắt bì.” Động từ nguyên mẫu có thể nêu nội dung của điều họ phải nghe theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Nhưng nếu
  rationale: Liên từ mở đầu một điều kiện tương phản với đề nghị ở câu trước; “Nhưng nếu” diễn đạt tự nhiên cả ý nối kết lẫn đối lập.
- source_word: לֹא תִשְׁמְעוּ אֵלֵינוּ
  choice: các ông không nghe lời chúng tôi
  rationale: שׁמע đi với אֶל có nghĩa là nghe hoặc lưu tâm đến; trong ngữ cảnh thương lượng, “nghe lời” chuyển tải đúng ý chấp thuận mà không mạnh đến mức phải dịch là “vâng phục”.
- source_word: לְ/הִמּוֹל
  choice: mà chịu cắt bì
  rationale: Động từ nguyên mẫu nêu nội dung hoặc hành động cụ thể của việc nghe lời. “Chịu cắt bì” giữ nghĩa thụ động/phản thân và kết nối tự nhiên với mệnh đề trước trong tiếng Việt.
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: thì chúng tôi sẽ đưa con gái mình
  rationale: Trong vế kết quả của câu điều kiện, dạng động từ mang nghĩa tương lai. Ở ngữ cảnh này, לקח là đem/đưa người con gái theo mình; “đưa” tự nhiên hơn “lấy” trong tiếng Việt.
- source_word: וְ/הָלָכְנוּ
  choice: đi khỏi đây
  rationale: הלך ở đây chỉ việc ra đi. Thêm “khỏi đây” làm rõ hướng nghĩa theo ngữ cảnh mà không thêm một địa điểm không có trong nguyên văn.
