  - severity: low
    issue: “Vợ của dân thành” là diễn giải thêm và không tự nhiên bằng “vợ của họ”.
    rationale: Hậu tố -họ trong tiếng Hê-bơ-rơ đã đủ xác định nhóm người liên hệ từ ngữ cảnh; không cần thêm “dân thành” vào văn bản dịch.
