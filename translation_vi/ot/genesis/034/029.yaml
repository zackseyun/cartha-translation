base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: vi
  text: Họ bắt tất cả con trẻ[a] và vợ của họ làm tù binh, rồi cướp bóc mọi của cải của họ cùng mọi thứ trong nhà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “con cái” hoặc “những người lệ thuộc trong gia đình”; từ Hê-bơ-rơ טַף thường chỉ trẻ nhỏ hay những người lệ thuộc trong gia đình.'
    reason: lexical_alternative
  - marker: b
    text: “Trong nhà” cũng có thể hiểu là “trong gia hộ”, bao gồm tài sản thuộc gia đình.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: mọi của cải của họ
  rationale: חַיִל ở đây chỉ tài sản hoặc nguồn của cải của dân thành; “của cải” đủ rộng và không thu hẹp nghĩa vào gia súc hay sức mạnh quân sự.
- source_word: טַפָּם
  choice: tất cả con trẻ
  rationale: טַף thường chỉ trẻ nhỏ hoặc những người lệ thuộc trong gia đình; “con trẻ” tự nhiên, trang trọng và giữ được nét nghĩa về trẻ nhỏ.
- source_word: נְשֵׁיהֶם
  choice: vợ của dân thành
  rationale: אִשָּׁה có thể là “phụ nữ” hoặc “vợ”; trong danh sách các thành viên gia đình bị bắt đi, nghĩa quan hệ “vợ” phù hợp hơn. Cụm “dân thành” làm rõ sở chỉ của hậu tố số nhiều trong tiếng Việt.
- source_word: שָׁבוּ
  choice: bắt đi
  rationale: שָׁבָה nghĩa là bắt làm tù binh hoặc dẫn đi như người bị bắt. “Bắt đi” diễn đạt tự nhiên hành động áp dụng cho con trẻ và các bà vợ.
- source_word: וַיָּבֹזּוּ
  choice: cướp lấy
  rationale: בזז chỉ việc cướp bóc, lấy chiến lợi phẩm; “cướp lấy” giữ rõ sắc thái bạo lực và hợp với các đối tượng là của cải, vật dụng.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: mọi thứ trong nhà
  rationale: Bám sát nghĩa cụ thể của בַּבָּיִת là “trong nhà”, đồng thời vẫn để ngỏ khả năng “nhà” được dùng theo nghĩa rộng hơn là gia hộ.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp lại theo quan hệ ngữ nghĩa để “bắt đi” áp dụng cho người và “cướp lấy” áp dụng cho tài sản; cách này tránh khiến “của cải” trở thành đối tượng bị bắt làm tù binh, dù trật tự từ khác với tiếng Hê-bơ-rơ.
