  source_fidelity: 'Bản dịch phản ánh đầy đủ chuỗi kết quả tương lai trong lời thương lượng: gả con gái cho họ, cưới con gái của họ, sống chung, và trở thành một dân. “Gả” và “cưới ... về” diễn đạt đúng hàm ý hôn nhân của các động từ ‘cho’ và ‘lấy’ trong ngữ cảnh, không làm sai nghĩa nguồn.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp liệt kê tự nhiên. Cặp đại từ “chúng tôi/các ông” phù hợp với lời phát biểu giữa các đại diện nam giới trong văn cảnh.
  terminology: “Một dân” giữ được ý nghĩa cộng đồng/người dân của עַם, tránh đồng nhất với nhà nước hiện đại. Chú thích nêu chính xác khả năng thay thế “sẽ là một dân” và bảo tồn sự mở của động từ היה.
