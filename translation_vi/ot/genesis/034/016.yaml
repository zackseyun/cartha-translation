base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: vi
  text: thì chúng tôi sẽ gả con gái mình cho các ông, cưới con gái các ông về cho mình, sống cùng các ông và trở thành một dân.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và sẽ là một dân.” Tiếng Hê-bơ-rơ dịch sát là “và chúng tôi sẽ là một dân”, có thể hiểu là đi đến một trạng thái mới (“trở thành một dân”) hoặc đơn giản là ở trong trạng thái ấy (“là một dân”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ אֶת־בְּנֹתֵינוּ לָכֶם
  choice: thì chúng tôi sẽ gả con gái mình cho các ông
  rationale: Trong mạch điều kiện của cuộc thương lượng, động từ hoàn thành với waw mang ý nghĩa kết quả trong tương lai; “thì… sẽ” thể hiện tự nhiên quan hệ ấy. “Gả con gái… cho” là cách nói tiếng Việt đúng với hành động trao con gái làm vợ trong ngữ cảnh.
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ
  choice: cưới con gái các ông về cho mình
  rationale: לקח có nghĩa cơ bản là “lấy”, nhưng trong sự sắp đặt hôn nhân này, “cưới… về” truyền đạt rõ và tự nhiên ý lấy làm vợ; לָנוּ được thể hiện bằng “cho mình”.
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: sống cùng các ông
  rationale: ישב ở đây chỉ việc cư trú, chung sống; “sống cùng” là cách diễn đạt hiện đại, tự nhiên hơn “cư ngụ” mà vẫn sát nghĩa.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: và trở thành một dân
  rationale: עם chỉ một cộng đồng dân tộc hơn là một quốc gia chính trị hiện đại. “Trở thành” diễn đạt trạng thái kết quả trong ngữ cảnh, nhưng chú thích giữ lại khả năng dịch trang trọng, sát chữ là “sẽ là”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải. Đại từ “chúng tôi—các ông” phù hợp với lời thương lượng giữa hai nhóm nam giới; “một dân” tránh sắc thái nhà nước hiện đại của “một quốc gia”.
