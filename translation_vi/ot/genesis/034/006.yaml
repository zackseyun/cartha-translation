  text: וַ/יֵּצֵ֛א חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם אֶֽל יַעֲקֹ֑ב לְ/דַבֵּ֖ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/006.yaml
  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: vi
  text: Bấy giờ, Ha-mô, cha của Si-chem, đi ra gặp Gia-cốp để nói chuyện với ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Bấy giờ ... đi ra
  rationale: Động từ יצא ở dạng wayyiqtol vừa tiếp nối diễn tiến câu chuyện vừa giữ ý chuyển động “đi ra”. “Bấy giờ” thể hiện tự nhiên chức năng kể chuyện của tiền tố וַ.
- source_word: חֲמוֹר
  choice: Ha-mô
  rationale: Phiên âm tên riêng theo lối quen thuộc và dễ đọc trong tiếng Việt.
- source_word: אֲבִי שְׁכֶם
  choice: cha của Si-chem
  rationale: Giữ rõ quan hệ trực tiếp trong chuỗi liên thuộc Hê-bơ-rơ.
- source_word: אֶל יַעֲקֹב
  choice: gặp Gia-cốp
  rationale: Giới từ אֶל chỉ hướng chuyển động đến một người. Trong tiếng Việt, “đi ra gặp Gia-cốp” tự nhiên hơn “đi ra đến Gia-cốp” mà vẫn truyền đạt đúng đích đến và cuộc gặp.
- source_word: לְדַבֵּר אִתּוֹ
  choice: để nói chuyện với ông
  rationale: Cấu trúc לְ + động từ nguyên mẫu biểu thị mục đích; אִתּוֹ mang sắc thái tương tác, nên “nói chuyện với ông” thích hợp hơn “nói với ông”. Đại từ chỉ Gia-cốp, tiền ngữ gần nhất.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “ông” để chỉ Gia-cốp nhằm tránh lặp tên và duy trì sắc thái kính trọng tự nhiên.
