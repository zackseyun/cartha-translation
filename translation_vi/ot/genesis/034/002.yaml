  source_fidelity: 'Bản dịch bám sát chuỗi động từ Hê-bơ-rơ: Si-chem thấy Đi-na, bắt lấy nàng, nằm với nàng, rồi làm nhục nàng. “Làm nhục” phản ánh phạm vi nghĩa của וַיְעַנֶּהָ (làm khổ/hạ nhục/xâm phạm) mà không ép động từ đơn lẻ phải mang một thuật ngữ pháp lý hiện đại; chú thích làm rõ đúng rằng trong ngữ cảnh này מדובר là xâm phạm tình dục. “Bắt lấy” là diễn đạt theo ngữ cảnh có sức cưỡng bức, nhưng vẫn phù hợp với chuỗi hành động và không làm sai ý câu. Cụm “Ha-mô người Hê-vít” cũng giữ được cách gắn danh xưng Hê-vít với Ha-mô theo cấu trúc tiếng Việt tự nhiên.'
  naturalness: Câu văn trang nghiêm, hiện đại và dễ hiểu. “Nằm với nàng” là lối nói Kinh Thánh tự nhiên, kín đáo nhưng không che giấu quan hệ tình dục khi đi cùng mệnh đề sau và chú thích. “Thủ lĩnh của xứ” truyền đạt địa vị của נְשִׂיא mà không gán chế độ quân chủ.
  terminology: Tên riêng Si-chem, Ha-mô và tên dân Hê-vít nhất quán với lối phiên âm Kinh Thánh tiếng Việt. “Thủ lĩnh” là lựa chọn thích hợp cho נְשִׂיא. Chú thích dùng “xâm phạm tình dục” và nêu phương án “cưỡng hiếp nàng” một cách thận trọng, không áp đặt phương án đó lên bản văn chính.
