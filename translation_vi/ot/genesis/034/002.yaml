  text: וַ/יַּ֨רְא אֹתָ֜/הּ שְׁכֶ֧ם בֶּן חֲמ֛וֹר הַֽ/חִוִּ֖י נְשִׂ֣יא הָ/אָ֑רֶץ וַ/יִּקַּ֥ח אֹתָ֛/הּ וַ/יִּשְׁכַּ֥ב אֹתָ֖/הּ וַ/יְעַנֶּֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: vi
  text: Khi Si-chem, con trai Ha-mô người Hê-vít, là thủ lĩnh của xứ, thấy nàng, thì bắt lấy nàng, nằm với nàng và làm nhục nàng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ có thể mang nghĩa “làm khổ”, “hạ nhục” hoặc “xâm phạm”. Trong ngữ cảnh này, từ ấy chỉ hành vi xâm phạm tình dục; vì vậy nhiều bản dịch diễn đạt rõ hơn là “cưỡng hiếp nàng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Nghĩa kể chuyện cơ bản của ראה; cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: Si-chem, con trai Ha-mô người Hê-vít
  rationale: Phiên âm tên riêng và tên dân tộc theo lối quen thuộc trong Kinh Thánh tiếng Việt; cấu trúc này giữ được khả năng 'người Hê-vít' bổ nghĩa trực tiếp cho Ha-mô như trong tiếng Hê-bơ-rơ.
- source_word: נְשִׂיא הָאָרֶץ
  choice: thủ lĩnh của xứ
  rationale: נָשִׂיא chỉ người đứng đầu hoặc thủ lĩnh; 'thủ lĩnh' giữ địa vị chính trị-xã hội mà không hàm ý chế độ quân chủ như 'hoàng tử'.
- source_word: וַיִּקַּח אֹתָהּ
  choice: bắt lấy nàng
  rationale: לקח có nghĩa cơ bản là 'lấy'; trong chuỗi hành động cưỡng bức này, 'bắt lấy' vừa tự nhiên vừa biểu đạt sức ép của ngữ cảnh mà không dồn toàn bộ ý nghĩa của động từ cuối vào đây.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: nằm với nàng
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ quan hệ tình dục, với sắc thái trang nghiêm và không khẩu ngữ.
- source_word: וַיְעַנֶּהָ
  choice: làm nhục nàng
  rationale: Dạng piel của ענה có thể chỉ làm khổ, hạ nhục hoặc xâm phạm. Trong ngữ cảnh tình dục, 'làm nhục' giữ được chiều kích hạ nhục và cưỡng ép, còn chú thích nói rõ đây là hành vi xâm phạm tình dục.
theological_decisions:
- issue: Diễn đạt hành vi bạo lực tình dục trung thành với tiếng Hê-bơ-rơ mà không giảm nhẹ hoặc diễn giải quá mức
  choice: Giữ chuỗi hành động 'bắt lấy nàng, nằm với nàng và làm nhục nàng', đồng thời chú thích nêu rõ ngữ cảnh xâm phạm tình dục.
  alternative: '''cưỡng hiếp nàng'' hoặc ''xâm phạm nàng'''
  rationale: '''Cưỡng hiếp'' nói rất rõ sức cưỡng bức của toàn câu nhưng hẹp hơn phạm vi từ vựng của ענה; ''làm nhục'' bảo tồn sự mơ hồ có thật của động từ, còn ngữ cảnh và chú thích ngăn việc hiểu câu theo hướng giảm nhẹ.'
translation_notes:
  register: Văn phong kể chuyện trang nghiêm, hiện đại và dễ hiểu. Dùng 'nàng' để chỉ Đi-na theo mạch văn; 'thủ lĩnh của xứ' tránh hàm ý quân chủ không có trong nguyên văn. Dấu chú thích đặt ngay sau mệnh đề cần giải thích.
