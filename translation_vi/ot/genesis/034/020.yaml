  text: וַ/יָּבֹ֥א חֲמ֛וֹר וּ/שְׁכֶ֥ם בְּנ֖/וֹ אֶל שַׁ֣עַר עִירָ֑/ם וַֽ/יְדַבְּר֛וּ אֶל אַנְשֵׁ֥י עִירָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: vi
  text: 'Hamor và con trai ông là Shechem đến cổng thành của họ và nói với những người đàn ông trong thành[a] rằng[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “những người đàn ông của thành họ”; có lẽ chỉ các nam cư dân tụ họp tại cổng thành để bàn việc chung.'
    reason: cultural_note
  - marker: b
    text: Nguyên văn dùng từ dẫn lời “rằng”; ở đây lời sắp được trích dẫn được mở bằng dấu hai chấm.
    reason: translation_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đến
  rationale: Động từ בוא ở thể Qal dạng wayyiqtol tiếp nối mạch kể; “đến” diễn đạt tự nhiên chuyển động tới cổng thành mà không áp đặt điểm nhìn không có trong câu.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Tên riêng được phiên âm, không dịch nghĩa.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: và con trai ông là Shechem
  rationale: Giữ rõ quan hệ cha con và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: אֶל שַׁעַר עִירָם
  choice: đến cổng thành của họ
  rationale: Giữ cả nghĩa đen “cổng” lẫn hậu tố sở hữu số nhiều “của họ”; trong bối cảnh cổ đại, cổng thành cũng là nơi nghị sự công cộng.
- source_word: וַיְדַבְּרוּ
  choice: nói với
  rationale: דבר đi với אֶל có nghĩa là nói với hoặc ngỏ lời với; “nói với” trang trọng vừa phải và tự nhiên.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: với những người đàn ông trong thành
  rationale: אַנְשֵׁי mang nghĩa cụ thể là những người nam; cách dịch này giữ thông tin giới tính và phù hợp với bối cảnh các nam cư dân họp để nghị sự tại cổng thành.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Trong tiếng Việt, dấu hai chấm sau “rằng” mở lời trực tiếp tự nhiên hơn việc dịch máy móc là “nói rằng”; vẫn giữ chức năng dẫn nhập lời nói của לֵאמֹר.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Giữ tên riêng theo dạng Hamor và Shechem; giữ sắc thái công cộng của “cổng thành” cùng nghĩa giới tính cụ thể của אַנְשֵׁי. Mọi ký hiệu chú thích đều xuất hiện trong chính văn.
