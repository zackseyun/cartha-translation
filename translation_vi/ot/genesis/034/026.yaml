  text: וְ/אֶת חֲמוֹר֙ וְ/אֶת שְׁכֶ֣ם בְּנ֔/וֹ הָרְג֖וּ לְ/פִי חָ֑רֶב וַ/יִּקְח֧וּ אֶת דִּינָ֛ה מִ/בֵּ֥ית שְׁכֶ֖ם וַ/יֵּצֵֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: vi
  text: Họ cũng giết Hamor và Shechem, con trai ông, bằng gươm[a], rồi đem Dinah ra khỏi nhà Shechem và đi ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “bằng miệng gươm”, một thành ngữ có nghĩa là giết bằng gươm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Họ cũng
  rationale: Liên từ nối hành động này với câu trước và thêm Hamor cùng Shechem vào số những người bị giết; tiểu từ chỉ tân ngữ không được dịch riêng.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Tên riêng được phiên âm, không dịch nghĩa.
- source_word: שְׁכֶם בְּנוֹ
  choice: con trai ông là Shechem
  rationale: Thể hiện rõ Shechem là con trai của Hamor bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: הָרְגוּ
  choice: giết
  rationale: Cách dịch trực tiếp, rõ ràng của động từ הרג trong văn kể chuyện.
- source_word: לְפִי חָרֶב
  choice: dùng gươm
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là 'bằng miệng gươm', chỉ việc giết bằng gươm; 'dùng gươm' tự nhiên và chính xác trong tiếng Việt.
- source_word: וַיִּקְחוּ
  choice: đưa
  rationale: Trong ngữ cảnh đưa Dinah ra khỏi căn nhà, 'đưa' diễn đạt tự nhiên hành động לקח mà không hàm ý bạo lực quá mức văn bản.
- source_word: אֶת דִּינָה
  choice: Dinah
  rationale: Tiểu từ chỉ tân ngữ không dịch; tên riêng được phiên âm.
- source_word: מִבֵּית שְׁכֶם
  choice: ra khỏi nhà Shechem
  rationale: בית ở đây tự nhiên nhất là căn nhà hoặc nơi ở cụ thể; giới từ מִן chỉ sự chuyển động ra khỏi đó.
- source_word: וַיֵּצֵאוּ
  choice: và đi khỏi đó
  rationale: Diễn đạt chuyển động rời khỏi nơi ấy một cách tự nhiên, không thêm chi tiết ngoài văn bản.
