translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ câu trực tiếp, không giảm nhẹ tính bạo lực của nguyên văn; tên riêng theo lối phiên âm nhất quán.
