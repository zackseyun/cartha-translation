  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח־לִי
  choice: hãy cưới ... về ... cho con
  rationale: Trong ngữ cảnh người con nói với cha, động từ “lấy” mang nghĩa thu xếp để có người nữ ấy làm vợ; cách diễn đạt này tự nhiên trong tiếng Việt và không hàm ý người cha lấy cô ấy cho chính mình.
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: cô gái này
  rationale: יַּלְדָּה chỉ một thiếu nữ; “cô gái” vừa tự nhiên vừa giữ sắc thái Shechem nói đến nàng như đối tượng của yêu cầu.
- source_word: לְאִשָּׁה
  choice: làm vợ
  rationale: Diễn đạt trực tiếp mục đích hôn nhân của lời yêu cầu.
