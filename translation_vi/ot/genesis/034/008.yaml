  text: וַ/יְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣/ם לֵ/אמֹ֑ר שְׁכֶ֣ם בְּנִ֗/י חָֽשְׁקָ֤ה נַפְשׁ/וֹ֙ בְּ/בִתְּ/כֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛/הּ ל֖/וֹ לְ/אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: vi
  text: 'Ha-mô nói với họ: “Si-chem, con trai tôi, đem lòng quyến luyến con gái các ông[a]. Xin hãy gả cô ấy cho Si-chem làm vợ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng nó gắn bó sâu đậm với con gái các ông” hoặc “nó khao khát con gái các ông.”'
    reason: Giữ các sắc thái có thể có của thành ngữ חָשְׁקָה נַפְשׁוֹ, vừa chỉ sự gắn bó mãnh liệt vừa có thể nhấn mạnh lòng ham muốn.
lexical_decisions:
- source_word: וַיְדַבֵּר חֲמוֹר אִתָּם
  choice: Ha-mô nói với họ
  rationale: Diễn đạt tự nhiên động từ דבר và giới từ אִתָּם, đồng thời giữ sắc thái Ha-mô trực tiếp ngỏ lời với gia đình Gia-cốp.
- source_word: שְׁכֶם בְּנִי
  choice: Si-chem, con trai tôi
  rationale: Giữ quan hệ đồng vị của nguyên ngữ và dùng trật tự tự nhiên, trang trọng trong tiếng Việt.
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: đem lòng quyến luyến
  rationale: Cụm Hê-bơ-rơ nói sát là 'linh hồn nó gắn bó/khao khát'; cách dịch này giữ được tình cảm mãnh liệt và hình ảnh về lòng người mà vẫn tự nhiên.
- source_word: בְּבִתְּכֶם
  choice: con gái các ông
  rationale: Danh từ ở số ít chỉ Đi-na, còn hậu tố sở hữu ở số nhiều hướng đến những người đang được Ha-mô thưa chuyện.
- source_word: תְּנוּ נָא אֹתָהּ לוֹ לְאִשָּׁה
  choice: Xin hãy gả cô ấy cho nó làm vợ
  rationale: Trong ngữ cảnh hôn nhân, 'gả' truyền đạt tự nhiên hành động 'trao nàng cho nó làm vợ'; 'xin hãy' bảo toàn sắc thái thỉnh cầu của נָא.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để phản ánh hậu tố số nhiều trong lời Ha-mô nói với những người nam thuộc gia đình; dùng “nó” theo lối kể Kinh Thánh tự nhiên cho người con trai đã được nhắc tên.
