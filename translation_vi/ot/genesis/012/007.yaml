  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: vi
  text: 'Bấy giờ, Yahweh hiện ra với Áp-ram và phán: “Ta sẽ ban xứ này cho dòng dõi[a] con.” Tại đó, ông xây một bàn thờ dâng lên Yahweh, Đấng đã hiện ra với ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát chữ là “hạt giống”. Từ Hê-bơ-rơ ở dạng số ít nhưng có thể mang nghĩa tập hợp, chỉ chung dòng dõi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu; cách này giữ được chức năng của Danh trong nguyên văn.
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Thể Niphal của ראה ở đây chỉ sự tỏ hiện có thể nhận biết; “hiện ra” là cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: אֶל־אַבְרָם
  choice: với Áp-ram
  rationale: Trong kết cấu “hiện ra với ai”, tiếng Việt tự nhiên dùng “với”; tên אַבְרָם được phiên âm là “Áp-ram”.
- source_word: לְזַרְעֲךָ
  choice: cho dòng dõi con
  rationale: זֶרַע có hình thức số ít nhưng thường mang nghĩa tập hợp. “Dòng dõi” tự nhiên trong tiếng Việt và không giới hạn lời hứa vào một hậu duệ riêng lẻ; chú thích ghi nhận nghĩa sát chữ là “hạt giống”.
- source_word: אֶתֵּן
  choice: Ta sẽ ban
  rationale: Dạng chưa hoàn thành diễn đạt lời hứa hướng đến tương lai. “Ban” phù hợp với ngữ cảnh Đức Chúa Trời trao xứ, còn “Ta” giữ giọng trực tiếp trang trọng.
- source_word: הָאָרֶץ הַזֹּאת
  choice: xứ này
  rationale: אֶרֶץ trong lời hứa dành cho tổ phụ chỉ vùng đất cụ thể; “xứ” vừa gọn vừa phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Tại đó, ông xây một bàn thờ
  rationale: Giữ địa điểm שָׁם được nhấn rõ và trình tự kể chuyện, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giới từ לְ biểu thị đối tượng được dâng hoặc sự tận hiến. “Dâng lên” làm rõ chức năng của bàn thờ trong tiếng Việt mà không thêm nội dung giáo phái.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: Đấng đã hiện ra với ông
  rationale: Phân từ có mạo từ xác định Yahweh là Đấng đã hiện ra với Áp-ram; “đã” thể hiện hành động xảy ra trước việc xây bàn thờ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng Danh riêng bốn phụ âm. “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa tập hợp của זֶרַע trong lời hứa
  choice: dòng dõi
  alternative: hạt giống; hậu duệ
  rationale: Từ Hê-bơ-rơ có hình thức số ít nhưng có thể chỉ cả một dòng hậu duệ. “Dòng dõi” giữ nghĩa tập hợp, còn chú thích bảo lưu hình ảnh và hình thức số ít của nguyên ngữ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “phán”, “ban”, “xứ” và “dâng lên” để phù hợp văn cảnh tôn giáo mà không quá cổ; giữ danh Yahweh và tên Áp-ram nhất quán.
