revisions:
- from: Áp-ram đi qua vùng đất ấy đến tận địa điểm Si-chem, đến tận cây lớn Mô-rê[a]. Lúc bấy giờ, người Ca-na-an đang ở trong vùng đất ấy[b].
  to: Áp-ram đi qua xứ ấy đến tận nơi Si-chem, đến tận cây lớn Mô-rê[a]. Lúc bấy giờ, dân Ca-na-an đang ở trong xứ ấy[b].
  rationale: Bản sửa dùng cách diễn đạt Việt ngữ tự nhiên hơn cho địa điểm tại Si-chem và cho dân tộc được nói đến theo nghĩa tập hợp, đồng thời vẫn ghi chú hình thức số ít của tiếng Hê-bơ-rơ. Chú thích về loài cây được chỉnh để không nhận diện sai terebinth là cây thông. Các mốc giới hạn, tính bất định về loài cây và các tên riêng đều được giữ nguyên.
