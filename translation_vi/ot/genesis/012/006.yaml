  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: vi
  text: Áp-ram đi qua xứ ấy đến tận nơi Si-chem, đến tận cây lớn Mô-rê[a]. Lúc bấy giờ, dân Ca-na-an đang ở trong xứ ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ chỉ một cây lớn; có thể là cây sồi hoặc cây terebinth, nhưng không xác định chắc chắn loài cây.
    reason: lexical_alternative
  - marker: b
    text: Nguyên ngữ dùng danh từ dân tộc ở hình thức số ít, nhưng hình thức này có thể mang nghĩa tập hợp.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: đi qua
  rationale: Diễn đạt tự nhiên động từ עבר ở thể wayyiqtol, chỉ việc Áp-ram đi xuyên qua vùng đất mà không xác định quá mức cách thức hay lộ trình.
- source_word: בָּאָרֶץ
  choice: vùng đất ấy
  rationale: Danh từ có mạo từ chỉ vùng đất đang được nói đến, tức Ca-na-an; “vùng đất ấy” tự nhiên trong tiếng Việt và giữ được sự quy chiếu theo ngữ cảnh.
- source_word: עַד מְקוֹם שְׁכֶם
  choice: đến tận địa điểm Si-chem
  rationale: עַד nêu giới hạn của hành trình; מְקוֹם là một địa điểm gắn với tên Si-chem, không nhất thiết khẳng định đây đã là một thành phố phát triển hoàn chỉnh.
- source_word: אֵלוֹן מוֹרֶה
  choice: cây lớn Mô-rê
  rationale: אֵלוֹן chỉ một cây lớn, nhưng loài cây chính xác không chắc chắn. Cách dịch khái quát tránh xác định võ đoán là cây sồi hay cây thông terebinth.
- source_word: מוֹרֶה
  choice: Mô-rê
  rationale: Giữ như địa danh hoặc tên riêng bổ nghĩa cho cây, thay vì đưa nghĩa suy đoán như “thầy dạy” hay “người bói” vào chính văn.
- source_word: וְהַכְּנַעֲנִי
  choice: người Ca-na-an
  rationale: Tiếng Hê-bơ-rơ dùng danh từ dân tộc số ít có mạo từ và có thể mang nghĩa tập hợp. Tiếng Việt có thể giữ hình thức số ít mang nghĩa đại diện; cách hiểu số nhiều được ghi ở chú thích.
- source_word: אָז
  choice: lúc bấy giờ
  rationale: Thể hiện rõ trạng thái lịch sử tại thời điểm câu chuyện đang thuật lại.
- source_word: בָּאָרֶץ
  choice: trong vùng đất ấy
  rationale: Giữ sự lặp lại của nguyên văn và liên kết với vùng đất đã được nhắc ở đầu câu.
theological_decisions:
- issue: Số của danh từ dân tộc וְהַכְּנַעֲנִי
  choice: 'Giữ số ít mang nghĩa tập hợp: “người Ca-na-an đang ở trong vùng đất ấy”'
  alternative: 'Dịch số nhiều theo nghĩa tập hợp: “dân Ca-na-an đang ở trong vùng đất ấy”'
  rationale: Nguyên văn dùng danh từ dân tộc số ít có mạo từ, nhưng cấu trúc này thường chỉ cả một cộng đồng. Giữ số ít trong chính văn phản ánh hình thức nguồn, còn chú thích bảo tồn cách hiểu số nhiều tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng phiên âm quen thuộc Áp-ram, Si-chem, Mô-rê và Ca-na-an. “Cây lớn” bảo tồn sự bất định từ vựng của אֵלוֹן; “người Ca-na-an” giữ hình thức số ít tập hợp của nguyên văn.
