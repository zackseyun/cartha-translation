  text: וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨רֶד אַבְרָ֤ם מִצְרַ֨יְמָ/ה֙ לָ/ג֣וּר שָׁ֔ם כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: vi
  text: Trong xứ xảy ra nạn đói. Áp-ram đi xuống Ai Cập để tạm trú tại đó[a], vì nạn đói trong xứ rất trầm trọng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cư ngụ tại đó như một ngoại kiều”—nghĩa là sống ở đó trong một thời gian với tư cách người từ nơi khác đến.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: xảy ra
  rationale: Diễn đạt tự nhiên sự xuất hiện của một diễn biến mới trong câu chuyện, không thêm một từ chỉ thời gian như “bấy giờ” vốn không có từ tương ứng trực tiếp trong nguyên văn.
- source_word: רָעָב
  choice: nạn đói
  rationale: Chỉ tình trạng thiếu lương thực trên diện rộng, không chỉ cảm giác đói của cá nhân.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: אֶרֶץ ở đây chỉ vùng đất nơi Áp-ram đang cư ngụ, không phải toàn thể trái đất; “xứ” giữ được sắc thái địa lý và văn phong Kinh Thánh tự nhiên trong tiếng Việt.
- source_word: וַיֵּרֶד
  choice: đi xuống
  rationale: Giữ hình ảnh chuyển động “xuống” trong động từ ירד, là cách nguyên văn mô tả hành trình đến Ai Cập.
- source_word: מִצְרַיְמָה
  choice: đến Ai Cập
  rationale: Hậu tố chỉ hướng được diễn đạt tự nhiên bằng “đến” trong tiếng Việt.
- source_word: לָגוּר
  choice: để tạm trú
  rationale: גור nói đến việc cư ngụ có tính tạm thời, thường với thân phận người ngoài; “tạm trú” vừa rõ ràng vừa gọn, còn sắc thái người ngoại kiều được nêu trong chú thích.
- source_word: שָׁם
  choice: tại đó
  rationale: Chuyển tải trực tiếp trạng từ chỉ nơi chốn.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu nguyên nhân khiến Áp-ram đi xuống Ai Cập.
- source_word: כָבֵד
  choice: rất trầm trọng
  rationale: Nghĩa đen là “nặng”, nhưng khi bổ nghĩa cho nạn đói thì diễn tả mức độ nghiêm trọng; “rất” chuyển tải sức nhấn mạnh theo ngữ cảnh.
- source_word: הָרָעָב בָּאָרֶץ
  choice: nạn đói trong xứ
  rationale: Giữ nguyên sự lặp lại có chủ ý của cụm từ trong tiếng Hê-bơ-rơ, thay vì lược bỏ trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tách mệnh đề mở đầu thành câu riêng để mạch kể tự nhiên trong tiếng Việt, đồng thời không thêm từ chỉ thời gian không có trong nguyên văn. Tên אַבְרָם được phiên âm theo dạng quen dùng “Áp-ram”.
