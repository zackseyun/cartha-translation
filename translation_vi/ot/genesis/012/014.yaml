  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/ב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָ/ה וַ/יִּרְא֤וּ הַ/מִּצְרִים֙ אֶת הָ֣/אִשָּׁ֔ה כִּֽי יָפָ֥ה הִ֖וא מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/014.yaml
  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: vi
  text: Khi Áp-ram vào Ai Cập, người Ai Cập thấy người phụ nữ ấy[a] rất xinh đẹp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vợ ông”. Từ Hê-bơ-rơ אִשָּׁה có thể có nghĩa là “người phụ nữ” hoặc “người vợ”; ở đây bản dịch giữ cách nói khái quát hơn của mệnh đề.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: Khi ... vào
  rationale: Cấu trúc kể chuyện với היה và nguyên mẫu có כְּ diễn tả hoàn cảnh thời gian. Tiếng Việt tự nhiên dùng “Khi ... vào”, không cần dịch máy móc thành “Và xảy ra khi”.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng Abram theo cách dùng Kinh Thánh tiếng Việt quen thuộc và dễ đọc.
- source_word: מִצְרָיְמָה
  choice: Ai Cập
  rationale: Hậu tố chỉ hướng được thể hiện tự nhiên trong cụm động từ “vào Ai Cập”.
- source_word: וַיִּרְאוּ
  choice: thấy
  rationale: Dịch trực tiếp động từ ראה, tránh thêm sắc thái diễn giải như “để ý” hay “nhận thấy”.
- source_word: הַמִּצְרִים
  choice: người Ai Cập
  rationale: Danh từ chỉ dân tộc số nhiều, xác định; tiếng Việt biểu đạt tự nhiên bằng “người Ai Cập”.
- source_word: הָאִשָּׁה
  choice: người phụ nữ ấy
  rationale: אִשָּׁה có thể là “người phụ nữ” hoặc “vợ”. Bản dịch chính giữ nghĩa khái quát của từ trong mệnh đề này; “ấy” thể hiện tính xác định.
- source_word: כִּי
  choice: '[bổ ngữ trực tiếp sau “thấy”]'
  rationale: כִּי dẫn nội dung điều họ thấy. Trong tiếng Việt, không cần một liên từ tương ứng với “rằng” khi cấu trúc “thấy ... rất xinh đẹp” đã rõ và tự nhiên.
- source_word: יָפָה
  choice: xinh đẹp
  rationale: Diễn đạt vẻ đẹp ngoại hình bằng cách nói hiện đại, rõ ràng và tự nhiên trong tiếng Việt.
- source_word: הִוא
  choice: '[thể hiện qua chủ ngữ “người phụ nữ ấy”]'
  rationale: Đại từ độc lập được thể hiện trong cấu trúc mệnh đề tiếng Việt mà không cần lặp lại “bà ấy”.
- source_word: מְאֹד
  choice: rất
  rationale: Trạng từ tăng cường được dịch bằng từ thông dụng và sát nghĩa “rất”.
theological_decisions:
- issue: Nghĩa của הָאִשָּׁה trong ngữ cảnh
  choice: người phụ nữ ấy
  alternative: vợ ông
  rationale: Từ Hê-bơ-rơ có thể chỉ “phụ nữ” hoặc “vợ”. Dù Sa-rai là vợ Áp-ram theo ngữ cảnh, câu này dùng cách gọi có thể hiểu theo nghĩa khái quát; bản dịch không đưa quan hệ hôn nhân vào chính văn và ghi nhận phương án kia ở chú thích.
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Câu tiếng Việt lược liên từ mở đầu tương ứng với וַ để tránh gượng ép, nhưng vẫn giữ rõ trình tự thời gian. Dùng “người phụ nữ ấy” để vừa tự nhiên vừa bảo toàn tính xác định và sự mơ hồ từ vựng của הָאִשָּׁה.
