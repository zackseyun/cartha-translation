base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: vi
  text: Ta sẽ ban phước cho những người chúc phước cho con; còn kẻ coi thường con, Ta sẽ nguyền rủa. Trong con[a], mọi gia tộc trên đất sẽ được ban phước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhờ con” hoặc “qua con, mọi gia tộc trên đất sẽ được ban phước,” hay “mọi gia tộc trên đất sẽ lấy con làm lời chúc phước cho mình.” Dạng động từ Hê-bơ-rơ có thể được hiểu theo nghĩa bị động hoặc phản thân/trung gian; giới từ cũng có thể mang nghĩa phương tiện.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: Ta sẽ ban phước
  rationale: Động từ Qal ngôi thứ nhất số ít diễn tả lời hứa của Đức Chúa Trời; “sẽ ban phước” tự nhiên và giữ được sức hướng tới tương lai.
- source_word: מְבָרְכֶיךָ
  choice: những người chúc phước cho con
  rationale: Phân từ số nhiều dùng như danh từ chỉ một nhóm người; bản dịch giữ nguyên nét số nhiều và hành động hướng đến Áp-ram.
- source_word: וּמְקַלֶּלְךָ
  choice: còn kẻ coi thường con
  rationale: קלל có thể chỉ việc xem nhẹ, khinh thường hoặc nguyền rủa. “Coi thường” bảo toàn sự phân biệt với động từ mạnh hơn ארר ở vế sau, đồng thời giữ số ít của nguyên văn.
- source_word: אָאֹר
  choice: Ta sẽ nguyền rủa
  rationale: ארר là động từ mạnh, trực tiếp chỉ việc đặt dưới lời nguyền; “nguyền rủa” thể hiện sự gia tăng mức độ so với hành động của con người.
- source_word: וְנִבְרְכוּ
  choice: sẽ ... được ban phước
  rationale: Niphal ngôi thứ ba số nhiều được hiểu theo nghĩa bị động là cách đọc trực tiếp; khả năng phản thân/trung gian được giữ trong chú thích.
- source_word: בְּךָ
  choice: nhờ con
  rationale: Giới từ בְּ có thể chỉ phạm vi hoặc phương tiện. “Nhờ con” là cách nói tự nhiên trong tiếng Việt và thể hiện sắc thái phương tiện mà không xác định cơ chế thần học.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: mọi gia tộc trên đất
  rationale: מִשְׁפָּחוֹת chỉ các nhóm gia đình hay gia tộc; הָאֲדָמָה là đất/địa cầu. Cách dịch này rõ ràng, phổ thông và bảo toàn tầm mức phổ quát.
theological_decisions:
- issue: Ý nghĩa của công thức וְנִבְרְכוּ בְךָ trong lời hứa dành cho Áp-ram
  choice: 'cách hiểu bị động và mang sắc thái phương tiện: “nhờ con mà được ban phước”'
  alternative: “sẽ lấy con làm lời chúc phước cho mình” hoặc sát mặt chữ hơn, “trong con ... sẽ được ban phước”
  rationale: Niphal của ברך có thể được tranh luận là bị động hay phản thân/trung gian, còn בְּ có thể chỉ phạm vi hoặc phương tiện. Chính văn dùng cách diễn đạt tiếng Việt tự nhiên theo nghĩa bị động; chú thích bảo lưu các khả năng khác thay vì giải quyết dứt khoát vấn đề thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” để thể hiện lời Đức Chúa Trời phán trực tiếp với Áp-ram. Dấu chấm phẩy làm rõ sự đối xứng giữa việc ban phước và nguyền rủa.
