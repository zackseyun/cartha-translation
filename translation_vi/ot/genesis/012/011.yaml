  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: vi
  text: 'Khi Áp-ram sắp vào Ai Cập, ông nói với Sa-rai, vợ mình: “Này, tôi biết bà là một phụ nữ có dung mạo xinh đẹp[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trông rất xinh đẹp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Khi
  rationale: Cụm mở đầu dẫn vào hoàn cảnh thời gian của lời nói. Tiếng Việt tự nhiên có thể dùng “Khi” mà vẫn giữ đúng chức năng trần thuật của câu Hê-bơ-rơ.
- source_word: הִקְרִיב לָבוֹא
  choice: sắp vào
  rationale: Dạng Hiphil của קרב đi với động từ nguyên mẫu בוא diễn tả việc đã đến gần thời điểm bước vào; “sắp vào” ngắn gọn và tự nhiên.
- source_word: מִצְרָיְמָה
  choice: Ai Cập
  rationale: Hậu tố chỉ hướng diễn tả chuyển động về phía Ai Cập; trong kết cấu “vào Ai Cập”, tiếng Việt đã thể hiện rõ hướng chuyển động.
- source_word: וַיֹּאמֶר אֶל
  choice: ông nói với
  rationale: Công thức dẫn lời trực tiếp thông thường; đại từ “ông” phù hợp với nhân vật Áp-ram trong văn kể trang trọng, dễ hiểu.
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: Sa-rai, vợ mình
  rationale: Giữ tên riêng trước như trật tự Hê-bơ-rơ và dùng cụm đồng vị để xác định quan hệ; “mình” quy chiếu tự nhiên về chủ ngữ Áp-ram.
- source_word: הִנֵּה נָא
  choice: Này
  rationale: Kết hợp tiểu từ gây chú ý và sắc thái nhấn mạnh/khẩn khoản; “Này” truyền đạt lời gọi chú ý tự nhiên, không cổ kính.
- source_word: יָדַעְתִּי
  choice: tôi biết
  rationale: Dạng hoàn thành diễn tả trạng thái nhận biết hiện tại; “tôi biết” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: כִּי
  choice: '[rằng]'
  rationale: Tiểu từ dẫn nội dung điều Áp-ram biết. Tiếng Việt có thể lược “rằng” sau “biết” để câu tự nhiên mà quan hệ cú pháp vẫn rõ.
- source_word: אִשָּׁה
  choice: một phụ nữ
  rationale: Ở đây từ này nói đến Sa-rai với tư cách một người phụ nữ, không lặp lại vai trò làm vợ vốn đã được nêu.
- source_word: יְפַת מַרְאֶה
  choice: có dung mạo xinh đẹp
  rationale: Cụm từ chỉ vẻ đẹp nhìn thấy được. “Có dung mạo xinh đẹp” trang trọng, rõ nghĩa và tương đối sát hình thức nguyên văn.
- source_word: אָתְּ
  choice: bà là
  rationale: Đại từ giống cái số ít được thể hiện bằng “bà”, phù hợp lời chồng nói với vợ trong văn phong trang trọng; thêm “là” để hoàn chỉnh vị ngữ tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi—bà” trong lời thoại để giữ sắc thái tôn trọng, tự nhiên; tên riêng được phiên âm theo dạng quen dùng trong tiếng Việt. Lược công thức “và đã xảy ra” vì nếu dịch nguyên dạng sẽ nặng nề trong tiếng Việt, nhưng giữ đầy đủ quan hệ thời gian bằng “Khi”.
