  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung chính của tiếng Hê-bơ-rơ: hoàn cảnh Áp-ram sắp vào Ai Cập, lời ông nói với Sa-rai là vợ mình, lời gây chú ý, sự nhận biết hiện tại, và vẻ đẹp về diện mạo của Sa-rai. “Khi” diễn đạt tự nhiên tổ hợp tự sự וַיְהִי כַּאֲשֶׁר mà không cần thêm một công thức tương đương máy móc, nặng câu trong tiếng Việt.'
  naturalness: Câu văn hiện đại, rõ ràng và phù hợp văn kể trang trọng. “Sắp vào Ai Cập,” “ông nói với,” và “có dung mạo xinh đẹp” đều tự nhiên trong ngữ cảnh Kinh Thánh tiếng Việt. Cách xưng hô “tôi—bà” giữ được tính trang trọng mà không thêm diễn giải về quan hệ hay địa vị.
  terminology: Các tên “Áp-ram,” “Sa-rai,” và “Ai Cập” nhất quán với cách phiên âm Kinh Thánh tiếng Việt thông dụng. “Dung mạo xinh đẹp” phản ánh sát יְפַת מַרְאֶה, tức vẻ đẹp xét theo diện mạo/ngoại hình. Chú thích được đặt đúng tại cụm có phương án từ vựng thay thế.
