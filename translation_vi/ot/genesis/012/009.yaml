  yaml_path: translation/ot/genesis/012/009.yaml
  text: And Abram journeyed on[b][a], going toward the Negev.
translation:
  language: vi
  text: Rồi Áp-ram tiếp tục hành trình, đi về phía Nê-ghép.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “về phía nam.” Từ Hê-bơ-rơ có thể chỉ vùng đất phía nam gọi là Nê-ghép hoặc chỉ phương nam; trong câu này, nghĩa chỉ vùng Nê-ghép có phần thích hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: tiếp tục hành trình
  rationale: Động từ נסע ở dạng kể chuyện chỉ việc lên đường hoặc di chuyển tiếp; cách dịch này tự nhiên trong tiếng Việt và giữ được ý tiếp diễn trong mạch thuật sự.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng theo cách gọi quen thuộc và rõ ràng trong tiếng Việt.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: đi
  rationale: Cấu trúc nguyên mẫu tuyệt đối diễn tả sự di chuyển liên tục hoặc tiến dần. Kết hợp “tiếp tục hành trình, đi…” vừa phản ánh tính tiếp diễn vừa tránh thêm ý cụ thể như đi từng chặng.
- source_word: הַנֶּגְבָּה
  choice: về phía Nê-ghép
  rationale: Danh từ נֶגֶב kèm mạo từ và hậu tố chỉ hướng rất có thể nói đến vùng Nê-ghép, đồng thời cấu trúc vẫn mang nghĩa định hướng. “Về phía” bảo toàn sắc thái ấy.
theological_decisions: []
translation_notes:
  register: Văn phong thuật sự hiện đại, trang trọng và dễ hiểu. Dùng “tiếp tục hành trình, đi…” để giữ sắc thái diễn tiến của nguyên văn mà không áp đặt ý “đi từng chặng”.
