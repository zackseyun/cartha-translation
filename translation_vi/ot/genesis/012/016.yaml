- from: Pha-ra-ôn đối đãi tốt với Áp-ram vì nàng[a], nên ông có chiên, bò, lừa đực, nô lệ nam, nô lệ nữ, lừa cái và lạc đà.
  to: Pha-ra-ôn đã đối đãi tốt với Áp-ram vì nàng[a], và Áp-ram có được chiên, bò, lừa đực, nô lệ nam, nô lệ nữ, lừa cái và lạc đà.
  rationale: Sửa để làm rõ rằng các tài sản được liệt kê là của Áp-ram, không phải của Pha-ra-ôn; đồng thời thay “nên” bằng “và” để không nhấn mạnh quá mức quan hệ nhân quả trong liên từ. Chú thích được rút gọn và chỉnh lại để nêu đúng phương án dịch thay thế.
