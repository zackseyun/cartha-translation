  text: וּ/לְ/אַבְרָ֥ם הֵיטִ֖יב בַּ/עֲבוּרָ֑/הּ וַֽ/יְהִי ל֤/וֹ צֹאן וּ/בָקָר֙ וַ/חֲמֹרִ֔ים וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/אֲתֹנֹ֖ת וּ/גְמַלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: vi
  text: Pha-ra-ôn đã đối đãi tốt với Áp-ram vì nàng[a], và Áp-ram có được chiên, bò, lừa đực, nô lệ nam, nô lệ nữ, lừa cái và lạc đà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vì cớ nàng.” Cụm từ Hê-bơ-rơ có thể được dịch theo cả hai cách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: đối đãi tốt
  rationale: Dạng Hiphil của יטב ở đây diễn tả việc làm điều tốt cho hoặc đối xử thuận lợi với một người; “đối đãi tốt với” tự nhiên và giữ rõ quan hệ với Áp-ram.
- source_word: בַּעֲבוּרָהּ
  choice: vì nàng
  rationale: Cụm giới từ chỉ nguyên nhân hoặc duyên cớ. “Vì nàng” ngắn gọn, tự nhiên, đồng thời chú thích giữ lại khả năng hiểu là “vì cớ nàng”.
- source_word: וַיְהִי לוֹ
  choice: nên ông có
  rationale: Thành ngữ theo nghĩa đen là “và đã có cho ông”, trong mạch truyện hàm ý tài sản đến với Áp-ram do sự ưu đãi vừa nêu. “Nên ông có” thể hiện kết quả tự nhiên trong tiếng Việt.
- source_word: צֹאן
  choice: chiên
  rationale: Danh từ tập hợp chỉ gia súc nhỏ, thường gồm chiên và dê; trong danh sách này, “chiên” là cách dịch truyền thống và dễ hiểu, dù phạm vi từ Hê-bơ-rơ có thể rộng hơn.
- source_word: בָקָר
  choice: bò
  rationale: Danh từ tập hợp chỉ gia súc họ bò; “bò” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: חֲמֹרִים
  choice: lừa đực
  rationale: Dạng số nhiều giống đực, được phân biệt với אֲתֹנֹת là lừa cái ở phần sau câu; vì vậy cần giữ rõ giới tính.
- source_word: עֲבָדִים
  choice: nô lệ nam
  rationale: Trong danh mục tài sản, từ này chỉ những người ở địa vị lệ thuộc và thuộc quyền sở hữu; “nô lệ” phản ánh thực trạng xã hội chính xác hơn “đầy tớ”, còn “nam” giữ sự đối ứng với danh từ giống cái kế tiếp.
- source_word: שְׁפָחֹת
  choice: nô lệ nữ
  rationale: Danh từ số nhiều giống cái chỉ các nữ nô lệ hoặc nữ tỳ. “Nô lệ nữ” rõ nghĩa, hiện đại và song song với “nô lệ nam”.
- source_word: אֲתֹנֹת
  choice: lừa cái
  rationale: Danh từ này chuyên chỉ lừa cái; bản dịch giữ sự phân biệt giới tính với חֲמֹרִים.
- source_word: גְמַלִּים
  choice: lạc đà
  rationale: Tương đương thông dụng và chính xác của danh từ số nhiều này trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chủ ngữ “Pha-ra-ôn” được nêu rõ theo ngữ cảnh thay cho đại từ dễ gây mơ hồ trong tiếng Việt. Dùng “nàng” để chỉ Sa-rai, phù hợp văn kể trang trọng; dùng “nô lệ” nhằm phản ánh địa vị xã hội trong danh sách tài sản, không làm nhẹ nghĩa bằng “đầy tớ”.
