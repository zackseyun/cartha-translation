source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: vi
  text: Nhưng Đức Giê-hô-va giáng những tai họa nặng nề trên Pha-ra-ôn và hoàng gia của ông vì Sa-rai, vợ Áp-ram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng Đức Giê-hô-va đánh Pha-ra-ôn và hoàng gia của ông bằng những đòn giáng lớn vì Sa-rai, vợ Áp-ram.” Trong tiếng Hê-bơ-rơ, động từ và danh từ cùng gốc có thể mang nghĩa “đánh/giáng họa” và “đòn giáng/tai họa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: giáng ... trên
  rationale: Động từ ở dạng gây khiến diễn tả việc Đức Giê-hô-va khiến Pha-ra-ôn và nhà vua chịu tai họa; cách nói này tự nhiên trong tiếng Việt và đi thuận với danh từ “tai họa”.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho danh riêng YHWH, thay vì thay thế bằng một tước hiệu chung.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm danh hiệu hoàng gia Ai Cập đã quen thuộc trong tiếng Việt.
- source_word: נְגָעִים גְּדֹלִים
  choice: những tai họa nặng nề
  rationale: נְגָעִים có thể chỉ những đòn giáng, sự hành hại hoặc tai họa; גְּדֹלִים nhấn mạnh mức độ nghiêm trọng. “Những tai họa nặng nề” vừa tự nhiên vừa giữ được sắc thái mạnh.
- source_word: וְאֶת בֵּיתוֹ
  choice: và cả nhà vua
  rationale: בֵּיתוֹ ở đây chỉ những người thuộc gia quyến hoặc hoàng gia của Pha-ra-ôn, không chỉ tòa nhà; “cả nhà vua” là lối diễn đạt gọn, trang trọng và dễ hiểu.
- source_word: עַל דְּבַר
  choice: vì
  rationale: Cụm từ nêu nguyên nhân hoặc duyên cớ của tai họa; “vì” giữ được quan hệ nhân quả mà không giải thích quá mức bản chất trách nhiệm.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sa-rai, vợ Áp-ram
  rationale: Giữ cấu trúc đồng vị nhằm xác định Sa-rai là vợ của Áp-ram, một chi tiết trọng yếu trong mạch truyện.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ YHWH như một danh riêng và dùng dạng phiên âm đã quen thuộc trong văn phong Kinh Thánh tiếng Việt, thay vì thay bằng tước hiệu; không gán thêm nội dung thần học ngoài văn bản.
- issue: Quan hệ nhân quả trong עַל דְּבַר שָׂרַי
  choice: vì Sa-rai
  alternative: vì chuyện Sa-rai; liên quan đến Sa-rai
  rationale: Văn bản nêu Sa-rai là duyên cớ của tai họa nhưng không trình bày ở câu này rằng chính bà có lỗi; bản dịch giữ cách nói ngắn gọn và không quy trách nhiệm vượt quá nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “cả nhà vua” theo nghĩa gia quyến/những người thuộc nhà Pha-ra-ôn; giữ danh riêng theo dạng phiên âm quen thuộc Sa-rai, Áp-ram và Pha-ra-ôn. Dấu chú thích [a] được đặt sau toàn bộ câu vì chú thích liên quan đến cả cụm diễn tả hành động và tai họa.
