  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của nguyên văn: Đức Giê-hô-va là chủ thể, Pha-ra-ôn và ביתוֹ là đối tượng, những tai họa/đòn giáng lớn là hình phạt, và Sa-rai, vợ Áp-ram, là duyên cớ. Tuy nhiên, “cả nhà vua” có thể được hiểu là toàn bộ gia đình của một vị vua nói chung và chưa diễn đạt rõ quan hệ sở hữu với Pha-ra-ôn như “his household”.'
