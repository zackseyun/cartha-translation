  to: Nhưng Đức Giê-hô-va giáng những tai họa nặng nề trên Pha-ra-ôn và hoàng gia của ông vì Sa-rai, vợ Áp-ram.[a]
  rationale: Chỉ thay “cả nhà vua” bằng “hoàng gia của ông” để phản ánh rõ hơn đại từ sở hữu trong בֵּיתוֹ và tạo lối diễn đạt hiện đại, tự nhiên hơn. Các thành tố ngữ nghĩa khác, bao gồm quan hệ nhân quả không quy kết lỗi cho Sa-rai, được giữ nguyên. Chú thích được điều chỉnh đồng bộ với bản văn sửa đổi và vẫn được neo ở cuối câu, vì liên quan đến cả cụm động từ–danh từ.
