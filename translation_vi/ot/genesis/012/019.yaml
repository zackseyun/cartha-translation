base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: vi
  text: 'Tại sao ông nói: “Bà ấy là em gái tôi,” rồi tôi đã lấy bà ấy làm vợ? Còn bây giờ, vợ ông đây. Hãy đem bà ấy đi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  choice: Tại sao ngươi lại nói
  rationale: Diễn đạt tự nhiên lời chất vấn trực tiếp của Pha-ra-ôn; “lại” làm rõ sắc thái trách cứ trong ngữ cảnh mà không thêm nội dung mới.
- source_word: אֲחֹתִי הִוא
  choice: Nàng là em gái tôi
  rationale: Giữ nguyên lời nói trực tiếp và thì hiện tại của mệnh đề danh từ Hê-bơ-rơ. “Em gái” phù hợp quan hệ được thuật lại trong ngữ cảnh Sáng Thế Ký.
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: khiến ta lấy nàng làm vợ
  rationale: “Khiến” thể hiện quan hệ hệ quả hàm chứa trong lời trách cứ, không mang nghĩa mục đích như “để”. “Lấy … làm vợ” là thành ngữ tiếng Việt tự nhiên và bao quát לִי trong ý chiếm lấy cho mình.
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Đánh dấu sự chuyển từ lời trách cứ sang mệnh lệnh; tiếng Việt không cần dịch liên từ וְ một cách máy móc.
- source_word: הִנֵּה אִשְׁתְּךָ
  choice: vợ ngươi đây
  rationale: Cấu trúc đảo tự nhiên trong tiếng Việt vừa chỉ rõ người đang hiện diện vừa giữ sức gợi chú ý của הִנֵּה.
- source_word: קַח וָלֵךְ
  choice: Hãy đưa nàng đi
  rationale: Trong ngữ cảnh, קַח không chỉ là “cầm/lấy” mà là nhận lại và dẫn người vợ đi; cách dịch này truyền đạt tự nhiên chuỗi hai mệnh lệnh trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi/ta” để phản ánh lời quở trách của vua với Áp-ram và tránh sắc thái quá suồng sã; dùng “nàng” để chỉ Sa-rai một cách trang nhã. Không thêm dấu chú thích vì không có điểm mơ hồ nào cần thiết phải đưa vào bản văn ở câu này.
