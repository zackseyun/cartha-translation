  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: vi
  text: 'Bấy giờ, Pha-ra-ôn gọi Áp-ram đến và nói: “Ông đã làm gì với ta thế này? Tại sao ông không cho ta biết rằng bà ấy là vợ ông?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה לְאַבְרָם
  choice: Pha-ra-ôn gọi Áp-ram đến
  rationale: קרא với לְ chỉ việc gọi hoặc triệu người nào đến. “Gọi ... đến” tự nhiên trong tiếng Việt, phù hợp ngữ cảnh nhà vua cho gọi Áp-ram mà không nhấn mạnh quá mức như “triệu tập”.
- source_word: וַיֹּאמֶר
  choice: và nói
  rationale: אמר là động từ trần thuật thông dụng; “nói” giữ đúng hình thức của nguyên văn dù lời tiếp theo là câu hỏi.
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: Ông đã làm gì với ta thế này?
  rationale: Cách nói tiếng Việt tự nhiên này giữ sắc thái sửng sốt và trách cứ của מַה זֹּאת, đồng thời bảo toàn לִּי như một lời than phiền về điều đã làm đối với Pha-ra-ôn.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: Tại sao ông không cho ta biết
  rationale: Hiphil của נגד có nghĩa là báo, nói hoặc cho biết. “Cho ta biết” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: כִּי אִשְׁתְּךָ הִוא
  choice: rằng bà ấy là vợ ông
  rationale: כִּי dẫn nội dung điều Áp-ram đã không tiết lộ. Mệnh đề danh từ ở thì hiện tại được giữ là “là vợ ông”; “bà ấy” phù hợp cách xưng hô lịch sự trong lời nói trực tiếp.
- source_word: פַרְעֹה
  choice: Pha-ra-ôn
  rationale: Phiên âm danh hiệu hoàng gia theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: אַבְרָם
  choice: Áp-ram
  rationale: Phiên âm tên riêng, phân biệt với tên Áp-ra-ham được ban về sau.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “ta–ông” thể hiện lời quở trách của một vị vua với Áp-ram mà không dùng lối cổ quá nặng. Không cần chú thích vì câu không có dị bản hay nét mơ hồ quan trọng cần giải thích.
