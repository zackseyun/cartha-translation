  source_fidelity: Bản dịch truyền đạt đầy đủ diễn tiến tự sự của וַיִּקְרָא và lời quở trách gồm hai câu hỏi. “Gọi Áp-ram đến” là cách diễn đạt tự nhiên cho קרא với לְ trong ngữ cảnh này. “Ông đã làm gì với ta thế này?” bảo lưu được ý trách cứ cá nhân của עָשִׂיתָ לִּי và sắc thái chỉ trỏ của מַה זֹּאת; câu tiếp theo chuyển đúng nội dung của điều Áp-ram không nói cho Pha-ra-ôn biết.
