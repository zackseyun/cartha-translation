  - severity: low
    issue: Cụm “được bảy mươi lăm tuổi” kém tự nhiên hơn trong văn xuôi hiện đại.
    rationale: Tiếng Hê-bơ-rơ chỉ nêu tuổi của Áp-ram. “Áp-ram bảy mươi lăm tuổi” truyền đạt sát nghĩa và mượt hơn.
