base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: vi
  text: Vậy, Áp-ram ra đi đúng như Yahweh đã phán với ông, và Lót đi cùng ông. Áp-ram bảy mươi lăm tuổi khi ông rời khỏi Kha-ran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ra đi
  rationale: Động từ הלך trong mạch kể chỉ hành động lên đường; “ra đi” tự nhiên trong tiếng Việt và phù hợp với việc rời Kha-ran, mà không nhấn quá mức vào khởi điểm hành trình.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự tương ứng giữa hành động của Áp-ram và lời Đức Giê-hô-va đã phán; “đúng như” truyền đạt rõ sắc thái làm theo mà không thêm lời bình giải.
- source_word: דִּבֶּר אֵלָיו
  choice: đã phán với ông
  rationale: “Đã” thể hiện lời phán xảy ra trước hành động ra đi; “phán” là cách diễn đạt trang trọng, tự nhiên khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc và trang trọng trong tiếng Việt để biểu thị trực tiếp Danh YHWH, thay vì thay bằng tước hiệu “CHÚA”.
- source_word: אִתּוֹ
  choice: cùng đi với ông
  rationale: Trong mệnh đề có động từ וַיֵּלֶךְ, cách dịch này tự nhiên hơn “đi với ông” và vẫn giữ nguyên ý Lót đồng hành với Áp-ram.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: được bảy mươi lăm tuổi
  rationale: Chuyển thành ngữ Hê-bơ-rơ chỉ tuổi sang cách nói tiếng Việt hiện đại, rõ ràng.
- source_word: בְּצֵאתוֹ
  choice: khi rời
  rationale: Nguyên mẫu cấu tạo với בְּ xác định thời điểm Áp-ram đi ra; “khi rời” gọn và tự nhiên trong ngữ cảnh.
- source_word: מֵחָרָן
  choice: Kha-ran
  rationale: Phiên âm địa danh חָרָן theo lối viết quen thuộc trong Kinh Thánh tiếng Việt; giới từ מִן được thể hiện trong động từ “rời”.
theological_decisions:
- issue: Cách dịch Danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Danh Tetragrammaton. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu; “Đức Giê-hô-va” là dạng trang trọng, dễ nhận biết đối với độc giả tiếng Việt hiện đại.
translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng dễ hiểu. Giữ tên riêng theo truyền thống phiên âm tiếng Việt: Áp-ram, Lót, Kha-ran. Hai lần “ông” đều quy chiếu về Áp-ram theo cú pháp và mạch văn.'
