  source_fidelity: 'Bản nháp truyền đạt đúng trình tự và nội dung tiếng Hê-bơ-rơ: Áp-ram đi theo lời phán, Lót đi cùng, và tuổi của Áp-ram khi rời Kha-ran. Tuy nhiên, יהוה được dịch là “Đức Giê-hô-va”, tương ứng với “Jehovah”, trong khi quyết định thuật ngữ của POB cho câu này yêu cầu dạng danh riêng “Yahweh”.'
  naturalness: “Ra đi”, “đúng như”, và “đi cùng” đều tự nhiên trong văn kể chuyện hiện đại. Cách nói “Áp-ram được bảy mươi lăm tuổi” không sai, nhưng “Áp-ram bảy mươi lăm tuổi” gọn và tự nhiên hơn. Thêm “khỏi” sau “rời” làm rõ giới từ מִן (‘từ/khỏi’) mà không gây nặng câu.
  terminology: Giữ các tên truyền thống Áp-ram, Lót và Kha-ran là nhất quán, dễ nhận biết. Danh יהוה cần được nhất quán chuyển là “Yahweh”, không dùng “Đức Giê-hô-va”, để theo quyết định thuật ngữ POB và phân biệt danh riêng với tước hiệu.
  issues:
