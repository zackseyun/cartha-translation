  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa chính của Hê-bơ-rơ: Yahweh nói với Áp-ram, truyền ông rời khỏi xứ/quê hương, thân tộc và nhà cha mình để đến một xứ mà Ngài sẽ chỉ cho. “Hãy rời khỏi” diễn đạt phù hợp mệnh lệnh לֶךְ־לְךָ mà không áp đặt một cách giải thích về sắc thái phản thân. “Họ hàng” phù hợp với מוֹלֶדֶת trong chuỗi xứ sở—thân tộc—nhà cha. Thì tương lai trong “Ta sẽ chỉ cho ngươi” bảo toàn hình thức chưa hoàn thành אַרְאֶךָּ và tính chưa xác định của điểm đến.'
  naturalness: Tiếng Việt hiện đại, rõ ràng và có sắc thái trang trọng phù hợp với văn bản tường thuật cổ. Cấu trúc “Hãy rời khỏi ... mà đi đến ...” mạch lạc; cặp “Ta—ngươi” nhất quán trong lời phán trực tiếp.
  terminology: “Yahweh” phản ánh trực tiếp יהוה và nhất quán với quyết định của POB. Tên “Áp-ram” là dạng Việt ngữ quen dùng. “Nhà cha ngươi” giữ được hình ảnh và phạm vi gia tộc của בֵּית אָבִיךָ, không giản lược thành một tòa nhà hay chỉ “gia đình”.
