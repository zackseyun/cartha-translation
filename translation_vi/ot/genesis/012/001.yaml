  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: vi
  text: 'Yahweh phán với Áp-ram: “Hãy rời khỏi quê hương, họ hàng và nhà cha ngươi, mà đi đến xứ Ta sẽ chỉ cho ngươi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển trực tiếp danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: לֶךְ־לְךָ
  choice: Hãy rời khỏi
  rationale: Trong văn cảnh, mệnh lệnh này kêu gọi Áp-ram ra đi, lìa những nơi và quan hệ được liệt kê; cách dịch tự nhiên này không gán thêm sắc thái phản thân vốn còn được tranh luận.
- source_word: מֵאַרְצְךָ
  choice: khỏi quê hương
  rationale: אֶרֶץ có thể là đất, xứ hoặc quê hương; với hậu tố sở hữu và lời kêu gọi rời đi, “quê hương” diễn đạt tự nhiên ý “xứ của ngươi”.
- source_word: מִמּוֹלַדְתְּךָ
  choice: họ hàng
  rationale: מוֹלֶדֶת có thể chỉ nơi sinh hoặc thân tộc; trong chuỗi tăng tiến từ xứ sở đến thân tộc rồi nhà cha, “họ hàng” phù hợp nhất nhưng vẫn thuộc phạm vi nghĩa của từ.
- source_word: מִבֵּית אָבִיךָ
  choice: nhà cha ngươi
  rationale: Giữ hình ảnh xã hội-gia tộc của בֵּית אָב, không thu hẹp thành ngôi nhà vật chất hay diễn giải hoàn toàn thành gia đình.
- source_word: אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ
  choice: đến xứ Ta sẽ chỉ cho ngươi
  rationale: 'Giữ thì chưa hoàn thành và sự chưa xác định của đích đến: Yahweh sẽ cho Áp-ram thấy xứ ấy.'
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA / Đức Giê-hô-va
  rationale: Nguồn Hê-bơ-rơ dùng minh nhiên Tứ Tự Danh; dùng “Yahweh” bảo tồn tính chất danh riêng và không che nó bằng tước hiệu.
- issue: Sắc thái của לֶךְ־לְךָ
  choice: Không thêm “vì lợi ích của ngươi” hay “một mình ngươi”
  alternative: Hãy đi vì chính ngươi / hãy tự mình đi
  rationale: Cấu trúc có thể mang sắc thái nhấn mạnh, nhưng câu không đủ rõ để đưa một cách giải thích thần học hoặc động cơ cụ thể vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán với” cho lời trực tiếp của Yahweh, cặp đại từ “Ta—ngươi” để giữ sắc thái trang nghiêm của trình thuật cổ, và giữ tên Áp-ram theo dạng quen dùng trong tiếng Việt.
