  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: vi
  text: Áp-ram đem theo Sa-rai, vợ ông, Lót, con trai của anh/em trai ông, toàn bộ tài sản họ đã có được, cùng những người họ đã quy tụ[a] tại Cha-ran. Họ lên đường đến xứ Ca-na-an và đã đến xứ Ca-na-an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn sát nghĩa: “những sinh mạng họ đã làm” tại Cha-ran. Đây là một thành ngữ khó, có lẽ chỉ những người họ đã quy tụ hoặc có được tại đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: đem theo
  rationale: Trong mạch kể về cuộc ra đi, động từ לקח với các tân ngữ chỉ người và tài sản mang nghĩa Áp-ram đưa họ và của cải đi cùng; “đem theo” tự nhiên hơn “lấy” trong tiếng Việt.
- source_word: אִשְׁתּוֹ
  choice: vợ mình
  rationale: אִשָּׁה kèm hậu tố sở hữu trong quan hệ hôn nhân rõ ràng chỉ người vợ; “mình” quy chiếu tự nhiên về chủ ngữ Áp-ram.
- source_word: בֶּן אָחִיו
  choice: con trai của anh em mình
  rationale: Giữ cách diễn đạt quan hệ họ hàng khá sát nguyên văn, vốn là “con trai của người anh/em trai của ông”; tiếng Hê-bơ-rơ không cho biết người ấy là anh hay em.
- source_word: כָּל רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: tất cả tài sản họ đã gây dựng
  rationale: רְכוּשׁ chỉ tài sản, của cải; רכש chỉ việc thu góp hoặc có được. “Gây dựng” diễn đạt tự nhiên mà không thu hẹp loại tài sản.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: những người họ đã thu nhận
  rationale: נפש ở đây chỉ người; עשה trong thành ngữ khó này không nên dịch máy móc là “làm ra”. “Thu nhận” giữ được ý họ trở thành thành viên của đoàn hoặc gia hộ mà không xác định quá mức địa vị của họ.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: họ lên đường đi đến
  rationale: Cụm động từ diễn tả việc ra đi có đích đến; cách dịch này vừa tự nhiên vừa bảo tồn động thái khởi hành và hướng đi.
- source_word: אַרְצָה כְּנַעַן
  choice: đến xứ Ca-na-an
  rationale: Dạng chỉ hướng của אֶרֶץ cùng địa danh cho nghĩa hướng tới xứ Ca-na-an; “xứ” phù hợp với cách nói địa lý trang trọng trong tiếng Việt.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: và đã đến xứ Ca-na-an
  rationale: Giữ nguyên sự lặp lại đích đến trong nguyên văn, qua đó phân biệt ý định lên đường với việc thực sự đến nơi.
theological_decisions:
- issue: Ý nghĩa của “những người họ đã làm/thu nhận” tại Cha-ran
  choice: những người họ đã thu nhận
  alternative: những linh hồn họ đã làm ra; các đầy tớ họ đã có được
  rationale: Nguyên văn là một thành ngữ khó. Bản dịch không hiểu theo nghĩa sáng tạo con người, cũng không xác định họ nhất thiết là đầy tớ; chú thích bảo tồn nghĩa đen và độ mở của câu.
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Dùng các dạng tên quen thuộc Áp-ram, Sa-rai, Lót, Cha-ran và Ca-na-an. Tránh lối dịch “lấy vợ mình” dễ gây hiểu lầm trong tiếng Việt; giữ sự lặp lại “xứ Ca-na-an” của nguyên văn.
