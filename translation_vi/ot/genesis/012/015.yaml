  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: vi
  text: Các quan của Pha-ra-ôn thấy nàng thì khen nàng với Pha-ra-ôn[a], rồi người phụ nữ ấy bị đưa vào nhà Pha-ra-ôn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giới thiệu nàng với Pha-ra-ôn” hoặc “nói tốt về nàng với Pha-ra-ôn.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ là “nhà”; trong ngữ cảnh này, từ ấy có thể chỉ hoàng thất hoặc triều đình của Pha-ra-ôn, chứ không chỉ một tòa nhà.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: các quan của Pha-ra-ôn
  rationale: שָׂרִים chỉ những người có địa vị cai trị hoặc chức vụ trong triều đình. “Các quan” là cách diễn đạt tự nhiên trong tiếng Việt và không hàm ý họ là hoàng tử.
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: thấy nàng
  rationale: ראה là động từ thông dụng có nghĩa “thấy”; “nàng” phù hợp với mạch văn đang nói về Sa-rai.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: khen ngợi nàng với Pha-ra-ôn
  rationale: Dạng piel của הלל ở đây có nghĩa khen ngợi hoặc nói tốt về ai với một người khác. Cách dịch này giữ nội dung lời khen được trình lên Pha-ra-ôn mà không thêm chi tiết.
- source_word: וַתֻּקַּח
  choice: bị đưa vào
  rationale: Hình thái bị động không nêu tác nhân và nhấn mạnh sự thụ động của người phụ nữ. “Bị đưa vào” tự nhiên trong tiếng Việt và vẫn giữ sắc thái ấy.
- source_word: הָאִשָּׁה
  choice: người phụ nữ ấy
  rationale: Nguyên văn dùng danh từ “người phụ nữ”, không dùng từ “vợ”. Từ “ấy” giúp xác định người vừa được nhắc đến mà không diễn giải thêm.
- source_word: בֵּית פַּרְעֹה
  choice: nhà Pha-ra-ôn
  rationale: בַּיִת có thể chỉ ngôi nhà hoặc cả hoàng gia/gia nhân. “Nhà Pha-ra-ôn” giữ được độ rộng nghĩa của nguyên văn; dịch là “cung điện” sẽ cụ thể hóa quá mức.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Dùng “các quan” cho bối cảnh triều đình; giữ “người phụ nữ ấy” và cấu trúc bị động để không thêm quan hệ hay tác nhân mà nguyên văn không nêu.
