translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng/tôi” để phản ánh lời người chồng nói trực tiếp với vợ trong bối cảnh cổ đại mà không quá cổ kính. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
