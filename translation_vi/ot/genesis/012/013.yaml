  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: vi
  text: Xin nàng hãy nói rằng nàng là chị/em gái tôi, để nhờ nàng mà mọi việc sẽ tốt đẹp cho tôi, và tôi sẽ được sống vì nàng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “và linh hồn tôi sẽ sống vì nàng.” Trong câu này, “linh hồn” (nephesh) là cách nói chỉ mạng sống hoặc chính bản thân Áp-ram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Xin nàng hãy nói
  rationale: Mệnh lệnh giống cái số ít đi với נָא mang sắc thái khẩn khoản; “Xin nàng hãy nói” tự nhiên, trang trọng và cho thấy Áp-ram đang trực tiếp thưa với Sa-rai.
- source_word: אֲחֹתִי אָתְּ
  choice: rằng nàng là em gái tôi
  rationale: Giữ nghĩa trực tiếp “nàng là chị/em gái tôi”; trong ngữ cảnh gia đình của Sáng Thế Ký, “em gái” là cách diễn đạt tự nhiên, dù tiếng Hê-bơ-rơ không tự nó phân biệt chị với em.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt rõ quan hệ mục đích mà không làm câu tiếng Việt nặng nề.
- source_word: יִיטַב לִי
  choice: tôi được đối xử tốt
  rationale: Thành ngữ có nghĩa là điều tốt sẽ đến với Áp-ram hoặc người ta sẽ đối đãi tốt với ông; ngữ cảnh nghiêng về sự đối xử thuận lợi.
- source_word: בַעֲבוּרֵךְ
  choice: nhờ nàng
  rationale: Diễn đạt nguyên nhân hay phương tiện đem lại lợi ích cho Áp-ram, tự nhiên trong tiếng Việt.
- source_word: וְחָיְתָה נַפְשִׁי
  choice: mạng sống tôi được bảo toàn
  rationale: נֶפֶשׁ ở đây chỉ mạng sống hay chính con người Áp-ram, không nhất thiết là linh hồn theo nghĩa phi vật chất; cách dịch này truyền đạt ý ông không bị giết.
- source_word: בִּגְלָלֵךְ
  choice: vì nàng
  rationale: Giữ biểu thức nguyên nhân thứ hai và sự lặp ý gần nghĩa với בַעֲבוּרֵךְ, nhưng dùng cách nói tiếng Việt gọn, tự nhiên.
