revisions:
- from: Xin nàng hãy nói rằng nàng là em gái tôi, để nhờ nàng mà tôi được đối xử tốt và mạng sống tôi được bảo toàn vì nàng.[a]
  to: Xin nàng hãy nói rằng nàng là chị/em gái tôi, để nhờ nàng mà mọi việc sẽ tốt đẹp cho tôi, và tôi sẽ được sống vì nàng.[a]
  rationale: Chỉnh “em gái” thành “chị/em gái” để giữ đúng sự không xác định về thứ bậc trong אֲחוֹת. Chỉnh mệnh đề về יִיטַב לִי thành “mọi việc sẽ tốt đẹp cho tôi” để giữ nghĩa rộng của thành ngữ, không diễn giải quá mức. Mệnh đề cuối được diễn đạt tự nhiên là “tôi sẽ được sống vì nàng”; chú thích vẫn giải thích nghĩa thành ngữ của nephesh và được đặt ngay sau mệnh đề liên quan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:04:22Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo diễn đạt đúng lời thỉnh cầu, mục đích, và ý Áp-ram mong được an toàn. Tuy nhiên, אֲחֹתִי chỉ có nghĩa là “chị/em gái, chị gái hoặc em gái” và không xác định thứ bậc; dịch riêng là “em gái” đã thêm thông tin không có trong tiếng Hê-bơ-rơ. Ngoài ra, “được đối xử tốt” là một khả năng theo ngữ cảnh, nhưng יִיטַב לִי có nghĩa rộng hơn là “mọi việc tốt đẹp/thuận lợi cho tôi”; nên không cần thu hẹp thành cách người khác đối xử với ông.
  naturalness: “Xin nàng hãy nói” và lối xưng hô “nàng/tôi” phù hợp văn phong trang trọng hiện đại trong một lời thoại cổ. Câu chỉnh sửa giữ nhịp tự nhiên, đồng thời phản ánh hai cụm nguyên nhân gần nghĩa trong nguyên ngữ bằng “nhờ nàng” và “vì nàng”.
  terminology: Dùng “chị/em gái” để không áp đặt phân biệt tuổi tác mà tiếng Hê-bơ-rơ không nêu. “Tôi sẽ được sống” chuyển đạt tự nhiên idiom נֶפֶשׁ “mạng sống/bản thân”, còn chú thích bảo lưu cách dịch sát chữ “linh hồn”.
  issues:
  - severity: medium
    issue: “em gái tôi” xác định Sa-rai là em gái của Áp-ram.
    rationale: אֲחוֹת không phân biệt “chị gái” với “em gái”. Bản dịch cần giữ sự mơ hồ này.
  - severity: low
    issue: “tôi được đối xử tốt” thu hẹp nghĩa của יִיטַב לִי.
    rationale: Ngữ cảnh có thể hàm ý sự đối đãi thuận lợi, nhưng thành ngữ Hê-bơ-rơ nói khái quát rằng mọi việc sẽ tốt đẹp/thuận lợi cho Áp-ram.
