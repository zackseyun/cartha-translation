  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: vi
  text: Ta sẽ làm cho con thành một dân tộc lớn, ban phước cho con và làm cho tên tuổi con trở nên lớn lao; con hãy trở nên một phước lành.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “và con sẽ trở nên một phước lành.” Dạng Hê-bơ-rơ là mệnh lệnh (“hãy trở nên”), nhưng vì câu này nằm trong một chuỗi lời hứa của Đức Chúa Trời, một số người hiểu nó là kết quả của những lời hứa ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: Ta sẽ làm cho con thành một dân tộc lớn
  rationale: Diễn đạt tự nhiên cấu trúc עשה + bổ ngữ với לְ, đồng thời giữ nghĩa thông dụng của גּוֹי là một dân tộc hay cộng đồng dân tộc.
- source_word: וַאֲבָרֶכְךָ
  choice: ban phước cho con
  rationale: Giữ nghĩa trực tiếp của động từ ברך và đối tượng số ít được Đức Chúa Trời phán bảo.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: làm cho tên tuổi con trở nên lớn lao
  rationale: “Tên tuổi” chuyển tải tự nhiên ý nghĩa của שֵׁם trong ngữ cảnh danh tiếng, còn “trở nên lớn lao” giữ hình ảnh của động từ גדל mà không thu hẹp thành một cách giải thích cụ thể.
- source_word: וֶהְיֵה בְּרָכָה
  choice: con hãy trở nên một phước lành
  rationale: Giữ lực mệnh lệnh của וֶהְיֵה và danh từ số ít בְּרָכָה; cách diễn đạt này cũng bảo tồn sự chuyển đổi từ lời hứa của Đức Chúa Trời sang lời kêu gọi dành cho Áp-ram.
theological_decisions:
- issue: Lực ngữ pháp của וֶהְיֵה בְּרָכָה
  choice: 'Mệnh lệnh: “con hãy trở nên một phước lành”'
  alternative: 'Kết quả hoặc lời dự báo: “con sẽ trở nên một phước lành”'
  rationale: וֶהְיֵה là mệnh lệnh Qal ngôi hai giống đực số ít, nên bản chính giữ lực mệnh lệnh. Tuy nhiên, vì mệnh đề nằm trong chuỗi lời hứa, cách hiểu theo kết quả vẫn hợp lý và được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” phù hợp với lời Đức Chúa Trời trực tiếp phán với Áp-ram mà không dùng lối xưng hô quá cổ. Dấu chấm phẩy làm rõ sự chuyển từ ba lời hứa sang mệnh lệnh cuối, đồng thời vẫn giữ mạch liên kết của câu Hê-bơ-rơ.
