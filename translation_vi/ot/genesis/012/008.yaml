  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֨ק מִ/שָּׁ֜ם הָ/הָ֗רָ/ה מִ/קֶּ֛דֶם לְ/בֵֽית אֵ֖ל וַ/יֵּ֣ט אָהֳלֹ֑/ה בֵּֽית אֵ֤ל מִ/יָּם֙ וְ/הָ/עַ֣י מִ/קֶּ֔דֶם וַ/יִּֽבֶן שָׁ֤ם מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: vi
  text: Từ đó, ông dời đến vùng đồi núi ở phía đông Bê-tên và dựng lều của mình, với Bê-tên ở phía tây và A-hi ở phía đông. Tại đó, ông lập một bàn thờ cho Yahweh[a] và kêu cầu danh Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là “YHWH”; theo truyền thống thường được dịch là “CHÚA”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “công bố danh Yahweh”. Cụm từ Hê-bơ-rơ có thể chỉ việc cầu khẩn Yahweh trong thờ phượng hoặc công khai tuyên xưng danh Ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: ông dời đến
  rationale: Động từ diễn tả việc chuyển khỏi một nơi để đến nơi khác; cách dịch này tự nhiên trong lời kể tiếng Việt và không thêm ý ngoài nguyên văn.
- source_word: הָהָרָה
  choice: đến vùng đồi núi
  rationale: Hình thái chỉ hướng diễn tả chuyển động về phía vùng núi; trong bối cảnh địa lý quanh Bê-tên, “vùng đồi núi” tự nhiên và phù hợp hơn một ngọn núi riêng lẻ.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: phía đông Bê-tên
  rationale: קֶדֶם mang nghĩa định hướng không gian, xác định khu vực ở phía đông của Bê-tên.
- source_word: וַיֵּט אָהֳלֹה
  choice: và dựng lều
  rationale: Đây là thành ngữ chỉ việc căng hoặc dựng lều; “dựng lều” là cách nói tiếng Việt hiện đại, rõ ràng.
- source_word: מִיָּם
  choice: ở phía tây
  rationale: Dù יָם theo nghĩa đen là “biển”, từ này thường chỉ hướng tây trong cách định hướng địa lý của tiếng Hê-bơ-rơ.
- source_word: וְהָעַי מִקֶּדֶם
  choice: và A-hi ở phía đông
  rationale: Cách dịch giữ cấu trúc cân xứng, cho thấy trại nằm giữa Bê-tên và A-hi.
- source_word: מִזְבֵּחַ
  choice: một bàn thờ
  rationale: Đây là cách dịch tiêu chuẩn, dễ hiểu, cho công trình dùng trong việc dâng tế lễ hoặc thờ phượng.
- source_word: לַיהוָה
  choice: cho Yahweh
  rationale: Giữ tên riêng giao ước יְהוָה dưới dạng “Yahweh”, thay vì thay thế bằng một tước hiệu.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: và kêu cầu danh Yahweh
  rationale: Cách dịch giữ thành ngữ Kinh Thánh và nghĩa trực tiếp về sự cầu khẩn trong thờ phượng, đồng thời nghĩa “công bố” được bảo tồn trong chú thích.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Giữ “Yahweh” giúp phân biệt tên riêng này với tước hiệu “Chúa” và không áp đặt một truyền thống giáo phái.
- issue: Ý nghĩa của וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: kêu cầu danh Yahweh
  alternative: công bố danh Yahweh
  rationale: Trong bối cảnh Áp-ram dựng bàn thờ, nghĩa cầu khẩn trong thờ phượng là trực tiếp nhất; tuy nhiên, cấu trúc Hê-bơ-rơ cũng có thể hàm ý công khai công bố danh ấy, nên giữ phương án này trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng địa danh quen thuộc “Bê-tên” và “A-hi”; giữ “Yahweh” như tên riêng. Các chỉ hướng được diễn đạt cân xứng để làm rõ vị trí trại mà không diễn giải quá mức.
