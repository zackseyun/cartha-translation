  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: vi
  text: 'Khi người Ai Cập thấy em, họ sẽ nói: ‘Đây là vợ của người ấy.’ Rồi họ sẽ giết anh, còn em thì họ sẽ để sống.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ sẽ giữ cho em sống” hoặc “họ sẽ tha mạng cho em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Khi
  rationale: Cụm mở đầu tiếng Hê-bơ-rơ hướng tới tình huống Áp-ram dự liệu. Trong tiếng Việt hiện đại, “Khi” diễn đạt tự nhiên quan hệ thời gian mà không cần giữ một công thức dài và gượng.
- source_word: יִרְאוּ אֹתָךְ
  choice: thấy em
  rationale: ראה mang nghĩa thông thường là “thấy”; đại từ giống cái số ít chỉ Sa-rai. “Em” phù hợp lời chồng nói với vợ trong văn cảnh tiếng Việt hiện đại.
- source_word: הַמִּצְרִים
  choice: người Ai Cập
  rationale: Đây là cách gọi dân tộc tự nhiên và chuẩn trong tiếng Việt.
- source_word: אִשְׁתּוֹ זֹאת
  choice: Đây là vợ hắn
  rationale: Giữ lực chỉ định của זֹאת và lời nhận diện trực tiếp; “hắn” thể hiện ngôi thứ ba trong lời người Ai Cập giả định mà không thêm ý kính trọng.
- source_word: וְהָרְגוּ אֹתִי
  choice: Rồi họ sẽ giết anh
  rationale: הרג là động từ thông dụng nghĩa là “giết”. “Anh” tương ứng cách Áp-ram tự xưng với vợ trong tiếng Việt.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: còn em thì họ sẽ để sống
  rationale: Dạng Hiphil của חיה có nghĩa “để cho sống/giữ cho sống”. “Còn... thì” làm rõ sự tương phản vốn được hàm ý giữa việc giết Áp-ram và để Sa-rai sống.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cặp xưng hô “anh–em” cho lời chồng nói với vợ; không thêm nội dung thần học ngoài câu nguồn. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
