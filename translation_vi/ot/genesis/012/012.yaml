  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi ý chính của tiếng Hê-bơ-rơ: người Ai Cập sẽ thấy Sa-rai, nhận diện bà là vợ của Áp-ram, giết ông và để bà sống. “Khi” là cách rút gọn tự nhiên, chấp nhận được cho công thức וְהָיָה כִּי trong tiếng Việt. Cụm “để sống” phản ánh đúng Hiphil חיה trong ngữ cảnh tương phản.'
  naturalness: Câu nhìn chung tự nhiên, rõ ràng và giữ được sắc thái lời nói trực tiếp. Tuy nhiên, “hắn” trong tiếng Việt hiện đại thường có sắc thái miệt thị hoặc thù địch, không có cơ sở trong đại từ sở hữu ngôi ba số ít của tiếng Hê-bơ-rơ.
  terminology: “Người Ai Cập,” “giết,” và “tha mạng” đều phù hợp. Cặp xưng hô “anh–em” là một lựa chọn Việt hóa có thể chấp nhận trong lời Áp-ram nói với vợ. Thay “hắn” bằng “người ấy” tránh thêm sắc thái đánh giá đối với Áp-ram.
  issues:
