base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: vi
  text: Bấy giờ, Pha-ra-ôn ra lệnh cho người ta về Áp-ram,[a][b] và họ cho ông ra đi, cùng với vợ và tất cả những gì thuộc về ông.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bấy giờ, Pha-ra-ôn truyền lệnh cho người ta về Áp-ram.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “những người”; có lẽ đây là những người phục vụ hoặc người thi hành lệnh của Pha-ra-ôn, nhưng vai trò cụ thể của họ không được nói rõ.
    reason: cultural_note
  - marker: c
    text: 'Hay: “tất cả những gì ông có.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ra lệnh
  rationale: Động từ צוה mang nghĩa ra lệnh hoặc truyền lệnh; “ra lệnh” tự nhiên, rõ ràng và giữ được sắc thái quyền hành của Pha-ra-ôn.
- source_word: עָלָיו
  choice: về việc của Áp-ram
  rationale: Giới từ עַל đi với צוה có thể chỉ người hay sự việc mà mệnh lệnh nhắm đến. Cách dịch này giữ ý Pha-ra-ôn ban chỉ thị liên quan đến Áp-ram mà không xác định thêm nội dung chỉ thị.
- source_word: פַרְעֹה
  choice: Pha-ra-ôn
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tước hiệu hoàng gia Ai Cập.
- source_word: אֲנָשִׁים
  choice: một số người
  rationale: Danh từ chỉ những người nam, nhưng văn cảnh không nói rõ họ là quan hầu, đầy tớ hay lính. “Một số người” giữ sự không xác định ấy và tự nhiên hơn trong tiếng Việt.
- source_word: וַיְשַׁלְּחוּ
  choice: họ cho ông ra đi
  rationale: Trong văn cảnh, שלח diễn tả việc sai đi hoặc cho rời khỏi nơi đó. Cách dịch này thể hiện sự ra đi theo lệnh của Pha-ra-ôn mà không thêm chi tiết rằng họ hộ tống hay trục xuất ông.
- source_word: אֹתוֹ
  choice: ông
  rationale: Đại từ làm tân ngữ, chỉ Áp-ram; tiếng Việt dùng “ông” phù hợp với văn phong kể chuyện trang trọng.
- source_word: אִשְׁתּוֹ
  choice: vợ
  rationale: Trong quan hệ hôn nhân, אשה với hậu tố sở hữu có nghĩa là “vợ ông”.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tất cả những gì thuộc về ông
  rationale: Cụm từ chỉ toàn bộ những gì Áp-ram sở hữu; cách dịch này bám sát cấu trúc Hê-bơ-rơ và không thu hẹp thành một loại tài sản cụ thể.
theological_decisions: []
translation_notes:
  register: 'Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “về việc của Áp-ram” chủ ý giữ độ mở của עָלָיו; không gọi những người này là quan hầu, đầy tớ, lính hay người hộ tống vì nguyên văn không xác định. Tên riêng được phiên âm theo lối quen thuộc: Pha-ra-ôn, Áp-ram.'
