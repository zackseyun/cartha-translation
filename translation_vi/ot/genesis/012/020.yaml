revisions:
- from: Bấy giờ, Pha-ra-ôn ra lệnh cho một số người về việc của Áp-ram,[a][b] và họ cho ông ra đi, cùng với vợ và tất cả những gì thuộc về ông.[c]
  to: Bấy giờ, Pha-ra-ôn ra lệnh cho người ta về Áp-ram,[a][b] và họ cho ông ra đi, cùng với vợ và tất cả những gì thuộc về ông.[c]
  rationale: Chỉnh “một số người” thành “người ta” để không thêm hàm ý về số lượng hay sự tuyển chọn, và thay “về việc của Áp-ram” bằng “về Áp-ram” để phản ánh trực tiếp, không thu hẹp nghĩa của עָלָיו. Các phần còn lại trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
