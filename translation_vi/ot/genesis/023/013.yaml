source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: vi
  text: 'Ông nói với Ép-rôn trước mặt dân trong xứ: “Xin ông nghe tôi: Tôi xin trả số bạc mua cánh đồng[a]; hãy nhận từ tôi, để tôi chôn người chết của tôi tại đó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dịch sát là: “Tôi đã trao số bạc của cánh đồng”; dạng động từ hoàn thành ở đây có lẽ diễn tả một lời đề nghị chính thức trong cuộc thương lượng. Cũng có thể hiểu: “Tôi sẽ trả số bạc mua cánh đồng.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ông nói
  rationale: Động từ דבר chỉ hành động nói, ở đây nằm trong lời thương lượng trang trọng; “nói” tự nhiên trong lời kể tiếng Việt.
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: trước sự chứng kiến của dân trong xứ
  rationale: Thành ngữ nghĩa đen là “trong tai dân trong xứ”, tức lời được nói công khai để cộng đồng địa phương nghe và làm chứng; cách dịch này làm rõ bối cảnh pháp lý-xã hội.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: Xin ông nghe tôi
  rationale: Cụm từ có tính rút gọn và khẩn khoản. “Xin ông nghe tôi” giữ sắc thái lịch sự, tự nhiên trong tiếng Việt mà không cường giải cấu trúc.
- source_word: נָתַתִּי כֶּסֶף הַשָּׂדֶה
  choice: Tôi xin trả bạc mua cánh đồng
  rationale: Dạng hoàn thành נָתַתִּי có thể mang lực ngôn hành trong cuộc thương lượng, tức chính thức đề nghị trả. “Xin trả” diễn đạt lực đề nghị hiện tại; “bạc” giữ hình ảnh vật chất của כֶּסֶף, còn “mua cánh đồng” biểu đạt quan hệ sở hữu tự nhiên trong tiếng Việt.
- source_word: קַח מִמֶּנִּי
  choice: hãy nhận lấy từ tay tôi
  rationale: קח cơ bản là “lấy/nhận”; trong giao dịch, “nhận lấy” tự nhiên hơn. “Từ tay tôi” là lối diễn đạt tiếng Việt trang trọng cho מִמֶּנִּי.
- source_word: וְאֶקְבְּרָה
  choice: để tôi chôn
  rationale: Dạng cohortative diễn tả mục đích hoặc ý định của Áp-ra-ham; “để tôi chôn” truyền đạt trực tiếp sắc thái ấy.
- source_word: מֵתִי
  choice: người chết của mình
  rationale: Giữ cách gọi không nêu tên của nguyên văn, thay vì đưa “vợ tôi” từ ngữ cảnh vào câu; “của mình” quy chiếu tự nhiên về chủ thể đang nói.
- source_word: שָׁמָּה
  choice: tại đó
  rationale: Tương đương trang trọng, tự nhiên của trạng từ chỉ nơi chốn “ở đó”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” trong lời đối thoại để thể hiện phép lịch sự giữa hai bên thương lượng. Tên riêng được phiên âm theo lối quen dùng trong tiếng Việt. Dấu chân chú [a] đặt ngay sau câu có nội dung cần giải thích.
