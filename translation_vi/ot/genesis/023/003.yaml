  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: vi
  text: 'Rồi Áp-ra-ham đứng dậy khỏi chỗ bên người quá cố của mình và nói với người Hê-tít[a] rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc “các con trai của Hết”; tiếng Hê-bơ-rơ: “các con trai của Hết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Rồi Áp-ra-ham đứng dậy
  rationale: Thể wayyiqtol tiếp nối diễn tiến câu chuyện; “rồi” diễn đạt tự nhiên trình tự ấy, còn “đứng dậy” giữ rõ hành động của קום.
- source_word: מֵעַל פְּנֵי
  choice: rời khỏi
  rationale: Thành ngữ chỉ việc rời khỏi sự hiện diện hoặc chỗ bên cạnh một người; trong ngữ cảnh này, cách dịch này tự nhiên hơn lối dịch sát chữ “khỏi trước mặt”.
- source_word: מֵתוֹ
  choice: thi hài vợ mình
  rationale: Danh từ mang nghĩa “người chết của ông”; ngữ cảnh xác định đó là Sa-ra, vợ Áp-ra-ham. “Thi hài vợ mình” diễn đạt trang trọng, tự nhiên và phù hợp với cảnh ông đứng lên khỏi bên thi thể bà.
- source_word: וַיְדַבֵּר אֶל
  choice: và nói với
  rationale: דבר đi với אֶל có nghĩa là nói với hoặc ngỏ lời với một người; “nói với” là cách diễn đạt rõ ràng, hiện đại.
- source_word: בְּנֵי חֵת
  choice: con cháu Hếch
  rationale: Giữ cấu trúc “các con của Hếch” theo nghĩa chỉ một nhóm hậu duệ, đồng thời dùng “con cháu” tự nhiên hơn trong tiếng Việt; chú thích cung cấp tên gọi dân tộc thông dụng.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Phân từ này dẫn vào nội dung lời nói ở câu kế tiếp; “rằng:” tạo liên kết tự nhiên trong tiếng Việt mà không lặp vụng “nói... rằng nói”.
