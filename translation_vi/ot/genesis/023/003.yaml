translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp tiếp nối của nguyên văn, đồng thời tránh lối diễn đạt sát chữ thiếu tự nhiên. Dấu hai chấm báo trước lời của Áp-ra-ham ở câu kế tiếp.
