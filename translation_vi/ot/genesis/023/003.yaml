revisions:
- from: 'Rồi Áp-ra-ham đứng dậy, rời khỏi thi hài vợ mình, và nói với con cháu Hếch[a] rằng:'
  to: 'Rồi Áp-ra-ham đứng dậy khỏi chỗ bên người quá cố của mình và nói với người Hê-tít[a] rằng:'
  rationale: Bản sửa giữ chuỗi hành động và cấu trúc dẫn lời của nguyên văn, tránh thêm “vợ” và tránh đồng nhất “người chết” với “thi hài”. “Người Hê-tít” là cách gọi tự nhiên cho cộng đồng בני־חת; chú thích bảo lưu cách diễn đạt sát chữ và tên riêng Hết. Bỏ dấu phẩy trước “và” để câu tiếng Việt gọn, tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
