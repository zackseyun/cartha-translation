  text: וַ/יַּעֲנ֧וּ בְנֵי חֵ֛ת אֶת אַבְרָהָ֖ם לֵ/אמֹ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/005.yaml
  text: The sons of Heth answered Abraham[a], saying to him,
translation:
  language: vi
  text: 'Các con trai của Hết[a] trả lời Áp-ra-ham rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người Hê-tít.” Tiếng Hê-bơ-rơ: “các con trai của Hết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: trả lời
  rationale: Động từ ענה ở thể Qal wayyiqtol mở đầu lời đáp trong mạch đối thoại; “trả lời” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: בְנֵי חֵת
  choice: Con cháu Hếch
  rationale: Cụm từ theo nghĩa đen là “các con trai của Hếch”, nhưng trong ngữ cảnh chỉ một cộng đồng mang dòng dõi/tên Hếch. “Con cháu Hếch” giữ được hình ảnh thân tộc của nguyên văn mà vẫn tự nhiên hơn “các con trai Hếch” trong tiếng Việt.
- source_word: אֶת אַבְרָהָם
  choice: Áp-ra-ham
  rationale: אֶת là dấu hiệu chỉ định bổ ngữ trực tiếp nên không cần dịch riêng; Áp-ra-ham là người nhận lời đáp.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dạng nguyên mẫu của אמר dùng để dẫn lời trực tiếp. Tiếng Việt tự nhiên dùng “rằng” sau “trả lời”; cách này chuyển tải chức năng diễn ngôn thay vì sao chép máy móc cấu trúc “nói rằng”.
- source_word: לוֹ
  choice: không dịch riêng
  rationale: Đại từ “với ông” chỉ lại Áp-ra-ham. Vì tiếng Việt đã nêu rõ “trả lời Áp-ra-ham”, lặp thêm “với ông” sẽ nặng nề; quan hệ người nói-người nghe vẫn hoàn toàn rõ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Con cháu Hếch” để vừa bảo tồn cách gọi theo dòng dõi trong tiếng Hê-bơ-rơ, vừa tránh lối dịch quá sát nhưng thiếu tự nhiên. Dấu chú thích [a] được đặt sau từ dẫn nhập vì chú thích giải thích danh xưng đã xuất hiện trong câu.
