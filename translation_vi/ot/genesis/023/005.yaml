    rationale: בְּנֵי חֵת theo nghĩa đen là “các con trai của Hết”; “con cháu” rộng nghĩa hơn, còn “Hếch” không phải dạng phiên âm Kinh Thánh tiếng Việt thông dụng của Heth.
