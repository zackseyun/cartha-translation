source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: vi
  text: Sau đó, Áp-ra-ham chôn Sa-ra, vợ ông, trong hang ở cánh đồng Mác-pê-la, đối diện Mam-rê[a] (tức là Hếp-rôn), trong xứ Ca-na-an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ở trước Mam-rê.” Cụm từ Hê-bơ-rơ chỉ một địa điểm ở trước mặt hoặc đối diện Mam-rê.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sau đó
  rationale: Cụm từ này chuyển tiếp theo trình tự thời gian, nghĩa là “sau việc ấy/sau đó.” “Sau đó” tự nhiên trong tiếng Việt hiện đại và không thêm chi tiết ngoài nguyên văn.
- source_word: קָבַר
  choice: chôn
  rationale: Động từ qal có nghĩa thông thường là chôn cất. “Chôn” rõ ràng, tự nhiên và phù hợp với văn mạch kể chuyện.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: Sa-ra, vợ ông
  rationale: Cách diễn đạt này giữ thứ tự của tiếng Hê-bơ-rơ, đồng thời dùng dấu phẩy để câu tiếng Việt sáng rõ và tự nhiên.
- source_word: אֶל מְעָרַת
  choice: trong hang
  rationale: Giới từ אֶל thường có nghĩa “đến/vào,” nhưng đi với hành động chôn và địa điểm mai táng thì “trong hang” diễn đạt tự nhiên kết quả được nguyên văn mô tả.
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: hang ở cánh đồng Mác-pê-la
  rationale: Cách dịch này thể hiện quan hệ giữa hang và cánh đồng trong chuỗi liên kết của tiếng Hê-bơ-rơ mà không dùng cấu trúc sở hữu gượng gạo trong tiếng Việt.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: đối diện Mam-rê
  rationale: Thành ngữ chỉ vị trí ở trước mặt hoặc đối diện một nơi. “Đối diện” giữ quan hệ không gian mà không suy đoán một hướng địa lý cụ thể.
- source_word: הִוא חֶבְרוֹן
  choice: tức là Hếp-rôn
  rationale: Đại từ cùng địa danh đưa ra lời xác định địa điểm; “tức là” là cách chú giải đồng nhất tự nhiên trong tiếng Việt.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: trong xứ Ca-na-an
  rationale: Giữ danh từ địa lý אֶרֶץ và dùng “xứ,” một từ hiện đại, trang trọng vừa phải, phù hợp với cách nói địa lý trong văn kể chuyện.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. Các địa danh và tên riêng được phiên âm theo cách dễ đọc trong tiếng Việt; câu giữ đầy đủ các chỉ dẫn địa lý của nguyên văn.
