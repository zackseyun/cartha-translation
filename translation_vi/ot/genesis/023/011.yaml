base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: vi
  text: '“Không, thưa ngài, xin nghe tôi: Tôi tặng ngài thửa ruộng, và tôi tặng ngài hang đá ở trong đó. Trước mặt những người trong dân tôi, tôi tặng hang ấy cho ngài. Xin hãy chôn người quá cố của ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: Không
  rationale: Trong ngữ cảnh thương lượng, từ này là lời từ chối hoặc đính chính lịch sự đối với đề nghị của Áp-ra-ham; “Không” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: אֲדֹנִי
  choice: thưa ngài
  rationale: Cách xưng hô kính trọng, phù hợp với quan hệ xã hội và cuộc thương lượng mà không hàm ý phục dịch quá mức.
- source_word: שְׁמָעֵנִי
  choice: xin nghe tôi
  rationale: Giữ sắc thái mệnh lệnh khẩn khoản của động từ שׁמע, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: הַשָּׂדֶה
  choice: thửa ruộng
  rationale: שׂדה chỉ một cánh đồng hoặc khoảnh đất trống; “thửa ruộng” diễn đạt rõ một bất động sản xác định trong giao dịch này.
- source_word: נָתַתִּי לָךְ
  choice: Tôi tặng ngài
  rationale: Thể hoàn thành ở đây có chức năng ngôn hành, tức lời nói thực hiện việc trao tặng ngay lúc ấy; thì hiện tại tiếng Việt thể hiện đúng lực giao dịch.
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: hang đá ở trong đó
  rationale: 'Giữ rõ quan hệ không gian: hang nằm trong thửa ruộng.'
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: Trước mặt những người thuộc dân tôi
  rationale: Thành ngữ nghĩa đen là “trước mắt các con trai của dân tôi”, chỉ việc công khai trước sự chứng kiến của cộng đồng; bản dịch giữ ý ấy mà tránh lối nói khó hiểu trong tiếng Việt.
- source_word: קְבֹר
  choice: Xin hãy chôn
  rationale: Mệnh lệnh trực tiếp được diễn đạt bằng cấu trúc lịch sự, phù hợp giọng thương lượng kính trọng.
- source_word: מֵתֶךָ
  choice: người quá cố của ngài
  rationale: Danh từ số ít chỉ người đã chết, trong ngữ cảnh là Sa-ra; cách dịch này tự nhiên và tôn kính mà không đưa tên riêng vào câu.
