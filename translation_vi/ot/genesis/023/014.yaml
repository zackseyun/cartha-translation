  text: And Ephron answered Abraham, saying to him,
translation:
  language: vi
  text: 'Ép-rôn đáp lời Áp-ra-ham rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: đáp lời
  rationale: Động từ ענה trong mạch đối thoại chỉ lời hồi đáp; “đáp lời” tự nhiên, trang trọng và giữ rõ quan hệ đối thoại.
- source_word: עֶפְרוֹן
  choice: Ép-rôn
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối viết dễ đọc trong tiếng Việt hiện đại.
- source_word: אֶת אַבְרָהָם
  choice: Áp-ra-ham
  rationale: אֶת là dấu hiệu tân ngữ nên không dịch riêng; Áp-ra-ham là người được Ép-rôn đáp lời.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong công thức dẫn lời, “rằng” chuyển tải tự nhiên chức năng của לֵאמֹר và chuẩn bị cho lời nói trực tiếp ở câu tiếp theo.
- source_word: לוֹ
  choice: (hàm chứa trong “đáp lời Áp-ra-ham”)
  rationale: Đại từ “với ông” quy chiếu về Áp-ra-ham; tiếng Việt tránh lặp tự nhiên bằng cách gộp ý này vào cụm “đáp lời Áp-ra-ham” mà không làm mất người nhận lời.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “đáp lời” thay vì cấu trúc nặng và lặp “trả lời Áp-ra-ham mà nói với ông”; dấu hai chấm phù hợp vì lời trực tiếp tiếp nối ở câu sau.
