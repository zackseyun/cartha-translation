  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm nhất quán; giữ đơn vị cổ “siếc-lơ.” Cấu trúc câu làm rõ giao dịch công khai nhưng không thêm động cơ hay nội dung thần học ngoài nguyên văn.
