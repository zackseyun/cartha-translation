base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: vi
  text: 'Áp-ra-ham nghe theo Ép-rôn và cân cho Ép-rôn số bạc mà Ép-rôn đã nói trước mặt các con của Hếch[a]: bốn trăm siếc-lơ bạc, theo tiêu chuẩn thông dụng trong thương mại.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người Hếch”; nguyên văn là “các con của Hếch.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được thương nhân chấp nhận” hoặc “theo trọng lượng chuẩn của thương nhân.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: nghe theo
  rationale: Thành ngữ này mang nghĩa nghe và thuận theo lời người khác; trong ngữ cảnh giao dịch, “nghe theo” diễn đạt tự nhiên việc Áp-ra-ham chấp nhận mức giá mà không thêm ý nghĩa quá mức.
- source_word: וַיִּשְׁקֹל
  choice: cân cho
  rationale: Động từ chỉ hành động cân bạc theo trọng lượng trước thời tiền đúc; cách dịch giữ được hành động thương mại cụ thể.
- source_word: הַכֶּסֶף
  choice: số bạc
  rationale: Giữ nguyên chất liệu bạc được dùng để thanh toán, thay vì khái quát hóa thành “tiền”.
- source_word: אֲשֶׁר דִּבֶּר
  choice: mà ông đã nói
  rationale: Bám sát động từ “nói”; trong mạch văn, độc giả hiểu đây là số bạc Ép-rôn vừa nêu ra.
- source_word: בְּאָזְנֵי
  choice: trước mặt
  rationale: Thành ngữ nguyên văn là “trong tai”; “trước mặt” diễn đạt tự nhiên tính công khai và có nhân chứng trong tiếng Việt.
- source_word: בְנֵי חֵת
  choice: con cháu Hếch
  rationale: Giữ hình thức gia hệ “các con của Hếch” bằng lối nói Việt tự nhiên, đồng thời chú thích tên gọi dân tộc quen thuộc hơn.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: bốn trăm siếc-lơ bạc
  rationale: Giữ đơn vị trọng lượng cổ và chất liệu bạc; phiên âm “siếc-lơ” dễ đọc đối với độc giả Việt.
- source_word: עֹבֵר לַסֹּחֵר
  choice: theo tiêu chuẩn thông dụng giữa các thương nhân
  rationale: Cụm từ khó xác định tuyệt đối nhưng có lẽ chỉ bạc đạt trọng lượng hoặc chuẩn được chấp nhận trong giao thương; bản dịch diễn đạt rõ nghĩa thương mại mà vẫn để chú thích nêu phương án gần mặt chữ hơn.
