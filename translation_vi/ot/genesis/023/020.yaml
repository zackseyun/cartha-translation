  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: vi
  text: Vậy, cánh đồng và hang ở trong đó đã được chuyển nhượng cho Áp-ra-ham làm sản nghiệp dùng làm nơi chôn cất, do con cháu Hết chuyển nhượng.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người Hê-tít” thay cho “con cháu Hết”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “đã được xác lập cho Áp-ra-ham làm quyền sở hữu để chôn cất”. Trong ngữ cảnh này, động từ Hê-bơ-rơ chỉ việc quyền sở hữu được xác lập qua một giao dịch pháp lý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: đã được chuyển quyền sở hữu
  rationale: Trong bối cảnh giao dịch pháp lý, động từ קום với tài sản làm chủ ngữ nói đến việc quyền sở hữu được xác lập và chuyển sang cho Áp-ra-ham; cách dịch này diễn đạt rõ hiệu lực pháp lý mà không dùng nghĩa đen không phù hợp là “đứng dậy”.
- source_word: הַשָּׂדֶה
  choice: cánh đồng
  rationale: Cách dịch trực tiếp, tự nhiên cho thửa đất được mua.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: và hang đá ở trong đó
  rationale: Giữ quan hệ giữa hang đá và cánh đồng; “đó” quy chiếu về cánh đồng.
- source_word: לְאַבְרָהָם
  choice: cho Áp-ra-ham
  rationale: Đánh dấu Áp-ra-ham là người nhận quyền sở hữu trong giao dịch.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: làm phần đất chôn cất
  rationale: “Phần đất” bảo lưu sắc thái tài sản thuộc quyền sở hữu của אֲחֻזָּה, còn “chôn cất” diễn đạt mục đích của קָבֶר bằng tiếng Việt tự nhiên.
- source_word: מֵאֵת
  choice: từ
  rationale: Diễn đạt nguồn chuyển giao trong giao dịch, tự nhiên hơn lối dịch sát chữ “từ tay”.
- source_word: בְּנֵי חֵת
  choice: con cháu Hếch
  rationale: Giữ cấu trúc gia tộc của cụm Hê-bơ-rơ và phù hợp cách nói tiếng Việt; “người Hê-tít” là phương án dân danh theo ngữ cảnh.
