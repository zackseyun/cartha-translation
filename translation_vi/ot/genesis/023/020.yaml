translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ sắc thái tổng kết pháp lý của đoạn, đồng thời tránh thuật ngữ chuyên môn quá nặng. Mọi dấu chú thích đều xuất hiện trong chính văn.
