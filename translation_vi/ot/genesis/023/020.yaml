revisions:
- from: Vậy, cánh đồng và hang đá ở trong đó đã được chuyển quyền sở hữu cho Áp-ra-ham làm phần đất chôn cất, từ con cháu Hếch.[a][b]
  to: Vậy, cánh đồng và hang ở trong đó đã được chuyển nhượng cho Áp-ra-ham làm sản nghiệp dùng làm nơi chôn cất, do con cháu Hết chuyển nhượng.[a][b]
  rationale: Bản sửa giữ ý nghĩa pháp lý và quan hệ sở hữu của nguyên ngữ, dùng cách phiên tên riêng phù hợp hơn, không thêm chi tiết “đá”, và diễn đạt אֲחֻזַּת קָבֶר bằng một cụm bao quát cả cánh đồng lẫn hang. Cụm “do ... chuyển nhượng” làm rõ bên chuyển giao trong tiếng Việt mà không thay đổi ý nghĩa của מֵאֵת.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:07:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc pháp lý của câu: thửa ruộng và hang thuộc về Áp-ra-ham, với tư cách một quyền sở hữu dùng cho việc mai táng, từ con cháu Hết. Tuy nhiên, tên Heth nên được phiên là “Hết”, và “phần đất chôn cất” chưa diễn đạt trọn sắc thái sở hữu/phần sản nghiệp của אֲחֻזַּת.'
  naturalness: “Hang đá ở trong đó” có thể hiểu được nhưng hơi nặng; “hang ở trong đó” tự nhiên hơn và không thêm nghĩa “đá”. Cụm “được chuyển quyền sở hữu ... từ” cũng kém tự nhiên trong tiếng Việt khi chỉ bên chuyển nhượng.
  terminology: Dùng “sản nghiệp dùng làm nơi chôn cất” để giữ sắc thái pháp lý của אֲחֻזָּה mà vẫn rõ nghĩa. “Con cháu Hết” bảo lưu cách gọi nguyên ngữ; “người Hê-tít” được giữ trong chú thích như một phương án dân danh theo ngữ cảnh.
  issues:
  - severity: medium
    issue: Tên riêng “Hếch” không phù hợp với cách phiên âm thông dụng của Heth trong tiếng Việt.
    rationale: חֵת thường được phiên là “Hết”; dạng này cũng liên kết minh bạch với dân danh “Hê-tít” trong chú thích.
  - severity: low
    issue: “Hang đá” thêm một đặc tính không được nêu rõ trong từ מְעָרָה.
    rationale: Từ này chỉ “hang”; bỏ “đá” tránh bổ sung chi tiết không cần thiết.
  - severity: medium
    issue: “Phần đất chôn cất” làm yếu ý niệm một tài sản/quyền sở hữu và không bao quát hang cùng thửa ruộng.
    rationale: אֲחֻזַּת קָבֶר là một quyền sở hữu/sản nghiệp phục vụ việc mai táng, không chỉ là một mảnh đất.
