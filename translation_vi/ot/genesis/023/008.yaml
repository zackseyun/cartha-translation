    issue: “thật lòng muốn” thêm sắc thái không có trong nguyên văn.
    rationale: Thành ngữ Hê-bơ-rơ diễn tả ý muốn hoặc sự sẵn lòng; không xác định rằng người nghe phải có sự chân thành đặc biệt.
  - severity: low
    issue: “khẩn cầu” có thể diễn đạt quá mạnh động từ פגע với ב.
    rationale: Trong cuộc thương lượng này, động từ chỉ việc nài xin/cầu nói với Ép-rôn thay cho Áp-ra-ham. “Nói giúp tôi với” truyền đạt đúng chức năng trung gian, không gợi một lời van lạy quá mức.
  revised_text: 'Ông nói với họ: “Nếu các vị muốn tôi chôn cất người quá cố của tôi, để khuất khỏi trước mặt tôi, thì xin hãy nghe tôi và nói giúp tôi với Ép-rôn, con trai Xô-ha.”'
