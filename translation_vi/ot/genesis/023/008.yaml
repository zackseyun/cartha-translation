base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: vi
  text: 'Ông nói với họ: “Nếu các vị muốn tôi chôn cất người quá cố của tôi, để khuất khỏi trước mặt tôi, thì xin hãy nghe tôi và nói giúp tôi với Ép-rôn, con trai Xô-ha.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: Ông nói với họ
  rationale: Diễn đạt tự nhiên cấu trúc kể chuyện Hê-bơ-rơ; אִתָּם có nghĩa là nói với họ, còn לֵאמֹר giới thiệu lời nói trực tiếp và không cần dịch riêng một cách máy móc trong tiếng Việt.
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: Nếu quý vị thật lòng muốn
  rationale: Thành ngữ có נֶפֶשׁ diễn tả ý muốn hay sự sẵn lòng. Cách dịch này truyền đạt sắc thái ý chí tự nhiên, đồng thời dùng “quý vị” phù hợp lời thỉnh cầu trang trọng với một tập thể.
- source_word: לִקְבֹּר אֶת־מֵתִי
  choice: tôi chôn người quá cố của mình
  rationale: Chủ thể của động từ nguyên mẫu được xác định theo ngữ cảnh là Áp-ra-ham. “Người quá cố của mình” giữ dạng số ít và quan hệ ngôi thứ nhất mà không tự ý thêm “vợ”.
- source_word: מִלְּפָנַי
  choice: khuất khỏi mắt tôi
  rationale: Cụm từ theo nghĩa đen là “khỏi trước mặt tôi”; trong bối cảnh mai táng, cách diễn đạt này tự nhiên và giữ được hình ảnh đau buồn của nguyên văn.
- source_word: שְׁמָעוּנִי
  choice: xin hãy nghe tôi
  rationale: Mệnh lệnh “hãy nghe tôi” được thêm “xin” để phản ánh giọng thỉnh cầu lịch sự trong cuộc thương lượng mà không làm yếu nội dung.
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: và thay mặt tôi khẩn cầu Ép-rôn
  rationale: פגע với ב trong ngữ cảnh này mang nghĩa hướng lời khẩn khoản đến một người; לִי cho biết hành động được thực hiện vì hoặc thay mặt người nói. “Khẩn cầu” giữ sắc thái thỉnh nguyện mạnh hơn cách dịch chung chung “tiếp xúc”.
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: Ép-rôn, con trai Xô-ha
  rationale: Phiên âm tên riêng theo âm hình Hê-bơ-rơ và dịch בֶּן minh bạch là “con trai”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ lời thỉnh cầu mang tính thương lượng; không bổ sung danh tính của người quá cố dù ngữ cảnh cho biết đó là Sa-ra.
