  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố của tiếng Hê-bơ-rơ: cái chết của Sa-ra, địa điểm Ki-ri-át Ác-ba được đồng nhất với Hếp-rôn, địa danh Ca-na-an, việc Áp-ra-ham đến, và hai hành động tang chế phân biệt là than khóc và khóc thương. “Qua đời” là cách diễn đạt trang trọng, tự nhiên trong tiếng Việt và không làm thay đổi sự kiện Sa-ra chết.'
