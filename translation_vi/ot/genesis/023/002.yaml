  text: וַ/תָּ֣מָת שָׂרָ֗ה בְּ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יָּבֹא֙ אַבְרָהָ֔ם לִ/סְפֹּ֥ד לְ/שָׂרָ֖ה וְ/לִ/בְכֹּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: vi
  text: Sa-ra qua đời tại Ki-ri-át Ác-ba, tức là Hếp-rôn[a], trong đất Ca-na-an. Áp-ra-ham đến để than khóc Sa-ra và khóc thương bà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ki-ri-át Ác-ba được đồng nhất ở đây với Hếp-rôn.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “để than thương Sa-ra và khóc bà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: qua đời
  rationale: Động từ מות chỉ cái chết. “Qua đời” là cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại mà vẫn nêu rõ sự việc.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: tại Ki-ri-át Ác-ba
  rationale: Giữ địa danh bằng lối phiên âm dễ đọc trong tiếng Việt; “tại” phù hợp với địa điểm nơi Sa-ra qua đời.
- source_word: הִוא חֶבְרוֹן
  choice: tức là Hếp-rôn
  rationale: Cụm tiếng Hê-bơ-rơ đồng nhất Ki-ri-át Ác-ba với Hếp-rôn; “tức là” truyền đạt rõ chức năng giải thích.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: trong đất Ca-na-an
  rationale: Giữ danh từ אֶרֶץ được nêu rõ trong nguyên văn, thay vì rút gọn thành “tại Ca-na-an”.
- source_word: וַיָּבֹא
  choice: đến
  rationale: בוא có thể là “đến” hoặc “đi” tùy điểm nhìn. “Đến” giữ cách hiểu trực tiếp và không thêm một nơi xuất phát hay hành động đi vào không có trong câu.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: để than khóc Sa-ra
  rationale: ספד nói đến việc than khóc người chết, thường bao gồm sự biểu lộ tang thương; “than khóc” cụ thể hơn “để tang” và tự nhiên trong văn cảnh.
- source_word: וְלִבְכֹּתָהּ
  choice: và khóc thương bà
  rationale: בכה là khóc; hậu tố giống cái số ít chỉ Sa-ra. “Khóc thương bà” vừa giữ hành động khóc vừa diễn đạt đối tượng của nỗi đau bằng tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tách làm hai để tiếng Việt tự nhiên hơn; các địa danh và tên riêng được phiên âm nhất quán. Hai động từ tang chế khác nhau trong nguyên văn được phân biệt bằng “than khóc” và “khóc thương”.
