  - severity: medium
    issue: “chôn ... khỏi trước mặt tôi” không tự nhiên trong tiếng Việt.
    rationale: Cụm “cho khuất khỏi trước mặt tôi” diễn đạt được kết quả của việc chôn cất và vẫn bảo lưu hình ảnh “từ trước mặt tôi” của מִלְּפָנַי.
