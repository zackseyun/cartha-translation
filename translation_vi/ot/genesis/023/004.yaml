  text: גֵּר וְ/תוֹשָׁ֥ב אָנֹכִ֖י עִמָּ/כֶ֑ם תְּנ֨וּ לִ֤/י אֲחֻזַּת קֶ֨בֶר֙ עִמָּ/כֶ֔ם וְ/אֶקְבְּרָ֥ה מֵתִ֖/י מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: vi
  text: Tôi là người ngoại kiều và người tạm trú giữa quý vị. Xin quý vị cho tôi một khu đất làm nơi chôn cất[a] giữa quý vị, để tôi chôn người đã khuất của mình, cho khuất khỏi trước mặt tôi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ hàm ý một khu đất được nắm giữ làm tài sản để chôn cất, chứ không chỉ là chỗ đào một huyệt mộ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “khỏi tầm mắt tôi”; nguyên văn là “khỏi trước mặt tôi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר וְתוֹשָׁב
  choice: người ngoại kiều, sống tạm
  rationale: Cặp từ mô tả Áp-ra-ham là người ở ngoài quê hương và thân tộc bản địa, đang cư trú giữa cộng đồng nhưng chưa có địa vị sở hữu đất đầy đủ. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được cả sắc thái người ngoài lẫn cư trú tạm thời.
- source_word: עִמָּכֶם
  choice: giữa quý vị
  rationale: Trong bối cảnh Áp-ra-ham thưa chuyện với cộng đồng địa phương, cụm này mang nghĩa sống và có mặt ở giữa họ; “giữa quý vị” vừa sát nghĩa vừa phù hợp lối xưng hô kính trọng.
- source_word: תְּנוּ לִי
  choice: Xin quý vị nhượng cho tôi
  rationale: Động từ có nghĩa cơ bản là “cho”, nhưng ngữ cảnh là lời đề nghị được cấp hoặc chuyển nhượng quyền sử dụng/sở hữu đất chôn cất. “Nhượng cho” giữ sắc thái giao đất mà không quyết định trước là cho không hay bán, điều sẽ được thương lượng trong phần tiếp theo.
- source_word: אֲחֻזַּת קֶבֶר
  choice: một phần đất làm nơi chôn cất
  rationale: אֲחֻזָּה chỉ một phần đất nắm giữ hoặc tài sản thuộc quyền sở hữu, còn קֶבֶר xác định mục đích chôn cất. Cách dịch này giữ sắc thái pháp lý về đất đai, không thu hẹp thành một huyệt mộ đơn lẻ.
- source_word: וְאֶקְבְּרָה
  choice: để tôi chôn
  rationale: Dạng cohortative sau lời yêu cầu biểu thị mục đích mong muốn; “để tôi chôn” diễn đạt tự nhiên quan hệ mục đích ấy.
- source_word: מֵתִי
  choice: người đã khuất của mình
  rationale: Nguyên văn không nêu tên Sa-ra mà dùng thành ngữ số ít “người chết của tôi”. “Người đã khuất của mình” trang trọng, tự nhiên và không thêm danh tính mà câu này không nói rõ.
- source_word: מִלְּפָנַי
  choice: khỏi trước mặt tôi
  rationale: Giữ hình ảnh nguyên văn “từ trước mặt tôi” thay vì giải thích hoàn toàn thành “khỏi tầm mắt”, nhờ đó bảo tồn sắc thái cụ thể và cảm xúc của lời nói.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Quý vị” phù hợp lời thưa với một tập thể và thể hiện phép lịch sự; tránh các từ cổ như “kiều ngụ”. Câu giữ sự lặp lại “giữa quý vị” của nguyên văn.
