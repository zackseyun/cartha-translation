- from: Tôi là người ngoại kiều, sống tạm giữa quý vị. Xin quý vị nhượng cho tôi một phần đất làm nơi chôn cất[a] ở giữa quý vị, để tôi chôn người đã khuất của mình khỏi trước mặt tôi[b].
  to: Tôi là người ngoại kiều và người tạm trú giữa quý vị. Xin quý vị cho tôi một khu đất làm nơi chôn cất[a] giữa quý vị, để tôi chôn người đã khuất của mình, cho khuất khỏi trước mặt tôi[b].
  rationale: Bản sửa dùng “cho” để không quyết định trước hình thức chuyển giao đất, phục hồi cặp danh từ song song của tiếng Hê-bơ-rơ, và chỉnh mệnh đề cuối cho tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh nguyên văn. Chú thích a tiếp tục làm rõ sắc thái đất đai/tài sản của אֲחֻזַּת קֶבֶר.
