base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: vi
  text: Vậy, cánh đồng của Ép-rôn tại Mác-pê-la, đối diện Mam-rê—tức là cả cánh đồng ấy, hang ở trong đó, và mọi cây cối trong cánh đồng, trong toàn bộ phạm vi các ranh giới chung quanh của nó—được xác lập[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được công nhận” hoặc “được sang nhượng”; trong bối cảnh mua bán này, động từ Hê-bơ-rơ có lẽ mang nghĩa pháp lý về việc xác lập quyền đối với tài sản.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: được xác lập
  rationale: 'Trong bối cảnh mua bán đất, động từ קום mang sắc thái pháp lý: tài sản được xác nhận hoặc thiết lập là thuộc về bên mua. “Được xác lập” giữ được ý pháp lý mà không diễn giải quá mức thành một thuật ngữ chuyển nhượng cụ thể.'
- source_word: שְׂדֵה עֶפְרוֹן
  choice: cánh đồng của Ép-rôn
  rationale: Diễn đạt tự nhiên chuỗi sở hữu trong tiếng Việt, đồng thời giữ rõ chủ cũ của bất động sản.
- source_word: בַּמַּכְפֵּלָה
  choice: tại Mác-pê-la
  rationale: Xem Mác-pê-la là địa danh và dùng “tại” để diễn đạt vị trí của cánh đồng.
- source_word: לִפְנֵי מַמְרֵא
  choice: đối diện Mam-rê
  rationale: לִפְנֵי có nghĩa không gian là “ở trước mặt/đối diện”. Cách dịch này giữ quan hệ vị trí mà không tự ý xác định hướng đông.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: gồm cánh đồng, hang ở trong đó
  rationale: “Gồm” giúp tiếng Việt thể hiện tự nhiên phần liệt kê pháp lý các thành phần của bất động sản, còn “ở trong đó” giữ quan hệ của hang với cánh đồng.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: và mọi cây cối trong cánh đồng
  rationale: Danh từ số ít tập hợp הָעֵץ sau כָל được chuyển thành “mọi cây cối”, diễn đạt toàn bộ cây thuộc khu đất.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: nằm trong toàn bộ ranh giới chung quanh
  rationale: Giữ trọng tâm vào phạm vi đầy đủ của bất động sản theo lối mô tả ranh giới mang tính pháp lý.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu; giữ cấu trúc liệt kê mang tính pháp lý của nguyên văn. Câu cố ý chưa kết thúc bằng dấu chấm vì cú pháp và giao dịch còn tiếp tục ở câu 18.
