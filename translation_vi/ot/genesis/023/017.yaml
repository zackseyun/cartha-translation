revisions:
- from: Vậy, cánh đồng của Ép-rôn tại Mác-pê-la, đối diện Mam-rê—gồm cánh đồng, hang ở trong đó và mọi cây cối trong cánh đồng, nằm trong toàn bộ ranh giới chung quanh—được xác lập[a]
  to: Vậy, cánh đồng của Ép-rôn tại Mác-pê-la, đối diện Mam-rê—tức là cả cánh đồng ấy, hang ở trong đó, và mọi cây cối trong cánh đồng, trong toàn bộ phạm vi các ranh giới chung quanh của nó—được xác lập[a]
  rationale: Sửa cách diễn đạt phần ranh giới để phản ánh rõ hơn chức năng của cụm בְּכָל גְּבֻלוֹ סָבִיב như một mô tả bao quát phạm vi khu đất, và điều chỉnh sự lặp lại trong danh mục tài sản cho tự nhiên. Không thay đổi ý nghĩa, tính mơ hồ không gian của “đối diện”, hay sắc thái pháp lý không hoàn toàn xác định của וַיָּקָם.
  reviewer_model: gpt-5.6-terra
