base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: vi
  text: '“Thưa ngài, xin nghe tôi: một mảnh đất giá bốn trăm siếc-lơ bạc—giữa tôi với ngài, có đáng gì? Hãy chôn người chết của ngài đi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Mảnh đất—bốn trăm siếc-lơ bạc—giữa tôi với ngài, có đáng gì?” Câu Hê-bơ-rơ tỉnh lược và có tính tu từ, nhằm xem nhẹ giá tiền trong lúc thương lượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Thưa ngài
  rationale: Lời xưng hô kính trọng dành cho Ép-rôn, không phải danh xưng thần linh; cách nói này tự nhiên trong tiếng Việt hiện đại và giữ sắc thái nhún nhường.
- source_word: שְׁמָעֵנִי
  choice: xin nghe tôi
  rationale: Giữ nghĩa mệnh lệnh trực tiếp nhưng lịch sự của động từ שׁמע trong lời thương lượng.
- source_word: אֶרֶץ
  choice: một mảnh đất
  rationale: Trong ngữ cảnh, từ này chỉ một phần đất cụ thể đang được giao dịch, không phải đất đai nói chung.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: trị giá bốn trăm siếc-lơ bạc
  rationale: Bổ sung “trị giá” để diễn đạt tự nhiên cấu trúc tỉnh lược của tiếng Hê-bơ-rơ mà không thêm nội dung mới.
- source_word: בֵּינִי וּבֵינְךָ
  choice: giữa tôi với ngài
  rationale: Giữ nguyên ngôi thứ nhất và ngôi thứ hai số ít, đồng thời duy trì giọng điệu cá nhân trong cuộc thương lượng.
- source_word: מַה הִוא
  choice: thì đáng là bao?
  rationale: Diễn đạt câu hỏi tu từ nhằm xem nhẹ số tiền trong quan hệ giữa hai bên; “đáng là bao” tự nhiên hơn lối dịch sát “là gì” trong tiếng Việt.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: Hãy chôn người chết của ngài đi
  rationale: Chuyển mệnh lệnh trực tiếp sang tiếng Việt tự nhiên; không dùng từ nối suy luận mạnh như “vậy nên”, dù וְ liên kết câu này với lời trước.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu. “Thưa ngài” biểu thị sự kính trọng trong giao tiếp xã hội; “siếc-lơ” được giữ làm đơn vị trọng lượng cổ. Dấu gạch ngang bảo tồn phần nào nhịp tỉnh lược của nguyên văn.
