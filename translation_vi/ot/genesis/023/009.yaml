  text: וְ/יִתֶּן לִ֗/י אֶת מְעָרַ֤ת הַ/מַּכְפֵּלָה֙ אֲשֶׁר ל֔/וֹ אֲשֶׁ֖ר בִּ/קְצֵ֣ה שָׂדֵ֑/הוּ בְּ/כֶ֨סֶף מָלֵ֜א יִתְּנֶ֥/נָּה לִ֛/י בְּ/תוֹכְ/כֶ֖ם לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: vi
  text: Xin người ấy nhượng cho tôi hang Mác-pê-la thuộc về người, ở cuối cánh đồng của người[a]. Xin người nhượng hang ấy cho tôi giữa các ông, với trọn giá bằng bạc[b], để làm phần đất sở hữu dùng làm nơi chôn cất[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “ở rìa cánh đồng của người”. Cụm từ Hê-bơ-rơ có thể chỉ cuối, rìa hoặc mép cánh đồng.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “bằng bạc đầy đủ”, một thành ngữ chỉ việc trả đủ giá.'
    reason: lexical_alternative
  - marker: c
    text: Cụm từ Hê-bơ-rơ nhấn mạnh quyền sở hữu hợp pháp đối với nơi chôn cất, chứ không chỉ quyền sử dụng nơi ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: xin người ấy nhượng cho tôi
  rationale: Dạng vị hoàn thành mang sắc thái thỉnh cầu trong ngữ cảnh thương lượng. “Xin... nhượng” tự nhiên trong tiếng Việt và diễn đạt việc chuyển giao tài sản mà không biến động từ thành “bán”.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: hang Mác-pê-la
  rationale: Giữ địa danh riêng bằng lối phiên âm tiếng Việt; kết cấu sở hữu của tiếng Hê-bơ-rơ được diễn đạt tự nhiên bằng tên đặt sau “hang”.
- source_word: אֲשֶׁר לוֹ
  choice: thuộc về người
  rationale: Diễn đạt rõ quyền sở hữu, phù hợp sắc thái pháp lý của cuộc thương lượng.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: ở cuối cánh đồng của người
  rationale: קָצֶה có thể chỉ cuối, rìa hoặc mép; chọn “cuối” trong chính văn và ghi nhận “rìa” ở chú thích.
- source_word: בְּכֶסֶף מָלֵא
  choice: với đủ số bạc
  rationale: Bám sát thành ngữ Hê-bơ-rơ “bằng bạc đầy đủ”, tức thanh toán đủ giá, đồng thời giữ bạc là phương tiện chi trả được nêu đích danh.
- source_word: יִתְּנֶנָּה
  choice: xin người nhượng hang ấy cho tôi
  rationale: Giữ sắc thái thỉnh cầu và đối tượng giống cái số ít là cái hang; “nhượng” phù hợp một giao dịch có trả tiền nhưng không diễn giải quá mức thành “bán”.
- source_word: בְּתוֹכְכֶם
  choice: trước mặt anh em
  rationale: Trong bối cảnh pháp lý cộng đồng, cụm từ chỉ việc giao dịch diễn ra giữa và có sự chứng kiến của những người hiện diện.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: để làm phần đất sở hữu dùng làm nơi chôn cất
  rationale: אֲחֻזָּה nhấn mạnh tài sản thuộc quyền sở hữu lâu dài, chứ không chỉ quyền sử dụng để mai táng.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “nhượng” để giữ động từ נתן trong bối cảnh chuyển giao tài sản có trả đủ giá; dùng “anh em” làm cách xưng hô số nhiều phù hợp lời nói công khai với cộng đồng. Các dấu chú thích đều xuất hiện trong chính văn theo đúng thứ tự.
