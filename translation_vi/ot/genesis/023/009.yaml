  to: Xin người ấy nhượng cho tôi hang Mác-pê-la thuộc về người, ở cuối cánh đồng của người[a]. Xin người nhượng hang ấy cho tôi giữa các ông, với trọn giá bằng bạc[b], để làm phần đất sở hữu dùng làm nơi chôn cất[c].
  rationale: Sửa “trước mặt anh em” thành “giữa các ông” để không thêm ý chứng kiến vào bề mặt văn bản; làm rõ thành ngữ trả đủ giá bằng bạc; và chuyển neo chú thích a đến cụm từ mà chú thích giải thích. Các yếu tố về sở hữu pháp lý, địa điểm và mục đích chôn cất được giữ nguyên.
