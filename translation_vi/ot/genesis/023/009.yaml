    rationale: Cụm Hê-bơ-rơ nghĩa cơ bản là “giữa các ông/trong cộng đồng các ông”. Ý ‘trước mặt’ hoặc ‘có chứng kiến’ là suy luận từ bối cảnh pháp lý, không nên đưa vào chính văn.
  - severity: low
    issue: “với đủ số bạc”
    rationale: Cách nói này kém rõ về thành ngữ בְּכֶסֶף מָלֵא, là trả trọn/đủ giá bằng bạc. “Với trọn giá bằng bạc” diễn đạt trực tiếp hơn mà vẫn giữ phương tiện thanh toán.
  - severity: low
    issue: Vị trí chú thích a
    rationale: Chú thích về nghĩa thay thế của “cuối/rìa” cần neo tại cụm “cuối cánh đồng”, thay vì tại tên Mác-pê-la.
