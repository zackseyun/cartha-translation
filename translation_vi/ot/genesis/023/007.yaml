  yaml_path: translation/ot/genesis/023/007.yaml
  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: vi
  text: Bấy giờ, Áp-ra-ham đứng dậy và cúi mình trước dân trong xứ[a], tức là con cháu Hết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân bản xứ”; ở đây cụm từ này chỉ con cháu Hết.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Bấy giờ, Áp-ra-ham đứng dậy
  rationale: Động từ קום ở thể Qal diễn tả việc đứng dậy; liên từ kể chuyện được chuyển thành “Bấy giờ” để thể hiện trình tự tự nhiên trong tiếng Việt.
- source_word: וַיִּשְׁתַּחוּ
  choice: cúi mình
  rationale: Động từ שׁחה chỉ cử chỉ cúi thấp để bày tỏ sự kính trọng; “cúi mình” giữ được tính chất thể lý mà không nhất thiết hàm ý phủ phục hoàn toàn.
- source_word: לְעַם הָאָרֶץ
  choice: trước dân trong xứ
  rationale: Giới từ ל đánh dấu đối tượng của hành động cúi mình; tiếng Việt tự nhiên dùng “cúi mình trước”. Cụm עַם הָאָרֶץ ở đây chỉ cư dân địa phương.
- source_word: לִבְנֵי חֵת
  choice: tức là con cháu Hết
  rationale: Nghĩa sát là “các con trai của Hết”, nhưng trong ngữ cảnh đây là tên gọi một cộng đồng hậu duệ. “Con cháu Hết” tự nhiên hơn trong tiếng Việt, còn “tức là” cho thấy cụm này xác định “dân trong xứ”.
- source_word: חֵת
  choice: Hết
  rationale: Tên riêng được phiên âm theo lối quen dùng trong tiếng Việt Kinh Thánh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Bản dịch giữ cử chỉ kính trọng của Áp-ra-ham, đồng thời diễn đạt quan hệ đồng vị giữa “dân trong xứ” và “con cháu Hết” một cách tự nhiên.
