  to: '“Xin ngài nghe chúng tôi: ngài là một thủ lĩnh của Đức Chúa Trời[a] ở giữa chúng tôi. Xin hãy chôn người chết của ngài trong một trong những mộ phần tốt nhất của chúng tôi. Không một ai trong chúng tôi sẽ giữ lại mộ phần của mình, không cho ngài chôn người chết của ngài.”'
  rationale: Bản sửa giữ cách dịch sát chữ và tính đa nghĩa của “thủ lĩnh của Đức Chúa Trời”, đồng thời sửa số nhiều của “những mộ phần tốt nhất” và diễn đạt tự nhiên, rõ ràng hơn quan hệ ngăn cản trong mệnh đề cuối. Không cần thêm chú thích cho vế cuối vì bản văn tiếng Việt đã nêu rõ chức năng ngăn cản mà không thêm diễn giải thần học.
