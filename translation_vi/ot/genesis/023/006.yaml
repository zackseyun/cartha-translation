base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: vi
  text: '“Xin ngài nghe chúng tôi: ngài là một thủ lĩnh của Đức Chúa Trời[a] ở giữa chúng tôi. Xin hãy chôn người chết của ngài trong một trong những mộ phần tốt nhất của chúng tôi. Không một ai trong chúng tôi sẽ giữ lại mộ phần của mình, không cho ngài chôn người chết của ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thủ lĩnh đầy quyền thế ở giữa chúng tôi.” Cụm Hê-bơ-rơ theo nghĩa đen là “một thủ lĩnh của Đức Chúa Trời” và có thể được dùng như một lối nói chỉ mức độ cao nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: Xin ngài nghe chúng tôi
  rationale: Động từ mệnh lệnh với hậu tố ngôi thứ nhất số nhiều; thêm “xin ngài” để diễn đạt tự nhiên lời thỉnh cầu kính trọng trong tiếng Việt.
- source_word: אֲדֹנִי
  choice: ngài
  rationale: Cách xưng hô kính trọng dành cho Áp-ra-ham; “ngài” tự nhiên và trang trọng hơn cách dịch sát chữ “chúa của tôi” trong ngữ cảnh giao tiếp này.
- source_word: נְשִׂיא אֱלֹהִים
  choice: một thủ lĩnh của Đức Chúa Trời
  rationale: Giữ cấu trúc sở thuộc có nghĩa đen là “thủ lĩnh của Đức Chúa Trời”, không tự ý giải quyết khả năng đây là lối nói chỉ mức độ cao nhất; phương án thành ngữ được ghi chú.
- source_word: בְּתוֹכֵנוּ
  choice: ở giữa chúng tôi
  rationale: Diễn đạt cả vị trí trong cộng đồng lẫn sự hiện diện giữa dân cư địa phương.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: trong ngôi mộ tốt nhất của chúng tôi
  rationale: מִבְחַר chỉ phần được tuyển chọn, tốt nhất; số ít tiếng Việt phù hợp với việc chọn một nơi trong các phần mộ họ sở hữu.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: Xin hãy chôn người chết của ngài
  rationale: Giữ mệnh lệnh trực tiếp và cách gọi người đã chết theo nguyên văn, đồng thời dùng “xin hãy” phù hợp lời nói nhã nhặn.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Không một ai trong chúng tôi
  rationale: Trong cấu trúc phủ định mang nghĩa phân phối, cụm này chỉ rằng không một thành viên nào là ngoại lệ.
- source_word: אֶת־קִבְרוֹ
  choice: phần mộ của mình
  rationale: Đại từ số ít được hiểu theo nghĩa phân phối, nói về phần mộ thuộc mỗi người; “của mình” tự nhiên trong tiếng Việt.
- source_word: לֹא יִכְלֶה מִמְּךָ
  choice: sẽ từ chối ngài
  rationale: כלא trong văn cảnh mang nghĩa giữ lại hoặc không cho dùng; “từ chối ngài” diễn đạt tự nhiên sự không ngăn cản quyền sử dụng phần mộ.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: khiến ngài không thể chôn người chết của ngài
  rationale: מִן với động từ nguyên mẫu diễn tả sự ngăn cản; cách dịch này làm rõ quan hệ mục đích-kết quả mà vẫn giữ nội dung nguyên ngữ.
theological_decisions:
- issue: Ý nghĩa của cụm נְשִׂיא אֱלֹהִים
  choice: Giữ “một thủ lĩnh của Đức Chúa Trời” trong chính văn
  alternative: “một thủ lĩnh lớn lao” hoặc “một thủ lĩnh quyền thế”
  rationale: Cụm Hê-bơ-rơ có thể nói đến mối liên hệ với Đức Chúa Trời hoặc dùng אֱלֹהִים theo lối tăng cường mức độ. Chính văn giữ sự căng nghĩa; chú thích nêu cách hiểu thành ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; duy trì phép xưng hô kính trọng “ngài”. Dùng “phần mộ/ngôi mộ” phù hợp cuộc thương lượng về nơi mai táng. Không thêm chú thích ở vế cuối vì bản dịch chính đã diễn đạt rõ sắc thái ngăn cản của cấu trúc Hê-bơ-rơ.
