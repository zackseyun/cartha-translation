id: GEN.23.12
reference: Genesis 23:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: vi
  text: Bấy giờ, Áp-ra-ham cúi mình trước dân trong xứ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sấp mình trước dân trong xứ.”'
    reason: Giữ lại khả năng động từ Hê-bơ-rơ mô tả một cử chỉ hạ mình sâu hơn, trong khi chính văn không diễn đạt quá mức độ chắc chắn của ngữ cảnh.
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: cúi mình
  rationale: Động từ diễn tả hành động hạ mình để bày tỏ sự kính trọng. Trong bối cảnh thương lượng với dân địa phương, “cúi mình” tự nhiên và không hàm ý thờ phượng.
- source_word: לִפְנֵי
  choice: trước
  rationale: Cụm giới từ có nghĩa là “trước mặt” hoặc “trong sự hiện diện của”; “trước” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: עַם הָאָרֶץ
  choice: dân trong xứ
  rationale: Cụm từ chỉ cộng đồng cư dân địa phương đang chứng kiến giao dịch; cách dịch này bảo toàn cả ý “dân” lẫn phạm vi địa phương của “xứ”.
- source_word: וַ
  choice: Bấy giờ
  rationale: Waw đi với dạng wayyiqtol thúc đẩy mạch kể chuyện. “Bấy giờ” thể hiện trình tự trong văn kể trang trọng, tự nhiên.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cúi mình” phù hợp với cử chỉ kính trọng trong một cuộc thương lượng công khai; “dân trong xứ” giữ sắc thái tập thể và địa phương của nguyên văn.
