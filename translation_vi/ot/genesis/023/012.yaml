  source_fidelity: Bản dịch truyền đạt đúng mạch tự sự của wayyiqtol (“Bấy giờ”), chủ thể Áp-ra-ham, cử chỉ kính trọng של וַיִּשְׁתַּחוּ (“cúi mình”), và đối tượng “trước dân trong xứ” (לִפְנֵי עַם הָאָרֶץ). Không thêm hàm ý thờ phượng hoặc chi tiết không có trong nguyên văn.
  naturalness: “Bấy giờ, Áp-ra-ham cúi mình trước dân trong xứ” là câu tiếng Việt hiện đại, trang trọng và tự nhiên trong văn mạch Kinh Thánh. Cách dùng “cúi mình” phù hợp với ngữ cảnh thương lượng công khai.
  terminology: Tên riêng “Áp-ra-ham” phù hợp thông lệ Kinh Thánh tiếng Việt. “Dân trong xứ” diễn đạt tốt cụm chỉ cư dân địa phương; “cúi mình” giữ sắc thái kính trọng mà không cường điệu thành thờ phượng.
