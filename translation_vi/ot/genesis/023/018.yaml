  rationale: Bản sửa thay “cơ nghiệp” bằng “tài sản” để phản ánh chính xác thuật ngữ pháp lý מִקְנָה; thay “ra vào” bằng “đi vào” theo phân từ בָּאֵי; và điều chỉnh chú thích về בני־חת theo cách gọi dân tộc tương đương thông dụng. Cấu trúc mệnh đề và tính công khai của việc chuyển nhượng vẫn được giữ nguyên.
