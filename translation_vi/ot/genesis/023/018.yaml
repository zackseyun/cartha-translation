base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/018.yaml
  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: vi
  text: cho Áp-ra-ham làm tài sản, trước mặt con cháu Hếch[a], trước mặt tất cả những người đi vào cổng thành của ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người Hê-tít”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: thuộc về Áp-ra-ham
  rationale: Giới từ לְ đánh dấu người nhận trong việc chuyển nhượng; cách dịch này diễn đạt tự nhiên kết quả pháp lý của giao dịch.
- source_word: לְמִקְנָה
  choice: làm cơ nghiệp
  rationale: מִקְנָה chỉ tài sản đã được mua và thuộc quyền sở hữu; “cơ nghiệp” vừa trang trọng vừa phù hợp ngữ cảnh pháp lý.
- source_word: לְעֵינֵי
  choice: trước mắt
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, đồng thời biểu thị việc diễn ra công khai trước các nhân chứng.
- source_word: בְנֵי חֵת
  choice: con cháu Hếch
  rationale: Phản ánh sát nghĩa danh xưng thân tộc–dân tộc “các con của Hếch”; “người Hếch” là cách tương đương theo ngữ cảnh.
- source_word: בְּכֹל בָּאֵי
  choice: trước tất cả những người ra vào
  rationale: בְּכֹל giới thiệu toàn thể nhân chứng; phân từ בָּאֵי có nghĩa sát là “những người đi vào/đến”, nhưng trong thành ngữ về cổng thành, “ra vào” diễn đạt tự nhiên nhóm người lui tới nơi công cộng ấy.
- source_word: שַׁעַר עִירוֹ
  choice: cổng thành của ông
  rationale: Giữ quan hệ sở hữu của עִירוֹ và bối cảnh hành chính–pháp lý tại cổng thành.
theological_decisions:
- issue: Bản sắc của בְנֵי חֵת
  choice: con cháu Hếch
  alternative: người Hếch
  rationale: Không đồng nhất hóa tuyệt đối danh xưng nguyên văn với một nhãn dân tộc hiện đại; bản dịch chính giữ cấu trúc gia tộc, còn chú thích nêu cách gọi dân tộc tương đương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu này tiếp nối danh sách tài sản cùng việc chuyển quyền trong câu trước, nên giữ dạng mệnh đề thay vì bổ sung chủ ngữ hoặc động từ không có trong nguyên văn.
