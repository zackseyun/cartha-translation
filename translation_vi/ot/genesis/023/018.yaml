    issue: “làm cơ nghiệp” cho לְמִקְנָה
    rationale: מִקְנָה chỉ vật sở hữu/tài sản đã mua được trong thủ tục chuyển nhượng. “Cơ nghiệp” có thể gợi tài sản thừa kế hoặc sự nghiệp, làm lệch sắc thái pháp lý của câu.
  - severity: low
    issue: “những người ra vào” cho בָּאֵי
    rationale: Phân từ này chỉ những người đi vào/đến; “ra vào” thêm một chiều hành động không có trong nguyên văn.
  - severity: low
    issue: Chú thích “người Hếch”
    rationale: Nếu nêu cách tương đương theo sắc tộc, cách gọi Việt ngữ quen dùng là “người Hê-tít”; “người Hếch” chỉ là cách chuyển trực tiếp tên Heth và không diễn đạt rõ lựa chọn thay thế được chú thích.
