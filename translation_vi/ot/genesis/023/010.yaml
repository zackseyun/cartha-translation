  text: וְ/עֶפְר֥וֹן יֹשֵׁ֖ב בְּ/ת֣וֹךְ בְּנֵי חֵ֑ת וַ/יַּעַן֩ עֶפְר֨וֹן הַ/חִתִּ֤י אֶת אַבְרָהָם֙ בְּ/אָזְנֵ֣י בְנֵי חֵ֔ת לְ/כֹ֛ל בָּאֵ֥י שַֽׁעַר עִיר֖/וֹ לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: vi
  text: 'Ép-rôn đang ngồi giữa con cháu Hết[a]. Ép-rôn, người Hê-tít, đáp lời Áp-ra-ham cho con cháu Hết nghe, trước mặt mọi người ra vào cổng thành của thành ông[b], rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “người Hê-tít” ở cả hai chỗ có cụm “con cháu Hết”; nguyên văn Hê-bơ-rơ sát nghĩa hơn là “các con trai của Hết”.
    reason: lexical_alternative
  - marker: b
    text: “Cổng thành” là nơi người ta công khai giải quyết các vấn đề pháp lý và thương mại trước mặt những người làm chứng.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: đang ngồi
  rationale: Phân từ diễn tả tư thế hoặc trạng thái đang tiếp diễn của Ép-rôn trong cảnh này; cách dịch này tự nhiên và không thêm một từ chỉ thời gian vốn không có trong nguyên văn.
- source_word: בְּתוֹךְ
  choice: giữa
  rationale: Trong bối cảnh hội họp công khai, từ này diễn tả Ép-rôn hiện diện giữa cộng đồng đang tụ họp.
- source_word: בְּנֵי חֵת
  choice: con cháu Hếch
  rationale: Giữ tương đối sát thành ngữ Hê-bơ-rơ nghĩa đen là “các con trai của Hếch”, đồng thời dùng “con cháu” cho tự nhiên hơn trong tiếng Việt khi nói về một nhóm hậu duệ hoặc thị tộc.
- source_word: וַיַּעַן
  choice: đáp lời
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho động từ ענה khi giới thiệu lời đáp trong đối thoại.
- source_word: הַחִתִּי
  choice: người Hê-tít
  rationale: Dịch danh xưng sắc tộc xác định, đồng thời phân biệt nó với cách gọi theo dòng dõi “con cháu Hếch” trong cùng câu.
- source_word: בְּאָזְנֵי
  choice: để ... nghe thấy
  rationale: Chuyển thành ngữ nghĩa đen “trong tai” sang cách nói tiếng Việt tự nhiên, vẫn giữ ý lời đáp được công khai nói ra trong tầm nghe của cộng đồng.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: trước mặt tất cả những người đi vào cổng thành của ông
  rationale: Giữ ý về những người hiện diện làm chứng công khai tại cổng thành và bảo lưu đại từ sở hữu số ít của nguyên văn.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Dẫn trực tiếp vào lời nói ở câu tiếp theo một cách gọn và tự nhiên trong tiếng Việt.
