translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ sự lặp lại tên Ép-rôn và phân biệt cách gọi theo dòng dõi “con cháu Hếch” với danh xưng sắc tộc “người Hê-tít”. Dấu hai chấm cho thấy lời nói trực tiếp tiếp tục ở câu sau.
