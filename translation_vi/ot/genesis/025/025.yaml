base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: vi
  text: Đứa bé ra trước có sắc đỏ[a], toàn thân trông như một chiếc áo choàng bằng lông[b], và họ đặt tên nó là Ê-sau.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đỏ hồng” hoặc “đỏ”; tính từ Hê-bơ-rơ mô tả một diện mạo có sắc đỏ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “như một áo choàng lông” hoặc “như một tấm áo bằng lông.” Tiếng Hê-bơ-rơ dùng phép so sánh với “áo choàng” và “lông.”
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hê-bơ-rơ: “họ gọi tên nó là Ê-sau,” một công thức đặt tên thông dụng; nghĩa là, “họ đặt tên nó là Ê-sau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ra
  rationale: Trong ngữ cảnh sinh nở, động từ diễn tả đứa trẻ ra khỏi lòng mẹ; “ra” tự nhiên, cụ thể và không thêm ý.
- source_word: הָרִאשׁוֹן
  choice: đứa ra trước
  rationale: Chỉ người con được sinh ra trước trong cặp song sinh; cách diễn đạt này tự nhiên hơn lối dịch cứng “đứa thứ nhất”.
- source_word: אַדְמוֹנִי
  choice: có sắc đỏ
  rationale: Tính từ Hê-bơ-rơ mô tả diện mạo hoặc nước da đỏ/đỏ hồng. “Có sắc đỏ” giữ được độ rộng nghĩa và không xác định quá mức nguyên nhân của màu sắc ấy.
- source_word: כֻּלּוֹ
  choice: toàn thân
  rationale: Nêu rõ đặc điểm được nói đến bao phủ cả cơ thể đứa trẻ.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: như một chiếc áo choàng bằng lông
  rationale: Giữ nguyên phép so sánh sống động giữa toàn thân đứa trẻ và một áo choàng có lông; không diễn giải đơn thuần thành “đầy lông”.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: người ta đặt tên nó là
  rationale: Thể hiện tự nhiên công thức đặt tên trong tiếng Hê-bơ-rơ. Chủ ngữ số nhiều không được xác định, vì vậy “người ta” tránh gán việc đặt tên riêng cho cha hoặc mẹ.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
