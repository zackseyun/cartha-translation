revisions:
- from: Còn các con trai của những người vợ lẽ của mình, Áp-ra-ham ban quà cho họ. Khi vẫn còn sống, ông sai họ đi xa Y-sác, con trai mình, về phía đông, đến xứ phương Đông.
  to: Còn các con trai của các vợ lẽ của Áp-ra-ham, ông tặng quà cho họ; khi còn sống, ông sai họ đi khỏi Y-sác, con trai mình, về phía đông, đến xứ phương Đông.
  rationale: Sửa lối diễn đạt để tự nhiên hơn và thay “đi xa” bằng “đi khỏi,” phản ánh chính xác hơn sự tách khỏi Y-sác mà không thêm ý về khoảng cách. Cấu trúc hai vế vẫn giữ rõ thời điểm Áp-ra-ham thực hiện hành động trước khi qua đời và giữ cả hướng đi lẫn cụm “xứ phương Đông” của nguyên văn.
