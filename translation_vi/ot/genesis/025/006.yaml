  terminology: “Vợ lẽ,” “Áp-ra-ham,” “Y-sác,” và “xứ phương Đông” phù hợp văn phong Kinh Thánh Việt hiện đại. Giữ số nhiều “các vợ lẽ” theo tiếng Hê-bơ-rơ, không dung hòa với các đoạn khác.
