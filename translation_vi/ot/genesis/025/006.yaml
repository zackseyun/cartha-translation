base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: vi
  text: Còn các con trai của các vợ lẽ của Áp-ra-ham, ông tặng quà cho họ; khi còn sống, ông sai họ đi khỏi Y-sác, con trai mình, về phía đông, đến xứ phương Đông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Còn các con trai của
  rationale: Liên từ mở ra sự tương phản với câu trước, nơi Y-sác được nhận toàn bộ gia sản; “Còn” diễn đạt tự nhiên sự chuyển ý này và vẫn giữ quan hệ hướng đến các con trai.
- source_word: הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: những người vợ lẽ của mình
  rationale: “Vợ lẽ” là cách gọi ngắn gọn, quen thuộc cho người nữ có địa vị hôn nhân được thừa nhận nhưng thấp hơn vợ chính; “của mình” quy chiếu tự nhiên về Áp-ra-ham, chủ ngữ ngay sau đó.
- source_word: נָתַן ... מַתָּנֹת
  choice: ban quà cho họ
  rationale: Diễn đạt trực tiếp hành động trao tặng trong bối cảnh phân chia tài sản. “Ban quà” giữ sắc thái trang trọng vừa phải, còn “cho họ” làm rõ bổ ngữ gián tiếp vốn được nêu trước trong tiếng Hê-bơ-rơ.
- source_word: וַיְשַׁלְּחֵם מֵעַל יִצְחָק בְּנוֹ
  choice: ông sai họ đi xa Y-sác, con trai mình
  rationale: Động từ chỉ việc sai đi, còn מֵעַל nhấn mạnh sự tách khỏi Y-sác. “Đi xa” truyền đạt cả chuyển động lẫn sự phân cách mà không thêm lý do không có trong bản nguồn.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: Khi vẫn còn sống
  rationale: Giữ rõ ý Áp-ra-ham thực hiện việc này trước khi qua đời và dùng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: về phía đông, đến xứ phương Đông
  rationale: “Về phía đông” giữ hướng chuyển động của קֵדְמָה; “xứ phương Đông” phản ánh cách gọi vùng đất ở phía đông trong nguyên văn mà không xác định quá mức một địa danh cụ thể.
theological_decisions:
- issue: Số nhiều “những người vợ lẽ” trong nguyên văn
  choice: Giữ nguyên số nhiều, không đồng nhất hoặc giải thích các người nữ này
  alternative: Hài hòa với các trình thuật khác bằng cách chỉ nêu tên Ha-ga hoặc Kê-tu-ra
  rationale: Câu Hê-bơ-rơ dùng danh từ số nhiều. Bản dịch giữ nguyên dữ kiện và sự căng thẳng nội tại của văn bản, không áp đặt một cách dung hòa ngoài câu.
- issue: Mục đích đưa các con trai đi xa Y-sác
  choice: Không thêm mục đích hoặc nhận định đạo đức
  alternative: Diễn giải rằng Áp-ra-ham làm vậy để bảo vệ quyền thừa kế độc quyền của Y-sác
  rationale: Ngữ cảnh có liên hệ đến quyền thừa kế, nhưng câu này chỉ thuật lại việc ban quà và sai họ đi; bản dịch không biến hàm ý ngữ cảnh thành lời khẳng định minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc được chia thành hai câu để tránh câu ghép nặng nề trong tiếng Việt, đồng thời giữ nổi bật sự tương phản giữa phần dành cho Y-sác và quà dành cho các con của những người vợ lẽ. Tên riêng dùng dạng quen thuộc “Áp-ra-ham” và “Y-sác”.
