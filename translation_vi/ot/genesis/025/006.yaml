  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: thế tương phản với câu trước, các con trai của các vợ lẽ, việc Áp-ra-ham cho quà, sai họ tách khỏi Y-sác khi ông còn sống, và hướng đi về phía đông đến xứ phương Đông. Tuy nhiên, “đi xa Y-sác” thêm sắc thái khoảng cách đáng kể hơn điều nguyên văn khẳng định; מֵעַל ở đây chỉ sự rời/tách khỏi Y-sác.'
