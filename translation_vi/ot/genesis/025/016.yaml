base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: vi
  text: 'Đây là các con trai của Ích-ma-ên, và đây là tên của họ, theo các khu định cư và các trại của họ[a]: mười hai thủ lĩnh[b] theo các dân tộc của họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Khu định cư” cũng có thể dịch là “làng mạc”; “trại” cũng có thể dịch là “doanh trại” hoặc “nơi ở có phòng thủ”. Cả cụm cũng có thể hiểu là “trong các khu định cư và các trại của họ”.
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Cũng có thể dịch là “mười hai người đứng đầu”, “mười hai tù trưởng”, hoặc “mười hai thủ lĩnh cấp cao”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם בְּנֵי יִשְׁמָעֵאל
  choice: Đây là các con trai của Ích-ma-ên
  rationale: Giữ nghĩa trực tiếp của בְּנֵי là các con trai, vì ngữ cảnh vừa liệt kê các con trai trực hệ của Ích-ma-ên; cấu trúc chỉ định được diễn đạt tự nhiên trong tiếng Việt bằng “Đây là”.
- source_word: וְאֵלֶּה שְׁמֹתָם
  choice: và đây là tên của họ
  rationale: Chuyển sát cấu trúc Hê-bơ-rơ, đồng thời giữ cách trình bày trang trọng, rõ ràng của một bản tổng kết gia phả.
- source_word: בְּחַצְרֵיהֶם
  choice: theo các làng mạc của họ
  rationale: חָצֵר có thể chỉ làng mạc hoặc khu định cư. “Làng mạc” dễ hiểu và phù hợp với bối cảnh địa lý-bộ tộc; “theo” thể hiện khả năng các tên được liệt kê hoặc được biết đến theo nơi cư trú, thay vì khẳng định đơn thuần rằng các cá nhân sống ở đó.
- source_word: וּבְטִירֹתָם
  choice: và trại của họ
  rationale: טִירָה có thể chỉ trại, doanh trại hoặc nơi cư trú có phòng thủ. “Trại” giữ được sắc thái cư trú bán du mục mà không thêm mức độ kiên cố không chắc chắn.
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: mười hai thủ lĩnh
  rationale: נָשִׂיא chỉ người đứng đầu hay lãnh đạo một cộng đồng. “Thủ lĩnh” phù hợp với bối cảnh bộ tộc và ít gợi một chế độ quân chủ cha truyền con nối hơn “hoàng tử”.
- source_word: לְאֻמֹּתָם
  choice: theo các dân tộc của họ
  rationale: אֻמָּה chỉ một dân hay cộng đồng dân tộc. “Các dân tộc” gần với phạm vi nghĩa của từ nguồn và không thu hẹp thành “chi tộc” hoặc “gia tộc”.
theological_decisions:
- issue: Địa vị của mười hai người con trai Ích-ma-ên
  choice: thủ lĩnh
  alternative: hoàng tử
  rationale: Từ Hê-bơ-rơ mô tả địa vị lãnh đạo trong các cộng đồng hậu duệ của họ, nhưng không nhất thiết xác định họ là hoàng tử theo nghĩa quân chủ; vì vậy “thủ lĩnh” bảo toàn ý nghĩa mà không thêm một thiết chế chính trị.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng tên riêng quen thuộc “Ích-ma-ên”. Cấu trúc “theo các làng mạc và trại” giữ sự mơ hồ của giới từ בְּ giữa nghĩa phân loại “theo” và nghĩa nơi chốn “trong”; cách hiểu nơi chốn được nêu ở chú thích.
