  source_fidelity: 'Bản dịch giữ đúng cấu trúc tổng kết và các ý chính của tiếng Hê-bơ-rơ: các con trai Ích-ma-ên, tên của họ, các nơi cư trú, mười hai người lãnh đạo, và các dân của họ. Tuy nhiên, “làng mạc” thu hẹp חַצְרֵיהֶם hơn cần thiết; “khu định cư” bao quát hơn. Cụm giới từ בְּ có thể được hiểu theo nghĩa phân loại (“theo”) hoặc nơi chốn (“trong”); bản văn chính có thể giữ cách hiểu phân loại mà không quyết đoán quá mức.'
