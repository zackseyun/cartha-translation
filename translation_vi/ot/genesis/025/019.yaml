- from: 'Đây là dòng dõi của Y-sác[a], con trai Áp-ra-ham: Áp-ra-ham sinh Y-sác.'
  to: 'Đây là gia phả của Y-sác[a], con trai Áp-ra-ham: Áp-ra-ham sinh Y-sác.'
  rationale: Thay “dòng dõi” bằng “gia phả” để tránh giới hạn tiêu đề תּוֹלְדוֹת vào nghĩa hậu duệ; giữ chú thích để nêu các cách hiểu chính đáng khác. Đồng thời chuẩn hóa cách diễn đạt chú thích sang tiếng Việt hiện đại.
