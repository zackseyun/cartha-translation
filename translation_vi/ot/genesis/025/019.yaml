  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: vi
  text: 'Đây là gia phả của Y-sác[a], con trai Áp-ra-ham: Áp-ra-ham sinh Y-sác.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bản tường thuật” hoặc “gia hệ”. Từ Hê-bơ-rơ toledot là một thuật ngữ tiêu đề được lặp lại trong sách Sáng Thế Ký.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Cụm liên kết và chỉ định mở đầu một phần mới. Tiếng Việt tự nhiên không cần dịch riêng liên từ ו tại đây.
- source_word: תּוֹלְדֹת
  choice: dòng dõi
  rationale: Trong Sáng Thế Ký, từ này là thuật ngữ tiêu đề lặp lại, chỉ điều phát xuất từ một người hoặc gia hệ; “dòng dõi” giữ được sắc thái gia phả mà không giới hạn hoàn toàn vào danh sách hậu duệ.
- source_word: יִצְחָק
  choice: Y-sác
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: בֶּן אַבְרָהָם
  choice: con trai Áp-ra-ham
  rationale: Dịch trực tiếp quan hệ huyết thống được nêu trong cấu trúc sở hữu Hê-bơ-rơ.
- source_word: הוֹלִיד
  choice: sinh
  rationale: Ở thể Hiphil, động từ mang nghĩa sinh ra/làm cha của. “Sinh” là cách diễn đạt gia phả ngắn gọn, tự nhiên trong tiếng Việt và phù hợp khi chủ ngữ là người cha.
- source_word: אֶת יִצְחָק
  choice: Y-sác
  rationale: Dấu chỉ định tân ngữ אֶת không được dịch riêng; tên riêng được thể hiện làm tân ngữ trực tiếp.
theological_decisions:
- issue: Cách dịch công thức תּוֹלְדֹת trong Sáng Thế Ký
  choice: dòng dõi
  alternative: ký thuật; gia phả; các thế hệ
  rationale: “Dòng dõi” bảo tồn chức năng gia hệ và tính chất tiêu đề của công thức, đồng thời chú thích các khả năng rộng hơn để không khép nghĩa vào riêng danh sách hậu duệ hay riêng một bản ký thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế giữ tính chất tiêu đề gia phả cùng lời xác nhận quan hệ cha con; dấu hai chấm phản ánh sự chuyển từ tiêu đề sang mệnh đề giải thích.
