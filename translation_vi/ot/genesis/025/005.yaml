  text: Abraham gave all that he had to Isaac[a].
translation:
  language: vi
  text: Áp-ra-ham trao cho Y-sác tất cả những gì ông có.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tất cả những gì thuộc về ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: trao
  rationale: Động từ נתן có nghĩa cơ bản là “cho, trao”. Trong mạch kể chuyện, “trao” là cách diễn đạt tự nhiên, trang trọng và có thể bao hàm việc chuyển giao tài sản.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu đánh dấu tân ngữ xác định trong tiếng Hê-bơ-rơ; chức năng của nó được thể hiện qua cú pháp tiếng Việt.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tất cả những gì mình có
  rationale: Cụm từ có nghĩa sát là “tất cả những gì thuộc về ông”. Cách dịch này tự nhiên trong tiếng Việt, giữ trọn phạm vi tài sản và dùng “mình” để quy chiếu rõ về chủ ngữ Áp-ra-ham.
- source_word: לְיִצְחָק
  choice: cho Y-sác
  rationale: Giới từ לְ đánh dấu người nhận; “cho Y-sác” là cách diễn đạt rõ ràng và tự nhiên trong tiếng Việt.
