base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: vi
  text: Đây là tên các con trai của Ích-ma-ên, theo tên của họ, theo dòng dõi của họ:[a] con trưởng của Ích-ma-ên là Nê-bai-ốt, rồi Kê-đa, Át-bê-ên và Míp-sam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “theo các thế hệ của họ” hoặc “theo gia phả của họ.” Từ Hê-bơ-rơ có thể chỉ các thế hệ hay những dòng hậu duệ trong một gia phả.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Mở đầu danh sách mới một cách tự nhiên trong tiếng Việt; liên từ וְ được thể hiện qua sự tiếp nối của văn mạch mà không cần dùng từ “và” gượng ép ở đầu câu.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: tên các con trai của Ích-ma-ên
  rationale: Giữ cấu trúc gia phả rõ ràng và dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: בִּשְׁמֹתָם לְתוֹלְדֹתָם
  choice: được kể theo tên và dòng dõi của họ
  rationale: Diễn đạt tự nhiên công thức Hê-bơ-rơ, đồng thời giữ cả ý liệt kê theo tên lẫn sự sắp xếp theo các dòng hậu duệ.
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: con trưởng của Ích-ma-ên
  rationale: “Con trưởng” là cách nói tiếng Việt tự nhiên, chính xác cho người con đầu lòng trong ngữ cảnh gia phả.
- source_word: נְבָיֹת
  choice: Nê-bai-ốt
  rationale: Phiên âm tiếng Việt gần với tên Hê-bơ-rơ và phù hợp lối ghi tên Kinh Thánh phổ biến.
- source_word: קֵדָר
  choice: Kê-đa
  rationale: Phiên âm tiếng Việt rõ và gần với âm Hê-bơ-rơ.
- source_word: אַדְבְּאֵל
  choice: Át-bê-ên
  rationale: Phiên âm tiếng Việt phản ánh các thành tố của tên Hê-bơ-rơ; âm cuối được Việt hóa tự nhiên.
- source_word: מִבְשָׂם
  choice: Míp-sam
  rationale: Phiên âm tiếng Việt gần với cách đọc tên Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ sắc thái công thức của một bản gia phả nhưng tránh lối dịch từng chữ thiếu tự nhiên. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
