  to: Đây là tên các con trai của Ích-ma-ên, theo tên của họ, theo dòng dõi của họ:[a] con trưởng của Ích-ma-ên là Nê-bai-ốt, rồi Kê-đa, Át-bê-ên và Míp-sam.
