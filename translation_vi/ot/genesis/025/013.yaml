  source_fidelity: 'Bản nháp truyền đạt đúng nội dung gia phả: đây là danh sách các con trai của Ích-ma-ên; Nê-bai-ốt là con trưởng; và ba tên kế tiếp được liệt kê. Tuy nhiên, cụm “được kể theo tên và dòng dõi của họ” gộp hai cụm song song בִּשְׁמֹתָם לְתוֹלְדֹתָם và thêm sắc thái bị động không có trong nguyên văn. Cách giữ hai cụm song song sẽ trung thành và minh bạch hơn.'
