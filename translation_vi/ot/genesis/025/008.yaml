source:
  edition: WLC
  text: וַ/יִּגְוַ֨ע וַ/יָּ֧מָת אַבְרָהָ֛ם בְּ/שֵׂיבָ֥ה טוֹבָ֖ה זָקֵ֣ן וְ/שָׂבֵ֑עַ וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: vi
  text: Áp-ra-ham trút hơi thở cuối cùng và chết, hưởng tuổi già tốt đẹp, tuổi cao và mãn nguyện[a]; rồi ông được quy tụ về cùng dân mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này cũng có thể dịch là “no đủ”, “thỏa mãn” hoặc “đầy đủ”. Nguyên văn nói “già và no thỏa”; không có cụm “ngày tháng”.
    reason: lexical_alternative
  - marker: b
    text: “Được quy tụ về cùng dân mình” là một công thức truyền thống trong tiếng Hê-bơ-rơ nói về cái chết. Cụm từ có thể gợi đến việc đoàn tụ với người thân đã khuất, nhưng không nói rõ điều đó diễn ra theo cách nào.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: trút hơi thở cuối cùng
  rationale: Diễn đạt tự nhiên sắc thái tắt thở của גוע, đồng thời giữ nó phân biệt với động từ “qua đời” ngay sau đó.
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Tương đương rõ ràng, trang trọng và trực tiếp với động từ מות trong lời thuật về cái chết.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: khi tuổi già tốt đẹp
  rationale: Giữ cả ý tuổi già và phẩm chất tích cực của טוֹבָה; “khi” diễn đạt tự nhiên hoàn cảnh lúc ông qua đời.
- source_word: זָקֵן
  choice: tuổi cao
  rationale: Phản ánh riêng tính từ “già” trong chuỗi mô tả của tiếng Hê-bơ-rơ mà không lặp vụng về “già” trong tiếng Việt.
- source_word: וְשָׂבֵעַ
  choice: và mãn nguyện
  rationale: שָׂבֵעַ có nghĩa là no đủ, thỏa mãn; “mãn nguyện” tự nhiên trong ngữ cảnh một đời sống đã đạt đến sự viên mãn, đồng thời không thêm “ngày tháng” vốn không có trong nguyên văn.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: rồi ông được quy tụ về với dân mình
  rationale: Giữ thể bị động và công thức nói về cái chết, đồng thời bảo toàn sự mơ hồ về việc chôn cất hay đoàn tụ với người thân đã khuất.
- source_word: עַמָּיו
  choice: dân mình
  rationale: Là cách dịch sát của עם kèm hậu tố sở hữu, không thu hẹp nghĩa thành riêng “tổ tiên” hay “họ hàng”.
theological_decisions:
- issue: Ý nghĩa của công thức “được quy tụ về với dân mình”
  choice: Giữ nguyên công thức giàu tính hình tượng mà không xác định chính xác cơ chế hay trạng thái sau khi chết.
  alternative: Diễn giải thành được chôn trong mộ gia tộc, hoặc đoàn tụ có ý thức với tổ tiên sau khi chết.
  rationale: Câu Hê-bơ-rơ có thể gợi đến sự đoàn tụ với người thân trong cái chết, nhưng tự nó không buộc phải hiểu riêng theo nghĩa chôn cất hay một giáo lý cụ thể về đời sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp liệt kê của nguyên văn nhưng dùng “tuổi cao” để tránh lặp từ thiếu tự nhiên; “quy tụ về với dân mình” bảo tồn sắc thái Kinh Thánh và sự mơ hồ có chủ ý.
