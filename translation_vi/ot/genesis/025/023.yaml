base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với bà: “Hai dân tộc đang ở trong bụng bà; hai dân sẽ phân rẽ từ trong bụng bà. Dân này sẽ mạnh hơn dân kia, và người anh sẽ phục vụ người em[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người lớn hơn sẽ phục vụ người nhỏ hơn.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: שְׁנֵי גיים
  choice: hai dân tộc
  rationale: גוי ở đây chỉ hai cộng đồng dân tộc sẽ phát sinh từ hai người con.
- source_word: בְּבִטְנֵךְ
  choice: trong lòng con
  rationale: Trong ngữ cảnh mang thai, cách nói này tự nhiên trong tiếng Việt và chỉ tử cung mà không thô cứng.
- source_word: שְׁנֵי לְאֻמִּים
  choice: hai dân
  rationale: Phân biệt nhẹ với גיים nhưng vẫn giữ phép song đối đồng nghĩa của câu Hê-bơ-rơ.
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: sẽ từ trong con mà phân rẽ
  rationale: Giữ ý xuất phát từ thân thể người mẹ và sắc thái hai cộng đồng tách ra, trở nên khác biệt.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: dân này sẽ mạnh hơn dân kia
  rationale: Diễn đạt tự nhiên cấu trúc so sánh và ý một dân có sức mạnh vượt dân còn lại.
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: người anh sẽ phục vụ người em
  rationale: Trong ngữ cảnh hai anh em sinh đôi, רַב và צָעִיר được hiểu tự nhiên là người lớn tuổi hơn và người nhỏ tuổi hơn; động từ עבד vẫn được dịch rộng là “phục vụ”.
theological_decisions:
- issue: Cách hiểu וְרַב יַעֲבֹד צָעִיר
  choice: người anh sẽ phục vụ người em
  alternative: người lớn sẽ phục vụ người nhỏ
  rationale: Ngữ cảnh song sinh ủng hộ quan hệ anh–em, nhưng nguyên văn dùng các tính từ có thể mang nghĩa rộng hơn là “lớn” và “nhỏ”; ghi chú bảo tồn độ rộng nghĩa ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” vì lời Đức Giê-hô-va trực tiếp phán với người phụ nữ; giữ nhịp song đối của lời tiên báo. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan.
