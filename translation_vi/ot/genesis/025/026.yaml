base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: vi
  text: Sau đó, người em của Ê-sau lọt lòng, tay cậu đang nắm gót chân Ê-sau; vì thế, người ta đặt tên cậu là Gia-cốp.[a] Y-sác sáu mươi tuổi khi họ chào đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Gia-cốp trong tiếng Hê-bơ-rơ gợi liên hệ với từ chỉ “gót chân” và về sau còn được liên hệ với ý “chiếm chỗ”, phù hợp với chi tiết cậu nắm gót chân Ê-sau.
    reason: Giải thích lối chơi chữ trong nguyên ngữ mà bản dịch tên riêng không thể hiện được.
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sau đó
  rationale: Diễn đạt tự nhiên trình tự thời gian ngay sau việc Ê-sau chào đời.
- source_word: יָצָא אָחִיו
  choice: người em của Ê-sau lọt lòng
  rationale: יָצָא mô tả đứa trẻ ra khỏi lòng mẹ; “lọt lòng” giữ được hình ảnh sinh nở sống động hơn “được sinh ra”. אָחִיו chỉ người anh em của Ê-sau; ngữ cảnh sinh sau cho phép tiếng Việt dùng “người em” một cách tự nhiên.
- source_word: וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו
  choice: tay nắm lấy gót chân Ê-sau
  rationale: Giữ hành động đang đi kèm lúc đứa trẻ lọt lòng và dịch trực tiếp עָקֵב là “gót chân”.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: vì thế, người ta đặt tên cậu là
  rationale: Chủ thể của động từ số ít không được nêu rõ. Cách diễn đạt phiếm chỉ “người ta” tránh tự ý xác định người đặt tên; “vì thế” thể hiện mối liên hệ kể chuyện giữa việc nắm gót chân và tên gọi.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, đồng thời chú thích mối liên hệ âm nghĩa trong tiếng Hê-bơ-rơ.
- source_word: וְיִצְחָק בֶּן שִׁשִּׁים שָׁנָה
  choice: Y-sác được sáu mươi tuổi
  rationale: Diễn đạt thành ngữ tuổi tác Hê-bơ-rơ bằng tiếng Việt hiện đại, tự nhiên.
- source_word: בְּלֶדֶת אֹתָם
  choice: khi hai con chào đời
  rationale: Cụm nguyên ngữ xác định thời điểm hai đứa trẻ được sinh ra mà không nêu rõ chủ thể sinh; “hai con” phù hợp quan hệ với Y-sác và số nhiều trong ngữ cảnh song sinh.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng hiện đại. “Lọt lòng” giữ hình ảnh cụ thể của nguyên ngữ; dấu chấm phẩy giúp câu dài rõ nhịp. Các tên riêng dùng dạng quen thuộc trong Kinh Thánh tiếng Việt: Ê-sau, Gia-cốp, Y-sác.'
