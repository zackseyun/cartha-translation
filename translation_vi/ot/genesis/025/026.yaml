    rationale: Nên dùng “gợi liên hệ với” để diễn đạt thận trọng hơn mối chơi chữ/liên hệ từ vựng giữa tên Gia-cốp và “gót chân”, đồng thời vẫn bảo lưu liên hệ về sau với ý chiếm chỗ.
