    rationale: Cách nói này kém tự nhiên trong tiếng Việt hiện đại đối với tuổi của một nhân vật ở thời điểm được thuật lại. Thành ngữ tuổi tác Hê-bơ-rơ בֶּן־שִׁשִּׁים שָׁנָה được diễn đạt tự nhiên là “Y-sác sáu mươi tuổi”.
