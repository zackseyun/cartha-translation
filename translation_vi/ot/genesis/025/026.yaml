- from: Sau đó, người em của Ê-sau lọt lòng, tay nắm lấy gót chân Ê-sau; vì thế, người ta đặt tên cậu là Gia-cốp.[a] Y-sác được sáu mươi tuổi khi hai con chào đời.
  to: Sau đó, người em của Ê-sau lọt lòng, tay cậu đang nắm gót chân Ê-sau; vì thế, người ta đặt tên cậu là Gia-cốp.[a] Y-sác sáu mươi tuổi khi họ chào đời.
  rationale: Chỉnh cách nói tuổi tác cho tự nhiên trong tiếng Việt hiện đại, làm rõ sắc thái phân từ của hành động nắm gót, và diễn đạt chú thích từ nguyên một cách thận trọng hơn. Không thay đổi nội dung hay thêm một chủ thể cụ thể cho hành động đặt tên.
