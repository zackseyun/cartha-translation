  text: וַ/יֹּ֧סֶף אַבְרָהָ֛ם וַ/יִּקַּ֥ח אִשָּׁ֖ה וּ/שְׁמָ֥/הּ קְטוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/001.yaml
  text: Abraham took another wife[a], and her name was Keturah.
translation:
  language: vi
  text: Áp-ra-ham lại lấy một người vợ[a], tên bà là Kê-tu-ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Áp-ra-ham lấy thêm một người vợ.” Nguyên văn Hê-bơ-rơ dùng lối nói có nghĩa đen là: “Áp-ra-ham thêm và lấy một người vợ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: lại
  rationale: Động từ יסף mang nghĩa thêm vào hoặc tiếp tục; trong kết cấu với וַיִּקַּח, “lại lấy” diễn đạt tự nhiên sắc thái lặp lại/thêm nữa mà không dịch cứng là “thêm và lấy”.
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Khi đi với אִשָּׁה, לקח là thành ngữ Hê-bơ-rơ chỉ việc lấy vợ; “lấy” vừa sát nguồn vừa tự nhiên trong tiếng Việt.
- source_word: אִשָּׁה
  choice: một người vợ
  rationale: Trong kết cấu với לקח, từ này mang nghĩa “vợ,” không chỉ chung một người phụ nữ.
- source_word: וּשְׁמָהּ
  choice: tên bà là
  rationale: Diễn đạt trực tiếp công thức nêu tên trong nguyên văn bằng tiếng Việt tự nhiên, đồng thời dùng đại từ kính trọng phù hợp khi nói về nhân vật.
- source_word: קְטוּרָה
  choice: Kê-tu-ra
  rationale: Phiên âm tên riêng theo cách đọc rõ ràng, quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Có nên biểu đạt rõ sắc thái thêm nữa/lặp lại của וַיֹּסֶף khi Áp-ra-ham lấy vợ hay không
  choice: Áp-ra-ham lại lấy một người vợ
  alternative: Áp-ra-ham lấy thêm một người vợ
  rationale: “Lại lấy” bảo tồn trực tiếp sắc thái lặp lại của nguyên văn và để ngỏ cách hiểu về quan hệ thời gian cũng như địa vị của Kê-tu-ra, thay vì nhấn mạnh hơn mức cần thiết rằng bà là một người vợ được thêm vào đồng thời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lại lấy” là cách nói tự nhiên trong tiếng Việt, giữ được sắc thái thêm nữa/lặp lại của tiếng Hê-bơ-rơ; chú thích ghi nhận cách dịch thay thế.
