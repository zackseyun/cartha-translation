  terminology: “Đức Chúa Trời,” “ban phước,” “Áp-ra-ham,” và “Y-sác” nhất quán với đăng ký thuật ngữ của bản thảo. Tên địa danh được phiên âm nhất quán giữa thân bài và chú thích.
