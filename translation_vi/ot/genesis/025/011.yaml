  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của Hê-bơ-rơ: thời điểm sau khi Áp-ra-ham chết, Đức Chúa Trời ban phước cho Y-sác, và Y-sác cư trú gần Bê-e La-chai Rô-i. Tuy nhiên, cụm “Y-sác, con trai ông” có thể bị hiểu nhầm là Y-sác là con của Đức Chúa Trời, vì “Đức Chúa Trời” là chủ ngữ gần nhất; nguyên ngữ xác định rõ Y-sác là con của Áp-ra-ham.'
