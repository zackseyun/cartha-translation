base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: vi
  text: Sau khi Áp-ra-ham qua đời, Đức Chúa Trời ban phước cho Y-sác, con trai Áp-ra-ham; và Y-sác sống gần Bê-e La-chai Rô-i.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bê-e La-chai Rô-i là tên một cái giếng, đã được nhắc đến trước đó trong Sáng Thế Ký 16:14.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת אַבְרָהָם
  choice: Sau khi Áp-ra-ham qua đời
  rationale: Cụm mở đầu đánh dấu diễn tiến kế tiếp của câu chuyện. Tiếng Việt tự nhiên không cần dịch וַיְהִי thành một mệnh đề riêng; “Sau khi… qua đời” truyền đạt đầy đủ quan hệ thời gian.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: Đức Chúa Trời ban phước
  rationale: ברך có nghĩa trực tiếp là ban phước. “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt đối với אֱלֹהִים khi chỉ Đức Chúa Trời của câu chuyện.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: cho Y-sác, con trai ông
  rationale: Giữ Y-sác làm đối tượng trực tiếp và nêu rõ quan hệ cha con; “ông” theo ngữ cảnh quy chiếu về Áp-ra-ham.
- source_word: וַיֵּשֶׁב
  choice: sống
  rationale: Ở đây ישב chỉ việc cư trú; “sống” là cách diễn đạt hiện đại và tự nhiên hơn “cư ngụ” hay “trú tại”.
- source_word: עִם
  choice: gần
  rationale: Trước địa danh chỉ một cái giếng, עִם mang nghĩa vị trí gần kề; “gần” tránh nghĩa đồng hành thường có của “với”.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Bê-e La-chai Rô-i
  rationale: Phiên âm địa danh Hê-bơ-rơ thay vì dịch nghĩa, đồng thời giữ các thành tố của tên gọi dễ nhận biết trong tiếng Việt.
theological_decisions:
- issue: Cách dịch אֱלֹהִים trong lời kể về sự ban phước
  choice: Đức Chúa Trời
  alternative: Thiên Chúa
  rationale: Ngữ cảnh dùng אֱלֹהִים như danh xưng của Đức Chúa Trời duy nhất, không hàm ý số nhiều. “Đức Chúa Trời” là cách diễn đạt rõ ràng và trang trọng; lựa chọn này không nhằm áp đặt một điểm giáo phái.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “qua đời” thay cho cách nói thô trực tiếp, và “sống gần” để thể hiện tự nhiên quan hệ vị trí. Dấu chú thích [a] được đặt ngay sau địa danh mà chú thích giải thích.
