  to: Sau khi Áp-ra-ham qua đời, Đức Chúa Trời ban phước cho Y-sác, con trai Áp-ra-ham; và Y-sác sống gần Bê-e La-chai Rô-i.[a]
  rationale: Chỉ thay “con trai ông” bằng “con trai Áp-ra-ham” để bảo đảm quan hệ cha-con được nguyên văn nêu rõ và không bị hiểu là quan hệ giữa Y-sác với Đức Chúa Trời. Các phần khác giữ nguyên vì đã phản ánh tốt nghĩa nguồn và cách dùng tiếng Việt hiện đại.
