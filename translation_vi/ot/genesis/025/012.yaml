base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: vi
  text: Đây là dòng dõi của Ích-ma-ên[a], con trai của Áp-ra-ham, người mà Ha-ga, một người Ai Cập và là nữ nô lệ của Sa-ra[b], đã sinh cho Áp-ra-ham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và đây là dòng dõi của Ích-ma-ên.” Từ Hê-bơ-rơ תּוֹלְדוֹת (toledot) là một công thức tiêu đề lặp lại trong Sáng Thế Ký; cũng có thể dịch là “các thế hệ”, “hậu duệ” hoặc “gia hệ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nữ tỳ của Sa-ra” hoặc “người hầu gái của Sa-ra”. Từ Hê-bơ-rơ שִׁפְחָה chỉ một phụ nữ trong thân phận nô lệ hoặc người hầu; “nữ nô lệ” làm rõ hơn địa vị lệ thuộc ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Đây là
  rationale: Mở đầu đề mục gia phả tự nhiên trong tiếng Việt; không thêm ý thời gian không có trong nguyên văn. Sắc thái liên kết của וְ được ghi nhận trong chú thích.
- source_word: תֹּלְדֹת
  choice: dòng dõi
  rationale: Giữ ý về các thế hệ và hậu duệ trong công thức cấu trúc lặp lại của Sáng Thế Ký, đồng thời tự nhiên hơn cách dịch sát chữ “các thế hệ” trong tiếng Việt.
- source_word: יִשְׁמָעֵאל
  choice: Ích-ma-ên
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: בֶּן אַבְרָהָם
  choice: con trai Áp-ra-ham
  rationale: Diễn đạt quan hệ phụ tử rõ ràng và tự nhiên.
- source_word: אֲשֶׁר יָלְדָה
  choice: người mà ... đã sinh
  rationale: Giữ Ha-ga là chủ thể người mẹ của động từ ילד và Ích-ma-ên là đối tượng được sinh ra.
- source_word: הָגָר הַמִּצְרִית
  choice: Ha-ga, người Ai Cập
  rationale: Giữ tên riêng và căn tính dân tộc của Ha-ga bằng lối đồng vị tự nhiên.
- source_word: שִׁפְחַת שָׂרָה
  choice: nữ nô lệ của Sa-ra
  rationale: Thể hiện rõ địa vị lệ thuộc của שִׁפְחָה hơn từ “đầy tớ”, nhưng chú thích vẫn ghi nhận cách dịch truyền thống mềm hơn.
- source_word: לְאַבְרָהָם
  choice: cho Áp-ra-ham
  rationale: Trong kết cấu với ילד, giới từ לְ diễn tả việc Ha-ga sinh con cho Áp-ra-ham, người cha.
