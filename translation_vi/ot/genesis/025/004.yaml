base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: vi
  text: Các con trai của Ma-đi-an là Ê-pha, Ê-phe, Hê-nóc[a], A-bi-đa và Ên-đa-a. Tất cả những người này đều là con trai của Kê-tu-ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hê-bơ-rơ là Ha-nốc (Hanoch); trong một số truyền thống, tên này được phiên âm là Hê-nóc.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Các con trai của Ma-đi-an
  rationale: בְנֵי là dạng số nhiều liên kết của בֵּן; trong văn cảnh gia phả, “các con trai” vừa trực tiếp vừa chính xác hơn “con cái”. Từ nối וּ không cần dịch riêng ở đầu câu tiếng Việt.
- source_word: עֵיפָה
  choice: Ê-pha
  rationale: Phiên âm tên riêng theo lối viết tên Kinh Thánh quen thuộc và dễ đọc trong tiếng Việt.
- source_word: וָעֵפֶר
  choice: Ê-phe
  rationale: Phiên âm tên riêng עֵפֶר theo quy ước tiếng Việt; liên từ được thể hiện tự nhiên trong chuỗi liệt kê.
- source_word: וַחֲנֹךְ
  choice: Hê-nóc
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt, tương ứng với חֲנֹךְ (Ḥănōḵ), đồng thời ghi chú dạng sát âm Hê-bơ-rơ.
- source_word: וַאֲבִידָע
  choice: A-bi-đa
  rationale: Phiên âm trực tiếp tên riêng אֲבִידָע bằng hình thức dễ đọc trong tiếng Việt.
- source_word: וְאֶלְדָּעָה
  choice: Ên-đa-a
  rationale: Phiên âm tên riêng אֶלְדָּעָה theo quy ước tên Kinh Thánh tiếng Việt, giữ các thành tố âm tiết của tên Hê-bơ-rơ.
- source_word: כָּל אֵלֶּה
  choice: Tất cả những người này đều
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên ý tổng kết toàn bộ những người vừa được liệt kê.
- source_word: בְּנֵי קְטוּרָה
  choice: là con trai của Kê-tu-ra
  rationale: Giữ công thức gia phả “các con trai của” trong nguyên văn, thay vì diễn giải thành “dòng dõi”, dù những người vừa kể được giới thiệu là con trai của Ma-đi-an.
theological_decisions:
- issue: Quan hệ gia phả trong cụm בְּנֵי קְטוּרָה
  choice: con trai của Kê-tu-ra
  alternative: con cháu của Kê-tu-ra
  rationale: Nguyên văn dùng בְּנֵי, cùng từ vừa chỉ “các con trai của Ma-đi-an”. Bản dịch giữ cách gọi của câu và không âm thầm giải quyết độ rộng nghĩa thân tộc bằng cách đổi thành “con cháu”.
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và dễ hiểu. Tên riêng dùng dạng phiên âm quen thuộc trong tiếng Việt. Dấu chú thích [a] được đặt đúng sau Hê-nóc; lớp tham khảo tiếng Anh đặt dấu sau Ephah nhưng nội dung chú thích thực tế nói về Hanoch.
