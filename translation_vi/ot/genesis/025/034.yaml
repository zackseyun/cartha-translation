  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: vi
  text: Gia-cốp đưa cho Ê-sau bánh và món hầm đậu lăng[a]. Ê-sau ăn, uống, đứng dậy rồi bỏ đi. Như vậy, Ê-sau đã khinh thường quyền trưởng nam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “món hầm bằng đậu lăng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “coi rẻ quyền trưởng nam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: đưa cho
  rationale: Trong cuộc trao đổi cụ thể này, “đưa cho” diễn đạt tự nhiên hành động trao thức ăn mà không thêm sắc thái ngoài bản Hê-bơ-rơ.
- source_word: לֶחֶם
  choice: bánh
  rationale: Dù từ này đôi khi có nghĩa rộng là thức ăn, việc nó đi cùng món hầm ở đây ủng hộ nghĩa cụ thể là bánh.
- source_word: נְזִיד עֲדָשִׁים
  choice: món đậu lăng hầm
  rationale: Cụm từ chỉ một món nấu từ đậu lăng; cách diễn đạt này rõ ràng, tự nhiên và giữ được món ăn cụ thể của nguyên văn.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: ăn, uống, đứng dậy rồi bỏ đi
  rationale: Chuỗi động từ ngắn giữ nhịp kể nhanh của nguyên văn; “rồi” nối hai hành động cuối một cách tự nhiên trong tiếng Việt mà không làm mất trình tự.
- source_word: וַיִּבֶז
  choice: khinh thường
  rationale: Động từ diễn tả thái độ coi rẻ hoặc khinh miệt; “khinh thường” vừa mạnh, rõ vừa thông dụng trong tiếng Việt hiện đại.
- source_word: הַבְּכֹרָה
  choice: quyền trưởng nam
  rationale: Cách gọi ngắn gọn, quen thuộc cho địa vị và các đặc quyền thuộc về người con đầu lòng trong bối cảnh gia đình và pháp lý này.
theological_decisions:
- issue: Lời đánh giá kết thúc về thái độ của Ê-sau đối với địa vị con đầu lòng
  choice: Như vậy, Ê-sau đã khinh thường quyền trưởng nam
  alternative: Và Ê-sau đã coi rẻ quyền trưởng nam
  rationale: “Như vậy” thể hiện chức năng kết luận của mệnh đề cuối trong mạch truyện, còn “khinh thường” giữ nguyên sự đánh giá mạnh của động từ Hê-bơ-rơ mà không giải thích thêm động cơ hay hệ quả thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng tên riêng quen thuộc “Gia-cốp”, “Ê-sau”; giữ nhịp kể ngắn, nhanh của chuỗi động từ Hê-bơ-rơ.
