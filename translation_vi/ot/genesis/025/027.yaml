  text: וַֽ/יִּגְדְּלוּ֙ הַ/נְּעָרִ֔ים וַ/יְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְ/יַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: vi
  text: Khi hai cậu bé lớn lên, Ê-sau trở thành một thợ săn thành thạo, một người quen sống ngoài đồng[a]; còn Gia-cốp là người điềm đạm[b], sống trong lều trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một người của cánh đồng”; ở đây có thể chỉ người quen sống và hoạt động nơi đồng trống.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “điềm đạm” cũng có thể mang nghĩa “toàn vẹn,” “ngay thẳng,” “vô tội” hoặc “chất phác,” tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: Khi hai cậu bé lớn lên
  rationale: Diễn đạt tự nhiên quá trình hai con trai sinh đôi trưởng thành; וַיִּגְדְּלוּ trong ngữ cảnh này là “lớn lên,” không phải “trở nên vĩ đại.”
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: một thợ săn thành thạo
  rationale: Cụm “người biết việc săn bắt” chỉ năng lực và kinh nghiệm thực hành; “thợ săn thành thạo” vừa rõ nghĩa vừa tự nhiên.
- source_word: אִישׁ שָׂדֶה
  choice: một người của đồng nội
  rationale: Giữ hình ảnh שָׂדֶה là vùng đồng trống ngoài trời và tạo thế đối lập với đời sống trong lều của Gia-cốp, không thu hẹp thành một cánh đồng canh tác cụ thể.
- source_word: אִישׁ תָּם
  choice: người điềm đạm
  rationale: Trong thế đối lập trực tiếp với lối sống săn bắn ngoài đồng của Ê-sau, cách dịch này nêu nét tính tình và nếp sống mà không khẳng định quá mức một phán xét đạo đức. Chú thích giữ lại phạm vi nghĩa rộng của תָּם.
- source_word: יֹשֵׁב אֹהָלִים
  choice: sống trong các lều
  rationale: Phân từ diễn tả nơi ở và nếp sống thường xuyên; số nhiều “các lều” phản ánh אֹהָלִים và vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của תָּם khi mô tả Gia-cốp
  choice: “điềm đạm” như một nét tính tình hoặc nếp sống
  alternative: “trọn vẹn,” “ngay thẳng,” “vô tội,” hoặc “chất phác”
  rationale: Từ Hê-bơ-rơ có thể chỉ sự toàn vẹn, ngay thẳng, vô tội hoặc đơn sơ tùy ngữ cảnh. Ở đây, cấu trúc đối chiếu người săn bắn ngoài đồng với người sống trong lều nghiêng về nét tính tình/nếp sống, nhưng chú thích bảo lưu khả năng mang sắc thái đạo đức.
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “đồng nội” để giữ hình ảnh nguyên ngữ mà không gợi riêng ruộng canh tác; dùng “điềm đạm” trong chính văn và chú thích phạm vi nghĩa để không xóa bỏ sự mơ hồ thực sự của תָּם.
