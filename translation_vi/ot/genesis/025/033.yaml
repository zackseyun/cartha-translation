base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: vi
  text: 'Gia-cốp nói: “Hãy thề với tôi hôm nay[a].” Ê-sau thề với ông và bán quyền trưởng nam[b] của mình cho Gia-cốp.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào ngày này” hoặc “kể từ hôm nay”.'
    reason: lexical_alternative
  - marker: b
    text: “Quyền trưởng nam” là địa vị và các quyền lợi thuộc về người con trai đầu lòng.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: Hãy thề với tôi
  rationale: Mệnh lệnh trực tiếp, với לִּי chỉ người nhận lời thề; cách diễn đạt này tự nhiên và giữ được tính dứt khoát của nguyên văn.
- source_word: כַּיּוֹם
  choice: ngay hôm nay
  rationale: Cụm từ chỉ thời điểm hiện tại, có thể mang sắc thái nhấn mạnh; “ngay hôm nay” truyền đạt tính tức thời mà vẫn để chú thích nêu các khả năng dịch sát khác.
- source_word: וַיִּשָּׁבַע לֹו
  choice: Ê-sau liền thề với ông
  rationale: Chủ ngữ Ê-sau được làm rõ từ ngữ cảnh để tiếng Việt không mơ hồ khó hiểu; “liền” phản ánh diễn tiến liên tiếp của dạng kể chuyện, còn “với ông” giữ đối tượng của lời thề.
- source_word: וַיִּמְכֹּר
  choice: bán
  rationale: Động từ מכר chỉ hành vi bán, bảo toàn tính chất giao dịch cụ thể của câu.
- source_word: בְּכֹרָתוֹ
  choice: quyền trưởng nam
  rationale: בְּכֹרָה nói đến địa vị và các quyền gắn với con trai đầu lòng; “quyền trưởng nam” là cách nói rõ, gọn và quen thuộc trong tiếng Việt.
- source_word: לְיַעֲקֹב
  choice: cho Gia-cốp
  rationale: Giới từ לְ đánh dấu người nhận trong giao dịch; “bán ... cho Gia-cốp” là cấu trúc tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất việc Ê-sau chuyển nhượng בְּכֹרָה
  choice: bán quyền trưởng nam
  alternative: bán địa vị và các quyền của con trai đầu lòng
  rationale: Câu này mô tả một giao dịch cụ thể liên quan đến địa vị và quyền lợi của người con đầu lòng. Bản dịch không thêm đánh giá thần học hay pháp lý vượt quá điều nguyên văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Gia-cốp”, “Ê-sau” theo lối phiên âm Kinh Thánh quen thuộc; làm rõ chủ ngữ Ê-sau trong vế sau để câu tiếng Việt tự nhiên. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
