  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: vi
  text: 'Gia-cốp nói: “Hôm nay[a], hãy bán quyền trưởng nam của anh cho tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngay hôm nay” hoặc “kể từ hôm nay,” nhấn mạnh một giao dịch tức thời và có tính ràng buộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; tiếng Việt tự nhiên không cần dịch liên từ וַ־ thành “và” ở đây.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: מִכְרָה
  choice: hãy bán
  rationale: Mệnh lệnh của động từ מכר; “hãy bán” diễn đạt trực tiếp và tự nhiên.
- source_word: כַיּוֹם
  choice: hôm nay
  rationale: Thành ngữ có thể mang nghĩa “hôm nay/ngay hôm nay” hoặc “kể từ hôm nay”; trong ngữ cảnh, nó nhấn mạnh giao dịch tức thời, có hiệu lực ngay.
- source_word: אֶת
  choice: '[dấu hiệu tân ngữ trực tiếp, không dịch]'
  rationale: אֶת đánh dấu tân ngữ trực tiếp xác định và không có từ tương đương độc lập trong tiếng Việt.
- source_word: בְּכֹרָתְךָ
  choice: quyền trưởng nam của anh
  rationale: בְּכֹרָה chỉ địa vị cùng các quyền lợi của người con trai đầu lòng; “quyền trưởng nam” ngắn gọn, rõ nghĩa và phù hợp ngữ cảnh.
- source_word: לִי
  choice: cho tôi
  rationale: Giữ rõ người nhận giao dịch; cấu trúc “bán ... cho tôi” tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh/tôi” làm rõ quan hệ đối thoại mà không bổ sung cách đánh giá nhân vật. Dấu chú thích [a] được đặt sau câu dẫn để áp dụng cho sắc thái của כַיּוֹם trong toàn lời yêu cầu.
