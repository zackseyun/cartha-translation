lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Mở đầu lời tổng kết; lược dịch liên từ וְ để câu tiếng Việt tự nhiên mà không làm thay đổi quan hệ diễn ngôn.
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם
  choice: số năm của cuộc đời Áp-ra-ham
  rationale: Cụm Hê-bơ-rơ theo sát chữ là “những ngày của những năm thuộc cuộc đời Áp-ra-ham”; bản dịch diễn đạt thành ngữ chỉ tổng số năm sống bằng tiếng Việt tự nhiên, còn dạng sát chữ được ghi ở chú thích.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt quen thuộc.
- source_word: אֲשֶׁר חָי
  choice: tức những năm ông đã sống
  rationale: Giữ lại mệnh đề quan hệ có tính nhắc lại và nhấn mạnh, đồng thời dùng “tức” để liên kết tự nhiên với “số năm” trong tiếng Việt.
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: một trăm bảy mươi lăm năm
  rationale: Cấu trúc cộng 100 + 70 + 5 được chuyển thành cách nói số tuổi chuẩn, tự nhiên trong tiếng Việt, giữ nguyên giá trị chính xác.
