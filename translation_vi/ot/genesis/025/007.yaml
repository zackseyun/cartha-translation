  terminology: “Áp-ra-ham” phù hợp quy ước phiên âm Kinh Thánh tiếng Việt. “Cuộc đời” và “năm” truyền đạt đúng cụm chỉ tuổi thọ; chú thích bảo lưu hình thức “ngày” của nguyên văn.
