  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: vi
  text: cánh đồng mà Áp-ra-ham đã mua từ con cháu Hết—tại đó, Áp-ra-ham và Sa-ra, vợ ông, đã được chôn cất.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “người Hê-tít” thay cho “con cháu Hết”. Nguyên văn Hê-bơ-rơ dùng cách gọi theo quan hệ dòng dõi hoặc dân tộc.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát trật tự ngữ pháp Hê-bơ-rơ: “Áp-ra-ham đã được chôn cất, và Sa-ra, vợ ông.” Động từ số ít đứng trước chủ ngữ ghép.'
    reason: formal_alternative
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: cánh đồng
  rationale: Danh từ xác định chỉ cánh đồng đã được nhắc đến như phần đất dùng làm nơi chôn cất.
- source_word: קָנָה
  choice: đã mua
  rationale: Trong bối cảnh giao dịch đất đai, động từ mang nghĩa cụ thể là mua.
- source_word: מֵאֵת בְּנֵי חֵת
  choice: từ con cháu Hếch
  rationale: Giữ cách diễn đạt thân tộc/dân tộc của nguyên văn; 'con cháu' tự nhiên hơn 'các con trai' trong tiếng Việt khi nói về một cộng đồng hậu duệ.
- source_word: שָׁמָּה
  choice: tại đó
  rationale: Trạng từ chỉ địa điểm, quy chiếu về cánh đồng vừa nêu.
- source_word: קֻבַּר
  choice: đã được chôn cất
  rationale: Giữ thể bị động của động từ Hê-bơ-rơ; động từ số ít đứng trước chủ ngữ ghép là cách hòa hợp ngữ pháp có thể gặp trong tiếng Hê-bơ-rơ.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: và Sa-ra, vợ ông
  rationale: Giữ trật tự thông tin của nguyên văn đồng thời dùng dấu phẩy để câu tiếng Việt rõ và tự nhiên.
