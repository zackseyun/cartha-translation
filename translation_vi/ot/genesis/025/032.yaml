    rationale: הוֹלֵךְ לָמוּת diễn tả việc đang hướng đến/cận kề cái chết; “sắp chết” đã truyền đạt đầy đủ. “Rồi” có thể gợi một sắc thái bổ sung không cần thiết.
  - severity: low
