  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: vi
  text: 'Ê-sau nói: “Này, tôi sắp chết; vậy quyền trưởng nam này có ích gì cho tôi?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tôi sắp chết; vậy tôi cần quyền trưởng nam này làm gì?”'
    reason: Giữ một cách diễn đạt khác cho ý câu hỏi tu từ của וְלָמָּה ... לִי, đồng thời tránh lối dịch quá sát chữ và không tự nhiên của הוֹלֵךְ לָמוּת.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ trần thuật wayyiqtol của אמר; tiếng Việt tự nhiên không cần dịch liên từ mở đầu.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong tiếng Việt.
- source_word: הִנֵּה
  choice: Này
  rationale: Thán từ thu hút sự chú ý; “Này” vừa tự nhiên vừa giữ được sắc thái chỉ dẫn, nhấn mạnh.
- source_word: אָנֹכִי
  choice: tôi
  rationale: Đại từ ngôi thứ nhất độc lập có tính nhấn mạnh; ngữ cảnh và câu trực tiếp truyền đạt đủ sắc thái ấy trong tiếng Việt.
- source_word: הוֹלֵךְ לָמוּת
  choice: sắp chết rồi
  rationale: Cấu trúc הלך với động từ nguyên mẫu diễn tả tiến gần đến kết quả; ở đây chỉ cái chết cận kề chứ không nhất thiết là chuyển động theo nghĩa đen.
- source_word: וְלָמָּה זֶּה לִי בְּכֹרָה
  choice: vậy quyền trưởng nam này có ích gì cho tôi?
  rationale: Chuyển câu hỏi tu từ sang tiếng Việt tự nhiên, giữ quan hệ kết luận và đại từ chỉ định “này”; לִי được thể hiện bằng “cho tôi”.
- source_word: בְּכֹרָה
  choice: quyền trưởng nam
  rationale: Chỉ địa vị cùng các quyền lợi gắn với người con trai đầu lòng; cách nói này rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sắc thái lời Ê-sau nói về việc chết
  choice: Giữ nguyên như một lời khẳng định rằng cái chết sắp xảy đến, không xác định đó là nghĩa đen hay lời nói cường điệu.
  alternative: Hiểu là Ê-sau thực sự cận kề cái chết, hoặc chỉ phóng đại vì quá đói.
  rationale: Bản Hê-bơ-rơ chỉ ghi lời Ê-sau rằng ông đang tiến đến/sắp chết; bản dịch không giải quyết thay người đọc sự căng thẳng về mặt trần thuật và đạo đức.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi” trong lời thoại để tự nhiên; “quyền trưởng nam” diễn đạt rõ nội dung pháp lý-xã hội. Dấu chú thích được đặt ngay sau câu có liên quan.
