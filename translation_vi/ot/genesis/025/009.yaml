base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: vi
  text: Hai con trai ông là Y-sác và Ích-ma-ên chôn ông trong hang Mác-pê-la, ở trong cánh đồng của Ép-rôn, con trai Xô-ha, người Hê-tít, đối diện Mam-rê.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ở trước Mam-rê” hoặc “hướng về Mam-rê.” Cụm từ Hê-bơ-rơ có thể chỉ một địa điểm ở phía trước hoặc đối diện một mốc địa lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: chôn ông
  rationale: Động từ wayyiqtol của קבר tiếp nối mạch kể quá khứ; đại từ tân ngữ giống đực số ít chỉ Áp-ra-ham ở câu trước. Tiếng Việt không cần dịch liên từ mở đầu.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: Hai con trai ông là Y-sác và Ích-ma-ên
  rationale: Diễn đạt tự nhiên quan hệ đồng vị và giữ hậu tố sở hữu chỉ Áp-ra-ham; thêm “hai” là thông tin hiển nhiên từ hai tên được liệt kê.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: trong hang Mác-pê-la
  rationale: Dù אֶל thường chỉ hướng đến, trong ngữ cảnh mai táng, “chôn ... trong hang” là cách nói tự nhiên và đúng nghĩa địa điểm.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: tại cánh đồng của Ép-rôn
  rationale: Cụm thứ hai xác định thêm địa điểm của hang; “tại” giúp thể hiện quan hệ vị trí mà không lặp “trong” một cách gượng ép.
- source_word: בֶּן צֹחַר
  choice: con trai Xô-ha
  rationale: Dịch trực tiếp công thức gia hệ בן cộng tên riêng.
- source_word: הַחִתִּי
  choice: người Hê-tít
  rationale: Dùng danh xưng dân tộc quen thuộc trong tiếng Việt.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: đối diện Mam-rê
  rationale: עַל־פְּנֵי trong mô tả địa lý có thể là “đối diện”, “ở trước” hoặc “hướng về”; “đối diện” rõ nghĩa nhưng vẫn cần chú thích để giữ độ mơ hồ của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, tự nhiên và dễ hiểu. Tên riêng được phiên âm theo lối Việt hóa thông dụng; giữ Mam-rê nhất quán với dạng tên địa danh quen thuộc. Dấu chú thích [a] đặt ngay sau cụm từ liên quan.
