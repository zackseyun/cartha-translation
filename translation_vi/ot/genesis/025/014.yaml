  text: Mích-ma, Đu-ma và Ma-sa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁמָע
  choice: Mích-ma
  rationale: Đây là tên riêng trong gia phả, nên được phiên âm thay vì dịch nghĩa. Dạng “Mích-ma” phù hợp với lối phiên âm tên Kinh Thánh quen thuộc trong tiếng Việt; phụ âm ע ở cuối không có âm tương ứng tự nhiên trong tiếng Việt nên không được biểu thị riêng.
- source_word: דּוּמָה
  choice: Đu-ma
  rationale: Tên riêng được phiên âm theo cách tự nhiên và quen thuộc trong tiếng Việt, giữ âm tiết dài u của tiếng Hê-bơ-rơ mà không dịch theo nghĩa từ nguyên.
- source_word: מַשָּׂא
  choice: Ma-sa
  rationale: Ngữ cảnh gia phả cho thấy đây là tên người hoặc tên bộ tộc, không phải danh từ chung có thể mang nghĩa “gánh nặng” hay “sấm truyền”; vì vậy dùng hình thức phiên âm.
theological_decisions: []
translation_notes:
  register: Câu liệt kê ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. Các tên riêng được viết có dấu và nối âm tiết bằng dấu gạch nối theo quy ước phiên âm tên Kinh Thánh tiếng Việt.
