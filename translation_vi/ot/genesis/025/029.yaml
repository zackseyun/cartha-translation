  naturalness: “Người mệt lả” có thể hiểu được nhưng hơi gượng trong văn xuôi Việt hiện đại; dùng đại từ “ông” sau tên riêng tự nhiên và rõ quy chiếu hơn. Liên kết bằng “thì” giữ được trình tự cảnh kể mà vẫn trôi chảy.
