  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: vi
  text: Gia-cốp đang nấu một món hầm[a], thì Ê-sau từ ngoài đồng đến và ông mệt lả[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Gia-cốp đang đun sôi một món ăn.” Động từ Hê-bơ-rơ chỉ việc nấu bằng cách đun sôi.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mệt mỏi”, “kiệt sức” hoặc “rã rời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: đang nấu
  rationale: Động từ זיד ở đây nói đến việc chế biến thức ăn bằng cách đun sôi. “Đang nấu” tự nhiên trong tiếng Việt và, kết hợp với “món hầm”, vẫn thể hiện rõ hành động nấu nướng đang diễn ra.
- source_word: נָזִיד
  choice: một món hầm
  rationale: Danh từ נָזִיד chỉ một món ăn được nấu, đặc biệt là món hầm. “Món hầm” là cách gọi hiện đại, rõ nghĩa và phù hợp với ngữ cảnh.
- source_word: וַיָּבֹא
  choice: trở về
  rationale: בוא có nghĩa là đến hoặc đi vào. Trong ngữ cảnh Ê-sau từ ngoài đồng đến chỗ Gia-cốp, “trở về” là cách diễn đạt tự nhiên trong tiếng Việt mà không thêm một địa điểm không có trong nguyên văn.
- source_word: מִן הַשָּׂדֶה
  choice: từ ngoài đồng
  rationale: שׂדה thường chỉ đồng ruộng hoặc vùng đất trống. “Ngoài đồng” là cách nói tự nhiên, cụ thể trong tiếng Việt.
- source_word: וְהוּא עָיֵף
  choice: người mệt lả
  rationale: עָיֵף diễn tả tình trạng mệt mỏi, kiệt sức. “Mệt lả” truyền đạt cường độ của từ và tạo tiền đề tự nhiên cho lời xin ăn ở câu tiếp theo; “người” quy chiếu rõ về Ê-sau theo lối văn trang trọng.
