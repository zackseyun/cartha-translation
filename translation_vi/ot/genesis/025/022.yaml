  text: וַ/יִּתְרֹֽצֲצ֤וּ הַ/בָּנִים֙ בְּ/קִרְבָּ֔/הּ וַ/תֹּ֣אמֶר אִם כֵּ֔ן לָ֥/מָּה זֶּ֖ה אָנֹ֑כִי וַ/תֵּ֖לֶךְ לִ/דְרֹ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: vi
  text: 'Hai đứa con giằng co với nhau trong lòng bà. Bà liền nói: “Nếu vậy thì tại sao tôi lại thế này?”[a] Rồi bà đi cầu hỏi Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại sao tôi lại như vậy?” Sát chữ hơn, câu Hê-bơ-rơ tỉnh lược là: “tại sao tôi?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: giằng nhau
  rationale: Dạng hitpael diễn tả hành động qua lại và mạnh giữa hai thai nhi. “Giằng nhau” giữ được sắc thái xung đột mà vẫn tự nhiên trong tiếng Việt.
- source_word: הַבָּנִים
  choice: hai đứa con
  rationale: Danh từ có nghĩa là “các con/các con trai”; ngữ cảnh cho biết có hai thai nhi. “Hai đứa con” tự nhiên ở giai đoạn còn trong bụng mẹ và không nhấn thêm giới tính trước câu kế tiếp.
- source_word: בְּקִרְבָּהּ
  choice: trong bụng bà
  rationale: Nguyên văn là “bên trong bà”. Trong ngữ cảnh mang thai, “trong bụng bà” rõ nghĩa, tự nhiên và không dùng thuật ngữ y khoa.
- source_word: אִם כֵּן
  choice: Nếu vậy
  rationale: Cách diễn đạt ngắn gọn, tự nhiên, giữ quan hệ điều kiện của tiếng Hê-bơ-rơ.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: tại sao tôi lại thế này?
  rationale: Cụm Hê-bơ-rơ tỉnh lược và khó xác định chính xác. Cách dịch này giữ lời than về tình trạng hiện tại mà không biến nó thành một khẳng định triết học về sự tồn tại.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: cầu hỏi Đức Giê-hô-va
  rationale: Động từ דרש với đối tượng là Đức Chúa Trời trong ngữ cảnh này chỉ việc tìm lời giải đáp hoặc sự chỉ dẫn. “Cầu hỏi” là cách nói Việt ngữ tự nhiên và sát chức năng ấy.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng danh riêng quen thuộc trong tiếng Việt để biểu thị trực tiếp danh giao ước יהוה, thay vì thay bằng tước hiệu “CHÚA”.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה. “Đức Giê-hô-va” bảo tồn tính chất danh riêng và là hình thức trang trọng, dễ nhận biết trong tiếng Việt; không thay danh ấy bằng một tước hiệu.
- issue: Ý nghĩa câu hỏi tỉnh lược לָמָּה זֶּה אָנֹכִי
  choice: tại sao tôi lại thế này?
  alternative: tại sao tôi tồn tại?; tại sao chuyện này xảy đến với tôi?
  rationale: Nguyên văn cho phép nhiều cách hiểu. Bản chính chọn cách phù hợp nhất với nỗi đau khổ do thai nhi giằng nhau, còn chú thích giữ lại tính mơ hồ thực sự của câu Hê-bơ-rơ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. “Bà” phù hợp với nhân vật nữ trưởng thành đã được xác định trong mạch truyện; lời thoại giữ sự ngắn gọn và đau đớn của nguyên văn.
