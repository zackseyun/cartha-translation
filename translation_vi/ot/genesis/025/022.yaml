- from: 'Hai đứa con giằng nhau trong bụng bà, nên bà nói: “Nếu vậy thì tại sao tôi lại thế này?”[a] Rồi bà đi cầu hỏi Đức Giê-hô-va.'
  to: 'Hai đứa con giằng co với nhau trong lòng bà. Bà liền nói: “Nếu vậy thì tại sao tôi lại thế này?”[a] Rồi bà đi cầu hỏi Yahweh.'
  rationale: Bản sửa loại bỏ liên hệ nhân quả được thêm vào, làm rõ hành động qua lại giữa hai thai nhi, và chuẩn hóa việc chuyển danh יהוה thành “Yahweh” theo audit trail. Câu hỏi tỉnh lược vẫn được dịch theo ngữ cảnh và chú thích vẫn bảo lưu cách hiểu sát chữ, không giải quyết thay tính mơ hồ của nguyên văn.
