base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: vi
  text: Giốc-san sinh Sê-ba và Đê-đan. Các con trai của Đê-đan là A-su-rim,[a] Lê-tu-sim và Lê-um-mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ba tên A-su-rim, Lê-tu-sim và Lê-um-mim cũng có thể là tên các thị tộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְשָׁן
  choice: Giốc-san
  rationale: Tên riêng được phiên âm sang tiếng Việt theo cách đọc gần với dạng Hê-bơ-rơ và phù hợp lối viết tên Kinh Thánh quen thuộc.
- source_word: יָלַד
  choice: sinh
  rationale: Trong gia phả, động từ này chỉ việc trở thành cha hoặc sinh ra hậu duệ; “sinh” ngắn gọn, tự nhiên và giữ được cấu trúc của nguyên văn.
- source_word: שְׁבָא
  choice: Sê-ba
  rationale: Tên riêng được phiên âm, không dịch nghĩa.
- source_word: דְּדָן
  choice: Đê-đan
  rationale: Tên riêng được phiên âm, không dịch nghĩa.
- source_word: בְנֵי
  choice: các con trai của
  rationale: Phản ánh trực tiếp danh từ giống đực số nhiều “các con trai”; trong văn cảnh gia phả, từ này cũng có thể chỉ hậu duệ hay các nhóm thị tộc.
- source_word: הָיוּ
  choice: là
  rationale: Dùng như hệ từ để giới thiệu danh sách các con trai hoặc thị tộc của Đê-đan.
- source_word: אַשּׁוּרִם
  choice: Át-su-rim
  rationale: Có lẽ là tên một nhóm người hoặc thị tộc; phiên âm thay vì suy diễn nghĩa từ nguyên.
- source_word: לְטוּשִׁים
  choice: Lê-tu-sim
  rationale: Tên nhóm người hoặc thị tộc được phiên âm vì nghĩa từ nguyên không chắc chắn.
- source_word: לְאֻמִּים
  choice: Lê-um-mim
  rationale: Trong văn cảnh này là tên riêng của một nhóm người hoặc thị tộc; phiên âm để tránh dịch thành danh từ chung “các dân”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách diễn đạt gia phả ngắn gọn; chú thích bảo tồn khả năng các dạng số nhiều này là tên thị tộc chứ không chỉ là tên cá nhân.
