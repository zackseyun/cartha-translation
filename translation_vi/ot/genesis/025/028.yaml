base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: vi
  text: Y-sác yêu Ê-sau vì món săn ở trong miệng ông[a], còn Rê-bê-ca yêu Gia-cốp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “vì món săn ở trong miệng ông.” Cách nói này có lẽ có nghĩa là Y-sác thiên vị Ê-sau vì ông thích món săn Ê-sau đem về.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: yêu
  rationale: Động từ Qal wayyiqtol của אָהַב diễn tả hành động trong trình thuật; “yêu” là cách dịch trực tiếp và tự nhiên.
- source_word: אֶת עֵשָׂו
  choice: Ê-sau
  rationale: Không dịch dấu hiệu tân ngữ trực tiếp אֶת; tên riêng được phiên âm theo cách dùng tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: כִּי giới thiệu lý do Y-sác yêu Ê-sau; “vì” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: צַיִד
  choice: món săn
  rationale: צַיִד chỉ thú hoặc thức ăn săn được. “Món săn” phù hợp với ngữ cảnh ăn uống và không thu hẹp nghĩa thành một loại thịt cụ thể.
- source_word: בְּפִיו
  choice: ở trong miệng ông
  rationale: Giữ hình ảnh cụ thể và sự mơ hồ của nguyên văn, nghĩa đen là “trong miệng ông”; đại từ “ông” tự nhiên hơn “người” ở đây và quy chiếu về Y-sác.
- source_word: וְרִבְקָה
  choice: còn Rê-bê-ca
  rationale: וְ về hình thức là “và”, nhưng tại đây nối hai sở thích tương phản của cha và mẹ; “còn” diễn đạt sự đối chiếu tự nhiên mà không làm quá mạnh như “nhưng”.
- source_word: אֹהֶבֶת
  choice: yêu
  rationale: Phân từ diễn tả tình cảm có tính tiếp diễn hoặc đặc trưng; trong câu kể tiếng Việt, “yêu” tự nhiên và giữ được sắc thái này.
- source_word: אֶת יַעֲקֹב
  choice: Gia-cốp
  rationale: Không dịch dấu hiệu tân ngữ trực tiếp אֶת; tên riêng được phiên âm theo cách dùng tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ hình ảnh khác thường của tiếng Hê-bơ-rơ trong câu chính, đồng thời giải thích nghĩa khả dĩ ở chú thích; không thêm từ chỉ thời gian hay diễn ngôn vốn không có trong nguyên văn.
