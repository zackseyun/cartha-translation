translation_notes:
  register: Văn phong gia phả trang trọng nhưng tự nhiên. Thêm “các con là” để câu tiếng Việt rõ rằng toàn bộ danh sách là những người con được sinh ra, không làm thay đổi nội dung mệnh đề Hê-bơ-rơ.
