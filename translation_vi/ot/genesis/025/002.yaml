  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: vi
  text: Bà sinh cho ông Xim-ran, Giốc-san, Mê-đan, Ma-đi-an, Ích-bác và Su-a.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Bà sinh
  rationale: Động từ ילד ở Qal wayyiqtol ngôi 3 giống cái số ít thuật lại việc sinh nở trong quá khứ; cách dịch này tự nhiên, ngắn gọn và giữ rõ chủ thể là người nữ.
- source_word: לוֹ
  choice: cho ông
  rationale: Giới từ ל kèm đại từ hậu tố chỉ người cha; tiếng Việt tự nhiên dùng “sinh cho ông” để diễn đạt quan hệ này.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Đây là dấu hiệu chỉ tân ngữ xác định trước từng tên riêng và không có từ tương ứng độc lập trong tiếng Việt.
- source_word: זִמְרָן
  choice: Xim-ran
  rationale: Tên riêng được phiên âm theo âm dạng Hê-bơ-rơ, dùng chính tả dễ đọc đối với độc giả Việt.
- source_word: יָקְשָׁן
  choice: Giốc-san
  rationale: Tên riêng được phiên âm sang tiếng Việt, phản ánh gần đúng các phụ âm và nguyên âm của tên Hê-bơ-rơ.
- source_word: מְדָן
  choice: Mê-đan
  rationale: Tên riêng được phiên âm trực tiếp và phân biệt với Ma-đi-an ở tên kế tiếp.
- source_word: מִדְיָן
  choice: Ma-đi-an
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt cho Midian, vừa dễ nhận biết vừa gần với truyền thống phiên âm Kinh Thánh.
- source_word: יִשְׁבָּק
  choice: Ích-bác
  rationale: Tên riêng được phiên âm theo lối Việt hóa dễ đọc, giữ gần các phụ âm chính của dạng Hê-bơ-rơ.
- source_word: שׁוּחַ
  choice: Su-a
  rationale: Tên riêng được phiên âm tự nhiên trong tiếng Việt; phụ âm cuối xát hầu không có tương ứng chính xác nên không biểu thị riêng.
