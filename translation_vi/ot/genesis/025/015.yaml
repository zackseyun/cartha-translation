  register: Văn phong ngắn gọn, trang trọng và tự nhiên, phù hợp một danh sách gia phả. Các tên riêng được phiên âm thống nhất bằng dạng có gạch nối để người đọc tiếng Việt dễ nhận biết âm tiết.
