  language: vi
  text: Ha-đát, Tê-ma, Giê-tu-rơ, Na-phích và Kê-đê-ma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַד
  choice: Ha-đát
  rationale: Tên riêng được phiên âm theo phụ âm Hê-bơ-rơ và theo lối ghi tên Kinh Thánh quen thuộc, dễ đọc trong tiếng Việt.
- source_word: תֵימָא
  choice: Tê-ma
  rationale: Tên riêng được phiên âm trực tiếp; âm cuối aleph không đòi hỏi thêm phụ âm cuối trong tiếng Việt.
- source_word: יְטוּר
  choice: Giê-tua
  rationale: Tên riêng được phiên âm theo cách đọc gần âm Hê-bơ-rơ, đồng thời dùng dạng âm tiết tự nhiên đối với người Việt.
- source_word: נָפִישׁ
  choice: Na-phích
  rationale: Tên riêng được phiên âm, thể hiện phụ âm cuối שׁ bằng “ch” trong dạng tên tiếng Việt.
- source_word: קֵדְמָה
  choice: Kê-đê-ma
  rationale: Tên riêng được phiên âm sát các âm tiết Hê-bơ-rơ và dễ đọc trong tiếng Việt.
- source_word: וְ / וָ
  choice: và
  rationale: Liên từ nối các tên trong danh sách; tiếng Việt tự nhiên dùng dấu phẩy giữa các mục và “và” trước mục cuối.
