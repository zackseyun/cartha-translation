review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng tuổi của Y-sác, quan hệ hôn nhân, gia hệ của Rê-bê-ca, tộc danh A-ram, địa danh Pha-đan A-ram và quan hệ với La-ban. Tuy nhiên, “em gái” xác định tương quan tuổi mà אֲחוֹת chỉ đơn giản là “chị/em gái”, nên không nên chọn riêng “em”.
  naturalness: “Y-sác được bốn mươi tuổi” không tự nhiên trong tiếng Việt hiện đại; cách nói chuẩn là “Y-sác bốn mươi tuổi khi…”. Việc tách thành hai câu vẫn tự nhiên và không làm mất thông tin nguồn.
  terminology: “Người A-ram” phản ánh chính xác הָאֲרַמִּי hơn “người Sy-ri”. Các tên riêng phiên âm và địa danh nhất quán với bản thảo. “Chị/em gái” bảo toàn tính không xác định về tuổi của từ nguồn.
  issues:
  - severity: medium
    issue: “Y-sác được bốn mươi tuổi” là cách diễn đạt không tự nhiên.
    rationale: Thành ngữ tuổi trong tiếng Việt hiện đại dùng cấu trúc “Y-sác bốn mươi tuổi” hoặc “Y-sác ở tuổi bốn mươi”, không dùng “được bốn mươi tuổi” trong ngữ cảnh này.
  - severity: medium
    issue: “Em gái của La-ban” thu hẹp nghĩa của אֲחוֹת.
    rationale: Danh từ Hê-bơ-rơ này chỉ quan hệ chị/em gái, không xác định Rê-bê-ca lớn hay nhỏ tuổi hơn La-ban. Chú thích không khắc phục hoàn toàn một khẳng định tuổi đã đặt trong thân văn; nên giữ “chị/em gái” trong bản dịch.
  revised_text: Y-sác bốn mươi tuổi khi cưới Rê-bê-ca[a] làm vợ. Nàng là con gái của Bê-tu-ên, người A-ram, quê ở Pha-đan A-ram, và là chị/em gái của La-ban, người A-ram[b].
