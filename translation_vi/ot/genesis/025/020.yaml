revisions:
- from: Y-sác được bốn mươi tuổi khi cưới Rê-bê-ca[a] làm vợ. Nàng là con gái của Bê-tu-ên, người A-ram quê ở Pha-đan A-ram, và là em gái của La-ban, người A-ram[b].
  to: Y-sác bốn mươi tuổi khi cưới Rê-bê-ca[a] làm vợ. Nàng là con gái của Bê-tu-ên, người A-ram, quê ở Pha-đan A-ram, và là chị/em gái của La-ban, người A-ram[b].
  rationale: Sửa thành ngữ chỉ tuổi cho tự nhiên trong tiếng Việt và thay “em gái” bằng “chị/em gái” để không thêm thông tin về tương quan tuổi không có trong nguyên văn. Giữ cấu trúc hai câu, các tên riêng, tộc danh, địa danh và hai neo chú thích của bản thảo.
  reviewer_model: gpt-5.6-terra
