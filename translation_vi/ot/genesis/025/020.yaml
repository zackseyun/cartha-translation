translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Câu Hê-bơ-rơ dài được tách thành hai câu để dễ hiểu; câu thứ hai gom các thông tin về thân thế của Rê-bê-ca. Các tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
