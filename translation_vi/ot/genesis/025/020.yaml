base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: vi
  text: Y-sác bốn mươi tuổi khi cưới Rê-bê-ca[a] làm vợ. Nàng là con gái của Bê-tu-ên, người A-ram, quê ở Pha-đan A-ram, và là chị/em gái của La-ban, người A-ram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn sát nghĩa: “khi ông lấy Rê-bê-ca… làm vợ.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ có nghĩa là “người A-ram”, chính xác hơn cách dịch truyền thống “người Sy-ri”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: Y-sác được bốn mươi tuổi
  rationale: Cách diễn đạt tuổi tự nhiên trong tiếng Việt, truyền đạt đúng thành ngữ Hê-bơ-rơ ‘con của bốn mươi năm’ trong lời kể.
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: khi cưới ... làm vợ
  rationale: לקח có nghĩa cơ bản là ‘lấy’, nhưng trong công thức hôn nhân này, cùng với לוֹ לְאִשָּׁה, nghĩa là cưới một người làm vợ. ‘Cưới ... làm vợ’ tự nhiên và vẫn phản ánh đầy đủ cấu trúc nguồn.
- source_word: רִבְקָה
  choice: Rê-bê-ca
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo dạng quen thuộc, dễ đọc trong tiếng Việt.
- source_word: בַּת בְּתוּאֵל
  choice: con gái của Bê-tu-ên
  rationale: Giữ rõ thông tin phả hệ và quan hệ thân tộc của nguyên văn.
- source_word: הָאֲרַמִּי
  choice: người A-ram
  rationale: Phản ánh chính xác tộc danh אֲרַמִּי hơn cách gọi truyền thống ‘người Sy-ri’.
- source_word: מִפַּדַּן אֲרָם
  choice: quê ở Pha-đan A-ram
  rationale: Giới từ מִן chỉ xuất xứ. Trong mạch mô tả Bê-tu-ên, ‘quê ở’ diễn đạt tự nhiên ý ‘từ Pha-đan A-ram’ mà không biến địa danh thành tên tộc người.
- source_word: אֲחוֹת לָבָן
  choice: em gái của La-ban
  rationale: Danh từ אֲחוֹת tự nó chỉ ‘chị/em gái’ và không xác định tuổi tương đối. Bản văn sau cho thấy La-ban hành động như người anh trong gia đình, nên ‘em gái’ là cách diễn đạt tự nhiên trong tiếng Việt; chú thích ghi nhận độ rộng nghĩa của từ nguồn.
