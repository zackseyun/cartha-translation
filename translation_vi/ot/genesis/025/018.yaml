  terminology: Các địa danh phiên âm nhất quán. “A-sua” bảo lưu tên riêng Asshur, còn chú thích nêu đúng khả năng dịch là “A-si-ri.” Chú thích a giữ được khả năng nghĩa đối nghịch mà không biến nó thành nghĩa chính.
