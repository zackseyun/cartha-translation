  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁכְּנ֨וּ מֵֽ/חֲוִילָ֜ה עַד שׁ֗וּר אֲשֶׁר֙ עַל פְּנֵ֣י מִצְרַ֔יִם בֹּאֲ/כָ֖ה אַשּׁ֑וּרָ/ה עַל פְּנֵ֥י כָל אֶחָ֖י/ו נָפָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: vi
  text: Họ cư ngụ từ Ha-vi-la đến Su-rơ, là nơi đối diện Ai Cập trên đường đi về phía A-sua[b]. Ông định cư đối diện với tất cả anh em mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hê-bơ-rơ này cũng có thể được hiểu là “Ông sống trong thế đối nghịch với tất cả anh em mình.” Thành ngữ có thể mô tả vị trí, chứ không nhất thiết nói đến sự thù địch.
    reason: alternative_reading
  - marker: b
    text: A-sua cũng có thể được dịch là “A-si-ri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: Họ cư ngụ
  rationale: Động từ số nhiều chỉ việc cư trú trong một vùng; “cư ngụ” tự nhiên, trang trọng và không hàm ý mạnh hơn bản nguồn về việc lập thuộc địa.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: từ Ha-vi-la đến Su-rơ
  rationale: Giữ nguyên công thức địa lý chỉ phạm vi cư trú và phiên âm hai địa danh theo cách dễ đọc trong tiếng Việt.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: là nơi đối diện Ai Cập
  rationale: עַל־פְּנֵי trong mô tả địa lý có nghĩa “ở trước mặt/đối diện”; “đối diện” giữ được tính không xác định về phương hướng.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: trên đường đi về phía A-sua
  rationale: Diễn đạt chuyển động hướng tới địa danh אַשּׁוּר mà không đồng nhất dứt khoát địa danh này với tên vùng “A-si-ri”.
- source_word: עַל־פְּנֵי כָּל־אֶחָיו
  choice: đối diện với tất cả anh em mình
  rationale: Giữ nghĩa không gian cơ bản của thành ngữ và tránh tự động diễn giải là thù địch; khả năng mang sắc thái đối nghịch được nêu trong chú thích.
- source_word: נָפָל
  choice: định cư
  rationale: Dù nghĩa thông thường là “ngã”, trong ngữ cảnh phân bố dân cư, động từ này được hiểu theo lối thành ngữ là ở lại hay định cư. Chủ ngữ số ít có thể quy về Ích-ma-ên, đại diện cho dòng dõi ông.
theological_decisions:
- issue: Cách hiểu cụm עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: Ông định cư đối diện với tất cả anh em mình
  alternative: Ông sống trong thế đối nghịch với tất cả anh em mình
  rationale: Cụm Hê-bơ-rơ có thể mô tả vị trí địa lý hoặc quan hệ đối nghịch. Bản chính giữ cách hiểu gần hình thức nguồn và ít diễn giải hơn; chú thích bảo tồn khả năng đối nghịch, vốn có liên hệ với Sáng Thế Ký 16:12.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Các địa danh được phiên âm; câu cuối giữ sự chuyển từ chủ ngữ số nhiều sang số ít của bản Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau mệnh đề mà nó giải thích, còn [b] đặt sau địa danh A-sua.
