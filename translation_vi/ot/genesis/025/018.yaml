  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của tiếng Hê-bơ-rơ: chủ ngữ số nhiều ở vế đầu chỉ dòng dõi Ích-ma-ên, phạm vi địa lý từ Ha-vi-la đến Su-rơ, quan hệ địa lý không xác định phương hướng của עַל־פְּנֵי מִצְרַיִם, và sự chuyển sang số ít ở mệnh đề cuối. “Định cư đối diện với” là cách xử lý thận trọng cho thành ngữ nָפָל עַל־פְּנֵי, không áp đặt nghĩa thù nghịch vốn còn tranh luận.'
