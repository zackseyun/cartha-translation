source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: vi
  text: 'Đây là số năm của đời Ích-ma-ên: một trăm ba mươi bảy năm. Ông trút hơi thở cuối cùng và qua đời[a], rồi được quy tụ về với dân mình[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng hai động từ khác nhau liên tiếp, có nghĩa là “trút hơi thở cuối cùng” và “chết”; bản dịch giữ lại cả hai.
    reason: lexical_alternative
  - marker: b
    text: “Được quy tụ về với dân mình” là một thành ngữ Hê-bơ-rơ trong lời thuật về cái chết; thành ngữ này có thể nói đến việc đoàn tụ với tổ tiên, được chôn giữa thân tộc, hoặc cả hai.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Đây là
  rationale: Công thức này mở đầu lời tổng kết. Tiếng Việt dùng “Đây là” tự nhiên trong mạch kể quá khứ mà không cần ép động từ chỉ thời.
- source_word: שְׁנֵי חַיֵּי
  choice: số năm của cuộc đời
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ dùng để tính toàn bộ tuổi thọ, đồng thời giữ rõ ý “những năm của đời”.
- source_word: יִשְׁמָעֵאל
  choice: Ích-ma-ên
  rationale: Dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: một trăm ba mươi bảy năm
  rationale: Gộp cấu trúc số đếm Hê-bơ-rơ thành cách nói tiếng Việt chuẩn, giữ nguyên tổng số.
- source_word: וַיִּגְוַע
  choice: trút hơi thở cuối cùng
  rationale: Giữ sắc thái tắt thở, lìa đời của גוע và phân biệt với động từ מות ngay sau đó.
- source_word: וַיָּמָת
  choice: và qua đời
  rationale: Giữ lại động từ thứ hai trong chuỗi thuật lại cái chết thay vì nhập hai động từ thành một; “qua đời” tạo câu trang trọng, tự nhiên.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: rồi được quy tụ về với dân mình
  rationale: Bảo tồn hình ảnh của công thức tử thuật Hê-bơ-rơ và giới từ chỉ hướng, không giới hạn ý nghĩa vào việc chôn cất hay đoàn tụ sau khi chết.
theological_decisions:
- issue: Ý nghĩa của công thức “được quy tụ về với dân mình”
  choice: Giữ nguyên lối nói hình tượng, không giải nghĩa dứt khoát.
  alternative: Dịch cụ thể là được chôn cùng tổ tiên, hoặc về đoàn tụ với tổ tiên sau khi chết.
  rationale: Nguyên văn có thể gợi đến việc an táng giữa thân tộc, sự đoàn tụ với tổ tiên sau khi chết, hoặc cả hai; bản dịch không nên tự ý giải quyết sự mở nghĩa thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dịch giữ nét lặp có chủ ý của hai động từ chỉ cái chết, đồng thời dùng “được quy tụ về với dân mình” để bảo tồn thành ngữ và độ mở của nguyên văn.
