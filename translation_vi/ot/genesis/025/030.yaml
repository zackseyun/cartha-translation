  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶֽל יַעֲקֹ֗ב הַלְעִיטֵ֤/נִי נָא֙ מִן הָ/אָדֹ֤ם הָ/אָדֹם֙ הַ/זֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: vi
  text: 'Ê-sau nói với Gia-cốp: “Làm ơn, cho tôi ngấu nghiến một ít thứ đỏ đó, thứ đỏ đó kia[a], vì tôi mệt lả.” Vì thế, ông được gọi là Ê-đôm[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ lặp lại “đỏ, đỏ” mà không gọi đích danh món ăn; cách nói này có thể phản ánh lời nói bột phát của Ê-sau. Nhiều bản dịch thêm “món hầm”.
    reason: lexical_alternative
  - marker: b
    text: Tên Ê-đôm có liên hệ trực tiếp với từ Hê-bơ-rơ nghĩa là “đỏ”, tạo nên lối chơi chữ trong câu này.
    reason: cross_reference
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: cho tôi ăn ngấu nghiến
  rationale: Dạng Hiphil mệnh lệnh với hậu tố ngôi thứ nhất diễn tả việc khiến người nói nuốt hoặc ăn một cách tham lam, vồ vập. “Ăn ngấu nghiến” tự nhiên trong tiếng Việt và giữ được giọng nói bộc trực, nôn nóng của Ê-sau hơn cách trung tính “cho tôi ăn”.
- source_word: נָא
  choice: làm ơn
  rationale: Tiểu từ dùng để làm lời yêu cầu; “làm ơn” là cách diễn đạt hiện đại, tự nhiên, không buộc phải hiểu theo nghĩa thời gian “bây giờ”.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: một ít thứ đỏ ấy, thứ đỏ kia
  rationale: Bản Hê-bơ-rơ lặp lại từ “đỏ” mà không nêu rõ món ăn. Bản dịch giữ cả sự tỉnh lược lẫn lối lặp có vẻ bột phát, thay vì tự đưa “món hầm” vào chính văn.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: vì tôi kiệt sức rồi
  rationale: עָיֵף chỉ tình trạng mệt mỏi, rã rời. “Kiệt sức” truyền đạt mức độ cấp bách trong văn cảnh, còn “rồi” làm câu thoại tự nhiên mà không thêm nội dung thần học.
- source_word: עַל כֵּן
  choice: vì thế
  rationale: Cụm từ nêu kết quả hoặc lời giải thích cho việc đặt tên; “vì thế” ngắn gọn và tự nhiên.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: người ta gọi ông là Ê-đôm
  rationale: Động từ số ít không nêu rõ chủ thể. Tiếng Việt thường dùng “người ta” cho chủ thể bất định; cách dịch này tránh xác định một cá nhân cụ thể và truyền đạt tự nhiên công thức gọi tên.
- source_word: אֱדוֹם
  choice: Ê-đôm
  rationale: Giữ đây là tên riêng bằng lối phiên âm quen thuộc trong tiếng Việt; mối liên hệ âm-nghĩa với từ “đỏ” được giải thích trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời Ê-sau được giữ bộc trực, gấp gáp; cấu trúc lặp khác thường của nguyên văn được bảo tồn ở mức tiếng Việt vẫn có thể hiểu tự nhiên. Tên riêng dùng dạng phiên âm tiếng Việt phổ biến.
