source:
  edition: WLC
  text: וַ/יֶּעְתַּ֨ר יִצְחָ֤ק לַֽ/יהוָה֙ לְ/נֹ֣כַח אִשְׁתּ֔/וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַ/יֵּעָ֤תֶר ל/וֹ֙ יְהוָ֔ה וַ/תַּ֖הַר רִבְקָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: vi
  text: Y-sác khẩn cầu Đức Giê-hô-va cho vợ mình[a], vì vợ ông không thể sinh con. Đức Giê-hô-va nhậm lời ông[b], và Rê-bê-ca, vợ ông, thụ thai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát chữ: “đối diện vợ mình”; trong ngữ cảnh, cụm này có thể mang nghĩa ông cầu nguyện liên quan đến hoặc thay cho nàng.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ dùng cùng một gốc động từ trong cả hai vế: Y-sác “khẩn cầu,” còn Đức Giê-hô-va đã để cho lời khẩn cầu của ông được nhậm, tức là nhậm lời ông.'
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: khẩn cầu / nhậm lời
  rationale: 'Hai hình thái của cùng một gốc từ được dùng có chủ ý: Y-sác khẩn cầu, và Đức Giê-hô-va để cho lời cầu xin ấy tác động đến Ngài. Cặp từ “khẩn cầu / nhậm lời” vừa tự nhiên trong tiếng Việt vừa giữ được mối liên hệ qua lại, dù không thể lặp cùng một động từ.'
- source_word: לַיהוָה / יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt để biểu thị danh riêng YHWH, phân biệt với tước hiệu “Chúa”.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: cho vợ mình
  rationale: Trong ngữ cảnh cầu nguyện, cụm này tự nhiên nhất được hiểu là cầu thay hoặc cầu xin liên quan đến người vợ. Nghĩa không gian sát chữ “đối diện vợ mình” được ghi ở chú thích để bảo tồn khả năng diễn giải.
- source_word: עֲקָרָה
  choice: hiếm muộn
  rationale: “Hiếm muộn” là cách nói hiện đại, trang trọng và tế nhị về tình trạng không thể có con trong ngữ cảnh này; chính xác hơn “không con,” vốn chỉ nêu kết quả.
- source_word: וַתַּהַר
  choice: thụ thai
  rationale: Cách diễn đạt ngắn gọn, trang trọng và sát với động từ Hê-bơ-rơ chỉ việc mang thai.
- source_word: רִבְקָה / יִצְחָק
  choice: Rê-bê-ca / Y-sác
  rationale: Theo dạng tên riêng Kinh Thánh đã quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Gốc עתר lặp lại và cách mô tả sự đáp lời của Đức Chúa Trời
  choice: Y-sác “khẩn cầu,” và Đức Giê-hô-va “nhậm lời ông”
  alternative: Y-sác “nài xin,” và Đức Giê-hô-va “để ông nài xin được”
  rationale: Bản dịch tránh hàm ý lời cầu nguyện tạo ra một cơ chế bắt buộc Đức Chúa Trời, nhưng vẫn giữ rõ rằng Ngài thuận đáp lại lời Y-sác.
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Đây là danh riêng giao ước chứ không chỉ là tước hiệu. “Đức Giê-hô-va” là dạng tiếng Việt có lịch sử sử dụng rộng và giúp người đọc nhận ra danh này, trong khi không áp đặt thêm cách giải nghĩa thần học.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “nàng” để phù hợp với lối kể cổ trang vừa phải, “mình/ông” để tránh lặp nặng nề, và giữ hai câu phối hợp gần với nhịp câu Hê-bơ-rơ.
