translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Kìa” giữ sắc thái nhấn mạnh của nguyên bản; “mãn ngày sinh nở” bảo tồn thành ngữ Hê-bơ-rơ mà vẫn tự nhiên trong tiếng Việt.
