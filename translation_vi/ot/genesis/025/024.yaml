  - severity: low
    issue: “Khi đã mãn ngày sinh nở” có cấu trúc hơi gượng.
    rationale: Nguyên văn nói các ngày của bà để sinh đã trọn. Trong tiếng Việt hiện đại, “Khi đến ngày sinh nở” diễn đạt thành ngữ này trôi chảy hơn mà không đổi nghĩa.
  revised_text: Khi đến ngày sinh nở, thì kìa, trong bụng bà có một cặp song sinh.
