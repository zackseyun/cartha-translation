  text: When her days to give birth were fulfilled, behold, there were twins in her womb.
translation:
  language: vi
  text: Khi đến ngày sinh nở, thì kìa, trong bụng bà có một cặp song sinh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת
  choice: Khi đã mãn ngày sinh nở
  rationale: Cụm Hê-bơ-rơ nói theo nghĩa đen rằng “những ngày của bà để sinh nở đã đầy/trọn”. “Đã mãn ngày sinh nở” giữ được hình ảnh thời kỳ thai nghén đi đến kỳ hạn, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: Giữ chức năng của từ chỉ thị diễn ngôn, hướng sự chú ý đến điều đáng chú ý được phát hiện khi sinh.
- source_word: תוֹמִם
  choice: hai thai sinh đôi
  rationale: Danh từ số nhiều chỉ một cặp song sinh. Thêm “hai thai” giúp câu tiếng Việt tự nhiên trong cấu trúc “trong bụng bà có…”, đồng thời diễn đạt rõ ý song thai.
- source_word: בְּבִטְנָהּ
  choice: trong bụng bà
  rationale: בטן có thể chỉ bụng hoặc dạ con. “Trong bụng bà” là cách nói tự nhiên, dễ hiểu trong văn cảnh mang thai và không thu hẹp nghĩa quá mức.
