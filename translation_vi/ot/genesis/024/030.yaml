translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Rê-bê-ca” và “La-ban” theo dạng tên quen thuộc trong tiếng Việt. Câu được tổ chức theo cặp “Khi ... thì” để bảo toàn quan hệ cú pháp của nguyên văn nhưng tránh lối mở đầu cổ kính. Các dấu chú thích [a], [b], [c] đều xuất hiện ngay tại từ ngữ liên quan.
