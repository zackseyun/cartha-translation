  text: וַ/יְהִ֣י כִּ/רְאֹ֣ת אֶת הַ/נֶּ֗זֶם וְֽ/אֶת הַ/צְּמִדִים֮ עַל יְדֵ֣י אֲחֹת/וֹ֒ וּ/כְ/שָׁמְע֗/וֹ אֶת דִּבְרֵ֞י רִבְקָ֤ה אֲחֹת/וֹ֙ לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר אֵלַ֖/י הָ/אִ֑ישׁ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וְ/הִנֵּ֛ה עֹמֵ֥ד עַל הַ/גְּמַלִּ֖ים עַל הָ/עָֽיִן׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: vi
  text: 'Khi thấy chiếc khuyên mũi[a] và những chiếc vòng đeo tay trên tay em gái mình, và khi nghe lời Rê-bê-ca, em gái mình, nói rằng: “Người đàn ông ấy đã nói với em như thế,” thì La-ban đến với người ấy. Kìa, người ấy vẫn đang đứng bên[b] đàn lạc đà tại suối[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chiếc khuyên”. Từ Hê-bơ-rơ נֶזֶם có thể chỉ chiếc khuyên nói chung; ở đây dịch là “khuyên mũi” vì câu 47 cho biết món trang sức ấy được đặt nơi mũi Rê-bê-ca.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cạnh”. Giới từ Hê-bơ-rơ ở đây có thể chỉ vị trí gần các con lạc đà, chứ không hàm ý người ấy đứng trên chúng.
    reason: lexical_clarification
  - marker: c
    text: Cũng có thể dịch là “tại giếng”. Từ Hê-bơ-rơ עַיִן cụ thể hơn, chỉ suối hoặc nguồn nước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Khi ... thì
  rationale: Trong mạch kể tiếng Hê-bơ-rơ, וַיְהִי dẫn vào sự việc tiếp theo; cấu trúc “Khi ... thì” chuyển tải tự nhiên quan hệ thời gian của câu dài mà không dùng lối nói cổ.
- source_word: הַנֶּזֶם
  choice: chiếc khuyên mũi
  rationale: נֶזֶם có thể chỉ chiếc khuyên nói chung, nhưng Sáng Thế Ký 24:47 xác định món trang sức này được đặt nơi mũi Rê-bê-ca.
- source_word: הַצְּמִדִים עַל יְדֵי אֲחֹתוֹ
  choice: đôi vòng trên tay em gái mình
  rationale: צְמִדִים là đồ trang sức đi thành đôi; “đôi vòng” tự nhiên trong tiếng Việt, còn “trên tay” giữ gần cách diễn đạt יָדַיִם của nguyên văn.
- source_word: דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: nghe Rê-bê-ca, em gái mình, thuật lại
  rationale: Diễn đạt nội dung lời Rê-bê-ca kể lại và chức năng dẫn lời của לֵאמֹר bằng tiếng Việt tự nhiên, tránh kết cấu nặng “nghe những lời... rằng”.
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: Người ấy đã nói với em như thế
  rationale: כֹּה mang nghĩa “như thế/thế này”; “người ấy” phù hợp với nhân vật đã được Rê-bê-ca nhắc tới nhưng chưa được gọi tên.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: La-ban đi ra gặp người ấy
  rationale: בוא אֶל diễn tả tiến đến một người. Bổ sung chủ ngữ La-ban từ ngữ cảnh trực tiếp để tiếng Việt rõ nghĩa; “đi ra gặp” phù hợp với việc ông rời nhà đến chỗ người đầy tớ.
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Giữ sắc thái trình hiện sống động của הִנֵּה bằng một từ hiện đại, trang trọng vừa phải.
- source_word: עֹמֵד
  choice: vẫn đang đứng
  rationale: Phân từ diễn tả trạng thái đang tiếp diễn khi La-ban đến; “vẫn đang” làm rõ tính liên tục trong tiếng Việt.
- source_word: עַל הַגְּמַלִּים
  choice: bên đàn lạc đà
  rationale: עַל ở đây chỉ vị trí cạnh hoặc bên các con vật, không phải đứng trên chúng; danh từ số nhiều được diễn đạt tự nhiên là “đàn lạc đà”.
- source_word: עַל הָעָיִן
  choice: tại suối
  rationale: עַיִן trong ngữ cảnh địa hình chỉ nguồn nước hay mạch nước; “suối” chính xác hơn “giếng” và phù hợp Sáng Thế Ký 24.
