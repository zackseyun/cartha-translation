  text: And he said[a], “I am Abraham’s servant.”
translation:
  language: vi
  text: 'Ông nói: “Tôi là người hầu[a] của Áp-ra-ham.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nô lệ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Ông nói
  rationale: Dạng waw-consecutive với אמר tiếp diễn mạch kể. Tiếng Việt không cần dịch máy móc liên từ וַ; “Ông nói” diễn đạt tự nhiên mà không thêm sắc thái thời gian hay nguyên nhân không có trong nguyên văn.
- source_word: עֶבֶד
  choice: đầy tớ
  rationale: עֶבֶד có thể chỉ “đầy tớ” hoặc “nô lệ”. Trong lời tự giới thiệu trang trọng này, “đầy tớ” phù hợp ngữ cảnh gia hộ và vẫn giữ được địa vị lệ thuộc; phương án “nô lệ” được ghi ở chú thích để bảo toàn phạm vi nghĩa.
- source_word: אַבְרָהָם
  choice: Áp-ra-ham
  rationale: Phiên âm tên riêng theo cách viết Kinh Thánh quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: אָנֹכִי
  choice: Tôi là
  rationale: Đại từ độc lập אָנֹכִי nhấn mạnh việc người nói tự xác định thân phận. “Tôi là” là cách diễn đạt tự nhiên trong tiếng Việt và giữ được sắc thái tự giới thiệu.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, tự nhiên và dễ hiểu. Dùng “ông” để quy chiếu người đầy tớ trưởng thành đã được nhắc đến trong ngữ cảnh; câu tự giới thiệu dùng “tôi” phù hợp phép giao tiếp tiếng Việt hiện đại.
