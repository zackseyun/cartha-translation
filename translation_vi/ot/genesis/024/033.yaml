  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: vi
  text: 'Người ta dọn thức ăn ra trước mặt ông để ông ăn, nhưng ông nói: “Tôi sẽ không ăn cho đến khi nói xong điều tôi cần nói.” Người kia đáp: “Xin ông cứ nói.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Người ta dọn
  rationale: Động từ שׂים có nghĩa là đặt hoặc để. Chủ thể không được nêu rõ và không phải trọng tâm, nên cách nói phiếm chỉ “người ta dọn” tự nhiên trong tiếng Việt, phù hợp với ngữ cảnh thức ăn được đem ra.
- source_word: לְפָנָיו לֶאֱכֹל
  choice: thức ăn ra trước mặt ông để ông ăn
  rationale: לְפָנָיו là “trước mặt ông”; động từ nguyên mẫu có לְ diễn tả mục đích, vì vậy “để ông ăn” truyền đạt rõ quan hệ cú pháp.
- source_word: לֹא אֹכַל
  choice: Tôi sẽ không ăn
  rationale: Dạng vị hoàn thành ở đây biểu thị quyết định kiên quyết hướng đến hành động sắp diễn ra; “sẽ không ăn” giữ được sự dứt khoát và giản dị.
- source_word: עַד אִם
  choice: cho đến khi
  rationale: Cụm này xác định giới hạn thời gian trước khi ông chịu ăn; “cho đến khi” đúng nghĩa hơn “trừ khi” trong văn cảnh.
- source_word: דִּבַּרְתִּי דְּבָרָי
  choice: nói xong điều tôi cần nói
  rationale: Nghĩa sát chữ là “nói những lời của tôi”, nhưng thành ngữ này chỉ điều hoặc công việc ông cần trình bày. “Nói xong điều tôi cần nói” tự nhiên trong tiếng Việt và vẫn giữ ý hành động phải hoàn tất trước khi ăn.
- source_word: דַּבֵּר
  choice: Xin ông cứ nói
  rationale: Mệnh lệnh số ít của דבר là lời cho phép hoặc mời người kia trình bày. “Xin ông cứ nói” tự nhiên, lịch sự theo quan hệ giao tiếp trong ngữ cảnh mà không thêm nội dung đáng kể.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để duy trì phép xưng hô tôn trọng; câu thoại ngắn, dứt khoát. Chọn cách diễn đạt thành ngữ cho דִּבַּרְתִּי דְּבָרָי vì bản dịch sát chữ “nói những lời của tôi” kém tự nhiên trong tiếng Việt và không có căng thẳng thần học hay sự mơ hồ quan trọng cần giữ bằng chú thích.
