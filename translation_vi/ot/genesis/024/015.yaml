revisions:
- from: Ông còn chưa nói xong thì kìa, Rê-bê-ca đang đi ra—nàng là con gái của Bê-tu-ên, con trai Minh-ca, vợ của Na-cô, em trai Áp-ra-ham—vai mang một chiếc vò.
  to: Ông còn chưa nói xong thì kìa, Rê-bê-ca đang đi ra—nàng là con gái của Bê-tu-ên, con trai của Minh-ca, vợ của Na-cô, người anh em của Áp-ra-ham—mang một chiếc vò trên vai.
  rationale: Sửa «em trai» thành «người anh em» để không thêm thứ bậc tuổi tác mà tiếng Hê-bơ-rơ không nêu. Đồng thời điều chỉnh vị trí cụm «trên vai» cho tiếng Việt tự nhiên hơn, không thay đổi ý nghĩa.
