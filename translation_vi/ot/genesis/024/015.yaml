base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: vi
  text: Ông còn chưa nói xong thì kìa, Rê-bê-ca đang đi ra—nàng là con gái của Bê-tu-ên, con trai của Minh-ca, vợ của Na-cô, người anh em của Áp-ra-ham—mang một chiếc vò trên vai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: thì
  rationale: Trong mạch kể tiếng Việt, “thì” tự nhiên nối thời điểm ông còn đang nói với sự việc xảy đến, chuyển tải chức năng tự sự của וַיְהִי mà không dùng công thức cổ kính.
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: còn chưa nói xong
  rationale: Diễn đạt rõ ý hành động nói vẫn chưa hoàn tất tại thời điểm sự việc tiếp theo xảy ra.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: Giữ sắc thái trực chỉ, sống động và thu hút sự chú ý của הִנֵּה trong lời kể.
- source_word: יֹצֵאת
  choice: đang đi ra
  rationale: Thể tiếp diễn với “đang” phản ánh phân từ giống cái, trình bày hành động đang diễn ra trước mắt.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: nàng là con gái của Bê-tu-ên
  rationale: Chuyển đạt quan hệ huyết thống mà cấu trúc bị động tiếng Hê-bơ-rơ xác định; đây là cách nói tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: con trai Minh-ca, vợ của Na-cô, em trai Áp-ra-ham
  rationale: 'Giữ nguyên chuỗi phả hệ và các quan hệ đồng vị: Bê-tu-ên là con trai Minh-ca; Minh-ca là vợ Na-cô; Na-cô là em trai Áp-ra-ham.'
- source_word: כַּד
  choice: chiếc vò
  rationale: “Vò” là từ thông dụng chỉ đồ đựng dùng để lấy và mang nước; không thêm “nước” vì câu Hê-bơ-rơ chỉ nêu vật chứa.
- source_word: עַל שִׁכְמָהּ
  choice: vai mang
  rationale: Diễn đạt tự nhiên vị trí chiếc vò trên vai nàng, đồng thời giữ hình ảnh cụ thể của nguyên văn.
