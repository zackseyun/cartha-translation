translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Dấu gạch ngang giữ phần phả hệ như một thành phần chen giải thích mà không làm mất chuyển động của cảnh; “kìa” bảo toàn tính sống động của lời kể.
