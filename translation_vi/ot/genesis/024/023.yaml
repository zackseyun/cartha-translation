  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: vi
  text: 'Rồi ông nói: “Cô là con gái của ai? Xin cho tôi biết. Trong nhà cha cô có chỗ cho chúng tôi nghỉ qua đêm không?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ông hỏi
  rationale: Động từ nghĩa đen là “nói”, nhưng lời trực tiếp gồm các câu hỏi; “hỏi” diễn đạt tự nhiên chức năng của lời nói, còn “rồi” thể hiện bước tiến của mạch kể wayyiqtol mà không nhấn mạnh quá mức trình tự thời gian.
- source_word: בַּת מִי אַתְּ
  choice: Cô là con gái của ai?
  rationale: Giữ rõ cách hỏi về quan hệ huyết thống và căn tính gia đình; đại từ “cô” phù hợp với cách một người đàn ông lớn tuổi nói với một phụ nữ trẻ trong ngữ cảnh này.
- source_word: הַגִּידִי נָא לִי
  choice: Xin cho tôi biết
  rationale: Tiểu từ נָא làm nhẹ mệnh lệnh; cách dịch này thể hiện một lời thỉnh cầu lịch sự và tự nhiên trong tiếng Việt hiện đại.
- source_word: הֲיֵשׁ
  choice: có ... không?
  rationale: Chuyển cấu trúc tồn tại nghi vấn của tiếng Hê-bơ-rơ sang mẫu câu hỏi có–không tự nhiên trong tiếng Việt.
- source_word: בֵּית אָבִיךְ
  choice: trong nhà cha cô
  rationale: Giữ hình ảnh “nhà cha”, có thể bao hàm cả nơi ở lẫn gia hộ, thay vì giản lược thành “nhà cô”.
- source_word: מָקוֹם
  choice: chỗ
  rationale: “Chỗ” vừa gần nghĩa cụ thể là nơi/không gian, vừa tự nhiên trong ngữ cảnh xin nơi lưu trú.
- source_word: לָנוּ
  choice: cho chúng tôi
  rationale: Giữ ngôi thứ nhất số nhiều, cho thấy người đầy tớ đang nói thay cho cả đoàn đi cùng.
- source_word: לָלִין
  choice: nghỉ qua đêm
  rationale: Động từ chỉ việc ở lại qua đêm; cách diễn đạt này rõ ràng, hiện đại và phù hợp ngữ cảnh tiếp đãi khách.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “ông” cho người đầy tớ và “cô” cho Rê-bê-ca theo quan hệ giao tiếp trong ngữ cảnh; không thêm cách giải thích thần học hay chi tiết không có trong nguyên văn.
