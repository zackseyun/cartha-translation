  to: Cô vội trút nước trong vò vào máng[a], rồi lại chạy đến giếng múc nước, và múc nước cho tất cả lạc đà của ông.
  rationale: Chỉnh sửa chỉ nhằm làm chú thích tự nhiên hơn và làm rõ tân ngữ được hiểu ngầm của động từ “múc” trong mệnh đề cuối. Ý nghĩa, trình tự hành động, sắc thái mau lẹ, tính lặp lại của việc chạy, và tính toàn thể của đàn lạc đà đều được giữ nguyên.
