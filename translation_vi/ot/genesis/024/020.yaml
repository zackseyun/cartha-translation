  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: vi
  text: Cô vội trút nước trong vò vào máng[a], rồi lại chạy đến giếng múc nước, và múc nước cho tất cả lạc đà của ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đổ nước trong vò vào máng nước.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Cô vội
  rationale: Động từ diễn tả hành động mau lẹ, khẩn trương; “vội” tự nhiên trong tiếng Việt và giữ nhịp kể súc tích.
- source_word: וַתְּעַר כַּדָּהּ
  choice: trút nước trong vò
  rationale: Động từ ערה chỉ việc làm cho vật chứa rỗng bằng cách đổ ra. Tiếng Việt tự nhiên nói “trút nước trong vò”, vừa nêu rõ hành động vừa tránh cách diễn đạt cứng “làm rỗng vò”.
- source_word: הַשֹּׁקֶת
  choice: máng
  rationale: Danh từ chỉ máng chứa nước cho súc vật; ngữ cảnh lạc đà khiến nghĩa này rõ ràng.
- source_word: וַתָּרָץ עוֹד
  choice: rồi lại chạy
  rationale: Giữ cả ý chạy và sắc thái lặp lại của עוֹד; “rồi” nối tự nhiên chuỗi hành động trong lời kể.
- source_word: הַבְּאֵר
  choice: giếng
  rationale: בְּאֵר thông thường chỉ giếng, phù hợp với bối cảnh lấy nước.
- source_word: לִשְׁאֹב
  choice: múc nước
  rationale: Trong bối cảnh giếng, động từ có nghĩa lấy nước lên; “múc nước” là cách nói phổ thông, tự nhiên.
- source_word: וַתִּשְׁאַב
  choice: múc
  rationale: Giữ sự lặp lại của động từ trong nguyên văn; bổ ngữ phía sau cho biết nước được múc cho đàn lạc đà.
- source_word: לְכָל גְּמַלָּיו
  choice: cho tất cả lạc đà của ông
  rationale: Bảo toàn ý toàn thể của כָּל và đại từ sở hữu giống đực số ít; “ông” chỉ người chủ của đàn lạc đà mà không xác định thêm danh tính.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cô” theo ngữ cảnh người phụ nữ trẻ; “vò” phù hợp với dụng cụ đựng nước thời cổ hơn “bình”. Dấu chân chú [a] được đặt ngay sau “máng”.
