    issue: Cấu trúc ‘Xin cho ... chính là người’ hơi gượng
    rationale: Bỏ ‘chính’ làm câu cầu xin tiếng Việt mạch lạc hơn mà không đổi sắc thái cầu nguyện của וְהָיָה.
