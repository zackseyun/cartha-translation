revisions:
- from: 'Xin cho cô gái mà con nói: “Xin hạ vò xuống cho tôi uống,” và cô ấy đáp: “Mời ông uống; tôi cũng sẽ cho lạc đà của ông uống”—chính là người Ngài đã định cho Y-sác, tôi tớ Ngài.[a] Nhờ cô ấy[b], con sẽ biết rằng Ngài đã tỏ lòng thành tín với chủ con.'
  to: 'Xin cho cô gái mà con nói: “Xin hạ vò xuống cho tôi uống,” và cô ấy đáp: “Mời ông uống; tôi cũng sẽ cho lạc đà của ông uống” là người Ngài đã định cho Y-sác, tôi tớ Ngài.[a] Nhờ cô ấy[b], con sẽ biết rằng Ngài đã tỏ lòng nhân từ với chủ con.'
  rationale: Sửa nhẹ cấu trúc câu cho tự nhiên hơn và thay ‘lòng thành tín’ bằng ‘lòng nhân từ’ để phản ánh đầy đủ hơn חֶסֶד trong ngữ cảnh. Giữ cách đọc đồng vị của cụm ‘cho Y-sác, tôi tớ Ngài’ và chú thích thay thế để không xóa mơ hồ cú pháp được nêu trong hồ sơ.
  reviewer_model: gpt-5.6-terra
