  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: vi
  text: 'Xin cho cô gái mà con nói: “Xin hạ vò xuống cho tôi uống,” và cô ấy đáp: “Mời ông uống; tôi cũng sẽ cho lạc đà của ông uống” là người Ngài đã định cho Y-sác, tôi tớ Ngài.[a] Nhờ cô ấy[b], con sẽ biết rằng Ngài đã tỏ lòng nhân từ với chủ con.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho tôi tớ Ngài, cho Y-sác,” nếu hiểu hai cụm này tách biệt thay vì coi “Y-sác” là phần đồng vị với “tôi tớ Ngài”.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể hiểu: “Nhờ dấu hiệu này” hoặc “Qua việc này”. Tiếng Hê-bơ-rơ nói sát nghĩa là “nhờ cô ấy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Xin cho
  rationale: Trong lời cầu nguyện, cụm này mở đầu một lời thỉnh cầu; “Xin cho” diễn đạt tự nhiên sắc thái mong ước mà không dùng lối văn cổ.
- source_word: הַנַּעֲרָ
  choice: cô gái
  rationale: Chỉ một người nữ trẻ tuổi; “cô gái” là cách gọi tự nhiên trong tiếng Việt hiện đại và không hàm ý trẻ con.
- source_word: הַטִּי נָא כַדֵּךְ
  choice: Xin hạ vò xuống
  rationale: הטה diễn tả động tác nghiêng hoặc hạ vật đựng nước để người khác uống; נָא được thể hiện bằng “xin”.
- source_word: וְאֶשְׁתֶּה
  choice: cho tôi uống
  rationale: Diễn đạt tự nhiên mục đích của việc hạ vò xuống và giữ sắc thái yêu cầu.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: tôi cũng sẽ cho lạc đà của ông uống
  rationale: Dạng Hiphil của שׁקה có nghĩa là cho uống; cách dịch này rõ ràng và tự nhiên hơn lối nói “tưới lạc đà” trong tiếng Việt.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: chính là người Ngài đã định
  rationale: Trong ngữ cảnh này, הוכיח mang nghĩa chỉ định hoặc xác nhận người được chọn; “đã định” giữ được ý đó mà không giải thích quá mức cơ chế của dấu hiệu.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: cho Y-sác, tôi tớ Ngài
  rationale: Hai cụm với לְ có thể được hiểu theo quan hệ đồng vị; trật tự tiếng Việt được đảo lại để tự nhiên và xác định Y-sác là “tôi tớ Ngài”. Cách phân tích hai đối tượng được ghi ở chú thích.
- source_word: וּבָהּ אֵדַע
  choice: Nhờ cô ấy, con sẽ biết
  rationale: Hậu tố giống cái số ít quy chiếu trực tiếp về cô gái; cô là phương tiện hay dấu hiệu để người cầu nguyện nhận biết.
- source_word: חֶסֶד
  choice: lòng thành tín
  rationale: Trong ngữ cảnh này, חֶסֶד nói đến sự nhân từ gắn với lòng trung thành bền vững; “lòng thành tín” giữ chiều sâu quan hệ mà không áp đặt một thuật ngữ giao ước chuyên biệt.
- source_word: עִם אֲדֹנִי
  choice: với chủ con
  rationale: Giữ gần giới từ עִם (“với”) và tạo câu tiếng Việt tự nhiên với động từ “tỏ”.
theological_decisions:
- issue: Quan hệ cú pháp trong לְעַבְדְּךָ לְיִצְחָק
  choice: 'Hiểu là đồng vị: “cho Y-sác, tôi tớ Ngài”.'
  alternative: 'Hiểu thành hai cụm: “cho tôi tớ Ngài, cho Y-sác”, trong đó “tôi tớ Ngài” có thể chỉ người đang cầu nguyện.'
  rationale: Cách hiểu đồng vị phù hợp trực tiếp với việc Y-sác là người sẽ nhận người vợ và được các bản dịch cổ hỗ trợ; tuy nhiên, cấu trúc Hê-bơ-rơ cho phép cách ngắt khác nên được bảo lưu trong chú thích.
- issue: Sắc thái của חֶסֶד
  choice: lòng thành tín
  alternative: lòng nhân từ; ân tình; tình yêu bền vững
  rationale: “Lòng thành tín” nhấn mạnh sự tốt lành trung kiên trong quan hệ nhưng không biến từ này thành một công thức thần học kỹ thuật.
- issue: Sở chỉ của וּבָהּ
  choice: “Nhờ cô ấy”, quy chiếu về cô gái.
  alternative: “Nhờ dấu hiệu này” hoặc “qua việc này”.
  rationale: Hậu tố giống cái số ít tự nhiên nhất quy chiếu về הַנַּעֲרָ, nhưng ý nghĩa rộng hơn là toàn bộ dấu hiệu vẫn có thể được hiểu và được nêu trong chú thích.
translation_notes:
  register: Văn phong cầu nguyện trang trọng nhưng hiện đại. Dùng “Ngài/con” khi người đầy tớ thưa với Đức Chúa Trời, “tôi/ông” trong lời ông nói với cô gái, và “vò” cho dụng cụ chứa nước trong bối cảnh cổ đại. Câu được tổ chức lại vừa phải để tiếng Việt trôi chảy nhưng vẫn giữ chuỗi điều kiện và dấu hiệu của nguyên văn.
