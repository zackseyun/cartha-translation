base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: vi
  text: Bây giờ, nếu các ông định bày tỏ lòng nhân từ và sự thành tín đối với chủ tôi[a], xin hãy cho tôi biết; còn nếu không, cũng xin cho tôi biết, để tôi có thể rẽ sang bên phải hoặc bên trái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng yêu thương bền vững và sự thành tín.” Cặp từ Hê-bơ-rơ này thường chỉ lòng nhân từ trung kiên và đáng tin cậy trong một mối quan hệ cam kết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Dẫn vào kết luận thực tế ngay trước mắt trong lời người đầy tớ; cách nói tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: nếu các ông định ... đối đãi
  rationale: Thành ngữ gồm yếu tố tồn tại và phân từ diễn tả ý định hoặc sự sẵn lòng hành động trong tình huống sắp được quyết định.
- source_word: חֶסֶד וֶאֱמֶת
  choice: lòng nhân từ và sự thành tín
  rationale: 'Giữ hai phương diện của cặp từ Hê-bơ-rơ: lòng tốt có tính gắn bó và sự đáng tin cậy, trung thành.'
- source_word: אֶת אֲדֹנִי
  choice: đối đãi với chủ tôi
  rationale: Diễn đạt tự nhiên đối tượng được hưởng lòng nhân từ và sự thành tín.
- source_word: הַגִּידוּ לִי
  choice: xin hãy cho tôi biết
  rationale: Mệnh lệnh yêu cầu một câu trả lời trực tiếp; thêm 'xin' phù hợp lời thỉnh cầu lịch sự trong ngữ cảnh.
- source_word: וְאִם לֹא
  choice: còn nếu không
  rationale: Thể hiện rõ sự đối lập giữa hai khả năng mà vẫn giữ mạch hội thoại tự nhiên.
- source_word: וְאֶפְנֶה
  choice: để tôi có thể rẽ sang
  rationale: Phản ánh sắc thái chủ ý/hệ quả của dạng cohortative mà không biến lời nói thành một lời khẳng định tuyệt đối.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: bên phải hoặc bên trái
  rationale: Giữ hình ảnh phương hướng của nguyên văn, đồng thời người đọc vẫn hiểu đây là việc chọn một hướng hành động khác.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ông” vì người đầy tớ đang nói với gia đình Rê-bê-ca; giữ nguyên hình ảnh “bên phải hoặc bên trái” thay vì diễn giải thành một hướng hành động khác.
