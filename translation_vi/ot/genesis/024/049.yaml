  to: Bây giờ, nếu các ông định bày tỏ lòng nhân từ và sự thành tín đối với chủ tôi[a], xin hãy cho tôi biết; còn nếu không, cũng xin cho tôi biết, để tôi có thể rẽ sang bên phải hoặc bên trái.
