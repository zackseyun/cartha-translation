  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: vi
  text: 'Nhưng anh trai và mẹ cô nói: “Hãy để cô gái ở lại với chúng tôi ít ngày, hoặc mười ngày[a]; rồi cô ấy có thể đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ sát nghĩa là “những ngày, hoặc mười”. Cụm này có lẽ có nghĩa là “ít ngày, hoặc mười ngày”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng ... nói
  rationale: Liên từ waw tiếp nối mạch kể chuyện, đồng thời lời này tương phản với yêu cầu lên đường ngay của người đầy tớ trong câu trước; “Nhưng” diễn đạt tự nhiên cả quan hệ diễn tiến lẫn tương phản.
- source_word: אָחִיהָ וְאִמָּהּ
  choice: anh trai và mẹ cô
  rationale: Giữ danh từ số ít “anh/em trai” và trật tự của tiếng Hê-bơ-rơ. Trong ngữ cảnh, đây là anh trai của Rê-bê-ca, nên “anh trai” tự nhiên và rõ nghĩa hơn.
- source_word: תֵּשֵׁב
  choice: Xin để ... ở lại
  rationale: Động từ ישב có thể chỉ việc ngồi, cư ngụ hoặc ở lại; trong lời xin trì hoãn chuyến đi, “ở lại” là cách diễn đạt tự nhiên. “Xin để” thể hiện sắc thái đề nghị.
- source_word: הַנַּעֲרָ
  choice: cô gái
  rationale: נַעֲרָה chỉ một thiếu nữ hay phụ nữ trẻ. “Cô gái” là cách gọi hiện đại, trang trọng vừa phải và dễ hiểu trong tiếng Việt.
- source_word: אִתָּנוּ
  choice: với chúng tôi
  rationale: Chuyển trực tiếp cụm giới từ chỉ việc ở cùng họ.
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: ít ngày, hoặc mười ngày
  rationale: Nguyên văn có cấu trúc cô đọng “những ngày, hoặc mười”. “Ít ngày, hoặc mười ngày” truyền đạt thành ngữ tự nhiên mà vẫn giữ sự không hoàn toàn rõ ràng của cách nói gốc; chú thích nêu dạng sát chữ.
- source_word: אַחַר
  choice: sau đó
  rationale: Diễn đạt tự nhiên ý hành động xảy ra tiếp sau khoảng thời gian được đề nghị.
- source_word: תֵּלֵךְ
  choice: cô ấy sẽ đi
  rationale: Chủ thể theo ngữ cảnh là cô gái. Hình thức động từ có thể được hiểu như lời cho phép hoặc phát biểu về việc lên đường sau đó; “sẽ đi” giữ câu tự nhiên mà không nhấn quá mức một sắc thái mệnh lệnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “cô gái” thay cho những từ cổ như “thiếu nữ” trong lời thoại; giữ nhịp câu gần với cấu trúc Hê-bơ-rơ. Dấu chú thích được đặt sau toàn bộ câu vì chú thích giải thích cụm thời gian trong lời nói.
