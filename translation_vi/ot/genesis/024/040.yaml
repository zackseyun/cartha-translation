language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: vi
  text: 'Ông nói với tôi: “Yahweh, Đấng trước mặt Ngài tôi đã bước đi, sẽ sai thiên sứ của Ngài đi cùng anh và khiến hành trình của anh thành công[a]; anh sẽ lấy cho con trai tôi một người vợ từ dòng họ tôi[b] và từ nhà cha tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho đường đi của anh được hanh thông.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “gia tộc tôi”; từ Hê-bơ-rơ có thể chỉ một nhóm thân tộc rộng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước của Đức Chúa Trời dưới dạng chuyển tự, thay vì thay bằng một tước hiệu.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: tôi đã bước đi trước mặt Ngài
  rationale: Bảo tồn thành ngữ giao ước về đời sống được sống trước sự hiện diện và dưới cái nhìn của Đức Chúa Trời, không diễn giải thêm thành “sống trung tín”.
- source_word: מַלְאָכוֹ
  choice: thiên sứ của Ngài
  rationale: Trong ngữ cảnh này, từ ngữ chỉ sứ giả thuộc thiên giới được Yahweh sai đi; “thiên sứ” là cách diễn đạt tự nhiên và phù hợp.
- source_word: אִתָּךְ
  choice: đi cùng anh
  rationale: Diễn đạt ý đồng hành bằng tiếng Việt tự nhiên; đại từ “anh” phù hợp với người đầy tớ được Abraham sai đi.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: khiến hành trình của anh thành công
  rationale: Thể hiện nghĩa khiến cho thành công của dạng Hiphil và chuyển thành ngữ “con đường” sang nghĩa hành trình trong ngữ cảnh.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: anh sẽ lấy ... một người vợ
  rationale: Giữ thành ngữ hôn nhân của nguyên văn và làm rõ người vợ được lấy cho con trai Abraham, không hàm ý người đầy tớ cưới nàng.
- source_word: לִבְנִי
  choice: cho con trai tôi
  rationale: Dịch chính xác danh từ chỉ con trai và giữ quan hệ sở hữu của nguyên văn.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: từ dòng họ tôi
  rationale: “Dòng họ” truyền đạt một nhóm thân tộc rộng hơn gia đình hạt nhân và tự nhiên trong tiếng Việt hiện đại.
- source_word: וּמִבֵּית אָבִי
  choice: và từ nhà cha tôi
  rationale: Bảo tồn hình ảnh “nhà cha”, tức gia thất hoặc dòng phụ hệ, đồng thời giữ sắc thái Kinh Thánh của nguyên văn.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng dạng chuyển tự danh riêng để không thay danh giao ước bằng một tước hiệu và không áp đặt truyền thống hệ phái.
- issue: Ý nghĩa của cụm “đã bước đi trước mặt Ngài”
  choice: Giữ nguyên thành ngữ giao ước
  alternative: tôi đã sống trung tín trước mặt Ngài; tôi đã sống trong sự hiện diện của Ngài
  rationale: Nguyên văn gợi cả đời sống trong sự hiện diện của Đức Chúa Trời lẫn cách ăn ở trước mặt Ngài; bản dịch không thu hẹp sự căng nghĩa ấy bằng một lời diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các thành ngữ “bước đi trước mặt Ngài” và “nhà cha tôi” để bảo tồn sắc thái giao ước và cấu trúc thân tộc của nguyên văn; dùng “dòng họ” thay vì “gia đình” để tránh gợi phạm vi chỉ gia đình hạt nhân. Các ký hiệu chú thích được đặt đúng tại cụm từ mà chú thích giải thích.
