source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָהָ֗ם אֶל עַבְדּ/וֹ֙ זְקַ֣ן בֵּית֔/וֹ הַ/מֹּשֵׁ֖ל בְּ/כָל אֲשֶׁר ל֑/וֹ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֥חַת יְרֵכִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: vi
  text: 'Áp-ra-ham nói với người đầy tớ của mình, người lớn tuổi nhất trong nhà ông, người cai quản mọi thứ thuộc về ông[a]: “Xin hãy đặt tay anh dưới đùi tôi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người quản lý mọi tài sản của ông.”'
    reason: lexical_alternative
  - marker: b
    text: Đặt tay dưới đùi là một cử chỉ thề nguyện trang trọng thời xưa; câu này không giải thích ý nghĩa biểu tượng chính xác của cử chỉ ấy.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Diễn đạt tự nhiên động từ trần thuật nối tiếp trong tiếng Hê-bơ-rơ; văn cảnh đã thể hiện trình tự nên không cần thêm từ nối cứng nhắc.
- source_word: עַבְדּוֹ
  choice: người đầy tớ
  rationale: עֶבֶד có thể chỉ nô lệ hoặc đầy tớ; ở đây người này là viên quản gia thân tín trong nhà Áp-ra-ham, nên “người đầy tớ” vừa sát nghĩa vừa không xác định quá mức địa vị pháp lý.
- source_word: זְקַן בֵּיתוֹ
  choice: người cao tuổi nhất trong nhà ông
  rationale: Cụm từ nói đến tuổi tác hoặc thâm niên của người đầy tớ trong gia đình; cách dịch này giữ nghĩa trực tiếp và tự nhiên hơn “trưởng lão của nhà” trong tiếng Việt hiện đại.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: là người quản lý mọi tài sản của ông
  rationale: מֹשֵׁל mang ý cai quản hoặc điều hành. Trong bối cảnh gia đình, “quản lý” diễn đạt tự nhiên trách nhiệm đối với mọi thứ thuộc về Áp-ra-ham mà không làm giảm thẩm quyền của người ấy.
- source_word: שִׂים נָא
  choice: Xin hãy đặt
  rationale: Giữ sắc thái yêu cầu khẩn khoản hoặc lịch sự của tiểu từ נָא đi với mệnh lệnh.
- source_word: יָדְךָ
  choice: tay anh
  rationale: Đại từ ngôi hai giống đực số ít được chuyển thành “anh”, phù hợp lời một bậc trưởng thượng nói với người nam phục vụ thân tín.
- source_word: תַּחַת יְרֵכִי
  choice: dưới đùi tôi
  rationale: Dịch trực tiếp hình ảnh văn hóa đặc thù của nguyên văn; không diễn giải uyển ngữ hay xác định thêm ý nghĩa trong chính văn.
theological_decisions:
- issue: Ý nghĩa của cử chỉ đặt tay dưới đùi
  choice: Giữ nguyên cử chỉ trong chính văn và chỉ giải thích đây là cử chỉ thề nguyện cổ xưa trong chú thích.
  alternative: Diễn giải trong chính văn thành một lời thề hoặc gắn cử chỉ với một ý nghĩa biểu tượng cụ thể.
  rationale: Nguyên văn mô tả hành động nhưng không giải thích ý nghĩa tại câu này; giữ cách nói trực tiếp tránh áp đặt một cách giải thích thần học chưa được nêu rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Áp-ra-ham” theo lối phiên âm Kinh Thánh quen thuộc; “người đầy tớ” giữ độ rộng nghĩa của עֶבֶד, còn “quản lý” phù hợp bối cảnh gia đình. Các dấu chú thích [a], [b] đều được đặt ngay sau nội dung tương ứng.
