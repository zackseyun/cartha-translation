  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: vi
  text: 'Ông nói: “Đáng chúc tụng là Yahweh, Đức Chúa Trời của chủ tôi là Áp-ra-ham! Ngài đã không từ bỏ tình yêu bền vững và sự thành tín của Ngài đối với chủ tôi[a]. Còn tôi, Yahweh đã dẫn tôi trên đường đến nhà của các anh em của chủ tôi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng nhân từ và sự chân thật.” Cặp từ Hê-bơ-rơ này thường diễn tả tình yêu trung kiên và tính đáng tin cậy.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “anh em”; tại đây từ này chỉ những người nam thuộc họ hàng hoặc dòng tộc của Áp-ra-ham.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Đáng chúc tụng Yahweh
  rationale: Diễn đạt tự nhiên công thức ca ngợi bằng tính từ vị ngữ trong tiếng Hê-bơ-rơ, đồng thời giữ Yahweh là danh riêng của Đức Chúa Trời.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Đức Chúa Trời của Áp-ra-ham, chủ tôi
  rationale: Giữ rõ quan hệ sở hữu của chuỗi liên kết và cho thấy Áp-ra-ham chính là người chủ mà đầy tớ đang nói đến.
- source_word: לֹא עָזַב
  choice: đã không từ bỏ
  rationale: Giữ hình ảnh nguyên ngữ về việc không lìa bỏ hay rút lại lòng yêu thương và sự thành tín.
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: tình yêu bền vững và sự thành tín
  rationale: Phản ánh cặp từ chỉ tình yêu trung kiên và tính đáng tin cậy, không thu hẹp חֶסֶד thành một thuật ngữ giao ước chuyên biệt.
- source_word: מֵעִם אֲדֹנִי
  choice: Ngài dành cho chủ tôi
  rationale: Chuyển thành quan hệ hướng đến người thụ hưởng cho tự nhiên trong tiếng Việt; trong kết cấu với עזב, cụm này nói rằng Đức Chúa Trời không rút tình yêu và sự thành tín khỏi chủ của người nói.
- source_word: אָנֹכִי
  choice: Còn tôi
  rationale: Giữ sắc thái nhấn mạnh của đại từ độc lập đứng đầu mệnh đề.
- source_word: בַּדֶּרֶךְ נָחַנִי יְהוָה
  choice: Yahweh đã dẫn tôi trên đường
  rationale: Giữ cả hành động dẫn dắt của Yahweh và cụm chỉ hành trình, với trật tự tự nhiên trong tiếng Việt.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: đến nhà anh em của chủ tôi
  rationale: Giữ từ thân tộc giống đực số nhiều của nguyên ngữ; trong văn cảnh, từ này có thể chỉ những người nam cùng dòng họ hay rộng hơn là thân tộc của Áp-ra-ham.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng danh riêng bốn phụ âm của Đức Chúa Trời; phiên âm Yahweh giữ chức năng danh riêng thay vì thay bằng một tước hiệu.
- issue: Sắc thái của חֶסֶד וֶאֱמֶת
  choice: tình yêu bền vững và sự thành tín
  alternative: lòng nhân từ và sự chân thật; tình yêu giao ước và sự thành tín
  rationale: Cách dịch đã chọn giữ được lòng yêu thương trung kiên và tính đáng tin cậy của cặp từ, nhưng không áp đặt rằng câu này phải được hiểu riêng theo một hệ thống thần học giao ước.
- issue: Phạm vi nghĩa của אֲחֵי
  choice: anh em
  alternative: họ hàng; bà con
  rationale: Giữ cách gọi giống đực trong nguyên ngữ ở chính văn, đồng thời chú thích rằng phạm vi quy chiếu trong văn cảnh có thể rộng hơn anh em ruột.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đáng chúc tụng” cho lời ca ngợi, “chủ tôi” theo lời người đầy tớ, và giữ danh Yahweh nhất quán. Các cấu trúc sở hữu được điều chỉnh vừa đủ để tránh mơ hồ không chủ ý trong tiếng Việt.
