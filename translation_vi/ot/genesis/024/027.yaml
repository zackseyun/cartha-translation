revisions:
- from: 'Ông nói: “Đáng chúc tụng Yahweh, Đức Chúa Trời của Áp-ra-ham, chủ tôi! Ngài đã không từ bỏ tình yêu bền vững và sự thành tín[a] Ngài dành cho chủ tôi. Còn tôi, Yahweh đã dẫn tôi trên đường đến nhà anh em[b] của chủ tôi.”'
  to: 'Ông nói: “Đáng chúc tụng là Yahweh, Đức Chúa Trời của chủ tôi là Áp-ra-ham! Ngài đã không từ bỏ tình yêu bền vững và sự thành tín của Ngài đối với chủ tôi[a]. Còn tôi, Yahweh đã dẫn tôi trên đường đến nhà của các anh em của chủ tôi[b].”'
  rationale: Bản sửa chỉ làm rõ cú pháp và tăng tính tự nhiên của tiếng Việt, đồng thời giữ nguyên các lựa chọn dịch chủ yếu của bản nháp. «Đối với chủ tôi» phản ánh quan hệ mà cụm מֵעִם אֲדֹנִי nêu trong kết cấu với «không từ bỏ», không áp đặt một cách giải nghĩa thần học. «Các anh em» vẫn giữ thuật ngữ thân tộc giống đực số nhiều ở chính văn; chú thích bảo toàn phạm vi quy chiếu rộng hơn trong văn cảnh.
