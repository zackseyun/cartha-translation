  - severity: medium
    issue: Quan hệ giữa Áp-ra-ham và «chủ tôi» chưa rõ do cách đặt dấu phẩy.
    rationale: Trong «Đức Chúa Trời của Áp-ra-ham, chủ tôi», phần sau dấu phẩy có thể được đọc như hô ngữ. «Đức Chúa Trời của chủ tôi là Áp-ra-ham» giữ rõ chuỗi nguyên ngữ «God of my master Abraham».
  - severity: low
    issue: Vị trí ký hiệu chú thích a quá hẹp.
    rationale: Chú thích giải thích cả cặp חֶסֶד וֶאֱמֶת, nên ký hiệu cần đặt sau «tình yêu bền vững và sự thành tín», không chỉ sau thành tố thứ hai.
