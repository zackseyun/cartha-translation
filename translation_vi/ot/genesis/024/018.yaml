  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: vi
  text: 'Nàng nói: “Xin ngài[a] uống đi.” Rồi nàng vội hạ vò xuống tay mình và cho ngài uống.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thưa ông”. Tiếng Hê-bơ-rơ sát nghĩa là “chủ tôi”, nhưng ở đây được dùng như một cách xưng hô kính trọng với một người nam.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: uống đi
  rationale: Động từ mệnh lệnh ngôi hai giống đực số ít; “uống đi” giữ được lời mời trực tiếp và ngắn gọn trong tiếng Việt.
- source_word: אֲדֹנִי
  choice: ngài
  rationale: Trong ngữ cảnh này, đây là cách xưng hô kính trọng với một người nam, không phải danh xưng dành cho Đức Chúa Trời. “Ngài” diễn đạt sự kính trọng tự nhiên; chú thích bảo lưu nghĩa sát chữ và phương án “thưa ông”.
- source_word: וַתְמַהֵר
  choice: nàng vội
  rationale: Động từ diễn tả hành động khẩn trương; “vội” tự nhiên và giữ được nhịp kể nhanh của nguyên văn.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: hạ vò xuống
  rationale: Diễn tả việc đưa chiếc vò từ vị trí đang mang xuống thấp hơn. “Vò” phù hợp với dụng cụ đựng nước trong bối cảnh giếng.
- source_word: עַל יָדָהּ
  choice: trên tay
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ là “trên tay,” không đưa thêm chi tiết “từ vai xuống” vốn không xuất hiện trong câu này.
- source_word: וַתַּשְׁקֵהוּ
  choice: cho ông uống
  rationale: Dạng Hiphil của שׁקה có nghĩa khiến hoặc cho ai uống; cách dịch này tự nhiên và thể hiện đúng ý tác động.
