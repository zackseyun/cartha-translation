  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: vi
  text: Nhưng phải đi đến nhà cha tôi và gia tộc tôi[a], rồi cưới vợ cho con trai tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “họ hàng tôi” hoặc “đại gia đình tôi.” Từ Hê-bơ-rơ chỉ một nhóm thân tộc mở rộng, không chỉ gia đình gần gũi trong cùng một nhà.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Nhưng ... phải
  rationale: Trong lời thề và thế đối lập với điều cấm ở câu trước, cụm này mang sắc thái chuyển hướng nhấn mạnh chứ không phải một điều kiện đơn thuần. Cách dịch này tự nhiên trong tiếng Việt và không thêm sắc thái bác bỏ quá mạnh.
- source_word: בֵּית אָבִי
  choice: nhà cha tôi
  rationale: Giữ hình ảnh 'nhà của cha tôi' trong nguyên ngữ, đồng thời có thể bao hàm cả nhà và hộ tộc trong cách nói về quan hệ thân thuộc.
- source_word: תֵּלֵךְ
  choice: anh phải đi
  rationale: Thể chưa hoàn thành ở đây có lực chỉ thị/ràng buộc trong lời căn dặn; 'phải đi' diễn đạt rõ nghĩa vụ bằng tiếng Việt hiện đại.
- source_word: מִשְׁפַּחְתִּי
  choice: gia tộc tôi
  rationale: Từ Hê-bơ-rơ chỉ một nhóm thân tộc mở rộng, rộng hơn gia đình hạt nhân; 'gia tộc' giữ được phạm vi ấy.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: rồi cưới một người vợ cho con trai tôi
  rationale: Trong bối cảnh sắp đặt hôn nhân, לקח אשה nói đến việc lấy/cưới vợ; cấu trúc 'cho con trai tôi' làm rõ người con là người sẽ nhận người nữ làm vợ, không phải người đầy tớ.
theological_decisions: []
