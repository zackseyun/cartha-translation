  register: Dùng tiếng Việt hiện đại, trang trọng vừa phải. Đại từ “anh—tôi” giúp lời kể trực tiếp dễ hiểu hơn lối “ngươi—ta”; “gia tộc” giữ sắc thái thân tộc mở rộng của nguyên ngữ.
