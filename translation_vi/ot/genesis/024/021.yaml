  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: vi
  text: Người đàn ông im lặng quan sát cô để biết Yahweh có làm cho chuyến đi của ông thành công hay không.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người đàn ông nhìn cô với vẻ kinh ngạc trong im lặng, để biết Yahweh có làm cho đường đi của ông được thuận lợi hay không.”'
    reason: Động từ מִשְׁתָּאֵה có thể hàm ý nhìn chăm chú với sự kinh ngạc; דֶּרֶךְ cũng có thể được dịch sát là “đường đi”.
lexical_decisions:
- source_word: הָאִישׁ
  choice: Người đàn ông
  rationale: Dịch trực tiếp danh từ אִישׁ; dù văn cảnh cho biết đây là người đầy tớ của Áp-ra-ham, câu Hê-bơ-rơ dùng danh từ chung “người đàn ông”.
- source_word: מִשְׁתָּאֵה לָהּ
  choice: quan sát cô
  rationale: Phân từ diễn tả hành động chăm chú nhìn đang tiếp diễn; “quan sát” tự nhiên trong tiếng Việt và không khẳng định quá mức sắc thái kinh ngạc vốn có thể hiện diện.
- source_word: מַחֲרִישׁ
  choice: lặng lẽ
  rationale: Diễn đạt trạng thái giữ im lặng trong khi quan sát bằng một trạng từ tự nhiên.
- source_word: לָדַעַת
  choice: để biết
  rationale: Giữ trực tiếp ý nghĩa mục đích của động từ nguyên mẫu.
- source_word: הַהִצְלִיחַ
  choice: có làm cho ... thành công
  rationale: 'Giữ lực gây khiến của thể Hiphil: Yahweh khiến chuyến đi đạt kết quả.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: דַּרְכּוֹ
  choice: chuyến đi của ông
  rationale: דֶּרֶךְ nghĩa đen là “đường/lối”; trong văn cảnh này, từ ấy chỉ chuyến đi hoặc công việc người đàn ông đang thực hiện.
- source_word: אִם לֹא
  choice: hay không
  rationale: Diễn đạt tự nhiên vế hoàn tất của câu hỏi gián tiếp trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn dùng trực tiếp Tứ Tự Danh; “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Ai làm cho chuyến đi thành công
  choice: Yahweh là chủ thể gây khiến
  alternative: chuyến đi tự diễn ra thuận lợi
  rationale: Thể Hiphil của צלח trình bày Yahweh là Đấng làm cho đường đi thành công; bản dịch giữ quan hệ tác nhân này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để quy chiếu người đàn ông, “cô” cho người phụ nữ trẻ; giữ danh Yahweh. Dấu chú thích [a] được đặt trong chính văn.
