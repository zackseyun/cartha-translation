  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng tên riêng theo lối phiên âm Việt phổ biến. Dấu chấm phẩy làm rõ hai sự việc liên tiếp và giảm sự mơ hồ về chủ thể.
