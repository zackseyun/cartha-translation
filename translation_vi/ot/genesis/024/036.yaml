base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: vi
  text: Sa-ra, vợ của chủ tôi, đã sinh cho chủ tôi một con trai khi bà đã già; và ông đã trao cho người con ấy tất cả những gì mình có.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: đã sinh
  rationale: Động từ Qal trong mạch kể quá khứ; cách diễn đạt tự nhiên, trang trọng và nêu rõ việc sinh con.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: vợ của chủ tôi
  rationale: Giữ nguyên quan hệ sở thuộc và lời xưng hô kính trọng của người đầy tớ.
- source_word: בֵן
  choice: một con trai
  rationale: Danh từ không có mạo từ; tiếng Việt cần từ chỉ số lượng để lời thông báo sinh con được tự nhiên.
- source_word: לַאדֹנִי
  choice: cho chủ tôi
  rationale: Giới từ ל biểu thị quan hệ hoặc lợi ích trong thành ngữ sinh con cho ai; cách dịch này tự nhiên trong tiếng Việt.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: khi bà đã già
  rationale: Cụm Hê-bơ-rơ theo sát chữ là 'sau tuổi già của bà', nhưng mang ý việc sinh con xảy ra khi Sa-ra đã cao tuổi; bản dịch truyền đạt rõ ý thời gian mà không cường điệu thành một thời điểm sau khi tuổi già kết thúc.
- source_word: וַיִּתֶּן לוֹ
  choice: và ông đã trao cho người con ấy
  rationale: Chủ thể ngầm là Áp-ra-ham, còn đại từ gián tiếp chỉ người con vừa được nhắc đến; diễn đạt tường minh vừa phải để tránh nhầm đại từ trong tiếng Việt.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: tất cả những gì mình có
  rationale: Giữ trọn ý toàn bộ tài sản thuộc về Áp-ra-ham bằng lối nói tiếng Việt tự nhiên.
theological_decisions: []
