    rationale: Cụm לִקְרָאתֵנוּ trong ngữ cảnh này có nghĩa là đi để đón/gặp chúng ta, chứ không chỉ nêu hướng chuyển động chung.
  - severity: low
    issue: “khăn che mặt” có thể thu hẹp phạm vi che phủ, đồng thời gây lặp với “che mình lại”.
    rationale: הַצָּעִיף là khăn/mạng che phủ, còn וַתִּתְכָּס nói nàng tự che phủ bằng vật ấy; cách diễn đạt “tấm khăn choàng ... che mình” tự nhiên hơn và giữ nghĩa rộng.
