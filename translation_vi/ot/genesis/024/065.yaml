base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: vi
  text: 'Cô hỏi người đầy tớ: “Người đàn ông kia đang đi ngoài đồng để gặp chúng ta là ai?” Người đầy tớ đáp: “Đó là chủ tôi.” Bấy giờ, cô lấy tấm khăn choàng và che mình lại.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cô trùm khăn che mình.” Động từ Hê-bơ-rơ mang nghĩa phản thân, nói rằng cô dùng tấm khăn để che phủ chính mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: người đầy tớ
  rationale: Trong mạch truyện, từ này chỉ người quản gia thuộc nhà Áp-ra-ham. “Người đầy tớ” tự nhiên trong tiếng Việt và vẫn phản ánh quan hệ chủ-tớ mà không nhấn mạnh quá mức tình trạng nô lệ.
- source_word: הָאִישׁ הַלָּזֶה
  choice: người đàn ông kia
  rationale: Cụm từ chỉ một người nam cụ thể mà Rê-bê-ca nhìn thấy ở ngoài đồng; “kia” phù hợp với khoảng cách thị giác trong tiếng Việt.
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: đang đi ngoài đồng về phía chúng ta
  rationale: Giữ sắc thái tiếp diễn của phân từ הֹלֵךְ và hướng chuyển động của לִקְרָאתֵנוּ. “Về phía chúng ta” tự nhiên hơn “để gặp chúng ta” trong câu hỏi quan sát từ xa, đồng thời không khẳng định quá mức ý định của người đang đi.
- source_word: הוּא אֲדֹנִי
  choice: Đó là chủ tôi
  rationale: אֲדֹנִי ở đây chỉ chủ nhân con người của người đầy tớ. “Chủ tôi” diễn đạt rõ quan hệ xã hội, không gợi một tước hiệu thần thánh.
- source_word: הַצָּעִיף
  choice: khăn che mặt
  rationale: צעיף là tấm khăn hoặc mạng dùng để che phủ; “khăn che mặt” rõ nghĩa đối với độc giả Việt hiện đại và hợp với hành động kế tiếp.
- source_word: וַתִּתְכָּס
  choice: che mình lại
  rationale: 'Dạng động từ mang nghĩa phản thân: cô dùng tấm khăn vừa lấy để che phủ chính mình. Cách dịch giữ đối tượng che phủ rộng theo nguyên văn, không thu hẹp chắc chắn thành chỉ khuôn mặt.'
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cô” vì nhân vật nữ đã rõ trong ngữ cảnh; tránh lặp tên không có trong chính câu Hê-bơ-rơ. Chọn “kia” theo cách chỉ xuất tự nhiên của tiếng Việt.
