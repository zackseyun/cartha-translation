  text: וְ/הַֽ/נַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה וְ/אִ֖ישׁ לֹ֣א יְדָעָ֑/הּ וַ/תֵּ֣רֶד הָ/עַ֔יְנָ/ה וַ/תְּמַלֵּ֥א כַדָּ֖/הּ וַ/תָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: vi
  text: Cô gái ấy có dung mạo rất xinh đẹp. Nàng còn trinh; chưa từng có người đàn ông nào biết nàng[a]. Nàng xuống chỗ mạch nước[b], múc đầy bình rồi đi lên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa là chưa từng có người đàn ông nào có quan hệ tình dục với nàng; nguyên văn Hê-bơ-rơ nói: “chưa từng có người đàn ông nào biết nàng.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “nguồn nước” hoặc “suối”; từ Hê-bơ-rơ ở đây không phải là từ thông thường chỉ “giếng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: cô gái ấy
  rationale: נַעֲרָה chỉ một người nữ trẻ, trong văn cảnh này đã đến tuổi kết hôn. “Cô gái ấy” tự nhiên trong tiếng Việt hiện đại và không cổ kính như “thiếu nữ”.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: có dung mạo rất xinh đẹp
  rationale: Cụm Hê-bơ-rơ nhấn mạnh vẻ đẹp nhìn thấy được; cách dịch này vừa giữ ý “về diện mạo” vừa tự nhiên, trang nhã.
- source_word: בְּתוּלָה
  choice: còn trinh
  rationale: בְּתוּלָה trong văn kể chuyện thường chỉ một trinh nữ. “Còn trinh” trực tiếp, rõ nghĩa và tự nhiên hơn cấu trúc danh từ “là một trinh nữ” trong câu tiếng Việt.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: chưa người đàn ông nào biết nàng
  rationale: Giữ lối nói giảm nói tránh của nguyên văn, trong đó יָדַע (“biết”) chỉ quan hệ tình dục; câu trước và chú thích giúp người đọc nhận ra nghĩa.
- source_word: הָעַיְנָה
  choice: xuống bên mạch nước
  rationale: עַיִן ở đây chỉ nguồn hay mạch nước. Thêm “bên” giúp câu tiếng Việt tránh gợi ý rằng nàng đi xuống vào trong nước, trong khi vẫn giữ hướng chuyển động của nguyên văn.
- source_word: כַדָּהּ
  choice: bình
  rationale: כַּד là bình dùng để lấy và đựng nước. “Bình” ngắn gọn, tự nhiên trong văn cảnh; sở hữu đã rõ từ chủ thể và hành động.
- source_word: וַתְּמַלֵּא כַדָּהּ
  choice: múc đầy bình
  rationale: Diễn đạt tự nhiên hành động lấy nước cho đầy bình; “nước” được hàm ý rõ bởi địa điểm là mạch nước.
- source_word: וַתָּעַל
  choice: rồi đi lên
  rationale: עָלָה đối ứng với hành động đi xuống trước đó. “Đi lên” giữ góc nhìn không xác định của nguyên văn tốt hơn việc tự chọn “trở lên” hay “quay lại”.
theological_decisions:
- issue: Ý nghĩa của “biết” trong וְאִישׁ לֹא יְדָעָהּ
  choice: Giữ nguyên uyển ngữ “biết nàng” trong câu chính và giải thích ở chú thích.
  alternative: Dịch thẳng là “chưa từng quan hệ tình dục với người đàn ông nào”.
  rationale: Nguyên văn vừa khẳng định tình trạng đồng trinh vừa dùng lối nói uyển chuyển. Giữ thành ngữ bảo toàn sắc thái văn chương và sự lặp ý có chủ ý, còn chú thích bảo đảm nghĩa không bị hiểu lầm.
translation_notes:
  register: Tiếng Việt hiện đại, trang nhã và dễ hiểu. Dùng “nàng” để duy trì giọng kể Kinh Thánh mà không quá cổ; chia mô tả thành hai câu để câu văn sáng rõ, đồng thời giữ nguyên quan hệ ý nghĩa và trật tự kể chuyện của tiếng Hê-bơ-rơ.
