revisions:
- from: Bấy giờ, người đầy tớ lấy mười con trong số lạc đà của chủ mình rồi đi; mọi thứ quý giá của chủ đều ở trong tay ông.[a] Ông đứng dậy, đi đến A-ram Na-ha-ra-im,[b] đến thành của Na-cô.[c]
  to: Bấy giờ, người đầy tớ lấy mười con lạc đà của chủ mình rồi đi, mang theo mọi thứ quý giá của chủ trong tay.[a] Ông đứng dậy và đi đến A-ram Na-ha-ra-im,[b] đến thành của Na-cô.[c]
  rationale: Sửa cú pháp để cụm chỉ «mọi thứ quý giá của chủ» bổ nghĩa minh bạch cho việc người đầy tớ lên đường, đồng thời bảo lưu hình ảnh Hê-bơ-rơ «trong tay» và sự dè dặt của chú thích về nghĩa quyền quản lý. Điều chỉnh cụm chỉ mười con lạc đà cho tiếng Việt hiện đại tự nhiên hơn, không thay đổi ý phân xuất. Giữ nguyên tên riêng, sự mơ hồ của «thành của Na-cô», và hai động từ tự sự nối tiếp.
