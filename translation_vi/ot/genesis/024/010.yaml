  text: וַ/יִּקַּ֣ח הָ֠/עֶבֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִ/גְּמַלֵּ֤י אֲדֹנָי/ו֙ וַ/יֵּ֔לֶךְ וְ/כָל ט֥וּב אֲדֹנָ֖י/ו בְּ/יָד֑/וֹ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אֶל אֲרַ֥ם נַֽהֲרַ֖יִם אֶל עִ֥יר נָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: vi
  text: Bấy giờ, người đầy tớ lấy mười con lạc đà của chủ mình rồi đi, mang theo mọi thứ quý giá của chủ trong tay.[a] Ông đứng dậy và đi đến A-ram Na-ha-ra-im,[b] đến thành của Na-cô.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “trong tay ông” có thể có nghĩa là thuộc quyền quản lý của ông; trong ngữ cảnh, có lẽ chỉ những vật quý ông mang theo làm quà.
    reason: lexical_alternative
  - marker: b
    text: A-ram Na-ha-ra-im theo tiếng Hê-bơ-rơ; theo truyền thống được gọi là “Mê-sô-pô-ta-mi” hoặc “A-ram Hai Sông”.
    reason: alternative_reading
  - marker: c
    text: Cũng có thể hiểu là “thành gắn với Na-cô”; nguyên văn không cho biết Na-cô là người sáng lập hay chỉ là người có liên hệ với thành ấy.
    reason: ambiguity
lexical_decisions:
- source_word: הָעֶבֶד
  choice: người đầy tớ
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ. Trong bối cảnh quản gia được chủ tín nhiệm này, “người đầy tớ” tự nhiên và không khẳng định quá mức địa vị pháp lý mà câu không nêu rõ.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: mười con trong số lạc đà của chủ mình
  rationale: 'Giữ sắc thái phân xuất của מִן: ông chọn mười con từ đàn lạc đà thuộc về chủ.'
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: mọi thứ quý giá của chủ đều ở trong tay ông
  rationale: טוּב trong ngữ cảnh chỉ những thứ tốt, quý hoặc tài sản; בְּיָדוֹ vừa giữ hình ảnh “trong tay” vừa có thể hàm ý thuộc quyền quản lý. Cách dịch không quyết định rằng ông mang theo toàn bộ tài sản của chủ.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Ông đứng dậy, đi
  rationale: Giữ hai động từ nối tiếp và nhịp kể của tiếng Hê-bơ-rơ; “đứng dậy” ở đây đánh dấu việc bắt đầu hành động có chủ đích.
- source_word: אֲרַם נַהֲרַיִם
  choice: A-ram Na-ha-ra-im
  rationale: Phiên âm địa danh Hê-bơ-rơ thay vì thay bằng tên địa lý truyền thống “Mê-sô-pô-ta-mi” hoặc dịch nghĩa “A-ram Hai Sông”.
- source_word: עִיר נָחוֹר
  choice: thành của Na-cô
  rationale: Phản ánh trực tiếp kết cấu sở hữu; cụm này có thể chỉ thành gắn với Na-cô mà không nhất thiết nói ông là người sáng lập.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Giữ sự lặp lại “rồi đi… đứng dậy, đi” của nguyên văn dù hơi khác lối diễn đạt thông thường, đồng thời dùng dấu chấm phẩy để câu tiếng Việt rõ hơn.
