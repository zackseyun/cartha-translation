  revision_rationale: Sửa hai đại từ ngôi thứ nhất để phản ánh đúng tình huống diễn ngôn của Sáng thế ký 24:44. Các chọn lựa khác của bản dịch được giữ nguyên vì trung thành với tiếng Hê-bơ-rơ và tự nhiên trong tiếng Việt hiện đại.
