  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: vi
  text: 'và nói với tôi: “Ông cũng hãy uống đi, tôi cũng sẽ múc nước cho lạc đà của ông,” thì nàng chính là người phụ nữ mà Yahweh đã chỉ định[a] cho con trai của chủ tôi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể được hiểu là “đã quyết định” hoặc “đã chọn”.
    reason: Giữ lại phạm vi nghĩa của הֹכִיחַ trong ngữ cảnh Yahweh xác định người phụ nữ dành cho con trai của chủ người đầy tớ.
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: và nói với con
  rationale: Dạng hoàn thành Qal ngôi 3 giống cái số ít nằm trong lời thuật lại dấu hiệu mà người đầy tớ cầu xin. Tiếng Việt tự nhiên không bắt buộc đánh dấu thì; “nói với con” giữ được trình tự và ngôi xưng theo lời người đầy tớ.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: Ông cũng hãy uống đi
  rationale: “Cũng” bảo toàn sắc thái bổ sung của גַּם cùng sự nhấn mạnh từ đại từ אַתָּה; “hãy… đi” diễn đạt mệnh lệnh trực tiếp một cách tự nhiên, lịch sự.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: tôi cũng sẽ múc nước cho lạc đà của ông
  rationale: שׁאב có nghĩa là “múc”; thêm “nước” là điều ngữ cảnh đòi hỏi và giúp câu tiếng Việt rõ ràng. “Cũng” phản ánh וְגַם song song với vế trước.
- source_word: הִוא הָאִשָּׁה
  choice: thì nàng chính là người phụ nữ
  rationale: Đây là mệnh đề xác định trực tiếp. “Chính là” làm rõ lực nhận diện của đại từ הִוא; “người phụ nữ” không vội biến אִשָּׁה thành “vợ” trước khi cuộc hôn nhân được xác lập.
- source_word: אֲשֶׁר הֹכִיחַ
  choice: mà … đã chỉ định
  rationale: Hiphil của יכח trong ngữ cảnh xin dấu hiệu về sự lựa chọn có thể mang nghĩa quyết định, xác định hoặc chỉ định. “Đã chỉ định” tự nhiên và giữ ý về sự tuyển chọn của Đức Chúa Trời mà không hàm ý cưỡng ép.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng YHWH thay vì thay bằng một tước hiệu, qua đó giữ sự phân biệt có trong văn bản Hê-bơ-rơ.
- source_word: לְבֶן אֲדֹנִי
  choice: cho con trai của chủ con
  rationale: Giới từ לְ biểu thị quan hệ/hướng đến; cách diễn đạt này giữ đúng đối tượng là con trai của người chủ, đồng thời phù hợp với lời người đầy tớ thưa với Đức Chúa Trời.
theological_decisions:
- issue: Lực ngữ pháp của הִוא הָאִשָּׁה trong lời cầu xin
  choice: thì nàng chính là người phụ nữ
  alternative: xin nàng là người phụ nữ
  rationale: Bản thân mệnh đề Hê-bơ-rơ là mệnh đề định danh, không có hình thái mệnh lệnh hay cầu khiến. Ngữ cảnh toàn lời cầu xin có thể khiến người đọc hiểu sắc thái nguyện ước, nhưng bản dịch không nên thay mệnh đề xác định bằng một cầu khiến rõ nghĩa hơn nguyên văn.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng bốn phụ âm của Đức Chúa Trời; chuyển tự “Yahweh” bảo toàn danh riêng thay vì thay bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông–tôi” phù hợp với lời người phụ nữ nói với một người đàn ông xa lạ; “con–chủ con” duy trì quan hệ trong lời người đầy tớ thưa với Đức Chúa Trời. Dấu phẩy và “thì” cho thấy đây là phần kết của cấu trúc điều kiện bắt đầu ở câu trước.
