  to: Rê-bê-ca có một người anh em trai[a] tên là La-ban. La-ban chạy ra ngoài, đến chỗ người đàn ông ấy bên suối[b].
  rationale: Chỉ thay “một người anh em” bằng “một người anh em trai” để tiếng Việt hiện đại rõ nghĩa và tự nhiên hơn. Bản sửa vẫn giữ tính mơ hồ của אָח về thứ bậc tuổi, được giải thích ở chú thích a; không thay đổi ý nghĩa hoặc cách hiểu không gian của câu.
