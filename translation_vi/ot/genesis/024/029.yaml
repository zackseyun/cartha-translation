base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: vi
  text: Rê-bê-ca có một người anh em trai[a] tên là La-ban. La-ban chạy ra ngoài, đến chỗ người đàn ông ấy bên suối[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có thể chỉ anh trai hoặc em trai; nguyên văn không cho biết La-ban lớn hay nhỏ tuổi hơn Rê-bê-ca.
    reason: lexical_ambiguity
  - marker: b
    text: 'Cũng có thể dịch sát cấu trúc Hê-bơ-rơ: “đến chỗ người đàn ông ấy, đến suối.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: Rê-bê-ca có một người anh em
  rationale: Cấu trúc לְ chỉ sự sở hữu được diễn đạt tự nhiên là “có”. אָח chỉ anh hoặc em trai nhưng không cho biết lớn hay nhỏ tuổi, nên “người anh em” giữ được tính không xác định ấy.
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: tên là La-ban
  rationale: Diễn đạt tự nhiên công thức định danh Hê-bơ-rơ “và tên người ấy là La-ban”, đồng thời ghép gọn với mệnh đề trước.
- source_word: וַ/יָּרָץ ... הַ/חוּצָ/ה
  choice: chạy ra ngoài
  rationale: וַיָּרָץ có nghĩa cơ bản là “chạy”, còn הַחוּצָה chỉ hướng ra phía ngoài; kết hợp thành cụm tiếng Việt tự nhiên.
- source_word: אֶל הָ/אִישׁ
  choice: đến chỗ người đàn ông ấy
  rationale: Giữ danh từ chung “người đàn ông” của nguyên văn thay vì giải thích đó là đầy tớ của Áp-ra-ham; “ấy” giúp liên kết với người đã xuất hiện trong văn cảnh.
- source_word: אֶל הָ/עָיִן
  choice: bên suối
  rationale: עַיִן ở đây là mạch nước hay suối, khác với từ chỉ giếng. Trong chuỗi chỉ hướng của câu, “bên suối” diễn đạt tự nhiên vị trí nơi người đàn ông đang ở, trong khi chú thích bảo lưu cách hiểu sát cấu trúc hơn.
