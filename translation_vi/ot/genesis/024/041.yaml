  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: vi
  text: Khi anh đến với gia tộc tôi, anh sẽ được miễn khỏi lời thề của tôi; nếu họ không trao cô ấy cho anh, anh cũng sẽ được miễn khỏi lời thề của tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời nguyền của tôi”; từ Hê-bơ-rơ có thể chỉ một lời thề kèm theo lời nguyền hoặc chế tài nếu vi phạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: được miễn
  rationale: Trong ngữ cảnh pháp lý của lời thề, hai từ này nói đến việc được giải trừ trách nhiệm hay nghĩa vụ, chứ không chủ yếu nói đến sự vô tội về đạo đức. Cùng một cách dịch được dùng cho hai vế song song.
- source_word: מֵאָלָתִי
  choice: khỏi lời thề của tôi
  rationale: אָלָה ở đây chỉ lời thề có kèm chế tài hay lời nguyền hàm ẩn. Trọng tâm của câu chuyện là nghĩa vụ mà Áp-ra-ham buộc người đầy tớ phải thề, nên “lời thề” phù hợp nhất trong chính văn.
- source_word: כִּי
  choice: khi
  rationale: Từ này giới thiệu hoàn cảnh mà trong đó người đầy tớ được miễn nghĩa vụ; “khi” giữ được sắc thái thời gian, dù câu cũng có hàm ý điều kiện.
- source_word: תָבֹא אֶל מִשְׁפַּחְתִּי
  choice: anh đến với gia tộc tôi
  rationale: מִשְׁפָּחָה chỉ đại gia đình hay thị tộc. “Gia tộc” tự nhiên trong tiếng Việt và diễn đạt rõ phạm vi rộng hơn gia đình hạt nhân.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: và nếu họ không trao cô ấy cho anh
  rationale: Nguyên văn không nêu tân ngữ, nhưng ngữ cảnh xác định đó là người nữ được hỏi cưới. Tiếng Việt cần bổ sung “cô ấy” để câu tự nhiên và rõ nghĩa; “trao ... cho” phản ánh cách nói về việc thu xếp hôn nhân.
theological_decisions:
- issue: Ý nghĩa của אָלָה trong bối cảnh lời thề
  choice: lời thề
  alternative: lời nguyền
  rationale: Từ Hê-bơ-rơ có thể bao gồm lời nguyền hoặc chế tài đi kèm lời thề, nhưng tại đây trọng tâm là việc người đầy tớ được giải trừ nghĩa vụ đã tuyên thệ. Chú thích bảo tồn sắc thái còn lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh” theo lời người chủ nói với người đầy tớ trong diễn ngôn trực tiếp; “gia tộc” giữ được nghĩa đại gia đình. Dấu chú thích đặt sau lần xuất hiện cuối của cụm từ liên quan để không làm nặng câu.
