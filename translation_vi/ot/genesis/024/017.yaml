translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người đầy tớ” theo ngữ cảnh gia nhân được ủy thác; dùng “cô” vì người được nói đến là một phụ nữ trẻ. Dấu chú thích [a] được đặt ngay sau động từ dẫn lời.
