  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: vi
  text: 'Người đầy tớ chạy đến gặp cô và nói[a]: “Xin cho tôi uống một ít nước từ vò của cô.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin cho tôi một ít nước từ vò của cô để uống.” Mệnh lệnh trong tiếng Hê-bơ-rơ có thể được diễn đạt là “cho tôi uống” hoặc “cho tôi nước để uống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: chạy
  rationale: Động từ רוץ ở thể tự sự chỉ hành động chạy; “chạy” tự nhiên và giữ được tính tức thời của câu chuyện.
- source_word: הָעֶבֶד
  choice: người đầy tớ
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ. Trong ngữ cảnh này, người ấy là gia nhân được Áp-ra-ham tín nhiệm và sai đi; “người đầy tớ” phù hợp mà không nhấn mạnh quá mức địa vị lệ thuộc.
- source_word: לִקְרָאתָהּ
  choice: đến gặp cô
  rationale: Cấu trúc לִקְרַאת với hậu tố diễn tả chuyển động hướng đến để gặp một người; “đến gặp cô” là cách nói tự nhiên trong tiếng Việt.
- source_word: וַיֹּאמֶר
  choice: và nói
  rationale: Công thức tự sự thông thường dẫn vào lời nói trực tiếp; chủ thể đã rõ nên không cần lặp đại từ.
- source_word: הַגְמִיאִינִי
  choice: cho tôi uống
  rationale: Mệnh lệnh Hiphil của גמא với hậu tố ngôi thứ nhất số ít có thể mang nghĩa “cho tôi uống” hoặc “để tôi uống”; lựa chọn này tự nhiên trong lời thỉnh cầu tiếng Việt và vẫn giữ sắc thái khiến/cho uống.
- source_word: נָא
  choice: xin
  rationale: נָא đánh dấu lời thỉnh cầu lịch sự; “xin” phù hợp với văn phong trang trọng, tự nhiên.
- source_word: מְעַט מַיִם
  choice: một ít nước
  rationale: Giữ nguyên ý lượng nhỏ và sắc thái khiêm nhường của lời xin.
- source_word: מִכַּדֵּךְ
  choice: trong vò của cô
  rationale: כַּד là vật chứa dùng để lấy và mang nước. “Vò” phù hợp với bối cảnh cổ đại; giới từ “trong” diễn đạt nguồn nước từ vật chứa một cách tự nhiên trong tiếng Việt, còn “của cô” giữ hậu tố giống cái số ít.
