revisions:
- from: 'Người đầy tớ thưa với ông: “Có lẽ người phụ nữ ấy không muốn theo tôi đến xứ này. Vậy tôi có nên đưa con trai ông trở về xứ mà ông đã ra đi từ đó không?”[a]'
  to: 'Người đầy tớ thưa với ông: “Có lẽ người phụ nữ không muốn theo tôi đến xứ này. Vậy tôi có nên đưa con trai ông trở về xứ ông đã rời khỏi không?”[a]'
  rationale: Chỉnh duy nhất cách diễn đạt mệnh đề quan hệ ở cuối câu để tiếng Việt tự nhiên hơn, nhưng vẫn bảo toàn ý ‘xứ mà ông đã rời khỏi’. Chú thích được điều chỉnh để giải thích đúng chức năng nhấn mạnh của cấu trúc Hê-bơ-rơ mà không làm câu hỏi mang ý bắt buộc quá mức.
