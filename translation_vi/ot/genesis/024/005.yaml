base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: vi
  text: 'Người đầy tớ thưa với ông: “Có lẽ người phụ nữ không muốn theo tôi đến xứ này. Vậy tôi có nên đưa con trai ông trở về xứ ông đã rời khỏi không?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm “đưa ... trở về” được nhấn mạnh trong tiếng Hê-bơ-rơ bằng cách đặt nguyên mẫu tuyệt đối bên cạnh động từ đã chia. Cũng có thể dịch: “Vậy tôi có thật sự nên đưa con trai ông trở về xứ ông đã rời khỏi không?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: người đầy tớ
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ. Trong mạch truyện này, “người đầy tớ” tự nhiên hơn trong tiếng Việt, đồng thời vẫn thể hiện quan hệ dưới quyền trong gia đình Áp-ra-ham.
- source_word: אוּלַי
  choice: có lẽ
  rationale: Diễn tả một khả năng chưa chắc chắn; “có lẽ” là cách nói hiện đại, trang trọng vừa phải và tự nhiên.
- source_word: לֹא תֹאבֶה
  choice: không muốn
  rationale: Động từ אָבָה nói đến sự sẵn lòng hoặc ưng thuận. “Không muốn” truyền đạt rõ ý trong tiếng Việt mà không làm câu mang sắc thái pháp lý quá mức.
- source_word: הָאִשָּׁה
  choice: người phụ nữ ấy
  rationale: Nguyên văn chỉ nói “người phụ nữ”; thêm đại từ chỉ định “ấy” giúp tiếng Việt tự nhiên trong ngữ cảnh nói về người sẽ được tìm, nhưng không xác định trước nàng là vợ hay nhấn mạnh tuổi tác.
- source_word: לָלֶכֶת אַחֲרַי
  choice: theo tôi
  rationale: Nghĩa đen là “đi sau tôi”; “theo tôi” là tương đương tự nhiên và giữ được ý đi theo người đầy tớ.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: đến xứ này
  rationale: אֶרֶץ có thể là đất hoặc xứ. “Xứ” phù hợp với một vùng quê hương/lãnh thổ trong văn mạch và vẫn dễ hiểu.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: có nên đưa ... trở về ... không
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động trở về/đưa trở về. Trong câu hỏi cân nhắc này, “có nên ... không” giữ lực nghi vấn, còn “trở về” phản ánh động từ שוב.
- source_word: אֶת בִּנְךָ
  choice: con trai ông
  rationale: Cách dịch trực tiếp, rõ nghĩa và phù hợp đại từ xưng hô trong lời của đầy tớ với chủ.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: xứ mà ông đã ra đi từ đó
  rationale: Giữ khá sát ý יָצָא là “ra đi” và cấu trúc quan hệ có מִשָּׁם “từ đó”, dù tiếng Việt có phần lặp, nhằm bảo toàn điểm xuất phát được nguyên văn nêu rõ.
theological_decisions:
- issue: Hàm ý “trở về” đối với Y-sác, người chưa từng sống tại xứ ấy
  choice: Giữ “đưa con trai ông trở về”
  alternative: đưa con trai ông đến
  rationale: Nguyên văn dùng שוב, thường mang nghĩa trở lại/đưa trở lại. Cách nói có thể quy chiếu việc trở về quê gốc của gia đình chứ không nhất thiết khẳng định Y-sác từng ở đó; không nên âm thầm xóa sự căng thẳng này.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “thưa với ông” để phản ánh lời của một người dưới quyền nói với chủ; tránh từ cổ khó hiểu. Giữ “trở về” và chú thích sắc thái nhấn mạnh của cấu trúc Hê-bơ-rơ.
