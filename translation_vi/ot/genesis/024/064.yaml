  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: vi
  text: Rê-bê-ca ngước mắt lên, thấy Y-sác[a], rồi xuống khỏi lạc đà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát chữ: “rồi nàng ngã từ trên lạc đà xuống.” Ở đây, từ “ngã” trong tiếng Hê-bơ-rơ có lẽ được dùng theo nghĩa xuống khỏi lạc đà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ
  choice: ngước mắt lên
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ nhưng diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: וַתֵּרֶא
  choice: thấy
  rationale: Chuyển tải trực tiếp động từ chỉ sự nhìn thấy trong mạch kể liên tiếp.
- source_word: אֶת יִצְחָק
  choice: Y-sác
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: xuống khỏi lạc đà
  rationale: Động từ נפל thường có nghĩa là “ngã”, nhưng trong ngữ cảnh này cụm từ nhiều khả năng được dùng theo nghĩa xuống khỏi con vật đang cưỡi. Cách dịch này tránh khiến độc giả hiểu là một tai nạn, đồng thời ghi nhận nghĩa sát chữ trong chú thích.
