base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: vi
  text: 'Nàng vội hạ chiếc vò xuống khỏi người mình[a] và nói: “Xin ông uống đi; tôi cũng sẽ cho lạc đà của ông uống nữa.” Thế là tôi uống, và nàng cũng cho đàn lạc đà uống.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ trên nàng.” Câu này không nói rõ bộ phận cơ thể; ngữ cảnh cho thấy có lẽ chiếc vò được mang trên vai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Nàng vội
  rationale: Động từ מהר diễn tả hành động mau lẹ; “vội” tự nhiên trong lời kể tiếng Việt và giữ được nét nhấn mạnh về sự nhanh nhẹn của Rê-bê-ca.
- source_word: וַתּוֹרֶד כַּדָּהּ
  choice: hạ chiếc vò ... xuống
  rationale: Dạng Hiphil của ירד có nghĩa là làm cho đi xuống; “hạ ... xuống” diễn tả rõ việc nàng đưa chiếc vò từ vị trí đang mang xuống. כד là vò dùng để múc và đựng nước.
- source_word: מֵעָלֶיהָ
  choice: trên vai
  rationale: Cụm Hê-bơ-rơ chỉ nói “từ phía trên nàng” mà không nêu bộ phận cơ thể. Theo ngữ cảnh rộng hơn, chiếc vò được mang trên vai; bản dịch dùng cách nói tự nhiên này nhưng ghi chú sự không xác định của nguyên văn.
- source_word: שְׁתֵה
  choice: Xin ông uống đi
  rationale: Giữ lực cầu khiến trực tiếp, đồng thời dùng “xin ... đi” để lời mời của người phụ nữ với một người đàn ông xa lạ nghe tự nhiên và nhã nhặn trong tiếng Việt hiện đại.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: tôi cũng sẽ cho lạc đà của ông uống nữa
  rationale: Dạng Hiphil của שקה nghĩa là cho uống hoặc cung cấp nước. Cách dịch này sát nghĩa và tự nhiên hơn “tưới lạc đà” trong tiếng Việt.
- source_word: וָאֵשְׁתְּ
  choice: Thế là tôi uống
  rationale: Diễn đạt diễn tiến và kết quả của lời mời trong mạch kể, thay vì chỉ nối câu máy móc bằng “và”.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: và nàng cũng cho đàn lạc đà uống
  rationale: Giữ sự tương ứng với lời nàng vừa hứa; mạo từ xác định được thể hiện tự nhiên bằng “đàn lạc đà” đã được nhắc đến.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng với độc giả phổ thông hiện đại. Đại từ “nàng,” “tôi,” và “ông” thể hiện vai trò trong cuộc đối thoại mà không làm câu văn cổ kính quá mức; lời thoại dùng dấu câu tiếng Việt hiện hành.
