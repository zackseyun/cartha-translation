base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: vi
  text: Bấy giờ, Rê-bê-ca cùng các thiếu nữ đi với nàng[a] đứng dậy, lên các con lạc đà và đi theo người ấy. Người đầy tớ đưa Rê-bê-ca theo và lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tớ gái của nàng” hoặc “các thiếu nữ theo hầu nàng.” Từ Hê-bơ-rơ chỉ những phụ nữ trẻ; trong ngữ cảnh, có lẽ họ là những người nữ hầu cận Rê-bê-ca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: đứng dậy
  rationale: Giữ nghĩa cơ bản của động từ קום và trình tự kể chuyện, không diễn giải thành “khởi hành” vì hành động di chuyển được nói rõ ngay sau đó.
- source_word: נַעֲרֹתֶיהָ
  choice: các thiếu nữ đi với nàng
  rationale: נַעֲרָה trước hết chỉ các phụ nữ trẻ; ngữ cảnh cho thấy họ đi cùng Rê-bê-ca, nhưng từ này tự nó không xác định rõ địa vị là tớ gái hay nữ tỳ. Cách dịch này tự nhiên trong tiếng Việt và giữ được độ mở về thân phận của họ.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: lên lưng lạc đà
  rationale: Diễn đạt tự nhiên hành động lên cưỡi theo רכב với עַל, đồng thời giữ trình tự trước khi đoàn người đi theo.
- source_word: אַחֲרֵי הָאִישׁ
  choice: đi theo người ấy
  rationale: אַחֲרֵי trong ngữ cảnh hành trình chỉ việc đi theo sau hoặc theo sự dẫn đường; “người ấy” giữ danh từ הָאִישׁ mà không thay thẳng bằng “người đầy tớ”.
- source_word: הָעֶבֶד
  choice: người đầy tớ
  rationale: עֶבֶד có thể chỉ nô lệ hoặc đầy tớ; trong ngữ cảnh này, nhân vật là người quản gia đáng tin cậy của Áp-ra-ham, nên “người đầy tớ” là cách gọi phù hợp mà không xác quyết quá mức về quy chế pháp lý.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: Người đầy tớ đưa Rê-bê-ca theo
  rationale: לקח có nghĩa cơ bản là “lấy/đem theo”; trong ngữ cảnh hộ tống một người lên đường, “đưa ... theo” tự nhiên hơn trong tiếng Việt và không hàm ý cưỡng ép.
- source_word: וַיֵּלַךְ
  choice: và lên đường
  rationale: הלך nghĩa là đi; ở cuối trình thuật chuẩn bị cho hành trình, “lên đường” diễn đạt tự nhiên việc người đầy tớ tiếp tục hành trình mà không bổ sung đích đến.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Rê-bê-ca” theo lối phiên âm quen thuộc; tránh từ cổ như “chỗi dậy,” đồng thời không biến “các thiếu nữ” thành “nữ tỳ” ngay trong chính văn vì nguyên ngữ không xác định rõ địa vị phục dịch.
