  source_fidelity: 'Bản dịch truyền đạt đúng lời cầu nguyện của người đầy tớ: ông thưa với Yahweh, là Đức Chúa Trời của chủ mình là Áp-ra-ham, xin Ngài khiến một sự việc thuận lợi xảy đến cho ông trong ngày hôm đó, và thực thi hesed đối với Áp-ra-ham. “Xin cho con gặp điều thuận lợi” là cách diễn đạt theo ngữ cảnh, phản ánh hợp lý sắc thái Hiphil của הַקְרֵה mà không xác định quá mức biến cố được cầu xin.'
  naturalness: Câu tiếng Việt tự nhiên, mạch lạc và giữ được giọng cầu nguyện trang trọng, hiện đại. “Chủ con là Áp-ra-ham” làm rõ quan hệ người nói với Áp-ra-ham; “bày tỏ tình yêu thành tín với” cũng phù hợp trong văn phong Kinh Thánh hiện đại.
  terminology: “Yahweh” bảo toàn danh riêng יהוה. “Đức Chúa Trời” phù hợp cho אֱלֹהֵי. “Tình yêu thành tín” là một cách chuyển rộng nghĩa và không giáo phái cho חֶסֶד; chú thích nêu các nét nghĩa nhân từ, trung tín và giao ước một cách thích đáng. Các ký hiệu chú thích được đặt đúng tại những cụm từ cần giải thích.
