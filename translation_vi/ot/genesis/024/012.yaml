  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: vi
  text: 'Rồi người nói: “Lạy Yahweh, Đức Chúa Trời của chủ con là Áp-ra-ham, hôm nay xin cho con gặp điều thuận lợi[a], và bày tỏ tình yêu thành tín[b] với chủ con là Áp-ra-ham.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xin khiến điều ấy xảy ra trước mặt con hôm nay.” Động từ Hê-bơ-rơ cầu xin Đức Chúa Trời an bài sự việc người nói đang mong đợi.'
    reason: lexical_alternative
  - marker: b
    text: “Tình yêu thành tín” dịch từ Hê-bơ-rơ hesed, cũng có thể mang nghĩa lòng nhân từ trung tín hoặc sự thành tín trong giao ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển trực tiếp danh riêng giao ước YHWH bằng dạng phiên âm quen dùng “Yahweh”, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Đức Chúa Trời của chủ con là Áp-ra-ham
  rationale: Giữ quan hệ sở hữu trong chuỗi liên kết Hê-bơ-rơ; “chủ con” phù hợp với lời người đầy tớ nói về Áp-ra-ham.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: hôm nay xin cho con gặp điều thuận lợi
  rationale: Động từ Hiphil הַקְרֵה cầu xin Đức Chúa Trời khiến một sự việc thuận lợi xảy đến trước người nói. Cách diễn đạt này tự nhiên trong tiếng Việt, vẫn giữ tác động của Đức Chúa Trời và không xác định quá mức sự việc ấy.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: bày tỏ tình yêu thành tín
  rationale: Cụm này diễn đạt việc thực thi חֶסֶד; “tình yêu thành tín” giữ được cả sắc thái yêu thương, nhân hậu và trung thành lâu bền.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: với chủ con là Áp-ra-ham
  rationale: Giữ giới từ עִם là “với”; trong tiếng Việt, “bày tỏ tình yêu thành tín với” vừa tự nhiên vừa sát cấu trúc nguồn.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm “Yahweh” bảo tồn đặc tính ấy mà không biến danh riêng thành tước hiệu.
- issue: Sắc thái của חֶסֶד trong lời cầu nguyện cho Áp-ra-ham
  choice: tình yêu thành tín
  alternative: lòng nhân từ; lòng thành tín; tình yêu giao ước
  rationale: “Tình yêu thành tín” giữ được độ rộng nghĩa của חֶסֶד mà không áp đặt rằng từ này ở đây chỉ là một thuật ngữ kỹ thuật về giao ước.
- issue: Mức độ xác định của lời cầu xin הַקְרֵה נָא
  choice: xin cho con gặp điều thuận lợi
  alternative: xin khiến việc ấy xảy ra trước mặt con; xin cho con thành công
  rationale: Nguyên văn không nêu rõ đối tượng của động từ. Bản dịch giữ lời cầu xin mở, đồng thời truyền đạt ý Đức Chúa Trời an bài một cuộc gặp thuận lợi trong ngữ cảnh.
translation_notes:
  register: Văn phong cầu nguyện trang trọng nhưng hiện đại. Đại từ “con” thể hiện người đầy tớ thưa với Đức Chúa Trời; “chủ con” làm rõ quan hệ của người nói với Áp-ra-ham. Trật tự “hôm nay” được đặt sớm để câu tiếng Việt trôi chảy.
