  text: Abraham said to him[a], “Be careful that you do not take my son back there.”
translation:
  language: vi
  text: 'Áp-ra-ham nói với ông: “Hãy cẩn thận, đừng đưa con trai ta trở về đó.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “đưa con trai ta trở lại đó.” Động từ Hê-bơ-rơ ở thể sai khiến, theo nghĩa đen là “khiến trở về.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: nói với ông
  rationale: Cách diễn đạt tự nhiên trong văn kể chuyện tiếng Việt; đại từ “ông” chỉ người đầy tớ đang được Áp-ra-ham nói trực tiếp.
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy cẩn thận
  rationale: Truyền đạt thành ngữ cảnh báo của mệnh lệnh Niphal kết hợp với đại từ lợi ích/phản thân, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: פֶּן
  choice: đừng
  rationale: Trong lời cảnh báo, “đừng” diễn đạt gọn và tự nhiên ý phủ định nhằm ngăn một hành động xảy ra.
- source_word: תָּשִׁיב
  choice: đưa ... trở về
  rationale: Động từ Hiphil của שוב mang nghĩa khiến ai đó trở lại; “đưa ... trở về” giữ sắc thái sai khiến mà không quyết định người con đã từng trực tiếp sống tại nơi ấy hay chưa.
- source_word: אֶת־בְּנִי
  choice: con trai ta
  rationale: Phản ánh trực tiếp danh từ “con trai” với hậu tố ngôi thứ nhất số ít; “ta” phù hợp lời của gia trưởng nói với người đầy tớ.
- source_word: שָׁמָּה
  choice: đó
  rationale: Diễn đạt tự nhiên trạng từ chỉ hướng/nơi chốn “đến đó” sau cụm động từ “đưa ... trở về”.
