  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nguyên sức nặng của lời cảnh báo, đồng thời dùng chú thích để nêu sắc thái sai khiến và phương án dịch khác của תָּשִׁיב.
