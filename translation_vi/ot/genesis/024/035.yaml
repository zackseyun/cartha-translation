- from: Đức Giê-hô-va đã ban phước dồi dào cho chủ tôi, khiến người trở nên rất thịnh vượng. Ngài đã ban cho người chiên dê, bò, bạc, vàng, tôi trai và tớ gái[a], lạc đà và lừa.
  to: Đức Giê-hô-va đã ban phước dồi dào cho chủ tôi, và người đã trở nên lớn mạnh. Ngài đã ban cho người chiên dê, bò, bạc, vàng, tôi trai và tớ gái[a], lạc đà và lừa.
