  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: vi
  text: Đức Giê-hô-va đã ban phước dồi dào cho chủ tôi, và người đã trở nên lớn mạnh. Ngài đã ban cho người chiên dê, bò, bạc, vàng, tôi trai và tớ gái[a], lạc đà và lừa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nô lệ nam và nô lệ nữ.” Các từ Hê-bơ-rơ có thể chỉ người phục dịch trong gia hộ hoặc nô lệ, tùy theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יהוה
  choice: Đức Giê-hô-va
  rationale: Dùng danh riêng quen thuộc trong tiếng Việt cho Tứ Danh, thay vì chuyển thành một tước hiệu chung.
- source_word: בֵּרַךְ ... מְאֹד
  choice: đã ban phước dồi dào
  rationale: Diễn đạt tự nhiên mức độ mạnh của מְאֹד và hành động đã tạo nên tình trạng hiện tại của Áp-ra-ham.
- source_word: אֲדֹנִי
  choice: chủ tôi
  rationale: Trong ngữ cảnh này, từ chỉ Áp-ra-ham là người chủ của đầy tớ, không phải một tước hiệu thần linh.
- source_word: וַיִּגְדָּל
  choice: khiến người trở nên rất thịnh vượng
  rationale: Ngữ cảnh liệt kê tài sản cho thấy sự trở nên lớn mạnh biểu hiện ở sự giàu có; cấu trúc với 'khiến' cũng giữ Đức Giê-hô-va là tác nhân hàm ẩn theo mạch câu.
- source_word: וַיִּתֶּן לוֹ
  choice: Ngài đã ban cho người
  rationale: Nêu rõ Đức Giê-hô-va là chủ thể và Áp-ra-ham là người nhận, tránh sự mơ hồ của đại từ tiếng Việt.
- source_word: צֹאן וּבָקָר
  choice: chiên dê, bò
  rationale: צֹאן là tên gọi tập hợp cho gia súc nhỏ, thường gồm chiên và dê; בָּקָר chỉ bò. Cách dịch này cụ thể và tự nhiên trong tiếng Việt.
- source_word: כֶסֶף וְזָהָב
  choice: bạc, vàng
  rationale: Giữ nguyên các kim loại quý cụ thể trong bản Hê-bơ-rơ.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: tôi trai và tớ gái
  rationale: Giữ sự phân biệt nam nữ và sắc thái người phục dịch trong gia hộ; chú thích bảo lưu khả năng chỉ nô lệ.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: lạc đà và lừa
  rationale: Các danh từ động vật được chuyển dịch trực tiếp, tự nhiên.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản nguồn dùng trực tiếp Tứ Danh; vì vậy bản dịch giữ một danh riêng thay vì thay bằng tước hiệu. 'Đức Giê-hô-va' là hình thức đã quen thuộc và trang trọng trong tiếng Việt.
- issue: Nghĩa của וַיִּגְדָּל
  choice: trở nên rất thịnh vượng
  alternative: trở nên lớn mạnh
  rationale: Danh sách tài sản ngay sau đó làm nổi bật phương diện thịnh vượng, nhưng cách dịch không giới hạn câu vào tiền bạc đơn thuần.
- issue: Địa vị của עֲבָדִם / שְׁפָחֹת
  choice: tôi trai và tớ gái
  alternative: nô lệ nam và nô lệ nữ
  rationale: Các từ Hê-bơ-rơ có thể chỉ người phục dịch hoặc nô lệ. Bản chính dùng cách gọi gia nhân phù hợp văn cảnh, còn chú thích giữ lại nghĩa mạnh hơn do họ xuất hiện trong danh mục tài sản.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng 'người' để chỉ Áp-ra-ham và 'Ngài' để chỉ Đức Giê-hô-va nhằm phân biệt rõ các đại từ. Dấu chú thích [a] được đặt ngay sau cặp từ liên quan.
