  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: vi
  text: 'Họ nói: “Chúng ta hãy gọi cô gái ấy đến và hỏi chính cô ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “hỏi miệng cô ấy”, tức là trực tiếp nghe câu trả lời của chính cô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Dạng wayyiqtol của אמר tiếp tục mạch kể chuyện; tiếng Việt không cần luôn dịch liên từ וַ bằng “và” hay “bấy giờ” khi trình tự đã rõ.
- source_word: נִקְרָא
  choice: Hãy gọi
  rationale: Dạng cohortative số nhiều diễn tả lời đề nghị cùng hành động. Trong lời nói trực tiếp, “hãy gọi” tự nhiên và rõ hơn “chúng ta hãy gọi” trong ngữ cảnh này.
- source_word: לַנַּעֲרָ
  choice: cô gái
  rationale: נַעֲרָה chỉ một phụ nữ trẻ; trong ngữ cảnh là Rê-bê-ca ở tuổi kết hôn. “Cô gái” là cách gọi hiện đại, tự nhiên, không mang sắc thái cổ như “thiếu nữ”.
- source_word: וְנִשְׁאֲלָה
  choice: và hỏi
  rationale: Dạng cohortative số nhiều tiếp nối đề nghị; “hỏi” là tương đương trực tiếp và tự nhiên.
- source_word: אֶת־פִּיהָ
  choice: chính cô ấy
  rationale: Cụm này theo nghĩa đen là “miệng cô ấy”, một lối nói nhấn mạnh việc nghe câu trả lời trực tiếp từ chính người nữ. “Hỏi chính cô ấy” truyền đạt trọng tâm ấy mà không dùng hình ảnh khó hiểu trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cô gái” phù hợp ngữ cảnh gia đình đang hỏi ý kiến Rê-bê-ca; từ “chính” giữ được sự nhấn mạnh của thành ngữ Hê-bơ-rơ.
