base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: vi
  text: Kìa, tôi đang đứng bên mạch nước, và các con gái của dân trong thành[a] đang đi ra để múc nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con gái của những người trong thành”, một cách nói về các thiếu nữ trong thành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Kìa
  rationale: Tiểu từ chỉ xuất dùng để hướng sự chú ý vào cảnh trước mắt; “Kìa” vừa trang trọng vừa tự nhiên trong lời cầu nguyện thuật lại tình huống hiện tại.
- source_word: אָנֹכִי
  choice: tôi
  rationale: Đại từ ngôi thứ nhất được diễn đạt trực tiếp; không thêm từ nhấn mạnh vì ngữ cảnh tiếng Việt không đòi hỏi.
- source_word: נִצָּב
  choice: đang đứng
  rationale: Phân từ Niphal diễn tả tư thế đang tiếp diễn tại thời điểm nói.
- source_word: עַל
  choice: bên
  rationale: Trong ngữ cảnh nguồn nước, giới từ chỉ vị trí ở gần; “bên” tự nhiên hơn cách dịch sát là “trên”.
- source_word: עֵין הַמָּיִם
  choice: mạch nước
  rationale: עֵין ở đây là nguồn hay mạch nước tự nhiên, không phải từ thông thường chỉ giếng; “mạch nước” truyền đạt đúng loại địa điểm và tự nhiên trong tiếng Việt.
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: và các con gái của dân trong thành
  rationale: Giữ hình ảnh quan hệ gia đình của בְּנוֹת nhưng chuyển אַנְשֵׁי sang “dân” theo nghĩa cư dân trong thành, tránh câu tiếng Việt nặng nề hoặc hàm ý chỉ con gái của toàn bộ đàn ông.
- source_word: יֹצְאֹת
  choice: đang đi ra
  rationale: Phân từ giống cái số nhiều chỉ hành động đang diễn ra hoặc sắp xảy ra, nhìn từ nơi người đầy tớ đang đứng.
- source_word: לִשְׁאֹב מָיִם
  choice: để múc nước
  rationale: “Múc nước” là cách nói tiếng Việt thông dụng và chính xác cho hành động lấy nước từ nguồn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sắc thái trực chỉ của הִנֵּה bằng “Kìa” và phân biệt mạch nước tự nhiên với giếng. Dấu chú thích [a] được đặt ngay sau cụm nội dung mà chú thích giải thích.
