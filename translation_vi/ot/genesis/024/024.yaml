  text: וַ/תֹּ֣אמֶר אֵלָ֔י/ו בַּת בְּתוּאֵ֖ל אָנֹ֑כִי בֶּן מִלְכָּ֕ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/נָחֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/024.yaml
  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: vi
  text: 'Cô đáp: “Tôi là con gái của Bê-tu-ên, con trai của Minh-ca, người đã sinh Bê-tu-ên cho Na-cô.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Cô đáp
  rationale: Động từ wayyiqtol của אמר tiếp nối diễn tiến tường thuật; trong ngữ cảnh đối thoại, “đáp” tự nhiên và hàm ý lời nói hướng đến người đàn ông, nên không cần lặp “với ông”.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: Tôi là con gái của Bê-tu-ên
  rationale: Giữ nguyên lời tự giới thiệu và quan hệ cha–con trong cấu trúc tiếng Việt tự nhiên.
- source_word: בְּתוּאֵל
  choice: Bê-tu-ên
  rationale: Phiên âm tên riêng Bethuel theo cách đọc quen thuộc trong tiếng Việt.
- source_word: בֶּן מִלְכָּה
  choice: con trai của Minh-ca
  rationale: Cụm liên thuộc xác định Bê-tu-ên là con trai của Minh-ca; thêm “của” để rõ và tự nhiên trong tiếng Việt.
- source_word: מִלְכָּה
  choice: Minh-ca
  rationale: Phiên âm tên riêng Milcah theo hình thức Kinh Thánh tiếng Việt quen thuộc.
- source_word: אֲשֶׁר יָלְדָה
  choice: người bà đã sinh
  rationale: Mệnh đề quan hệ quy về Bê-tu-ên, còn chủ thể nữ của יָלְדָה là Minh-ca; “người” giúp chỉ rõ tiền ngữ là một người nam.
- source_word: לְנָחוֹר
  choice: cho Na-cô
  rationale: Giới từ ל trong công thức sinh con đánh dấu người cha; “sinh cho Na-cô” vừa sát cấu trúc Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ công thức gia phả “sinh cho” để thể hiện quan hệ cha mẹ mà không diễn giải quá mức; dùng các dạng tên riêng quen thuộc Bê-tu-ên, Minh-ca và Na-cô.
