  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: vi
  text: 'Nhưng người đầy tớ nói với họ: “Xin đừng giữ tôi lại, vì Yahweh đã khiến chuyến đi của tôi thành công. Hãy để tôi đi, để tôi đến với chủ tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Nhưng người đầy tớ nói với họ
  rationale: Mạch văn tạo thế tương phản với đề nghị trì hoãn ở câu trước; thêm chủ ngữ “người đầy tớ” để tiếng Việt rõ và tự nhiên, dựa trên nhân vật đang nói trong ngữ cảnh.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: Xin đừng giữ tôi lại
  rationale: Động từ ở thể Hiphil với אַל diễn tả lời ngăn cấm hoặc thỉnh cầu đừng trì hoãn, cầm giữ người nói. “Xin đừng giữ tôi lại” tự nhiên trong lời nói kính trọng và đúng tình huống.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tetragrammaton, thay vì thay bằng một tước hiệu.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: đã khiến chuyến đi của tôi thành công
  rationale: 'Thể Hiphil của צלח giữ ý nghĩa tác động: Yahweh làm cho דֶּרֶךְ của người đầy tớ thành công. Trong ngữ cảnh, “chuyến đi” diễn đạt tự nhiên nghĩa của “đường/lối”.'
- source_word: שַׁלְּחוּנִי
  choice: Hãy cho tôi lên đường
  rationale: Mệnh lệnh Piel của שלח ở đây là lời xin được tiễn hoặc cho phép rời đi; cách dịch này tự nhiên hơn “hãy sai tôi đi” trong tiếng Việt.
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: để tôi trở về với chủ mình
  rationale: Dạng cohortative diễn tả ý định đi đến với chủ. “Trở về” được ngữ cảnh hành trình hồi hương hỗ trợ, còn “chủ mình” xác định אֲדֹנִי là người chủ phàm nhân của đầy tớ.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יְהוָה; phiên âm “Yahweh” giữ sự phân biệt giữa danh riêng của Đức Chúa Trời và tước hiệu.
- issue: Tác nhân làm cho hành trình thành công
  choice: Yahweh đã khiến chuyến đi của tôi thành công
  alternative: chuyến đi của tôi đã thành công nhờ Yahweh
  rationale: Cách chọn giữ sắc thái gây khiến của thể Hiphil הִצְלִיחַ và lời xác nhận rõ ràng rằng thành công đến từ hành động của Yahweh.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “xin” để thể hiện sắc thái lời thỉnh cầu trong đối thoại; “chủ mình” tránh nhầm với tước hiệu thần linh. Không cần chú thích vì cách dịch theo ngữ cảnh không che khuất một dị bản hay sự mơ hồ thần học đáng kể.
