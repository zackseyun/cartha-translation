  to: 'Rồi tôi hỏi cô ấy rằng[a]: “Cô là con gái ai?” Cô ấy đáp: “Tôi là con gái của Bê-tu-ên, con trai của Na-cô, do Minh-ca sinh cho Na-cô.” Sau đó, tôi đeo chiếc khuyên[b] vào mũi cô ấy và các vòng trên tay cô ấy[c].'
  rationale: Chỉ sửa chi tiết số nhiều và giới từ ở cụm trang sức để không thêm số lượng không được nêu trong câu và để sát hơn với tiếng Hê-bơ-rơ. Các phần còn lại được giữ nguyên vì truyền đạt đúng nội dung và có văn phong tự nhiên.
