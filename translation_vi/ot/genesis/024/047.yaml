base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: vi
  text: 'Rồi tôi hỏi cô ấy rằng[a]: “Cô là con gái ai?” Cô ấy đáp: “Tôi là con gái của Bê-tu-ên, con trai của Na-cô, do Minh-ca sinh cho Na-cô.” Sau đó, tôi đeo chiếc khuyên[b] vào mũi cô ấy và các vòng trên tay cô ấy[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nguyên văn: “tôi hỏi cô ấy và nói.”'
    reason: previous_rendering
  - marker: b
    text: Từ Hê-bơ-rơ có thể chỉ chiếc vòng hoặc khuyên nói chung; cụm “vào mũi” cho biết cách dùng ở đây.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “trên tay cô ấy”; trong ngữ cảnh đeo vòng, có thể hiểu cụ thể là cổ tay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: Rồi tôi hỏi cô ấy rằng
  rationale: Diễn đạt tự nhiên chuỗi động từ Hê-bơ-rơ ‘tôi hỏi cô ấy và nói’, trong đó lời nói chính là nội dung câu hỏi; ‘rồi’ tiếp nối mạch kể.
- source_word: בַּת מִי אַתְּ
  choice: Cô là con gái ai?
  rationale: Giữ rõ câu hỏi về quan hệ cha con, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt hiện đại.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: Tôi là con gái của Bê-tu-ên, con trai của Na-cô
  rationale: 'Giữ nguyên cấu trúc gia phả: người nữ là con gái Bê-tu-ên, còn Bê-tu-ên là con trai Na-cô.'
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: do Minh-ca sinh cho Na-cô
  rationale: Nêu rõ Minh-ca là mẹ của Bê-tu-ên và Na-cô là người được đại từ לוֹ quy chiếu đến, tránh đại từ tiếng Việt có thể gây nhầm lẫn.
- source_word: הַנֶּזֶם עַל אַפָּהּ
  choice: chiếc khuyên vào mũi cô ấy
  rationale: נֶזֶם có thể chỉ một loại vòng hoặc khuyên nói chung, nhưng cụm ‘vào mũi cô ấy’ xác định đây là trang sức đeo mũi.
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: đôi vòng vào tay cô ấy
  rationale: ‘Đôi vòng’ phản ánh danh từ số nhiều và ngữ cảnh hai chiếc vòng; ‘tay’ giữ độ rộng nghĩa của יָד, có thể bao gồm bàn tay, cổ tay hoặc cánh tay tùy ngữ cảnh.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng tự nhiên, dùng đại từ ‘tôi/cô ấy/cô’ phù hợp lời thuật trực tiếp. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt: Bê-tu-ên, Na-cô, Minh-ca.'
