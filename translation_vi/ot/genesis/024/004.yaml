    issue: «cưới một người vợ cho con trai ta» có thể gây mơ hồ về chủ thể kết hôn và không tự nhiên trong tiếng Việt.
    rationale: וְלָקַחְתָּ אִשָּׁה לִבְנִי chỉ việc người đầy tớ phải thu xếp/lấy vợ cho con trai của Áp-ra-ham, chứ không nói người đầy tớ tự cưới. Cụm «cưới vợ cho con trai ta» truyền đạt chính xác hơn vai trò được ủy thác.
