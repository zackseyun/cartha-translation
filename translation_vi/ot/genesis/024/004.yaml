  to: Nhưng ngươi phải đi đến xứ sở ta và đến với họ hàng ta[a], rồi cưới vợ cho con trai ta là Y-sác.
  rationale: Chỉ sửa cách diễn đạt động từ hôn nhân để tiếng Việt tự nhiên và để làm rõ rằng người đầy tớ được sai đi thu xếp hôn sự cho Y-sác. «Rồi» diễn tả trình tự hàm ý trong mệnh lệnh mà không thêm nội dung đáng kể. Các yếu tố từ vựng khác và chú thích được giữ nguyên.
