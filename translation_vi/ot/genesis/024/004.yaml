  text: but you shall go to my land and to my kindred[b][a], and take a wife for my son Isaac.
translation:
  language: vi
  text: Nhưng ngươi phải đi đến xứ sở ta và đến với họ hàng ta[a], rồi cưới vợ cho con trai ta là Y-sác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đến nơi ta sinh ra”; từ Hê-bơ-rơ này có thể chỉ nơi xuất thân hoặc nhóm thân tộc. Văn cảnh ở đây nghiêng về nghĩa “họ hàng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nhưng
  rationale: Trong văn cảnh, từ này tạo thế tương phản với lệnh cấm lấy vợ trong dân Ca-na-an ở câu trước.
- source_word: אֶל אַרְצִי
  choice: đến xứ sở ta
  rationale: Giữ ý địa lý của אֶרֶץ mà không gợi khái niệm quốc gia hiện đại; “xứ sở” phù hợp với văn phong trang trọng, tự nhiên.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: đến với họ hàng ta
  rationale: מוֹלֶדֶת có thể chỉ nơi xuất thân hoặc nhóm thân tộc. Việc tìm vợ cho Y-sác trong văn cảnh nghiêng về nghĩa thân tộc, nhưng nghĩa không gian được giữ trong chú thích.
- source_word: תֵּלֵךְ
  choice: ngươi phải đi
  rationale: Thể chưa hoàn thành ở đây mang lực chỉ thị, nghĩa là một nghĩa vụ chứ không chỉ dự báo hành động tương lai.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: và cưới một người vợ
  rationale: לקח אשה là cách diễn đạt Hê-bơ-rơ thông dụng về việc lấy vợ. “Cưới một người vợ” truyền đạt tự nhiên mục đích hôn nhân trong tiếng Việt.
- source_word: לִבְנִי לְיִצְחָק
  choice: cho con trai ta là Y-sác
  rationale: Hai cụm có לְ đứng trong quan hệ đồng vị; cách dịch này xác định Y-sác chính là người con trai được nói đến mà không lặp giới từ thiếu tự nhiên.
