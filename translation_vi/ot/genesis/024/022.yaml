base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: vi
  text: Khi lạc đà uống xong, người đàn ông lấy một chiếc vòng vàng[a] nặng một bê-ca[b], cùng hai chiếc vòng đeo tay cho cô, tổng cộng nặng mười sê-kel vàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một chiếc vòng mũi vàng” hoặc “một chiếc khuyên tai vàng”; từ Hê-bơ-rơ có thể chỉ vòng đeo ở mũi hoặc tai.
    reason: lexical_alternative
  - marker: b
    text: Một bê-ca là đơn vị cân nặng bằng nửa sê-kel.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: Khi lạc đà uống xong
  rationale: Diễn đạt tự nhiên quan hệ thời gian và ý hoàn tất của động từ כלה, không nhấn mạnh quá mức tính tức thời.
- source_word: הָאִישׁ
  choice: người đàn ông
  rationale: Giữ đúng cách gọi trong câu Hê-bơ-rơ; dù ngữ cảnh cho biết đây là đầy tớ của Áp-ra-ham, câu này chỉ gọi ông là ‘người đàn ông’.
- source_word: נֶזֶם זָהָב
  choice: một chiếc nhẫn vàng
  rationale: נֶזֶם có thể là vòng đeo mũi hoặc đeo tai; ‘nhẫn’ giữ được độ khái quát trong chính văn, còn các khả năng cụ thể được nêu ở chú thích.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: nặng một bê-ca
  rationale: Giữ nguyên đơn vị cân nặng cổ đại בקע và dùng cấu trúc tiếng Việt tự nhiên.
- source_word: וּשְׁנֵי צְמִידִים עַל יָדֶיהָ
  choice: cùng hai chiếc vòng đeo tay cho cô
  rationale: Giữ rõ số lượng hai chiếc; ‘vòng đeo tay’ tự nhiên trong tiếng Việt và ‘cho cô’ thể hiện mục đích của các vòng trong ngữ cảnh.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: tổng cộng nặng mười sê-kel vàng
  rationale: Đại từ số nhiều cho biết đây là trọng lượng chung của hai vòng. ‘Sê-kel’ là đơn vị được hàm ý trong lối nói Hê-bơ-rơ và được bổ sung để câu tiếng Việt rõ nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách gọi ‘người đàn ông’ của nguyên văn, bảo tồn tính không xác định của loại nhẫn, và giữ các đơn vị cân nặng cổ đại.
