  - severity: low
    issue: “Anh trai” xác định người anh em trai là lớn tuổi hơn.
    rationale: אָח chỉ người anh em trai và không tự nó biểu thị thứ bậc tuổi tác. Nên dùng cách diễn đạt không áp đặt nét nghĩa này.
