base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: vi
  text: Rồi người đầy tớ lấy ra những đồ bằng bạc, những đồ bằng vàng và quần áo, trao cho Rê-bê-ca; ông cũng tặng người anh em trai và mẹ nàng những món quà quý[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây có thể chỉ những món quà đặc biệt hoặc quý giá; trong một số văn cảnh, từ này có thể chỉ các món ngon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: lấy ra
  rationale: Dạng Hiphil của יצא diễn tả việc đem hoặc lấy vật ra; “lấy ra” tự nhiên trong tiếng Việt và giữ được hành động cụ thể.
- source_word: הָעֶבֶד
  choice: người đầy tớ
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ; trong văn cảnh này, “người đầy tớ” tự nhiên và phù hợp với vai trò của nhân vật.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: những đồ bằng bạc, những đồ bằng vàng
  rationale: כְּלִי là từ nghĩa rộng, có thể chỉ đồ vật, dụng cụ hay vật dụng; “những đồ” tránh thu hẹp thành bình, chén hoặc trang sức.
- source_word: וּבְגָדִים
  choice: và quần áo
  rationale: בְּגָדִים chỉ y phục; “quần áo” là cách nói hiện đại, rõ ràng và trang nhã.
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: trao cho Rê-bê-ca
  rationale: “Trao” diễn đạt tự nhiên hành động đưa các món quà cho Rê-bê-ca mà không cần thêm đại từ tân ngữ.
- source_word: וּמִגְדָּנֹת
  choice: những lễ vật quý
  rationale: מִגְדָּנֹת chỉ những thứ quý hoặc quà tặng đặc biệt; “lễ vật quý” phù hợp bối cảnh hôn nhân và không giới hạn nghĩa vào thức ăn ngon.
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: anh trai và mẹ nàng
  rationale: Các hậu tố sở hữu đều quy chiếu về Rê-bê-ca; “nàng” duy trì văn phong kể chuyện trang dignified và tránh lặp tên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người đầy tớ” theo văn cảnh, “những đồ” để giữ nghĩa rộng của כְּלִי, và đặt dấu chú thích ngay sau cụm từ mà chú thích giải thích.
