  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: vi
  text: Áp-ra-ham đã già, tuổi đã cao[a], và Yahweh đã ban phước cho Áp-ra-ham trong mọi sự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “đã đến trong những ngày”, một thành ngữ có nghĩa là tuổi đã cao.'
    reason: Giải thích thành ngữ Hê-bơ-rơ בָּא בַּיָּמִים và cho thấy hình thức sát chữ phía sau bản dịch tự nhiên.
lexical_decisions:
- source_word: וְאַבְרָהָם
  choice: Áp-ra-ham
  rationale: Liên từ וְ mở đầu đơn vị tường thuật mới; tiếng Việt không cần thêm một từ như “bấy giờ” vì bản Hê-bơ-rơ không có trạng từ thời gian tương ứng.
- source_word: זָקֵן
  choice: đã già
  rationale: Diễn đạt trực tiếp tình trạng tuổi già của Áp-ra-ham bằng tiếng Việt tự nhiên.
- source_word: בָּא בַּיָּמִים
  choice: tuổi đã cao
  rationale: Đây là thành ngữ Hê-bơ-rơ, sát chữ là “đã đến trong những ngày”, chỉ việc đã cao tuổi. Cách dịch này tự nhiên mà vẫn giữ sắc thái nhấn mạnh đi đôi với “đã già”.
- source_word: וַיהוָה
  choice: và Yahweh
  rationale: Giữ liên từ nối mệnh đề và chuyển tự danh riêng của Đức Chúa Trời được ghi trực tiếp bằng bốn phụ âm יהוה.
- source_word: בֵּרַךְ
  choice: đã ban phước
  rationale: Dạng hoàn thành tóm lược sự ban phước đã diễn ra và đang làm nền cho câu chuyện tiếp theo.
- source_word: בַּכֹּל
  choice: trong mọi sự
  rationale: Thể hiện phạm vi toàn diện của sự ban phước mà không giới hạn vào của cải vật chất.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn tư cách danh riêng, không biến nó thành một tước hiệu; đồng thời không khẳng định chắc chắn hơn mức có thể về cách phát âm cổ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại tên Áp-ra-ham như nguyên văn để duy trì trọng tâm của câu; dùng “ban phước” theo cách nói Kinh Thánh quen thuộc trong tiếng Việt.
