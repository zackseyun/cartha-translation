  terminology: Giữ “Yahweh” nhất quán với quyết định về danh יהוה. “Ban phước” là thuật ngữ Kinh Thánh Việt ngữ quen thuộc và thích hợp. Cách viết “Áp-ra-ham” nhất quán trong câu.
