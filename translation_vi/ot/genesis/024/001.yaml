  source_fidelity: 'Bản dịch phản ánh chính xác các thành tố chính của tiếng Hê-bơ-rơ: Áp-ra-ham ở tuổi già và cao tuổi (זקן; בא בימים), Yahweh là chủ thể của hành động ban phước, và phạm vi của phước là toàn diện (בכל). Việc không dịch liên từ mở đầu וְ là tự nhiên trong tiếng Việt. Thì “đã ban phước” diễn đạt phù hợp ý tổng kết của dạng hoàn thành trong ngữ cảnh.'
