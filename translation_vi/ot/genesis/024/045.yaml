source:
  edition: WLC
  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: vi
  text: 'Khi tôi còn chưa nói xong trong lòng[a], thì kìa, Rê-bê-ca đi ra với bình nước trên vai. Cô xuống suối[b] múc nước. Tôi nói với cô: “Xin cho tôi uống nước.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “nói với lòng tôi,” một thành ngữ chỉ lời nói thầm bên trong hoặc lời cầu nguyện.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mạch nước.” Từ Hê-bơ-rơ ở đây chỉ một nguồn nước tự nhiên, khác với từ thường dùng để chỉ “giếng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: Khi tôi còn chưa nói xong
  rationale: Diễn đạt tự nhiên trạng thái hành động chưa hoàn tất tại thời điểm Rê-bê-ca xuất hiện, đồng thời giữ sắc thái thời gian của טֶרֶם với אֲכַלֶּה.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: nói ... trong lòng
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, chỉ lời nói thầm bên trong hoặc lời cầu nguyện chưa thốt ra, mà không quyết định dứt khoát giữa hai khả năng.
- source_word: וְהִנֵּה
  choice: thì kìa
  rationale: Tái hiện sự xuất hiện đột ngột và nét trình bày sống động của tiểu từ diễn ngôn, trong văn phong kể chuyện trang trọng nhưng dễ hiểu.
- source_word: רִבְקָה
  choice: Rê-bê-ca
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: יֹצֵאת
  choice: đi ra
  rationale: Phân từ sau וְהִנֵּה tạo cảnh tượng đang hiện ra sống động; “đi ra” tự nhiên trong mạch kể tiếng Việt.
- source_word: כַדָּהּ
  choice: chiếc vò
  rationale: כַּד là vò hoặc bình dùng để chứa và múc nước; “chiếc vò” ngắn gọn, phù hợp bối cảnh.
- source_word: עַל־שִׁכְמָהּ
  choice: trên vai
  rationale: Chuyển trực tiếp quan hệ vị trí trong nguyên văn bằng cách nói tự nhiên của tiếng Việt.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: Cô xuống suối
  rationale: עַיִן ở đây chỉ nguồn hay mạch nước tự nhiên, không phải từ thông thường chỉ giếng; “xuống suối” vừa tự nhiên vừa tránh đồng nhất hóa với giếng.
- source_word: וַתִּשְׁאָב
  choice: múc nước
  rationale: Động từ chỉ việc lấy nước lên; nêu rõ “nước” là cách diễn đạt tự nhiên và đã hàm chứa trong nghĩa động từ.
- source_word: הַשְׁקִינִי נָא
  choice: Xin cho tôi uống một chút
  rationale: Thể truyền khiến của שׁקה mang nghĩa cho ai uống; “xin” thể hiện נָא, còn “một chút” diễn đạt lời thỉnh cầu lịch sự, tự nhiên mà không thay đổi nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ “trong lòng” cùng nét sống động của “thì kìa”; dùng “suối” thay vì hòa đồng nguyên văn với “giếng.”
