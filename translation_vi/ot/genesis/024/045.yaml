revisions:
- from: 'Khi tôi còn chưa nói xong trong lòng[a], thì kìa, Rê-bê-ca đi ra với chiếc vò trên vai. Cô xuống suối[b] múc nước. Tôi nói với cô: “Xin cho tôi uống một chút.”'
  to: 'Khi tôi còn chưa nói xong trong lòng[a], thì kìa, Rê-bê-ca đi ra với bình nước trên vai. Cô xuống suối[b] múc nước. Tôi nói với cô: “Xin cho tôi uống nước.”'
  rationale: Sửa tối thiểu để tránh thêm ý ‘một chút’ vào lời thỉnh cầu và dùng cách gọi tự nhiên hơn cho vật chứa nước. Các yếu tố ngữ nghĩa, tên riêng, sắc thái tự sự và vị trí các chú thích đều được giữ nguyên.
