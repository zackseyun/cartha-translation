  edition: WLC
  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: vi
  text: “Kìa, Rê-bê-ca ở trước mặt ông. Hãy đưa nàng đi và hãy để nàng làm vợ[a] cho con trai chủ ông, đúng như Yahweh đã phán.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy để nàng trở thành vợ cho con trai chủ ông.”'
    reason: Động từ היה ở đây có thể được diễn đạt là “làm vợ” hoặc “trở thành vợ”; cả hai đều có thể phản ánh sắc thái cầu khiến của nguyên văn.
lexical_decisions:
- source_word: הִנֵּה
  choice: Kìa
  rationale: Tiểu từ chỉ xuất dùng để hướng sự chú ý vào người đang hiện diện; “Kìa” vừa sát nghĩa vừa tự nhiên trong lời nói trang trọng.
- source_word: רִבְקָה
  choice: Rê-bê-ca
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: לְפָנֶיךָ
  choice: đang ở trước mặt ông
  rationale: Giữ hình ảnh không gian của nguyên văn, đồng thời truyền đạt rằng Rê-bê-ca đang hiện diện và được giao cho người đầy tớ.
- source_word: קַח וָלֵךְ
  choice: Hãy đón nàng rồi đi
  rationale: Hai mệnh lệnh nối tiếp nhau. Trong ngữ cảnh hôn nhân, “đón nàng” tự nhiên hơn cách dịch máy móc “lấy nàng”, còn “rồi” biểu thị trình tự hành động.
- source_word: וּתְהִי אִשָּׁה
  choice: hãy để nàng làm vợ
  rationale: Thể cầu khiến của היה diễn tả sự cho phép hoặc thuận ý. “Hãy để nàng làm vợ” giữ được sắc thái ấy mà không biến câu thành lời tiên báo tất định.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: con trai chủ ông
  rationale: Giới từ לְ diễn tả quan hệ trong công thức hôn nhân; cách nói “làm vợ con trai chủ ông” tự nhiên trong tiếng Việt. “Chủ” phù hợp với quan hệ chủ–đầy tớ trong văn cảnh.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: đúng như lời ... đã phán
  rationale: “Đúng như” diễn tả sự phù hợp với điều đã được nói; “phán” là động từ trang trọng, tự nhiên khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng được biểu thị bằng Tứ Tự, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; giữ “Yahweh” giúp phân biệt danh này với các tước hiệu chỉ Chúa.
- issue: Sắc thái của וּתְהִי trong lời chấp thuận hôn nhân
  choice: hãy để nàng làm vợ
  alternative: nàng sẽ làm vợ
  rationale: Động từ ở thể cầu khiến diễn tả sự cho phép hoặc thuận ý, không nhất thiết là lời tiên báo. Vì vậy bản dịch giữ sắc thái ý chí mà không áp đặt tính tất định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” phù hợp với lời cha và anh của Rê-bê-ca nói với người đầy tớ trưởng thành; “nàng” giữ sắc thái kể chuyện trang trọng. Dấu chấm phẩy làm rõ hai vế mệnh lệnh liên hệ chặt chẽ.
