base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: vi
  text: 'Chủ tôi đã buộc tôi thề rằng: ‘Anh không được cưới vợ cho con trai tôi từ các con gái của dân Ca-na-an, là dân mà tôi đang cư ngụ trong xứ của họ.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch tự nhiên hơn: “giữa dân ấy là nơi tôi đang sống.” Nguyên văn tiếng Hê-bơ-rơ nói theo số ít tập hợp: “người Ca-na-an, trong xứ của người ấy tôi đang cư ngụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: đã bắt tôi thề
  rationale: Dạng Hiphil của שׁבע diễn tả việc khiến một người thề hoặc buộc người ấy vào lời thề; cách dịch này tự nhiên và giữ được sức nặng của lời thề.
- source_word: אֲדֹנִי
  choice: chủ tôi
  rationale: Người đầy tớ đang nói về chủ nhân là Áp-ra-ham, không phải về Đức Chúa Trời; “chủ tôi” diễn đạt rõ quan hệ xã hội trong ngữ cảnh.
- source_word: לֹא תִקַּח אִשָּׁה לִבְנִי
  choice: Anh không được cưới cho con trai tôi một người vợ
  rationale: Động từ “lấy” trong ngữ cảnh hôn nhân mang nghĩa cưới vợ; cấu trúc tiếng Việt này cho thấy người đầy tớ phải tìm và thu xếp người vợ cho con trai của chủ.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: trong số các con gái của dân Ca-na-an
  rationale: Giữ hình ảnh thân tộc “các con gái” và hiểu danh từ số ít “người Ca-na-an” theo nghĩa tập hợp chỉ dân Ca-na-an.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: là dân có xứ mà tôi đang cư ngụ
  rationale: Giữ cách diễn đạt tập hợp ở số ít của tiếng Hê-bơ-rơ và bảo tồn trọng tâm vào “xứ” thay vì chuyển hẳn sang nghĩa diễn giải “giữa họ”.
