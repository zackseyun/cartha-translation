  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: vi
  text: Ta sẽ buộc ngươi thề nhân danh Yahweh[a], Đức Chúa Trời của trời và Đức Chúa Trời của đất, rằng ngươi không được chọn vợ cho con trai ta trong số các con gái của dân Ca-na-an, giữa dân ấy ta đang sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: יְהוָה (YHWH), danh riêng của Đức Chúa Trời; ở đây được phiên âm là “Yahweh”.'
    reason: Giải thích danh riêng trong nguyên văn và cách phiên âm được dùng trong chính văn.
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: Ta sẽ buộc ngươi thề
  rationale: Dạng Hiphil của שׁבע mang nghĩa khiến một người thề; cách dịch này giữ rõ sắc thái khiến khiến và giọng trang trọng.
- source_word: בַּיהוָה
  choice: nhân danh Yahweh
  rationale: Giới từ ב đánh dấu Đấng được viện đến trong lời thề. “Nhân danh” diễn đạt tự nhiên hành vi thề dựa vào danh và thẩm quyền của Yahweh.
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: Đức Chúa Trời của trời và Đức Chúa Trời của đất
  rationale: Giữ sự lặp lại của אֱלֹהֵי trong hai cụm cấu trúc và phạm vi vũ trụ của cặp “trời—đất”.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: rằng ngươi không được cưới
  rationale: Mệnh đề nêu nội dung lời thề. “Không được” truyền đạt lực cấm đoán trang trọng; “cưới” tự nhiên hơn lối dịch sát chữ “lấy” trong ngữ cảnh tìm vợ cho người con.
- source_word: אִשָּׁה לִבְנִי
  choice: cho con trai ta một người vợ
  rationale: Trong ngữ cảnh hôn nhân, אִשָּׁה là “người vợ”; trật tự tiếng Việt này tự nhiên và vẫn giữ quan hệ hưởng lợi được đánh dấu bằng ל.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: trong số các con gái của dân Ca-na-an
  rationale: Giữ hình ảnh Hê-bơ-rơ “các con gái” đồng thời làm rõ đây là những phụ nữ thuộc dân Ca-na-an.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: là dân mà ta đang sống giữa họ
  rationale: יוֹשֵׁב diễn tả việc cư trú đang tiếp diễn, còn בְּקִרְבּוֹ là ở giữa một cộng đồng; thêm “là dân” giúp đại từ số ít tập thể הַכְּנַעֲנִי được hiểu rõ trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu hay đưa vào cách đọc truyền thống khác.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “ta—ngươi” phù hợp lời của vị gia trưởng nói với người đầy tớ trong bối cảnh cổ đại. Giữ phép lặp “Đức Chúa Trời của trời và Đức Chúa Trời của đất” cùng hình ảnh “các con gái của dân Ca-na-an”, nhưng điều chỉnh cú pháp để câu tự nhiên trong tiếng Việt.
