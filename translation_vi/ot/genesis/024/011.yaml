  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” theo chủ thể nam đã xác định trong văn cảnh; giữ hai cụm thời gian theo quan hệ giải thích tự nhiên trong tiếng Việt.
