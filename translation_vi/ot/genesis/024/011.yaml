  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: vi
  text: Ông cho lạc đà quỳ xuống bên giếng nước ở ngoài thành vào lúc chiều tối, là lúc những người phụ nữ đi ra múc nước.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: Ông cho ... quỳ xuống
  rationale: Dạng Hiphil của ברך mang nghĩa khiến các con vật quỳ xuống. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ sắc thái chủ động gây khiến.
- source_word: הַגְּמַלִּים
  choice: lạc đà
  rationale: Danh từ số nhiều có mạo từ, chỉ những con vật trong đoàn đã được nhắc đến ở văn cảnh trước; tiếng Việt không cần biểu thị số nhiều bằng một từ riêng tại đây.
- source_word: מִחוּץ לָעִיר
  choice: ở ngoài thành
  rationale: מִחוּץ nghĩa là ở bên ngoài; עִיר có thể là thành hoặc thị trấn. “Ngoài thành” vừa gọn vừa phù hợp văn cảnh cổ đại.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: bên giếng nước
  rationale: אֶל vốn chỉ hướng đến, nhưng sau hành động cho lạc đà quỳ xuống, tiếng Việt diễn đạt tự nhiên vị trí kết quả bằng “bên giếng nước”.
- source_word: לְעֵת עֶרֶב
  choice: vào lúc chiều tối
  rationale: Giữ rõ ý thời điểm buổi chiều mà không tạo lối diễn đạt nặng nề.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: là lúc những người phụ nữ đi ra múc nước
  rationale: הַשֹּׁאֲבֹת là phân từ giống cái số nhiều, nên dịch rõ là phụ nữ; “đi ra múc nước” truyền đạt tự nhiên cả hành động đi ra và chức năng của họ.
theological_decisions: []
