base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: vi
  text: Y-sác đã từ Bê-e La-chai Rô-i[a][b] đến, và ông đang sống trong miền Nê-ghép.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Y-sác từ Bê-e La-chai Rô-i đến.” Cấu trúc Hê-bơ-rơ có thể được diễn đạt bằng thì quá khứ đơn, không nhất thiết hàm ý quá khứ hoàn thành.'
    reason: lexical_alternative
  - marker: b
    text: Bê-e La-chai Rô-i là địa danh trước đó gắn với Ha-ga; xem Sáng Thế Ký 16:14.
    reason: cross_reference
lexical_decisions:
- source_word: בָּא מִבּוֹא
  choice: đã từ… trở về
  rationale: Cụm Hê-bơ-rơ cô đọng diễn tả chuyển động đã hoàn tất từ một địa điểm. Trong mạch truyện, “đã… trở về” tự nhiên và làm rõ quan hệ thời gian trước cảnh tiếp theo; tuy nhiên, nguyên văn cũng có thể được hiểu đơn giản là “từ… đến”.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Bê-e La-chai Rô-i
  rationale: Giữ dưới dạng phiên âm địa danh, không dịch nghĩa; cách viết có gạch nối giúp người đọc nhận ra đây là một tên ghép.
- source_word: יוֹשֵׁב
  choice: đang sống
  rationale: Phân từ diễn tả tình trạng cư trú đang tiếp diễn. “Đang sống” là cách nói hiện đại, tự nhiên và giữ được sắc thái kéo dài.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: trong miền Nê-ghép
  rationale: נֶגֶב vừa chỉ vùng đất khô ở phía nam vừa là tên địa lý. “Miền Nê-ghép” truyền đạt rõ địa vực và phản ánh danh từ אֶרֶץ mà không nặng nề.
- source_word: וְהוּא
  choice: và ông
  rationale: Giữ liên từ cùng đại từ được nêu rõ trong nguyên văn, thể hiện sự chuyển nhẹ sang thông tin nền mà không thêm một từ chỉ thời gian không có trong nguồn.
