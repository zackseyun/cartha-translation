  text: וָ/אֹמַ֖ר אֶל אֲדֹנִ֑/י אֻלַ֛י לֹא תֵלֵ֥ךְ הָ/אִשָּׁ֖ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/039.yaml
  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: vi
  text: 'Tôi thưa với chủ mình: “Có lẽ người phụ nữ ấy sẽ không đi theo tôi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “đi sau tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Tôi thưa
  rationale: Động từ wayyiqtol của אמר tiếp nối lời thuật ở quá khứ. “Thưa” tự nhiên trong tiếng Việt khi người đầy tớ nói với chủ và diễn đạt đúng sắc thái kính trọng, nhưng không thêm danh xưng không có trong nguyên văn.
- source_word: אֶל אֲדֹנִי
  choice: với chủ mình
  rationale: אָדוֹן kèm hậu tố ngôi thứ nhất số ít chỉ Áp-ra-ham, người chủ của đầy tớ, chứ không chỉ Đức Chúa Trời. “Chủ mình” diễn đạt rõ quan hệ xã hội trong văn cảnh.
- source_word: אֻלַי
  choice: Có lẽ
  rationale: Tiểu từ này diễn đạt khả năng hoặc sự không chắc chắn; “có lẽ” là cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: לֹא תֵלֵךְ
  choice: sẽ không đi theo
  rationale: Thể chưa hoàn thành trong lời được thuật lại hướng đến một khả năng ở tương lai. Khi đi với אַחֲרַי, động từ הלך được diễn đạt tự nhiên là “đi theo”.
- source_word: הָאִשָּׁה
  choice: người phụ nữ ấy
  rationale: Danh từ có mạo từ xác định nghĩa là “người phụ nữ ấy/người đàn bà ấy”. Bản dịch không gọi bà là “vợ” hay “cô gái”, vì nguyên văn tại đây chưa dùng những từ cụ thể đó.
- source_word: אַחֲרַי
  choice: theo tôi
  rationale: Cụm này theo nghĩa sát chữ là “sau tôi”, nhưng kết hợp với הלך tạo thành cách nói “đi theo tôi”; cách dịch này tự nhiên mà vẫn giữ nguyên ý.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, tự nhiên và dễ hiểu. Dùng “thưa” để phản ánh quan hệ đầy tớ–chủ; giữ “người phụ nữ ấy” thay vì diễn giải thành “người vợ” hoặc “cô gái”. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
