  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng 'nàng' cho Rê-bê-ca và 'ông' cho người đầy tớ để tránh lặp tên; dấu [a] đặt ngay sau cụm từ được chú giải.
