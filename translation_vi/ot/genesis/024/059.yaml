  yaml_path: translation/ot/genesis/024/059.yaml
  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: vi
  text: Vậy, họ tiễn Rê-bê-ca, chị/em gái của họ, cùng người vú nuôi của nàng,[a] người đầy tớ của Áp-ra-ham và những người của ông ấy lên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “người cho nàng bú.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: họ tiễn ... lên đường
  rationale: Dạng piel của שׁלח ở đây diễn tả việc cho người ra đi; cách nói này tự nhiên trong tiếng Việt và thể hiện hành động chính thức tiễn đoàn khởi hành.
- source_word: רִבְקָה
  choice: Rê-bê-ca
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֲחֹתָם
  choice: em gái mình
  rationale: אָחוֹת có nghĩa là chị/em gái. Theo mạch gia đình gần và vai trò của La-ban, 'em gái' là cách diễn đạt tự nhiên; 'mình' quy chiếu về chủ ngữ số nhiều.
- source_word: מֵנִקְתָּהּ
  choice: người vú nuôi của nàng
  rationale: Từ này bắt nguồn từ ינק, chỉ người phụ nữ cho trẻ bú. 'Vú nuôi' giữ được nghĩa cụ thể hơn 'người chăm sóc' và phù hợp bối cảnh cổ đại.
- source_word: עֶבֶד אַבְרָהָם
  choice: người đầy tớ của Áp-ra-ham
  rationale: Cấu trúc sở hữu được chuyển tự nhiên sang tiếng Việt. עֶבֶד có thể là nô lệ hoặc đầy tớ; trong ngữ cảnh này, 'đầy tớ' không xác quyết quá mức địa vị pháp lý.
- source_word: אֲנָשָׁיו
  choice: những người đi theo ông
  rationale: Danh từ אֲנָשִׁים là 'những người/những người đàn ông', còn hậu tố chỉ về người đầy tớ. Cách dịch này làm rõ quy chiếu mà không tự ý xác định họ cũng là đầy tớ.
