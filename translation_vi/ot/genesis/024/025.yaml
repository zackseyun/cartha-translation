  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: vi
  text: 'Rồi cô nói với ông: “Nhà chúng tôi có rất nhiều rơm và thức ăn cho súc vật, cũng có chỗ để nghỉ qua đêm.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Rồi cô nói
  rationale: Dạng waw liên tiếp đẩy diễn tiến câu chuyện về phía trước; “Rồi cô nói” tự nhiên trong lời kể tiếng Việt và giữ rõ trình tự.
- source_word: אֵלָיו
  choice: với ông
  rationale: Chuyển trực tiếp giới từ cùng hậu tố đại từ; “ông” phù hợp cách cô gái trẻ nói với người đầy tớ trưởng thành.
- source_word: גַּם ... גַּם ... גַּם
  choice: rất nhiều ... và ..., cũng có
  rationale: Cách diễn đạt này giữ sắc thái liệt kê tăng tiến của ba lần גַּם mà vẫn tự nhiên trong tiếng Việt.
- source_word: תֶּבֶן
  choice: rơm
  rationale: Trong bối cảnh cung cấp thức ăn và chỗ nghỉ cho đoàn lữ hành cùng lạc đà, “rơm” là cách dịch rõ ràng, thông dụng.
- source_word: מִסְפּוֹא
  choice: thức ăn cho súc vật
  rationale: Từ này chỉ thức ăn dành cho vật nuôi; cách dịch diễn nghĩa này dễ hiểu hơn từ Hán-Việt “thức ăn gia súc” và tránh từ cổ.
- source_word: רַב
  choice: rất nhiều
  rationale: Diễn đạt lượng dồi dào của các vật liệu sẵn có, sát nghĩa và tự nhiên.
- source_word: עִמָּנוּ
  choice: Nhà chúng tôi có
  rationale: Nghĩa đen là “ở với chúng tôi”; trong ngữ cảnh sở hữu và tiếp khách, “Nhà chúng tôi có” tự nhiên, đồng thời cho thấy đây là nguồn lực của gia đình cô.
- source_word: מָקוֹם
  choice: chỗ
  rationale: Giữ nghĩa rộng là một nơi hoặc không gian, không cụ thể hóa thành một căn phòng.
- source_word: לָלוּן
  choice: để nghỉ qua đêm
  rationale: Động từ nguyên mẫu chỉ việc lưu lại qua đêm; “nghỉ qua đêm” là cách nói hiện đại, tự nhiên trong ngữ cảnh hiếu khách.
theological_decisions: []
