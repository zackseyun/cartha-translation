base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: vi
  text: 'La-ban và Bê-tu-ên đáp lời rằng: “Việc này đến từ Yahweh; chúng tôi không thể nói với ông điều xấu hay điều tốt[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “điều xấu hay điều tốt” là một cách nói bao quát; trong ngữ cảnh này, nó hàm ý rằng họ không thể phản đối hoặc thay đổi việc Yahweh đã định.
    reason: Giải thích thành ngữ Hê-bơ-rơ mà không thay thế tính đa nghĩa của chính văn.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: đáp lời rằng
  rationale: Giữ chức năng của cả hai động từ trong công thức dẫn lời Hê-bơ-rơ, đồng thời diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: מֵיְהוָה יָצָא הַדָּבָר
  choice: Việc này đến từ Yahweh
  rationale: Giới từ מִן chỉ nguồn gốc; יָצָא trong kết cấu này nói sự việc phát xuất từ Yahweh. “Việc này” phù hợp với cuộc thương lượng hôn nhân đang được bàn đến.
- source_word: לֹא נוּכַל
  choice: chúng tôi không thể
  rationale: Diễn đạt trực tiếp ý nghĩa về khả năng của יכל, không bổ sung ý chấp thuận hay từ chối.
- source_word: דַּבֵּר אֵלֶיךָ
  choice: nói với ông
  rationale: Giữ hướng của hành động nói về phía người đầy tớ; “ông” thể hiện cách xưng hô lịch sự, phù hợp ngữ cảnh đối thoại.
- source_word: רַע אוֹ טוֹב
  choice: điều xấu hay điều tốt
  rationale: Giữ nguyên thứ tự và cặp đối cực của nguyên văn, đồng thời thêm “điều” để câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Mức độ giải nghĩa thành ngữ “xấu hay tốt”
  choice: Giữ thành ngữ trong chính văn và giải thích ở chú thích
  alternative: Diễn giải trong chính văn là “phản đối hay thay đổi”
  rationale: Nguyên văn dùng một cặp đối cực có sức gợi rộng. Giữ hình thức này tránh thu hẹp ý nghĩa, còn chú thích giúp độc giả hiểu hàm ý trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt; cấu trúc “đáp lời rằng” giữ sắc thái kể chuyện Kinh Thánh mà không quá cổ.
