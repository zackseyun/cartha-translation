  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וְ/הָיָ֤ה הָֽ/עַלְמָה֙ הַ/יֹּצֵ֣את לִ/שְׁאֹ֔ב וְ/אָמַרְתִּ֣י אֵלֶ֔י/הָ הַשְׁקִֽי/נִי נָ֥א מְעַט מַ֖יִם מִ/כַּדֵּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: vi
  text: '“Này, tôi đang đứng bên nguồn nước. Nguyện rằng thiếu nữ[a] đi ra múc nước, và khi tôi nói với cô ấy: ‘Xin cho tôi uống một ít nước từ vò của cô,’[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cô gái trẻ”; từ Hê-bơ-rơ chỉ một phụ nữ trẻ ở độ tuổi kết hôn và tự nó không có nghĩa rõ ràng là “trinh nữ”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Xin cho tôi một ít nước từ vò của cô để uống.”'
    reason: previous_rendering
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Tiểu từ chỉ xuất dùng để hướng sự chú ý vào cảnh đang được thuật lại; “Này” giữ được sắc thái sống động và trang trọng mà không quá cổ.
- source_word: אָנֹכִי נִצָּב
  choice: tôi đang đứng
  rationale: Đại từ độc lập cùng phân từ diễn tả tư thế hiện tại, đang tiếp diễn; tiếng Việt không cần thêm từ nhấn mạnh.
- source_word: עַל עֵין הַמָּיִם
  choice: bên suối nước
  rationale: עֵין ở đây chỉ mạch hay nguồn nước tự nhiên, vì vậy “suối nước” chính xác hơn cách dịch truyền thống là “giếng”.
- source_word: וְהָיָה
  choice: Nguyện rằng
  rationale: Trong lời cầu xin về một dấu hiệu, dạng này mang sắc thái mong ước; “Nguyện rằng” thể hiện điều ấy tự nhiên và trang trọng.
- source_word: הָעַלְמָה
  choice: thiếu nữ
  rationale: Từ này chỉ một phụ nữ trẻ ở độ tuổi kết hôn, nhưng tự nó không khẳng định tình trạng đồng trinh.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: nào đi ra múc nước
  rationale: Phân từ có mạo từ mô tả người nữ sẽ xuất hiện trong tình huống dự kiến; “múc nước” làm rõ đối tượng vốn đã được ngữ cảnh xác định.
- source_word: וְאָמַרְתִּי אֵלֶיהָ
  choice: và tôi nói với cô ấy
  rationale: Giữ trình tự hành động trong tiếng Hê-bơ-rơ và diễn đạt tự nhiên bằng tiếng Việt.
- source_word: הַשְׁקִינִי נָא
  choice: Xin cho tôi uống
  rationale: Dạng Hiphil của שׁקה có nghĩa khiến hoặc cho ai uống; נָא tạo sắc thái thỉnh cầu lịch sự.
- source_word: מְעַט מַיִם מִכַּדֵּךְ
  choice: một ít nước trong vò của cô
  rationale: “Vò” phù hợp với loại bình đựng nước được mang đi múc; “trong vò” là cách nói tự nhiên trong tiếng Việt cho nước được lấy ra từ vật chứa.
theological_decisions:
- issue: Ý nghĩa của עַלְמָה
  choice: thiếu nữ
  alternative: trinh nữ
  rationale: Trong câu này, từ Hê-bơ-rơ xác định một phụ nữ trẻ ở độ tuổi kết hôn nhưng không tự nó nói rõ cô còn đồng trinh hay không. Chọn “thiếu nữ” tránh đưa một kết luận vượt quá phạm vi từ vựng của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ ở dạng chưa hoàn tất vì nội dung tiếp tục sang câu kế tiếp; “Nguyện rằng” bảo tồn sắc thái lời cầu xin thay vì biến nó thành một lời tiên báo chắc chắn.
