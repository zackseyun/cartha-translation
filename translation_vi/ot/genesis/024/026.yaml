source:
  edition: WLC
  text: וַ/יִּקֹּ֣ד הָ/אִ֔ישׁ וַ/יִּשְׁתַּ֖חוּ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: vi
  text: Bấy giờ, người ấy cúi mình xuống và thờ phượng Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phủ phục trước Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “người ấy”, chỉ người đầy tớ của Áp-ra-ham.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: cúi mình xuống
  rationale: Động từ קָדַד diễn tả hành động khom hoặc cúi thấp người. Cách dịch này tự nhiên trong tiếng Việt và vẫn phân biệt hành động thể chất ấy với động từ chỉ sự thờ phượng theo sau.
- source_word: הָאִישׁ
  choice: người ấy
  rationale: Nguyên văn dùng danh từ אִישׁ, nghĩa là “người đàn ông/người ấy”, chứ không gọi thẳng là “đầy tớ”. “Người ấy” vừa tự nhiên trong tiếng Việt vừa không thay cách gọi của câu bằng một lời giải thích theo ngữ cảnh.
- source_word: וַיִּשְׁתַּחוּ
  choice: thờ phượng
  rationale: Dạng động từ này diễn tả việc sấp mình hoặc cúi lạy với lòng tôn kính; khi hướng về Yahweh, hành động mang ý nghĩa thờ phượng. Động từ trước đã nêu tư thế cúi mình, nên “thờ phượng” truyền đạt rõ ý nghĩa tôn giáo mà không lặp lại.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Giới từ לְ chỉ đối tượng của hành động, còn יהוה là thánh danh riêng của Đức Chúa Trời. Giữ “Yahweh” để thể hiện trực tiếp danh giao ước trong nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch thánh danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng danh יהוה. Phiên âm “Yahweh” bảo toàn tính chất danh riêng và không đồng nhất danh này với một tước hiệu.
- issue: Nên diễn đạt וַיִּשְׁתַּחוּ là tư thế phủ phục hay hành động thờ phượng
  choice: thờ phượng
  alternative: phủ phục trước; cúi lạy
  rationale: Vì hành động hướng đến Yahweh, động từ không chỉ mô tả một cử chỉ xã giao mà mang ý nghĩa tôn kính, thờ phượng. Tuy vậy, nghĩa chỉ tư thế thân thể là có thật nên được giữ trong chú thích như một cách dịch khả dĩ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bấy giờ” nối câu với diễn tiến trước đó; “cúi mình xuống” nêu hành động thể chất, còn “thờ phượng” nêu ý nghĩa tôn giáo. Cách gọi “người ấy” tránh giải thích quá mức thành “người đầy tớ” ngay trong chính văn.
