revisions:
- from: Rồi tôi cúi mình xuống thờ lạy Yahweh và chúc tụng Yahweh, Đức Chúa Trời của Áp-ra-ham, chủ tôi, là Đấng đã dẫn tôi đi đúng đường[a] để cưới con gái của em trai chủ tôi về cho con trai người.
  to: Rồi tôi cúi mình xuống và thờ lạy Yahweh, và tôi chúc tụng Yahweh, Đức Chúa Trời của Áp-ra-ham, chủ tôi, Đấng đã dẫn tôi theo con đường chân thật[a] để đem con gái của người anh em của chủ tôi về cho con trai người.
  rationale: Sửa «em trai» thành «người anh em» để không thêm thông tin về thứ tự tuổi vốn không có trong nguyên ngữ. Sửa «đi đúng đường» thành «theo con đường chân thật» để bảo lưu sắc thái אמת, đồng thời giữ chú thích cho nghĩa đáng tin cậy/trung tín. Thêm «và» giữa hai động từ đầu để phản ánh rõ hai hành động nối tiếp trong tiếng Hê-bơ-rơ.
