  - severity: medium
    issue: «đi đúng đường» làm hẹp nghĩa của בְּדֶרֶךְ אֱמֶת.
    rationale: אֱמֶת mang sắc thái chân thật, đáng tin, trung tín. Cách diễn đạt «con đường chân thật» giữ nét nghĩa này tốt hơn; chú thích có thể làm rõ các khả năng ngữ nghĩa.
