  terminology: «Yahweh», «Đức Chúa Trời», «thờ lạy», và «chúc tụng» phù hợp. «Con đường chân thật» bảo lưu từ vựng của אמת; chú thích nêu sắc thái «đáng tin cậy/trung tín» mà không ép nghĩa vào một cách hiểu duy nhất.
  issues:
