  source_fidelity: 'Bản dịch phân biệt đúng hai hành vi וָאֶקֹּד và וָאֶשְׁתַּחֲוֶה, giữ danh Yahweh, và diễn đạt đúng quan hệ chủ-tớ. Tuy nhiên, «em trai chủ tôi» thêm một chi tiết không có trong tiếng Hê-bơ-rơ: אֲחִי chỉ là «anh/em trai», không xác định thứ tự tuổi. «đi đúng đường» cũng nghiêng về sự đúng hướng/đúng đích, chưa giữ đủ nét nghĩa אמת (chân thật, đáng tin cậy, trung tín).'
