base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: vi
  text: Rồi tôi cúi mình xuống và thờ lạy Yahweh, và tôi chúc tụng Yahweh, Đức Chúa Trời của Áp-ra-ham, chủ tôi, Đấng đã dẫn tôi theo con đường chân thật[a] để đem con gái của người anh em của chủ tôi về cho con trai người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “trên con đường của sự chân thật.” Cụm từ cũng có thể chỉ con đường đáng tin cậy hoặc sự hướng dẫn trung tín của Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: tôi cúi mình xuống
  rationale: Diễn tả cử chỉ hạ thấp thân mình mà không xác định quá mức là quỳ gối hay phủ phục.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: thờ lạy Yahweh
  rationale: Động từ chỉ hành vi phủ phục tỏ lòng tôn kính; khi hướng đến Đức Chúa Trời, “thờ lạy” là cách diễn đạt tự nhiên và trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: chúc tụng Yahweh
  rationale: ברך khi có Đức Chúa Trời làm đối tượng mang nghĩa nói lời tôn vinh; “chúc tụng” giữ được nét nghĩa của động từ và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Đức Chúa Trời của Áp-ra-ham, chủ tôi
  rationale: אֲדֹנִי ở đây chỉ người chủ loài người của đầy tớ; cách đặt đồng vị này tự nhiên và tránh hiểu là một danh hiệu thần linh.
- source_word: הִנְחַנִי
  choice: đã dẫn tôi đi
  rationale: Thể Hiphil của נחה diễn tả việc hướng dẫn hoặc dẫn đi; “đã dẫn tôi đi” phù hợp với lời kể nhìn lại.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: đi đúng đường
  rationale: Trong ngữ cảnh, cụm từ nói đến sự hướng dẫn đáng tin cậy đưa người đầy tớ đến đúng nơi; chú thích bảo lưu nghĩa sát chữ “trên con đường của sự chân thật” và sắc thái trung tín/đáng tin.
- source_word: לָקַחַת
  choice: để cưới ... về
  rationale: Trong bối cảnh sắp đặt hôn nhân, mục đích là đem người nữ về làm vợ cho con trai Áp-ra-ham; cách dịch này tự nhiên hơn “lấy” nhưng không biến người đầy tớ thành chủ thể kết hôn.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: con gái của em trai chủ tôi
  rationale: Quan hệ gia đình trong ngữ cảnh là Bê-tu-ên thuộc nhánh của Na-cô, em trai Áp-ra-ham; “em trai” làm rõ quan hệ theo mạch truyện.
- source_word: לִבְנוֹ
  choice: cho con trai người
  rationale: Đại từ quy chiếu về Áp-ra-ham; “người” tránh lặp tên và vẫn rõ nghĩa.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ tự thần danh; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của בְּדֶרֶךְ אֱמֶת
  choice: đi đúng đường, kèm chú thích về sự chân thật/trung tín
  alternative: trên con đường chân thật / theo con đường đáng tin cậy
  rationale: Cụm từ có thể nhấn mạnh cả con đường đúng dẫn đến mục tiêu lẫn sự hướng dẫn trung tín, đáng tin của Yahweh; chú thích giữ lại độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chủ tôi” cho quan hệ giữa người đầy tớ và Áp-ra-ham; dùng “chúc tụng” để giữ sắc thái thờ phượng. Danh riêng được viết theo lối phiên âm tiếng Việt, còn Yahweh được giữ theo dạng phiên âm quốc tế.
