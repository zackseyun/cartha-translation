  yaml_path: translation/ot/genesis/024/066.yaml
  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: vi
  text: Người đầy tớ thuật lại cho Y-sác mọi việc mình đã làm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi sự việc”, “mọi vấn đề” hoặc “mọi lời”; từ Hê-bơ-rơ דְּבָרִים có thể mang các nghĩa này tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: thuật lại
  rationale: Động từ Piel của ספר trong ngữ cảnh này chỉ việc kể lại đầy đủ những gì đã xảy ra; “thuật lại” tự nhiên và rõ hơn lối dịch đơn giản “nói”.
- source_word: הָעֶבֶד
  choice: người đầy tớ
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ. Trong mạch truyện này, vai trò thi hành sứ mạng của người ấy được nhấn mạnh hơn tình trạng pháp lý, nên “người đầy tớ” phù hợp nhất.
- source_word: לְיִצְחָק
  choice: cho Y-sác
  rationale: Giới từ לְ đánh dấu người tiếp nhận lời kể; tên riêng được phiên âm theo quy ước Kinh Thánh tiếng Việt quen thuộc.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: mọi việc
  rationale: דְּבָרִים có phạm vi nghĩa gồm lời nói, sự việc và vấn đề. Ở đây từ này bao quát các diễn biến và công việc trong chuyến đi, nên “mọi việc” vừa chính xác vừa tự nhiên.
- source_word: אֲשֶׁר עָשָׂה
  choice: mình đã làm
  rationale: Chủ thể ngầm của עָשָׂה là người đầy tớ. “Mình” quy chiếu tự nhiên về chủ ngữ trong tiếng Việt, còn “đã” cho thấy các việc ấy hoàn tất trước lúc được thuật lại.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người đầy tớ” theo ngữ cảnh; không thêm chú thích riêng về “nô lệ” vì câu chính đã phản ánh nghĩa thích hợp, còn độ rộng nghĩa đáng lưu ý của דְּבָרִים được giữ trong chú thích.
