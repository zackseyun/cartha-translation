base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: vi
  text: I-sác đưa nàng vào lều của mẹ mình là Sa-ra[a]. Ông lấy Rê-bê-ca, nàng trở thành vợ ông, và ông yêu nàng. Thế là I-sác được an ủi sau khi mẹ qua đời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt: “vào lều của Sa-ra, mẹ ông.” Trật tự từ trong tiếng Hê-bơ-rơ cho phép cả hai cách sắp xếp, với cùng ý nghĩa căn bản.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “sau mẹ mình.” Theo ngữ cảnh, câu này nói đến thời gian sau khi mẹ ông qua đời, dù từ “qua đời” không được nói rõ trong tiếng Hê-bơ-rơ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: đưa nàng vào
  rationale: Dạng Hifil của בוא cùng hậu tố giống cái số ít diễn tả việc khiến nàng đi vào, tức là đưa nàng vào; cách dịch này tự nhiên và giữ rõ hành động của I-sác.
- source_word: הָאֹהֱלָה
  choice: vào lều
  rationale: Hậu tố chỉ hướng ה biểu thị chuyển động hướng tới và, trong ngữ cảnh này, đi vào trong lều.
- source_word: שָׂרָה אִמּוֹ
  choice: của mẹ mình là Sa-ra
  rationale: Cụm đồng vị xác định Sa-ra là mẹ I-sác và chiếc lều thuộc về bà; cách diễn đạt này rõ ràng, tự nhiên trong tiếng Việt.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: Ông lấy Rê-bê-ca
  rationale: לקח có nghĩa cơ bản là “lấy”; trong ngữ cảnh hôn nhân, tiếng Việt “lấy” truyền đạt việc nhận nàng làm vợ mà vẫn giữ được mệnh đề tiếp theo nói nàng trở thành vợ ông.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: nàng trở thành vợ ông
  rationale: Cấu trúc היה + ל + אשה chỉ việc bước vào địa vị hôn nhân; “trở thành vợ ông” giữ tiến trình của lời kể.
- source_word: וַיֶּאֱהָבֶהָ
  choice: ông yêu nàng
  rationale: אהב là động từ thông thường chỉ tình yêu; không cần tăng hoặc giảm sắc thái.
- source_word: וַיִּנָּחֵם
  choice: được an ủi
  rationale: Dạng Nifal của נחם ở đây chỉ việc nhận được sự an ủi, không phải ăn năn.
- source_word: אַחֲרֵי אִמּוֹ
  choice: sau khi mẹ qua đời
  rationale: Nghĩa đen là “sau mẹ mình”, nhưng theo ngữ cảnh từ Sáng Thế Ký 23:1–2, cụm này nói đến thời gian sau khi mẹ ông qua đời. Bản dịch làm rõ hàm ý để tiếng Việt không tối nghĩa, đồng thời chú thích nghĩa đen.
theological_decisions:
- issue: Có nên nói rõ cái chết của mẹ I-sác hay giữ nguyên cụm rút gọn “sau mẹ mình”
  choice: sau khi mẹ qua đời
  alternative: sau mẹ mình; sau sự mất mát về mẹ mình
  rationale: Nguyên văn không có danh từ “cái chết”, nhưng ngữ cảnh đã nói Sa-ra qua đời và tiếng Việt không thể dùng tự nhiên cụm “sau mẹ mình” với cùng hàm ý. Chú thích bảo tồn hình thức rút gọn của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” dành cho I-sác, “nàng” dành cho Rê-bê-ca giúp phân biệt nhân vật rõ ràng. Cấu trúc các mệnh đề được giữ gần với nhịp kể liên tiếp của nguyên văn.
