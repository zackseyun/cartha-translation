  text: וַ/יְבָרֲכ֤וּ אֶת רִבְקָה֙ וַ/יֹּ֣אמְרוּ לָ֔/הּ אֲחֹתֵ֕/נוּ אַ֥תְּ הֲיִ֖י לְ/אַלְפֵ֣י רְבָבָ֑ה וְ/יִירַ֣שׁ זַרְעֵ֔/ךְ אֵ֖ת שַׁ֥עַר שֹׂנְאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: vi
  text: 'Họ chúc phước cho Rê-bê-ca và nói với nàng: “Người chị em của chúng ta, nguyện nàng trở nên mẹ của hàng nghìn vạn người[a], và nguyện dòng dõi nàng chiếm được cổng thành của những kẻ thù ghét dòng dõi ấy[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “muôn vàn người”; nguyên văn là “hàng nghìn vạn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thừa hưởng cổng thành của những kẻ thù ghét dòng dõi ấy.” Nguyên ngữ nói sát là “chiếm hữu cổng của những kẻ ghét nó/người ấy”; “cổng thành” là hình ảnh chỉ sức mạnh và quyền kiểm soát một thành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: Họ chúc phước
  rationale: Diễn đạt trực tiếp thể Piel của ברך, chỉ hành động nói lời chúc phước trên Rê-bê-ca.
- source_word: רִבְקָה
  choice: Rê-bê-ca
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, gần với tên Hê-bơ-rơ.
- source_word: אֲחֹתֵנוּ
  choice: Em gái chúng ta
  rationale: Trong ngữ cảnh gia đình đang tiễn Rê-bê-ca, cách xưng hô này tự nhiên trong tiếng Việt; nguyên ngữ chỉ nói 'chị/em gái của chúng ta' mà không phân biệt tuổi.
- source_word: הֲיִי
  choice: nguyện em trở thành
  rationale: Giữ sắc thái lời cầu chúc của thức mệnh lệnh trong công thức ban phước, thay vì diễn đạt như một mệnh lệnh trực tiếp.
- source_word: לְאַלְפֵי רְבָבָה
  choice: hàng ngàn vạn người
  rationale: Giữ hình ảnh số lượng phóng đại gồm 'ngàn' và 'vạn' của nguyên ngữ, đồng thời thêm 'người' để câu tiếng Việt rõ và tự nhiên.
- source_word: וְיִירַשׁ
  choice: nguyện ... chiếm được
  rationale: Trong kết hợp với 'cổng thành', ירש nói đến việc giành quyền sở hữu hoặc kiểm soát do chiến thắng; 'chiếm được' truyền đạt rõ ý này.
- source_word: זַרְעֵךְ
  choice: dòng dõi em
  rationale: Dịch danh từ tập hợp số ít זרע bằng cách nói tự nhiên trong tiếng Việt, vẫn giữ âm hưởng lời hứa về hậu duệ.
- source_word: שַׁעַר
  choice: cổng thành
  rationale: Làm rõ rằng 'cổng' là cổng của một thành, hình ảnh biểu trưng cho sức mạnh phòng thủ và quyền kiểm soát đô thị.
- source_word: שֹׂנְאָיו
  choice: những kẻ thù ghét mình
  rationale: Phân từ có nghĩa sát là 'những kẻ ghét nó/người ấy'. Đại từ phản thân 'mình' giữ được quy chiếu tập hợp về 'dòng dõi' mà không buộc tiếng Việt chọn số ít hay số nhiều.
theological_decisions:
- issue: Danh từ tập hợp số ít chỉ dòng dõi và đại từ hồi chỉ số ít
  choice: dòng dõi em ... những kẻ thù ghét mình
  alternative: con cháu em ... những kẻ thù ghét họ; dòng dõi em ... những kẻ thù ghét người ấy
  rationale: Nguyên ngữ dùng זרע, một danh từ tập hợp số ít, rồi dùng hậu tố đại từ giống đực số ít. 'Dòng dõi' bảo tồn ngôn ngữ tập hợp của lời hứa; 'mình' là cách tiếng Việt tự nhiên để tránh áp đặt cách hiểu hoàn toàn số ít hoặc hoàn toàn số nhiều.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Cặp từ “nguyện ...” giữ nhịp điệu của lời chúc phước; “em” phù hợp lời gia đình gọi Rê-bê-ca, còn chú thích có thể làm rõ nguyên ngữ không phân biệt chị hay em.
