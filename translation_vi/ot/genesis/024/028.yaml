translation:
  language: vi
  text: Rồi cô gái chạy đến nhà mẹ mình[a] và kể lại những việc ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hộ gia đình của mẹ cô.” Cụm từ Hê-bơ-rơ có thể chỉ căn nhà của mẹ cô hoặc những người trong hộ gia đình của bà.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: chạy về
  rationale: Động từ רוץ chỉ sự chạy nhanh; thêm “về” làm rõ hướng chuyển động theo ngữ cảnh cô trở lại nhà, nhưng không làm thay đổi nội dung hành động.
- source_word: הַנַּעֲרָ
  choice: cô gái
  rationale: נַעֲרָה chỉ một người nữ trẻ tuổi. “Cô gái” tự nhiên trong tiếng Việt hiện đại và phù hợp với Rê-bê-ca trong ngữ cảnh.
- source_word: וַתַּגֵּד
  choice: kể
  rationale: Thể Hiphil của נגד có nghĩa làm cho biết, thuật lại. “Kể” phù hợp với việc cô thuật lại những điều vừa xảy ra.
- source_word: לְבֵית אִמָּהּ
  choice: cho nhà mẹ mình
  rationale: בַּיִת có thể chỉ căn nhà hoặc gia đình sống trong nhà. Cách dịch ngắn gọn này giữ được sự mơ hồ của nguyên ngữ, với chú thích nêu rõ hai khả năng.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: những việc ấy
  rationale: דְּבָרִים có thể là lời nói, sự việc hoặc vấn đề. Trong ngữ cảnh, cụm từ nói đến những gì vừa xảy ra nên “những việc ấy” tự nhiên và chính xác.
