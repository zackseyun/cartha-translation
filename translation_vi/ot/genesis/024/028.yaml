- from: Rồi cô gái chạy về, kể cho nhà mẹ mình[a] những việc ấy.
  to: Rồi cô gái chạy đến nhà mẹ mình[a] và kể lại những việc ấy.
  rationale: Bản sửa giữ sát hành động và trật tự trần thuật của tiếng Hê-bơ-rơ, đồng thời thay cấu trúc không tự nhiên bằng lối nói tiếng Việt hiện đại. Chú thích được sửa để bảo tồn đúng sự mơ hồ từ vựng của בַּיִת mà không mở rộng thành nghĩa họ hàng bên ngoại.
