source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: vi
  text: 'Ông nói: “Mời vào, người được Yahweh ban phước![a] Sao ông còn đứng ở ngoài? Tôi đã dọn chỗ trong nhà và chuẩn bị chỗ cho lạc đà rồi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Hỡi người được Yahweh ban phước!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ông nói
  rationale: Thể wayyiqtol tiếp nối mạch kể chuyện; tiếng Việt tự nhiên không cần luôn dịch liên từ וְ thành “và”.
- source_word: בּוֹא
  choice: Mời vào
  rationale: Mệnh lệnh בוא trong ngữ cảnh tiếp khách hàm ý bước vào nhà; “mời vào” vừa tự nhiên vừa thể hiện phép lịch sự phù hợp.
- source_word: בְּרוּךְ יְהוָה
  choice: người được Đức Giê-hô-va ban phước
  rationale: Phân từ bị động ở đây được dùng như lời xưng hô. Cách dịch này diễn đạt rõ nghĩa được YHWH chúc phước, đồng thời giữ chú thích cho khả năng hiểu cấu trúc theo cách khác.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong tiếng Việt để biểu thị trực tiếp Tứ tự danh, thay vì thay bằng tước hiệu “CHÚA”.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: Sao ông còn đứng ở ngoài?
  rationale: “Sao” tự nhiên trong lời mời trực tiếp; “còn” chuyển tải sắc thái người khách đang tiếp tục đứng bên ngoài mà không biến động từ thành “ở lại”.
- source_word: פִּנִּיתִי הַבַּיִת
  choice: Tôi đã dọn nhà
  rationale: פנה ở thể piel có nghĩa làm trống, dọn chỗ. “Đã dọn nhà” gần nghĩa cụ thể của động từ hơn “đã chuẩn bị nhà” và phù hợp bối cảnh tiếp khách.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: và chuẩn bị chỗ cho lạc đà rồi
  rationale: Nguyên văn nói “và chỗ cho lạc đà”; trong tiếng Việt, bổ sung động từ được hiểu từ mệnh đề trước giúp câu trôi chảy. “Rồi” thể hiện trạng thái chuẩn bị đã hoàn tất.
theological_decisions:
- issue: Cách dịch danh thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản văn dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” bảo tồn chức năng danh riêng và là dạng gọi trang trọng, quen thuộc trong tiếng Việt, không thay danh ấy bằng một tước hiệu.
- issue: Quan hệ nghĩa trong בְּרוּךְ יְהוָה
  choice: người được Đức Giê-hô-va ban phước
  alternative: người có phước thuộc về Đức Giê-hô-va
  rationale: Cấu trúc có thể được hiểu theo sắc thái tác nhân (“được YHWH ban phước”) hoặc sở thuộc/liên hệ (“người có phước của YHWH”). Bản chính chọn cách tự nhiên nhất trong tiếng Việt, còn chú thích bảo tồn phương án kia.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” phù hợp lời một người đàn ông nói với một người đàn ông trưởng thành chưa quen biết; “mời” thể hiện ngữ cảnh hiếu khách mà không làm yếu sắc thái mệnh lệnh.
