  text: וַ/יֵּצֵ֥א יִצְחָ֛ק לָ/שׂ֥וּחַ בַּ/שָּׂדֶ֖ה לִ/פְנ֣וֹת עָ֑רֶב וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּ֥ה גְמַלִּ֖ים בָּאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: vi
  text: Y-sác đi ra ngoài đồng để suy ngẫm[a] lúc chiều xuống. Ông ngước mắt lên và nhìn, kìa, những con lạc đà đang đi tới.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đi dạo,” “trầm tư,” “trò chuyện,” hoặc có lẽ “cầu nguyện” ngoài đồng. Động từ Hê-bơ-rơ này hiếm gặp, nên sắc thái chính xác của nó tại đây không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: đi ra
  rationale: Động từ יצא ở thể Qal diễn tả sự đi ra ngoài; cách dịch này tự nhiên và giữ trình tự kể chuyện.
- source_word: יִצְחָק
  choice: Y-sác
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: לָשׂוּחַ
  choice: để suy ngẫm
  rationale: Động từ שׂוח hiếm gặp và nghĩa chính xác trong câu này còn chưa chắc chắn. “Suy ngẫm” phù hợp với bối cảnh một mình ngoài đồng mà không xác định quá mức rằng đây là cầu nguyện; các khả năng khác được giữ trong chú thích.
- source_word: בַּשָּׂדֶה
  choice: ngoài đồng
  rationale: שׂדה chỉ cánh đồng hoặc vùng đất trống; “ngoài đồng” là cách nói tự nhiên trong tiếng Việt và phù hợp với động từ “đi ra”.
- source_word: לִפְנוֹת עָרֶב
  choice: lúc chiều xuống
  rationale: Cụm từ chỉ thời điểm chiều đang đến; cách dịch này tự nhiên và vẫn giữ sắc thái chuyển sang buổi tối.
- source_word: וַיִּשָּׂא עֵינָיו
  choice: ông ngước mắt lên
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ về việc hướng ánh nhìn lên hoặc ra xa.
- source_word: וַיַּרְא
  choice: và nhìn
  rationale: Dịch riêng động từ ראה để giữ chuỗi hành động sau khi Y-sác ngước mắt lên.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: Hạt từ הִנֵּה hướng sự chú ý đến cảnh tượng vừa xuất hiện; “kìa” giữ được tính trực quan và sinh động của lời kể.
- source_word: גְמַלִּים בָּאִים
  choice: những con lạc đà đang đi tới
  rationale: Phân từ בָּאִים diễn tả chuyển động đang tiếp diễn về phía người quan sát; “đang đi tới” thể hiện rõ tiến trình ấy mà không thêm chi tiết về đoàn người.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hạt từ gây chú ý “kìa” cùng hình ảnh “ngước mắt lên,” đồng thời dùng chú thích để bảo toàn sự bất định thật sự của động từ hiếm שׂוח.
