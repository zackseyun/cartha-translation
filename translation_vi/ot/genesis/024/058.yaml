  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: vi
  text: 'Họ gọi Rê-bê-ca đến và nói với nàng: “Con có đi với người đàn ông này không?” Nàng đáp: “Con sẽ đi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: Họ gọi Rê-bê-ca đến
  rationale: קרא với giới từ ל trong ngữ cảnh này mang nghĩa gọi một người đến để tham gia cuộc trao đổi. “Gọi ... đến” tự nhiên trong tiếng Việt và không hàm ý cưỡng ép như “triệu đến”.
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: và nói với nàng
  rationale: Giữ sát động từ thông dụng אמר là “nói”; “hỏi nàng” phù hợp ngữ cảnh nhưng kém trực tiếp hơn so với cách diễn đạt của nguyên văn.
- source_word: הֲתֵלְכִי
  choice: Con có đi ... không?
  rationale: Đây là câu hỏi trực tiếp với động từ הלך, “đi”. Cấu trúc “có ... không” là cách hỏi tự nhiên trong tiếng Việt, không thêm sắc thái “có sẵn lòng” vốn không được nói rõ trong nguyên văn.
- source_word: עִם הָאִישׁ הַזֶּה
  choice: với người này
  rationale: אִישׁ ở đây chỉ một người đàn ông đã hiện diện rõ trong ngữ cảnh. “Người này” tự nhiên hơn “người đàn ông này” trong lời thoại tiếng Việt, đồng thời không thay bằng “đầy tớ”, dù nhân vật ấy là đầy tớ của Áp-ra-ham.
- source_word: וַתֹּאמֶר
  choice: Nàng đáp
  rationale: אמר theo nghĩa đen là “nói”, nhưng sau một câu hỏi, “đáp” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt, không thêm nội dung.
- source_word: אֵלֵךְ
  choice: Con sẽ đi
  rationale: 'Dạng ngôi thứ nhất số ít của הלך diễn tả lời khẳng định đơn giản: “tôi/con sẽ đi”. Đại từ “con” phù hợp với lời một phụ nữ trẻ thưa với gia đình trong ngữ cảnh.'
- source_word: רִבְקָה
  choice: Rê-bê-ca
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, gần với âm của tên Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Trong lời thoại gia đình, dùng cặp xưng hô ngầm “con” để phản ánh quan hệ của Rê-bê-ca với mẹ và anh trai được nêu ở câu trước; câu dẫn dùng “nàng” nhằm giữ giọng kể trang trọng, tránh lặp tên.
