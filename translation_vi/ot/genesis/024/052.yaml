  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự tự sự, chủ ngữ, nội dung lời nói của họ, và hành động cúi rạp xuống đất hướng về יהוה. Tuy nhiên, danh riêng יהוה nên được chuyển nhất quán là “Yahweh” theo quyết định thuật ngữ của hồ sơ kiểm tra tiếng Anh, thay vì dạng “Đức Giê-hô-va” trong bản thảo.
  naturalness: “Khi ... nghe những lời họ nói” là tự nhiên. “Phủ phục xuống đất” diễn tả rõ tư thế thân thể của וַיִּשְׁתַּחוּ אַרְצָה và có văn phong trang trọng, hiện đại. Bỏ “liền” tránh thêm sắc thái tức thì không được nêu riêng bởi bản văn.
  terminology: Dùng “Yahweh” bảo toàn Danh Bốn Chữ và phù hợp với quyết định cập nhật trong hồ sơ tiếng Anh. “Phủ phục” không giải thích quá mức động từ thành một thuật ngữ thờ phượng, trong khi chú thích duy trì khả năng sắc thái tôn kính/thờ phượng.
  issues:
