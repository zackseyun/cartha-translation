source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת דִּבְרֵי/הֶ֑ם וַ/יִּשְׁתַּ֥חוּ אַ֖רְצָ/ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: vi
  text: Khi đầy tớ của Áp-ra-ham nghe những lời họ nói, ông phủ phục xuống đất trước Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông cúi rạp mình xuống đất trước Yahweh.” Động từ Hê-bơ-rơ có thể chỉ hành động cúi rạp với lòng tôn kính, kể cả trong sự thờ phượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Khi
  rationale: Công thức tự sự Hê-bơ-rơ mở đầu sự việc kế tiếp; “Khi” diễn đạt tự nhiên quan hệ thời gian mà không dịch cứng thành “và xảy ra rằng”.
- source_word: שָׁמַע
  choice: nghe
  rationale: Động từ chỉ việc nghe điều vừa được nói; cách dịch trực tiếp và tự nhiên trong ngữ cảnh.
- source_word: עֶבֶד אַבְרָהָם
  choice: đầy tớ của Áp-ra-ham
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ, nhưng ở đây trọng tâm là vai trò người đại diện trong gia đình Áp-ra-ham; “đầy tớ” vừa phù hợp ngữ cảnh vừa không xác quyết quá mức địa vị pháp lý.
- source_word: דִּבְרֵיהֶם
  choice: những lời họ nói
  rationale: Diễn đạt thành ngữ hơn “những lời của họ” trong tiếng Việt, đồng thời giữ đúng ý chỉ nội dung họ vừa nói.
- source_word: וַיִּשְׁתַּחוּ
  choice: liền sấp mình
  rationale: Động từ diễn tả cúi rạp hoặc phủ phục, thường mang sắc thái tôn kính; “sấp mình” giữ rõ hành động thân thể mà không thu hẹp nghĩa thành một thuật ngữ thờ phượng.
- source_word: אַרְצָה
  choice: xuống đất
  rationale: Hình thái chỉ hướng diễn tả chuyển động về phía mặt đất; “xuống đất” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: לַיהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: Giới từ ל với động từ phủ phục có thể dịch sát là “với/hướng về”; “trước mặt” diễn đạt tự nhiên tư thế tôn kính đối với Đức Giê-hô-va, còn chú thích bảo lưu khả năng dịch sát hơn.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Hằng Hữu; CHÚA
  rationale: Bản văn dùng trực tiếp Danh Bốn Chữ. “Đức Giê-hô-va” là dạng danh riêng quen thuộc, trang trọng trong tiếng Việt và không thay danh ấy bằng một tước hiệu.
- issue: Có dịch וַיִּשְׁתַּחוּ rõ thành hành vi thờ phượng hay không
  choice: sấp mình xuống đất trước mặt Đức Giê-hô-va
  alternative: thờ lạy Đức Giê-hô-va; phủ phục trước mặt Đức Giê-hô-va
  rationale: Cụm từ nêu rõ tư thế thân thể và đối tượng là Đức Giê-hô-va, nên hàm ý tôn kính hoặc thờ phượng hiện diện nhưng không cần được giải quyết hẹp bằng động từ “thờ lạy” trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để nối chủ ngữ là người đầy tớ mà không lặp nặng nề; “liền” thể hiện diễn tiến kế tiếp nhanh trong lời kể. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
