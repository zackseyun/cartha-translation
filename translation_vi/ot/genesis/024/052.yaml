  to: Khi đầy tớ của Áp-ra-ham nghe những lời họ nói, ông phủ phục xuống đất trước Yahweh.[a]
  rationale: 'Bản sửa giữ nguyên nghĩa cơ bản của tiếng Hê-bơ-rơ: sau khi nghe lời họ, đầy tớ Áp-ra-ham cúi rạp xuống đất hướng về יהוה. “Phủ phục” diễn đạt tự nhiên và cụ thể tư thế được bổ nghĩa bởi “xuống đất”; chú thích bảo lưu biên độ nghĩa của động từ. Danh riêng được chuẩn hóa thành “Yahweh” theo hồ sơ dự án.'
