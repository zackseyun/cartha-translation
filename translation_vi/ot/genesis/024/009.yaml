  terminology: “Người đầy tớ” và “chủ” nhất quán với quan hệ xã hội được bản văn nêu, đồng thời tránh dùng “Chúa/lord” dễ gây lẫn với tước hiệu thần linh. “Dưới đùi” bảo toàn tính cụ thể và tính mơ hồ của יָרֵךְ. Chú thích diễn đạt đúng tính không chắc chắn của ý nghĩa biểu tượng, không khẳng định một cách giải thích giáo phái nào.
