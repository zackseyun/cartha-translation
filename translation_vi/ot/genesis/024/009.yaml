source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: vi
  text: Vậy, người đầy tớ đặt tay mình dưới đùi Áp-ra-ham, chủ mình, và thề với ông về việc ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dưới đùi” là cách dịch sát thành ngữ Hê-bơ-rơ chỉ một cử chỉ khi lập lời thề long trọng; một số người hiểu cử chỉ này có ý nghĩa biểu tượng liên quan đến vùng hông hoặc dòng dõi giao ước.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: người đầy tớ
  rationale: עֶבֶד có thể chỉ đầy tớ hoặc nô lệ; trong mạch truyện này, vai trò của người ấy trong nhà Áp-ra-ham được nhấn mạnh hơn thân phận pháp lý, nên “người đầy tớ” vừa tự nhiên vừa giữ được quan hệ trên dưới.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: đặt tay mình
  rationale: שׂוּם có nghĩa thông dụng là đặt, để; “đặt tay mình” diễn đạt trực tiếp hành động và tự nhiên trong tiếng Việt.
- source_word: תַּחַת יֶרֶךְ
  choice: dưới đùi
  rationale: יָרֵךְ theo nghĩa cụ thể là “đùi”. Bản dịch giữ nguyên hình ảnh của tiếng Hê-bơ-rơ, không đưa cách giải thích về biểu tượng vào chính văn.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: Áp-ra-ham, chủ mình
  rationale: אֲדוֹן ở đây chỉ người có quyền trong quan hệ gia đình–xã hội; “chủ” phù hợp hơn “chúa” và tránh lẫn với cách gọi Đức Chúa Trời.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: và thề với ông
  rationale: Động từ שׁבע ở thể Niphal có nghĩa là thề hoặc lập lời thề; “thề với ông” ngắn gọn và giữ được hướng đối tượng của לוֹ.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: về việc ấy
  rationale: דָּבָר ở đây chỉ việc Áp-ra-ham vừa giao phó; “việc ấy” rõ nghĩa trong văn cảnh và phản ánh đại từ chỉ định của nguyên văn.
theological_decisions:
- issue: Dịch nguyên dạng hay giải thích biểu tượng của cử chỉ lập lời thề
  choice: Giữ cách diễn đạt cụ thể “dưới đùi” trong chính văn và nêu khả năng biểu tượng ở chú thích.
  alternative: Dịch theo lối diễn giải là cử chỉ liên quan đến hông, cơ quan sinh dục hoặc dòng dõi giao ước.
  rationale: Nguyên văn chỉ thuật lại hành động mà không giải thích ý nghĩa. Giữ hình ảnh nguyên dạng bảo toàn sự mơ hồ thực sự của bản văn và tránh áp đặt một cách hiểu thần học riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người đầy tớ” và “chủ” để thể hiện quan hệ xã hội trong gia đình Áp-ra-ham mà không làm câu văn cổ kính quá mức; giữ hình ảnh cụ thể của nguyên văn và đặt dấu chú thích ngay sau mệnh đề liên quan.
