  source_fidelity: 'Bản dịch bám sát tiếng Hê-bơ-rơ: עֶבֶד được dịch là “người đầy tớ”; hành động đặt tay và vị trí “dưới đùi” được giữ theo nghĩa cụ thể; “Áp-ra-ham, chủ mình” phản ánh đúng quan hệ sở hữu/chủ nhân trong אֲדֹנָיו; và “thề với ông về việc ấy” truyền đạt đầy đủ hướng của לוֹ cùng nội dung עַל הַדָּבָר הַזֶּה. Không có chỗ nào tự ý giải thích nghi thức vào chính văn.'
