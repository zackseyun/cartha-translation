base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: vi
  text: Người ấy vào nhà; rồi dỡ đồ khỏi lạc đà[a], cho lạc đà rơm và thức ăn, đồng thời đưa nước để ông và những người đi cùng ông rửa chân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “mở những con lạc đà”, một lối nói có thể chỉ việc tháo yên, nới dây buộc hoặc dỡ đồ khỏi chúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: Người ấy vào nhà
  rationale: Giữ cách gọi nguyên văn là “người ấy” thay vì diễn giải thành “người đầy tớ”; hậu tố chỉ hướng ở הַבַּיְתָה cho thấy chuyển động vào nhà.
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: dỡ đồ khỏi lạc đà
  rationale: Động từ פתח có nghĩa đen là “mở”, nhưng trong ngữ cảnh lạc đà vừa đến nơi, cụm này chỉ việc tháo hoặc dỡ trang bị, hành lý để chúng được nghỉ.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: rơm và thức ăn
  rationale: תֶּבֶן là rơm dùng cho gia súc; מִסְפּוֹא là thức ăn hoặc thức ăn gia súc. Cách dịch này rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו
  choice: đưa nước để ông ... rửa chân
  rationale: Động từ nguyên mẫu diễn tả mục đích. Đại từ “ông” quy chiếu về người vừa vào nhà, phù hợp với רַגְלָיו, “chân của ông ấy”.
- source_word: וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: và những người đi cùng ông rửa chân
  rationale: Diễn đạt tự nhiên mệnh đề “chân của những người ở cùng ông” mà vẫn giữ rõ nhóm người đồng hành.
theological_decisions:
- issue: Chủ thể của các động từ “dỡ” và “cho/đưa”
  choice: Không thêm tên La-ban; lược chủ ngữ trong chuỗi động từ tiếng Việt như nguyên văn cho phép
  alternative: Thêm “La-ban” làm chủ thể, hoặc lặp lại “người ấy”
  rationale: Bản Hê-bơ-rơ dùng các động từ ngôi thứ ba số ít nhưng không nêu lại chủ thể. Ngữ cảnh có thể khiến người đọc hiểu chủ nhà thực hiện việc tiếp đãi, trong khi cấu trúc ngữ pháp cũng có thể tiếp nối “người ấy”. Việc không tự ý thêm “La-ban” bảo toàn độ mơ hồ thật của nguồn văn.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “người ấy” để bám sát הָאִישׁ mà không lặp lại vai trò đã biết; cấu trúc lược chủ ngữ sau dấu chấm phẩy vừa tự nhiên trong tiếng Việt vừa tránh giải quyết thay nguyên văn vấn đề ai thực hiện các hành động tiếp đãi.
