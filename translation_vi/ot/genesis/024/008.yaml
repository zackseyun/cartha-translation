  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: vi
  text: Nhưng nếu người phụ nữ ấy không muốn đi theo con[a], thì con sẽ được miễn khỏi lời thề này của ta[b]. Chỉ có điều, con không được đưa con trai ta trở về đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi cùng con” hoặc “đi theo con”; sát nghĩa: “đi sau con”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “con sẽ được giải khỏi lời thề này của ta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn tả điều kiện có tính tương phản với chỉ thị trước đó, tự nhiên trong tiếng Việt.
- source_word: לֹא תֹאבֶה
  choice: không muốn
  rationale: Giữ sắc thái ý chí hoặc sự ưng thuận của động từ אבה mà không nhấn mạnh quá mức thành sự chống đối.
- source_word: הָאִשָּׁה
  choice: người phụ nữ ấy
  rationale: Chỉ người phụ nữ sẽ được tìm làm cô dâu nhưng chưa được xác định; chưa nên gọi là vợ.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: đi theo con
  rationale: אַחֲרֶיךָ theo nghĩa đen là 'sau con'; trong ngữ cảnh hành trình, 'đi theo con' vừa tự nhiên vừa giữ được hình ảnh của tiếng Hê-bơ-rơ.
- source_word: וְנִקִּיתָ
  choice: con sẽ được miễn
  rationale: Thể Niphal của נקה ở đây chỉ việc được giải khỏi nghĩa vụ ràng buộc bởi lời thề.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: khỏi lời thề này với ta
  rationale: Giữ đại từ chỉ định זֹאת và ý sở hữu của hậu tố ngôi thứ nhất; cách nói 'lời thề này với ta' làm rõ người đầy tớ đã thề với Áp-ra-ham mà không đổi nội dung.
- source_word: רַק
  choice: Chỉ có điều
  rationale: Biểu thị giới hạn mạnh đối với việc được miễn lời thề và nối tự nhiên với mệnh lệnh theo sau.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: con không được đưa con trai ta trở về đó
  rationale: Giữ nghĩa khiến trở về của thể Hiphil תָשֵׁב, lực cấm đoán của לֹא và trạng từ שָׁמָּה.
