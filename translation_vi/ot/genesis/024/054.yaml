  source_fidelity: Bản dịch truyền đạt đúng chuỗi hành động, chủ thể là người đầy tớ cùng đoàn người, việc ở lại ban đêm, và lời xin được trở về với Áp-ra-ham. Tuy nhiên, “nghỉ đêm” có thể được hiểu là chỉ nghỉ ngơi ban đêm, trong khi וַיָּלִינוּ nhấn mạnh việc lưu lại/ở qua đêm; “ở lại qua đêm” chính xác hơn.
  naturalness: Văn xuôi tự nhiên, rõ ràng và phù hợp tiếng Việt hiện đại. “Xin hãy cho tôi lên đường về với chủ tôi” lịch sự và phù hợp ngữ cảnh, nhưng “xin hãy để tôi trở về với chủ tôi” gọn và trực tiếp hơn.
  terminology: “Chủ tôi” là lựa chọn đúng cho אֲדֹנִי khi chỉ Áp-ra-ham, một người chủ trần thế. Chú thích nên trình bày lựa chọn “chúa tôi” như một khả năng từ vựng, không cần diễn giải cả câu theo một cách hơi gượng.
