base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: vi
  text: 'Người đầy tớ cùng những người đi với ông ăn uống rồi ở lại qua đêm tại đó. Sáng hôm sau, khi họ thức dậy, ông nói: “Xin hãy để tôi trở về với chủ tôi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chúa tôi.” Từ Hê-bơ-rơ אֲדֹנִי có thể mang nghĩa “chúa tôi” hoặc “chủ tôi”; ở đây từ này chỉ Áp-ra-ham, người chủ trần thế của người đầy tớ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: ăn uống
  rationale: Cụm từ tự nhiên trong tiếng Việt, truyền đạt đầy đủ hai hành động ăn và uống trong trình thuật mà không làm câu nặng nề.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: người đầy tớ cùng những người đi với ông
  rationale: Đại từ số ít chỉ người đầy tớ của Áp-ra-ham; nêu rõ nhân vật giúp câu tiếng Việt dễ hiểu, còn mệnh đề quan hệ được diễn đạt tự nhiên là “những người đi với ông”.
- source_word: וַיָּלִינוּ
  choice: nghỉ đêm tại đó
  rationale: Động từ לון/לין chỉ việc ở lại qua đêm; “nghỉ đêm” vừa gọn vừa tự nhiên, còn “tại đó” làm rõ địa điểm hàm chứa trong ngữ cảnh.
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: Sáng hôm sau, khi họ thức dậy
  rationale: Giữ trình tự thời gian của bản Hê-bơ-rơ và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: שַׁלְּחֻנִי
  choice: xin hãy cho tôi lên đường
  rationale: Mệnh lệnh của שׁלח ở đây là lời xin được cho phép rời đi; cách diễn đạt này giữ sắc thái thỉnh cầu và ý rời nơi đang lưu lại.
- source_word: לַאדֹנִי
  choice: về với chủ tôi
  rationale: אָדוֹן chỉ Áp-ra-ham, người chủ trần thế của người đầy tớ. “Chủ tôi” thể hiện đúng quan hệ xã hội và tránh khiến độc giả hiểu đây là một danh xưng dành cho Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch אָדוֹן khi từ này chỉ Áp-ra-ham
  choice: chủ tôi
  alternative: chúa tôi
  rationale: Trong ngữ cảnh, người đầy tớ đang nói về Áp-ra-ham là chủ của mình. “Chủ tôi” rõ nghĩa trong tiếng Việt hiện đại và không tạo hàm ý thần học ngoài văn bản.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu với độc giả tiếng Việt hiện đại. Dùng “xin hãy” để thể hiện lời đề nghị kính trọng; dùng “chủ tôi” thay vì “chúa tôi” nhằm tránh nhập nhằng không cần thiết với danh xưng thần linh.
