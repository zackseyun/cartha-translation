revisions:
- from: 'Yahweh, Đức Chúa Trời của trời, Đấng đã đưa ta ra khỏi nhà cha ta và khỏi xứ ta sinh ra, Đấng đã phán với ta và đã thề với ta rằng: ‘Ta sẽ ban xứ này cho dòng dõi con,’ chính Ngài sẽ sai thiên sứ[a] của Ngài đi trước con, và con sẽ đem từ đó về một người vợ cho con trai ta.'
