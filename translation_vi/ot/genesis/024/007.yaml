  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: vi
  text: 'Yahweh, Đức Chúa Trời của cõi trời, Đấng đã đưa ta ra khỏi nhà cha ta và khỏi xứ sở nơi ta sinh ra, Đấng đã phán với ta và đã thề với ta rằng: “Ta sẽ ban xứ này cho dòng dõi con,” chính Ngài sẽ sai thiên sứ[a] của Ngài đi trước con, và con sẽ đem một người vợ từ đó về cho con trai ta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ giả.” Từ Hê-bơ-rơ מַלְאָךְ có thể chỉ sứ giả nói chung hoặc thiên sứ; trong ngữ cảnh này, một sứ giả thuộc thiên giới có vẻ phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước của Đức Chúa Trời bằng dạng phiên âm phổ biến, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Đức Chúa Trời của trời
  rationale: Giữ quan hệ sở thuộc của cụm Hê-bơ-rơ và ý niệm Đức Chúa Trời là Đấng cai quản cõi trời.
- source_word: לְקָחַנִי
  choice: đã đưa ta ra khỏi
  rationale: Trong ngữ cảnh này, לָקַח nói đến việc Đức Chúa Trời đưa Áp-ra-ham rời môi trường cũ; thêm “ra khỏi” giúp câu tiếng Việt tự nhiên khi đi với hai cụm chỉ nguồn xuất phát.
- source_word: מִבֵּית אָבִי
  choice: khỏi nhà cha ta
  rationale: Giữ hình ảnh gia đình và gia tộc của nguyên văn, không diễn giải rộng thành “dòng họ” hay “tổ tiên”.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: và khỏi xứ ta sinh ra
  rationale: Phản ánh trực tiếp ý nơi sinh hoặc quê quán, đồng thời không quyết định quá mức rằng מוֹלֶדֶת chỉ vùng đất hay nhóm thân tộc.
- source_word: דִּבֶּר לִי
  choice: đã phán với ta
  rationale: Dịch động từ theo nghĩa “nói/phán”, không gộp nó vào ý “hứa”, vì lời hứa được nêu riêng ngay sau đó.
- source_word: נִשְׁבַּע לִי
  choice: đã thề với ta
  rationale: Diễn đạt trực tiếp hành động lập lời thề, giữ sự phân biệt với mệnh đề “đã phán”.
- source_word: לְזַרְעֲךָ
  choice: cho dòng dõi con
  rationale: “Dòng dõi” là cách nói tự nhiên trong tiếng Việt và giữ được nghĩa tập thể của זֶרַע mà không giới hạn vào một thế hệ.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: Ta sẽ ban xứ này
  rationale: “Ban” phù hợp với lời hứa của Đức Chúa Trời; “xứ” giữ sắc thái lãnh thổ trong bối cảnh giao ước.
- source_word: הוּא
  choice: chính Ngài
  rationale: Từ “chính” thể hiện sự nhấn mạnh của đại từ độc lập הוּא trong nguyên văn.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: sẽ sai thiên sứ của Ngài đi trước con
  rationale: “Thiên sứ” là nghĩa thích hợp hơn trong ngữ cảnh Đức Chúa Trời dẫn dắt, còn “sứ giả” được giữ trong chú thích vì מַלְאָךְ có thể mang cả hai nghĩa.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי מִשָּׁם
  choice: và con sẽ đem từ đó về một người vợ cho con trai ta
  rationale: Cách diễn đạt này giữ ý người đầy tớ phải tìm và đưa người nữ từ nơi ấy về làm vợ cho con trai Áp-ra-ham, đồng thời tránh khiến tiếng Việt hiểu lầm rằng chính người đầy tớ sẽ cưới nàng.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm; “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu, còn “Giê-hô-va” dựa trên lối đọc lai muộn hơn.
- issue: Nghĩa của מַלְאָכוֹ trong ngữ cảnh
  choice: thiên sứ của Ngài
  alternative: sứ giả của Ngài
  rationale: Một sứ giả thuộc thiên giới phù hợp hơn với lời khẳng định về sự dẫn dắt của Đức Chúa Trời; tuy nhiên, từ Hê-bơ-rơ tự nó không loại trừ nghĩa chung “sứ giả”, nên phương án ấy được ghi chú.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “ta–con” thể hiện lời Áp-ra-ham nói với người đầy tớ trong bối cảnh gia trưởng mà không dùng lối cổ quá khó hiểu. Dấu chú thích [a] được đặt ngay sau “thiên sứ”, là từ mà chú thích giải thích.
