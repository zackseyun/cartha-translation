source:
  edition: WLC
  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: vi
  text: 'Hôm nay, tôi đã đến mạch nước[a] và thưa: “Lạy Yahweh, Đức Chúa Trời của Áp-ra-ham, chủ của con, nếu Ngài vui lòng ban cho con đường con đang đi được thành công—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giếng”. Từ Hê-bơ-rơ ở đây cụ thể chỉ một mạch hoặc nguồn nước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: Hôm nay, tôi đến
  rationale: Diễn đạt tự nhiên hành động đã xảy ra trong lời thuật lại, đồng thời giữ sự nhấn mạnh thời gian của הַיּוֹם.
- source_word: הָעָיִן
  choice: mạch nước
  rationale: עַיִן ở đây chỉ nguồn nước tự nhiên; “mạch nước” chính xác hơn “giếng” và phù hợp bối cảnh lấy nước.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Đức Chúa Trời của Áp-ra-ham, chủ con
  rationale: אֲדֹנִי chỉ Áp-ra-ham là người chủ của đầy tớ, không phải một tước hiệu thần linh. Cách đặt cụm từ này tự nhiên trong lời cầu nguyện tiếng Việt.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: nếu giờ đây Ngài đang làm cho ... được thành công
  rationale: Giữ cấu trúc điều kiện và sắc thái hành động đang diễn ra của phân từ Hiphil מַצְלִיחַ; “giờ đây” chuyển tải sắc thái của נָא trong lời khẩn cầu mà không biến câu thành một mệnh lệnh dứt khoát.
- source_word: דַּרְכִּי
  choice: chuyến đi của con
  rationale: Nghĩa đen là “con đường của con”, nhưng trong ngữ cảnh từ này chỉ hành trình hoặc sứ mạng của người đầy tớ. “Chuyến đi của con” vừa rõ nghĩa vừa giữ yếu tố sở hữu.
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: chuyến đi của con
  rationale: Mệnh đề Hê-bơ-rơ theo nghĩa đen là “mà con đang đi trên đó”; tiếng Việt có thể gộp tự nhiên vào “chuyến đi của con” mà không thay đổi ý nghĩa.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản văn dùng trực tiếp danh riêng יהוה. Phiên âm “Yahweh” bảo tồn việc đây là danh riêng thay vì thay bằng một tước hiệu.
- issue: Sắc thái của mệnh đề điều kiện trong lời cầu nguyện
  choice: Giữ “nếu giờ đây Ngài đang làm cho...”
  alternative: “xin Ngài cho...”
  rationale: Cấu trúc אִם ... מַצְלִיחַ mang hình thức điều kiện và có phần bỏ lửng, được hoàn tất qua các câu tiếp theo. Bản dịch giữ nguyên sự căng thẳng và tính chưa trọn câu này thay vì biến nó thành lời cầu xin trực tiếp.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Trong lời cầu nguyện dùng cặp đại từ “Ngài—con”, tự nhiên trong tiếng Việt và thể hiện người đầy tớ đang thưa với Đức Chúa Trời. Dấu gạch ngang cuối câu giữ nguyên lời cầu nguyện còn tiếp diễn sang câu sau.
