  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: vi
  text: 'Khi cho ông uống xong, cô nói: “Tôi cũng sẽ múc nước cho lạc đà của ông, cho đến khi chúng uống xong.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: Khi cho ông uống xong
  rationale: Động từ כלה cùng động từ nguyên mẫu Hiphil của שקה diễn tả việc cô hoàn tất cho người đàn ông uống trước hành động kế tiếp. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ trình tự thời gian.
- source_word: וַתֹּאמֶר
  choice: cô nói
  rationale: אמר là động từ kể chuyện thông thường, nghĩa là “nói”. Đại từ “cô” phù hợp với nhân vật nữ trẻ trong ngữ cảnh; liên từ kể chuyện וַ được thể hiện qua mạch câu thay vì dịch máy móc là “và”.
- source_word: גַּם
  choice: cũng
  rationale: 'Giữ ý bổ sung: ngoài việc cho người đàn ông uống, cô còn múc nước cho lạc đà.'
- source_word: לִגְמַלֶּיךָ
  choice: cho lạc đà của ông
  rationale: Giữ quan hệ thụ hưởng của giới từ לְ và sở hữu ngôi thứ hai giống đực số ít. “Ông” là cách xưng hô tự nhiên, trang trọng trong ngữ cảnh.
- source_word: אֶשְׁאָב
  choice: tôi sẽ múc nước
  rationale: שאב chỉ việc múc hoặc kéo nước lên. Bổ sung “nước” theo ngữ cảnh để câu tiếng Việt đầy đủ và tự nhiên.
- source_word: עַד אִם
  choice: cho đến khi
  rationale: Cụm này có chức năng chỉ điểm kết thúc của hành động; “cho đến khi” giữ đúng nghĩa và tự nhiên trong tiếng Việt.
- source_word: כִּלּוּ לִשְׁתֹּת
  choice: chúng uống xong
  rationale: כלה với động từ nguyên mẫu שתה diễn tả việc hoàn tất uống. “Uống xong” là cấu trúc tiếng Việt gọn, rõ và tương ứng trực tiếp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cô” cho người nữ trẻ và “ông” cho người đàn ông để lời kể tự nhiên, không thêm cách giải thích thần học hay chi tiết ngoài nguyên văn.
