base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Joseph that he had spoken to them[a], and he saw the wagons that Joseph had sent to carry him[b], and the spirit of their father Jacob revived.
translation:
  language: vi
  text: Họ thuật lại cho ông mọi lời Giô-sép đã nói với họ. Gia-cốp thấy những cỗ xe Giô-sép sai đến để chở ông, và tinh thần của ông, cha họ, được hồi phục.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tinh thần của Gia-cốp, cha họ, sống lại,” một thành ngữ chỉ sức sống hoặc niềm phấn chấn được phục hồi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו אֵת כָּל דִּבְרֵי יוֹסֵף
  choice: Họ thuật lại cho ông mọi lời Giô-sép
  rationale: “Thuật lại” diễn đạt tự nhiên hành động các con truyền đạt cho Gia-cốp toàn bộ lời của Giô-sép; “mọi lời” giữ danh từ cụ thể דִּבְרֵי.
- source_word: אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: đã nói với họ
  rationale: Thể hiện lời Giô-sép nói trước đó và giữ mối liên hệ từ vựng giữa “lời” và “nói”.
- source_word: הָעֲגָלוֹת
  choice: những cỗ xe
  rationale: עֲגָלוֹת là các xe dùng để vận chuyển; “cỗ xe” rõ nghĩa và phù hợp bối cảnh, không hàm ý xe chiến.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: Giô-sép sai đến để chở mình
  rationale: “Chở” chuyển tải tự nhiên nghĩa vận chuyển của נשׂא trong ngữ cảnh xe cộ; “mình” quy chiếu về Gia-cốp.
- source_word: וַתְּחִי רוּחַ יַעֲקֹב אֲבִיהֶם
  choice: tinh thần của Gia-cốp, cha họ, liền hồi tỉnh
  rationale: Giữ “tinh thần” cho רוּחַ và hình ảnh trở lại sự sống của חיה, đồng thời diễn đạt thành ngữ về sức sống và niềm phấn chấn được phục hồi.
theological_decisions:
- issue: Ý nghĩa của רוּחַ trong thành ngữ וַתְּחִי רוּחַ
  choice: tinh thần ... hồi tỉnh
  alternative: sinh khí ... sống lại
  rationale: Ngữ cảnh nói đến sức sống và niềm hy vọng của Gia-cốp được phục hồi; bản dịch giữ từ “tinh thần” và hình ảnh hồi sinh mà không xác định đây là một tuyên bố về bản thể linh hồn.
- issue: Dạng tên riêng יוסף và יעקב
  choice: Giô-sép; Gia-cốp
  alternative: Yô-sép; Ya-cốp
  rationale: Dùng các dạng tên Kinh Thánh quen thuộc và dễ nhận biết trong tiếng Việt hiện đại; đây không phải là các dị bản văn bản.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên. Tách thành hai câu để tránh một chuỗi liên từ nặng nề trong tiếng Việt, đồng thời vẫn giữ đúng trình tự các hành động trong tiếng Hê-bơ-rơ. Dấu chú thích [a] đặt ngay sau mệnh đề được giải thích.
