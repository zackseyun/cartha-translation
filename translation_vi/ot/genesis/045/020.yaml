base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: vi
  text: Đừng tiếc những đồ đạc của các ngươi,[a] vì những gì tốt nhất trong toàn xứ Ai Cập đều thuộc về các ngươi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “đừng để mắt các ngươi thương tiếc đồ đạc của mình”; cũng có thể hiểu là “đừng bận tâm về đồ đạc của các ngươi.”'
    reason: Giải thích thành ngữ Hê-bơ-rơ và bảo lưu khả năng sắc thái giữa tiếc nuối và lo lắng.
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס
  choice: Đừng tiếc
  rationale: Thành ngữ Hê-bơ-rơ nói sát là “đừng để mắt các ngươi thương tiếc.” Trong ngữ cảnh rời bỏ tài sản để đi Ai Cập, “đừng tiếc” diễn đạt tự nhiên ý không nên lưu luyến hay lo mất đồ đạc, đồng thời giữ sắc thái tình cảm của חוס.
- source_word: עַל־כְּלֵיכֶם
  choice: những đồ đạc của các ngươi
  rationale: כְּלִי có thể chỉ vật dụng, đồ dùng, hành lý hoặc tài sản. “Đồ đạc” phù hợp với bối cảnh cả nhà chuyển đi và không thu hẹp nghĩa quá mức.
- source_word: כִּי
  choice: vì
  rationale: Dẫn vào lý do cho mệnh lệnh đứng trước; “vì” là liên từ tự nhiên trong tiếng Việt.
- source_word: טוּב כָּל־אֶרֶץ מִצְרַיִם
  choice: những gì tốt nhất trong toàn xứ Ai Cập
  rationale: טוּב ở đây chỉ phần tốt đẹp, quý giá hoặc sản vật tốt nhất mà đất Ai Cập cung cấp, không chỉ “sự tốt lành” trừu tượng. Cách dịch này giữ phạm vi của כָּל־אֶרֶץ מִצְרַיִם.
- source_word: לָכֶם הוּא
  choice: đều thuộc về các ngươi
  rationale: Cấu trúc לָכֶם הוּא nhấn mạnh quyền được hưởng hoặc sở hữu; “thuộc về các ngươi” rõ ràng và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phù hợp lời phán truyền của Pha-ra-ôn qua Giô-sép dành cho một nhóm người; giữ “xứ Ai Cập” theo văn phong Kinh Thánh quen thuộc. Dấu ngoặc kép cuối câu phản ánh câu nói trực tiếp tiếp diễn từ ngữ cảnh.
