  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: vi
  text: Các con trai của Y-sơ-ra-ên đã làm như vậy. Giô-sép đã cấp cho họ những xe chở đồ theo lệnh Pha-ra-ôn, và cấp cho họ đồ tiếp tế cho cuộc hành trình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: làm như vậy
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ, chỉ việc họ thực hiện điều vừa được truyền bảo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Y-sơ-ra-ên
  rationale: Trong ngữ cảnh trực tiếp, cụm từ chỉ các con trai nam của Gia-cốp/Y-sơ-ra-ên, nên giữ nghĩa xác định giới tính.
- source_word: עֲגָלוֹת
  choice: những cỗ xe
  rationale: Chỉ các phương tiện có bánh dùng để chở người và đồ đạc; “cỗ xe” phù hợp với bối cảnh và văn phong kể chuyện.
- source_word: עַל פִּי פַרְעֹה
  choice: theo lệnh Pha-ra-ôn
  rationale: Thành ngữ nghĩa đen là “theo miệng Pha-ra-ôn”, mang nghĩa làm theo mệnh lệnh của ông.
- source_word: צֵדָה לַדָּרֶךְ
  choice: lương thực cho họ dùng dọc đường
  rationale: צֵדָה chỉ đồ dự trữ, đặc biệt là thức ăn mang theo trong chuyến đi; cách dịch này tự nhiên và rõ mục đích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ “các con trai của Y-sơ-ra-ên” để phản ánh chính xác đối tượng trong ngữ cảnh; dịch thành ngữ עַל פִּי theo nghĩa tự nhiên, không cần chú thích vì không có sự mơ hồ đáng kể trong tiếng Việt.
