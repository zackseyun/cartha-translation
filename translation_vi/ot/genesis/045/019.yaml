language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אַתָּ֥ה צֻוֵּ֖יתָה זֹ֣את עֲשׂ֑וּ קְחוּ לָ/כֶם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם עֲגָל֗וֹת לְ/טַפְּ/כֶם֙ וְ/לִ/נְשֵׁי/כֶ֔ם וּ/נְשָׂאתֶ֥ם אֶת אֲבִי/כֶ֖ם וּ/בָאתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: vi
  text: 'Còn ngươi, ngươi đã được truyền lệnh: “Hãy làm thế này: lấy xe[a] từ xứ Ai Cập cho con nhỏ[b] và vợ của các anh, rồi đưa cha các anh đến[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Xe” ở đây là loại xe kéo dùng để chở người hoặc đồ đạc.
    reason: lexical_clarification
  - marker: b
    text: Nguyên ngữ chỉ cụ thể trẻ nhỏ, không phải con cái thuộc mọi lứa tuổi.
    reason: lexical_clarification
  - marker: c
    text: Nguyên văn chỉ nói “đến”; ngữ cảnh cho thấy họ phải đến Ai Cập, nhưng không dùng một từ riêng có nghĩa là “trở lại”.
    reason: alternative_reading
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: ngươi đã được truyền lệnh
  rationale: Dạng bị động ngôi thứ hai số ít cho biết Giô-sép đã nhận lệnh, trong ngữ cảnh là từ Pha-ra-ôn. Thì hoàn thành được diễn đạt tự nhiên bằng “đã được truyền lệnh”.
- source_word: זֹאת עֲשׂוּ
  choice: Hãy làm thế này
  rationale: Giữ sắc thái mệnh lệnh của công thức Hê-bơ-rơ; động từ ở số nhiều hướng đến các anh của Giô-sép.
- source_word: קְחוּ לָכֶם
  choice: lấy
  rationale: Trong tiếng Việt, ý lấy để dùng cho chính mình đã rõ nhờ ngữ cảnh; thêm “cho mình” dễ gây lẫn với các cụm chỉ người thụ hưởng theo sau.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: từ đất Ai Cập
  rationale: Giữ danh từ אֶרֶץ trong nguyên văn mà vẫn tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: עֲגָלוֹת
  choice: xe
  rationale: Chỉ phương tiện có bánh dùng để vận chuyển người hoặc đồ đạc. “Xe” tránh xác định loại sức kéo mà nguyên văn không nêu.
- source_word: לְטַפְּכֶם
  choice: cho con nhỏ
  rationale: טַף nhấn mạnh trẻ nhỏ hơn là con cái nói chung.
- source_word: וְלִנְשֵׁיכֶם
  choice: và vợ các anh
  rationale: Trong bối cảnh di chuyển cả gia đình, נָשִׁים mang nghĩa quan hệ là các bà vợ.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: rồi chở cha các anh
  rationale: נשא cơ bản là nâng hoặc mang, nhưng ở đây nói đến việc dùng xe để vận chuyển người cha; “chở” vừa tự nhiên vừa giữ ý vận chuyển.
- source_word: וּבָאתֶם
  choice: đến đây
  rationale: Động từ nguyên văn chỉ có nghĩa “đến”; “đây” làm rõ điểm quy chiếu của người nói mà không thêm ý “trở lại” vốn không được biểu thị bằng một động từ riêng.
theological_decisions:
- issue: Sự chuyển đổi giữa ngôi số ít và số nhiều
  choice: Giữ “ngươi” số ít cho Giô-sép, rồi dùng “các anh” cho những mệnh lệnh số nhiều
  alternative: Đồng nhất toàn câu thành lời truyền trực tiếp chỉ cho Giô-sép hoặc chỉ cho các anh em
  rationale: Nguyên văn chuyển từ động từ bị động số ít צֻוֵּיתָה sang các động từ mệnh lệnh và hoàn thành số nhiều. Bản dịch giữ sự chuyển đổi này thay vì âm thầm san bằng cấu trúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngươi” được giữ trong lời Pha-ra-ôn nói riêng với Giô-sép để biểu thị ngôi số ít và vị thế hoàng gia; “các anh” trong phần mệnh lệnh cho thấy các động từ Hê-bơ-rơ chuyển sang số nhiều. Dấu ngoặc kép phân định nội dung mệnh lệnh.
