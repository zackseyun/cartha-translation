base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: vi
  text: 'Rồi Giô-sép nói với các anh em mình: “Xin hãy lại gần tôi.” Họ liền lại gần. Ông nói: “Tôi là Giô-sép, em của các anh, người mà các anh đã bán sang Ai Cập.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói / Ông nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện. “Rồi” thể hiện rõ trình tự ở lần đầu; lần sau dùng “Ông nói” để tiếng Việt tự nhiên mà vẫn giữ hành động phát ngôn kế tiếp.
- source_word: אֶל־אֶחָיו
  choice: với các anh em mình
  rationale: Danh từ אָח ở số nhiều với hậu tố ngôi ba số ít chỉ anh em của Giô-sép. “Các anh em mình” là cách diễn đạt tự nhiên và không tự ý giới hạn chỉ các anh trai.
- source_word: גְּשׁוּ־נָא אֵלַי
  choice: Xin hãy lại gần tôi
  rationale: נגשׁ có nghĩa đến hoặc lại gần; נָא tạo sắc thái khẩn khoản, lịch sự. “Xin hãy” truyền đạt sắc thái ấy mà không thêm ý so sánh như “gần hơn”.
- source_word: וַיִּגָּשׁוּ
  choice: Họ liền lại gần
  rationale: Lặp lại “lại gần” để bảo toàn sự lặp từ của nguyên văn; “liền” diễn đạt phản ứng kế tiếp trong mạch kể.
- source_word: אֲנִי יוֹסֵף
  choice: Tôi là Giô-sép
  rationale: Mệnh đề danh từ tiếng Hê-bơ-rơ được diễn đạt tự nhiên bằng “Tôi là”; “Giô-sép” là dạng tên riêng quen dùng trong Kinh Thánh tiếng Việt.
- source_word: אֲחִיכֶם
  choice: em của các anh
  rationale: Nguyên văn là “anh/em trai của các anh” và không mã hóa quan hệ lớn nhỏ; trong ngữ cảnh, Giô-sép nói với các anh trai nên “em của các anh” là cách xưng quan hệ tự nhiên, chính xác trong tiếng Việt.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: người mà các anh đã bán
  rationale: Giữ nguyên mệnh đề quan hệ trực tiếp và lời quy trách nhiệm, đồng thời dùng cấu trúc chỉ người tự nhiên trong tiếng Việt.
- source_word: מִצְרָיְמָה
  choice: sang Ai Cập
  rationale: Hậu tố chỉ hướng -ָה biểu thị chuyển động đến Ai Cập. “Sang Ai Cập” phù hợp với động từ “bán” và tự nhiên hơn “vào Ai Cập” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Duy trì sự lặp của động từ “lại gần” trong lời yêu cầu và phần đáp ứng. Đại từ được chọn theo quan hệ gia đình và ngữ cảnh tiếng Việt: Giô-sép gọi họ là “các anh”, còn lời kể dùng “các anh em mình” để phản ánh số nhiều אֶחָיו mà không làm nguyên văn nói quá mức.'
