  - severity: low
    issue: Chú thích “phần màu mỡ nhất của xứ” quá hẹp
    rationale: חֵלֶב הָאָרֶץ là thành ngữ chỉ phần phong phú, tốt nhất hay sản vật tuyển chọn của đất, không chỉ riêng tính màu mỡ.
