base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: vi
  text: Hãy đem cha và gia quyến của các ngươi đến với ta. Ta sẽ ban cho các ngươi phần tốt nhất của đất Ai Cập, và các ngươi sẽ ăn phần béo tốt của đất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phần phong phú nhất của đất.” Thành ngữ Hê-bơ-rơ “phần béo tốt của đất” chỉ sự sung túc và những sản vật tuyển chọn nhất của đất ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: Hãy dẫn
  rationale: Động từ לקח cơ bản là “lấy, đem theo”; trong ngữ cảnh đưa người đến chỗ người nói, “dẫn” tự nhiên hơn trong tiếng Việt mà vẫn giữ ý đem cha và gia quyến theo.
- source_word: אֲבִיכֶם
  choice: cha của các ngươi
  rationale: Danh từ số ít với hậu tố ngôi hai số nhiều, chỉ Gia-cốp.
- source_word: בָּתֵּיכֶם
  choice: gia quyến của các ngươi
  rationale: בַּיִת theo nghĩa mở rộng chỉ cả hộ gia đình và những người thuộc về hộ ấy; “gia quyến” tránh cách hiểu là các căn nhà.
- source_word: וּבֹאוּ אֵלָי
  choice: đến với ta
  rationale: Diễn đạt trực tiếp mệnh lệnh בוא với אֶל; không thêm ý “trở lại” vốn không được nói rõ trong tiếng Hê-bơ-rơ.
- source_word: וְאֶתְּנָה לָכֶם
  choice: Ta sẽ ban cho các ngươi
  rationale: Dạng động từ sau chuỗi mệnh lệnh mang sắc thái lời hứa bảo đảm; “sẽ ban cho” vừa tự nhiên vừa phù hợp lời của Pha-ra-ôn.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: phần tốt nhất của đất Ai Cập
  rationale: טוּב có thể chỉ sự tốt lành, sản vật dồi dào hoặc phần ưu tú; “phần tốt nhất” chuyển tải đặc quyền được hưởng những gì tốt nhất của Ai Cập.
- source_word: וְאִכְלוּ
  choice: các ngươi sẽ được hưởng
  rationale: Nghĩa đen là “hãy ăn”, nhưng trong thành ngữ và sau lời hứa, câu nói diễn tả kết quả là họ được thụ hưởng; cách dịch này tự nhiên trong tiếng Việt.
- source_word: חֵלֶב הָאָרֶץ
  choice: phần béo tốt của xứ
  rationale: Giữ hình ảnh חֵלֶב “mỡ, phần béo” trong một cách nói tiếng Việt có thể hiểu là phần phong phú, màu mỡ và quý nhất.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/các ngươi” phù hợp lời phán của Pha-ra-ôn với các anh em Giô-sép; cấu trúc đầu câu được gộp tự nhiên trong tiếng Việt nhưng không làm mất nội dung mệnh lệnh.
