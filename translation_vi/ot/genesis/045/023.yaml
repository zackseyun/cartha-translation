base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: vi
  text: 'Ông cũng gửi cho cha mình những thứ sau: mười con lừa chở một số thứ tốt nhất của Ai Cập[a], và mười con lừa cái chở ngũ cốc, bánh mì và lương thực cho cha mình dùng dọc đường.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ những thứ tốt nhất của Ai Cập” hoặc “từ nguồn dồi dào của Ai Cập.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּזֹאת
  choice: những thứ sau
  rationale: Trong ngữ cảnh, cụm này dẫn vào danh sách những gì được gửi; cách dịch này tự nhiên trong tiếng Việt và không thêm nội dung.
- source_word: חֲמֹרִים
  choice: con lừa
  rationale: Cách gọi thông dụng, hiện đại; danh từ số lượng đã thể hiện số nhiều.
- source_word: נֹשְׂאִים / נֹשְׂאֹת
  choice: chở
  rationale: Diễn đạt trực tiếp việc các con vật vận chuyển hàng hóa, tự nhiên hơn 'mang' trong ngữ cảnh này.
- source_word: מִטּוּב מִצְרָיִם
  choice: một phần những sản vật tốt nhất của Ai Cập
  rationale: Giữ sắc thái phân lượng của מִן và nghĩa rộng của טוּב trong bối cảnh quà tặng, không giới hạn vào một loại nông sản cụ thể.
- source_word: אֲתֹנֹת
  choice: lừa cái
  rationale: Giữ sự phân biệt giới tính mà từ Hê-bơ-rơ nêu rõ.
- source_word: בָּר
  choice: ngũ cốc
  rationale: Từ nguồn chỉ ngũ cốc nói chung, không chắc chắn riêng là lúa mì.
- source_word: לֶחֶם
  choice: bánh
  rationale: Giữ nghĩa thông thường là bánh làm từ ngũ cốc, đồng thời tránh lặp từ 'lương thực' dùng cho מָזוֹן.
- source_word: מָזוֹן
  choice: lương thực
  rationale: Chỉ thực phẩm dự trữ để duy trì người đi đường, phù hợp văn cảnh hành trình.
- source_word: לַדָּרֶךְ
  choice: dùng dọc đường
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt đối với lương thực dành cho chuyến đi.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” theo mạch kể chuyện nhưng không chèn tên riêng vốn không có trong câu; giữ cấu trúc liệt kê và sự phân biệt giữa lừa nói chung với lừa cái.
