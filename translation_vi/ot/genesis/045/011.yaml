  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: vi
  text: Ở đó, con sẽ chu cấp cho cha, vì nạn đói vẫn còn năm năm nữa, kẻo cha, gia đình cha cùng mọi thứ thuộc về cha bị sa sút.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: con sẽ chu cấp
  rationale: Động từ כלכל ở dạng này có nghĩa là nuôi dưỡng hoặc cung cấp những gì cần thiết. “Chu cấp” tự nhiên trong ngữ cảnh Giô-sép chăm lo cho cha và gia đình; đại từ “con” thể hiện đúng quan hệ người nói với người nghe trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: 'Giữ quan hệ nguyên nhân trực tiếp: Giô-sép sẽ chu cấp vì nạn đói vẫn còn tiếp diễn.'
- source_word: פֶּן
  choice: nếu không
  rationale: Diễn đạt mục đích phòng tránh hoặc hậu quả đáng lo của פן một cách tự nhiên, đồng thời không khẳng định hậu quả ấy chắc chắn xảy ra.
- source_word: תִּוָּרֵשׁ
  choice: sẽ lâm cảnh túng thiếu
  rationale: Dạng động từ này chỉ việc bị bần cùng hóa hoặc rơi vào thiếu thốn. Cách dịch giữ sắc thái hậu quả nghiêm trọng mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: וְכָל־אֲשֶׁר־לָךְ
  choice: và mọi thứ thuộc về cha
  rationale: Phản ánh nghĩa bao quát của cụm Hê-bơ-rơ, gồm mọi tài sản hoặc những gì người cha sở hữu, mà không thu hẹp phạm vi.
