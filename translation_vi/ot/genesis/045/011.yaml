revisions:
- from: Tại đó, con sẽ chu cấp cho cha, vì nạn đói còn kéo dài năm năm nữa; nếu không, cha, gia đình cha và mọi thứ thuộc về cha sẽ lâm cảnh túng thiếu.
  to: Ở đó, con sẽ chu cấp cho cha, vì nạn đói vẫn còn năm năm nữa, kẻo cha, gia đình cha cùng mọi thứ thuộc về cha bị sa sút.
  rationale: Chỉnh sửa tối thiểu để câu tiếng Việt tự nhiên hơn và để mệnh đề hậu quả có thể bao quát cả cha, gia đình và toàn bộ tài sản của cha. Không thay đổi quan hệ nguyên nhân của כִּי, sắc thái ngăn ngừa của פֶּן, hay phạm vi «mọi điều thuộc về cha».
  reviewer_model: gpt-5.6-terra
