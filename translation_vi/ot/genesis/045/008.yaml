  - severity: medium
    issue: “chúa quản trị cả nhà vua”
    rationale: Cụm này không tự nhiên trong tiếng Việt hiện đại; ‘quản trị’ thêm một nét chức năng không có trong אָדוֹן (‘chủ, chúa’). “Cả nhà vua” cũng dễ mơ hồ. Cần một cách nói rõ quyền trên toàn ‘nhà’/hoàng gia của Pha-ra-ôn.
  - severity: low
    issue: “Vậy bây giờ”
    rationale: Không sai, nhưng hơi gượng trong lời kết luận. “Vậy nên bây giờ” tự nhiên hơn và vẫn phản ánh liên từ cùng lực diễn ngôn của וְעַתָּה.
