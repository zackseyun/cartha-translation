revisions:
- from: Vậy bây giờ, không phải các anh đã sai tôi đến đây, nhưng là Đức Chúa Trời. Ngài đã đặt tôi làm cha của Pha-ra-ôn[a], làm chúa quản trị cả nhà vua, và làm người cai trị toàn xứ Ai Cập.
  to: Vậy nên bây giờ, không phải các anh đã sai tôi đến đây, nhưng là Đức Chúa Trời. Ngài đã đặt tôi làm cha cho Pha-ra-ôn[a], làm chủ toàn thể hoàng gia, và làm người cai trị toàn xứ Ai Cập.
  rationale: Bản sửa giữ nguyên đối lập thần học và tác nhân của nguyên văn, không giải thích thêm về quan hệ giữa sự tể trị của Đức Chúa Trời và trách nhiệm con người. “Làm cha cho” bảo tồn ẩn dụ אָב mà tránh hàm ý Giô-sép là cha ruột của Pha-ra-ôn. “Làm chủ toàn thể hoàng gia” chuyển tải quyền của אָדוֹן trên ‘cả nhà’ của Pha-ra-ôn bằng tiếng Việt hiện đại, không thêm ý ‘quản trị’.
