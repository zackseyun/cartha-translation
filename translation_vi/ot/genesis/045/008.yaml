  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: vi
  text: Vậy nên bây giờ, không phải các anh đã sai tôi đến đây, nhưng là Đức Chúa Trời. Ngài đã đặt tôi làm cha cho Pha-ra-ôn[a], làm chủ toàn thể hoàng gia, và làm người cai trị toàn xứ Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “như một người cha đối với Pha-ra-ôn”, tức là người bảo trợ, cố vấn cấp cao hoặc ân nhân của vua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Diễn đạt cả liên từ nối kết và chức năng dẫn vào kết luận của lời Giô-sép.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה כִּי הָאֱלֹהִים
  choice: không phải các anh đã sai tôi đến đây, nhưng là Đức Chúa Trời
  rationale: Giữ thế đối lập nhấn mạnh của đại từ אַתֶּם và nghĩa tương phản của כִּי sau mệnh đề phủ định.
- source_word: וַיְשִׂימֵנִי
  choice: Ngài đã đặt tôi làm
  rationale: Động từ 'đặt ... làm' vừa gần nghĩa nguồn vừa diễn đạt việc Đức Chúa Trời đưa Giô-sép vào địa vị hiện tại.
- source_word: לְאָב לְפַרְעֹה
  choice: làm cha của Pha-ra-ôn
  rationale: Giữ nguyên hình ảnh ẩn dụ 'cha', không thu hẹp thành riêng vai trò cố vấn; chú thích giải thích phạm vi nghĩa.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: làm chúa quản trị cả nhà vua
  rationale: אָדוֹן chỉ người có quyền làm chủ; thêm 'quản trị' giúp cụm từ tự nhiên và tránh hiểu 'Chúa' như một thần danh. Đại từ 'vua' làm rõ rằng 'nhà' là nhà của Pha-ra-ôn.
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: và làm người cai trị toàn xứ Ai Cập
  rationale: Phản ánh danh xưng dạng phân từ מֹשֵׁל và giữ rõ phạm vi lãnh thổ của אֶרֶץ.
theological_decisions:
- issue: Quyền tể trị của Đức Chúa Trời và hành động của con người
  choice: 'Giữ lời đối lập mạnh: ''không phải các anh ... nhưng là Đức Chúa Trời''.'
  alternative: Làm nhẹ sự đối lập hoặc diễn giải thành một hệ thống thần học về sự quan phòng.
  rationale: Lời Giô-sép nhấn mạnh mục đích quyết định của Đức Chúa Trời, nhưng ngữ cảnh vẫn nhìn nhận hành động có thật của các anh; bản dịch không giải quyết thay cho nguyên văn sự căng thẳng này.
- issue: Ẩn dụ 'cha của Pha-ra-ôn'
  choice: Giữ nguyên ẩn dụ trong chính văn và giải thích bằng chú thích.
  alternative: Dịch trực tiếp thành 'cố vấn của Pha-ra-ôn' hoặc 'ân nhân của Pha-ra-ôn'.
  rationale: Ẩn dụ có thể bao hàm sự bảo trợ, khuyên bảo và làm ích, nên một từ chức vụ cụ thể sẽ thu hẹp ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'các anh' phù hợp lời Giô-sép nói với các anh mình; 'Đức Chúa Trời' theo lối gọi trang trọng trong văn bản Kinh Thánh tiếng Việt. Mọi liên từ liệt kê chính được giữ để phản ánh cấu trúc nguồn.
