base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: vi
  text: 'Pha-ra-ôn nói với Giô-sép: “Hãy nói với các anh em ngươi rằng: ‘Hãy làm điều này: chất đồ lên gia súc của các ngươi, rồi lên đường trở về đất Ca-na-an.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ mở đầu lời nói và waw liên tiếp tiếp tục mạch kể; trong ngữ cảnh nhà vua ban chỉ thị, “phán” là cách diễn đạt trang trọng, tự nhiên.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm quen thuộc trong tiếng Việt đối với tước hiệu vua Ai Cập.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: Hãy bảo các anh em ngươi
  rationale: Diễn đạt tự nhiên mệnh lệnh yêu cầu Giô-sép truyền lời cho các anh mình.
- source_word: זֹאת עֲשׂוּ
  choice: Hãy làm thế này
  rationale: Giữ trực tiếp đại từ chỉ thị cùng sắc thái mệnh lệnh của nguyên văn.
- source_word: טַעֲנוּ אֶת בְּעִירְכֶם
  choice: chất đồ lên súc vật của các ngươi
  rationale: טען chỉ việc chất hàng, còn בעיר ở đây là súc vật dùng để chuyên chở; thêm “đồ” làm rõ đối tượng được chất lên mà không xác định quá mức.
- source_word: וּלְכוּ בֹאוּ
  choice: rồi lên đường, trở về
  rationale: Giữ hai động tác liên tiếp—ra đi và đến nơi—bằng cách diễn đạt tiếng Việt tự nhiên; “trở về” phù hợp vì các anh em đi lại Ca-na-an.
- source_word: אַרְצָה כְּנָעַן
  choice: đất Ca-na-an
  rationale: Giữ danh từ “đất” và hướng chuyển động được biểu thị bởi hậu tố chỉ hướng.
theological_decisions: []
