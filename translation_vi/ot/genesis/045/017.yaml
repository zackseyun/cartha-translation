  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng “phán” cho lời của nhà vua và cặp xưng hô “ngươi/các ngươi” để giữ bối cảnh cung đình cổ mà không dùng cấu trúc quá sát chữ, khó đọc.
