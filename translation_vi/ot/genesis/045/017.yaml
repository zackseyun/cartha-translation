  to: 'Pha-ra-ôn nói với Giô-sép: “Hãy nói với các anh em ngươi rằng: ‘Hãy làm điều này: chất đồ lên gia súc của các ngươi, rồi lên đường trở về đất Ca-na-an.’”'
