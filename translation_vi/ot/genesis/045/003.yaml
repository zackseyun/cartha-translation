base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: vi
  text: 'Bấy giờ, Giô-sép nói với các anh em mình: “Tôi là Giô-sép. Cha tôi vẫn còn sống chứ?” Nhưng các anh em ông không thể trả lời ông, vì họ hoảng hốt[a] khi đối diện với ông[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kinh hoàng,” “bàng hoàng” hoặc “sửng sốt.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “từ trước mặt ông”; đây là cách nói Hê-bơ-rơ chỉ phản ứng của họ khi hiện diện trước ông hoặc khi nhìn thấy ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn biến câu chuyện; “Bấy giờ” diễn đạt trình tự tự nhiên trong tiếng Việt.
- source_word: אֶל אֶחָיו
  choice: với các anh em mình
  rationale: Chỉ các anh em trai của Giô-sép; “mình” quy chiếu tự nhiên về chủ ngữ trong mệnh đề này.
- source_word: אֲנִי יוֹסֵף
  choice: Tôi là Giô-sép
  rationale: Giữ nguyên lời tự nhận trực tiếp; “Giô-sép” là dạng tên quen dùng trong tiếng Việt.
- source_word: הַעוֹד אָבִי חָי
  choice: Cha tôi vẫn còn sống chứ?
  rationale: “Vẫn còn” thể hiện trạng thái tiếp diễn được hỏi đến; tiểu từ “chứ” tạo câu hỏi tự nhiên mà không làm mất ý nghi vấn.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: Nhưng ... không thể trả lời ông
  rationale: “Nhưng” thể hiện sự tương phản sau lời bộc lộ của Giô-sép; “không thể” phản ánh trực tiếp động từ יכל.
- source_word: נִבְהֲלוּ
  choice: hoảng hốt
  rationale: Dạng Niphal diễn tả bị chấn động, kinh hãi hoặc sửng sốt; “hoảng hốt” giữ được cường độ mà không thu hẹp nghĩa thành nỗi sợ thuần túy.
- source_word: מִפָּנָיו
  choice: trước mặt ông
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ “từ trước mặt/ngay trước sự hiện diện của ông”; trong ngữ cảnh, cụm từ cũng hàm ý họ bị chấn động vì đối diện với Giô-sép.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Đại từ “ông” trong lời trần thuật tôn trọng nhân vật trưởng thành; trong lời trực tiếp, Giô-sép dùng “tôi” để tránh áp đặt quan hệ tuổi tác lên toàn thể nhóm anh em.
