  text: מַהֲרוּ֮ וַ/עֲל֣וּ אֶל אָבִ/י֒ וַ/אֲמַרְתֶּ֣ם אֵלָ֗י/ו כֹּ֤ה אָמַר֙ בִּנְ/ךָ֣ יוֹסֵ֔ף שָׂמַ֧/נִי אֱלֹהִ֛ים לְ/אָד֖וֹן לְ/כָל מִצְרָ֑יִם רְדָ֥/ה אֵלַ֖/י אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: vi
  text: 'Hãy mau chóng lên gặp cha tôi và nói với cha rằng: ‘Giô-sép, con trai cha, nói thế này: Đức Chúa Trời đã đặt con làm chủ toàn Ai Cập. Cha hãy xuống chỗ con, đừng chậm trễ[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đừng nấn ná”; nghĩa đen: “đừng đứng lại” hoặc “đừng đứng yên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ
  choice: Hãy mau
  rationale: Mệnh lệnh số nhiều diễn tả sự khẩn cấp; cách nói này tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: וַעֲלוּ אֶל אָבִי
  choice: lên với cha tôi
  rationale: Giữ động từ chỉ hướng 'lên', phù hợp cách Sáng Thế Ký mô tả hành trình từ Ai Cập về Ca-na-an; 'với cha tôi' diễn đạt đích đến tự nhiên.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: và thưa với người
  rationale: Đây là chỉ thị tiếp nối mệnh lệnh. 'Thưa' hợp với lời các con nói cùng cha, còn 'người' tránh lặp từ 'cha' nhưng vẫn tôn kính.
- source_word: כֹּה אָמַר
  choice: nói thế này
  rationale: Chuyển công thức sứ giả sang lối nói tiếng Việt tự nhiên, đồng thời giữ chức năng dẫn nguyên văn lời truyền đạt.
- source_word: בִּנְךָ יוֹסֵף
  choice: Giô-sép, con trai cha
  rationale: Giữ rõ căn tính hiếu thuộc và sắc thái trực tiếp của lời nhắn; trật tự được điều chỉnh cho tự nhiên trong tiếng Việt.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: Đức Chúa Trời đã đặt con
  rationale: שׂים trong ngữ cảnh này mang nghĩa đặt hoặc bổ nhiệm vào một địa vị; 'đã đặt' gần hình thức Hê-bơ-rơ hơn mà vẫn rõ nghĩa.
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: làm chủ toàn cõi Ai Cập
  rationale: אָדוֹן chỉ người có quyền cai quản. 'Làm chủ' không áp đặt một chức danh chính trị cụ thể; 'toàn cõi' diễn đạt phạm vi quyền hành.
- source_word: רְדָה אֵלַי
  choice: Xin cha xuống với con
  rationale: Giữ hướng địa lý 'xuống' về Ai Cập. Hình thức 'xin cha' phù hợp lời người con khẩn khoản với cha, dù động từ nguồn là mệnh lệnh.
- source_word: אַל תַּעֲמֹד
  choice: đừng chậm trễ
  rationale: עמד có nghĩa đen là 'đứng lại', nhưng trong lời cấm này mang nghĩa nấn ná hoặc trì hoãn; cách dịch chọn truyền đạt đúng sự khẩn cấp.
theological_decisions:
- issue: Cách dịch אֱלֹהִים trong lời tuyên bố của Giô-sép
  choice: Đức Chúa Trời
  alternative: thần
  rationale: Động từ và ngữ cảnh dùng nghĩa số ít, và Giô-sép quy việc mình được đặt vào địa vị này cho Đức Chúa Trời. Cách dịch không thêm một xác định thần học ngoài ý nghĩa trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cặp hướng chuyển động 'lên' về Ca-na-an và 'xuống' Ai Cập. Dùng 'cha/con' trong lời nhắn để phản ánh quan hệ gia đình và giữ giọng kính trọng tự nhiên.
