base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: vi
  text: Cha sẽ sống trong xứ Gô-sen và sẽ ở gần con—cha, các con trai của cha, các cháu trai của cha, các đàn chiên dê, các đàn bò và mọi thứ cha có.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Con sẽ sống
  rationale: ישׁב ở đây chỉ việc cư trú ổn định. “Sống” tự nhiên trong tiếng Việt hiện đại; đại từ “con” phù hợp với lời Giô-sép nói với cha mình.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: trong vùng đất Gô-sen
  rationale: אֶרֶץ trong ngữ cảnh này là một vùng lãnh thổ. “Vùng đất Gô-sen” vừa giữ sắc thái địa lý vừa tự nhiên hơn cách dịch quá sát là “đất của Gô-sen”.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: và ở gần cha
  rationale: Cụm היה + קָרוֹב diễn tả tình trạng ở gần. Vì người nói là Giô-sép nói với cha mình, tiếng Việt tự nhiên dùng “cha” để tự xưng thay cho “con” theo quan hệ giao tiếp.
- source_word: אַתָּה
  choice: con
  rationale: Đại từ độc lập tạo điểm nhấn và mở đầu danh sách những người cùng ở gần Giô-sép; dấu gạch ngang bảo lưu chuyển ý nhấn mạnh ấy.
- source_word: וּבָנֶיךָ
  choice: các con trai của con
  rationale: בָּנִים ở đây chỉ các con trai của Gia-cốp, không nên khái quát thành “con cái” vì vế sau nói đến con trai của họ.
- source_word: וּבְנֵי בָנֶיךָ
  choice: các cháu trai của con
  rationale: Nghĩa đen là “các con trai của các con trai con.” “Các cháu trai” là tương đương tự nhiên và vẫn giữ chỉ dấu giống đực của nguyên văn.
- source_word: וְצֹאנְךָ
  choice: các bầy chiên dê
  rationale: צֹאן là gia súc nhỏ, thường gồm chiên và dê. Nêu rõ “chiên dê” giúp người đọc hiện đại hiểu đúng phạm vi hơn từ “bầy” đứng riêng.
- source_word: וּבְקָרְךָ
  choice: các đàn bò
  rationale: בָּקָר chỉ đại gia súc, đặc biệt là bò; “các đàn bò” vừa chính xác vừa tạo đối ứng tự nhiên với “các bầy chiên dê”.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: mọi thứ con có
  rationale: Cách diễn đạt bao quát tài sản thuộc về Gia-cốp, rõ ràng và tự nhiên trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Hệ thống đại từ theo quan hệ cha–con được dùng nhất quán: Giô-sép gọi Gia-cốp là “con” và tự xưng là “cha”, tránh lối dịch máy móc “ngươi/tôi”. Tên địa danh được phiên âm là “Gô-sen” theo thói quen Kinh Thánh tiếng Việt.'
