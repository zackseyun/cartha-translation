  rationale: Cần sửa để giải quyết lỗi ý nghĩa nghiêm trọng do đảo ngược người được nói đến và người nói. Bản sửa giữ nghĩa cư trú tại Gô-sen, sự gần gũi với Giô-sép, và danh sách đầy đủ những người cùng tài sản thuộc về Gia-cốp.
