    rationale: 'Bản thảo viết “Con sẽ sống ... và ở gần cha”, nhưng Giô-sép đang nói với Gia-cốp. Nguyên ngữ dùng ngôi thứ hai xuyên suốt: Gia-cốp sẽ sống tại Gô-sen, ở gần Giô-sép, cùng con trai, cháu trai, đàn vật và mọi sở hữu của ông. Do đó phải là “Cha sẽ ... ở gần con ... của cha.”'
  - severity: medium
    issue: Các từ sở hữu trong danh sách theo sau cũng quy về sai người.
    rationale: “các con trai ... của con”, “các cháu trai của con”, và “mọi thứ con có” khiến toàn bộ danh sách quy về Giô-sép, trái với hậu tố ngôi thứ hai số ít nam trong tiếng Hê-bơ-rơ, vốn quy về Gia-cốp.
