base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: vi
  text: 'Bấy giờ, Giô-sép không thể kìm lòng được nữa trước mặt tất cả những người đang đứng bên ông.[a] Ông kêu lớn: “Hãy cho mọi người ra ngoài!” Không một ai ở lại với ông khi Giô-sép tỏ mình cho các anh em.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát hơn: “trước sự hiện diện của tất cả những người đứng bên ông.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “khi Giô-sép cho các anh em biết mình là ai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: không thể kìm lòng được nữa
  rationale: Diễn đạt tự nhiên sự bất lực trong việc tự kiềm chế; “được nữa” phù hợp với cao trào của mạch truyện mà không xác định quá mức loại cảm xúc.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: trước mặt tất cả những người đang đứng hầu mình
  rationale: Giữ ý hiện diện trước mặt Giô-sép và phản ánh vị thế của những người đứng bên ông; “đứng hầu” tự nhiên hơn lối dịch máy móc “đứng trên ông”.
- source_word: וַיִּקְרָא
  choice: Ông kêu lớn
  rationale: Động từ chỉ việc cất tiếng gọi; cách dịch này phù hợp với cường độ của cảnh mà không thêm nội dung lời nói.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: Hãy cho mọi người ra khỏi đây!
  rationale: Thể hiện sắc thái sai khiến của thể hifil số nhiều và ý phân phối của כָל אִישׁ; “khỏi đây” là tiếng Việt tự nhiên cho việc rời khỏi sự hiện diện của người nói.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: không một ai ở lại với ông
  rationale: Trong ngữ cảnh, עמד có nghĩa là tiếp tục hiện diện; “ở lại” truyền đạt đúng nghĩa hơn lối dịch sát chữ “đứng”.
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: khi Giô-sép tỏ mình cho các anh em nhận biết
  rationale: 'Giữ sắc thái phản thân của hitpael: Giô-sép chủ động làm cho thân phận mình được nhận biết, không chỉ đơn thuần nói hay xuất hiện.'
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng “Giô-sép” theo cách phiên âm quen thuộc; “các anh em” giữ phạm vi thân tộc nam trong ngữ cảnh. Các đại từ “ông/mình” tránh lặp tên nhưng vẫn rõ chủ thể.
