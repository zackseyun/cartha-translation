  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp với lời Giô-sép nói với nhóm anh em trai; cụm “người anh em của tôi” tránh áp đặt Bên-gia-min là anh hay em ngay tại cấp độ từ vựng, đồng thời giữ sự lặp lại có chủ ý của nguyên văn.
