  text: וְ/הִנֵּ֤ה עֵֽינֵי/כֶם֙ רֹא֔וֹת וְ/עֵינֵ֖י אָחִ֣/י בִנְיָמִ֑ין כִּי פִ֖/י הַֽ/מְדַבֵּ֥ר אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: vi
  text: Kìa[a], chính mắt anh em và mắt của Bên-gia-min, người anh em của tôi, đều thấy rằng chính miệng tôi đang nói với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch trang trọng hơn: “Và này”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kìa
  rationale: Từ này hướng sự chú ý của người nghe vào bằng chứng đang ở ngay trước mắt; “Kìa” ngắn gọn, trang trọng vừa phải và giữ được sắc thái chỉ dẫn trực tiếp.
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: chính mắt anh em ... đều thấy
  rationale: Giữ hình ảnh cụ thể “mắt” và ý nghĩa nhận biết trực tiếp; “chính” làm rõ sắc thái nhấn mạnh tự nhiên trong tiếng Việt mà không biến hình ảnh thành “chính anh em”.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: và mắt của Bên-gia-min, người anh em của tôi
  rationale: Duy trì cấu trúc song song với “mắt anh em” và không tự ý xác định quan hệ là anh hay em, vì אָחִי chỉ nói “anh/em trai của tôi”.
- source_word: כִּי
  choice: rằng
  rationale: Ở đây từ này dẫn vào nội dung mà họ trực tiếp nhận thấy; “rằng” nối mệnh đề tự nhiên trong tiếng Việt.
- source_word: פִי הַמְדַבֵּר אֲלֵיכֶם
  choice: chính miệng tôi đang nói với anh em
  rationale: 'Giữ cách diễn đạt cụ thể và nhấn mạnh của tiếng Hê-bơ-rơ: Giô-sép đang đích thân nói, không qua người thông dịch; “đang nói” phản ánh hành động hiện tại của phân từ.'
theological_decisions: []
