base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: vi
  text: Ông cho mỗi người trong số họ một bộ quần áo để thay, còn Bên-gia-min thì ông cho ba trăm miếng bạc[a] và năm bộ quần áo để thay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “ba trăm bạc”; không nêu rõ đơn vị tiền tệ, nên dịch là “miếng bạc” thay vì xác định cụ thể là “siếc-lơ bạc”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: mỗi người trong số họ
  rationale: Hai thành tố cùng nhấn mạnh ý phân phối cho toàn nhóm, từng người một; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ được ý ấy.
- source_word: נָתַן
  choice: ông cho
  rationale: Động từ נתן trong ngữ cảnh kể chuyện và tặng vật mang nghĩa thông thường là “cho”; đại từ “ông” phù hợp với Giô-sép trong mạch văn.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: bộ quần áo để thay
  rationale: Cụm từ chỉ những bộ y phục thay đổi hoặc thay thế. “Bộ quần áo để thay” rõ nghĩa, tự nhiên và cho phép số ít ở vế phân phối, số nhiều sau con số năm.
- source_word: וּלְבִנְיָמִן
  choice: còn Bên-gia-min thì
  rationale: וְ mở ra sự tương phản giữa quà dành cho mỗi người và phần đặc biệt dành cho Bên-gia-min; cấu trúc “còn ... thì” thể hiện tương phản tự nhiên mà không quá mạnh.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: ba trăm miếng bạc
  rationale: Nguyên văn chỉ nói “ba trăm bạc” mà không nêu đơn vị tiền tệ; “miếng bạc” truyền đạt giá trị bằng bạc nhưng không tự ý xác định là siếc-lơ.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: và năm bộ quần áo để thay
  rationale: Giữ nhất quán với cùng cụm từ ở đầu câu và bảo toàn con số năm.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Bên-gia-min” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc; giữ sự tương phản trong nguyên văn bằng “còn ... thì”.
