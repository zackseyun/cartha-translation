  terminology: “Bên-gia-min” phù hợp cách phiên âm Kinh Thánh tiếng Việt quen thuộc. “Ông cho” có sắc thái kể chuyện trung tính, phù hợp ngữ cảnh Giô-sép. Cách dùng “bộ quần áo để thay” truyền đạt hợp lý cụm חֲלִפוֹת שְׂמָלֹת mà không thêm nghĩa lễ phục.
