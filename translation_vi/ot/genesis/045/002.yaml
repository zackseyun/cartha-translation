  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: vi
  text: Ông khóc to[a]; người Ai Cập nghe thấy[b], và nhà Pha-ra-ôn cũng nghe thấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “ông cất tiếng mình trong sự khóc”, một thành ngữ Hê-bơ-rơ diễn tả việc ông khóc lớn tiếng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ai Cập nghe thấy”, nếu hiểu tên nước theo nghĩa tập thể; động từ số nhiều hỗ trợ cách dịch “người Ai Cập”.'
    reason: lexical_alternative
  - marker: c
    text: “Nhà Pha-ra-ôn” cũng có thể được hiểu là hoàng gia, gia nhân, hoặc triều đình của Pha-ra-ôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: Ông bật khóc thành tiếng
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “ông cất tiếng mình trong sự khóc”, một thành ngữ diễn tả việc khóc lớn, nghe rõ. Cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái cảm xúc bộc phát.
- source_word: וַיִּשְׁמְעוּ
  choice: nghe thấy
  rationale: Ở đây שׁמע chỉ sự nghe được âm thanh, không phải chăm chú lắng nghe hay vâng lời.
- source_word: מִצְרַיִם
  choice: người Ai Cập
  rationale: Danh từ có thể chỉ “Ai Cập”, nhưng động từ số nhiều cho thấy cách hiểu tập thể về người Ai Cập là phù hợp hơn.
- source_word: וַיִּשְׁמַע
  choice: cũng nghe thấy
  rationale: Động từ chỉ việc nghe được; thêm “cũng” thể hiện tự nhiên sự nối tiếp và song song trong câu tiếng Việt.
- source_word: בֵּית פַּרְעֹה
  choice: nhà Pha-ra-ôn
  rationale: Giữ phạm vi nghĩa tương đối rộng của בֵּית, có thể chỉ hoàng gia, gia nhân hoặc triều đình của Pha-ra-ôn, thay vì thu hẹp thành địa điểm “cung điện”.
