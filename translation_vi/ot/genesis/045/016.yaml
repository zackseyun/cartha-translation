  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: vi
  text: 'Tin ấy truyền đến cung điện Pha-ra-ôn rằng: “Các anh em của Giô-sép đã đến.” Việc đó đẹp lòng Pha-ra-ôn và các bề tôi của ông.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: Tin ấy truyền đến
  rationale: Cụm từ theo nghĩa đen là “tiếng/tin được nghe thấy”; trong ngữ cảnh này, הַקֹּל chỉ tin tức, còn cách nói “truyền đến” diễn đạt tự nhiên thể bị động נִשְׁמַע mà không làm thay đổi nội dung.
- source_word: בֵּית פַּרְעֹה
  choice: cung điện Pha-ra-ôn
  rationale: Nghĩa đen là “nhà của Pha-ra-ôn”, nhưng trong bối cảnh hoàng gia, cụm này chỉ hoàng cung hoặc triều đình; “cung điện Pha-ra-ôn” rõ nghĩa và tự nhiên, đồng thời không đồng nhất hẳn với toàn thể triều thần.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dùng “rằng” để tự nhiên dẫn vào nội dung của tin báo trong tiếng Việt.
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: Các anh em của Giô-sép đã đến
  rationale: בָּאוּ diễn tả việc đã xảy ra và có kết quả hiện tại; “đã đến” phù hợp. “Các anh em” không xác định họ lớn hay nhỏ hơn Giô-sép, nhờ đó giữ được phạm vi của danh từ số nhiều אֲחֵי.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: Việc đó đẹp lòng
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa sát là “điều đó tốt trong mắt”; “đẹp lòng” là cách diễn đạt tiếng Việt tự nhiên, trang trọng, và giữ đúng ý được xem là tốt hoặc đáng hài lòng.
- source_word: עֲבָדָיו
  choice: các bề tôi của ông
  rationale: Trong bối cảnh cung đình, עֲבָדָיו có thể chỉ những người phục vụ hoặc quan chức thuộc quyền Pha-ra-ôn. “Bề tôi” giữ sắc thái phụ thuộc vào vua mà không ấn định chức vụ cụ thể.
theological_decisions: []
translation_notes:
  register: 'Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt. Cấu trúc câu được làm tự nhiên hơn tiếng Hê-bơ-rơ nhưng vẫn giữ trình tự: tin đến hoàng cung, nội dung tin, rồi phản ứng của Pha-ra-ôn và các bề tôi.'
