  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có sắc thái trang trọng phù hợp văn bản Kinh Thánh. Dấu hai chấm trước lời trích và việc tách câu sau lời trích giúp câu không nặng nề. “Đẹp lòng” là thành ngữ tự nhiên cho וַיִּיטַב בְּעֵינֵי.
  terminology: Cách viết Pha-ra-ôn và Giô-sép nhất quán với lối phiên âm Kinh Thánh Việt ngữ quen dùng. “Bề tôi” thích hợp trong khung cảnh cung đình và không khẳng định quá mức rằng họ là quan chức; “các anh em” giữ được phạm vi của אֲחֵי mà không áp đặt quan hệ tuổi tác.
