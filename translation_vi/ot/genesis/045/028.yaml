  yaml_path: translation/ot/genesis/045/028.yaml
  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: vi
  text: 'Ít-ra-ên nói: “Đủ rồi![a] Giô-sép, con trai ta, vẫn còn sống. Ta sẽ đi gặp Giô-sép trước khi ta chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thế là đủ.” Từ Hê-bơ-rơ רַב ở đây là lời cảm thán có nghĩa là như thế là đủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ wayyiqtol tiếp nối mạch kể chuyện; tiếng Việt tự nhiên không cần dịch liên từ וַ bằng “và” trong câu này.
- source_word: יִשְׂרָאֵל
  choice: Ít-ra-ên
  rationale: Giữ đúng tên được bản Hê-bơ-rơ dùng, không đổi thành Gia-cốp.
- source_word: רַב
  choice: Đủ rồi!
  rationale: Trong ngữ cảnh cảm thán, từ này diễn tả sự đầy đủ và quyết định dứt khoát; cách dịch ngắn gọn giữ được sức nặng cảm xúc.
- source_word: עוֹד ... חָי
  choice: vẫn còn sống
  rationale: עוֹד đi với חָי chỉ tình trạng sống vẫn tiếp diễn; đây là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: יוֹסֵף בְּנִי
  choice: Giô-sép, con trai ta
  rationale: Giữ tên riêng và sự nhấn mạnh quan hệ cha con của cấu trúc sở hữu.
- source_word: אֵלְכָה
  choice: Ta sẽ đi
  rationale: Dạng cohortative biểu thị ý chí và quyết tâm của người nói; “sẽ đi” truyền đạt ý định chắc chắn mà không thêm sắc thái bắt buộc.
- source_word: וְאֶרְאֶנּוּ
  choice: gặp nó
  rationale: Nghĩa đen là “và thấy nó”; trong ngữ cảnh đi đến để tận mắt thấy người thân, “gặp nó” tự nhiên trong tiếng Việt và vẫn hàm ý được nhìn thấy trực tiếp.
- source_word: בְּטֶרֶם אָמוּת
  choice: trước khi ta chết
  rationale: Diễn đạt trực tiếp mệnh đề thời gian trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ “ta/nó” phù hợp lời của người cha cao tuổi nói về con mình trong bối cảnh kể chuyện cổ, đồng thời tránh lối diễn đạt quá cổ. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
