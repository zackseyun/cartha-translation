  to: 'Ít-ra-ên nói: “Đủ rồi![a] Giô-sép, con trai ta, vẫn còn sống. Ta sẽ đi gặp Giô-sép trước khi ta chết.”'
  rationale: Chỉ sửa cách quy chiếu Giô-sép trong mệnh đề thứ hai để tránh đại từ “nó,” vốn không phù hợp trong tiếng Việt hiện đại khi nói về một người con trưởng thành. Chú thích được chỉnh nhẹ để giải thích trực tiếp hơn giá trị cảm thán của רַב. Không thay đổi nghĩa hay mức độ quả quyết của nguyên văn.
