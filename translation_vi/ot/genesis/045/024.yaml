base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: vi
  text: 'Rồi Giô-sép tiễn các anh em mình lên đường. Khi họ ra đi, ông dặn: “Dọc đường, đừng cãi nhau.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng bối rối,” “đừng tức giận,” hoặc “đừng sợ hãi dọc đường.” Động từ Hê-bơ-rơ có thể chỉ nhiều dạng xao động cảm xúc; “cãi nhau” phù hợp với bối cảnh trước mắt là các anh em cùng lên đường sau khi Giô-sép tỏ mình cho họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: tiễn ... lên đường
  rationale: Dạng piel của שׁלח trong ngữ cảnh này nói đến việc Giô-sép cho các anh em rời nơi mình để trở về; “tiễn ... lên đường” tự nhiên trong tiếng Việt và phù hợp với diễn tiến họ ra đi.
- source_word: אֶת־אֶחָיו
  choice: các anh em mình
  rationale: Giữ nguyên quan hệ ruột thịt được nêu trong tiếng Hê-bơ-rơ; cách gọi này không buộc phải xác định riêng anh hay em trong nhóm.
- source_word: וַיֵּלֵכוּ
  choice: họ ra đi
  rationale: הלך có nghĩa rộng là đi; ở đây “ra đi” diễn đạt tự nhiên hành động tiếp theo sau khi được tiễn lên đường.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: ông dặn
  rationale: Nghĩa đen là “ông nói với họ”; trong ngữ cảnh lời căn dặn trước chuyến đi, “ông dặn” là tiếng Việt tự nhiên mà không thêm nội dung.
- source_word: אַל
  choice: đừng
  rationale: Diễn đạt trực tiếp mệnh lệnh phủ định trong tiếng Việt hiện đại.
- source_word: תִּרְגְּזוּ
  choice: cãi nhau
  rationale: רגז có thể chỉ nhiều trạng thái xao động như run sợ, kích động hay tức giận. Trong bối cảnh các anh em cùng trở về sau khi Giô-sép tỏ mình, “cãi nhau” phù hợp với khả năng đây là lời ngăn họ đổ lỗi và tranh cãi; độ rộng nghĩa được bảo lưu trong chú thích.
- source_word: בַּדָּרֶךְ
  choice: dọc đường
  rationale: דרך ở đây chỉ đường đi hoặc hành trình về Ca-na-an; “dọc đường” ngắn gọn, tự nhiên và sát ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giô-sép” theo cách phiên âm Kinh Thánh quen thuộc; “các anh em mình” bảo lưu quan hệ gia đình mà không áp đặt thứ bậc tuổi tác cho từng người.
