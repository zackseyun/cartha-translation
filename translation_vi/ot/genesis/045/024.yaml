  terminology: “Giô-sép” và “các anh em mình” nhất quán với lối dùng tên riêng và quan hệ thân tộc quen thuộc trong tiếng Việt Kinh Thánh. Chú thích dùng “Động từ Hê-bơ-rơ” và các phương án nghĩa phù hợp, không áp đặt một diễn giải giáo phái.
