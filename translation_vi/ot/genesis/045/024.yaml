  source_fidelity: 'Bản dịch truyền đạt đầy đủ trình tự chính của tiếng Hê-bơ-rơ: Giô-sép sai/tiễn các anh em đi, họ ra đi, rồi ông căn dặn họ. “Tiễn ... lên đường,” “ra đi,” và “dọc đường” là những cách diễn đạt tự nhiên, phù hợp ngữ cảnh. “Đừng cãi nhau” là cách hiểu theo ngữ cảnh có cơ sở đối với תִּרְגְּזוּ, đồng thời chú thích đã bảo lưu phổ nghĩa rộng hơn của động từ.'
