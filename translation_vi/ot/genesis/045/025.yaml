  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: vi
  text: Vậy, họ từ Ai Cập đi lên, đến xứ Ca-na-an, đến với Gia-cốp, cha họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: đi lên
  rationale: Giữ nghĩa cơ bản của עלה và sắc thái địa lý quen thuộc khi đi từ Ai Cập lên Ca-na-an.
- source_word: מִמִּצְרָיִם
  choice: từ Ai Cập
  rationale: מִן chỉ nơi xuất phát; “Ai Cập” là tên gọi chuẩn trong tiếng Việt.
- source_word: וַיָּבֹאוּ
  choice: đến
  rationale: בוא trong chuỗi hành trình này diễn tả việc đến nơi, tự nhiên hơn “đi vào” trong tiếng Việt.
- source_word: אֶרֶץ כְּנַעַן
  choice: xứ Ca-na-an
  rationale: “Xứ” thể hiện danh từ אֶרֶץ và tạo thành cách gọi địa danh tự nhiên, trang trọng trong tiếng Việt.
- source_word: אֶל
  choice: gặp
  rationale: Trong ngữ cảnh chuyển động hướng đến một người, “gặp” diễn đạt tự nhiên đích đến là Gia-cốp mà không làm thay đổi diễn tiến.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: אֲבִיהֶם
  choice: cha mình
  rationale: Chỉ người cha trực tiếp của chủ ngữ số nhiều; “mình” tránh lối diễn đạt nặng nề mà vẫn rõ quan hệ sở hữu.
