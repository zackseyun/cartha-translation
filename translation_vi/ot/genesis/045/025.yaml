  source_fidelity: Bản nháp giữ đúng trình tự hành trình, hướng đi «đi lên» từ Ai Cập, và địa danh «xứ Ca-na-an». Tuy nhiên, «gặp Gia-cốp» thêm rõ một hành động gặp gỡ mà động từ בוא cùng giới từ אֶל chỉ nói họ đến/chuyển động tới Gia-cốp. Cần dịch không thêm sắc thái này.
  naturalness: «Đến xứ Ca-na-an, đến với Gia-cốp» hơi lặp nhưng rõ ràng, tự nhiên trong văn kể chuyện trang trọng, và phản ánh hai bổ ngữ hướng đích của tiếng Hê-bơ-rơ.
  terminology: «Ai Cập», «xứ Ca-na-an», và «Gia-cốp» phù hợp cách dùng Kinh Thánh tiếng Việt. «Cha họ» phản ánh trực tiếp אֲבִיהֶם; «cha mình» có thể hiểu được nhưng kém sát hơn về ngôi sở hữu trong câu kể.
