base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: vi
  text: Hãy kể cho cha tôi nghe về tất cả vinh dự của tôi ở Ai Cập và mọi điều anh em đã thấy.[a] Hãy mau đưa cha tôi xuống đây.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “tất cả vinh quang của tôi ở Ai Cập.” Từ Hê-bơ-rơ כָּבוֹד có thể chỉ danh dự, vinh quang hoặc vẻ huy hoàng; tại đây từ này nói đến địa vị cao trọng của Giô-sép ở Ai Cập.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתֶּם
  choice: Hãy kể ... nghe
  rationale: Dạng Hiphil của נגד mang nghĩa làm cho biết, thuật lại; cách nói này tự nhiên trong lời Giô-sép dặn các anh em.
- source_word: כָּל כְּבוֹדִי
  choice: tất cả vinh dự tôi có
  rationale: כבוד ở đây chỉ danh dự, địa vị cao trọng của Giô-sép tại triều đình Ai Cập. “Vinh dự” truyền đạt ý này mà không khiến người đọc mặc nhiên hiểu theo nghĩa thần học của “vinh quang”.
- source_word: בְּמִצְרַיִם
  choice: ở Ai Cập
  rationale: Cụm từ chỉ địa điểm, được dịch trực tiếp và tự nhiên.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: mọi điều anh em đã thấy
  rationale: Giữ phạm vi bao quát của כָּל và chỉ những điều các anh của Giô-sép tận mắt chứng kiến.
- source_word: וּמִהַרְתֶּם
  choice: Hãy mau
  rationale: Trong ngữ cảnh, động từ mang lực mệnh lệnh và diễn tả sự khẩn cấp.
- source_word: וְהוֹרַדְתֶּם
  choice: đưa ... xuống
  rationale: Dạng Hiphil của ירד có nghĩa khiến đi xuống; giữ “xuống” bảo tồn cách định hướng địa lý nhất quán đối với hành trình đến Ai Cập trong Sáng Thế Ký.
- source_word: הֵנָּה
  choice: đây
  rationale: Trạng từ chỉ đích đến tại nơi người nói đang ở; “đây” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo ngữ cảnh Giô-sép nói với các anh em mình; giữ sắc thái phương hướng “xuống” dù tiếng Việt thông thường có thể chỉ nói “đưa ... đến đây”.
