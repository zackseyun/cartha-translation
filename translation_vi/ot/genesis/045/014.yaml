  naturalness: «Ôm choàng lấy cổ ... mà khóc» là cách diễn đạt tự nhiên, trang nghiêm và phù hợp văn kể chuyện hiện đại. Với vế hai, «khóc trên cổ ông» tuy hơi sát cấu trúc Hê-bơ-rơ, vẫn rõ nghĩa trong ngữ cảnh và tránh thêm chi tiết không được phát biểu.
  terminology: «Bên-gia-min» và «em trai mình» phù hợp. Dùng «ông» cho Giô-sép giữ được mạch kể; không có thuật ngữ thần học cần điều chỉnh.
