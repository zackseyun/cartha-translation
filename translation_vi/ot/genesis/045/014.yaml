base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/014.yaml
  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: vi
  text: Rồi ông ôm choàng lấy cổ Bên-gia-min, em trai mình, mà khóc[a]; Bên-gia-min cũng khóc trên cổ ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “ngã trên các cổ của Bên-gia-min, em trai mình”; dạng số nhiều “các cổ” là một cách nói Hê-bơ-rơ chỉ việc ôm choàng lấy cổ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל עַל צַוְּארֵי
  choice: ôm lấy cổ
  rationale: Cụm từ Hê-bơ-rơ theo nghĩa đen là “ngã trên cổ”, nhưng trong ngữ cảnh đoàn tụ đây là thành ngữ chỉ hành động ôm choàng lấy cổ. “Ôm lấy cổ” tự nhiên trong tiếng Việt và truyền đạt đúng hành động.
- source_word: בִנְיָמִן אָחִיו
  choice: em mình là Bên-gia-min
  rationale: אָחִיו có nghĩa là “anh/em của ông”. Trong mạch truyện, Bên-gia-min là em trai của Giô-sép; cách dịch “em mình” rõ nghĩa và tự nhiên, còn tên riêng dùng dạng quen thuộc trong tiếng Việt.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: mà khóc
  rationale: Động từ בכה chỉ việc khóc hoặc than khóc. “Khóc” là từ hiện đại, trang trọng vừa đủ và thích hợp với cảm xúc của cuộc đoàn tụ.
- source_word: וּבִנְיָמִן
  choice: Bên-gia-min cũng
  rationale: Liên từ וּ phối hợp mệnh đề thứ hai. Trong tiếng Việt, “cũng” diễn đạt tự nhiên hành động đáp lại tương ứng của Bên-gia-min mà không làm thay đổi nội dung.
- source_word: עַל צַוָּארָיו
  choice: ôm lấy cổ ông
  rationale: Theo nghĩa đen là “trên cổ ông”, nhưng động từ “khóc” kế thừa bối cảnh ôm choàng ở mệnh đề trước. Bổ sung “ôm lấy” trong tiếng Việt làm rõ hành động tương hỗ vốn được thành ngữ Hê-bơ-rơ hàm ý.
theological_decisions: []
