  register: Văn phong kể chuyện hiện đại, tự nhiên và trang nghiêm. Dùng “ông” để quy chiếu Giô-sép và “em mình” để giữ quan hệ gia đình rõ ràng; diễn đạt thành ngữ Hê-bơ-rơ bằng cách nói tiếng Việt dễ hiểu.
