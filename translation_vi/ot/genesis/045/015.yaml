  timestamp: '2026-07-19T03:35:10Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng các hành động và trình tự chính. Tuy nhiên, “khóc trên vai họ” thêm chi tiết “vai” không có trong tiếng Hê-bơ-rơ; עֲלֵיהֶם chỉ nói “trên/hướng về họ” và gợi bối cảnh gần gũi, không xác định một bộ phận cơ thể.
  naturalness: Câu văn nhìn chung hiện đại và rõ. “Khóc bên họ” tự nhiên hơn “khóc trên họ” trong tiếng Việt, đồng thời tránh bổ sung hình ảnh cụ thể. “Trò chuyện với ông” là cách diễn đạt tự nhiên cho động từ עם/אֵת trong bối cảnh này.
  terminology: “Ông” (Giô-sép), “các anh em”, “hôn”, và “trò chuyện” phù hợp văn phong kể chuyện trang trọng vừa phải. Không có thuật ngữ thần học hoặc tên riêng cần sửa.
