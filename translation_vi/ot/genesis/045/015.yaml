  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: vi
  text: Rồi ông hôn tất cả các anh em mình và khóc bên họ. Sau đó[a], các anh em ông trò chuyện với ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các anh em ông nói với ông.” Cấu trúc Hê-bơ-rơ có thể được dịch theo cả hai cách; “trò chuyện với” phù hợp với ý một cuộc đối thoại trong bối cảnh hòa giải.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: hôn
  rationale: Động từ נשׁק ở thể Piel diễn tả nụ hôn trìu mến trong cuộc hòa giải; “hôn” tự nhiên và không nhấn quá mức sắc thái lặp lại có thể có.
- source_word: לְכָל אֶחָיו
  choice: tất cả các anh em mình
  rationale: כָּל cùng danh từ số nhiều chỉ toàn thể các anh em của Giô-sép; “mình” quy chiếu tự nhiên về chủ ngữ trong tiếng Việt.
- source_word: וַיֵּבְךְּ עֲלֵיהֶם
  choice: khóc trên vai họ
  rationale: בכה là “khóc”; עַל trong bối cảnh ôm hôn và khóc gợi tư thế tựa lên người họ. “Trên vai họ” diễn đạt tự nhiên hình ảnh ấy trong tiếng Việt, phù hợp với ngữ cảnh trước đó.
- source_word: וְאַחֲרֵי כֵן
  choice: Sau đó
  rationale: Cụm từ đánh dấu trình tự thời gian; “Sau đó” rõ ràng, hiện đại và tự nhiên.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: các anh em ông trò chuyện với ông
  rationale: דבר với אֵת có thể diễn tả việc nói với hoặc nói chuyện cùng ai; “trò chuyện với” truyền đạt tính tương tác trong khung cảnh hòa giải.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “ông” cho Giô-sép và “các anh em” để giữ quan hệ gia đình; câu văn bảo toàn diễn tiến cảm xúc rồi đến cuộc trò chuyện.
