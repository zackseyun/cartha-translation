revisions:
- from: Rồi ông hôn tất cả các anh em mình và khóc trên vai họ. Sau đó, các anh em ông trò chuyện với ông.
  to: Rồi ông hôn tất cả các anh em mình và khóc bên họ. Sau đó[a], các anh em ông trò chuyện với ông.
  rationale: Thay “khóc trên vai họ” bằng “khóc bên họ” để không thêm chi tiết “vai” không có trong nguyên văn, mà vẫn giữ hình ảnh Giô-sép khóc trong sự gần gũi với các anh em. Thêm chú thích cho sắc thái có thể dịch khác của דִּבְּרוּ ... אִתּוֹ, tương ứng với dấu neo trong vệt kiểm chứng tiếng Anh.
