    rationale: Động từ פוג ở đây nói đến sự tê dại, suy kiệt hoặc gần như lịm đi vì choáng váng. “Sững lại” chủ yếu diễn tả việc đột ngột dừng/khựng, nên yếu hơn và kém chính xác về phản ứng nội tâm được nêu trong nguyên ngữ.
