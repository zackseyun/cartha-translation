base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: vi
  text: 'Họ báo với ông rằng: “Giô-sép vẫn còn sống, và đang cai trị toàn cõi Ai Cập.” Nhưng lòng ông chết lặng[a], vì ông không tin họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng ông lịm đi” hoặc “lòng ông tê dại.” Thành ngữ Hê-bơ-rơ diễn tả phản ứng nội tâm choáng váng và suy yếu của Gia-cốp khi nghe tin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: Họ báo cho ông rằng
  rationale: Diễn đạt tự nhiên công thức giới thiệu lời nói trong tiếng Hê-bơ-rơ; “báo” phù hợp với việc truyền một tin quan trọng.
- source_word: עוֹד יוֹסֵף חַי
  choice: Giô-sép vẫn còn sống
  rationale: עוֹד chỉ trạng thái tiếp diễn; “vẫn còn sống” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: וְכִי הוּא מֹשֵׁל
  choice: và đang cai trị
  rationale: Phân từ מֹשֵׁל diễn tả việc thực thi quyền cai trị; “đang cai trị” giữ sắc thái hành động hiện thời mà không gán một chức danh Ai Cập cụ thể.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: toàn cõi Ai Cập
  rationale: Trong kết cấu với מֹשֵׁל, cụm này chỉ phạm vi cai trị; “toàn cõi Ai Cập” trang trọng, dễ hiểu và bao quát.
- source_word: וַיָּפָג לִבּוֹ
  choice: lòng ông sững lại
  rationale: Thành ngữ diễn tả phản ứng nội tâm choáng váng, suy yếu hoặc tê dại. “Lòng ông sững lại” giữ hình ảnh về nội tâm và tự nhiên trong tiếng Việt, đồng thời chú thích bảo lưu các sắc thái khác.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: vì ông không tin họ
  rationale: כִּי nêu nguyên nhân cho phản ứng của Gia-cốp; “vì” thể hiện rõ quan hệ nhân quả.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “cai trị” thay cho một chức danh cụ thể để không thu hẹp nghĩa của מֹשֵׁל; giữ hình ảnh “lòng” trong thành ngữ Hê-bơ-rơ và giải thích độ rộng ngữ nghĩa bằng chú thích.
