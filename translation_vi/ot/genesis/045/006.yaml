base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: vi
  text: Vì nạn đói đã kéo dài hai năm nay trong xứ, và vẫn còn năm năm nữa sẽ không có việc cày đất hay thu hoạch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lời giải thích của Giô-sép về lý do Đức Chúa Trời sai ông đi trước; “Vì” nối tự nhiên với mạch văn trước.
- source_word: זֶה שְׁנָתַיִם
  choice: đã kéo dài hai năm nay
  rationale: Diễn đạt tự nhiên trong tiếng Việt khoảng thời gian hai năm đã trôi qua tính đến lúc nói, đồng thời giữ sắc thái chỉ định của זֶה.
- source_word: הָרָעָב
  choice: nạn đói
  rationale: Chỉ nạn đói cụ thể đã được nói đến trong câu chuyện.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: trong xứ
  rationale: Trong ngữ cảnh này, cụm từ chỉ nạn đói đang xảy ra trong xứ; “trong xứ” tự nhiên hơn cách dịch máy móc “giữa xứ” trong tiếng Việt.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: và vẫn còn năm năm nữa
  rationale: Thể hiện rõ năm năm còn lại kể từ thời điểm người nói.
- source_word: אֲשֶׁר אֵין
  choice: không... cũng không
  rationale: Mệnh đề quan hệ mô tả tình trạng trong năm năm sắp tới; cấu trúc phủ định đôi tự nhiên trong tiếng Việt.
- source_word: חָרִישׁ
  choice: cày cấy
  rationale: Chỉ hoạt động cày xới, canh tác; “cày cấy” rõ nghĩa và quen thuộc với độc giả hiện đại.
- source_word: קָצִיר
  choice: thu hoạch
  rationale: Chỉ việc hoặc mùa gặt, tương phản với cày cấy; “thu hoạch” là cách nói hiện đại, dễ hiểu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dịch ưu tiên sự tự nhiên của tiếng Việt nhưng vẫn giữ quan hệ giải thích, thời lượng hai năm đã qua và năm năm còn lại, cùng cặp hoạt động nông nghiệp tương phản.
