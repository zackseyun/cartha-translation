base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: vi
  text: Đức Chúa Trời đã sai tôi đến trước anh em để giữ lại cho anh em một phần còn sót trong xứ[a], và để bảo toàn mạng sống anh em, hầu đem lại một cuộc giải cứu lớn lao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để giữ lại cho anh em những người sống sót trong xứ” hoặc “một dòng dõi trong xứ.” Từ Hê-bơ-rơ שְׁאֵרִית có thể chỉ phần còn sót, những người sống sót, hoặc hậu duệ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để anh em thoát nạn lớn” hoặc “để nhiều người trong anh em sống sót.” Cụm từ Hê-bơ-rơ לִפְלֵיטָה גְּדֹלָה có thể nhấn mạnh sự giải cứu hoặc đoàn người sống sót do sự giải cứu ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: đã sai tôi
  rationale: Dạng wayyiqtol của שׁלח tiếp nối mạch kể quá khứ; “đã sai tôi” tự nhiên và thể hiện hành động đã xảy ra.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong lời giải thích thần học của Giô-sép, danh từ này chỉ Đức Chúa Trời duy nhất.
- source_word: לִפְנֵיכֶם
  choice: đến trước anh em
  rationale: Thành ngữ nghĩa đen là “trước mặt anh em”; trong ngữ cảnh, nó nhấn mạnh Giô-sép được đưa đến Ai Cập sớm hơn các anh em.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: để giữ lại cho anh em một phần còn sót
  rationale: שׂום có nghĩa cơ bản là đặt hoặc lập, nhưng khi đi với שְׁאֵרִית ở đây, cụm từ diễn tả việc làm cho một bộ phận còn tồn tại. Cách dịch này vừa tự nhiên vừa giữ được hình ảnh “phần còn sót”.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: אֶרֶץ có thể là “đất” hoặc “xứ”; bối cảnh địa phương, cụ thể phù hợp với “trong xứ” hơn nghĩa rộng “trên đất”.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: và để bảo toàn mạng sống anh em
  rationale: Dạng Hiphil của חיה mang nghĩa làm cho sống hoặc giữ cho sống; “bảo toàn mạng sống” trang trọng, rõ nghĩa trong bối cảnh nạn đói.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: qua một cuộc giải cứu lớn lao
  rationale: פְּלֵיטָה có thể nói đến sự thoát nạn, cuộc giải cứu, hoặc những người sống sót. Bản chính diễn đạt kết quả cứu sống, còn chú thích bảo lưu các khả năng từ vựng khác.
theological_decisions:
- issue: שְׁאֵרִית nên được dịch theo mô-típ “phần còn sót” hay cụ thể hóa thành “những người sống sót/dòng dõi”.
  choice: một phần còn sót
  alternative: những người sống sót; dòng dõi còn lại
  rationale: “Phần còn sót” bám sát trường nghĩa Hê-bơ-rơ và giữ tiếng vọng của mô-típ Kinh Thánh mà không áp đặt một cách hiểu thần học về sau; chú thích nêu rõ nghĩa cụ thể trong văn cảnh.
- issue: לִפְלֵיטָה גְּדֹלָה chỉ hành động giải cứu hay đoàn người sống sót đông đảo.
  choice: qua một cuộc giải cứu lớn lao
  alternative: để có nhiều người sống sót; thành một đoàn người sống sót đông đảo
  rationale: Cụm từ có thể diễn tả mục đích hoặc kết quả của việc giữ cho sống. Bản chính chọn nghĩa sự giải cứu, còn chú thích bảo lưu khả năng quy chiếu đến những người sống sót.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp với lời Giô-sép nói với các anh. Hai chú thích bảo lưu tính đa nghĩa thật sự của שְׁאֵרִית và פְּלֵיטָה; không đưa thêm nét nghĩa hệ phái.
