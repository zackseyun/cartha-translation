source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: vi
  text: Bây giờ, anh em đừng buồn rầu[a] và cũng đừng giận chính mình[b] vì đã bán tôi sang đây, bởi Đức Chúa Trời đã sai tôi đi trước anh em để bảo toàn sự sống[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng đau buồn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “đừng để cơn giận nóng lên trong mắt anh em,” một thành ngữ chỉ sự tức giận hoặc bất bình.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “nhằm duy trì sự sống” hoặc “để người ta được sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Dùng một dấu hiệu chuyển ý tự nhiên trong tiếng Việt hiện đại; mạch nối với lời trước đã được ngữ cảnh thể hiện nên không cần thêm “và” một cách gượng ép.
- source_word: אַל תֵּעָצְבוּ
  choice: đừng buồn rầu
  rationale: Động từ עצב diễn tả nỗi đau buồn hoặc phiền muộn; “buồn rầu” vừa tự nhiên vừa giữ sắc thái cảm xúc của lời Giô-sép trấn an các anh.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: cũng đừng giận chính mình
  rationale: Đây là thành ngữ có nghĩa đen gần như “đừng để điều ấy nóng lên trong mắt anh em.” Trong ngữ cảnh, nó nói đến sự tức giận hoặc bất bình hướng vào chính họ; cách dịch này truyền đạt ý thành ngữ rõ ràng.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: vì đã bán tôi sang đây
  rationale: כִּי nêu lý do của hai mệnh lệnh cấm; “sang đây” diễn đạt tự nhiên hướng chuyển động hàm chứa trong việc Giô-sép bị bán đến nơi này.
- source_word: לְמִחְיָה
  choice: để bảo toàn sự sống
  rationale: Danh từ מחיה chỉ sự duy trì hoặc bảo tồn mạng sống. Cách dịch theo mục đích giữ trọng tâm rộng của nguyên văn mà không tự ý giới hạn đối tượng được cứu sống.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: Đức Chúa Trời đã sai tôi
  rationale: Thể hoàn thành Hê-bơ-rơ được diễn đạt bằng quá khứ tiếng Việt; câu giữ nguyên việc Giô-sép trực tiếp quy hành động sai phái cho Đức Chúa Trời.
- source_word: לִפְנֵיכֶם
  choice: đi trước anh em
  rationale: 'Diễn đạt cả ý về vị trí lẫn thời điểm: Giô-sép được sai đến trước khi các anh em tới.'
theological_decisions:
- issue: Sự tể trị của Đức Chúa Trời và trách nhiệm của con người
  choice: Giữ song song “anh em… đã bán tôi” và “Đức Chúa Trời đã sai tôi,” không làm nhẹ bên nào.
  alternative: Giảm nhẹ hành động của các anh em thành việc chỉ đưa Giô-sép đi, hoặc diễn tả hành động của Đức Chúa Trời như chỉ cho phép.
  rationale: Nguyên văn đặt hành động có lỗi của các anh em cạnh mục đích chủ động của Đức Chúa Trời. Bản dịch bảo tồn sự căng thẳng thần học này thay vì giải thích cho mất đi.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” phù hợp quan hệ gia đình và lời Giô-sép trực tiếp nói với các anh; dùng “Đức Chúa Trời” làm cách gọi Elohim quen thuộc trong văn phong Kinh Thánh tiếng Việt. Các chú thích ghi nhận nghĩa từ vựng và thành ngữ thực sự của nguyên văn.
