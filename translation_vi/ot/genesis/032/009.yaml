  yaml_path: translation/ot/genesis/032/009.yaml
  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: vi
  text: 'Ông nói: “Nếu Ê-sau đến một trại và đánh trại ấy, thì trại còn lại sẽ thoát nạn.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “trại còn lại sẽ được bảo toàn,” tức là sẽ sống sót hoặc thoát khỏi sự hủy diệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ông nói
  rationale: Dạng kể chuyện wayyiqtol của אמר được chuyển tự nhiên sang thì quá khứ theo ngữ cảnh; tiếng Việt không cần dịch liên từ וַ־ một cách máy móc.
- source_word: אִם
  choice: Nếu
  rationale: Giữ nguyên sắc thái điều kiện trong suy tính của Gia-cốp, thay vì chuyển thành ý chắc chắn như “khi”.
- source_word: יָבֹא
  choice: đến
  rationale: בוא có nghĩa cơ bản là “đến”; hành động thù địch được diễn đạt riêng bằng động từ נכה theo sau.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: đến một trại
  rationale: Chỉ một trong hai trại vừa được chia ra; “đến” phản ánh אֶל, còn tính thù địch nằm ở động từ kế tiếp.
- source_word: וְהִכָּהוּ
  choice: và đánh trại ấy
  rationale: נכה mang nghĩa “đánh, giáng đòn”; đại từ hậu tố số ít được hiểu là quy chiếu về trại như một tập thể. Lặp lại “trại ấy” giúp tiếng Việt rõ nghĩa.
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: trại còn lại
  rationale: נשאר chỉ điều còn sót hoặc còn lại; cách diễn đạt này ngắn gọn và tự nhiên.
- source_word: לִפְלֵיטָה
  choice: sẽ thoát nạn
  rationale: Danh từ פְלֵיטָה diễn tả sự thoát khỏi hiểm họa hoặc tình trạng sống sót; chuyển thành động từ cho câu tiếng Việt tự nhiên, đồng thời ghi chú cách hiểu sát cấu trúc hơn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc điều kiện của nguyên văn, tránh diễn giải động từ “đến” thành “tấn công,” và đặt dấu chú thích ngay sau cụm từ mà chú thích giải thích.
