  text: two hundred female goats and twenty male goats[b][a], two hundred ewes and twenty rams.
translation:
  language: vi
  text: hai trăm dê cái và hai mươi dê đực, hai trăm cừu cái và hai mươi cừu đực.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִזִּים
  choice: dê cái
  rationale: Danh từ chỉ dê; trong danh sách đàn vật nuôi này, việc đặt song song với dê đực cho thấy cần diễn đạt rõ giới tính.
- source_word: מָאתַיִם
  choice: hai trăm
  rationale: Số từ chỉ số lượng hai trăm.
- source_word: תְיָשִׁים
  choice: dê đực
  rationale: Từ này chỉ dê giống đực; cách dịch hiện đại, rõ nghĩa và tương ứng tự nhiên với “dê cái”.
- source_word: עֶשְׂרִים
  choice: hai mươi
  rationale: Số từ chỉ số lượng hai mươi.
- source_word: רְחֵלִים
  choice: cừu cái
  rationale: Danh từ chỉ cừu giống cái; giữ rõ sự phân biệt giới tính khi được đặt song song với cừu đực.
- source_word: אֵילִים
  choice: cừu đực
  rationale: Từ này chỉ cừu giống đực; “cừu đực” rõ nghĩa đối với độc giả phổ thông và bảo toàn cấu trúc theo cặp của danh sách.
