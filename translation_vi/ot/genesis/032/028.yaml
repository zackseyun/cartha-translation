  text: And he said to him, “What is your name?” And he said, “Jacob.”
translation:
  language: vi
  text: 'Người ấy nói với ông: “Ông tên gì?” Ông nói: “Gia-cốp.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Người ấy hỏi ông
  rationale: Động từ אָמַר cơ bản là “nói”, nhưng câu trực tiếp mang hình thức câu hỏi; “hỏi” diễn đạt tự nhiên chức năng của lời nói trong tiếng Việt. Chủ ngữ được diễn đạt là “người ấy” để tránh đại từ “ông” gây nhập nhằng với Gia-cốp, còn אֵלָיו được thể hiện bằng “ông”.
- source_word: מַה שְּׁמֶךָ
  choice: Tên ngươi là gì?
  rationale: Cách hỏi tự nhiên, trực tiếp trong tiếng Việt; “ngươi” phù hợp lời xưng hô của nhân vật có vị thế cao hơn với Gia-cốp trong bối cảnh cổ, mà không thêm sắc thái khinh miệt.
- source_word: וַיֹּאמֶר
  choice: Ông đáp
  rationale: Dù nghĩa từ vựng là “nói”, trong ngữ cảnh đây là lời trả lời; “đáp” tự nhiên hơn trong tiếng Việt và vẫn giữ đúng chức năng diễn ngôn.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Giữ sự phân biệt giữa nhân vật đang hỏi và Gia-cốp bằng “người ấy” và “ông”; không xác định thêm danh tính của người hỏi ngoài điều văn mạch trực tiếp cho biết.
