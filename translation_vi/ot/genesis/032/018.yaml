revisions:
- from: 'Ông truyền cho người đi đầu: “Khi Ê-sau, anh ta, gặp ngươi và hỏi: ‘Ngươi thuộc về ai? Ngươi đi đâu? Và những thứ ở trước mặt ngươi thuộc về ai?’…”'
  to: 'Ông truyền cho người đi đầu: “Khi Ê-sau, anh tôi, gặp ngươi và hỏi: ‘Ngươi thuộc về ai? Ngươi đi đâu? Những vật này trước mặt ngươi là của ai?’…”'
  rationale: Sửa «anh ta» thành «anh tôi» để khôi phục chính xác ngôi sở hữu trong tiếng Hê-bơ-rơ. Điều chỉnh nhẹ vế cuối cho tự nhiên hơn trong tiếng Việt mà không xác định thêm đối tượng được đại từ «này» chỉ đến.
  reviewer_model: gpt-5.6-terra
