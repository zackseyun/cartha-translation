base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: vi
  text: 'Ông truyền cho người đi đầu: “Khi Ê-sau, anh tôi, gặp ngươi và hỏi: ‘Ngươi thuộc về ai? Ngươi đi đâu? Những vật này trước mặt ngươi là của ai?’…”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: người đi đầu
  rationale: Trong ngữ cảnh đoàn người và súc vật được chia thành từng toán, từ này chỉ người dẫn toán đầu tiên; cách dịch này tự nhiên và rõ hơn ‘người thứ nhất’.
- source_word: לְמִי אַתָּה
  choice: Ngươi thuộc về ai?
  rationale: Câu hỏi theo nghĩa đen là ‘Ngươi là của ai?’, hỏi người ấy phục vụ hoặc thuộc nhà ai. Bản dịch giữ quan hệ sở thuộc mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְאָנָה תֵלֵךְ
  choice: Ngươi đi đâu?
  rationale: Diễn đạt trực tiếp hướng hoặc đích đến của người đang đi.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: những thứ ở trước mặt ngươi thuộc về ai?
  rationale: Đại từ אֵלֶּה không nêu danh từ; ‘những thứ’ giữ được tính khái quát, còn ‘ở trước mặt ngươi’ bảo toàn hình ảnh không gian của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại. Dùng ‘ông’ cho Gia-cốp theo mạch văn và ‘ngươi’ trong lời căn dặn trực tiếp, phù hợp sắc thái cổ trang vừa phải. Giữ dấu ba chấm vì câu nói được tiếp tục ở câu kế.
