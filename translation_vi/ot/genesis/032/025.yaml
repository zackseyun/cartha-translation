base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: vi
  text: Gia-cốp ở lại một mình, và một người[a] vật lộn với ông cho đến khi rạng đông ló dạng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ nói “một người”; ngữ cảnh tiếp theo và Ô-sê 12:4 giúp nhận diện nhân vật này rõ hơn.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “cho đến lúc trời sáng”; sát nghĩa: “cho đến khi rạng đông mọc lên”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: ở lại
  rationale: Dạng Niphal có thể mang sắc thái “bị để lại”, nhưng trong tiếng Việt, “ở lại” diễn đạt tự nhiên tình trạng Gia-cốp còn lại sau khi những người khác đã qua sông mà không thêm tác nhân không được nêu.
- source_word: לְבַדּוֹ
  choice: một mình
  rationale: Tương đương tự nhiên, súc tích, nhấn mạnh sự cô độc của Gia-cốp.
- source_word: וַיֵּאָבֵק
  choice: vật lộn
  rationale: Động từ hiếm này chỉ việc ôm ghì, giao đấu; “vật lộn” cụ thể hơn “đấu tranh” và phù hợp với diễn biến thân thể trong ngữ cảnh.
- source_word: אִישׁ
  choice: một người
  rationale: Giữ đúng cách câu này giới thiệu nhân vật bí ẩn như một người nam, không vội xác định là thiên sứ hay Đức Chúa Trời.
- source_word: עִמּוֹ
  choice: với ông
  rationale: Diễn đạt trực tiếp quan hệ giữa người ấy và Gia-cốp; “ông” có tham chiếu rõ trong câu.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: cho đến khi rạng đông ló dạng
  rationale: Giữ hình ảnh “rạng đông mọc/lên” của tiếng Hê-bơ-rơ bằng cách nói tự nhiên trong tiếng Việt; “cho đến lúc trời sáng” là phương án gọn hơn.
theological_decisions:
- issue: Danh tính của אִישׁ trong cuộc vật lộn
  choice: Dịch là “một người” trong chính văn, không xác định thêm danh tính.
  alternative: “một thiên sứ” hoặc “Đức Chúa Trời/Đức Giê-hô-va hiện ra như một người”
  rationale: Chính câu này chỉ gọi nhân vật ấy là אִישׁ, “một người”. Ngữ cảnh tiếp theo và Ô-sê 12:4 góp phần vào việc nhận diện đầy đủ hơn, nhưng bản dịch tại đây nên giữ nguyên sự bí ẩn và căng thẳng thần học của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Gia-cốp” theo dạng tên quen thuộc trong Kinh Thánh tiếng Việt; “vật lộn” giữ tính cụ thể của hành động; không giải quyết trước danh tính bí ẩn của nhân vật.
