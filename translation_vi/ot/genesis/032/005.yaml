base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: vi
  text: 'Ông truyền lệnh cho họ: “Hãy nói với chúa tôi là Ê-sau như sau: ‘Gia-cốp, tôi tớ của ngài[b], nói thế này: Tôi đã kiều cư[a] bên La-ban và lưu lại cho đến nay.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi đã sống như một người ngoại kiều bên La-ban.” Động từ Hê-bơ-rơ có thể nhấn mạnh việc cư trú với tư cách người ngoài.'
    reason: lexical_alternative
  - marker: b
    text: “Tôi tớ của ngài” là lối Gia-cốp tự xưng một cách nhún nhường trước Ê-sau, không nhất thiết có nghĩa ông thực sự là đầy tớ hay nô lệ của Ê-sau.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền cho
  rationale: Giữ sắc thái giao nhiệm vụ có tính mệnh lệnh của צוה, đồng thời tự nhiên trong ngữ cảnh sai sứ giả đi chuyển lời.
- source_word: כֹּה תֹאמְרוּן
  choice: hãy nói ... như thế này
  rationale: Diễn đạt rõ công thức giới thiệu nguyên văn thông điệp và giữ lực chỉ thị của động từ.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: với Ê-sau, chúa tôi
  rationale: Giữ danh xưng kính trọng của Gia-cốp dành cho Ê-sau; “chúa” ở đây là tước xưng xã hội, không phải danh xưng thần linh.
- source_word: כֹּה אָמַר
  choice: nói thế này
  rationale: Là cách nói tiếng Việt tự nhiên cho công thức của sứ giả, giới thiệu chính xác lời của người sai phái.
- source_word: עַבְדְּךָ
  choice: tôi tớ của ngài
  rationale: Phản ánh lối tự xưng nhún nhường trong lời ngoại giao, không nhất thiết hàm ý Gia-cốp là nô lệ theo nghĩa pháp lý.
- source_word: גַּרְתִּי
  choice: đã sống như một ngoại kiều
  rationale: Giữ nét nghĩa của גור là cư trú với tư cách người ngoài hoặc kiều cư, thay vì chỉ nói chung chung là “ở”.
- source_word: וָאֵחַר עַד עָתָּה
  choice: và ở lại đó cho đến nay
  rationale: Trong ngữ cảnh, động từ chỉ việc tiếp tục lưu lại đến thời điểm hiện tại; cách dịch này tự nhiên và không hiểu thành đơn thuần đến trễ.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “các ngươi” trong lời truyền cho nhiều sứ giả và “ngài” trong thông điệp kính cẩn gửi Ê-sau. Dấu hai chấm và ngoặc kép phân tầng lời nói để tránh cấu trúc trích dẫn rối.
