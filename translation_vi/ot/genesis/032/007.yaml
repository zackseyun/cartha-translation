  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: vi
  text: 'Các sứ giả trở về với Gia-cốp[a] và nói: “Chúng tôi đã đến gặp anh của ông, là Ê-sau. Ông ấy cũng đang đến gặp ông, và có bốn trăm người đàn ông cùng đi với ông ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các thiên sứ trở về với Gia-cốp,” nhưng cách hiểu này ít phù hợp hơn trong ngữ cảnh. Từ Hê-bơ-rơ מַלְאָכִים có thể có nghĩa là “sứ giả” hoặc “thiên sứ”; ở đây từ này chỉ những người Gia-cốp đã sai đến gặp Ê-sau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: trở về
  rationale: Động từ שׁוב ở thể wayyiqtol thuật lại hành động đã hoàn tất; “trở về” tự nhiên trong mạch văn các sứ giả quay lại với Gia-cốp.
- source_word: הַמַּלְאָכִים
  choice: các sứ giả
  rationale: מַלְאָךְ có thể chỉ sứ giả hoặc thiên sứ; ở đây ngữ cảnh cho thấy đó là những người Gia-cốp đã sai đến gặp Ê-sau.
- source_word: לֵאמֹר
  choice: và nói
  rationale: Lối dẫn lời trực tiếp bằng “và nói” tự nhiên trong tiếng Việt, đồng thời thể hiện đúng chức năng của cấu trúc Hê-bơ-rơ.
- source_word: בָּאנוּ אֶל אָחִיךָ אֶל עֵשָׂו
  choice: Chúng tôi đã đến gặp Ê-sau, anh của ông
  rationale: בוא được diễn đạt là “đã đến”; hai cụm với אֶל có quan hệ đồng vị, xác định người anh là Ê-sau. Đảo tên lên trước giúp câu tiếng Việt tự nhiên mà vẫn giữ quan hệ gia đình được nhấn mạnh.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: Ông ấy cũng đang đến gặp ông
  rationale: “cũng” giữ lực bổ sung của גַּם; phân từ הֹלֵךְ được diễn đạt bằng “đang đến,” thể hiện hành động đang diễn ra, còn לִקְרָאתְךָ là “gặp ông” theo hướng tiến về phía Gia-cốp.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: và có bốn trăm người đi cùng
  rationale: Cách diễn đạt này giữ nguyên con số và ý rằng bốn trăm người đang tháp tùng Ê-sau; “người” là cách đếm tự nhiên trong tiếng Việt và ngữ cảnh vẫn cho thấy đây là một đoàn nam giới.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “ông” trong lời các sứ giả thưa với Gia-cốp và nói về Ê-sau; tránh thêm sắc thái thù địch mà nguyên văn không nói rõ.
