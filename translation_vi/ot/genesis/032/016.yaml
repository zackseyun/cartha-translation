  yaml_path: translation/ot/genesis/032/016.yaml
  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: vi
  text: ba mươi lạc đà cái đang cho con bú cùng đàn con của chúng, bốn mươi bò cái và mười bò đực, hai mươi lừa cái và mười lừa con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mười lừa đực”; từ Hê-bơ-rơ có thể chỉ lừa non, nhưng trong danh sách gia súc này có thể chỉ lừa đực đi đôi với lừa cái.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: lạc đà cái đang cho con bú
  rationale: Phân từ מֵינִיקוֹת chỉ những con cái đang cho con bú; thêm “cái” để diễn đạt rõ giới tính vốn được hình thái giống cái trong tiếng Hê-bơ-rơ biểu thị.
- source_word: וּבְנֵיהֶם
  choice: cùng đàn con của chúng
  rationale: Nghĩa đen là “và con cái của chúng”; trong ngữ cảnh vật nuôi, “đàn con” là cách nói tự nhiên và không quy định số lượng từng con.
- source_word: פָּרוֹת
  choice: bò cái
  rationale: Danh từ chỉ bò giống cái; cách dịch này giữ sự đối ứng giới tính với פָרִים ở ngay sau.
- source_word: וּפָרִים
  choice: và mười bò đực
  rationale: פָרִים chỉ gia súc giống đực, đặc biệt là bò đực; “bò đực” rõ nghĩa và phù hợp với danh sách phối giống.
- source_word: אֲתֹנֹת
  choice: lừa cái
  rationale: Từ Hê-bơ-rơ chỉ rõ lừa giống cái; “lừa cái” là cách gọi hiện đại, tự nhiên.
- source_word: וַעְיָרִם
  choice: và mười lừa con
  rationale: עַיִר thường chỉ lừa non hoặc lừa con, nhưng cũng có thể được hiểu là lừa đực trong danh sách gia súc; bản dịch chính giữ nghĩa về độ tuổi và chú thích nêu khả năng khác.
