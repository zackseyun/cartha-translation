  variant: modern standard Vietnamese
source:
  edition: WLC
  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: vi
  text: Xin giải cứu con khỏi tay anh con, khỏi tay Ê-sau, vì con sợ rằng anh ấy sẽ đến tấn công cả con lẫn mẹ và con cái.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “mẹ trên các con”; đây là thành ngữ chỉ việc mẹ cùng các con bị tấn công hoặc bị hủy diệt.'
    reason: Giải thích thành ngữ Hê-bơ-rơ, giữ hình ảnh sát chữ và không quy động từ chính thành “giết” một cách quá cụ thể.
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: Xin giải cứu con
  rationale: Mệnh lệnh Hifil của נצל kèm tiểu từ khẩn cầu נָא diễn tả lời van xin. “Xin giải cứu con” tự nhiên trong lời cầu nguyện tiếng Việt và giữ được sắc thái khẩn thiết.
- source_word: מִיַּד
  choice: khỏi tay
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ chỉ việc thoát khỏi quyền lực hay sự khống chế của một người; cách nói này vẫn rõ nghĩa trong tiếng Việt.
- source_word: אָחִי
  choice: anh con
  rationale: Trong ngữ cảnh, Ê-sau là anh sinh đôi nhưng ra đời trước Gia-cốp; “anh con” vừa chính xác về quan hệ vừa giữ được nghịch cảnh đau đớn của mối đe dọa đến từ người anh.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: vì con sợ anh ấy
  rationale: Diễn đạt trạng thái sợ hãi hiện tại của Gia-cốp bằng tiếng Việt tự nhiên; “anh ấy” quy chiếu rõ về Ê-sau.
- source_word: פֶּן יָבוֹא
  choice: sẽ đến
  rationale: Sau פֶּן, động từ diễn tả biến cố mà người nói lo sợ có thể xảy ra. Cấu trúc “sợ ... sẽ” truyền đạt sắc thái ấy tự nhiên mà không khẳng định biến cố chắc chắn xảy ra.
- source_word: וְהִכַּנִי
  choice: đánh con
  rationale: נכה có nghĩa rộng là đánh hoặc giáng đòn; không dịch riêng động từ này là “giết” để tránh thu hẹp nghĩa, trong khi vế sau cho thấy mức độ bạo lực được lo sợ.
- source_word: אֵם עַל בָּנִים
  choice: giết cả mẹ lẫn con
  rationale: Đây là thành ngữ mô tả việc hủy diệt mẹ cùng các con. Thêm “giết” làm rõ quan hệ cú pháp và tránh khiến “mẹ lẫn con” bị hiểu là đồng vị với đại từ “con” chỉ Gia-cốp; “cả ... lẫn ...” truyền đạt tính bao gồm của tai họa.
theological_decisions:
- issue: Cách hiểu cụm bạo lực אֵם עַל בָּנִים
  choice: giết cả mẹ lẫn con
  alternative: đánh con, mẹ cùng các con
  rationale: Cụm Hê-bơ-rơ có hình thức sát chữ là “mẹ trên/cùng các con” và chỉ cảnh mẹ bị giết cùng con cái. Bản dịch làm rõ hành động được ngụ ý nhưng không xác định người mẹ là một cá nhân cụ thể hay giới hạn vào một gia đình nào.
translation_notes:
  register: Văn phong cầu nguyện hiện đại, trang trọng nhưng dễ hiểu. Đại từ “con” phù hợp lời Gia-cốp thưa với Đức Chúa Trời; “anh ấy” giữ quan hệ gia đình rõ ràng. Dùng câu trực tiếp, tránh từ cổ và tránh cú pháp sát chữ gây nhập nhằng.
