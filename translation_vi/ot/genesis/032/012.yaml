revisions:
- from: Xin giải cứu con khỏi tay anh con, khỏi tay Ê-sau, vì con sợ anh ấy sẽ đến đánh con, giết cả mẹ lẫn con.[a]
  to: Xin giải cứu con khỏi tay anh con, khỏi tay Ê-sau, vì con sợ rằng anh ấy sẽ đến tấn công cả con lẫn mẹ và con cái.[a]
  rationale: Sửa câu cuối để phản ánh quan hệ giữa động từ “ra tay/đánh” và thành ngữ “mẹ trên các con” mà không thêm một hành động “giết” không được nêu riêng trong tiếng Hê-bơ-rơ. “Cả con lẫn mẹ và con cái” làm rõ rằng nỗi sợ bao gồm Gia-cốp và những người mẹ cùng con cái trong gia đình, tránh nhập nhằng do “con” vừa là đại từ cầu nguyện vừa có thể có nghĩa là con cái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:42:56Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lời khẩn cầu, quan hệ với Ê-sau, và nỗi sợ của Gia-cốp. Tuy nhiên, cụm “giết cả mẹ lẫn con” nâng động từ הִכַּנִי (“đánh/ra tay, tấn công”) thành “giết” và tách thành một hành động thứ hai. Điều này cụ thể hóa quá mức so với nguyên văn, dù thành ngữ cuối câu quả có thể gợi một cuộc tàn sát gia đình.
  naturalness: “Xin giải cứu con khỏi tay...” và đại từ cầu nguyện “con” là tự nhiên, trang trọng. Câu sửa dùng “sợ rằng ... sẽ” để diễn đạt mệnh đề sau פֶּן một cách Việt ngữ, đồng thời dùng “tấn công” để câu không bị hiểu lầm rằng “mẹ lẫn con cái” đồng vị với Gia-cốp.
  terminology: Giữ “Ê-sau” và “anh con.” “Tấn công” là tương đương tự nhiên, bao quát cho נכה trong ngữ cảnh bạo lực này mà không tự quyết rằng hành động đã là giết người. Chú thích giữ hình ảnh sát chữ và giải thích thành ngữ, nhưng không biến nghĩa của động từ chính thành “giết.”
  issues:
  - severity: medium
    issue: “giết cả mẹ lẫn con” diễn dịch quá cụ thể động từ và làm thay đổi cấu trúc mệnh đề.
    rationale: וְהִכַּנִי có nghĩa cơ bản là “đánh/ra tay chống lại tôi”; אֵם עַל־בָּנִים nêu phạm vi/hình ảnh của cuộc tấn công. Dù thành ngữ có hàm ý hủy diệt mẹ cùng con cái, nguyên văn không dùng một động từ riêng “giết” ở đây. Bản dịch nên giữ độ rộng ấy.
