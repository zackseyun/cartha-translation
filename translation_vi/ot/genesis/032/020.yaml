  text: וַ/יְצַ֞ו גַּ֣ם אֶת הַ/שֵּׁנִ֗י גַּ֚ם אֶת הַ/שְּׁלִישִׁ֔י גַּ֚ם אֶת כָּל הַ/הֹ֣לְכִ֔ים אַחֲרֵ֥י הָ/עֲדָרִ֖ים לֵ/אמֹ֑ר כַּ/דָּבָ֤ר הַ/זֶּה֙ תְּדַבְּר֣וּ/ן אֶל עֵשָׂ֔ו בְּ/מֹצַאֲ/כֶ֖ם אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: vi
  text: 'Ông cũng truyền lệnh cho người thứ hai, người thứ ba và tất cả những người đi sau các đàn vật rằng: “Các ngươi phải nói với Ê-sau theo lời này[a] khi gặp ông ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Các ngươi phải nói với Ê-sau như thế này khi gặp ông ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Dạng Piel của צוה diễn tả việc ban mệnh lệnh hoặc lời chỉ thị có tính bắt buộc; “truyền lệnh” giữ được sắc thái ấy và hợp với văn phong trần thuật trang trọng.
- source_word: הַשֵּׁנִי ... הַשְּׁלִישִׁי
  choice: người thứ hai, người thứ ba
  rationale: Hai số thứ tự được dùng như danh từ. Thêm “người” là điều cần thiết để câu tiếng Việt tự nhiên, nhưng không xác định họ là “đầy tớ” vì danh từ đó không có trong câu Hebrew.
- source_word: כָּל הַהֹלְכִים
  choice: tất cả những người đi
  rationale: Giữ ý nghĩa bao quát của כָּל và sắc thái tiếp diễn của phân từ הַהֹלְכִים bằng một cấu trúc tiếng Việt tự nhiên.
- source_word: אַחֲרֵי הָעֲדָרִים
  choice: sau các đàn vật
  rationale: עדרים chỉ những nhóm gia súc được lùa đi. “Các đàn vật” đủ rộng để không thu hẹp thành một loại gia súc cụ thể và tự nhiên trong ngữ cảnh.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Trong văn xuôi Hebrew, từ này thường dẫn vào lời nói trực tiếp; “rằng” thực hiện chức năng ấy tự nhiên hơn cách dịch máy móc là “nói rằng” sau động từ truyền lệnh.
- source_word: כַּדָּבָר הַזֶּה
  choice: như thế này
  rationale: Theo nghĩa đen là “theo lời/việc này”, nhưng trong ngữ cảnh đây là công thức chỉ cách nói đã được quy định. “Như thế này” truyền đạt đúng chức năng và là tiếng Việt tự nhiên.
- source_word: תְּדַבְּרוּן
  choice: các ngươi phải nói
  rationale: Dạng động từ số nhiều nằm trong lời truyền lệnh; “phải nói” thể hiện rõ lực chỉ thị, còn “các ngươi” giữ sự phân biệt số nhiều và sắc thái trang trọng của lời kể cổ.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: khi gặp ông ấy
  rationale: Cấu trúc ב + infinitive construct mang nghĩa thời gian. מצא có nghĩa cơ bản là “tìm thấy”, nhưng trong tình huống chạm mặt Ê-sau, “gặp” là cách diễn đạt tự nhiên và phù hợp ngữ cảnh hơn.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Các ngươi” được giữ trong lời truyền lệnh để biểu thị rõ đối tượng số nhiều; “ông ấy” tránh sắc thái khinh miệt khi nhắc đến Ê-sau. Không thêm “đầy tớ” dù ngữ cảnh có thể gợi ra điều đó.
