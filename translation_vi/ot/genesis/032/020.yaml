  to: 'Ông cũng truyền lệnh cho người thứ hai, người thứ ba và tất cả những người đi sau các đàn vật rằng: “Các ngươi phải nói với Ê-sau theo lời này[a] khi gặp ông ấy.”'
  rationale: Chỉ sửa cụm quy chiếu כַּדָּבָר הַזֶּה thành “theo lời này” để bảo toàn sắc thái lời lẽ đã được quy định trong nguyên ngữ. Chú thích giữ phương án thành ngữ “như thế này,” vốn tự nhiên và khả dĩ trong ngữ cảnh.
