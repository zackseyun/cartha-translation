  text: וַ/יָּ֣קָם בַּ/לַּ֣יְלָה ה֗וּא וַ/יִּקַּ֞ח אֶת שְׁתֵּ֤י נָשָׁי/ו֙ וְ/אֶת שְׁתֵּ֣י שִׁפְחֹתָ֔י/ו וְ/אֶת אַחַ֥ד עָשָׂ֖ר יְלָדָ֑י/ו וַֽ/יַּעֲבֹ֔ר אֵ֖ת מַעֲבַ֥ר יַבֹּֽק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: vi
  text: Đêm ấy, ông dậy, đem theo hai người vợ, hai nữ tỳ[a] và mười một người con của mình, rồi đi qua chỗ cạn của sông Gia-bốc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hai nữ nô lệ.” Từ Hê-bơ-rơ שִׁפְחֹתָיו chỉ những phụ nữ có địa vị lệ thuộc trong gia đình và có thể hàm ý thân phận nô lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: ông dậy
  rationale: Động từ קום ở đây chỉ việc đứng dậy hoặc thức dậy để hành động; “ông dậy” tự nhiên, gọn và phù hợp văn kể chuyện hiện đại.
- source_word: בַּלַּיְלָה הוּא
  choice: Đêm ấy
  rationale: Cách diễn đạt này chuyển tự nhiên ý thời gian của cụm Hê-bơ-rơ và giữ được sắc thái xác định, nhấn vào chính đêm đó.
- source_word: וַיִּקַּח
  choice: đem theo
  rationale: Trong ngữ cảnh đưa gia đình đến chỗ vượt sông, “đem theo” diễn đạt tự nhiên hành động לקח mà không hàm ý cưỡng ép.
- source_word: שְׁתֵּי נָשָׁיו
  choice: hai người vợ
  rationale: נָשִׁים trong ngữ cảnh này rõ ràng chỉ hai người vợ của Gia-cốp.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: hai nữ tỳ
  rationale: שִׁפְחָה chỉ phụ nữ có địa vị lệ thuộc trong gia đình, có thể là nữ đầy tớ hoặc nữ nô lệ. “Nữ tỳ” ngắn gọn, phù hợp bối cảnh cổ đại; chú thích bảo lưu sắc thái nô lệ.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: mười một người con của mình
  rationale: יְלָדִים có nghĩa là con cái, không riêng con trai; bản dịch không tự ý đồng nhất thuật ngữ này với “các con trai”.
- source_word: וַיַּעֲבֹר
  choice: đi qua
  rationale: עבר trong ngữ cảnh di chuyển có nghĩa là vượt hoặc đi qua; “đi qua” tự nhiên và giữ chủ thể theo hình thức của câu Hê-bơ-rơ.
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: chỗ cạn của sông Gia-bốc
  rationale: מַעֲבַר ở đây là nơi có thể lội hoặc vượt qua dòng nước. “Chỗ cạn” dễ hiểu hơn “bến cạn” đối với độc giả hiện đại, còn Gia-bốc là dạng phiên âm tiếng Việt quen dùng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” theo mạch văn vì chủ thể là Gia-cốp; tránh lối diễn đạt quá cổ. Tên יַבֹּק được phiên âm là “Gia-bốc” theo truyền thống tiếng Việt.
