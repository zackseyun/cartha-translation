  yaml_path: translation/ot/genesis/032/024.yaml
  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: vi
  text: Ông đem họ đi và đưa họ qua dòng suối[a]; rồi đưa qua những gì thuộc về ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khe núi” hoặc “dòng chảy theo mùa.” Từ Hê-bơ-rơ נחל có thể chỉ một dòng nước, khe núi hoặc dòng chảy theo mùa.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “những gì là của ông,” tức những gì thuộc về ông hoặc tài sản của ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: Ông dẫn họ đi
  rationale: Động từ לקח có nghĩa cơ bản là “lấy/đưa.” Trong ngữ cảnh nói về những người vừa được nhắc đến, “dẫn họ đi” tự nhiên trong tiếng Việt mà không thêm ý nghĩa không có trong nguyên văn.
- source_word: וַיַּעֲבִרֵם
  choice: đưa họ qua
  rationale: Dạng Hiphil của עבר mang nghĩa khiến hoặc giúp ai đó vượt qua; “đưa họ qua” vừa tự nhiên vừa giữ được sắc thái tác động của động từ.
- source_word: הַנָּחַל
  choice: dòng suối
  rationale: נחל có thể chỉ dòng suối, khe suối hoặc lòng suối theo mùa. “Dòng suối” dễ hiểu và phù hợp với hành động vượt qua, trong khi chú thích bảo lưu phạm vi địa hình rộng hơn.
- source_word: וַיַּעֲבֵר
  choice: đưa qua đó
  rationale: Dạng Hiphil tiếp tục diễn tả hành động làm cho vật sở hữu được chuyển qua. Từ “đó” giúp câu tiếng Việt rõ và tự nhiên, chỉ sang bờ bên kia vừa được nói đến.
- source_word: אֲשֶׁר לוֹ
  choice: những gì thuộc về mình
  rationale: Cụm này sát nghĩa là “những gì là của ông/thuộc về ông.” Cách dịch đã chọn giữ cấu trúc khái quát của tiếng Hê-bơ-rơ và không thu hẹp thành một loại tài sản cụ thể.
