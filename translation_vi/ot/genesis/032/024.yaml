translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Đại từ “ông” giữ chủ thể hàm ẩn của động từ Hê-bơ-rơ; cấu trúc song song bảo lưu hai hành động liên tiếp. Các dấu chú thích được đặt ngay sau những cụm từ tương ứng.
