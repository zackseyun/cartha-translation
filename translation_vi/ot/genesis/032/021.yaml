  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: vi
  text: 'Các ngươi cũng hãy nói: “Kìa, đầy tớ ngài là Gia-cốp đang ở phía sau chúng tôi.” Vì ông tự nhủ: “Ta sẽ dùng món quà đang được đưa đi trước ta để xoa dịu ông ấy[a]; sau đó ta sẽ thấy mặt ông ấy. Có lẽ ông ấy sẽ tiếp nhận ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “Ta sẽ xoa dịu mặt ông ấy.” Động từ này có liên hệ với ngôn ngữ về sự chuộc tội, nhưng tại đây chỉ việc Gia-cốp dùng quà để làm Ê-sau nguôi giận.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “nâng mặt ta lên,” một thành ngữ có nghĩa là tiếp nhận hoặc tỏ thiện ý với ta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: đầy tớ của ngài
  rationale: Trong lời ngoại giao, Gia-cốp tự hạ mình trước Ê-sau. “Đầy tớ” giữ được sắc thái kính cẩn và lệ thuộc mà không gợi chế độ nô lệ quá mức trong ngữ cảnh này.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Tiểu từ thu hút sự chú ý; “Kìa” tự nhiên, ngắn gọn và trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: אַחֲרֵינוּ
  choice: đang ở phía sau chúng tôi
  rationale: Diễn đạt rõ vị trí của Gia-cốp theo sau các sứ giả và lễ vật.
- source_word: אֲכַפְּרָה פָנָיו
  choice: xoa dịu ông ấy
  rationale: 'Động từ כפר ở đây thuộc bối cảnh quan hệ giữa người với người: Gia-cốp muốn làm nguôi cơn giận của Ê-sau bằng lễ vật, chứ không thực hiện nghi lễ chuộc tội. Chú thích bảo lưu hình ảnh nguyên văn “xoa dịu mặt ông ấy”.'
- source_word: מִנְחָה
  choice: lễ vật
  rationale: Chỉ món quà mang tính hòa giải được gửi đến Ê-sau. “Lễ vật” phù hợp sắc thái trang trọng của câu chuyện nhưng trong ngữ cảnh không nhất thiết mang nghĩa tế tự.
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: đi trước mình
  rationale: Giữ ý lễ vật đang được đưa đi trước Gia-cốp, đồng thời dùng cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: אֶרְאֶה פָנָיו
  choice: ta sẽ thấy mặt ông ấy
  rationale: Giữ hình ảnh “mặt” trong nguyên văn và một phần phép lặp văn chương của câu; cách nói vẫn hiểu được trong tiếng Việt.
- source_word: יִשָּׂא פָנַי
  choice: ông ấy sẽ tiếp nhận ta
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là “nâng mặt ta lên”, chỉ việc đón nhận hoặc tỏ thiện ý. Dịch nghĩa trong chính văn để người đọc hiện đại hiểu ngay, và giải thích hình ảnh ở chú thích.
- source_word: אוּלַי
  choice: Có lẽ
  rationale: Thể hiện đúng sự bất định xen lẫn hy vọng của Gia-cốp.
theological_decisions:
- issue: Nghĩa của כפר trong bối cảnh không thuộc nghi lễ
  choice: xoa dịu ông ấy
  alternative: chuộc tội trước mặt ông ấy
  rationale: Đối tượng là Ê-sau và phương tiện là một món quà hòa giải, nên ý chính là làm nguôi giận. Cách dịch tránh áp đặt nghĩa tế tự, trong khi chú thích vẫn cho biết mối liên hệ từ vựng với ngôn ngữ chuộc tội.
- issue: Thành ngữ יִשָּׂא פָנַי
  choice: ông ấy sẽ tiếp nhận ta
  alternative: ông ấy sẽ nâng mặt ta lên
  rationale: Dịch theo nghĩa thành ngữ để câu tiếng Việt rõ ràng, nhưng ghi nghĩa đen trong chú thích nhằm bảo tồn hình ảnh và phép chơi chữ xoay quanh “mặt”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ngươi” vì mệnh lệnh số nhiều hướng đến các đầy tớ, còn “ngài” thể hiện lối xưng hô kính cẩn mà Gia-cốp dặn họ dùng với Ê-sau. Chính văn ưu tiên diễn đạt tự nhiên cho hai thành ngữ khó, đồng thời giữ “thấy mặt” và giải thích các nghĩa đen trong chú thích để phần nào bảo tồn mô-típ lặp lại của פָּנִים.
