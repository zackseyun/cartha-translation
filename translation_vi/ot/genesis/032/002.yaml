base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: vi
  text: Gia-cốp tiếp tục lên đường, và các thiên sứ[a] của Đức Chúa Trời gặp ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các sứ giả của Đức Chúa Trời”; từ Hê-bơ-rơ có thể chỉ sứ giả loài người hoặc thiên sứ.
    reason: lexical_alternative
  - marker: b
    text: Hay “chạm mặt ông” hoặc “gặp ông trên đường”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲקֹב
  choice: Gia-cốp
  rationale: Liên từ וְ tiếp nối mạch kể chuyện và không nhất thiết phải được biểu đạt riêng trong tiếng Việt; tên יַעֲקֹב được phiên âm theo cách quen thuộc trong tiếng Việt.
- source_word: הָלַךְ לְדַרְכּוֹ
  choice: tiếp tục lên đường
  rationale: Cụm này có nghĩa đen gần với “đi theo đường của mình”; “tiếp tục lên đường” diễn đạt tự nhiên việc Gia-cốp tiếp tục hành trình.
- source_word: וַיִּפְגְּעוּ בוֹ
  choice: gặp ông
  rationale: Động từ פגע đi với ב có thể chỉ việc gặp, chạm mặt hoặc tình cờ gặp. “Gặp ông” ngắn gọn, tự nhiên và không thêm sắc thái thù địch.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: các thiên sứ của Đức Chúa Trời
  rationale: מַלְאָךְ có thể là “sứ giả” hoặc “thiên sứ”; ngữ cảnh kế tiếp nói đến “doanh trại của Đức Chúa Trời”, nên ở đây nhiều khả năng chỉ các hữu thể thiên thượng. Cách diễn đạt sở hữu giữ sát cấu trúc Hê-bơ-rơ.
theological_decisions:
- issue: Đối tượng được gọi là מַלְאֲכֵי אֱלֹהִים
  choice: các thiên sứ của Đức Chúa Trời
  alternative: các sứ giả của Đức Chúa Trời
  rationale: Danh từ Hê-bơ-rơ có thể chỉ sứ giả loài người, nhưng câu kế tiếp gọi nơi này là “doanh trại của Đức Chúa Trời”, nghiêng mạnh về các hữu thể thiên thượng. Chú thích vẫn ghi nhận nghĩa từ vựng còn lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tiếp tục lên đường” tự nhiên hơn lối dịch sát chữ “đi theo đường của mình”, còn “gặp ông” giữ được tính trung hòa của động từ Hê-bơ-rơ.
