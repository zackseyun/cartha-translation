    rationale: Hậu tố chỉ hướng trong tiếng Hê-bơ-rơ cho biết đích đến. Cấu trúc “đến gặp Ê-sau ... ở đất Sê-i-rơ” là lối tiếng Việt tự nhiên, đồng thời vẫn trình bày Sê-i-rơ/Ê-đôm là địa điểm của cuộc phái đi.
