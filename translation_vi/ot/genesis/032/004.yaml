base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: vi
  text: Gia-cốp sai các sứ giả đi trước mình đến gặp Ê-sau, anh mình, ở đất Sê-i-rơ, miền Ê-đôm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cánh đồng Ê-đôm”; cụm từ này có lẽ là tên gọi một vùng lãnh thổ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sai
  rationale: Động từ שלח trong mạch kể chỉ hành động phái người đi; “sai” là cách diễn đạt tự nhiên, gọn và phù hợp khi một người giao nhiệm vụ cho các sứ giả.
- source_word: מַלְאָכִים
  choice: các sứ giả
  rationale: Danh từ מַלְאָכִים có thể chỉ thiên sứ hoặc người đưa tin; trong ngữ cảnh Gia-cốp phái người đến gặp Ê-sau, đối tượng là những người làm sứ giả.
- source_word: לְפָנָיו
  choice: đi trước mình
  rationale: Cụm từ này có nghĩa đen là “trước mặt ông”; ở đây diễn tả việc các sứ giả được phái đi trước Gia-cốp.
- source_word: אֶל עֵשָׂו אָחִיו
  choice: đến với Ê-sau, anh mình
  rationale: Giữ thứ tự tên riêng rồi đến quan hệ thân tộc như tiếng Hê-bơ-rơ, đồng thời dùng “anh” theo quan hệ Ê-sau là người anh sinh đôi của Gia-cốp.
- source_word: אַרְצָה שֵׂעִיר
  choice: tại đất Sê-i-rơ
  rationale: Dạng có hậu tố chỉ hướng diễn tả đích đến là đất Sê-i-rơ; trong câu tiếng Việt, “tại” nối tự nhiên địa điểm của Ê-sau với động từ “đến với”.
- source_word: שְׂדֵה אֱדֹם
  choice: miền Ê-đôm
  rationale: Nghĩa đen là “cánh đồng Ê-đôm”, nhưng trong ngữ cảnh đây là một tên gọi địa vực; “miền Ê-đôm” truyền đạt chức năng địa lý mà không gợi nhầm một thửa ruộng cụ thể.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “mình” trong “anh mình” và “đi trước mình” để quy chiếu tự nhiên về Gia-cốp, tránh lặp tên; các địa danh được phiên âm theo lối quen dùng trong tiếng Việt.
