- from: Gia-cốp sai các sứ giả đi trước mình đến với Ê-sau, anh mình, tại đất Sê-i-rơ, miền Ê-đôm.[a]
  to: Gia-cốp sai các sứ giả đi trước mình đến gặp Ê-sau, anh mình, ở đất Sê-i-rơ, miền Ê-đôm.[a]
  rationale: Chỉnh “đến với ... tại” thành “đến gặp ... ở” để tiếng Việt tự nhiên và quan hệ cú pháp rõ hơn, mà vẫn giữ được việc các sứ giả được phái đi trước Gia-cốp đến nơi Ê-sau ở. Không thay đổi nghĩa địa vực của “miền Ê-đôm” hay nội dung chú thích về nghĩa đen của שְׂדֵה.
