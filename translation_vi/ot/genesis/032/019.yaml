base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: vi
  text: 'Rồi ngươi hãy nói: “Đây là quà biếu của Gia-cốp, tôi tớ ngài, gửi đến chủ tôi là Ê-sau; kìa, chính ông ấy cũng ở phía sau chúng tôi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Quà biếu” cũng có thể dịch là “lễ vật” hoặc “cống vật”; cụm cuối cũng có thể dịch: “chính ông ấy cũng đến sau chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Rồi ngươi hãy nói
  rationale: Waw nối tiếp cùng thể hoàn thành mang lực chỉ thị, tiếp tục lời Gia-cốp dặn các đầy tớ; “Rồi… hãy nói” diễn đạt tự nhiên trình tự và sắc thái mệnh lệnh.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: của Gia-cốp, tôi tớ ngài
  rationale: Cụm từ xác định Gia-cốp bằng lối tự xưng khiêm nhường trước Ê-sau; cách dịch sở hữu giữ quan hệ cú pháp với מִנְחָה.
- source_word: מִנְחָה
  choice: lễ vật
  rationale: Trong ngữ cảnh này, từ chỉ món quà nhằm xoa dịu Ê-sau chứ không nhất thiết là của lễ nghi thức. “Lễ vật” giữ sắc thái trang trọng và ý nghĩa biếu tặng; chú thích nêu các khả năng khác.
- source_word: שְׁלוּחָה
  choice: được gửi
  rationale: Phân từ bị động giống cái mô tả lễ vật đã được sai gửi; “được gửi” giữ rõ thể bị động.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: đến chúa tôi, đến Ê-sau
  rationale: Giữ hai cụm giới từ song song và quan hệ đồng vị trong tiếng Hê-bơ-rơ. “Chúa tôi” ở đây là tước xưng xã hội đầy kính trọng, không phải danh xưng thần linh.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: “Kìa” là từ thu hút sự chú ý, trang trọng nhưng vẫn dễ hiểu, tương ứng trực tiếp với dấu hiệu diễn ngôn הִנֵּה.
- source_word: גַם הוּא
  choice: chính ông ấy cũng
  rationale: Giữ cả sắc thái nhấn mạnh vào đại từ הוּא và ý bổ sung của גַם; người được nói đến là Gia-cốp.
- source_word: אַחֲרֵינוּ
  choice: đang ở phía sau chúng tôi
  rationale: Dịch trực tiếp vị trí tương đối; nguyên văn cũng có thể hàm ý chuyển động, tức “đang đến sau chúng tôi”.
theological_decisions:
- issue: Cách hiểu אֲדֹנִי trong lời nói về Ê-sau
  choice: chúa tôi
  alternative: chủ tôi
  rationale: Đây là lời xưng hô xã hội biểu thị sự quy phục và kính trọng đối với Ê-sau, không phải một khẳng định thần học; viết thường để tránh đồng nhất với danh xưng dành cho Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức khiêm nhường “Gia-cốp, tôi tớ ngài,” cách xưng “chúa tôi” với chữ thường, cấu trúc đồng vị “đến chúa tôi, đến Ê-sau,” cùng dấu hiệu chú ý “kìa.”
