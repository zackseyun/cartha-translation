  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: vi
  text: Vậy, món quà đi trước ông[a], còn chính ông thì nghỉ lại đêm ấy trong trại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quà biếu.” Từ Hê-bơ-rơ מִנְחָה có thể chỉ một món quà, cống phẩm hoặc của lễ; ở đây, từ này nói đến món quà Gia-cốp gửi trước cho Ê-sau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: đi trước
  rationale: Động từ עבר ở dạng kể chuyện chỉ sự di chuyển tiếp về phía trước trong mạch văn; kết hợp với עַל־פָּנָיו, “đi trước” diễn đạt tự nhiên hơn “đi qua,” vốn có thể gợi ý việc vượt qua một ranh giới không được nêu trong câu.
- source_word: הַמִּנְחָה
  choice: lễ vật
  rationale: Trong ngữ cảnh này, מִנְחָה là món quà Gia-cốp gửi cho Ê-sau, không phải của lễ dùng trong nghi thức. “Lễ vật” vừa dễ hiểu vừa giữ sắc thái một món quà kính biếu; chú thích nêu phương án “quà biếu.”
- source_word: עַל־פָּנָיו
  choice: trước ông
  rationale: Thành ngữ theo nghĩa đen là “trước mặt ông,” nhưng trong ngữ cảnh chỉ việc lễ vật đi trước Gia-cốp; “trước ông” ngắn gọn và tự nhiên.
- source_word: וְהוּא
  choice: còn chính ông thì
  rationale: Đại từ được nêu rõ để tạo thế tương phản giữa lễ vật đã đi trước và bản thân Gia-cốp ở lại; “còn chính ông thì” thể hiện sự tương phản mà không làm quá mạnh liên từ.
- source_word: לָן
  choice: ở lại
  rationale: Động từ לון/לין có nghĩa nghỉ lại hoặc qua đêm. Vì câu đã có “đêm ấy,” “ở lại” tự nhiên và tránh lặp ý.
- source_word: בַּלַּיְלָה הַהוּא
  choice: đêm ấy
  rationale: Cách diễn đạt thời gian tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: בַּמַּחֲנֶה
  choice: trong trại
  rationale: מַחֲנֶה chỉ nơi đoàn người đóng trại; “trong trại” là cách nói gọn và thông dụng.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. Cấu trúc tương phản “lễ vật… còn chính ông…” giữ trọng tâm của đại từ Hê-bơ-rơ; dấu chú thích [a] xuất hiện ngay sau từ được giải thích.
