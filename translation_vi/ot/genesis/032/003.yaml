    rationale: Ma-ha-na-im (מַחֲנָיִם) là hình thức địa danh trực tiếp liên hệ với מַחֲנֶה, “doanh trại/trại”; chú thích nên nêu đây là nghĩa hoặc lối chơi chữ của tên, đồng thời có thể giữ cách diễn đạt thận trọng “có thể hiểu là” vì sắc thái chính xác của hình thức đối và dụng ý lối chơi chữ vẫn được bàn luận.
