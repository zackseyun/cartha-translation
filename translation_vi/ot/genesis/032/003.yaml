base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: vi
  text: 'Khi Gia-cốp thấy họ, ông nói: “Đây là doanh trại của Đức Chúa Trời.” Vì thế, ông gọi tên nơi ấy là Ma-ha-na-im.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tên Ma-ha-na-im có thể hiểu là “hai doanh trại” hoặc “doanh trại đôi”, gợi lại lời Gia-cốp: “Đây là doanh trại của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ông nói
  rationale: Động từ tường thuật lời nói được chuyển dịch trực tiếp, không thêm ý “tự nhủ” hay sắc thái cảm thán vốn không được nêu rõ trong nguyên văn.
- source_word: כַּאֲשֶׁר
  choice: Khi
  rationale: Liên từ diễn tả hoàn cảnh hoặc thời điểm Gia-cốp phản ứng sau khi nhìn thấy các thiên sứ; “Khi” tự nhiên trong tiếng Việt và giữ được quan hệ thời gian.
- source_word: רָאָם
  choice: thấy họ
  rationale: Hậu tố ngôi thứ ba số nhiều giống đực quy chiếu về các thiên sứ của Đức Chúa Trời ở câu trước; “họ” giữ đúng số nhiều và không lặp lại danh từ ngoài nguyên văn câu này.
- source_word: מַחֲנֵה
  choice: doanh trại
  rationale: Danh từ chỉ trại hoặc nơi đóng quân. “Doanh trại” vừa rõ nghĩa trong tiếng Việt hiện đại vừa giữ liên hệ từ vựng với địa danh Ma-ha-na-im.
- source_word: אֱלֹהִים
  choice: của Đức Chúa Trời
  rationale: Trong cấu trúc sở hữu này, אֱלֹהִים chỉ Đức Chúa Trời; cách diễn đạt bằng “của” tự nhiên và sát cấu trúc “doanh trại của Đức Chúa Trời”.
- source_word: זֶה
  choice: Đây là
  rationale: Đại từ chỉ định làm vị ngữ; tiếng Việt cần “là” để câu tuyên bố rõ ràng và tự nhiên.
- source_word: וַיִּקְרָא שֵׁם
  choice: ông gọi tên
  rationale: Giữ được thành ngữ Hê-bơ-rơ “gọi tên” trong lối văn trang trọng nhưng vẫn dễ hiểu, thay vì giản lược hoàn toàn thành “đặt tên”.
- source_word: הַמָּקוֹם הַהוּא
  choice: nơi ấy
  rationale: Diễn đạt tự nhiên đại từ chỉ định của cụm từ Hê-bơ-rơ, chỉ chính địa điểm Gia-cốp vừa gặp.
- source_word: מַחֲנָיִם
  choice: Ma-ha-na-im
  rationale: Giữ địa danh bằng hình thức phiên âm dễ đọc trong tiếng Việt; ý nghĩa gợi đến “hai doanh trại” được trình bày trong chú thích để bảo tồn lối chơi chữ.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ đại từ “họ” để quy chiếu về các thiên sứ trong câu trước, đồng thời đặt dấu chú thích ngay sau địa danh vì chú thích giải thích lối chơi chữ của Ma-ha-na-im.
