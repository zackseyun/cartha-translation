  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ngài” trong lời kể và “Ta/con” trong lời trích dẫn giữ sắc thái tôn kính cùng quan hệ giao ước, không thêm cách diễn giải hệ phái.
