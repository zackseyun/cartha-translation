  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: vi
  text: 'Nhưng chính Ngài đã phán: “Ta nhất định sẽ làm điều tốt lành cho con[a], và sẽ khiến dòng dõi con[b] đông như cát biển, nhiều đến nỗi không thể đếm được[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta chắc chắn sẽ ban điều tốt lành cho con.” Tiếng Hê-bơ-rơ dùng động từ nguyên thể tuyệt đối cùng với động từ đã chia để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ ở đây là danh từ số ít mang nghĩa tập hợp, cũng có thể dịch là “con cháu con” hoặc “hậu duệ con”.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “không thể kể xiết”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Nhưng chính Ngài
  rationale: Liên từ đi với đại từ độc lập tạo sắc thái nhấn mạnh và tương phản giữa lời Đức Chúa Trời đã hứa với hiểm nguy hiện tại; “Nhưng chính Ngài” diễn đạt tự nhiên sức nhấn ấy trong lời cầu nguyện.
- source_word: הֵיטֵב אֵיטִיב
  choice: Ta nhất định sẽ làm điều tốt lành cho con
  rationale: Động từ nguyên thể tuyệt đối đi với động từ đã chia nhằm tăng cường mức độ chắc chắn. “Nhất định” giữ được sức nhấn, còn “làm điều tốt lành cho con” không thu hẹp ý nghĩa vào sự thịnh vượng vật chất.
- source_word: וְשַׂמְתִּי
  choice: và sẽ khiến
  rationale: Trong ngữ cảnh làm cho dòng dõi trở nên vô số, שׂים mang nghĩa tác động “khiến/làm cho”, thay vì nghĩa đen cứng nhắc “đặt”.
- source_word: זַרְעֲךָ
  choice: dòng dõi con
  rationale: זֶרַע là danh từ số ít mang nghĩa tập hợp. “Dòng dõi” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và giữ ý nghĩa chỉ toàn thể hậu duệ.
- source_word: כְּחוֹל הַיָּם
  choice: đông như cát biển
  rationale: Phép so sánh nói đến số lượng vô kể. Thêm “đông” làm rõ phương diện so sánh vốn được ngữ cảnh và mệnh đề kế tiếp xác định, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: nhiều đến nỗi không thể đếm được
  rationale: Thể Niphal diễn tả điều không thể đếm trong thực tế, còn מֵרֹב nêu nguyên nhân là số lượng quá nhiều. Cách dịch này kết hợp tự nhiên cả hai ý.
theological_decisions: []
