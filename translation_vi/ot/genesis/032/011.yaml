revisions:
- from: Con không xứng đáng với mọi tình yêu bền vững và mọi sự thành tín mà Ngài đã dành cho đầy tớ Ngài[a]. Trước đây, khi vượt qua sông Giô-đanh này, con chỉ có cây gậy trong tay[b]; còn bây giờ, con đã thành hai trại[c].
  to: Con không xứng đáng với mọi tình yêu bền vững và mọi sự thành tín mà Ngài đã dành cho đầy tớ Ngài[a], vì con đã vượt qua sông Giô-đanh này với cây gậy của con[b]; còn bây giờ, con đã thành hai trại[c].
  rationale: Bỏ “chỉ có” để không thêm một giới hạn không được diễn đạt trong tiếng Hê-bơ-rơ. Dùng “vì” phản ánh chức năng giải thích của כִּי, và điều chỉnh chú thích về “hai trại” để giải thích hoán dụ mà không khẳng định một chi tiết cụ thể về việc chia trại.
