  naturalness: Cách xưng hô “con–Ngài” trang trọng, hiện đại và thích hợp cho lời cầu nguyện. Sửa “Trước đây, khi...” thành cấu trúc nhân quả gần nguyên văn hơn cũng làm mạch câu rõ ràng mà không thêm thông tin thời gian.
