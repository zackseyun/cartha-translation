  text: קָטֹ֜נְתִּי מִ/כֹּ֤ל הַ/חֲסָדִים֙ וּ/מִ/כָּל הָ֣/אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת עַבְדֶּ֑/ךָ כִּ֣י בְ/מַקְלִ֗/י עָבַ֨רְתִּי֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה וְ/עַתָּ֥ה הָיִ֖יתִי לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: vi
  text: Con không xứng đáng với mọi tình yêu bền vững và mọi sự thành tín mà Ngài đã dành cho đầy tớ Ngài[a], vì con đã vượt qua sông Giô-đanh này với cây gậy của con[b]; còn bây giờ, con đã thành hai trại[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Con thật quá nhỏ bé trước mọi tình yêu bền vững và mọi sự thành tín.” Nguyên văn Hê-bơ-rơ nói “con nhỏ bé hơn mọi…”, một thành ngữ diễn tả sự khiêm nhường trước lòng rộng rãi của Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “với cây gậy của con”.'
    reason: literal_rendering
  - marker: c
    text: Cách nói này diễn tả rằng Gia-cốp, cùng đoàn người và tài sản thuộc về mình, nay là hai trại.
    reason: idiom_clarification
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: Con không xứng đáng
  rationale: Động từ có nghĩa đen là “con nhỏ bé” hoặc “con đã trở nên nhỏ bé”; trong lời cầu nguyện này, đó là cách khiêm nhường thừa nhận mình không xứng với những ân huệ Đức Chúa Trời ban.
- source_word: הַחֲסָדִים
  choice: mọi tình yêu bền vững
  rationale: חסד chỉ tình yêu nhân từ, trung kiên được thể hiện trong hành động. “Mọi” chuyển tải sức nặng của dạng số nhiều mà không làm câu tiếng Việt nặng nề.
- source_word: הָאֱמֶת
  choice: mọi sự thành tín
  rationale: Khi đi đôi với חסד, אמת thiên về tính đáng tin cậy và thành tín trong mối quan hệ hơn là chân lý trừu tượng.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: Ngài đã dành cho đầy tớ Ngài
  rationale: Nghĩa đen là “Ngài đã làm với/cho đầy tớ Ngài”; “đã dành cho” là cách diễn đạt tự nhiên khi đối tượng là tình yêu bền vững và sự thành tín.
- source_word: בְמַקְלִי
  choice: chỉ có cây gậy trong tay
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “với cây gậy của con”. Từ “chỉ” làm rõ sự tương phản hiển nhiên giữa cảnh nghèo khó trước kia và hai trại hiện nay; chú thích giữ lại cách dịch sát chữ.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: khi vượt qua sông Giô-đanh này
  rationale: Giữ đại từ chỉ định “này” và diễn đạt hành động đã qua một cách tự nhiên trong tiếng Việt.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: con đã thành hai trại
  rationale: Giữ hình ảnh cụ thể “hai trại” và cách nói hoán dụ của nguyên văn, trong đó Gia-cốp đại diện cho cả đoàn người và tài sản đi với mình.
theological_decisions:
- issue: Cách dịch cặp חסד và אמת nói về cách Đức Chúa Trời đối đãi với Gia-cốp
  choice: tình yêu bền vững và sự thành tín
  alternative: lòng nhân từ và sự chân thật
  rationale: 'Cách dịch đã chọn giữ hai khái niệm riêng biệt: tình yêu trung kiên được thể hiện trong hành động và sự đáng tin cậy của Đức Chúa Trời. Nó không thu hẹp חסד thành cảm xúc đơn thuần, cũng không biến אמת thành chân lý trừu tượng.'
- issue: Sắc thái tự hạ trong קָטֹנְתִּי
  choice: không xứng đáng
  alternative: nhỏ bé hơn tất cả
  rationale: “Không xứng đáng” truyền đạt tự nhiên ý Gia-cốp tự hạ trước sự rộng rãi của Đức Chúa Trời, nhưng chú thích bảo tồn hình thức và độ mở của thành ngữ Hê-bơ-rơ.
translation_notes:
  register: Văn phong cầu nguyện trang trọng nhưng hiện đại; dùng “con–Ngài” để thể hiện lời Gia-cốp thưa với Đức Chúa Trời. Câu được tách làm hai để dễ đọc, đồng thời vẫn giữ quan hệ giải thích và sự tương phản của nguyên văn. Tên địa danh dùng dạng quen thuộc “Giô-đanh”.
