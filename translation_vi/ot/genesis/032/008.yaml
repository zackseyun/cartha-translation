source:
  edition: WLC
  text: וַ/יִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַ/יֵּ֣צֶר ל֑/וֹ וַ/יַּ֜חַץ אֶת הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ וְ/אֶת הַ/צֹּ֧אן וְ/אֶת הַ/בָּקָ֛ר וְ/הַ/גְּמַלִּ֖ים לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: vi
  text: Bấy giờ, Gia-cốp vô cùng sợ hãi và lo âu. Ông chia những người đi cùng mình, các bầy chiên dê, các đàn bò và lạc đà thành hai trại[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hai đoàn”. Từ Hê-bơ-rơ có thể chỉ một trại hoặc một đoàn người được tổ chức thành nhóm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא ... מְאֹד
  choice: vô cùng sợ hãi
  rationale: Động từ ירא diễn tả sự sợ hãi, còn מְאֹד nhấn mạnh mức độ; cách dịch này tự nhiên trong tiếng Việt và giữ nguyên cường độ của nguyên văn.
- source_word: וַיֵּצֶר לוֹ
  choice: và lo âu
  rationale: Thành ngữ này diễn tả tình trạng bị dồn ép, khốn quẫn hay đau buồn trong lòng. “Lo âu” phù hợp với phản ứng nội tâm của Gia-cốp mà không đồng nhất nó với sự sợ hãi đã nói trước đó.
- source_word: וַיַּחַץ
  choice: ông chia
  rationale: חצה có nghĩa là chia hoặc tách ra; “chia” diễn đạt rõ hành động có chủ ý của Gia-cốp.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: những người đi cùng mình
  rationale: עָם ở đây chỉ đoàn người ở với Gia-cốp, không phải một dân tộc theo nghĩa rộng. Đại từ “mình” tự nhiên trong mạch kể tiếng Việt và quy chiếu rõ về Gia-cốp.
- source_word: הַצֹּאן
  choice: các bầy chiên dê
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, nhất là chiên và dê; dịch cụ thể giúp độc giả hiện đại hiểu đúng phạm vi.
- source_word: הַבָּקָר
  choice: các đàn bò
  rationale: בָּקָר chỉ bò nuôi theo nghĩa tập hợp; “các đàn bò” vừa chính xác vừa song song tự nhiên với “các bầy chiên dê”.
- source_word: הַגְּמַלִּים
  choice: lạc đà
  rationale: Cách dịch trực tiếp của danh từ số nhiều גְּמַלִּים; tiếng Việt có thể dùng danh từ không biến đổi số sau một chuỗi liệt kê.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: thành hai trại
  rationale: מַחֲנֶה có thể chỉ nơi đóng trại hoặc đoàn người được tổ chức thành một nhóm. “Hai trại” ngắn gọn và duy trì thuật ngữ của mạch truyện, còn nghĩa thay thế được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Câu Hê-bơ-rơ dài được tách thành hai câu tiếng Việt để rõ nghĩa; phép liệt kê vẫn giữ các nhóm người và gia súc ngang hàng. Dấu chú thích được đặt ngay sau “hai trại”, là từ mà chú thích giải thích.
