  text: וַֽ/יְהִי לִ/י֙ שׁ֣וֹר וַ/חֲמ֔וֹר צֹ֖אן וְ/עֶ֣בֶד וְ/שִׁפְחָ֑ה וָֽ/אֶשְׁלְחָ/ה֙ לְ/הַגִּ֣יד לַֽ/אדֹנִ֔/י לִ/מְצֹא חֵ֖ן בְּ/עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: vi
  text: Tôi có bò, lừa, các bầy chiên dê, người hầu nam và người hầu nữ[a]. Tôi đã sai người đến báo cho chủ tôi biết, để tôi được ân huệ trước mắt ngài.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nô lệ nam và nô lệ nữ.” Các từ Hê-bơ-rơ chỉ những người phục dịch lệ thuộc trong gia hộ và có thể mang nghĩa “nô lệ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: Ta có
  rationale: Thành ngữ היה + ל diễn tả sự sở hữu; hiện tại đơn truyền đạt tự nhiên những gì Gia-cốp đang có. Đại từ “Ta” phù hợp lời nhắn trang trọng trong bối cảnh cổ.
- source_word: שׁוֹר וַחֲמוֹר
  choice: bò, lừa
  rationale: Hai danh từ số ít mang nghĩa tập hợp trong bản liệt kê tài sản; tiếng Việt có thể giữ dạng không đánh dấu số mà vẫn tự nhiên.
- source_word: צֹאן
  choice: các bầy chiên dê
  rationale: Danh từ tập hợp này chỉ gia súc nhỏ, chủ yếu là chiên và dê. Cách dịch nêu rõ phạm vi nghĩa mà không giới hạn vào riêng chiên.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: tôi trai và tớ gái
  rationale: Cặp từ phân biệt nam và nữ, có thể chỉ những người phục dịch lệ thuộc trong gia hộ. “Tôi trai và tớ gái” giữ sự phân biệt ấy và sắc thái xã hội cổ; chú thích nêu khả năng dịch mạnh hơn là nô lệ.
- source_word: וָאֶשְׁלְחָה לְהַגִּיד
  choice: Ta sai người báo cho ... biết
  rationale: Động từ ở ngôi thứ nhất nói về hành động vừa thực hiện; trong ngữ cảnh, đối tượng được sai đi là các sứ giả. Cách nói tiếng Việt tự nhiên truyền đạt mục đích thông báo.
- source_word: לַאדֹנִי
  choice: cho chúa tôi
  rationale: Đây là cách Gia-cốp kính cẩn gọi Ê-sau, không phải tước hiệu thần linh. “Chúa tôi” bảo tồn sắc thái hạ mình và tương ứng với cách xưng “tôi tớ” ở văn mạch.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: để được ơn trước mắt người
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ “tìm được ơn trong mắt,” đồng thời diễn đạt tự nhiên mục đích mong được đối phương đoái nhận.
theological_decisions:
- issue: Địa vị của עֶבֶד / שִׁפְחָה trong danh mục gia sản
  choice: tôi trai và tớ gái
  alternative: nô lệ nam và nô lệ nữ
  rationale: Văn cảnh xếp họ trong gia sản của Gia-cốp và vì thế hàm ý thân phận lệ thuộc, nhưng hai từ Hê-bơ-rơ có dải nghĩa gồm cả tôi tớ và nô lệ. Bản chính không quyết đoán quá mức về địa vị pháp lý; chú thích bảo tồn cách hiểu mạnh hơn.
- issue: Danh xưng אֲדֹנִי dành cho Ê-sau
  choice: chúa tôi
  alternative: chủ tôi
  rationale: Danh xưng ở đây biểu thị sự kính cẩn đối với một người, không đồng nhất Ê-sau với Đức Chúa Trời. Cách viết thường và văn cảnh làm rõ điều đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có sắc thái lời nhắn trong bối cảnh cổ. Dùng “Ta / chúa tôi / người” để giữ thế hạ mình có chủ ý của Gia-cốp trước Ê-sau; tránh từ quá cổ ngoài các danh xưng cần thiết. Dấu ngoặc kép kết thúc lời nhắn được giữ theo văn cảnh trích dẫn của câu.
