  text: וַ/יִּתֵּן֙ בְּ/יַד עֲבָדָ֔י/ו עֵ֥דֶר עֵ֖דֶר לְ/בַדּ֑/וֹ וַ֤/יֹּאמֶר אֶל עֲבָדָי/ו֙ עִבְר֣וּ לְ/פָנַ֔/י וְ/רֶ֣וַח תָּשִׂ֔ימוּ בֵּ֥ין עֵ֖דֶר וּ/בֵ֥ין עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: vi
  text: 'Ông giao từng đàn riêng biệt vào tay các đầy tớ của mình[a][b], rồi nói với các đầy tớ: “Hãy đi trước ta và để một khoảng cách giữa đàn này với đàn kia[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “vào tay các đầy tớ của mình”, một thành ngữ chỉ việc giao cho họ quản lý.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ lặp lại từ “đàn”, nhấn mạnh rằng mỗi đàn được sắp riêng, hết đàn này đến đàn khác.
    reason: source_clarification
  - marker: c
    text: 'Cũng có thể dịch: “đặt một quãng giữa đàn này với đàn kia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד
  choice: giao ... vào tay
  rationale: Cách dịch này vừa giữ hình ảnh cụ thể “vào tay” của tiếng Hê-bơ-rơ, vừa diễn đạt thành ngữ chỉ việc trao cho các đầy tớ quản lý và điều khiển.
- source_word: עֲבָדָיו
  choice: các đầy tớ mình
  rationale: Trong ngữ cảnh này, từ עבד chỉ những người thuộc nhà Gia-cốp đang thi hành chỉ thị; “đầy tớ” phù hợp hơn “nô lệ” vì địa vị pháp lý của họ không phải trọng tâm câu chuyện.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: từng đàn riêng biệt
  rationale: Lối lặp עֵדֶר עֵדֶר mang ý phân phối, nghĩa là hết đàn này đến đàn khác, mỗi đàn tách riêng; “từng đàn riêng biệt” diễn đạt tự nhiên và đầy đủ sắc thái ấy.
- source_word: עִבְרוּ לְפָנַי
  choice: Hãy đi trước ta
  rationale: עבר có nghĩa cơ bản là đi qua hoặc vượt qua; trong hành trình này, mệnh lệnh yêu cầu các đầy tớ tiến lên phía trước Gia-cốp, nên “đi trước ta” rõ nghĩa mà không áp đặt một địa điểm phải băng qua.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: chừa một khoảng cách
  rationale: רֶוַח là khoảng trống hay quãng cách; kết hợp với שׂים, cách nói tự nhiên trong tiếng Việt là “chừa một khoảng cách”.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: giữa đàn này với đàn kia
  rationale: Cách diễn đạt này chuyển tải rõ ý phân cách liên tiếp của cấu trúc Hê-bơ-rơ lặp lại “giữa đàn và giữa đàn”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” theo mạch kể chuyện chỉ Gia-cốp; trong lời ông nói với các đầy tớ, “ta” thể hiện quan hệ chủ–tớ của bối cảnh cổ đại mà không thêm hàm ý thần học. Câu giữ lại hình ảnh “vào tay” nhưng có chú thích giải thích thành ngữ.
