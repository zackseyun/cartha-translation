  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: Gia-cốp giao mỗi đàn tách riêng cho các đầy tớ, truyền họ đi trước ông và tạo khoảng cách giữa các đàn. “Vào tay” bảo lưu hình ảnh của בְּיַד, còn chú thích giải thích đúng giá trị thành ngữ. Cấu trúc phân phối עֵדֶר עֵדֶר לְבַדּוֹ được phản ánh bằng “từng đàn riêng biệt”.'
  naturalness: Câu nhìn chung tự nhiên và có văn phong trang trọng. Tuy nhiên, “các đầy tớ mình” kém tự nhiên hơn cách dùng hiện đại chuẩn “các đầy tớ của mình”. “Để một khoảng cách” trung tính và sát với động từ “đặt” hơn “chừa một khoảng cách”.
  terminology: “Đầy tớ” phù hợp với ngữ cảnh tường thuật và không khẳng định quá mức địa vị pháp lý của עֲבָדָיו. Đại từ “ông/ta” nhất quán với lời kể về Gia-cốp và mệnh lệnh của một chủ gia đình. Không có vấn đề về thuật ngữ thần học hay tên riêng trong câu này.
