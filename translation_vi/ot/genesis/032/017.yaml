  - severity: low
    issue: “Chừa một khoảng cách” có thể hơi khẩu ngữ và thiên về ý để lại hơn là đặt ra một khoảng trống.
    rationale: “Để một khoảng cách” là cách nói trung tính, tự nhiên trong văn xuôi trang trọng, và phản ánh trực tiếp שׂים (“đặt/để”).
