id: GEN.32.29
reference: Genesis 32:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: vi
  text: 'Người ấy nói: “Tên ngươi sẽ không còn được gọi là Gia-cốp nữa, mà là Y-sơ-ra-ên, vì ngươi đã tranh đấu với Đức Chúa Trời[a] và với người ta[b], và đã thắng thế.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các hữu thể thần linh”; từ Hê-bơ-rơ אֱלֹהִים trong những ngữ cảnh khác nhau có thể chỉ Đức Chúa Trời, các thần hoặc các hữu thể trên trời. Ở đây, bản chính dùng “Đức Chúa Trời” theo mạch truyện.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “loài người” hoặc “những người nam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: được gọi
  rationale: Thể bị động của אמר trong công thức đặt tên được diễn đạt tự nhiên và chính xác bằng “được gọi”.
- source_word: עוֹד
  choice: không còn ... nữa
  rationale: Trong ngữ cảnh đổi tên, từ này cho biết tên cũ sẽ không còn là cách gọi người ấy.
- source_word: כִּי אִם
  choice: mà là
  rationale: Cụm này tạo thế tương phản trong công thức “không phải X, mà là Y”.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Giữ tên riêng theo dạng phiên âm quen thuộc trong tiếng Việt; mệnh đề tiếp theo bảo tồn lối chơi chữ giải thích tên.
- source_word: שָׂרִיתָ
  choice: đã tranh đấu
  rationale: Động từ שרה mang nghĩa tranh đấu hoặc vật lộn và gợi âm với tên Y-sơ-ra-ên; “tranh đấu” vừa trang trọng vừa không giới hạn ý nghĩa vào một cuộc vật lộn thể chất.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh trình thuật, cách hiểu số ít chỉ Đức Chúa Trời phù hợp nhất, nhưng khả năng chỉ các hữu thể thần linh được giữ trong chú thích.
- source_word: אֲנָשִׁים
  choice: người ta
  rationale: Danh từ số nhiều chỉ con người; “người ta” là cách diễn đạt tự nhiên trong tiếng Việt và giữ sự đối chiếu với Đức Chúa Trời.
- source_word: וַתּוּכָל
  choice: và đã thắng thế
  rationale: Trong ngữ cảnh cuộc tranh đấu, יכל chỉ kết quả thành công; “thắng thế” bảo tồn ý vượt qua hoặc chiếm ưu thế mà không hàm ý tiêu diệt hoàn toàn.
theological_decisions:
- issue: Đối tượng được chỉ bởi אֱלֹהִים trong lời giải thích tên
  choice: Đức Chúa Trời
  alternative: các hữu thể thần linh; các thần
  rationale: Mạch truyện trình bày cuộc vật lộn bí ẩn như một cuộc gặp gỡ với Đức Chúa Trời. Bản chính giữ cách hiểu này, còn chú thích bảo tồn độ mở từ vựng và sự bí ẩn về căn tính của nhân vật.
- issue: Cách diễn đạt אֲנָשִׁים
  choice: người ta
  alternative: loài người; những người nam
  rationale: Tiếng Việt không cần đánh dấu giống trong danh từ này. “Người ta” truyền đạt tự nhiên nghĩa số nhiều chỉ con người và duy trì phép đối chiếu giữa Đức Chúa Trời với con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phù hợp với lời tuyên bố trực tiếp mang sắc thái long trọng; “Người ấy” giữ sự kín đáo của chủ thể trong câu Hê-bơ-rơ và không tự ý xác định căn tính nhân vật.
