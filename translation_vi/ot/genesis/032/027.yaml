  source_fidelity: 'Bản dịch chuyển tải chính xác cấu trúc đối thoại và ý nghĩa của nguyên văn Hê-bơ-rơ: lời yêu cầu được thả đi, lý do bình minh đã ló rạng, lời từ chối dứt khoát, và điều kiện phải được ban phước. “Trừ khi” diễn đạt tự nhiên chức năng điều kiện-ngoại lệ của כִּי אִם. Cách gọi trung tính “Người ấy/người kia” không xác định danh tính mà nguyên văn câu không nêu.'
