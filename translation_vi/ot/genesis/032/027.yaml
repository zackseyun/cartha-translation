id: GEN.32.27
reference: Genesis 32:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: vi
  text: 'Người ấy nói[a]: “Hãy để tôi đi, vì bình minh đã ló rạng[b].” Nhưng người kia nói[c]: “Tôi sẽ không để ông đi, trừ khi ông ban phước cho tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy thả tôi ra” hoặc “Hãy buông tôi ra.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “vì trời đang sáng.”'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hê-bơ-rơ không nêu rõ danh tính của hai người nói trong câu này; danh tính của họ được suy ra từ mạch truyện xung quanh.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Hãy để tôi đi
  rationale: Mệnh lệnh của שׁלח với hậu tố ngôi thứ nhất số ít có nghĩa là “thả/để tôi đi”. Trong bối cảnh vật lộn, cách nói này tự nhiên và vẫn giữ được sắc thái yêu cầu được buông ra.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: vì bình minh đã ló rạng
  rationale: Giữ quan hệ nguyên nhân của כִּי và hình ảnh bình minh đi lên của עָלָה; “ló rạng” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: Tôi sẽ không để ông đi
  rationale: Thể chưa hoàn thành có phủ định diễn tả lời từ chối dứt khoát. Lặp lại “để ... đi” bảo toàn sự liên kết từ vựng với lời nói trước.
- source_word: כִּי אִם
  choice: trừ khi
  rationale: Cụm tiểu từ nêu ngoại lệ mang tính điều kiện; “trừ khi” là tương đương ngắn gọn, tự nhiên.
- source_word: בֵּרַכְתָּנִי
  choice: ông ban phước cho tôi
  rationale: Dạng hoàn thành sau כִּי אִם chỉ hành động phải được thực hiện trước khi người nói chịu buông; tiếng Việt diễn đạt tự nhiên bằng mệnh đề điều kiện không đánh dấu thì.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Người ấy nói ... Nhưng người kia nói
  rationale: Nguyên văn không nêu danh tính hai chủ thể. “Người ấy/người kia” giúp người đọc theo dõi sự đổi lượt nói mà không gán tên hay bản tính cho họ; “nhưng” thể hiện sự đối đáp tương phản trong ngữ cảnh.
theological_decisions:
- issue: Danh tính của hai người nói
  choice: Không gọi đích danh là Gia-cốp, người đàn ông, thiên sứ hay Đức Chúa Trời; dùng “người ấy” và “người kia”.
  alternative: Xác định người nói thứ nhất là người đàn ông/thiên sứ và người thứ hai là Gia-cốp, hoặc xác định Đức Chúa Trời đang nói.
  rationale: Tiếng Hê-bơ-rơ chỉ dùng hai động từ ngôi thứ ba giống đực số ít, không nêu rõ chủ thể. Bản dịch giữ sự mơ hồ của câu, đồng thời phân biệt hai lượt lời bằng cách diễn đạt tự nhiên trong tiếng Việt.
- issue: Ý nghĩa của hành động ban phước
  choice: Dịch trực tiếp là “ban phước”, không giải thích người ban phước mang địa vị hay bản tính nào.
  alternative: Diễn giải lời xin này như sự công nhận rõ ràng rằng đối thủ là Đức Chúa Trời hoặc thiên sứ.
  rationale: Động từ ברך nêu yêu cầu được ban phước, nhưng riêng câu này không trực tiếp xác định thần tính hay địa vị của người được yêu cầu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “tôi/ông” phù hợp với cuộc đối thoại giữa hai người nam trưởng thành, không tự thêm quan hệ quyền bậc. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
