base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/032.yaml
  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: vi
  text: Mặt trời mọc lên cho ông khi ông đi qua Pơ-nu-ên[a], và ông đi khập khiễng vì đùi mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên địa danh trong tiếng Hê-bơ-rơ ở đây được viết là Pơ-nu-ên; tại những chỗ khác cũng có dạng Pê-ni-ên.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “trên đùi mình.” Trong ngữ cảnh, giới từ này có thể chỉ nguyên nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: Mặt trời mọc trên ông
  rationale: 'Giữ hình ảnh và góc nhìn của tiếng Hê-bơ-rơ: mặt trời mọc/chiếu trên Gia-cốp.'
- source_word: כַּאֲשֶׁר עָבַר
  choice: khi ông đi qua
  rationale: Diễn đạt tự nhiên quan hệ thời gian; עָבַר ở đây có nghĩa đi qua địa điểm.
- source_word: פְּנוּאֵל
  choice: Pơ-nu-ên
  rationale: Phiên âm dạng địa danh Penuel đúng như cách viết trong câu này, không đồng nhất hóa với dạng Peniel ở nơi khác.
- source_word: וְהוּא צֹלֵעַ
  choice: và ông bước đi khập khiễng
  rationale: Phân từ diễn tả trạng thái/hành động đang tiếp diễn; cách nói này tự nhiên và rõ trong tiếng Việt.
- source_word: עַל יְרֵכוֹ
  choice: vì đùi mình
  rationale: עַל có thể biểu thị nguyên nhân trong ngữ cảnh; יָרֵךְ theo nghĩa trực tiếp là đùi/phần chân trên. Cách dịch tránh cụm tiếng Việt thiếu tự nhiên 'khập khiễng trên đùi' nhưng không đưa 'khớp háng' từ câu trước vào.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để chỉ Gia-cốp theo mạch văn. “Vì đùi mình” bảo toàn từ chỉ bộ phận cơ thể của nguyên văn, còn chú thích ghi nhận cấu trúc sát chữ và tính đa nghĩa của giới từ.
