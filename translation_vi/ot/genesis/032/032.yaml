  to: Mặt trời mọc lên cho ông khi ông đi qua Pơ-nu-ên[a], và ông đi khập khiễng vì đùi mình[b].
  rationale: 'Sửa hai chỗ vì độ tự nhiên tiếng Việt, không thay đổi nghĩa: thay “trên ông” bằng “lên cho ông” để diễn đạt לוֹ theo lối tiếng Việt rõ ràng hơn; rút “bước đi khập khiễng” thành “đi khập khiễng.” Giữ “vì đùi mình” kèm chú thích để vừa truyền đạt quan hệ ngữ cảnh, vừa ghi nhận cách đọc sát chữ của עַל יְרֵכוֹ.'
  reviewer_model: gpt-5.6-terra
