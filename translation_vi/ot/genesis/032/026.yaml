  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔/וֹ וַ/יִּגַּ֖ע בְּ/כַף יְרֵכ֑/וֹ וַ/תֵּ֨קַע֙ כַּף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/הֵֽאָבְק֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: vi
  text: Khi thấy mình không thể thắng nổi ông[a], người ấy chạm vào khớp háng của ông[b][c]; và khớp háng của Gia-cốp bị trật trong lúc ông vật lộn với người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mình không chế ngự được ông.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “hõm (hoặc ổ khớp) của đùi”; theo truyền thống: “hõm đùi.”'
    reason: lexical_alternative
  - marker: c
    text: Các đại từ trong tiếng Hê-bơ-rơ vẫn mơ hồ; câu này không nói lại rõ danh tính đối thủ của Gia-cốp.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Khi thấy
  rationale: Diễn đạt tự nhiên quan hệ thời gian của mạch kể bằng waw liên tiếp, đồng thời không nêu rõ chủ thể hơn nguyên văn.
- source_word: לֹא יָכֹל לוֹ
  choice: mình không thắng nổi người kia
  rationale: יכל + ל diễn tả không thể chiếm ưu thế trước đối thủ; “không thắng nổi” phù hợp ngữ cảnh vật lộn mà không hàm ý bất lực tuyệt đối.
- source_word: וַיִּגַּע
  choice: chạm vào
  rationale: Giữ nghĩa thông thường và nhẹ của נגע, dù kết quả của cái chạm rất mạnh.
- source_word: בְּכַף יְרֵכוֹ
  choice: hõm khớp đùi của người kia
  rationale: כף ירך chỉ vùng hõm/ổ khớp nơi đùi nối với hông. Cách diễn đạt này giữ hình ảnh giải phẫu của tiếng Hê-bơ-rơ và tránh tùy tiện đồng nhất đại từ với Gia-cốp ngay ở lần xuất hiện đầu.
- source_word: וַתֵּקַע
  choice: bị trật
  rationale: Trong ngữ cảnh này, động từ chỉ khớp bị bật hoặc lệch khỏi vị trí; “bị trật” rõ ràng, tự nhiên trong tiếng Việt.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: hõm khớp đùi của Gia-cốp
  rationale: Giữ nhất quán với cụm từ trước và bảo toàn việc nguyên văn nêu đích danh Gia-cốp ở mệnh đề này.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: trong lúc ông vật lộn với người ấy
  rationale: Diễn đạt hành động đồng thời của cấu trúc nguyên mẫu với בְּ; các cách gọi “ông/người ấy” không xác định danh tính đối thủ.
theological_decisions:
- issue: Đối tượng quy chiếu của các đại từ trong cảnh vật lộn
  choice: Không gọi đối thủ là người, thiên sứ hay Đức Chúa Trời; dùng các cách gọi trung tính và kèm chú thích về tính mơ hồ.
  alternative: Nêu rõ người chạm vào Gia-cốp là nhân vật đối thủ, thiên sứ hoặc Đức Chúa Trời.
  rationale: Câu Hê-bơ-rơ chỉ dùng đại từ và không nhắc lại danh tính đối thủ. Bản dịch không nên giải quyết trước sự căng thẳng thần học mà trình thuật sẽ dần làm sáng tỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Gia-cốp” theo dạng tên quen thuộc trong tiếng Việt. Cụm “hõm khớp đùi” ưu tiên độ sát nguyên ngữ; hệ thống “mình/người kia/người ấy” nhằm giữ tính mơ hồ thật sự của đại từ mà vẫn giúp câu tiếng Việt đọc tự nhiên.
