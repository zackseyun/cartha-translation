  to: Khi thấy mình không thể thắng nổi ông[a], người ấy chạm vào khớp háng của ông[b][c]; và khớp háng của Gia-cốp bị trật trong lúc ông vật lộn với người ấy.
  rationale: Bản sửa dùng “ông/người ấy” để bảo toàn tính không nêu đích danh của các đại từ trong câu, nhưng tránh việc gọi cùng một người bị chạm là “người kia” rồi xác định là Gia-cốp ở mệnh đề kế tiếp. “Khớp háng” là cách diễn đạt hiện đại, tự nhiên cho vùng khớp được nói đến, và chú thích bảo lưu các khả năng sát chữ hơn.
