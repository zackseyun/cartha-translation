    rationale: Câu “người ấy chạm vào hõm khớp đùi của người kia” tự nhiên được hiểu là người ấy chạm vào đùi đối thủ. Nhưng ngay sau đó nguyên văn nói rõ khớp đùi của Gia-cốp bị trật. Thay bằng “ông” vẫn giữ tính mơ hồ của đại từ tiếng Hê-bơ-rơ trong diễn ngôn, đồng thời cho phép độc giả nhận ra qua mệnh đề sau rằng người bị chạm là Gia-cốp.
  - severity: low
    issue: “Hõm khớp đùi” thiếu tự nhiên
    rationale: Cụm này không thông dụng trong tiếng Việt hiện đại và làm mờ nghĩa chấn thương khớp. “Khớp háng” là thuật ngữ tự nhiên hơn, còn sắc thái “hõm/ổ khớp” có thể được bảo lưu trong chú thích.
