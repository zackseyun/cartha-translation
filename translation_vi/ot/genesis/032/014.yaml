  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: vi
  text: 'Gia-cốp nghỉ lại tại đó trong đêm ấy. Ông lấy trong số những gì mình có sẵn[a] một món quà tặng cho Ê-sau, anh mình:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát chữ: “từ những gì đến trong tay ông”; thành ngữ này chỉ những gì ông có sẵn hoặc có trong tay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלֶן
  choice: nghỉ đêm
  rationale: Động từ לון chỉ việc lưu lại qua đêm; “nghỉ đêm” tự nhiên, trang trọng và giữ rõ ý thời gian.
- source_word: שָׁם
  choice: tại đó
  rationale: Trạng từ chỉ nơi chốn được chuyển trực tiếp và tự nhiên sang tiếng Việt.
- source_word: בַּלַּיְלָה הַהוּא
  choice: đêm
  rationale: Khi đi với “nghỉ” và “tại đó”, tiếng Việt tự nhiên dùng “nghỉ đêm”; ngữ cảnh cùng đại từ “đó” đã xác định chính đêm ấy, tránh cách diễn đạt nặng nề “trong đêm đó”.
- source_word: וַיִּקַּח
  choice: Ông lấy
  rationale: לקח có nghĩa cơ bản là “lấy”; đại từ “ông” giúp câu tiếng Việt rõ chủ thể mà không thêm ý tuyển chọn.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: từ những gì đang có trong tay
  rationale: Giữ hình ảnh Hê-bơ-rơ “đến/có trong tay” đồng thời truyền đạt thành ngữ về những gì sẵn có hoặc thuộc quyền sở hữu của Gia-cốp.
- source_word: מִנְחָה
  choice: một món quà
  rationale: Trong bối cảnh giữa người với người, מִנְחָה là quà biếu chứ không chủ yếu là lễ vật thờ phượng; “món quà” rõ nghĩa và không cường điệu sắc thái cống nạp.
- source_word: לְעֵשָׂו אָחִיו
  choice: để biếu Ê-sau, anh mình
  rationale: Giới từ לְ đánh dấu người nhận; “để biếu” thể hiện đích nhận và sắc thái kính nhường của món quà, còn “anh mình” giữ quan hệ gia đình được nêu trong nguyên văn.
