    issue: Yếu tố xác định “đêm ấy” bị lược bỏ.
    rationale: “Nghỉ đêm” nêu việc qua đêm, nhưng không chuyển rõ הַהוּא (“ấy/đó”) trong cụm “trong đêm ấy”.
  - severity: low
    issue: “Đang có trong tay” có thể bị hiểu theo nghĩa đen quá hẹp.
    rationale: Thành ngữ Hê-bơ-rơ chỉ những gì có sẵn hoặc trong quyền sử dụng; bản văn chính nên dùng cách diễn đạt Việt ngữ rõ hơn và có thể ghi nghĩa sát chữ bằng chú thích.
  - severity: low
    issue: “Để biếu” thêm một sắc thái kính nhường không được đánh dấu rõ trong động từ/giới từ nguồn.
    rationale: לְ chỉ người nhận; “tặng cho” truyền đạt trung tính hơn, trong khi vẫn phù hợp với מִנְחָה.
  revised_text: 'Gia-cốp nghỉ lại tại đó trong đêm ấy. Ông lấy trong số những gì mình có sẵn[a] một món quà tặng cho Ê-sau, anh mình:'
