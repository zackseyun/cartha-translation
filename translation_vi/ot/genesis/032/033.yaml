source:
  edition: WLC
  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: vi
  text: Vì thế, cho đến ngày nay, con cháu Y-sơ-ra-ên không ăn gân hông, là gân ở vùng hõm của đùi[a], vì người ấy đã chạm vào vùng hõm nơi đùi của Gia-cốp, ngay chỗ gân hông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ chỉ một cấu trúc dạng gân ở vùng hông–đùi; có người hiểu cụ thể là dây thần kinh tọa hoặc một gân liên quan đến dây thần kinh tọa.
    reason: Giữ sự không chắc chắn về giải phẫu của גִּיד הַנָּשֶׁה, tránh đưa một cách nhận diện kỹ thuật còn tranh luận vào chính văn.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân–kết quả, giới thiệu lời giải thích về một tập tục còn tiếp diễn.
- source_word: לֹא יֹאכְלוּ
  choice: không ăn
  rationale: Thể chưa hoàn thành có phủ định mô tả tập tục vẫn được duy trì; thì hiện tại tiếng Việt truyền đạt rõ ý này.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  rationale: Giữ sắc thái huyết thống của cụm Hê-bơ-rơ, đồng thời tự nhiên hơn cách dịch sát chữ 'các con trai của Y-sơ-ra-ên' trong tiếng Việt.
- source_word: גִּיד הַנָּשֶׁה
  choice: gân hông
  rationale: Dùng cách gọi ngắn gọn, dễ hiểu và đủ rộng cho mô dây dạng gân; tránh xác định quá mức là dây thần kinh tọa hay một gân cụ thể.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: nằm ở khớp đùi
  rationale: כַּף trong ngữ cảnh chỉ vùng hõm hay ổ khớp, còn יָרֵךְ chỉ vùng đùi/hông; cách dịch này rõ về giải phẫu mà không quá kỹ thuật.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: cho đến ngày nay
  rationale: Thành ngữ tiếng Việt tự nhiên để nói tập tục vẫn tiếp diễn tới thời điểm người kể.
- source_word: כִּי נָגַע
  choice: vì người ấy đã chạm
  rationale: Giữ nghĩa thông thường của נגע là 'chạm'; đại từ được diễn đạt là 'người ấy' vì chủ thể được xác định từ ngữ cảnh trước, nhưng không nêu danh tính vốn không có trong câu này.
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב
  choice: vào khớp đùi của Gia-cốp
  rationale: Dịch nhất quán כַּף và יָרֵךְ với lần xuất hiện trước.
- source_word: בְּגִיד הַנָּשֶׁה
  choice: ngay chỗ gân hông
  rationale: Hiểu giới từ בְ theo nghĩa vị trí, xác định điểm tiếp xúc; lặp lại cùng thuật ngữ để phản ánh nguyên văn.
theological_decisions:
- issue: Danh tính chủ ngữ của נָגַע ('đã chạm')
  choice: người ấy
  alternative: Ngài / người đó / thiên sứ
  rationale: Bản Hê-bơ-rơ chỉ dùng động từ ngôi thứ ba giống đực số ít mà không nêu danh tính trong câu này. 'Người ấy' giữ liên hệ với nhân vật trong văn cảnh nhưng không áp đặt cách nhận diện thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'con cháu Y-sơ-ra-ên' để vừa bảo tồn hình ảnh gia tộc trong nguyên văn vừa phù hợp tiếng Việt. 'Gân hông' được chọn thay cho thuật ngữ kỹ thuật nhằm giữ tính mơ hồ thật sự của tiếng Hê-bơ-rơ.
