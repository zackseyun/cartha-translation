    issue: “Khớp đùi” là cách gọi giải phẫu không tự nhiên và không rõ nghĩa.
    rationale: Tiếng Việt thường nói khớp hông/ổ khớp hông, nhưng cách đó có thể thu hẹp hoặc điều chỉnh cách định vị của cụm Hê-bơ-rơ. “Vùng hõm ở đùi” bảo lưu tính cụ thể nhưng không áp đặt một nhận diện kỹ thuật.
  - severity: low
