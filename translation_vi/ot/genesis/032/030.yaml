base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: vi
  text: 'Gia-cốp hỏi: “Xin cho tôi biết tên ngài.” Nhưng người ấy đáp: “Tại sao ngươi lại hỏi tên ta?” Rồi người ấy ban phước cho Gia-cốp tại đó.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: Gia-cốp hỏi
  rationale: Gộp công thức kể chuyện Hê-bơ-rơ ‘hỏi và nói’ thành cách diễn đạt tự nhiên trong tiếng Việt, không làm mất nội dung.
- source_word: הַגִּידָה נָּא שְׁמֶךָ
  choice: Xin cho tôi biết tên ngài
  rationale: Động từ Hiphil của נגד mang nghĩa ‘cho biết, nói cho biết’; נָא làm lời yêu cầu nhẹ và lịch sự, được thể hiện bằng ‘xin’.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: Tại sao ngươi lại hỏi tên ta?
  rationale: ‘Tại sao ... lại’ diễn đạt tự nhiên sắc thái nhấn mạnh của לָמָּה זֶּה, đồng thời giữ nguyên trọng tâm là việc hỏi tên.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: Rồi người ấy ban phước cho Gia-cốp tại đó
  rationale: ‘Ban phước’ chuyển tải ברך trong ngữ cảnh này; ‘tại đó’ giữ sự nhấn mạnh địa điểm của שָׁם. Danh riêng ‘Gia-cốp’ làm rõ đối tượng trong tiếng Việt mà không thay đổi nghĩa.
theological_decisions:
- issue: Danh tính của người từ chối cho biết tên
  choice: Dùng ‘người ấy’, không xác định là Đức Chúa Trời, thiên sứ hay người đàn ông
  alternative: ‘Đức Chúa Trời’, ‘thiên sứ’ hoặc ‘người đàn ông’
  rationale: Trong câu Hê-bơ-rơ, chủ thể chỉ được ngầm hiểu từ ngữ cảnh và không được gọi đích danh. ‘Người ấy’ giữ lại sự mơ hồ có chủ ý của lời kể.
- issue: Cách xưng hô trong lời đối thoại
  choice: Gia-cốp nói ‘tôi/ngài’; người ấy đáp ‘ngươi/ta’
  alternative: Dùng cặp ‘tôi/ông’ theo lối giao tiếp hiện đại hoàn toàn trung tính
  rationale: Tiếng Hê-bơ-rơ chỉ đánh dấu ngôi thứ hai số ít giống đực và không mã hóa đầy đủ cấp độ xưng hô như tiếng Việt. Cách chọn này tạo lời thoại trang trọng, dễ hiểu và phù hợp với vị thế bí ẩn, có thẩm quyền của người ban phước, nhưng không gọi đích danh người ấy là thần linh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Tránh lối dịch sát dư thừa ‘hỏi và nói’; giữ danh tính của nhân vật ban phước ở trạng thái không xác định như nguyên văn.
