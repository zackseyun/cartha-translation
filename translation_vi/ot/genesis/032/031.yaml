source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: vi
  text: 'Gia-cốp gọi tên nơi ấy là Phê-ni-ên[a], vì: “Tôi đã thấy Đức Chúa Trời[c] mặt đối mặt, và mạng sống tôi đã được bảo toàn[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tên Phê-ni-ên gợi nghĩa “mặt của Đức Chúa Trời”, tương ứng với lời giải thích của Gia-cốp: “Tôi đã thấy Đức Chúa Trời mặt đối mặt.”'
    reason: cultural_note
  - marker: b
    text: 'Hoặc: “mạng sống tôi đã được giải cứu.” Từ Hê-bơ-rơ được dịch là “mạng sống” cũng có thể chỉ chính bản thân người ấy; không nhất thiết có nghĩa là linh hồn phi vật chất.'
    reason: lexical_alternative
  - marker: c
    text: “Đức Chúa Trời” cũng có thể được hiểu theo nghĩa rộng là “một hữu thể thần linh”, nhưng ngữ cảnh nghiêng về cách hiểu “Đức Chúa Trời”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: gọi tên nơi ấy là
  rationale: Diễn đạt tự nhiên công thức đặt tên trong tiếng Việt, đồng thời vẫn phản ánh động từ קרא và danh từ שֵׁם.
- source_word: פְּנִיאֵל
  choice: Phê-ni-ên
  rationale: Phiên âm địa danh theo cách quen thuộc trong tiếng Việt và giữ mối liên hệ với lối chơi chữ “mặt Đức Chúa Trời”.
- source_word: כִּי
  choice: vì
  rationale: 'Giữ rõ quan hệ nguyên nhân: lời tiếp theo giải thích việc Gia-cốp đặt tên nơi ấy.'
- source_word: רָאִיתִי אֱלֹהִים
  choice: Tôi đã thấy Đức Chúa Trời
  rationale: Ngữ cảnh cho thấy Gia-cốp hiểu cuộc gặp là gặp chính Đức Chúa Trời; cách dịch này giữ sức nặng thần học của lời nói.
- source_word: פָּנִים אֶל־פָּנִים
  choice: mặt đối mặt
  rationale: Thành ngữ tiếng Việt tự nhiên, bảo toàn hình ảnh trực diện và lối chơi chữ với Phê-ni-ên.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: mà mạng sống tôi vẫn được bảo toàn
  rationale: נֶפֶשׁ ở đây chỉ sự sống của Gia-cốp, không nhất thiết là linh hồn phi vật chất; נצל diễn tả việc thoát khỏi hiểm nguy và còn sống. “Mà... vẫn” làm rõ sự tương phản hàm ẩn trong ngữ cảnh.
theological_decisions:
- issue: Cách hiểu אֱלֹהִים trong lời Gia-cốp
  choice: Đức Chúa Trời
  alternative: một hữu thể thần linh
  rationale: Danh từ có thể có nghĩa rộng hơn trong một số ngữ cảnh, nhưng lời đặt tên và toàn cảnh cuộc vật lộn nghiêng về việc Gia-cốp nói đến Đức Chúa Trời. Bản dịch chính giữ cách hiểu này mà không xác định thêm bản thể của nhân vật đã vật lộn với ông.
- issue: Quan hệ giữa việc thấy Đức Chúa Trời và sống sót
  choice: “mà mạng sống tôi vẫn được bảo toàn”
  alternative: “và linh hồn tôi đã được giải cứu”
  rationale: Giữ sự căng thẳng của bản văn rằng Gia-cốp trực diện gặp Đức Chúa Trời nhưng vẫn sống, đồng thời tránh áp đặt quan niệm nhị nguyên về “linh hồn” lên נֶפֶשׁ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu hai chấm và ngoặc kép để thể hiện lời giải thích trực tiếp ở ngôi thứ nhất mà không thêm cụm “ông nói”, vốn không có trong tiếng Hê-bơ-rơ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
