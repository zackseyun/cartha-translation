base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: vi
  text: Sáng sớm, La-ban thức dậy, hôn các con trai và các con gái mình[a], rồi chúc phước cho họ. Sau đó, La-ban ra đi và trở về nơi mình ở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai và các con gái mình”. Trong ngữ cảnh này, cách gọi ấy có lẽ chỉ con cháu, tức các cháu của La-ban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Sáng sớm, ... thức dậy
  rationale: Động từ שׁכם ở thể Hifil chỉ việc dậy hoặc bắt đầu làm gì từ sớm; kết hợp với בַּבֹּקֶר, cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý thời gian.
- source_word: וַיְנַשֵּׁק
  choice: hôn
  rationale: Động từ נשׁק ở đây chỉ nụ hôn thân tình lúc chia tay; “hôn” là cách dịch trực tiếp và tự nhiên.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: các con trai và các con gái mình
  rationale: Bản Hê-bơ-rơ dùng riêng hai danh từ chỉ con trai và con gái. Giữ nguyên cách gọi này trong câu chính, đồng thời dùng chú thích để nêu khả năng chúng bao gồm con cháu của La-ban.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: rồi chúc phước cho họ
  rationale: ברך có nghĩa trực tiếp là ban hoặc cầu chúc phước lành. Trong bối cảnh chia tay, “chúc phước cho họ” vừa tự nhiên vừa không giản lược thành lời từ biệt.
- source_word: וַיֵּלֶךְ וַיָּשָׁב
  choice: ra đi và trở về
  rationale: Hai động từ liên tiếp diễn tả La-ban rời chỗ ấy rồi trở về; bản dịch giữ cả hai bước của trình thuật.
- source_word: לִמְקֹמוֹ
  choice: nơi mình ở
  rationale: מקום nghĩa đen là “nơi/chỗ”. “Nơi mình ở” truyền đạt tự nhiên ý La-ban trở về chỗ của ông mà không xác định quá mức là nhà riêng.
theological_decisions:
- issue: Các danh từ thân tộc phân biệt giới tính
  choice: các con trai và các con gái mình
  alternative: các con; các cháu của mình
  rationale: Nguyên văn nêu rõ cả con trai lẫn con gái, nên câu chính bảo toàn cách diễn đạt ấy. Tuy nhiên, trong ngữ cảnh, các từ này có thể được dùng rộng hơn cho con cháu; chú thích nêu khả năng đó thay vì quyết định thay cho nguyên văn.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Tên riêng dùng dạng quen thuộc “La-ban”. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
