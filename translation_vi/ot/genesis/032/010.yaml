  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: vi
  text: 'Rồi Gia-cốp thưa: “Lạy Đức Chúa Trời của cha con, Áp-ra-ham, và Đức Chúa Trời của cha con, Y-sác, lạy Yahweh, Đấng đã phán với con: ‘Hãy trở về xứ sở và quê hương[a] của con; Ta sẽ đối đãi tốt với con[b],’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này cũng có thể chỉ “họ hàng”, “quê quán” hoặc “nơi xuất thân”.
    reason: מוֹלֶדֶת có phạm vi nghĩa gồm nơi nguồn cội và cộng đồng thân tộc; thân văn chọn nghĩa nơi chốn nhưng chú thích giữ lại sự rộng nghĩa.
  - marker: b
    text: 'Nguyên văn có ý: “Ta sẽ làm điều tốt cho con”; cũng có thể dịch: “Ta sẽ hậu đãi con”.'
    reason: Hiphil của יטב với עִם diễn tả việc đối xử cách có lợi, tốt lành.
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: Rồi Gia-cốp thưa
  rationale: וַיֹּאמֶר tiếp nối diễn tiến câu chuyện; “rồi” diễn đạt tự nhiên chức năng kể chuyện của waw liên tiếp. Trong ngữ cảnh cầu nguyện, “thưa” phù hợp hơn “nói” mà không thêm nội dung.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: Đức Chúa Trời của tổ phụ con là Áp-ra-ham và Đức Chúa Trời của cha con là Y-sác
  rationale: 'Giữ hai vế song song và làm rõ quan hệ gia đình vốn đã được mạch truyện xác định: Áp-ra-ham là tổ phụ, Y-sác là cha của Gia-cốp. Cách xưng hô trang trọng, tự nhiên trong lời cầu nguyện.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: הָאֹמֵר אֵלַי
  choice: Đấng đã phán với con
  rationale: Phân từ có mạo từ mô tả Yahweh là Đấng đã nói; mệnh đề quan hệ này tự nhiên trong tiếng Việt và “phán” phù hợp với lời của Đức Chúa Trời.
- source_word: שׁוּב לְאַרְצְךָ
  choice: Hãy trở về xứ sở ... của con
  rationale: “Trở về” diễn đạt mệnh lệnh שׁוּב; “xứ sở” giữ sắc thái địa lý của אֶרֶץ và tránh lặp từ “quê hương” ở vế kế tiếp.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: và quê hương[a] của con
  rationale: מוֹלֶדֶת có thể chỉ nơi xuất thân hoặc cộng đồng thân tộc. “Quê hương” diễn đạt tự nhiên ý nơi chốn và nguồn gốc, còn nghĩa “họ hàng” được ghi chú để giữ độ rộng ngữ nghĩa.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: Ta sẽ đối đãi tốt với con[b]
  rationale: Hiphil của יטב đi với עִם mang nghĩa đối xử có lợi hoặc làm điều tốt cho một người. “Đối đãi tốt với con” vừa tự nhiên trong tiếng Việt vừa giữ nét quan hệ của giới từ עִם.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng, không thay bằng tước hiệu.
- issue: Ý nghĩa của lời hứa וְאֵיטִיבָה עִמָּךְ
  choice: Ta sẽ đối đãi tốt với con
  alternative: Ta sẽ ban phước cho con
  rationale: “Ban phước” có thể thu hẹp hoặc thần học hóa động từ hơn mức văn bản nói. Bản dịch chọn cách diễn đạt rộng, bao quát việc Yahweh làm điều tốt và hậu đãi Gia-cốp.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc; dùng “con/Ta” trong lời cầu nguyện và lời phán. Tên riêng theo dạng quen thuộc trong tiếng Việt: Gia-cốp, Áp-ra-ham, Y-sác; giữ Yahweh như danh riêng. Dấu phẩy cuối câu được giữ trong lời trích dẫn vì câu nguồn tiếp tục sang câu kế tiếp.'
