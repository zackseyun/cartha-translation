base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: vi
  text: Còn con, hãy lấy cho mình một ít từ mọi loại thức ăn có thể ăn được[a], rồi thu gom chúng về bên mình; chúng sẽ là thức ăn cho con và cho chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thường được dùng làm thức ăn” hoặc “được ăn.” Mệnh đề Hê-bơ-rơ có thể chỉ thứ thích hợp để ăn hoặc thứ người ta thường ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Còn con
  rationale: Đại từ được nêu rõ tạo sắc thái nhấn mạnh và chuyển trực tiếp sang Nô-ê; “con” phù hợp với lời Đức Chúa Trời phán với ông trong ngữ cảnh.
- source_word: קַח לְךָ
  choice: hãy lấy cho mình
  rationale: Giữ lực mệnh lệnh của קַח và sắc thái phản thân/hưởng lợi của לְךָ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: מִכָּל מַאֲכָל
  choice: một phần trong mọi thứ lương thực
  rationale: Diễn đạt ý lựa chọn từ toàn bộ các loại lương thực, tránh hàm ý Nô-ê phải lấy hết mọi lương thực hiện có.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: có thể ăn được
  rationale: Niphal imperfect ở đây mô tả lương thực thích hợp để ăn; cách dịch này tự nhiên hơn “được ăn” nhưng vẫn ghi nhận khả năng hiểu theo thói quen tiêu thụ trong chú thích.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: rồi thu gom lại bên mình
  rationale: “Thu gom” thể hiện אָסַף, còn “bên mình” giữ hướng nghĩa của אֵלֶיךָ và phù hợp với việc tích trữ trong tàu.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: số lương thực ấy sẽ dùng làm thức ăn cho con và cho chúng
  rationale: Thể hiện kết quả tương lai của וְהָיָה, mục đích của לְאָכְלָה, và giữ sự phân biệt giữa Nô-ê với các sinh vật.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lương thực” cho nguồn thực phẩm được thu gom và dự trữ; dùng “thức ăn” ở cuối câu để diễn đạt tự nhiên mục đích nuôi sống Nô-ê và các sinh vật.
