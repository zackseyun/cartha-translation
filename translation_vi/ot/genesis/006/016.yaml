base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: vi
  text: Hãy làm mái cho con tàu[a], và từ phía trên, hoàn tất nó đến một cu-bít[b]. Hãy đặt cửa tàu ở bên hông. Hãy làm nó có tầng dưới, tầng thứ hai và tầng thứ ba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cửa sổ” hoặc “ô lấy sáng” cho con tàu. Từ Hê-bơ-rơ này hiếm gặp và có thể chỉ một chỗ mở để lấy ánh sáng chứ không phải toàn bộ mái.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ ở đây khó hiểu; có lẽ nó mô tả việc hoàn tất phần nóc sao cho phần trên cùng còn một cu-bít, hoặc phần kết cấu phía trên thu lại đến một cu-bít.
    reason: cultural_note
  - marker: c
    text: Cũng có thể hiểu là các “boong” hoặc các “cấp”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: mái
  rationale: Danh từ hiếm này có nghĩa không chắc chắn. Trong ngữ cảnh đóng tàu và hoàn tất phần phía trên, “mái” phù hợp với một bộ phận kết cấu ở nóc tàu; các khả năng “cửa sổ” và “ô lấy sáng” được giữ trong chú thích.
- source_word: תֵּבָה
  choice: con tàu
  rationale: Trong ngữ cảnh Nô-ê đóng phương tiện nổi lớn, “con tàu” là cách nói tự nhiên, dễ hiểu trong tiếng Việt hiện đại, dù vật này không nhất thiết có hình dáng như tàu thuyền thông thường.
- source_word: וְאֶל אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: và ở phía trên, hãy hoàn tất nó đến một cu-bít
  rationale: Cách dịch bám sát các thành tố “đến một cu-bít,” “hoàn tất nó” và “từ/phía trên,” đồng thời không áp đặt một mô hình kiến trúc cụ thể lên câu Hê-bơ-rơ khó hiểu này.
- source_word: פֶּתַח
  choice: cửa
  rationale: Trong chỉ dẫn đóng tàu, “cửa” diễn đạt tự nhiên một lối ra vào; “lối mở” và “lối vào” vẫn có thể là nghĩa rộng hơn.
- source_word: בְּצִדָּהּ
  choice: ở bên hông tàu
  rationale: Cụm này chỉ vị trí tại một bên của con tàu. Lặp lại “tàu” giúp câu tiếng Việt rõ nghĩa hơn đại từ sở hữu.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: tầng dưới, tầng thứ hai và tầng thứ ba
  rationale: Các từ này mô tả ba tầng hoặc cấp của con tàu. “Tầng” trung tính và tự nhiên hơn “boong,” vì nguyên văn không nhất thiết xác định cấu trúc boong tàu theo nghĩa hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu, dùng “Ngươi hãy” phù hợp lời Đức Chúa Trời trực tiếp truyền cho một cá nhân. Cách diễn đạt giữ lại độ khó thực sự của chỉ dẫn kiến trúc trong nguyên văn, còn chú thích trình bày các khả năng chính.
