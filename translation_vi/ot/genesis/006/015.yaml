base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: vi
  text: 'Hãy làm chiếc tàu ấy như sau: dài ba trăm cu-bít[a], rộng năm mươi cu-bít, và cao ba mươi cu-bít.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cu-bít là đơn vị đo chiều dài thời cổ, xấp xỉ khoảng cách từ khuỷu tay đến đầu ngón tay.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: Ngươi phải đóng nó như sau
  rationale: Cụm Hê-bơ-rơ mở đầu phần quy định cách làm. “Đóng” tự nhiên trong tiếng Việt đối với một con tàu, còn “phải” truyền đạt sức chỉ thị của động từ chưa hoàn thành trong ngữ cảnh mệnh lệnh.
- source_word: הַתֵּבָה
  choice: tàu
  rationale: תֵּבָה chỉ phương tiện nổi Nô-ê đang được lệnh làm. “Tàu” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại; không thêm đặc điểm không có trong nguyên văn.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: ba trăm cu-bít
  rationale: Giữ nguyên đơn vị đo cổ thay vì quy đổi, vì độ dài chính xác của cu-bít có thể khác nhau; kèm chú thích văn hóa.
- source_word: אֹרֶךְ
  choice: chiều dài
  rationale: Tương đương trực tiếp và tự nhiên trong mô tả kích thước.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: chiều rộng năm mươi cu-bít
  rationale: רָחְבָּהּ diễn tả chiều rộng của tàu; trật tự được điều chỉnh cho tự nhiên trong tiếng Việt.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: và chiều cao ba mươi cu-bít
  rationale: קוֹמָה trong ngữ cảnh kiến trúc chỉ chiều cao; cách diễn đạt này rõ ràng và hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ sắc thái lời Đức Chúa Trời trực tiếp phán với một cá nhân; dùng “đóng” theo cách nói tự nhiên về việc làm một con tàu. Giữ đơn vị cổ “cu-bít” và giải thích bằng chú thích, không quy đổi thành một con số hiện đại thiếu chắc chắn.
