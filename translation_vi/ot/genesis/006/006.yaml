source:
  edition: WLC
  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: vi
  text: Đức Giê-hô-va hối tiếc[b] vì đã làm nên loài người[a] trên đất, và Ngài đau buồn trong lòng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhân loại”. Từ Hê-bơ-rơ ở đây chỉ chung cả loài người.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lấy làm tiếc vì đã làm nên” hoặc “đau buồn vì đã làm nên”. Động từ Hê-bơ-rơ nói đến sự hối tiếc hoặc đau buồn về một hành động trước đó; tự nó không nói rằng Đức Giê-hô-va bị bất ngờ, không biết trước, hay đã phạm một sai lầm đạo đức.'
    reason: lexical_and_theological_clarification
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: hối tiếc
  rationale: Dạng Niphal của נחם, theo sau bởi mệnh đề כִּי nói về một hành động đã thực hiện, diễn tả sự hối tiếc hoặc đau buồn khi nhìn lại. “Hối tiếc” giữ được lực hồi cố của từ này và không đồng nhất nó với động từ עצב nói về nỗi đau ở vế sau.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc, trang trọng trong tiếng Việt để chuyển danh riêng giao ước YHWH; không thay bằng danh xưng chung “Chúa”.
- source_word: כִּי
  choice: vì
  rationale: Trong cấu trúc này, כִּי nêu nội dung đồng thời là nguyên do của sự hối tiếc; “vì đã…” tự nhiên trong tiếng Việt và giữ quan hệ ấy.
- source_word: עָשָׂה
  choice: đã làm nên
  rationale: Chỉ hành động có trước của Đức Giê-hô-va đối với loài người. “Làm nên” phù hợp ngữ cảnh sáng tạo mà không cần thêm từ không có trong câu.
- source_word: הָאָדָם
  choice: loài người
  rationale: Ở đây אָדָם mang nghĩa tập thể, chỉ toàn thể nhân loại chứ không riêng cá nhân A-đam. “Loài người” diễn đạt rõ nghĩa tập thể trong tiếng Việt hiện đại.
- source_word: בָּאָרֶץ
  choice: trên đất
  rationale: בָּאָרֶץ ở đây nói đến mặt đất/thế gian, không phải một xứ cụ thể; “trên đất” vừa tự nhiên vừa gần hình thức Hê-bơ-rơ.
- source_word: וַיִּתְעַצֵּב
  choice: đau buồn
  rationale: Dạng Hitpael của עצב diễn tả nỗi đau nội tâm sâu sắc. Cấu trúc “lòng Ngài đau buồn” tự nhiên hơn “Ngài bị đau trong lòng” mà vẫn phân biệt với ý hối tiếc ở động từ trước.
- source_word: אֶל־לִבּוֹ
  choice: lòng Ngài
  rationale: Thành ngữ chỉ nội tâm. Chuyển thành chủ ngữ “lòng Ngài” là cách diễn đạt tiếng Việt tự nhiên và vẫn giữ hình ảnh về tấm lòng.
theological_decisions:
- issue: Ngôn ngữ nhân hình về việc Đức Giê-hô-va “hối tiếc” và đau buồn
  choice: Giữ lời khẳng định trực tiếp rằng Đức Giê-hô-va hối tiếc vì đã làm nên loài người và lòng Ngài đau buồn.
  alternative: Làm nhẹ thành “Đức Giê-hô-va buồn” hoặc giải thích ngay trong câu rằng Ngài không thật sự hối tiếc.
  rationale: 'Bản văn đặt cạnh nhau hai ý riêng: sự hối tiếc hồi cố (נחם) và nỗi đau nội tâm (עצב). Bản dịch không nên giải quyết thay bản văn vấn đề lời này liên hệ thế nào với sự biết trước của Đức Chúa Trời. Chú thích làm rõ rằng chính động từ này không hàm ý Ngài bất ngờ hay phạm sai lầm đạo đức.'
- issue: Nghĩa tập thể của הָאָדָם
  choice: Dịch là “loài người”.
  alternative: “con người”, “nhân loại”, hoặc hiểu là riêng A-đam.
  rationale: Ngữ cảnh nói đến toàn thể giống người trên đất. “Loài người” truyền đạt rõ nghĩa tập thể và tránh khiến độc giả tưởng câu này chỉ nói về A-đam.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp hai vế của nguyên bản: hối tiếc về hành động trước đó, rồi đau buồn tận đáy lòng. Dùng “Ngài” để tránh lặp danh xưng mà vẫn giữ sắc thái kính trọng.'
