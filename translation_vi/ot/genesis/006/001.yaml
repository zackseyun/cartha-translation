  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: vi
  text: Khi loài người[a] bắt đầu sinh sôi trên mặt đất và các con gái được sinh ra cho họ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng danh từ số ít “con người”, nhưng ở đây từ này mang nghĩa tập thể, chỉ loài người nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Khi
  rationale: Cụm này mở đầu một diễn biến mới bằng mệnh đề chỉ thời gian. Trong tiếng Việt, “Khi” truyền đạt tự nhiên quan hệ cú pháp ấy mà không cần dịch máy móc thành “Và sự việc xảy ra rằng”.
- source_word: הֵחֵל
  choice: bắt đầu
  rationale: Dạng Hiphil trong cấu trúc này có nghĩa là bắt đầu thực hiện một hành động.
- source_word: הָאָדָם
  choice: loài người
  rationale: Danh từ có hình thức số ít nhưng mang nghĩa tập thể trong ngữ cảnh này, chỉ toàn thể nhân loại chứ không riêng A-đam hay nam giới.
- source_word: לָרֹב
  choice: sinh sôi
  rationale: Động từ diễn tả việc dân số tăng lên. “Sinh sôi” là cách nói tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh các thế hệ loài người gia tăng.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: trên mặt đất
  rationale: Giữ được hình ảnh “trên bề mặt” của thành ngữ Hê-bơ-rơ và phân biệt אֲדָמָה, “đất”, với từ rộng hơn chỉ toàn cõi đất.
- source_word: וּבָנוֹת
  choice: và các con gái
  rationale: Cách dịch trực tiếp, tự nhiên, đồng thời chuẩn bị cho trọng tâm của câu kế tiếp.
- source_word: יֻלְּדוּ לָהֶם
  choice: được sinh ra cho họ
  rationale: Giữ thể bị động của động từ và giới từ chỉ những người mà các con gái được sinh ra cho.
theological_decisions:
- issue: Ý nghĩa tập thể của הָאָדָם
  choice: loài người
  alternative: con người; người ta
  rationale: Trong câu này, הָאָדָם không chỉ một cá nhân nam mà chỉ nhân loại nói chung. “Loài người” diễn đạt rõ nghĩa tập thể mà không áp đặt cách hiểu chỉ giới nam; chú thích vẫn bảo lưu hình thức số ít của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ ở dạng chưa kết thúc vì mệnh đề này tiếp tục sang câu 2. Không dùng lối dịch cổ “Vả, xảy khi” hay cấu trúc thiếu tự nhiên mô phỏng từng chữ.
