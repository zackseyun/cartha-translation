base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: vi
  text: Đất đã trở nên bại hoại trước mặt Đức Chúa Trời[a], và đất đầy bạo lực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đất đã trở nên bại hoại trong mắt Đức Chúa Trời.”'
    reason: Phản ánh cách diễn đạt thay thế cho לִפְנֵי הָאֱלֹהִים (“trong mắt/trong cái nhìn của Đức Chúa Trời”) mà không quyết định quá mức phạm vi của הָאָרֶץ.
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: đã trở nên bại hoại
  rationale: Dạng Niphal diễn tả tình trạng bị hư hoại hoặc trở nên bại hoại. Trong văn cảnh nói về sự gian ác và bạo lực, cách dịch này tự nhiên trong tiếng Việt và chủ yếu gợi sự suy đồi đạo đức, nhưng không loại bỏ hoàn toàn sắc thái bị hủy hoại.
- source_word: הָאָרֶץ
  choice: đất
  rationale: אֶרֶץ có thể chỉ toàn thể đất hoặc một vùng đất. Dịch là “đất” giữ được sự lặp lại và phần nào bảo tồn độ rộng nghĩa; chú thích nêu phương án “cõi đất” để thể hiện phạm vi rộng trong trình thuật lụt lớn.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: trước mặt Đức Chúa Trời
  rationale: Cách diễn đạt tự nhiên, trang trọng và sát nghĩa “trước mặt/trong sự hiện diện của,” đồng thời không thu hẹp thành riêng ý nghĩa sự đánh giá bằng thị giác.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh và cú pháp này, אֱלֹהִים chỉ Đức Chúa Trời duy nhất; đây là cách gọi phổ thông, trang trọng trong tiếng Việt Kinh Thánh.
- source_word: וַתִּמָּלֵא
  choice: đầy dẫy
  rationale: Dạng Niphal cho biết đất ở trong tình trạng tràn đầy. “Đầy dẫy” diễn đạt tự nhiên mức độ lan tràn mà không thêm một chủ thể gây ra hành động.
- source_word: חָמָס
  choice: bạo lực
  rationale: חָמָס chỉ bạo lực, sự tàn bạo hoặc hành vi bất công có tính xâm hại. “Bạo lực” là cách dịch trực tiếp và không diễn giải quá mức.
- source_word: וַ
  choice: và
  rationale: Liên từ thứ hai nối hai mệnh đề song song; không thêm trạng từ thời gian không có trong nguyên văn. Waw mở đầu được thể hiện bằng trình tự kể chuyện tự nhiên của tiếng Việt.
theological_decisions:
- issue: Bản chất của sự bại hoại
  choice: Tình trạng bại hoại đạo đức của đất, tức xã hội loài người, trước mặt Đức Chúa Trời
  alternative: Sự hư hỏng hoặc tàn phá vật chất của đất
  rationale: Văn cảnh gần nhấn mạnh sự gian ác của loài người và bạo lực. Tuy vậy, từ Hê-bơ-rơ có phạm vi nghĩa rộng hơn, nên bản dịch không thêm “đạo đức” hoặc “loài người” vào chính văn.
- issue: Phạm vi của הָאָרֶץ
  choice: đất, với khả năng chỉ toàn cõi đất trong văn cảnh
  alternative: xứ hoặc vùng đất
  rationale: Danh từ có thể mang nghĩa “đất,” “cõi đất” hoặc “xứ.” Văn cảnh lụt lớn ủng hộ phạm vi rộng, nhưng chú thích bảo tồn phương án hẹp hơn thay vì giải quyết dứt khoát sự mơ hồ từ vựng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “đất… đất” của nguyên văn để tạo nhấn mạnh; dùng “đã trở nên bại hoại” thay vì một cấu trúc bị động gượng ép. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
