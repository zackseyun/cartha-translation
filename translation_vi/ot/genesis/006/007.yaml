source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: vi
  text: 'Đức Yahweh phán: “Ta sẽ xóa sạch loài người[a] mà Ta đã tạo dựng khỏi mặt đất—từ loài người cho đến gia súc, các loài bò rạp và chim trời[b]—vì Ta hối tiếc đã làm nên chúng[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con người.” Từ Hê-bơ-rơ אָדָם (adam) ở đây chỉ nhân loại theo nghĩa tập thể.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “chim của các tầng trời”; đây là một thành ngữ Hê-bơ-rơ chỉ chim trời.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “Ta đau buồn vì đã làm nên chúng.” Từ Hê-bơ-rơ נחם ở thể Niphal diễn tả sự hối tiếc hoặc đau buồn về một hành động trước đó; tự nó không nói rằng Đức Chúa Trời bị bất ngờ, thiếu biết trước hay đã phạm một sai lầm đạo đức.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu; thêm “Đức” để lời văn tiếng Việt tự nhiên và trang trọng.
- source_word: אֶמְחֶה
  choice: Ta sẽ xóa sạch
  rationale: Giữ hình ảnh cụ thể của động từ מחה là lau/xóa khỏi một bề mặt, đồng thời diễn đạt rõ ý hủy diệt trong ngữ cảnh.
- source_word: הָאָדָם
  choice: loài người
  rationale: Ở đây אָדָם chỉ nhân loại theo nghĩa tập thể. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ được sự lặp lại của cùng từ ở mệnh đề liệt kê tiếp theo.
- source_word: אֲשֶׁר בָּרָאתִי
  choice: mà Ta đã tạo dựng
  rationale: Diễn đạt hành động sáng tạo đã hoàn tất và giữ quan hệ trực tiếp với “loài người”.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: khỏi mặt đất
  rationale: Giữ thành ngữ Hê-bơ-rơ “khỏi mặt của đất” bằng một cách nói tiếng Việt tự nhiên; אֲדָמָה ở đây là mặt đất/đất đai.
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמָיִם
  choice: từ loài người cho đến gia súc, các sinh vật bò trên đất và chim trời
  rationale: Giữ trình tự liệt kê của nguyên văn. “Các sinh vật bò trên đất” tránh thu hẹp רֶמֶשׂ chỉ còn các loài bò sát theo phân loại sinh học hiện đại.
- source_word: נִחַמְתִּי
  choice: Ta hối tiếc
  rationale: Thể Niphal của נחם, khi nhìn lại một hành động trước đó, trực tiếp diễn tả sự hối tiếc hoặc đau buồn về hành động ấy. “Hối tiếc” bảo toàn sức căng của nguyên văn mà không tự thêm một kết luận thần học.
- source_word: כִּי עֲשִׂיתִם
  choice: rằng đã làm nên chúng
  rationale: Đại từ số nhiều quy chiếu về các sinh vật vừa được kể; tiếng Việt có thể lược chủ ngữ sau “Ta hối tiếc” mà vẫn hiểu rõ người thực hiện là Yahweh.
theological_decisions:
- issue: Lời nói về sự hối tiếc của Đức Chúa Trời trong נִחַמְתִּי
  choice: vì Ta hối tiếc rằng đã làm nên chúng
  alternative: vì Ta đau buồn vì đã làm nên chúng
  rationale: “Hối tiếc” thể hiện trực tiếp sắc thái nhìn lại hành động đã làm của נחם trong cấu trúc này và không làm nhẹ đi sức căng thần học của câu. Tuy nhiên, bản thân từ Hê-bơ-rơ không khẳng định Đức Chúa Trời bị bất ngờ, thiếu biết trước hay đã phạm sai lầm đạo đức.
- issue: Nghĩa tập thể của הָאָדָם
  choice: loài người
  alternative: con người
  rationale: Trong ngữ cảnh phán xét toàn thể sự sống trên đất, từ này chỉ nhân loại nói chung. “Loài người” vừa rõ nghĩa tập thể vừa cho phép lặp lại từ ngữ ở phần “từ loài người cho đến...”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đức Chúa Trời. Dấu gạch ngang làm rõ phạm vi liệt kê mà không thay đổi quan hệ cú pháp của nguyên văn.
