- from: 'Đức Yahweh phán: “Ta sẽ xóa sạch loài người[a] mà Ta đã tạo dựng khỏi mặt đất—từ loài người cho đến gia súc, các sinh vật bò trên đất và chim trời[b]—vì Ta hối tiếc[c] rằng đã làm nên chúng.”'
  to: 'Đức Yahweh phán: “Ta sẽ xóa sạch loài người[a] mà Ta đã tạo dựng khỏi mặt đất—từ loài người cho đến gia súc, các loài bò rạp và chim trời[b]—vì Ta hối tiếc đã làm nên chúng[c].”'
  rationale: Chỉnh sửa chỉ nhằm loại bỏ phần diễn giải thêm trong cách dịch רֶמֶשׂ và làm trơn câu tiếng Việt. Bản sửa vẫn giữ nguyên thứ tự liệt kê, sự lặp lại của אָדָם bằng “loài người,” và sắc thái hối tiếc hồi cố của נחם Niphal. Các dấu neo chú thích được giữ đúng vị trí và bộ chú thích đầy đủ.
