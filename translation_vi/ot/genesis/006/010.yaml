  text: 'And Noah fathered three sons: Shem[a], Ham, and Japheth.'
translation:
  language: vi
  text: 'Nô-ê làm cha của ba con trai: Sem, Cham và Gia-phết.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: sinh
  rationale: Động từ ילד ở thể Hiphil trong mạch kể chỉ việc Nô-ê trở thành cha của các con. Trong tiếng Việt hiện đại, “sinh” là cách diễn đạt tự nhiên khi nói một người có con theo văn cảnh gia phả; chủ ngữ nam và cụm “con trai” vẫn làm rõ quan hệ cha-con.
- source_word: שְׁלֹשָׁה בָנִים
  choice: ba người con trai
  rationale: בָנִים ở đây có nghĩa cụ thể là “các con trai”, phù hợp với ba người nam được nêu tên; “người” giúp câu tiếng Việt tự nhiên và trang trọng.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Cham và Gia-phết
  rationale: Các אֶת đánh dấu ba tân ngữ xác định và không cần dịch riêng trong tiếng Việt. Dùng dấu hai chấm để dẫn danh sách; các tên theo dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không giữ cước chú tiếng Anh tại “Shem” vì nội dung cước chú ấy thực ra giải thích động từ “fathered/begot”; trong tiếng Việt, phương án “sinh” không cần một biến thể cổ hoặc trang trọng tương ứng. Dấu hai chấm thể hiện rõ ba tên là phần giải thích cho “ba người con trai”.
