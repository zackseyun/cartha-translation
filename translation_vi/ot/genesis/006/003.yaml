source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán: “Thần của Ta sẽ không tranh đấu với loài người mãi mãi[a], vì loài người cũng là xác thịt[b]; vì thế, số ngày của họ sẽ là một trăm hai mươi năm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thần của Ta sẽ không ở lại trong loài người mãi mãi.” Động từ Hê-bơ-rơ ở đây khó xác định và có thể mang nghĩa “ở lại” thay vì “tranh đấu”.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “vì loài người là xác thịt”. Từ Hê-bơ-rơ אָדָם (adam) ở số ít nhưng được dùng theo nghĩa chung để chỉ nhân loại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: יָדוֹן
  choice: sẽ không tranh đấu
  rationale: Động từ này khó xác định; cách dịch này giữ được ý đối kháng hoặc kiềm chế của Đức Chúa Trời, còn nghĩa “ở lại” được ghi ở chú thích.
- source_word: רוּחִי
  choice: Thần của Ta
  rationale: Đại từ sở hữu của Đấng đang phán ủng hộ cách hiểu là Thần của Đức Chúa Trời, nhưng không áp đặt sự phát triển thần học về sau.
- source_word: בָאָדָם
  choice: với loài người
  rationale: Giới từ ב được hiểu theo động từ “tranh đấu”; אָדָם là danh từ số ít dùng theo nghĩa đại diện cho toàn thể loài người.
- source_word: לְעֹלָם
  choice: mãi mãi
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho khoảng thời gian vô hạn trong ngữ cảnh này.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: vì loài người cũng chỉ là xác thịt
  rationale: Giữ sắc thái của גַּם bằng “cũng”, đồng thời dùng “chỉ” để câu tiếng Việt tự nhiên; “xác thịt” bảo tồn hình ảnh nhân học và thần học của nguyên văn.
- source_word: וְהָיוּ יָמָיו
  choice: vì thế, những ngày của họ sẽ là
  rationale: Diễn đạt quan hệ kết quả được hiểu trong mạch câu; “họ” quy chiếu tự nhiên về “loài người” trong tiếng Việt.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: một trăm hai mươi năm
  rationale: Viết bằng chữ phù hợp văn phong Kinh Thánh và phản ánh chính xác con số trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của רוּחִי trong quan hệ với loài người
  choice: Thần của Ta
  alternative: hơi thở của Ta
  rationale: Ngôi thứ nhất sở hữu trong lời Đức Chúa Trời phán thiên về Thần của Ngài, nhưng cách dịch không xác định thêm các phạm trù Ba Ngôi về sau.
- issue: Phạm vi của אָדָם
  choice: loài người
  alternative: con người ấy / người nam
  rationale: Danh từ số ít ở đây có chức năng tập thể, chỉ nhân loại; “loài người” truyền đạt rõ nghĩa đại diện trong tiếng Việt.
- issue: Ý nghĩa của giới hạn một trăm hai mươi năm
  choice: Giữ nguyên cách nói “những ngày của họ sẽ là một trăm hai mươi năm”
  alternative: diễn giải rõ là tuổi thọ tối đa hoặc thời gian còn lại trước trận lụt
  rationale: Nguyên văn không nói dứt khoát đây là tuổi thọ cá nhân hay thời hạn trước phán xét, nên không giải quyết sự mơ hồ ngay trong bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời, “loài người” để chuyển tải số ít tập thể אָדָם, và giữ “xác thịt” nhằm bảo tồn hình ảnh nguyên văn. Mọi chú thích đều có ký hiệu tương ứng trong câu chính.
