  to: 'Bấy giờ, Yahweh phán: “Thần của Ta sẽ không tranh đấu với loài người mãi mãi[a], vì loài người cũng là xác thịt[b]; vì thế, số ngày của họ sẽ là một trăm hai mươi năm.”'
