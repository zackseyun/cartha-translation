translation:
  language: vi
  text: Nô-ê đã làm theo mọi điều Đức Chúa Trời đã truyền cho ông; ông đã làm như vậy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ lặp lại động từ “làm” để nhấn mạnh: “Nô-ê đã làm ... ông đã làm như vậy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה có nghĩa rộng là “làm/thực hiện”. Ở đây từ này tóm lược hành động vâng theo chỉ dẫn trước đó của Nô-ê.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: כְּכֹל אֲשֶׁר
  choice: đúng mọi điều
  rationale: Cụm từ diễn tả sự phù hợp trọn vẹn với toàn bộ điều đã được truyền; “đúng mọi điều” vừa tự nhiên vừa giữ sức nhấn mạnh của כְּ và כֹל.
- source_word: צִוָּה
  choice: đã truyền
  rationale: צוה chỉ một mệnh lệnh có thẩm quyền; “truyền” phù hợp với văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: אֹתוֹ
  choice: cho mình
  rationale: Đại từ chỉ Nô-ê là người nhận mệnh lệnh; “cho mình” giúp câu tiếng Việt tránh lặp tên và không gây nhầm chủ thể.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này אֱלֹהִים đi với động từ số ít và chỉ một Đức Chúa Trời; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: כֵּן עָשָׂה
  choice: ông làm đúng
  rationale: כֵּן nhấn mạnh sự tương ứng chính xác giữa mệnh lệnh và hành động. Cách diễn đạt này giữ lần thứ hai của עשה nhưng tự nhiên hơn lối dịch sát “ông đã làm như thế” ngay sau mệnh đề đầu.
theological_decisions:
- issue: Cách thể hiện công thức lặp nhấn mạnh sự vâng lời
  choice: 'Giữ hai lần động từ “làm”: “Nô-ê làm như vậy; ông làm đúng mọi điều...”'
  alternative: Nô-ê làm mọi điều Đức Chúa Trời đã truyền cho ông.
  rationale: Nguyên văn cố ý dùng עשה ở đầu và cuối câu. Giữ sự lặp lại phản ánh điểm nhấn về việc Nô-ê thực hiện đầy đủ mệnh lệnh mà không thêm một kết luận thần học ngoài văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giữ cấu trúc hai vế của nguyên văn; cách đặt “đúng mọi điều” truyền đạt ý làm hoàn toàn theo mệnh lệnh mà không làm mất sự lặp động từ.
