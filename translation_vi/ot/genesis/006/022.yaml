  to: Nô-ê đã làm theo mọi điều Đức Chúa Trời đã truyền cho ông; ông đã làm như vậy.[a]
  rationale: Bản sửa thay đại từ phản thân mơ hồ bằng “ông”, dùng “làm theo mọi điều” để diễn đạt tự nhiên ý tuân theo trọn vẹn của כְּכֹל אֲשֶׁר, và đặt mệnh đề “ông đã làm như vậy” ở cuối để vừa tự nhiên trong tiếng Việt vừa giữ sự lặp lại nhấn mạnh của động từ עשה. Không thêm diễn giải thần học.
