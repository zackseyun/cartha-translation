    issue: “Trát nhựa” không phải là cách kết hợp tự nhiên nhất trong tiếng Việt hiện đại và để đối tượng của hành động chỉ được hiểu ngầm.
    rationale: Văn bản Hê-bơ-rơ nêu rõ “phủ nó ... bằng chất phủ.” Đổi thành “phủ nó bằng nhựa” vừa tự nhiên hơn vừa phản ánh rõ đại từ đối tượng אֹתָהּ, không thay đổi nghĩa.
