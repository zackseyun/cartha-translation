base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: vi
  text: Hãy làm cho mình một chiếc tàu bằng gỗ gô-phe[a]. Hãy làm các ngăn[b] trong chiếc tàu ấy, rồi phủ nó bằng nhựa[c] ở cả bên trong lẫn bên ngoài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “gỗ cây bách.” Từ Hê-bơ-rơ gô-phe chỉ xuất hiện tại đây, nên không rõ chính xác đó là loại gỗ nào.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “các khoang”; sát nghĩa là “các tổ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “phủ kín bằng nhựa đường/hắc ín.” Trong tiếng Hê-bơ-rơ, động từ chỉ việc phủ và danh từ chỉ chất phủ là hai từ có liên hệ với nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Hãy làm cho mình
  rationale: Diễn đạt trực tiếp mệnh lệnh עֲשֵׂה cùng לְךָ (‘cho mình’), không thu hẹp động từ chung ‘làm’ thành ‘đóng’ hay ‘xây’.
- source_word: תֵּבַת
  choice: một chiếc tàu
  rationale: Trong ngữ cảnh Sáng Thế Ký 6, từ này chỉ chiếc tàu lớn Nô-ê phải làm. ‘Chiếc tàu’ tự nhiên trong tiếng Việt, đồng thời tránh hình dung quá cụ thể về kiểu dáng của tàu thuyền thông thường.
- source_word: עֲצֵי גֹפֶר
  choice: gỗ gô-phe
  rationale: גֹפֶר chỉ xuất hiện tại đây và chưa xác định chắc là loại cây nào; phiên âm bảo toàn sự không chắc chắn thay vì chọn một loài cây theo phỏng đoán.
- source_word: קִנִּים
  choice: các ngăn
  rationale: Nghĩa sát của số nhiều này liên hệ với ‘tổ’, nhưng tại đây chỉ những phần không gian được chia ra trong tàu. ‘Các ngăn’ rõ ràng và tự nhiên hơn ‘các tổ’.
- source_word: וְכָפַרְתָּ ... בַּכֹּפֶר
  choice: rồi trát nhựa
  rationale: Động từ chỉ hành động phủ/trát, còn danh từ cùng gốc chỉ vật liệu dùng để phủ kín. ‘Trát nhựa’ truyền đạt cả thao tác lẫn chất phủ mà không xác định quá mức thành một chất liệu hiện đại cụ thể.
- source_word: מִבַּיִת וּמִחוּץ
  choice: cả bên trong lẫn bên ngoài
  rationale: Cách nói tiếng Việt tự nhiên, thể hiện rõ cả hai bề mặt đều phải được trát.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại, dễ hiểu. Dùng ‘chiếc tàu’ và ‘các ngăn’ theo ngữ cảnh thực tế; giữ ‘gô-phe’ để không che lấp sự bất định của từ Hê-bơ-rơ hiếm. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau từ ngữ liên quan trong chính văn.
