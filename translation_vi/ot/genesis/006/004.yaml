source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: vi
  text: Trong những ngày ấy, người Nê-phi-lim[a] có mặt trên đất, và cả về sau nữa, khi các con trai của Đức Chúa Trời[b] ăn ở với các con gái loài người[c], các con gái ấy sinh con cho họ. Đó là những người hùng mạnh thuở xưa, những người lừng danh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “người khổng lồ.” Từ Hê-bơ-rơ “Nê-phi-lim” rất hiếm gặp và nghĩa chính xác chưa rõ.'
    reason: alternative_reading
  - marker: b
    text: “Các con trai của Đức Chúa Trời” cũng có thể được hiểu là “các hữu thể thần linh”; một số cách giải thích khác cho rằng đây là những nhà cai trị loài người hoặc dòng dõi tin kính của Sết.
    reason: alternative_reading
  - marker: c
    text: “Các con gái loài người” dùng “loài người” theo nghĩa tập thể, tức là những phụ nữ thuộc nhân loại.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: người Nê-phi-lim
  rationale: Phiên âm thuật ngữ Hê-bơ-rơ hiếm và chưa rõ nghĩa, thay vì quyết đoán dịch là “người khổng lồ” hoặc “những kẻ sa ngã”.
- source_word: בָאָרֶץ
  choice: trên đất
  rationale: Phù hợp với bối cảnh lịch sử nguyên thủy và giữ được nghĩa rộng của אֶרֶץ.
- source_word: וְגַם אַחֲרֵי כֵן
  choice: và cả về sau nữa
  rationale: Giữ cả sắc thái bổ sung của וְגַם lẫn ý nghĩa thời gian của אַחֲרֵי כֵן.
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: khi ... ăn ở với
  rationale: Diễn đạt tự nhiên thành ngữ chỉ quan hệ tính dục trong ngữ cảnh, đồng thời giữ liên kết thời gian của mệnh đề.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: các con trai của Đức Chúa Trời
  rationale: Bám sát cấu trúc Hê-bơ-rơ và không quyết định trước căn tính đang gây tranh luận của nhóm này.
- source_word: בְּנוֹת הָאָדָם
  choice: các con gái loài người
  rationale: Thể hiện אָדָם số ít theo nghĩa tập thể là nhân loại, bằng lối nói tự nhiên trong tiếng Việt.
- source_word: וְיָלְדוּ לָהֶם
  choice: rồi họ sinh con cho những người ấy
  rationale: Bổ sung tân ngữ “con” vốn được hàm ý và giữ quan hệ gián tiếp “cho họ” của nguyên văn.
- source_word: הַגִּבֹּרִים
  choice: những người hùng mạnh
  rationale: Giữ phạm vi nghĩa rộng về sức mạnh và quyền thế, không thu hẹp thành “chiến binh” hay lý tưởng hóa thành “anh hùng”.
- source_word: מֵעוֹלָם
  choice: thuở xưa
  rationale: Lối diễn đạt tiếng Việt trang trọng, tự nhiên, chỉ thời cổ xưa.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: những người lừng danh
  rationale: Chuyển thành ngữ Hê-bơ-rơ về danh tiếng sang cách nói tiếng Việt rõ ràng và trang trọng.
theological_decisions:
- issue: Căn tính của “các con trai của Đức Chúa Trời”
  choice: Giữ nguyên cách gọi sát nghĩa, không giải thích ngay trong chính văn.
  alternative: Các hữu thể thần linh; các thiên sứ; những nhà cai trị; dòng dõi tin kính của Sết.
  rationale: Nguyên văn không giải quyết dứt khoát căn tính của họ; bản dịch cần bảo toàn sự mơ hồ và căng thẳng thần học ấy.
- issue: Ý nghĩa của הַנְּפִלִים
  choice: Phiên âm là “Nê-phi-lim”.
  alternative: Người khổng lồ; những kẻ sa ngã.
  rationale: Từ này hiếm và nghĩa chính xác còn tranh luận; phiên âm tránh đưa một cách giải thích riêng vào chính văn.
- issue: Nghĩa của אָדָם trong “các con gái loài người”
  choice: Dịch theo nghĩa tập thể là “loài người”.
  alternative: Các con gái của người nam; các con gái của A-đam.
  rationale: Trong cụm từ này, אָדָם chỉ con người nói chung; “loài người” vừa chính xác vừa tự nhiên trong tiếng Việt.
- issue: Quan hệ giữa Nê-phi-lim và những người hùng mạnh
  choice: Dùng “Đó là” để giữ lối quy chiếu của הֵמָּה mà không giải thích thêm.
  alternative: Khẳng định rõ những người con được sinh ra chính là Nê-phi-lim, hoặc coi hai nhóm hoàn toàn tách biệt.
  rationale: Cú pháp cho phép tranh luận về đối tượng được quy chiếu; không nên làm rõ hơn mức nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các thuật ngữ gây tranh luận ở mức sát nguyên văn; dùng “ăn ở với” như một cách nói nhã nhặn nhưng rõ nghĩa về quan hệ tính dục. Mọi dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
