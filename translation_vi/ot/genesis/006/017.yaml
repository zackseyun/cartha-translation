base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: vi
  text: Còn Ta—này, chính Ta sẽ đem nước lụt đến trên đất để hủy diệt mọi xác thịt có hơi thở sự sống dưới trời. Tất cả những gì ở trên đất đều sẽ chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: Còn Ta—này, chính Ta
  rationale: Đại từ độc lập cùng הִנְנִי tạo thế nhấn mạnh long trọng và đối chiếu chủ thể. Cách dịch này giữ cả sắc thái “còn Ta” lẫn lời báo trước đầy trực tiếp, mà vẫn tự nhiên trong tiếng Việt.
- source_word: מֵבִיא
  choice: sẽ đem ... đến
  rationale: Phân từ diễn tả hành động sắp được thực hiện từ góc nhìn của Đấng phán. Thì tương lai trong tiếng Việt truyền đạt rõ tính cận kề mà không thêm ý nghĩa ngoài văn bản.
- source_word: הַמַּבּוּל מַיִם
  choice: nước lụt
  rationale: Cụm Hê-bơ-rơ nêu trận đại hồng thủy và yếu tố nước. “Nước lụt” là cách nói hiện đại, tự nhiên, đồng thời giữ rõ tác nhân hủy diệt là nước.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Trong ngữ cảnh phạm vi rộng của trình thuật hồng thủy, “đất” chỉ cõi đất đối lập với trời; cách nói này tự nhiên hơn “trên trái đất” và không áp đặt khái niệm địa lý hiện đại.
- source_word: לְשַׁחֵת
  choice: để hủy diệt
  rationale: Giữ rõ quan hệ mục đích của động từ nguyên mẫu và mức độ nghiêm trọng của sự phán xét.
- source_word: כָּל בָּשָׂר
  choice: mọi loài xác thịt
  rationale: Giữ hình ảnh chủ chốt “mọi xác thịt” nhưng thêm “loài” để câu tiếng Việt tự nhiên và cho thấy cụm từ chỉ chung các sinh vật hữu hình, không chỉ con người.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: là loài mang hơi thở sự sống
  rationale: “Hơi thở” phù hợp nhất với sự sống hữu cơ trong ngữ cảnh này. “Mang” diễn đạt tự nhiên quan hệ “ở trong nó có” mà không thu hẹp đối tượng vào con người.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: dưới trời
  rationale: Đây là thành ngữ chỉ toàn cõi bên dưới bầu trời. Lược giới từ nguồn “từ” là cần thiết để có tiếng Việt tự nhiên mà vẫn giữ phạm vi bao quát.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: Tất cả những gì ở trên đất
  rationale: Giữ lực khái quát tuyệt đối của כֹּל và không tự ý giới hạn thêm thành một nhóm sinh vật cụ thể.
- source_word: יִגְוָע
  choice: đều sẽ chết
  rationale: Động từ chỉ việc chết hoặc tắt thở. “Sẽ chết” rõ ràng, trang nghiêm và chính xác hơn những cách nói bóng bẩy trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của רוּחַ trong רוּחַ חַיִּים
  choice: hơi thở sự sống
  alternative: thần khí sự sống
  rationale: Trong ngữ cảnh hồng thủy, cụm từ chủ yếu nói đến sinh khí làm cho các sinh vật sống, tương ứng với ngôn ngữ sáng tạo trong Sáng Thế Ký. Tuy vậy, רוּחַ cũng có thể mang nghĩa “thần khí,” nên phương án ấy được giữ trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “Ta” phù hợp với lời trực tiếp của Đức Chúa Trời. Dấu gạch ngang và “này, chính Ta” giữ sự nhấn mạnh long trọng của nguyên văn; các cụm “mọi loài xác thịt” và “dưới trời” duy trì sắc thái Kinh Thánh nhưng vẫn rõ nghĩa với độc giả phổ thông.
