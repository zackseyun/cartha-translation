revisions:
- from: Còn Ta—này, chính Ta sẽ đem nước lụt đến trên đất để hủy diệt mọi loài xác thịt dưới trời, là loài mang hơi thở sự sống[a]. Tất cả những gì ở trên đất đều sẽ chết.
  to: Còn Ta—này, chính Ta sẽ đem nước lụt đến trên đất để hủy diệt mọi xác thịt có hơi thở sự sống dưới trời. Tất cả những gì ở trên đất đều sẽ chết.
  rationale: Sửa câu đầu để mệnh đề “có hơi thở sự sống dưới trời” bổ nghĩa trực tiếp cho “mọi xác thịt,” tương ứng với cú pháp và phạm vi của nguyên văn. Bỏ “loài” vì không cần thiết và có thể chuyển ý sang phân loại loài. Điều chỉnh nhẹ chú thích cho tự nhiên hơn, vẫn bảo tồn tính mơ hồ thực sự của רוּחַ.
  reviewer_model: gpt-5.6-terra
