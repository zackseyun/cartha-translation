    issue: Cụm «Sự cuối cùng của mọi xác thịt» kém tự nhiên.
    rationale: «Kết cục của mọi xác thịt» diễn đạt qēṣ tự nhiên hơn trong tiếng Việt hiện đại, vẫn không xác định trước chi tiết của sự chấm dứt.
  - severity: medium
    issue: Chú thích a dùng «dành cho» thay vì phản ánh quan hệ sở hữu/phạm vi của nguyên văn.
    rationale: Cụm «Một kết cuộc dành cho mọi xác thịt» có thể gợi một kết cuộc được ấn định cho họ, trong khi phương án văn bản là «một kết cục của mọi xác thịt đã đến trước mặt Ta». Sửa để chú thích thực sự nêu biến thể xác định/không xác định của קֵץ.
