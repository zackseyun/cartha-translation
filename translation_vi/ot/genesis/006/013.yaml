  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: vi
  text: 'Bấy giờ Đức Chúa Trời phán với Nô-ê: “Kết cục của mọi xác thịt đã đến trước mặt Ta,[a] vì mặt đất đầy dẫy bạo lực do chúng gây ra. Kìa, Ta sắp hủy diệt chúng cùng với mặt đất.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Một kết cục của mọi xác thịt đã đến trước mặt Ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ sát nghĩa: “Ta đang hủy diệt chúng với mặt đất.” Cũng có thể hiểu: “Ta đang hủy diệt chúng và mặt đất,” coi “mặt đất” là tân ngữ thứ hai.'
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: sự cuối cùng của mọi xác thịt
  rationale: Giữ phạm vi rộng và âm hưởng trang trọng của cụm Hê-bơ-rơ, không thu hẹp thành chỉ loài người; “sự cuối cùng” diễn đạt sự chấm dứt đã được quyết định.
- source_word: בָּא לְפָנַי
  choice: đã đến trước mặt Ta
  rationale: Bảo tồn hình ảnh và sắc thái xét xử của thành ngữ Hê-bơ-rơ, thay vì diễn giải thành một phán quyết cụ thể.
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: mặt đất đầy dẫy bạo lực
  rationale: “Bạo lực” phản ánh nghĩa trực tiếp và phù hợp ngữ cảnh của חָמָס; “mặt đất” tự nhiên trong tiếng Việt và giữ phạm vi rộng của הָאָרֶץ.
- source_word: מִפְּנֵיהֶם
  choice: do chúng gây ra
  rationale: 'Diễn đạt tự nhiên quan hệ nguyên nhân: bạo lực tràn ngập mặt đất vì các sinh vật thuộc “mọi xác thịt”; đại từ “chúng” không tự ý thu hẹp thành con người.'
- source_word: וְהִנְנִי
  choice: Kìa, Ta sắp
  rationale: “Kìa” giữ sức nhấn mạnh chỉ xuất của הִנְנִי, còn “sắp” chuyển tải tính cận kề của hành động biểu thị bằng phân từ.
- source_word: מַשְׁחִיתָם
  choice: hủy diệt chúng
  rationale: Thể Hiphil của שׁחת trong lời phán xét này mang nghĩa gây hủy hoại, hủy diệt; cách dịch phù hợp với trận lụt sắp đến.
- source_word: אֶת־הָאָרֶץ
  choice: cùng với mặt đất
  rationale: Diễn đạt cách hiểu đồng hành/phạm vi phán xét mà không khiến độc giả tưởng mặt đất là công cụ hủy diệt; chú thích vẫn bảo lưu khó khăn cú pháp của nguyên văn.
theological_decisions:
- issue: Phạm vi của “mọi xác thịt”
  choice: Giữ cụm rộng, bao gồm các sinh vật sống chịu phán xét, không chỉ loài người.
  alternative: Chỉ toàn thể nhân loại.
  rationale: Trong mạch văn trận lụt, כָּל־בָּשָׂר thường có phạm vi rộng hơn loài người; bản dịch không thu hẹp điều nguyên văn để ngỏ.
- issue: Nghĩa của הָאָרֶץ
  choice: mặt đất
  alternative: xứ/đất đai
  rationale: Khung cảnh phổ quát của trình thuật và sự lặp lại trong câu ủng hộ nghĩa rộng; “mặt đất” cũng phù hợp tự nhiên với cả sự đầy dẫy bạo lực lẫn sự hủy hoại.
- issue: Quan hệ cú pháp của אֶת־הָאָרֶץ
  choice: cùng với mặt đất
  alternative: và mặt đất; với mặt đất; hủy diệt chúng khỏi mặt đất
  rationale: Cấu trúc sau một tân ngữ đã có sẵn không hoàn toàn minh bạch. Bản chính chọn nghĩa đồng hành tự nhiên trong tiếng Việt, còn chú thích ghi nhận sát văn và cách hiểu tân ngữ thứ hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ta” khi Đức Chúa Trời tự xưng theo quy ước kính trọng phổ biến trong tiếng Việt. “Mọi xác thịt” được giữ để bảo tồn phạm vi và liên hệ văn chương của nguyên văn; “cùng với mặt đất” làm rõ nghĩa trong câu chính nhưng không che giấu sự khó hiểu về cú pháp, vốn được ghi ở chú thích.
