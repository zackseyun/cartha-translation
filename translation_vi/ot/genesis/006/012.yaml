  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: vi
  text: Đức Chúa Trời thấy trái đất, và kìa, trái đất đã trở nên hư hoại[a], vì mọi xác thịt đã làm hư hoại đường lối của mình trên trái đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã bị bại hoại” hoặc “đã bị tàn phá.” Động từ Hê-bơ-rơ có thể nói đến sự suy đồi về đạo đức cũng như tình trạng hư hoại hoặc tàn phá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: nhìn thấy
  rationale: Diễn đạt trực tiếp động từ ראה trong mạch kể chuyện, không thêm sắc thái phán xét vốn không được nói rõ trong từ này.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, אֱלֹהִים chỉ Đức Chúa Trời duy nhất; cách gọi này trang trọng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: הָאָרֶץ
  choice: đất
  rationale: Giữ độ rộng nghĩa của אֶרֶץ, có thể chỉ đất/địa cầu trong bối cảnh nạn lụt, đồng thời tránh áp đặt một thuật ngữ khoa học hiện đại.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ chức năng thu hút sự chú ý cách sống động và nhịp điệu trang trọng của הִנֵּה.
- source_word: נִשְׁחָתָה
  choice: đã bị hủy hoại
  rationale: Dạng Niphal của שׁחת mô tả tình trạng đất trở nên hư hoại. “Bị hủy hoại” có thể bao hàm cả sự suy đồi lẫn hậu quả tàn phá, không thu hẹp hoàn toàn vào bình diện đạo đức.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu nguyên nhân của tình trạng vừa được nêu, tự nhiên trong tiếng Việt hiện đại.
- source_word: הִשְׁחִית
  choice: đã làm hư hỏng
  rationale: Dạng Hiphil mang nghĩa gây nên sự hư hoại. Cách dịch này giữ liên hệ ý nghĩa với “bị hủy hoại” nhưng vẫn tự nhiên khi đối tượng là “đường lối”.
- source_word: כָּל בָּשָׂר
  choice: mọi xác thịt
  rationale: Giữ nguyên thành ngữ Hê-bơ-rơ và độ mở về phạm vi, thay vì quyết định đó chỉ là toàn thể loài người hay mọi sinh vật.
- source_word: דַּרְכּוֹ
  choice: đường lối mình
  rationale: Giữ ẩn dụ “đường/lối” của דֶּרֶךְ để chỉ nếp sống hoặc hành vi; “mình” quy chiếu tự nhiên về tập hợp “mọi xác thịt”.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Diễn đạt trực tiếp cụm giới từ và nhất quán với lần xuất hiện trước của הָאָרֶץ.
theological_decisions:
- issue: Sắc thái của שׁחת trong hai mệnh đề
  choice: Dịch “bị hủy hoại” và “làm hư hỏng”, giữ cả ý suy đồi lẫn hậu quả tàn phá.
  alternative: “bị bại hoại ... làm bại hoại” hoặc “bị phá hủy ... phá hủy”
  rationale: Gốc từ lặp lại liên kết tình trạng của đất với hành động của mọi xác thịt. Tiếng Việt khó dùng cùng một từ thật tự nhiên cho cả “đất” và “đường lối”; hai cách diễn đạt gần nghĩa giữ mối liên hệ mà không giới hạn שׁחת vào thuần túy đạo đức hay thuần túy vật chất.
- issue: Phạm vi của כָּל בָּשָׂר
  choice: Giữ thành ngữ “mọi xác thịt”.
  alternative: “toàn thể loài người” hoặc “mọi sinh vật”
  rationale: Nguyên văn có độ rộng có thể được hiểu theo nhiều cách trong ngữ cảnh. Giữ thành ngữ tránh giải quyết thay cho người đọc một vấn đề mà câu Hê-bơ-rơ vẫn để mở.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Kìa” giữ sắc thái kể chuyện sống động; “mọi xác thịt” hơi mang màu sắc Kinh Thánh nhưng cần thiết để bảo toàn thành ngữ và sự mơ hồ của nguyên văn. Dấu chân chú [a] xuất hiện ngay sau cụm từ được chú giải.
