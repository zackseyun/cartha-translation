    issue: Cụm “thì chọn ai tùy ý mà lấy làm vợ” đặt trọng tâm vào “chọn” và dùng liên từ “thì” theo quan hệ hệ quả.
    rationale: 'Nguyên văn liên kết hai động từ tường thuật: họ thấy rằng các con gái loài người đẹp, rồi họ lấy vợ từ/bất cứ những người nào họ đã chọn. Nên nêu rõ “họ lấy làm vợ” là động từ chính và dùng “bất cứ ai họ chọn” để phản ánh ý không giới hạn.'
