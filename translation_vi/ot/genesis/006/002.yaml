  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: vi
  text: Các con trai của Đức Chúa Trời[a] thấy rằng các con gái loài người xinh đẹp[b], và họ lấy làm vợ bất cứ ai họ chọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các hữu thể thần linh.” Danh tính của “các con trai của Đức Chúa Trời” còn được tranh luận; những cách hiểu chính gồm các hữu thể trên trời, các nhà cai trị loài người, hoặc dòng dõi Sết.'
    reason: alternative_reading
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng từ có nghĩa cơ bản là “tốt”; trong ngữ cảnh này, từ ấy chỉ vẻ ngoài hấp dẫn.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: các con trai của Đức Chúa Trời
  rationale: Giữ sát cấu trúc tiếng Hê-bơ-rơ và không quyết định danh tính vốn còn gây tranh luận của nhóm này.
- source_word: בְּנוֹת הָאָדָם
  choice: các con gái loài người
  rationale: אָדָם ở đây có nghĩa tập thể là loài người; cách dịch này tự nhiên trong tiếng Việt và duy trì sự đối ứng với “các con trai của Đức Chúa Trời”.
- source_word: כִּי טֹבֹת הֵנָּה
  choice: xinh đẹp
  rationale: Trong ngữ cảnh, טֹבֹת chỉ vẻ ngoài hấp dẫn; “xinh đẹp” diễn đạt tự nhiên mà không gán nghĩa đạo đức.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: lấy làm vợ
  rationale: נָשִׁים có thể là “phụ nữ” hoặc “vợ”; đi với động từ לקח trong ngữ cảnh này, cụm từ chỉ việc lấy vợ. Ý vị lợi cho bản thân của לָהֶם được câu tiếng Việt hàm chứa tự nhiên.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: chọn ai tùy ý
  rationale: Diễn đạt tự nhiên ý lựa chọn không bị giới hạn của cụm tiếng Hê-bơ-rơ, đồng thời giữ con người làm đối tượng.
theological_decisions:
- issue: Danh tính của “các con trai của Đức Chúa Trời”
  choice: Giữ nguyên cách gọi sát nghĩa mà không xác định họ là ai.
  alternative: Các hữu thể thần linh; các nhà cai trị loài người; hoặc dòng dõi Sết.
  rationale: Câu tiếng Hê-bơ-rơ không tự giải quyết vấn đề này; bản dịch cần bảo tồn sự mơ hồ và căng thẳng thần học chân thực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “thì chọn ai tùy ý mà lấy làm vợ” giữ mạch thấy–chọn–lấy của nguyên văn, đồng thời tự nhiên trong tiếng Việt.
