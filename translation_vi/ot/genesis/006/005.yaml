  terminology: “Yahweh” bảo tồn danh riêng יהוה; “loài người” phản ánh đúng nghĩa tập thể của הָאָדָם; “lòng” phù hợp với nhân học Hê-bơ-rơ. “Sự gian ác” và “điều ác” diễn đạt phù hợp hai cách dùng của gốc רעה/רע trong câu.
  issues:
