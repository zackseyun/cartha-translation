source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: vi
  text: Yahweh thấy rằng sự gian ác của loài người trên đất là rất lớn, và mọi khuynh hướng trong những suy tính của lòng họ[a] suốt ngày chỉ là điều ác.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ dùng số ít: “lòng người ấy”, vì “loài người” được nhìn như một tập thể.'
    reason: grammatical_clarification
  - marker: b
    text: 'Cũng có thể dịch: “mọi lúc đều chỉ là điều ác.” Nguyên văn là “suốt ngày chỉ là điều ác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy rằng
  rationale: Dạng wayyiqtol tiếp nối mạch tự sự; tiếng Việt không cần thêm liên từ một cách máy móc, còn “rằng” giới thiệu tự nhiên nội dung Yahweh nhận thấy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng chuyển tự thông dụng, thay vì thay thế bằng một tước hiệu.
- source_word: רַבָּה רָעַת הָאָדָם
  choice: sự gian ác của loài người ... thật lớn
  rationale: רָעָה trong ngữ cảnh này chỉ sự xấu xa về đạo đức; רַבָּה nhấn mạnh mức độ lớn. הָאָדָם mang nghĩa tập thể nên “loài người” tự nhiên và chính xác trong tiếng Việt.
- source_word: בָּאָרֶץ
  choice: trên đất
  rationale: Trong bối cảnh nguyên thủy của Sáng Thế Ký, אֶרֶץ chỉ toàn cõi đất chứ không phải một lãnh thổ riêng.
- source_word: כָל יֵצֶר
  choice: mọi khuynh hướng
  rationale: יֵצֶר diễn tả điều được hình thành hoặc xu hướng thúc đẩy bên trong; “khuynh hướng” giữ được sắc thái ấy mà không thu hẹp thành một ý định đơn lẻ.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: những ý tưởng của lòng họ
  rationale: Giữ hình ảnh nhân học Hê-bơ-rơ về “lòng” như trung tâm của tư tưởng, ý chí và ham muốn; số ít đại diện trong tiếng Hê-bơ-rơ được diễn đạt bằng số nhiều tập thể tự nhiên trong tiếng Việt.
- source_word: רַק רַע כָּל הַיּוֹם
  choice: suốt ngày chỉ là điều ác
  rationale: Giữ cả lực giới hạn của רַק và cách nói theo thời gian כָּל הַיּוֹם, đồng thời diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản văn có danh riêng יהוה; giữ “Yahweh” bảo tồn sự phân biệt giữa tên riêng và tước hiệu mà không áp đặt truyền thống giáo phái.
- issue: Nghĩa tập thể của הָאָדָם
  choice: loài người
  alternative: con người / người nam
  rationale: Trong câu này, הָאָדָם chỉ toàn thể nhân loại chứ không riêng A-đam hay nam giới; “loài người” chuyển tải rõ nghĩa tập thể.
- issue: Số ít đại diện trong לִבּוֹ
  choice: lòng họ
  alternative: lòng người ấy / lòng nó
  rationale: Đại từ số ít nối với danh từ tập thể הָאָדָם. Tiếng Việt dùng “họ” để thể hiện tự nhiên rằng lời phán xét áp dụng cho loài người nói chung, không thay đổi phạm vi của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “lòng” theo cách nói Kinh Thánh nhưng dùng “loài người” và “họ” để biểu đạt tự nhiên nghĩa tập thể trong tiếng Việt.
