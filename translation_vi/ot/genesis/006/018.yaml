  text: וַ/הֲקִמֹתִ֥י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וּ/בָאתָ֙ אֶל הַ/תֵּבָ֔ה אַתָּ֕ה וּ/בָנֶ֛י/ךָ וְ/אִשְׁתְּ/ךָ֥ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: vi
  text: Nhưng Ta sẽ lập giao ước của Ta với con[a], và con sẽ vào tàu—con, các con trai của con, vợ con và vợ các con trai của con—cùng vào với con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta sẽ xác nhận giao ước của Ta với con.” Trong ngữ cảnh giao ước, động từ Hê-bơ-rơ có thể mang một trong hai sắc thái này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Nhưng Ta sẽ lập
  rationale: Dạng Hiphil của קום đi với בְּרִית có thể mang nghĩa lập hoặc xác nhận một giao ước. “Lập” tự nhiên, phù hợp với lời hứa hướng tới tương lai; “nhưng” diễn đạt sự tương phản với lời tuyên bố hủy diệt ngay trước đó.
- source_word: בְּרִיתִי
  choice: giao ước của Ta
  rationale: “Giao ước” là thuật ngữ tiếng Việt chuẩn cho בְּרִית và giữ được ý nghĩa thần học xuyên suốt Kinh Thánh.
- source_word: אִתָּךְ
  choice: với con
  rationale: Giới từ này chỉ mối quan hệ giao ước; “với con” vừa sát nghĩa vừa tự nhiên.
- source_word: וּבָאתָ
  choice: Con sẽ vào
  rationale: בוא có thể là đến, đi vào hoặc bước vào; khi đích đến là con tàu, “vào” rõ ràng và tự nhiên nhất.
- source_word: הַתֵּבָה
  choice: tàu
  rationale: Trong trình thuật Nô-ê, תֵּבָה chỉ con tàu lớn dùng để bảo toàn sự sống. “Tàu” là cách diễn đạt tiếng Việt thông dụng, rõ nghĩa trong ngữ cảnh.
- source_word: אַתָּה
  choice: con
  rationale: Đại từ độc lập tạo nét nhấn mạnh. Bản dịch thể hiện điều này bằng cách lặp lại “con” ở đầu danh sách sau dấu gạch ngang.
- source_word: וּבָנֶיךָ
  choice: các con trai con
  rationale: Tiếng Hê-bơ-rơ nói cụ thể là các con trai, không phải con cái nói chung.
- source_word: וְאִשְׁתְּךָ
  choice: vợ con
  rationale: Cách dịch trực tiếp, tự nhiên trong quan hệ gia đình.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: vợ của các con trai con
  rationale: Phản ánh sát cấu trúc “những người vợ của các con trai con” và ít diễn giải hơn “các con dâu con”.
theological_decisions:
- issue: Ý nghĩa của cách diễn đạt về giao ước
  choice: 'lời hứa hướng tới tương lai: “Ta sẽ lập giao ước của Ta với con”'
  alternative: “Ta sẽ xác nhận giao ước của Ta với con”
  rationale: Tiếng Hê-bơ-rơ có thể chỉ việc thiết lập giao ước hoặc xác nhận một giao ước. Chính câu này không giải quyết dứt khoát câu hỏi thần học ấy, nên bản chính dùng cách nói chuẩn “lập giao ước” và giữ khả năng kia trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta–con” thể hiện lời Đức Chúa Trời trực tiếp phán với Nô-ê. Dấu gạch ngang giữ nét nhấn mạnh của đại từ độc lập אַתָּה và giới thiệu danh sách những người cùng vào tàu.
