source:
  edition: WLC
  text: אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּ/דֹֽרֹתָ֑י/ו אֶת הָֽ/אֱלֹהִ֖ים הִֽתְהַלֶּךְ נֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: vi
  text: Đây là gia phả của Nô-ê. Nô-ê là một người công chính, trọn vẹn giữa những người cùng thời[a]. Nô-ê bước đi với Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong thời đại của ông.” Cụm Hê-bơ-rơ בְּדֹרֹתָיו có thể chỉ những người đương thời với Nô-ê hoặc thời kỳ ông sống.
    reason: 'Bảo tồn tính mơ hồ của cụm בְּדֹרֹתָיו: có thể nói đến những người cùng thời hoặc thời đại/thời kỳ của Nô-ê.'
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Đây là dòng dõi
  rationale: Giữ thuật ngữ cấu trúc תּוֹלְדֹת xuyên suốt Sáng Thế Ký, đồng thời dùng cú pháp tiếng Việt tự nhiên cho công thức mở đầu.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אִישׁ צַדִּיק
  choice: một người công chính
  rationale: Diễn đạt đúng danh từ giống đực chỉ Nô-ê và giữ sắc thái đạo đức, thần học của צַדִּיק.
- source_word: תָּמִים
  choice: không chỗ trách được
  rationale: Chỉ sự toàn vẹn về phẩm hạnh, không nhất thiết hàm ý hoàn toàn vô tội; cách nói trang trọng và dễ hiểu trong tiếng Việt.
- source_word: בְּדֹרֹתָיו
  choice: giữa những người cùng thời
  rationale: Trong ngữ cảnh mô tả phẩm hạnh, cụm số nhiều này tự nhiên nhất khi chỉ những người thuộc thời đại của Nô-ê; cách hiểu theo thời kỳ được giữ trong chú thích.
- source_word: אֶת־הָאֱלֹהִים הִתְהַלֶּךְ
  choice: đồng đi với Đức Chúa Trời
  rationale: Giữ hình ảnh 'đi' và ý nghĩa về mối tương giao, nếp sống với Đức Chúa Trời; 'đồng đi' là cách diễn đạt Kinh Thánh quen thuộc nhưng vẫn rõ nghĩa.
theological_decisions:
- issue: Ý nghĩa của תָּמִים khi mô tả Nô-ê
  choice: không chỗ trách được, theo nghĩa có phẩm hạnh toàn vẹn
  alternative: hoàn hảo; không tì vết
  rationale: Bản văn khen ngợi phẩm hạnh của Nô-ê giữa một thế hệ bại hoại nhưng không buộc phải khẳng định ông tuyệt đối vô tội.
- issue: Phạm vi nghĩa của בְּדֹרֹתָיו
  choice: giữa những người cùng thời
  alternative: trong thời đại của ông; qua các thế hệ của ông
  rationale: Dạng số nhiều tiếng Hê-bơ-rơ cho phép hơn một cách hiểu. Bản chính dùng lối diễn đạt tự nhiên theo ngữ cảnh, còn chú thích bảo tồn cách hiểu theo thời kỳ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ công thức cấu trúc “Đây là dòng dõi,” thuật ngữ “công chính,” cùng hình ảnh “đồng đi với Đức Chúa Trời.”
