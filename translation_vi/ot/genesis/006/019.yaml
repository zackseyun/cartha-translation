- from: Và từ mọi sinh vật thuộc mọi loài xác thịt[a], con phải đem vào tàu hai con mỗi loài để chúng được sống cùng con[b]; chúng phải là con đực và con cái.
  to: Từ mọi sinh vật có xác thịt[a], con phải đem vào tàu hai con mỗi loài để giữ chúng sống với con; chúng phải là đực và cái.
  rationale: Sửa cụm từ về “xác thịt” để phản ánh thành ngữ nguyên ngữ mà không thêm ý “mọi loài” vào sai vị trí; chỉnh động từ mục đích để giữ sắc thái bảo tồn sự sống. Loại chú thích b vì không cần thiết và thay bằng chú thích giải thích thành ngữ tại đúng neo chú thích.
  reviewer_model: gpt-5.6-terra
