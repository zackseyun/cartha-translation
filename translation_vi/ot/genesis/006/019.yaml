base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: vi
  text: Từ mọi sinh vật có xác thịt[a], con phải đem vào tàu hai con mỗi loài để giữ chúng sống với con; chúng phải là đực và cái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “mọi xác thịt” là một thành ngữ Hê-bơ-rơ chỉ các sinh vật sống có thân xác.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי
  choice: Và từ mọi sinh vật
  rationale: Giữ liên từ và ý phân phối của מִכָּל; “sinh vật” là cách nói tự nhiên, trang trọng và đủ rộng cho הַחַי được dùng như danh từ.
- source_word: מִכָּל בָּשָׂר
  choice: thuộc mọi loài xác thịt
  rationale: Giữ hình ảnh “xác thịt” của tiếng Hê-bơ-rơ, đồng thời thêm “loài” để câu tiếng Việt tự nhiên và thể hiện phạm vi các sinh vật có thân xác.
- source_word: שְׁנַיִם מִכֹּל
  choice: hai con mỗi loài
  rationale: 'Diễn đạt rõ lực phân phối: hai cá thể từ mỗi loại đang được nói đến; danh từ loại “con” phù hợp với ngữ cảnh sinh vật giống đực và giống cái.'
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: con phải đem vào tàu
  rationale: Hiphil của בוא mang nghĩa “đem vào”; “phải” truyền đạt lực chỉ thị của động từ chưa hoàn thành trong lời truyền lệnh. “Tàu” là từ Việt hiện đại, tự nhiên cho chiếc תֵּבָה của Nô-ê.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: để chúng được sống cùng con
  rationale: Truyền đạt mục đích và sắc thái khiến/bảo tồn sự sống của Hiphil, đồng thời giữ cụm “cùng con” gần với אִתָּךְ.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: chúng phải là con đực và con cái
  rationale: Giữ trực tiếp cặp giới tính sinh học và lực yêu cầu của mệnh đề trong ngữ cảnh chỉ thị.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ Hê-bơ-rơ “xác thịt” để bảo toàn sắc thái nguyên ngữ, nhưng dùng “sinh vật” và “hai con mỗi loài” cho tự nhiên trong tiếng Việt. Đại từ “con” phản ánh lời Đức Chúa Trời trực tiếp phán với Nô-ê trong văn mạch.
