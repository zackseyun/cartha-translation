    rationale: Cụm này trong tiếng Việt thường nói một người là đối tượng gây sự hài lòng (“làm đẹp lòng” ai), trong khi tiếng Hê-bơ-rơ nói Nô-ê tìm được sự ưu ái/ân huệ trong sự đánh giá của Yahweh. Cần dùng cách diễn đạt rõ Nô-ê là người nhận sự ưu ái.
  - severity: medium
    issue: Danh יהוה được dịch là “Đức Giê-hô-va” thay vì “Yahweh”
    rationale: Bản nguồn và audit trail của POB quy định dùng “Yahweh” cho Tứ tự danh. “Giê-hô-va” là dạng truyền thống quen thuộc nhưng không nhất quán với quyết định dự án cho phân đoạn này.
  revised_text: Nhưng Nô-ê được Yahweh ưu ái.[a]
