base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: vi
  text: Nhưng Nô-ê được Yahweh ưu ái.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Nhưng Nô-ê tìm thấy ân huệ trước mắt Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Nhưng Nô-ê
  rationale: Liên từ וְ về hình thức có thể là “và”, nhưng trong mạch văn này nó nêu sự tương phản giữa Nô-ê với sự gian ác của loài người và sự phán xét sắp đến; “nhưng” diễn đạt tự nhiên chức năng ấy trong tiếng Việt.
- source_word: מָצָא חֵן
  choice: được đẹp lòng
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “tìm thấy ân huệ” và là một thành ngữ chỉ việc được ai ưu ái hoặc chấp nhận. “Được đẹp lòng” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt, đồng thời không áp đặt sắc thái tín lý về “ân điển” lên câu này.
- source_word: בְּ/עֵינֵי
  choice: '[hàm chứa trong] được đẹp lòng'
  rationale: Thành ngữ nghĩa đen “trong mắt” biểu thị sự đánh giá hay cái nhìn của một người. Tiếng Việt tự nhiên diễn đạt toàn cụm מָצָא חֵן בְּעֵינֵי bằng “được đẹp lòng”; bản dịch nghĩa đen được giữ trong chú thích.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng danh riêng quen thuộc trong tiếng Việt để biểu thị trực tiếp danh giao ước יהוה, thay vì thay thế bằng một tước hiệu; tiền tố “Đức” phù hợp lối xưng hô tôn kính tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của חֵן đối với thái độ của Đức Chúa Trời dành cho Nô-ê
  choice: được đẹp lòng
  alternative: tìm thấy ân huệ / được ơn
  rationale: Cách chọn này giữ ý Nô-ê được YHWH ưu ái mà không thu hẹp חֵן thành một công thức tín lý hậu kỳ; chú thích bảo tồn hình thức và khả năng dịch sát hơn.
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh / Đức Chúa Hằng Hữu
  rationale: Bản nguồn dùng trực tiếp Tứ tự danh. Việc dùng một dạng phiên âm danh riêng giữ sự phân biệt giữa danh và tước hiệu, không thay bằng “CHÚA”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, ngắn gọn và trang trọng. “Được đẹp lòng” ưu tiên tính tự nhiên, còn chú thích giữ thành ngữ Hê-bơ-rơ sát chữ và sắc thái “ân huệ”.
