base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: vi
  text: Từ các loài chim, tùy theo từng loại[a]; từ các loài gia súc, tùy theo từng loại; và từ mọi loài vật bò trên đất, tùy theo từng loại, mỗi loại hai con sẽ đến với con để con giữ chúng sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “theo giống của chúng”; từ Hê-bơ-rơ ở đây chỉ loại hoặc nhóm, không nhất thiết là “loài” theo phân loại sinh học hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעוֹף
  choice: các loài chim
  rationale: עוֹף chỉ các sinh vật có cánh, và trong ngữ cảnh liệt kê các nhóm động vật, “các loài chim” là cách diễn đạt tự nhiên, dễ hiểu nhất trong tiếng Việt hiện đại.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: tùy theo từng loại
  rationale: מִין chỉ một loại hay nhóm phân loại, không nhất thiết tương ứng với khái niệm “loài” của sinh học hiện đại. Cách dịch này giữ ý phân loại và phù hợp với cả các danh từ tập hợp giống đực lẫn giống cái trong tiếng Hê-bơ-rơ.
- source_word: הַבְּהֵמָה
  choice: các loài gia súc
  rationale: בְּהֵמָה ở đây chỉ nhóm thú nuôi trên cạn, được phân biệt với chim và các sinh vật bò trên đất. “Gia súc” rõ nghĩa và không thu hẹp vào riêng bò.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: mọi loài vật bò trên đất
  rationale: רֶמֶשׂ chỉ các sinh vật nhỏ di chuyển hoặc bò sát mặt đất; “vật bò trên đất” tránh giới hạn nghĩa vào lớp bò sát theo phân loại sinh học hiện đại, đồng thời phản ánh הָאֲדָמָה là đất.
- source_word: שְׁנַיִם מִכֹּל
  choice: mỗi loại hai con
  rationale: 'Cụm từ có nghĩa phân phối: hai cá thể từ mỗi nhóm vừa nêu. Trật tự này tự nhiên trong tiếng Việt và giữ rõ số lượng hai con cho từng loại.'
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: sẽ đến với con
  rationale: בוא với אֶל diễn tả chuyển động hướng đến Nô-ê. Bản dịch không thêm ý “vào tàu”, vì điều đó thuộc ngữ cảnh nhưng không được nói trực tiếp trong mệnh đề này.
- source_word: לְהַחֲיוֹת
  choice: để con giữ chúng sống
  rationale: Động từ חיה ở thể Hiphil mang nghĩa khiến cho sống hoặc bảo toàn sự sống. Cách dịch này thể hiện rõ mục đích và vai trò của Nô-ê mà không thêm ý ngoài văn bản.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cấu trúc lặp “tùy theo từng loại” để giữ nhịp liệt kê của nguyên văn; dùng đại từ “con” vì lời Đức Chúa Trời đang trực tiếp phán với Nô-ê trong ngữ cảnh.
