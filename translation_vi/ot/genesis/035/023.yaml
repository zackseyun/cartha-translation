  yaml_path: translation/ot/genesis/035/023.yaml
  text: 'The sons of Leah: Jacob’s firstborn[a], Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: vi
  text: 'Các con trai của Lê-a là: Ru-bên, con trưởng của Gia-cốp, Si-mê-ôn, Lê-vi, Giu-đa, Y-sa-ca và Sa-bu-lôn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: Các con trai của Lê-a
  rationale: Danh từ số nhiều dạng liên kết בְּנֵי mở đầu danh sách sáu người con trai của Lê-a; “các con trai” chính xác và tự nhiên trong tiếng Việt.
- source_word: בְּכוֹר יַעֲקֹב
  choice: con trưởng của Gia-cốp
  rationale: Cụm liên kết chỉ Ru-bên là người con đầu lòng của Gia-cốp. “Con trưởng” là cách diễn đạt gọn, tự nhiên trong danh sách gia phả và không đồng nhất với danh hiệu thần học “Con Đầu Lòng” ở các ngữ cảnh khác.
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Phiên âm tên riêng theo hình thức quen dùng trong Kinh Thánh tiếng Việt.
- source_word: שִׁמְעוֹן
  choice: Si-mê-ôn
  rationale: Phiên âm tên riêng theo hình thức quen dùng trong Kinh Thánh tiếng Việt.
- source_word: לֵוִי
  choice: Lê-vi
  rationale: Phiên âm tên riêng theo hình thức quen dùng trong Kinh Thánh tiếng Việt.
- source_word: יְהוּדָה
  choice: Giu-đa
  rationale: Phiên âm tên riêng theo hình thức quen dùng trong Kinh Thánh tiếng Việt.
- source_word: יִשָּׂשכָר
  choice: Y-sa-ca
  rationale: Phiên âm tên riêng theo hình thức quen dùng trong Kinh Thánh tiếng Việt.
- source_word: זְבוּלֻן
  choice: Sa-bu-lôn
  rationale: Phiên âm tên riêng theo hình thức quen dùng trong Kinh Thánh tiếng Việt.
- source_word: וְ
  choice: dấu phẩy; và trước tên cuối
  rationale: Tiếng Hê-bơ-rơ lặp liên từ giữa các tên; tiếng Việt hiện đại dùng dấu phẩy và “và” trước mục cuối để giữ cấu trúc liệt kê mà vẫn tự nhiên.
