  to: Họ trao cho Gia-cốp tất cả các thần ngoại bang ở trong tay họ, cùng những chiếc khuyên đeo ở tai họ[a]. Gia-cốp giấu chúng dưới cây terebinth[b] ở gần Si-chem.
  rationale: Chỉnh sửa tối thiểu để câu tự sự trung tính hơn, tự nhiên hơn trong tiếng Việt hiện đại, và tránh thêm sắc thái suy luận hoặc lượng từ không được lặp lại trong nguyên văn. Các thuật ngữ chính và hai chú thích từ vựng được giữ nguyên.
