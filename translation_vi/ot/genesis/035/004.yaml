    issue: “Vậy,” diễn giải lực liên kết của wayyiqtol.
    rationale: וַיִּתְּנוּ chủ yếu tiếp tục trần thuật (“và/rồi họ trao”); “Vậy” có thể gợi một kết luận từ câu trước. Tiếng Việt có thể bỏ từ nối mà vẫn thể hiện diễn tiến tự sự.
  - severity: low
    issue: “đang ở trong tay họ” không tự nhiên bằng “ở trong tay họ.”
    rationale: Nguyên văn dùng cụm định ngữ chỉ vị trí/sở hữu, không nhấn mạnh hành động đang diễn ra. Dạng không có “đang” sát nghĩa và trôi chảy hơn.
  - severity: low
    issue: “tất cả những vật ấy” thêm lượng từ trong mệnh đề Gia-cốp giấu các vật.
    rationale: אֹתָם chỉ “chúng”; dù quy chiếu đến các vật vừa nêu, bản văn không lặp lại כָּל ở đây. “Chúng” bảo toàn cách diễn đạt ngắn gọn của nguyên văn.
