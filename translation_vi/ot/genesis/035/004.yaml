  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּתְּנ֣וּ אֶֽל יַעֲקֹ֗ב אֵ֣ת כָּל אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/יָדָ֔/ם וְ/אֶת הַ/נְּזָמִ֖ים אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יִּטְמֹ֤ן אֹתָ/ם֙ יַעֲקֹ֔ב תַּ֥חַת הָ/אֵלָ֖ה אֲשֶׁ֥ר עִם שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: vi
  text: Họ trao cho Gia-cốp tất cả các thần ngoại bang ở trong tay họ, cùng những chiếc khuyên đeo ở tai họ[a]. Gia-cốp giấu chúng dưới cây terebinth[b] ở gần Si-chem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Danh từ Hê-bơ-rơ có thể chỉ vòng hoặc khuyên đeo ở những vị trí khác nhau; tại đây, cụm từ theo sau xác định rằng chúng được đeo ở tai.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “cây sồi”; từ Hê-bơ-rơ nhiều khả năng chỉ cụ thể cây terebinth.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Vậy, họ trao
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “Vậy” diễn đạt tự nhiên quan hệ với mệnh lệnh ở câu trước.
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: tất cả các thần ngoại bang
  rationale: Cụm từ chỉ các thần không thuộc sự thờ phượng Đức Chúa Trời của giao ước; cách dịch này rõ ràng mà không thêm nhận định về hình dạng hay chức năng của các vật ấy.
- source_word: אֲשֶׁר בְּיָדָם
  choice: đang ở trong tay họ
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ, thay vì diễn giải thành “họ sở hữu”.
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: những chiếc khuyên đeo ở tai họ
  rationale: נְזָמִים có thể chỉ nhiều loại vòng hoặc khuyên, còn mệnh đề theo sau xác định vị trí là tai; cách diễn đạt này tự nhiên trong tiếng Việt và giữ thông tin định vị của nguyên văn.
- source_word: וַיִּטְמֹן אֹתָם
  choice: Gia-cốp giấu tất cả những vật ấy
  rationale: טמן có nghĩa là giấu hoặc chôn giấu. “Giấu” giữ phạm vi nghĩa rộng của động từ, không xác quyết thêm rằng các vật đã được chôn xuống đất.
- source_word: תַּחַת הָאֵלָה
  choice: dưới cây terebinth
  rationale: אֵלָה nhiều khả năng chỉ cây terebinth hơn là cây sồi. Giữ tên cây theo cách phiên âm, kèm chú thích về cách dịch truyền thống.
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: ở gần Si-chem
  rationale: Khi đi với địa danh, עִם diễn tả sự ở bên hoặc gần; “ở gần” là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của các vật được trao lại và đem giấu
  choice: Bản dịch phân biệt “các thần ngoại bang” với những chiếc khuyên tai, nhưng không giải thích lý do các khuyên cũng bị giao nộp.
  alternative: Xem các khuyên chỉ là đồ trang sức có giá trị, hoặc khẳng định chúng là bùa hay vật thờ thần tượng.
  rationale: Nguyên văn nêu cả hai nhóm vật nhưng không nói rõ bản thân những chiếc khuyên có ý nghĩa thờ cúng hay chỉ gắn với nếp sống trước đó; bản dịch giữ nguyên sự chưa xác định này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ các tên riêng quen dùng “Gia-cốp” và “Si-chem”; dùng “cây terebinth” để ưu tiên độ chính xác nguyên ngữ, đồng thời giải thích bằng chú thích.
