  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: vi
  text: Sau đó, Đức Chúa Trời đi lên khỏi ông tại nơi Ngài đã phán với ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ dùng động từ “đi lên,” giữ hình ảnh Đức Chúa Trời rời cuộc gặp theo hướng đi lên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: đi lên
  rationale: Động từ עלה ở thể qal diễn tả chuyển động đi lên. Cách dịch này giữ nguyên hình ảnh không gian trong tiếng Hê-bơ-rơ, thay vì diễn giải thành “rời đi”.
- source_word: מֵעָלָיו
  choice: rời khỏi ông
  rationale: Cụm giới từ có nghĩa sát là “từ trên ông,” nhưng cách nói ấy không tự nhiên trong tiếng Việt. “Rời khỏi ông” truyền đạt điểm xuất phát của sự đi lên và phù hợp với ngữ cảnh Đức Chúa Trời rời cuộc gặp với Gia-cốp.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thái số nhiều nhưng đi với động từ số ít và trong ngữ cảnh chỉ Đức Chúa Trời duy nhất.
- source_word: בַּמָּקוֹם
  choice: tại nơi
  rationale: Giới từ ב kết hợp với מָקוֹם chỉ địa điểm; “tại nơi” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר
  choice: nơi
  rationale: Đại từ quan hệ quy chiếu về địa điểm, nên “nơi” thể hiện tự nhiên chức năng của mệnh đề quan hệ.
- source_word: דִּבֶּר אִתּוֹ
  choice: Ngài đã phán với ông
  rationale: Piel của דבר với אֵת mang nghĩa “nói/phán với.” “Đã phán” thể hiện hành động xảy ra trước sự đi lên; đại từ “Ngài” và động từ “phán” phù hợp với chủ thể là Đức Chúa Trời.
theological_decisions:
- issue: Cách mô tả mang tính không gian về việc Đức Chúa Trời rời đi
  choice: Giữ hình ảnh “đi lên, rời khỏi ông”
  alternative: Đức Chúa Trời rời khỏi ông
  rationale: Nguyên văn dùng động từ thông thường chỉ sự đi lên. Giữ ngôn ngữ không gian bảo tồn hình ảnh thần hiện của câu chuyện mà không áp đặt lời giải thích triết học về sự hiện diện của Đức Chúa Trời.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng “Đức Chúa Trời,” “Ngài,” và “phán” theo ngữ vực Kinh Thánh tiếng Việt; giữ hình ảnh chuyển động hướng lên của nguyên văn.
