  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: vi
  text: Gia-cốp dựng một trụ tại nơi Ngài[a] đã phán với ông—một trụ bằng đá. Ông rót lễ quán[b] trên trụ ấy, rồi đổ dầu lên đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không nêu lại chủ ngữ của động từ “phán”; văn cảnh chỉ về Đức Chúa Trời.
    reason: source_ambiguity
  - marker: b
    text: “Lễ quán” là lễ dâng được thực hiện bằng cách rót một thức uống.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: dựng
  rationale: Thể Hiphil diễn tả việc làm cho vật đứng thẳng; “dựng” tự nhiên, cụ thể và phù hợp với một trụ đá.
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: một trụ … một trụ bằng đá
  rationale: מַצֵּבָה là một khối đá được dựng đứng làm trụ hoặc bia. Cách dịch này giữ cả danh từ lẫn phần giải thích chất liệu được lặp lại trong tiếng Hê-bơ-rơ, mà không tự thêm mục đích tưởng niệm hay thờ phượng.
- source_word: בַּמָּקוֹם
  choice: tại nơi
  rationale: Diễn đạt địa điểm rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: nơi Ngài đã phán với ông
  rationale: Văn cảnh cho thấy chủ ngữ không nêu lại là Đức Chúa Trời; “phán” phù hợp với lời nói của Đức Chúa Trời, còn đại từ giữ cấu trúc quy chiếu thay vì chèn lại danh xưng.
- source_word: וַיַּסֵּךְ … נֶסֶךְ
  choice: đổ lễ quán
  rationale: Động từ và danh từ cùng trường nghĩa chỉ nghi thức rót một thức uống làm lễ dâng. “Lễ quán” ngắn gọn và chính xác, kèm chú thích để người đọc phổ thông hiểu.
- source_word: וַיִּצֹק … שָׁמֶן
  choice: đổ dầu
  rationale: Giữ hành động cụ thể và không thêm “ô-liu”, vì nguyên văn chỉ nói “dầu”.
theological_decisions:
- issue: Ý nghĩa của việc dựng trụ, đổ lễ quán và dầu
  choice: Chỉ thuật lại các hành động nghi lễ, không gọi đây là hành động thánh hiến hay tưởng niệm.
  alternative: Diễn giải rõ rằng Gia-cốp thánh hiến trụ đá hoặc lập vật kỷ niệm cuộc gặp gỡ với Đức Chúa Trời.
  rationale: Câu này không trực tiếp giải thích ý nghĩa thần học của các hành động; cách dịch mô tả giữ nguyên độ mở của bản văn.
- issue: Chủ ngữ của דִּבֶּר (“đã phán”)
  choice: Dùng “Ngài”, với chú thích rằng chủ ngữ được hiểu từ văn cảnh là Đức Chúa Trời.
  alternative: Nêu thẳng “Đức Chúa Trời đã phán với ông”.
  rationale: Cách chọn vừa giúp câu tiếng Việt tự nhiên và nhận diện đúng quy chiếu theo văn cảnh, vừa không che giấu việc nguyên văn không lặp lại chủ ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “một trụ … một trụ bằng đá” của nguyên văn; dùng “lễ quán” như thuật ngữ Kinh Thánh chính xác nhưng giải thích ngay trong chú thích.
