  terminology: “Bê-tên,” “bàn thờ,” và “Đức Chúa Trời” nhất quán với văn phong Kinh Thánh tiếng Việt phổ thông. “Cho Đức Chúa Trời” diễn đạt tự nhiên quan hệ dâng/lập bàn thờ hướng về Ngài, tương ứng chấp nhận được với לָאֵל. Cách viết hoa “Đấng” phù hợp văn phong tôn kính mà không thêm nội dung thần học.
