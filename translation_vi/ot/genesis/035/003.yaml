base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: vi
  text: Chúng ta hãy đứng dậy, đi lên Bê-tên. Tại đó, tôi sẽ lập một bàn thờ cho Đức Chúa Trời, Đấng đã đáp lời tôi trong ngày tôi gặp hoạn nạn[a] và ở cùng tôi trên con đường tôi đã đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng đáp lời tôi,” giữ phân từ Hê-bơ-rơ như lời mô tả khái quát hoặc liên tục hơn về Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: Chúng ta hãy đứng dậy
  rationale: Dạng cohortative ngôi thứ nhất số nhiều mang ý khích lệ, thúc giục; cách dịch này giữ lực ý chí và tự nhiên trong tiếng Việt hiện đại.
- source_word: וְנַעֲלֶה
  choice: đi lên
  rationale: Giữ sắc thái không gian của עלה khi nói về việc tiến đến Bê-tên, thay vì làm phẳng thành chỉ 'đi'.
- source_word: בֵּית אֵל
  choice: Bê-tên
  rationale: Đây là địa danh; dùng dạng phiên âm quen thuộc trong tiếng Việt thay vì dịch nghĩa là 'nhà Đức Chúa Trời'.
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: Tại đó, tôi sẽ lập một bàn thờ
  rationale: עשה có nghĩa rộng là 'làm'; trong kết hợp với 'bàn thờ', 'lập' vừa tự nhiên vừa giữ ý tạo dựng mà không thêm chi tiết vật liệu hay phương thức xây.
- source_word: לָאֵל
  choice: cho Đức Chúa Trời
  rationale: Giới từ ל biểu thị sự hướng đến hoặc dâng dành; 'cho' diễn đạt tự nhiên việc lập bàn thờ dành cho Đức Chúa Trời.
- source_word: הָעֹנֶה אֹתִי
  choice: Đấng đã đáp lời tôi
  rationale: Phân từ có thể chỉ hành động đặc trưng hoặc đang tiếp diễn, nhưng ngữ cảnh hồi tưởng đến một lần Chúa đáp lời trong hoạn nạn; dùng quá khứ trong câu chính và ghi nhận khả năng khác ở chú thích.
- source_word: בְּיוֹם צָרָתִי
  choice: trong ngày tôi gặp hoạn nạn
  rationale: Giữ hình ảnh Hê-bơ-rơ 'trong ngày' đồng thời diễn đạt sở hữu 'hoạn nạn của tôi' bằng cấu trúc tiếng Việt tự nhiên.
- source_word: וַיְהִי עִמָּדִי
  choice: và ở cùng tôi
  rationale: Diễn đạt trực tiếp sự hiện diện của Đức Chúa Trời với Gia-cốp trong câu chuyện quá khứ.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: trên con đường tôi đã đi
  rationale: Giữ hình ảnh cụ thể của דרך và הלך, đồng thời dùng cấu trúc tiếng Việt gọn, tự nhiên.
theological_decisions:
- issue: Cách xác định אֵל trong lời Gia-cốp
  choice: Đức Chúa Trời, Đấng...
  alternative: vị thần, đấng... / Đức Chúa Trời
  rationale: Mạo từ cùng mệnh đề phân từ xác định Đức Chúa Trời bằng hành động Ngài đã làm cho Gia-cốp. Cách dịch này giữ tính xác định và giọng xưng nhận, không đưa thêm công thức giáo phái.
- issue: Giá trị thời gian của phân từ הָעֹנֶה
  choice: Đấng đã đáp lời tôi
  alternative: Đấng đáp lời tôi
  rationale: Bối cảnh nhắc đến một biến cố giải cứu trong quá khứ, nhưng phân từ Hê-bơ-rơ cũng có thể mô tả hành động mang tính đặc trưng hoặc tiếp diễn; chú thích giữ lại sự hàm hồ chân thực ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Dùng “Bê-tên” theo dạng địa danh quen thuộc; “lập một bàn thờ” tự nhiên hơn lối dịch máy móc “làm một bàn thờ”. Đại từ “tôi” phù hợp lời Gia-cốp nói với gia đình và những người đi cùng.
