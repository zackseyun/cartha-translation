base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: vi
  text: Gia-cốp dựng một trụ đá trên mộ bà[a]. Đó là trụ đá đánh dấu mộ Ra-chên cho đến ngày nay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu cả cụm là: “một trụ đá đánh dấu mộ bà” hoặc “một trụ đá tại mộ bà.”'
    reason: Nguyên ngữ có thể mô tả trụ đá ở trên hoặc tại phần mộ, đồng thời cho thấy trụ đá có liên hệ nhận diện với mộ.
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: dựng
  rationale: Động từ Hiphil mang nghĩa dựng lên hoặc thiết lập; “dựng” tự nhiên và phù hợp với việc dựng một trụ đá.
- source_word: מַצֵּבָה
  choice: một trụ đá
  rationale: Danh từ chỉ một hòn đá được dựng đứng hoặc trụ đá. “Trụ đá” giữ hình ảnh cụ thể của nguyên văn mà không diễn giải quá mức thành đài tưởng niệm.
- source_word: עַל קְבֻרָתָהּ
  choice: trên mộ bà
  rationale: עַל diễn tả vị trí bên trên hoặc tại phần mộ; “trên mộ bà” là cách nói ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: הִוא
  choice: Đó là
  rationale: Đại từ chỉ ngược về trụ đá vừa được nhắc đến và mở đầu lời xác định; “Đó là” rõ nghĩa trong tiếng Việt.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: trụ đá trên mộ Ra-chên
  rationale: Cách dịch này diễn đạt tự nhiên quan hệ chuỗi sở thuộc trong tiếng Hê-bơ-rơ, đồng thời giữ liên hệ giữa trụ đá và phần mộ mà không biến nó thành một công trình lớn hơn.
- source_word: עַד הַיּוֹם
  choice: vẫn còn cho đến ngày nay
  rationale: Thành ngữ nói rằng trụ đá tiếp tục tồn tại tới thời của người kể; thêm “vẫn còn” làm rõ ý tiếp diễn vốn hàm chứa trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trụ đá” để giữ hình ảnh cụ thể của מַצֵּבָה; đại từ “bà” phù hợp khi nhắc lại Ra-chên. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
