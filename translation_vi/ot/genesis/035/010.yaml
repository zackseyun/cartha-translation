source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ אֱלֹהִ֖ים שִׁמְ/ךָ֣ יַעֲקֹ֑ב לֹֽא יִקָּרֵא֩ שִׁמְ/ךָ֨ ע֜וֹד יַעֲקֹ֗ב כִּ֤י אִם יִשְׂרָאֵל֙ יִהְיֶ֣ה שְׁמֶ֔/ךָ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: vi
  text: 'Đức Chúa Trời phán với ông: “Tên ngươi là Gia-cốp. Tên ngươi sẽ không còn được gọi là Gia-cốp nữa, nhưng Ít-ra-ên sẽ là tên ngươi.” Rồi Ngài gọi tên ông là Ít-ra-ên.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đặt tên cho ông là Ít-ra-ên” hoặc “Ngài gọi ông là Ít-ra-ên.” Nguyên văn Hê-bơ-rơ sát nghĩa là: “Ngài gọi tên ông là Ít-ra-ên.”'
    reason: Nêu các cách diễn đạt tự nhiên khác của công thức đặt tên trong tiếng Hê-bơ-rơ, đồng thời cho biết cấu trúc sát nguyên văn.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thái số nhiều nhưng đi với động từ số ít và trong ngữ cảnh này chỉ về Đức Chúa Trời duy nhất; cách dịch này rõ nghĩa và trang trọng trong tiếng Việt.
- source_word: שִׁמְךָ
  choice: tên ngươi
  rationale: Chuyển trực tiếp danh từ kèm hậu tố ngôi hai giống đực số ít; giữ sự lặp lại có chủ ý của nguyên văn. “Ngươi” duy trì lời phán trực tiếp mà không tự thêm sắc thái quan hệ như “con”.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: sẽ không còn được gọi ... nữa
  rationale: Thể Nifal của קרא diễn tả việc được gọi tên; kết cấu “không còn ... nữa” chuyển tự nhiên sức nghĩa của לֹא ... עוֹד.
- source_word: כִּי אִם
  choice: nhưng
  rationale: 'Trong câu này, kết cấu nêu sự tương phản và thay thế: không phải Gia-cốp, nhưng là Ít-ra-ên.'
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Ít-ra-ên sẽ là tên ngươi
  rationale: Giữ vị trí nhấn mạnh của tên mới ở đầu mệnh đề mà vẫn tự nhiên trong tiếng Việt.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: Rồi Ngài gọi tên ông là Ít-ra-ên
  rationale: Giữ khá sát công thức Hê-bơ-rơ “gọi tên ông là Ít-ra-ên”; “Ngài” làm rõ chủ thể tiếp nối là Đức Chúa Trời, còn “rồi” diễn đạt mạch kể liên tiếp của וַ.
- source_word: יַעֲקֹב
  choice: Gia-cốp
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: יִשְׂרָאֵל
  choice: Ít-ra-ên
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Lời đổi tên có tuyệt đối loại bỏ tên Gia-cốp khỏi mọi cách dùng về sau hay không
  choice: Tên ngươi sẽ không còn được gọi là Gia-cốp nữa, nhưng Ít-ra-ên sẽ là tên ngươi.
  alternative: Từ nay tên ngươi không phải là Gia-cốp nữa, mà là Ít-ra-ên.
  rationale: Nguyên văn công bố chính thức việc đổi tên với sức nghĩa mạnh, dù phần tường thuật về sau vẫn dùng tên Gia-cốp. Bản dịch giữ nguyên sự căng thẳng này, không làm nhẹ lời phán cũng không thêm lời giải thích dung hòa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” trong lời phán trực tiếp để phản ánh rõ ngôi hai số ít mà không tự thêm quan hệ cha-con; dùng “ông” khi người kể nhắc đến Gia-cốp và viết hoa “Ngài” để chỉ Đức Chúa Trời. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
