  text: וַ/תָּ֤מָת דְּבֹרָה֙ מֵינֶ֣קֶת רִבְקָ֔ה וַ/תִּקָּבֵ֛ר מִ/תַּ֥חַת לְ/בֵֽית אֵ֖ל תַּ֣חַת הָֽ/אַלּ֑וֹן וַ/יִּקְרָ֥א שְׁמ֖/וֹ אַלּ֥וֹן בָּכֽוּת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: vi
  text: Đê-bô-ra, vú nuôi của Rê-bê-ca, chết và được chôn bên dưới Bê-tên, dưới cây sồi[a]. Người đặt tên cây ấy là A-lôn Ba-cút[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ אַלּוֹן có thể chỉ cây sồi hoặc cây terebinth; không thể xác định chắc chắn loài cây chính xác.
    reason: lexical_alternative
  - marker: b
    text: A-lôn Ba-cút có lẽ nghĩa là “Cây Sồi Than Khóc”; nếu אַלּוֹן được hiểu là cây terebinth, thì có thể là “Cây Terebinth Than Khóc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: vú nuôi
  rationale: Danh từ chỉ người phụ nữ cho trẻ bú và chăm sóc trẻ. “Vú nuôi” là cách gọi tự nhiên, rõ nghĩa trong tiếng Việt và phù hợp với vai trò lâu dài của Đê-bô-ra đối với Rê-bê-ca.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: ở phía dưới Bê-tên
  rationale: Giữ ý nghĩa không gian là ở vị trí thấp hơn hoặc bên dưới Bê-tên, nhưng không tự ý xác định đó là hướng nam.
- source_word: תַּחַת הָאַלּוֹן
  choice: dưới cây sồi
  rationale: תַּחַת nghĩa là “dưới”; אַלּוֹן thường được hiểu là cây sồi, dù cũng có thể chỉ cây thông nhựa. Sự bất định về loài cây được ghi trong chú thích.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: Ông đặt tên cây ấy là
  rationale: Động từ ở ngôi thứ ba số ít giống đực nên được dịch chủ động là “ông đặt tên”. Đại từ “cây ấy” diễn đạt sở chỉ giống đực của hậu tố và liên hệ tự nhiên với cây vừa được nhắc đến.
- source_word: אַלּוֹן בָּכוּת
  choice: A-lôn Ba-cút
  rationale: Giữ địa danh/tên gọi bằng lối phiên âm trong chính văn; ý nghĩa dễ nhận thấy của tên được nêu trong chú thích.
- source_word: וַתִּקָּבֵר
  choice: được chôn
  rationale: Dạng Niphal được diễn đạt bằng thể bị động, không thêm chủ thể thực hiện việc chôn cất.
- source_word: וַתָּמָת
  choice: qua đời
  rationale: Diễn đạt trực tiếp sự chết bằng cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại mà không làm thay đổi nội dung.
theological_decisions:
- issue: Chủ thể không được nêu đích danh của וַיִּקְרָא
  choice: Dịch bằng đại từ “Ông”, theo hình thái ngôi thứ ba số ít giống đực của động từ.
  alternative: Dùng lối vô nhân xưng “người ta gọi” hoặc bị động “được gọi là”.
  rationale: Bản Hê-bơ-rơ dùng động từ chủ động với chủ thể ngầm ở ngôi thứ ba số ít giống đực. Bản dịch giữ hình thái này nhưng không thêm tên Gia-cốp, vì câu không nêu đích danh chủ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm nhất quán; cấu trúc câu gọn, giữ hai chỉ dẫn vị trí riêng biệt của nguyên văn và không biến “phía dưới” thành một hướng địa lý xác định.
