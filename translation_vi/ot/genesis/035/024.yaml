lexical_decisions:
- source_word: בְּנֵי
  choice: các con trai của
  rationale: Dạng số nhiều liên kết của בֵּן mở đầu danh sách gia phả; hai người được nêu tên đều là con trai, nên cách dịch này trực tiếp và chính xác hơn “các con” hay “hậu duệ”.
- source_word: רָחֵל
  choice: Ra-chên
  rationale: Phiên âm tên riêng theo dạng quen dùng trong tiếng Việt Kinh Thánh, đồng thời phản ánh tên Hê-bơ-rơ.
- source_word: יוֹסֵף
  choice: Giô-sép
  rationale: Phiên âm tên riêng theo dạng quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: וּ/בִנְיָמִן
  choice: và Bên-gia-min
  rationale: Liên từ וּ được dịch tự nhiên là “và”; tên riêng בִנְיָמִן được phiên âm theo dạng quen dùng trong tiếng Việt.
