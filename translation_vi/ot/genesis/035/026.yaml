id: GEN.35.26
reference: Genesis 35:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: vi
  text: Các con trai của Xinh-ba[a], nữ tỳ của Lê-a, là Gát và A-se[b]. Đó là các con trai của Gia-cốp được sinh cho ông tại Pha-đan A-ram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này cũng có thể dịch là “người hầu gái”, hoặc mạnh hơn là “nữ nô lệ”, tùy theo cách diễn đạt địa vị xã hội mà từ שִׁפְחָה hàm ý.
    reason: lexical_alternative
  - marker: b
    text: Dù câu này nói các con trai ấy được sinh cho Gia-cốp “tại Pha-đan A-ram”, Bên-gia-min lại được sinh sau đó tại Ca-na-an (cc. 16–18). Đây có thể là lời tổng kết về các con trai gắn với thời kỳ gia đình Gia-cốp ở A-ram; ghi chú địa điểm không bao gồm Bên-gia-min.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זִלְפָּה
  choice: Các con trai của Xinh-pa
  rationale: בְנֵי chỉ rõ các con trai trong danh sách gia phả; tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: שִׁפְחַת לֵאָה
  choice: nữ tỳ của Lê-a
  rationale: שִׁפְחָה chỉ một nữ đầy tớ hoặc nữ nô lệ. “Nữ tỳ” giữ được giới tính và địa vị lệ thuộc, đồng thời phù hợp với văn phong Kinh Thánh trang trọng; chú thích nêu rõ sắc thái xã hội mạnh hơn có thể có.
- source_word: גָּד וְאָשֵׁר
  choice: Gát và A-se
  rationale: Phiên âm tên riêng theo dạng tiếng Việt quen dùng.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: Đó là các con trai của Gia-cốp
  rationale: אֵלֶּה là đại từ chỉ định dùng để tổng kết danh sách; “Đó là” tự nhiên trong mạch văn tiếng Việt, còn בְּנֵי được dịch cụ thể là “các con trai”.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: đã sinh cho ông
  rationale: Dạng bị động יֻלַּד cùng לוֹ trình bày việc các con được sinh cho Gia-cốp. Cách dịch này giữ cấu trúc quy chiếu về người cha mà không thêm một chủ thể nữ không có trong câu Hebrew.
- source_word: בְּפַדַּן אֲרָם
  choice: tại Pha-đan A-ram
  rationale: Giữ đây là địa danh riêng thay vì diễn giải theo một từ nguyên chưa chắc chắn.
theological_decisions:
- issue: Phạm vi của lời tổng kết về nơi sinh
  choice: Giữ nguyên lời khẳng định “đã sinh cho ông tại Pha-đan A-ram” và giải thích khó khăn bằng chú thích.
  alternative: Sửa hoặc thu hẹp câu để nói rõ Bên-gia-min sinh tại Ca-na-an.
  rationale: Nguyên văn đưa ra một lời tổng kết có vẻ căng thẳng với 35:16–18. Không nên âm thầm điều chỉnh nội dung; chú thích bảo tồn cả lời văn lẫn dữ kiện trong ngữ cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt. “Nữ tỳ” có sắc thái trang trọng; chú thích làm rõ trường nghĩa liên quan đến thân phận nô lệ. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
