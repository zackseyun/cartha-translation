  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến: đoàn người khởi hành; nỗi kinh hoàng có nguồn nơi Đức Chúa Trời phủ/giáng trên các thành xung quanh; kết quả là không có cuộc truy đuổi các con trai Gia-cốp. Tuy nhiên, “người ta” làm mờ chủ thể được quy chiếu từ “các thành” trong nguyên văn; “dân các thành ấy” diễn đạt rõ phép hoán dụ mà không đổi nghĩa.'
