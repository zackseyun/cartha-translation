  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: vi
  text: Rồi họ lên đường, và nỗi kinh hoàng từ Đức Chúa Trời[a] giáng xuống các thành chung quanh họ, nên dân các thành ấy không đuổi theo các con trai của Gia-cốp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “nỗi kinh hoàng của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: Rồi họ lên đường
  rationale: Động từ נסע trong mạch kể diễn tả việc khởi hành; “lên đường” tự nhiên trong tiếng Việt hiện đại, còn “rồi” chuyển tiếp diễn tiến câu chuyện.
- source_word: וַיְהִי ... עַל
  choice: giáng xuống
  rationale: היה theo nghĩa sát là “có/đã xảy ra”, nhưng khi kết hợp với עַל và chủ thể là nỗi kinh hoàng, “giáng xuống” diễn đạt tự nhiên tính biến cố và hình ảnh tác động trên các thành.
- source_word: חִתַּת אֱלֹהִים
  choice: nỗi kinh hoàng từ Đức Chúa Trời
  rationale: חִתַּת chỉ sự kinh hãi hoặc khiếp đảm. Cấu trúc sở hữu với אֱלֹהִים có thể nói đến nỗi kinh hoàng do Đức Chúa Trời gây nên hoặc thuộc về Ngài; “từ Đức Chúa Trời” phù hợp ngữ cảnh bảo vệ của Đức Chúa Trời nhưng vẫn ghi nhận cách dịch sát hơn trong chú thích.
- source_word: עַל הֶעָרִים
  choice: giáng xuống các thành
  rationale: עַל mang nghĩa “trên/xuống trên”; được thể hiện tự nhiên qua cụm động từ “giáng xuống”.
- source_word: אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: chung quanh họ
  rationale: Cụm này xác định các thành ở khu vực bao quanh đoàn người của Gia-cốp; cách nói ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: nên người ta không đuổi theo
  rationale: Ngữ cảnh cho thấy việc không truy đuổi là kết quả của nỗi kinh hoàng. Chủ ngữ số nhiều không nêu rõ trong tiếng Hê-bơ-rơ được diễn đạt tự nhiên bằng “người ta”, tức dân cư các thành.
- source_word: בְּנֵי יַעֲקֹב
  choice: các con trai của Gia-cốp
  rationale: בְּנֵי là danh từ giống đực số nhiều và trong ngữ cảnh chỉ các con trai của Gia-cốp; bản dịch giữ rõ giới tính thay vì trung tính hóa.
theological_decisions:
- issue: Ý nghĩa của cấu trúc חִתַּת אֱלֹהִים
  choice: nỗi kinh hoàng từ Đức Chúa Trời
  alternative: nỗi kinh hoàng của Đức Chúa Trời; một nỗi kinh hoàng lớn lao
  rationale: Cách hiểu theo nguồn phát sinh phù hợp với ngữ cảnh Đức Chúa Trời bảo vệ gia đình Gia-cốp. Tuy nhiên, cấu trúc Hê-bơ-rơ cũng có thể được dịch sát là “nỗi kinh hoàng của Đức Chúa Trời”; sự mơ hồ này được bảo tồn trong chú thích thay vì giải quyết tuyệt đối.
- issue: Cách diễn đạt בְּנֵי יַעֲקֹב
  choice: các con trai của Gia-cốp
  alternative: những người con của Gia-cốp
  rationale: Nguyên văn dùng từ giống đực và mạch truyện quy chiếu đến các con trai của Gia-cốp, nên bản dịch giữ cách gọi cụ thể này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời” dùng cho אֱלֹהִים; “Gia-cốp” theo dạng tên Kinh Thánh quen thuộc trong tiếng Việt. Dấu chú thích đặt ngay sau câu vì chú thích liên quan đến cụm ở giữa câu nhưng giải thích phương án dịch của toàn cấu trúc.
