  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: vi
  text: 'Khi nàng đang đau đẻ dữ dội, bà đỡ nói với nàng: “Đừng sợ, vì đứa bé này cũng là con trai của nàng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: Khi nàng sinh nở khó khăn
  rationale: Cụm này đặt hoàn cảnh thời gian và diễn tả sự khó nhọc, nguy hiểm trong lúc sinh. Cách dịch gọn, tự nhiên, không dùng công thức cổ kiểu “xảy ra rằng”.
- source_word: הַמְיַלֶּדֶת
  choice: bà đỡ
  rationale: Chỉ người phụ nữ trợ giúp việc sinh nở; “bà đỡ” là cách gọi thông dụng, chính xác trong tiếng Việt hiện đại.
- source_word: אַל־תִּירְאִי
  choice: Đừng sợ
  rationale: Giữ nguyên mệnh lệnh phủ định trực tiếp và lời trấn an của bà đỡ.
- source_word: כִּי
  choice: vì
  rationale: Ở đây từ này dẫn vào lý do cho lời trấn an.
- source_word: גַּם זֶה
  choice: đứa này cũng
  rationale: Giữ cả yếu tố chỉ định “này” lẫn ý bổ sung của גַּם, thay vì diễn giải thành “thêm một đứa nữa”.
- source_word: לָךְ בֵּן
  choice: là con trai của nàng
  rationale: Diễn đạt tự nhiên quan hệ hướng đến/sở hữu của לָךְ, đồng thời giữ rõ danh từ “con trai”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, dễ hiểu trong tiếng Việt hiện đại. Đại từ “nàng” phù hợp với mạch tường thuật về Ra-chên; lời bà đỡ vẫn dùng cùng cách xưng gọi để tránh tự ý thêm quan hệ xã hội không có trong nguyên văn.
