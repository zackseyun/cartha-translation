- from: 'Rồi Đức Chúa Trời phán với Gia-cốp: “Hãy đứng dậy, đi lên Bê-tên và ở lại đó. Tại đó, hãy lập một bàn thờ cho Đức Chúa Trời, Đấng đã hiện ra với con khi con chạy trốn Ê-sau, anh con.”'
  to: 'Rồi Đức Chúa Trời phán với Gia-cốp: “Hãy đứng dậy, đi lên Bê-tên, ở lại đó và lập tại đó một bàn thờ cho Đức Chúa Trời, Đấng đã hiện ra với ngươi khi ngươi chạy trốn khỏi Ê-sau, anh ngươi.”'
  rationale: Sửa đại từ xưng hô để không bổ sung một quan hệ không được nguyên văn nêu; đồng thời dùng “khỏi” để chuyển tải rõ hơn מִפְּנֵי. Không cần chú thích, vì cách diễn đạt chính văn đã chuyển tải ý nghĩa tự nhiên mà không che khuất thành ngữ nguồn.
