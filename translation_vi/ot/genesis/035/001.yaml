source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: vi
  text: 'Rồi Đức Chúa Trời phán với Gia-cốp: “Hãy đứng dậy, đi lên Bê-tên, ở lại đó và lập tại đó một bàn thờ cho Đức Chúa Trời, Đấng đã hiện ra với ngươi khi ngươi chạy trốn khỏi Ê-sau, anh ngươi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Waw liên tiếp đẩy mạch kể chuyện tiến tới; “rồi” diễn đạt tự nhiên trình tự, còn “phán” phù hợp với lời Đức Chúa Trời.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thái số nhiều nhưng đi với động từ số ít và trong ngữ cảnh chỉ về một Đức Chúa Trời.
- source_word: קוּם
  choice: Hãy đứng dậy
  rationale: Diễn đạt rõ mệnh lệnh đứng lên để bắt đầu hành động, tự nhiên hơn “hãy trỗi dậy” trong tiếng Việt hiện đại.
- source_word: עֲלֵה
  choice: đi lên
  rationale: Giữ sắc thái hướng lên, có thể bao hàm phương diện địa hình trong hành trình đến Bê-tên.
- source_word: בֵּית אֵל
  choice: Bê-tên
  rationale: Phiên âm địa danh theo cách quen thuộc trong tiếng Việt thay vì dịch nghĩa là “nhà Đức Chúa Trời”.
- source_word: וְשֶׁב שָׁם
  choice: và ở lại đó
  rationale: ישב ở đây có nghĩa cư trú/lưu lại; “ở lại” tự nhiên và không xác định quá mức thời gian cư trú.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: Tại đó, hãy lập một bàn thờ
  rationale: עשה có nghĩa rộng là làm; trong kết hợp với “bàn thờ,” “lập” vừa tự nhiên vừa không cụ thể hóa phương thức xây dựng quá mức.
- source_word: לָאֵל
  choice: cho Đức Chúa Trời
  rationale: Giới từ ל biểu thị đối tượng mà bàn thờ được dâng/lập; “cho” là cách diễn đạt tiếng Việt tự nhiên, còn mệnh đề sau xác định Ngài.
- source_word: הַנִּרְאֶה אֵלֶיךָ
  choice: Đấng đã hiện ra với con
  rationale: Niphal của ראה trong ngữ cảnh thần hiện được diễn đạt rõ và tự nhiên là “hiện ra”; “Đấng” giữ văn phong trang trọng.
- source_word: בְּבָרְחֲךָ
  choice: khi con chạy trốn
  rationale: Động từ nguyên mẫu với ב diễn tả hoàn cảnh thời gian; “khi” chuyển tải chính xác và tự nhiên.
- source_word: מִפְּנֵי
  choice: chạy trốn Ê-sau
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen “khỏi mặt/sự hiện diện của”; trong tiếng Việt, động từ “chạy trốn” đã biểu đạt tự nhiên quan hệ tránh khỏi người bị trốn.
- source_word: עֵשָׂו אָחִיךָ
  choice: Ê-sau, anh con
  rationale: Giữ thứ tự danh xưng rồi quan hệ thân thuộc của tiếng Hê-bơ-rơ; “anh” phản ánh Ê-sau là người anh sinh đôi của Gia-cốp.
theological_decisions:
- issue: Đối tượng của אֱלֹהִים
  choice: Một Đức Chúa Trời phán với Gia-cốp
  alternative: các thần
  rationale: Động từ số ít và văn mạch xác định đây là Đức Chúa Trời của Gia-cốp, không phải nhiều thần.
- issue: Cách thể hiện לָאֵל הַנִּרְאֶה אֵלֶיךָ
  choice: “cho Đức Chúa Trời, Đấng đã hiện ra với con”
  alternative: “cho vị thần đã hiện ra với con”
  rationale: Mạo từ cùng văn mạch xác định chính Đức Chúa Trời đang phán và đã hiện ra với Gia-cốp; cách dịch không hàm ý một thần linh bất định.
- issue: Tên địa danh בֵּית אֵל
  choice: Phiên âm “Bê-tên”
  alternative: Dịch nghĩa “Nhà Đức Chúa Trời”
  rationale: Trong câu này từ ngữ hoạt động như một địa danh; phiên âm tránh biến tên riêng thành lời giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời, “con” trong lời Ngài nói với Gia-cốp, và “Đấng” trong mệnh đề quy chiếu. Không thêm chú thích vì thành ngữ מִפְּנֵי được chuyển tự nhiên bằng “chạy trốn Ê-sau” mà không làm mất nghĩa.
