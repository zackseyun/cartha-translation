source:
  edition: WLC
  text: וַ/יִּגְוַ֨ע יִצְחָ֤ק וַ/יָּ֨מָת֙ וַ/יֵּאָ֣סֶף אֶל עַמָּ֔י/ו זָקֵ֖ן וּ/שְׂבַ֣ע יָמִ֑ים וַ/יִּקְבְּר֣וּ אֹת֔/וֹ עֵשָׂ֥ו וְ/יַעֲקֹ֖ב בָּנָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: vi
  text: Rồi Y-sác trút hơi thở cuối cùng và qua đời; ông được quy tụ về với dân mình[a], đã cao tuổi và trọn đầy ngày tháng. Ê-sau và Gia-cốp, hai con trai ông, chôn cất ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “được quy tụ về với tổ tiên hoặc bà con mình.” Đây là một công thức Hê-bơ-rơ quen dùng khi nói về cái chết và có thể hàm ý nhiều hơn việc mai táng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: trút hơi thở cuối cùng
  rationale: Diễn đạt tự nhiên ý của גוע trong công thức thuật lại cái chết, đồng thời phân biệt với động từ מות theo sau.
- source_word: וַיָּמָת
  choice: qua đời
  rationale: Chuyển tải trực tiếp động từ מות và giữ chuỗi hai động từ chỉ cái chết trong tiếng Hê-bơ-rơ mà không tạo cảm giác lặp vụng trong tiếng Việt.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: được quy tụ về với dân mình
  rationale: Giữ khá sát công thức Hê-bơ-rơ và không giới hạn ý nghĩa vào việc chôn cất, đoàn tụ với tổ tiên hay tình trạng sau khi chết.
- source_word: זָקֵן
  choice: cao tuổi
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại cho tình trạng tuổi già của Y-sác.
- source_word: וּשְׂבַע יָמִים
  choice: mãn nguyện về những ngày đời
  rationale: שׂבע cơ bản mang ý no đủ, thỏa mãn; cách dịch này bảo tồn hình ảnh 'những ngày' và sắc thái một đời sống trọn đầy hơn là giản lược thành 'tuổi cao'.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: chôn cất ông
  rationale: Tương đương rõ ràng và trang trọng với קבר trong văn cảnh mai táng.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: Hai con trai ông là Ê-sau và Gia-cốp
  rationale: Giữ đầy đủ tên, quan hệ con trai và trật tự Ê-sau trước Gia-cốp, đồng thời tạo câu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của công thức qua đời וַיֵּאָסֶף אֶל־עַמָּיו
  choice: Giữ công thức 'được quy tụ về với dân mình' mà không xác định cụ thể bản chất của sự quy tụ.
  alternative: Diễn giải là được chôn trong mộ gia tộc hoặc được đoàn tụ với tổ tiên sau khi chết.
  rationale: Công thức Hê-bơ-rơ có thể gợi nhiều hơn việc mai táng thể lý nhưng không giải thích rõ; bản dịch cần bảo tồn sự mơ hồ thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trút hơi thở cuối cùng” để giữ sự phân biệt giữa hai động từ chỉ cái chết; “mãn nguyện về những ngày đời” bảo tồn hình ảnh Hê-bơ-rơ mà vẫn tương đối tự nhiên trong tiếng Việt.
