base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: vi
  text: Rồi họ rời Bê-tên lên đường. Khi còn cách Ép-ra-tha[a] một quãng, Ra-chên sinh con và gặp khó khăn trong lúc sinh nở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể phiên âm là “Ép-rát”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מִבֵּית אֵל
  choice: họ rời Bê-tên lên đường
  rationale: Động từ נסע trong mạch tường thuật chỉ việc nhổ trại và tiếp tục hành trình; cách dịch này tự nhiên trong tiếng Việt và giữ cả ý rời nơi cũ lẫn lên đường.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: khi còn cách ... một quãng
  rationale: כִּבְרַת הָאָרֶץ là thành ngữ hiếm, chỉ một khoảng đường nhưng không xác định chính xác; “một quãng” tránh áp đặt một đơn vị đo cụ thể.
- source_word: לָבוֹא אֶפְרָתָה
  choice: cách Ép-ra-tha ...
  rationale: Cụm nguyên ngữ diễn tả quãng đường còn lại trước khi đến địa điểm này; cấu trúc tiếng Việt được sắp xếp lại cho tự nhiên mà vẫn cho thấy họ chưa tới nơi.
- source_word: אֶפְרָתָה
  choice: Ép-ra-tha
  rationale: Phiên âm sát dạng địa danh Hê-bơ-rơ אֶפְרָתָה theo lối viết dễ đọc trong tiếng Việt.
- source_word: וַתֵּלֶד רָחֵל
  choice: Ra-chên sinh con
  rationale: ילד với chủ ngữ nữ có nghĩa là sinh con; cách diễn đạt ngắn gọn, rõ ràng và tự nhiên.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: gặp khó khăn trong lúc sinh nở
  rationale: קשה ở đây diễn tả việc sinh nở khó nhọc hoặc nghiêm trọng; bản dịch giữ mức độ khái quát của nguyên văn, không thêm chi tiết y khoa.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dùng câu rõ và tự nhiên cho độc giả phổ thông. Địa danh được phiên âm theo âm tiết tiếng Việt; sự không xác định về độ dài của כִּבְרַת הָאָרֶץ được giữ bằng “một quãng”.
