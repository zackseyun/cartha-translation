base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/021.yaml
  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: vi
  text: Sau đó, Ít-ra-ên tiếp tục lên đường và dựng lều ở phía bên kia Mích-đan Ê-đe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mích-đan Ê-đe có nghĩa là “tháp của bầy chiên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: tiếp tục lên đường
  rationale: Động từ נסע trong mạch kể chuyện chỉ việc nhổ trại và đi tiếp; cách diễn đạt này vừa tự nhiên trong tiếng Việt vừa giữ ý tiếp diễn của trình thuật.
- source_word: יִשְׂרָאֵל
  choice: Ít-ra-ên
  rationale: Nguyên văn dùng tên Ít-ra-ên, nên bản dịch giữ đúng tên này thay vì đổi thành Gia-cốp.
- source_word: וַיֵּט
  choice: dựng
  rationale: Khi đi với 'lều', động từ נטה có nghĩa thành ngữ là giăng hoặc dựng lều; 'dựng lều' là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אָהֳלֹה
  choice: lều
  rationale: Danh từ אֹהֶל có hậu tố ngôi thứ ba số ít giống đực, chỉ chiếc lều của Ít-ra-ên. Trong tiếng Việt, chủ thể đã rõ nên không cần thêm 'của mình'.
- source_word: מֵהָלְאָה
  choice: ở phía bên kia
  rationale: Trạng từ הלאה diễn tả vị trí xa hơn hoặc vượt quá một mốc; trong ngữ cảnh địa điểm, 'ở phía bên kia' truyền đạt rõ quan hệ không gian.
- source_word: לְמִגְדַּל עֵדֶר
  choice: Mích-đan Ê-đe
  rationale: Cụm từ này hoạt động như một địa danh, nên được phiên âm thay vì dịch thẳng; nghĩa từ nguyên được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu đối với độc giả Việt Nam hiện đại. Giữ tên Ít-ra-ên đúng theo nguyên văn và phiên âm địa danh Mích-đan Ê-đe; không thêm diễn giải thần học.
