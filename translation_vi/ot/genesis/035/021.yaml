  source_fidelity: 'Bản dịch giữ đúng chuỗi hành động của nguyên văn: Ít-ra-ên đi tiếp rồi dựng lều. “Tiếp tục lên đường” phản ánh היטב וַיִּסַּע; “dựng lều” phù hợp với cách dùng וַיֵּט אָהֳלֹה. “Ở phía bên kia” diễn đạt quan hệ không gian ‘xa hơn/bên kia’ của מֵהָלְאָה đối với Mích-đan Ê-đe mà không thêm chi tiết không có trong bản gốc.'
