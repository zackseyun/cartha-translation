- from: 'Đức Chúa Trời phán với ông: “Ta là Đức Chúa Trời Toàn Năng[a]. Hãy sinh sôi nảy nở. Một dân tộc và một cộng đồng các dân tộc sẽ từ con mà ra; các vua sẽ từ thân thể con mà ra[b].”'
  to: 'Đức Chúa Trời phán với ông: “Ta là Đức Chúa Trời Toàn Năng[a]. Hãy sinh sôi nảy nở. Một dân tộc và một cộng đồng các dân tộc sẽ ra từ con; các vua sẽ xuất thân từ con[b].”'
  rationale: Chỉnh nhẹ trật tự từ để tiếng Việt lưu loát hơn và thay cách diễn đạt phần nói về các vua bằng một thành ngữ tiếng Việt tự nhiên. Chú thích bây giờ bảo toàn rõ hình ảnh “hông” của nguyên ngữ và ý dòng dõi thể lý, không thêm diễn giải thần học.
