  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán với ông: “Ta là Đức Chúa Trời Toàn Năng[a]. Hãy sinh sôi nảy nở. Một dân tộc và một cộng đồng các dân tộc sẽ ra từ con; các vua sẽ xuất thân từ con[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “El Shaddai”; thường được dịch là “Đức Chúa Trời Toàn Năng”. Nghĩa chính xác của danh hiệu Shaddai chưa chắc chắn.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “từ hông con”; đây là thành ngữ chỉ những hậu duệ ruột thịt phát xuất từ chính con.'
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít và ngữ cảnh cho thấy đây là danh xưng số ít chỉ Đức Chúa Trời của Israel.
- source_word: אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  rationale: Dịch danh hiệu thần linh theo nghĩa truyền thống, đồng thời ghi nguyên ngữ trong chú thích vì nghĩa chính xác của שַׁדַּי còn được bàn luận.
- source_word: פְּרֵה וּרְבֵה
  choice: Hãy sinh sôi nảy nở
  rationale: Cách nói tự nhiên, trang trọng, giữ hai mệnh lệnh số ít và âm hưởng công thức chúc phước trong Sáng Thế Ký.
- source_word: גּוֹי
  choice: một dân tộc
  rationale: Trong lời hứa dành cho tổ phụ, từ này chỉ một cộng đồng dân sự được hình thành thành dân tộc.
- source_word: קְהַל גּוֹיִם
  choice: một cộng đồng các dân tộc
  rationale: קָהָל chỉ một tập hợp hay cộng đồng được quy tụ; cách dịch này giữ sắc thái tập thể mà vẫn tự nhiên trong tiếng Việt.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: sẽ từ con mà ra
  rationale: Diễn đạt tự nhiên ý nguồn gốc và dòng dõi của cấu trúc sát chữ 'sẽ có từ con'.
- source_word: מְלָכִים
  choice: các vua
  rationale: Tương ứng trực tiếp với danh từ số nhiều, không cần diễn giải thêm.
- source_word: מֵחֲלָצֶיךָ
  choice: từ thân thể con
  rationale: Truyền đạt thành ngữ về hậu duệ ruột thịt bằng tiếng Việt hiện đại, tránh cách dịch 'từ thắt lưng' dễ bị hiểu theo nghĩa giải phẫu không tự nhiên.
- source_word: יֵצֵאוּ
  choice: sẽ ... mà ra
  rationale: Giữ hình ảnh xuất phát từ dòng dõi và phối hợp tự nhiên với cụm 'từ thân thể con'.
theological_decisions:
- issue: Cách dịch danh hiệu אֵל שַׁדַּי
  choice: Đức Chúa Trời Toàn Năng
  alternative: Ên Sa-đai / Đức Chúa Trời Shaddai
  rationale: Dùng cách dịch danh hiệu quen thuộc và có ý nghĩa trong tiếng Việt, nhưng chú thích nguyên ngữ để không che khuất sự bất định về từ nguyên và sắc thái chính xác của שַׁדַּי.
- issue: Mức độ cụ thể của hình ảnh dòng dõi trong מֵחֲלָצֶיךָ
  choice: từ thân thể con
  alternative: từ thắt lưng con / từ dòng dõi con
  rationale: Giữ ý hậu duệ thể lý phát xuất từ chính Gia-cốp mà không giải nghĩa hoàn toàn thành 'dòng dõi', cũng không tạo một cách nói gượng gạo trong tiếng Việt.
- issue: Quan hệ giữa một dân tộc và cộng đồng các dân tộc
  choice: Giữ hai thành phần song song, không xác định chúng chỉ cùng một nhóm hay các nhóm khác nhau
  alternative: một dân tộc, tức là một cộng đồng các dân tộc
  rationale: Nguyên văn dùng וּ nối hai danh ngữ; bản dịch không thêm quan hệ giải thích vốn không được nêu rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” phản ánh lời Đức Chúa Trời trực tiếp phán với Gia-cốp. Giữ nhịp ngắn của lời tự xưng, mệnh lệnh và lời hứa; mọi dấu chú thích đều xuất hiện trong chính văn.
