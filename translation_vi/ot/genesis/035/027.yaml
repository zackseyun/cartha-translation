  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ các địa danh riêng, dùng lời giải thích trong ngoặc như nguyên văn, và bảo toàn sắc thái địa vị ngoại kiều của động từ גור.
