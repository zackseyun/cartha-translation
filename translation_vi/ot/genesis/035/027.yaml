base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: vi
  text: Gia-cốp đến với cha mình là Y-sác, tại Mam-rê, Ki-ri-át Ác-ba (tức Hếp-rôn), nơi Áp-ra-ham và Y-sác từng cư ngụ như những ngoại kiều.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi Áp-ra-ham và Y-sác từng tạm trú.” Động từ Hê-bơ-rơ hàm ý cư ngụ với tư cách người ngoại kiều hoặc người tạm trú, chứ không chỉ đơn thuần là sống tại một nơi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đến gặp
  rationale: Động từ בוא diễn tả việc Gia-cốp đến chỗ Y-sác; thêm “gặp” sau “đến” là cách nói tự nhiên trong tiếng Việt khi đích đến là một người, nhưng không thêm một hành động riêng biệt.
- source_word: אֶל יִצְחָק אָבִיו
  choice: cha mình là Y-sác
  rationale: Giữ rõ quan hệ cha con trong nguyên văn, đồng thời sắp xếp theo cú pháp tiếng Việt tự nhiên.
- source_word: מַמְרֵא
  choice: Mam-rê
  rationale: Phiên âm địa danh theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: קִרְיַת הָאַרְבַּע
  choice: Ki-ri-át Ác-ba
  rationale: Giữ đây là địa danh riêng thay vì dịch thành “thành của Ác-ba”; vế kế tiếp xác định nơi này là Hếp-rôn.
- source_word: הִוא חֶבְרוֹן
  choice: tức Hếp-rôn
  rationale: Đại từ cùng địa danh có chức năng giải thích, đồng nhất Ki-ri-át Ác-ba với Hếp-rôn; “tức” gọn và tự nhiên.
- source_word: אֲשֶׁר ... שָׁם
  choice: nơi
  rationale: Gộp đại từ quan hệ và trạng từ chỉ nơi chốn thành “nơi”, phù hợp cú pháp tiếng Việt và không làm mất ý định vị.
- source_word: גָּר
  choice: từng cư ngụ như ngoại kiều
  rationale: Động từ גור không chỉ có nghĩa sống tại một nơi mà thường chỉ việc cư trú với tư cách người ngoại kiều, không có địa vị bản địa. “Từng” diễn tả hành động có trước lúc Gia-cốp đến.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Áp-ra-ham và Y-sác
  rationale: Phiên âm tên riêng theo hình thức Kinh Thánh tiếng Việt quen thuộc.
theological_decisions: []
