  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: vi
  text: Gia-cốp gọi tên nơi Đức Chúa Trời đã phán với ông tại đó là Bê-tên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bê-tên nghĩa là “nhà của Đức Chúa Trời.”
    reason: Giải thích ý nghĩa từ nguyên của địa danh בֵּית אֵל.
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: gọi ... là
  rationale: Cụm Hê-bơ-rơ có nghĩa đặt hoặc gọi tên. Cách diễn đạt “gọi ... là” vừa tự nhiên trong tiếng Việt vừa giữ rõ hành động định danh.
- source_word: הַמָּקוֹם
  choice: nơi
  rationale: “Nơi” chuyển tải chính xác ý nghĩa địa điểm và kết hợp tự nhiên với mệnh đề quan hệ theo sau.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: Đức Chúa Trời đã phán với ông tại đó
  rationale: “Phán với” phản ánh אִתּוֹ và phù hợp văn cảnh Đức Chúa Trời trực tiếp truyền lời. “Đã” thể hiện hành động xảy ra trước việc đặt tên; “tại đó” giữ lại שָׁם dù địa điểm đã được hàm ý bởi “nơi”.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ và văn cảnh cho thấy danh từ này chỉ Đức Chúa Trời duy nhất, không phải số nhiều.
- source_word: בֵּית אֵל
  choice: Bê-tên
  rationale: Dùng dạng phiên âm địa danh quen thuộc trong tiếng Việt thay vì dịch địa danh ngay trong câu; ý nghĩa của tên được nêu ở chú thích.
theological_decisions:
- issue: Số của אֱלֹהִים
  choice: Đức Chúa Trời
  alternative: các thần
  rationale: Trong câu này, văn cảnh và cú pháp xác định một chủ thể duy nhất đã phán với Gia-cốp; cách dịch số nhiều sẽ làm sai nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “tại đó” để phản ánh đầy đủ từ שָׁם trong nguyên văn, dù tiếng Việt có một mức độ lặp ý nhẹ với “nơi”.
