  text: וּ/בְנֵ֤י בִלְהָה֙ שִׁפְחַ֣ת רָחֵ֔ל דָּ֖ן וְ/נַפְתָּלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/025.yaml
  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: vi
  text: Các con trai của Bi-la[a], nữ tỳ của Ra-chên, là Đan và Nép-ta-li.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nữ đầy tớ của Ra-chên.” Từ Hê-bơ-rơ này chỉ một nữ gia nhân có địa vị xã hội thấp; trong một số bối cảnh, từ ấy có thể mang nghĩa nữ nô lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Các con trai của
  rationale: בְנֵי là dạng số nhiều liên kết của בֵּן, mở đầu một nhóm tiếp theo trong danh sách gia phả. “Các con trai của” vừa trực tiếp vừa tự nhiên trong tiếng Việt; liên từ וּ được thể hiện qua sự tiếp nối của danh sách hơn là thêm “và” ở đầu câu, vốn kém tự nhiên khi câu đứng riêng.
- source_word: בִלְהָה
  choice: Bi-la
  rationale: Tên riêng được phiên âm theo cách quen dùng và dễ đọc trong tiếng Việt.
- source_word: שִׁפְחַת
  choice: nữ tỳ
  rationale: שִׁפְחָה chỉ một người nữ phục dịch có địa vị xã hội thấp, và tùy bối cảnh có thể mang nghĩa nữ nô lệ. “Nữ tỳ” ngắn gọn, trang trọng và giữ được dấu hiệu giới tính mà không buộc văn bản vào sắc thái pháp lý cụ thể hơn.
- source_word: רָחֵל
  choice: của Ra-chên
  rationale: Diễn đạt tự nhiên quan hệ liên kết trong cụm שִׁפְחַת רָחֵל.
- source_word: דָּן
  choice: Đan
  rationale: Tên riêng được phiên âm theo cách quen dùng trong tiếng Việt.
- source_word: וְ/נַפְתָּלִי
  choice: và Nép-ta-li
  rationale: Giữ liên từ וְ và phiên âm tên riêng theo cách dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “là Đan và Nép-ta-li” làm rõ chức năng liệt kê của câu danh từ Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau tên Bi-la để liên kết rõ với cách mô tả địa vị của bà.
