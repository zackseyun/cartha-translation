base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: vi
  text: Đức Chúa Trời lại hiện ra[a] với Gia-cốp khi ông đến từ Pha-đan A-ram, và Ngài ban phước cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Chúa Trời lại tỏ mình cho Gia-cốp.” Động từ Hê-bơ-rơ có thể chỉ việc hiện ra hoặc tỏ mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: hiện ra
  rationale: Dạng Niphal của ראה ở đây chỉ việc Đức Chúa Trời xuất hiện hoặc làm cho mình được thấy. “Hiện ra” tự nhiên trong tiếng Việt và không xác định quá mức cách thức của sự hiển hiện.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Động từ số ít và văn cảnh cho thấy danh từ này chỉ một Đức Chúa Trời; cách gọi này trang trọng, quen thuộc và phù hợp với tiếng Việt hiện đại.
- source_word: עוֹד
  choice: lại
  rationale: Trong văn cảnh, từ này diễn tả sự lặp lại của một lần hiện ra trước đó; “lại” ngắn gọn và tự nhiên.
- source_word: בְּבֹאוֹ
  choice: khi ông ... trở về
  rationale: Giới từ ב kết hợp với động từ nguyên thể và hậu tố đại từ mang nghĩa thời gian. Theo hành trình trong văn cảnh, “khi ông ... trở về” diễn đạt tự nhiên việc Gia-cốp đi từ Pha-đan A-ram đến lại xứ này.
- source_word: מִפַּדַּן אֲרָם
  choice: từ Pha-đan A-ram
  rationale: Đây là địa danh nên được phiên âm; giới từ מִן được diễn đạt bằng “từ”.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: và Ngài ban phước cho ông
  rationale: Dạng Piel của ברך có nghĩa là ban phước. Việc giữ cả chủ thể lẫn đối tượng làm quan hệ trong mệnh đề rõ ràng; “Ngài” tránh lặp lại danh xưng nhưng vẫn trang trọng.
theological_decisions:
- issue: Bản chất của lần Đức Chúa Trời hiện ra
  choice: Đức Chúa Trời lại hiện ra với Gia-cốp
  alternative: Đức Chúa Trời lại tỏ mình cho Gia-cốp
  rationale: Câu này thuật lại một sự hiển hiện thật của Đức Chúa Trời nhưng không nói rõ cách thức. “Hiện ra” giữ nguyên sự căng thẳng thần học ấy, không biến sự kiện thành một kinh nghiệm chỉ mang tính nội tâm hay khải tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các tên quen thuộc “Gia-cốp” và “Pha-đan A-ram”; cấu trúc câu bám sát trình tự ý của tiếng Hê-bơ-rơ nhưng vẫn tự nhiên trong tiếng Việt.
