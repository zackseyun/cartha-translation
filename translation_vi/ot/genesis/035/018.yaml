  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: vi
  text: Khi sự sống của nàng đang lìa đi—vì nàng sắp chết—nàng đặt tên con là Bên-ô-ni[a]; nhưng cha đứa trẻ đặt tên cho con là Bên-gia-min[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bên-ô-ni có lẽ có nghĩa là “con trai của nỗi đau của tôi” hoặc “con trai của cảnh khốn khổ của tôi.”
    reason: lexical_alternative
  - marker: b
    text: Bên-gia-min có lẽ có nghĩa là “con trai của tay phải”; một số người hiểu là “con trai của phương nam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: khi sự sống lìa khỏi nàng
  rationale: נֶפֶשׁ trong ngữ cảnh qua đời có thể chỉ sự sống, sinh mạng hoặc bản thân sống. Dịch là “sự sống” tự nhiên trong tiếng Việt và không áp đặt quan niệm nhân học chuyên biệt; ב + động từ nguyên mẫu được diễn đạt như một mệnh đề thời gian.
- source_word: כִּי מֵתָה
  choice: vì nàng đang hấp hối
  rationale: Mệnh đề giải thích việc sự sống đang lìa khỏi nàng. Tuy dạng động từ có thể được hiểu là “nàng chết”, diễn tiến câu chuyện cho thấy việc đặt tên xảy ra trong lúc nàng sắp chết; “đang hấp hối” diễn đạt tự nhiên mà không khiến người đọc hiểu nàng đặt tên sau khi đã chết.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: nàng đặt tên con là
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ đặt tên của tiếng Hê-bơ-rơ, đồng thời giữ được sự song hành với hành động đặt tên của người cha.
- source_word: בֶּן אוֹנִי
  choice: Bên-Ô-ni
  rationale: Giữ dưới dạng tên riêng phiên âm trong chính văn; ý nghĩa có liên quan đến câu chuyện nhưng không hoàn toàn chắc chắn nên được nêu trong chú thích.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: nhưng cha đứa trẻ đặt tên con là
  rationale: וְ được diễn đạt theo nghĩa tương phản vì tên người cha đặt thay cho tên người mẹ vừa đặt. “Cha đứa trẻ” làm rõ sở chỉ của đại từ trong tiếng Việt, còn “con” tự nhiên trong ngữ cảnh cha đặt tên cho con mình.
- source_word: בִנְיָמִין
  choice: Bên-gia-min
  rationale: Giữ tên riêng theo dạng phiên âm quen thuộc trong tiếng Việt; các cách hiểu từ nguyên chính được bảo lưu trong chú thích.
theological_decisions:
- issue: Nghĩa nhân học của נֶפֶשׁ trong ngữ cảnh qua đời
  choice: Dịch là “sự sống” thay vì “linh hồn” trong chính văn
  alternative: linh hồn
  rationale: Từ Hê-bơ-rơ có thể chỉ sự sống hoặc bản thân sống, không nhất thiết đưa ra một khẳng định kỹ thuật rằng linh hồn phi vật chất rời khỏi thân thể. “Sự sống” giữ đúng ý nghĩa trần thuật và không khép lại những cách hiểu thần học có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” phù hợp văn kể chuyện Kinh Thánh; giữ tên riêng theo lối phiên âm tiếng Việt. Dấu gạch ngang làm nổi bật mệnh đề giải thích mà vẫn giữ nhịp câu.
