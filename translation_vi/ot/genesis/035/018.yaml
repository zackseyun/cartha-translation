- from: Khi sự sống lìa khỏi nàng—vì nàng đang hấp hối—nàng đặt tên con là Bên-Ô-ni[a]; nhưng cha đứa trẻ đặt tên con là Bên-gia-min[b].
  to: Khi sự sống của nàng đang lìa đi—vì nàng sắp chết—nàng đặt tên con là Bên-ô-ni[a]; nhưng cha đứa trẻ đặt tên cho con là Bên-gia-min[b].
  rationale: Bản sửa nâng độ tự nhiên của tiếng Việt, làm rõ quan hệ sở hữu trong hình ảnh “sự sống,” và sửa đầy đủ nghĩa sở hữu ngôi thứ nhất trong chú thích Bên-ô-ni. Nội dung, độ mơ hồ nhân học của נֶפֶשׁ, sự tương phản giữa hai tên, cùng các neo chú thích a/b đều được giữ nguyên.
