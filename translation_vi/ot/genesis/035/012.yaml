  text: וְ/אֶת הָ/אָ֗רֶץ אֲשֶׁ֥ר נָתַ֛תִּי לְ/אַבְרָהָ֥ם וּ/לְ/יִצְחָ֖ק לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֶתֵּ֥ן אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: vi
  text: Đất mà Ta đã ban cho Áp-ra-ham và Y-sác[a], Ta sẽ ban cho con; và Ta sẽ ban đất ấy cho dòng dõi con sau con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta đã ban rồi cho Áp-ra-ham và Y-sác.”'
    reason: lexical_alternative
  - marker: b
    text: “Dòng dõi” dịch một danh từ số ít mang nghĩa tập thể; cũng có thể dịch là “hậu duệ” hoặc, sát chữ hơn, “hạt giống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: đất / đất ấy
  rationale: Trong bối cảnh lời hứa dành cho các tổ phụ, từ này chỉ vùng đất đã được xác định trong lời hứa. Lần nhắc lại dùng “đất ấy” để quy chiếu tự nhiên mà vẫn giữ sự lặp lại của nguyên văn.
- source_word: נָתַתִּי
  choice: Ta đã ban
  rationale: Dạng qatal diễn tả việc Đức Chúa Trời đã ban đất cho Áp-ra-ham và Y-sác; “đã ban” tự nhiên trong tiếng Việt và giữ sự đối lập với các động từ tương lai ở phần sau.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: cho Áp-ra-ham và Y-sác
  rationale: Giữ cả hai đối tượng nhận lời hứa và dùng dạng tên riêng quen thuộc, rõ ràng trong tiếng Việt.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: Ta sẽ ban cho con
  rationale: Hậu tố giống cái số ít trên động từ quy chiếu về “đất”; tiếng Việt có thể lược tân ngữ ở đây vì “đất” đã đứng đầu câu, tránh lặp nặng nề.
- source_word: זַרְעֲךָ
  choice: dòng dõi của con
  rationale: “Dòng dõi” là cách nói tự nhiên, trang trọng và có thể giữ nghĩa tập thể của danh từ số ít זֶרַע, không buộc người đọc hiểu chỉ một cá nhân hay nhiều hậu duệ.
- source_word: אַחֲרֶיךָ
  choice: sau con
  rationale: Giữ sát ý thời gian và sự kế tục thế hệ của nguyên văn.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: Ta sẽ ban đất ấy
  rationale: Giữ sự lặp lại có chủ ý của động từ “ban” và danh từ “đất”, qua đó tái khẳng định lời hứa dành cho dòng dõi Gia-cốp.
theological_decisions:
- issue: Mối liên hệ giữa việc đã ban và việc sẽ ban đất trong lời hứa cho các tổ phụ
  choice: Dịch נָתַתִּי là “đã ban” và hai động từ tiếp theo là “sẽ ban”.
  alternative: Có thể hiểu dạng qatal theo sắc thái hoàn thành còn hiệu lực, gần với ý “đã ban rồi”.
  rationale: Cách dịch giữ nguyên sức căng giữa sự ban cho đã được tuyên lập với Áp-ra-ham và Y-sác và sự thực hiện trong tương lai đối với Gia-cốp cùng dòng dõi ông, không đồng nhất hai phương diện.
- issue: Nghĩa tập thể hay cá thể của זֶרַע
  choice: Dùng “dòng dõi”, giữ khả năng chỉ một tập thể bằng hình thức danh từ số ít.
  alternative: “Hậu duệ” hoặc sát chữ hơn là “hạt giống”.
  rationale: Nguyên văn có danh từ số ít mang nghĩa tập thể. “Dòng dõi” không tự ý giải quyết mọi hàm ý thần học theo hướng chỉ một cá nhân hoặc nhiều người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con” phù hợp với lời Đức Chúa Trời phán trực tiếp với Gia-cốp. Cấu trúc lặp “Ta sẽ ban” được giữ để phản ánh nhịp và sự nhấn mạnh của tiếng Hê-bơ-rơ.
