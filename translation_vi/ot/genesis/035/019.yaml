  source_fidelity: 'Cần sửa hai điểm để sát tiếng Hê-bơ-rơ hơn: וַתָּמָת nên được dịch trực tiếp là “chết” thay vì lối uyển ngữ “qua đời”; và בְּדֶרֶךְ אֶפְרָתָה là “trên đường đến Ép-ra-ta,” không phải “bên đường đến,” vốn có thể gợi ý vị trí cạnh đường. Phần đồng vị “tức là Bết-lê-hem” truyền đạt đúng הִוא בֵּית לָחֶם.'
