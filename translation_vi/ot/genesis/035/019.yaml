base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/019.yaml
  text: So Rachel died and was buried on the way to Ephrath (that is[a], Bethlehem).
translation:
  language: vi
  text: Vậy, Ra-chên chết và được chôn trên đường đến Ép-ra-ta[a] (tức là Bết-lê-hem).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ép-ra-ta cũng có thể được phiên âm là Ép-rát.
    reason: Biến thể tên địa danh אֶפְרָתָה, tương ứng với chú thích từ vựng trong vết kiểm toán tiếng Anh.
lexical_decisions:
- source_word: וַתָּמָת
  choice: qua đời
  rationale: Động từ מות chỉ cái chết thể xác. “Qua đời” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại mà vẫn truyền đạt rõ nghĩa.
- source_word: רָחֵל
  choice: Ra-chên
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: וַתִּקָּבֵר
  choice: được chôn
  rationale: Thể Nifal của קבר mang nghĩa bị động. Không thêm “ở đó” vì từ này không có trong tiếng Hê-bơ-rơ.
- source_word: בְּדֶרֶךְ
  choice: bên đường đến
  rationale: Cụm từ chỉ vị trí trên tuyến đường hướng về Ép-ra-ta; cách dịch này tự nhiên trong tiếng Việt và không hàm ý bà đã đến nơi ấy.
- source_word: אֶפְרָתָה
  choice: Ép-ra-ta
  rationale: Phiên âm trực tiếp dạng địa danh אֶפְרָתָה; giữ hình thức đầy đủ thay vì lược âm tiết cuối.
- source_word: הִוא
  choice: tức là
  rationale: Đại từ ở đây có chức năng đồng vị, xác định Ép-ra-ta là Bết-lê-hem.
- source_word: בֵּית לָחֶם
  choice: Bết-lê-hem
  rationale: Phiên âm địa danh theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “qua đời” thay cho “chết” để phù hợp giọng kể dignified, nhưng không làm mờ sự kiện thể xác. Dấu ngoặc giữ phần giải thích địa danh. Mọi tên riêng được phiên âm nhất quán theo lối Việt hóa.
