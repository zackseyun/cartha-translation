  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo tiếng Hê-bơ-rơ: “Các ngày của Y-sác là một trăm năm và tám mươi năm”; “các ngày” là thành ngữ chỉ tuổi đời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי יִצְחָק
  choice: Tuổi đời của Y-sác là
  rationale: Cụm Hê-bơ-rơ theo sát chữ là “các ngày của Y-sác là”, trong đó “các ngày” là thành ngữ chỉ toàn bộ tuổi đời. Dịch “tuổi đời” truyền đạt tự nhiên ý nghĩa ấy trong tiếng Việt hiện đại, còn chú thích bảo lưu cách nói nguyên ngữ.
- source_word: יִצְחָק
  choice: Y-sác
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: một trăm tám mươi năm
  rationale: Tiếng Hê-bơ-rơ diễn đạt theo cấu trúc “một trăm năm và tám mươi năm”; tiếng Việt tự nhiên gộp thành tổng số “một trăm tám mươi năm”.
