  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dấu chấm phẩy giúp thể hiện cụm đồng vị cuối câu mà không biến nó thành một mệnh đề độc lập; dấu chú thích đặt ngay sau phần nhận diện địa danh.
