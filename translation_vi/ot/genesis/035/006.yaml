  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: Gia-cốp đến Lu-xơ, địa điểm này được đồng nhất với Bê-tên, nằm trong xứ Ca-na-an, và có đoàn người đi cùng ông. Tuy nhiên, dấu chấm phẩy tách “ông cùng tất cả những người đi với ông” thành một mảnh câu không hoàn chỉnh trong tiếng Việt. Cần nối cụm này trực tiếp với động từ “đến” để phản ánh cấu trúc tiếng Hê-bơ-rơ một cách sáng rõ.'
