base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: vi
  text: Vậy, Gia-cốp đến Lu-xơ (tức là Bê-tên)[a], thuộc xứ Ca-na-an, cùng với tất cả những người đi với ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ ghi “Lu-xơ ... tức là Bê-tên”, vừa giữ tên địa danh cũ vừa nêu tên gọi được biết đến rộng rãi hơn.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đến
  rationale: Động từ בוא ở thể Qal trong mạch kể chuyện diễn tả việc đi đến nơi đích; “đến” tự nhiên và chính xác trong tiếng Việt.
- source_word: לוּזָה
  choice: đến Lu-xơ
  rationale: Tên địa danh לוּז kèm hậu tố chỉ hướng, nên được diễn đạt bằng giới từ “đến”; dùng dạng phiên âm quen thuộc “Lu-xơ”.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: thuộc xứ Ca-na-an
  rationale: Mệnh đề quan hệ xác định vị trí của Lu-xơ. “Thuộc xứ Ca-na-an” truyền đạt gọn và tự nhiên ý địa lý “ở trong đất Ca-na-an”.
- source_word: הִוא בֵּית אֵל
  choice: tức là Bê-tên
  rationale: Đại từ cùng địa danh có chức năng đồng vị, xác định Lu-xơ chính là Bê-tên; “tức là” giữ rõ quan hệ nhận diện.
- source_word: הוּא
  choice: ông
  rationale: Đại từ nối lại chủ thể Gia-cốp trước khi thêm nhóm người đồng hành; “ông” phù hợp văn phong kể chuyện trang trọng mà không cường điệu sắc thái nhấn mạnh.
- source_word: וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: cùng tất cả những người đi với ông
  rationale: עָם ở đây chỉ đoàn người đồng hành, không nhất thiết là một dân tộc; cách diễn đạt này rõ nghĩa và tự nhiên trong tiếng Việt.
theological_decisions: []
