  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: vi
  text: 'Rồi Gia-cốp nói với người nhà mình và tất cả những người ở cùng ông: “Hãy loại bỏ các thần ngoại bang[a] đang ở giữa anh em, hãy thanh tẩy mình[b] và thay quần áo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thần xa lạ” hoặc “các thần của người ngoại bang.”'
    reason: lexical_alternative
  - marker: b
    text: “Thanh tẩy mình” có thể chỉ sự thanh tẩy theo nghi lễ để chuẩn bị đến gần Đức Chúa Trời.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: người nhà mình
  rationale: Danh từ này theo nghĩa đen là “nhà”, nhưng tại đây chỉ những người thuộc gia hộ của Gia-cốp chứ không phải tòa nhà. “Người nhà mình” tự nhiên trong tiếng Việt và giữ được nghĩa xã hội của từ.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: tất cả những người ở cùng ông
  rationale: Cụm từ trong ngữ cảnh chỉ toàn bộ những người đang đi cùng Gia-cốp. Cách dịch này rõ nghĩa và không biến đối tượng chỉ người thành đồ vật.
- source_word: הָסִרוּ
  choice: hãy loại bỏ
  rationale: Mệnh lệnh đòi họ đưa các vật thờ thần ngoại bang ra khỏi cộng đồng hoặc quyền sở hữu của mình. “Loại bỏ” giữ nguyên lực của mệnh lệnh mà không nói quá cụ thể về phương thức.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: các thần ngoại bang
  rationale: Cụm sở thuộc có thể chỉ các thần của người ngoại bang hoặc các thần xa lạ. “Các thần ngoại bang” rõ ràng, tự nhiên và vẫn để chú thích nêu các khả năng từ vựng khác.
- source_word: בְּתֹכְכֶם
  choice: đang ở giữa mọi người
  rationale: Nguyên văn là “ở giữa các ngươi”, có thể bao hàm cả sự hiện diện trong cộng đồng lẫn việc họ đang sở hữu các tượng thần. Cách dịch này giữ được độ rộng ấy và tránh đại từ xưng hô dễ mang sắc thái không phù hợp trong tiếng Việt hiện đại.
- source_word: וְהִטַּהֲרוּ
  choice: thanh tẩy mình
  rationale: Dạng hitpael mang ý phản thân. “Thanh tẩy mình” vừa thể hiện hành động hướng vào chính chủ thể vừa giữ sắc thái nghi lễ có thể có trong bối cảnh chuẩn bị đến gần Đức Chúa Trời.
- source_word: וְהַחֲלִיפוּ
  choice: thay
  rationale: Động từ có nghĩa thay đổi hoặc thay thế; khi đi với y phục, “thay” là cách diễn đạt tự nhiên nhất trong tiếng Việt.
- source_word: שִׂמְלֹתֵיכֶם
  choice: quần áo
  rationale: Từ này chỉ y phục, đặc biệt có thể là áo ngoài. “Quần áo” dễ hiểu trong tiếng Việt hiện đại mà không làm thay đổi nội dung mệnh lệnh.
theological_decisions:
- issue: Tính chất của mệnh lệnh thanh tẩy
  choice: Dịch là “thanh tẩy mình” để bảo tồn khả năng đây là sự thanh tẩy mang tính nghi lễ hoặc giao ước.
  alternative: Dịch khái quát hơn là “làm sạch mình” hoặc “tắm rửa sạch sẽ”.
  rationale: Việc loại bỏ các thần ngoại bang và bối cảnh chuẩn bị đến gần Đức Chúa Trời gợi ý ý nghĩa nghi lễ, nhưng câu này không quy định cách thức cụ thể. Bản dịch giữ sắc thái thần học ấy mà không thêm một nghi thức không được nói rõ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Người nhà mình” truyền đạt nghĩa gia hộ mà không dùng từ cổ; “quần áo” tự nhiên hơn “y phục”. Đại từ trực tiếp trong mệnh lệnh được lược bỏ theo cách nói tự nhiên của tiếng Việt, còn בְּתֹכְכֶם được diễn đạt là “ở giữa mọi người” để tránh sắc thái gay gắt hoặc cổ của “các ngươi”.
