- from: 'Rồi Gia-cốp nói với người nhà mình và tất cả những người ở cùng ông: “Hãy loại bỏ các thần ngoại bang[a] đang ở giữa mọi người, thanh tẩy mình[b] và thay quần áo.”'
  to: 'Rồi Gia-cốp nói với người nhà mình và tất cả những người ở cùng ông: “Hãy loại bỏ các thần ngoại bang[a] đang ở giữa anh em, hãy thanh tẩy mình[b] và thay quần áo.”'
  rationale: Chỉnh “mọi người” thành “anh em” để tái lập ngôi thứ hai số nhiều của nguyên văn trong lời Gia-cốp. Bổ sung “hãy” trước mệnh lệnh thứ hai để câu tiếng Việt rõ nhịp và minh thị ba mệnh lệnh phối hợp, không thêm nội dung. Các phần còn lại và hai chú thích được giữ nguyên vì trung thành với nguồn và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
