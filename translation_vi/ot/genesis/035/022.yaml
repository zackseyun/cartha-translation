base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: vi
  text: Khi Israel đang cư ngụ tại vùng đất ấy, Ru-bên đã đi và nằm với Bi-la, vợ lẽ của cha mình, và Israel nghe tin ấy.[a] Các con trai của Gia-cốp gồm mười hai người.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ chỉ viết: “và Israel nghe.” Cụm “tin ấy” được thêm vào để câu tiếng Việt rõ nghĩa; điều Israel nghe chính là hành vi của Ru-bên vừa được kể.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “Và các con trai của Gia-cốp là mười hai.” Mệnh đề này có lẽ chuyển sang danh sách các con trai trong những câu tiếp theo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בִּשְׁכֹּן
  choice: Trong thời gian ... cư ngụ
  rationale: Cấu trúc ב + động từ nguyên mẫu שכן nêu hoàn cảnh kéo dài làm nền cho sự việc; cách dịch này tự nhiên trong tiếng Việt và không cần giữ công thức kể chuyện theo lối cổ.
- source_word: בָּאָרֶץ הַהִוא
  choice: tại vùng đất ấy
  rationale: Ở đây אֶרֶץ chỉ khu vực nơi Israel đang sống, không phải toàn thể trái đất; “vùng đất ấy” diễn đạt rõ phạm vi địa phương.
- source_word: וַיֵּלֶךְ רְאוּבֵן וַיִּשְׁכַּב אֶת
  choice: Ru-bên đi ăn nằm với
  rationale: Giữ động từ chuyển động וילך và diễn đạt thành ngữ tình dục שכב את một cách trực tiếp, nghiêm trang, dễ hiểu trong tiếng Việt hiện đại.
- source_word: פִּילֶגֶשׁ
  choice: vợ lẽ
  rationale: “Vợ lẽ” là thuật ngữ tiếng Việt thông dụng cho người nữ có địa vị hôn phối được nhìn nhận nhưng thấp hơn người vợ chính trong gia đình cổ đại.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: Israel nghe biết việc ấy
  rationale: Bản Hê-bơ-rơ chỉ nói “Israel nghe”; thêm “việc ấy” làm rõ tân ngữ đã được ngữ cảnh xác định mà không thêm phản ứng nào của Israel.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: Các con trai của Gia-cốp gồm mười hai người
  rationale: Diễn đạt tự nhiên lời thông báo về số lượng và vẫn giữ chức năng chuyển tiếp sang danh sách các con trai ở những câu kế tiếp.
theological_decisions:
- issue: Cách diễn đạt hành vi tình dục của Ru-bên
  choice: ăn nằm với
  alternative: nằm với; quan hệ tình dục với
  rationale: “Ăn nằm với” truyền đạt rõ thành ngữ Hê-bơ-rơ mà không giảm nhẹ tính nghiêm trọng của hành vi hoặc dùng lối nói quá lâm sàng.
- issue: Phản ứng của Israel sau khi nghe tin
  choice: Chỉ nói Israel nghe biết việc ấy
  alternative: Suy diễn rằng Israel tức giận, im lặng chấp nhận, hoặc lập tức xét xử
  rationale: Nguyên văn không cho biết phản ứng của Israel, nên bản dịch không gán cho sự im lặng trong câu bất kỳ ý nghĩa đạo đức hay thần học nào.
- issue: Chức năng của mệnh đề cuối
  choice: Giữ như một câu chuyển tiếp đơn giản sang danh sách mười hai con trai
  alternative: Gắn mệnh đề này với hành vi của Ru-bên để rút ra một kết luận thần học
  rationale: Mệnh đề chỉ thông báo số con trai của Gia-cốp và mở sang phần liệt kê tiếp theo; không nên bổ sung quan hệ nhân quả không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc Ru-bên, Bi-la và Gia-cốp; giữ “Israel” vì câu này chủ ý dùng tên Israel rồi chuyển sang “Gia-cốp” ở mệnh đề cuối. “Vợ lẽ” chính xác và tự nhiên hơn cách vay mượn thuật ngữ cổ.
