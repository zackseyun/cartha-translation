revisions:
- from: Trong thời gian Israel cư ngụ tại vùng đất ấy, Ru-bên đi ăn nằm với Bi-la, vợ lẽ của cha mình, và Israel nghe biết việc ấy.[a] Các con trai của Gia-cốp gồm mười hai người.[b]
  to: Khi Israel đang cư ngụ tại vùng đất ấy, Ru-bên đã đi và nằm với Bi-la, vợ lẽ của cha mình, và Israel nghe tin ấy.[a] Các con trai của Gia-cốp gồm mười hai người.[b]
