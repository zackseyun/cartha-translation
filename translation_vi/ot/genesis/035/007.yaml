  edition: WLC
  text: וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ וַ/יִּקְרָא֙ לַ/מָּק֔וֹם אֵ֖ל בֵּֽית אֵ֑ל כִּ֣י שָׁ֗ם נִגְל֤וּ אֵלָי/ו֙ הָֽ/אֱלֹהִ֔ים בְּ/בָרְח֖/וֹ מִ/פְּנֵ֥י אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: vi
  text: Ở đó, ông dựng một bàn thờ và gọi nơi ấy là Ên-Bê-tên[a], vì tại đó Đức Chúa Trời đã hiện ra với ông khi ông chạy trốn anh mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ên-Bê-tên” có lẽ có nghĩa là “Đức Chúa Trời của Bê-tên.”
    reason: Giải thích nghĩa có khả năng nhất của địa danh אֵל בֵּית אֵל, trong khi chính văn giữ dạng tên riêng.
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Tại đó, ông xây một bàn thờ
  rationale: Giữ trạng từ chỉ nơi chốn và nghĩa kể chuyện thông thường của בנה; “bàn thờ” là cách gọi tự nhiên, chuẩn xác của מִזְבֵּחַ.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: gọi nơi ấy là
  rationale: Diễn đạt tự nhiên cấu trúc קרא + לְ trong ngữ cảnh đặt tên, đồng thời vẫn giữ rõ hành động gọi tên nơi chốn.
- source_word: אֵל בֵּית אֵל
  choice: Ên Bê-tên
  rationale: Cụm từ hoạt động như địa danh được Gia-cốp đặt cho nơi ấy, nên phiên âm trong chính văn; nghĩa từ nguyên được nêu ở chú thích.
- source_word: כִּי שָׁם
  choice: vì tại đó
  rationale: כִּי nêu lý do của việc đặt tên; lặp lại ý “tại đó” như nguyên văn.
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: Đức Chúa Trời đã hiện ra với ông
  rationale: Niphal của גלה trong ngữ cảnh thần hiện được diễn đạt tự nhiên là “hiện ra”; thể số nhiều của động từ đi với אֱלֹהִים được quy chiếu số ít theo văn cảnh nói về Đức Chúa Trời của Gia-cốp.
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: khi ông chạy trốn anh mình
  rationale: Cấu trúc nguyên mẫu với בְּ mang nghĩa thời gian; מִפְּנֵי trong ngữ cảnh chạy trốn được chuyển tự nhiên là “trốn” một người. “Anh mình” phản ánh quan hệ cụ thể với Ê-sau.
theological_decisions:
- issue: אֱלֹהִים đi với động từ số nhiều נִגְלוּ nhưng chỉ Đức Chúa Trời của Y-sơ-ra-ên
  choice: 'Dịch theo nghĩa số ít: “Đức Chúa Trời đã hiện ra với ông”'
  alternative: Dịch sát hình thái số nhiều theo hướng “các thần đã hiện ra với ông”
  rationale: Văn cảnh quy chiếu đến cuộc gặp của Gia-cốp với Đức Chúa Trời tại Bê-tên. Bản dịch số ít tránh tạo hàm ý đa thần không có trong mạch truyện, nhưng không đưa thêm giải thích giáo lý về sự bất tương hợp hình thái.
- issue: Nên dịch nghĩa hay phiên âm אֵל בֵּית אֵל
  choice: Phiên âm địa danh “Ên Bê-tên” trong chính văn
  alternative: Dịch “Đức Chúa Trời của Bê-tên”
  rationale: Cụm này là tên Gia-cốp đặt cho nơi ấy. Phiên âm bảo toàn chức năng địa danh, còn chú thích giữ lại ý nghĩa từ nguyên có khả năng nhất.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong Kinh Thánh tiếng Việt; giữ địa danh dưới dạng phiên âm và đặt dấu chú thích [a] ngay trong chính văn.
