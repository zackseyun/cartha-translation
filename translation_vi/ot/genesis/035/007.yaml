  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của tiếng Hê-bơ-rơ: Gia-cốp xây bàn thờ, đặt tên địa điểm, nêu lý do gắn với sự tự bày tỏ của Đức Chúa Trời, và thời điểm ông chạy trốn anh mình. “Đức Chúa Trời đã hiện ra với ông” là cách chuyển ngữ tự nhiên, phù hợp ngữ cảnh cho נִגְלוּ אֵלָיו הָאֱלֹהִים, không ép hình thức số nhiều thành ý nghĩa đa thần.'
