  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Nô-ê: “Hãy vào tàu, con cùng cả nhà con, vì Ta thấy con là người công chính trước mặt Ta trong thế hệ này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời dưới dạng chuyển tự quen dùng, thay vì thay bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đẩy câu chuyện tiến tới; “Rồi” thể hiện trình tự tự nhiên, còn “phán” phù hợp với lời Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: בֹּא
  choice: Hãy vào
  rationale: Mệnh lệnh có nghĩa là “đến/vào”; trong ngữ cảnh bước vào tàu, “Hãy vào” tự nhiên và trực tiếp.
- source_word: בֵּיתְךָ
  choice: cả gia đình con
  rationale: “Nhà” trong tiếng Hê-bơ-rơ ở đây chỉ những người thuộc hộ gia đình, không phải tòa nhà; “gia đình” là cách nói hiện đại, dễ hiểu.
- source_word: הַתֵּבָה
  choice: tàu
  rationale: תֵּבָה chỉ chiếc tàu kín của Nô-ê. “Tàu” là cách gọi tự nhiên trong tiếng Việt và tránh gợi nghĩa không phù hợp của “hòm”.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu lý do cho mệnh lệnh và được chuyển tự nhiên bằng “vì”.
- source_word: רָאִיתִי
  choice: Ta thấy
  rationale: Động từ hoàn thành diễn tả sự quan sát và đánh giá của Đức Chúa Trời; tiếng Việt không bắt buộc đánh dấu thì hoàn thành, nên “Ta thấy” vừa tự nhiên vừa giữ được ý.
- source_word: צַדִּיק
  choice: người công chính
  rationale: “Công chính” là từ tương ứng ổn định với צַדִּיק và giữ được sức nặng đạo đức-thần học của từ nguồn.
- source_word: לְפָנַי
  choice: trước mặt Ta
  rationale: Chuyển sát thành ngữ Hê-bơ-rơ về sự hiện diện và đánh giá của Đức Chúa Trời, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: בַּדּוֹר הַזֶּה
  choice: giữa thế hệ này
  rationale: Cụm từ nói đến thế hệ đương thời của Nô-ê; “giữa” làm rõ sự đối chiếu với những người cùng thời mà không thêm ý ông là người duy nhất công chính.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm; bản dịch giữ danh ấy bằng chuyển tự, không thay thế bằng tước hiệu.
- issue: Ý nghĩa sự công chính của Nô-ê
  choice: Ta thấy con là người công chính trước mặt Ta
  alternative: chỉ mình con là công chính; Ta kể con là công chính
  rationale: Câu Hê-bơ-rơ trình bày sự đánh giá của Đức Chúa Trời về Nô-ê nhưng không nói “chỉ mình con” và cũng không giải thích cơ sở thần học của sự công chính; bản dịch giữ nguyên độ mở ấy.
- issue: Phạm vi của בַּדּוֹר הַזֶּה
  choice: giữa thế hệ này
  alternative: trong thế hệ này; trong thời đại này
  rationale: “Thế hệ” chỉ những người đồng thời với Nô-ê; “giữa” thể hiện bối cảnh so sánh mà không biến câu thành một tuyên bố độc quyền.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp xưng hô “Ta—con” trong lời Yahweh nói với Nô-ê; giữ tên “Yahweh” và dạng tên Việt hóa quen thuộc “Nô-ê”. Không cần chú thích vì câu không có dị bản hay điểm mơ hồ nào cần giải thích ngoài những gì bản dịch có thể giữ trực tiếp.
