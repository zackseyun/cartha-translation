revisions:
- from: 'Rồi Yahweh phán với Nô-ê: “Hãy vào tàu, con và cả gia đình con, vì Ta thấy con là người công chính trước mặt Ta giữa thế hệ này.”'
  to: 'Rồi Yahweh phán với Nô-ê: “Hãy vào tàu, con cùng cả nhà con, vì Ta thấy con là người công chính trước mặt Ta trong thế hệ này.”'
  rationale: Chỉnh hai cách diễn đạt để phản ánh trực tiếp hơn “household” và giới từ “trong” của nguyên văn, đồng thời giữ nguyên ý nghĩa, tính trang trọng và độ mở thần học của câu.
