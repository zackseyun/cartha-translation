  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: vi
  text: Trong số mọi loài vật thanh sạch, ngươi hãy lấy cho mình bảy cặp[a], mỗi cặp gồm một con đực và một con cái; còn trong số những loài vật không thanh sạch, hãy lấy hai con[b], một con đực và một con cái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “bảy, bảy, một con đực và con cái của nó”; cụm này nhiều khả năng có nghĩa là bảy cặp, dù cũng có người hiểu là bảy cá thể.
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “những loài vật ô uế.” Tiếng Hê-bơ-rơ nói “những loài vật không thanh sạch.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: Trong mọi loài vật
  rationale: מִן với כֹּל chỉ tập hợp mà từ đó chọn ra; trong tiếng Việt, “trong mọi loài vật” diễn đạt tự nhiên ý phân phối của danh từ tập hợp בְּהֵמָה.
- source_word: הַטְּהוֹרָה
  choice: thanh sạch
  rationale: טָהוֹר ở đây chỉ sự phân biệt sạch/không sạch. “Thanh sạch” trang trọng, dễ hiểu và không thêm nghĩa chuyên biệt như “thanh sạch theo nghi lễ”.
- source_word: תִּקַּח לְךָ
  choice: ngươi hãy đem theo
  rationale: Dạng vị hoàn thành chưa trọn có chức năng mệnh lệnh; “hãy” thể hiện lời truyền. “Đem theo” chuyển tải tự nhiên động từ לקח cùng לְךָ trong bối cảnh đưa các con vật vào tàu.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: bảy cặp
  rationale: Sự lặp lại số từ biểu thị cách phân nhóm/phân phối; cụm kế tiếp về con đực và bạn đôi của nó hỗ trợ cách hiểu là bảy cặp. Chú thích giữ lại nghĩa sát chữ và cách hiểu khác.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: mỗi cặp một con đực và một con cái
  rationale: Nghĩa sát chữ là “một con đực/người nam và con cái/vợ của nó”; khi nói về động vật, cách diễn đạt theo giới tính tự nhiên và rõ ràng hơn. Từ “mỗi cặp” làm rõ quan hệ với “bảy cặp” mà không thay đổi số lượng.
- source_word: וּמִן הַבְּהֵמָה אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: còn trong những loài vật không thanh sạch
  rationale: Giữ cách nói phủ định trực tiếp của tiếng Hê-bơ-rơ, “không thanh sạch”, thay vì thay bằng một thuật ngữ đối nghĩa; “còn” thể hiện sự tương phản tự nhiên.
- source_word: שְׁנַיִם
  choice: hai con
  rationale: שְׁנַיִם có nghĩa là “hai”; thêm danh từ loại “con” là cần thiết trong tiếng Việt và cụm sau xác định đó là một con đực với một con cái.
theological_decisions:
- issue: Số lượng loài vật thanh sạch trong cụm שִׁבְעָה שִׁבְעָה
  choice: bảy cặp động vật thanh sạch
  alternative: bảy cá thể động vật thanh sạch; hoặc dịch sát chữ “bảy, bảy”
  rationale: Số từ lặp lại, theo sau bởi “một con đực và con cái của nó”, nhiều khả năng chỉ bảy đơn vị ghép đôi; sự tương phản với “hai con, một con đực và một con cái” cũng hỗ trợ cách hiểu này. Vì văn bản Hê-bơ-rơ vẫn có thể được hiểu là bảy cá thể, phương án ấy được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ngươi” để phù hợp lời Đức Chúa Trời phán trực tiếp với Nô-ê trong văn phong Kinh Thánh, nhưng tránh cấu trúc cổ khó hiểu. “Thanh sạch/không thanh sạch” giữ nguyên sự đối xứng của nguyên văn; “ô uế” chỉ được nêu như phương án từ vựng trong chú thích.
