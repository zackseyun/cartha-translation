  yaml_path: translation/ot/genesis/007/020.yaml
  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: vi
  text: Nước dâng lên mười lăm cu-bít, và các núi bị phủ lấp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo ngữ cảnh, cũng có thể hiểu là nước cao hơn đỉnh núi mười lăm cu-bít. Cú pháp Hê-bơ-rơ không nêu rõ mốc đo. Một cu-bít dài khoảng 45 xentimét; mười lăm cu-bít tương đương khoảng 6,8 mét.
    reason: Bảo tồn sự mơ hồ của cụm «mười lăm cu-bít lên trên» trong nguyên văn, đồng thời giải thích cách hiểu theo ngữ cảnh và đơn vị đo cổ.
lexical_decisions:
- source_word: גָּבְרוּ הַמַּיִם
  choice: Nước dâng cao
  rationale: Động từ גבר diễn tả nước mạnh lên, gia tăng hoặc dâng cao; trong ngữ cảnh đo độ cao của nước, “dâng cao” là cách nói tự nhiên và sát nghĩa.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה מִלְמַעְלָה
  choice: cao hơn các núi mười lăm cu-bít
  rationale: מִלְמַעְלָה mang nghĩa “ở phía trên/cao hơn”; cụm này được hiểu theo quan hệ với các núi được nhắc ngay sau đó, nhưng cấu trúc Hê-bơ-rơ cũng có thể được đọc sát hơn là nước dâng “mười lăm cu-bít lên phía trên”.
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: và các núi đều bị nước phủ lấp
  rationale: Dạng bị động của כסה có nghĩa là “được/bị che phủ”; thêm “nước” làm rõ tác nhân đã có trong vế trước, còn “đều” truyền đạt tính bao quát của danh từ xác định số nhiều trong ngữ cảnh.
theological_decisions:
- issue: Mốc đo của mười lăm cu-bít
  choice: Diễn đạt rằng nước cao hơn các núi mười lăm cu-bít
  alternative: “Nước dâng lên mười lăm cu-bít, và các núi bị phủ lấp”
  rationale: Ngữ cảnh và cách hiểu thông dụng liên hệ con số với độ sâu của nước trên các núi; vì cú pháp Hê-bơ-rơ cô đọng và không nêu lại mốc đo một cách tường minh, ghi chú bảo tồn khả năng đọc sát cấu trúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đơn vị cổ “cu-bít” để tránh tạo độ chính xác giả khi quy đổi, rồi cung cấp giá trị gần đúng trong chú thích.
