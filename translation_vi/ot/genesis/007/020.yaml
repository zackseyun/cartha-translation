    rationale: Nguyên văn nói theo nghĩa đen rằng nước mạnh/dâng «mười lăm cu-bít lên trên», rồi núi bị che phủ; không lặp lại hay chỉ rõ «các núi» là mốc đo. Cách hiểu truyền thống là hợp lý nhưng nên được đặt trong chú thích để bảo tồn tính cô đọng và mơ hồ cú pháp của nguồn.
  - severity: low
