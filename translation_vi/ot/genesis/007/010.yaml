base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/010.yaml
  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: vi
  text: Sau bảy ngày[a], nước lụt đã tràn trên mặt đất[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “Và xảy ra sau bảy ngày, nước lụt ở trên đất.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trái đất”. Từ Hê-bơ-rơ אֶרֶץ có thể có nghĩa là “đất” hoặc “trái đất”, tùy theo ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: Sau bảy ngày
  rationale: Cụm mở đầu theo nghĩa đen là “và xảy ra vào/sau bảy ngày”; trong mạch kể chuyện, “Sau bảy ngày” diễn đạt tự nhiên và trung thành điểm thời gian đã đến.
- source_word: וּמֵי הַמַּבּוּל
  choice: nước lụt
  rationale: Danh từ מַבּוּל chỉ trận lụt thời Nô-ê; tiếng Việt tự nhiên dùng “nước lụt” cho toàn bộ cụm từ, thay vì dịch máy móc là “các dòng nước của trận lụt”.
- source_word: הָיוּ עַל
  choice: tràn trên
  rationale: Nghĩa sát là “đã ở trên”, nhưng trong ngữ cảnh nói về sự khởi phát của trận lụt, “tràn trên” truyền đạt sắc thái sự kiện một cách tự nhiên mà không thêm một tác nhân hay kết quả ngoài câu.
- source_word: הָאָרֶץ
  choice: đất
  rationale: אֶרֶץ có thể chỉ “đất/đất đai” hoặc “trái đất”. Chọn từ tiếng Việt “đất” để giữ phần nào độ mở từ vựng của nguyên văn; chú thích nêu rõ khả năng hiểu là toàn thể trái đất.
theological_decisions:
- issue: Phạm vi của אֶרֶץ trong trình thuật nước lụt
  choice: đất
  alternative: trái đất
  rationale: Nguyên ngữ có thể mang phạm vi địa phương hoặc toàn thể thế giới. Bản dịch chính không ép câu này tự nó giải quyết tranh luận về phạm vi trận lụt; chú thích bảo tồn cách hiểu rộng hơn vốn phù hợp với mạch văn tổng thể.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. “Nước lụt” là cách nói phổ thông; “tràn trên đất” giữ tính biến cố của câu, còn chú thích bảo tồn cấu trúc sát nguyên văn và sự mơ hồ về phạm vi của אֶרֶץ.
