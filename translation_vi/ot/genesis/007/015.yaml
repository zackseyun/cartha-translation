base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: vi
  text: Chúng từng đôi một, từ mọi xác thịt có sinh khí, đến với Nô-ê vào trong con tàu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thần khí của sự sống”. Từ Hê-bơ-rơ רוּחַ có thể có nghĩa là “hơi thở”, “gió” hoặc “thần khí”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Chúng đến
  rationale: Động từ בוא ở dạng trần thuật diễn tả sự di chuyển trong quá khứ; “đến” tự nhiên trong tiếng Việt và để các cụm theo sau xác định đích đến.
- source_word: אֶל נֹחַ
  choice: với Nô-ê
  rationale: אֶל chỉ hướng về một người; trong ngữ cảnh này, “đến với Nô-ê” diễn đạt tự nhiên việc các con vật tiến đến chỗ ông.
- source_word: אֶל הַתֵּבָה
  choice: vào trong con tàu
  rationale: Dù אֶל thường có nghĩa là “đến”, ngữ cảnh cho thấy điểm cuối của chuyển động là bên trong תֵּבָה. “Vào trong con tàu” truyền đạt rõ ý này.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: từng đôi một
  rationale: Việc lặp lại số từ mang nghĩa phân phối theo từng cặp; “từng đôi một” vừa chính xác vừa tự nhiên.
- source_word: מִכָּל הַבָּשָׂר
  choice: từ mọi loài xác thịt
  rationale: בָּשָׂר nghĩa đen là “xác thịt” và trong trình thuật lụt hồng thủy chỉ rộng đến các sinh vật có thân xác. Thêm “loài” giúp câu tiếng Việt sáng nghĩa mà vẫn giữ hình ảnh nguồn.
- source_word: אֲשֶׁר בּוֹ
  choice: có
  rationale: Cấu trúc quan hệ “ở trong đó có” được chuyển thành “có” cho tự nhiên trong tiếng Việt mà không thay đổi quan hệ bổ nghĩa.
- source_word: רוּחַ חַיִּים
  choice: sinh khí
  rationale: רוּחַ có thể là hơi thở, gió hoặc thần khí; trong ngữ cảnh các sinh vật, “sinh khí” gọn và tự nhiên, đồng thời vẫn gợi hơi thở làm nên sự sống. Dạng số nhiều חַיִּים mang nghĩa thành ngữ là “sự sống”.
theological_decisions:
- issue: Nghĩa của רוּחַ trong cụm רוּחַ חַיִּים
  choice: sinh khí
  alternative: thần khí sự sống
  rationale: Ngữ cảnh về các sinh vật nghiêng về hơi thở/sinh khí duy trì sự sống, nhưng từ רוּחַ vẫn có thể mang nghĩa “thần khí”. Bản chính chọn cách nói tự nhiên theo ngữ cảnh và chú thích giữ lại khả năng nghĩa kia, không áp đặt một hệ nhân học thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc chuyển động kép “đến với Nô-ê, vào trong con tàu” cùng hình ảnh “xác thịt”, đồng thời dùng dấu phẩy để câu tiếng Việt rõ nhịp.
