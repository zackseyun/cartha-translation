- from: Chúng đến với Nô-ê, vào trong con tàu, từng đôi một, từ mọi loài xác thịt có sinh khí[a].
  to: Chúng từng đôi một, từ mọi xác thịt có sinh khí, đến với Nô-ê vào trong con tàu[a].
  rationale: Bản sửa bỏ từ thêm “loài”, sắp xếp lại các cụm bổ ngữ để câu tự nhiên hơn trong tiếng Việt, và chỉnh cách diễn đạt của phương án chú thích. “Sinh khí”, “xác thịt”, “Nô-ê”, “con tàu”, và tính phân phối của “từng đôi một” đều được giữ để bảo toàn nghĩa và âm hưởng của nguyên ngữ.
