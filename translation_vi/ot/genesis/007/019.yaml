- from: Nước dâng lên vô cùng mãnh liệt trên khắp đất[a], và mọi núi cao dưới khắp các tầng trời[b] đều bị ngập.
  to: Nước dâng lên cực kỳ dữ dội trên đất[a], và mọi núi cao dưới khắp bầu trời[b] đều bị nước phủ kín.
  rationale: Bản sửa loại bỏ sự mở rộng không cần thiết “khắp” khỏi “đất”, thay lối diễn đạt gượng bằng tiếng Việt hiện đại, và dịch הַשָּׁמָיִם theo cách tự nhiên mà vẫn bảo lưu phương án sát hình thức trong chú thích. Câu tiếp tục phản ánh nước áp đảo dữ dội, cùng việc mọi núi cao trong phạm vi được nêu bị nước phủ kín.
