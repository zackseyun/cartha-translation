  text: וְ/הַ/מַּ֗יִם גָּֽבְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/יְכֻסּ֗וּ כָּל הֶֽ/הָרִים֙ הַ/גְּבֹהִ֔ים אֲשֶׁר תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: vi
  text: Nước dâng lên cực kỳ dữ dội trên đất[a], và mọi núi cao dưới khắp bầu trời[b] đều bị nước phủ kín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể dịch là “đất đai” hoặc “xứ”, tùy cách hiểu về phạm vi của trận lụt trong văn cảnh.
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “dưới mọi tầng trời” hoặc “dưới cả bầu trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: dâng lên ... mãnh liệt
  rationale: Động từ גבר diễn tả sự trở nên mạnh, thắng thế hoặc áp đảo. Trong ngữ cảnh nước lụt, cách dịch này vừa tự nhiên trong tiếng Việt vừa giữ được ý nước gia tăng với sức mạnh áp đảo.
- source_word: מְאֹד מְאֹד
  choice: vô cùng
  rationale: Trạng từ được lặp lại để nhấn mạnh ở mức cao nhất; “vô cùng” chuyển tải cường độ mạnh mà vẫn trang trọng, tự nhiên.
- source_word: עַל הָאָרֶץ
  choice: trên khắp đất
  rationale: עַל mang nghĩa “trên”, còn אָרֶץ có thể chỉ “đất” hoặc “đất đai/xứ”. Thêm “khắp” thể hiện tầm bao quát trong văn cảnh, nhưng chú thích vẫn bảo lưu khả năng hiểu hẹp hơn của danh từ.
- source_word: וַיְכֻסּוּ
  choice: đều bị ngập
  rationale: Dạng này trình bày các núi như đối tượng bị nước phủ. “Bị ngập” tự nhiên hơn “bị che phủ” khi nói về nước và diễn đạt rõ kết quả.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: mọi núi cao
  rationale: Giữ sát cấu trúc và phạm vi của tiếng Hê-bơ-rơ; הָרִים ở đây phù hợp nhất với “núi” và גְּבֹהִים là “cao”.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: dưới khắp các tầng trời
  rationale: Giữ sắc thái số nhiều hình thái của שָׁמַיִם và phạm vi bao quát của כָּל; chú thích nêu cách diễn đạt tiếng Việt gọn, quen thuộc hơn.
theological_decisions:
- issue: Phạm vi nghĩa của אָרֶץ trong trình thuật lũ lụt
  choice: đất
  alternative: đất đai hoặc xứ
  rationale: “Đất” trong tiếng Việt có thể chỉ toàn mặt đất mà không áp đặt một thuật ngữ khoa học hiện đại; cụm “dưới khắp các tầng trời” duy trì cách diễn đạt bao quát của câu. Chú thích bảo lưu nghĩa địa phương có thể có của אָרֶץ tùy cách hiểu văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Dâng lên vô cùng mãnh liệt” tránh lối dịch cổ “thắng thế” nhưng vẫn giữ sức mạnh của גבר; các chú thích bảo tồn những điểm mơ hồ thực sự của אָרֶץ và שָׁמַיִם.
