  text: Mưa đổ xuống đất suốt bốn mươi ngày và bốn mươi đêm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הַגֶּשֶׁם עַל־הָאָרֶץ
  choice: Mưa đổ xuống đất
  rationale: Cụm Hê-bơ-rơ diễn tả việc mưa xảy ra trên đất; “đổ xuống” là cách nói tự nhiên trong tiếng Việt, truyền đạt rõ trận mưa kéo dài mà không thêm ý ngoài văn cảnh.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: suốt bốn mươi ngày và bốn mươi đêm
  rationale: “Suốt” diễn đạt tự nhiên khoảng thời gian liên tục được nêu trong nguyên bản; giữ nguyên cấu trúc “ngày… đêm”.
