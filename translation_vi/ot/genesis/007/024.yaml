  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: vi
  text: Nước tiếp tục dâng mạnh trên đất trong một trăm năm mươi ngày.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “trên xứ”; từ Hê-bơ-rơ אֶרֶץ có thể có nghĩa là “đất” hoặc “xứ”, tùy theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: cứ dâng mạnh
  rationale: Động từ גבר ở thể Qal diễn tả nước trở nên mạnh và chiếm ưu thế. Trong tiếng Việt, “cứ dâng mạnh” vừa tự nhiên trong bối cảnh nước lụt, vừa thể hiện sức nước tiếp tục áp đảo; tránh cách dịch đơn thuần là “gia tăng”.
- source_word: הַמַּיִם
  choice: Nước
  rationale: Danh từ tiếng Hê-bơ-rơ có hình thức số nhiều, nhưng tiếng Việt tự nhiên dùng danh từ khối “nước”; ý nghĩa về toàn khối nước lụt vẫn được giữ nguyên.
- source_word: עַל הָאָרֶץ
  choice: trên khắp đất
  rationale: עַל có nghĩa là “trên”, còn אֶרֶץ có thể chỉ “đất” hoặc “xứ”. Thêm “khắp” để diễn đạt tự nhiên phạm vi bao phủ và thế áp đảo của nước trong mạch văn, nhưng không dùng từ ngữ mang tính kỹ thuật.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: suốt một trăm năm mươi ngày
  rationale: Cụm số Hê-bơ-rơ theo nghĩa đen là “năm mươi và một trăm ngày”, tức 150 ngày. “Suốt” diễn đạt khoảng thời gian kéo dài một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của אֶרֶץ trong trình thuật nước lụt
  choice: đất
  alternative: xứ
  rationale: Mạch văn trực tiếp trình bày nước lụt với phạm vi phổ quát, nên “đất” phù hợp hơn; tuy vậy, từ Hê-bơ-rơ cũng có thể mang nghĩa “xứ”, vì thế phương án này được ghi ở chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nước” theo lối dùng tự nhiên của tiếng Việt; “cứ dâng mạnh” giữ nét tiếp diễn và sức áp đảo của động từ Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau câu.
