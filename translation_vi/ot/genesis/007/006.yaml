  yaml_path: translation/ot/genesis/007/006.yaml
  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: vi
  text: Nô-ê đã sáu trăm tuổi, và nước lụt tràn trên mặt đất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Từ Hê-bơ-rơ ở đây có thể chỉ «đất», «xứ» hoặc «trái đất». Cấu trúc câu Hê-bơ-rơ sát nghĩa hơn là: «Nô-ê là con trai của sáu trăm năm, và trận lụt là nước trên đất»; cách nói «con trai của ... năm» là thành ngữ chỉ tuổi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Nô-ê
  rationale: Tên riêng được phiên âm theo cách quen thuộc trong tiếng Việt; liên từ וְ được thể hiện qua cấu trúc nối tự nhiên của toàn câu, không thêm một trạng từ chuyển ý không có trong nguyên văn.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: được sáu trăm tuổi
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ tuổi, nghĩa đen là ‘con trai của sáu trăm năm’; cách diễn đạt đã chọn tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: וְ/הַ/מַּבּוּל
  choice: và nước lụt
  rationale: מַבּוּל chỉ trận đại hồng thủy trong mạch văn này. ‘Nước lụt’ vừa tự nhiên vừa giữ được đặc tính nước được nêu rõ bởi מַיִם ở vị ngữ.
- source_word: הָיָה מַיִם
  choice: tràn
  rationale: Cấu trúc Hê-bơ-rơ sát chữ là ‘đã là nước’; ‘tràn’ truyền đạt ý nước lụt hiện diện và phủ lên mặt đất bằng tiếng Việt tự nhiên, trong khi chú thích bảo lưu cấu trúc sát chữ.
- source_word: עַל הָאָרֶץ
  choice: trên mặt đất
  rationale: עַל là ‘trên’; הָאָרֶץ có thể là ‘đất’ hoặc ‘trái đất’. ‘Trên mặt đất’ phù hợp ngữ cảnh và không buộc người đọc phải chọn trước phạm vi địa lý của danh từ.
theological_decisions:
- issue: Phạm vi nghĩa của הָאָרֶץ
  choice: mặt đất
  alternative: trái đất; xứ
  rationale: Danh từ Hê-bơ-rơ có thể chỉ đất, xứ hoặc toàn thể trái đất. ‘Mặt đất’ giữ được sự tự nhiên và phần nào bảo lưu độ mở của nguyên văn, tránh biến một lựa chọn từ vựng thành khẳng định giáo lý về phạm vi trận lụt.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Câu chính ưu tiên tiếng Việt tự nhiên; chú thích ghi lại cấu trúc Hê-bơ-rơ khác thường và sự đa nghĩa của הָאָרֶץ.
