  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ/בָּאִ֗ים זָכָ֨ר וּ/נְקֵבָ֤ה מִ/כָּל בָּשָׂר֙ בָּ֔אוּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִ֑ים וַ/יִּסְגֹּ֥ר יְהוָ֖ה בַּֽעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: vi
  text: Các con vật đi vào—đực và cái, thuộc mọi loài sinh vật[a]—đã vào như Đức Chúa Trời đã truyền cho ông; rồi Yahweh khép lại phía sau ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ mọi xác thịt”; đây là cách nói tập hợp chỉ các sinh vật.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “Yahweh đã nhốt ông ở trong.” Nguyên văn không nói rõ vật được khép/đóng (chẳng hạn lối vào), dù ngữ cảnh hàm ý điều đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: Những con vật đi vào ... đều vào
  rationale: Giữ được cấu trúc tiếng Hê-bơ-rơ gồm phân từ dùng như danh từ và động từ hữu hạn lặp lại, đồng thời thêm “con vật” để câu tiếng Việt rõ nghĩa theo ngữ cảnh.
- source_word: זָכָר וּנְקֵבָה
  choice: đực và cái
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt khi nói về giới tính của động vật.
- source_word: מִכָּל בָּשָׂר
  choice: từ mọi loài sinh vật
  rationale: בָּשָׂר có nghĩa đen là “xác thịt” nhưng tại đây được dùng theo nghĩa tập hợp chỉ các sinh vật; “mọi loài sinh vật” truyền đạt đúng ý trong tiếng Việt hiện đại, còn “từ” phản ánh giới từ מִן.
- source_word: כַּאֲשֶׁר
  choice: theo như
  rationale: Diễn tả việc chúng đi vào phù hợp với mệnh lệnh đã ban, đồng thời tự nhiên trong mạch văn tiếng Việt.
- source_word: צִוָּה אֹתוֹ אֱלֹהִים
  choice: Đức Chúa Trời đã truyền cho ông
  rationale: “Truyền” thể hiện tính chất mệnh lệnh; “đã” cho thấy mệnh lệnh có trước hành động đi vào. Đại từ “ông” giữ nguyên đối tượng số ít nam mà không thêm tên Nô-ê vào câu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó phân biệt với אֱלֹהִים xuất hiện trước đó.
- source_word: וַיִּסְגֹּר יְהוָה בַּעֲדוֹ
  choice: rồi Yahweh đóng lại phía sau ông
  rationale: Giữ việc câu Hê-bơ-rơ không nêu rõ vật được đóng và bảo tồn sắc thái không gian của בַּעֲדוֹ; ngữ cảnh cho thấy lối vào tàu được đóng lại.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn đây là danh riêng và không đồng nhất nó với tước hiệu אֱלֹהִים (“Đức Chúa Trời”) trong cùng câu.
- issue: Chủ thể được bảo vệ hay vị trí của hành động đóng
  choice: đóng lại phía sau ông
  alternative: đóng ông ở bên trong
  rationale: Cụm בַּעֲדוֹ có thể được hiểu theo sắc thái “phía sau ông” hoặc thành ngữ “đóng ông ở bên trong”. Bản chính không thêm “cửa” vì danh từ ấy không có trong tiếng Hê-bơ-rơ; chú thích bảo tồn cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ sự lặp lại “đi vào ... đều vào” của bản Hê-bơ-rơ nhưng dùng “con vật” và “sinh vật” để tránh lối nói “xác thịt” khó hiểu trong tiếng Việt hiện đại. Dấu chấm phẩy giúp phân biệt hành động các con vật đi vào với hành động kết thúc của Yahweh.
