  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֛יִם וַ/יִּרְבּ֥וּ מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/תֵּ֥לֶךְ הַ/תֵּבָ֖ה עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/018.yaml
  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: vi
  text: Nước dâng mạnh và gia tăng rất nhiều trên đất, còn con tàu trôi trên mặt nước.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: dâng mạnh
  rationale: Động từ גבר diễn tả nước trở nên mạnh và lấn át. Trong tiếng Việt, “dâng mạnh” vừa tự nhiên trong ngữ cảnh lụt vừa giữ sắc thái sức mạnh, không chỉ nói đơn thuần rằng mực nước tăng.
- source_word: הַמַּיִם
  choice: nước
  rationale: Dù hình thức Hê-bơ-rơ là số nhiều, danh từ “nước” trong tiếng Việt là danh từ khối và là cách diễn đạt tự nhiên ở đây.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: gia tăng rất nhiều
  rationale: Giữ rõ ý tăng thêm của רבה cùng mức độ nhấn mạnh do מְאֹד biểu thị.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: אָרֶץ có thể chỉ “đất” hoặc “trái đất”. “Trên đất” giữ được độ rộng nghĩa của từ Hê-bơ-rơ và tránh tự ý ấn định phạm vi địa lý ngay trong câu này.
- source_word: וַתֵּלֶךְ
  choice: trôi
  rationale: הלך có nghĩa đen là “đi/chuyển động”; khi chủ thể là con tàu ở trên mặt nước, “trôi” là cách diễn đạt tiếng Việt tự nhiên, mô tả chuyển động mà không hàm ý tàu tự vận hành.
- source_word: הַתֵּבָה
  choice: con tàu
  rationale: תֵּבָה chỉ chiếc tàu đặc biệt của Nô-ê. “Con tàu” là cách gọi tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: trên mặt nước
  rationale: Cụm “trên mặt” truyền đạt thành ngữ Hê-bơ-rơ “trên mặt của nước”, nghĩa là trên bề mặt nước.
theological_decisions:
- issue: Phạm vi nghĩa của הָאָרֶץ
  choice: trên đất
  alternative: trên khắp trái đất
  rationale: Bản thân אָרֶץ có thể mang nghĩa “đất”, “xứ” hoặc “trái đất”. Cách dịch không thêm “khắp” nên bảo tồn độ mở từ vựng và không giải quyết thay cho văn mạch rộng hơn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và rõ ràng. Cấu trúc hai vế giữ diễn tiến của nguyên văn; dùng “còn” để nối tự nhiên mà không tạo quan hệ đối lập mạnh.
