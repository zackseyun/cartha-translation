  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: vi
  text: Họ, cùng với mọi loài thú rừng tùy theo loại, mọi loài gia súc tùy theo loại, mọi loài vật bò trên mặt đất tùy theo loại, và mọi loài chim tùy theo loại—mọi chim có cánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “mọi chim, mọi cánh.” Tiếng Hê-bơ-rơ dùng lối diễn đạt đồng vị để nhấn mạnh tất cả các loài chim có cánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Họ
  rationale: Đại từ số nhiều này chỉ Nô-ê và những người đã được kể ở câu trước; “Họ” nối tự nhiên với ngữ cảnh mà không thêm ý.
- source_word: הַחַיָּה
  choice: thú rừng
  rationale: Trong hệ thống phân loại động vật của Sáng Thế Ký, từ này thường chỉ thú hoang, phân biệt với בְּהֵמָה là gia súc.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: tùy theo loại
  rationale: Diễn đạt tự nhiên và sát nghĩa công thức phân loại lặp lại trong tiếng Hê-bơ-rơ.
- source_word: הַבְּהֵמָה
  choice: gia súc
  rationale: Chỉ chung các loài vật nuôi, không thu hẹp vào riêng bò; đồng thời giữ sự phân biệt với thú rừng.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: vật bò trên mặt đất
  rationale: Chuyển tải nhóm sinh vật di chuyển sát mặt đất; tiếng Việt không cần lặp từ theo cách “vật bò đang bò” vốn kém tự nhiên.
- source_word: הָעוֹף
  choice: chim
  rationale: Trong ngữ cảnh và nhờ cụm đồng vị tiếp theo, từ này được hiểu tự nhiên là các loài chim.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: mọi chim có cánh
  rationale: Cụm Hê-bơ-rơ dùng lối phân loại đồng vị, theo sát nghĩa đen là “mọi chim, mọi cánh”; bản dịch diễn đạt tự nhiên mà vẫn giữ nét nhấn mạnh bao quát.
