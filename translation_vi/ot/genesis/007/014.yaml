translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê cùng sự phân biệt giữa thú rừng, gia súc, loài bò trên mặt đất và chim; dùng dấu gạch ngang để thể hiện cụm đồng vị nhấn mạnh ở cuối câu.
