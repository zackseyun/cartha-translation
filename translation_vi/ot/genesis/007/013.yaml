base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: vi
  text: Ngay chính ngày hôm ấy, Nô-ê, Sem, Cham và Gia-phết là các con trai ông, vợ Nô-ê, và ba người vợ của các con trai ông đã cùng nhau vào tàu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Chính trong ngày ấy
  rationale: Thành ngữ nhấn mạnh đó là đúng ngày đã được nói đến; cách dịch này giữ sắc thái nhấn mạnh mà vẫn tự nhiên trong tiếng Việt.
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: đã vào tàu
  rationale: Động từ có nghĩa cơ bản là “đến”, nhưng khi đi với đích đến là chiếc tàu, toàn cụm diễn tả việc đi vào. “Vào tàu” truyền đạt rõ chuyển động ấy trong tiếng Việt.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ
  choice: cùng các con trai là Sem, Cham và Gia-phết
  rationale: Giữ rõ ba người được nêu tên là các con trai của Nô-ê, đồng thời dùng cấu trúc liệt kê tự nhiên trong tiếng Việt.
- source_word: וְאֵשֶׁת נֹחַ
  choice: vợ ông
  rationale: Đại từ “ông” quy chiếu rõ về Nô-ê và tránh lặp tên không cần thiết.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: và ba người vợ của các con trai ông
  rationale: Bảo toàn số lượng ba và quan hệ gia đình được biểu thị bởi cấu trúc sở hữu trong tiếng Hê-bơ-rơ.
- source_word: אִתָּם
  choice: với nhau
  rationale: Dạng đại từ là số nhiều. “Với nhau” giữ ý cả nhóm cùng đi vào mà tránh cấu trúc tiếng Việt nặng nề do lặp từ “cùng” hoặc “với họ” ở cuối câu.
- source_word: הַתֵּבָה
  choice: tàu
  rationale: Trong trình thuật Nô-ê, תֵּבָה chỉ con tàu lớn dùng để bảo toàn sự sống; “tàu” là cách gọi rõ và tự nhiên cho độc giả Việt hiện đại.
