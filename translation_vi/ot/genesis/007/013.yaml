translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp lại vừa phải để danh sách thành viên gia đình rõ ràng trong tiếng Việt, đồng thời vẫn giữ sự nhấn mạnh về thời điểm và đại từ số nhiều ở cuối nguyên văn.
