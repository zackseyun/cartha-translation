source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: vi
  text: Năm thứ sáu trăm trong đời Nô-ê, vào tháng thứ hai, ngày mười bảy của tháng ấy, đúng ngày đó, mọi suối nguồn của vực sâu lớn đều vỡ tung[a], và các cửa sổ trên trời đều mở ra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mọi mạch nước của vực sâu lớn đều nứt toác.”
    reason: Nêu các cách dịch gần nghĩa cho מַעְיְנֹת và נִבְקְעוּ, đồng thời giữ hình ảnh các nguồn nước bị tách mở.
  - marker: b
    text: Hay “các cửa lũ trên trời đều mở ra.”
    reason: “Cửa lũ” diễn đạt khả năng hiểu theo chức năng của אֲרֻבּוֹת; chính văn giữ hình ảnh sát hơn là “cửa sổ”.
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: Vào năm thứ sáu trăm của đời Nô-ê
  rationale: Giữ công thức xác định thời gian theo tuổi đời Nô-ê, đồng thời diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: tháng thứ hai
  rationale: Cách diễn đạt trực tiếp, tự nhiên cho thứ tự của tháng.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ngày mười bảy trong tháng
  rationale: Cấu trúc số đếm Hê-bơ-rơ có chức năng chỉ ngày trong tháng; bản dịch giữ chính xác ngày tháng bằng lối nói Việt hiện đại.
- source_word: בַּיּוֹם הַזֶּה
  choice: đúng ngày ấy
  rationale: Từ “đúng” thể hiện sắc thái nhấn mạnh của công thức Hê-bơ-rơ mà không diễn giải quá mức.
- source_word: נִבְקְעוּ
  choice: nứt toác
  rationale: Động từ Nifal của בקע diễn tả việc bị tách hoặc nứt mở ra; “nứt toác” vừa sống động vừa phù hợp với biến cố dữ dội trong văn cảnh.
- source_word: כָּל מַעְיְנֹת
  choice: tất cả các mạch nước
  rationale: מַעְיָן chỉ suối, nguồn hay mạch nước. “Mạch nước” dễ hiểu trong tiếng Việt và phù hợp với hình ảnh nước trào ra từ vực sâu.
- source_word: תְּהוֹם רַבָּה
  choice: vực sâu mênh mông
  rationale: Giữ hình ảnh cổ xưa về khối nước sâu thẳm; “mênh mông” truyền đạt sức nhấn của רַבָּה mà không biến câu thành một lời giải thích khoa học hiện đại.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: và các cửa sổ trên trời
  rationale: Giữ nguyên ẩn tượng cụ thể “cửa sổ” của nguyên văn và số nhiều của שָׁמַיִם theo cách nói tự nhiên trong tiếng Việt.
- source_word: נִפְתָּחוּ
  choice: mở ra
  rationale: Trong tiếng Việt, nội động từ “mở ra” diễn đạt tự nhiên trạng thái các cửa được mở mà không cần dùng “được” hoặc “bị”, vốn có thể thêm sắc thái không có trong nguyên văn.
theological_decisions:
- issue: Hình ảnh vũ trụ về nguồn nước của trận lụt
  choice: Giữ “vực sâu mênh mông” và “các cửa sổ trên trời” như những hình ảnh của nguyên văn.
  alternative: Diễn giải thành “nước ngầm phun lên” và “các cửa xả nước trên bầu trời mở ra”.
  rationale: Câu Hê-bơ-rơ dùng hình ảnh vũ trụ cổ xưa vốn góp phần tạo nên sức mạnh của trình thuật. Bản dịch không tự ý chuyển các hình ảnh ấy thành một mô tả khoa học hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Nhịp câu giữ cấu trúc ngày tháng dồn lớp của nguyên văn trước khi chuyển sang hai biến cố song song. Các dấu chú thích [a] và [b] được đặt ngay sau những cụm từ mà chúng giải thích.
