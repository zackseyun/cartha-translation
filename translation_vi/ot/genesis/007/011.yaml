- from: Vào năm thứ sáu trăm của đời Nô-ê, tháng thứ hai, ngày mười bảy trong tháng, đúng ngày ấy, tất cả các mạch nước của vực sâu mênh mông đều nứt toác[a], và các cửa sổ trên trời mở ra[b].
  to: Năm thứ sáu trăm trong đời Nô-ê, vào tháng thứ hai, ngày mười bảy của tháng ấy, đúng ngày đó, mọi suối nguồn của vực sâu lớn đều vỡ tung[a], và các cửa sổ trên trời đều mở ra[b].
  rationale: Bản sửa làm cho công thức ngày tháng và mức độ nhấn của “vực sâu lớn” sát tiếng Hê-bơ-rơ hơn, đồng thời cải thiện độ tự nhiên của tiếng Việt. Hình ảnh vũ trụ cổ xưa vẫn được giữ nguyên; không diễn giải thành cơ chế thủy văn hiện đại.
