base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: vi
  text: Từ các loài vật thanh sạch và từ các loài vật không thanh sạch[a], từ các loài chim và mọi sinh vật bò trên mặt đất—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ô uế”. Nguyên văn Hê-bơ-rơ nói sát nghĩa hơn là “không thanh sạch”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: từ
  rationale: Giới từ chỉ thành phần được lấy ra từ từng nhóm; việc lặp lại “từ” duy trì cấu trúc liệt kê của tiếng Hê-bơ-rơ, dù tiếng Việt tự nhiên không cần lặp ở mọi vị trí.
- source_word: בְּהֵמָה
  choice: các loài vật
  rationale: Trong câu này, từ này là một nhóm rộng được đặt bên cạnh chim và sinh vật bò trên đất, không nhất thiết chỉ gia súc; “các loài vật” vừa rõ vừa tự nhiên.
- source_word: טְהוֹרָה
  choice: thanh sạch
  rationale: Từ này chỉ tình trạng sạch theo sự phân loại nghi lễ; “thanh sạch” truyền đạt sắc thái ấy rõ hơn “sạch” trong tiếng Việt thông dụng.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: không thanh sạch
  rationale: Giữ cách diễn đạt phủ định trực tiếp của nguyên văn, theo nghĩa đen là “không sạch”, thay vì tự động đổi thành một từ đối nghĩa.
- source_word: עוֹף
  choice: các loài chim
  rationale: Trong ngữ cảnh này, “chim” là cách gọi tự nhiên và đủ chính xác, dù từ Hê-bơ-rơ có thể bao quát rộng hơn các sinh vật bay.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: mọi loài bò
  rationale: Diễn tả các sinh vật được đặc trưng bởi chuyển động bò/trườn; “mọi loài bò” gọn, dễ hiểu và gần với động từ của nguyên văn.
- source_word: עַל הָאֲדָמָה
  choice: trên mặt đất
  rationale: Ở đây אֲדָמָה chỉ bề mặt đất nơi các sinh vật này di chuyển; “trên mặt đất” là cách diễn đạt tự nhiên trong tiếng Việt.
