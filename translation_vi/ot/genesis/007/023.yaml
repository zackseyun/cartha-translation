id: GEN.7.23
reference: Genesis 7:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: vi
  text: Ngài xóa sạch[a] mọi sinh vật trên mặt đất, từ loài người[b] đến gia súc, loài vật bò trên đất và chim trời[c]. Chúng bị xóa sạch khỏi mặt đất; chỉ còn lại Nô-ê cùng những gì ở với ông trong tàu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quét sạch”; động từ Hê-bơ-rơ gợi hình ảnh lau đi hoặc xóa bỏ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng từ אָדָם (’adam) theo nghĩa đại diện cho toàn thể nhân loại; cũng có thể dịch là “con người”.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “chim của các tầng trời”; cũng có thể dịch là “chim trên trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: xóa sạch / bị xóa sạch
  rationale: Động từ מחה gợi hình ảnh lau đi hoặc xóa bỏ. “Xóa sạch” giữ được sắc thái ấy và vẫn tự nhiên trong tiếng Việt; dạng Nifal ở lần thứ hai được diễn đạt bằng thể bị động “bị xóa sạch”.
- source_word: כָּל הַיְקוּם
  choice: mọi sinh vật
  rationale: Trong bối cảnh trận lụt, cụm này chỉ mọi hữu thể sống trên đất, chứ không phải khái niệm trừu tượng “mọi sự tồn tại”.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: trên mặt đất
  rationale: Cách diễn đạt tự nhiên, giữ hình ảnh bề mặt của đất trong thành ngữ Hê-bơ-rơ.
- source_word: מֵאָדָם
  choice: từ loài người
  rationale: אָדָם ở đây mang nghĩa đại diện cho nhân loại và mở đầu danh sách các nhóm sinh vật. “Loài người” truyền đạt rõ nghĩa tập thể trong tiếng Việt hiện đại.
- source_word: בְּהֵמָה
  choice: gia súc
  rationale: Chỉ các loài vật nuôi trên cạn; “gia súc” rõ nghĩa và không thu hẹp riêng vào bò.
- source_word: רֶמֶשׂ
  choice: loài vật bò trên đất
  rationale: Từ này bao gồm các sinh vật nhỏ di chuyển sát mặt đất; cách dịch này rộng và chính xác hơn việc giới hạn vào nhóm bò sát theo phân loại hiện đại.
- source_word: עוֹף הַשָּׁמַיִם
  choice: chim trời
  rationale: Cụm từ tự nhiên, trang trọng trong tiếng Việt, vừa chỉ chim vừa giữ mối liên hệ với bầu trời.
- source_word: מִן הָאָרֶץ
  choice: khỏi mặt đất
  rationale: Trong mạch câu, cách dịch này diễn tả việc các sinh vật bị quét khỏi nơi chúng sinh sống, đồng thời không áp đặt một kết luận khoa học về phạm vi địa lý của trận lụt.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: chỉ còn lại Nô-ê
  rationale: “Chỉ” thể hiện tiểu từ hạn định אַךְ, còn “còn lại” phản ánh động từ שׁאר.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: cùng những người và các loài vật ở với ông trong tàu
  rationale: Mệnh đề quan hệ Hê-bơ-rơ không nêu riêng người hay vật; bối cảnh cho thấy cả gia đình Nô-ê lẫn các loài vật đều ở trong tàu. Cách dịch nêu cả hai để tiếng Việt rõ và tự nhiên.
- source_word: תֵּבָה
  choice: tàu
  rationale: “Tàu” là từ hiện đại, dễ hiểu cho phương tiện lớn nổi trên nước trong câu chuyện Nô-ê; không thêm đặc điểm cấu tạo mà nguyên văn không nêu.
theological_decisions:
- issue: Phạm vi của sự hủy diệt trong lời thuật về trận lụt
  choice: Dịch trực tiếp lời khẳng định rằng mọi sinh vật trên mặt đất thuộc các nhóm được nêu đều bị xóa sạch.
  alternative: Hiểu đây là lối nói cường điệu về một vùng, hoặc diễn đạt thành một tuyên bố khoa học minh nhiên về toàn địa cầu.
  rationale: Bản dịch giữ nguyên sức nặng và phạm vi ngôn ngữ của câu Hê-bơ-rơ, nhưng không thêm lời giải thích nhằm phân xử cuộc tranh luận về phạm vi địa lý của trận lụt.
- issue: Đối tượng ở lại với Nô-ê trong tàu
  choice: Diễn đạt bao gồm cả những người và các loài vật ở với Nô-ê.
  alternative: Chỉ dịch là “những người ở với ông” hoặc dùng một đại từ mơ hồ khó hiểu trong tiếng Việt.
  rationale: Đại từ quan hệ אֲשֶׁר tự nó không phân loại đối tượng; ngữ cảnh của tàu cho thấy cả người lẫn vật. Cách diễn đạt này làm rõ điều hàm chứa trong ngữ cảnh mà không loại trừ bên nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp liệt kê của nguyên văn nhưng dùng các nhóm từ tự nhiên trong tiếng Việt. “Ngài” nối với chủ thể đã có trong văn mạch mà không tự ý lặp thêm danh xưng; “Nô-ê” theo lối phiên âm quen thuộc. Dấu chấm phẩy làm rõ sự chuyển từ phán quyết chung sang những người và vật còn sống sót.
