- from: Ngài xóa sạch[a] mọi sinh vật trên mặt đất, từ loài người[b] đến gia súc, loài vật bò trên đất và chim trời[c]. Chúng bị xóa sạch khỏi mặt đất; chỉ còn lại Nô-ê cùng những người và các loài vật ở với ông trong tàu.
  to: Ngài xóa sạch[a] mọi sinh vật trên mặt đất, từ loài người[b] đến gia súc, loài vật bò trên đất và chim trời[c]. Chúng bị xóa sạch khỏi mặt đất; chỉ còn lại Nô-ê cùng những gì ở với ông trong tàu.
