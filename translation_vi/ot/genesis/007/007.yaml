  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: vi
  text: Nô-ê cùng các con trai ông, vợ ông và vợ các con trai ông vào tàu vì nước lụt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đã vào
  rationale: Động từ בוא có thể mang nghĩa “đến”, “đi” hoặc “vào”; với אֶל הַתֵּבָה, “vào” diễn đạt tự nhiên và chính xác chuyển động vào trong tàu.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của tên riêng נֹחַ.
- source_word: בָנָיו
  choice: các con trai
  rationale: Danh từ Hê-bơ-rơ chỉ rõ các con trai, không phải con cái nói chung.
- source_word: אִשְׁתּוֹ
  choice: vợ ông
  rationale: Trong ngữ cảnh này, אִשָּׁה với hậu tố sở hữu có nghĩa rõ ràng là “vợ ông”.
- source_word: נְשֵׁי בָנָיו
  choice: vợ của các con trai ông
  rationale: Giữ sát cấu trúc Hê-bơ-rơ “những người vợ của các con trai ông”, thay vì chuyển thành quan hệ họ hàng “các con dâu”.
- source_word: אִתּוֹ
  choice: cùng với
  rationale: Cụm “cùng với” diễn đạt sự đồng hành với Nô-ê một cách tự nhiên trong tiếng Việt; đại từ “ông” ở các thành phần tiếp theo giúp xác định rõ quan hệ với Nô-ê.
- source_word: אֶל הַתֵּבָה
  choice: vào tàu
  rationale: Giới từ chỉ hướng kết hợp với động từ được diễn đạt bằng “vào”; תֵּבָה ở trình thuật Nô-ê được dịch bằng từ quen thuộc “tàu”.
- source_word: מִפְּנֵי
  choice: vì
  rationale: Ở đây giới từ nêu nguyên nhân hoặc hoàn cảnh thúc đẩy việc vào tàu; “vì” là cách diễn đạt ngắn gọn, tự nhiên.
- source_word: מֵי הַמַּבּוּל
  choice: nước lụt
  rationale: Cụm từ chỉ nước của trận đại hồng thủy; “nước lụt” là cách nói tự nhiên trong tiếng Việt mà vẫn giữ cả ý nước và lụt.
