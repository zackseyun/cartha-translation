  terminology: “Nô-ê” là dạng tên quen thuộc trong tiếng Việt. “Tàu” phù hợp với תֵּבָה trong ngữ cảnh Nô-ê; “nước lụt” là cách diễn đạt tự nhiên cho מֵי הַמַּבּוּל mà không thêm diễn giải.
