  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּי֩ לְ/יָמִ֨ים ע֜וֹד שִׁבְעָ֗ה אָֽנֹכִי֙ מַמְטִ֣יר עַל הָ/אָ֔רֶץ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וּ/מָחִ֗יתִי אֶֽת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר עָשִׂ֔יתִי מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: vi
  text: Vì chỉ còn bảy ngày nữa[a], Ta sẽ cho mưa xuống trên đất suốt bốn mươi ngày và bốn mươi đêm; Ta sẽ xóa sạch[b] khỏi mặt đất[c] mọi sinh vật mà Ta đã làm nên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau bảy ngày nữa.” Thành ngữ Hê-bơ-rơ cho biết còn bảy ngày trước khi mưa bắt đầu.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ gợi hình ảnh lau đi hoặc tẩy xóa hoàn toàn.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “khỏi mặt của đất.” Từ Hê-bơ-rơ ở đây là אֲדָמָה (đất, mặt đất), khác với אֶרֶץ (đất, cõi đất) ở vế trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ quan hệ giải thích/nguyên nhân với mệnh lệnh ở câu trước.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: chỉ còn bảy ngày nữa
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ cho biết còn bảy ngày trước khi mưa bắt đầu; “chỉ còn” cũng truyền đạt tính cận kề.
- source_word: אָנֹכִי מַמְטִיר
  choice: Ta sẽ cho mưa xuống
  rationale: Giữ chủ thể ngôi thứ nhất và tác động gây khiến của dạng Hiphil, đồng thời dùng lối nói Việt tự nhiên.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: Giữ phạm vi rộng của אֶרֶץ mà không tự ý thu hẹp thành một vùng địa phương.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: suốt bốn mươi ngày và bốn mươi đêm
  rationale: “Suốt” làm rõ khoảng thời gian liên tục, phù hợp ngữ cảnh và tự nhiên trong tiếng Việt.
- source_word: וּמָחִיתִי
  choice: Ta sẽ xóa sạch
  rationale: Bảo toàn hình ảnh lau/xóa đi của động từ מחה và sức mạnh toàn diện của hành động phán xét.
- source_word: כָּל הַיְקוּם
  choice: mọi sinh vật
  rationale: Trong văn cảnh nạn lụt, cụm từ chỉ toàn bộ những hữu thể sống đang tồn tại; cách dịch này rõ nghĩa mà không phóng đại thành toàn bộ mọi sự hiện hữu.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: mà Ta đã làm nên
  rationale: Nối hành động sáng tạo đã hoàn tất của Đức Chúa Trời với sự phán xét hiện tại; “làm nên” trang trọng nhưng dễ hiểu.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: khỏi mặt đất
  rationale: Giữ hình ảnh không gian “khỏi bề mặt đất” và phần nào phản ánh sự khác biệt từ vựng với אֶרֶץ ở vế trước.
theological_decisions:
- issue: Phạm vi của sự phán xét trong אֶרֶץ và כָּל הַיְקוּם
  choice: Dùng “đất” và “mọi sinh vật,” giữ lời phán xét có phạm vi rộng.
  alternative: Dùng “xứ” hoặc “vùng đất,” có thể gợi ý một biến cố chỉ mang tính địa phương.
  rationale: Các cách diễn đạt trong câu có sức bao quát lớn. Bản dịch không thu hẹp phạm vi, nhưng cũng không thêm thuật ngữ khoa học hiện đại hay giải quyết vượt quá điều câu Hê-bơ-rơ trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta” phù hợp lời Đức Chúa Trời phán trong ngữ cảnh; dấu chấm phẩy giúp giữ hai hành động liên kết chặt chẽ. Các chú thích được đặt ngay sau cụm từ liên quan.
