  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: vi
  text: Từng đôi một, chúng đến chỗ Nô-ê và vào trong chiếc tàu[b]—con đực và con cái—đúng như Đức Chúa Trời đã truyền cho Nô-ê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “đến chiếc tàu”. Trong ngữ cảnh, cụm này hàm ý đi vào trong tàu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: Từng đôi một
  rationale: Cụm số từ lặp lại diễn tả sự phân phối thành từng cặp. “Từng đôi một” tự nhiên trong tiếng Việt và giữ được vị trí nhấn mạnh ở đầu câu.
- source_word: בָּאוּ
  choice: chúng đến
  rationale: בוא là động từ chỉ sự đến/đi vào. “Đến” giữ góc nhìn hướng về Nô-ê; đại từ “chúng” thể hiện chủ ngữ số nhiều hàm ẩn và dựa vào ngữ cảnh trước đó.
- source_word: אֶל נֹחַ
  choice: với Nô-ê
  rationale: Sau động từ “đến”, “đến với Nô-ê” diễn đạt tự nhiên sự chuyển động hướng về Nô-ê.
- source_word: אֶל הַתֵּבָה
  choice: vào trong con tàu
  rationale: אֶל về mặt hình thức có thể là “đến”, nhưng trong ngữ cảnh chuyển động tới con tàu, “vào trong” diễn đạt rõ việc đi vào. “Con tàu” là cách gọi rõ ràng, phổ thông cho תֵּבָה trong trình thuật này.
- source_word: זָכָר וּנְקֵבָה
  choice: con đực và con cái
  rationale: Giữ nguyên cách phân loại sinh học của bản Hê-bơ-rơ và phù hợp với chủ thể là các loài vật.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự phù hợp chính xác với mệnh lệnh đã ban.
- source_word: צִוָּה אֱלֹהִים אֶת נֹחַ
  choice: Đức Chúa Trời đã truyền cho Nô-ê
  rationale: “Đã truyền” thể hiện hành động có trước việc chúng đến; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc cho אֱלֹהִים khi chỉ Đức Chúa Trời duy nhất.
theological_decisions:
- issue: Tác nhân khiến các loài vật đến
  choice: Bản dịch nói chúng tự đến với Nô-ê đúng theo mệnh lệnh Đức Chúa Trời đã truyền, nhưng không giải thích cơ chế.
  alternative: Diễn giải rằng chúng đến hoàn toàn do bản năng hoặc do một mình Nô-ê tập hợp.
  rationale: Nguyên văn nhấn mạnh sự kiện chúng đến phù hợp với mệnh lệnh của Đức Chúa Trời, song không nói cụ thể điều đó xảy ra bằng cách nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc mở đầu giữ điểm nhấn của nguyên văn; dấu gạch ngang làm rõ “con đực và con cái” là phần giải thích về từng đôi mà không thêm một mệnh đề mới.
