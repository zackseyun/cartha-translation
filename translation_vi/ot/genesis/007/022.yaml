base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: vi
  text: Mọi sinh vật trên đất khô, trong mũi có sinh khí, đều chết[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “hơi thở của luồng khí sự sống”; cũng có thể dịch: “hơi thở sự sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Mọi loài
  rationale: Cụm từ chỉ toàn bộ các sinh vật hội đủ điều kiện được nói đến; “mọi loài” tự nhiên trong tiếng Việt và bao gồm cả người lẫn động vật.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: sinh khí
  rationale: Chuỗi danh từ theo sát mặt chữ là “hơi thở của khí/sự sống,” nhưng trong ngữ cảnh chỉ hơi thở duy trì sự sống. “Sinh khí” truyền đạt gọn và tự nhiên ý nghĩa tổng hợp mà không áp đặt một phân tích siêu hình; cách dịch sát hơn được giữ trong chú thích.
- source_word: בְּאַפָּיו
  choice: trong mũi
  rationale: Nguyên văn dùng danh từ số đôi với hậu tố ngôi ba giống đực số ít theo nghĩa phân phối. Tiếng Việt không cần biểu thị sở hữu ở đây; “trong mũi” rõ ràng và tự nhiên.
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: trên đất khô
  rationale: Cụm này giới hạn phạm vi vào các sinh vật ở phần đất khô, đối lập với môi trường nước trong bối cảnh trận lụt.
- source_word: מֵתוּ
  choice: đều chết
  rationale: Động từ nói trực tiếp rằng chúng chết; thêm “đều” thể hiện tính bao quát của כֹּל một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa נְשָׁמָה, רוּחַ và חַיִּים
  choice: Dịch trong chính văn là “sinh khí” và ghi cách dịch sát ở chú thích.
  alternative: “hơi thở của thần khí sự sống” hoặc “hơi thở sự sống”
  rationale: Ba yếu tố Hê-bơ-rơ có thể được hiểu như một cụm tăng cường chỉ hơi thở sống, chứ không nhất thiết phân biệt các thực thể siêu hình. Cách dịch chính văn tránh gợi một hệ thống nhân học riêng, còn chú thích bảo tồn cấu trúc và độ mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Mọi loài” phù hợp với phạm vi gồm cả người lẫn động vật; “sinh khí” là cách diễn đạt tiếng Việt tự nhiên, còn chú thích bảo tồn cấu trúc Hê-bơ-rơ.
