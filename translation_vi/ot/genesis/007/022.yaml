  rationale: Thay «Mọi loài» bằng «Mọi sinh vật» để bao quát cả con người và động vật như câu Hê-bơ-rơ. Chỉnh chú thích để cách diễn đạt tiếng Việt tự nhiên và rõ nghĩa hơn, nhưng vẫn bảo tồn cấu trúc kép «hơi thở/khí» của nguyên văn và phương án rút gọn.
