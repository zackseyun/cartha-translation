  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: vi
  text: Nô-ê đã làm theo mọi điều Yahweh truyền cho ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה có nghĩa rộng là “làm, thực hiện”; trong cấu trúc nói về mệnh lệnh, “làm” là cách diễn đạt tự nhiên và giữ được ý Nô-ê thi hành điều đã truyền.
- source_word: נֹחַ
  choice: Nô-ê
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt.
- source_word: כְּכֹל אֲשֶׁר
  choice: mọi điều
  rationale: Cụm כְּכֹל אֲשֶׁר diễn tả sự phù hợp trọn vẹn với toàn bộ điều được truyền. Tiếng Việt tự nhiên có thể diễn đạt là “làm mọi điều”; ý tương ứng của tiền tố כְּ được thể hiện qua toàn cấu trúc.
- source_word: צִוָּהוּ
  choice: đã truyền cho ông
  rationale: צוה là “truyền lệnh, ra lệnh”. “Đã truyền cho ông” vừa trang trọng vừa cho thấy mệnh lệnh có trước hành động của Nô-ê.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; “Đức Giê-hô-va” là dạng danh xưng quen thuộc và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng danh riêng יהוה. Bản dịch giữ danh riêng ấy; dạng “Đức Giê-hô-va” dễ nhận biết đối với độc giả Kinh Thánh tiếng Việt, trong khi không thay danh bằng tước hiệu “CHÚA”.
- issue: Mức độ vâng phục của Nô-ê
  choice: làm mọi điều
  alternative: làm theo mọi điều
  rationale: Cả hai đều phản ánh כְּכֹל אֲשֶׁר. “Làm mọi điều” tự nhiên hơn trong tiếng Việt và vẫn giữ ý ông thi hành toàn bộ mệnh lệnh, không thêm nhận định thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, ngắn gọn và trang trọng. Câu giữ nhịp kể chuyện của nguyên văn; không cần chú thích vì không có dị bản hay sự mơ hồ đáng kể cần trình bày.
