    rationale: Cụm này nói Nô-ê hành động phù hợp với toàn bộ điều đã được truyền. “Làm theo mọi điều” giữ rõ quan hệ ấy mà vẫn tự nhiên.
  revised_text: Nô-ê đã làm theo mọi điều Yahweh truyền cho ông.
