    rationale: Hồ sơ nguồn và quyết định thuật ngữ POB quy định chuyển tự Tetragrammaton là “Yahweh”. “Đức Giê-hô-va” là một truyền thống Việt ngữ khác, đồng thời thêm yếu tố tôn xưng “Đức” không có trong nguyên văn.
  - severity: low
