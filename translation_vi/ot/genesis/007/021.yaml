base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: vi
  text: 'Mọi xác thịt di chuyển trên đất đều chết: chim, gia súc, thú hoang, mọi loài vật lúc nhúc trên đất, và toàn thể loài người.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “toàn thể ha’adam,” ở đây chỉ chung toàn thể loài người.'
    reason: Giải thích nghĩa tập thể của הָאָדָם và bảo tồn mối liên hệ từ vựng với אָדָם.
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: đều chết
  rationale: Động từ גוע chỉ việc chết hoặc tắt thở; “chết” là cách diễn đạt trực tiếp, tự nhiên trong tiếng Việt hiện đại.
- source_word: כָּל בָּשָׂר
  choice: mọi loài xác thịt
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ “mọi xác thịt,” đồng thời thêm “loài” để câu tiếng Việt tự nhiên và cho thấy phạm vi gồm các sinh vật hữu thể được liệt kê tiếp theo.
- source_word: הָרֹמֵשׂ
  choice: chuyển động
  rationale: רמש ở đây có nghĩa rộng là di chuyển, không chỉ bò sát, vì phạm vi sau đó gồm chim, gia súc, thú hoang và các sinh vật lúc nhúc.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: “Trên đất” tự nhiên trong tiếng Việt và tương phản ngầm với các sinh vật dưới nước; không buộc danh từ אֶרֶץ phải mang nghĩa địa cầu ở chính cụm từ này.
- source_word: בָּעוֹף
  choice: chim chóc
  rationale: עוֹף chỉ các sinh vật bay, thường được diễn đạt tự nhiên là “chim chóc” trong danh sách phân loại này.
- source_word: וּבַבְּהֵמָה
  choice: gia súc
  rationale: בְּהֵמָה trong thế đối chiếu với חַיָּה chỉ nhóm thú nuôi hay vật nuôi lớn; “gia súc” là cách gọi gọn và quen thuộc.
- source_word: וּבַחַיָּה
  choice: thú hoang
  rationale: חַיָּה ở đây chỉ động vật hoang dã, đối lập với gia súc.
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: mọi sinh vật lúc nhúc
  rationale: Cụm này chỉ các sinh vật nhỏ di chuyển thành nhiều; “lúc nhúc” tái hiện sắc thái gợi hình và quan hệ từ nguyên giữa danh từ với phân từ mà không thu hẹp thành loài bò sát.
- source_word: וְכֹל הָאָדָם
  choice: và toàn thể loài người
  rationale: הָאָדָם được dùng theo nghĩa tập thể, chỉ nhân loại chứ không riêng nam giới hay cá nhân A-đam.
theological_decisions:
- issue: Cách hiểu הָאָדָם
  choice: toàn thể loài người
  alternative: mọi người; toàn thể nhân loại
  rationale: Mạo từ cùng ngữ cảnh cho thấy אָדָם mang nghĩa tập thể là toàn bộ loài người. Cách dịch này giữ phạm vi bao quát mà không biến cụm từ thành lời chỉ riêng nam giới.
- issue: Phạm vi của כָּל בָּשָׂר
  choice: mọi loài xác thịt
  alternative: mọi sinh vật
  rationale: Giữ thành ngữ “xác thịt” của nguyên văn và sự căng thẳng trong cách phân loại, thay vì diễn giải hoàn toàn thành “mọi sinh vật”; danh sách kế tiếp làm rõ các đối tượng được nói đến.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Mọi loài xác thịt” giữ nét Kinh Thánh của nguyên văn; “chuyển động,” “chim chóc,” “gia súc,” “thú hoang” và “sinh vật lúc nhúc” giúp danh sách rõ ràng, dễ hiểu. Dấu [a] xuất hiện trong chính văn và tương ứng với chú thích.
