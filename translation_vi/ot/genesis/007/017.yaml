base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/017.yaml
  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: vi
  text: Nước lụt kéo dài trên đất bốn mươi ngày[a]; nước dâng lên, nâng chiếc tàu lên, và chiếc tàu được nâng cao hơn mặt đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Nước lụt ở trên đất bốn mươi ngày.” Trong ngữ cảnh này, động từ Hê-bơ-rơ có thể diễn tả sự tồn tại hoặc sự kéo dài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: kéo dài
  rationale: Trong cấu trúc có khoảng thời gian “bốn mươi ngày” và chủ ngữ là nước lụt, động từ diễn tả sự tiếp diễn; “kéo dài” tự nhiên trong tiếng Việt hơn cách dịch sát chữ “có/đã xảy ra”.
- source_word: הַמַּבּוּל
  choice: nước lụt
  rationale: Cách gọi rõ ràng, phổ thông cho trận lụt thời Nô-ê; tránh sắc thái văn chương cổ của “đại hồng thủy”.
- source_word: אַרְבָּעִים יוֹם
  choice: bốn mươi ngày
  rationale: Chuyển trực tiếp cụm chỉ thời gian; ý kéo dài được thể hiện qua động từ.
- source_word: עַל הָאָרֶץ
  choice: trên đất
  rationale: אֶרֶץ có thể chỉ đất, đất liền hoặc trái đất; “trên đất” tự nhiên và không thu hẹp hay mở rộng phạm vi địa lý quá mức.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: Nước dâng lên
  rationale: רבה diễn tả lượng hoặc mức nước gia tăng; trong ngữ cảnh lụt, “dâng lên” là cách nói tiếng Việt tự nhiên và chính xác.
- source_word: וַיִּשְׂאוּ אֶת הַתֵּבָה
  choice: nâng con tàu lên
  rationale: נשא ở đây chỉ nước làm cho תֵּבָה được nhấc lên; “nâng… lên” giữ rõ tác nhân và chuyển động hướng lên.
- source_word: הַתֵּבָה
  choice: con tàu
  rationale: Trong tiếng Việt hiện đại, “con tàu” là cách gọi dễ hiểu và phù hợp theo ngữ cảnh cho phương tiện Nô-ê đã đóng, thay vì vay mượn cách gọi mang tính truyền thống nhưng kém phổ thông.
- source_word: וַתָּרָם מֵעַל הָאָרֶץ
  choice: lên cao khỏi mặt đất
  rationale: Kết hợp động từ רום và giới từ מֵעַל để diễn tả con tàu được nâng lên, tách khỏi bề mặt đất; tránh lặp cứng “nâng… và nó lên” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Tách thành hai câu để dòng kể tự nhiên trong tiếng Việt; giữ quan hệ nhân quả vật lý giữa nước dâng và con tàu được nâng lên. Dùng “trên đất” và “mặt đất” nhằm phản ánh hai cách dùng gần nhau của הָאָרֶץ theo ngữ cảnh.
