base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: vi
  text: Cũng hãy đem theo chim trời, bảy, bảy, đực và cái, để giữ cho nòi giống còn sống trên khắp mặt đất.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bảy cặp”. Tiếng Hê-bơ-rơ dịch sát là “bảy, bảy”, một lối diễn đạt phân phối có thể được hiểu là bảy con thuộc mỗi loại hoặc bảy cặp; chính văn giữ sát hình thức tiếng Hê-bơ-rơ hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Cũng
  rationale: Nối tiếp mệnh lệnh về các loài vật ở câu trước một cách tự nhiên, không thêm sắc thái ngoài nguyên văn.
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: các loài chim trời
  rationale: עוֹף trong ngữ cảnh chỉ chim hay sinh vật bay; cách nói “chim trời” tự nhiên, trang trọng và phản ánh הַשָּׁמַיִם.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: từng bảy từng bảy
  rationale: Giữ phép lặp phân phối của tiếng Hê-bơ-rơ, đồng thời không quyết định thay nguyên văn rằng đó là bảy con mỗi loài hay bảy cặp.
- source_word: זָכָר וּנְקֵבָה
  choice: đực và cái
  rationale: Cách diễn đạt trực tiếp, tự nhiên trong tiếng Việt khi nói về giới tính của động vật.
- source_word: לְחַיּוֹת זֶרַע
  choice: để duy trì nòi giống
  rationale: Diễn đạt mục đích bảo tồn sự sống và sự tiếp nối của זֶרַע; “nòi giống” phù hợp với ngữ cảnh động vật hơn nghĩa đen “hạt giống”.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: trên khắp mặt đất
  rationale: Cách nói tiếng Việt tự nhiên, vẫn giữ ý về phạm vi toàn mặt đất của thành ngữ Hê-bơ-rơ.
theological_decisions:
- issue: Số lượng được diễn tả bởi שִׁבְעָה שִׁבְעָה
  choice: Giữ cấu trúc “từng bảy từng bảy” trong chính văn
  alternative: “bảy cặp” hoặc “mỗi loài bảy con”
  rationale: Cụm Hê-bơ-rơ là một lối lặp có tính phân phối nhưng có thể được hiểu theo hơn một cách; bản dịch không nên âm thầm giải quyết sự mơ hồ này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Hãy đem theo” được bổ sung theo động từ chi phối từ câu trước vì câu Hê-bơ-rơ này tiếp nối mệnh lệnh ấy; “từng bảy từng bảy” cố ý giữ nét khác thường của nguyên văn. Dấu chú thích [a] xuất hiện trong chính văn.
