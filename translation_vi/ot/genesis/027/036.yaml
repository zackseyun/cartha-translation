base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: vi
  text: 'Ê-sau nói[a]: “Chẳng phải nó được gọi là Gia-cốp thật đúng sao? Nó đã giành phần của con hai lần rồi: nó lấy quyền trưởng nam của con, và kìa, bây giờ nó lại lấy phước lành của con.” Ông lại nói: “Cha chẳng để dành một phước lành cho con sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hê-bơ-rơ có lối chơi chữ giữa tên “Gia-cốp” và động từ được dịch là “đã giành phần của con”. Động từ này cũng có thể được dịch là “đã lừa con” hoặc “đã lấn át con”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: Chẳng phải nó được đặt tên là Gia-cốp rất đúng sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ đầy cay đắng, đồng thời giữ tên riêng làm cơ sở cho lối chơi chữ tiếp theo.
- source_word: וַיַּעְקְבֵנִי
  choice: nó đã chiếm chỗ của con
  rationale: Động từ עקב chơi chữ với tên יַעֲקֹב và có thể chỉ việc lấn át, chiếm phần hay lừa gạt. “Chiếm chỗ” giữ được ý thay thế/giành phần hơn “lừa dối”, dù không thể tái tạo trọn vẹn âm vang tiếng Hê-bơ-rơ.
- source_word: זֶה פַעֲמַיִם
  choice: hai lần rồi
  rationale: Cách nói tiếng Việt tự nhiên, vẫn giữ sắc thái nhấn mạnh rằng đây là hai lần Ê-sau kể ra.
- source_word: בְּכֹרָתִי
  choice: quyền trưởng nam của con
  rationale: Chỉ địa vị cùng các quyền lợi gia đình và pháp lý của người con trưởng; rõ nghĩa hơn từ đơn “quyền trưởng” đối với độc giả hiện đại.
- source_word: וְהִנֵּה עַתָּה
  choice: và kìa, bây giờ
  rationale: “Kìa” truyền đạt lực cảm thán của הִנֵּה trong lời than trách, mà vẫn trang trọng và dễ hiểu.
- source_word: בִּרְכָתִי
  choice: phước lành của con
  rationale: Giữ thuật ngữ quen thuộc cho lời chúc phước mang hiệu lực gia tộc trong văn mạch.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: Cha không dành lại một phước lành nào cho con sao?
  rationale: אָצַל ở đây mang nghĩa giữ lại hoặc dành lại; cách dịch này thể hiện lời khẩn cầu rằng vẫn còn một phước lành cho Ê-sau.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con/cha” theo quan hệ giữa Ê-sau và Y-sác; chủ ngữ “Ê-sau” được nêu rõ để tiếng Việt tự nhiên. Giữ “kìa” nhằm truyền tải cảm xúc, và dùng chú thích để bảo tồn sự đa nghĩa cùng lối chơi chữ không thể chuyển trọn sang tiếng Việt.
