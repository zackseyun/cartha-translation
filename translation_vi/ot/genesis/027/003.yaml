base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: vi
  text: Bây giờ, con hãy mang theo dụng cụ của con—ống đựng tên và cây cung—rồi ra đồng, săn mồi về cho cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “săn thú về cho cha.” Từ Hê-bơ-rơ có thể chỉ con thú hoặc thức ăn có được nhờ săn bắt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả sắc thái nối tiếp của וְ và tính chuyển ý trực tiếp của עַתָּה trong lời dặn.
- source_word: שָׂא נָא
  choice: con hãy lấy
  rationale: Trong ngữ cảnh mang theo dụng cụ, שָׂא có nghĩa tự nhiên là “lấy”; נָא làm nhẹ lời mệnh lệnh. Đại từ “con” phù hợp quan hệ cha–con được biểu thị bởi các dạng ngôi thứ hai trong ngữ cảnh tiếng Việt.
- source_word: כֵלֶיךָ
  choice: đồ dùng của con
  rationale: כְּלִי là từ bao quát chỉ vật dụng hoặc dụng cụ, rồi được cụ thể hóa bằng ống đựng tên và cung; “đồ dùng” tránh thu hẹp thành vũ khí.
- source_word: תֶּלְיְךָ
  choice: ống đựng tên
  rationale: Chỉ bao hoặc ống mang tên; cách diễn đạt này rõ nghĩa hơn từ Hán-Việt ít thông dụng “bao tiễn”.
- source_word: וְקַשְׁתֶּךָ
  choice: và cây cung
  rationale: Bản dịch trực tiếp, tự nhiên của קֶשֶׁת trong ngữ cảnh săn bắn.
- source_word: וְצֵא הַשָּׂדֶה
  choice: rồi ra đồng
  rationale: שָׂדֶה có thể chỉ đồng hoặc vùng đất trống; “ra đồng” ngắn gọn, tự nhiên và giữ hình ảnh cụ thể.
- source_word: וְצוּדָה לִּי צידה
  choice: săn thú rừng về cho cha
  rationale: Động từ צוּד mang nghĩa săn bắt; צַיִד ở đây là con thú hoặc thức ăn kiếm được bằng việc săn. “Về cho cha” diễn đạt tự nhiên sắc thái lợi ích của לִי trong lời người cha nói với con.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và tự nhiên trong lời cha dặn con. Dùng “cha/con” theo ngữ cảnh gia đình; không thêm nội dung thần học ngoài nguyên văn.
