  yaml_path: translation/ot/genesis/027/002.yaml
  text: And he said, “Look now, I have grown old; I do not know the day of my death.”
translation:
  language: vi
  text: 'Ông nói: “Này, cha đã già rồi; cha không biết ngày mình sẽ chết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Này
  rationale: Trong lời nói trực tiếp, cụm này dùng để thu hút sự chú ý và nhấn mạnh điều sắp nói; “Này” tự nhiên, trang trọng vừa phải và không nặng sắc thái thị giác như “Hãy nhìn”.
- source_word: זָקַנְתִּי
  choice: cha đã già rồi
  rationale: Động từ ở thể hoàn thành diễn tả tình trạng tuổi già đã đến. Đại từ “cha” được dùng theo quan hệ cha-con trong ngữ cảnh, giúp lời thoại tự nhiên trong tiếng Việt.
- source_word: לֹא יָדַעְתִּי יֹום מוֹתִי
  choice: cha không biết ngày mình sẽ chết
  rationale: Giữ nguyên ý Isaac không biết thời điểm cái chết của mình; cách diễn đạt này tự nhiên hơn lối danh từ hóa “ngày qua đời của cha” mà không làm mất nội dung.
