reference: Genesis 27:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: vi
  text: 'Bấy giờ, Y-sác run rẩy dữ dội và nói[a]: “Vậy, ai là người đã săn thú và mang đến cho cha, để cha đã ăn tất cả trước khi con vào và cha đã chúc phước cho người ấy? Và người ấy sẽ được phước.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Quả thật, người ấy sẽ được phước.”'
    reason: Phương án dịch sắc thái xác nhận/nhấn mạnh của גַּם trong lời tuyên bố cuối.
lexical_decisions:
- source_word: וַיֶּחֱרַד יִצְחָק חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: Y-sác run lên dữ dội
  rationale: Cụm đồng nguyên חרד / חֲרָדָה cùng גְּדֹלָה עַד מְאֹד nhấn mạnh phản ứng run rẩy mãnh liệt vì kinh động. “Run lên dữ dội” giữ được sức nặng mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: מִי אֵפוֹא הוּא
  choice: Vậy, ... là ai?
  rationale: אֵפוֹא mang sắc thái suy luận và nhấn mạnh khi Y-sác nhận ra sự việc; “vậy” truyền đạt sắc thái ấy tự nhiên.
- source_word: הַצָּד צַיִד
  choice: người đã săn thú
  rationale: צַיִד chỉ thú săn hoặc thịt săn nói chung, không nhất thiết là một loài cụ thể. Tiếng Việt không cần lặp cấu trúc đồng nguyên như tiếng Hê-bơ-rơ.
- source_word: וַיָּבֵא לִי
  choice: rồi mang đến cho cha
  rationale: Tân ngữ được hiểu từ “thú săn”; “cho cha” thể hiện ngôi thứ nhất trong lời người cha nói với con một cách tự nhiên theo hệ thống xưng hô tiếng Việt.
- source_word: וָאֹכַל מִכֹּל
  choice: Cha đã ăn mọi món người ấy mang đến
  rationale: מִכֹּל có sắc thái “ăn từ tất cả”; cách diễn đạt này giữ ý Y-sác đã ăn những thứ được mang đến mà tránh câu tiếng Việt gượng như “ăn từ tất cả.”
- source_word: בְּטֶרֶם תָּבוֹא
  choice: trước khi con vào
  rationale: בוא là “đến/vào”; trong cảnh Ê-sau vừa bước vào gặp cha, “vào” rõ và tự nhiên.
- source_word: וָאֲבָרֲכֵהוּ
  choice: và cha đã chúc phước cho người ấy
  rationale: Nêu rõ chủ thể ngôi thứ nhất để mạch câu tiếng Việt sáng nghĩa, đồng thời dùng “chúc phước” cho hành động ban lời chúc phước của người cha.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: Phải, người ấy sẽ được phước
  rationale: גַּם ở đây xác nhận mạnh điều vừa xảy ra; “Phải” diễn tả sự khẳng định, còn “sẽ được phước” giữ lực hướng tới kết quả của יִהְיֶה.
theological_decisions:
- issue: Hiệu lực của lời chúc phước Y-sác đã ban
  choice: Dịch như lời xác nhận dứt khoát rằng người đã nhận lời chúc phước sẽ được phước
  alternative: Chỉ là lời cam chịu, không mang sắc thái nhấn mạnh
  rationale: גַּם בָּרוּךְ יִהְיֶה có sức xác nhận rõ rệt. Bản dịch giữ nguyên sức nặng tự sự-thần học của lời tuyên bố nhưng không giải thích thêm về cơ chế hay tính chất của lời chúc phước.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng lối xưng hô cha–con phù hợp trực tiếp với bối cảnh gia đình. Tên riêng dùng dạng quen thuộc “Y-sác.” Không thêm chú thích vì bản dịch chính đã thể hiện tự nhiên sắc thái nhấn mạnh của câu cuối.
