  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cách xưng hô “cha–con” phù hợp quan hệ gia đình trong tiếng Việt; không thêm tên Gia-cốp hay Y-sác vì câu Hê-bơ-rơ chỉ dùng đại từ và danh từ quan hệ.
