base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: vi
  text: 'Vậy, ông đi vào gặp cha mình và nói[a]: “Cha ơi!” Cha ông đáp: “Cha đây. Con là ai vậy, con trai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “và đến với cha mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Vậy, ông đi vào
  rationale: Động từ בוא ở thể wayyiqtol tiếp nối diễn tiến câu chuyện; trong ngữ cảnh Gia-cốp bước vào chỗ Y-sác đang ở, “đi vào” diễn đạt hướng chuyển động tự nhiên trong tiếng Việt. “Vậy” nối với hành động chuẩn bị ở câu trước.
- source_word: אֶל אָבִיו
  choice: gặp cha mình
  rationale: אֶל chỉ hướng đến cha của chủ thể. Trong tiếng Việt, “đi vào gặp cha mình” tự nhiên hơn “đi vào đến cha mình” mà vẫn không thêm tên riêng không có trong nguyên văn.
- source_word: וַיֹּאמֶר
  choice: và nói / đáp
  rationale: Lần đầu giữ lời dẫn thuật thông thường; lần thứ hai dùng “đáp” theo chức năng hội thoại của câu trả lời, giúp tiếng Việt tự nhiên mà không đổi nội dung.
- source_word: אָבִי
  choice: Cha ơi
  rationale: Danh từ אָב với hậu tố ngôi thứ nhất số ít là lời xưng gọi “cha của con”; tiếng Việt tự nhiên thể hiện bằng “Cha ơi”, trong đó quan hệ sở hữu đã được hàm chứa bởi cách xưng hô.
- source_word: הִנֶּנִּי
  choice: Cha đây
  rationale: הִנֶּנִּי là công thức đáp lời, nghĩa sát là “Này, tôi đây.” Trong quan hệ cha–con, “Cha đây” vừa tự nhiên vừa giữ sắc thái hiện diện và sẵn sàng đáp lời.
- source_word: מִי אַתָּה
  choice: Con là ai vậy
  rationale: Cụm nghi vấn hỏi trực tiếp căn tính của người đối thoại. Đại từ “con” phù hợp ngôi thứ hai giống đực số ít trong quan hệ được nêu bởi בְּנִי; “vậy” tạo sắc thái hỏi tự nhiên, không giải quyết nguyên nhân của sự không nhận ra.
- source_word: בְּנִי
  choice: con trai
  rationale: Danh từ בֵּן với hậu tố ngôi thứ nhất số ít được dùng như tiếng gọi “con trai của cha.” Sau câu hỏi đã dùng “con”, cụm “con trai” giữ lại nghĩa từ vựng của בֵּן và sắc thái thân thuộc.
theological_decisions: []
