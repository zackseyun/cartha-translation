  text: וַ/תִּקַּ֣ח רִ֠בְקָה אֶת בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤/הּ הַ/גָּדֹל֙ הַ/חֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖/הּ בַּ/בָּ֑יִת וַ/תַּלְבֵּ֥שׁ אֶֽת יַעֲקֹ֖ב בְּנָ֥/הּ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: vi
  text: Bấy giờ, Rê-bê-ca lấy những bộ y phục quý[a] của Ê-sau, con trai lớn của bà, mà bà có trong nhà,[b] rồi mặc vào cho Gia-cốp, con trai nhỏ của bà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những bộ y phục đẹp nhất”.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa hơn: “đang ở với bà trong nhà”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Bấy giờ, ... lấy
  rationale: Dạng waw liên tiếp đưa câu chuyện tiến sang hành động kế tiếp; “Bấy giờ” diễn đạt mạch kể tự nhiên trong tiếng Việt hiện đại.
- source_word: בִּגְדֵי
  choice: những bộ y phục
  rationale: Từ này chỉ quần áo; “y phục” giữ sắc thái trang trọng vừa phải và phù hợp với bối cảnh cổ đại.
- source_word: הַחֲמֻדֹת
  choice: quý
  rationale: Từ Hê-bơ-rơ diễn tả điều đáng ưa chuộng hoặc có giá trị. “Y phục quý” giữ được ý nghĩa rộng, không khẳng định quá mức rằng đây nhất thiết là những bộ tốt nhất.
- source_word: בְּנָהּ הַגָּדֹל
  choice: con trai lớn của bà
  rationale: Trong quan hệ gia đình, גָּדוֹל đối lập với קָטָן về thứ tự tuổi; “con trai lớn” tự nhiên và đi đôi với “con trai nhỏ” ở cuối câu.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: mà bà có trong nhà
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, chuyển tải ý quần áo đang ở chỗ Rê-bê-ca trong nhà mà không thêm ý bà cất giữ chúng.
- source_word: וַתַּלְבֵּשׁ
  choice: mặc vào cho
  rationale: Động từ ở thể khiến ai đó mặc y phục; “mặc vào cho Gia-cốp” rõ chủ thể hành động và tự nhiên hơn cách dịch cứng là “mặc Gia-cốp”.
- source_word: בְּנָהּ הַקָּטָן
  choice: con trai nhỏ của bà
  rationale: קָטָן ở đây đối lập với người anh về tuổi, không nói đến vóc dáng; “con trai nhỏ” giữ sự đối xứng với “con trai lớn”.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ rõ trình tự hành động cùng sự đối xứng giữa Ê-sau là con trai lớn và Gia-cốp là con trai nhỏ.
