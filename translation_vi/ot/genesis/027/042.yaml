  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: vi
  text: 'Người ta báo cho Rê-bê-ca biết những lời của Ê-sau, con trai lớn của bà. Bà liền sai người gọi Gia-cốp, con trai út của bà, đến và nói với cậu: “Này, anh Ê-sau của con đang tự an ủi mình về con bằng cách mưu tính giết con.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Người ta báo cho ... biết
  rationale: Dạng bị động không nêu người báo; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ tác nhân không xác định.
- source_word: הַגָּדֹל / הַקָּטָן
  choice: con trai lớn / con trai nhỏ
  rationale: Phản ánh trực tiếp sự đối lập trong tiếng Hê-bơ-rơ và phù hợp với quan hệ giữa Ê-sau và Gia-cốp.
- source_word: מִתְנַחֵם לְךָ לְהָרְגֶךָ
  choice: đang tự an ủi mình về con bằng ý nghĩ sẽ giết con
  rationale: Giữ hình ảnh đáng chú ý của động từ hitpael נחם, ‘tự an ủi’, đồng thời diễn đạt quan hệ giữa sự an ủi méo mó ấy và ý định giết Gia-cốp mà không làm câu tiếng Việt tối nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘sai người gọi ... đến’ để chuyển tự nhiên chuỗi động từ Hê-bơ-rơ; giữ lời xưng hô của người mẹ với con bằng ‘con’.
