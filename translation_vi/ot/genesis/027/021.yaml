base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: vi
  text: 'Rồi Y-sác nói với Gia-cốp: “Lại gần đây nào, con, để cha sờ con xem con có thật là Ê-sau, con trai của cha, hay không.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi Y-sác nói
  rationale: Thể động từ kể chuyện với waw nối tiếp đẩy trình tự câu chuyện tiến tới; “Rồi” diễn đạt tự nhiên sự tiếp diễn ấy.
- source_word: גְּשָׁה נָּא
  choice: hãy lại gần
  rationale: גְּשָׁה là mệnh lệnh “đến/lại gần”; נָא làm lời yêu cầu dịu hơn. Trong lời cha nói với con, “hãy lại gần” tự nhiên và không quá cứng.
- source_word: וַאֲמֻשְׁךָ
  choice: để cha sờ con
  rationale: Động từ מושׁ chỉ việc sờ, dò bằng xúc giác. “Để” thể hiện sắc thái mục đích sau mệnh lệnh; đại từ “cha…con” phù hợp quan hệ đang được nói đến.
- source_word: בְּנִי
  choice: con trai
  rationale: Giữ lời xưng gọi thân thuộc với hậu tố ngôi thứ nhất; trong tiếng Việt, “con trai” ở đầu lời nói vừa tự nhiên vừa bảo toàn sắc thái quan hệ.
- source_word: הַאַתָּה זֶה
  choice: xem con có thật là
  rationale: Cấu trúc nghi vấn nhấn mạnh việc xác minh chính người đang đứng trước mặt; “có thật là” giữ sự nghi ngờ dò xét mà không dịch máy móc.
- source_word: בְּנִי עֵשָׂו
  choice: Ê-sau, con trai cha
  rationale: Giữ cả tên riêng và quan hệ phụ tử của cụm đồng vị; trật tự này tự nhiên trong tiếng Việt và tránh lặp “con” gây nhập nhằng.
- source_word: אִם לֹא
  choice: hay không
  rationale: Hoàn tất câu hỏi gián tiếp theo cấu trúc lựa chọn “có…hay không” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Cách xưng hô “cha–con” làm rõ quan hệ gia đình vốn được mã hóa trong בְּנִי và ngữ cảnh, nhưng không thêm cách giải thích thần học.
