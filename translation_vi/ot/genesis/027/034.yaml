base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: vi
  text: 'Khi Ê-sau nghe những lời của cha mình, ông kêu lên một tiếng kêu vô cùng lớn và cay đắng, rồi nói với cha: “Cha ơi, xin cha chúc phước cho con nữa!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát cấu trúc: “Xin cha chúc phước cho con, cả con nữa, cha ơi!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Khi ... nghe
  rationale: Cấu trúc כִּי với động từ nguyên mẫu tạo mệnh đề chỉ thời gian; “Khi ... nghe” tự nhiên và không nhấn mạnh tính tức thì quá mức.
- source_word: דִּבְרֵי אָבִיו
  choice: những lời của cha mình
  rationale: Giữ nghĩa trực tiếp của דְּבָרִים là “những lời,” đồng thời dùng đại từ phản thân tự nhiên trong lời kể tiếng Việt.
- source_word: וַיִּצְעַק צְעָקָה
  choice: ông bật lên một tiếng kêu
  rationale: Diễn đạt tự nhiên cấu trúc đồng nguyên động từ–danh từ, vẫn giữ được sức mạnh và tính đột phát của tiếng kêu.
- source_word: גְּדֹלָה וּמָרָה עַד מְאֹד
  choice: vô cùng lớn và cay đắng
  rationale: Giữ cả hai tính chất “lớn” và “cay đắng”; “vô cùng” chuyển tải thành ngữ tăng cường עַד מְאֹד.
- source_word: בָּרֲכֵנִי גַם אָנִי
  choice: xin cha cũng chúc phước cho con
  rationale: “Chúc phước” phù hợp ngữ cảnh lời chúc mang hiệu lực gia trưởng; “cũng” giữ sự nhấn mạnh rằng Ê-sau muốn được nhận phước bên cạnh người kia.
- source_word: אָבִי
  choice: Cha ơi
  rationale: Giữ lời xưng gọi trực tiếp đầy thống thiết; cách gọi này tự nhiên trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “thưa” và “Cha ơi” để thể hiện sự khẩn khoản; giữ hình ảnh “lớn và cay đắng” thay vì giải nghĩa thành tiếng khóc đau đớn. Dấu chú thích [a] đặt sau toàn bộ lời cầu xin vì chú thích đưa ra cách dịch sát của chính lời ấy.
