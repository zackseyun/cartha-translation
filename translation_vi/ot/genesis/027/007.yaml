  terminology: “Yahweh” phản ánh danh יהוה và phù hợp với bản văn tiếng Anh được cung cấp. “Chúc phước” là cách dịch phù hợp cho ברך trong ngữ cảnh lời chúc của Y-sác. Chú thích a và b hữu ích, đúng vị trí neo.
