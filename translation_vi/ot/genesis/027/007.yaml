base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: vi
  text: “Hãy mang thịt săn đến cho cha và làm cho cha những món ngon[a], để cha ăn rồi chúc phước cho con trước mặt Yahweh[b], trước khi cha qua đời.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những món ăn thơm ngon.” Từ Hê-bơ-rơ chỉ các món ngon được chế biến đặc biệt.'
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: YHWH (יהוה), danh riêng của Đức Chúa Trời; “Yahweh” là cách phiên âm thường dùng.'
    reason: divine_name
lexical_decisions:
- source_word: הָבִיאָה לִּי צַיִד
  choice: mang thịt săn về cho cha
  rationale: Động từ Hiphil הָבִיאָה diễn tả việc đem vật đến cho người nói; צַיִד là con vật hoặc thịt kiếm được do săn bắt. “Thịt săn” tự nhiên trong ngữ cảnh chế biến món ăn và không thu hẹp thành thịt nai.
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: làm cho cha những món ngon
  rationale: מַטְעַמִּים chỉ những món ăn ngon, được chế biến đặc biệt. “Những món ngon” vừa dễ hiểu vừa giữ dạng số nhiều của từ Hê-bơ-rơ.
- source_word: וְאֹכֵלָה וַאֲבָרֶכְכָה
  choice: để cha ăn rồi chúc phước cho con
  rationale: Hai dạng cohortative diễn tả ý định của người nói sau các mệnh lệnh. “Để” thể hiện mục đích, còn “rồi” diễn đạt trình tự tự nhiên trong ngữ cảnh mà không biến lời chúc phước thành điều kiện.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי mang nghĩa “trước mặt/trong sự hiện diện của”; Yahweh là cách phiên âm danh riêng יהוה, giúp phân biệt danh này với một tước hiệu.
- source_word: לִפְנֵי מוֹתִי
  choice: trước khi cha qua đời
  rationale: Cách diễn đạt bằng mệnh đề là tự nhiên trong tiếng Việt và truyền đạt đúng nghĩa “trước cái chết của tôi”.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng; chú thích nêu rõ dạng chữ Hê-bơ-rơ mà không áp đặt cách đọc tuyệt đối chắc chắn.
- issue: Ý nghĩa của việc chúc phước “trước mặt Yahweh”
  choice: giữ nguyên cụm “trước mặt Yahweh”
  alternative: được Yahweh chứng giám
  rationale: Nguyên văn nói לִפְנֵי, tức “trước mặt/trong sự hiện diện của”, nhưng không giải thích cụ thể vai trò của Yahweh. Bản dịch không diễn giải thêm rằng Ngài chứng giám hay phê chuẩn lời chúc phước.
translation_notes:
  register: Dùng lối xưng hô “cha–con” theo quan hệ giữa Y-sác và Ê-sau, tự nhiên trong lời nói tiếng Việt hiện đại. Văn phong trang trọng nhưng thông dụng; giữ sự lặp ý “trước mặt Yahweh, trước khi…” của nguyên văn.
