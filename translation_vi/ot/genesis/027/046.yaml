- from: 'Rồi Rê-bê-ca nói với Y-sác: “Tôi đã chán ngán cuộc sống vì các con gái của Hết.[a] Nếu Gia-cốp lấy một người vợ trong số các con gái của Hết như những người này, tức là trong số các con gái của xứ này, thì cuộc sống còn có ý nghĩa gì đối với tôi?”'
  to: 'Rồi Rê-bê-ca nói với Y-sác: “Tôi chán ngán cuộc sống vì các con gái của Hết.[a] Nếu Gia-cốp lấy vợ trong số các con gái của Hết, như những người này, trong số các con gái của xứ, thì cuộc sống là gì đối với tôi?”'
