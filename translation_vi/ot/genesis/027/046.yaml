source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: vi
  text: 'Rồi Rê-bê-ca nói với Y-sác: “Tôi chán ngán cuộc sống vì các con gái của Hết.[a] Nếu Gia-cốp lấy vợ trong số các con gái của Hết, như những người này, trong số các con gái của xứ, thì cuộc sống là gì đối với tôi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các phụ nữ Hê-tít” hoặc “các con gái người Hê-tít.”
    reason: Nêu cách gọi sắc tộc tương ứng với thành ngữ theo dòng tộc “các con gái của Hết” trong nguyên văn.
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: Tôi đã chán ngán cuộc sống
  rationale: Cụm từ diễn tả sự mệt mỏi, ghê chán đến mức không còn thiết sống; “chán ngán cuộc sống” tự nhiên trong tiếng Việt và giữ được cường độ cảm xúc mà không đẩy thành một lời tuyên bố trực tiếp muốn chết.
- source_word: מִפְּנֵי
  choice: vì
  rationale: Giới từ ở đây chỉ nguyên nhân; “vì” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: בְּנוֹת חֵת
  choice: các con gái của Hết
  rationale: Giữ lối gọi theo dòng tộc của nguyên văn và phiên âm tên riêng Hết; nghĩa chỉ phụ nữ Hê-tít được nêu trong chú thích.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: Nếu Gia-cốp lấy một người vợ
  rationale: “Lấy một người vợ” phản ánh khá sát thành ngữ hôn nhân trong tiếng Hê-bơ-rơ, đồng thời rõ nghĩa trong tiếng Việt hiện đại.
- source_word: כָּאֵלֶּה
  choice: như những người này
  rationale: Đại từ chỉ định hướng đến những phụ nữ cùng loại đang được nhắc đến, theo ngữ cảnh là các vợ của Ê-sau.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: trong số các con gái của xứ này
  rationale: Giữ hình ảnh “các con gái của xứ” và sự song song với “các con gái của Hết”; thêm “này” để tiếng Việt tự nhiên theo ngữ cảnh địa phương đang nói đến.
- source_word: לָמָּה לִּי חַיִּים
  choice: thì cuộc sống còn có ý nghĩa gì đối với tôi?
  rationale: Câu hỏi tu từ nói rằng trong hoàn cảnh ấy, sự sống chẳng còn giá trị đối với bà. Cách dịch này truyền đạt lực dụng học tự nhiên hơn trong tiếng Việt, đồng thời không biến câu thành lời khẳng định trực tiếp về cái chết.
theological_decisions:
- issue: Cách gọi sắc tộc חֵת
  choice: Giữ “các con gái của Hết” trong chính văn
  alternative: “các phụ nữ Hê-tít” hoặc “các con gái người Hê-tít”
  rationale: Cách dịch chính giữ nguyên khuôn khổ dòng tộc và tên riêng của nguyên văn; chú thích cung cấp cách gọi sắc tộc quen thuộc để người đọc dễ hiểu.
- issue: Lực nghĩa của câu hỏi לָמָּה לִּי חַיִּים
  choice: “cuộc sống còn có ý nghĩa gì đối với tôi?”
  alternative: “cuộc sống là gì đối với tôi?” hoặc “tôi sống để làm gì?”
  rationale: Nguyên văn là một câu hỏi tu từ có thể được chuyển sát hình thức hoặc làm rõ hàm ý. Bản chọn giữ sự căng thẳng cảm xúc và ý niệm cuộc sống không còn đáng sống, nhưng tránh diễn giải quá mức thành ý định tự sát.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng tên riêng theo dạng phiên âm Kinh Thánh tiếng Việt quen thuộc; giữ cách nói dòng tộc của nguyên văn trong chính văn và giải nghĩa bằng chú thích.
