  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: vi
  text: “Bây giờ, con trai mẹ, hãy nghe lời mẹ và làm theo điều mẹ truyền cho con.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Và bây giờ, con trai mẹ, hãy nghe tiếng mẹ theo điều mẹ đang truyền cho con.”'
    reason: Nêu cấu trúc sát chữ, gồm “nghe tiếng mẹ” và phân từ hiện tại “đang truyền”; chính văn dùng thành ngữ tiếng Việt tự nhiên để diễn đạt sự nghe theo mệnh lệnh.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả chức năng nối tiếp của וְ và ý nghĩa thời điểm, đồng thời mở lời chỉ dẫn một cách tự nhiên trong tiếng Việt.
- source_word: בְּנִי
  choice: con trai của mẹ
  rationale: Đây là lời xưng hô với danh từ 'con trai' kèm hậu tố ngôi thứ nhất số ít. Dùng 'mẹ' phù hợp với người nói là Rê-bê-ca và tự nhiên hơn lối nói cứng 'con trai của ta'.
- source_word: שְׁמַע בְּקֹלִי
  choice: hãy nghe lời mẹ
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là 'hãy nghe tiếng ta', nhưng trong ngữ cảnh mang ý chú ý và thuận theo lời nói. 'Nghe lời mẹ' là cách diễn đạt tự nhiên, vẫn giữ được khoảng nghĩa giữa nghe và vâng theo.
- source_word: לַאֲשֶׁר
  choice: và làm điều
  rationale: Cụm này liên kết việc nghe lời với nội dung mệnh lệnh theo sau. Tiếng Việt cần diễn đạt rõ quan hệ ấy; từ 'làm' thể hiện hệ quả thực tiễn vốn được hàm ý, không biến שׁמע riêng lẻ thành 'vâng phục'.
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: mẹ truyền cho con
  rationale: Phân từ מְצַוָּה diễn tả mệnh lệnh đang được ban ra. 'Truyền' giữ sắc thái có thẩm quyền của צוה; đại từ thân tộc làm câu thoại tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời người mẹ nói với con. Bản dịch ưu tiên tính tự nhiên nhưng chú thích giữ cấu trúc sát chữ và sắc thái chưa hoàn toàn tách biệt giữa nghe, chú ý và vâng theo.
