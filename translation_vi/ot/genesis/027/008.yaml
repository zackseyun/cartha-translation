revisions:
- from: “Vậy bây giờ, con trai của mẹ, hãy nghe lời mẹ và làm điều mẹ truyền cho con.[a]”
  to: “Bây giờ, con trai mẹ, hãy nghe lời mẹ và làm theo điều mẹ truyền cho con.[a]”
  rationale: Bản sửa bỏ sự lặp ý không cần thiết ở mở đầu và thay “làm điều” bằng “làm theo điều” cho tiếng Việt tự nhiên hơn. Chú thích được giữ để cho thấy hình ảnh “nghe tiếng” và tính đang diễn tiến của phân từ Hê-bơ-rơ, đồng thời không áp đặt một cách giải thích thần học nào.
