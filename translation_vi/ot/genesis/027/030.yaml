  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc 'Vừa khi ... thì' để giữ nhịp kể gấp gáp; giữ các tên riêng theo dạng quen thuộc Y-sác, Gia-cốp và Ê-sau.
