base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: vi
  text: Sau khi Y-sác chúc phước cho Gia-cốp xong, Gia-cốp vừa mới rời khỏi trước mặt cha mình là Y-sác[a] thì Ê-sau, anh của Gia-cốp, từ cuộc đi săn trở về.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nhấn mạnh rằng Gia-cốp chỉ vừa mới rời khỏi sự hiện diện của Y-sác thì Ê-sau đã trở về.
    reason: source_emphasis
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: Vừa khi ... thì
  rationale: Cấu trúc tương liên tự nhiên trong tiếng Việt diễn đạt chuỗi sự việc xảy ra sát nhau, thay cho việc lặp công thức kể chuyện một cách nặng nề.
- source_word: כַּאֲשֶׁר כִּלָּה ... לְבָרֵךְ
  choice: chúc phước ... xong
  rationale: Diễn đạt tự nhiên thành ngữ chỉ việc hoàn tất một hành động, đồng thời giữ nguyên nội dung ban phước.
- source_word: אַךְ יָצֹא יָצָא
  choice: vừa mới rời khỏi
  rationale: אַךְ cùng động từ nguyên mẫu tuyệt đối và động từ hữu hạn nhấn mạnh rằng Gia-cốp mới rời đi ngay trước khi Ê-sau đến; 'vừa mới' truyền đạt rõ sự sát sao ấy.
- source_word: מֵאֵת פְּנֵי יִצְחָק אָבִיו
  choice: rời khỏi cha mình là Y-sác
  rationale: Trong ngữ cảnh, cụm Hê-bơ-rơ chỉ việc rời khỏi sự hiện diện của Y-sác. Cách dịch này tự nhiên trong tiếng Việt và vẫn nêu rõ quan hệ cha con.
- source_word: וְעֵשָׂו אָחִיו
  choice: Ê-sau, anh của ông
  rationale: Giữ quan hệ anh em được nguyên văn nêu rõ; 'ông' quy chiếu về Gia-cốp trong văn phong kể chuyện trang trọng.
- source_word: בָּא מִצֵּידוֹ
  choice: đi săn trở về
  rationale: ציד ở đây phù hợp nhất với hoạt động săn bắn; trong mạch kể, בָּא diễn tả Ê-sau trở về từ cuộc săn.
theological_decisions: []
