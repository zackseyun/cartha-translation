  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” cho người mẹ và “cậu” cho Gia-cốp theo ngữ cảnh, đồng thời tránh lặp đại từ sở hữu không cần thiết ở vế đầu.
