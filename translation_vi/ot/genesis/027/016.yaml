  text: Bà lấy da dê con phủ lên hai tay và phần cổ nhẵn của cậu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: da
  rationale: Danh từ số nhiều ở dạng liên kết chỉ những tấm da động vật dùng để phủ lên người. Tiếng Việt thường dùng danh từ khối “da” trong ngữ cảnh này, tự nhiên hơn “những tấm da” mà vẫn chuyển tải đúng ý.
- source_word: גְּדָיֵי הָעִזִּים
  choice: dê con
  rationale: Cụm từ chỉ các con non thuộc loài dê. “Dê con” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: הִלְבִּישָׁה
  choice: bọc quanh
  rationale: Dạng Hiphil của לבש có nghĩa khiến ai mặc hoặc phủ vật gì lên người. Vì da được đặt lên tay và cổ để che phần nhẵn, “bọc quanh” diễn đạt hành động cụ thể, tự nhiên hơn “mặc” trong tiếng Việt.
- source_word: עַל יָדָיו
  choice: quanh hai tay
  rationale: יָדָיו là dạng song số có hậu tố ngôi ba số ít giống đực, nên “hai tay của cậu”; trong câu, “quanh hai tay” diễn đạt tự nhiên cách da được phủ lên tay.
- source_word: חֶלְקַת צַוָּארָיו
  choice: phần cổ nhẵn của cậu
  rationale: חֶלְקַת chỉ phần nhẵn hoặc sự nhẵn; cách dịch này giữ hình ảnh cụ thể về phần cổ không có lông. צַוָּארָיו có hình thái số nhiều/song số nhưng ở đây chỉ vùng cổ của một người, nên tiếng Việt dùng số ít tự nhiên.
