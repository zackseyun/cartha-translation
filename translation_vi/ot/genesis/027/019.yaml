base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: vi
  text: 'Gia-cốp nói với cha mình: “Con là Ê-sau, con trưởng của cha. Con đã làm như cha dặn. Xin cha đứng dậy, ngồi xuống và ăn món thịt săn của con, để cha chúc phước cho con.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו
  choice: Gia-cốp nói với cha mình
  rationale: Diễn đạt tự nhiên cấu trúc kể chuyện nối tiếp và giữ nguyên quan hệ cha con quan trọng trong ngữ cảnh.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: Con là Ê-sau, con trưởng của cha
  rationale: Đại từ xưng hô “con—cha” phù hợp lời một người con nói với cha trong tiếng Việt; câu vẫn trình bày trực tiếp lời mạo nhận của Gia-cốp.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: Con đã làm như cha dặn
  rationale: “Dặn” chuyển tải tự nhiên lời chỉ dẫn trước đó của Y-sác mà không thêm ý.
- source_word: קוּם־נָא שְׁבָה
  choice: Xin cha dậy, ngồi xuống
  rationale: Giữ cả hai mệnh lệnh nối tiếp; “xin” thể hiện sắc thái thỉnh cầu của נָא, còn cách xưng hô làm câu tự nhiên và kính trọng trong tiếng Việt.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: và ăn thịt săn của con
  rationale: צַיִד trong ngữ cảnh chỉ thú săn dùng làm thức ăn; “thịt săn” rõ nghĩa và không mặc nhiên xác nhận nguồn gốc thật của món ăn.
- source_word: בַּעֲבוּר תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: để chính cha chúc phước cho con
  rationale: נֶפֶשׁ ở đây chỉ chính con người và có sắc thái nhấn mạnh; “chính cha” truyền đạt thành ngữ tự nhiên hơn cách dịch máy móc là “linh hồn của cha”.
theological_decisions:
- issue: Cách dịch נַפְשֶׁךָ trong cụm תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: để chính cha chúc phước cho con
  alternative: để linh hồn cha chúc phước cho con
  rationale: Trong thành ngữ Hê-bơ-rơ này, נֶפֶשׁ chỉ bản thân con người chứ không chủ ý đưa ra một khẳng định về cấu tạo linh hồn và thân thể. Bản dịch chính dùng lối nói tự nhiên, còn chú thích bảo lưu hình thức sát chữ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Cách xưng hô “con—cha” phù hợp quan hệ trong lời thoại. Giữ chuỗi động tác có phần khác thường “dậy, ngồi xuống” vì cả hai động từ đều có trong bản Hê-bơ-rơ.
