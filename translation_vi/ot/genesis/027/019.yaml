  to: 'Gia-cốp nói với cha mình: “Con là Ê-sau, con trưởng của cha. Con đã làm như cha dặn. Xin cha đứng dậy, ngồi xuống và ăn món thịt săn của con, để cha chúc phước cho con.”'
