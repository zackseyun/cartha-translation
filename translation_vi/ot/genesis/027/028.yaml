  to: Nguyện Đức Chúa Trời ban cho con sương móc của trời[a], sự màu mỡ của đất, cùng dồi dào ngũ cốc và rượu mới.
  rationale: Bản sửa chỉ thay thuật ngữ quá hẹp “lúa thóc” bằng “ngũ cốc” và điều chỉnh vị trí trạng từ để phản ánh rõ hơn רֹב. Cách diễn đạt chính vẫn để ngỏ sắc thái của מִן; chú thích ghi nhận cách hiểu phân lượng có thể có, phù hợp với tính mơ hồ của nguyên văn.
