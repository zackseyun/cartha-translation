source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: vi
  text: Nguyện Đức Chúa Trời ban cho con sương móc của trời[a], sự màu mỡ của đất, cùng dồi dào ngũ cốc và rượu mới.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một phần sương móc của trời ... một phần sự màu mỡ của đất.” Tiếng Hê-bơ-rơ dùng hình ảnh về độ phì nhiêu và sản vật dồi dào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Nguyện ... ban cho
  rationale: Dạng động từ trong ngữ cảnh lời chúc phước diễn tả lời cầu chúc hơn là một lời dự báo đơn thuần; “Nguyện” chuyển tải tự nhiên sắc thái ấy trong tiếng Việt trang trọng.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh xưng xác định này chỉ Đức Chúa Trời; cách dịch được dùng rộng rãi, trang trọng và phù hợp với văn phong Kinh Thánh tiếng Việt.
- source_word: מִטַּל הַשָּׁמַיִם
  choice: sương móc của trời
  rationale: Giữ hình ảnh nông nghiệp và quan hệ sở thuộc trong tiếng Hê-bơ-rơ. Giới từ מִן có thể mang nghĩa phân lượng hoặc chỉ nguồn, nên sự mơ hồ này được nêu trong chú thích thay vì đưa cách diễn đạt gượng gạo vào câu chính.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: sự màu mỡ của đất
  rationale: Danh từ liên hệ đến “mỡ/béo” được dùng theo nghĩa hình tượng về độ phì nhiêu, sung túc của đất; “sự màu mỡ” truyền đạt rõ hình ảnh trong tiếng Việt hiện đại.
- source_word: וְרֹב
  choice: dư dật
  rationale: רֹב chỉ số lượng nhiều, sự dồi dào; đặt “dư dật” sau hai danh từ phối hợp tạo câu chúc phước tự nhiên và trang trọng.
- source_word: דָּגָן
  choice: lúa thóc
  rationale: Từ này chỉ ngũ cốc nói chung; “lúa thóc” dễ hiểu trong bối cảnh nông nghiệp và không thu hẹp vào một giống cây cụ thể.
- source_word: וְתִירֹשׁ
  choice: rượu mới
  rationale: תִּירוֹשׁ thường chỉ rượu mới hoặc sản phẩm mới của nho, phân biệt với thuật ngữ chung hơn về rượu; “rượu mới” bảo toàn nét nghĩa ấy.
theological_decisions:
- issue: Tính chất của lời nói
  choice: 'Lời cầu chúc: “Nguyện Đức Chúa Trời ban cho”'
  alternative: 'Lời dự báo: “Đức Chúa Trời sẽ ban cho”'
  rationale: Hình thái động từ cùng ngữ cảnh Y-sác đang chúc phước ủng hộ cách hiểu đây là lời cầu chúc có tính ban phước, không chỉ là lời tiên đoán.
- issue: Sắc thái của giới từ מִן trong hai cụm đầu
  choice: Dịch tự nhiên bằng “của” trong câu chính và ghi nhận nghĩa phân lượng/nguồn trong chú thích
  alternative: Dịch rõ thành “một phần sương móc ... một phần sự màu mỡ”
  rationale: מִן có thể được hiểu theo nghĩa phân lượng hoặc nguồn trong công thức chúc phước này. Không nên biến một khả năng thành cách hiểu duy nhất; chú thích bảo tồn sự mơ hồ mà không làm câu tiếng Việt thiếu tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ nhịp của một lời chúc phước. Dùng “con” phù hợp với lời người cha nói với con trai trong ngữ cảnh. Hình ảnh “sương móc,” “đất màu mỡ,” “lúa thóc” và “rượu mới” được bảo toàn.
