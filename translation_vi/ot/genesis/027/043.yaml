  yaml_path: translation/ot/genesis/027/043.yaml
  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: vi
  text: 'Bây giờ, con trai mẹ, hãy nghe lời mẹ: đứng dậy, chạy trốn đến với La-ban, anh mẹ, ở Cha-ran.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Và bây giờ, con trai mẹ, hãy nghe tiếng mẹ; đứng dậy, hãy chạy trốn đến với La-ban, anh mẹ, về Cha-ran.”'
    reason: Bảo lưu cách dịch sát hơn của liên từ trong וְעַתָּה, nghĩa đen “nghe tiếng mẹ” của שְׁמַע בְּקֹלִי, sắc thái thân vị/hướng của לְךָ, và hậu tố chỉ hướng trong חָרָנָה.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ chức năng chuyển ý của liên từ וְ cùng sắc thái chỉ thời điểm và lời chỉ dẫn tức thời của עַתָּה, đồng thời tự nhiên trong tiếng Việt.
- source_word: בְנִי
  choice: con trai mẹ
  rationale: Lời Rê-bê-ca trực tiếp gọi Gia-cốp; cách xưng hô này giữ quan hệ mẹ-con và giới tính được nêu trong tiếng Hê-bơ-rơ.
- source_word: שְׁמַע בְּקֹלִי
  choice: hãy nghe lời mẹ
  rationale: Thành ngữ sát nghĩa là “nghe tiếng mẹ”, nhưng trong ngữ cảnh mệnh lệnh, “nghe lời mẹ” là tiếng Việt tự nhiên và vẫn giữ hàm ý làm theo mà không diễn giải mạnh thành “vâng lời”.
- source_word: וְקוּם
  choice: đứng dậy
  rationale: Chuyển tải mệnh lệnh của קום bằng cách nói hiện đại, rõ ràng, phù hợp với chuỗi chỉ thị khẩn cấp.
- source_word: בְּרַח לְךָ
  choice: trốn đến
  rationale: ברח chỉ việc chạy trốn; לְךָ là thành tố hướng/thân vị không cần dịch riêng. “Trốn đến” kết hợp tự nhiên với đích đến ngay sau đó.
- source_word: אֶל לָבָן אָחִי
  choice: đến chỗ La-ban, anh mẹ
  rationale: “Đến chỗ” diễn đạt hướng về nơi La-ban đang ở; phần đồng vị “anh mẹ” bảo toàn quan hệ gia đình trong nguyên văn.
- source_word: חָרָנָה
  choice: tại Cha-ran
  rationale: Hậu tố chỉ hướng trên địa danh biểu thị chuyển động về Cha-ran; vì hướng chuyển động đã được thể hiện qua “đến chỗ”, “tại Cha-ran” xác định nơi La-ban cư ngụ mà tránh lặp từ.
theological_decisions: []
