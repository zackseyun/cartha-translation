  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “mẹ” trong lời nói trực tiếp để thể hiện tự nhiên quan hệ của Rê-bê-ca với Gia-cốp; giữ hai mệnh lệnh liên tiếp và nhịp khẩn cấp của câu.
