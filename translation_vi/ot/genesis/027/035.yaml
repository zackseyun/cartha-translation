  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: vi
  text: 'Ông nói: “Em trai con đã đến bằng sự lừa dối[a] và lấy phước lành của con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với sự lừa dối,” “do sự lừa dối” hoặc “một cách gian dối.” Tiếng Hê-bơ-rơ dùng danh từ “sự lừa dối” đi với một giới từ, có thể chỉ cách thức hoặc phương tiện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ông nói
  rationale: Dạng wayyiqtol của אמר mở đầu lời đáp của Y-sác. Tiếng Việt tự nhiên không cần giữ liên từ “và” ở đầu câu; “ông” tiếp nối chủ thể đã rõ trong ngữ cảnh.
- source_word: בָּא
  choice: đến đây
  rationale: Qal hoàn thành của בוא chỉ hành động đã xảy ra. “Đến đây” diễn đạt tự nhiên hướng chuyển động về nơi người nói mà không thêm nội dung ngoài ngữ cảnh.
- source_word: אָחִיךָ
  choice: em trai con
  rationale: Danh từ אָח với hậu tố ngôi hai số ít giống đực có nghĩa “anh/em trai của con”; trong ngữ cảnh Gia-cốp là em sinh đôi của Ê-sau, nên “em trai con” vừa chính xác vừa giữ sức nặng của quan hệ ruột thịt.
- source_word: בְּמִרְמָה
  choice: dùng mưu lừa
  rationale: Cụm giới từ בְּ với danh từ מִרְמָה biểu thị cách thức hoặc phương tiện. “Dùng mưu lừa” là cách nói tự nhiên, vẫn giữ sắc thái danh từ và ý nghĩa đạo đức của hành vi gian dối.
- source_word: וַיִּקַּח
  choice: và lấy mất
  rationale: Wayyiqtol của לקח tiếp nối chuỗi hành động. “Lấy mất” tự nhiên trong tiếng Việt và thể hiện rằng phước lành vốn dành cho người nghe đã bị người khác lấy, nhưng không cường điệu thành cưỡng đoạt.
- source_word: בִּרְכָתֶךָ
  choice: phước lành của con
  rationale: Dịch trực tiếp danh từ “phước lành” với hậu tố sở hữu ngôi hai số ít; trong ngữ cảnh là lời chúc phước của người cha dành cho Ê-sau.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông/con” phù hợp lời người kể và lời người cha nói với con. Hạt “rồi” giúp diễn đạt tự nhiên tính hoàn tất của hai hành động trong lời giải thích.
