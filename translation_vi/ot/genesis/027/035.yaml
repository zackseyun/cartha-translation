  to: 'Ông nói: “Em trai con đã đến bằng sự lừa dối[a] và lấy phước lành của con.”'
  rationale: Bản sửa thay cách diễn đạt chưa tự nhiên “dùng mưu lừa đến đây” bằng “đến bằng sự lừa dối,” để phản ánh trực tiếp cụm giới từ בְּמִרְמָה mà không thu hẹp nó chỉ thành mưu mẹo hay thêm chi tiết. Động từ “lấy” được giữ theo nghĩa cơ bản của לקח.
