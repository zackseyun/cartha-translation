  text: וַ/יַּ֤עַשׂ גַּם הוּא֙ מַטְעַמִּ֔ים וַ/יָּבֵ֖א לְ/אָבִ֑י/ו וַ/יֹּ֣אמֶר לְ/אָבִ֗י/ו יָקֻ֤ם אָבִ/י֙ וְ/יֹאכַל֙ מִ/צֵּ֣יד בְּנ֔/וֹ בַּ/עֲב֖וּר תְּבָרֲכַ֥/נִּי נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: vi
  text: 'Ê-sau cũng làm các món ăn ngon[a], đem đến cho cha mình và thưa với cha: “Xin cha đứng dậy, ăn thịt thú săn của con trai cha, để cha[b] chúc phước cho con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “các món ăn ngon đặc biệt” hoặc “các món ăn thơm ngon”. Từ Hê-bơ-rơ chỉ những món được chế biến ngon miệng trong câu chuyện này.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “để linh hồn cha chúc phước cho con.” Trong cách nói Hê-bơ-rơ, “linh hồn” ở đây có thể chỉ chính con người; vì vậy bản văn chính dịch là “cha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Ê-sau cũng
  rationale: Cụm từ nhấn mạnh hành động song song với việc Gia-cốp đã làm trước đó. Dùng tên Ê-sau, được xác định rõ từ ngữ cảnh, giúp câu tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: מַטְעַמִּים
  choice: những món ngon
  rationale: Danh từ chỉ các món ăn được chế biến ngon miệng; cách dịch này tự nhiên, hiện đại và giữ được mô-típ lặp lại trong chương.
- source_word: וַיָּבֵא לְאָבִיו
  choice: đem đến cho cha mình
  rationale: Tân ngữ là các món ngon vừa được nhắc đến nên không cần lặp lại trong tiếng Việt; “cha mình” xác định quan hệ phản thân tự nhiên.
- source_word: יָקֻם אָבִי
  choice: Xin cha đứng dậy
  rationale: Thể ý nguyện diễn đạt lời thỉnh cầu kính trọng. “Xin cha” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái lễ phép.
- source_word: מִצֵּיד בְּנוֹ
  choice: thịt săn của con trai cha
  rationale: צַיִד trong bối cảnh này là thú săn dùng làm thức ăn. “Thịt săn” rõ nghĩa hơn “con mồi”, còn cách xưng “con trai cha” giữ lối nói ngôi thứ ba kính trọng của nguyên văn.
- source_word: בַּעֲבוּר
  choice: để
  rationale: Giới từ nêu mục đích; “để” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt hiện đại.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: để chính lòng cha chúc phước cho con
  rationale: Giữ נֶפֶשׁ như chủ thể thay vì giản lược hoàn toàn thành “cha”, nhưng dùng “chính lòng cha” để diễn đạt thành ngữ về chính con người và ý nguyện sâu xa, tránh khiến “linh hồn” bị hiểu theo nghĩa bản thể học không nhất thiết có ở đây.
theological_decisions:
- issue: Ý nghĩa của נַפְשֶׁךָ trong lời xin chúc phước
  choice: chính lòng cha
  alternative: linh hồn cha; chính cha
  rationale: Nguyên văn dùng נֶפֶשׁ, có thể chỉ sinh khí, lòng muốn hoặc chính bản thân người ấy. “Chính lòng cha” bảo tồn nét biểu đạt nội tâm mà không áp đặt một quan niệm phân chia linh hồn–thân thể; chú thích nêu cách dịch sát chữ.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Lời Ê-sau dùng “xin cha” và tự xưng “con” để thể hiện kính trọng; “chúc phước” duy trì thuật ngữ nhất quán phù hợp bối cảnh gia trưởng và lời phước lành.
