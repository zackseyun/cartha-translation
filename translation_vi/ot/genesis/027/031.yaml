revisions:
- from: 'Ê-sau cũng làm những món ngon rồi đem đến cho cha mình. Chàng thưa với cha: “Xin cha đứng dậy và ăn thịt săn của con trai cha, để chính lòng cha chúc phước cho con.”'
  to: 'Ê-sau cũng làm các món ăn ngon[a], đem đến cho cha mình và thưa với cha: “Xin cha đứng dậy, ăn thịt thú săn của con trai cha, để cha[b] chúc phước cho con.”'
  rationale: Sửa cách dịch thành ngữ נַפְשְׁךָ từ “chính lòng cha” thành “cha”, đồng thời đặt chú thích sát chỗ dịch để duy trì sự minh bạch đối với nguyên văn. Các điều chỉnh văn phong làm câu tự nhiên hơn mà không thay đổi nghĩa, quan hệ xưng hô, hay tính trang trọng của lời Ê-sau.
