base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: vi
  text: 'Nhưng Gia-cốp nói với Rê-bê-ca, mẹ mình: “Mẹ xem, anh Ê-sau của con là người đầy lông, còn con thì trơn nhẵn.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trơn nhẵn” ở đây nói đến việc Gia-cốp không có lông trên cơ thể, đối lập với Ê-sau là người đầy lông.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng Gia-cốp thưa
  rationale: Waw liên tiếp đưa câu chuyện tiến tới, đồng thời lời Gia-cốp mang tính phản đối kế hoạch vừa được nêu; “nhưng” diễn đạt quan hệ ngữ cảnh ấy. “Thưa” tự nhiên và phù hợp khi người con nói với mẹ.
- source_word: אֶל רִבְקָה אִמּוֹ
  choice: với mẹ mình là Rê-bê-ca
  rationale: Giữ cả tên riêng lẫn quan hệ mẹ con như tiếng Hê-bơ-rơ, nhưng sắp xếp lại cho tự nhiên trong tiếng Việt.
- source_word: הֵן
  choice: Mẹ xem
  rationale: Tiểu từ thu hút sự chú ý và dẫn vào điều Gia-cốp lo ngại. Trong lời con nói với mẹ, “Mẹ xem” tự nhiên hơn “Kìa” hay “Này” mà vẫn giữ lực diễn ngôn.
- source_word: עֵשָׂו אָחִי
  choice: anh con là Ê-sau
  rationale: אָחִי chỉ “anh/em trai tôi”; theo mạch truyện Ê-sau là anh. Cách nói quy chiếu theo quan hệ với người mẹ nghe tự nhiên trong tiếng Việt.
- source_word: אִישׁ שָׂעִר
  choice: người đầy lông
  rationale: Diễn đạt tự nhiên đặc điểm cơ thể của Ê-sau; tránh cách “người có lông” dễ nghe gượng, đồng thời không giới hạn ý chỉ ở tóc.
- source_word: וְאָנֹכִי אִישׁ חָלָק
  choice: còn con là người nhẵn nhụi
  rationale: Đại từ độc lập אָנֹכִי nhấn mạnh sự tương phản; “còn con” thể hiện rõ đối chiếu. “Nhẵn nhụi” giữ hình ảnh đối lập với thân thể đầy lông mà không diễn giải quá mức.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thưa” cùng các đại từ thân tộc “mẹ/con/anh” để lời thoại tự nhiên trong tiếng Việt; giữ tên Rê-bê-ca và quan hệ làm mẹ như nguyên văn. Dấu chú thích [a] xuất hiện ngay sau cụm từ cần giải thích.
