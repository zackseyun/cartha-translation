revisions:
- from: 'Rê-bê-ca đang nghe khi Y-sác nói với Ê-sau, con trai ông[a]. Ê-sau ra đồng để săn thú và mang về[b].


    [a] Cũng có thể dịch: “Rê-bê-ca nghe trong lúc Y-sác đang nói với Ê-sau, con trai ông.”


    [b] Cũng có thể dịch sát hơn: “để săn thú đem về.”'
  to: 'Rê-bê-ca đang nghe Y-sác nói với Ê-sau, con trai mình[a]. Ê-sau ra đồng để săn thú và mang về[b].


    [a] Cũng có thể dịch: “Rê-bê-ca nghe khi Y-sác đang nói với Ê-sau, con trai mình.”


    [b] Cũng có thể dịch sát hơn: “để săn thú đem về.”'
  rationale: Chỉnh sửa chỉ nhằm làm câu tiếng Việt tự nhiên và rõ quy chiếu hơn. Bản sửa giữ nguyên thời tính đang diễn ra của việc Rê-bê-ca nghe, đối tượng lời nói của Y-sác, hành động Ê-sau ra đồng, và hai mục đích săn rồi đem thú săn được về.
