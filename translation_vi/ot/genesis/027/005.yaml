  text: וְ/רִבְקָ֣ה שֹׁמַ֔עַת בְּ/דַבֵּ֣ר יִצְחָ֔ק אֶל עֵשָׂ֖ו בְּנ֑/וֹ וַ/יֵּ֤לֶךְ עֵשָׂו֙ הַ/שָּׂדֶ֔ה לָ/צ֥וּד צַ֖יִד לְ/הָבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: vi
  text: 'Rê-bê-ca đang nghe Y-sác nói với Ê-sau, con trai mình[a]. Ê-sau ra đồng để săn thú và mang về[b].


    [a] Cũng có thể dịch: “Rê-bê-ca nghe khi Y-sác đang nói với Ê-sau, con trai mình.”


    [b] Cũng có thể dịch sát hơn: “để săn thú đem về.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Rê-bê-ca nghe khi Y-sác đang nói với Ê-sau, con trai mình.”'
    reason: Nêu cách dịch khác của phân từ שֹׁמַעַת và cấu trúc בְּ + động từ nguyên mẫu, vẫn giữ sắc thái hai hành động đồng thời.
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “để săn thú đem về.”'
    reason: Giữ khả năng diễn đạt hai động từ nguyên mẫu liên tiếp như một chuỗi mục đích, thay vì liên kết bằng “và” trong bản văn chính.
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: Rê-bê-ca
  rationale: Không dịch liên từ וְ thành một từ nối riêng ở đầu câu vì trong diễn tiến tường thuật, tiếng Việt không cần thêm “và” hay “bấy giờ” để câu tự nhiên.
- source_word: שֹׁמַעַת
  choice: đang nghe
  rationale: Phân từ diễn tả hành động hoặc trạng thái đang tiếp diễn trong bối cảnh; “đang nghe” tự nhiên và không nhấn mạnh quá mức như “chăm chú lắng nghe”.
- source_word: בְּ/דַבֵּר
  choice: khi Y-sác nói
  rationale: בְּ với động từ nguyên mẫu cấu tạo diễn tả hai hành động đồng thời; “khi” chuyển tải quan hệ thời gian này tự nhiên trong tiếng Việt.
- source_word: אֶל עֵשָׂו בְּנוֹ
  choice: với Ê-sau, con trai ông
  rationale: אֶל chỉ đối tượng được nói với; hậu tố trong בנוֹ quy chiếu về Y-sác. Cách diễn đạt này rõ ràng mà không thêm ý “con ruột” hay “con riêng”.
- source_word: וַ/יֵּלֶךְ
  choice: ra
  rationale: Trong ngữ cảnh đi từ nơi ở đến ngoài đồng, “ra” là cách diễn đạt tự nhiên của hành động đi, không hàm ý bỏ đi vĩnh viễn.
- source_word: הַ/שָּׂדֶה
  choice: đồng
  rationale: שָׂדֶה có thể chỉ cánh đồng hoặc vùng đất trống ngoài nơi cư trú; “ra đồng” vừa gọn vừa phù hợp bối cảnh săn bắn.
- source_word: לָ/צוּד צַיִד
  choice: để săn thú
  rationale: צוד cùng danh từ đồng gốc ציד chỉ việc săn con vật làm mồi; “săn thú” giữ nghĩa rộng, không thu hẹp thành thịt nai.
- source_word: לְ/הָבִיא
  choice: và mang về
  rationale: Động từ nguyên mẫu thứ hai nêu mục đích đem con thú săn được trở lại; “mang về” diễn đạt tự nhiên hướng trở về được ngữ cảnh hàm chứa.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các dạng tên quen thuộc “Rê-bê-ca,” “Y-sác,” và “Ê-sau.” Câu được tách làm hai để tránh chuỗi mệnh đề dài, trong khi vẫn giữ diễn tiến liên tục của bản Hê-bơ-rơ.
