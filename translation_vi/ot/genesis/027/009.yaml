  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: vi
  text: Con hãy đi đến đàn gia súc nhỏ, lấy cho mẹ từ đó hai con dê non tốt; mẹ sẽ chế biến chúng thành những món ăn ngon cho cha con, như cha con vẫn thích.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Con hãy đi
  rationale: Mệnh lệnh לֶךְ được diễn đạt bằng “hãy đi”; נָא làm lời yêu cầu nhẹ hơn. Đại từ “con” được thêm theo quan hệ mẹ–con đã rõ trong ngữ cảnh, giúp câu tự nhiên trong tiếng Việt.
- source_word: הַצֹּאן
  choice: đàn gia súc
  rationale: צֹאן chỉ đàn gia súc nhỏ, gồm cừu và dê; “đàn gia súc” giữ nghĩa rộng vì vế sau mới xác định là dê.
- source_word: וְקַח לִי מִשָּׁם
  choice: và bắt về cho mẹ
  rationale: לקח có nghĩa là lấy hoặc bắt; trong bối cảnh lấy dê từ đàn, “bắt về” tự nhiên. “Cho mẹ” thể hiện לִי theo quan hệ người nói là Rê-bê-ca.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים טֹבִים
  choice: hai con dê non thật tốt
  rationale: Cụm này chỉ hai dê con có chất lượng hoặc thích hợp; “dê non thật tốt” rõ nghĩa và gần cấu trúc Hê-bơ-rơ.
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: Mẹ sẽ làm chúng thành món ngon
  rationale: מַטְעַמִּים là các món ăn ngon, hợp khẩu vị. “Món ngon” tự nhiên, dễ hiểu và giữ sắc thái ẩm thực.
- source_word: לְאָבִיךָ
  choice: cho cha con
  rationale: Duy trì quan hệ gia đình và văn phong trang trọng, tự nhiên của lời kể Kinh Thánh.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: đúng như món ông ấy thích
  rationale: Động từ אָהֵב theo nghĩa đen là “yêu”, nhưng khi nói về thức ăn, tiếng Việt tự nhiên dùng “thích”. Cụm “món” được bổ sung để làm rõ đối tượng được ưa thích.
