translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Lời thoại dùng cặp xưng hô mẹ–con phù hợp quan hệ Rê-bê-ca và Gia-cốp; không thêm diễn giải thần học.
