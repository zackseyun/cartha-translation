base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: vi
  text: 'Khi Y-sác đã già, mắt ông mờ đến nỗi không còn thấy được, ông gọi Ê-sau, người con trai lớn của mình, rồi nói: “Con trai!” Ê-sau thưa: “Con đây.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Khi
  rationale: Cụm mở đầu dẫn vào hoàn cảnh thời gian của câu chuyện. Tiếng Việt tự nhiên chỉ cần “Khi”, không cần dịch máy móc bằng một công thức như “Xảy ra là khi”.
- source_word: זָקֵן
  choice: đã già
  rationale: Diễn đạt trạng thái tuổi cao của Y-sác bằng lối nói thông dụng, trang trọng vừa phải.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: mắt ông mờ đến nỗi không còn thấy được
  rationale: Giữ hình ảnh đôi mắt bị mờ và diễn đạt rõ hệ quả mất khả năng nhìn.
- source_word: וַיִּקְרָא
  choice: gọi ... đến
  rationale: Trong ngữ cảnh, động từ chỉ việc gọi người con đến gặp; thêm “đến” giúp câu tiếng Việt tự nhiên mà không nâng mức trang trọng thành “triệu”.
- source_word: אֶת עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: Ê-sau, người con trai lớn
  rationale: הַגָּדֹל phân biệt Ê-sau là người con lớn hơn Gia-cốp. “Con trai lớn” tự nhiên và không buộc phải hiểu theo nghĩa tuyệt đối “trưởng nam”.
- source_word: בְּנִי
  choice: Con trai của cha!
  rationale: Giữ sắc thái thân tình và sở hữu của hậu tố ngôi thứ nhất; cách xưng hô “cha–con” phù hợp lời người cha nói với con trong tiếng Việt.
- source_word: הִנֵּנִי
  choice: Con đây
  rationale: Công thức đáp lời biểu thị sự hiện diện và sẵn sàng; trong quan hệ cha–con, “Con đây” tự nhiên hơn bản dịch từng chữ “Này, con đây”.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang nghiêm; dùng cách xưng hô cha–con tự nhiên. Không thêm dấu chú thích vì câu tiếng Việt chính đã truyền đạt trực tiếp các nét nghĩa cần thiết.
