  yaml_path: translation/ot/genesis/027/026.yaml
  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: vi
  text: 'Bấy giờ, cha ông là I-sác nói với ông: “Xin con lại gần và hôn cha.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Dạng wayyiqtol tiếp nối diễn tiến của câu chuyện; “Rồi” thể hiện tự nhiên trình tự kể chuyện trong tiếng Việt.
- source_word: אֵלָיו
  choice: với ông
  rationale: Giới từ אֶל với hậu tố ngôi ba số ít giống đực chỉ người được nói với; trong văn kể chuyện tiếng Việt, “nói với ông” là cách diễn đạt tự nhiên.
- source_word: יִצְחָק אָבִיו
  choice: I-sác, cha ông
  rationale: Giữ quan hệ đồng vị và sự nhấn mạnh quan hệ cha con của nguyên văn; tên riêng được phiên âm theo cách quen dùng trong tiếng Việt.
- source_word: גְּשָׁה נָא
  choice: Con hãy lại gần
  rationale: נגשׁ diễn tả việc tiến đến gần về thể lý; נָא làm nhẹ mệnh lệnh. “Hãy” cùng cách xưng hô cha–con truyền đạt lời yêu cầu tự nhiên, không cần thêm “xin” vốn kém tự nhiên khi cha nói với con.
- source_word: וּשְׁקָה לִּי
  choice: và hôn cha đi
  rationale: Động từ mệnh lệnh נשׁק cùng לִי được diễn đạt tự nhiên bằng động từ trực tiếp “hôn”; “cha” thay đại từ ngôi thứ nhất theo lối xưng hô gia đình tiếng Việt, còn “đi” làm dịu lời yêu cầu.
- source_word: בְּנִי
  choice: Con
  rationale: Từ xưng gọi “con trai của ta” được thể hiện qua đại từ thân tộc “Con” ở đầu lời nói; cách này giữ quan hệ và sắc thái trìu mến mà không lặp gượng “con trai của cha” ở cuối câu.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Hệ thống xưng hô “cha–con” được dùng để chuyển tải tự nhiên בְּנִי và ngôi thứ nhất của I-sác. Không đặt chú thích vì phương án “hãy lại gần” đã trực tiếp giữ nghĩa của גְּשָׁה; chú thích tiếng Anh nêu “Approach” chỉ là biến thể diễn đạt, không phải khác biệt nội dung cần bảo tồn trong tiếng Việt.
