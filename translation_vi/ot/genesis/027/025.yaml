base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: vi
  text: 'Ông nói: “Hãy đem món đó lại gần cho ta, để ta ăn thịt thú săn được của con trai ta, hầu cho linh hồn ta[a] chúc phước cho con.” Người ấy đem món đó lại gần ông, và ông ăn; người ấy đem rượu cho ông, và ông uống.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói tự nhiên hơn: “để ta chúc phước cho con.” Tiếng Hê-bơ-rơ: “để linh hồn ta chúc phước cho con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישָׁה
  choice: Hãy đem món đó lại gần ta
  rationale: Dạng mệnh lệnh của נגשׁ ở thể khiến khiến mang nghĩa đem lại gần hoặc trình ra. “Món đó” bổ sung tân ngữ hàm ẩn theo ngữ cảnh thức ăn, đồng thời giữ chuyển động cụ thể về phía Y-sác.
- source_word: וְאֹכְלָה
  choice: để ta ăn
  rationale: Dạng cohortative ngôi thứ nhất diễn tả ý định của Y-sác; trong tiếng Việt, “để ta ăn” tự nhiên sau mệnh lệnh và thể hiện quan hệ mục đích/tiếp nối.
- source_word: מִצֵּיד בְּנִי
  choice: thịt săn của con trai ta
  rationale: צַיִד chỉ con vật săn được hoặc thức ăn từ thú săn. “Thịt săn” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt; מִן có sắc thái phân lượng nhưng không cần dịch riêng.
- source_word: לְמַעַן
  choice: hầu cho
  rationale: Giữ rõ ý nghĩa mục đích và phù hợp với văn phong trang trọng của lời chúc phước.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: linh hồn ta chúc phước cho con
  rationale: Giữ נַפְשִׁי làm chủ ngữ như nguyên văn, bảo tồn thành ngữ Hê-bơ-rơ và sắc thái cá nhân long trọng, thay vì giản lược thành “ta chúc phước cho con”.
- source_word: וַיַּגֶּשׁ לוֹ
  choice: người đem món đó lại gần ông
  rationale: Lặp lại động từ “đem... lại gần” để phản ánh sự nối kết từ vựng với mệnh lệnh trước đó. Tân ngữ hàm ẩn được làm rõ theo ngữ cảnh.
- source_word: יַיִן
  choice: rượu
  rationale: Cách dịch trực tiếp và thông dụng của יַיִן trong ngữ cảnh này.
- source_word: וַיֵּשְׁתְּ
  choice: ông uống
  rationale: Dịch thẳng động từ kể chuyện của שׁתה, phù hợp chuỗi hành động trong câu.
theological_decisions:
- issue: Thành ngữ נַפְשִׁי làm chủ ngữ của hành động chúc phước
  choice: giữ nguyên là “linh hồn ta chúc phước cho con” trong chính văn
  alternative: “ta chúc phước cho con”
  rationale: Nguyên văn nêu rõ “linh hồn ta”; giữ cách nói này tránh làm phẳng sắc thái trang trọng và sự dấn thân của toàn bản thân Y-sác, nhưng chú thích cung cấp cách diễn đạt tự nhiên hơn mà không áp đặt một quan niệm nhân học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/con” phù hợp lời người cha cao tuổi nói với con; phần kể dùng “ông/người” để phân biệt Y-sác với người mang thức ăn. Giữ thành ngữ “linh hồn ta” trong chính văn và giải thích bằng chú thích.
