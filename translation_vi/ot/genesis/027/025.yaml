revisions:
- from: 'Ông nói: “Hãy đem món đó lại gần ta để ta ăn thịt săn của con trai ta, hầu cho linh hồn ta chúc phước cho con.”[a] Vậy, người đem món đó lại gần ông, và ông ăn; người cũng đem rượu cho ông, và ông uống.'
  to: 'Ông nói: “Hãy đem món đó lại gần cho ta, để ta ăn thịt thú săn được của con trai ta, hầu cho linh hồn ta[a] chúc phước cho con.” Người ấy đem món đó lại gần ông, và ông ăn; người ấy đem rượu cho ông, và ông uống.'
  rationale: Bản sửa giữ các lựa chọn sát nguyên ngữ—đặc biệt là “linh hồn ta”—đồng thời thay một cụm từ chưa tự nhiên, làm rõ tham chiếu trong phần kể, và đặt neo chú thích sát thành ngữ tiếng Hê-bơ-rơ được giải thích. Không thay đổi ý nghĩa hay thêm diễn giải thần học.
