source:
  edition: WLC
  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: vi
  text: cho đến khi cơn giận của anh con nguôi đi[a], và anh ấy quên điều con đã làm với anh ấy. Khi ấy, mẹ sẽ sai người đến đưa con từ đó về[b]. Tại sao mẹ lại phải mất cả hai đứa con trong cùng một ngày?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “cho đến khi cơn giận của anh con quay khỏi con.” Tiếng Hê-bơ-rơ dùng động từ “quay/trở lại” với “cơn giận” theo lối thành ngữ.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ nói theo nghĩa đen: “mẹ sẽ sai và đưa con từ đó.” Bản dịch diễn đạt tự nhiên ý mẹ sai người đến đưa Gia-cốp về từ nơi ấy; người được sai không được nêu rõ trong tiếng Hê-bơ-rơ.'
    reason: lexical_alternative
  - marker: c
    text: Câu “mất cả hai đứa con trong cùng một ngày” có thể nói đến những hậu quả khác nhau của cuộc xung đột khiến Rê-bê-ca mất cả hai con, chứ không nhất thiết cả hai bị mất theo cùng một cách.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: cho đến khi cơn giận của anh con nguôi đi
  rationale: Cụm שׁוּב אַף diễn tả cơn giận quay/đổi khỏi đối tượng; “nguôi đi” là thành ngữ tiếng Việt tự nhiên, vẫn giữ giới hạn thời gian do עַד đánh dấu.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: và nó quên điều con đã làm với nó
  rationale: Chuyển sát nghĩa mệnh đề quan hệ, dùng cách xưng hô mẹ–con phù hợp lời Rê-bê-ca nói với Gia-cốp.
- source_word: וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם
  choice: Khi ấy, mẹ sẽ sai người đến đón con từ đó về
  rationale: וְשָׁלַחְתִּי không nêu rõ tân ngữ; “sai người” làm rõ cấu trúc tự nhiên trong tiếng Việt mà không xác định người được sai. לָקַח cơ bản là “lấy/đưa”, nhưng trong ngữ cảnh người mẹ cho gọi con từ nơi lánh nạn về, “đón ... về” truyền đạt đúng hướng quy chiếu.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: Tại sao mẹ lại phải mất cả hai đứa con trong cùng một ngày?
  rationale: שכל mang nghĩa chịu cảnh mất con; “mất cả hai đứa con” tự nhiên và rõ trong tiếng Việt. יוֹם אֶחָד được chuyển là “trong cùng một ngày” để giữ ý về một ngày xảy ra sự mất mát kép.
theological_decisions:
- issue: Cách hiểu việc Rê-bê-ca “mất cả hai” con
  choice: 'Giữ lời than ở mức khái quát: “mất cả hai đứa con”'
  alternative: Giải thích rằng cả hai đều sẽ chết trong cùng một ngày
  rationale: Bản Hê-bơ-rơ không nói rõ hai người sẽ bị mất theo cùng một cách; không nên thu hẹp sự mơ hồ thành một kịch bản cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng hệ thống xưng hô “mẹ–con” và gọi Ê-sau là “anh con”, phù hợp quan hệ gia đình trong lời trực tiếp; tránh từ Hán-Việt nặng như “chịu tang cả hai con” vì có thể thu hẹp nghĩa và kém tự nhiên.
