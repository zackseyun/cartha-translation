    issue: Đại từ “nó” trong “và nó quên điều con đã làm với nó” quy chiếu sai/nhập nhằng.
    rationale: Theo cú pháp, động từ “quên” có chủ ngữ là “anh con” (Ê-sau), không phải “cơn giận”. Cách dùng hiện tại có thể hiểu rằng cơn giận quên một hành động, trái với nghĩa nguồn.
  - severity: low
    issue: Chú thích b mô tả “sai người đến đón” như thể là nghĩa trực tiếp của câu.
    rationale: Tiếng Hê-bơ-rơ chỉ nói “mẹ sẽ sai và đưa con từ đó”; việc nêu người được sai là diễn giải ngữ cảnh hợp lý, nên cần được ghi nhận như cách dịch tự nhiên thay vì là nội dung minh thị.
