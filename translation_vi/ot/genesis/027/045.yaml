  to: cho đến khi cơn giận của anh con nguôi đi[a], và anh ấy quên điều con đã làm với anh ấy. Khi ấy, mẹ sẽ sai người đến đưa con từ đó về[b]. Tại sao mẹ lại phải mất cả hai đứa con trong cùng một ngày?[c]
  rationale: Sửa đại từ để khôi phục chủ ngữ “anh con” của động từ “quên”, đồng thời điều chỉnh chú thích về “sai người” để phân biệt giữa điều tiếng Hê-bơ-rơ nói minh thị và cách tiếng Việt diễn đạt tự nhiên theo ngữ cảnh. Không thay đổi ý nghĩa hoặc thu hẹp tính mơ hồ của lời than cuối câu.
