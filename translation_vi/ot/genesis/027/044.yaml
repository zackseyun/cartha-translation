  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: vi
  text: Con hãy ở với cậu con vài ngày, cho đến khi cơn giận dữ của anh con nguôi đi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Con hãy ở
  rationale: Động từ יָשַׁב có thể mang nghĩa ngồi, cư ngụ hoặc ở lại; trong ngữ cảnh Rê-bê-ca bảo Gia-cốp tạm trú với La-ban, “ở” là cách diễn đạt tự nhiên và đúng ý.
- source_word: עִמּוֹ
  choice: với cậu con
  rationale: Nghĩa trực tiếp là “với người ấy”; tiền ngữ cảnh xác định người ấy là La-ban, anh của Rê-bê-ca và do đó là cậu của Gia-cốp. Dùng “cậu con” giúp tiếng Việt tự nhiên mà không làm mơ hồ đối tượng.
- source_word: יָמִים אֲחָדִים
  choice: ít lâu
  rationale: Thành ngữ theo sát mặt chữ là “một ít ngày.” “Ít lâu” diễn đạt tự nhiên khoảng thời gian tạm thời mà người mẹ dự tính, đồng thời không áp đặt độ dài chính xác.
- source_word: עַד אֲשֶׁר
  choice: cho đến khi
  rationale: Cụm từ này đánh dấu thời điểm kết thúc của việc ở lại.
- source_word: תָּשׁוּב
  choice: nguôi đi
  rationale: שׁוב theo nghĩa gốc là “trở lại/quay lại,” nhưng khi chủ ngữ là cơn thịnh nộ, nó được dùng theo lối thành ngữ chỉ sự lắng xuống. “Nguôi đi” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: חֲמַת
  choice: cơn giận dữ
  rationale: Danh từ חֵמָה chỉ cơn giận nóng bỏng, dữ dội; “cơn giận dữ” giữ được cường độ mà vẫn phổ thông và trang trọng.
- source_word: אָחִיךָ
  choice: của anh con
  rationale: Cụm sở hữu Hê-bơ-rơ có nghĩa là “cơn giận dữ của anh con”; “anh con” phù hợp với quan hệ giữa Ê-sau và Gia-cốp trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng lời thoại gia đình tự nhiên, hiện đại và trang trọng vừa phải. Đại từ “con” phản ánh lời người mẹ nói với con trai; “cậu con” làm rõ quan hệ thân tộc đã có trong ngữ cảnh. Không cần chú thích vì nghĩa thành ngữ của תָּשׁוּב được truyền đạt đầy đủ bằng “nguôi đi” và không còn phương án mơ hồ đáng kể cần bảo lưu.
