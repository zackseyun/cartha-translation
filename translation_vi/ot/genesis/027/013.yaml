base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: vi
  text: 'Mẹ cậu nói với cậu: “Lời nguyền của con cứ để mẹ gánh, con trai mẹ. Con chỉ cần nghe lời mẹ[a], rồi đi lấy chúng[b] cho mẹ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “nghe tiếng mẹ.” Đây là một thành ngữ cũng có thể mang nghĩa “vâng lời mẹ.”'
    reason: lexical_alternative
  - marker: b
    text: “Chúng” được hiểu từ câu trước, chỉ hai dê con.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר ל/וֹ אִמּוֹ
  choice: Mẹ cậu nói với cậu
  rationale: Giữ cấu trúc tường thuật và quan hệ thân tộc; “cậu” giúp câu tiếng Việt tự nhiên, đồng thời chỉ rõ người được nói đến là Gia-cốp.
- source_word: עָלַי קִלְלָתְךָ
  choice: Lời nguyền dành cho con cứ để mẹ gánh
  rationale: עָלַי diễn tả hậu quả đặt trên hoặc do người nói chịu. Cách dịch này tự nhiên trong tiếng Việt và giữ ý Rê-bê-ca nhận lấy lời nguyền có thể giáng trên Gia-cốp, không khẳng định lời nguyền chắc chắn sẽ xảy ra.
- source_word: בְּנִי
  choice: con trai mẹ
  rationale: Giữ đại từ sở hữu và sắc thái thân tình, khẩn thiết của lời gọi trực tiếp.
- source_word: אַךְ
  choice: chỉ cần
  rationale: 'Thể hiện sắc thái hạn định và nhấn mạnh: Gia-cốp được yêu cầu tập trung làm theo lời mẹ.'
- source_word: שְׁמַע בְּקֹלִי
  choice: nghe lời mẹ
  rationale: Thành ngữ Hê-bơ-rơ nghĩa đen là “nghe tiếng mẹ” nhưng trong ngữ cảnh mang nghĩa vâng theo; “nghe lời mẹ” vừa tự nhiên vừa bảo lưu hình ảnh nghe lời.
- source_word: וְלֵךְ קַח לִי
  choice: rồi đi bắt chúng về cho mẹ
  rationale: Động từ לקח có nghĩa rộng là lấy/đem; trong ngữ cảnh trước đó, đối tượng là hai dê con còn sống nên “bắt chúng về” diễn đạt hành động tự nhiên. “Chúng” được bổ sung từ câu 12 để tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Mức độ chắc chắn và sự chuyển giao của lời nguyền
  choice: “Lời nguyền dành cho con cứ để mẹ gánh”
  alternative: “Lời nguyền của con ở trên mẹ”
  rationale: Bản dịch không giải thích lời của Rê-bê-ca như một cơ chế thần học hay bảo đảm rằng bà có quyền chuyển lời nguyền; nó chỉ thể hiện lời bà nhận chịu hậu quả thay cho con trong tình huống này.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cặp xưng hô mẹ–con phù hợp lời thoại gia đình; tránh lối dịch sát chữ gây cứng như “hãy nghe tiếng mẹ” hoặc “lời nguyền của con ở trên mẹ”.
