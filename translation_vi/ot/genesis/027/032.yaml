  to: 'Y-sác, cha ông[a], nói với ông: “Con là ai?” Ông đáp: “Con là Ê-sau, con trai đầu lòng của cha[b].”'
  rationale: Sửa các đại từ trần thuật từ “người” thành “ông” để câu văn tự nhiên, rõ nghĩa hơn trong tiếng Việt hiện đại. Giữ “nói” cho אָמַר, không diễn giải thành “hỏi,” dù lời nói có hình thức nghi vấn. Chỉnh chú thích a để phản ánh đúng cụm Hê-bơ-rơ được chú giải và đặt neo chú thích tại cụm đó.
