base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: vi
  text: 'Y-sác, cha ông[a], nói với ông: “Con là ai?” Ông đáp: “Con là Ê-sau, con trai đầu lòng của cha[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hê-bơ-rơ: “Y-sác, cha ông.” Cụm này xác định Y-sác là cha của người được nói với.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “con trai cả của cha” hoặc “trưởng nam của cha.” “Con trai đầu lòng” giữ rõ sự nhấn mạnh về thứ tự sinh, điều quan trọng trong mạch truyện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói / đáp
  rationale: Động từ אָמַר là động từ nói năng thông thường. Ở vế đầu dịch là “nói”; ở vế trả lời dùng “đáp” cho tự nhiên trong tiếng Việt mà không làm thay đổi nội dung.
- source_word: לּוֹ
  choice: với người
  rationale: Giới từ לְ kèm hậu tố ngôi ba số ít giống đực chỉ người được nói với. “Với người” duy trì cách quy chiếu trang trọng và tránh thêm tên không có trong câu.
- source_word: יִצְחָק אָבִיו
  choice: Y-sác, cha người
  rationale: Cụm Hê-bơ-rơ có trật tự sát nghĩa là “Y-sác, cha của người ấy”. Cách đặt đồng vị này tự nhiên, trang trọng trong tiếng Việt và giữ nguyên quan hệ cha con.
- source_word: מִי אַתָּה
  choice: Con là ai?
  rationale: Nghĩa trực tiếp là “Ngươi là ai?”. Vì người nói là cha và người nghe là con, đại từ “con” diễn đạt tự nhiên quan hệ giao tiếp trong tiếng Việt.
- source_word: אֲנִי
  choice: Con là
  rationale: Mệnh đề danh từ Hê-bơ-rơ không có hệ từ; tiếng Việt dùng “là”. Đại từ “con” phù hợp khi người con thưa với cha.
- source_word: בִּנְךָ
  choice: con trai của cha
  rationale: בֵּן kèm hậu tố ngôi hai giống đực số ít nghĩa là “con trai của ông/ngài”. “Của cha” thể hiện đúng quan hệ và lối xưng hô gia đình trong tiếng Việt.
- source_word: בְכֹרְךָ
  choice: đầu lòng của cha
  rationale: בְּכוֹר chỉ con trai sinh đầu, mang sắc thái thứ tự sinh và quyền trưởng nam trong mạch truyện. “Đầu lòng” giữ được trọng tâm này.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Sắc thái của בְּכוֹר trong câu tự nhận của Ê-sau
  choice: con trai đầu lòng
  alternative: con trai cả / trưởng nam
  rationale: “Con trai đầu lòng” bám sát thứ tự sinh và không tự động thu hẹp từ này thành địa vị pháp lý, dù ý nghĩa quyền trưởng nam vẫn hiện diện trong văn mạch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô cha–con theo quan hệ được nêu rõ trong câu; giữ tên Y-sác và Ê-sau theo dạng quen thuộc trong tiếng Việt. Đại từ kể chuyện “người” tránh nhầm với lời thoại nhưng vẫn duy trì sắc thái Kinh Thánh trang trọng.
