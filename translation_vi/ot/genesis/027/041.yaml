  text: וַ/יִּשְׂטֹ֤ם עֵשָׂו֙ אֶֽת יַעֲקֹ֔ב עַל הַ֨/בְּרָכָ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ אָבִ֑י/ו וַ/יֹּ֨אמֶר עֵשָׂ֜ו בְּ/לִבּ֗/וֹ יִקְרְבוּ֙ יְמֵי֙ אֵ֣בֶל אָבִ֔/י וְ/אַֽהַרְגָ֖ה אֶת יַעֲקֹ֥ב אָחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: vi
  text: 'Ê-sau căm ghét Gia-cốp vì lời chúc phước mà cha đã chúc phước cho Gia-cốp. Ê-sau tự nhủ[a]: “Những ngày để tang cha ta sắp đến[b]; bấy giờ ta sẽ giết Gia-cốp, em ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “nói trong lòng mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Những ngày cha ta than khóc sắp đến.” Cụm từ Hê-bơ-rơ có thể nói đến việc để tang Y-sác sau khi ông qua đời, hoặc thời kỳ chính Y-sác đau buồn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: căm ghét
  rationale: Động từ שׂטם diễn tả sự thù ghét sâu sắc và kéo dài. “Căm ghét” tự nhiên trong tiếng Việt, mạnh hơn một cảm xúc thoáng qua và phù hợp với ý định giết người tiếp theo.
- source_word: עַל הַבְּרָכָה
  choice: vì lời chúc phước
  rationale: עַל ở đây chỉ nguyên nhân. “Vì” diễn đạt trực tiếp lý do Ê-sau thù ghét Gia-cốp.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: mà cha đã chúc cho em mình
  rationale: Giữ sự lặp lại của gốc ברך trong “lời chúc phước… chúc”, đồng thời làm rõ đại từ chỉ Gia-cốp trong tiếng Việt và tránh hiểu lầm rằng người cha đã chúc phước cho Ê-sau.
- source_word: בְּלִבּוֹ
  choice: tự nhủ
  rationale: Đây là thành ngữ chỉ lời nói thầm trong nội tâm. “Tự nhủ” là cách diễn đạt tự nhiên của tiếng Việt; nghĩa sát chữ được ghi ở chú thích.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: Ngày để tang cha ta sắp đến
  rationale: Cách dịch này hiểu cụm sở hữu là thời gian than khóc sau cái chết của Y-sác, phù hợp với mạch văn, nhưng cấu trúc Hê-bơ-rơ vẫn có thể mang cách hiểu khác nên được chú thích.
- source_word: וְאַהַרְגָה
  choice: bấy giờ ta sẽ giết
  rationale: Dạng động từ biểu thị ý định quả quyết. “Bấy giờ” thể hiện quan hệ thời gian được ngữ cảnh hàm ý mà không làm giảm quyết tâm của Ê-sau.
- source_word: אָחִי
  choice: em ta
  rationale: Gia-cốp là em song sinh của Ê-sau. “Em ta” giữ quan hệ ruột thịt được nêu rõ trong nguyên văn và làm nổi bật bi kịch của ý định này.
theological_decisions:
- issue: Chủ thể hay đối tượng của việc than khóc trong יְמֵי אֵבֶל אָבִי
  choice: Ngày để tang cha ta sắp đến
  alternative: Những ngày cha ta than khóc sắp đến
  rationale: Nguyên văn có thể chỉ những ngày người ta than khóc cho Y-sác sau khi ông chết, hoặc thời kỳ chính Y-sác đau buồn. Bản chính chọn cách hiểu phù hợp nhất với ý định trì hoãn việc giết Gia-cốp cho đến sau cái chết của cha, đồng thời bảo tồn cách hiểu kia trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “căm ghét” để diễn tả thái độ thù địch dai dẳng; dùng lối xưng “ta” trong lời độc thoại để phù hợp văn kể Kinh Thánh. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn theo đúng thứ tự.
