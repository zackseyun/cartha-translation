  source_fidelity: 'Bản dịch bảo toàn tốt các hình ảnh và quan hệ cú pháp chính: sống nhờ gươm, phục vụ người anh em, rồi bẻ ách của người anh em khỏi cổ. Cách hiểu תָּרִיד theo hướng hành động phản kháng là có cơ sở từ mệnh đề tiếp theo, đồng thời chú thích đã giữ đúng một khả năng từ vựng thay thế.'
  naturalness: '“Con vùng thoát được” chưa tự nhiên trong tiếng Việt hiện đại: “được” thêm sắc thái thành công/khả năng không có trong động từ Hê-bơ-rơ, còn “vùng thoát” ít thông dụng. “Con vùng dậy” tự nhiên hơn và phù hợp với bước ngoặt dẫn đến hành động bẻ ách, mà không biến mệnh đề này thành việc thoát ách đã hoàn tất.'
