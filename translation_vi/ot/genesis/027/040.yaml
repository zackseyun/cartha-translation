base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: vi
  text: Con sẽ sống nhờ gươm của mình và sẽ phục vụ anh con. Nhưng khi con vùng dậy,[a] con sẽ bẻ ách của anh con khỏi cổ mình.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi con trở nên bồn chồn.” Động từ Hê-bơ-rơ תָּרִיד khó xác định; ngữ cảnh bẻ bỏ ách ủng hộ cách dịch “vùng dậy,” nhưng nghĩa “trở nên bồn chồn” cũng có thể có.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: Con sẽ sống nhờ gươm của mình
  rationale: Giới từ עַל trong kết hợp này chỉ phương tiện sinh sống; “nhờ gươm” vừa tự nhiên trong tiếng Việt vừa giữ nguyên hình ảnh cụ thể của חֶרֶב.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: và sẽ phục vụ anh mình
  rationale: Động từ עבד ở thể Qal có nghĩa trực tiếp là “phục vụ”; cách dịch này không xác định quá mức hình thức lệ thuộc về chính trị hay xã hội.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: Nhưng khi
  rationale: Cụm từ mở ra một hoàn cảnh tương lai có tính tương phản với sự phục vụ vừa được nói đến.
- source_word: תָּרִיד
  choice: con vùng thoát được
  rationale: Động từ này khó xác định; “vùng thoát” phù hợp với hành động mạnh mẽ quăng bỏ ách trong vế sau, đồng thời phương án “trở nên bồn chồn” được giữ trong chú thích.
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: con sẽ bẻ ách của anh con
  rationale: פרק diễn tả việc bẻ hoặc giật tháo ra, còn עֹל là chiếc ách và là hình ảnh của sự thống trị; “bẻ ách” giữ được sức mạnh của ẩn dụ.
- source_word: מֵעַל צַוָּארֶךָ
  choice: khỏi cổ mình
  rationale: Cách nói tự nhiên trong tiếng Việt, vẫn bảo toàn hình ảnh chiếc ách bị lấy khỏi cổ.
theological_decisions:
- issue: Bản chất mối quan hệ tương lai giữa Ê-sau và Gia-cốp
  choice: Diễn đạt sự phục vụ người anh em rồi sự vùng thoát và bẻ ách về sau, không suy diễn vượt quá câu này.
  alternative: Hiểu là sự phục dịch vĩnh viễn, hoặc giảm nhẹ thành sự nhường nhịn đơn thuần trong gia đình.
  rationale: Bản Hê-bơ-rơ đặt sự lệ thuộc và sự giải thoát về sau trong cùng một lời sấm; bản dịch cần giữ nguyên sức căng ấy mà không áp đặt kết luận giáo lý hay lịch sử rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp lời người cha nói trực tiếp với con; “anh mình/anh con” giữ quan hệ thân tộc mà không lặp đại từ nặng nề. Dấu ngoặc kép cuối câu phản ánh đây là phần kết lời nói trực tiếp trong ngữ cảnh.
