base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: vi
  text: 'Y-sác hỏi con trai mình: “Sao con tìm được nó nhanh thế, con trai ta?” Người đáp: “Vì Yahweh, Đức Chúa Trời của cha, đã khiến con gặp được nó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה זֶּה מִהַרְתָּ לִמְצֹא
  choice: Sao con tìm được nhanh thế
  rationale: Diễn đạt tự nhiên sự ngạc nhiên trong câu hỏi của Y-sác, đồng thời giữ ý ‘nhanh chóng tìm được’ của tiếng Hê-bơ-rơ.
- source_word: בְּנִי
  choice: con trai của cha
  rationale: Giữ sắc thái thân mật của danh từ kèm hậu tố ngôi thứ nhất số ít trong lời gọi trực tiếp.
- source_word: כִּי
  choice: Vì
  rationale: Mở đầu lời giải thích của Gia-cốp một cách rõ ràng và tự nhiên.
- source_word: הִקְרָה ... לְפָנָי
  choice: đã khiến con gặp được
  rationale: Động từ Hiphil diễn tả việc khiến một sự việc xảy đến; trong ngữ cảnh săn thú, ‘khiến con gặp được’ tự nhiên hơn cách dịch từng chữ ‘khiến xảy ra trước mặt con’ mà không thêm ý ‘mang đến’ vốn không có trong động từ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của cha
  rationale: 'Bảo toàn hậu tố ngôi thứ hai số ít: Gia-cốp nói ‘Đức Chúa Trời của cha’, không phải ‘Đức Chúa Trời của chúng ta’ hay ‘của con’.'
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm bảo toàn đây là danh riêng.
- issue: Sắc thái về sự tác động của Đức Chúa Trời trong הִקְרָה
  choice: đã khiến con gặp được
  alternative: đã cho con được thành công / đã đem nó đến cho con
  rationale: Giữ lực khiến khiến của động từ nhưng không tăng cường thành một tuyên bố thần học rộng hơn, cũng không gán cho động từ hành động ‘đem đến’.
- issue: Khoảng cách trong cách Gia-cốp gọi Đức Chúa Trời
  choice: Đức Chúa Trời của cha
  alternative: Đức Chúa Trời của con / Đức Chúa Trời chúng ta
  rationale: Giữ nguyên sức căng của lời kể do hậu tố ngôi thứ hai số ít tạo nên, không âm thầm hóa giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘cha/con’ trong đối thoại gia đình để truyền đạt quan hệ và sắc thái thân mật; ‘người đáp’ tránh lặp tên mà không làm mơ hồ chủ thể.
