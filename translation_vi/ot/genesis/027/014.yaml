  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: vi
  text: Vậy, Gia-cốp đi lấy hai con dê con và đem đến cho mẹ mình. Mẹ cậu làm những món ngon như cha cậu ưa thích.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Vậy, Gia-cốp đi
  rationale: Chuỗi waw liên tiếp đẩy câu chuyện tiến tới; “Vậy” diễn đạt tự nhiên quan hệ tiếp nối với lời dặn ở câu trước. Tên Gia-cốp được nêu để tiếng Việt rõ chủ thể.
- source_word: וַיִּקַּח
  choice: bắt hai con dê con
  rationale: Động từ có nghĩa cơ bản là “lấy”; đối tượng được lược trong câu Hê-bơ-rơ nhưng được xác định rõ ở câu 13 là hai con dê con. Trong ngữ cảnh lấy súc vật từ đàn, “bắt” là cách nói tự nhiên.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: đem về cho mẹ
  rationale: בוא ở dạng Hifil với ל diễn tả việc đem vật đến cho mẹ. “Đem về” phù hợp ngữ cảnh Gia-cốp trở lại chỗ mẹ, còn “cho mẹ” thể hiện đích/người tiếp nhận.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: rồi mẹ cậu làm
  rationale: עשה là “làm/chế biến”; với món ăn, “làm” tự nhiên, gọn và không thêm chi tiết ngoài nguyên văn.
- source_word: מַטְעַמִּים
  choice: những món ngon
  rationale: Danh từ số nhiều chỉ các món ăn ngon, được chế biến hợp khẩu vị. “Những món ngon” vừa giữ sắc thái số nhiều vừa là tiếng Việt hiện đại, dễ hiểu.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: đúng như cha cậu ưa thích
  rationale: כַּאֲשֶׁר mang ý so sánh “như/đúng như”; אהב theo nghĩa đen là “yêu”, nhưng khi nói về món ăn, “ưa thích” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “mẹ cậu/cha cậu” để duy trì điểm quy chiếu về Gia-cốp, tránh đại từ “ông” có thể khiến độc giả hiểu nhầm là nói về một người lớn tuổi khác. Không cần chú thích vì các lựa chọn theo ngữ cảnh không tạo khác biệt đáng kể về nghĩa.
