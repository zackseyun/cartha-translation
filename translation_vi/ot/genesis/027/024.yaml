base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/024.yaml
  text: He said[a], “Are you really my son Esau?” And he said, “I am.”
translation:
  language: vi
  text: 'Ông hỏi[a]: “Con có phải chính là Ê-sau, con trai cha không?” Người đáp: “Con đây.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ theo sát: “Con có phải là người này, con trai ta, Ê-sau không?” Cấu trúc đại từ đi với từ chỉ định nhấn mạnh việc xác nhận danh tính.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ông hỏi
  rationale: Động từ אמר cơ bản là “nói”, nhưng ở đây câu trực tiếp là một câu hỏi; “ông hỏi” diễn đạt tự nhiên chức năng của lời nói mà không thêm nội dung.
- source_word: אַתָּה זֶה
  choice: có thật là
  rationale: Đại từ độc lập kết hợp với từ chỉ định tạo sắc thái nhấn mạnh việc xác nhận danh tính. “Có thật là” truyền đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: בְּנִי עֵשָׂו
  choice: Ê-sau, con trai cha
  rationale: Giữ tên riêng và quan hệ thân thuộc; chuyển “con trai của cha” về sau tên riêng giúp câu hỏi tiếng Việt rõ và tự nhiên.
- source_word: וַיֹּאמֶר
  choice: Người đáp
  rationale: אמר được diễn đạt theo chức năng đối thoại là “đáp”; dùng “người” tránh lặp đại từ dễ gây nhập nhằng trong cảnh có hai nhân vật nam.
- source_word: אָֽנִי
  choice: Chính con
  rationale: Đại từ độc lập là lời tự nhận ngắn gọn. Trong lời con nói với cha, “chính con” vừa tự nhiên vừa giữ sắc thái xác nhận nhấn mạnh.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cách xưng hô “con—cha” phù hợp quan hệ giữa Gia-cốp và Y-sác; không làm nhẹ đi lời tự nhận dối trá trong mạch truyện.
