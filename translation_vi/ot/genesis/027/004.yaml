revisions:
- from: Hãy làm cho cha một món ăn ngon[a] đúng như cha thích, rồi mang đến cho cha để cha ăn, hầu cho chính lòng cha[b] chúc phước cho con trước khi cha qua đời.
  to: Hãy làm cho cha những món ăn ngon[a] như cha thích, rồi mang đến cho cha để cha ăn, hầu cho cha[b] chúc phước cho con trước khi cha chết.
  rationale: Bản sửa giữ chuỗi “để … hầu cho …” của nguyên văn, dùng “cha” trong chính văn để chuyển đạt tự nhiên thành ngữ נַפְשִׁי, và bảo lưu đặc điểm từ vựng cùng ý nghĩa toàn thể-ngôi-vị trong chú thích. Đồng thời, số nhiều của “những món ăn ngon” và động từ trực tiếp “chết” sát nguồn hơn.
