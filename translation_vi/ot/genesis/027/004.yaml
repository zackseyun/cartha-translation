  text: וַ/עֲשֵׂה לִ֨/י מַטְעַמִּ֜ים כַּ/אֲשֶׁ֥ר אָהַ֛בְתִּי וְ/הָבִ֥יאָ/ה לִּ֖/י וְ/אֹכֵ֑לָה בַּ/עֲב֛וּר תְּבָרֶכְ/ךָ֥ נַפְשִׁ֖/י בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: vi
  text: Hãy làm cho cha những món ăn ngon[a] như cha thích, rồi mang đến cho cha để cha ăn, hầu cho cha[b] chúc phước cho con trước khi cha chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “món ăn đậm đà” hoặc “món ngon”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ theo nghĩa đen: “linh hồn/sinh mạng cha chúc phước cho con”; đây là thành ngữ chỉ chính I-sác trong toàn thể con người mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: Hãy làm cho cha một món ăn ngon
  rationale: Trong ngữ cảnh nấu nướng, עשה được diễn đạt tự nhiên là “làm”, còn מַטְעַמִּים chỉ món ăn được chế biến thơm ngon, hợp khẩu vị. Cách xưng hô “cha—con” được suy ra rõ từ quan hệ I-sác và Ê-sau trong văn cảnh tiếng Hê-bơ-rơ.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: đúng như cha thích
  rationale: Động từ אָהַב có nghĩa cơ bản là “yêu/thích”; đối với món ăn, “thích” là tiếng Việt tự nhiên và vẫn giữ ý sở thích riêng của I-sác.
- source_word: וְהָבִיאָה לִּי
  choice: rồi mang đến cho cha
  rationale: Diễn tả trực tiếp mệnh lệnh đem món ăn đến chỗ người nói; “rồi” làm rõ trình tự hành động của các mệnh đề nối bằng waw.
- source_word: וְאֹכֵלָה
  choice: để cha ăn
  rationale: Dạng cohortative diễn tả hành động I-sác mong muốn thực hiện sau khi thức ăn được mang đến. “Để cha ăn” giữ được sắc thái mục đích mà không biến thành một lời khẳng định tương lai đơn thuần.
- source_word: בַּעֲבוּר
  choice: hầu cho
  rationale: Từ này mở đầu mệnh đề mục đích. “Hầu cho” phân biệt mục đích sau cùng với mệnh đề gần “để cha ăn”, đồng thời phù hợp văn phong trang trọng.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: chính lòng cha chúc phước cho con
  rationale: Giữ נַפְשִׁי làm chủ ngữ thay vì giản lược thành “cha”, nhưng dùng “lòng” tự nhiên hơn “linh hồn” trong thành ngữ tiếng Việt và biểu đạt chính con người I-sác với ý chí, tình cảm trọn vẹn. “Chính” nhấn mạnh sắc thái tự thân mà cách nói này hàm chứa.
- source_word: בְּטֶרֶם אָמוּת
  choice: trước khi cha qua đời
  rationale: “Qua đời” là cách diễn đạt hiện đại, trang trọng và chính xác cho cái chết của người nói trong ngữ cảnh gia đình.
theological_decisions:
- issue: Ý nghĩa của נֶפֶשׁ trong lời chúc phước
  choice: Giữ hình ảnh bằng cụm “chính lòng cha”
  alternative: “cha sẽ chúc phước cho con” hoặc “linh hồn cha chúc phước cho con”
  rationale: Bản dịch không giản lược chủ ngữ נַפְשִׁי thành đại từ “cha”, cũng không áp đặt quan niệm nhị nguyên về một “linh hồn” tách khỏi thân thể. “Lòng” giữ lực cá nhân toàn vẹn của thành ngữ, còn chú thích nêu rõ nghĩa đen.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng lối xưng hô cha—con phù hợp quan hệ gia đình trong văn cảnh. Hai liên từ mục đích “để… hầu cho…” phản ánh chuỗi mục đích của nguyên văn mà vẫn tránh lặp nặng nề; các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
