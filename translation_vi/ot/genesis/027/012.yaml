- from: Biết đâu cha con sẽ sờ con[a], rồi trong mắt cha, con sẽ như kẻ lừa dối[b]; như thế, con sẽ chuốc lấy lời nguyền chứ không phải phước lành.”
  to: Biết đâu cha con sẽ sờ vào con[a], rồi cha sẽ cho rằng con là kẻ lừa dối[b]; như thế, con sẽ chuốc lấy lời nguyền chứ không phải phước lành.”
  rationale: Chỉnh nhẹ để thành ngữ Hê-bơ-rơ về sự đánh giá “trong mắt cha” được chuyển sang tiếng Việt tự nhiên mà không mất nghĩa, cải thiện cách diễn đạt hành động xúc giác, và làm chú thích phổ thông, rõ ràng hơn. Không thay đổi nội dung hay áp đặt cách hiểu thần học.
