  text: אוּלַ֤י יְמֻשֵּׁ֨/נִי֙ אָבִ֔/י וְ/הָיִ֥יתִי בְ/עֵינָ֖י/ו כִּ/מְתַעְתֵּ֑עַ וְ/הֵבֵאתִ֥י עָלַ֛/י קְלָלָ֖ה וְ/לֹ֥א בְרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: vi
  text: Biết đâu cha con sẽ sờ vào con[a], rồi cha sẽ cho rằng con là kẻ lừa dối[b]; như thế, con sẽ chuốc lấy lời nguyền chứ không phải phước lành.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chạm vào con.” Động từ Hê-bơ-rơ chỉ việc dùng tay sờ để nhận biết, phù hợp với việc Y-sác cố nhận ra Gia-cốp bằng xúc giác.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “kẻ chế nhạo” hoặc “kẻ giở trò lừa gạt.” Từ Hê-bơ-rơ có thể chỉ người đánh lừa người khác hoặc biến người ấy thành trò cười.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Biết đâu
  rationale: Diễn đạt tự nhiên nỗi lo về một khả năng chưa chắc xảy ra, giữ nguyên sắc thái bất định của tiếng Hê-bơ-rơ.
- source_word: יְמֻשֵּׁנִי
  choice: sẽ sờ con
  rationale: Động từ משש chỉ việc dùng tay sờ để nhận biết; lựa chọn này phù hợp với việc Y-sác kiểm tra căn tính của Gia-cốp bằng xúc giác.
- source_word: אָבִי
  choice: cha con
  rationale: Đại từ sở hữu được diễn đạt theo lối xưng hô tự nhiên trong lời Gia-cốp nói với mẹ mình.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: rồi trong mắt cha, con sẽ như
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ “trong mắt người ấy” mà vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: כִּמְתַעְתֵּעַ
  choice: kẻ lừa dối
  rationale: Trong văn cảnh, phân từ này chỉ người đánh lừa hoặc khiến người khác mắc lừa; bản dịch chính phản ánh trực tiếp nỗi sợ bị phát hiện đang gian dối, trong khi chú thích bảo tồn khả năng hiểu là chế nhạo hay giễu cợt.
- source_word: וְהֵבֵאתִי עָלַי
  choice: con sẽ chuốc lấy
  rationale: Diễn đạt tự nhiên cấu trúc khiến cho điều gì giáng trên chính mình.
- source_word: קְלָלָה
  choice: lời nguyền
  rationale: Cách dịch thông dụng và tương phản trực tiếp với phước lành trong câu.
- source_word: וְלֹא בְרָכָה
  choice: chứ không phải phước lành
  rationale: Thể hiện rõ sự đối lập trong nguyên văn bằng một cấu trúc tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng cách xưng hô “cha/con” phù hợp với lời Gia-cốp nói với mẹ về cha mình; giữ thành ngữ “trong mắt cha” để bảo tồn hình ảnh nguyên văn. Dấu ngoặc kép cuối câu cho thấy đây là lời thoại trong văn cảnh rộng hơn.
