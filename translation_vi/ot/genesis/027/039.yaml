base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: vi
  text: 'Cha ông là Y-sác đáp lời ông[a]: “Này, nơi con ở sẽ cách xa sự màu mỡ của đất, và cách xa sương từ trời cao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Này, nơi con ở sẽ từ sự màu mỡ của đất và từ sương trời ở trên cao.” Giới từ Hê-bơ-rơ ở đây có thể được hiểu theo nghĩa tích cực (“từ/của”) hoặc nghĩa phân cách (“cách xa”).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: đáp lời
  rationale: Động từ ענה trong lời kể thường giới thiệu lời đáp; “đáp lời” giữ cấu trúc đối thoại trang trọng mà vẫn tự nhiên.
- source_word: יִצְחָק אָבִיו
  choice: Y-sác, cha ông
  rationale: Giữ cả tên riêng và quan hệ thân thuộc như tiếng Hê-bơ-rơ; cách đặt đồng vị này rõ nghĩa trong tiếng Việt.
- source_word: הִנֵּה
  choice: Này
  rationale: Dùng như từ báo hiệu trang trọng, kêu gọi người nghe chú ý đến lời tuyên bố tiếp theo.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: cách xa sự màu mỡ của đất
  rationale: שְׁמַנִּים chỉ sự phì nhiêu, màu mỡ; מִן được hiểu theo nghĩa phân cách trong mạch văn, nhưng cách hiểu tích cực được bảo lưu ở chú thích.
- source_word: מוֹשָׁבֶךָ
  choice: nơi con ở
  rationale: Diễn đạt tự nhiên nghĩa nơi cư trú của מוֹשָׁב, đồng thời dùng “con” phù hợp với lời cha nói trực tiếp với con.
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: và cách xa sương trời
  rationale: מִן được hiểu nhất quán theo nghĩa phân cách; “sương trời” là cách diễn đạt gọn và tự nhiên.
- source_word: מֵעָל
  choice: từ trên cao
  rationale: Giữ sắc thái không gian của cụm từ, chỉ sương từ trời ở phía trên.
theological_decisions:
- issue: Nghĩa của giới từ מִן trong lời Y-sác nói với Ê-sau
  choice: 'Hiểu theo nghĩa phân cách: “cách xa” sự màu mỡ của đất và sương trời'
  alternative: 'Hiểu theo nghĩa nguồn gốc hoặc hưởng phần: “nhờ sự màu mỡ của đất và nhờ sương trời”'
  rationale: Bối cảnh lời dành cho Ê-sau sau khi phước lành chính đã thuộc về Gia-cốp hỗ trợ nghĩa phân cách. Tuy nhiên, ngữ pháp Hê-bơ-rơ cũng cho phép cách hiểu tích cực, nên không loại bỏ mà ghi rõ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “ông” trong lời kể để chỉ Ê-sau và “con” trong lời nói trực tiếp của người cha; bảo lưu sự mơ hồ thực sự của giới từ Hê-bơ-rơ bằng chú thích.
