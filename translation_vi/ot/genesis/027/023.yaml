  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: vi
  text: Ông không nhận ra cậu, vì hai tay cậu đầy lông giống như tay của Ê-sau, anh cậu; vì thế ông chúc phước cho cậu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch vế cuối: “và ông chúc phước cho cậu.” Dạng kể chuyện trong tiếng Hê-bơ-rơ có thể chỉ đơn thuần diễn tả sự tiếp nối, dù ở đây cũng hàm ý kết quả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: không nhận ra cậu
  rationale: Động từ נכר ở thể Hifil trong ngữ cảnh này có nghĩa là nhận ra hoặc nhận diện. Đại từ “cậu” chỉ Gia-cốp và giúp diễn đạt tự nhiên quan hệ cha-con trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: כִּי nêu nguyên nhân khiến Y-sác không nhận ra Gia-cốp; “vì” là liên từ nhân quả tự nhiên và rõ ràng.
- source_word: יָדָיו
  choice: hai tay cậu
  rationale: Danh từ số đôi/số nhiều có hậu tố ngôi ba số ít chỉ tay của Gia-cốp. “Hai tay” tự nhiên trong tiếng Việt và phù hợp với hành động sờ tay ở ngữ cảnh.
- source_word: כִּידֵי עֵשָׂו אָחִיו
  choice: giống như tay Ê-sau, anh cậu
  rationale: Tiền tố כ־ biểu thị sự so sánh. Cụm đồng vị “Ê-sau, anh cậu” giữ nguyên quan hệ thân tộc và tránh cách diễn đạt nặng nề.
- source_word: שְׂעִרֹת
  choice: đầy lông
  rationale: Tính từ mô tả cảm giác khi sờ tay. “Đầy lông” tự nhiên hơn “rậm lông” khi nói về bàn tay và vẫn truyền đạt đặc điểm then chốt của sự đánh lừa.
- source_word: וַיְבָרְכֵהוּ
  choice: vì thế ông chúc phước cho cậu
  rationale: Dạng kể chuyện với waw tiếp nối diễn tiến. “Vì thế” thể hiện quan hệ kết quả hàm ý trong ngữ cảnh, còn “chúc phước” giữ sắc thái trang trọng và ý nghĩa của ברך.
theological_decisions:
- issue: Quan hệ giữa việc Y-sác không nhận ra Gia-cốp và việc chúc phước
  choice: vì thế ông chúc phước cho cậu
  alternative: và ông chúc phước cho cậu
  rationale: Waw kể chuyện có thể chỉ trình tự đơn thuần, nhưng trong ngữ cảnh cũng hàm ý kết quả. Bản chính dùng “vì thế” để diễn đạt mạch nhân quả, đồng thời chú thích bảo tồn cách hiểu tuần tự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông/cậu” để các đại từ có chủ thể rõ trong câu trích riêng lẻ; tên riêng theo dạng Việt hóa quen dùng “Ê-sau”. Marker [a] được đặt sau mệnh đề “không nhận ra cậu”, tương ứng với điểm nơi cách nối diễn tiến dẫn đến vế cuối cần được chú giải.
