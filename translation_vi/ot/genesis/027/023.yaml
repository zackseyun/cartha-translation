  terminology: «Chúc phước» là cách dùng trang trọng, phù hợp với ברך trong ngữ cảnh này. «Ê-sau» và «Gia-cốp» theo dạng Việt hóa quen dùng. Không cần nêu tên Y-sác/Gia-cốp trong câu vì các đại từ vẫn rõ từ ngữ cảnh đoạn văn.
