  source_fidelity: 'Bản dịch chuyển đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: Y-sác không nhận ra Gia-cốp, vì tay của ông ấy giống tay đầy lông của Ê-sau, anh của Gia-cốp, rồi Y-sác chúc phước cho Gia-cốp. Tuy nhiên, chú thích về cách hiểu liên từ của וַיְבָרֲכֵהוּ phải được neo tại vế cuối, không phải sau «cậu» trong mệnh đề đầu.'
