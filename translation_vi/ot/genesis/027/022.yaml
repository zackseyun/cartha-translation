base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: vi
  text: 'Gia-cốp đến gần Y-sác, cha mình. Y-sác sờ Gia-cốp rồi nói: “Giọng là giọng Gia-cốp, nhưng tay là tay Ê-sau.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: đến gần
  rationale: Động từ נגשׁ ở thể qal chỉ việc tiến hoặc đến gần; “đến gần” tự nhiên trong mạch kể và giữ rõ chuyển động.
- source_word: וַיְמֻשֵּׁהוּ
  choice: sờ người
  rationale: Động từ מושׁ ở đây nói đến việc Y-sác dùng xúc giác để kiểm tra người trước mặt; “sờ” diễn đạt rõ hành động nhận biết bằng tay hơn “chạm”.
- source_word: הַקֹּל
  choice: giọng
  rationale: Trong ngữ cảnh nhận diện người đang nói, קוֹל mang nghĩa “giọng”; cách chọn này tự nhiên và chính xác hơn “âm thanh”.
- source_word: קוֹל יַעֲקֹב
  choice: giọng Gia-cốp
  rationale: Cụm liên thuộc được chuyển tự nhiên sang tiếng Việt, vẫn bảo toàn sự nhận diện giọng nói là của Gia-cốp.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: nhưng đôi tay lại là tay Ê-sau
  rationale: Từ nối “nhưng” và phó từ “lại” làm rõ sự tương phản vốn hàm chứa giữa bằng chứng từ giọng nói và từ xúc giác; “đôi tay” phản ánh hình thức số đôi הַיָּדַיִם.
- source_word: אָבִיו
  choice: cha mình là Y-sác
  rationale: Giữ lại quan hệ cha con được nêu rõ trong tiếng Hê-bơ-rơ, đồng thời sắp xếp theo cú pháp tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ phép lặp “giọng… giọng” và “tay… tay” để bảo toàn sức nhấn của nguyên văn; không thêm chú thích vì bản dịch trực tiếp thể hiện đầy đủ cấu trúc và ý nghĩa câu.
