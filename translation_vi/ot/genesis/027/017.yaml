  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: vi
  text: Rồi bà đặt các món ngon cùng bánh mì mà bà đã làm vào tay Gia-cốp, con trai bà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “vào tay Gia-cốp, con trai bà,” một thành ngữ có nghĩa là bà trực tiếp trao cho ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Rồi bà trao
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; động từ נתן với בְּיַד diễn tả việc trao trực tiếp vào tay. “Rồi bà trao” tự nhiên trong tiếng Việt và giữ rõ hành động.
- source_word: הַמַּטְעַמִּים
  choice: các món ngon
  rationale: Danh từ số nhiều chỉ những món ăn ngon được chuẩn bị đặc biệt trong văn cảnh. Cách dịch này hiện đại, tự nhiên và không xác định quá mức loại thức ăn.
- source_word: הַלֶּחֶם
  choice: bánh
  rationale: לֶחֶם ở đây chỉ bánh làm thức ăn; “bánh” là cách gọi gọn và tự nhiên trong tiếng Việt.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: bà đã làm
  rationale: Giữ nghĩa trực tiếp của עשה và dùng “đã” để cho thấy việc làm thức ăn xảy ra trước hành động trao.
- source_word: בְּיַד
  choice: vào tay
  rationale: Giữ hình ảnh cụ thể và số ít của thành ngữ Hê-bơ-rơ, đồng thời vẫn rõ nghĩa trong tiếng Việt.
- source_word: יַעֲקֹב בְּנָהּ
  choice: Gia-cốp, con trai mình
  rationale: Giữ thứ tự tên rồi đến quan hệ như nguyên văn; “mình” quy chiếu tự nhiên về chủ ngữ là người mẹ.
