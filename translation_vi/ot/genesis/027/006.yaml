  terminology: Các tên Rê-bê-ca, Gia-cốp và Ê-sau nhất quán với lối phiên âm Kinh Thánh tiếng Việt. “Cha con” và “anh con” phù hợp văn cảnh gia đình; “anh con” cũng phù hợp với địa vị người anh của Ê-sau trong câu chuyện.
