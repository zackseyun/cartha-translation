  source_fidelity: 'Bản dịch chuyển tải đầy đủ mạch cú pháp Híp-ri: Rê-bê-ca nói với Gia-cốp, nhấn mạnh điều bà đã nghe, xác định người cha và Ê-sau là anh của Gia-cốp, rồi dẫn vào lời thuật lại tiếp tục ở câu 7. “đã nghe” phản ánh hợp lý thì hoàn thành; “nói với” phản ánh מְדַבֵּר אֶל. Việc không dịch liên từ mở đầu וְ là tự nhiên trong tiếng Việt.'
