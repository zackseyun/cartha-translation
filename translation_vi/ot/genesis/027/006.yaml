  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: vi
  text: 'Rê-bê-ca nói với Gia-cốp, con trai bà: “Này, mẹ đã nghe cha con nói với Ê-sau, anh con, rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרִבְקָה
  choice: Rê-bê-ca
  rationale: Không dịch liên từ וְ riêng biệt ở đầu câu vì tiếng Việt tự nhiên có thể tiếp nối mạch kể mà không cần “và”; tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: אָמְרָה אֶל יַעֲקֹב בְּנָהּ
  choice: nói với Gia-cốp, con trai bà
  rationale: 'Giữ rõ quan hệ đồng vị: Gia-cốp chính là con trai của Rê-bê-ca; cách diễn đạt này tự nhiên và trang trọng trong tiếng Việt hiện đại.'
- source_word: לֵאמֹר
  choice: ': “'
  rationale: Ở lần xuất hiện thứ nhất, từ dẫn lời được thể hiện tự nhiên bằng dấu hai chấm và dấu mở ngoặc kép.
- source_word: הִנֵּה
  choice: Này
  rationale: “Này” làm từ thu hút sự chú ý, tự nhiên hơn “Kìa” trong ngữ cảnh người nói báo lại điều mình đã nghe.
- source_word: שָׁמַעְתִּי
  choice: mẹ đã nghe
  rationale: Thể hoàn thành được diễn đạt bằng “đã nghe”. Đại từ theo vai giao tiếp mẹ–con giúp lời thoại tự nhiên trong tiếng Việt mà không thay đổi người nói.
- source_word: אֶת אָבִיךָ
  choice: cha con
  rationale: Thể hiện đúng quan hệ “cha của con” theo cách xưng hô gia đình tự nhiên trong tiếng Việt.
- source_word: מְדַבֵּר אֶל עֵשָׂו אָחִיךָ
  choice: nói với Ê-sau, anh con
  rationale: Phân từ מְדַבֵּר được diễn đạt bằng “nói”, còn אֶל giữ hướng lời nói là “với”; cụm đồng vị “anh con” được giữ lại.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Lần xuất hiện thứ hai dẫn vào lời của Y-sác được trích lại ở câu kế tiếp; “rằng:” vừa giữ chức năng dẫn lời vừa tạo sự chuyển tiếp rõ ràng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, sử dụng lối xưng hô gia đình tự nhiên “mẹ–con”. Câu được để mở sau dấu hai chấm vì lời Rê-bê-ca trích dẫn tiếp tục ở Sáng Thế Ký 27:7.
