  text: וַ/יִּגַּשׁ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יָּ֛רַח אֶת רֵ֥יחַ בְּגָדָ֖י/ו וַֽ/יְבָרֲכֵ֑/הוּ וַ/יֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔/י כְּ/רֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: vi
  text: 'Gia-cốp bèn đến gần và hôn ông. I-sác ngửi mùi quần áo của Gia-cốp, rồi chúc phước cho người và nói: “Kìa, mùi của con trai ta như mùi của một cánh đồng mà Yahweh đã ban phước.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Vậy, người đến gần
  rationale: Động từ tự sự diễn tả việc Gia-cốp tiến lại gần; “Vậy” nối tự nhiên với lời yêu cầu ngay trước đó.
- source_word: וַיִּשַּׁק לוֹ
  choice: và hôn ông
  rationale: Giữ hành động đơn giản của nguyên văn, không thêm sắc thái tình cảm vốn không được nói rõ.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: I-sác ngửi mùi áo của người
  rationale: “Ngửi mùi” vừa tự nhiên trong tiếng Việt vừa giữ danh từ רֵיחַ; nêu “I-sác” để tránh mơ hồ giữa hai đại từ nam trong tiếng Việt.
- source_word: בְּגָדָיו
  choice: áo của người
  rationale: Trong ngữ cảnh, quần áo của Ê-sau đang được mặc trên Gia-cốp; “áo” là cách diễn đạt gọn, tự nhiên cho danh từ số nhiều tập hợp.
- source_word: וַיְבָרֲכֵהוּ
  choice: rồi chúc phước cho người
  rationale: Diễn đạt trực tiếp động từ ברך và giữ đúng đối tượng của lời chúc phước.
- source_word: רְאֵה
  choice: Kìa
  rationale: Mệnh lệnh này hoạt động như từ gọi sự chú ý; “Kìa” tự nhiên hơn “Hãy xem” khi đối tượng được nhận biết bằng khứu giác.
- source_word: רֵיחַ בְּנִי
  choice: mùi của con trai ta
  rationale: Giữ danh từ “mùi” để tái hiện sự lặp từ רֵיחַ trong câu.
- source_word: כְּרֵיחַ שָׂדֶה
  choice: như mùi cánh đồng
  rationale: Giữ phép so sánh và nghĩa thông thường của שָׂדֶה; “cánh đồng” tự nhiên, giàu hình ảnh trong tiếng Việt.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: được Yahweh ban phước
  rationale: Cấu trúc bị động tự nhiên trong tiếng Việt, diễn tả cánh đồng ở trong tình trạng nhận phước lành từ Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn danh riêng và không thay bằng tước hiệu.
- issue: Danh tính người được chúc phước trong cách dùng đại từ
  choice: Dùng “người” cho Gia-cốp và nêu rõ “I-sác” ở mệnh đề ngửi mùi
  alternative: Lặp tên “Gia-cốp” hoặc dùng liên tiếp “ông/anh”
  rationale: Nguyên văn dùng hậu tố đại từ và không gọi tên Gia-cốp; cách này giữ góc nhìn tự sự trong lúc hạn chế sự nhập nhằng tiếng Việt, đồng thời không làm mất tình trạng I-sác tưởng người trước mặt là Ê-sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Giữ ba lần dùng “mùi” tương ứng với sự lặp lại của רֵיחַ trong nguyên văn. Dùng “chúc phước/ban phước” để phân biệt lời chúc của I-sác với phước lành Yahweh dành cho cánh đồng.
