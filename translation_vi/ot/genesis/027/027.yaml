  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các hành động trong tiếng Hê-bơ-rơ: Gia-cốp đến gần, hôn I-sác; I-sác ngửi mùi quần áo, chúc phước và nói. Tuy nhiên, “áo” làm thu hẹp danh từ số nhiều בְּגָדָיו (“quần áo/y phục”), và chuỗi đại từ “người/ông” có thể gây khó theo dõi trong tiếng Việt.'
