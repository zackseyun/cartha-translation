  rationale: Sửa lực ngữ pháp của hai vế mở đầu để phản ánh chính xác lời chúc phước. Đồng thời chỉnh thuật ngữ ngữ pháp trong chú thích b và làm chú thích a tự nhiên, chính xác hơn. Không thay đổi ý nghĩa hay áp đặt cách hiểu giáo phái.
