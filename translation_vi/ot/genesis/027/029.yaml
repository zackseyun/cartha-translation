  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: vi
  text: 'Nguyện các dân phục vụ con,

    các nước phủ phục trước con.[a]


    Hãy làm chủ anh em con;

    các con trai của mẹ con hãy phủ phục trước con.


    Kẻ nguyền rủa con sẽ bị nguyền rủa,

    còn người chúc phước cho con sẽ được ban phước.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bày tỏ lòng tôn kính với con.” Động từ Hê-bơ-rơ chỉ hành động cúi mình hoặc sấp mình trước người có địa vị cao hơn, là người hoặc Đức Chúa Trời; ở đây văn cảnh nghiêng về sự thần phục một người hơn là sự thờ phượng.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát cấu trúc Hê-bơ-rơ: “Kẻ nguyền rủa con, bị nguyền rủa; người chúc phước cho con, được ban phước.” Các phân từ chỉ người ở nguyên ngữ có hình thức số nhiều nhưng đi với vị ngữ số ít mang ý nghĩa tập thể.'
    reason: grammar_clarification
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: hãy phục vụ con
  rationale: Động từ עבד ở thể Qal với hậu tố ngôi hai số ít giống đực chỉ sự phục vụ và quy phục. “Phục vụ con” tự nhiên, đồng thời giữ được phạm vi nghĩa rộng của từ.
- source_word: עַמִּים
  choice: các dân
  rationale: Danh từ số nhiều chỉ các cộng đồng hay nhóm dân; “các dân” giữ sắc thái tập thể và tạo thế song song với “các nước” ở vế sau.
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: hãy phủ phục trước con
  rationale: Động từ השתחוה diễn tả hành động cúi mình hoặc sấp mình trước một đấng bề trên. “Phủ phục trước” giữ hình ảnh cụ thể mà không mặc nhiên biến hành động này thành sự thờ phượng.
- source_word: לְאֻמִּים
  choice: các nước
  rationale: Đây là từ gần nghĩa với עַמִּים trong kết cấu thi ca. “Các nước” vừa tự nhiên vừa giữ sự biến đổi từ ngữ giữa hai vế song song.
- source_word: הֱוֵה גְבִיר
  choice: hãy làm chủ
  rationale: הֱוֵה cùng danh từ vị ngữ tạo lời truyền chúc “hãy là/hãy trở thành”; גְּבִיר chỉ người có địa vị làm chủ hoặc cai quản. Cách dịch này phù hợp quan hệ gia đình và tránh dùng một danh xưng thần thánh.
- source_word: לְאַחֶיךָ
  choice: anh em con
  rationale: Trong kết cấu với גְּבִיר, giới từ לְ biểu thị những người ở dưới quyền. Tiếng Việt có thể diễn đạt tự nhiên bằng “làm chủ anh em con” mà không cần thêm “trên”.
- source_word: בְּנֵי אִמֶּךָ
  choice: các con trai của mẹ con
  rationale: Giữ nguyên cách nói thân tộc cụ thể của tiếng Hê-bơ-rơ, không đồng nhất hoàn toàn với từ “anh em” ở vế trước.
- source_word: אֹרְרֶיךָ אָרוּר
  choice: kẻ nguyền rủa con sẽ bị nguyền rủa
  rationale: Cấu trúc phân từ số nhiều đi với vị ngữ số ít mang ý nghĩa tập thể. Tiếng Việt dùng số ít khái quát “kẻ” để bảo toàn sự tương ứng và giọng văn trang trọng.
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: còn người chúc phước cho con sẽ được ban phước
  rationale: Giữ cấu trúc đối xứng với lời nguyền rủa. “Chúc phước” chỉ hành động nói lời phước lành; “được ban phước” chỉ việc chính người ấy nhận phước.
theological_decisions:
- issue: Ngôn ngữ phủ phục hướng đến một nhân vật con người
  choice: phủ phục trước con
  alternative: thờ lạy con; bày tỏ lòng tôn kính với con
  rationale: Động từ Hê-bơ-rơ có thể chỉ sự phủ phục trước Đức Chúa Trời hoặc trước con người. Trong lời chúc phước của Y-sác, văn cảnh nói đến quyền thế giữa các dân và trong gia đình; bản dịch giữ hành động cụ thể nhưng không áp đặt ý nghĩa thờ phượng.
- issue: Sắc thái của גְּבִיר trong quan hệ gia đình
  choice: làm chủ anh em con
  alternative: làm chúa trên anh em con; cai trị anh em con
  rationale: Từ này diễn tả địa vị vượt trội và quyền làm chủ. “Làm chủ” giữ được sức nặng của lời chúc phước mà không gây nhầm lẫn với tước hiệu dành cho Đức Chúa Trời.
translation_notes:
  register: Văn phong thi ca, trang trọng nhưng hiện đại. Dùng “con” vì đây là lời người cha trực tiếp chúc phước cho con trai. Các mệnh đề được ngắt dòng để làm rõ thế song song của thơ Hê-bơ-rơ; “phủ phục” bảo toàn hình ảnh thân thể cụ thể và tránh hàm ý thờ phượng không tất yếu trong văn cảnh.
