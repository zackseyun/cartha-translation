  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: vi
  text: Rồi con hãy mang món ấy đến cho cha con; cha sẽ ăn, để cha chúc phước cho con trước khi cha qua đời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Rồi con hãy mang
  rationale: Dạng động từ ngôi hai số ít giống đực có liên từ, nằm trong chuỗi chỉ dẫn. “Rồi… hãy mang” diễn đạt tự nhiên cả trình tự lẫn sắc thái mệnh lệnh trong tiếng Việt.
- source_word: לְאָבִיךָ
  choice: đến cho cha con
  rationale: אָב kèm hậu tố ngôi hai số ít là “cha con”. Trong cấu trúc tiếng Việt, “mang… đến cho cha con” tự nhiên và làm rõ người nhận món ăn.
- source_word: וְאָכָל
  choice: ăn
  rationale: Động từ nối tiếp hành động mang đến, với chủ thể là người cha. Gộp thành “cho cha con ăn” là cách diễn đạt tự nhiên, vẫn giữ đúng diễn tiến dự kiến của kế hoạch.
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: để
  rationale: Cụm này nêu mục đích. “Để” là từ nối mục đích rõ ràng, gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: יְבָרֶכְךָ
  choice: cha chúc phước cho con
  rationale: Piel chưa hoàn thành ngôi ba số ít giống đực với hậu tố ngôi hai số ít. Lặp lại “cha” giúp chủ thể của mệnh đề mục đích rõ ràng; “chúc phước” giữ sắc thái của lời chúc phước gia trưởng trong ngữ cảnh.
- source_word: לִפְנֵי מוֹתוֹ
  choice: trước khi qua đời
  rationale: Nghĩa sát là “trước cái chết của ông ấy”. “Trước khi qua đời” trang trọng, tự nhiên hơn trong tiếng Việt và không thay đổi ý nghĩa thời gian.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cách xưng hô “cha–con” phù hợp lời người mẹ nói với con về người cha; giữ trực tiếp mục đích của kế hoạch mà không thêm lời đánh giá thần học.
