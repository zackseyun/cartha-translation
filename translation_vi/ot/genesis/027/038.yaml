base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: vi
  text: 'Ê-sau nói với cha mình: “Cha chỉ có một phước lành thôi sao[a], cha? Xin cha cũng chúc phước cho con, cha!” Rồi Ê-sau cất tiếng lên và khóc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “Phước lành chỉ có một cho cha sao, cha?” Đây là mệnh đề không động từ trong tiếng Hê-bơ-rơ; trong ngữ cảnh, Ê-sau đau đớn hỏi liệu cha có chỉ một phước lành để ban hay không.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: Cha chỉ có một lời chúc phước thôi sao
  rationale: 'Mệnh đề không động từ trong tiếng Hê-bơ-rơ có nghĩa đen gần như: “Lời chúc phước—chỉ một—là điều cha có sao?” Cách dịch này giữ dạng câu hỏi tu từ và diễn đạt tự nhiên nỗi đau đớn, sửng sốt của Ê-sau.'
- source_word: אָבִי
  choice: cha / cha ơi
  rationale: Hậu tố ngôi thứ nhất số ít biểu thị “cha của con”. Tiếng Việt tự nhiên dùng “cha” khi xưng hô trực tiếp; lần thứ hai dùng “cha ơi” để thể hiện lời van nài mà không làm mất sự lặp lại đầy cảm xúc.
- source_word: בָּרֲכֵנִי
  choice: xin cha chúc phước cho con
  rationale: Động từ mệnh lệnh ברך kèm hậu tố ngôi thứ nhất số ít. Thêm “xin” phù hợp với lời khẩn cầu trong tiếng Việt, còn “chúc phước cho con” truyền đạt trực tiếp hành động được yêu cầu.
- source_word: גַּם אָֽנִי
  choice: cũng ... cho con
  rationale: 'Giữ ý bao gồm Ê-sau bên cạnh Gia-cốp: ông xin cha chúc phước cho mình nữa.'
- source_word: וַיִּשָּׂא ... קֹלוֹ וַיֵּבְךְּ
  choice: cất tiếng khóc
  rationale: Thành ngữ kết hợp nghĩa đen “cất tiếng mình lên” với động từ “khóc”. “Cất tiếng khóc” là cách nói tự nhiên, trang trọng trong tiếng Việt và bao quát cả tiếng than bật ra lẫn hành động khóc.
- source_word: עֵשָׂו
  choice: Ê-sau
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Bản chất và số lượng của lời chúc phước
  choice: Giữ câu hỏi rằng người cha “chỉ có một lời chúc phước”
  alternative: Diễn giải rằng Y-sác không còn bất kỳ phước lành nào khác có thể ban
  rationale: Nguyên văn thể hiện lời chất vấn đau đớn của Ê-sau nhưng không giải thích hoặc hệ thống hóa giới hạn thần học của lời chúc phước; bản dịch không nên tự giải quyết điều văn bản để ngỏ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ ba lần Ê-sau gọi “cha” để bảo tồn nhịp van nài và cảm xúc của nguyên văn; dùng “cha ơi” ở lần cuối cho tự nhiên. Dấu [a] xuất hiện ngay sau cụm liên quan trong câu chính.
