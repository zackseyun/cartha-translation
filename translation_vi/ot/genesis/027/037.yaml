translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cặp xưng hô “cha—con” thể hiện đúng quan hệ giữa Y-sác và Ê-sau; đại từ “nó” giữ sự quy chiếu tự nhiên đến Gia-cốp trong lời người cha nói với một người con khác. Cấu trúc câu giữ nhịp liệt kê và câu hỏi tu từ của nguyên văn.
