- from: 'Y-sác đáp lời Ê-sau: “Này, cha đã đặt nó làm chủ con, đã giao tất cả anh em của nó cho nó làm tôi tớ[a], và đã lấy ngũ cốc cùng rượu mới mà chu cấp cho nó[b]. Vậy cha còn có thể làm gì cho con, con trai cha?”'
  to: 'Y-sác đáp lời Ê-sau: “Này, cha đã đặt người ấy làm chủ con, đã giao tất cả anh em của người ấy cho người ấy làm tôi tớ[a], và đã chu cấp cho người ấy bằng ngũ cốc và rượu mới[b]. Vậy cha còn có thể làm gì cho con, con trai cha?”'
