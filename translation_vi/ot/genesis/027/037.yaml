base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: vi
  text: 'Y-sác đáp lời Ê-sau: “Này, cha đã đặt người ấy làm chủ con, đã giao tất cả anh em của người ấy cho người ấy làm tôi tớ[a], và đã chu cấp cho người ấy bằng ngũ cốc và rượu mới[b]. Vậy cha còn có thể làm gì cho con, con trai cha?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ này trong tiếng Hê-bơ-rơ cũng có thể dịch là “nô lệ”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã nâng đỡ người ấy bằng ngũ cốc và rượu mới”. Động từ tiếng Hê-bơ-rơ có thể nhấn mạnh sự nâng đỡ hoặc việc cung ứng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: đáp lời
  rationale: Động từ ענה trong lời thoại tường thuật diễn tả sự đáp lại; “đáp lời” tự nhiên và trang trọng trong tiếng Việt.
- source_word: הֵן
  choice: Này
  rationale: Giữ sắc thái chỉ dẫn và nhấn mạnh của thán từ Hebrew mà không dùng lối nói cổ khó hiểu.
- source_word: גְּבִיר
  choice: chủ
  rationale: Diễn tả địa vị có quyền trên người khác trong quan hệ gia đình, đồng thời tránh sắc thái danh hiệu thần linh có thể phát sinh từ cách dịch “chúa”.
- source_word: שַׂמְתִּיו לָךְ
  choice: cha đã đặt nó làm chủ con
  rationale: Cấu trúc שׂים với danh từ vị ngữ nói đến việc đặt một người vào địa vị; cách dịch này giữ rõ quyền của Gia-cốp trên Ê-sau.
- source_word: כָּל אֶחָיו
  choice: tất cả anh em của nó
  rationale: Giữ nghĩa thân tộc trực tiếp của אָח và không tự ý mở rộng thành “họ hàng” hay “thân tộc”.
- source_word: לַעֲבָדִים
  choice: làm tôi tớ
  rationale: עֶבֶד có thể chỉ tôi tớ hoặc nô lệ; trong bối cảnh lời chúc phước, “tôi tớ” diễn tả sự lệ thuộc mà không xác định quá mức hình thức nô dịch.
- source_word: דָגָן
  choice: ngũ cốc
  rationale: Chỉ chung sản vật từ các loại cây lương thực có hạt; “ngũ cốc” là cách gọi hiện đại và rõ nghĩa.
- source_word: תִּירֹשׁ
  choice: rượu mới
  rationale: Giữ nét nghĩa nông sản của תִּירוֹשׁ, thường chỉ rượu mới hoặc sản phẩm mới từ nho hơn là rượu nói chung.
- source_word: סְמַכְתִּיו
  choice: chu cấp cho nó
  rationale: סמך cơ bản mang nghĩa nâng đỡ, làm cho vững; khi đi với ngũ cốc và rượu mới, động từ hàm ý bảo đảm nguồn cung nuôi sống.
- source_word: וּלְכָה אֵפוֹא
  choice: Vậy ... cho con
  rationale: “Vậy” thể hiện bước chuyển sang hệ quả, còn “cho con” giữ thành phần לְכָה hướng trực tiếp đến Ê-sau.
- source_word: מָה אֶעֱשֶׂה
  choice: cha còn có thể làm gì
  rationale: Câu hỏi tu từ diễn tả khả năng còn lại sau khi lời chúc phước đã được ban; “còn có thể” truyền đạt tự nhiên hàm ý này.
- source_word: בְּנִי
  choice: con trai cha
  rationale: Giữ nguyên lời xưng hô phụ tử đầy tình cảm; cặp đại từ “cha—con” phù hợp ngữ cảnh tiếng Việt.
