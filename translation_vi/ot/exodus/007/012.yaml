  yaml_path: translation/ot/exodus/007/012.yaml
  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: vi
  text: Mỗi người ném cây gậy của mình xuống, và chúng hóa thành những con rắn[a]; nhưng cây gậy của A-rôn nuốt chửng các cây gậy của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những con rồng” hay “những sinh vật bò sát lớn”; từ Hê-bơ-rơ tannin có thể chỉ một sinh vật giống rắn theo nghĩa rộng hơn từ thường dùng để chỉ “rắn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: ném ... xuống
  rationale: Động từ שׁלך trong cảnh này chỉ hành động ném vật xuống; cách diễn đạt này tự nhiên và giữ rõ hướng chuyển động.
- source_word: אִישׁ
  choice: mỗi người
  rationale: 'אִישׁ được dùng theo nghĩa phân phối: từng người thực hiện hành động với cây gậy của chính mình.'
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: cây gậy / gậy / các gậy
  rationale: מַטֶּה có thể là gậy hoặc trượng. “Gậy” là từ cụ thể, tự nhiên trong tiếng Việt hiện đại và giữ được sự phân biệt số ít, số nhiều của bản Hê-bơ-rơ.
- source_word: וַיִּהְיוּ
  choice: hóa thành
  rationale: Động từ היה tại đây diễn tả kết quả biến đổi; “hóa thành” truyền đạt rõ ý này mà không diễn giải quá mức.
- source_word: לְתַנִּינִם
  choice: những con rắn lớn
  rationale: תַּנִּין có phạm vi nghĩa rộng, có thể chỉ sinh vật dạng rắn, quái vật hoặc loài bò sát lớn. Trong dấu lạ này, “rắn lớn” dễ hiểu theo ngữ cảnh mà vẫn phần nào giữ sắc thái rộng hơn từ thông thường chỉ “rắn”.
- source_word: וַיִּבְלַע
  choice: đã nuốt
  rationale: בלע nghĩa là nuốt hoặc nuốt chửng. “Đã nuốt” tự nhiên trong câu kể và diễn tả hành động tiêu nuốt các gậy kia.
- source_word: אֶת
  choice: '[dấu chỉ định ngữ trực tiếp, không dịch thành từ riêng]'
  rationale: אֶת đánh dấu tân ngữ xác định trong tiếng Hê-bơ-rơ và được thể hiện qua cú pháp tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu trong tiếng Việt hiện đại. Dùng “A-rôn” theo lối phiên âm Kinh Thánh quen thuộc. Cụm “rắn lớn” cùng chú thích giữ lại phạm vi nghĩa rộng và sự mơ hồ thực sự của תַּנִּין.
