base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: vi
  text: Cá trong sông Nin[a] chết, sông Nin bốc mùi hôi thối, khiến người Ai Cập không thể uống nước từ sông Nin. Có máu khắp đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ יְאֹר nghĩa đen là “sông”, nhưng trong sách Xuất Hành, từ này chỉ cụ thể sông Nin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: cá
  rationale: Danh từ số ít mang nghĩa tập hợp, chỉ toàn thể cá trong sông; “cá” diễn đạt tự nhiên trong tiếng Việt mà không mở rộng thành mọi sinh vật dưới nước.
- source_word: יְאֹר
  choice: sông Nin
  rationale: Trong ngữ cảnh sách Xuất Ê-díp-tô Ký, từ này chỉ cụ thể sông Nin; nêu tên sông giúp độc giả hiện đại nhận ra đối tượng ngay.
- source_word: מֵתָה
  choice: chết hết
  rationale: Động từ ở số ít phù hợp với danh từ tập hợp; “chết hết” truyền đạt tự nhiên rằng toàn thể cá được nói đến đều chết.
- source_word: וַיִּבְאַשׁ
  choice: bốc mùi hôi thối
  rationale: Diễn tả rõ việc dòng sông phát ra mùi hôi khó chịu, giữ sắc thái mạnh của động từ Hê-bơ-rơ.
- source_word: וְלֹא יָכְלוּ
  choice: không thể
  rationale: Cách diễn đạt hiện đại, trực tiếp về sự bất khả năng.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: uống nước từ sông
  rationale: Giữ rõ cả hành động uống, đối tượng là nước và nguồn nước là dòng sông.
- source_word: וַיְהִי הַדָּם
  choice: máu có
  rationale: Phản ánh cấu trúc tồn tại của nguyên văn mà không giải thích thêm máu xuất hiện bằng cách nào.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: khắp cõi Ai Cập
  rationale: Diễn đạt tự nhiên phạm vi bao trùm của tai họa trên toàn đất Ai Cập.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật trang nghiêm nhưng hiện đại, dùng câu ngắn và từ ngữ phổ thông. “Bốc mùi hôi thối” giữ sức gợi mạnh của trình thuật tai họa; “cõi Ai Cập” diễn tả tự nhiên toàn lãnh thổ.
