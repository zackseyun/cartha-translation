  rationale: 'Bản sửa giữ trình tự và phạm vi của nguyên văn: cá chết; sông trở nên hôi thối; người Ai Cập không thể uống nước từ sông; và máu có trên khắp đất Ai Cập. Các thay đổi loại bỏ sự tăng cường không cần thiết, làm câu tiếng Việt tự nhiên hơn, và giữ nhất quán quy chiếu đến sông Nin.'
