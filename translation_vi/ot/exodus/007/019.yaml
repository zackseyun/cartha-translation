- from: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy nói với A-rôn: ‘Cầm cây gậy của ngươi và giơ tay trên các nguồn nước của Ai Cập—trên các sông, các kênh đào của sông Nin, các ao hồ và mọi nơi nước tụ lại—để nước biến thành máu. Máu sẽ có khắp đất Ai Cập, ngay cả trong các vật chứa bằng gỗ và bằng đá[a].’”'
  to: 'Yahweh phán với Môi-se: “Hãy nói với A-rôn: ‘Hãy cầm cây gậy của ngươi và đưa tay ngươi ra trên các nguồn nước của Ai Cập—trên các sông, các kênh đào của sông Nin, các ao hồ và mọi nơi nước tụ lại—để nước biến thành máu. Sẽ có máu khắp đất Ai Cập, ngay cả trong các vật chứa bằng gỗ và bằng đá[a].’”'
