  - severity: low
    issue: Trật tự từ trong “Máu sẽ có khắp đất Ai Cập” hơi kém tự nhiên.
    rationale: Câu Hê-bơ-rơ nêu sự hiện diện của máu trên khắp xứ; “Sẽ có máu khắp đất Ai Cập” truyền đạt điều này gọn và tự nhiên hơn.
