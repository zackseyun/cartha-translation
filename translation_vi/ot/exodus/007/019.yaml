  terminology: Yahweh, Môi-se, A-rôn, Ai Cập và sông Nin nhất quán, phù hợp định hướng dự án. “Cây gậy,” “các nguồn nước,” “kênh đào của sông Nin,” và “vật chứa bằng gỗ và bằng đá” đều thích hợp. Chú thích xử lý đúng tính mơ hồ của cụm cuối.
  issues:
