  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Hãy nói với A-rôn: ‘Hãy cầm cây gậy của ngươi và đưa tay ngươi ra trên các nguồn nước của Ai Cập—trên các sông, các kênh đào của sông Nin, các ao hồ và mọi nơi nước tụ lại—để nước biến thành máu. Sẽ có máu khắp đất Ai Cập, ngay cả trong các vật chứa bằng gỗ và bằng đá[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong gỗ và trong đá”; có lẽ chỉ nước ở trong các vật chứa bằng gỗ và bằng đá.'
    reason: Nguyên văn tỉnh lược danh từ chỉ vật chứa; chú thích giữ cách đọc sát chữ và cho biết phần bổ sung trong bản dịch là cách hiểu có tính suy đoán.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ nguyên chức năng tên riêng của יהוה thay vì thay bằng một tước hiệu.
- source_word: מַטְּךָ
  choice: cây gậy của ngươi
  rationale: מַטֶּה chỉ cây gậy được dùng trong các dấu lạ; “cây gậy” là cách nói tự nhiên và cụ thể trong tiếng Việt.
- source_word: וּנְטֵה יָדְךָ
  choice: giơ tay
  rationale: Diễn đạt tự nhiên hành động đưa tay ra trên các nguồn nước, đồng thời tránh khiến câu tiếng Việt nặng nề.
- source_word: מֵימֵי מִצְרַיִם
  choice: các nguồn nước của Ai Cập
  rationale: “Các nguồn nước” bao quát hệ thống sông, kênh, ao hồ và nơi nước tụ lại được liệt kê ngay sau đó.
- source_word: נַהֲרֹתָם
  choice: các sông
  rationale: Giữ nghĩa rộng của נָהָר và phân biệt với các thủy lộ liên hệ đặc thù với sông Nin ở từ kế tiếp.
- source_word: יְאֹרֵיהֶם
  choice: các kênh đào của sông Nin
  rationale: יְאֹר trong bối cảnh Ai Cập chỉ các thủy lộ thuộc hệ thống sông Nin; cách dịch này giữ sắc thái địa phương và phân biệt với נַהֲרוֹת.
- source_word: אַגְמֵיהֶם
  choice: các ao hồ
  rationale: אָגַם có thể chỉ ao, hồ hoặc vùng nước đọng; “ao hồ” là cách gọi tự nhiên, không xác định quá hẹp.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: mọi nơi nước tụ lại
  rationale: מִקְוֶה là chỗ hay khối nước được gom tụ; cách dịch này vừa bao quát vừa tự nhiên hơn một danh từ kỹ thuật.
- source_word: וְיִהְיוּ דָם
  choice: để nước biến thành máu
  rationale: Mệnh đề theo sau chuỗi mệnh lệnh diễn tả kết quả chủ ý; thêm “nước” làm rõ chủ thể số nhiều vốn đã được nêu trong tiếng Hê-bơ-rơ.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: ngay cả trong các vật chứa bằng gỗ và bằng đá
  rationale: Ngữ cảnh nói về nước nên gỗ và đá nhiều khả năng được dùng hoán dụ cho các vật chứa làm từ những vật liệu ấy; “ngay cả” làm rõ phạm vi đáng kinh ngạc của tai họa. Cách đọc sát mặt chữ được giữ trong chú thích.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Giữ danh riêng trong nguyên văn và không thay nó bằng một tước hiệu hay một dạng phiên âm truyền thống khác.
- issue: Ý nghĩa của וּבָעֵצִים וּבָאֲבָנִים
  choice: các vật chứa bằng gỗ và bằng đá
  alternative: trong gỗ và trong đá
  rationale: Ngữ cảnh tập trung vào nước ở mọi nơi, nên cách hiểu hoán dụ về vật chứa phù hợp nhất; tuy nhiên, vì nguyên văn tỉnh lược danh từ “vật chứa”, cách dịch sát chữ được ghi ở chú thích để bảo toàn độ mơ hồ.
translation_notes:
  register: 'Văn phong trang trọng nhưng hiện đại, dùng “phán” cho lời của Yahweh và đại từ “ngươi” trong lời truyền lệnh trực tiếp. Danh riêng được viết theo dạng quen dùng trong tiếng Việt: Môi-se, A-rôn, Ai Cập; “sông Nin” giúp độc giả nhận biết rõ bối cảnh địa lý.'
