  text: Then the LORD said to Moses and to Aaron, saying,
translation:
  language: vi
  text: 'Rồi Đức Giê-hô-va phán với Môi-se và A-rôn rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Liên từ וַ tiếp nối mạch kể chuyện; động từ אָמַר được dịch là “phán” vì chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Thể hiện danh riêng YHWH theo cách phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, thay vì đồng nhất danh này với một tước hiệu.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ cả hai đối tượng được nêu riêng trong nguyên văn.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức dẫn lời được chuyển tự nhiên bằng “rằng” và dấu hai chấm, tránh lối dịch cứng “mà rằng” hoặc “nói rằng”.
theological_decisions:
- issue: Cách thể hiện danh giao ước יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Giavê
  rationale: Giữ đây là danh riêng và dùng hình thức đã quen thuộc, dễ nhận biết đối với độc giả Kinh Thánh tiếng Việt; không thêm diễn giải thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp chuyển tiếp của lời kể và dùng công thức dẫn lời tự nhiên trong tiếng Việt.
