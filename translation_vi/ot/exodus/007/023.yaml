  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
translation:
  language: vi
  text: Pha-ra-ôn quay đi và vào nhà mình; ngay cả việc này ông cũng không để tâm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông cũng không đặt lòng mình vào việc này” hoặc “ông cũng chẳng chú ý đến việc này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: quay đi
  rationale: Động từ פנה diễn tả việc quay hoặc quay đi; trong mạch kể này, “quay đi” tự nhiên và nối rõ với hành động vào cung.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm quen thuộc trong tiếng Việt dành cho tước hiệu vua Ai Cập trong sách Xuất Ai Cập.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: vào cung mình
  rationale: בוא với אֶל chỉ sự chuyển động đến hoặc vào trong. Vì chủ thể là Pha-ra-ôn, “cung mình” truyền đạt tự nhiên nơi cư ngụ của vua mà không làm thay đổi ý chính.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: không để tâm
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là không đặt lòng mình vào điều gì, tức không chú ý hay coi trọng. “Không để tâm” là thành ngữ tiếng Việt tự nhiên và vẫn giữ sắc thái nội tâm.
- source_word: גַּם לָזֹאת
  choice: ngay cả việc này ... cũng
  rationale: גַּם trong ngữ cảnh mang sắc thái “ngay cả”; לָזֹאת chỉ sự việc hoặc dấu lạ vừa xảy ra. Cấu trúc “ngay cả... cũng” chuyển tải đúng sự nhấn mạnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Dùng “ông” để quy chiếu Pha-ra-ôn, tránh nâng sắc thái kính trọng quá mức; giữ chú thích nhằm cho thấy hình ảnh nguyên ngữ “đặt lòng” nằm sau thành ngữ “để tâm”.
