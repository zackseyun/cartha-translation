- from: Pha-ra-ôn quay đi, vào cung mình, và ngay cả việc này ông cũng không để tâm.[a]
  to: Pha-ra-ôn quay đi và vào nhà mình; ngay cả việc này ông cũng không để tâm.[a]
  rationale: Thay “cung mình” bằng “nhà mình” để bám sát danh từ bַּיִת mà không thêm diễn giải về loại nơi ở. Đồng thời, liên kết hai động từ bằng “và” phản ánh sát chuỗi hành động trong tiếng Hê-bơ-rơ; mệnh đề cuối và chú thích được giữ vì diễn đạt đúng thành ngữ và sắc thái nhấn mạnh của câu.
