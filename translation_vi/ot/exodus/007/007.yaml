base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: vi
  text: Môi-se đã tám mươi tuổi[a], còn A-rôn đã tám mươi ba tuổi khi họ nói với Pha-ra-ôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát thành ngữ Hê-bơ-rơ: “Môi-se là con trai tám mươi năm, còn A-rôn là con trai ba và tám mươi năm, khi họ nói với Pha-ra-ôn.”'
    reason: Nêu thành ngữ Hê-bơ-rơ chỉ tuổi và thứ tự “ba và tám mươi” của số từ nguyên văn, không thêm quan hệ từ không có trong cấu trúc gốc.
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: được ... tuổi
  rationale: Đây là thành ngữ Hê-bơ-rơ chỉ tuổi, theo nghĩa đen là “con trai của ... năm”. Tiếng Việt hiện đại diễn đạt tự nhiên bằng “được ... tuổi”.
- source_word: שְׁמֹנִים שָׁנָה
  choice: tám mươi tuổi
  rationale: Cụm số từ chỉ tuổi được chuyển sang cách nói thông dụng trong tiếng Việt.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: tám mươi ba tuổi
  rationale: Nguyên văn sắp số theo thứ tự “ba và tám mươi”; tiếng Việt hiện đại dùng thứ tự “tám mươi ba”.
- source_word: בְּדַבְּרָם
  choice: khi họ nói
  rationale: 'Giới từ בְּ đi với động từ nguyên thể và hậu tố đại từ mang ý nghĩa thời gian trong ngữ cảnh này: “khi họ nói”.'
- source_word: אֶל
  choice: với
  rationale: Trong cấu trúc chỉ lời nói hướng đến một người, “nói với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm danh hiệu hoàng gia Ai Cập quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: וּ
  choice: không biểu đạt bằng một từ riêng ở đầu câu
  rationale: Waw đầu mệnh đề nối câu này với mạch kể chuyện; tiếng Việt không cần thêm “bấy giờ” hay “và” để câu văn tự nhiên, và nguyên văn không có một từ chỉ thời gian tương đương “bấy giờ”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “còn” để nối hai thông tin tuổi tác một cách tự nhiên, không hàm ý đối lập mạnh. Giữ đại từ “họ” tương ứng với hậu tố số nhiều trong nguyên văn.
