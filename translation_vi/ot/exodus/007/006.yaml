base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: vi
  text: Môi-se và A-rôn đã làm đúng như Yahweh[a] đã truyền cho họ; họ đã làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; theo truyền thống thường được dịch là “ĐỨC CHÚA”.'
    reason: Nêu dạng chữ của danh trong nguyên văn và cách dịch truyền thống.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה có nghĩa rộng là “làm, thực hiện”; trong ngữ cảnh vâng theo mệnh lệnh, “làm” là cách diễn đạt tự nhiên và cho phép giữ sự lặp lại ở cuối câu.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: וְאַהֲרֹן
  choice: và A-rôn
  rationale: Giữ phép nối đơn giản của nguyên văn và dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự tương ứng chính xác giữa điều Yahweh truyền và việc hai người thực hiện.
- source_word: צִוָּה
  choice: đã truyền
  rationale: צוה chỉ việc ban mệnh lệnh; “đã truyền” tự nhiên trong văn thuật chuyện và cho thấy mệnh lệnh có trước hành động vâng lời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng YHWH thay vì thay thế bằng một tước hiệu, qua đó giữ hình thức danh xưng trong nguyên văn.
- source_word: אֹתָם
  choice: cho họ
  rationale: Hậu tố ngôi ba số nhiều chỉ Môi-se và A-rôn; với động từ “truyền”, tiếng Việt tự nhiên dùng “truyền cho họ”.
- source_word: כֵּן
  choice: như vậy
  rationale: Trạng từ này nhấn mạnh rằng hành động của họ phù hợp với mệnh lệnh vừa nêu.
- source_word: עָשׂוּ
  choice: họ đã làm
  rationale: Giữ lại động từ lặp của tiếng Hê-bơ-rơ, nhấn mạnh sự vâng lời, đồng thời diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh יהוה. Giữ “Yahweh” bảo tồn danh riêng trong văn bản; chú thích nêu cách dịch truyền thống mà không đồng nhất danh này với một tước hiệu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ cấu trúc lặp “làm… đã làm” của nguyên văn để bảo tồn sắc thái nhấn mạnh sự vâng lời, đồng thời dùng “đúng như” và “như vậy” cho mạch câu tự nhiên.
