  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יַּ֣עַשׂוּ כֵ֔ן כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַ/יַּשְׁלֵ֨ךְ אַהֲרֹ֜ן אֶת מַטֵּ֗/הוּ לִ/פְנֵ֥י פַרְעֹ֛ה וְ/לִ/פְנֵ֥י עֲבָדָ֖י/ו וַ/יְהִ֥י לְ/תַנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: vi
  text: Vậy Môi-se và A-rôn đến gặp Pha-ra-ôn. Họ làm đúng như Yahweh đã truyền. A-rôn ném cây gậy của mình xuống trước mặt Pha-ra-ôn và trước mặt các bề tôi của vua, rồi cây gậy hóa thành một con rắn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ tannin cũng có thể chỉ một sinh vật dạng rồng hoặc một loài bò sát lớn; ở đây, trong dấu lạ trước Pha-ra-ôn, từ này có lẽ chỉ một con rắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đến gặp
  rationale: Động từ ở dạng số ít nhưng đứng trước chủ ngữ kép “Môi-se và A-rôn” và có chức năng tập hợp. “Đến gặp” diễn đạt tự nhiên việc họ đi vào yết kiến Pha-ra-ôn.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Họ làm đúng như vậy
  rationale: Cụm Hê-bơ-rơ diễn tả việc thi hành điều đã được truyền; trong câu tiếng Việt, “làm đúng như Yahweh đã truyền” vừa tự nhiên vừa nêu rõ sự tuân thủ chính xác.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: đúng như ... đã truyền
  rationale: Cách dịch này giữ ý hành động hoàn toàn phù hợp với mệnh lệnh có trước trong mạch kể.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Danh Bốn Chữ, thay vì thay thế bằng một tước hiệu.
- source_word: וַיַּשְׁלֵךְ
  choice: ném ... xuống
  rationale: Diễn đạt trực tiếp hành động quăng cây gậy xuống để thực hiện dấu lạ trước triều đình.
- source_word: מַטֵּהוּ
  choice: cây gậy của mình
  rationale: “Cây gậy” là cách gọi thông dụng, rõ nghĩa trong tiếng Việt hiện đại; đại từ phản thân xác định cây gậy thuộc về A-rôn.
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: trước mặt ... và trước mặt
  rationale: Giữ sự lặp lại của nguyên văn, nhấn mạnh dấu lạ được thực hiện công khai trước cả Pha-ra-ôn lẫn các bề tôi.
- source_word: עֲבָדָיו
  choice: các bề tôi của vua
  rationale: Trong bối cảnh hoàng cung, từ này chỉ những người phục vụ hoặc thuộc hạ của Pha-ra-ôn. “Bề tôi” giữ sắc thái cung đình, còn “của vua” làm rõ đại từ sở hữu mà không gây lẫn với A-rôn.
- source_word: וַיְהִי לְתַנִּין
  choice: cây gậy hóa thành một con rắn
  rationale: תַנִּין có trường nghĩa rộng, nhưng trong dấu lạ với cây gậy trước Pha-ra-ôn, “con rắn” là cách hiểu phù hợp và tự nhiên nhất; nghĩa rộng hơn được giữ trong chú thích.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh Bốn Chữ. Phiên âm “Yahweh” bảo tồn tính chất danh riêng và không thay danh ấy bằng một tước hiệu.
- issue: Cách hiểu תַנִּין
  choice: con rắn
  alternative: sinh vật dạng rồng; loài bò sát lớn
  rationale: Ngữ cảnh dấu lạ từ cây gậy khiến “con rắn” phù hợp nhất, nhưng từ Hê-bơ-rơ không chỉ có duy nhất nghĩa này; chú thích bảo tồn độ rộng ngữ nghĩa thay vì xóa bỏ nó.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tách mệnh đề đầu thành hai câu để lời kể sáng rõ; giữ sự lặp lại “trước mặt” nhằm phản ánh nhấn mạnh của nguyên văn. Dùng “bề tôi” vì bối cảnh cung đình, nhưng tránh lối diễn đạt cổ quá mức.
