language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Hãy vào gặp Pha-ra-ôn và nói với Pha-ra-ôn: ‘Yahweh phán thế này: Hãy để dân Ta đi, để họ phụng sự Ta[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thờ phượng Ta”. Động từ Hê-bơ-rơ có thể chỉ sự phục vụ dành cho Đức Chúa Trời, bao gồm cả việc thờ phượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay bằng một tước hiệu; cách này giữ nguyên tính chất danh giao ước trong bản Hê-bơ-rơ.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ nói năng trong mạch kể; khi chủ thể là Đức Chúa Trời, “phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt. Quan hệ tiếp diễn của waw được thể hiện qua trình tự câu chuyện mà không cần thêm “và” một cách gượng ép.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Hãy vào gặp Pha-ra-ôn
  rationale: בוא có thể mang nghĩa đến, đi vào hoặc vào yết kiến. “Vào gặp” vừa giữ nét đi vào nơi vua hiện diện, vừa tự nhiên trong tiếng Việt.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: và nói với vua ấy
  rationale: Giữ lực mệnh lệnh tiếp nối. “Vua ấy” làm rõ đại từ chỉ Pha-ra-ôn mà không thêm nội dung ngoài văn cảnh.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh phán thế này
  rationale: Giữ công thức sứ giả có thẩm quyền, đồng thời dùng cú pháp tiếng Việt hiện đại và trang trọng.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Hãy để dân Ta đi
  rationale: Diễn đạt đúng yêu cầu phóng thích trong ngữ cảnh, thay vì chỉ mang nghĩa sai đi nơi khác.
- source_word: עַמִּי
  choice: dân Ta
  rationale: Giữ ngôi thứ nhất số ít và lời xác nhận dân thuộc về Yahweh; “Ta” phù hợp với lời trực tiếp trang trọng của Đức Chúa Trời.
- source_word: וְיַעַבְדֻנִי
  choice: để họ phụng sự Ta
  rationale: Mệnh đề diễn tả mục đích. “Phụng sự” giữ nghĩa rộng của עבד là phục vụ Đức Chúa Trời, đồng thời có thể bao hàm việc thờ phượng mà không thu hẹp từ này chỉ còn nghi lễ.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh bốn phụ âm. Giữ “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu; “Giê-hô-va” là một dạng phiên âm truyền thống khác.
- issue: Phạm vi ý nghĩa của וְיַעַבְדֻנִי
  choice: phụng sự Ta
  alternative: thờ phượng Ta
  rationale: עבד khi hướng về Đức Chúa Trời có thể bao gồm thờ phượng, nhưng cũng diễn tả sự phục vụ rộng hơn. Bản chính giữ phạm vi này và chú thích nêu cách hiểu hẹp hơn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Môi-se”, “Pha-ra-ôn” theo dạng tên quen thuộc; dùng “vua ấy” để tránh đại từ có sắc thái thiếu phù hợp khi nói về Pha-ra-ôn. Đại từ “Ta” trong lời Yahweh giữ giọng uy quyền và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
