  to: Sông Nin sẽ đầy nhung nhúc ếch. Chúng sẽ tràn lên, vào nhà ngươi, vào phòng ngủ của ngươi, lên giường ngươi, vào nhà của các tôi tớ ngươi, ở giữa dân ngươi, trong các lò nướng và các chậu nhồi bột[a] của ngươi.
