base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: vi
  text: Sông Nin sẽ đầy nhung nhúc ếch. Chúng sẽ tràn lên, vào nhà ngươi, vào phòng ngủ của ngươi, lên giường ngươi, vào nhà của các tôi tớ ngươi, ở giữa dân ngươi, trong các lò nướng và các chậu nhồi bột[a] của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các máng nhồi bột.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: sẽ đầy nhung nhúc
  rationale: Diễn đạt hình ảnh một số lượng lớn sinh vật nhỏ lúc nhúc, giữ được sắc thái sinh động của động từ שׁרץ; ý tương lai đến từ ngữ cảnh lời báo trước tai họa.
- source_word: הַיְאֹר
  choice: Sông Nin
  rationale: Trong bối cảnh Ai Cập của sách Xuất Hành, יְאֹר chỉ sông Nin, không chỉ một con sông chung chung.
- source_word: צְפַרְדְּעִים
  choice: ếch
  rationale: Tương đương trực tiếp và tự nhiên của danh từ số nhiều trong tiếng Hê-bơ-rơ.
- source_word: וְעָלוּ
  choice: Chúng sẽ bò lên
  rationale: עלה mô tả ếch từ sông đi lên đất liền; thêm “bò” tạo cách diễn đạt tự nhiên cho chuyển động của ếch mà không làm mất hướng đi lên.
- source_word: וּבָאוּ
  choice: vào
  rationale: בוא cùng các cụm giới từ ב chỉ sự xâm nhập vào những nơi được liệt kê; tiếng Việt có thể dùng “vào” gọn và tự nhiên.
- source_word: בְּבֵיתֶךָ
  choice: vào nhà ngươi
  rationale: בית ở đây là nơi ở cụ thể của Pha-ra-ôn, không phải khái niệm trừu tượng về gia tộc hay hộ gia đình.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: vào phòng ngủ
  rationale: Cụm từ có nghĩa đen là “phòng nằm/ngủ”; “phòng ngủ” là cách nói hiện đại, rõ ràng.
- source_word: וְעַל מִטָּתֶךָ
  choice: lên giường ngươi
  rationale: Giữ rõ giới từ עַל, nhấn mạnh ếch không chỉ vào phòng mà còn bò lên trên giường.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: vào nhà của các tôi tớ ngươi
  rationale: בית ở số ít có thể mang nghĩa phân phối với danh từ số nhiều theo sau; tiếng Việt diễn đạt tự nhiên bằng “nhà của các tôi tớ”.
- source_word: וּבְעַמֶּךָ
  choice: ở giữa dân ngươi
  rationale: Không diễn đạt như thể ếch “vào” con người; cụm giới từ chỉ chúng xuất hiện giữa dân chúng của Pha-ra-ôn.
- source_word: וּבְתַנּוּרֶיךָ
  choice: trong các lò nướng
  rationale: תַּנּוּר chỉ những lò dùng trong việc nướng thức ăn; “lò nướng” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: các chậu nhồi bột
  rationale: Danh từ chỉ vật chứa dùng khi chuẩn bị và nhồi bột. “Chậu nhồi bột” dễ hiểu; hình dạng chính xác của vật dụng không hoàn toàn chắc chắn nên ghi phương án khác ở chú thích.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng văn phong trang trọng nhưng dễ hiểu. Đại từ “ngươi” duy trì ngôi thứ hai số ít trong lời phán trực tiếp với Pha-ra-ôn; “tôi tớ” phù hợp bối cảnh triều đình mà không quá cổ. Dấu chú thích được đặt sau “chậu nhồi bột”, đúng với từ có phương án dịch thay thế.
