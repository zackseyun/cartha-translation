base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: vi
  text: Pha-ra-ôn sẽ không nghe các con, và Ta sẽ đặt tay Ta trên Ai Cập, đưa các đạo quân của Ta[a]—dân Ta, con cái Y-sơ-ra-ên[b]—ra khỏi đất Ai Cập bằng những sự phán xét lớn lao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các đạo binh của Ta” hoặc “các đội ngũ của Ta.” Từ Hê-bơ-rơ chỉ những đoàn thể có tổ chức, thường mang sắc thái quân sự.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dân Ta, tức người Y-sơ-ra-ên.” Nguyên văn: “dân Ta, các con trai của Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “cùng với những sự phán xét lớn lao” hoặc “bằng những hành động phán xét lớn lao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: nghe các con
  rationale: Động từ שׁמע đi với אֶל mang nghĩa nghe, lắng nghe hoặc để ý đến. “Nghe các con” giữ được nghĩa trực tiếp và không diễn giải quá mức thành “vâng lời”.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרָיִם
  choice: Ta sẽ đặt tay Ta trên Ai Cập
  rationale: Bám sát thành ngữ Hê-bơ-rơ về hành động can thiệp quyết liệt của Đức Chúa Trời trong sự phán xét; không thay bằng “giơ tay” vì động từ đó không có trong câu này.
- source_word: צִבְאֹתַי
  choice: các đạo quân của Ta
  rationale: צָבָא chỉ những đoàn thể được tổ chức, thường có sắc thái quân sự. “Các đạo quân” giữ hình ảnh tập thể có tổ chức và thuộc quyền Đức Chúa Trời.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: dân Ta, con cái Y-sơ-ra-ên
  rationale: 'Giữ cấu trúc đồng vị: “dân Ta” được xác định thêm là “con cái Y-sơ-ra-ên.” Cách nói này vừa gần nguyên văn vừa quen thuộc trong văn phong Kinh Thánh tiếng Việt.'
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: bằng những cuộc phán xét lớn lao
  rationale: Giữ số nhiều và sắc thái tư pháp của שְׁפָטִים, đồng thời diễn đạt tự nhiên rằng cuộc giải cứu được thực hiện qua các hành động phán xét của Đức Chúa Trời.
theological_decisions:
- issue: Cách gọi dân Y-sơ-ra-ên là צִבְאֹתַי
  choice: các đạo quân của Ta
  alternative: các đoàn ngũ của Ta; các đội ngũ của Ta
  rationale: Bản dịch giữ sắc thái quân sự và tính tổ chức của từ Hê-bơ-rơ mà không biến cụm từ thành một danh xưng thần học chuyên biệt.
- issue: Quan hệ giữa עַמִּי và בְנֵי יִשְׂרָאֵל
  choice: dân Ta, con cái Y-sơ-ra-ên
  alternative: dân Ta, tức người Y-sơ-ra-ên
  rationale: Giữ cấu trúc đồng vị và hình ảnh gia tộc của nguyên văn, thay vì trung hòa hoàn toàn thành tên dân tộc.
- issue: Phương tiện hay hoàn cảnh của בִּשְׁפָטִים גְּדֹלִים
  choice: bằng những cuộc phán xét lớn lao
  alternative: cùng với những cuộc phán xét lớn lao
  rationale: Giới từ ב có thể được hiểu theo sắc thái phương tiện hoặc đi kèm. Cách dịch chính thể hiện hợp lý rằng Đức Chúa Trời đưa dân ra bằng các hành động phán xét, còn chú thích bảo lưu cách hiểu gần nghĩa “cùng với”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” theo lời phán trực tiếp của Đức Chúa Trời với Môi-se và A-rôn. Tên riêng theo dạng quen thuộc trong Kinh Thánh tiếng Việt. Dấu gạch ngang làm rõ quan hệ đồng vị giữa “các đạo quân của Ta” và “dân Ta, con cái Y-sơ-ra-ên”.
