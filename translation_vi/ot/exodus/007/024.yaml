  source_fidelity: Bản dịch phản ánh đúng hành động đào, địa điểm quanh sông Nin, mục đích có nước uống và lý do là nước sông Nin không thể uống được. Tuy nhiên, “đào đất” hơi thêm đối tượng trực tiếp không có trong tiếng Hê-bơ-rơ và kém tự nhiên trong ngữ cảnh này; chỉ dùng “đào” là sát hơn.
