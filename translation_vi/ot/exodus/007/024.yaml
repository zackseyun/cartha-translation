base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: vi
  text: Mọi người Ai Cập đều đào quanh sông Nin để tìm nước uống[a], vì họ không thể uống nước sông Nin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng từ יְאֹר, nghĩa là “sông”; trong sách Xuất Hành, từ này đặc biệt chỉ sông Nin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: đào đất
  rationale: Động từ חפר có nghĩa là đào; bản văn không nói rõ họ đào giếng, nên không thêm ý đó.
- source_word: כָל מִצְרַיִם
  choice: tất cả người Ai Cập
  rationale: Cụm từ theo nghĩa đen là “toàn Ai Cập”, nhưng trong ngữ cảnh chỉ những người đang đào để tìm nước; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: סְבִיבֹת הַיְאֹר
  choice: quanh sông Nin
  rationale: סְבִיבֹת chỉ khu vực xung quanh, còn יְאֹר trong trình thuật Xuất Hành này chỉ sông Nin.
- source_word: מַיִם לִשְׁתּוֹת
  choice: để tìm nước uống
  rationale: Nguyên văn là “nước để uống”. Trong tiếng Việt, thêm “tìm” làm rõ mục đích của hành động đào mà không khẳng định rằng họ đã tìm thấy nước.
- source_word: כִּי לֹא יָכְלוּ
  choice: vì họ không thể
  rationale: כִּי nêu lý do khiến người Ai Cập phải đào; “vì” diễn đạt trực tiếp quan hệ nguyên nhân.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: uống nước sông Nin
  rationale: מִן đánh dấu nguồn nước. Cách nói “uống nước sông Nin” tự nhiên trong tiếng Việt và giữ đúng quan hệ nguồn gốc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sông Nin” để xác định đúng địa danh trong ngữ cảnh; giữ động từ “đào đất” thay vì diễn giải thành “đào giếng”.
