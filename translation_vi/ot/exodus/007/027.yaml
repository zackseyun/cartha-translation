  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: vi
  text: Nhưng nếu ngươi không chịu thả họ đi[a], này, Ta sắp đánh phạt toàn bộ lãnh thổ của ngươi bằng ếch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Và nếu ngươi không chịu thả họ đi …” Phân từ Hê-bơ-rơ có thể diễn tả hành động sắp xảy ra (“sắp đánh phạt”) hoặc tương lai đơn (“sẽ đánh phạt”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ kết hợp với tiểu từ điều kiện mở đầu một điều kiện tương phản với mệnh lệnh trước đó; “Nhưng nếu” diễn đạt tự nhiên sắc thái này.
- source_word: מָאֵן
  choice: không chịu
  rationale: Động từ chỉ sự cố ý khước từ, không phải không có khả năng; “không chịu” tự nhiên trong tiếng Việt và thể hiện sự ngoan cố.
- source_word: לְשַׁלֵּחַ
  choice: thả họ đi
  rationale: Trong ngữ cảnh Xuất Ai Cập, động từ nói đến việc cho dân Y-sơ-ra-ên được rời đi; “thả họ đi” rõ nghĩa và tự nhiên.
- source_word: הִנֵּה
  choice: này
  rationale: Tiểu từ thu hút sự chú ý và tạo sắc thái cảnh báo long trọng, cấp bách; “thì này” giữ được chức năng ấy trong văn phong trang trọng.
- source_word: אָנֹכִי
  choice: Ta
  rationale: Đại từ độc lập làm nổi bật chủ thể phát lời phán. “Ta” phù hợp với lời Đức Chúa Trời phán trực tiếp trong văn phong Kinh Thánh tiếng Việt mà không cần thêm từ nhấn mạnh ngoài nguyên ý.
- source_word: נֹגֵף
  choice: sẽ … đánh phạt
  rationale: Phân từ diễn tả hành động sắp xảy ra hoặc tương lai. “Đánh phạt” giữ hình ảnh giáng đòn và sắc thái phán xét, còn “sẽ” để ngỏ mức độ cận kề hơn cách dịch “sắp”.
- source_word: כָּל גְּבוּלְךָ
  choice: toàn cõi ngươi
  rationale: גְּבוּל ở đây chỉ toàn bộ phạm vi cai trị chứ không chỉ đường biên. “Toàn cõi ngươi” ngắn gọn, trang trọng và bao quát.
- source_word: בַּצְפַרְדְּעִים
  choice: dùng ếch nhái
  rationale: Giới từ בְּ biểu thị phương tiện; đặt “dùng ếch nhái” trước “đánh phạt” tạo câu tiếng Việt tự nhiên và vẫn giữ đúng quan hệ công cụ.
