- from: Nhưng nếu ngươi không chịu thả họ đi[a], thì này, Ta sẽ dùng ếch nhái đánh phạt toàn cõi ngươi.
  to: Nhưng nếu ngươi không chịu thả họ đi[a], này, Ta sắp đánh phạt toàn bộ lãnh thổ của ngươi bằng ếch.
  rationale: Bản sửa làm rõ phạm vi “toàn bộ lãnh thổ”, dùng “ếch” sát danh từ nguồn, và thể hiện sắc thái hành động cận kề của הִנֵּה + phân từ bằng “sắp”. Chú thích giữ cả lựa chọn liên từ “Và nếu” và cách hiểu tương lai đơn, nên không ép một phân tích ngữ pháp còn có thể tranh luận.
