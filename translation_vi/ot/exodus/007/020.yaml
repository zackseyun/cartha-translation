- from: Môi-se và A-rôn làm đúng như vậy, y như Yahweh đã truyền. Ông[a] giơ cây gậy lên, đập vào nước sông Nile[b] trước mắt Pha-ra-ôn và trước mắt các bề tôi của vua; toàn bộ nước trong sông Nile liền biến thành máu.
