source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: vi
  text: Môi-se và A-rôn làm như vậy, đúng như Yahweh đã truyền. Ông[a] giơ cây gậy lên, đập vào nước sông Nile[b] trước mắt Pha-ra-ôn và trước mắt các bề tôi của ông; toàn bộ nước trong sông Nile biến thành máu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng động từ số ít nhưng không nêu rõ người giơ gậy và đập nước là Môi-se hay A-rôn.
    reason: preserved_ambiguity
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “con sông”; trong sách Xuất Hành, từ này thường chỉ cụ thể sông Nile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: làm đúng như vậy
  rationale: Diễn đạt tự nhiên hành động vâng theo mệnh lệnh đã nêu, đồng thời giữ sắc thái của עשה + כן.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: y như ... đã truyền
  rationale: “Y như” giữ lực so sánh của כַּאֲשֶׁר; “đã truyền” phù hợp với mệnh lệnh có trước hành động.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển trực tiếp danh giao ước YHWH, không thay bằng một tước hiệu.
- source_word: וַיָּרֶם בַּמַּטֶּה
  choice: Ông giơ cây gậy lên
  rationale: Giữ động từ số ít và không tự ý xác định người hành động là Môi-se hay A-rôn; “cây gậy” là cách gọi hiện đại, rõ nghĩa của מַטֶּה trong ngữ cảnh.
- source_word: וַיַּךְ אֶת הַמַּיִם
  choice: đập vào nước
  rationale: Thể hiện trực tiếp hành động đánh/đập của נכה và phù hợp với cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: הַיְאֹר
  choice: sông Nile
  rationale: Trong sách Xuất Hành, יְאֹר thường chỉ cụ thể sông Nile; tên riêng giúp độc giả hiện đại nhận biết địa danh.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: trước mắt ... và trước mắt
  rationale: Giữ phép lặp của nguyên văn nhằm nhấn mạnh sự việc diễn ra công khai dưới sự chứng kiến của cả Pha-ra-ôn lẫn các bề tôi.
- source_word: עֲבָדָיו
  choice: các bề tôi của vua
  rationale: “Bề tôi” phù hợp bối cảnh hoàng gia mà không xác định cấp bậc cụ thể; thêm “của vua” làm rõ đại từ sở hữu trong tiếng Việt.
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: liền biến thành máu
  rationale: Diễn đạt tự nhiên kết quả biến đổi được nêu trong tiếng Hê-bơ-rơ; “liền” phản ánh diễn tiến liên tiếp của văn thuật sự.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Giữ “Yahweh” bảo toàn danh giao ước thay vì thay bằng tước hiệu hoặc dùng dạng phiên âm hậu kỳ.
- issue: Chủ thể của các động từ số ít וַיָּרֶם và וַיַּךְ
  choice: Giữ đại từ số ít “Ông” và chú thích sự mơ hồ
  alternative: Xác định là A-rôn hoặc Môi-se
  rationale: Ngữ cảnh trước đó khiến A-rôn có thể là chủ thể, nhưng câu này không nêu tên và hình thức Hê-bơ-rơ chỉ cho biết chủ thể số ít. Bản dịch không nên âm thầm giải quyết điều nguyên văn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép lặp “trước mắt” để bảo toàn trọng âm tu từ; dùng cách phiên âm quen thuộc Môi-se, A-rôn và Pha-ra-ôn, còn Nile được giữ theo tên địa lý quốc tế thông dụng.
