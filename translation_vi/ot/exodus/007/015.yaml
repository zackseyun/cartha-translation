source:
  edition: WLC
  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: vi
  text: Hãy đến gặp Pha-ra-ôn vào buổi sáng. Kìa, Pha-ra-ôn đang đi ra phía nước; hãy đứng bên bờ sông Nin[a] để gặp ông ấy, và hãy cầm trong tay cây gậy đã biến thành rắn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dòng sông.” Trong sách Xuất Hành, từ Hê-bơ-rơ יְאֹר thường chỉ riêng sông Nin.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “con rắn.” Từ Hê-bơ-rơ נָחָשׁ là từ thông thường chỉ rắn, không nhất thiết xác định loài hay mức độ nguy hiểm.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: hãy đến gặp Pha-ra-ôn
  rationale: Mệnh lệnh לֵךְ cùng אֶל diễn tả việc đi đến chỗ một người; “đến gặp” tự nhiên trong tiếng Việt và phù hợp với mục đích đối diện Pha-ra-ôn.
- source_word: בַּבֹּקֶר
  choice: Buổi sáng
  rationale: Cụm chỉ thời gian được đặt đầu câu, theo đúng trật tự Hê-bơ-rơ và tự nhiên trong tiếng Việt.
- source_word: הִנֵּה
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý của הִנֵּה bằng một từ trang trọng nhưng vẫn thông dụng.
- source_word: יֹצֵא הַמַּיְמָה
  choice: ông ấy sẽ đi ra chỗ nước
  rationale: Phân từ יֹצֵא trong ngữ cảnh chỉ hành động sắp diễn ra; đuôi chỉ hướng của הַמַּיְמָה được thể hiện bằng “ra chỗ nước”.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: con hãy đứng đón ông ấy
  rationale: נצב ở thể Nifal nói đến việc đứng vào vị trí, còn לִקְרָאתוֹ là đón hoặc gặp người đang đến. “Đứng đón” diễn đạt gọn và cụ thể.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: bên bờ sông Nin
  rationale: שְׂפַת là bờ hoặc mép; trong sách Xuất Hành, יְאֹר thường chỉ riêng sông Nin.
- source_word: הַמַּטֶּה
  choice: cây gậy
  rationale: מַטֶּה là gậy cầm tay; “cây gậy” là cách gọi tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: đã biến thành con rắn
  rationale: נֶהְפַּךְ diễn tả sự biến đổi; tiếng Việt tự nhiên dùng “biến thành.” נָחָשׁ ở đây được dịch bằng từ thông dụng “con rắn.”
- source_word: תִּקַּח בְּיָדֶךָ
  choice: cầm trong tay
  rationale: Thể chưa hoàn thành mang lực mệnh lệnh trong chuỗi chỉ thị; “cầm trong tay” bảo toàn hình ảnh cụ thể của nguyên văn mà không tạo câu nặng nề.
theological_decisions:
- issue: Cách dịch יְאֹר
  choice: sông Nin
  alternative: dòng sông
  rationale: Trong bối cảnh Ai Cập của sách Xuất Hành, יְאֹר chỉ sông Nin. Nêu tên riêng làm rõ bối cảnh lịch sử mà không thêm diễn giải thần học.
- issue: Chủ thể được gọi bằng đại từ ngôi thứ hai
  choice: con
  alternative: ngươi
  rationale: Tiếng Hê-bơ-rơ chỉ đánh dấu ngôi hai số ít giống đực, không quy định sắc thái quan hệ của đại từ tiếng Việt. “Con” phù hợp lời Đức Chúa Trời nói với Môi-se trong văn phong hiện đại, trang nghiêm; “ngươi” là lựa chọn cổ và cứng hơn.
translation_notes:
  register: Bản dịch dùng tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Câu được chia nhịp theo chuỗi mệnh lệnh của nguyên văn. “Kìa” giữ sắc thái chỉ dẫn chú ý; “con” tránh lối xưng hô cổ “ngươi.” Cả hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
