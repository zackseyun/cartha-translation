  rationale: Chỉ điều chỉnh “dân chúng” thành “dân” để sát hơn với הָעָם và tự nhiên hơn trong văn mạch Xuất Hành, cùng với một chỉnh sửa văn phong nhỏ trong chú thích. Giữ nguyên “nặng nề” để bảo tồn ẩn dụ từ vựng riêng của nguyên văn.
