base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se: “Lòng Pha-ra-ôn nặng nề[a]; Pha-ra-ôn không chịu cho dân ra đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lòng Pha-ra-ôn chai cứng.” Tính từ Hê-bơ-rơ theo nghĩa đen là “nặng”; ở đây là hình ảnh chỉ sự ngoan cố hoặc không chịu đáp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Dạng tự sự với waw liên tiếp đẩy câu chuyện tiến tới. “Rồi” diễn đạt trình tự tự nhiên; “phán” phù hợp với lời Đức Chúa Trời trong văn phong trang trọng hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: כָּבֵד
  choice: nặng nề
  rationale: Giữ hình ảnh cụ thể “nặng” của tiếng Hê-bơ-rơ, đồng thời dùng cách diễn đạt có thể hiểu được trong tiếng Việt; chú thích nêu ý nghĩa ẩn dụ trong ngữ cảnh.
- source_word: לֵב פַּרְעֹה
  choice: Lòng Pha-ra-ôn
  rationale: לֵב có thể chỉ trung tâm ý chí và thái độ, nên “lòng” tự nhiên hơn “trái tim” trong ngữ cảnh này; quan hệ sở hữu được diễn đạt trực tiếp.
- source_word: מֵאֵן
  choice: không chịu
  rationale: Phân từ diễn tả thái độ khước từ đang tiếp diễn; “không chịu” truyền đạt tự nhiên sự ngoan cố không bằng lòng làm điều được yêu cầu.
- source_word: לְשַׁלַּח
  choice: cho ... ra đi
  rationale: Trong ngữ cảnh Xuất Hành, động từ chỉ việc Pha-ra-ôn cho phép dân rời đi; cách dịch này tự nhiên và chính xác theo ngữ cảnh.
- source_word: הָעָם
  choice: dân chúng
  rationale: Giữ cách gọi khái quát “dân” của nguyên văn, không thêm rõ “dân Y-sơ-ra-ên” dù ngữ cảnh cho biết họ là ai.
theological_decisions:
- issue: Diễn đạt tình trạng của lòng Pha-ra-ôn mà không đồng nhất mọi từ ngữ trong mô-típ làm cứng lòng
  choice: Lòng Pha-ra-ôn nặng nề
  alternative: Lòng Pha-ra-ôn chai cứng
  rationale: Nguyên văn tại đây dùng từ “nặng”, không phải từ thường được dịch trực tiếp là “cứng”. Giữ ẩn dụ này bảo tồn sự phân biệt từ vựng và sức căng thần học trong các trình thuật về lòng Pha-ra-ôn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Lặp lại “Pha-ra-ôn” thay vì dùng đại từ để tránh mơ hồ và giữ giọng kể rõ ràng. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
