  text: כִּי֩ יְדַבֵּ֨ר אֲלֵ/כֶ֤ם פַּרְעֹה֙ לֵ/אמֹ֔ר תְּנ֥וּ לָ/כֶ֖ם מוֹפֵ֑ת וְ/אָמַרְתָּ֣ אֶֽל אַהֲרֹ֗ן קַ֧ח אֶֽת מַטְּ/ךָ֛ וְ/הַשְׁלֵ֥ךְ לִ/פְנֵֽי פַרְעֹ֖ה יְהִ֥י לְ/תַנִּֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: vi
  text: 'Khi Pha-ra-ôn nói với các ngươi: “Hãy tự đưa ra một dấu lạ,” thì ngươi hãy bảo A-rôn: “Hãy cầm cây gậy của ông và ném nó xuống trước mặt Pha-ra-ôn, để nó biến thành một con rắn[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con rồng”; từ Hê-bơ-rơ tannin, tùy ngữ cảnh, có thể chỉ một con rắn, một sinh vật biển, hoặc một sinh vật giống rồng.
    reason: Ghi nhận trường nghĩa rộng và phương án dịch khác của תַנִּין.
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong ngữ cảnh này, từ này mở đầu một hoàn cảnh sẽ xảy ra, không nêu nguyên nhân; “khi” diễn đạt tự nhiên sắc thái thời gian-dự liệu.
- source_word: יְדַבֵּר אֲלֵיכֶם
  choice: nói với các ngươi
  rationale: Động từ chưa hoàn thành nằm trong mệnh đề thời gian được diễn đạt tự nhiên bằng hiện tại; đại từ hậu tố là số nhiều, chỉ Môi-se và A-rôn.
- source_word: מוֹפֵת
  choice: dấu lạ
  rationale: Từ này chỉ một dấu hiệu phi thường hoặc điềm lạ. “Dấu lạ” vừa dễ hiểu vừa giữ được ý nghĩa chứng minh của hành động trước Pha-ra-ôn.
- source_word: תְּנוּ לָכֶם
  choice: Hãy đưa ra một dấu lạ cho mình
  rationale: Nghĩa sát là “hãy trao/đưa cho chính các ngươi”; cách dịch này diễn đạt yêu cầu phải đưa ra dấu lạ, đồng thời giữ phần nào sắc thái phản thân của לָכֶם.
- source_word: וְאָמַרְתָּ אֶל־אַהֲרֹן
  choice: thì ngươi hãy nói với A-rôn
  rationale: Chuyển từ “các ngươi” sang “ngươi” phản ánh chính xác sự chuyển từ số nhiều sang số ít trong tiếng Hê-bơ-rơ; “thì” thể hiện trình tự đáp lại.
- source_word: מַטְּךָ
  choice: cây gậy của ngươi
  rationale: מַטֶּה có thể là gậy hoặc trượng; “cây gậy” là cách nói hiện đại, rõ nghĩa trong hành động được thuật lại.
- source_word: וְהַשְׁלֵךְ לִפְנֵי פַרְעֹה
  choice: và ném xuống trước mặt Pha-ra-ôn
  rationale: “Ném xuống” thể hiện động tác quăng cây gậy xuống; “trước mặt” diễn đạt rõ hành động diễn ra trong sự hiện diện của Pha-ra-ôn.
- source_word: יְהִי
  choice: để nó biến thành
  rationale: Thể mệnh lệnh nhẹ diễn đạt kết quả được định cho hành động. “Để nó biến thành” giữ sắc thái mục đích-kết quả thay vì biến câu thành lời tiên báo đơn thuần.
- source_word: תַנִּין
  choice: con rắn
  rationale: Trong cảnh cây gậy hóa thành một sinh vật trước Pha-ra-ôn, “con rắn” phù hợp ngữ cảnh; tuy nhiên, từ Hê-bơ-rơ có trường nghĩa rộng hơn nên được chú thích.
theological_decisions:
- issue: Cách dịch תַנִּין trong dấu lạ cây gậy
  choice: con rắn
  alternative: con rồng; sinh vật lớn giống rắn; thủy quái
  rationale: Ngữ cảnh hành động với cây gậy ủng hộ cách hiểu là một sinh vật giống rắn, nhưng תַנִּין rộng nghĩa hơn נָחָשׁ và ở những ngữ cảnh khác có thể chỉ sinh vật biển hoặc sinh vật giống rồng. Chú thích giữ lại độ rộng nghĩa ấy mà không áp đặt một hình dung thần thoại cụ thể vào câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ngươi/ngươi” để thể hiện chính xác sự chuyển đổi số nhiều sang số ít và giữ sắc thái lời phán trong bối cảnh cổ. Tên riêng được phiên âm theo lối quen dùng. Dấu chú thích [a] đặt ngay sau từ “rắn”, là từ mà chú thích giải thích.
