  yaml_path: translation/ot/exodus/007/025.yaml
  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: vi
  text: Đủ bảy ngày đã qua sau khi Yahweh đánh sông Nin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Bảy ngày đã trọn sau khi Yahweh đánh sông Nin.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “sông Nin”; đôi khi từ này được dịch khái quát hơn là “dòng sông.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: đã trọn
  rationale: Dạng Niphal wayyiqtol của מלא diễn tả một khoảng thời gian đạt đến mức đầy đủ hay hoàn tất. “Đã trọn” vừa giữ sắc thái kết quả của nguyên ngữ, vừa tự nhiên và trang trọng trong tiếng Việt.
- source_word: שִׁבְעַת יָמִים
  choice: bảy ngày
  rationale: Cụm số đếm và danh từ chỉ một khoảng thời gian bảy ngày.
- source_word: אַחֲרֵי
  choice: sau khi
  rationale: Giới từ thời gian; kết hợp với mệnh đề động từ trong tiếng Việt một cách tự nhiên.
- source_word: הַכּוֹת
  choice: đánh
  rationale: Động từ nguyên mẫu cấu tạo của נכה sau אַחֲרֵי mang nghĩa “sau khi đánh.” “Đánh” rõ ràng, hiện đại và phù hợp với bối cảnh tai họa; không thêm cách diễn giải về phương thức.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- source_word: הַיְאֹר
  choice: sông Nin
  rationale: Trong ngữ cảnh sách Xuất Hành, יְאֹר chỉ cụ thể sông Nin; cách dịch này nêu rõ đối tượng được nói đến.
theological_decisions:
- issue: Cách chuyển dịch danh YHWH (יְהוָה)
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Giữ “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu hay áp đặt truyền thống hệ phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, ngắn gọn và trang trọng. “Đã trọn” giữ gần cấu trúc và sắc thái hoàn tất của nguyên ngữ, còn chú thích cung cấp cách nói thành ngữ tự nhiên hơn. Dùng “sông Nin” theo tên gọi phổ biến trong tiếng Việt.
