  text: אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כָּל אֲשֶׁ֣ר אֲצַוֶּ֑/ךָּ וְ/אַהֲרֹ֤ן אָחִ֨י/ךָ֙ יְדַבֵּ֣ר אֶל פַּרְעֹ֔ה וְ/שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: vi
  text: Ngươi hãy nói mọi điều Ta truyền cho ngươi, còn A-rôn, anh ngươi, sẽ nói với Pha-ra-ôn để vua ấy thả con cái Y-sơ-ra-ên ra khỏi xứ mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְדַבֵּר
  choice: hãy nói
  rationale: Dạng vị hoàn thành trong lời ủy nhiệm mang lực chỉ thị; “hãy nói” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: mọi điều Ta truyền cho ngươi
  rationale: Giữ tính bao quát của כָּל và lực truyền lệnh của אֲצַוֶּךָּ; thì chưa hoàn thành có thể chỉ sự truyền bảo trong tiến trình.
- source_word: אַהֲרֹן אָחִיךָ
  choice: A-rôn, anh ngươi
  rationale: Theo sát trật tự tiếng Hê-bơ-rơ mà vẫn tự nhiên; “anh” phù hợp quan hệ tuổi tác được biết từ mạch truyện.
- source_word: יְדַבֵּר אֶל פַּרְעֹה
  choice: sẽ nói với Pha-ra-ôn
  rationale: אֶל đi với דבר chỉ việc nói với một người; không thêm nội dung cụ thể mà nguyên văn không nêu.
- source_word: וְשִׁלַּח
  choice: để vua ấy thả
  rationale: Diễn đạt quan hệ mục đích/kết quả dự kiến nhưng không khẳng định quá mức rằng kết quả chắc chắn xảy ra; “vua ấy” làm rõ chủ thể Pha-ra-ôn trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh huyết thống của nguyên ngữ, nghĩa đen là “các con trai/con cái của Y-sơ-ra-ên”, và là cách gọi trang trọng, dễ hiểu trong tiếng Việt Kinh Thánh.
- source_word: מֵאַרְצוֹ
  choice: ra khỏi xứ mình
  rationale: Diễn đạt chuyển động rời khỏi lãnh thổ của Pha-ra-ôn; đại từ phản thân “mình” quy chiếu tự nhiên về vua ấy.
theological_decisions:
- issue: Mức độ chắc chắn của וְשִׁלַּח
  choice: để vua ấy thả
  alternative: và vua ấy sẽ thả
  rationale: Cấu trúc có thể được hiểu theo mục đích hoặc kết quả; chọn “để” bảo tồn hướng mục đích mà không biến lời này thành một khẳng định tất định về phản ứng tức thời của Pha-ra-ôn.
translation_notes:
  register: Văn phong trang trọng, hiện đại, dùng cặp đại từ “Ta–ngươi” cho lời Đức Chúa Trời phán với Môi-se. Giữ các tên riêng theo dạng phiên âm quen thuộc A-rôn, Pha-ra-ôn và Y-sơ-ra-ên.
