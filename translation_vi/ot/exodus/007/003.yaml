source:
  edition: WLC
  text: וַ/אֲנִ֥י אַקְשֶׁ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/הִרְבֵּיתִ֧י אֶת אֹתֹתַ֛/י וְ/אֶת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: vi
  text: Nhưng Ta sẽ làm cho lòng Pha-ra-ôn cứng lại[a], và Ta sẽ gia tăng các dấu lạ cùng những việc kỳ diệu của Ta trong đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho lòng Pha-ra-ôn trở nên cứng cỏi” hoặc “làm cho Pha-ra-ôn ngoan cố.” Động từ Hê-bơ-rơ ở thể gây khiến và trình bày trực tiếp hành động làm cho cứng lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Nhưng Ta
  rationale: Liên từ đi với đại từ được nêu rõ tạo sắc thái tương phản hoặc nhấn mạnh trong ngữ cảnh; “Nhưng Ta” diễn đạt tự nhiên sắc thái ấy.
- source_word: אַקְשֶׁה
  choice: sẽ làm cho ... cứng lại
  rationale: Thể Hiphil của קשׁה mang nghĩa gây khiến, “làm cho cứng”; cách dịch này giữ nguyên tác động trực tiếp của Đức Chúa Trời và kết hợp tự nhiên với “lòng”.
- source_word: לֵב פַּרְעֹה
  choice: lòng Pha-ra-ôn
  rationale: Giữ hình ảnh “lòng” của nguyên văn, vốn có thể chỉ ý chí và tâm trí bên trong, thay vì diễn giải ngay trong chính văn.
- source_word: וְהִרְבֵּיתִי
  choice: và Ta sẽ gia tăng
  rationale: Trong mạch văn, dạng động từ này có ý nghĩa tương lai; “gia tăng” chuyển tải nghĩa làm cho nhiều lên một cách tự nhiên trong tiếng Việt.
- source_word: אֹתֹתַי
  choice: các dấu lạ ... của Ta
  rationale: אוֹת thường có nghĩa là dấu hiệu; “dấu lạ” phù hợp ngữ cảnh những hành động siêu nhiên biểu thị quyền năng và sứ điệp của Đức Chúa Trời.
- source_word: מוֹפְתַי
  choice: những việc kỳ diệu của Ta
  rationale: מוֹפֵת có thể chỉ điều kỳ diệu hoặc điềm lạ; cách dịch này giữ sắc thái phi thường mà không thu hẹp nghĩa thành điềm báo.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: trong đất Ai Cập
  rationale: Giữ danh từ “đất” có trong tiếng Hê-bơ-rơ, đồng thời dùng cách diễn đạt quen thuộc và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Hành động của Đức Chúa Trời trong việc làm cứng lòng Pha-ra-ôn
  choice: Ta sẽ làm cho lòng Pha-ra-ôn cứng lại
  alternative: Ta sẽ để lòng Pha-ra-ôn trở nên cứng cỏi
  rationale: Thể gây khiến Hiphil trình bày trực tiếp vai trò chủ động của Đức Chúa Trời. Bản dịch giữ nguyên sức căng thần học này, không làm nhẹ thành sự cho phép đơn thuần.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ta” dành cho lời Đức Chúa Trời; giữ thành ngữ “lòng ... cứng lại” để bảo toàn hình ảnh và sức căng của nguyên văn.
