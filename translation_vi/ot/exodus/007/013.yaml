base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: vi
  text: Nhưng lòng Pha-ra-ôn trở nên cứng[a], và ông không lắng nghe họ, đúng như Gia-vê đã phán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lòng Pha-ra-ôn trở nên chai cứng.” Động từ Híp-ri, theo nghĩa sát hơn, là “trở nên mạnh/vững”; trong ngữ cảnh này, từ ấy chỉ sự cứng lòng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: trở nên cứng cỏi
  rationale: Động từ חזק ở thể chủ động/nội động diễn tả lòng Pha-ra-ôn trở nên mạnh, cứng hoặc kiên cố. “Trở nên cứng cỏi” tự nhiên trong tiếng Việt, truyền đạt sự chai cứng mà không biến câu thành bị động hay xác định tác nhân.
- source_word: לֵב
  choice: lòng
  rationale: Trong ngữ cảnh này, לֵב chỉ nội tâm, ý chí và thái độ; “lòng” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm quen thuộc của tước hiệu hoàng gia Ai Cập trong tiếng Việt.
- source_word: שָׁמַע אֲלֵהֶם
  choice: nghe lời họ
  rationale: שׁמע đi với אֶל mang nghĩa lắng nghe hoặc làm theo. “Không nghe lời họ” vừa tự nhiên vừa bao hàm ý không chịu lưu tâm, vâng theo.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự tương ứng chính xác giữa diễn biến và lời đã phán trước.
- source_word: דִּבֶּר
  choice: đã phán
  rationale: “Đã” biểu thị lời được nói trước biến cố hiện tại; “phán” phù hợp với lời nói của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng của יהוה đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Tác nhân khiến lòng Pha-ra-ôn cứng lại
  choice: “lòng Pha-ra-ôn trở nên cứng cỏi” không nêu tác nhân
  alternative: “lòng Pha-ra-ôn bị làm cho cứng lại” hoặc “Pha-ra-ôn làm cứng lòng mình”
  rationale: Dạng Híp-ri ở câu này là chủ động/nội động và không nêu ai trực tiếp gây ra sự chai cứng. Bản dịch giữ nguyên sự không xác định ấy, không quy hành động riêng cho Đức Chúa Trời hay Pha-ra-ôn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “lòng” theo lối nói tự nhiên về ý chí/nội tâm; “cứng cỏi” bảo toàn sắc thái của חזק và tránh hàm ý bị động không có trong hình thái Híp-ri.
