id: EXO.7.16
reference: Exodus 7:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: vi
  text: 'Hãy nói với ông ấy: “Yahweh, Đức Chúa Trời của người Hê-bơ-rơ, đã sai tôi đến với ông và phán: ‘Hãy để dân ta đi, để họ phục vụ ta[a] trong hoang mạc.’ Nhưng kìa, cho đến nay, ông vẫn không nghe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thờ phượng ta.” Động từ Hê-bơ-rơ có thể chỉ sự phục vụ nói chung hoặc sự thờ phượng theo nghĩa tôn giáo.'
    reason: Nêu phương án từ vựng chính đáng và bảo toàn phạm vi nghĩa của עבד.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng Danh Bốn Chữ, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Đức Chúa Trời của người Hê-bơ-rơ
  rationale: Giữ danh xưng sắc tộc עִבְרִים và quan hệ sở thuộc của cấu trúc liên kết Hê-bơ-rơ.
- source_word: שְׁלָחַנִי
  choice: đã sai tôi
  rationale: Dạng hoàn thành diễn tả việc ủy phái đã xảy ra và vẫn có hiệu lực trong lời Môi-se đang truyền đạt.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Hãy để dân ta đi
  rationale: Diễn đạt tự nhiên mệnh lệnh đòi Pha-ra-ôn phóng thích dân, không thêm ý nghĩa ngoài văn bản.
- source_word: וְיַעַבְדֻנִי
  choice: để họ phục vụ ta
  rationale: Mệnh đề diễn tả mục đích; “phục vụ” giữ được nghĩa rộng của עבד, trong đó có thể bao hàm sự thờ phượng mà không thu hẹp động từ vào nghi lễ.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: “Hoang mạc” chỉ vùng đất hoang vắng và không mặc nhiên giới hạn vào sa mạc cát.
- source_word: וְהִנֵּה
  choice: Nhưng
  rationale: Trong ngữ cảnh này, וְהִנֵּה vừa chuyển sang ý tương phản vừa nhấn mạnh thực trạng. Tiếng Việt hiện đại thể hiện tự nhiên sức đối lập bằng “Nhưng” mà không cần từ cảm thán cổ.
- source_word: לֹא שָׁמַעְתָּ
  choice: ông vẫn không nghe
  rationale: Giữ động từ “nghe” để bảo toàn khoảng nghĩa giữa nghe, lắng nghe và vâng theo; “vẫn” kết hợp với cụm thời gian cho thấy tình trạng tiếp diễn.
- source_word: עַד כֹּה
  choice: cho đến nay
  rationale: Thành ngữ thời gian tự nhiên, tương ứng với ý nghĩa “cho tới thời điểm này”.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm “Yahweh” giữ danh ấy thay vì thay bằng tước hiệu.
- issue: Phạm vi nghĩa của וְיַעַבְדֻנִי
  choice: phục vụ ta
  alternative: thờ phượng ta
  rationale: עבד có thể chỉ sự phục vụ nói chung hoặc việc phụng thờ trong bối cảnh tôn giáo. Bản chính giữ nghĩa rộng, còn chú thích nêu cách hiểu hẹp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp đại từ “tôi–ông” được dùng trong lời Môi-se nói với người cai trị để tránh lối xưng hô quá cổ; “ta” trong lời Yahweh giữ sắc thái uy quyền. Dấu ngoặc kép phân tầng lời Môi-se và lời được Yahweh truyền lại.
