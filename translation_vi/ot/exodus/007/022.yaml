base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: vi
  text: Nhưng các pháp sư Ai Cập cũng làm như vậy bằng những bí thuật của họ[a]. Lòng Pha-ra-ôn trở nên cứng cỏi[b], và ông không nghe Môi-se cùng A-rôn, đúng như Yahweh đã phán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng những bùa phép của họ” hoặc “bằng những thuật huyền bí của họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Lòng Pha-ra-ôn trở nên chai cứng.” Nguyên văn không nói rõ ai hoặc điều gì khiến lòng Pha-ra-ôn cứng cỏi.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: cũng làm như vậy
  rationale: Diễn đạt tự nhiên mối liên hệ với hành động được kể ngay trước đó; “cũng” làm rõ ý bắt chước mà ngữ cảnh hàm chứa.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: các pháp sư Ai Cập
  rationale: Chỉ những chuyên gia nghi lễ trong triều đình Pha-ra-ôn; “pháp sư” rõ nghĩa và quen thuộc với độc giả Việt hiện đại.
- source_word: בְּלָטֵיהֶם
  choice: bằng những thuật bí truyền của họ
  rationale: Giữ sắc thái về các phương thuật kín giấu và chức năng công cụ của giới từ בְּ, nhưng không xác định quá mức cách thức.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: Lòng Pha-ra-ôn trở nên cứng cỏi
  rationale: Dịch theo nghĩa nội động/kết quả của חזק và không đưa vào một tác nhân mà câu Hê-bơ-rơ không nêu rõ.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: ông không nghe Môi-se cùng A-rôn
  rationale: שׁמע אֶל có nghĩa là nghe hoặc chịu nghe. Dùng tên hai người thay cho đại từ để tham chiếu được rõ ràng trong tiếng Việt.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: đúng như Yahweh đã phán
  rationale: Công thức này nhắc lại lời phán trước đó; “đã phán” phù hợp văn cảnh kể chuyện và giữ sắc thái trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Tác nhân khiến lòng Pha-ra-ôn cứng cỏi
  choice: “Lòng Pha-ra-ôn trở nên cứng cỏi”
  alternative: “Lòng Pha-ra-ôn bị làm cho cứng cỏi” hoặc “Pha-ra-ôn làm lòng mình cứng cỏi”
  rationale: Câu Hê-bơ-rơ mô tả tình trạng/kết quả nhưng không nêu rõ Đức Chúa Trời, Pha-ra-ôn hay một tác nhân nào khác; cách dịch này bảo toàn sự không xác định ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ra-ôn” và “Môi-se” theo dạng tên quen thuộc trong tiếng Việt; diễn giải đại từ số nhiều bằng “Môi-se cùng A-rôn” để tránh mơ hồ. Mọi dấu chú thích đều xuất hiện trong chính văn.
