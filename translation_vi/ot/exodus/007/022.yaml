  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của tiếng Hê-bơ-rơ: các pháp sư Ai Cập làm điều tương tự bằng phương thuật của họ; lòng Pha-ra-ôn ở trong tình trạng trở nên cứng; ông không nghe Môi-se và A-rôn; và điều đó xảy ra như Yahweh đã phán. Cách diễn đạt nội động “trở nên cứng cỏi” không áp đặt tác nhân cho sự cứng lòng.'
  naturalness: “Những thuật bí truyền” không tự nhiên trong tiếng Việt hiện đại; “những bí thuật” là cách kết hợp thông dụng hơn và vẫn giữ ý về các phương thuật kín giấu. Các phần còn lại rõ ràng, trang trọng và tự nhiên.
  terminology: “Pháp sư,” “Pha-ra-ôn,” “Môi-se,” “A-rôn,” và “Yahweh” nhất quán, phù hợp ngữ cảnh. Trong chú thích, “thuật huyền bí” trung tính hơn “tà thuật,” vốn có thể thêm một phán đoán tôn giáo không được từ gốc đòi hỏi.
