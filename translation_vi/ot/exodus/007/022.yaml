  - severity: low
    issue: Phương án chú thích “tà thuật” có sắc thái phán xét thêm vào.
    rationale: Từ Hê-bơ-rơ chỉ các thực hành bí mật/ma thuật; “thuật huyền bí” giữ tính mô tả trung tính hơn.
