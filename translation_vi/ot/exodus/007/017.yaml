source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: vi
  text: 'Yahweh phán thế này: “Qua việc này, ngươi sẽ biết Ta là Yahweh: Này, Ta sẽ dùng cây gậy trong tay Ta đánh vào nước sông Nin, và nước sẽ biến thành máu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Đức Giê-hô-va phán thế này
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại nhưng vẫn giữ công thức sứ giả trang trọng của tiếng Hê-bơ-rơ; danh riêng giao ước יְהוָה được phiên âm là “Đức Giê-hô-va” theo cách gọi quen thuộc và trang nghiêm trong tiếng Việt.
- source_word: בְּזֹאת
  choice: Qua việc này
  rationale: Giữ sắc thái phương tiện của giới từ בְּ và chỉ về dấu lạ sắp được thực hiện, đồng thời tự nhiên hơn “bởi điều này” trong văn cảnh tiếng Việt.
- source_word: תֵּדַע כִּי אֲנִי יְהוָה
  choice: ngươi sẽ biết Ta là Đức Giê-hô-va
  rationale: Thể chưa hoàn thành có nghĩa tương lai trong ngữ cảnh; “ngươi” phù hợp lời Đức Chúa Trời trực tiếp nói với Pha-ra-ôn và giữ sự chênh lệch địa vị.
- source_word: הִנֵּה
  choice: Này
  rationale: Bảo tồn dấu hiệu thu hút sự chú ý và tính tức thời, trang trọng của lời tuyên bố.
- source_word: אָנֹכִי מַכֶּה
  choice: Ta sẽ ... đánh xuống
  rationale: Phân từ diễn tả hành động sống động và sắp xảy ra; tiếng Việt tự nhiên dùng tương lai gần “sẽ ... đánh” thay vì hình thức tiếp diễn gượng ép.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: dùng cây gậy trong tay Ta
  rationale: מַטֶּה là gậy dùng làm công cụ; cách diễn đạt này giữ cả phương tiện lẫn chi tiết cây gậy ở trong tay người nói.
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: đánh xuống nước sông Nin
  rationale: עַל trong hành động đánh mang ý hướng xuống/trên bề mặt; יְאֹר ở đây chỉ cụ thể sông Nin, không chỉ một con sông nói chung.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: và nước sẽ biến thành máu
  rationale: Tiếng Hê-bơ-rơ dùng động từ số nhiều hòa hợp với “các dòng nước/nước”; tiếng Việt dùng danh từ khối “nước” không đánh dấu số và diễn đạt kết quả tự nhiên bằng “biến thành máu”.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu. “Đức Giê-hô-va” là dạng phiên âm đã quen thuộc, trang nghiêm và dễ hiểu đối với độc giả tiếng Việt phổ thông; không làm mất sự lặp lại có chủ ý trong lời tự nhận “Ta là Đức Giê-hô-va”.
- issue: Chủ thể thực hiện cú đánh
  choice: 'Giữ ngôi thứ nhất: “Ta sẽ ... đánh”'
  alternative: Môi-se sẽ đánh theo mệnh lệnh của Đức Chúa Trời
  rationale: Nguyên văn đặt lời hành động ở ngôi thứ nhất của יהוה dù cây gậy hữu hình ở tay Môi-se. Bản dịch giữ nguyên sức căng giữa tác nhân tối cao và người thi hành, không tự ý giải thích thay.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta/ngươi” phản ánh lời phán trực tiếp của Đức Chúa Trời với Pha-ra-ôn. Không dùng chú thích vì sự khác biệt số nhiều của הַמַּיִם không thể hiện hình thái tương ứng trong tiếng Việt và không tạo ra phương án nghĩa đáng kể cần chú giải.
