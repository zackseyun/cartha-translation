  naturalness: “Dùng những phép bí truyền của mình mà làm y như vậy” hơi nặng và không tự nhiên trong tiếng Việt hiện đại. “Cũng làm như vậy bằng các thuật bí truyền của họ” gọn, rõ và giữ văn phong tường thuật trang trọng.
