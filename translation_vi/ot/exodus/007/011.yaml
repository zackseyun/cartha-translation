base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: vi
  text: Bấy giờ, Pha-ra-ôn cũng triệu tập các nhà thông thái và những kẻ hành phù phép; các thuật sĩ Ai Cập ấy cũng làm như vậy bằng các thuật bí truyền của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể dịch là “phép phù chú”. Từ này có thể chỉ các thuật huyền bí hoặc phép phù chú; sắc thái chính xác không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: triệu
  rationale: Trong ngữ cảnh triều đình, động từ diễn tả việc Pha-ra-ôn gọi người đến trước mặt mình; “triệu” vừa gọn vừa tự nhiên.
- source_word: חֲכָמִים
  choice: các nhà thông thái
  rationale: Chỉ những người có học thức hoặc chuyên môn trong triều đình, đồng thời giữ nghĩa căn bản là người khôn ngoan.
- source_word: מְכַשְּׁפִים
  choice: những kẻ làm thuật phù phép
  rationale: Phân biệt nhóm người hành nghề phù phép này với חַרְטֻמִּים, là các chuyên gia nghi lễ của Ai Cập được nhắc đến ngay sau đó.
- source_word: גַם הֵם חַרְטֻמֵּי מִצְרַיִם
  choice: các pháp sư Ai Cập cũng
  rationale: Giữ sắc thái nhấn mạnh “họ cũng vậy” và dùng cách gọi dễ hiểu cho các chuyên gia nghi lễ trong triều đình Ai Cập.
- source_word: בְּלַהֲטֵיהֶם
  choice: dùng những phép bí truyền của mình
  rationale: Diễn đạt phương tiện huyền thuật mà họ sử dụng, nhưng không xác định quá hẹp đó là bùa chú, ảo thuật hay một cơ chế siêu nhiên cụ thể.
- source_word: כֵּן
  choice: y như vậy
  rationale: Chỉ rõ rằng họ bắt chước hành động hoặc dấu lạ vừa được thuật lại ở câu trước.
theological_decisions:
- issue: Bản chất quyền năng của các pháp sư Ai Cập
  choice: Thuật lại rằng họ dùng những phép bí truyền và làm y như vậy, không giải thích cơ chế.
  alternative: Xác định đó là quyền lực siêu nhiên có thật, quyền lực ma quỷ, hoặc chỉ là trò đánh lừa.
  rationale: Bản văn nói họ thực hiện cùng một việc bằng לַהֲטֵיהֶם nhưng không giải thích đó là phép lạ thật, tà thuật hay thủ thuật đánh lừa; bản dịch giữ nguyên sự bỏ ngỏ này.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Pha-ra-ôn” và “pháp sư Ai Cập” là các cách gọi quen thuộc; “thuật phù phép” và “phép bí truyền” vừa phân biệt hai thuật ngữ Hê-bơ-rơ vừa tránh giải thích quá mức.
