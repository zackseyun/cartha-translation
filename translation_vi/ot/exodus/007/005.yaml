id: EXO.7.5
reference: Exodus 7:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: vi
  text: Người Ai Cập sẽ biết rằng Ta là Yahweh[a] khi Ta dang tay Ta chống lại Ai Cập và đưa con cháu Israel[b] ra khỏi giữa vòng họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là danh Đức Chúa Trời, được viết bằng bốn phụ âm Hê-bơ-rơ YHWH; nhiều bản dịch truyền thống dùng “CHÚA” hoặc “ĐỨC GIÊ-HÔ-VA”.
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “các con trai của Israel”; cụm từ này thường chỉ chung con cháu hoặc dân Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: sẽ biết
  rationale: Dạng động từ trong mạch văn tiên báo diễn tả điều người Ai Cập sẽ nhận biết qua những hành động sắp tới của Đức Chúa Trời.
- source_word: מִצְרַיִם
  choice: Người Ai Cập / Ai Cập
  rationale: Lần thứ nhất chỉ dân Ai Cập, là chủ thể số nhiều của hành động nhận biết; lần thứ hai chỉ đất nước/dân tộc chịu hành động phán xét.
- source_word: כִּי
  choice: rằng
  rationale: Dẫn vào nội dung điều người Ai Cập sẽ biết.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: בִּנְטֹתִי אֶת־יָדִי
  choice: khi Ta giơ tay
  rationale: Giữ hình ảnh cụ thể của nguyên文; giới từ đi với động từ nguyên mẫu mang ý nghĩa thời gian trong câu này.
- source_word: עַל־מִצְרָיִם
  choice: chống lại Ai Cập
  rationale: Trong bối cảnh phán xét, עַל diễn tả hành động đối nghịch; cách nói này tự nhiên trong tiếng Việt.
- source_word: וְהוֹצֵאתִי
  choice: và đưa ... ra
  rationale: Giữ sắc thái khiến cho đi ra của thể Hiphil và phối hợp tự nhiên với mệnh đề bắt đầu bằng “khi”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  rationale: Thành ngữ gia tộc chỉ cộng đồng hậu duệ của Israel; “con cháu Israel” tự nhiên, trang trọng và bao quát đúng đối tượng trong tiếng Việt.
- source_word: מִתּוֹכָם
  choice: ra khỏi giữa họ
  rationale: Giữ ý đưa dân Israel ra khỏi nơi họ đang sống giữa người Ai Cập.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên bản dùng trực tiếp danh YHWH; giữ danh riêng giúp phân biệt với các tước hiệu và bảo toàn công thức tự bày tỏ “Ta là Yahweh”.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  alternative: các con trai Israel / dân Israel / người Israel
  rationale: Trong ngữ cảnh này, cụm Hê-bơ-rơ là cách gọi tập thể các hậu duệ của tổ phụ Israel, không chỉ nam giới. “Con cháu Israel” vừa giữ hình ảnh huyết thống vừa tránh gây hiểu lầm rằng chỉ các con trai được đưa ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp lời phán trực tiếp của Đức Chúa Trời. Câu giữ song song hai hành động “giơ tay” và “đưa ... ra”, đồng thời bảo tồn hình ảnh nhân hình học “tay” thay vì diễn giải thành “quyền năng”.
