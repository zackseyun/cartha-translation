  - severity: low
    issue: Vị trí neo chú thích [a]
    rationale: Chú thích chỉ liên quan đến וְנִלְאוּ (“sẽ kiệt sức/mệt mỏi”), nên cần đặt ngay sau mệnh đề tương ứng thay vì ở cuối toàn câu để tránh mơ hồ về phạm vi.
