revisions:
- from: Cá dưới sông Nin sẽ chết, sông sẽ bốc mùi hôi, và người Ai Cập sẽ kiệt sức vì cố uống nước từ sông Nin.[a]
  to: Cá trong sông Nin sẽ chết, sông Nin sẽ bốc mùi hôi, và người Ai Cập sẽ kiệt sức khi cố uống nước từ sông Nin.[a]
  rationale: Sửa “dưới sông” thành “trong sông” để phản ánh chính xác giới từ tiếng Hê-bơ-rơ và cách dùng tự nhiên trong tiếng Việt; lặp lại “sông Nin” để giữ rõ chủ ngữ của mệnh đề thứ hai; đồng thời neo chú thích vào đúng cụm từ có biến thể từ vựng. Không thay đổi nghĩa của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:13:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của tiếng Hê-bơ-rơ: cá trong sông Nin sẽ chết, sông sẽ trở nên hôi thối, và người Ai Cập sẽ mệt mỏi/kiệt sức trong việc cố uống nước từ sông. Cách hiểu “kiệt sức vì cố uống” bảo lưu sắc thái của נלאו tốt hơn việc chỉ nêu kết quả “không thể.” Tuy nhiên, “Cá dưới sông Nin” có thể gợi vị trí ở đáy sông hơn là nghĩa đơn giản “cá trong sông,” và nên lặp lại “sông Nin” ở mệnh đề thứ hai để giữ tham chiếu rõ như nguyên văn.'
  naturalness: Văn phong nhìn chung tự nhiên và trang nghiêm. “Cá trong sông Nin” là cách nói thông dụng, chính xác hơn “cá dưới sông Nin.” Đặt ký hiệu chú thích ngay sau mệnh đề về sự kiệt sức làm rõ phạm vi của chú thích từ vựng.
  terminology: “Sông Nin,” “người Ai Cập,” “bốc mùi hôi” và “uống nước” đều là những lựa chọn hiện đại, chuẩn mực và phù hợp ngữ cảnh. Không có vấn đề thuật ngữ thần học.
