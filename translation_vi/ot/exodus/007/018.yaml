  yaml_path: translation/ot/exodus/007/018.yaml
  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: vi
  text: Cá trong sông Nin sẽ chết, sông Nin sẽ bốc mùi hôi, và người Ai Cập sẽ kiệt sức khi cố uống nước từ sông Nin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người Ai Cập sẽ không thể uống nước từ sông Nin.” Động từ Hê-bơ-rơ có thể diễn tả sự mệt mỏi hoặc kiệt sức đến mức không làm nổi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: Cá
  rationale: Danh từ số ít mang nghĩa tập hợp, chỉ toàn bộ cá trong sông; “cá” là cách diễn đạt tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: יְאֹר
  choice: sông Nin
  rationale: Trong ngữ cảnh sách Xuất Ai Cập, từ này chỉ cụ thể sông Nin; nêu rõ địa danh giúp người đọc hiện đại nhận ra đối tượng mà không làm mất nghĩa.
- source_word: תָּמוּת
  choice: sẽ chết
  rationale: Diễn đạt trực tiếp nghĩa thông thường của động từ מות và phù hợp với chủ ngữ tập hợp “cá”.
- source_word: וּבָאַשׁ
  choice: sẽ bốc mùi hôi
  rationale: Động từ באש chỉ việc trở nên hôi thối; cách dịch này tự nhiên, rõ ràng và giữ được hình ảnh cụ thể của nguyên văn.
- source_word: וְנִלְאוּ
  choice: sẽ kiệt sức vì cố
  rationale: Niphal của לאה trước động từ nguyên mẫu có thể chỉ sự mệt mỏi, kiệt sức khi cố làm một việc, qua đó hàm ý không làm nổi. Cách dịch này giữ sắc thái từ vựng và sự căng thẳng vốn có thay vì chỉ nêu kết quả “không thể”.
- source_word: לִשְׁתּוֹת מַיִם
  choice: uống nước
  rationale: Giữ cả động từ và tân ngữ được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: מִן הַיְאֹר
  choice: từ sông Nin
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, chỉ nguồn nước được lấy để uống.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “sông Nin” theo cách gọi thông dụng trong tiếng Việt. Giữ sắc thái sống động của tai họa và bảo lưu khả năng hiểu khác nhau của וְנִלְאוּ bằng chú thích.
