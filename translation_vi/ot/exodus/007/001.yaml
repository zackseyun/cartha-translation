id: EXO.7.1
reference: Exodus 7:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: vi
  text: 'Bấy giờ Yahweh phán với Môi-se: “Này, Ta đã lập con làm Đức Chúa Trời đối với Pha-ra-ôn[a], còn A-rôn, người anh em của con, sẽ làm nhà tiên tri của con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn ý: “như Đức Chúa Trời đối với Pha-ra-ôn.” Nguyên văn nói trực tiếp: “Ta đã lập con làm Đức Chúa Trời đối với Pha-ra-ôn,” trình bày Môi-se trong vai trò đại diện mang thẩm quyền của Đức Chúa Trời trước Pha-ra-ôn, còn A-rôn là nhà tiên tri của ông.'
    reason: Giải thích lối nói trực tiếp và mạnh của nguyên văn, đồng thời nêu cách diễn ý so sánh mà không xóa bỏ sự mơ hồ và căng thẳng thần học trong bản chính.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... phán
  rationale: Dạng động từ có waw liên tiếp đưa câu chuyện tiến sang sự việc kế tiếp. “Bấy giờ” diễn đạt tự nhiên trình tự ấy; “phán” phù hợp với lời nói của Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, qua đó giữ sự phân biệt có trong nguyên văn.
- source_word: רְאֵה
  choice: Này
  rationale: Mệnh lệnh này nhằm thu hút sự chú ý của Môi-se đến lời tuyên bố tiếp theo. Trong lời nói tiếng Việt, “Này” tự nhiên và trang trọng hơn cách dịch thị giác cứng nhắc “Hãy xem” ở ngữ cảnh này.
- source_word: נְתַתִּיךָ
  choice: Ta đã lập con làm
  rationale: Động từ có nghĩa cơ bản là “ban/đặt”, nhưng với bổ ngữ אֱלֹהִים, tiếng Việt cần cách diễn đạt kết quả. “Đã lập ... làm” giữ sắc thái chỉ định vai trò mà không hàm ý biến đổi bản thể.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Nguyên văn trực tiếp đặt אֱלֹהִים làm vị ngữ cho Môi-se trong quan hệ với Pha-ra-ôn, không có từ so sánh “như”. Bản dịch giữ cách nói mạnh và lạ của tiếng Hê-bơ-rơ, đồng thời chú thích vai trò đại diện.
- source_word: לְפַרְעֹה
  choice: đối với Pha-ra-ôn
  rationale: Giới từ לְ đánh dấu quan hệ của vai trò được trao cho Môi-se với Pha-ra-ôn. “Đối với” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: אָחִיךָ
  choice: người anh em của con
  rationale: Tiếng Hê-bơ-rơ chỉ nói “người anh/em trai của con” mà không tự nó xác định tuổi tác. Cách dịch này tránh tự ý quyết định A-rôn là anh hay em ngay trong câu.
- source_word: נְבִיאֶךָ
  choice: nhà tiên tri của con
  rationale: נָבִיא là từ thông thường chỉ nhà tiên tri. Giữ nguyên thuật ngữ này thay vì thu hẹp thành “người phát ngôn”, vì chính cấu trúc câu thiết lập quan hệ tương ứng giữa Môi-se và A-rôn.
theological_decisions:
- issue: Cách diễn đạt việc Môi-se được đặt làm אֱלֹהִים đối với Pha-ra-ôn
  choice: “làm Đức Chúa Trời đối với Pha-ra-ôn”, kèm chú thích giải thích vai trò đại diện
  alternative: “như Đức Chúa Trời đối với Pha-ra-ôn”
  rationale: Nguyên văn không có dấu hiệu so sánh tương ứng với “như”, nên bản chính giữ cách diễn đạt trực tiếp và sự căng thẳng thần học của câu. Ngữ cảnh—đặc biệt việc A-rôn làm “nhà tiên tri” của Môi-se—cho thấy đây là thẩm quyền và chức năng đại diện trước Pha-ra-ôn, chứ không khẳng định Môi-se mang thần tính về bản thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” thể hiện quan hệ giữa Yahweh và Môi-se. Tên riêng được phiên âm theo cách quen thuộc trong tiếng Việt. Câu giữ hình ảnh “Đức Chúa Trời—nhà tiên tri” của nguyên văn, không giản lược “nhà tiên tri” thành “người phát ngôn” và không thêm từ so sánh vào bản chính.
