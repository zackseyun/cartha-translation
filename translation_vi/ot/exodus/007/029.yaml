  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: vi
  text: Ếch sẽ tràn lên ngươi, trên dân ngươi[a] và trên mọi bề tôi của ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Giới từ Hê-bơ-rơ được lặp lại trong cả ba cụm. Cụm này cũng có thể dịch là “giữa dân ngươi”; nhưng trong bối cảnh tai họa, “trên dân ngươi” nhấn mạnh rằng ếch sẽ ập đến họ như một tai họa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה
  choice: lên người ngươi
  rationale: Giới từ בְּ đi với động từ עָלָה trong bối cảnh tai họa diễn tả ếch tràn lên và tác động trực tiếp đến Pha-ra-ôn; “lên người ngươi” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái cụ thể của chuyển động.
- source_word: וּבְעַמְּךָ
  choice: dân ngươi
  rationale: Trong chuỗi song song, tiếng Việt không cần lặp lại “lên người” trước danh từ tập thể; câu vẫn truyền đạt rằng ếch sẽ tràn đến dân của Pha-ra-ôn. Có thể hiểu sát hơn là “lên dân ngươi” hoặc theo nghĩa địa điểm là “giữa dân ngươi”.
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: tất cả bề tôi của ngươi
  rationale: עֶבֶד có thể chỉ đầy tớ, nô lệ hoặc quan chức phục vụ vua. Trong lời nói với Pha-ra-ôn, “bề tôi” là cách gọi rộng, phù hợp bối cảnh hoàng gia mà không khẳng định quá mức địa vị nô lệ.
- source_word: יַעֲלוּ
  choice: sẽ bò lên
  rationale: עָלָה có nghĩa là đi lên hoặc trồi lên. Với ếch, “bò lên” là cách diễn đạt tự nhiên, giữ hướng chuyển động từ sông lên và phù hợp với hành động của loài vật.
- source_word: הַצְפַרְדְּעִים
  choice: Ếch
  rationale: Danh từ có mạo từ xác định, chỉ đàn ếch thuộc tai họa đã được báo trước. Tiếng Việt tự nhiên dùng danh từ loài không cần từ chỉ định; ngữ cảnh vẫn bảo toàn tính xác định.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” giữ sắc thái của lời phán trực tiếp với Pha-ra-ôn; “bề tôi” phù hợp bối cảnh triều đình. Dấu chú thích [a] được đặt ngay sau cụm có vấn đề từ vựng.
