  text: וְ/לָקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וּ/מָשַׁחְתָּ֥ אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֛/וֹ וְ/אֶת כָּל כֵּלָ֖י/ו וְ/הָ֥יָה קֹֽדֶשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: vi
  text: Sau đó, con hãy lấy dầu xức và dùng dầu ấy xức cho Đền Tạm cùng mọi thứ ở trong đó. Con hãy thánh hiến Đền Tạm cùng mọi vật dụng của nó, và Đền Tạm sẽ trở nên thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là “thánh”, không phải “chí thánh”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Sau đó, con hãy lấy
  rationale: Dạng động từ có liên từ tiếp nối chuỗi chỉ thị; “sau đó” làm rõ trình tự, còn “hãy” truyền đạt lực mệnh lệnh. Đại từ “con” phù hợp với lời Đức Chúa Trời trực tiếp truyền cho Môi-se trong ngữ cảnh.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Cách gọi tự nhiên, gọn và quen thuộc trong tiếng Việt cho loại dầu dùng trong nghi thức xức để biệt riêng ra thánh.
- source_word: וּמָשַׁחְתָּ
  choice: mà xức cho
  rationale: Giữ nghĩa nghi lễ của משׁח và liên kết tự nhiên với “lấy dầu xức” trong tiếng Việt, tránh lặp từ nặng nề.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ tiếng Việt quen thuộc chỉ nơi thánh lưu động trong hoang mạc; vừa rõ ngữ cảnh thờ phượng vừa tránh cách dịch thuần từ nguyên kém tự nhiên.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: mọi thứ ở trong đó
  rationale: Diễn đạt đầy đủ phạm vi bao quát của cụm Hê-bơ-rơ bằng tiếng Việt hiện đại và dễ hiểu.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: Con hãy thánh hiến Đền Tạm
  rationale: “Thánh hiến” diễn đạt hành động biệt riêng cho mục đích thánh trong bối cảnh nghi lễ. Lặp lại “Đền Tạm” thay cho đại từ giúp câu tiếng Việt rõ chủ thể mà không thêm nội dung.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: cùng mọi vật dụng của nó
  rationale: כֵּלִים là từ rộng, chỉ các đồ vật và khí cụ thuộc Đền Tạm; “vật dụng” tự nhiên và không thu hẹp nghĩa như “đồ đựng”.
- source_word: וְהָיָה קֹדֶשׁ
  choice: và Đền Tạm sẽ nên thánh
  rationale: Giữ mệnh đề kết quả và mức độ đơn thuần “thánh” của קֹדֶשׁ, không tăng cường thành “chí thánh”.
theological_decisions:
- issue: Địa vị nghi lễ của Đền Tạm sau khi được xức dầu và thánh hiến
  choice: Đền Tạm sẽ nên thánh
  alternative: Đền Tạm sẽ trở nên chí thánh
  rationale: Bản Hê-bơ-rơ chỉ có קֹדֶשׁ, nghĩa là “thánh”, chứ không có cấu trúc קֹדֶשׁ קָדָשִׁים, nghĩa là “chí thánh”. Vì vậy bản dịch không đưa mức độ cao hơn từ các phân đoạn lân cận hay truyền thống giải nghĩa vào câu này.
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại, dễ hiểu. Dùng “Đền Tạm”, “dầu xức”, “thánh hiến” và “nên thánh” để giữ sắc thái nghi lễ mà không quá cổ hoặc mang dấu ấn hệ phái.
