  to: Sau đó, con hãy lấy dầu xức và dùng dầu ấy xức cho Đền Tạm cùng mọi thứ ở trong đó. Con hãy thánh hiến Đền Tạm cùng mọi vật dụng của nó, và Đền Tạm sẽ trở nên thánh.[a]
