  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Gia-vê[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; thường được phiên âm là “Yahweh” hoặc “Gia-vê”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Động từ có waw liên tiếp vừa đẩy câu chuyện tiến tới vừa mở đầu lời truyền phán. “Phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi Đức Chúa Trời nói.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng phiên âm đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu; chú thích nêu rõ dạng Hê-bơ-rơ và cách phiên âm khác.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với Môi-se”, “với” diễn đạt tự nhiên đối tượng tiếp nhận lời nói.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức Hê-bơ-rơ mở đầu nội dung lời nói được chuyển thành “rằng”, tự nhiên hơn “nói rằng” sau động từ “phán” mà vẫn giữ chức năng dẫn lời.
- source_word: וַ
  choice: Rồi
  rationale: Thể hiện bước tiếp diễn trong trình tự thuật chuyện; “Và” cũng có thể dùng, nhưng “Rồi” tự nhiên hơn tại đây.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản văn dùng trực tiếp danh bốn phụ âm YHWH. Bản dịch giữ đây là danh riêng, không thay bằng tước hiệu “CHÚA”; chú thích bảo tồn phương án phiên âm khác vì cách phát âm cổ không hoàn toàn chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán” phù hợp với công thức thuật lại lời Đức Chúa Trời; “rằng” dẫn sang nội dung trực tiếp ở câu kế tiếp. Dấu chú thích [a] đặt sau “Môi-se” theo lớp tham khảo tiếng Anh, dù nội dung chú thích giải thích danh “Đức Giê-hô-va”.
