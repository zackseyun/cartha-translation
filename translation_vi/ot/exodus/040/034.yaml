id: EXO.40.34
reference: Exodus 40:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: vi
  text: Bấy giờ, đám mây bao phủ Lều Hội Kiến, và vinh quang của Yahweh[a] tràn ngập Đền Tạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “CHÚA”; tiếng Hê-bơ-rơ dùng danh Đức Chúa Trời là יהוה (YHWH).
    reason: Nêu cách dịch truyền thống bằng tước hiệu và làm rõ rằng nguyên văn có danh riêng của Đức Chúa Trời.
lexical_decisions:
- source_word: וַיְכַס
  choice: Bấy giờ, … bao phủ
  rationale: Động từ כסה có nghĩa thông thường là “che phủ, bao phủ”; “bao phủ” giữ được hình ảnh cụ thể về đám mây phủ lấy công trình. “Bấy giờ” thể hiện chức năng tiếp diễn của waw trong mạch kể chuyện.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Danh từ có mạo từ xác định, chỉ đám mây cụ thể đã xuất hiện trong trình thuật Xuất Hành.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách dịch trang trọng, quen thuộc và tương đối sát nghĩa cho nơi được ấn định để gặp gỡ; đồng thời phân biệt cụm từ này với הַמִּשְׁכָּן ở cuối câu.
- source_word: כְבוֹד יְהוָה
  choice: vinh quang của Yahweh
  rationale: “Vinh quang” diễn đạt כָּבוֹד trong ngữ cảnh sự hiện diện huy hoàng được bày tỏ của Đức Chúa Trời; cấu trúc “của Yahweh” giữ nguyên quan hệ sở hữu của tiếng Hê-bơ-rơ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong bản Hê-bơ-rơ thay vì thay thế bằng một tước hiệu.
- source_word: מָלֵא
  choice: tràn ngập
  rationale: Trong cấu trúc này, מלא diễn tả vinh quang chiếm đầy Đền Tạm. “Tràn ngập” tự nhiên trong tiếng Việt và giữ sắc thái đầy trọn.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ chỉ công trình thánh trong sách Xuất Hành. “Đền Tạm” vừa giữ ý nơi ngự có tính di động, vừa phân biệt với “Lều Hội Kiến” trong cùng câu.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng danh riêng יהוה. Giữ “Yahweh” bảo tồn việc câu này gọi đích danh Đức Chúa Trời, thay vì âm thầm đổi thành tước hiệu; chú thích nêu cách thay thế truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Viết hoa “Lều Hội Kiến” và “Đền Tạm” như tên gọi chuyên biệt của hai cách quy chiếu đến thánh sở; giữ cấu trúc song hành của nguyên văn và đặt dấu chú thích ngay sau “Yahweh”, là từ mà chú thích giải thích.
