  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Môi-se bày bánh theo thứ tự trên bàn trước mặt Yahweh[a], đúng như Yahweh đã truyền cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong sự hiện diện của Yahweh.” Theo cách gọi truyền thống, loại bánh này được gọi là “bánh hiện diện.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: bày ... theo thứ tự
  rationale: Động từ ערך chỉ việc sắp đặt có trật tự; cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với việc đặt bánh theo nghi thức.
- source_word: עָלָיו
  choice: trên bàn
  rationale: Đại từ chỉ về chiếc bàn ở câu trước. Nêu rõ “bàn” giúp tiếng Việt tự nhiên mà không thêm một vật thể mới vào ngữ cảnh.
- source_word: עֵרֶךְ לֶחֶם
  choice: bánh theo thứ tự
  rationale: Cụm từ mô tả bánh được sắp đặt theo trật tự. Cách dịch này giữ được sắc thái cụ thể, không đồng nhất nó với thuật ngữ khác là לֶחֶם הַפָּנִים.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ nghĩa không gian-nghi lễ là ở trước hay trong sự hiện diện của Yahweh; “trước mặt” là cách nói tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng giao ước thay vì thay bằng một tước hiệu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: “Đúng như” nhấn mạnh sự làm theo chính xác mệnh lệnh đã được ban trước đó.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH; “Yahweh” bảo tồn chức năng danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của עֵרֶךְ לֶחֶם
  choice: bánh theo thứ tự
  alternative: bánh trưng bày; bánh hiện diện
  rationale: Câu này dùng cụm mô tả việc sắp bánh, không dùng thuật ngữ לֶחֶם הַפָּנִים; vì vậy không nên âm thầm nhập cách gọi truyền thống vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể Môi-se đã rõ từ mạch văn; nêu “trên bàn” thay cho đại từ để tránh cách nói tiếng Việt mơ hồ. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
