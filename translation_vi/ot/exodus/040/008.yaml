  terminology: Giữ “sân,” “cổng sân,” và “tấm màn che.” “Màn che” chuyển tải מָסָךְ là một tấm màn/hanging dùng để che lối vào, không áp đặt chất liệu hoặc chức năng quá cụ thể.
