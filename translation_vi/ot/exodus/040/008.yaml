    rationale: סָבִיב bổ nghĩa cho việc thiết lập sân theo vòng chung quanh. Trong tiếng Việt, “dựng sân chung quanh” truyền đạt ý này tự nhiên hơn; còn “bao quanh” thường đòi hỏi nêu rõ đối tượng bị bao quanh.
  revised_text: Con hãy dựng sân chung quanh, rồi treo tấm màn che ở cổng sân.
