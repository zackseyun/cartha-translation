translation:
  language: vi
  text: Con hãy dựng sân chung quanh, rồi treo tấm màn che ở cổng sân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Con hãy dựng
  rationale: Động từ שׂים có nghĩa rộng là đặt, để; trong bối cảnh dựng Đền Tạm, “dựng” diễn đạt tự nhiên việc thiết lập sân và các phần bao quanh.
- source_word: הֶחָצֵר
  choice: sân
  rationale: חָצֵר ở đây chỉ khu sân có rào bao quanh Đền Tạm; “sân” là cách gọi gọn, rõ và tự nhiên trong tiếng Việt hiện đại.
- source_word: סָבִיב
  choice: bao quanh
  rationale: Trạng từ này diễn tả vị trí vòng quanh; “bao quanh” truyền đạt đầy đủ ý nghĩa mà không cần thêm từ.
- source_word: וְנָתַתָּ
  choice: và treo
  rationale: נתן cơ bản có nghĩa là đặt; với מָסָךְ là một tấm vải tại lối vào, “treo” diễn đạt tự nhiên cách lắp đặt vật ấy trong ngữ cảnh.
- source_word: מָסַךְ
  choice: tấm màn
  rationale: מָסָךְ trong ngữ cảnh Đền Tạm là tấm vải che tại lối vào; “tấm màn” vừa cụ thể vừa không xác định quá mức chức năng hay chất liệu.
- source_word: שַׁעַר
  choice: cổng
  rationale: שַׁעַר chỉ lối ra vào của sân; “cổng” là từ tương ứng trực tiếp và vẫn phù hợp dù vật chắn cổng là một tấm màn.
- source_word: שַׁעַר הֶחָצֵר
  choice: cổng sân
  rationale: Cụm sở thuộc Hê-bơ-rơ xác định đây là cổng thuộc sân Đền Tạm; tiếng Việt tự nhiên dùng kết cấu gọn “cổng sân”.
