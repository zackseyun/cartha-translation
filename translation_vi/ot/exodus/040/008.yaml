  source_fidelity: 'Bản nháp giữ đúng hai mệnh lệnh và các yếu tố chính: dựng/thiết lập sân chung quanh, rồi đặt tấm màn tại cổng sân. Tuy nhiên, “dựng sân bao quanh” chưa tự nhiên vì “bao quanh” thường cần một bổ ngữ hoặc dễ gợi rằng chính cái sân bao quanh một đối tượng không được nêu. “Chung quanh” phản ánh סָבִיב sát hơn trong cấu trúc tiếng Việt này.'
