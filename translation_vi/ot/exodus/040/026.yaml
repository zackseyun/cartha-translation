  text: Ông đặt bàn thờ vàng trong Lều Hội Kiến, trước bức màn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ông đặt
  rationale: Dạng wayyiqtol của שׂוּם thuật lại hành động kế tiếp trong quá khứ. “Đặt” tự nhiên và phù hợp với việc bố trí cẩn thận các vật dụng thánh.
- source_word: מִזְבַּח הַזָּהָב
  choice: bàn thờ bằng vàng
  rationale: Cụm danh từ theo nghĩa sát là “bàn thờ của vàng”; “bàn thờ bằng vàng” diễn đạt rõ chất liệu trong tiếng Việt tự nhiên.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Đây là tên gọi quen thuộc của nơi thánh, nơi Đức Chúa Trời gặp dân Ngài; cách viết hoa cho thấy chức năng như một danh xưng.
- source_word: לִפְנֵי
  choice: phía trước
  rationale: Giới từ chỉ vị trí không gian tương quan với bức màn; “phía trước” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: הַפָּרֹכֶת
  choice: bức màn
  rationale: Từ này chỉ tấm màn phân cách bên trong Đền Tạm. “Bức màn” vừa chính xác theo vật thể vừa tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Thuật ngữ chỉ הַפָּרֹכֶת trong nơi thánh
  choice: bức màn
  alternative: màn che
  rationale: “Bức màn” bảo toàn nghĩa cụ thể của tấm ngăn bên trong Đền Tạm mà không thêm diễn giải thần học; “màn che” cũng có thể dùng nhưng kém tính danh định hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Chủ ngữ “ông” tiếp nối Môi-se từ ngữ cảnh gần; câu giữ trật tự thông tin và tính súc tích của tiếng Hê-bơ-rơ.
