  text: וַ/יִּקַּ֞ח וַ/יִּתֵּ֤ן אֶת הָ/עֵדֻת֙ אֶל הָ֣/אָרֹ֔ן וַ/יָּ֥שֶׂם אֶת הַ/בַּדִּ֖ים עַל הָ/אָרֹ֑ן וַ/יִּתֵּ֧ן אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָֽעְלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: vi
  text: Rồi ông lấy Bản Chứng Ước[a] và đặt vào Hòm, tra các đòn khiêng vào Hòm, rồi đặt nắp chuộc tội lên trên Hòm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “chứng ước”; đây là thuật ngữ Hê-bơ-rơ chỉ vật chứng của giao ước được đặt trong Hòm, có lẽ là các bảng đá.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: Chứng Ước
  rationale: Danh từ עֵדוּת nghĩa là “chứng ngôn/chứng cứ” và trong ngữ cảnh Đền Tạm là thuật ngữ chỉ vật chứng của giao ước được đặt trong Hòm, rất có thể là hai bảng đá. “Chứng Ước” giữ tính thuật ngữ và liên hệ giao ước mà không tự ý nêu rõ là các bảng đá.
- source_word: הָאָרֹן
  choice: Hòm
  rationale: אָרוֹן là chiếc hòm, trong ngữ cảnh này là Hòm thánh đã được xác định rõ. “Hòm” tự nhiên trong tiếng Việt và không thêm cụm “giao ước” vốn không có trong câu.
- source_word: הַבַּדִּים
  choice: các đòn khiêng
  rationale: בַּדִּים là những thanh dùng để khiêng Hòm. “Đòn khiêng” rõ chức năng và là cách nói tự nhiên trong tiếng Việt.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: כַּפֹּרֶת chỉ nắp bằng vàng đặt trên Hòm và mang ý nghĩa nghi lễ chuộc tội. “Nắp chuộc tội” vừa nhận diện đây là nắp Hòm vừa bảo toàn sắc thái thần học của thuật ngữ.
- source_word: מִלְמָעְלָה
  choice: lên trên Hòm
  rationale: Trạng từ này diễn tả vị trí phía trên. Trong tiếng Việt, “đặt ... lên trên Hòm” truyền đạt tự nhiên rằng nắp nằm trên mặt Hòm, không cần thêm đại từ ngoài văn bản.
- source_word: וַיִּתֵּן ... אֶל
  choice: đặt ... vào
  rationale: Trong ngữ cảnh thao tác vật lý, נתן đi với אֶל có nghĩa là đặt một vật vào bên trong.
- source_word: וַיָּשֶׂם ... עַל
  choice: tra ... vào
  rationale: Với các đòn khiêng của Hòm, tiếng Việt tự nhiên dùng “tra ... vào”, diễn tả việc đặt chúng vào đúng các khoen trên Hòm; ngữ cảnh trước đó đã quy định cấu tạo này.
theological_decisions:
- issue: Sở chỉ của הָעֵדֻת
  choice: Dùng thuật ngữ “Chứng Ước” cho vật chứng giao ước được đặt trong Hòm, rất có thể là các bảng đá, nhưng không nói rõ hơn nguyên văn.
  alternative: “hai bảng Chứng Ước” hoặc “chứng ngôn”
  rationale: Câu mô tả một vật cụ thể được đặt vào Hòm, nhưng tiếng Hê-bơ-rơ chỉ dùng thuật ngữ עֵדוּת chứ không gọi đích danh các bảng đá. Bản dịch bảo toàn cả tính cụ thể lẫn sự không xác định này.
- issue: Cách dịch כַּפֹּרֶת
  choice: nắp chuộc tội
  alternative: nắp thi ân; nắp xá tội; nắp Hòm
  rationale: Từ này gọi tên vật nghi lễ đặc thù trên Hòm. “Nắp chuộc tội” thể hiện cả hình dạng/chức năng vật lý lẫn ý nghĩa nghi lễ, nhưng không diễn giải thêm cơ chế thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Viết hoa “Chứng Ước” và “Hòm” để biểu thị các vật/thuật ngữ thánh đã được xác định trong ngữ cảnh. Dùng “tra các đòn khiêng vào Hòm” thay cho cách dịch máy móc “đặt ... trên Hòm”, vì đây là cách diễn đạt tự nhiên về việc lắp đòn khiêng vào các khoen của Hòm.
