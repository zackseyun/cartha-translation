id: EXO.40.38
reference: Exodus 40:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: vi
  text: Vì ban ngày, đám mây của Yahweh ở trên Đền Tạm, còn ban đêm có lửa trong đó[a], trước mắt toàn thể nhà Israel, suốt mọi chặng đường họ đi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trong đó” có thể chỉ đám mây hoặc Đền Tạm.
    reason: referential_ambiguity
  - marker: b
    text: 'Cũng có thể dịch: “trong mọi cuộc hành trình của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Liên từ mở đầu lời giải thích tổng kết cho trình thuật ngay trước đó; “Vì” giữ được quan hệ diễn ngôn mà không làm câu nặng nề.
- source_word: עֲנַן יְהוָה
  choice: đám mây của Yahweh
  rationale: Giữ quan hệ sở hữu trong cấu trúc Hê-bơ-rơ và gắn đám mây với sự hiện diện của Yahweh mà không diễn giải thêm.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Cách gọi quen thuộc, ngắn gọn và rõ nghĩa trong tiếng Việt đối với nơi thánh di động của Israel; viết hoa để chỉ công trình cụ thể trong ngữ cảnh.
- source_word: יוֹמָם ... לַיְלָה
  choice: ban ngày ... ban đêm
  rationale: Thể hiện tự nhiên cặp thời gian song song trong nguyên văn.
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: còn ban đêm có lửa trong đó
  rationale: “Có lửa” diễn đạt tự nhiên động từ היה trong lời tổng kết về tình trạng lặp lại; “trong đó” giữ đại từ chỉ nơi chốn mà không quyết định dứt khoát nó quy chiếu đến đám mây hay Đền Tạm.
- source_word: לְעֵינֵי כָל בֵּית יִשְׂרָאֵל
  choice: trước mắt toàn thể nhà Israel
  rationale: Giữ hình ảnh cụ thể “trước mắt” và cách gọi mang tính cộng đồng giao ước “nhà Israel”.
- source_word: בְּכָל מַסְעֵיהֶם
  choice: suốt mọi chặng đường họ đi
  rationale: מַסָּע có thể chỉ hành trình hoặc từng chặng di chuyển; cách dịch này vừa tự nhiên vừa phản ánh tính liên tục trong toàn bộ cuộc hành trình.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng của Đức Chúa Trời; phiên âm “Yahweh” bảo tồn chức năng của danh này thay vì thay bằng tước hiệu.
- issue: Đối tượng mà ngọn lửa ở “trong đó”
  choice: Giữ đại từ “trong đó” và chú thích tính mơ hồ
  alternative: “trong đám mây” hoặc “trong Đền Tạm”
  rationale: Hậu tố giống đực số ít בּוֹ có thể quy chiếu về עָנָן “đám mây” hoặc מִשְׁכָּן “Đền Tạm”; không nên âm thầm giải quyết một điểm mà ngữ pháp vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “còn” để làm rõ thế song song giữa ban ngày và ban đêm; giữ thành ngữ “trước mắt” và danh xưng tập thể “nhà Israel” nhằm bảo tồn sắc thái của nguyên văn.
