revisions:
- from: Ngươi phải đem chiếc bàn vào và sắp đặt những vật thuộc về bàn; rồi đem chân đèn vào và thắp các ngọn đèn của nó.[a]
  to: Ngươi phải đem cái bàn vào và sắp đặt đồ bày trên bàn; rồi đem chân đèn vào và thắp các ngọn đèn của nó.[a]
  rationale: 'Sửa nhẹ cụm chỉ phần bài trí của bàn cho tự nhiên và sát ngữ cảnh hơn. Sửa chú thích để phản ánh trung lập sự mơ hồ của động từ Hiphil עלה với đèn: có thể nói đến việc đặt/sắp các đèn, hoặc làm cho ngọn lửa bốc lên. Không thay đổi trình tự, chủ thể, hay ý nghĩa cơ bản của câu.'
  reviewer_model: gpt-5.6-terra
