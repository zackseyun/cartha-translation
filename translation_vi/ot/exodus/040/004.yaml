  yaml_path: translation/ot/exodus/040/004.yaml
  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: vi
  text: Ngươi phải đem cái bàn vào và sắp đặt đồ bày trên bàn; rồi đem chân đèn vào và thắp các ngọn đèn của nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “đặt các ngọn đèn của nó”. Động từ Hê-bơ-rơ theo nghĩa đen là “làm cho đi lên”; khi dùng với đèn, nó có thể chỉ việc làm cho ngọn lửa bốc lên, tức là thắp đèn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: ngươi phải đem ... vào
  rationale: Dạng Hiphil của בוא trong chỉ thị dựng Đền Tạm diễn tả việc đưa các vật dụng vào bên trong nơi thánh. “Đem ... vào” tự nhiên và thể hiện đúng hướng chuyển động được ngữ cảnh hàm ý.
- source_word: הַשֻּׁלְחָן
  choice: chiếc bàn
  rationale: Danh từ chỉ đơn giản là “bàn”. Không thêm “bánh Hiện Diện” vì tên gọi cụ thể ấy không xuất hiện trong câu này.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: sắp đặt những vật thuộc về bàn
  rationale: Cấu trúc đồng căn ערך ... ערך nói đến việc sắp xếp phần bài trí theo quy định của bàn. Cách dịch này tránh lối dịch cứng “sắp xếp sự sắp xếp của nó” nhưng không xác định quá mức các vật ấy.
- source_word: הַמְּנֹרָה
  choice: chân đèn
  rationale: “Chân đèn” chuyển tải nghĩa của danh từ thông dụng מְנוֹרָה rõ ràng hơn việc phiên âm “menorah” và phù hợp văn phong tiếng Việt hiện đại.
- source_word: וְהַעֲלֵיתָ
  choice: thắp
  rationale: Hiphil của עלה với נרות theo thành ngữ có thể chỉ việc làm cho ngọn lửa bốc lên, tức thắp đèn. Đây là cách hiểu tự nhiên trong tiếng Việt; sắc thái có thể liên quan đến việc đặt hoặc dựng các ngọn đèn được giữ trong chú thích.
- source_word: נֵרֹתֶיהָ
  choice: các ngọn đèn của nó
  rationale: נֵר có thể chỉ đèn hoặc ngọn lửa đèn. Trong quan hệ với chân đèn, “các ngọn đèn của nó” vừa rõ vừa giữ được hình ảnh cụ thể.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu. Dùng “ngươi” để giữ lối xưng hô số ít trực tiếp với Môi-se; dùng “rồi” để diễn đạt tự nhiên chuỗi chỉ thị mà không làm thay đổi quan hệ cú pháp.
