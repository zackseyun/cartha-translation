  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: vi
  text: Hãy đặt bàn thờ dâng lễ thiêu trước lối vào Đền Tạm, tức Lều Hội Kiến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָתַתָּה
  choice: Con hãy đặt
  rationale: Động từ נתן trong ngữ cảnh sắp xếp các vật dụng mang nghĩa “đặt, để”; thể mệnh lệnh gián tiếp được diễn đạt tự nhiên bằng “hãy đặt”.
- source_word: מִזְבַּח הָ/עֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: Cụm liên kết chỉ bàn thờ dùng cho עֹלָה, lễ vật được thiêu trọn; cách dịch này rõ chức năng và tự nhiên trong tiếng Việt.
- source_word: לִ/פְנֵי
  choice: trước
  rationale: Giữ nghĩa không gian trực tiếp “ở phía trước” trong chỉ dẫn bố trí.
- source_word: פֶּתַח
  choice: lối vào
  rationale: פֶּתַח là chỗ mở dùng để đi vào; “lối vào” tự nhiên và rõ hơn “cửa” đối với kết cấu lều.
- source_word: מִשְׁכַּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ chỉ nơi ngự thánh lưu động trong Xuất Hành; “Đền Tạm” là cách gọi tiếng Việt ngắn gọn, quen thuộc và phân biệt với אֹהֶל.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cụm danh xưng cố định chỉ chiếc lều nơi diễn ra cuộc gặp đã định; “Lều Hội Kiến” giữ cả hình ảnh lều và ý gặp gỡ.
theological_decisions:
- issue: Quan hệ giữa מִשְׁכַּן và אֹהֶל מוֹעֵד
  choice: 'Diễn đạt đồng vị bằng “tức là”: “Đền Tạm, tức là Lều Hội Kiến”'
  alternative: “Đền Tạm của Lều Hội Kiến” hoặc xem đây là hai cấu trúc riêng biệt
  rationale: Trong câu này, chuỗi “מִשְׁכַּן אֹהֶל מוֹעֵד” tự nhiên nhất được hiểu là hai danh xưng đồng vị cho nơi thánh; “tức là” làm rõ quan hệ cú pháp mà không thêm một phân biệt thần học không có trong văn bản.
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại; dùng “con” theo lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh. Viết hoa các danh xưng Đền Tạm và Lều Hội Kiến để thể hiện thuật ngữ riêng, không dùng từ cổ khó hiểu.
