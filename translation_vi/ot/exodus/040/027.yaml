  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Ông đốt hương thơm trên bàn thờ ấy[a], đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hương pha từ các hương liệu thơm” hoặc “hương thơm từ các loại gia vị”; cụm từ Hê-bơ-rơ chỉ hương được làm từ các chất thơm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: đốt
  rationale: Dạng Hiphil của קטר ở đây chỉ việc làm cho hương cháy và tỏa khói trên bàn thờ; “đốt” là cách diễn đạt tự nhiên, gọn và rõ trong tiếng Việt.
- source_word: עָלָיו
  choice: trên bàn thờ ấy
  rationale: Đại từ giống đực số ít chỉ bàn thờ xông hương trong văn cảnh. Lặp lại danh từ giúp câu tiếng Việt rõ nghĩa hơn “trên đó” mà không thêm nội dung mới.
- source_word: קְטֹרֶת סַמִּים
  choice: hương thơm
  rationale: Cụm từ chỉ loại hương làm từ các hương liệu thơm. “Hương thơm” tự nhiên trong tiếng Việt và giữ được cả ý hương dùng trong nghi lễ lẫn đặc tính thơm.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả hành động hoàn toàn phù hợp với mệnh lệnh đã ban.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Đã truyền” thể hiện mệnh lệnh có trước hành động đang được thuật lại và phù hợp với văn phong Kinh Thánh hiện đại.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh xưng quen thuộc trong tiếng Việt để biểu thị trực tiếp danh riêng יהוה, thay vì thay bằng tước hiệu “Chúa”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng đã quen thuộc với độc giả Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Danh Bốn Chữ. “Đức Giê-hô-va” bảo tồn danh riêng trong dạng quen thuộc với độc giả Việt và tránh thay danh ấy bằng một tước hiệu.
- issue: Chủ thể của động từ וַיַּקְטֵר
  choice: Ông
  alternative: Môi-se
  rationale: Tiếng Hê-bơ-rơ chỉ đánh dấu chủ thể ngôi thứ ba số ít, còn văn cảnh nhận diện người ấy là Môi-se. Dùng “ông” giữ cấu trúc quy chiếu của nguyên văn, không lặp tên khi bản văn không lặp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bàn thờ ấy” làm rõ vật quy chiếu từ văn cảnh; dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
