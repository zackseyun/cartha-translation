  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: vi
  text: Ngươi phải đặt bồn giữa Lều Hội Kiến và bàn thờ, rồi đổ nước vào đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Ngươi phải đặt
  rationale: Động từ נָתַן có nghĩa rộng là “đưa, để, đặt”. Trong chỉ thị về vị trí của một vật dụng thờ phượng, “đặt” diễn đạt tự nhiên và chính xác hành động sắp xếp có chủ ý.
- source_word: הַכִּיֹּר
  choice: cái bồn
  rationale: כִּיּוֹר chỉ chiếc bồn dùng để chứa nước phục vụ việc thanh tẩy trong Đền Tạm. “Cái bồn” là cách gọi rõ ràng, hiện đại; ngữ cảnh đã xác định vật này nên không cần thêm ý “rửa” vốn không có ngay trong danh từ.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: giữa Lều Hội Kiến và bàn thờ
  rationale: Cấu trúc בֵּין...וּבֵין xác định vị trí giữa hai nơi/vật. “Lều Hội Kiến” là cách dịch trang trọng, quen thuộc và trong sáng của אֹהֶל מוֹעֵד; “bàn thờ” tương ứng trực tiếp với מִזְבֵּחַ.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: rồi đổ nước vào đó
  rationale: Nguyên văn nói sát là “và ngươi phải đặt nước ở đó”. Trong tiếng Việt, đối với nước và chiếc bồn vừa nhắc đến, “đổ nước vào đó” là cách diễn đạt tự nhiên; “đó” giữ lại ý chỉ nơi chốn của שָׁם và quy chiếu rõ đến cái bồn.
theological_decisions: []
translation_notes:
  register: Dùng văn phong chỉ thị trang trọng nhưng dễ hiểu. Đại từ “ngươi” phù hợp lời Đức Chúa Trời truyền trực tiếp cho Môi-se trong mạch văn; câu tiếng Việt gọn và tự nhiên. Viết hoa “Lều Hội Kiến” như tên gọi quy ước của nơi thờ phượng, không hàm thêm diễn giải thần học.
