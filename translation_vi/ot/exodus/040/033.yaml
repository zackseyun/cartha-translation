base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: vi
  text: Rồi ông dựng sân bao quanh Đền Tạm và bàn thờ, và treo tấm màn[a] ở cổng sân. Thế là Môi-se hoàn tất công việc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “rèm” hoặc “màn che”; từ Hê-bơ-rơ מָסַךְ chỉ tấm vải che ở lối vào sân.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: dựng
  rationale: Trong bối cảnh dựng Đền Tạm, dạng Hiphil của קום chỉ việc dựng hoặc thiết lập một công trình; “dựng” tự nhiên và gọn trong tiếng Việt.
- source_word: הֶחָצֵר
  choice: sân
  rationale: חָצֵר ở đây là khu sân có rào bao quanh Đền Tạm. “Sân” rõ nghĩa trong ngữ cảnh này và tránh sắc thái pháp đình của “triều đình” hay “tòa”.
- source_word: סָבִיב
  choice: bao quanh
  rationale: Từ này diễn tả sân được dựng vòng quanh Đền Tạm và bàn thờ.
- source_word: לַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן là tên gọi chuyên biệt của nơi thánh dạng lều trong Xuất Ai Cập; “Đền Tạm” là cách gọi trang trọng, quen thuộc và dễ hiểu trong tiếng Việt.
- source_word: וְלַמִּזְבֵּחַ
  choice: và bàn thờ
  rationale: Cách dịch trực tiếp, giữ bàn thờ cùng với Đền Tạm là hai đối tượng được sân bao quanh.
- source_word: וַיִּתֵּן
  choice: treo
  rationale: Nghĩa cơ bản là “đặt”, nhưng với một tấm vải che ở cổng, “treo” diễn đạt tự nhiên hành động lắp đặt mà ngữ cảnh đòi hỏi.
- source_word: מָסַךְ
  choice: tấm màn
  rationale: מָסַךְ chỉ một tấm vải dùng để che lối vào. “Tấm màn” vừa tự nhiên vừa giữ được tính chất bằng vải; chú thích nêu các khả năng diễn đạt gần nghĩa.
- source_word: שַׁעַר הֶחָצֵר
  choice: cổng sân
  rationale: Cụm danh từ chỉ lối vào khu sân bên ngoài; “cổng sân” sát nghĩa và ngắn gọn.
- source_word: וַיְכַל
  choice: hoàn tất
  rationale: כלה ở đây đánh dấu việc toàn bộ nhiệm vụ xây dựng đã được làm xong; “hoàn tất” phù hợp với giọng văn trang trọng.
- source_word: הַמְּלָאכָה
  choice: công việc
  rationale: מְלָאכָה tổng kết toàn bộ công việc dựng và sắp đặt Đền Tạm; “công việc” là cách diễn đạt bao quát, tự nhiên.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “ông” duy trì chủ thể Môi-se từ ngữ cảnh trước, còn tên “Môi-se” được nêu ở mệnh đề kết như nguyên văn. Dấu chú thích được đặt ngay sau “tấm màn”, là từ mà chú thích giải thích.
