base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: vi
  text: Môi-se làm theo mọi điều Yahweh[a] đã truyền cho ông; ông làm đúng như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống được dịch là “ĐỨC CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: làm theo
  rationale: Động từ עשה có nghĩa rộng là “làm, thực hiện”. Đi với כְּכֹל trong ngữ cảnh này, “làm theo” diễn đạt tự nhiên việc Môi-se thực hiện đúng mệnh lệnh.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: כְּכֹל
  choice: mọi điều
  rationale: Cụm כְּכֹל nhấn mạnh sự phù hợp trọn vẹn với toàn bộ điều đã được truyền; kết hợp với “làm theo” tạo thành câu tiếng Việt tự nhiên.
- source_word: אֲשֶׁר
  choice: điều
  rationale: Đại từ quan hệ nối “mọi” với nội dung Yahweh đã truyền, được diễn đạt tự nhiên bằng “mọi điều ...” trong tiếng Việt.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Truyền” phù hợp với hành động ban mệnh lệnh; “đã” làm rõ mệnh lệnh có trước việc Môi-se thi hành mà không thay đổi ý nghĩa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֹתוֹ
  choice: cho ông
  rationale: Dấu chỉ tân ngữ cùng hậu tố ngôi ba số ít giống đực quy chiếu về Môi-se; với động từ “truyền”, tiếng Việt tự nhiên dùng “truyền cho ông”.
- source_word: כֵּן
  choice: đúng như vậy
  rationale: Trạng từ này nhắc lại và nhấn mạnh sự tương ứng chính xác giữa mệnh lệnh và việc thi hành.
- source_word: עָשָׂה
  choice: ông làm
  rationale: Giữ sự lặp lại của động từ עשה trong nguyên văn, qua đó bảo tồn điểm nhấn tu từ về sự vâng phục của Môi-se.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Phiên âm “Yahweh” bảo tồn đây là danh riêng, còn cách thay bằng “ĐỨC CHÚA” được ghi nhận trong chú thích như lối dịch truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ sự lặp lại có chủ ý của “làm” trong tiếng Hê-bơ-rơ, đồng thời dùng “làm theo” và “đúng như vậy” để diễn đạt rõ sự thi hành hoàn toàn đúng mệnh lệnh.
