  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: vi
  text: Mỗi khi đám mây từ trên Đền Tạm được cất lên, con dân Y-sơ-ra-ên lại lên đường trong mọi chặng đường của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְהֵעָלֹת הֶעָנָן
  choice: Mỗi khi đám mây cất lên
  rationale: Cấu trúc giới từ với động từ nguyên mẫu diễn tả hoàn cảnh thời gian lặp lại. “Mỗi khi” thể hiện tính thường lệ; “cất lên” giữ nét nghĩa đám mây đi lên mà không hàm ý rõ một tác nhân nâng nó.
- source_word: מֵעַל הַמִּשְׁכָּן
  choice: khỏi Đền Tạm
  rationale: מֵעַל chỉ chuyển động rời khỏi vị trí ở phía trên. “Khỏi” tự nhiên trong tiếng Việt; “Đền Tạm” là thuật ngữ quen thuộc chỉ nơi thánh lưu động, dù מִשְׁכָּן theo nghĩa sát là “nơi ngự”.
- source_word: יִסְעוּ
  choice: lại lên đường
  rationale: Dạng chưa hoàn thành trong ngữ cảnh này chỉ hành động thường lệ. “Lại” phối hợp với “mỗi khi” để diễn đạt sự lặp lại, còn “lên đường” truyền đạt đúng ý rời trại để tiếp tục hành trình.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Y-sơ-ra-ên,” nhưng ở đây là danh xưng tập thể chỉ dân Y-sơ-ra-ên. “Con dân Y-sơ-ra-ên” tự nhiên, trang trọng và không làm người đọc hiện đại hiểu lầm rằng chỉ nam giới lên đường.
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: trong mọi chặng hành trình của họ
  rationale: מַסַּע có thể chỉ cuộc hành trình hoặc từng chặng di chuyển. Số nhiều trong văn cảnh hành trình hoang mạc được diễn đạt tự nhiên là “mọi chặng hành trình,” đồng thời giữ từ “mọi” tương ứng với כֹּל.
theological_decisions:
- issue: Danh xưng tập thể בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên
  rationale: Cụm từ có hình thức giống đực nhưng thường dùng như danh xưng tập thể cho toàn dân. Bản dịch chính truyền đạt phạm vi tập thể theo ngữ cảnh mà không đưa thêm lập trường giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đền Tạm” và “Y-sơ-ra-ên” theo lối gọi Kinh Thánh quen thuộc; cấu trúc “mỗi khi… lại…” diễn đạt rõ tính lặp lại của câu Hê-bơ-rơ.
