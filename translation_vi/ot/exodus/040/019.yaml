  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Rồi ông giăng lều trên Đền Tạm và đặt tấm phủ của lều lên trên nó, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: giăng
  rationale: Động từ פרשׂ diễn tả việc trải hoặc giăng một vật phủ; “giăng” tự nhiên trong ngữ cảnh dựng lều và vẫn gần với hành động được mô tả.
- source_word: הָאֹהֶל
  choice: tấm lều phủ
  rationale: אֹהֶל thường là “lều”, nhưng tại đây chỉ lớp lều được giăng trên משכן. “Tấm lều phủ” làm rõ chức năng trong ngữ cảnh, đồng thời vẫn phân biệt với מִכְסֶה là lớp phủ ngoài.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: משכן là nơi ngự thiêng liêng có thể tháo lắp trong sách Xuất Hành. “Đền Tạm” là cách gọi tiếng Việt quen thuộc, trang trọng và phân biệt công trình này với lớp lều phủ bên trên.
- source_word: וַיָּשֶׂם
  choice: đặt
  rationale: שׂים là động từ thông dụng nghĩa là đặt hoặc để; “đặt” phù hợp với văn phong hiện đại và hành động lắp dựng.
- source_word: מִכְסֵה הָאֹהֶל
  choice: tấm phủ của lều
  rationale: Cách dịch trực tiếp cụm sở hữu này, giữ rõ sự phân biệt giữa אֹהֶל, lớp lều, và מִכְסֶה, tấm phủ ngoài.
- source_word: עָלָיו מִלְמָעְלָה
  choice: lên trên
  rationale: Hai yếu tố chỉ vị trí cùng nhấn mạnh rằng tấm phủ được đặt ở phần trên của kết cấu. “Lên trên” chuyển tải ý này tự nhiên mà không tạo câu tiếng Việt nặng nề.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: “Đúng như” thể hiện sự tương ứng được nhấn mạnh bởi כַּאֲשֶׁר; “đã truyền” chỉ mệnh lệnh có trước hành động thi hành.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được viết bằng Tứ Tự, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יְהוָה; “Yahweh” bảo toàn chức năng danh riêng mà không thay bằng tước hiệu hay chọn dạng phiên âm truyền thống khác.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng. Dùng “Đền Tạm” theo cách gọi Kinh Thánh tiếng Việt quen thuộc; thêm “phủ” sau “tấm lều” để người đọc nhận ra đây là lớp vật liệu đặt trên kết cấu, nhưng vẫn giữ riêng “tấm phủ” cho מִכְסֶה.
