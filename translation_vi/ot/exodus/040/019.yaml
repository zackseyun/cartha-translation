revisions:
- from: Rồi ông giăng tấm lều phủ trên Đền Tạm và đặt tấm phủ của lều lên trên, đúng như Yahweh đã truyền cho Môi-se.
  to: Rồi ông giăng lều trên Đền Tạm và đặt tấm phủ của lều lên trên nó, đúng như Yahweh đã truyền cho Môi-se.
  rationale: Bỏ yếu tố diễn giải “phủ” khỏi “lều” để phản ánh trực tiếp אֹהֶל và bảo toàn tương phản với מִכְסֶה. Thêm “nó” sau “lên trên” để chuyển tải đại từ עָלָיו mà vẫn không vượt quá mức độ xác định của câu tiếng Hê-bơ-rơ. “Đúng như Yahweh đã truyền cho Môi-se” phản ánh chính xác công thức כַּאֲשֶׁר צִוָּה יהוה אֶת־מֹשֶׁה.
  reviewer_model: gpt-5.6-terra
