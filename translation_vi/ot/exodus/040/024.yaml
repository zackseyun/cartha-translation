  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: vi
  text: Ông đặt chân đèn trong Lều Hội Kiến, đối diện với bàn, ở phía nam Đền Tạm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ông đặt
  rationale: Động từ שׂים ở dạng kể chuyện chỉ một hành động đã hoàn tất; “đặt” tự nhiên và phù hợp với việc sắp xếp các vật dụng thánh.
- source_word: הַמְּנֹרָה
  choice: chân đèn
  rationale: מְנוֹרָה chỉ giá đèn dùng trong nghi lễ, không phải chỉ một ngọn đèn; “chân đèn” diễn đạt rõ chức năng mà không cần phiên âm.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Cụm từ chỉ nơi gặp gỡ giữa Đức Chúa Trời và con người; “Lều Hội Kiến” là cách gọi trang trọng, rõ nghĩa và thích hợp để dùng nhất quán.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: đối diện với bàn
  rationale: נֹכַח biểu thị vị trí ở phía đối diện hoặc trước mặt; “đối diện với” giữ được quan hệ không gian tự nhiên trong tiếng Việt.
- source_word: הַשֻּׁלְחָן
  choice: bàn
  rationale: Bản Hê-bơ-rơ chỉ nói “cái bàn”; không thêm chức năng hoặc loại bánh mà câu này không nêu.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: ở phía … Đền Tạm
  rationale: יֶרֶךְ theo nghĩa không gian là cạnh hoặc bên; kết hợp với hướng ở cuối câu, tiếng Việt tự nhiên diễn đạt là “ở phía nam Đền Tạm”.
- source_word: נֶגְבָּה
  choice: nam
  rationale: Dạng chỉ hướng xác định vị trí về phía nam; trong câu này “phía nam” là cách diễn đạt tự nhiên.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן là nơi ngự có cấu trúc thánh trong Xuất Ai Cập; “Đền Tạm” là thuật ngữ tiếng Việt quen thuộc và phân biệt với Lều Hội Kiến trong chính câu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chủ ngữ “Ông” nối với Môi-se trong văn mạch. Giữ trật tự các vị trí gần với tiếng Hê-bơ-rơ. Không đặt chú thích vì cách dịch “đối diện với” tự nó bao quát thích đáng ý nghĩa không gian của נֹכַח; chú thích tiếng Anh được cung cấp dường như lặp lại chính lựa chọn trong câu hơn là nêu một phương án khác biệt thực chất.
