  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: vi
  text: Nhưng nếu đám mây không cất lên, họ không lên đường cho đến ngày đám mây cất lên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Liên từ kết hợp với tiểu từ điều kiện, tạo sự tương phản với trường hợp ở câu trước; “Nhưng nếu” diễn đạt tự nhiên mạch đối lập này.
- source_word: לֹא יֵעָלֶה
  choice: không cất lên
  rationale: Động từ עלה ở đây mô tả đám mây rời lên khỏi Đền Tạm; “cất lên” vừa sát nghĩa “đi lên” vừa phù hợp văn cảnh, mà không áp đặt sắc thái bị động.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Danh từ xác định chỉ đám mây đã được xác lập trong văn cảnh là dấu hiệu về sự hiện diện của Đức Chúa Trời.
- source_word: וְלֹא יִסְעוּ
  choice: họ không lên đường
  rationale: Trong bối cảnh hành trình và đóng trại, נסע chỉ việc rời nơi đóng trại để tiếp tục hành trình; “lên đường” là cách nói tự nhiên, gọn và chính xác trong tiếng Việt.
- source_word: עַד יוֹם
  choice: cho đến ngày
  rationale: Giữ nguyên danh từ “ngày” của tiếng Hê-bơ-rơ thay vì khái quát hóa thành “lúc” hay “thời điểm”.
- source_word: הֵעָלֹתוֹ
  choice: đám mây cất lên
  rationale: Nguyên văn là động từ nguyên mẫu kết hợp hậu tố ngôi thứ ba số ít giống đực, theo nghĩa đen là “sự cất lên của nó”; lặp lại “đám mây” giúp tiếng Việt rõ nghĩa và tránh đại từ “nó” kém trang trọng.
