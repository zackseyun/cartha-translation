  text: וְ/אֵת֙ מִזְבַּ֣ח הָ/עֹלָ֔ה שָׂ֕ם פֶּ֖תַח מִשְׁכַּ֣ן אֹֽהֶל מוֹעֵ֑ד וַ/יַּ֣עַל עָלָ֗י/ו אֶת הָ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Ông đặt bàn thờ của lễ thiêu tại lối vào Đền Tạm, tức Lều Hội Kiến, rồi dâng lên đó lễ thiêu và lễ vật ngũ cốc, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: Cụm từ chỉ bàn thờ theo chức năng tế lễ chính; cách dịch này tự nhiên trong tiếng Việt và giữ rõ thuật ngữ עֹלָה.
- source_word: שָׂם
  choice: đặt
  rationale: Diễn đạt trực tiếp hành động bố trí bàn thờ trong bối cảnh dựng Đền Tạm.
- source_word: פֶּתַח
  choice: ở lối vào
  rationale: Phản ánh nghĩa chỉ cửa hay lối vào và diễn đạt vị trí một cách tự nhiên.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: Đền Tạm, tức Lều Hội Kiến
  rationale: Giữ cả hai danh xưng trong cụm Hê-bơ-rơ, đồng thời dùng “tức” để câu tiếng Việt rõ và tự nhiên mà không đồng nhất khái niệm quá mức.
- source_word: וַיַּעַל עָלָיו
  choice: rồi dâng trên đó
  rationale: Trong ngữ cảnh tế lễ, עלה mang nghĩa chuyên biệt là dâng lễ; “trên đó” giữ bàn thờ làm địa điểm của hành động.
- source_word: הָעֹלָה
  choice: lễ thiêu
  rationale: Thuật ngữ ngắn gọn, rõ nghĩa cho sinh tế được thiêu trên bàn thờ.
- source_word: הַמִּנְחָה
  choice: lễ phẩm
  rationale: מִנְחָה có nghĩa cơ bản là lễ vật hay lễ phẩm; trong luật tế lễ thường là lễ phẩm bằng ngũ cốc. “Lễ phẩm” giữ được độ rộng từ vựng của nguyên văn mà không thêm thành phần không được nêu ngay trong câu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: “Đúng như” nhấn mạnh sự làm theo trọn vẹn; “đã truyền” thể hiện mệnh lệnh có trước hành động được thuật lại.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng.
- issue: Phạm vi nghĩa của הַמִּנְחָה
  choice: lễ phẩm
  alternative: lễ phẩm ngũ cốc
  rationale: Trong văn mạch tư tế, từ này thường chỉ lễ phẩm làm từ ngũ cốc, nhưng bản thân từ có nghĩa rộng hơn. Bản dịch chính giữ cách gọi gọn và không bổ sung chất liệu vốn không được nói rõ trong câu này.
translation_notes:
  register: Văn phong tường thuật trang trọng nhưng hiện đại, dùng thuật ngữ quen thuộc “Đền Tạm”, “Lều Hội Kiến”, “bàn thờ”, “lễ thiêu”. Đại từ “ông” có chủ thể là Môi-se từ văn cảnh trước. Câu được sắp xếp theo trình tự nguyên văn nhưng tránh cấu trúc nặng nề.
