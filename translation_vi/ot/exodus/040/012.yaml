  register: Văn phong mệnh lệnh trang trọng nhưng tự nhiên, dễ hiểu đối với độc giả tiếng Việt hiện đại. Giữ hình ảnh 'đưa đến gần' của nguyên văn và thuật ngữ nghi lễ 'Lều Hội Kiến'.
