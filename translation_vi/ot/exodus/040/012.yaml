base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: vi
  text: Rồi hãy đưa A-rôn và các con trai ông đến gần lối vào Lều Hội Kiến, và lấy nước rửa cho họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: hãy đưa ... đến gần
  rationale: Thể Hiphil của קרב mang nghĩa khiến ai đó đến gần hoặc đưa đến gần; cách dịch này giữ được sắc thái sai khiến và bối cảnh nghi lễ.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Phiên âm tên riêng theo lối viết quen thuộc trong tiếng Việt.
- source_word: בָּנָיו
  choice: các con trai ông
  rationale: Danh từ Hê-bơ-rơ chỉ rõ con trai, phù hợp với bối cảnh chức tế lễ của A-rôn và các con trai.
- source_word: פֶּתַח
  choice: lối vào
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, chỉ nơi ra vào của Lều.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách dịch trang trọng, quen thuộc của thuật ngữ chỉ nơi Đức Chúa Trời gặp dân Ngài; viết hoa để biểu thị tên gọi của địa điểm thánh cụ thể.
- source_word: וְרָחַצְתָּ
  choice: rửa
  rationale: Giữ nghĩa rộng của רחץ mà không xác định quá mức cách thức như từ 'tắm' có thể gợi ra.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ quy chiếu chung về A-rôn và các con trai ông.
- source_word: בַּמָּיִם
  choice: lấy nước
  rationale: Hiểu giới từ ב theo nghĩa phương tiện; 'lấy nước rửa' tự nhiên trong tiếng Việt và không hàm ý họ ở trong nước.
theological_decisions: []
