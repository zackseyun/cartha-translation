  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּ֨קֶם מֹשֶׁ֜ה אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּתֵּן֙ אֶת אֲדָנָ֔י/ו וַ/יָּ֨שֶׂם֙ אֶת קְרָשָׁ֔י/ו וַ/יִּתֵּ֖ן אֶת בְּרִיחָ֑י/ו וַ/יָּ֖קֶם אֶת עַמּוּדָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: vi
  text: Môi-se dựng Đền Tạm lên. Ông đặt các đế[a], dựng các khung[b], lắp các thanh giằng và dựng các trụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các bệ có lỗ”; đây là những bộ phận nền dùng để giữ các khung của Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các tấm ván”. Từ Hê-bơ-rơ có thể chỉ ván, nhưng tại đây có lẽ nói đến các cấu kiện đứng của Đền Tạm.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “các cột”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: dựng ... lên / dựng
  rationale: Dạng Hiphil của קום ở đây có nghĩa là làm cho đứng lên, tức dựng hoặc thiết lập công trình. Cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với cả Đền Tạm lẫn các trụ.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן theo nghĩa gốc là nơi cư ngụ, nhưng trong sách Xuất Hành chỉ nơi thánh di động của Y-sơ-ra-ên. “Đền Tạm” là cách gọi ngắn gọn, trang trọng và dễ hiểu trong ngữ cảnh này.
- source_word: אֲדָנָיו
  choice: các đế
  rationale: אֶדֶן chỉ những bộ phận nền đỡ và giữ các cấu kiện đứng của Đền Tạm. “Đế” diễn đạt rõ chức năng mà không dùng thuật ngữ kiến trúc quá chuyên môn.
- source_word: קְרָשָׁיו
  choice: các khung
  rationale: קֶרֶשׁ có thể chỉ ván hoặc cấu kiện đứng. Trong kết cấu Đền Tạm, “khung” truyền đạt vai trò kiến trúc của chúng, đồng thời chú thích giữ lại khả năng dịch sát vật thể là “ván”.
- source_word: בְּרִיחָיו
  choice: các thanh giằng
  rationale: בְּרִיחַ chỉ các thanh nối và giữ những cấu kiện đứng với nhau. “Thanh giằng” rõ chức năng hơn “thanh” đơn thuần và tự nhiên trong tiếng Việt hiện đại.
- source_word: עַמּוּדָיו
  choice: các trụ
  rationale: עַמּוּד chỉ những bộ phận chống đỡ thẳng đứng. “Trụ” là từ hiện đại, trang trọng vừa phải và phù hợp với một kết cấu thánh.
- source_word: וַיִּתֵּן / וַיָּשֶׂם
  choice: đặt / dựng / lắp
  rationale: 'Hai động từ có nghĩa rộng là đặt hoặc để vào vị trí. Tiếng Việt thay đổi động từ theo từng cấu kiện để câu tự nhiên: đặt đế, dựng khung và lắp thanh giằng, trong khi vẫn giữ nguyên trình tự lắp dựng của bản Hê-bơ-rơ.'
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Câu được chia làm hai để tránh chuỗi động từ nặng nề; các động từ “đặt”, “dựng”, “lắp” phù hợp tự nhiên với từng bộ phận. Viết hoa “Đền Tạm” để chỉ riêng nơi thánh trong ngữ cảnh Xuất Hành.
