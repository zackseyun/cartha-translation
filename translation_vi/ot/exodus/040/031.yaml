  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: vi
  text: Môi-se, A-rôn và các con trai ông lấy nước từ đó để rửa tay và chân mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dùng nước trong bồn mà rửa”; nguyên văn sát hơn là “từ nó,” chỉ về cái bồn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: rửa
  rationale: Động từ Qal wayyiqtol của רחץ thuật lại một hành động trong chuỗi sự kiện; cách diễn đạt này tự nhiên trong văn kể tiếng Việt và không biến nó thành hành động thường lệ.
- source_word: מִמֶּנּוּ
  choice: lấy nước từ đó
  rationale: Giới từ מן với hậu tố ngôi ba số ít giống đực có nghĩa sát là “từ nó,” quy chiếu về cái bồn ở câu trước. “Lấy nước từ đó” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ ý nguồn nước, thay vì chuyển thành ý phương tiện.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: וְאַהֲרֹן
  choice: A-rôn
  rationale: Dạng phiên âm tên riêng quen dùng trong tiếng Việt; liên từ được thể hiện trong phép liệt kê.
- source_word: וּבָנָיו
  choice: và các con trai ông
  rationale: בנים trong bối cảnh chức tế lễ chỉ các con trai của A-rôn. Đại từ số ít “ông” được giữ để phản ánh hậu tố số ít trong tiếng Hê-bơ-rơ, với tiền ngữ gần nhất là A-rôn.
- source_word: אֶת יְדֵיהֶם
  choice: tay
  rationale: Chỉ bộ phận cơ thể thuộc về nhiều người; tiếng Việt tự nhiên thường không cần đánh dấu số nhiều hay đại từ sở hữu khi chủ thể đã rõ.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: chân mình
  rationale: Giữ cặp bộ phận “tay và chân”; “mình” quy chiếu tự nhiên về chủ ngữ số nhiều trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “lấy nước từ đó rửa” tránh cách nói gượng “từ nó mà rửa,” đồng thời giữ sắc thái nguồn của מִמֶּנּוּ. Dùng “tay chân” là cách kết hợp tự nhiên trong tiếng Việt.
