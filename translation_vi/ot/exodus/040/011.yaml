  text: You shall anoint the basin and its stand[b][a], and consecrate it.
translation:
  language: vi
  text: Con hãy xức dầu chậu rửa và chân đế[a] của nó, rồi thánh hiến nó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đế”.
    reason: lexical_alternative
  - marker: b
    text: Hay “biệt riêng nó làm vật thánh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Con hãy xức dầu
  rationale: Động từ משׁח trong nghi lễ chỉ việc xức dầu để dành riêng cho công việc thánh. “Xức dầu” là cách diễn đạt tự nhiên và quen thuộc trong tiếng Việt Kinh Thánh; “con hãy” phù hợp với lời Đức Chúa Trời trực tiếp truyền cho Môi-se trong mạch văn.
- source_word: הַכִּיֹּר
  choice: chậu rửa
  rationale: כִּיּוֹר chỉ chiếc chậu lớn dùng cho việc thanh tẩy trong Đền Tạm. “Chậu rửa” rõ nghĩa hơn chỉ nói “chậu” và dễ hiểu đối với độc giả hiện đại.
- source_word: כַּנּוֹ
  choice: chân đế của nó
  rationale: כֵּן ở đây là bộ phận nâng đỡ chậu. “Chân đế” diễn đạt rõ chức năng hơn “đế” mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: rồi biệt riêng nó ra thánh
  rationale: קדשׁ ở thể Piel trong ngữ cảnh nghi lễ có nghĩa là biệt riêng một vật để thuộc về phạm vi thánh. Đại từ số ít “nó” được giữ nguyên, phù hợp với tiếng Hê-bơ-rơ và có thể chỉ chậu như vật dụng chính cùng chân đế gắn với nó.
theological_decisions:
- issue: Ý nghĩa của קדשׁ trong nghi lễ Đền Tạm
  choice: biệt riêng nó ra thánh
  alternative: thánh hóa nó
  rationale: Cách chọn nhấn mạnh việc dành riêng vật dụng cho mục đích thánh, không hàm ý sự biến đổi đạo đức. “Thánh hóa” vẫn là một khả năng dịch hợp lệ nhưng có thể được độc giả hiện đại hiểu chủ yếu theo nghĩa thần học áp dụng cho con người.
- issue: Phạm vi quy chiếu của đại từ số ít אֹתוֹ
  choice: giữ đại từ số ít “nó”
  alternative: biệt riêng cả hai ra thánh
  rationale: Bản nguồn dùng đại từ giống đực số ít, nhiều khả năng quy chiếu đến chậu như vật dụng chính, trong đó chân đế đi kèm được bao gồm trong nghi thức. Không đổi thành số nhiều để tránh giải quyết dứt khoát điều bản nguồn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chậu rửa” thay cho thuật ngữ cổ; dùng “biệt riêng… ra thánh” để truyền đạt rõ sắc thái nghi lễ. Các dấu chú thích được đặt ngay sau từ ngữ mà chúng giải thích.
