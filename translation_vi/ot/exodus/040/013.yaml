  text: וְ/הִלְבַּשְׁתָּ֙ אֶֽת אַהֲרֹ֔ן אֵ֖ת בִּגְדֵ֣י הַ/קֹּ֑דֶשׁ וּ/מָשַׁחְתָּ֥ אֹת֛/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֖/וֹ וְ/כִהֵ֥ן לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: vi
  text: Hãy mặc cho A-rôn các lễ phục thánh, xức dầu cho ông và thánh hiến ông; và ông sẽ thi hành chức tế lễ cho Ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để ông thi hành chức tế lễ cho Ta.” Động từ Hê-bơ-rơ có nghĩa là thi hành hoặc phục vụ trong chức vụ tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: Hãy mặc cho
  rationale: Dạng Hiphil của לבשׁ mang nghĩa khiến một người mặc y phục; cách nói “mặc cho A-rôn” tự nhiên trong tiếng Việt và giữ sắc thái truyền lệnh.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: các lễ phục thánh
  rationale: Cụm sở thuộc theo sát nghĩa là “y phục của sự thánh khiết.” “Lễ phục thánh” vừa tự nhiên vừa biểu đạt rõ đây là y phục dành riêng cho nghi lễ thánh.
- source_word: וּמָשַׁחְתָּ
  choice: xức dầu
  rationale: Cách dịch chuẩn của משׁח trong nghi thức thiết lập chức vụ tế lễ; bổ sung “dầu” theo cách diễn đạt tự nhiên và nghĩa hàm chứa của động từ trong ngữ cảnh.
- source_word: וְקִדַּשְׁתָּ
  choice: thánh hiến
  rationale: Dạng Piel của קדשׁ ở đây chỉ việc biệt riêng một người cho công việc thánh. “Thánh hiến” giữ được ý nghĩa nghi lễ mà vẫn rõ hơn “làm nên thánh” trong tiếng Việt hiện đại.
- source_word: וְכִהֵן
  choice: để ông làm thầy tế lễ phụng sự
  rationale: Động từ כהן có nghĩa thi hành hay phục vụ trong chức vụ tế lễ. Cách dịch này thể hiện chức năng chứ không chỉ danh xưng, đồng thời đọc tự nhiên như kết quả/mục đích của các hành động trước.
- source_word: לִי
  choice: Ta
  rationale: Trong cụm “phụng sự Ta,” tân ngữ trực tiếp là cách diễn đạt tiếng Việt tự nhiên cho sự phục vụ hướng về Đức Chúa Trời; viết hoa đại từ để chỉ lời phán của Ngài.
theological_decisions:
- issue: Ngôn ngữ thiết lập chức vụ tế lễ
  choice: Phân biệt việc xức dầu với việc thánh hiến như hai hành động liên hệ nhưng không đồng nhất.
  alternative: Gộp cả hai thành một ý như “phong chức.”
  rationale: Nguyên văn nêu tuần tự việc mặc lễ phục, xức dầu, thánh hiến, rồi thi hành chức tế lễ. Giữ riêng từng hành động bảo toàn tính cụ thể của nghi thức và không đưa phạm trù giáo hội về sau vào bản văn.
- issue: Sắc thái của וְכִהֵן לִי
  choice: 'Dịch theo quan hệ mục đích/kết quả: “để ông làm thầy tế lễ phụng sự Ta.”'
  alternative: 'Dịch như mệnh đề tương lai đồng hàng: “và ông sẽ làm thầy tế lễ phụng sự Ta.”'
  rationale: Sau chuỗi động từ ngôi thứ hai, động từ ngôi thứ ba có thể tự nhiên nêu kết quả hoặc mục đích của các hành động trước. Chú thích giữ lại khả năng hiểu như một mệnh đề tiếp nối.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Hãy” cho lời truyền lệnh; “lễ phục thánh,” “xức dầu,” “thánh hiến,” và “thầy tế lễ” duy trì ngôn ngữ nghi lễ rõ ràng mà không thêm thuật ngữ hệ phái.
