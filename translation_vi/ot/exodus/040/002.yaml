  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: vi
  text: Vào ngày mồng một của tháng thứ nhất, hãy dựng Đền Tạm, tức là Lều Hội Kiến.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc hơn: “Đền Tạm của Lều Hội Kiến.” Tiếng Hê-bơ-rơ đặt liền hai thuật ngữ chỉ nơi thánh; chúng có thể được hiểu là hai tên gọi đồng vị hoặc là một kết cấu liên kết chặt hơn.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם
  choice: Vào ngày
  rationale: Giới từ בְּ đi với יוֹם biểu thị thời điểm; “vào ngày” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: הַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: tháng thứ nhất
  rationale: Trong ngữ cảnh lịch, חֹדֶשׁ có nghĩa là “tháng”, còn רִאשׁוֹן chỉ thứ tự đầu tiên.
- source_word: בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: mồng một
  rationale: Công thức ghi ngày này theo nghĩa đen là “vào ngày một của tháng”, nhưng trong tiếng Việt tự nhiên là “mồng một”.
- source_word: תָּקִים
  choice: ngươi hãy dựng
  rationale: Dạng Hiphil của קום ở đây có nghĩa khiến cho đứng lên, tức dựng một công trình; “hãy dựng” truyền đạt rõ mệnh lệnh. Đại từ “ngươi” giữ ngôi thứ hai số ít của nguyên văn mà không tự thêm sắc thái quan hệ như “con”.
- source_word: מִשְׁכַּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן là tên gọi quen thuộc của nơi thánh lưu động trong Xuất Hành; “Đền Tạm” vừa ngắn gọn vừa phân biệt được với אֹהֶל, “lều”.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cụm này chỉ chiếc lều là nơi gặp gỡ theo sự ấn định; “Lều Hội Kiến” là cách gọi trang trọng, dễ nhận biết và phù hợp ngữ cảnh nơi thánh.
theological_decisions:
- issue: Mối quan hệ giữa מִשְׁכַּן và אֹהֶל מוֹעֵד
  choice: 'Đọc theo quan hệ đồng vị: “Đền Tạm, tức là Lều Hội Kiến”'
  alternative: 'Đọc như một kết cấu sở thuộc chặt hơn: “Đền Tạm của Lều Hội Kiến”'
  rationale: Tiếng Hê-bơ-rơ đặt hai tên gọi nơi thánh liền nhau mà không giải thích rõ quan hệ. Trong ngữ cảnh, cả hai có thể chỉ cùng một công trình dưới hai tên gọi bổ sung; bản dịch chính dùng đồng vị cho rõ nghĩa, còn chú thích giữ lại cách hiểu sở thuộc có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Mồng một” là cách nói tự nhiên về ngày đầu tháng; “ngươi” giữ ngôi thứ hai số ít và sắc thái mệnh lệnh trang trọng của lời phán. Viết hoa “Đền Tạm” và “Lều Hội Kiến” vì đây là các danh xưng quy ước của nơi thánh trong mạch văn.
