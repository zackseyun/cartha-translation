  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa chính của nguyên văn: Môi-se không thể vào Lều Hội Kiến vì đám mây đã đậu trên đó, trong khi vinh quang của Yahweh làm đầy Đền Tạm. “Đậu trên đó” phản ánh cách thận trọng động từ שָׁכַן trong ngữ cảnh đám mây dừng/ở trên lều, không ép một cách hiểu thần học vào câu văn.'
