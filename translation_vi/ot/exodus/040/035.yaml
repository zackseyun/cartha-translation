id: EXO.40.35
reference: Exodus 40:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: vi
  text: Môi-se không thể vào Lều Hội Kiến, vì đám mây đậu trên đó[a], và vinh quang của Yahweh tràn ngập Đền Tạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ngự trên đó”, “cư ngụ trên đó” hoặc “dừng lại trên đó”. Động từ Hê-bơ-rơ có thể mang nghĩa cư ngụ, ở lại hoặc đậu lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכֹל
  choice: không thể
  rationale: Diễn đạt trực tiếp sự không có khả năng, tự nhiên trong tiếng Việt; liên từ וְ được thể hiện qua mạch câu liên tục thay vì thêm một từ nối gượng ép.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: לָבוֹא אֶל
  choice: vào
  rationale: Trong ngữ cảnh đi vào một công trình, “vào” truyền đạt tự nhiên ý của động từ và giới từ đi kèm.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Giữ hai thành tố “lều” và “hội kiến/gặp gỡ”, đồng thời dùng cách gọi trang trọng, quen thuộc cho địa điểm thánh này.
- source_word: כִּי
  choice: vì
  rationale: Liên từ nêu nguyên nhân khiến Môi-se không thể vào lều.
- source_word: שָׁכַן
  choice: đậu
  rationale: Diễn tả cụ thể đám mây dừng và ở trên Lều Hội Kiến. Chú thích giữ lại sắc thái “cư ngụ/ngự” vốn cũng có trong động từ Hê-bơ-rơ.
- source_word: עָלָיו
  choice: trên đó
  rationale: Giữ quan hệ không gian của giới từ; đại từ chỉ về Lều Hội Kiến.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Danh từ xác định chỉ đám mây đã được biết đến trong mạch truyện.
- source_word: כְבוֹד יְהוָה
  choice: vinh quang của Yahweh
  rationale: Giữ quan hệ sở hữu và trọng lượng thần học của כָּבוֹד, đồng thời chuyển danh thánh bằng dạng phiên âm Yahweh.
- source_word: מָלֵא
  choice: tràn ngập
  rationale: Cách nói tự nhiên trong tiếng Việt về sự hiện diện đầy khắp một không gian, tương ứng với nghĩa “làm đầy/đầy” của động từ.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ quen thuộc chỉ nơi thánh lưu động trong Xuất Hành, đồng thời phân biệt với אֹהֶל מוֹעֵד trong cùng câu.
theological_decisions:
- issue: Cách chuyển danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng giao ước; phiên âm “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng một tước hiệu.
- issue: Sắc thái của שָׁכַן và thần học về sự ngự ở
  choice: đậu
  alternative: ngự; cư ngụ; dừng lại
  rationale: “Đậu” ưu tiên hình ảnh cụ thể của đám mây dừng trên lều, nhưng chú thích bảo tồn khả năng động từ mang nghĩa ở lại hoặc cư ngụ, không âm thầm loại bỏ cộng hưởng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lều Hội Kiến” và “Đền Tạm” được viết hoa như các danh xưng quy ước của hai thuật ngữ thánh điện khác nhau trong câu; câu giữ cấu trúc nguyên nhân và hai vế song song của nguyên văn.
