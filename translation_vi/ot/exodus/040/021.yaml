source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Ông đem Hòm Bia vào Đền Tạm, dựng bức màn che[a] và dùng màn ấy che khuất Hòm Bia Chứng Ước[b], đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bức màn ngăn”. Cụm từ Hê-bơ-rơ kết hợp từ chỉ bức màn với từ nhấn mạnh chức năng che chắn, ngăn cách.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “che Hòm Bia Chứng Ước” hoặc “ngăn Hòm Bia Chứng Ước khỏi tầm nhìn”. Động từ Hê-bơ-rơ nhấn mạnh việc che chắn bằng bức màn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Ông đem ... vào
  rationale: Dạng Hiphil của בוא diễn tả việc Môi-se đưa Hòm Bia vào trong Đền Tạm; tiếng Việt tự nhiên dùng “đem ... vào”.
- source_word: הָאָרֹן
  choice: Hòm Bia
  rationale: Trong ngữ cảnh thánh sở, אָרוֹן chỉ vật thánh chuyên biệt; “Hòm Bia” là cách gọi quen thuộc và phân biệt với một chiếc hòm thông thường.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Trong sách Xuất Hành, từ này chỉ thánh sở lưu động; “Đền Tạm” là cách diễn đạt rõ nghĩa, trang trọng và quen thuộc trong tiếng Việt.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: bức màn che
  rationale: Cụm Hê-bơ-rơ kết hợp danh từ chỉ bức màn bên trong với chức năng che chắn. “Bức màn che” tự nhiên trong tiếng Việt và giữ được cả vật thể lẫn chức năng.
- source_word: וַיָּשֶׂם
  choice: dựng
  rationale: שׂים có nghĩa rộng là đặt để; trong bối cảnh lắp đặt bức màn của thánh sở, “dựng” diễn đạt việc đặt nó vào đúng vị trí.
- source_word: וַיָּסֶךְ עַל
  choice: dùng màn ấy che khuất
  rationale: Động từ nhấn mạnh việc che chắn hoặc ngăn khỏi tầm nhìn. Thêm “dùng màn ấy” làm rõ phương tiện vốn hiển nhiên trong ngữ cảnh mà không thay đổi nội dung.
- source_word: אֲרוֹן הָעֵדוּת
  choice: Hòm Bia Chứng Ước
  rationale: הָעֵדוּת chỉ chứng ngôn/chứng ước được đặt trong Hòm Bia. “Chứng Ước” giữ sắc thái giao ước mà không giải thích quá mức thành riêng các bảng đá.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: đúng như Yahweh đã truyền cho Môi-se
  rationale: “Đúng như” làm nổi bật sự làm theo chính xác mệnh lệnh; thì quá khứ “đã truyền” tự nhiên trong mạch kể tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, phù hợp trực tiếp với dạng Tứ Tự trong bản Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יְהוָה; “Yahweh” bảo tồn tính chất danh riêng và không thay bằng tước hiệu.
- issue: Ý nghĩa của הָעֵדוּת trong tên Hòm Bia
  choice: Chứng Ước
  alternative: chứng ngôn; Bia Giao Ước
  rationale: “Chứng Ước” giữ liên hệ với chứng cứ giao ước mà không thu hẹp cách gọi thành một lời giải thích cụ thể hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ông” nối với Môi-se từ ngữ cảnh trước mà không lặp tên ngoài nguyên văn. Viết hoa các tên gọi chuyên biệt “Hòm Bia”, “Đền Tạm” và “Hòm Bia Chứng Ước”; giữ danh riêng “Yahweh” và dạng tên Việt hóa quen thuộc “Môi-se”.
