  text: וְ/שַׂמְתָּ֣ שָׁ֔ם אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/סַכֹּתָ֥ עַל הָ/אָרֹ֖ן אֶת הַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: vi
  text: Hãy đặt Hòm Chứng Ngôn[a] ở đó, rồi dùng bức màn[b] che khuất Hòm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “Hòm Chứng Ngôn”. Một số truyền thống gọi là “Hòm Giao Ước”, nhưng từ Hê-bơ-rơ ở đây có nghĩa là “chứng ngôn” hay “lời chứng”.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “màn ngăn”. Từ Hê-bơ-rơ chỉ bức màn bên trong Đền Tạm, dùng để ngăn cách và che khuất Hòm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Hãy đặt
  rationale: Thể hoàn thành Qal có liên từ đứng đầu, trong chuỗi chỉ thị này, mang chức năng mệnh lệnh hướng đến Môi-se. “Hãy đặt” tự nhiên và thể hiện rõ lực mệnh lệnh trong tiếng Việt.
- source_word: שָׁם
  choice: ở đó
  rationale: Giữ nguyên tính chỉ nơi chốn của trạng từ, quy chiếu về Đền Tạm/Lều vừa được nhắc đến mà không diễn giải quá mức.
- source_word: אֲרוֹן הָעֵדוּת
  choice: Hòm Chứng Ngôn
  rationale: Giữ danh từ עֵדוּת theo nghĩa “chứng ngôn/lời chứng”, thay vì đồng nhất nó với “giao ước”. “Hòm” phù hợp với một vật chứa linh thiêng và đã quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: וְסַכֹּתָ
  choice: rồi dùng … che khuất
  rationale: Động từ סכך có nghĩa che, chắn hoặc ngăn khỏi tầm nhìn. Trong bố trí Đền Tạm, bức màn là vách ngăn che Hòm, chứ không phải tấm vải phủ trực tiếp lên Hòm.
- source_word: עַל הָאָרֹן
  choice: Hòm
  rationale: Giới từ עַל kết hợp với סכך trong ngữ cảnh này diễn tả việc Hòm bị ngăn che. Cấu trúc tiếng Việt “dùng bức màn che khuất Hòm” truyền đạt đúng quan hệ không gian mà không gợi ý bức màn được trải lên trên Hòm.
- source_word: הַפָּרֹכֶת
  choice: bức màn
  rationale: פָּרֹכֶת chỉ bức màn bên trong Đền Tạm dùng để ngăn khu vực đặt Hòm. “Bức màn” là cách nói hiện đại, dễ hiểu; “màn ngăn” được giữ trong chú thích để làm rõ chức năng.
theological_decisions:
- issue: Danh xưng của Hòm trong Đền Tạm
  choice: Hòm Chứng Ngôn
  alternative: Hòm Giao Ước
  rationale: Bản Hê-bơ-rơ tại câu này dùng עֵדוּת, “chứng ngôn/lời chứng”, chứ không dùng בְּרִית, “giao ước”. Bản dịch vì thế giữ nguyên cách gọi của nguồn văn bản, không hòa đồng với danh xưng quen thuộc ở các ngữ cảnh khác.
- issue: Cách dịch פָּרֹכֶת
  choice: bức màn
  alternative: màn ngăn
  rationale: “Bức màn” tự nhiên và dễ hiểu trong tiếng Việt hiện đại, còn chú thích nêu rõ đây là màn ngăn bên trong Đền Tạm. Lựa chọn này không áp đặt thêm một cách giải thích thần học.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại, trực tiếp và dễ hiểu. Câu dịch giữ thuật ngữ nguồn “Chứng Ngôn”, đồng thời diễn đạt chức năng không gian của bức màn mà không khiến người đọc tưởng rằng màn được phủ lên Hòm.
