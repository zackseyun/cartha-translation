translation:
  language: vi
  text: Rồi ông đặt tấm màn che tại lối vào Đền Tạm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tấm rèm ở cửa Đền Tạm.”'
    reason: Nêu phương án dịch מָסַךְ là “rèm” và הַפֶּתַח là “cửa/lối cửa”, đồng thời giữ quan hệ với Đền Tạm.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Rồi ông treo
  rationale: Động từ שׂוּם có nghĩa cơ bản là đặt, để, dựng. Với một tấm màn tại lối vào, “treo” diễn đạt tự nhiên hành động đặt nó vào đúng vị trí sử dụng; “rồi” tiếp nối mạch tường thuật của וַ־.
- source_word: מָסַךְ
  choice: tấm màn che
  rationale: Trong ngữ cảnh Đền Tạm, מָסָךְ chỉ tấm màn dùng để che một lối vào. “Tấm màn che” vừa tự nhiên trong tiếng Việt vừa phân biệt với פָּרֹכֶת, thường được gọi là bức màn ngăn.
- source_word: הַפֶּתַח
  choice: lối vào
  rationale: פֶּתַח chỉ chỗ mở hoặc lối vào; “lối vào” phù hợp tự nhiên với cấu trúc và chức năng được nói đến ở đây.
- source_word: לַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן là nơi Đức Chúa Trời ngự giữa Israel; “Đền Tạm” là cách gọi ngắn gọn, trang trọng và quen thuộc, đồng thời giới từ ל־ được hiểu trong cụm “lối vào Đền Tạm”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể Môi-se đã rõ từ văn cảnh; câu vẫn giữ nhịp kể liên tiếp của nguyên văn Hê-bơ-rơ.
