  yaml_path: translation/ot/exodus/040/025.yaml
  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Ông sắp đặt các ngọn đèn[a] trước mặt Yahweh, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ, sát nghĩa: “làm cho các ngọn đèn đi lên”; trong ngữ cảnh này, cách nói ấy có thể chỉ việc sắp đặt hoặc thắp các ngọn đèn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: thắp
  rationale: Dạng Hifil của עלה có nghĩa đen là “làm cho đi lên.” Khi dùng với các ngọn đèn trong ngữ cảnh Đền Tạm, đây là một thành ngữ có thể chỉ việc làm cho đèn cháy, tức thắp đèn. Cách dịch này tự nhiên trong tiếng Việt; chú thích giữ lại nghĩa đen và khả năng hiểu rộng hơn là đặt/sắp đèn.
- source_word: הַנֵּרֹת
  choice: các ngọn đèn
  rationale: נֵרֹת chỉ những ngọn đèn cụ thể trên chân đèn, không phải ánh sáng theo nghĩa trừu tượng.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי diễn tả vị trí hoặc sự hiện diện trong bối cảnh thờ phượng. “Trước mặt” vừa tự nhiên vừa giữ được sắc thái không gian và nghi lễ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ Tự יהוה, thay vì thay bằng một tước hiệu.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Cụm này cho biết hành động hoàn toàn phù hợp với mệnh lệnh đã ban trước đó.
- source_word: צִוָּה
  choice: đã truyền
  rationale: Thể hoàn thành chỉ mệnh lệnh có trước hành động đang được thuật lại; “đã truyền” diễn đạt rõ trình tự này trong tiếng Việt.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: אֶת đánh dấu Môi-se là đối tượng của động từ “truyền lệnh.” Trong tiếng Việt, cấu trúc tự nhiên là “truyền cho Môi-se.”
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Ý nghĩa của hành động וַיַּעַל đối với các ngọn đèn
  choice: thắp các ngọn đèn, kèm chú thích về nghĩa đen và khả năng khác
  alternative: đặt/sắp các ngọn đèn
  rationale: Trong ngữ cảnh chân đèn, thành ngữ này thường nói đến việc làm cho đèn cháy; tuy nhiên, bản thân động từ không hoàn toàn loại trừ ý đặt hoặc sắp đèn. Chú thích bảo tồn độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” nối chủ thể Môi-se từ ngữ cảnh trước mà không lặp tên không cần thiết; “trước mặt Yahweh” giữ sắc thái nghi lễ của nguyên văn.
