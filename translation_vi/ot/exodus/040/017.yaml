  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: vi
  text: Vào ngày mồng một tháng thứ nhất của năm thứ hai, Đền Tạm được dựng lên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Vào
  rationale: Trong công thức ghi niên đại này, וַיְהִי dẫn vào sự việc; tiếng Việt tự nhiên không cần dịch máy móc là “và xảy ra rằng”. Câu vẫn thể hiện rõ diễn tiến thuật sự.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: tháng thứ nhất
  rationale: חֹדֶשׁ trong ngữ cảnh lịch pháp nghĩa là “tháng”; cấu trúc có mạo từ và số thứ tự chỉ tháng thứ nhất.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: của năm thứ hai
  rationale: Cụm từ xác định năm trong công thức ghi ngày tháng; cách diễn đạt này tự nhiên khi đi sau “tháng thứ nhất”.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: ngày mồng một trong tháng
  rationale: Thành ngữ Hê-bơ-rơ, sát nghĩa là “vào ngày một của tháng”, chỉ ngày đầu tháng. “Ngày mồng một” là cách nói lịch pháp rõ ràng và tự nhiên trong tiếng Việt.
- source_word: הוּקַם
  choice: được dựng lên
  rationale: 'Dạng Hophal của קום diễn tả bị động gây khiến: được dựng hoặc thiết lập. “Được dựng lên” phù hợp với việc lắp dựng nơi thánh lưu động.'
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן ở đây là nơi thánh lưu động của Y-sơ-ra-ên. “Đền Tạm” là thuật ngữ Kinh Thánh tiếng Việt quen thuộc, phân biệt với đền thờ cố định và vẫn gợi tính chất nơi ngự.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Lược bỏ cách mở đầu dịch sát “và xảy ra rằng” để công thức niên đại tự nhiên hơn, nhưng không làm mất nội dung. Viết hoa “Đền Tạm” như tên gọi quy ước của nơi thánh cụ thể.
