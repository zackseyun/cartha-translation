base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: vi
  text: Hãy xức dầu cho họ như con đã xức dầu cho cha họ, để họ phụng sự Ta trong chức vụ thầy tế lễ. Sự xức dầu cho họ sẽ cho họ một chức tế lễ đời đời[a], qua các thế hệ của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chức tế lễ lâu dài.” Từ Hê-bơ-rơ có thể chỉ sự tiếp nối bền lâu qua các thế hệ trong bối cảnh giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: Hãy xức dầu cho họ
  rationale: Dạng động từ trong chuỗi chỉ thị mang lực mệnh lệnh; “hãy” diễn đạt tự nhiên và rõ ràng trong tiếng Việt.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: như đã xức dầu cho cha họ
  rationale: Giữ phép so sánh trực tiếp với việc Môi-se đã xức dầu cho A-rôn; chủ ngữ được lược bỏ tự nhiên trong tiếng Việt và vẫn rõ từ văn cảnh.
- source_word: וְכִהֲנוּ לִי
  choice: để họ làm thầy tế lễ phụng sự Ta
  rationale: Động từ כהן chỉ việc thi hành chức vụ tế lễ. Cách dịch này giữ cả chức năng tế lễ lẫn đối tượng được phụng sự là Đức Chúa Trời.
- source_word: מָשְׁחָתָם
  choice: việc họ được xức dầu
  rationale: Danh từ chỉ sự xức dầu hoặc sự biệt riêng bằng nghi thức xức dầu, không nhất thiết chỉ dầu xức; cách diễn đạt này tự nhiên hơn “sự xức dầu của họ” trong tiếng Việt.
- source_word: וְהָיְתָה לִהְיוֹת לָהֶם
  choice: sẽ đem lại cho họ
  rationale: Diễn đạt thành ngữ Hê-bơ-rơ về kết quả hay địa vị phát sinh từ việc xức dầu, đồng thời tránh câu tiếng Việt gượng ép.
- source_word: לִכְהֻנַּת עוֹלָם
  choice: chức tế lễ đời đời
  rationale: Giữ nghĩa mạnh của עוֹלָם trong ngữ cảnh luật lệ và giao ước, nhưng không mặc nhiên biến nó thành một khẳng định triết học về thời gian vô tận.
- source_word: לְדֹרֹתָם
  choice: trải qua các thế hệ của họ
  rationale: Diễn tả sự tiếp nối của chức tế lễ qua các thế hệ hậu duệ của A-rôn và giữ đại từ sở hữu có trong nguyên văn.
theological_decisions:
- issue: Khoảng thời gian được hàm ý bởi עוֹלָם trong ngôn ngữ giao ước về chức tế lễ
  choice: chức tế lễ đời đời
  alternative: chức tế lễ lâu dài
  rationale: עוֹלָם có thể chỉ tính liên tục bền vững trong khuôn khổ giao ước. Bản chính giữ cách dịch mạnh và quen thuộc “đời đời,” còn chú thích bảo tồn khả năng hiểu theo nghĩa kéo dài qua các thế hệ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Lược chủ ngữ ở mệnh lệnh đầu để tránh phải thêm một đại từ xưng hô không có trong tiếng Hê-bơ-rơ; dùng “Ta” cho lời Đức Chúa Trời và “thầy tế lễ” theo cách gọi phổ thông.
