  to: Hãy xức dầu cho họ như con đã xức dầu cho cha họ, để họ phụng sự Ta trong chức vụ thầy tế lễ. Sự xức dầu cho họ sẽ cho họ một chức tế lễ đời đời[a], qua các thế hệ của họ.
  rationale: Bản sửa làm rõ chủ ngữ được ngầm hiểu trong lời phán, cải thiện cách diễn đạt về chức vụ tư tế, và thay “đem lại” bằng “sẽ cho họ” để phản ánh trực tiếp hơn hiệu lực của sự xức dầu trong nguyên văn. Chú thích được giữ nguyên về nội dung và đặt đúng tại “đời đời,” nơi nó giải thích עוֹלָם.
