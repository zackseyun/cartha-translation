    rationale: Dù không sai nghĩa, cách này kém tự nhiên trong tiếng Việt hiện đại. Bỏ đại từ và dùng «Hãy» vẫn bảo toàn lực mệnh lệnh của các dạng động từ tiếng Hê-bơ-rơ.
  - severity: low
    issue: Cách gọi hành vi קדשׁ
    rationale: «Thánh hiến» diễn đạt trực tiếp hành động biệt riêng cho sự thánh trong nghi thức và tự nhiên hơn «thánh hóa» trong văn phong hiện đại.
  - severity: low
    issue: Câu mở đầu chú thích «Theo sát tiếng Hê-bơ-rơ»
    rationale: Chú thích đang vừa đưa một cách diễn đạt tiếng Việt vừa giải thích. «Theo sát nghĩa đen» chính xác hơn về mặt mô tả, đồng thời vẫn nêu được công thức nguyên ngữ.
