revisions:
- from: Ngươi phải xức dầu cho bàn thờ dâng lễ thiêu cùng mọi dụng cụ của nó; ngươi phải thánh hóa bàn thờ, và bàn thờ sẽ là vật chí thánh.[a]
  to: Hãy xức dầu cho bàn thờ dâng lễ thiêu và mọi dụng cụ của nó; hãy thánh hiến bàn thờ, thì bàn thờ sẽ là vật chí thánh.[a]
  rationale: Bản sửa chỉ làm hiện đại hóa cách ra lệnh và chọn «thánh hiến» cho hành động nghi lễ, không thay đổi trình tự hay ý nghĩa của nguyên văn. «Vật chí thánh» được giữ vì diễn tả địa vị đặc biệt thánh của bàn thờ mà không áp đặt cách hiểu không gian như «Nơi Chí Thánh».
  reviewer_model: gpt-5.6-terra
