base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: vi
  text: Hãy xức dầu cho bàn thờ dâng lễ thiêu và mọi dụng cụ của nó; hãy thánh hiến bàn thờ, thì bàn thờ sẽ là vật chí thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát nghĩa đen tiếng Hê-bơ-rơ: “thánh của các thánh”; đây là một lối nói cấp tuyệt đối, nghĩa là “chí thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: ngươi phải xức dầu
  rationale: Trong nghi thức thờ phượng, משׁח chỉ việc xức dầu để biệt riêng cho chức năng thánh; “xức dầu” vừa chính xác vừa quen thuộc trong tiếng Việt.
- source_word: מִזְבַּח הָעֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: Cụm sở thuộc chỉ bàn thờ dùng cho lễ vật được thiêu trọn; cách diễn đạt này rõ nghĩa và tự nhiên hơn lối ghép danh từ cứng.
- source_word: כָּל כֵּלָיו
  choice: mọi dụng cụ của nó
  rationale: כֵּלִים là từ rộng chỉ các đồ dùng hay khí cụ đi kèm; “dụng cụ” phù hợp với các vật dụng phục vụ bàn thờ mà không thu hẹp quá mức.
- source_word: וְקִדַּשְׁתָּ
  choice: ngươi phải thánh hóa
  rationale: Ở đây קדשׁ nói đến việc biệt riêng bàn thờ làm thánh trong nghi lễ. “Thánh hóa” giữ được sắc thái nghi lễ và mối liên hệ từ vựng với tình trạng thánh ở vế sau.
- source_word: וְהָיָה
  choice: sẽ là
  rationale: Động từ diễn tả tình trạng có được sau hành động thánh hóa; “sẽ là” giữ rõ trình tự và kết quả.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  rationale: Đây là cấu trúc nhấn mạnh mức độ cao nhất của sự thánh khiết. Thêm “vật” để câu tiếng Việt tự nhiên và tránh khiến “chí thánh” bị hiểu là tên của một khu vực.
theological_decisions:
- issue: Cách dịch công thức thờ phượng קֹדֶשׁ קָדָשִׁים
  choice: vật chí thánh
  alternative: nơi chí thánh; rất thánh
  rationale: Cụm này mô tả địa vị thánh khiết cao nhất của chính bàn thờ, không nhất thiết nói đến gian trong cùng của Đền Tạm. “Vật chí thánh” bảo toàn ý nghĩa cấp tuyệt đối mà không đưa thêm liên tưởng không gian.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và phù hợp với lời chỉ thị nghi lễ. Dùng “ngươi” để duy trì cách xưng hô trực tiếp số ít trong mạch luật truyền cho Môi-se; dấu chấm phẩy giúp thể hiện hai hành động liên tiếp và kết quả của chúng.
