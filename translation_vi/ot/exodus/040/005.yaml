base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: vi
  text: Hãy đặt bàn thờ vàng để dâng hương trước Hòm Lời Chứng[a], rồi treo màn che lối vào Đền Tạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “hòm của lời chứng”; theo cách gọi truyền thống thường là “Hòm Giao Ước.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Con hãy đặt
  rationale: נתן ở đây chỉ việc đặt một vật dụng thánh vào vị trí đã định. “Hãy đặt” tự nhiên và phù hợp với lời chỉ dẫn trực tiếp dành cho Môi-se.
- source_word: מִזְבַּח הַזָּהָב
  choice: bàn thờ bằng vàng
  rationale: Cụm Hê-bơ-rơ mô tả vật liệu của bàn thờ. “Bằng vàng” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: לִקְטֹרֶת
  choice: để dâng hương
  rationale: Giới từ לְ diễn tả công dụng; “để dâng hương” truyền đạt chức năng của bàn thờ rõ hơn cách gọi gộp “bàn thờ xông hương”.
- source_word: לִפְנֵי
  choice: trước
  rationale: Giữ nghĩa không gian trực tiếp của לִפְנֵי trong việc sắp đặt các vật dụng của Đền Tạm.
- source_word: אֲרוֹן הָעֵדֻת
  choice: Hòm Chứng Ước
  rationale: עֵדֻת có nghĩa là “chứng ước/chứng cớ”, không phải từ “giao ước”. “Hòm Chứng Ước” vừa chính xác hơn với nguyên ngữ vừa giữ sắc thái trang trọng.
- source_word: וְשַׂמְתָּ
  choice: rồi treo
  rationale: Với מָסַךְ là một bức màn ở cửa, tiếng Việt tự nhiên diễn đạt hành động đặt nó đúng chỗ bằng “treo”; “rồi” liên kết mệnh lệnh kế tiếp mà không làm thay đổi trình tự.
- source_word: מָסַךְ הַפֶּתַח
  choice: bức màn ở lối vào
  rationale: מָסַךְ trong ngữ cảnh Đền Tạm là màn che tại cửa. “Bức màn” tự nhiên hơn “tấm chắn” và vẫn phân biệt được theo ngữ cảnh với màn ngăn bên trong.
- source_word: לַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן là nơi ngự có thể tháo lắp; “Đền Tạm” là cách gọi ngắn gọn, quen thuộc và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch עֵדֻת trong danh xưng của hòm
  choice: Hòm Chứng Ước
  alternative: Hòm Giao Ước
  rationale: Nguyên văn dùng עֵדֻת, “chứng ước/chứng cớ”, chứ không dùng בְּרִית, “giao ước”. Bản dịch giữ sự phân biệt từ vựng này thay vì thay bằng danh xưng truyền thống quen thuộc hơn.
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng dễ hiểu. Dùng “Con hãy” vì Đức Chúa Trời đang trực tiếp truyền lệnh cho Môi-se trong ngữ cảnh; viết hoa các danh xưng “Hòm Chứng Ước” và “Đền Tạm” để thể hiện chúng là tên gọi chuyên biệt.
