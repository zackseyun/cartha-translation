base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/022.yaml
  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: vi
  text: Ông đặt chiếc bàn trong Lều Hội Kiến, ở phía bắc của Đền Tạm, bên ngoài bức màn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là bức màn ngăn bên trong, che khuất Nơi Chí Thánh.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ông đặt
  rationale: Trong ngữ cảnh sắp đặt các vật dụng, động từ נתן mang nghĩa đặt hoặc để; “đặt” tự nhiên và chính xác trong tiếng Việt.
- source_word: הַשֻּׁלְחָן
  choice: chiếc bàn
  rationale: Nguyên văn chỉ nói “cái bàn” với mạo từ xác định, không thêm chức năng hay tên gọi vốn không xuất hiện trong câu này.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: trong Lều Hội Kiến
  rationale: Cách gọi này truyền đạt danh xưng אֹהֶל מוֹעֵד theo lối quen thuộc, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: ở phía bắc của Đền Tạm
  rationale: יֶרֶךְ chỉ cạnh hoặc phía bên, còn צָפֹנָה xác định hướng bắc; cách diễn đạt này tự nhiên trong mô tả vị trí.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ tiếng Việt quen thuộc cho מִשְׁכָּן trong phần mô tả nơi thánh của sách Xuất Ê-díp-tô Ký.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: bên ngoài bức màn
  rationale: מִחוּץ diễn tả vị trí ở ngoài, còn פָּרֹכֶת là tấm màn ngăn bên trong che khuất Nơi Chí Thánh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và sáng rõ. Dùng “Lều Hội Kiến” và “Đền Tạm” như các danh xưng quen thuộc; đại từ “Ông” nối tự nhiên với Môi-se trong văn mạch. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
