translation:
  language: vi
  text: Ông đặt chậu giữa Lều Hội Kiến và bàn thờ, rồi đổ nước vào đó để rửa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ông đặt
  rationale: Động từ שׂוּם chỉ việc đặt một vật vào vị trí; “đặt” tự nhiên và chính xác trong tiếng Việt. Đại từ “ông” tiếp nối chủ thể Môi-se từ ngữ cảnh.
- source_word: הַכִּיֹּר
  choice: cái chậu
  rationale: כִּיּוֹר là chậu lớn dùng cho việc tẩy rửa trong khuôn viên Đền Tạm; “cái chậu” rõ ràng, hiện đại hơn các từ cổ hoặc quá chuyên biệt.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: giữa Lều Hội Kiến và bàn thờ
  rationale: Giữ nghĩa trực tiếp của אֹהֶל מוֹעֵד và diễn đạt cấu trúc בֵּין...וּבֵין tự nhiên bằng “giữa... và...” trong tiếng Việt.
- source_word: וַיִּתֵּן
  choice: rồi đổ
  rationale: נָתַן cơ bản là “đặt/cho”, nhưng với nước và một vật chứa, “đổ” là cách diễn đạt tự nhiên trong tiếng Việt, không thay đổi hành động được mô tả.
- source_word: שָׁמָּה
  choice: vào đó
  rationale: Trạng từ chỉ nơi chốn có nghĩa “ở/đến đó”; “vào đó” phù hợp tự nhiên với động từ “đổ” và vẫn quy chiếu về cái chậu theo ngữ cảnh.
- source_word: מַיִם
  choice: nước
  rationale: Cách dịch trực tiếp danh từ chỉ nước.
- source_word: לְרָחְצָה
  choice: để tẩy rửa
  rationale: Dạng nguyên mẫu chỉ mục đích của רָחַץ. “Để tẩy rửa” giữ mục đích mà không thêm chủ thể như “các thầy tế lễ” hay đại từ phản thân vốn không được nêu trong câu.
