  rationale: Chỉ sửa động từ «tắm rửa» thành «rửa mình» để phản ánh chính xác hơn hành vi רחץ trong ngữ cảnh nghi lễ và trong cách dùng tiếng Việt hiện đại. Các yếu tố thời gian lặp lại, tên riêng, và mức độ không nêu rõ bộ phận được rửa đều được giữ nguyên.
