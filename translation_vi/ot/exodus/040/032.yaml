    rationale: Trong tiếng Việt hiện đại, «tắm rửa» thông thường gợi việc tắm toàn thân. Động từ רחץ ở đây chỉ việc rửa thanh tẩy; câu 32 không nêu tân ngữ, còn câu 31 cho biết đó là tay và chân. «Rửa mình» truyền đạt hành động rửa mà không thêm trực tiếp «tay chân» vào câu này.
  revised_text: Mỗi khi họ vào Lều Hội Kiến và mỗi khi họ đến gần bàn thờ, họ đều rửa mình, đúng như Yahweh đã truyền cho Môi-se.
