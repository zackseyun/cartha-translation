  text: בְּ/בֹאָ֞/ם אֶל אֹ֣הֶל מוֹעֵ֗ד וּ/בְ/קָרְבָתָ֛/ם אֶל הַ/מִּזְבֵּ֖חַ יִרְחָ֑צוּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: vi
  text: Mỗi khi họ vào Lều Hội Kiến và mỗi khi họ đến gần bàn thờ, họ đều rửa mình, đúng như Yahweh đã truyền cho Môi-se.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Mỗi khi họ vào
  rationale: Cấu trúc ב + động từ nguyên mẫu liên kết kèm hậu tố ngôi thứ ba số nhiều diễn tả hoàn cảnh thời gian. “Mỗi khi” làm rõ tính lặp lại của việc thực hành trong ngữ cảnh.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt cho lều thánh nơi Yahweh gặp dân Israel; diễn đạt cả yếu tố “lều” và “gặp gỡ”.
- source_word: וּבְקָרְבָתָם
  choice: và mỗi khi họ đến gần
  rationale: Cấu trúc thời gian song song với בְּבֹאָם; “đến gần” bám sát nghĩa của קרב và tự nhiên trong tiếng Việt.
- source_word: הַמִּזְבֵּחַ
  choice: bàn thờ
  rationale: Danh từ xác định trong ngữ cảnh Đền Tạm; tiếng Việt không cần thêm từ chỉ định vì đối tượng đã rõ.
- source_word: יִרְחָצוּ
  choice: họ đều tắm rửa
  rationale: Dạng chưa hoàn thành diễn tả hành động theo lệ thường trong mạch kể quá khứ. “Đều” phối hợp với “mỗi khi” để biểu đạt tính thường lệ; “tắm rửa” giữ nghĩa rộng, không tự ý xác định bộ phận cơ thể dù ngữ cảnh trước nói đến tay chân.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Diễn tả sự phù hợp chính xác với mệnh lệnh đã ban, tự nhiên và trang trọng trong tiếng Việt.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Đã” cho thấy mệnh lệnh có trước việc thi hành; “truyền” phù hợp văn phong Kinh Thánh mà vẫn dễ hiểu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước của Đức Chúa Trời, không thay bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: Với động từ צוה, אֶת đánh dấu người nhận lệnh; tiếng Việt tự nhiên dùng “truyền cho Môi-se”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng bốn phụ âm; giữ “Yahweh” bảo tồn chức năng danh riêng thay vì thay bằng tước hiệu.
- issue: Phạm vi của hành động rửa
  choice: tắm rửa
  alternative: rửa tay chân
  rationale: Câu này không nêu tân ngữ, dù câu 31 cung cấp ngữ cảnh tay chân. Không thêm “tay chân” để tránh biến điều hàm ẩn thành điều được nói rõ trong chính câu 32.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Hai vế “mỗi khi” giữ cấu trúc song song và tính lặp lại. “Lều Hội Kiến” và “Môi-se” dùng dạng tên gọi quen thuộc trong Kinh Thánh tiếng Việt.
