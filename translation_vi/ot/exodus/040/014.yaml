base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/014.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: vi
  text: Hãy đưa các con trai của A-rôn đến gần và mặc áo trong[a] cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “áo dài”. Từ Hê-bơ-rơ chỉ một loại áo mặc trên thân; câu này không nói rõ chất liệu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: cũng
  rationale: Liên từ cùng dấu chỉ tân ngữ tiếp nối chuỗi mệnh lệnh; tiếng Việt diễn đạt tự nhiên bằng “cũng” trong cấu trúc này.
- source_word: בָּנָיו
  choice: các con trai của A-rôn
  rationale: Danh từ chỉ các con trai; đại từ “của ông” trong nguyên văn quy chiếu về A-rôn ở câu trước, và nêu tên giúp câu đứng riêng vẫn rõ nghĩa.
- source_word: תַּקְרִיב
  choice: hãy đưa ... đến gần
  rationale: Dạng Hiphil của קרב mang nghĩa khiến ai đến gần, thường có sắc thái nghi lễ trong ngữ cảnh tư tế; cách dịch này giữ được hình ảnh và không thu hẹp thành một cách giải thích riêng.
- source_word: וְהִלְבַּשְׁתָּ
  choice: và mặc ... cho
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý khiến người khác mặc trang phục.
- source_word: אֹתָם
  choice: họ
  rationale: Đại từ tân ngữ số nhiều quy chiếu về các con trai của A-rôn.
- source_word: כֻּתֳּנֹת
  choice: áo dài
  rationale: Chỉ loại áo mặc sát thân, dài, không nhất thiết là áo choàng; không thêm chất liệu vải gai vì câu này không nêu.
theological_decisions:
- issue: Sắc thái tư tế/nghi lễ của קרב
  choice: đưa ... đến gần
  alternative: đưa ... ra trình diện
  rationale: “Đưa đến gần” bảo toàn nghĩa không gian và sắc thái nghi lễ của động từ Hê-bơ-rơ, thay vì xác định cụ thể họ được trình diện trước ai hoặc tại đâu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “ngươi” để phù hợp lời Đức Chúa Trời trực tiếp truyền lệnh cho Môi-se; nêu rõ A-rôn thay cho đại từ nhằm tránh mơ hồ khi câu được đọc riêng.
