    rationale: Danh từ Hê-bơ-rơ chỉ loại áo/tunic; bối cảnh là nghi lễ nhưng bản thân từ này không có nghĩa chuyên biệt là “áo lễ.”
  - severity: low
    issue: “Áo dài” có liên tưởng văn hóa mạnh trong tiếng Việt hiện đại.
    rationale: Dù có thể dùng theo truyền thống dịch Kinh Thánh, cách gọi này có thể khiến độc giả hình dung áo dài Việt Nam, không phải áo mặc sát thân/tunic cổ đại.
