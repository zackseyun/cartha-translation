  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: vi
  text: 'Bấy giờ, cơn giận của Yahweh bừng lên chống lại Môi-se, và Ngài phán: “Chẳng phải có A-rôn, người anh em của con, người Lê-vi, đó sao? Ta biết người ấy nói năng lưu loát[a]. Hơn nữa, kìa, người ấy đang ra đón con; khi thấy con, người ấy sẽ vui mừng trong lòng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta biết người ấy nói được.” Cấu trúc Hê-bơ-rơ nhấn mạnh động từ “nói”.'
    reason: Nêu phương án dịch ít diễn giải hơn và giải thích chức năng nhấn mạnh của nguyên mẫu tuyệt đối đi với động từ hữu hạn, không gán sắc thái thời gian không cần thiết.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: cơn giận … bừng lên
  rationale: Giữ hình ảnh cơn giận như lửa bùng lên trong thành ngữ Hê-bơ-rơ, đồng thời vẫn rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: הֲלֹא
  choice: Chẳng phải có … đó sao?
  rationale: Diễn đạt câu hỏi tu từ vốn chờ đợi câu trả lời khẳng định.
- source_word: אָחִיךָ הַלֵּוִי
  choice: anh của con, người Lê-vi
  rationale: Giữ quan hệ thân tộc và căn tính thuộc chi tộc Lê-vi; “người Lê-vi” ở đây không nhất thiết chỉ một chức vụ tế lễ.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: Ta biết người ấy có tài ăn nói
  rationale: Chuyển tải tự nhiên sắc thái nhấn mạnh của kết cấu nguyên mẫu tuyệt đối đi với động từ hữu hạn, trong ngữ cảnh đối lập với sự ngần ngại của Môi-se; chú thích giữ cách hiểu sát chữ và phương án “nói năng lưu loát”.
- source_word: וְגַם הִנֵּה
  choice: Kìa
  rationale: “Kìa” thu hút sự chú ý theo הִנֵּה một cách trang trọng nhưng hiện đại; ý bổ sung của וְגַם được tiếng Việt chuyển tải qua diễn tiến của câu.
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: đang đi ra đón con
  rationale: Thể phân từ chỉ hành động đang diễn ra hoặc cận kề; “đi ra đón” giữ cả ý ra đi và gặp đón.
- source_word: וְרָאֲךָ
  choice: khi thấy con
  rationale: Diễn đạt quan hệ thời gian tự nhiên giữa việc A-rôn thấy Môi-se và niềm vui tiếp theo.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: sẽ vui mừng trong lòng
  rationale: Giữ rõ chiều kích nội tâm được nêu trực tiếp trong tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của הַלֵּוִי
  choice: người Lê-vi
  alternative: thầy tế lễ Lê-vi
  rationale: Cụm từ xác định A-rôn theo chi tộc; câu này chưa tự nó khẳng định chức vụ tế lễ, nên không đưa chức vụ ấy vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể Yahweh trong lời dẫn và cặp xưng hô “Ta—con” trong lời Đức Chúa Trời phán với Môi-se. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
