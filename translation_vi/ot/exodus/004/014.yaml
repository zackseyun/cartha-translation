revisions:
- from: 'Bấy giờ, cơn giận của Yahweh bừng lên đối với Môi-se, và Ngài phán: “Chẳng phải có A-rôn, anh của con, người Lê-vi đó sao? Ta biết người ấy có tài ăn nói[a]. Kìa, người ấy đang đi ra đón con; khi thấy con, người ấy sẽ vui mừng trong lòng.”'
  to: 'Bấy giờ, cơn giận của Yahweh bừng lên chống lại Môi-se, và Ngài phán: “Chẳng phải có A-rôn, người anh em của con, người Lê-vi, đó sao? Ta biết người ấy nói năng lưu loát[a]. Hơn nữa, kìa, người ấy đang ra đón con; khi thấy con, người ấy sẽ vui mừng trong lòng.”'
  rationale: Chỉnh các chỗ cần thiết để phản ánh chính xác hơn quan hệ “cơn giận ... chống lại”, sức nhấn mạnh của động từ “nói”, và cả hai thành tố “hơn nữa, kìa”. Bảo lưu ngôn ngữ hiện đại, trang trọng, tên riêng và các thuật ngữ chủ chốt của bản nháp.
