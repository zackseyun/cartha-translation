  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: vi
  text: 'Ngài để ông yên.[a] Khi ấy bà nói: “Chàng rể của máu”[b]—vì việc cắt bì.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hê-bơ-rơ nói theo nghĩa đen là “người ấy buông/ngừng khỏi người ấy.” Theo văn cảnh, chủ thể được hiểu là Đức Giê-hô-va và đối tượng là Môi-se.
    reason: referent_ambiguity
  - marker: b
    text: “Chàng rể của máu” là một thành ngữ Hê-bơ-rơ khó hiểu; có thể là một lời cảm thán hoặc một cách gọi gắn với nghi thức cắt bì.
    reason: lexical_alternative
  - marker: c
    text: 'Từ Hê-bơ-rơ ở đây có dạng số nhiều: “những lần cắt bì” hoặc “các nghi thức cắt bì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: Ngài buông tha ông
  rationale: Động từ רפה với מן ở đây diễn tả việc ngừng hành động chống lại một người. Cách dịch này tự nhiên trong tiếng Việt; theo văn cảnh gần, chủ thể là Đức Giê-hô-va và đối tượng là Môi-se, dù bản Hê-bơ-rơ chỉ dùng các đại từ.
- source_word: אָז
  choice: Khi ấy
  rationale: Trạng từ chỉ thời gian nối sự việc này với việc Đức Giê-hô-va ngừng tấn công; “Khi ấy” phù hợp với mạch kể trang trọng, tự nhiên.
- source_word: אָמְרָה
  choice: bà nói
  rationale: Dịch đơn giản động từ אמר; chủ thể giống cái được hiểu từ văn cảnh là Xíp-pô-ra.
- source_word: חֲתַן דָּמִים
  choice: Chàng rể của máu
  rationale: Giữ sát cấu trúc cụm danh từ Hê-bơ-rơ và sự khó hiểu có thật của thành ngữ, thay vì quyết định rằng đây là lời ghê tởm, một danh xưng nghi lễ hay một cách nói về đổ máu.
- source_word: לַמּוּלֹת
  choice: vì phép cắt bì
  rationale: Trong văn cảnh, cụm từ giải thích lời Xíp-pô-ra vừa nói bằng cách liên hệ nó với nghi thức cắt bì. Danh từ Hê-bơ-rơ có dạng số nhiều hiếm gặp; điều này được ghi trong chú thích.
theological_decisions:
- issue: Chủ thể và đối tượng của câu “Ngài buông tha ông”
  choice: Hiểu chủ thể là Đức Giê-hô-va và đối tượng là Môi-se, thể hiện bằng “Ngài” và “ông”.
  alternative: Giữ hoàn toàn mơ hồ bằng các đại từ không xác định, hoặc hiểu đối tượng theo nghĩa khái quát từ văn cảnh.
  rationale: Câu 24 nêu Đức Giê-hô-va là Đấng đối đầu và định giết, còn câu 26 kết thúc hành động ấy. Môi-se là đối tượng tự nhiên nhất theo mạch kể, nhưng chú thích vẫn cho biết bản Hê-bơ-rơ chỉ dùng đại từ.
- issue: Ý nghĩa của cụm “Chàng rể của máu”
  choice: Giữ nguyên hình ảnh thành ngữ mà không giải quyết chính xác sắc thái văn hóa hay cảm xúc.
  alternative: Hiểu là tiếng kêu ghê tởm, một danh xưng nghi lễ gắn với cắt bì, hoặc lời nói trực tiếp với Môi-se hay đứa trẻ.
  rationale: Cụm Hê-bơ-rơ ngắn gọn, khó hiểu và có thể chứa ý nghĩa văn hóa nay không còn chắc chắn. Dịch sát giúp giữ nguyên sự căng thẳng và tính mơ hồ thay vì đưa một cách giải thích riêng vào bản văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” nhận diện chủ thể thần linh theo văn cảnh; “bà” chỉ Xíp-pô-ra. Cụm khó “Chàng rể của máu” được giữ có chủ ý, còn dấu gạch ngang làm rõ rằng vế cuối là lời giải thích của người kể.
