  source_fidelity: 'Bản nháp nhận diện đúng mạch văn: chủ thể ngầm của וַיִּרֶף là Đức Giê-hô-va và đối tượng tự nhiên nhất là Môi-se; cụm חֲתַן דָּמִים được giữ theo nghĩa đen và לַמּוּלֹת được dịch theo chức năng giải thích. Tuy nhiên, “buông tha” dễ chuyển nghĩa sang tha thứ hoặc phóng thích, trong khi רפה מן ở đây là ngừng/không tiếp tục hành động chống lại ai. “để ông yên” truyền đạt chính xác hơn mà vẫn không diễn giải quá mức.'
