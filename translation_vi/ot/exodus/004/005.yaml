id: EXO.4.5
reference: Exodus 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: vi
  text: để họ tin rằng Yahweh[a], Đức Chúa Trời của tổ phụ họ[b], Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp, đã hiện ra với con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: “YHWH”; theo truyền thống thường được dịch là “CHÚA”. Các cách phiên âm khác gồm “Yahweh” và “Giê-hô-va”.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “Đức Chúa Trời của tổ tiên họ”. Tiếng Hê-bơ-rơ nói sát nghĩa: “Đức Chúa Trời của các cha họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên mục đích của dấu lạ, đồng thời có thể bao hàm kết quả dự kiến.
- source_word: יַאֲמִינוּ
  choice: họ tin
  rationale: Trong ngữ cảnh, động từ chỉ việc dân tiếp nhận lời xác nhận rằng Đức Chúa Trời đã hiện ra với Môi-se.
- source_word: כִּי
  choice: rằng
  rationale: Ở đây từ này dẫn vào nội dung họ cần tin, không phải một mệnh đề chỉ nguyên nhân.
- source_word: נִרְאָה
  choice: đã hiện ra
  rationale: Dạng Niphal của ראה ở đây mang nghĩa chủ động nội tại là 'hiện ra'; 'đã' thể hiện sự việc đã xảy ra mà không áp đặt một hệ thống thì xa lạ lên tiếng Hê-bơ-rơ.
- source_word: אֵלֶיךָ
  choice: với con
  rationale: Giới từ אֶל với hậu tố ngôi hai số ít giống đực có nghĩa 'đến/với ngươi'. Trong lời Đức Chúa Trời phán với Môi-se, 'con' là cách xưng hô tiếng Việt tự nhiên, trang trọng và phù hợp quan hệ giao tiếp.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước YHWH thay vì thay bằng một tước hiệu; chú thích ghi nhận lối dịch truyền thống.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: Đức Chúa Trời của tổ phụ họ
  rationale: '''Tổ phụ'' giữ sắc thái nam tính và ý nghĩa dòng dõi giao ước của אֲבוֹת, đồng thời tự nhiên hơn ''các cha của họ'' trong tiếng Việt.'
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp
  rationale: Giữ nguyên sự lặp lại 'Đức Chúa Trời của' trước tên từng tổ phụ, bảo tồn nhịp điệu trang trọng và tính nhấn mạnh của nguyên văn.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm YHWH. 'Yahweh' bảo tồn danh riêng; chú thích cho biết cách dịch truyền thống mà không biến tước hiệu thành nguyên văn.
- issue: Cách dịch אֲבֹתָם
  choice: tổ phụ họ
  alternative: tổ tiên họ
  rationale: Danh từ nguồn ở số nhiều giống đực và trong ngữ cảnh chỉ dòng dõi các tổ phụ được nêu tên ngay sau đó. 'Tổ phụ' bảo tồn nét nghĩa này, còn 'tổ tiên' rộng và trung tính hơn.
- issue: Sự lặp lại tước xưng trước ba tổ phụ
  choice: lặp lại đầy đủ 'Đức Chúa Trời của'
  alternative: Đức Chúa Trời của Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Nguyên văn lặp אֱלֹהֵי trước từng tên; giữ sự lặp lại bảo tồn tính trang trọng và nhấn mạnh mà không thêm diễn giải thần học.
- issue: Đại từ ngôi hai số ít chỉ Môi-se
  choice: con
  alternative: ngươi; ông
  rationale: Nguyên văn chỉ xác định ngôi hai số ít giống đực, không tự nó ấn định hệ thống đại từ tiếng Việt. 'Con' phù hợp lời Đức Chúa Trời trực tiếp phán với Môi-se và dễ hiểu trong tiếng Việt hiện đại; chú thích bảo tồn thông tin hình thái để tránh coi sắc thái thân tộc của tiếng Việt là một phần minh nhiên của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời” làm danh xưng thông dụng trong văn phong Kinh Thánh tiếng Việt, “tổ phụ” để giữ sắc thái dòng dõi nam trong nguyên văn, và lặp đầy đủ danh xưng trước Áp-ra-ham, Y-sác, Gia-cốp để duy trì nhịp điệu Hê-bơ-rơ. Tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
