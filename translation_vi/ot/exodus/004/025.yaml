  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/תִּקַּ֨ח צִפֹּרָ֜ה צֹ֗ר וַ/תִּכְרֹת֙ אֶת עָרְלַ֣ת בְּנָ֔/הּ וַ/תַּגַּ֖ע לְ/רַגְלָ֑י/ו וַ/תֹּ֕אמֶר כִּ֧י חֲתַן דָּמִ֛ים אַתָּ֖ה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: vi
  text: 'Bấy giờ, Sê-phô-ra lấy một hòn đá lửa, cắt bao quy đầu của con trai mình, rồi chạm vào chân của người ấy[a] và nói: “Người thật là chồng máu đối với tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “chân của người ấy.” “Chân” có thể là cách nói giảm chỉ bộ phận sinh dục; đại từ “người ấy” có thể chỉ Môi-se hoặc người con.'
    reason: Giữ nghĩa đen của “chân,” đồng thời bảo lưu khả năng uyển ngữ và sự mơ hồ về đối tượng của đại từ.
lexical_decisions:
- source_word: צֹר
  choice: một hòn đá lửa
  rationale: Danh từ chỉ đá lửa được dùng làm dụng cụ cắt; cách dịch này cụ thể, tự nhiên và phù hợp với việc cắt bao quy đầu.
- source_word: עָרְלַת בְּנָהּ
  choice: bao quy đầu của con trai mình
  rationale: Chuyển dịch trực tiếp, chính xác về giải phẫu và làm rõ quan hệ sở hữu tự nhiên trong tiếng Việt.
- source_word: וַתַּגַּע
  choice: dùng nó chạm vào
  rationale: Động từ נגע có nghĩa cơ bản là chạm; “dùng nó” diễn đạt tự nhiên rằng vật vừa bị cắt là vật tiếp xúc, nhưng không xác định thêm cách thức.
- source_word: לְרַגְלָיו
  choice: chân người
  rationale: Giữ nghĩa từ vựng thông thường của רֶגֶל và không tự ý xác định đại từ chỉ Môi-se hay người con; “người” phù hợp với lối xưng hô trực tiếp trang trọng trong câu kế tiếp.
- source_word: כִּי
  choice: Quả thật
  rationale: Trong lời cảm thán này, כִּי mang sắc thái khẳng định, nhấn mạnh hơn là nêu nguyên nhân.
- source_word: חֲתַן דָּמִים
  choice: chồng của máu
  rationale: Giữ nguyên hình ảnh lạ và sự khó hiểu có chủ ý của cụm Hê-bơ-rơ, thay vì giải nghĩa theo một cách diễn giải riêng. חָתָן trong ngữ cảnh lời người vợ nói với người nam được chuyển là “chồng” tự nhiên hơn “chàng rể” trong tiếng Việt.
- source_word: לִי
  choice: đối với tôi
  rationale: Diễn đạt quan hệ cá nhân do giới từ לְ đánh dấu, đồng thời kết hợp tự nhiên hơn với cụm danh từ được giữ sát nguyên ngữ.
theological_decisions:
- issue: “Chân người” có phải là cách nói giảm chỉ bộ phận sinh dục, và đại từ chỉ Môi-se hay người con
  choice: Giữ “chân người” trong chính văn, không xác định người được nói đến
  alternative: bộ phận sinh dục của Môi-se; chân hoặc bộ phận sinh dục của người con
  rationale: Nguyên văn chỉ nói “chân của người ấy”; cả khả năng dùng “chân” như một uyển ngữ lẫn đối tượng của đại từ đều không chắc chắn. Chú thích bảo tồn các khả năng chính mà không giải quyết thay cho bản văn.
- issue: Ý nghĩa của cụm חֲתַן דָּמִים
  choice: Giữ hình ảnh “chồng của máu”
  alternative: người chồng có được nhờ máu; chàng rể đẫm máu; người thân bằng hôn nhân qua máu
  rationale: Cụm từ hiếm và khó hiểu; bản văn không giải thích đầy đủ quan hệ giữa phép cắt bao quy đầu, máu và danh xưng này, nên không nên đưa một cách giải nghĩa thần học vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Sê-phô-ra” theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc; dùng “bao quy đầu” để chính xác, không nói tránh. Cụm “chồng của máu” được giữ cố ý khác thường nhằm phản ánh cấu trúc và tính bí ẩn của nguyên văn.
