base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: vi
  text: 'Nhưng ông thưa[a]: “Ôi, lạy Chúa tôi, xin hãy sai người mà Ngài sẽ sai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, diễn ý rõ hơn: “Ôi, lạy Chúa tôi, xin hãy sai một người khác.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng ông thưa
  rationale: Liên từ nối tiếp diễn tiến câu chuyện, nhưng trong ngữ cảnh này mang sắc thái tương phản vì Môi-se vẫn khước từ sau những lời đáp của Đức Chúa Trời. “Thưa” tự nhiên trong lời kính cẩn hướng về bề trên.
- source_word: בִּי
  choice: Lạy
  rationale: Trong thành ngữ đứng trước lời xưng hô kính trọng, từ này mở đầu một lời khẩn khoản. Tiếng Việt không cần dịch riêng thành một từ cầu xin vì “lạy” cùng “xin” phía sau đã truyền đạt tự nhiên sắc thái cung kính, nài xin.
- source_word: אֲדֹנָי
  choice: Chúa của con
  rationale: Đây là lời trực tiếp kính cẩn thưa với Đức Chúa Trời, không phải danh יהוה. “Chúa của con” giữ sắc thái sở hữu ngôi thứ nhất mà không đồng nhất từ này với danh giao ước.
- source_word: שְׁלַח נָא
  choice: xin hãy sai
  rationale: Mệnh lệnh שְׁלַח được làm mềm bởi tiểu từ khẩn khoản נָא; “xin hãy sai” thể hiện rõ cả hành động lẫn giọng nài xin trong tiếng Việt hiện đại.
- source_word: בְּיַד
  choice: sai người nào
  rationale: Nghĩa đen là “bởi tay,” một thành ngữ chỉ tác nhân. Trong tiếng Việt, dịch nguyên dạng “bởi tay” ở đây thiếu tự nhiên; diễn đạt bằng “sai người” truyền đạt chức năng tác nhân và vẫn cho phép giữ sự mơ hồ của toàn mệnh đề.
- source_word: תִּשְׁלָח
  choice: Ngài muốn sai
  rationale: Dạng chưa hoàn thành của שלח trong kết cấu gần như mệnh đề quan hệ. “Muốn sai” tạo câu tiếng Việt tự nhiên, đồng thời không thêm rõ “người khác,” điều bản văn Hê-bơ-rơ không nói trực tiếp.
theological_decisions:
- issue: Cách hiểu lời yêu cầu né tránh của Môi-se
  choice: 'Giữ sự mơ hồ: “xin hãy sai người nào Ngài muốn sai.”'
  alternative: “Xin Chúa sai một người khác.”
  rationale: Ngữ cảnh cho thấy Môi-se miễn cưỡng và có lẽ muốn Đức Chúa Trời sai người khác, nhưng nguyên văn không nói rõ “người khác.” Bản chính giữ sự căng thẳng và lối nói vòng của tiếng Hê-bơ-rơ; chú thích cung cấp cách hiểu theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ông thưa” phù hợp với lời nói kính cẩn; “Ngài” được dùng trong lời trực tiếp với Đức Chúa Trời. Câu chính tránh lối dịch cứng “bởi tay người Ngài sẽ sai,” nhưng vẫn bảo toàn sự mơ hồ có chủ ý của nguyên văn.
