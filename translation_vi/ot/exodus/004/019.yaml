source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se tại Ma-đi-an: “Hãy đi, trở về Ai Cập[a], vì tất cả những người đàn ông tìm cách giết ông đều đã chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy trở về Ai Cập.” Tiếng Hê-bơ-rơ giữ hai động từ mệnh lệnh, theo nghĩa đen là “đi, trở về Ai Cập.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ đúng chức năng của Danh trong nguyên文 thay vì thay bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Trong tiếng Việt, “phán” là cách diễn đạt tự nhiên, trang trọng khi Đức Chúa Trời nói, mà không làm thay đổi nội dung của động từ אמר.
- source_word: בְּמִדְיָן
  choice: Khi Môi-se còn ở Ma-đi-an
  rationale: Giữ ý chỉ địa điểm của giới từ ב, đồng thời đặt thành mệnh đề mở đầu tự nhiên trong tiếng Việt và tránh khiến cụm địa điểm bị hiểu là nơi Đức Chúa Trời hiện diện.
- source_word: לֵךְ שֻׁב
  choice: Hãy đi, trở về
  rationale: 'Giữ cả hai mệnh lệnh trong tiếng Hê-bơ-rơ: לֵךְ diễn tả việc lên đường, còn שֻׁב là trở về.'
- source_word: מִצְרָיִם
  choice: Ai Cập
  rationale: Sau động từ “trở về”, tiếng Việt không bắt buộc thêm giới từ; tên địa danh diễn đạt rõ đích đến.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho mệnh lệnh một cách trực tiếp và tự nhiên.
- source_word: מֵתוּ
  choice: đều đã chết
  rationale: Diễn đạt hành động đã hoàn tất và kết quả còn liên quan ở thời điểm Đức Chúa Trời phán.
- source_word: כָּל הָאֲנָשִׁים
  choice: tất cả những kẻ
  rationale: Trong ngữ cảnh thù địch, “những kẻ” là tự nhiên; tiếng Việt không cần đánh dấu giới tính nam như danh từ số nhiều אֲנָשִׁים, và trọng tâm là toàn bộ nhóm người truy sát.
- source_word: הַמְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: tìm giết con
  rationale: Thành ngữ “tìm mạng sống” ở đây có nghĩa là tìm cách giết Môi-se; “tìm giết con” truyền đạt rõ nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay thế bằng tước hiệu.
- issue: Ý nghĩa của אֶת נַפְשֶׁךָ trong ngữ cảnh truy sát
  choice: tìm giết con
  alternative: tìm mạng sống của con
  rationale: נֶפֶשׁ ở đây chỉ mạng sống trong thành ngữ nói về ý định giết người, không đặt ra sự phân biệt thần học giữa “linh hồn” và “thân thể”.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se”, “Ma-đi-an”, “Ai Cập” theo dạng tên quen thuộc trong tiếng Việt; dùng đại từ “con” trong lời Yahweh nói với Môi-se để thể hiện quan hệ trên–dưới tự nhiên mà không thêm một tước hiệu không có trong nguyên văn.
