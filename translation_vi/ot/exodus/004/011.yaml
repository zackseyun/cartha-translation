base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với ông: “Ai ban cho con người cái miệng? Hoặc ai khiến người ta câm, điếc, sáng mắt hoặc mù? Chẳng phải chính Ta, Đức Giê-hô-va, sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để biểu thị danh riêng của Đức Chúa Trời trong nguyên văn.
- source_word: שָׂם פֶּה לָאָדָם
  choice: đặt miệng nơi con người
  rationale: Giữ hình ảnh cụ thể và sắc thái chất vấn của tiếng Hê-bơ-rơ, đồng thời vẫn dễ hiểu trong tiếng Việt.
- source_word: אִלֵּם
  choice: câm
  rationale: Tương ứng trực tiếp với tình trạng không nói được trong nguyên văn.
- source_word: חֵרֵשׁ
  choice: điếc
  rationale: Tương ứng trực tiếp với từ chỉ người không nghe được.
- source_word: פִקֵּחַ
  choice: sáng mắt
  rationale: Trong thế đối xứng với “mù lòa”, từ này chỉ người có khả năng nhìn thấy; “sáng mắt” diễn đạt tự nhiên mà không thêm ý giải nghĩa.
- source_word: עִוֵּר
  choice: mù lòa
  rationale: Cách diễn đạt trang trọng, thông dụng cho tình trạng không nhìn thấy.
- source_word: אָנֹכִי
  choice: chính Ta
  rationale: Đại từ nhấn mạnh được thể hiện bằng “chính”, giữ lực của câu hỏi tu từ.
theological_decisions:
- issue: Lời tuyên bố Đức Giê-hô-va làm cho người ta câm, điếc, sáng mắt hoặc mù lòa
  choice: Dịch trực tiếp “Ai làm cho người ta...” và “Chẳng phải chính Ta...”
  alternative: Làm nhẹ thành ngôn ngữ cho phép hoặc chỉ nói Đức Chúa Trời biết về các tình trạng ấy
  rationale: Nguyên văn dùng động từ trực tiếp יָשׂוּם và câu hỏi tu từ quy hành động cho Đức Giê-hô-va; bản dịch giữ nguyên sức căng thần học thay vì giải thích hoặc giảm nhẹ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc các câu hỏi tu từ của nguyên văn; dùng “ông” để chỉ Môi-se theo mạch văn, và viết hoa “Ta” trong lời Đức Giê-hô-va.
