id: EXO.4.9
reference: Exodus 4:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: vi
  text: Nếu họ không tin ngay cả hai dấu lạ này và không nghe lời con[a], thì con hãy lấy một ít nước sông Nin đổ trên đất khô. Nước con lấy từ sông Nin sẽ biến thành máu[b] trên đất khô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “không nghe tiếng con”; thành ngữ này cũng có thể hiểu là “không nghe theo con.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ trở thành máu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Nếu
  rationale: Cụm này mở đầu một tình huống điều kiện; “Nếu” diễn đạt tự nhiên trong tiếng Việt mà không thêm cách nói rườm rà “và sẽ xảy ra rằng”.
- source_word: יַאֲמִינוּ
  choice: không tin
  rationale: Động từ ở đây nói đến việc tin vào giá trị chứng thực của các dấu lạ; “tin” là cách diễn đạt rõ ràng và phù hợp với mạch truyện.
- source_word: גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: vẫn không tin ngay cả hai dấu lạ này
  rationale: “Ngay cả” thể hiện sắc thái tăng tiến của גַּם, còn “hai dấu lạ này” chỉ hai dấu lạ vừa được ban cho Môi-se.
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: không nghe lời con
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa là nghe theo hoặc chú ý đến lời một người. “Nghe lời con” tự nhiên trong tiếng Việt, còn nghĩa sát mặt chữ được ghi ở chú thích.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: một ít nước sông Nin
  rationale: Giới từ מִן mang nghĩa bộ phận; “một ít nước” thể hiện rằng Môi-se chỉ lấy một phần nước từ sông Nin.
- source_word: וְשָׁפַכְתָּ
  choice: đổ
  rationale: “Đổ” là động từ tiếng Việt trực tiếp và tự nhiên cho hành động שפך trong ngữ cảnh này.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: đất khô
  rationale: Từ này chỉ phần đất khô đối lập với nước. Lặp lại “đất khô” ở cả hai vị trí giữ được sự nhấn mạnh của nguyên văn.
- source_word: וְהָיוּ ... לְדָם
  choice: sẽ biến thành máu
  rationale: Cấu trúc היה + ל diễn tả sự biến đổi hoặc kết quả; “biến thành máu” vừa rõ nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: דָם
  choice: máu
  rationale: Danh từ có nghĩa trực tiếp là “máu”; ngữ cảnh không cho phép làm nhẹ thành “màu máu” hay “đỏ như máu”.
theological_decisions:
- issue: Bản chất của dấu lạ nước sông Nin biến thành máu
  choice: 'Diễn đạt như một sự biến đổi trực tiếp: “sẽ biến thành máu.”'
  alternative: sẽ có màu như máu; sẽ đỏ như máu
  rationale: Nguyên văn khẳng định nước trở thành máu mà không kèm yếu tố so sánh hay giới hạn. Bản dịch không làm nhẹ lời khẳng định hoặc đưa vào một cách giải thích tự nhiên hóa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp với lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh. Câu được tách làm hai để tránh nặng nề nhưng vẫn giữ trình tự và sự lặp lại có chủ ý của nguyên văn.
