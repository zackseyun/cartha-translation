base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: vi
  text: 'Ngài phán: “Hãy đưa tay con trở lại vào lòng áo của con[a].” Ông đưa tay trở lại vào lòng áo của ông; rồi rút tay ra, và kìa, bàn tay đã trở lại như da thịt ông[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vào nếp áo trước ngực của con.”
    reason: cultural_note
  - marker: b
    text: Nghĩa là bàn tay ông đã trở lại trạng thái da thịt bình thường.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: đưa ... trở lại
  rationale: Dạng mệnh lệnh Hiphil của שוב mang nghĩa khiến bàn tay trở về chỗ trước đó. “Đưa ... trở lại” vừa tự nhiên trong tiếng Việt vừa giữ rõ ý trở về.
- source_word: חֵיק
  choice: lòng áo
  rationale: Từ này chỉ vùng ngực hoặc nếp áo trước ngực, nơi có thể giấu hay đặt bàn tay vào. “Lòng áo” phù hợp với động tác trong ngữ cảnh hơn “lòng” hoặc “ngực” đơn thuần.
- source_word: וַיָּשֶׁב
  choice: đưa ... trở lại
  rationale: Động từ kể chuyện của שוב lặp lại động tác trong mệnh lệnh; cách dịch nhất quán làm nổi bật việc Môi-se làm đúng như lời truyền.
- source_word: וַיּוֹצִאָהּ
  choice: rút tay ra
  rationale: Dạng Hiphil của יצא có nghĩa là đưa ra ngoài. Trong ngữ cảnh bàn tay nằm trong lòng áo, “rút tay ra” là cách nói tự nhiên, chính xác trong tiếng Việt.
- source_word: וְהִנֵּה
  choice: thì kìa
  rationale: Tiểu từ này hướng sự chú ý đến kết quả bất ngờ. “Thì kìa” giữ được sức gợi của lời kể mà không giải thích quá mức.
- source_word: שָׁבָה
  choice: đã trở lại
  rationale: Động từ giống cái số ít quy chiếu về bàn tay và diễn tả sự trở lại trạng thái trước đó. “Đã trở lại” bám sát động từ hơn cách diễn giải “đã được chữa lành”.
- source_word: כִּבְשָׂרוֹ
  choice: giống như da thịt ông
  rationale: Tiền tố כ־ biểu thị sự so sánh. Bản dịch giữ cách nói súc tích của tiếng Hê-bơ-rơ; ý bàn tay trở lại bình thường được làm rõ trong chú thích mà không bị đưa thẳng vào chính văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài phán” để giữ chủ ngữ đại từ hàm ẩn theo ngữ cảnh, “ông” cho Môi-se, và “con” trong lời Đức Chúa Trời truyền cho Môi-se. Cụm “thì kìa” bảo tồn sắc thái gây chú ý của וְהִנֵּה.
