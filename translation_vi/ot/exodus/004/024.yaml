source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: vi
  text: Dọc đường, tại một chỗ nghỉ đêm[b], Yahweh gặp người ấy[a] và tìm cách giết người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ không nói rõ “người ấy” là ai; đại từ này có thể chỉ Môi-se hoặc, theo một số cách giải thích, con trai ông.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “tại nơi cắm trại qua đêm”; từ Hê-bơ-rơ chỉ một nơi nghỉ lại, không nhất thiết là quán trọ thương mại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Dọc đường, ...
  rationale: Công thức trần thuật mở đầu một tình tiết mới. Trong tiếng Việt, chuyển thẳng sang hoàn cảnh của sự việc tự nhiên hơn cách dịch sát chữ như “Và chuyện xảy ra rằng”, đồng thời vẫn giữ được chức năng dẫn nhập.
- source_word: בַדֶּרֶךְ
  choice: Dọc đường
  rationale: Diễn đạt tự nhiên ý nghĩa chỉ địa điểm hoặc chặng hành trình của cụm Hê-bơ-rơ.
- source_word: בַמָּלוֹן
  choice: tại một chỗ nghỉ đêm
  rationale: מָלוֹן là nơi dừng lại để qua đêm, không nhất thiết là quán trọ thương mại; cách dịch này tránh sắc thái lỗi thời hoặc không phù hợp bối cảnh.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: gặp người ấy
  rationale: פגע có nghĩa cốt lõi là gặp hoặc chạm mặt. “Gặp” không tự thêm sắc thái đối đầu; ý đe dọa được thể hiện rõ trong mệnh đề tiếp theo. “Người ấy” giữ cho đại từ giống đực không có tiền ngữ minh thị vẫn chưa được xác định.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וַיְבַקֵּשׁ
  choice: tìm cách
  rationale: בקש mang nghĩa tìm kiếm hoặc tìm cách thực hiện điều gì. Trong ngữ cảnh này, “tìm cách” là tiếng Việt tự nhiên và vẫn giữ sức căng của ý định hành động.
- source_word: הֲמִיתוֹ
  choice: giết người
  rationale: Động từ מות ở thể Hifil với hậu tố ngôi ba giống đực có nghĩa làm cho người ấy chết. “Giết người” rõ ràng, trang trọng vừa phải và không xác định thêm người bị nhắm đến.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước; giữ “Yahweh” bảo toàn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Đối tượng của các hậu tố đại từ “người ấy/người”
  choice: Giữ nguyên sự không xác định trong câu chính
  alternative: Môi-se hoặc con trai của Môi-se
  rationale: Câu Hê-bơ-rơ không nêu rõ tiền ngữ của hậu tố giống đực số ít. Việc dùng “người ấy” rồi “người” bảo toàn sự mơ hồ thật sự của văn bản thay vì quyết định theo một cách giải thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, gọn và trang nghiêm. “Chỗ nghỉ đêm” dễ hiểu trong tiếng Việt phổ thông và tránh gợi hình ảnh một khách sạn hay quán trọ theo nghĩa hiện đại. Các dấu chú thích được đặt ngay sau thành phần mà chúng giải thích.
