  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ בְּ/לֶכְתְּ/ךָ֙ לָ/שׁ֣וּב מִצְרַ֔יְמָ/ה רְאֵ֗ה כָּל הַ/מֹּֽפְתִים֙ אֲשֶׁר שַׂ֣מְתִּי בְ/יָדֶ֔/ךָ וַ/עֲשִׂיתָ֖/ם לִ/פְנֵ֣י פַרְעֹ֑ה וַ/אֲנִי֙ אֲחַזֵּ֣ק אֶת לִבּ֔/וֹ וְ/לֹ֥א יְשַׁלַּ֖ח אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: vi
  text: 'Đức Yahweh phán với Môi-se: “Khi con trở về Ai Cập, hãy chú ý thực hiện trước mặt Pha-ra-ôn mọi việc kỳ diệu[a] mà Ta đã đặt vào tay con. Nhưng Ta sẽ làm cứng lòng vua[b], và vua sẽ không để dân chúng ra đi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dấu lạ” hoặc “các phép lạ”. Từ Hê-bơ-rơ này chỉ những hành động phi thường bày tỏ quyền năng thiêng liêng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “làm cho lòng vua mạnh lên” hoặc “làm cho lòng vua vững chắc”. Trong ngữ cảnh này, động từ Hê-bơ-rơ diễn tả Pha-ra-ôn được củng cố trong sự ngoan cố khước từ.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Yahweh
  rationale: Phiên âm danh riêng giao ước, đồng thời dùng “Đức” theo lối xưng hô trang trọng, tự nhiên trong tiếng Việt.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: Khi con trở về Ai Cập
  rationale: Diễn đạt tự nhiên cấu trúc thời gian và ý chuyển động trở lại Ai Cập.
- source_word: רְאֵה
  choice: hãy chú ý
  rationale: Mệnh lệnh ở đây mang nghĩa nhắc Môi-se phải cẩn thận thực hiện điều tiếp theo, không chỉ đơn thuần nhìn xem.
- source_word: הַמֹּפְתִים
  choice: những việc kỳ diệu
  rationale: Giữ sắc thái những hành động phi thường bày tỏ quyền năng thần thượng, mà không thu hẹp hoàn toàn vào thuật ngữ “dấu lạ” hay “phép lạ”.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: Ta đã đặt vào tay con
  rationale: Giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ về việc Đức Chúa Trời trao quyền và giao phó cho Môi-se.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: thực hiện trước mặt Pha-ra-ôn
  rationale: “Thực hiện” tự nhiên với “những việc kỳ diệu”; “trước mặt” giữ bối cảnh công khai trong sự hiện diện của Pha-ra-ôn.
- source_word: וַאֲנִי
  choice: Nhưng Ta
  rationale: Liên từ mở ra sự tương phản giữa việc Môi-se sẽ làm và hành động quyết định của Đức Yahweh.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: Ta sẽ làm cho lòng vua cứng lại
  rationale: Truyền đạt thể sai khiến của động từ חזק trong mạch truyện Pha-ra-ôn, đồng thời giữ nguyên sức căng về tác động của Đức Chúa Trời; “vua” làm rõ đại từ chỉ Pha-ra-ôn.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: và vua sẽ không để dân chúng ra đi
  rationale: Diễn đạt tự nhiên thành ngữ chỉ việc cho phép dân Y-sơ-ra-ên rời khỏi Ai Cập.
theological_decisions:
- issue: Đức Chúa Trời làm cứng lòng Pha-ra-ôn
  choice: Ta sẽ làm cho lòng vua cứng lại
  alternative: Ta sẽ làm cho lòng vua mạnh lên / vững lại
  rationale: Động từ חזק có thể mang nghĩa làm mạnh hoặc làm vững, nhưng trong mạch truyện này diễn tả Pha-ra-ôn bị củng cố trong sự khước từ. Bản dịch không làm nhẹ đi tác nhân thần thượng hay tự ý giải quyết sức căng giữa quyền tể trị của Đức Chúa Trời và trách nhiệm của Pha-ra-ôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta–con” thể hiện lời Đức Yahweh trực tiếp phán với Môi-se. Dùng “vua” sau khi đã nêu Pha-ra-ôn để tránh lặp tên mà vẫn xác định rõ chủ thể.
