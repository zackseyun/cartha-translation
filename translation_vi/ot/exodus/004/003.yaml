base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: vi
  text: 'Ngài phán: “Hãy ném nó xuống đất.” Môi-se liền ném nó xuống đất; nó hóa thành một con rắn, và Môi-se chạy trốn khỏi nó[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “khỏi trước mặt nó” (hoặc “ông ấy/người ấy”); đây là một thành ngữ có nghĩa là chạy tránh xa khỏi sự hiện diện của nó. Trong ngữ cảnh, sở chỉ tự nhiên nhất là con rắn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngài phán
  rationale: Chủ ngữ không được nêu lại trong câu nhưng theo ngữ cảnh là Đức Chúa Trời; “phán” là cách diễn đạt tự nhiên, trang trọng khi Đức Chúa Trời nói.
- source_word: הַשְׁלִיכֵהוּ אַרְצָה
  choice: Hãy ném nó xuống đất
  rationale: Mệnh lệnh chỉ việc ném cây gậy ở câu trước xuống mặt đất; “xuống đất” chuyển tải tự nhiên hậu tố chỉ hướng của אַרְצָה.
- source_word: וַיַּשְׁלִיכֵהוּ אַרְצָה
  choice: Môi-se liền ném nó xuống đất
  rationale: “Liền” thể hiện diễn tiến và sự đáp ứng ngay trong chuỗi tự sự wayyiqtol mà không làm câu tiếng Việt nặng nề.
- source_word: וַיְהִי לְנָחָשׁ
  choice: nó hóa thành một con rắn
  rationale: נָחָשׁ ở đây chỉ rắn; “hóa thành” diễn đạt rõ sự biến đổi và phù hợp văn phong kể chuyện hiện đại.
- source_word: וַיָּנָס מֹשֶׁה מִפָּנָיו
  choice: Môi-se chạy trốn khỏi nó
  rationale: וַיָּנָס diễn tả việc bỏ chạy; מִפָּנָיו theo nghĩa đen là “khỏi trước mặt nó/người ấy,” nhưng trong ngữ cảnh là thành ngữ chỉ chạy tránh xa con rắn. “Chạy trốn khỏi nó” tự nhiên và giữ đúng sở chỉ khả dĩ nhất.
theological_decisions:
- issue: Chủ ngữ ngầm của וַיֹּאמֶר
  choice: Ngài
  alternative: Đức Giê-hô-va / Người
  rationale: Ngữ cảnh xác định người nói là Đức Chúa Trời. “Ngài” duy trì liên kết với câu trước mà không thêm danh xưng vốn không xuất hiện trong chính câu này.
- issue: Sở chỉ của hậu tố trong מִפָּנָיו
  choice: nó, tức con rắn
  alternative: Ngài/người ấy
  rationale: Về hình thức, hậu tố giống đực số ít có thể chỉ “nó” hoặc “người ấy”; trong mạch kể, Môi-se bỏ chạy vì con rắn nên sở chỉ tự nhiên nhất là con rắn, nhưng không dựa vào đó để rút ra một khẳng định thần học riêng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Môi-se” theo lối phiên âm Kinh Thánh quen thuộc; tránh từ cổ “quăng” hoặc văn chương quá mức như “con rắn độc/serpent,” vì nguyên văn chỉ nói נָחָשׁ.
