- from: Bấy giờ, Môi-se đưa vợ và các con trai mình lên lưng lừa, rồi trở về đất Ai Cập. Môi-se cầm cây gậy của Đức Chúa Trời trong tay.
  to: Bấy giờ, Môi-se đem vợ và các con trai mình, cho họ cưỡi lừa, rồi trở về đất Ai Cập. Môi-se cầm cây gậy của Đức Chúa Trời trong tay.
  rationale: Chỉnh sửa duy nhất là tách rõ hành động «đem» khỏi hành động «cho họ cưỡi», tương ứng lần lượt với וַיִּקַּח và וַיַּרְכִּבֵם. Cách dịch vẫn giữ tính mơ hồ thực tế của câu về việc những người này cùng cưỡi con lừa, không thêm chi tiết về số lượng lừa hay cách họ di chuyển.
