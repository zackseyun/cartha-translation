  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: vi
  text: Bấy giờ, Môi-se đem vợ và các con trai mình, cho họ cưỡi lừa, rồi trở về đất Ai Cập. Môi-se cầm cây gậy của Đức Chúa Trời trong tay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Bấy giờ, Môi-se đưa
  rationale: Động từ לקח với waw liên tiếp đẩy câu chuyện tiến tới. Trong ngữ cảnh đưa gia đình lên đường, “đưa” tự nhiên hơn “lấy” trong tiếng Việt, còn “Bấy giờ” giữ mạch trình thuật.
- source_word: אִשְׁתּוֹ
  choice: vợ ... mình
  rationale: Diễn đạt tự nhiên cấu trúc danh từ với hậu tố sở hữu ngôi thứ ba số ít; không cần thêm tên Xíp-pô-ra vì nguyên văn không nêu tên tại đây.
- source_word: בָּנָיו
  choice: các con trai mình
  rationale: Giữ nghĩa giống đực số nhiều cụ thể của בנים, thay vì khái quát thành “các con”.
- source_word: וַיַּרְכִּבֵם
  choice: đưa ... lên lưng
  rationale: Dạng Hiphil của רכב có nghĩa khiến ai đó cưỡi hoặc ngồi lên. “Đưa ... lên lưng lừa” vừa thể hiện sắc thái sai khiến vừa tự nhiên trong tiếng Việt.
- source_word: הַחֲמֹר
  choice: lừa
  rationale: חמור chỉ con lừa. Tiếng Việt thường không cần biểu thị mạo từ xác định bằng một từ riêng; “lưng lừa” là cách nói tự nhiên.
- source_word: וַיָּשָׁב
  choice: trở về
  rationale: שוב trong ngữ cảnh này chỉ việc quay trở lại; “trở về” ngắn gọn và phù hợp văn phong kể chuyện.
- source_word: אַרְצָה מִצְרָיִם
  choice: về đất Ai Cập
  rationale: Giữ danh từ אֶרֶץ và hướng đích được biểu thị bằng hậu tố định hướng; “về đất Ai Cập” tự nhiên trong tiếng Việt.
- source_word: מַטֵּה הָאֱלֹהִים
  choice: cây gậy của Đức Chúa Trời
  rationale: מַטֶּה ở đây là cây gậy Môi-se mang theo để thực hiện các dấu lạ. “Cây gậy” là cách gọi hiện đại, rõ nghĩa; kết cấu sở hữu được giữ nguyên.
- source_word: בְּיָדוֹ
  choice: trong tay
  rationale: Giữ hình ảnh cụ thể của cụm giới từ; chủ thể Môi-se đã rõ nên không cần thêm “mình”.
theological_decisions:
- issue: Cách dịch הָאֱלֹהִים trong מַטֵּה הָאֱלֹהִים
  choice: Đức Chúa Trời
  alternative: gậy thần / cây gậy thiêng
  rationale: Trong văn cảnh, cây gậy gắn với sự ủy nhiệm và các dấu lạ do chính Đức Chúa Trời ban, nên danh xưng chỉ Đức Chúa Trời là nghĩa trực tiếp; cách dịch không biến cụm sở hữu thành một tính từ mơ hồ.
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Dùng “Môi-se” và “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt. Không đặt chú thích vì các phương án như “khiến họ cưỡi lừa” hay “cây trượng” không tạo ra khác biệt nội dung đáng kể cần ghi ở câu này.
