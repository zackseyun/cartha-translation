base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: vi
  text: Nếu họ không tin con và không lắng nghe tiếng nói của dấu lạ thứ nhất, thì họ sẽ tin tiếng nói của dấu lạ sau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dấu lạ cuối cùng.” Từ Hê-bơ-rơ có thể mang nghĩa “sau” hoặc “cuối cùng”; ở đây dịch “sau” để không hàm ý rằng sẽ không còn dấu lạ nào khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Nếu
  rationale: Công thức điều kiện Hê-bơ-rơ được diễn đạt tự nhiên trong tiếng Việt bằng “Nếu”; không cần dịch máy móc thành “Và sẽ xảy ra rằng”.
- source_word: יַאֲמִינוּ לָךְ
  choice: tin con
  rationale: Hiphil của אמן đi với ל mang nghĩa tin hoặc tín nhiệm một người; “tin con” tự nhiên và phù hợp lời Đức Chúa Trời phán với Môi-se.
- source_word: יִשְׁמְעוּ
  choice: lắng nghe
  rationale: שׁמע ở đây chỉ sự tiếp nhận và chú ý đến bằng chứng của dấu lạ; “lắng nghe” giữ được sắc thái hơn “nghe” và chưa diễn giải thành “vâng lời”.
- source_word: לְקוֹל
  choice: tiếng nói của
  rationale: 'Giữ hình ảnh nhân hóa của nguyên văn: dấu lạ có một “tiếng nói”, tức sức làm chứng, thay vì làm phẳng thành “ý nghĩa” hay “thông điệp”.'
- source_word: הָאֹת
  choice: dấu lạ
  rationale: אוֹת là dấu hiệu có giá trị xác chứng; trong ngữ cảnh phép lạ, “dấu lạ” là cách nói quen thuộc và rõ ràng trong tiếng Việt.
- source_word: הָרִאשׁוֹן
  choice: thứ nhất
  rationale: Diễn đạt trực tiếp thứ tự của רִאשׁוֹן và tạo đối chiếu rõ với dấu lạ sau.
- source_word: וְהֶאֱמִינוּ
  choice: thì họ sẽ tin
  rationale: “Thì” thể hiện tự nhiên mệnh đề kết quả của cấu trúc điều kiện trong tiếng Việt.
- source_word: הָאַחֲרוֹן
  choice: sau
  rationale: אַחֲרוֹן có thể là “sau” hoặc “cuối cùng”. “Sau” giữ quan hệ tương đối với dấu thứ nhất mà không hàm ý đây nhất thiết là dấu cuối cùng, vì câu kế tiếp còn nêu một dấu khác.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh Hê-bơ-rơ “tiếng nói của dấu lạ”, dù hơi khác lối nói thông thường, vì hình ảnh này diễn tả sức làm chứng của dấu lạ. Đại từ “con” phù hợp ngữ cảnh Đức Chúa Trời phán với Môi-se.
