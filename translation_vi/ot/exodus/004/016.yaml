  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý nghĩa chính: A-rôn sẽ nói thay Môi-se với dân, sẽ giữ vai trò “miệng” của Môi-se, còn Môi-se có vị thế như Đức Chúa Trời đối với A-rôn. Tuy nhiên, “sẽ làm miệng” không phản ánh sát cấu trúc vị ngữ “sẽ là ... một cái miệng” của tiếng Hê-bơ-rơ và không tự nhiên bằng cách giữ động từ “là”.'
