  text: וְ/דִבֶּר ה֥וּא לְ/ךָ֖ אֶל הָ/עָ֑ם וְ/הָ֤יָה הוּא֙ יִֽהְיֶה לְּ/ךָ֣ לְ/פֶ֔ה וְ/אַתָּ֖ה תִּֽהְיֶה לּ֥/וֹ לֵֽ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: vi
  text: Người ấy sẽ thay con nói với dân chúng; người ấy sẽ là miệng cho con,[a] còn con sẽ như Đức Chúa Trời đối với người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Là miệng cho con” là hình ảnh chỉ việc làm người phát ngôn cho Môi-se.
    reason: lexical_metaphor
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “con sẽ là Đức Chúa Trời cho người ấy.” Trong ngữ cảnh, Môi-se giữ vai trò do Đức Chúa Trời giao để truyền lời cho A-rôn.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: Người ấy sẽ thay con nói với dân chúng
  rationale: Động từ דִּבֵּר mang nghĩa “nói”; לְךָ trong ngữ cảnh chỉ việc A-rôn nói thay, hay đại diện cho Môi-se. Cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ đúng quan hệ đại diện.
- source_word: וְהָיָה הוּא יִהְיֶה לְךָ לְפֶה
  choice: người ấy sẽ làm miệng cho con
  rationale: Giữ nguyên hình ảnh “miệng” (פֶּה) của tiếng Hê-bơ-rơ thay vì thay bằng từ giải nghĩa “người phát ngôn.” Cụm động từ lặp וְהָיָה ... יִהְיֶה nhấn mạnh vai trò sẽ được thiết lập; tiếng Việt diễn đạt gọn bằng “sẽ làm.”
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: còn con sẽ như Đức Chúa Trời đối với người ấy
  rationale: לֵאלֹהִים mô tả vị thế tương quan của Môi-se đối với A-rôn. “Như Đức Chúa Trời” giữ sức nặng của ẩn dụ và cho thấy vai trò đại diện, truyền đạt lời Đức Chúa Trời, nhưng không khẳng định Môi-se có thần tính.
theological_decisions:
- issue: Cụm לֵאלֹהִים có nên được dịch theo nghĩa Môi-se thật sự là Đức Chúa Trời hay theo vai trò đại diện
  choice: như Đức Chúa Trời đối với người ấy
  alternative: là Đức Chúa Trời cho người ấy
  rationale: Ngữ cảnh câu trước cho thấy Môi-se truyền lời được Đức Chúa Trời ban cho A-rôn, rồi A-rôn nói ra. Vì vậy, cụm từ nói về thẩm quyền và chức năng đại diện. Tuy nhiên, chú thích vẫn bảo lưu cách dịch sát hơn, vốn không có từ so sánh được nêu rõ.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Người ấy” tránh lối nói cổ “người” hay “ngươi” khi chỉ A-rôn, còn “con” thể hiện lời Đức Chúa Trời nói trực tiếp với Môi-se theo lối xưng hô tự nhiên. Dấu chấm phẩy giữ mối song song giữa vai trò của A-rôn và Môi-se.
