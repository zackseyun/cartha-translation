source:
  edition: WLC
  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: vi
  text: Dân chúng tin. Khi nghe rằng Yahweh đã đoái đến[a] con cái Israel[b] và đã thấy cảnh khốn khổ của họ[c], họ cúi mình và thờ phượng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã thăm viếng” hoặc “đã lưu tâm đến”. Động từ Hê-bơ-rơ có thể bao hàm việc Yahweh lưu ý và can thiệp.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “các con trai của Israel”; cũng có thể dịch: “người Israel”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “nỗi khốn cùng” hoặc “cảnh đau khổ của họ”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: tin
  rationale: Dạng Hiphil của אמן ở đây diễn tả việc dân chúng tin sứ điệp và các dấu lạ do Môi-se và A-rôn truyền đạt; nguyên văn không nêu rõ túc từ, nên bản dịch cũng không thêm.
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: Khi nghe rằng
  rationale: Cách diễn đạt này chuyển tự nhiên mối liên hệ thời gian và nguyên nhân giữa điều dân chúng nghe với phản ứng cúi đầu thờ phượng.
- source_word: פָקַד
  choice: đoái đến
  rationale: Động từ có thể mang nghĩa thăm viếng, lưu tâm hoặc can thiệp. “Đoái đến” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt, vừa hàm ý sự quan tâm dẫn đến hành động mà không giải nghĩa quá mức.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm từ này giữ sắc thái cộng đồng thuộc về Israel, bao gồm toàn dân, đồng thời tự nhiên hơn cách dịch sát chữ “các con trai của Israel” trong tiếng Việt hiện đại.
- source_word: רָאָה אֶת־עָנְיָם
  choice: đã thấy cảnh khốn khổ của họ
  rationale: Giữ động từ cụ thể “thấy” và diễn đạt עֳנִי là tình cảnh khốn khổ, đau đớn do áp bức.
- source_word: וַיִּקְּדוּ
  choice: cúi đầu
  rationale: קדד chỉ động tác cúi thấp thân mình; “cúi đầu” rõ nghĩa và kết hợp tự nhiên với hành động thờ phượng tiếp theo.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: thờ phượng
  rationale: Trong ngữ cảnh hướng về Thiên Chúa và sau động từ chỉ việc cúi mình, từ này diễn tả ý nghĩa tôn kính, thờ phượng thay vì lặp lại động tác thể chất.
theological_decisions:
- issue: Cách chuyển danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; chuyển âm “Yahweh” phân biệt danh riêng này với tước hiệu “Chúa” và phù hợp lớp tham khảo POB.
- issue: Mức độ hàm ý trong פָקַד
  choice: đoái đến
  alternative: thăm viếng
  rationale: “Đoái đến” giữ được ý Thiên Chúa lưu tâm với hàm ý sắp can thiệp, nhưng không xác định quá mức bản chất của hành động vốn còn rộng nghĩa trong tiếng Hê-bơ-rơ.
- issue: Cách hiểu בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: các con trai của Israel
  rationale: Trong ngữ cảnh, thành ngữ gia tộc này chỉ toàn thể cộng đồng Israel chứ không nhằm loại trừ phụ nữ; “con dân Israel” bảo toàn quan hệ thuộc về Israel bằng tiếng Việt tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “dân chúng” làm chủ thể tập thể; giữ danh Yahweh. Các ghi chú bảo tồn phạm vi nghĩa của פקד, cụm gia tộc בני ישראל và עני mà không đưa cách giải thích hệ phái vào bản văn.
