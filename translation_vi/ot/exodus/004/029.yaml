  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: vi
  text: Rồi Môi-se và A-rôn đi tập hợp tất cả các trưởng lão của con dân Y-sơ-ra-ên[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dân Y-sơ-ra-ên”; sát chữ là “các con trai của Y-sơ-ra-ên”, theo cách nói truyền thống là “con cái Y-sơ-ra-ên”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: đi
  rationale: Động từ הלך ở dạng wayyiqtol tiếp nối mạch kể chuyện với nghĩa thông thường là “đi”. Dù động từ Hê-bơ-rơ ở số ít trước hai chủ ngữ phối hợp, tiếng Việt tự nhiên dùng “Môi-se và A-rôn đi”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: אַהֲרֹן
  choice: A-rôn
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: וַיַּאַסְפוּ
  choice: triệu tập
  rationale: אסף ở đây chỉ việc tập hợp người lại. “Triệu tập” tự nhiên khi đối tượng là toàn thể các trưởng lão và làm rõ đây là việc gọi các lãnh đạo cộng đồng đến họp.
- source_word: אֵת
  choice: '[không dịch riêng]'
  rationale: Dấu hiệu đánh dấu tân ngữ trực tiếp, không có từ tương đương độc lập trong tiếng Việt.
- source_word: כָּל
  choice: tất cả
  rationale: כָּל biểu thị toàn thể; “tất cả” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: זִקְנֵי
  choice: các trưởng lão
  rationale: זִקְנֵי vừa gắn với tuổi tác vừa chỉ những người lãnh đạo được thừa nhận trong cộng đồng. “Trưởng lão” giữ được chức năng xã hội của từ trong bối cảnh.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm này theo hình thức là “các con trai/con cái của Y-sơ-ra-ên”, nhưng thường chỉ dân tộc có nguồn gốc từ Y-sơ-ra-ên (Gia-cốp). “Con dân Y-sơ-ra-ên” vừa tự nhiên trong tiếng Việt, vừa giữ sắc thái huyết thống và căn tính cộng đồng; chú thích ghi các cách dịch sát hình thức hơn.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: con cái Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ mang căn tính cộng đồng bắt nguồn từ tổ phụ Y-sơ-ra-ên. “Con dân Y-sơ-ra-ên” không thu hẹp nhóm này vào nam giới, đồng thời không xóa hẳn sắc thái dòng dõi như cách dịch thuần túy bằng tên dân tộc.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Dùng “triệu tập” thay vì “gom lại” để phù hợp với việc tập hợp các trưởng lão là lãnh đạo cộng đồng. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
