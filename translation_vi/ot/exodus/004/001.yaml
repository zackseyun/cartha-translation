  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֤עַן מֹשֶׁה֙ וַ/יֹּ֔אמֶר וְ/הֵן֙ לֹֽא יַאֲמִ֣ינוּ לִ֔/י וְ/לֹ֥א יִשְׁמְע֖וּ בְּ/קֹלִ֑/י כִּ֣י יֹֽאמְר֔וּ לֹֽא נִרְאָ֥ה אֵלֶ֖י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: vi
  text: 'Bấy giờ Môi-se đáp: “Nhưng này, họ sẽ không tin con, cũng không nghe tiếng con[a], vì họ sẽ nói: ‘Yahweh[b] không hiện ra với ông.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “nghe tiếng con”; thành ngữ này cũng có thể có nghĩa là “nghe con”, “nghe lời con” hoặc “làm theo lời con”.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo lối dịch truyền thống, có thể dịch: “CHÚA”. “Yahweh” là cách phiên âm danh riêng יְהוָה của Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: Bấy giờ Môi-se đáp
  rationale: Cụm hai động từ nói năng trong lối kể chuyện Hê-bơ-rơ giới thiệu lời hồi đáp. Tiếng Việt tự nhiên chỉ cần “đáp”; “Bấy giờ” thể hiện sự tiếp nối của mạch kể mà không lặp nặng nề “đáp và nói”.
- source_word: וְהֵן
  choice: Nhưng kìa
  rationale: Giữ cả sắc thái phản bác theo ngữ cảnh lẫn tác dụng thu hút sự chú ý của tiểu từ הן, dù cách nói này trang trọng hơn khẩu ngữ hiện đại.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: họ sẽ không tin con
  rationale: Hiphil của אמן ở đây nói đến việc tin lời hoặc tin sự ủy nhiệm của Môi-se; “tin con” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: cũng không nghe tiếng con
  rationale: Giữ hình ảnh “nghe tiếng” của nguyên văn và không thu hẹp nghĩa thành “vâng lời”; chú thích nêu các sắc thái tự nhiên hơn trong tiếng Việt.
- source_word: כִּי יֹאמְרוּ
  choice: vì họ sẽ nói
  rationale: כִּי đưa ra lý do cho nỗi lo của Môi-se, còn dạng động từ tiếp theo hướng đến phản ứng mà ông dự liệu.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: không hiện ra với ông
  rationale: Niphal của ראה thường mang nghĩa “hiện ra”. Trong lời người Y-sơ-ra-ên nói với Môi-se, “ông” là đại từ tự nhiên và tôn trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu, nhờ đó giữ sự phân biệt có trong nguyên văn.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước gồm bốn phụ âm. “Yahweh” bảo tồn đây là danh riêng; chú thích ghi nhận cách thay bằng tước hiệu vốn quen thuộc trong truyền thống dịch Kinh Thánh.
- issue: Sắc thái của שׁמע בְּקוֹל
  choice: nghe tiếng con
  alternative: nghe lời con / vâng lời con
  rationale: Trong ngữ cảnh này, cụm từ có thể bao hàm nghe, lưu ý và làm theo. Bản chính giữ hình ảnh của nguyên văn để không quyết định quá mức rằng trọng tâm chỉ là sự vâng phục.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bấy giờ Môi-se đáp” tránh lặp máy móc hai động từ nói năng của tiếng Hê-bơ-rơ. “Nhưng kìa” hơi trang trọng nhưng giữ được tiểu từ thu hút sự chú ý trong lời phản bác. Đại từ “con” thể hiện Môi-se thưa với Đức Chúa Trời, còn “ông” phù hợp với lời người dân dự kiến nói với Môi-se.
