language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: vi
  text: A-rôn nói tất cả những lời Yahweh đã phán với Môi-se, rồi ông thực hiện các dấu lạ trước mắt dân chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước mặt dân chúng.”'
    reason: Thành ngữ לְעֵינֵי có thể được chuyển tự sát hình ảnh là “trước mắt” hoặc diễn đạt theo nghĩa là “trước mặt, trước sự chứng kiến của”.
lexical_decisions:
- source_word: וַיְדַבֵּר אַהֲרֹן
  choice: A-rôn nói lại
  rationale: דבר ở thể piel có nghĩa thông dụng là “nói”. “Nói lại” diễn đạt tự nhiên việc A-rôn truyền đạt cho dân chúng những lời đã được phán với Môi-se, mà không thêm ý giải thích.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: tất cả những lời
  rationale: Giữ hình ảnh cụ thể của דְּבָרִים là “những lời”, thay vì giản lược thành “mọi điều”.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: Yahweh đã phán với Môi-se
  rationale: “Đã phán” thể hiện hành động xảy ra trước lời thuật lại của A-rôn; “phán” phù hợp với lời nói của Đức Chúa Trời trong văn phong trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng chuyển tự của danh riêng YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: וַיַּעַשׂ
  choice: rồi ông thực hiện
  rationale: עשה có nghĩa rộng là “làm”; đi với “các dấu lạ”, “thực hiện” vừa tự nhiên vừa không thêm nội dung. Đại từ “ông” tiếp nối chủ ngữ ngữ pháp A-rôn.
- source_word: הָאֹתֹת
  choice: các dấu lạ
  rationale: אוֹת ở đây chỉ những dấu hiệu xác chứng trong văn cảnh. “Dấu lạ” là cách nói tự nhiên, có sắc thái phi thường nhưng không giải thích quá mức là “phép lạ”.
- source_word: לְעֵינֵי הָעָם
  choice: trước mắt dân chúng
  rationale: Giữ được hình ảnh cụ thể của thành ngữ Hê-bơ-rơ, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo toàn tính chất danh riêng, không thay bằng tước hiệu.
- issue: Chủ thể thực hiện các dấu lạ
  choice: A-rôn (được tiếp nối bằng “ông”)
  alternative: Môi-se
  rationale: Động từ וַיַּעַשׂ ở số ít tiếp nối chủ ngữ được nêu là A-rôn trong cùng câu. Dù văn cảnh rộng hơn liên hệ các dấu lạ với Môi-se, bản dịch không đổi chủ thể ngữ pháp một cách ngầm định.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được viết theo dạng quen thuộc trong tiếng Việt: A-rôn, Môi-se; danh Yahweh được giữ ở dạng chuyển tự. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.'
