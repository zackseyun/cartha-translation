  source_fidelity: 'Cần sửa “nói lại”, vì tiếp đầu ngữ “lại” thêm ý A-rôn lặp lại/truyền đạt lại mà động từ וַיְדַבֵּר (“nói, phán”) không tự nó biểu đạt. Các thành phần còn lại bám sát văn bản Hê-bơ-rơ: A-rôn là chủ ngữ của cả hai động từ, Yahweh đã phán với Môi-se, và các dấu lạ được thực hiện trước mắt dân chúng.'
