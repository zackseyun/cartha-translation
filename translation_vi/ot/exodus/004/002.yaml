base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/002.yaml
  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: vi
  text: 'Yahweh nói với ông: “Trong tay ngươi có gì vậy?” Ông nói: “Một cây gậy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một cây trượng” hoặc “một cái que”. Từ Hê-bơ-rơ מַטֶּה có thể chỉ gậy, trượng hoặc que tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ sự phân biệt giữa danh này với các tước hiệu.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: phán ... thưa
  rationale: Cả hai đều là động từ אמר, nhưng tiếng Việt tự nhiên phân biệt lời Đức Chúa Trời nói với lời Môi-se kính cẩn đáp lại; không làm thay đổi nội dung phát ngôn.
- source_word: אֵלָיו
  choice: với ông
  rationale: Diễn đạt tự nhiên giới từ kèm đại từ chỉ Môi-se trong tiếng Việt.
- source_word: מַה־זֶּה / מִזֶּה
  choice: có gì vậy
  rationale: Trong cấu trúc “trong tay ngươi”, cách hỏi này tự nhiên và vẫn yêu cầu nhận diện vật đang được cầm.
- source_word: בְּיָדֶךָ
  choice: trong tay ngươi
  rationale: Giữ nghĩa cụ thể của cụm Hê-bơ-rơ, chỉ vật Môi-se đang cầm.
- source_word: מַטֶּה
  choice: một cây gậy
  rationale: “Cây gậy” là cách gọi phổ thông, tự nhiên cho vật Môi-se mang; từ Hê-bơ-rơ cũng có thể chỉ roi hoặc trượng tùy ngữ cảnh.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Dùng cách phiên âm danh riêng thay vì thay bằng một tước hiệu, qua đó bảo toàn chức năng danh xưng trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” trong lời Yahweh nói với Môi-se và “thưa” cho lời đáp nhằm giữ sắc thái tôn kính, đồng thời tránh lối diễn đạt quá cổ.
