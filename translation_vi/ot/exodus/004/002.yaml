revisions:
- from: 'Yahweh phán với ông: “Trong tay ngươi có gì vậy?” Ông thưa: “Một cây gậy.”[a]'
  to: 'Yahweh nói với ông: “Trong tay ngươi có gì vậy?” Ông nói: “Một cây gậy.”[a]'
  rationale: Sửa động từ tường thuật thành “nói ... nói” để phản ánh nhất quán động từ אמר được lặp lại trong nguyên văn, không áp đặt cấp độ tôn kính vào hai động từ. Sửa chú thích để loại “roi”, thay bằng các lựa chọn từ vựng được nguồn và bản kiểm toán tiếng Anh hỗ trợ. Không thay đổi ý nghĩa câu.
