  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: vi
  text: 'Rồi ngươi hãy nói với Pha-ra-ôn: “Yahweh phán thế này: Y-sơ-ra-ên là con trai đầu lòng của Ta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo sát thứ tự và cấu trúc tiếng Hê-bơ-rơ hơn: “Y-sơ-ra-ên là con trai của Ta, con đầu lòng của Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָמַרְתָּ
  choice: Rồi ngươi hãy nói
  rationale: Động từ Qal hoàn thành ngôi 2 số ít giống đực, có liên từ đứng trước, mang lực chỉ thị trong lời truyền cho Môi-se. “Rồi” diễn đạt trình tự, còn “hãy nói” giữ sắc thái mệnh lệnh tự nhiên trong tiếng Việt.
- source_word: אֶל־פַּרְעֹה
  choice: với Pha-ra-ôn
  rationale: Giới từ אֶל chỉ đối tượng được nói trực tiếp; tiếng Việt tự nhiên dùng “nói với”. Tước hiệu/tên gọi Pharaoh được phiên âm theo quy ước tiếng Việt là “Pha-ra-ôn”.
- source_word: כֹּה אָמַר
  choice: phán thế này
  rationale: Công thức sứ giả được chuyển sang lối diễn đạt trang trọng nhưng tự nhiên. “Phán” phù hợp khi chủ thể là Đức Chúa Trời; “thế này” giới thiệu nguyên văn thông điệp.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước của Đức Chúa Trời bằng dạng phiên âm Yahweh, thay vì thay thế bằng một tước hiệu.
- source_word: בְּנִי
  choice: con trai của Ta
  rationale: Danh từ בֵּן với hậu tố ngôi thứ nhất số ít có nghĩa là “con trai của Ta”; giữ nguyên ẩn dụ phụ tử và giới tính được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: בְכֹרִי
  choice: đầu lòng của Ta
  rationale: Từ này chỉ địa vị con đầu lòng. Trong cụm tiếng Việt “con trai đầu lòng của Ta”, một lần “của Ta” áp dụng tự nhiên cho toàn cụm mà không làm mất ý sở hữu của nguyên văn.
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Giữ tên riêng theo dạng phiên âm quen thuộc trong tiếng Việt. Trong mệnh đề không có hệ từ của tiếng Hê-bơ-rơ, Y-sơ-ra-ên được đồng nhất với “con trai đầu lòng của Ta”.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp Danh Thánh bốn phụ âm. Giữ “Yahweh” bảo tồn tư cách danh riêng thay vì âm thầm đổi thành tước hiệu.
- issue: Ẩn dụ Y-sơ-ra-ên là con của Đức Chúa Trời
  choice: Y-sơ-ra-ên là con trai đầu lòng của Ta
  alternative: Y-sơ-ra-ên là con trai Ta, là con đầu lòng Ta
  rationale: Cách chọn đọc tự nhiên trong tiếng Việt và giữ cả ẩn dụ “con trai” lẫn địa vị “đầu lòng”. Cách thay thế bám sát hơn thứ tự và cấu trúc đồng vị của tiếng Hê-bơ-rơ, nhưng nguyên văn không buộc phải tách thành hai vế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ngươi” vì đây là lời Đức Chúa Trời truyền trực tiếp cho Môi-se trong bối cảnh cổ đại; “Ta” biểu thị lời tự xưng của Yahweh. Không thêm chú thích vì bản dịch chính đã truyền đạt đầy đủ; khác biệt về trật tự từ không tạo ra một nghĩa thay thế đáng kể trong tiếng Việt.
