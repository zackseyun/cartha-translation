base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: vi
  text: 'Sau đó, Môi-se trở về gặp Giê-tê[a], cha vợ mình, và thưa: “Xin cha cho con đi, để con trở về với anh em con[b] ở Ai Cập và xem họ còn sống hay không.” Giê-trô nói với Môi-se: “Hãy đi bình an.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong câu này, bản Hê-bơ-rơ gọi cùng một người trước là “Giê-tê” và sau là “Giê-trô.”
    reason: textual_variant
  - marker: b
    text: Cũng có thể hiểu là “bà con” hoặc “đồng bào”; tiếng Hê-bơ-rơ nói sát nghĩa là “anh em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: Sau đó, Môi-se đi về
  rationale: Hai động từ nối tiếp thúc đẩy mạch kể; “đi về” diễn đạt tự nhiên việc Môi-se trở lại nhà cha vợ mà không lặp ý nặng nề.
- source_word: יֶתֶר / יִתְרוֹ
  choice: Giê-tê / Giê-trô
  rationale: Bản Hê-bơ-rơ thực sự dùng hai dạng tên khác nhau trong cùng câu. Giữ cả hai trong chính văn bảo toàn chứng cứ nguồn thay vì âm thầm đồng nhất hóa; chú thích làm rõ chúng chỉ cùng một người.
- source_word: חֹתְנוֹ
  choice: cha vợ mình
  rationale: Trong ngữ cảnh, đây là cha của vợ Môi-se; “cha vợ” chính xác và tự nhiên hơn từ gọi quan hệ thông gia chung chung.
- source_word: אֵלֲכָה נָּא וְאָשׁוּבָה
  choice: Xin cha cho con trở về
  rationale: Thể ý nguyện cùng נָא biểu thị lời xin phép kính trọng. Cách xưng hô “cha–con” phù hợp quan hệ gia đình trong tiếng Việt hiện đại.
- source_word: אַחַי
  choice: anh em con
  rationale: Nghĩa sát là “các anh/em trai của tôi,” nhưng trong ngữ cảnh có thể chỉ rộng hơn đến đồng bào hay thân tộc; chính văn giữ cách nói cụ thể và chú thích nêu nghĩa rộng.
- source_word: וְאֶרְאֶה
  choice: để xem
  rationale: Diễn đạt sắc thái mục đích của hành động trở về bằng tiếng Việt tự nhiên.
- source_word: הַעוֹדָם חַיִּים
  choice: họ còn sống hay không
  rationale: Giữ nguyên tính chưa xác định của câu hỏi và ý “vẫn còn sống” trong cấu trúc Hê-bơ-rơ.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Con hãy đi bình an
  rationale: Thành ngữ chúc lành hoặc cho đi trong yên ổn; “đi bình an” là cách diễn đạt trang trọng, quen thuộc và chính xác.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng nhưng dễ hiểu. Dùng cách xưng hô cha–con để phản ánh quan hệ cha vợ–con rể và sắc thái xin phép kính trọng. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
