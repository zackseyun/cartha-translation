revisions:
- from: 'Sau đó, Môi-se đi về với Giê-tê[a], cha vợ mình, và thưa: “Xin cha cho con trở về với anh em con[b] ở Ai Cập để xem họ còn sống hay không.” Giê-trô nói với Môi-se: “Con hãy đi bình an.”'
  to: 'Sau đó, Môi-se trở về gặp Giê-tê[a], cha vợ mình, và thưa: “Xin cha cho con đi, để con trở về với anh em con[b] ở Ai Cập và xem họ còn sống hay không.” Giê-trô nói với Môi-se: “Hãy đi bình an.”'
  rationale: Bản sửa phục hồi đầy đủ chuỗi ý nguyện “đi ... trở về” của nguyên văn, đồng thời tránh thêm cách gọi không được nêu trong lời đáp. Các dạng tên khác nhau và hai chú thích vẫn được giữ, với các điểm neo hợp lệ trong chính văn.
