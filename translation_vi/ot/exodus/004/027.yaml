base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: vi
  text: 'Yahweh phán với A-rôn: “Hãy đi vào hoang mạc để gặp Môi-se.” Vậy ông đi và gặp Môi-se tại núi của Đức Chúa Trời, rồi hôn ông.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước bằng dạng chuyển tự quen dùng của dự án, thay vì thay thế bằng một tước hiệu.
- source_word: לֵךְ
  choice: Hãy đi
  rationale: Mệnh lệnh của động từ הלך được diễn đạt trực tiếp, tự nhiên trong tiếng Việt.
- source_word: לִקְרַאת מֹשֶׁה הַמִּדְבָּרָה
  choice: đi vào hoang mạc để gặp Môi-se
  rationale: Diễn đạt đích hướng được đánh dấu bởi hậu tố chỉ hướng trên הַמִּדְבָּרָה, đồng thời giữ לִקְרַאת như mục đích đi gặp Môi-se.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: gặp Môi-se
  rationale: פגשׁ trong mạch kể này mang nghĩa thông thường là gặp; nhắc lại tên giúp tiếng Việt rõ chủ thể và đối tượng.
- source_word: בְּהַר הָאֱלֹהִים
  choice: tại núi của Đức Chúa Trời
  rationale: Giữ quan hệ sở hữu của cụm danh từ Hê-bơ-rơ; “tại” diễn đạt địa điểm gặp gỡ mà không xác quyết cụ thể là ở trên đỉnh hay cạnh núi.
- source_word: וַיִּשַּׁק לוֹ
  choice: và hôn ông ấy
  rationale: Dịch trực tiếp hành động נשׁק, không thêm lời giải thích rằng đây là nụ hôn chào hỏi.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng tên riêng thay vì tước hiệu nhằm bảo toàn hình thức và chức năng của danh giao ước trong nguyên văn.
- issue: Cách dịch הָאֱלֹהִים trong cụm “núi của Đức Chúa Trời”
  choice: Đức Chúa Trời
  alternative: Thượng Đế; thần linh
  rationale: Trong văn cảnh Xuất Hành, danh từ có mạo từ chỉ Đức Chúa Trời của Ít-ra-ên; cách dịch này tự nhiên và không thêm diễn giải hệ phái.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu lệnh ngắn gọn. Dùng các dạng tên A-rôn và Môi-se quen thuộc trong tiếng Việt. Bản chính thể hiện hướng chuyển động “vào hoang mạc”; không thêm chú thích vì sắc thái này đã được biểu đạt trực tiếp.
