base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: vi
  text: Con hãy nói với anh ấy và đặt những lời vào miệng anh ấy; còn Ta sẽ ở cùng miệng con và miệng anh ấy, và Ta sẽ chỉ dạy các con điều các con sẽ làm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Các con» chỉ Môi-se và A-rôn; trong tiếng Hê-bơ-rơ, đại từ và động từ ở phần cuối câu đều ở số nhiều.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: Con hãy nói với anh ấy
  rationale: Trong ngữ cảnh chỉ thị, động từ mang sắc thái mệnh lệnh. “Nói với” diễn đạt tự nhiên cấu trúc דבר + אל; “con” phù hợp với lời Đức Chúa Trời trực tiếp phán cùng Môi-se.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: và đặt những lời ấy vào miệng anh ấy
  rationale: Giữ hình ảnh cụ thể của שׂים (“đặt”) và thành ngữ “vào miệng,” nghĩa là trao cho A-rôn lời phải nói. “Những lời ấy” thể hiện danh từ số nhiều có mạo từ và liên kết với nội dung trong ngữ cảnh.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: còn Ta sẽ ở cùng miệng con và miệng anh ấy
  rationale: Bảo tồn hình ảnh thân thể và lời hứa về sự hiện diện, trợ giúp trực tiếp của Đức Chúa Trời trong việc nói, thay vì diễn giải thành “giúp nói.” Đại từ “Ta” và “con” tạo giọng trực tiếp trang trọng, tự nhiên.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: rồi Ta sẽ chỉ dạy hai con
  rationale: Hiphil của ירה có nghĩa “dạy/chỉ dẫn.” “Chỉ dạy” tự nhiên trong tiếng Việt và giữ cả hai nét nghĩa. אֶתְכֶם là ngôi thứ hai số nhiều nên “hai con” làm rõ Môi-se và A-rôn cùng được nói đến.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: điều phải làm
  rationale: Cấu trúc quan hệ có nghĩa “điều mà.” Trong câu chỉ thị, “điều phải làm” là tiếng Việt tự nhiên; chủ thể số nhiều đã được biểu thị bằng “hai con” ở mệnh đề trước.
theological_decisions:
- issue: Cách diễn đạt nhân hình về sự trợ giúp của Đức Chúa Trời trong lời nói
  choice: Giữ “Ta sẽ ở cùng miệng con và miệng anh ấy” trong chính văn.
  alternative: Ta sẽ giúp con nói và cũng giúp anh ấy nói.
  rationale: Nguyên văn dùng hình ảnh cụ thể về “miệng” để nói đến sự hiện diện và ban năng lực của Đức Chúa Trời. Giữ hình ảnh này tránh làm phẳng sắc thái thần học bằng một lời giải thích.
- issue: Số nhiều của đại từ và động từ ở cuối câu
  choice: Dịch אֶתְכֶם là “hai con” để chỉ rõ Môi-se và A-rôn.
  alternative: các con / hai người
  rationale: Tiếng Hê-bơ-rơ chuyển rõ sang số nhiều, nói với Môi-se và A-rôn cùng nhau. “Hai con” vừa minh thị số nhiều vừa phù hợp quan hệ xưng hô trong lời Đức Chúa Trời phán trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ Hê-bơ-rơ “đặt những lời ấy vào miệng” và hình ảnh “ở cùng miệng” vì chúng rõ trong ngữ cảnh và mang ý nghĩa quan trọng. Dùng “anh ấy” cho A-rôn theo quan hệ anh em được xác lập trong ngữ cảnh; dùng “Ta–con” cho lời Đức Chúa Trời phán với Môi-se. Dấu chú thích [a] xuất hiện trong chính văn.
