  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: vi
  text: Hãy cầm cây gậy này trong tay con; con sẽ dùng nó để thực hiện các dấu ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Nguyên văn là “các dấu ấy.” Cũng có thể dịch là “các dấu hiệu” hoặc, theo ngữ cảnh, “các dấu lạ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Hãy
  rationale: Liên từ nối mệnh lệnh này với lời chỉ dẫn trước đó; dấu chỉ tân ngữ không được dịch riêng. Trong tiếng Việt, mở đầu bằng “Hãy” diễn đạt tự nhiên lực mệnh lệnh của cả cụm.
- source_word: הַמַּטֶּה
  choice: cây gậy
  rationale: מַטֶּה có thể chỉ gậy chống hoặc roi/gậy; “cây gậy” tự nhiên và phù hợp với bối cảnh Môi-se là người chăn chiên.
- source_word: הַזֶּה
  choice: này
  rationale: Từ chỉ định xác định chính cây gậy đã được nhắc đến.
- source_word: תִּקַּח
  choice: cầm
  rationale: Động từ Qal chưa hoàn thành ngôi hai số ít mang lực mệnh lệnh. Kết hợp với “trong tay”, “cầm” tự nhiên hơn “lấy” trong tiếng Việt.
- source_word: בְּיָדֶךָ
  choice: trong tay
  rationale: Phản ánh trực tiếp cụm giới từ Hê-bơ-rơ và giữ hình ảnh cụ thể của nguyên văn.
- source_word: אֲשֶׁר ... בּוֹ
  choice: dùng nó để
  rationale: Mệnh đề quan hệ cùng בּוֹ diễn tả cây gậy là phương tiện. “Dùng nó để” là cách nói tự nhiên trong tiếng Việt mà vẫn giữ quan hệ công cụ.
- source_word: תַּעֲשֶׂה
  choice: thực hiện
  rationale: עָשָׂה có nghĩa rộng là làm; đi với “các dấu”, “thực hiện” diễn đạt rõ việc làm ra hoặc thi hành các dấu ấy mà không thêm ý ngoài văn bản.
- source_word: הָאֹתֹת
  choice: các dấu lạ
  rationale: אוֹת là dấu hiệu mang ý nghĩa xác chứng và trong ngữ cảnh này là những việc phi thường đã được nêu trước. “Dấu lạ” là cách diễn đạt tự nhiên, quen thuộc trong tiếng Việt; chú thích ghi nhận phương án sát hình thức hơn là “các dấu hiệu”.
theological_decisions:
- issue: Có nên nói rõ các dấu là phép lạ hay không
  choice: các dấu lạ
  alternative: các dấu hiệu
  rationale: Nguyên văn chỉ nói “các dấu” và ngữ cảnh cho thấy tính chất phi thường. “Dấu lạ” truyền đạt tự nhiên ý nghĩa theo ngữ cảnh nhưng không dùng từ “phép lạ”, vốn giải thích mạnh hơn; chú thích bảo tồn phương án hình thức và độ mở của danh từ Hê-bơ-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “con” phù hợp lời Đức Chúa Trời trực tiếp phán với Môi-se trong mạch văn. Câu được tái cấu trúc thành hai vế để tiếng Việt tự nhiên, đồng thời giữ cây gậy là công cụ thực hiện các dấu.
