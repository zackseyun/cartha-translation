  source_fidelity: Bản nháp phản ánh đúng mệnh lệnh cầm gậy và gậy là phương tiện để thực hiện các dấu. Tuy nhiên, “các dấu lạ” cụ thể hóa tính chất kỳ diệu mà tiếng Hê-bơ-rơ chỉ nói là “các dấu” (הָאֹתֹת). Dù ngữ cảnh cho thấy các dấu này là phi thường, bản văn chính nên giữ độ mở của nguyên ngữ.
  naturalness: “Hãy cầm cây gậy này trong tay con; con sẽ dùng nó để thực hiện các dấu ấy” là tiếng Việt hiện đại, rõ ràng, và giữ được đại từ thân thuộc phù hợp với lời phán trực tiếp với Môi-se. Dấu chấm phẩy diễn đạt tự nhiên mệnh đề quan hệ có sắc thái công cụ trong tiếng Hê-bơ-rơ.
  terminology: Giữ “cây gậy” cho מַטֶּה là phù hợp bối cảnh. Đổi “các dấu lạ” thành “các dấu ấy” để bảo toàn thuật ngữ trung tính của אוֹת, đồng thời phản ánh mạo từ xác định và sự quy chiếu đến các dấu vừa được nói đến.
