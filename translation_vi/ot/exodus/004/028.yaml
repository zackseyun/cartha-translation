id: EXO.4.28
reference: Exodus 4:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד מֹשֶׁה֙ לְ/אַֽהֲרֹ֔ן אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֣ר שְׁלָח֑/וֹ וְ/אֵ֥ת כָּל הָ/אֹתֹ֖ת אֲשֶׁ֥ר צִוָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: vi
  text: Môi-se thuật lại cho A-rôn mọi lời của Yahweh, Đấng đã sai ông[a], cùng mọi dấu lạ mà Ngài đã truyền cho ông thực hiện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi lời Yahweh đã giao cho ông khi sai ông đi.” Mệnh đề quan hệ trong tiếng Hê-bơ-rơ có thể được hiểu là gắn chặt với “mọi lời,” dù ý chung vẫn là Yahweh đã sai Môi-se.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: thuật lại
  rationale: Dạng Hiphil của נגד ở đây có nghĩa là làm cho biết, kể hoặc báo lại; “thuật lại” tự nhiên trong văn kể chuyện và diễn tả việc Môi-se truyền đạt đầy đủ cho A-rôn.
- source_word: דִּבְרֵי יְהוָה
  choice: mọi lời của Yahweh
  rationale: Giữ danh từ số nhiều דְּבָרִים là “lời” thay vì khái quát thành “sứ điệp,” qua đó bảo tồn sắc thái Môi-se thuật lại những điều Yahweh đã phán.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, không thay bằng một tước hiệu.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: Đấng đã sai ông
  rationale: Cách đọc chính nối mệnh đề quan hệ với Yahweh; dùng “Đấng” giúp câu tiếng Việt rõ ràng, trang trọng, trong khi chú thích bảo tồn khả năng mệnh đề gắn với “mọi lời.”
- source_word: הָאֹתֹת
  choice: mọi dấu lạ
  rationale: אוֹת là “dấu” hoặc “dấu hiệu”; trong ngữ cảnh Xuất Hành, “dấu lạ” tự nhiên và thể hiện tính phi thường mà không thêm từ “phép lạ.”
- source_word: אֲשֶׁר צִוָּהוּ
  choice: mà Ngài đã truyền cho ông thực hiện
  rationale: Tiếng Hê-bơ-rơ nói sát là “mà Ngài đã truyền cho ông”; thêm “thực hiện” làm rõ hành động được hàm ý đối với các dấu lạ và tạo câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước יהוה; giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Sở chỉ của mệnh đề אֲשֶׁר שְׁלָחוֹ
  choice: 'Mệnh đề bổ nghĩa cho Yahweh: “Đấng đã sai ông”'
  alternative: 'Mệnh đề gắn với “mọi lời”: “mọi lời Yahweh giao cho ông khi sai ông đi”'
  rationale: Cả hai cách phân tích đều có thể có về mặt cú pháp. Bản chính chọn cách quy chiếu về Yahweh, còn chú thích ghi nhận cách đọc kia để không xóa bỏ sự mơ hồ thật của nguyên văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng nhưng dễ hiểu. Dùng các tên quen thuộc “Môi-se,” “A-rôn”; đại từ “ông” chỉ Môi-se và “Ngài” chỉ Yahweh để làm rõ chủ thể. Dấu chú thích [a] xuất hiện ngay sau mệnh đề liên quan.
