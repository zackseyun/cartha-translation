source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Hãy đưa tay ra và nắm lấy đuôi nó[a].” Ông liền đưa tay ra, nắm chặt lấy nó, và nó biến thành một cây gậy[b] trong tay ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nắm lấy nó ở đuôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một cây trượng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời bằng dạng chuyển tự “Yahweh”; thêm “Đức” theo cách xưng danh trang trọng, tự nhiên trong tiếng Việt, không thay danh ấy bằng một tước hiệu.
- source_word: שְׁלַח יָדְךָ
  choice: Hãy đưa tay ra
  rationale: Diễn đạt tự nhiên động tác được truyền khiến; sát nghĩa “đưa/vươn tay ra” mà không quá câu nệ hình thức.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: và nắm lấy đuôi nó
  rationale: אָחַז chỉ hành động nắm, giữ lấy; בִּזְנָבוֹ có thể được diễn đạt tự nhiên là “đuôi nó,” trong khi sắc thái “nắm nó ở đuôi” được ghi ở chú thích.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: Ông liền đưa tay ra
  rationale: Lặp lại động từ của mệnh lệnh để giữ sự tương ứng trong lời kể; “liền” truyền đạt diễn tiến liên tiếp của dạng wayyiqtol.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: nắm chặt lấy nó
  rationale: חזק trong cấu trúc này diễn tả việc giữ chắc; “nắm chặt lấy” phân biệt hợp lý với אָחַז ở mệnh lệnh mà không cường điệu thành “chộp” hay “tóm.”
- source_word: וַיְהִי לְמַטֶּה
  choice: nó biến thành một cây gậy
  rationale: Trong ngữ cảnh biến đổi, היה לְ được chuyển là “biến thành”; מַטֶּה ở đây phù hợp nhất với “cây gậy,” đồng thời “cây trượng” vẫn là khả năng từ vựng.
- source_word: בְּכַפּוֹ
  choice: trong tay ông
  rationale: כַּף theo nghĩa đen có thể là lòng bàn tay, nhưng thành ngữ tiếng Việt “trong tay” tự nhiên và truyền đạt đúng vị trí của cây gậy.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Đức Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh. Chuyển tự “Yahweh” bảo tồn tính chất danh riêng và không thay thế bằng tước hiệu; “Đức” chỉ là yếu tố kính ngữ tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời của Đức Chúa Trời; đại từ “ông” chỉ Môi-se. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
