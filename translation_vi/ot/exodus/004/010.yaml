source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל יְהוָה֮ בִּ֣י אֲדֹנָ/י֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִ/תְּמוֹל֙ גַּ֣ם מִ/שִּׁלְשֹׁ֔ם גַּ֛ם מֵ/אָ֥ז דַּבֶּרְ/ךָ אֶל עַבְדֶּ֑/ךָ כִּ֧י כְבַד פֶּ֛ה וּ/כְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: vi
  text: 'Môi-se thưa với Yahweh[a]: “Lạy Chúa, con không phải là người giỏi ăn nói, chẳng phải từ hôm qua hay hôm kia, cũng chẳng phải từ khi Ngài phán với tôi tớ Ngài; vì miệng con nặng nề và lưỡi con nặng nề.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là danh riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ; trong cùng câu, “Chúa” dịch tước hiệu.
    reason: Giải thích việc danh riêng Yahweh và tước hiệu “Chúa” xuất hiện cạnh nhau.
  - marker: b
    text: 'Nguyên văn: “nặng miệng và nặng lưỡi,” một hình ảnh chỉ sự khó khăn khi nói; câu này không cho biết rõ đó là thiếu tài ăn nói hay một trở ngại về lời nói.'
    reason: Giải thích ẩn dụ và bảo toàn sự mơ hồ của nguyên văn, không xác định bản chất khó khăn của Môi-se.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, phân biệt với tước hiệu אֲדֹנָי được dịch là “Chúa” ngay sau đó.
- source_word: בִּי אֲדֹנָי
  choice: Lạy Chúa
  rationale: בִּי là lời mở đầu khẩn khoản, kính cẩn; “Lạy Chúa” tự nhiên trong tiếng Việt và giữ sắc thái thưa trình.
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: con vốn không phải là người giỏi ăn nói
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “không phải người của lời nói,” chỉ khả năng diễn đạt bằng lời mà không xác định một chứng tật cụ thể.
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: trước đây đã không
  rationale: Cặp từ theo nghĩa đen “hôm qua, hôm kia” là thành ngữ chỉ thời gian trước đó; “trước đây” truyền đạt đúng ý trong tiếng Việt hiện đại.
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: mà ngay cả từ khi Ngài phán với tôi tớ Ngài cũng vẫn không
  rationale: Giữ sự nhấn mạnh lặp lại của גַּם và mốc thời gian מֵאָז, đồng thời thể hiện cách Môi-se khiêm nhường tự xưng là tôi tớ.
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: miệng con nặng nề, lưỡi con cũng nặng nề
  rationale: Giữ nguyên hình ảnh song song “nặng miệng, nặng lưỡi,” không quyết đoán đó là thiếu tài hùng biện hay một trở ngại phát âm.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה; “Yahweh” bảo toàn danh ấy và giúp phân biệt với אֲדֹנָי, tước hiệu “Chúa,” trong cùng câu.
- issue: Bản chất khó khăn trong lời nói của Môi-se
  choice: Giữ ẩn dụ “miệng nặng nề, lưỡi nặng nề”
  alternative: Diễn giải là “nói năng chậm chạp,” “không có tài hùng biện,” hoặc xác định là tật nói
  rationale: Nguyên văn không xác định rõ đây là thiếu khả năng diễn đạt, thiếu tự tin hay một trở ngại thể chất; giữ ẩn dụ bảo toàn sự mơ hồ chính đáng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” trong lời Môi-se thưa với Đức Chúa Trời tạo sắc thái kính cẩn tự nhiên; “Ngài” dùng cho Đức Chúa Trời. Câu chính diễn đạt thành ngữ “người của lời nói” theo tiếng Việt tự nhiên, còn hình ảnh then chốt “nặng miệng, nặng lưỡi” được giữ lại.
