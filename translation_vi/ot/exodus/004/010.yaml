  to: 'Môi-se thưa với Yahweh[a]: “Lạy Chúa, con không phải là người giỏi ăn nói, chẳng phải từ hôm qua hay hôm kia, cũng chẳng phải từ khi Ngài phán với tôi tớ Ngài; vì miệng con nặng nề và lưỡi con nặng nề.”[b]'
