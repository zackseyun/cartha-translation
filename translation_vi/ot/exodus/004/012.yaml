base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/012.yaml
  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: vi
  text: Bây giờ, hãy đi. Chính Ta sẽ ở cùng miệng con[a] và dạy con điều con sẽ nói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn ý: “ở cùng con khi con nói.” Nguyên văn là “ở cùng miệng con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Giữ chức năng chuyển tiếp và tính cấp thời của lời phán, không thêm quan hệ suy luận mạnh hơn nguyên văn.
- source_word: לֵךְ
  choice: hãy đi
  rationale: Mệnh lệnh trực tiếp, tự nhiên trong tiếng Việt hiện đại và không diễn giải thêm.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: Chính Ta sẽ ở
  rationale: “Chính Ta” thể hiện sự nhấn mạnh của đại từ độc lập אָנֹכִי; “sẽ ở” giữ giá trị vị lai của אֶהְיֶה.
- source_word: עִם־פִּיךָ
  choice: ở cùng miệng con
  rationale: Giữ hình ảnh cụ thể và khác thường của tiếng Hê-bơ-rơ, tập trung vào chính cơ quan phát ngôn của Môi-se, thay vì giản lược thành “giúp con nói”.
- source_word: וְהוֹרֵיתִיךָ
  choice: và dạy con
  rationale: Thể Hiphil của ירה ở đây mang nghĩa chỉ dạy/hướng dẫn; “dạy” rõ ràng và phù hợp với mệnh đề nội dung theo sau.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: điều con phải nói
  rationale: Diễn đạt tự nhiên nội dung mà Đức Chúa Trời sẽ chỉ dạy, đồng thời giữ sắc thái việc Môi-se được giao phải nói; “nói” là cách chuyển ngữ thông dụng của דבר trong ngữ cảnh này.
theological_decisions:
- issue: Công thức về sự hiện diện của Đức Chúa Trời trong lời sai phái
  choice: Chính Ta sẽ ở cùng miệng con
  alternative: Ta sẽ giúp con nói
  rationale: Giữ nguyên hình ảnh cụ thể về sự hiện diện và trang bị của chính Đức Chúa Trời, thay vì giải thích hình ảnh ấy chỉ như sự trợ giúp về khả năng nói.
- issue: Sắc thái của אֲשֶׁר תְּדַבֵּר
  choice: điều con phải nói
  alternative: điều con sẽ nói
  rationale: “Phải nói” thể hiện lời nói được Đức Chúa Trời giao và chỉ dạy, nhưng không mở rộng thành một khẳng định giáo lý về cách thức linh hứng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “Ta/con” phù hợp với lời Đức Chúa Trời phán cùng Môi-se. Dấu chấm sau mệnh lệnh giúp câu tiếng Việt sáng rõ mà không thay đổi quan hệ ý nghĩa của hai vế.
