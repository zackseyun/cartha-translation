revisions:
- from: 'Rồi Đức Yahweh lại phán với ông: “Hãy đưa tay vào ngực áo.” Ông đưa tay vào ngực áo; khi rút tay ra, kìa, tay ông mắc bệnh phong[a], trắng như tuyết.'
  to: 'Rồi Đức Yahweh lại phán với ông: “Hãy đưa tay vào ngực áo.” Ông đưa tay vào ngực áo; khi rút tay ra, này, tay ông mắc bệnh phong[a], như tuyết.'
  rationale: Chỉ điều chỉnh “trắng như tuyết” thành “như tuyết” để không bổ sung một đặc điểm không được phát biểu trực tiếp trong tiếng Hê-bơ-rơ. Đổi “kìa” thành “này” là một lựa chọn văn phong hiện đại, vẫn truyền đạt chức năng trình bày bất ngờ của וְהִנֵּה. Chú thích được chuẩn hóa nhẹ về cách phiên âm mà không thay đổi nội dung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:38:04Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng trình tự hành động, sắc thái “lại”, hình ảnh đặt tay vào phần áo trước ngực, và tình trạng צָרַעַת. Tuy nhiên, “trắng như tuyết” thêm rõ nét tính từ “trắng” mà tiếng Hê-bơ-rơ chỉ nói “như tuyết”; nên giữ phép so sánh không mở rộng để tương ứng sát hơn với nguyên văn và bản tiếng Anh.
  naturalness: Câu văn trang trọng, hiện đại và rõ nghĩa. “Đưa tay vào ngực áo” và “rút tay ra” tự nhiên. Có thể dùng “Này” thay cho “kìa” để giữ lực chỉ trỏ của הִנֵּה trong một văn phong hiện đại hơn, nhưng “kìa” không sai.
  terminology: “Đức Yahweh” nhất quán với quyết định giữ danh riêng. “Bệnh phong” có thể chấp nhận khi chú thích đã giới hạn việc đồng nhất với bệnh Hansen. Giữ nguyên dạng Hê-bơ-rơ trong chú thích là phù hợp, nhưng nên phiên âm nhất quán và tự nhiên hơn là “tsa-ra-át”.
  issues:
