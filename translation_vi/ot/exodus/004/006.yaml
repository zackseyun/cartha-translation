id: EXO.4.6
reference: Exodus 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: vi
  text: 'Rồi Đức Yahweh lại phán với ông: “Hãy đưa tay vào ngực áo.” Ông đưa tay vào ngực áo; khi rút tay ra, này, tay ông mắc bệnh phong[a], như tuyết.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng từ chỉ tình trạng צָרַעַת (tsa-ra-at) trong Cựu Ước; tình trạng này có thể không hoàn toàn tương ứng với bệnh phong hiện đại (bệnh Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Yahweh
  rationale: Giữ tên riêng giao ước Yahweh theo trực tiếp danh יְהוָה; thêm kính ngữ “Đức” để câu văn tiếng Việt tự nhiên và trang trọng mà không thay tên riêng bằng một tước hiệu.
- source_word: עוֹד
  choice: lại
  rationale: Trong chuỗi các dấu lạ, từ này biểu thị một hành động hay lời phán được thêm vào và lặp tiếp; “lại” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: הָבֵא נָא
  choice: Hãy đưa
  rationale: הָבֵא có nghĩa cơ bản là “đưa/mang vào”; נָא làm nhẹ hoặc thúc giục mệnh lệnh. Cấu trúc “Hãy đưa” truyền đạt mệnh lệnh trang trọng, tự nhiên; không dịch máy móc נָא thành “xin” vì trong ngữ cảnh Đức Chúa Trời truyền lệnh, “xin” dễ gây sai sắc thái trong tiếng Việt.
- source_word: חֵיק
  choice: ngực áo
  rationale: Chỉ phần trước hoặc nếp áo ở ngực, nơi có thể luồn hay giấu tay vào. “Ngực áo” cụ thể và dễ hiểu hơn “lòng/ngực” trong ngữ cảnh này.
- source_word: וַיּוֹצִאָהּ
  choice: khi rút tay ra
  rationale: Diễn đạt rõ hậu tố giống cái chỉ về “tay”; “rút tay ra” là cách nói tiếng Việt tự nhiên cho động tác lấy bàn tay khỏi ngực áo.
- source_word: וְהִנֵּה
  choice: kìa
  rationale: Giữ sức gợi chỉ và yếu tố bất ngờ của הִנֵּה trong lúc dấu lạ hiện ra.
- source_word: מְצֹרַעַת
  choice: mắc bệnh phong
  rationale: Giữ thuật ngữ Kinh Thánh quen thuộc nhưng kèm chú thích để tránh đồng nhất chắc chắn צָרַעַת với bệnh Hansen hiện đại.
- source_word: כַּשָּׁלֶג
  choice: trắng như tuyết
  rationale: Nguyên văn là “như tuyết”; trong tiếng Việt, “trắng như tuyết” làm rõ phương diện so sánh vốn được ngữ cảnh bệnh trạng hàm ý và tạo câu tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Bản dịch bảo lưu Yahweh thay vì thay bằng tước hiệu “CHÚA”; kính ngữ “Đức” phù hợp văn phong tiếng Việt nhưng không xóa tên riêng.
- issue: Nhận diện bệnh trạng צָרַעַת
  choice: bệnh phong, có chú thích giới hạn nghĩa
  alternative: bệnh Hansen; bệnh ngoài da
  rationale: Không quyết đoán rằng thuật ngữ nghi lễ và bệnh lý trong Cựu Ước hoàn toàn tương ứng với bệnh Hansen hiện đại, cũng không thu hẹp nó thành một chứng bệnh ngoài da cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “ông” để chỉ Môi-se theo mạch văn, “ngực áo” để làm rõ hình ảnh văn hóa, và giữ “kìa” nhằm bảo toàn sắc thái đột ngột của dấu lạ.
