    rationale: Hạt từ הִנֵּה kết hợp với phân từ הֹרֵג nhấn mạnh một hành động sắp xảy ra hoặc đang ở ngay trước mắt. “Này, Ta sắp giết” giữ được cả sự nhấn mạnh lẫn tính cận kề, tương ứng với English POB “I am about to kill.”
