  source_fidelity: Bản dịch truyền đạt đúng cấu trúc đối xứng giữa “con trai Ta” (Israel, số ít tập thể) và “con trai ngươi, con đầu lòng của ngươi”, cũng như mệnh lệnh thả đi và mục đích phụng sự. Tuy nhiên, הִנֵּה אָנֹכִי הֹרֵג là cấu trúc nhấn mạnh với phân từ, diễn tả hành động cận kề/chắc chắn xảy đến; “Ta sẽ giết” làm yếu sắc thái cận kề này.
