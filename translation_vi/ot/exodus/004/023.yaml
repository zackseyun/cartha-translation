  terminology: “Thả ... ra” phù hợp ngữ cảnh Pha-ra-ôn đang giữ dân Israel. “Phụng sự” bảo toàn phạm vi nghĩa của עבד mà không thu hẹp thành chỉ một nghi thức thờ phượng. Lối xưng “Ta/ngươi” nhất quán với lời phán trang trọng.
