base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: vi
  text: 'Ta đã phán với ngươi: ‘Hãy thả con trai Ta ra để nó phụng sự Ta,’ nhưng ngươi đã từ chối thả nó ra. Này, Ta sắp giết con trai ngươi, tức con đầu lòng của ngươi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: hãy thả ... ra
  rationale: Động từ ở thể mệnh lệnh mang nghĩa sai đi hoặc cho đi; trong ngữ cảnh Pha-ra-ôn đang giữ Israel, “thả ... ra” truyền đạt tự nhiên yêu cầu cho phép ra đi.
- source_word: וְיַעַבְדֵנִי
  choice: để nó phụng sự Ta
  rationale: עבד có thể chỉ phục vụ hoặc thờ phượng. “Phụng sự” giữ được cả ý phục vụ Đức Chúa Trời lẫn sắc thái tôn giáo mà không thu hẹp vào một nghi thức cụ thể.
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng gây chú ý và nhấn mạnh lời tuyên án; cách nói ngắn gọn, trang trọng trong tiếng Việt.
- source_word: הֹרֵג
  choice: sẽ giết
  rationale: Phân từ trong cấu trúc הִנֵּה אָנֹכִי diễn tả hành động sắp hoặc chắc chắn xảy ra; tương lai “sẽ giết” tự nhiên và không thêm sắc thái ngoài văn bản.
- source_word: בְּכֹרֶךָ
  choice: con đầu lòng của ngươi
  rationale: Diễn đạt rõ danh từ “con đầu lòng” trong quan hệ đồng vị với “con trai ngươi”.
theological_decisions:
- issue: Đại từ “con trai Ta” chỉ Israel trong ngữ cảnh gần
  choice: Giữ nguyên cách xưng “con trai Ta” và đại từ số ít “nó”
  alternative: Diễn giải thành “dân Israel, con Ta” hoặc dùng đại từ số nhiều
  rationale: Bản Hê-bơ-rơ dùng danh từ và đại từ số ít; giữ hình ảnh quan hệ cha-con và sự đối xứng với “con trai ngươi, tức con đầu lòng của ngươi” mà không diễn giải ngay trong câu.
- issue: Sắc thái của עבד
  choice: phụng sự
  alternative: thờ phượng hoặc phục vụ
  rationale: “Phụng sự” bảo toàn sự giao thoa giữa việc phục vụ và việc thờ phượng Đức Chúa Trời, tránh giải quyết quá mức phạm vi nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “Ta/ngươi” để phản ánh lời Đức Chúa Trời phán với Pha-ra-ôn và giữ thế đối đầu của câu. Lặp lại “thả ... ra” nhằm bảo toàn sự lặp từ của nguyên bản; dùng “tức” để thể hiện quan hệ đồng vị giữa “con trai ngươi” và “con đầu lòng của ngươi”.
