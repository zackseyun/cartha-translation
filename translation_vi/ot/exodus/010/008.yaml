  text: וַ/יּוּשַׁ֞ב אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם לְכ֥וּ עִבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם מִ֥י וָ/מִ֖י הַ/הֹלְכִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: vi
  text: 'Vậy, Môi-se và A-rôn được đưa trở lại gặp Pha-ra-ôn. Ông nói với họ: “Hãy đi phụng sự Yahweh, Đức Chúa Trời của các ngươi. Những ai sẽ đi?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hê-bơ-rơ: “Ai và ai là những người đi?”—một cách hỏi nhằm yêu cầu xác định cụ thể những người sẽ được phép đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: được đưa trở lại
  rationale: 'Dạng Hofal của שׁוב mang nghĩa bị động–khiến khiến: Môi-se và A-rôn được người khác đưa trở lại. Cách dịch này tự nhiên và giữ sắc thái bị động.'
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Môi-se và A-rôn
  rationale: Tiểu từ đánh dấu tân ngữ אֶת không cần biểu hiện riêng trong tiếng Việt; các tên riêng dùng dạng phiên âm quen thuộc.
- source_word: אֶל פַּרְעֹה
  choice: gặp Pha-ra-ôn
  rationale: אֶל chỉ hướng chuyển động về phía một người. Trong tiếng Việt, “đưa trở lại gặp Pha-ra-ôn” tự nhiên hơn “đưa trở lại đến Pha-ra-ôn” mà vẫn giữ đúng quan hệ hướng đích.
- source_word: לְכוּ
  choice: Hãy đi
  rationale: Mệnh lệnh số nhiều của הלך; “Hãy đi” diễn đạt trực tiếp mệnh lệnh của Pha-ra-ôn.
- source_word: עִבְדוּ
  choice: phụng sự
  rationale: עבד ở đây là phục vụ Đức Chúa Trời, có thể bao hàm thờ phượng nhưng không chỉ giới hạn ở nghi lễ. “Phụng sự” giữ được phạm vi nghĩa ấy và phù hợp văn phong trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời theo bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: Danh từ ở thể liên kết với hậu tố ngôi hai số nhiều; cách dịch thể hiện rõ quan hệ sở hữu và lời Pha-ra-ôn nói với Môi-se cùng A-rôn.
- source_word: מִי וָמִי
  choice: Những ai
  rationale: Cụm lặp theo nghĩa đen “ai và ai” đòi xác định cụ thể những người sẽ đi. “Những ai” là cách hỏi tự nhiên trong tiếng Việt; dạng sát chữ được ghi ở chú thích.
- source_word: הַהֹלְכִים
  choice: sẽ đi
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ những người đi. Trong ngữ cảnh cuộc đi sắp xảy ra, “sẽ đi” diễn đạt tự nhiên mà không biến câu hỏi thành câu hỏi về việc có đi hay không.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng, không thay bằng tước hiệu.
- issue: Phạm vi nghĩa của עבד
  choice: phụng sự
  alternative: thờ phượng
  rationale: “Thờ phượng” có thể thu hẹp עבד vào hoạt động tôn giáo nghi lễ; “phụng sự” giữ được nghĩa rộng hơn là phục vụ Đức Chúa Trời, đồng thời vẫn bao hàm việc thờ phượng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ngươi” trong lời Pha-ra-ôn để phản ánh đại từ số nhiều và quan hệ quyền lực; giữ danh Yahweh và các tên riêng theo dạng phiên âm quen thuộc.
