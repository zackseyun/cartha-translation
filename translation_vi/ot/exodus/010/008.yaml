  naturalness: Tiếng Việt hiện đại, rõ ràng và có sắc thái trang trọng phù hợp văn bản Kinh Thánh. “Được đưa trở lại gặp Pha-ra-ôn” và “phụng sự Yahweh” đều trôi chảy. Đại từ “các ngươi” phù hợp lời nói với hai người và giữ số nhiều nguyên ngữ.
  terminology: Các tên Môi-se, A-rôn, Pha-ra-ôn nhất quán theo lối phiên âm Việt ngữ. “Yahweh” bảo tồn danh riêng יהוה; “Đức Chúa Trời của các ngươi” diễn đạt chính xác אֱלֹהֵיכֶם. “Phụng sự” bảo toàn phạm vi rộng hơn của עבד, không thu hẹp thành hành vi nghi lễ.
