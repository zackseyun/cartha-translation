source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: vi
  text: 'Bấy giờ, các bề tôi của Pha-ra-ôn nói với vua: “Cho đến bao giờ người này còn là cạm bẫy đối với chúng ta? Hãy cho những người đàn ông ấy đi, để họ phụng sự Yahweh, Đức Chúa Trời của họ.[a] Vua vẫn chưa biết rằng Ai Cập đã bị tàn phá sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phụng sự” cũng có thể dịch là “phục vụ” hoặc “thờ phượng”; động từ Hê-bơ-rơ có thể bao hàm cả sự phục vụ lẫn thờ phượng Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: các tôi tớ
  rationale: Giữ nghĩa trực tiếp của từ chỉ những người phục vụ Pha-ra-ôn; trong ngữ cảnh họ cũng có thể là các cận thần hoặc quan chức triều đình.
- source_word: עַד מָתַי
  choice: Cho đến bao giờ
  rationale: Cách hỏi tự nhiên, trang trọng trong tiếng Việt, truyền đạt lời trách cứ khẩn thiết của nguyên văn.
- source_word: זֶה
  choice: người này
  rationale: Đại từ chỉ định trong ngữ cảnh quy chiếu đến Môi-se; thêm “người” để câu tiếng Việt rõ và tự nhiên mà không nêu đích danh.
- source_word: לְמוֹקֵשׁ
  choice: là cái bẫy
  rationale: Giữ nguyên hình ảnh ẩn dụ về một thứ gây mắc bẫy và tai họa; “cạm bẫy” cũng có thể dùng.
- source_word: שַׁלַּח
  choice: Hãy cho ... đi
  rationale: Diễn đạt tự nhiên mệnh lệnh yêu cầu Pha-ra-ôn thả hoặc cho họ rời đi.
- source_word: הָאֲנָשִׁים
  choice: những người đàn ông ấy
  rationale: Phản ánh rõ danh từ giống đực số nhiều của tiếng Hê-bơ-rơ, thay vì mở rộng thành toàn thể dân chúng.
- source_word: וְיַעַבְדוּ
  choice: để họ phụng sự
  rationale: “Phụng sự” giữ được cả ý phục vụ lẫn sắc thái thờ phượng khi đối tượng là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng YHWH thay vì thay thế bằng một tước hiệu.
- source_word: הֲטֶרֶם תֵּדַע
  choice: Bệ hạ vẫn chưa biết ... sao?
  rationale: Tái hiện tự nhiên câu hỏi trách cứ hướng đến nhà vua; “Bệ hạ” làm rõ người được nói với theo phép xưng hô tiếng Việt.
- source_word: אָבְדָה
  choice: đã bị tàn phá
  rationale: Diễn tả kết quả hiện tại của các tai họa đã xảy ra, nhưng không hàm ý Ai Cập đã hoàn toàn không còn tồn tại.
- source_word: מִצְרָיִם
  choice: Ai Cập
  rationale: Tên gọi tiêu chuẩn trong tiếng Việt, chỉ cả đất nước trong ngữ cảnh.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: CHÚA hoặc Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo toàn tính chất danh riêng và không thay bằng tước hiệu.
- issue: Phạm vi của הָאֲנָשִׁים
  choice: những người đàn ông ấy
  alternative: dân ấy hoặc những người ấy
  rationale: Nguyên ngữ là danh từ giống đực số nhiều. Bản dịch giữ nét nghĩa này, dù trong mạch truyện đoàn người rộng hơn có thể đang được nói đến.
- issue: Nghĩa của עבד khi hướng đến Đức Chúa Trời
  choice: phụng sự
  alternative: thờ phượng hoặc phục vụ
  rationale: “Phụng sự” bảo toàn sự giao thoa giữa phục vụ và thờ phượng, không thu hẹp động từ vào chỉ một hoạt động nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ra-ôn” như danh xưng và “Bệ hạ” trong lời nói trực tiếp để tự nhiên hóa phép xưng hô với vua. Giữ “Yahweh” là danh riêng; giữ hình ảnh “cái bẫy” và nét giống đực của “những người đàn ông ấy”.
