  to: Họ không thấy nhau[a], và suốt ba ngày không ai đứng dậy khỏi chỗ mình; nhưng mọi người Y-sơ-ra-ên đều có ánh sáng trong chỗ ở của họ.
  rationale: Sửa “rời khỏi” thành “khỏi” để phản ánh sát hơn thành ngữ chỉ việc trỗi dậy từ vị trí của mình. Thay danh xưng tập thể bằng cách gọi hiện đại, trung tính hơn; đồng thời điều chỉnh “tại nơi họ ở” thành “trong chỗ ở của họ” để gần với nghĩa “trong các chỗ ở/khu cư trú của họ”. Chú thích a được chỉnh nhẹ để nêu rõ tính sát nghĩa và tính tương hỗ của thành ngữ Hê-bơ-rơ.
