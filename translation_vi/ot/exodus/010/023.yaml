  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: vi
  text: Họ không thấy nhau[a], và suốt ba ngày không ai đứng dậy khỏi chỗ mình; nhưng mọi người Y-sơ-ra-ên đều có ánh sáng trong chỗ ở của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hê-bơ-rơ: “một người không thấy anh em mình”; đây là cách nói tương hỗ, nghĩa là “họ không thấy nhau”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת אָחִיו
  choice: không thấy nhau
  rationale: Cụm אִישׁ אֶת־אָחִיו có nghĩa tương hỗ. “Không thấy nhau” diễn đạt tự nhiên mà không thêm ý khả năng như “không thể thấy nhau”.
- source_word: אִישׁ
  choice: không ai
  rationale: Danh từ số ít giống đực được dùng theo nghĩa phân phối và khái quát; “không ai” bao quát đúng ý trong tiếng Việt hiện đại.
- source_word: קָמוּ ... מִתַּחְתָּיו
  choice: đứng dậy rời khỏi chỗ mình
  rationale: קום là “đứng dậy/trỗi dậy”, còn מִתַּחְתָּיו theo ngữ cảnh chỉ vị trí người ấy đang ở. Cách dịch này giữ hình ảnh đứng dậy đồng thời làm rõ chuyển động khỏi chỗ.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: suốt ba ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài liên tục trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Đây là danh xưng dân tộc-giao ước, không chỉ nam giới hay trẻ em. “Con dân Y-sơ-ra-ên” giữ sắc thái cộng đồng có nguồn gốc chung và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: הָיָה אוֹר
  choice: đều có ánh sáng
  rationale: Cấu trúc này nói ánh sáng hiện hữu hoặc sẵn có cho dân Y-sơ-ra-ên; “có ánh sáng” truyền đạt trực tiếp sự tương phản với bóng tối của người Ai Cập.
- source_word: בְּמֹשְׁבֹתָם
  choice: tại nơi họ ở
  rationale: מוֹשָׁב có thể là chỗ ở hoặc khu định cư. “Nơi họ ở” tự nhiên, rõ nghĩa và không xác định quá mức là từng căn nhà hay toàn khu dân cư.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Y-sơ-ra-ên” theo lối phiên âm quen thuộc; giữ câu tương phản bằng “nhưng”. Không thêm ý rằng họ tuyệt đối không thể cử động, vì nguyên văn chỉ nói không ai đứng dậy rời khỏi chỗ mình.
