base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: vi
  text: Nhưng Đức Giê-hô-va làm cho lòng Pha-ra-ôn cứng cỏi[a], và ông không để con dân Y-sơ-ra-ên[b] ra đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho lòng Pha-ra-ôn vững lại” hoặc “làm mạnh lòng Pha-ra-ôn”; động từ Hê-bơ-rơ có nghĩa căn bản là “làm cho mạnh, vững chắc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “các con trai của Y-sơ-ra-ên”; cũng có thể dịch: “dân Y-sơ-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: làm cho ... cứng cỏi
  rationale: Động từ חזק có nghĩa căn bản là làm cho mạnh hoặc vững chắc; trong công thức lặp lại về Pha-ra-ôn, “làm cho lòng ... cứng cỏi” diễn đạt tự nhiên sự kháng cự đã trở nên kiên cố, đồng thời giữ nguyên tác nhân là Đức Giê-hô-va.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi tên riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: לֵב
  choice: lòng
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt cho trung tâm của ý chí, quyết tâm và khuynh hướng nội tâm; phù hợp hơn “trái tim” trong ngữ cảnh này.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm tiếng Việt quen thuộc của tước hiệu vua Ai Cập.
- source_word: שִׁלַּח
  choice: không để ... ra đi
  rationale: Trong bối cảnh giải phóng dân Y-sơ-ra-ên, cách dịch này diễn đạt tự nhiên nghĩa cho phép họ đi, thay vì nghĩa đen chung hơn là sai đi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm từ này vừa giữ sắc thái thuộc về cộng đồng hậu duệ của Y-sơ-ra-ên, vừa tự nhiên và bao quát trong tiếng Việt hiện đại; chú thích nêu cách dịch sát chữ.
theological_decisions:
- issue: Hành động của Đức Chúa Trời trong việc làm lòng Pha-ra-ôn cứng cỏi
  choice: Đức Giê-hô-va làm cho lòng Pha-ra-ôn cứng cỏi
  alternative: Đức Giê-hô-va làm cho lòng Pha-ra-ôn vững lại
  rationale: Bản Hê-bơ-rơ trực tiếp quy hành động này cho Đức Giê-hô-va. Bản dịch không làm nhẹ tác nhân thần thượng cũng không thêm lời giải thích về trách nhiệm của Pha-ra-ôn hay tiền định, nhờ đó giữ nguyên sự căng thẳng thần học của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lòng ... cứng cỏi” như một thành ngữ tự nhiên trong tiếng Việt; “con dân Y-sơ-ra-ên” tránh khiến độc giả hiểu cụm Hê-bơ-rơ chỉ nói đến nam giới. Dấu [a], [b] được đặt ngay sau các cụm từ liên quan.
