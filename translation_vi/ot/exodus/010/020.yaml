  source_fidelity: Bản dịch giữ rõ tác nhân là Đức Giê-hô-va, diễn đạt đúng mô-típ חזק trong ngữ cảnh là làm lòng Pha-ra-ôn trở nên cứng cỏi, và chuyển đúng ý שִׁלַּח là không cho dân Y-sơ-ra-ên ra đi. Tuy nhiên, liên từ «nên» diễn giải quan hệ hệ quả mạnh hơn liên từ phối hợp וְ trong nguyên văn; «và» sát hơn mà vẫn tự nhiên.
