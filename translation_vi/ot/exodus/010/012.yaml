  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh giơ/đưa tay, đất Ai Cập, tai châu chấu tập hợp, và việc chúng ăn thực vật còn sót lại sau mưa đá. Tuy nhiên, “tay con” thêm cách xưng hô phụ tử không được biểu thị bởi hậu tố sở hữu ngôi hai trong tiếng Hê-bơ-rơ; nên dùng cách diễn đạt không áp đặt quan hệ xưng hô. “Đã chừa lại” cũng phản ánh rõ hơn động từ hoàn thành, chỉ hậu quả của trận mưa đá trước đó.
  naturalness: Văn phong nhìn chung tự nhiên, hiện đại và phù hợp thể văn tường thuật Kinh Thánh. “Hãy đưa tay ra” tự nhiên hơn “Hãy giơ tay con ra” trong lời trực tiếp, đồng thời tránh lựa chọn đại từ không cần thiết. “Mưa đá đã chừa lại” rõ thời điểm hơn “mưa đá còn chừa lại.”
  terminology: “Yahweh,” “Môi-se,” “Ai Cập,” “châu chấu,” “mưa đá,” và “cây cỏ” đều phù hợp. Các chú thích bảo lưu đúng tính bất định của בָּאַרְבֶּה và cách dùng số ít tập hợp của אַרְבֶּה.
