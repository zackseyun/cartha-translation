  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֨ה יָדְ/ךָ֜ עַל אֶ֤רֶץ מִצְרַ֨יִם֙ בָּֽ/אַרְבֶּ֔ה וְ/יַ֖עַל עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יֹאכַל֙ אֶת כָּל עֵ֣שֶׂב הָ/אָ֔רֶץ אֵ֛ת כָּל אֲשֶׁ֥ר הִשְׁאִ֖יר הַ/בָּרָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se: “Hãy đưa tay ra trên đất Ai Cập để châu chấu kéo đến[a]. Chúng sẽ tràn khắp đất Ai Cập[b] và ăn hết mọi cây cỏ trong xứ, tức mọi thứ mà mưa đá đã chừa lại.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ có thể hiểu sát hơn là “về châu chấu”, “nhằm vào châu chấu” hoặc “trên châu chấu”; chức năng chính xác của giới từ ở đây không rõ.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng danh từ “châu chấu” và các động từ ở số ít theo nghĩa tập hợp, chỉ cả đàn châu chấu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời bằng dạng chuyển tự quen dùng trong dự án, thay vì thay thế bằng một tước hiệu.
- source_word: נְטֵה יָדְךָ
  choice: Hãy giơ tay con ra
  rationale: Diễn đạt tự nhiên mệnh lệnh giơ hoặc đưa tay ra; đại từ “con” phù hợp với lời Yahweh trực tiếp phán với Môi-se trong văn phong trang trọng mà dễ hiểu.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: trên đất Ai Cập
  rationale: Giữ ý nghĩa không gian của עַל và danh từ אֶרֶץ, đồng thời dùng cách gọi địa danh hiện đại.
- source_word: בָּאַרְבֶּה
  choice: để châu chấu kéo đến
  rationale: Giới từ בְּ ở đây khó xác định chính xác; bản dịch chính diễn đạt chức năng của cử chỉ trong mạch văn một cách tự nhiên, còn chú thích bảo lưu các khả năng sát chữ hơn.
- source_word: אַרְבֶּה
  choice: châu chấu
  rationale: Danh từ số ít được dùng theo nghĩa tập hợp, chỉ cả đàn châu chấu; tiếng Việt có thể dùng “châu chấu” như danh từ loài mà không cần đánh dấu số nhiều.
- source_word: וְיַעַל עַל אֶרֶץ מִצְרַיִם
  choice: Chúng sẽ tràn khắp đất Ai Cập
  rationale: עלה cơ bản là “đi lên”, nhưng trong ngữ cảnh cả đàn châu chấu tiến vào và phủ khắp xứ, “tràn khắp” truyền đạt hình ảnh tự nhiên hơn trong tiếng Việt.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: mọi cây cỏ trong xứ
  rationale: עֵשֶׂב chỉ thảm thực vật nói chung; “cây cỏ” rộng hơn “cỏ” và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: mọi thứ mà mưa đá còn chừa lại
  rationale: Giữ mối liên hệ với tai họa mưa đá trước đó; “còn chừa lại” diễn đạt rõ nghĩa để lại hoặc không phá hủy.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bảo tồn danh riêng trong bản nguồn, không thay bằng tước hiệu và không đưa thêm lập trường hệ phái.
- issue: Số của אַרְבֶּה và các động từ đi kèm
  choice: Hiểu theo nghĩa tập hợp và dùng “chúng”
  alternative: Dịch sát hình thái số ít là “nó” hoặc “con châu chấu”
  rationale: Tiếng Hê-bơ-rơ dùng danh từ và động từ số ít theo nghĩa tập hợp cho cả đàn; “chúng” tránh gợi sai rằng chỉ có một con châu chấu, mà không thay đổi nội dung thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Môi-se”, “Ai Cập”, “mưa đá” và “cây cỏ” theo cách gọi phổ thông; tránh từ cổ như “đặng”, “xứ Ê-díp-tô” và tránh giải quyết dứt khoát giới từ khó trước אַרְבֶּה bằng cách ghi chú phương án sát chữ.
