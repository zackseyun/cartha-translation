reference: Exodus 10:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: vi
  text: Vậy Môi-se giơ cây gậy của mình trên xứ Ai Cập, và Yahweh khiến một luồng gió đông[a] thổi khắp xứ suốt ngày hôm ấy và suốt đêm. Đến sáng, gió đông đã mang châu chấu đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “gió từ phía đông.”'
    reason: Cụm רוּחַ קָדִים chỉ gió xuất phát từ phía đông; «gió đông» là cách nói tự nhiên trong tiếng Việt, và chú thích nêu phương án diễn đạt tường minh hơn.
lexical_decisions:
- source_word: וַיֵּט
  choice: giơ ... ra
  rationale: Động từ נטה diễn tả việc đưa hoặc giơ vật ra; cách nói này tự nhiên trong tiếng Việt và phù hợp với hành động dùng gậy trong trình thuật các tai họa.
- source_word: מַטֵּהוּ
  choice: cây gậy mình
  rationale: מַטֶּה là gậy cầm tay; “cây gậy” rõ nghĩa và quen thuộc trong tiếng Việt hiện đại.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: trên đất Ai Cập
  rationale: עַל trong ngữ cảnh động tác giơ gậy được chuyển là “trên”; אֶרֶץ מִצְרַיִם chỉ lãnh thổ Ai Cập.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị trực tiếp bằng יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: נִהַג רוּחַ קָדִים
  choice: khiến một luồng gió đông thổi
  rationale: נהג có nghĩa dẫn hoặc thúc đẩy. Với gió làm đối tượng, “khiến ... thổi” truyền đạt rõ sự chủ động của Yahweh mà vẫn tự nhiên trong tiếng Việt; רוּחַ קָדִים là gió từ phía đông.
- source_word: בָּאָרֶץ
  choice: khắp xứ
  rationale: Trong chuyển động của gió, “khắp xứ” diễn đạt tự nhiên phạm vi trên toàn đất Ai Cập.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: suốt ngày hôm ấy và suốt đêm
  rationale: Lặp “suốt” để giữ sắc thái nhấn mạnh thời lượng của כָּל trong cả hai vế, đồng thời dùng cách nói Việt tự nhiên.
- source_word: הַבֹּקֶר הָיָה
  choice: Đến sáng
  rationale: Cụm từ đánh dấu sự chuyển tiếp thời gian; “Đến sáng” ngắn gọn, tự nhiên và sát chức năng trong mạch kể.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: đã mang châu chấu đến
  rationale: נשא ở đây diễn tả gió mang đàn châu chấu tới; “đã” thể hiện kết quả đã thành hiện thực vào buổi sáng.
- source_word: הָאַרְבֶּה
  choice: châu chấu
  rationale: Danh từ số ít có nghĩa tập thể, nên “châu chấu” trong tiếng Việt tự nhiên chỉ cả đàn mà không cần thêm từ không có trong nguyên văn.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה. Phiên âm “Yahweh” bảo tồn việc câu này nêu trực tiếp danh giao ước, thay vì thay bằng tước hiệu.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Cấu trúc câu giữ chuỗi hành động và quan hệ nhân quả của tiếng Hê-bơ-rơ, đồng thời tránh lối diễn đạt quá sát chữ gây gượng trong tiếng Việt.
