revisions:
- from: Vậy, Môi-se giơ cây gậy mình ra trên đất Ai Cập, và Yahweh khiến một luồng gió đông thổi khắp xứ suốt ngày hôm ấy và suốt đêm. Đến sáng, gió đông đã mang châu chấu đến.
  to: Vậy Môi-se giơ cây gậy của mình trên xứ Ai Cập, và Yahweh khiến một luồng gió đông[a] thổi khắp xứ suốt ngày hôm ấy và suốt đêm. Đến sáng, gió đông đã mang châu chấu đến.
  rationale: Chỉnh nhẹ cách nói sở hữu để tiếng Việt hiện đại tự nhiên hơn, dùng «xứ» nhất quán cho lãnh thổ Ai Cập, và bổ sung lại chú thích từ vựng được hỗ trợ bởi bản đối chiếu. Không thay đổi trình tự, tác nhân, thời lượng, hay sắc thái hoàn tất của nguyên văn.
