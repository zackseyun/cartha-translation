  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: vi
  text: Nhưng Yahweh làm cho lòng Pha-ra-ôn cứng lại[a], và ông không muốn cho họ đi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho lòng Pha-ra-ôn vững mạnh/cứng rắn.” Động từ Hê-bơ-rơ có thể mang nghĩa “làm mạnh” hoặc “làm vững”; trong ngữ cảnh này, khi đi với “lòng”, nó mang ý làm cho ý chí trở nên cứng rắn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và ông từ chối cho họ đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: làm cho… cứng lại
  rationale: Động từ חזק có nghĩa cơ bản là làm mạnh hoặc làm vững; khi đi với “lòng” trong công thức lặp lại của trình thuật Xuất Ai Cập, cụm này diễn tả việc làm cho ý chí trở nên cứng rắn. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ rõ tác nhân là Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: לֵב
  choice: lòng
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt cho trung tâm của ý chí và khuynh hướng nội tâm, đồng thời giữ được hình ảnh của nguyên văn.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tước hiệu của vua Ai Cập.
- source_word: לֹא אָבָה
  choice: không muốn
  rationale: אָבָה nói đến sự sẵn lòng hoặc ưng thuận. “Không muốn” phản ánh trực tiếp sắc thái ý chí; “từ chối” là một cách hiểu mạnh hơn nhưng phù hợp với ngữ cảnh và được ghi ở chú thích.
- source_word: לְשַׁלְּחָם
  choice: để họ đi
  rationale: Trong ngữ cảnh này, שׁלח chỉ việc cho phép dân Israel rời đi. “Để họ đi” là cách nói tự nhiên và giữ được điệp ngữ của trình thuật.
theological_decisions:
- issue: Hành động làm cứng lòng của Đức Chúa Trời và ý muốn của Pha-ra-ôn
  choice: 'Giữ hai mệnh đề song song: Yahweh làm cho lòng Pha-ra-ôn cứng lại, và Pha-ra-ôn không muốn để dân Israel đi.'
  alternative: 'Diễn đạt mệnh đề thứ hai như kết quả trực tiếp: “đến nỗi ông từ chối không để họ đi.”'
  rationale: Nguyên văn quy hành động làm cứng lòng cho Yahweh, rồi vẫn nói đến sự không muốn của Pha-ra-ôn. Liên từ chỉ đơn giản là “và”, nên bản dịch không thêm quan hệ nhân quả và không hóa giải sự căng thẳng thần học giữa tác động của Đức Chúa Trời với ý chí con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lòng” để giữ thành ngữ Kinh Thánh quen thuộc nhưng vẫn tự nhiên; dùng “ông” để quy chiếu rõ về Pha-ra-ôn mà không lặp lại tước hiệu.
