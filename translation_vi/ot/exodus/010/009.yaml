base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: vi
  text: 'Môi-se nói: “Chúng tôi sẽ đi cùng người trẻ và người già của chúng tôi; chúng tôi sẽ đi cùng các con trai và con gái của chúng tôi, cùng đàn chiên dê và đàn bò của chúng tôi, vì chúng tôi phải giữ một kỳ lễ cho Đức Giê-hô-va.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: cả người trẻ lẫn người già
  rationale: Diễn đạt tự nhiên cấu trúc sóng đôi, đồng thời giữ ý toàn thể các thế hệ cùng đi.
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: bầy chiên, bầy dê và đàn bò của mình
  rationale: צֹאן chỉ chung gia súc nhỏ gồm chiên và dê, còn בָּקָר chỉ bò; cách dịch nêu rõ các nhóm vật nuôi trong tiếng Việt hiện đại.
- source_word: חַג
  choice: giữ lễ
  rationale: Trong ngữ cảnh này, danh từ chỉ một lễ hội tôn giáo; kết hợp với ý sở hữu trong לָנוּ, 'phải giữ lễ' truyền đạt tự nhiên mục đích hành hương mà không thêm loại lễ cụ thể.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh thánh quen thuộc, trang trọng và phân biệt với tước hiệu 'Chúa'.
- source_word: כִּי
  choice: vì
  rationale: 'Giữ quan hệ nguyên nhân: toàn thể người và gia súc phải đi vì họ có lễ kính Đức Giê-hô-va.'
theological_decisions:
- issue: Mức độ bắt buộc trong mệnh đề כִּי חַג יְהוָה לָנוּ
  choice: vì chúng tôi phải giữ lễ kính Đức Giê-hô-va
  alternative: vì chúng tôi có một kỳ lễ kính Đức Giê-hô-va
  rationale: Nguyên văn nói sát là 'vì một kỳ lễ của YHWH [là] cho chúng tôi'. 'Phải giữ lễ' làm rõ nghĩa vụ hàm chứa trong bối cảnh mà không xác định thêm nghi thức hay giáo lý.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Giữ phép lặp 'chúng tôi sẽ đi' của tiếng Hê-bơ-rơ để nhấn mạnh rằng mọi thế hệ và toàn bộ gia súc đều phải cùng đi.
