source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: vi
  text: 'Rồi Đức Giê-hô-va phán với Môi-se: “Hãy vào gặp Pha-ra-ôn, vì chính Ta đã làm cứng lòng vua và lòng các bề tôi của vua[a], để Ta đặt những dấu lạ này của Ta giữa họ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “Ta đã làm nặng lòng vua và lòng các bề tôi của vua.” Thành ngữ này có nghĩa là Đức Giê-hô-va đã làm cho họ cứng lòng, không chịu đáp ứng.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “ở giữa người ấy” hoặc “trong phạm vi của người ấy.” Cụm từ này có thể chỉ riêng Pha-ra-ôn, hoặc Pha-ra-ôn cùng các bề tôi và triều đình của vua.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Waw liên tiếp đẩy trình thuật tiến tới; “Rồi” diễn đạt tự nhiên trình tự ấy, còn “phán” phù hợp với lời của Đức Chúa Trời.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Hãy vào gặp Pha-ra-ôn
  rationale: Giữ sắc thái đi/vào yết kiến của בוא trong bối cảnh Môi-se đến trước mặt Pha-ra-ôn.
- source_word: כִּי
  choice: vì
  rationale: Ở đây כִּי nêu lý do cho mệnh lệnh.
- source_word: הִכְבַּדְתִּי
  choice: đã làm cứng
  rationale: Hiphil của כבד theo nghĩa đen là “làm nặng”; trong thành ngữ nói về lòng, “làm cứng lòng” truyền đạt rõ sự chai lì, không đáp ứng, đồng thời nghĩa đen được ghi ở chú thích.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: lòng vua và lòng các bề tôi của vua
  rationale: “Lòng” là cách tương ứng truyền thống và tự nhiên cho trung tâm ý chí, suy nghĩ; lặp “vua” giúp tiếng Việt rõ chủ thể.
- source_word: עֲבָדָיו
  choice: các bề tôi của vua
  rationale: Trong triều đình Pha-ra-ôn, từ này chỉ những người phục vụ hay quan thuộc của vua; “bề tôi” vừa chính xác theo bối cảnh vừa trang trọng.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt ngắn gọn và tự nhiên ý mục đích.
- source_word: שִׁתִי
  choice: Ta đặt
  rationale: Động từ שׁית mang nghĩa đặt, để; “đặt” giữ hình ảnh của nguyên ngữ mà vẫn tự nhiên.
- source_word: אֹתֹתַי אֵלֶּה
  choice: những dấu lạ này của Ta
  rationale: Giữ cả đại từ chỉ định lẫn hậu tố sở hữu; “dấu lạ” tự nhiên hơn “dấu hiệu” trong mạch các tai họa mang tính siêu nhiên.
- source_word: בְּקִרְבּוֹ
  choice: giữa họ
  rationale: Nguyên dạng là số ít, “ở giữa nó/người ấy”, có thể quy về Pha-ra-ôn hoặc phạm vi triều đình của vua. Bản dịch chính dùng số nhiều theo văn cảnh nhưng ghi rõ sự mơ hồ trong chú thích.
theological_decisions:
- issue: Đức Chúa Trời làm cứng lòng Pha-ra-ôn
  choice: chính Ta đã làm cứng lòng vua
  alternative: Ta đã làm nặng lòng vua / Ta đã khiến lòng vua chai lì
  rationale: Giữ nguyên sự quy trách nhiệm trực tiếp cho Đức Giê-hô-va trong câu Hê-bơ-rơ, không giảm nhẹ cũng không giải quyết thay bản văn sự căng thẳng giữa chủ quyền của Đức Chúa Trời và trách nhiệm của con người. Từ “chính” làm rõ đại từ אֲנִי được nêu tường minh.
- issue: Phạm vi của các dấu lạ trong בְּקִרְבּוֹ
  choice: giữa họ
  alternative: ở giữa vua / trong phạm vi của vua
  rationale: Số ít của nguyên ngữ có thể chỉ riêng Pha-ra-ôn, nhưng danh từ số nhiều ngay trước đó mở ra khả năng nói đến Pha-ra-ôn cùng triều thần. Chú thích bảo tồn cả hai khả năng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng các tên quen thuộc “Môi-se”, “Pha-ra-ôn” và “Đức Giê-hô-va”; giữ lời phán trực tiếp, hình ảnh “lòng”, cùng sự mơ hồ thật sự của בְּקִרְבּוֹ qua chú thích.
