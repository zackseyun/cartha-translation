  terminology: Các danh xưng “Đức Giê-hô-va,” “Môi-se,” và “Pha-ra-ôn” nhất quán. “Bề tôi” phù hợp ngữ cảnh triều đình và register Kinh Thánh. “Dấu lạ” thích hợp cho אֹתוֹת trong ngữ cảnh các tai họa.
