  source_fidelity: Bản dịch truyền đạt trung thành diễn tiến, mệnh lệnh, lý do, sự quy trực tiếp việc làm cứng lòng cho Đức Giê-hô-va, mục đích, và các “dấu lạ” của Ngài. “Giữa họ” là một cách giải nghĩa có thể chấp nhận được trong bản văn chính, vì chú thích giữ lại số ít và các khả năng quy chiếu của בְּקִרְבּוֹ.
