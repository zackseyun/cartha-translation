  terminology: “Yahweh” nhất quán với quyết định dự án cho יהוה; “Môi-se” và “Ai Cập” là các dạng tên riêng tiếng Việt thông dụng. Không có thuật ngữ thần học nào bị áp đặt hoặc diễn giải quá mức.
