source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֤ה יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ֥/יהִי חֹ֖שֶׁךְ עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יָמֵ֖שׁ חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy giơ tay về phía trời, để bóng tối bao phủ đất Ai Cập, và người ta có thể sờ thấy bóng tối ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Động từ Hê-bơ-rơ ở đây hiếm gặp. Cũng có thể dịch: “và bóng tối ấy có thể được cảm nhận.” Mệnh đề nhấn mạnh bóng tối dày đặc đến mức gần như có thể chạm vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng Tetragrammaton, thay vì thay bằng một tước hiệu hoặc dùng dạng ‘Giê-hô-va’.
- source_word: נְטֵה יָדְךָ
  choice: Hãy giơ tay
  rationale: Diễn đạt tự nhiên mệnh lệnh ‘đưa/duỗi tay ra’ trong ngữ cảnh Môi-se hướng tay lên trời để thực hiện dấu lạ.
- source_word: עַל הַשָּׁמַיִם
  choice: về phía trời
  rationale: Giới từ עַל trong ngữ cảnh cử chỉ mang ý hướng về phía trên; ‘về phía trời’ tự nhiên trong tiếng Việt và không buộc הַשָּׁמַיִם phải mang nghĩa thần học ‘các tầng trời’.
- source_word: וִיהִי חֹשֶׁךְ עַל אֶרֶץ מִצְרָיִם
  choice: để bóng tối bao phủ đất Ai Cập
  rationale: ‘Để’ thể hiện sắc thái mục đích/kết quả của thể mệnh lệnh gián tiếp; ‘bao phủ’ chuyển tải tự nhiên bóng tối ở trên toàn xứ, đồng thời giữ danh từ ‘đất’ của אֶרֶץ.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: và người ta có thể sờ thấy bóng tối ấy
  rationale: Động từ hiếm יָמֵשׁ thường được hiểu từ gốc משׁש, ‘sờ, dò bằng tay’. Cách dịch này giữ cấu trúc thành một mệnh đề riêng và diễn đạt tính hữu hình, dày đặc của bóng tối; sự không chắc chắn được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh יהוה. Giữ ‘Yahweh’ giúp phân biệt danh riêng này với các tước hiệu, mà không đưa thêm cách giải thích hệ phái.
- issue: Chủ thể của mệnh đề cuối
  choice: người ta có thể sờ thấy bóng tối ấy
  alternative: bóng tối ấy có thể được cảm nhận
  rationale: Hình thái và động từ hiếm cho phép hiểu theo lối vô nhân xưng/chủ động hoặc thụ động. Bản chính chọn cách diễn đạt tự nhiên trong tiếng Việt, còn chú thích giữ cách hiểu thay thế, không biến hình ảnh thành một khẳng định giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” phù hợp lời Đức Chúa Trời; “giơ tay về phía trời” tự nhiên hơn cách dịch quá sát như “duỗi tay trên các tầng trời”. Dấu chú thích [a] đặt ngay sau mệnh đề mà chú thích giải thích.
