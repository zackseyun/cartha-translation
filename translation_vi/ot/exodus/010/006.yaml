  text: וּ/מָלְא֨וּ בָתֶּ֜י/ךָ וּ/בָתֵּ֣י כָל עֲבָדֶי/ךָ֮ וּ/בָתֵּ֣י כָל מִצְרַיִם֒ אֲשֶׁ֨ר לֹֽא רָא֤וּ אֲבֹתֶ֨י/ךָ֙ וַ/אֲב֣וֹת אֲבֹתֶ֔י/ךָ מִ/יּ֗וֹם הֱיוֹתָ/ם֙ עַל הָ֣/אֲדָמָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּ֥פֶן וַ/יֵּצֵ֖א מֵ/עִ֥ם פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: vi
  text: Chúng sẽ tràn ngập các nhà của ngươi, các nhà của mọi tôi tớ ngươi và các nhà trong toàn cõi Ai Cập—một cảnh tượng mà tổ tiên ngươi và tổ tiên của họ chưa từng thấy, từ ngày họ có mặt trên đất cho đến ngày nay.” Rồi Môi-se quay đi và rời khỏi Pha-ra-ôn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: Chúng sẽ tràn ngập
  rationale: Động từ số nhiều tiếp nối lời báo trước về tương lai; chủ ngữ được hiểu theo ngữ cảnh là châu chấu. “Tràn ngập” diễn đạt tự nhiên ý chúng lấp đầy các nhà.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: các nhà của ngươi, các nhà của mọi tôi tớ ngươi và các nhà trong toàn cõi Ai Cập
  rationale: Giữ cấu trúc lặp và phạm vi tăng dần từ Pha-ra-ôn đến tôi tớ rồi toàn Ai Cập; “toàn cõi Ai Cập” là cách nói tự nhiên về xứ sở.
- source_word: עֲבָדֶיךָ
  choice: tôi tớ ngươi
  rationale: Từ này có thể chỉ người phục vụ hoặc quan thuộc trong triều. “Tôi tớ” giữ được độ rộng nghĩa, không xác định quá mức là quan chức hay nô lệ.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: một cảnh tượng mà ... chưa từng thấy
  rationale: Mệnh đề quan hệ mô tả tính chưa từng có của tai họa vừa được báo trước; thêm “một cảnh tượng” giúp câu tiếng Việt rõ và tự nhiên mà không đổi ý.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: tổ tiên ngươi cùng các thế hệ trước họ
  rationale: Diễn đạt phạm vi nhiều thế hệ của thành ngữ Hê-bơ-rơ, tránh giới hạn nghĩa vào cha và ông nội theo nghĩa hẹp.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: kể từ ngày họ hiện hữu trên mặt đất
  rationale: Giữ ý về thời điểm bắt đầu sự hiện diện hay tồn tại của các thế hệ ấy, đồng thời dùng lối nói trang trọng và dễ hiểu.
- source_word: הָאֲדָמָה
  choice: mặt đất
  rationale: Trong thành ngữ nói về các thế hệ tồn tại trên đất, “mặt đất” tự nhiên và bảo toàn khả năng chỉ đất/địa cầu hơn là thu hẹp vào lãnh thổ Ai Cập.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: cho đến ngày nay
  rationale: Thành ngữ thời gian tự nhiên trong tiếng Việt, tương ứng sát với nguyên văn.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Rồi Môi-se quay đi và rời khỏi Pha-ra-ôn
  rationale: Ngữ cảnh xác định chủ thể là Môi-se; nêu tên giúp tiếng Việt rõ ràng. “Quay đi và rời khỏi” bảo toàn hai động từ liên tiếp trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Duy trì đại từ “ngươi” trong lời Môi-se nói trực tiếp với Pha-ra-ôn để giữ sắc thái uy nghiêm của trình thuật; không thêm chú giải giáo phái. Không dùng chú thích vì các khả năng từ vựng chính đã được bảo toàn hoặc diễn đạt trực tiếp trong câu.
