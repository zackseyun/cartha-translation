revisions:
- from: Chúng sẽ tràn ngập các nhà của ngươi, các nhà của mọi tôi tớ ngươi và các nhà trong toàn cõi Ai Cập—một cảnh tượng mà tổ tiên ngươi cùng các thế hệ trước họ chưa từng thấy, kể từ ngày họ hiện hữu trên mặt đất cho đến ngày nay.” Rồi Môi-se quay đi và rời khỏi Pha-ra-ôn.
  to: Chúng sẽ tràn ngập các nhà của ngươi, các nhà của mọi tôi tớ ngươi và các nhà trong toàn cõi Ai Cập—một cảnh tượng mà tổ tiên ngươi và tổ tiên của họ chưa từng thấy, từ ngày họ có mặt trên đất cho đến ngày nay.” Rồi Môi-se quay đi và rời khỏi Pha-ra-ôn.
