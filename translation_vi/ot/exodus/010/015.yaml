source:
  edition: WLC
  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: vi
  text: Châu chấu phủ kín bề mặt cả xứ[a], khiến đất đai tối sầm; chúng ăn hết mọi cây cỏ trong xứ và mọi hoa trái trên cây mà trận mưa đá còn để lại. Trong khắp xứ Ai Cập, không còn gì xanh tươi trên cây cối hoặc trong cây cỏ ngoài đồng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “mắt của cả xứ,” một thành ngữ chỉ bề mặt nhìn thấy được của đất.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: Chúng phủ kín
  rationale: Động từ Hê-bơ-rơ ở số ít vì chủ thể tập hợp là đàn châu chấu trong ngữ cảnh; tiếng Việt dùng đại từ số nhiều “chúng” tự nhiên hơn khi quy chiếu đến châu chấu.
- source_word: עֵין כָּל הָאָרֶץ
  choice: bề mặt cả xứ
  rationale: Cụm này theo nghĩa đen là “mắt của cả xứ,” một thành ngữ chỉ phần bề mặt nhìn thấy được; “bề mặt cả xứ” truyền đạt nghĩa rõ ràng trong tiếng Việt, còn nghĩa đen được ghi ở chú thích.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: khiến đất đai tối sầm
  rationale: Động từ diễn tả việc trở nên tối; “khiến” thể hiện quan hệ kết quả tự nhiên từ việc châu chấu phủ kín bề mặt đất.
- source_word: וַיֹּאכַל
  choice: chúng ăn sạch
  rationale: Nghĩa cơ bản là “ăn”; từ “sạch” diễn đạt kết quả trọn vẹn được câu sau xác nhận, đồng thời tự nhiên trong văn cảnh nạn châu chấu.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: mọi cây cỏ trong xứ
  rationale: עֵשֶׂב chỉ thực vật nói chung, rộng hơn riêng “cỏ”; “cây cỏ” là cách nói phổ thông và bao quát.
- source_word: כָּל פְּרִי הָעֵץ
  choice: mọi trái cây
  rationale: Danh từ “cây” ở số ít có nghĩa tập hợp; “mọi trái cây” chuyển tải tự nhiên toàn bộ hoa lợi trên cây.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: mà trận mưa đá còn để lại
  rationale: Giữ ý những gì sống sót sau tai họa mưa đá trước đó mà không thêm sắc thái giải thích quá mức.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: không còn một chút xanh tươi nào
  rationale: Cách diễn đạt này giữ sự phủ định tuyệt đối và hình ảnh rộng của יֶרֶק, tức bất cứ vật xanh hay mảng xanh nào.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: trên cây cối hay giữa cây cỏ ngoài đồng
  rationale: Các danh từ số ít tập hợp được chuyển thành cách nói tự nhiên trong tiếng Việt; “hay” phù hợp với phạm vi phủ định gồm cả hai nhóm.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: Trong khắp xứ Ai Cập
  rationale: Diễn đạt tự nhiên phạm vi toàn thể lãnh thổ Ai Cập.
