source:
  edition: WLC
  text: וַ/יַּ֣עַל הָֽ/אַרְבֶּ֗ה עַ֚ל כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יָּ֕נַח בְּ/כֹ֖ל גְּב֣וּל מִצְרָ֑יִם כָּבֵ֣ד מְאֹ֔ד לְ֠/פָנָי/ו לֹא הָ֨יָה כֵ֤ן אַרְבֶּה֙ כָּמֹ֔/הוּ וְ/אַחֲרָ֖י/ו לֹ֥א יִֽהְיֶה כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: vi
  text: Châu chấu tràn lên khắp đất Ai Cập và đậu xuống trên toàn cõi Ai Cập. Chúng dày đặc vô cùng[a]; trước đó chưa từng có một trận châu chấu nào như vậy, và sau này cũng sẽ không bao giờ có nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “rất nặng”; trong ngữ cảnh này, cụm từ diễn tả mức độ đặc biệt lớn hoặc nghiêm trọng của nạn châu chấu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: tràn lên
  rationale: Động từ עלה có nghĩa cơ bản là “đi/lên”; trong ngữ cảnh châu chấu phủ khắp đất, “tràn lên” giữ được hướng chuyển động đồng thời diễn đạt tự nhiên sự lan tới ồ ạt.
- source_word: הָאַרְבֶּה
  choice: châu chấu
  rationale: Danh từ ở dạng số ít nhưng mang nghĩa tập hợp. Tiếng Việt có thể dùng “châu chấu” như danh từ chỉ cả đàn mà không cần thêm từ không có trong nguyên văn.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: khắp đất Ai Cập
  rationale: Diễn đạt toàn bộ phạm vi lãnh thổ Ai Cập một cách gọn và tự nhiên.
- source_word: וַיָּנַח
  choice: đậu xuống
  rationale: נוח chỉ việc dừng lại hoặc đáp xuống; “đậu xuống” phù hợp tự nhiên với châu chấu hơn “nghỉ”.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: trên toàn cõi Ai Cập
  rationale: גְּבוּל ở đây chỉ địa phận hay toàn lãnh thổ, không chỉ đường biên. “Toàn cõi” bảo toàn ý nghĩa ấy và tránh hàm ý nhiều đơn vị lãnh thổ riêng biệt.
- source_word: כָּבֵד מְאֹד
  choice: dày đặc vô cùng
  rationale: Nghĩa đen là “rất nặng”; trong ngữ cảnh một cuộc xâm nhập của châu chấu, thành ngữ này nói đến mức độ áp đảo, dày đặc hoặc nghiêm trọng. “Dày đặc vô cùng” gắn trực tiếp với số lượng châu chấu mà không thêm danh từ “đàn” vào chính cụm từ.
- source_word: לְפָנָיו לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: trước đó chưa từng có một trận châu chấu nào như vậy
  rationale: “Trận châu chấu” diễn đạt tự nhiên biến cố tập thể được so sánh, đồng thời giữ lời khẳng định chưa từng có tiền lệ.
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵּן
  choice: và sau này cũng sẽ không bao giờ có nữa
  rationale: 'Giữ nguyên hướng tương lai và vế đối xứng: trước đó chưa từng có, về sau cũng không có.'
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch ưu tiên tương đương tối ưu: giữ hình ảnh “tràn lên,” dùng “đậu xuống” theo tập tính châu chấu, và chuyển thành ngữ “rất nặng” thành “dày đặc vô cùng,” đồng thời ghi nghĩa sát trong chú thích.'
