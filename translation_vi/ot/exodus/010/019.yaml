    reason: cultural_note
  - marker: b
    text: “Biển Sậy” theo tiếng Hê-bơ-rơ; theo truyền thống thường dịch là “Biển Đỏ”.
    reason: alternative_reading
  revision_rationale: Bản sửa làm rõ Yahweh là Đấng làm đổi hướng gió, thay “xuống” bằng “vào” để không thêm chi tiết không có trong nguyên ngữ, và điều chỉnh chú thích để phân biệt nghĩa chữ với cách hiểu địa lý theo ngữ cảnh. Các mốc chú thích vẫn được đặt đúng tại “gió tây” và “Biển Sậy”.
