  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: vi
  text: Đức Giê-hô-va làm đổi hướng một cơn gió tây rất mạnh[a]; gió ấy cuốn châu chấu đi và dồn chúng vào Biển Sậy[b]. Không một con châu chấu nào còn sót lại trên toàn lãnh thổ Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “gió biển”. Trong bối cảnh Ai Cập, cụm này có thể chỉ gió từ phía biển, tức gió tây.'
    reason: cultural_note
  - marker: b
    text: “Biển Sậy” theo tiếng Hê-bơ-rơ; theo truyền thống thường dịch là “Biển Đỏ”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: đổi chiều, khiến ... thổi đến
  rationale: Động từ הפך có nghĩa là xoay, đổi hoặc chuyển. Trong ngữ cảnh hướng gió, cách diễn đạt này tự nhiên trong tiếng Việt và không hàm ý rằng Đức Chúa Trời tự biến thành gió.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc trong tiếng Việt để biểu đạt trực tiếp Danh Thánh יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: רוּחַ יָם
  choice: gió tây
  rationale: Nghĩa đen là 'gió biển'; trong bối cảnh địa lý Ai Cập, đây là gió từ phía Địa Trung Hải thổi đến, tức gió tây. Chú thích giữ lại hình ảnh nguyên ngữ.
- source_word: חָזָק מְאֹד
  choice: rất mạnh
  rationale: Phản ánh trực tiếp mức độ nhấn mạnh của tiếng Hê-bơ-rơ bằng cách nói tự nhiên hiện nay.
- source_word: וַיִּשָּׂא אֶת הָאַרְבֶּה
  choice: Gió cuốn châu chấu đi
  rationale: נשא có thể là nhấc lên hoặc mang đi; khi chủ thể là gió, 'cuốn ... đi' diễn đạt rõ và tự nhiên.
- source_word: וַיִּתְקָעֵהוּ
  choice: đẩy chúng xuống
  rationale: תקע ở đây mang ý thúc hoặc dồn mạnh vào một nơi. Hậu tố số ít chỉ tập thể đàn châu chấu, nên tiếng Việt dùng 'chúng'.
- source_word: יָמָּה סּוּף
  choice: Biển Sậy
  rationale: Dịch sát địa danh יַם־סוּף, theo nghĩa thông thường là 'Biển Sậy', thay vì mặc nhiên dùng tên truyền thống 'Biển Đỏ'.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: Không một con châu chấu nào còn sót lại
  rationale: Giữ trọn sắc thái tuyệt đối và nhấn mạnh của 'không còn lại dù một con'.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: trên toàn lãnh thổ Ai Cập
  rationale: גְּבוּל trong ngữ cảnh này chỉ toàn vùng đất nằm trong ranh giới Ai Cập, không chỉ đường biên.
theological_decisions:
- issue: Cách dịch Danh Thánh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ đây là danh riêng của Đức Chúa Trời, không thay bằng tước hiệu. 'Đức Giê-hô-va' là dạng tiếng Việt trang trọng, dễ nhận biết; không có chủ trương hệ phái nào được thêm vào.
- issue: Cách dịch địa danh יַם־סוּף
  choice: Biển Sậy
  alternative: Biển Đỏ
  rationale: Ưu tiên hình thức dựa trên tiếng Hê-bơ-rơ và giữ tên truyền thống trong chú thích để độc giả nhận diện, không khẳng định thêm một cách xác định địa lý cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tách mệnh đề thứ hai thành câu mới để tránh chuỗi liên từ nặng nề trong tiếng Việt, nhưng vẫn giữ nguyên trình tự hành động. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
