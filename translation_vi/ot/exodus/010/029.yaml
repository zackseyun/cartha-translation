  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: vi
  text: 'Môi-se nói: “Đúng như lời ngài đã nói[a], tôi sẽ không bao giờ thấy mặt ngài nữa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài nói đúng” hoặc “Cứ như lời ngài đã nói.”'
    reason: alternative_reading
  - marker: b
    text: 'Tiếng Hê-bơ-rơ, theo sát nghĩa đen: “tôi sẽ không thêm lần nữa để thấy mặt ngài”; đây là một thành ngữ có nghĩa là “tôi sẽ không bao giờ thấy mặt ngài nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Môi-se nói
  rationale: Động từ kể chuyện với waw nối tiếp được chuyển tự nhiên sang tiếng Việt; không cần dịch máy móc liên từ וַ־ ở đầu câu.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng tên riêng quen dùng trong tiếng Việt.
- source_word: כֵּן דִּבַּרְתָּ
  choice: Đúng như lời ngài đã nói
  rationale: Diễn đạt sự xác nhận của Môi-se đối với lời Pha-ra-ôn, đồng thời giữ sắc thái trang trọng và nghĩa của cả cụm.
- source_word: לֹא אֹסִף עוֹד
  choice: tôi sẽ không bao giờ ... nữa
  rationale: Cụm phủ định với Hiphil của יסף và עוֹד là thành ngữ chỉ một hành động sẽ không tái diễn; cách nói này tự nhiên trong tiếng Việt.
- source_word: רְאוֹת פָּנֶיךָ
  choice: gặp mặt ngài
  rationale: Nghĩa đen là ‘thấy mặt ngài’; trong ngữ cảnh yết kiến và đối diện Pha-ra-ôn, ‘gặp mặt’ truyền đạt tự nhiên ý của thành ngữ mà vẫn giữ hình ảnh ‘mặt’.
