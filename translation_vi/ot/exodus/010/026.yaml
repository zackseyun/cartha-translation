language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: vi
  text: Ngay cả đàn gia súc của chúng tôi cũng sẽ đi cùng; không một móng guốc nào bị bỏ lại[a], vì chúng tôi phải lấy từ đàn ấy để phụng sự Yahweh, Đức Chúa Trời của chúng tôi. Chúng tôi chưa biết phải dùng gì để phụng sự Yahweh cho đến khi đến đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn đạt: “không để lại một con vật nào.” Nguyên văn là “không một móng guốc nào bị bỏ lại,” một cách nói nhấn mạnh rằng không được để lại bất cứ con vật nào.'
    reason: Làm rõ cách nói nhấn mạnh trong nguyên văn, đồng thời giữ hình ảnh cụ thể “móng guốc” trong chính văn.
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: đàn gia súc của chúng tôi
  rationale: מִקְנֶה chỉ chung các vật nuôi thuộc sở hữu; “đàn gia súc” tự nhiên trong tiếng Việt và không thu hẹp thành riêng bò.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: không một móng nào bị để lại
  rationale: Giữ hình ảnh cụ thể “móng” và sắc thái phủ định nhấn mạnh của danh từ số ít sau לֹא.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: vì chúng tôi phải lấy từ đàn ấy
  rationale: Đại từ số ít trong tiếng Hê-bơ-rơ quy chiếu tập hợp về đàn gia súc. “Phải” diễn đạt sự cần thiết theo ngữ cảnh, nhưng không thêm một tân ngữ cụ thể vốn không có trong nguyên văn.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: để phụng sự Yahweh, Đức Chúa Trời của chúng tôi
  rationale: “Phụng sự” giữ được nghĩa rộng của עבד là phục vụ Đức Chúa Trời, đồng thời phù hợp với bối cảnh thờ phượng và tế lễ.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: Chúng tôi chưa biết
  rationale: “Chưa biết” diễn đạt tự nhiên tình trạng hiện tại kéo dài cho đến khi họ tới nơi, như mệnh đề עַד tiếp theo cho thấy.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: phải dùng gì để phụng sự Yahweh
  rationale: 'Hiểu מַה theo nghĩa phương tiện trong ngữ cảnh: họ chưa biết phải dùng những gì trong đàn vật nuôi để phụng sự Yahweh.'
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: cho đến khi đến đó
  rationale: Diễn đạt trực tiếp việc tới địa điểm đã định, tự nhiên và sát nghĩa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Nghĩa của עבד trong bối cảnh tế lễ và thờ phượng
  choice: phụng sự
  alternative: thờ phượng
  rationale: “Phụng sự” bảo toàn nghĩa rộng hơn của động từ và sự lặp lại giữa hai lần xuất hiện; “thờ phượng” đúng theo ngữ cảnh nhưng có thể thu hẹp nghĩa vào hoạt động nghi lễ.
- issue: Cách hiểu מַה trước נַעֲבֹד
  choice: phải dùng gì để phụng sự
  alternative: phải phụng sự như thế nào
  rationale: Bối cảnh về đàn gia súc khiến nghĩa phương tiện cụ thể hợp lý hơn, nhưng chú thích vẫn ghi nhận khả năng hiểu rộng là cách thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phụng sự” nhất quán cho hai lần עבד; giữ danh Yahweh và hình ảnh “móng” của nguyên văn.
