review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các yếu tố trọng yếu của tiếng Hê-bơ-rơ: lời khước từ dứt khoát, giới hạn chỉ dành cho nam giới, động từ ‘phụng sự’, danh Yahweh, và hành động xua đuổi. Tuy nhiên, ‘Bây giờ, chỉ những người đàn ông trong các ngươi được đi’ chuyển mệnh lệnh לְכוּ (‘hãy đi’) thành một cấu trúc cho phép (‘được đi’) và thêm ‘trong các ngươi’ không cần thiết. Cụm cuối ‘khỏi nơi ông hiện diện’ cũng không tự nhiên và đại từ ‘ông’ có thể gây lửng chủ quy chiếu.'
  naturalness: Cần chỉnh nhẹ để tiếng Việt hiện đại, trang trọng mà vẫn tự nhiên hơn. ‘Không phải thế!’ là lời bác bỏ trực tiếp, tự nhiên và tương ứng tốt với לֹא כֵן. ‘Hãy để những người đàn ông đi’ diễn đạt rõ đề nghị giới hạn của Pha-ra-ôn; ‘xua họ ra khỏi trước mặt Pha-ra-ôn’ giữ thành ngữ cung đình của nguyên văn mà không gượng.
  terminology: Giữ ‘Yahweh’ theo quyết định dự án. ‘Phụng sự’ phù hợp với עבד trong ngữ cảnh này và không thu hẹp nghĩa thành nghi lễ thờ phượng. ‘Những người đàn ông’ bảo toàn giới tính được nêu trong הַגְּבָרִים. Dùng dạng tên Việt hóa ‘Pha-ra-ôn’ nhất quán với văn phong Kinh Thánh tiếng Việt.
  issues:
  - severity: medium
    issue: ‘... những người đàn ông ... được đi’ làm yếu sắc thái mệnh lệnh của לְכוּ.
    rationale: 'לְכוּ là mệnh lệnh số nhiều, hướng đến nhóm nam giới: ‘hãy đi’. Cấu trúc ‘được đi’ chủ yếu diễn tả sự cho phép và không trực tiếp phản ánh hình thức mệnh lệnh.'
  - severity: low
    issue: ‘trong các ngươi’ là phần thêm không cần thiết.
    rationale: Ngữ cảnh quả thật phân biệt đàn ông với những người khác trong dân, nhưng bản thân הַגְּבָרִים chỉ là ‘những người đàn ông’; không cần thêm cụm này để dịch chính văn.
  - severity: medium
    issue: ‘khỏi nơi ông hiện diện’ không tự nhiên và có đại từ quy chiếu mơ hồ.
    rationale: מֵאֵת פְּנֵי פַרְעֹה nghĩa đen là ‘khỏi/trước mặt Pha-ra-ôn’, một thành ngữ chỉ việc bị đuổi ra khỏi sự hiện diện của vua. Nêu lại tên riêng rõ hơn và tự nhiên hơn.
  revised_text: “Không phải thế![a] Hãy để những người đàn ông[b] đi phụng sự Yahweh, vì đó là điều các ngươi đang yêu cầu.” Rồi Pha-ra-ôn xua họ ra khỏi trước mặt mình.
  revised_footnotes:
