  text: לֹ֣א כֵ֗ן לְכֽוּ נָ֤א הַ/גְּבָרִים֙ וְ/עִבְד֣וּ אֶת יְהוָ֔ה כִּ֥י אֹתָ֖/הּ אַתֶּ֣ם מְבַקְשִׁ֑ים וַ/יְגָ֣רֶשׁ אֹתָ֔/ם מֵ/אֵ֖ת פְּנֵ֥י פַרְעֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: vi
  text: “Không phải thế![a] Hãy để những người đàn ông[b] đi phụng sự Yahweh, vì đó là điều các ngươi đang yêu cầu.” Rồi Pha-ra-ôn xua họ ra khỏi trước mặt mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Không!” Bản dịch sát hình thức hơn: “Không phải thế!”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “những người đàn ông,” tức là nam giới, không phải toàn thể dân chúng.'
    reason: lexical_clarification
lexical_decisions:
- source_word: לֹא כֵן
  choice: Không được như vậy!
  rationale: Diễn đạt lời bác bỏ đột ngột và dứt khoát của Pharaoh, đồng thời giữ gần cấu trúc Hê-bơ-rơ hơn cách chỉ nói “Không!”.
- source_word: לְכוּ נָא
  choice: Bây giờ ... được đi
  rationale: נָא ở đây hợp với sắc thái thúc giục và cho phép miễn cưỡng hơn là lời nhã nhặn “xin hãy”; tiếng Việt tự nhiên cần diễn đạt cùng với giới hạn mà Pharaoh áp đặt.
- source_word: הַגְּבָרִים
  choice: chỉ những người đàn ông trong các ngươi
  rationale: Danh từ chỉ nam giới, không phải toàn dân. Từ “chỉ” làm rõ giới hạn hàm chứa trong sự nhượng bộ của Pharaoh theo văn cảnh, còn chú thích bảo toàn thông tin từ vựng chính xác.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: và phụng sự Yahweh
  rationale: עבד khi có Đức Chúa Trời làm đối tượng bao gồm ý phục vụ và thờ phượng; “phụng sự” giữ được bề rộng nghĩa này trong văn phong trang trọng, tự nhiên.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được ghi trực tiếp trong bản Hê-bơ-rơ, thay vì thay bằng một tước hiệu.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: vì đó là điều các ngươi đang yêu cầu
  rationale: Đại từ giống cái số ít có một tiền ngữ được hiểu ngầm, có lẽ là việc đi phụng sự; “đó là điều” giữ tiền ngữ không xác định rõ mà vẫn tự nhiên trong tiếng Việt.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: Rồi Pharaoh đuổi họ
  rationale: Động từ số ít không nêu lại chủ ngữ; theo mạch kể, Pharaoh là chủ thể tự nhiên nhất. “Đuổi” bảo toàn tính cưỡng bức của hành động.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: khỏi nơi ông hiện diện
  rationale: Chuyển ngữ tự nhiên thành ngữ Hê-bơ-rơ nghĩa là bị đưa ra khỏi sự hiện diện của Pharaoh, tránh cách dịch cứng “khỏi trước mặt Pharaoh”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה. Giữ “Yahweh” phân biệt danh giao ước với tước hiệu và không thêm một truyền thống hệ phái vào văn bản.
- issue: Giới hạn về giới tính trong đề nghị của Pharaoh
  choice: chỉ những người đàn ông trong các ngươi
  alternative: các ngươi / dân chúng
  rationale: 'הַגְּבָרִים chỉ nam giới. Giữ giới hạn này là cần thiết cho diễn biến câu chuyện: Pharaoh chỉ nhượng bộ một phần chứ không cho toàn thể dân đi.'
- issue: Phạm vi nghĩa của עבד đối với Yahweh
  choice: phụng sự
  alternative: thờ phượng
  rationale: “Phụng sự” giữ được cả ý phục vụ lẫn thờ phượng, không thu hẹp động từ vào nghi lễ mà nguyên văn không buộc phải xác định.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải. “Các ngươi” phản ánh lời Pharaoh nói với Moses và Aaron trong thế đối đầu quyền lực; “phụng sự” giữ sắc thái tôn giáo mà vẫn dễ hiểu. Hai dấu chú thích [a], [b] đều được đặt ngay tại từ ngữ liên quan trong chính văn.
