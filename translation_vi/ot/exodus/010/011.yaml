revisions:
- from: “Không được như vậy![a] Bây giờ, chỉ những người đàn ông[b] trong các ngươi được đi và phụng sự Yahweh, vì đó là điều các ngươi đang yêu cầu.” Rồi Pharaoh đuổi họ khỏi nơi ông hiện diện.
  to: “Không phải thế![a] Hãy để những người đàn ông[b] đi phụng sự Yahweh, vì đó là điều các ngươi đang yêu cầu.” Rồi Pha-ra-ôn xua họ ra khỏi trước mặt mình.
  rationale: Bản sửa bảo toàn lời bác bỏ đột ngột của Pha-ra-ôn, chuyển lại sắc thái mệnh lệnh của động từ ‘hãy đi’ bằng cấu trúc Việt ngữ tự nhiên ‘hãy để ... đi’, và làm rõ thành ngữ ‘khỏi trước mặt Pha-ra-ôn’. Không xác định quá mức tiền ngữ của ‘đó’ và vẫn giữ sự giới hạn nam giới vốn quan trọng trong ngữ cảnh.
  reviewer_model: gpt-5.6-terra
