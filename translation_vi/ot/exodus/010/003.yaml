source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: vi
  text: 'Môi-se và A-rôn đến gặp Pha-ra-ôn và nói với vua: “Yahweh, Đức Chúa Trời của người Hê-bơ-rơ, phán thế này: ‘Ngươi còn khước từ hạ mình[a] trước mặt Ta cho đến bao giờ? Hãy để dân Ta đi, để họ phụng sự[b] Ta.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “chịu khuất phục trước Ta.” Động từ Hê-bơ-rơ có thể chỉ việc bị hạ xuống hoặc tự hạ mình trước Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “thờ phượng.” Động từ Hê-bơ-rơ chỉ sự phục vụ, trong đó có việc phụng thờ theo nghi lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל־פַּרְעֹה
  choice: đến gặp Pha-ra-ôn
  rationale: Trong ngữ cảnh triều kiến, בוא với אֶל chỉ việc đến trước một người; “đến gặp” tự nhiên trong tiếng Việt và không thêm ý rằng họ bước vào một địa điểm cụ thể.
- source_word: כֹּה אָמַר
  choice: phán thế này
  rationale: Giữ công thức sứ giả giới thiệu lời trực tiếp của Đức Chúa Trời, đồng thời diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Đức Chúa Trời của người Hê-bơ-rơ
  rationale: Giữ nguyên quan hệ sở thuộc và tên gọi dân tộc trong bối cảnh Ai Cập.
- source_word: עַד־מָתַי מֵאַנְתָּ
  choice: Ngươi còn khước từ ... cho đến bao giờ?
  rationale: Diễn đạt sắc thái quở trách về sự khước từ đã kéo dài và vẫn tiếp diễn.
- source_word: לֵעָנֹת מִפָּנָי
  choice: hạ mình trước mặt Ta
  rationale: “Hạ mình” giữ được ý thế bị hạ xuống hoặc tự hạ mình trước Đức Chúa Trời; “trước mặt Ta” chuyển tải thành ngữ chỉ vị thế trước sự hiện diện và thẩm quyền của Ngài.
- source_word: שַׁלַּח עַמִּי
  choice: Hãy để dân Ta đi
  rationale: Cách diễn đạt tự nhiên, chính xác cho mệnh lệnh đòi Pha-ra-ôn phóng thích dân thuộc về Yahweh.
- source_word: וְיַעַבְדֻנִי
  choice: để họ phụng sự Ta
  rationale: “Phụng sự” giữ ý phục vụ và vẫn bao hàm việc thờ phượng trong bối cảnh nghi lễ, thay vì thu hẹp động từ chỉ còn một hành vi tôn giáo.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng của Đức Chúa Trời; giữ “Yahweh” bảo toàn đặc tính danh xưng thay vì thay bằng tước hiệu.
- issue: Sắc thái của לֵעָנֹת
  choice: hạ mình
  alternative: khuất phục / chịu hạ xuống
  rationale: Dạng Niphal cho phép sắc thái bị hạ xuống hoặc tự hạ mình. Bản chính dùng cách nói tự nhiên theo ngữ cảnh lời quở trách, còn chú thích giữ khả năng hiểu gần với sự khuất phục.
- issue: Phạm vi nghĩa của עבד
  choice: phụng sự
  alternative: thờ phượng
  rationale: Động từ bao gồm sự phục vụ, và trong ngữ cảnh Xuất Hành còn có sắc thái phụng thờ. “Phụng sự” bảo toàn phạm vi rộng hơn; chú thích nêu cách dịch hẹp hơn theo nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua” để tránh lặp đại từ sau danh hiệu Pha-ra-ôn; trong lời thần phán dùng “Ngươi/Ta” nhằm thể hiện lời trực tiếp trang nghiêm và tương quan quyền uy. Dấu ngoặc kép và ngoặc đơn phân biệt lời người thuật với thông điệp được trích dẫn.
