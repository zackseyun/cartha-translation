source:
  edition: WLC
  text: וְ/כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/לֹ֥א יוּכַ֖ל לִ/רְאֹ֣ת אֶת הָ/אָ֑רֶץ וְ/אָכַ֣ל אֶת יֶ֣תֶר הַ/פְּלֵטָ֗ה הַ/נִּשְׁאֶ֤רֶת לָ/כֶם֙ מִן הַ/בָּרָ֔ד וְ/אָכַל֙ אֶת כָּל הָ/עֵ֔ץ הַ/צֹּמֵ֥חַ לָ/כֶ֖ם מִן הַ/שָּׂדֶֽה־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: vi
  text: Nó sẽ phủ kín mặt đất[a], đến nỗi người ta không thể nhìn thấy mặt đất; nó sẽ ăn phần còn sót lại đã thoát khỏi mưa đá, là phần còn lại cho các ngươi sau trận mưa đá[b], và sẽ ăn mọi cây cối mọc cho các ngươi từ đồng ruộng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “con mắt của đất,” một thành ngữ Hê-bơ-rơ chỉ bề mặt có thể nhìn thấy của đất.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phần dư đã thoát nạn, còn lại cho các ngươi sau trận mưa đá.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: Nó sẽ phủ kín
  rationale: Động từ כסה có nghĩa là che phủ, che khuất. Thì tương lai phù hợp với lời báo trước về nạn châu chấu; đại từ số ít chỉ bầy châu chấu như một tập thể.
- source_word: עֵין הָאָרֶץ
  choice: mặt đất
  rationale: Cụm từ có nghĩa đen là “con mắt của đất,” nhưng là thành ngữ chỉ bề mặt có thể nhìn thấy của đất. “Mặt đất” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת־הָאָרֶץ
  choice: đến nỗi người ta không thể nhìn thấy đất
  rationale: Giữ cấu trúc chủ thể phiếm chỉ số ít của tiếng Hê-bơ-rơ bằng “người ta,” đồng thời diễn đạt hệ quả của việc châu chấu phủ kín mặt đất.
- source_word: וְאָכַל
  choice: Nó sẽ ăn hết
  rationale: אכל là động từ thông thường nghĩa là “ăn.” “Ăn hết” thể hiện tự nhiên sức tàn phá trong ngữ cảnh mà không chuyển sang từ trừu tượng hơn như “tiêu diệt.”
- source_word: יֶתֶר הַפְּלֵטָה
  choice: phần còn sót lại đã thoát khỏi
  rationale: Cụm từ chỉ phần dư còn tồn tại sau tai họa. Cách dịch này tránh gọi cây cối hoặc hoa màu là “những người sống sót,” vốn thiếu tự nhiên trong tiếng Việt, nhưng vẫn giữ cả hai ý “phần còn lại” và “thoát khỏi.”
- source_word: הַנִּשְׁאֶרֶת לָכֶם מִן־הַבָּרָד
  choice: đã thoát khỏi trận mưa đá và vẫn còn cho các ngươi
  rationale: Diễn đạt rõ rằng đây là phần hoa màu còn lại cho người Ai Cập sau trận mưa đá, đồng thời giữ quan hệ bổ nghĩa của phân từ giống cái với הַפְּלֵטָה.
- source_word: כָּל־הָעֵץ
  choice: mọi cây cối
  rationale: עץ có thể được dùng theo nghĩa tập thể. “Mọi cây cối” truyền đạt lực phân bố của כָּל và tự nhiên hơn “mỗi cây” trong câu này.
- source_word: הַצֹּמֵחַ לָכֶם מִן־הַשָּׂדֶה
  choice: mọc lên cho các ngươi ngoài đồng
  rationale: צמח mang nghĩa mọc, nảy lên; לָכֶם giữ ý cây cối thuộc về hoặc đem lợi ích cho người nghe. Trong tiếng Việt, “ngoài đồng” diễn đạt địa điểm cây mọc tự nhiên hơn cách dịch máy móc “từ đồng.”
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phù hợp với lời Môi-se trực tiếp nói với Pha-ra-ôn và quần thần trong bối cảnh cổ đại; dùng đại từ số ít “nó” cho bầy châu chấu được nhìn như một tập thể.
