revisions:
- from: 'Bấy giờ, Pha-ra-ôn vội sai gọi Môi-se và A-rôn đến rồi nói: “Ta đã phạm tội với Yahweh, Đức Chúa Trời của các ngươi, và với các ngươi.”'
  to: 'Bấy giờ, Pha-ra-ôn vội cho gọi Môi-se và A-rôn, rồi nói: “Ta đã phạm tội chống lại Yahweh, Đức Chúa Trời của các ngươi, và chống lại các ngươi.”'
  rationale: Sửa tối thiểu hai chỗ để tránh thêm ý “sai” và để diễn đạt minh bạch quan hệ “phạm tội chống lại” vốn được hàm nghĩa bởi cấu trúc Hê-bơ-rơ. Danh riêng, số nhiều của “các ngươi”, và giọng văn lời nói của Pha-ra-ôn được giữ nguyên.
