source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: vi
  text: 'Bấy giờ, Pha-ra-ôn vội cho gọi Môi-se và A-rôn, rồi nói: “Ta đã phạm tội chống lại Yahweh, Đức Chúa Trời của các ngươi, và chống lại các ngươi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: vội
  rationale: Diễn đạt tự nhiên sắc thái hành động khẩn trương của động từ מהר.
- source_word: לִקְרֹא
  choice: sai gọi ... đến
  rationale: Trong ngữ cảnh hoàng gia, cụm này chỉ việc Pha-ra-ôn cho gọi Môi-se và A-rôn đến gặp mình; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm quen thuộc trong tiếng Việt đối với tước hiệu hoàng gia Ai Cập.
- source_word: לְמֹשֶׁה וּלְאַהֲרֹן
  choice: Môi-se và A-rôn
  rationale: Dùng các dạng tên riêng quen thuộc với độc giả Kinh Thánh tiếng Việt.
- source_word: וַיֹּאמֶר
  choice: rồi nói
  rationale: Nối tiếp tự nhiên chuỗi hành động trong văn kể chuyện Hê-bơ-rơ.
- source_word: חָטָאתִי
  choice: Ta đã phạm tội
  rationale: Giữ nguyên sức nặng luân lý và thần học của חטא, đồng thời dùng đại từ phù hợp với lời nói của nhà vua.
- source_word: לַיהוָה
  choice: với Yahweh
  rationale: Sau 'phạm tội', tiếng Việt có thể dùng 'với' để chỉ đấng hoặc người bị xúc phạm, đồng thời tránh cấu trúc nặng nề.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước được bản Hê-bơ-rơ dùng tại đây.
- source_word: אֱלֹהֵיכֶם
  choice: Đức Chúa Trời của các ngươi
  rationale: 'Phản ánh rõ hậu tố ngôi thứ hai số nhiều: Pha-ra-ôn gọi Yahweh là Đức Chúa Trời của Môi-se và A-rôn, không nhận là Đức Chúa Trời của mình.'
- source_word: וְלָכֶם
  choice: và với các ngươi
  rationale: Giữ cấu trúc song song với 'với Yahweh'; đại từ số nhiều chỉ Môi-se và A-rôn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn nêu trực tiếp danh riêng יהוה; giữ 'Yahweh' phân biệt danh giao ước với tước hiệu và không nhập cách gọi riêng của một truyền thống.
- issue: Lời thú tội của Pha-ra-ôn
  choice: Ta đã phạm tội với Yahweh, Đức Chúa Trời của các ngươi, và với các ngươi
  alternative: Ta đã phạm tội nghịch cùng Yahweh, Đức Chúa Trời của các ngươi, và nghịch cùng các ngươi
  rationale: Giữ đối tượng kép của hành vi phạm tội và hậu tố số nhiều trong nguyên văn; 'với' là cách diễn đạt hiện đại, tự nhiên, còn 'nghịch cùng' trang trọng nhưng cổ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các ngươi” để phản ánh địa vị của Pha-ra-ôn và lời ông nói với hai người, nhưng tránh các cấu trúc quá cổ như “bèn”, “nghịch cùng”. Không cần chú thích cho câu này.
