  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: vi
  text: 'Pha-ra-ôn nói với ông: “Hãy đi khỏi ta! Hãy coi chừng! Đừng thấy mặt ta nữa, vì vào ngày ngươi thấy mặt ta, ngươi sẽ chết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: Pha-ra-ôn nói với ông
  rationale: Động từ kể chuyện tiếp nối mạch văn; tiếng Việt không cần dịch liên từ וַ bằng “rồi” trong câu này. Đại từ “ông” chỉ Môi-se theo văn cảnh.
- source_word: לֵךְ מֵעָלָי
  choice: Hãy đi khỏi ta!
  rationale: Diễn đạt tự nhiên mệnh lệnh xua đuổi, đồng thời giữ động từ “đi” và ý tách khỏi người nói.
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy coi chừng!
  rationale: Mệnh lệnh Niphal kèm đại từ hướng về chính người nghe tạo lời cảnh cáo trực tiếp và đầy đe dọa.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: Đừng gặp mặt ta nữa
  rationale: Cấu trúc יסף + động từ nguyên mẫu mang nghĩa không làm việc ấy thêm/lần nữa. “Gặp mặt ta” tự nhiên trong tiếng Việt và vẫn giữ hình ảnh “mặt” của nguyên văn.
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: vì ngày nào ngươi gặp mặt ta
  rationale: Giữ cách diễn đạt bằng “ngày” và sắc thái điều kiện-thời gian của lời đe dọa; tránh hiểu cứng nhắc rằng đây nhất thiết là một ngày đã định trước.
- source_word: תָּמוּת
  choice: ngươi sẽ chết
  rationale: Dịch rõ lời đe dọa về hậu quả tương lai; “ngươi” phù hợp lối xưng hô trịch thượng của Pha-ra-ôn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp đại từ “ta–ngươi” thể hiện địa vị và giọng đe dọa của Pha-ra-ôn mà không dùng lối quá cổ. Giữ sự lặp ý “mặt ta” trong cả hai vế qua cụm “gặp mặt ta”.
