  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: vi
  text: 'Ông nói với họ[a]: “Nguyện Yahweh quả thật ở cùng các ngươi, nếu ta thật sự để các ngươi và con trẻ các ngươi đi! Hãy coi chừng[b], vì điều dữ ở trước mặt các ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Yahweh ở cùng các ngươi khi ta để các ngươi và con trẻ các ngươi đi”; lời này có lẽ mang tính mỉa mai.'
    reason: alternative_reading
  - marker: b
    text: Tiếng Hê-bơ-rơ có thể hiểu là “tai họa đang chờ các ngươi” hoặc “các ngươi đang có ý đồ xấu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: Nguyện Yahweh ở cùng các ngươi như thế
  rationale: Giữ lực cầu khiến của יְהִי và sắc thái mỉa mai do כֵן cùng ngữ cảnh tạo nên, nhưng không giải thích sự mỉa mai ngay trong chính văn.
- source_word: כַּאֲשֶׁר
  choice: nếu ... thật sự
  rationale: Trong lời nói đối nghịch của Pha-ra-ôn, cụm này mang sắc thái điều kiện và chế giễu hơn là chỉ thời gian trung tính; cách dịch vẫn để chú thích ghi nhận khả năng hiểu là “khi”.
- source_word: אֲשַׁלַּח אֶתְכֶם וְאֶת טַפְּכֶם
  choice: ta ... để các ngươi cùng con trẻ đi
  rationale: שׁלח trong mạch Xuất Ai Cập mang nghĩa cho phép ra đi; טַף chỉ các trẻ nhỏ, được diễn đạt tự nhiên là “con trẻ”.
- source_word: רְאוּ
  choice: Hãy coi chừng
  rationale: Mệnh lệnh của ראה ở đây có chức năng cảnh báo; “hãy coi chừng” tự nhiên trong tiếng Việt và phù hợp giọng đe dọa.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: vì điều dữ đang ở trước mặt các ngươi
  rationale: Bám sát cấu trúc Hê-bơ-rơ và giữ sự mơ hồ giữa điều dữ/tai họa đang chờ phía trước với ý đồ xấu mà họ đang nhắm tới.
theological_decisions:
- issue: Cách phiên âm danh Yahweh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va / CHÚA
  rationale: Dùng danh riêng Yahweh để phản ánh trực tiếp danh giao ước trong nguyên văn, không thay bằng tước hiệu.
- issue: Sự mơ hồ trong lời cảnh báo cuối câu
  choice: điều dữ đang ở trước mặt các ngươi
  alternative: tai họa đang chờ các ngươi / các ngươi đang có ý đồ xấu
  rationale: Nguyên văn cho phép cả nghĩa nguy hiểm ở phía trước lẫn ác ý trước mắt hoặc trong dự tính; chính văn không chọn dứt khoát một hướng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/các ngươi” thể hiện lời của Pha-ra-ôn với những người dưới quyền và duy trì giọng đối đầu. “Con trẻ” vừa tự nhiên vừa giữ nghĩa trẻ nhỏ của טַף.
