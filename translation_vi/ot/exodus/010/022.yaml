  - severity: low
    issue: “Bao trùm” diễn giải thêm hành động của bóng tối.
    rationale: Câu Hê-bơ-rơ nói đơn giản rằng “có/đã có bóng tối ... trong khắp đất Ai Cập.” “Phủ khắp” là hình ảnh có thể hiểu được, nhưng “có ... khắp” sát cấu trúc nguồn hơn và không thêm động tác.
  - severity: low
    issue: Chú thích a dùng “thiên đàng” như một phương án trực tiếp cho שָׁמַיִם.
    rationale: Trong ngữ cảnh này, “trời” hoặc “các tầng trời/cõi trời” bảo toàn khả năng từ vựng mà không định hướng độc giả đến cách hiểu thần học đặc thù của “thiên đàng.”
