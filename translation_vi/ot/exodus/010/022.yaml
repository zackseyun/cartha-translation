  source_fidelity: 'Bản thảo truyền đạt đúng nội dung chính: hành động của Môi-se, bóng tối cực độ, phạm vi khắp Ai Cập và thời lượng ba ngày. Tuy nhiên, “giơ tay” thiên về nâng tay lên, trong khi נָטָה ở đây nhấn mạnh động tác vươn/duỗi tay; “bao trùm” cũng thêm một hành động không được phát biểu trực tiếp trong câu Hê-bơ-rơ.'
  naturalness: Văn câu tự nhiên, rõ ràng và phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. “Vươn tay” và “trong ba ngày” vừa tự nhiên vừa sát nghĩa hơn trong bản sửa.
  terminology: “Môi-se,” “Ai Cập,” và “bóng tối” đều nhất quán, phù hợp. Chú thích về שָׁמַיִם nên dùng “cõi trời/các tầng trời” thay vì “thiên đàng,” vì “thiên đàng” trong tiếng Việt hiện đại có thể gợi một khái niệm thần học cụ thể hơn điều từ Hê-bơ-rơ buộc phải nói.
