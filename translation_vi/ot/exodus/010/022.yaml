  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: vi
  text: Môi-se vươn tay về phía trời[a], và có bóng tối dày đặc[b] khắp đất Ai Cập trong ba ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “về phía các tầng trời” hoặc “về phía cõi trời”. Từ Hê-bơ-rơ שָׁמַיִם có thể chỉ bầu trời hoặc cõi trời/các tầng trời, tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bóng tối sâu thẳm”. Cụm Hê-bơ-rơ kết hợp từ “bóng tối” với một từ khác chỉ sự âm u hoặc tối tăm dữ dội để nhấn mạnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: giơ
  rationale: Trong ngữ cảnh cử chỉ này, נטה chỉ hành động đưa hoặc vươn tay ra; “giơ tay” là cách nói tự nhiên trong tiếng Việt khi tay hướng lên trời.
- source_word: יָדוֹ
  choice: tay mình
  rationale: יָד có nghĩa thông thường là “tay”; đại từ sở hữu ngôi thứ ba được diễn đạt tự nhiên qua chủ thể Môi-se.
- source_word: עַל הַשָּׁמָיִם
  choice: về phía trời
  rationale: Với động tác giơ tay, עַל có thể biểu thị hướng; שָׁמַיִם trong ngữ cảnh tai họa này phù hợp với “trời”, nhưng vẫn có thể được hiểu là “thiên đàng/các tầng trời” nên giữ chú thích.
- source_word: וַיְהִי
  choice: thì ... bao trùm
  rationale: Cấu trúc diễn tả trạng thái xảy đến sau hành động của Môi-se; “thì” truyền đạt rõ quan hệ tiếp diễn/kết quả trong tiếng Việt mà không khẳng định quá mức quan hệ nhân quả.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: bóng tối dày đặc
  rationale: Hai danh từ đặt cạnh nhau có tác dụng nhấn mạnh mức độ tối tăm; “bóng tối dày đặc” vừa tự nhiên vừa giữ được cường độ của cụm Hê-bơ-rơ.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: bao trùm khắp đất Ai Cập
  rationale: בְּכָל diễn tả phạm vi toàn cõi; “khắp đất Ai Cập” là cách diễn đạt rõ ràng, còn “bao trùm” phù hợp tự nhiên với hình ảnh bóng tối hiện diện trên toàn vùng.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: suốt ba ngày
  rationale: “Suốt” diễn đạt tự nhiên khoảng thời gian kéo dài ba ngày trong tiếng Việt.
