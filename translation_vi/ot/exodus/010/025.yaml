  rationale: 'Chỉ điều chỉnh hai điểm: thay “giao” bằng “trao” cho tự nhiên hơn, và thay liên từ chỉ mục đích “để” bằng “và chúng tôi sẽ” để phản ánh đúng mệnh đề phối hợp ở nguyên văn. Thuật ngữ tế lễ, cách gọi nhân vật, danh Yahweh và chú thích giữ nguyên.'
