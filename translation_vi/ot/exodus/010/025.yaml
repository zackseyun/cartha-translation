id: EXO.10.25
reference: Exodus 10:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: vi
  text: 'Nhưng Môi-se nói: “Chính ông cũng phải trao vào tay chúng tôi các sinh tế và lễ thiêu, và chúng tôi sẽ dâng lên Yahweh[a], Đức Chúa Trời của chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Danh Hê-bơ-rơ יהוה (YHWH), danh riêng của Đức Chúa Trời, được chuyển tự tại đây là “Yahweh”.
    reason: Giúp độc giả nhận biết rằng nguyên văn dùng danh riêng của Đức Chúa Trời, chứ không chỉ dùng tước hiệu “Chúa”.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Nhưng Môi-se nói
  rationale: Liên từ kể chuyện tiếp nối mạch văn, đồng thời lời Môi-se đối lập với hạn chế Pha-ra-ôn vừa đặt ra, nên “Nhưng” diễn đạt đúng quan hệ trong ngữ cảnh.
- source_word: גַּם אַתָּה
  choice: Chính ông cũng
  rationale: “Cũng” giữ sắc thái bổ sung của גַּם, còn “chính ông” thể hiện sự nhấn mạnh của đại từ độc lập אַתָּה mà vẫn tự nhiên trong tiếng Việt.
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: phải giao vào tay chúng tôi
  rationale: נתן có nghĩa là trao hoặc giao; cấu trúc “vào tay chúng tôi” giữ hình ảnh cụ thể của nguyên văn. “Phải” truyền đạt sức mạnh yêu cầu trong lời Môi-se.
- source_word: זְבָחִים
  choice: các sinh tế
  rationale: Từ này chỉ những lễ hi sinh, thường gắn với việc giết con vật. “Sinh tế” là cách gọi ngắn gọn, phân biệt được với lễ thiêu đi ngay sau.
- source_word: וְעֹלֹת
  choice: và lễ thiêu
  rationale: עֹלָה là lễ vật được thiêu trọn trên bàn thờ; “lễ thiêu” là cách diễn đạt rõ và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: וְעָשִׂינוּ
  choice: để chúng tôi dâng lên
  rationale: Động từ עשה có nghĩa đen là “làm”, nhưng trong văn cảnh tế lễ mang nghĩa thực hiện hoặc dâng lễ. Cấu trúc “để” diễn đạt tự nhiên mục đích của việc nhận các lễ vật.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: lên Yahweh, Đức Chúa Trời của chúng tôi
  rationale: Giới từ ל־ đánh dấu Đấng tiếp nhận lễ dâng. Danh riêng giao ước יהוה được chuyển tự là “Yahweh”, còn אֱלֹהֵינוּ được dịch trực tiếp.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh riêng יהוה. Chuyển tự “Yahweh” bảo tồn danh này mà không thay bằng một tước hiệu hay áp đặt cách đọc “Giê-hô-va” có niên đại muộn hơn.
- issue: Mức độ bắt buộc trong תִּתֵּן
  choice: phải giao
  alternative: sẽ giao; hãy giao
  rationale: Hình thái động từ tự nó có thể được đọc như vị lai hoặc mệnh lệnh theo ngữ cảnh. Ở đây Môi-se kiên quyết nêu điều Pha-ra-ôn cần làm; “phải” truyền đạt lực ngôn trung ấy mà không biến câu thành mệnh lệnh trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” không thêm tước hiệu vắng mặt trong nguyên văn; cụm “chính ông cũng” giữ sự nhấn mạnh đối với Pha-ra-ôn. Thuật ngữ “sinh tế” và “lễ thiêu” bảo tồn hai loại lễ riêng biệt trong câu.
