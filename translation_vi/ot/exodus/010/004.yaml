translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta–ngươi” giữ sắc thái của lời Đức Chúa Trời phán trực tiếp với Pha-ra-ôn. Cụm “thì này” hơi trang trọng nhưng truyền đạt được chức năng nhấn mạnh của הִנְנִי.
