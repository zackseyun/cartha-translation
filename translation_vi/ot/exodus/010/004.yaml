base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: vi
  text: Vì nếu ngươi không chịu để dân ta đi, thì này, ngày mai ta sẽ đem châu chấu[a] vào lãnh thổ của ngươi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ אַרְבֶּה có hình thức số ít nhưng được dùng với nghĩa tập hợp, chỉ châu chấu như một đoàn đông đảo.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong biên giới của ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Vì nếu
  rationale: Giữ cả sắc thái nối kết, giải thích của כִּי và ý điều kiện của אִם trong lời cảnh báo tiếp theo.
- source_word: מָאֵן
  choice: không chịu
  rationale: Diễn tả sự cố ý khước từ và ngoan cố, tự nhiên hơn trong tiếng Việt hiện đại so với cách dịch thuần hình thức.
- source_word: לְשַׁלֵּחַ
  choice: để ... đi
  rationale: Trong văn cảnh Xuất Hành, đây là cách diễn đạt tự nhiên cho việc cho phép dân Y-sơ-ra-ên rời đi.
- source_word: עַמִּי
  choice: dân ta
  rationale: Giữ nguyên quan hệ sở hữu và sắc thái giao ước, đồng thời phù hợp với lời phán trực tiếp trang trọng.
- source_word: הִנְנִי
  choice: thì này
  rationale: Giữ dấu hiệu nhấn mạnh và tính cấp bách trang trọng của lời cảnh báo; từ “thì” cũng nối tự nhiên với mệnh đề điều kiện.
- source_word: מֵבִיא
  choice: ta sẽ đem
  rationale: Phân từ đi với הִנְנִי biểu thị hành động sắp xảy ra; thì tương lai kết hợp với “ngày mai” truyền đạt rõ ý này.
- source_word: מָחָר
  choice: ngày mai
  rationale: Tương ứng trực tiếp với trạng từ thời gian trong tiếng Hê-bơ-rơ.
- source_word: אַרְבֶּה
  choice: châu chấu
  rationale: Danh từ có hình thức số ít nhưng được dùng theo nghĩa tập hợp; “châu chấu” trong tiếng Việt cũng có thể chỉ cả loài hay một số lượng lớn theo ngữ cảnh.
- source_word: בִּגְבֻלֶךָ
  choice: vào lãnh thổ của ngươi
  rationale: גְּבוּל có thể chỉ ranh giới hoặc vùng đất nằm trong ranh giới; “vào lãnh thổ” phù hợp với hướng chuyển động hàm chứa trong động từ “đem” mà không giản lược thành “đất”.
