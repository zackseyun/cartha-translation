    issue: Chú thích b diễn đạt phương án thay thế chưa tự nhiên và chưa rõ nghĩa.
    rationale: Cụm “vào trong các ranh giới của ngươi” có thể gợi nghĩa đi vào các đường biên. Ý của phương án thay thế là “trong/phạm vi lãnh thổ ngươi” hoặc “trong biên giới ngươi.”
