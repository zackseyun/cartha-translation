  text: וַ/יֵּצֵ֖א מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: vi
  text: Rồi Môi-se rời khỏi Pha-ra-ôn và khẩn cầu Đức Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tha thiết cầu nguyện với Đức Yahweh” hoặc “nài xin Đức Yahweh.” Động từ Hê-bơ-rơ diễn tả lời cầu xin tha thiết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: rời khỏi
  rationale: Động từ יצא ở dạng trần thuật nối tiếp diễn tả việc đi ra/rời đi; “rời khỏi” tự nhiên trong tiếng Việt và giữ trình tự câu chuyện.
- source_word: מֵעִם פַּרְעֹה
  choice: khỏi Pha-ra-ôn
  rationale: מֵעִם diễn tả sự tách khỏi chỗ đang ở cùng một người; trong ngữ cảnh, cách nói này hàm ý rời khỏi sự hiện diện của Pha-ra-ôn.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm danh hiệu hoàng gia quen thuộc trong tiếng Việt.
- source_word: וַיֶּעְתַּר
  choice: khẩn cầu
  rationale: Động từ עתר diễn tả lời cầu xin tha thiết, thường hướng về Đức Chúa Trời; “khẩn cầu” vừa trang trọng vừa truyền đạt sắc thái tha thiết.
- source_word: אֶל
  choice: Đức Giê-hô-va
  rationale: Giới từ אֶל chỉ hướng của lời khẩn cầu; tiếng Việt diễn đạt tự nhiên bằng động từ “khẩn cầu” đi thẳng với đối tượng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng thần thánh đã quen thuộc trong tiếng Việt, thay vì thay thế bằng một tước hiệu; yếu tố “Đức” giữ sắc thái tôn kính tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. “Đức Giê-hô-va” bảo tồn danh riêng theo cách gọi quen thuộc với độc giả Việt, không biến nó thành tước hiệu.
- issue: Sắc thái của עתר
  choice: khẩn cầu
  alternative: cầu nguyện tha thiết; nài xin
  rationale: “Khẩn cầu” giữ được cả ý cầu nguyện hướng về Đức Chúa Trời lẫn mức độ tha thiết, không giải thích thêm nội dung lời cầu xin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chủ ngữ “Môi-se” được nêu rõ từ ngữ cảnh thay cho đại từ dễ mơ hồ trong tiếng Việt. Câu giữ nhịp kể chuyện ngắn gọn của nguyên văn.
