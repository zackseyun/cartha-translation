  - severity: low
    issue: “có thể” thêm sắc thái khả năng vào mệnh đề mục đích.
    rationale: 'לְמַעַן + thể chưa hoàn thành ở đây diễn tả mục đích: “để ngươi kể”. Tiếng Việt không cần thêm “có thể” để diễn tả chức năng này.'
