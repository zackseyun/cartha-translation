  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: vi
  text: để ngươi kể cho con trai và cháu trai của ngươi nghe Ta đã đối xử nghiêm khắc với Ai Cập thế nào[a], cùng những dấu lạ của Ta mà Ta đã đặt giữa họ, và để các ngươi biết rằng Ta là Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đã làm nhục Ai Cập thế nào.” Động từ Hê-bơ-rơ có thể nhấn mạnh việc Ai Cập bị hạ nhục, bên cạnh việc bị đối xử nghiêm khắc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và các ngươi sẽ biết rằng Ta là Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích/kết quả nối với mệnh lệnh ở câu trước.
- source_word: תְּסַפֵּר בְּאָזְנֵי
  choice: kể ... nghe
  rationale: Chuyển thành ngữ Hê-bơ-rơ nghĩa đen là “kể vào tai” sang cách nói Việt tự nhiên, đồng thời giữ ý truyền kể trực tiếp.
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: con và cháu ngươi
  rationale: “Con của con ngươi” chỉ thế hệ cháu; cách dịch này gọn, rõ và giữ trọng tâm liên thế hệ.
- source_word: הִתְעַלַּלְתִּי
  choice: Ta đã đối xử nghiêm khắc
  rationale: Trong bối cảnh các tai họa, động từ chỉ hành động nặng nề và làm nhục Ai Cập; lựa chọn này giữ sắc thái phán xét mà không thu hẹp thành sự chế nhạo đơn thuần.
- source_word: בְּמִצְרַיִם
  choice: với Ai Cập
  rationale: Phù hợp với kết cấu tiếng Việt “đối xử ... với”, trong đó Ai Cập là đối tượng của hành động.
- source_word: אֹתֹתַי
  choice: những dấu lạ của Ta
  rationale: “Dấu lạ” vừa tự nhiên trong văn cảnh Kinh Thánh vừa giữ ý nghĩa dấu hiệu có tính phi thường, không đổi sang từ tương ứng với “kỳ công”.
- source_word: שַׂמְתִּי בָם
  choice: Ta đã đặt giữa họ
  rationale: Giữ khá sát động từ “đặt” và hiểu đại từ số nhiều là người Ai Cập.
- source_word: וִידַעְתֶּם
  choice: và để các ngươi biết
  rationale: Tiếp nối mục đích do לְמַעַן mở đầu; số nhiều “các ngươi” phản ánh đúng hình thái Hê-bơ-rơ và sự chuyển từ người nghe số ít sang cộng đồng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Sắc thái của הִתְעַלַּלְתִּי đối với Ai Cập
  choice: Ta đã đối xử nghiêm khắc với Ai Cập
  alternative: Ta đã làm nhục Ai Cập / Ta đã biến Ai Cập thành trò cười
  rationale: Bản văn bao hàm hành động phán xét nặng nề và có thể cả sắc thái hạ nhục. Bản chính nhấn mạnh mức độ nghiêm khắc; chú thích bảo tồn nét nghĩa hạ nhục.
- issue: Quan hệ cú pháp của וִידַעְתֶּם
  choice: và để các ngươi biết
  alternative: và các ngươi sẽ biết
  rationale: Có thể hiểu là mục đích tiếp nối hoặc kết quả tương lai. Cách dịch chính theo mạch mục đích của לְמַעַן, còn chú thích giữ khả năng chỉ kết quả.
- issue: Sự chuyển đổi số trong đại từ
  choice: “ngươi” ở phần đầu và “các ngươi” ở phần cuối
  alternative: đồng nhất tất cả thành một số để văn phong trơn hơn
  rationale: Nguyên văn chuyển từ ngôi thứ hai số ít khi nói với Môi-se sang số nhiều khi nói về cộng đồng; giữ sự chuyển đổi này tránh xóa một đặc điểm có thật của bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/ngươi/các ngươi” để giữ sắc thái lời phán trực tiếp và phân biệt đúng số của đại từ; dùng “kể ... nghe” thay cho lối dịch cứng “vào tai”. Mọi ký hiệu chú thích đều xuất hiện trong chính văn.
