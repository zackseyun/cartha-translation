  to: để ngươi kể cho con trai và cháu trai của ngươi nghe Ta đã đối xử nghiêm khắc với Ai Cập thế nào[a], cùng những dấu lạ của Ta mà Ta đã đặt giữa họ, và để các ngươi biết rằng Ta là Yahweh.[b]
