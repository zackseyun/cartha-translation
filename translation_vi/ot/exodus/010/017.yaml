source:
  edition: WLC
  text: וְ/עַתָּ֗ה שָׂ֣א נָ֤א חַטָּאתִ/י֙ אַ֣ךְ הַ/פַּ֔עַם וְ/הַעְתִּ֖ירוּ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יָסֵר֙ מֵֽ/עָלַ֔/י רַ֖ק אֶת הַ/מָּ֥וֶת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: vi
  text: Vậy bây giờ, xin hãy tha tội cho tôi chỉ lần này thôi; và hãy khẩn cầu Yahweh, Đức Chúa Trời của các ông, để Ngài cất khỏi tôi cái chết này thôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cái chết này”; có lẽ Pha-ra-ôn nói đến tai vạ chết chóc đang xảy ra và những hậu quả của nó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả liên từ chuyển ý và sắc thái thời gian, đồng thời diễn đạt tự nhiên lời nài xin khẩn cấp của Pha-ra-ôn.
- source_word: שָׂא נָא חַטָּאתִי
  choice: xin hãy tha tội cho tôi
  rationale: Động từ נשׂא có nghĩa đen là “nhấc, mang”, nhưng khi đi với “tội” thì là thành ngữ chỉ việc tha thứ hoặc cất bỏ tội lỗi; נָא tạo sắc thái khẩn khoản.
- source_word: אַךְ הַפַּעַם
  choice: chỉ lần này thôi
  rationale: Diễn đạt đầy đủ lực hạn định của אַךְ và ý chỉ một dịp hiện tại.
- source_word: וְהַעְתִּירוּ
  choice: và khẩn cầu
  rationale: Dạng Hiphil của עתר chỉ lời cầu xin tha thiết hướng về Đức Chúa Trời; “khẩn cầu” trang trọng, tự nhiên và không mặc nhiên thêm thuật ngữ thần học “cầu thay”.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Đức Chúa Trời của các ông
  rationale: 'Giữ danh riêng giao ước יהוה là “Yahweh” và bảo tồn cách nói tạo khoảng cách của Pha-ra-ôn: “Đức Chúa Trời của các ông”.'
- source_word: וְיָסֵר מֵעָלַי
  choice: để Ngài cất khỏi tôi
  rationale: Diễn đạt mệnh đề mục đích/kết quả sau lời yêu cầu khẩn cầu; “cất khỏi” tương ứng tự nhiên với ý loại bỏ khỏi người nói.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: chỉ cái chết này
  rationale: Giữ nguyên cách nói cụ thể nhưng không giải nghĩa quá mức của tiếng Hê-bơ-rơ, kể cả tiểu từ hạn định רַק.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; chuyển tự “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của “cái chết này”
  choice: Giữ nguyên “cái chết này”
  alternative: tai họa chết chóc này hoặc nạn châu chấu này
  rationale: Ngữ cảnh cho thấy Pha-ra-ôn nói đến tai vạ hiện tại và hậu quả chết chóc của nó, nhưng nguyên văn vẫn dùng הַמָּוֶת “cái chết”; bản dịch không nên thu hẹp sự mơ hồ ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ông” vì hậu tố số nhiều trong אֱלֹהֵיכֶם và mệnh lệnh số nhiều וְהַעְתִּירוּ cho thấy Pha-ra-ôn đang nói với Môi-se và A-rôn. Không đặt chú thích cho thành ngữ “tha tội” vì bản dịch tiếng Việt đã truyền đạt rõ nghĩa theo ngữ cảnh.
