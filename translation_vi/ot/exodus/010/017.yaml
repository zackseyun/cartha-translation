revisions:
- from: Vậy bây giờ, xin hãy tha tội cho tôi chỉ lần này thôi, và khẩn cầu Yahweh, Đức Chúa Trời của các ông, để Ngài cất khỏi tôi chỉ cái chết này.[a]
  to: Vậy bây giờ, xin hãy tha tội cho tôi chỉ lần này thôi; và hãy khẩn cầu Yahweh, Đức Chúa Trời của các ông, để Ngài cất khỏi tôi cái chết này thôi.[a]
  rationale: Chỉ điều chỉnh trật tự từ và dấu câu để tiếng Việt tự nhiên, đồng thời giữ nguyên nghĩa hạn định của רַק, cách xưng hô số nhiều, danh Yahweh, và tính không xác định của “cái chết này.”
