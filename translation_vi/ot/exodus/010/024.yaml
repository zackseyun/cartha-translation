revisions:
- from: 'Bấy giờ, Pha-ra-ôn gọi Môi-se đến và nói: “Hãy đi phụng sự Đức Giê-hô-va. Chỉ có bầy chiên dê và đàn bò của các ngươi phải để lại[a]; ngay cả con trẻ của các ngươi cũng được đi cùng.”'
  to: 'Bấy giờ, Pha-ra-ôn gọi Môi-se đến và nói: “Hãy đi phụng sự Yahweh. Chỉ có bầy chiên dê và đàn bò của các ngươi phải ở lại[a]; ngay cả trẻ nhỏ của các ngươi cũng được đi cùng các ngươi.”'
  rationale: Sửa danh יהוה thành “Yahweh” để nhất quán với quy ước dự án và nguồn audit. Đổi “phải để lại” thành “phải ở lại” nhằm phản ánh tự nhiên hơn dạng bị động của động từ Hê-bơ-rơ trong ngữ cảnh. Hiện đại hóa nhẹ “con trẻ” thành “trẻ nhỏ”, đồng thời giữ nguyên ý nghĩa, sắc thái nhượng bộ của “ngay cả”, và tính số nhiều của lời nói.
