  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: vi
  text: 'Bấy giờ, Pha-ra-ôn gọi Môi-se đến và nói: “Hãy đi phụng sự Yahweh. Chỉ có bầy chiên dê và đàn bò của các ngươi phải ở lại[a]; ngay cả trẻ nhỏ của các ngươi cũng được đi cùng các ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải bị giữ lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל־מֹשֶׁה
  choice: Pha-ra-ôn gọi Môi-se đến
  rationale: קרא אל trong ngữ cảnh này diễn tả việc Pha-ra-ôn gọi Môi-se để trực tiếp truyền đạt nhượng bộ; “gọi ... đến” tự nhiên trong tiếng Việt mà không tăng sắc thái thành “triệu tập”.
- source_word: לְכוּ עִבְדוּ אֶת־יְהוָה
  choice: Hãy đi phụng sự Đức Giê-hô-va
  rationale: “Phụng sự” giữ được nghĩa trực tiếp của עבד và mô-típ xuyên suốt Xuất Hành về việc dân Y-sơ-ra-ên phụng sự Đức Chúa Trời thay vì Pha-ra-ôn; trong ngữ cảnh tôn giáo, từ này cũng bao hàm sự thờ phượng.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc và trang trọng trong tiếng Việt để biểu đạt trực tiếp danh YHWH, thay vì thay bằng một tước hiệu.
- source_word: רַק
  choice: Chỉ có
  rationale: Đánh dấu điều kiện hạn chế mà Pha-ra-ôn gắn vào sự cho phép.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: bầy chiên dê và đàn bò của các ngươi
  rationale: צֹאן chỉ gia súc nhỏ, chủ yếu chiên và dê; בָּקָר chỉ đại gia súc, nhất là bò. Cách dịch cụ thể giúp độc giả hiện đại hiểu rõ hai nhóm vật nuôi.
- source_word: יֻצָּג
  choice: phải để lại
  rationale: Dạng Hophal của יצג ở đây mang nghĩa bị giữ hoặc để lại tại chỗ. “Phải để lại” diễn đạt tự nhiên điều kiện Pha-ra-ôn áp đặt, đồng thời giữ ý bị động theo nghĩa.
- source_word: גַּם טַפְּכֶם
  choice: ngay cả con trẻ của các ngươi
  rationale: גַּם có sắc thái nhấn mạnh nhượng bộ; טַף chỉ trẻ nhỏ hoặc những người nhỏ tuổi phụ thuộc trong gia đình. “Ngay cả con trẻ” giữ được cả hai nét nghĩa.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: cũng được đi cùng
  rationale: Trong lời cho phép của Pha-ra-ôn, dạng vị lai mang lực cho phép theo ngữ cảnh; “được đi cùng” là tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh / Đức Chúa Hằng Hữu
  rationale: Bản dịch giữ đây là danh riêng của Đức Chúa Trời, không thay bằng một tước hiệu. “Đức Giê-hô-va” là dạng Việt hóa quen thuộc, trang trọng; “Yahweh” gần cách phục nguyên học thuật hơn nhưng ít tự nhiên hơn với nhiều độc giả phổ thông.
- issue: Nghĩa của עבד khi có Đức Chúa Trời làm đối tượng
  choice: phụng sự
  alternative: thờ phượng
  rationale: “Phụng sự” bảo toàn mô-típ thần học về sự phục dịch/chủ quyền trong Xuất Hành và không thu hẹp từ này chỉ còn hành vi nghi lễ, dù việc thờ phượng vẫn nằm trong phạm vi nghĩa.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Dùng “các ngươi” trong lời của vua nói với Môi-se và dân đi cùng để giữ số nhiều của tiếng Hê-bơ-rơ và sắc thái quyền uy. Dấu [a] được đặt ngay sau cụm từ liên quan.
