base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: vi
  text: Chắc chắn cả ông lẫn dân này đang ở với ông đều sẽ kiệt sức[a], vì công việc này quá nặng đối với ông. Một mình ông không thể làm nổi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chắc chắn sẽ hao mòn.” Tiếng Hê-bơ-rơ lặp lại cùng một động từ để nhấn mạnh: theo sát mặt chữ là “hao mòn, ông sẽ hao mòn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: chắc chắn ... sẽ kiệt sức
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ cùng gốc nhấn mạnh tính chắc chắn và mức độ. Trong ngữ cảnh Môi-se làm việc quá sức, “sẽ kiệt sức” truyền đạt tự nhiên lời cảnh báo.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: cả ông lẫn dân này
  rationale: Hai lần גַּם bao gồm cả Môi-se và dân chúng; “dân này” giữ dạng tập thể số ít của עָם cùng đại từ chỉ định.
- source_word: אֲשֶׁר עִמָּךְ
  choice: đang ở với ông
  rationale: Diễn đạt mệnh đề quan hệ chỉ đoàn dân hiện diện cùng Môi-se một cách tự nhiên trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu nguyên nhân của lời cảnh báo.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: công việc này quá nặng đối với ông
  rationale: כָבֵד giữ hình ảnh “nặng” theo nghĩa gánh nặng quá sức. Trong mạch văn, הַדָּבָר chỉ việc xét xử đang được bàn đến, nên “công việc này” rõ và không đặc định quá mức.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: không thể làm nổi
  rationale: Diễn đạt sự bất lực thực tế; “làm nổi” là cách nói hiện đại, tự nhiên, đồng thời giữ nghĩa rộng của עשה.
- source_word: לְבַדֶּךָ
  choice: một mình ông
  rationale: Nhấn mạnh Môi-se không thể hoàn thành công việc nếu không có người hỗ trợ.
theological_decisions: []
