  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “ông” phù hợp lời Giê-trô nói với Môi-se; giữ ẩn dụ “quá nặng” của nguyên văn nhưng diễn đạt lời cảnh báo về sự kiệt sức bằng tiếng Việt tự nhiên.
