base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: vi
  text: 'cùng hai con trai của bà. Một người tên là Ghẹt-sôm, vì ông nói: “Tôi đã là một kiều dân[a] ở đất khách.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người tạm trú” hoặc “người ngoại quốc.” Từ Hê-bơ-rơ גֵּר chỉ người sống nơi không phải quê hương mình, với tư cách người ngoài hoặc người cư trú tạm thời.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: cùng hai con trai của bà
  rationale: Câu tiếp nối động từ và cấu trúc của câu trước; “cùng” diễn đạt tự nhiên liên từ וְ và dấu hiệu tân ngữ אֵת, còn “hai con trai của bà” giữ rõ đại từ sở hữu giống cái và nghĩa chỉ con trai.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: Một người tên là
  rationale: Cách diễn đạt tiếng Việt tự nhiên, phân biệt một trong hai người con mà không diễn giải הָאֶחָד thành “người thứ nhất” theo thứ tự.
- source_word: גֵּרְשֹׁם
  choice: Ghẹt-sôm
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối rõ âm tiết, phù hợp độc giả tiếng Việt.
- source_word: כִּי אָמַר
  choice: vì ông nói
  rationale: Giữ chức năng giải thích lý do đặt tên; chủ thể “ông” được bổ sung theo ngữ cảnh, chỉ Môi-se.
- source_word: גֵּר
  choice: kiều dân
  rationale: Diễn đạt một người cư trú ngoài quê hương và có địa vị người ngoài; từ này trang trọng nhưng vẫn thông dụng, đồng thời tránh sắc thái tiêu cực hiện đại của “ngoại kiều” trong một số ngữ cảnh.
- source_word: הָיִיתִי
  choice: đã làm
  rationale: Thể hoàn thành Hê-bơ-rơ được chuyển bằng quá khứ tự nhiên trong tiếng Việt, không áp đặt ý nghĩa trạng thái ấy còn tiếp diễn.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: nơi đất khách
  rationale: Thành ngữ tiếng Việt tự nhiên và trang trọng, truyền đạt đúng ý một vùng đất không phải quê hương của người nói.
theological_decisions:
- issue: Quan hệ giữa tên Ghẹt-sôm và lời giải thích bằng גֵּר
  choice: Giữ nguyên lời giải thích về thân phận “kiều dân” mà không cố tạo một phép chơi chữ tiếng Việt.
  alternative: Diễn giải tên Ghẹt-sôm theo nghĩa suy đoán như “kiều dân nơi đó”.
  rationale: Bản văn nêu lời của Môi-se làm lý do đặt tên nhưng không trực tiếp giải nghĩa đầy đủ mọi thành tố của tên; vì vậy không nên thêm một từ nguyên học chắc chắn hơn nguồn văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được trình bày như phần tiếp nối Xuất Ai Cập 18:2. “Đất khách” giữ sắc thái tha hương tự nhiên trong tiếng Việt; dấu chú thích [a] được đặt ngay sau thuật ngữ có nhiều khả năng dịch.
