source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: vi
  text: 'Giê-trô nói: “Yahweh đáng chúc tụng![a] Ngài đã giải cứu anh em khỏi tay người Ai Cập và khỏi tay Pha-ra-ôn; Ngài đã giải cứu dân khỏi ách thống trị của người Ai Cập.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nguyện Yahweh được chúc tụng!” Công thức chúc tụng trong tiếng Hê-bơ-rơ có thể mang sắc thái tuyên xưng hoặc cầu chúc.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “khỏi tay người Ai Cập ... khỏi dưới tay người Ai Cập”; “tay” là hình ảnh chỉ quyền lực hoặc sự kiểm soát áp bức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ mở đầu lời nói trong mạch kể chuyện; tiếng Việt không cần dịch máy móc liên từ וַ để diễn đạt trình tự tự nhiên.
- source_word: יִתְרוֹ
  choice: Giê-trô
  rationale: Dùng dạng tên quen thuộc và dễ đọc trong tiếng Việt, tương ứng với tên Hê-bơ-rơ Yitro.
- source_word: בָּרוּךְ יְהוָה
  choice: Chúc tụng Yahweh!
  rationale: Diễn đạt tự nhiên công thức chúc tụng Hê-bơ-rơ, giữ sắc thái tôn vinh mà không buộc phải xác định đó là lời tuyên bố hay lời cầu chúc.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: הִצִּיל
  choice: giải cứu
  rationale: Thể Hiphil của נצל chỉ hành động khiến người khác thoát khỏi quyền lực thù nghịch; “giải cứu” tự nhiên và phù hợp bối cảnh Xuất Hành.
- source_word: אֶתְכֶם
  choice: anh em
  rationale: Đại từ ngôi hai số nhiều giống đực được diễn đạt bằng “anh em”, phù hợp lời Giê-trô nói với Môi-se cùng cộng đồng nam giới/đại diện dân sự trong ngữ cảnh.
- source_word: מִיַּד מִצְרַיִם
  choice: khỏi tay người Ai Cập
  rationale: Giữ hình ảnh “tay” của nguyên văn đồng thời hiểu מִצְרַיִם theo nghĩa tập thể là người Ai Cập.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng danh xưng quen thuộc trong tiếng Việt.
- source_word: הָעָם
  choice: dân này
  rationale: Chỉ dân Y-sơ-ra-ên đã được nhắc đến trong ngữ cảnh; “dân này” tự nhiên trong lời nói trực tiếp.
- source_word: מִתַּחַת יַד מִצְרָיִם
  choice: khỏi ách thống trị của người Ai Cập
  rationale: Chuyển thành ngữ “từ dưới tay” sang cách nói tiếng Việt tự nhiên, vẫn giữ ý bị đặt dưới quyền áp bức.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; chuyển tự “Yahweh” bảo tồn tư cách danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của công thức בָּרוּךְ יְהוָה
  choice: Chúc tụng Yahweh!
  alternative: Yahweh đáng chúc tụng! / Nguyện Yahweh được chúc tụng!
  rationale: Phân từ bị động có thể mang sắc thái tuyên xưng hoặc cầu chúc. Bản dịch chính dùng công thức chúc tụng tự nhiên và chú thích bảo lưu các khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh “khỏi tay” ở vế đầu, nhưng dùng “khỏi ách thống trị” ở vế cuối để tránh cách nói tiếng Việt gượng gạo “khỏi dưới tay”, đồng thời chú thích hình thức nguyên văn.
