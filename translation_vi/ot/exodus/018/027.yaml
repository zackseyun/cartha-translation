  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: vi
  text: Rồi Môi-se tiễn cha vợ mình ra về[a], và ông đi về xứ mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Rồi Môi-se cho cha vợ mình ra về, và ông đi về xứ mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: tiễn ... ra về
  rationale: Dạng Piel của שׁלח với một người làm tân ngữ thường có nghĩa là cho đi, sai đi hoặc tiễn đi. Trong bối cảnh Giê-trô kết thúc chuyến thăm, “tiễn ... ra về” vừa tự nhiên trong tiếng Việt vừa diễn đạt một cuộc chia tay có chủ ý, không hàm ý xua đuổi.
- source_word: חֹתְנוֹ
  choice: cha vợ mình
  rationale: חֹתֵן ở đây chỉ Giê-trô, cha của vợ Môi-se. “Cha vợ” xác định rõ quan hệ gia đình theo ngữ cảnh.
- source_word: וַיֵּלֶךְ לוֹ
  choice: và ông trở về
  rationale: Cụm לוֹ mang tính thành ngữ và không cần dịch riêng. Vì đích đến là quê hương của Giê-trô, “trở về” truyền đạt tự nhiên hướng chuyển động trong tiếng Việt; đại từ “ông” quy chiếu đến Giê-trô.
- source_word: אֶל אַרְצוֹ
  choice: quê hương mình
  rationale: אֶרֶץ có thể là đất, xứ hoặc vùng đất. Trong ngữ cảnh một người trở lại vùng đất của mình, “quê hương mình” tự nhiên và không áp đặt khái niệm quốc gia hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Tiễn ... ra về” tránh sắc thái lạnh lùng hoặc quyền uy quá mức của “đuổi đi/cho lui”, trong khi chú thích giữ lại khả năng dịch sát hơn của שׁלח. Dùng “mình” theo lối quy chiếu tự nhiên của tiếng Việt cho cả Môi-se và Giê-trô mà ngữ cảnh vẫn rõ.
