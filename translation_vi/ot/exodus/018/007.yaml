base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: vi
  text: Môi-se đi ra đón cha vợ, cúi mình và hôn ông. Rồi hai người hỏi thăm xem người kia có được bình an không[a], và cùng đi vào lều.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ nói theo nghĩa đen là “hỏi nhau về sự bình an”; đây là một thành ngữ chỉ việc hỏi thăm tình trạng an lành của nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  choice: đón
  rationale: Trong ngữ cảnh ra tiếp một người thân vừa đến, “đi ra đón” diễn đạt tự nhiên cấu trúc יצא לקראת và không gợi một cuộc gặp tình cờ.
- source_word: חֹתְנוֹ
  choice: cha vợ
  rationale: Trong Xuất Ai Cập 18, חֹתֵן chỉ Giê-trô, cha vợ của Môi-se; cách gọi chính xác này phù hợp hơn thuật ngữ chung về quan hệ thông gia.
- source_word: וַיִּשְׁתַּחוּ
  choice: cúi mình
  rationale: Giữ hành động thể chất bày tỏ sự kính trọng nhưng không diễn giải quá mức thành thờ phượng.
- source_word: וַיִּשַּׁק לוֹ
  choice: hôn ông
  rationale: Diễn đạt trực tiếp nụ hôn chào hỏi theo phong tục, đồng thời dùng đại từ kính trọng tự nhiên trong tiếng Việt.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: hai người hỏi thăm tình hình của nhau
  rationale: “Hai người… của nhau” thể hiện tính tương hỗ của אִישׁ לְרֵעֵהוּ; “hỏi thăm tình hình” chuyển tải tự nhiên thành ngữ hỏi về שָׁלוֹם, tức tình trạng an lành của người kia.
- source_word: הָאֹהֱלָה
  choice: đi vào lều
  rationale: Hậu tố chỉ hướng được thể hiện bằng “vào”; không thêm “lều của Môi-se” vì nguyên văn chỉ nói “lều”.
theological_decisions:
- issue: Ý nghĩa việc Môi-se cúi mình trước Giê-trô
  choice: cử chỉ kính trọng trong cuộc chào đón
  alternative: hành động thờ phượng
  rationale: Động từ có thể được dùng cho sự thờ phượng ở những chỗ khác, nhưng đối tượng là một con người và chuỗi hành động chào hỏi ở đây phù hợp với cử chỉ tôn kính. “Cúi mình” giữ nguyên hành động mà không gán thêm ý nghĩa thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Cha vợ” rõ quan hệ gia đình; “ông” thể hiện sự kính trọng. Câu cuối dùng “cùng” để diễn đạt chủ ngữ số nhiều mà không xác định thêm điều nguyên văn không nói.
