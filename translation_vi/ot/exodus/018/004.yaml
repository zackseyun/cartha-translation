source:
  edition: WLC
  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: vi
  text: Còn người con kia tên là Ê-li-ê-xe[a], vì Đức Chúa Trời của cha tôi đã giúp đỡ tôi và giải cứu tôi khỏi gươm của Pha-ra-ôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ê-li-ê-xe có nghĩa là “Đức Chúa Trời của tôi là sự giúp đỡ.” Nguyên văn không có cụm từ “ông nói” trước lời giải thích tên.
    reason: Giải thích lối chơi chữ của tên Hê-bơ-rơ và ghi nhận rằng phần giải thích không có lời dẫn trực tiếp trong nguyên văn.
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: Còn người con kia tên là
  rationale: Trong mạch văn tiếp nối câu trước, הָאֶחָד chỉ người con còn lại. Cách diễn đạt này tự nhiên trong tiếng Việt, vẫn giữ quan hệ nối tiếp và đối chiếu của וְ.
- source_word: אֱלִיעֶזֶר
  choice: Ê-li-ê-xe
  rationale: Phiên âm tên riêng theo lối quen dùng trong Kinh Thánh tiếng Việt; ý nghĩa của tên được ghi ở chú thích vì liên hệ trực tiếp với lời giải thích theo sau.
- source_word: כִּי
  choice: vì
  rationale: Giữ chức năng giải thích nguyên do đặt tên.
- source_word: אֱלֹהֵי אָבִי
  choice: Đức Chúa Trời của cha tôi
  rationale: Bám sát cấu trúc sở hữu của tiếng Hê-bơ-rơ và giữ cách quy chiếu trang trọng đến Đức Chúa Trời mà cha Môi-se thờ.
- source_word: בְּעֶזְרִי
  choice: đã giúp đỡ tôi
  rationale: Diễn đạt tự nhiên danh từ עֵזֶר kèm hậu tố ngôi thứ nhất trong tiếng Việt. Từ “đã” phù hợp với việc Môi-se hồi tưởng sự giải cứu, dù mệnh đề Hê-bơ-rơ không có động từ chỉ thời rõ ràng.
- source_word: וַיַּצִּלֵנִי
  choice: và giải cứu tôi
  rationale: נצל ở đây chỉ hành động cứu thoát khỏi nguy cơ chết người; “giải cứu” vừa rõ nghĩa vừa trang trọng.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: khỏi gươm của Pha-ra-ôn
  rationale: Giữ hình ảnh “gươm” trong nguyên văn, có thể chỉ cả vũ khí lẫn quyền lực sát hại của Pha-ra-ôn.
theological_decisions:
- issue: Chủ thể và lời dẫn trong phần giải thích tên
  choice: Không thêm “ông nói” hay dấu ngoặc lời thoại; hiểu Đức Chúa Trời là chủ thể tiếp tục của cả hai hành động
  alternative: Thêm “vì ông nói rằng” để trình bày phần giải thích như lời trực tiếp của Môi-se
  rationale: Nguyên văn không có động từ nói. Không thêm lời dẫn giúp tránh biến lời giải thích tên thành một lời trích dẫn được đánh dấu rõ hơn mức văn bản cho phép, đồng thời quan hệ ngữ pháp tự nhiên cho thấy Đức Chúa Trời vừa giúp đỡ vừa giải cứu Môi-se.
- issue: Thời tính của בְּעֶזְרִי
  choice: Dùng “đã giúp đỡ tôi” theo ngữ cảnh hồi tưởng
  alternative: Dùng “là Đấng giúp đỡ tôi” để giữ mệnh đề không đánh dấu thời
  rationale: Tiếng Hê-bơ-rơ không có động từ liên kết ở đây nên tự thân không xác định rõ thời; tuy nhiên hành động giải cứu kế tiếp ở dạng kể chuyện quá khứ và hoàn cảnh đặt tên hỗ trợ cách diễn đạt hồi tưởng. Cách dịch vẫn không hàm ý rằng Đức Chúa Trời chỉ từng giúp đỡ trong quá khứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người con kia” làm rõ đối tượng đã được nêu ở câu trước mà không thêm nội dung mới; “gươm của Pha-ra-ôn” giữ nguyên hình ảnh cụ thể của bản Hê-bơ-rơ.
