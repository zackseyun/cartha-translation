translation:
  language: vi
  text: Vậy, Môi-se nghe theo lời cha vợ và làm mọi điều ông nói.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lắng nghe tiếng nói của cha vợ.” Thành ngữ Hê-bơ-rơ này có thể hàm ý lắng nghe với sự đáp ứng, tức là vâng theo; vế sau làm rõ rằng Môi-se đã làm theo những điều cha vợ nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: nghe theo lời
  rationale: Cụm שׁמע לְקוֹל là một thành ngữ mang nghĩa lắng nghe và làm theo. “Nghe theo lời” tự nhiên trong tiếng Việt, giữ được ý tiếp nhận lời nói và hàm ý đáp ứng, còn mệnh đề sau nói rõ sự vâng làm.
- source_word: חֹתְנוֹ
  choice: cha vợ mình
  rationale: Trong ngữ cảnh, từ này chỉ Giê-trô, cha vợ của Môi-se. “Cha vợ” là cách dịch rõ ràng và chính xác theo quan hệ được kể trong phân đoạn.
- source_word: וַיַּעַשׂ
  choice: làm
  rationale: Động từ עשה có nghĩa thông thường là “làm”; cách dịch trực tiếp này kết hợp tự nhiên với mệnh đề theo sau.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: mọi điều ông đã nói
  rationale: Cách dịch này phản ánh trực tiếp mệnh đề quan hệ trong tiếng Hê-bơ-rơ. “Ông” chỉ người cha vợ; “đã nói” tự nhiên trong mạch kể tiếng Việt mà không thêm nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nghe theo lời” được chọn thay vì dịch sát là “nghe tiếng” vì tự nhiên hơn trong tiếng Việt, đồng thời vẫn giữ sắc thái vâng theo của thành ngữ nguồn.
