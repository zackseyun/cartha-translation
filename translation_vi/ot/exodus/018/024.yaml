  - severity: low
    issue: Chú thích hiện dùng “vâng theo tiếng của cha vợ mình,” là cách nói kém tự nhiên trong tiếng Việt.
    rationale: Nên diễn đạt chú thích bằng “lắng nghe tiếng nói của cha vợ” hoặc giải thích trực tiếp sắc thái thành ngữ, đồng thời tránh câu “điều mình nghe” có quy chiếu hơi mơ hồ.
