  source_fidelity: Bản nháp truyền đạt đúng ý chính của וַיִּשְׁמַע ... לְקוֹל (“nghe theo/lưu ý lời”) và וַיַּעַשׂ כֹּל אֲשֶׁר אָמָר (“làm mọi điều ông nói”). Tuy nhiên, “ông đã nói” có thể giữ được thì hoàn thành tiếng Hê-bơ-rơ, nhưng không cần thiết trong tiếng Việt và hơi làm mạch kể kém trực tiếp. Cụm “nghe theo lời” là phù hợp, vì hành động ở vế sau xác nhận sắc thái vâng theo.
