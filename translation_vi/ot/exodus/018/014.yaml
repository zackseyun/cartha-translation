review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng ý chính: cha vợ Môi-se quan sát toàn bộ công việc Môi-se đang làm cho dân, rồi hỏi về việc Môi-se ngồi một mình trong khi dân đứng trước ông suốt ngày. Tuy nhiên, từ «phải» không có trong nguyên văn và «đứng chầu» thêm sắc thái triều đình/phục dịch không được nêu rõ. Đại từ «anh» trong lời của cha vợ nói với con rể cũng không tự nhiên trong quan hệ này.'
  naturalness: «Việc anh đang làm cho dân chúng là thế nào?» gượng trong tiếng Việt hiện đại. Cách hỏi «Con đang làm việc gì cho dân vậy?» tự nhiên hơn mà vẫn giữ câu hỏi về hành động/sự việc. «Đứng trước mặt» là cách diễn đạt trung tính, rõ nghĩa cho bối cảnh chờ được giải quyết.
  terminology: Giữ «cha vợ của Môi-se» để nêu rõ quan hệ. Trong lời thoại, «con» là cách xưng hô tự nhiên của cha vợ với con rể, không thêm nội dung thần học hay diễn giải. Dùng «dân» nhất quán, phù hợp văn mạch Kinh Thánh.
  issues:
  - severity: medium
    issue: Đại từ «anh» trong lời Giê-trô với Môi-se
    rationale: Vì người nói được xác định là cha vợ Môi-se, «anh» không phù hợp với quan hệ xưng hô tiếng Việt; «con» tự nhiên hơn.
  - severity: medium
    issue: «phải đứng chầu» thêm sắc thái và tình thái
    rationale: נִצָּב chỉ việc đứng, còn cụm עָלֶיךָ trong ngữ cảnh là đứng trước/để chầu trực trước Môi-se. «Phải» thêm ý bắt buộc, và «đứng chầu» gợi nghi thức phục dịch hoặc triều đình quá cụ thể.
  - severity: low
    issue: Câu hỏi «Việc anh đang làm cho dân chúng là thế nào?» thiếu tự nhiên
    rationale: Câu tiếng Việt này không phải cách hỏi thông dụng. Cần diễn đạt lại mà vẫn giữ tính chất chất vấn của מָה הַדָּבָר הַזֶּה.
