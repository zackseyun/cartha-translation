base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: vi
  text: 'Khi cha vợ của Môi-se thấy mọi việc ông đang làm cho dân, ông nói: “Con đang làm việc gì cho dân vậy? Tại sao con ngồi một mình, còn toàn dân đứng trước mặt con[a] từ sáng đến tối?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “đứng trên con”; trong ngữ cảnh, cụm từ này chỉ việc đứng trước Môi-se để chờ ông xét xử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: cha vợ của Môi-se
  rationale: Trong ngữ cảnh, חֹתֵן chỉ người có quan hệ thông gia với Môi-se, cụ thể là cha vợ ông; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה לָעָם
  choice: mọi việc ông đang làm cho dân chúng
  rationale: Phân từ עֹשֶׂה diễn tả hoạt động đang tiếp diễn; לָעָם ở đây phù hợp với ý phục vụ hay làm vì lợi ích của dân.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתָּה עֹשֶׂה לָעָם
  choice: Việc anh đang làm cho dân chúng là thế nào?
  rationale: Cách hỏi tự nhiên trong tiếng Việt, giữ ý Giê-trô chất vấn cách thức hay tình trạng đang diễn ra mà không thêm sự lên án mạnh hơn nguyên văn.
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: anh ngồi một mình
  rationale: Giữ cả nghĩa cụ thể là ngồi và hàm ý Môi-se một mình đảm trách phiên xét xử.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: còn toàn dân phải đứng chầu trước mặt anh
  rationale: נִצָּב là đứng, còn עָלֶיךָ theo ngữ cảnh chỉ việc đứng trước một người có thẩm quyền để chờ được giải quyết; “đứng chầu” diễn đạt rõ sự chờ đợi kéo dài, với chú thích bảo lưu hình thức sát chữ.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: từ sáng đến tối
  rationale: Thành ngữ thời gian tự nhiên trong tiếng Việt, chỉ suốt cả ngày.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Đại từ “ông” dùng trong lời kể; Giê-trô gọi Môi-se là “anh” để phản ánh quan hệ gia đình mà không dùng lối xưng hô cổ. “Dân chúng” và “toàn dân” tránh sắc thái hành chính quá hiện đại.
