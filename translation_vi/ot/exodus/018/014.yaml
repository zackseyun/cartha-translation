revisions:
- from: 'Khi cha vợ của Môi-se thấy mọi việc ông đang làm cho dân chúng, ông nói: “Việc anh đang làm cho dân chúng là thế nào? Tại sao anh ngồi một mình, còn toàn dân phải đứng chầu trước mặt anh[a] từ sáng đến tối?”'
  to: 'Khi cha vợ của Môi-se thấy mọi việc ông đang làm cho dân, ông nói: “Con đang làm việc gì cho dân vậy? Tại sao con ngồi một mình, còn toàn dân đứng trước mặt con[a] từ sáng đến tối?”'
  rationale: Đã thay đại từ trong lời thoại cho phù hợp quan hệ cha vợ–con rể; bỏ các yếu tố diễn giải «phải» và «đứng chầu»; và làm câu hỏi đầu tự nhiên hơn. Chú thích được giữ để phản ánh cấu trúc sát chữ của cụm «đứng trên con» và nghĩa ngữ cảnh là đứng trước Môi-se chờ xét xử.
  reviewer_model: gpt-5.6-terra
