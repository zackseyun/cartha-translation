source:
  edition: WLC
  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: vi
  text: 'Môi-se chọn những người có năng lực[a] từ toàn thể Y-sơ-ra-ên và lập họ làm người đứng đầu dân chúng[b]: người cai quản các nhóm một nghìn, một trăm, năm mươi và mười người.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người tài giỏi” hoặc “những người có phẩm chất”. Cụm từ Hê-bơ-rơ אַנְשֵׁי חַיִל có thể nói đến sức mạnh, năng lực hoặc giá trị đã được chứng thực; trong ngữ cảnh này, cụm từ chỉ những người có đủ năng lực lãnh đạo.
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa đen là “những cái đầu trên dân”; “đầu” được dùng theo nghĩa ẩn dụ để chỉ người có thẩm quyền.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: chọn
  rationale: Động từ בחר có nghĩa trực tiếp là chọn; cách dịch này tự nhiên và giữ được tính trực tiếp của lời thuật.
- source_word: אַנְשֵׁי חַיִל
  choice: những người có năng lực
  rationale: Trong bối cảnh hành chính và xét xử, cụm từ chỉ những người có khả năng, phẩm chất và năng lực đã được chứng thực, chứ không chủ yếu nói về lòng dũng cảm quân sự.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: trong toàn thể Y-sơ-ra-ên
  rationale: Diễn đạt việc tuyển chọn từ khắp cộng đồng Y-sơ-ra-ên bằng tiếng Việt tự nhiên.
- source_word: וַיִּתֵּן אֹתָם
  choice: lập họ làm
  rationale: נתן theo nghĩa đen là đặt hoặc trao, nhưng ở đây chỉ hành động bổ nhiệm vào chức trách.
- source_word: רָאשִׁים עַל הָעָם
  choice: người đứng đầu dân chúng
  rationale: Giữ hình ảnh ẩn dụ 'đầu' của tiếng Hê-bơ-rơ, đồng thời diễn đạt rõ địa vị có thẩm quyền đối với dân.
- source_word: שָׂרֵי
  choice: người cai quản
  rationale: שַׂר chỉ người được giao thẩm quyền trên một nhóm. 'Người cai quản' phù hợp với cơ cấu dân sự và xét xử hơn từ ngữ mang sắc thái quân sự rõ rệt.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: hàng ngàn, hàng trăm, hàng năm mươi và hàng chục
  rationale: Lối dịch trực tiếp giữ nguyên các cấp nhóm người trong cơ cấu được mô tả; 'hàng' cho thấy đây là người phụ trách các nhóm theo quy mô tương ứng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'người cai quản' thay vì từ mang sắc thái quân sự để phù hợp bối cảnh phân quyền xét xử; giữ cấu trúc nhịp nhàng của bốn cấp tổ chức.
