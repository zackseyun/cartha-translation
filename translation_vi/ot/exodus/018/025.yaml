    rationale: Cụm “trong toàn thể Y-sơ-ra-ên” có thể hiểu Môi-se chọn khi đang ở giữa toàn dân; tiếng Hê-bơ-rơ מִכָּל יִשְׂרָאֵל nói ông chọn các người ấy từ toàn thể Israel.
  - severity: low
    issue: “Hàng ngàn, hàng trăm...” có thể gợi các số lượng bất định.
    rationale: Các số từ Hê-bơ-rơ xác định các cấp đơn vị. “Các nhóm một nghìn, một trăm, năm mươi và mười người” thể hiện rõ hơn cơ cấu này trong tiếng Việt hiện đại.
  revised_text: 'Môi-se chọn những người có năng lực[a] từ toàn thể Y-sơ-ra-ên và lập họ làm người đứng đầu dân chúng[b]: người cai quản các nhóm một nghìn, một trăm, năm mươi và mười người.'
