source:
  edition: WLC
  text: וַ/יָּבֹ֞א יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה וּ/בָנָ֥י/ו וְ/אִשְׁתּ֖/וֹ אֶל מֹשֶׁ֑ה אֶל הַ/מִּדְבָּ֗ר אֲשֶׁר ה֛וּא חֹנֶ֥ה שָׁ֖ם הַ֥ר הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: vi
  text: Bấy giờ, Giê-trô, cha vợ của Môi-se, cùng các con trai và vợ của ông[a] đến với Môi-se trong hoang mạc, nơi Môi-se đang đóng trại tại núi của Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo ngữ cảnh ở các câu 2–4, “các con trai và vợ của ông” là các con trai và vợ của Môi-se; xét riêng về hình thức, các đại từ tiếng Hê-bơ-rơ cũng có thể được hiểu là chỉ Giê-trô.
    reason: referential_ambiguity
  - marker: b
    text: Nguyên văn là “núi của Đức Chúa Trời”, một danh xưng gắn với Si-na-i/Hô-rếp.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Bấy giờ ... đến
  rationale: Dạng wayyiqtol của בוא tiếp nối diễn tiến câu chuyện; “Bấy giờ” diễn đạt trình tự tự nhiên trong tiếng Việt.
- source_word: יִתְרוֹ
  choice: Giê-trô
  rationale: Phiên âm tên riêng theo cách viết Kinh Thánh quen thuộc và dễ đọc trong tiếng Việt.
- source_word: חֹתֵן מֹשֶׁה
  choice: cha vợ của Môi-se
  rationale: Trong ngữ cảnh, cụm từ chỉ quan hệ của Giê-trô với Môi-se; “cha vợ” là cách gọi chính xác, tự nhiên.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: cùng các con trai và vợ của ông
  rationale: “Cùng” diễn đạt những người đi theo Giê-trô, còn đại từ sở hữu vẫn giữ sự mơ hồ về mặt hình thức của tiếng Hê-bơ-rơ; ngữ cảnh trước đó hướng đến Môi-se là sở hữu chủ.
- source_word: אֶל מֹשֶׁה
  choice: đến với Môi-se
  rationale: Diễn đạt chuyển động hướng tới Môi-se mà không thêm ý “để gặp” vốn không được nói rõ.
- source_word: אֶל הַמִּדְבָּר
  choice: trong hoang mạc
  rationale: Trong cấu trúc tiếng Việt, đây là địa điểm Môi-se đang ở và là nơi Giê-trô đến; “trong hoang mạc” tự nhiên hơn cách dịch máy móc “đến hoang mạc”.
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: nơi ông đang đóng trại
  rationale: Mệnh đề quan hệ xác định nơi Môi-se đang đóng trại; không lặp từ tương đương với שָׁם vì “nơi” đã bao hàm ý đó.
- source_word: הַר הָאֱלֹהִים
  choice: núi của Đức Chúa Trời
  rationale: Giữ nguyên danh xưng mô tả trong nguyên văn, không thay bằng Si-na-i hay Hô-rếp.
theological_decisions:
- issue: Sở hữu chủ của “các con trai” và “vợ”
  choice: Giữ đại từ “ông” trong chính văn và chú thích rằng ngữ cảnh chỉ về Môi-se.
  alternative: Hiểu các hậu tố đại từ là chỉ Giê-trô.
  rationale: Về hình thức, hậu tố ngôi thứ ba số ít giống đực có thể khiến độc giả liên hệ với Giê-trô, nhưng Xuất Ê-díp-tô Ký 18:2–4 cho biết Giê-trô đưa vợ và các con trai của Môi-se trở lại. Chú thích bảo tồn điểm có thể mơ hồ đồng thời nêu cách hiểu tự nhiên theo ngữ cảnh.
- issue: Nhận diện “núi của Đức Chúa Trời”
  choice: Giữ danh xưng “núi của Đức Chúa Trời”.
  alternative: Thay bằng núi Si-na-i hoặc Hô-rếp.
  rationale: Nguyên văn không dùng địa danh riêng tại đây; giữ danh xưng tránh đưa thêm sự nhận diện không được phát biểu trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hoang mạc” cho מִדְבָּר, “đóng trại” cho חנה, và giữ danh xưng nguồn “núi của Đức Chúa Trời”. Cấu trúc câu đặt gia đình đi cùng ngay sau chủ thể để tiếng Việt rõ nghĩa, trong khi các cụm địa điểm vẫn giữ trật tự hợp lý.
