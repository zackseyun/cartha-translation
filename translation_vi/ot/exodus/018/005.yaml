    issue: Đại từ “ông” trong “nơi ông đang đóng trại” không xác định rõ Môi-se.
    rationale: Mệnh đề quan hệ אֲשֶׁר הוּא חֹנֶה שָׁם mô tả Môi-se tại địa điểm ông đang đóng trại. Trong tiếng Việt, sau khi Giê-trô là chủ ngữ chính và “ông” cũng đã xuất hiện trong cụm “vợ của ông”, cách dùng đại từ tiếp theo có thể khiến độc giả hiểu nhầm là Giê-trô. Đây không phải là sự mơ hồ cần bảo tồn.
