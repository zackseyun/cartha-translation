  text: Moses' father-in-law said to him[a], “What you are doing is not good.”
translation:
  language: vi
  text: 'Cha vợ của Môi-se nói với ông: “Việc ông đang làm không tốt.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Dạng waw-consecutive tiếp nối mạch kể chuyện; tiếng Việt tự nhiên không cần lặp từ nối “và” ở đầu câu.
- source_word: חֹתֵן מֹשֶׁה
  choice: Cha vợ của Môi-se
  rationale: Cụm sở hữu chỉ cha vợ của Môi-se; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: אֵלָיו
  choice: với ông
  rationale: Đại từ chỉ về Môi-se. “Với ông” phù hợp với động từ dẫn lời “nói” và không cần lặp lại tên riêng.
- source_word: לֹא טוֹב
  choice: không tốt
  rationale: Giữ cách đánh giá trực tiếp và phạm vi nghĩa rộng của טוֹב, không diễn giải hẹp thành “không đúng” hay “không có lợi”.
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: Việc ông đang làm
  rationale: Chuyển cụm danh từ “sự việc mà ông đang làm” thành lối nói tiếng Việt gọn, tự nhiên; “đang làm” phản ánh hành động đang tiếp diễn của phân từ עֹשֶׂה.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để xưng hô với Môi-se trong lời của cha vợ, tránh sắc thái quá suồng sã hoặc cổ kính.
