base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: vi
  text: 'Môi-se nói với cha vợ mình: “Vì dân chúng đến với tôi để tìm cầu Đức Chúa Trời[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cầu hỏi Đức Chúa Trời” hoặc “xin Đức Chúa Trời phán quyết.” Thành ngữ Hê-bơ-rơ có thể bao hàm việc thỉnh cầu Đức Chúa Trời hướng dẫn hoặc phân xử.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Động từ wayyiqtol của אמר mở đầu lời đáp của Môi-se; “nói” là cách kể chuyện tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: לְחֹתְנוֹ
  choice: với cha vợ mình
  rationale: Trong ngữ cảnh, חֹתֵן chỉ Giê-trô, cha vợ của Môi-se; “cha vợ” cụ thể và tự nhiên hơn cách gọi chung là người thân do hôn nhân.
- source_word: כִּי
  choice: Vì
  rationale: Liên từ nêu lý do cho việc Môi-se đang làm để trả lời câu hỏi của Giê-trô.
- source_word: יָבֹא אֵלַי הָעָם
  choice: dân chúng đến với tôi
  rationale: בוא + אֶל diễn tả việc dân chúng tìm đến Môi-se; thì hiện tại phù hợp với lời giải thích về một việc thường diễn ra.
- source_word: לִדְרֹשׁ
  choice: để tìm cầu
  rationale: דרש có thể mang nghĩa tìm kiếm hoặc thỉnh cầu, tra hỏi để nhận sự hướng dẫn. “Tìm cầu” giữ được nghĩa rộng và sắc thái hướng đến Đức Chúa Trời, còn nét nghĩa tham vấn hay xin phán quyết được ghi ở chú thích.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Nguyên văn trực tiếp nói đến Đức Chúa Trời, không chỉ ý muốn hay phán quyết của Ngài; cách dịch này giữ nguyên đối tượng thần học rõ ràng.
theological_decisions:
- issue: Cách dịch thành ngữ לִדְרֹשׁ אֱלֹהִים
  choice: tìm cầu Đức Chúa Trời
  alternative: cầu hỏi Đức Chúa Trời; xin Đức Chúa Trời phán quyết
  rationale: Thành ngữ Hê-bơ-rơ có thể chỉ việc tìm kiếm Đức Chúa Trời nói chung hoặc cầu hỏi Ngài để được hướng dẫn hay phân xử trong bối cảnh tranh tụng. Bản văn chính giữ nghĩa rộng, còn các sắc thái cụ thể hơn được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se,” “Giê-trô” và “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt. “Tìm cầu” giữ được độ rộng nghĩa của nguyên văn mà không tự ý giới hạn câu vào một thủ tục pháp lý.
