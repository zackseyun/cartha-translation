    issue: Neo chú thích [a] sau “Môi-se”
    rationale: Nội dung chú thích giải thích sự đối lập giữa “vụ khó” và “vụ nhỏ,” không phải tên Môi-se; nên đặt ký hiệu sau cụm “vụ việc khó.”
  - severity: low
