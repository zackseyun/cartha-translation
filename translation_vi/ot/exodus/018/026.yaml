    rationale: קָטֹן có thể chỉ việc nhỏ hơn/đơn giản hơn trong sự tương phản pháp lý, nhưng không buộc phải nói riêng về mức độ nghiêm trọng. Cách diễn đạt trung tính hơn giữ được độ mở của nguyên văn.
  revised_text: Họ xét xử dân chúng mọi lúc. Mọi vụ việc khó[a] họ đều trình lên Môi-se, còn mọi vụ việc nhỏ thì chính họ xét xử.
