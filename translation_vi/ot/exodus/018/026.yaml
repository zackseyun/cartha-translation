  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: vi
  text: Họ xét xử dân chúng mọi lúc. Mọi vụ việc khó[a] họ đều trình lên Môi-se, còn mọi vụ việc nhỏ thì chính họ xét xử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi vụ khó… mọi vụ nhỏ hơn.” Trong bối cảnh xét xử, tiếng Hê-bơ-rơ đối lập những vụ việc khó với những vụ việc nhỏ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Họ xét xử
  rationale: Động từ שׁפט trong ngữ cảnh này chỉ việc thực hiện chức năng xét xử. Thì quá khứ được hiểu từ mạch kể chuyện, không cần đánh dấu hình thái riêng trong tiếng Việt.
- source_word: הָעָם
  choice: dân chúng
  rationale: עם chỉ toàn thể cộng đồng dân Y-sơ-ra-ên; “dân chúng” tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: בְּכָל עֵת
  choice: vào mọi lúc
  rationale: Cụm này diễn tả việc các thẩm phán thường xuyên sẵn sàng xét xử, sát với nghĩa trực tiếp của tiếng Hê-bơ-rơ.
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: mọi vụ khó
  rationale: Trong bối cảnh pháp lý, דָּבָר có nghĩa là vụ việc cần phân xử; “vụ khó” gọn, rõ và giữ được sự đối lập với “vụ nhỏ”.
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: họ đều trình lên Môi-se
  rationale: “Trình lên” diễn đạt tự nhiên việc chuyển một vụ việc khó tới thẩm quyền cao hơn; “đều” giúp thể hiện ý nghĩa thường lệ và bao quát của cấu trúc.
- source_word: כָל הַדָּבָר הַקָּטֹן
  choice: mọi vụ nhỏ
  rationale: “Vụ nhỏ” giữ sát hình ảnh từ קָטֹן và sự tương phản trực tiếp với “vụ khó”, đồng thời chú thích nêu cách hiểu “vụ ít nghiêm trọng”.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: chính họ xét xử
  rationale: Đại từ độc lập הֵם mang tính nhấn mạnh; “chính họ” bảo toàn điểm nhấn rằng các thẩm phán ấy tự giải quyết những vụ nhỏ.
