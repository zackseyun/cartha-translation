  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: vi
  text: Nhưng ông hãy chọn trong toàn dân những người đàn ông có năng lực[a], kính sợ Đức Chúa Trời, chân thật[b] và ghét lợi bất chính[c]. Hãy lập họ cai quản dân chúng, làm người đứng đầu các đơn vị một nghìn, một trăm, năm mươi và mười người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đàn ông mạnh mẽ” hoặc “những người đàn ông dũng cảm.” Từ Hê-bơ-rơ có thể chỉ sức mạnh, năng lực hay lòng dũng cảm tùy ngữ cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đáng tin cậy.” Cụm từ Hê-bơ-rơ theo nghĩa sát là “những người đàn ông của sự thật.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “ghét lợi lộc bất công”; cụm từ này nói đến việc khước từ lợi lộc do tham nhũng hoặc bất công mà có.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: hãy chọn
  rationale: Động từ này có nghĩa gốc liên quan đến việc nhìn hoặc nhận ra; trong ngữ cảnh xác định người đủ phẩm chất để lãnh đạo, “hãy chọn” truyền đạt tự nhiên ý xem xét rồi tuyển chọn.
- source_word: מִכָּל־הָעָם
  choice: trong toàn dân
  rationale: 'Diễn đạt quan hệ bộ phận: những người được chọn từ giữa toàn thể dân chúng.'
- source_word: אַנְשֵׁי חַיִל
  choice: những người có năng lực
  rationale: חַיִל có thể chỉ sức mạnh, tài năng, năng lực hoặc lòng dũng cảm. Trong bối cảnh hành chính và xét xử, năng lực là nét nghĩa phù hợp nhất; chú thích giữ lại các khả năng khác.
- source_word: יִרְאֵי אֱלֹהִים
  choice: kính sợ Đức Chúa Trời
  rationale: Giữ ý kính sợ, tôn kính Đức Chúa Trời như một phẩm chất đạo đức.
- source_word: אַנְשֵׁי אֱמֶת
  choice: chân thật
  rationale: אֱמֶת bao hàm sự thật, tính đáng tin và lòng trung tín. “Chân thật” ngắn gọn, tự nhiên; chú thích nêu sắc thái “đáng tin cậy”.
- source_word: שֹׂנְאֵי בָצַע
  choice: ghét lợi bất chính
  rationale: בֶּצַע ở đây chỉ lợi lộc kiếm được bằng cách bất công hoặc tham nhũng; cách dịch này không thu hẹp nghĩa chỉ còn hối lộ.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: Hãy lập họ cai quản dân chúng
  rationale: Làm rõ đối tượng của đại từ tiếng Hê-bơ-rơ trong tiếng Việt và truyền đạt việc bổ nhiệm họ ở trên dân chúng.
- source_word: שָׂרֵי
  choice: người đứng đầu
  rationale: שַׂר chỉ người lãnh đạo, người đứng đầu hoặc quan chức; cách dịch này phù hợp cơ cấu quản trị mà không áp đặt sắc thái quân sự.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: từng ngàn người, từng trăm người, từng năm mươi người và từng mười người
  rationale: Thể hiện trực tiếp các cấp đơn vị được giao cho những người đứng đầu, đồng thời tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính trong các tiêu chuẩn lãnh đạo
  choice: những người có năng lực ... chân thật
  alternative: những người đàn ông có năng lực ... những người đàn ông chân thật
  rationale: Danh từ אִישׁ ở dạng số nhiều nam được dùng trong thành ngữ אַנְשֵׁי, nhưng tiếng Việt tự nhiên có thể dùng “những người” mà không phủ nhận bối cảnh lịch sử hay đưa ra khẳng định giáo lý rộng hơn. Các tính từ phân từ tiếng Hê-bơ-rơ cũng ở dạng nam số nhiều vì hòa hợp ngữ pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì đây là lời Giê-trô nói trực tiếp với Môi-se. Cấu trúc liệt kê được làm rõ bằng dấu câu và cách nói “từng ... người”, trong khi vẫn giữ đủ bốn cấp quản trị của nguyên văn.
