base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: vi
  text: Hãy cảnh báo họ về các quy định và luật lệ[a], và cho họ biết con đường họ phải bước đi[b] cùng việc họ phải làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Luật lệ” cũng có thể dịch là “những lời chỉ dạy” (Hê-bơ-rơ: torot). Từ này có thể chỉ sự giáo huấn theo nghĩa rộng, nhưng ngữ cảnh pháp lý ở đây nghiêng về nghĩa “luật lệ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “con đường họ phải bước đi trong đó”. Cách dịch này giữ lại hình ảnh “bước đi” của tiếng Hê-bơ-rơ, dùng để nói về cách sống và hành xử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: Hãy răn bảo
  rationale: Dạng Hiphil của זהר mang nghĩa cảnh báo, khuyên răn hoặc chỉ dẫn kèm lời cảnh tỉnh. “Răn bảo” diễn đạt được cả tính nghiêm túc lẫn mục đích hướng dẫn trong bối cảnh xét xử, mà không nặng sắc thái trừng phạt như “cảnh cáo” trong tiếng Việt hiện đại.
- source_word: הַחֻקִּים
  choice: những quy định
  rationale: חֻקִּים chỉ các điều khoản hay quy định đã được ấn định. “Những quy định” rõ nghĩa đối với độc giả hiện đại và vẫn giữ sắc thái pháp lý.
- source_word: הַתּוֹרֹת
  choice: luật lệ
  rationale: Dạng số nhiều תּוֹרֹת có thể chỉ những lời giáo huấn hoặc các luật. Trong ngữ cảnh pháp lý và khi đứng song song với חֻקִּים, “luật lệ” truyền đạt tự nhiên sức nặng pháp lý; chú thích giữ lại nghĩa rộng hơn là “những lời chỉ dạy”.
- source_word: וְהוֹדַעְתָּ
  choice: hãy cho họ biết
  rationale: Dạng Hiphil của ידע có nghĩa đen là làm cho người khác biết. “Cho họ biết” giữ được ý gây khiến và tự nhiên hơn “làm cho họ biết” trong tiếng Việt.
- source_word: הַדֶּרֶךְ
  choice: con đường
  rationale: “Con đường” giữ nguyên hình ảnh ẩn dụ Hê-bơ-rơ về nếp sống hay cách hành xử.
- source_word: יֵלְכוּ בָהּ
  choice: họ phải bước đi trên đó
  rationale: הלך với giới từ ב diễn tả bước đi trong hoặc theo một con đường. “Phải” thể hiện tính quy định của lời chỉ dẫn, còn “bước đi” giữ hình ảnh ẩn dụ của nguyên văn.
- source_word: הַמַּעֲשֶׂה אֲשֶׁר יַעֲשׂוּן
  choice: việc họ phải làm
  rationale: מַעֲשֶׂה chỉ điều được thực hiện, còn mệnh đề theo sau xác định hành động được đòi hỏi. “Việc họ phải làm” vừa tự nhiên vừa giữ tính nghĩa vụ trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng cấu trúc mệnh lệnh không nêu đại từ chủ ngữ để tránh áp đặt một cách xưng hô tiếng Việt không có trong động từ ngôi thứ hai số ít của nguyên văn. Dấu chấm phẩy làm rõ hai mệnh lệnh song song.
