- from: Hãy răn bảo họ về những quy định và luật lệ[a]; hãy cho họ biết con đường họ phải bước đi trên đó[b] và việc họ phải làm.
  to: Hãy cảnh báo họ về các quy định và luật lệ[a], và cho họ biết con đường họ phải bước đi[b] cùng việc họ phải làm.
