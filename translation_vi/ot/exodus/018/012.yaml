  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: vi
  text: Bấy giờ, Giê-trô, cha vợ Môi-se, lấy một lễ toàn thiêu và các sinh tế dâng cho Đức Chúa Trời. A-rôn cùng tất cả các trưởng lão Y-sơ-ra-ên đến ăn bánh[a] với cha vợ Môi-se trước mặt Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “ăn bánh”, một thành ngữ cũng có thể mang nghĩa “cùng dùng bữa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: đem ... dâng
  rationale: Động từ לקח có nghĩa cơ bản là “lấy”; trong ngữ cảnh tế lễ, “đem ... dâng” diễn đạt tự nhiên hành động mang lễ vật đến cho Đức Chúa Trời mà không chỉ dựa vào nghĩa suy diễn “hiến tế”.
- source_word: חֹתֵן מֹשֶׁה
  choice: cha vợ của Môi-se
  rationale: Trong mạch truyện này, חֹתֵן chỉ Giê-trô trong quan hệ cha vợ với Môi-se; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: עֹלָה
  choice: một lễ vật thiêu
  rationale: עֹלָה là thuật ngữ chỉ lễ vật được thiêu trọn. “Lễ vật thiêu” vừa giữ ý tế lễ vừa dễ hiểu hơn cách dịch thuần từ nguyên như “lễ vật thăng lên”.
- source_word: זְבָחִים
  choice: các sinh tế
  rationale: Danh từ số nhiều זְבָחִים chỉ những lễ vật có con vật bị giết để hiến tế, và được phân biệt với עֹלָה trong cùng câu. “Các sinh tế” bảo toàn sự phân biệt ấy.
- source_word: לֵאלֹהִים
  choice: dâng cho Đức Chúa Trời
  rationale: Giới từ ל biểu thị đối tượng nhận hoặc sự dâng hiến; “dâng cho” phù hợp tự nhiên với ngữ cảnh tế lễ.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: A-rôn cùng tất cả các trưởng lão Y-sơ-ra-ên đến
  rationale: Dù động từ Hê-bơ-rơ ở số ít và đứng trước A-rôn, chủ ngữ phối hợp bao gồm A-rôn và các trưởng lão nên tiếng Việt diễn đạt tự nhiên bằng cụm chủ ngữ chung.
- source_word: לֶאֱכָל לֶחֶם
  choice: ăn bánh
  rationale: Cụm từ có nghĩa đen là “ăn bánh”, nhưng cũng là thành ngữ chỉ việc dùng bữa. Bản văn chính giữ hình ảnh cụ thể của nguyên ngữ, còn chú thích nêu nghĩa rộng hơn.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: với cha vợ của Môi-se
  rationale: Nguyên văn lặp lại danh xưng quan hệ thay vì tên Giê-trô; bản dịch giữ sự lặp lại có chủ ý này.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: trước mặt Đức Chúa Trời
  rationale: Cách nói này chuyển tải trực tiếp nghĩa “trước, trong sự hiện diện của” và giữ sắc thái trang nghiêm của bối cảnh tế lễ.
theological_decisions:
- issue: Ý nghĩa của cụm từ dùng bữa trong bối cảnh tế lễ
  choice: Giữ nguyên hình ảnh “ăn bánh” trong một bữa ăn diễn ra trước mặt Đức Chúa Trời sau khi Giê-trô đem lễ vật đến dâng.
  alternative: Diễn giải thẳng thành “cùng dự một bữa ăn tế lễ” hoặc hiểu đơn thuần là ăn bánh thông thường.
  rationale: Ngữ cảnh gồm lễ vật, sự tham dự của A-rôn và các trưởng lão, cùng cụm “trước mặt Đức Chúa Trời”, nên có thể gợi một bữa ăn gắn với tế lễ. Tuy nhiên, nguyên văn không gọi rõ đó là “bữa ăn giao ước”; giữ cách nói “ăn bánh” tránh quyết định quá mức điều bản văn để ngỏ.
- issue: Sở chỉ của אֱלֹהִים
  choice: Đức Chúa Trời
  alternative: các thần
  rationale: Mạch truyện nói về Đức Chúa Trời của Y-sơ-ra-ên và cấu trúc ngữ cảnh đòi hỏi sở chỉ số ít; dịch là “các thần” sẽ tạo ra một hàm ý đa thần không có trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ tên riêng theo lối phiên âm quen thuộc; giữ sự lặp lại “cha vợ của Môi-se” và đặt dấu chú thích ngay sau cụm “ăn bánh”, là cụm mà chú thích giải thích.
