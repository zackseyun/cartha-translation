  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: vi
  text: Môi-se thuật lại cho cha vợ mình mọi điều Yahweh đã làm đối với Pha-ra-ôn và Ai Cập vì cớ Y-sơ-ra-ên[a], mọi nỗi gian nan đã xảy đến với họ dọc đường[b], và Yahweh đã giải cứu họ thế nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì lợi ích của Y-sơ-ra-ên” hoặc “do Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “mọi nỗi khốn khó” hoặc “mọi nghịch cảnh” đã xảy đến với họ trong hành trình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: thuật lại
  rationale: Động từ ספר ở thể piel có nghĩa là kể hoặc thuật lại; “thuật lại” tự nhiên trong văn kể chuyện và hàm ý trình bày những việc đã xảy ra.
- source_word: חֹתְנוֹ
  choice: cha vợ mình
  rationale: Trong ngữ cảnh, từ này chỉ Giê-trô, cha vợ của Môi-se; cách dịch này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: mọi điều Yahweh đã làm đối với Pha-ra-ôn và Ai Cập
  rationale: “Đối với” giữ được sắc thái tương đối trung tính của giới từ לְ, thay vì diễn giải mạnh hơn thành “chống lại”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời được ghi trực tiếp bằng Tứ Tự Danh, thay vì thay thế bằng một tước hiệu.
- source_word: עַל אוֹדֹת יִשְׂרָאֵל
  choice: vì cớ dân Y-sơ-ra-ên
  rationale: Thành ngữ này biểu thị nguyên do hoặc sự quy chiếu đến Y-sơ-ra-ên; “vì cớ” giữ được cả sắc thái “vì lợi ích của” và “do liên quan đến” mà không giải thích quá mức.
- source_word: הַתְּלָאָה
  choice: gian nan
  rationale: Danh từ chỉ sự nhọc nhằn, khốn khó hoặc nghịch cảnh; “gian nan” trang trọng vừa phải và tự nhiên khi nói về hành trình.
- source_word: מְצָאָתַם
  choice: đã xảy đến với họ
  rationale: Nguyên văn diễn tả gian nan “tìm gặp” họ; “xảy đến với họ” truyền đạt tự nhiên ý nghịch cảnh ập đến mà không tạo cách nói gượng trong tiếng Việt.
- source_word: בַּדֶּרֶךְ
  choice: dọc đường
  rationale: Cụm từ nói đến những điều xảy ra trong hành trình; “dọc đường” ngắn gọn, tự nhiên và giữ chuyển động của câu chuyện.
- source_word: וַיַּצִּלֵם
  choice: đã giải cứu họ
  rationale: Động từ נצל chỉ việc giải thoát hoặc cứu khỏi hiểm nguy; “giải cứu” phù hợp với bối cảnh lịch sử và không nhất thiết mang nghĩa thần học chuyên biệt về sự cứu rỗi.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יְהוָה. Giữ “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của עַל אוֹדֹת יִשְׂרָאֵל
  choice: vì cớ dân Y-sơ-ra-ên
  alternative: vì lợi ích của dân Y-sơ-ra-ên; do dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có thể nhấn mạnh nguyên do hoặc lợi ích liên quan đến Y-sơ-ra-ên. Bản chính giữ cách nói đủ rộng, còn chú thích nêu rõ các khả năng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thuật lại” và “giải cứu” để giữ sắc thái tường thuật Kinh Thánh mà không cổ hóa. Tên riêng theo dạng quen dùng trong tiếng Việt; danh Yahweh được giữ nguyên. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
