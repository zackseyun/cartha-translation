    issue: Cụm “mọi gian nan” chưa thật tự nhiên.
    rationale: Danh từ tập hợp này thường được diễn đạt tự nhiên hơn là “mọi nỗi gian nan”; thay đổi này không làm thay đổi nghĩa của הַתְּלָאָה.
  - severity: low
    issue: Bản chính thêm “dân” trước “Y-sơ-ra-ên.”
    rationale: יִשְׂרָאֵל ở đây chỉ ghi “Y-sơ-ra-ên”. Dù ngữ cảnh quy chiếu cộng đồng Y-sơ-ra-ên, không cần thêm danh từ giải thích trong bản chính.
