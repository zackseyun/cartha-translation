  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: vi
  text: Giê-trô, cha vợ Môi-se, đón Xíp-pô-ra, vợ Môi-se, sau khi nàng được gửi đi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sau khi Môi-se đã gửi nàng đi.” Nguyên văn theo nghĩa đen là “sau việc nàng được gửi đi”; tác nhân của việc gửi đi không được nêu rõ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: đón ... về
  rationale: לקח cơ bản là “lấy/đón”; trong ngữ cảnh này, “đón ... về” tự nhiên trong tiếng Việt và vẫn để ngỏ việc Giê-trô tiếp nhận nàng hay đưa nàng theo.
- source_word: חֹתֵן מֹשֶׁה
  choice: cha vợ của Môi-se
  rationale: חֹתֵן chỉ quan hệ thông gia; tại đây Giê-trô được xác định là cha vợ của Môi-se.
- source_word: צִפֹּרָה
  choice: Xíp-pô-ra
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối dễ đọc trong tiếng Việt.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: vợ Môi-se
  rationale: Cụm sở hữu xác định Xíp-pô-ra là vợ của Môi-se; cách diễn đạt này tự nhiên và rõ ràng.
- source_word: אַחַר
  choice: sau khi
  rationale: Diễn đạt quan hệ thời gian giữa hành động của Giê-trô và việc Xíp-pô-ra trước đó được cho trở về.
- source_word: שִׁלּוּחֶיהָ
  choice: ông đã cho nàng trở về nhà
  rationale: Danh từ với hậu tố giống cái số ít có nghĩa đen là “việc gửi/cho nàng đi”; chủ thể không được nêu. “Cho nàng trở về nhà” truyền đạt sắc thái chia tay hoặc gửi về mà không hàm ý mạnh như “đuổi đi”; “ông” theo ngữ cảnh chỉ Môi-se, nhưng sự hàm ẩn này được ghi chú.
theological_decisions:
- issue: Chủ thể ngầm trong אַחַר שִׁלּוּחֶיהָ (“sau việc cho nàng đi”)
  choice: 'Hiểu Môi-se là chủ thể ngầm: “sau khi ông đã cho nàng trở về nhà.”'
  alternative: “sau khi nàng đã được cho trở về nhà” hoặc sát chữ hơn, “sau việc nàng được cho đi.”
  rationale: Tiếng Hê-bơ-rơ dùng danh từ có hậu tố chỉ Xíp-pô-ra nhưng không nói rõ ai thực hiện hành động. Ngữ cảnh khiến Môi-se là chủ thể hợp lý nhất, song bản dịch giữ cách hiểu bị động trong chú thích để bảo toàn sự mơ hồ thật của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” để tránh lặp tên trong cùng câu; “cho ... trở về nhà” tránh sắc thái kết án có thể nảy sinh từ “đuổi đi” hay “ly dị”.
