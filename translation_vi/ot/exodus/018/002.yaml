  rationale: Sửa để loại bỏ các chi tiết về việc ‘trở về nhà’ không có trong bản văn nguồn, đồng thời bảo toàn sự mơ hồ về tác nhân của שִׁלּוּחֶיהָ. Chú thích ghi nhận cách hiểu theo ngữ cảnh rằng Môi-se là người gửi Xíp-pô-ra đi, nhưng không biến cách hiểu đó thành thông tin được xác định trong thân bài.
