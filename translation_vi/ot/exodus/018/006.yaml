base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: vi
  text: 'Ông nói với Môi-se: “Tôi, Giê-trô, cha vợ của con, đang đến với con, cùng vợ con và hai con trai của cô ấy[a] đi cùng cô ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ ghi “hai con trai của cô ấy,” với hậu tố giống cái số ít chỉ về vợ của Môi-se. Một số bản dịch diễn đạt là “hai con trai của con,” nhưng Bản văn Ma-xô-rét dùng đại từ ngôi ba giống cái.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: Ông nói với Môi-se
  rationale: Thể động từ nối tiếp đưa lời kể tiến về phía trước; tiếng Việt không cần dịch riêng liên từ וַ־. Chủ thể nam số ít được giữ ở mức “ông,” phù hợp với mạch văn xác định Giê-trô.
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  choice: Tôi, Giê-trô, cha vợ của con
  rationale: Giữ đại từ độc lập אֲנִי để thể hiện sự nhấn mạnh và giữ cấu trúc đồng vị. חֹתֵן trong ngữ cảnh này chỉ cha của vợ Môi-se, nên “cha vợ” là cách nói rõ ràng, tự nhiên.
- source_word: בָּא אֵלֶיךָ
  choice: đang đến với con
  rationale: Phân từ בָּא diễn tả hành động đang diễn ra hoặc sắp xảy đến; “đang đến” bảo toàn sắc thái ấy hơn cách dịch ở thì hoàn thành.
- source_word: וְאִשְׁתְּךָ
  choice: cùng với vợ con
  rationale: Liên từ trong ngữ cảnh giới thiệu những người tháp tùng được diễn đạt tự nhiên bằng “cùng với.”
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: hai con trai của cô ấy[a]
  rationale: Hậu tố ngôi ba giống cái số ít có nghĩa là “của cô ấy,” quy chiếu về vợ Môi-se; không đổi thành “hai con trai của con” dù cách ấy có thể tự nhiên hơn theo ngữ cảnh.
- source_word: עִמָּהּ
  choice: cũng đi cùng cô ấy
  rationale: Giữ lại thông tin được nêu minh nhiên rằng hai người con trai đi cùng người mẹ, đồng thời dùng “cũng” để câu tiếng Việt trôi chảy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trong lời thoại, dùng “con” vì người nói được xác định là cha vợ của Môi-se; cách xưng hô này tự nhiên trong tiếng Việt nhưng không làm thay đổi quan hệ được bản văn nêu rõ. Dấu chấm phẩy giúp giữ cả hai lần quy chiếu về người vợ mà không làm câu quá gượng.
