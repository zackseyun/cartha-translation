  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: vi
  text: Hãy để họ xét xử dân chúng mọi lúc. Mọi việc lớn, họ sẽ trình lên ông; còn mọi việc nhỏ, chính họ sẽ xét xử.[a] Như vậy, hãy tự làm nhẹ gánh cho ông, và họ sẽ cùng ông gánh vác gánh nặng ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi vụ việc quan trọng… mọi vụ việc nhỏ.” Tiếng Hê-bơ-rơ dùng “lớn” và “nhỏ” để nói về những việc được đưa ra xét xử.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn không nêu rõ vật được “gánh”; theo ngữ cảnh, đó là gánh nặng xét xử dân chúng.
    reason: implicit_object
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: Hãy để họ xét xử dân chúng
  rationale: Trong lời chỉ dẫn của Giê-trô, dạng động từ mang sắc thái mệnh lệnh; “xét xử” phù hợp với việc phân xử các vụ việc, còn “dân chúng” chỉ cộng đồng Y-sơ-ra-ên.
- source_word: בְּכָל־עֵת
  choice: bất cứ lúc nào
  rationale: Diễn đạt tự nhiên ý các thẩm phán luôn sẵn sàng phân xử, đồng thời giữ phạm vi khái quát của nguyên văn.
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: mọi việc lớn
  rationale: Giữ trực tiếp hình ảnh đối lập “lớn/nhỏ” trong tiếng Hê-bơ-rơ; theo ngữ cảnh, đây là các việc hoặc vụ việc cần phân xử.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: họ sẽ trình lên ông
  rationale: “Trình lên” diễn đạt tự nhiên việc đưa một vụ việc đến Môi-se để ông phân xử.
- source_word: כָּל־הַדָּבָר הַקָּטֹן יִשְׁפְּטוּ הֵם
  choice: mọi việc nhỏ, chính họ sẽ xét xử
  rationale: “Chính họ” phản ánh đại từ nhấn mạnh הֵם và làm rõ sự tương phản với những việc được trình lên Môi-se.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: hãy làm nhẹ gánh cho mình
  rationale: וְהָקֵל là mệnh lệnh Hiphil, nghĩa là làm nhẹ bớt điều đang đè trên Môi-se; “gánh” được bổ sung theo ẩn dụ rõ ràng trong ngữ cảnh.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: họ sẽ cùng ông gánh vác
  rationale: Giữ nghĩa “mang/gánh cùng”; tân ngữ không được nêu trong nguyên văn nên bản dịch không xác định cụ thể hơn mức cần thiết.
