translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để thể hiện lời Giê-trô nói trực tiếp với Môi-se; giữ cặp từ “việc lớn/việc nhỏ” nhằm bảo toàn hình ảnh của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
