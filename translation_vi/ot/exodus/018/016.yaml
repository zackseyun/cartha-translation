    rationale: Vế וְהוֹדַעְתִּי chỉ nói “tôi làm cho biết/tôi cho biết” các luật lệ và chỉ dẫn; đối tượng có thể suy ra từ ngữ cảnh nhưng không được nêu trong câu.
