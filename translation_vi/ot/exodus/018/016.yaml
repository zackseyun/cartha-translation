  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: vi
  text: Khi họ có một vụ việc[a], vụ việc ấy đến với tôi; tôi phân xử giữa người này với người kia[b], và tôi cho biết các luật lệ của Đức Chúa Trời cùng những chỉ dẫn của Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một vụ kiện” hoặc “một vấn đề”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “giữa một người nam với người lân cận của mình”, là lối nói số ít mang tính đại diện.'
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “luật pháp của Ngài”. Từ Hê-bơ-rơ có thể chỉ sự chỉ dạy hay chỉ dẫn nói chung, nhưng tại đây được dùng trong bối cảnh pháp lý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Khi
  rationale: Trong ngữ cảnh này, כִּי mở đầu hoàn cảnh có tính thời gian–điều kiện giải thích công việc thường lệ của Môi-se; “Khi” tự nhiên và không biến câu thành lời giải thích thuần túy.
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: họ có một vụ việc
  rationale: דָּבָר có nghĩa rộng là sự việc/vấn đề, nhưng trong bối cảnh xét xử, “vụ việc” diễn đạt rõ sắc thái tranh chấp hay vụ kiện mà không quá chuyên môn.
- source_word: בָּא אֵלַי
  choice: việc ấy được đưa đến tôi
  rationale: Động từ בָּא ở số ít phù hợp với דָּבָר; cách dịch này giữ chủ thể số ít và diễn đạt tự nhiên việc vụ việc được trình lên Môi-se, dù nguyên văn chỉ nói “đến với tôi”.
- source_word: וְשָׁפַטְתִּי
  choice: tôi phân xử
  rationale: שׁפט tại đây chỉ hoạt động đưa ra phán quyết giữa các bên; “phân xử” tự nhiên hơn “xét đoán” trong bối cảnh pháp lý.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: giữa người này với người kia
  rationale: Đây là lối nói số ít đại diện. Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp; “người này với người kia” giữ cấu trúc quan hệ giữa hai bên mà không thu hẹp phạm vi ngoài điều tiếng Hê-bơ-rơ xác định.
- source_word: וְהוֹדַעְתִּי
  choice: cho họ biết
  rationale: Thể Hiphil của ידע mang nghĩa khiến cho biết. “Cho họ biết” giữ lực sai khiến và làm rõ đối tượng ngầm là những người đến nhờ phân xử.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: các luật lệ của Đức Chúa Trời
  rationale: חֻקִּים là những quy định hay điều lệ được ấn định; “luật lệ” rõ ràng, trang trọng và phù hợp bối cảnh pháp lý.
- source_word: תּוֹרֹתָיו
  choice: những chỉ dẫn của Ngài
  rationale: תּוֹרָה căn bản là sự chỉ dạy/chỉ dẫn và ở đây ở số nhiều. “Chỉ dẫn” bảo toàn phạm vi rộng hơn “luật pháp”, còn bối cảnh và vế song song vẫn cho thấy tính chuẩn mực.
theological_decisions:
- issue: Lối nói giống đực số ít đại diện trong אִישׁ ... רֵעֵהוּ
  choice: người này với người kia
  alternative: một người nam với người lân cận của mình
  rationale: Tiếng Hê-bơ-rơ dùng danh từ và đại từ giống đực số ít trong một công thức pháp lý mang tính đại diện. Vì tiếng Việt không có giống ngữ pháp tương ứng, bản dịch tự nhiên không nên thêm ý rằng các bên nhất thiết đều là nam; chú thích ghi nhận hình thức nguyên văn.
- issue: Phạm vi nghĩa của תּוֹרֹתָיו trong bối cảnh pháp lý
  choice: những chỉ dẫn của Ngài
  alternative: luật pháp của Ngài
  rationale: Bối cảnh xét xử hỗ trợ sắc thái pháp lý, nhưng תּוֹרָה vẫn có thể chỉ sự dạy dỗ hay chỉ dẫn rộng hơn. Bản chính giữ nghĩa rộng và chú thích nêu phương án pháp lý, tránh âm thầm giải quyết độ mở của từ.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”. Nhịp câu giữ hai công việc của Môi-se: phân xử và công bố chỉ dẫn của Đức Chúa Trời.'
