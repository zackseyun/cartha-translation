  variant: modern standard Vietnamese
source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: vi
  text: Bây giờ tôi biết rằng Yahweh vĩ đại hơn tất cả các thần, vì trong chính việc chúng đã hành động ngạo mạn chống lại họ, Ngài vượt trên chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mệnh đề cuối trong tiếng Hê-bơ-rơ rất cô đọng và khó hiểu. Cũng có thể hiểu: “vì chính trong việc chúng đã hành động ngạo mạn chống lại họ, Ngài đã tỏ ra vượt trên chúng.” Câu này có thể nói riêng đến cách người Ai Cập ngạo mạn đối xử với Israel và việc Yahweh chứng tỏ Ngài vượt trên họ ngay trong chính việc ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: Bây giờ tôi biết
  rationale: Diễn đạt trạng thái nhận biết hiện tại có được sau những biến cố Giê-trô vừa nghe và chứng kiến; tự nhiên trong tiếng Việt mà vẫn giữ lực thời gian của עַתָּה.
- source_word: גָדוֹל יְהוָה מִכָּל הָאֱלֹהִים
  choice: Yahweh vĩ đại hơn tất cả các thần
  rationale: מִכָּל tạo ý so sánh, nên dùng “vĩ đại hơn”; danh xưng riêng יְהוָה được phiên âm là “Yahweh”, còn הָאֱלֹהִים ở đây mang nghĩa số nhiều trong sự đối chiếu với các thần.
- source_word: בַדָּבָר
  choice: trong việc
  rationale: דָּבָר chỉ sự việc hay vấn đề đang được nói đến. “Trong việc” vừa gọn, tự nhiên, vừa không xác định quá mức bản chất của biến cố.
- source_word: זָדוּ
  choice: đã hành động ngạo mạn
  rationale: Động từ diễn tả hành vi kiêu căng, tự phụ hoặc ngạo mạn; cách dịch này giữ sắc thái hành động chứ không chỉ mô tả tâm thế.
- source_word: עֲלֵיהֶם
  choice: chống lại họ / vượt trên chúng
  rationale: Cụm cuối rất cô đọng và khó phân tích. Bản dịch giữ các đại từ số nhiều và nét nghĩa không gian–đối nghịch của עַל, đồng thời tránh tự ý nêu đích danh người Ai Cập hay Israel trong chính văn.
theological_decisions:
- issue: Cách dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp Tứ Tự Danh. Giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa mệnh đề cuối כִּי בַדָּבָר אֲשֶׁר זָדוּ עֲלֵיהֶם
  choice: vì trong việc mà chúng đã hành động ngạo mạn chống lại họ, Ngài vượt trên chúng
  alternative: vì chính trong điều chúng ngạo mạn chống lại họ; bởi trong việc chúng cư xử ngạo mạn với dân ấy, Ngài đã tỏ mình cao hơn chúng
  rationale: Cú pháp Hê-bơ-rơ bị nén và có thể có thành phần được lược bỏ. Bản chính giữ sự phân biệt giữa những kẻ hành động ngạo mạn và đối tượng bị chúng chống lại, đồng thời truyền đạt ý Yahweh tỏ ra vượt trội mà không giải quyết dứt khoát các tiền ngữ của đại từ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “vĩ đại hơn” thay cho lối nói cứng “lớn hơn”; giữ các đại từ trong mệnh đề cuối để bảo tồn phần nào sự mơ hồ thật sự của nguyên văn, và giải thích khó khăn ấy trong chú thích.
