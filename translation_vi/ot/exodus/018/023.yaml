  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: vi
  text: Nếu ông làm điều này[a], và Đức Chúa Trời truyền cho ông như vậy, thì ông sẽ có thể đứng vững[b]; và toàn dân này cũng sẽ trở về nơi của mình trong bình an[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “việc này” hoặc “phương án này.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “đứng”; trong văn cảnh có nghĩa là đứng vững hoặc chịu đựng nổi.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “sẽ đến nơi của mình.” Danh từ “dân” là danh từ tập hợp; ý nói mỗi người sẽ trở về nơi thích hợp của mình trong bình an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Diễn đạt trực tiếp mệnh đề điều kiện mở đầu câu.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: điều này
  rationale: דָּבָר ở đây chỉ phương án Giê-trô vừa đề nghị; “điều này” vừa tự nhiên vừa giữ được độ rộng nghĩa.
- source_word: תַּעֲשֶׂה
  choice: ông làm
  rationale: Động từ עשה có nghĩa cơ bản là “làm”; đại từ “ông” phù hợp với lời Giê-trô nói trực tiếp với Môi-se.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: và Đức Chúa Trời truyền cho ông như vậy
  rationale: 'Giữ sự phối hợp bằng וְ và hiểu đây là điều kiện bổ sung: phương án phải có mệnh lệnh hay chuẩn thuận của Đức Chúa Trời.'
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: thì ông sẽ có thể đứng vững
  rationale: יכל + động từ nguyên mẫu diễn tả khả năng; “đứng vững” giữ hình ảnh của עמד đồng thời truyền đạt khả năng chịu đựng gánh nặng.
- source_word: וְגַם
  choice: đồng thời ... cũng
  rationale: Diễn đạt tự nhiên ý bổ sung về kết quả thứ hai.
- source_word: כָּל־הָעָם הַזֶּה
  choice: toàn dân này
  rationale: Giữ danh từ tập hợp số ít và sắc thái chỉ định của tiếng Hê-bơ-rơ, đồng thời tự nhiên trong tiếng Việt.
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: sẽ trở về nơi của mình
  rationale: Nghĩa đen gần với “sẽ đến chỗ của mình”; trong văn cảnh, cụm này chỉ dân chúng rời Môi-se để trở về chỗ thích hợp của mỗi người.
- source_word: בְשָׁלוֹם
  choice: trong bình an
  rationale: Giữ phạm vi nghĩa rộng của שָׁלוֹם, gồm sự bình an, yên ổn và kết quả tốt đẹp.
theological_decisions:
- issue: Quan hệ giữa lời khuyên của Giê-trô và mệnh lệnh của Đức Chúa Trời
  choice: 'Hiểu câu này là hai điều kiện phối hợp: Môi-se làm điều được đề nghị và Đức Chúa Trời truyền cho ông như vậy.'
  alternative: Có thể hiểu lỏng hơn là “và Đức Chúa Trời sẽ truyền cho ông” hoặc như một lời cầu chúc.
  rationale: Cấu trúc câu hợp lý nhất khi xem sự truyền dạy của Đức Chúa Trời là điều kiện cần đi kèm, tránh hàm ý rằng lời khuyên của Giê-trô tự nó có thẩm quyền tối hậu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho אֱלֹהִים và cặp xưng hô ngầm định “ông” trong lời Giê-trô nói với Môi-se. Giữ hình ảnh “đứng vững” thay vì giải nghĩa hoàn toàn thành “chịu đựng,” còn cách hiểu theo văn cảnh được nêu trong chú thích.
