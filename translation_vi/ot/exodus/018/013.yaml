  yaml_path: translation/ot/exodus/018/013.yaml
  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: vi
  text: Hôm sau, Môi-se ngồi xét xử dân chúng, còn dân chúng đứng trước mặt ông[a] từ sáng đến tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đứng quanh Môi-se.” Giới từ Hê-bơ-rơ ở đây có thể hiểu sát hơn như vậy; trong ngữ cảnh, dân chúng đang đứng chờ ông phân xử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Hôm sau
  rationale: Cụm này đưa câu chuyện sang sự việc diễn ra vào ngày kế tiếp. Tiếng Việt tự nhiên không cần dịch riêng công thức tự sự וַיְהִי.
- source_word: וַיֵּשֶׁב מֹשֶׁה לִשְׁפֹּט
  choice: Môi-se ngồi xét xử
  rationale: Giữ hình ảnh cụ thể của ישׁב là “ngồi”, đồng thời dịch שׁפט theo nghĩa tư pháp trong ngữ cảnh là “xét xử”.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ cộng đồng Y-sơ-ra-ên nói chung; “dân chúng” tự nhiên trong cảnh nhiều người đến nhờ phân xử.
- source_word: וַיַּעֲמֹד הָעָם
  choice: dân chúng đứng
  rationale: Dịch trực tiếp động từ עמד, đồng thời thể hiện sự tương phản về tư thế giữa Môi-se ngồi và dân chúng đứng.
- source_word: עַל מֹשֶׁה
  choice: trước mặt ông
  rationale: Trong kết hợp với עמד và ngữ cảnh xét xử, על có thể chỉ việc đứng trước hoặc đứng chầu quanh một người; bản chính dùng cách nói tự nhiên “trước mặt ông” nhưng giữ phương án sát mặt chữ hơn trong chú thích.
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: từ sáng đến tối
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài trọn ngày mà không thêm ý “bình minh” vốn không được nêu rõ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “xét xử” để làm rõ chức năng tư pháp; giữ sự tương phản nguyên văn giữa Môi-se ngồi và dân chúng đứng. Đại từ “ông” tránh lặp tên nhưng vẫn tôn trọng nhân vật.
