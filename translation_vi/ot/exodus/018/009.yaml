source:
  edition: WLC
  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: vi
  text: Giê-trô vui mừng vì mọi điều tốt lành mà Yahweh đã làm cho Israel, mà Ngài đã giải cứu khỏi tay Ai Cập.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “khỏi tay Ai Cập”, một thành ngữ có nghĩa là thoát khỏi quyền lực của Ai Cập.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: vui mừng
  rationale: Động từ diễn tả sự vui thích hoặc vui mừng. “Vui mừng” tự nhiên, trang trọng và phù hợp với phản ứng của Giê-trô trước hành động giải cứu của Đức Chúa Trời.
- source_word: יִתְרוֹ
  choice: Giê-trô
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: עַל כָּל הַטּוֹבָה
  choice: vì mọi điều tốt lành
  rationale: עַל sau động từ chỉ cảm xúc nêu nguyên do hoặc đối tượng của niềm vui. Danh từ số ít có nghĩa tập hợp được diễn đạt tự nhiên là “mọi điều tốt lành”.
- source_word: עָשָׂה
  choice: đã làm
  rationale: Hành động của Yahweh xảy ra trước phản ứng vui mừng của Giê-trô; “đã làm” thể hiện trình tự ấy tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: לְיִשְׂרָאֵל
  choice: cho Israel
  rationale: 'Giới từ ל ở đây chỉ đối tượng được hưởng lợi: Yahweh hành động vì lợi ích của Israel.'
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: khi Ngài giải cứu dân ấy
  rationale: Mệnh đề quan hệ có thể gắn với Israel như một tập thể số ít. Cách dịch “khi” diễn đạt tự nhiên mối liên hệ giải thích với “mọi điều tốt lành”, còn “dân ấy” giữ ý quy chiếu tập thể mà không gây nhầm rằng Israel là một cá nhân.
- source_word: מִיַּד מִצְרָיִם
  choice: khỏi tay Ai Cập
  rationale: Giữ hình ảnh thành ngữ Hê-bơ-rơ “khỏi tay”, vốn dễ hiểu trong tiếng Việt là thoát khỏi quyền lực hoặc sự khống chế của Ai Cập.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH; giữ “Yahweh” bảo toàn tính chất tên riêng thay vì thay thế bằng tước hiệu.
- issue: Đối tượng được giải cứu trong אֲשֶׁר הִצִּילוֹ
  choice: Israel như một tập thể, diễn đạt là “dân ấy”
  alternative: Hiểu đại từ số ít là chỉ Môi-se, hoặc dịch sát là “người mà Ngài đã giải cứu”
  rationale: Tiền ngữ gần nhất và mạch văn ủng hộ Israel; hậu tố số ít phản ánh cách xem Israel là một thực thể tập thể. Tuy vậy, cấu trúc Hê-bơ-rơ có thể gây tranh luận nên không thêm nội dung thần học ngoài câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ tên Yahweh và thành ngữ “khỏi tay Ai Cập”; dùng “dân ấy” để biểu đạt Israel như một tập thể số ít. Dấu chú thích [a] được đặt ngay sau thành ngữ cần giải thích.
