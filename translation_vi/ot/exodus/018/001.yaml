  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: vi
  text: Giê-trô, thầy tế lễ của Ma-đi-an, cha vợ của Môi-se, nghe mọi điều Đức Chúa Trời đã làm cho Môi-se và cho Y-sơ-ra-ên, dân của người[a], rằng Đức Giê-hô-va đã đưa Y-sơ-ra-ên ra khỏi Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “dân của người” cũng có thể được hiểu về mặt ngữ pháp là “dân của Môi-se”, dù theo ngữ cảnh, đại từ này rất có thể chỉ Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe
  rationale: Động từ wayyiqtol tiếp nối mạch kể chuyện; tiếng Việt không cần thêm một trạng từ thời gian như “bấy giờ” khi nguyên văn không có từ tương ứng rõ ràng.
- source_word: כֹהֵן מִדְיָן
  choice: thầy tế lễ của Ma-đi-an
  rationale: Cụm kết hợp xác định chức vụ và nơi gắn bó của Giê-trô; cách dịch này tự nhiên và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: חֹתֵן מֹשֶׁה
  choice: cha vợ của Môi-se
  rationale: Trong ngữ cảnh cuộc hôn nhân của Môi-se với Xíp-pô-ra, từ này chỉ cha của người vợ.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: mọi điều Đức Chúa Trời đã làm
  rationale: “Mọi điều” giữ sức khái quát của כָּל אֲשֶׁר; “đã làm” diễn tả hành động xảy ra trước khi Giê-trô nghe tin.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: cho Môi-se và cho Y-sơ-ra-ên
  rationale: Giới từ ל ở đây biểu thị hành động có lợi cho Môi-se và Y-sơ-ra-ên.
- source_word: עַמּוֹ
  choice: dân Ngài
  rationale: Hậu tố ngôi ba giống đực số ít được giữ bằng đại từ, với sở chỉ nhiều khả năng nhất là Đức Chúa Trời; chú thích ghi nhận khả năng ngữ pháp khác.
- source_word: כִּי
  choice: cùng việc
  rationale: Ở đây כִּי nêu rõ nội dung nổi bật của điều Giê-trô đã nghe. “Cùng việc” nối tự nhiên với “mọi điều” mà không biến mệnh đề thành quan hệ nhân quả.
- source_word: הוֹצִיא
  choice: đã đưa ... ra khỏi
  rationale: Thể Hiphil của יצא mang nghĩa khiến đi ra, tức đưa ra; cách diễn đạt này rõ nghĩa trong bối cảnh xuất hành.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng hình thức tên riêng của Đức Chúa Trời đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: מִמִּצְרָיִם
  choice: ra khỏi Ai Cập
  rationale: Kết hợp với הוֹצִיא, cụm này diễn tả chuyển động từ bên trong đất Ai Cập ra ngoài.
theological_decisions:
- issue: Sở chỉ của hậu tố trong עַמּוֹ
  choice: “Y-sơ-ra-ên, dân Ngài” được hiểu nhiều khả năng là dân của Đức Chúa Trời
  alternative: “Y-sơ-ra-ên, dân của Môi-se”
  rationale: Danh từ gần và phù hợp nhất làm tiền ngữ là אֱלֹהִים; mệnh đề kế tiếp cũng xác nhận Đức Giê-hô-va là Đấng đưa Y-sơ-ra-ên ra khỏi Ai Cập. Tuy vậy, vì ngữ pháp có thể nối hậu tố với Môi-se, bản dịch giữ đại từ trong câu chính và ghi khả năng kia ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt; dùng “thầy tế lễ” và “cha vợ” là những cách nói thông dụng, chính xác. Dấu chú thích [a] đặt ngay sau tên Giê-trô theo dữ liệu đầu vào, dù nội dung chú thích liên quan đến cụm “dân Ngài” ở phần sau của câu.
