  terminology: “Đức Chúa Trời,” “ở cùng,” và “các vụ việc” nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. Không có áp đặt giáo phái. Cần chuyển vị trí ký hiệu chú thích c để nó gắn trực tiếp với cụm “các vụ việc” mà chú thích giải thích.
  issues:
