base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: vi
  text: Bây giờ, hãy nghe lời ta; ta sẽ khuyên con, và nguyện Đức Chúa Trời ở cùng con.[a] Con hãy đại diện cho dân trước mặt Đức Chúa Trời,[b] và trình các vụ việc[c] lên Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch ít hiển ngôn hơn: “và Đức Chúa Trời ở cùng con.” Dạng Hê-bơ-rơ diễn tả một lời mong ước hoặc cầu chúc.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “Con hãy là người cho dân trước mặt Đức Chúa Trời.” Ý nói Môi-se thay mặt dân đến trước Đức Chúa Trời.'
    reason: alternative_reading
  - marker: c
    text: “Các vụ việc” chỉ những vấn đề hoặc vụ tranh chấp của dân được đưa ra để phân xử.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Bây giờ
  rationale: Giữ chức năng vừa chỉ thời điểm vừa chuyển sang lời chỉ dẫn tiếp theo của Giê-trô.
- source_word: שְׁמַע בְּקֹלִי
  choice: hãy nghe lời ta
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ Hê-bơ-rơ nghĩa đen là “hãy nghe tiếng ta”; không đẩy sắc thái thành mệnh lệnh phải tuyệt đối vâng phục.
- source_word: אִיעָצְךָ
  choice: ta sẽ khuyên con
  rationale: Diễn đạt trực tiếp động từ יעץ, nghĩa là khuyên bảo hoặc cố vấn, đồng thời phù hợp quan hệ giữa Giê-trô và Môi-se.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: và nguyện Đức Chúa Trời ở cùng con
  rationale: Dạng động từ biểu thị lời cầu chúc; “nguyện” truyền đạt rõ sắc thái ấy bằng tiếng Việt trang trọng, tự nhiên.
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: Con hãy đại diện cho dân trước mặt Đức Chúa Trời
  rationale: Chuyển ý cấu trúc sát chữ “hãy là người cho dân trước mặt Đức Chúa Trời” thành câu tiếng Việt dễ hiểu, nêu đúng vai trò đại diện của Môi-se.
- source_word: וְהֵבֵאתָ
  choice: và trình ... lên
  rationale: Trong chuỗi lời chỉ dẫn, động từ này nói đến việc Môi-se đem các vấn đề đến trước Đức Chúa Trời; “trình ... lên” tự nhiên hơn “mang ... đến” trong ngữ cảnh phân xử.
- source_word: הַדְּבָרִים
  choice: các vụ việc
  rationale: דְּבָרִים có nghĩa rộng là các việc hoặc vấn đề; ngữ cảnh xét xử cho thấy đây là những vụ việc được đưa ra để phân định, nhưng bản dịch vẫn tránh thu hẹp thành một loại tranh chấp cụ thể.
- source_word: אֶל הָאֱלֹהִים
  choice: lên Đức Chúa Trời
  rationale: Truyền đạt hướng của hành động đem các vụ việc đến Đức Chúa Trời bằng cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch אֱלֹהִים trong bối cảnh nói về Đức Chúa Trời của Y-sơ-ra-ên
  choice: Đức Chúa Trời
  alternative: Thần; các thần
  rationale: Dù hình thức từ có dạng số nhiều, cú pháp và bối cảnh ở đây chỉ rõ Đấng duy nhất mà Môi-se đến trước mặt; cách dịch chuẩn tiếng Việt là “Đức Chúa Trời”.
- issue: Mức độ diễn giải vai trò trung gian của Môi-se
  choice: đại diện cho dân trước mặt Đức Chúa Trời
  alternative: là người cho dân trước mặt Đức Chúa Trời
  rationale: Cấu trúc Hê-bơ-rơ mô tả Môi-se đứng về phía dân trước mặt Đức Chúa Trời. “Đại diện” làm rõ chức năng trong tiếng Việt mà không gán thêm một chức danh hay hệ thống thần học chuyên biệt.
- issue: Sắc thái của וִיהִי אֱלֹהִים עִמָּךְ
  choice: 'lời cầu chúc: “nguyện Đức Chúa Trời ở cùng con”'
  alternative: 'mệnh đề khẳng định: “Đức Chúa Trời sẽ ở cùng con”'
  rationale: Dạng mệnh lệnh gián tiếp của động từ phù hợp hơn với lời cầu chúc, nhưng chú thích vẫn ghi nhận khả năng diễn đạt ít hiển ngôn hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta–con” phù hợp lời người cha vợ lớn tuổi nói với Môi-se. Dấu chấm phẩy giữ nhịp của chuỗi lời khuyên; các thuật ngữ pháp lý quá chuyên môn được tránh để bảo toàn độ rộng của דְּבָרִים.
