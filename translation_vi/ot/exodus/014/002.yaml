  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: vi
  text: Hãy nói với con cái Y-sơ-ra-ên[a] rằng họ phải quay lại và đóng trại trước Pi Ha-hi-rốt, giữa Mích-đôn và biển. Trước Ba-anh Xê-phôn, đối diện nơi ấy[c], họ phải đóng trại bên biển.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân Y-sơ-ra-ên”. Nguyên văn Hê-bơ-rơ là “các con trai của Y-sơ-ra-ên”.
    reason: lexical_alternative
  - marker: b
    text: Pi Ha-hi-rốt, Mích-đôn và Ba-anh Xê-phôn là các địa danh, nên được phiên âm chứ không dịch nghĩa.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “hướng mặt về nơi ấy”. Đại từ trong cụm “đối diện nơi ấy” rất có thể chỉ Ba-anh Xê-phôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Hãy nói với
  rationale: Mệnh lệnh Piel được chuyển bằng “hãy”, còn אֶל được thể hiện tự nhiên bằng “với”; cách diễn đạt trang trọng nhưng thông dụng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc của nguyên văn “các con trai của Y-sơ-ra-ên”, trong khi “con cái” trong tiếng Việt có thể chỉ toàn thể cộng đồng, không chỉ nam giới.
- source_word: וְיָשֻׁבוּ וְיַחֲנוּ
  choice: họ phải quay lại và đóng trại
  rationale: Hai hình thái chỉ thị sau mệnh lệnh được diễn đạt như nội dung mệnh lệnh gián tiếp. “Quay lại” giữ ý đổi hướng; “đóng trại” là cách nói hiện đại, tự nhiên.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: trước Pi Ha-hi-rốt
  rationale: לִפְנֵי mang nghĩa không gian “trước”; địa danh được phiên âm thay vì giải nghĩa theo từ nguyên.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: giữa Mích-đôn và biển
  rationale: Cấu trúc בֵּין...וּבֵין xác định hai ranh giới; הַיָּם được dịch đơn giản là “biển”.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: Ở trước Ba-anh Xê-phôn
  rationale: Giữ quan hệ vị trí của לִפְנֵי và phiên âm địa danh.
- source_word: נִכְחוֹ
  choice: đối diện nơi ấy
  rationale: Diễn đạt vị trí đối diện và giữ đại từ giống đực số ít của tiếng Hê-bơ-rơ dưới dạng trung tính tự nhiên trong tiếng Việt; sở chỉ được ghi chú vì không hoàn toàn minh nhiên.
- source_word: תַחֲנוּ
  choice: các ngươi phải đóng trại
  rationale: Hình thái ngôi thứ hai số nhiều mang lực mệnh lệnh. “Các ngươi” làm rõ sự chuyển từ lời Đức Chúa Trời phán với Môi-se sang nội dung dành cho cả cộng đồng.
- source_word: עַל הַיָּם
  choice: bên biển
  rationale: Trong ngữ cảnh vị trí, עַל chỉ sự ở sát hoặc gần bờ biển, không phải ở trên mặt biển.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc mệnh lệnh gián tiếp được làm rõ bằng “họ phải”, còn mệnh lệnh trực tiếp số nhiều ở cuối câu được giữ bằng “các ngươi phải”. Các địa danh được phiên âm nhất quán; sự mơ hồ về sở chỉ của đại từ נִכְחוֹ được bảo lưu bằng chú thích.
