revisions:
- from: 'Họ nói với Môi-se: “Chẳng lẽ vì Ai Cập không có mồ chôn nên ông mới đem chúng tôi đi để chết trong hoang mạc sao? Ông đưa chúng tôi ra khỏi Ai Cập để làm gì chúng tôi thế này?”'
  to: 'Họ nói với Môi-se: “Chẳng lẽ vì Ai Cập không có mồ mả nên ông mới đem chúng tôi đi để chết trong hoang mạc sao? Ông đã làm gì chúng tôi thế này khi đưa chúng tôi ra khỏi Ai Cập?”'
  rationale: 'Sửa câu thứ hai để khôi phục trật tự và lực trách cứ của nguyên văn: trước hết họ hỏi Môi-se đã làm gì họ, rồi quy hành động ấy với việc ông đưa họ ra khỏi Ai Cập. Thay ‘mồ chôn’ bằng ‘mồ mả’ để tiếng Việt tự nhiên hơn. Không cần chú thích, vì không có biến thể hay mơ hồ văn bản nào đòi hỏi giải thích.'
  reviewer_model: gpt-5.6-terra
