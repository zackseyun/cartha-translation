    rationale: מַה־זֹּאת עָשִׂיתָ לָּנוּ đặt câu hỏi về điều Môi-se đã ‘làm cho/chống lại’ họ; לְהוֹצִיאָנוּ מִמִּצְרָיִם bổ sung hành động bị trách. ‘Ông đưa chúng tôi ra khỏi Ai Cập để làm gì chúng tôi thế này?’ dễ được hiểu là ‘vì mục đích gì ông đưa chúng tôi ra,’ và không tự nhiên về ngữ pháp.
  - severity: low
    issue: ‘Mồ chôn’ hơi gượng trong tiếng Việt hiện đại.
    rationale: ‘Mồ mả’ là cách nói tự nhiên hơn để chỉ các ngôi mộ/nghĩa địa trong lời mỉa mai này, mà không thay đổi nghĩa.
