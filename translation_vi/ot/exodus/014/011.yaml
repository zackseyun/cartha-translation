  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: vi
  text: 'Họ nói với Môi-se: “Chẳng lẽ vì Ai Cập không có mồ mả nên ông mới đem chúng tôi đi để chết trong hoang mạc sao? Ông đã làm gì chúng tôi thế này khi đưa chúng tôi ra khỏi Ai Cập?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: Họ nói với Môi-se
  rationale: Dùng lối kể chuyện tự nhiên trong tiếng Việt; אֶל chỉ người được nói với.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: Chẳng lẽ vì Ai Cập không có mồ chôn
  rationale: Diễn đạt câu hỏi tu từ đầy mỉa mai; “mồ chôn” tự nhiên và làm rõ ý nơi mai táng.
- source_word: לְקַחְתָּנוּ
  choice: ông mới đem chúng tôi đi
  rationale: Giữ nghĩa cơ bản của לקח là đem/lấy đi và sắc thái cáo buộc, đồng thời phân biệt với הוציא ở cuối câu.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: để chết trong hoang mạc
  rationale: Giữ quan hệ mục đích/kết quả của nguyên mẫu לָמוּת; “hoang mạc” chỉ vùng hoang vu, không nhất thiết chỉ là sa mạc cát.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: Ông đưa chúng tôi ra khỏi Ai Cập để làm gì chúng tôi thế này?
  rationale: Tái cấu trúc theo cú pháp tiếng Việt tự nhiên nhưng giữ câu hỏi cảm thán, hành động đưa ra khỏi Ai Cập và sắc thái cho rằng điều ấy gây hại cho họ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” thể hiện lời trách móc trực tiếp với Môi-se mà không thêm sắc thái giáo phái. Câu sau được sắp xếp lại tự nhiên trong tiếng Việt, không giải quyết hay làm nhẹ sự mỉa mai và hoảng sợ của dân chúng.
