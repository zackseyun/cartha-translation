base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: vi
  text: Quân Ai Cập đuổi theo và bắt kịp họ khi họ đang đóng trại bên biển—tất cả ngựa và chiến xa của Pha-ra-ôn, các kỵ binh cùng quân đội của ông—tại Pi-ha-hi-rốt, trước Ba-anh Xê-phôn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đối diện Ba-anh Xê-phôn.” Cụm từ Hê-bơ-rơ có thể chỉ một vị trí hướng về hoặc đối diện một địa danh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: Quân Ai Cập đuổi theo
  rationale: Chủ ngữ trong ngữ cảnh là lực lượng Ai Cập chứ không phải lãnh thổ; “quân Ai Cập” phù hợp với chuỗi liệt kê quân sự ở phần sau.
- source_word: וַיַּשִּׂיגוּ אוֹתָם
  choice: bắt kịp họ
  rationale: נשׂג ở đây chỉ việc lực lượng truy đuổi đuổi đến nơi; “bắt kịp” tự nhiên và không hàm ý họ đã bắt giữ dân Y-sơ-ra-ên.
- source_word: חֹנִים עַל הַיָּם
  choice: khi họ đang đóng trại bên biển
  rationale: Phân từ חֹנִים diễn tả tình trạng của dân Y-sơ-ra-ên lúc quân Ai Cập bắt kịp; עַל mang nghĩa vị trí nên dịch là “bên biển”.
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: tất cả ngựa và chiến xa của Pha-ra-ôn
  rationale: Cụm Hê-bơ-rơ cô đọng, có thể liên hệ ngựa với lực lượng chiến xa. Cách diễn đạt này rõ ràng trong tiếng Việt và giữ ý toàn bộ lực lượng chiến xa của Pha-ra-ôn.
- source_word: וּפָרָשָׁיו
  choice: các kỵ binh
  rationale: פָּרָשׁ chỉ người cưỡi ngựa hoặc quân cưỡi ngựa; “kỵ binh” là cách gọi hiện đại, súc tích trong văn cảnh quân sự.
- source_word: וְחֵילוֹ
  choice: cùng quân đội của ông
  rationale: חַיִל trong văn cảnh này chỉ lực lượng quân sự; “quân đội” rõ nghĩa và tự nhiên.
- source_word: עַל פִּי הַחִירֹת
  choice: gần Pi Ha-hi-rốt
  rationale: Đây là một địa danh đi với biểu thức chỉ vị trí; “gần” chuyển tải quan hệ địa lý mà không biến cấu trúc tên riêng thành một nghĩa từ nguyên suy đoán.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: đối diện Ba-anh Xê-phôn
  rationale: Trong mô tả địa điểm, לִפְנֵי có thể chỉ vị trí ở phía trước hoặc đối diện một địa danh; “đối diện” rõ hơn “trước” trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ra-ôn” theo cách phiên âm Kinh Thánh quen thuộc; phiên âm các địa danh để độc giả tiếng Việt có thể đọc thuận. Không thêm chú thích vì lựa chọn “đối diện” đã thể hiện trực tiếp nghĩa không gian thích hợp của לִפְנֵי trong ngữ cảnh.
