  - severity: medium
    issue: “đối diện Ba-anh Xê-phôn” không bảo tồn tính mơ hồ không gian của לִפְנֵי.
    rationale: לִפְנֵי có thể chỉ “trước mặt/ở phía trước” hoặc “đối diện”. Dùng “trước” trong câu chính và nêu phương án “đối diện” ở chú thích bảo toàn phạm vi nghĩa của nguyên ngữ.
  - severity: low
    issue: Cách viết “Pi Ha-hi-rốt” chưa nhất quán về gạch nối trong tên riêng.
    rationale: “Pi-ha-hi-rốt” thể hiện rõ đây là một địa danh phiên âm thống nhất.
