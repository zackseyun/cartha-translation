source:
  edition: WLC
  text: וַ/יִּקַּ֗ח שֵׁשׁ מֵא֥וֹת רֶ֨כֶב֙ בָּח֔וּר וְ/כֹ֖ל רֶ֣כֶב מִצְרָ֑יִם וְ/שָׁלִשִׁ֖ם עַל כֻּלּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/007.yaml
  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
translation:
  language: vi
  text: Ông đem theo sáu trăm chiến xa tinh nhuệ và toàn bộ chiến xa của Ai Cập, cùng các sĩ quan phụ trách tất cả số chiến xa ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thuật ngữ Hê-bơ-rơ ở đây có thể chỉ các sĩ quan chiến xa, những phụ tá quân sự tinh nhuệ hoặc các chỉ huy đi cùng chiến xa; cụm từ cũng có thể hiểu là họ ở trên tất cả các chiến xa ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Ông đem theo
  rationale: Động từ לקח ở dạng kể chuyện tiếp nối diễn biến. “Đem theo” tự nhiên trong ngữ cảnh Pha-ra-ôn huy động lực lượng mà không thêm ý nghĩa ngoài bản nguồn.
- source_word: שֵׁשׁ מֵאוֹת
  choice: sáu trăm
  rationale: Cụm số đếm trực tiếp.
- source_word: רֶכֶב
  choice: chiến xa
  rationale: רֶכֶב có thể chỉ một chiếc xe hoặc lực lượng chiến xa nói chung; với con số cụ thể và ngữ cảnh quân sự, “chiến xa” vừa rõ nghĩa vừa tự nhiên.
- source_word: בָּחוּר
  choice: tinh nhuệ
  rationale: Phân từ thụ động của בחר chỉ những chiếc được tuyển chọn, hàm ý thuộc lực lượng ưu tuyển; “tinh nhuệ” diễn đạt tự nhiên phẩm chất quân sự ấy.
- source_word: וְכֹל רֶכֶב מִצְרַיִם
  choice: và toàn bộ chiến xa của Ai Cập
  rationale: Cấu trúc sở hữu với כֹל chỉ toàn thể lực lượng chiến xa Ai Cập, ngoài sáu trăm chiến xa tinh nhuệ.
- source_word: וְשָׁלִשִׁם
  choice: cùng các sĩ quan
  rationale: שָׁלִישׁ là thuật ngữ quân sự chưa hoàn toàn chắc nghĩa, có thể chỉ sĩ quan, chỉ huy chiến xa hoặc phụ tá quân sự tinh nhuệ. “Các sĩ quan” giữ nghĩa chức vụ đủ rộng; chú thích bảo lưu các khả năng khác.
- source_word: עַל כֻּלּוֹ
  choice: phụ trách tất cả số chiến xa ấy
  rationale: Giới từ עַל cùng hậu tố số ít mang nghĩa tập thể, cho biết các sĩ quan được bố trí trên hoặc có trách nhiệm đối với toàn lực lượng chiến xa. “Phụ trách” là cách diễn đạt tự nhiên nhưng vẫn được chú thích để giữ độ mơ hồ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Dùng “chiến xa” thay vì từ cổ hoặc thuật ngữ kỹ thuật; chú thích giữ lại sự không chắc chắn của thuật ngữ quân sự שָׁלִישׁ và quan hệ của các sĩ quan với lực lượng chiến xa.
