  to: Ta sẽ làm cho lòng Pha-ra-ôn cứng lại[a], và Pha-ra-ôn sẽ đuổi theo họ. Ta sẽ được tôn vinh qua Pha-ra-ôn và toàn thể quân đội của ông[b], và người Ai Cập sẽ biết rằng Ta là Yahweh.” Họ đã làm như vậy.
