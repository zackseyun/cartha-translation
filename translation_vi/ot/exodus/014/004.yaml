base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: vi
  text: Ta sẽ làm cho lòng Pha-ra-ôn cứng lại[a], và Pha-ra-ôn sẽ đuổi theo họ. Ta sẽ được tôn vinh qua Pha-ra-ôn và toàn thể quân đội của ông[b], và người Ai Cập sẽ biết rằng Ta là Yahweh.” Họ đã làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta sẽ làm cho lòng Pha-ra-ôn vững mạnh.” Động từ Hê-bơ-rơ có nghĩa là làm cho mạnh hoặc vững; trong sách Xuất Hành, sự cứng vững ấy biểu hiện thành thái độ ngoan cố, nên dịch là “làm cho ... cứng lại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Ta sẽ được tôn vinh trên Pha-ra-ôn.” Cấu trúc Hê-bơ-rơ diễn tả Yahweh được tôn vinh trong mối liên hệ với Pha-ra-ôn và quân đội của ông, qua những điều sắp xảy đến; trong bối cảnh phán xét, điều này cũng hàm ý sự chiến thắng trên họ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: Ta sẽ làm cho ... cứng lại
  rationale: Dạng Hiphil trình bày Yahweh là chủ thể trực tiếp khiến lòng Pha-ra-ôn trở nên cứng rắn, ngoan cố. Cách dịch này tự nhiên trong tiếng Việt và không làm nhẹ quan hệ nhân quả rõ ràng của nguyên văn.
- source_word: לֵב
  choice: lòng
  rationale: Trong ngữ cảnh này, לֵב chỉ trung tâm của ý chí và quyết định. “Lòng” vừa giữ được hình ảnh Kinh Thánh vừa tự nhiên hơn “trái tim” trong tiếng Việt.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: hắn sẽ đuổi theo họ
  rationale: רדף + אחרי diễn tả việc truy đuổi. “Đuổi theo” rõ ràng, tự nhiên và phù hợp với cuộc truy kích quân sự.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: Ta sẽ được tôn vinh trên Pha-ra-ôn
  rationale: Dạng Niphal của כבד diễn tả Yahweh được tôn cao, còn בְּ trong bối cảnh phán xét có sắc thái chiến thắng đối với Pha-ra-ôn. “Được tôn vinh trên” bảo toàn cả ý vinh quang lẫn quan hệ đối kháng, dù cấu trúc hơi trang trọng.
- source_word: וּבְכָל חֵילוֹ
  choice: cùng toàn thể quân đội của hắn
  rationale: חַיִל ở đây là lực lượng quân sự của Pha-ra-ôn; “quân đội” là cách gọi hiện đại, rõ nghĩa.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: người Ai Cập sẽ biết
  rationale: Danh từ chỉ dân tộc đi với động từ số nhiều mang nghĩa người dân Ai Cập, nên dịch cụ thể là “người Ai Cập” thay vì quốc gia trừu tượng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời được biểu thị bằng Tứ tự, thay vì thay thế bằng một tước hiệu.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Họ làm đúng như vậy
  rationale: Câu kết thuật lại việc thi hành mệnh lệnh trước đó; “đúng như vậy” tự nhiên và thể hiện chính xác כֵּן.
theological_decisions:
- issue: Hành động của Đức Chúa Trời trong việc làm cứng lòng Pha-ra-ôn
  choice: 'Dịch trực tiếp quan hệ nhân quả: “Ta sẽ làm cho lòng Pha-ra-ôn cứng lại”'
  alternative: “Ta sẽ khiến lòng Pha-ra-ôn vững mạnh” hoặc “Ta sẽ để lòng Pha-ra-ôn trở nên cứng”
  rationale: Nguyên văn dùng Hiphil ngôi thứ nhất, xác định Yahweh là chủ thể tác động. Không đổi thành ý cho phép thụ động, đồng thời chú thích bảo lưu nghĩa từ vựng sát hơn là “làm mạnh/vững”.
- issue: Ý nghĩa của כבד trong bối cảnh phán xét
  choice: “Ta sẽ được tôn vinh trên Pha-ra-ôn”
  alternative: “Ta sẽ được tôn vinh qua Pha-ra-ôn”
  rationale: Bản dịch chính giữ sắc thái Yahweh bày tỏ vinh quang bằng chiến thắng và phán xét Pha-ra-ôn, nhưng chú thích thừa nhận cấu trúc Hê-bơ-rơ cũng có thể được diễn đạt theo phương tiện là “qua”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta” cho lời Yahweh và “hắn” cho Pha-ra-ôn để giữ quan hệ ngôi rõ ràng. Danh hiệu riêng “Yahweh” được giữ nguyên. Cụm “được tôn vinh trên” có chủ ý bảo toàn sắc thái đối kháng của בְּ trong bối cảnh chiến thắng, còn cách hiểu “qua” được ghi ở chú thích.
