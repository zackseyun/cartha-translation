  source_fidelity: 'Bản dịch chuyển tải chính xác mạch tự sự và các mệnh lệnh của tiếng Hê-bơ-rơ: Yahweh chất vấn Môi-se về việc kêu cầu Ngài, rồi truyền bảo ông nói với cộng đồng Israel để họ khởi hành. “Lên đường” phản ánh tốt וְיִסָּעוּ, vốn chỉ việc nhổ trại/khởi hành, mà không ép nghĩa hẹp là chỉ ‘đi thẳng về phía trước’.'
