  terminology: “Yahweh” nhất quán với quyết định dịch danh riêng יהוה. “Môi-se” và “Israel” là các dạng tên riêng quen thuộc. “Con cái Israel” là cách gọi tập thể Kinh Thánh tự nhiên cho בְּנֵי יִשְׂרָאֵל; chú thích “người Israel” nêu một lựa chọn thành ngữ hơn. Các neo chú thích được đặt đúng sau cụm từ liên hệ.
