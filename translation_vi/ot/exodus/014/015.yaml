  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se: “Tại sao con kêu cầu Ta? Hãy bảo con cái Israel[a] lên đường[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “tiến lên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng tự sự với waw nối tiếp đẩy câu chuyện sang hành động kế tiếp. “Bấy giờ” tạo mạch kể tự nhiên; “phán” phù hợp khi chủ thể là Đức Chúa Trời và giữ sắc thái trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu; dạng “Yahweh” là cách phiên âm học thuật thông dụng.
- source_word: מַה תִּצְעַק אֵלָי
  choice: Tại sao con kêu cầu Ta?
  rationale: מַה đi với động từ ở đây mang nghĩa chất vấn “tại sao”. צעק diễn tả tiếng kêu khẩn thiết trong cảnh nguy nan; “kêu cầu” tự nhiên trong tiếng Việt và giữ hướng của lời kêu về phía Đức Chúa Trời.
- source_word: דַּבֵּר אֶל
  choice: Hãy bảo
  rationale: Mệnh lệnh דבר với אֶל theo sát nghĩa là “hãy nói với”, nhưng trong ngữ cảnh truyền đạt chỉ thị, “hãy bảo” gọn, tự nhiên và không cường điệu thành “hãy ra lệnh”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: “Con cái Israel” vừa phản ánh hình thức huyết tộc của cụm Hê-bơ-rơ, vừa là cách gọi tập thể tự nhiên trong tiếng Việt; không thu hẹp cộng đồng chỉ còn nam giới.
- source_word: וְיִסָּעוּ
  choice: lên đường
  rationale: נסע chỉ việc nhổ trại hoặc bắt đầu di chuyển. “Lên đường” ngắn gọn, tự nhiên và phù hợp với mệnh lệnh bắt đầu cuộc hành trình; khả năng hiểu theo hướng “tiến lên” được giữ trong chú thích.
theological_decisions:
- issue: Cách chuyển danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Dùng danh riêng bảo toàn sự phân biệt giữa thánh danh giao ước và các tước hiệu, nhưng không gắn câu với cách giải thích riêng của một hệ phái.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: người Israel; các con trai Israel
  rationale: Trong ngữ cảnh này, cụm từ chỉ toàn thể cộng đồng Israel đang được truyền lệnh. “Con cái Israel” giữ hình ảnh dòng dõi mà không khiến độc giả hiểu sai rằng chỉ đàn ông phải lên đường.
- issue: Sắc thái chuyển động của וְיִסָּעוּ
  choice: lên đường
  alternative: tiến lên
  rationale: Động từ chủ yếu nói đến việc khởi hành, nhưng trong tình thế trước Biển Đỏ cũng có thể hàm ý đi về phía trước. Bản chính giữ nghĩa từ vựng rộng hơn, còn sắc thái theo ngữ cảnh được nêu ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “con” và “Ta” thể hiện lời Đức Chúa Trời trực tiếp nói với Môi-se mà không thêm sắc thái gay gắt ngoài câu chất vấn. Các dấu chú thích được đặt ngay sau cụm từ tương ứng.
