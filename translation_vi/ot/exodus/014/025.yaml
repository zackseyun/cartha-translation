base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: vi
  text: 'Ngài tháo bánh xe khỏi các chiến xa của Ai Cập[a], khiến chúng chạy một cách khó khăn. Ai Cập nói: “Ta hãy chạy trốn khỏi Israel[b], vì Đức Giê-hô-va đang chiến đấu cho họ, chống lại Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng “bánh xe” ở số ít theo nghĩa tập hợp và nói “các chiến xa của nó/người ấy,” với “Ai Cập” được nhân cách hóa.
    reason: Giải thích cấu trúc số ít bất thường của nguyên văn mà bản dịch tiếng Việt phải làm rõ.
  - marker: b
    text: 'Nguyên văn là lời ngôi thứ nhất số ít có sắc thái tự khuyến dụ: “Ta hãy chạy trốn.”'
    reason: Cho thấy bản dịch giữ nguyên cách “Ai Cập” được nhân cách hóa thay vì đổi thành “chúng ta”, đồng thời phản ánh sắc thái cohortative của động từ.
lexical_decisions:
- source_word: וַיָּסַר
  choice: tháo
  rationale: Động từ mang nghĩa loại bỏ/tháo ra; trong ngữ cảnh bánh xe chiến xa, “tháo” tự nhiên và sát nghĩa hơn “cất bỏ”.
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: bánh xe khỏi các chiến xa của Ai Cập
  rationale: Cụm Hê-bơ-rơ dùng “bánh xe” ở số ít theo nghĩa tập hợp và đại từ sở hữu giống đực số ít, quy chiếu về “Ai Cập” được nhân cách hóa. Nêu lại “Ai Cập” giúp tiếng Việt rõ nghĩa mà không đổi đối tượng.
- source_word: בִּכְבֵדֻת
  choice: nặng nhọc
  rationale: Diễn tả việc điều khiển hoặc di chuyển một cách khó khăn, nặng nề.
- source_word: אָנ֨וּסָה
  choice: Ta phải chạy trốn
  rationale: Hình thức ngôi thứ nhất số ít phù hợp với “Ai Cập” được nhân cách hóa; “phải” chuyển tải sắc thái thúc bách của thể động từ.
- source_word: מִפְּנֵי
  choice: khỏi
  rationale: Trong ngữ cảnh chạy trốn, giới từ chỉ việc rời xa hoặc thoát khỏi đối phương.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Thể hiện danh riêng của Đức Chúa Trời trong nguyên văn, theo cách gọi quen thuộc và dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Chủ thể số ít “Ai Cập” và lời nói ngôi thứ nhất số ít
  choice: 'Giữ cách nhân cách hóa: “Ai Cập nói: ‘Ta…’”'
  alternative: 'Chuẩn hóa thành “quân Ai Cập nói: ‘Chúng ta…’”'
  rationale: Nguyên văn cố ý dùng “Ai Cập” và động từ ngôi thứ nhất số ít. Giữ số ít bảo toàn hình thức tu từ và sự căng thẳng của văn bản thay vì âm thầm chuyển thành tập thể số nhiều.
- issue: Danh Đức Chúa Trời יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Chúa Trời
  rationale: Nguyên văn có danh riêng יהוה; cách dịch bằng danh xưng chung sẽ che khuất đặc điểm từ vựng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ngài” cho chủ thể thần linh đã rõ từ ngữ cảnh trước; giữ “Ai Cập” như một nhân vật tập thể ở số ít. Câu “khiến chúng di chuyển nặng nhọc” diễn đạt tự nhiên hậu quả đối với các chiến xa, đồng thời tránh khẳng định quá mức chủ thể của đại từ số ít khó hiểu trong nguyên văn.
