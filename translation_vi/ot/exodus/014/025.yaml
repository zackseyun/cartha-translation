revisions:
- from: 'Ngài tháo bánh xe khỏi các chiến xa của Ai Cập[a], khiến chúng di chuyển nặng nhọc. Ai Cập nói: “Ta phải chạy trốn khỏi Israel[b], vì Đức Giê-hô-va đang chiến đấu cho họ, chống lại Ai Cập.”'
  to: 'Ngài tháo bánh xe khỏi các chiến xa của Ai Cập[a], khiến chúng chạy một cách khó khăn. Ai Cập nói: “Ta hãy chạy trốn khỏi Israel[b], vì Đức Giê-hô-va đang chiến đấu cho họ, chống lại Ai Cập.”'
  rationale: Đổi “Ta phải chạy trốn” thành “Ta hãy chạy trốn” để bảo toàn sắc thái cohortative của אָנֻסָה, không thêm ý bắt buộc. Đổi nhẹ cách diễn đạt về chiến xa thành “chạy một cách khó khăn” để tiếng Việt tự nhiên hơn trong ngữ cảnh mà vẫn phản ánh việc chúng bị điều khiển/di chuyển khó khăn. Các yếu tố khác được giữ nguyên.
