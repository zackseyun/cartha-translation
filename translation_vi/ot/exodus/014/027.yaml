  text: וַ/יֵּט֩ מֹשֶׁ֨ה אֶת יָד֜/וֹ עַל הַ/יָּ֗ם וַ/יָּ֨שָׁב הַ/יָּ֜ם לִ/פְנ֥וֹת בֹּ֨קֶר֙ לְ/אֵ֣יתָנ֔/וֹ וּ/מִצְרַ֖יִם נָסִ֣ים לִ/קְרָאת֑/וֹ וַ/יְנַעֵ֧ר יְהוָ֛ה אֶת מִצְרַ֖יִם בְּ/ת֥וֹךְ הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: vi
  text: Môi-se giơ tay ra trên biển. Đến gần sáng, biển trở lại trạng thái bình thường[a], trong khi người Ai Cập đang chạy trốn về phía biển. Yahweh hất[b] người Ai Cập vào giữa biển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sức mạnh vốn có” hoặc “tình trạng ban đầu”. Cụm từ Hê-bơ-rơ cho biết biển trở lại trạng thái ổn định, thường lệ của nó.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ theo nghĩa đen là “giũ ra” hoặc “hất ra”, tạo nên hình ảnh sống động về việc Yahweh quăng người Ai Cập vào biển.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: giơ ... ra
  rationale: Động từ נטה đi với “tay” chỉ hành động đưa hoặc giơ tay ra; cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên hành động cụ thể.
- source_word: הַיָּם
  choice: biển
  rationale: Đây là danh từ thông thường chỉ biển; riêng câu này không đòi hỏi phải hiểu như một tên riêng.
- source_word: וַיָּשָׁב הַיָּם
  choice: biển trở lại
  rationale: שׁוב diễn tả việc trở về tình trạng trước đó; “trở lại” phù hợp với cụm từ theo sau.
- source_word: לִפְנוֹת בֹּקֶר
  choice: đến gần sáng
  rationale: Thành ngữ Hê-bơ-rơ chỉ lúc buổi sáng đang tới; cách dịch này tự nhiên, đồng thời giữ sắc thái thời điểm chuyển sang bình minh.
- source_word: לְאֵיתָנוֹ
  choice: trạng thái bình thường
  rationale: אֵיתָן có thể gợi sự bền vững, sức mạnh ổn định hoặc tình trạng vốn có. Trong ngữ cảnh nước biển khép lại sau khi bị rẽ ra, cách dịch này nói rõ biển trở về tình trạng thường lệ mà không giới hạn nghĩa vào dòng chảy hay sức mạnh.
- source_word: נָסִים לִקְרָאתוֹ
  choice: đang chạy trốn về phía biển
  rationale: 'Phân từ נָסִים diễn tả hành động đang tiếp diễn, còn לִקְרָאתוֹ có nghĩa là hướng tới hoặc đi gặp. Cách dịch giữ lại hình ảnh nghịch lý: họ chạy trốn nhưng lại tiến về phía biển đang trở lại.'
- source_word: וַיְנַעֵר
  choice: hất
  rationale: נער theo nghĩa đen là giũ hoặc hất ra. “Hất” giữ được hình ảnh mạnh và sống động, đồng thời tự nhiên hơn một lối dịch máy móc như “giũ người Ai Cập”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: בְּתוֹךְ הַיָּם
  choice: vào giữa biển
  rationale: תּוֹךְ chỉ phần giữa hoặc bên trong; với động từ mang ý chuyển động, “vào giữa biển” thể hiện cả hướng đi lẫn vị trí.
theological_decisions:
- issue: Cách chuyển dịch danh YHWH (יְהוָה)
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH. “Yahweh” bảo tồn chức năng tên riêng và là dạng phiên âm phù hợp với bằng chứng ngôn ngữ hiện có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” và “Ai Cập” theo cách gọi quen thuộc trong tiếng Việt; lặp lại “biển” thay cho đại từ để tránh mơ hồ. Các dấu chú thích được đặt ngay sau những từ ngữ mà chú thích giải thích.
