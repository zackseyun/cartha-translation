  yaml_path: translation/ot/exodus/014/006.yaml
  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: vi
  text: Vậy, Pha-ra-ôn thắng xe của mình[a] và đem dân mình theo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chuẩn bị xe của mình”; động từ Hê-bơ-rơ có nghĩa đen là “buộc” hoặc “cột”, ở đây chỉ việc thắng xe để sẵn sàng lên đường.
    reason: lexical_alternative
  - marker: b
    text: “Dân mình” có lẽ chỉ lực lượng đi cùng Pha-ra-ôn; nguyên văn Hê-bơ-rơ nói “dân của ông”, chứ không nói rõ là “quân đội của ông”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: thắng cương
  rationale: Động từ אָסַר có nghĩa cơ bản là “buộc, cột”; trong ngữ cảnh xe chiến mã, từ này chỉ việc buộc/thắng súc vật vào xe để khởi hành. “Thắng cương” diễn đạt hành động cụ thể và tự nhiên trong tiếng Việt.
- source_word: רִכְבּוֹ
  choice: xe chiến mã của mình
  rationale: Danh từ רֶכֶב có thể chỉ xe hoặc lực lượng chiến xa, nhưng dạng số ít kèm hậu tố ở đây tự nhiên nhất là chiếc xe riêng của Pha-ra-ôn. “Xe chiến mã” làm rõ đây là phương tiện quân sự do ngựa kéo.
- source_word: עַמּוֹ
  choice: người của mình
  rationale: עַם thường có nghĩa là “dân” hoặc “người”. Trong bối cảnh này, cụm từ chỉ những người đi cùng Pha-ra-ôn, rất có thể là lực lượng quân sự, nhưng nguyên văn không nói rõ là “quân đội”; cách dịch này giữ được độ mở ấy.
- source_word: לָקַח עִמּוֹ
  choice: đem theo
  rationale: Cụm động từ–giới từ này có nghĩa trực tiếp là đưa hoặc đem ai đó đi cùng. “Đem theo” ngắn gọn, tự nhiên và đúng quan hệ chủ động trong câu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Pha-ra-ôn” để xác định rõ chủ thể vốn được ngữ cảnh trước đó cung cấp; dùng “mình” làm đại từ phản thân tự nhiên, tránh lặp “ông”. Hai chú thích giữ lại nghĩa đen của động từ và sự không xác định về thành phần đi theo.
