id: EXO.14.10
reference: Exodus 14:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: vi
  text: Khi Pha-ra-ôn đến gần, con cái Israel[b] ngước mắt lên, thì kìa, người Ai Cập[a] đang tiến quân theo sau họ. Họ vô cùng sợ hãi, và con cái Israel kêu cầu Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “Ai Cập”; tên quốc gia được dùng theo nghĩa tập thể để chỉ lực lượng Ai Cập đang tiến theo sau họ.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn theo sát chữ là “các con trai của Israel”; đây là cách gọi tập thể dân Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: đến gần
  rationale: 'Dạng Hiphil của קרב tại đây mang nghĩa nội động với Pha-ra-ôn làm chủ ngữ: ông tiến đến gần, chứ không phải khiến vật gì đến gần.'
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: ngước mắt lên
  rationale: Chuyển ngữ tự nhiên thành ngữ Hê-bơ-rơ chỉ hành động nhìn lên, đồng thời giữ được sắc thái kể chuyện của nguyên văn.
- source_word: וְהִנֵּה
  choice: thì kìa
  rationale: Diễn tả điều bất ngờ hiện ra trước mắt và duy trì tính khẩn trương của cảnh tượng.
- source_word: מִצְרַיִם
  choice: người Ai Cập
  rationale: Danh xưng 'Ai Cập' được dùng theo nghĩa tập thể để chỉ lực lượng Ai Cập đang tiến theo sau dân Israel; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: đang tiến quân theo sau họ
  rationale: נסע chỉ sự di chuyển hoặc lên đường; trong bối cảnh quân sự, 'tiến quân' truyền đạt đúng chuyển động của lực lượng Ai Cập mà không thay hẳn bằng động từ mang nghĩa kết quả như 'truy đuổi'.
- source_word: וַיִּירְאוּ מְאֹד
  choice: họ vô cùng sợ hãi
  rationale: Giữ cường độ mạnh của động từ kết hợp với מְאֹד bằng lối diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיִּצְעֲקוּ
  choice: kêu cầu
  rationale: Động từ diễn tả tiếng kêu khẩn thiết trong cơn hoạn nạn; đối tượng là Yahweh nên 'kêu cầu' phù hợp với ngữ cảnh mà không làm mất tính cấp bách.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay thế bằng một tước hiệu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh quan hệ dòng dõi trong cụm Hê-bơ-rơ và chức năng chỉ toàn thể dân tộc, đồng thời là cách nói tự nhiên, quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; giữ 'Yahweh' phân biệt danh này với các tước hiệu và không áp đặt cách đọc thay thế truyền thống.
- issue: Ý nghĩa tập thể của בְנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel / các con trai Israel
  rationale: Cụm từ vừa có hình thức chỉ dòng dõi vừa là danh xưng tập thể của dân tộc. 'Con cái Israel' giữ được cả hai phương diện mà không giới hạn sai đối tượng chỉ còn nam giới.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Thì kìa” giữ hiệu lực kịch tính của וְהִנֵּה; “ngước mắt lên” bảo tồn thành ngữ nguồn mà vẫn dễ hiểu. Dấu câu chia cảnh quan sát và phản ứng sợ hãi thành hai câu để tiếng Việt sáng rõ.
