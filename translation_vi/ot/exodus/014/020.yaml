  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: vi
  text: Trụ mây ấy tiến đến giữa trại quân của Ai Cập và trại quân của Israel. Ở đó có đám mây và bóng tối, nhưng vẫn chiếu sáng đêm ấy[a]; suốt đêm ấy, bên này không đến gần bên kia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu Hê-bơ-rơ rất cô đọng. Các bản cổ và các bản dịch hiểu khác nhau về mối liên hệ giữa đám mây, bóng tối và ánh sáng đối với hai trại quân.
    reason: Nêu sự bất định có thật của cấu trúc nguyên văn mà không trình bày một cách dịch gần như trùng lặp như một phương án thay thế.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Nó đến
  rationale: Động từ giống đực số ít liên hệ với thiên sứ của Đức Chúa Trời hoặc trụ mây trong ngữ cảnh trước. Đại từ “nó” giữ được tính không xác định của chủ thể mà không thêm danh từ giải nghĩa.
- source_word: בֵּין ... וּבֵין
  choice: giữa ... và ...
  rationale: Diễn đạt tự nhiên và chính xác quan hệ không gian trong tiếng Việt.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: trại quân Ai Cập
  rationale: “Trại quân” phù hợp bối cảnh lực lượng Ai Cập đang truy đuổi, còn “Ai Cập” giữ hình thức danh xưng của nguyên văn.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: trại quân Israel
  rationale: Giữ danh xưng Israel và dùng “trại quân” để chỉ cộng đồng đang đóng trại trong bối cảnh đối đầu.
- source_word: הֶעָנָן וְהַחֹשֶׁךְ
  choice: đám mây và bóng tối
  rationale: Phản ánh hai danh từ xác định được đặt cạnh nhau trong câu Hê-bơ-rơ, đồng thời dùng cách nói tự nhiên trong tiếng Việt.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: nhưng nó soi sáng ban đêm
  rationale: Động từ אור mang nghĩa chiếu sáng. “Nhưng” thể hiện sự tương phản hàm ẩn giữa bóng tối và ánh sáng, song không xác định quá mức ánh sáng thuộc về phía nào.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: bên này không đến gần bên kia
  rationale: Thành ngữ זֶה אֶל־זֶה nói về hai phía; cách dịch này tự nhiên và cho thấy hai trại không thể tiếp cận nhau.
- source_word: כָּל־הַלָּיְלָה
  choice: suốt đêm ấy
  rationale: Truyền đạt đầy đủ ý kéo dài trong toàn bộ đêm và nối tự nhiên với lời kể.
theological_decisions:
- issue: Chủ thể của các động từ số ít “đến” và “soi sáng”
  choice: Dùng đại từ trung tính “nó” để không xác định rõ là thiên sứ hay trụ mây
  alternative: Dùng “Ngài” chỉ thiên sứ của Đức Chúa Trời, hoặc nói rõ “trụ mây”
  rationale: Ngữ cảnh ngay trước đó nhắc cả thiên sứ của Đức Chúa Trời lẫn trụ mây. Nguyên văn cho phép liên hệ động từ số ít với sự hiện diện được biểu hiện ấy nhưng không buộc phải giải quyết rõ chủ thể; vì vậy bản dịch giữ sự mơ hồ thật sự của văn bản.
- issue: Quan hệ giữa đám mây, bóng tối và ánh sáng đối với hai trại
  choice: 'Dịch sát cấu trúc ngắn gọn: “có đám mây và bóng tối, nhưng nó soi sáng ban đêm” và ghi chú sự bất định'
  alternative: Phân chia rõ bóng tối ở phía Ai Cập và ánh sáng ở phía Israel
  rationale: Câu Hê-bơ-rơ cô đọng và không nói tường minh mỗi hiện tượng thuộc phía nào. Không nên đưa cách phân chia diễn giải vào chính văn như thể nguyên văn đã nói rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Trại quân” làm rõ bối cảnh truy đuổi quân sự; “bên này ... bên kia” là cách diễn đạt tự nhiên cho hai phe. Dấu [a] được đặt ngay sau mệnh đề về hai trại, nơi ghi chú về cấu trúc và cách hiểu của phần kế tiếp có liên quan.
