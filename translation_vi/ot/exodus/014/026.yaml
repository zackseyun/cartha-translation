  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: vi
  text: 'Bấy giờ Yahweh phán với Môi-se: “Hãy giơ tay ngươi ra trên biển, để nước trở lại[a] phủ lên người Ai Cập, lên chiến xa và những người cưỡi ngựa của họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “và nước sẽ trở lại trên người Ai Cập, trên chiến xa và những người cưỡi ngựa của họ.” Động từ Hê-bơ-rơ có thể dịch theo thì tương lai đơn; trong ngữ cảnh này, nó cũng có thể diễn tả kết quả của hành động Môi-se được lệnh thực hiện.'
    reason: Giữ khả năng cú pháp của וְיָשֻׁבוּ là một tương lai đơn, bên cạnh cách hiểu theo kết quả/mục đích sau mệnh lệnh.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện. “Bấy giờ” diễn đạt tự nhiên trình tự ấy; “phán” phù hợp với lời Đức Chúa Trời trong văn phong Kinh Thánh trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời bằng lối phiên âm thông dụng, thay vì thay thế bằng một tước hiệu.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: Hãy giơ tay con ra
  rationale: Mệnh lệnh נְטֵה nói đến việc đưa hoặc duỗi tay ra. “Giơ tay ... ra” tự nhiên trong tiếng Việt và giữ được hành động cụ thể; đại từ “con” phù hợp khi Yahweh trực tiếp nói với Môi-se.
- source_word: עַל־הַיָּם
  choice: trên biển
  rationale: עַל ở đây mang nghĩa không gian “trên/ở phía trên”; cách dịch này giữ hình ảnh Môi-se giơ tay trên biển.
- source_word: וְיָשֻׁבוּ
  choice: để ... trở lại
  rationale: Sau mệnh lệnh, động từ có thể biểu thị kết quả hoặc mục đích dự định. “Để ... trở lại” diễn đạt tự nhiên sắc thái ấy nhưng không phủ nhận khả năng hiểu là tương lai đơn.
- source_word: הַמַּיִם
  choice: nước
  rationale: מַיִם có hình thức số nhiều trong tiếng Hê-bơ-rơ, nhưng “nước” là danh từ khối tự nhiên trong tiếng Việt; dịch “các dòng nước” sẽ bổ sung một nét nghĩa không có trong nguyên văn.
- source_word: עַל מִצְרַיִם
  choice: phủ trên người Ai Cập
  rationale: עַל mô tả nước trở lại trên người Ai Cập. Thêm “phủ” làm rõ hình ảnh bao phủ vốn có trong ngữ cảnh mà không chuyển thành nghĩa trừu tượng “chống lại”.
- source_word: עַל רִכְבּוֹ
  choice: chiến xa ... của họ
  rationale: רֶכֶב trong ngữ cảnh quân sự chỉ chiến xa. Hậu tố số ít quy chiếu đến Ai Cập/người Ai Cập như một tập thể; tiếng Việt tự nhiên dùng “của họ”.
- source_word: וְעַל פָּרָשָׁיו
  choice: và kỵ binh của họ
  rationale: פָּרָשׁ chỉ người cưỡi ngựa trong lực lượng quân sự. “Kỵ binh” ngắn gọn, hiện đại và phù hợp ngữ cảnh; hậu tố số ít tập thể được diễn đạt tự nhiên bằng “của họ”.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh Tứ Tự. Giữ “Yahweh” bảo tồn tư cách danh riêng và không thay nó bằng một tước hiệu.
- issue: Quan hệ giữa mệnh lệnh và việc nước trở lại
  choice: để nước trở lại
  alternative: và nước sẽ trở lại
  rationale: וְיָשֻׁבוּ có thể được hiểu theo sắc thái kết quả/mục đích sau mệnh lệnh hoặc như lời báo trước ở tương lai. Bản văn chính chọn cách đọc theo kết quả dự định, còn chú thích giữ lại khả năng kia.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “phán” cho lời của Yahweh, “chiến xa” và “kỵ binh” cho ngữ cảnh quân sự; tránh lối cổ quá mức. Dấu chú thích [a] được đặt ngay sau toàn bộ câu trích dẫn vì chú thích liên quan đến cấu trúc của mệnh đề kết quả.
