  text: וַ/יְדַבֵּ֥ר יְהֹוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Bấy giờ, Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; danh này thường được chuyển là “Yahweh” hoặc “Giê-hô-va”.'
    reason: Nêu dạng phụ âm Hê-bơ-rơ của danh thánh và các cách chuyển phổ biến; neo tại chính danh thánh.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ ... phán
  rationale: Dạng động từ có waw nối tiếp đưa trình thuật tiến sang sự việc kế tiếp; “bấy giờ” diễn đạt tự nhiên sắc thái tuần tự, còn “phán” phù hợp với lời nói trang trọng của Đức Chúa Trời.
- source_word: יְהוָה
  choice: YHWH
  rationale: Giữ nguyên bốn phụ âm của danh riêng trong bản Hê-bơ-rơ, tránh khẳng định một cách phát âm không được văn bản phụ âm bảo tồn.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu chỉ hành động nói hướng đến một người, tiếng Việt tự nhiên dùng “phán với”.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức nguyên ngữ mở đầu nội dung lời phán; “rằng” là cách diễn đạt gọn và tự nhiên trong tiếng Việt, thay vì sao chép máy móc thành “nói rằng” sau động từ “phán”.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יהוה
  choice: YHWH
  alternative: Yahweh; Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng Tetragrammaton. Giữ “YHWH” bảo tồn danh riêng và sự không chắc chắn thật sự về cách phát âm; chú thích nêu các cách đọc hoặc cách dịch quen thuộc mà không áp đặt một truyền thống giáo phái.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên đối với độc giả Việt Nam hiện đại. Dùng “phán” cho lời Đức Chúa Trời và giữ công thức dẫn lời bằng “rằng”. Dấu chú thích [a] được đặt ngay sau “Môi-se” theo lớp tham khảo tiếng Anh đã cung cấp, dù nội dung chú thích liên quan đến YHWH.
