  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: vi
  text: 'Người Ai Cập đuổi theo họ và tiến vào giữa biển: tất cả ngựa[a], chiến xa và kỵ binh của Pha-ra-ôn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng danh từ số ít “ngựa” theo nghĩa tập hợp: “tất cả ngựa của Pha-ra-ôn, chiến xa và kỵ binh của ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: đuổi theo
  rationale: Động từ רדף chỉ việc truy đuổi; “đuổi theo” tự nhiên, rõ nghĩa và phù hợp với bối cảnh quân sự.
- source_word: מִצְרַיִם
  choice: Người Ai Cập
  rationale: Dạng từ có thể chỉ đất nước hoặc dân Ai Cập, nhưng động từ số nhiều và ngữ cảnh cho thấy đây là người/quân Ai Cập.
- source_word: וַיָּבֹאוּ
  choice: tiến vào
  rationale: בוא là động từ chuyển động nghĩa rộng; “tiến vào” diễn đạt tự nhiên việc quân Ai Cập đi vào lối giữa biển mà không thêm ý ngoài ngữ cảnh.
- source_word: אַחֲרֵיהֶם
  choice: sau họ
  rationale: Cụm này chỉ việc theo sau trong cuộc truy đuổi; “sau họ” giữ sát cấu trúc và rõ nghĩa trong tiếng Việt.
- source_word: כֹּל
  choice: tất cả
  rationale: כֹּל bao quát các thành phần quân sự được liệt kê tiếp theo.
- source_word: סוּס פַּרְעֹה
  choice: ngựa của Pha-ra-ôn
  rationale: Danh từ số ít סוּס được dùng theo nghĩa tập hợp sau כֹּל; tiếng Việt có thể dùng “ngựa” như danh từ tập hợp tự nhiên.
- source_word: רִכְבּוֹ
  choice: chiến xa của Pha-ra-ôn
  rationale: רכב trong danh sách quân sự có thể chỉ các chiến xa hoặc lực lượng chiến xa; “chiến xa” cụ thể và dễ hiểu.
- source_word: וּפָרָשָׁיו
  choice: và kỵ binh của Pha-ra-ôn
  rationale: פָרָשׁ chỉ người cưỡi ngựa/lực lượng kỵ binh; “kỵ binh” là cách gọi hiện đại, trang trọng và phù hợp bối cảnh quân sự.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: vào giữa biển
  rationale: תּוֹךְ nhấn mạnh phần bên trong; “vào giữa biển” vừa tự nhiên vừa giữ được ý họ tiến sâu vào lòng biển.
