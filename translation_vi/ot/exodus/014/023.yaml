  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ rằng phần sau liệt kê toàn bộ lực lượng của Pha-ra-ôn đã tiến vào biển. Đại từ sở hữu lặp lại trong tiếng Hê-bơ-rơ được diễn đạt gọn bằng cụm “của Pha-ra-ôn” ở cuối danh sách.
