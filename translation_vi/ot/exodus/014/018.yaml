source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: vi
  text: Người Ai Cập sẽ biết Ta là Yahweh[a], khi Ta được tôn vinh qua Pha-ra-ôn, qua chiến xa và kỵ binh của Pha-ra-ôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi Ta làm rạng danh mình qua Pha-ra-ôn, qua chiến xa và kỵ binh của Pha-ra-ôn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Bấy giờ... sẽ biết
  rationale: Dạng hoàn thành Qal nối tiếp trong mạch tường thuật mang ý nghĩa kết quả tương lai; “bấy giờ” diễn đạt tự nhiên quan hệ kết quả trong ngữ cảnh.
- source_word: מִצְרַיִם
  choice: người Ai Cập
  rationale: Trong ngữ cảnh, từ này chỉ dân Ai Cập là những người sẽ nhận biết Yahweh, chứ không phải lãnh thổ Ai Cập.
- source_word: כִּי אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Giữ nguyên công thức nhận biết và dùng tên riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּהִכָּבְדִי
  choice: khi Ta được tôn vinh
  rationale: Động từ Niphal cho phép cách hiểu bị động “được tôn vinh”; cách dịch này bảo toàn hình thái và không xác định quá mức tác nhân.
- source_word: בְּפַרְעֹה
  choice: qua Pha-ra-ôn
  rationale: Giới từ בְּ có thể chỉ phương tiện hoặc phạm vi; “qua” diễn đạt việc vinh quang của Yahweh được bày tỏ qua sự kiện liên quan đến Pha-ra-ôn.
- source_word: בְּרִכְבּוֹ
  choice: chiến xa... của vua ấy
  rationale: רֶכֶב có nghĩa tập hợp là lực lượng chiến xa; “chiến xa” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: וּבְפָרָשָׁיו
  choice: và kỵ binh của vua ấy
  rationale: פָּרָשׁ chỉ người cưỡi ngựa hoặc lực lượng kỵ binh; “kỵ binh” phù hợp với ngữ cảnh quân sự và cặp đôi với chiến xa.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh YHWH. Phiên âm “Yahweh” giữ đây là danh riêng giao ước, không thay bằng tước hiệu.
- issue: Sắc thái của בְּהִכָּבְדִי
  choice: khi Ta được tôn vinh
  alternative: khi Ta làm rạng danh mình
  rationale: Niphal có thể được diễn đạt bằng bị động “được tôn vinh”, trong khi ngữ cảnh cũng cho phép ý Đức Chúa Trời bày tỏ vinh quang của Ngài. Bản chính giữ sắc thái hình thái; chú thích nêu cách diễn đạt chủ động.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Ta” cho lời Đức Chúa Trời, “Pha-ra-ôn” theo dạng quen thuộc trong tiếng Việt, và “vua ấy” để tránh đại từ sở hữu mơ hồ khi nói đến chiến xa cùng kỵ binh của Pha-ra-ôn.
