  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: vi
  text: 'Người ta báo cho vua Ai Cập rằng dân ấy đã chạy trốn; Pha-ra-ôn và các thuộc hạ của ông đổi lòng đối với dân ấy[a], và họ nói: “Chúng ta đã làm gì thế này, lại để cho Y-sơ-ra-ên ra đi, không còn phục dịch chúng ta nữa[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng của Pha-ra-ôn và các thuộc hạ của ông đã thay đổi đối với dân ấy,” hoặc, theo văn cảnh: “quay sang chống lại dân ấy.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lại phóng thích Y-sơ-ra-ên khỏi việc phục dịch chúng ta,” hoặc “không còn làm nô lệ cho chúng ta nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Người ta báo
  rationale: Dạng bị động/Hophal không nêu tác nhân. Cấu trúc vô nhân xưng “người ta báo” tự nhiên trong tiếng Việt và vẫn không xác định người báo tin.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: cho vua Ai Cập
  rationale: Diễn đạt trực tiếp và tự nhiên quan hệ sở thuộc trong tiếng Việt.
- source_word: כִּי בָרַח הָעָם
  choice: rằng dân ấy đã chạy trốn
  rationale: ברח mang nghĩa chạy trốn; “đã” phù hợp trình tự kể chuyện. “Dân ấy” giữ tính xác định và chỉ về đoàn dân vừa được nhắc đến.
- source_word: וַיֵּהָפֵךְ לְבַב
  choice: lòng ... đổi khác
  rationale: Giữ hình ảnh “lòng” là trung tâm ý chí và suy nghĩ, đồng thời diễn đạt sự đảo chiều thái độ bằng tiếng Việt tự nhiên.
- source_word: לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: lòng Pha-ra-ôn và các thuộc hạ của ông
  rationale: Giữ danh từ số ít “lòng” theo tiếng Hê-bơ-rơ; עֲבָדָיו trong bối cảnh triều đình được dịch là “các thuộc hạ của ông” thay vì đồng nhất họ với nô lệ.
- source_word: אֶל הָעָם
  choice: đối với dân ấy
  rationale: אֶל chỉ hướng của sự thay đổi thái độ. “Đối với” giữ được độ mở của giới từ, trong khi văn cảnh cho thấy sự thay đổi này trở nên thù nghịch.
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Dạng kể chuyện wayyiqtol được chuyển bằng quá khứ đơn hàm ẩn tự nhiên của tiếng Việt.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: Chúng ta đã làm gì thế này
  rationale: Giữ cả từ nghi vấn và sắc thái chỉ định của זֹאת, diễn tả sự sửng sốt và hối tiếc.
- source_word: שִׁלַּחְנוּ
  choice: để cho ... ra đi
  rationale: Trong ngữ cảnh này, שׁלח chỉ việc cho phép hoặc phóng thích Y-sơ-ra-ên ra đi; cách dịch cũng bảo toàn mô-típ xuyên suốt sách Xuất Hành.
- source_word: מֵעָבְדֵנוּ
  choice: không còn phục dịch chúng ta nữa
  rationale: מן với động từ עבד diễn tả chấm dứt việc phục dịch. Cách dịch này rõ nghĩa trong tiếng Việt mà không đưa từ “nô lệ” vào chính văn khi từ ấy không được nêu trực tiếp.
theological_decisions:
- issue: Hình ảnh nhân học לְבַב
  choice: lòng
  alternative: tâm trí; đổi ý
  rationale: “Lòng” bảo tồn hình ảnh Hê-bơ-rơ về trung tâm của ý chí và tư tưởng, thay vì thu hẹp thành một thuật ngữ tâm lý hiện đại.
- issue: Hướng thay đổi trong אֶל הָעָם
  choice: đổi khác đối với dân ấy
  alternative: quay sang chống lại dân ấy
  rationale: Văn cảnh hàm ý thái độ thù nghịch, nhưng giới từ và thành ngữ tự thân chỉ nói đến sự đổi hướng thái độ. Chính văn giữ độ mở; chú thích nêu cách hiểu rõ hơn theo văn cảnh.
- issue: Địa vị của Y-sơ-ra-ên trong מֵעָבְדֵנוּ
  choice: không còn phục dịch chúng ta nữa
  alternative: không còn làm nô lệ cho chúng ta nữa
  rationale: Toàn cảnh cho thấy ách nô lệ, nhưng cụm từ tại đây trực tiếp nói đến việc phục dịch. Bản dịch không tăng cường mức độ diễn giải trong chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Pha-ra-ôn” và “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; tránh cấu trúc quá cổ và không làm nhẹ đi giọng hối tiếc của giới cầm quyền Ai Cập.
