base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: vi
  text: Con dân Israel[a] đi vào giữa biển trên nền đất khô; nước là một bức tường cho họ, ở bên phải và bên trái họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “các con trai của Israel”; trong ngữ cảnh, cụm từ này chỉ dân Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: đi vào
  rationale: Động từ בוא trong mạch tường thuật này diễn tả chuyển động vào một nơi; “đi vào” tự nhiên và giữ được hướng chuyển động.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm này theo mặt chữ là “các con trai của Israel,” nhưng trong ngữ cảnh chỉ toàn thể dân tộc. “Con dân Israel” vừa gợi được quan hệ nguồn gốc vừa tự nhiên hơn trong tiếng Việt hiện đại; chú thích bảo lưu cách dịch sát.
- source_word: בְּתוֹךְ הַיָּם
  choice: giữa biển
  rationale: Giữ nghĩa không gian của בְּתוֹךְ là “ở giữa/bên trong,” không diễn giải thêm rằng họ đã đi xuyên qua biển.
- source_word: בַּיַּבָּשָׁה
  choice: trên nền đất khô
  rationale: Danh từ chỉ phần đất khô đối lập với nước; “nền đất khô” làm rõ đây là mặt đất dưới chân trong lòng biển.
- source_word: וְהַמַּיִם
  choice: còn nước
  rationale: Tiếng Việt tự nhiên dùng danh từ khối số ít “nước”; “còn” thể hiện sự chuyển ý sang hoàn cảnh của nước mà không làm thay đổi quan hệ mệnh đề.
- source_word: חֹמָה
  choice: một bức tường
  rationale: Danh từ có nghĩa trực tiếp là “tường”; không thêm từ so sánh “như,” vì nguyên văn không có dấu hiệu so sánh.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: ở bên phải và bên trái
  rationale: Diễn đạt tự nhiên vị trí tương ứng ở hai phía, đồng thời giữ cấu trúc song song của nguyên văn.
theological_decisions:
- issue: Nước được gọi trực tiếp là “tường” hay chỉ “như tường”
  choice: nước thành một bức tường
  alternative: nước như một bức tường
  rationale: Nguyên văn dùng danh từ חֹמָה trong mệnh đề danh từ và không có tiểu từ so sánh; bản dịch giữ hình ảnh khẳng định trực tiếp, không làm nhẹ đi bằng phép so sánh.
translation_notes:
  register: Văn phong tường thuật trang trọng nhưng hiện đại. “Con dân Israel” tránh cách hiểu “trẻ em Israel” mà vẫn phản ánh phần nào cấu trúc Hê-bơ-rơ; dấu chú thích được đặt ngay sau cụm từ liên quan.
