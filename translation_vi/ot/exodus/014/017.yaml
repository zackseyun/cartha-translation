  text: וַ/אֲנִ֗י הִנְ/נִ֤י מְחַזֵּק֙ אֶת לֵ֣ב מִצְרַ֔יִם וְ/יָבֹ֖אוּ אַחֲרֵי/הֶ֑ם וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: vi
  text: Và này, chính Ta đang làm cho người Ai Cập cứng lòng, để họ tiến vào theo sau dân Israel, và Ta sẽ được tôn vinh qua Pha-ra-ôn, qua toàn thể quân đội, các chiến xa và kỵ binh của Pha-ra-ôn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: này, chính Ta
  rationale: Giữ sắc thái nhấn mạnh vào chủ thể ngôi thứ nhất của cấu trúc הִנְנִי, đồng thời dùng cách diễn đạt trang trọng nhưng tự nhiên trong tiếng Việt hiện đại.
- source_word: מְחַזֵּק
  choice: đang làm cho ... trở nên cứng cỏi
  rationale: Phân từ Piel diễn tả hành động trực tiếp, đang diễn ra hoặc sắp xảy ra của Đức Chúa Trời. “Cứng cỏi” phù hợp với lòng quyết không lui bước trong mạch truyện mà không giảm nhẹ tác nhân thần linh.
- source_word: לֵב מִצְרַיִם
  choice: lòng người Ai Cập
  rationale: Giữ danh từ “lòng” ở số ít mang nghĩa tập thể như tiếng Hê-bơ-rơ; cách nói này vẫn tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: để họ tiến vào theo sau dân Israel
  rationale: “Tiến vào” làm rõ chuyển động vào lòng biển theo văn cảnh; “để” chuyển tải quan hệ mục đích hoặc kết quả mà không khẳng định quá mức một sắc thái duy nhất. Dùng “dân Israel” để làm rõ đại từ có thể gây lẫn trong tiếng Việt.
- source_word: וְאִכָּבְדָה
  choice: Ta sẽ được tôn vinh
  rationale: Dạng Niphal của כבד diễn tả Đức Chúa Trời được hiển lộ là đáng tôn kính qua sự phán xét; cách dịch này tự nhiên, trang trọng và giữ được sắc thái bị động của động từ.
- source_word: בְּפַרְעֹה
  choice: qua Pha-ra-ôn
  rationale: Giới từ ב có thể chỉ phương tiện hoặc phạm vi nơi vinh quang được bày tỏ. “Qua” giữ được khả năng Đức Chúa Trời được tôn vinh bằng chính việc xét xử Pha-ra-ôn, tránh ép nghĩa thành chỉ “trên”.
- source_word: חֵילוֹ
  choice: toàn thể quân đội của hắn
  rationale: Trong văn cảnh quân sự, חַיִל chỉ lực lượng vũ trang; “quân đội” là tương đương rõ ràng và hiện đại.
- source_word: רִכְבּוֹ
  choice: các chiến xa ... của hắn
  rationale: Danh từ số ít có nghĩa tập thể; số nhiều tiếng Việt diễn đạt tự nhiên toàn bộ lực lượng chiến xa.
- source_word: פָרָשָׁיו
  choice: kỵ binh của hắn
  rationale: Chỉ các chiến binh cưỡi ngựa; “kỵ binh” ngắn gọn, chính xác và quen thuộc trong văn cảnh quân sự.
theological_decisions:
- issue: Tác động của Đức Chúa Trời trong việc làm cứng lòng người Ai Cập
  choice: Dịch trực tiếp “chính Ta đang làm cho lòng người Ai Cập trở nên cứng cỏi”.
  alternative: “Ta để cho lòng họ trở nên cứng cỏi” hoặc “Ta làm họ mạnh lòng”.
  rationale: Nguyên văn quy hành động trực tiếp cho Đức Chúa Trời. Bản dịch giữ nguyên căng thẳng giữa quyền chủ tể của Ngài và trách nhiệm của con người, không biến hành động ấy thành sự cho phép thụ động.
- issue: Ý nghĩa của כבד trong bối cảnh phán xét
  choice: “Ta sẽ được tôn vinh qua Pha-ra-ôn”.
  alternative: “Ta sẽ tỏ vinh quang trên Pha-ra-ôn” hoặc “Ta sẽ được vinh hiển bởi Pha-ra-ôn”.
  rationale: Cách dịch đã chọn diễn đạt việc vinh quang của Đức Chúa Trời được bày tỏ qua sự thất bại và phán xét Pha-ra-ôn, đồng thời giữ sắc thái bị động của động từ và sự linh hoạt của giới từ ב.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” thích hợp với lời phán trực tiếp của Đức Chúa Trời; dùng “hắn” cho Pha-ra-ôn để tránh lặp tên nhưng vẫn phân biệt rõ các sở hữu ngữ. Không thêm chú thích vì các dị biệt từ vựng chính có thể được thể hiện hợp lý ngay trong bản văn.
