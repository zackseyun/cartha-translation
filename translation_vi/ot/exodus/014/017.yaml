revisions:
- from: Còn Ta—này, chính Ta đang làm cho lòng người Ai Cập trở nên cứng cỏi, để họ tiến vào theo sau dân Israel; và Ta sẽ được tôn vinh qua Pha-ra-ôn cùng toàn thể quân đội của hắn, qua các chiến xa và kỵ binh của hắn.
  to: Và này, chính Ta đang làm cho người Ai Cập cứng lòng, để họ tiến vào theo sau dân Israel, và Ta sẽ được tôn vinh qua Pha-ra-ôn, qua toàn thể quân đội, các chiến xa và kỵ binh của Pha-ra-ôn.
  rationale: Bản sửa thay cách diễn đạt có sắc thái tích cực bằng thành ngữ “cứng lòng,” điều chỉnh phần mở đầu cho tự nhiên hơn, và dùng lại tên riêng thay cho đại từ có sắc thái miệt thị. “Qua” được giữ cho giới từ בְּ vì đây là lựa chọn tiếng Việt tự nhiên, đồng thời không thu hẹp quan hệ ngữ nghĩa đang có thể được hiểu theo phạm vi/phương tiện trong văn cảnh phán xét.
  reviewer_model: gpt-5.6-terra
