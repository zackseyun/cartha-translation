  terminology: Giữ “chiến xa”, “Pha-ra-ôn”, “đạo quân”, và “kỵ binh”. Chú thích duy trì lựa chọn từ vựng thay thế sát với פָּרָשִׁים, không biến câu thành một diễn giải quân sự hiện đại.
