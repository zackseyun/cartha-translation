  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính của tiếng Hê-bơ-rơ: nước trở lại, phủ lấp chiến xa và lực lượng cưỡi ngựa; toàn bộ lực lượng Pha-ra-ôn đã theo sau họ vào biển không còn một ai. Tuy nhiên, “quân kỵ” không phải cách gọi hiện đại thông dụng bằng “kỵ binh”.'
