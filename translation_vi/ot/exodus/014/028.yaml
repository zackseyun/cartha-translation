  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: vi
  text: Nước trở lại và phủ lấp các chiến xa và kỵ binh[a]—toàn thể đạo quân của Pha-ra-ôn đã tiến vào biển theo sau họ; không còn lại dù chỉ một người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người cưỡi ngựa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: Nước trở lại
  rationale: שׁוב diễn tả nước trở về vị trí hoặc trạng thái trước đó. Tiếng Việt tự nhiên dùng danh từ tập hợp số ít “nước”.
- source_word: וַיְכַסּוּ
  choice: phủ lấp
  rationale: כסה có nghĩa cơ bản là che phủ. “Phủ lấp” phù hợp với cảnh nước tràn trở lại trên lực lượng Ai Cập mà không diễn giải quá mức.
- source_word: הָרֶכֶב
  choice: các chiến xa
  rationale: רֶכֶב ở đây chỉ chiến xa hoặc lực lượng chiến xa; “các chiến xa” cụ thể, dễ hiểu và phù hợp với hình ảnh của câu.
- source_word: הַפָּרָשִׁים
  choice: quân kỵ
  rationale: Từ này chỉ những chiến binh cưỡi ngựa hoặc lực lượng kỵ binh. “Quân kỵ” ngắn gọn, trang trọng và giữ được nghĩa tập thể; chú thích nêu cách dịch cụ thể hơn.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: toàn thể đạo quân của Pha-ra-ôn
  rationale: חֵיל trong ngữ cảnh này là lực lượng quân sự, còn לְכֹל nhấn mạnh toàn bộ lực lượng được xác định ngay sau đó.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: đã tiến vào biển theo sau họ
  rationale: Cách dịch thể hiện hành động tiến vào biển để truy đuổi, giữ đại từ “họ” như trong tiếng Hê-bơ-rơ và phù hợp với trình tự câu chuyện.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: không còn lại dù chỉ một người
  rationale: Thành ngữ Hê-bơ-rơ nhấn mạnh sự không còn sót một ai; “dù chỉ một người” truyền đạt rõ sắc thái tuyệt đối ấy.
theological_decisions:
- issue: Phạm vi lực lượng của Pha-ra-ôn bị tiêu diệt
  choice: Lời khẳng định không còn một người nào áp dụng cho toàn thể lực lượng của Pha-ra-ôn đã tiến vào biển theo sau dân Y-sơ-ra-ên.
  alternative: Hiểu câu này là nói mọi binh sĩ Ai Cập ở mọi nơi đều bị tiêu diệt.
  rationale: Mệnh đề phân từ הַבָּאִים אַחֲרֵיהֶם בַּיָּם giới hạn “toàn thể đạo quân” vào nhóm đã truy đuổi họ trong biển. Bản dịch giữ cả tính tuyệt đối của lời tuyên bố lẫn giới hạn cú pháp đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ rằng “toàn thể đạo quân của Pha-ra-ôn” đồng vị với các chiến xa và quân kỵ; dấu chấm phẩy giữ mệnh đề kết luận nhấn mạnh trong cùng một câu.
