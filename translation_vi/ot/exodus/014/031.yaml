  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: vi
  text: Israel thấy quyền năng lớn lao mà Yahweh đã thể hiện đối với Ai Cập[a]. Dân chúng kính sợ Yahweh và tin cậy Yahweh cùng Môi-se, tôi tớ của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “bàn tay lớn lao mà Yahweh đã làm đối với Ai Cập.” “Bàn tay” là hình ảnh chỉ quyền năng. Giới từ cũng có thể được hiểu là “tại Ai Cập” hoặc, theo ngữ cảnh, “chống lại Ai Cập.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: thấy
  rationale: Động từ ראה chỉ sự trực tiếp nhận biết điều vừa xảy ra; “thấy” là cách dịch tự nhiên và sát nghĩa.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Giữ danh từ tập hợp số ít của tiếng Hê-bơ-rơ và tạo sự tương ứng với “dân chúng” ở vế sau.
- source_word: הַיָּד הַגְּדֹלָה
  choice: bàn tay vĩ đại
  rationale: Giữ hình ảnh nguyên văn “bàn tay” và mô-típ quyền năng xuyên suốt sách Xuất Hành; “vĩ đại” phản ánh גָּדוֹל mà không diễn giải hoàn toàn thành “quyền năng”.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: mà Yahweh đã thi thố trên Ai Cập
  rationale: “Thi thố” kết hợp tự nhiên với hình ảnh “bàn tay”, truyền đạt hành động quyền năng của Yahweh; “trên Ai Cập” giữ độ rộng nghĩa của giới từ בְ tốt hơn cách xác quyết hoàn toàn là “chống lại” hay chỉ địa điểm “tại”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וַיִּירְאוּ
  choice: kính sợ
  rationale: “Kính sợ” bảo tồn cả yếu tố sợ hãi lẫn lòng tôn kính trong ירא và phù hợp văn phong tiếng Việt hiện đại trang trọng.
- source_word: הָעָם
  choice: dân chúng
  rationale: Phản ánh danh từ tập hợp “dân” mà không thêm định danh không có trong nguyên văn.
- source_word: וַיַּאֲמִינוּ בַּיהוָה
  choice: tin nơi Yahweh
  rationale: Hiphil của אמן đi với בְ diễn tả tin cậy hướng về một đối tượng; “tin nơi” giữ sắc thái quan hệ ấy.
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: cũng như nơi Môi-se, tôi tớ của Ngài
  rationale: Giữ cùng cấu trúc אמן + בְ dành cho Yahweh và Môi-se, đồng thời “tôi tớ của Ngài” làm rõ địa vị lệ thuộc của Môi-se.
theological_decisions:
- issue: Bản chất lòng tin của Israel đối với Môi-se
  choice: Dân tin nơi Yahweh và cũng tin nơi Môi-se trong tư cách tôi tớ, người đại diện được Ngài chỉ định.
  alternative: Dân chỉ tin lời Yahweh và lời Môi-se, hoặc đặt Môi-se ngang hàng với Yahweh như hai đối tượng tương đương của đức tin.
  rationale: Nguyên văn lặp lại cấu trúc אמן + בְ cho cả hai đối tượng, nhưng danh xưng “tôi tớ của Ngài” xác định rõ Môi-se ở địa vị thuộc quyền Yahweh; bản dịch giữ nguyên sức căng đó mà không đồng nhất hai vị.
- issue: Sắc thái của ירא
  choice: kính sợ
  alternative: sợ hãi; kính reverence thuần túy
  rationale: Trong bối cảnh dân chứng kiến sự giải cứu và phán xét của Yahweh, từ này có thể bao hàm cả nỗi sợ và lòng tôn kính; “kính sợ” không loại bỏ hoàn toàn yếu tố nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ danh xưng “Yahweh”, hình ảnh “bàn tay”, cùng sự song hành giữa lòng tin nơi Yahweh và nơi Môi-se; dùng “kính sợ” để bảo tồn bề rộng nghĩa của nguyên ngữ.
