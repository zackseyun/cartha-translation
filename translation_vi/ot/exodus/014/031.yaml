    rationale: Trong tiếng Việt, “thi thố” không vận hành tự nhiên khi “bàn tay” là chủ thể và “trên Ai Cập” là bổ ngữ. Điều này che khuất ý về hành động quyền năng của Yahweh.
  - severity: low
    issue: Cụm “tin nơi Yahweh cũng như nơi Môi-se” gượng và yếu đi tính song hành.
    rationale: Nguyên văn dùng cùng một cấu trúc tin cậy với Yahweh và Môi-se. “Tin cậy Yahweh cùng Môi-se” diễn đạt song hành ấy trực tiếp hơn, trong khi cụm bổ ngữ “tôi tớ của Ngài” vẫn xác định địa vị phụ thuộc của Môi-se.
