base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: vi
  text: 'Vì Pha-ra-ôn sẽ nói về con cái Y-sơ-ra-ên rằng: “Chúng đang bối rối trong xứ[a]; hoang mạc đã vây kín chúng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng đang hoang mang trong xứ” hoặc “Chúng bị mắc kẹt trong xứ.” Từ Hê-bơ-rơ có thể diễn tả sự bối rối, mất phương hướng hoặc lâm vào thế khó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Vì ... sẽ nói
  rationale: Trong mạch văn, Đức Chúa Trời đang báo trước phản ứng của Pha-ra-ôn, nên thể tương lai là phù hợp; liên từ được dịch là “Vì” để thể hiện chức năng giải thích của câu.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Dạng phiên âm quen thuộc và trang trọng trong tiếng Việt Kinh Thánh.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: về con cái Y-sơ-ra-ên
  rationale: Giới từ ל đi với động từ “nói” ở đây có thể chỉ đối tượng được nói đến. “Con cái Y-sơ-ra-ên” bảo tồn thành ngữ Hê-bơ-rơ mà vẫn dễ hiểu.
- source_word: נְבֻכִים
  choice: đang bối rối
  rationale: Phân từ diễn tả tình trạng hoang mang, mất phương hướng hoặc lúng túng; “đang bối rối” không thêm ý “lang thang” vốn không được nói rõ trong nguyên văn.
- source_word: הֵם
  choice: chúng đang
  rationale: Thể hiện rõ đại từ làm chủ ngữ và trạng thái đang tiếp diễn của phân từ.
- source_word: בָּאָרֶץ
  choice: trong xứ
  rationale: “Xứ” là cách dịch gọn, trang trọng của אֶרֶץ và không xác định quá mức phạm vi địa lý.
- source_word: סָגַר עֲלֵיהֶם
  choice: đã vây hãm chúng
  rationale: Diễn đạt hình ảnh bị khép kín, mắc kẹt hoặc không còn đường thoát; tự nhiên hơn trong tiếng Việt so với cách dịch từng chữ “đóng chúng lại”.
- source_word: הַמִּדְבָּר
  choice: hoang mạc
  rationale: מִדְבָּר chỉ vùng hoang vu, không nhất thiết là sa mạc cát; “hoang mạc” phù hợp với bối cảnh và văn phong trang trọng.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ “con cái Y-sơ-ra-ên,” đồng thời dùng “về” để làm rõ rằng Pha-ra-ôn nói về họ chứ không nói trực tiếp với họ. Dấu chân chú [a] xuất hiện ngay sau cụm từ có tính đa nghĩa.
