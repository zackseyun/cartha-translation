  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֣וֹךְ הַ/יָּ֑ם וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: vi
  text: Nhưng con cháu Y-sơ-ra-ên đi trên đất khô giữa lòng biển[a]; nước biển là bức tường cho họ, ở bên phải và bên trái họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Còn dân Y-sơ-ra-ên đi trên đất khô giữa biển.”'
    reason: Giới từ ו có thể là “và/còn” thay vì “nhưng”; בני ישראל cũng có thể được diễn đạt gọn là “dân Y-sơ-ra-ên”, và בתוך הים là “giữa biển” hoặc “qua giữa biển”.
  - marker: b
    text: 'Nguyên văn: “nước là bức tường cho họ”; một số người hiểu theo nghĩa “như một bức tường”.'
    reason: חֹמָה có nghĩa là “bức tường” và không đi với tiểu từ so sánh, nhưng trong ngữ cảnh câu này vẫn có thể được hiểu như một hình ảnh ví von.
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Nhưng con cháu Y-sơ-ra-ên
  rationale: בני ישראל là cách gọi mang sắc thái huyết tộc và dân tộc. “Con cháu Y-sơ-ra-ên” tự nhiên hơn lối dịch máy móc “các con trai của Y-sơ-ra-ên” mà vẫn giữ được hình ảnh gia tộc; “nhưng” thể hiện sự tương phản với số phận quân Ai Cập trong văn cảnh.
- source_word: הָלְכוּ
  choice: đi
  rationale: הלך ở đây chỉ việc tiến bước qua biển; “đi” là cách diễn đạt tự nhiên, không buộc phải xác định chi tiết hơn về cách di chuyển.
- source_word: בַיַּבָּשָׁה
  choice: trên đất khô
  rationale: יבשה chỉ phần đất hay nền đất khô, đối lập với nước biển.
- source_word: בְּתוֹךְ הַיָּם
  choice: giữa lòng biển
  rationale: בתוך diễn tả vị trí ở giữa hoặc bên trong; “giữa lòng biển” giữ hình ảnh không gian rõ nét và trang trọng trong tiếng Việt.
- source_word: וְהַמַּיִם
  choice: nước biển
  rationale: מים có hình thức số nhiều trong tiếng Hê-bơ-rơ, nhưng tiếng Việt dùng danh từ khối “nước”; thêm “biển” làm rõ sở chỉ theo văn cảnh.
- source_word: לָהֶם חֹמָה
  choice: là bức tường cho họ
  rationale: חומה có nghĩa trực tiếp là “tường thành/bức tường”, còn לָהֶם diễn tả quan hệ đối với họ. Bản chính không tự thêm từ so sánh “như”.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: ở bên phải và bên trái
  rationale: Giữ cấu trúc song song của nguyên văn và chỉ rõ nước ở hai phía của dân Y-sơ-ra-ên.
theological_decisions:
- issue: Cách dịch בני ישראל
  choice: con cháu Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: Cách chọn giữ sắc thái gia tộc của nguyên văn nhưng không khiến độc giả hiện đại hiểu sai rằng câu chỉ nói đến nam giới; cách gọi thuần dân tộc được ghi nhận như một lối dịch tự nhiên khác.
- issue: חֹמָה là lời đồng nhất hay phép so sánh
  choice: là bức tường
  alternative: như một bức tường
  rationale: Nguyên văn không có tiểu từ so sánh, nên bản chính giữ lời khẳng định trực tiếp. Chú thích bảo tồn khả năng hiểu theo phép ví von mà không làm yếu cách diễn đạt của nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Y-sơ-ra-ên” theo lối phiên âm quen thuộc trong tiếng Việt; giữ nhịp cân đối “bên phải và bên trái” cùng hình ảnh mạnh của nguyên văn.
