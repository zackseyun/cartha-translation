  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hê-bơ-rơ: בני ישראל, việc đi trên đất khô ở giữa biển, và nước làm bức tường ở hai phía. Tuy nhiên, cụm cuối trong bản nháp có thể khiến “ở bên phải và bên trái” bổ nghĩa cho “bức tường”, thay vì xác định rõ hai phía của dân Y-sơ-ra-ên.'
