  terminology: “Con cháu Y-sơ-ra-ên,” “đất khô,” và “bức tường” là các lựa chọn chấp nhận được. Giữ “bức tường” trong bản văn chính là phù hợp, vì חֹמָה không có tiểu từ so sánh. Chú thích bảo lưu cách hiểu “như một bức tường” mà không áp đặt nó lên bản văn.
