  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: vi
  text: Còn con, hãy giơ cây gậy của con lên, vươn tay con ra trên biển và rẽ biển ra, để con cái Y-sơ-ra-ên[a] đi vào giữa biển trên đất khô.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; cụm từ này chỉ dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Còn con
  rationale: Liên từ cùng đại từ độc lập tạo thế đối chiếu và nhấn mạnh Môi-se; “Còn con” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: הָרֵם אֶת מַטְּךָ
  choice: hãy giơ cây gậy của con lên
  rationale: הרים ở thể Hiphil là mệnh lệnh nâng/giơ lên; “cây gậy” là cách gọi hiện đại, tự nhiên của מַטֶּה trong trình thuật về Môi-se.
- source_word: וּנְטֵה אֶת יָדְךָ עַל הַיָּם
  choice: đưa tay trên biển
  rationale: נטה diễn tả việc duỗi hoặc đưa tay ra; עַל giữ quan hệ không gian “trên” biển mà không xác định quá mức hướng hay điểm chạm.
- source_word: וּבְקָעֵהוּ
  choice: và rẽ biển ra
  rationale: בקע có nghĩa chẻ, tách hoặc rẽ ra. Trong tiếng Việt, “rẽ biển ra” vừa tự nhiên vừa diễn tả rõ việc nước biển bị tách đôi.
- source_word: וְיָבֹאוּ
  choice: để ... đi vào
  rationale: Trong chuỗi mệnh lệnh này, dạng vị hoàn với waw nêu kết quả hoặc mục đích dự kiến; “để” truyền đạt quan hệ đó tự nhiên.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “các con trai của Y-sơ-ra-ên”, nhưng trong ngữ cảnh chỉ toàn thể dân giao ước. “Con cái Y-sơ-ra-ên” giữ hình ảnh huyết thống và bao gồm cả cộng đồng.
- source_word: בְּתוֹךְ הַיָּם
  choice: vào giữa biển
  rationale: בְּתוֹךְ chỉ phần giữa hoặc bên trong; “vào giữa biển” bảo tồn hình ảnh không gian và hướng chuyển động của động từ בוא.
- source_word: בַּיַּבָּשָׁה
  choice: trên đất khô
  rationale: Danh từ chỉ phần đất khô đối lập với nước biển; cách dịch này nhấn mạnh tính lạ thường của lối đi qua lòng biển.
theological_decisions:
- issue: Phạm vi chỉ người của בְנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Hình thức ngữ pháp là giống đực số nhiều, nhưng cụm từ là cách gọi toàn thể dân Y-sơ-ra-ên. Bản dịch chính không thu hẹp đoàn dân vào nam giới, đồng thời chú thích bảo tồn hình thức nguyên ngữ.
- issue: Tác nhân trong mệnh lệnh וּבְקָעֵהוּ
  choice: rẽ biển ra
  alternative: khiến biển rẽ ra; phân biển ra
  rationale: Nguyên văn trực tiếp truyền lệnh cho Môi-se và không giải thích tại đây mối quan hệ giữa hành động của ông với quyền năng Đức Chúa Trời. Bản dịch giữ nguyên sức căng ấy thay vì thêm tác nhân hoặc cơ chế thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp lời Đức Chúa Trời phán trực tiếp với Môi-se. Dùng “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; tránh từ cổ như “gậy trượng” hoặc cấu trúc nặng tính Hán-Việt.
