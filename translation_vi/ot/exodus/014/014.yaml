  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: vi
  text: Yahweh sẽ chiến đấu cho anh em, còn anh em sẽ im lặng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh em phải im lặng,” “anh em hãy giữ im lặng,” hoặc theo lối truyền thống, “anh em hãy nín lặng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay bằng một tước hiệu, để phản ánh trực tiếp danh YHWH trong bản Hê-bơ-rơ.
- source_word: יִלָּחֵם
  choice: sẽ chiến đấu
  rationale: Dạng Niphal chưa hoàn thành của לחם chỉ hành động tương lai; “chiến đấu” giữ rõ sắc thái quân sự và tự nhiên trong tiếng Việt hiện đại.
- source_word: לָכֶם
  choice: thay cho anh em
  rationale: Giới từ ל với hậu tố ngôi thứ hai số nhiều diễn tả hành động vì lợi ích hoặc đại diện cho dân; “thay cho anh em” tự nhiên và rõ nghĩa trong ngữ cảnh.
- source_word: וְאַתֶּם
  choice: còn anh em
  rationale: Liên từ cùng đại từ độc lập tạo thế tương phản giữa hành động của Yahweh và phần của dân; “còn” diễn đạt tự nhiên sự tương phản ấy.
- source_word: תַּחֲרִישׁוּן
  choice: sẽ im lặng
  rationale: Động từ Hiphil chưa hoàn thành của חרשׁ có nghĩa là im lặng, giữ yên lặng. Dạng thức có thể được hiểu là lời xác quyết hoặc mang sắc thái mệnh lệnh; bản chính giữ cách đọc tương lai sát hình thái và chú thích nêu khả năng mệnh lệnh.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự YHWH; phiên âm “Yahweh” bảo tồn danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái của תַּחֲרִישׁוּן
  choice: sẽ im lặng
  alternative: phải im lặng; hãy giữ yên lặng
  rationale: Hình thái chưa hoàn thành tự nhiên cho phép cách hiểu tương lai, trong khi ngữ cảnh khích lệ có thể tạo lực mệnh lệnh. Không nên âm thầm loại bỏ sự mơ hồ này, nên bản chính dùng tương lai và ghi phương án mệnh lệnh trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai số nhiều chỉ cộng đồng Israel; “còn” làm rõ sự tương phản vốn có trong cú pháp Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau mệnh đề có cách hiểu khác.
