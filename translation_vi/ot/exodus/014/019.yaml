  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: vi
  text: Bấy giờ thiên sứ của Đức Chúa Trời[a], vị vốn đi trước trại quân Israel, dời chỗ và đi ra phía sau họ; trụ mây dời khỏi phía trước họ và đứng ở phía sau họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ giả của Đức Chúa Trời”. Từ Hê-bơ-rơ này có thể mang nghĩa “thiên sứ” hoặc “sứ giả”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: chuyển
  rationale: Động từ נסע thường chỉ việc nhổ trại hoặc lên đường, nhưng ở đây thiên sứ và trụ mây đổi vị trí từ phía trước ra phía sau Israel. “Chuyển” diễn đạt đúng chuyển động trong không gian mà không hàm ý bắt đầu một hành trình mới.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: thiên sứ của Đức Chúa Trời
  rationale: מַלְאָךְ có thể chỉ “sứ giả” hoặc “thiên sứ”. Trong ngữ cảnh về vị dẫn đường thuộc thiên giới, “thiên sứ” là cách dịch tự nhiên và quen thuộc, còn khả năng “sứ giả” được giữ trong chú thích.
- source_word: הַהֹלֵךְ
  choice: vị vẫn đi
  rationale: Phân từ diễn tả hành động đang tiếp diễn trước khi vị ấy đổi chỗ. Từ “vẫn” thể hiện vai trò dẫn đường trước đó mà không khiến câu tiếng Việt nặng nề.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: phía trước trại quân Israel
  rationale: לִפְנֵי mang nghĩa không gian là “ở phía trước”; מַחֲנֶה ở đây là trại quân hay đoàn người đóng trại của Israel. Cách dịch này giữ được hình ảnh không gian cụ thể.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: ra phía sau họ
  rationale: מֵאַחֲרֵי chỉ vị trí phía sau, không phải hành động đuổi theo. “Ra phía sau họ” diễn đạt rõ sự thay đổi vị trí của thiên sứ.
- source_word: עַמּוּד הֶעָנָן
  choice: trụ mây
  rationale: Cách nói ngắn gọn, tự nhiên trong tiếng Việt và giữ nguyên hình ảnh cụ thể của עַמּוּד הֶעָנָן.
- source_word: מִפְּנֵיהֶם
  choice: từ phía trước họ
  rationale: Cụm từ chỉ vị trí ở phía trước và đối xứng với מֵאַחֲרֵיהֶם, nên được dịch rõ ràng theo nghĩa không gian.
- source_word: וַיַּעֲמֹד
  choice: đến đứng
  rationale: עמד có nghĩa cơ bản là “đứng”. Trong chuỗi chuyển động này, “đến đứng” cho thấy trụ mây chuyển đến rồi giữ vị trí phía sau họ mà không thêm ý nghĩa quân sự.
theological_decisions:
- issue: Thân phận và bản tính của מַלְאַךְ הָאֱלֹהִים
  choice: Dịch là “thiên sứ của Đức Chúa Trời” nhưng không xác định đây là một thiên sứ thọ tạo, sự hiện hiện của chính Đức Chúa Trời hay một sự hiện hiện của Đấng Christ.
  alternative: “Sứ giả của Đức Chúa Trời”, hoặc một cách dịch xác định rõ đây là sự hiện hiện thần linh.
  rationale: Bản văn gọi nhân vật này là מַלְאַךְ הָאֱלֹהִים nhưng không giải thích bản thể của vị ấy trong câu này. Giữ danh xưng theo nghĩa từ vựng và chú thích nghĩa thay thế giúp bảo toàn sự căng thẳng thần học thay vì áp đặt một kết luận giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Trại quân Israel” giữ sắc thái của một cộng đồng đang đóng trại; các cụm “phía trước” và “phía sau” làm rõ bố cục không gian. Dấu chấm phẩy bảo toàn hai hành động song song của thiên sứ và trụ mây.
