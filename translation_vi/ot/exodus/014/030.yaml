  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: vi
  text: Ngày hôm ấy, Yahweh đã cứu Israel khỏi tay Ai Cập[a], và Israel thấy người Ai Cập chết trên bờ biển[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “khỏi tay Ai Cập,” một thành ngữ chỉ việc được giải thoát khỏi quyền lực của Ai Cập.'
    reason: cultural_note
  - marker: b
    text: 'Hoặc: “trên bờ của biển.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: đã cứu
  rationale: Dạng Hifil của ישׁע chỉ hành động Yahweh giải cứu Israel khỏi hiểm nguy và quyền lực của Ai Cập. “Cứu” tự nhiên, trực tiếp và giữ được sức nặng thần học của động từ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: בַּיּוֹם הַהוּא
  choice: trong ngày ấy
  rationale: Diễn đạt tự nhiên cụm từ chỉ thời gian, đồng thời giữ sắc thái chỉ định của הַהוּא.
- source_word: מִיַּד מִצְרָיִם
  choice: khỏi tay Ai Cập
  rationale: Giữ hình ảnh “tay” trong thành ngữ Hê-bơ-rơ, ở đây nói đến quyền lực hoặc sự kiểm soát của Ai Cập.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: Ai Cập / những người Ai Cập
  rationale: Ở mệnh đề đầu, tên gọi chỉ quốc gia và quyền lực Ai Cập; ở mệnh đề sau, từ này chỉ những người Ai Cập đã chết mà Israel nhìn thấy.
- source_word: וַיַּרְא
  choice: thấy
  rationale: Cách dịch trực tiếp và tự nhiên của ראה trong văn kể chuyện.
- source_word: מֵת
  choice: chết
  rationale: Tính từ số ít trong nguyên văn có nghĩa tập thể; tiếng Việt dùng “chết” tự nhiên với cụm “những người Ai Cập” mà không thêm hình ảnh không có trong bản Hê-bơ-rơ.
- source_word: עַל שְׂפַת הַיָּם
  choice: trên bờ biển
  rationale: שְׂפַת có nghĩa đen là “mép/môi” và trong ngữ cảnh này chỉ bờ biển; “trên bờ biển” là cách diễn đạt hiện đại, rõ ràng.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu, nhưng không thêm diễn giải giáo phái.
- issue: Sắc thái của động từ וַיּוֹשַׁע
  choice: đã cứu
  alternative: đã giải cứu
  rationale: “Đã cứu” giữ Yahweh làm chủ thể trực tiếp của hành động cứu thoát và không thu hẹp ý nghĩa vào chiến thắng quân sự בלבד.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại và dễ hiểu. Giữ thành ngữ “khỏi tay” vì tự nhiên trong tiếng Việt, đồng thời giải thích ý nghĩa trong chú thích. Dùng “những người Ai Cập” ở mệnh đề sau để làm rõ danh từ tập thể chỉ những thi thể được nhìn thấy.
