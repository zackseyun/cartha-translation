source:
  edition: WLC
  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: vi
  text: CHÚA làm cứng lòng Pha-ra-ôn, vua Ai Cập[a], và ông truy đuổi dân Israel, trong khi dân Israel đang ra đi với tay giơ cao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho lòng Pha-ra-ôn trở nên mạnh mẽ” hoặc “kiên định”. Động từ Hê-bơ-rơ có nghĩa đen là “làm cho mạnh/vững”, nhưng trong sách Xuất Hành, cách nói này thường mang nghĩa “làm cứng lòng”.'
    reason: lexical_alternative
  - marker: b
    text: Thành ngữ Hê-bơ-rơ có nghĩa đen là “với tay giơ cao”; cũng có thể hiểu là “mạnh dạn” hoặc “hiên ngang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Đức Yahweh
  rationale: Dùng tên riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu; thêm “Đức” để câu văn tiếng Việt tự nhiên và trang trọng.
- source_word: וַיְחַזֵּק
  choice: làm cứng
  rationale: Trong mô-típ lặp lại về lòng Pha-ra-ôn, cách dịch này truyền đạt việc ý chí ông trở nên cứng cỏi, đồng thời chú thích giữ lại nghĩa từ nguyên “làm cho mạnh/vững”.
- source_word: לֵב
  choice: lòng
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt về trung tâm của ý chí và thái độ, nhất là trong cụm “làm cứng lòng”.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Pha-ra-ôn, vua Ai Cập
  rationale: Giữ đầy đủ danh xưng và chức vị, với dấu phẩy phù hợp cú pháp tiếng Việt.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: ông truy đuổi
  rationale: “Truy đuổi” tự nhiên, súc tích và giữ sắc thái thù địch, quân sự của động từ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  rationale: Đây là cách gọi tập thể tự nhiên trong tiếng Việt hiện đại; lặp lại cụm từ ở cả hai vế để giữ hiệu ứng tu từ của nguyên văn.
- source_word: יֹצְאִים
  choice: đang ra đi
  rationale: Từ “đang” phản ánh sắc thái tiếp diễn của phân từ Hê-bơ-rơ khi Pha-ra-ôn truy đuổi.
- source_word: בְּיָד רָמָה
  choice: với bàn tay giơ cao
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hê-bơ-rơ thay vì chỉ diễn giải là “mạnh dạn” hay “hiên ngang”; chú thích nêu nghĩa hàm ý.
theological_decisions:
- issue: Hành động của Đức Yahweh trong việc làm cứng lòng Pha-ra-ôn
  choice: Đức Yahweh làm cứng lòng Pha-ra-ôn
  alternative: Đức Yahweh làm cho lòng Pha-ra-ôn trở nên mạnh mẽ/kiên định
  rationale: Nguyên văn trực tiếp quy hành động này cho Đức Yahweh. Bản dịch giữ nguyên sức nặng và sự căng thẳng thần học ấy, không giảm nhẹ quan hệ tác động, đồng thời ghi nhận phương án từ vựng trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu văn giữ sự lặp lại “dân Israel” của nguyên văn và hình ảnh “bàn tay giơ cao”, tránh giải thích quá mức ngay trong chính văn.
