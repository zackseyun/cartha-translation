id: EXO.14.24
reference: Exodus 14:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: vi
  text: Vào canh sáng[a], Yahweh từ trong trụ lửa và mây[b] nhìn xuống trại quân Ai Cập, rồi làm cho trại quân Ai Cập rối loạn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Canh sáng” là phiên canh cuối của ban đêm, gần lúc rạng đông.
    reason: historical_context
  - marker: b
    text: 'Cũng có thể dịch: “qua trụ lửa và mây.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “làm cho trại quân Ai Cập hoảng loạn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: vào canh sáng
  rationale: Cụm từ chỉ phiên canh cuối của ban đêm, gần lúc trời sáng. “Canh sáng” ngắn gọn, tự nhiên và giữ được nét thời gian cụ thể của nguyên văn.
- source_word: וַיַּשְׁקֵף
  choice: nhìn xuống
  rationale: Động từ ở dạng này thường diễn tả việc nhìn ra hoặc nhìn xuống từ một vị trí cao; “nhìn xuống” giữ được hướng nhìn hàm ý trong ngữ cảnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: trại quân Ai Cập
  rationale: Trong ngữ cảnh truy đuổi quân sự, cụm từ chỉ doanh trại hoặc đoàn quân của người Ai Cập; “trại quân Ai Cập” rõ nghĩa và gọn trong tiếng Việt.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: từ trong trụ lửa và mây
  rationale: Giới từ בְּ có thể mang sắc thái vị trí hoặc phương tiện. “Từ trong” diễn đạt tự nhiên điểm nhìn của Yahweh, còn khả năng hiểu là “qua” được giữ trong chú thích.
- source_word: וַיָּהָם
  choice: làm cho ... rối loạn
  rationale: Động từ diễn tả việc gây náo loạn, hoang mang hoặc hỗn loạn. Cách dịch này giữ lực gây khiến mà không nói quá thành một cuộc tan chạy hoàn toàn.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Cách hiểu hành động của Yahweh qua hoặc trong trụ lửa và mây
  choice: Yahweh nhìn xuống từ trong trụ lửa và mây
  alternative: Yahweh nhìn xuống qua trụ lửa và mây
  rationale: Giới từ Hebrew cho phép cả sắc thái vị trí lẫn phương tiện. Bản chính chọn cách hiểu theo vị trí nhưng chú thích giữ lại cách hiểu theo phương tiện, tránh giải quyết dứt khoát một điểm còn có thể hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể chuyện của tiếng Hebrew, dùng “canh sáng” để bảo tồn cách phân chia thời gian cổ, và lặp lại “trại quân Ai Cập” như nguyên văn để nhấn mạnh đối tượng của cả hai hành động.
