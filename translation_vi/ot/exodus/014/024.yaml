  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố của nguyên văn: mốc thời gian “canh sáng”, Yahweh nhìn xuống, trại quân Ai Cập, trụ lửa và mây, và hành động gây rối loạn. “Từ trong trụ lửa và mây” là một cách hiểu vị trí hợp lý của בְּ; chú thích giữ cách hiểu phương tiện “qua”, nên không áp đặt một cách hiểu duy nhất. “Làm cho ... rối loạn” phản ánh đúng sắc thái gây náo loạn/hoang mang của וַיָּהָם mà không cường điệu thành tan rã hoàn toàn.'
