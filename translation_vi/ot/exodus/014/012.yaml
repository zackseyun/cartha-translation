base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: vi
  text: 'Chẳng phải đây là điều chúng tôi đã nói với ông tại Ai Cập sao: ‘Hãy để chúng tôi yên, để chúng tôi làm tôi cho người Ai Cập’? Vì thà làm tôi cho người Ai Cập còn hơn chết trong hoang mạc.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַל מִמֶּנּוּ
  choice: Hãy để mặc chúng tôi
  rationale: Diễn đạt tự nhiên mệnh lệnh theo nghĩa đen là ngừng can thiệp đến chúng tôi, tương đương ‘để chúng tôi yên’.
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם / עֲבֹד אֶת־מִצְרַיִם
  choice: cho chúng tôi phục dịch người Ai Cập / phục dịch người Ai Cập
  rationale: Động từ עבד trong ngữ cảnh này chỉ việc làm tôi tớ, lao dịch dưới quyền Ai Cập; ‘phục dịch’ giữ sắc thái lệ thuộc rõ hơn ‘phục vụ’.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: Chỉ vùng hoang vu nơi dân Israel đang đi qua, không nhất thiết là sa mạc toàn cát.
theological_decisions:
- issue: Sắc thái thời gian của טוֹב לָנוּ עֲבֹד
  choice: thà phục dịch người Ai Cập còn hơn chết trong hoang mạc
  alternative: phục dịch người Ai Cập đã tốt hơn cho chúng tôi
  rationale: Cấu trúc so sánh trong tiếng Hê-bơ-rơ không đánh dấu thì rõ ràng. Cách dùng ‘thà… còn hơn…’ giữ trọng tâm lựa chọn được người nói nêu ra mà không áp đặt một cách giải nghĩa thì quá khứ phản thực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng ‘ông’ vì cả cộng đồng đang nói với Môi-se; ‘người Ai Cập’ diễn đạt đối tượng tập thể của מִצְרַיִם một cách tự nhiên trong tiếng Việt.
