- from: 'Chẳng phải ngay từ khi còn ở Ai Cập, chúng tôi đã nói với ông rằng: ‘Hãy để mặc chúng tôi, cho chúng tôi phục dịch người Ai Cập’ sao? Vì thà phục dịch người Ai Cập còn hơn chết trong hoang mạc.”'
  to: 'Chẳng phải đây là điều chúng tôi đã nói với ông tại Ai Cập sao: ‘Hãy để chúng tôi yên, để chúng tôi làm tôi cho người Ai Cập’? Vì thà làm tôi cho người Ai Cập còn hơn chết trong hoang mạc.'
