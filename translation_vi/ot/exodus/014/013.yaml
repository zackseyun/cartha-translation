source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ הִֽתְיַצְב֗וּ וּ/רְאוּ֙ אֶת יְשׁוּעַ֣ת יְהוָ֔ה אֲשֶׁר יַעֲשֶׂ֥ה לָ/כֶ֖ם הַ/יּ֑וֹם כִּ֗י אֲשֶׁ֨ר רְאִיתֶ֤ם אֶת מִצְרַ֨יִם֙ הַ/יּ֔וֹם לֹ֥א תֹסִ֛יפוּ לִ/רְאֹתָ֥/ם ע֖וֹד עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: vi
  text: 'Môi-se nói với dân chúng: “Đừng sợ! Hãy đứng vững và nhìn xem sự giải cứu của Đức Giê-hô-va mà Ngài sẽ thực hiện cho anh em hôm nay. Vì những người Ai Cập mà anh em thấy hôm nay, anh em sẽ không bao giờ còn thấy họ nữa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְיַצְבוּ
  choice: Hãy đứng vững
  rationale: Diễn đạt mệnh lệnh đứng yên, giữ nguyên vị trí và vững lòng trong hoàn cảnh nguy cấp.
- source_word: יְשׁוּעַת
  choice: sự giải cứu
  rationale: Trong ngữ cảnh quân Ai Cập truy đuổi, từ này chỉ hành động Đức Chúa Trời cứu dân khỏi hiểm nguy; “sự giải cứu” tự nhiên và cụ thể trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng giao ước quen thuộc trong truyền thống Kinh Thánh tiếng Việt, thay vì đồng nhất danh này với tước hiệu “Chúa”.
- source_word: מִצְרַיִם
  choice: những người Ai Cập
  rationale: Dù hình thức từ có thể chỉ Ai Cập, ngữ cảnh và đại từ số nhiều tiếp theo cho thấy quân/người Ai Cập đang truy đuổi là đối tượng được nói đến.
- source_word: עַד עוֹלָם
  choice: không bao giờ còn ... nữa
  rationale: Cụm Hê-bơ-rơ nhấn mạnh sự chấm dứt vĩnh viễn; cấu trúc tiếng Việt này truyền đạt tự nhiên đầy đủ lực nghĩa ấy.
theological_decisions:
- issue: Chủ thể của sự giải cứu
  choice: Giữ rõ Đức Giê-hô-va là Đấng thực hiện sự giải cứu
  alternative: Diễn đạt chung là dân sẽ được giải cứu
  rationale: Mệnh đề אֲשֶׁר יַעֲשֶׂה לָכֶם quy hành động trực tiếp cho Đức Giê-hô-va; bản dịch không làm mờ trọng tâm thần học này.
- issue: Phạm vi của lời “không bao giờ còn thấy”
  choice: Giữ lời khẳng định tuyệt đối như nguyên văn
  alternative: Giới hạn thành “không còn thấy đạo quân này nữa”
  rationale: Nguyên văn nói “những người Ai Cập” và “đến đời đời”; không tự ý thu hẹp đối tượng dù ngữ cảnh có thể hàm ý lực lượng đang truy đuổi.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dân chúng” cho העם; trong lời trực tiếp dùng “anh em” để chỉ cộng đồng Y-sơ-ra-ên, tránh sắc thái quá khẩu ngữ. Giữ nhịp ba mệnh lệnh ngắn và mạnh: “Đừng sợ! Hãy đứng vững và nhìn xem...”'
