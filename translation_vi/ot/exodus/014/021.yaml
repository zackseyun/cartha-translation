source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת יָד/וֹ֮ עַל הַ/יָּם֒ וַ/יּ֣וֹלֶךְ יְהוָ֣ה אֶת הַ֠/יָּם בְּ/ר֨וּחַ קָדִ֤ים עַזָּה֙ כָּל הַ/לַּ֔יְלָה וַ/יָּ֥שֶׂם אֶת הַ/יָּ֖ם לֶ/חָרָבָ֑ה וַ/יִּבָּקְע֖וּ הַ/מָּֽיִם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: vi
  text: Bấy giờ, Môi-se giơ tay ra trên biển. Yahweh dùng một cơn gió đông mạnh[a] thổi biển rút đi suốt cả đêm, biến biển thành đất khô, và nước bị rẽ ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cơn gió đông dữ dội.”'
    reason: Tính từ עַזָּה có thể nhấn mạnh cả sức mạnh lẫn mức độ dữ dội của cơn gió.
lexical_decisions:
- source_word: וַיֵּט ... אֶת־יָדוֹ
  choice: giơ tay ra
  rationale: Động từ נָטָה đi với “tay” diễn tả hành động đưa hoặc giơ tay ra; cách dịch này tự nhiên trong tiếng Việt và giữ nguyên hành động cụ thể.
- source_word: עַל־הַיָּם
  choice: trên biển
  rationale: Giới từ עַל có thể mang nghĩa “trên, hướng trên, đối với”; trong cảnh Môi-se giơ tay, “trên biển” vừa sát cấu trúc vừa tự nhiên.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת־הַיָּם
  choice: Yahweh ... khiến biển rút đi
  rationale: Dạng Hiphil của הָלַךְ mang ý gây khiến. Trong ngữ cảnh biển mở lối, “khiến biển rút đi” truyền đạt rõ tác động mà không mô tả thêm cơ chế ngoài câu gốc.
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: dùng một cơn gió đông mạnh
  rationale: רוּחַ ở đây là “gió” vì được xác định là gió đông và là phương tiện tác động lên biển; עַזָּה được dịch tự nhiên là “mạnh”.
- source_word: כָּל־הַלַּיְלָה
  choice: suốt cả đêm
  rationale: Giữ đầy đủ ý về khoảng thời gian kéo dài trong nguyên văn.
- source_word: וַיָּשֶׂם אֶת־הַיָּם לֶחָרָבָה
  choice: biến biển thành đất khô
  rationale: חָרָבָה chỉ đất hoặc nền đất khô; “biến biển thành đất khô” giữ biển làm đối tượng của hành động như trong tiếng Hê-bơ-rơ.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: nước bị rẽ ra
  rationale: Dạng Niphal của בָּקַע diễn tả nước bị chẻ hoặc tách ra; “bị rẽ ra” rõ nghĩa, sinh động và giữ sắc thái bị động.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo tồn danh giao ước thay vì thay bằng một tước hiệu; câu không bổ sung cách giải thích thần học ngoài văn bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo dạng tên quen thuộc; giữ danh riêng “Yahweh”. Trật tự câu được điều chỉnh nhẹ cho tự nhiên nhưng vẫn bảo toàn chuỗi hành động và quan hệ phương tiện trong nguyên văn.
