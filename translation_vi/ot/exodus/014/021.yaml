  source_fidelity: Bản dịch truyền đạt đúng chuỗi hành động, tác nhân Yahweh, phương tiện là gió đông mạnh, thời lượng suốt đêm, biển thành đất khô và nước bị tách ra. Tuy nhiên, cụm “dùng một cơn gió đông mạnh khiến biển rút đi” có thể khiến gió là chủ thể trực tiếp của mệnh đề “khiến”, trong khi tiếng Hê-bơ-rơ nêu Yahweh là tác nhân khiến biển chuyển/rút bằng gió. Cần đặt rõ trạng ngữ phương tiện cho Yahweh.
  naturalness: “Môi-se giơ tay ra trên biển” và “nước bị rẽ ra” đều tự nhiên, trang trọng. “Yahweh dùng ... khiến” không sai nhưng hơi nặng và kém mạch lạc hơn “Yahweh dùng gió đông mạnh thổi biển rút đi”.
  terminology: “Yahweh”, “Môi-se”, “gió đông mạnh”, và “đất khô” nhất quán, hiện đại và phù hợp nguyên ngữ. Không cần áp đặt cách hiểu giáo phái nào.
