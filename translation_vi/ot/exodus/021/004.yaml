source:
  edition: WLC
  text: אִם אֲדֹנָי/ו֙ יִתֶּן ל֣/וֹ אִשָּׁ֔ה וְ/יָלְדָה ל֥/וֹ בָנִ֖ים א֣וֹ בָנ֑וֹת הָ/אִשָּׁ֣ה וִ/ילָדֶ֗י/הָ תִּהְיֶה֙ לַֽ/אדֹנֶ֔י/הָ וְ/ה֖וּא יֵצֵ֥א בְ/גַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: vi
  text: Nếu chủ của anh cho anh một vợ, và người vợ ấy sinh cho anh con trai hoặc con gái, thì người vợ ấy và các con sẽ thuộc về chủ của người vợ ấy; còn anh sẽ ra đi một mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa là anh ra đi mà không có người vợ và các con do chủ đã cho trong thời gian anh phục dịch.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Giữ nguyên hình thức điều kiện của điều luật theo lối tình huống.
- source_word: אֲדֹנָיו
  choice: chủ
  rationale: Trong bối cảnh pháp luật về cảnh nô lệ, “chủ” diễn đạt quan hệ quyền lực trực tiếp và không gợi đến tước hiệu dành cho Đức Chúa Trời.
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: cho anh một người vợ
  rationale: אִשָּׁה có thể là “người phụ nữ” hoặc “vợ”; việc nàng sinh con cho người nam trong trường hợp này cho thấy nghĩa “vợ” là phù hợp.
- source_word: וְיָלְדָה לוֹ
  choice: nàng sinh cho anh
  rationale: Diễn đạt tự nhiên động từ ילד cùng đối tượng gián tiếp, đồng thời giữ mối liên hệ được nêu rõ trong tiếng Hê-bơ-rơ.
- source_word: בָנִים אוֹ בָנוֹת
  choice: con trai hoặc con gái
  rationale: Giữ sự phân biệt cụ thể giữa con trai và con gái trong nguyên văn thay vì khái quát thành “con cái”.
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: người vợ cùng các con nàng
  rationale: Nhất quán với cách dịch אִשָּׁה ở đầu câu và phản ánh đại từ giống cái trong nguyên văn.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: sẽ thuộc về chủ nàng
  rationale: Cấu trúc היה ל־ ở đây chỉ tình trạng pháp lý thuộc quyền sở hữu; cách dịch không làm nhẹ đi thực trạng pháp lý của bản văn.
- source_word: וְהוּא יֵצֵא
  choice: còn anh phải ra đi
  rationale: “Ra đi” giữ hình ảnh của יצא trong bối cảnh người nô lệ được rời khỏi thời hạn phục dịch; “còn” làm rõ sự tương phản với người vợ và các con ở lại.
- source_word: בְגַפּוֹ
  choice: một mình
  rationale: Thành ngữ này chỉ việc ra đi không có người vợ và các con đi cùng; “một mình” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Thuật ngữ về chế độ nô lệ trong điều luật
  choice: Dùng “chủ” và diễn đạt thẳng quan hệ “thuộc về”
  alternative: Dùng từ ngữ làm nhẹ quan hệ như “người thuê” hoặc diễn giải là “ở lại với chủ”
  rationale: Nguyên văn quy định một quan hệ quyền sở hữu trong hoàn cảnh nô lệ. Bản dịch cần phản ánh thực trạng pháp lý ấy mà không làm nhẹ đi hay thêm lời phán xét thần học vào câu.
- issue: Ý nghĩa của việc người nam “ra đi một mình”
  choice: Giữ thành ngữ trong chính văn và giải thích phạm vi trong chú thích
  alternative: Đưa thẳng vào chính văn rằng anh ra đi không có vợ con
  rationale: Cách này bảo toàn lối diễn đạt cô đọng của tiếng Hê-bơ-rơ, đồng thời giúp độc giả hiện đại hiểu hệ quả pháp lý mà không biến phần giải thích thành nội dung nguyên văn.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại và dễ hiểu. Đại từ “anh” phù hợp với người nam đang được nói đến; “nàng” giúp các quan hệ sở hữu trong câu dài được phân biệt rõ. Dấu chấm phẩy thể hiện sự tương phản giữa tình trạng của người vợ cùng các con và việc người nam ra đi.
