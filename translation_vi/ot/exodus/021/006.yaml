  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: vi
  text: thì chủ phải đưa người ấy đến trước Đức Chúa Trời[a], rồi dẫn người ấy đến cánh cửa hoặc trụ cửa. Chủ sẽ dùng dùi đục thủng tai người ấy, và người ấy sẽ phục vụ chủ suốt đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến trước các quan xét.” Trong một số văn cảnh pháp lý, từ Hê-bơ-rơ אֱלֹהִים có thể chỉ các quan xét hoặc cơ quan xét xử của con người.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִגִּישׁוֹ
  choice: đưa người ấy đến trước
  rationale: Dạng Hiphil của נגשׁ diễn tả việc đưa một người đến trình diện trước thẩm quyền hoặc tại một địa điểm được chỉ định; cách dịch này giữ được sắc thái thủ tục pháp lý.
- source_word: אֲדֹנָיו
  choice: chủ
  rationale: Trong luật về người làm tôi tớ vì cảnh túng thiếu, từ này chỉ người có quyền pháp lý đối với người tôi tớ; “chủ” tự nhiên, rõ nghĩa và không gợi tước hiệu thần linh.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Nghĩa trực tiếp nhất của từ Hê-bơ-rơ là Đức Chúa Trời, có thể chỉ việc trình diện trước Ngài trong một nghi thức pháp lý-giao ước; cách hiểu “các quan xét” được giữ trong chú thích.
- source_word: הַדֶּלֶת
  choice: cánh cửa
  rationale: Chỉ bộ phận cửa cụ thể tại nơi cử hành nghi thức; “cánh cửa” phân biệt rõ với khung hoặc trụ cửa.
- source_word: הַמְּזוּזָה
  choice: khung cửa
  rationale: מְזוּזָה chỉ phần đứng của lối cửa; “khung cửa” là cách nói tự nhiên, dễ hiểu trong tiếng Việt hiện đại, dù “trụ cửa” cũng có thể dùng.
- source_word: רָצַע
  choice: xỏ
  rationale: Động từ chỉ hành động dùng dụng cụ nhọn đâm xuyên tai; kết hợp “lấy dùi xỏ tai” diễn đạt cụ thể và tự nhiên.
- source_word: אָזְנוֹ
  choice: tai người ấy
  rationale: Giữ nguyên nghĩa đen của bộ phận cơ thể và làm rõ đại từ trong tiếng Việt.
- source_word: בַּמַּרְצֵעַ
  choice: lấy dùi
  rationale: מַרְצֵעַ là dụng cụ nhọn dùng để đục hoặc xỏ; “dùi” là từ tương đương chính xác, thông dụng.
- source_word: וַעֲבָדוֹ
  choice: và người ấy sẽ phục vụ chủ
  rationale: עבד ở đây nói đến việc tiếp tục phục dịch trong quan hệ đã được xác lập, không cần đổi thành một nhãn chỉ thân phận.
- source_word: לְעֹלָם
  choice: suốt đời
  rationale: Trong quy định pháp lý về đời người, cụm này chỉ thời hạn phục vụ kéo dài trọn đời, không phải sự vô tận theo nghĩa siêu hình; “suốt đời” truyền đạt rõ lực nghĩa theo ngữ cảnh.
theological_decisions:
- issue: Nghĩa của הָאֱלֹהִים trong bối cảnh pháp lý
  choice: Đức Chúa Trời
  alternative: các quan xét / cơ quan xét xử
  rationale: Từ này trước hết có nghĩa là Đức Chúa Trời và có thể chỉ việc trình diện trước Ngài trong nghi thức giao ước-pháp lý. Tuy nhiên, cách hiểu là các quan xét hay cơ quan xét xử cũng có cơ sở trong một số văn cảnh pháp luật, nên được nêu ở chú thích để bảo toàn sự mơ hồ thực sự của nguyên văn.
- issue: Phạm vi thời gian của לְעֹלָם
  choice: suốt đời
  alternative: mãi mãi
  rationale: Trong điều luật này, thời hạn gắn với đời sống và thân phận của một con người. “Suốt đời” tránh tạo ấn tượng về sự phục vụ vô tận sau khi chết, trong khi vẫn giữ ý nghĩa lâu dài trọn vẹn của quy định.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng dễ hiểu. Dùng “người ấy” để tránh sắc thái miệt thị và duy trì tham chiếu rõ ràng; câu được chia nhịp tự nhiên trong tiếng Việt hiện đại.
