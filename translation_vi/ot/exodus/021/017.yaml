base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: vi
  text: Kẻ nào nguyền rủa cha mình hoặc mẹ mình thì chắc chắn phải bị xử tử.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dịch sát là “và mẹ mình”; trong công thức luật pháp này, ý nghĩa có tính phân phối, tức là nguyền rủa cha hoặc mẹ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: Kẻ nào nguyền rủa
  rationale: Phân từ Piel được dùng như danh từ để chỉ chung hạng người phạm tội trong thể văn luật pháp. “Kẻ nào” diễn đạt tự nhiên tính khái quát; “nguyền rủa” giữ nghĩa nói lời nguyền chống lại người khác, thay vì mở rộng thành mọi hình thức lăng mạ.
- source_word: אָבִיו
  choice: cha mình
  rationale: Diễn đạt danh từ với hậu tố ngôi ba số ít, đồng thời dùng “mình” tự nhiên trong tiếng Việt để quy chiếu về người phạm tội được nêu ở đầu câu.
- source_word: וְאִמּוֹ
  choice: hoặc mẹ mình
  rationale: 'Dù וְ về hình thức thường là “và”, trong công thức luật pháp này hai đối tượng có ý nghĩa phân phối: hành vi đối với cha hoặc mẹ đều thuộc phạm vi điều luật. “Hoặc” truyền đạt rõ ý đó trong tiếng Việt hiện đại; chú thích giữ lại hình thức nguyên văn.'
- source_word: מוֹת יוּמָת
  choice: thì chắc chắn phải bị xử tử
  rationale: Kết cấu nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh bản án tử hình; thể Hophal cho thấy hình phạt được thi hành trên người phạm tội. Cách dịch này giữ cả sắc thái tư pháp lẫn mức độ nhấn mạnh.
theological_decisions:
- issue: Hiệu lực phân phối của cặp cha mẹ
  choice: Dịch “cha mình hoặc mẹ mình”, hiểu rằng nguyền rủa một trong hai người đều cấu thành tội được nói đến.
  alternative: Giữ sát hình thức “cha mình và mẹ mình”.
  rationale: Liên từ Hê-bơ-rơ là waw, nhưng ngữ cảnh luật pháp bảo vệ từng người trong hai bậc cha mẹ, không đòi hỏi phải nguyền rủa cả hai thì mới phạm điều luật. Chú thích bảo tồn dữ kiện hình thức và sự khác biệt dịch thuật.
- issue: Công thức tuyên án tử hình
  choice: Dịch “chắc chắn phải bị xử tử” như một bản án được áp đặt.
  alternative: Dịch “ắt phải chết” hoặc “chắc chắn sẽ chết”.
  rationale: Thể bị động gây khiến cùng kết cấu nhấn mạnh chỉ việc thi hành án tử hình, chứ không chỉ tiên báo rằng người ấy sẽ chết.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. “Kẻ nào” phù hợp với công thức quy định chung; “xử tử” làm rõ tính chất tư pháp. Dấu chú thích [a] được đặt ngay sau câu.
