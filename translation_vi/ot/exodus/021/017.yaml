  terminology: “Nguyền rủa,” “cha mình hoặc mẹ mình,” và “bị xử tử” nhất quán với nghĩa từ vựng, ngữ vực pháp luật, và không áp đặt diễn giải giáo phái. Chú thích dùng đúng thuật ngữ “Tiếng Hê-bơ-rơ” và giải thích đầy đủ lựa chọn “hoặc.”
