  - severity: low
    issue: Chú thích a viết “với גַּף của mình,” là lối trộn ngôn ngữ và không diễn đạt mạch lạc cụm thành ngữ Hê-bơ-rơ.
    rationale: Nên nêu trực tiếp dạng thành ngữ Hê-bơ-rơ và nghĩa ngữ cảnh của nó, tránh một cách dịch sát chữ có thể gây hiểu lầm.
  - severity: low
