review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc điều kiện và hệ quả của tiếng Hê-bơ-rơ: người vào một mình thì ra một mình; người đã có vợ thì vợ ra cùng người ấy. Tuy nhiên, “ra đi cùng” thiếu bổ ngữ rõ ràng cho עִמּוֹ (“với người ấy”). Chú thích a hiện trộn tiếng Việt với từ Hê-bơ-rơ và diễn giải hình thức chưa tự nhiên.'
  naturalness: “Nếu người ấy vào phục vụ một mình” phù hợp ngữ cảnh luật lệ và tự nhiên trong tiếng Việt hiện đại. “Đã có vợ” là cách nói tự nhiên cho thành ngữ בַּעַל אִשָּׁה. Cần hoàn chỉnh “cùng người ấy” ở cuối câu.
  terminology: “Vào phục vụ”/“ra đi” giữ được cặp động từ vào–ra trong công thức pháp lý. Không cần dùng lối dịch quá sát chữ, gây gượng như “là chồng của một người vợ.”
  issues:
