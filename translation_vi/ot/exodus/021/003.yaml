  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: vi
  text: Nếu người ấy vào phục vụ một mình[a], thì sẽ ra đi một mình; nếu người ấy đã có vợ[b], thì vợ người ấy sẽ ra đi cùng người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm thành ngữ Hê-bơ-rơ בְּגַפּוֹ nghĩa là người ấy vào một mình, không có ai đi cùng.
    reason: lexical_alternative
  - marker: b
    text: Cụm thành ngữ Hê-bơ-rơ nghĩa là người đàn ông đã có vợ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: một mình
  rationale: Thành ngữ Hê-bơ-rơ chỉ việc người ấy vào mà không có ai đi cùng. “Một mình” tự nhiên trong tiếng Việt và giữ được ý nghĩa pháp lý của câu.
- source_word: יָבֹא
  choice: vào phục vụ
  rationale: Động từ có nghĩa cơ bản là “vào”; trong luật này, đối tượng là người bước vào thời kỳ phục vụ. Thêm “phục vụ” làm rõ ngữ cảnh mà không thay đổi nội dung.
- source_word: יֵצֵא
  choice: sẽ ra đi
  rationale: Trong bối cảnh phóng thích, động từ chỉ việc rời khỏi sự phục vụ. “Ra đi” giữ được sự đối ứng với “vào phục vụ” và sát hình thức Hê-bơ-rơ.
- source_word: בַּעַל אִשָּׁה
  choice: đã có vợ
  rationale: Cụm từ này theo thành ngữ nghĩa là một người đàn ông đã kết hôn. “Đã có vợ” vừa tự nhiên vừa giữ rõ quan hệ được bản văn nêu.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: thì vợ người ấy sẽ ra đi cùng
  rationale: Động từ giống cái số ít hòa hợp với “vợ người ấy.” Cách dịch giữ cấu trúc pháp lý và nói rõ người vợ đi ra cùng chồng.
