source:
  edition: WLC
  text: אוֹ בֵ֥ן יִגָּ֖ח אוֹ בַ֣ת יִגָּ֑ח כַּ/מִּשְׁפָּ֥ט הַ/זֶּ֖ה יֵעָ֥שֶׂה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/031.yaml
  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: vi
  text: Nếu bò húc con trai hay con gái[a], thì chủ bò cũng sẽ bị xử theo luật này[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa là hình phạt pháp lý nêu ở câu trước cũng được áp dụng nếu bò húc con trai hoặc con gái.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “theo phán quyết này”, “theo quy định này” hoặc “theo điều luật này”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Nếu ... hay
  rationale: Trong điều luật theo tình huống này, אוֹ mở ra một trường hợp thay thế; tiếng Việt diễn đạt tự nhiên bằng “Nếu”, còn אוֹ thứ hai nối hai khả năng bằng “hay”.
- source_word: בֵן
  choice: con trai
  rationale: Giữ nghĩa trực tiếp của בֵן và sự đối xứng về giới tính với “con gái”.
- source_word: יִגָּח
  choice: bò húc
  rationale: Động từ נגח chỉ hành động húc bằng sừng; chủ ngữ là con bò được nêu trong văn cảnh trước, nên được nói rõ để câu tiếng Việt tự nhiên và độc lập hơn.
- source_word: בַת
  choice: con gái
  rationale: Giữ nghĩa trực tiếp của בַת và cặp từ cân xứng với “con trai”.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: theo luật này
  rationale: מִשְׁפָּט trong văn liệu pháp luật có thể chỉ phán quyết, quy định hoặc thể lệ pháp lý; “luật này” rõ nghĩa trong tiếng Việt mà vẫn giữ phạm vi quy chiếu về điều khoản vừa nêu.
- source_word: יֵעָשֶׂה לּוֹ
  choice: chủ bò cũng sẽ bị xử
  rationale: Cụm bị động theo sát mặt chữ là “sẽ được làm cho người ấy”, nhưng tiếng Việt pháp lý tự nhiên dùng “bị xử”. “Chủ bò” làm rõ đối tượng của đại từ לּוֹ từ văn cảnh, và “cũng” thể hiện việc áp dụng cùng cách xử lý ở câu trước.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. Bản dịch làm rõ các chủ thể được văn cảnh tiếng Hê-bơ-rơ ngầm hiểu (“bò”, “chủ bò”), đồng thời giữ tính quy chiếu của “luật này” và đặt đầy đủ ký hiệu chú thích trong chính văn.
