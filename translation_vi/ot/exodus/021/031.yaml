  terminology: “Bò húc,” “con trai,” “con gái,” và “luật này” đều dễ hiểu và thích hợp. Chú thích b bảo lưu các khả năng dịch của מִשְׁפָּט, gồm sắc thái “phán quyết,” “quy định,” hay “điều luật,” không áp đặt một cách hiểu giáo phái.
