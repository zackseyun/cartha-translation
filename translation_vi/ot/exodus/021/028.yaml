  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: vi
  text: Nếu một con bò húc một người đàn ông hoặc một người phụ nữ khiến người ấy chết, thì con bò ấy chắc chắn phải bị ném đá; thịt nó không được ăn, còn chủ con bò thì được miễn trách nhiệm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vô tội” hoặc “không bị kết tội.” Từ Hê-bơ-rơ נָקִי là một thuật ngữ pháp lý, cho biết chủ con bò được miễn trách nhiệm hoặc hình phạt trong trường hợp này.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một điều luật theo tình huống. Trong tiếng Việt, “Nếu” diễn đạt tự nhiên quan hệ điều kiện; liên từ וְ không cần dịch riêng trong câu này.
- source_word: יִגַּח
  choice: húc
  rationale: Động từ chỉ hành động dùng sừng húc; “húc” chính xác và tự nhiên đối với bò trong tiếng Việt.
- source_word: שׁוֹר
  choice: con bò
  rationale: Giữ nghĩa chung của danh từ chỉ bò, không xác định quá mức là bò đực.
- source_word: אֶת אִישׁ אוֹ אֶת אִשָּׁה
  choice: một người đàn ông hoặc một người phụ nữ
  rationale: Giữ nguyên việc bản Hê-bơ-rơ nêu rõ cả nam lẫn nữ.
- source_word: וָמֵת
  choice: khiến người ấy chết
  rationale: Đại từ trung tính “người ấy” quy chiếu tự nhiên đến nạn nhân dù là nam hay nữ; cách diễn đạt này thể hiện kết quả chết người mà không gây nhập nhằng về giới.
- source_word: סָקוֹל יִסָּקֵל
  choice: chắc chắn phải bị ném đá
  rationale: Kết cấu nguyên thể tuyệt đối đi với động từ hữu hạn có tác dụng nhấn mạnh; “chắc chắn phải” vừa giữ lực nhấn mạnh vừa phù hợp văn phong luật pháp hiện đại.
- source_word: וְלֹא יֵאָכֵל אֶת בְּשָׂרוֹ
  choice: thịt nó không được ăn
  rationale: Giữ cấu trúc bị động và lệnh cấm rõ ràng; “thịt” là từ tiếng Việt tự nhiên tương ứng với בָּשָׂר trong ngữ cảnh này.
- source_word: וּבַעַל הַשּׁוֹר
  choice: còn chủ con bò
  rationale: בַּעַל ở đây chỉ người sở hữu hợp pháp; “chủ” là cách diễn đạt ngắn gọn, tự nhiên.
- source_word: נָקִי
  choice: vô can
  rationale: “Vô can” giữ được sắc thái pháp lý khái quát là không bị quy tội hay chịu trách nhiệm trong trường hợp này, mà không thu hẹp câu chỉ vào trách nhiệm dân sự hay một hình phạt cụ thể.
theological_decisions:
- issue: Địa vị pháp lý của chủ con bò trong mệnh đề cuối
  choice: Chủ con bò “vô can” trong trường hợp cơ bản được nêu ở câu này.
  alternative: Chủ bò vô tội về mặt đạo đức; hoặc chỉ được miễn một hình phạt cụ thể.
  rationale: נָקִי nói rằng chủ bò không bị quy trách nhiệm hay chịu hình phạt trong trường hợp này, trước khi các câu sau nêu trường hợp chủ đã biết bò có thói quen húc. Bản dịch không xác định quá mức đây là sự vô tội đạo đức, miễn trách nhiệm dân sự hay miễn án tử hình.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại và dễ hiểu. Câu giữ cấu trúc điều kiện, nhấn mạnh mệnh lệnh ném đá, đồng thời dùng “người ấy” để tránh đại từ mang giới tính không phù hợp với hai khả năng đã nêu.
