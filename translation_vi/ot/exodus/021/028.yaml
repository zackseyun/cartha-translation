revisions:
- from: Nếu một con bò húc một người đàn ông hoặc một người phụ nữ khiến người ấy chết, thì con bò ấy chắc chắn phải bị ném đá; thịt nó không được ăn, còn chủ con bò thì vô can.[a]
  to: Nếu một con bò húc một người đàn ông hoặc một người phụ nữ khiến người ấy chết, thì con bò ấy chắc chắn phải bị ném đá; thịt nó không được ăn, còn chủ con bò thì được miễn trách nhiệm.[a]
  rationale: Chỉ sửa mệnh đề cuối và chú thích để tránh nghĩa thông thường “không liên can” của “vô can,” đồng thời giữ tính khái quát của thuật ngữ pháp lý Hê-bơ-rơ, không quy định quá mức loại trách nhiệm hay hình phạt được miễn.
