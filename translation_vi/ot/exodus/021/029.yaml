    reason: cultural_note
  revision_rationale: Bản sửa tránh thêm đối tượng “người” vào mô tả ban đầu về thói quen húc của con vật, làm rõ trách nhiệm không kiềm giữ con vật, và dùng cách gọi nam/nữ trung tính, trang trọng hơn trong tiếng Việt hiện đại. Chú thích giữ nghĩa đen của thành ngữ mà không lẫn với mệnh đề chủ đã được cảnh báo.
