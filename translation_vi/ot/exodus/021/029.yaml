language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: vi
  text: Nhưng nếu con bò vốn có tật húc từ trước[a], chủ nó đã được cảnh báo nhưng không giữ nó lại, và nó giết chết một người nam hay một người nữ, thì con bò phải bị ném đá, và chủ nó cũng phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ hôm qua và hôm kia,” một thành ngữ Hê-bơ-rơ chỉ thói húc đã có từ trước.'
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: con bò
  rationale: Danh từ chỉ một con bò nhà trong điều luật; tiếng Hê-bơ-rơ ở đây không nhất thiết nhấn mạnh giới tính hay việc con vật đã bị thiến.
- source_word: נַגָּח
  choice: vốn có tật húc người
  rationale: Phân từ diễn tả đặc tính hay hành vi lặp lại đã được biết đến, không chỉ một lần húc riêng lẻ.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: trước đó
  rationale: Thành ngữ nguyên văn 'từ hôm qua và hôm kia' chỉ một hành vi đã có từ trước; cách dịch gọn này tự nhiên trong tiếng Việt, còn nghĩa đen được giữ ở chú thích.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: chủ nó đã được cảnh báo
  rationale: Dạng bị động trong bối cảnh pháp lý nói đến việc chủ con vật đã được báo trước về mối nguy.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: mà vẫn không canh giữ nó
  rationale: Động từ có nghĩa canh giữ, trông coi; trong ngữ cảnh bao hàm việc không kiểm soát hoặc ngăn giữ con vật nguy hiểm.
- source_word: וְהֵמִית
  choice: nó làm chết
  rationale: Dạng động từ diễn tả con bò gây ra cái chết; 'làm chết' giữ rõ quan hệ nhân quả và hợp với văn phong luật lệ.
- source_word: אִישׁ אֹו אִשָּׁה
  choice: một người đàn ông hay một người đàn bà
  rationale: Giữ nguyên việc bản nguồn nêu rõ cả nạn nhân nam lẫn nữ.
- source_word: יִסָּקֵל
  choice: phải bị ném đá
  rationale: Dạng bị động quy định hình phạt ném đá; 'phải' truyền đạt lực pháp lý của điều luật.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: chủ nó cũng phải bị xử tử
  rationale: Công thức pháp lý bị động chỉ án tử hình được thi hành, chứ không đơn thuần nói người chủ sẽ chết.
theological_decisions:
- issue: Tính pháp lý của hình phạt dành cho người chủ
  choice: chủ nó cũng phải bị xử tử
  alternative: chủ nó cũng phải chết
  rationale: יוּמָת là công thức luật pháp chỉ việc bị xử tử; cách dịch được chọn không làm nhẹ ý nghĩa tư pháp, đồng thời không thêm phương thức hành hình mà câu không nêu.
- issue: Cách gọi nạn nhân theo giới tính
  choice: một người đàn ông hay một người đàn bà
  alternative: một người
  rationale: Bản nguồn nêu tường minh cả nam và nữ, nên bản dịch giữ sự phân biệt ấy thay vì khái quát hóa.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại. Dùng “con bò” thay vì “bò đực” để không thêm nét nghĩa về giới tính; “vốn có tật húc người” diễn đạt tự nhiên hành vi nguy hiểm lặp lại. Dấu chú thích [a] xuất hiện ngay sau cụm từ tương ứng trong câu.
