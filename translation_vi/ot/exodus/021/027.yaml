  rationale: 'Thay “đánh gãy” bằng “đánh rụng” để phản ánh chính xác động từ Hê-bơ-rơ: người chủ gây ra việc chiếc răng bị rụng. Các thành phần khác của bản dịch giữ đúng nghĩa, rõ ràng và tự nhiên.'
