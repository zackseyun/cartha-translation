source:
  edition: WLC
  text: וְ/אִם שֵׁ֥ן עַבְדּ֛/וֹ אֽוֹ שֵׁ֥ן אֲמָת֖/וֹ יַפִּ֑יל לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת שִׁנּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: vi
  text: Nếu người chủ đánh rụng một chiếc răng của nô lệ nam hay nô lệ nữ của mình, thì phải trả tự do cho người ấy để bồi thường cho chiếc răng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Luật này áp dụng cho cả nô lệ nam lẫn nô lệ nữ; công thức pháp lý trong tiếng Hê-bơ-rơ dùng hậu tố tân ngữ giống đực số ít.
    reason: Giải thích sự tương ứng giữa đại từ số ít trong nguyên văn và phạm vi áp dụng cho cả hai giới.
lexical_decisions:
- source_word: וְאִם
  choice: Nếu
  rationale: Mở đầu trường hợp luật lệ tiếp nối câu trước; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ.
- source_word: שֵׁן
  choice: một chiếc răng
  rationale: Danh từ số ít chỉ một chiếc răng; thêm loại từ “chiếc” cho tự nhiên trong tiếng Việt.
- source_word: עַבְדּוֹ
  choice: nô lệ nam của mình
  rationale: Trong luật về chế độ nô lệ của Bộ Luật Giao Ước, עבד chỉ người ở địa vị lệ thuộc pháp lý; “nô lệ” phản ánh thực trạng ấy rõ hơn “đầy tớ”, còn “nam” giữ sự phân biệt giới tính trong nguyên văn.
- source_word: אֲמָתוֹ
  choice: nô lệ nữ của mình
  rationale: Giữ đối ứng giống cái với עבד và diễn đạt bằng thuật ngữ hiện đại, rõ nghĩa.
- source_word: יַפִּיל
  choice: đánh gãy
  rationale: Hiphil của נפל ở đây có nghĩa làm cho răng rơi hoặc bật ra. “Đánh gãy” là cách nói tự nhiên trong ngữ cảnh gây thương tích, dù sát hình ảnh hơn có thể là “đánh rụng”.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: phải trả tự do cho người ấy
  rationale: Diễn đạt kết quả pháp lý là phóng thích người bị thương; “phải” thể hiện lực quy định của công thức luật.
- source_word: תַּחַת שִׁנּוֹ
  choice: để bồi thường cho chiếc răng
  rationale: תחת biểu thị sự đền bù tương ứng với tổn thương; cách dịch này làm rõ quan hệ bồi thường mà vẫn giữ chiếc răng số ít.
theological_decisions:
- issue: Thuật ngữ chỉ chế độ nô lệ trong luật Bộ Luật Giao Ước
  choice: nô lệ nam / nô lệ nữ
  alternative: đầy tớ nam / tớ gái
  rationale: Địa vị lệ thuộc pháp lý là yếu tố thiết yếu của điều luật, nên “nô lệ” chính xác hơn “đầy tớ”; cặp nam–nữ giữ nguyên sự phân biệt trong tiếng Hê-bơ-rơ.
- issue: Đại từ giống đực số ít trong mệnh đề phóng thích
  choice: người ấy, kèm chú thích rằng luật áp dụng cho cả nô lệ nam lẫn nữ
  alternative: họ
  rationale: Hậu tố tân ngữ tiếng Hê-bơ-rơ là giống đực số ít, nhưng trường hợp luật vừa nêu rõ cả nam lẫn nữ. “Người ấy” giữ số ít mà không áp đặt giới tính trong tiếng Việt.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại, dễ hiểu. Dùng “người chủ” để làm rõ chủ thể đã được ngữ cảnh xác định, “trả tự do” cho kết quả pháp lý, và tránh từ cổ như “đầy tớ gái”.
