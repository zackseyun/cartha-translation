  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: vi
  text: Nếu một người đánh vào mắt của một nam nô lệ hay nữ nô lệ của mình và làm hỏng mắt đó[a], thì người ấy phải trả tự do cho người nô lệ ấy để đền bù cho con mắt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và làm mù mắt đó.” Động từ Hê-bơ-rơ có thể chỉ việc phá hỏng mắt, hàm ý tổn thương vĩnh viễn.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “thay cho con mắt.” Trong ngữ cảnh này, việc trả tự do là sự đền bù cho tổn thương ở mắt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một điều luật theo tình huống; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ.
- source_word: יַכֶּה
  choice: đánh vào
  rationale: Diễn đạt trực tiếp hành động נכה đối với bộ phận cơ thể mà không hàm ý đánh nhiều lần.
- source_word: אִישׁ
  choice: một người
  rationale: Trong công thức luật theo tình huống, אִישׁ chỉ một cá nhân; cách dịch này tự nhiên trong tiếng Việt và không thay đổi đối tượng pháp lý.
- source_word: עַבְדּוֹ ... אֲמָתוֹ
  choice: nam nô lệ hoặc nữ nô lệ của mình
  rationale: Phản ánh rõ thân phận lệ thuộc và sự đối xứng giới tính giữa עֶבֶד và אָמָה trong điều luật.
- source_word: וְשִׁחֲתָהּ
  choice: và làm hỏng mắt ấy
  rationale: שחת chỉ việc phá hỏng hoặc gây tổn thương nghiêm trọng cho mắt; không thu hẹp nghĩa thành mù hoàn toàn.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: phải trả tự do cho người nô lệ đó
  rationale: Diễn đạt tự nhiên hiệu lực bắt buộc của điều luật và việc phóng thích khỏi thân phận nô lệ; danh ngữ được lặp lại để tránh đại từ giống đực gây hiểu lầm khi câu nói đến cả nam lẫn nữ.
- source_word: תַּחַת עֵינוֹ
  choice: để đền bù cho con mắt
  rationale: Trong ngữ cảnh pháp lý, תַּחַת biểu thị sự bồi hoàn hoặc thay thế; cách dịch giữ hình ảnh nguyên văn đồng thời làm rõ chức năng đền bù.
theological_decisions:
- issue: Thuật ngữ chỉ thân phận lệ thuộc trong luật pháp Israel
  choice: nam nô lệ / nữ nô lệ
  alternative: đầy tớ / tớ gái
  rationale: Bối cảnh sở hữu, gây thương tích và bắt buộc phóng thích cho thấy thân phận nô lệ; không dùng từ nhẹ hơn có thể che khuất thực trạng pháp lý.
- issue: Mức độ tổn thương của mắt
  choice: làm hỏng mắt ấy
  alternative: làm mù mắt ấy
  rationale: Động từ שחת có thể hàm ý mắt bị hủy hoại hoặc mất chức năng vĩnh viễn, nhưng bản thân từ không nhất thiết chỉ riêng sự mù hoàn toàn; bản dịch chính giữ độ rộng ngữ nghĩa.
- issue: Đại từ giống đực trong mệnh đề phóng thích
  choice: người nô lệ đó
  alternative: người ấy / anh ta
  rationale: Hậu tố giống đực số ít trong tiếng Hê-bơ-rơ có chức năng quy chiếu mặc định, trong khi điều luật nêu rõ cả nam và nữ; lặp danh ngữ giúp tiếng Việt rõ nghĩa mà không loại nữ nô lệ khỏi hiệu lực của luật.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “nô lệ” để phản ánh đúng thân phận xã hội; dùng “trả tự do” thay cho lối cổ “phóng thích”. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
