  rationale: Bản sửa chỉ cải thiện độ rõ cú pháp và tính tự nhiên của tiếng Việt. Bản văn vẫn giữ tính khái quát của đại từ giống đực trong tiếng Hê-bơ-rơ đối với cả nam lẫn nữ nô lệ, không thu hẹp שחת thành chỉ “làm mù,” và duy trì sắc thái bồi hoàn pháp lý của תחת עינו.
  reviewer_model: gpt-5.6-terra
