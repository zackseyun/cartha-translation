  source_fidelity: Bản nháp phản ánh đúng cấu trúc điều luật, phân biệt nam/nữ nô lệ, mức độ hư hại nghiêm trọng ở mắt, và việc buộc phóng thích để bồi hoàn. Tuy nhiên, cụm “đánh vào mắt nam nô lệ hoặc nữ nô lệ của mình” có thể tạm thời khiến quan hệ sở hữu và bộ phận bị đánh kém rõ; bản sửa làm rõ “mắt của” mà vẫn giữ nghĩa nguồn.
  naturalness: 'Cần chỉnh nhẹ để tiếng Việt hiện đại tự nhiên và mạch lạc hơn: thêm “của” sau “mắt”, dùng “mắt đó” để quy chiếu rõ, và nêu lại chủ thể “người ấy” ở mệnh đề kết quả.'
