  text: אִם עֶ֛בֶד יִגַּ֥ח הַ/שּׁ֖וֹר א֣וֹ אָמָ֑ה כֶּ֣סֶף שְׁלֹשִׁ֣ים שְׁקָלִ֗ים יִתֵּן֙ לַֽ/אדֹנָ֔י/ו וְ/הַ/שּׁ֖וֹר יִסָּקֵֽל־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: vi
  text: Nếu bò húc một nô lệ nam hay một nô lệ nữ[a], chủ bò phải trả cho chủ của người ấy ba mươi siếc-lơ bạc, còn con bò phải bị ném đá chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một đầy tớ nam hay một đầy tớ nữ”. Tiếng Hê-bơ-rơ phân biệt nô lệ nam (עֶבֶד) và nô lệ nữ (אָמָה).
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: nô lệ nam
  rationale: Trong điều luật này, từ ngữ chỉ địa vị nô lệ, và việc đặt song song với אָמָה cho thấy cần giữ rõ giới tính nam.
- source_word: אָמָה
  choice: nô lệ nữ
  rationale: Từ này đi đôi với עֶבֶד và chỉ một người nữ ở địa vị nô lệ; cách dịch này rõ nghĩa và không làm nhẹ đi thực trạng pháp lý-xã hội của nguyên văn.
- source_word: יִגַּח
  choice: húc
  rationale: Trong các luật về bò, động từ נגח chỉ hành động con vật dùng sừng húc; “húc” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: ba mươi siếc-lơ bạc
  rationale: Cụm từ nêu lượng bạc theo đơn vị trọng lượng siếc-lơ; cách dịch giữ nguyên đơn vị cổ và diễn đạt gọn, tự nhiên.
- source_word: יִתֵּן
  choice: phải trả
  rationale: Thể vị hoàn trong điều luật tình huống biểu thị nghĩa vụ pháp lý. “Phải trả” tự nhiên hơn “sẽ đưa” và làm rõ đây là khoản bồi thường.
- source_word: לַאדֹנָיו
  choice: cho chủ của người ấy
  rationale: Hậu tố số ít giống đực nhiều khả năng quy về người nô lệ vừa được nhắc đến. “Người ấy” bao quát cả nô lệ nam lẫn nữ trong tiếng Việt, đồng thời tránh nhầm với chủ của con bò.
- source_word: יִסָּקֵל
  choice: phải bị ném đá chết
  rationale: Dạng Niphal của סקל nói đến việc xử tử bằng cách ném đá. Thêm “chết” làm rõ hậu quả pháp lý vốn hàm chứa trong động từ Hê-bơ-rơ và phù hợp cách nói tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “nô lệ” trong câu chính để phản ánh rõ địa vị pháp lý-xã hội của các từ Hê-bơ-rơ, đồng thời ghi cách dịch mềm hơn trong chú thích. Chủ thể hàm ẩn của “phải trả” được diễn đạt là “chủ bò” theo ngữ cảnh của chuỗi luật về bò húc.
