    rationale: Cụm Hê-bơ-rơ chỉ nói “cũng chia con đã chết”; không xác định việc chia theo giá trị hay theo phần còn lại. Chú thích phải giữ giới hạn này.
  - severity: low
    issue: Ký hiệu chú thích đặt ở cuối toàn câu thay vì ngay sau từ ngữ được chú thích.
    rationale: Chú thích giải thích “con đã chết,” nên neo tại cụm này minh bạch hơn.
  revised_text: Nếu bò của một người húc bò của người lân cận khiến nó chết, thì họ phải bán con bò còn sống và chia nhau số tiền bán được; họ cũng phải chia nhau con bò đã chết.[a]
