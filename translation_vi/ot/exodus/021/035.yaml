base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: vi
  text: Nếu bò của một người húc bò của người lân cận khiến nó chết, thì họ phải bán con bò còn sống và chia nhau số tiền bán được; họ cũng phải chia nhau con bò đã chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “con đã chết”; tức là con bò chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu điều kiện của một luật tình huống; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ.
- source_word: יִגֹּף
  choice: húc
  rationale: Diễn tả cú đánh mạnh do bò gây ra; trong ngữ cảnh hai con bò, “húc” tự nhiên và chính xác hơn “đánh”.
- source_word: שׁוֹר אִישׁ
  choice: bò của một người
  rationale: Thể hiện rõ quan hệ sở hữu và giữ cách nói khái quát của điều luật.
- source_word: שׁוֹר רֵעֵהוּ
  choice: bò của người lân cận
  rationale: רֵעַ chỉ người lân cận hoặc người đồng loại; lựa chọn này giữ sắc thái quan hệ giữa hai chủ sở hữu.
- source_word: וָמֵת
  choice: khiến nó chết
  rationale: Diễn đạt tự nhiên quan hệ kết quả trong tiếng Việt mà không thêm ý định gây chết.
- source_word: וּמָכְרוּ
  choice: thì họ phải bán
  rationale: Thể hiện hệ quả pháp lý bắt buộc của điều luật bằng tiếng Việt rõ ràng.
- source_word: הַשּׁוֹר הַחַי
  choice: con bò còn sống
  rationale: Cách nói tự nhiên, chỉ con bò sống sót sau sự việc.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: chia nhau số tiền bán được
  rationale: כַּסְפּוֹ theo nghĩa đen là “tiền của nó”, nhưng trong trình tự bán bò, từ này chỉ số tiền thu được từ việc bán.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: họ cũng phải chia nhau con bò đã chết
  rationale: Giữ cách diễn đạt cụ thể nhưng không diễn giải thành “thịt” hay “xác”, vì nguyên văn chỉ nói “con đã chết”.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng dễ hiểu. Dùng “phải” để nêu nghĩa vụ theo điều luật; tránh thuật ngữ cổ. Dấu chú thích được đặt ngay sau cụm từ mà nó giải thích.
