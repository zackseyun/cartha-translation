  text: וְ/אִם אָס֖וֹן יִהְיֶ֑ה וְ/נָתַתָּ֥ה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
translation:
  language: vi
  text: Nhưng nếu có tổn hại[a], thì ngươi phải đền mạng sống bằng mạng sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thương tích nghiêm trọng” hoặc “tử vong”; từ Hê-bơ-rơ có thể chỉ tổn hại nặng hay tai họa, và có những cách hiểu khác nhau về việc ngữ cảnh nói đến thương tích nói chung hay cái chết nói riêng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Diễn đạt điều kiện mang sắc thái tương phản với câu trước, tự nhiên trong tiếng Việt.
- source_word: אָסוֹן
  choice: tổn hại
  rationale: Giữ phạm vi nghĩa tương đối rộng của danh từ Hê-bơ-rơ, không tự ý xác định đó chỉ là thương tích nghiêm trọng hay tử vong.
- source_word: יִהְיֶה
  choice: có
  rationale: Cách diễn đạt hiện hữu ngắn gọn, tự nhiên, tương ứng với ý ‘xảy ra/có tổn hại’.
- source_word: וְנָתַתָּה
  choice: thì ngươi phải đền
  rationale: Trong ngữ cảnh luật pháp, động từ ‘trao/đưa’ biểu thị sự báo hoàn hoặc hình phạt tương xứng; ‘đền’ rõ nghĩa hơn trong tiếng Việt mà không ngụ ý bồi thường bằng tiền.
- source_word: נֶפֶשׁ
  choice: mạng
  rationale: Trong công thức pháp lý này, נֶפֶשׁ chỉ sự sống/mạng sống chứ không phải ‘linh hồn’; ‘mạng’ tạo thành cách nói tiếng Việt tự nhiên.
- source_word: תַּחַת
  choice: đổi
  rationale: Biểu thị sự thay thế hoặc tương xứng trong công thức báo hoàn; ‘đổi’ bảo toàn cấu trúc cân xứng ‘mạng đổi mạng’.
- source_word: נָפֶשׁ
  choice: mạng
  rationale: Lặp lại cùng một từ để giữ tính đối xứng và tương ứng từ vựng của nguyên văn.
theological_decisions:
- issue: Phạm vi của tổn hại được diễn tả bằng אָסוֹן
  choice: Dịch rộng là ‘tổn hại’, không xác định người chịu tổn hại và cũng không khẳng định tổn hại ấy nhất thiết gây chết người.
  alternative: ‘thương tích nghiêm trọng’ hoặc ‘tử vong’
  rationale: Bản thân câu này không nói rõ đối tượng hay mức độ của אָסוֹן. Cách dịch rộng giữ nguyên sự mơ hồ và căng thẳng diễn giải của đoạn luật.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng ‘ngươi’ để phản ánh lời phán trực tiếp ở số ít; cụm ‘đền mạng đổi mạng’ giữ nhịp cân xứng của công thức Hê-bơ-rơ.
