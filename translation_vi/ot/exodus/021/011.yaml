source:
  edition: WLC
  text: וְ/אִם שְׁלָ֨שׁ אֵ֔לֶּה לֹ֥א יַעֲשֶׂ֖ה לָ֑/הּ וְ/יָצְאָ֥ה חִנָּ֖ם אֵ֥ין כָּֽסֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/011.yaml
  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: vi
  text: Nếu người ấy không làm ba điều này cho nàng[a], thì nàng được ra đi tự do, không phải trả tiền.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không chu cấp ba điều này cho nàng.” Nguyên văn Hê-bơ-rơ là “không làm ba điều này cho nàng,” nhắc lại thức ăn, quần áo và quyền vợ chồng được nêu ở câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nếu
  rationale: Mở đầu điều kiện tiếp nối luật lệ ở câu trước; tiếng Việt không cần dịch riêng liên từ ו để câu tự nhiên.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: ba điều này
  rationale: Chỉ ba nghĩa vụ được nêu ở câu trước; “điều” làm rõ đối tượng được ngầm hiểu mà không thêm nội dung.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: không làm ... cho nàng
  rationale: Giữ sát nghĩa rộng của עשה và bảo tồn khả năng hiểu là thực hiện hoặc chu cấp các nghĩa vụ ấy.
- source_word: וְיָצְאָה
  choice: thì nàng được ra đi
  rationale: Trong luật về thân phận tôi tớ, động từ diễn tả việc ra khỏi tình trạng lệ thuộc; “được” phù hợp hiệu lực pháp lý của mệnh đề.
- source_word: חִנָּם
  choice: tự do
  rationale: Trong ngữ cảnh phóng thích, từ này nói đến việc được ra đi mà không phải trả giá.
- source_word: אֵין כָּסֶף
  choice: không phải trả tiền
  rationale: Diễn đạt tự nhiên ý rằng không có khoản tiền nào phải nộp để được phóng thích; “tiền” phù hợp hơn cách dịch vật chất là “bạc” trong ngữ cảnh này.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “nàng” để chỉ người nữ trong ngữ cảnh cổ đại mà vẫn dễ hiểu; giữ cách nói khá sát nguyên văn “làm ... cho nàng” và giải thích phương án cụ thể hơn trong chú thích.
