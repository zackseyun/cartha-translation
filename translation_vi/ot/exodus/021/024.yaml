  text: eye for eye[a], tooth for tooth, hand for hand, foot for foot.
translation:
  language: vi
  text: Mắt đền mắt[a], răng đền răng, tay đền tay, chân đền chân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mắt thay cho mắt, răng thay cho răng, tay thay cho tay, chân thay cho chân.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: mắt
  rationale: Danh từ chỉ con mắt theo nghĩa thể lý; không thêm loại từ để giữ công thức pháp lý ngắn gọn và nhịp song song của tiếng Hê-bơ-rơ.
- source_word: תַּחַת
  choice: đền
  rationale: Trong ngữ cảnh pháp luật này, từ này diễn tả sự thay thế hay sự bồi hoàn tương xứng, không mang nghĩa không gian là “ở dưới”. “Đền” là cách diễn đạt tự nhiên, súc tích trong tiếng Việt và vẫn giữ tính cô đọng của công thức.
- source_word: שֵׁן
  choice: răng
  rationale: Danh từ có nghĩa là răng; cách dịch không thêm loại từ phù hợp với chuỗi thuật ngữ pháp lý cô đọng.
- source_word: יָד
  choice: tay
  rationale: Chỉ bộ phận cơ thể là tay; lựa chọn này giữ sự tương ứng trực tiếp và nhịp điệu của câu.
- source_word: רֶגֶל
  choice: chân
  rationale: Từ có thể chỉ bàn chân hoặc phần chân nói chung. Trong tiếng Việt, “chân” là từ tự nhiên và thích hợp nhất trong công thức pháp lý này.
theological_decisions:
- issue: Bản chất của công thức pháp lý
  choice: 'Giữ nguyên lời tuyên bố ngắn gọn về sự đền bù tương xứng: “mắt đền mắt … chân đền chân”.'
  alternative: Diễn giải thành “hình phạt phải tương xứng với thương tích”.
  rationale: Nguyên văn chỉ gồm các danh từ chỉ bộ phận cơ thể được ghép bằng תַּחַת. Diễn giải thành một nguyên tắc tổng quát sẽ đưa thêm ý giải thích không được phát biểu trực tiếp trong câu.
translation_notes:
  register: Văn phong pháp lý cô đọng, trang nghiêm nhưng dễ hiểu trong tiếng Việt hiện đại. Lặp lại “đền” ở mỗi vế để phản ánh cấu trúc song song và nhấn mạnh của nguyên văn.
