base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: vi
  text: Kẻ nào bắt cóc một người rồi bán người ấy[a], hoặc người ấy bị phát hiện đang ở trong tay kẻ đó[b], thì chắc chắn phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “trộm một người.” Trong ngữ cảnh, cụm này chỉ việc bắt cóc hoặc trộm người.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và người ấy được tìm thấy trong tay kẻ đó.” “Trong tay” là cách nói Hê-bơ-rơ chỉ việc thuộc quyền chiếm giữ hoặc kiểm soát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב
  choice: bắt cóc
  rationale: Động từ גנב có nghĩa đen là “trộm,” nhưng khi đối tượng là một con người và ngữ cảnh nói đến việc bán hoặc giữ người ấy, hành vi được nói đến là bắt cóc, tức trộm người.
- source_word: אִישׁ
  choice: một người
  rationale: אִישׁ là danh từ giống đực số ít, nhưng trong điều luật này chỉ một con người làm nạn nhân theo nghĩa đại diện; “một người” tự nhiên trong tiếng Việt và không thu hẹp phạm vi hơn điều tiếng Hê-bơ-rơ đòi hỏi.
- source_word: וּמְכָרוֹ
  choice: rồi bán người ấy
  rationale: Hậu tố ngôi ba giống đực số ít chỉ chính người bị bắt cóc. “Bán người ấy” chuyển tải trực tiếp hành vi mua bán người; “rồi” diễn đạt trình tự tự nhiên của chuỗi hành động trong tiếng Việt.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: hoặc người ấy vẫn được tìm thấy trong tay kẻ đó
  rationale: נמצא là thể bị động “được tìm thấy,” còn בידו có nghĩa đen “trong tay hắn,” một thành ngữ chỉ sự chiếm giữ hoặc kiểm soát. Từ “vẫn” làm rõ trường hợp nạn nhân còn bị giữ, nhưng chú thích bảo tồn nghĩa thành ngữ.
- source_word: מֹות יוּמָת
  choice: thì chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn của hình phạt. “Phải bị xử tử” thể hiện đây là án phạt tư pháp, không chỉ là lời dự báo người ấy sẽ chết.
theological_decisions:
- issue: Phạm vi của hành vi phạm pháp
  choice: Điều luật áp dụng khi kẻ bắt cóc đã bán nạn nhân hoặc khi nạn nhân vẫn còn trong sự chiếm giữ của kẻ ấy.
  alternative: 'Có thể hiểu liên từ theo nghĩa tiếp nối: “và người ấy được tìm thấy trong tay hắn,” như một tình tiết bổ sung chứ không phải một trường hợp thay thế.'
  rationale: Mạch của điều luật đặt việc bán nạn nhân và việc còn giữ nạn nhân như hai khả năng sau hành vi trộm người. Dịch “hoặc” diễn đạt rõ lực pháp lý này, đồng thời chú thích ghi nhận sắc thái nguyên văn.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. “Kẻ nào … thì” tạo cấu trúc điều kiện tự nhiên trong tiếng Việt; “người ấy” và “kẻ đó” giúp phân biệt nạn nhân với thủ phạm. Giữ thành ngữ “trong tay” trong chính văn để gần nguồn, kèm chú thích giải nghĩa.
