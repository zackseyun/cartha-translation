  text: אִם יָק֞וּם וְ/הִתְהַלֵּ֥ךְ בַּ/ח֛וּץ עַל מִשְׁעַנְתּ֖/וֹ וְ/נִקָּ֣ה הַ/מַּכֶּ֑ה רַ֥ק שִׁבְתּ֛/וֹ יִתֵּ֖ן וְ/רַפֹּ֥א יְרַפֵּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: vi
  text: Nếu người bị đánh đứng dậy và chống gậy đi lại bên ngoài[a], thì người đánh sẽ được miễn tội; nhưng người ấy phải bồi thường thời gian người bị đánh phải nghỉ việc[b] và lo liệu cho người bị đánh được chữa lành hoàn toàn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trên gậy của mình”, tức là đi lại với sự nâng đỡ của cây gậy—một dấu hiệu cho thấy người ấy đã phần nào hồi phục.'
    reason: lexical_alternative
  - marker: b
    text: Chỉ khoảng thời gian người bị thương mất khả năng lao động hoặc không thể làm công việc thường ngày.
    reason: cultural_note
  - marker: c
    text: Tiếng Hê-bơ-rơ dùng lối nói nhấn mạnh, theo nghĩa sát là “chữa, phải chữa”, chỉ trách nhiệm bảo đảm người bị thương được điều trị đầy đủ.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: Nếu người bị đánh đứng dậy
  rationale: Diễn đạt điều kiện của điều luật và làm rõ chủ thể từ văn cảnh trước; יָקוּם chỉ việc hồi phục đủ để rời chỗ nằm.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: và ... đi lại bên ngoài
  rationale: Dạng Hitpael diễn tả khả năng đi lại, còn בַּחוּץ chỉ sự vận động ở bên ngoài, làm bằng chứng cho mức độ hồi phục.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: chống gậy
  rationale: Cụm Hê-bơ-rơ theo nghĩa sát là 'trên gậy của mình', hàm ý dùng gậy làm điểm tựa khi đi.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: thì người đánh sẽ không còn bị truy cứu
  rationale: נקה ở dạng Niphal trong ngữ cảnh pháp lý nói đến việc được miễn trách nhiệm hay hình phạt chính đối với thương tích, nhưng nghĩa vụ bồi thường tiếp theo vẫn còn.
- source_word: רַק שִׁבְתּוֹ יִתֵּן
  choice: tuy nhiên, người ấy phải bồi thường thời gian người bị đánh không thể làm việc
  rationale: רַק giới hạn phần trách nhiệm còn lại; שִׁבְתּוֹ trong luật thương tích chỉ thời gian nạn nhân phải ngưng hoạt động và mất khả năng lao động.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: và lo liệu cho người ấy được chữa lành hoàn toàn
  rationale: Kết cấu nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh nghĩa vụ bảo đảm việc chữa trị; cách dịch không hàm ý chính người đánh trực tiếp hành nghề chữa bệnh.
theological_decisions:
- issue: Phạm vi của וְנִקָּה trong điều luật
  choice: không còn bị truy cứu
  alternative: được trắng án
  rationale: Cách chọn giữ sắc thái pháp lý nhưng không gợi một phán quyết trắng án tuyệt đối, vì câu vẫn quy định nghĩa vụ bồi thường và chữa trị.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “người bị đánh” và “người đánh” để xác định rõ các bên; “lo liệu” truyền đạt trách nhiệm tổ chức hoặc chi trả việc chữa trị mà không thêm chi tiết vượt quá bản văn.
