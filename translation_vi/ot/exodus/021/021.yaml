  - severity: low
    issue: Vị trí chú thích a hiện gắn với “báo trả” nhưng nội dung câu cần được chỉnh.
    rationale: Sau khi thay thuật ngữ, giữ chú thích ngay sau “bị báo thù” để neo rõ lựa chọn từ vựng.
