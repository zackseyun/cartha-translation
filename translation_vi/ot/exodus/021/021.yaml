  text: אַ֥ךְ אִם י֛וֹם א֥וֹ יוֹמַ֖יִם יַעֲמֹ֑ד לֹ֣א יֻקַּ֔ם כִּ֥י כַסְפּ֖/וֹ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: vi
  text: Tuy nhiên, nếu người ấy còn sống thêm một hoặc hai ngày, thì sẽ không bị báo thù[a], vì người ấy là tiền của chủ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ không bị trừng phạt.” Từ Hê-bơ-rơ nói cụ thể hơn đến việc báo thù hoặc thi hành sự báo trả theo pháp luật.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “vì người ấy là tiền của chủ,” diễn tả giá trị kinh tế của người nô lệ đối với chủ.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Tuy nhiên
  rationale: Mở đầu ngoại lệ hoặc điều kiện hạn định đối với luật lệ ngay trước đó; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: một hoặc hai ngày
  rationale: Giữ rõ khoảng thời gian được nêu trong thành ngữ Hê-bơ-rơ.
- source_word: יַעֲמֹד
  choice: còn sống được
  rationale: Nghĩa đen là “đứng/vẫn đứng”, nhưng trong bối cảnh người vừa bị đánh, động từ chỉ việc tiếp tục sống chứ không nhất thiết đã bình phục.
- source_word: לֹא יֻקַּם
  choice: không được báo trả
  rationale: Dùng cấu trúc phiếm chỉ để giữ sắc thái bị động và không xác định rõ chủ thể của nguyên văn; “báo trả” bảo lưu ý nghĩa báo thù hoặc trừng phạt pháp lý của căn tố נקם.
- source_word: כִּי כַסְפּוֹ הוּא
  choice: vì người ấy là tiền của chủ
  rationale: Giữ nguyên cách nói kinh tế thẳng và khắc nghiệt của tiếng Hê-bơ-rơ; “tiền” sát với כֶּסֶף hơn cách diễn giải rộng thành “tài sản”.
theological_decisions:
- issue: Lý do kinh tế trong luật về chế độ nô lệ
  choice: Giữ cách nói “người ấy là tiền của chủ”.
  alternative: “người ấy là tài sản của chủ” hoặc “chủ đã tự chịu thiệt hại”
  rationale: Nguyên văn nêu lý do bằng ngôn ngữ kinh tế rất trực diện. Không làm nhẹ đi sự khắc nghiệt của điều luật và cũng không diễn giải thêm một phán đoán đạo đức ngoài văn bản.
- issue: Chủ thể của לֹא יֻקַּם
  choice: 'Dịch phiếm chỉ: “không được báo trả”.'
  alternative: “chủ sẽ không bị trừng phạt” hoặc “người ấy sẽ không được báo thù”
  rationale: Dạng động từ bị động trong tiếng Hê-bơ-rơ không nêu chủ thể rõ ràng. Cách dịch phiếm chỉ bảo tồn phần nào sự mơ hồ giữa việc không thi hành báo trả và việc chủ không phải chịu báo trả.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. Dùng “người ấy” để nối với người bị đánh trong câu trước, tránh lặp danh xưng không có trong chính câu này; dùng “chủ” để làm rõ sở hữu cách theo ngữ cảnh. Mọi dấu chú thích đều xuất hiện trong bản văn.
