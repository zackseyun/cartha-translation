revisions:
- from: Tuy nhiên, nếu người ấy còn sống được một hoặc hai ngày, thì không được báo trả[a], vì người ấy là tiền của chủ[b].
  to: Tuy nhiên, nếu người ấy còn sống thêm một hoặc hai ngày, thì sẽ không bị báo thù[a], vì người ấy là tiền của chủ[b].
  rationale: Chỉnh cách diễn đạt bị động về sự báo thù/trừng phạt pháp lý cho tự nhiên trong tiếng Việt, đồng thời giữ nguyên tính mơ hồ của chủ thể bị động trong tiếng Hê-bơ-rơ. Giữ cách nói thẳng “tiền của chủ” và hai chú thích, với neo chú thích phù hợp với cụm từ được giải thích.
  reviewer_model: gpt-5.6-terra
