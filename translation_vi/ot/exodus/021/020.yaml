base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: vi
  text: Nếu một người dùng gậy đánh nô lệ nam hay nô lệ nữ của mình, và người nô lệ chết dưới tay người ấy, thì người nô lệ ấy chắc chắn phải được báo thù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kẻ đánh chắc chắn phải bị trừng phạt.” Nguyên văn sát hơn là “chắc chắn phải được báo thù,” một công thức pháp lý nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Nếu
  rationale: Mở đầu một điều luật theo tình huống; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ.
- source_word: יַכֶּה
  choice: đánh
  rationale: Diễn đạt nghĩa rộng của נכה, còn công cụ được xác định bởi cụm “dùng gậy”.
- source_word: אִישׁ
  choice: một người
  rationale: Trong văn luật tiếng Việt, “một người” vừa tự nhiên vừa chỉ chủ thể cá nhân; không làm thay đổi việc nguyên ngữ dùng danh từ giống đực.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: nô lệ nam hay nô lệ nữ của mình
  rationale: Phản ánh rõ thân phận lệ thuộc và giữ sự phân biệt nam–nữ được nguyên ngữ nêu song song.
- source_word: בַּשֵּׁבֶט
  choice: dùng gậy
  rationale: שֵׁבֶט ở đây là dụng cụ dùng để đánh; “gậy” là cách nói rõ và tự nhiên.
- source_word: וּמֵת תַּחַת יָדוֹ
  choice: và người nô lệ chết ngay dưới tay người ấy
  rationale: Nêu lại “người nô lệ” để tránh đại từ mơ hồ; “dưới tay” giữ hình ảnh nguyên ngữ, còn “ngay” biểu đạt cái chết xảy ra trực tiếp trong lúc bị đánh.
- source_word: נָקֹם יִנָּקֵם
  choice: chắc chắn phải được báo thù
  rationale: Giữ nghĩa trực tiếp của căn נקם và sức nhấn mạnh của cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn, không tự quy định hình phạt cụ thể.
theological_decisions:
- issue: Bản chất hậu quả pháp lý trong נָקֹם יִנָּקֵם
  choice: người nô lệ chắc chắn phải được báo thù
  alternative: kẻ đánh chắc chắn phải bị trừng phạt
  rationale: Nguyên ngữ nhấn mạnh rằng phải có hành động báo thù cho nạn nhân nhưng câu này không nói rõ cơ chế hay mức hình phạt; bản dịch chính giữ sự căng thẳng và tính bất định ấy.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại, dễ hiểu. Dùng “nô lệ” thay vì “đầy tớ” để phản ánh đúng thân phận lệ thuộc; tránh lối diễn đạt cổ và không xác định thêm hình phạt mà câu Hebrew không nêu.
