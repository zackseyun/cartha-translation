source:
  edition: WLC
  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: vi
  text: Nếu một người đàn ông bán con gái mình làm nữ nô lệ[a], thì cô ấy sẽ không được trả tự do theo cách các nam nô lệ được trả tự do[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nữ tỳ” hoặc “đầy tớ gái”. Từ Hê-bơ-rơ אָמָה chỉ một phụ nữ trong tình trạng phục dịch lệ thuộc; trong bối cảnh luật này, “nữ nô lệ” làm rõ địa vị pháp lý ấy.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là cô ấy không được phóng thích theo cùng những điều kiện áp dụng cho các nam nô lệ; điều này đối chiếu với quy định về nam nô lệ ở các câu ngay trước đó.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện trong chuỗi luật; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ.
- source_word: יִמְכֹּר
  choice: bán
  rationale: Diễn đạt trực tiếp hành vi pháp lý trong tình huống luật định chung.
- source_word: אִישׁ
  choice: một người
  rationale: Trong câu luật này, từ chỉ người thực hiện việc bán; cách dịch tự nhiên, không thêm danh xưng 'cha' dù quan hệ cha con đã rõ qua 'con gái mình'.
- source_word: בִּתּוֹ
  choice: con gái mình
  rationale: Chuyển tải trực tiếp danh từ quan hệ cùng hậu tố ngôi thứ ba số ít giống đực.
- source_word: לְאָמָה
  choice: làm nữ nô lệ
  rationale: אָמָה chỉ một phụ nữ ở địa vị lệ thuộc do bị bán; 'nữ nô lệ' làm rõ địa vị pháp lý, còn 'làm' diễn đạt לְ chỉ vai trò hoặc thân phận.
- source_word: לֹא תֵצֵא
  choice: không được ra khỏi cảnh phục dịch
  rationale: Trong văn cảnh pháp lý, 'đi ra' nói đến việc chấm dứt thân phận phục dịch; cách diễn đạt này vừa giữ hình ảnh 'ra' vừa giúp người đọc hiểu ý.
- source_word: כְּצֵאת
  choice: theo cách ... được ra
  rationale: Giữ cấu trúc so sánh và sự lặp lại của động từ יצא trong tiếng Hê-bơ-rơ.
- source_word: הָעֲבָדִים
  choice: các nam nô lệ
  rationale: Số nhiều của עֶבֶד được hiểu trong thế đối chiếu với אָמָה và với luật về người nô lệ nam ngay trước đó; thêm 'nam' làm rõ sự phân biệt giới tính vốn có trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch thuật ngữ về chế độ nô lệ trong luật giao ước
  choice: Dùng “nữ nô lệ” và “nam nô lệ”.
  alternative: “nữ tỳ”, “đầy tớ gái” và “đầy tớ”
  rationale: Câu này quy định việc bán và ra khỏi cảnh phục dịch, nên địa vị lệ thuộc về pháp lý là trọng tâm. 'Nô lệ' không làm nhẹ thực tế xã hội được nguyên văn mô tả, nhưng bản dịch cũng không thêm phán đoán thần học hay đạo đức ngoài câu.
translation_notes:
  register: Văn phong luật định trang trọng nhưng hiện đại. Dùng “nô lệ” để thể hiện rõ địa vị pháp lý; tránh từ cổ nếu không cần thiết. Cụm “ra khỏi cảnh phục dịch” làm sáng tỏ thành ngữ pháp lý mà vẫn bảo lưu động từ “ra” của nguyên văn.
