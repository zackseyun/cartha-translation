revisions:
- from: Nếu một người bán con gái mình làm nữ nô lệ[a], thì cô ấy không được ra khỏi cảnh phục dịch theo cách các nam nô lệ được ra[b].
  to: Nếu một người đàn ông bán con gái mình làm nữ nô lệ[a], thì cô ấy sẽ không được trả tự do theo cách các nam nô lệ được trả tự do[b].
  rationale: Bản sửa giữ nguyên ý nghĩa pháp lý và sự đối chiếu giới tính của nguyên văn, đồng thời thay cách nói dễ gây hiểu nhầm như một mệnh lệnh bằng cách diễn đạt tự nhiên hơn về việc được trả tự do. “Một người đàn ông” phản ánh אִישׁ mà không thêm vai trò “cha” không được nêu trực tiếp.
  reviewer_model: gpt-5.6-terra
