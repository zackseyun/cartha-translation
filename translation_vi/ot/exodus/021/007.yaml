    rationale: לֹא תֵצֵא trong ngữ cảnh luật về nô lệ nói đến việc không được ra/được phóng thích như các nô lệ nam, chứ không chủ yếu là mệnh lệnh đạo đức nhắm vào cô ấy.
  - severity: low
