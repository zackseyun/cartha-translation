language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם אָמֹ֤ר יֹאמַר֙ הָ/עֶ֔בֶד אָהַ֨בְתִּי֙ אֶת אֲדֹנִ֔/י אֶת אִשְׁתִּ֖/י וְ/אֶת בָּנָ֑/י לֹ֥א אֵצֵ֖א חָפְשִֽׁי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the servant plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: vi
  text: 'Nhưng nếu người nô lệ nhất quyết nói[a]: “Tôi yêu chủ tôi, vợ tôi và các con trai tôi[b]; tôi sẽ không ra đi tự do,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quả quyết nói” hoặc “tuyên bố rõ ràng”. Tiếng Hê-bơ-rơ dùng nguyên mẫu tuyệt đối cùng với động từ hữu hạn để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “các con tôi”. Từ Hê-bơ-rơ ở dạng giống đực số nhiều, nghĩa trực tiếp là “các con trai”, nhưng trong ngữ cảnh gia đình có thể được dùng theo nghĩa con cái nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một trường hợp ngoại lệ có tính tương phản với quy định về việc được trả tự do ở câu trước.
- source_word: אָמֹר יֹאמַר
  choice: quả quyết nói rằng
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn tạo sắc thái nhấn mạnh; cách dịch này diễn đạt một lời tuyên bố rõ ràng, dứt khoát.
- source_word: הָעֶבֶד
  choice: người nô lệ
  rationale: Trong bối cảnh luật pháp này, địa vị lệ thuộc và việc được trả tự do là trọng tâm; “nô lệ” thể hiện rõ thực trạng pháp lý hơn “đầy tớ”.
- source_word: אָהַבְתִּי
  choice: Tôi yêu
  rationale: Thể hoàn thành ở đây diễn tả tình cảm và sự gắn bó hiện tại đã được xác lập; thì hiện tại là tự nhiên trong tiếng Việt.
- source_word: אֲדֹנִי
  choice: chủ tôi
  rationale: Phù hợp quan hệ quyền bính trong gia đình và bối cảnh nô lệ, không mang sắc thái tôn giáo không cần thiết.
- source_word: אִשְׁתִּי
  choice: vợ tôi
  rationale: Cách chuyển ngữ trực tiếp, tự nhiên của danh từ kèm hậu tố sở hữu.
- source_word: בָּנָי
  choice: các con tôi
  rationale: Từ Hê-bơ-rơ có hình thức giống đực số nhiều, nghĩa đen là “các con trai”, nhưng trong ngữ cảnh gia đình có thể chỉ con cái nói chung; bản dịch chính giữ phạm vi khả dĩ rộng hơn.
- source_word: לֹא אֵצֵא
  choice: tôi không muốn ra đi
  rationale: Trong lời tuyên bố lựa chọn ở bối cảnh này, động từ chưa hoàn thành phủ định thể hiện quyết định không nhận việc ra khỏi cảnh phục dịch; “không muốn” làm rõ ý chí mà không xóa hình ảnh “ra đi”.
- source_word: חָפְשִׁי
  choice: tự do
  rationale: Tính từ vị ngữ mô tả tình trạng của người ấy khi ra đi; “ra đi tự do” giữ gần cấu trúc và ý nghĩa của nguyên văn.
theological_decisions:
- issue: Cách dịch עבד trong luật về sự phục dịch của người Y-sơ-ra-ên
  choice: người nô lệ
  alternative: người đầy tớ; người tôi tớ
  rationale: Đoạn luật nói đến một người ở trong tình trạng lệ thuộc, có thể được phóng thích nhưng tự nguyện từ bỏ việc ấy. “Người nô lệ” không làm nhẹ đi địa vị pháp lý vốn là trọng tâm của câu.
- issue: Phạm vi của בָּנַי
  choice: các con tôi
  alternative: các con trai tôi
  rationale: Giữ trong bản văn chính khả năng số nhiều giống đực được dùng theo nghĩa chung cho con cái, đồng thời ghi nhận nghĩa hình thái hẹp hơn trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Lời nói trực tiếp dùng “tôi” tự nhiên; giữ hình ảnh pháp lý “ra đi tự do”. Tất cả dấu chú thích [a], [b] đều xuất hiện trong bản văn chính.
