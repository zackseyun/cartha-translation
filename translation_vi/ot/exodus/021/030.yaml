  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִם כֹּ֖פֶר יוּשַׁ֣ת עָלָ֑י/ו וְ/נָתַן֙ פִּדְיֹ֣ן נַפְשׁ֔/וֹ כְּ/כֹ֥ל אֲשֶׁר יוּשַׁ֖ת עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: vi
  text: Nếu một khoản chuộc mạng được ấn định cho người ấy[a], thì người ấy phải trả giá chuộc mạng mình theo đúng số tiền đã được ấn định.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu người ấy bị buộc phải nộp tiền chuộc mạng...” Tiếng Hê-bơ-rơ dùng hai từ có liên hệ nhưng khác nhau: כֹּפֶר (“khoản chuộc mạng”) và פִּדְיֹן (“giá chuộc”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Giữ rõ cấu trúc điều kiện của trường hợp pháp lý tiếp nối quy định trước.
- source_word: כֹּפֶר
  choice: một khoản chuộc mạng
  rationale: Diễn đạt khoản tiền dùng để tránh hình phạt đối với mạng sống trong bối cảnh pháp lý, không đưa sắc thái tế tự vào câu.
- source_word: יוּשַׁת עָלָיו
  choice: được ấn định cho người ấy
  rationale: Thể bị động của שׁית với עַל chỉ một nghĩa vụ pháp lý được đặt ra cho một người; “ấn định” tự nhiên đối với khoản tiền.
- source_word: וְנָתַן
  choice: thì người ấy phải trả
  rationale: Truyền đạt hệ quả và tính bắt buộc của điều luật bằng cách nói tự nhiên trong tiếng Việt.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: giá chuộc mạng mình
  rationale: Giữ ý về giá dùng để giải cứu mạng sống, đồng thời phân biệt tương đối giữa פִּדְיֹן (“giá chuộc”) và כֹּפֶר (“khoản chuộc mạng”).
- source_word: נַפְשׁוֹ
  choice: mạng mình
  rationale: Trong ngữ cảnh xét xử này, נֶפֶשׁ nói đến mạng sống của người ấy, không phải linh hồn phi vật chất.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: theo đúng số tiền đã được ấn định
  rationale: Diễn đạt sự tương ứng đầy đủ với toàn bộ khoản đã được quyết định, phù hợp ngữ cảnh tiền chuộc.
theological_decisions:
- issue: Bản chất của khoản trả trong bối cảnh trách nhiệm có thể chịu án tử hình
  choice: Dùng “khoản chuộc mạng” và “giá chuộc mạng” như thuật ngữ pháp lý về việc cứu mạng khỏi hình phạt.
  alternative: Dịch cả hai từ là “tiền phạt”, hoặc dùng ngôn ngữ mạnh về sự chuộc tội theo nghi lễ.
  rationale: Bản văn nói đến khoản tiền được ấn định để chuộc mạng người có trách nhiệm khỏi hình phạt áp dụng; cách dịch giữ sắc thái pháp lý–giải cứu mà không hàm ý người ấy vô tội hay nói đến nghi lễ chuộc tội.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. Dùng “người ấy” để tránh đại từ mang sắc thái cổ; “mạng mình” tự nhiên và chính xác hơn “linh hồn mình” trong ngữ cảnh này.
