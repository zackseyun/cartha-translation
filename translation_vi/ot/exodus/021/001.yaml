  yaml_path: translation/ot/exodus/021/001.yaml
  text: These are the judgments that you shall set before them:[a]
translation:
  language: vi
  text: 'Đây là những luật lệ[a] mà ngươi phải đặt ra trước mặt họ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quy định” hoặc “phán quyết.” Từ Hê-bơ-rơ này chỉ các phán quyết pháp lý hoặc những luật áp dụng cho từng trường hợp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Đây là
  rationale: Cách mở đầu tự nhiên trong tiếng Việt; quan hệ nối tiếp với phần trước được giữ qua ngữ cảnh mà không thêm một từ chỉ thời gian như “bây giờ”.
- source_word: הַ/מִּשְׁפָּטִים
  choice: những phán lệ
  rationale: Trong phần luật giao ước này, מִשְׁפָּטִים chỉ các phán quyết hoặc quy định pháp lý mang tính án lệ. “Phán lệ” giữ được sắc thái tư pháp rõ hơn “luật lệ” chung chung.
- source_word: אֲשֶׁר
  choice: mà
  rationale: Đại từ quan hệ tự nhiên trong tiếng Việt, dẫn vào mệnh đề bổ nghĩa.
- source_word: תָּשִׂים
  choice: phải trình bày
  rationale: Động từ שׂים có nghĩa đen là đặt/để; đi với “trước họ” trong ngữ cảnh truyền luật, “trình bày” diễn đạt tự nhiên hành động đặt các điều luật ra trước dân chúng, còn “phải” thể hiện lực chỉ thị của dạng vị hoàn.
- source_word: לִ/פְנֵי/הֶם
  choice: trước họ
  rationale: Giữ sát thành ngữ Hê-bơ-rơ, mang nghĩa đưa ra trước mặt hoặc trước sự hiện diện của họ.
theological_decisions:
- issue: Cách dịch מִשְׁפָּטִים trong bối cảnh luật giao ước
  choice: phán lệ
  alternative: luật lệ; quy định; phán quyết
  rationale: Đây chủ yếu là vấn đề từ vựng và thể loại, không phải quyết định giáo lý. “Phán lệ” bảo tồn sắc thái pháp lý-tư pháp và phù hợp với các luật theo trường hợp ở phần tiếp theo, trong khi chú thích ghi nhận các cách hiểu rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” vì lời phán trực tiếp hướng đến Môi-se trong bối cảnh cổ; dấu hai chấm báo hiệu các phán lệ theo sau.
