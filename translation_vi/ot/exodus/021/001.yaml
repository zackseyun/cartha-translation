  rationale: Thay “phán lệ” bằng “luật lệ” để dùng tiếng Việt hiện đại tự nhiên và tránh thu hẹp nghĩa của thuật ngữ Hê-bơ-rơ vào khái niệm tiền lệ xét xử. Điều chỉnh động từ thành “đặt ra trước mặt họ” để phản ánh trực tiếp hơn cách nói nguyên ngữ, không thay đổi ý nghĩa.
