  text: וּ/מַכֵּ֥ה אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: vi
  text: Ai đánh cha mình hay mẹ mình thì chắc chắn phải bị xử tử.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ là “và mẹ mình”; ở đây dịch là “hay mẹ mình” để làm rõ ý nghĩa pháp lý: đánh cha hoặc đánh mẹ đều thuộc trường hợp này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: đánh
  rationale: Phân từ của נכה chỉ hành động đánh hoặc giáng đòn. “Đánh” tự nhiên, rõ nghĩa trong tiếng Việt và không hàm ý quá mức rằng nạn nhân bị đánh nhiều lần hay bị tấn công bằng vũ khí.
- source_word: אָבִיו
  choice: cha mình
  rationale: Tiếng Hê-bơ-rơ nói cụ thể đến người cha ở số ít; “cha mình” giữ nguyên quan hệ sở hữu trong cách diễn đạt pháp luật.
- source_word: אִמּוֹ
  choice: mẹ mình
  rationale: Tiếng Hê-bơ-rơ nêu riêng người mẹ; bản dịch giữ cấu trúc nhắc đến cả cha lẫn mẹ.
- source_word: מוֹת יוּמָת
  choice: chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn có tác dụng nhấn mạnh án tử hình. “Bị xử tử” giữ thể bị động và tính chất chế tài tư pháp, còn “chắc chắn” thể hiện sắc thái nhấn mạnh.
- source_word: וּ / וְ
  choice: hay
  rationale: Liên từ theo hình thức là “và”, nhưng trong điều luật này, ý nghĩa là đánh một trong hai người—cha hay mẹ—đều chịu hình phạt. “Hay” truyền đạt đúng phạm vi áp dụng và tránh khiến người đọc hiểu rằng phải đánh cả hai.
theological_decisions:
- issue: Cách diễn đạt công thức hình phạt pháp lý
  choice: chắc chắn phải bị xử tử
  alternative: phải chết
  rationale: Câu này quy định một hình phạt tư pháp chứ không chỉ nói người ấy sẽ chết. Thể bị động “bị xử tử” bảo toàn ý hành quyết theo phán quyết pháp luật, còn cấu trúc nhấn mạnh của nguyên văn được thể hiện bằng “chắc chắn”.
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại. “Ai… thì…” là cấu trúc điều kiện tự nhiên trong tiếng Việt; “cha mình” và “mẹ mình” rõ ràng, dễ hiểu; “xử tử” giữ sắc thái tư pháp của nguyên văn.
