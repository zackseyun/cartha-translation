  text: וְ/כִֽי יִפְתַּ֨ח אִ֜ישׁ בּ֗וֹר א֠וֹ כִּֽי יִכְרֶ֥ה אִ֛ישׁ בֹּ֖ר וְ/לֹ֣א יְכַסֶּ֑/נּוּ וְ/נָֽפַל שָׁ֥מָּ/ה שּׁ֖וֹר א֥וֹ חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: vi
  text: Nếu một người mở một cái hố[a], hoặc đào một cái hố mà không đậy lại, rồi một con bò hay một con lừa rơi xuống đó,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ có nghĩa đen là “mở”; ở đây có thể chỉ việc mở một hố đã có sẵn, phân biệt với việc đào hố mới ở vế sau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Nếu
  rationale: Mở đầu điều kiện của luật tình huống; trong tiếng Việt, “Nếu” tự nhiên và đủ để nối tiếp mạch các điều luật.
- source_word: יִפְתַּח
  choice: mở miệng
  rationale: Giữ nghĩa cơ bản “mở” và làm rõ đối tượng là miệng hố; có thể nói đến việc mở một hố đã có, khác với việc đào hố ở vế sau.
- source_word: אִישׁ
  choice: một người
  rationale: Công thức pháp lý số ít giống đực được dùng theo nghĩa khái quát; “một người” truyền đạt tự nhiên mà không thu hẹp phạm vi áp dụng vào nam giới.
- source_word: בּוֹר
  choice: hố
  rationale: Thuật ngữ rộng, phù hợp với một chỗ đào không đậy gây nguy hiểm cho gia súc; ngữ cảnh không buộc phải hiểu riêng là bể chứa nước.
- source_word: א֠וֹ כִּי
  choice: hoặc
  rationale: Đánh dấu tình huống pháp lý thay thế song song với vế đầu.
- source_word: יִכְרֶה
  choice: đào
  rationale: Diễn đạt trực tiếp hành động tạo ra hố và giữ sự phân biệt với việc mở miệng một hố có sẵn.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: mà không đậy lại
  rationale: Chỉ việc không che phủ hố; “mà” diễn đạt tự nhiên quan hệ hoàn cảnh/hệ quả trong tiếng Việt.
- source_word: וְ/נָפַל
  choice: rồi ... rơi
  rationale: Trong chuỗi luật tình huống, động từ tiếp tục giả định điều kiện; “rồi” thể hiện trình tự tự nhiên.
- source_word: שָׁמָּה
  choice: xuống đó
  rationale: Giữ sắc thái chỉ hướng của tiếng Hê-bơ-rơ và phù hợp với động từ “rơi” trong tiếng Việt.
- source_word: שּׁוֹר
  choice: một con bò
  rationale: “Bò” là cách gọi thông dụng, rộng và tự nhiên cho gia súc thuộc loài bò trong văn cảnh pháp luật.
- source_word: א֥וֹ חֲמוֹר
  choice: hay một con lừa
  rationale: Cách gọi hiện đại, rõ ràng cho gia súc chở tải được nêu trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng tự nhiên, dễ hiểu trong tiếng Việt hiện đại. Cấu trúc câu giữ nguyên tính điều kiện và dấu phẩy cuối câu vì quy định về trách nhiệm được tiếp tục ở câu sau.
