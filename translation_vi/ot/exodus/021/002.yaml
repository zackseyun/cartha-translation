    rationale: תִקְנֶה là ngôi thứ hai số ít. Dù số ít trong luật có thể mang tính đại diện, “anh em” thường là số nhiều trong tiếng Việt và không phải cách xưng hô phù hợp ở đây.
  - severity: low
    issue: Đại từ “người ấy” sau mệnh đề mua có thể mơ hồ.
    rationale: Câu có cả người mua lẫn nô lệ. Lặp lại “nô lệ ấy” làm rõ rằng chính người bị mua là người phải phục dịch.
