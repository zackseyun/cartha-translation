  to: Nếu ai mua một nô lệ Hê-bơ-rơ[a], nô lệ ấy phải phục dịch sáu năm; nhưng đến năm thứ bảy, người ấy sẽ được tự do mà không phải trả tiền[b].
  rationale: Sửa ngôi xưng hô số nhiều thành chủ ngữ khái quát “ai”, làm rõ chủ thể phục dịch là nô lệ, và điều chỉnh chú thích để diễn đạt tự nhiên, sát nghĩa hơn. Không thay đổi nội dung điều luật hay áp đặt diễn giải thần học.
