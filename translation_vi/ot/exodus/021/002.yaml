source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: vi
  text: Nếu ai mua một nô lệ Hê-bơ-rơ[a], nô lệ ấy phải phục dịch sáu năm; nhưng đến năm thứ bảy, người ấy sẽ được tự do mà không phải trả tiền[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi ai mua một nô lệ Hê-bơ-rơ.” Từ nối Hê-bơ-rơ mở đầu một điều luật theo tình huống, có thể được hiểu là “nếu” hoặc “khi”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “người ấy sẽ đi ra để được tự do, không phải trả tiền.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong luật theo tình huống, כִּי mở đầu trường hợp giả định; “nếu” tự nhiên và chuẩn xác trong văn phong pháp luật tiếng Việt.
- source_word: תִקְנֶה
  choice: mua
  rationale: Động từ קנה trong bối cảnh giao dịch này có nghĩa là mua hay thủ đắc; “mua” diễn đạt trực tiếp tính thương mại của điều luật.
- source_word: עֶבֶד
  choice: nô lệ
  rationale: Người này được mua và phải phục dịch trong một thời hạn, nên “nô lệ” phản ánh minh bạch địa vị lệ thuộc hơn “đầy tớ” hay “tôi tớ”.
- source_word: עִבְרִי
  choice: người Hê-bơ-rơ
  rationale: Giữ đúng danh xưng cụ thể của nguyên văn, không đồng nhất hóa với từ rộng hơn là “người Y-sơ-ra-ên”.
- source_word: שֵׁשׁ שָׁנִים
  choice: sáu năm
  rationale: Cụm chỉ thời hạn được chuyển dịch trực tiếp.
- source_word: יַעֲבֹד
  choice: phải phục dịch
  rationale: עבד có nghĩa là làm việc hoặc phục dịch; “phục dịch” phù hợp với địa vị nô lệ và sắc thái quy định pháp lý.
- source_word: וּבַשְּׁבִעִת
  choice: nhưng đến năm thứ bảy
  rationale: Liên từ tạo thế tương phản với sáu năm trước đó; thêm “năm” vốn được ngầm hiểu giúp câu tiếng Việt rõ và tự nhiên.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: sẽ được tự do
  rationale: Thành ngữ Hê-bơ-rơ theo sát mặt chữ là “đi ra để được tự do”; cách dịch này truyền đạt rõ ý được thoát khỏi tình trạng nô lệ trong tiếng Việt hiện đại.
- source_word: חִנָּם
  choice: mà không phải trả tiền
  rationale: Trong bối cảnh phóng thích, từ này cho biết người nô lệ không phải nộp khoản tiền chuộc để được tự do.
theological_decisions:
- issue: Cách dịch עֶבֶד trong luật về chế độ nô lệ
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Điều luật nói đến một người được mua và phải phục dịch có thời hạn. “Nô lệ” giữ nguyên thực trạng lệ thuộc trong văn bản, không làm nhẹ đi bằng một từ chỉ người phục vụ nói chung.
- issue: Chủ thể của khoản tiền khi được phóng thích
  choice: không phải trả tiền
  alternative: không nhận tiền; ra đi tay không
  rationale: חִנָּם xác định sự phóng thích không đòi khoản thanh toán; bản dịch không thêm một chủ thể nhận tiền hoặc kết luận rằng người được thả không mang theo tài sản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số ít có tính đại diện trong lời luật dành cho cộng đồng, tránh “ngươi” cổ kính. “Nô lệ” được dùng thẳng thắn để phản ánh địa vị pháp lý trong nguyên văn; “phục dịch” giữ sắc thái lệ thuộc mà vẫn tự nhiên.
