  - severity: low
    issue: Ký hiệu chú thích đặt ở cuối câu thay vì sau thuật ngữ được chú giải.
    rationale: Chú thích chỉ trực tiếp giải thích “quyền vợ chồng”, nên cần đặt neo ngay sau cụm này để rõ phạm vi.
