  yaml_path: translation/ot/exodus/021/010.yaml
  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: vi
  text: Nếu người ấy lấy một người vợ khác, thì không được cắt giảm thức ăn, quần áo hay quyền vợ chồng của nàng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quyền chung chăn gối”. Từ Hê-bơ-rơ này chỉ nghĩa vụ của người chồng về sự thân mật vợ chồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Giữ nguyên hình thức điều kiện của luật tình huống trong tiếng Hê-bơ-rơ.
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: người ấy lấy thêm một người vợ khác
  rationale: Trong ngữ cảnh hôn nhân, לָקַח một người nữ có nghĩa là lấy làm vợ; “thêm” diễn đạt tự nhiên việc người ấy lấy một người khác cho mình mà không biến câu thành thuật ngữ chuyên môn.
- source_word: שְׁאֵרָהּ
  choice: thức ăn
  rationale: Dù danh từ này có liên hệ từ nguyên với “thịt”, trong bộ ba nghĩa vụ hôn nhân ở đây, nghĩa phù hợp nhất là phần cấp dưỡng bằng thức ăn.
- source_word: כְּסוּתָהּ
  choice: quần áo
  rationale: Danh từ chỉ vật che thân hoặc y phục; “quần áo” là cách nói hiện đại, rõ ràng trong văn cảnh pháp luật.
- source_word: וְעֹנָתָהּ
  choice: quyền vợ chồng của nàng
  rationale: Từ Hê-bơ-rơ hiếm và khó này nói đến nghĩa vụ thân mật trong hôn nhân. Cách dịch này giữ sắc thái một quyền lợi nàng không được bị tước giảm, đồng thời tránh diễn đạt quá thô hoặc quá mơ hồ.
- source_word: לֹא יִגְרָע
  choice: không được cắt giảm
  rationale: Diễn đạt mệnh lệnh pháp lý cấm làm giảm bất cứ khoản nào trong ba nghĩa vụ được liệt kê.
theological_decisions:
- issue: Phạm vi của עֹנָה trong nghĩa vụ hôn nhân
  choice: quyền vợ chồng
  alternative: việc chăn gối; quyền chung chăn gối
  rationale: Bản dịch chính giữ cả khía cạnh quyền lợi và quan hệ hôn nhân, còn chú thích làm rõ rằng từ này đặc biệt liên quan đến sự thân mật vợ chồng, không áp đặt một cách giải thích giáo phái rộng hơn.
translation_notes:
  register: Văn phong pháp lý trang trọng nhưng hiện đại. “Người ấy” và “của nàng” giúp theo sát các đại từ trong nguyên văn; “không được cắt giảm” tự nhiên hơn lối dịch cổ mà vẫn giữ lực cấm đoán.
