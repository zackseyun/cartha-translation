base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: vi
  text: Nếu những người đàn ông cãi nhau, và một người dùng đá hoặc nắm đấm đánh người kia, người bị đánh không chết nhưng phải nằm một chỗ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “ngã xuống giường”; đây là thành ngữ chỉ việc phải nằm một chỗ vì thương tích.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một trường hợp luật giả định; “Nếu” tự nhiên và phù hợp với văn phong luật định theo tình huống.
- source_word: יְרִיבֻן אֲנָשִׁים
  choice: những người đàn ông cãi nhau
  rationale: Giữ rõ danh từ số nhiều giống đực אֲנָשִׁים và diễn đạt ריב là tranh cãi có thể leo thang thành bạo lực, không cường điệu thành giao chiến.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: một người ... đánh người kia
  rationale: Diễn đạt tự nhiên quan hệ giữa hai bên trong vụ cãi nhau; רֵעֵהוּ ở đây chỉ người cùng tham gia, nên “người kia” rõ hơn “người lân cận” trong tiếng Việt.
- source_word: בְּאֶבֶן אוֹ בְאֶגְרֹף
  choice: dùng đá hoặc nắm đấm
  rationale: Giới từ בְּ mang nghĩa phương tiện. אֶגְרֹף thường được hiểu là “nắm đấm”; cách dịch này giữ nghĩa trực tiếp và tự nhiên.
- source_word: וְלֹא יָמוּת
  choice: người ấy không chết
  rationale: Đại từ quy chiếu về người bị đánh; giữ nguyên kết quả được nêu trong nguyên văn mà không thêm ý thời gian.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: nhưng phải nằm liệt giường
  rationale: Thành ngữ nghĩa đen là “ngã xuống giường/nằm xuống giường”, chỉ tình trạng phải nằm vì thương tích. “Phải nằm liệt giường” rõ và tự nhiên trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong luật định trang trọng nhưng dễ hiểu. Dùng “những người đàn ông” để phản ánh אֲנָשִׁים; dùng “người kia” thay cho cách dịch máy móc “người lân cận”. Dấu phẩy cuối câu cho thấy câu luật còn tiếp sang câu sau.
