  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: vi
  text: Nhưng nếu người chủ định người nữ ấy cho con trai mình, thì phải đối xử với cô ấy theo quyền của các con gái.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo quy lệ dành cho các con gái” hoặc “theo thông lệ dành cho các con gái.” Cụm từ Hê-bơ-rơ có thể chỉ quyền hoặc quy định pháp lý đã được thiết lập, cũng có thể chỉ cách đối xử theo thông lệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Mở đầu một trường hợp có điều kiện trong chuỗi luật và biểu thị sự tương phản với trường hợp trước.
- source_word: לִבְנוֹ
  choice: cho con trai mình
  rationale: Giới từ ל ở đây chỉ việc định người nữ cho con trai trong một sự sắp đặt hôn nhân; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: יִיעָדֶנָּה
  choice: định nàng
  rationale: Giữ sắc thái pháp lý của việc chỉ định người nữ cho một quan hệ hôn nhân mà không thu hẹp nghĩa thành một thủ tục đính hôn cụ thể.
- source_word: כְּמִשְׁפַּט
  choice: theo quyền lợi dành cho
  rationale: מִשְׁפָּט trong ngữ cảnh luật pháp có thể chỉ quy định, quyền hoặc phần phải được hưởng; cách dịch này làm rõ sức nặng pháp lý nhưng vẫn ghi nhận nghĩa 'thông lệ' trong chú thích.
- source_word: הַבָּנוֹת
  choice: các con gái
  rationale: Dịch trực tiếp danh từ xác định số nhiều, chỉ địa vị và cách đối đãi dành cho con gái trong gia đình.
- source_word: יַעֲשֶׂה לָּהּ
  choice: phải đối xử với nàng
  rationale: Diễn đạt tự nhiên cấu trúc עשה + ל, chỉ hành động và nghĩa vụ đối với một người; 'phải' phù hợp hiệu lực quy định của luật.
theological_decisions:
- issue: Bản chất nghĩa vụ đối với người nữ được định cho con trai
  choice: Câu luật đòi hỏi nàng được đối xử theo quyền lợi dành cho các con gái.
  alternative: Cụm từ có thể nói hẹp hơn về thông lệ áp dụng khi gả con gái.
  rationale: כמשפט הבנות có sắc thái pháp lý rõ, nhưng cũng có thể chỉ quy lệ hay thông lệ đã được thiết lập. Bản dịch chính ưu tiên ý quyền lợi, còn chú thích bảo tồn khả năng thứ hai mà không áp đặt một hệ phái hay cách giải thích riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người chủ” để làm rõ chủ ngữ được tiếp nối từ văn cảnh, và dùng “nàng” nhằm giữ giọng văn luật cổ mà vẫn tự nhiên. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
