source:
  edition: WLC
  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: vi
  text: Nếu cô không vừa mắt chủ mình, là người đã không chỉ định cô cho mình[a], thì ông phải để cô được chuộc lại. Ông không có quyền bán cô cho một dân tộc ngoại bang, vì ông đã bội tín với cô.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là người đã chỉ định (hoặc đính ước) cô cho mình.” Mệnh đề Hê-bơ-rơ này có khó khăn về văn bản và cách giải thích.'
    reason: textual_variant
  - marker: b
    text: “Bội tín” cũng có thể dịch là “hành động phản trắc” hoặc “phản bội cô.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: không vừa mắt
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ về việc không được chấp nhận hoặc không làm hài lòng, chứ không quy cho cô gái sự xấu xa về đạo đức.
- source_word: אֲדֹנֶיהָ
  choice: chủ mình
  rationale: Phản ánh quan hệ pháp lý-xã hội giữa cô gái và người đã mua cô, đồng thời tránh sắc thái thần danh của “Chúa”.
- source_word: יְעָדָהּ
  choice: chọn cô cho mình
  rationale: Giữ nghĩa tương đối rộng của động từ là chỉ định hoặc dành riêng, trong khi ngữ cảnh vẫn gợi đến việc sắp đặt hôn nhân; sự khó khăn văn bản được ghi ở chú thích.
- source_word: וְהֶפְדָּהּ
  choice: phải cho phép cô được chuộc lại
  rationale: Thể Hiphil ở đây có thể nói đến việc cho phép hoặc làm cho sự chuộc lại diễn ra, không nhất thiết chủ phải tự trả giá chuộc.
- source_word: לְעַם נָכְרִי
  choice: cho một dân ngoại
  rationale: Giữ sắc thái tập thể của עַם và sự phân biệt xã hội-giao ước của נָכְרִי.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: không có quyền bán cô
  rationale: Truyền đạt tự nhiên sức mạnh pháp lý của משל, tức không có thẩm quyền hay quyền hợp pháp để bán.
- source_word: בְּבִגְדוֹ בָהּ
  choice: vì ông đã bội tín với cô
  rationale: “Bội tín” diễn đạt hành vi thất tín hoặc phản bội nghĩa vụ đối với cô gái, phù hợp sắc thái mạnh của בגד.
theological_decisions:
- issue: Cách hiểu יְעָדָהּ cùng sự mơ hồ liên quan đến truyền thống ketiv/qere trong mệnh đề
  choice: là người đã không chọn cô cho mình
  alternative: là người đã chọn/đính ước cô cho mình
  rationale: 'Bản văn Masoretes có một khó khăn nổi tiếng: truyền thống đọc và các chứng cứ cổ khác nhau về việc mệnh đề mang nghĩa phủ định hay khẳng định, cũng như động từ nên hiểu rộng là “chọn/chỉ định” hay cụ thể là “đính ước.” Chính văn theo cách đọc phủ định của dữ liệu nguồn đã cho, còn chú thích bảo tồn cách đọc thay thế.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Không vừa mắt” giữ thành ngữ tự nhiên; “chủ” phản ánh bối cảnh luật pháp cổ đại; “bội tín” giữ sắc thái pháp lý-đạo đức. Tất cả dấu chú thích đều xuất hiện trong chính văn.
