  to: Nhưng nếu người ấy không rình chờ[a], mà Đức Chúa Trời khiến việc ấy xảy ra qua tay người ấy, thì Ta sẽ chỉ định cho ngươi một nơi mà người ấy có thể chạy trốn đến.
