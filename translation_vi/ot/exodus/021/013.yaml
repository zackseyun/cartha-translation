base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: vi
  text: Nhưng nếu người ấy không rình chờ[a], mà Đức Chúa Trời khiến việc ấy xảy ra qua tay người ấy, thì Ta sẽ chỉ định cho ngươi một nơi mà người ấy có thể chạy trốn đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát nghĩa hơn: “Đức Chúa Trời khiến việc ấy xảy ra qua tay người ấy.” “Không rình chờ” trong văn cảnh pháp lý này hàm ý không có ý định giết người từ trước.'
    reason: Làm rõ nghĩa pháp lý của צָדָה và thành ngữ אִנָּה לְיָדוֹ, đồng thời giữ sự căng thẳng của nguyên văn về tác động của Đức Chúa Trời và hành động của người gây chết.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Nhưng nếu người ấy
  rationale: Diễn đạt tự nhiên quan hệ tương phản và điều kiện với trường hợp cố ý giết người ở câu trước.
- source_word: לֹא צָדָה
  choice: không cố tình phục kích
  rationale: צדה trong văn cảnh luật pháp chỉ hành vi rình chờ, qua đó hàm ý ý định sát hại có tính toán; cách dịch này giữ cả hình ảnh phục kích lẫn yếu tố chủ ý.
- source_word: וְהָאֱלֹהִים
  choice: mà Đức Chúa Trời
  rationale: Ở đây אֱלֹהִים hợp lý nhất là Đức Chúa Trời, vì mệnh đề nói đến sự việc xảy ra dưới quyền tể trị của Ngài, chứ không nói đến hành động xét xử của các thẩm phán.
- source_word: אִנָּה לְיָדוֹ
  choice: khiến việc đó xảy đến bởi tay người ấy
  rationale: Giữ rõ tác nhân thần thượng trong אִנָּה và vai trò công cụ của người gây chết trong thành ngữ לְיָדוֹ, nhưng không biến trường hợp này thành hành vi có chủ ý.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: thì Ta sẽ chỉ định cho ngươi một nơi
  rationale: “Chỉ định” phù hợp với việc thiết lập một địa điểm được pháp luật cho phép; đại từ “Ta” giữ sự chuyển sang lời phán trực tiếp của Đức Chúa Trời.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: để người ấy có thể chạy trốn đến đó
  rationale: Thể hiện đúng chuyển động hướng tới trong שָׁמָּה và chức năng của nơi trú ẩn dành cho người gây chết ngoài ý muốn.
theological_decisions:
- issue: Vai trò của Đức Chúa Trời trong trường hợp gây chết không chủ ý
  choice: Đức Chúa Trời khiến việc đó xảy đến bởi tay người ấy
  alternative: Đức Chúa Trời để việc đó xảy ra bởi tay người ấy; hoặc các thẩm phán trao người kia vào tay người ấy
  rationale: 'Bản dịch giữ nguyên sức mạnh gây khiến của אִנָּה và sự căng thẳng thần học trong nguyên văn: người này không phục kích có chủ ý, nhưng biến cố vẫn được trình bày dưới tác động của Đức Chúa Trời. Không làm nhẹ thành sự cho phép đơn thuần, cũng không đổi אֱלֹהִים thành “các thẩm phán” khi văn cảnh không ủng hộ.'
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Người ấy” giúp theo dõi cùng một người gây chết xuyên suốt câu; “ngươi” giữ sắc thái số ít của לְךָ và giọng giao ước trực tiếp. Không thêm chú thích vì bản dịch chính đã biểu đạt cả tính không chủ ý và tác nhân thần thượng của nguyên văn.
