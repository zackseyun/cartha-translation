  language: vi
  text: Ai đánh một người khiến người ấy chết thì nhất định phải bị xử tử.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “Người nào đánh một người và người ấy chết thì nhất định phải bị xử tử.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: đánh
  rationale: 'Phân từ của נכה mở đầu một tình huống luật lệ: người thực hiện hành vi đánh. “Đánh” tự nhiên trong tiếng Việt và không hàm ý sẵn kết quả chết người.'
- source_word: אִישׁ
  choice: một người
  rationale: Ở đây אִישׁ chỉ một cá nhân là nạn nhân. “Một người” diễn đạt tự nhiên và chính xác trong quy phạm pháp luật tiếng Việt mà không làm thay đổi phạm vi của điều luật.
- source_word: וָמֵת
  choice: khiến người ấy chết
  rationale: Liên từ cùng động từ מות nêu hậu quả của cú đánh. “Khiến người ấy chết” thể hiện rõ quan hệ kết quả theo lối nói tự nhiên; cách sát hình thức hơn được giữ trong chú thích.
- source_word: מוֹת יוּמָת
  choice: chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ bị động nhấn mạnh tính tất yếu của án tử hình. Cách dịch này giữ sắc thái pháp lý, sự nhấn mạnh và thể bị động.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại; dùng cấu trúc “Ai… thì…” quen thuộc để trình bày luật theo tình huống. Đại từ “người ấy” làm rõ người chết là nạn nhân, tránh sự mơ hồ không tự nhiên trong tiếng Việt.
