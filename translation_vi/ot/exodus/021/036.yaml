  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: vi
  text: Hoặc nếu đã biết rằng con bò ấy vốn có tật húc từ trước[a], mà chủ nó không canh giữ con bò ấy, thì người chủ phải bồi thường đầy đủ, lấy bò đền bò; còn con bò chết sẽ thuộc về người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “từ hôm qua và hôm kia,” một thành ngữ chỉ con bò đã từng có hành vi này trước đó.'
    reason: cultural_note
  - marker: b
    text: “Người ấy” thường được hiểu là chủ con bò đã húc, tức người phải bồi thường.
    reason: referent_clarification
lexical_decisions:
- source_word: א֣וֹ
  choice: Hoặc nếu
  rationale: Mở đầu trường hợp pháp lý thay thế cho câu trước; “Hoặc nếu” diễn đạt tự nhiên cả ý phân cách lẫn điều kiện trong tiếng Việt.
- source_word: נוֹדַע כִּי
  choice: người ta đã biết ... rằng
  rationale: Giữ sắc thái bị động/phiếm chỉ của נוֹדַע và xem כִּי là từ dẫn nội dung điều đã được biết.
- source_word: שׁוֹר
  choice: con bò
  rationale: Trong tiếng Việt hiện đại, “con bò” là cách gọi rộng và tự nhiên trong điều luật này, không xác định quá mức giới tính hay tình trạng thiến của con vật.
- source_word: נַגָּח
  choice: vốn có tật húc
  rationale: Diễn đạt đặc tính nguy hiểm đã thành thói của con bò, không chỉ một hành vi húc đơn lẻ.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: từ trước
  rationale: Đây là thành ngữ Hê-bơ-rơ, sát chữ là “từ hôm qua và hôm kia,” chỉ hành vi đã từng biểu hiện trước đó; bản dịch chính dùng cách nói tự nhiên và ghi nghĩa đen ở chú thích.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: mà chủ nó không canh giữ nó
  rationale: שמר trong ngữ cảnh này nói đến trách nhiệm trông coi và kiềm giữ con vật nguy hiểm; “canh giữ” giữ được nghĩa pháp lý mà không thêm một phương thức cụ thể như nhốt hay buộc.
- source_word: בְּעָלָיו
  choice: chủ nó
  rationale: Chỉ người sở hữu và chịu trách nhiệm pháp lý đối với con bò.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: phải bồi thường đầy đủ
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh nghĩa vụ bồi thường; cách dịch này tự nhiên trong văn cảnh luật pháp.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: lấy bò đền bò
  rationale: Giữ công thức thay thế tương xứng của nguyên văn bằng một cách nói pháp lý gọn, rõ trong tiếng Việt.
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: còn con vật chết sẽ thuộc về người ấy
  rationale: Giữ cách gọi danh từ hóa “con vật chết” và đại từ לּוֹ vốn có thể cần suy ra chủ thể từ ngữ cảnh; không tự ý thay bằng một danh từ diễn giải trong chính văn.
theological_decisions:
- issue: Người nhận con vật chết trong đại từ לּוֹ
  choice: “người ấy,” giữ cách quy chiếu không gọi đích danh trong chính văn
  alternative: “người chủ,” hoặc “chủ con bò bị chết”
  rationale: Nguyên văn chỉ dùng đại từ số ít giống đực. Trong mạch luật, cách hiểu thông thường là bên nhận bò bồi thường giao xác con bò chết cho bên phải bồi thường, nhưng bản dịch không nên làm mất hoàn toàn độ hàm ẩn của đại từ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “bồi thường đầy đủ” để thể hiện sự nhấn mạnh của cấu trúc Hê-bơ-rơ; tránh từ cổ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
