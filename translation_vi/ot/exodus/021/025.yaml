  text: כְּוִיָּה֙ תַּ֣חַת כְּוִיָּ֔ה פֶּ֖צַע תַּ֣חַת פָּ֑צַע חַבּוּרָ֕ה תַּ֖חַת חַבּוּרָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/025.yaml
  text: burn for burn[a], wound for wound, bruise for bruise.
translation:
  language: vi
  text: vết bỏng đền vết bỏng, vết thương đền vết thương, vết bầm đền vết bầm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vết lằn đền vết lằn”, nhấn mạnh dấu tích do một cú đánh để lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: vết bỏng
  rationale: Danh từ này chỉ vết bị bỏng hoặc dấu bỏng. “Vết bỏng” tự nhiên, cụ thể và phù hợp với công thức đối xứng của điều luật.
- source_word: תַּחַת
  choice: đền
  rationale: Trong ngữ cảnh pháp luật này, từ này diễn tả sự tương xứng hoặc bồi hoàn. “Đền” truyền đạt gọn ý ‘tương ứng với’ và giữ được nhịp lặp của câu.
- source_word: פֶּצַע
  choice: vết thương
  rationale: Từ này chỉ một thương tích hữu hình nói chung. “Vết thương” vừa chính xác vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: חַבּוּרָה
  choice: vết bầm
  rationale: Từ này chỉ vết bầm, vết lằn hoặc dấu tích do bị đánh. “Vết bầm” dễ hiểu nhất trong tiếng Việt hiện đại, còn khả năng ‘vết lằn’ được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật cô đọng, trang trọng nhưng dễ hiểu; cấu trúc ba vế song song của tiếng Hê-bơ-rơ được giữ nguyên. Dấu chú thích được đặt sau “vết bầm”, là từ tương ứng với חַבּוּרָה.
