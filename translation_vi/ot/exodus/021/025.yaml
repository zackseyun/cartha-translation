  source_fidelity: Bản dịch giữ đúng ba hạng thương tổn trong tiếng Hê-bơ-rơ—כְּוִיָּה (bỏng/vết bỏng), פֶּצַע (vết thương), và חַבּוּרָה (vết bầm hoặc dấu do bị đánh)—cùng quan hệ tương xứng của תַּחַת qua từ “đền”. Không thêm diễn giải về cơ chế hay mức độ hình phạt ngoài công thức nguồn.
  naturalness: Câu cô đọng, nhịp ba vế song song rõ ràng và phù hợp văn phong pháp luật tiếng Việt hiện đại. Cách lặp “vết ... đền vết ...” tuy có tính công thức, vẫn dễ hiểu và thích hợp với cấu trúc pháp lý nguyên ngữ.
  terminology: “Vết bỏng”, “vết thương”, và “vết bầm” là các tương đương rõ ràng, hiện đại. “Đền” truyền đạt ý tương xứng/bồi hoàn trong ngữ cảnh luật lệ mà không áp đặt một cách diễn giải giáo phái. Chú thích cho חַבּוּרָה nêu đúng khả năng “vết lằn” và được neo đúng tại từ liên quan.
