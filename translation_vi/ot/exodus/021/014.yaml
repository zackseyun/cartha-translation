source:
  edition: WLC
  text: וְ/כִֽי יָזִ֥ד אִ֛ישׁ עַל רֵעֵ֖/הוּ לְ/הָרְג֣/וֹ בְ/עָרְמָ֑ה מֵ/עִ֣ם מִזְבְּחִ֔/י תִּקָּחֶ֖/נּוּ לָ/מֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: vi
  text: Nhưng nếu một người cố ý mưu hại người lân cận mình, dùng mưu mô để giết người ấy,[a][b] thì ngươi phải bắt kẻ đó khỏi bàn thờ Ta mà xử tử.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ngang nhiên chống lại người lân cận mình”; động từ Hê-bơ-rơ nhấn mạnh hành động cố ý, chủ tâm.
    reason: lexical_alternative
  - marker: b
    text: Hay “một cách xảo quyệt” hoặc “bằng thủ đoạn gian trá.”
    reason: lexical_alternative
  - marker: c
    text: Tức là dù kẻ ấy tìm nơi trú ẩn bên bàn thờ, người ta vẫn phải đưa kẻ ấy đi chịu án chết.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Nhưng nếu
  rationale: Dẫn vào trường hợp có tính tương phản với luật trước và mang sắc thái điều kiện.
- source_word: יָזִד
  choice: cố ý mưu hại
  rationale: Dạng Hiphil của זיד ở đây chỉ hành động chủ tâm, ngang nhiên và có dự mưu; cách dịch này tự nhiên trong tiếng Việt và phân biệt rõ với ngộ sát.
- source_word: אִישׁ
  choice: một người
  rationale: Trong văn luật tiếng Việt, cách nói này giữ số ít đại diện mà không làm câu văn cổ cứng hoặc giới hạn không cần thiết vào giới tính.
- source_word: עַל רֵעֵהוּ
  choice: người lân cận mình
  rationale: Diễn tả hành động thù nghịch nhắm vào một người khác trong cộng đồng; “người lân cận” giữ liên hệ thuật ngữ pháp lý-đạo đức của רֵעַ.
- source_word: לְהָרְגוֹ
  choice: để giết người ấy
  rationale: Giữ nghĩa trực tiếp của הרג là giết; tính chất phạm tội có chủ ý đã được biểu đạt bởi יָזִד và בְעָרְמָה.
- source_word: בְעָרְמָה
  choice: dùng mưu mô
  rationale: Chuyển tải phương thức xảo quyệt, gian trá mà không thu hẹp nghĩa vào một thủ đoạn cụ thể.
- source_word: מֵעִם מִזְבְּחִי
  choice: khỏi bàn thờ Ta
  rationale: Chỉ việc đưa người phạm tội ra khỏi nơi bên bàn thờ; không thêm từ nhấn mạnh vốn không được biểu thị rõ trong tiếng Hê-bơ-rơ.
- source_word: תִּקָּחֶנּוּ
  choice: ngươi phải bắt kẻ đó
  rationale: Thể hiện mệnh lệnh pháp lý ở ngôi thứ hai số ít; “phải” tự nhiên hơn trong luật tiếng Việt hiện đại.
- source_word: לָמוּת
  choice: mà xử tử
  rationale: Trong ngữ cảnh pháp luật, nguyên mẫu “để chết” biểu thị mục đích đưa người phạm tội đi chịu án chết; “xử tử” diễn đạt rõ và tự nhiên.
theological_decisions:
- issue: Bàn thờ có cung cấp quyền tị nạn cho kẻ cố ý giết người hay không
  choice: Câu luật không cho bàn thờ che chở kẻ giết người có chủ ý và dùng mưu mô.
  alternative: Câu chỉ nói đưa bị cáo khỏi bàn thờ để xét xử, không đặc biệt đề cập đến quyền tị nạn.
  rationale: Cụm “khỏi bàn thờ Ta” trong bối cảnh này hàm ý người ấy có thể đang bám víu hoặc tìm nơi trú ẩn tại bàn thờ, nhưng nơi thánh không miễn cho hành vi cố sát; bản chính giữ hàm ý ấy mà không diễn giải quá mức.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “ngươi” và “Ta” để giữ lời phán trực tiếp cùng sắc thái giao ước; tránh từ cổ như “giết chết”, “quỷ quyệt” hay “chịu tử hình”. Các dấu chú thích được đặt ngay sau những cụm từ cần giải thích.
