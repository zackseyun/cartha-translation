base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: vi
  text: Chủ hố phải bồi thường; người ấy phải trả tiền cho chủ con vật, còn con vật chết sẽ thuộc về chủ hố.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: chủ hố
  rationale: Trong điều luật này, cụm từ chỉ người sở hữu hoặc chịu trách nhiệm về cái hố; “chủ hố” ngắn gọn và tự nhiên.
- source_word: יְשַׁלֵּם
  choice: phải bồi thường
  rationale: Dạng Piel của שׁלם trong ngữ cảnh pháp lý mang nghĩa đền bù thiệt hại; “phải bồi thường” thể hiện rõ nghĩa vụ pháp lý.
- source_word: כֶּסֶף יָשִׁיב
  choice: phải trả tiền
  rationale: כֶּסֶף theo nghĩa đen là “bạc”, nhưng ở đây chỉ tiền bồi thường; יָשִׁיב có nghĩa phục hồi hoặc hoàn trả giá trị, được diễn đạt tự nhiên là “trả tiền”.
- source_word: לִבְעָלָיו
  choice: cho chủ con vật
  rationale: Hậu tố chỉ chủ của con vật đã chết. Việc nêu “con vật” giúp đại từ sở hữu tiếng Hê-bơ-rơ có đối tượng rõ ràng trong tiếng Việt.
- source_word: וְהַמֵּת
  choice: còn con vật chết
  rationale: Cụm danh từ hóa nghĩa đen là “cái/con đã chết”; ngữ cảnh cho thấy đó là con vật rơi xuống hố. “Còn” diễn đạt tự nhiên quan hệ giữa khoản tiền bồi thường và quyền đối với xác con vật.
- source_word: יִהְיֶה לוֹ
  choice: sẽ thuộc về người ấy
  rationale: Cụm này xác lập quyền sở hữu. Đại từ “người ấy” giữ sự quy chiếu của tiếng Hê-bơ-rơ, dù trong cú pháp câu nó tự nhiên nhất được hiểu là chủ hố.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “bồi thường” và “trả tiền” để giữ hai động từ riêng của nguyên văn mà không dịch כֶּסֶף theo nghĩa đen là “bạc”. Dấu chân chú thích [a] được đặt ngay sau mệnh đề có khả năng cần làm rõ.
