  text: כִּ֤י יִגְנֹֽב אִישׁ֙ שׁ֣וֹר אוֹ שֶׂ֔ה וּ/טְבָח֖/וֹ א֣וֹ מְכָר֑/וֹ חֲמִשָּׁ֣ה בָקָ֗ר יְשַׁלֵּם֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/אַרְבַּע צֹ֖אן תַּ֥חַת הַ/שֶּֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: vi
  text: Nếu một người trộm một con bò hoặc một con chiên[a], rồi giết mổ nó hoặc bán nó, thì người ấy phải bồi thường năm con bò thay cho con bò và bốn con chiên thay cho con chiên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שֶׂה có nghĩa rộng hơn, có thể chỉ một con thuộc loại gia súc nhỏ, như chiên hoặc dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu một điều luật theo tình huống giả định; “nếu” thể hiện tự nhiên cấu trúc điều kiện trong tiếng Việt.
- source_word: יִגְנֹב
  choice: ăn trộm
  rationale: Diễn đạt trực tiếp hành vi lấy cắp trong bối cảnh pháp luật.
- source_word: אִישׁ
  choice: một người
  rationale: Trong điều luật này, danh từ giống đực số ít chỉ người thực hiện hành vi theo nghĩa đại diện; “một người” là tự nhiên và không làm mất nội dung pháp lý.
- source_word: שׁוֹר
  choice: con bò
  rationale: Chỉ một cá thể thuộc loài bò; “con bò” là cách gọi phổ thông, không áp đặt giới tính hay tình trạng đã thiến.
- source_word: שֶׂה
  choice: con chiên
  rationale: Từ này có thể chỉ một cá thể gia súc nhỏ, gồm chiên hoặc dê; “con chiên” phù hợp với cách hiểu tự nhiên của câu, nhưng độ rộng của từ gốc được ghi chú.
- source_word: וּטְבָחוֹ
  choice: rồi làm thịt
  rationale: טבח chỉ việc giết mổ súc vật, cụ thể hơn động từ “giết”; “làm thịt” tự nhiên trong tiếng Việt hiện đại.
- source_word: מְכָרוֹ
  choice: hay bán nó
  rationale: Chuyển tải trực tiếp hành động bán con vật bị trộm; “hay” nối hai khả năng thay thế trong điều kiện pháp lý.
- source_word: חֲמִשָּׁה בָקָר
  choice: năm con bò
  rationale: בקר là danh từ tập hợp chỉ bò; tiếng Việt dùng loại từ “con” để đếm tự nhiên mà không giới hạn giới tính.
- source_word: יְשַׁלֵּם
  choice: phải bồi thường
  rationale: Trong ngữ cảnh luật pháp, động từ mang nghĩa hoàn trả hay đền bù thiệt hại; “phải bồi thường” nêu rõ nghĩa vụ pháp lý.
- source_word: תַּחַת
  choice: thay cho
  rationale: Giữ rõ ý thay thế hoặc đền lại tương ứng của giới từ Hê-bơ-rơ.
- source_word: וְאַרְבַּע צֹאן
  choice: và bốn con chiên
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ; “con chiên” tạo công thức bồi thường rõ ràng, nhất quán với cách dịch שֶׂה, trong khi ghi chú bảo lưu khả năng bao gồm dê.
theological_decisions: []
translation_notes:
  register: Văn phong pháp luật trang trọng nhưng dễ hiểu. Dùng “ăn trộm”, “làm thịt” và “bồi thường” là những cách nói hiện đại, tự nhiên; cấu trúc “năm... thay cho...” giữ sát công thức đền bù của nguyên văn.
