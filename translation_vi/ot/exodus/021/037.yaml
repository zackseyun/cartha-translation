  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc điều kiện–hệ quả và nội dung pháp lý của tiếng Hê-bơ-rơ: trộm bò hoặc chiên, rồi giết mổ hoặc bán nó, thì phải bồi thường năm con bò cho con bò và bốn con chiên cho con chiên. “Bồi thường” truyền đạt đúng sắc thái hoàn trả/đền bù của יְשַׁלֵּם; “thay cho” giữ rõ quan hệ thay thế của תַּחַת.'
