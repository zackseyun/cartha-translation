    rationale: “Tức là chiên hoặc dê” có thể khiến người đọc hiểu từ này chỉ có hai nghĩa cố định. Nguyên ngữ chỉ một con gia súc nhỏ; chiên hoặc dê là các ví dụ/cách hiểu chính.
