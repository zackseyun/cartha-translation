revisions:
- from: Nếu có những người đàn ông đánh nhau và đánh trúng một phụ nữ đang mang thai, khiến các con của bà ra ngoài[a], nhưng không có tổn hại nghiêm trọng nào[b], thì người ấy chắc chắn phải chịu phạt tiền theo mức chồng của người phụ nữ ấn định cho mình, và phải trả theo phán quyết của các thẩm phán[c].
  to: Nếu những người đàn ông đánh nhau và đánh trúng một phụ nữ đang mang thai, khiến các con của bà ra ngoài[a], nhưng không có tổn hại nghiêm trọng nào[b], thì người đó chắc chắn phải chịu phạt tiền theo mức chồng của người phụ nữ ấn định cho người đó, và phải trả theo phán quyết của các thẩm phán[c].
  rationale: Chỉ sửa đại từ quy chiếu trong mệnh đề về mức phạt để bảo đảm người bị áp mức phạt là người gây việc, như nguyên văn. Các điểm mơ hồ về việc sinh non/sẩy thai và đối tượng chịu tổn hại vẫn được bảo toàn.
  reviewer_model: gpt-5.6-terra
