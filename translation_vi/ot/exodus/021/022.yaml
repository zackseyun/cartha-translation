  text: וְ/כִֽי יִנָּצ֣וּ אֲנָשִׁ֗ים וְ/נָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְ/יָצְא֣וּ יְלָדֶ֔י/הָ וְ/לֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽ/אֲשֶׁ֨ר יָשִׁ֤ית עָלָי/ו֙ בַּ֣עַל הָֽ/אִשָּׁ֔ה וְ/נָתַ֖ן בִּ/פְלִלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: vi
  text: Nếu những người đàn ông đánh nhau và đánh trúng một phụ nữ đang mang thai, khiến các con của bà ra ngoài[a], nhưng không có tổn hại nghiêm trọng nào[b], thì người đó chắc chắn phải chịu phạt tiền theo mức chồng của người phụ nữ ấn định cho người đó, và phải trả theo phán quyết của các thẩm phán[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con của bà ra ngoài”. Cụm từ này có thể chỉ việc sinh non; một số bản dịch hiểu là sẩy thai.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ trong riêng câu này không nói rõ tổn hại nghiêm trọng liên quan đến người mẹ, người con, hay một trong hai.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “trước tòa” hoặc “qua sự phân xử”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu có
  rationale: Mở đầu một trường hợp luật định; “Nếu có” tự nhiên trong văn phong pháp luật tiếng Việt và giữ sắc thái điều kiện của câu.
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: những người đàn ông đánh nhau
  rationale: Giữ rõ danh từ giống đực số nhiều và diễn đạt cuộc xung đột thể chất bằng tiếng Việt hiện đại.
- source_word: וְנָגְפוּ
  choice: đánh trúng
  rationale: Diễn tả một cú đánh tác động đến người phụ nữ mà không tự thêm mức độ thương tích; “trúng” cũng phù hợp với việc bà bị vạ lây trong cuộc đánh nhau.
- source_word: אִשָּׁה הָרָה
  choice: một phụ nữ đang mang thai
  rationale: Cách nói hiện đại, rõ ràng và tự nhiên.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: khiến các con của bà ra ngoài
  rationale: Theo sát cách diễn đạt cụ thể nhưng không chuyên biệt của tiếng Hê-bơ-rơ, tránh quyết định rằng đây nhất thiết là sinh non còn sống hay sẩy thai.
- source_word: אָסוֹן
  choice: tổn hại nghiêm trọng
  rationale: Truyền đạt ý về tai họa hoặc thương tổn đáng kể mà không thu hẹp thành tử vong; câu này không nói rõ tổn hại ấy liên quan riêng đến người mẹ, con, hay cả hai.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: chắc chắn phải chịu phạt tiền
  rationale: Giữ sức nhấn mạnh của cấu trúc nguyên mẫu tuyệt đối đi với động từ; ngữ cảnh về mức tiền được ấn định và chi trả cho thấy đây là khoản phạt bằng tiền.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו
  choice: theo mức ... ấn định cho mình
  rationale: Diễn đạt tự nhiên hành vi đặt hoặc áp một khoản phạt lên người gây ra việc ấy.
- source_word: בַּעַל הָאִשָּׁה
  choice: chồng của người phụ nữ
  rationale: Trong ngữ cảnh này, בַּעַל chỉ người chồng chứ không phải chủ sở hữu.
- source_word: וְנָתַן
  choice: phải trả
  rationale: Trong ngữ cảnh tài chính-pháp lý, “trả” chính xác và tự nhiên hơn nghĩa chung “trao/đưa”.
- source_word: בִּפְלִלִים
  choice: theo phán quyết của các thẩm phán
  rationale: Thể hiện việc khoản tiền chịu sự phân xử tư pháp, đồng thời ghi nhận ở chú thích các cách hiểu khả dĩ khác của cụm từ khó này.
theological_decisions:
- issue: Tình trạng của thai nhi sau khi “các con của bà ra ngoài”
  choice: Giữ cách diễn đạt không xác định “các con của bà ra ngoài”.
  alternative: Dịch cụ thể là “bà sinh non” hoặc “bà bị sẩy thai”.
  rationale: Nguyên văn không tự nó giải quyết dứt khoát giữa sinh non và sẩy thai; bản dịch không nên đưa một kết luận thần học hoặc đạo đức đang còn tranh luận vào chính văn.
- issue: Đối tượng chịu אָסוֹן (tổn hại nghiêm trọng)
  choice: Không nêu rõ tổn hại xảy đến cho người mẹ, người con hay một trong hai.
  alternative: Giới hạn tổn hại vào riêng người mẹ, hoặc minh định rằng nó bao gồm cả mẹ lẫn con.
  rationale: Câu Hê-bơ-rơ không có bổ ngữ xác định đối tượng chịu tổn hại, nên việc thêm đối tượng sẽ âm thầm giải quyết một điểm mơ hồ quan trọng.
translation_notes:
  register: 'Văn phong pháp luật trang nghiêm nhưng dễ hiểu, dùng cấu trúc điều kiện tự nhiên trong tiếng Việt hiện đại. Bản dịch ưu tiên tương đương tối ưu: theo sát những cụm từ có ý nghĩa pháp lý và giữ nguyên các điểm mơ hồ thực sự của nguyên văn, đồng thời tránh lối nói cổ hoặc thuật ngữ giáo phái.'
