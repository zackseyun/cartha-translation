    rationale: Cụm עָלָיו nghĩa là khoản phạt được đặt lên người gây việc, không phải lên chính người chồng. Trong tiếng Việt, “mình” thường quy chiếu về chủ ngữ gần nhất là “chồng”, làm đảo nghĩa hoặc gây mơ hồ.
