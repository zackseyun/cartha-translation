  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: vi
  text: các y phục dệt tinh xảo[a], các y phục thánh dành cho thầy tế lễ A-rôn, và y phục của các con trai ông để họ thi hành chức tế lễ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “y phục dùng để phục vụ”, “y phục phục vụ” hoặc “y phục dệt”. Từ Hê-bơ-rơ trong cụm בִּגְדֵי הַשְּׂרָד khó xác định, có thể nhấn mạnh cách chế tác hoặc công dụng của các y phục trong việc phục vụ tại Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: các lễ phục dệt tinh xảo
  rationale: בִּגְדֵי là “y phục”; שְׂרָד là từ khó, có thể chỉ cách chế tác/dệt hoặc công dụng phục vụ tại Đền Tạm. “Lễ phục dệt tinh xảo” truyền đạt nghĩa khả dĩ về kỹ thuật chế tác và phù hợp với ngữ cảnh thờ phượng, còn các khả năng khác được giữ trong chú thích.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: lễ phục thánh
  rationale: Cụm từ có nghĩa sát là “y phục của sự thánh khiết/y phục thánh”. “Lễ phục thánh” vừa tự nhiên trong tiếng Việt vừa giữ rõ tính biệt riêng cho việc thờ phượng.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: dành cho thầy tế lễ A-rôn
  rationale: לְ biểu thị sự chỉ định; הַכֹּהֵן là danh hiệu đồng vị của A-rôn. Trật tự tiếng Việt này rõ ràng và tự nhiên.
- source_word: בִּגְדֵי בָנָיו
  choice: lễ phục của các con trai ông
  rationale: Giữ cấu trúc sở hữu của tiếng Hê-bơ-rơ và cho thấy “ông” chỉ về A-rôn.
- source_word: לְכַהֵן
  choice: để họ phục vụ trong chức tế lễ
  rationale: Động từ nguyên mẫu כהן nghĩa là thi hành chức vụ tế lễ. Cách dịch này diễn đạt chức năng của các con trai A-rôn mà không thêm ý niệm hệ phái.
- source_word: וְאֵת / וְאֶת
  choice: '[thể hiện bằng phép liệt kê và từ nối]'
  rationale: אֵת là dấu hiệu chỉ tân ngữ xác định nên không có từ tương ứng trực tiếp trong tiếng Việt; וְ được thể hiện qua cấu trúc nối tiếp của danh sách và từ “và” trước mục cuối.
