id: EXO.31.13
reference: Exodus 31:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: vi
  text: 'Còn ngươi, hãy nói với dân Israel[b] rằng: “Các ngươi nhất định[a] phải giữ những ngày Sa-bát của Ta, vì đó là một dấu hiệu giữa Ta và các ngươi qua mọi thế hệ, để các ngươi biết rằng chính Ta là Yahweh, Đấng thánh hóa[c] các ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chỉ” hoặc “tuy nhiên.” Tiểu từ Hê-bơ-rơ אַךְ có thể biểu thị sự hạn định hoặc sự nhấn mạnh mạnh mẽ.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “con cái Israel,” một danh xưng giao ước thông dụng chỉ dân Israel.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “làm cho các ngươi nên thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Còn ngươi
  rationale: Đại từ số ít được đưa lên đầu câu để nhấn mạnh và chuyển lời trực tiếp sang Môi-se; “còn ngươi” diễn đạt tự nhiên sắc thái tương phản trong mạch văn.
- source_word: דַּבֵּר ... לֵאמֹר
  choice: hãy nói ... rằng
  rationale: Gộp mệnh lệnh và công thức dẫn lời theo cú pháp tiếng Việt hiện đại, đồng thời giữ nguyên lực mệnh lệnh.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “con trai/con cái Israel” nhưng được dùng như danh xưng cộng đồng giao ước; “dân Israel” tự nhiên, rõ nghĩa và không thu hẹp đối tượng vào nam giới.
- source_word: אַךְ
  choice: nhất định
  rationale: Trong ngữ cảnh này, tiểu từ nhấn mạnh mạnh mẽ bổn phận giữ ngày Sa-bát. “Nhất định” truyền đạt lực nhấn mạnh mà không buộc phải giải quyết dứt khoát sắc thái hạn định có thể có.
- source_word: שַׁבְּתֹתַי
  choice: những ngày Sa-bát của Ta
  rationale: Giữ dạng số nhiều rõ ràng của nguyên văn và diễn đạt tự nhiên trong tiếng Việt.
- source_word: תִּשְׁמֹרוּ
  choice: phải giữ
  rationale: Động từ שׁמר trong ngữ cảnh điều răn mang nghĩa giữ, tuân giữ; “phải giữ” thể hiện rõ hiệu lực bắt buộc.
- source_word: אוֹת
  choice: một dấu hiệu
  rationale: “Dấu hiệu” là cách diễn đạt rõ và phù hợp với chức năng giao ước của ngày Sa-bát trong câu.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: giữa Ta và các ngươi
  rationale: Giữ sự phân biệt giữa ngôi thứ nhất và đối tượng số nhiều; “các ngươi” giúp thể hiện số nhiều vốn rõ trong tiếng Hê-bơ-rơ.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua mọi thế hệ
  rationale: Diễn đạt tính liên tục xuyên suốt các thế hệ bằng tiếng Việt tự nhiên.
- source_word: לָדַעַת
  choice: để các ngươi biết
  rationale: Thể hiện quan hệ mục đích của động từ nguyên mẫu có giới từ לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu, qua đó giữ hình thức và chức năng giao ước của danh này.
- source_word: מְקַדִּשְׁכֶם
  choice: Đấng thánh hóa các ngươi
  rationale: Phân từ Hifil diễn tả Yahweh là Đấng làm cho dân trở nên thánh; “thánh hóa” ngắn gọn và giữ được sắc thái thần học của căn từ קדש.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Chuyển tự “Yahweh” bảo tồn đây là danh riêng, không biến nó thành một tước hiệu.
- issue: Chủ thể thánh hóa dân giao ước
  choice: Đấng thánh hóa các ngươi
  alternative: Đấng làm cho các ngươi nên thánh
  rationale: Giữ Yahweh là chủ thể chủ động của hành động; bản dịch không giải thích thêm bản chất hay tiến trình thánh hóa.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  alternative: con cái Israel / các con trai Israel
  rationale: Cụm từ là danh xưng cộng đồng, chỉ toàn dân trong bối cảnh giao ước. “Dân Israel” truyền đạt đúng phạm vi mà không xóa dấu vết nghĩa đen, vốn được ghi ở chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Ngươi/các ngươi” giữ rõ sự chuyển đổi từ lời phán riêng với Môi-se sang lời dành cho toàn dân; các đại từ chỉ Đức Chúa Trời được viết hoa theo thông lệ tiếng Việt. “Sa-bát” là dạng quen thuộc, dễ hiểu; cấu trúc câu được điều chỉnh vừa đủ để đọc tự nhiên mà vẫn giữ trật tự lập luận của nguyên văn.
