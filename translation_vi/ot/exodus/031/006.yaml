  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: vi
  text: Còn Ta đây, Ta đã chỉ định Ô-hô-li-áp, con trai A-hi-sa-mác, thuộc bộ tộc Đan, cùng với ông ấy. Ta đã đặt sự khôn ngoan vào lòng mọi người có lòng khôn ngoan[b], để họ làm mọi điều Ta đã truyền cho con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “và họ sẽ làm mọi điều Ta đã truyền cho con.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ lặp lại từ “lòng”; đây là cách nói về những người có sự khôn ngoan hoặc tài khéo.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Còn Ta, này, Ta
  rationale: “Còn Ta” giữ đại từ ngôi thứ nhất độc lập có tính nhấn mạnh; “này” giữ chức năng thu hút sự chú ý của הִנֵּה, dù cấu trúc có chủ ý trang trọng hơn lời nói thường ngày.
- source_word: נָתַתִּי אִתּוֹ
  choice: Ta đã đặt bên cạnh ông ấy
  rationale: Giữ hình ảnh cơ bản của נתן là “đặt” và diễn đạt rõ אִתּוֹ là Oholiab được giao cùng làm việc với Bết-sa-lê-ên, người được nói đến trước đó.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Ô-hô-li-áp, con trai A-hi-sa-mác
  rationale: Phiên âm tên riêng theo cách dễ đọc trong tiếng Việt và giữ nguyên quan hệ gia phả.
- source_word: לְמַטֵּה דָן
  choice: thuộc bộ tộc Đan
  rationale: מַטֶּה tại đây chỉ đơn vị bộ tộc và לְ biểu thị sự thuộc về.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: Ta cũng đã đặt ... vào lòng mọi người có lòng khôn ngoan
  rationale: Giữ sự lặp lại của “lòng” trong tiếng Hê-bơ-rơ và quan niệm lòng là trung tâm của sự hiểu biết, khả năng và tài khéo; thêm “có” để câu tiếng Việt tự nhiên hơn.
- source_word: נָתַתִּי חָכְמָה
  choice: đã đặt sự khôn ngoan
  rationale: Giữ ẩn dụ Đức Chúa Trời đặt sự khôn ngoan vào lòng; trong văn cảnh, sự khôn ngoan bao gồm tài năng thủ công nhưng không chỉ giới hạn ở kỹ năng kỹ thuật.
- source_word: וְעָשׂוּ
  choice: để họ làm
  rationale: Diễn đạt quan hệ mục đích hoặc kết quả tự nhiên giữa việc ban sự khôn ngoan và công việc họ thực hiện, đồng thời không loại bỏ khả năng dịch trực tiếp là “và họ sẽ làm”.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: mọi điều Ta đã truyền cho con
  rationale: Diễn đạt trọn ý tổng quát; “con” phù hợp lời Đức Chúa Trời phán trực tiếp với Môi-se và tránh sắc thái xa cách của “ngươi” trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch thành ngữ חֲכַם־לֵב trong bối cảnh chế tác Đền Tạm
  choice: có lòng khôn ngoan / sự khôn ngoan
  alternative: khéo tay / tài khéo
  rationale: Bối cảnh bao hàm năng lực thủ công, nhưng giữ “lòng” và “sự khôn ngoan” bảo tồn quan niệm Hê-bơ-rơ rằng tài nghệ thực hành là sự khôn ngoan do Đức Chúa Trời ban, thay vì thu hẹp ý nghĩa vào kỹ thuật.
- issue: Sắc thái của וְעָשׂוּ sau việc ban sự khôn ngoan
  choice: để họ làm
  alternative: và họ sẽ làm
  rationale: “Để” thể hiện hợp lý mục đích hoặc kết quả của việc ban sự khôn ngoan, nhưng chú thích vẫn bảo tồn cách hiểu phối hợp hoặc tương lai trực tiếp.
- issue: Quan hệ giữa Đức Chúa Trời và người được phán bảo trong đại từ số ít ךָ
  choice: con
  alternative: ngươi / ông
  rationale: “Con” là cách xưng hô tự nhiên, trang trọng vừa phải trong lời Đức Chúa Trời phán với Môi-se; lựa chọn này không hàm ý một học thuyết riêng về địa vị của Môi-se.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Cấu trúc “Còn Ta, này, Ta” có tính đánh dấu nhằm giữ cả đại từ nhấn mạnh וַאֲנִי lẫn từ thu hút chú ý הִנֵּה. Dấu chú thích [b] đặt ngay sau thành ngữ cần giải thích; [a] đặt sau mệnh đề cuối vì chú thích liên quan đến cách hiểu וְעָשׂוּ.
