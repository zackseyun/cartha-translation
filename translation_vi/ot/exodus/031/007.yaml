base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/007.yaml
  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: vi
  text: Lều Hội Kiến, Hòm Chứng Từ[a], nắp chuộc tội đặt trên hòm[b], cùng mọi vật dụng của lều—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chiếc hòm dành cho Chứng Từ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “nắp xá tội.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi quen thuộc, trang trọng và sát nghĩa cho lều nơi Đức Chúa Trời gặp dân Israel.
- source_word: הָאָרֹן לָעֵדֻת
  choice: Hòm Chứng Ước
  rationale: לְ diễn tả mối liên hệ hoặc công dụng của hòm đối với הָעֵדֻת. Cách dịch ngắn gọn này giữ thuật ngữ 'chứng ước' mà không đưa thêm từ 'giao ước' vốn không có trong cụm từ.
- source_word: הַכַּפֹּרֶת
  choice: nắp chuộc tội
  rationale: Chỉ chiếc nắp bằng vàng trên hòm và giữ được mối liên hệ của thuật ngữ với nghi lễ chuộc tội; tự nhiên và minh bạch hơn trong tiếng Việt hiện đại.
- source_word: אֲשֶׁר עָלָיו
  choice: đặt trên hòm
  rationale: Đại từ giống đực số ít chỉ về chiếc hòm; lặp lại 'hòm' giúp câu tiếng Việt rõ nghĩa hơn mà không thay đổi quan hệ không gian.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: mọi vật dụng của lều
  rationale: כְּלִים có nghĩa rộng, bao gồm các đồ vật và thiết bị dùng trong lều; 'vật dụng' tự nhiên và không thu hẹp nghĩa.
theological_decisions:
- issue: Cách dịch כַּפֹּרֶת trong bối cảnh nơi thánh
  choice: nắp chuộc tội
  alternative: ngai thương xót
  rationale: Từ này trước hết chỉ nắp của hòm nhưng cũng gắn với nghi lễ chuộc tội. Bản văn chính dùng cách gọi mô tả rõ vật thể và giữ sắc thái nghi lễ; cách gọi truyền thống giàu tính thần học được ghi ở chú thích.
- issue: Quan hệ giữa הָאָרֹן và לָעֵדֻת
  choice: Hòm Chứng Ước
  alternative: chiếc hòm dành cho Chứng Ước
  rationale: Giữ cách gọi tự nhiên trong tiếng Việt, đồng thời chú thích cách hiểu mục đích do giới từ לְ có thể biểu thị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Viết hoa các tên gọi chuyên biệt 'Lều Hội Kiến' và 'Hòm Chứng Ước'; giữ dấu gạch dài vì câu này tiếp tục danh sách từ câu trước.
