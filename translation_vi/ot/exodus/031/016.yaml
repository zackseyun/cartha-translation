source:
  edition: WLC
  text: וְ/שָׁמְר֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת הַ/שַּׁבָּ֑ת לַ/עֲשׂ֧וֹת אֶת הַ/שַּׁבָּ֛ת לְ/דֹרֹתָ֖/ם בְּרִ֥ית עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: vi
  text: Vì vậy, con cháu Israel phải giữ ngày Sa-bát, cử hành ngày Sa-bát qua các thế hệ của họ như một giao ước vĩnh viễn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một giao ước đời đời” hoặc “một giao ước trường tồn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Vì vậy, ... phải giữ
  rationale: Động từ שׁמר mang nghĩa giữ gìn, tuân giữ. Trong ngữ cảnh quy định giao ước, “phải giữ” truyền đạt tự nhiên sức bắt buộc của câu; וְ được diễn đạt là “Vì vậy” để nối với mạch văn trước.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Israel” nhưng được dùng theo nghĩa tập thể chỉ dân giao ước. “Con dân Israel” vừa giữ sắc thái thuộc về đại gia đình Israel vừa tự nhiên và bao quát trong tiếng Việt hiện đại.
- source_word: הַשַּׁבָּת
  choice: ngày Sa-bát
  rationale: Đây là danh xưng của ngày nghỉ thánh và dấu hiệu giao ước; “ngày Sa-bát” là cách gọi rõ ràng, quen thuộc trong tiếng Việt.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: tuân giữ ngày Sa-bát
  rationale: Nghĩa đen là “làm ngày Sa-bát”, một thành ngữ chỉ việc thực hành hoặc tuân giữ ngày ấy. “Tuân giữ” chuyển tải đúng nghĩa mà không tạo một cách nói gượng trong tiếng Việt.
- source_word: לְדֹרֹתָם
  choice: qua các thế hệ của họ
  rationale: Cụm từ nói đến sự tiếp nối trong những thế hệ kế tiếp; cách dịch này rõ ràng và giữ đại từ sở hữu của nguyên văn.
- source_word: בְּרִית עוֹלָם
  choice: một giao ước vĩnh viễn
  rationale: בְּרִית là “giao ước”; עוֹלָם ở đây diễn tả tính trường tồn hoặc lâu dài. “Vĩnh viễn” giữ sức nặng về thời hạn mà không giải thích thêm phạm vi thần học của giao ước.
theological_decisions:
- issue: Cách dịch בְנֵי יִשְׂרָאֵל, danh xưng của cộng đồng giao ước
  choice: con dân Israel
  alternative: các con trai của Israel; dân Israel
  rationale: Nguyên văn là một thành ngữ gia tộc giống đực nhưng chỉ toàn thể cộng đồng. “Con dân Israel” giữ được sắc thái gia tộc và ý nghĩa tập thể, không khiến độc giả hiện đại hiểu rằng mệnh lệnh chỉ dành cho nam giới.
- issue: Phạm vi thời gian của בְּרִית עוֹלָם
  choice: giao ước vĩnh viễn
  alternative: giao ước đời đời; giao ước trường tồn
  rationale: Bản dịch giữ nguyên lực kéo dài của עוֹלָם và không dùng chính câu này để quyết định các tranh luận thần học về cách giao ước được áp dụng trong những thời kỳ khác nhau.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Dùng “Sa-bát” như một danh xưng quen thuộc; phân biệt “giữ” và “tuân giữ” để phản ánh hai động từ/cấu trúc Hê-bơ-rơ mà tránh lặp máy móc. Mọi ký hiệu chú thích đều xuất hiện trong chính văn.
