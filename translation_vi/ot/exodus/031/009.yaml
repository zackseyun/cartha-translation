lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: Cụm từ chỉ bàn thờ dùng cho lễ thiêu. Cách dịch này tự nhiên trong tiếng Việt và làm rõ công dụng của bàn thờ mà không thêm ý ngoài nguyên văn.
- source_word: כָּל כֵּלָיו
  choice: mọi dụng cụ của bàn thờ
  rationale: כְּלִי ở đây chỉ toàn bộ các vật dụng dùng kèm bàn thờ. Lặp lại “bàn thờ” giúp câu rõ nghĩa hơn đại từ sở hữu trong tiếng Việt.
- source_word: הַכִּיּוֹר
  choice: chậu rửa
  rationale: Danh từ chỉ chiếc chậu dùng cho việc thanh tẩy trong sân Đền Tạm; “chậu rửa” dễ hiểu và chính xác hơn từ cổ hoặc chuyên biệt.
- source_word: כַּנּוֹ
  choice: chân đế của chậu
  rationale: Danh từ chỉ bộ phận nâng đỡ chiếc chậu. “Chân đế” tự nhiên, đồng thời giữ được phạm vi nghĩa giữa giá đỡ và bệ.
- source_word: וְאֶת
  choice: và
  rationale: Trong chuỗi liệt kê, liên từ được chuyển thành “và”; dấu hiệu tân ngữ trực tiếp không cần biểu đạt riêng trong tiếng Việt.
