  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: vi
  text: Các ngươi phải giữ ngày Sa-bát, vì ngày ấy là thánh đối với các ngươi. Người nào phạm thánh ngày ấy chắc chắn phải bị xử tử; vì người nào làm công việc trong ngày ấy thì người đó sẽ bị loại khỏi dân mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “bị loại khỏi dân mình” là một công thức pháp lý trong tiếng Hê-bơ-rơ; câu này không nói rõ hình phạt được thi hành theo cách nào.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: các ngươi phải giữ
  rationale: Động từ שׁמר ở đây mang nghĩa tuân giữ, giữ gìn một quy định giao ước; “phải giữ” tự nhiên trong văn luật và bảo toàn lực mệnh lệnh.
- source_word: הַשַּׁבָּת
  choice: ngày Sa-bát
  rationale: Cách gọi quen thuộc trong tiếng Việt cho ngày nghỉ được biệt riêng; thêm “ngày” giúp độc giả phổ thông nhận rõ đối tượng.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: ngày ấy là thánh đối với các ngươi
  rationale: Giữ sắc thái của לָכֶם và ý niệm ngày này được biệt riêng là thánh, thay vì diễn giải thành lợi ích hay sở hữu.
- source_word: מְחַלְלֶיהָ
  choice: kẻ nào xúc phạm ngày ấy
  rationale: חלל ở thể piel có nghĩa làm ô uế, xúc phạm hoặc phàm tục hóa điều thánh. “Xúc phạm” rõ và trang trọng trong ngữ cảnh này.
- source_word: מוֹת יוּמָת
  choice: chắc chắn phải bị xử tử
  rationale: Kết cấu nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn; dạng bị động Hophal trong luật pháp chỉ việc bị xử tử.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: bất cứ ai làm công việc trong ngày ấy
  rationale: Diễn đạt trực tiếp mệnh đề khái quát; מְלָאכָה là công việc hay lao tác, không cần thêm loại công việc mà câu không nêu.
- source_word: וְנִכְרְתָה
  choice: sẽ bị loại khỏi
  rationale: כרת thể Niphal là công thức pháp lý về việc bị cắt lìa hay loại khỏi. Cách dịch này tự nhiên trong tiếng Việt mà không quy định cơ chế hình phạt.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: người đó
  rationale: Trong văn luật, נֶפֶשׁ chỉ chính cá nhân phạm lỗi, không nhất thiết nói đến một thành phần phi vật chất là “linh hồn”.
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: khỏi dân mình
  rationale: Diễn đạt sự bị cắt lìa khỏi cộng đồng của người ấy. Hậu tố giống cái theo ngữ pháp hòa hợp với נֶפֶשׁ, không chỉ một người nữ.
theological_decisions:
- issue: Ý nghĩa công thức hình phạt וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ
  choice: Giữ nghĩa “sẽ bị loại khỏi dân mình” và chú thích rằng cơ chế không được nêu rõ.
  alternative: Bị khai trừ khỏi cộng đồng; bị Đức Chúa Trời trừng phạt; bị xử tử.
  rationale: Bản Hê-bơ-rơ dùng một công thức pháp lý nặng nhưng tại đây không xác định đó là hành quyết, khai trừ hay phán xét trực tiếp của Đức Chúa Trời; bản dịch không nên tự giải quyết sự mơ hồ ấy.
- issue: Cách hiểu נֶפֶשׁ trong văn cảnh luật pháp
  choice: Dịch là “người đó”.
  alternative: “linh hồn ấy” hoặc “mạng sống ấy”.
  rationale: Từ này ở đây quy chiếu toàn bộ cá nhân chịu trách nhiệm pháp lý, không đưa ra một khẳng định riêng về cấu tạo con người.
translation_notes:
  register: Văn phong luật giao ước trang trọng nhưng dễ hiểu. Dùng “các ngươi” để giữ lời phán trực tiếp số nhiều trong bối cảnh cổ, “người đó/dân mình” để tránh phân biệt giới tính không có trong ý nghĩa của câu.
