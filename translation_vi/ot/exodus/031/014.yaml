revisions:
- from: Vậy, các ngươi phải giữ ngày Sa-bát, vì ngày ấy là thánh đối với các ngươi. Kẻ nào xúc phạm ngày ấy chắc chắn phải bị xử tử; vì bất cứ ai làm công việc trong ngày ấy, người đó sẽ bị loại khỏi dân mình.[a]
  to: Các ngươi phải giữ ngày Sa-bát, vì ngày ấy là thánh đối với các ngươi. Người nào phạm thánh ngày ấy chắc chắn phải bị xử tử; vì người nào làm công việc trong ngày ấy thì người đó sẽ bị loại khỏi dân mình.[a]
  rationale: Bản sửa bỏ liên từ suy diễn không cần thiết, điều chỉnh cách gọi chủ thể cho nhất quán trong văn phong luật lệ, và dùng «phạm thánh» để chuyển tải sát hơn động từ חלל. Công thức hình phạt «bị loại khỏi dân mình» cùng chú thích được giữ nguyên để không định nghĩa quá mức cơ chế của כרת.
  reviewer_model: gpt-5.6-terra
