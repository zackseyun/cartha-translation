  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: vi
  text: và bàn cùng các dụng cụ của bàn, chân đèn tinh sạch[a] cùng tất cả các dụng cụ của nó, và bàn thờ dâng hương[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tinh sạch” có thể chỉ sự tinh sạch về nghi lễ; trong ngữ cảnh Đền Tạm, từ này cũng có thể gợi đến việc chân đèn được làm bằng vàng ròng như được mô tả ở những chỗ liên quan.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “bàn thờ xông hương”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: cái bàn
  rationale: Danh từ שֻׁלְחָן đơn giản có nghĩa là “bàn”. Ngữ cảnh Đền Tạm cho biết đây là bàn nào, nhưng câu này không nêu danh xưng đầy đủ, nên giữ cách dịch ngắn gọn.
- source_word: כֵּלָיו
  choice: các dụng cụ của bàn
  rationale: כְּלִי có nghĩa rộng, chỉ đồ dùng, vật dụng hoặc dụng cụ. Lặp lại “của bàn” thay vì dùng đại từ giúp câu tiếng Việt rõ nghĩa trong danh sách nhiều vật thánh.
- source_word: הַמְּנֹרָה
  choice: chân đèn
  rationale: מְנוֹרָה chỉ giá hoặc chân đỡ đèn trong nơi thánh. Dịch nghĩa bằng danh từ thông dụng tự nhiên hơn là phiên âm “menorah”.
- source_word: הַטְּהֹרָה
  choice: tinh sạch
  rationale: טָהוֹר có thể mang nghĩa “sạch” hoặc “tinh sạch”. Trong ngữ cảnh thờ phượng, “tinh sạch” giữ được sắc thái nghi lễ và không loại trừ sự liên hệ với vàng ròng trong các mô tả liên quan.
- source_word: כָּל כֵּלֶיהָ
  choice: tất cả các dụng cụ của nó
  rationale: כָּל biểu thị tính toàn bộ, còn כֵּלֶיהָ chỉ những dụng cụ đi kèm chân đèn. Cách dịch giữ cả ý bao quát lẫn mối liên hệ sở hữu.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: bàn thờ dâng hương
  rationale: Cụm danh từ ghép có nghĩa là bàn thờ dành cho việc dâng hương. Cách diễn đạt này tự nhiên trong tiếng Việt và tránh khả năng hiểu “bàn thờ bằng hương”.
- source_word: וְאֶת
  choice: cùng / và
  rationale: אֵת là dấu hiệu chỉ tân ngữ xác định nên không dịch riêng; וְ được thể hiện bằng “cùng” hoặc “và” để duy trì cấu trúc liệt kê.
theological_decisions:
- issue: Ý nghĩa của הַטְּהֹרָה khi mô tả chân đèn
  choice: tinh sạch
  alternative: bằng vàng ròng
  rationale: Nguyên văn chỉ dùng tính từ “tinh sạch”, không nói trực tiếp “vàng” trong câu này. Vì vậy bản dịch giữ nguyên tính từ và để chú thích nêu các sắc thái có thể có, thay vì diễn giải thành chất liệu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp một câu nằm giữa danh sách. Dùng “chân đèn” thay cho từ phiên âm; dùng “dâng hương” để diễn đạt rõ công dụng của bàn thờ. Mọi dấu chú thích đều xuất hiện trong chính văn.
