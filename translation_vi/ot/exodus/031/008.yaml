  terminology: “Chân đèn”, “tinh sạch”, “dụng cụ” và “bàn thờ dâng hương” đều phù hợp. “Tinh sạch” bảo toàn tính từ טְהוֹרָה mà không diễn giải thành “bằng vàng ròng”. Chú thích được neo đúng sau “tinh sạch” và cung cấp phương án từ vựng cho “bàn thờ dâng hương”.
