  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: vi
  text: Đó là dấu hiệu đời đời giữa Ta và dân Israel[a], vì trong sáu ngày Yahweh đã dựng nên trời và đất, và vào ngày thứ bảy, Ngài ngừng công việc và lấy lại sức[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; cũng có thể dịch là “con dân Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Ngài nghỉ”; động từ Hê-bơ-rơ có nghĩa căn bản là “ngừng, thôi làm.”
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch sát hình ảnh hơn là “lấy lại hơi” hoặc “được phục hồi”; nguyên văn dùng lối nói nhân hóa sống động.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: giữa Ta và
  rationale: Diễn đạt tự nhiên cấu trúc tương liên chỉ mối quan hệ giữa hai bên; “Ta” giữ ngôi thứ nhất trong lời phán của Đức Chúa Trời.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  rationale: Cách gọi tự nhiên, rõ nghĩa trong tiếng Việt hiện đại đối với cộng đồng Israel; nghĩa đen mang hình ảnh gia tộc được ghi ở chú thích.
- source_word: אוֹת
  choice: dấu hiệu
  rationale: Giữ nghĩa thông dụng của thuật ngữ giao ước, chỉ điều làm dấu cho một mối quan hệ lâu bền.
- source_word: לְעֹלָם
  choice: đời đời
  rationale: Diễn đạt trực tiếp thời hạn lâu bền, đồng thời giữ sắc thái trang trọng phù hợp văn cảnh.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do hoặc nền tảng giải thích cho ngày Sa-bát như một dấu hiệu.
- source_word: שֵׁשֶׁת יָמִים
  choice: trong sáu ngày
  rationale: Diễn đạt tự nhiên khung thời gian của công cuộc sáng tạo.
- source_word: עָשָׂה
  choice: dựng nên
  rationale: Trong văn cảnh sáng tạo, “dựng nên” tự nhiên và trang trọng hơn “làm,” nhưng không thêm ý nghĩa ngoài động từ nguồn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: trời và đất
  rationale: Công thức toàn thể quen thuộc và tự nhiên trong tiếng Việt, chỉ toàn bộ cõi thọ tạo; tiếng Việt không bắt buộc biểu thị hình thái số nhiều của שָׁמַיִם.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: còn đến ngày thứ bảy
  rationale: Giữ trình tự thời gian đồng thời thể hiện sự chuyển ý nhẹ, không biến liên từ thành một đối lập mạnh.
- source_word: שָׁבַת
  choice: ngừng công việc
  rationale: Giữ nghĩa cốt lõi là chấm dứt hoạt động; bổ sung “công việc” theo ngữ cảnh để câu tiếng Việt rõ và tự nhiên, không hàm ý Đức Chúa Trời mệt mỏi.
- source_word: וַיִּנָּפַשׁ
  choice: được hồi sức
  rationale: Giữ hình ảnh nhân hóa sống động của nguyên văn; chú thích nêu cách hiểu sát hình ảnh hơn là “lấy lại hơi.”
theological_decisions:
- issue: Lối nói nhân hóa về Đức Chúa Trời trong ngôn ngữ ngày Sa-bát
  choice: Ngài ngừng công việc và được hồi sức
  alternative: Ngài nghỉ và lấy lại hơi
  rationale: Bản dịch không làm nhạt đi hình ảnh nhân hóa của וַיִּנָּפַשׁ, nhưng phân biệt שָׁבַת là “ngừng” với ý niệm mệt mỏi thường gắn với “nghỉ.”
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  alternative: các con trai của Israel
  rationale: “Dân Israel” truyền đạt đúng đối tượng tập thể bằng tiếng Việt tự nhiên; chú thích bảo tồn cách nói gia tộc và hình thức giống đực của nguyên văn.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ đây là danh riêng trong nguyên văn, không âm thầm thay bằng tước hiệu hay chọn một dạng chuyển tự khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Viết hoa “Ta” và “Ngài” theo quy ước tôn kính phổ biến; giữ “Yahweh” như danh riêng. Nhịp câu bảo tồn quan hệ giải thích giữa dấu hiệu giao ước và khuôn mẫu sáng tạo, đồng thời các chú thích giữ những nét nghĩa khó chuyển trọn sang tiếng Việt.
