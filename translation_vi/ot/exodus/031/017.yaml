revisions:
- from: Đó là dấu hiệu đời đời giữa Ta và dân Israel[a], vì trong sáu ngày Yahweh đã dựng nên trời và đất, còn đến ngày thứ bảy, Ngài ngừng công việc[b] và được hồi sức[c].
  to: Đó là dấu hiệu đời đời giữa Ta và dân Israel[a], vì trong sáu ngày Yahweh đã dựng nên trời và đất, và vào ngày thứ bảy, Ngài ngừng công việc và lấy lại sức[b][c].
  rationale: Sửa liên từ để không thêm ý đối lập và thay cách diễn đạt bị động, sắc thái y khoa bằng một cách nói chủ động, tự nhiên hơn. Các yếu tố còn lại, kể cả danh Yahweh, cách gọi tập thể “dân Israel,” và các chú thích, đều được giữ vì trung thành với nguyên văn và phù hợp tiếng Việt tiêu chuẩn hiện đại.
