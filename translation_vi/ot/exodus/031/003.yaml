source:
  edition: WLC
  text: וָ/אֲמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: vi
  text: Ta đã làm cho người đầy dẫy Thần của Đức Chúa Trời[a], ban cho người sự khôn ngoan, sự thông hiểu, sự hiểu biết và mọi tài nghệ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thần khí của Đức Chúa Trời” hoặc “một thần khí thiêng liêng.” Cụm từ Hê-bơ-rơ có thể được hiểu theo nghĩa rộng hơn, nhưng ở đây rất có thể chỉ chính Thần của Đức Chúa Trời đang ban năng lực.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: Ta đã làm cho người đầy dẫy
  rationale: Động từ מלא ở thể hoàn thành diễn tả việc Đức Chúa Trời đã ban đầy đủ năng lực cho Bết-sa-lê, với kết quả vẫn có hiệu lực trong hiện tại. Cách dịch này tự nhiên trong tiếng Việt và giữ hình ảnh 'làm cho đầy'.
- source_word: אֹתוֹ
  choice: người
  rationale: Đại từ tân ngữ chỉ về Bết-sa-lê trong câu trước. 'Người' phù hợp với văn phong Kinh Thánh trang trọng và tránh lẫn với ngôi xưng của Đức Chúa Trời.
- source_word: רוּחַ אֱלֹהִים
  choice: Thần của Đức Chúa Trời
  rationale: Cụm danh từ liên kết có thể chỉ chính Thần của Đức Chúa Trời hoặc, theo nghĩa rộng hơn, một thần khí đến từ Đức Chúa Trời. Trong bối cảnh Đức Chúa Trời trực tiếp ban năng lực để phục vụ nơi thánh, cách dịch được chọn là phù hợp nhất, đồng thời chú thích bảo lưu độ mở của tiếng Hê-bơ-rơ.
- source_word: בְּחָכְמָה
  choice: ban cho người sự khôn ngoan
  rationale: Giới từ בְּ nêu phương diện hoặc năng lực đi kèm việc làm cho đầy. Thêm 'ban cho người' giúp câu tiếng Việt tự nhiên mà vẫn giữ ý về năng lực được Đức Chúa Trời ban.
- source_word: וּבִתְבוּנָה
  choice: sự thông hiểu
  rationale: תְּבוּנָה chỉ khả năng hiểu thấu, nhận định hoặc thông sáng. 'Sự thông hiểu' phân biệt tương đối rõ với 'sự khôn ngoan' và 'sự hiểu biết' trong chuỗi ba thuật ngữ.
- source_word: וּבְדַעַת
  choice: sự hiểu biết
  rationale: דַּעַת thường chỉ tri thức hoặc sự hiểu biết. Cách dịch này ngắn gọn, quen thuộc và giữ cấu trúc liệt kê.
- source_word: וּבְכָל מְלָאכָה
  choice: và mọi tài nghệ
  rationale: מְלָאכָה có thể là công việc, nghề nghiệp hoặc tay nghề. Trong ngữ cảnh chế tác Đền Tạm, 'mọi tài nghệ' diễn đạt tự nhiên các kỹ năng thủ công và nghệ thuật, không thu hẹp vào một nghề cụ thể.
theological_decisions:
- issue: רוּחַ אֱלֹהִים nên được hiểu là chính Thần của Đức Chúa Trời hay một thần khí/năng lực thiêng liêng theo nghĩa rộng
  choice: Thần của Đức Chúa Trời
  alternative: thần khí của Đức Chúa Trời; một thần khí thiêng liêng
  rationale: Bối cảnh mô tả Đức Chúa Trời trực tiếp trang bị Bết-sa-lê để làm công việc thánh, nên cách hiểu là chính Thần của Ngài có sức thuyết phục hơn. Tuy nhiên, bản dịch không áp đặt những định nghĩa thần học phát triển về sau; chú thích ghi nhận các khả năng ngữ nghĩa rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Ta' cho lời Đức Chúa Trời và 'người' để chỉ Bết-sa-lê. Cấu trúc được điều chỉnh nhẹ bằng cụm 'ban cho người' để chuỗi phẩm chất tự nhiên trong tiếng Việt, trong khi vẫn giữ hình ảnh được làm cho đầy dẫy và sự phân biệt giữa khôn ngoan, thông hiểu, hiểu biết và tài nghệ.
