base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: vi
  text: Khi Đức Chúa Trời đã nói xong với Môi-se trên núi Si-nai, Ngài trao cho ông hai bảng của lời chứng, là hai bảng đá, được viết bằng ngón tay Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “do ngón tay Đức Chúa Trời viết.” Cách nói Hê-bơ-rơ này sinh động quy việc viết trực tiếp cho Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ngài trao
  rationale: Động từ נתן trong mạch kể mang nghĩa trao/ban. “Trao” tự nhiên khi nói về việc Đức Chúa Trời giao hai bảng cho Môi-se.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: nói chuyện ... xong
  rationale: Cấu trúc כ + động từ nguyên mẫu của כלה diễn tả thời điểm hoàn tất; cách nói “... xong” tự nhiên trong tiếng Việt và giữ đúng quan hệ thời gian.
- source_word: אִתּוֹ
  choice: với Môi-se
  rationale: Đại từ chỉ Môi-se theo văn cảnh. Lặp tên giúp câu tiếng Việt rõ chủ thể hơn mà không thay đổi nghĩa.
- source_word: בְּהַר סִינַי
  choice: trên núi Si-nai
  rationale: Diễn đạt địa điểm trực tiếp, tự nhiên trong tiếng Việt.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: hai bảng Chứng Ước
  rationale: עֵדוּת cơ bản là chứng ngôn/chứng cứ, nhưng trong ngữ cảnh Ngũ Kinh chỉ chứng tích mang tính giao ước. “Chứng Ước” ngắn gọn, trang trọng và giữ liên hệ giữa lời chứng với giao ước mà không diễn giải thành toàn bộ văn kiện.
- source_word: לֻחֹת אֶבֶן
  choice: hai bảng đá
  rationale: Cụm từ nêu chất liệu của các bảng; “bảng đá” là cách nói tự nhiên trong tiếng Việt.
- source_word: כְּתֻבִים
  choice: có chữ ... viết
  rationale: Phân từ bị động của כתב có nghĩa “được viết”. Cấu trúc tiếng Việt này tự nhiên và vẫn bảo toàn ý chữ trên bảng do Đức Chúa Trời viết.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: do ngón tay Đức Chúa Trời viết
  rationale: בְּ mang nghĩa phương tiện/tác nhân. Cách dịch giữ nguyên hình ảnh cụ thể “ngón tay Đức Chúa Trời” và nêu rõ tác nhân trực tiếp.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Ở đây אֱלֹהִים chỉ Đức Chúa Trời của Israel, mang nghĩa số ít; đây là danh xưng trang trọng, quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách diễn tả nhân hình về việc Đức Chúa Trời viết
  choice: do ngón tay Đức Chúa Trời viết
  alternative: do chính Đức Chúa Trời viết; được viết bởi quyền năng Đức Chúa Trời
  rationale: Bản Hê-bơ-rơ dùng hình ảnh cụ thể và mạnh. Bản dịch giữ nguyên hình ảnh cùng sự nhấn mạnh về hành động trực tiếp của Đức Chúa Trời, không làm nhạt thành một khái niệm trừu tượng.
- issue: Ý nghĩa giao ước của הָעֵדֻת
  choice: Chứng Ước
  alternative: chứng ngôn; lời chứng; văn kiện giao ước
  rationale: Từ này giữ sắc thái chứng nhận đồng thời gợi đúng bối cảnh giao ước. Viết hoa cho thấy đây là tên gọi chức năng của hai bảng, không thêm một giáo thuyết ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nói chuyện ... xong” để thể hiện tự nhiên cấu trúc thời gian; giữ nguyên hình ảnh “ngón tay Đức Chúa Trời”. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan.
