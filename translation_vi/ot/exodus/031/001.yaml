base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH, theo truyền thống thường được dịch là “CHÚA”; cũng có thể phiên âm là “Giê-hô-va.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa trình thuật tiến sang hành động kế tiếp; “Rồi” diễn đạt tự nhiên tính nối tiếp. Với lời của Đức Chúa Trời, “phán” là cách nói trang trọng và quen thuộc trong tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Danh riêng YHWH được phiên âm theo cách gọi đã quen thuộc rộng rãi trong tiếng Việt, thay vì thay bằng một tước hiệu; chú thích nêu dạng phục nguyên thường dùng khác.
- source_word: אֶל
  choice: với
  rationale: Trong công thức chỉ hành động nói, giới từ đánh dấu người tiếp nhận lời nói; “phán với Môi-se” tự nhiên trong tiếng Việt.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã thành chuẩn và quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này giới thiệu nội dung lời phán tiếp theo. “Rằng” giữ chức năng liên kết mà tự nhiên hơn lối dịch sát “mà nói rằng” trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng YHWH. Bản dịch giữ danh riêng thay vì thay bằng tước hiệu “CHÚA”; “Giê-hô-va” là dạng quen thuộc trong tiếng Việt, còn chú thích minh bạch rằng “Yahweh/Gia-vê” là cách phục nguyên khác thường gặp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ công thức dẫn nhập lời phán của nguyên văn nhưng dùng “rằng” để tránh cấu trúc dịch từng chữ thiếu tự nhiên.
