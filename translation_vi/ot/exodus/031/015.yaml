  variant: modern standard Vietnamese
source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: vi
  text: Sáu ngày được làm việc, nhưng ngày thứ bảy là ngày Sa-bát, một ngày nghỉ hoàn toàn, thánh cho Yahweh[a]. Bất cứ ai làm công việc trong ngày Sa-bát chắc chắn phải bị xử tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một ngày Sa-bát, một sự nghỉ ngơi trọng thể.” Cụm từ Hê-bơ-rơ nhấn mạnh ý ngưng mọi công việc và nghỉ ngơi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: công việc được phép làm
  rationale: Dạng Niphal diễn đạt ý bị động “được làm”; trong ngữ cảnh luật lệ, “được phép làm” truyền đạt tự nhiên rằng sáu ngày là thời gian được làm việc mà không biến câu thành lời tiên báo.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: nhưng ngày thứ bảy
  rationale: Liên từ ו có thể là “và”, nhưng ở đây hai vế tương phản giữa sáu ngày làm việc và ngày thứ bảy; “nhưng” diễn đạt rõ quan hệ ấy trong tiếng Việt.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: ngày Sa-bát nghỉ ngơi hoàn toàn
  rationale: Giữ danh xưng Sa-bát đồng thời thể hiện tác dụng nhấn mạnh của שַׁבָּתוֹן về sự ngưng nghỉ trọn vẹn.
- source_word: קֹדֶשׁ לַיהוָה
  choice: thánh dành cho Yahweh
  rationale: קֹדֶשׁ chỉ địa vị thánh, còn ל biểu thị sự quy hướng hoặc dâng dành cho Yahweh. Cách dịch này ngắn gọn và không thêm một cách giải nghĩa giáo phái.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: Bất cứ ai làm công việc
  rationale: כָּל cùng phân từ diễn tả một phạm trù pháp lý bao quát; “bất cứ ai” giữ được tính phổ quát ấy.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: trong ngày Sa-bát
  rationale: Giữ từ יוֹם được nêu rõ trong nguyên văn và diễn đạt tự nhiên bằng tiếng Việt.
- source_word: מוֹת יוּמָת
  choice: chắc chắn phải bị xử tử
  rationale: Động từ nguyên mẫu tuyệt đối đi với dạng Hophal nhấn mạnh hình phạt; “chắc chắn” giữ sắc thái tăng cường, còn “bị xử tử” giữ ý bị động mang tính pháp lý.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. “Yahweh” bảo toàn chức năng danh riêng và không thay nó bằng tước hiệu.
- issue: Mức độ nhấn mạnh của שַׁבַּת שַׁבָּתוֹן
  choice: ngày Sa-bát nghỉ ngơi hoàn toàn
  alternative: một ngày Sa-bát, một kỳ nghỉ long trọng; ngày Sa-bát nghỉ ngơi
  rationale: Cách dịch giữ cả danh xưng Sa-bát lẫn ý tăng cường về sự ngưng nghỉ, nhưng không đưa vào những công thức thần học phát triển về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Sa-bát” là dạng quen thuộc trong tiếng Việt; cấu trúc pháp lý ở câu cuối được giữ dứt khoát. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
