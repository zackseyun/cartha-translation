revisions:
- from: Trong sáu ngày, công việc được phép làm; nhưng ngày thứ bảy là ngày Sa-bát nghỉ ngơi hoàn toàn[a], thánh dành cho Yahweh. Bất cứ ai làm công việc trong ngày Sa-bát chắc chắn phải bị xử tử.
  to: Sáu ngày được làm việc, nhưng ngày thứ bảy là ngày Sa-bát, một ngày nghỉ hoàn toàn, thánh cho Yahweh[a]. Bất cứ ai làm công việc trong ngày Sa-bát chắc chắn phải bị xử tử.
  rationale: Bản sửa thay các cụm gượng bằng lối diễn đạt pháp lý tự nhiên trong tiếng Việt, đồng thời bảo toàn thể bị động của câu mở đầu, sự tăng cường trong שבת שבתון, tình trạng thánh cho Yahweh, và hình phạt bị động được nhấn mạnh ở câu cuối. Chú thích vẫn được neo ngay sau cụm “ngày nghỉ hoàn toàn” mà nó giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:50:59Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trật tự lập pháp và các ý chính của tiếng Hê-bơ-rơ: sáu ngày làm việc, ngày thứ bảy là שבת שבתון, được thánh hóa cho Yahweh, và hình phạt được diễn đạt ở thể bị động với sắc thái nhấn mạnh. Tuy nhiên, “công việc được phép làm” thêm sắc thái ‘được phép’ vào động từ bị động יֵעָשֶׂה và không tự nhiên bằng cách nói phi cá nhân trong tiếng Việt.'
  naturalness: “Trong sáu ngày, công việc được phép làm” và “ngày Sa-bát nghỉ ngơi hoàn toàn” hơi gượng trong tiếng Việt hiện đại. “Sáu ngày được làm việc” và cấu trúc đồng vị “ngày Sa-bát, một ngày nghỉ hoàn toàn” tự nhiên, rõ nghĩa, và phản ánh tốt sự nhấn mạnh của cụm שבת שבתון.
  terminology: Giữ “Sa-bát” và “Yahweh” nhất quán với bản thảo và quyết định thuật ngữ. “Thánh cho Yahweh” là cách nói trang trọng, sát nghĩa và tự nhiên hơn “thánh dành cho Yahweh” trong vị ngữ này. “Bị xử tử” thích hợp với Hophal מות יומת.
  issues:
  - severity: medium
    issue: “công việc được phép làm”
    rationale: 'Cụm này không tự nhiên và ‘được phép’ có thể gợi một sự cho phép pháp lý rõ nét hơn điều được nói trực tiếp. Tiếng Hê-bơ-rơ dùng bị động: ‘công việc sẽ/được làm’ trong sáu ngày. Cách nói “Sáu ngày được làm việc” giữ tính khái quát, quy định và tự nhiên.'
  - severity: low
    issue: “ngày Sa-bát nghỉ ngơi hoàn toàn”
    rationale: Cụm danh từ có thể bị hiểu là ngày Sa-bát đang nghỉ ngơi. Dùng cấu trúc đồng vị “ngày Sa-bát, một ngày nghỉ hoàn toàn” làm rõ שבת שבתון mà không giảm sắc thái nhấn mạnh.
  - severity: low
    issue: “thánh dành cho Yahweh”
    rationale: Không sai nghĩa, nhưng “thánh cho Yahweh” gọn và tự nhiên hơn, đồng thời phản ánh trực tiếp קֹדֶשׁ לַיהוָה.
