lexical_decisions:
- source_word: לַחְשֹׁב מַחֲשָׁבֹת
  choice: để nghĩ ra những kiểu mẫu
  rationale: Cụm động từ–danh từ cùng gốc diễn tả việc suy tính và sáng tạo các mẫu thiết kế trong bối cảnh thủ công; “nghĩ ra những kiểu mẫu” tự nhiên, dễ hiểu và vẫn giữ sắc thái hoạch định sáng tạo.
- source_word: לַעֲשׂוֹת
  choice: chế tác
  rationale: Trong chuỗi nói về tay nghề và các vật liệu kim loại, “chế tác” diễn đạt cụ thể việc làm ra sản phẩm thủ công hơn từ khái quát “làm”.
- source_word: בַּזָּהָב וּבַכֶּסֶף
  choice: bằng vàng, bạc
  rationale: Giới từ ב chỉ vật liệu được sử dụng; tiếng Việt tự nhiên dùng “bằng”, đồng thời có thể lược lặp giới từ trong danh sách.
- source_word: וּבַנְּחֹשֶׁת
  choice: và đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng đỏ hoặc đồng thiếc. Từ “đồng” trong tiếng Việt giữ được độ rộng nghĩa của từ Hê-bơ-rơ thay vì quyết đoán một hợp kim cụ thể.
