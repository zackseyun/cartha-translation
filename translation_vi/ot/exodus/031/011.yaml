  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: vi
  text: cùng dầu xức và hương thơm[a] dùng cho nơi thánh. Họ phải làm các thứ ấy theo mọi điều Ta đã truyền cho con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hương bằng các hương liệu dùng cho nơi thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: dầu xức
  rationale: Cụm từ chỉ loại dầu dùng trong nghi thức xức; “dầu xức” tự nhiên, ngắn gọn và không thêm tính từ “thánh” vốn không có ngay trong cụm này.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: hương thơm
  rationale: Cụm từ chỉ hương được chế từ các chất thơm. “Hương thơm” là cách diễn đạt tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh thờ phượng.
- source_word: לַקֹּדֶשׁ
  choice: dùng cho nơi thánh
  rationale: Giới từ לְ có thể chỉ mục đích hoặc nơi chốn; cách dịch này giữ cả ý dùng trong phạm vi thánh và tránh xác định quá mức là một gian cụ thể.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: đúng như Ta đã truyền cho con
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ ý tuân theo trọn vẹn mệnh lệnh và lời Thiên Chúa trực tiếp nói với Môi-se.
- source_word: יַעֲשׂוּ
  choice: Họ phải làm mọi thứ
  rationale: Động từ số nhiều quy về những người thợ đã được nhắc đến; “phải” giữ sắc thái chỉ thị, còn “mọi thứ” gom các vật phẩm trong danh sách.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con” thể hiện lời Đức Chúa Trời trực tiếp phán với Môi-se; câu giữ tính nối tiếp của danh sách bằng từ “cùng”.
