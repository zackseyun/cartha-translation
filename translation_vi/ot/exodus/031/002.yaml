translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” thể hiện lời Đức Chúa Trời đang phán trong văn mạch. Không thêm chú thích vì “gọi đích danh” truyền đạt đầy đủ sắc thái chỉ định cá nhân của thành ngữ Hê-bơ-rơ.
