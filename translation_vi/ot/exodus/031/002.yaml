  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: vi
  text: Hãy xem, Ta đã gọi đích danh Bết-sa-lê-ên, con trai của U-ri, mà U-ri là con trai của Hu-rơ, thuộc chi phái Giu-đa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Hãy xem
  rationale: Mệnh lệnh của ראה được dùng để hướng sự chú ý đến lời tuyên bố tiếp theo; “Hãy xem” giữ được tính trực tiếp và trang trọng.
- source_word: קָרָאתִי בְשֵׁם
  choice: Ta đã gọi đích danh
  rationale: Cụm này vừa giữ động từ “gọi” vừa truyền đạt thành ngữ chỉ sự lựa chọn, chỉ định một người cụ thể; “đích danh” tự nhiên hơn lối dịch máy móc “bằng tên” trong tiếng Việt.
- source_word: בְּצַלְאֵל
  choice: Bết-sa-lê-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: con trai U-ri, cháu của Hu-rơ
  rationale: Hai lần בֶּן tạo chuỗi gia phả. Tiếng Việt tự nhiên phân biệt quan hệ trực tiếp là “con trai” và đời kế trước là “cháu”, thay vì lặp “con trai của... con trai của...” gây mơ hồ.
- source_word: לְמַטֵּה יְהוּדָה
  choice: thuộc bộ tộc Giu-đa
  rationale: מַטֶּה trong ngữ cảnh gia tộc chỉ bộ tộc, còn לְ đánh dấu sự thuộc về; cách diễn đạt này rõ và tự nhiên.
