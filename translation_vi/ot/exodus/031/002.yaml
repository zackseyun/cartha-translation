  source_fidelity: 'Bản dịch truyền đạt đúng lời kêu gọi chú ý, việc Đức Chúa Trời gọi/chỉ định Bết-sa-lê-ên, và sự thuộc về chi phái Giu-đa. Tuy nhiên, chuỗi gia phả lặp lại בן trong tiếng Hê-bơ-rơ nêu rõ: Bết-sa-lê-ên là con của U-ri, và U-ri là con của Hu-rơ. Từ “cháu” trong tiếng Việt có thể chỉ quan hệ cháu nội/ngoại nhưng không giữ được cấu trúc gia phả được nêu trực tiếp và có thể tạo độ mơ hồ không cần thiết.'
