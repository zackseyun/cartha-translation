  text: in the cutting of stone for setting[a], and in the carving of wood, to do every kind of work[b],
translation:
  language: vi
  text: chế tác đá[b] để nạm[a], chạm khắc gỗ, và làm mọi loại công việc,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để gắn” hoặc “để khảm.”
    reason: lexical_alternative
  - marker: b
    text: Từ “đá” ở đây có nghĩa khái quát; trong ngữ cảnh, từ này có thể bao gồm cả đá quý dùng trong việc làm Đền Tạm.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: chạm khắc
  rationale: Danh từ חֲרֹשֶׁת chỉ công việc thủ công có kỹ năng. “Chạm khắc” diễn đạt tự nhiên hoạt động gia công cả đá lẫn gỗ trong ngữ cảnh này, cụ thể hơn “nghề thủ công” nhưng không thu hẹp thành một kỹ thuật quá chuyên biệt.
- source_word: אֶבֶן
  choice: đá
  rationale: אֶבֶן là từ thông thường chỉ đá. Ngữ cảnh có thể bao gồm đá quý dùng cho Đền Tạm, nhưng câu này không nói rõ, nên giữ nghĩa khái quát.
- source_word: לְמַלֹּאת
  choice: để nạm
  rationale: Trong ngữ cảnh chế tác, động từ này nói đến việc đưa đá vào chỗ đã chuẩn bị để gắn hoặc nạm. “Để nạm” ngắn gọn, tự nhiên và giữ được hình ảnh đặt đá vào phần lắp ghép.
- source_word: עֵץ
  choice: gỗ
  rationale: Đây là cách dịch thông dụng và tự nhiên của từ chỉ vật liệu עֵץ.
- source_word: לַעֲשׂוֹת
  choice: làm
  rationale: Động từ עשה có nghĩa rộng; “làm” giữ được tính khái quát và kết hợp tự nhiên với “mọi loại công việc”.
- source_word: בְּכָל מְלָאכָה
  choice: mọi loại công việc
  rationale: מְלָאכָה chỉ công việc hoặc lao động có kỹ năng. Cách dịch này giữ phạm vi bao quát của tiếng Hê-bơ-rơ, còn ngữ cảnh tự cho thấy đây là các công việc thủ công.
