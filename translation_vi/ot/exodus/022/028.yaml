  text: מְלֵאָתְ/ךָ֥ וְ/דִמְעֲ/ךָ֖ לֹ֣א תְאַחֵ֑ר בְּכ֥וֹר בָּנֶ֖י/ךָ תִּתֶּן לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: vi
  text: Con không được trì hoãn việc dâng phần hoa lợi đầy đủ và sản vật ép ra của mình.[a] Con phải dâng cho Ta con trai đầu lòng của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hoa lợi đầy đủ và nước ép của con.” Hai từ Hê-bơ-rơ có lẽ chỉ sản vật thu hoạch và sản vật dạng lỏng ép ra; cặp này có thể cụ thể là ngũ cốc và rượu, hoặc rộng hơn là hoa lợi dạng rắn và dạng lỏng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: hoa lợi đầy tràn
  rationale: Danh từ chỉ sự đầy tràn hay sản lượng dồi dào; trong bối cảnh luật về lễ vật, cụm này được diễn đạt tự nhiên là hoa lợi thu hoạch, đồng thời vẫn giữ sắc thái 'đầy tràn' của tiếng Hê-bơ-rơ.
- source_word: וְדִמְעֲךָ
  choice: sản vật ép ra
  rationale: Tuy danh từ có thể mang nghĩa đen là 'nước mắt', trong ngữ cảnh nông nghiệp nó chỉ sản vật dạng lỏng chảy ra khi ép, như rượu hoặc dầu. Cách dịch này giữ hình ảnh mà không thu hẹp thành riêng rượu hay dầu.
- source_word: לֹא תְאַחֵר
  choice: không được chậm dâng
  rationale: Động từ mang nghĩa trì hoãn. Bổ sung 'dâng' theo ngữ cảnh khiến câu tiếng Việt rõ và tự nhiên, nhưng không đổi nội dung mệnh lệnh.
- source_word: בְּכוֹר בָּנֶיךָ
  choice: con trai đầu lòng của mình
  rationale: בְּכוֹר là con đầu lòng, còn בָּנֶיךָ chỉ rõ 'các con trai của con'; cách dịch này bảo toàn giới tính được nêu trong nguyên văn.
- source_word: תִּתֶּן לִּי
  choice: Con phải dâng cho Ta
  rationale: Trong văn cảnh lễ vật dành cho Đức Chúa Trời, 'dâng' tự nhiên hơn 'cho', còn 'phải' thể hiện lực bắt buộc của luật. Đại từ 'Ta' giữ lời phán trực tiếp của Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của cặp מְלֵאָה / דִמְעָה trong luật về lễ vật
  choice: Hoa lợi thu hoạch và sản vật dạng lỏng ép ra đều phải được dâng đúng lúc.
  alternative: Hai từ chỉ đích danh ngũ cốc và rượu, hoặc nói chung về hoa lợi đầu mùa mà không phân biệt dạng sản vật.
  rationale: Nguyên văn dường như đặt sản lượng đầy tràn song song với chất lỏng chảy ra khi ép. Bản dịch giữ sự phân biệt giữa hoa lợi và sản vật ép ra nhưng không xác định quá mức là rượu hay dầu.
- issue: Phạm vi của בָּנֶיךָ
  choice: con trai
  alternative: con cái
  rationale: Tiếng Hê-bơ-rơ dùng từ chỉ con trai; giữ cách gọi này tránh trung tính hóa một chi tiết có thật trong nguyên văn.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng lối xưng hô “Con–Ta” cho lời Đức Chúa Trời phán trực tiếp; “hoa lợi” và “sản vật ép ra” là ngôn ngữ nông nghiệp hiện đại, không giới hạn chất lỏng vào rượu hay dầu.
