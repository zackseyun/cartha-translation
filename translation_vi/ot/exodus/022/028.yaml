    rationale: מְלֵאָה theo ngữ cảnh chỉ sự đầy đủ hay sản lượng phải nộp. “Phần hoa lợi đầy đủ” giữ được nét nghĩa này trong tiếng Việt tự nhiên hơn.
  - severity: low
