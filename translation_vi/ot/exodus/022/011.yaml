  text: But if it is stolen from him[a], he shall make restitution to its owner.
translation:
  language: vi
  text: Nhưng nếu nó quả thật bị lấy trộm từ chỗ người ấy[a], người ấy phải bồi thường cho chủ nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ sát chữ: “nếu bị trộm thì bị trộm từ với người ấy.” Cấu trúc lặp động từ này dùng để nhấn mạnh; trong ngữ cảnh, ý nói tài sản bị lấy trộm khi ở nơi hoặc trong sự trông giữ của người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Nhưng nếu
  rationale: Trong chuỗi luật theo từng trường hợp, liên từ mở đầu một điều kiện tương phản với trường hợp trước; “Nhưng nếu” diễn đạt tự nhiên sắc thái ấy.
- source_word: גָּנֹב יִגָּנֵב
  choice: quả thật bị lấy trộm
  rationale: Động từ nguyên thể tuyệt đối đi cùng động từ hữu hạn có tác dụng nhấn mạnh ý bị trộm. “Quả thật” giữ sắc thái nhấn mạnh mà vẫn tự nhiên trong tiếng Việt; đại từ “nó” được bổ sung theo đối tượng đã nêu ở ngữ cảnh trước.
- source_word: מֵעִמּוֹ
  choice: trong lúc người ấy giữ
  rationale: Cụm này sát chữ là “khỏi nơi/cùng với người ấy”; trong ngữ cảnh luật pháp, nó chỉ việc tài sản bị lấy trộm khi đang thuộc sự trông giữ của người nhận giữ. Cách dịch này làm rõ quan hệ giữ hộ mà không thay đổi trách nhiệm pháp lý của câu.
- source_word: יְשַׁלֵּם
  choice: phải bồi thường
  rationale: Dạng Piel của שלם trong văn cảnh luật pháp chỉ việc hoàn trả hoặc bồi hoàn thiệt hại. “Phải bồi thường” vừa thể hiện nghĩa vụ pháp lý vừa là cách nói hiện đại, rõ ràng.
- source_word: לִבְעָלָיו
  choice: cho chủ nó
  rationale: בעל ở đây là người sở hữu con vật hay tài sản được giao giữ. “Chủ nó” là cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “người ấy” để tránh mơ hồ về chủ thể, “quả thật” để bảo tồn cấu trúc nhấn mạnh của tiếng Hê-bơ-rơ, và “bồi thường” để truyền đạt chính xác nghĩa vụ pháp lý.
