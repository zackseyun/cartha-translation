base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: vi
  text: Nếu cha nàng nhất quyết không chịu gả nàng cho người ấy[a], thì người ấy phải cân bạc theo mức sính lễ dành cho các trinh nữ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “trao nàng cho người ấy”; trong bối cảnh này, thành ngữ ấy nói đến việc người cha chấp thuận gả nàng.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn nói “cân bạc”, phản ánh tập quán thanh toán bằng bạc được cân theo trọng lượng thay vì bằng tiền đúc.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Tiểu từ điều kiện mở đầu trường hợp luật định.
- source_word: מָאֵן יְמָאֵן
  choice: nhất quyết không chịu
  rationale: Kết cấu nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh sự khước từ; cách dịch này tự nhiên và giữ được sắc thái mạnh.
- source_word: אָבִיהָ
  choice: cha nàng
  rationale: Danh từ với hậu tố ngôi ba giống cái số ít; “nàng” duy trì văn phong trang trọng, dễ hiểu.
- source_word: לְתִתָּהּ לוֹ
  choice: gả nàng cho người ấy
  rationale: Nghĩa đen là “trao nàng cho người ấy”, nhưng trong bối cảnh hôn nhân, tiếng Việt tự nhiên diễn đạt bằng “gả”; chú thích ghi lại hình thức sát chữ.
- source_word: כֶּסֶף
  choice: bạc
  rationale: Giữ hình ảnh cụ thể của nguyên văn thay vì khái quát thành “tiền”.
- source_word: יִשְׁקֹל
  choice: phải cân
  rationale: Động từ mang nghĩa “cân”, phản ánh việc thanh toán bằng kim loại được cân theo trọng lượng.
- source_word: כְּמֹהַר
  choice: đủ bằng sính lễ
  rationale: מֹהַר là khoản hôn lễ trả cho gia đình người nữ; “sính lễ” là cách gọi hiện hành và phù hợp văn hóa-ngữ nghĩa trong tiếng Việt.
- source_word: הַבְּתוּלֹת
  choice: dành cho các trinh nữ
  rationale: Danh từ số nhiều có mạo từ chỉ chung mức sính lễ áp dụng cho hạng người này; không thêm ý “con gái” vốn không được nêu trực tiếp.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “cha nàng” và “người ấy” để tránh khẩu ngữ; giữ thuật ngữ pháp lý-hôn nhân “sính lễ” và hình ảnh cụ thể “cân bạc” của nguyên văn.
