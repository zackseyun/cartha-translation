revisions:
- from: Nếu cha nàng nhất quyết không chịu gả nàng cho người ấy[a], thì người ấy phải cân bạc đủ bằng sính lễ dành cho các trinh nữ.[b]
  to: Nếu cha nàng nhất quyết không chịu gả nàng cho người ấy[a], thì người ấy phải cân bạc theo mức sính lễ dành cho các trinh nữ.[b]
  rationale: Thay “đủ bằng” bằng “theo mức” để diễn đạt chính xác và tự nhiên hơn כְּמֹהַר (“theo mức sính lễ”), đồng thời giữ nguyên nghĩa, thuật ngữ và các chú thích cần thiết của bản nháp.
