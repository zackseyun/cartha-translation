- from: Nếu lửa bùng lên và bén vào bụi gai[a], rồi thiêu rụi đống lúa, lúa đang đứng trên đồng hoặc cả cánh đồng, thì người đã đốt lửa nhất định phải bồi thường[b].
  to: Nếu lửa bùng lên và bén vào bụi gai[a], rồi thiêu rụi đống lúa, lúa đang đứng trên đồng hoặc cánh đồng, thì người đã đốt lửa nhất định phải bồi thường[b].
