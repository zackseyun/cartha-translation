  text: כִּֽי תֵצֵ֨א אֵ֜שׁ וּ/מָצְאָ֤ה קֹצִים֙ וְ/נֶאֱכַ֣ל גָּדִ֔ישׁ א֥וֹ הַ/קָּמָ֖ה א֣וֹ הַ/שָּׂדֶ֑ה שַׁלֵּ֣ם יְשַׁלֵּ֔ם הַ/מַּבְעִ֖ר אֶת הַ/בְּעֵרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: vi
  text: Nếu lửa bùng lên và bén vào bụi gai[a], rồi thiêu rụi đống lúa, lúa đang đứng trên đồng hoặc cánh đồng, thì người đã đốt lửa nhất định phải bồi thường[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và gặp phải gai”; nghĩa đen là “và tìm thấy gai.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ dùng cấu trúc nhấn mạnh, có thể dịch: “chắc chắn phải trả đủ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu một trường hợp luật theo thể điều kiện; “Nếu” tự nhiên và giữ rõ cấu trúc luật tình huống.
- source_word: תֵצֵא אֵשׁ
  choice: lửa bùng lên
  rationale: Diễn đạt thành ngữ về lửa phát ra hoặc lan thành đám cháy, không phải lửa tắt; cách nói này tự nhiên trong tiếng Việt.
- source_word: וּמָצְאָה קֹצִים
  choice: và bén vào bụi gai
  rationale: Động từ có nghĩa đen là “tìm thấy/gặp”; trong ngữ cảnh đám cháy, “bén vào” truyền đạt tự nhiên việc lửa gặp và bắt vào gai mà không diễn giải quá mức.
- source_word: קֹצִים
  choice: bụi gai
  rationale: Giữ hình ảnh gai trong tiếng Hê-bơ-rơ, đồng thời dùng danh từ cụ thể tự nhiên hơn “gai” đứng riêng trong ngữ cảnh cháy lan.
- source_word: וְנֶאֱכַל
  choice: thiêu rụi
  rationale: Thể bị động của động từ “ăn/tiêu nuốt” chỉ việc bị lửa thiêu hủy; “thiêu rụi” rõ nghĩa và phù hợp văn cảnh.
- source_word: גָּדִישׁ
  choice: đống lúa
  rationale: Chỉ lúa đã gặt được gom thành đống; cách dịch ngắn gọn và dễ hiểu.
- source_word: הַקָּמָה
  choice: lúa đang đứng trên đồng
  rationale: Chỉ cây lúa/ngũ cốc chưa gặt, vẫn đứng tại ruộng; cách diễn đạt làm rõ sự tương phản với đống lúa đã thu hoạch.
- source_word: הַשָּׂדֶה
  choice: cả cánh đồng
  rationale: “Cánh đồng” là tương đương trực tiếp; thêm “cả” giúp tiếng Việt tự nhiên khi nói toàn bộ phần đồng bị cháy, nhưng không loại trừ khả năng từ này chỉ tài sản/cây trồng trên đồng.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: nhất định phải bồi thường
  rationale: Kết cấu nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh nghĩa vụ; “nhất định phải” giữ sắc thái nhấn mạnh, còn “bồi thường” phù hợp ngôn ngữ pháp lý hiện đại.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: người đã đốt lửa
  rationale: Chỉ người gây hoặc nhóm đám cháy; cách diễn đạt rõ trách nhiệm mà không thêm động cơ cố ý.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, câu điều kiện rõ ràng và dễ hiểu. Dùng “bồi thường” thay cho lối nói cổ; giữ hình ảnh bụi gai và sự phân biệt giữa lúa đã gom với lúa chưa gặt.
