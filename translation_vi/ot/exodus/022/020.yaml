  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: vi
  text: Anh em không được ngược đãi hay áp bức người ngoại kiều[a], vì anh em đã từng là ngoại kiều tại đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người tạm trú” hoặc “kiều dân.” Từ Hê-bơ-rơ גֵר chỉ một người không phải dân bản xứ đang sống giữa dân Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: người ngoại kiều
  rationale: Chỉ người không phải dân bản xứ nhưng đang cư trú giữa cộng đồng Israel, chứ không đơn thuần là khách qua đường. “Người ngoại kiều” diễn đạt khá rõ địa vị cư trú này trong tiếng Việt hiện đại.
- source_word: תוֹנֶה
  choice: ngược đãi
  rationale: Động từ ינה ở thể Hiphil nói đến việc đối xử bất công hoặc gây thiệt hại; “ngược đãi” giữ được nghĩa rộng mà không thu hẹp vào bóc lột kinh tế.
- source_word: תִלְחָצֶנּוּ
  choice: áp bức
  rationale: לחץ diễn tả việc gây sức ép khắc nghiệt hay đè nén. “Áp bức” phù hợp với sức nặng của ngữ cảnh luật pháp; đối tượng số ít được hiểu qua cụm danh từ đứng trước.
- source_word: כִּי
  choice: vì
  rationale: Dẫn vào lý do của mệnh lệnh một cách tự nhiên và súc tích.
- source_word: גֵרִים
  choice: ngoại kiều
  rationale: Lặp lại cùng thuật ngữ then chốt גֵר ở số nhiều; tiếng Việt không bắt buộc đánh dấu số nhiều, còn “đã từng là” làm rõ kinh nghiệm quá khứ chung của Israel.
- source_word: הֱיִיתֶם
  choice: anh em đã từng là
  rationale: Diễn đạt tình trạng trước đây của dân Israel; “đã từng” nhấn rõ trải nghiệm lịch sử được viện dẫn làm cơ sở cho mệnh lệnh.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: tại đất Ai Cập
  rationale: Giữ thành tố “đất/xứ” có trong tiếng Hê-bơ-rơ, đồng thời dùng cách nói trang trọng và tự nhiên.
theological_decisions:
- issue: Cách thể hiện danh từ và đại từ giống đực số ít dùng theo nghĩa khái quát
  choice: Giữ “người ngoại kiều” ở số ít như nguyên văn, nhưng không thêm đại từ giới tính vì tiếng Việt có thể lược bỏ tự nhiên.
  alternative: Dùng số nhiều “những người ngoại kiều” hoặc thêm “người ấy/ông ấy”.
  rationale: Tiếng Hê-bơ-rơ dùng גֵר số ít cùng hậu tố ngôi ba giống đực số ít trong văn phong luật pháp, với ý nghĩa khái quát. Tiếng Việt không cần đại từ tân ngữ sau “ngược đãi” và “áp bức” khi đối tượng chung đã được nêu, nên bản dịch giữ số ít mà không gán giới tính không cần thiết.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Anh em” thể hiện ngôi thứ hai số nhiều hướng đến cộng đồng Israel; cấu trúc “không được… hay…” tự nhiên trong tiếng Việt và chuyển tải hai lệnh cấm song song.
