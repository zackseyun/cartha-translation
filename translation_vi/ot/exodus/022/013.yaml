translation_notes:
  register: Văn phong pháp luật trang trọng nhưng hiện đại, với cấu trúc điều kiện rõ ràng. Bản chính dùng “con vật” theo dấu hiệu ngữ cảnh từ “chết”, đồng thời chú thích [a] bảo tồn khả năng từ ngữ có thể bao quát vật dụng bị hư hại.
