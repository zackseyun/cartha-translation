source:
  edition: WLC
  text: וְ/כִֽי יִשְׁאַ֥ל אִ֛ישׁ מֵ/עִ֥ם רֵעֵ֖/הוּ וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת בְּעָלָ֥י/ו אֵין עִמּ֖/וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: vi
  text: Nếu một người mượn một con vật hoặc vật dụng của người lân cận, rồi nó bị hỏng[a] hoặc chết, mà chủ của nó không có mặt cùng với nó, thì người ấy nhất định phải bồi thường đầy đủ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dịch sát là “bị gãy”. Từ Hê-bơ-rơ có thể chỉ một vật dụng mượn bị hư hại hoặc một con vật mượn bị thương.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “chắc chắn phải trả”; tức là phải bồi thường đầy đủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nếu
  rationale: Mở đầu một trường hợp có điều kiện trong bộ luật; tiếng Việt tự nhiên không cần dịch riêng liên từ וְ.
- source_word: יִשְׁאַל
  choice: mượn
  rationale: Trong ngữ cảnh pháp lý này, động từ chỉ việc vay mượn tài sản, chứ không chỉ là hỏi hay xin.
- source_word: אִישׁ
  choice: một người
  rationale: Danh từ giống đực số ít được dùng theo lối nêu trường hợp pháp lý chung; “một người” tự nhiên trong tiếng Việt và không làm thay đổi phạm vi áp dụng.
- source_word: מֵעִם רֵעֵהוּ
  choice: của người lân cận
  rationale: רֵעַ chỉ một người thuộc cộng đồng hay người lân cận; cấu trúc “mượn ... của” là cách nói tự nhiên trong tiếng Việt.
- source_word: וְנִשְׁבַּר
  choice: bị thương
  rationale: Nghĩa đen là “bị gãy, bị hỏng”; vì động từ מֵת tiếp theo cho thấy đối tượng có thể là con vật, “bị thương” phù hợp với mạch văn, còn nghĩa rộng hơn được giữ trong chú thích.
- source_word: אוֹ מֵת
  choice: hoặc chết
  rationale: Giữ nguyên điều kiện pháp lý thứ hai bằng cách diễn đạt trực tiếp.
- source_word: בְּעָלָיו
  choice: chủ nó
  rationale: Dạng từ có hình thức số nhiều nhưng mang nghĩa thành ngữ số ít là người sở hữu; đại từ nối rõ với vật hoặc con vật được mượn.
- source_word: אֵין עִמּוֹ
  choice: không có mặt ở đó
  rationale: Diễn đạt tự nhiên điều kiện người chủ không hiện diện cùng đối tượng được mượn, đồng thời tránh ép đại từ Hebrew thành “với người ấy” hay “với nó” khi tham chiếu có thể được hiểu theo ngữ cảnh.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: nhất định phải bồi thường
  rationale: Cấu trúc nguyên mẫu tuyệt đối kèm động từ hữu hạn nhấn mạnh nghĩa vụ chắc chắn; “bồi thường” thể hiện đúng tính chất hoàn trả thiệt hại trong luật.
