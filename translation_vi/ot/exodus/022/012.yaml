  to: Nhưng nếu con vật quả thật bị thú dữ xé[a], người giữ phải đem nó ra làm bằng chứng; người ấy không phải bồi thường con vật đã bị xé.
  rationale: Bổ sung “quả thật” để phản ánh sắc thái nhấn mạnh của cấu trúc Hê-bơ-rơ, và thay “đem nó đến” bằng “đem nó ra” để diễn đạt tự nhiên hơn mà không thêm một nơi chốn không có trong bản gốc. Chú thích được điều chỉnh để duy trì phương án dịch không xác định tác nhân.
