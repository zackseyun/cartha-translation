  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: vi
  text: Nhưng nếu con vật quả thật bị thú dữ xé[a], người giữ phải đem nó ra làm bằng chứng; người ấy không phải bồi thường con vật đã bị xé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Nhưng nếu con vật quả thật bị xé nát, người giữ phải đem con vật bị xé ra làm bằng chứng; người ấy không phải bồi thường.”'
    reason: Cụm Hê-bơ-rơ nhấn mạnh việc bị xé; động từ có thể hàm ý bị thú dữ xé, nhưng không nêu đích danh tác nhân.
lexical_decisions:
- source_word: אִם
  choice: Nhưng nếu
  rationale: Mở đầu trường hợp có điều kiện và tạo sự tương phản với trường hợp pháp lý ở câu trước.
- source_word: טָרֹף יִטָּרֵף
  choice: bị thú dữ xé
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn nhấn mạnh việc bị xé. Trong ngữ cảnh luật về gia súc được giao giữ, cách dịch này diễn đạt tự nhiên nguyên nhân do thú săn mồi, nhưng vẫn ghi nhận cách hiểu ít minh thị hơn trong chú thích.
- source_word: יְבִאֵהוּ
  choice: người giữ phải đem nó đến
  rationale: Thể Hiphil của בוא có nghĩa là đem hoặc đưa đến. Đại từ số ít giống đực chỉ con vật hay phần xác còn lại; chủ thể được làm rõ từ ngữ cảnh của điều luật.
- source_word: עֵד
  choice: làm bằng chứng
  rationale: Nghĩa đen là nhân chứng hoặc lời chứng, nhưng ở đây xác con vật được đưa đến để chứng minh sự việc, nên 'bằng chứng' là cách diễn đạt pháp lý tự nhiên.
- source_word: הַטְּרֵפָה
  choice: con vật đã bị xé
  rationale: Danh từ chỉ vật bị xé, trong ngữ cảnh là con vật được giao giữ; cách dịch này rõ nghĩa mà không nhất thiết xác định đó là toàn bộ xác hay phần còn lại.
- source_word: לֹא יְשַׁלֵּם
  choice: không phải bồi thường
  rationale: Piel שלם trong luật giao ước chỉ việc đền bù thiệt hại; 'bồi thường' vừa tự nhiên vừa giữ sắc thái pháp lý.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “người giữ” để làm rõ chủ thể đã nêu trong ngữ cảnh trước, “bồi thường” thay cho lối nói cổ, và giữ câu gọn, dễ hiểu.
