  text: כִּ֣י הִ֤וא כסות/ה לְ/בַדָּ֔/הּ הִ֥וא שִׂמְלָת֖/וֹ לְ/עֹר֑/וֹ בַּ/מֶּ֣ה יִשְׁכָּ֔ב וְ/הָיָה֙ כִּֽי יִצְעַ֣ק אֵלַ֔/י וְ/שָׁמַעְתִּ֖י כִּֽי חַנּ֥וּן אָֽנִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: vi
  text: Vì đó là vật che thân duy nhất của người ấy, là áo choàng phủ da thịt người ấy. Người ấy sẽ lấy gì mà nằm ngủ? Nếu người ấy kêu cầu Ta, Ta sẽ nghe, vì Ta hay thương xót.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đầy ân huệ” hoặc “nhân từ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Dẫn vào lý do cho mệnh lệnh ở câu trước, phù hợp với chức năng giải thích của liên từ.
- source_word: כְּסוּתֹה לְבַדָּהּ
  choice: vật che thân duy nhất của người ấy
  rationale: Diễn đạt cả ý vật che phủ và ý người nghèo không có vật che thân nào khác; hậu tố giống cái trong văn bản quy chiếu về danh từ כְּסוּת.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: áo choàng phủ da thịt người ấy
  rationale: שִׂמְלָה là áo khoác hay áo choàng có thể dùng để đắp ban đêm; 'da thịt' giữ hình ảnh cụ thể của עוֹר mà vẫn tự nhiên trong tiếng Việt.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: Người ấy sẽ lấy gì mà nằm ngủ?
  rationale: Giữ câu hỏi tu từ và nghĩa phương tiện của בַּמֶּה, đồng thời diễn đạt tự nhiên chức năng làm đồ đắp khi ngủ.
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: Nếu người ấy kêu cầu Ta
  rationale: Cấu trúc mở đầu một tình huống có thể xảy ra; 'kêu cầu' thể hiện lời kêu cứu hướng đến Đức Chúa Trời.
- source_word: וְשָׁמַעְתִּי
  choice: Ta sẽ nghe
  rationale: Giữ nghĩa trực tiếp của שׁמע và hàm ý Đức Chúa Trời đáp lại tiếng kêu của người yếu thế.
- source_word: חַנּוּן
  choice: hay thương xót
  rationale: Diễn tả phẩm tính bền vững của Đức Chúa Trời là đoái thương và ban ơn cho người khốn khó; cách nói này tự nhiên trong lời tự mô tả trang trọng.
theological_decisions:
- issue: Cách dịch lời Đức Chúa Trời tự mô tả bằng חַנּוּן
  choice: hay thương xót
  alternative: đầy ân huệ; nhân từ
  rationale: Trong ngữ cảnh luật bảo vệ người nghèo, 'hay thương xót' làm rõ việc Đức Chúa Trời đoái đến nỗi khốn khó mà không thu hẹp từ này vào một hệ thống thần học; các nghĩa 'đầy ân huệ' và 'nhân từ' vẫn là những khả năng từ vựng chân thực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để tránh mặc định giới tính quá mức, nhưng vẫn giữ ngôi thứ ba số ít của nguyên văn; viết hoa “Ta” để thể hiện lời Đức Chúa Trời phán. Câu hỏi tu từ được giữ nguyên.
