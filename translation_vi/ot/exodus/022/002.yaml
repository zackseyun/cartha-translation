source:
  edition: WLC
  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: vi
  text: Nhưng nếu mặt trời đã mọc trên kẻ ấy[a], thì người giết phải chịu tội vì đã làm đổ máu[b]. Kẻ trộm phải bồi thường đầy đủ; nếu không có gì để bồi thường, thì phải bị bán vì vụ trộm của mình[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể diễn ý: “nếu việc ấy xảy ra sau khi mặt trời mọc” hoặc “nếu việc ấy xảy ra ban ngày”. Nguyên văn là “nếu mặt trời đã mọc trên kẻ ấy”.'
    reason: lexical_alternative
  - marker: b
    text: Tức là trong trường hợp này, người đánh chết kẻ trộm phải chịu trách nhiệm về mạng người đã chết.
    reason: alternative_reading
  - marker: c
    text: Đây là biện pháp xử lý khoản nợ do trộm cắp khi kẻ trộm không có khả năng bồi thường.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Nhưng nếu
  rationale: Trong tiếng Hê-bơ-rơ, אִם tự nó là điều kiện “nếu”, nhưng tại đây mở ra trường hợp tương phản với tình huống ban đêm ở câu trước; “nhưng nếu” diễn đạt rõ quan hệ ấy.
- source_word: זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: mặt trời đã mọc trên kẻ ấy
  rationale: Giữ hình ảnh cụ thể và cấu trúc khác thường của nguyên văn, thay vì diễn giải ngay thành “sau khi trời sáng”; “kẻ ấy” chỉ kẻ đột nhập trong ngữ cảnh.
- source_word: דָּמִים לוֹ
  choice: người giết mắc tội làm đổ máu
  rationale: דָּמִים trong ngữ cảnh luật pháp chỉ trách nhiệm về máu đã đổ. Cách dịch này tự nhiên hơn lối dịch từng chữ “có huyết tội cho người ấy” và làm rõ đại từ quy về người đánh chết kẻ trộm, như sự tương phản với câu trước đòi hỏi.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: phải bồi thường đầy đủ
  rationale: Động từ nguyên mẫu tuyệt đối đi cùng động từ hữu hạn nhấn mạnh nghĩa vụ bồi hoàn; “bồi thường đầy đủ” vừa chuyển tải sắc thái nhấn mạnh vừa phù hợp văn cảnh pháp lý.
- source_word: אִם אֵין לוֹ
  choice: nếu không có gì để bồi thường
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ nói rằng kẻ trộm không có tài sản hoặc phương tiện để hoàn trả.
- source_word: וְנִמְכַּר בִּגְנֵבָתוֹ
  choice: thì phải bị bán vì hành vi trộm cắp của mình
  rationale: Giữ thể bị động và hậu quả pháp lý của nguyên văn. “Vì hành vi trộm cắp” bảo toàn căn cứ của việc bán mà không thêm thời hạn hay hình thức phục dịch không được nêu trong câu.
theological_decisions:
- issue: Hệ quả pháp lý khi giết kẻ trộm sau lúc mặt trời mọc
  choice: Người giết mắc tội làm đổ máu trong trường hợp mặt trời đã mọc trên kẻ đột nhập.
  alternative: Có thể hiểu rộng hơn rằng trách nhiệm tùy thuộc việc mối đe dọa đã rõ hay chưa, chứ không chỉ tùy thời điểm mặt trời mọc.
  rationale: Bản chính giữ hình ảnh thời gian cụ thể của tiếng Hê-bơ-rơ và không biến nó thành một nguyên tắc đạo đức rộng hơn điều câu văn trực tiếp nói. Đồng thời, chủ thể của huyết tội được diễn đạt rõ theo mạch đối lập với câu trước.
- issue: Chủ thể của mệnh lệnh bồi thường
  choice: Kẻ trộm phải bồi thường, không phải người đã giết.
  alternative: Nếu tách câu khỏi văn mạch hoặc đọc chuỗi đại từ liên tục, người đọc có thể lầm tưởng người giết phải bồi thường.
  rationale: Phần tiếp theo nói kẻ không có gì sẽ bị bán “vì hành vi trộm cắp của mình”, xác nhận rằng nghĩa vụ bồi thường thuộc về kẻ trộm. Việc nêu “kẻ trộm” giúp tiếng Việt tránh đại từ mơ hồ ngoài ý muốn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dùng các cụm từ phổ thông “mắc tội làm đổ máu”, “bồi thường đầy đủ” và “phải bị bán”. Bản dịch giữ cách nói cụ thể “mặt trời đã mọc trên kẻ ấy” cùng chú thích diễn nghĩa, đồng thời làm rõ sự chuyển chủ thể từ người giết sang kẻ trộm để câu tiếng Việt dễ hiểu.
