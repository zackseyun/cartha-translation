  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ כֶּ֤סֶף אֽוֹ כֵלִים֙ לִ/שְׁמֹ֔ר וְ/גֻנַּ֖ב מִ/בֵּ֣ית הָ/אִ֑ישׁ אִם יִמָּצֵ֥א הַ/גַּנָּ֖ב יְשַׁלֵּ֥ם שְׁנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: vi
  text: Nếu một người giao tiền[a] hoặc đồ vật[b] cho người lân cận để giữ, mà số tiền hoặc đồ vật ấy bị lấy trộm khỏi nhà của người nhận giữ, thì nếu tìm được kẻ trộm, kẻ trộm phải hoàn trả gấp đôi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “bạc”; ở đây dùng theo nghĩa là tiền.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vật dụng” hoặc “tài sản”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “người ấy sẽ trả hai”; đây là cách nói chỉ việc hoàn trả gấp đôi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong luật theo tình huống, từ này mở đầu điều kiện giả định; “nếu” tự nhiên và chính xác trong tiếng Việt.
- source_word: יִתֵּן אִישׁ
  choice: một người giao
  rationale: “Một người” diễn đạt tự nhiên chủ thể đại diện trong quy định pháp luật, không thêm hàm ý loại trừ theo giới tính.
- source_word: אֶל רֵעֵהוּ
  choice: cho người lân cận
  rationale: Trong văn cảnh pháp luật cộng đồng, רֵעַ chỉ một người đồng cộng đồng hay người khác có quan hệ giao dịch; “người lân cận” giữ sắc thái gần với nguyên ngữ.
- source_word: כֶּסֶף
  choice: tiền
  rationale: Nghĩa đen là “bạc”, nhưng trong văn cảnh kinh tế-pháp lý từ này thường chỉ tiền.
- source_word: אוֹ כֵלִים
  choice: hoặc đồ vật
  rationale: כֵלִים là từ rộng, chỉ các vật dụng hay tài sản hữu hình; “đồ vật” rõ ràng và không thu hẹp nghĩa.
- source_word: לִשְׁמֹר
  choice: giữ
  rationale: Động từ nguyên mẫu nêu mục đích giao tài sản để bảo quản; “giữ” ngắn gọn và tự nhiên.
- source_word: וְגֻנַּב
  choice: rồi những thứ ấy bị lấy trộm
  rationale: Dạng bị động nói về tài sản đã giao. Đại từ số nhiều tiếng Việt làm rõ rằng cả tiền lẫn đồ vật đều nằm trong phạm vi điều luật.
- source_word: מִבֵּית הָאִישׁ
  choice: khỏi nhà người đó
  rationale: “Người đó” quy chiếu tự nhiên về người nhận giữ tài sản, tránh lặp lại “người” một cách nặng nề.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: nếu tìm được kẻ trộm
  rationale: Giữ nghĩa sát của dạng bị động “kẻ trộm được tìm thấy”, nhưng dùng cấu trúc vô nhân xưng tự nhiên trong tiếng Việt; không diễn giải mạnh thành “bắt được”.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: kẻ ấy phải bồi thường gấp đôi
  rationale: Chủ ngữ theo văn cảnh là kẻ trộm; “bồi thường gấp đôi” truyền đạt rõ nghĩa hoàn trả hai lần trong điều luật.
theological_decisions: []
translation_notes:
  register: 'Văn phong pháp luật trang trọng nhưng hiện đại, dùng cấu trúc điều kiện rõ ràng. Bản dịch ưu tiên tương đương tối ưu: giữ trình tự lập luận của tiếng Hê-bơ-rơ, đồng thời dùng đại từ và cách quy chiếu tự nhiên trong tiếng Việt.'
