translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. Dùng “bồi thường” thay cho cách nói chung chung “trả”; diễn giải mệnh đề cuối vừa đủ để câu tiếng Việt có nghĩa, đồng thời chú thích ghi nhận tính cô đọng và mơ hồ của nguyên văn.
