  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: vi
  text: Nếu chủ nó có mặt cùng nó, người mượn không phải bồi thường. Nếu nó là vật được thuê, thì nó đi kèm với tiền thuê của nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu Hê-bơ-rơ rất cô đọng. Có thể hiểu cụm “nếu nó là vật được thuê” là nói về con vật hoặc vật dụng được thuê; khi đó, mệnh đề cuối theo sát chữ là “nó đến với tiền thuê của nó.” Cũng có cách hiểu שָׂכִיר là “người làm thuê,” với mệnh đề cuối liên hệ đến tiền công của người ấy. Trong mạch văn về trách nhiệm đối với tài sản mượn, bản dịch chính theo cách hiểu là vật được thuê.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: chủ của nó
  rationale: בעל trong ngữ cảnh luật về tài sản chỉ người sở hữu; hậu tố quy chiếu về con vật hoặc tài sản đang được nói đến.
- source_word: עִמּוֹ
  choice: ở cùng nó
  rationale: Giữ sát cấu trúc Hê-bơ-rơ và diễn tả việc chủ sở hữu có mặt cùng tài sản được mượn.
- source_word: לֹא יְשַׁלֵּם
  choice: người mượn không phải bồi thường
  rationale: Piel שלם trong văn cảnh pháp lý có nghĩa bồi hoàn thiệt hại; thêm chủ thể 'người mượn' từ ngữ cảnh để câu tiếng Việt rõ và tự nhiên.
- source_word: שָׂכִיר
  choice: vật thuê
  rationale: Dù từ này thường có thể chỉ người làm thuê, mạch luật về trách nhiệm đối với tài sản khiến cách hiểu là con vật hoặc vật được thuê phù hợp hơn; chú thích bảo lưu cách hiểu kia.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: tiền thuê đã bao gồm rủi ro ấy
  rationale: Thành ngữ Hê-bơ-rơ rất cô đọng, theo nghĩa đen là 'nó đến trong/với tiền thuê của nó'; cách dịch này chuyển tải ý rằng tổn thất thuộc rủi ro đã được tính trong thỏa thuận thuê.
