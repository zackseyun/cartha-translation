  text: כָּל אַלְמָנָ֥ה וְ/יָת֖וֹם לֹ֥א תְעַנּֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/021.yaml
  text: You shall not afflict any widow or orphan[a][b].
translation:
  language: vi
  text: Các ngươi không được ngược đãi bất cứ góa phụ hay trẻ mồ côi nào.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trẻ mất cha” thay cho “trẻ mồ côi.”
    reason: lexical_alternative
  - marker: b
    text: Hay “ức hiếp” hoặc “hành hạ” thay cho “ngược đãi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: bất cứ ... nào
  rationale: Trong mệnh lệnh cấm với các danh từ số ít, כָּל mang nghĩa phân bố và bao quát; cấu trúc “bất cứ ... nào” tự nhiên trong tiếng Việt.
- source_word: אַלְמָנָה
  choice: góa phụ
  rationale: Đây là nghĩa thông thường của từ Hê-bơ-rơ và là cách diễn đạt rõ ràng, trang trọng trong tiếng Việt hiện đại.
- source_word: יָתוֹם
  choice: trẻ mồ côi
  rationale: Từ này chỉ trẻ mồ côi, trong bối cảnh pháp luật Hê-bơ-rơ thường có sắc thái là trẻ mất cha; “trẻ mồ côi” là cách dịch tự nhiên và rộng hơn, còn sắc thái “trẻ mất cha” được giữ trong chú thích.
- source_word: לֹא
  choice: không được
  rationale: Trong điều luật này, לֹא diễn đạt lệnh cấm; “không được” truyền đạt trực tiếp lực mệnh lệnh trong tiếng Việt.
- source_word: תְעַנּוּן
  choice: ngược đãi
  rationale: Dạng Piel của ענה ở đây chỉ việc khiến người khác chịu khổ hoặc đối xử hà khắc. “Ngược đãi” tự nhiên, nghiêm trọng và đủ rộng, không thu hẹp nghĩa vào áp bức kinh tế.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “các ngươi” phản ánh hình thái số nhiều của động từ Hê-bơ-rơ và giọng văn luật pháp; cụm “bất cứ ... nào” giữ sức bao quát của כָּל.
