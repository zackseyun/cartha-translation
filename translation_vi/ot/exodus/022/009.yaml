translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Cấu trúc liệt kê được giữ rõ ràng; các từ “giao cho”, “trông giữ” làm nổi bật bối cảnh ký thác mà không thêm thuật ngữ pháp lý chuyên môn. Câu kết bằng dấu phẩy vì nội dung điều luật tiếp tục sang câu kế tiếp.
