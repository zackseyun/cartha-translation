  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ חֲמ֨וֹר אוֹ שׁ֥וֹר אוֹ שֶׂ֛ה וְ/כָל בְּהֵמָ֖ה לִ/שְׁמֹ֑ר וּ/מֵ֛ת אוֹ נִשְׁבַּ֥ר אוֹ נִשְׁבָּ֖ה אֵ֥ין רֹאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: vi
  text: Nếu một người giao cho người lân cận của mình một con lừa, một con bò, một con chiên[a], hay bất cứ gia súc nào để trông giữ, rồi con vật ấy chết, bị thương[b], hoặc bị bắt đi, mà không ai nhìn thấy[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שֶׂה có thể chỉ một con chiên hoặc một con dê trong bầy.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “bị gãy.”'
    reason: lexical_alternative
  - marker: c
    text: Tức là không có người nào chứng kiến điều đã xảy ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Mở đầu một điều luật theo trường hợp; “nếu” diễn đạt tự nhiên điều kiện pháp lý trong tiếng Việt.
- source_word: יִתֵּן
  choice: giao cho
  rationale: נתן có nghĩa cơ bản là “đưa/cho”, nhưng trong ngữ cảnh này nói đến việc giao tài sản cho người khác trông giữ; “giao cho” vừa tự nhiên vừa thể hiện đúng quan hệ ký thác.
- source_word: אִישׁ
  choice: một người
  rationale: Trong công thức luật theo trường hợp, danh từ giống đực số ít có chức năng đại diện; “một người” là cách diễn đạt pháp lý tự nhiên, không thêm giới tính mà tiếng Việt không bắt buộc phải nêu.
- source_word: אֶל רֵעֵהוּ
  choice: cho người lân cận mình
  rationale: רֵעַ chỉ người đồng loại hoặc người có quan hệ xã hội gần; “người lân cận” giữ sắc thái Kinh Thánh trang trọng và không hàm ý thân thiết quá mức.
- source_word: חֲמוֹר
  choice: con lừa
  rationale: Tương đương hiện đại, rõ nghĩa của חמור.
- source_word: שׁוֹר
  choice: con bò
  rationale: שור có thể chỉ bò đực hoặc gia súc thuộc loài bò trong ngữ cảnh luật pháp; “con bò” tự nhiên hơn “bò kéo” và không thu hẹp quá mức.
- source_word: שֶׂה
  choice: con chiên
  rationale: שה chỉ một con thuộc bầy gia súc nhỏ, có thể là chiên hoặc dê. “Con chiên” là cách dịch chính tự nhiên; phạm vi rộng hơn được giữ trong chú thích.
- source_word: וְכָל בְּהֵמָה
  choice: hay bất cứ súc vật nào
  rationale: בהמה ở đây chỉ động vật nuôi được xem là tài sản; “súc vật” chính xác hơn từ rộng nghĩa “động vật” và phù hợp văn cảnh pháp luật.
- source_word: לִשְׁמֹר
  choice: để trông giữ
  rationale: Diễn tả mục đích giao con vật cho người khác chăm nom và bảo quản; “trông giữ” tự nhiên trong tiếng Việt.
- source_word: וּמֵת
  choice: rồi con vật ấy chết
  rationale: Nêu biến cố tiếp theo trong trường hợp pháp lý; thêm chủ thể “con vật ấy” để câu tiếng Việt rõ ràng.
- source_word: נִשְׁבַּר
  choice: bị thương
  rationale: Niphal của שבר theo nghĩa đen là “bị gãy/vỡ”; đối với con vật, “bị thương” là cách nói tự nhiên mà không khẳng định loại thương tích cụ thể. Nghĩa sát chữ được nêu ở chú thích.
- source_word: נִשְׁבָּה
  choice: bị bắt đi
  rationale: שבה diễn tả việc bị bắt hoặc bị mang đi, có thể do kẻ cướp hay lực lượng đột kích; “bị bắt đi” giữ nghĩa rộng hơn “bị trộm”.
- source_word: אֵין רֹאֶה
  choice: mà không ai nhìn thấy
  rationale: Giữ gần cấu trúc Hê-bơ-rơ và chỉ sự vắng mặt của người chứng kiến biến cố.
