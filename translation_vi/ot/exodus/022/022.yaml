language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: vi
  text: Nếu ngươi quả thật ngược đãi người ấy[a], và nếu người ấy tha thiết kêu cầu Ta, Ta chắc chắn sẽ nghe tiếng kêu của người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng đại từ giống đực số ít, nhưng ở đây đại từ ấy chỉ từng cá nhân trong số các góa phụ hoặc trẻ mồ côi được nhắc đến ở câu trước.
    reason: cultural_note
  - marker: b
    text: 'Trong tiếng Hê-bơ-rơ, cả ba động từ “ngược đãi”, “kêu cầu” và “nghe” đều được nhấn mạnh bằng cách đặt nguyên thể tuyệt đối bên cạnh động từ hữu hạn: quả thật ngược đãi, tha thiết kêu cầu, và chắc chắn nghe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Giữ nghĩa điều kiện trực tiếp của tiểu từ Hê-bơ-rơ trong lời luật.
- source_word: עַנֵּה תְעַנֶּה
  choice: quả thật ngược đãi
  rationale: “Ngược đãi” diễn đạt tự nhiên hành vi gây khổ sở hoặc áp bức người yếu thế; “quả thật” chuyển tải sắc thái nhấn mạnh của nguyên thể tuyệt đối đi cùng động từ hữu hạn.
- source_word: אֹתוֹ
  choice: người ấy
  rationale: Giữ số ít và ý quy chiếu đến từng cá nhân thuộc nhóm góa phụ hoặc trẻ mồ côi ở câu trước, đồng thời không gán giới tính mà tiếng Việt không buộc phải biểu thị.
- source_word: כִּי אִם
  choice: và nếu
  rationale: Nối bước phát triển tiếp theo của điều kiện, không hiểu theo nghĩa tương phản “nhưng”.
- source_word: צָעֹק יִצְעַק
  choice: người ấy kêu cầu
  rationale: “Kêu cầu” phù hợp với tiếng kêu hướng đến Đức Chúa Trời. Sắc thái nhấn mạnh của cấu trúc Hê-bơ-rơ được ghi rõ trong chú thích để câu tiếng Việt không trở nên nặng nề vì lặp nhiều phó từ.
- source_word: אֵלַי
  choice: Ta
  rationale: Trong cụm “kêu cầu Ta”, đại từ chỉ đích hướng được diễn đạt tự nhiên bằng bổ ngữ trực tiếp trong tiếng Việt.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: Ta chắc chắn sẽ nghe
  rationale: “Chắc chắn” chuyển tải sự nhấn mạnh và tính xác quyết của nguyên thể tuyệt đối đi với động từ hữu hạn.
- source_word: צַעֲקָתוֹ
  choice: tiếng kêu của người ấy
  rationale: Giữ mối liên hệ từ vựng với động từ צעק và đại từ số ít của nguyên bản.
theological_decisions:
- issue: Đại từ giống đực số ít chỉ người bị ngược đãi
  choice: người ấy / của người ấy
  alternative: người đó / tiếng kêu của người đó; nó / tiếng kêu của nó
  rationale: Các hậu tố Hê-bơ-rơ thuộc giống đực số ít nhưng được dùng theo nghĩa phân phối, chỉ bất cứ góa phụ hoặc trẻ mồ côi nào vừa được nhắc đến. “Người ấy” giữ số ít và phẩm giá của đối tượng mà không khiến độc giả Việt hiểu lầm rằng câu chỉ nói đến nam giới.
- issue: Mức độ nhấn mạnh trong ba cấu trúc động từ lặp
  choice: Diễn đạt rõ bằng “quả thật” và “chắc chắn”, đồng thời giải thích cả ba cấu trúc trong chú thích
  alternative: Lặp “quả thật/chắc chắn” ở cả ba động từ
  rationale: Nguyên bản nhấn mạnh cả việc ngược đãi, tiếng kêu cầu và sự nghe đáp của Đức Chúa Trời. Bản dịch bảo toàn hai điểm nhấn trực tiếp, còn chú thích làm rõ đầy đủ hình thức lặp, tránh một câu tiếng Việt gượng ép mà không xóa bỏ sức nặng thần học của lời cảnh báo.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng dễ hiểu. “Ngươi” giữ cách xưng hô số ít trực tiếp của nguyên bản; “Ta” biểu thị lời Đức Chúa Trời phán. “Ngược đãi” hiện đại và tự nhiên hơn “làm khốn khổ”, trong khi vẫn giữ sức nặng của ענה.
