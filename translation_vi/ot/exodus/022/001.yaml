  rationale: Sửa chú thích a để phản ánh chính xác phạm vi ngữ nghĩa của danh từ Hê-bơ-rơ, đồng thời điều chỉnh nhẹ “đến chết” thành “rồi chết” để giữ trình tự và mức độ hàm ý của nguyên văn. Các yếu tố pháp lý và quy chiếu của thành ngữ “máu” được giữ nguyên.
  reviewer_model: gpt-5.6-terra
