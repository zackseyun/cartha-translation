source:
  edition: WLC
  text: אִם בַּ/מַּחְתֶּ֛רֶת יִמָּצֵ֥א הַ/גַּנָּ֖ב וְ/הֻכָּ֣ה וָ/מֵ֑ת אֵ֥ין ל֖/וֹ דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: vi
  text: Nếu kẻ trộm bị bắt gặp đang đột nhập[a] và bị đánh rồi chết, thì người đánh kẻ ấy không mắc tội làm đổ máu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “bị bắt gặp trong lúc đột nhập.” Từ Hê-bơ-rơ chỉ một vụ hoặc hành vi đột nhập, có thể bằng cách đào hoặc phá qua tường hay lẻn vào kín đáo.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “không có máu cho người ấy,” một thành ngữ pháp lý có nghĩa là người đánh kẻ trộm không phải chịu trách nhiệm về máu đã đổ trong trường hợp này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: đang đột nhập
  rationale: Danh từ Hê-bơ-rơ chỉ hành vi phá hoặc đào lối để lẻn vào. Cách dịch này diễn đạt tự nhiên tình huống pháp lý mà không giới hạn phương thức vào một đường hầm cụ thể.
- source_word: יִמָּצֵא
  choice: bị bắt gặp
  rationale: Dạng Nifal mang nghĩa bị động trong mệnh đề điều kiện pháp lý. “Bị bắt gặp” tự nhiên hơn “được tìm thấy” và phù hợp với việc phát hiện tại trận.
- source_word: הַגַּנָּב
  choice: kẻ trộm
  rationale: Đây là nghĩa thông thường và trực tiếp của danh từ; ngữ cảnh đột nhập đã làm rõ loại hành vi trộm cắp.
- source_word: וְהֻכָּה
  choice: bị đánh
  rationale: Giữ thể bị động của động từ נכה và không hàm ý có nhiều cú đánh như một số cách diễn đạt khác.
- source_word: וָמֵת
  choice: đến chết
  rationale: Diễn đạt tự nhiên quan hệ kết quả giữa việc bị đánh và cái chết, trong khi không thêm ý định giết người.
- source_word: אֵין לוֹ דָּמִים
  choice: người đánh kẻ ấy không mắc tội làm đổ máu
  rationale: Thành ngữ pháp lý nói đến trách nhiệm về máu đã đổ. Cách dịch làm rõ đối tượng chịu trách nhiệm theo ngữ cảnh, nhưng vẫn giữ phạm trù “tội làm đổ máu” thay vì thay bằng thuật ngữ pháp luật hiện đại như “tội giết người”.
theological_decisions:
- issue: Phán quyết pháp lý khi kẻ trộm bị đánh chết trong lúc đột nhập
  choice: Diễn đạt rằng người đánh không mắc tội làm đổ máu trong trường hợp được nêu.
  alternative: Dịch là “không phạm tội giết người”.
  rationale: Nguyên văn đưa ra phán quyết về trách nhiệm đối với máu đã đổ trong hoàn cảnh cụ thể, chứ không nêu một sự chuẩn thuận đạo đức rộng hơn hay dùng phạm trù hình sự hiện đại.
- issue: Quy chiếu của đại từ trong אֵין לוֹ דָּמִים
  choice: Hiểu là người đã đánh kẻ trộm không mang huyết tội.
  alternative: Giữ nguyên lối nói sát chữ “không có máu cho người ấy”, để quy chiếu hoàn toàn hàm ẩn.
  rationale: Cấu trúc Hê-bơ-rơ súc tích, nhưng hiệu lực pháp lý trong ngữ cảnh là miễn trách nhiệm về máu cho người đánh. Bản dịch làm rõ điều này, còn chú thích ghi nhận hình thức nguyên văn.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. “Kẻ trộm,” “đột nhập” và “mắc tội làm đổ máu” giữ được tính trực tiếp của nguyên văn mà không áp đặt thuật ngữ hình sự hiện đại hoặc một kết luận giáo phái.
