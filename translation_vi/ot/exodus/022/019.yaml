  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: vi
  text: Ai dâng sinh tế cho bất cứ thần nào, trừ khi dâng cho một mình Yahweh, thì phải bị biệt hiến để hủy diệt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phải bị đặt dưới lệnh tru diệt” hoặc “phải bị tiêu diệt hoàn toàn.” Động từ Hê-bơ-rơ diễn tả việc bị biệt hiến một cách không thể thu hồi để hủy diệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Ai dâng sinh tế
  rationale: Phân từ Qal được dùng như danh từ chỉ người thực hiện hành động. “Dâng sinh tế” giữ rõ nghĩa nghi lễ hiến tế bằng cách giết lễ vật, đồng thời tự nhiên trong tiếng Việt.
- source_word: לָאֱלֹהִים
  choice: cho bất cứ thần nào
  rationale: אֱלֹהִים có hình thức số nhiều, nhưng trong lệnh cấm này mang nghĩa khái quát về bất cứ thần nào ngoài Yahweh. Cách dịch này thể hiện tự nhiên sắc thái phân phối mà không mặc nhiên hợp thức hóa nhiều thần.
- source_word: יָחֳרָם
  choice: phải bị biệt hiến để hủy diệt
  rationale: Dạng Hophil của חרם nói đến việc bị đặt dưới lệnh cấm, được dành riêng một cách không thể thu hồi để hủy diệt. “Bị biệt hiến để hủy diệt” giữ cả sắc thái hiến định và hình phạt.
- source_word: בִּלְתִּי
  choice: ngoài
  rationale: Từ này mở đầu mệnh đề ngoại lệ; “ngoài” là cách diễn đạt tiếng Việt gọn và rõ trong cấu trúc này.
- source_word: לַיהוָה
  choice: cho ... Yahweh
  rationale: Giữ giới từ gắn với hành động dâng sinh tế và phiên âm trực tiếp danh giao ước יהוה là “Yahweh”.
- source_word: לְבַדּוֹ
  choice: một mình
  rationale: 'Diễn đạt tính độc quyền: chỉ Yahweh mới là đối tượng được phép nhận sinh tế.'
theological_decisions:
- issue: Cách dịch thuật ngữ hình phạt חרם trong luật cấm dâng sinh tế cho thần khác
  choice: phải bị biệt hiến để hủy diệt
  alternative: phải bị tiêu diệt hoàn toàn; phải bị đặt dưới lệnh tru diệt
  rationale: Nguyên ngữ không chỉ nói đến việc xử tử, mà còn gợi khái niệm đặt một người dưới חרם—dành riêng không thể thu hồi cho sự hủy diệt. Bản dịch giữ sức nặng thần học-pháp lý ấy, còn chú thích nêu các cách hiểu tự nhiên hơn.
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Câu dùng trực tiếp danh giao ước יהוה; “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
translation_notes:
  register: Văn phong luật pháp trang nghiêm nhưng hiện đại. “Sinh tế” giúp phân biệt hành vi hiến tế bằng lễ vật bị giết với nghĩa rộng của “dâng”; “biệt hiến để hủy diệt” cố ý giữ sự căng thẳng giữa việc dành riêng và hình phạt trong nguyên ngữ.
