source:
  edition: WLC
  text: וְ/כִֽי יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא אֹרָ֖שָׂה וְ/שָׁכַ֣ב עִמָּ֑/הּ מָהֹ֛ר יִמְהָרֶ֥/נָּה לּ֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: vi
  text: Nếu một người đàn ông dụ dỗ một trinh nữ chưa đính hôn và ăn nằm với nàng, người ấy nhất định phải nộp sính lễ[a] để cưới nàng làm vợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sính lễ” ở đây là khoản nộp gắn với việc kết hôn, thường do người nam hoặc gia đình người nam trao; không phải “của hồi môn” do phía cô dâu mang theo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: dụ dỗ
  rationale: Động từ פתה ở thể Piel trong ngữ cảnh này chỉ sự thuyết phục hoặc quyến dụ về tình dục; “dụ dỗ” không hàm ý cưỡng ép, điều mà câu Hê-bơ-rơ không nói rõ.
- source_word: אִישׁ
  choice: một người đàn ông
  rationale: Danh từ giống đực số ít chỉ một người nam; cách dịch này phản ánh chính xác chủ thể của điều luật.
- source_word: בְּתוּלָה
  choice: một trinh nữ
  rationale: Trong ngữ cảnh pháp lý và hôn nhân này, בְּתוּלָה nói đến người nữ còn trinh, là tình trạng có liên quan trực tiếp đến điều luật.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: chưa đính hôn
  rationale: Cụm từ chỉ người nữ chưa được chính thức hứa gả; “đính hôn” là cách nói hiện đại, rõ nghĩa và phù hợp với sắc thái pháp lý-hôn nhân.
- source_word: וְשָׁכַב עִמָּהּ
  choice: và ăn nằm với nàng
  rationale: שׁכב עם là thành ngữ chỉ quan hệ tình dục; “ăn nằm với” vừa trang trọng, tự nhiên, vừa giữ được lối diễn đạt uyển ngữ của nguyên văn.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: nhất định phải nộp sính lễ
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ chia nhấn mạnh nghĩa vụ. מהר ở đây nói đến khoản mohar do phía người nam nộp liên quan đến hôn nhân; “sính lễ” chính xác hơn “của hồi môn” trong tiếng Việt.
- source_word: לּוֹ לְאִשָּׁה
  choice: để cưới nàng làm vợ
  rationale: Cụm từ diễn tả kết quả hôn nhân theo pháp lý; cách dịch này tự nhiên trong tiếng Việt và không thêm điều kiện ngoài nguyên văn.
theological_decisions:
- issue: Tính chất của hành vi tình dục được mô tả bằng פתה
  choice: Dịch là “dụ dỗ”, không diễn giải thành cưỡng hiếp
  alternative: Cưỡng hiếp hoặc làm nhục
  rationale: Nghĩa thông thường của פתה ở thể Piel là dụ dỗ hoặc thuyết phục. Bản dịch không nhập ý cưỡng ép vốn không được nêu trong câu này, đồng thời vẫn không gọi hành vi là hoàn toàn tự nguyện hay vô hại.
- issue: Bản chất của מֹהַר
  choice: sính lễ
  alternative: của hồi môn
  rationale: Khoản này gắn với phía người nam và việc kết hôn, không phải tài sản người nữ mang về nhà chồng theo nghĩa thường gặp của “của hồi môn”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” để tránh lặp “trinh nữ” và giữ sắc thái dignified; “ăn nằm với” bảo tồn uyển ngữ của tiếng Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau mệnh đề có thuật ngữ cần giải thích.
