source:
  edition: WLC
  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: vi
  text: Nếu không tìm thấy kẻ trộm, người chủ nhà phải đến trước Đức Chúa Trời[a] để xác định rằng người ấy không hề đụng đến tài sản của người lân cận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các thẩm phán”. Tiếng Hê-bơ-rơ đọc là “Đức Chúa Trời”, nhưng trong một số bối cảnh pháp lý, từ này có thể chỉ các thẩm phán xét xử dưới thẩm quyền của Ngài.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: tìm thấy kẻ trộm
  rationale: Dạng Niphal của מצא mang nghĩa bị động trong bối cảnh pháp lý. “Tìm thấy” giữ được tính rộng, không buộc phải hiểu là đã nhận diện hay đã bắt được.
- source_word: וְנִקְרַב
  choice: phải đến trước
  rationale: קרב ở dạng Niphal có thể là “đến gần” hoặc “được đưa đến gần”. Trong thủ tục pháp lý, “đến trước” là cách diễn đạt tự nhiên, đồng thời không xác định quá mức ai là người đưa chủ nhà đến.
- source_word: בַּעַל הַבַּיִת
  choice: chủ nhà
  rationale: Cụm này chỉ người sở hữu hoặc chịu trách nhiệm về ngôi nhà. “Chủ nhà” ngắn gọn, tự nhiên và phù hợp ngữ cảnh pháp lý.
- source_word: אֶל הָאֱלֹהִים
  choice: đến trước Đức Chúa Trời
  rationale: Nghĩa trực tiếp của אֱלֹהִים là Đức Chúa Trời. Giới từ אֶל theo sau động từ “đến gần” được diễn đạt tự nhiên là “đến trước”. Khả năng từ này chỉ các thẩm phán trong bối cảnh pháp lý được giữ ở chú thích.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: để xác định xem mình có nhúng tay vào ... hay không
  rationale: Cụm Hê-bơ-rơ dùng hình ảnh đưa tay vào để nói đến việc chiếm dụng hoặc can thiệp trái phép. “Nhúng tay vào” giữ hình ảnh của nguyên văn và không thu hẹp nghĩa thành riêng hành vi trộm cắp.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: tài sản của người lân cận
  rationale: מְלָאכָה thường có nghĩa là công việc, nhưng trong ngữ cảnh tài vật được giao giữ, từ này chỉ những gì thuộc quyền sở hữu hoặc quản lý của người kia. “Tài sản” truyền đạt rõ nghĩa pháp lý; “người lân cận” giữ sắc thái quan hệ cộng đồng của רֵעַ.
theological_decisions:
- issue: Nghĩa của אֱלֹהִים trong bối cảnh xét xử
  choice: Đức Chúa Trời
  alternative: các thẩm phán
  rationale: Nguyên văn đọc trực tiếp là “Đức Chúa Trời”, nhưng אֱלֹהִים trong một số luật giao ước có thể được hiểu là các thẩm phán thi hành quyền xét xử dưới thẩm quyền thần thượng. Bản chính giữ nghĩa từ vựng trực tiếp, còn cách hiểu tư pháp được nêu trong chú thích để không âm thầm giải quyết điểm mơ hồ.
- issue: Chức năng của אִם לֹא trong thủ tục pháp lý
  choice: để xác định xem ... có ... hay không
  alternative: để thề rằng mình không nhúng tay vào tài sản ấy
  rationale: Cụm này có thể mở đầu nội dung cần được xác minh hoặc lời tuyên thệ phủ nhận hành vi sai trái. Bản dịch không thêm rõ một lời thề vì câu Hê-bơ-rơ không dùng từ “thề”, nhưng giữ sắc thái điều tra pháp lý.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Chủ nhà”, “tài sản” phù hợp ngữ cảnh pháp lý; “nhúng tay vào” giữ hình ảnh của nguyên văn mà vẫn tự nhiên. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
