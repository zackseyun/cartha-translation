    rationale: “Xem mình có nhúng tay ... hay không” có thể bao hàm cả khả năng đã nhúng tay, trong khi câu nguồn diễn đạt sự không tra tay vào tài sản. Bản sửa dùng “để xác định rằng người ấy không hề đụng đến” để giữ phủ định mà không thêm nội dung về lời thề.
  - severity: medium
    issue: “Nhúng tay vào tài sản” không tự nhiên và dễ đổi sắc thái thành sự dính líu chung.
    rationale: Thành ngữ tiếng Việt này thường không chỉ việc chiếm dụng/can thiệp vào một tài sản cụ thể. “Đụng đến tài sản” phù hợp hơn với nghĩa rộng của thành ngữ Hê-bơ-rơ.
