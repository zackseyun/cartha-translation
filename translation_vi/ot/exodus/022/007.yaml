review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng cấu trúc pháp lý cơ bản: không tìm được kẻ trộm thì người chủ nhà phải đến trước Đức Chúa Trời. Tuy nhiên, “có nhúng tay vào ... hay không” chuyển mệnh đề phủ định אִם לֹא שָׁלַח יָדוֹ thành một câu hỏi trung tính về việc có hay không có hành vi đó, trong khi nguyên văn nêu việc người chủ nhà không tra tay/không phạm đến tài sản. Cần giữ rõ phủ định, nhưng không khẳng định thêm một nghi thức thề nguyện.'
  naturalness: “Nhúng tay vào” trong tiếng Việt hiện đại thường nghĩa là can dự hoặc dính líu, không tự nhiên khi đi trực tiếp với “tài sản” để diễn đạt thành ngữ Hê-bơ-rơ “tra tay vào.” “Đụng đến tài sản” tự nhiên hơn trong văn cảnh pháp lý và vẫn không thu hẹp hành vi thành trộm cắp.
  terminology: “Đức Chúa Trời” và chú thích về “các thẩm phán” xử lý thích đáng tính mơ hồ của הָאֱלֹהִים. “Người chủ nhà” rõ hơn “chủ nhà,” vốn đôi khi gợi nghĩa chủ/host. “Tài sản của người lân cận” là lựa chọn có thể chấp nhận được cho בִּמְלֶאכֶת רֵעֵהוּ trong ngữ cảnh này.
  issues:
