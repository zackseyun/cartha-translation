base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: vi
  text: Các ngươi phải là những người thánh cho Ta.[a] Các ngươi không được ăn thịt bị xé ngoài đồng;[b] phải ném nó cho chó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “những người của sự thánh khiết.” Danh từ “người” trong tiếng Hê-bơ-rơ mang hình thức giống đực số nhiều và tại đây có thể đại diện cho cộng đồng giao ước.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “thịt bị thú vật xé ngoài đồng.” Tiếng Hê-bơ-rơ chỉ nói “thịt bị xé,” còn tác nhân được hàm ý chứ không được nêu rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: những người thánh
  rationale: Cụm danh từ liên kết có nghĩa sát là “những người của sự thánh khiết,” tức “những người thánh.” Cách dịch này giữ hình ảnh con người được biệt riêng cho Đức Chúa Trời mà không chuyển thành một khái niệm trừu tượng.
- source_word: תִּהְיוּן לִי
  choice: phải là ... thuộc về Ta
  rationale: Động từ “là/trở nên” đi với לִי diễn tả cả bổn phận giao ước lẫn mối quan hệ thuộc về Đức Chúa Trời. “Phải” truyền đạt lực quy định của văn mạch luật pháp, còn “thuộc về Ta” giữ sắc thái quan hệ.
- source_word: בָשָׂר
  choice: thịt
  rationale: Trong quy định về thức ăn, “thịt” là từ tiếng Việt tự nhiên và chính xác hơn “xác thịt,” đồng thời vẫn chỉ phần thịt của con vật.
- source_word: בַּשָּׂדֶה
  choice: ngoài đồng
  rationale: Cách diễn đạt không gian tự nhiên trong tiếng Việt, chỉ nơi trống trải bên ngoài khu dân cư.
- source_word: טְרֵפָה
  choice: bị xé
  rationale: Từ này chỉ thứ bị xé, thường là con mồi bị thú vật xé. Bản chính không thêm tác nhân vì tiếng Hê-bơ-rơ chỉ hàm ý chứ không nói rõ.
- source_word: לֹא תֹאכֵלוּ
  choice: không được ăn
  rationale: Đây là lệnh cấm trực tiếp; “không được” rõ ràng, hiện đại và phù hợp văn phong luật pháp.
- source_word: לַכֶּלֶב
  choice: cho chó
  rationale: Danh từ Hê-bơ-rơ ở số ít nhưng được dùng theo nghĩa giống loài. Tiếng Việt không bắt buộc đánh dấu số, nên “cho chó” giữ được tính khái quát tự nhiên.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: hãy quăng nó
  rationale: Động từ có nghĩa là ném hoặc quăng. “Quăng” diễn tả trực tiếp hành động vứt phần thịt ấy cho chó, trong ngôn ngữ hiện đại.
theological_decisions:
- issue: Ngôn ngữ về sự thánh khiết trong luật giao ước
  choice: “những người thánh thuộc về Ta”
  alternative: “dân thánh của Ta” hoặc “những người được biệt riêng cho Ta”
  rationale: Bản dịch giữ cả danh từ “thánh” và ý thuộc về Đức Chúa Trời. “Dân thánh” có thể diễn đạt ý tập thể nhưng làm mờ danh từ “những người” trong nguyên văn; “được biệt riêng” đúng một phần nhưng hẹp hơn nội hàm của קֹדֶשׁ.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Các ngươi” giữ lời xưng hô số nhiều trực tiếp của Đức Chúa Trời với dân giao ước; đại từ “Ta” được viết hoa theo quy ước tiếng Việt dành cho lời Đức Chúa Trời. Cấu trúc câu được làm tự nhiên, tránh từ cổ như “chớ” và “ném bỏ,” đồng thời không giải thích quá mức tác nhân của hành động “bị xé.”
