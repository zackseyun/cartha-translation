  to: Các ngươi phải là những người thánh cho Ta.[a] Các ngươi không được ăn thịt bị xé ngoài đồng;[b] phải ném nó cho chó.
  rationale: Điều chỉnh nhẹ để duy trì sắc thái quy phạm của cả ba mệnh đề và dùng từ trung tính hơn trong văn phong luật pháp. “Cho Ta” phản ánh trực tiếp hơn cụm לִי, không loại trừ ý nghĩa thuộc về Đức Chúa Trời. Các chú thích được giữ vì neo đúng vào cụm từ tương ứng và bảo tồn điều tiếng Hê-bơ-rơ để hàm ý thay vì nói rõ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:48:14Z'
