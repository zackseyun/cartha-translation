base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: vi
  text: Ngươi không được lăng mạ Đức Chúa Trời[a], cũng không được nguyền rủa người lãnh đạo trong dân ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các quan xét xử”; trong một số ngữ cảnh, אֱלֹהִים có thể chỉ những người có thẩm quyền xét xử, dù “Đức Chúa Trời” phù hợp hơn với phép song hành ở đây.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ này có thể chỉ Đức Chúa Trời, các thần hoặc trong một số ngữ cảnh là những người xét xử. Ở đây, cách hiểu số ít “Đức Chúa Trời” phù hợp nhất với điều cấm tương ứng về việc nguyền rủa một người lãnh đạo; cách hiểu “những người xét xử” được giữ trong chú thích.
- source_word: תְקַלֵּל
  choice: xúc phạm
  rationale: Dạng Piel của קלל có thể diễn tả việc nguyền rủa, khinh thường hoặc nói lời lăng mạ. “Xúc phạm” tự nhiên trong tiếng Việt và giữ được sự phân biệt với động từ “nguyền rủa” ở vế sau.
- source_word: נָשִׂיא
  choice: người lãnh đạo
  rationale: נָשִׂיא chỉ người được nâng lên ở vị trí đứng đầu, như thủ lĩnh hoặc người cai trị. “Người lãnh đạo” là cách diễn đạt hiện đại, rõ nghĩa và không mang sắc thái quân chủ hẹp như “vương hầu”.
- source_word: בְעַמְּךָ
  choice: trong dân ngươi
  rationale: Giới từ בְּ ở đây chỉ vị trí hoặc tư cách ở giữa cộng đồng. “Trong dân ngươi” sát cấu trúc Hê-bơ-rơ và tự nhiên trong văn phong luật pháp trang trọng.
- source_word: תָאֹר
  choice: nguyền rủa
  rationale: Động từ ארר là từ thông dụng chỉ hành vi nguyền rủa; “nguyền rủa” là tương đương rõ ràng và chính xác trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được chỉ bởi אֱלֹהִים
  choice: Đức Chúa Trời
  alternative: những người xét xử
  rationale: Ngữ cảnh luật pháp và phép song hành với “người lãnh đạo trong dân ngươi” ủng hộ việc hiểu אֱלֹהִים là Đức Chúa Trời, đối lập với nhà lãnh đạo con người. Tuy nhiên, vì từ này có thể chỉ những người thi hành quyền xét xử trong một số ngữ cảnh, cách hiểu đó được nêu trong chú thích để không xóa bỏ sự mơ hồ có thật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” duy trì sắc thái của lời luật truyền trực tiếp ở ngôi thứ hai số ít. Hai động từ “xúc phạm” và “nguyền rủa” được phân biệt để phản ánh hai động từ Hê-bơ-rơ khác nhau.
