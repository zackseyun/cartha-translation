  to: Ngươi không được lăng mạ Đức Chúa Trời[a], cũng không được nguyền rủa người lãnh đạo trong dân ngươi.
  rationale: Thay “xúc phạm” bằng “lăng mạ” để phản ánh chính xác hơn sắc thái khinh miệt bằng lời nói của תְקַלֵּל, đồng thời không đồng nhất nó với động từ “nguyền rủa” ở vế kế. Chú thích được chỉnh nhẹ cho tự nhiên, vẫn bảo tồn phương án diễn giải quan trọng về אֱלֹהִים.
