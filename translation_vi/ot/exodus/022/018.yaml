  yaml_path: translation/ot/exodus/022/018.yaml
  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: vi
  text: Bất cứ ai ăn nằm với một con vật thì chắc chắn phải bị xử tử.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát chữ hơn: “thì chắc chắn sẽ chết.” Công thức luật pháp trong tiếng Hê-bơ-rơ nói rõ cái chết chắc chắn như một hình phạt tư pháp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Bất cứ ai
  rationale: כָּל đi với phân từ tạo thành cách diễn đạt khái quát, chỉ bất kỳ người nào thực hiện hành vi được nói đến.
- source_word: שֹׁכֵב
  choice: ăn nằm
  rationale: Phân từ Qal của שׁכב đi với עִם là một cách nói giảm chỉ quan hệ tình dục. “Ăn nằm” là lối diễn đạt tự nhiên, trang trọng và giữ được sắc thái uyển ngữ của nguyên văn.
- source_word: עִם
  choice: với
  rationale: Giới từ nối động từ chỉ hành vi tình dục với đối tượng của hành vi.
- source_word: בְּהֵמָה
  choice: một con vật
  rationale: בְּהֵמָה ở đây chỉ động vật nói chung; “một con vật” rõ nghĩa trong tiếng Việt hiện đại và không thu hẹp vô căn cứ thành gia súc.
- source_word: מוֹת יוּמָת
  choice: thì chắc chắn phải bị xử tử
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ thể bị động nhấn mạnh tính chắc chắn của án tử hình. Cách dịch này thể hiện cả sự nhấn mạnh lẫn tính tư pháp của công thức luật pháp.
theological_decisions:
- issue: Cách dịch công thức pháp lý về án tử hình
  choice: thì chắc chắn phải bị xử tử
  alternative: thì chắc chắn sẽ chết
  rationale: Cấu trúc Hê-bơ-rơ là công thức luật pháp diễn tả hình phạt tử hình chắc chắn. Bản dịch chính làm rõ sắc thái bị động và tư pháp, còn chú thích bảo lưu cách dịch sát chữ hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. “Ăn nằm” giữ lối nói uyển chuyển của nguyên văn; “bị xử tử” làm rõ ngữ cảnh pháp lý mà không thêm một phương thức hành hình.
