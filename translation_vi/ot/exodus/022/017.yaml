review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng phủ định pháp lý và ý nghĩa của động từ Piel «không để/không giữ cho sống». Tuy nhiên, «một nữ phù thủy» hơi gượng và có thể khiến «phù thủy» bị hiểu như vốn đã chỉ nữ giới; cách diễn đạt bằng «một người phụ nữ làm phù phép» thể hiện trực tiếp, tự nhiên hơn nét giống cái số ít của danh từ Hê-bơ-rơ.
  naturalness: «Ngươi không được để một người phụ nữ làm phù phép sống» là văn phong luật pháp trang trọng, rõ nghĩa trong tiếng Việt hiện đại, đồng thời không diễn giải thành phương thức hay công thức hành hình cụ thể.
  terminology: «Làm phù phép» diễn đạt hoạt động được danh từ מְכַשֵּׁפָה chỉ đến mà không thêm sắc thái «tà» hoặc một cơ chế phép thuật cụ thể. Chú thích nên nêu «nữ phù thủy» như một phương án thay thế, thay vì «mụ phù thủy», vì «mụ» thêm sắc thái miệt thị không có trong nguyên văn.
  issues:
  - severity: low
    issue: Cụm «một nữ phù thủy» chưa thật tự nhiên và có phần trùng lặp sắc thái giới tính trong cách dùng tiếng Việt.
    rationale: Nguyên văn đánh dấu giống cái; «một người phụ nữ làm phù phép» chuyển tải dấu hiệu này minh bạch hơn mà vẫn tự nhiên.
  - severity: medium
    issue: Chú thích dùng «mụ phù thủy» làm phương án thay thế.
    rationale: «Mụ» có sắc thái miệt thị/khẩu ngữ không được biểu thị bởi danh từ Hê-bơ-rơ, nên không thích hợp làm lựa chọn chú giải trung tính.
