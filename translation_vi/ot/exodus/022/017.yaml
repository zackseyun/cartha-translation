- from: Ngươi không được để một nữ phù thủy sống.[a]
  to: Ngươi không được để một người phụ nữ làm phù phép sống.[a]
  rationale: Sửa cách gọi người thực hành phép thuật để tiếng Việt tự nhiên hơn và giữ rõ giới tính nữ của danh từ nguồn. Thay chú thích có sắc thái miệt thị bằng phương án trung tính. Giữ nguyên cấu trúc «không được để ... sống», không mở rộng thành «phải xử tử».
