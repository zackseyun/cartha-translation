translation:
  language: vi
  text: Ngươi không được để một người phụ nữ làm phù phép sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một nữ phù thủy.” Danh từ Hê-bơ-rơ là giống cái số ít, chỉ một người phụ nữ thực hành phép thuật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: một nữ phù thủy
  rationale: Danh từ Hê-bơ-rơ ở giống cái số ít, chỉ một người nữ thực hành phép thuật. “Nữ phù thủy” giữ rõ dấu hiệu giới tính của nguyên văn và dễ hiểu trong tiếng Việt hiện đại.
- source_word: לֹא
  choice: không được
  rationale: Tiểu từ phủ định đứng trong một điều luật; “không được” diễn đạt tự nhiên sức mạnh cấm đoán trong tiếng Việt.
- source_word: תְחַיֶּה
  choice: để ... sống
  rationale: 'Dạng Piel chưa hoàn thành, ngôi hai giống đực số ít của חיה tại đây có nghĩa khiến hoặc duy trì sự sống: “để sống/giữ cho sống.” Cách dịch này giữ nguyên lối diễn đạt của tiếng Hê-bơ-rơ, không mở rộng thành một công thức xử tử rõ hơn nguyên văn.'
theological_decisions:
- issue: Giới tính cụ thể của người phạm tội
  choice: 'Dịch ở giống cái số ít: “một nữ phù thủy.”'
  alternative: Dịch chung là “phù thủy” hoặc “người làm phép thuật.”
  rationale: Hình thái danh từ Hê-bơ-rơ được đánh dấu rõ là giống cái số ít; bản dịch giữ chi tiết này thay vì trung hòa giới tính.
- issue: Sức mạnh của lệnh cấm pháp lý
  choice: “không được để ... sống”
  alternative: “phải xử tử”
  rationale: Trong bối cảnh luật giao ước, câu này có hệ quả là án tử hình, nhưng nguyên văn nói theo nghĩa đen là không để hoặc không giữ cho sống. Bản dịch không thêm cách thức thi hành mà câu Hê-bơ-rơ không nêu.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng dễ hiểu. “Ngươi” giữ cách xưng hô số ít trực tiếp thường dùng trong các điều luật giao ước; người nghe số ít có chức năng đại diện cho cộng đồng. Tránh “tà thuật” vì từ đó thêm một sắc thái đánh giá không được biểu thị trực tiếp trong danh từ.
