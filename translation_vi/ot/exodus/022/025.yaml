  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Dùng “con” theo lối xưng hô trực tiếp trong luật giao ước; “vật cầm cố” là thuật ngữ pháp lý phổ thông, rõ hơn “vật thế chấp” trong trường hợp giữ một món đồ cụ thể.
