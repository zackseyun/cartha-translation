  yaml_path: translation/ot/exodus/022/025.yaml
  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: vi
  text: Nếu ngươi lấy áo choàng của người lân cận làm vật cầm cố, ngươi phải trả lại cho người ấy chậm nhất lúc mặt trời lặn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cho đến khi mặt trời đến”; đây là một thành ngữ chỉ lúc mặt trời lặn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Giữ trực tiếp hình thức điều kiện của luật tình huống; “Khi” cũng có thể hiểu được nhưng làm sắc thái điều kiện kém rõ hơn.
- source_word: חָבֹל תַּחְבֹּל
  choice: lấy ... làm vật cầm cố
  rationale: Diễn đạt tự nhiên hành vi pháp lý được nhấn mạnh bằng cấu trúc nguyên mẫu tuyệt đối đi với động từ; không lặp động từ một cách gượng gạo trong tiếng Việt.
- source_word: שַׂלְמַת
  choice: áo choàng
  rationale: Chỉ loại áo khoác ngoài có thể dùng để che thân ban đêm; cụ thể hơn từ “áo” hay “y phục” nói chung.
- source_word: רֵעֶךָ
  choice: của người lân cận
  rationale: Phù hợp ngữ cảnh luật xã hội và giữ ý về người sống trong quan hệ cộng đồng với người nghe.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: trước khi mặt trời lặn
  rationale: Chuyển thành ngữ Hê-bơ-rơ, sát nghĩa đen là “cho đến lúc mặt trời đến,” sang cách nói thời gian tự nhiên trong tiếng Việt.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: con phải trả lại cho người ấy
  rationale: Thể hiện nghĩa khiến vật trở về/chủ động hoàn trả và lực bắt buộc của quy định pháp luật.
