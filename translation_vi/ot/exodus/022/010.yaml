  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: vi
  text: Giữa hai người phải có một lời thề nhân danh Đức Giê-hô-va[a], rằng người giữ đồ đã không tra tay vào tài sản của người lân cận. Chủ tài sản phải chấp nhận lời thề ấy[b], và người giữ đồ không phải bồi thường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một lời thề của Đức Giê-hô-va”, tức là lời thề viện đến danh Ngài.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Chủ tài sản phải nhận lấy điều ấy”; trong văn cảnh, nghĩa là chấp nhận lời thề ấy là đủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: một lời thề nhân danh Đức Giê-hô-va
  rationale: Cụm sở thuộc có nghĩa đen là “lời thề của YHWH”, nhưng trong bối cảnh pháp lý chỉ lời thề viện đến danh Đức Chúa Trời. Cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ quan hệ trực tiếp với danh riêng YHWH.
- source_word: בֵּין שְׁנֵיהֶם
  choice: giữa hai người
  rationale: Giữ rõ hai bên trong vụ tranh chấp pháp lý.
- source_word: אִם לֹא
  choice: rằng ... không hề
  rationale: Trong công thức tuyên thệ, cụm này dẫn nội dung lời thề chứ không đơn thuần nêu một điều kiện.
- source_word: שָׁלַח יָדוֹ
  choice: tra tay vào
  rationale: Giữ hình ảnh của thành ngữ Hê-bơ-rơ, hàm ý chiếm dụng, lấy cắp hoặc can thiệp trái phép.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: tài sản của người lân cận
  rationale: Trong văn cảnh đồ vật hoặc súc vật được giao giữ, מְלָאכָה chỉ tài sản thuộc về người kia, không phải “công việc” theo nghĩa trừu tượng.
- source_word: וְלָקַח בְּעָלָיו
  choice: Chủ tài sản phải chấp nhận lời thề ấy
  rationale: 'Động từ “nhận/lấy” ở đây được hiểu theo tác dụng pháp lý: chủ sở hữu chấp nhận lời thề là đủ; đối tượng ngầm được nói rõ để câu tiếng Việt sáng nghĩa.'
- source_word: יְשַׁלֵּם
  choice: bồi thường
  rationale: Dạng Piel của שׁלם trong luật giao ước chỉ việc hoàn trả hoặc đền bù thiệt hại.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Dùng dạng danh riêng quen thuộc, trang trọng và dễ nhận biết trong tiếng Việt, thay vì thay danh bằng một tước hiệu; chú thích ghi nhận nghĩa đen của cấu trúc Hê-bơ-rơ mà không áp đặt cách hiểu thần học riêng.
- issue: Ai là chủ thể không phải bồi thường
  choice: người giữ đồ
  alternative: đại từ “người ấy” hoặc “người đó”
  rationale: Chủ ngữ Hê-bơ-rơ được lược bỏ và theo mạch luật là người nhận giữ tài sản. Nêu lại vai trò giúp tiếng Việt tránh nhầm rằng chủ tài sản là người không phải bồi thường.
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. “Người giữ đồ” và “chủ tài sản” được dùng để phân biệt rõ hai bên theo văn cảnh của điều luật; “tra tay vào” bảo tồn thành ngữ nguồn và vẫn dễ hiểu trong tiếng Việt.
