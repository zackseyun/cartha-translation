revisions:
- from: Giữa hai người phải có một lời thề nhân danh Đức Giê-hô-va[a], rằng người giữ đồ không hề tra tay vào tài sản của người lân cận. Chủ tài sản phải chấp nhận lời thề ấy[b], và người giữ đồ không phải bồi thường.
  to: Giữa hai người phải có một lời thề nhân danh Đức Giê-hô-va[a], rằng người giữ đồ đã không tra tay vào tài sản của người lân cận. Chủ tài sản phải chấp nhận lời thề ấy[b], và người giữ đồ không phải bồi thường.
  rationale: Chỉ bỏ «hề», vốn là yếu tố nhấn mạnh không có trong công thức thề tiếng Hê-bơ-rơ. Giữ nguyên các lựa chọn khác vì chúng truyền đạt đúng quan hệ pháp lý, các chủ thể hàm ẩn theo ngữ cảnh, thành ngữ «tra tay vào», và nghĩa bồi thường của động từ cuối câu. Các ký hiệu chú thích vẫn được neo đúng sau «Đức Giê-hô-va» và «lời thề ấy».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:17:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nắm đúng cấu trúc pháp lý của câu: lời thề thuộc về/viện đến danh יהוה được đặt giữa hai bên; nội dung là người nhận giữ đã không «tra tay» vào tài sản của người kia; chủ sở hữu chấp nhận lời thề, và người nhận giữ không phải bồi thường. Tuy nhiên, «không hề» thêm sắc thái nhấn mạnh không được biểu thị rõ trong công thức thề אִם־לֹא.'
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng và phù hợp văn cảnh luật lệ. «Tra tay vào» là thành ngữ pháp lý-văn chương có thể giữ được hình ảnh tiếng Hê-bơ-rơ; chú thích hoặc ngữ cảnh đủ cho thấy đây không chỉ là chạm tay theo nghĩa đen.
  terminology: «Đức Giê-hô-va» là cách chuyển danh יהוה đã được dùng nhất quán trong bản thảo và là cách gọi quen thuộc trong tiếng Việt. «Người giữ đồ» và «chủ tài sản» làm sáng rõ các chủ thể được hiểu từ ngữ cảnh trước đó, không thay đổi nghĩa của câu. «Bồi thường» chuyển đạt phù hợp יְשַׁלֵּם trong ngữ cảnh luật pháp.
