  edition: WLC
  text: וְ/חָרָ֣ה אַפִּ֔/י וְ/הָרַגְתִּ֥י אֶתְ/כֶ֖ם בֶּ/חָ֑רֶב וְ/הָי֤וּ נְשֵׁי/כֶם֙ אַלְמָנ֔וֹת וּ/בְנֵי/כֶ֖ם יְתֹמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: vi
  text: thì cơn giận của Ta sẽ bừng cháy, Ta sẽ dùng gươm giết các ngươi; vợ các ngươi sẽ trở thành góa phụ, còn con trai các ngươi sẽ mồ côi cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mồ côi”; từ Hê-bơ-rơ ở đây thường chỉ người mất cha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: cơn giận của Ta sẽ bừng cháy
  rationale: Đây là thành ngữ Hê-bơ-rơ, theo nghĩa đen liên quan đến việc “mũi nóng lên”, dùng để diễn tả cơn giận bùng phát. Cách dịch này truyền đạt đúng nghĩa và vẫn giữ hình ảnh lửa của nguyên văn.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: Ta sẽ ... giết các ngươi
  rationale: Động từ הרג có nghĩa thông thường là “giết”. Đại từ số nhiều được thể hiện bằng “các ngươi”, phù hợp với lời cảnh cáo trực tiếp trong ngữ cảnh luật giao ước.
- source_word: בֶּחָרֶב
  choice: dùng gươm
  rationale: Giới từ בְּ ở đây chỉ phương tiện; “dùng gươm” là cách diễn đạt tự nhiên trong tiếng Việt và giữ hình ảnh cụ thể của sự phán xét bằng bạo lực.
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: vợ các ngươi sẽ trở thành góa phụ
  rationale: היה trong ngữ cảnh này diễn tả tình trạng phát sinh do sự phán xét. נָשִׁים với hậu tố sở hữu trong quan hệ gia đình mang nghĩa “vợ”, còn אַלְמָנוֹת là “góa phụ”.
- source_word: וּבְנֵיכֶם יְתֹמִים
  choice: còn con trai các ngươi sẽ mồ côi cha
  rationale: בֵּן ở đây là “con trai”, nên không trung hòa thành “con cái”. יָתוֹם thường chỉ người mất cha trong bối cảnh dễ bị tổn thương về xã hội; “mồ côi cha” diễn đạt chính xác hậu quả từ cái chết của những người đàn ông vừa được nói đến.
theological_decisions:
- issue: Cách diễn đạt nhân hình về cơn giận của Đức Chúa Trời
  choice: cơn giận của Ta sẽ bừng cháy
  alternative: mũi Ta sẽ nóng lên; cơn thịnh nộ của Ta sẽ nổi lên
  rationale: Dịch sát bộ phận cơ thể sẽ khó hiểu trong tiếng Việt. Bản dịch nêu rõ ý nghĩa “cơn giận” nhưng giữ ẩn dụ nhiệt/lửa, không làm nhẹ đi sức nặng của lời phán xét.
- issue: Danh từ chỉ con thuộc giống đực
  choice: con trai các ngươi
  alternative: con cái các ngươi
  rationale: Nguyên văn dùng בְּנֵיכֶם, hình thái giống đực số nhiều. Ngữ cảnh cũng mô tả trực tiếp những người con trai mất cha do các người đàn ông bị giết, nên giữ nét nghĩa chỉ giới tính.
- issue: Phạm vi nghĩa của יָתוֹם
  choice: mồ côi cha
  alternative: mồ côi
  rationale: “Mồ côi cha” bảo tồn nét nghĩa xã hội cụ thể thường có của từ Hê-bơ-rơ và phù hợp với chuỗi hậu quả trong câu. Chú thích ghi nhận cách dịch rộng hơn mà không áp đặt rằng người mẹ cũng đã chết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Ta/các ngươi” duy trì giọng phán truyền của giao ước mà vẫn dễ hiểu; “gươm”, “góa phụ” và “mồ côi cha” là các từ thông dụng, chính xác. Dùng dấu chấm phẩy để làm rõ quan hệ giữa hành động phán xét và hậu quả đối với gia đình.
