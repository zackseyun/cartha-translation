translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại, dễ hiểu. Dùng “súc vật” thay vì từ cổ “thú vật”; “ăn phá” diễn tả thiệt hại do chăn thả mà vẫn giữ được sắc thái tiêu thụ của động từ Hê-bơ-rơ. Hai dấu chú thích [a], [b] đều được đặt trong chính văn.
