revisions:
- from: Nếu một người cho súc vật ăn phá một cánh đồng hay vườn nho[a], thả súc vật mình ra và nó ăn trong ruộng của người khác[b], thì người ấy phải bồi thường bằng phần tốt nhất trong ruộng mình và phần tốt nhất trong vườn nho mình.
  to: Nếu một người cho súc vật của mình ăn phá một cánh đồng hay vườn nho[a], thả nó ra và nó ăn trong ruộng của người khác[b], thì người ấy phải bồi thường bằng phần tốt nhất trong ruộng mình và phần tốt nhất trong vườn nho mình.
  rationale: Chỉnh sửa chỉ nhằm làm rõ ngay từ đầu rằng súc vật thuộc người gây thiệt hại, cải thiện độ tự nhiên của tiếng Việt, và làm cho hai chú thích diễn đạt chính xác hơn về ngữ cảnh và mức độ hàm ý của nguyên văn. Không thay đổi nghĩa, mức độ chắc chắn, hay sắc thái pháp lý của bản dịch.
