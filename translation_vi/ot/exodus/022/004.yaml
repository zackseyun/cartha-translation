base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: vi
  text: Nếu một người cho súc vật của mình ăn phá một cánh đồng hay vườn nho[a], thả nó ra và nó ăn trong ruộng của người khác[b], thì người ấy phải bồi thường bằng phần tốt nhất trong ruộng mình và phần tốt nhất trong vườn nho mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đốt một cánh đồng hay vườn nho.” Động từ Hê-bơ-rơ בער trong một số ngữ cảnh có thể chỉ việc đốt, nhưng việc thả súc vật được nói đến ngay sau đó ủng hộ mạnh mẽ nghĩa súc vật ăn cỏ hoặc ăn phá ở đây.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “ruộng khác”; ý “của người” được thêm vào để làm rõ ý nghĩa pháp lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Nếu
  rationale: Trong thể thức luật nêu tình huống, từ này mở đầu một trường hợp có điều kiện; “Nếu” là cách diễn đạt pháp lý tự nhiên trong tiếng Việt.
- source_word: יַבְעֶר
  choice: cho súc vật ăn phá
  rationale: Dạng Hiphil mang ý gây khiến; ngữ cảnh ngay sau đó nói đến việc thả súc vật, nên nghĩa ăn cỏ/ăn phá phù hợp hơn nghĩa đốt.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: một cánh đồng hay vườn nho
  rationale: Giữ các danh từ nông nghiệp ở số ít theo cách trình bày tình huống luật pháp của tiếng Hê-bơ-rơ.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: thả súc vật mình ra
  rationale: שִׁלַּח có nghĩa sai đi hoặc thả ra, còn בְּעִירֹה chỉ con vật thuộc người ấy; cách dịch này tự nhiên và rõ tình huống.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: và nó ăn trong ruộng của người khác
  rationale: Động từ lặp lại tiếp tục ý súc vật ăn cỏ hoặc ăn phá. “Của người khác” diễn đạt rõ quan hệ sở hữu được hàm ý trong אַחֵר.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: bằng phần tốt nhất trong ruộng mình và phần tốt nhất trong vườn nho mình
  rationale: מֵיטַב chỉ phần tốt nhất hoặc chọn lọc nhất; “bằng” thể hiện phương tiện bồi thường, còn “mình” làm rõ tài sản thuộc người gây thiệt hại.
- source_word: יְשַׁלֵּם
  choice: phải bồi thường
  rationale: Dạng Piel của שׁלם trong luật giao ước chỉ việc đền trả thiệt hại; “phải bồi thường” truyền đạt chính xác hiệu lực pháp lý.
