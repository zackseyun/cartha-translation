  to: 'Trong mọi vụ vi phạm liên quan đến bò, lừa, một con chiên hoặc dê[a], y phục hay bất cứ vật gì bị mất mà có người nói: “Chính là vật này,” vụ việc của cả hai bên phải được đưa đến trước Đức Chúa Trời[b]. Người nào bị Đức Chúa Trời tuyên là có tội phải bồi thường gấp đôi cho người kia.'
