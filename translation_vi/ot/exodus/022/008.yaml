  source_fidelity: 'Bản dịch theo sát cấu trúc và ý nghĩa pháp lý của tiếng Hê-bơ-rơ: דְּבַר פֶּשַׁע là một vụ việc về sai phạm; danh mục tài sản, lời nhận diện “Đó là vật ấy,” việc trình vụ việc trước אֱלֹהִים, lời tuyên có tội, và bồi hoàn gấp đôi đều được chuyển đạt đúng. Nghĩa mơ hồ hợp lý của אֱלֹהִים được giữ trong bản chính và chú thích.'
  naturalness: Văn phong nhìn chung rõ ràng, phù hợp tiếng Việt hiện đại và có sắc thái pháp lý vừa phải. Tuy nhiên, “áo quần” thường gợi một bộ hoặc nhiều món quần áo, trong khi שַׂלְמָה là một món y phục đơn lẻ/nói chung. “Y phục” giữ được độ khái quát và số ít tự nhiên hơn trong danh sách tài sản.
  terminology: “Đức Chúa Trời,” “tuyên là có tội,” và “bồi thường gấp đôi” phù hợp ngữ cảnh. “Chiên hoặc dê” cùng chú thích giải thích phạm vi rộng của שֶׂה là chấp nhận được. Các ký hiệu chú thích a và b được đặt đúng tại những từ/cụm từ mà chúng giải thích.
