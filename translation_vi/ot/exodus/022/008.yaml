source:
  edition: WLC
  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: vi
  text: 'Trong mọi vụ vi phạm liên quan đến bò, lừa, một con chiên hoặc dê[a], y phục hay bất cứ vật gì bị mất mà có người nói: “Chính là vật này,” vụ việc của cả hai bên phải được đưa đến trước Đức Chúa Trời[b]. Người nào bị Đức Chúa Trời tuyên là có tội phải bồi thường gấp đôi cho người kia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ dùng một từ chỉ chung một con gia súc nhỏ, có thể là chiên hoặc dê.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trước các thẩm phán” hoặc “trước tòa án.” Trong bối cảnh pháp lý, từ Hê-bơ-rơ אֱלֹהִים có thể chỉ trực tiếp Đức Chúa Trời hoặc những người xét xử thi hành thẩm quyền dưới quyền Ngài.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: vụ vi phạm
  rationale: Trong văn cảnh pháp lý, דָּבָר chỉ một vụ việc, còn פֶּשַׁע chỉ hành vi sai phạm; cách dịch này rõ nghĩa mà không xác định quá mức loại vi phạm.
- source_word: שׁוֹר
  choice: bò
  rationale: Từ này chỉ bò thuộc đàn gia súc; “bò” tự nhiên và đủ rộng trong tiếng Việt hiện đại hơn cách gọi chuyên biệt “bò đực thiến”.
- source_word: חֲמוֹר
  choice: lừa
  rationale: Cách gọi thông dụng, hiện đại cho loài vật được nêu trong danh sách tài sản.
- source_word: שֶׂה
  choice: một con chiên hoặc dê
  rationale: Danh từ số ít này chỉ một con gia súc nhỏ, có thể là chiên hoặc dê; nêu cả hai giúp giữ đúng phạm vi nghĩa của tiếng Hê-bơ-rơ.
- source_word: שַׂלְמָה
  choice: áo quần
  rationale: Chỉ một món đồ mặc nói chung; “áo quần” tự nhiên và không thu hẹp nghĩa thành một loại áo cụ thể.
- source_word: אֲבֵדָה
  choice: bất cứ vật gì bị mất
  rationale: Diễn đạt tự nhiên ý nghĩa rộng là tài sản hoặc đồ vật bị thất lạc.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: 'mà có người nói: “Chính là vật này”'
  rationale: Giữ lực xác định của הוּא זֶה trong lời nhận diện hoặc yêu sách đối với vật đang tranh chấp mà không thêm chủ thể hay động cơ không có trong nguyên văn.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Đây là nghĩa trực tiếp của אֱלֹהִים. Do từ này cũng có thể được hiểu theo nghĩa pháp lý là các thẩm phán hoặc tòa án, khả năng ấy được ghi ở chú thích.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: vụ việc của cả hai bên phải được đưa đến trước
  rationale: “Cả hai bên” diễn đạt tự nhiên dạng song số, còn cấu trúc bị động tiếng Việt làm rõ việc vụ tranh chấp được trình ra xét xử.
- source_word: יַרְשִׁיעֻן
  choice: tuyên là có tội
  rationale: Dạng Hiphil của רשע mang nghĩa pháp lý là tuyên một người có tội, không chỉ mô tả người ấy là gian ác.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: phải bồi thường gấp đôi
  rationale: Trong ngữ cảnh tài sản, động từ cùng số từ diễn tả việc hoàn trả hai lần; “bồi thường gấp đôi” rõ ràng và tự nhiên.
- source_word: לְרֵעֵהוּ
  choice: cho người kia
  rationale: רֵעַ có thể là người lân cận, người đồng loại hoặc người liên hệ; ở đây nó chỉ bên còn lại trong vụ tranh chấp, nên “người kia” chính xác hơn trong văn cảnh pháp lý.
theological_decisions:
- issue: Nghĩa của אֱלֹהִים trong bối cảnh pháp lý
  choice: Đức Chúa Trời
  alternative: các thẩm phán / tòa án
  rationale: Nguyên văn dùng danh xưng thường chỉ Đức Chúa Trời, nhưng trong luật giao ước từ này có thể được hiểu là những người xét xử thi hành thẩm quyền dưới quyền Ngài. Bản chính giữ nghĩa trực tiếp, còn chú thích bảo tồn cách hiểu pháp lý hợp lý.
translation_notes:
  register: Văn phong pháp lý nhưng sáng rõ, trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại. Dùng “Đức Chúa Trời” theo cách gọi Tin Lành quen thuộc vì nguyên văn là אֱלֹהִים, đồng thời không giải quyết dứt khoát sự mơ hồ pháp lý; chú thích giữ cách hiểu “các thẩm phán/tòa án.”
