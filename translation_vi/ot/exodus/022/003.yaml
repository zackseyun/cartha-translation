revisions:
- from: Nếu vật bị lấy trộm quả thật được tìm thấy còn sống trong tay người ấy—dù là bò, lừa hay chiên dê[a]—thì người ấy phải bồi thường gấp đôi.
  to: Nếu vật bị trộm quả thật được tìm thấy còn sống do người ấy nắm giữ—dù là bò, lừa, chiên hoặc dê[a]—thì người ấy phải bồi thường gấp đôi.
  rationale: Bản sửa làm rõ thành ngữ pháp lý “trong tay” là sự nắm giữ/kiểm soát và thay cụm “chiên dê” bằng cách diễn đạt tiếng Việt tự nhiên, đồng thời bảo toàn tính không xác định giữa chiên và dê của từ Hê-bơ-rơ שֶׂה qua chú thích. Các yếu tố nhấn mạnh, điều kiện, tình trạng còn sống và bồi thường hai lần đều được giữ nguyên.
