  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: vi
  text: Nếu vật bị trộm quả thật được tìm thấy còn sống do người ấy nắm giữ—dù là bò, lừa, chiên hoặc dê[a]—thì người ấy phải bồi thường gấp đôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này có thể chỉ một con chiên hoặc một con dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Tiểu từ điều kiện tiêu chuẩn, mở đầu một trường hợp trong luật.
- source_word: הִמָּצֵא תִמָּצֵא
  choice: quả thật được tìm thấy
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn thể Niphal nhấn mạnh việc thực sự tìm thấy; “quả thật” vừa giữ sắc thái nhấn mạnh vừa tự nhiên trong tiếng Việt.
- source_word: בְיָדוֹ
  choice: trong tay người ấy
  rationale: Giữ hình ảnh sát nguyên văn “trong tay”, đồng thời trong văn cảnh pháp lý vẫn dễ hiểu là thuộc quyền nắm giữ hay kiểm soát của người ấy.
- source_word: הַגְּנֵבָה
  choice: vật bị lấy trộm
  rationale: Chỉ vật đã bị trộm chứ không phải hành vi trộm cắp; cách diễn đạt này rõ nghĩa và tự nhiên.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: dù là bò, lừa hay chiên dê
  rationale: Diễn đạt tự nhiên chuỗi các loại gia súc được nêu trong điều luật. “Chiên dê” giữ phạm vi của שֶׂה, từ có thể chỉ con thuộc đàn chiên hoặc dê.
- source_word: חַיִּים
  choice: còn sống
  rationale: Tính từ vị ngữ mô tả con vật khi được tìm thấy; “còn sống” làm rõ sự tương phản ngầm với việc đã bị giết hoặc tiêu thụ.
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: phải bồi thường gấp đôi
  rationale: Công thức pháp lý chỉ việc hoàn trả hai lần; “bồi thường gấp đôi” rõ ràng, tự nhiên và giữ hiệu lực bắt buộc.
theological_decisions: []
translation_notes:
  register: Văn phong luật pháp trang trọng nhưng hiện đại. Dùng “người ấy” để tránh khẩu ngữ; giữ thành ngữ “trong tay” vì dễ hiểu trong tiếng Việt, và thêm chú thích để bảo toàn phạm vi từ vựng của שֶׂה.
