  source_fidelity: Bản nháp truyền đạt đúng điều kiện pháp lý, sự nhấn mạnh của cấu trúc nguyên mẫu tuyệt đối + động từ hữu hạn (“quả thật”), việc tang vật được tìm thấy còn sống, và mức bồi thường gấp đôi. Tuy nhiên, “chiên dê” không phân định rõ lựa chọn nghĩa của שֶׂה và không tự nhiên trong tiếng Việt hiện đại.
  naturalness: “Trong tay người ấy” sát chữ nhưng trong văn cảnh luật pháp tiếng Việt dễ bị hiểu theo nghĩa đen. “Do người ấy nắm giữ” diễn đạt rõ nghĩa sở hữu/kiểm soát của thành ngữ Hê-bơ-rơ mà vẫn giữ sắc thái pháp lý. “Chiên hoặc dê” là cách liệt kê tự nhiên và rõ ràng.
