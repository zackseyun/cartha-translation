  text: כֵּֽן תַּעֲשֶׂ֥ה לְ/שֹׁרְ/ךָ֖ לְ/צֹאנֶ֑/ךָ שִׁבְעַ֤ת יָמִים֙ יִהְיֶ֣ה עִם אִמּ֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י תִּתְּנ/וֹ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: vi
  text: 'Ngươi cũng phải làm như vậy đối với bò và chiên dê của ngươi: trong bảy ngày, nó phải ở lại với mẹ nó[a]; đến ngày thứ tám, ngươi phải trao nó cho Ta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mệnh lệnh này tiếp nối quy định ở câu trước về con đầu lòng; tiếng Hê-bơ-rơ trong câu này không lặp lại cụm từ “con đầu lòng”. Động từ được dịch “ở lại” theo nghĩa đen là “ở/có mặt với mẹ nó”.
    reason: cross_reference; lexical_alternative
lexical_decisions:
- source_word: כֵּן תַּעֲשֶׂה
  choice: Ngươi cũng phải làm như vậy
  rationale: Diễn đạt tự nhiên mệnh lệnh pháp lý và nối rõ với quy định ngay trước đó.
- source_word: לְשֹׁרְךָ
  choice: đối với bò ... của ngươi
  rationale: Giới từ לְ chỉ đối tượng mà quy định áp dụng; שׁוֹר ở đây chỉ gia súc bò, không nhất thiết riêng bò đực.
- source_word: לְצֹאנֶךָ
  choice: đối với ... bầy chiên dê của ngươi
  rationale: צֹאן là danh từ tập hợp chỉ gia súc nhỏ, thường gồm cả chiên và dê; cách dịch này rõ hơn từ 'bầy' đứng riêng.
- source_word: שִׁבְעַת יָמִים יִהְיֶה עִם אִמּוֹ
  choice: phải ở với mẹ nó trong bảy ngày
  rationale: Giữ sát nghĩa 'ở với mẹ nó' đồng thời thể hiện khoảng thời gian kéo dài bằng 'trong bảy ngày'.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: đến ngày thứ tám
  rationale: Cách nói tự nhiên trong tiếng Việt cho thời điểm thực hiện mệnh lệnh; 'vào ngày thứ tám' cũng có thể dùng.
- source_word: תִּתְּנוֹ לִי
  choice: ngươi phải dâng nó cho Ta
  rationale: Động từ נתן có nghĩa cơ bản là 'trao/cho'; trong ngữ cảnh lễ vật dâng Đức Chúa Trời, 'dâng' truyền đạt tự nhiên quan hệ ấy mà không xác định thêm nghi thức.
theological_decisions:
- issue: Đối tượng là con đầu lòng của bò và bầy chiên dê
  choice: Đưa 'con đầu lòng' vào câu và đánh dấu chú thích
  alternative: Không lặp 'con đầu lòng', chỉ dùng đại từ 'nó' như nguyên văn câu này
  rationale: Ngữ cảnh trực tiếp từ câu trước cung cấp đối tượng bị lược; thêm cụm từ giúp tiếng Việt có chủ ngữ rõ ràng, nhưng chú thích minh bạch rằng tiếng Hê-bơ-rơ của chính câu này không lặp lại cụm ấy.
- issue: Ý nghĩa của việc 'cho Ta'
  choice: dâng nó cho Ta
  alternative: trao nó cho Ta / cho Ta
  rationale: Ngữ cảnh nói về con đầu lòng thuộc về Đức Chúa Trời, nên 'dâng' là cách diễn đạt tiếng Việt phù hợp; không thêm chi tiết về cách thức hiến tế mà câu không nêu.
translation_notes:
  register: Văn phong luật giao ước trang trọng nhưng dễ hiểu. Dùng “ngươi” và “Ta” để giữ lối xưng hô trực tiếp, trang nghiêm giữa Đức Chúa Trời và người nhận luật; “bầy chiên dê” làm rõ phạm vi của danh từ tập hợp צֹאן.
