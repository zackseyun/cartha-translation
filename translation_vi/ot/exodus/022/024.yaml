    text: 'Cũng có thể dịch: “Khi ngươi cho một người nghèo trong dân Ta, đang ở cùng ngươi, vay tiền.” Tiếng Hê-bơ-rơ dùng hình thức điều kiện thường gặp trong luật theo tình huống. Từ được dịch là “tiền” có nghĩa đen là “bạc”.'
    reason: alternative_reading
  - marker: b
    text: Sự chuyển đổi từ “ngươi” số ít sang “các ngươi” số nhiều có trong nguyên văn Hê-bơ-rơ.
    reason: source_feature
  revision_rationale: Sửa tối thiểu để tránh diễn giải sắc thái “thúc ép” như thể được phát biểu rõ trong nguồn và để không thêm “khoản vay” vào mệnh đề cuối. Giữ “Nếu” nhằm phản ánh אִם, giữ số ít “một người nghèo”, và giữ ghi chú về biến đổi số ngôi trong tiếng Hê-bơ-rơ.
