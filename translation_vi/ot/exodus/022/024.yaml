revisions:
- from: Nếu ngươi cho một người nghèo trong dân Ta, đang ở giữa ngươi, vay tiền[a], thì đừng đối xử với người ấy như chủ nợ thúc ép; các ngươi không được tính lãi trên khoản vay của người ấy.[b]
  to: Nếu ngươi cho một người nghèo trong dân Ta, đang ở cùng ngươi, vay tiền[a], thì đừng cư xử như chủ nợ đối với người ấy; các ngươi không được tính lãi đối với người ấy.[b]
  rationale: Sửa tối thiểu để tránh diễn giải sắc thái “thúc ép” như thể được phát biểu rõ trong nguồn và để không thêm “khoản vay” vào mệnh đề cuối. Giữ “Nếu” nhằm phản ánh אִם, giữ số ít “một người nghèo”, và giữ ghi chú về biến đổi số ngôi trong tiếng Hê-bơ-rơ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:48:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng điều khoản về cho người nghèo vay và cấm tính lãi. Tuy nhiên, “chủ nợ thúc ép” thêm sắc thái hành động vào một danh từ/phân từ có thể dịch gọn là “chủ nợ”; còn “trên khoản vay của người ấy” giải thích điều được ngầm hiểu thay vì bám cấu trúc “trên người ấy/đối với người ấy” của nguyên văn. Bản sửa giữ quan hệ: một người nghèo thuộc dân Ta và ở cùng ngươi, đồng thời giữ sự chuyển từ số ít sang số nhiều.'
  naturalness: Câu sửa dùng cú pháp tiếng Việt hiện đại, rõ ràng và trang trọng. “Đừng cư xử như chủ nợ đối với người ấy” tự nhiên hơn “đừng đối xử ... như chủ nợ thúc ép”, và “tính lãi đối với người ấy” diễn đạt chuẩn trong ngữ cảnh pháp luật mà không thêm “khoản vay” vào bản văn.
  terminology: Giữ “Ta/ngươi/các ngươi” phù hợp lời phán giao ước; “tiền” phản ánh כֶּסֶף theo nghĩa kinh tế, với chú thích nghĩa đen “bạc”; “lãi” phản ánh נֶשֶׁךְ mà không thu hẹp thành “lãi nặng”. Không cần thêm giới tính vào “người nghèo”, vì tiếng Việt không bắt buộc đánh dấu giống ngữ pháp.
  issues:
  - severity: medium
    issue: Cụm “chủ nợ thúc ép” diễn giải mạnh hơn nguyên văn.
    rationale: כְּנֹשֶׁה chỉ người chủ nợ/người đòi nợ; ngữ cảnh có thể hàm ý thúc ép, nhưng bản văn không nêu trực tiếp một động từ “thúc ép”. “Chủ nợ” bảo toàn độ khái quát của nguồn.
  - severity: low
    issue: Cụm “trên khoản vay của người ấy” thêm một thành tố giải thích.
    rationale: Nguyên văn nói không đặt/tính lãi “trên người ấy”. Khoản vay hiển nhiên trong ngữ cảnh, nhưng không cần được nêu thêm trong bản dịch chính.
  revised_text: Nếu ngươi cho một người nghèo trong dân Ta, đang ở cùng ngươi, vay tiền[a], thì đừng cư xử như chủ nợ đối với người ấy; các ngươi không được tính lãi đối với người ấy.[b]
  revised_footnotes:
