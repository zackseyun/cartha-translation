  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: vi
  text: Nếu ngươi cho một người nghèo trong dân Ta, đang ở cùng ngươi, vay tiền[a], thì đừng cư xử như chủ nợ đối với người ấy; các ngươi không được tính lãi đối với người ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi ngươi cho một người nghèo trong dân Ta, đang ở cùng ngươi, vay tiền.” Tiếng Hê-bơ-rơ dùng hình thức điều kiện thường gặp trong luật theo tình huống. Từ được dịch là “tiền” có nghĩa đen là “bạc”.'
    reason: alternative_reading
  - marker: b
    text: Sự chuyển đổi từ “ngươi” số ít sang “các ngươi” số nhiều có trong nguyên văn Hê-bơ-rơ.
    reason: source_feature
lexical_decisions:
- source_word: אִם
  choice: Nếu
  rationale: Giữ hình thức điều kiện của tiếng Hê-bơ-rơ; trong văn luật theo tình huống, từ này cũng có thể mang nghĩa “khi”.
- source_word: כֶּסֶף
  choice: tiền
  rationale: Nghĩa đen là “bạc”, nhưng trong bối cảnh cho vay, từ này chỉ tiền.
- source_word: תַּלְוֶה
  choice: cho ... vay
  rationale: Dạng Hiphil của לוה ở đây có nghĩa là cho vay.
- source_word: עַמִּי אֶת הֶעָנִי עִמָּךְ
  choice: một người nghèo trong dân Ta, đang ở giữa ngươi
  rationale: Diễn đạt người nghèo cụ thể thuộc dân của Đức Chúa Trời và sống trong cộng đồng của người nghe, đồng thời tránh cách đặt hai tân ngữ thiếu tự nhiên trong tiếng Việt.
- source_word: כְּנֹשֶׁה
  choice: như chủ nợ thúc ép
  rationale: Không chỉ nói đến tư cách chủ nợ, mà còn gợi hành vi gây sức ép để đòi nợ.
- source_word: נֶשֶׁךְ
  choice: lãi
  rationale: Chỉ tiền lãi của khoản vay; “lãi” tự nhiên và chính xác hơn “cho vay nặng lãi”, vốn có thể chỉ mức lãi quá cao.
theological_decisions:
- issue: Giá trị pháp lý của אִם
  choice: Nếu
  alternative: Khi
  rationale: Giữ cấu trúc điều kiện của nguyên văn mà không phủ nhận cách dùng theo tình huống phổ biến trong luật giao ước.
- issue: Đối tượng הֶעָנִי
  choice: một người nghèo
  alternative: người nghèo
  rationale: Tiếng Hê-bơ-rơ dùng dạng số ít xác định để nói đến một cá nhân nghèo trong cộng đồng; tiếng Việt không cần thêm từ “đàn ông” mới diễn đạt được số ít ấy.
- issue: Phạm vi cấm của נֶשֶׁךְ
  choice: không được tính lãi
  alternative: không được cho vay nặng lãi
  rationale: Nguyên văn cấm đặt lãi lên khoản vay trong trường hợp này, không chỉ cấm mức lãi quá cao.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách xưng hô “Ta/ngươi” phù hợp lời phán trong luật giao ước. Cụm “chủ nợ thúc ép” làm rõ sắc thái của נֹשֶׁה mà không biến câu thành một lệnh cấm đòi hoàn vốn nói chung.
