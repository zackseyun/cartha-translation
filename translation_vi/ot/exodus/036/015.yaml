  text: The length of each curtain was thirty cubits, and four cubits was the width of each curtain; the eleven curtains had one measure.
translation:
  language: vi
  text: Chiều dài mỗi tấm là ba mươi cu-bít, và chiều rộng mỗi tấm là bốn cu-bít; cả mười một tấm đều có cùng một kích thước.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְרִיעָה
  choice: tấm
  rationale: Trong ngữ cảnh các lớp phủ của Đền Tạm, “tấm” là cách gọi tự nhiên, dễ hiểu cho từng mảnh vật liệu lớn; danh từ được giữ nhất quán trong câu.
- source_word: אַמָּה
  choice: cu-bít
  rationale: Giữ đơn vị đo cổ để phản ánh trực tiếp văn bản nguồn, không quy đổi sang đơn vị hiện đại vốn chỉ có thể cho giá trị xấp xỉ.
- source_word: מִדָּה אַחַת
  choice: cùng một kích thước
  rationale: Cụm Hê-bơ-rơ nghĩa đen là “một số đo”, diễn đạt rằng cả mười một tấm có kích thước đồng nhất; cách dịch này tự nhiên trong tiếng Việt và không thêm nội dung.
