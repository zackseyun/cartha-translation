translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. Giữ cấu trúc hai kích thước rồi kết luận về tính đồng nhất của mười một tấm; dùng “cu-bít” nhất quán với thuật ngữ đo lường Kinh Thánh.
