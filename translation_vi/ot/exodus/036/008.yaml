base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: vi
  text: 'Tất cả những người khéo tay[a] trong số những người làm công việc ấy đã làm Đền Tạm: mười tấm màn bằng vải lanh mịn xe sợi, chỉ xanh, tím và đỏ thắm. Người ấy làm các tấm màn đó có hình chê-ru-bim, theo lối của một nghệ nhân.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ có nghĩa đen là “người khôn ngoan trong lòng”, một thành ngữ chỉ người có kỹ năng thủ công.
    reason: lexical_alternative
  - marker: b
    text: Bản Hê-bơ-rơ kết thúc bằng động từ số ít, “người ấy làm”, dù câu mở đầu bằng động từ số nhiều. Một số bản dịch làm trơn cú pháp thành “họ làm”.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: người khéo tay
  rationale: Cụm từ có nghĩa đen là “người có lòng khôn ngoan”, nhưng trong ngữ cảnh này là thành ngữ chỉ người có tài năng và kỹ năng thủ công. “Người khéo tay” truyền đạt tự nhiên ý nghĩa nghề nghiệp mà không khiến độc giả hiểu đây chỉ là sự khôn ngoan nói chung.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: trong số những người thực hiện công việc ấy
  rationale: Giữ sắc thái thành viên thuộc nhóm người đang đảm trách công việc, thay vì chỉ rút gọn thành “các thợ”.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ tiếng Việt quen thuộc chỉ nơi thánh lưu động trong sách Xuất Hành; rõ nghĩa hơn cách dịch từ nguyên chung chung là “nơi cư ngụ”.
- source_word: יְרִיעֹת
  choice: tấm màn
  rationale: Trong bối cảnh cấu tạo Đền Tạm, từ này chỉ những tấm vải lớn được ghép thành lớp phủ; “tấm màn” vừa tự nhiên vừa bảo toàn hình ảnh vật liệu.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe sợi
  rationale: Diễn đạt cả chất liệu gai mịn và đặc điểm sợi được xe, là chi tiết kỹ thuật của nguyên văn.
- source_word: תְכֵלֶת
  choice: chỉ xanh lam
  rationale: Từ này chỉ vật liệu nhuộm màu xanh lam cao quý; thêm “chỉ” để làm rõ ngữ cảnh dệt may.
- source_word: אַרְגָּמָן
  choice: chỉ tím
  rationale: Cách dịch tiêu chuẩn cho vật liệu nhuộm tím trong các chỉ dẫn về Đền Tạm; danh từ “chỉ” được hiểu chung trong chuỗi liệt kê.
- source_word: תוֹלַעַת שָׁנִי
  choice: chỉ đỏ thắm
  rationale: Cụm từ chỉ vật liệu nhuộm màu đỏ thắm; cách dịch này giữ màu sắc và làm rõ đây là nguyên liệu dệt.
- source_word: כְּרֻבִים
  choice: các chê-ru-bim
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc, tránh từ “thiên sứ” vì nguyên văn nói đến một loại hữu thể cụ thể.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: theo kỹ thuật của thợ thiết kế hoa văn
  rationale: Cụm từ chỉ công việc dệt được hoạch định và thực hiện đầy nghệ thuật. Cách dịch này giữ yếu tố thiết kế mà không quyết đoán quá mức giữa các kỹ thuật như thêu và dệt hoa.
- source_word: עָשָׂה אֹתָם
  choice: ông làm
  rationale: Giữ động từ số ít ở cuối câu tiếng Hê-bơ-rơ, dù đầu câu dùng động từ số nhiều; chú thích giải thích sự chuyển đổi này thay vì âm thầm làm phẳng cú pháp.
theological_decisions:
- issue: Cách diễn đạt חֲכַם לֵב trong ngữ cảnh chỉ nghệ nhân nói chung
  choice: người khéo tay
  alternative: người nam khéo tay; người có lòng khôn ngoan
  rationale: Tiếng Hê-bơ-rơ dùng dạng giống đực số ít với nghĩa đại diện/phân phối, nhưng trong tiếng Việt “người khéo tay” có thể phản ánh tự nhiên chức năng chung mà không thêm khẳng định rằng nhóm này chỉ gồm nam giới. Chú thích bảo tồn nghĩa đen và sắc thái thành ngữ.
- issue: Sự chuyển từ động từ số nhiều ở đầu câu sang động từ số ít ở cuối câu
  choice: giữ “đã làm” với chủ ngữ số nhiều rồi dùng “ông làm” ở mệnh đề cuối
  alternative: họ làm
  rationale: Bản Hê-bơ-rơ thật sự có sự thay đổi số ngữ pháp. Giữ số ít ở cuối câu bảo tồn độ căng cú pháp và không tự ý hài hòa văn bản; chú thích giúp người đọc nhận biết hiện tượng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ quen thuộc “Đền Tạm” và dạng phiên âm “chê-ru-bim”. Các chi tiết kỹ thuật về vải, màu chỉ và nghệ thuật thiết kế được giữ rõ, đồng thời tránh xác định quá mức kỹ thuật là thêu hay dệt hoa.
