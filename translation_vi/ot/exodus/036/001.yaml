revisions:
- from: Bết-sa-lê-ên, Ô-hô-li-áp và mọi người thợ khéo léo[a]—những người được Yahweh ban cho sự khôn ngoan và hiểu biết[b] để biết cách thực hiện mọi công việc phục vụ nơi thánh[c]—sẽ làm mọi điều đúng như Yahweh đã truyền.
  to: Bết-sa-lê-ên, Ô-hô-li-áp và mọi người thợ khéo léo[a]—những người được Yahweh ban cho sự khôn ngoan và hiểu biết[b] để biết cách thực hiện mọi công việc phục vụ nơi thánh[c]—sẽ thực hiện mọi công việc ấy theo đúng mọi điều Yahweh đã truyền.
