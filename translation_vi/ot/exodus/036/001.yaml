  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: vi
  text: Bết-sa-lê-ên, Ô-hô-li-áp và mọi người thợ khéo léo[a]—những người được Yahweh ban cho sự khôn ngoan và hiểu biết[b] để biết cách thực hiện mọi công việc phục vụ nơi thánh[c]—sẽ thực hiện mọi công việc ấy theo đúng mọi điều Yahweh đã truyền.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “mọi người nam khôn ngoan trong lòng”; trong ngữ cảnh này, thành ngữ chỉ người có tài khéo trong việc chế tác.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “Yahweh đã đặt sự khôn ngoan và hiểu biết trong họ”; “họ” quy chiếu chung đến Bết-sa-lê-ên, Ô-hô-li-áp và mọi người thợ khéo léo.'
    reason: grammatical_clarification
  - marker: c
    text: 'Cũng có thể dịch: “mọi công việc của sự phục vụ nơi thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: sẽ làm
  rationale: Dạng hoàn thành Qal nối bằng וְ trong mạch chỉ thị mang nghĩa tương lai/kết quả; “sẽ làm” tự nhiên trong tiếng Việt và bao quát các công việc được giao.
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: Bết-sa-lê-ên và Ô-hô-li-áp
  rationale: Phiên âm hai tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: mọi người thợ khéo léo
  rationale: Thành ngữ sát chữ là “mọi người nam khôn ngoan trong lòng”; trong ngữ cảnh chế tác, cụm từ chỉ người có tài khéo. “Người thợ khéo léo” truyền đạt chức năng tự nhiên, còn nghĩa đen được giữ trong chú thích.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: những người được Yahweh ban cho sự khôn ngoan và hiểu biết
  rationale: Đại từ Hê-bơ-rơ ở số nhiều, quy chiếu chung đến Bết-sa-lê-ên, Ô-hô-li-áp và mọi người thợ khéo. Cách diễn đạt bị động tự nhiên trong tiếng Việt mà vẫn giữ Yahweh là tác nhân ban cho.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: để biết cách thực hiện
  rationale: Hai động từ nguyên mẫu diễn tả tri thức và khả năng thực hành; “biết cách” thể hiện rõ sắc thái kỹ năng.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: mọi công việc phục vụ nơi thánh
  rationale: Giữ cả hai ý niệm “công việc” và “sự phục vụ”; הַקֹּדֶשׁ trong ngữ cảnh này chỉ nơi thánh hơn là sự thánh khiết trừu tượng.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: mọi điều đúng như Yahweh đã truyền
  rationale: Giới từ לְ mang ý phù hợp với mệnh lệnh; “đúng như” diễn đạt rõ sự tuân theo toàn bộ điều Yahweh truyền.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ trực tiếp dùng danh riêng YHWH; giữ “Yahweh” phân biệt danh này với các tước hiệu.
- issue: Phạm vi giới tính của אִישׁ חֲכַם לֵב
  choice: mọi người thợ khéo léo
  alternative: mọi người nam có lòng khôn ngoan
  rationale: אִישׁ ở giống đực số ít nhưng toàn cụm có chức năng phân phối/tập thể và nhấn mạnh năng lực thủ công. Bản dịch chính ưu tiên nghĩa trong ngữ cảnh, đồng thời chú thích giữ hình thức sát chữ để không xóa dữ kiện nguồn.
- issue: Quan hệ cú pháp của בָהֵמָּה
  choice: quy chiếu chung đến cả nhóm người vừa nêu
  alternative: quy chiếu riêng đến từng người thợ khéo léo
  rationale: Dạng số nhiều “trong họ” tự nhiên bao gồm Bết-sa-lê-ên, Ô-hô-li-áp và mọi người có lòng khôn ngoan, nên bản dịch dùng “những người” làm mệnh đề giải thích cho toàn nhóm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người thợ khéo léo” thay cho lối dịch cứng “người khôn ngoan trong lòng”, nhưng bảo tồn thành ngữ Hê-bơ-rơ trong chú thích. Dấu gạch ngang làm rõ mệnh đề giải thích dài và tránh nhập nhằng về nhóm người được Yahweh ban sự khôn ngoan.
