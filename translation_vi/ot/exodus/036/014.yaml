  yaml_path: translation/ot/exodus/036/014.yaml
  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: vi
  text: Ông làm các tấm màn bằng lông dê, làm thành một cái lều phủ trên Đền Tạm[a]; ông làm mười một tấm màn ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát là “các tấm màn bằng dê”, vì nguyên văn không nêu rõ chất liệu từ dê là lông; tuy nhiên, ngữ cảnh về các loại vải của Đền Tạm nghiêng về nghĩa “lông dê”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: ông làm / ông làm tất cả
  rationale: עָשָׂה là động từ thông dụng mang nghĩa “làm”. Bản dịch giữ cả hai lần xuất hiện, đồng thời thêm “tất cả” ở vế sau để diễn đạt tự nhiên chức năng của đại từ đối cách אֹתָם mà không làm thay đổi số lượng.
- source_word: יְרִיעֹת
  choice: các tấm màn
  rationale: Trong ngữ cảnh chế tạo Đền Tạm, từ này chỉ các tấm vải lớn ghép thành lớp che; “các tấm màn” vừa rõ nghĩa vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: עִזִּים
  choice: bằng lông dê
  rationale: Nguyên văn nói sát là “dê”, để ngỏ chất liệu cụ thể; ngữ cảnh hàng dệt của Đền Tạm cho thấy lông dê là cách hiểu có khả năng nhất. Chú thích bảo lưu cách đọc sát chữ.
- source_word: לְאֹהֶל
  choice: để làm một cái lều
  rationale: Tiền tố לְ biểu thị mục đích hoặc công dụng. Danh từ không có mạo từ được diễn đạt là “một cái lều”, phân biệt lớp lều phủ với chính Đền Tạm.
- source_word: עַל
  choice: phủ trên
  rationale: Giới từ chỉ vị trí của lớp lều ở bên trên Đền Tạm; “phủ trên” diễn đạt tự nhiên cả vị trí lẫn chức năng che phủ.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ chỉ nơi thánh di động trong sách Xuất Hành. “Đền Tạm” là cách gọi quen thuộc, trang trọng và giúp phân biệt với “cái lều” ở ngay trước đó.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: mười một
  rationale: Số từ này có nghĩa trực tiếp là “mười một”.
- source_word: אֹתָם
  choice: tất cả
  rationale: Đại từ đối cách quy chiếu về các tấm màn. Trong tiếng Việt, “ông làm tất cả mười một tấm màn” chuyển tải tự nhiên ý đối tượng đã nêu mà không cần một đại từ dư thừa.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể là Bết-sa-lê-ên từ ngữ cảnh gần, nhưng câu Hê-bơ-rơ chỉ biểu thị ngôi thứ ba số ít. Giữ cấu trúc lặp “làm” của nguyên văn và dùng dấu chấm phẩy để phản ánh hai mệnh đề song song.
