  text: He made the middle bar to pass through the midst of the boards from end to end[a][b].
translation:
  language: vi
  text: Ông làm thanh ngang chính giữa luồn qua giữa các tấm ván, từ đầu này đến đầu kia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thanh ngang chính giữa chạy suốt giữa các tấm ván, từ đầu này đến đầu kia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Dạng Qal wayyiqtol của עשה tiếp nối lời kể, mang nghĩa đơn giản là “ông làm”; tiếng Việt không cần dịch liên từ וַ để câu văn tự nhiên.
- source_word: הַבְּרִיחַ הַתִּיכֹן
  choice: thanh ngang ở giữa
  rationale: בְּרִיחַ chỉ thanh dùng để liên kết các tấm ván của Đền Tạm; הַתִּיכֹן xác định vị trí ở giữa. “Thanh ngang ở giữa” rõ nghĩa và tự nhiên trong ngữ cảnh kiến trúc.
- source_word: לִבְרֹחַ
  choice: chạy xuyên qua
  rationale: Trong cấu trúc này, động từ ברח mô tả thanh ngang chạy hoặc kéo dài qua các tấm ván, chứ không mang nghĩa thông thường là “chạy trốn”.
- source_word: בְּתוֹךְ הַקְּרָשִׁים
  choice: xuyên qua các tấm ván
  rationale: בְּתוֹךְ diễn tả vị trí trong phần giữa hoặc bên trong; kết hợp với động từ ở đây, “xuyên qua” truyền đạt đúng quan hệ không gian. קֶרֶשׁ được dịch là “tấm ván” theo chức năng kết cấu trong Đền Tạm.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: từ đầu này đến đầu kia
  rationale: Thành ngữ Hê-bơ-rơ diễn tả sự kéo dài trọn chiều dài; cách nói này tự nhiên và rõ ràng trong tiếng Việt.
