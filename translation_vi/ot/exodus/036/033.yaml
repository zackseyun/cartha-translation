revisions:
- from: Ông làm thanh ngang ở giữa chạy xuyên qua các tấm ván, từ đầu này đến đầu kia.[a]
  to: Ông làm thanh ngang chính giữa luồn qua giữa các tấm ván, từ đầu này đến đầu kia.[a]
  rationale: Đổi “thanh ngang ở giữa” thành “thanh ngang chính giữa” để phản ánh trực tiếp הַתִּיכֹן. Đổi “chạy xuyên qua các tấm ván” thành “luồn qua giữa các tấm ván” để tránh hàm ý không cần thiết rằng thanh xuyên thủng vật liệu, đồng thời giữ sắc thái không gian của בְּתוֹךְ và ý nghĩa kéo dài trọn chiều dài trong thành ngữ cuối câu.
  reviewer_model: gpt-5.6-terra
