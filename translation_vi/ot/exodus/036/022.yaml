  yaml_path: translation/ot/exodus/036/022.yaml
  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: vi
  text: Mỗi tấm ván có hai mộng[a], được lắp khớp cái này với cái kia[b]; ông đã làm như vậy cho tất cả các tấm ván của Đền Tạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “tay”; ở đây từ này chỉ các phần mộng nhô ra của mỗi tấm ván.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đối diện nhau” hoặc “tương ứng với nhau,” nhấn mạnh sự sắp đặt khớp nhau của hai mộng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: hai mộng
  rationale: יָדֹת nghĩa đen là “tay,” nhưng trong ngữ cảnh đóng dựng chỉ các phần nhô ra dùng để lắp ghép; “mộng” là thuật ngữ tiếng Việt tự nhiên và chính xác.
- source_word: קֶּרֶשׁ
  choice: tấm ván
  rationale: Chỉ từng cấu kiện gỗ tạo nên khung Đền Tạm; “tấm ván” rõ nghĩa và phù hợp ngữ cảnh.
- source_word: מְשֻׁלָּבֹת
  choice: khớp
  rationale: Diễn tả các mộng được bố trí hoặc ghép tương ứng; “khớp” giữ được sắc thái kết cấu mà vẫn tự nhiên.
- source_word: אַחַת אֶל אֶחָת
  choice: với nhau
  rationale: Giữ quan hệ tương ứng giữa hai mộng mà không xác định quá mức hình học của chúng.
- source_word: כֵּן עָשָׂה
  choice: ông làm ... theo cách ấy
  rationale: Chuyển tải rõ ý chỉ cách thức của כֵּן và động từ làm עָשָׂה trong lời thuật.
- source_word: מִּשְׁכָּן
  choice: Đền Tạm
  rationale: Cách gọi quen thuộc, dễ hiểu trong tiếng Việt đối với nơi thánh có thể tháo lắp của sách Xuất Hành.
