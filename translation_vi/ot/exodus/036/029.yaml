  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: vi
  text: Ở phía dưới, hai tấm ấy được ghép đôi với nhau; và cùng với nhau, chúng được ghép hoàn chỉnh cho đến đỉnh, đến một khoen. Ông đã làm như vậy cho cả hai tấm ấy ở hai góc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cho cả hai bộ phận ở góc.” Nguyên văn nói “cho cả hai [cái] ấy, cho hai góc”; “hai tấm ấy” có lẽ chỉ hai tấm khung ở các góc.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: được ghép tương ứng với nhau
  rationale: Diễn đạt ý hai bộ phận được làm thành một cặp ăn khớp về kết cấu, đồng thời tránh từ quá kỹ thuật.
- source_word: מִלְּמַטָּה
  choice: từ phía dưới
  rationale: Giữ sắc thái định hướng của מִן và cho thấy việc ghép bắt đầu hoặc được xét từ phần dưới.
- source_word: יַחְדָּו
  choice: cùng
  rationale: Phản ánh trực tiếp trạng từ chỉ sự kết hợp, nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: תַמִּים
  choice: liền khít
  rationale: Trong ngữ cảnh kết cấu, từ này nói đến tình trạng trọn vẹn hoặc hoàn chỉnh khi hai tấm được nối lên phía trên; “liền khít” truyền đạt ý xây dựng mà không lặp lại ý “tương ứng” ở vế trước.
- source_word: אֶל רֹאשׁוֹ
  choice: cho đến đỉnh
  rationale: Giữ hướng tiến từ dưới lên trên của אֶל; đại từ số ít trong tiếng Hê-bơ-rơ được để hàm ẩn tự nhiên trong tiếng Việt.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: một khoen
  rationale: “Khoen” phù hợp với một vòng dùng trong kết cấu. Tiếng Việt không biểu thị mạo từ xác định như tiếng Hê-bơ-rơ; “một” giữ nguyên số từ mà không diễn giải thành “thứ nhất”.
- source_word: כֵּן עָשָׂה
  choice: Ông làm ... như vậy
  rationale: Tái hiện công thức tóm lược cách thi công và giữ chủ ngữ số ít của động từ Hê-bơ-rơ.
- source_word: לִשְׁנֵיהֶם
  choice: cả hai tấm
  rationale: Làm rõ đối tượng mà đại từ số đôi chỉ đến trong mạch văn, giúp câu tiếng Việt dễ hiểu.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: cho hai góc
  rationale: Giữ nghĩa sát là hai góc, không mặc nhiên biến chúng thành các bộ phận góc riêng biệt.
