base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: vi
  text: Ông làm một bức màn che cho lối vào lều[a], bằng sợi xanh lam, tím, đỏ thắm và vải lanh mịn xe sợi, do thợ thêu thực hiện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một tấm che cho lối vào lều”. Từ Hê-bơ-rơ chỉ vật treo che ở lối vào, khác với “màn ngăn” (פָּרֹכֶת) ở bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ với waw liên tiếp tiếp nối mạch tường thuật; tiếng Việt không cần dịch riêng liên từ mà vẫn giữ được trình tự tự nhiên.
- source_word: מָסָךְ
  choice: một bức màn che
  rationale: Chỉ vật treo che một lối vào; cách dịch này tự nhiên trong tiếng Việt và phân biệt với פָּרֹכֶת là bức màn ngăn bên trong.
- source_word: לְפֶתַח הָאֹהֶל
  choice: che cửa Lều
  rationale: לְ biểu thị công dụng/vị trí đối với cửa vào; 'cửa Lều' gọn và tự nhiên. Viết hoa 'Lều' vì trong văn cảnh đây là Lều Hội Kiến cụ thể, nhưng không mở rộng danh từ chung אֹהֶל ngay trong câu.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: chỉ xanh lam, tím, đỏ thắm
  rationale: Các từ chỉ vật liệu nhuộm màu trong ngành dệt; thêm 'chỉ' một lần để làm rõ chất liệu và tránh lặp nặng nề.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe sợi
  rationale: Giữ cả ý chất liệu vải gai mịn của שֵׁשׁ và cách chế tạo bằng sợi xe của מָשְׁזָר.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: công việc của thợ thêu
  rationale: Phản ánh sát kết cấu danh từ và nhấn mạnh đây là sản phẩm thủ công chuyên môn của người thợ thêu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'bức màn che cửa' thay vì thuật ngữ kỹ thuật khó hiểu; giữ chuỗi màu sắc và kỹ thuật dệt sát với nguyên văn.
