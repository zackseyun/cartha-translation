base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: vi
  text: Ông làm năm mươi vòng vải trên một tấm màn, và làm năm mươi vòng vải ở mép tấm màn thuộc bộ màn thứ hai[a]; các vòng vải đối diện nhau, từng vòng một đối diện với vòng kia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thuộc phần ghép nối thứ hai” hoặc “thuộc phần màn ghép thứ hai”.
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “các vòng tương ứng, một đối diện một”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: vòng vải
  rationale: Danh từ chỉ các vòng dùng để nối những tấm màn. “Vòng vải” diễn đạt rõ đây không phải là các móc hay khuy kim loại được nhắc riêng trong phần mô tả này.
- source_word: יְרִיעָה
  choice: tấm màn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ một tấm dệt lớn dùng làm màn che; “tấm màn” vừa tự nhiên vừa phân biệt từng tấm riêng lẻ.
- source_word: בִּקְצֵה
  choice: ở mép
  rationale: קָצֶה chỉ mép hoặc đầu mút; ở đây các vòng được đặt dọc mép tấm màn để nối các bộ màn với nhau.
- source_word: מַחְבֶּרֶת
  choice: bộ
  rationale: Từ này chỉ một đơn vị gồm nhiều tấm màn đã được ghép lại. “Bộ” ngắn gọn, dễ hiểu và phù hợp với sản phẩm đã ghép, trong khi nghĩa đen cũng có thể là “phần ghép nối”.
- source_word: הַשֵּׁנִית
  choice: thứ hai
  rationale: Giữ nguyên nghĩa số thứ tự của tiếng Hê-bơ-rơ, chỉ bộ màn thứ hai.
- source_word: מַקְבִּילֹת
  choice: đối nhau
  rationale: Phân từ diễn tả các vòng nằm tương ứng hoặc thẳng hàng ở hai mép để có thể nối lại; “đối nhau” giữ được hình ảnh không gian của nguyên văn.
- source_word: אַחַת אֶל אֶחָת
  choice: vòng nọ thẳng với vòng kia
  rationale: Cụm từ nghĩa đen là “một với một”, nhấn mạnh từng vòng tương ứng riêng với một vòng bên kia. Cách dịch này tự nhiên trong tiếng Việt và bảo tồn tính phân phối của thành ngữ.
- source_word: עָשָׂה
  choice: làm
  rationale: Động từ thông dụng mang nghĩa làm hoặc chế tạo; “làm” phù hợp với văn cảnh thi công và giữ lối diễn đạt giản dị.
