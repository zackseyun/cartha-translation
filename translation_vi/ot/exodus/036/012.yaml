  source_fidelity: 'Bản dịch chuyển tải đúng các chi tiết chính: năm mươi vòng trên một tấm màn, năm mươi vòng ở mép tấm màn thuộc phần ghép thứ hai, và sự tương ứng từng vòng một. Tuy nhiên, “các vòng đối nhau, vòng nọ thẳng với vòng kia” vừa lặp ý vừa không diễn đạt gọn, rõ quan hệ “một đối một” của מַקְבִּילֹת ... אַחַת אֶל אֶחָת.'
