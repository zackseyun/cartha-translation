  text: וַ/יְצַ֣ו מֹשֶׁ֗ה וַ/יַּעֲבִ֨ירוּ ק֥וֹל בַּֽ/מַּחֲנֶה֮ לֵ/אמֹר֒ אִ֣ישׁ וְ/אִשָּׁ֗ה אַל יַעֲשׂוּ ע֛וֹד מְלָאכָ֖ה לִ/תְרוּמַ֣ת הַ/קֹּ֑דֶשׁ וַ/יִּכָּלֵ֥א הָ/עָ֖ם מֵ/הָבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: vi
  text: 'Môi-se truyền lệnh, rồi người ta loan báo khắp trại[a] rằng: “Không một người nam hay người nữ nào được làm thêm công việc nào nữa cho phần đóng góp thánh[b].” Dân chúng bị ngăn không đem đến nữa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát thành ngữ Híp-ri: “khiến một tiếng nói truyền đi”; cũng có thể dịch là “người ta thông báo khắp trại”.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lễ vật thánh” hoặc “phần đóng góp cho nơi thánh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: truyền lệnh
  rationale: Động từ צוה diễn tả việc ban một mệnh lệnh có thẩm quyền; “truyền lệnh” giữ được sắc thái này và tự nhiên trong văn kể tiếng Việt.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: người ta cho truyền lời loan báo
  rationale: Thành ngữ Híp-ri, theo nghĩa đen là “khiến tiếng nói đi qua”, chỉ việc cho phổ biến một thông báo công khai. Cách dịch này giữ sắc thái sai khiến của thể Hifil mà vẫn rõ nghĩa.
- source_word: בַּמַּחֲנֶה
  choice: khắp trại
  rationale: Giới từ có nghĩa cơ bản là “trong”, nhưng đi với thành ngữ loan báo thì “khắp trại” diễn đạt tự nhiên việc thông báo được truyền đến toàn trại.
- source_word: אִישׁ וְאִשָּׁה
  choice: không một người nam hay người nữ nào
  rationale: Giữ sự nhắc đến rõ ràng cả nam lẫn nữ, đồng thời phù hợp với cấu trúc cấm đoán trong tiếng Việt.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: không ... được làm thêm bất cứ công việc gì
  rationale: מְלָאכָה có thể chỉ công việc hoặc công việc thủ công; cách dịch rộng này phù hợp với việc chế tác các vật liệu và đồ dùng cho nơi thánh.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: cho lễ vật dâng vào nơi thánh
  rationale: תְּרוּמָה là phần đóng góp hay lễ vật được biệt riêng, còn הַקֹּדֶשׁ trong ngữ cảnh có thể chỉ nơi thánh. Cách dịch này sáng nghĩa nhưng vẫn ghi nhận các khả năng khác trong chú thích.
- source_word: וַיִּכָּלֵא
  choice: bị ngăn
  rationale: Thể Nifal của כלא mang nghĩa bị giữ lại hoặc bị ngăn không làm một việc; “bị ngăn” bảo toàn sắc thái bị động mà không hàm ý dân chúng miễn cưỡng.
- source_word: מֵהָבִיא
  choice: không đem đến nữa
  rationale: Giới từ מִן với động từ nguyên mẫu diễn tả việc bị ngăn khỏi hành động đem đến; “nữa” làm rõ theo ngữ cảnh rằng họ ngừng đem thêm lễ vật.
theological_decisions:
- issue: Mối liên hệ trong cụm לִתְרוּמַת הַקֹּדֶשׁ
  choice: lễ vật dâng vào nơi thánh
  alternative: lễ vật thánh; phần đóng góp cho nơi thánh
  rationale: Cụm Híp-ri có thể được hiểu là phần đóng góp mang tính thánh hoặc phần đóng góp dành cho nơi thánh. Bản chính chọn cách phù hợp ngữ cảnh đền tạm, còn chú thích bảo lưu độ mở về cú pháp và ý nghĩa.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Người ta” diễn đạt chủ ngữ số nhiều không được nêu rõ trong tiếng Híp-ri; “cho truyền lời loan báo” giữ được nét sai khiến của nguyên văn mà vẫn dễ hiểu với độc giả phổ thông.
