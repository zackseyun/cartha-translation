  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự chính và hầu hết các yếu tố của nguyên văn: Môi-se ra lệnh, một lời công bố được truyền khắp trại, lệnh cấm cả nam lẫn nữ tiếp tục làm việc, và dân bị ngăn đem thêm lễ vật. Tuy nhiên, “lễ vật dâng vào nơi thánh” thu hẹp và chuyển nghĩa cụm לִתְרוּמַת הַקֹּדֶשׁ theo hướng lễ vật được mang vào bên trong nơi thánh; nguyên văn phù hợp hơn với một phần đóng góp/lễ vật có tính thánh hoặc dành cho nơi thánh. Cụm này nên được giữ mở bằng chú thích.'
  naturalness: “Cho truyền lời loan báo” bị trùng ý và không tự nhiên trong tiếng Việt hiện đại. “Người ta loan báo khắp trại” là cách kể tự nhiên, đồng thời vẫn diễn đạt hợp lý thành ngữ Híp-ri về việc làm cho lời công bố được lan truyền. Bỏ “Vì thế” cũng sát hơn với liên từ tự sự của nguyên văn.
  terminology: Dùng “phần đóng góp thánh” cho תְּרוּמַת הַקֹּדֶשׁ tránh hàm ý không có trong nguyên văn rằng lễ vật được dâng “vào” nơi thánh. Chú thích nêu các cách hiểu “lễ vật thánh” và “phần đóng góp cho nơi thánh” để bảo lưu sự không hoàn toàn xác định của cụm.
