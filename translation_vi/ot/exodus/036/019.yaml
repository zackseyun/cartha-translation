  yaml_path: translation/ot/exodus/036/019.yaml
  text: He made a covering for the tent of ram skins dyed red[a], and a covering of fine leather above.
translation:
  language: vi
  text: Ông làm một tấm phủ cho Lều bằng da cừu đực nhuộm đỏ, và một tấm phủ bằng da thuộc tốt[a] ở phía trên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ תְּחָשִׁים chưa rõ nghĩa; có thể chỉ da bò biển, da cá heo, da cá cúi, hoặc theo cách dịch truyền thống là da lửng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Dạng wayyiqtol của עשה kể hành động quá khứ tiếp nối; tiếng Việt có thể dùng động từ đơn giản mà không cần thêm từ nối.
- source_word: מִכְסֶה לָאֹהֶל
  choice: cho Lều một tấm phủ
  rationale: מִכְסֶה là một lớp phủ, còn אֹהֶל mang nghĩa trực tiếp là “lều”; viết hoa “Lều” để chỉ công trình thánh cụ thể trong văn cảnh mà không đổi sang thuật ngữ rộng hơn.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: bằng da cừu đực nhuộm đỏ
  rationale: Giữ rõ vật liệu là da của cừu đực và sắc thái của מְאָדָּמִים là đã được làm đỏ, tức nhuộm đỏ.
- source_word: וּמִכְסֵה
  choice: và ... một tấm phủ
  rationale: Giữ sự lặp lại danh từ “tấm phủ” và không thêm ý diễn giải “tấm thứ hai”.
- source_word: עֹרֹת תְּחָשִׁים
  choice: bằng da thuộc hảo hạng
  rationale: Danh từ תְּחָשִׁים chưa xác định chắc chắn; cách dịch khái quát tránh khẳng định một loài vật mang tính suy đoán, còn chú thích bảo lưu các khả năng từ vựng.
- source_word: מִלְמָעְלָה
  choice: phía trên
  rationale: Diễn đạt vị trí của lớp phủ ngoài cùng một cách tự nhiên, không thêm đại từ chỉ quan hệ vốn không có trong nguyên văn.
