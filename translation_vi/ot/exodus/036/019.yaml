translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc hai lớp phủ của nguyên văn; dùng “Lều” thay vì nhập sẵn thuật ngữ giáo phái. Dấu chú thích đặt ngay sau cụm từ liên quan đến תְּחָשִׁים.
