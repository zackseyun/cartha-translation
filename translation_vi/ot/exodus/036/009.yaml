base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: vi
  text: Mỗi tấm màn dài hai mươi tám cu-bít[a] và rộng bốn cu-bít; tất cả các tấm màn đều có cùng một kích thước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một cu-bít thường được ước tính khoảng 45 xăng-ti-mét; hai mươi tám cu-bít khoảng 12,6 mét.
    reason: measurement_explanation
lexical_decisions:
- source_word: אֹרֶךְ
  choice: dài
  rationale: Diễn đạt tự nhiên chiều dài của vật trong cấu trúc đo kích thước tiếng Việt.
- source_word: יְרִיעָה
  choice: tấm màn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ một tấm vải lớn dùng làm màn/phần phủ; “tấm màn” vừa rõ đơn vị riêng lẻ vừa tự nhiên.
- source_word: הָאַחַת / הָאֶחָת
  choice: mỗi
  rationale: 'Nghĩa đen là “một”, nhưng ở đây có chức năng phân phối: số đo áp dụng cho từng tấm màn.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: hai mươi tám
  rationale: Cách diễn đạt số đếm thông dụng trong tiếng Việt hiện đại.
- source_word: אַמָּה
  choice: cu-bít
  rationale: Giữ nguyên đơn vị đo cổ của tiếng Hê-bơ-rơ thay vì quy đổi thiếu chắc chắn sang đơn vị hiện đại.
- source_word: רֹחַב
  choice: rộng
  rationale: Cách nói tự nhiên trong tiếng Việt khi nêu kích thước song song với “dài”.
- source_word: אַרְבַּע
  choice: bốn
  rationale: Chuyển trực tiếp số từ Hê-bơ-rơ.
- source_word: מִדָּה אַחַת
  choice: cùng một kích thước
  rationale: Cụm Hê-bơ-rơ nghĩa đen là “một số đo”; trong ngữ cảnh, cụm này khẳng định mọi tấm màn có kích thước đồng nhất.
- source_word: לְכָל הַיְרִיעֹת
  choice: tất cả các tấm màn đều
  rationale: Thể hiện đầy đủ phạm vi áp dụng cho toàn bộ các tấm màn và phù hợp cú pháp tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp tính từ “dài… rộng…” thay cho danh từ trừu tượng để câu đo kích thước tự nhiên trong tiếng Việt; giữ “cu-bít” nhằm minh bạch với đơn vị của nguyên văn.
