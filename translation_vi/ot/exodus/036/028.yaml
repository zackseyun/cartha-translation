translation:
  language: vi
  text: Ông làm hai tấm ván cho các góc của Đền Tạm ở phía sau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho các bộ phận ở góc của Đền Tạm, tại hai bên phía sau.” Các từ Hê-bơ-rơ mô tả hai đầu hoặc hai góc phía sau của công trình, và có thể nhấn mạnh vị trí ở góc hoặc những tấm ván góc được ghép theo cách đặc biệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: hai
  rationale: Dạng liên kết của số từ chỉ rõ số lượng hai; liên từ וּ được thể hiện tự nhiên qua sự tiếp nối của câu trong văn thuật xây dựng, không cần dịch máy móc là “và”.
- source_word: קְרָשִׁים
  choice: tấm ván
  rationale: Trong ngữ cảnh dựng Đền Tạm, từ này chỉ những tấm ván gỗ có chức năng kết cấu; “tấm ván” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: עָשָׂה
  choice: Ông làm
  rationale: Động từ עשה mang nghĩa thông thường là “làm”; chủ ngữ ngôi ba số ít được diễn đạt bằng “ông”, theo mạch văn nói về người thi công.
- source_word: לִ/מְקֻצְעֹת
  choice: cho các góc
  rationale: Từ này có thể chỉ vị trí góc hoặc các bộ phận ghép góc; bản chính dùng cách diễn đạt dễ hiểu nhưng giữ cách hiểu kiến trúc thay thế trong chú thích.
- source_word: הַ/מִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt đối với nơi ngự được dựng theo chỉ dẫn trong Xuất Ai Cập.
- source_word: בַּ/יַּרְכָתָיִם
  choice: ở phía sau
  rationale: Dạng số đôi chỉ hai phần hoặc hai đầu phía sau của công trình. “Ở phía sau” tránh lặp từ “góc”, còn sắc thái hai bên phía sau được ghi nhận trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “Đền Tạm” nhất quán cho מִשְׁכָּן; chú thích bảo tồn sự không chắc chắn về việc לִמְקֻצְעֹת chỉ vị trí góc hay các bộ phận ghép góc.
