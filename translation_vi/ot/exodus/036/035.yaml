  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב עָשָׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: vi
  text: Ông làm bức màn[a] bằng sợi xanh lam, tím, đỏ thắm[b] và vải lanh mịn xe sợi; ông làm các hình chê-ru-bim trên đó theo lối dệt hoa văn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “màn che.”
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ chỉ vật liệu hoặc sợi nhuộm màu đỏ thắm; cũng có thể dịch là “đỏ son.”
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “công việc của người thợ khéo léo” hoặc “công việc thêu hoa văn.” Cụm từ Hê-bơ-rơ chỉ kỹ thuật tạo hoa văn có tính nghệ thuật.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: bức màn
  rationale: Chỉ tấm màn ngăn bên trong Đền Tạm. “Bức màn” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại; “màn che” được ghi ở chú thích như một cách dịch khác.
- source_word: תְּכֵלֶת
  choice: chỉ xanh lam
  rationale: Từ này chỉ vật liệu được nhuộm màu xanh dùng trong hàng dệt của Đền Tạm. Thêm “chỉ” làm rõ đây là vật liệu dệt.
- source_word: אַרְגָּמָן
  choice: tím
  rationale: Cách dịch thông dụng cho vật liệu nhuộm màu tím quý giá; danh từ “chỉ” ở đầu chuỗi được hiểu chung cho các màu tiếp theo.
- source_word: תוֹלַעַת שָׁנִי
  choice: đỏ thắm
  rationale: Cụm từ chỉ vật liệu hoặc sợi nhuộm đỏ thắm; cách dịch giữ màu sắc chính, còn khả năng dịch “đỏ son” được nêu trong chú thích.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: sợi gai mịn xe
  rationale: שֵׁשׁ là vải hoặc sợi gai mịn, còn מָשְׁזָר mô tả sợi đã được xe. Cách diễn đạt này giữ cả chất liệu lẫn kỹ thuật chế tác.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: do thợ dệt hoa văn khéo léo thực hiện
  rationale: Cụm từ nói đến công việc dệt có thiết kế, tạo hoa văn một cách điêu luyện, chứ không chỉ lao động thủ công nói chung.
- source_word: כְּרֻבִים
  choice: các chê-ru-bim
  rationale: Phiên âm danh xưng của các hữu thể có cánh trong bối cảnh thánh; giữ sắc thái Kinh Thánh và tránh đồng nhất với hình tượng thiên thần nhỏ trong nghệ thuật về sau.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: trên màn có các chê-ru-bim
  rationale: Cú pháp cho thấy hình chê-ru-bim được đưa vào thiết kế của tấm màn. Cách diễn đạt tiếng Việt tự nhiên này không quyết định quá mức chúng được thêu hay dệt vào màn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp tự nhiên theo tiếng Việt, đồng thời giữ thứ tự vật liệu và ý niệm về các hình chê-ru-bim nằm trong thiết kế của bức màn. Không xác định quá mức kỹ thuật là thêu hay dệt; sự đa nghĩa được bảo lưu trong chú thích.
