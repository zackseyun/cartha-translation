revisions:
- from: Ông làm bức màn[a] bằng chỉ xanh lam, tím, đỏ thắm[b] và sợi gai mịn xe; trên màn có các chê-ru-bim, do thợ dệt hoa văn khéo léo thực hiện[c].
  to: Ông làm bức màn[a] bằng sợi xanh lam, tím, đỏ thắm[b] và vải lanh mịn xe sợi; ông làm các hình chê-ru-bim trên đó theo lối dệt hoa văn[c].
  rationale: Sửa chất liệu “sợi gai” thành “vải lanh” để phù hợp với tiếng Hê-bơ-rơ và cách gọi tiếng Việt hiện đại. Sắp xếp lại vế cuối để giữ quan hệ giữa các hình chê-ru-bim và công việc tạo hoa văn, đồng thời không quyết định kỹ thuật cụ thể là thêu hay dệt.
