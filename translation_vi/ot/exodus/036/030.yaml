  register: Văn phong hiện đại, trang trọng và rõ ràng. Câu được sắp xếp lại nhẹ theo cú pháp tiếng Việt để thể hiện quan hệ giữa tám khung, mười sáu chân đế và hai chân đế cho mỗi khung; không thêm diễn giải thần học.
