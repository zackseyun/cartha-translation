base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/030.yaml
  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: vi
  text: Có tám khung[a] và mười sáu chân đế[b] bằng bạc—mỗi khung có hai chân đế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm ván”; từ Hê-bơ-rơ chỉ các bộ phận kết cấu dựng đứng của Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ổ đỡ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Có
  rationale: Dùng cấu trúc tồn tại tự nhiên trong tiếng Việt cho היה ở ngữ cảnh liệt kê; liên từ וְ được hòa vào mạch văn thay vì dịch máy móc.
- source_word: קְרָשִׁים / הַקֶּרֶשׁ
  choice: khung
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ các bộ phận kết cấu dựng đứng. “Khung” diễn đạt rõ chức năng, còn khả năng hiểu là “tấm ván” được giữ trong chú thích.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: chân đế
  rationale: Chỉ bộ phận bằng kim loại nâng đỡ và giữ các khung. “Chân đế” tự nhiên, dễ hiểu trong tiếng Việt hiện đại; “ổ đỡ” là phương án kỹ thuật hơn.
- source_word: כֶּסֶף
  choice: bằng bạc
  rationale: Diễn đạt trực tiếp vật liệu cấu tạo của các chân đế.
- source_word: שִׁשָּׁה עָשָׂר
  choice: mười sáu
  rationale: Chuyển đúng số đếm trong bản Hê-bơ-rơ.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: mỗi khung có hai chân đế
  rationale: 'Cụm lặp “hai chân đế, hai chân đế” cùng danh từ số ít xác định có ý nghĩa phân phối: hai chân đế cho từng khung. Cách dịch này truyền đạt tự nhiên ý nghĩa ấy và phù hợp với tổng số mười sáu chân đế cho tám khung.'
theological_decisions: []
