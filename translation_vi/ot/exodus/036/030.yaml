  terminology: “Khung” là lựa chọn chức năng phù hợp cho קְרָשִׁים; chú thích giữ đúng phương án từ vựng “tấm ván”. “Chân đế” diễn đạt tốt אַדָנִים trong ngữ cảnh các bộ phận đỡ bằng bạc; chú thích “ổ đỡ” bảo tồn lựa chọn thay thế. “Đền Tạm” phù hợp với cách gọi thông dụng trong tiếng Việt.
