base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/025.yaml
  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: vi
  text: Còn về phía thứ hai của Đền Tạm, tức phía bắc, ông làm hai mươi tấm ván.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hai mươi khung”. Từ Hê-bơ-rơ này có thể chỉ các tấm kết cấu hoặc các khung; hình dạng chính xác của những cấu kiện thuộc Đền Tạm vẫn còn được tranh luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: Còn về phía
  rationale: צֶלַע trong ngữ cảnh cấu trúc Đền Tạm chỉ một phía hay mặt bên; cách dịch này cũng thể hiện tự nhiên liên từ וּ và giới từ לְ trong mạch tường thuật.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: מִשְׁכָּן là thuật ngữ chỉ nơi thánh lưu động trong hoang mạc; “Đền Tạm” là cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: הַשֵּׁנִית
  choice: thứ hai
  rationale: Tính từ xác định phía tương ứng thứ hai trong trình tự, nên giữ nghĩa cụ thể thay vì dịch rộng là “phía kia”.
- source_word: לִפְאַת צָפוֹן
  choice: tức phía bắc
  rationale: Cụm từ xác định hướng của phía thứ hai; “tức” làm rõ quan hệ đồng vị một cách tự nhiên mà không thêm nội dung.
- source_word: עָשָׂה
  choice: ông làm
  rationale: עָשָׂה là động từ thông dụng nghĩa là “làm”; đại từ “ông” nối tự nhiên với chủ thể nam số ít đã có trong văn cảnh.
- source_word: עֶשְׂרִים
  choice: hai mươi
  rationale: Chuyển dịch trực tiếp số từ.
- source_word: קְרָשִׁים
  choice: tấm ván
  rationale: קֶרֶשׁ chỉ các cấu kiện bằng gỗ của Đền Tạm. “Tấm ván” là cách dịch truyền thống, dễ hình dung, nhưng hình dạng chính xác vẫn chưa chắc chắn nên giữ phương án khác trong chú thích.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ trật tự thông tin của tiếng Hê-bơ-rơ, đồng thời dùng “tức phía bắc” để diễn đạt tự nhiên quan hệ xác định phương hướng. Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
