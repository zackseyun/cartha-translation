base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: vi
  text: Ông làm năm mươi móc cài bằng vàng, rồi dùng các móc ấy nối các tấm màn lại với nhau, khiến Đền Tạm thành một.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “và Đền Tạm là một.” Câu Hê-bơ-rơ có thể diễn đạt trạng thái; bản dịch chính làm nổi bật kết quả của việc nối các tấm màn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ עשה có nghĩa thông thường là “làm”; cách dịch này tự nhiên và không diễn giải quá mức.
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: năm mươi móc cài bằng vàng
  rationale: קֶרֶס chỉ vật dùng để gắn các tấm màn với nhau. “Móc cài” diễn đạt chức năng nối mà không xác định quá cụ thể hình dạng; “bằng vàng” nói rõ chất liệu.
- source_word: וַיְחַבֵּר
  choice: rồi ... nối
  rationale: חבר mang nghĩa nối hoặc kết lại. “Nối” phù hợp với thao tác ghép các tấm màn; “rồi” thể hiện diễn tiến của chuỗi động từ kể chuyện.
- source_word: אֶת הַיְרִעֹת
  choice: những tấm màn
  rationale: יְרִיעוֹת là các tấm vải tạo nên phần phủ của Đền Tạm. “Những tấm màn” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: אַחַת אֶל אַחַת
  choice: lại với nhau
  rationale: Cụm lặp giống cái số ít diễn tả quan hệ tương hỗ giữa các tấm màn; tiếng Việt tự nhiên dùng “với nhau”.
- source_word: בַּקְּרָסִים
  choice: dùng các móc ấy
  rationale: Giới từ ב ở đây chỉ phương tiện. “Dùng” làm rõ chức năng công cụ, còn “ấy” liên kết với năm mươi móc vừa được nhắc đến.
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: khiến Đền Tạm trở thành một khối
  rationale: Cách dịch nêu kết quả của việc nối các tấm màn. “Một khối” diễn đạt sự hợp nhất thành một cấu trúc mà không hàm ý đồng nhất bản thể.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: “Đền Tạm” là thuật ngữ tiếng Việt quen thuộc cho מִשְׁכָּן trong sách Xuất Ê-díp-tô Ký, chỉ nơi thánh có thể tháo lắp và di chuyển.
theological_decisions:
- issue: Sắc thái của וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: khiến Đền Tạm trở thành một khối
  alternative: và Đền Tạm là một
  rationale: Ngữ cảnh cho phép hiểu mệnh đề là kết quả của hành động nối, nhưng hình thức Hê-bơ-rơ cũng có thể được dịch sát hơn là “và Đền Tạm là một.” Bản dịch chính ưu tiên quan hệ kết quả, còn chú thích bảo tồn cách hiểu sát hình thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đền Tạm” theo cách gọi Kinh Thánh quen thuộc; “móc cài” và “tấm màn” là những từ cụ thể, phổ thông. Đại từ “ông” giữ chủ thể nam số ít của mạch văn mà không tự thêm tên riêng.
