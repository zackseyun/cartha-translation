base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: vi
  text: Ông làm bốn trụ bằng gỗ keo cho bức màn ấy, dát vàng lên các trụ; các móc của chúng bằng vàng; rồi ông đúc cho chúng bốn đế bằng bạc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוּדֵי
  choice: trụ
  rationale: Chỉ các bộ phận thẳng đứng dùng để nâng đỡ; “trụ” tự nhiên và chính xác trong ngữ cảnh cấu tạo Đền Tạm.
- source_word: שִׁטִּים
  choice: gỗ keo
  rationale: Chỉ loại gỗ acacia được dùng xuyên suốt trong việc dựng Đền Tạm; “gỗ keo” là cách gọi rõ ràng trong tiếng Việt hiện đại.
- source_word: וַיְצַפֵּם
  choice: dát vàng lên các trụ
  rationale: Động từ chỉ việc phủ một lớp kim loại lên vật; cách diễn đạt này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: וָוֵיהֶם
  choice: các móc của chúng
  rationale: Trong ngữ cảnh Đền Tạm, danh từ này nhiều khả năng chỉ các móc hoặc bộ phận liên kết gắn với các trụ.
- source_word: אַדְנֵי
  choice: đế
  rationale: Chỉ những bộ phận nền bằng kim loại để đặt hoặc giữ các trụ; “đế” dễ hiểu hơn “ổ trụ” trong văn phong phổ thông.
- source_word: כָסֶף
  choice: bạc
  rationale: Tên vật liệu kim loại được nêu trực tiếp.
- source_word: לָהּ
  choice: cho bức màn ấy
  rationale: Đại từ giống cái số ít quy chiếu về bức màn ở câu trước; tiếng Việt nên nói rõ sở chỉ để tránh đại từ “nó” thiếu trang trọng hoặc mơ hồ.
- source_word: וַיִּצֹק
  choice: ông đúc
  rationale: Trong ngữ cảnh chế tác các đế kim loại, động từ mang nghĩa đúc kim loại, không chỉ đơn thuần là đổ.
theological_decisions: []
translation_notes:
  register: 'Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ chuỗi hành động chế tác của nguyên văn, dùng “ông” cho chủ thể đã được xác định trong mạch văn trước. Không tiếp nhận hai chú thích tiếng Anh vì chúng dường như bị đặt nhầm: “four silver sockets” thuộc mệnh đề cuối chứ không phải phương án cho việc dát vàng, còn chú thích về đại từ không phù hợp với vị trí marker đã cho. Sở chỉ của לָהּ được làm rõ ngay trong chính văn.'
