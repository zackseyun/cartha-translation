  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: vi
  text: 'Ông làm bốn mươi đế bạc đặt dưới hai mươi khung: mỗi khung có hai đế cho hai mộng của nó.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי
  choice: đế
  rationale: Chỉ các bệ bạc có lỗ để tiếp nhận mộng của khung; “đế” tự nhiên và chính xác trong ngữ cảnh kết cấu.
- source_word: הַקְּרָשִׁים
  choice: khung
  rationale: Các bộ phận đứng tạo nên vách Đền Tạm; “khung” phù hợp với chức năng kết cấu hơn cách hiểu chung chung là tấm ván.
- source_word: יְדֹתָיו
  choice: mộng
  rationale: Nghĩa đen là “tay”, nhưng trong ngữ cảnh nghề mộc chỉ hai phần nhô ra cắm vào các đế; thuật ngữ tiếng Việt tự nhiên là “mộng”.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: khung thứ nhất ... khung kế tiếp
  rationale: Hai lần dùng “một” mang ý phân phối giữa các khung trong tổng số hai mươi, không nhất thiết đối lập “một” với “khung kia”; cách dịch này làm rõ mô thức lặp mà không thay đổi số lượng.
