  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: vi
  text: 'Ông làm các khung[a] cho Đền Tạm: hai mươi khung cho phía nam, hướng về phương nam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các tấm ván.” Tiếng Hê-bơ-rơ dùng hai cách diễn đạt liên tiếp cùng chỉ hướng nam (“nam, về phía nam”) để nhấn mạnh hoặc xác định phương hướng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ Qal wayyiqtol của עשה thuật lại hành động đã xảy ra; chủ ngữ số ít được giữ theo ngữ cảnh.
- source_word: הַקְּרָשִׁים
  choice: các khung
  rationale: Trong việc dựng Đền Tạm, קֶרֶשׁ chỉ các cấu kiện đứng của công trình. “Khung” diễn đạt chức năng kiến trúc tự nhiên hơn “ván”, nhưng phương án “ván” vẫn được ghi nhận trong chú thích.
- source_word: לַמִּשְׁכָּן
  choice: cho Đền Tạm
  rationale: מִשְׁכָּן là từ quen dùng cho nơi thánh lưu động trong sách Xuất Ai Cập; “Đền Tạm” là cách gọi trang trọng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: hai mươi khung
  rationale: Dịch trực tiếp số từ và danh từ được lặp lại, giữ văn phong liệt kê của nguyên văn.
- source_word: לִפְאַת
  choice: cho phía
  rationale: פֵּאָה ở đây chỉ một phía của công trình; “phía” phù hợp với mô tả kiến trúc.
- source_word: נֶגֶב
  choice: nam
  rationale: Ở đây נֶגֶב được dùng theo nghĩa phương hướng, không phải tên riêng vùng Nê-ghép.
- source_word: תֵּימָנָה
  choice: hướng về phương nam
  rationale: Cụm này giữ yếu tố chỉ hướng bổ sung sau נֶגֶב, đồng thời tự nhiên hơn trong tiếng Việt so với việc lặp đơn thuần “nam, về phía nam”.
