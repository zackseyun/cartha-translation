  text: He made fifty bronze clasps to join the tent[a], so that it would be one.
translation:
  language: vi
  text: Ông làm năm mươi móc nối bằng đồng để nối Lều[a] lại thành một.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đền Tạm”; từ Hê-bơ-rơ ở đây có nghĩa đen là “lều” nhưng chỉ về toàn bộ cấu trúc Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Thể wayyiqtol của עשה tiếp diễn mạch thuật sự; quá khứ được hiểu tự nhiên từ ngữ cảnh tiếng Việt mà không cần thêm “đã”.
- source_word: קַרְסֵי
  choice: móc nối
  rationale: Danh từ chỉ các chi tiết kim loại dùng để gắn các phần màn với nhau; “móc nối” cụ thể và dễ hiểu hơn “khuy” trong ngữ cảnh kiến tạo này.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng hoặc hợp kim đồng; “đồng” là cách gọi tự nhiên, không xác định quá mức thành phần hợp kim.
- source_word: חֲמִשִּׁים
  choice: năm mươi
  rationale: Số đếm trực tiếp bổ nghĩa cho các móc nối.
- source_word: לְחַבֵּר
  choice: để nối ... lại
  rationale: Động từ nguyên mẫu với לְ diễn tả mục đích; cách nói này tự nhiên trong tiếng Việt và giữ rõ chức năng liên kết.
- source_word: אֶת הָאֹהֶל
  choice: Lều
  rationale: אֹהֶל có nghĩa trực tiếp là “lều”; trong ngữ cảnh, đây là Lều Thánh. Viết hoa cho thấy nó chỉ công trình cụ thể mà không thay thế từ nguồn bằng thuật ngữ diễn giải.
- source_word: לִהְיוֹת אֶחָד
  choice: thành một
  rationale: Cụm היה + אֶחָד diễn tả kết quả hoặc mục đích là toàn bộ Lều trở nên một thể thống nhất; bản dịch ngắn gọn vẫn giữ được cả sắc thái mục đích-kết quả.
theological_decisions: []
