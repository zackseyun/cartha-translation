  register: Văn phong thuật sự trang trọng, hiện đại và dễ hiểu. “Móc nối” diễn đạt rõ công dụng của vật dụng; “Lều” giữ sát từ Hê-bơ-rơ và chú thích cung cấp thuật ngữ quen thuộc “Đền Tạm”.
