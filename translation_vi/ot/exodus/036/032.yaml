  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: vi
  text: và năm thanh ngang cho các tấm ván ở mặt bên thứ hai của Đền Tạm, và năm thanh ngang cho các tấm ván của Đền Tạm ở phía sau cùng, về hướng tây.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְרִיחִם
  choice: thanh ngang
  rationale: Trong ngữ cảnh dựng Đền Tạm, từ này chỉ các thanh gỗ nằm ngang dùng để liên kết các tấm ván; “thanh ngang” tự nhiên và rõ chức năng hơn “thanh” đơn thuần.
- source_word: קַרְשֵׁי
  choice: các tấm ván
  rationale: Từ này chỉ những cấu kiện gỗ tạo thành kết cấu Đền Tạm. “Tấm ván” giữ được hình ảnh vật liệu mà không xác quyết cách phục dựng chúng là khung rỗng.
- source_word: צֶלַע
  choice: mặt
  rationale: Ở đây từ này chỉ một phía của công trình. “Mặt” phù hợp với cách nói tiếng Việt về hai mặt bên của một kiến trúc.
- source_word: הַשֵּׁנִית
  choice: thứ hai
  rationale: Giữ sát nghĩa thứ tự của tiếng Hê-bơ-rơ, thay vì diễn giải thành “mặt kia”.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là tên gọi quen thuộc và rõ nghĩa trong tiếng Việt dành cho cấu trúc thánh này trong sách Xuất Hành.
- source_word: לַיַּרְכָתַיִם
  choice: ở tận phía sau
  rationale: Cách dịch này thể hiện cả vị trí phía sau lẫn sắc thái xa, tận cùng của từ Hê-bơ-rơ.
- source_word: יָמָּה
  choice: về hướng tây
  rationale: Trong ngữ cảnh định hướng kiến trúc, từ này chỉ hướng tây; cách dịch giữ sắc thái phương hướng của trạng từ Hê-bơ-rơ.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: và năm ... cùng năm
  rationale: Giữ phép phối hợp và nhịp liệt kê của nguyên văn, đồng thời tránh lặp từ nối cứng nhắc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc liệt kê của nguyên văn. Không thêm chú thích vì các lựa chọn từ vựng có thể được thể hiện rõ ngay trong bản dịch, và chú thích [b] của lớp tham khảo tiếng Anh dường như đặt sai vị trí so với nội dung của nó.
