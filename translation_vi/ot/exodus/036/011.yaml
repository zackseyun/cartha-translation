base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: vi
  text: Ông làm các vòng bằng sợi xanh lam ở mép tấm màn thứ nhất, tại đầu của bộ màn ghép thứ nhất[a]; ông cũng làm như vậy ở mép tấm màn ngoài cùng của bộ màn ghép thứ hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại chỗ ghép nối.” Từ Hê-bơ-rơ chỉ chỗ hoặc cách các tấm màn được nối với nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: các vòng
  rationale: Danh từ này chỉ những vòng bằng vật liệu dệt dùng để liên kết các tấm màn; “các vòng” là cách diễn đạt trực tiếp và tự nhiên trong ngữ cảnh chế tác Đền Tạm.
- source_word: תְּכֵלֶת
  choice: sợi xanh lam
  rationale: Trong các bản văn về Đền Tạm, từ này chỉ vật liệu dệt đã nhuộm màu xanh, không chỉ màu sắc trừu tượng; “sợi xanh lam” làm rõ chất liệu dùng làm vòng.
- source_word: שְׂפַת
  choice: mép
  rationale: Nghĩa đen liên quan đến “môi,” nhưng tại đây chỉ rìa của tấm màn; “mép” là từ tự nhiên và chính xác trong tiếng Việt.
- source_word: הַיְרִיעָה
  choice: tấm màn
  rationale: Trong ngữ cảnh này, từ chỉ từng tấm thuộc lớp màn che của Đền Tạm; “tấm màn” vừa rõ nghĩa vừa giữ được tính cụ thể.
- source_word: הָאֶחָת
  choice: thứ nhất
  rationale: Dù hình thức sát nghĩa là “một,” cấu trúc đối ứng với “thứ hai” ở cuối câu cho thấy từ này có chức năng thứ tự.
- source_word: מִקָּצָה
  choice: ở đầu
  rationale: Cụm từ xác định vị trí tại đầu mút của tấm màn hay bộ màn, nơi diễn ra việc ghép nối.
- source_word: בַּמַּחְבָּרֶת
  choice: bộ màn thứ nhất được ghép lại
  rationale: מַחְבָּרֶת có thể chỉ chỗ, tình trạng hoặc cách sắp xếp ghép nối các tấm màn. Cách dịch này diễn đạt tự nhiên nhóm màn đã được nối; “thứ nhất” được làm rõ từ sự đối lập với bộ thứ hai ở cuối câu.
- source_word: כֵּן עָשָׂה
  choice: ông cũng làm như vậy
  rationale: Cụm từ nêu hành động tương ứng trên mép tấm màn kia; cách dịch này giữ phép song hành mà tránh lặp câu nặng nề.
- source_word: הַקִּיצוֹנָה
  choice: ngoài cùng
  rationale: Tính từ chỉ tấm màn nằm ở đầu ngoài của bộ; “ngoài cùng” giữ rõ sắc thái không gian.
- source_word: הַשֵּׁנִית
  choice: thứ hai
  rationale: Từ xác định bộ màn ghép thứ hai, đối ứng trực tiếp với bộ thứ nhất.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” theo chủ thể nam đã được xác lập trong mạch văn; giữ cấu trúc song hành của câu Hê-bơ-rơ, đồng thời diễn đạt các nhóm màn ghép bằng tiếng Việt tự nhiên.
