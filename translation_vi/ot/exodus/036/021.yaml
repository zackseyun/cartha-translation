  text: The length of each frame was ten cubits[a], and the width of each frame was a cubit and a half.
translation:
  language: vi
  text: Chiều dài của mỗi khung là mười cu-bít[a], và chiều rộng của mỗi khung là một cu-bít rưỡi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Khung” cũng có thể dịch là “tấm ván”; từ Hê-bơ-rơ קֶרֶשׁ chỉ các cấu kiện của Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת
  choice: mười cu-bít
  rationale: Giữ nguyên đơn vị đo cổ đại אַמָּה bằng dạng phiên âm quen dùng, thay vì quy đổi sang đơn vị hiện đại.
- source_word: אֹרֶךְ
  choice: chiều dài
  rationale: Danh từ chỉ kích thước theo chiều dài; cách dịch này vừa sát cấu trúc Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
- source_word: הַקָּרֶשׁ
  choice: tấm khung
  rationale: Trong ngữ cảnh Đền Tạm, קֶרֶשׁ chỉ các cấu kiện đứng của công trình. “Tấm khung” diễn đạt chức năng kết cấu nhưng vẫn giữ sắc thái của một cấu kiện dạng tấm; “tấm ván” là một khả năng khác.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: một cu-bít rưỡi
  rationale: Diễn đạt tự nhiên thành ngữ đo lường theo nghĩa đen là “một cu-bít và nửa cu-bít”.
- source_word: רֹחַב
  choice: chiều rộng
  rationale: Tương đương rõ ràng và thông dụng trong tiếng Việt hiện đại.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: mỗi tấm khung
  rationale: Cụm từ theo nghĩa đen là “tấm khung duy nhất/một tấm khung”, nhưng trong ngữ cảnh quy định kích thước có nghĩa phân phối, tức kích thước áp dụng cho từng tấm.
