source:
  edition: WLC
  text: וַ/יְחַבֵּר֙ אֶת חֲמֵ֣שׁ הַ/יְרִיעֹ֔ת אַחַ֖ת אֶל אֶחָ֑ת וְ/חָמֵ֤שׁ יְרִיעֹת֙ חִבַּ֔ר אַחַ֖ת אֶל אֶחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/010.yaml
  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: vi
  text: Ông nối năm tấm màn lại với nhau, rồi nối năm tấm màn kia lại với nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ ở vế thứ hai là “và năm tấm màn”; từ “kia” được thêm vào để làm rõ đây là nhóm năm tấm thứ hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: nối ... lại với nhau
  rationale: Động từ חבר có nghĩa là nối hoặc kết lại. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và không xác định quá mức phương thức gắn các tấm màn.
- source_word: יְרִיעֹת
  choice: tấm màn
  rationale: Trong bối cảnh Đền Tạm, từ này chỉ những tấm vải lớn dùng làm màn phủ; “tấm màn” vừa rõ nghĩa vừa tự nhiên.
- source_word: חֲמֵשׁ
  choice: năm
  rationale: Số đếm được chuyển dịch trực tiếp.
- source_word: אַחַת אֶל אֶחָת
  choice: lại với nhau
  rationale: Thành ngữ Hê-bơ-rơ diễn tả việc nối các tấm trong mỗi nhóm với nhau; cách nói tiếng Việt này truyền đạt tự nhiên ý nghĩa tương hỗ ấy.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: rồi ... năm tấm màn kia
  rationale: Nguyên văn là “và năm tấm màn”; từ “kia” làm rõ đây là nhóm năm tấm thứ hai được cấu trúc song song ngụ ý, còn “rồi” giúp câu tiếng Việt trôi chảy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” theo chủ thể số ít nam đã được nêu trong mạch văn; câu giữ cấu trúc song song của nguyên bản nhưng điều chỉnh nhẹ để tự nhiên trong tiếng Việt.
