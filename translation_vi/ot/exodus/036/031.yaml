  text: He made five bars of acacia wood for the frames of one side of the tabernacle[a].
translation:
  language: vi
  text: Ông làm năm thanh ngang bằng gỗ keo cho các khung[a] ở một bên của Đền Tạm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tấm ván”, tức những bộ phận kết cấu dựng đứng của Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ wayyiqtol của עשה tiếp nối trình thuật; tiếng Việt không cần dịch liên từ וַ־ một cách máy móc.
- source_word: בְּרִיחֵי
  choice: thanh ngang
  rationale: Trong kết cấu Đền Tạm, từ này chỉ các thanh chạy ngang để liên kết những bộ phận dựng đứng; “thanh ngang” rõ nghĩa hơn “then”.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm danh từ chỉ vật liệu lấy từ cây keo; đây là cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: חֲמִשָּׁה
  choice: năm
  rationale: Số đếm trực tiếp bổ nghĩa cho các thanh ngang.
- source_word: לְקַרְשֵׁי
  choice: để giữ các khung
  rationale: קֶרֶשׁ chỉ những bộ phận kết cấu dựng đứng. Giới từ לְ־ diễn tả các thanh được làm cho những khung này; thêm “giữ” làm rõ chức năng vốn hàm chứa trong ngữ cảnh mà không thay đổi nội dung.
- source_word: צֶלַע
  choice: ở một bên
  rationale: Trong ngữ cảnh kiến trúc, צֶלַע có nghĩa là một bên hoặc mặt bên của công trình.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Thuật ngữ tiếng Việt quen thuộc chỉ nơi thánh lưu động trong sách Xuất Hành.
- source_word: הָאֶחָת
  choice: một
  rationale: Dạng giống cái số ít phù hợp với צֶלַע và phân biệt một bên với bên còn lại, không nhất thiết mang nghĩa thứ tự “thứ nhất”.
