  text: Then all the skilled men who were doing all the work of the sanctuary came[a], each from the work that he was doing,
translation:
  language: vi
  text: Bấy giờ, tất cả những người thợ lành nghề đang làm mọi công việc nơi thánh đều đến, mỗi người rời công việc mình đang làm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ sát nghĩa: “người, người từ công việc của mình mà họ đang làm”; đây là một lối nói phân phối, nghĩa là mỗi người rời công việc mình đang làm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: đều đến
  rationale: Động từ wayyiqtol của בוא tiếp nối mạch kể; “đến” là cách diễn đạt tự nhiên, còn “đều” phối hợp với כָּל để chỉ toàn thể nhóm.
- source_word: כָּל הַחֲכָמִים
  choice: tất cả những người thợ lành nghề
  rationale: Trong ngữ cảnh chế tác Đền Tạm, חֲכָמִים chỉ những người có kỹ năng thủ công, không chủ yếu nói về sự khôn ngoan trí thức. “Người thợ lành nghề” tự nhiên và giữ được sắc thái nghề nghiệp.
- source_word: הָעֹשִׂים אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: đang làm mọi công việc cho nơi thánh
  rationale: Phân từ הָעֹשִׂים diễn tả hoạt động đang tiếp diễn; מְלֶאכֶת là công việc lao động/chế tác, còn הַקֹּדֶשׁ trong ngữ cảnh này chỉ nơi thánh. “Cho nơi thánh” diễn đạt tự nhiên quan hệ của công việc với nơi thánh.
- source_word: אִישׁ אִישׁ
  choice: mỗi người
  rationale: Sự lặp lại danh từ tạo ý phân phối, nghĩa là từng người một; “mỗi người” truyền đạt trực tiếp và tự nhiên.
- source_word: מִמְּלַאכְתּוֹ
  choice: rời công việc mình
  rationale: מִן chỉ sự đi ra khỏi hoặc rời khỏi công việc đang đảm trách; đại từ phản thân “mình” giữ rõ quy chiếu phân phối cho từng người.
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: đang làm
  rationale: Nguyên văn dùng đại từ số nhiều nhưng đứng sau cấu trúc phân phối אִישׁ אִישׁ. Tiếng Việt có thể giữ tự nhiên cả hai lớp nghĩa bằng “mỗi người… mình đang làm”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Người thợ lành nghề” dễ hiểu hơn cách dịch sát chữ “những người khôn ngoan” và phù hợp ngữ cảnh chế tác Đền Tạm. Dấu chú thích [a] được đặt sau toàn bộ cụm phân phối mà chú thích giải thích.
