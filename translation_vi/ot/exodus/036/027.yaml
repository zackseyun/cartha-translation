  yaml_path: translation/ot/exodus/036/027.yaml
  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: vi
  text: Còn ở phía sau Đền Tạm, về hướng tây, ông làm sáu khung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm ván”. Từ Hê-bơ-rơ có thể chỉ các tấm ván hoặc các khung dùng làm kết cấu; ở đây chọn “khung” vì từ này có thể phù hợp hơn với cấu tạo của Đền Tạm.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Còn ở phía sau
  rationale: Cụm liên từ–giới từ mở sang một chi tiết xây dựng mới; danh từ số nhiều dạng liên kết chỉ phần tận cùng hoặc phần phía sau. Trong tiếng Việt, “ở phía sau” diễn đạt tự nhiên vị trí kiến trúc mà không gượng ép giữ hình thức số nhiều.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là thuật ngữ quen thuộc, trang trọng và dễ hiểu trong tiếng Việt cho cấu trúc thánh nơi Đức Chúa Trời ngự giữa dân Y-sơ-ra-ên; chữ “Tạm” phản ánh tính chất nơi cư ngụ dạng lều mà không đồng nhất nó với đền thờ cố định.
- source_word: יָמָּה
  choice: về hướng tây
  rationale: Từ này nguyên nghĩa là “về phía biển” nhưng trong cách định hướng của tiếng Hê-bơ-rơ Kinh Thánh có chức năng chỉ hướng tây. Cách dịch này giữ rõ sắc thái phương hướng.
- source_word: עָשָׂה
  choice: ông làm
  rationale: Dịch trực tiếp động từ thông dụng “làm”; đại từ “ông” theo mạch văn chỉ Bết-sa-lê-ên, chủ thể của phần tường thuật.
- source_word: שִׁשָּׁה
  choice: sáu
  rationale: Số đếm được chuyển dịch trực tiếp.
- source_word: קְרָשִׁים
  choice: khung
  rationale: Thuật ngữ chỉ các cấu kiện đứng của Đền Tạm. “Khung” phù hợp với chức năng kết cấu có thể có của chúng, nhưng “tấm ván” vẫn là khả năng từ vựng thực sự nên được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Còn” để chuyển sang hạng mục xây dựng kế tiếp; giữ riêng cụm “về hướng tây” nhằm phản ánh cấu trúc và lực định hướng của nguyên văn.
