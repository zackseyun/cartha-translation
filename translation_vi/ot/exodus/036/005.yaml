base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: vi
  text: 'Họ nói với Môi-se: “Dân chúng đang đem đến nhiều hơn mức cần cho công việc mà Gia-vê đã truyền phải thực hiện.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Dân chúng đang đem đến quá nhiều cho công việc.” Cụm từ Hê-bơ-rơ nhấn mạnh rằng các vật được đóng góp vượt quá nhu cầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: Họ nói với Môi-se
  rationale: Công thức kể chuyện dẫn vào lời trực tiếp; tiếng Việt tự nhiên không cần dịch lặp לֵאמֹר là “rằng/nói rằng” sau động từ “nói”.
- source_word: מַרְבִּים ... לְהָבִיא מִדֵּי
  choice: đang đem đến quá nhiều, vượt mức cần thiết
  rationale: Kết hợp phân từ Hifil, động từ nguyên mẫu và מִדֵּי diễn tả hành động đang tiếp diễn và số lượng vượt quá mức đủ dùng.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ tập thể dân Y-sơ-ra-ên; “dân chúng” tự nhiên trong ngữ cảnh báo cáo với Môi-se.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: cho công việc
  rationale: Hai danh từ gần nghĩa mô tả lao động phục vụ công trình; tiếng Việt gộp thành “công việc” để tránh cấu trúc nặng và không tự nhiên như “công việc của nhiệm vụ”.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: mà Đức Giê-hô-va đã truyền phải thực hiện
  rationale: Giữ mệnh đề quan hệ, quyền truyền lệnh của YHWH và ý nghĩa công việc phải được thi hành; lối diễn đạt bị động vô nhân xưng phù hợp tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc, trang trọng trong tiếng Việt để biểu thị trực tiếp Danh Giao Ước, thay vì thay bằng tước hiệu “CHÚA”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn dùng Danh riêng của Đức Chúa Trời. Bản dịch giữ một dạng tên riêng thay vì chuyển thành tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc và trang trọng, không làm thay đổi chức năng của danh trong câu.
- issue: Mức độ dư thừa của lễ vật
  choice: quá nhiều, vượt mức cần thiết
  alternative: nhiều hơn mức đủ
  rationale: Cụm מַרְבִּים ... מִדֵּי nhấn mạnh vật liệu dân đem đến vượt nhu cầu thực tế, nhưng không hàm ý đạo đức rằng việc dâng hiến của họ là sai trái.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Câu trực tiếp ngắn gọn; dùng “đang đem đến” để thể hiện hành động tiếp diễn. Dấu chú thích [a] đặt trong chính văn và tương ứng đầy đủ với chú thích.
