  rationale: Bản sửa giữ cấu trúc lời thuật và ý hành động đang diễn ra, diễn đạt mức dư thừa một cách gọn tự nhiên, đồng thời điều chỉnh יהוה theo quyết định thuật ngữ của POB. Chú thích vẫn gắn đúng sau câu có liên quan và giải thích lựa chọn từ ngữ mà không thêm diễn giải giáo phái.
