translation:
  language: vi
  text: 'và bốn mươi đế bạc của chúng: hai đế dưới một tấm ván[a], và hai đế dưới một tấm ván.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “khung”. Tiếng Hê-bơ-rơ lặp lại cụm “một tấm ván” trong cả hai vế.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: và bốn mươi
  rationale: Liên từ tiếp nối danh sách các bộ phận đã được chế tác; số từ được chuyển dịch trực tiếp.
- source_word: אַדְנֵי/הֶם
  choice: các đế của chúng
  rationale: Trong ngữ cảnh Đền Tạm, אֲדָנִים chỉ các bộ phận đỡ ở chân những khung; “đế” là cách gọi rõ ràng, tự nhiên trong tiếng Việt hiện đại. Hậu tố sở hữu số nhiều được giữ bằng “của chúng”.
- source_word: כָּסֶף
  choice: bằng bạc
  rationale: Danh từ chỉ vật liệu làm các đế; cấu trúc “bằng bạc” tự nhiên và chính xác trong tiếng Việt.
- source_word: שְׁנֵי אֲדָנִים
  choice: hai đế
  rationale: Giữ nhất quán với cách dịch אֲדָנִים ở đầu câu và chuyển số lượng trực tiếp.
- source_word: תַּחַת
  choice: dưới
  rationale: Giới từ diễn tả vị trí của các đế ở bên dưới mỗi khung.
- source_word: הַ/קֶּרֶשׁ
  choice: khung
  rationale: Trong cấu trúc Đền Tạm, קֶרֶשׁ là một bộ phận đứng có chức năng kết cấu. “Khung” truyền đạt chức năng ấy rõ hơn trong tiếng Việt hiện đại, còn “tấm ván” vẫn là một khả năng từ vựng chính đáng.
- source_word: הָ/אֶחָד
  choice: một
  rationale: Tiếng Hê-bơ-rơ có dạng xác định, theo nghĩa đen là “cái một”. Tiếng Việt diễn đạt tự nhiên bằng “một”; đồng thời giữ nguyên sự lặp lại “một khung” ở cả hai vế thay vì tự đổi vế sau thành “khung kia”.
