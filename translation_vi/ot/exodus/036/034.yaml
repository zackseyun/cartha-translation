base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: vi
  text: Ông bọc các khung[a] bằng vàng, làm các khoen của chúng bằng vàng để giữ các thanh ngang[b], và bọc các thanh ngang bằng vàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tấm ván”. Từ Hê-bơ-rơ chỉ các cấu kiện gỗ thuộc kết cấu của Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “những ngôi nhà cho các thanh ngang”, một cách nói chỉ những chỗ tiếp nhận hoặc giữ các thanh ngang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: các khung
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ các cấu kiện gỗ thẳng đứng. “Các khung” diễn đạt rõ chức năng kết cấu; chú thích giữ lại khả năng dịch là “các tấm ván”.
- source_word: צִפָּה / וַיְצַף
  choice: bọc vàng
  rationale: Động từ chỉ việc phủ một lớp vật liệu lên bề mặt. “Bọc vàng” tự nhiên và chính xác trong tiếng Việt, đồng thời được giữ ở cả hai lần xuất hiện.
- source_word: זָהָב
  choice: vàng
  rationale: Danh từ chỉ vật liệu; bản dịch bảo toàn cả ba lần nhắc đến vàng trong câu Hê-bơ-rơ.
- source_word: טַבְּעֹתָם
  choice: các khoen của chúng
  rationale: טַבַּעַת ở đây là các vòng kim loại gắn với những cấu kiện; “khoen” phù hợp với vật dụng dùng để luồn hoặc giữ thanh ngang.
- source_word: עָשָׂה
  choice: làm
  rationale: Cách dịch trực tiếp, tự nhiên của động từ thông dụng mang nghĩa làm hoặc chế tạo.
- source_word: בָּתִּים
  choice: để giữ
  rationale: Nghĩa đen là “những ngôi nhà”, nhưng tại đây từ này mô tả vai trò của các khoen như chỗ tiếp nhận các thanh ngang. Cấu trúc “để giữ” chuyển tải chức năng ấy bằng tiếng Việt tự nhiên, còn chú thích ghi lại hình ảnh nguyên ngữ.
- source_word: לַבְּרִיחִם
  choice: các thanh ngang
  rationale: בְּרִיחִים là những thanh chạy ngang để liên kết các khung. “Thanh ngang” rõ nghĩa hơn từ đơn “thanh” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” theo mạch tường thuật nói về Bết-sa-lê-ên; lặp lại “vàng” ba lần để bảo toàn nhấn mạnh của nguyên văn. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
