translation:
  language: vi
  text: Vật liệu đã đủ cho toàn bộ công việc phải làm, lại còn dư.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và vẫn còn thừa.” Động từ Hê-bơ-rơ có thể nhấn mạnh rằng sau khi đã có đủ cho công việc, vẫn còn lại một phần dư.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: Vật liệu
  rationale: Dù מְלָאכָה thường có nghĩa là “công việc”, trong ngữ cảnh này từ ấy chỉ những thứ dân chúng đem đến để làm Đền Tạm; “vật liệu” diễn đạt rõ sở chỉ trong tiếng Việt.
- source_word: הָיְתָה דַיָּם
  choice: đã đủ
  rationale: Diễn đạt tự nhiên ý quá khứ và sự đầy đủ của דַּי; hậu tố số nhiều quy chiếu đến lượng vật liệu đã được đem đến.
- source_word: לְכָל הַמְּלָאכָה
  choice: cho toàn bộ công việc
  rationale: Ở lần xuất hiện này, מְלָאכָה chỉ toàn thể công việc cần thực hiện; “toàn bộ công việc” giữ được phạm vi bao quát của כָּל.
- source_word: לַעֲשׂוֹת אֹתָהּ
  choice: phải làm
  rationale: Cách nói gọn và tự nhiên trong tiếng Việt, trong đó đối tượng của “làm” là “toàn bộ công việc” vừa nêu.
- source_word: וְהוֹתֵר
  choice: lại còn dư
  rationale: Hiphil của יתר diễn tả phần vượt quá nhu cầu hoặc còn lại; “lại còn dư” truyền đạt rõ ý có phần thặng dư.
