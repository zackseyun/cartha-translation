translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vật liệu” ở đầu câu theo sở chỉ trong ngữ cảnh, nhưng dùng “công việc” ở lần xuất hiện thứ hai của cùng danh từ Hê-bơ-rơ để câu tiếng Việt rõ nghĩa. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
