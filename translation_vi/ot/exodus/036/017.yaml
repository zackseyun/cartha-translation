  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: vi
  text: Ông làm năm mươi vòng vải dọc theo mép tấm màn ngoài cùng của bộ màn thứ nhất[a], và làm năm mươi vòng vải dọc theo mép tấm màn thuộc bộ màn thứ hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại chỗ ghép” hoặc “trong phần màn được ghép”; từ Hê-bơ-rơ có thể chỉ chỗ ghép hoặc bộ gồm các tấm màn đã được ghép lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: vòng móc
  rationale: Chỉ các vòng bằng vải dùng để liên kết các tấm màn; “vòng móc” tự nhiên và thể hiện chức năng mà không thêm chất liệu hay màu sắc vốn không có trong câu này.
- source_word: שְׂפַת
  choice: mép
  rationale: Trong ngữ cảnh vải và Đền Tạm, từ này chỉ mép của tấm màn; “mép” là cách nói thông dụng, chính xác.
- source_word: יְרִיעָה
  choice: tấm màn
  rationale: Chỉ một tấm vải lớn trong cấu trúc Đền Tạm; “tấm màn” vừa rõ đơn vị riêng lẻ vừa phù hợp ngữ cảnh.
- source_word: הַקִּיצֹנָה
  choice: ngoài cùng
  rationale: Diễn đạt vị trí tận cùng của tấm màn trong một bộ, tự nhiên và cụ thể hơn “bên ngoài” trong tiếng Việt.
- source_word: בַּמַּחְבָּרֶת
  choice: trong bộ màn được nối lại
  rationale: מַחְבָּרֶת có thể chỉ sự kết nối hoặc một nhóm các tấm đã nối; cách dịch này giữ ý liên kết đồng thời làm rõ vật được nói đến.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: thuộc bộ thứ hai
  rationale: Trong cấu trúc đối xứng của câu và ngữ cảnh gần, cụm này nói đến tấm màn ở phần/bộ được nối thứ hai. Cách dịch tránh thêm quan hệ “nối với nó” không được nêu trực tiếp.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ông làm ... và làm
  rationale: Giữ sự lặp lại của động từ עשה, nhưng lược chủ ngữ lần hai theo cú pháp tiếng Việt tự nhiên.
