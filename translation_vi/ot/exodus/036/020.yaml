base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/020.yaml
  text: And he made the boards for the tabernacle of acacia wood[a], standing upright.
translation:
  language: vi
  text: Ông làm các tấm ván bằng gỗ keo cho Đền Tạm, dựng đứng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông làm các tấm ván cho Đền Tạm bằng gỗ keo, để đứng thẳng.”'
    reason: Cấu trúc Hê-bơ-rơ cho phép hiểu cụm chỉ vật liệu và phân từ theo cách gắn trực tiếp hơn với “các tấm ván”; phương án này giữ rõ sắc thái tư thế của עֹמְדִים.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Thể wayyiqtol của עשה tiếp nối mạch kể chuyện bằng một hành động quá khứ đơn; tiếng Việt không cần thêm liên từ để diễn đạt tự nhiên trong văn mạch.
- source_word: הַקְּרָשִׁים
  choice: các tấm ván
  rationale: קֶרֶשׁ chỉ những tấm ván cấu thành khung của Đền Tạm; “tấm ván” rõ nghĩa, tự nhiên và không diễn giải quá mức thành một loại kết cấu cụ thể hơn.
- source_word: לַמִּשְׁכָּן
  choice: cho Đền Tạm
  rationale: מִשְׁכָּן là nơi ngự/thánh sở lưu động trong sách Xuất Hành; “Đền Tạm” là cách gọi tiếng Việt quen thuộc, trang trọng và phù hợp ngữ cảnh.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm từ chỉ vật liệu làm từ cây שִׁטָּה, thường được nhận diện là acacia; “gỗ keo” là cách diễn đạt tiếng Việt dễ hiểu.
- source_word: עֹמְדִים
  choice: dựng đứng
  rationale: Phân từ diễn tả tư thế theo chiều thẳng đứng của các tấm ván; “dựng đứng” chuyển tải chức năng kiến trúc tự nhiên hơn chỉ nói “đứng”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đền Tạm” nhất quán như thuật ngữ quen thuộc trong tiếng Việt; đại từ “ông” quy chiếu về chủ thể nam đã được nêu trong văn mạch.
