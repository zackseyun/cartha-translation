base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: vi
  text: Rồi Môi-se gọi Bết-sa-lê-ên, Ô-hô-li-áp và mọi người có lòng khôn ngoan[a] mà Yahweh đã ban sự khôn ngoan trong lòng, tức là mọi người có lòng thôi thúc họ[b] đến với công việc để thực hiện công việc ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “khôn ngoan trong lòng”; thành ngữ này chỉ người được ban sự khôn ngoan và tài khéo.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “có lòng cảm thúc” hoặc “có lòng tự nguyện.” Thành ngữ Hê-bơ-rơ diễn tả sự sẵn lòng hay thôi thúc từ bên trong.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: Động từ קרא đi với אֶל ở đây chỉ việc gọi hoặc triệu tập người đến nhận công việc; “gọi” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: בְּצַלְאֵל
  choice: Bết-sa-lê-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: אָהֳלִיאָב
  choice: Ô-hô-li-áp
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: tất cả những người có lòng khôn ngoan
  rationale: Giữ hình ảnh Hê-bơ-rơ “khôn ngoan trong lòng”; trong ngữ cảnh, sự khôn ngoan này cũng bao hàm năng lực và kỹ nghệ.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: là những người được Yahweh ban sự khôn ngoan trong lòng
  rationale: Diễn đạt tự nhiên bằng thể được ban nhưng vẫn bảo toàn việc Yahweh là nguồn ban sự khôn ngoan và giữ hình ảnh “trong lòng”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: tất cả những ai được lòng mình thôi thúc
  rationale: Thành ngữ diễn tả sự tự nguyện hoặc thúc đẩy từ bên trong; cách dịch giữ “lòng” là trung tâm của ý chí.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: đến tham gia công việc
  rationale: קרב có nghĩa là đến gần; trong ngữ cảnh nhận nhiệm vụ, “đến tham gia” truyền đạt tự nhiên việc tiến đến để bắt tay vào công việc mà không giản lược thành chỉ “bắt đầu”.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: và thực hiện công việc ấy
  rationale: Đại từ giống cái quy về הַמְּלָאכָה; lặp lại “công việc ấy” giúp câu tiếng Việt rõ và trang trọng hơn “làm nó”.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה; giữ “Yahweh” bảo toàn tính chất danh riêng, không thay bằng tước hiệu.
- issue: Nguồn gốc của sự khôn ngoan và kỹ năng
  choice: được Yahweh ban sự khôn ngoan trong lòng
  alternative: có tài khéo léo
  rationale: Bản dịch duy trì sự quy thuộc rõ ràng cho hành động ban cho của Yahweh, đồng thời không thu hẹp חָכְמָה chỉ còn kỹ năng thủ công.
- issue: Sự thôi thúc nội tâm của người thợ
  choice: được lòng mình thôi thúc
  alternative: tự nguyện
  rationale: Giữ căng thẳng trong câu giữa ân ban của Yahweh và sự sẵn lòng bên trong của con người, thay vì đồng nhất hoặc giải thích quan hệ giữa hai điều.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ danh Yahweh, hình ảnh “lòng” của nguyên văn và nét phân biệt giữa sự khôn ngoan được ban với sự tự nguyện nội tâm; dùng “đến tham gia công việc” để câu tự nhiên trong tiếng Việt.
