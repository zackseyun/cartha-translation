  text: and its five pillars with their hooks[a]; and he overlaid their tops and their bands with gold[b], and their five bases were bronze.
translation:
  language: vi
  text: Ông cũng làm năm cây trụ cùng các móc của chúng. Ông bọc các đầu trụ và các đai[a] của chúng bằng vàng; còn năm đế trụ thì bằng đồng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ ở đây có thể chỉ các đai trang trí hoặc những bộ phận liên kết trên các trụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו חֲמִשָּׁה
  choice: năm cây trụ
  rationale: עַמּוּד chỉ các bộ phận thẳng đứng nâng đỡ màn cửa; “cây trụ” tự nhiên và phù hợp với ngôn ngữ xây dựng Đền Tạm.
- source_word: וָוֵיהֶם
  choice: các móc của chúng
  rationale: Trong bối cảnh Đền Tạm, וָו chỉ các móc gắn trên trụ để treo màn.
- source_word: וְצִפָּה
  choice: ông bọc
  rationale: Động từ צפה ở đây diễn tả việc phủ một lớp kim loại lên bề mặt; “bọc vàng” là cách nói tự nhiên trong tiếng Việt.
- source_word: רָאשֵׁיהֶם
  choice: các đầu trụ
  rationale: Nghĩa đen là “các đầu của chúng”; thêm “trụ” để tiếng Việt rõ đối tượng mà không chuyên biệt hóa thành một kiểu đầu cột nhất định.
- source_word: חֲשֻׁקֵיהֶם
  choice: các đai của chúng
  rationale: Từ này chỉ những bộ phận dạng đai hoặc bộ phận liên kết gắn với các trụ; “đai” giữ được tính cụ thể vừa phải mà không xác định quá mức hình dạng chính xác.
- source_word: אַדְנֵיהֶם חֲמִשָּׁה
  choice: năm đế trụ
  rationale: אֶדֶן là phần đế hoặc ổ đỡ ở chân trụ. “Đế trụ” dễ hiểu trong tiếng Việt và làm rõ chức năng trong kết cấu.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת chỉ đồng hoặc hợp kim đồng trong ngữ cảnh cổ đại; “đồng” là cách gọi rộng, tự nhiên và không khẳng định thành phần hợp kim chính xác.
