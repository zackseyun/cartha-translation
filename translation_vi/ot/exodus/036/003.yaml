revisions:
- from: Họ nhận từ trước mặt Môi-se mọi lễ vật mà con dân Y-sơ-ra-ên đã đem đến để thực hiện công việc phục vụ nơi thánh. Nhưng dân chúng vẫn tiếp tục đem lễ vật tự nguyện đến cho ông, hết sáng này đến sáng khác.
  to: Họ nhận từ trước mặt Môi-se mọi lễ vật mà con dân Y-sơ-ra-ên đã đem đến cho công việc phục vụ nơi thánh, để thực hiện công việc ấy. Còn con dân Y-sơ-ra-ên vẫn tiếp tục đem lễ vật tự nguyện đến cho ông, hết sáng này đến sáng khác.
  rationale: Bản sửa bổ sung việc diễn đạt rõ mệnh đề “để thực hiện công việc ấy”, thay “Nhưng” bằng “Còn” để không áp đặt quan hệ đối lập, và nêu rõ chủ thể ở mệnh đề sau theo văn mạch. Không cần chú thích vì không có điểm nào trong bản dịch đòi hỏi phải neo chú thích để hiểu đúng.
