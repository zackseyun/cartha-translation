base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: vi
  text: Họ nhận từ trước mặt Môi-se mọi lễ vật mà con dân Y-sơ-ra-ên đã đem đến cho công việc phục vụ nơi thánh, để thực hiện công việc ấy. Còn con dân Y-sơ-ra-ên vẫn tiếp tục đem lễ vật tự nguyện đến cho ông, hết sáng này đến sáng khác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Họ nhận
  rationale: Động từ לקח cơ bản là “lấy”, nhưng trong ngữ cảnh những người thợ tiếp nhận vật liệu đang được đặt dưới sự quản lý của Môi-se; “nhận” tự nhiên trong tiếng Việt và không gợi ý chiếm lấy.
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: từ trước mặt Môi-se
  rationale: Giữ hình ảnh Hê-bơ-rơ “từ trước mặt/sự hiện diện của Môi-se”, đồng thời cho thấy vật liệu được chuyển khỏi nơi ông đang quản lý.
- source_word: הַתְּרוּמָה
  choice: mọi lễ vật
  rationale: תְּרוּמָה chỉ phần đóng góp được biệt riêng cho mục đích thánh. “Lễ vật” phù hợp văn cảnh thờ phượng và đủ rộng để bao gồm các vật liệu được dâng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Đây là danh xưng tập thể quy ước. “Con dân Y-sơ-ra-ên” vừa giữ sắc thái thuộc về dân Y-sơ-ra-ên vừa tự nhiên hơn lối dịch từng chữ “các con trai của Y-sơ-ra-ên” trong tiếng Việt.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ לַעֲשֹׂת אֹתָהּ
  choice: để thực hiện công việc phục vụ nơi thánh
  rationale: Cụm này chồng các danh từ “công việc—sự phục vụ—nơi thánh”; bản dịch giữ cả ý công việc và phục vụ nhưng diễn đạt tự nhiên. “Thực hiện” chuyển tải nghĩa rộng của עשה và quy chiếu đến toàn bộ nhiệm vụ.
- source_word: וְהֵם הֵבִיאוּ
  choice: Nhưng dân chúng vẫn tiếp tục đem
  rationale: Đại từ độc lập הֵם tạo sự nhấn mạnh; cùng văn cảnh, câu diễn tả việc dân chúng tiếp tục mang đến trong khi thợ đã nhận vật liệu. “Nhưng… vẫn tiếp tục” thể hiện nét tương phản/tiếp diễn mà không biến nó thành một đối lập thần học.
- source_word: נְדָבָה
  choice: lễ vật tự nguyện
  rationale: נְדָבָה nhấn mạnh việc dâng do tự nguyện. Danh từ số ít mang nghĩa tập hợp được diễn đạt tự nhiên bằng “lễ vật” trong tiếng Việt.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: hết sáng này đến sáng khác
  rationale: Phép lặp trong tiếng Hê-bơ-rơ biểu thị sự tái diễn đều đặn; cách nói này giữ sắc thái liên tục và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của הֵם trong mệnh đề cuối
  choice: dân chúng
  alternative: họ
  rationale: Về ngữ pháp, đại từ có thể bị đọc như quay lại chủ thể “những người thợ”, nhưng mạch truyện cho thấy người tiếp tục đem lễ vật là con dân Y-sơ-ra-ên. Nêu “dân chúng” làm rõ chuyển đổi chủ thể vốn được đại từ độc lập nhấn mạnh, mà không thêm nội dung giáo phái.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ tên riêng theo dạng quen thuộc “Môi-se”, “Y-sơ-ra-ên”; tránh cấu trúc dịch từng chữ quá nặng như “công việc của sự phục vụ nơi thánh”, nhưng bảo toàn các ý chính của chuỗi danh từ Hê-bơ-rơ.
