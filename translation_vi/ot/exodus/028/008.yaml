  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: vi
  text: 'Đai dệt tinh xảo của ê-phót[a], gắn trên ê-phót, phải được làm cùng kiểu và liền một mảnh với ê-phót: bằng vàng, chỉ xanh lam, chỉ tím, chỉ đỏ tươi[b] và vải lanh mịn xe sợi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ê-phót là một bộ phận của lễ phục tư tế; trong ngữ cảnh này, nó thuộc lễ phục của thầy tế lễ thượng phẩm.
    reason: cultural_note
  - marker: b
    text: Trong tiếng Hê-bơ-rơ, “xanh lam, tím và đỏ tươi” chỉ các vật liệu dệt được nhuộm màu, dùng trong Đền Tạm và lễ phục tư tế.
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב אֲפֻדָּתוֹ
  choice: đai dệt tinh xảo của ê-phót
  rationale: Trong ngữ cảnh lễ phục tư tế, חֵשֶׁב chỉ bộ phận bằng vải dùng như đai; “dệt tinh xảo” diễn đạt tính chất thủ công mà không biến nó thành một thuật ngữ trừu tượng.
- source_word: אֲשֶׁר עָלָיו
  choice: nằm trên ê-phót
  rationale: Đại từ hậu tố nhiều khả năng quy chiếu về ê-phót, danh từ đứng gần nhất. Lặp lại “ê-phót” giúp tiếng Việt rõ nghĩa hơn đại từ “nó”.
- source_word: כְּמַעֲשֵׂהוּ מִמֶּנּוּ יִהְיֶה
  choice: phải được làm cùng kiểu và liền một mảnh với ê-phót
  rationale: “Cùng kiểu” phản ánh כְּמַעֲשֵׂהוּ, còn “liền một mảnh với” truyền đạt lực của מִמֶּנּוּ יִהְיֶה. Cách dịch giữ cả sự tương ứng về kỹ thuật chế tác lẫn tính hợp nhất của đai với ê-phót.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: bằng vàng, chỉ xanh lam, tím và đỏ tươi
  rationale: “Vàng” là vật liệu; ba từ màu trong danh sách chỉ các vật liệu dệt đã nhuộm. Thêm “chỉ” một lần để câu tự nhiên và làm rõ bản chất dệt may của ba màu.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe sợi
  rationale: שֵׁשׁ là vải gai mịn, còn מָשְׁזָר mô tả sợi được xe hoặc bện; cách diễn đạt này bảo toàn cả chất liệu lẫn phương pháp chuẩn bị sợi.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ thuật ngữ truyền thống “ê-phót” vì không có từ thuần Việt tương đương chính xác; dùng “thầy tế lễ thượng phẩm” trong chú thích để độc giả phổ thông nhận biết chức năng của lễ phục.
