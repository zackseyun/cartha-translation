  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
translation:
  language: vi
  text: sáu tên của họ trên viên đá thứ nhất, và tên của sáu người còn lại trên viên đá thứ hai, theo thứ tự sinh của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Danh từ Hê-bơ-rơ cũng có thể được hiểu là “theo dòng dõi của họ”; danh từ này có thể chỉ dòng dõi phả hệ hoặc thứ tự phát sinh từ đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: sáu tên trong số các tên của họ
  rationale: 'Diễn đạt rõ ý phân chia của giới từ מִן: sáu tên được lấy từ toàn bộ danh sách tên.'
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: trên một viên đá
  rationale: Giữ nghĩa không gian của עַל và sắc thái 'một viên' của הָאֶחָת, đối ứng với viên đá thứ hai, mà không tự ý đổi thành số thứ tự 'thứ nhất'.
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: sáu người còn lại
  rationale: Trong tiếng Việt, nói 'tên của sáu người còn lại' tự nhiên và rõ hơn 'sáu tên còn lại', đồng thời נוֹתָרִים ở dạng giống đực số nhiều quy chiếu đến những người mang tên.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: trên viên đá thứ hai
  rationale: Dịch trực tiếp số thứ tự הַשֵּׁנִית và giữ cùng cách diễn đạt không gian với vế trước.
- source_word: כְּתוֹלְדֹתָם
  choice: theo thứ tự họ được sinh ra
  rationale: Trong ngữ cảnh tên các con trai Y-sơ-ra-ên, cụm từ chỉ trật tự phát sinh theo sự ra đời; cách dịch này rõ nghĩa trong tiếng Việt nhưng chú thích vẫn bảo lưu sắc thái phả hệ rộng hơn của תּוֹלְדוֹת.
theological_decisions:
- issue: Phạm vi ý nghĩa của כְּתוֹלְדֹתָם
  choice: theo thứ tự họ được sinh ra
  alternative: theo dòng dõi của họ / theo các thế hệ của họ
  rationale: Ngữ cảnh phân bố mười hai tên trên hai viên đá nghiêng về thứ tự ra đời, nhưng từ Hê-bơ-rơ cũng có thể liên quan đến nguồn gốc hay dòng dõi; chú thích nêu rõ độ mở này thay vì xóa bỏ nó.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu được giữ như một vế tiếp nối theo cấu trúc của nguyên văn; không thêm động từ “khắc” vốn không xuất hiện trong câu Hê-bơ-rơ này.
