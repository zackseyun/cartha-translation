  to: Hãy đặt U-rim và Thu-mim[a] vào miếng đeo ngực phán quyết[b]; chúng sẽ ở trên ngực A-rôn khi ông vào trước mặt Yahweh. A-rôn sẽ mang phán quyết liên quan đến con cái Y-sơ-ra-ên[c] trên ngực mình trước mặt Yahweh luôn luôn.
  rationale: Bản sửa thay các cụm không tự nhiên bằng cách diễn đạt tiếng Việt hiện đại hơn, đồng thời bảo toàn các thuật ngữ nghi lễ chưa chắc nghĩa, sự lặp lại của מִשְׁפָּט, tên Yahweh, quan hệ của A-rôn với vật phẩm, và trạng từ תָּמִיד. “Trên ngực” phù hợp với chức năng vật lý của miếng đeo ngực trong khi vẫn cho phép sắc thái đại diện; “liên quan đến” làm rõ quan hệ ngữ pháp vốn có thể bị hiểu sai trong tiếng Việt.
