  text: וְ/נָתַתָּ֞ אֶל חֹ֣שֶׁן הַ/מִּשְׁפָּ֗ט אֶת הָ/אוּרִים֙ וְ/אֶת הַ/תֻּמִּ֔ים וְ/הָיוּ֙ עַל לֵ֣ב אַהֲרֹ֔ן בְּ/בֹא֖/וֹ לִ/פְנֵ֣י יְהוָ֑ה וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת מִשְׁפַּ֨ט בְּנֵי יִשְׂרָאֵ֧ל עַל לִבּ֛/וֹ לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: vi
  text: Hãy đặt U-rim và Thu-mim[a] vào miếng đeo ngực phán quyết[b]; chúng sẽ ở trên ngực A-rôn khi ông vào trước mặt Yahweh. A-rôn sẽ mang phán quyết liên quan đến con cái Y-sơ-ra-ên[c] trên ngực mình trước mặt Yahweh luôn luôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: U-rim và Thu-mim là các tên Hê-bơ-rơ của những vật thánh liên hệ với sự phán quyết của tư tế; hình dạng và cách thức hoạt động chính xác của chúng không rõ. Theo các cách giải thích từ nguyên có thể có, các tên này có thể mang nghĩa “các ánh sáng” và “các sự trọn vẹn”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “miếng đeo ngực dùng để quyết định” hoặc “miếng đeo ngực công lý”. Từ Hê-bơ-rơ מִשְׁפָּט có thể chỉ sự phán quyết, quyết định, hoặc công lý tùy văn cảnh.
    reason: alternative_reading
  - marker: c
    text: Theo sát chữ là “các con trai Y-sơ-ra-ên”; đây là cách nói Hê-bơ-rơ chỉ dân giao ước Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: bảng đeo ngực phán quyết
  rationale: Giữ hình ảnh lễ phục của thầy tế lễ và mối liên hệ từ vựng với מִשְׁפָּט ở vế sau; chú thích nêu các sắc thái ‘quyết định’ và ‘công lý’.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: U-rim và Thu-mim
  rationale: Phiên âm hai thuật ngữ nghi lễ vì hình dạng, cách dùng và từ nguyên chính xác của chúng không chắc chắn.
- source_word: אֶל
  choice: vào
  rationale: Đi với động từ ‘đặt’ và vật giống túi/bảng đeo ngực, từ này diễn tả sự đặt vào bên trong hoặc trong phần gắn với bảng đeo ngực.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: chúng sẽ ở trên lòng A-rôn
  rationale: Giữ cả vị trí cụ thể trên ngực và ý nghĩa biểu tượng của ‘lòng’ trong nguyên văn.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: khi ông vào trước mặt Yahweh
  rationale: Diễn tả thời điểm A-rôn bước vào nơi hiện diện của Đức Chúa Trời, đồng thời giữ sắc thái đi vào nơi thánh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: וְנָשָׂא
  choice: sẽ mang
  rationale: Từ ‘mang’ bao hàm cả việc mang vật trên người lẫn trách nhiệm đại diện của thầy tế lễ.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: sự phán quyết của con cái Y-sơ-ra-ên
  rationale: Giữ sự lặp lại của מִשְׁפָּט và không thu hẹp nghĩa thành riêng ‘quyết định’ hay mở rộng thành ‘công lý’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Đây là cách gọi tự nhiên trong tiếng Việt đối với các hậu duệ và cộng đồng giao ước của Y-sơ-ra-ên; chú thích ghi nhận hình thức sát chữ.
- source_word: עַל לִבּוֹ
  choice: trên lòng mình
  rationale: Lặp lại nhất quán hình ảnh ở vế trước và bảo toàn cả chiều kích thể lý lẫn biểu tượng.
- source_word: תָּמִיד
  choice: luôn luôn
  rationale: Diễn tả bổn phận thường xuyên, liên tục trong bối cảnh phụng tự mà không nhất thiết nói đến hành động không ngừng từng giây phút.
theological_decisions:
- issue: Nên dịch nghĩa hay phiên âm אוּרִים và תֻּמִּים
  choice: Phiên âm là ‘U-rim’ và ‘Thu-mim’
  alternative: Dịch là ‘ánh sáng’ và ‘sự trọn vẹn’
  rationale: Từ nguyên, hình dạng và cách vận hành của các vật này chưa chắc chắn; phiên âm tránh biến một cách giải thích còn tranh luận thành nghĩa đã được xác lập.
- issue: Sắc thái của מִשְׁפָּט trong câu
  choice: Dịch nhất quán bằng ‘phán quyết’
  alternative: ‘quyết định’, ‘sự xét xử’ hoặc ‘công lý’
  rationale: ‘Phán quyết’ giữ được ý niệm về quyết định có thẩm quyền và mối liên kết giữa hai lần xuất hiện của từ này, nhưng không xác định quá mức cách U-rim và Thu-mim được dùng.
- issue: Cách diễn đạt בְּנֵי יִשְׂרָאֵל
  choice: ‘con cái Y-sơ-ra-ên’ trong chính văn
  alternative: ‘các con trai Y-sơ-ra-ên’, ‘dân Y-sơ-ra-ên’ hoặc ‘người Y-sơ-ra-ên’
  rationale: Cụm Hê-bơ-rơ có hình thức giống đực nhưng được dùng như tên gọi cộng đồng giao ước; ‘con cái Y-sơ-ra-ên’ vừa tự nhiên trong tiếng Việt vừa giữ quan hệ dòng dõi.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu trong tiếng Việt hiện đại. Dùng ‘ngươi’ để giữ lời truyền phán ở số ít dành cho Môi-se; dùng ‘ông’ cho A-rôn để tránh lặp tên nặng nề. Các tên riêng được viết theo lối phiên âm có gạch nối quen thuộc, còn Yahweh được giữ như danh riêng.
