  source_fidelity: Bản dịch nhìn chung phản ánh đúng mười hai viên đá, các tên của con trai Y-sơ-ra-ên, kiểu khắc ấn, và mười hai chi phái. Tuy nhiên, “tượng trưng cho” diễn giải rõ hơn mức của לְ (“cho/thuộc về”), còn “tên của một người” có thể khiến người đọc hiểu là một người không xác định thay vì từng người con được nêu theo tên.
  naturalness: Câu văn tự nhiên và trang trọng. Việc đổi thành “mỗi viên theo tên của từng người” giúp liên kết rõ với các tên vừa nhắc đến mà vẫn gọn, hiện đại.
  terminology: “Y-sơ-ra-ên” và “chi phái” phù hợp lối dùng Kinh Thánh tiếng Việt. “Khắc như khắc ấn” diễn đạt sát và tự nhiên hơn “theo lối khắc con dấu.”
  issues:
