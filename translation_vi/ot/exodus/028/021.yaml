language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: vi
  text: Các viên đá phải tương ứng với tên của các con trai Y-sơ-ra-ên[a], mười hai viên theo tên của họ. Mỗi viên phải được khắc như khắc ấn, theo tên của từng người[b], cho mười hai chi phái.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai Y-sơ-ra-ên”; cũng có thể hiểu là “con cái Y-sơ-ra-ên” hoặc “dân Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “với những nét khắc như khắc ấn” hoặc “được khắc theo kiểu khắc ấn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Các viên đá
  rationale: Danh từ số nhiều có mạo từ xác định, nối tiếp trực tiếp các chỉ dẫn về bảng đeo ngực; tiếng Việt không cần dịch liên từ וְ một cách máy móc.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: phải tương ứng với tên của các con trai Y-sơ-ra-ên
  rationale: Động từ 'là/có' kết hợp với עַל và 'tên' diễn tả quan hệ tương ứng. Cách dịch này tự nhiên trong tiếng Việt mà không biến quan hệ ấy thành vị trí vật lý.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: mười hai viên theo tên của họ
  rationale: Bổ sung danh từ loại 'viên' vốn được ngữ cảnh hàm ý, đồng thời giữ sự lặp lại của ý tương ứng theo từng tên.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: theo lối khắc con dấu
  rationale: Cụm danh từ chỉ kiểu khắc dùng cho ấn hoặc con dấu; cách diễn đạt này vừa tự nhiên vừa giữ hình ảnh kỹ thuật của nguyên văn.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: mỗi viên phải được khắc tên của một người
  rationale: אִישׁ được dùng theo nghĩa phân phối 'mỗi người/mỗi một'; câu tiếng Việt làm rõ rằng mỗi viên đá mang một tên riêng mà không đổi số lượng hay quan hệ.
- source_word: תִּהְיֶיןָ לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: tượng trưng cho mười hai chi phái
  rationale: Giới từ לְ nêu quan hệ quy thuộc/đại diện giữa các viên đá và mười hai chi phái; 'tượng trưng cho' diễn đạt rõ chức năng ấy trong ngữ cảnh bảng đeo ngực.
theological_decisions:
- issue: Cách dịch thành ngữ giao ước בְּנֵי יִשְׂרָאֵל
  choice: các con trai Y-sơ-ra-ên
  alternative: con cái Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Giữ hình thức giống đực và mối liên hệ gia tộc trong nguyên văn. Chú thích cho biết các cách diễn đạt tự nhiên hơn có thể chỉ toàn thể hậu duệ hoặc dân Y-sơ-ra-ên.
- issue: Quan hệ giữa các viên đá và mười hai chi phái
  choice: tượng trưng cho mười hai chi phái
  alternative: dành cho mười hai chi phái; thuộc về mười hai chi phái
  rationale: Trong ngữ cảnh, mỗi viên mang tên một người con của Y-sơ-ra-ên và qua đó đại diện cho một chi phái; cách dịch nêu chức năng biểu trưng nhưng không gán thêm ý nghĩa giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Y-sơ-ra-ên” và “chi phái” theo lối gọi Kinh Thánh quen thuộc; tránh cấu trúc Hê-bơ-rơ cứng, nhưng giữ sự tương ứng giữa mười hai viên đá, mười hai tên và mười hai chi phái.
