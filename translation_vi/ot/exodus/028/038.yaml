  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: vi
  text: Tấm bảng ấy sẽ ở trên trán A-rôn, và A-rôn sẽ gánh lấy tội lỗi liên quan đến những vật thánh[a] mà người Y-sơ-ra-ên biệt riêng làm thánh trong mọi lễ vật thánh của họ. Tấm bảng ấy phải luôn ở trên trán ông, để họ được chấp nhận trước mặt Gia-vê[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “gánh lấy trách nhiệm về tội lỗi của những vật thánh.” Thành ngữ Hê-bơ-rơ có thể chỉ việc gánh chịu tội lỗi hoặc trách nhiệm phát sinh liên quan đến các lễ vật thánh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để họ được ơn trước mặt Gia-vê.” Trong ngữ cảnh, sự chấp nhận dân chúng gắn liền với các lễ vật họ dâng.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: trán
  rationale: Từ này chỉ phần trán; cách dịch trực tiếp, tự nhiên và phù hợp với vật được đặt ở phía trước đầu A-rôn.
- source_word: נָשָׂא ... עֲוֺן
  choice: mang lấy tội lỗi liên quan đến
  rationale: Giữ hình ảnh pháp lý–tế tự của thành ngữ Hê-bơ-rơ, đồng thời cho thấy đây là tội lỗi hoặc trách nhiệm gắn với các vật thánh, chứ không khẳng định thêm một cơ chế chuộc tội mà câu không nói rõ.
- source_word: הַקֳּדָשִׁים
  choice: những vật thánh
  rationale: Trong ngữ cảnh tế tự, số nhiều này chỉ các lễ vật hoặc vật đã được biệt riêng cho Đức Chúa Trời; “những vật thánh” giữ được phạm trù rộng của nguyên văn.
- source_word: יַקְדִּישׁוּ
  choice: biệt riêng ra thánh
  rationale: Diễn đạt rõ hành động dành riêng các vật cho mục đích thánh, dễ hiểu hơn “thánh hóa” trong tiếng Việt hiện đại.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Diễn đạt tự nhiên ý nghĩa tập thể của thành ngữ giao ước, tránh khiến độc giả hiểu rằng câu chỉ nói đến nam giới hay con trai theo nghĩa sinh học.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: trong mọi lễ vật thánh của họ
  rationale: Cụm Hê-bơ-rơ khó về cú pháp; cách dịch này giữ mối liên hệ giữa việc biệt riêng và toàn bộ các lễ vật thánh mà không làm câu tiếng Việt tối nghĩa.
- source_word: תָּמִיד
  choice: luôn
  rationale: Truyền đạt yêu cầu về sự hiện diện liên tục bằng cách nói tự nhiên trong tiếng Việt.
- source_word: לְרָצוֹן לָהֶם
  choice: để họ được chấp nhận
  rationale: Giữ đại từ chỉ dân chúng và diễn đạt chức năng mục đích/kết quả của cụm từ, đồng thời không loại trừ mối liên hệ với sự chấp nhận các lễ vật của họ.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong truyền thống Kinh Thánh tiếng Việt, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Ý nghĩa của việc A-rôn “mang lấy tội lỗi” của những vật thánh
  choice: A-rôn mang trách nhiệm hoặc tội lỗi gắn với các vật thánh trong vai trò đại diện tư tế.
  alternative: A-rôn trực tiếp xóa bỏ tội lỗi của các vật thánh, hoặc chỉ tượng trưng mang ký ức về tội lỗi của dân.
  rationale: Thành ngữ נָשָׂא עָוֺן có thể nói đến việc gánh chịu tội lỗi hay trách nhiệm pháp lý. Bản dịch giữ sức căng này và không áp đặt một lý thuyết chuộc tội đầy đủ lên câu.
- issue: Đối tượng được chấp nhận trong לְרָצוֹן לָהֶם
  choice: Dân Y-sơ-ra-ên được chấp nhận trước Đức Giê-hô-va trong mối liên hệ với các lễ vật đã biệt riêng của họ.
  alternative: Chỉ riêng các lễ vật được chấp nhận.
  rationale: Đại từ “họ” tự nhiên quy về những người dâng lễ, nhưng ngữ cảnh cũng gắn sự chấp nhận ấy với lễ vật; bản dịch không thu hẹp mối liên hệ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng thuật ngữ tế tự quen thuộc như “lễ vật,” “vật thánh,” “biệt riêng ra thánh,” nhưng tránh lối diễn đạt quá cổ. Thêm “Bảng ấy” để làm rõ chủ thể ngầm từ ngữ cảnh gần, tức bảng vàng ở câu trước.
