revisions:
- from: Bảng ấy sẽ ở trên trán A-rôn, và A-rôn sẽ mang lấy tội lỗi liên quan đến những vật thánh[a] mà con dân Y-sơ-ra-ên biệt riêng ra thánh trong mọi lễ vật thánh của họ. Bảng ấy phải luôn ở trên trán ông, để họ được chấp nhận trước mặt Đức Giê-hô-va[b].
  to: Tấm bảng ấy sẽ ở trên trán A-rôn, và A-rôn sẽ gánh lấy tội lỗi liên quan đến những vật thánh[a] mà người Y-sơ-ra-ên biệt riêng làm thánh trong mọi lễ vật thánh của họ. Tấm bảng ấy phải luôn ở trên trán ông, để họ được chấp nhận trước mặt Gia-vê[b].
  rationale: Chỉ sửa cách gọi tấm bảng cho tự nhiên hơn và thay hình thức tên thần linh bằng “Gia-vê” để phản ánh nhất quán danh riêng יהוה theo audit trail. Các chỗ còn lại được giữ nhằm bảo tồn tính khái quát của thành ngữ “gánh tội lỗi” và cú pháp tế tự khó của nguyên văn.
  reviewer_model: gpt-5.6-terra
