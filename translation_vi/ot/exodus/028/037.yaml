base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: vi
  text: Ngươi phải đặt nó trên một sợi dây màu xanh[a]; nó phải ở trên khăn xếp, ở phía trước khăn xếp.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sợi chỉ” hoặc “dây nhỏ” màu xanh.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ sát nghĩa là “hướng về/đối diện phía trước của khăn xếp,” tức là ở mặt trước của khăn xếp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: Ngươi phải buộc nó
  rationale: Động từ שׂים có nghĩa là đặt, để hoặc gắn. Trong ngữ cảnh tấm vàng được gắn bằng dây, “buộc nó” diễn đạt tự nhiên chức năng của thao tác, dù nghĩa sát chữ là “đặt nó”.
- source_word: פְּתִיל
  choice: sợi dây
  rationale: פְּתִיל chỉ dây, sợi hoặc chỉ dùng để gắn vật; “sợi dây” vừa dễ hiểu vừa phù hợp với chức năng cố định tấm vàng.
- source_word: תְּכֵלֶת
  choice: màu xanh
  rationale: תְּכֵלֶת là màu nhuộm xanh quý dùng trong vật liệu đền tạm; sắc độ chính xác có thể nghiêng xanh tím nhưng không chắc chắn.
- source_word: מִצְנֶפֶת
  choice: khăn xếp
  rationale: Từ này chỉ vật đội đầu quấn của thầy tế lễ thượng phẩm; “khăn xếp” là cách gọi tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  choice: ở phía trước khăn xếp
  rationale: Cụm từ diễn tả vị trí hoặc hướng đối diện với mặt trước của khăn xếp; bản dịch nêu vị trí phía trước mà không thêm chi tiết ngoài văn bản.
- source_word: יִהְיֶה
  choice: nó phải ở
  rationale: Dạng vị hoàn trong chỉ thị diễn đạt yêu cầu bắt buộc và lặp lại vị trí của tấm vàng.
