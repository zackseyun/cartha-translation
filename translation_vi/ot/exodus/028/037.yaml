  rationale: 'Thay “buộc” bằng “đặt” để phản ánh trực tiếp động từ שׂים, và tái lập hai mệnh đề vị trí của nguyên văn: trên dây màu xanh, rồi trên khăn xếp ở phía trước. Không thêm chi tiết về cách cố định tấm vàng.'
