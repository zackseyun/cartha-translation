translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “ngươi” để giữ cách xưng hô trực tiếp số ít của bản văn luật pháp; tránh từ ngữ chuyên biệt theo hệ phái.
