  text: a gold bell and a pomegranate[a], a gold bell and a pomegranate[b], around the hem of the robe all around.
translation:
  language: vi
  text: một chiếc chuông bằng vàng và một quả lựu[a], một chiếc chuông bằng vàng và một quả lựu, trên gấu áo choàng, suốt chung quanh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Quả lựu” ở đây có lẽ là một vật trang trí hình quả lựu, được gắn xen giữa các chuông.
    reason: cultural_note
  - marker: b
    text: Tiếng Hê-bơ-rơ kết hợp giới từ “trên” với một trạng từ có nghĩa là “chung quanh, khắp chung quanh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: chiếc chuông
  rationale: Danh từ này chỉ chiếc chuông nhỏ gắn vào lễ phục của thầy tế lễ; “chiếc chuông” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Cụm từ này nêu vật liệu làm chuông. “Bằng vàng” truyền đạt rõ cấu trúc danh từ vật liệu của tiếng Hê-bơ-rơ.
- source_word: רִמּוֹן
  choice: quả lựu
  rationale: Nghĩa thông thường là “quả lựu”. Trong ngữ cảnh này, từ đó có lẽ chỉ vật trang trí hình quả lựu, nhưng giữ cách gọi đơn giản trong chính văn để tránh diễn giải quá mức.
- source_word: עַל
  choice: trên
  rationale: Giữ nghĩa cơ bản “trên” khi kết hợp với “gấu áo”; trạng từ סָבִיב ở cuối câu diễn đạt việc bố trí chạy quanh toàn bộ gấu áo.
- source_word: שׁוּלֵי
  choice: gấu
  rationale: Trong ngữ cảnh y phục, từ này chỉ mép dưới hay gấu áo. “Gấu áo” là cách gọi thông dụng, chính xác trong tiếng Việt hiện đại.
- source_word: מְעִיל
  choice: áo choàng
  rationale: Từ này chỉ một loại áo ngoài; “áo choàng” phù hợp với lễ phục đang được mô tả và tránh sự nhập nhằng của “áo dài” trong tiếng Việt.
- source_word: סָבִיב
  choice: suốt chung quanh
  rationale: Cụm này thể hiện sự sắp đặt bao quanh toàn bộ gấu áo và giữ được sắc thái nhấn mạnh của trạng từ Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc lặp “một chiếc chuông… rồi một quả lựu” giữ nhịp và trật tự của nguyên văn, còn “suốt chung quanh” thể hiện đầy đủ ý bao quanh toàn bộ gấu áo.
