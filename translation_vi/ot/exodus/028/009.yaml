translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “ngươi” vì lời truyền trực tiếp ở số ít trong ngữ cảnh luật pháp; câu ngắn gọn, dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
