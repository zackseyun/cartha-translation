  yaml_path: translation/ot/exodus/028/009.yaml
  text: And you shall take two onyx stones and engrave on them the names of the sons of Israel[a].
translation:
  language: vi
  text: Ngươi hãy lấy hai viên đá mã não[a] và khắc trên hai viên đá ấy tên các con trai của Y-sơ-ra-ên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ shoham chỉ một loại đá quý thường được dịch theo truyền thống là “mã não”; chưa thể xác định chính xác đó là loại đá nào. Một số đề xuất khác gồm sardonyx hoặc beryl.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Ngươi hãy lấy
  rationale: Dạng Qal hoàn thành có liên từ trong chuỗi chỉ thị mang lực mệnh lệnh; “hãy lấy” diễn đạt tự nhiên và rõ ràng trong tiếng Việt.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: hai viên đá mã não
  rationale: שֹׁהַם chỉ một loại đá quý chưa xác định chắc chắn. “Đá mã não” là cách gọi truyền thống, dễ hiểu; chú thích giữ lại sự bất định về khoáng vật.
- source_word: וּפִתַּחְתָּ
  choice: và khắc
  rationale: Trong ngữ cảnh ghi tên lên đá quý, “khắc” diễn tả chính xác hành động rạch chữ lên bề mặt.
- source_word: עֲלֵיהֶם
  choice: trên đó
  rationale: Đại từ số nhiều chỉ hai viên đá; tiếng Việt tự nhiên dùng “trên đó” để quy chiếu cả hai.
- source_word: שְׁמוֹת
  choice: tên
  rationale: Danh từ chỉ các tên cụ thể sẽ được khắc; tiếng Việt không cần mạo từ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Y-sơ-ra-ên
  rationale: Ở đây cụm từ nói đến các con trai của tổ phụ Y-sơ-ra-ên, là những người mang tên các chi tộc, chứ không chỉ dân Y-sơ-ra-ên nói chung.
