  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
translation:
  language: vi
  text: Áo ấy phải có hai mảnh vai nối vào hai đầu áo ấy[a], và áo ấy được nối lại.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hai dây vai”. Từ Hê-bơ-rơ có thể chỉ những bộ phận của áo nằm trên vai chứ không phải hai vai theo nghĩa đen.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “và áo ấy sẽ được nối lại”. Mệnh đề cuối có thể chỉ kết quả hoặc chỉ tiếp tục mô tả cách các phần áo được nối với nhau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: hai miếng vai
  rationale: כְתֵפֹת trong ngữ cảnh lễ phục chỉ các phần của ê-phót nằm trên vai, không phải hai vai theo nghĩa giải phẫu. “Miếng vai” tự nhiên và rõ hơn “vai áo” hoặc “dây vai” khi hình dạng chính xác không được nêu.
- source_word: חֹבְרֹת
  choice: nối với
  rationale: Phân từ giống cái số nhiều từ חבר mô tả hai miếng vai là các bộ phận được nối vào hai đầu áo; “nối với” vừa tự nhiên trong mô tả may mặc vừa giữ được sự lặp lại của gốc חבר trong câu.
- source_word: יִהְיֶה לּוֹ
  choice: áo ấy phải có
  rationale: Kết cấu tồn tại với ל và đại từ hậu tố diễn đạt sự sở hữu; chủ thể ngầm là ê-phót ở câu trước. “Phải có” phù hợp sắc thái chỉ dẫn về cách làm lễ phục.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: hai đầu áo
  rationale: קָצֶה chỉ đầu hoặc mép tận cùng. Thêm “áo” để đại từ sở hữu tiếng Hê-bơ-rơ có quy chiếu rõ ràng trong tiếng Việt.
- source_word: וְחֻבָּר
  choice: để áo được nối liền lại với nhau
  rationale: Dạng bị động của חבר. “Để” diễn đạt quan hệ mục đích hoặc kết quả hợp lý trong tiếng Việt, còn “được nối liền lại với nhau” giữ hình thái bị động và ý hai phần áo được liên kết.
