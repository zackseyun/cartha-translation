- from: Áo ấy phải có hai miếng vai nối với hai đầu áo[a], để áo được nối liền lại với nhau.[b]
  to: Áo ấy phải có hai mảnh vai nối vào hai đầu áo ấy[a], và áo ấy được nối lại.[b]
  rationale: Sửa cách gọi bộ phận y phục cho tự nhiên hơn; thay “để” bằng “và” để không áp đặt quan hệ mục đích; và bỏ “liền ... với nhau” để câu Việt đúng ngữ pháp, giữ sát hình thức bị động số ít của nguyên ngữ. Các chú thích vẫn bảo lưu những khả năng hợp lý về từ vựng và cú pháp.
