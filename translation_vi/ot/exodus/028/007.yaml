translation_notes:
  register: Văn phong chỉ dẫn, trang trọng nhưng hiện đại. Dùng “áo ấy” thay cho đại từ trống nghĩa để làm rõ ê-phót là vật được nói đến, nhưng không lặp tên chuyên môn ngoài dữ liệu trực tiếp của câu. Các chú thích giữ lại độ bất định về hình dạng của כְתֵפֹת và quan hệ cú pháp của וְחֻבָּר.
