translation:
  language: vi
  text: Tấm đeo ngực phải là hình vuông, được gấp đôi[a], dài một gang tay và rộng một gang tay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được làm thành hai lớp.” Tiếng Hê-bơ-rơ mô tả tấm đeo ngực được làm theo dạng kép, có lẽ bằng cách gấp lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: có hình vuông
  rationale: Diễn đạt rõ hình dạng bốn cạnh bằng nhau trong tiếng Việt hiện đại.
- source_word: יִהְיֶה
  choice: phải có
  rationale: Thể chưa hoàn thành ở đây nêu quy cách bắt buộc của vật đang được truyền làm.
- source_word: כָּפוּל
  choice: được gấp đôi
  rationale: Phân từ bị động mô tả vật được làm thành hai lớp, rất có thể bằng cách gấp lại; cách dịch này tự nhiên và vẫn giữ chú thích về sắc thái từ vựng.
- source_word: זֶרֶת
  choice: một gang tay
  rationale: Chỉ đơn vị chiều dài bằng khoảng cách của bàn tay xòe rộng; “gang tay” là cách gọi chính xác và thông dụng trong tiếng Việt.
- source_word: אָרְכּוֹ
  choice: dài
  rationale: Trong công thức đo kích thước, “dài một gang tay” tự nhiên hơn “chiều dài của nó là một gang tay” mà vẫn truyền đạt đầy đủ.
- source_word: וְזֶרֶת
  choice: và ... một gang tay
  rationale: Liên từ nối phép đo thứ hai; lặp lại đơn vị đo giúp câu rõ ràng.
- source_word: רָחְבּוֹ
  choice: rộng
  rationale: Diễn đạt tự nhiên chiều kích đối ứng với “dài” trong tiếng Việt hiện đại.
