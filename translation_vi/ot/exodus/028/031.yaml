    rationale: Động từ này có nghĩa khái quát là “làm/chế tạo”; việc may là một cách thực hiện có thể có nhưng không được nêu rõ trong câu.
  - severity: medium
    issue: “Sợi xanh lam” cụ thể hóa תְּכֵלֶת quá mức.
    rationale: Từ Hê-bơ-rơ chỉ chất liệu/dệt phẩm nhuộm đặc trưng; bản văn không xác định riêng hình thức là sợi.
  - severity: low
    issue: “Áo dài” có liên tưởng văn hóa Việt Nam ngoài ý nghĩa của מְעִיל.
    rationale: “Áo choàng” là tương đương hiện đại, trung tính hơn cho robe lễ phục cổ đại.
