  text: You shall make the robe of the ephod entirely of blue[a][b].
translation:
  language: vi
  text: Con hãy làm áo choàng của ê-phót hoàn toàn bằng vải xanh lam[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn bộ bằng màu xanh lam,” nghĩa là chiếc áo được làm hoàn toàn từ vật liệu màu xanh lam.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “xanh lam” có thể chỉ loại vải hoặc chất liệu dệt nhuộm quý, với sắc màu từ xanh lam đến xanh tím.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Con hãy may
  rationale: Động từ trong chuỗi chỉ thị mang lực mệnh lệnh. “Hãy may” tự nhiên với việc chế tác y phục; “con” duy trì lời Đức Chúa Trời trực tiếp truyền cho Môi-se trong ngữ cảnh.
- source_word: מְעִיל
  choice: áo dài
  rationale: Chỉ loại áo choàng dài thuộc lễ phục tư tế. “Áo dài” dễ hiểu trong tiếng Việt hiện đại hơn “áo choàng”, đồng thời không gợi nhất thiết đến áo khoác ngoài.
- source_word: הָאֵפֹד
  choice: ê-phót
  rationale: Giữ dạng phiên âm vì đây là thuật ngữ kỹ thuật chỉ một lễ phục tư tế; cụm từ nói đến chiếc áo dài đi với ê-phót.
- source_word: כְּלִיל
  choice: hoàn toàn
  rationale: Diễn đạt tính toàn thể của chất liệu hoặc màu sắc một cách tự nhiên, không buộc phải hiểu rằng từ này mô tả kiểu dáng của áo.
- source_word: תְּכֵלֶת
  choice: sợi xanh lam
  rationale: Trong ngữ cảnh chế tác Đền Tạm và lễ phục, từ này chỉ vật liệu được nhuộm màu xanh đến xanh tím. “Sợi xanh lam” làm rõ đây là chất liệu dệt, còn sắc độ chính xác vẫn được ghi chú.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Dùng “ê-phót” như thuật ngữ phiên âm và “áo dài” theo nghĩa một chiếc áo lễ phục dài, không liên hệ với quốc phục Việt Nam.
