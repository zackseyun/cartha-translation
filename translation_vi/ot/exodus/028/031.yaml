- from: Con hãy may áo dài của ê-phót hoàn toàn bằng sợi xanh lam[a][b].
  to: Con hãy làm áo choàng của ê-phót hoàn toàn bằng vải xanh lam[a][b].
  rationale: Đổi “may” thành “làm” để phản ánh phạm vi nghĩa của động từ gốc; đổi “áo dài” thành “áo choàng” để tránh liên tưởng văn hóa không chủ ý; và đổi “sợi” thành “vải” để không xác định quá mức hình thức của chất liệu. Các chú thích được điều chỉnh tương ứng nhưng vẫn bảo toàn lựa chọn dịch và bất định về sắc độ.
