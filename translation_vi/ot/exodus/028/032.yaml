base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: vi
  text: Lỗ luồn đầu phải ở giữa áo; chung quanh lỗ ấy phải có một đường viền được dệt, như lỗ cổ của áo giáp[a], để áo không bị rách.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lỗ cổ của áo giáp che ngực” hay “lỗ cổ của áo giáp lưới.” Từ Hê-bơ-rơ תַּחְרָא là từ hiếm; phép so sánh có lẽ nói đến một lỗ cổ được gia cố để không bị rách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: lỗ để chui đầu
  rationale: פֶּה nghĩa đen là “miệng” nhưng trong ngữ cảnh y phục chỉ lỗ mở; kết hợp với רֹאשׁוֹ, cụm này chỉ lỗ để đầu người mặc chui qua.
- source_word: בְּתוֹכוֹ
  choice: ở chính giữa áo
  rationale: Cụm từ xác định vị trí lỗ mở trong phần giữa của chiếc áo; nêu rõ “áo” tự nhiên hơn đại từ đơn thuần trong tiếng Việt.
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: một đường viền dệt
  rationale: שָׂפָה ở đây là mép hay đường viền quanh lỗ, còn מַעֲשֵׂה אֹרֵג cho biết đó là sản phẩm của kỹ thuật dệt.
- source_word: לְפִיו סָבִיב
  choice: quanh lỗ ấy
  rationale: פֶּה một lần nữa chỉ lỗ mở của áo, và סָבִיב diễn tả đường viền bao quanh toàn bộ lỗ.
- source_word: כְּפִי תַחְרָא
  choice: giống như lỗ cổ của áo giáp
  rationale: תַחְרָא là từ hiếm, thường được hiểu là một loại áo giáp hoặc áo giáp che thân; phép so sánh nhấn mạnh lỗ cổ được gia cố chắc chắn.
- source_word: לֹא יִקָּרֵעַ
  choice: để áo không bị xé rách
  rationale: Dạng Niphal mang nghĩa bị động. Cách diễn đạt theo mục đích/kết quả phù hợp với cấu trúc và làm rõ chiếc áo là vật không được để rách.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn, trang trọng nhưng tự nhiên trong tiếng Việt hiện đại. Dùng “lỗ để chui đầu” và “lỗ cổ” để mô tả rõ cấu tạo y phục; giữ sự không chắc chắn của từ hiếm תַחְרָא qua cách dịch khái quát “áo giáp”.
