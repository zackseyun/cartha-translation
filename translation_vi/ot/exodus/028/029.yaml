    reason: alternative_reading
  - marker: c
    text: Danh Yahweh trong tiếng Hê-bơ-rơ được viết là YHWH.
    reason: textual_explanation
lexical_decisions:
- source_word: וְנָשָׂא
  choice: sẽ mang
  rationale: נשא có nghĩa thông dụng là “mang, mang lấy.” “Sẽ mang” tự nhiên trong tiếng Việt và giữ được hình ảnh cụ thể về vật được thầy tế lễ mang trên người.
- source_word: שְׁמוֹת
  choice: tên
  rationale: Dịch trực tiếp danh từ số nhiều; điều được nhắc đến là những tên đã được khắc, không chỉ là các chi phái theo nghĩa trừu tượng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: các con trai Y-sơ-ra-ên
  rationale: Giữ cách diễn đạt gia phả và giống đực của nguyên văn; trong ngữ cảnh, cụm này đại diện cho các chi phái xuất thân từ Y-sơ-ra-ên.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: nơi bảng đeo ngực phán xét
  rationale: חֹשֶׁן là vật phẩm tế lễ đeo ở ngực; מִשְׁפָּט có thể gợi sự phán xét, phân xử hoặc quyết định. Cách dịch tương đối sát này không thu hẹp nghĩa vào một chức năng duy nhất.
- source_word: עַל לִבּוֹ
  choice: trên lòng mình
  rationale: Giữ cả vị trí trên ngực và biểu tượng của “lòng”; đại từ phản thân giúp câu tiếng Việt tự nhiên khi chủ thể là A-rôn.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: khi ông vào Nơi Thánh
  rationale: ב với động từ nguyên mẫu chỉ thời điểm “khi”; הַקֹּדֶשׁ trong bối cảnh Đền Tạm chỉ không gian thánh mà thầy tế lễ bước vào.
- source_word: לְזִכָּרוֹן
  choice: để làm vật tưởng niệm
  rationale: Diễn đạt mục đích tưởng nhớ/tưởng niệm trước Đức Chúa Trời, đồng thời giữ sắc thái cụ thể của danh từ זִכָּרוֹן.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: לִפְנֵי là thành ngữ chỉ sự hiện diện; יְהוָה được thể hiện bằng danh riêng quen thuộc trong tiếng Việt, với chú thích nêu dạng YHWH/Yahweh.
- source_word: תָּמִיד
  choice: luôn luôn
  rationale: Trong nghi lễ, תָּמִיד chỉ tính liên tục hoặc đều đặn; “luôn luôn” giữ nghĩa rộng mà không ấn định một tần suất cụ thể.
theological_decisions:
- issue: Danh xưng tế lễ חֹשֶׁן הַמִּשְׁפָּט
  choice: bảng đeo ngực phán xét
  alternative: bảng đeo ngực dùng để phân xử
  rationale: Cấu trúc sở hữu được giữ tương đối sát vì מִשְׁפָּט có thể liên quan đến phán xét, phân xử hoặc quyết định. Chú thích bảo tồn cách hiểu chức năng mà không đưa nó vào chính văn như kết luận duy nhất.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: các con trai Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: Nguyên văn là cách nói gia phả theo giống đực. Chính văn giữ hình thức ấy, còn chú thích làm rõ phạm vi đại diện cho các chi phái.
- issue: Phạm vi của הַקֹּדֶשׁ
  choice: Nơi Thánh
  alternative: nơi thánh; đền thánh
  rationale: Trong bối cảnh phẩm phục thầy tế lễ và Đền Tạm, từ này chỉ khu vực thánh cụ thể. Viết hoa giúp người đọc nhận ra địa điểm nghi lễ mà không đồng nhất nó với Nơi Chí Thánh.
- issue: Ý nghĩa của לְזִכָּרוֹן לִפְנֵי יְהוָה
  choice: để làm vật tưởng niệm trước mặt Đức Giê-hô-va
  alternative: để được nhắc nhớ trước mặt Đức Giê-hô-va
  rationale: Cách dịch giữ sự mơ hồ của nguyên văn về đối tượng thực hiện hành vi nhớ, thay vì xác định rõ là A-rôn, dân Y-sơ-ra-ên hay Đức Chúa Trời.
- issue: Thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; ĐỨC CHÚA
  rationale: Dùng dạng danh riêng đã có lịch sử sử dụng rộng trong Kinh Thánh tiếng Việt; chú thích minh bạch rằng nguyên văn là YHWH và cũng thường được phiên âm là Yahweh.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Dùng “bảng đeo ngực” thay cho thuật ngữ cổ khó hiểu; giữ “phán xét” trong danh xưng để bảo tồn chiều kích tư pháp/nghi lễ. “Trên lòng mình” duy trì hình ảnh biểu tượng của nguyên văn. Các tên riêng dùng dạng quen thuộc trong truyền thống tiếng Việt.
