  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: vi
  text: 'A-rôn sẽ mang tên các con trai Y-sơ-ra-ên[a] trong bảng đeo ngực phán xét[b], trên lòng mình, khi ông vào Nơi Thánh, để làm vật tưởng niệm trước mặt Yahweh[c] luôn luôn.


    [a] Nguyên văn Hê-bơ-rơ: “các con trai Y-sơ-ra-ên”; đây là cách nói theo dòng dõi, chỉ các chi phái xuất thân từ Y-sơ-ra-ên.


    [b] Cũng có thể dịch: “bảng đeo ngực dùng để phân xử.” Danh xưng Hê-bơ-rơ có lẽ chỉ bảng đeo ngực của thầy tế lễ, gắn với việc đưa ra phán quyết hoặc quyết định trước mặt Đức Chúa Trời.


    [c] Danh Yahweh trong tiếng Hê-bơ-rơ được viết là YHWH.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai Y-sơ-ra-ên”; đây là cách nói theo dòng dõi, chỉ các chi phái xuất thân từ Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: b
