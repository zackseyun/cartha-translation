  - severity: low
    issue: “theo kiểu dệt hoa văn khéo léo” cho מַעֲשֵׂה חֹשֵׁב
    rationale: Cụm Hê-bơ-rơ chỉ công việc/tay nghề của người thợ có khả năng thiết kế nghệ thuật. Cách dịch hiện tại thu hẹp thành một “kiểu dệt hoa văn”, trong khi từ nguồn không xác định riêng kỹ thuật ấy.
