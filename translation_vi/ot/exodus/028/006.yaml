source:
  edition: WLC
  text: וְ/עָשׂ֖וּ אֶת הָ/אֵפֹ֑ד זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן תּוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֥ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: vi
  text: Họ phải làm ê-phốt bằng vàng[a], sợi xanh lam, tím, đỏ thắm và vải lanh mịn xe sợi, do người thợ thiết kế khéo léo thực hiện[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “chỉ vàng”. Bản Hê-bơ-rơ chỉ ghi “vàng”, nhưng trong ngữ cảnh chế tác này, vàng có thể đã được gia công để dệt vào vải.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hê-bơ-rơ chỉ công việc đòi hỏi khả năng thiết kế và tay nghề nghệ thuật; cũng có thể dịch là “công việc của người thợ thiết kế khéo léo” hoặc “công việc của một người thợ khéo léo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Họ phải làm
  rationale: Thể hoàn thành Qal nối tiếp trong chuỗi chỉ thị mang chức năng mệnh lệnh; “phải làm” tự nhiên và giữ sắc thái quy định.
- source_word: הָאֵפֹד
  choice: ê-phốt
  rationale: Đây là thuật ngữ chuyên biệt chỉ lễ phục tư tế, không có từ tương đương chính xác trong tiếng Việt; phiên âm tránh xác định quá mức hình dạng của lễ phục.
- source_word: זָהָב
  choice: vàng
  rationale: Bản Hê-bơ-rơ chỉ nói “vàng”; trong ngữ cảnh dệt may có thể là vàng được dát hoặc kéo thành sợi để dệt vào vải, nhưng ý “chỉ vàng” không được nói rõ tại đây.
- source_word: תְּכֵלֶת וְאַרְגָּמָן תּוֹלַעַת שָׁנִי
  choice: chỉ xanh lam, chỉ tím, chỉ đỏ thắm
  rationale: Các danh từ màu trong danh sách vật liệu hàm ý nguyên liệu dệt đã nhuộm; thêm “chỉ” giúp câu tiếng Việt rõ và tự nhiên mà không làm thay đổi các màu sắc truyền thống.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe sợi
  rationale: שֵׁשׁ là vải gai mịn, còn מָשְׁזָר mô tả sợi được xe; cách diễn đạt này giữ cả chất liệu lẫn kỹ thuật chế tác.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: theo kiểu dệt hoa văn khéo léo
  rationale: Cụm từ chỉ công việc dệt có tính toán, tạo hoa văn bằng tay nghề nghệ thuật; không thu hẹp thành thêu, vì từ nguồn không nhất thiết chỉ kỹ thuật thêu.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng hiện đại. Giữ thuật ngữ lễ nghi “ê-phốt” bằng phiên âm, đồng thời dùng ngôn ngữ dệt may dễ hiểu. Các dấu chú thích [a], [b] đều có mặt trong câu chính.
