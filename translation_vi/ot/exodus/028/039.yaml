base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/039.yaml
  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: vi
  text: Ngươi phải dệt áo dài bằng vải lanh mịn theo hoa văn ô vuông[a]; cũng phải làm một khăn xếp bằng vải lanh mịn, và làm một đai lưng do thợ thêu làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “làm áo dài bằng vải lanh mịn có hoa văn ô vuông.” Động từ Hê-bơ-rơ có lẽ nói đến việc tạo ra một loại vải có hoa văn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּצְתָּ
  choice: dệt ... theo kiểu ô vuông
  rationale: Trong ngữ cảnh lễ phục tư tế, động từ שׁבץ nhiều khả năng chỉ việc tạo ra một loại vải có hoa văn dạng ô. Cách dịch này giữ nghĩa thuộc kỹ thuật dệt và kết quả có hoa văn, nhưng không khẳng định quá mức về phương pháp cụ thể.
- source_word: הַכְּתֹנֶת
  choice: áo dài
  rationale: כְּתֹנֶת là loại áo mặc sát người, thường dài, chứ không phải áo choàng ngoài. “Áo dài” là cách gọi dễ hiểu trong ngữ cảnh y phục cổ; ở đây không chỉ quốc phục Việt Nam.
- source_word: שֵׁשׁ
  choice: vải gai mịn
  rationale: Trong các đoạn nói về Đền Tạm và lễ phục tư tế, שֵׁשׁ chỉ loại vải lanh/gai chất lượng cao. “Vải gai mịn” diễn đạt cả chất liệu lẫn phẩm chất tinh tế của vải.
- source_word: מִצְנֶפֶת
  choice: khăn xếp
  rationale: מִצְנֶפֶת là khăn đội đầu được quấn quanh đầu của thầy tế lễ. “Khăn xếp” truyền đạt rõ hình thức khăn quấn hơn từ chung chung như “mũ”.
- source_word: אַבְנֵט
  choice: đai lưng
  rationale: אַבְנֵט là dải đai dài, có tính trang trí, thắt quanh eo trong lễ phục tư tế. “Đai lưng” tự nhiên và chính xác hơn “thắt lưng”, vốn dễ gợi một dây nịt có khóa.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: sản phẩm của thợ thêu
  rationale: Cụm từ này nhấn mạnh công việc thủ công trang trí do người thợ lành nghề thực hiện. Bản dịch giữ được trọng tâm vào người thợ như cấu trúc Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Dùng lối truyền lệnh trang trọng, trực tiếp với đại từ “ngươi”, phù hợp văn cảnh Đức Chúa Trời truyền chỉ thị cho Môi-se. Câu văn hiện đại và rõ ràng, đồng thời giữ thuật ngữ về lễ phục tư tế. Dấu gạch ngang làm rõ rằng đai lưng là sản phẩm của thợ thêu.
