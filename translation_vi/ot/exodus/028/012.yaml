  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: vi
  text: Ngươi phải đặt hai viên đá ấy trên hai phần vai của ê-phốt, làm những viên đá tưởng niệm cho con cái Y-sơ-ra-ên[a]. A-rôn sẽ mang tên của họ trước mặt Yahweh trên hai vai mình, như một sự tưởng niệm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cho các con trai của Y-sơ-ra-ên”; đây là cách gọi mang tính gia tộc–giao ước, thường chỉ toàn thể dân Y-sơ-ra-ên.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “để tưởng niệm.” Nguyên văn không nói rõ ai là người nhớ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Ngươi phải đặt
  rationale: Diễn đạt mệnh lệnh ngôi hai số ít giống đực trong ngữ cảnh chỉ thị, đồng thời dùng động từ tự nhiên cho việc gắn đá lên lễ phục.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: hai viên đá ấy
  rationale: Giữ số lượng và tính xác định; “ấy” liên kết tự nhiên với hai viên đá đã được nói đến trong văn cảnh, không tự ý lặp lại loại đá.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: hai miếng vai của ê-phốt
  rationale: Trong ngữ cảnh lễ phục, כָּתֵף chỉ các bộ phận ở vai của ê-phốt chứ không phải vai người; “miếng vai” rõ nghĩa và phân biệt với hai vai của A-rôn ở vế sau.
- source_word: אַבְנֵי זִכָּרֹן
  choice: những viên đá tưởng niệm
  rationale: Chuyển tải cấu trúc “đá của sự tưởng nhớ” bằng cách nói tiếng Việt tự nhiên, giữ chức năng tưởng niệm của các viên đá.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho con cái Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” giữ hình ảnh gia tộc–giao ước của בְּנֵי יִשְׂרָאֵל và trong tiếng Việt có thể chỉ toàn thể hậu duệ, không chỉ nam giới.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: A-rôn sẽ mang tên của họ
  rationale: “Mang” giữ hình ảnh cụ thể về việc vị tư tế mang các tên được khắc, đồng thời không giải thích quá mức ý nghĩa đại diện.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Diễn đạt trực tiếp ý “trước mặt/trong sự hiện diện của” và phiên âm danh giao ước theo nguồn Hê-bơ-rơ.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: trên hai vai mình
  rationale: Chỉ rõ đây là hai vai của chính A-rôn, giữ sự lặp lại cụ thể và sự tương phản với các miếng vai của ê-phốt.
- source_word: לְזִכָּרֹן
  choice: để tưởng nhớ
  rationale: Giữ liên hệ từ vựng với זִכָּרֹן ở vế trước và bảo tồn sự bỏ ngỏ của nguyên văn về chủ thể thực hiện việc nhớ.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; “Yahweh” chuyển tự tên riêng thay vì thay bằng một tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên / người Y-sơ-ra-ên
  rationale: Cách dịch này giữ ngôn ngữ thân tộc của tiếng Hê-bơ-rơ nhưng trong tiếng Việt vẫn có thể bao quát cộng đồng hậu duệ Y-sơ-ra-ên.
- issue: Chủ thể của sự tưởng nhớ trong לְזִכָּרֹן
  choice: để tưởng nhớ
  alternative: để Yahweh nhớ đến họ / làm vật kỷ niệm cho họ
  rationale: Nguyên văn không nêu rõ ai là người nhớ; cách dịch không bổ sung chủ thể nên bảo tồn sự mơ hồ thần học chính đáng.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “ngươi” để giữ cách xưng hô ngôi hai số ít trong chỉ thị trực tiếp; giữ thuật ngữ lễ phục “ê-phốt” và các tên riêng theo dạng quen thuộc, riêng danh יהוה được ghi là “Yahweh”.
