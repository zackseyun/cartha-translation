revisions:
- from: Ngươi phải đặt hai viên đá ấy trên hai miếng vai của ê-phốt, làm những viên đá tưởng niệm cho con cái Y-sơ-ra-ên[a]. A-rôn sẽ mang tên của họ trên hai vai mình trước mặt Yahweh, để tưởng nhớ[b].
  to: Ngươi phải đặt hai viên đá ấy trên hai phần vai của ê-phốt, làm những viên đá tưởng niệm cho con cái Y-sơ-ra-ên[a]. A-rôn sẽ mang tên của họ trước mặt Yahweh trên hai vai mình, như một sự tưởng niệm[b].
  rationale: Sửa hai cách diễn đạt để bản văn tự nhiên hơn và để câu cuối giữ đúng tính không xác định về chủ thể của sự tưởng niệm. Không thay đổi nội dung, chức năng của các viên đá, hay cách dịch các thuật ngữ và tên riêng chủ yếu.
