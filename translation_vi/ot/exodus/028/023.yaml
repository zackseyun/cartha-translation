  terminology: “Khoen vàng” là lựa chọn tự nhiên và đúng ngữ cảnh cho טַבָּעוֹת. Giữ “bảng đeo ngực” nhất quán cho חֹשֶׁן. “Đặt ... trên” phản ánh trực tiếp hơn cả động từ וְנָתַתָּ lẫn giới từ עַל.
