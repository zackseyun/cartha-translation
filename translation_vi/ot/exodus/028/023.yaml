translation:
  language: vi
  text: Ngươi phải làm hai khoen vàng trên bảng đeo ngực, rồi đặt hai khoen ấy trên hai đầu của bảng đeo ngực.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Thể hoàn thành Qal có liên từ trong chuỗi chỉ dẫn mang lực mệnh lệnh; cách dịch này giữ rõ sắc thái truyền lệnh và phù hợp văn phong luật lệ trang trọng.
- source_word: עַל הַחֹשֶׁן
  choice: trên bảng đeo ngực
  rationale: עַל diễn tả vị trí gắn các khoen; חֹשֶׁן ở đây là vật phẩm lễ phục tư tế đeo trước ngực, nên “bảng đeo ngực” vừa cụ thể vừa dễ hiểu.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: hai khoen vàng
  rationale: טַבָּעוֹת là những vòng dùng để liên kết hoặc gắn dây; “khoen” tự nhiên hơn “nhẫn” trong ngữ cảnh chế tác, còn “vàng” giữ nguyên chất liệu.
- source_word: וְנָתַתָּ
  choice: rồi gắn
  rationale: Động từ נָתַן cơ bản là đặt/để; trong chỉ dẫn lắp các khoen lên vật phẩm, “gắn” diễn đạt tự nhiên hành động vật lý mà ngữ cảnh đòi hỏi.
- source_word: אֶת שְׁתֵּי הַטַּבָּעוֹת
  choice: hai khoen ấy
  rationale: Cụm danh từ xác định chỉ lại chính hai khoen vừa được nói đến; “ấy” làm rõ phép hồi chỉ trong tiếng Việt.
- source_word: עַל שְׁנֵי קְצ֥וֹת הַחֹשֶׁן
  choice: vào hai đầu của bảng đeo ngực
  rationale: קָצֶה chỉ đầu hoặc mép tận cùng; “hai đầu” phản ánh trực tiếp số đôi trong tiếng Hê-bơ-rơ, còn “vào” phù hợp tự nhiên với động từ “gắn”.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngươi” để giữ lối xưng hô số ít trong lời Đức Chúa Trời truyền cho Môi-se; câu văn mang tính chỉ dẫn chế tác. Không thêm chú thích vì các phương án khác không tạo khác biệt đáng kể cần bảo lưu ở câu này.
