source:
  edition: WLC
  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: vi
  text: Theo cách làm của thợ khắc đá, như cách khắc ấn tín, ngươi phải khắc trên hai viên đá tên các con trai của Y-sơ-ra-ên[a]; ngươi phải làm chúng được đặt trong các ổ vàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là các con trai của Y-sơ-ra-ên; tên của họ được khắc trên đá và gắn với mười hai chi phái xuất phát từ họ.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: Theo cách làm của thợ khắc đá
  rationale: Cụm từ chỉ cách thức hoặc tiêu chuẩn chế tác; cách dịch này vừa sát cấu trúc Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
- source_word: פִּתּוּחֵי חֹתָם
  choice: như khắc con dấu
  rationale: Chỉ kiểu chạm khắc đặc trưng của con dấu; cách diễn đạt gọn và rõ hơn lối danh hóa nặng nề.
- source_word: תְּפַתַּח
  choice: ngươi phải khắc
  rationale: Trong ngữ cảnh ghi tên lên đá quý, “khắc” là từ tiếng Việt chính xác và tự nhiên.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: hai viên đá
  rationale: Giữ nghĩa trực tiếp của từ Hê-bơ-rơ “đá” mà không thêm ý “đá quý” dù văn cảnh cho thấy đó là đá quý.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: khắc trên hai viên đá tên các con trai của Y-sơ-ra-ên
  rationale: עַל được thể hiện bằng “trên”, phù hợp hành động khắc tên lên bề mặt đá; giữ danh xưng gia hệ giống đực của nguyên văn.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: có các ổ bằng vàng bao quanh
  rationale: Diễn đạt các viên đá được bao hoặc giữ trong những ổ gắn bằng vàng, đồng thời không xác định quá mức kỹ thuật kim hoàn cổ.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: ngươi phải làm chúng
  rationale: Giữ mệnh lệnh trực tiếp và đại từ số nhiều chỉ hai viên đá.
theological_decisions:
- issue: Cụm gia hệ giống đực בְּנֵי יִשְׂרָאֵל
  choice: các con trai của Y-sơ-ra-ên
  alternative: con cái Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Trong văn cảnh này, tên được khắc là tên các con trai của Y-sơ-ra-ên, những người đứng đầu mười hai chi phái; bản dịch giữ nét gia hệ và giới tính của nguyên văn thay vì khái quát hóa thành toàn dân.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng “ngươi” để duy trì lối xưng hô mệnh lệnh trực tiếp trong diễn ngôn luật pháp; “ổ bằng vàng” là thuật ngữ kim hoàn dễ hiểu, chỉ phần giữ và bao quanh viên đá.
