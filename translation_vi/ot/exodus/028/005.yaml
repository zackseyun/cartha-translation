  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: vi
  text: Họ phải lấy vàng, chỉ xanh lam[a], chỉ tím, chỉ đỏ thắm[b] và vải lanh mịn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Các từ Hê-bơ-rơ được dịch là “chỉ xanh lam” và “chỉ tím” có thể chỉ vật liệu dệt đã nhuộm các màu ấy, chứ không chỉ màu sắc nói chung.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “đỏ thắm của con sâu”, một thành ngữ chỉ vật liệu đỏ thắm được nhuộm bằng phẩm màu lấy từ côn trùng.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: Họ
  rationale: Đại từ độc lập nêu rõ chủ thể là những người thợ đã được nói đến trong ngữ cảnh; tiếng Việt không cần thêm “chính họ” vì dễ tạo mức nhấn mạnh quá mạnh.
- source_word: יִקְחוּ
  choice: phải lấy
  rationale: Thể vị hoàn thành trong mạch chỉ thị mang lực mệnh lệnh; “phải lấy” diễn đạt tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: הַזָּהָב
  choice: vàng
  rationale: Chỉ vật liệu đã được chỉ định. Tiếng Việt tự nhiên không cần từ tương đương với mạo từ xác định của tiếng Hê-bơ-rơ.
- source_word: הַתְּכֵלֶת
  choice: chỉ xanh lam
  rationale: Danh từ chỉ vật liệu dệt được nhuộm xanh, không chỉ màu sắc trừu tượng; “chỉ” phù hợp với ngữ cảnh may lễ phục, nhưng chú thích vẫn bảo lưu khả năng hiểu rộng hơn là vật liệu dệt.
- source_word: הָאַרְגָּמָן
  choice: chỉ tím
  rationale: Danh từ chỉ vật liệu dệt nhuộm tím; cách dịch này song song với “chỉ xanh lam” và tự nhiên trong danh sách nguyên liệu may mặc.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: chỉ đỏ thắm
  rationale: Thành ngữ nói đến vật liệu màu đỏ thắm được nhuộm bằng phẩm màu có nguồn gốc từ côn trùng; dịch theo vật liệu thích hợp với ngữ cảnh.
- source_word: הַשֵּׁשׁ
  choice: vải gai mịn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ loại vải lanh/gai mịn cao cấp; “vải gai mịn” là cách diễn đạt dễ hiểu, tránh lầm với sợi chưa dệt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phải lấy” để giữ lực chỉ thị; thêm “chỉ” trước các màu nhằm làm rõ đây là nguyên liệu dệt trong ngữ cảnh may lễ phục, đồng thời dùng chú thích để bảo lưu phạm vi nghĩa rộng của nguyên ngữ.
