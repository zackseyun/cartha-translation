base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: vi
  text: Còn đối với các con trai A-rôn, con hãy làm áo dài, đai lưng và mũ đội đầu[a] cho họ, để được vinh hiển và đẹp đẽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mũ tròn”, “khăn xếp” hoặc “đồ đội đầu”; hình dạng chính xác của đồ đội đầu thầy tế lễ này không rõ.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: cho các con trai A-rôn
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ nguyên nghĩa trực tiếp là các con trai của A-rôn, không mở rộng thành hậu duệ.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: con phải may / làm
  rationale: Trong ngữ cảnh chỉ thị, các dạng động từ này mang lực mệnh lệnh. Dùng “may” với áo và “làm” với các vật còn lại để tiếng Việt tự nhiên mà không thay đổi nội dung.
- source_word: כֻתֳּנֹת
  choice: áo dài
  rationale: Chỉ loại áo mặc trên thân, dài hơn áo sơ mi hiện đại. “Áo dài” dễ hiểu trong ngữ cảnh, dù không nhằm chỉ quốc phục Việt Nam.
- source_word: אַבְנֵטִים
  choice: đai lưng
  rationale: Chỉ dải vải quấn quanh eo; “đai lưng” phù hợp hơn “thắt lưng”, vốn dễ gợi một dây đai cứng hiện đại.
- source_word: מִגְבָּעוֹת
  choice: mũ đội đầu
  rationale: Chỉ đồ đội đầu của các thầy tế lễ là con A-rôn. Hình dạng chính xác không chắc chắn, nên bản dịch dùng cách gọi khái quát và giữ các khả năng cụ thể hơn trong chú thích.
- source_word: לְכָבוֹד
  choice: để đem lại vẻ uy nghi
  rationale: כָּבוֹד ở đây diễn tả phẩm giá, sự trang trọng hay vinh hiển của lễ phục; “vẻ uy nghi” tự nhiên trong tiếng Việt và hợp với mục đích thẩm mỹ được nêu song song.
- source_word: וּלְתִפְאָרֶת
  choice: và đẹp đẽ
  rationale: תִּפְאֶרֶת mang nghĩa vẻ đẹp, sự lộng lẫy hay huy hoàng. “Đẹp đẽ” rõ nghĩa, tự nhiên và không diễn giải quá mức.
theological_decisions:
- issue: Mục đích của lễ phục thầy tế lễ
  choice: để đem lại vẻ uy nghi và đẹp đẽ
  alternative: để được vinh hiển và lộng lẫy
  rationale: Cụm Hê-bơ-rơ mô tả phẩm giá trang trọng và vẻ đẹp của lễ phục. Bản dịch giữ cả hai phương diện nhưng không gán thêm ý nghĩa biểu tượng thần học mà câu không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phản ánh lời Đức Chúa Trời truyền trực tiếp cho Môi-se trong văn mạch. Dấu chú thích [a] được đặt ngay sau thuật ngữ còn bất định.
