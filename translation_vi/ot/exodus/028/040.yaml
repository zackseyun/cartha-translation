revisions:
- from: Còn cho các con trai A-rôn, con phải may áo dài, làm đai lưng và mũ đội đầu[a] cho họ, để đem lại vẻ uy nghi và đẹp đẽ.
  to: Còn đối với các con trai A-rôn, con hãy làm áo dài, đai lưng và mũ đội đầu[a] cho họ, để được vinh hiển và đẹp đẽ.
  rationale: Bản sửa giữ nguyên các vật dụng và tính chỉ thị của câu Hê-bơ-rơ, đồng thời dùng «vinh hiển» cho כָּבוֹד và «đẹp đẽ» cho תִפְאֶרֶת mà không thêm diễn giải. Chú thích vẫn được neo ngay tại thuật ngữ bất định và trình bày các khả năng từ vựng hợp lý.
