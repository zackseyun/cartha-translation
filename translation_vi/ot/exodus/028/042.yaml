  to: Hãy may cho họ quần lót bằng vải lanh để che phần thân thể trần truồng[a]; quần phải dài từ thắt lưng đến đùi.
  rationale: Chỉ sửa chất liệu từ “vải gai” thành “vải lanh”, vì בַּד trong văn cảnh này là linen, và thay “lõa lồ” bằng “trần truồng” để câu văn hiện đại hơn. Cấu trúc câu, tính mệnh lệnh, mục đích che phủ, và phạm vi từ thắt lưng đến đùi được giữ nguyên.
