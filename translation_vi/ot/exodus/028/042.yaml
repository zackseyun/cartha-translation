  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: vi
  text: Hãy may cho họ quần lót bằng vải lanh để che phần thân thể trần truồng[a]; quần phải dài từ thắt lưng đến đùi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quần bằng vải lanh” hoặc “quần ngắn bằng vải lanh.” Từ Hê-bơ-rơ chỉ một loại y phục che phần dưới cơ thể, được mặc bên dưới lễ phục tư tế.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Hãy may
  rationale: Động từ mệnh lệnh trong mạch chỉ thị; “may” tự nhiên hơn “làm” khi nói về y phục.
- source_word: לָהֶם
  choice: cho họ
  rationale: Giữ nghĩa hưởng lợi, chỉ các tư tế đã được nhắc đến trong văn cảnh.
- source_word: מִכְנְסֵי בָד
  choice: quần lót bằng vải gai
  rationale: מִכְנְסֵי chỉ y phục che phần dưới cơ thể và mặc bên dưới lễ phục; “quần lót” diễn đạt rõ chức năng trong tiếng Việt hiện đại. בָד ở đây là loại vải gai dùng cho y phục tư tế.
- source_word: לְכַסּוֹת
  choice: để che
  rationale: Diễn đạt tự nhiên động từ nguyên mẫu chỉ mục đích.
- source_word: בְּשַׂר עֶרְוָה
  choice: phần thân thể lõa lồ
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “thịt của sự lõa lồ”; cách dịch này giữ hình ảnh thân thể và ý phải che sự trần truồng mà không quá thô hoặc quá uyển ngữ.
- source_word: מִמָּתְנַיִם
  choice: từ thắt lưng
  rationale: מָתְנַיִם có thể chỉ eo, thắt lưng hoặc vùng hông; “thắt lưng” tự nhiên và rõ trong mô tả chiều dài y phục.
- source_word: וְעַד יְרֵכַיִם
  choice: đến đùi
  rationale: יָרֵךְ thường chỉ đùi; cụm từ nêu điểm cuối phía dưới của y phục.
- source_word: יִהְיוּ
  choice: quần phải dài
  rationale: Động từ có nghĩa cơ bản là “sẽ/phải là”; trong câu mô tả phạm vi của y phục, “phải dài” truyền đạt tự nhiên yêu cầu về chiều dài mà không đổi nội dung.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng nhưng dễ hiểu. Dùng “vải gai” theo cách gọi Kinh Thánh quen thuộc cho בָד, và “quần lót” theo nghĩa y phục mặc bên dưới, không theo sắc thái kiểu dáng hiện đại.
