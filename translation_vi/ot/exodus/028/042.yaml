  source_fidelity: Bản dịch giữ đúng mệnh lệnh, mục đích che phủ và giới hạn từ vùng thắt lưng/eo đến đùi. Tuy nhiên, בַּד trong ngữ cảnh phẩm phục tư tế là vải lanh, không phải “vải gai”; cần sửa để phù hợp nguồn Hê-bơ-rơ.
  naturalness: Câu chỉ thị tự nhiên. “Quần lót” có thể được hiểu theo kiểu đồ lót hiện đại, nhưng với chú thích giải thích đây là y phục mặc bên dưới lễ phục, cách dùng vẫn chấp nhận được. “Thân thể trần truồng” hiện đại và tự nhiên hơn “thân thể lõa lồ”.
  terminology: Sửa “vải gai” thành “vải lanh” cho nhất quán với thuật ngữ phẩm phục tư tế và nghĩa của בַּד. Giữ “quần lót” với chú thích để biểu đạt chức năng của מִכְנְסֵי mà không khẳng định một kiểu dáng hiện đại cụ thể.
