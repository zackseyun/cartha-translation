  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עָשִׂיתָ֮ שְׁתֵּ֣י טַבְּע֣וֹת זָהָב֒ וְ/נָתַתָּ֣ה אֹתָ֡/ם עַל שְׁתֵּי֩ כִתְפ֨וֹת הָ/אֵפ֤וֹד מִ/לְּ/מַ֨טָּה֙ מִ/מּ֣וּל פָּנָ֔י/ו לְ/עֻמַּ֖ת מֶחְבַּרְתּ֑/וֹ מִ/מַּ֕עַל לְ/חֵ֖שֶׁב הָ/אֵפֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: vi
  text: Ngươi phải làm hai khoen bằng vàng và gắn chúng vào hai miếng vai của ê-phốt[a], ở phía dưới, trên mặt trước của nó, ngang với chỗ nối[b], phía trên đai dệt tinh xảo của ê-phốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ê-phốt là một lễ phục đặc biệt của thầy tế lễ.
    reason: cultural_clarification
  - marker: b
    text: Cũng có thể dịch là “nơi ghép lại” hoặc “điểm gắn.” Từ Hê-bơ-rơ nói rộng về nơi các phần của ê-phốt được nối với nhau.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: khoen
  rationale: Trong ngữ cảnh các bộ phận bằng kim loại dùng để buộc hoặc gắn lễ phục, danh từ này chỉ những vòng nhỏ; “khoen” tự nhiên và chính xác hơn “nhẫn” trong tiếng Việt.
- source_word: כִתְפוֹת
  choice: miếng vai
  rationale: Từ này có nghĩa gốc liên quan đến vai, nhưng ở đây chỉ các bộ phận nằm trên vai của lễ phục; “miếng vai” diễn đạt rõ ngữ cảnh chế tác.
- source_word: הָאֵפוֹד
  choice: ê-phốt
  rationale: Giữ dạng phiên âm của thuật ngữ chỉ lễ phục tư tế vì tiếng Việt không có từ tương đương ngắn gọn bao quát chính xác vật này.
- source_word: מִלְּמַטָּה
  choice: ở phía dưới
  rationale: Diễn đạt vị trí thấp hơn hoặc phần dưới của ê-phốt mà không xác định quá mức cấu tạo.
- source_word: מִמּוּל פָּנָיו
  choice: trên mặt trước của nó
  rationale: Chuyển thành ngữ Hê-bơ-rơ về “mặt” của đồ vật sang cách nói tự nhiên trong tiếng Việt, giữ hướng đặt ở phía trước.
- source_word: לְעֻמַּת
  choice: ngang với
  rationale: Ở đây từ này biểu thị sự tương ứng hoặc thẳng hàng về vị trí; “ngang với” phù hợp hơn cách hiểu đối diện hoàn toàn.
- source_word: מֶחְבַּרְתּוֹ
  choice: chỗ nối
  rationale: Danh từ chỉ nơi các phần được nối hay gắn với nhau. “Chỗ nối” giữ nghĩa rộng hơn “đường may” và không giả định kỹ thuật kết nối cụ thể.
- source_word: מִמַּעַל
  choice: phía trên
  rationale: Chỉ vị trí cao hơn bộ phận được nhắc ngay sau đó.
- source_word: חֵשֶׁב הָאֵפוֹד
  choice: đai dệt tinh xảo của ê-phốt
  rationale: חֵשֶׁב chỉ bộ phận dạng đai được chế tác đặc biệt của ê-phốt; cách dịch này vừa nêu chức năng hình thể vừa phản ánh tính công phu trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu. Dùng “ngươi” để phù hợp lời chỉ dẫn trực tiếp trong mạch văn Xuất Hành; giữ thuật ngữ kỹ thuật “ê-phốt” và giải thích ngắn bằng chú thích. Các cụm vị trí được sắp xếp theo nguyên văn, đồng thời dùng cách nói tự nhiên trong tiếng Việt hiện đại.
