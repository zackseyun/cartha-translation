translation:
  language: vi
  text: 'Và hàng thứ hai: ngọc lam[a], đá sapphire và kim cương.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chắc chắn một số loại đá quý thời cổ. נֹפֶךְ có thể là “ngọc lục bảo” hoặc “ngọc hồng lựu”; סַפִּיר có thể chỉ đá lapis lazuli; יָהֲלֹם có thể là “đá jacinth” hoặc “ngọc bích” (jasper).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: và hàng
  rationale: Trong ngữ cảnh các viên đá trên bảng đeo ngực, טוּר chỉ một hàng đá; וְ được giữ bằng “và” để tiếp nối danh sách.
- source_word: הַ/שֵּׁנִי
  choice: thứ hai
  rationale: Số thứ tự bổ nghĩa trực tiếp cho “hàng”; cách diễn đạt tự nhiên trong tiếng Việt là “hàng thứ hai”.
- source_word: נֹפֶךְ
  choice: ngọc lam
  rationale: Danh tính chính xác của loại đá cổ này không chắc chắn. “Ngọc lam” là một tương đương hiện đại khả dĩ; các khả năng khác được giữ trong chú thích.
- source_word: סַפִּיר
  choice: ngọc lam sapphire
  rationale: Cách gọi này phân biệt sapphire với “ngọc lam” (turquoise) đứng trước, đồng thời giữ tên đá quen thuộc. Từ Hê-bơ-rơ có thể chỉ đá lapis lazuli; khả năng ấy được nêu trong chú thích.
- source_word: וְ/יָהֲלֹם
  choice: và kim cương
  rationale: “Kim cương” là cách dịch truyền thống, quen thuộc, nhưng việc nhận diện khoáng vật cổ này còn bất định; các phương án khác được ghi chú.
