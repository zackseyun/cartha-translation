base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: vi
  text: Áo ấy phải ở trên người A-rôn khi ông thi hành chức vụ. Âm thanh của áo ấy[a] phải được nghe thấy khi ông vào Nơi Thánh[b] trước mặt Yahweh và khi ông đi ra, để ông không chết.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “âm thanh/tiếng của nó/người ấy”; theo văn cảnh, đây rất có thể là âm thanh của chiếc áo, do các chuông gắn ở gấu áo phát ra.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nơi thánh” hoặc “thánh điện”; ở đây từ Hê-bơ-rơ chỉ không gian thánh trong Đền Tạm.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “kẻo ông chết.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: Áo ấy phải ở trên người A-rôn
  rationale: Trong mạch chỉ dẫn về lễ phục, động từ ở đây mang sắc thái quy định. Chủ thể được hiểu từ văn cảnh là chiếc áo choàng vừa được mô tả; cách diễn đạt này tự nhiên trong tiếng Việt và không thêm một vật thể mới.
- source_word: לְשָׁרֵת
  choice: khi ông thi hành chức vụ
  rationale: Dạng nguyên mẫu với לְ có thể chỉ mục đích hoặc hoàn cảnh. Cách dịch theo thời điểm phù hợp với ngữ cảnh A-rôn thực hiện phận sự tư tế.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: Tiếng của áo ấy phải được nghe thấy
  rationale: Dạng bị động của שׁמע được giữ lại. Hậu tố số ít giống đực nhiều khả năng quy về chiếc áo choàng có các chuông ở câu 33–34; chú thích vẫn ghi nhận hình thức nguyên văn không nêu rõ danh từ.
- source_word: בְּבֹאוֹ
  choice: khi ông vào
  rationale: Giới từ בְּ với nguyên mẫu và hậu tố mang nghĩa thời gian; đích đến cho thấy hành động đi vào.
- source_word: אֶל הַקֹּדֶשׁ
  choice: vào Nơi Thánh
  rationale: הַקֹּדֶשׁ chỉ không gian thánh của Đền Tạm trong ngữ cảnh này. Viết hoa giúp nhận ra đây là tên gọi mang tính nghi lễ, đồng thời chú thích bảo lưu cách hiểu rộng hơn là nơi thánh.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Dịch trực tiếp thành ngữ chỉ sự hiện diện và giữ tên riêng giao ước יהוה là Yahweh.
- source_word: וּבְצֵאתוֹ
  choice: và khi ông đi ra
  rationale: Giữ cấu trúc thời gian song song với 'khi ông vào' và diễn đạt tự nhiên hướng chuyển động ra khỏi Nơi Thánh.
- source_word: וְלֹא יָמוּת
  choice: để ông không phải chết
  rationale: Trong quy định nghi lễ này, liên từ cùng mệnh đề phủ định diễn tả kết quả hoặc mục đích phòng ngừa. Cách dịch rõ nghĩa trong tiếng Việt hiện đại; cách sát hình thức hơn được ghi ở chú thích.
theological_decisions:
- issue: Vật phát ra âm thanh
  choice: Âm thanh là tiếng của chiếc áo choàng, cụ thể do các chuông trên gấu áo phát ra.
  alternative: Âm thanh có thể được hiểu chung là tiếng của A-rôn khi ông di chuyển.
  rationale: Các câu 33–34 ngay trước đó mô tả những chiếc chuông gắn quanh gấu áo, nên chiếc áo là tiền ngữ tự nhiên nhất của hậu tố trong קוֹלוֹ. Tuy vậy, chú thích ghi nhận rằng tiếng Hê-bơ-rơ chỉ nói theo nghĩa đen là 'tiếng của nó/người ấy'.
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Giữ đây là tên riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu, phù hợp với chứng cứ nguyên ngữ.
- issue: Quan hệ của mệnh đề cuối
  choice: 'Mục đích hoặc kết quả phòng ngừa: để A-rôn không phải chết.'
  alternative: 'Mệnh đề phối hợp theo hình thức: và ông sẽ không chết; hoặc lời cảnh báo: kẻo ông chết.'
  rationale: Ngữ cảnh luật lệ-nghi lễ hỗ trợ quan hệ mục đích/kết quả, nhưng hình thức Hê-bơ-rơ ngắn gọn cho phép cách diễn đạt 'kẻo ông chết', được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thi hành chức vụ” cho hoạt động phụng sự tư tế, tránh thuật ngữ giáo phái. Hai câu tiếng Việt làm rõ chủ thể ngầm của câu Hê-bơ-rơ mà vẫn giữ quan hệ ý nghĩa và các điểm mơ hồ quan trọng trong chú thích.
