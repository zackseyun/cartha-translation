translation:
  language: vi
  text: Hãy làm hai dây xích bằng vàng ròng, bện như dây thừng, theo lối đan dây[a]; rồi gắn những dây xích bện ấy vào các ổ nạm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng hai cách diễn đạt có liên hệ với nhau để mô tả kiểu chế tác xoắn, bện hoặc làm theo dạng dây; nghĩa chính xác của thuật ngữ thứ nhất không chắc chắn.
    reason: lexical_alternative
  - marker: b
    text: “Ổ nạm” cũng có thể dịch là “khung nạm” hoặc “ổ đỡ”, chỉ các bộ phận bằng vàng gắn với phẩm phục của thầy tế lễ.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת
  choice: hai sợi dây chuyền
  rationale: שַׁרְשְׁרֹת chỉ các dây bằng vàng dùng trên lễ phục; “dây chuyền” tự nhiên hơn “dây” và phù hợp với vật liệu kim hoàn.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cách nói trang trọng, thông dụng trong ngữ cảnh Kinh Thánh, diễn đạt vàng tinh khiết.
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: bện như dây thừng
  rationale: Hai cách diễn đạt liên hệ đến dạng xoắn/bện như dây; bản dịch gọn tự nhiên nhưng ghi chú giữ lại sự lặp và độ khó của nguyên văn.
- source_word: וְנָתַתָּ
  choice: rồi gắn
  rationale: Trong ngữ cảnh chế tác lễ phục, động từ נתן mang nghĩa đặt hoặc gắn vật này vào vật kia; “gắn” diễn đạt rõ thao tác.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: các dây chuyền đã bện ấy
  rationale: Giữ lại danh từ “dây chuyền” cùng đặc điểm cấu tạo bện/xoắn được nhắc lại trong tiếng Hê-bơ-rơ.
- source_word: הַמִּשְׁבְּצֹת
  choice: các ổ nạm
  rationale: Chỉ phần khung hoặc ổ bằng vàng dùng để giữ đá và nối với lễ phục; “ổ nạm” phù hợp với thuật ngữ kim hoàn trong mạch văn.
