revisions:
- from: 'Còn ngươi, hãy đưa A-rôn, anh ngươi, cùng các con trai người từ giữa con cái Y-sơ-ra-ên đến gần ngươi, để họ làm thầy tế lễ phụng sự Ta: A-rôn và các con trai người là Na-đáp, A-bi-hu, Ê-lê-a-sa và Y-tha-ma.[a]'
  to: 'Còn ngươi, hãy đưa A-rôn, anh em của ngươi, cùng các con trai ông đến gần ngươi từ giữa dân Y-sơ-ra-ên,[a] để họ làm thầy tế lễ phụng sự Ta: A-rôn; và các con trai của ông là Na-đáp, A-bi-hu, Ê-lê-a-sa và Y-tha-ma.'
  rationale: Sửa “anh ngươi” thành “anh em của ngươi” để không thêm thông tin tuổi tác. Dùng “dân Y-sơ-ra-ên” kèm chú thích để vừa tự nhiên vừa bảo lưu cách gọi đen của tiếng Hê-bơ-rơ. Tổ chức lại phần liệt kê để phân biệt A-rôn với bốn người là các con trai của ông, đúng với cú pháp và phạm vi của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:49:28Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng mệnh lệnh đưa A-rôn và các con trai ông ra từ cộng đồng Y-sơ-ra-ên để thi hành chức vụ tế lễ cho Đức Chúa Trời. Tuy nhiên, “anh ngươi” xác định tuổi tác không có trong אָחִיךָ, và cách nối danh sách cuối câu khiến “các con trai người” có thể bị hiểu là bao gồm cả A-rôn.
  naturalness: “Từ giữa con cái Y-sơ-ra-ên” là lối nói sát hình thức nhưng gượng trong tiếng Việt hiện đại. “Từ giữa dân Y-sơ-ra-ên” tự nhiên hơn, với chú thích bảo lưu cách diễn đạt đen của tiếng Hê-bơ-rơ. Việc tách A-rôn khỏi danh sách bốn con trai của ông làm câu sáng rõ và tự nhiên.
  terminology: Giữ “thầy tế lễ,” “phụng sự Ta,” đại từ trang trọng “ngươi/Ta,” và các tên phiên âm quen dùng. “Anh em của ngươi” bảo toàn nghĩa quan hệ huynh đệ mà không tự ý chỉ định A-rôn là anh lớn.
  issues:
  - severity: medium
    issue: “anh ngươi” thêm sắc thái anh lớn.
    rationale: אָחִיךָ chỉ có nghĩa là “anh em/brother của ngươi”; dù mạch truyện khác cho biết A-rôn lớn tuổi hơn Môi-se, câu này không nêu đặc điểm ấy.
  - severity: medium
    issue: Danh sách cuối câu mơ hồ về quan hệ “các con trai người.”
    rationale: Cấu trúc “A-rôn và các con trai người là Na-đáp...” có thể khiến người đọc coi A-rôn cũng là một trong các con trai được liệt kê. Nguyên văn nêu A-rôn riêng, rồi nêu bốn con trai của A-rôn.
  - severity: low
    issue: “Từ giữa con cái Y-sơ-ra-ên” thiếu tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này là bản dịch hình thức của בְּנֵי יִשְׂרָאֵל. “Dân Y-sơ-ra-ên” truyền đạt đúng nghĩa tập thể; chú thích giữ thông tin về cách nói đen của nguồn.
  revised_text: 'Còn ngươi, hãy đưa A-rôn, anh em của ngươi, cùng các con trai ông đến gần ngươi từ giữa dân Y-sơ-ra-ên,[a] để họ làm thầy tế lễ phụng sự Ta: A-rôn; và các con trai của ông là Na-đáp, A-bi-hu, Ê-lê-a-sa và Y-tha-ma.'
