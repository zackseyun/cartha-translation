  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: vi
  text: 'Còn ngươi, hãy đưa A-rôn, anh em của ngươi, cùng các con trai ông đến gần ngươi từ giữa dân Y-sơ-ra-ên,[a] để họ làm thầy tế lễ phụng sự Ta: A-rôn; và các con trai của ông là Na-đáp, A-bi-hu, Ê-lê-a-sa và Y-tha-ma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “từ giữa con cái của Y-sơ-ra-ên,” một cách gọi toàn thể dân Y-sơ-ra-ên.'
    reason: Bảo lưu cách gọi cộng đồng theo nguyên văn trong khi dùng cách diễn đạt tự nhiên hơn ở bản văn chính.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Còn ngươi
  rationale: Đại từ được nêu rõ để nhấn mạnh và chuyển lời trực tiếp sang Môi-se; “Còn ngươi” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: hãy đưa ... đến gần ngươi
  rationale: Giữ hình ảnh cụ thể của động từ Hiphil קרב và hướng đến Môi-se, nhưng không diễn giải quá mức thành nghi thức phong chức.
- source_word: אָחִיךָ
  choice: anh ngươi
  rationale: Giữ rõ quan hệ ruột thịt; A-rôn là anh của Môi-se theo mạch truyện.
- source_word: בָּנָיו אִתּוֹ
  choice: cùng các con trai người
  rationale: “Cùng” bảo toàn ý đồng hành của אִתּוֹ và cho thấy A-rôn với các con được gọi chung.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: từ giữa con cái Y-sơ-ra-ên
  rationale: Bảo tồn cách gọi cộng đồng giao ước theo hình thức Hê-bơ-rơ, đồng thời vẫn dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
- source_word: לְכַהֲנוֹ לִי
  choice: để họ làm thầy tế lễ phụng sự Ta
  rationale: Diễn đạt chức năng tư tế và quan hệ phục vụ dành cho Đức Chúa Trời; “họ” làm rõ rằng mệnh đề bao gồm cả A-rôn lẫn các con.
- source_word: בְּנֵי אַהֲרֹן
  choice: các con trai người
  rationale: Đại từ hồi chỉ tránh lặp nặng trong tiếng Việt mà vẫn xác định bốn người được kể tên là con trai A-rôn.
theological_decisions:
- issue: Cách gọi cộng đồng בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên
  rationale: Cách chọn chính giữ hình thức nguồn và sắc thái chỉ cộng đồng giao ước; chú thích nêu cách nói hiện đại hơn mà không thay đổi phạm vi chỉ toàn dân.
- issue: Phạm vi của לְכַהֲנוֹ לִי
  choice: để họ làm thầy tế lễ phụng sự Ta
  alternative: để người làm thầy tế lễ phụng sự Ta
  rationale: Ngữ cảnh và danh sách gồm A-rôn cùng các con cho thấy chức vụ tư tế áp dụng cho cả nhóm; tiếng Việt cần thêm chủ ngữ số nhiều để tránh hiểu lầm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; dùng “ngươi/Ta” để giữ lời phán trực tiếp có sắc thái uy nghi. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Dấu chú thích [a] xuất hiện trong câu chính.
