  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: vi
  text: '“Đây là những y phục họ phải làm: tấm đeo ngực[a], ê-phốt[b], áo choàng, áo chùng dệt hoa văn[c], khăn quấn đầu và đai lưng. Họ phải làm lễ phục thánh cho A-rôn, anh của con, và cho các con trai ông, để ông làm thầy tế lễ phụng sự Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bảng đeo ngực”; đây là vật dụng tế lễ đeo trước ngực, không phải áo giáp.
    reason: lexical_alternative
  - marker: b
    text: “Ê-phốt” là tên Hê-bơ-rơ của một lễ phục tế lễ đặc thù, không có từ tương đương chính xác trong tiếng Việt.
    reason: cultural_note
  - marker: c
    text: Cụm từ Hê-bơ-rơ có thể chỉ một chiếc áo được dệt thành hoa văn hoặc ô hình; kiểu hoa văn cụ thể không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: y phục
  rationale: Từ ngữ tự nhiên, trang trọng, phù hợp với quần áo dành cho chức vụ tế lễ mà không mang sắc thái giáo hội về sau.
- source_word: יַעֲשׂוּ
  choice: họ phải may
  rationale: Thể chưa hoàn thành có lực chỉ thị trong mạch mệnh lệnh; với y phục, “may” tự nhiên và cụ thể hơn “làm” trong tiếng Việt.
- source_word: חֹשֶׁן
  choice: tấm đeo ngực
  rationale: Diễn tả vật dụng tế lễ đeo trước ngực và tránh khiến người đọc hiểu đây là áo giáp.
- source_word: אֵפוֹד
  choice: ê-phốt
  rationale: Đây là tên một lễ phục đặc thù không có từ tương đương chính xác trong tiếng Việt, nên phiên âm và giải thích bằng chú thích.
- source_word: מְעִיל
  choice: áo choàng
  rationale: Cách gọi rõ ràng, hiện đại cho chiếc áo mặc ngoài trong bộ lễ phục.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: áo chùng dệt hoa văn
  rationale: “Áo chùng” diễn đạt chiếc áo dài kiểu tunic; “dệt hoa văn” giữ ý về kỹ thuật dệt có họa tiết nhưng không xác quyết rằng đó nhất thiết là hình ô vuông.
- source_word: מִצְנֶפֶת
  choice: khăn quấn đầu
  rationale: Diễn tả rõ loại vật đội đầu được quấn, không gán cho nó kiểu dáng của một loại mũ hiện đại cụ thể.
- source_word: אַבְנֵט
  choice: đai lưng
  rationale: Chỉ dải vải quấn quanh người trong lễ phục, tự nhiên hơn một từ có thể gợi dây nịt hiện đại.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: lễ phục thánh
  rationale: Giữ trực tiếp ý niệm thánh biệt, đồng thời làm rõ đây là trang phục dùng trong chức vụ tế lễ.
- source_word: לְכַהֲנוֹ לִי
  choice: để ông làm thầy tế lễ phụng sự Ta
  rationale: Giữ mục đích của nguyên ngữ và ý nghĩa chủ động của động từ làm chức tế lễ; đại từ số ít quy về A-rôn.
theological_decisions:
- issue: Cách gọi các lễ phục tế lễ mà không du nhập thuật ngữ giáo hội về sau
  choice: Dùng từ Việt phổ thông, chính xác khi có thể, nhưng phiên âm “ê-phốt” vì không có từ tương đương đầy đủ.
  alternative: Dùng toàn bộ các thuật ngữ truyền thống hoặc diễn giải ê-phốt thành một loại áo hay tạp dề cụ thể.
  rationale: Cách này giữ tính đặc thù của bối cảnh Đền Tạm mà không áp đặt hình dạng còn chưa được một từ tiếng Việt nào diễn đạt trọn vẹn.
- issue: Đối tượng kế tục chức tế lễ
  choice: các con trai ông
  alternative: các con hoặc dòng dõi ông
  rationale: בָּנָיו nói cụ thể đến các con trai của A-rôn trong bối cảnh chức tế lễ, nên không trung tính hóa giới tính.
- issue: Số ít trong לְכַהֲנוֹ
  choice: để ông làm thầy tế lễ phụng sự Ta
  alternative: để họ làm thầy tế lễ phụng sự Ta
  rationale: Hậu tố số ít trong nguyên ngữ quy trực tiếp về A-rôn, dù ngay trước đó cũng nhắc đến các con trai ông; bản dịch giữ sự căng nhẹ về ngữ pháp thay vì âm thầm đổi thành số nhiều.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “con” vì lời Đức Chúa Trời đang trực tiếp phán với Môi-se, và viết hoa “Ta” theo quy ước chỉ Đức Chúa Trời. Các tên riêng được phiên âm theo cách đọc quen thuộc trong tiếng Việt.
