source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: vi
  text: '“Ngươi phải làm tấm đeo ngực phán quyết[a], là công việc chế tác khéo léo[b]; theo kiểu chế tác của ê-phót, ngươi phải làm nó: bằng vàng, sợi xanh lam, tím, đỏ tươi và vải lanh mịn se, ngươi phải làm nó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tấm đeo ngực để phán quyết” hoặc “tấm đeo ngực quyết định.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “công việc được dệt khéo léo”; tiếng Hê-bơ-rơ chỉ công việc thủ công có thiết kế và được thực hiện thành thạo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: tấm đeo ngực
  rationale: Chỉ vật phẩm nghi lễ trang trí được thầy tế lễ thượng phẩm đeo trên ngực. Cách dịch này tránh hàm ý áo giáp của “tấm giáp ngực” và tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: מִשְׁפָּט
  choice: phán quyết
  rationale: Giữ mối liên hệ với chức năng phân xử hoặc đưa ra quyết định trong cụm từ nghi lễ, nhưng không xác định cơ chế mà câu này chưa giải thích.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: do một thợ thiết kế khéo léo thực hiện
  rationale: Diễn đạt công việc thủ công có hoa văn do một nghệ nhân lành nghề hoạch định và thực hiện, thay vì thu hẹp nghĩa thành riêng việc thêu hay dệt.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: giống như ê-phót
  rationale: Truyền đạt sự so sánh về kiểu chế tác với ê-phót một cách gọn và tự nhiên.
- source_word: אֵפֹד
  choice: ê-phót
  rationale: Giữ thuật ngữ chuyên biệt chỉ một lễ phục tư tế vì tiếng Việt không có từ tương đương ngắn gọn và chính xác.
- source_word: זָהָב
  choice: vàng
  rationale: Tên vật liệu trực tiếp trong danh sách nguyên liệu.
- source_word: תְּכֵלֶת
  choice: chỉ xanh lam
  rationale: Màu nhuộm xanh dùng trong hàng dệt; “chỉ” được bổ sung theo ngữ cảnh chế tác để câu tiếng Việt rõ nghĩa.
- source_word: אַרְגָּמָן
  choice: tím
  rationale: Cách gọi tự nhiên cho màu nhuộm quý này; danh từ “chỉ” ở đầu cụm được hiểu chung cho các màu kế tiếp.
- source_word: תוֹלַעַת שָׁנִי
  choice: đỏ tươi
  rationale: Diễn đạt màu đỏ scarlet của vật liệu dệt mà không đưa thêm chi tiết ngoài câu nguồn.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe
  rationale: Giữ cả chất liệu vải gai mịn và đặc điểm sợi được xe lại theo thuật ngữ hàng dệt của Đền Tạm.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: Ngươi phải làm nó ... [các vật liệu dùng để làm]
  rationale: Tiếng Việt giữ mệnh lệnh làm vật phẩm nhưng tránh lặp máy móc ở cuối câu, nơi cấu trúc liệt kê vật liệu đã thể hiện rõ hành động.
theological_decisions:
- issue: Chức năng của חֹשֶׁן מִשְׁפָּט
  choice: tấm đeo ngực phán quyết
  alternative: tấm đeo ngực để phán quyết; tấm đeo ngực xét xử
  rationale: Cụm Hê-bơ-rơ có thể nêu đặc tính hoặc mục đích của vật phẩm. Bản dịch chính giữ cấu trúc cô đọng và sắc thái tư pháp-nghi lễ, còn chú thích bảo tồn khả năng hiểu theo mục đích mà không áp đặt một cơ chế cầu hỏi cụ thể.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu, dùng “ngươi” phù hợp lời Đức Chúa Trời trực tiếp truyền cho Môi-se trong ngữ cảnh. “Ê-phót” được phiên âm như một thuật ngữ nghi lễ. Các màu được trình bày thành một chuỗi tự nhiên trong tiếng Việt; “chỉ” chi phối cả ba màu.
