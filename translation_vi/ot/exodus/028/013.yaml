  terminology: Dùng “khung gắn” cho מִשְׁבְּצֹת phù hợp hơn “ổ đỡ”; chú thích duy trì các khả năng “giá gắn” và “ổ gắn”, đồng thời tránh “chạm lộng” vì đó là chi tiết không chắc chắn từ riêng từ Hê-bơ-rơ này.
