  source_fidelity: Động từ mệnh lệnh trong chuỗi chỉ thị được chuyển đúng bằng “Ngươi phải làm”, và “bằng vàng” diễn đạt chính xác chất liệu. Tuy nhiên, “ổ đỡ” thường chỉ bộ phận nâng đỡ về cơ khí, không phù hợp rõ ràng với các bộ phận kim hoàn/trang trí mà מִשְׁבְּצֹת chỉ đến trong ngữ cảnh này.
