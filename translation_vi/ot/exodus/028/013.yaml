lexical_decisions:
- source_word: וְ/עָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Trong chuỗi chỉ thị này, động từ ngôi thứ hai số ít cùng liên từ được diễn đạt tự nhiên bằng mệnh lệnh quy định; không cần dịch riêng liên từ וְ thành “và” vì câu tiếng Việt đứng độc lập sẽ gọn và tự nhiên hơn.
- source_word: מִשְׁבְּצֹת
  choice: các ổ đỡ
  rationale: Danh từ chỉ những bộ phận trang trí dùng để giữ hoặc gắn đá quý hay dây xích. “Ổ đỡ” rõ nghĩa trong tiếng Việt hiện đại mà không xác định quá mức kỹ thuật chế tác.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt vật liệu cấu thành một cách tự nhiên và chính xác trong tiếng Việt.
