base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/024.yaml
  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: vi
  text: Hãy gắn hai dây chuyền bằng vàng, được bện lại[a], vào hai chiếc vòng ở hai đầu của tấm đeo ngực[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dây chuyền xoắn”.
    reason: lexical_alternative
  - marker: b
    text: Theo truyền thống, từ Hê-bơ-rơ חֹשֶׁן thường được dịch là “bảng đeo ngực”; đây là vật phẩm trong lễ phục của thầy tế lễ đeo trước ngực.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Con phải gắn
  rationale: Trong chuỗi chỉ dẫn, dạng động từ này mang lực mệnh lệnh. “Gắn” diễn đạt tự nhiên thao tác nối dây chuyền vào các vòng, cụ thể hơn “đặt” trong ngữ cảnh này.
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: hai sợi dây chuyền bằng vàng, được bện lại
  rationale: עֲבֹתֹת chỉ các dây hoặc dây chuyền có kết cấu xoắn/bện; cách dịch này vừa nêu vật liệu vàng vừa giữ đặc điểm chế tác.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: vào hai chiếc vòng
  rationale: עַל ở đây diễn tả việc gắn dây chuyền với các vòng; tiếng Việt dùng “gắn ... vào” tự nhiên hơn dịch máy móc là “trên”.
- source_word: אֶל קְצוֹת הַחֹשֶׁן
  choice: ở hai đầu của túi đeo ngực
  rationale: קְצוֹת là các đầu hoặc mép tận cùng. חֹשֶׁן là vật phẩm lễ phục tư tế đeo trước ngực, không phải áo giáp; “túi đeo ngực” giúp độc giả hiện đại hình dung chức năng và hình dạng tốt hơn.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng hiện đại. Dùng “Con phải” để thể hiện lời Đức Chúa Trời truyền trực tiếp cho Môi-se trong mạch văn; dùng “gắn ... vào” thay cho cấu trúc sát chữ nhưng kém tự nhiên. Các dấu chú thích [a], [b] đều có mặt trong câu chính.
