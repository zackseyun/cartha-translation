  to: Hãy gắn hai dây chuyền bằng vàng, được bện lại[a], vào hai chiếc vòng ở hai đầu của tấm đeo ngực[b].
  rationale: Thay xưng hô có thêm hàm ý bằng mệnh lệnh không đánh dấu chủ thể; thay cách gọi và chú thích về חֹשֶׁן bằng thuật ngữ trung tính, hiện đại hơn. Các chi tiết về số lượng, chất liệu, kết cấu bện, vòng gắn và vị trí ở hai đầu đều được giữ nguyên.
