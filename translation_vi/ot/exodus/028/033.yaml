base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: vi
  text: Hãy làm các quả lựu[a] bằng sợi xanh lam, tím và đỏ thắm quanh gấu áo; xen giữa chúng là các chuông vàng, cũng quanh gấu áo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “những vật trang trí hình quả lựu.” Tiếng Hê-bơ-rơ nói nguyên văn là “những quả lựu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Con hãy làm
  rationale: Dạng động từ trong mạch chỉ thị mang ý nghĩa mệnh lệnh; “hãy làm” tự nhiên và rõ ràng trong tiếng Việt, còn “con” giữ lối Đức Chúa Trời phán trực tiếp với Môi-se.
- source_word: עַל שׁוּלָיו
  choice: quanh gấu áo
  rationale: שׁוּלָיו chỉ mép dưới của chiếc áo choàng đã nói ở câu trước; “gấu áo” là cách gọi thông dụng và chính xác trong tiếng Việt.
- source_word: רִמֹּנֵי
  choice: những quả lựu
  rationale: Danh từ Hê-bơ-rơ nói nguyên nghĩa là “quả lựu”; bản dịch chính giữ cách diễn đạt cụ thể của nguồn, còn chú thích nêu khả năng đây là các vật trang trí hình quả lựu.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: bằng sợi màu xanh lam, màu tím và màu đỏ thắm
  rationale: Ba thuật ngữ chỉ các vật liệu dệt đã nhuộm màu dùng trong đồ thánh. Thêm “sợi” theo ngữ cảnh để người đọc hiểu các quả lựu được làm bằng vật liệu dệt, không phải quả thật.
- source_word: סָבִיב
  choice: quanh; chạy quanh
  rationale: Từ này xuất hiện hai lần và nhấn mạnh sự bố trí bao quanh toàn bộ gấu áo; cách diễn đạt tiếng Việt tránh nặng nề nhưng vẫn bảo toàn sự lặp lại về ý.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: những chuông vàng
  rationale: Cách dịch trực tiếp, tự nhiên của cụm “chuông bằng vàng” trong tiếng Hê-bơ-rơ.
- source_word: בְּתוֹכָם
  choice: xen giữa chúng
  rationale: Nghĩa đen là “ở giữa chúng”; trong cách bố trí quanh gấu áo, “xen giữa” diễn đạt rõ các chuông được đặt giữa những quả lựu mà không khẳng định thêm một mô hình chi tiết ngoài câu.
