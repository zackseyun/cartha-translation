translation_notes:
  register: Văn phong chỉ thị trang nghiêm nhưng hiện đại, dễ hiểu. Dùng “con” theo lời phán trực tiếp với Môi-se và gọi phần dưới của áo là “gấu áo.” Dấu chú thích [a] được đặt ngay sau cụm mô tả vật liệu của những quả lựu.
