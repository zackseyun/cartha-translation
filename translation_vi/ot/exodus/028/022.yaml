  yaml_path: translation/ot/exodus/028/022.yaml
  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: vi
  text: Ngươi phải làm trên tấm đeo ngực những dây xích bằng vàng ròng[a], theo lối bện như dây thừng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những dây xích xoắn” hoặc “những dây xích kết như dây thừng”; tiếng Hê-bơ-rơ mô tả các dây xích được làm theo kiểu bện, xoắn hoặc giống dây thừng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Dạng động từ trong chuỗi chỉ thị mang lực mệnh lệnh; cách dịch này tự nhiên và giữ rõ tính quy định.
- source_word: עַל הַחֹשֶׁן
  choice: trên bảng đeo ngực
  rationale: עַל có nghĩa cơ bản là “trên”; trong chỉ dẫn chế tác, cụm này nói đến vị trí gắn các dây chuyền. “Bảng đeo ngực” diễn đạt vật phẩm này rõ hơn “bảng ngực” trong tiếng Việt hiện đại.
- source_word: שַׁרְשֹׁת
  choice: những dây chuyền
  rationale: Danh từ số nhiều chỉ các dây bằng những mắt liên kết; “dây chuyền” rõ nghĩa và phù hợp với ngữ cảnh đồ kim hoàn.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: bện như dây thừng
  rationale: Cụm Hê-bơ-rơ mô tả kiểu chế tác xoắn, bện hoặc kết thành dạng dây; cách dịch này giữ hình ảnh cụ thể mà không dùng thuật ngữ kỹ thuật khó hiểu.
- source_word: זָהָב טָהוֹר
  choice: vàng ròng
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt để chỉ vàng tinh khiết.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ thị trang trọng, rõ ràng và dễ hiểu. Dùng đại từ “ngươi” để phù hợp với lời truyền trực tiếp cho Môi-se trong ngữ cảnh luật pháp; giữ hình ảnh thủ công của nguyên bản và không giải quyết quá mức sắc thái giữa bện, xoắn và kết dây.
