base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: vi
  text: Họ phải dùng một sợi dây màu xanh[a] để buộc các vòng của túi đeo ngực[b] vào các vòng của ê-phót, để túi nằm trên đai được dệt khéo của ê-phót và không bị xê dịch khỏi ê-phót.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một sợi dây bằng chỉ xanh.” Từ Hê-bơ-rơ תְּכֵלֶת chỉ vật liệu nhuộm màu xanh dùng trong các hàng dệt của Đền Tạm và lễ phục tư tế.'
    reason: lexical_alternative
  - marker: b
    text: Theo truyền thống cũng dịch là “miếng đeo ngực.” Đây là vật thuộc lễ phục tư tế, không phải áo giáp che ngực.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “không bị tuột khỏi ê-phót.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: buộc
  rationale: Động từ chỉ việc buộc hoặc giữ chắc các bộ phận với nhau; “buộc” tự nhiên trong ngữ cảnh dùng dây và vòng mà không xác định quá mức cách thao tác.
- source_word: הַחֹשֶׁן
  choice: túi đeo ngực
  rationale: Trong lễ phục tư tế, từ này chỉ vật đeo trước ngực có dạng túi và gắn vào ê-phót, không phải áo giáp; cách dịch này rõ nghĩa với độc giả hiện đại.
- source_word: מִטַּבְּעֹתָיו אֶל טַבְּעֹת הָאֵפֹד
  choice: các vòng của túi đeo ngực vào các vòng của ê-phót
  rationale: Diễn đạt rõ hai điểm nối; giới từ מִן đánh dấu điểm xuất phát gắn kết và אֶל chỉ điểm hướng tới.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: bằng một sợi dây màu xanh
  rationale: פְּתִיל là dây hoặc sợi; תְּכֵלֶת chỉ vật liệu nhuộm màu xanh dùng trong các hàng dệt của Đền Tạm. Không xác định sắc độ vốn còn được tranh luận.
- source_word: לִהְיוֹת עַל
  choice: để túi nằm trên
  rationale: Dạng nguyên mẫu diễn tả mục đích hoặc kết quả; “nằm trên” diễn đạt vị trí ổn định trong tiếng Việt mà vẫn giữ quan hệ không gian của עַל.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: đai dệt khéo của ê-phót
  rationale: חֵשֶׁב ở đây là phần đai dệt liền hoặc gắn với ê-phót; “dệt khéo” phù hợp ngữ cảnh chế tác tinh xảo mà không biến nó thành một vật riêng biệt chắc chắn.
- source_word: וְלֹא יִזַּח
  choice: không bị xê khỏi
  rationale: Dạng Niphal diễn tả việc bị dịch chuyển hoặc tuột khỏi vị trí. “Bị xê khỏi” giữ sắc thái vị trí và không thu hẹp nghĩa chỉ còn 'tuột lỏng'.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng nhưng tự nhiên. Giữ thuật ngữ phiên âm “ê-phót” vì đây là tên riêng của một loại lễ phục tư tế; dùng “túi đeo ngực” để tránh liên tưởng đến áo giáp và giúp độc giả phổ thông hình dung chức năng của vật này.
