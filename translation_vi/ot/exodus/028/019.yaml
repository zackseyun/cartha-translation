  text: 'và hàng thứ ba: ngọc dạ lan hương[a], mã não[b] và thạch anh tím.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chắc chắn các loại đá được gọi tên tại đây; “ngọc dạ lan hương” dịch לֶשֶׁם, theo truyền thống cũng được dịch là “ligure.”
    reason: lexical_alternative
  - marker: b
    text: Hoặc có thể là “mã não đen” (onyx) cho שְׁבוֹ; các tên đá quý thời cổ không phải lúc nào cũng tương ứng chính xác với tên khoáng vật hiện đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: và hàng
  rationale: Trong ngữ cảnh các viên đá trên bảng đeo ngực, טוּר chỉ một hàng đá; וְ nối tiếp danh sách ở câu trước.
- source_word: הַשְּׁלִישִׁי
  choice: thứ ba
  rationale: Số thứ tự xác định đây là hàng thứ ba.
- source_word: לֶשֶׁם
  choice: ngọc dạ lan hương
  rationale: Danh tính chính xác của loại đá cổ này không chắc chắn. Cách gọi này tương ứng với “jacinth/hyacinth” và sự bất định được nêu trong chú thích.
- source_word: שְׁבוֹ
  choice: mã não
  rationale: “Mã não” là cách hiểu truyền thống, dễ nhận biết và hợp lý, dù thuật ngữ khoáng vật cổ không thể được đồng nhất chắc chắn với tên gọi hiện đại.
- source_word: וְאַחְלָמָה
  choice: và thạch anh tím
  rationale: אַחְלָמָה thường được nhận diện là amethyst; “thạch anh tím” là tên gọi hiện đại, rõ nghĩa trong tiếng Việt.
