base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: vi
  text: Con hãy gắn hai đầu của hai dây bện[a] vào hai bộ phận nạm, rồi đặt hai bộ phận nạm ấy trên các miếng vai của ê-phót, ở phía trước ê-phót.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hai dây xích”. Từ Hê-bơ-rơ có thể chỉ dây bện hoặc dây/chuỗi xích; ngữ cảnh các chi tiết bằng vàng nghiêng về cấu tạo dạng xích.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: đầu
  rationale: Chỉ các điểm tận cùng của hai dây; cách nói tự nhiên và chính xác trong ngữ cảnh lắp ráp.
- source_word: הָעֲבֹתֹת
  choice: dây bện
  rationale: Từ Hê-bơ-rơ có thể chỉ dây xoắn hoặc vật kết dạng xích; “dây bện” giữ được hình ảnh đan bện mà không xác quyết quá mức về cấu tạo.
- source_word: הַמִּשְׁבְּצֹת
  choice: ổ nạm
  rationale: Chỉ các bộ phận bằng vàng dùng để giữ hoặc gắn vật trang sức; “ổ nạm” vừa dễ hiểu vừa phù hợp ngữ cảnh kim hoàn.
- source_word: כִתְפֹת
  choice: miếng vai
  rationale: Trong ngữ cảnh y phục, từ này chỉ các phần nằm trên vai của ê-phót, không phải vai theo nghĩa giải phẫu.
- source_word: אֵפֹד
  choice: ê-phót
  rationale: Đây là tên riêng của một loại lễ phục tư tế không có từ tương đương chính xác trong tiếng Việt, nên dùng dạng phiên âm quen thuộc.
- source_word: אֶל מוּל פָּנָיו
  choice: ở phía trước áo
  rationale: Diễn đạt vị trí ở mặt trước của ê-phót; thêm “áo” để đại từ sở hữu trong nguyên văn có đối tượng rõ ràng và tự nhiên trong tiếng Việt.
- source_word: וְנָתַתָּה
  choice: rồi đặt chúng
  rationale: Giữ hành động đặt/gắn của נתן và diễn đạt mạch chỉ dẫn tuần tự tự nhiên; “chúng” quy chiếu các bộ phận vừa được gắn.
theological_decisions: []
translation_notes:
  register: Văn phong chỉ dẫn trang trọng, rõ ràng và hiện đại. Dùng “con” phù hợp lời Đức Chúa Trời truyền trực tiếp cho Môi-se trong mạch văn; giữ thuật ngữ lễ phục “ê-phót” và dùng thuật ngữ thủ công dễ hiểu “ổ nạm”.
