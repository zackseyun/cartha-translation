revisions:
- from: Ngươi hãy mặc lễ phục cho họ, tức là A-rôn, anh ngươi, và các con trai người ở cùng người; hãy xức dầu cho họ, lập họ vào chức vụ[a] và biệt họ ra thánh, để họ phụng sự Ta trong chức thầy tế lễ.
  to: Ngươi hãy mặc lễ phục cho họ, tức là A-rôn, anh ngươi, cùng các con trai ông ấy; hãy xức dầu cho họ, lập họ vào chức tế lễ[a], thánh hiến họ, để họ phục vụ Ta với tư cách thầy tế lễ.
  rationale: Bản sửa giữ nguyên nghĩa và trật tự nghi lễ của tiếng Hê-bơ-rơ, đồng thời thay các cụm không tự nhiên bằng thuật ngữ tiếng Việt hiện đại, trang trọng và phù hợp ngữ cảnh tế lễ. Chú thích được giữ tại “lập họ vào chức tế lễ” để bảo tồn hình thức thành ngữ nguyên ngữ.
