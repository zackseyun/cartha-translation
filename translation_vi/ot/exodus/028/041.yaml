  - severity: medium
    issue: “phụng sự Ta trong chức thầy tế lễ”
    rationale: Cách nói này hơi gượng và làm mờ động từ כהן, nghĩa là thi hành chức năng thầy tế lễ. “Phục vụ Ta với tư cách thầy tế lễ” diễn đạt trực tiếp hơn.
  - severity: low
