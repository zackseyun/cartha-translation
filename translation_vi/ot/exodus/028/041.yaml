    rationale: Hai đại từ “người” liên tiếp dễ gây lúng túng về quy chiếu. “cùng các con trai ông ấy” giữ ý các con trai thuộc về/đi cùng A-rôn trong cấu trúc tiếng Việt tự nhiên.
