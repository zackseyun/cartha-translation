base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: vi
  text: Ngươi hãy mặc lễ phục cho họ, tức là A-rôn, anh ngươi, cùng các con trai ông ấy; hãy xức dầu cho họ, lập họ vào chức tế lễ[a], thánh hiến họ, để họ phục vụ Ta với tư cách thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “làm đầy tay họ”, một thành ngữ Hê-bơ-rơ chỉ việc chính thức lập một người vào chức vụ tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: Ngươi hãy mặc lễ phục cho họ
  rationale: Động từ Hiphil của לבשׁ mang nghĩa khiến ai đó mặc y phục. Thêm “lễ phục” theo ngữ cảnh trực tiếp về phẩm phục tế lễ để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: tức là A-rôn, anh ngươi, và các con trai người ở cùng người
  rationale: “Tức là” làm rõ đại từ chỉ trước “họ”; “ở cùng người” giữ lại ý אִתּוֹ, trong đó A-rôn là nhân vật trung tâm.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: hãy xức dầu cho họ
  rationale: “Xức dầu” là cách diễn đạt nghi lễ tự nhiên và chính xác cho משׁח trong bối cảnh thiết lập chức tế lễ.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: lập họ vào chức vụ
  rationale: Cụm từ theo nghĩa đen là “làm đầy tay họ”, nhưng đây là thành ngữ Hê-bơ-rơ chỉ việc chính thức thiết lập một người vào chức vụ tế lễ. Cách dịch này truyền đạt chức năng của thành ngữ mà không gắn với nghi thức phong chức riêng của một truyền thống về sau.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: biệt họ ra thánh
  rationale: קדשׁ ở đây nói đến việc dành riêng họ làm thánh cho công việc thánh; “biệt ra thánh” giữ được cả ý dành riêng lẫn tính thánh.
- source_word: וְכִהֲנוּ לִי
  choice: để họ phụng sự Ta trong chức thầy tế lễ
  rationale: Piel của כהן diễn tả việc thi hành chức năng tế lễ. “Phụng sự Ta trong chức thầy tế lễ” giữ cả hành động phục vụ và đối tượng được phục vụ là Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch thành ngữ thiết lập chức tế lễ מִלֵּא אֶת־יָד
  choice: Dịch trong chính văn là “lập họ vào chức vụ”
  alternative: Dịch sát chữ là “làm đầy tay họ” hoặc dùng “phong chức cho họ”
  rationale: “Làm đầy tay” khó hiểu đối với độc giả Việt hiện đại, còn “phong chức” có thể gợi những nghi thức giáo hội về sau. “Lập họ vào chức vụ” diễn đạt đúng việc chính thức thiết lập họ vào chức tế lễ, đồng thời chú thích bảo tồn hình thức nguyên ngữ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ngươi/Ta” phù hợp lời Đức Chúa Trời trực tiếp phán với Môi-se; dùng “thầy tế lễ” theo thuật ngữ Kinh Thánh tiếng Việt quen thuộc. Cấu trúc mệnh lệnh nối tiếp phản ánh chuỗi động từ Hê-bơ-rơ.
