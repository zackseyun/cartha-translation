  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: vi
  text: Còn ngươi, hãy nói với tất cả những người có lòng khôn ngoan[a], là những người Ta đã làm cho họ đầy dẫy thần khí khôn ngoan[b]. Họ phải làm y phục của A-rôn để thánh hiến ông, hầu ông hành chức tư tế cho Ta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “những người khôn ngoan trong lòng”; đây là thành ngữ chỉ những người được ban sự hiểu biết và tài khéo.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tinh thần khôn ngoan” hoặc “Thần Khí khôn ngoan”. Tiếng Hê-bơ-rơ có thể chỉ thần khí hay năng lực, phẩm chất khôn ngoan do Đức Chúa Trời ban; câu này không xác định rõ hơn.'
    reason: alternative_reading
  - marker: c
    text: 'Nguyên văn cũng có thể hiểu sát hơn: “để thánh hiến ông, để ông làm tư tế cho Ta”.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: hãy nói
  rationale: Thể Piel chưa hoàn thành trong ngữ cảnh chỉ thị mang lực mệnh lệnh; “hãy nói” tự nhiên và rõ trong tiếng Việt hiện đại.
- source_word: חַכְמֵי לֵב
  choice: những người có lòng khôn ngoan
  rationale: Giữ hình ảnh Hê-bơ-rơ về “lòng” là trung tâm của sự hiểu biết, đồng thời diễn đạt tự nhiên; trong ngữ cảnh, sự khôn ngoan này bao gồm tài khéo thực hành.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: những người Ta đã làm cho đầy thần khí khôn ngoan
  rationale: Giữ hình ảnh “làm cho đầy” của מלא và không xác định רוּחַ là một ngôi vị thần linh; hậu tố số ít trong tiếng Hê-bơ-rơ quy chiếu tập hợp đến “tất cả những người” nên được diễn đạt bằng số nhiều tự nhiên trong tiếng Việt.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: y phục cho A-rôn
  rationale: Cụm sở hữu trong ngữ cảnh chỉ những bộ y phục được may dành cho A-rôn; không thêm tính từ “tư tế” vốn không có ngay trong cụm từ này.
- source_word: לְקַדְּשׁוֹ
  choice: để thánh hiến ông
  rationale: Trong bối cảnh thiết lập chức vụ tư tế, קדשׁ chỉ việc biệt riêng một người cho công vụ thánh; “thánh hiến” vừa chính xác vừa trang trọng.
- source_word: לְכַהֲנוֹ לִי
  choice: hầu ông phụng sự Ta với tư cách tư tế
  rationale: Động từ כהן có nghĩa hành chức hay phục vụ với tư cách tư tế; cách dịch này giữ cả ý phục vụ hướng về Đức Chúa Trời trong לִי.
- source_word: וְעָשׂוּ
  choice: Họ phải may
  rationale: Dạng hoàn thành nối tiếp trong chuỗi chỉ thị có lực truyền lệnh. “Phải” thể hiện lực ấy, còn “may” cụ thể hóa hành động làm y phục theo ngữ cảnh mà không đổi nghĩa.
theological_decisions:
- issue: רוח חכמה có trực tiếp chỉ Đức Thánh Linh hay không
  choice: thần khí khôn ngoan
  alternative: Thần Khí khôn ngoan; tinh thần khôn ngoan; sự khôn ngoan
  rationale: Danh từ רוּחַ không có mạo từ và trong ngữ cảnh nói về khả năng do Đức Chúa Trời ban để làm y phục. Viết thường và kèm chú thích giữ được khả năng chỉ thần khí hay năng lực, khuynh hướng do Chúa ban mà không áp đặt một nhận diện Ba Ngôi cụ thể.
- issue: Quan hệ giữa việc thánh hiến và việc hành chức tư tế
  choice: để thánh hiến ông, hầu ông phụng sự Ta với tư cách tư tế
  alternative: để thánh hiến ông phục vụ Ta với tư cách tư tế
  rationale: Hai cấu trúc nguyên mẫu có לְ diễn tả mục đích liên tiếp. “Hầu” cho thấy việc phụng sự với tư cách tư tế là mục tiêu của sự thánh hiến, đồng thời không làm hai hành động nhập thành một cách quá chặt.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “ngươi/Ta” phù hợp lời Đức Chúa Trời phán trực tiếp trong văn mạch Ngũ Kinh; “y phục”, “thánh hiến”, “phụng sự” giữ sắc thái nghi lễ mà vẫn dễ hiểu. Tên אַהֲרֹן được phiên âm là “A-rôn”.
