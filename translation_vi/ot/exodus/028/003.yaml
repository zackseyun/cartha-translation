revisions:
- from: Còn ngươi, hãy nói với tất cả những người có lòng khôn ngoan[a], là những người Ta đã làm cho đầy thần khí khôn ngoan[b]. Họ phải may y phục cho A-rôn để thánh hiến ông, hầu ông phụng sự Ta với tư cách tư tế[c].
  to: Còn ngươi, hãy nói với tất cả những người có lòng khôn ngoan[a], là những người Ta đã làm cho họ đầy dẫy thần khí khôn ngoan[b]. Họ phải làm y phục của A-rôn để thánh hiến ông, hầu ông hành chức tư tế cho Ta[c].
  rationale: Sửa tối thiểu để làm rõ rằng Đức Chúa Trời làm cho chính những người ấy đầy thần khí khôn ngoan, và để trả lại độ khái quát của động từ ‘làm’ cùng quan hệ sở hữu trong ‘y phục của A-rôn’. “Hành chức tư tế” sát với động từ כהן hơn “phụng sự với tư cách tư tế”, đồng thời vẫn giữ mục đích phục vụ Đức Chúa Trời. Các chú thích và neo chú thích được giữ đầy đủ, với nội dung không áp đặt cách hiểu thần học đối với רוח חכמה.
  reviewer_model: gpt-5.6-terra
