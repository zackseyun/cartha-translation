base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: vi
  text: Ngươi phải nạm vào đó bốn hàng đá quý[a]. Hàng thứ nhất gồm hồng ngọc, hoàng ngọc và ngọc lục bảo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chắc chắn chính xác các loại đá quý này. “Hồng ngọc” cũng có thể là “mã não đỏ”; “hoàng ngọc” cũng có thể là “chrysolite” hoặc “peridot”; “ngọc lục bảo” cũng có thể là “beryl”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: Ngươi phải gắn vào đó những viên đá quý
  rationale: Động từ מלא có nghĩa gốc là “làm đầy”, nhưng trong ngữ cảnh chế tác bảng đeo ngực, cụm này nói đến việc gắn đá vào vật ấy. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ chất liệu là đá quý.
- source_word: אַרְבָּעָה טוּרִים אָבֶן
  choice: xếp thành bốn hàng
  rationale: טוּר chỉ một hàng được sắp theo trật tự; אֶבֶן mang nghĩa tập hợp trong ngữ cảnh nhiều viên đá.
- source_word: טוּר ... הָאֶחָד
  choice: Hàng thứ nhất
  rationale: Cụm Hê-bơ-rơ xác định hàng đầu tiên trong chuỗi bốn hàng.
- source_word: אֹדֶם
  choice: hồng ngọc
  rationale: Tên khoáng vật chính xác chưa chắc chắn. “Hồng ngọc” là tên truyền thống, dễ hiểu, còn khả năng “mã não đỏ” được ghi ở chú thích.
- source_word: פִּטְדָה
  choice: hoàng ngọc
  rationale: Nhận diện chính xác loại đá này chưa chắc chắn. “Hoàng ngọc” theo cách gọi truyền thống; các khả năng khác được giữ trong chú thích.
- source_word: בָרֶקֶת
  choice: lục ngọc
  rationale: Từ này có liên hệ với ý sáng lóe hoặc lấp lánh, nhưng loại khoáng vật cụ thể chưa chắc chắn. “Lục ngọc” là cách dịch quy ước; “beryl” là một khả năng khác.
theological_decisions: []
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng dễ hiểu. Dùng “Ngươi” để phản ánh lời Đức Chúa Trời phán trực tiếp với Môi-se; dùng thuật ngữ đá quý quen thuộc và ghi nhận sự bất định về khoáng vật trong chú thích.
