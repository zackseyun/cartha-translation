revisions:
- from: Ngươi phải gắn vào đó những viên đá quý[a], xếp thành bốn hàng. Hàng thứ nhất gồm hồng ngọc, hoàng ngọc và lục ngọc.
  to: Ngươi phải nạm vào đó bốn hàng đá quý[a]. Hàng thứ nhất gồm hồng ngọc, hoàng ngọc và ngọc lục bảo.
  rationale: Bản sửa làm rõ thao tác nạm đá trong ngữ cảnh chế tác, dùng thuật ngữ tiếng Việt hiện đại thông dụng cho emerald, và duy trì đầy đủ sự dè dặt cần thiết về nhận diện các đá quý trong chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:49:35Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng bố cục bốn hàng và ba loại đá ở hàng thứ nhất. Tuy nhiên, “gắn ... những viên đá quý” hơi chung chung so với ngữ cảnh kỹ thuật nạm/đặt đá vào bảng đeo ngực. “Ngọc lục bảo” là cách gọi hiện đại, xác định và tự nhiên hơn cho lựa chọn quy ước “emerald” so với “lục ngọc”, vốn có thể gợi một loại ngọc xanh không xác định.
  naturalness: Câu sửa dùng “nạm” tự nhiên trong ngữ cảnh kim hoàn và tránh cấu trúc hơi rời “gắn ... xếp thành”. “Ngươi phải” vẫn giữ được sắc thái mệnh lệnh trang trọng nhất quán với bản nháp.
  terminology: Giữ “hồng ngọc” (ruby) và “hoàng ngọc” (topaz) như các lựa chọn quy ước có chú thích về sự bất định. Đổi “lục ngọc” thành “ngọc lục bảo” cho emerald; chú thích tiếp tục bảo lưu khả năng beryl, không khẳng định nhận diện khoáng vật là chắc chắn.
  issues:
  - severity: medium
    issue: “lục ngọc” không phải cách gọi chuẩn, rõ nghĩa nhất trong tiếng Việt hiện đại cho “emerald”.
    rationale: Từ này có thể được hiểu rộng là ngọc màu xanh, trong khi “ngọc lục bảo” là tên thông dụng và minh bạch của emerald; chú thích vẫn cần nêu sự bất định của từ Hê-bơ-rơ בָּרֶקֶת.
  - severity: low
    issue: “gắn vào đó những viên đá quý, xếp thành bốn hàng” làm yếu sắc thái nạm/đặt đá của cụm מִלֻּאַת אֶבֶן.
    rationale: “Nạm vào đó bốn hàng đá quý” diễn đạt tự nhiên hơn thao tác chế tác được ngữ cảnh đòi hỏi, đồng thời vẫn không áp đặt một kỹ thuật cụ thể hơn văn bản.
  revised_text: Ngươi phải nạm vào đó bốn hàng đá quý[a]. Hàng thứ nhất gồm hồng ngọc, hoàng ngọc và ngọc lục bảo.
