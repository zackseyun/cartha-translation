  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: vi
  text: Ngươi hãy làm hai khoen bằng vàng, rồi đặt chúng ở hai đầu của bảng đeo ngực, trên mép của nó ở phía trong, hướng về ê-phót.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trên viền của nó hướng vào phía trong, về phía ê-phót.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi hãy làm
  rationale: Dạng động từ trong chuỗi chỉ dẫn mang lực mệnh lệnh; “hãy làm” diễn đạt tự nhiên và rõ ràng trong tiếng Việt.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: hai khoen bằng vàng
  rationale: “Khoen” phù hợp với vòng nhỏ dùng để liên kết các bộ phận; “bằng vàng” nêu rõ vật liệu.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: và gắn chúng
  rationale: שׂים có nghĩa là đặt, để; trong ngữ cảnh chế tác, “gắn” diễn đạt tự nhiên việc đặt cố định các khoen vào bảng đeo ngực.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: vào hai đầu của bảng đeo ngực
  rationale: קְצוֹת là các đầu hay điểm tận cùng; חֹשֶׁן chỉ vật phẩm tư tế đeo trước ngực, nên “bảng đeo ngực” vừa dễ hiểu vừa tránh hàm ý đây chỉ là một túi hay miếng che ngực.
- source_word: עַל שְׂפָתוֹ
  choice: trên mép của nó
  rationale: שָׂפָה theo nghĩa cụ thể ở đây là mép hoặc viền; “mép” tự nhiên đối với vật phẩm bằng vải.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: hướng vào phía trong, về phía ê-phót
  rationale: Cụm từ xác định mép ở mặt trong và hướng về ê-phót. Cách dịch giữ cả hướng không gian lẫn ý inward của בָּיְתָה mà không khẳng định quá mức cấu tạo chính xác.
