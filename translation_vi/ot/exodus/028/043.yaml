base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: vi
  text: A-rôn và các con trai ông phải mặc những quần lót ấy khi họ vào Lều Hội Kiến, hoặc khi họ tiến đến bàn thờ để phục vụ trong nơi thánh, để họ không phải chịu tội và chết.[a] Đây là quy định vĩnh viễn cho ông và dòng dõi ông sau ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để họ không mắc tội và chết.” Tiếng Hê-bơ-rơ theo nghĩa đen là “mang tội”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “quy định đời đời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  choice: phải được mặc trên
  rationale: Trong ngữ cảnh, đại từ số nhiều chỉ các quần ngắn bằng vải gai ở câu trước. Cách dịch này diễn đạt tự nhiên ý y phục phải ở trên người họ, đồng thời giữ lực quy định của mệnh đề pháp luật.
- source_word: אֹהֶל מוֹעֵד
  choice: Lều Hội Kiến
  rationale: Cách gọi trang trọng, dễ hiểu cho lều thánh là nơi Đức Chúa Trời gặp dân qua chức vụ tư tế.
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: khi họ đến gần bàn thờ
  rationale: Giữ sát động từ chỉ việc tiến đến gần trong bối cảnh tư tế, không thu hẹp thành một nghi thức cụ thể hơn bản nguồn.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: để phục vụ trong nơi thánh
  rationale: “Phục vụ” chuyển tải công việc thánh của tư tế bằng tiếng Việt hiện đại; “nơi thánh” giữ ngôn ngữ về sự thánh khiết và không đồng nhất quá mức với một khu vực kiến trúc cụ thể.
- source_word: וְלֹא יִשְׂאוּ עָוֺן וָמֵתוּ
  choice: hầu cho họ không mang tội mà chết
  rationale: Giữ thành ngữ pháp lý–nghi lễ “mang tội” và mối liên hệ nghiêm trọng giữa tội lỗi với cái chết; “hầu cho” thể hiện sắc thái phòng ngừa theo ngữ cảnh.
- source_word: חֻקַּת עוֹלָם
  choice: quy định vĩnh viễn
  rationale: Diễn đạt một quy định có hiệu lực lâu dài bằng ngôn ngữ hiện đại, trang trọng, trong khi chú thích nêu phương án “đời đời” sát hình thức hơn.
- source_word: זַרְעוֹ
  choice: dòng dõi ông
  rationale: Diễn đạt tự nhiên danh từ tập hợp chỉ hậu duệ của A-rôn qua các thế hệ.
theological_decisions:
- issue: Hậu quả của việc tư tế đến gần nơi thánh không đúng quy định
  choice: Giữ nguyên rằng họ có thể “mang tội mà chết”.
  alternative: Diễn giải thành “mắc tội và phải chết”.
  rationale: Bản Hê-bơ-rơ dùng thành ngữ נשׂא עון, có thể nhấn mạnh việc mang trách nhiệm pháp lý hoặc gánh hậu quả của tội. Bản dịch chính giữ hình ảnh và sự căng thẳng thần học thay vì giải nghĩa dứt khoát.
- issue: Thời hạn của quy định
  choice: “quy định vĩnh viễn”
  alternative: “quy định đời đời”
  rationale: עוֹלָם trong văn bản luật pháp chỉ tính lâu dài, bền vững; “vĩnh viễn” tự nhiên trong tiếng Việt nhưng không nhằm giải quyết các câu hỏi thần học về phạm vi giao ước của quy định.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “A-rôn”, “Lều Hội Kiến” và “bàn thờ” theo văn phong Kinh Thánh quen thuộc. Đại từ “các quần ngắn ấy” làm rõ chủ thể số nhiều từ câu trước mà không thêm một vật thể mới.
