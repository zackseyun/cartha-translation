revisions:
- from: Các quần ngắn ấy phải được mặc trên A-rôn và các con trai ông khi họ vào Lều Hội Kiến, hoặc khi họ đến gần bàn thờ để phục vụ trong nơi thánh, hầu cho họ không mang tội mà chết.[a] Đây là quy định vĩnh viễn cho ông và dòng dõi ông sau này.[b]
  to: A-rôn và các con trai ông phải mặc những quần lót ấy khi họ vào Lều Hội Kiến, hoặc khi họ tiến đến bàn thờ để phục vụ trong nơi thánh, để họ không phải chịu tội và chết.[a] Đây là quy định vĩnh viễn cho ông và dòng dõi ông sau ông.[b]
  rationale: Bản sửa giữ nguyên phạm vi và tính nghiêm trọng của mệnh lệnh trong bản Hê-bơ-rơ, nhưng thay cấu trúc bị động gượng bằng cách nói tiếng Việt tự nhiên hơn. Cụm hậu quả được chỉnh để người đọc hiểu đây là việc tránh chịu trách nhiệm tội lỗi và hậu quả chết, không áp đặt một cách giải thích thần học cụ thể. Các chú thích vẫn được neo đúng vào hai cụm tương ứng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:49:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng các thành tố chính của câu: y phục tư tế phải được mặc khi vào Lều Hội Kiến hoặc tiến đến bàn thờ, mục đích tránh chịu tội và chết, và quy định có hiệu lực lâu dài cho A-rôn cùng hậu duệ ông. Tuy nhiên, cấu trúc bị động “phải được mặc trên A-rôn” không diễn đạt tự nhiên quan hệ ‘ở trên/mặc trên’ trong tiếng Việt; đồng thời “mang tội mà chết” có thể bị hiểu là chết trong khi vẫn mang tội, thay vì hai hậu quả được nối trong thành ngữ pháp lý–nghi lễ của tiếng Hê-bơ-rơ.'
  naturalness: Nên dùng cấu trúc chủ động “A-rôn và các con trai ông phải mặc...” và cách nói thông dụng “phải chịu tội và chết.” “Sau này” cũng không chính xác bằng “sau ông” cho אַחֲרָיו (‘sau ông’, qua các thế hệ).
  terminology: Giữ “A-rôn,” “Lều Hội Kiến,” “bàn thờ,” “nơi thánh,” và “dòng dõi” là phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Quần lót” xác định rõ y phục được nói đến từ câu trước mà không thêm ý nghĩa ngoài ngữ cảnh.
  issues:
  - severity: medium
    issue: “phải được mặc trên A-rôn và các con trai ông” là cấu trúc không tự nhiên trong tiếng Việt.
    rationale: Tiếng Hê-bơ-rơ nói các y phục ‘sẽ ở trên’ A-rôn và con trai ông, tức họ phải mặc chúng. Chuyển thành chủ động giúp diễn đạt đúng và rõ mà không đổi nghĩa.
  - severity: medium
    issue: “không mang tội mà chết” dễ gây mơ hồ về quan hệ giữa ‘mang tội’ và ‘chết’.
    rationale: וְלֹא יִשְׂאוּ עָוֺן וָמֵתוּ nối việc chịu tội/trách nhiệm với cái chết như hậu quả cần tránh. “không phải chịu tội và chết” tự nhiên hơn và vẫn bảo lưu sắc thái pháp lý–nghi lễ.
  - severity: low
    issue: “dòng dõi ông sau này” chưa sát với אַחֲרָיו.
    rationale: Cụm này nói hậu duệ ‘sau ông’, không chỉ một thời điểm mơ hồ trong tương lai.
