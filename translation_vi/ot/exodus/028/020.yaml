  - severity: low
    issue: “Những ổ bằng vàng”
    rationale: Dù có thể hiểu được, “ổ” kém chính xác và kém tự nhiên hơn “khung” trong ngữ cảnh kim hoàn; “khung vàng” truyền đạt trực tiếp các setting/mounting bằng vàng.
