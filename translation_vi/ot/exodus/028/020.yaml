  source_fidelity: 'Bản nháp giữ đúng cấu trúc của câu Hê-bơ-rơ: hàng thứ tư gồm ba viên đá, được đặt/nạm trong khung vàng. Tuy nhiên, “ngọc thạch anh” không phải là cách tương đương phù hợp với יָשְׁפֵה, vốn thường được nhận diện là jasper; cách dịch này chỉ một nhóm khoáng vật khác. “Khung vàng” diễn đạt rõ và tự nhiên hơn cho các ổ/khung nạm bằng vàng.'
