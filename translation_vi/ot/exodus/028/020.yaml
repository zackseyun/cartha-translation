  text: 'And the fourth row: beryl[a], onyx, and jasper; they shall be set in gold in their settings.'
translation:
  language: vi
  text: 'Hàng thứ tư: đá berin[a], mã não và đá jasper; các viên đá này phải được nạm trong các khung vàng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không thể xác định chắc chắn một số loại đá quý trên bảng ngực của thầy tế lễ thượng phẩm. Theo cách dịch truyền thống, תַּרְשִׁישׁ thường được gọi là “đá berin” và שֹׁהַם là “mã não”, nhưng cũng có những cách nhận diện khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: Hàng thứ tư
  rationale: Trong danh sách các viên đá trên bảng đeo ngực, טוּר chỉ một hàng; số thứ tự רְבִיעִי được diễn đạt tự nhiên là “thứ tư”.
- source_word: תַּרְשִׁישׁ
  choice: hoàng ngọc
  rationale: Danh tính chính xác của loại đá cổ này không chắc chắn. “Hoàng ngọc” là cách gọi truyền thống, dễ hiểu trong tiếng Việt, nhưng sự bất định được nêu rõ trong chú thích.
- source_word: שֹׁהַם
  choice: mã não
  rationale: Danh tính khoáng vật vẫn còn được tranh luận; “mã não” là cách dịch truyền thống, quen thuộc trong ngữ cảnh vật liệu Đền Tạm.
- source_word: יָשְׁפֵה
  choice: ngọc thạch anh
  rationale: Thuật ngữ thường được nhận diện là jasper; “ngọc thạch anh” là tên gọi tiếng Việt dễ hiểu và phù hợp với danh sách đá quý.
- source_word: מְשֻׁבָּצִים
  choice: được nạm
  rationale: Phân từ bị động mô tả các viên đá được gắn vào ổ; “được nạm” tự nhiên trong ngữ cảnh kim hoàn và giữ sắc thái bị động.
- source_word: זָהָב
  choice: bằng vàng
  rationale: Diễn đạt trực tiếp vật liệu tạo nên các ổ nạm.
- source_word: יִהְיוּ
  choice: phải được
  rationale: Dạng vị hoàn thành trong ngữ cảnh chỉ dẫn chế tác mang lực quy định; “phải được” chuyển tải rõ yêu cầu ấy.
- source_word: בְּמִלּוּאֹתָם
  choice: vào những ổ
  rationale: Trong ngữ cảnh chế tác đồ thờ, מִלּוּאִים chỉ các ổ hoặc khung dùng để giữ đá; “ổ” tránh lặp với động từ “nạm” và tạo câu tiếng Việt tự nhiên.
