  terminology: Dùng “đá berin” cho תַּרְשִׁישׁ để tương ứng sát hơn với lựa chọn “beryl” trong hồ sơ đối chiếu, đồng thời chú thích sự không chắc chắn. Giữ “mã não” như cách gọi truyền thống được bản nháp chọn cho שֹׁהַם. Thay “ngọc thạch anh” bằng “đá jasper” cho יָשְׁפֵה.
