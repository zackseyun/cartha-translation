  - severity: medium
    issue: «để tôn vinh và làm đẹp» thay đổi cấu trúc và để hở đối tượng của hai động từ.
    rationale: לְכָבוֹד וּלְתִפְאָרֶת gồm hai cụm danh từ chỉ mục đích. Bản sửa giữ tính danh từ và không ngầm xác định ai được tôn vinh hay được làm đẹp.
