  source_fidelity: Bản nháp giữ đúng mệnh lệnh, danh xưng A-rôn và quan hệ «anh con». Tuy nhiên, «may» thu hẹp động từ עָשָׂה («làm/chế tạo») thành riêng công đoạn khâu may; còn «tôn vinh và làm đẹp» biến hai danh từ trừu tượng כָּבוֹד và תִּפְאֶרֶת thành các hành động với đối tượng không được nêu trong nguyên văn.
