  terminology: «Y phục thánh» phản ánh trực tiếp בִּגְדֵי־קֹדֶשׁ, tránh sắc thái nghi lễ hẹp hơn của «lễ phục». «Vinh quang» và «vẻ đẹp» giữ hai danh từ song song của tiếng Hê-bơ-rơ, không xác định chủ thể hay đối tượng của vinh quang.
