  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: vi
  text: Con hãy làm các y phục thánh cho A-rôn, anh con, nhằm tạo nên vinh quang và vẻ đẹp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «nhằm tạo nên sự tôn quý và vẻ lộng lẫy.»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Con hãy may
  rationale: Dạng Qal hoàn thành ngôi hai số ít giống đực có liên từ, trong mạch chỉ thị, mang lực mệnh lệnh. “Hãy may” tự nhiên với đối tượng là y phục; “con” thể hiện người được Đức Chúa Trời trực tiếp phán bảo là Môi-se.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: lễ phục thánh
  rationale: בִגְדֵי là y phục, còn קֹדֶשׁ chỉ tính được biệt riêng cho công việc thánh. “Lễ phục thánh” trang trọng, dễ hiểu và phù hợp bối cảnh tư tế mà không vay thuật ngữ riêng của một truyền thống giáo hội.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: cho A-rôn, anh con
  rationale: Giữ nguyên quan hệ gia đình được nêu trong tiếng Hê-bơ-rơ. “Anh” là cách gọi tự nhiên trong tiếng Việt đối với người anh trai; tên riêng dùng dạng Việt hóa quen thuộc “A-rôn”.
- source_word: לְכָבוֹד
  choice: để tôn vinh
  rationale: כָּבוֹד có thể chỉ vinh quang, danh dự hoặc vẻ uy nghi. Trong cấu trúc chỉ mục đích của lễ phục, “để tôn vinh” giữ ý phẩm giá và sự vẻ vang mà không ấn định đối tượng được tôn vinh.
- source_word: וּלְתִפְאָרֶת
  choice: và làm đẹp
  rationale: תִּפְאֶרֶת bao hàm vẻ đẹp, sự huy hoàng và nét lộng lẫy. “Làm đẹp” tự nhiên trong câu chỉ mục đích và giữ phương diện thẩm mỹ của lễ phục.
theological_decisions:
- issue: Đối tượng và sắc thái của cụm chỉ mục đích לְכָבוֹד וּלְתִפְאָרֶת
  choice: “để tôn vinh và làm đẹp” giữ rộng cả phẩm giá lẫn vẻ đẹp, không nói rõ vinh quang thuộc về Đức Chúa Trời, A-rôn hay chức vụ tư tế.
  alternative: “để được vinh quang và đẹp đẽ”; “để tạo vẻ uy nghi và lộng lẫy”
  rationale: Bản Hê-bơ-rơ không xác định minh nhiên đối tượng của כָּבוֹד. Không nên thu hẹp cụm từ thành chỉ danh dự của con người hay chỉ vinh quang của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “may” thay cho động từ chung “làm” vì đối tượng là y phục; giữ lực mệnh lệnh trực tiếp bằng “Con hãy”. Không thêm chú thích vì các phương án nghĩa được thể hiện đủ trong hồ sơ quyết định và không có dị bản văn bản cần báo cho độc giả.
