base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: vi
  text: 'Ngươi phải làm một tấm vàng ròng và khắc trên đó, như khắc trên ấn tín: “Thánh cho Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sự thánh khiết dành cho Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Ngươi phải làm
  rationale: Động từ Qal trong chuỗi chỉ thị mang lực mệnh lệnh; “phải làm” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: צִּיץ
  choice: tấm thẻ
  rationale: Trong ngữ cảnh phẩm phục thượng tế, từ này chỉ vật trang sức bằng vàng mang dòng chữ; “tấm thẻ” diễn đạt hình thức và chức năng rõ hơn nghĩa gốc “hoa” hay từ cổ “miếng đeo trán”.
- source_word: זָהָב טָהוֹר
  choice: bằng vàng ròng
  rationale: Diễn đạt tự nhiên chất liệu vàng tinh khiết, đồng thời giữ sắc thái phẩm chất của טָהוֹר.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: và khắc trên đó
  rationale: Trong ngữ cảnh chế tác kim loại, פתח chỉ việc khắc chữ hoặc hình lên bề mặt.
- source_word: פִּתּוּחֵי חֹתָם
  choice: theo lối khắc con dấu
  rationale: Giữ ý kiểu thức khắc giống nghệ thuật khắc con dấu; số nhiều hình thái trong tiếng Hê-bơ-rơ được diễn đạt tự nhiên bằng danh từ tập hợp tiếng Việt.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Thánh hiến cho Yahweh
  rationale: Cụm khắc ngắn gọn biểu thị sự biệt riêng thuộc về Yahweh. “Thánh hiến cho” tự nhiên trong tiếng Việt nhưng vẫn giữ phương án danh từ “Sự thánh khiết thuộc về” ở chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm “Yahweh” bảo tồn tính chất danh riêng.
- issue: Ý nghĩa công thức קֹדֶשׁ לַיהוָה
  choice: Thánh hiến cho Yahweh
  alternative: Sự thánh khiết thuộc về Yahweh
  rationale: קֹדֶשׁ có thể được hiểu theo nghĩa điều/vật được biệt riêng là thánh hoặc theo nghĩa danh từ trừu tượng “sự thánh khiết”. Bản chính giữ tính chất câu đề tặng ngắn gọn; chú thích bảo tồn cách hiểu danh từ.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và mang tính chỉ thị. Dùng “ngươi” vì lời phán trực tiếp số ít với Môi-se; câu khắc được giữ ngắn gọn như một dòng chữ nghi lễ.
