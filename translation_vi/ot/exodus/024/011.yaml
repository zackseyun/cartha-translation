  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: vi
  text: Nhưng Ngài không ra tay chống lại những người quyền quý của dân Israel. Họ thấy Đức Chúa Trời[a], rồi họ ăn và uống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ chiêm ngưỡng Đức Chúa Trời”; động từ này có thể mang sắc thái nhìn chăm chú hoặc chiêm ngưỡng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: chống lại
  rationale: Trong thành ngữ שָׁלַח יָד, giới từ này mang hướng đối nghịch, nói đến việc ra tay làm hại hoặc phán xét.
- source_word: אֲצִילֵי
  choice: những người quyền quý
  rationale: Danh từ chỉ những người có địa vị nổi bật, được tuyển chọn trong cộng đồng; cách dịch này tự nhiên hơn “các quý tộc” trong văn cảnh Israel cổ đại.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Giữ được sắc thái cộng đồng thuộc về Israel của thành ngữ Hê-bơ-rơ, đồng thời tự nhiên và bao hàm trong tiếng Việt hiện đại.
- source_word: לֹא שָׁלַח יָדוֹ
  choice: không ra tay
  rationale: Thành ngữ nói đến hành động gây hại hoặc trừng phạt. “Không ra tay chống lại” vừa tự nhiên trong tiếng Việt vừa giữ hình ảnh của nguyên văn.
- source_word: וַיֶּחֱזוּ
  choice: họ thấy
  rationale: Động từ diễn tả việc nhìn thấy, cũng có thể mang sắc thái chăm chú chiêm ngưỡng; bản văn chính dùng cách nói rõ ràng, còn sắc thái được ghi ở chú thích.
- source_word: אֶת הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Cụm từ xác định nói đến Đức Chúa Trời của Israel; danh xưng này trang trọng, quen thuộc và không làm yếu đi lời khẳng định trực tiếp của nguyên văn.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: rồi ăn uống
  rationale: Diễn đạt tự nhiên chuỗi hành động kế tiếp, đồng thời giữ nguyên sự bình dị đáng chú ý của việc họ ăn và uống sau khi thấy Đức Chúa Trời.
theological_decisions:
- issue: Chủ thể của hành động “không ra tay”
  choice: Dùng “Ngài” để chỉ Đức Chúa Trời
  alternative: Để chủ thể ngầm ẩn như trong tiếng Hê-bơ-rơ
  rationale: Tiếng Hê-bơ-rơ để chủ thể trong hình thái động từ, và văn cảnh xác định đó là Đức Chúa Trời. Nêu “Ngài” giúp câu tiếng Việt rõ và tự nhiên mà không thêm một khẳng định thần học mới.
- issue: Cách diễn đạt cuộc gặp gỡ thần linh
  choice: “Họ thấy Đức Chúa Trời”
  alternative: “Họ thấy sự hiện diện/biểu hiện của Đức Chúa Trời” hoặc “họ chiêm ngưỡng Đức Chúa Trời”
  rationale: Nguyên văn khẳng định trực tiếp rằng họ thấy Đức Chúa Trời. Không diễn giải thành “sự biểu hiện” để tránh tự ý giải quyết sự căng thẳng thần học với các đoạn khác; sắc thái “chiêm ngưỡng” được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ra tay chống lại” chuyển tải tự nhiên thành ngữ Hê-bơ-rơ mà vẫn giữ hình ảnh bàn tay; “thấy Đức Chúa Trời” bảo toàn lời văn trực tiếp và sự căng thẳng thần học của bản nguồn.
