  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הַ/דָּ֔ם וַ/יִּזְרֹ֖ק עַל הָ/עָ֑ם וַ/יֹּ֗אמֶר הִנֵּ֤ה דַֽם הַ/בְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִמָּ/כֶ֔ם עַ֥ל כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se lấy huyết và vẩy trên dân chúng[a], rồi nói: “Đây là huyết của giao ước mà Yahweh đã lập[b] với anh em, liên quan đến tất cả những lời này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hắt trên dân chúng.” Động từ Hê-bơ-rơ theo nghĩa cụ thể là “ném” hoặc “hắt”, nhưng trong bối cảnh tế lễ có thể chỉ việc vẩy huyết theo nghi thức.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ dùng thành ngữ có nghĩa đen là “cắt [giao ước] với anh em,” tức là “lập giao ước với anh em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Động từ לקח trong mạch kể chuyện có nghĩa thông thường là “lấy”; cách dịch này tự nhiên và không thêm ý.
- source_word: הַדָּם
  choice: huyết
  rationale: Danh từ có mạo từ xác định, chỉ lượng huyết tế lễ đã được nhắc đến trong ngữ cảnh. “Huyết” phù hợp với văn cảnh nghi lễ trang trọng.
- source_word: וַיִּזְרֹק
  choice: vẩy
  rationale: זרק cơ bản chỉ hành động ném hoặc hắt, nhưng trong nghi lễ có thể chỉ việc vẩy hay hắt huyết lên đối tượng. “Vẩy” diễn đạt tự nhiên hành động nghi lễ; sắc thái cụ thể hơn được giữ trong chú thích.
- source_word: עַל הָעָם
  choice: trên dân chúng
  rationale: עַל mang nghĩa không gian trực tiếp là “trên”; “dân chúng” chỉ cộng đồng Israel đang hiện diện.
- source_word: הִנֵּה
  choice: Đây là
  rationale: הִנֵּה dùng để long trọng đưa một sự vật ra trước người nghe. “Đây là” tự nhiên trong tiếng Việt mà vẫn giữ lực trình bày trang trọng.
- source_word: דַם הַבְּרִית
  choice: huyết của giao ước
  rationale: Giữ sát kết cấu sở hữu của cụm danh từ Hê-bơ-rơ và mối liên hệ thần học giữa huyết với giao ước.
- source_word: כָּרַת
  choice: đã lập
  rationale: כרת, nghĩa đen là “cắt”, nằm trong thành ngữ Hê-bơ-rơ về việc lập giao ước. “Lập” truyền đạt đúng nghĩa thành ngữ trong tiếng Việt; nghĩa đen được nêu ở chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: עִמָּכֶם
  choice: với anh em
  rationale: Hậu tố ngôi thứ hai số nhiều được thể hiện bằng “anh em”, cách xưng hô tập thể tự nhiên và trang trọng trong ngữ cảnh.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: theo mọi lời này
  rationale: “Theo” giữ được quan hệ giữa giao ước và những lời vừa được công bố mà không thu hẹp דְּבָרִים thành riêng các “điều khoản”.
theological_decisions:
- issue: Thành ngữ כָּרַת ... בְּרִית về việc thiết lập giao ước
  choice: đã lập ... giao ước
  alternative: đã cắt ... giao ước
  rationale: Dịch nghĩa thành ngữ trong chính văn để câu tiếng Việt rõ ràng, đồng thời chú thích nghĩa đen “cắt” nhằm giữ tính minh bạch đối với nguyên ngữ và bối cảnh huyết tế lễ.
- issue: Cách thể hiện danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm; “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Quan hệ của עַל כָּל הַדְּבָרִים הָאֵלֶּה với giao ước
  choice: theo mọi lời này
  alternative: liên quan đến mọi lời này; căn cứ trên mọi lời này
  rationale: “Theo” bảo tồn khả năng các lời này vừa là nội dung vừa là cơ sở quy định của giao ước, không giải quyết quá mức sắc thái của giới từ עַל.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyết” thay vì “máu” để phù hợp ngữ cảnh nghi lễ; dùng “Đây là” thay cho lối cổ “Này” hoặc “Kìa”; giữ danh riêng “Yahweh” và từ “giao ước” vì tính chính xác cùng âm hưởng xuyên suốt Kinh Thánh.
