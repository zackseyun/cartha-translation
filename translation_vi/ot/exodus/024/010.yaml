revisions:
- from: Họ thấy Đức Chúa Trời của Israel; dưới chân Ngài có một bề mặt giống như nền lát[a] bằng đá lam ngọc[b], trong trẻo như chính bầu trời.
  to: Họ thấy Đức Chúa Trời của Israel; dưới chân Ngài là một mặt nền trông như được lát bằng đá lam ngọc[a], trong trẻo như chính bầu trời.
  rationale: Đổi cấu trúc mô tả mặt nền để tránh lặp ý và diễn đạt tự nhiên hơn trong tiếng Việt, trong khi vẫn giữ sắc thái «như/trông như» của כְּמַעֲשֵׂה. Dời chú thích khoáng vật vào ngay sau «đá lam ngọc» để neo chú thích đúng từ được giải thích; chú thích về công trình lát được giữ đầy đủ với ký hiệu a.
