source:
  edition: WLC
  text: וַ/יִּרְא֕וּ אֵ֖ת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/תַ֣חַת רַגְלָ֗י/ו כְּ/מַעֲשֵׂה֙ לִבְנַ֣ת הַ/סַּפִּ֔יר וּ/כְ/עֶ֥צֶם הַ/שָּׁמַ֖יִם לָ/טֹֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: vi
  text: Họ thấy Đức Chúa Trời của Israel; dưới chân Ngài là một mặt nền trông như được lát bằng đá lam ngọc[a], trong trẻo như chính bầu trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “như công trình của một nền lát bằng đá lam ngọc,” gợi hình ảnh một bề mặt được ghép bằng gạch hoặc phiến lát dưới chân Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Họ thấy
  rationale: Động từ ראה ở thể Qal trực tiếp diễn tả sự nhìn thấy. Cách dịch này giữ nguyên lời khẳng định rõ ràng của trình thuật, không giảm nhẹ thành việc chỉ thấy một dấu hiệu hay sự hiện ra.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: Đức Chúa Trời của Israel
  rationale: Cụm từ xác định chính Đức Chúa Trời của Israel là đối tượng họ thấy; danh xưng quen thuộc này tự nhiên và trang trọng trong tiếng Việt.
- source_word: וְתַחַת רַגְלָיו
  choice: dưới chân Ngài có
  rationale: תחת có nghĩa là “dưới, bên dưới.” Mệnh đề Hê-bơ-rơ không có động từ; thêm “có” giúp câu tiếng Việt tự nhiên mà vẫn giữ nguyên hình ảnh nhân hình “chân Ngài”.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: một bề mặt giống như nền lát
  rationale: מַעֲשֶׂה chỉ vật được làm hay kỹ nghệ chế tác, còn לִבְנַת gợi một bề mặt bằng gạch hoặc phiến lát. Cách diễn đạt này truyền đạt hình ảnh một mặt nền được tạo nên bên dưới chân Ngài mà không khiến người đọc hiểu là chỉ có một viên gạch.
- source_word: הַסַּפִּיר
  choice: đá lam ngọc
  rationale: סַפִּיר theo truyền thống được hiểu là sapphire, tiếng Việt thường gọi là “lam ngọc.” Thêm “đá” làm rõ đây là vật liệu của mặt nền; chú thích bảo lưu khả năng khoáng vật cổ đại là đá thanh kim.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: như chính bầu trời
  rationale: עֶצֶם ở đây có tác dụng nhấn mạnh, chỉ bầu trời tự thân hay chính bầu trời, chứ không mang nghĩa đen là “xương.”
- source_word: לָטֹהַר
  choice: trong trẻo
  rationale: טֹהַר chỉ sự tinh sạch hoặc trong sáng. Trong mô tả thị giác này, “trong trẻo” diễn đạt tự nhiên đặc tính quang học được đem so với bầu trời.
theological_decisions:
- issue: Khải tượng về Đức Chúa Trời với ngôn ngữ nhân hình
  choice: Giữ nguyên lời khẳng định “Họ thấy Đức Chúa Trời của Israel” và hình ảnh “dưới chân Ngài.”
  alternative: Diễn giải rằng họ chỉ thấy sự hiện ra của Đức Chúa Trời hoặc thấy nơi Ngài đứng.
  rationale: Nguyên văn trực tiếp nói họ thấy Đức Chúa Trời của Israel và mô tả vật ở dưới chân Ngài. Bản dịch không chèn thêm lời giải thích để hóa giải sự căng thẳng thần học về việc con người thấy Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu kính trọng đến Đức Chúa Trời; giữ trực tiếp hình ảnh thị kiến và dùng dấu chấm phẩy để liên kết hai vế mô tả.
