  source_fidelity: 'Bản dịch phản ánh đúng trình tự chính của tiếng Hê-bơ-rơ: Môi-se đến, thuật lại mọi lời của Yahweh và mọi mishpatim; toàn dân đáp bằng một tiếng; rồi cam kết thực hiện mọi điều Yahweh đã phán. Tuy nhiên, “sẽ làm theo” thêm ý “theo” không hiện diện trực tiếp trong נעשה (“chúng tôi sẽ làm”). “Chúng tôi sẽ làm” vừa sát nguyên văn vừa tự nhiên trong lời cam kết giao ước.'
