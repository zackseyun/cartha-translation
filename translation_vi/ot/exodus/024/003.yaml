id: EXO.24.3
reference: Exodus 24:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: vi
  text: 'Rồi Môi-se đến thuật lại cho dân chúng mọi lời của Yahweh và mọi phán quyết[a]. Toàn dân đồng thanh đáp: “Mọi lời Yahweh đã phán, chúng tôi sẽ làm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi quy định”; từ Hê-bơ-rơ mishpatim chỉ các phán quyết hoặc quy định pháp lý trong giao ước.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Rồi Môi-se đến
  rationale: Động từ בוא mang nghĩa thông thường là “đến”; “rồi” diễn đạt tự nhiên diễn tiến của waw liên tiếp trong văn kể chuyện.
- source_word: וַיְסַפֵּר
  choice: thuật lại
  rationale: Dạng piel của ספר chỉ việc kể hoặc trình bày lại; “thuật lại” vừa sát nghĩa vừa phù hợp với việc Môi-se truyền đạt những điều đã nhận.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: mọi lời của Yahweh
  rationale: Giữ danh từ דְּבָרִים là “lời”, không thu hẹp nghĩa thành “mệnh lệnh”, đồng thời bảo toàn mối liên hệ với lời đáp của dân chúng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay thế bằng một tước hiệu.
- source_word: הַמִּשְׁפָּטִים
  choice: mọi phán quyết
  rationale: מִשְׁפָּטִים trong ngữ cảnh này là các quy định hay phán quyết pháp lý thuộc giao ước; “phán quyết” giữ được sắc thái xét định của từ Hê-bơ-rơ.
- source_word: וַיַּעַן כָּל הָעָם קוֹל אֶחָד
  choice: Toàn dân đồng thanh đáp
  rationale: “Đồng thanh” là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ “một tiếng nói”, nhấn mạnh sự nhất trí của toàn dân.
- source_word: כָּל הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה
  choice: Mọi lời Yahweh đã phán
  rationale: Giữ “mọi lời” và động từ “phán” để phản ánh sự lặp lại có chủ ý của gốc דבר.
- source_word: נַעֲשֶׂה
  choice: chúng tôi sẽ làm theo
  rationale: עשה có nghĩa cơ bản là “làm”; “làm theo” tự nhiên trong tiếng Việt và thể hiện việc thực hiện lời đã phán mà không diễn giải quá mức thành một thuật ngữ thần học.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה; “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái lời cam kết נַעֲשֶׂה
  choice: chúng tôi sẽ làm theo
  alternative: chúng tôi sẽ vâng phục
  rationale: Bản dịch giữ hành động “làm” trong nguyên văn và không chuyển hoàn toàn sang khái niệm “vâng phục”, dù sự vâng phục được hàm ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dân chúng” rồi “toàn dân” để diễn đạt tự nhiên; “đồng thanh đáp” cô đọng thành ngữ Hê-bơ-rơ. Dấu [a] được đặt ngay sau từ cần chú thích.
