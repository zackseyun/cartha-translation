  to: 'Rồi Môi-se đến thuật lại cho dân chúng mọi lời của Yahweh và mọi phán quyết[a]. Toàn dân đồng thanh đáp: “Mọi lời Yahweh đã phán, chúng tôi sẽ làm.”'
