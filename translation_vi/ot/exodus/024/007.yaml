  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: vi
  text: 'Rồi ông lấy Sách Giao Ước, đọc cho dân chúng nghe. Họ nói: “Mọi điều Yahweh đã phán, chúng tôi sẽ làm và sẽ lắng nghe[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và sẽ vâng lời.” Động từ Hê-bơ-rơ ở đây có thể mang nghĩa “nghe, lắng nghe” và, trong bối cảnh giao ước, “vâng lời.”'
    reason: Bảo lưu hai nét nghĩa liên hệ của שׁמע mà không buộc bản chính phải loại bỏ một trong hai.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Rồi ông lấy
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “rồi” diễn đạt tự nhiên trình tự ấy, còn “ông” giữ nguyên việc bản Hê-bơ-rơ chỉ dùng chủ thể ngôi thứ ba số ít theo ngữ cảnh.
- source_word: סֵפֶר הַבְּרִית
  choice: Sách Giao Ước
  rationale: Giữ hình ảnh cụ thể về một văn bản giao ước đã được ghi chép; viết hoa để chỉ văn kiện xác định trong ngữ cảnh.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: đọc cho dân chúng nghe
  rationale: קרא với một văn bản làm bổ ngữ mang nghĩa “đọc”; thành ngữ “vào tai dân chúng” được chuyển thành lối nói tiếng Việt tự nhiên, đồng thời vẫn nêu rõ việc đọc thành tiếng.
- source_word: וַיֹּאמְרוּ
  choice: Họ nói
  rationale: Dịch trực tiếp động từ nói, không thêm sắc thái “đáp” hay “tuyên bố” mà nguyên văn không bắt buộc.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: Mọi điều Yahweh đã phán
  rationale: “Mọi điều” giữ tính bao quát của כֹּל אֲשֶׁר; “đã phán” phù hợp lời Đức Chúa Trời vừa được công bố; “Yahweh” chuyển tự danh riêng יְהוָה thay vì thay bằng một tước hiệu.
- source_word: נַעֲשֶׂה
  choice: chúng tôi sẽ làm
  rationale: Giữ nghĩa rộng và cụ thể của עשה, không đồng nhất sớm với ý “vâng lời” dù sự vâng phục được hàm ý.
- source_word: וְנִשְׁמָע
  choice: và sẽ lắng nghe
  rationale: שׁמע có thể chỉ nghe, chăm chú nghe, và trong quan hệ giao ước có thể mở rộng thành vâng lời. “Lắng nghe” giữ nét nghĩa thính giác nổi bật trong bối cảnh văn kiện vừa được đọc, còn chú thích bảo lưu nghĩa vâng phục.
theological_decisions:
- issue: Ý nghĩa của lời cam kết וְנִשְׁמָע
  choice: và sẽ lắng nghe
  alternative: và sẽ vâng lời
  rationale: Động từ שׁמע vừa có nghĩa nghe/lắng nghe, vừa thường mang nghĩa vâng lời trong ngữ cảnh giao ước. Bản chính không xóa bỏ nét nghĩa thính giác, còn chú thích nêu rõ hàm ý vâng phục, nhờ đó bảo tồn sự đa nghĩa của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu được tách sau hành động đọc để lời đáp của dân chúng rõ ràng hơn. Không thêm tên Môi-se vì nguyên văn câu này chỉ dùng chủ thể ngôi thứ ba theo ngữ cảnh; dùng “Yahweh” như danh riêng của Đức Chúa Trời.
