  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành phần của tiếng Hê-bơ-rơ: diễn tiến tự sự ("Rồi"), việc lấy và đọc Sách Giao Ước cho toàn dân nghe, cùng lời đáp bao quát của dân. “Chúng tôi sẽ làm và sẽ lắng nghe” giữ được sự phân biệt giữa נַעֲשֶׂה (làm) và וְנִשְׁמָע (nghe/lắng nghe), không ép động từ thứ hai chỉ còn nghĩa “vâng lời”.'
  naturalness: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. “Đọc cho dân chúng nghe” là cách diễn đạt tự nhiên cho thành ngữ “trong tai dân”; việc tách thành hai câu không làm thay đổi quan hệ tự sự hay ý nghĩa.
  terminology: “Sách Giao Ước” phản ánh chính xác cụm danh từ xác định trong nguyên ngữ và phù hợp văn phong Kinh Thánh tiếng Việt. “Yahweh” nhất quán với chính sách chuyển tự danh riêng. Chú thích giải thích đúng dải nghĩa của שׁמע trong ngữ cảnh giao ước mà không áp đặt một cách hiểu giáo phái.
