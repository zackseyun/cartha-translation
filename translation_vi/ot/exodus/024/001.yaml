  verdict: revise
  source_fidelity: Bản nháp giữ đúng lời phán, danh sách A-rôn, Na-đáp, A-bi-hu, sắc thái phân bộ của מִן trong “bảy mươi người trong số các trưởng lão”, và cách quy chiếu ngôi thứ ba bất thường “với Đức Giê-hô-va”. Tuy nhiên, động từ đầu là mệnh lệnh số ít nhắm trực tiếp Môi-se, trong khi động từ “sấp mình” là số nhiều. Câu sửa phân biệt hai số này rõ hơn mà không giải quyết căng thẳng của nguyên văn.
  naturalness: “Từ xa” là cách nói hiện đại, gọn và tự nhiên hơn “từ đằng xa”. Việc thêm “tất cả” ở vế hai giúp người đọc Việt hiểu chủ thể số nhiều của hành động phủ phục, không làm thêm nội dung ngoài phạm vi danh sách đã nêu.
  terminology: Các tên riêng theo lối phiên âm đang dùng nhất quán. “Đức Giê-hô-va” bảo toàn danh riêng יהוה trong quy ước tiếng Việt và không thay bằng một tước hiệu. “Sấp mình” diễn tả hành động thân thể của השתחוה, tránh thu hẹp nghĩa thành một thuật ngữ giáo phái.
