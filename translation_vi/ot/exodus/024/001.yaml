  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: vi
  text: 'Rồi Ngài phán với Môi-se[a]: “Con hãy lên với Đức Giê-hô-va, cùng A-rôn, Na-đáp, A-bi-hu và bảy mươi người trong số các trưởng lão của Y-sơ-ra-ên; rồi tất cả hãy sấp mình từ xa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ nói: “Hãy lên với Đức Giê-hô-va.” Cách diễn đạt này được giữ nguyên dù Đấng đang phán dường như chính là Đức Giê-hô-va; một số bản dịch diễn ý là “Hãy lên với Ta” hoặc “Hãy lên trước mặt Đức Giê-hô-va.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: Rồi Ngài phán với Môi-se
  rationale: Trật tự Hê-bơ-rơ sát chữ là “Và với Môi-se, Ngài phán.” Cách diễn đạt này mở một lời phán mới nối với ngữ cảnh trước. Tiếng Việt tự nhiên đặt chủ ngữ và động từ trước; “Rồi” thể hiện diễn tiến tường thuật, còn “Ngài” bổ sung chủ ngữ hàm ẩn từ ngữ cảnh.
- source_word: עֲלֵה
  choice: hãy lên
  rationale: Mệnh lệnh của עלה có nghĩa là đi/lên. “Hãy lên” tự nhiên trong tiếng Việt và không quy định quá mức điểm nhìn bằng “hãy đến” hay “hãy đi lên”.
- source_word: אֶל יְהוָה
  choice: với Đức Giê-hô-va
  rationale: אֶל chỉ hướng tiến đến; trong kết cấu “lên với,” tiếng Việt diễn đạt tự nhiên việc đến gần một Đấng. Danh riêng giao ước יְהוָה được phiên âm là “Đức Giê-hô-va.” Cách nói khác thường trong nguyên văn vẫn được giữ nguyên.
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: Con, A-rôn, Na-đáp, A-bi-hu
  rationale: Đại từ אַתָּה đứng đầu danh sách để nhấn mạnh Môi-se cùng những người được gọi. Trong lời Đức Chúa Trời phán trực tiếp với Môi-se, “con” là đại từ tự nhiên, trang trọng vừa phải; các tên riêng được phiên âm theo dạng quen thuộc trong tiếng Việt.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: và bảy mươi người trong số các trưởng lão của Y-sơ-ra-ên
  rationale: 'מִן có nghĩa phân bộ: bảy mươi người được kể từ trong hàng ngũ các trưởng lão. “Trong số” bảo toàn sắc thái này rõ hơn “bảy mươi trưởng lão.”'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: rồi sấp mình
  rationale: Động từ diễn tả hành động cúi rạp hoặc phủ phục trong sự tôn kính. “Sấp mình” giữ hình ảnh thân thể mà không thu hẹp nghĩa thành riêng hành vi thờ phượng.
- source_word: מֵ/רָחֹק
  choice: từ đằng xa
  rationale: Cụm từ diễn tả khoảng cách không gian đối với sự hiện diện thần thượng. “Từ đằng xa” rõ ràng, tự nhiên và giữ được giới từ chỉ điểm xuất phát מִן.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. “Đức Giê-hô-va” là dạng danh riêng đã quen thuộc trong tiếng Việt và giúp phân biệt với tước hiệu “Chúa,” thay vì thay danh riêng bằng một tước hiệu.
- issue: Giữ cách nói khác thường “hãy lên với Đức Giê-hô-va” khi Đấng phán dường như chính là Đức Giê-hô-va
  choice: Giữ nguyên cách quy chiếu ngôi thứ ba trong câu chính
  alternative: Hãy lên với Ta; hãy lên trước mặt Đức Giê-hô-va
  rationale: Nguyên văn nói rõ אֶל יְהוָה, không phải “với Ta.” Thay đổi thành ngôi thứ nhất hoặc thêm “trước mặt” sẽ âm thầm giải quyết một căng thẳng mà bản Hê-bơ-rơ vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Câu được sắp xếp lại theo cú pháp tiếng Việt nhưng giữ danh sách người được triệu gọi, sắc thái phân bộ của “bảy mươi người trong số,” hành động sấp mình và cách quy chiếu khác thường tới Đức Giê-hô-va.
