source:
  edition: WLC
  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: vi
  text: 'Ông nói với các trưởng lão: “Hãy ở lại đây chờ chúng tôi cho đến khi chúng tôi trở về với các ông. Này, A-rôn và Hu-rơ đang ở cùng các ông. Ai có việc tranh chấp[a] thì hãy đến gặp họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ai có vụ việc.”'
    reason: Thành ngữ בַעַל דְּבָרִים có thể chỉ rộng hơn một người có vụ việc hoặc vụ kiện cần trình lên để giải quyết.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: các trưởng lão
  rationale: Chỉ những người được công nhận là bậc lãnh đạo trong cộng đồng, không đơn thuần là những người cao tuổi.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: Hãy ở lại đây chờ chúng tôi
  rationale: ישׁב có nghĩa cơ bản là ngồi, cư trú hoặc ở lại; trong mệnh lệnh này, ý là ở nguyên tại chỗ trong khi chờ Môi-se và người đi cùng trở về.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: cho đến khi chúng tôi trở về với các ông
  rationale: Giữ rõ mệnh đề thời gian và động từ שוב, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: וְהִנֵּה
  choice: Này
  rationale: Từ này thu hút sự chú ý đến thông tin tiếp theo; “Này” trang trọng vừa phải và không cổ kính như một số cách dịch truyền thống.
- source_word: עִמָּכֶם
  choice: đang ở cùng các ông
  rationale: Diễn đạt trực tiếp sự hiện diện và liên kết của A-rôn và Hu-rơ với các trưởng lão.
- source_word: מִי בַעַל דְּבָרִים
  choice: Ai có việc tranh chấp
  rationale: Thành ngữ chỉ người có một vấn đề pháp lý, khiếu kiện hoặc tranh chấp cần được phân xử; cách dịch này truyền đạt rõ sắc thái tư pháp mà không thu hẹp quá mức.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: thì hãy đến gặp họ
  rationale: Thể chưa hoàn thành mang lực chỉ dẫn; “đến gặp họ” tự nhiên hơn trong tiếng Việt so với cách dịch sát chữ “đến gần họ”.
theological_decisions:
- issue: Chủ thể số ít mang nghĩa khái quát trong chỉ dẫn pháp lý
  choice: Ai ... thì hãy đến gặp họ
  alternative: Những ai ... thì hãy đến gặp họ
  rationale: מִי ... יִגַּשׁ là cấu trúc số ít khái quát. Đại từ “ai” trong tiếng Việt giữ được tính khái quát và không cần áp đặt giới tính, đồng thời vẫn phản ánh cấu trúc số ít của tiếng Hê-bơ-rơ.
- issue: Chủ thể không được nêu rõ của אָמַר
  choice: Ông nói
  alternative: Môi-se nói
  rationale: Động từ Hê-bơ-rơ chỉ có chủ thể ngôi thứ ba số ít, được xác định từ văn cảnh là Môi-se. Dùng “Ông” không thêm tên riêng vào câu nhưng vẫn tự nhiên trong mạch văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì lời nói trực tiếp hướng đến nhóm trưởng lão nam giới trong bối cảnh này; tên riêng được phiên âm theo lối tiếng Việt thông dụng. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
