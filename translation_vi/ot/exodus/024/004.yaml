language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: vi
  text: Môi-se chép lại mọi lời của Yahweh. Sáng sớm, ông dậy và xây một bàn thờ dưới chân núi[a], cùng mười hai trụ đá[b] tương ứng với mười hai bộ tộc Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “ở dưới ngọn núi”, tức là tại phần chân núi.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những hòn đá dựng đứng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: chép lại
  rationale: Diễn đạt tự nhiên hành động ghi các lời đã được phán thành văn bản, không thêm ý ngoài động từ כתב.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: mọi lời của Yahweh
  rationale: “Lời” giữ nghĩa trực tiếp của דְּבָרִים trong ngữ cảnh những điều Yahweh đã phán; “Yahweh” phiên âm danh riêng יהוה thay vì thay bằng một tước hiệu.
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Sáng sớm, ông dậy
  rationale: Thể Hiphil của שׁכם mang nghĩa thành ngữ “dậy sớm”; cách đặt trạng ngữ đầu câu tự nhiên trong tiếng Việt và vẫn thể hiện בַּבֹּקֶר.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: xây một bàn thờ
  rationale: Bám sát בנה “xây” và מִזְבֵּחַ “bàn thờ”, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: תַּחַת הָהָר
  choice: dưới chân núi
  rationale: תַּחַת có nghĩa đen là “ở dưới”; trong ngữ cảnh địa hình, “dưới chân núi” diễn đạt rõ vị trí ở phần nền hoặc chân núi.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: cùng mười hai trụ đá
  rationale: מַצֵּבָה chỉ một hòn đá được dựng đứng hoặc một trụ; “trụ đá” vừa tự nhiên vừa giữ được đặc điểm vật thể, không tự thêm chức năng tưởng niệm.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: tương ứng với mười hai bộ tộc Israel
  rationale: Giới từ לְ ở đây biểu thị sự tương ứng hoặc đại diện; “tương ứng với” làm rõ quan hệ giữa mười hai trụ và mười hai bộ tộc mà không khẳng định quá mức về nghi thức.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Chúa Trời / CHÚA / Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יהוה. Giữ “Yahweh” bảo toàn tư cách danh giao ước, không thay nó bằng một tước hiệu hay áp đặt lối đọc thuộc riêng một truyền thống.
- issue: Ý nghĩa của mười hai trụ đá
  choice: tương ứng với mười hai bộ tộc Israel
  alternative: đại diện cho mười hai bộ tộc Israel
  rationale: Giới từ לְ cho phép hiểu là tương ứng hoặc đại diện. “Tương ứng với” giữ độ mở của cấu trúc Hê-bơ-rơ và tránh xác định biểu tượng học mạnh hơn điều câu văn nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se”, “bàn thờ”, “bộ tộc Israel” theo cách gọi quen thuộc; giữ danh “Yahweh”. Hai chú thích đặt đúng ngay sau các cụm từ có phương án dịch khác.
