base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: vi
  text: Vinh quang của Yahweh hiện ra như một ngọn lửa thiêu đốt trên đỉnh núi, trước mắt con cái Israel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngọn lửa nuốt chửng.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “con dân Israel” hoặc “người Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: vẻ hiện ra
  rationale: Diễn đạt điều có thể nhìn thấy—sự biểu hiện hữu hình—mà không hàm ý đây là một khải tượng tiên tri.
- source_word: כְּבוֹד
  choice: vinh quang
  rationale: Trong ngữ cảnh nói về sự hiện diện hữu hình, rực sáng của Đức Chúa Trời, “vinh quang” là cách dịch tự nhiên và phù hợp.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng cách chuyển tự, thay vì thay thế bằng một tước hiệu.
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: giống như ngọn lửa thiêu đốt
  rationale: כְּ đánh dấu phép so sánh; phân từ אֹכֶלֶת, theo nghĩa đen là “ăn/nuốt,” khi dùng với lửa mang nghĩa thiêu đốt hoặc nuốt chửng. Cách dịch này tự nhiên trong tiếng Việt và giữ được sức mạnh của hình ảnh.
- source_word: בְּרֹאשׁ הָהָר
  choice: trên đỉnh núi
  rationale: Diễn đạt trực tiếp vị trí ở phần cao nhất của ngọn núi.
- source_word: לְעֵינֵי
  choice: trước mắt
  rationale: Giữ hình ảnh thị giác của thành ngữ Hê-bơ-rơ, nghĩa là ở ngay trước mắt hoặc trong tầm nhìn rõ ràng.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Phản ánh cấu trúc “các con của Israel” và là cách gọi tập thể quen thuộc trong văn phong Kinh Thánh tiếng Việt; chú thích nêu các cách dịch tự nhiên hơn.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va
  rationale: Bản văn dùng trực tiếp danh thánh; chuyển tự “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Danh xưng giao ước בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: con dân Israel; người Israel
  rationale: Cụm Hê-bơ-rơ có dạng giống đực số nhiều theo ngữ pháp và theo nghĩa đen là “các con trai/con của Israel.” “Con cái Israel” vừa gần hình thức nguồn vừa được hiểu tự nhiên là toàn thể cộng đồng; các cách dịch tập thể khác được ghi ở chú thích để không che khuất phạm vi nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Câu giữ phép so sánh của tiếng Hê-bơ-rơ, nhấn mạnh cảnh tượng hữu hình bằng “vẻ hiện ra” và “trước mắt”; trật tự cuối câu tự nhiên trong tiếng Việt mà không làm mất trọng tâm thị giác.
