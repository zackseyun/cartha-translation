revisions:
- from: Vẻ hiện ra của vinh quang Yahweh giống như ngọn lửa thiêu đốt trên đỉnh núi, trước mắt con cái Israel[a][b].
  to: Vinh quang của Yahweh hiện ra như một ngọn lửa thiêu đốt trên đỉnh núi, trước mắt con cái Israel[a][b].
  rationale: Sửa duy nhất cách diễn đạt «Vẻ hiện ra» thành «hiện ra» để tạo câu tiếng Việt tự nhiên, đồng thời vẫn biểu đạt מַרְאֵה như một sự xuất hiện/cảnh tượng hữu hình của vinh quang Yahweh. Thêm «một» trước «ngọn lửa» cho tự nhiên; không thay đổi nghĩa hay phạm vi của bản văn.
  reviewer_model: gpt-5.6-terra
