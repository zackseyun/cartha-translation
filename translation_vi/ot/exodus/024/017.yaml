  terminology: «Vinh quang», «Yahweh», «ngọn lửa thiêu đốt», «đỉnh núi», và «con cái Israel» đều phù hợp ngữ cảnh và nhất quán với lựa chọn thuật ngữ. Chú thích a và b neo đúng sau các đơn vị mà chúng giải thích.
