source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: vi
  text: Ông sai các thanh niên trong dân Israel đi, và họ dâng lễ thiêu và hiến tế các lễ vật bình an bằng bò đực cho Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lễ vật giao hảo”, “lễ vật thông công” hoặc “lễ vật an lành”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ông sai ... đi
  rationale: Chủ ngữ được tiếp nối từ ngữ cảnh là Môi-se; tiếng Việt có thể giữ đại từ “ông” để phản ánh việc tiếng Hê-bơ-rơ không nhắc lại tên. Cấu trúc “sai ... đi” diễn đạt tự nhiên động từ שׁלח.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: các thanh niên trong dân Israel
  rationale: נַעֲרֵי chỉ những nam thanh niên; בְּנֵי יִשְׂרָאֵל ở đây là tên gọi tập thể chỉ dân Israel. Cách dịch này tự nhiên hơn “các con trai của Israel” và không làm mất nét nghĩa nam giới của נַעֲרֵי.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: họ dâng các lễ thiêu
  rationale: Đây là thành ngữ tế tự trong đó עלה đi với עֹלָה. “Dâng các lễ thiêu” truyền đạt đúng hành động hiến tế và là cách nói rõ ràng trong tiếng Việt hiện đại.
- source_word: וַיִּזְבְּחוּ
  choice: hiến
  rationale: Trong ngữ cảnh tế tự, זבח chỉ việc giết con vật để làm sinh tế. “Hiến ... làm lễ vật” vừa tự nhiên vừa giữ rõ tính chất tế lễ.
- source_word: זְבָחִים שְׁלָמִים
  choice: lễ vật giao hảo
  rationale: שְׁלָמִים là loại sinh tế gắn với sự hòa thuận, an lành và thông công. “Lễ vật giao hảo” giữ sắc thái quan hệ mà không thu hẹp nghĩa chỉ còn cảm xúc bình an; các cách hiểu khác được ghi ở chú thích.
- source_word: לַיהוָה
  choice: lên Yahweh
  rationale: Giữ danh riêng giao ước יהוה dưới dạng “Yahweh”. Giới từ “lên” phối hợp tự nhiên với động từ “dâng” và áp dụng cho cả hai loại lễ vật.
- source_word: פָּרִים
  choice: các con bò
  rationale: פָּרִים là số nhiều của פַּר, chỉ bò đực, thường là bò đực non trong ngữ cảnh hiến tế. Bản chính dùng “bò” tự nhiên trong tiếng Việt; không nên hiểu đây là con vật của cả hai loại lễ, vì trật tự tiếng Hê-bơ-rơ gắn từ này trực tiếp nhất với lễ vật giao hảo.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Văn bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” bảo tồn tư cách danh riêng và tránh thay bằng một tước hiệu.
- issue: Phạm vi liên hệ của פָּרִים (các con bò)
  choice: Gắn trực tiếp với lễ vật giao hảo
  alternative: Hiểu các con bò là con vật dùng chung cho cả lễ thiêu lẫn lễ vật giao hảo
  rationale: Trong cú pháp Hê-bơ-rơ, פָּרִים đứng sau זְבָחִים שְׁלָמִים và phù hợp tự nhiên nhất với cụm ấy. Tuy vậy, về sự kiện, câu không nhất thiết loại trừ khả năng bò cũng được dùng làm lễ thiêu; bản dịch tránh khẳng định thêm điều văn bản không nói rõ.
- issue: Ý nghĩa của זְבָחִים שְׁלָמִים
  choice: lễ vật giao hảo
  alternative: lễ vật bình an; lễ vật thông công; lễ vật cầu an
  rationale: Tên loại lễ này có trường nghĩa liên quan đến toàn vẹn, an lành và quan hệ hòa thuận. “Giao hảo” giữ được chiều kích quan hệ mà không áp đặt một cách giải thích giáo phái riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “dân Israel” thay cho lối dịch cứng “các con trai của Israel”; nét nam giới vẫn được biểu đạt bằng “các thanh niên”. Dấu chấm phẩy làm rõ hai hành động liên tiếp mà không phá dòng tường thuật.
