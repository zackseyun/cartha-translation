- from: Ông sai các thanh niên trong dân Israel đi; họ dâng các lễ thiêu và hiến các con bò làm lễ vật giao hảo[a] lên Yahweh.
  to: Ông sai các thanh niên trong dân Israel đi, và họ dâng lễ thiêu và hiến tế các lễ vật bình an bằng bò đực cho Yahweh.[a]
  rationale: Bản sửa đổi giữ nguyên chủ ngữ được tiếp nối từ ngữ cảnh, hai hành động tế tự và thứ tự cơ bản của câu Hê-bơ-rơ. “Cho Yahweh” chuyển đúng chức năng của לַיהוָה; “bằng bò đực” phản ánh פָּרִים và làm rõ sự gắn kết tự nhiên với lễ vật bình an. Chú thích bảo lưu các lựa chọn từ vựng chính đáng mà không thêm diễn giải về mục đích của nghi lễ.
  reviewer_model: gpt-5.6-terra
