    rationale: 'Lamed trong לַיהוָה đánh dấu đối tượng/đích hướng của việc dâng tế lễ: “cho Yahweh”. “Lên Yahweh” không tự nhiên trong tiếng Việt và dễ gây nhiễu nghĩa.'
  - severity: low
    issue: Cách diễn đạt quan hệ giữa “bò” và lễ vật giao hảo
    rationale: “Hiến các con bò làm lễ vật giao hảo” có thể dùng được, nhưng cấu trúc “các lễ vật bình an bằng bò” phản ánh rõ hơn rằng פָּרִים nêu loài vật của các lễ vật giao hảo.
  - severity: low
    issue: Chú thích có “lễ vật cầu an”
    rationale: “Cầu an” diễn tả một mục đích hoặc hành vi cầu xin, không phải là tương đương từ vựng trực tiếp, trung tính của tên loại lễ שְׁלָמִים. Nên thay bằng “lễ vật an lành” hoặc bỏ.
