base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: vi
  text: Môi-se đi vào giữa đám mây rồi lên núi.[a] Môi-se ở trên núi bốn mươi ngày và bốn mươi đêm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi vào đám mây.” Tiếng Hê-bơ-rơ nhấn mạnh rằng Môi-se đi vào chính bên trong đám mây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: đi vào
  rationale: Trong ngữ cảnh này, בוא diễn tả Môi-se tiến vào đám mây; “đi vào” tự nhiên và giữ rõ hướng chuyển động.
- source_word: בְּתוֹךְ
  choice: vào giữa
  rationale: תּוֹךְ chỉ phần giữa hoặc bên trong; “vào giữa” giữ hình ảnh Môi-se thực sự tiến vào trong đám mây.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Dịch trực tiếp danh từ עָנָן có mạo từ; đây là đám mây đã xuất hiện trong mạch truyện và gắn với sự hiện diện của Đức Chúa Trời.
- source_word: וַיַּעַל
  choice: lên
  rationale: עלה thường có nghĩa là đi lên; “lên núi” là cách nói tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: אֶל הָהָר
  choice: núi
  rationale: Sau động từ chỉ sự đi lên, tiếng Việt tự nhiên dùng “lên núi”; cách này diễn đạt cả hướng đi lẫn đích đến mà không thêm ý leo trèo.
- source_word: וַיְהִי
  choice: ở
  rationale: היה ở đây diễn tả vị trí của Môi-se trong một khoảng thời gian; “ở” trực tiếp hơn “lưu lại,” vốn có thể thêm sắc thái không được nói rõ.
- source_word: בָּהָר
  choice: ở trên núi
  rationale: Giới từ ב với הַר trong ngữ cảnh này chỉ vị trí trên núi; đây là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: bốn mươi ngày và bốn mươi đêm
  rationale: Cách dịch chuẩn xác và tự nhiên của cụm từ Hê-bơ-rơ chỉ thời lượng.
theological_decisions:
- issue: Hình ảnh đám mây gắn với sự hiện diện của Đức Chúa Trời
  choice: đám mây
  alternative: đám mây dày đặc
  rationale: Bản Hê-bơ-rơ chỉ dùng עָנָן, không có tính từ mang nghĩa “dày đặc”; bản dịch giữ nguyên hình ảnh thần hiện mà không diễn giải thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đi vào giữa đám mây” để giữ nét sống động của nguyên văn; lặp tên “Môi-se” ở câu thứ hai theo cấu trúc Hê-bơ-rơ và để nhấn lại chủ thể.
