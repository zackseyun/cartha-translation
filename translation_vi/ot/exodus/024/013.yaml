source:
  edition: WLC
  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וִ/יהוֹשֻׁ֖עַ מְשָׁרְת֑/וֹ וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הַ֥ר הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: vi
  text: Môi-se đứng dậy cùng với Giô-suê, người phụ tá của ông[a]; rồi Môi-se đi lên núi của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người phục vụ ông.” Từ Hê-bơ-rơ chỉ người phục vụ bên cạnh một người khác; ở đây có lẽ nói đến Giô-suê trong vai trò phụ tá riêng của Môi-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: đứng dậy
  rationale: Động từ קום ở thể Qal trong mạch kể chuyện diễn tả việc đứng dậy để bắt đầu hành động tiếp theo; cách dịch này tự nhiên và không diễn giải quá mức thành việc lên đường.
- source_word: וִיהוֹשֻׁעַ
  choice: Giô-suê
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại.
- source_word: מְשָׁרְתוֹ
  choice: người phụ tá của ông
  rationale: Danh từ từ gốc שׁרת chỉ người phục vụ bên cạnh một người khác; trong ngữ cảnh này, 'người phụ tá' diễn đạt vai trò trợ giúp riêng của Giô-suê đối với Môi-se mà không gợi ý thân phận nô lệ hay chức vụ tôn giáo.
- source_word: וַיַּעַל
  choice: đi lên
  rationale: Động từ עלה ở đây chỉ chuyển động lên núi; 'đi lên' là cách diễn đạt tự nhiên và giữ rõ phương hướng không gian.
- source_word: הַר הָאֱלֹהִים
  choice: núi của Đức Chúa Trời
  rationale: Giữ cấu trúc sở thuộc và ý nghĩa thiêng liêng của cụm từ Hê-bơ-rơ, không đồng nhất hoặc diễn giải địa danh vượt quá câu văn.
theological_decisions:
- issue: Mối quan hệ giữa Môi-se và Giô-suê trong מְשָׁרְתוֹ
  choice: Giô-suê được gọi là người phụ tá của Môi-se.
  alternative: đầy tớ của ông; người phục vụ ông
  rationale: Từ Hê-bơ-rơ có thể chỉ nhiều dạng phục vụ, nhưng ngữ cảnh và hậu tố sở hữu phù hợp nhất với việc Giô-suê phục vụ bên cạnh Môi-se. Cách dịch không áp đặt ý niệm nô lệ hoặc chức vụ giáo phẩm.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và tự nhiên trong tiếng Việt hiện đại. Dùng 'rồi' để thể hiện diễn tiến của hai động từ nối tiếp; dấu chấm phẩy giúp phân biệt việc Môi-se đứng dậy cùng Giô-suê với mệnh đề sau chỉ nói rõ Môi-se đi lên núi.
