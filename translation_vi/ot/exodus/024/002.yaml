  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: vi
  text: Chỉ một mình Môi-se được đến gần Yahweh; còn họ không được đến gần, và dân chúng không được cùng ông đi lên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: được đến gần
  rationale: Động từ נגשׁ diễn tả việc tiến đến gần. Trong ngữ cảnh chỉ thị và giới hạn quyền tiếp cận, “được đến gần” tự nhiên trong tiếng Việt và làm rõ sự cho phép dành riêng cho Môi-se.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm quen thuộc của tên משה trong tiếng Việt.
- source_word: לְבַדּוֹ
  choice: chỉ một mình
  rationale: 'Diễn đạt rõ tính độc quyền: ngoài Môi-se ra, không ai trong nhóm được phép đến gần.'
- source_word: אֶל יְהוָה
  choice: đến gần Đức Giê-hô-va
  rationale: Giới từ אֶל chỉ hướng tiến đến; danh hiệu kính ngữ “Đức” đi với dạng phiên âm quen thuộc “Giê-hô-va” của danh YHWH trong văn phong Kinh Thánh tiếng Việt.
- source_word: וְהֵם
  choice: còn họ
  rationale: Đại từ quy chiếu đến A-rôn, Na-đáp, A-bi-hu và bảy mươi trưởng lão ở câu trước; “còn” nêu bật sự tương phản với riêng Môi-se mà không thêm danh xưng ngoài nguyên văn.
- source_word: לֹא יִגָּשׁוּ
  choice: không được đến gần
  rationale: Lặp lại cùng cách dịch נגשׁ để giữ liên kết từ vựng và sự đối lập trực tiếp với đặc quyền của Môi-se.
- source_word: וְהָעָם
  choice: và dân chúng
  rationale: עם chỉ cộng đồng dân chúng; không thêm “Y-sơ-ra-ên” vì từ này không có trong câu Hebrew.
- source_word: לֹא יַעֲלוּ
  choice: không được ... đi lên
  rationale: עלה chỉ chuyển động đi lên, ở đây là lên núi; “đi lên” tự nhiên và vẫn giữ ý nghĩa không gian.
- source_word: עִמּוֹ
  choice: cùng ông
  rationale: Cụm giới từ chỉ việc đi cùng Môi-se; “ông” là đại từ tiếng Việt tự nhiên, trang trọng vừa phải.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước YHWH. Bản dịch giữ một dạng danh riêng thay vì thay bằng tước hiệu “CHÚA”; “Đức Giê-hô-va” là dạng đã quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt. Cách chọn này không làm thay đổi sự phân biệt trong câu giữa Đức Chúa Trời, Môi-se, nhóm lãnh đạo và dân chúng.
- issue: Sắc thái của các động từ chưa hoàn thành trong mệnh lệnh
  choice: được / không được
  alternative: sẽ / sẽ không; hãy / đừng
  rationale: Trong mạch các chỉ thị về ai được phép đến gần, các hình thái יִגַּשׁוּ và יַעֲלוּ mang lực quy định hơn là chỉ dự báo tương lai. “Được/không được” truyền đạt giới hạn tiếp cận mà không biến câu thành lời khuyên.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Giữ ba vế song song và sự đối lập giữa một mình Môi-se, nhóm “họ,” và dân chúng; dấu chấm phẩy giúp câu rõ nhịp mà không thêm nội dung.
