  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: vi
  text: Vinh quang của Yahweh ngự trên núi Sinai, và đám mây bao phủ núi ấy[a] suốt sáu ngày. Đến ngày thứ bảy, Ngài gọi Môi-se từ giữa đám mây[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “đám mây bao phủ vinh quang ấy,” nếu hậu tố trong tiếng Hê-bơ-rơ chỉ “vinh quang của Yahweh” thay vì núi Sinai.
    reason: alternative_reading
  - marker: b
    text: Hay “từ bên trong đám mây.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: ngự
  rationale: Diễn đạt việc hiện diện và lưu lại một cách trang trọng; tự nhiên khi chủ ngữ là vinh quang của Đức Chúa Trời, đồng thời giữ được ý về một sự hiện diện ổn định của động từ שכן.
- source_word: כְּבוֹד יְהוָה
  choice: vinh quang của Yahweh
  rationale: Giữ cấu trúc sở hữu và nghĩa quen thuộc của כָּבוֹד là vinh quang uy nghi, được bày tỏ trong sự hiện diện của Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn, thay vì thay thế bằng một tước hiệu.
- source_word: עַל הַר סִינַי
  choice: trên núi Sinai
  rationale: Cách diễn đạt địa điểm tự nhiên trong tiếng Việt, giữ đúng quan hệ không gian của עַל.
- source_word: וַיְכַסֵּהוּ
  choice: bao phủ núi ấy
  rationale: Hậu tố giống đực số ít nhiều khả năng chỉ núi Sinai. Tiếng Việt cần nêu danh từ để tránh đại từ mơ hồ hoặc thiếu tự nhiên; cách hiểu khác được giữ trong chú thích.
- source_word: שֵׁשֶׁת יָמִים
  choice: suốt sáu ngày
  rationale: Diễn đạt tự nhiên khoảng thời gian liên tục mà nguyên văn nêu bằng cụm chỉ thời lượng.
- source_word: וַיִּקְרָא אֶל מֹשֶׁה
  choice: Ngài gọi Môi-se
  rationale: קרא אל mang nghĩa gọi một người; “Ngài” giữ mạch chủ thể là Yahweh mà không lặp lại danh xưng.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Đến ngày thứ bảy
  rationale: Cách chuyển tiếp thời gian tự nhiên, thể hiện hành động xảy ra vào ngày thứ bảy sau sáu ngày đã nêu.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: từ giữa đám mây
  rationale: Giữ hình ảnh phát ra từ phần bên trong đám mây của מִתּוֹךְ, đồng thời trang trọng và dễ hiểu.
theological_decisions:
- issue: Chủ thể của động từ “gọi”
  choice: Yahweh, được biểu thị bằng “Ngài”
  alternative: “Vinh quang của Yahweh” được hiểu như chủ thể hoán dụ
  rationale: Mạch tường thuật về cuộc thần hiện tại Sinai cho thấy chính Yahweh gọi Môi-se. Đại từ giữ dòng văn của tiếng Hê-bơ-rơ mà không diễn giải dài thêm.
- issue: Đối tượng được đám mây bao phủ
  choice: núi Sinai
  alternative: vinh quang của Yahweh
  rationale: Cả “núi” và “vinh quang” đều có thể phù hợp về mặt ngữ pháp với hậu tố giống đực số ít. Bối cảnh và hình ảnh tường thuật nghiêng về núi Sinai, nhưng cách hiểu kia là một khả năng thực sự nên được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “ngự” cho sự hiện diện uy nghi của vinh quang Yahweh; dùng “Môi-se” theo dạng tên quen thuộc trong tiếng Việt. Hai chú thích bảo lưu sự mơ hồ về đối tượng được che phủ và một cách diễn đạt tương đương của מִתּוֹךְ.
