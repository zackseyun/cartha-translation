base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/006.yaml
  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: vi
  text: Môi-se lấy một nửa huyết, để vào các chậu; còn nửa huyết kia, ông hắt lên bàn thờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vẩy lên” hoặc “rảy trên bàn thờ.” Động từ Hê-bơ-rơ có thể được hiểu theo vài cách trong ngữ cảnh tế lễ; bản văn chính dùng “hắt” để thể hiện lực của hành động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Động từ לקח trong mạch kể chuyện mang nghĩa thông thường là “lấy”; cách dịch này tự nhiên và trực tiếp trong tiếng Việt.
- source_word: חֲצִי הַדָּם
  choice: một nửa số huyết
  rationale: Giữ rõ nghĩa phân chia một lượng huyết xác định thành hai phần; “số huyết” tự nhiên hơn “của huyết” trong tiếng Việt.
- source_word: וַיָּשֶׂם בָּאַגָּנֹת
  choice: đựng vào các chậu
  rationale: שׂים là động từ đặt/để rộng nghĩa, còn אַגָּנֹת là các vật chứa chất lỏng. Trong ngữ cảnh này, “đựng vào các chậu” diễn đạt tự nhiên hành động cho huyết vào vật chứa.
- source_word: זָרַק
  choice: hắt
  rationale: Trong nghi thức tế lễ, זרק chỉ việc tung hoặc hắt huyết lên bề mặt, mạnh hơn ý “rảy” nhẹ. “Hắt” vừa tự nhiên trong tiếng Việt vừa bảo toàn lực của hành động.
- source_word: עַל הַמִּזְבֵּחַ
  choice: lên bàn thờ
  rationale: עַל chỉ hướng hoặc vị trí trên bề mặt; kết hợp với “hắt”, cụm “lên bàn thờ” diễn đạt rõ huyết được hắt vào bề mặt bàn thờ.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách thức đưa huyết lên bàn thờ trong nghi thức giao ước
  choice: hắt lên bàn thờ
  alternative: rảy trên bàn thờ; vẩy lên bàn thờ
  rationale: Động từ Hê-bơ-rơ זרק có thể được diễn đạt theo nhiều cách trong ngữ cảnh tế lễ. “Hắt” giữ sắc thái hành động tương đối mạnh mà không thêm cách giải thích giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyết” thay cho “máu” để phù hợp ngữ cảnh nghi lễ tế lễ, nhưng cấu trúc câu vẫn tự nhiên. Đảo “còn nửa kia” giúp thể hiện rõ sự phân chia đối xứng trong nguyên văn.
