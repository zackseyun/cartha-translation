  text: וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הָ/הָ֑ר וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: vi
  text: Bấy giờ, Môi-se đi lên núi[a], và đám mây bao phủ ngọn núi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và Môi-se đi đến núi.” Liên từ kể chuyện trong tiếng Hê-bơ-rơ có thể dịch đơn giản là “và”; giới từ có thể chỉ “đến”, hoặc trong ngữ cảnh động từ “đi lên”, chỉ việc đi lên núi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: đi lên
  rationale: Động từ עלה diễn tả chuyển động đi lên; “đi lên” tự nhiên trong tiếng Việt hiện đại và không hàm ý cách thức leo trèo.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: אֶל
  choice: lên
  rationale: Khi đi với עלה và “núi”, giới từ אֶל chỉ hướng chuyển động đến hoặc lên núi. Tiếng Việt diễn đạt tự nhiên bằng cụm “đi lên núi”; khả năng hiểu là “đến núi” được ghi ở chú thích.
- source_word: הָהָר
  choice: núi / ngọn núi
  rationale: הַר trong bối cảnh Si-na-i thích hợp nhất là “núi”. Lần thứ hai thêm loại từ “ngọn” để câu tiếng Việt tự nhiên mà không thay đổi sở chỉ xác định.
- source_word: וַיְכַס
  choice: bao phủ
  rationale: כסה có nghĩa là che hoặc phủ. “Bao phủ” phù hợp với hình ảnh đám mây phủ trên núi nhưng không diễn giải thêm bản chất của đám mây.
- source_word: הֶעָנָן
  choice: đám mây
  rationale: Danh từ xác định chỉ đám mây đã được nhận biết trong ngữ cảnh; tiếng Việt dùng “đám mây” tự nhiên, với tính xác định được suy ra từ văn cảnh.
- source_word: אֶת
  choice: '[không dịch riêng]'
  rationale: Dấu hiệu đánh dấu tân ngữ xác định trong tiếng Hê-bơ-rơ không có từ tương ứng cần biểu đạt trong tiếng Việt.
- source_word: וַ
  choice: Bấy giờ / và
  rationale: Waw nối tiếp đẩy câu chuyện tiến về phía trước. “Bấy giờ” ở đầu câu biểu đạt trình tự tự nhiên; “và” nối mệnh đề thứ hai, đồng thời giữ tính liên kết của nguyên văn.
theological_decisions:
- issue: Bản chất của đám mây
  choice: Chỉ dịch mô tả là “đám mây”, không gọi rõ là vinh quang hay đám mây của Đức Chúa Trời.
  alternative: “đám mây vinh quang” hoặc “đám mây của Đức Giê-hô-va”
  rationale: Nguyên văn câu này chỉ nói הֶעָנָן, “đám mây”. Dù văn cảnh rộng hơn liên hệ đám mây với sự hiện diện thần linh, bản dịch không đưa điều ấy vào câu khi nguyên văn không nói rõ.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. “Bấy giờ” duy trì nhịp kể chuyện mà không quá cổ; “bao phủ” giữ hình ảnh trực tiếp của nguyên văn. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
