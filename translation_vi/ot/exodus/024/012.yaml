source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se: “Hãy lên núi, đến với Ta và ở lại đó. Ta sẽ ban cho con các bảng đá, luật pháp[a] và điều răn[b] mà Ta đã viết để chỉ dạy họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự chỉ dạy”. Từ Hê-bơ-rơ torah thường có nghĩa là “sự chỉ dạy” hoặc “giáo huấn”, chứ không chỉ là luật lệ.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “luật pháp và điều răn” có thể được hiểu là sự chỉ dạy thêm về giao ước bên cạnh các bảng đá, hoặc là lời mô tả thêm về nội dung được viết trên các bảng ấy.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: Hãy lên núi đến với Ta
  rationale: Giữ cả ý chuyển động đi lên núi lẫn hướng đến nơi Yahweh hiện diện, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: וֶהְיֵה שָׁם
  choice: và ở lại đó
  rationale: Trong ngữ cảnh, mệnh lệnh không chỉ có nghĩa là hiện diện mà còn là lưu lại tại đó.
- source_word: לֻחֹת הָאֶבֶן
  choice: các bảng đá
  rationale: Cách nói ngắn gọn, tự nhiên, chỉ các bảng giao ước làm bằng đá.
- source_word: וְהַתּוֹרָה
  choice: luật pháp
  rationale: Phù hợp bối cảnh giao ước tại Si-nai và quen thuộc với độc giả; chú thích lưu giữ nghĩa rộng hơn là sự chỉ dạy.
- source_word: וְהַמִּצְוָה
  choice: điều răn
  rationale: Giữ hình thức số ít của tiếng Hê-bơ-rơ, không tự ý chuyển thành số nhiều.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: mà Ta đã viết
  rationale: Diễn đạt hành động đã hoàn tất của động từ hoàn thành trong tiếng Hê-bơ-rơ.
- source_word: לְהוֹרֹתָם
  choice: để dạy dỗ họ
  rationale: Giữ ý mục đích của động từ nguyên mẫu Hiphil và đại từ số nhiều chỉ dân Y-sơ-ra-ên.
theological_decisions:
- issue: Phạm vi của “luật pháp và điều răn” so với “các bảng đá”
  choice: 'Giữ chuỗi danh từ phối hợp: “các bảng đá, cùng luật pháp và điều răn”.'
  alternative: Hiểu “luật pháp và điều răn” là phần giải thích đồng vị cho các bảng đá, hoặc xem cả ba cách gọi chỉ riêng Mười Điều Răn.
  rationale: Cấu trúc Hê-bơ-rơ không quyết định rõ các danh từ chỉ những thực thể bổ sung hay cùng mô tả một nội dung; bản dịch không nên âm thầm giải quyết sự mơ hồ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—con” trong lời Yahweh nói trực tiếp với Môi-se. “Rồi” nối câu với mạch tường thuật trước đó; “cùng” giúp giữ cấu trúc liệt kê mà không quyết định quan hệ đồng vị.
