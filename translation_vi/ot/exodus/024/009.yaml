  yaml_path: translation/ot/exodus/024/009.yaml
  text: Then Moses went up, and Aaron, Nadab, Abihu, and seventy of the elders of Israel.
translation:
  language: vi
  text: Bấy giờ, Môi-se đi lên cùng với A-rôn, Na-đáp, A-bi-hu và bảy mươi người trong số các trưởng lão Y-sơ-ra-ên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: đi lên
  rationale: Động từ עלה diễn tả chuyển động hướng lên. “Đi lên” tự nhiên trong tiếng Việt và không thêm “núi,” vốn chỉ được ngữ cảnh hàm ý chứ không có trong câu này.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: וְאַהֲרֹן
  choice: cùng với A-rôn
  rationale: Liên từ וְ nối A-rôn và những người tiếp theo với chủ thể Môi-se; “cùng với” làm rõ tự nhiên rằng tất cả đều đi lên, không thay đổi ý nghĩa.
- source_word: נָדָב
  choice: Na-đáp
  rationale: Dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: וַאֲבִיהוּא
  choice: A-bi-hu
  rationale: Dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: וְשִׁבְעִים
  choice: và bảy mươi
  rationale: Giữ số đếm và quan hệ phối hợp của nguyên văn.
- source_word: מִזִּקְנֵי
  choice: trưởng lão trong dân
  rationale: 'מִן mang nghĩa bộ phận: bảy mươi người thuộc hàng ngũ trưởng lão. Cách diễn đạt này tự nhiên trong tiếng Việt và không hàm ý toàn bộ các trưởng lão chỉ có bảy mươi người.'
- source_word: יִשְׂרָאֵל
  choice: Y-sơ-ra-ên
  rationale: Dạng tên dân tộc quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Bấy giờ” để nối mạch tường thuật của וַ־; giữ “đi lên” mà không bổ sung địa điểm. Cụm “cùng với” giúp danh sách chủ thể tự nhiên trong tiếng Việt.
