base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: vi
  text: Các ngươi phải giữ con vật ấy cho đến ngày mười bốn của tháng này. Rồi toàn thể hội chúng, tức cộng đồng Ít-ra-ên, phải giết nó vào lúc chạng vạng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “giữa hai buổi chiều,” một thành ngữ thời gian có nghĩa chính xác còn được tranh luận, thường được hiểu là khoảng chạng vạng quanh lúc mặt trời lặn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... לְמִשְׁמֶרֶת
  choice: phải giữ con vật ấy
  rationale: Cụm danh từ chỉ sự trông giữ được diễn đạt tự nhiên thành mệnh lệnh trong tiếng Việt; “con vật ấy” làm rõ đối tượng đã được nhắc đến mà không thu hẹp thành riêng chiên hay dê.
- source_word: לָכֶם
  choice: các ngươi
  rationale: Đại từ số nhiều chỉ cộng đồng nhận chỉ thị; chủ thể của động từ “giữ” truyền đạt trách nhiệm trông nom vốn hàm trong cấu trúc Hê-bơ-rơ.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: cho đến ngày mười bốn tháng này
  rationale: Cách nói ngày tháng tự nhiên trong tiếng Việt, giữ nguyên ngày được ấn định.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: phải giết nó
  rationale: שׁחט nói về việc giết thịt một con vật. “Giết” rõ ràng, trang trọng vừa phải và không tự thêm sắc thái tế lễ ngoài câu; đại từ “nó” quy chiếu về con vật đã chọn.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: toàn thể hội chúng của cộng đồng Ít-ra-ên
  rationale: Giữ hai danh từ tập thể קהל và עדה thay vì làm phẳng thành một từ, đồng thời tạo một cụm tiếng Việt có thể hiểu được.
- source_word: בֵּין הָעַרְבָּיִם
  choice: vào lúc chạng vạng
  rationale: Đây là thành ngữ thời gian, nguyên văn “giữa hai buổi chiều/tối,” thường chỉ khoảng quanh lúc mặt trời lặn. “Lúc chạng vạng” tự nhiên trong tiếng Việt, còn nghĩa sát chữ và độ bất định được bảo lưu trong chú thích.
theological_decisions:
- issue: Chủ thể tập thể của lệnh giết con vật
  choice: toàn thể hội chúng của cộng đồng Ít-ra-ên phải giết nó
  alternative: mỗi gia đình phải giết con vật của mình
  rationale: Nguyên văn dùng chủ thể tập thể cho toàn Ít-ra-ên. Bản dịch giữ cách nói mang tính cộng đồng, không giải thích lại theo cách thực hiện của từng gia đình trong văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để duy trì lời chỉ thị trực tiếp số nhiều; giữ cấu trúc tập thể kép của nguyên văn nhưng sắp xếp thành cụm tiếng Việt tự nhiên.
