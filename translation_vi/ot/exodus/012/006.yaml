  terminology: “Các ngươi,” “giữ,” và “giết” phù hợp với văn cảnh chỉ thị và không áp đặt cách diễn giải tế tự. Chú thích nên tránh dấu gạch chéo “chiều/tối” và nói rõ rằng ý nghĩa chính xác của thành ngữ thời gian vẫn có tranh luận.
  issues:
