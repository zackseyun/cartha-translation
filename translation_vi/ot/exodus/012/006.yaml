  source_fidelity: Bản dịch truyền đạt đúng trình tự mệnh lệnh, thời hạn đến ngày mười bốn của tháng đang nói đến, chủ thể tập thể của Ít-ra-ên, và thời điểm בֵּין הָעַרְבָּיִם. “Vào lúc chạng vạng” là cách hiểu hợp lý nếu chú thích vẫn bảo lưu thành ngữ Hê-bơ-rơ và tính bất định của nó.
