    rationale: “Giữa hai buổi chiều/tối” với dấu gạch chéo không phải lối diễn đạt tự nhiên; thành ngữ בֵּין הָעַרְבָּיִם còn có phạm vi thời gian được tranh luận, nên chú thích cần bảo lưu điều này.
