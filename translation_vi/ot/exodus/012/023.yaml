    issue: Ngắt câu sau “Ai Cập”
    rationale: Mệnh đề “Khi thấy máu...” tiếp tục chuỗi hành động tương lai của cùng chủ ngữ. Dấu chấm phẩy tạo một câu hoàn chỉnh, mạch lạc hơn trong tiếng Việt, đồng thời vẫn giữ lực giải thích của “Vì.”
  - severity: low
    issue: Lặp lại “Yahweh” làm chủ ngữ ở vế thứ hai
    rationale: Có thể dùng “Ngài” để tránh lặp danh riêng trong một câu dài; ngữ cảnh không mơ hồ vì chỉ Yahweh là chủ ngữ của động từ “thấy” và “vượt qua.”
