  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: vi
  text: Vì Yahweh sẽ đi qua để đánh phạt Ai Cập; khi Ngài thấy máu trên thanh ngang và hai cột cửa, Yahweh sẽ vượt qua cửa ấy[a], không cho kẻ hủy diệt[b] vào nhà anh em để đánh phạt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tha” hoặc “che chở”; động từ Hê-bơ-rơ này là từ gắn với lễ Vượt Qua.
    reason: lexical_alternative
  - marker: b
    text: Bản Hê-bơ-rơ không nói rõ “kẻ hủy diệt” là ai; một số người hiểu đây là một tác nhân thiên sứ thi hành sự phán xét.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: וְעָבַר
  choice: sẽ đi qua
  rationale: Diễn tả Yahweh đi qua xứ để thi hành sự phán xét, đồng thời phân biệt với động từ פסח ở vế sau.
- source_word: לִנְגֹּף
  choice: để đánh phạt
  rationale: Truyền đạt hành động giáng đòn phán xét chết người bằng cách nói tự nhiên, trang trọng; cùng một cách dịch được giữ ở cả hai lần xuất hiện.
- source_word: הַמַּשְׁקוֹף
  choice: thanh ngang
  rationale: Chỉ bộ phận nằm ngang phía trên khung cửa; cách gọi dễ hiểu hơn thuật ngữ kiến trúc chuyên biệt.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: hai cột cửa
  rationale: Chỉ hai phần thẳng đứng ở hai bên khung cửa.
- source_word: וּפָסַח
  choice: sẽ vượt qua
  rationale: Giữ mối liên hệ từ vựng với lễ Vượt Qua và hình ảnh Yahweh không để tai họa vào nhà, nhưng không loại trừ sắc thái 'tha' hoặc 'che chở'.
- source_word: עַל הַפֶּתַח
  choice: cửa ấy
  rationale: Trong ngữ cảnh, từ này chỉ lối cửa vừa được mô tả; 'cửa ấy' tự nhiên trong tiếng Việt và tránh lặp dài.
- source_word: וְלֹא יִתֵּן
  choice: không cho
  rationale: נתן đi với động từ nguyên mẫu ở đây mang nghĩa cho phép; cách dịch này ngắn gọn và tự nhiên.
- source_word: הַמַּשְׁחִית
  choice: kẻ hủy diệt
  rationale: Giữ danh xưng chung cho tác nhân hủy diệt mà không tự ý xác định đó là một thiên sứ.
- source_word: בָּתֵּיכֶם
  choice: nhà anh em
  rationale: Diễn đạt đại từ ngôi thứ hai số nhiều bằng lối xưng hô cộng đồng tự nhiên trong văn mạch nói với dân Israel.
theological_decisions:
- issue: Mối quan hệ giữa Yahweh và 'kẻ hủy diệt'
  choice: 'Phân biệt Yahweh với ''kẻ hủy diệt'': Yahweh thi hành sự phán xét và không cho tác nhân hủy diệt vào các nhà của Israel.'
  alternative: Đồng nhất 'kẻ hủy diệt' với Yahweh, hoặc ghi rõ là 'thiên sứ hủy diệt'.
  rationale: Bản Hê-bơ-rơ dùng hai cách gọi riêng biệt nhưng không xác định bản thể hay danh tính của 'kẻ hủy diệt'; bản dịch giữ nguyên sự căng thẳng ấy.
- issue: Ý nghĩa của פסח
  choice: Dịch là 'vượt qua' trong chính văn.
  alternative: tha; che chở
  rationale: Cách dịch này duy trì mối liên hệ với tên lễ Vượt Qua, trong khi chú thích thừa nhận các sắc thái từ vựng khác và chính văn kế tiếp đã bày tỏ hành động bảo vệ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng câu ngắn, giữ sự lặp lại của 'đánh phạt' và không xác định quá mức danh tính của 'kẻ hủy diệt'. Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
