  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: vi
  text: Khi anh em vào miền đất mà Yahweh sẽ ban cho anh em, đúng như Ngài đã hứa,[a] anh em phải tuân giữ nghi lễ này.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đúng như Ngài đã phán.” Nguyên văn là “đúng như Ngài đã nói/phán”; trong ngữ cảnh, lời ấy mang ý nghĩa một lời hứa đã được ban trước đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “việc phụng sự này” hoặc “việc tuân giữ này.” Từ Hê-bơ-rơ ở đây chỉ việc thực hành nghi thức Vượt Qua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Khi
  rationale: Công thức diễn ngôn này mở đầu một hoàn cảnh trong tương lai. “Khi” truyền đạt tự nhiên ý thời gian mà không giữ lối diễn đạt Hê-bơ-rơ một cách cứng nhắc.
- source_word: תָבֹאוּ
  choice: anh em vào
  rationale: Động từ בוא có nghĩa là “đến, đi vào”. Với אֶל־הָאָרֶץ, “vào miền đất” là cách nói tự nhiên trong tiếng Việt; “anh em” thể hiện ngôi thứ hai số nhiều.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Trong bối cảnh lời hứa ban đất, “miền đất” vừa dễ hiểu vừa giữ được sắc thái về vùng đất Yahweh sẽ ban cho dân.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: mà Yahweh sẽ ban cho anh em
  rationale: Dạng yiqtol của נתן chỉ hành động tương lai trong ngữ cảnh này. “Ban” phù hợp với việc Đức Chúa Trời trao đất, còn “cho anh em” giữ rõ đối tượng số nhiều.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Dùng dạng phiên âm phổ biến của danh giao ước, thay vì thay thế bằng một tước hiệu.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: đúng như Ngài đã hứa
  rationale: דבר theo nghĩa đen là “phán/nói”, nhưng trong ngữ cảnh ban đất, lời đã phán mang tính lời hứa. Bản dịch chính truyền đạt lực ngữ cảnh; chú thích giữ nghĩa sát chữ.
- source_word: וּשְׁמַרְתֶּם
  choice: anh em phải tuân giữ
  rationale: שׁמר với một quy định nghi lễ có nghĩa là giữ hoặc tuân hành. “Phải tuân giữ” diễn đạt rõ nghĩa vụ trong câu mà không thêm một mức độ cưỡng chế ngoài văn bản.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: nghi lễ này
  rationale: עֲבֹדָה cơ bản là “công việc/sự phục vụ”, nhưng tại đây chỉ việc thực hành nghi thức Vượt Qua. “Nghi lễ” rõ nghĩa đối với độc giả hiện đại; các sắc thái sát chữ hơn được nêu trong chú thích.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Văn bản dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” giúp phân biệt danh riêng này với các tước hiệu và không áp đặt cách thay thế của một truyền thống giáo phái.
- issue: Sắc thái của כַּאֲשֶׁר דִּבֵּר
  choice: đúng như Ngài đã hứa
  alternative: đúng như Ngài đã phán
  rationale: Ngữ cảnh nói đến miền đất Yahweh sẽ ban, nên lời phán trước đó có lực của một lời hứa. Tuy vậy, vì động từ chỉ nói “phán/nói”, nghĩa sát chữ được giữ trong chú thích để không che khuất độ rộng của nguyên văn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. “Anh em” biểu thị lời nói với cộng đồng ở ngôi thứ hai số nhiều; “Ngài” quy chiếu về Yahweh. Cấu trúc câu được làm tự nhiên trong tiếng Việt nhưng vẫn giữ trình tự: vào đất, lời hứa ban đất, rồi nghĩa vụ tiếp tục cử hành nghi lễ.'
