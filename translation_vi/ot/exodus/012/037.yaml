base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: vi
  text: Con cháu Y-sơ-ra-ên khởi hành từ Ra-am-se đến Su-cốt, có khoảng sáu trăm nghìn người nam đi bộ[a], chưa kể trẻ em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “khoảng sáu trăm nghìn nam bộ hành.” Cụm Hê-bơ-rơ chỉ những người nam đi bộ; đây là nhóm được nêu trong con số.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ טַף có thể chỉ trẻ nhỏ hoặc những người phụ thuộc còn nhỏ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: khởi hành
  rationale: Động từ נסע trong ngữ cảnh di chuyển thường chỉ việc nhổ trại và bắt đầu hành trình; “khởi hành” tự nhiên và giữ được sắc thái ấy.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: con cháu Y-sơ-ra-ên
  rationale: Giữ hình ảnh quan hệ huyết thống của cụm Hê-bơ-rơ theo cách trang trọng, dễ hiểu trong tiếng Việt; trong ngữ cảnh, cụm này chỉ dân Y-sơ-ra-ên.
- source_word: מֵרַעְמְסֵס
  choice: từ Ra-am-se
  rationale: Giới từ מן diễn tả điểm xuất phát; “Ra-am-se” là dạng phiên âm tiếng Việt dễ đọc của địa danh.
- source_word: סֻכֹּתָה
  choice: đến Su-cốt
  rationale: Hậu tố chỉ hướng trên địa danh biểu thị chuyển động về phía Su-cốt, nên dịch tự nhiên là “đến Su-cốt”.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: khoảng sáu trăm nghìn
  rationale: Tiền tố כ־ trước con số cho thấy tính xấp xỉ, vì vậy “khoảng” phù hợp hơn một con số tuyệt đối chính xác.
- source_word: רַגְלִי הַגְּבָרִים
  choice: người nam đi bộ
  rationale: רַגְלִי diễn tả người đi bằng chân, còn הַגְּבָרִים xác định họ là nam giới; cách dịch này giữ cả hai yếu tố mà vẫn rõ nghĩa.
- source_word: לְבַד מִטָּף
  choice: chưa kể trẻ em
  rationale: Cụm này loại טף—trẻ nhỏ hoặc những người phụ thuộc còn nhỏ—ra khỏi con số đã nêu; “chưa kể trẻ em” là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của con số sáu trăm nghìn
  choice: Gắn con số với người nam đi bộ và nói rõ trẻ em không được kể vào đó
  alternative: Hiểu con số là tổng số toàn dân
  rationale: Cú pháp Hê-bơ-rơ đặt con số với רַגְלִי הַגְּבָרִים và theo sau bằng לְבַד מִטָּף, nên không nên mở rộng con số thành tổng dân số.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “con cháu Y-sơ-ra-ên” để bảo lưu sắc thái gia tộc của nguyên văn nhưng tránh cách nói cổ khó hiểu; các địa danh được phiên âm theo lối quen thuộc trong tiếng Việt.
