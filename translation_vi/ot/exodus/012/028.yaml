- from: Rồi con cháu Israel đi và làm như vậy. Họ làm đúng như Đức Giê-hô-va đã truyền cho Môi-se và A-rôn.
  to: Rồi con cháu Y-sơ-ra-ên đi và làm như vậy; đúng như Yahweh đã truyền cho Môi-se và A-rôn, họ đã làm như thế.
  rationale: Sửa danh riêng יהוה thành «Yahweh» theo hồ sơ POB. Cấu trúc câu được điều chỉnh tối thiểu để giữ cả hành động «đi và làm» ban đầu lẫn mệnh đề kết tái khẳng định rằng họ làm đúng theo điều Yahweh đã truyền. Không thêm mục đích hay đối tượng cho động từ «đi».
