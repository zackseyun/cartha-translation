    rationale: '«Họ làm đúng như ... đã truyền» truyền ý chung, nhưng bản sửa giữ rõ hơn nhịp đối ứng: «đúng như ... , họ đã làm như thế».'
  revised_text: Rồi con cháu Y-sơ-ra-ên đi và làm như vậy; đúng như Yahweh đã truyền cho Môi-se và A-rôn, họ đã làm như thế.
