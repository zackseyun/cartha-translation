    issue: Danh יהוה được dịch là «Đức Giê-hô-va» thay vì «Yahweh».
    rationale: Hồ sơ nguồn xác định Yahweh là cách dịch bắt buộc của danh יהוה; «Giê-hô-va» là một cách đọc thay thế, không phải hình thức đã chọn cho dự án.
  - severity: low
