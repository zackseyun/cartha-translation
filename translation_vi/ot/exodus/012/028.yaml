source:
  edition: WLC
  text: וַ/יֵּלְכ֥וּ וַ/יַּֽעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: vi
  text: Rồi con cháu Y-sơ-ra-ên đi và làm như vậy; đúng như Yahweh đã truyền cho Môi-se và A-rôn, họ đã làm như thế.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: đi
  rationale: Động từ הלך ở dạng kể chuyện tiếp nối diễn tiến; “đi” giữ nguyên ý mà không thêm địa điểm hay mục đích vốn chỉ được suy ra từ ngữ cảnh.
- source_word: וַיַּעֲשׂוּ
  choice: làm như vậy
  rationale: Động từ עשה quy chiếu về các chỉ dẫn trước đó; “làm như vậy” tự nhiên trong tiếng Việt và giữ được lực hồi chỉ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  rationale: Cụm từ theo nghĩa đen là “các con trai của Israel”, nhưng trong văn cảnh chỉ cộng đồng hậu duệ Israel. “Con cháu Israel” vừa giữ hình ảnh gia tộc vừa tự nhiên và không khiến độc giả hiểu rằng chỉ nam giới thực hiện.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Cách dịch này diễn đạt sự tương ứng chính xác giữa mệnh lệnh và việc thi hành.
- source_word: צִוָּה
  choice: đã truyền
  rationale: “Đã truyền” phù hợp văn phong Kinh Thánh hiện đại và cho thấy mệnh lệnh có trước hành động của dân Israel.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng hình thức danh riêng quen thuộc trong tiếng Việt để biểu thị trực tiếp Tứ Tự Danh, thay vì thay bằng tước hiệu “CHÚA”.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: cho Môi-se và A-rôn
  rationale: אֶת đánh dấu Môi-se và A-rôn là đối tượng trực tiếp của hành động truyền lệnh; cấu trúc tiếng Việt tự nhiên là “truyền cho”.
- source_word: כֵּן עָשׂוּ
  choice: Họ làm đúng như vậy
  rationale: Mệnh đề lặp lại nhấn mạnh sự vâng theo trọn vẹn; đưa “đúng” vào diễn đạt lực nhấn mạnh của cấu trúc đối ứng כַּאֲשֶׁר...כֵּן.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản văn dùng danh riêng יהוה. “Đức Giê-hô-va” là dạng danh riêng đã quen thuộc với độc giả Việt, tránh thay danh bằng một tước hiệu; “Yahweh” gần cách phục dựng học thuật hơn nhưng còn kém tự nhiên trong tiếng Việt phổ thông.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  alternative: các con trai Israel; dân Israel
  rationale: Trong thành ngữ dân tộc-gia tộc này, dạng giống đực ngữ pháp có thể chỉ toàn thể cộng đồng. “Con cháu Israel” giữ liên hệ huyết thống trong nguyên ngữ mà không thu hẹp không có căn cứ thành chỉ nam giới.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Giữ cả hai động từ “đi” và “làm”, đồng thời giữ mệnh đề kết thúc lặp lại để phản ánh nhịp nhấn mạnh của tiếng Hê-bơ-rơ. Không cần chú thích vì các lựa chọn chính có thể được diễn đạt rõ ngay trong chính văn.
