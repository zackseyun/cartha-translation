revisions:
- from: Nếu một gia đình quá ít người để dùng hết một con vật[a], thì chủ nhà cùng người hàng xóm gần nhà mình nhất sẽ lấy một con, tùy theo số người. Các ngươi phải tính số người chung một con vật theo sức ăn của mỗi người.[b]
  to: Nếu một hộ quá ít người cho một con gia súc nhỏ[a], thì người ấy và người hàng xóm ở gần nhà mình nhất phải lấy một con, tùy theo số người; mỗi người tùy theo sức ăn của mình, các ngươi phải tính số người cho con vật đó.[b]
  rationale: 'Sửa các chỗ diễn giải thêm để bám sát nguyên văn: thay “chủ nhà” bằng “người ấy,” thay “con vật” bằng “con gia súc nhỏ,” và bỏ các ý “dùng hết/chung.” Câu cuối nêu rõ tân ngữ ngầm “số người” nhằm diễn đạt tự nhiên trong tiếng Việt mà vẫn phản ánh động từ “tính/ước tính” đối với con vật tế lễ.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:15:18Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng mạch ý chung, nhưng “chủ nhà” không có trong tiếng Hê-bơ-rơ và có thể thu hẹp/chuyển nghĩa của הוּא (“người ấy”). “Con vật” cũng quá rộng đối với שֶׂה, vốn chỉ gia súc nhỏ (chiên hoặc dê). “Dùng hết” và “chung” là những diễn giải thêm không cần thiết.
  naturalness: Câu sửa vẫn dùng tiếng Việt hiện đại, rõ ràng và trang trọng. “Hộ” diễn đạt tự nhiên đơn vị household; “người hàng xóm ở gần nhà mình nhất” giữ được quan hệ không gian trong nguyên văn.
  terminology: Dùng “gia súc nhỏ” cho שֶׂה và chú thích rõ có thể là chiên hoặc dê. “Số người” cho נְפָשׁוֹת và “sức ăn” cho לְפִי אָכְלוֹ là phù hợp. Giữ “các ngươi” cho mệnh lệnh số nhiều.
  issues:
  - severity: medium
    issue: “chủ nhà” thêm một vai trò không được nêu trong nguyên văn.
    rationale: הוּא chỉ “người ấy”; trong ngữ cảnh có thể quy chiếu người đại diện của hộ, nhưng không xác định người này là chủ nhà.
  - severity: medium
    issue: “con vật” quá bao quát cho שֶׂה.
    rationale: שֶׂה là một con gia súc nhỏ, thuộc chiên hoặc dê; “con vật” có thể bao gồm mọi loại động vật.
  - severity: low
    issue: “để dùng hết” và “chung” diễn giải vượt quá cách nói của câu.
    rationale: Nguyên văn nói hộ quá ít người “cho” một con vật và bảo tính theo số người/sức ăn; không trực tiếp nói “dùng hết” hay “chung”.
  revised_text: Nếu một hộ quá ít người cho một con gia súc nhỏ[a], thì người ấy và người hàng xóm ở gần nhà mình nhất phải lấy một con, tùy theo số người; mỗi người tùy theo sức ăn của mình, các ngươi phải tính số người cho con vật đó.[b]
