base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: vi
  text: Nếu một hộ quá ít người cho một con gia súc nhỏ[a], thì người ấy và người hàng xóm ở gần nhà mình nhất phải lấy một con, tùy theo số người; mỗi người tùy theo sức ăn của mình, các ngươi phải tính số người cho con vật đó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ שֶׂה chỉ một con gia súc nhỏ, có thể là chiên hoặc dê (xem câu 5).
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc dịch sát hơn: “Mỗi người tùy theo lượng mình ăn, các ngươi hãy tính cho con vật đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: một gia đình quá ít người để dùng hết một con vật
  rationale: הַבַּיִת chỉ hộ gia đình; cấu trúc יִמְעַט...מִהְיֹת diễn tả hộ có quá ít người so với một con vật dùng cho bữa ăn. Thêm 'để dùng hết' làm rõ quan hệ ngữ cảnh mà không đổi ý.
- source_word: שֶׂה
  choice: con vật
  rationale: Từ này chỉ một con gia súc nhỏ thuộc chiên hoặc dê, chứ không nhất thiết là chiên con. Cách dịch trong câu chính tránh thu hẹp nghĩa; chú thích nêu rõ phạm vi.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: chủ nhà cùng người hàng xóm gần nhà mình nhất sẽ lấy một con
  rationale: Đại từ הוּא quy chiếu người đứng đầu hộ trong chỉ dẫn trước; 'chủ nhà' tự nhiên hơn một đại từ mơ hồ trong tiếng Việt. Tân ngữ 'một con' được hiểu từ ngữ cảnh.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: tùy theo số người
  rationale: מִכְסָה nói đến số lượng được tính, còn נְפָשׁוֹת ở đây là những người tham dự, không phải các linh hồn tách khỏi thân thể.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: theo sức ăn của mỗi người
  rationale: 'Cụm này mang nghĩa phân phối: mỗi người được tính tùy lượng mình ăn. ''Sức ăn'' tự nhiên, ngắn gọn và giữ yếu tố khả năng tiêu thụ.'
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: Các ngươi phải tính số người chung một con vật
  rationale: Động từ hiếm này trong ngữ cảnh chỉ việc tính hoặc phân định số người tham dự đối với một con vật. Cách diễn đạt làm sáng rõ phép tính nhưng không quyết định chi tiết ngoài văn bản.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'các ngươi' để thể hiện ngôi thứ hai số nhiều trong mệnh lệnh; dùng 'gia đình/chủ nhà' thay cho 'nhà/người ấy' nhằm truyền đạt đơn vị hộ gia đình tự nhiên trong tiếng Việt.
