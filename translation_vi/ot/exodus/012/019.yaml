  source_fidelity: Bản dịch truyền đạt đúng cấu trúc pháp lệnh, thời hạn bảy ngày, sự phân biệt giữa men (שְׂאֹר) và vật/thức ăn có men (מַחְמֶצֶת), cùng phạm vi áp dụng cho người ngoại kiều cư trú lẫn người bản xứ. Tuy nhiên, “bị loại” diễn giải thành ngữ וְנִכְרְתָה rõ hơn nguyên văn cho phép; nên giữ thành ngữ “bị cắt khỏi” để không quyết định bản chất hình phạt.
