source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: vi
  text: Trong bảy ngày, không được có men[a] trong các nhà anh em, vì bất cứ ai ăn thứ gì có men thì người ấy sẽ bị cắt khỏi cộng đồng Israel[b], dù là người ngoại kiều cư trú[c] hay người bản xứ trong xứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Men” ở đây là chất dùng để làm cho bột lên men.
    reason: lexical_clarification
  - marker: b
    text: Cũng có thể dịch là “hội chúng Israel.” Cụm từ “sẽ bị cắt khỏi” không nói rõ hình phạt là bị trục xuất, chết hay chịu sự phán xét của Đức Chúa Trời.
    reason: lexical_and_theological_alternative
  - marker: c
    text: Hay “người nước ngoài cư trú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Trong bảy ngày
  rationale: Diễn đạt khoảng thời gian kéo dài, tự nhiên trong tiếng Việt và sát chức năng của cụm từ Hê-bơ-rơ.
- source_word: שְׂאֹר
  choice: men
  rationale: Chỉ tác nhân gây lên men, không phải toàn bộ thức ăn có men; “men” là cách gọi rõ ràng và quen thuộc trong ngữ cảnh này.
- source_word: לֹא יִמָּצֵא
  choice: không được để ... trong
  rationale: 'Thể bị động Hê-bơ-rơ diễn tả tình trạng bị nghiêm cấm: men không được hiện diện trong nhà. Cách nói tiếng Việt này tự nhiên mà vẫn giữ lực pháp lệnh.'
- source_word: בְּבָתֵּיכֶם
  choice: trong nhà anh em
  rationale: Giữ nghĩa số nhiều mang tính tập thể của “các nhà của anh em”, đồng thời tránh lối diễn đạt nặng nề.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do cho lệnh cấm.
- source_word: כָּל אֹכֵל
  choice: bất cứ ai ăn
  rationale: Truyền đạt đúng ý nghĩa khái quát và phạm vi bao quát của cấu trúc phân từ với כָּל.
- source_word: מַחְמֶצֶת
  choice: vật gì có men
  rationale: Không thu hẹp nghĩa vào bánh; từ Hê-bơ-rơ bao gồm thứ đã được làm cho lên men.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: người ấy sẽ bị loại
  rationale: נֶפֶשׁ ở đây chỉ con người; “bị loại” giữ hình ảnh chế tài giao ước mà không quyết định đó là trục xuất, tử hình hay sự phán xét của Đức Chúa Trời.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: khỏi cộng đồng Israel
  rationale: עֵדָה chỉ cộng đồng hay hội chúng Israel; “cộng đồng” là từ hiện đại, dễ hiểu và vẫn giữ ý nghĩa tập thể.
- source_word: בַּגֵּר
  choice: ngoại kiều cư trú
  rationale: Chỉ người không phải bản xứ nhưng đang cư trú giữa Israel; cách dịch này phân biệt với khách vãng lai và tránh hàm ý miệt thị.
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: người bản xứ trong xứ
  rationale: Giữ sự tương phản xã hội với ngoại kiều cư trú mà không đưa vào khái niệm quốc tịch hiện đại.
theological_decisions:
- issue: Ý nghĩa của hình phạt giao ước וְנִכְרְתָה (“sẽ bị cắt khỏi/bị loại khỏi”)
  choice: người ấy sẽ bị loại khỏi cộng đồng Israel
  alternative: người ấy sẽ bị xử tử; người ấy sẽ bị trục xuất khỏi cộng đồng
  rationale: Thành ngữ Hê-bơ-rơ có sức nặng của một chế tài giao ước, nhưng bản văn không nói rõ cách thi hành. Bản dịch giữ sự mơ hồ thật của nguyên văn thay vì xác định quá mức.
translation_notes:
  register: Văn phong pháp lệnh trang trọng nhưng hiện đại, dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều tập thể; dùng “Israel” theo dạng tên riêng thông dụng. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau từ hoặc cụm từ liên quan.
