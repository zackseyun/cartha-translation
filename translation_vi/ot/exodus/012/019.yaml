  to: Trong bảy ngày, không được có men[a] trong các nhà anh em, vì bất cứ ai ăn thứ gì có men thì người ấy sẽ bị cắt khỏi cộng đồng Israel[b], dù là người ngoại kiều cư trú[c] hay người bản xứ trong xứ.
