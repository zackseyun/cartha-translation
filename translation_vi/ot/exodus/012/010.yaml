  terminology: “Để lại,” “còn lại,” và “thiêu” nhất quán với trường nghĩa của יתר và שׂרף. Cách nói “bất cứ phần nào của nó” làm rõ phạm vi của phủ định mà không thay đổi nghĩa. Chú thích được neo sau “đến sáng” và nêu một cách diễn đạt thay thế hợp lệ cho mệnh đề thứ nhất.
