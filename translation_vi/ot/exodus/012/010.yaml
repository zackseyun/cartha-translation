  source_fidelity: 'Bản dịch giữ đúng hai mệnh lệnh trong tiếng Hê-bơ-rơ: không để bất cứ phần nào còn lại đến sáng, và thiêu bằng lửa phần còn lại vào lúc sáng. “Anh em không được” và “phải” truyền đạt thích đáng lực mệnh lệnh của các động từ số nhiều. “Dùng lửa thiêu đi” phản ánh đúng בָּאֵשׁ và תִּשְׂרֹפוּ, không thêm diễn giải nghi lễ.'
