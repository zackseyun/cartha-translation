source:
  edition: WLC
  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: vi
  text: Anh em không được để lại bất cứ phần nào của nó cho đến sáng[a]; phần nào của nó còn lại đến sáng thì phải dùng lửa thiêu đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được để phần nào của nó còn thừa lại đến sáng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: để lại
  rationale: Thể Hiphil của יתר ở đây có nghĩa là để cho còn lại. “Để lại” tự nhiên trong tiếng Việt và phù hợp với lời cấm giữ phần thịt lễ Vượt Qua qua đêm.
- source_word: מִמֶּנּוּ
  choice: phần nào của nó
  rationale: Giới từ מן kèm đại từ hậu tố chỉ một phần lấy từ toàn thể. Trong mệnh đề phủ định, “bất cứ phần nào của nó” diễn đạt rõ ý không được để sót lại phần nào.
- source_word: עַד בֹּקֶר
  choice: đến sáng
  rationale: Cụm từ xác định giới hạn thời gian. “Đến sáng” là cách nói tự nhiên, không thêm ý nghĩa quá mức.
- source_word: הַנֹּתָר
  choice: phần nào ... còn lại
  rationale: Phân từ Niphal của יתר chỉ phần còn sót lại. Cách diễn đạt này vừa rõ nghĩa vừa giữ liên hệ từ vựng với mệnh đề trước.
- source_word: בָּאֵשׁ
  choice: dùng lửa
  rationale: Giới từ ב với “lửa” biểu thị phương tiện; “dùng lửa” là cách diễn đạt tự nhiên trong tiếng Việt với động từ “thiêu”.
- source_word: תִּשְׂרֹפוּ
  choice: phải ... thiêu đi
  rationale: Thể chưa hoàn thành trong ngữ cảnh luật lệ mang lực mệnh lệnh. “Phải” giữ tính bắt buộc, còn “thiêu đi” diễn đạt việc tiêu hủy hoàn toàn phần còn lại.
theological_decisions:
- issue: Tính chất của mệnh lệnh về phần thịt lễ Vượt Qua còn lại
  choice: Một lời cấm trực tiếp, tiếp theo là mệnh lệnh bắt buộc phải tiêu hủy phần còn lại
  alternative: Chỉ là chỉ dẫn thực tế, không mang tính luật lệ
  rationale: 'Cấu trúc câu Hê-bơ-rơ nêu hai chỉ thị nghi lễ có tính bắt buộc: không để lại đến sáng và phải thiêu phần còn lại. Bản dịch không thêm ý nghĩa biểu tượng mà câu này không nói đến.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho chủ thể số nhiều thay vì đại từ cổ “các ngươi”; giữ sự lặp lại của “đến sáng” và hai mệnh lệnh nối tiếp trong nguyên văn.
