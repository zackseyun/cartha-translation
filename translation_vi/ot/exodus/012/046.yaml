base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: vi
  text: Phải ăn trong một nhà; không được đem bất cứ phần thịt nào từ trong nhà ra ngoài, và không được làm gãy xương nào của con vật ấy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một hộ gia đình.” Từ Hê-bơ-rơ có thể chỉ ngôi nhà vật chất hoặc những người trong hộ gia đình tụ họp tại đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: trong cùng một nhà
  rationale: בַּיִת có thể chỉ ngôi nhà hoặc hộ gia đình. Ngữ cảnh đối lập với việc đem thịt ra ngoài nghiêng về nghĩa không gian cụ thể; “cùng một nhà” cũng diễn đạt tự nhiên rằng bữa ăn phải được giữ trong một địa điểm duy nhất.
- source_word: יֵאָכֵל
  choice: phải ăn
  rationale: Dạng Niphal bất toàn mang chức năng chỉ thị pháp quy. Tiếng Việt khó giữ thể bị động mà vẫn tự nhiên; “phải ăn” truyền đạt rõ tính bắt buộc mà không thêm chủ thể.
- source_word: לֹא תוֹצִיא
  choice: không được đem
  rationale: Dạng Hiphil của יצא có nghĩa là làm cho đi ra, đem ra. “Không được đem” là cách diễn đạt tự nhiên, giữ nguyên lực cấm đoán.
- source_word: מִן הַבַּיִת ... חוּצָה
  choice: ra ngoài nhà
  rationale: חוּצָה chỉ hướng chuyển động ra phía ngoài; “ra ngoài nhà” thể hiện cả điểm xuất phát lẫn hướng đi.
- source_word: מִן הַבָּשָׂר
  choice: chút thịt nào
  rationale: Trong ngữ cảnh thực phẩm, בָּשָׂר là “thịt”; מִן có tính phân lượng. Trong câu phủ định, “chút thịt nào” tự nhiên và nhấn mạnh rằng không phần thịt nào được đem ra.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: và không được làm gãy một chiếc xương nào của con vật đó
  rationale: 'Danh từ số ít עֶצֶם mang ý phân phối: không một xương nào được làm gãy. “Của con vật đó” làm rõ đại từ giống đực số ít בוֹ quy về con vật Vượt Qua đang được nói đến, nhưng không gọi cụ thể là chiên khi câu này không nêu danh từ ấy.'
theological_decisions:
- issue: Đối tượng mà đại từ בוֹ ở cuối câu quy chiếu
  choice: con vật Vượt Qua đang được nói đến, diễn đạt là “con vật đó”
  alternative: con chiên
  rationale: Đại từ giống đực số ít quy về lễ vật Vượt Qua trong mạch văn. “Con vật đó” giữ được đối tượng gần nhất mà không đưa danh từ cụ thể “chiên” vào chính câu này.
translation_notes:
  register: Văn phong pháp quy trang trọng nhưng hiện đại. Dùng “phải” và “không được” để truyền đạt lực chỉ thị/cấm đoán tự nhiên trong tiếng Việt; tránh cấu trúc bị động gượng ép. Dấu chấm phẩy giữ hai quy định chính liên kết chặt chẽ.
