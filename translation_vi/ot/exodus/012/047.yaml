base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: vi
  text: Toàn thể hội chúng Ít-ra-ên phải cử hành lễ ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Toàn thể cộng đồng Ít-ra-ên phải thực hiện điều ấy.”'
    reason: Nêu cách dịch sát hơn với nghĩa khái quát của עֲדַת và יַעֲשׂוּ אֹתוֹ; bản chính diễn đạt rõ đối tượng của đại từ theo ngữ cảnh lễ Vượt Qua.
lexical_decisions:
- source_word: כָּל
  choice: Toàn thể
  rationale: Diễn đạt tính toàn thể của cộng đồng một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: עֲדַת
  choice: cộng đồng
  rationale: Chỉ cộng đồng giao ước được nhìn như một tập thể; từ này tự nhiên, dễ hiểu và không giới hạn nghĩa vào một buổi hội họp cụ thể.
- source_word: יִשְׂרָאֵל
  choice: Ít-ra-ên
  rationale: Giữ tên riêng theo lối phiên âm tiếng Việt thông dụng.
- source_word: יַעֲשׂוּ
  choice: phải thực hiện
  rationale: Động từ עשה có nghĩa rộng là “làm, thực hiện”; trong ngữ cảnh quy định về lễ Vượt Qua, cách dịch này truyền đạt mệnh lệnh mà không diễn giải quá mức thành “cử hành” hay “tuân giữ”.
- source_word: אֹתוֹ
  choice: điều ấy
  rationale: Giữ đại từ chỉ đối tượng đã được nhắc đến, không xác định quá mức rằng đó là nghi lễ hay con chiên.
theological_decisions:
- issue: Chủ thể tập thể trong mệnh lệnh về lễ Vượt Qua
  choice: “Toàn thể cộng đồng Ít-ra-ên” được truyền phải thực hiện điều ấy với tư cách một cộng đồng.
  alternative: Mỗi cá nhân người Ít-ra-ên đều phải thực hiện điều ấy.
  rationale: Danh từ tập thể עֵדָה cùng tên dân tộc chỉ toàn thể cộng đồng giao ước, không nhất thiết nhấn mạnh từng cá nhân riêng lẻ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Phải” thể hiện lực mệnh lệnh của dạng vị hoàn trong văn bản luật; “điều ấy” duy trì sự không xác định hoàn toàn của đại từ Hê-bơ-rơ.
