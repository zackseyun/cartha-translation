id: EXO.12.11
reference: Exodus 12:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: vi
  text: 'Các ngươi phải ăn nó như thế này: thắt đai quanh lưng[a], chân mang dép, tay cầm gậy. Các ngươi phải ăn vội vàng; ấy là lễ Vượt Qua của Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “hông các ngươi đã thắt lại”—một cách nói chỉ việc thu gọn y phục và sẵn sàng lên đường ngay.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ấy là lễ Vượt Qua dâng lên Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  choice: như thế này
  rationale: Diễn đạt tự nhiên cách thức bữa ăn phải được tiến hành, đồng thời giữ sắc thái chỉ dẫn của tiếng Hê-bơ-rơ.
- source_word: תֹּאכְלוּ / וַאֲכַלְתֶּם
  choice: các ngươi phải ăn
  rationale: Trong ngữ cảnh mệnh lệnh pháp quy, cách dịch này thể hiện rõ lực bắt buộc của các dạng động từ ngôi thứ hai số nhiều.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: lưng thắt đai
  rationale: Giữ hình ảnh cụ thể về việc thu gọn y phục để sẵn sàng lên đường, nhưng tránh lối nói cổ và khó hiểu.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: chân mang dép
  rationale: נַעַל chỉ loại dép/giày dép trong bối cảnh cổ đại; “dép” vừa chính xác lịch sử vừa tự nhiên trong tiếng Việt.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: tay cầm gậy
  rationale: Diễn đạt gọn và tự nhiên tư thế của người đã chuẩn bị lên đường; מַקֵּל là gậy dùng khi đi đường.
- source_word: בְּחִפָּזוֹן
  choice: vội vàng
  rationale: Truyền đạt sự khẩn cấp và trạng thái sẵn sàng rời đi ngay, không thêm ý nghĩa vượt quá văn bản.
- source_word: פֶּסַח
  choice: lễ Vượt Qua
  rationale: Cách gọi đã quen thuộc trong tiếng Việt, ở đây chỉ nghi lễ/bữa ăn được truyền lập.
- source_word: הוּא לַיהוָה
  choice: ấy là lễ Vượt Qua của Đức Giê-hô-va
  rationale: Giữ quan hệ rộng của giới từ לְ, ở đây có thể biểu thị sự thuộc về hoặc dành cho YHWH; chú thích nêu cách hiểu thay thế.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc và trang trọng trong tiếng Việt để thể hiện trực tiếp Danh YHWH, thay vì thay bằng tước hiệu “CHÚA”.
theological_decisions:
- issue: Cách dịch Danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Văn bản dùng trực tiếp Danh riêng YHWH. “Đức Giê-hô-va” là dạng tên riêng đã quen thuộc trong tiếng Việt và tránh thay Danh bằng một tước hiệu.
- issue: Quan hệ trong cụm פֶּסַח הוּא לַיהוָה
  choice: ấy là lễ Vượt Qua của Đức Giê-hô-va
  alternative: ấy là lễ Vượt Qua dâng lên Đức Giê-hô-va
  rationale: Giới từ לְ có thể gợi sự thuộc về hoặc hướng đến/dành cho. Bản chính giữ cách diễn đạt cô đọng và tự nhiên; chú thích bảo tồn khả năng hiểu là lễ dành cho Ngài.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ lời truyền trực tiếp cho toàn cộng đồng trong bối cảnh luật lệ; cấu trúc ngắn, dồn dập phản ánh tư thế sẵn sàng và tính khẩn cấp của câu Hê-bơ-rơ.
