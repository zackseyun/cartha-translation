- from: 'Các ngươi phải ăn nó như thế này: lưng thắt đai[a], chân mang dép, tay cầm gậy. Các ngươi phải ăn vội vàng; ấy là lễ Vượt Qua của Đức Giê-hô-va.[b]'
  to: 'Các ngươi phải ăn nó như thế này: thắt đai quanh lưng[a], chân mang dép, tay cầm gậy. Các ngươi phải ăn vội vàng; ấy là lễ Vượt Qua của Yahweh.[b]'
  rationale: Bản sửa chỉ thay phiên âm Danh YHWH để phù hợp chuẩn POB và làm sáng rõ thành ngữ về việc thắt lưng chuẩn bị lên đường. Chú thích b duy trì khả năng hiểu giới từ לְ là “dành cho/dâng lên”, trong khi bản chính giữ quan hệ thuộc về bằng “của”.
  reviewer_model: gpt-5.6-terra
