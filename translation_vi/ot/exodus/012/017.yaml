base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: vi
  text: Anh em phải giữ lễ Bánh Không Men[a], vì chính ngày này Ta đã đưa các đoàn ngũ của anh em ra khỏi đất Ai Cập[b]. Anh em phải giữ ngày này qua các thế hệ như một quy định vĩnh viễn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “bánh không men” hoặc “những vật không men”; cách gọi này cũng có thể chỉ toàn bộ lễ Bánh Không Men.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các đoàn quân”, “các đội” hoặc “đám đông của anh em”. Từ Hê-bơ-rơ mô tả dân Y-sơ-ra-ên như một tập thể có tổ chức khi ra khỏi Ai Cập.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “một quy định đời đời” hoặc “một quy định lâu dài”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: phải giữ
  rationale: Trong bối cảnh nghi lễ, שׁמר mang nghĩa tuân giữ/cử hành. “Phải giữ” vừa tự nhiên trong tiếng Việt, vừa duy trì sự lặp lại của động từ ở hai vế.
- source_word: הַמַּצּוֹת
  choice: lễ Bánh Không Men
  rationale: Danh từ theo nghĩa đen chỉ bánh hoặc những vật không men, nhưng trong ngữ cảnh này được dùng để chỉ việc cử hành lễ. Thêm “lễ” giúp câu tiếng Việt rõ và tự nhiên, còn chú thích bảo lưu nghĩa đen.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: chính trong ngày này
  rationale: Cách diễn đạt này giữ được sắc thái nhấn mạnh về đúng ngày ấy của thành ngữ Hê-bơ-rơ.
- source_word: הוֹצֵאתִי
  choice: Ta đã đưa ... ra
  rationale: Thể Hiphil của יצא diễn tả hành động khiến hoặc đưa ai ra khỏi một nơi; cách dịch này tự nhiên và sát nghĩa.
- source_word: צִבְאוֹתֵיכֶם
  choice: các đoàn quân của anh em
  rationale: צָבָא có thể chỉ quân đội, đạo quân hoặc đoàn ngũ có tổ chức. “Các đoàn quân” giữ được hình ảnh dân Y-sơ-ra-ên ra đi thành những đoàn ngũ, thay vì làm phẳng thành “đám đông”.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua các thế hệ
  rationale: Diễn đạt nghĩa việc tuân giữ tiếp diễn trong các thế hệ kế tiếp bằng tiếng Việt hiện đại, gọn và rõ.
- source_word: חֻקַּת עוֹלָם
  choice: một quy định lâu dài
  rationale: חֻקָּה là điều lệ hay quy định đã được ấn định; עוֹלָם nhấn mạnh tính bền vững, kéo dài. “Lâu dài” tránh áp đặt một cách hiểu triết học tuyệt đối cho thành ngữ.
theological_decisions:
- issue: הַמַּצּוֹת chỉ bánh không men hay toàn bộ lễ nghi
  choice: Dịch trong chính văn là “lễ Bánh Không Men”.
  alternative: “bánh không men” hoặc “những bánh không men”.
  rationale: Trong mệnh lệnh “giữ” và trong mạch văn về ngày kỷ niệm, từ này được dùng theo phép hoán dụ cho lễ nghi. Chú thích vẫn nêu nghĩa đen để bảo lưu độ rộng ngữ nghĩa của nguyên văn.
- issue: Phạm vi thời gian của חֻקַּת עוֹלָם
  choice: Dịch là “một quy định lâu dài”.
  alternative: “một quy định đời đời” hoặc “một quy định vĩnh viễn”.
  rationale: Cách dịch truyền đạt nghĩa vụ bền vững qua các thế hệ mà không tự ý giải quyết câu hỏi thần học về phạm vi tuyệt đối của עוֹלָם.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Trời và “anh em” cho ngôi thứ hai số nhiều. Giữ hai lần “phải giữ” để phản ánh phép lặp của nguyên văn; dùng “đất Ai Cập” theo lối diễn đạt Kinh Thánh quen thuộc nhưng vẫn tự nhiên.
