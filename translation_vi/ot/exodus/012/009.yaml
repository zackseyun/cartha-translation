revisions:
- from: Đừng ăn thịt nó khi còn sống hoặc đã luộc trong nước, nhưng chỉ được ăn thịt nướng trên lửa, cả đầu cùng với chân và bộ lòng.
  to: Đừng ăn nó sống hoặc luộc trong nước; phải nướng trên lửa, cả đầu, chân và bộ lòng[a].
  rationale: Sửa nghĩa “raw” từ “khi còn sống” thành “sống”, và thay cách diễn đạt tập trung vào hành vi ăn bằng mệnh lệnh nướng của nguyên văn. Giữ đầy đủ đầu, chân và phần bên trong; thêm chú thích để phản ánh cách nối các bộ phận sát với tiếng Hê-bơ-rơ và vệt kiểm tra tiếng Anh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:14:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa “khi còn sống”: trong ngữ cảnh ẩm thực, נָא nghĩa là “sống/tái, chưa chín”, không phải con vật vẫn còn sống. Bản sửa giữ đối lập giữa ăn sống, luộc trong nước và nướng bằng lửa; đồng thời diễn đạt mệnh lệnh chế biến trực tiếp như tiếng Hê-bơ-rơ.'
  naturalness: “Đừng ăn nó sống hoặc luộc trong nước; phải nướng trên lửa” là tiếng Việt hiện đại, tự nhiên và tránh sự hiểu lầm của “khi còn sống”. “Bộ lòng” phù hợp ngữ cảnh ẩm thực và dễ hiểu.
  terminology: “Nướng trên lửa” phản ánh צְלִי־אֵשׁ. “Bộ lòng” chuyển tải קִרְבּוֹ trong danh sách các phần của con vật; chú thích nêu thứ tự/cấu trúc sát chữ mà không áp đặt diễn giải.
  issues:
  - severity: medium
    issue: “khi còn sống” dịch נָא không chính xác trong ngữ cảnh này.
    rationale: Cụm này trong tiếng Việt thường nói đến một sinh vật chưa chết; từ Hê-bơ-rơ chỉ thịt sống/chưa chín. Cần dùng “sống” theo nghĩa ẩm thực, không thêm “khi còn”.
  - severity: low
    issue: “chỉ được ăn thịt nướng” làm nhẹ cấu trúc mệnh lệnh về cách chế biến.
    rationale: Nguyên văn đối lập các phương pháp chuẩn bị và yêu cầu nướng bằng lửa. “Phải nướng trên lửa” phản ánh trực tiếp hơn.
  revised_text: Đừng ăn nó sống hoặc luộc trong nước; phải nướng trên lửa, cả đầu, chân và bộ lòng[a].
