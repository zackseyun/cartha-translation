base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: vi
  text: Đừng ăn nó sống hoặc luộc trong nước; phải nướng trên lửa, cả đầu, chân và bộ lòng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa: “đầu nó với chân nó và với bộ lòng nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: khi còn sống
  rationale: Trong ngữ cảnh chế biến thịt, từ này chỉ thịt chưa được làm chín; cách nói này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: hoặc đã luộc trong nước
  rationale: Cấu trúc nhấn mạnh việc làm chín bằng nước; “luộc trong nước” giữ đúng phương thức bị cấm và phù hợp cách diễn đạt tiếng Việt.
- source_word: כִּי אִם
  choice: nhưng chỉ được
  rationale: 'Cụm từ biểu thị sự đối lập và giới hạn mạnh: không được chế biến theo các cách vừa nêu mà chỉ theo cách sau.'
- source_word: צְלִי אֵשׁ
  choice: thịt nướng trên lửa
  rationale: Diễn đạt tự nhiên phương thức nướng bằng lửa, đồng thời giữ sự đối lập với ăn sống và luộc.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: cả đầu cùng với chân và bộ lòng
  rationale: Giữ đủ các bộ phận được liệt kê và truyền đạt ý con vật được nướng cùng các phần ấy; “bộ lòng” là cách nói hiện đại, dễ hiểu cho קֶרֶב trong ngữ cảnh này.
- source_word: מִמֶּנּוּ
  choice: thịt nó
  rationale: Đại từ có nghĩa phân phần, theo sát văn cảnh trước đó nói về con vật; thêm “thịt” giúp câu tiếng Việt tự nhiên mà không đổi đối tượng quy chiếu.
