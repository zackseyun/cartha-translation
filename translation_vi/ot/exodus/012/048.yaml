    rationale: Cụm này có thể dùng được, nhưng thể bị động “được kể” thêm sắc thái đánh giá/phân loại không biểu hiện trực tiếp trong וְהָיָה כְּאֶזְרַח. “Sẽ như người bản xứ” sát hơn mà vẫn tự nhiên.
