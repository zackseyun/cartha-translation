  - severity: medium
    issue: “ăn lễ vật ấy”
    rationale: בּוֹ quy chiếu về lễ Vượt Qua và việc dự phần trong đó, không xác định riêng là “lễ vật”. Cách này có thể làm câu hẹp nghĩa hơn bản gốc.
  - severity: low
