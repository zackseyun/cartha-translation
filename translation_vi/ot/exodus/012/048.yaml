  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: vi
  text: Nếu một ngoại kiều cư ngụ cùng ngươi muốn cử hành lễ Vượt Qua kính Yahweh, thì mọi người nam thuộc về người ấy phải chịu cắt bì. Sau đó người ấy mới được đến dự để cử hành lễ ấy, và sẽ như người bản xứ trong xứ. Nhưng bất cứ ai chưa chịu cắt bì đều không được ăn phần lễ ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֵּר
  choice: ngoại kiều
  rationale: Chỉ một người không phải dân bản xứ nhưng cư ngụ lâu dài giữa Israel; “ngoại kiều” giữ được sắc thái pháp lý-xã hội, không gợi một khách qua đường.
- source_word: יָגוּר אִתְּךָ
  choice: cư ngụ với ngươi
  rationale: Diễn đạt việc sống giữa cộng đồng trong một thời gian, phù hợp với động từ גור và văn phong luật pháp trang trọng.
- source_word: וְעָשָׂה פֶסַח לַיהוָה
  choice: cử hành lễ Vượt Qua dâng lên Yahweh
  rationale: עָשָׂה פֶסַח là cách nói nghi lễ, tự nhiên nhất trong tiếng Việt là “cử hành lễ Vượt Qua”; לַיהוָה biểu thị sự quy hướng/dâng lễ cho Yahweh.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: mọi người nam thuộc về người ấy phải chịu cắt bì
  rationale: Kết cấu nhấn mạnh yêu cầu bắt buộc áp dụng cho toàn thể nam giới thuộc gia đình hay nhóm của ngoại kiều ấy.
- source_word: וְאָז יִקְרַב
  choice: Sau đó, người ấy mới được đến gần
  rationale: קרב ở đây hàm ý được phép đến tham dự nghi lễ sau khi điều kiện đã được đáp ứng; “mới được” làm rõ quan hệ điều kiện mà không thêm ý muốn vào bản văn.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: được kể như người bản xứ trong đất
  rationale: אֶזְרַח chỉ thành viên bản xứ của cộng đồng; “được kể như” thể hiện địa vị tương ứng trong quy định này mà không khẳng định vượt quá phạm vi câu.
- source_word: עָרֵל
  choice: người nam nào chưa chịu cắt bì
  rationale: Tính từ giống đực số ít nêu nguyên tắc chung; trong mạch văn trực tiếp nói đến mọi người nam, cách dịch này minh bạch và tránh gây hiểu nhầm rằng phụ nữ cũng chịu nghi thức cắt bì.
- source_word: לֹא יֹאכַל בּוֹ
  choice: đều không được ăn lễ vật ấy
  rationale: Phủ định diễn tả sự cấm đoán hoặc không đủ tư cách dự phần; בּוֹ quy chiếu về lễ Vượt Qua, ở đây là phần được ăn trong nghi lễ.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ ghi trực tiếp danh giao ước YHWH; dùng “Yahweh” bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Tư cách dự lễ Vượt Qua của ngoại kiều
  choice: Ngoại kiều được dự lễ sau khi mọi người nam thuộc về mình chịu cắt bì, và trong việc này được kể như người bản xứ.
  alternative: Hiểu câu như sự loại trừ hoàn toàn theo sắc tộc, hoặc như việc xóa bỏ mọi dấu hiệu ranh giới giao ước.
  rationale: Bản văn vừa mở đường cho người không phải bản xứ tham dự, vừa đặt điều kiện giao ước rõ ràng. Bản dịch giữ nguyên cả sự bao gồm lẫn điều kiện, không đưa các hệ thống thần học về sau vào câu.
- issue: Phạm vi của cụm “như người bản xứ trong đất”
  choice: Giữ phép so sánh về địa vị trong ngữ cảnh quy định lễ Vượt Qua.
  alternative: Diễn giải thành sự đồng nhất tuyệt đối về mọi phương diện pháp lý và xã hội.
  rationale: Câu xác nhận người ấy sẽ như người bản xứ nhưng không tự xác định toàn bộ phạm vi pháp lý; bản dịch tránh mở rộng điều bản văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, phù hợp một điều luật giao ước. Dùng “ngươi” để giữ lối xưng hô số ít của bản Hê-bơ-rơ và sắc thái Kinh Thánh; dùng “ngoại kiều” theo nghĩa người nước ngoài cư trú, không phải khách tạm trú. Không thêm “muốn” vì động từ Hê-bơ-rơ nói trực tiếp đến việc cử hành lễ.
