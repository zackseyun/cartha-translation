revisions:
- from: Nếu có một ngoại kiều cư ngụ với ngươi và cử hành lễ Vượt Qua dâng lên Yahweh, thì mọi người nam thuộc về người ấy phải chịu cắt bì. Sau đó, người ấy mới được đến gần để cử hành lễ; người ấy sẽ được kể như người bản xứ trong đất. Nhưng bất cứ người nam nào chưa chịu cắt bì đều không được ăn lễ vật ấy.
  to: Nếu một ngoại kiều cư ngụ cùng ngươi muốn cử hành lễ Vượt Qua kính Yahweh, thì mọi người nam thuộc về người ấy phải chịu cắt bì. Sau đó người ấy mới được đến dự để cử hành lễ ấy, và sẽ như người bản xứ trong xứ. Nhưng bất cứ ai chưa chịu cắt bì đều không được ăn phần lễ ấy.
  rationale: 'Điều chỉnh các chỗ có nguy cơ thu hẹp hoặc chuyển nghĩa nghi lễ: thay “dâng lên” bằng “kính” để diễn đạt quan hệ của lễ với Yahweh mà không biến lễ thành một của lễ; thay “lễ vật ấy” bằng “phần lễ ấy” để giữ quy chiếu rộng tới việc dự phần lễ Vượt Qua; và dùng “sẽ như” để phản ánh trực tiếp phép so sánh trong tiếng Hê-bơ-rơ. “Muốn” được giữ như cách diễn đạt tự nhiên của mệnh đề điều kiện có tham vọng cử hành lễ, không làm thay đổi điều kiện pháp lý của câu.'
  reviewer_model: gpt-5.6-terra
