base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: vi
  text: Đức Giê-hô-va khiến dân chúng được người Ai Cập quý mến, nên họ cho dân chúng những gì dân chúng đã xin[a]. Dân chúng đã tước đoạt Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo cách truyền thống: “nên họ cho dân chúng vay.” Động từ Hê-bơ-rơ ở đây có thể được hiểu là cho vay hoặc là ban cho điều người ta xin.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: Đức Giê-hô-va
  rationale: Chuyển danh riêng giao ước יהוה bằng dạng quen thuộc, trang trọng trong tiếng Việt, thay vì đồng nhất với tước hiệu “Chúa”.
- source_word: נָתַן אֶת חֵן הָעָם בְּעֵינֵי מִצְרַיִם
  choice: khiến dân chúng được người Ai Cập quý mến
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ “ban ân huệ của dân trong mắt người Ai Cập,” với nghĩa Đức Chúa Trời tạo cho dân một thiện cảm thuận lợi.
- source_word: וַיַּשְׁאִלוּם
  choice: họ cho dân chúng những gì đã xin
  rationale: Trong ngữ cảnh này, dạng Hiphil của שאל chỉ việc người Ai Cập đáp ứng điều dân chúng xin; cách dịch tránh mặc nhiên biến sự việc thành một khoản vay phải hoàn trả, đồng thời ghi nhận cách hiểu ấy trong chú thích.
- source_word: וַיְנַצְּלוּ
  choice: lấy của cải
  rationale: Piel của נצל có sức nghĩa “tước lấy, lấy chiến lợi phẩm.” Cụm này rõ ràng, tự nhiên với độc giả phổ thông và vẫn truyền đạt việc Ai Cập bị lấy đi tài sản.
- source_word: אֶת מִצְרָיִם
  choice: của Ai Cập
  rationale: Giữ Ai Cập làm đối tượng tập thể, đồng thời diễn đạt tự nhiên trong tiếng Việt với động từ đã chọn.
theological_decisions:
- issue: וַיַּשְׁאִלוּם nên được hiểu là cho theo lời xin hay cho vay
  choice: họ cho dân chúng những gì đã xin
  alternative: họ cho dân chúng vay
  rationale: Ngữ cảnh nhấn mạnh thiện cảm khiến người Ai Cập đáp ứng yêu cầu của dân Israel và kết quả là Ai Cập bị tước lấy của cải. Tuy vậy, nghĩa truyền thống “cho vay” vẫn khả dĩ về mặt từ vựng nên được giữ trong chú thích.
- issue: Mức độ mạnh của וַיְנַצְּלוּ
  choice: lấy của cải của Ai Cập
  alternative: cướp bóc Ai Cập
  rationale: Bản dịch chính tránh gợi cảnh bạo lực trực tiếp không được câu này mô tả, nhưng vẫn giữ ý Ai Cập bị tước mất tài sản; “cướp bóc” là một cách dịch sát sức mạnh từ vựng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dân chúng” để quy chiếu dân Israel theo ngữ cảnh, “người Ai Cập” cho chủ thể số nhiều, và đặt dấu chú thích ngay sau mệnh đề có cách hiểu khác.
