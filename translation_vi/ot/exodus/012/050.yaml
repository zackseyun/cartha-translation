  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: vi
  text: Tất cả con cái Y-sơ-ra-ên[a] đã làm theo điều Yahweh[b] truyền cho Môi-se và A-rôn; họ đã làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; cách gọi này cũng có thể dịch là “con cháu Y-sơ-ra-ên” hoặc “dân Y-sơ-ra-ên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: YHWH, theo truyền thống thường được dịch là “ĐỨC CHÚA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... עָשׂוּ
  choice: đã làm ... đã làm
  rationale: Động từ עשה được lặp lại trong nguyên văn để nhấn mạnh sự vâng phục; bản dịch giữ nguyên sự lặp lại thay vì lược bỏ.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: toàn thể con cái Israel
  rationale: כָּל diễn tả toàn bộ cộng đồng, còn בְּנֵי יִשְׂרָאֵל theo sát nghĩa là “con cái Israel,” một cách gọi toàn dân theo quan hệ dòng dõi.
- source_word: כַּאֲשֶׁר
  choice: đúng như
  rationale: Cụm từ diễn tả sự tương ứng với mệnh lệnh; “đúng như” vừa tự nhiên trong tiếng Việt vừa thể hiện sắc thái làm theo chính xác.
- source_word: צִוָּה
  choice: truyền cho
  rationale: Trong ngữ cảnh mệnh lệnh của Đức Chúa Trời, “truyền cho” là cách diễn đạt trang trọng, tự nhiên và xác định Môi-se cùng A-rôn là những người nhận lệnh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng bốn phụ âm YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: כֵּן
  choice: như vậy
  rationale: כֵּן nhắc lại sự tương ứng với mệnh lệnh vừa nêu; “như vậy” bảo tồn câu kết nhấn mạnh của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Cách chuyển dịch danh giao ước יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Đức Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Phiên âm “Yahweh” bảo tồn tính chất danh riêng và không biến nó thành tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel / người Israel
  rationale: Cách dịch này giữ hình ảnh gia tộc của nguyên văn mà vẫn có thể chỉ toàn thể cộng đồng, không giới hạn phát biểu chỉ cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc lặp “đã làm ... đã làm” của nguyên văn để bảo tồn điểm nhấn về sự vâng phục; dùng các dạng tên quen thuộc trong tiếng Việt là Môi-se và A-rôn.
