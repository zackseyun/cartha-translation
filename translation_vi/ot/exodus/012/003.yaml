source:
  edition: WLC
  text: דַּבְּר֗וּ אֶֽל כָּל עֲדַ֤ת יִשְׂרָאֵל֙ לֵ/אמֹ֔ר בֶּ/עָשֹׂ֖ר לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/יִקְח֣וּ לָ/הֶ֗ם אִ֛ישׁ שֶׂ֥ה לְ/בֵית אָבֹ֖ת שֶׂ֥ה לַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: vi
  text: 'Hãy nói với toàn thể hội chúng Y-sơ-ra-ên rằng: ‘Vào ngày mồng mười tháng này, mỗi người hãy lấy cho mình một con chiên[a] theo nhà tổ phụ mình, mỗi gia đình một con.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שֶׂה có thể chỉ một con vật trong đàn, thuộc loài chiên hoặc dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Hãy nói
  rationale: Động từ mệnh lệnh số nhiều trực tiếp truyền lệnh cho Môi-se và A-rôn nói với dân; “hãy nói” tự nhiên và vẫn giữ rõ sắc thái mệnh lệnh.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: toàn thể hội chúng Y-sơ-ra-ên
  rationale: עֵדָה chỉ cộng đồng Y-sơ-ra-ên được nhìn như một tập thể có tổ chức. “Hội chúng” giữ sắc thái trang trọng và tính tập thể rõ hơn “cộng đồng”.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Đây là công thức dẫn lời. Trong tiếng Việt hiện đại, “rằng” dẫn nội dung phát ngôn tự nhiên hơn việc dịch sát thành “mà nói”.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: Vào ngày mồng mười tháng này
  rationale: Nguyên văn là “vào [ngày] thứ mười của tháng này”; thêm “ngày” và dùng “mồng mười” tạo cách nói ngày tháng rõ ràng, tự nhiên trong tiếng Việt.
- source_word: וְיִקְחוּ לָהֶם
  choice: mỗi người hãy bắt lấy cho mình
  rationale: Dạng động từ mang lực chỉ thị trong ngữ cảnh truyền lệnh. “Bắt lấy” phù hợp với việc lấy một con vật từ đàn, còn “cho mình” giữ thành phần לָהֶם; số nhiều được diễn đạt theo lối phân phối nhờ “mỗi người”.
- source_word: אִישׁ
  choice: mỗi người
  rationale: 'אִישׁ ở đây có chức năng phân phối: từng người đại diện cho đơn vị gia đình phải thực hiện lệnh. “Mỗi người” tự nhiên trong tiếng Việt và không biến câu thành lời buộc mọi cá nhân nam trong mỗi nhà đều phải lấy riêng một con.'
- source_word: שֶׂה
  choice: một con chiên
  rationale: שֶׂה có thể chỉ một con vật nhỏ thuộc đàn chiên hoặc dê. “Con chiên” phù hợp với cách gọi quen thuộc trong ngữ cảnh lễ Vượt Qua, nhưng phạm vi rộng hơn của từ Hê-bơ-rơ được ghi ở chú thích.
- source_word: לְבֵית אָבֹת
  choice: theo nhà tổ phụ mình
  rationale: Cụm này chỉ đơn vị thân tộc theo dòng cha, rộng hơn một hộ gia đình riêng lẻ. “Nhà tổ phụ” giữ được cơ cấu xã hội của nguyên văn; “mình” làm rõ quan hệ với từng người được nhắc đến.
- source_word: שֶׂה לַבָּיִת
  choice: mỗi gia đình một con
  rationale: בַּיִת ở đây là hộ gia đình chứ không phải tòa nhà. Lối diễn đạt phân phối “mỗi gia đình một con” ngắn gọn, tự nhiên và bảo toàn ý một con vật cho một hộ.
theological_decisions:
- issue: Phạm vi của שֶׂה trong quy định lễ Vượt Qua
  choice: Dịch “con chiên” và chú thích rằng từ Hê-bơ-rơ cũng có thể chỉ dê.
  alternative: Dịch ngay trong câu là “một con chiên hoặc dê” hay “một con vật trong đàn”.
  rationale: Nguyên ngữ không tự giới hạn ở cừu, và Xuất Ai Cập 12:5 xác nhận có thể lấy từ chiên hoặc dê. Tuy nhiên, “con chiên” là cách gọi ngắn gọn, quen thuộc trong mạch lễ Vượt Qua; chú thích ngăn việc biến cách dịch quen dùng thành một giới hạn thần học không có trong từ gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ thuật ngữ tập thể “hội chúng” và thành ngữ xã hội “nhà tổ phụ”, đồng thời dùng cấu trúc Việt tự nhiên “mỗi gia đình một con”. Dấu chú thích [a] được đặt ngay sau từ mà chú thích giải thích.
