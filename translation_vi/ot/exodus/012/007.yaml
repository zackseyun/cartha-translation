  verdict: approve
  source_fidelity: 'Bản dịch giữ đúng trình tự chỉ thị của tiếng Hê-bơ-rơ: lấy một phần huyết, bôi lên hai thanh dọc và thanh ngang phía trên của khung cửa, thuộc các nhà là nơi họ sẽ ăn con vật ấy. “Một ít huyết” phản ánh đúng sắc thái phân lượng của מִן; “bôi” phù hợp ngữ cảnh nghi lễ của נתן mà không thêm phương thức thực hiện. “Con vật ấy” duy trì quy chiếu của đại từ đối với con vật đã được nói đến trong ngữ cảnh trước, không áp đặt loài cụ thể trong câu này.'
