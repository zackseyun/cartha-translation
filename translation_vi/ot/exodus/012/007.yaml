  terminology: “Huyết” thích hợp với văn cảnh nghi lễ và nhất quán với văn phong Kinh Thánh trang trọng vừa phải. Các cách gọi bộ phận khung cửa là từ phổ thông, chính xác về chức năng. Chú thích [a] được gắn đúng tại mệnh đề có dạng chưa hoàn thành Hê-bơ-rơ; chú thích bảo lưu cách hiểu hiện tại hoặc tương lai mà không quyết định quá mức.
