  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: vi
  text: Họ phải lấy một ít huyết và bôi lên hai thanh dọc cùng thanh ngang phía trên khung cửa của những nhà nơi họ sẽ ăn con vật ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi họ ăn con vật ấy.” Dạng động từ Hê-bơ-rơ ở đây có thể mang sắc thái hiện tại trong lời chỉ dẫn hoặc sắc thái tương lai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Họ phải lấy
  rationale: Trong chuỗi chỉ thị này, động từ mang sắc thái mệnh lệnh/hướng đến hành động sắp thực hiện. “Phải lấy” tự nhiên trong tiếng Việt và giữ giọng chỉ dẫn bắt buộc.
- source_word: מִן הַדָּם
  choice: một ít huyết
  rationale: 'Giới từ מִן có nghĩa phân lượng ở đây: lấy một phần huyết, không phải toàn bộ. “Một ít huyết” diễn đạt rõ ý ấy.'
- source_word: וְנָתְנוּ
  choice: và bôi
  rationale: נתן có nghĩa rộng là đặt/để. Trong ngữ cảnh dùng huyết đánh dấu khung cửa, “bôi” là cách diễn đạt cụ thể, tự nhiên, nhưng không xác định thêm dụng cụ hay phương pháp.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: lên hai thanh dọc ... khung cửa
  rationale: מְזוּזוֹת chỉ hai bộ phận thẳng đứng ở hai bên cửa. Cách diễn đạt này chính xác và dễ hiểu hơn thuật ngữ kiến trúc ít thông dụng.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: cùng thanh ngang phía trên khung cửa
  rationale: מַשְׁקוֹף chỉ bộ phận nằm ngang trên cùng của cửa; cụm từ mô tả này rõ nghĩa đối với độc giả phổ thông.
- source_word: עַל הַבָּתִּים
  choice: của những nhà
  rationale: Ở đây cụm giới từ xác định các khung cửa thuộc những căn nhà được đánh dấu; tiếng Việt diễn đạt quan hệ này tự nhiên bằng “của những nhà”.
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: nơi họ sẽ ăn con vật ấy
  rationale: Mệnh đề quan hệ bổ nghĩa cho “những nhà.” Dạng chưa hoàn thành יֹאכְלוּ phù hợp với sắc thái tương lai trong chỉ thị; đại từ אֹתוֹ được dịch là “con vật ấy” để có sở chỉ tự nhiên trong tiếng Việt mà không đưa thêm loài vật vào câu này.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “huyết” để duy trì sắc thái nghi lễ; mô tả các bộ phận khung cửa bằng từ ngữ phổ thông. Đại từ số nhiều “họ” phản ánh chủ thể số nhiều trong nguyên bản.
