base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: vi
  text: Họ nướng bột nhào đã mang ra khỏi Ai Cập thành những chiếc bánh không men, vì bột chưa lên men. Họ đã bị đuổi khỏi Ai Cập nên không thể chậm trễ, cũng chưa chuẩn bị lương thực cho mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: Họ nướng
  rationale: Động từ kể chuyện được chuyển tự nhiên sang tiếng Việt; liên từ mở đầu không cần biểu đạt trong một câu đứng riêng.
- source_word: הַבָּצֵק
  choice: số bột nhào
  rationale: בָּצֵק chỉ khối bột đã nhào; “số bột nhào” vừa rõ nghĩa vừa tự nhiên trong mạch kể.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: đã mang ra khỏi Ai Cập
  rationale: Mệnh đề quan hệ xác định số bột; cách diễn đạt này giữ quan hệ thời gian và hướng rời khỏi Ai Cập.
- source_word: עֻגֹת מַצּוֹת
  choice: những chiếc bánh không men
  rationale: עֻגֹת là những bánh hoặc ổ bánh nhỏ, còn מַצּוֹת xác định đó là bánh không men; cách dịch tránh gợi nghĩa bánh ngọt.
- source_word: כִּי לֹא חָמֵץ
  choice: vì bột chưa lên men
  rationale: Động từ חָמֵץ diễn tả bột đi vào trạng thái có men/lên men; “chưa lên men” giữ sắc thái trạng thái chưa xảy ra và tự nhiên trong tiếng Việt.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: Họ đã bị đuổi khỏi Ai Cập nên
  rationale: Dạng bị động diễn tả việc bị buộc phải rời đi; “nên” làm rõ quan hệ nguyên nhân trực tiếp với việc không thể trì hoãn.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: không thể chậm trễ
  rationale: הִתְמַהְמֵהַּ có nghĩa trì hoãn hoặc nấn ná; “không thể chậm trễ” là cách nói hiện đại và phù hợp với tình thế cấp bách.
- source_word: וְגַם צֵדָה לֹא עָשׂוּ לָהֶם
  choice: cũng chưa chuẩn bị lương thực cho mình
  rationale: צֵדָה là lương thực hoặc đồ dự trữ dùng khi đi đường; “lương thực” súc tích, còn “cho mình” thể hiện đại từ לָהֶם.
