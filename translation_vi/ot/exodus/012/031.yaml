  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: vi
  text: 'Trong đêm ấy, Pha-ra-ôn cho gọi Môi-se và A-rôn đến và nói: “Hãy đứng dậy, ra khỏi giữa dân ta, cả các ngươi lẫn dân Y-sơ-ra-ên[a]! Hãy đi phụng sự Yahweh[b] như các ngươi đã nói.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “con cái Y-sơ-ra-ên.”'
    reason: Giữ cho độc giả thấy thành ngữ huyết thống của nguyên văn, trong khi chính văn dùng cách nói tự nhiên hơn trong tiếng Việt.
  - marker: b
    text: “Yahweh” là danh riêng của Đức Chúa Trời, được viết bằng bốn phụ âm YHWH trong tiếng Hê-bơ-rơ; nhiều bản dịch truyền thống dùng “ĐỨC CHÚA.”
    reason: Giải thích việc chuyển tự danh Đức Chúa Trời và nêu cách dịch truyền thống mà không thay thế danh riêng trong chính văn.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: cho gọi ... đến
  rationale: Trong ngữ cảnh này, động từ קרא chỉ việc Pha-ra-ôn khẩn cấp sai gọi Môi-se và A-rôn trong đêm. “Cho gọi ... đến” tự nhiên trong tiếng Việt và diễn đạt rõ một lời triệu gọi.
- source_word: לַיְלָה
  choice: ngay trong đêm ấy
  rationale: Từ này làm trạng ngữ chỉ thời gian. “Trong đêm ấy” giữ đúng thời điểm; “ngay” truyền đạt tính khẩn cấp của mạch kể mà không thay đổi nội dung căn bản.
- source_word: קוּמוּ צְּאוּ
  choice: hãy đứng dậy, ra khỏi
  rationale: Giữ chuỗi mệnh lệnh và sắc thái cấp bách. “Ra khỏi” bảo toàn ý nghĩa không gian của יצא thay vì chỉ diễn giải chung là “rời đi”.
- source_word: מִתּוֹךְ עַמִּי
  choice: khỏi giữa dân ta
  rationale: Bám sát nghĩa “từ giữa dân ta” nhưng vẫn rõ và tự nhiên trong lời nói tiếng Việt.
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: cả các ngươi lẫn dân Y-sơ-ra-ên
  rationale: Cấu trúc “cả ... lẫn ...” thể hiện hai lần גַּם và nhấn mạnh rằng cả Môi-se, A-rôn lẫn toàn dân đều phải đi. “Dân Y-sơ-ra-ên” là cách diễn đạt tự nhiên; nghĩa đen được ghi ở chú thích.
- source_word: וּלְכוּ
  choice: hãy đi
  rationale: Giữ mệnh lệnh riêng tiếp theo trong nguyên văn, không gộp nó vào mệnh lệnh “ra khỏi”.
- source_word: עִבְדוּ
  choice: phụng sự
  rationale: עבד khi có Đức Chúa Trời làm đối tượng có thể bao gồm cả phục vụ lẫn thờ phượng. “Phụng sự” giữ phạm vi nghĩa rộng hơn, tránh thu hẹp chỉ còn nghi lễ thờ phượng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng YHWH thay vì thay bằng một tước hiệu, qua đó giữ đặc tính danh giao ước trong nguyên văn.
- source_word: כְּדַבֶּרְכֶם
  choice: như các ngươi đã nói
  rationale: Diễn đạt tự nhiên sự nhượng bộ của Pha-ra-ôn theo đúng điều Môi-se và A-rôn trước đó đã yêu cầu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng danh YHWH. Giữ “Yahweh” bảo toàn tư cách danh riêng và không thay nó bằng tước hiệu; chú thích giúp độc giả nhận biết truyền thống dịch khác.
- issue: Phạm vi nghĩa của עבד khi hướng đến Yahweh
  choice: phụng sự
  alternative: thờ phượng
  rationale: Động từ có thể bao hàm cả sự phục vụ và thờ phượng. Chọn từ rộng hơn để không âm thầm thu hẹp sắc thái thần học và nghi lễ của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời Pha-ra-ôn dùng “các ngươi” để giữ giọng mệnh lệnh của một vua đối với Môi-se, A-rôn và dân chúng. Tên riêng theo dạng tiếng Việt quen dùng đối với Môi-se, A-rôn, Pha-ra-ôn và Y-sơ-ra-ên; riêng danh YHWH được chuyển tự là Yahweh.
