  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: vi
  text: Vì trong đêm này, Ta sẽ đi qua đất Ai Cập[a] và đánh mọi con đầu lòng trong đất Ai Cập, từ người cho đến súc vật[b]. Ta sẽ thi hành những phán quyết chống lại tất cả các thần của Ai Cập. Ta là Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi xuyên qua.” Động từ ở đây nói đến việc đi qua đất Ai Cập, không phải “vượt qua” theo nghĩa tha khỏi tai họa.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “từ người cho đến súc vật.”'
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hê-bơ-rơ là YHWH, thường được dịch là “CHÚA”; cũng được phiên âm là “Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: Ta sẽ đi khắp
  rationale: Động từ עבר với בְּאֶרֶץ chỉ việc đi xuyên qua hoặc đi khắp vùng đất; cách dịch này tránh gây nhầm với ý ‘vượt qua mà tha’ ở phần sau của chương.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: đất Ai Cập
  rationale: Giữ danh từ אֶרֶץ để thể hiện rõ phạm vi địa lý của hành động.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: đêm nay
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái chỉ định của ‘đêm này’.
- source_word: וְהִכֵּיתִי
  choice: đánh
  rationale: Thể hiện trực tiếp nghĩa của נכה mà không tự ý thêm ‘giết’; hậu quả chết chóc đã rõ trong văn cảnh.
- source_word: כָּל בְּכוֹר
  choice: mọi con đầu lòng
  rationale: Diễn đạt danh từ tập hợp số ít, không thêm ý ‘con trai’ vì tiếng Hê-bơ-rơ tại đây không nói rõ giới tính.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: từ người cho đến súc vật
  rationale: Giữ cấu trúc bao quát từ loài người đến loài vật; ‘súc vật’ phù hợp với בְּהֵמָה trong bối cảnh này.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: chống lại tất cả các thần của Ai Cập
  rationale: Giữ nghĩa thông thường của אֱלֹהִים là ‘các thần’ và sắc thái hành động thù nghịch do giới từ בְּ cùng thành ngữ xét xử tạo nên, không giản lược thành ‘thần tượng’.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: Ta sẽ thi hành những phán quyết
  rationale: Bảo toàn sắc thái tư pháp của שְׁפָטִים, đồng thời dùng một cách diễn đạt trang trọng và dễ hiểu trong tiếng Việt.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Phiên âm danh riêng giao ước יהוה thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản văn trực tiếp dùng Tứ Tự Danh. ‘Yahweh’ bảo toàn danh riêng giao ước mà không biến nó thành tước hiệu.
- issue: Địa vị của אֱלֹהֵי מִצְרַיִם
  choice: các thần của Ai Cập
  alternative: các thần tượng của Ai Cập; các thế lực thần linh của Ai Cập
  rationale: Tiếng Hê-bơ-rơ nói thẳng đến ‘các thần của Ai Cập’. Bản dịch giữ nguyên khẳng định thần học ấy, không quyết định thay bản văn rằng đây chỉ là tượng vật chất hay một ẩn dụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ ‘Ta’ phù hợp với lời phán trực tiếp của Đức Chúa Trời. Câu được chia tại chỗ chuyển từ việc đánh con đầu lòng sang phán xét các thần để tiếng Việt sáng rõ, nhưng vẫn giữ trình tự và quan hệ ý nghĩa của bản Hê-bơ-rơ.
