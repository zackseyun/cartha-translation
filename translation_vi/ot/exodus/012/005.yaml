  to: Con vật trong đàn của anh em phải không tì vết[a], là con đực một tuổi; anh em phải lấy nó từ bầy chiên hoặc bầy dê.
  rationale: 'Sửa để phản ánh sát hơn cấu trúc nguyên văn: yêu cầu về con vật được nêu trước, rồi mệnh đề cuối truyền lệnh phải lấy con vật ấy từ chiên hoặc dê. Giữ cách dịch rộng của שֶׂה và chú thích để không thu hẹp nghĩa chỉ còn “chiên con.”'
