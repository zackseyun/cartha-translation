  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: vi
  text: Con vật trong đàn của anh em phải không tì vết[a], là con đực một tuổi; anh em phải lấy nó từ bầy chiên hoặc bầy dê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ שֶׂה chỉ chung một con gia súc nhỏ trong đàn, có thể là chiên hoặc dê; mệnh đề sau nói rõ có thể lấy từ bầy chiên hoặc bầy dê.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: con vật trong đàn
  rationale: Danh từ này chỉ một con gia súc nhỏ thuộc đàn, có thể là cừu hoặc dê. Cách dịch rộng này giữ đúng phạm vi nghĩa và phù hợp với mệnh đề cuối câu.
- source_word: תָמִים
  choice: không tì vết
  rationale: Trong bối cảnh lễ tế, từ này chỉ con vật không có khuyết tật; “không tì vết” là cách diễn đạt trang trọng, rõ nghĩa trong tiếng Việt.
- source_word: זָכָר
  choice: con đực
  rationale: Chuyển tải trực tiếp và tự nhiên đặc điểm giới tính của con vật.
- source_word: בֶּן שָׁנָה
  choice: một tuổi
  rationale: Thành ngữ Hê-bơ-rơ, nghĩa đen là “con của một năm”, chỉ con vật một tuổi hoặc đang trong năm đầu đời; “một tuổi” là cách diễn đạt tự nhiên và giữ được nét khái quát của nguyên văn.
- source_word: יִהְיֶה לָכֶם
  choice: mà anh em chọn phải
  rationale: Diễn đạt yêu cầu bắt buộc áp dụng cho con vật của cộng đồng, đồng thời làm câu tiếng Việt tự nhiên.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: từ đàn cừu hoặc đàn dê
  rationale: 'Hai nhóm nguồn được phép lựa chọn mang ý nghĩa thay thế: con vật có thể thuộc đàn cừu hoặc đàn dê.'
- source_word: תִּקָּחוּ
  choice: anh em phải chọn nó
  rationale: Động từ ngôi thứ hai số nhiều mang lực chỉ thị; “phải chọn” thể hiện yêu cầu rõ hơn “có thể chọn”, còn “nó” được bổ sung theo con vật số ít đã nêu.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều hướng đến cộng đồng Y-sơ-ra-ên; tránh dùng riêng “chiên con” vì nguyên văn cho phép cả cừu lẫn dê.
