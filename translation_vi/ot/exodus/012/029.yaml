id: EXO.12.29
reference: Exodus 12:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: vi
  text: Vào lúc nửa đêm, Yahweh đánh chết mọi con đầu lòng trong đất Ai Cập, từ con đầu lòng của Pha-ra-ôn, người ngồi trên ngai mình, cho đến con đầu lòng của người bị giam trong ngục tối,[a] cùng mọi con đầu lòng của súc vật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con đầu lòng của người bị bắt, là người ở trong hầm ngục.”'
    reason: Nguyên ngữ שבי có thể là “người bị bắt, tù nhân,” còn בֵּית הַבּוֹר theo nghĩa đen gợi một nơi giam dạng hố hoặc hầm; chú thích giữ lại cách diễn đạt cụ thể hơn của tiếng Hê-bơ-rơ.
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: Vào lúc nửa đêm
  rationale: Cụm mở đầu đưa biến cố tiếp diễn trong mạch kể; tiếng Việt không cần dịch riêng וַיְהִי. “Vào lúc nửa đêm” diễn đạt tự nhiên thành ngữ chỉ giữa đêm.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: הִכָּה
  choice: đánh chết
  rationale: נכה có nghĩa là đánh, và trong ngữ cảnh tai họa này kết quả là cái chết. “Đánh chết” vừa giữ hình ảnh hành động vừa nói rõ kết quả.
- source_word: כָל בְּכוֹר
  choice: mọi con đầu lòng
  rationale: בכור chỉ con hoặc con vật sinh đầu tiên; “mọi con đầu lòng” tự nhiên và giữ sắc thái phân bố của כָל.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trong đất Ai Cập
  rationale: Giữ cách diễn đạt địa lý trang trọng của nguyên văn mà vẫn dễ hiểu trong tiếng Việt Kinh Thánh hiện đại.
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: từ con đầu lòng của Pha-ra-ôn ... cho đến con đầu lòng của người bị giam
  rationale: Giữ trực tiếp cấu trúc phạm vi מִן ... עַד, nhấn mạnh tai họa bao trùm từ địa vị cao nhất đến thấp nhất.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: người ngồi trên ngai mình
  rationale: Phân từ mô tả Pha-ra-ôn trong địa vị trị vì; cách dịch này giữ sự quy chiếu về chính Pha-ra-ôn và gần cấu trúc Hê-bơ-rơ.
- source_word: הַשְּׁבִי
  choice: người bị giam
  rationale: שבי có thể chỉ người bị bắt hoặc bị cầm tù. Trong bối cảnh ở בֵּית הַבּוֹר, “người bị giam” là tự nhiên mà không thu hẹp quá mức thành một loại tù nhân cụ thể.
- source_word: בְּבֵית הַבּוֹר
  choice: trong ngục tối
  rationale: Cụm từ theo nghĩa đen liên quan đến “nhà của hố”; trong bối cảnh giam giữ, nó chỉ nơi ngục sâu hoặc ngục tối. “Ngục tối” truyền đạt hình ảnh và chức năng tự nhiên trong tiếng Việt.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: cùng mọi con đầu lòng của súc vật
  rationale: בְּהֵמָה ở đây chỉ các loài vật nuôi nói chung. “Súc vật” là từ tập hợp chính xác và quen thuộc.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ tự YHWH. Phiên âm “Yahweh” bảo toàn tính chất tên riêng, không thay nó bằng tước hiệu.
- issue: Mức độ trực tiếp của hành động הִכָּה
  choice: Yahweh đánh chết
  alternative: Yahweh giết; Yahweh đánh
  rationale: Chủ thể và hành động được giữ trực tiếp như nguyên văn. “Đánh chết” bảo toàn hình ảnh của động từ đồng thời làm rõ hậu quả trong văn cảnh, không giảm nhẹ trách nhiệm tác nhân.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu văn rõ ràng với cấu trúc “từ ... cho đến ...”. Dùng “Pha-ra-ôn” theo dạng Việt hóa quen thuộc và giữ “Yahweh” là tên riêng. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
