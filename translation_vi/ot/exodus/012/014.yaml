revisions:
- from: Ngày này sẽ là ngày kỷ niệm cho các ngươi, và các ngươi phải cử hành ngày ấy như một lễ hội kính Yahweh. Qua mọi thế hệ, các ngươi phải cử hành ngày ấy như một quy định lâu dài.[a]
  to: Ngày này sẽ là một ngày tưởng niệm cho các ngươi, và các ngươi phải cử hành ngày ấy như một lễ hội dành cho Yahweh. Qua mọi thế hệ, các ngươi phải cử hành lễ ấy theo một quy định lâu dài.[a]
  rationale: Chỉnh nhẹ để tăng tính tự nhiên và minh bạch của quan hệ nghi lễ với Yahweh, đồng thời giữ nguyên cấu trúc mệnh lệnh lặp lại, tính tiếp diễn qua các thế hệ, và sự dè dặt cần thiết về thời lượng của עוֹלָם.
