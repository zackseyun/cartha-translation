  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: vi
  text: Ngày này sẽ là một ngày tưởng niệm cho các ngươi, và các ngươi phải cử hành ngày ấy như một lễ hội dành cho Yahweh. Qua mọi thế hệ, các ngươi phải cử hành lễ ấy theo một quy định lâu dài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một quy định đời đời” hoặc “một quy định vĩnh viễn.” Cụm từ Hê-bơ-rơ חֻקַּת עוֹלָם thường chỉ một quy định có hiệu lực bền lâu và liên tục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sẽ là
  rationale: Dạng hoàn thành Qal nối tiếp trong ngữ cảnh chỉ thị mang ý nghĩa tương lai/quy định.
- source_word: הַיּוֹם הַזֶּה
  choice: ngày này
  rationale: Chuyển tải trực tiếp cụm danh từ có chỉ định từ, tự nhiên trong tiếng Việt.
- source_word: לָכֶם לְזִכָּרוֹן
  choice: là ngày kỷ niệm cho các ngươi
  rationale: זִכָּרוֹן chỉ điều dùng để ghi nhớ hoặc tưởng niệm; cách diễn đạt này rõ nghĩa và phù hợp ngữ cảnh nghi lễ.
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: các ngươi phải cử hành ngày ấy như một lễ hội
  rationale: Động từ חגג và danh từ cùng gốc חַג diễn tả việc cử hành một lễ hội; tiếng Việt tránh lặp gượng nhưng vẫn giữ sắc thái nghi lễ.
- source_word: לַיהוָה
  choice: kính Yahweh
  rationale: Giới từ ל chỉ đối tượng mà lễ hội hướng đến và tôn kính; giữ nguyên danh giao ước Yahweh.
- source_word: לְדֹרֹתֵיכֶם
  choice: qua mọi thế hệ
  rationale: Thành ngữ nói đến sự tuân giữ tiếp nối trong các thế hệ của cộng đồng.
- source_word: חֻקַּת עוֹלָם
  choice: một quy định lâu dài
  rationale: חֻקָּה là quy định đã được ấn định, còn עוֹלָם trong luật giao ước thường nhấn mạnh hiệu lực bền lâu, tiếp diễn, không nhất thiết giải quyết câu hỏi về sự vô tận tuyệt đối.
- source_word: תְּחָגֻּהוּ
  choice: các ngươi phải cử hành ngày ấy
  rationale: Giữ sự lặp lại có tính nhấn mạnh của mệnh lệnh חגג và dùng cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự Danh; phiên âm Yahweh bảo tồn danh giao ước thay vì thay bằng một tước hiệu.
- issue: Phạm vi ý nghĩa của חֻקַּת עוֹלָם
  choice: một quy định lâu dài
  alternative: một quy định đời đời; một quy định vĩnh viễn
  rationale: Cách dịch đã chọn giữ sức nặng về sự tuân giữ bền vững qua các thế hệ, đồng thời không áp đặt kết luận siêu hình rằng עוֹלָם ở đây nhất thiết có nghĩa vô tận tuyệt đối.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ngươi” để phản ánh lời phán trực tiếp với cộng đồng số nhiều và duy trì sắc thái Kinh Thánh; dùng “cử hành” cho mệnh lệnh nghi lễ.
