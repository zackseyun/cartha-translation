review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng áp lực và tính khẩn trương, nhưng “đuổi họ ra” mạnh hơn שׁלח, vốn là “sai/cho đi, đưa ra ngoài” trong câu này. “Sắp chết cả rồi” diễn giải rõ ý sắp xảy đến và thêm sắc thái hoàn tất của “rồi”; nguyên văn dùng mệnh đề ngắn, giàu tính thành ngữ, nên nên giữ mở hơn.
  naturalness: Câu sửa vẫn tự nhiên trong tiếng Việt hiện đại, giữ nhịp kể khẩn trương. “Dân” ở đây chỉ dân Israel theo ngữ cảnh và ít mơ hồ hơn “dân chúng”; “chết cả mất” là lời hoảng sợ tự nhiên mà không áp đặt chính xác thời điểm của cái chết.
  terminology: “Người Ai Cập,” “dân,” và “xứ” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. “Đưa họ ra khỏi xứ” sát với hướng xuất khỏi הארץ mà không tăng cường ý bạo lực của động từ.
  issues:
