base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: vi
  text: 'Người Ai Cập thúc ép dân, vội vã đưa họ ra khỏi xứ[a], vì họ nói: “Tất cả chúng ta đều chết cả mất!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thúc ép dân để mau chóng đưa họ ra khỏi xứ.” Tiếng Hê-bơ-rơ dùng hai động từ nguyên mẫu liên tiếp để nhấn mạnh sự khẩn cấp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּחֱזַק
  choice: thúc ép
  rationale: Động từ חזק đi với עַל ở đây diễn tả việc gây sức ép mạnh mẽ; “thúc ép” tự nhiên trong tiếng Việt và giữ được sắc thái khẩn thiết.
- source_word: מִצְרַיִם
  choice: Người Ai Cập
  rationale: Tên xứ được dùng theo nghĩa tập thể để chỉ dân Ai Cập; tiếng Việt diễn đạt rõ và tự nhiên bằng “Người Ai Cập”.
- source_word: עַל הָעָם
  choice: dân chúng
  rationale: Cụm này chỉ đối tượng chịu sức ép, tức dân Israel trong ngữ cảnh. “Dân chúng” giữ cách gọi khái quát của nguyên văn mà không thêm tên riêng.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: hối hả đuổi họ ra
  rationale: Hai động từ nguyên mẫu nối tiếp nhau nhấn mạnh sự vội vã nhằm đưa họ đi. “Hối hả đuổi họ ra” vừa chuyển tải tốc độ vừa giữ sắc thái mạnh của שׁלח trong bối cảnh xuất hành.
- source_word: מִן הָאָרֶץ
  choice: khỏi xứ
  rationale: Giữ danh từ xác định “xứ” của nguyên văn, trong ngữ cảnh rõ ràng là Ai Cập, thay vì giải nghĩa trực tiếp thành tên riêng.
- source_word: כִּי אָמְרוּ
  choice: vì họ nói
  rationale: כִּי nêu lý do cho hành động thúc ép; cấu trúc “vì họ nói” tự nhiên trong lời kể tiếng Việt.
- source_word: כֻּלָּנוּ מֵתִים
  choice: Tất cả chúng ta sắp chết cả rồi!
  rationale: Phân từ מֵתִים có thể diễn tả tình trạng chết hoặc cái chết đang xảy đến. Trong lời hoảng sợ của những người còn sống sau tai vạ, “sắp chết cả rồi” truyền đạt tự nhiên ý nguy cấp mà không hiểu phi lý rằng người nói đã chết.
theological_decisions:
- issue: Giá trị thời-thể của מֵתִים trong lời người Ai Cập
  choice: sắp chết cả rồi
  alternative: đều là người chết / đều đang chết
  rationale: Nguyên văn ngắn gọn và có sức nặng, nhưng ngữ cảnh là lời của người còn sống đang sợ cái chết lan đến tất cả. Bản dịch chọn cách diễn đạt nguy cơ cận kề trong tiếng Việt, đồng thời ghi nhận cách dịch sát hình thức ở chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Thúc ép,” “hối hả,” và “khỏi xứ” giữ nhịp khẩn trương của câu; lời trực tiếp dùng “sắp chết cả rồi” để thể hiện sự hoảng hốt tự nhiên trong tiếng Việt.
