    issue: “đuổi họ ra” tăng cường sắc thái của לְשַׁלְּחָם.
    rationale: שׁלח trong ngữ cảnh này diễn tả việc sai/cho dân Israel ra đi; sức ép đã nằm ở ותֶחֱזק. “Đuổi” có thể gợi hành vi xua đuổi cưỡng bức mạnh hơn điều văn bản nói trực tiếp.
  - severity: medium
    issue: “sắp chết cả rồi” thu hẹp và diễn giải mệnh đề כֻּלָּנוּ מֵתִים.
    rationale: Phân từ מֵתִים trong lời hoảng sợ có thể mang sắc thái “chúng ta chết cả/chết mất,” song nguyên văn không nêu rõ “sắp” hoặc một trạng thái đã hoàn tất tương ứng với “rồi.”
  - severity: low
