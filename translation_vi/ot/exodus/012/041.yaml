source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: vi
  text: Và khi đã tròn bốn trăm ba mươi năm, đúng vào ngày ấy, toàn thể các đạo quân của Yahweh[a] ra khỏi xứ Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các đội ngũ của Yahweh.” Từ Hê-bơ-rơ có thể chỉ các đoàn thể được tổ chức hoặc các đạo quân.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: khi … kết thúc
  rationale: Cụm מִן־קֵץ chỉ thời điểm một khoảng thời gian đã trọn. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý hoàn tất.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: bốn trăm ba mươi năm
  rationale: Đảo thứ tự số theo cách nói tự nhiên trong tiếng Việt; tổng thời gian vẫn là 430 năm.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: chính vào ngày ấy
  rationale: Giữ sắc thái nhấn mạnh về đúng ngày cụ thể, đồng thời phù hợp với điểm nhìn hồi thuật của câu chuyện.
- source_word: יָצְאוּ
  choice: đã ra khỏi
  rationale: Diễn đạt trực tiếp động từ יצא và kết hợp tự nhiên với địa điểm xuất phát là đất Ai Cập.
- source_word: כָּל צִבְאוֹת
  choice: toàn thể các đạo quân
  rationale: כָּל mang nghĩa bao quát, còn צִבְאוֹת có thể chỉ các lực lượng hay đoàn thể được tổ chức. “Đạo quân” giữ sắc thái tập hợp có tổ chức của nguyên ngữ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên ngữ, thay vì thay thế bằng một tước hiệu.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ra khỏi đất Ai Cập
  rationale: Giữ danh từ אֶרֶץ (“đất, xứ”) và ý chuyển động rời khỏi Ai Cập.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng tước hiệu.
- issue: Sắc thái của צִבְאוֹת יְהוָה
  choice: các đạo quân của Yahweh
  alternative: các đội ngũ của Yahweh
  rationale: Cụm từ mô tả dân Israel như những đoàn thể có tổ chức thuộc về Yahweh. “Đạo quân” giữ sắc thái gần với nghĩa quân sự của צָבָא, nhưng chú thích bảo tồn nghĩa rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ mở đầu “Và” để phản ánh mạch kể liên tục của וַיְהִי; dùng “chính vào ngày ấy” để bảo tồn sự nhấn mạnh của thành ngữ Hê-bơ-rơ. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải nghĩa.
