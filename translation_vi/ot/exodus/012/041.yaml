  rationale: 'Chỉnh sửa chỉ nhằm làm câu tiếng Việt tự nhiên hơn: thay cấu trúc “khi ... kết thúc” bằng thành ngữ “khi đã tròn,” thay “chính vào” bằng “đúng vào” để giữ sắc thái nhấn mạnh, và dùng “xứ Ai Cập” cho cách gọi địa lý tự nhiên. Danh Yahweh, nghĩa bao quát của “toàn thể,” sắc thái tổ chức/quân sự của צִבְאוֹת, và chú thích từ vựng đều được giữ nguyên.'
