  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: vi
  text: Các ngươi không được ăn bất cứ thứ gì có men[a]; tại mọi nơi các ngươi cư ngụ[b], các ngươi phải ăn bánh không men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không được ăn một thứ có men nào.” Từ Hê-bơ-rơ có nghĩa rộng hơn riêng bánh, bao gồm bất cứ thức ăn nào đã được làm cho lên men.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong mọi khu định cư của các ngươi,” tức là tại mọi nơi các ngươi sinh sống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: bất cứ thứ gì có men
  rationale: 'Trong câu cấm, כָּל đi với danh từ số ít מַחְמֶצֶת mang ý bao quát: không được ăn một thứ đã lên men nào. Cách dịch này tự nhiên trong tiếng Việt và không thu hẹp đối tượng chỉ còn bánh.'
- source_word: לֹא תֹאכֵלוּ
  choice: các ngươi không được ăn
  rationale: Thể vị hoàn với לֹא trong ngữ cảnh luật lệ diễn đạt lệnh cấm. “Không được ăn” giữ rõ hiệu lực bắt buộc mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: tại mọi nơi các ngươi cư ngụ
  rationale: מוֹשָׁב có thể chỉ nơi ở hoặc khu định cư; cụm từ mở rộng mệnh lệnh đến mọi nơi dân Israel sinh sống. Cách diễn đạt này rõ hơn “trong mọi chỗ ở” mà vẫn giữ được phạm vi toàn thể.
- source_word: תֹּאכְלוּ
  choice: các ngươi phải ăn
  rationale: Thể vị hoàn ở đây có chức năng mệnh lệnh tích cực, song song với lệnh cấm ở vế trước. “Phải ăn” truyền đạt rõ tính bắt buộc.
- source_word: מַצּוֹת
  choice: bánh không men
  rationale: Danh từ chỉ bánh được làm không dùng men. “Bánh không men” là cách gọi tiếng Việt quen thuộc, minh bạch và chính xác.
theological_decisions: []
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng dễ hiểu. Đại từ “các ngươi” phù hợp với lời truyền dạy trực tiếp cho toàn thể dân Israel; “không được” và “phải” làm rõ hai mệnh lệnh đối ứng. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ tương ứng trong chính văn.
