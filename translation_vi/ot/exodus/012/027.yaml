revisions:
- from: 'Các con hãy đáp rằng: ‘Đó là sinh tế Vượt Qua dâng lên Yahweh[a], Đấng đã vượt qua[b] nhà của con cháu Israel tại Ai Cập, khi Ngài đánh phạt Ai Cập nhưng giải cứu nhà chúng ta.’ Bấy giờ, dân chúng cúi đầu và thờ lạy.'
  to: 'Hãy nói: ‘Đây là tế lễ Vượt Qua dâng cho Yahweh[a], Đấng đã vượt qua[b] nhà của con cháu Israel tại Ai Cập, khi Ngài đánh phạt Ai Cập và đã giải cứu nhà chúng ta.’ Dân chúng cúi mình và thờ lạy.'
  rationale: Bản sửa loại bỏ cách xưng hô không có trong nguyên văn, giữ liên từ nối của tiếng Hê-bơ-rơ, và dùng các cách diễn đạt hiện đại, trang trọng hơn. Các lựa chọn then chốt vẫn bảo tồn liên hệ giữa «Vượt Qua» và «vượt qua», danh Yahweh, hình ảnh «nhà», và trình tự hai hành động cung kính của dân chúng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:14:24Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng các ý chính của câu. Tuy nhiên, mệnh lệnh số nhiều không cần thêm cách xưng hô «Các con», vốn không có trong nguyên văn và có thể làm thay đổi người nghe trực tiếp. Liên từ «nhưng» trước «giải cứu» cũng mạnh hơn liên từ nối đơn thuần trong tiếng Hê-bơ-rơ.
  naturalness: '«Hãy nói» tự nhiên, trang trọng và tránh áp đặt quan hệ xưng hô. «Cúi mình và thờ lạy» diễn đạt rõ hai động từ liên tiếp: cúi xuống/bái lạy và thờ phượng.'
  terminology: Giữ «Yahweh», «tế lễ Vượt Qua», «con cháu Israel», và «thờ lạy». «Dâng cho Yahweh» diễn đạt tự nhiên ý tế lễ thuộc/dành cho Yahweh. Chú thích về פָּסַח được diễn đạt lại để nêu sắc thái khả dĩ mà không quyết định thay cho bản văn.
  issues:
  - severity: medium
    issue: «Các con hãy đáp rằng» thêm một cách xưng hô và sắc thái trả lời không được nêu trong câu.
    rationale: Nguyên văn chỉ dùng mệnh lệnh số nhiều «hãy nói». Dù ngữ cảnh trước có nói đến con cái hỏi, người được lệnh ở đây không được gọi là «các con»; «Hãy nói» giữ được tính khái quát của nguyên văn.
  - severity: low
    issue: «nhưng giải cứu» thêm tương phản rõ hơn liên từ וְ.
    rationale: Nguyên văn nối hai hành động bằng «và». Sự đối lập đã hiện rõ từ ngữ cảnh; dùng «và đã giải cứu» sát hơn mà vẫn tự nhiên.
  - severity: low
    issue: «cúi đầu» có thể thu hẹp động tác וַיִּקֹּד thành chỉ cử chỉ của đầu.
    rationale: Động từ diễn tả cúi/bái mình. «Cúi mình» giữ được hành động thân thể và phân biệt tương đối với «thờ lạy» tiếp theo.
