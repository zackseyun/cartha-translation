source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: vi
  text: 'Hãy nói: ‘Đây là tế lễ Vượt Qua dâng cho Yahweh[a], Đấng đã vượt qua[b] nhà của con cháu Israel tại Ai Cập, khi Ngài đánh phạt Ai Cập và đã giải cứu nhà chúng ta.’ Dân chúng cúi mình và thờ lạy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh là danh riêng của Đức Chúa Trời trong nguyên văn Hê-bơ-rơ.
    reason: divine_name
  - marker: b
    text: Động từ được dịch là “vượt qua” có cùng gốc từ với “Vượt Qua”; trong ngữ cảnh này, từ ấy cũng có thể mang sắc thái tha cho hoặc che chở.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: sinh tế Vượt Qua
  rationale: Giữ rõ ý nghĩa tế lễ của זֶבַח và mối liên hệ với danh từ פֶּסַח; cách diễn đạt trang trọng nhưng tự nhiên trong tiếng Việt.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Trong ngữ cảnh tế lễ, ל diễn tả đối tượng tiếp nhận hoặc sự dâng hiến; “dâng lên” tự nhiên hơn lối dịch máy móc “cho/đến”.
- source_word: פָּסַח
  choice: vượt qua
  rationale: Bảo tồn liên hệ từ nguyên và văn cảnh với “Vượt Qua” trong cùng mệnh đề, đồng thời chú thích sắc thái che chở hoặc tha khỏi tai họa.
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: nhà của con cháu Israel
  rationale: “Con cháu Israel” là thành ngữ tiếng Việt tự nhiên, bao quát cộng đồng giao ước và vẫn phản ánh cách gọi thân tộc của nguyên văn.
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: khi Ngài đánh phạt Ai Cập
  rationale: Cấu trúc ב + động từ nguyên mẫu mang nghĩa thời gian; “đánh phạt” thể hiện hành động giáng họa và phán xét mà không giới hạn động từ vào một tai vạ riêng.
- source_word: הִצִּיל
  choice: giải cứu
  rationale: Nצל ở dạng Hiphil diễn tả cứu thoát khỏi hiểm họa; “giải cứu” chính xác hơn “bỏ qua” và giữ sự đối lập với việc đánh phạt Ai Cập.
- source_word: וַיִּקֹּד
  choice: cúi đầu
  rationale: Diễn tả động tác cúi mình cung kính và phân biệt tương đối với động từ kế tiếp.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: thờ lạy
  rationale: Truyền đạt cả hành vi phủ phục và ý nghĩa tôn kính trong thờ phượng; phối hợp tự nhiên với “cúi đầu”.
theological_decisions:
- issue: Cách dịch danh thánh יהוה
  choice: Yahweh
  alternative: ĐỨC CHÚA; Giê-hô-va
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất danh riêng mà không thay bằng một tước hiệu.
- issue: Ý nghĩa của פָּסַח
  choice: vượt qua, với chú thích sắc thái tha khỏi tai họa hoặc che chở
  alternative: tha; che chở
  rationale: Giữ lối chơi chữ với פֶּסַח (“Vượt Qua”) và không loại bỏ sắc thái bảo vệ được ngữ cảnh gợi lên.
- issue: Đối tượng được הִצִּיל
  choice: giải cứu nhà chúng ta
  alternative: tha cho nhà chúng ta; cứu gia đình chúng ta
  rationale: Nguyên văn nói “nhà” và có thể gợi cả ngôi nhà lẫn hộ gia đình. Bản chính giữ hình ảnh cụ thể, không âm thầm thu hẹp thành chỉ con người hay chỉ kiến trúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Các con hãy đáp rằng” vì đây là lời cha mẹ được truyền phải trả lời con cái theo ngữ cảnh trước đó. Viết hoa “Vượt Qua” để chỉ lễ/sinh tế đặc thù; giữ “nhà” nhằm bảo tồn độ rộng nghĩa của בַּיִת.
