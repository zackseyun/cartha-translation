  text: The LORD said to Moses and to Aaron in the land of Egypt, saying,
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với Môi-se và A-rôn tại đất Ai Cập rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc trong tiếng Việt để biểu thị danh riêng YHWH, thay vì đồng nhất danh này với tước hiệu chung “Chúa”.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Trong ngữ cảnh Đức Chúa Trời truyền lời cho Môi-se và A-rôn, “phán” là động từ tự nhiên, trang trọng và phù hợp trong tiếng Việt.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: tại đất Ai Cập
  rationale: Giữ rõ địa điểm của lời phán; “tại” tự nhiên hơn “trong” khi nói về một vùng đất.
- source_word: לֵאמֹר
  choice: 'rằng:'
  rationale: Công thức dẫn nhập lời nói trực tiếp được chuyển tự nhiên bằng “rằng” và dấu hai chấm, vì câu kế tiếp sẽ chứa nội dung lời phán.
theological_decisions:
- issue: Cách thể hiện danh giao ước YHWH
  choice: Đức Giê-hô-va
  alternative: CHÚA / Đức Chúa
  rationale: Bản Hê-bơ-rơ có danh riêng יהוה; cách dịch đã chọn bảo toàn sự phân biệt giữa danh riêng này và các tước hiệu thần linh, mà không thêm diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cả hai giới từ tương ứng với “với Môi-se và A-rôn” theo cú pháp tiếng Việt tự nhiên, đồng thời không dịch waw mở đầu bằng “bấy giờ” vì ở đây chủ yếu làm chức năng nối mạch kể chuyện.
