source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּֽי יֹאמְר֥וּ אֲלֵי/כֶ֖ם בְּנֵי/כֶ֑ם מָ֛ה הָ/עֲבֹדָ֥ה הַ/זֹּ֖את לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/026.yaml
  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: vi
  text: 'Và khi các con trai của anh em nói với anh em: “Việc phụng sự này có ý nghĩa gì đối với anh em?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát hơn: “Việc phụng sự này đối với anh em là gì?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Và khi
  rationale: Công thức Hê-bơ-rơ này giới thiệu một tình huống sẽ xảy ra trong tương lai; “Và khi” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái thời gian.
- source_word: יֹאמְרוּ
  choice: nói
  rationale: Động từ אָמַר có nghĩa cơ bản là “nói”. Dù lời theo sau mang hình thức câu hỏi, bản dịch giữ “nói” thay vì diễn giải thành “hỏi”.
- source_word: אֲלֵיכֶם
  choice: với anh em
  rationale: Diễn đạt trực tiếp giới từ cùng hậu tố ngôi thứ hai số nhiều.
- source_word: בְּנֵיכֶם
  choice: các con trai của anh em
  rationale: Danh từ Hê-bơ-rơ ở giống đực số nhiều, chỉ rõ “các con trai”; không khái quát hóa thành “con cái”.
- source_word: מָה
  choice: có ý nghĩa gì
  rationale: Trong cấu trúc מָה ... לָכֶם, câu hỏi nhắm đến ý nghĩa của việc thực hành đối với cộng đồng. Cách diễn đạt này tự nhiên trong tiếng Việt; cách sát hình thức hơn được ghi ở chú thích.
- source_word: הָעֲבֹדָה
  choice: việc phụng sự
  rationale: עֲבֹדָה có thể chỉ công việc, sự phục vụ hoặc việc phụng sự mang tính nghi lễ. “Việc phụng sự” giữ được sắc thái thờ phượng trong ngữ cảnh Lễ Vượt Qua mà không thu hẹp hoàn toàn thành “nghi thức”.
- source_word: הַזֹּאת
  choice: này
  rationale: Đại từ chỉ định bổ nghĩa trực tiếp cho “việc phụng sự”.
- source_word: לָכֶם
  choice: đối với anh em
  rationale: Giữ sắc thái của giới từ לְ cùng hậu tố số nhiều, chỉ mối liên hệ của việc phụng sự với những người được hỏi.
theological_decisions:
- issue: Câu hỏi nói đến ý nghĩa hay chỉ hỏi định danh về việc phụng sự
  choice: Dịch tự nhiên là “có ý nghĩa gì đối với anh em” và ghi cách sát hình thức trong chú thích.
  alternative: “Việc phụng sự này đối với anh em là gì?”
  rationale: Nguyên văn có thể được giữ sát từng thành tố, nhưng trong tiếng Việt cấu trúc ấy khá gượng. Bản chính truyền đạt chức năng của câu hỏi mà chú thích vẫn bảo tồn hình thức và độ mở của tiếng Hê-bơ-rơ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ “các con trai” theo hình thức giống đực của nguyên văn, đồng thời dùng “anh em” để biểu đạt ngôi thứ hai số nhiều. “Việc phụng sự” mang sắc thái tôn giáo phù hợp ngữ cảnh nhưng vẫn rộng hơn “nghi lễ”.
