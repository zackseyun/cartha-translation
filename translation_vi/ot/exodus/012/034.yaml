  - severity: low
    issue: Tính không chắc chắn của מִשְׁאֲרֹת chưa được đánh dấu
    rationale: “Thau” là cách dịch tự nhiên nhưng có thể gợi một hình dạng cụ thể. Một chú thích lexical giữ mở các khả năng như máng hoặc đồ đựng bột.
