translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Giữ trình tự hình ảnh của câu Hê-bơ-rơ, nhưng điều chỉnh cú pháp cho tự nhiên. Không thêm chú thích vì “thau nhồi bột” đã truyền đạt ngay trong chính văn nghĩa dụng cụ của מִשְׁאֲרֹת; sự không chắc chắn về hình dạng được giữ bằng danh từ tương đối rộng “thau”.
