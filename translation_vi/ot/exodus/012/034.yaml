base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/034.yaml
  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: vi
  text: Dân chúng mang bột của mình đi trước khi bột dậy men; còn các thau nhồi bột[a] của họ thì được gói trong áo choàng và vác trên vai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “máng nhồi bột” hay “đồ đựng bột”. Từ Hê-bơ-rơ chỉ các vật chứa dùng khi chuẩn bị bột.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: mang ... đi
  rationale: Động từ נשׂא ở đây diễn tả việc mang theo đồ vật khi rời đi; “mang ... đi” tự nhiên trong tiếng Việt và làm rõ bối cảnh lên đường.
- source_word: הָעָם
  choice: dân chúng
  rationale: עָם chỉ toàn thể dân Israel trong trình thuật; “dân chúng” giữ sắc thái tập thể và phù hợp văn phong kể chuyện.
- source_word: בְּצֵקוֹ
  choice: bột nhồi
  rationale: Danh từ chỉ khối bột đã được trộn/nhồi. Hậu tố số ít đi với chủ thể tập thể, nên tiếng Việt không cần biểu thị sở hữu ở lần xuất hiện đầu.
- source_word: טֶרֶם יֶחְמָץ
  choice: khi bột chưa dậy men
  rationale: טֶרֶם cùng thể động từ diễn tả việc chưa xảy ra; “chưa dậy men” là cách nói tự nhiên, chính xác trong ngữ cảnh làm bánh.
- source_word: מִשְׁאֲרֹתָם
  choice: các thau nhồi bột của họ
  rationale: Từ này chỉ những vật chứa dùng để chuẩn bị hoặc nhồi bột. “Thau nhồi bột” dễ hình dung trong tiếng Việt hiện đại mà không xác định quá mức hình dạng hay kích thước.
- source_word: צְרֻרֹת
  choice: được gói
  rationale: Phân từ bị động của צרר chỉ việc bó, buộc hoặc gói lại thành kiện để mang đi; “được gói” hợp tự nhiên với áo choàng làm vật bọc.
- source_word: בְּשִׂמְלֹתָם
  choice: trong áo choàng
  rationale: שִׂמְלָה thường là áo ngoài hay áo choàng; ở đây quần áo được dùng để gói các vật chứa.
- source_word: עַל שִׁכְמָם
  choice: vác trên vai
  rationale: Cụm từ mô tả vị trí các gói đồ trên vai; “vác trên vai” diễn đạt tự nhiên hành động mang vật nặng hoặc cồng kềnh.
