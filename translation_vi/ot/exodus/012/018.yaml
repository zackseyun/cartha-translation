base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: vi
  text: Trong tháng thứ nhất, vào chiều tối[a] ngày mười bốn của tháng, anh em phải ăn bánh không men cho đến chiều tối ngày hai mươi mốt của tháng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vào buổi tối”; từ này xuất hiện ở cả hai chỗ nói đến “chiều tối” trong câu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: Trong tháng thứ nhất
  rationale: Trong công thức xác định ngày tháng này, danh từ “tháng” được hiểu từ לַחֹדֶשׁ ở phần sau của câu; bổ sung “tháng” giúp câu tiếng Việt rõ ràng và tự nhiên.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: ngày mười bốn
  rationale: Đây là cách tiếng Hê-bơ-rơ dùng số đếm để chỉ ngày trong tháng; “ngày mười bốn” là cách diễn đạt lịch pháp tự nhiên trong tiếng Việt.
- source_word: לַחֹדֶשׁ
  choice: của tháng
  rationale: חֹדֶשׁ có thể chỉ tháng hoặc kỳ trăng mới, nhưng trong công thức ghi ngày ở đây, nghĩa “tháng” phù hợp nhất.
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: vào chiều tối / chiều tối
  rationale: Cụm từ này đánh dấu ranh giới thời gian ở đầu và cuối kỳ lễ. “Chiều tối” giữ được nghĩa khái quát, không xác định quá mức một thời điểm chính xác.
- source_word: תֹּאכְלוּ
  choice: anh em phải ăn
  rationale: Dạng chưa hoàn thành mang sắc thái chỉ thị trong văn cảnh luật lệ. “Phải ăn” truyền đạt rõ lực mệnh lệnh, còn “anh em” thể hiện ngôi thứ hai số nhiều bằng lối nói hiện đại, trang trọng.
- source_word: מַצֹּת
  choice: bánh không men
  rationale: Chỉ loại bánh không dùng men trong bối cảnh Lễ Vượt Qua; đây là cách gọi rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: עַד
  choice: cho đến
  rationale: Đánh dấu điểm kết thúc của khoảng thời gian phải ăn bánh không men.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: ngày hai mươi mốt
  rationale: Đây là cách diễn đạt ngày thứ hai mươi mốt theo lối đếm Hê-bơ-rơ; bản dịch dùng trật tự tự nhiên của tiếng Việt.
