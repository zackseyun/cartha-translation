  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nguyên hai mốc thời gian và lực chỉ thị của nguyên văn, đồng thời không xác định hẹp “chiều tối” thành một thời điểm kỹ thuật duy nhất.
