source:
  edition: WLC
  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: vi
  text: Trong bảy ngày, các ngươi phải ăn bánh không men. Nhưng ngay trong ngày thứ nhất, các ngươi phải loại bỏ men khỏi nhà mình[a], vì bất cứ ai ăn thứ gì có men thì người ấy sẽ bị cắt khỏi Y-sơ-ra-ên[b], từ ngày thứ nhất cho đến ngày thứ bảy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “làm cho men không còn.” Cũng có thể dịch: “dẹp bỏ” hoặc “tiêu hủy men khỏi nhà mình.”'
    reason: lexical_alternative
  - marker: b
    text: “Bị cắt khỏi” là một cách nói pháp lý trong tiếng Hê-bơ-rơ. Nó có thể chỉ việc bị trục xuất khỏi cộng đồng, chịu chết, hoặc bị Đức Chúa Trời phán xét; câu này không nói rõ hình thức cụ thể.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: bánh không men
  rationale: Chỉ bánh được làm không dùng chất gây lên men; đây là cách diễn đạt rõ ràng, tự nhiên và quen thuộc trong ngữ cảnh lễ Vượt Qua.
- source_word: אַךְ
  choice: Ngay
  rationale: Tiểu từ này nhấn mạnh và giới hạn mệnh lệnh vào ngày thứ nhất. Trong tiếng Việt, “Ngay ngày thứ nhất” chuyển tải tự nhiên sức nhấn của câu mà không cần nối bằng “nhưng”.
- source_word: תַּשְׁבִּיתוּ
  choice: phải loại bỏ
  rationale: Dạng Hiphil của שׁבת có nghĩa đen là “làm cho chấm dứt/không còn”; trong ngữ cảnh này, loại bỏ men khỏi nhà diễn đạt đúng hiệu lực thực tế của mệnh lệnh.
- source_word: שְּׂאֹר
  choice: men
  rationale: Chỉ tác nhân gây lên men, có thể gần với men cái hơn men công nghiệp hiện đại. “Men” là từ phổ thông và không thu hẹp quá mức loại chất lên men.
- source_word: חָמֵץ
  choice: vật gì có men
  rationale: Từ này chỉ rộng rãi thứ đã lên men chứ không nhất thiết chỉ là bánh; cách dịch này giữ nguyên phạm vi của tiếng Hê-bơ-rơ.
- source_word: וְנִכְרְתָה
  choice: sẽ bị loại khỏi
  rationale: Giữ hình ảnh pháp lý-giao ước của כרת và tránh quyết định rằng hình phạt nhất thiết là trục xuất, tử hình hay sự phán xét trực tiếp của Đức Chúa Trời.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: người ấy
  rationale: Trong công thức pháp lý, נֶפֶשׁ chỉ cá nhân; “người ấy” tự nhiên hơn “linh hồn ấy” và không áp đặt một quan niệm nhân học hẹp.
- source_word: מִיִּשְׂרָאֵל
  choice: khỏi Y-sơ-ra-ên
  rationale: Diễn đạt việc bị tách khỏi cộng đồng giao ước, đồng thời giữ cấu trúc ngắn gọn của nguyên văn.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: từ ngày thứ nhất cho đến ngày thứ bảy
  rationale: Giữ vị trí cuối câu và phạm vi thời gian như tiếng Hê-bơ-rơ; cách gắn kết cú pháp chính xác có thể được hiểu với hành vi bị cấm hoặc cả mệnh đề chế tài.
theological_decisions:
- issue: Ý nghĩa của hình phạt וְנִכְרְתָה (“bị loại khỏi”)
  choice: Giữ cách nói pháp lý “sẽ bị loại khỏi Y-sơ-ra-ên” mà không xác định phương thức.
  alternative: Bị trục xuất khỏi cộng đồng; bị xử tử; hoặc bị Đức Chúa Trời phán xét và loại trừ.
  rationale: Câu này không nói rõ việc loại trừ diễn ra bằng cách nào. Cách dịch giữ nguyên sức nặng giao ước và sự không xác định của nguyên văn.
- issue: Phạm vi cú pháp của cụm “từ ngày thứ nhất cho đến ngày thứ bảy”
  choice: Giữ cụm từ ở cuối câu như nguyên văn.
  alternative: Đưa cụm từ sát hành vi ăn đồ có men để nói rõ lệnh cấm kéo dài suốt bảy ngày.
  rationale: Vị trí cuối trong tiếng Hê-bơ-rơ cho phép cụm thời gian gắn trực tiếp với mệnh đề gần nhất nhưng về ý nghĩa vẫn mô tả thời kỳ lễ; giữ vị trí này tránh giải quyết quá mức một liên hệ cú pháp có thể được hiểu theo hơn một cách.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ lời truyền phán số nhiều và sắc thái Kinh Thánh trang nghiêm; dùng “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc. Các dấu chú thích [a], [b] đều được đặt ngay sau nội dung liên quan.
