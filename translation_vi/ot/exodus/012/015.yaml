  to: Trong bảy ngày, các ngươi phải ăn bánh không men. Nhưng ngay trong ngày thứ nhất, các ngươi phải loại bỏ men khỏi nhà mình[a], vì bất cứ ai ăn thứ gì có men thì người ấy sẽ bị cắt khỏi Y-sơ-ra-ên[b], từ ngày thứ nhất cho đến ngày thứ bảy.
