- from: Người ngoại kiều cư trú hay người làm thuê đều không được ăn lễ vật ấy[a][b].
  to: Người tạm trú hay người làm thuê không được ăn phần lễ Vượt Qua ấy[a][b].
  rationale: Thay “người ngoại kiều cư trú” bằng “người tạm trú” để có cách diễn đạt tiếng Việt hiện đại, gọn và phù hợp với תּוֹשָׁב. Thay “lễ vật ấy” bằng “phần lễ Vượt Qua ấy” để không thêm sắc thái “vật hiến tế” vào đại từ nguồn, đồng thời cho thấy rõ đối tượng bị cấm ăn trong văn cảnh mà không quyết định dứt khoát giữa bữa ăn và chiên con.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:14:34Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng lệnh cấm đối với hai hạng người. Tuy nhiên, “lễ vật ấy” thêm sắc thái tế lễ không được nêu bởi đại từ בּוֹ và có thể khiến người đọc hiểu hẹp là một vật phẩm cúng tế. Trong văn cảnh, đại từ chỉ phần thức ăn của lễ Vượt Qua, với khả năng quy chiếu hẹp hơn đến chiên con Vượt Qua.
  naturalness: “Người ngoại kiều cư trú” khá nặng và không phải cách gọi tự nhiên nhất trong tiếng Việt hiện đại. “Người tạm trú” gọn, tự nhiên và phù hợp với tình trạng cư trú không phải thành viên đầy đủ. “Phần lễ Vượt Qua ấy” diễn đạt tự nhiên hơn “lễ vật ấy” sau động từ “ăn.”
  terminology: “Người làm thuê” và “không được ăn” phù hợp với văn phong luật lệ. “Phần lễ Vượt Qua” tránh áp đặt rằng đối tượng là một lễ vật, đồng thời vẫn giữ liên hệ với lễ Vượt Qua; chú thích làm rõ khả năng chỉ riêng thịt chiên con.
  issues:
