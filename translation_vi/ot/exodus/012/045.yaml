    issue: “lễ vật ấy” không phản ánh trung tính đầy đủ của בּוֹ.
    rationale: Đại từ Hê-bơ-rơ chỉ đối tượng đã được xác định trong văn cảnh, chứ không gọi đối tượng ấy là “lễ vật.” Cách dùng này thêm một sắc thái hy tế và dễ thu hẹp hoặc chuyển hướng quy chiếu.
  - severity: low
    issue: “người ngoại kiều cư trú” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Người tạm trú” diễn đạt tự nhiên hơn ý của תּוֹשָׁב là người cư trú tạm/thường trú trong cộng đồng nhưng không thuộc trọn vẹn cộng đồng đó; chú thích có thể nêu các lựa chọn khác.
