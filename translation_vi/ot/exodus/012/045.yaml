  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: vi
  text: Người tạm trú hay người làm thuê không được ăn phần lễ Vượt Qua ấy[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “người ngụ cư,” “người cư trú,” hoặc “người ngoại kiều cư trú.”
    reason: lexical_alternative
  - marker: b
    text: Tức là phần thức ăn của lễ Vượt Qua; hiểu hẹp hơn có thể là thịt chiên con Vượt Qua.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: người ngoại kiều cư trú
  rationale: Chỉ một người không phải dân bản địa nhưng đang cư trú giữa dân Israel, chưa được kể là thành viên đầy đủ của cộng đồng giao ước. Cách dịch này thể hiện cả tình trạng cư trú lẫn thân phận người ngoài.
- source_word: וְ/שָׂכִיר
  choice: hay người làm thuê
  rationale: 'שָׂכִיר là người làm việc để nhận tiền công. Liên từ וְ nối hai hạng người cùng chịu lệnh cấm; tiếng Việt dùng “hay... đều” để diễn đạt tự nhiên ý phân phối: bất cứ ai thuộc một trong hai hạng ấy đều không được ăn.'
- source_word: לֹא יֹאכַל
  choice: đều không được ăn
  rationale: Thể vị hoàn thành chưa trọn với phủ định trong văn bản luật diễn tả lệnh cấm. “Không được ăn” rõ ràng, hiện đại và giữ sắc thái quy định.
- source_word: בּוֹ
  choice: ăn lễ vật ấy
  rationale: Giới từ בְּ đi với động từ “ăn” ở đây có sắc thái dự phần ăn từ vật đã được nói đến. “Lễ vật ấy” diễn đạt tự nhiên trong tiếng Việt mà không buộc đại từ phải chỉ riêng phần thịt hay toàn bộ bữa ăn.
theological_decisions:
- issue: Đối tượng mà đại từ בּוֹ quy chiếu trong luật về lễ Vượt Qua
  choice: “Lễ vật ấy” quy chiếu đến con vật hoặc thức ăn của lễ Vượt Qua trong văn cảnh gần.
  alternative: Hiểu hẹp hơn là chỉ thịt chiên con của lễ Vượt Qua.
  rationale: Đại từ Hê-bơ-rơ dựa vào văn cảnh mà không nêu lại danh từ. “Lễ vật ấy” giữ được sự ngắn gọn và không quyết định dứt khoát giữa con vật hiến tế với phần ăn của lễ.
translation_notes:
  register: Văn phong luật lệ ngắn gọn, trang trọng nhưng hiện đại. Cấu trúc “hay... đều” làm rõ rằng lệnh cấm áp dụng riêng cho cả hai hạng người, đồng thời chuyển tải tự nhiên liên từ Hê-bơ-rơ.
