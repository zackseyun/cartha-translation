  text: וּ/בְנֵי יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּ/דְבַ֣ר מֹשֶׁ֑ה וַֽ/יִּשְׁאֲלוּ֙ מִ/מִּצְרַ֔יִם כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: vi
  text: Dân Y-sơ-ra-ên làm theo lời Môi-se; họ xin[a] người Ai Cập các đồ vật bằng bạc, các đồ vật bằng vàng và quần áo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “yêu cầu”. Các bản dịch tiếng Anh cũ thường dịch là “mượn,” nhưng động từ Hê-bơ-rơ ở đây thông thường có nghĩa là “xin” hoặc “yêu cầu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Y-sơ-ra-ên,” nhưng trong văn cảnh chỉ toàn thể dân Y-sơ-ra-ên. Cách dịch này tự nhiên, trang trọng và bao hàm cộng đồng, không khiến độc giả hiện đại hiểu rằng chỉ có nam giới.
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: làm theo lời Môi-se
  rationale: Giữ động từ đơn giản עשה và danh từ דבר, đồng thời diễn đạt tự nhiên trong tiếng Việt; “lời” ở đây có thể bao gồm điều Môi-se đã nói hoặc chỉ dẫn.
- source_word: וַיִּשְׁאֲלוּ
  choice: xin
  rationale: Động từ שאל căn bản có nghĩa là hỏi hoặc xin. Trong cấu trúc này, “xin” phù hợp với việc yêu cầu nhận các đồ vật và không đưa thêm ý “mượn” hay “cướp” vốn không nằm trong chính động từ.
- source_word: מִמִּצְרַיִם
  choice: người Ai Cập
  rationale: Hình thức chữ nghĩa là “từ Ai Cập,” nhưng theo văn cảnh, Ai Cập được dùng để chỉ những người Ai Cập mà dân Y-sơ-ra-ên xin đồ vật.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: các vật dụng bằng bạc, các vật dụng bằng vàng
  rationale: כְּלִי là từ rộng, có thể chỉ đồ vật, vật dụng hoặc khí cụ. “Vật dụng” giữ được phạm vi rộng và tránh thu hẹp thành bình, chén hay đồ trang sức.
- source_word: וּשְׂמָלֹת
  choice: quần áo
  rationale: שִׂמְלָה chỉ y phục nói chung. “Quần áo” là cách nói hiện đại, rõ ràng và không thu hẹp vào một loại áo cụ thể.
theological_decisions:
- issue: Sắc thái đạo đức có thể bị gán cho וַיִּשְׁאֲלוּ trong bối cảnh dân Y-sơ-ra-ên ra khỏi Ai Cập
  choice: xin
  alternative: mượn; yêu cầu; lấy làm chiến lợi phẩm
  rationale: “Xin” phản ánh nghĩa thông thường của שאל mà không ngầm cho rằng họ dự định hoàn trả như từ “mượn,” cũng không đưa kết quả “tước lấy” ở câu kế tiếp vào nghĩa của động từ này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Dân Y-sơ-ra-ên” thay cho cách dịch sát chữ “các con trai của Y-sơ-ra-ên” để chỉ toàn thể cộng đồng. Dấu chú thích [a] đặt ngay sau câu có từ cần giải thích.
