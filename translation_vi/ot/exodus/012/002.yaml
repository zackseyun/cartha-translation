  text: הַ/חֹ֧דֶשׁ הַ/זֶּ֛ה לָ/כֶ֖ם רֹ֣אשׁ חֳדָשִׁ֑ים רִאשׁ֥וֹן הוּא֙ לָ/כֶ֔ם לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: vi
  text: “Tháng này[a] sẽ là khởi đầu của các tháng cho các ngươi; nó sẽ là tháng thứ nhất trong năm đối với các ngươi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “kỳ trăng mới”; từ Hê-bơ-rơ này có liên hệ với chu kỳ trăng mới, nhưng trong ngữ cảnh này chỉ tháng theo lịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: Tháng này
  rationale: Trong ngữ cảnh thiết lập lịch, חֹדֶשׁ chỉ tháng theo lịch. Cách dịch này tự nhiên và chính xác hơn “kỳ trăng mới” trong tiếng Việt.
- source_word: לָכֶם
  choice: cho các ngươi / đối với các ngươi
  rationale: Giữ sắc thái quy chiếu đến cộng đồng Israel; hai cách diễn đạt phù hợp với cú pháp của từng vế trong tiếng Việt.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: khởi đầu các tháng
  rationale: רֹאשׁ nghĩa đen là “đầu”, nhưng trong trật tự thời gian mang nghĩa “khởi đầu”; cách dịch giữ được hình thức cấu tạo của tiếng Hê-bơ-rơ mà vẫn tự nhiên.
- source_word: רִאשׁוֹן הוּא
  choice: nó sẽ là tháng thứ nhất
  rationale: Bổ sung “tháng” theo danh từ đã nêu và dịch mệnh đề không động từ với sắc thái thiết lập trong ngữ cảnh luật định.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: trong năm
  rationale: Diễn đạt tự nhiên phạm vi xếp thứ tự giữa các tháng của năm, không làm thay đổi ý nghĩa lịch pháp.
theological_decisions:
- issue: Lực của mệnh đề không động từ trong ngữ cảnh luật định
  choice: 'Dịch với sắc thái thiết lập: “sẽ là”'
  alternative: 'Dịch như lời mô tả hiện tại: “là”'
  rationale: Tiếng Hê-bơ-rơ không có động từ biểu thị thời, nhưng văn cảnh là lời Đức Chúa Trời thiết lập cách tính lịch cho Israel. “Sẽ là” truyền đạt lực quy định mà không thêm nội dung giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để thể hiện lời phán trực tiếp với cộng đồng số nhiều; tránh từ Hán-Việt khó hiểu và giữ sự lặp lại của לָכֶם ở cả hai vế.
