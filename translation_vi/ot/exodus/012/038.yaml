  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: vi
  text: Cũng có một đoàn người hỗn hợp đông đảo đi lên cùng họ[a], cùng với bầy chiên dê và đàn bò—tức là một lượng gia súc rất lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một đám đông pha tạp rất lớn” hoặc “một đoàn người gồm nhiều thành phần.” Cụm từ Hê-bơ-rơ עֵרֶב רַב chỉ một nhóm người gồm nhiều thành phần cùng đi với dân Y-sơ-ra-ên.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: Cũng
  rationale: Diễn đạt tự nhiên ý bổ sung vào lời thuật trước đó.
- source_word: עֵרֶב רַב
  choice: một đoàn người hỗn hợp rất đông
  rationale: Giữ cả ý một nhóm gồm nhiều thành phần khác nhau của עֵרֶב lẫn ý số lượng lớn của רַב, mà không tự ý xác định sắc tộc của họ.
- source_word: עָלָה
  choice: đi lên
  rationale: Giữ hình ảnh chuyển động của động từ Hê-bơ-rơ và cách nói quen thuộc trong trình thuật cuộc xuất hành.
- source_word: אִתָּם
  choice: cùng họ
  rationale: Diễn đạt trực tiếp quan hệ đồng hành; đại từ chỉ dân Y-sơ-ra-ên trong văn cảnh.
- source_word: וְ/צֹאן וּ/בָקָר
  choice: cùng với các bầy chiên dê và đàn bò
  rationale: צֹאן là gia súc nhỏ, thường gồm chiên và dê, còn בָקָר là bò; cách dịch này rõ nghĩa đối với độc giả Việt hiện đại.
- source_word: מִקְנֶה כָּבֵד מְאֹד
  choice: gia súc nhiều vô kể
  rationale: כָּבֵד theo nghĩa đen là “nặng,” nhưng khi nói về gia súc thì chỉ số lượng rất lớn; cụm tiếng Việt truyền đạt tự nhiên cường độ của מְאֹד.
