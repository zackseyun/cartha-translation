source:
  edition: WLC
  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: vi
  text: 'Bấy giờ, Môi-se triệu tập tất cả các trưởng lão của Y-sơ-ra-ên và nói với họ: “Hãy kéo ra[a] và lấy cho mình gia súc nhỏ[b] tùy theo gia đình mình, rồi giết con vật tế lễ Vượt Qua[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kéo ra” cũng có thể hiểu theo ngữ cảnh là “chọn ra” hoặc “dắt ra” khỏi đàn.
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ chỉ chung gia súc nhỏ trong đàn, bao gồm chiên và dê.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “lễ Vượt Qua”; tại đây danh từ này chỉ con vật được dùng làm sinh tế lễ Vượt Qua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: triệu tập
  rationale: Trong ngữ cảnh Môi-se tập hợp các trưởng lão để truyền chỉ thị, “triệu tập” diễn đạt tự nhiên sắc thái gọi đến.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: các trưởng lão của Y-sơ-ra-ên
  rationale: Cách diễn đạt tiêu chuẩn, chỉ những người lãnh đạo hay đại diện được nhìn nhận trong dân.
- source_word: מִשְׁכוּ
  choice: kéo ra
  rationale: Giữ nghĩa cụ thể của động từ משך là kéo/rút ra, có lẽ là kéo con vật ra khỏi đàn; chú thích nêu nghĩa theo ngữ cảnh là tuyển chọn.
- source_word: וּקְחוּ
  choice: bắt lấy
  rationale: Giữ riêng mệnh lệnh thứ hai và phù hợp với hành động lấy một con vật từ đàn.
- source_word: לָכֶם
  choice: cho mình
  rationale: Diễn đạt tự nhiên sắc thái phản thân của đại từ chỉ đối tượng hưởng lợi.
- source_word: צֹאן
  choice: gia súc nhỏ
  rationale: צֹאן là từ tập hợp rộng, có thể chỉ chiên hoặc dê; cách dịch này tránh thu hẹp thành riêng chiên con, phù hợp Xuất Ê-díp-tô Ký 12:5.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: theo từng gia tộc
  rationale: מִשְׁפָּחָה có thể chỉ nhóm gia đình hay thị tộc; “theo từng gia tộc” giữ ý phân chia theo các đơn vị họ hàng.
- source_word: וְשַׁחֲטוּ
  choice: giết
  rationale: Trong tiếng Việt hiện đại, “giết” rõ ràng và tự nhiên cho việc hạ sát con vật; ngữ cảnh lễ nghi đã được phần bổ nghĩa sau đó xác định.
- source_word: הַפָּסַח
  choice: con vật làm lễ Vượt Qua
  rationale: Nguyên văn là “lễ Vượt Qua”, được dùng hoán dụ chỉ con vật hiến tế. Cách dịch làm rõ đối tượng nhưng không thu hẹp thành chiên con vì đoạn gần đó cho phép chiên hoặc dê.
theological_decisions:
- issue: Đối tượng được chỉ bởi הַפָּסַח
  choice: con vật làm lễ Vượt Qua
  alternative: chiên con lễ Vượt Qua; sinh tế lễ Vượt Qua; lễ Vượt Qua
  rationale: Danh từ “lễ Vượt Qua” ở đây được dùng hoán dụ cho con vật bị giết. “Con vật làm lễ Vượt Qua” vừa tự nhiên vừa giữ phạm vi rộng của con vật, không loại trừ dê theo câu 5.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hai mệnh lệnh “kéo ra” và “bắt lấy” thay vì gộp lại; dùng “gia súc nhỏ” để bảo toàn phạm vi nghĩa của צֹאן, và giải thích cách dùng hoán dụ của הַפָּסַח trong chú thích.
