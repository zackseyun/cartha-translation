base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: vi
  text: Ngày thứ nhất, anh em phải có một cuộc hội họp thánh[a], và ngày thứ bảy cũng phải có một cuộc hội họp thánh. Trong những ngày ấy, không được làm bất cứ công việc nào; chỉ những gì mỗi người sẽ ăn mới được phép chuẩn bị cho anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một cuộc triệu tập thánh” hoặc “một cuộc nhóm họp thiêng liêng.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ nói sát nghĩa là: “điều được ăn cho mỗi người, chỉ điều ấy được làm cho anh em.” Từ dịch là “người” là nephesh, ở đây chỉ một cá nhân chứ không đặc biệt là “linh hồn” theo nghĩa hiện đại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: một cuộc hội họp thánh
  rationale: Cụm từ chỉ một cuộc tụ họp được triệu tập và biệt riêng cho mục đích thánh. “Cuộc hội họp thánh” vừa dễ hiểu trong tiếng Việt hiện đại, vừa giữ được ý nghĩa tụ họp và tính thánh.
- source_word: יִהְיֶה לָכֶם
  choice: anh em phải có
  rationale: Diễn đạt tự nhiên giá trị quy định của cấu trúc היה với đại từ chỉ đối tượng; “anh em” phù hợp với lời truyền cho cộng đồng và không hàm ý chỉ nam giới.
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: Trong hai ngày ấy, không được làm bất cứ công việc nào
  rationale: Giữ phạm vi bao quát của כָּל, nghĩa rộng của מְלָאכָה và sắc thái bị động của יֵעָשֶׂה, đồng thời diễn đạt rõ nghĩa thời gian của בָהֶם.
- source_word: אַךְ
  choice: chỉ được
  rationale: Trong ngữ cảnh này, từ này giới hạn lệnh cấm bằng cách nêu ngoại lệ duy nhất.
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: thức ăn cần thiết cho mỗi người
  rationale: Mệnh đề nói đến điều được ăn cho từng người. Cách dịch này truyền đạt tự nhiên ý thực phẩm cần cho việc ăn mà không hiểu נֶפֶשׁ theo nghĩa siêu hình là “linh hồn”.
- source_word: נֶפֶשׁ
  choice: người
  rationale: Trong quy định pháp luật này, נֶפֶשׁ chỉ một cá nhân, nên “người” là nghĩa rõ ràng và phù hợp nhất.
- source_word: הוּא לְבַדּוֹ יֵעָשֶׂה לָכֶם
  choice: chỉ được chuẩn bị
  rationale: Giữ sự nhấn mạnh tính duy nhất của ngoại lệ. Động từ có nghĩa đen là “được làm,” nhưng theo ngữ cảnh nói về thức ăn nên “được chuẩn bị” là cách diễn đạt tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo nghĩa cộng đồng, không giới hạn giới tính. Câu ngoại lệ được tái cấu trúc gọn để tránh lặp và làm rõ rằng chỉ việc chuẩn bị thức ăn cần thiết mới được phép; chú thích giữ lại cấu trúc sát nguyên văn.
