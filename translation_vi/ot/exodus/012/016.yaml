- from: Ngày thứ nhất, anh em phải có một cuộc hội họp thánh[a], và ngày thứ bảy cũng phải có một cuộc hội họp thánh. Trong hai ngày ấy, không được làm bất cứ công việc nào; chỉ được chuẩn bị thức ăn cần thiết cho mỗi người[b].
  to: Ngày thứ nhất, anh em phải có một cuộc hội họp thánh[a], và ngày thứ bảy cũng phải có một cuộc hội họp thánh. Trong những ngày ấy, không được làm bất cứ công việc nào; chỉ những gì mỗi người sẽ ăn mới được phép chuẩn bị cho anh em[b].
  rationale: Bản sửa tránh thêm ý “cần thiết,” giữ sự độc quyền của ngoại lệ bằng “chỉ,” và phản ánh rõ hơn cụm kết “được làm cho anh em.” Chú thích được chỉnh để giải thích đúng nêphesh và không đề xuất một phương án có thể đổi nghĩa của מִקְרָא קֹדֶשׁ.
