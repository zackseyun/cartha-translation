  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: vi
  text: Thời gian cư ngụ của con cái Y-sơ-ra-ên[a] tại Ai Cập là bốn trăm ba mươi năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số chứng tích cổ chép: “Thời gian cư ngụ của con cái Y-sơ-ra-ên và tổ phụ họ tại Ai Cập và Ca-na-an là bốn trăm ba mươi năm.”'
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: thời gian cư ngụ
  rationale: Danh từ này có thể chỉ sự cư ngụ, nơi cư ngụ hoặc thời gian cư ngụ. Trong câu này, con số 430 năm cho thấy trọng tâm là khoảng thời gian, nên “thời gian cư ngụ” vừa rõ nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ được thành ngữ giao ước truyền thống “các con của Y-sơ-ra-ên” nhưng dùng cách nói tiếng Việt quen thuộc và bao quát cộng đồng hậu duệ.
- source_word: אֲשֶׁר יָשְׁבוּ
  choice: là những người đã sống
  rationale: Phản ánh trực tiếp mệnh đề quan hệ số nhiều chỉ con cái Y-sơ-ra-ên; “sống” là cách dịch tự nhiên của ישׁב trong ngữ cảnh này.
- source_word: בְּמִצְרָיִם
  choice: tại Ai Cập
  rationale: Diễn đạt tự nhiên ý nghĩa địa điểm của giới từ בְּ cùng địa danh Ai Cập.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: bốn trăm ba mươi năm
  rationale: Sắp xếp số theo trật tự tự nhiên của tiếng Việt mà vẫn bảo toàn chính xác thời lượng được nêu.
theological_decisions:
- issue: 'Phạm vi 430 năm: chỉ thời gian tại Ai Cập hay cả thời kỳ các tổ phụ cư ngụ tại Ca-na-an'
  choice: 'Bản văn chính theo WLC/Masoret: thời gian cư ngụ của con cái Y-sơ-ra-ên tại Ai Cập là 430 năm.'
  alternative: Một số chứng tích cổ thêm tổ phụ và Ca-na-an, khiến 430 năm bao gồm thời gian cư ngụ tại cả Ca-na-an lẫn Ai Cập.
  rationale: Nguồn Hê-bơ-rơ được cung cấp chỉ ghi “tại Ai Cập”. Dị bản cổ có ảnh hưởng đến niên đại học nên được ghi ở chú thích, không đưa vào bản văn chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thời gian cư ngụ” làm rõ rằng מוֹשַׁב ở đây nói đến một khoảng thời gian; giữ cấu trúc mệnh đề quan hệ để không âm thầm giải quyết căng thẳng về niên đại.
