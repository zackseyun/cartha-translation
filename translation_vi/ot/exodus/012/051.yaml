  to: Vào chính ngày ấy, Yahweh đã đưa con cháu Israel[a] ra khỏi đất Ai Cập theo các đội ngũ của họ[b].
  rationale: Chỉnh nhẹ để câu văn hiện đại, trôi chảy hơn và để phản ánh minh thị hậu tố sở hữu trong cụm Hê-bơ-rơ chỉ các đội ngũ/đoàn ngũ của Israel. Không thay đổi nghĩa hay thu hẹp tính mơ hồ giữa sắc thái quân sự và tổ chức của צְבָאוֹת.
