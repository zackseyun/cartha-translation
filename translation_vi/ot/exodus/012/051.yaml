source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה הוֹצִ֨יא יְהוָ֜ה אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: vi
  text: Vào chính ngày ấy, Yahweh đã đưa con cháu Israel[a] ra khỏi đất Ai Cập theo các đội ngũ của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; cũng có thể dịch là “con cái Israel” hoặc “dân Israel”. Đây là cách nói mang tính tập thể và gia tộc.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “theo các đoàn quân của họ” hoặc “theo các đạo quân của họ”. Từ Hê-bơ-rơ có thể nhấn mạnh những nhóm có tổ chức khi Israel ra đi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Và
  rationale: Cấu trúc kể chuyện này mở đầu mệnh đề và nối tiếp diễn tiến. “Và” truyền đạt tự nhiên chức năng ấy trong tiếng Việt hiện đại mà không dùng công thức cổ “Và xảy ra rằng”.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: vào chính ngày ấy
  rationale: Thành ngữ nhấn mạnh thời điểm chính xác; “chính ngày ấy” giữ sắc thái nhấn mạnh và phù hợp với điểm nhìn hồi thuật.
- source_word: הוֹצִיא
  choice: đã đưa ... ra
  rationale: Thể Hiphil của יצא mang nghĩa khiến hoặc đưa ra. Cách dịch này giữ ý chủ động gây nên cuộc ra đi mà không xác định quá mức phương thức.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  rationale: Cụm Hê-bơ-rơ nguyên văn là “các con trai của Israel” nhưng được dùng theo nghĩa tập thể chỉ hậu duệ của Israel. “Con cháu Israel” giữ hình ảnh gia tộc và tự nhiên hơn trong tiếng Việt.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ra khỏi đất Ai Cập
  rationale: Giữ cả ý chuyển động ra khỏi và danh từ “đất/xứ” có trong nguyên văn.
- source_word: עַל צִבְאֹתָם
  choice: theo từng đội ngũ
  rationale: צָבָא có thể chỉ đạo quân, đoàn quân hoặc nhóm được tổ chức. Trong ngữ cảnh ra khỏi Ai Cập, “đội ngũ” giữ ý có tổ chức mà không buộc người đọc hiểu đây là các đơn vị chiến đấu.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng gồm bốn phụ âm. Giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Danh xưng tập thể בְּנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  alternative: các con trai Israel; dân Israel; người Israel
  rationale: Cách dịch này vừa phản ánh ngôn ngữ gia tộc của nguyên văn vừa bao quát cộng đồng trong ngữ cảnh, không biến cụm từ thành một nhãn sắc tộc thuần túy.
- issue: Sắc thái của צִבְאֹתָם
  choice: đội ngũ
  alternative: đạo quân; đoàn quân
  rationale: Từ này có thể mang sắc thái quân sự hoặc rộng hơn là những nhóm có tổ chức. “Đội ngũ” giữ được độ mở đó và tránh khẳng định rằng dân Israel lúc này đang là lực lượng chiến đấu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “con cháu Israel” để giữ sắc thái gia tộc trong cách diễn đạt tự nhiên; dùng “theo từng đội ngũ” để bảo tồn khả năng hiểu theo nghĩa các nhóm được tổ chức mà không quân sự hóa quá mức.
