  terminology: Giữ “Yahweh” phù hợp với chính sách danh riêng. “Con cháu Israel” là cách gọi tập thể tự nhiên trong tiếng Việt và vẫn giữ nét gia tộc; chú thích cần nêu rõ dạng sát chữ “các con trai của Israel”. “Đội ngũ” bảo lưu được sắc thái tổ chức của צָבָא mà không khẳng định quá mức rằng đây là các đơn vị tác chiến.
