  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יָּ֨קָם פַּרְעֹ֜ה לַ֗יְלָה ה֤וּא וְ/כָל עֲבָדָי/ו֙ וְ/כָל מִצְרַ֔יִם וַ/תְּהִ֛י צְעָקָ֥ה גְדֹלָ֖ה בְּ/מִצְרָ֑יִם כִּֽי אֵ֣ין בַּ֔יִת אֲשֶׁ֥ר אֵֽין שָׁ֖ם מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: vi
  text: Pha-ra-ôn dậy trong đêm, cùng với tất cả bề tôi của ông và cả Ai Cập[a]. Một tiếng kêu than lớn vang lên khắp Ai Cập, vì không nhà nào là không có người chết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cả Ai Cập” dùng tên đất nước theo nghĩa tập thể để chỉ dân chúng Ai Cập.
    reason: cultural_note
  - marker: b
    text: 'Sát nghĩa hơn: “không có một nhà nào mà tại đó không có một người chết.” “Nhà” cũng có thể được hiểu là gia đình hay hộ gia đình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: dậy
  rationale: Động từ קום ở thể Qal kể một hành động đã xảy ra. “Dậy” tự nhiên trong bối cảnh ban đêm, đồng thời không nói rõ hơn bản văn rằng Pha-ra-ôn đang ngủ hay thức.
- source_word: לַיְלָה הוּא
  choice: trong đêm
  rationale: Cụm từ xác định thời điểm ban đêm. “Trong đêm” vừa sát cấu trúc Hê-bơ-rơ vừa trang trọng, tự nhiên trong văn thuật chuyện.
- source_word: עֲבָדָיו
  choice: bề tôi của ông
  rationale: עֶבֶד có thể chỉ đầy tớ, nô lệ hoặc người phục vụ. Trong triều đình Pha-ra-ôn, “bề tôi” diễn đạt phù hợp những người thuộc quyền và phục vụ vua mà không mặc nhiên nhấn mạnh thân phận nô lệ.
- source_word: וְכָל מִצְרַיִם
  choice: và cả Ai Cập
  rationale: Bản Hê-bơ-rơ dùng địa danh Ai Cập theo nghĩa tập thể để chỉ dân chúng. Giữ cách nói hoán dụ “cả Ai Cập” bảo tồn hình thức và phạm vi bao quát của nguyên văn.
- source_word: צְעָקָה גְדֹלָה
  choice: một tiếng kêu than lớn
  rationale: צְעָקָה là tiếng kêu hoặc tiếng kêu than trong cảnh khốn cùng; גְדֹלָה nhấn mạnh mức độ lớn lao. Cách dịch này giữ cả nỗi đau lẫn cường độ mà không thêm ý riêng.
- source_word: כִּי
  choice: vì
  rationale: כִּי tại đây nêu nguyên nhân của tiếng kêu than, nên “vì” thể hiện rõ quan hệ nhân quả.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: không nhà nào là không có người chết
  rationale: Cấu trúc phủ định kép được giữ lại để bảo tồn sức nhấn mạnh của nguyên văn. “Nhà” phản ánh trực tiếp בַּיִת, dù từ này cũng có thể hàm ý gia đình hay hộ gia đình.
- source_word: מֵת
  choice: người chết
  rationale: Phân từ מֵת được dùng như danh từ, chỉ một người đã chết. “Người chết” ngắn gọn, tự nhiên và không xác định danh tính.
theological_decisions: []
translation_notes:
  register: Văn phong thuật chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ra-ôn” theo cách phiên âm quen thuộc trong tiếng Việt; “bề tôi” giữ sắc thái triều đình. Câu cuối bảo tồn phép phủ định kép đầy sức nhấn mạnh của tiếng Hê-bơ-rơ.
