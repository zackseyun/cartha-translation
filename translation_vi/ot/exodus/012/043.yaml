  terminology: Giữ “Yahweh,” “Môi-se,” “A-rôn,” và “lễ Vượt Qua” nhất quán, phù hợp. “Người ngoại quốc” là cách dịch trung tính, hiện đại cho בֶּן־נֵכָר; chú thích từ vựng bảo lưu thành ngữ gốc mà không áp đặt điều kiện như cắt bì.
  issues:
