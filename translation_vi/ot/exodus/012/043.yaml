source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: vi
  text: 'Yahweh phán với Môi-se và A-rôn: “Đây là quy định về lễ Vượt Qua: không người ngoại quốc[a] nào được ăn lễ Vượt Qua.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “con của sự xa lạ” hoặc “con của ngoại bang”, một thành ngữ chỉ người ngoại quốc.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời dưới dạng chuyển tự, thay vì thay thế bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Trong tiếng Việt, “phán” là cách diễn đạt tự nhiên, trang trọng khi Đức Chúa Trời nói, nhưng không thêm ý nghĩa ngoài động từ אָמַר.
- source_word: חֻקַּת הַפָּסַח
  choice: quy định về lễ Vượt Qua
  rationale: חֻקָּה chỉ một quy định đã được ấn định; “quy định” rõ nghĩa và tự nhiên hơn “điều lệ” trong văn cảnh này. הַפָּסַח được giữ với nghĩa rộng là lễ Vượt Qua.
- source_word: בֶּן נֵכָר
  choice: người ngoại quốc
  rationale: Đây là một thành ngữ Hê-bơ-rơ, theo nghĩa đen là “con của sự xa lạ/ngoại bang”, dùng để chỉ người thuộc dân ngoại; “người ngoại quốc” là cách nói hiện đại, rõ ràng mà không đưa thêm điều kiện không có trong câu.
- source_word: לֹא יֹאכַל בּוֹ
  choice: không ... nào được ăn lễ vật ấy
  rationale: Cấu trúc phủ định mang tính pháp lý được diễn đạt tự nhiên bằng “không ... nào được”. Đại từ có giới từ בּוֹ chỉ việc ăn từ vật thuộc lễ Vượt Qua; “lễ vật ấy” làm rõ đối tượng được ăn mà vẫn giữ liên hệ với lễ Vượt Qua.
theological_decisions:
- issue: Đối tượng bị loại khỏi việc ăn lễ Vượt Qua
  choice: người ngoại quốc
  alternative: người ngoại quốc chưa chịu cắt bì; người ngoài cộng đồng giao ước
  rationale: Riêng cụm בֶּן נֵכָר chỉ nói “người ngoại quốc/người thuộc ngoại bang”. Không đưa các điều kiện được trình bày ở văn cảnh kế tiếp vào ngay câu này.
- issue: Phạm vi nghĩa của הַפָּסַח
  choice: lễ Vượt Qua, với “lễ vật ấy” làm đối tượng được ăn
  alternative: sinh tế Vượt Qua; bữa ăn Vượt Qua
  rationale: Danh từ có thể chỉ lễ, sinh tế hoặc bữa ăn liên quan. Bản dịch giữ tên lễ trong mệnh đề đầu và dùng cách gọi trung tính “lễ vật ấy” trong mệnh đề nói về việc ăn, tránh thu hẹp toàn bộ thuật ngữ vào chỉ một nghĩa.
translation_notes:
  register: Văn phong kể chuyện–pháp lý trang trọng nhưng hiện đại. Dùng “phán” cho lời Đức Chúa Trời, “quy định” thay cho thuật ngữ pháp lý cổ, và viết các tên riêng theo dạng quen dùng trong tiếng Việt.
