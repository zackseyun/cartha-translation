base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/024.yaml
  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: vi
  text: Anh em phải tuân giữ điều này như một quy định cho anh em và con trai anh em đến đời đời.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “việc này” hoặc “lời này”. Từ Hê-bơ-rơ có thể chỉ một lời nói, một việc hay một sự việc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “con cái anh em” hoặc “hậu duệ anh em”. Nguyên văn Hê-bơ-rơ là “con trai anh em”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Anh em phải tuân giữ
  rationale: Động từ שׁמר trong ngữ cảnh luật lệ giao ước mang nghĩa gìn giữ và thi hành. “Tuân giữ” diễn đạt tự nhiên cả sự vâng theo lẫn duy trì; dạng số nhiều được thể hiện bằng “anh em”.
- source_word: הַדָּבָר הַזֶּה
  choice: điều này
  rationale: דָּבָר có thể chỉ lời, việc, sự việc hay điều đã nói đến. “Điều này” tự nhiên trong tiếng Việt và giữ được độ rộng ngữ nghĩa, ở đây quy chiếu đến việc giữ lễ Vượt Qua vừa được truyền dạy.
- source_word: לְחָק
  choice: như một quy định
  rationale: חֹק chỉ điều được ấn định, luật lệ hay quy chế. “Quy định” giữ sắc thái có tính bắt buộc và lâu dài mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: cho anh em và con trai anh em
  rationale: Bản Hê-bơ-rơ chuyển từ lời truyền bảo số nhiều sang đại từ số ít tập thể, rồi nói rõ “các con trai của ngươi”. Tiếng Việt dùng “anh em” theo đối tượng tập thể và giữ “con trai” để phản ánh hình thức từ vựng của nguyên bản.
- source_word: עַד עוֹלָם
  choice: đến đời đời
  rationale: Cụm עַד עוֹלָם diễn tả thời hạn kéo dài liên tục hoặc vĩnh viễn. “Đến đời đời” phù hợp văn phong Kinh Thánh trang trọng và bảo toàn sức nặng của nghĩa.
theological_decisions:
- issue: Phạm vi kế thừa giao ước trong cụm “con trai anh em”
  choice: Giữ “con trai anh em” trong chính văn
  alternative: con cái anh em; hậu duệ anh em
  rationale: Nguyên bản nói cụ thể “các con trai”. Cách dịch chính văn giữ nguyên hình thức ấy, không tự ý mở rộng thành ngôn ngữ trung tính; chú thích cho biết những cách hiểu rộng hơn có thể có trong bối cảnh gia đình và các thế hệ kế tiếp.
- issue: Sự chuyển đổi số của đại từ
  choice: Dịch tự nhiên bằng “anh em” xuyên suốt câu
  alternative: các ngươi ... ngươi và các con trai ngươi
  rationale: Động từ đầu câu ở số nhiều, còn לְךָ và các hậu tố sau đó ở số ít, có thể là số ít tập thể nói với toàn dân. Tiếng Việt lặp “anh em” giúp câu sáng rõ mà không áp đặt một cá nhân riêng biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng như cách xưng hô tập thể, tránh sắc thái cổ của “các ngươi”. Hai dấu chú thích đều xuất hiện trong chính văn.
