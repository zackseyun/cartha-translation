  to: Các ngươi hãy lấy một bó cây bài hương, nhúng bó ấy vào máu trong chậu[a], rồi dùng bó ấy bôi máu trong chậu lên xà ngang và hai cột cửa. Không ai trong các ngươi được ra khỏi cửa nhà mình cho đến sáng.
  rationale: Bản sửa làm rõ bó bài hương là vật được nhúng và được dùng để bôi máu lên khung cửa, đồng thời thay cách gọi bộ phận kiến trúc bằng “xà ngang” tự nhiên hơn. Chú thích từ vựng được giữ nguyên vì phản ánh đúng sự bất định có thật của saph.
