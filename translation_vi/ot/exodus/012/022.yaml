  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: vi
  text: Các ngươi hãy lấy một bó cây bài hương, nhúng bó ấy vào máu trong chậu[a], rồi dùng bó ấy bôi máu trong chậu lên xà ngang và hai cột cửa. Không ai trong các ngươi được ra khỏi cửa nhà mình cho đến sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “ngưỡng cửa” thay cho “chậu” (tiếng Hê-bơ-rơ: saph). Ở đây chọn “chậu” vì máu được nói là ở trong đó và bó bài hương được nhúng vào đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: một bó cây bài hương
  rationale: אֲגֻדָּה chỉ một bó được gom hoặc buộc lại; “một bó” tự nhiên và cụ thể. “Cây bài hương” là cách gọi truyền thống cho אֵזוֹב, đồng thời không khẳng định chắc chắn hơn mức có thể về loài thực vật.
- source_word: בַּדָּם
  choice: vào máu
  rationale: Sau động từ טבל (“nhúng”), giới từ ב đánh dấu chất mà vật được nhúng vào; tiếng Việt tự nhiên dùng “nhúng vào máu”.
- source_word: הַסַּף
  choice: chậu
  rationale: Ngữ cảnh nói máu ở trong vật này và bó bài hương được nhúng vào đó, nên nghĩa một vật chứa như “chậu” phù hợp nhất. Nghĩa “ngưỡng cửa” vẫn được giữ trong chú thích.
- source_word: וְהִגַּעְתֶּם
  choice: bôi lên
  rationale: Dạng Hiphil của נגע diễn tả làm cho máu tiếp xúc với các phần của khung cửa. “Bôi lên” truyền đạt hành động nghi lễ tự nhiên trong tiếng Việt, không thêm sắc thái mạnh như “đập” hay “quệt”.
- source_word: הַמַּשְׁקוֹף
  choice: thanh ngang phía trên
  rationale: Chỉ bộ phận nằm ngang ở phía trên ô cửa. Cách diễn đạt này dễ hiểu hơn thuật ngữ kiến trúc ít thông dụng mà vẫn chính xác.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: hai cột cửa
  rationale: מְזוּזוֹת là hai trụ đứng hai bên cửa; “hai cột cửa” ngắn gọn và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: מִן הַדָּם
  choice: lấy máu
  rationale: מִן chỉ lượng máu được lấy từ chậu để dùng trên khung cửa. “Lấy máu trong chậu ấy bôi lên” diễn đạt rõ quan hệ nguồn và phương tiện.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: Không một ai trong các ngươi được bước ra
  rationale: 'אִישׁ sau lệnh cấm số nhiều có ý nghĩa phân phối: không cá nhân nào thuộc nhóm được ra ngoài. Cách dịch này tự nhiên và không giới hạn mệnh lệnh chỉ cho nam giới.'
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: khỏi cửa nhà mình
  rationale: פֶּתַח là lối mở hoặc cửa ra vào. “Nhà mình” giữ ý nghĩa phân phối của hậu tố số ít mà tự nhiên hơn trong tiếng Việt so với đại từ giống đực.
- source_word: עַד בֹּקֶר
  choice: cho đến sáng
  rationale: Cách dịch trực tiếp, tự nhiên của cụm chỉ thời gian này.
theological_decisions:
- issue: Cách diễn đạt phân phối có giống ngữ pháp אִישׁ ... בֵּיתוֹ
  choice: Không một ai trong các ngươi được bước ra khỏi cửa nhà mình
  alternative: Mỗi người trong các ngươi không được bước ra khỏi cửa nhà người ấy
  rationale: Tiếng Hê-bơ-rơ dùng danh từ và hậu tố giống đực số ít theo nghĩa phân phối. Trong tiếng Việt, “không một ai ... nhà mình” bảo toàn phạm vi cá nhân của lệnh cấm mà không gây hiểu lầm rằng lệnh chỉ áp dụng cho nam giới.
- issue: Nghĩa của הַסַּף trong câu này
  choice: chậu
  alternative: ngưỡng cửa
  rationale: Máu được nói là ở “trong” הַסַּף và bó bài hương được nhúng vào đó, nên nghĩa vật chứa được ưu tiên. Vì “ngưỡng cửa” là một khả năng từ vựng có thật, phương án ấy được nêu trong chú thích thay vì bị loại bỏ im lặng.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và dễ hiểu trong tiếng Việt hiện đại. Dùng “các ngươi” để thể hiện lời truyền trực tiếp số nhiều trong bối cảnh luật lệ cổ; dùng “thanh ngang phía trên” thay cho thuật ngữ kiến trúc chuyên môn. Dấu chú thích [a] xuất hiện ngay sau từ liên quan.
