  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: vi
  text: Đó là một đêm canh thức[a] dành cho Yahweh, để Ngài đưa họ ra khỏi đất Ai Cập. Chính đêm này là đêm canh thức dành cho Yahweh, để tất cả con cái Israel tuân giữ qua các thế hệ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đêm canh giữ” hoặc “đêm tuân giữ”. Từ Hê-bơ-rơ שִׁמֻּרִים liên hệ đến việc canh giữ hoặc gìn giữ; trong ngữ cảnh này, từ ấy cũng có thể hàm ý sự cử hành tưởng niệm.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: một đêm canh thức
  rationale: Dạng liên kết לֵיל đi với שִׁמֻּרִים tạo thành cụm “đêm canh thức”. Cách dịch này giữ được cả sắc thái thức canh lẫn việc gìn giữ, tưởng niệm đêm ấy.
- source_word: לַיהוָה
  choice: dành cho Yahweh
  rationale: Giới từ לְ biểu thị mối liên hệ hoặc sự dâng dành; “dành cho” tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành chỉ sở hữu hay chỉ hướng đến.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước được nêu trực tiếp trong bản Hê-bơ-rơ, thay vì thay thế bằng một tước hiệu.
- source_word: לְהוֹצִיאָם
  choice: để Ngài đưa họ ra
  rationale: Động từ nguyên thể với לְ diễn tả mục đích hoặc kết quả. Đại từ “Ngài” làm rõ chủ thể được ngầm hiểu là Yahweh trong tiếng Việt mà không thay đổi nội dung.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ra khỏi đất Ai Cập
  rationale: Giữ danh từ אֶרֶץ (“đất, xứ”) có mặt trong nguyên văn.
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: Chính đêm này
  rationale: “Chính” chuyển tải sự nhấn mạnh của đại từ הוּא kết hợp với danh từ xác định và từ chỉ định הַזֶּה.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: dành cho toàn thể con cái Israel
  rationale: “Con cái Israel” giữ hình ảnh gia tộc và giao ước của בְּנֵי יִשְׂרָאֵל; “toàn thể” chuyển tải כָּל.
- source_word: לְדֹרֹתָם
  choice: qua các thế hệ
  rationale: Diễn đạt tự nhiên ý nghĩa tiếp nối trong các thế hệ kế tiếp, không ấn định cụ thể cách thức cử hành.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה. “Yahweh” bảo tồn tư cách danh riêng và không thay bằng tước hiệu.
- issue: Sắc thái của שִׁמֻּרִים trong bối cảnh lịch sử và thờ phượng
  choice: đêm canh thức
  alternative: đêm thức canh; đêm phải tuân giữ; đêm tưởng niệm
  rationale: “Canh thức” giữ được sự căng nghĩa giữa việc thức canh và việc gìn giữ, cử hành để tưởng niệm; không thu hẹp từ này thành chỉ một nghi lễ hoặc chỉ hành động không ngủ.
- issue: Chủ thể ngầm của לְהוֹצִיאָם
  choice: Ngài, tức Yahweh, đưa họ ra
  alternative: để đưa họ ra; khi họ được đưa ra
  rationale: Ngữ cảnh và mối liên kết với לַיהוָה cho thấy Yahweh là chủ thể của hành động. Thêm “Ngài” giúp câu tiếng Việt rõ nghĩa, trong khi “để” vẫn giữ quan hệ mục đích hoặc kết quả của động từ nguyên thể.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Giữ lối gọi “con cái Israel” để phản ánh hình ảnh gia tộc trong nguyên văn; lặp lại “dành cho Yahweh” nhằm bảo tồn cấu trúc và điểm nhấn của câu Hê-bơ-rơ.
