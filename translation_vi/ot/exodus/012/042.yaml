  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: đêm, Yahweh, việc đưa họ ra khỏi đất Ai Cập, sự nhấn mạnh “chính đêm này”, và tính liên tục qua các thế hệ. Tuy nhiên, cụm lặp “dành cho” ở vế cuối không diễn đạt rõ chức năng của לְכָל בְּנֵי יִשְׂרָאֵל trong ngữ cảnh: đêm này là điều toàn thể con cái Israel phải/được tuân giữ. Chuyển thành “để tất cả con cái Israel tuân giữ” bảo tồn sắc thái tuân giữ/cử hành của שִׁמֻּרִים mà không xác định quá mức ai là chủ thể của sự canh thức trong vế đầu.'
  naturalness: “Đêm canh thức” phù hợp văn phong Kinh Thánh hiện đại và giữ được tính đa nghĩa. “Toàn thể con cái Israel” hơi nặng; “tất cả con cái Israel” tự nhiên hơn. Chú thích hiện có dùng “mang ý thức canh” không tự nhiên và các phương án “đêm thức canh”, “đêm được gìn giữ, tuân giữ” chưa mạch lạc trong tiếng Việt.
  terminology: Giữ “Yahweh” nhất quán với quyết định dự án. “Đất Ai Cập” phản ánh אֶרֶץ מִצְרָיִם. “Con cái Israel” bảo tồn cách gọi בני ישראל. “Canh thức” và “tuân giữ” cùng cho phép duy trì độ căng nghĩa giữa canh giữ và cử hành/tưởng niệm của שִׁמֻּרִים.
