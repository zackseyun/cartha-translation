revisions:
- from: Nhưng mọi nô lệ của một người, được mua bằng bạc[a], thì sau khi ngươi làm phép cắt bì cho người ấy[b], người ấy mới được ăn lễ ấy.
  to: Nhưng mọi nô lệ của một người, được mua bằng bạc[a], thì sau khi ngươi cắt bì cho người ấy[b], người ấy mới được ăn lễ Vượt Qua.
  rationale: Sửa tối thiểu để tiếng Việt tự nhiên hơn và làm rõ đối tượng của “ăn” theo ngữ cảnh trực tiếp của lễ Vượt Qua. Bản sửa vẫn giữ điều kiện cắt bì, trật tự hành động, và sắc thái cho phép của nguyên văn.
