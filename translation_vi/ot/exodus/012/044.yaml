source:
  edition: WLC
  text: וְ/כָל עֶ֥בֶד אִ֖ישׁ מִקְנַת כָּ֑סֶף וּ/מַלְתָּ֣ה אֹת֔/וֹ אָ֖ז יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: vi
  text: Nhưng mọi nô lệ của một người, được mua bằng bạc[a], thì sau khi ngươi cắt bì cho người ấy[b], người ấy mới được ăn lễ Vượt Qua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “được mua bằng tiền”.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là người ấy chỉ được dự bữa ăn lễ Vượt Qua sau khi đã được cắt bì.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: Nhưng mọi
  rationale: וְ nối quy định này với việc loại trừ người ngoại bang ở câu trước; “nhưng” diễn đạt tự nhiên sắc thái tương phản, còn “mọi” giữ lực phân bố của כָּל.
- source_word: עֶבֶד אִישׁ
  choice: nô lệ của một người
  rationale: עֶבֶד trong bối cảnh một người được mua bằng tiền chỉ thân phận nô lệ, không nên làm nhẹ thành “đầy tớ”; אִישׁ chỉ người chủ theo lối diễn đạt pháp lý số ít.
- source_word: מִקְנַת כָּסֶף
  choice: được mua bằng bạc
  rationale: Cụm từ nói sát là một sự mua bằng bạc; cách dịch này giữ hình ảnh nguyên ngữ, đồng thời “bạc” trong ngữ cảnh đóng vai trò tiền tệ.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: sau khi ngươi làm phép cắt bì cho người ấy
  rationale: Động từ hoàn thành có liên từ trong chuỗi quy định biểu thị hành động phải thực hiện trước; “ngươi” giữ lời xưng hô ngôi hai số ít của nguyên văn.
- source_word: אָז
  choice: mới
  rationale: Trong cấu trúc “sau khi… mới…”, từ này diễn đạt tự nhiên hệ quả chỉ có sau điều kiện tiên quyết mà אָז đánh dấu.
- source_word: יֹאכַל בּוֹ
  choice: người ấy mới được ăn lễ ấy
  rationale: Dạng chưa hoàn thành ở đây có nghĩa cho phép tham dự; בּוֹ quy chiếu về lễ Vượt Qua trong ngữ cảnh, nên “ăn lễ ấy” tự nhiên và rõ hơn cách dịch từng chữ.
theological_decisions:
- issue: Thuật ngữ chỉ thân phận bị sở hữu trong luật giao ước
  choice: nô lệ
  alternative: đầy tớ
  rationale: Việc người này được mua bằng bạc khiến thân phận lệ thuộc và bị sở hữu trở thành nét nghĩa nổi bật; “nô lệ” phản ánh trung thực thực trạng xã hội mà không dùng uyển ngữ.
- issue: Điều kiện để người nô lệ dự lễ Vượt Qua
  choice: chỉ được ăn sau khi chịu cắt bì
  alternative: cắt bì và rồi sẽ ăn, không nhấn mạnh sự cho phép
  rationale: Trình tự וּמַלְתָּה ... אָז יֹאכַל trình bày phép cắt bì như điều kiện có trước việc được tham dự, nhưng không bổ sung lý giải thần học ngoài điều nguyên văn nói.
- issue: Cách thể hiện chủ thể אִישׁ
  choice: một người
  alternative: một người đàn ông
  rationale: Trong cụm pháp lý này, אִישׁ xác định một cá nhân làm chủ; “một người” truyền đạt chức năng ấy tự nhiên trong tiếng Việt mà không phủ nhận dạng giống đực của tiếng Hê-bơ-rơ.
translation_notes:
  register: Văn phong pháp lý, trang trọng nhưng hiện đại. Dùng “nô lệ” để không che nhẹ thực trạng mua và sở hữu con người; dùng “ngươi” nhằm giữ lời truyền phán trực tiếp ở ngôi hai số ít. Cấu trúc “sau khi… mới được…” làm rõ trình tự điều kiện của câu Hê-bơ-rơ.
