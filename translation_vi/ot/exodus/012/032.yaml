  - severity: low
    issue: Cụm “bầy chiên dê”
    rationale: Dù phản ánh đúng phạm vi của צֹאן, cách nói “bầy chiên và dê” rõ ràng và tự nhiên hơn đối với độc giả Việt hiện đại.
