source:
  edition: WLC
  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: vi
  text: Hãy đem cả bầy chiên và dê lẫn đàn bò của các ngươi đi, đúng như các ngươi đã nói; hãy đi, và cũng hãy chúc phước cho ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy chúc phước cho cả ta nữa.” Cách nói của Pha-ra-ôn có thể nhấn mạnh rằng chính ông cũng mong được chúc phước khi dân Israel ra đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: cả bầy chiên dê lẫn đàn bò của các ngươi
  rationale: Cặp גַּם...גַּם nhấn mạnh cả hai loại gia súc. צֹאן chỉ chung gia súc nhỏ, nhất là chiên và dê; בָּקָר chỉ bò hoặc gia súc lớn. Cách diễn đạt này vừa tự nhiên trong tiếng Việt vừa giữ được sự phân biệt của nguyên văn.
- source_word: קְחוּ
  choice: Hãy đem ... đi
  rationale: Mệnh lệnh số nhiều của לקח trong ngữ cảnh cho phép dân Israel rời khỏi Ai Cập cùng gia súc. “Đem ... đi” thể hiện rõ hướng rời đi hơn “lấy” đơn thuần.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: đúng như các ngươi đã nói
  rationale: Giữ lực so sánh của כַּאֲשֶׁר và cho thấy Pha-ra-ôn nhượng bộ đúng theo điều Môi-se và A-rôn đã yêu cầu.
- source_word: וָלֵכוּ
  choice: Hãy đi đi
  rationale: הלכה ở đây là mệnh lệnh rời khỏi nơi ấy. Lối lặp “đi đi” tự nhiên, dứt khoát và phù hợp với lời thúc giục trong ngữ cảnh.
- source_word: וּבֵרַכְתֶּם
  choice: và cũng hãy chúc phước
  rationale: ברך ở thể piel có nghĩa cơ bản là “chúc phước”. Bản dịch không giải thích thêm phương thức hay nguồn của phước lành.
- source_word: גַּם אֹתִי
  choice: cho ta
  rationale: Đại từ אֹתִי chỉ chính Pha-ra-ôn là đối tượng được thêm vào trong lời xin chúc phước. Ý nhấn mạnh tiềm tàng của גַּם được ghi nhận trong chú thích.
theological_decisions:
- issue: Bản chất lời Pha-ra-ôn xin được chúc phước
  choice: Diễn đạt như một lời xin chúc phước trực tiếp, không xác định đó là lời cầu thay với Đức Chúa Trời hay lời chúc lành khi từ biệt.
  alternative: Hiểu cụ thể là Pha-ra-ôn xin Môi-se và A-rôn cầu xin Đức Chúa Trời ban phước cho mình, hoặc chỉ xin một lời chúc thiện lành lúc chia tay.
  rationale: Động từ ברך nêu rõ hành động chúc phước, nhưng câu không nói rõ cách thức hay sắc thái cụ thể; vì vậy cần giữ nguyên sự mở nghĩa và căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” và “ta” để phản ánh lời của vua nói với người dưới quyền; “bầy chiên dê” và “đàn bò” làm rõ hai danh từ tập hợp Hê-bơ-rơ mà không dùng thuật ngữ chuyên môn.
