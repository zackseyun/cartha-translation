  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
translation:
  language: vi
  text: Trong đêm này[a], họ phải ăn thịt được nướng bằng lửa[b]; họ phải ăn thịt ấy với bánh không men và rau đắng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong đêm ấy.” Nguyên văn Hê-bơ-rơ là “trong/vào đêm này,” chỉ chính đêm diễn ra bữa ăn Vượt Qua.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “thịt nướng bằng lửa,” nhấn mạnh thịt phải được làm chín bằng cách nướng chứ không theo phương pháp khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: họ phải ăn
  rationale: Trong ngữ cảnh chỉ thị nghi lễ, dạng động từ này mang sắc thái quy định; “phải ăn” truyền đạt tự nhiên tính bắt buộc trong tiếng Việt hiện đại.
- source_word: הַבָּשָׂר
  choice: thịt
  rationale: Trong ngữ cảnh thực phẩm, “thịt” là cách dịch tự nhiên và chính xác hơn “xác thịt”.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: ngay trong đêm ấy
  rationale: Cụm từ chỉ chính đêm đang được nói đến. “Đêm ấy” hợp với mạch văn tiếng Việt, còn “ngay trong” giữ sắc thái xác định của cụm Hê-bơ-rơ.
- source_word: צְלִי אֵשׁ
  choice: được nướng trên lửa
  rationale: Diễn đạt rõ phương pháp nấu bằng lửa, phù hợp với sự đối lập với luộc ở câu kế tiếp.
- source_word: וּמַצּוֹת
  choice: cùng với bánh không men
  rationale: מַצּוֹת chỉ bánh không dùng men; “cùng với” diễn đạt tự nhiên quan hệ món ăn kèm trong tiếng Việt.
- source_word: עַל
  choice: cùng với
  rationale: Dù nghĩa cơ bản thường là “trên”, trong ngữ cảnh ẩm thực ở đây từ này biểu thị sự ăn kèm.
- source_word: מְרֹרִים
  choice: rau đắng
  rationale: Danh từ số nhiều chỉ các loại rau có vị đắng dùng trong bữa ăn Vượt Qua; “rau đắng” ngắn gọn và quen thuộc trong tiếng Việt.
- source_word: יֹאכְלֻהוּ
  choice: họ phải ăn
  rationale: Lặp lại mệnh lệnh ở vế cuối để giữ cấu trúc nhấn mạnh của tiếng Hê-bơ-rơ, dù đại từ chỉ đối tượng được hiểu qua “thịt” ở vế trước.
