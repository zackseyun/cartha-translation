review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý pháp lý của câu: một quy định duy nhất dành cho cả người bản xứ lẫn גֵּר đang sống trong cộng đồng. Tuy nhiên, “Chỉ có một luật” thêm sắc thái loại trừ/đối lập mà tiếng Hê-bơ-rơ không nêu rõ; câu chỉ khẳng định “một luật” chung cho hai nhóm.'
  naturalness: Văn phong nhìn chung tự nhiên. Dùng “một luật sẽ áp dụng cho ... và ...” gọn, đúng văn cảnh quy định pháp lý, và tránh lối nhấn “chỉ có” không cần thiết. “Giữa anh em” giữ được ngôi thứ hai số nhiều theo cách xưng hô Kinh Thánh Việt ngữ hiện đại.
  terminology: '“Luật” phù hợp với תּוֹרָה trong văn cảnh pháp luật về lễ Vượt Qua. “Người bản xứ” phù hợp với אֶזְרָח. “Người ngoại kiều đang cư trú” truyền đạt khá sát גֵּר הַגָּר: người không phải bản xứ nhưng đang cư trú trong cộng đồng; không nên hiểu là khách vãng lai.'
  issues:
