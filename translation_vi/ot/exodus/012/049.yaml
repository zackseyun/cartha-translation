  yaml_path: translation/ot/exodus/012/049.yaml
  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: vi
  text: Một luật sẽ áp dụng cho người bản xứ và người ngoại kiều đang cư trú giữa anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Một chỉ dẫn sẽ dành cho người bản xứ và người ngoại quốc cư trú giữa anh em.”'
    reason: Nêu nghĩa rộng hơn của תּוֹרָה là “chỉ dẫn” và cách diễn đạt thay thế cho גֵּר là người ngoại quốc cư trú.
lexical_decisions:
- source_word: תּוֹרָה
  choice: luật
  rationale: Trong ngữ cảnh pháp lý về việc giữ lễ Vượt Qua, từ này chỉ quy định có tính ràng buộc; “luật” tự nhiên và chính xác hơn nghĩa rộng “sự chỉ dạy”.
- source_word: אַחַת
  choice: một
  rationale: Giữ nguyên ý nghĩa về một tiêu chuẩn pháp lý duy nhất, áp dụng cho cả hai nhóm.
- source_word: יִהְיֶה
  choice: áp dụng
  rationale: Động từ có nghĩa đen là “sẽ là”; trong câu luật pháp tiếng Việt, “áp dụng” diễn đạt tự nhiên điều luật có hiệu lực đối với cả hai nhóm mà không làm thay đổi nội dung.
- source_word: אֶזְרָח
  choice: người bản xứ
  rationale: Chỉ thành viên bản địa của cộng đồng, đồng thời tránh đưa vào khái niệm chính trị về quyền công dân thuộc thời kỳ sau.
- source_word: גֵּר
  choice: ngoại kiều
  rationale: Chỉ người không phải bản xứ nhưng đang cư trú trong cộng đồng và thuộc trật tự xã hội-pháp lý của cộng đồng ấy; “ngoại kiều” gọn và rõ hơn “người xa lạ”.
- source_word: הַגָּר
  choice: cư ngụ
  rationale: Phân từ này xác định ngoại kiều là người đang sống giữa cộng đồng; “cư ngụ” giữ được sắc thái cư trú của nguyên ngữ mà không cần lặp từ gượng gạo.
- source_word: בְּתוֹכְכֶם
  choice: giữa anh em
  rationale: Diễn đạt tự nhiên bối cảnh sống trong cộng đồng; đại từ số nhiều hướng đến cộng đồng giao ước.
theological_decisions:
- issue: Một tiêu chuẩn pháp lý cho người bản xứ và ngoại kiều cư trú
  choice: “một luật áp dụng cho… cũng như cho…”
  alternative: “một luật sẽ dành cho… và cho…”
  rationale: Cách dịch nêu rõ sự thống nhất của tiêu chuẩn pháp lý mà không suy rộng thành tuyên bố rằng mọi địa vị hay mọi quy định đều hoàn toàn giống nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng như đại từ số nhiều chỉ toàn cộng đồng; “ngoại kiều cư ngụ” diễn đạt địa vị người nước ngoài đang sống lâu dài trong cộng đồng, không chỉ là khách qua đường.
