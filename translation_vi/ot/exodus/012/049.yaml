revisions:
- from: Chỉ có một luật áp dụng cho người bản xứ cũng như cho ngoại kiều cư ngụ giữa anh em.[a]
  to: Một luật sẽ áp dụng cho người bản xứ và người ngoại kiều đang cư trú giữa anh em.[a]
  rationale: Bỏ “Chỉ có” để không thêm sắc thái loại trừ không được nêu trong tiếng Hê-bơ-rơ; thay “cũng như” bằng “và” để bám sát phép nối của nguyên ngữ. Thêm “đang” trước “cư trú” để phản ánh rõ hơn phân từ הַגָּר, nhưng không biến địa vị גֵּר thành một phạm trù pháp lý hiện đại.
