base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: vi
  text: Huyết ấy sẽ là dấu hiệu cho các con trên những ngôi nhà nơi các con ở. Khi Ta thấy huyết, Ta sẽ vượt qua các con[a], và sẽ không có tai họa nào giáng xuống các con để hủy diệt[b], khi Ta giáng đòn xuống đất Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta sẽ tha cho các con” hoặc “Ta sẽ che chở các con.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và sẽ không có tai họa nào giáng xuống các con do kẻ hủy diệt gây ra,” nếu hiểu từ “hủy diệt” là danh từ chỉ tác nhân.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: Huyết ấy sẽ là dấu hiệu cho các con
  rationale: Giữ lực tương lai-kết quả của động từ và nghĩa thông thường của אוֹת là “dấu hiệu”; “huyết ấy” chỉ lượng huyết đã được nói đến trước đó.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: trên những ngôi nhà nơi các con ở
  rationale: Diễn đạt trực tiếp vị trí của huyết trên các ngôi nhà có dân Israel ở, bằng tiếng Việt tự nhiên.
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: Khi thấy huyết
  rationale: Quan hệ phối hợp trong tiếng Hê-bơ-rơ có chức năng chỉ thời gian trong trình tự này; tiếng Việt không cần lặp đại từ “Ta” mà vẫn rõ chủ thể.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: Ta sẽ vượt qua các con
  rationale: “Vượt qua” bảo toàn hình ảnh từ vựng và mối liên hệ với tên lễ Vượt Qua, trong khi chú thích ghi nhận các sắc thái “tha” và “che chở”.
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: sẽ không có tai họa nào xảy ra giữa các con
  rationale: נֶגֶף được dịch là “tai họa”; “giữa các con” phản ánh בָכֶם mà không đổi thành ý nghĩa thuần túy cá nhân.
- source_word: לְמַשְׁחִית
  choice: để hủy diệt
  rationale: Dịch theo chức năng mục đích/kết quả gắn với “tai họa”, đồng thời không mặc nhiên biến phân từ thành một tác nhân có ngôi vị.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: khi Ta đánh phạt đất Ai Cập
  rationale: Cấu trúc nguyên thể với בְּ mang ý nghĩa thời gian. “Đánh phạt” truyền đạt hành động giáng đòn xét phạt tự nhiên hơn “đánh” đứng riêng trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của וּפָסַחְתִּי עֲלֵכֶם trong việc thiết lập lễ Vượt Qua
  choice: Ta sẽ vượt qua các con
  alternative: Ta sẽ tha cho các con; Ta sẽ che chở các con
  rationale: Bản văn chính giữ mối liên hệ từ vựng với lễ Vượt Qua, còn chú thích bảo tồn những cách hiểu khả dĩ về tác dụng của hành động mà không quyết định thay cho nguyên văn.
- issue: לְמַשְׁחִית chỉ sự hủy diệt hay một tác nhân hủy diệt
  choice: để hủy diệt
  alternative: do kẻ hủy diệt gây ra
  rationale: Dạng Hê-bơ-rơ có thể được hiểu theo chức năng động từ hoặc danh từ. Cách dịch chính không đưa một tác nhân có ngôi vị vào bản văn khi cú pháp câu này không bắt buộc, còn chú thích giữ lại cách đọc danh từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” để thể hiện lời Đức Chúa Trời phán với cộng đồng Israel; dùng “huyết” nhằm giữ sắc thái Kinh Thánh quen thuộc nhưng câu văn vẫn tự nhiên. Các dấu chú thích được đặt ngay sau cụm từ có phương án dịch khác.
