base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: vi
  text: '“Bấy giờ, tất cả các bề tôi này của ngươi sẽ xuống gặp ta và sấp mình trước ta[a], nói rằng: ‘Hãy ra đi, ngươi cùng toàn thể dân chúng theo chân ngươi.’ Sau đó, ta sẽ ra đi.” Rồi Môi-se rời khỏi Pha-ra-ôn trong cơn giận bừng bừng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quỳ lạy trước ta”; ở đây từ Hê-bơ-rơ diễn tả hành động cúi mình hoặc sấp mình để tỏ lòng quy phục, không nhất thiết là thờ phượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: sẽ xuống gặp ta
  rationale: Giữ hình ảnh chuyển động ‘đi xuống’ của ירד, đồng thời ‘gặp ta’ diễn đạt tự nhiên hướng chuyển động về phía người nói.
- source_word: עֲבָדֶיךָ
  choice: các bề tôi này của ngươi
  rationale: Trong bối cảnh triều đình, עבד chỉ những người phục vụ hoặc quan lại của Pha-ra-ôn; ‘bề tôi’ vừa phù hợp ngữ cảnh vừa không xác định quá hẹp chức vụ của họ.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: sấp mình trước ta
  rationale: Diễn tả rõ hành động cúi phục của שׁחה trong khung cảnh triều chính, không mặc nhiên biến nó thành hành vi thờ phượng.
- source_word: לֵאמֹר
  choice: mà nói
  rationale: Cách dẫn lời trực tiếp tự nhiên, giữ quan hệ với hành động đứng trước.
- source_word: צֵא אַתָּה
  choice: Hãy ra đi, ngươi
  rationale: ‘Ra đi’ giữ động từ יצא và mô-típ ra khỏi Ai Cập; đại từ ‘ngươi’ tái hiện אַתָּה được nhấn mạnh.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: cùng toàn thể dân chúng theo chân ngươi
  rationale: ‘Theo chân ngươi’ là thành ngữ tiếng Việt tự nhiên, gần với hình ảnh nguyên văn ‘ở nơi chân ngươi’ và truyền đạt ý những người đi theo Môi-se.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: Sau đó, ta sẽ ra đi
  rationale: Giữ trình tự thời gian và nhất quán với cách dịch יצא trước đó.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Rồi Môi-se rời khỏi Pha-ra-ôn
  rationale: Tiếng Hê-bơ-rơ không nêu lại chủ ngữ, nhưng ngữ cảnh xác định là Môi-se; nêu tên giúp tiếng Việt rõ ràng và tránh đại từ mơ hồ.
- source_word: בָּחֳרִי אָף
  choice: trong cơn giận bừng bừng
  rationale: Giữ hình ảnh sức nóng của cơn giận và cường độ mạnh của cụm từ Hê-bơ-rơ.
