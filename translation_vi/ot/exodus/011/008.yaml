revisions:
- from: 'Bấy giờ, tất cả các bề tôi này của ngươi sẽ xuống gặp ta và sấp mình trước ta[a], mà nói: ‘Hãy ra đi, ngươi cùng toàn thể dân chúng theo chân ngươi[b].’ Sau đó, ta sẽ ra đi.” Rồi Môi-se rời khỏi Pha-ra-ôn trong cơn giận bừng bừng.'
  to: '“Bấy giờ, tất cả các bề tôi này của ngươi sẽ xuống gặp ta và sấp mình trước ta[a], nói rằng: ‘Hãy ra đi, ngươi cùng toàn thể dân chúng theo chân ngươi.’ Sau đó, ta sẽ ra đi.” Rồi Môi-se rời khỏi Pha-ra-ôn trong cơn giận bừng bừng.'
  rationale: Chỉnh dấu câu để xác định đúng lời nói bao trùm của Môi-se và lời trích dẫn lồng của các bề tôi; thay “mà nói” bằng “nói rằng” cho tự nhiên hơn. Các lựa chọn dịch thuật còn lại được giữ nguyên. Chú thích b được giữ lại như chú thích thông tin cho cụm “theo chân ngươi”; khi xuất bản, cần đặt ký hiệu [b] ngay sau cụm này.
