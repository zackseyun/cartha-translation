translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô ‘ta–ngươi’ giữ sắc thái đối đầu trực tiếp giữa Môi-se và Pha-ra-ôn. ‘Bề tôi’ phù hợp bối cảnh cung đình; các tên riêng theo dạng thông dụng trong tiếng Việt.
