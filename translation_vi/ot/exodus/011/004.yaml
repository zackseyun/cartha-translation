source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: vi
  text: 'Rồi Môi-se nói[a]: “Yahweh phán: ‘Khoảng nửa đêm, chính Ta sẽ đi qua giữa Ai Cập.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Vào nửa đêm.” Cụm từ Hê-bơ-rơ có tiền tố có thể biểu thị ý xấp xỉ, nên dịch là “Khoảng nửa đêm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... nói
  rationale: Dạng waw-consecutive tiếp nối diễn tiến câu chuyện; “Rồi” diễn đạt tự nhiên quan hệ tuần tự trong tiếng Việt hiện đại.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng đã quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: כֹּה אָמַר
  choice: phán thế này
  rationale: Giữ công thức sứ giả tiên tri nhưng dùng lối diễn đạt tiếng Việt tự nhiên; “phán” phù hợp với lời của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: Khoảng nửa đêm
  rationale: Tiền tố כ־ ở đây tự nhiên biểu thị tính xấp xỉ; “khoảng” giữ sắc thái ấy mà không diễn đạt thời điểm quá chính xác.
- source_word: אֲנִי
  choice: chính Ta
  rationale: Đại từ chủ ngữ được nêu rõ trong tiếng Hê-bơ-rơ để tạo điểm nhấn; “chính Ta” chuyển tải sự nhấn mạnh đó. Viết hoa “Ta” theo quy ước kính trọng phổ biến khi Đức Chúa Trời tự xưng.
- source_word: יוֹצֵא
  choice: sẽ đi vào
  rationale: Phân từ mang ý nghĩa hành động sắp xảy ra trong lời loan báo. Khi kết hợp với בְּתוֹךְ, tiếng Việt tự nhiên diễn đạt hướng chuyển động là “đi vào”.
- source_word: בְּתוֹךְ
  choice: vào giữa
  rationale: Diễn tả chuyển động vào trong phạm vi Ai Cập, đồng thời giữ hình ảnh “ở giữa/bên trong” của từ nguồn.
- source_word: מִצְרָיִם
  choice: Ai Cập
  rationale: Tên địa danh tiêu chuẩn trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản nguồn dùng trực tiếp Tứ Tự Danh; giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái thời gian của כַּחֲצֹת הַלַּיְלָה
  choice: Khoảng nửa đêm
  alternative: Vào nửa đêm
  rationale: Tiền tố כ־ có thể chỉ sự xấp xỉ. Bản dịch giữ sắc thái này, không biến lời loan báo thành một mốc thời gian tuyệt đối chính xác.
- issue: Chủ thể thần linh đích thân hành động
  choice: chính Ta sẽ đi vào
  alternative: Ta sẽ đi vào
  rationale: Giữ điểm nhấn của đại từ אֲנִי mà không suy diễn thêm bản chất hoặc phương thức của hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu ngoặc kép lồng với dấu nháy đơn để phân biệt lời Môi-se với lời Yahweh được ông trích dẫn. Không thêm chú thích vì phương án chính đã trực tiếp giữ sắc thái xấp xỉ của כ־.
