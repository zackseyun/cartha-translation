id: EXO.11.1
reference: Exodus 11:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se: “Ta sẽ giáng thêm một tai họa[a] trên Pha-ra-ôn và trên Ai Cập. Sau đó, ông ta sẽ cho các ngươi rời khỏi đây. Khi cho các ngươi đi, ông ta sẽ nhất định đuổi sạch các ngươi khỏi đây[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ cũng có thể mang nghĩa “đòn giáng”, “vết đánh” hoặc “sự hành hạ”.
    reason: lexical_alternative
  - marker: b
    text: Cách diễn đạt Hê-bơ-rơ ở đây có ý nhấn mạnh; sát chữ là “đuổi ra, ông ta sẽ đuổi các ngươi ra”. Từ đi kèm cũng nhấn mạnh rằng việc đuổi đi là hoàn toàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng kể chuyện với waw liên tiếp đưa trình thuật tiến lên. “Bấy giờ” thể hiện trình tự tự nhiên; “phán” phù hợp với lời Đức Chúa Trời trong văn phong trang trọng tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng lối chuyển tự, thay vì thay thế bằng một tước hiệu.
- source_word: עוֹד נֶגַע אֶחָד
  choice: thêm một tai họa
  rationale: עוֹד mang nghĩa bổ sung, còn נֶגַע trong bối cảnh các cuộc phán xét trên Ai Cập được diễn đạt rõ nhất là “tai họa”; chú thích giữ lại phạm vi nghĩa rộng hơn.
- source_word: אָבִיא עַל
  choice: Ta sẽ giáng ... trên
  rationale: Hiphil của בוא diễn tả việc đưa hoặc giáng điều gì đến trên một đối tượng. “Giáng ... trên” tự nhiên trong tiếng Việt và giữ sắc thái phán xét.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: ông ta sẽ cho các ngươi rời khỏi đây
  rationale: שׁלח có thể là sai đi, cho đi hoặc để đi. Cách dịch này phù hợp với việc Pha-ra-ôn cuối cùng cho dân ra khỏi Ai Cập mà chưa làm mất sắc thái cưỡng bức được nói rõ ở mệnh đề sau.
- source_word: כְּשַׁלְּחוֹ
  choice: Khi cho các ngươi đi
  rationale: כְּ mang nghĩa thời gian trong ngữ cảnh này, nối hành động cho đi với việc đuổi ra ngay sau đó.
- source_word: כָּלָה גָּרֵשׁ יְגָרֵשׁ
  choice: ông ta sẽ nhất định đuổi sạch các ngươi
  rationale: כָּלָה nhấn mạnh tính toàn bộ, còn kết cấu nguyên mẫu tuyệt đối גָּרֵשׁ đi với động từ hữu hạn יְגָרֵשׁ nhấn mạnh sự chắc chắn và quyết liệt. “Nhất định đuổi sạch” truyền đạt cả hai sắc thái trong tiếng Việt tự nhiên.
- source_word: מִזֶּה
  choice: khỏi đây
  rationale: Chỉ nơi chốn hiện tại, tức Ai Cập; “khỏi đây” ngắn gọn và tự nhiên.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh riêng יְהוָה. Giữ “Yahweh” bảo tồn tư cách tên riêng và không thay nó bằng một tước hiệu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta” trong lời Yahweh và “các ngươi” cho đại từ số nhiều; dùng “ông ta” để chỉ Pha-ra-ôn nhằm tránh thêm sắc thái miệt thị không có trong nguyên văn. Dấu chú thích được đặt ngay sau từ hoặc mệnh đề mà chú thích giải thích.
