source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: vi
  text: Yahweh khiến dân ấy được người Ai Cập quý mến.[a] Hơn nữa, Môi-se là người rất cao trọng trong đất Ai Cập, trong mắt các tôi tớ của Pha-ra-ôn[c] và trong mắt dân chúng.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ban cho dân được ơn trong mắt người Ai Cập.”'
    reason: lexical_alternative
  - marker: c
    text: “Các tôi tớ của Pha-ra-ôn” trong bối cảnh này có thể chỉ các quan chức của ông.
    reason: cultural_note
  - marker: d
    text: “Dân chúng” ở cuối câu có lẽ chỉ dân cư Ai Cập nói chung, đối lập với các tôi tớ hoặc quan chức của Pha-ra-ôn.
    reason: contextual_note
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng quen thuộc và trang trọng trong tiếng Việt để biểu đạt Danh Tetragrammaton, thay vì thay bằng một tước hiệu.
- source_word: וַיִּתֵּן ... חֵן
  choice: khiến ... được quý mến
  rationale: Trong ngữ cảnh xã hội, thành ngữ này nói đến việc Yahweh làm cho dân Israel nhận được thiện cảm; cách diễn đạt này tự nhiên hơn lối dịch từng chữ “ban ân huệ” và không mang sắc thái thần học ngoài ý câu.
- source_word: הָעָם
  choice: dân ấy
  rationale: Giữ danh từ khái quát của nguyên văn, đồng thời “ấy” giúp người đọc nhận ra đây là dân Israel đã được nhắc đến trong ngữ cảnh.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: được người Ai Cập quý mến
  rationale: Chuyển thành ngữ “trong mắt” sang cách nói tiếng Việt tự nhiên, diễn đạt sự đánh giá thuận lợi của người Ai Cập.
- source_word: גַּם
  choice: Hơn nữa
  rationale: Thể hiện chức năng bổ sung và nhấn mạnh của mệnh đề tiếp theo.
- source_word: הָאִישׁ מֹשֶׁה
  choice: chính người là Môi-se
  rationale: Cố gắng bảo tồn yếu tố nhấn mạnh bất thường của הָאִישׁ trước tên riêng mà vẫn dễ hiểu trong tiếng Việt.
- source_word: גָּדוֹל מְאֹד
  choice: được xem là rất cao trọng
  rationale: Giữ độ rộng nghĩa về địa vị, uy thế và sự đánh giá cao, thay vì thu hẹp chỉ còn “quan trọng” hay “nổi tiếng”.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trong đất Ai Cập
  rationale: Giữ đầy đủ danh ngữ “đất Ai Cập” của nguyên văn.
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: trước mặt các tôi tớ của Pha-ra-ôn
  rationale: Giữ nghĩa trực tiếp của עֲבָדִים là “tôi tớ”; trong bối cảnh hoàng gia, từ này cũng có thể chỉ các quan chức.
- source_word: וּבְעֵינֵי הָעָם
  choice: lẫn trước mặt dân chúng
  rationale: “Dân chúng” phân biệt nhóm rộng hơn với các tôi tớ triều đình, nhưng không xác định quá mức thành “thường dân” hay lặp rõ “người Ai Cập” khi nguyên văn chỉ nói “dân”.
theological_decisions:
- issue: Cách chuyển dịch Danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh / Đức Giê-hô-va phán danh hiệu “CHÚA”
  rationale: Bảo tồn đây là danh riêng của Đức Chúa Trời, không thay thế bằng tước hiệu; dạng “Đức Giê-hô-va” dễ nhận biết và phù hợp văn phong Kinh Thánh tiếng Việt.
- issue: Nguồn gốc thiện cảm của người Ai Cập
  choice: Đức Giê-hô-va khiến dân ấy được quý mến
  alternative: Đức Giê-hô-va ban ân huệ cho dân ấy trước mắt người Ai Cập
  rationale: Giữ Yahweh là chủ thể tác động, đồng thời diễn đạt חֵן như thiện cảm xã hội chứ không biến nó thành một khái niệm cứu rỗi mang tính hệ phái.
- issue: Bản chất sự “lớn” của Môi-se
  choice: rất cao trọng
  alternative: rất vĩ đại / rất có thế lực / rất được kính trọng
  rationale: Nguyên văn không xác định đó chỉ là quyền lực, danh tiếng hay lòng kính trọng; “cao trọng” duy trì độ mở nghĩa trong bối cảnh sự nhìn nhận của triều thần và dân chúng.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Bản dịch ưu tiên tương đương tối ưu: chuyển thành ngữ חֵן בְּעֵינֵי sang cách nói tiếng Việt tự nhiên, nhưng dùng chú thích để bảo tồn hình thức Hê-bơ-rơ; đồng thời giữ sự mơ hồ hợp lý của גָּדוֹל và הָעָם cuối câu.'
