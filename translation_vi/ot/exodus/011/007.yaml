base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: vi
  text: Nhưng đối với toàn thể dân Israel, không một con chó nào sẽ sủa, dù là người hay súc vật, để các ngươi biết rằng Yahweh phân biệt giữa Ai Cập và Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְכֹל
  choice: Nhưng đối với toàn thể
  rationale: Liên từ tạo thế tương phản với tai họa giáng trên Ai Cập ở câu trước; giới từ cùng כֹל mở rộng phạm vi đến toàn thể Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình thức diễn đạt Hê-bơ-rơ nhưng dùng cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: sẽ chẳng một con chó nào thè lưỡi
  rationale: Động từ חרץ kết hợp với 'lưỡi' tạo một thành ngữ khó xác định hoàn toàn; 'thè lưỡi' giữ hình ảnh cụ thể và ý rằng chó không hề có phản ứng thù nghịch. Nghĩa theo ngữ cảnh được nêu ở chú thích.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: từ người cho đến súc vật
  rationale: Giữ cấu trúc chỉ toàn bộ phạm vi, bao gồm cả con người lẫn vật nuôi.
- source_word: לְמַעַן תֵּדְעוּן
  choice: để các ngươi biết
  rationale: Diễn đạt mệnh đề mục đích; đại từ số nhiều phản ánh hậu tố động từ Hê-bơ-rơ.
- source_word: יַפְלֶה
  choice: phân biệt
  rationale: Trong ngữ cảnh này, dạng Hiphil diễn tả việc Yahweh đặt sự khác biệt giữa hai phía.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: giữa Ai Cập và Israel
  rationale: Giữ nguyên hai tên gọi tập thể của các dân như trong bản Hê-bơ-rơ.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm 'Yahweh' giúp phân biệt danh riêng với tước hiệu.
- issue: Bản chất của sự phân biệt giữa Ai Cập và Israel
  choice: phân biệt
  alternative: đối xử kỳ diệu
  rationale: Ngữ cảnh đối chiếu số phận của hai cộng đồng, nên nghĩa 'phân biệt, đặt riêng ra' phù hợp hơn; không thêm lời giải thích về cơ chế hay nền tảng thần học của sự phân biệt ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ tên Yahweh và Israel theo dạng phiên âm thông dụng; dùng “các ngươi” vì đối tượng được nói với là số nhiều. Thành ngữ về con chó được giữ trong chính văn và giải nghĩa bằng chú thích để không xóa bỏ nét hình tượng cũng như độ mơ hồ của nguyên văn.
