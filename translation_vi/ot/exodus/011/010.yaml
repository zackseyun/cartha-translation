base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: vi
  text: Môi-se và A-rôn đã làm tất cả những dấu lạ ấy trước mặt Pha-ra-ôn[a]. Đức Giê-hô-va làm cho lòng Pha-ra-ôn trở nên cứng cỏi[b], và ông không cho con dân Y-sơ-ra-ên[c] ra khỏi đất mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả những phép lạ ấy.” Từ Hê-bơ-rơ có thể chỉ dấu hiệu kỳ diệu hoặc việc lạ lùng.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa sát hơn: “Đức Giê-hô-va làm cho lòng Pha-ra-ôn mạnh lên” hoặc “làm cho lòng Pha-ra-ôn vững chắc.” Trong ngữ cảnh, điều này diễn tả sự kháng cự cứng cỏi của Pha-ra-ôn.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; cụm từ này được dùng theo nghĩa tập thể để chỉ dân Y-sơ-ra-ên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Môi-se và A-rôn
  rationale: Dùng dạng tên riêng quen thuộc, rõ ràng trong tiếng Việt Kinh Thánh.
- source_word: עָשׂוּ
  choice: đã làm
  rationale: Giữ nghĩa rộng và trực tiếp của עשה; trong ngữ cảnh này kết hợp tự nhiên với “dấu lạ”.
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: tất cả những dấu lạ ấy
  rationale: מוֹפֵת chỉ các hiện tượng kỳ diệu có chức năng làm dấu chứng; “dấu lạ” truyền đạt đồng thời hai sắc thái này trong tiếng Việt.
- source_word: לִפְנֵי פַרְעֹה
  choice: trước mặt Pha-ra-ôn
  rationale: Cách diễn đạt tự nhiên, sát nghĩa về việc thực hiện ngay trong sự hiện diện của Pha-ra-ôn.
- source_word: וַיְחַזֵּק
  choice: làm cho ... trở nên cứng cỏi
  rationale: חזק về căn bản mang nghĩa làm mạnh hoặc làm vững; trong công thức nói về lòng Pha-ra-ôn, cụm này diễn tả sự kháng cự được củng cố mà không xóa đi hình ảnh gốc.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh riêng của Đức Chúa Trời đã quen thuộc và dễ nhận biết trong tiếng Việt, thay vì thay thế bằng một tước hiệu.
- source_word: לֵב פַּרְעֹה
  choice: lòng Pha-ra-ôn
  rationale: Cách chuyển ngữ trực tiếp và tự nhiên của kết cấu sở hữu Hê-bơ-rơ.
- source_word: שִׁלַּח
  choice: không cho ... ra khỏi
  rationale: Trong mạch Xuất Hành, động từ mang nghĩa không thả hoặc không cho dân ra đi; cách dịch này rõ nghĩa và kết hợp tự nhiên với מֵאַרְצוֹ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Y-sơ-ra-ên” nhưng hoạt động như tên gọi tập thể của dân tộc; “con dân Y-sơ-ra-ên” vừa giữ dấu vết quan hệ dòng dõi vừa bao hàm cộng đồng.
- source_word: מֵאַרְצוֹ
  choice: ra khỏi đất mình
  rationale: Đại từ chỉ về Pha-ra-ôn; “đất mình” tự nhiên trong lời kể tiếng Việt và tránh lặp tên.
theological_decisions:
- issue: Hành động của Đức Giê-hô-va đối với lòng Pha-ra-ôn
  choice: Đức Giê-hô-va làm cho lòng Pha-ra-ôn trở nên cứng cỏi
  alternative: Đức Giê-hô-va làm cho lòng Pha-ra-ôn mạnh mẽ/vững chắc
  rationale: Bản dịch giữ Đức Giê-hô-va là chủ thể trực tiếp của hành động, không làm nhẹ đi sự căng thẳng giữa quyền tể trị của Đức Chúa Trời và trách nhiệm của Pha-ra-ôn. Chú thích bảo lưu hình ảnh từ nguyên “làm mạnh/làm vững” của חזק.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh, cụm từ chỉ toàn thể dân Y-sơ-ra-ên chứ không chỉ nam giới; lựa chọn này diễn đạt chức năng tập thể mà vẫn gợi quan hệ dòng dõi vốn có trong nguyên văn.
- issue: Liên từ nối các mệnh đề
  choice: nên ông không cho
  alternative: và ông không cho
  rationale: וְ có thể đơn thuần nối tiếp, nhưng ở đây mệnh đề sau nêu kết quả của việc lòng Pha-ra-ôn trở nên cứng cỏi. “Nên” làm rõ quan hệ tự nhiên trong tiếng Việt mà không thay đổi chủ thể của hai hành động.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, với câu ngắn và từ ngữ dễ hiểu. Các tên riêng dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Bản chính ưu tiên cách diễn đạt tự nhiên, còn các sắc thái từ nguyên và phương án sát chữ được giữ trong chú thích.
