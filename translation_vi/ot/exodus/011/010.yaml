  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của nguyên văn: Môi-se và A-rôn thực hiện mọi dấu lạ trước Pha-ra-ôn; Đức Giê-hô-va trực tiếp làm lòng Pha-ra-ôn cứng cỏi; và Pha-ra-ôn không cho dân Y-sơ-ra-ên rời khỏi đất ông. Tuy nhiên, liên từ “nên” biến mệnh đề cuối thành hệ quả được nêu rõ, trong khi tiếng Hê-bơ-rơ chỉ dùng liên từ kể chuyện “và”.'
