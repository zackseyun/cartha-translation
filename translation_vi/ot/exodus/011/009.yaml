source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: vi
  text: 'Yahweh phán[a] với Môi-se: “Pha-ra-ôn sẽ không lắng nghe các ngươi[b], để các dấu lạ[c] của Ta được nhân lên trong xứ Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Yahweh đã phán với Môi-se.” Dạng động từ Hê-bơ-rơ ở đây là dạng quá khứ kể chuyện thông thường; cách dịch quá khứ hoàn thành nhằm liên kết lời này với diễn biến trước đó.'
    reason: alternative_reading
  - marker: b
    text: Hay “sẽ không nghe các ngươi” hoặc “sẽ không lưu tâm đến các ngươi.” Đại từ trong tiếng Hê-bơ-rơ ở số nhiều, chỉ Môi-se và A-rôn.
    reason: lexical_alternative
  - marker: c
    text: Hay “các kỳ công của Ta” hoặc “các điềm lạ của Ta.” Từ Hê-bơ-rơ có thể chỉ dấu lạ, kỳ công hoặc điềm lạ.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng dạng chuyển tự thông dụng, thay vì thay thế bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Dạng wayyiqtol thông thường tiếp diễn mạch kể chuyện trong quá khứ. “Phán” là cách diễn đạt tự nhiên, trang trọng khi Đức Chúa Trời nói.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: sẽ không nghe lời các con
  rationale: שׁמע với אֶל mang nghĩa nghe, lắng nghe hoặc lưu tâm. “Nghe lời” diễn đạt sự khước từ đáp ứng mà không đặc định quá mức thành “vâng phục”; “các con” phản ánh hậu tố số nhiều, bao gồm Môi-se và A-rôn.
- source_word: לְמַעַן
  choice: để
  rationale: Diễn đạt ngắn gọn và tự nhiên sắc thái mục đích của liên từ.
- source_word: רְבוֹת
  choice: được nhân lên
  rationale: Phản ánh ý gia tăng về số lượng của danh từ theo sau, đồng thời giữ cấu trúc trong đó chủ thể ngữ pháp là các dấu lạ.
- source_word: מוֹפְתַי
  choice: các dấu lạ của Ta
  rationale: מוֹפֵת có thể chỉ dấu lạ, kỳ công hoặc điềm lạ. “Dấu lạ” phù hợp văn mạch Xuất Hành và vẫn hàm ý tính phi thường.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trong đất Ai Cập
  rationale: Giữ rõ thành tố אֶרֶץ, thay vì rút gọn thành “tại Ai Cập”.
theological_decisions:
- issue: Mối liên hệ giữa việc Pha-ra-ôn khước từ và mục đích của Đức Chúa Trời
  choice: “để các dấu lạ của Ta được nhân lên”
  alternative: “và kết quả là các dấu lạ của Ta sẽ được nhân lên”
  rationale: לְמַעַן tự nhiên nhất mang sắc thái mục đích. Bản dịch giữ nguyên sự căng thẳng thần học giữa sự khước từ của Pha-ra-ôn và mục đích của Đức Chúa Trời, không bổ sung một lời giải thích về sự làm cứng lòng mà câu này không trực tiếp nêu ra.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—các con” để thể hiện lời Đức Chúa Trời nói với Môi-se cùng A-rôn, đồng thời tránh lối diễn đạt cổ quá mức. Tên riêng được viết theo dạng quen dùng trong tiếng Việt: Môi-se, Pha-ra-ôn, Ai Cập.'
