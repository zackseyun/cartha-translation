    rationale: “Phục dịch lệ thuộc” có thể làm mờ nghĩa thân phận nô lệ của từ Hê-bơ-rơ. Nên xác định rõ đây là một phụ nữ trong thân phận nô lệ, đồng thời vẫn nêu các phương án dịch truyền thống.
