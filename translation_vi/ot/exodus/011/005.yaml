source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: vi
  text: Mọi con đầu lòng trong xứ Ai Cập sẽ chết, từ con đầu lòng của Pha-ra-ôn, người ngồi trên ngai của mình, cho đến con đầu lòng của nữ nô lệ[a] ở sau cối xay, cùng mọi con đầu lòng của súc vật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ gái” hoặc “tỳ nữ”. Từ Hê-bơ-rơ chỉ một phụ nữ trong thân phận nô lệ; cụm “ở sau cối xay” gợi cảnh làm công việc xay hạt, một việc lao động địa vị thấp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: sẽ chết
  rationale: Động từ hoàn thành trong lời báo trước mang ý nghĩa tương lai chắc chắn; “sẽ chết” tự nhiên trong tiếng Việt và không biến lời tiên báo thành sự kiện quá khứ.
- source_word: כָּל בְּכוֹר
  choice: mọi con đầu lòng
  rationale: “Mọi” diễn đạt sắc thái phân phối của כָּל đi với danh từ số ít; “con đầu lòng” đủ rộng để dùng cho cả người lẫn súc vật mà không tự ý giới hạn thành con trai.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: trong đất Ai Cập
  rationale: Giữ hình thức địa lý của nguyên văn, đồng thời vẫn rõ nghĩa và trang trọng trong tiếng Việt.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: từ con đầu lòng ... cho đến con đầu lòng
  rationale: Bảo toàn cấu trúc chỉ toàn bộ phạm vi xã hội, từ địa vị cao nhất đến thấp nhất.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: Pha-ra-ôn, người ngồi trên ngai mình
  rationale: Mệnh đề quan hệ diễn đạt tự nhiên phân từ Hê-bơ-rơ và giữ nguyên hình ảnh về địa vị quân vương.
- source_word: הַשִּׁפְחָה
  choice: nữ nô lệ
  rationale: Danh từ chỉ một phụ nữ ở thân phận phục dịch lệ thuộc; cách dịch này không làm nhẹ đi sự tương phản xã hội với Pha-ra-ôn.
- source_word: אַחַר הָרֵחָיִם
  choice: ở sau cối xay
  rationale: Giữ hình ảnh cụ thể của vị trí làm công việc xay hạt, vốn gắn với lao động có địa vị thấp.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: cùng mọi con đầu lòng của súc vật
  rationale: בְּהֵמָה chỉ chung gia súc hoặc động vật nuôi, không chỉ riêng bò; “súc vật” là cách gọi gọn và quen thuộc trong văn cảnh này.
theological_decisions:
- issue: Cách dịch từ chỉ thân phận xã hội שִׁפְחָה
  choice: nữ nô lệ
  alternative: đầy tớ gái; tỳ nữ
  rationale: Câu này nhấn mạnh tai họa trải khắp các tầng lớp, từ hoàng gia đến người phụ nữ bị đặt trong thân phận nô lệ và làm việc xay hạt. “Nữ nô lệ” giữ rõ sự tương phản ấy mà không thêm một lập trường giáo phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp liệt kê “từ ... cho đến ...” của nguyên văn; tránh thêm “con trai” vì בְּכוֹר tự thân chỉ “con đầu lòng” và cũng được dùng ngay sau đó cho súc vật.
