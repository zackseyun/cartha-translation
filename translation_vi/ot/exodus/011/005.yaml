  - severity: low
    issue: Cụm từ “ngai mình”
    rationale: Cách nói này có thể hiểu được nhưng thiếu tự nhiên; “ngai của mình” diễn đạt rõ và trôi chảy hơn quan hệ sở hữu trong tiếng Việt hiện đại.
  - severity: low
