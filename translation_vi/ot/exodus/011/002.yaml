  - severity: low
    issue: Liên kết cú pháp bằng “rằng”
    rationale: Không sai nghĩa, nhưng dấu hai chấm sau lời truyền đạt tự nhiên và minh bạch hơn trong tiếng Việt, đồng thời giữ rõ hai mệnh lệnh liên tiếp của nguyên văn.
