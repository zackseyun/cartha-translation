base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: vi
  text: 'Hãy nói ngay cho dân chúng nghe: mỗi người nam hãy xin[a] người hàng xóm của mình những vật bằng bạc và những vật bằng vàng; mỗi người nữ cũng hãy xin người hàng xóm của mình như vậy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ được dịch là “xin” (ở cả hai lần trong câu) cũng có thể dịch là “mượn”. Tuy nhiên, động từ Hê-bơ-rơ có nghĩa là xin hoặc yêu cầu và tự nó không cho biết những vật này có phải được hoàn trả hay không.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: Hãy nói ngay
  rationale: Mệnh lệnh Piel דַּבֶּר được dịch trực tiếp là “hãy nói”; נָא ở đây biểu thị tính cấp thời, nên “ngay” tự nhiên hơn “xin vui lòng” trong lời Đức Chúa Trời truyền cho Môi-se.
- source_word: בְּאָזְנֵי הָעָם
  choice: cho dân chúng nghe
  rationale: Thành ngữ nghĩa đen là “vào tai dân”, tức nói công khai để dân nghe; cách diễn đạt này giữ ý nghe thấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: וְיִשְׁאֲלוּ
  choice: rằng ... hãy xin
  rationale: Dạng yiqtol mang sắc thái mệnh lệnh tiếp sau mệnh lệnh chính. “Hãy xin” phản ánh lực chỉ thị; שאל có nghĩa xin/hỏi/yêu cầu và tự nó không nói rằng đồ vật phải được hoàn trả.
- source_word: אִישׁ
  choice: mỗi người nam
  rationale: Danh từ giống đực số ít mang nghĩa phân phối, song song rõ ràng với “mỗi người nữ” ở vế sau.
- source_word: מֵאֵת רֵעֵהוּ
  choice: người hàng xóm của mình
  rationale: רֵעַ có thể chỉ người lân cận, bạn đồng hành hoặc người cùng cộng đồng; “người hàng xóm” phù hợp ngữ cảnh cư trú và không thu hẹp thành bạn thân.
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: và mỗi người nữ hãy xin người hàng xóm của mình
  rationale: Giữ cấu trúc phân phối và sự đối xứng nam–nữ của nguyên văn; “của mình” diễn đạt tự nhiên đại từ sở hữu phản thân theo từng chủ thể.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: những vật bằng bạc và những vật bằng vàng
  rationale: כְּלִי là từ rộng, có thể chỉ đồ vật, vật dụng hoặc vật chứa; “những vật” tránh xác định quá mức là trang sức hay bình chén.
theological_decisions:
- issue: Ý nghĩa của שאל khi dân Y-sơ-ra-ên nhận các vật quý
  choice: xin
  alternative: mượn
  rationale: Động từ Hê-bơ-rơ có nghĩa là xin, hỏi hoặc yêu cầu, không tự nó hàm ý nghĩa vụ hoàn trả. Vì “mượn” là cách dịch truyền thống có ảnh hưởng đến cách hiểu sự kiện, phương án ấy được ghi trong chú thích nhưng không đưa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ lối nói phân phối “mỗi người nam… mỗi người nữ” cùng độ rộng nghĩa của כְּלִי. Dấu chú thích [a] đặt sau toàn câu vì chú thích giải thích động từ “xin” xuất hiện ở cả hai vế.
