  yaml_path: translation/ot/exodus/011/006.yaml
  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: vi
  text: Sẽ có một tiếng kêu than lớn[a] khắp đất Ai Cập, một tiếng kêu than như thế chưa từng xảy ra trước đây và sau này cũng sẽ chẳng bao giờ xảy ra nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một tiếng kêu lớn” hoặc “một tiếng than khóc lớn.” Từ Hê-bơ-rơ צְעָקָה chỉ một tiếng kêu lớn, thường phát ra trong cảnh đau đớn hoặc khốn cùng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: sẽ vang lên
  rationale: Trong lời báo trước này, dạng động từ mang ý nghĩa tương lai. Kết hợp với danh từ chỉ tiếng kêu, “sẽ vang lên” tự nhiên trong tiếng Việt mà vẫn diễn đạt việc tiếng than khóc sẽ xuất hiện.
- source_word: צְעָקָה
  choice: tiếng than khóc
  rationale: Danh từ chỉ tiếng kêu lớn phát ra trong cảnh khốn cùng. Trong bối cảnh cái chết sắp xảy đến, “tiếng than khóc” truyền đạt rõ sắc thái đau đớn mà không giới hạn nó vào một kiểu biểu hiện duy nhất.
- source_word: גְדֹלָה
  choice: lớn
  rationale: Giữ sát tính từ Hê-bơ-rơ, nhấn mạnh mức độ và quy mô của tiếng than khóc hơn là chỉ riêng âm lượng.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: khắp đất Ai Cập
  rationale: Diễn đạt tự nhiên phạm vi bao trùm toàn bộ lãnh thổ được nêu trong nguyên văn.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: chưa từng xảy ra trước đây
  rationale: Động từ היה trong mệnh đề so sánh nói về một biến cố chưa từng xảy đến; cách dịch này rõ nghĩa và phù hợp tiếng Việt hiện đại.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: và sau này cũng chẳng bao giờ xảy ra nữa
  rationale: יסף dưới dạng phủ định mang nghĩa không tái diễn. “Chẳng bao giờ… nữa” thể hiện sức tuyệt đối của lời so sánh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đảo cụm chỉ phạm vi “Khắp đất Ai Cập” lên đầu câu để câu tiếng Việt tự nhiên và làm nổi bật quy mô toàn xứ; giữ cấu trúc so sánh tuyệt đối của nguyên văn.
