- from: Vực nước sâu phủ lấp chúng[a]; chúng chìm xuống đáy sâu như một hòn đá.
  to: Những vùng nước sâu bao phủ chúng[a]; chúng đi xuống vực sâu như một hòn đá.
  rationale: Bản sửa dùng cách nói tự nhiên hơn cho số nhiều תְּהֹמֹת, dịch כסה sát nghĩa là “bao phủ,” giữ ý nghĩa cơ bản “đi xuống” của ירד, và tránh đồng nhất מְצוֹלֹת với đáy biển. Chú thích bảo lưu các lựa chọn từ vựng hợp lý, gồm cách diễn đạt ngữ cảnh “chìm xuống.”
