translation_notes:
  register: Văn phong thi ca trang trọng nhưng dễ hiểu. Dùng “chúng” theo lối kể chuyện hiện đại để chỉ lực lượng Ai Cập đã được nhắc đến trong ngữ cảnh; giữ hai cách gọi gần nghĩa là “vực nước sâu” và “đáy sâu” nhằm phản ánh hai danh từ Hê-bơ-rơ khác nhau.
