translation:
  language: vi
  text: Những vùng nước sâu bao phủ chúng[a]; chúng đi xuống vực sâu như một hòn đá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vực sâu bao phủ chúng; chúng chìm xuống những nơi sâu thẳm như một hòn đá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: vực nước sâu
  rationale: Danh từ số nhiều chỉ những vùng nước sâu hoặc vực sâu. “Vực nước sâu” tự nhiên trong tiếng Việt, giữ được hình ảnh thi ca và làm rõ đây là vực nước trong ngữ cảnh biển.
- source_word: יְכַסְיֻמוּ
  choice: phủ lấp chúng
  rationale: Động từ כסה với hậu tố ngôi ba số nhiều giống đực có nghĩa là nước phủ lên và vùi lấp quân Ai Cập. “Phủ lấp” diễn đạt trực tiếp sức nước trùm kín họ.
- source_word: יָרְדוּ
  choice: chúng chìm xuống
  rationale: Nghĩa cơ bản là “đi xuống.” Trong ngữ cảnh xuống đáy biển, “chìm xuống” là cách nói tự nhiên mà vẫn giữ rõ chuyển động đi xuống.
- source_word: בִמְצוֹלֹת
  choice: đáy sâu
  rationale: מְצוֹלָה chỉ nơi sâu, đặc biệt là đáy sâu của biển. “Đáy sâu” phân biệt từ này với תְּהֹמֹת nhưng vẫn bảo toàn sự song hành thi ca.
- source_word: כְּמוֹ
  choice: như
  rationale: Từ so sánh thông dụng, tương đương tự nhiên là “như.”
- source_word: אָבֶן
  choice: một hòn đá
  rationale: “Một hòn đá” là cách diễn đạt tự nhiên trong tiếng Việt cho hình ảnh so sánh về sự chìm nhanh và nặng.
