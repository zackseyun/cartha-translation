  yaml_path: translation/ot/exodus/015/014.yaml
  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: vi
  text: Các dân đã nghe; họ run rẩy. Cơn đau đớn chụp lấy cư dân Phi-li-tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Các dân nghe; họ sẽ run rẩy. Sự quằn quại chụp lấy cư dân Phi-li-tin.” Thơ Hê-bơ-rơ có thể diễn tả cảnh cách sống động theo sắc thái hiện tại hoặc hướng về tương lai; từ được dịch “cơn đau đớn” cũng có thể chỉ sự quằn quại hoặc run rẩy.'
    reason: Bảo lưu sắc thái thời/thể của động từ chưa hoàn thành יִרְגָּזוּן và trường nghĩa của חִיל, mà không xác định quá mức hình ảnh đau đẻ hay chỉ riêng nỗi sợ.
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: nghe tin
  rationale: Động từ Qal hoàn thành ngôi ba số nhiều của שׁמע có nghĩa là “nghe”. Trong tiếng Việt, “nghe tin” diễn đạt tự nhiên việc các dân nghe biết sự kiện vừa được ca tụng trong bài ca.
- source_word: עַמִּים
  choice: các dân
  rationale: Dạng số nhiều của עם chỉ các cộng đồng sắc tộc chung quanh; “các dân” giữ được ý số nhiều và sắc thái thi ca mà không diễn giải quá mức thành các quốc gia chính trị.
- source_word: יִרְגָּזוּ/ן
  choice: run sợ
  rationale: רָגַז có thể chỉ run rẩy, chấn động hoặc bối rối. “Run sợ” kết hợp phản ứng thể chất với nguyên nhân là nỗi sợ, đồng thời phù hợp với văn cảnh thi ca.
- source_word: חִיל
  choice: nỗi kinh hoàng
  rationale: Danh từ này có thể chỉ sự quằn quại, đau đớn hoặc run rẩy. “Nỗi kinh hoàng” truyền đạt tình trạng khốn quẫn cả tinh thần lẫn thể chất mà không áp đặt hình ảnh đau đẻ vốn không được nói rõ ở đây.
- source_word: אָחַז
  choice: bao trùm
  rationale: Qal hoàn thành của אחז có nghĩa là nắm, bắt lấy hoặc chế ngự. Với chủ ngữ trừu tượng “nỗi kinh hoàng”, “bao trùm” tự nhiên trong tiếng Việt và vẫn diễn tả sức mạnh áp đảo; nghĩa sát hơn được ghi ở chú thích.
- source_word: יֹשְׁבֵי
  choice: cư dân
  rationale: Phân từ của ישׁב được dùng như danh từ để chỉ những người cư ngụ; “cư dân” là cách nói hiện đại, gọn và tự nhiên.
- source_word: פְּלָשֶׁת
  choice: Phi-li-ét
  rationale: Đây là địa danh chỉ vùng đất của người Phi-li-tin, không trực tiếp là tên dân tộc. Dùng dạng phiên âm địa danh “Phi-li-ét” để giữ sự phân biệt ấy.
theological_decisions:
- issue: Giá trị thời/thể của chuỗi động từ trong thơ ca
  choice: Dịch theo điểm nhìn hồi tưởng bằng “nghe tin thì run sợ” và “bao trùm”.
  alternative: 'Có thể hiểu theo sắc thái hiện tại hoặc hướng tới tương lai: “Các dân nghe tin và run rẩy; nỗi quằn quại chụp lấy cư dân Phi-li-ét.”'
  rationale: שָׁמְעוּ và אָחַז là các dạng hoàn thành, còn יִרְגָּזוּן là dạng chưa hoàn thành. Trong văn phong hồi tưởng–tiên báo của bài ca, chuỗi này có thể được trình bày như sự kiện đã xảy ra cách sống động, nhưng không nên loại bỏ hoàn toàn sắc thái hiện tại hoặc tương lai; chú thích bảo lưu khả năng đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu nhịp điệu, phù hợp với một bài ca. Dùng “các dân” thay cho “các dân tộc” để câu gọn hơn; dùng địa danh “Phi-li-ét” nhằm phân biệt vùng đất với người Phi-li-tin. Dấu chấm phẩy giữ hai vế thơ liên kết chặt chẽ.
