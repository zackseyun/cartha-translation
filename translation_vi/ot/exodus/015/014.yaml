- from: Các dân nghe tin thì run sợ[a]; nỗi kinh hoàng bao trùm cư dân Phi-li-ét.
  to: Các dân đã nghe; họ run rẩy. Cơn đau đớn chụp lấy cư dân Phi-li-tin.[a]
