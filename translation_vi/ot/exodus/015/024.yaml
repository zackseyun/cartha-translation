  text: And the people grumbled against Moses[a], saying, “What shall we drink?”
translation:
  language: vi
  text: 'Dân chúng phàn nàn chống lại Môi-se[a], nói rằng: “Chúng ta sẽ uống gì đây?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cằn nhằn” hoặc “oán trách Môi-se.” Động từ Hê-bơ-rơ chỉ sự than phiền của cả cộng đồng, đặc biệt trong các trình thuật về hành trình nơi hoang mạc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: phàn nàn
  rationale: Động từ לון/לין trong các trình thuật đồng hoang chỉ sự than phiền mang tính tập thể. “Phàn nàn” là cách nói tự nhiên, hiện đại và giữ được sắc thái tiêu cực.
- source_word: הָעָם
  choice: dân chúng
  rationale: Danh từ có mạo từ nghĩa là “dân chúng/dân ấy”; không thêm “Y-sơ-ra-ên” vì nguyên văn câu này không nêu rõ.
- source_word: עַל
  choice: với
  rationale: Sau động từ chỉ sự phàn nàn, עַל xác định người bị nhắm đến. Trong tiếng Việt, “phàn nàn với Môi-se” tự nhiên và vẫn cho thấy lời than phiền hướng vào ông; “chống lại” sẽ dễ làm tăng mức đối kháng.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Công thức nguyên mẫu này giới thiệu lời nói trực tiếp; “rằng” tạo liên kết tự nhiên trong tiếng Việt.
- source_word: מַה
  choice: gì
  rationale: Đại từ nghi vấn đơn giản, làm bổ ngữ cho động từ “uống” trong trật tự tiếng Việt.
- source_word: נִשְׁתֶּה
  choice: chúng ta sẽ uống
  rationale: Qal chưa hoàn thành ngôi thứ nhất số nhiều của שׁתה. Trong ngữ cảnh, câu hỏi bộc lộ nhu cầu cấp bách và sự chưa biết phải uống gì; “sẽ uống gì đây?” truyền đạt tự nhiên mà không ấn định quá mức sắc thái tình thái.
