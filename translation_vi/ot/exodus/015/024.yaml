  to: 'Dân chúng phàn nàn chống lại Môi-se[a], nói rằng: “Chúng ta sẽ uống gì đây?”'
  rationale: Thay “với Môi-se” bằng “chống lại Môi-se” để biểu đạt chức năng của עַל sau động từ chỉ lời than phiền. Đổi “rằng” thành “nói rằng” giúp liên kết với lời nói trực tiếp tự nhiên hơn, đồng thời phản ánh công thức לֵאמֹר. Các phần còn lại được giữ nguyên vì trung thành với nguyên văn và phù hợp tiếng Việt hiện đại.
