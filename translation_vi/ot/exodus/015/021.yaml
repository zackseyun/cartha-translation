  rationale: Sửa tối thiểu để biểu đạt rõ לַיהוָה là lời hát hướng về Yahweh và để câu tiếng Việt tự nhiên hơn. Chú thích [a] được giữ nguyên, neo đúng vào cụm dịch גָאֹה גָּאָה và bảo lưu những khả năng nghĩa khác của cụm này.
  reviewer_model: gpt-5.6-terra
