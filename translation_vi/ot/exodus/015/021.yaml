  text: וַ/תַּ֥עַן לָ/הֶ֖ם מִרְיָ֑ם שִׁ֤ירוּ לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: vi
  text: 'Mi-ri-am đáp lại họ:


    “Hãy hát cho Yahweh,

    vì Ngài đã chiến thắng hiển hách[a];

    ngựa và người cưỡi ngựa,

    Ngài đã quăng xuống biển.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có thể hiểu là “Ngài đã tự tôn cao vô cùng” hoặc “Ngài thật cao cả”; “đã chiến thắng hiển hách” diễn đạt thành ngữ này trong bối cảnh khúc ca chiến thắng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: đáp lại
  rationale: Giữ nghĩa cơ bản ‘đáp/đáp lại’ của ענה; trong bối cảnh bài ca, cách nói này vẫn để ngỏ sắc thái hát đối đáp mà không đưa sắc thái ấy thẳng vào chính văn.
- source_word: לָהֶם
  choice: họ
  rationale: Đại từ Hê-bơ-rơ là giống đực số nhiều, có thể chỉ chung hoặc một nhóm pha trộn; ‘họ’ không xác định giới tính và không thu hẹp đối tượng thành chỉ các phụ nữ.
- source_word: מִרְיָם
  choice: Mi-ri-am
  rationale: Phiên âm tên riêng theo lối rõ âm tiết, quen dùng trong văn bản Kinh Thánh tiếng Việt.
- source_word: שִׁירוּ
  choice: Hãy hát mừng
  rationale: Mệnh lệnh số nhiều của שׁיר là ‘hãy hát’; ‘hát mừng’ tự nhiên trong ngữ cảnh khúc ca chiến thắng và không nhất thiết thêm ý ‘ca ngợi’ như một bổ ngữ riêng.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Chuyển trực tiếp danh riêng giao ước יהוה là ‘Yahweh’, thay vì thay thế bằng một tước hiệu.
- source_word: גָאֹה גָּאָה
  choice: đã hiển hách chiến thắng
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh mạnh mẽ sự cao cả, oai nghi và thắng lợi được biểu lộ; cách dịch này truyền đạt thành ngữ trong bối cảnh khúc khải hoàn.
- source_word: סוּס וְרֹכְבוֹ
  choice: ngựa và người cưỡi ngựa
  rationale: Giữ danh từ số ít mang nghĩa đại diện/tập hợp. Lặp ‘ngựa’ tự nhiên và rõ hơn đại từ sở hữu vô tính vốn không có tương đương trực tiếp trong tiếng Việt.
- source_word: רָמָה
  choice: đã quăng
  rationale: Diễn đạt trực tiếp hành động ném/quăng với sắc thái mạnh, phù hợp hình ảnh thơ chiến thắng.
- source_word: בַיָּם
  choice: xuống biển
  rationale: Dù בְּ về mặt hình thức là ‘trong/ở’, sau động từ quăng, tiếng Việt tự nhiên dùng ‘xuống biển’ để chỉ hướng chuyển động và kết quả.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Giữ ‘Yahweh’ giúp phân biệt danh giao ước với tước hiệu ‘Chúa’ và không thay thế danh ấy bằng một truyền thống phát âm khác.
- issue: Chủ thể và sắc thái của גָאֹה גָּאָה
  choice: Ngài đã hiển hách chiến thắng
  alternative: Ngài đã tự tôn cao vô cùng; Ngài thật cao cả
  rationale: Cụm Hê-bơ-rơ có thể nhấn mạnh việc Yahweh được tôn cao hoặc tự bày tỏ sự cao cả. Trong bài ca chiến thắng, bản dịch nêu sự chiến thắng hiển hách nhưng không diễn giải thành một mệnh đề giáo lý về việc ‘tự tôn mình’.
translation_notes:
  register: Văn phong thơ trang trọng nhưng hiện đại, chia dòng để làm rõ nhịp khải hoàn. ‘Đáp lại’ bảo toàn khả năng đây là lời hát đối đáp; không thêm chú thích riêng vì chính văn đã giữ được sự mơ hồ ấy. Danh Yahweh được giữ nguyên theo dạng chuyển tự.
