  terminology: “Ngài,” “luồng hơi từ mũi,” “các vực sâu,” và “lòng biển” giữ được thanh điệu trang trọng và hình ảnh nhân cách hóa của nguyên văn. Bổ sung chú thích cho “đông đặc” để phản ánh độ rộng nghĩa của קָפְאוּ, tương ứng với dấu vết kiểm tra tiếng Anh.
