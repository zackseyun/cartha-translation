  source_fidelity: 'Bản dịch giữ đúng các hình ảnh chính của Hê-bơ-rơ: luồng hơi từ mũi Ngài, nước dồn lại, các dòng nước đứng như một khối chất đống, và các vực sâu đông đặc trong lòng biển. Tuy nhiên, “ụ” thường gợi một gò đất nhỏ và không phải tương đương tự nhiên, trực tiếp nhất của נֵד (“đống/khối chất cao”) trong hình ảnh nước biển. Bản sửa dùng “đống” để phản ánh từ gốc chính xác hơn.'
