  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: vi
  text: Bởi luồng hơi từ mũi Ngài, nước dồn thành đống; dòng nước đứng sững như một đống[a]; các vực sâu đông đặc[b] trong lòng biển[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “như một khối chất cao.” Một số bản dịch dùng “như một bức tường” dựa trên hình ảnh ở các đoạn thuật lại việc vượt biển, nhưng danh từ Hê-bơ-rơ ở đây chỉ một đống hoặc khối chất cao.
    reason: lexical_alternative
  - marker: b
    text: Hay “đông lại” hoặc “đóng cứng.” Động từ Hê-bơ-rơ có thể chỉ việc trở nên đặc lại hoặc đông lại.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “trong lòng biển,” nghĩa là ở giữa biển.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: Bởi luồng hơi từ mũi Ngài
  rationale: רוּחַ có thể chỉ gió hoặc hơi thở; đi với אַפֶּיךָ trong câu thơ này, cụm từ tạo hình ảnh nhân cách hóa về luồng hơi mạnh từ mũi Đức Chúa Trời. “Luồng hơi” tự nhiên hơn “hơi thổi” và vẫn giữ hình ảnh cụ thể.
- source_word: נֶעֶרְמוּ מַיִם
  choice: nước dồn thành đống
  rationale: Động từ diễn tả nước chất hoặc dồn lại thành khối. Cách dịch này vừa rõ nghĩa vừa giữ được hình ảnh thơ.
- source_word: נִצְּבוּ
  choice: đứng sững
  rationale: Động từ có nghĩa là đứng, đứng vững. “Đứng sững” diễn đạt sinh động trạng thái dòng nước đột ngột đứng lại mà không thêm ý tưởng xa lạ.
- source_word: כְמוֹ נֵד
  choice: như một ụ
  rationale: נֵד trước hết chỉ một đống hay khối chất cao. “Ụ” giữ hình ảnh khối nước dồn cao; không đổi thành “bức tường” theo các đoạn song song.
- source_word: נֹזְלִים
  choice: dòng nước
  rationale: Phân từ này chỉ thứ đang chảy. Trong tiếng Việt, “dòng nước” tự nhiên và gợi đúng tính chất chuyển động của nước.
- source_word: קָפְאוּ
  choice: đông đặc
  rationale: Động từ có thể diễn tả sự đặc lại, đông lại hoặc đóng cứng. “Đông đặc” giữ độ rộng nghĩa và tránh khẳng định riêng hiện tượng đóng băng.
- source_word: תְהֹמֹת
  choice: các vực sâu
  rationale: Danh từ số nhiều chỉ những vùng nước sâu hoặc vực thẳm của biển; “các vực sâu” giữ số nhiều và sắc thái hùng vĩ.
- source_word: בְּלֶב יָם
  choice: giữa lòng biển
  rationale: Nghĩa đen là “trong lòng biển,” mang nghĩa ở giữa biển. “Giữa lòng biển” vừa tự nhiên trong tiếng Việt vừa bảo tồn ẩn dụ thi ca.
theological_decisions:
- issue: Hình ảnh nhân cách hóa Đức Chúa Trời qua mũi và hơi thở
  choice: Giữ hình ảnh cụ thể “luồng hơi từ mũi Ngài.”
  alternative: Diễn giải trừu tượng là “bởi cơn giận của Ngài.”
  rationale: Nguyên văn kết hợp רוּחַ với אַפֶּיךָ để mô tả quyền năng của Đức Chúa Trời bằng hình ảnh thân thể trong thi ca. Giữ nguyên hình ảnh này không làm phẳng ngôn ngữ và không áp đặt cách giải thích thần học.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng hiện đại. Dùng “Ngài” để xưng hô trực tiếp với Đức Chúa Trời; giữ các hình ảnh cụ thể “mũi,” “ụ,” và “lòng biển.”
