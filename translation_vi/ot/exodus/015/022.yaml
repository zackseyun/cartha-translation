base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: vi
  text: Bấy giờ, Môi-se dẫn dân Y-sơ-ra-ên rời Biển Sậy[a], và họ đi vào hoang mạc Su-rơ. Họ đi ba ngày trong hoang mạc mà không tìm thấy nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo truyền thống thường dịch là “Biển Đỏ”; tiếng Hê-bơ-rơ là “Biển Sậy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: dẫn ... rời
  rationale: Dạng Hiphil mang ý nghĩa khiến dân Y-sơ-ra-ên lên đường. “Dẫn ... rời” diễn đạt tự nhiên vai trò chủ động của Môi-se và hướng chuyển động khỏi vùng biển.
- source_word: מִיַּם סוּף
  choice: rời Biển Sậy
  rationale: יָם־סוּף theo nghĩa từ vựng là “Biển Sậy”; bản văn chính ưu tiên nghĩa của tiếng Hê-bơ-rơ, còn cách gọi truyền thống “Biển Đỏ” được ghi ở chú thích.
- source_word: מִדְבַּר שׁוּר
  choice: hoang mạc Su-rơ
  rationale: מִדְבָּר chỉ vùng hoang vu, khô cằn, không nhất thiết chỉ sa mạc cát. “Hoang mạc” vừa trang trọng vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיֵּצְאוּ
  choice: họ đi vào
  rationale: Động từ יָצָא cơ bản là “đi ra”. Trong hướng kể chuyện từ vùng biển đến hoang mạc, tiếng Việt tự nhiên dùng “đi vào”; ý rời địa điểm trước đã được thể hiện trong mệnh đề đầu.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: ba ngày
  rationale: Cụm từ là đối cách chỉ thời lượng; “ba ngày” giữ nguyên mức độ xác định của nguyên văn mà không thêm ý “một hành trình ba ngày”.
- source_word: בַּמִּדְבָּר
  choice: trong hoang mạc
  rationale: Giới từ בְּ được dịch trực tiếp là “trong”, phù hợp cả ngữ nghĩa lẫn cách nói tiếng Việt.
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: mà không tìm thấy nước
  rationale: Cách dịch trực tiếp, tự nhiên, giữ liên kết trình tự giữa việc đi suốt ba ngày và tình trạng không tìm được nước.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và dễ hiểu trong tiếng Việt hiện đại. Dùng “Môi-se”, “Y-sơ-ra-ên” và “Su-rơ” theo lối phiên âm Kinh Thánh quen thuộc; giữ “Biển Sậy” trong chính văn để phản ánh trực tiếp tiếng Hê-bơ-rơ.
