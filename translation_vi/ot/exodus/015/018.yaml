  source_fidelity: Bản nháp chuyển đúng ý vị lai của יִמְלֹךְ (“sẽ trị vì”) và thành ngữ לְעוֹלָם וָעֶד (“đời đời vô cùng”). Tuy nhiên, tên riêng יְהוָה cần được chuyển là “Yahweh” để nhất quán với quyết định dịch thuật đã nêu và không thay bằng dạng phiên âm khác.
  naturalness: “sẽ trị vì đời đời vô cùng” tự nhiên, trang trọng và phù hợp với tính chất tung hô của câu. Việc bỏ “Đức” trước tên riêng giúp câu gọn hơn và tránh pha trộn danh xưng tôn kính với cách phiên âm tên riêng theo chính sách bản dịch.
  terminology: Đổi “Đức Giê-hô-va” thành “Yahweh”. “Giê-hô-va” là một cách phiên âm truyền thống, nhưng không phù hợp với lựa chọn thuật ngữ của dự án là “Yahweh” cho Tetragrammaton. Giữ chú thích để nêu dạng Hê-bơ-rơ và cách gọi truyền thống.
  issues:
