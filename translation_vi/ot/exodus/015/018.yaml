base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/018.yaml
  text: Yahweh will reign forever and ever[a].
translation:
  language: vi
  text: Yahweh sẽ trị vì đời đời vô cùng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: “YHWH.” Theo truyền thống thường phiên âm là “Giê-hô-va”; cũng có thể phiên âm là “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc và trang trọng trong tiếng Việt cho Danh Thánh YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: יִמְלֹךְ
  choice: sẽ trị vì
  rationale: Thể vị hoàn thành chưa hoàn tất ở đây phù hợp với ý tương lai trong lời tung hô; “trị vì” diễn đạt tự nhiên quyền làm vua.
- source_word: לְעֹלָם וָעֶד
  choice: đời đời vô cùng
  rationale: Cụm tiếng Việt tự nhiên, trang trọng, giữ được sức nhấn mạnh của thành ngữ Hê-bơ-rơ chỉ thời gian không cùng tận.
theological_decisions:
- issue: Cách chuyển dịch Danh Thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn trực tiếp dùng YHWH. Bản dịch giữ đây là tên riêng của Đức Chúa Trời, không thay bằng tước hiệu; “Đức Giê-hô-va” là dạng đã quen thuộc trong tiếng Việt.
- issue: Giá trị thời của יִמְלֹךְ
  choice: sẽ trị vì
  alternative: trị vì
  rationale: Ngữ cảnh bài ca chiến thắng cho phép hiểu như lời công bố hướng tới sự trị vì bền vững trong tương lai; tuy vậy, dạng Hê-bơ-rơ cũng có thể được hiểu như một lời khẳng định tổng quát.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và giàu tính tung hô, phù hợp với câu kết luận mang sắc thái phụng ca. Dùng tiếng Việt hiện đại nhưng giữ nhịp điệu quen thuộc của lời Kinh Thánh.
