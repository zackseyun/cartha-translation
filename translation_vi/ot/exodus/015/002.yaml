  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: vi
  text: 'Yah là sức mạnh và bài ca của tôi;

    Ngài đã trở nên sự cứu rỗi của tôi.


    Đây là Đức Chúa Trời của tôi—tôi sẽ ca ngợi Ngài[a];

    Đức Chúa Trời của cha tôi—tôi sẽ tôn cao Ngài.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi sẽ chuẩn bị một nơi ngự cho Ngài.” Động từ Hê-bơ-rơ ở đây khó xác định, có thể mang ý chuẩn bị nơi ở hoặc làm cho đẹp, tôn vinh.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: sức mạnh của tôi
  rationale: Danh từ עֹז chỉ sức mạnh hoặc quyền năng. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được hình ảnh thơ.
- source_word: וְזִמְרָת יָהּ
  choice: và bài ca của tôi; Yah là...
  rationale: 'זִמְרָה có thể chỉ bài ca hoặc lời ca ngợi. Trong bài ca chiến thắng này, “bài ca” giữ được sắc thái thi ca; יָהּ được hiểu là chủ thể của mệnh đề danh từ: Yah là sức mạnh và bài ca của tôi.'
- source_word: יָהּ
  choice: Yah
  rationale: Đây là dạng rút gọn của danh thánh, không phải chính dạng יהוה. Giữ “Yah” phản ánh đúng hình thức Hê-bơ-rơ và âm hưởng thi ca.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: Ngài đã trở nên sự cứu rỗi của tôi
  rationale: Cấu trúc היה + ל diễn tả việc trở thành hoặc làm nên điều gì cho một người. “Đã trở nên” giữ sắc thái kết quả của hành động giải cứu vừa được thuật lại.
- source_word: זֶה אֵלִי
  choice: Đây là Đức Chúa Trời của tôi
  rationale: Bảo toàn đại từ chỉ định nhấn mạnh זֶה và diễn đạt tự nhiên trong tiếng Việt.
- source_word: וְאַנְוֵהוּ
  choice: tôi sẽ ca ngợi Ngài
  rationale: Động từ này khó xác định; cách hiểu “ca ngợi/tôn vinh” phù hợp với ngữ cảnh thờ phượng và song hành với “tôn cao”. Nghĩa liên quan đến việc chuẩn bị nơi ngự được ghi ở chú thích.
- source_word: אֱלֹהֵי אָבִי
  choice: Đức Chúa Trời của cha tôi
  rationale: Cụm sở hữu ở số ít được dịch trực tiếp, giữ mối liên hệ với đức tin của người cha.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: tôi sẽ tôn cao Ngài
  rationale: רומם mang nghĩa nâng cao hoặc tôn cao; “tôn cao” vừa giữ ẩn dụ vừa phù hợp văn phong thờ phượng.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יָהּ
  choice: Yah
  alternative: CHÚA
  rationale: Bản nguồn dùng dạng rút gọn יָהּ thay vì יהוה. Giữ “Yah” tránh đồng nhất hai hình thức và bảo toàn nét riêng của câu thơ.
- issue: Cách hiểu וְאַנְוֵהוּ
  choice: tôi sẽ ca ngợi Ngài
  alternative: tôi sẽ chuẩn bị một nơi ngự cho Ngài
  rationale: Từ này có ý nghĩa gây tranh luận. Bản chính chọn nghĩa phù hợp với phép song hành thi ca, nhưng chú thích giữ lại cách hiểu về nơi ngự để không che lấp sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong thơ ca trang trọng nhưng hiện đại; dùng các dòng thơ để thể hiện cấu trúc song hành. Đại từ “Ngài” dành cho Đức Chúa Trời, còn danh xưng “Yah” được giữ nguyên theo dạng rút gọn trong nguồn Hê-bơ-rơ.
