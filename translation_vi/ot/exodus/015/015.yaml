    tất cả cư dân Ca-na-an đều tan chảy.'
  rationale: Sửa các lựa chọn từ ngữ để giữ sắc thái thơ ca trang trọng và phép nhân hóa của tiếng Hê-bơ-rơ, tránh diễn giải thêm nguyên nhân của hình ảnh «tan chảy». «Các thủ lĩnh Mô-áp» theo sát quyết định ngữ nghĩa của bản kiểm tra tiếng Anh và sự song song với «các thủ lĩnh Ê-đôm», trong khi chú thích bảo tồn khả năng dịch theo nghĩa «dũng sĩ/người hùng mạnh».
