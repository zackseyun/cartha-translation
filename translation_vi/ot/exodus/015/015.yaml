base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: vi
  text: 'Bấy giờ, các thủ lĩnh Ê-đôm kinh hoàng;

    sự run rẩy nắm lấy các thủ lĩnh Mô-áp[a];

    tất cả cư dân Ca-na-an đều tan chảy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những dũng sĩ của Mô-áp” hoặc “những người hùng mạnh của Mô-áp.” Từ Hê-bơ-rơ theo nghĩa đen có thể chỉ những con đực khỏe mạnh trong đàn; ở đây từ này được dùng theo nghĩa bóng về những người mạnh hoặc có địa vị nổi bật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Bấy giờ
  rationale: Trạng từ thời gian nối phản ứng của các dân với hành động giải cứu được ca tụng trước đó; cách dịch này tự nhiên và trang trọng trong tiếng Việt.
- source_word: נִבְהֲלוּ
  choice: kinh hoàng
  rationale: Dạng Niphal của בהל diễn tả trạng thái bàng hoàng, hoảng sợ; “kinh hoàng” phù hợp với cường độ cảm xúc trong bài ca chiến thắng.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: các thủ lĩnh Ê-đôm
  rationale: אַלּוּף chỉ người đứng đầu thị tộc hoặc thủ lĩnh; “thủ lĩnh” giữ đúng nghĩa lãnh đạo mà không gán cho họ tước vị hoàng gia cụ thể.
- source_word: אֵילֵי מוֹאָב
  choice: những người quyền thế của Mô-áp
  rationale: אֵילֵי vốn gợi sức mạnh và ở đây chỉ những nhân vật nổi trội, có quyền thế; cách dịch giữ sắc thái “mạnh” mà vẫn tự nhiên trong thế song song với các thủ lĩnh Ê-đôm.
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: cơn run rẩy chộp lấy
  rationale: Động từ אחז cùng רָעַד tạo hình ảnh sự run rẩy túm lấy họ; “chộp lấy” giữ phép nhân hóa mạnh và sinh động của tiếng Hê-bơ-rơ.
- source_word: נָמֹגוּ
  choice: tan chảy vì sợ
  rationale: מוג diễn tả sự tan chảy hoặc mất hết can đảm trước nỗi sợ. Thêm “vì sợ” làm rõ nghĩa ẩn dụ cho độc giả hiện đại mà vẫn giữ hình ảnh gốc.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: tất cả cư dân Ca-na-an
  rationale: Diễn đạt trực tiếp toàn bộ những người đang cư ngụ tại Ca-na-an, bằng từ ngữ tiếng Việt hiện đại và gọn.
