base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: vi
  text: 'Kẻ thù nói:


    “Ta sẽ đuổi theo, sẽ bắt kịp,


    sẽ chia chiến lợi phẩm;


    ta sẽ hả dạ về chúng.[a]


    Ta sẽ tuốt gươm;


    tay ta sẽ tước quyền sở hữu của chúng.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “lòng (hay hồn) ta sẽ đầy chúng,” nghĩa là “ta sẽ được thỏa thuê về chúng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tay ta sẽ diệt chúng” hoặc “đuổi chúng đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: Kẻ thù nói
  rationale: Dùng thì quá khứ được hàm ý trong mạch bài ca để dẫn vào lời khoác lác của quân thù; danh từ số ít mang ý nghĩa đại diện cho phía thù địch.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: Ta sẽ đuổi theo, sẽ bắt kịp
  rationale: Các động từ chưa hoàn thành diễn tả ý định sắp thực hiện; “bắt kịp” truyền đạt rõ hình ảnh truy đuổi.
- source_word: אֲחַלֵּק שָׁלָל
  choice: sẽ chia chiến lợi phẩm
  rationale: Đây là thành ngữ chiến trận chỉ việc phân chia của cải cướp được; “chiến lợi phẩm” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: ta sẽ thỏa lòng trên chúng
  rationale: Cụm từ sát nghĩa là “hồn/sinh mạng ta sẽ đầy bởi chúng”; נֶפֶשׁ ở đây chỉ lòng ham muốn hoặc cơn thèm khát. Cách dịch giữ sắc thái thù nghịch và cấu trúc hướng vào đối tượng mà không giải nghĩa quá mức.
- source_word: אָרִיק חַרְבִּי
  choice: Ta sẽ tuốt gươm
  rationale: Khi đi với “gươm”, động từ ריק ở thể Hiphil là thành ngữ chỉ hành động rút gươm khỏi vỏ; “tuốt gươm” gọn, tự nhiên và giàu hình ảnh.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: tay ta sẽ diệt chúng
  rationale: Thể Hiphil của ירשׁ có thể mang nghĩa tước quyền sở hữu, đuổi đi hoặc đưa đến chỗ diệt vong. Trong lời khoác lác khi tuốt gươm, “diệt” phù hợp ngữ cảnh, còn các nghĩa từ vựng khác được bảo lưu trong chú thích.
