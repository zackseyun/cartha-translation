revisions:
- from: Bấy giờ, nữ tiên tri Mi-ri-am, chị của A-rôn, cầm trống con trong tay; tất cả phụ nữ đều đi theo bà, tay cầm trống và nhảy múa.[a]
  to: Bấy giờ, nữ tiên tri Mi-ri-am, chị/em gái của A-rôn, cầm một chiếc trống trong tay; tất cả phụ nữ đều đi ra theo bà, cùng với trống và nhảy múa.[a]
  rationale: Bản sửa giữ nguyên trình tự tường thuật, quan hệ gia đình được nêu trong nguyên ngữ, nhạc cụ cầm tay, việc tất cả phụ nữ đi ra theo Mi-ri-am, và hoạt động âm nhạc–múa. “Chị/em gái” bảo toàn tính mơ hồ của tiếng Hê-bơ-rơ; “đi ra theo bà” phục hồi đầy đủ động từ chính và cụm chỉ sự theo sau. Chú thích được điều chỉnh để khớp với cách diễn đạt tiếng Việt đã sửa.
