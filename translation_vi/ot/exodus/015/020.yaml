base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: vi
  text: Bấy giờ, nữ tiên tri Mi-ri-am, chị/em gái của A-rôn, cầm một chiếc trống trong tay; tất cả phụ nữ đều đi ra theo bà, cùng với trống và nhảy múa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cùng với trống và những điệu múa.” Danh từ Hê-bơ-rơ có thể chỉ hoạt động nhảy múa hoặc các điệu múa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Bấy giờ ... cầm
  rationale: Dạng waw liên tiếp đẩy câu chuyện tiến tới; “Bấy giờ” diễn đạt trình tự tự nhiên, còn “cầm” phù hợp với việc nhạc cụ ở trong tay.
- source_word: מִרְיָם
  choice: Mi-ri-am
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo lối rõ âm, quen dùng trong tiếng Việt.
- source_word: הַנְּבִיאָה
  choice: nữ tiên tri
  rationale: Danh từ Hê-bơ-rơ mang dạng giống cái và chỉ một phụ nữ làm tiên tri; cách dịch này tự nhiên, hiện đại và giữ rõ giới tính.
- source_word: אֲחוֹת אַהֲרֹן
  choice: chị của A-rôn
  rationale: Giữ nguyên việc bản Hê-bơ-rơ xác định Mi-ri-am theo quan hệ với A-rôn. Tiếng Hê-bơ-rơ chỉ nói “chị/em gái”; chọn “chị” dựa trên bối cảnh tường thuật cho thấy Mi-ri-am lớn tuổi hơn, đồng thời tránh cách nói nặng nề “chị/em gái” trong chính văn.
- source_word: הַתֹּף
  choice: trống con
  rationale: תֹף là nhạc cụ gõ cầm tay, có lẽ là trống khung; “trống con” là cách gọi gọn, dễ hiểu và không mặc nhiên cho rằng nhạc cụ nhất thiết có các miếng kim loại như tambourine hiện đại.
- source_word: בְּיָדָהּ
  choice: trong tay
  rationale: Diễn đạt trực tiếp và tự nhiên cụm giới từ Hê-bơ-rơ.
- source_word: וַתֵּצֶאןָ כָל הַנָּשִׁים אַחֲרֶיהָ
  choice: tất cả phụ nữ đều đi theo bà
  rationale: “Đi theo bà” chuyển tải tự nhiên ý họ đi ra phía sau Mi-ri-am, có thể thành một đoàn, mà không thêm địa điểm không có trong nguyên văn.
- source_word: בְּתֻפִּים
  choice: tay cầm trống
  rationale: Giữ nhất quán với danh từ số ít trước đó và diễn đạt phương tiện một cách tự nhiên trong tiếng Việt.
- source_word: וּבִמְחֹלֹת
  choice: và nhảy múa
  rationale: מְחֹלֹת chỉ những điệu múa hoặc hoạt động múa mang tính lễ hội; “nhảy múa” là cách diễn đạt hiện đại, tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “nữ tiên tri” thay cho từ cổ; “trống con” tránh thuật ngữ nhạc cụ lỗi thời. Đại từ “bà” thể hiện sự tôn trọng đối với Mi-ri-am và tạo câu tiếng Việt tự nhiên.
