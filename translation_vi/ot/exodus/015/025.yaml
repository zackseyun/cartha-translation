base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: vi
  text: Ông kêu cầu CHÚA, và CHÚA chỉ cho ông một cái cây. Ông ném cây ấy xuống nước, nước liền hóa ngọt. Tại đó, Ngài lập cho họ một luật lệ và một quy định, và tại đó Ngài thử họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: kêu cầu
  rationale: Diễn đạt tiếng kêu khẩn thiết hướng đến Đức Chúa Trời, tự nhiên trong tiếng Việt và phù hợp ngữ cảnh Môi-se cầu xin sự can thiệp.
- source_word: יְהוָה
  choice: CHÚA
  rationale: Dùng danh xưng quy ước bằng chữ in hoa để biểu thị danh riêng YHWH, đồng thời phù hợp lớp tham khảo POB đã được duyệt.
- source_word: עֵץ
  choice: một cái cây
  rationale: Nghĩa cơ bản là “cây”, dù từ này cũng có thể chỉ gỗ hoặc một khúc gỗ. Bản văn không nói rõ cây đã bị chặt, nên không thu hẹp thành “khúc gỗ”.
- source_word: וַיִּמְתְּקוּ
  choice: liền hóa ngọt
  rationale: Giữ hình ảnh đối lập trực tiếp với nước đắng trong ngữ cảnh; không diễn giải thêm thành “uống được”.
- source_word: חֹק וּמִשְׁפָּט
  choice: một quy định và một luật lệ
  rationale: Giữ hai danh từ pháp lý riêng biệt mà không gán cho chúng nội dung cụ thể không có trong câu.
- source_word: נִסָּהוּ
  choice: thử dân ấy
  rationale: Động từ נסה ở đây mang nghĩa thử hoặc thử nghiệm. “Dân ấy” thể hiện đối tượng số ít tập thể trong tiếng Hê-bơ-rơ mà không khiến độc giả hiểu nhầm là chỉ Môi-se.
theological_decisions:
- issue: Chủ thể của các động từ “lập” và “thử” không được nêu lại trong tiếng Hê-bơ-rơ
  choice: Dùng “Ngài” để chỉ CHÚA
  alternative: Dùng chủ thể không xác định hoặc hiểu Môi-se là chủ thể
  rationale: Mạch văn và cách dùng thông thường của câu cho thấy CHÚA là Đấng ban quy định và thử dân; “Ngài” nối tự nhiên với CHÚA đã được nhắc ngay trước đó.
- issue: Đại từ số ít לוֹ và hậu tố số ít trong נִסָּהוּ
  choice: Dịch là “dân ấy”
  alternative: Dịch sát hình thức là “người ấy” hoặc diễn giải là “họ”
  rationale: Số ít trong nguyên văn nhiều khả năng chỉ Israel như một tập thể. “Dân ấy” bảo toàn tính tập thể số ít và tránh đồng nhất đối tượng với riêng Môi-se.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dịch giữ nhịp kể ngắn gọn của nguyên văn, không giải thích phép lạ hay xác định loại cây ngoài điều bản văn nói.
