source:
  edition: WLC
  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: vi
  text: 'Nỗi kinh hoàng và khiếp sợ sẽ ập xuống trên chúng;


    bởi cánh tay lớn lao của Ngài,


    chúng sẽ lặng như đá[a]


    cho đến khi dân Ngài đi qua, lạy Yahweh,


    cho đến khi dân này, là dân Ngài đã có được[c], đi qua[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chúng sẽ im lặng” hoặc “chúng sẽ bất động.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch cả hai lần là “cho đến khi ... vượt qua.”
    reason: lexical_alternative
  - marker: c
    text: “Đã có được” cũng có thể dịch là “đã mua lấy” hoặc, theo nghĩa rộng về giao ước, “đã làm thành dân riêng của Ngài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם
  choice: sẽ ập xuống trên chúng
  rationale: Động từ נפל ở thể chưa hoàn thành, với chủ ngữ theo sau, diễn tả điều sẽ xảy đến trên các dân. “Ập xuống trên” truyền đạt tự nhiên hình ảnh nỗi kinh hoàng giáng xuống mà không làm yếu sắc thái mạnh của câu thơ.
- source_word: אֵימָתָה וָפַחַד
  choice: nỗi kinh hoàng và khiếp sợ
  rationale: 'Hai danh từ gần nghĩa được giữ riêng để bảo tồn lối tăng cường thi ca: אֵימָה là nỗi kinh hoàng, còn פַחַד là sự khiếp sợ.'
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: bởi cánh tay lớn lao của Ngài
  rationale: Giữ nguyên ẩn dụ “cánh tay” và ý niệm về sự lớn lao trong tiếng Hê-bơ-rơ; “bởi” có thể diễn tả căn nguyên hoặc phương tiện như giới từ בְּ.
- source_word: יִדְּמוּ כָּאָבֶן
  choice: chúng sẽ lặng như đá
  rationale: יִדְּמוּ có thể chỉ sự im lặng, yên bất động hoặc sững lại. “Lặng như đá” giữ được độ rộng nghĩa và hình ảnh so sánh mà không buộc câu vào chỉ một sắc thái.
- source_word: עַד יַעֲבֹר
  choice: cho đến khi ... đi qua
  rationale: עבר tại đây nói đến việc dân Israel tiến qua hoặc vượt qua. “Đi qua” tự nhiên trong tiếng Việt và đủ rộng; khả năng “vượt qua” được ghi ở chú thích.
- source_word: עַמְּךָ
  choice: dân Ngài
  rationale: עם trong ngữ cảnh giao ước chỉ dân thuộc về Yahweh. “Dân Ngài” vừa ngắn gọn vừa giữ rõ quan hệ sở thuộc.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu; từ xưng hô “lạy” phù hợp với lời hướng trực tiếp đến Ngài trong bài ca.
- source_word: עַם זוּ
  choice: dân mà
  rationale: Trong cấu trúc tiếng Việt, mệnh đề quan hệ “dân mà Ngài...” diễn đạt tự nhiên đối tượng được nói đến; ý chỉ định của זוּ đã hiện rõ qua dân được xác định bằng mệnh đề theo sau và sự song hành với “dân Ngài”.
- source_word: קָנִיתָ
  choice: Ngài đã thu lấy
  rationale: קנה có trường nghĩa mua, có được, thu lấy làm sở hữu. “Thu lấy” giữ ý sở hữu mà không mặc nhiên đồng nhất với các động từ chuyên biệt mang nghĩa “chuộc”; các khả năng khác được nêu trong chú thích.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Đức Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Giữ “Yahweh” bảo tồn tính chất danh riêng và không thay nó bằng một tước hiệu.
- issue: Ý nghĩa giao ước của קָנִיתָ
  choice: Ngài đã thu lấy
  alternative: Ngài đã mua lấy; Ngài đã làm thành dân riêng của mình
  rationale: Cách dịch chính giữ nghĩa căn bản là có được hoặc thu làm sở hữu, đồng thời không áp đặt nghĩa “chuộc” khi câu này không dùng các động từ cứu chuộc chuyên biệt. Chú thích bảo tồn cả sắc thái thương mại và sắc thái sở thuộc giao ước.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng hiện đại, với các dòng ngắn giữ nhịp song hành của nguyên văn. Đại từ “Ngài” thể hiện sự tôn kính; “lạy Yahweh” đánh dấu lời thưa trực tiếp. Bản dịch giữ các hình ảnh “cánh tay” và “đá,” đồng thời tránh từ ngữ giáo phái hoặc cách giải nghĩa quá mức.
