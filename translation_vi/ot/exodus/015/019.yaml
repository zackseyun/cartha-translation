  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: vi
  text: Vì ngựa của Pha-ra-ôn cùng với chiến xa và kỵ binh của ông đã tiến vào biển[a], rồi Yahweh khiến nước biển trở lại phủ trên họ; còn[b] con cái Israel thì đi trên đất khô, ở giữa biển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dùng dạng số ít: “ngựa của Pha-ra-ôn ... chiến xa của ông”; các danh từ này có thể mang nghĩa tập hợp, chỉ lực lượng ngựa và chiến xa của Pha-ra-ôn.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “và”. Liên từ Hê-bơ-rơ chỉ là “và”; “còn” làm rõ sự tương phản trong ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích của câu này đối với lời ca ngay trước đó.
- source_word: בָא ... בַּיָּם
  choice: đã tiến vào biển
  rationale: Diễn đạt tự nhiên chuyển động đi vào biển và phù hợp với bối cảnh quân đội truy đuổi.
- source_word: סוּס פַּרְעֹה
  choice: ngựa của Pha-ra-ôn
  rationale: Giữ danh từ số ít của tiếng Hê-bơ-rơ, có thể được hiểu theo nghĩa tập hợp trong ngữ cảnh.
- source_word: בְּרִכְבּוֹ וּבְפָרָשָׁיו
  choice: cùng với chiến xa và kỵ binh của ông
  rationale: “Chiến xa” có thể mang nghĩa tập hợp; “kỵ binh” diễn đạt tự nhiên những chiến binh cưỡi ngựa.
- source_word: וַיָּשֶׁב יְהוָה
  choice: rồi Yahweh khiến ... trở lại
  rationale: Phản ánh thể sai khiến của động từ שוב và giữ rõ tác nhân thần linh.
- source_word: אֶת מֵי הַיָּם עֲלֵהֶם
  choice: nước biển trở lại phủ trên họ
  rationale: Tái hiện cụ thể cảnh nước quay lại và trùm phủ quân đội Ai Cập.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: còn con cái Israel
  rationale: “Còn” thể hiện sự tương phản do ngữ cảnh tạo nên, trong khi “con cái Israel” giữ gần cấu trúc nguyên văn.
- source_word: הָלְכוּ בַיַּבָּשָׁה בְּתוֹךְ הַיָּם
  choice: đi trên đất khô giữa biển
  rationale: Cách nói rõ ràng, tự nhiên và bảo toàn hình ảnh của nguyên văn.
theological_decisions:
- issue: Cách chuyển dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA
  rationale: Phiên âm danh riêng giao ước trong nguyên văn thay vì thay bằng một tước hiệu.
- issue: Quan hệ giữa hai vế cuối câu
  choice: dùng “còn” để biểu thị tương phản
  alternative: dùng “và” theo đúng liên từ hình thức
  rationale: Liên từ Hê-bơ-rơ là “và”, nhưng ngữ cảnh đặt số phận quân Pha-ra-ôn đối lập rõ với con cái Israel; “còn” thể hiện quan hệ ấy mà không tăng thêm nội dung thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ “Pha-ra-ôn” theo lối phiên âm quen thuộc trong Kinh Thánh tiếng Việt và dùng “Israel” theo dạng tên riêng hiện đại của dự án.
