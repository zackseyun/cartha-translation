  source_fidelity: 'Bản dịch phản ánh đúng các nét chính của tiếng Hê-bơ-rơ: כִּי mang nghĩa giải thích (“Vì”); סוּס và רֶכֶב ở số ít có thể hiểu tập hợp; וַיָּשֶׁב là động từ sai khiến, diễn tả Yahweh làm nước biển quay trở lại; và בני ישראל đi trên phần đất khô ở trong lòng biển. “Kỵ binh” là cách chuyển ngữ phù hợp cho פָּרָשִׁים trong ngữ cảnh quân sự.'
  naturalness: Văn phong nhìn chung tự nhiên và trang trọng. Thêm “ở” trong “ở giữa biển” làm cụm vị trí rõ và tự nhiên hơn. Dấu phẩy trước cụm này cũng giúp người đọc nhận ra đây là địa điểm của việc đi trên đất khô.
