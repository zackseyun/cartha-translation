  to: Vì ngựa của Pha-ra-ôn cùng với chiến xa và kỵ binh của ông đã tiến vào biển[a], rồi Yahweh khiến nước biển trở lại phủ trên họ; còn[b] con cái Israel thì đi trên đất khô, ở giữa biển.
