source:
  edition: WLC
  text: נָטִ֨יתָ֙ יְמִ֣ינְ/ךָ֔ תִּבְלָעֵ֖/מוֹ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: vi
  text: Ngài dang tay phải ra; đất nuốt chửng chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đất đai nuốt chửng chúng” hoặc “mặt đất nuốt chửng chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: Ngài dang ... ra
  rationale: Động từ Qal hoàn thành ngôi hai số ít của נטה, trực tiếp thưa với Đức Chúa Trời. “Dang ... ra” tự nhiên trong tiếng Việt và giữ hình ảnh hành động cụ thể.
- source_word: יְמִינְךָ
  choice: tay phải
  rationale: Giữ nghĩa đen “tay phải” cùng hình ảnh thi ca về quyền năng, thay vì diễn giải thành “quyền năng” hay đổi thành “cánh tay”.
- source_word: תִּבְלָעֵמוֹ
  choice: nuốt chửng chúng
  rationale: Động từ בלע mang nghĩa “nuốt, nhận chìm”; chủ ngữ giống cái số ít là אָרֶץ theo sau, còn hậu tố chỉ đối tượng số nhiều. “Nuốt chửng” giữ được ẩn dụ mạnh và tự nhiên trong tiếng Việt.
- source_word: אָרֶץ
  choice: đất
  rationale: אֶרֶץ có thể chỉ đất, mặt đất hoặc xứ. Trong hình ảnh quân thù bị nuốt chửng, “đất” ngắn gọn, tự nhiên và vẫn giữ độ rộng nghĩa thích hợp.
theological_decisions:
- issue: Ngôn ngữ nhân hình về hành động của Đức Chúa Trời
  choice: Giữ hình ảnh cụ thể “tay phải”
  alternative: quyền năng của Ngài; cánh tay quyền năng của Ngài
  rationale: Nguyên văn dùng hình ảnh nhân hình trong lời ca thi. Giữ nguyên hình ảnh bảo toàn sức mạnh văn chương và thần học mà không diễn giải quá mức.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng hiện đại. Dùng “Ngài” phù hợp lời trực tiếp thưa với Đức Chúa Trời; “chúng” chỉ các quân thù số nhiều. Dấu chú thích [a] đặt sau toàn mệnh đề mà chú thích làm rõ.
