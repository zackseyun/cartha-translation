  to: Trong tình yêu thành tín của Ngài, Ngài đã dẫn dắt dân mà Ngài cứu chuộc[a]; bằng sức mạnh của Ngài, Ngài đã đưa họ đến nơi ngự thánh của Ngài[b].
  rationale: Chỉ điều chỉnh vị trí neo của chú thích [b] để nó gắn trực tiếp với “nơi ngự thánh của Ngài”. Nội dung bản dịch và các chú thích được giữ nguyên vì đã phản ánh trung thực văn bản Hê-bơ-rơ, giữ tính mơ hồ về địa điểm thánh, và dùng tiếng Việt hiện đại tự nhiên.
