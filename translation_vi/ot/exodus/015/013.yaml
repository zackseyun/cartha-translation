source:
  edition: WLC
  text: נָחִ֥יתָ בְ/חַסְדְּ/ךָ֖ עַם ז֣וּ גָּאָ֑לְתָּ נֵהַ֥לְתָּ בְ/עָזְּ/ךָ֖ אֶל נְוֵ֥ה קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: vi
  text: Trong tình yêu thành tín của Ngài, Ngài đã dẫn dắt dân mà Ngài cứu chuộc[a]; bằng sức mạnh của Ngài, Ngài đã đưa họ đến nơi ngự thánh của Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dân này mà Ngài cứu chuộc.”'
    reason: lexical_alternative
  - marker: b
    text: “Nơi ngự thánh của Ngài” có thể chỉ chung nơi có sự hiện diện thánh của Đức Chúa Trời; cụm này được hiểu theo nhiều cách, như Si-nai, đất hứa, hoặc Si-ôn/đền thờ.
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: Ngài đã dẫn dắt
  rationale: Động từ Hiphil נחה có nghĩa là dẫn đường hoặc dẫn dắt. Cách dịch này tự nhiên trong tiếng Việt và diễn tả hành động cứu độ đã được thực hiện trong lời thơ.
- source_word: בְחַסְדְּךָ
  choice: Trong tình yêu thành tín của Ngài
  rationale: חֶסֶד kết hợp sắc thái yêu thương, lòng nhân từ và sự trung tín bền vững, thường trong quan hệ giao ước. Cụm này giữ được cả tình yêu lẫn lòng thành tín mà vẫn rõ nghĩa với độc giả hiện đại.
- source_word: עַם זוּ
  choice: dân
  rationale: זוּ có thể mang nghĩa chỉ định “này”; tuy nhiên, khi đi với mệnh đề quan hệ xác định theo sau, tiếng Việt tự nhiên có thể dùng “dân mà…”. Sắc thái chỉ định được ghi nhận trong chú thích.
- source_word: גָּאָלְתָּ
  choice: Ngài cứu chuộc
  rationale: גאל chỉ hành động giải cứu hoặc chuộc lại, có chiều sâu về quan hệ và giao ước. “Cứu chuộc” duy trì thuật ngữ thần học quen thuộc mà không thêm cách giải thích giáo phái.
- source_word: נֵהַלְתָּ
  choice: Ngài đã đưa họ
  rationale: נהל diễn tả sự dẫn đi, thường hàm ý chăm sóc. “Đưa họ” tránh lặp lại “dẫn dắt” ở vế trước, đồng thời diễn đạt rõ việc dẫn đến một đích điểm.
- source_word: בְעָזְּךָ
  choice: bằng sức mạnh của Ngài
  rationale: עֹז nghĩa là sức mạnh hoặc quyền năng; giới từ בְּ ở đây được hiểu theo nghĩa phương tiện, nên “bằng” là tự nhiên và chính xác trong tiếng Việt.
- source_word: אֶל
  choice: đến
  rationale: אֶל chỉ hướng chuyển động về phía một đích. “Đến” phù hợp với cấu trúc tiếng Việt và không nhấn quá mức việc đi vào bên trong.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: nơi ngự thánh của Ngài
  rationale: נָוֶה có thể là nơi ở, nơi cư ngụ hoặc đồng cỏ; trong ngữ cảnh nói về nơi hiện diện thánh của Đức Chúa Trời, “nơi ngự thánh” trang trọng, dễ hiểu và không xác định quá hẹp địa điểm.
theological_decisions:
- issue: Đối tượng của cụm “nơi ngự thánh của Ngài”
  choice: Giữ nghĩa rộng là nơi có sự hiện diện thánh của Đức Chúa Trời, không xác định duy nhất một địa điểm.
  alternative: Có thể hiểu cụ thể là Si-nai, đất hứa, hoặc Si-ôn/đền thờ.
  rationale: Bản Hê-bơ-rơ không xác định dứt khoát địa điểm. Bài ca có thể nhìn bao quát từ biến cố Xuất Ai Cập đến đích điểm nơi Đức Chúa Trời ngự, vì vậy bản dịch không nên âm thầm giải quyết sự căng thẳng này.
translation_notes:
  register: Văn phong thơ ca trang trọng nhưng hiện đại. Đại từ “Ngài” giữ cách xưng hô tôn kính phổ biến; hai vế song song được duy trì, đồng thời dùng “dẫn dắt” và “đưa” để tránh lặp từ không cần thiết.
