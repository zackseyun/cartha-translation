  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: vi
  text: Ngài sẽ đưa họ vào và trồng họ trên núi cơ nghiệp của Ngài,[a] là nơi Ngài đã làm nên làm chỗ ngự của Ngài, lạy Yahweh; là thánh điện mà tay Ngài đã lập vững, lạy Chúa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Núi cơ nghiệp của Ngài” có thể chỉ rộng đến miền đất Đức Chúa Trời ban cho dân Ngài, hoặc cụ thể hơn đến núi nơi có thánh điện của Ngài.
    reason: alternative_reading
  - marker: b
    text: Trong nguyên văn, câu này dùng cả danh riêng “Yahweh” và tước hiệu “Chúa”.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: Ngài sẽ đưa họ vào
  rationale: Dạng Hiphil của בוא với hậu tố số nhiều diễn tả việc khiến họ đi vào một nơi; cách dịch này giữ cả ý gây khiến lẫn đích đến hàm ẩn.
- source_word: וְתִטָּעֵמוֹ
  choice: và trồng họ
  rationale: נטע có nghĩa đen là “trồng”; ở đây là hình ảnh thi ca về việc cho dân định cư vững chắc. Giữ động từ cụ thể thay vì diễn giải thành “an lập” hay “định cư”.
- source_word: בְּהַר נַחֲלָתְךָ
  choice: trên núi là cơ nghiệp của Ngài
  rationale: Giữ hình ảnh “núi” và quan hệ sở hữu trong cụm Hê-bơ-rơ, đồng thời không quyết định đó là toàn xứ được ban hay riêng núi của thánh điện.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: nơi ... để Ngài ngự
  rationale: מָכוֹן chỉ một nơi đã được thiết lập; kết hợp với לְשִׁבְתְּךָ, cụm này nói về nơi dành cho sự hiện diện/ngự trị của Đức Chúa Trời. “Nơi ... để Ngài ngự” tự nhiên trong tiếng Việt hiện đại.
- source_word: פָּעַלְתָּ
  choice: Ngài đã làm nên
  rationale: פעל là động từ rộng nghĩa “làm, tạo nên”; “làm nên” phù hợp với nơi ngự mà Đức Chúa Trời chuẩn bị, nhưng không thêm sắc thái ngoài nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, phân biệt với tước hiệu אֲדֹנָי xuất hiện sau đó trong cùng câu.
- source_word: מִקְּדָשׁ
  choice: thánh điện
  rationale: מִקְדָּשׁ là nơi thánh hay nơi tôn nghiêm. “Thánh điện” là cách diễn đạt trang trọng, dễ hiểu và không nhất thiết giới hạn vào một công trình lịch sử cụ thể.
- source_word: אֲדֹנָי
  choice: Chúa
  rationale: Đây là tước hiệu thần linh, được dịch là “Chúa” để phân biệt với danh riêng Yahweh mà không thêm đại từ sở hữu “của con” vốn không cần thiết trong cách dùng cố định này.
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: mà chính tay Ngài đã lập vững
  rationale: כון ở dạng thi ca diễn tả việc thiết lập vững chắc. “Chính tay Ngài” giữ hình ảnh nhân hình và nhấn mạnh Đức Chúa Trời trực tiếp thực hiện.
theological_decisions:
- issue: Cách dịch יְהוָה và אֲדֹנָי khi cùng xuất hiện trong một câu
  choice: Dịch יְהוָה là “Yahweh” và אֲדֹנָי là “Chúa”
  alternative: Dịch cả hai bằng “Chúa” hoặc dùng kiểu chữ để phân biệt
  rationale: Nguyên văn cố ý dùng cả danh riêng lẫn tước hiệu. Hai cách dịch khác nhau bảo toàn sự phân biệt ấy trong tiếng Việt.
- issue: Sở chỉ của “núi là cơ nghiệp của Ngài” và “thánh điện”
  choice: Giữ nguyên hình ảnh thi ca, không xác định cụ thể là toàn xứ Ca-na-an hay riêng Si-ôn/đền thờ
  alternative: Diễn giải rõ là núi Si-ôn, núi Đền Thờ, hoặc toàn xứ Ca-na-an
  rationale: Câu có thể hướng cả đến nơi dân được định cư lẫn nơi Đức Chúa Trời ngự. Bản dịch bảo tồn độ mở và sức căng của nguyên văn thay vì thu hẹp địa danh.
translation_notes:
  register: Văn phong thi ca, trang trọng nhưng hiện đại. Giữ phép song hành, hình ảnh “trồng” và “chính tay Ngài”; dùng “Ngài” để xưng hô kính trọng và “lạy” để thể hiện lời thưa trực tiếp trong bài ca.
