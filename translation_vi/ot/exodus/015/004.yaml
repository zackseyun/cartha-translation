  text: מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְ/חֵיל֖/וֹ יָרָ֣ה בַ/יָּ֑ם וּ/מִבְחַ֥ר שָֽׁלִשָׁ֖י/ו טֻבְּע֥וּ בְ/יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: vi
  text: 'Các chiến xa của Pha-ra-ôn và đạo quân của ông,

    Ngài đã ném xuống biển;

    những sĩ quan tinh tuyển của ông

    đã bị nhấn chìm trong Biển Sậy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “Biển Đỏ.” Tiếng Hê-bơ-rơ chép là “Biển Sậy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: các chiến xa
  rationale: Danh từ số nhiều chỉ cụ thể các xe chiến trận của Pha-ra-ôn; “chiến xa” tự nhiên, rõ nghĩa và phù hợp bối cảnh quân sự.
- source_word: פַּרְעֹה
  choice: Pha-ra-ôn
  rationale: Cách phiên âm danh hiệu hoàng gia đã quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: וְחֵילוֹ
  choice: cùng quân đội ông
  rationale: חַיִל trong ngữ cảnh này là lực lượng quân sự; “quân đội” rõ ràng hơn các nghĩa khác như sức mạnh hay tài sản.
- source_word: יָרָה
  choice: Ngài đã ném
  rationale: Động từ mang nghĩa ném hoặc phóng. “Ném” giữ được sức mạnh của hình ảnh thơ; chủ thể ngôi ba số ít được diễn đạt là “Ngài” theo ngữ cảnh bài ca nói về Đức Giê-hô-va.
- source_word: בַיָּם
  choice: xuống biển
  rationale: Sau động từ “ném”, “xuống biển” diễn đạt tự nhiên hướng chuyển động vào trong nước mà không cần thêm ý ngoài nguyên văn.
- source_word: וּמִבְחַר
  choice: những ... ưu tú nhất
  rationale: Từ này chỉ những người được tuyển chọn, thuộc hàng tốt nhất; “ưu tú nhất” giữ sắc thái tuyển chọn và nổi bật.
- source_word: שָׁלִשָׁיו
  choice: sĩ quan ... của ông
  rationale: שָׁלִישׁ chỉ các sĩ quan quân sự cấp cao hoặc tinh nhuệ, thường có liên hệ với lực lượng chiến xa. “Sĩ quan” tránh xác định quá hẹp cấp bậc hay chức vụ.
- source_word: טֻבְּעוּ
  choice: đã bị nhấn chìm
  rationale: Dạng bị động diễn tả việc bị làm cho chìm hoặc ngập dưới nước; cách dịch này giữ thể bị động và hình ảnh chìm xuống, thay vì chỉ nói đến cái chết do đuối nước.
- source_word: בְיַם סוּף
  choice: trong Biển Sậy
  rationale: Cụm Hê-bơ-rơ יַם סוּף có nghĩa sát chữ là “Biển Sậy”. Bản văn chính ưu tiên nghĩa theo nguyên ngữ, còn tên gọi truyền thống được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch יַם סוּף
  choice: Biển Sậy
  alternative: Biển Đỏ
  rationale: “Biển Sậy” phản ánh trực tiếp từ סוּף trong nguyên ngữ. “Biển Đỏ” là tên gọi truyền thống quen thuộc nhưng không phải nghĩa sát chữ, nên được bảo lưu trong chú thích để người đọc nhận biết.
- issue: Chủ thể không được nêu lại của יָרָה
  choice: Ngài
  alternative: Người
  rationale: Động từ ở ngôi ba số ít tiếp nối chủ thể thần linh trong bài ca, tức Đức Giê-hô-va ở câu trước. “Ngài” là đại từ tiếng Việt tự nhiên và tôn kính, nhưng không thêm danh xưng vốn không xuất hiện trong chính câu này.
translation_notes:
  register: Văn phong thơ ca trang trọng nhưng hiện đại, chia thành bốn dòng để phản ánh hai vế song song của câu Hê-bơ-rơ. Dùng “ông” cho Pha-ra-ôn và “Ngài” cho chủ thể thần linh nhằm giữ các quan hệ quy chiếu rõ ràng trong tiếng Việt.
