  to: Rồi họ đến Ma-ra[a], nhưng không thể uống nước tại Ma-ra vì nước đắng. Vì thế, người ta gọi tên nơi ấy là Ma-ra.
  rationale: Điều chỉnh tối thiểu để phản ánh rõ hơn «nước từ/tại Ma-ra» và công thức đặt tên phiếm chỉ trong tiếng Hê-bơ-rơ, đồng thời giữ nguyên nghĩa, register kể chuyện hiện đại, địa danh phiên âm và lối chơi chữ được chú thích.
