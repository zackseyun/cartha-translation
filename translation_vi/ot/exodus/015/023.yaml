base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: vi
  text: Rồi họ đến Ma-ra[a], nhưng không thể uống nước tại Ma-ra vì nước đắng. Vì thế, người ta gọi tên nơi ấy là Ma-ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ma-ra có âm gần với từ Hê-bơ-rơ có nghĩa là “đắng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Rồi họ đến
  rationale: Dạng wayyiqtol của בוא tiếp nối diễn tiến câu chuyện; “Rồi họ đến” diễn đạt tự nhiên quan hệ tuần tự.
- source_word: מָרָתָה
  choice: đến Ma-ra
  rationale: Tên riêng đi với hậu tố chỉ hướng; tiếng Việt diễn đạt tự nhiên là “đến Ma-ra”.
- source_word: וְלֹא יָכְלוּ
  choice: nhưng không thể
  rationale: Liên từ ở đây tạo thế tương phản giữa việc đến nơi và việc không uống được; “nhưng” làm rõ quan hệ diễn ngôn.
- source_word: לִשְׁתֹּת מַיִם מִמָּרָה
  choice: uống nước ở đó
  rationale: מן có thể biểu thị nguồn nước từ Ma-ra; trong tiếng Việt, “nước ở đó” tránh lặp địa danh mà vẫn chỉ rõ nguồn nước tại nơi vừa nhắc đến.
- source_word: כִּי מָרִים הֵם
  choice: vì nước đắng
  rationale: Đại từ và tính từ số nhiều phù hợp với מַיִם về mặt ngữ pháp Hê-bơ-rơ; tiếng Việt dùng danh từ khối số ít “nước” và vị ngữ “đắng”, đồng thời giữ quan hệ nguyên nhân của כִּי.
- source_word: עַל כֵּן
  choice: Vì thế
  rationale: Diễn đạt ngắn gọn kết luận dẫn đến lời giải thích tên gọi.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: nơi ấy được gọi là Ma-ra
  rationale: Động từ ngôi ba giống đực số ít không nêu chủ thể có thể mang sắc thái phiếm chỉ trong công thức đặt tên; thể bị động tiếng Việt tự nhiên và không tự ý xác định người đặt tên.
- source_word: מָרָה / מָרִים
  choice: Ma-ra / đắng
  rationale: Phiên âm địa danh, còn tính từ được dịch là “đắng”; chú thích giúp người đọc nhận ra lối chơi chữ trong tiếng Hê-bơ-rơ.
