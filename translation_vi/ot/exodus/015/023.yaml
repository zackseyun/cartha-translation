translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ma-ra” theo lối phiên âm quen thuộc trong tiếng Việt; giữ lời giải thích tên gọi mà không xác định một chủ thể đặt tên vốn không được nêu rõ trong nguyên văn.
