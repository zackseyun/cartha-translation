  - severity: low
    issue: «nơi ấy được gọi là Ma-ra» hơi làm nhạt công thức đặt tên của nguyên văn.
    rationale: «Người ta gọi tên nơi ấy là Ma-ra» giữ được tính phiếm chỉ của động từ không nêu chủ ngữ và diễn đạt rõ hành động gọi tên.
  revised_text: Rồi họ đến Ma-ra[a], nhưng không thể uống nước tại Ma-ra vì nước đắng. Vì thế, người ta gọi tên nơi ấy là Ma-ra.
