base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/003.yaml
  text: Yahweh is a warrior[b][a]; Yahweh is his name.
translation:
  language: vi
  text: Yahweh là một chiến binh; Yahweh là danh Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; cũng được phiên âm là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng danh riêng đã quen thuộc trong tiếng Việt để thể hiện trực tiếp Danh Thánh YHWH, thay vì thay bằng tước hiệu “CHÚA”.
- source_word: אִישׁ מִלְחָמָה
  choice: một chiến binh
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “người của chiến trận”, nhưng trong ngữ cảnh thi ca diễn tả một chiến binh. “Một chiến binh” tự nhiên, trang trọng và giữ nguyên hình ảnh chiến trận mà không tạo cảm giác gượng ép như cách dịch sát từng chữ.
- source_word: שְׁמוֹ
  choice: là danh Ngài
  rationale: Bổ sung động từ “là” cho mệnh đề không động từ trong tiếng Hê-bơ-rơ; “danh Ngài” phù hợp văn phong trang trọng và diễn đạt rõ đại từ sở hữu ngôi thứ ba.
theological_decisions:
- issue: Cách thể hiện Danh Thánh יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản nguồn dùng trực tiếp YHWH. Giữ một dạng phiên âm danh riêng bảo toàn sự phân biệt giữa Danh Thánh và tước hiệu; “Đức Giê-hô-va” là dạng quen thuộc, dễ hiểu trong tiếng Việt hiện đại. Chú thích nêu dạng “Yahweh” để minh bạch biến thể phiên âm.
- issue: Hiểu thành ngữ אִישׁ מִלְחָמָה
  choice: một chiến binh
  alternative: một người của chiến trận
  rationale: Đây là hình ảnh thi ca mô tả Đức Chúa Trời như chiến binh. Cách dịch tự nhiên không làm suy giảm hình ảnh hay biến nó thành một khẳng định trừu tượng.
translation_notes:
  register: Văn phong thi ca ngắn gọn, trang trọng và dễ hiểu. Lặp lại Danh Thánh đúng như cấu trúc nhấn mạnh của nguyên văn; dùng “danh” thay cho “tên” để phù hợp ngữ vực Kinh Thánh tiếng Việt.
