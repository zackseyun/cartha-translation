source:
  edition: WLC
  text: יְמִֽינְ/ךָ֣ יְהוָ֔ה נֶאְדָּרִ֖י בַּ/כֹּ֑חַ יְמִֽינְ/ךָ֥ יְהוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: vi
  text: 'Tay phải Ngài, lạy Yahweh[a], uy nghi trong quyền năng[b];

    tay phải Ngài, lạy Yahweh, đập tan[c] kẻ thù.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là “YHWH”; theo truyền thống thường được dịch là “CHÚA”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vinh hiển trong sức mạnh”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “nghiền nát”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  choice: tay phải Ngài
  rationale: Giữ hình ảnh cụ thể “tay phải” của nguyên văn, đồng thời để nguyên hàm ý thi ca về sức mạnh và hành động chiến thắng của Đức Chúa Trời.
- source_word: יְהוָה
  choice: lạy Yahweh
  rationale: Dùng “Yahweh” để thể hiện trực tiếp danh riêng יהוה; “lạy” đánh dấu lối xưng hô trang trọng trong câu thơ.
- source_word: נֶאְדָּרִי
  choice: uy nghi
  rationale: Diễn đạt vẻ oai nghi, huy hoàng và cao cả của אדר bằng một từ trang trọng nhưng tự nhiên trong tiếng Việt hiện đại.
- source_word: בַּכֹּחַ
  choice: trong quyền năng
  rationale: Bám sát giới từ ב và danh từ כֹּחַ, đồng thời kết hợp tự nhiên với “uy nghi” trong văn phong thi ca.
- source_word: תִּרְעַץ
  choice: đập tan
  rationale: Thể hiện sức mạnh dữ dội và tính dứt khoát của động từ רָעַץ, có nghĩa đập vỡ, nghiền nát hoặc phá tan.
- source_word: אוֹיֵב
  choice: kẻ thù
  rationale: Giữ dạng số ít của nguyên văn; trong ngữ cảnh, từ này cũng có thể mang nghĩa đại diện hoặc tập thể.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יהוה. Chuyển tự là “Yahweh” bảo tồn danh giao ước thay vì thay bằng một tước hiệu.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và giàu nhịp điệu để phù hợp với bài ca chiến thắng. Phép song song “tay phải Ngài, lạy Yahweh” được giữ nguyên; các động từ và hình ảnh cụ thể không bị diễn giải thành thuật ngữ giáo lý.
