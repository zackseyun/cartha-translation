base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: vi
  text: Ngài thổi bằng gió của Ngài[a]; biển phủ lấp họ. Họ chìm như chì trong làn nước dữ dội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hơi thở của Ngài”. Từ Hê-bơ-rơ này có thể có nghĩa là “gió”, “hơi thở” hoặc “thần linh”; ở đây, bối cảnh vượt biển nghiêng về nghĩa “gió”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: Ngài thổi
  rationale: Động từ diễn tả hành động thổi hoặc hà hơi. Trong ngữ cảnh thơ ca về hành động của Đức Chúa Trời trên biển, “Ngài thổi” vừa trực tiếp vừa giữ được hình ảnh của nguyên văn.
- source_word: בְרוּחֲךָ
  choice: bằng luồng gió của Ngài
  rationale: רוּחַ có thể chỉ gió, hơi thở hoặc thần khí. Ngữ cảnh vượt biển và động từ “thổi” ưu tiên nghĩa “gió”; “luồng gió” tự nhiên trong tiếng Việt và vẫn gợi luồng khí phát ra từ Ngài.
- source_word: כִּסָּמוֹ יָם
  choice: biển phủ lấp chúng
  rationale: כסה có nghĩa cơ bản là che hoặc phủ. “Phủ lấp” diễn đạt tự nhiên việc nước biển bao trùm quân Ai Cập mà không thêm cách giải thích ngoài nguyên văn.
- source_word: צָלֲלוּ
  choice: chúng chìm
  rationale: Trong ngữ cảnh này, צלל chỉ việc chìm xuống nước. “Chìm” rõ ràng, tự nhiên và phù hợp với phép so sánh tiếp theo.
- source_word: כָּעוֹפֶרֶת
  choice: như chì
  rationale: עוֹפֶרֶת là kim loại chì. Cách dịch giữ nguyên phép so sánh và hình ảnh về sức nặng.
- source_word: בְּמַיִם אַדִּירִים
  choice: giữa những dòng nước hùng mạnh
  rationale: אַדִּירִים diễn tả sức mạnh, uy lực hoặc vẻ oai nghi. “Những dòng nước hùng mạnh” giữ sắc thái uy lực, đồng thời tự nhiên hơn trong tiếng Việt thơ ca so với cách dịch theo nghĩa “sâu”.
theological_decisions:
- issue: Nghĩa của רוּחַ trong ngữ cảnh thơ ca thần hiển
  choice: luồng gió
  alternative: hơi thở; thần khí
  rationale: Bối cảnh trực tiếp là sự hủy diệt quân Ai Cập tại biển, còn động từ “thổi” ưu tiên hiện tượng gió hoặc hình ảnh hơi thở hơn là một quy chiếu minh nhiên đến Thần của Đức Chúa Trời. Chú thích giữ lại khả năng “hơi thở” mà không giải quyết quá mức tính đa nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” dành cho Đức Chúa Trời; “chúng” giữ đối tượng số nhiều là quân thù từ ngữ cảnh. Nhịp câu ngắn bảo tồn chất thơ và trình tự hình ảnh của tiếng Hê-bơ-rơ.
