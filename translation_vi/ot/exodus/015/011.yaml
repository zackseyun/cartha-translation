  to: Lạy ĐỨC GIÊ-HÔ-VA, giữa các thần, ai sánh được với Ngài? Ai sánh được với Ngài—uy nghi trong sự thánh khiết, đáng kính sợ trong những lời ca ngợi, làm điều diệu kỳ?
