  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: vi
  text: Lạy ĐỨC GIÊ-HÔ-VA, giữa các thần, ai sánh được với Ngài? Ai sánh được với Ngài—uy nghi trong sự thánh khiết, đáng kính sợ trong những lời ca ngợi, làm điều diệu kỳ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: giữa các thần
  rationale: Dịch trực tiếp số nhiều אֵלִם và giữ nguyên sức căng của lời thơ, không tự ý đổi thành “giữa các đấng quyền năng” hay giải thích bản thể của các thần.
- source_word: יְהוָה
  choice: ĐỨC GIÊ-HÔ-VA
  rationale: Dùng cách gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt để biểu thị danh riêng YHWH, đồng thời viết hoa nhằm phân biệt với tước hiệu chung “Chúa”.
- source_word: נֶאְדָּר
  choice: uy nghi
  rationale: Diễn đạt ý được tôn vinh, oai nghiêm hoặc lẫy lừng trong cấu trúc thơ một cách tự nhiên và trang trọng.
- source_word: נוֹרָא תְהִלֹּת
  choice: đáng kính sợ giữa những lời ca ngợi
  rationale: Giữ sắc thái bị động/đáng sợ của נוֹרָא và mối liên hệ với danh từ số nhiều “những lời ca ngợi”, thay vì làm nhẹ thành “đáng kinh ngạc”.
- source_word: עֹשֵׂה פֶלֶא
  choice: Đấng làm nên những việc diệu kỳ
  rationale: Chuyển phân từ sang danh xưng tự nhiên trong tiếng Việt, vẫn bảo toàn ý hành động liên tục/đặc trưng của Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của “các thần”
  choice: Giữ nguyên “giữa các thần”
  alternative: “giữa các đấng quyền năng” hoặc thêm chú thích phủ nhận sự hiện hữu của các thần
  rationale: Nguyên văn dùng אֵלִם; câu thơ khẳng định YHWH vô song mà không trực tiếp giải quyết bản thể hay địa vị của những đối tượng được gọi là “các thần”.
- issue: Sắc thái của נוֹרָא trong cụm nói về lời ca ngợi
  choice: “đáng kính sợ giữa những lời ca ngợi”
  alternative: “đáng kinh ngạc trong lời ca tụng”
  rationale: Bảo tồn sức nặng thần học của sự kính sợ và nét khó của cú pháp Hê-bơ-rơ, không chuyển hẳn sang cảm xúc ngạc nhiên.
translation_notes:
  register: Văn phong thơ ca trang trọng nhưng hiện đại; dùng câu hỏi tu từ song song, dấu gạch ngang để tái hiện nhịp vế thứ hai. Không thêm chú giải vì bản văn chính có thể giữ được sự mơ hồ và sức căng của nguyên ngữ.
