base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: vi
  text: Rồi họ đến Ê-lim[a]. Ở đó có mười hai suối nước và bảy mươi cây chà là[b]. Họ đóng trại ở đó, bên nước[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Rồi họ đến Ê-lim, và ở đó có mười hai suối nước cùng bảy mươi cây chà là.”'
    reason: lexical_alternative
  - marker: b
    text: “Cây chà là” cũng có thể dịch khái quát hơn là “cây cọ.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bên các vùng nước.” Từ “nước” trong tiếng Hê-bơ-rơ ở dạng số nhiều nhưng thường được dùng với nghĩa tập hợp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Rồi họ đến
  rationale: Động từ wayyiqtol của בוא tiếp nối trình tự tường thuật; “Rồi họ đến” tự nhiên trong tiếng Việt hiện đại và giữ được ý diễn tiến.
- source_word: אֵילִמָה
  choice: đến Ê-lim
  rationale: Tên địa danh được phiên âm; hậu tố chỉ hướng ה được thể hiện bằng giới từ “đến”.
- source_word: וְשָׁם
  choice: Ở đó có
  rationale: Giữ rõ nghĩa định vị của שָׁם và diễn đạt tự nhiên trong tiếng Việt bằng một câu mới.
- source_word: עֵינֹת מַיִם
  choice: suối nước
  rationale: עַיִן trong ngữ cảnh ốc đảo chỉ nguồn nước hay suối; “suối nước” rõ ràng, tự nhiên và tránh nghĩa thông thường là “mắt”.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: và bảy mươi cây chà là
  rationale: תָּמָר chỉ cây thuộc họ cọ, thường là chà là. “Cây chà là” là cách gọi cụ thể, quen thuộc và phù hợp với bối cảnh.
- source_word: וַיַּחֲנוּ
  choice: Họ đóng trại
  rationale: חנה có nghĩa là dựng hoặc đóng trại; “đóng trại” là cách nói hiện đại, dễ hiểu.
- source_word: עַל הַמָּיִם
  choice: bên nguồn nước
  rationale: עַל ở đây diễn tả vị trí gần hoặc bên cạnh, không phải ở trên mặt nước. Danh từ số nhiều הַמָּיִם thường mang nghĩa tập hợp; “nguồn nước” phù hợp với ngữ cảnh các suối vừa được nhắc đến.
