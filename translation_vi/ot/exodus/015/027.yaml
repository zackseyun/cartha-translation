  rationale: Chỉ điều chỉnh mệnh đề cuối và chú thích tương ứng để phân biệt “nước” (הַמָּיִם) với “các suối nước” (עֵינֹת מַיִם), đồng thời vẫn giữ nghĩa vị trí gần nước và tính tập hợp của danh từ số nhiều tiếng Hê-bơ-rơ.
