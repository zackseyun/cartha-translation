revisions:
- from: 'Ngài phán: “Nếu ngươi chuyên tâm lắng nghe tiếng Yahweh, Đức Chúa Trời của ngươi, làm điều ngay thẳng trước mắt Ngài, chú ý đến các điều răn của Ngài và tuân giữ mọi luật lệ của Ngài, thì Ta sẽ không giáng trên ngươi bất cứ bệnh tật nào mà Ta đã giáng trên Ai Cập, vì Ta là Yahweh, Đấng chữa lành ngươi.[a]”'
  to: 'Ngài phán: “Nếu ngươi chuyên tâm lắng nghe tiếng phán của Yahweh, Đức Chúa Trời của ngươi, làm điều ngay thẳng trước mắt Ngài, chú ý đến các điều răn của Ngài và tuân giữ mọi luật lệ của Ngài, thì Ta sẽ không giáng trên ngươi bất cứ bệnh tật nào mà Ta đã giáng xuống Ai Cập; vì Ta là Yahweh, Đấng chữa lành ngươi.[a]”'
  rationale: Điều chỉnh tối thiểu để tăng tính tự nhiên của tiếng Việt và làm chú thích phản ánh đúng phương án ngữ pháp của phân từ Hê-bơ-rơ. Không thay đổi tính điều kiện của lời hứa, phạm vi lịch sử liên hệ Ai Cập, hay ý nghĩa của các thuật ngữ giao ước.
  reviewer_model: gpt-5.6-terra
