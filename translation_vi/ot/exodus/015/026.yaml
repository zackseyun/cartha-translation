  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: vi
  text: 'Ngài phán: “Nếu ngươi chuyên tâm lắng nghe tiếng phán của Yahweh, Đức Chúa Trời của ngươi, làm điều ngay thẳng trước mắt Ngài, chú ý đến các điều răn của Ngài và tuân giữ mọi luật lệ của Ngài, thì Ta sẽ không giáng trên ngươi bất cứ bệnh tật nào mà Ta đã giáng xuống Ai Cập; vì Ta là Yahweh, Đấng chữa lành ngươi.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “vì Ta là Yahweh, Ta chữa lành ngươi.”'
    reason: Phân từ רֹפְאֶךָ có thể được dịch theo lối danh xưng, «Đấng chữa lành ngươi», hoặc theo lối mệnh đề động từ, «Ta chữa lành ngươi».
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: chuyên tâm lắng nghe
  rationale: Cấu trúc nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh hành động nghe. “Chuyên tâm lắng nghe” giữ được cả nghĩa nghe và sắc thái chú tâm dẫn đến vâng phục, nhưng không giản lược thành “vâng lời”.
- source_word: לְקוֹל
  choice: tiếng
  rationale: קוֹל có nghĩa trực tiếp là “tiếng/tiếng nói”. Cách dịch này giữ hình ảnh Hê-bơ-rơ về việc nghe tiếng của Đức Chúa Trời và vẫn tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm trực tiếp danh riêng giao ước, phân biệt với các tước hiệu của Đức Chúa Trời.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Chuyển tải trực tiếp danh xưng giao ước với đại từ ngôi thứ hai số ít.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: làm điều ngay thẳng trước mắt Ngài
  rationale: Giữ thành ngữ “trước mắt Ngài” và nghĩa luân lý của יָשָׁר là ngay thẳng, đúng đắn, thay vì diễn giải thành điều làm Ngài hài lòng.
- source_word: וְהַאֲזַנְתָּ
  choice: chú ý đến
  rationale: Hiphil của אזן chỉ việc chăm chú nghe. “Chú ý đến” giúp phân biệt sắc thái này với שׁמע ở đầu câu mà vẫn diễn đạt tự nhiên.
- source_word: לְמִצְוֺתָיו
  choice: các điều răn của Ngài
  rationale: מִצְוֹת là những mệnh lệnh hay điều răn; “điều răn” phù hợp văn cảnh giao ước và luật pháp.
- source_word: וְשָׁמַרְתָּ
  choice: tuân giữ
  rationale: Trong văn cảnh luật pháp, שׁמר mang nghĩa giữ gìn bằng cách thực hành. “Tuân giữ” biểu đạt rõ sắc thái này.
- source_word: כָּל חֻקָּיו
  choice: mọi luật lệ của Ngài
  rationale: חֻקִּים là những quy định cố định. “Luật lệ” chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: כָּל הַמַּחֲלָה
  choice: bất cứ bệnh tật nào
  rationale: Danh từ số ít mang nghĩa tập hợp đi với כָּל được chuyển tự nhiên thành cấu trúc phủ định “không... bất cứ bệnh tật nào”, không giới hạn vào một chứng bệnh cụ thể.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם / לֹא אָשִׂים עָלֶיךָ
  choice: mà Ta đã giáng trên Ai Cập / Ta sẽ không giáng trên ngươi
  rationale: “Giáng trên” là cách diễn đạt tiếng Việt tự nhiên cho שׂים trong ngữ cảnh tai họa, đồng thời giữ cùng một động từ ở cả hai vế và mối liên hệ trực tiếp giữa phán xét trên Ai Cập với lời hứa dành cho Israel.
- source_word: רֹפְאֶךָ
  choice: Đấng chữa lành ngươi
  rationale: Cách dịch này giữ hình thức phân từ chỉ tác nhân và ý nghĩa chữa trị/phục hồi của רפא, đồng thời tránh thu hẹp thành danh xưng nghề nghiệp “thầy thuốc”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Phiên âm “Yahweh” giữ đây là danh riêng, không thay bằng một tước hiệu.
- issue: Tính chất của lời hứa về bệnh tật
  choice: Lời hứa giao ước có điều kiện, gắn với việc Israel chuyên tâm nghe và tuân giữ
  alternative: Một bảo đảm phổ quát rằng mọi cá nhân tin kính sẽ luôn được chữa khỏi mọi bệnh; hoặc một ẩn dụ hoàn toàn thuộc linh
  rationale: Chính câu văn đặt lời hứa trong mệnh đề điều kiện và liên hệ nó với những tai họa đã giáng trên Ai Cập. Bản dịch không mở rộng thành bảo đảm chữa lành vô điều kiện cũng không loại bỏ nghĩa bệnh tật thể chất.
- issue: Sắc thái của רֹפְאֶךָ
  choice: Đấng chữa lành ngươi
  alternative: Đấng chữa bệnh cho ngươi
  rationale: Phân từ có thể được hiểu theo danh xưng tác nhân hoặc theo hành động đang/quen thực hiện. Bản chính giữ cách gọi mang tính danh xưng; chú thích bảo tồn cách diễn đạt thiên về động từ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ số ít “ngươi” bảo tồn lời phán trực tiếp với Israel trong tư cách một cộng đồng thống nhất; “Ta/Ngài” phân biệt người nói trong lời trích dẫn với lời dẫn. Các cụm “trước mắt Ngài”, “điều răn” và “tuân giữ” duy trì sắc thái giao ước mà vẫn dễ hiểu.
