base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: vi
  text: Với uy nghi lớn lao của Ngài, Ngài đánh đổ những kẻ đứng lên chống Ngài; Ngài sai cơn giận bừng cháy của Ngài đi, cơn ấy thiêu rụi chúng như rơm rạ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְרֹב גְּאוֹנְךָ
  choice: Trong sự uy nghi vô cùng của Ngài
  rationale: בְּ có thể chỉ phạm vi hoặc phương tiện, còn רֹב diễn tả mức độ lớn lao, dồi dào. Cách dịch này tự nhiên trong tiếng Việt và giữ được ý về sự uy nghi áp đảo của Đức Chúa Trời.
- source_word: תַּהֲרֹס
  choice: Ngài đánh đổ
  rationale: הרס có nghĩa là phá đổ hoặc triệt hạ. “Đánh đổ” phù hợp với đối tượng là những kẻ chống nghịch trong bối cảnh khải hoàn mang tính quân sự.
- source_word: קָמֶיךָ
  choice: những kẻ nổi dậy chống Ngài
  rationale: Phân từ của קום giữ nghĩa động từ là những kẻ đứng lên hay nổi dậy chống lại Đức Chúa Trời, thay vì chỉ khái quát thành “kẻ thù”.
- source_word: תְּשַׁלַּח
  choice: Ngài phóng ... ra
  rationale: שׁלח cơ bản có nghĩa là sai đi hoặc phóng ra. Trong ngữ cảnh thi ca, “phóng ... ra” truyền đạt sức mạnh mà không thêm hình ảnh không có trong nguyên văn.
- source_word: חֲרֹנְךָ
  choice: cơn giận bừng cháy của mình
  rationale: חָרוֹן chỉ cơn giận nóng cháy. Cách dịch giữ hình ảnh sức nóng và chuẩn bị tự nhiên cho hình ảnh thiêu nuốt ở mệnh đề sau.
- source_word: יֹאכְלֵמוֹ
  choice: nó thiêu nuốt chúng
  rationale: Động từ số ít quy chiếu về cơn giận và mang nghĩa ăn, nuốt hoặc tiêu hủy. “Thiêu nuốt” vừa giữ sức mạnh của động từ vừa làm rõ hình ảnh lửa hàm ẩn trong ngữ cảnh.
- source_word: כַּקַּשׁ
  choice: như rơm rạ
  rationale: קַשׁ chỉ rơm hoặc gốc rạ khô còn lại sau mùa gặt, là vật dễ bén lửa. “Rơm rạ” là hình ảnh tự nhiên, dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ về sự phán xét của Đức Chúa Trời
  choice: Ngài phóng cơn giận bừng cháy của mình ra, nó thiêu nuốt chúng như rơm rạ
  alternative: Ngài giáng cơn thịnh nộ; cơn ấy nuốt chửng chúng như rơm
  rationale: Bản dịch giữ nguyên việc bài ca trực tiếp quy hành động phán xét cho Đức Chúa Trời và bảo toàn hình ảnh nóng cháy, tiêu hủy, không làm nhẹ đi cũng không thêm lời giải thích giáo lý.
- issue: Lời trực tiếp thưa với Đức Chúa Trời ở ngôi thứ hai
  choice: sự uy nghi của Ngài ... chống Ngài ... cơn giận ... của mình
  alternative: sự uy nghi của Chúa ... chống Chúa ... cơn thịnh nộ của Chúa
  rationale: Duy trì lời xưng tụng trực tiếp của bài ca. “Ngài” tạo sắc thái trang trọng, còn “của mình” là đại từ hồi chỉ tự nhiên, tránh lặp nhưng vẫn quy rõ cơn giận về cùng chủ thể.
translation_notes:
  register: Văn phong thi ca trang trọng nhưng hiện đại, rõ nghĩa đối với độc giả phổ thông. Giữ cấu trúc song hành và chuỗi hình ảnh uy nghi—cơn giận bừng cháy—rơm rạ bị thiêu nuốt. Không đặt chú thích vì các sắc thái chính có thể được thể hiện trực tiếp, tự nhiên trong câu dịch.
