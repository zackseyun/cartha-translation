id: EXO.15.1
reference: Exodus 15:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: vi
  text: 'Bấy giờ, Môi-se và con dân Israel hát bài ca này cho Yahweh[a], và nói:


    “Ta sẽ hát cho Yahweh,


    vì Ngài đã chiến thắng vẻ vang[b];


    ngựa cùng người cưỡi,


    Ngài đã quăng xuống biển.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH (יהוה); theo truyền thống thường được dịch là “CHÚA”, cũng được phiên âm là “Yahweh”.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “Ngài đã tỏ ra cực kỳ cao cả.” Tiếng Hê-bơ-rơ lặp dạng của cùng một động từ để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Bấy giờ
  rationale: Dấu chỉ thời gian mở đầu sự kiện tiếp nối việc vượt biển; “Bấy giờ” tự nhiên, trang trọng và giữ rõ trình tự.
- source_word: יָשִׁיר
  choice: hát
  rationale: Dù có hình thái vị hoàn thành, khi đi với אָז trong văn thuật chuyện, động từ mang giá trị quá khứ; tiếng Việt không cần đánh dấu thì riêng.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: và con dân Israel
  rationale: Thành ngữ chỉ cộng đồng hậu duệ Israel; “con dân Israel” vừa dễ hiểu vừa tránh khiến độc giả tưởng chỉ nói đến con trai hoặc trẻ em.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: bài ca này
  rationale: Chuyển ngữ trực tiếp, không thêm nội dung diễn giải như “bài ca ngợi” vào phần dẫn.
- source_word: לַיהוָה
  choice: dâng lên Yahweh
  rationale: Giới từ ל chỉ hướng hoặc đối tượng của bài ca; “dâng lên” là cách diễn đạt tiếng Việt tự nhiên trong ngữ cảnh thờ phượng.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: Họ cất lời
  rationale: Tránh lặp vụng “nói rằng” nhưng vẫn giữ chức năng của công thức dẫn lời và sắc thái mở đầu bài ca.
- source_word: אָשִׁירָה
  choice: Ta sẽ hát ca ngợi
  rationale: Dạng khích lệ/nguyện ý ngôi thứ nhất diễn tả quyết tâm; “ta sẽ” giữ sự chuyển từ chủ thể số nhiều ở lời dẫn sang tiếng nói thi ca số ít.
- source_word: כִּי
  choice: vì
  rationale: Nêu lý do hát ca, trực tiếp và tự nhiên.
- source_word: גָאֹה גָּאָה
  choice: Ngài đã chiến thắng vẻ vang
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn tăng cường ý nghĩa; trong bối cảnh biển, cách dịch này biểu đạt chiến thắng oai hùng mà vẫn chú thích nghĩa thiên về tôn cao.
- source_word: סוּס וְרֹכְבוֹ
  choice: ngựa cùng người cưỡi
  rationale: Giữ lối nói số ít mang nghĩa tập thể và nhịp thơ cô đọng; “người cưỡi” tự nhiên hơn cách dịch sở hữu máy móc.
- source_word: רָמָה בַיָּם
  choice: quăng xuống biển
  rationale: Diễn tả hành động mạnh và hướng chuyển động theo ngữ cảnh; “xuống biển” là tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách chuyển danh thánh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Giữ danh giao ước dưới dạng phiên âm phổ biến “Yahweh”; chú thích nêu dạng Hê-bơ-rơ và truyền thống dịch để độc giả nhận biết.
- issue: Chủ ngữ hàm ẩn trong גָאֹה גָּאָה và רָמָה
  choice: Ngài
  alternative: Yahweh được lặp lại minh nhiên
  rationale: Tiếng Hê-bơ-rơ dùng động từ ngôi thứ ba giống đực số ít, quy chiếu về Yahweh. “Ngài” làm rõ chủ ngữ trong tiếng Việt mà không thêm một danh xưng thần học.
- issue: Nghĩa của גָאֹה גָּאָה
  choice: đã chiến thắng vẻ vang
  alternative: được tôn cao tột bậc
  rationale: Ngữ cảnh nhấn mạnh chiến thắng của Yahweh, nhưng gốc từ cũng có thể nói đến sự cao cả/tôn cao; giữ cách dịch theo ngữ cảnh và trình bày nghĩa thay thế trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp thơ. Dùng “Môi-se”, “Israel” và “Yahweh”; phần thơ xuống dòng để làm rõ cấu trúc bài ca. Đại từ “Ta” thể hiện tiếng nói thi ca số ít, còn “Ngài” kính trọng mà không quá cổ.
