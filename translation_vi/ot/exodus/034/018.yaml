source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: vi
  text: Hãy giữ Lễ Bánh Không Men[a]. Trong bảy ngày, ngươi phải ăn bánh không men vào thời điểm đã định trong tháng A-víp[b], như Ta đã truyền cho ngươi; vì trong tháng A-víp, ngươi đã ra khỏi Ai Cập[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lễ hội bánh không men.” Từ Hê-bơ-rơ חַג chỉ một kỳ lễ, đặc biệt là một lễ thánh được ấn định.
    reason: lexical_alternative
  - marker: b
    text: “A-víp” là tháng đầu xuân gắn với cuộc xuất hành khỏi Ai Cập.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “ngươi đã đi ra khỏi Ai Cập.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Lễ Bánh Không Men
  rationale: חַג chỉ một kỳ lễ thánh được ấn định, còn מַצּוֹת là bánh không men. Cách gọi này ngắn gọn, trang trọng và có tính danh xưng.
- source_word: תִּשְׁמֹר
  choice: Hãy giữ
  rationale: Trong ngữ cảnh giao ước và kỳ lễ, שׁמר mang nghĩa giữ, tuân giữ hay cử hành. “Hãy giữ” bảo tồn sắc thái mệnh lệnh giao ước mà vẫn dễ hiểu.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Trong bảy ngày, ngươi phải ăn bánh không men
  rationale: Diễn đạt rõ khoảng thời gian và lực mệnh lệnh của động từ chưa hoàn thành trong văn mệnh lệnh.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: như Ta đã truyền cho ngươi
  rationale: Mệnh đề quan hệ được hiểu tự nhiên là nhắc đến điều đã được truyền về việc giữ lễ, gồm cách thức và thời điểm, mà không thêm nội dung ngoài nguyên văn.
- source_word: לְמוֹעֵד
  choice: vào thời điểm đã định
  rationale: מוֹעֵד chỉ thời điểm hay kỳ hạn được ấn định, thường dùng cho những cuộc hội họp hoặc lễ nghi thánh.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: tháng A-víp
  rationale: Giữ tên gọi Hê-bơ-rơ của tháng bằng lối phiên âm dễ đọc trong tiếng Việt; chú thích giải thích ý nghĩa văn hóa và mùa vụ.
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: ngươi đã ra khỏi Ai Cập
  rationale: יצא מן diễn tả việc đi hoặc ra khỏi một nơi. Cách dịch này tự nhiên trong tiếng Việt và giữ nguyên mô-típ xuất hành.
theological_decisions:
- issue: Thuật ngữ chỉ kỳ lễ trong giao ước
  choice: Dùng “Lễ Bánh Không Men” như tên chính thức của một kỳ lễ thánh
  alternative: “lễ hội bánh không men” hoặc “kỳ lễ bánh không men”
  rationale: Cách dịch giữ được trọng lượng phụng tự và giao ước của חַג mà không đưa vào các khẳng định giáo phái hay cách hiểu thần học về sau.
- issue: Ngôi thứ hai số ít chỉ cộng đồng Israel
  choice: Giữ đại từ số ít “ngươi” xuyên suốt
  alternative: Dùng “các ngươi” hoặc thay bằng “Israel”
  rationale: Nguyên văn dùng ngôi thứ hai giống đực số ít, nói với Israel như một tập thể thống nhất. “Ngươi” bảo tồn hình thức ấy và phù hợp với lời phán trực tiếp của Đức Chúa Trời.
- issue: Quan hệ giữa mệnh lệnh và cuộc xuất hành
  choice: Dịch כִּי là “vì”, giữ cuộc ra khỏi Ai Cập làm căn cứ cho việc giữ lễ
  alternative: Dịch là “quả thật” hoặc tách thành một phát biểu độc lập
  rationale: Trong ngữ cảnh, כִּי tự nhiên nhất là nêu lý do lịch sử cho mệnh lệnh, nhưng bản dịch không diễn giải thêm ý nghĩa cứu chuộc vượt quá câu này.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Dùng “Ta/ngươi” để phản ánh lời phán trực tiếp và ngôi số ít của nguyên văn; viết hoa tên kỳ lễ và phiên âm A-víp theo lối tiếng Việt. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn tại vị trí thích hợp.
