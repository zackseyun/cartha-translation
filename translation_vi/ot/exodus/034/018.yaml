  to: Hãy giữ Lễ Bánh Không Men[a]. Trong bảy ngày, ngươi phải ăn bánh không men vào thời điểm đã định trong tháng A-víp[b], như Ta đã truyền cho ngươi; vì trong tháng A-víp, ngươi đã ra khỏi Ai Cập[c].
