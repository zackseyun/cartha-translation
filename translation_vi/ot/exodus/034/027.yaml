reference: Exodus 34:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se: “Hãy ghi những lời này, vì theo những lời này, Ta đã lập giao ước[a] với con và với Y-sơ-ra-ên.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ, theo nghĩa đen: “cắt một giao ước.”'
    reason: Bảo tồn hình ảnh nguyên ngữ của thành ngữ lập giao ước mà không dùng một cách nói khó hiểu trong chính văn.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: וַיֹּאמֶר
  choice: Rồi … phán
  rationale: Diễn đạt tự nhiên hình thức kể chuyện nối tiếp; “phán” phù hợp khi Đức Chúa Trời trực tiếp nói.
- source_word: כְּתָב לְךָ
  choice: Hãy ghi lại
  rationale: “Ghi lại” truyền đạt tự nhiên mệnh lệnh viết ra và sắc thái lưu giữ cho chính Môi-se, tránh cách nói tiếng Việt dễ bị hiểu lầm là viết thay cho người khác.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: những lời này
  rationale: Trong ngữ cảnh giao ước và mệnh lệnh viết, דְּבָרִים chỉ những lời đã được truyền; cách dịch này cũng giữ nguyên sự lặp lại trong câu.
- source_word: כִּי עַל־פִּי
  choice: vì dựa theo
  rationale: Giữ cả quan hệ nguyên nhân của כִּי lẫn ý nghĩa căn cứ hoặc phù hợp với của thành ngữ עַל־פִּי.
- source_word: כָּרַתִּי ... בְּרִית
  choice: Ta đã lập giao ước
  rationale: “Lập giao ước” là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ Hê-bơ-rơ theo nghĩa đen là “cắt giao ước”; “đã” thể hiện hành động hoàn tất.
- source_word: אִתְּךָ ... וְאֶת־יִשְׂרָאֵל
  choice: với con và với Y-sơ-ra-ên
  rationale: Giữ rõ cả Môi-se và Y-sơ-ra-ên là các bên được nói đến trong quan hệ giao ước; lặp “với” để tránh mơ hồ.
theological_decisions:
- issue: Cách chuyển ngữ danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Giữ danh riêng trong nguyên văn thay vì thay bằng một tước hiệu, đồng thời tránh áp đặt truyền thống hệ phái.
- issue: Thành ngữ giao ước כָּרַתִּי ... בְּרִית
  choice: Ta đã lập giao ước
  alternative: Ta đã cắt giao ước
  rationale: Cách dịch chính truyền đạt đúng nghĩa bằng tiếng Việt hiện đại; nghĩa đen quan trọng của thành ngữ được bảo tồn trong chú thích.
- issue: Đại từ khi Yahweh nói với Môi-se
  choice: Ta … con
  alternative: Ta … ngươi
  rationale: Cặp đại từ này trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại, không làm thay đổi nội dung hay xác định thêm bản chất thần học của mối quan hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ sự lặp lại của “những lời này” vì nó liên kết trực tiếp mệnh lệnh viết với căn cứ của giao ước. Dấu chú thích được đặt ngay sau “giao ước”, là cụm từ mà chú thích giải thích.
