  yaml_path: translation/ot/exodus/034/031.yaml
  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: vi
  text: Nhưng Môi-se gọi họ. A-rôn cùng tất cả các thủ lĩnh của hội chúng[a] trở lại với ông, rồi Môi-se nói với họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các thủ lĩnh của cộng đồng” hoặc “các vị lãnh đạo của hội chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: lên tiếng gọi họ
  rationale: Động từ קרא đi với אֶל diễn tả việc Môi-se cất tiếng hướng đến họ. Cách dịch này tự nhiên trong tiếng Việt và tránh sắc thái ra lệnh mạnh của “triệu gọi”.
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: trở lại với ông
  rationale: שׁוּב có nghĩa cơ bản là trở lại; cụm אֵלָיו xác định hướng trở về phía Môi-se. Cách dịch giữ nguyên chuyển động được thuật lại mà không thêm ý.
- source_word: הַנְּשִׂאִים
  choice: các thủ lĩnh
  rationale: נָשִׂיא ở đây chỉ những người đứng đầu cộng đồng. “Thủ lĩnh” là cách gọi hiện đại, trang trọng và không mang sắc thái hoàng tộc như “vương hầu”.
- source_word: בָּעֵדָה
  choice: của hội chúng
  rationale: עֵדָה chỉ cộng đồng dân Israel được nhìn như một tập thể hay hội chúng. Trong quan hệ với הַנְּשִׂאִים, tiếng Việt tự nhiên diễn đạt là “các thủ lĩnh của hội chúng”; chú thích giữ lại khả năng diễn đạt khác.
- source_word: וַיְדַבֵּר
  choice: nói
  rationale: דבר ở thể piel là động từ thông dụng chỉ hành động nói. “Nói” rõ ràng, tự nhiên và giữ văn phong trang trọng vừa phải.
- source_word: וַ
  choice: Nhưng / rồi
  rationale: Các liên từ waw nối tiếp mạch kể chuyện. Ở đầu câu, “Nhưng” làm rõ sự tương phản nhẹ với việc dân chúng sợ đến gần ở câu trước; trước mệnh đề cuối, “rồi” thể hiện trình tự sự việc.
theological_decisions: []
