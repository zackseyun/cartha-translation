  register: Bản dịch dùng tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Tên riêng được viết theo dạng quen thuộc “Môi-se” và “A-rôn”; “hội chúng” giữ sắc thái cộng đồng được quy tụ của עֵדָה.
