source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: vi
  text: 'Ngài phán: “Này, Ta lập một giao ước. Trước mặt toàn dân ngươi, Ta sẽ làm những việc kỳ diệu chưa từng được tạo nên trên khắp đất và giữa bất cứ dân tộc nào. Toàn dân mà ngươi đang ở giữa họ sẽ thấy công việc của ĐỨC GIÊ-HÔ-VA, vì điều Ta làm với ngươi thật đáng kinh sợ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của từ chỉ thị Hê-bơ-rơ, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: כֹּרֵת בְּרִית
  choice: lập một giao ước
  rationale: Thành ngữ Hê-bơ-rơ theo nghĩa đen là ‘cắt một giao ước’; ‘lập một giao ước’ truyền đạt đúng nghĩa trong tiếng Việt hiện đại.
- source_word: נִפְלָאֹת
  choice: những việc kỳ diệu
  rationale: Diễn tả các hành động phi thường gây kinh ngạc, không giới hạn thành một loại phép lạ cụ thể.
- source_word: לֹא נִבְרְאוּ
  choice: chưa từng được thực hiện
  rationale: Động từ ברא theo nghĩa đen là ‘được tạo nên’, nhưng trong ngữ cảnh nói về các việc kỳ diệu, ‘được thực hiện’ là tiếng Việt tự nhiên hơn mà vẫn giữ ý chưa từng xuất hiện trong lịch sử.
- source_word: מַעֲשֵׂה יְהוָה
  choice: công việc của ĐỨC GIÊ-HÔ-VA
  rationale: Giữ danh riêng giao ước YHWH theo quy ước tiếng Việt quen thuộc và phân biệt với danh xưng ‘Chúa’.
- source_word: נוֹרָא
  choice: đáng kinh sợ
  rationale: Giữ trường nghĩa mạnh gồm sự đáng sợ và lòng kính sợ, thay vì chỉ làm nhẹ thành ‘đáng kinh ngạc’.
- source_word: עֹשֶׂה עִמָּךְ
  choice: làm với ngươi
  rationale: 'Giữ giới từ ‘với’ và sự mơ hồ của nguyên văn: hành động có thể liên quan đến, thực hiện cùng, hoặc thực hiện đối với Môi-se và dân ông.'
theological_decisions:
- issue: Chủ thể của lời phán
  choice: Dùng ‘Ngài’ theo mạch văn và để chính lời nói xác định chủ thể là YHWH.
  alternative: Thêm rõ ‘ĐỨC GIÊ-HÔ-VA phán’.
  rationale: Nguyên văn chỉ có ‘Ngài phán’; không nên bổ sung danh xưng vào câu dẫn dù ngữ cảnh xác định người nói.
- issue: Sắc thái của נוֹרָא
  choice: ‘đáng kinh sợ’
  alternative: ‘đầy cảm hứng kính sợ’ hoặc ‘đáng kinh ngạc’
  rationale: Cách chọn giữ nguyên sức căng giữa nỗi sợ và sự kính phục trong từ Hê-bơ-rơ, không thu hẹp nó vào một phản ứng tích cực nhẹ hơn.
- issue: Quan hệ trong עִמָּךְ
  choice: ‘với ngươi’
  alternative: ‘cho ngươi’ hoặc ‘giữa các ngươi’
  rationale: Giữ đúng giới từ và không quyết định quá mức liệu Môi-se, dân Israel, hay cả hai là đối tượng trực tiếp của hành động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ta/ngươi’ để phản ánh lời phán trực tiếp mang sắc thái giao ước; dùng ‘ĐỨC GIÊ-HÔ-VA’ cho יהוה. Cấu trúc câu được làm tự nhiên trong tiếng Việt nhưng vẫn giữ trật tự ý và các điểm mơ hồ quan trọng của nguyên văn.
