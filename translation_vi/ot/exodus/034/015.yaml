revisions:
- from: Đừng lập giao ước với cư dân trong xứ, kẻo họ chạy theo các thần của mình mà làm điếm[a], dâng sinh tế cho các thần ấy, rồi một người trong số họ mời con và con ăn từ sinh tế của người ấy.[b]
  to: Đừng lập giao ước với cư dân trong xứ, kẻo họ tà dâm theo các thần của họ, dâng sinh tế cho các thần ấy, rồi một người trong số họ mời ngươi và ngươi ăn phần sinh tế của người ấy.
  rationale: Sửa cú pháp để ẩn dụ của זנה gắn trực tiếp và tự nhiên với việc theo các thần khác; thay đại từ xưng hô mang tính diễn giải; và thay cách diễn đạt về việc ăn của lễ để tiếng Việt tự nhiên hơn mà vẫn giữ nghĩa “ăn từ/một phần của sinh tế”. Các chú thích được viết lại để khớp chính xác với bản văn đã sửa và giữ giới hạn giải thích của câu nguồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:52:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc cảnh báo của פן, ý lập giao ước, việc tế thần, số ít phân phối trong “một người trong số họ”, và việc ăn phần thuộc sinh tế. Tuy nhiên, “chạy theo các thần của mình mà làm điếm” khiến quan hệ giữa hai vế Hê-bơ-rơ thiếu tự nhiên trong tiếng Việt: động từ chỉ sự dâm dục/bất trung phải trực tiếp gắn với việc theo thần. “Con” cũng thêm một sắc thái xưng hô gia đình không được đánh dấu trong đại từ số ít Hê-bơ-rơ, vốn ở đây ngỏ với Ít-ra-ên như một tập thể được nhân cách hóa.'
  naturalness: “Tà dâm theo các thần của họ” là cách nói trang trọng, có tính Kinh Thánh nhưng vẫn rõ nghĩa trong tiếng Việt chuẩn hiện đại; nó giữ hình ảnh bất trung tình dục mà không tạo ra cú pháp gượng. “Ăn phần sinh tế của người ấy” tự nhiên hơn “ăn từ sinh tế” và diễn đạt sát מִן, tức là ăn một phần của lễ vật tế.
  terminology: Giữ “lập giao ước”, “cư dân trong xứ”, và “dâng sinh tế”. Dùng “ngươi” để bảo toàn số ít của כָּ mà không áp đặt quan hệ “cha–con”; đây là đại từ văn bản trang trọng phù hợp với lời phán trực tiếp trong ngữ cảnh Kinh Thánh. “Tà dâm” giữ phép ẩn dụ tình dục của זנה trong bối cảnh thờ thần khác.
  issues:
  - severity: medium
    issue: Cụm “họ chạy theo các thần của mình mà làm điếm” không gắn ẩn dụ זנה với các thần một cách tự nhiên.
    rationale: Nguyên ngữ nói họ thực hiện hành vi bất trung tình dục theo/sau các thần của họ. Trật tự hiện tại có thể được hiểu là họ chạy theo thần rồi đồng thời làm điếm, thay vì chính việc theo thần được mô tả bằng ẩn dụ tình dục.
  - severity: low
    issue: “Con” thêm sắc thái xưng hô không được nêu trong tiếng Hê-bơ-rơ.
    rationale: Đại từ hậu tố số ít chỉ người được ngỏ lời; trong ngữ cảnh giao ước, số ít này nhân cách hóa Ít-ra-ên. “Ngươi” giữ được số và văn phong trực tiếp mà không diễn giải quan hệ.
  - severity: low
    issue: “Ăn từ sinh tế” là cấu trúc ít tự nhiên trong tiếng Việt.
    rationale: “Ăn phần sinh tế của người ấy” diễn đạt tự nhiên hơn, đồng thời phản ánh giới từ מִן (‘từ/một phần của’).
  revised_text: Đừng lập giao ước với cư dân trong xứ, kẻo họ tà dâm theo các thần của họ, dâng sinh tế cho các thần ấy, rồi một người trong số họ mời ngươi và ngươi ăn phần sinh tế của người ấy.
  revised_footnotes:
  - marker: a
    text: 'Nguyên văn dùng hình ảnh bất trung tình dục: “họ tà dâm theo các thần của họ.” Hình ảnh này mô tả việc thờ các thần khác như sự bất trung.'
    reason: lexical_alternative
  - marker: b
    text: Cụm “ăn phần sinh tế” có nghĩa là ăn một phần thức ăn thuộc lễ vật tế của người ấy.
    reason: lexical_alternative
  revision_rationale: Sửa cú pháp để ẩn dụ của זנה gắn trực tiếp và tự nhiên với việc theo các thần khác; thay đại từ xưng hô mang tính diễn giải; và thay cách diễn đạt về việc ăn của lễ để tiếng Việt tự nhiên hơn mà vẫn giữ nghĩa “ăn từ/một phần của sinh tế”. Các chú thích được viết lại để khớp chính xác với bản văn đã sửa và giữ giới hạn giải thích của câu nguồn.
