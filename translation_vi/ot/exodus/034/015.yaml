source:
  edition: WLC
  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: vi
  text: Đừng lập giao ước với cư dân trong xứ, kẻo họ tà dâm theo các thần của họ, dâng sinh tế cho các thần ấy, rồi một người trong số họ mời ngươi và ngươi ăn phần sinh tế của người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: Đừng... kẻo
  rationale: Cấu trúc cảnh báo tự nhiên trong tiếng Việt, vừa truyền đạt lệnh ngăn cấm vừa giữ quan hệ hậu quả tiềm tàng của פֶּן.
- source_word: תִּכְרֹת בְּרִית
  choice: lập giao ước
  rationale: Chuyển ngữ tự nhiên thành ngữ Hê-bơ-rơ nghĩa đen là “cắt giao ước”, đồng thời giữ rõ ý nghĩa giao ước.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: với cư dân trong xứ
  rationale: יֹשֵׁב được dùng theo nghĩa tập thể, chỉ những người đang cư trú trong vùng đất; “cư dân” ngắn gọn và trang trọng.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: họ chạy theo các thần của mình mà làm điếm
  rationale: Giữ hình ảnh ngoại tình mại dâm mạnh mẽ của זנה trong ngữ cảnh thờ hình tượng; “chạy theo” thể hiện אַחֲרֵי mà không biến ẩn dụ thành một cách giải nghĩa giáo lý.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: dâng sinh tế cho các thần ấy
  rationale: Diễn đạt rõ hành vi hiến tế trong việc thờ phượng; “sinh tế” phù hợp văn phong Kinh Thánh trang trọng nhưng vẫn dễ hiểu.
- source_word: וְקָרָא לְךָ
  choice: một người trong số họ mời con
  rationale: Làm rõ nghĩa phân phối hoặc bất định của động từ số ít sau chủ thể số nhiều; “mời” phù hợp với ngữ cảnh tham dự bữa ăn tế lễ.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: con ăn từ sinh tế của người ấy
  rationale: Giữ sát giới từ מִן và danh từ “sinh tế”, không diễn giải quá mức thành “bữa tiệc tế lễ” hay chỉ “thịt cúng”.
theological_decisions:
- issue: Hình ảnh tình dục về sự thờ hình tượng
  choice: Giữ rõ ẩn dụ bằng cụm “làm điếm”
  alternative: “phản bội mà chạy theo” hoặc “thờ các thần của mình”
  rationale: Bản Hê-bơ-rơ cố ý dùng זנה, một hình ảnh gây sốc về sự bất trung tình dục, để mô tả việc chạy theo các thần khác. Làm dịu thành “lầm lạc” sẽ làm mất sức nặng giao ước của câu.
- issue: Chủ thể số ít sau các động từ số nhiều
  choice: 'Dịch theo nghĩa phân phối: “một người trong số họ mời con”'
  alternative: “người ấy mời con” hoặc “họ mời con”
  rationale: Số ít Hê-bơ-rơ cá thể hóa tình huống mà không nhất thiết đổi chủ thể tập thể; cách dịch đã chọn rõ nghĩa trong tiếng Việt và không biến số ít thành số nhiều.
- issue: Việc ăn sinh tế liên quan đến sự thờ phượng ngoại giáo
  choice: Giữ cách nói “ăn từ sinh tế”
  alternative: “ăn đồ tế lễ” hoặc “dự bữa ăn tế lễ”
  rationale: Câu nguồn nói trực tiếp đến việc ăn từ sinh tế nhưng không giải thích đầy đủ tính chất nghi lễ của bữa ăn; bản dịch giữ giới hạn ấy để tránh áp đặt một cách hiểu rộng hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và trực tiếp. Dùng “con” cho đại từ số ít כָּ trong lời Đức Chúa Trời phán với Môi-se, phù hợp ngữ cảnh diễn ngôn. Cụm “làm điếm” được giữ vì sức nặng của nguyên ngữ, kèm chú thích để tránh hiểu thuần túy theo nghĩa đen.
