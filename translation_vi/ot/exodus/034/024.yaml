base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: vi
  text: Vì Ta sẽ đuổi các dân tộc khỏi trước mặt con và mở rộng bờ cõi con. Sẽ không ai tham muốn đất của con khi con lên để ra mắt Yahweh[a], Đức Chúa Trời của con, ba lần mỗi năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “để thấy mặt Yahweh”; đây là thành ngữ chỉ việc đến trình diện trước Ngài để thờ phượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do cho mệnh lệnh hành hương ở câu trước.
- source_word: אוֹרִישׁ גּוֹיִם מִפָּנֶיךָ
  choice: Ta sẽ đuổi các dân tộc khỏi trước mặt con
  rationale: Hiphil của ירשׁ diễn tả việc trục xuất các dân khỏi đất; cách nói này vừa sát nghĩa vừa rõ trong tiếng Việt.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: và mở rộng bờ cõi con
  rationale: גְּבוּל ở đây chỉ phạm vi lãnh thổ; “mở rộng bờ cõi” là cách diễn đạt tự nhiên và trang trọng.
- source_word: וְלֹא־יַחְמֹד אִישׁ אֶת־אַרְצְךָ
  choice: Sẽ không ai tham muốn đất đai của con
  rationale: חמד chỉ lòng ham muốn chiếm lấy; “tham muốn” giữ liên hệ ý nghĩa với điều răn cấm tham muốn. אִישׁ là danh từ giống đực số ít nhưng mang nghĩa đại diện, nên dịch tự nhiên là “không ai”.
- source_word: בַּעֲלֹתְךָ
  choice: khi con lên
  rationale: עלה là cách nói quen thuộc về việc đi lên nơi thờ phượng trong kỳ hành hương.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: để ra mắt
  rationale: Cụm từ theo mặt chữ là “để thấy mặt”, nhưng trong bối cảnh triều kiến và thờ phượng mang nghĩa đến trình diện trước Đấng có thẩm quyền.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: ba lần mỗi năm
  rationale: Diễn đạt trực tiếp tần suất hằng năm một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; giữ “Yahweh” bảo toàn tính chất danh riêng.
- issue: Phạm vi nghĩa của אִישׁ
  choice: không ai
  alternative: không người đàn ông nào
  rationale: Tuy hình thức Hê-bơ-rơ là giống đực số ít, trong mệnh đề phủ định này nó có lực đại diện chung. “Không ai” tránh làm người đọc hiểu sai rằng lời bảo đảm chỉ nói về đàn ông có ý định xâm chiếm.
- issue: Thành ngữ לֵרָאוֹת אֶת־פְּנֵי
  choice: ra mắt Yahweh
  alternative: thấy mặt Yahweh
  rationale: “Ra mắt” truyền đạt ý hành hương để trình diện và thờ phượng, đồng thời không gợi rằng người hành hương nhìn thấy dung nhan Đức Chúa Trời theo nghĩa thể lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/con” theo lời phán trực tiếp của Đức Chúa Trời với dân được nhìn như một cộng đồng số ít. Chọn “bờ cõi” cho sắc thái lãnh thổ và “ra mắt” cho thành ngữ hành hương.
