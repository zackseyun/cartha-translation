  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: vi
  text: Hãy sẵn sàng cho buổi sáng. Sáng hôm ấy, con hãy lên núi Si-nai và đứng trước Ta tại đó, trên đỉnh núi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: Hãy chuẩn bị sẵn sàng
  rationale: Diễn đạt tự nhiên mệnh lệnh kết hợp với tính từ vị ngữ mang nghĩa được chuẩn bị, sẵn sàng.
- source_word: לַבֹּקֶר
  choice: cho buổi sáng
  rationale: Giữ ý quy chiếu đến buổi sáng sắp tới, khi Môi-se phải ở trong trạng thái sẵn sàng, đồng thời phân biệt với בַבֹּקֶר ở mệnh đề kế tiếp.
- source_word: וְעָלִיתָ
  choice: con hãy lên
  rationale: Động từ עלה chỉ sự đi/lên cao; tiếng Việt 'lên' tự nhiên và không buộc phải xác định hướng nhìn là 'đi' hay 'đến'.
- source_word: בַבֹּקֶר
  choice: Sáng hôm ấy
  rationale: Cụm thời gian xác định lúc Môi-se lên núi; cách diễn đạt này nối tự nhiên với 'buổi sáng' vừa được nhắc đến.
- source_word: אֶל הַר סִינַי
  choice: lên núi Si-nai
  rationale: Trong tiếng Việt, kết hợp 'lên núi' diễn đạt tự nhiên cả động tác đi lên và đích đến; địa danh được phiên âm theo cách quen dùng.
- source_word: וְנִצַּבְתָּ לִי שָׁם
  choice: và đứng trình diện trước Ta tại đó
  rationale: נצב ở thể Niphal có nghĩa đứng, đứng vào vị trí; với לִי, cụm 'đứng trình diện trước Ta' giữ cả tư thế đứng lẫn sắc thái ra mắt trước Đức Chúa Trời.
- source_word: עַל רֹאשׁ הָהָר
  choice: trên đỉnh núi
  rationale: רֹאשׁ trong địa hình chỉ đỉnh; 'trên đỉnh núi' rõ ràng, trang trọng và sát hình ảnh Hê-bơ-rơ.
theological_decisions:
- issue: Hướng quy chiếu của động từ עלה
  choice: lên
  alternative: đi lên hoặc đến lên
  rationale: Bản Hê-bơ-rơ tự nó không mã hóa sự đối lập 'đi/đến' như trong một số ngôn ngữ. Chỉ dùng 'lên' bảo toàn hành động đi lên mà không giải quyết quá mức hướng nhìn của lời Đức Chúa Trời.
- issue: Sắc thái của וְנִצַּבְתָּ לִי
  choice: đứng trình diện trước Ta
  alternative: đứng đó cho Ta / đứng trước Ta
  rationale: Cách chọn giữ nghĩa căn bản 'đứng' và quan hệ hướng đến Đức Chúa Trời, nhưng không thêm nghi thức hay nội dung thần học ngoài văn bản.
translation_notes:
  register: 'Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “con” và “Ta” phản ánh lời Đức Chúa Trời trực tiếp phán với Môi-se. Dấu câu chia hai mệnh đề để làm rõ trình tự: chuẩn bị cho buổi sáng, rồi sáng ấy lên núi. Chỉ dùng một chú thích cho phương án thực sự có khác biệt sắc thái; sự mơ hồ hướng nhìn của עלה được giữ bằng động từ trung tính “lên” nên không cần chú thích.'
