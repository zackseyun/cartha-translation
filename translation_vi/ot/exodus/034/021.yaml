  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲבֹ֔ד וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת בֶּ/חָרִ֥ישׁ וּ/בַ/קָּצִ֖יר תִּשְׁבֹּֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: vi
  text: Trong sáu ngày, ngươi phải làm việc; nhưng vào ngày thứ bảy, ngươi phải ngừng làm việc[a]. Trong mùa cày và mùa gặt, ngươi cũng phải ngừng làm việc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nghỉ”. Động từ Hê-bơ-rơ có nghĩa là ngừng hoặc thôi làm, và theo nghĩa mở rộng là nghỉ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Trong sáu ngày
  rationale: Cụm số từ ở dạng liên kết với danh từ chỉ khoảng thời gian sáu ngày; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sự súc tích của tiếng Hê-bơ-rơ.
- source_word: תַּעֲבֹד
  choice: ngươi phải làm việc
  rationale: Động từ Qal chưa hoàn thành ngôi hai số ít giống đực mang lực quy định trong ngữ cảnh giao ước; “phải” thể hiện mệnh lệnh rõ hơn cách hiểu thuần túy cho phép.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: nhưng vào ngày thứ bảy
  rationale: Liên từ waw về hình thức có thể là “và”, nhưng tại đây biểu thị sự tương phản giữa sáu ngày làm việc và ngày thứ bảy ngừng việc; “nhưng” truyền đạt đúng chức năng diễn ngôn.
- source_word: תִּשְׁבֹּת
  choice: ngươi phải ngừng nghỉ
  rationale: שׁבת có nghĩa cốt lõi là ngừng, thôi làm, và theo nghĩa mở rộng là nghỉ. “Ngừng nghỉ” vừa nhấn mạnh việc dừng lao động vừa tự nhiên, trang trọng trong tiếng Việt; chú thích bảo lưu phương án sát nghĩa “ngừng”.
- source_word: בֶּחָרִישׁ
  choice: trong mùa cày
  rationale: חָרִישׁ có thể chỉ việc cày hoặc mùa cày; trong sự đối xứng với mùa gặt, nghĩa thời vụ nông nghiệp là tự nhiên nhất.
- source_word: וּבַקָּצִיר
  choice: hay mùa gặt
  rationale: קָצִיר chỉ sự gặt hái hoặc mùa gặt. “Hay” kết hợp với “dù” để diễn đạt hai hoàn cảnh đều không tạo ngoại lệ, trong khi vẫn giữ cặp mùa vụ của nguyên văn.
- source_word: תִּשְׁבֹּת (lần thứ hai)
  choice: ngươi cũng phải ngừng nghỉ
  rationale: Lặp lại cùng cách dịch để bảo toàn sự nhấn mạnh của nguyên văn rằng quy định vẫn áp dụng trong những mùa nông vụ quan trọng; “cũng” làm rõ lực áp dụng ngay cả khi ấy.
theological_decisions:
- issue: Cách dịch động từ שׁבת liên hệ đến ngày Sa-bát
  choice: Dịch là “ngừng nghỉ” ở cả hai lần xuất hiện.
  alternative: Dịch là “ngừng” hoặc “nghỉ”.
  rationale: “Ngừng nghỉ” giữ được ý cốt lõi là chấm dứt lao động mà không thu hẹp thành trạng thái thư giãn; chú thích nêu rõ phạm vi nghĩa để không che khuất sắc thái từ vựng.
- issue: Phạm vi của cụm mùa cày và mùa gặt
  choice: Diễn đạt là “dù trong mùa cày hay mùa gặt” để cho thấy không có ngoại lệ vào các mùa bận rộn.
  alternative: 'Dịch nối tiếp sát hình thức: “trong mùa cày và trong mùa gặt”.'
  rationale: Ngữ cảnh và sự lặp lại của תִּשְׁבֹּת cho thấy mệnh lệnh ngừng việc áp dụng ngay cả trong hai mùa nông nghiệp then chốt; cấu trúc “dù... hay...” diễn đạt quan hệ này tự nhiên mà không thêm nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phù hợp lời giao ước trực tiếp ở ngôi hai số ít; cấu trúc câu giữ nhịp đối lập giữa sáu ngày lao động và ngày thứ bảy ngừng việc.
