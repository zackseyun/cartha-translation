  to: Ông ở đó cùng Yahweh bốn mươi ngày và bốn mươi đêm; ông không ăn bánh, cũng không uống nước. Rồi ông[a] viết trên các bảng những lời của giao ước, mười lời[b].
  rationale: 'Chỉ sửa những điểm an toàn: bỏ thông tin “đá” không được nêu trong câu Hê-bơ-rơ, điều chỉnh nhẹ cách nối tự nhiên trong tiếng Việt, và giữ “mười lời” ở dạng đồng vị. Chủ thể của “viết” và các chú thích được giữ nguyên để không giải quyết thay sự mơ hồ có chủ ý của văn bản.'
