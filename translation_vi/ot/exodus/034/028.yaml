  - severity: low
    issue: “tức là” diễn giải quan hệ đồng vị
    rationale: Cụm “mười lời” đồng vị với “những lời của giao ước.” Dấu phẩy giữ quan hệ này sát hơn và tránh làm câu như đang giải thích lại theo lối suy diễn.
