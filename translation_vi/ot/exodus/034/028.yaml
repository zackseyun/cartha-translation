  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַֽ/יְהִי שָׁ֣ם עִם יְהוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּ/מַ֖יִם לֹ֣א שָׁתָ֑ה וַ/יִּכְתֹּ֣ב עַל הַ/לֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַ/בְּרִ֔ית עֲשֶׂ֖רֶת הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: vi
  text: Ông ở đó cùng Yahweh bốn mươi ngày và bốn mươi đêm; ông không ăn bánh, cũng không uống nước. Rồi ông[a] viết trên các bảng những lời của giao ước, mười lời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu chủ thể là Yahweh: “Rồi Yahweh viết,” vì ở những chỗ khác, việc viết trên các bảng được quy cho Yahweh (xem Xuất Hành 34:1; Phục Truyền Luật Lệ Ký 10:4).'
    reason: alternative_reading
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: “mười lời”; theo cách gọi truyền thống: “Mười Điều Răn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, phản ánh trực tiếp danh YHWH trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: וַיְהִי שָׁם עִם
  choice: Ông ở đó với
  rationale: Diễn đạt tự nhiên tình trạng hiện diện của Môi-se ở đó với Yahweh, không thêm sắc thái như “lưu lại” hay “ở suốt” vốn không được nói rõ.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: bốn mươi ngày và bốn mươi đêm
  rationale: Chuyển ngữ trực tiếp và giữ nguyên cấu trúc chỉ thời gian của nguyên văn.
- source_word: לֶחֶם לֹא אָכַל
  choice: ông không ăn bánh
  rationale: Giữ danh từ cụ thể “bánh” của nguyên văn, thay vì khái quát hóa thành “thức ăn”.
- source_word: וּמַיִם לֹא שָׁתָה
  choice: cũng không uống nước
  rationale: Giữ sự song hành với vế không ăn bánh, đồng thời dùng “cũng” cho câu tiếng Việt tự nhiên.
- source_word: וַיִּכְתֹּב
  choice: Rồi ông viết
  rationale: Động từ ở ngôi thứ ba số ít giống đực và không nêu lại chủ ngữ. Theo mạch cú pháp gần nhất, đại từ tiếp tục chỉ Môi-se; vấn đề chủ thể được ghi nhận trong chú thích.
- source_word: עַל הַלֻּחֹת
  choice: trên các bảng đá
  rationale: “Các bảng đá” là cách gọi rõ ràng, tự nhiên trong tiếng Việt đối với các bảng giao ước; chất liệu đá được xác định bởi ngữ cảnh gần trong Xuất Hành 34:1.
- source_word: דִּבְרֵי הַבְּרִית
  choice: những lời của giao ước
  rationale: Giữ quan hệ sở thuộc trong cụm từ Hê-bơ-rơ và ý nghĩa giao ước của lời được ghi trên các bảng.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: mười lời
  rationale: Phản ánh sát nghĩa cụm từ Hê-bơ-rơ, theo nghĩa đen là “mười lời”; tên gọi quen thuộc “Mười Điều Răn” được đưa vào chú thích.
theological_decisions:
- issue: Chủ thể của động từ “viết” trong mệnh đề cuối
  choice: Giữ cách đọc gần nhất theo cú pháp là “ông” (Môi-se), nhưng không nêu tên Môi-se trong câu.
  alternative: “Yahweh viết,” dựa trên Xuất Hành 34:1 và Phục Truyền Luật Lệ Ký 10:4.
  rationale: 'Trong câu này, chuỗi động từ ngôi thứ ba số ít tự nhiên tiếp tục cùng chủ thể: ông ở đó, không ăn, không uống, rồi viết. Tuy nhiên, các phân đoạn liên quan quy việc viết trên bảng cho Yahweh. Chú thích bảo tồn sự căng thẳng thật này thay vì âm thầm dung hòa.'
- issue: Cách dịch עֲשֶׂרֶת הַדְּבָרִים
  choice: mười lời
  alternative: Mười Điều Răn
  rationale: “Mười lời” giữ sát từ ngữ của nguyên bản; “Mười Điều Răn” là tên gọi truyền thống và dễ nhận biết, nhưng diễn giải דְּבָרִים theo nghĩa các điều răn.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” để giữ chủ thể ngầm của nguyên văn mà không bổ sung tên riêng. Các dấu chú thích được đặt ngay tại những từ ngữ thực sự liên quan: [a] sau chủ thể của “viết” và [b] sau “mười lời”.'
