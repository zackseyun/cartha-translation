source:
  edition: WLC
  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: vi
  text: A-rôn và tất cả con cái Y-sơ-ra-ên thấy Môi-se; kìa, da mặt ông tỏa sáng[a], và họ sợ không dám đến gần ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chiếu sáng” hoặc “phát ra những tia sáng”. Động từ Hê-bơ-rơ này hiếm gặp và trong lịch sử cũng từng được dịch là “mọc sừng”, nhưng ngữ cảnh nghiêng về ý tỏa sáng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: nhìn thấy
  rationale: Động từ ראה trong mạch kể chuyện diễn tả việc A-rôn và dân chúng trông thấy Môi-se; “nhìn thấy” tự nhiên trong tiếng Việt và giữ được ý tri nhận bằng mắt.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: và toàn thể con cái Y-sơ-ra-ên
  rationale: “Con cái Y-sơ-ra-ên” giữ hình ảnh thân tộc của בְּנֵי יִשְׂרָאֵל, đồng thời trong tiếng Việt có thể chỉ toàn thể cộng đồng chứ không chỉ nam giới.
- source_word: וְהִנֵּה
  choice: thì kìa
  rationale: Tiểu từ này hướng sự chú ý đến điều bất ngờ hiện ra trước mắt; “thì kìa” giữ sắc thái trực chỉ và ngạc nhiên của câu chuyện.
- source_word: קָרַן
  choice: tỏa sáng
  rationale: Trong ngữ cảnh này, động từ hiếm קָרַן nói đến việc phát ra ánh sáng hay tia sáng. “Tỏa sáng” rõ nghĩa, tự nhiên và phù hợp với phản ứng sợ hãi của dân chúng.
- source_word: עוֹר פָּנָיו
  choice: da mặt ông
  rationale: Bản Hê-bơ-rơ nói cụ thể đến “da mặt ông,” không chỉ nói chung là “mặt ông”; cách dịch này giữ hình ảnh cụ thể của nguyên văn.
- source_word: וַיִּירְאוּ
  choice: họ sợ
  rationale: Cách diễn đạt ngắn gọn, tự nhiên này truyền đạt trực tiếp phản ứng sợ hãi của A-rôn và dân Y-sơ-ra-ên.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: đến gần ông
  rationale: מִן đi với động từ nguyên mẫu diễn tả việc họ e ngại, không dám tiến đến; kết hợp với “sợ,” cụm “sợ đến gần ông” là tự nhiên và chính xác trong tiếng Việt.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; các con trai Y-sơ-ra-ên
  rationale: Cách chọn giữ lối gọi mang tính gia tộc của tiếng Hê-bơ-rơ mà không khiến độc giả tiếng Việt hiểu sai rằng câu chỉ nói đến những người nam.
- issue: Ý nghĩa của קָרַן khi mô tả mặt Môi-se
  choice: tỏa sáng
  alternative: chiếu sáng; phát ra những tia sáng; mọc sừng
  rationale: Ngữ cảnh nói đến hiện tượng sáng chói sau khi Môi-se gặp Đức Giê-hô-va và đến nỗi dân chúng sợ đến gần. Vì vậy, nghĩa liên quan đến ánh sáng phù hợp hơn nghĩa “mọc sừng”; tuy nhiên, nét đa nghĩa và lịch sử dịch thuật được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Cấu trúc “thì kìa” được giữ để truyền đạt sự chú ý đột ngột của וְהִנֵּה, còn “da mặt” bảo toàn tính cụ thể của nguyên văn.
