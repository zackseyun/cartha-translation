  text: וְ/אַחֲרֵי כֵ֥ן נִגְּשׁ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יְצַוֵּ֕/ם אֵת֩ כָּל אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אִתּ֖/וֹ בְּ/הַ֥ר סִינָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: vi
  text: Sau đó, tất cả con cái Israel[a] đến gần, và ông truyền cho họ mọi điều Yahweh đã phán với ông trên núi Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: «các con trai Israel»; đây là một cách gọi dân tộc, thường được dịch là «dân Israel» hoặc «con cái Israel».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sau đó
  rationale: Diễn tả tự nhiên trình tự tiếp theo của câu chuyện mà không thêm ý.
- source_word: נִגְּשׁוּ
  choice: đến gần
  rationale: Giữ nghĩa cụ thể của thể Niphal động từ נגשׁ là tiến lại hoặc đến gần, phù hợp với bối cảnh dân chúng trước đó e ngại gương mặt Môi-se.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: toàn thể con cái Israel
  rationale: Đây là cách gọi dân tộc mang tính tập thể. “Con cái Israel” vừa gần với cấu trúc Hê-bơ-rơ vừa tự nhiên hơn “các con trai Israel” trong tiếng Việt, vì cụm từ chỉ toàn dân chứ không nhất thiết chỉ nam giới.
- source_word: וַיְצַוֵּם
  choice: ông truyền cho họ
  rationale: Động từ צוה mang sức nặng của việc ban truyền mệnh lệnh; “truyền cho” trang trọng, rõ nghĩa và không làm nhẹ thành chỉ “dạy bảo”.
- source_word: אֵת כָּל אֲשֶׁר
  choice: mọi điều
  rationale: Cách diễn đạt tiếng Việt gọn và tự nhiên, bao quát toàn bộ nội dung được Yahweh phán.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: Yahweh đã phán với ông
  rationale: “Đã phán” thể hiện lời phán xảy ra trước lúc Môi-se truyền lại; “với ông” bảo toàn sắc thái tương tác của אִתּוֹ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng giao ước thay vì thay thế bằng một tước hiệu.
- source_word: בְּהַר סִינָי
  choice: trên núi Sinai
  rationale: Giữ chính xác địa điểm và dùng cấu trúc tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng Danh Bốn Chữ; “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: các con trai Israel; dân Israel
  rationale: Trong ngữ cảnh, đây là thành ngữ dân tộc chỉ cộng đồng Israel. “Con cái Israel” bảo toàn hình ảnh quan hệ dòng dõi mà không khiến độc giả hiểu sai rằng chỉ có nam giới đến gần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để quy chiếu Môi-se vì tên ông đã rõ từ ngữ cảnh liền trước; giữ các tên riêng theo dạng quốc tế “Israel”, “Sinai” và “Yahweh”.
