  text: לֹֽא תִשְׁחַ֥ט עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹא יָלִ֣ין לַ/בֹּ֔קֶר זֶ֖בַח חַ֥ג הַ/פָּֽסַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: vi
  text: Ngươi không được giết sinh tế của Ta khi có đồ lên men[a]; cũng không được để sinh tế của kỳ lễ Vượt Qua lại cho đến sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Ngươi không được giết huyết của sinh tế Ta trên men.” Cách nói cô đọng này có thể mang nghĩa không được giết sinh tế khi có men, hoặc cùng với đồ có men.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט
  choice: giết sinh tế
  rationale: Động từ שׁחט chỉ việc giết con vật, đặc biệt là giết theo nghi thức hiến tế. “Giết sinh tế” vừa giữ hành động cụ thể vừa làm rõ bối cảnh tế lễ.
- source_word: עַל חָמֵץ
  choice: khi có đồ lên men
  rationale: Giới từ עַל trong lệnh cấm nghi lễ này có thể chỉ sự đồng thời hoặc hiện diện kèm theo. Cách dịch này tự nhiên trong tiếng Việt và không thu hẹp ý nghĩa thành riêng bánh có men.
- source_word: דַּם זִבְחִי
  choice: sinh tế dâng cho ta
  rationale: Nguyên văn nói sát chữ là “huyết sinh tế của ta”, nhưng động từ “giết” về mặt ngữ nghĩa tác động đến con vật, còn huyết đại diện cho hành vi hiến tế. Bản dịch diễn đạt phép hoán dụ bằng tiếng Việt tự nhiên; chú thích giữ lại cấu trúc nguyên văn.
- source_word: יָלִין
  choice: không được để ... lại đến sáng
  rationale: Trong quy định tế lễ, לין nói đến việc để lễ vật qua đêm. Cụm “đến sáng” đã nêu rõ giới hạn thời gian nên không cần thêm “qua đêm”.
- source_word: זֶבַח חַג הַפָּסַח
  choice: sinh tế của kỳ lễ Vượt Qua
  rationale: Giữ cả זבח “sinh tế” và חג “kỳ lễ”, đồng thời thể hiện chuỗi danh từ cô đọng của tiếng Hê-bơ-rơ bằng cấu trúc tiếng Việt rõ ràng.
- source_word: הַפָּסַח
  choice: lễ Vượt Qua
  rationale: “Lễ Vượt Qua” là cách gọi tiếng Việt đã quen thuộc, phù hợp với bối cảnh nghi lễ của Y-sơ-ra-ên mà không đưa thêm cách giải thích thần học về sau.
theological_decisions:
- issue: Cách gọi thuật ngữ lễ hội giao ước mà không đưa vào những liên hệ giáo lý về sau
  choice: lễ Vượt Qua
  alternative: lễ Pê-sa
  rationale: “Lễ Vượt Qua” truyền đạt rõ thuật ngữ פֶּסַח trong bối cảnh luật pháp Môi-se và duy trì mối liên hệ trong toàn bộ Kinh Thánh, nhưng không áp đặt một cách giải nghĩa thần học ngoài câu.
- issue: Quan hệ giữa “huyết”, “sinh tế” và hành động giết tế
  choice: Diễn đạt tự nhiên là “giết sinh tế dâng cho ta”, đồng thời ghi cấu trúc sát chữ trong chú thích
  alternative: “giết huyết sinh tế của ta”
  rationale: Cấu trúc Hê-bơ-rơ cô đọng và dùng “huyết” theo phép hoán dụ. Dịch sát từng chữ trong tiếng Việt dễ khiến người đọc hiểu sai rằng huyết là đối tượng bị giết; chú thích bảo tồn chi tiết nguyên văn mà không làm câu chính tối nghĩa.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. Dùng “ngươi” để phản ánh lời phán trực tiếp ở số ít; “sinh tế” giữ sắc thái nghi lễ, còn “đồ lên men” tránh giới hạn חָמֵץ vào riêng bánh.
