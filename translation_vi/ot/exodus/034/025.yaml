  - severity: low
    issue: Cụm “để ... lại đến sáng” chưa tự nhiên.
    rationale: Trong tiếng Việt hiện đại, “để ... lại cho đến sáng” diễn đạt rõ việc không để lễ vật còn lại qua đêm đến sáng.
