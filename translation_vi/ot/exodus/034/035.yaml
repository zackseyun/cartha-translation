source:
  edition: WLC
  text: וְ/רָא֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְ/הֵשִׁ֨יב מֹשֶׁ֤ה אֶת הַ/מַּסְוֶה֙ עַל פָּנָ֔י/ו עַד בֹּא֖/וֹ לְ/דַבֵּ֥ר אִתּֽ/וֹ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: vi
  text: Dân Israel[a] nhìn thấy mặt Môi-se và thấy rằng da mặt ông tỏa sáng[b]; rồi Môi-se lại phủ khăn che mặt lên mặt mình cho đến khi ông vào nói chuyện với Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Israel”, thường được dịch là “dân Israel”.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hê-bơ-rơ có nghĩa là “tỏa sáng” hoặc “phát ra các tia sáng”; cách dịch cổ “mọc sừng” bắt nguồn từ sự hiểu sai từ này.
    reason: lexical_alternative
  - marker: c
    text: “Ngài” ở đây chỉ Đức Giê-hô-va theo ngữ cảnh trực tiếp.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: nhìn thấy
  rationale: Động từ chỉ việc dân Israel trông thấy diện mạo Môi-se; cách dịch này tự nhiên trong tiếng Việt và phù hợp với lời tóm thuật diễn tiến.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Dân Israel
  rationale: Cụm Hê-bơ-rơ có nghĩa đen là “các con trai của Israel”, nhưng “dân Israel” là cách gọi tự nhiên, bao quát và quen thuộc trong tiếng Việt hiện đại.
- source_word: קָרַן
  choice: tỏa sáng
  rationale: Động từ diễn tả việc phát ra ánh sáng hoặc tia sáng; “tỏa sáng” giữ được hình ảnh ấy mà không theo cách hiểu cổ sai lệch là “mọc sừng”.
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: da mặt ông
  rationale: Giữ rõ danh từ עוֹר là “da”, đồng thời dùng đại từ để tránh lặp tên Môi-se một cách nặng nề trong tiếng Việt.
- source_word: וְהֵשִׁיב
  choice: lại phủ
  rationale: Thể Hiphil của שוב mang nghĩa đặt hoặc đưa trở lại; “lại phủ” vừa diễn đạt việc đặt khăn trở lại vừa phù hợp với hành động lặp lại trong ngữ cảnh.
- source_word: הַמַּסְוֶה
  choice: khăn che mặt
  rationale: Diễn đạt rõ đây là vật che phủ khuôn mặt; tự nhiên và dễ hiểu hơn từ “mạng” trong tiếng Việt hiện đại.
- source_word: עַד בֹּאוֹ
  choice: cho đến khi ông vào
  rationale: Diễn đạt giới hạn thời gian của việc che mặt và chuyển động đi vào nơi hiện diện của Đức Giê-hô-va.
- source_word: לְדַבֵּר אִתּוֹ
  choice: nói chuyện với Ngài
  rationale: Giữ đại từ của nguyên văn; “Ngài” phù hợp với đối tượng được nhắc đến trong ngữ cảnh trực tiếp là Đức Giê-hô-va.
theological_decisions:
- issue: Đối tượng của đại từ trong cụm “nói chuyện với Ngài”
  choice: Giữ đại từ “Ngài” trong chính văn và chú thích rằng đại từ chỉ Đức Giê-hô-va.
  alternative: Dịch trực tiếp là “nói chuyện với Đức Giê-hô-va”.
  rationale: Nguyên văn dùng đại từ chứ không lặp lại danh Đức Chúa Trời. Giữ đại từ bảo toàn hình thức nguồn, còn chú thích làm rõ đối tượng từ ngữ cảnh ngay trước đó.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu văn dễ đọc. “Dân Israel” và “khăn che mặt” ưu tiên tính tự nhiên trong tiếng Việt, còn “da mặt” giữ nét cụ thể của nguyên văn. Dấu chấm phẩy duy trì quan hệ chặt giữa việc dân chúng thấy ánh sáng và việc Môi-se phủ khăn trở lại.
