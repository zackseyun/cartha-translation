  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: vi
  text: Nhưng mỗi khi Môi-se vào trước mặt Yahweh để thưa chuyện với Ngài, ông tháo khăn che mặt cho đến lúc đi ra. Rồi ông đi ra và nói cho dân Israel[a] mọi điều ông đã được truyền lệnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Israel”; đây là cách gọi dân Israel.'
    reason: Giữ lại hình thức của thành ngữ Hê-bơ-rơ đồng thời tránh khiến độc giả hiểu rằng câu này chỉ nói đến nam giới hoặc các con trai trực hệ.
lexical_decisions:
- source_word: וּבְבֹא
  choice: Nhưng mỗi khi ... vào
  rationale: Cụm ב + động từ nguyên thể diễn tả hoàn cảnh lặp lại; “mỗi khi” thể hiện tính thường xuyên, còn “nhưng” nối với sự tương phản nhẹ ở câu trước.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: לִפְנֵי có nghĩa là “trước mặt/trong sự hiện diện của”; giữ nguyên danh riêng giao ước יְהוָה dưới dạng “Yahweh”.
- source_word: לְדַבֵּר אִתּוֹ
  choice: để thưa chuyện với Ngài
  rationale: Động từ nguyên thể nêu mục đích; אִתּוֹ sau דבר cho phép sắc thái đối thoại “với Ngài”. “Thưa chuyện” tự nhiên, trang trọng và phù hợp với việc Môi-se vào trước mặt Đức Chúa Trời.
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: ông tháo khăn che mặt
  rationale: Dạng chưa hoàn thành trong khung cảnh lặp lại chỉ hành động theo lệ thường. מַסְוֶה là vật che khuôn mặt; “khăn che mặt” rõ nghĩa hơn “mạng che” trong tiếng Việt hiện đại.
- source_word: עַד־צֵאתוֹ
  choice: cho đến lúc đi ra
  rationale: Giới từ עַד cùng động từ nguyên thể đánh dấu thời hạn kéo dài tới lúc Môi-se ra ngoài.
- source_word: וְיָצָא וְדִבֶּר
  choice: Rồi ông đi ra và nói lại
  rationale: Hai động từ tiếp nối chuỗi hành động thường xuyên. “Nói lại” thể hiện việc Môi-se chuyển đạt cho Israel điều vừa nhận mà không thêm ý rằng ông tự diễn giải.
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: cho dân Israel[a]
  rationale: Đây là thành ngữ chỉ cộng đồng giao ước Israel. “Dân Israel” tự nhiên và đúng phạm vi trong tiếng Việt; cách dịch sát hình thức được ghi ở chú thích.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: mọi điều ông đã được truyền dạy
  rationale: Dạng Pual bị động diễn tả những điều được truyền cho Môi-se trước khi ông thuật lại. Không nêu chủ thể của thể bị động, theo đúng cấu trúc nguồn.
theological_decisions:
- issue: Cách chuyển danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn ghi trực tiếp Tứ Danh; dùng “Yahweh” bảo tồn danh giao ước thay vì thay bằng một tước hiệu.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: dân Israel
  alternative: các con trai của Israel / con cái Israel
  rationale: Trong ngữ cảnh, cụm Hê-bơ-rơ chỉ toàn thể cộng đồng Israel chứ không chỉ những người nam hay các con trai trực hệ của tổ phụ Israel. Chú thích vẫn bảo tồn hình thức nguyên văn.
- issue: Chủ thể ngầm trong יְצֻוֶּה
  choice: 'giữ thể bị động: “ông đã được truyền dạy”'
  alternative: “Yahweh đã truyền dạy ông”
  rationale: Ngữ cảnh cho thấy mệnh lệnh đến từ Yahweh, nhưng nguyên văn dùng thể bị động và không nêu chủ thể; bản dịch không bổ sung điều văn bản để ngầm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Thưa chuyện” biểu thị lời nói kính cẩn mà vẫn giữ sắc thái “nói với” của nguyên văn; “khăn che mặt” tránh sắc thái cổ hoặc dễ gây nhầm của “mạng che”. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
