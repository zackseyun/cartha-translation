revisions:
- from: Nhưng mỗi khi Môi-se vào trước mặt Yahweh để thưa chuyện với Ngài, ông tháo khăn che mặt cho đến lúc đi ra. Rồi ông đi ra và nói lại cho dân Israel[a] mọi điều ông đã được truyền dạy.
  to: Nhưng mỗi khi Môi-se vào trước mặt Yahweh để thưa chuyện với Ngài, ông tháo khăn che mặt cho đến lúc đi ra. Rồi ông đi ra và nói cho dân Israel[a] mọi điều ông đã được truyền lệnh.
  rationale: Thay “được truyền dạy” bằng “được truyền lệnh” để phản ánh chính xác thể Pual của צוה. Thay “nói lại cho” bằng “nói cho” để không thêm hàm ý lặp lại. Các yếu tố còn lại đều có thể giữ nguyên vì phản ánh tốt cấu trúc lặp lại, sự hiện diện trước Yahweh, vật che mặt, và cách gọi cộng đồng Israel.
  reviewer_model: gpt-5.6-terra
