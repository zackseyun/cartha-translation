    rationale: Chú thích này giải thích cách hiểu khác của בְּדַבְּרוֹ אִתּוֹ, được dịch là “vì ông đã thưa chuyện với Ngài”; cần đặt ngay sau cụm ấy để neo chú thích rõ ràng.
