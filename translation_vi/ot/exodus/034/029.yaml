base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: vi
  text: Khi Môi-se từ núi Si-nai xuống, ông cầm trong tay hai bảng chứng ngôn. Trong lúc từ núi xuống, Môi-se không biết da mặt mình tỏa sáng[a], vì ông đã thưa chuyện với Ngài[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phát ra những tia sáng”. Cách dịch cổ “có sừng” dựa trên sự liên hệ với từ Hê-bơ-rơ chỉ “sừng”, nhưng không phù hợp với ngữ cảnh bằng nghĩa “tỏa sáng”.'
    reason: lexical_alternative
  - marker: b
    text: “Ngài” ở đây chỉ Đức Giê-hô-va.
    reason: referent_clarification
  - marker: c
    text: 'Cụm này cũng có thể hiểu theo nghĩa thời gian: “khi ông thưa chuyện với Ngài”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּרֶדֶת
  choice: Khi ... xuống
  rationale: Cấu trúc וַיְהִי kết hợp với động từ nguyên mẫu nêu hoàn cảnh thời gian của cảnh mới. Tiếng Việt tự nhiên không cần dịch riêng thành “và đã xảy ra”.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: hai bảng Chứng Ngôn
  rationale: Giữ hình ảnh cụ thể của hai bảng đá và nghĩa “chứng ngôn/lời chứng” của עֵדוּת trong bối cảnh giao ước, nhưng không diễn giải rộng thành toàn bộ văn kiện giao ước.
- source_word: בְּיַד מֹשֶׁה
  choice: ông cầm trong tay
  rationale: Diễn đạt tự nhiên trong tiếng Việt đồng thời giữ hình ảnh cụ thể của bản Hê-bơ-rơ.
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: Khi ... xuống ... Trong lúc ... xuống
  rationale: Giữ sự lặp lại có chủ ý của động từ ירד, dùng hai cấu trúc thời gian tự nhiên trong tiếng Việt.
- source_word: קָרַן
  choice: tỏa sáng
  rationale: Trong ngữ cảnh này, động từ chỉ việc phát ra tia sáng hay trở nên rạng ngời; “tỏa sáng” rõ nghĩa và vẫn gợi được ánh sáng phát ra.
- source_word: עוֹר פָּנָיו
  choice: da mặt mình
  rationale: Giữ danh từ עוֹר, “da”, thay vì giản lược thành “mặt”; “mình” quy chiếu tự nhiên về chủ ngữ Môi-se.
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: vì ông đã thưa chuyện với Ngài
  rationale: Hiểu בְּ theo quan hệ nguyên nhân phù hợp với mạch văn, đồng thời giữ các đại từ của nguyên bản. “Thưa chuyện” diễn tả việc Môi-se nói với Đức Giê-hô-va trong văn phong trang trọng; cách hiểu theo thời gian được ghi ở chú thích.
theological_decisions:
- issue: Ý nghĩa của קָרַן đối với da mặt Môi-se
  choice: tỏa sáng
  alternative: mọc sừng; phát ra tia sáng
  rationale: Mạch văn nói đến vinh quang hữu hình sau cuộc gặp Đức Giê-hô-va; nghĩa “tỏa sáng” phù hợp ngữ cảnh hơn nghĩa lịch sử “mọc sừng” mà không thêm một hình ảnh thân thể gây hiểu lầm.
- issue: Chủ thể và đối tượng trong בְּדַבְּרוֹ אִתּוֹ
  choice: ông đã thưa chuyện với Ngài
  alternative: Ngài đã phán với ông; khi ông thưa chuyện với Ngài
  rationale: Các đại từ giống đực trong tiếng Hê-bơ-rơ không tự nêu danh tính; mạch văn cho phép hiểu Môi-se là người nói với Đức Giê-hô-va. Bản dịch giữ cách gọi bằng đại từ, còn chú thích xác định quy chiếu theo ngữ cảnh và bảo lưu khả năng hiểu cấu trúc theo thời gian.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Si-nai” theo lối phiên âm quen thuộc; viết hoa “Chứng Ngôn” để chỉ tên gọi của hai bảng trong bối cảnh này. Câu được chia làm hai để tránh cấu trúc quá nặng trong tiếng Việt, nhưng vẫn giữ sự lặp lại “từ núi xuống” của nguyên bản.
