base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: vi
  text: Hãy tuân giữ điều Ta truyền cho con hôm nay[a]. Này, Ta đang đuổi dân A-mô-rít, dân Ca-na-an, dân Hê-tít, dân Phê-rê-xít, dân Hê-vít và dân Giê-bu-sít khỏi trước mặt con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy vâng giữ điều Ta truyền cho con hôm nay” hoặc “Hãy cẩn thận về điều Ta truyền cho con hôm nay.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “khỏi trước mặt con”; cụm từ này chỉ việc loại họ khỏi sự hiện diện của con. “Ta đang đuổi” cũng có thể hiểu là “Ta sắp đuổi” hay “Ta sẽ đuổi.”'
    reason: lexical_and_aspectual_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: Hãy tuân giữ
  rationale: Mệnh lệnh שׁמר trong ngữ cảnh giao ước có nghĩa là gìn giữ, vâng giữ hoặc tuân theo. “Tuân giữ” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái tích cực của việc ghi nhớ và làm theo; לְךָ không cần dịch tách biệt vì ở đây chủ yếu làm nổi bật trách nhiệm của người nghe.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: điều Ta truyền cho con hôm nay
  rationale: Diễn đạt trực tiếp mệnh đề quan hệ và giữ thì hiện tại theo phân từ מְצַוְּךָ. Đại từ “Ta/con” phù hợp lời Đức Chúa Trời phán với Môi-se trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: הִנְנִי
  choice: Này, Ta
  rationale: הִנְנִי hướng sự chú ý đến hành động chắc chắn và nổi bật của chính Đức Chúa Trời. “Này, Ta” trang trọng nhưng vẫn dễ hiểu, đồng thời giữ sự nhấn mạnh vào chủ thể ngôi thứ nhất.
- source_word: גֹרֵשׁ
  choice: đang đuổi
  rationale: Phân từ גֹרֵשׁ sau הִנְנִי trình bày hành động như đang diễn ra, cận kề hoặc chắc chắn. “Đang đuổi” giữ hình ảnh sống động của cấu trúc Hê-bơ-rơ mà không đổi hẳn thành thì tương lai.
- source_word: מִפָּנֶיךָ
  choice: khỏi trước mặt con
  rationale: Cụm từ có nghĩa đen là “khỏi trước mặt con,” chỉ việc loại các dân ấy khỏi sự hiện diện hoặc khỏi con đường phía trước của Ít-ra-ên. Cách dịch này bảo toàn hình ảnh không gian của nguyên văn.
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: dân A-mô-rít, dân Ca-na-an, dân Hê-tít, dân Phê-rê-xít, dân Hê-vít và dân Giê-bu-sít
  rationale: Các danh từ dân tộc ở số ít tập hợp trong tiếng Hê-bơ-rơ được dịch tự nhiên bằng “dân” kèm tên dân tộc; các tên riêng được phiên âm theo lối quen thuộc, dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Sắc thái mệnh lệnh của שׁמר trong bối cảnh giao ước
  choice: Dịch là “Hãy tuân giữ,” chỉ mệnh lệnh ghi nhớ và làm theo điều Đức Chúa Trời truyền.
  alternative: “Hãy cẩn thận về điều Ta truyền cho con” hoặc “Hãy làm theo điều Ta truyền cho con.”
  rationale: Nguyên văn cho phép sắc thái gìn giữ, chú tâm và tuân theo, nhưng không nói rõ thêm động từ “làm.” “Tuân giữ” bảo toàn nội dung giao ước mà không bổ sung một công thức cảnh báo hay giải thích thần học.
- issue: Thời tính của גֹרֵשׁ sau הִנְנִי
  choice: Giữ cách trình bày sống động bằng “Ta đang đuổi.”
  alternative: “Ta sắp đuổi” hoặc “Ta sẽ đuổi.”
  rationale: Cấu trúc có thể chỉ hành động đang diễn ra, sắp xảy ra hoặc chắc chắn sẽ xảy ra. Bản chính không âm thầm biến cấu trúc thành một lời hứa thuần túy ở thì tương lai; chú thích ghi nhận các khả năng còn lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Này” để giữ chức năng hướng sự chú ý của הִנְנִי; dùng “dân” trước từng tên dân tộc để làm rõ các danh từ tập hợp và tạo nhịp đọc tự nhiên.
