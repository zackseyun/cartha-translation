base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/017.yaml
  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: vi
  text: Ngươi không được làm cho mình các thần tượng đúc bằng kim loại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thần bằng kim loại đúc” hoặc “các thần đúc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: các thần tượng
  rationale: Dạng số nhiều ở thể liên kết của אֱלֹהִים chỉ các thần được thể hiện thành vật thờ trong ngữ cảnh cấm thờ hình tượng. “Các thần tượng” là cách nói tự nhiên trong tiếng Việt và làm rõ đối tượng cụ thể mà không chỉ dịch thành “hình tượng”.
- source_word: מַסֵּכָה
  choice: bằng kim loại đúc
  rationale: Danh từ chỉ vật được đúc, đặc biệt là tượng kim loại. Cụm “bằng kim loại đúc” giữ được cả ý về vật liệu lẫn phương thức chế tác.
- source_word: לֹא תַעֲשֶׂה
  choice: không được làm
  rationale: Trong văn cảnh luật cấm, cấu trúc phủ định với động từ chưa hoàn thành diễn đạt một mệnh lệnh cấm; “không được làm” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: לָּךְ
  choice: cho mình
  rationale: Giới từ kèm hậu tố ngôi hai số ít diễn tả lợi ích hoặc mục đích hướng về chính người nghe; “cho mình” giữ sắc thái phản thân và hợp với tiếng Việt.
theological_decisions:
- issue: Bản chất của vật bị cấm chế tạo
  choice: “các thần tượng bằng kim loại đúc,” chỉ những thần được tạo thành tượng đúc để thờ
  alternative: “các thần bằng kim loại đúc” hoặc “các tượng đúc”
  rationale: Tiếng Hê-bơ-rơ kết hợp từ “các thần” với từ chỉ vật đúc. “Các thần tượng bằng kim loại đúc” giữ rõ sức nặng chống thờ hình tượng, đồng thời tránh làm mất một trong hai yếu tố của nguyên văn.
translation_notes:
  register: Văn phong luật truyền thống nhưng dễ hiểu trong tiếng Việt hiện đại. Đại từ “ngươi” phù hợp lời phán trực tiếp ở số ít; câu ngắn, trang trọng, không thêm diễn giải giáo phái.
