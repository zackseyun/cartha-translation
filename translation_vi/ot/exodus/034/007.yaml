  to: Đấng gìn giữ tình yêu thành tín cho hàng ngàn[a], tha thứ gian ác, phản nghịch và tội lỗi; nhưng Ngài quyết không tuyên trắng án[b], xét tội lỗi của cha ông[c] trên con cái và cháu chắt, đến đời thứ ba và thứ tư.
  rationale: 'Bản sửa không giải quyết theo một hướng thần học cơ chế việc xét tội liên thế hệ, nhưng giữ cấu trúc: tội lỗi thuộc về cha ông, còn sự xét đến đặt trên con cái và cháu chắt. Cũng giữ “hàng ngàn” không thêm “người” hoặc “thế hệ,” đồng thời chuyển khả năng diễn giải vào chú thích. Các neo chú thích được đặt lại theo đúng từ/cụm từ chúng giải thích.'
