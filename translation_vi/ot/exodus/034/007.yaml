base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: vi
  text: Đấng gìn giữ tình yêu thành tín cho hàng ngàn[a], tha thứ gian ác, phản nghịch và tội lỗi; nhưng Ngài quyết không tuyên trắng án[b], xét tội lỗi của cha ông[c] trên con cái và cháu chắt, đến đời thứ ba và thứ tư.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “cho hàng ngàn thế hệ.” Nguyên văn chỉ nói “cho hàng ngàn,” có lẽ nhằm tương phản tình yêu thành tín lâu bền của Đức Chúa Trời với việc xét tội đến đời thứ ba và thứ tư.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “Ngài chắc chắn không tuyên trắng án” hoặc “Ngài quyết không để khỏi bị trừng phạt.”'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn nói “cha ông” (giống đực), nhưng “con cái và cháu chắt” chỉ sự tiếp nối các thế hệ nói chung.
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: gìn giữ
  rationale: Phân từ Qal diễn tả hành động gìn giữ, bảo tồn liên tục; “gìn giữ” tự nhiên và trang trọng trong lời tự bày tỏ này.
- source_word: חֶסֶד
  choice: tình yêu thành tín
  rationale: Diễn đạt cả tình yêu thương lẫn lòng trung tín bền vững, đặc biệt trong quan hệ giao ước.
- source_word: לָאֲלָפִים
  choice: cho hàng ngàn người
  rationale: Nguyên văn chỉ nói “cho hàng ngàn”; thêm “người” để câu tiếng Việt tự nhiên nhưng không đưa “thế hệ” vào chính văn. Khả năng hiểu theo thế hệ được ghi ở chú thích.
- source_word: נֹשֵׂא
  choice: tha thứ
  rationale: Động từ có nghĩa đen là mang hoặc cất đi, nhưng khi đi với các từ chỉ tội lỗi thì mang nghĩa thành ngữ là tha thứ.
- source_word: עָוֺן
  choice: sự gian ác
  rationale: Giữ sắc thái đạo đức nặng của từ, đồng thời phù hợp với tiếng Việt hiện đại hơn “tội nghiệt”.
- source_word: פֶשַׁע
  choice: sự phản nghịch
  rationale: Làm rõ ý chống nghịch hoặc phá vỡ bổn phận, là sắc thái nổi bật của פשע.
- source_word: חַטָּאָה
  choice: tội lỗi
  rationale: Cách dịch trực tiếp, phổ thông, hoàn tất chuỗi ba thuật ngữ về tội.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: nhưng Ngài quyết không miễn tội
  rationale: Cấu trúc nguyên thể tuyệt đối với động từ hữu hạn nhấn mạnh sự phủ định. “Quyết không miễn tội” giữ sắc thái pháp lý mà không thêm đối tượng “kẻ có tội” vốn không hiện diện rõ trong nguyên văn.
- source_word: פֹּקֵד
  choice: xét
  rationale: פקד có nghĩa rộng là lưu tâm, xét đến hoặc xử lý. Trong ngữ cảnh phán xét, “xét” giữ được tính mở của từ hơn cách dịch thu hẹp thành “trừng phạt”.
- source_word: עֲוֺן אָבוֹת
  choice: sự gian ác của cha ông
  rationale: “Cha ông” phản ánh danh từ giống đực số nhiều và quan hệ thế hệ, đồng thời tự nhiên trong tiếng Việt.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: nơi con cháu
  rationale: Cô đọng thành ngữ “con và con của con” thành cách nói tự nhiên, bao quát các hậu duệ qua nhiều đời.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: đến đời thứ ba và đời thứ tư
  rationale: “Đời” được hàm ý từ chuỗi gia đình và cần được bổ sung để tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Sự căng thẳng giữa việc Đức Chúa Trời tha thứ và việc Ngài không miễn tội
  choice: Giữ nguyên cả lời tuyên bố tha thứ lẫn lời nhấn mạnh rằng Ngài quyết không miễn tội.
  alternative: Diễn giải thành “nhưng chắc chắn trừng phạt kẻ có tội” hoặc làm nhẹ thành “nhưng vẫn công chính.”
  rationale: Câu Hebrew cố ý đặt lòng thương xót và công lý cạnh nhau. Bản dịch không hòa giải hoặc làm suy giảm bên nào.
- issue: Có nên thêm “thế hệ” sau “hàng ngàn” hay không
  choice: Không thêm “thế hệ” vào chính văn; dùng “hàng ngàn người” và ghi khả năng hiểu khác trong chú thích.
  alternative: “cho một ngàn thế hệ” hoặc “cho hàng ngàn thế hệ.”
  rationale: Từ “thế hệ” không xuất hiện tại đây, dù sự đối chiếu với đời thứ ba và thứ tư khiến cách hiểu theo thế hệ có khả năng.
- issue: Phạm vi trách nhiệm liên thế hệ trong פקד עון אבות
  choice: Dịch sát là Đức Chúa Trời “xét sự gian ác của cha ông nơi con cháu,” không giải thích thêm cơ chế hoặc mức độ trách nhiệm.
  alternative: Diễn giải là con cháu bị trừng phạt chỉ khi lặp lại tội của tổ tiên, hoặc khẳng định họ trực tiếp mang tội thay tổ tiên.
  rationale: Bản thân câu này không nói rõ cơ chế; cần bảo toàn sức căng và sự mơ hồ thật của nguyên văn thay vì nhập một hệ thống thần học từ bên ngoài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Trời; tránh từ cổ khó hiểu. Các cụm “tình yêu thành tín,” “phản nghịch,” và “miễn tội” giữ sức nặng thần học nhưng vẫn tự nhiên trong tiếng Việt tiêu chuẩn.
