  yaml_path: translation/ot/exodus/034/008.yaml
  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: vi
  text: Môi-se vội cúi mình sát đất và thờ phượng.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mau chóng” hoặc “lập tức”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sấp mình” hoặc “phủ phục”; động từ Hê-bơ-rơ có thể chỉ hành động cúi mình để thờ phượng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: vội
  rationale: Động từ מהר diễn tả hành động khẩn trương, mau chóng. “Vội” tự nhiên trong tiếng Việt và nhấn mạnh phản ứng tức thì của Môi-se.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dạng phiên âm tên riêng đã quen dùng trong Kinh Thánh tiếng Việt.
- source_word: וַיִּקֹּד
  choice: cúi mình
  rationale: Động từ קדד chỉ việc cúi hoặc khom người. “Cúi mình” diễn tả rõ tư thế thân thể và vẫn phân biệt với động từ thờ phượng theo sau.
- source_word: אַרְצָה
  choice: sát đất
  rationale: Dạng chỉ hướng của אֶרֶץ cho biết động tác hướng xuống đất. “Sát đất” là cách nói tự nhiên, gợi rõ mức độ cúi thấp.
- source_word: וַיִּשְׁתָּחוּ
  choice: thờ phượng
  rationale: Trong ngữ cảnh Môi-se đáp lại sự tự bày tỏ của Đức Giê-hô-va, động từ שחה chỉ hành vi phủ phục với lòng tôn kính, tức thờ phượng. Vì động tác cúi mình đã được nói ở vế trước, cách dịch này tránh lặp mà vẫn giữ ý nghĩa sùng kính.
theological_decisions:
- issue: Nên hiểu động từ cuối là một tư thế thân thể thuần túy hay hành vi thờ phượng
  choice: thờ phượng
  alternative: sấp mình; phủ phục
  rationale: Ngữ cảnh cho thấy Môi-se đang kính cẩn đáp lại sự tự mặc khải của Đức Giê-hô-va. Tuy động từ Hê-bơ-rơ cũng có thể chỉ việc phủ phục, động từ ngay trước đã mô tả tư thế cúi xuống; vì vậy “thờ phượng” giữ được ý nghĩa tôn giáo mà không đồng nhất hai động tác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể chuyện ngắn gọn, đồng thời phân biệt tư thế cúi sát đất với ý nghĩa thờ phượng của động từ cuối.
