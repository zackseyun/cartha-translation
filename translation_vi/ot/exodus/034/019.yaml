  - severity: low
    issue: Cụm “con đầu lòng mở dạ” không tự nhiên và dễ tạo cảm giác thừa.
    rationale: פֶּטֶר רֶחֶם theo chữ là “con mở dạ”, một thành ngữ chỉ con đầu lòng. Nên dùng “con đầu lòng” trong bản văn và đưa thành ngữ vào phần giải thích hoặc cụm đồng vị.
  revised_text: Mọi con đầu lòng—tức mọi con mở dạ—đều thuộc về Ta; mọi con đực đầu lòng trong đàn gia súc của con, dù là bò hay chiên.
