  source_fidelity: 'Bản nháp nắm đúng ý chính: Đức Chúa Trời tuyên bố quyền sở hữu đối với con đầu lòng và phạm vi gia súc được giới hạn ở con đực, bò và chiên. Tuy nhiên, việc lặp lại “đều thuộc về Ta” ở vế hai biến sự lệ thuộc cú pháp/hàm ý của tiếng Hê-bơ-rơ thành một mệnh đề được nêu trực tiếp lần nữa. Có thể giữ nghĩa sở hữu mà không thêm lời lặp này bằng cách để vế hai phối thuộc với vị ngữ ở vế đầu.'
  naturalness: “Mọi con đầu lòng mở dạ” vừa nặng vừa có vẻ trùng ý trong tiếng Việt hiện đại. “Mọi con đầu lòng—tức mọi con mở dạ—” tự nhiên hơn, đồng thời bảo tồn thành ngữ gốc. Cấu trúc vế hai được đặt sau dấu chấm phẩy giúp người đọc hiểu rằng nó vẫn nằm trong phạm vi “thuộc về Ta”.
  terminology: Giữ “thuộc về Ta” là cách chuyển đạt chuẩn xác, không thêm ý hiến dâng hay tế lễ. “Con đực đầu lòng trong đàn gia súc” chuyển đạt đúng chức năng của תִּזָּכָר trong ngữ cảnh. “Bò hay chiên” phù hợp với lựa chọn của bản tiếng Anh đối chiếu và cách dùng Kinh Thánh tiếng Việt.
