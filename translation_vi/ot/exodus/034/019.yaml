base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: vi
  text: Mọi con đầu lòng—tức mọi con mở dạ—đều thuộc về Ta; mọi con đực đầu lòng trong đàn gia súc của con, dù là bò hay chiên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: Mọi con đầu lòng mở dạ
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “mọi con mở dạ”, chỉ con đầu lòng. Cách dịch này giữ hình ảnh nguyên ngữ mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: לִי
  choice: đều thuộc về Ta
  rationale: Giới từ לְ với đại từ ngôi thứ nhất biểu thị quyền sở hữu hay quyền đòi hỏi của Đức Chúa Trời; “thuộc về Ta” tự nhiên và chính xác.
- source_word: מִקְנְךָ
  choice: đàn gia súc của con
  rationale: מִקְנֶה là thuật ngữ tập hợp chỉ các vật nuôi thuộc đàn; “đàn gia súc” phù hợp với bò và chiên được nêu tiếp theo.
- source_word: תִּזָּכָר
  choice: mọi con đực đầu lòng
  rationale: Dạng Niphal của זכר trong ngữ cảnh luật lệ này xác định con đực trong đàn vật nuôi. Cách dịch theo chức năng tránh nghĩa đen gây hiểu lầm liên quan đến “ghi nhớ”.
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: bò hay chiên
  rationale: Cụm này nêu các loại gia súc thuộc phạm vi quy định. “Bò hay chiên” truyền đạt tự nhiên hai loại được nguyên văn kể ra.
theological_decisions:
- issue: Quyền sở hữu của Đức Chúa Trời đối với con đầu lòng
  choice: Dịch trực tiếp là “thuộc về Ta”, không thêm thuật ngữ hiến dâng hay tế lễ.
  alternative: Diễn giải rằng mọi con đầu lòng phải được biệt riêng hoặc dâng làm sinh tế.
  rationale: Nguyên văn khẳng định quyền sở hữu bằng לִי nhưng tại câu này không nói rõ cách thực hiện quyền ấy; bản dịch giữ nguyên phạm vi và sức căng của mệnh đề pháp lý.
- issue: Phạm vi của תִּזָּכָר
  choice: Hiểu là quy định về con đực đầu lòng trong đàn gia súc.
  alternative: Dịch sát hình thái là “sẽ được ghi nhớ là con đực” hoặc chỉ “sẽ là con đực”.
  rationale: Trong cấu trúc rút gọn của câu và song song với פֶּטֶר, từ này xác định giới tính của con đầu lòng; cách dịch chức năng rõ nghĩa mà không thêm một học thuyết riêng.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Đại từ “Ta/con” phản ánh lời Đức Chúa Trời phán trực tiếp với Môi-se. Giữ hình ảnh “mở dạ” để bảo tồn sắc thái của thành ngữ Hê-bơ-rơ, đồng thời dùng “con đầu lòng” để người đọc hiểu ngay ý nghĩa.
