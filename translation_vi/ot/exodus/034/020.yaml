  text: וּ/פֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֨י/ךָ֙ תִּפְדֶּ֔ה וְ/לֹֽא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: vi
  text: Con đầu lòng của lừa, ngươi phải chuộc bằng một con chiên hoặc dê[a]; nếu không chuộc nó thì phải bẻ cổ nó. Mọi con trai đầu lòng của ngươi, ngươi phải chuộc. Không ai được đến trước mặt ta[b] tay không[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một con thuộc đàn chiên hoặc dê”; từ Hê-bơ-rơ שֶׂה có thể chỉ chiên hoặc dê.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “trước mặt ta”, một thành ngữ Hê-bơ-rơ chỉ việc đến trình diện trong sự hiện diện của Đức Chúa Trời.
    reason: lexical_alternative
  - marker: c
    text: Tức là không được đến mà không mang theo lễ vật.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: con lừa đầu lòng
  rationale: פֶטֶר chỉ con vật đầu tiên mở lòng mẹ; trong điều luật này, “con lừa đầu lòng” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: תִּפְדֶּה
  choice: phải chuộc
  rationale: פדה trong bối cảnh luật lệ và nghi lễ nói đến việc chuộc bằng vật thay thế hoặc giá chuộc; “phải chuộc” vừa giữ nghĩa vừa thể hiện tính bắt buộc của mệnh lệnh.
- source_word: בְשֶׂה
  choice: bằng một con chiên hoặc dê
  rationale: שֶׂה có thể chỉ một con thuộc đàn vật nuôi nhỏ, tức chiên hoặc dê. Cách dịch này tránh thu hẹp từ nguồn thành riêng “chiên con”.
- source_word: וַעֲרַפְתּוֹ
  choice: phải bẻ cổ nó
  rationale: ערף chỉ hành động bẻ gãy cổ trong quy định nghi lễ; cách dịch này cụ thể hơn “giết” và không đồng nhất với chặt đầu.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: mọi con trai đầu lòng của ngươi
  rationale: Cụm Hê-bơ-rơ nói rõ đến các con trai đầu lòng; giữ “con trai” thay vì mở rộng thành “con cái”.
- source_word: יֵרָאוּ פָנַי
  choice: đến trước mặt ta
  rationale: Cấu trúc với “mặt ta” là thành ngữ chỉ việc đến trình diện trong sự hiện diện của Đức Chúa Trời. “Đến trước mặt ta” tự nhiên trong tiếng Việt và vẫn giữ hình ảnh của nguyên văn.
- source_word: רֵיקָם
  choice: tay không
  rationale: Trong bối cảnh thờ phượng, từ này hàm ý đến mà không mang lễ vật; thành ngữ “tay không” truyền đạt ý đó tự nhiên mà không đưa từ “lễ vật” vào chính văn.
theological_decisions:
- issue: Cách dịch lời tự xưng của Đức Chúa Trời trong יֵרָאוּ פָנַי
  choice: trước mặt ta
  alternative: trước sự hiện diện của ta
  rationale: Nguyên văn nói “mặt ta” trong lời trực tiếp của Đức Chúa Trời. “Trước mặt ta” giữ được ngôi thứ nhất và hình ảnh Hê-bơ-rơ mà không thêm sắc thái thần học.
- issue: Giới tính trong בָּנֶיךָ
  choice: con trai của ngươi
  alternative: con cái của ngươi
  rationale: בָּנֶיךָ ở đây kết hợp với “đầu lòng” và chỉ các con trai; không trung hòa thành “con cái”.
- issue: Phạm vi nghĩa của שֶׂה
  choice: một con chiên hoặc dê
  alternative: một con chiên con
  rationale: Từ nguồn có thể chỉ chiên hoặc dê. Giữ cả hai khả năng tránh gắn riêng một loài với nghi thức chuộc khi câu Hê-bơ-rơ không làm vậy.
translation_notes:
  register: Văn phong luật lệ trang trọng nhưng hiện đại; dùng “ngươi” để giữ lời phán trực tiếp ở số ít. Cấu trúc câu ngắn, rõ, phù hợp độc giả phổ thông. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau phần chính văn liên quan.
