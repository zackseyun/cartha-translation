source:
  edition: WLC
  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: vi
  text: Vậy, Môi-se đẽo hai bảng đá giống như hai bảng đá trước đó[a]. Sáng sớm, ông dậy, lên núi Si-nai đúng như Yahweh đã truyền cho ông, và cầm hai bảng đá trong tay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tạc” hoặc “đục” hai bảng đá giống như hai bảng đá trước đó.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “trong tay ông”; dạng số ít có thể được dùng theo lối thành ngữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: đẽo
  rationale: Động từ פסל ở đây chỉ việc tạo hình các bảng bằng đá; “đẽo” cụ thể, tự nhiên và phù hợp với chất liệu đá.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: hai bảng đá
  rationale: Cách diễn đạt quen thuộc, rõ nghĩa cho hai bảng giao ước bằng đá.
- source_word: כָּרִאשֹׁנִים
  choice: giống như hai bảng trước
  rationale: Diễn đạt quan hệ so sánh với cặp bảng đã có trước đó, đồng thời làm rõ sở chỉ của dạng số nhiều trong tiếng Hê-bơ-rơ.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: dậy sớm vào buổi sáng
  rationale: Phản ánh thành ngữ Hê-bơ-rơ về việc thức dậy sớm và giữ sắc thái thời gian của câu chuyện.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: lên núi Si-nai
  rationale: Giữ rõ chuyển động đi lên, với cách nói tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời trong nguyên văn thay vì thay bằng một tước hiệu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: đúng như Yahweh đã truyền cho ông
  rationale: “Đúng như” thể hiện sự tương ứng chính xác với mệnh lệnh đã ban trước đó; “đã truyền” phù hợp trình tự kể chuyện.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: cầm ... trong tay
  rationale: Giữ hình ảnh cụ thể và số ít “tay” của nguyên văn, vốn có thể được dùng theo lối thành ngữ.
theological_decisions:
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH; phiên âm “Yahweh” bảo tồn đây là danh riêng mà không thay bằng tước hiệu.
- issue: Số ít trong בְּיָדוֹ khi nói đến hai bảng đá
  choice: trong tay
  alternative: trong hai tay
  rationale: Giữ số ít của nguyên văn và không suy diễn tư thế Môi-se mang hai bảng; tiếng Hê-bơ-rơ có thể dùng “tay” theo nghĩa thành ngữ.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Môi-se”, “Si-nai” theo lối phiên âm quen thuộc trong tiếng Việt; giữ danh “Yahweh”. Chia câu dài của tiếng Hê-bơ-rơ thành hai câu để dễ đọc mà vẫn giữ trình tự các hành động.
