revisions:
- from: Vậy, Môi-se đẽo hai bảng đá giống như hai bảng trước[a]. Ông dậy sớm vào buổi sáng, lên núi Si-nai đúng như Yahweh đã truyền cho ông, và cầm hai bảng đá trong tay[b].
  to: Vậy, Môi-se đẽo hai bảng đá giống như hai bảng đá trước đó[a]. Sáng sớm, ông dậy, lên núi Si-nai đúng như Yahweh đã truyền cho ông, và cầm hai bảng đá trong tay[b].
  rationale: Bản sửa chỉ làm câu văn gọn, tự nhiên hơn và thay một phương án chú thích không sát nghĩa bằng phương án phù hợp với hành động đẽo tạo bảng đá. Ý nghĩa, trình tự hành động, danh Yahweh, và sự mơ hồ có chủ ý của số ít “tay” đều được giữ nguyên.
