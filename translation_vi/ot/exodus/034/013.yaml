source:
  edition: WLC
  text: כִּ֤י אֶת מִזְבְּחֹתָ/ם֙ תִּתֹּצ֔וּ/ן וְ/אֶת מַצֵּבֹתָ֖/ם תְּשַׁבֵּר֑וּ/ן וְ/אֶת אֲשֵׁרָ֖י/ו תִּכְרֹתֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: vi
  text: Trái lại,[a] các ngươi phải phá đổ những bàn thờ của chúng, đập vỡ những trụ đá thờ và chặt hạ các cột A-sê-ra của chúng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì các ngươi phải phá đổ những bàn thờ của chúng…” Liên từ Hê-bơ-rơ thường có nghĩa là “vì,” nhưng trong văn cảnh này có thể diễn tả sự tương phản với điều bị cấm ở câu trước.'
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: “các A-sê-ra của chúng.” Từ này chỉ những vật thờ gắn với nữ thần A-sê-ra; hình dạng chính xác của chúng không hoàn toàn chắc chắn.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Trái lại
  rationale: Trong mạch văn, liên từ này nêu hành động tương phản mà Y-sơ-ra-ên phải làm thay vì lập giao ước với cư dân xứ; chú thích giữ lại nghĩa thường gặp là “Vì”.
- source_word: מִזְבְּחֹתָם
  choice: những bàn thờ của chúng
  rationale: Giữ nguyên số nhiều và hậu tố ngôi thứ ba số nhiều; “bàn thờ” là cách gọi tự nhiên trong ngữ cảnh thờ phượng.
- source_word: תִּתֹּצוּן
  choice: phá đổ
  rationale: Diễn đạt hành động triệt hạ một công trình, phù hợp với đối tượng là các bàn thờ.
- source_word: מַצֵּבֹתָם
  choice: những trụ đá thờ
  rationale: מַצֵּבָה chỉ những tảng đá hoặc trụ đá được dựng lên; thêm “thờ” để làm rõ chức năng tế tự trong ngữ cảnh mà không đồng nhất chúng với trụ kiến trúc thông thường.
- source_word: תְּשַׁבֵּרוּן
  choice: đập vỡ
  rationale: Thể Piel diễn tả hành động mạnh; “đập vỡ” tự nhiên và thích hợp với trụ đá.
- source_word: אֲשֵׁרָיו
  choice: các cột A-sê-ra của chúng
  rationale: Trong danh sách các vật phải phá hủy và đi với động từ “chặt hạ,” từ này nhiều khả năng chỉ các vật thờ bằng gỗ gắn với nữ thần A-sê-ra; cách dịch vẫn giữ tên riêng và chú thích nêu cách hiểu khác.
- source_word: תִּכְרֹתוּן
  choice: chặt hạ
  rationale: Phù hợp với nghĩa cắt/chặt và với vật thờ có khả năng làm bằng gỗ.
theological_decisions:
- issue: Đối tượng mà אֲשֵׁרָיו chỉ đến
  choice: các vật thờ gắn với A-sê-ra, dịch là “các cột A-sê-ra”
  alternative: các A-sê-ra; hoặc các tượng/vật thờ A-sê-ra
  rationale: Động từ “chặt hạ” và chuỗi các vật thể phải phá hủy nghiêng về một vật thờ hữu hình, có lẽ bằng gỗ. Tuy vậy, hình dạng chính xác của vật này không hoàn toàn chắc chắn, nên chú thích bảo lưu phương án dịch sát âm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “các ngươi” để phản ánh lời truyền cho cộng đồng Y-sơ-ra-ên số nhiều; dùng “chúng” cho các cư dân được nhắc đến ở văn cảnh trước. Các động từ “phá đổ, đập vỡ, chặt hạ” duy trì nhịp ba vế và sắc thái mạnh của nguyên văn.
