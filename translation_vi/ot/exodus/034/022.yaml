base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: vi
  text: Ngươi phải cử hành Lễ Các Tuần, là lễ đầu mùa của vụ gặt lúa mì, và Lễ Thu Hoạch vào lúc năm xoay vòng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào cuối năm.” Cụm từ Hê-bơ-rơ theo nghĩa đen chỉ sự xoay chuyển hoặc chu kỳ của năm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: Lễ
  rationale: Trong ngữ cảnh thờ phượng, từ này chỉ một lễ hội hành hương; “Lễ” tự nhiên, trang trọng và phù hợp với tên các kỳ lễ.
- source_word: שָׁבֻעֹת
  choice: Các Tuần
  rationale: Giữ nghĩa trực tiếp của tên lễ trong tiếng Hê-bơ-rơ là “các tuần”, thay vì dùng tên gọi truyền thống xuất hiện về sau.
- source_word: תַּעֲשֶׂה לְךָ
  choice: Ngươi phải cử hành
  rationale: Cụm từ có nghĩa đen là “làm cho mình”, nhưng khi đi với חַג thì mang nghĩa cử hành một kỳ lễ. “Phải cử hành” diễn đạt rõ nghĩa vụ giao ước; không dịch riêng לְךָ vì tiếng Việt sẽ gượng và dễ gây hiểu lầm.
- source_word: בִּכּוּרֵי
  choice: hoa lợi đầu mùa
  rationale: Chỉ sản vật đầu tiên của mùa thu hoạch được dâng lên; cách nói này rõ nghĩa đối với độc giả hiện đại và giữ sắc thái nông nghiệp-thờ phượng.
- source_word: קְצִיר חִטִּים
  choice: vụ gặt lúa mì
  rationale: Diễn đạt tự nhiên cụm cấu trúc chỉ việc thu hoạch lúa mì.
- source_word: הָאָסִיף
  choice: Thu Hoạch
  rationale: אָסִיף nhấn mạnh việc thu gom sản vật vào kho. “Lễ Thu Hoạch” là tên gọi tự nhiên trong tiếng Việt và phản ánh bối cảnh cuối vụ.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: vào lúc chuyển năm
  rationale: תקופה nói đến sự xoay chuyển hay chu kỳ của năm; “lúc chuyển năm” bảo tồn hình ảnh ấy mà không xác định cứng là ngày cuối cùng của năm.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để phù hợp lời phán trực tiếp số ít trong ngữ cảnh giao ước; cấu trúc được làm tự nhiên trong tiếng Việt nhưng vẫn giữ các tên lễ và hình ảnh chu kỳ của năm.
