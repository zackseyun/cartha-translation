revisions:
- from: Ngươi phải cử hành Lễ Các Tuần, dâng hoa lợi đầu mùa của vụ gặt lúa mì, và cử hành Lễ Thu Hoạch vào lúc chuyển năm.[a]
  to: Ngươi phải cử hành Lễ Các Tuần, là lễ đầu mùa của vụ gặt lúa mì, và Lễ Thu Hoạch vào lúc năm xoay vòng.[a]
  rationale: Bản sửa loại bỏ hành động “dâng” không có trong nguyên văn, đặt “lễ đầu mùa của vụ gặt lúa mì” làm phần giải thích cho Lễ Các Tuần, và điều chỉnh cách dịch cụm chỉ thời điểm để bảo tồn nghĩa “sự xoay chuyển/chu kỳ của năm.”
