- from: 'Ông thưa rằng: “Lạy Chúa, nếu giờ đây con được đẹp lòng Ngài, xin Chúa đi giữa chúng con[a], mặc dù đây là một dân cứng cổ. Xin tha thứ sự gian ác và tội lỗi của chúng con, và nhận chúng con làm cơ nghiệp của Ngài[b].”'
  to: 'Ông thưa rằng: “Lạy Chúa, nếu giờ đây con được ơn trước mặt Ngài, xin Chúa đi giữa chúng con[a], vì chúng con là một dân cứng cổ. Xin tha thứ sự gian ác và tội lỗi của chúng con, và nhận chúng con làm cơ nghiệp của Ngài[b].”'
