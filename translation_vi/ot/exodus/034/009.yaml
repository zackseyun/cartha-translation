  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: vi
  text: 'Ông thưa rằng: “Lạy Chúa, nếu giờ đây con được ơn trước mặt Ngài, xin Chúa đi giữa chúng con[a], vì chúng con là một dân cứng cổ. Xin tha thứ sự gian ác và tội lỗi của chúng con, và nhận chúng con làm cơ nghiệp của Ngài[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “đi ở giữa chúng con”; cũng có thể dịch: “đi giữa vòng chúng con” hoặc “đồng hành với chúng con.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhận chúng con làm sở hữu của Ngài.” Động từ Hê-bơ-rơ có thể mang nghĩa nhận hoặc định làm cơ nghiệp, tức phần thuộc riêng về mình.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן בְּעֵינֶיךָ
  choice: được đẹp lòng Ngài
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ ‘tìm được ân huệ trong mắt Ngài’, vẫn giữ ý được người đối diện chấp thuận và ưu ái.
- source_word: אֲדֹנָי
  choice: Chúa
  rationale: Đây là tước hiệu xưng hô אֲדֹנָי chứ không phải chính danh YHWH; ‘Chúa’ phù hợp trong lời cầu nguyện và ở cả hai lần xuất hiện.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: xin Chúa đi giữa chúng con
  rationale: Giữ hình ảnh không gian của בְּקִרְבֵּנוּ (‘ở/giữa chúng con’) và diễn đạt lời khẩn cầu bằng tiếng Việt tự nhiên.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: một dân cứng cổ
  rationale: Giữ nguyên ẩn dụ Hê-bơ-rơ về sự ngoan cố thay vì chỉ diễn giải là ‘bướng bỉnh’.
- source_word: עָוֹן
  choice: sự gian ác
  rationale: Truyền đạt sức nặng đạo đức của từ này và phân biệt tương đối với חַטָּאת theo sau.
- source_word: חַטָּאת
  choice: tội lỗi
  rationale: Cách dịch thông dụng, trực tiếp, phù hợp trong cặp từ với עָוֹן.
- source_word: וּנְחַלְתָּנוּ
  choice: nhận chúng con làm cơ nghiệp của Ngài
  rationale: Thể hiện ý Đức Chúa Trời nhận dân làm phần thuộc riêng về mình, đồng thời giữ hình ảnh ‘cơ nghiệp’ của động từ נחל.
theological_decisions:
- issue: Quan hệ logic của כִּי trong lời cầu xin
  choice: mặc dù đây là một dân cứng cổ
  alternative: vì đây là một dân cứng cổ
  rationale: Trong văn cảnh, sự cứng cổ là trở ngại khiến dân càng cần sự tha thứ và sự hiện diện của Chúa; cách hiểu nhượng bộ phù hợp với mạch lời cầu xin nhưng ghi nhận rằng כִּי thường cũng có thể mang nghĩa nguyên nhân.
- issue: Cách dịch אֲדֹנָי trong lời cầu nguyện hướng đến YHWH
  choice: Chúa
  alternative: Chúa của con
  rationale: Không chuyển thành dạng biểu thị chính danh YHWH và cũng không thêm đại từ sở hữu mà văn bản không buộc phải có.
- issue: Ý nghĩa của וּנְחַלְתָּנוּ
  choice: nhận chúng con làm cơ nghiệp của Ngài
  alternative: nhận chúng con làm sở hữu của Ngài
  rationale: 'Giữ sự căng thẳng trong hình ảnh giao ước: dân vừa là cơ nghiệp vừa là phần sở hữu của Chúa, không thu hẹp động từ vào một sắc thái pháp lý duy nhất.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘con/chúng con—Ngài’ cho lời cầu nguyện; giữ các hình ảnh nguồn ‘cứng cổ’ và ‘cơ nghiệp’. Dấu chú thích [a], [b] đều được đặt ngay trong chính văn.
