base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: vi
  text: Không ai được lên cùng ngươi, và cũng không ai được xuất hiện ở bất cứ nơi nào trên núi[a]; ngay cả bầy chiên dê và đàn bò cũng không được ăn cỏ trước mặt núi ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “không ai được bị nhìn thấy ở bất cứ nơi nào trên núi.” Dạng động từ Hê-bơ-rơ ở đây có thể có nghĩa là “xuất hiện” hoặc “bị nhìn thấy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: không ai / không một ai
  rationale: Trong hai lệnh cấm, danh từ giống đực số ít mang nghĩa khái quát, chỉ bất kỳ người nào; cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ phạm vi tuyệt đối.
- source_word: יַעֲלֶה עִמָּךְ
  choice: được lên núi cùng ngươi
  rationale: Động từ עלה diễn tả chuyển động đi lên; bổ sung “núi” theo ngữ cảnh trực tiếp để câu tiếng Việt rõ và tự nhiên.
- source_word: וְגַם
  choice: và cũng
  rationale: Giữ cả ý nối tiếp lẫn tăng thêm của tiểu từ, không nhập nó vào lực cấm của אַל.
- source_word: אַל יֵרָא
  choice: không ... được xuất hiện
  rationale: Niphal của ראה có thể mang nghĩa “bị nhìn thấy” hoặc “xuất hiện.” Chọn cách diễn đạt tự nhiên hơn trong mệnh lệnh tiếng Việt và ghi nhận nghĩa kia ở chú thích.
- source_word: בְּכָל הָהָר
  choice: ở bất cứ nơi nào trên khắp núi
  rationale: Diễn đạt rõ phạm vi toàn bộ ngọn núi và lực phân bố của cụm từ Hê-bơ-rơ.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: chiên, dê và bò
  rationale: הַצֹּאן chỉ đàn gia súc nhỏ, thường gồm chiên và dê, còn הַבָּקָר chỉ bò; cách dịch cụ thể, dễ hiểu đối với độc giả Việt hiện đại.
- source_word: אַל יִרְעוּ
  choice: không được ăn cỏ
  rationale: Với chủ thể là súc vật, רעה ở Qal nghĩa là gặm cỏ/chăn ăn; “ăn cỏ” là cách nói tự nhiên.
- source_word: אֶל מוּל
  choice: trước mặt
  rationale: Giữ ý vị trí đối diện hoặc ở phía trước ngọn núi, đồng thời dùng lối diễn đạt trang trọng, dễ hiểu.
- source_word: הָהָר הַהוּא
  choice: núi ấy
  rationale: Đại từ chỉ định xác định ngọn núi đã được nói đến và giữ sắc thái khoảng cách của הַהוּא.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “ngươi” vì lời phán hướng riêng đến Môi-se, đồng thời giữ sắc thái Kinh Thánh mà vẫn dễ hiểu. Các lệnh cấm được diễn đạt bằng “không ... được”; sự mơ hồ thật sự của אַל יֵרָא được bảo lưu trong chú thích.
