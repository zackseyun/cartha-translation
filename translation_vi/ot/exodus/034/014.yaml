  to: Vì ngươi không được phủ phục trước một thần nào khác[a], bởi Yahweh—Đấng có danh là Ghen[b]—là Đức Chúa Trời hay ghen[c].
  rationale: Thay “Ghen Tương” bằng “Ghen” trong danh xưng. Sửa đổi tối thiểu này tái lập sự lặp lại của קַנָּא trong nguyên văn (“Ghen” / “hay ghen”), đồng thời chú thích vẫn ngăn cách nghĩa này với sự đố kỵ tội lỗi. Các phần còn lại trung thành với văn bản nguồn và phù hợp với tiếng Việt hiện đại trang trọng.
  reviewer_model: gpt-5.6-terra
