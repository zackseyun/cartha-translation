reference: Exodus 34:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: vi
  text: Vì ngươi không được phủ phục trước một thần nào khác[a], bởi Yahweh—Đấng có danh là Ghen[b]—là Đức Chúa Trời hay ghen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thờ phượng một thần nào khác.” Động từ Hê-bơ-rơ chỉ việc cúi mình hoặc phủ phục, thường là một hành vi thờ phượng.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa tiếng Hê-bơ-rơ: “vì Yahweh—Ghen là danh Ngài—là Đức Chúa Trời hay ghen.”'
    reason: lexical_alternative
  - marker: c
    text: “Ghen” ở đây nói đến quyền đòi hỏi độc quyền của Yahweh đối với sự thờ phượng của dân giao ước, chứ không phải lòng đố kỵ tội lỗi.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: phủ phục
  rationale: Giữ hình ảnh cụ thể của động từ שׁחה là cúi mình hoặc sấp mình xuống, đồng thời ngữ cảnh cho thấy đây là hành vi thờ phượng.
- source_word: לְאֵל אַחֵר
  choice: trước một thần nào khác
  rationale: אֵל là “thần” và אַחֵר là “khác”; giới từ được diễn đạt tự nhiên trong tiếng Việt là “trước” khi đi với hành động phủ phục.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: קַנָּא
  choice: Ghen Tương / hay ghen
  rationale: Giữ cả cách dùng như một danh xưng trong “danh là Ghen Tương” lẫn cách dùng thuộc tính trong “Đức Chúa Trời hay ghen”, qua đó bảo tồn sự lặp lại có chủ ý của tiếng Hê-bơ-rơ.
- source_word: שְׁמוֹ
  choice: Đấng có danh là
  rationale: Diễn đạt tự nhiên cấu trúc “danh Ngài là” và liên kết rõ với Yahweh.
- source_word: אֵל קַנָּא הוּא
  choice: là Đức Chúa Trời hay ghen
  rationale: Giữ cấu trúc vị ngữ và lời giải thích nối tiếp danh xưng “Ghen Tương”; “hay ghen” là cách nói hiện đại, dễ hiểu.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tư cách danh riêng.
- issue: קַנָּא vừa là danh xưng vừa là thuộc tính
  choice: Ghen Tương / hay ghen
  alternative: Nhiệt Thành / đầy nhiệt tâm
  rationale: “Ghen” bảo tồn đòi hỏi độc quyền của Yahweh đối với sự thờ phượng và sự lặp lại giàu sức nhấn của nguyên văn, nhưng chú thích làm rõ đây không phải lòng đố kỵ tội lỗi.
- issue: אֵל trong cụm לְאֵל אַחֵר
  choice: thần
  alternative: thần linh; Đức Chúa Trời
  rationale: Chữ thường “thần” phù hợp với đối tượng thờ phượng khác đang bị cấm và tránh gán địa vị của Yahweh cho thần khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ sắc thái lời giao ước trực tiếp ở số ít; “phủ phục” bảo tồn hành động cụ thể của nguyên văn. Viết hoa “Ghen Tương” khi từ này làm danh xưng, nhưng viết thường trong phần mô tả thuộc tính.
