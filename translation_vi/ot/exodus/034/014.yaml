  source_fidelity: Bản dịch giữ đúng mệnh lệnh cấm phủ phục trước thần khác, giữ danh Yahweh, và phản ánh cấu trúc gọi danh rồi nêu thuộc tính của tiếng Hê-bơ-rơ. Tuy nhiên, “Ghen Tương” không tương ứng tốt với tính từ קַנָּא và làm yếu sự lặp lại cố ý với “hay ghen”; đây là một danh từ thường gợi sự đố kỵ giữa người với người.
