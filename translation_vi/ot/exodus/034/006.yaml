  rationale: Chỉ sửa cách dịch חֶסֶד từ «tình yêu thành tín» thành «tình yêu bền vững» và điều chỉnh chú thích tương ứng. Điều này phân biệt rõ חֶסֶד với אֱמֶת, giữ được ý nghĩa phong phú của cụm từ Hê-bơ-rơ, và làm câu tiếng Việt tự nhiên hơn.
