    rationale: חֶסֶד và אֱמֶת là hai từ riêng biệt, dù có liên hệ nghĩa. Dịch «tình yêu bền vững» cho חֶסֶד giữ sắc thái yêu thương kiên định, còn «sự thành tín» cho אֱמֶת giữ sắc thái đáng tin cậy/trung tín, tránh đồng nhất hai từ.
