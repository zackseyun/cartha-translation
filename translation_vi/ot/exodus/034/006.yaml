reference: Exodus 34:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh đi ngang qua trước mặt ông và công bố: “Yahweh, Yahweh, là Đức Chúa Trời đầy lòng thương xót và nhân từ, chậm giận, dồi dào tình yêu bền vững và sự thành tín[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dồi dào tình yêu bền vững và sự chân thật.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời bằng dạng chuyển tự quen dùng, thay vì thay bằng một tước hiệu; đồng thời bảo toàn việc danh này được lặp lại trong tiếng Hê-bơ-rơ.
- source_word: וַיַּעֲבֹר ... עַל־פָּנָיו
  choice: đi ngang qua trước mặt ông
  rationale: Diễn đạt tự nhiên chuyển động đi qua phía trước Môi-se, đồng thời giữ quan hệ không gian của cụm עַל־פָּנָיו.
- source_word: וַיִּקְרָא
  choice: công bố
  rationale: Trong bối cảnh Yahweh long trọng bày tỏ danh và phẩm tính của mình, “công bố” phù hợp hơn cách hiểu đơn thuần là “gọi”.
- source_word: אֵל
  choice: là Đức Chúa Trời
  rationale: Dùng như thành phần đồng vị mở đầu lời mô tả về Yahweh; thêm “là” để câu tiếng Việt rõ và tự nhiên mà không biến אֵל thành một phần của danh được lặp lại.
- source_word: רַחוּם
  choice: đầy lòng thương xót
  rationale: Chuyển tải lòng trắc ẩn sâu xa và sự thương xót; cách nói này tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: חַנּוּן
  choice: nhân từ
  rationale: Diễn đạt phẩm tính ban ân huệ và đối xử đầy ân nghĩa, đồng thời kết hợp tự nhiên với “đầy lòng thương xót”.
- source_word: אֶרֶךְ אַפַּיִם
  choice: chậm giận
  rationale: Đây là tương đương thành ngữ trực tiếp của hình ảnh Hê-bơ-rơ, nói về việc không mau nổi giận.
- source_word: רַב
  choice: dồi dào
  rationale: Với các danh từ trừu tượng theo sau, từ này nói đến sự phong phú, dư dật.
- source_word: חֶסֶד
  choice: tình yêu thành tín
  rationale: Giữ cả chiều kích yêu thương và sự bền vững, trung thành của חֶסֶד, thay vì thu hẹp nghĩa thành chỉ “lòng thương xót” hoặc “nhân từ”.
- source_word: אֱמֶת
  choice: sự thành tín
  rationale: Trong cặp חֶסֶד וֶאֱמֶת, từ này nhấn mạnh tính đáng tin cậy và trung tín của Đức Chúa Trời; nghĩa “chân thật” vẫn được ghi ở chú thích.
theological_decisions:
- issue: Danh יְהוָה được lặp lại
  choice: Yahweh, Yahweh
  alternative: Yahweh Đức Chúa Trời
  rationale: Nguyên văn lặp lại danh giao ước để nhấn mạnh. Không nhập אֵל đứng sau vào cụm danh, cũng không làm phẳng sự lặp lại.
- issue: Nghĩa của אֱמֶת trong cặp חֶסֶד וֶאֱמֶת
  choice: sự thành tín
  alternative: sự chân thật
  rationale: “Sự thành tín” phù hợp với ý về tính đáng tin cậy trong lời mô tả phẩm tính của Đức Chúa Trời, nhưng “sự chân thật” là một khả năng từ vựng thực sự nên được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ danh Yahweh và sự lặp lại của danh theo nguyên văn; các cụm mô tả được diễn đạt tự nhiên trong tiếng Việt nhưng không xóa đi khả năng đa nghĩa của אֱמֶת.
