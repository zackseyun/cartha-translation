  source_fidelity: 'Bản dịch giữ đúng trình tự và nội dung cốt lõi của tiếng Hê-bơ-rơ: Yahweh đi qua trước mặt Môi-se, công bố danh được lặp lại, rồi mô tả lòng thương xót, ân huệ, sự chậm giận và sự phong phú về חֶסֶד cùng אֱמֶת. Tuy nhiên, cách dịch hiện tại «tình yêu thành tín và sự thành tín» làm hai danh từ khác nhau trong nguyên ngữ trở nên gần như đồng nghĩa và gây lặp ý không cần thiết.'
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng. Cần phân biệt rõ hơn hai vế cuối để tiếng Việt không bị nặng và lặp từ.
