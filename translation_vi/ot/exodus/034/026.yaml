source:
  edition: WLC
  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: vi
  text: Hãy đem phần đầu tiên của hoa lợi đầu mùa từ đất ngươi đến nhà Yahweh, Đức Chúa Trời của ngươi.[a] Không được luộc dê con trong sữa mẹ nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phần tốt nhất của hoa lợi đầu mùa từ đất ngươi.”'
    reason: Nêu khả năng רֵאשִׁית trong cụm này hàm ý phần ưu tuyển, trong khi chính văn giữ nghĩa trực tiếp là “phần đầu tiên”.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: phần đầu tiên trong hoa lợi đầu mùa
  rationale: Giữ sát cấu trúc 'phần đầu tiên của/trong những sản vật đầu mùa', không tự diễn giải רֵאשִׁית thành 'phần tốt nhất'; cách nói này cũng bảo tồn sắc thái về thứ tự ưu tiên.
- source_word: אַדְמָתְךָ
  choice: đất ngươi
  rationale: Chỉ đất canh tác sinh hoa lợi; 'đất' tự nhiên và cụ thể trong ngữ cảnh nông nghiệp.
- source_word: תָּבִיא
  choice: Hãy đem ... vào
  rationale: Thể Hiphil chưa hoàn thành mang chức năng mệnh lệnh trong luật giao ước; 'hãy' truyền đạt trực tiếp, trang trọng mà không cổ kính quá mức.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: nhà của Yahweh, Đức Chúa Trời ngươi
  rationale: Giữ nghĩa đen 'nhà', tránh dùng 'đền thờ' vốn có thể quá chuyên biệt về lịch sử; Yahweh bảo tồn danh riêng trong bản nguồn.
- source_word: לֹא תְבַשֵּׁל
  choice: Không được nấu
  rationale: בשל có thể chỉ nấu, đặc biệt là luộc; tiếng Việt 'nấu ... trong sữa' tự nhiên hơn 'luộc ... trong sữa' mà vẫn giữ phương thức chế biến bằng chất lỏng.
- source_word: גְּדִי
  choice: dê con
  rationale: Cách gọi rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: trong sữa mẹ nó
  rationale: Giữ nguyên hình ảnh và quan hệ sở hữu của tiếng Hê-bơ-rơ, đồng thời diễn đạt gọn, tự nhiên.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước יהוה; phiên âm 'Yahweh' bảo tồn danh riêng thay vì thay bằng một tước hiệu.
- issue: Ý nghĩa của רֵאשִׁית trong cụm רֵאשִׁית בִּכּוּרֵי
  choice: phần đầu tiên trong hoa lợi đầu mùa
  alternative: phần tốt nhất của hoa lợi đầu mùa
  rationale: Giữ ý nghĩa trực tiếp về thứ tự trước nhất và không giải quyết ngầm khả năng từ này hàm ý phần ưu tuyển hay tốt nhất.
translation_notes:
  register: Văn phong luật giao ước trang trọng nhưng dễ hiểu. Dùng đại từ 'ngươi' để duy trì sắc thái lời phán trực tiếp ở số ít; các mệnh lệnh được diễn đạt tự nhiên bằng 'hãy' và 'không được'.
