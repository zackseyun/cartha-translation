base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: vi
  text: Hãy cẩn thận[a], kẻo ngươi lập giao ước[b] với cư dân trong xứ mà ngươi sắp đi vào[c], kẻo điều đó trở thành một cái bẫy[d] ở giữa ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy giữ mình” hoặc “Hãy coi chừng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hê-bơ-rơ: “cắt một giao ước,” là thành ngữ có nghĩa “lập một giao ước.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “mà ngươi đang tiến vào.”'
    reason: lexical_alternative
  - marker: d
    text: 'Hay: “một cạm bẫy.” Động từ Hê-bơ-rơ ở đây là giống đực số ít; có thể quy về “người cư trú” (dùng với nghĩa tập thể), hoặc được hiểu rộng hơn về sự việc vừa nói. Bản dịch dùng “điều đó” để không quyết định giữa các cách hiểu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hãy cẩn thận
  rationale: Mệnh lệnh Niphal kèm לְךָ là công thức cảnh báo có sắc thái phản thân. “Hãy cẩn thận” tự nhiên trong tiếng Việt và vẫn truyền đạt lời cảnh tỉnh hướng trực tiếp đến người nghe.
- source_word: פֶּן
  choice: đừng … kẻo
  rationale: Hai lần פֶּן tạo cấu trúc cảnh báo nối tiếp. Cặp “đừng … kẻo” diễn đạt tự nhiên quan hệ ngăn cấm và hậu quả đáng tránh trong tiếng Việt.
- source_word: תִּכְרֹת בְּרִית
  choice: lập giao ước
  rationale: Cụm Hê-bơ-rơ theo nghĩa đen là “cắt giao ước,” nhưng là thành ngữ chỉ việc thiết lập giao ước. “Lập giao ước” vừa chính xác vừa rõ nghĩa.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: với dân cư trong xứ
  rationale: Phân từ số ít mang nghĩa tập thể. “Dân cư” thể hiện đúng nhóm người đang cư trú trong xứ mà không buộc phải chuyển thành số ít.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: mà ngươi sắp đi vào
  rationale: Mệnh đề nói đến xứ mà Y-sơ-ra-ên đang tiến đến để vào. “Sắp đi vào” làm rõ ý cận kề trong bối cảnh mà không làm mất hình ảnh chuyển động.
- source_word: יִהְיֶה
  choice: trở thành
  rationale: Động từ số ít phù hợp tự nhiên nhất với “giao ước” vừa được nhắc đến. “Trở thành” thể hiện sự biến thành một mối nguy.
- source_word: לְמוֹקֵשׁ
  choice: một cái bẫy
  rationale: מוֹקֵשׁ chỉ bẫy hoặc cạm bẫy, thường được dùng ẩn dụ về sự vướng mắc dẫn đến bất trung. “Cái bẫy” rõ ràng và thông dụng trong tiếng Việt hiện đại.
- source_word: בְּקִרְבֶּךָ
  choice: giữa vòng ngươi
  rationale: Cụm từ chỉ điều hiện diện ở giữa cộng đồng. “Giữa vòng ngươi” giữ sắc thái cộng đồng và hợp với lối xưng hô số ít mang tính tập thể.
theological_decisions:
- issue: Chủ thể được hiểu của động từ số ít cuối câu
  choice: Giao ước với dân cư trong xứ là điều trở thành cái bẫy.
  alternative: Dân cư ấy trở thành cái bẫy, hoặc toàn bộ tình thế trở thành cái bẫy.
  rationale: “Giao ước” là tiền ngữ số ít gần nhất và là đối tượng phù hợp nhất về cú pháp lẫn mạch cảnh báo. Tuy vậy, nguyên văn không lặp lại danh từ, nên bản dịch bổ sung “giao ước ấy” để làm rõ cách hiểu được chọn.
translation_notes:
  register: Văn phong trang trọng, sáng rõ, dùng “ngươi” số ít để phản ánh lời phán trực tiếp với Y-sơ-ra-ên như một cộng đồng. Cấu trúc “đừng … kẻo” tự nhiên hơn việc lặp một liên từ cảnh báo theo sát hình thức Hê-bơ-rơ. Mọi dấu chú thích đều được đặt ngay sau từ hoặc cụm từ liên quan.
