base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: vi
  text: rồi ngươi lấy một số con gái của họ làm vợ cho các con trai ngươi[a], các con gái ấy sẽ thông dâm theo các thần của họ và khiến các con trai ngươi thông dâm theo các thần của họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa là sắp đặt hôn nhân: lấy một số con gái của họ làm vợ cho các con trai ngươi.'
    reason: cultural_note
  - marker: b
    text: “Thông dâm theo các thần” là ngôn ngữ ẩn dụ về sự bất trung trong việc theo hoặc thờ các thần ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: rồi ngươi lấy
  rationale: Động từ Qal hoàn thành ngôi 2 số ít, có liên từ, trong chuỗi cảnh báo diễn tả kết quả có thể xảy ra. “Lấy” giữ nghĩa trực tiếp; ngữ cảnh cho thấy đây là việc chọn vợ cho con trai.
- source_word: מִבְּנֹתָיו
  choice: một số con gái của người ấy
  rationale: Giới từ מִן mang nghĩa phân chia, tức lấy từ trong số các con gái của người ấy.
- source_word: לְבָנֶיךָ
  choice: cho các con trai ngươi
  rationale: Giới từ לְ chỉ đối tượng/ích lợi trong việc sắp đặt hôn nhân; cách nói này tự nhiên và sát nghĩa.
- source_word: וְזָנוּ ... אַחֲרֵי אֱלֹהֵיהֶן
  choice: sẽ chạy theo các thần của họ mà làm điếm
  rationale: Giữ hình ảnh tình dục mạnh của זנה, đồng thời diễn đạt rõ thành ngữ אַחֲרֵי là chạy theo các thần khác. “Làm điếm” ngắn gọn, dễ hiểu và bảo toàn ẩn dụ về sự bất trung trong việc thờ phượng.
- source_word: וְהִזְנוּ
  choice: và khiến ... cũng ... làm điếm
  rationale: 'Dạng Hiphil có ý nghĩa gây khiến: các con gái khiến những người con trai thực hiện cùng hành vi bất trung thờ phượng.'
- source_word: אֶת בָּנֶיךָ
  choice: các con trai ngươi
  rationale: Giữ đúng danh từ chỉ giới tính và hậu tố ngôi 2 số ít của nguyên văn.
- source_word: אֱלֹהֵיהֶן
  choice: các thần của họ
  rationale: Danh từ số nhiều với hậu tố ngôi 3 giống cái số nhiều, chỉ các thần của những người con gái ấy.
theological_decisions:
- issue: Cách dịch זנה trong ngữ cảnh thờ thần khác
  choice: Giữ ẩn dụ bằng “làm điếm”
  alternative: phạm tội thờ thần tượng; bất trung
  rationale: Nguyên văn cố ý dùng ngôn ngữ về sự bất trung tình dục để mô tả việc chạy theo các thần khác. Giữ ẩn dụ bảo toàn sức nặng thần học mà không thu hẹp nghĩa thành một lời giải thích.
- issue: Ngôn ngữ chỉ giới trong בנותיו / בניך
  choice: con gái / con trai
  alternative: con cái
  rationale: Nguyên văn nêu rõ con gái và con trai trong bối cảnh hôn nhân; bản dịch giữ sự phân biệt ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “ngươi” để phù hợp lời phán trực tiếp số ít trong văn mạch luật pháp. Cấu trúc “chạy theo ... mà làm điếm” vừa làm rõ thành ngữ Hê-bơ-rơ vừa giữ nguyên ẩn dụ mạnh của זנה; dấu chú thích được đặt ngay sau phần văn bản liên quan.
