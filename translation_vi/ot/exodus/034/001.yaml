  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה פְּסָל לְ/ךָ֛ שְׁנֵֽי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וְ/כָתַבְתִּי֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֥ר שִׁבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: vi
  text: 'Rồi Yahweh phán với Môi-se: “Hãy đẽo cho mình hai bảng đá giống như hai bảng đầu tiên.[a] Ta sẽ viết trên các bảng ấy những lời đã có trên hai bảng đầu tiên mà con đã làm vỡ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đục” hoặc “Hãy tạc” cho mình hai bảng đá giống như hai bảng đầu tiên.'
    reason: Nêu các cách dịch gần nghĩa của פְּסָל trong ngữ cảnh gia công đá.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Động từ אמר mở đầu lời trực tiếp; “phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi chủ thể là Đức Chúa Trời, còn “rồi” nối tiếp mạch kể chuyện.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng giao ước được biểu thị bằng danh bốn phụ âm, thay vì thay bằng một tước hiệu.
- source_word: פְּסָל
  choice: đẽo
  rationale: Mệnh lệnh này nói đến việc tạo hình các bảng đá; “đẽo” diễn đạt cụ thể việc gia công đá mà không hàm ý trang trí hay khắc chữ.
- source_word: לְךָ
  choice: cho mình
  rationale: Thể hiện rõ đại từ dữ cách trong tiếng Hê-bơ-rơ, nhấn mạnh Môi-se phải tự chuẩn bị các bảng.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: hai bảng đá
  rationale: Cách nói ngắn gọn, tự nhiên trong tiếng Việt, giữ cả vật liệu lẫn loại đồ vật.
- source_word: כָּרִאשֹׁנִים
  choice: giống như hai bảng đầu tiên
  rationale: Giữ ý so sánh với cặp bảng trước đó, đồng thời làm rõ số nhiều theo ngữ cảnh.
- source_word: וְכָתַבְתִּי
  choice: Ta sẽ viết
  rationale: Diễn đạt lời hứa ở ngôi thứ nhất; tách thành câu mới giúp tiếng Việt sáng rõ mà vẫn giữ quan hệ tiếp nối.
- source_word: עַל הַלֻּחֹת
  choice: trên các bảng ấy
  rationale: Giới từ chỉ bề mặt được dịch là “trên”; “ấy” quy chiếu tự nhiên về hai bảng vừa được nhắc đến.
- source_word: הַדְּבָרִים
  choice: những lời
  rationale: Giữ nghĩa trực tiếp của דְּבָרִים, không diễn giải hẹp thành “các điều răn” dù đó là nội dung trong ngữ cảnh.
- source_word: אֲשֶׁר הָיוּ עַל הַלֻּחֹת הָרִאשֹׁנִים
  choice: đã có trên hai bảng đầu tiên
  rationale: Giữ mệnh đề quan hệ xác định nội dung sẽ được viết lại.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: mà con đã đập vỡ
  rationale: שׁבר có nghĩa là làm vỡ hoặc đập vỡ; “đập vỡ” phù hợp với hành động của Môi-se trong ngữ cảnh và đại từ “con” tạo lời xưng hô tự nhiên từ Đức Chúa Trời với Môi-se.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng יְהוָה. Phiên âm “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng tước hiệu.
- issue: Chủ thể viết trên các bảng mới
  choice: Ta sẽ viết
  alternative: Diễn giải rằng Môi-se sẽ viết
  rationale: Động từ וְכָתַבְתִּי ở ngôi thứ nhất số ít xác định Yahweh là chủ thể của lời hứa trong câu này; bản dịch giữ nguyên cách phát biểu mà không điều hòa với các đoạn liên quan.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng. Dùng “phán” cho lời Đức Chúa Trời và cặp xưng hô “Ta—con” để lời trực tiếp tự nhiên trong tiếng Việt; tránh từ cổ khó hiểu. Dấu chú thích được đặt ngay sau cụm từ liên quan đến động từ פְּסָל, thay vì giữ vị trí chú thích không khớp trong lớp tham khảo tiếng Anh.
