  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: vi
  text: Khi Môi-se nói chuyện với họ xong[a], ông phủ khăn lên mặt mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngừng nói chuyện với họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל מִדַּבֵּר
  choice: nói chuyện ... xong
  rationale: Động từ כלה kết hợp với מִדַּבֵּר diễn tả việc hoàn tất hoặc chấm dứt hành động nói. Cách nói “nói chuyện ... xong” tự nhiên trong tiếng Việt và vẫn phù hợp với אִתָּם, “với họ”.
- source_word: אִתָּם
  choice: với họ
  rationale: Giới từ אֵת cùng hậu tố số nhiều mang nghĩa trực tiếp là “với họ”; “nói chuyện với họ” thể hiện đúng sắc thái tương tác mà không đổi thành “nói với họ”.
- source_word: וַיִּתֵּן
  choice: lấy ... che
  rationale: Trong kết cấu נתן על với chiếc khăn và khuôn mặt, ý nghĩa là đặt khăn lên để che. Tiếng Việt tự nhiên diễn đạt hành động này bằng “lấy khăn che” thay vì dịch máy móc là “đặt”.
- source_word: עַל פָּנָיו
  choice: mặt mình
  rationale: Cụm này theo nghĩa đen là “trên mặt ông”; với động từ “che”, tiếng Việt chỉ cần “che mặt mình”. Đại từ “mình” quy chiếu rõ về chủ thể Môi-se.
- source_word: מַסְוֶה
  choice: khăn
  rationale: Danh từ chỉ vật che mặt trong văn cảnh. “Khăn” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt; chức năng che mặt đã được động từ “che” làm rõ.
