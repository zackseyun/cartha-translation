  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “với họ” sát với אִתָּם; dùng cấu trúc thuần Việt “nói chuyện ... xong” và “lấy khăn che mặt mình” để tránh lối dịch cứng.
