revisions:
- from: Mỗi năm ba lần, tất cả nam giới của ngươi phải ra trình diện trước Chúa là Yahweh,[a] Đức Chúa Trời của Israel.[b]
  to: Mỗi năm ba lần, tất cả nam giới của ngươi phải ra trình diện trước[a] Chúa Yahweh,[b] Đức Chúa Trời của Israel.
  rationale: Sửa cách diễn đạt chuỗi tước hiệu-danh riêng thành “Chúa Yahweh” để tránh thêm liên từ không có trong nguyên văn, đồng thời hoán chuyển vị trí và nội dung các chú thích để mỗi neo chú thích gắn đúng với cụm từ nó giải thích. Không thay đổi nghĩa của câu.
