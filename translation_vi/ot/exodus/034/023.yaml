id: EXO.34.23
reference: Exodus 34:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: vi
  text: Mỗi năm ba lần, tất cả nam giới của ngươi phải ra trình diện trước[a] Chúa Yahweh,[b] Đức Chúa Trời của Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hê-bơ-rơ được dịch là “trước” theo sát mặt chữ là “trước mặt”, nghĩa là ở trong sự hiện diện của.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ đặt tước hiệu “Chúa” (ha’adon) ngay trước danh riêng Yahweh; cũng có thể dịch: “trước Chúa là Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Mỗi năm ba lần
  rationale: Diễn đạt tự nhiên trong tiếng Việt về tần suất hằng năm, đồng thời giữ nguyên con số ba của nguyên văn.
- source_word: יֵרָאֶה
  choice: phải ra trình diện
  rationale: Dạng Niphal của ראה trong ngữ cảnh lễ nghi chỉ việc đến hiện diện trước Đức Chúa Trời; “ra trình diện” tự nhiên và rõ nghĩa hơn cách dịch thụ động “được thấy”.
- source_word: כָּל זְכוּרְךָ
  choice: tất cả nam giới của ngươi
  rationale: Giữ chính xác giới tính được nêu trong tiếng Hê-bơ-rơ và đại từ sở hữu số ít, không trung tính hóa nghĩa vụ lễ hội.
- source_word: אֶת פְּנֵי
  choice: trước
  rationale: Đây là thành ngữ Hê-bơ-rơ có nghĩa là ở trước mặt hay trong sự hiện diện của ai; “trước” là cách diễn đạt gọn và tự nhiên.
- source_word: הָאָדֹן
  choice: Chúa
  rationale: Danh từ có mạo từ được dùng như một tước hiệu thần linh; “Chúa” phân biệt tước hiệu này với danh riêng Yahweh theo sau.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, giữ sự phân biệt giữa danh ấy với tước hiệu הָאָדֹן.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Đức Chúa Trời của Israel
  rationale: Phản ánh trực tiếp kết cấu sở thuộc, xác định Yahweh là Đức Chúa Trời của Israel.
theological_decisions:
- issue: Cách dịch chuỗi tước hiệu và danh riêng הָאָדֹן יְהוָה
  choice: Chúa là Yahweh
  alternative: Chúa Yahweh; Chúa, tức Yahweh; Chúa Hằng Hữu
  rationale: “Chúa là Yahweh” giữ cả tước hiệu lẫn danh riêng, đồng thời tránh chuỗi danh xưng dễ gây gượng trong tiếng Việt. Từ “là” làm sáng tỏ quan hệ đồng vị mà không thay Yahweh bằng một tước hiệu khác.
- issue: Ngôn ngữ chỉ giới trong nghĩa vụ dự lễ
  choice: tất cả nam giới của ngươi
  alternative: mọi người nam của ngươi; tất cả đàn ông trong dân ngươi; mọi người
  rationale: Nguyên văn nói rõ đến người nam, vì vậy bản dịch không mở rộng nghĩa vụ này thành ngôn ngữ trung tính.
- issue: Sắc thái của יֵרָאֶה
  choice: phải ra trình diện
  alternative: sẽ xuất hiện; phải đến trước mặt; sẽ được thấy
  rationale: Cụm này là công thức hành hương lễ nghi. “Phải ra trình diện” truyền đạt nghĩa vụ đến hiện diện mà không dùng lối thụ động khó hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ cách xưng hô số ít của זְכוּרְךָ và sắc thái luật giao ước; dùng “ra trình diện” cho bối cảnh hành hương lễ nghi. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
