    issue: Các neo chú thích hiện bị đảo vị trí so với nội dung chú thích.
    rationale: Chú thích [a] giải thích chuỗi “Chúa ... Yahweh” nhưng chú thích [b] lại giải thích אֶת־פְּנֵי (“trước”). Trong chính văn hiện tại, [a] đứng sau Yahweh và [b] đứng sau Israel, khiến chú thích [b] không được neo vào từ/cụm từ mà nó giải thích.
  - severity: low
    issue: “Chúa là Yahweh” diễn giải cấu trúc danh xưng bằng từ “là”.
    rationale: הָאָדֹן יְהוָה là chuỗi tước hiệu kèm danh riêng; “Chúa Yahweh” giữ cấu trúc này trực tiếp hơn mà vẫn tự nhiên.
  revised_text: Mỗi năm ba lần, tất cả nam giới của ngươi phải ra trình diện trước[a] Chúa Yahweh,[b] Đức Chúa Trời của Israel.
