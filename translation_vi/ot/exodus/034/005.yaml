id: EXO.34.5
reference: Exodus 34:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בֶּֽ/עָנָ֔ן וַ/יִּתְיַצֵּ֥ב עִמּ֖/וֹ שָׁ֑ם וַ/יִּקְרָ֥א בְ/שֵׁ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: vi
  text: Yahweh ngự xuống trong đám mây, đứng tại đó với ông, rồi công bố danh Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rồi kêu cầu danh Yahweh” hoặc “rồi công bố nhân danh Yahweh.” Trong tiếng Hê-bơ-rơ, trước từ “danh” có giới từ mang nghĩa “trong/bằng/nhân danh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ngự xuống
  rationale: Động từ ירד diễn tả chuyển động đi xuống. “Ngự xuống” tự nhiên và trang trọng trong ngữ cảnh Yahweh hiện đến, đồng thời vẫn giữ chuyển động cụ thể của nguyên văn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời trong bản Hê-bơ-rơ thay vì thay bằng một tước hiệu.
- source_word: בֶּעָנָן
  choice: trong đám mây
  rationale: Giới từ ב ở đây thích hợp nhất với nghĩa chỉ vị trí; mạo từ xác định cho thấy đây là đám mây đã được biết đến trong trình thuật.
- source_word: וַיִּתְיַצֵּב עִמּוֹ שָׁם
  choice: đứng tại đó với ông
  rationale: Giữ đủ các yếu tố “đứng”, “với ông” và “tại đó”; đại từ “ông” chỉ Môi-se theo văn cảnh.
- source_word: וַיִּקְרָא
  choice: công bố
  rationale: קרא có thể là “gọi” hoặc “xướng lên”; trong mạch văn dẫn vào lời tự tuyên bố ở câu kế tiếp, “công bố” truyền đạt rõ sắc thái tuyên xưng mà không thêm nội dung.
- source_word: בְשֵׁם יְהוָה
  choice: danh Yahweh
  rationale: Sau “công bố”, cách diễn đạt này tự nhiên trong tiếng Việt. Vì nguyên văn có giới từ ב và có thể được hiểu theo những cách khác, các khả năng ấy được giữ trong chú thích.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va hoặc CHÚA
  rationale: Nguyên văn trực tiếp dùng danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tính chất tên riêng mà không thay bằng tước hiệu.
- issue: Chủ ngữ và ý nghĩa của וַיִּקְרָא בְשֵׁם יְהוָה
  choice: Yahweh tiếp tục là chủ ngữ và “công bố danh Yahweh”
  alternative: Môi-se kêu cầu danh Yahweh; hoặc Yahweh công bố nhân danh Yahweh
  rationale: Chuỗi động từ kể chuyện tự nhiên nhất tiếp tục lấy Yahweh làm chủ ngữ, và câu 6 cung cấp nội dung lời công bố. Tuy nhiên, cấu trúc có giới từ ב vẫn có độ mở về quan hệ giữa động từ và “danh”, nên các cách hiểu khác được ghi chú.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngự xuống” để phù hợp với cảnh thần hiện nhưng không làm mất ý chuyển động; dùng “ông” cho Môi-se vì tên ông đã rõ trong văn cảnh. Dấu chú thích được đặt ngay sau cụm từ có nhiều khả năng diễn giải.
