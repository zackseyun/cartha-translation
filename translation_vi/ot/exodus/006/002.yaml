base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: vi
  text: 'Đức Chúa Trời phán với Môi-se, rồi nói với ông: “Ta là Yahweh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; “Yahweh” là cách đọc phục dựng thường dùng của danh thánh này.'
    reason: Giải thích dạng phụ âm Hebrew của danh thánh và nêu cách đọc được dùng trong chính văn mà không khẳng định chắc chắn cách phát âm cổ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: phán
  rationale: Động từ דבר trong lời kể dẫn vào lời Đức Chúa Trời. “Phán” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt khi chủ thể là Đức Chúa Trời.
- source_word: אֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ có hình thức số nhiều nhưng đi với động từ số ít và tại đây chỉ Đức Chúa Trời của Israel; “Đức Chúa Trời” là cách gọi chuẩn, rõ nghĩa trong tiếng Việt.
- source_word: אֶל־מֹשֶׁה
  choice: với Môi-se
  rationale: Giới từ אֶל đánh dấu người tiếp nhận lời nói. Kết hợp “phán với” tự nhiên trong tiếng Việt; tên riêng được phiên âm theo quy ước tiếng Việt.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: ':'
  rationale: Tiếng Hebrew dùng thêm động từ אמר và đại từ “với ông”. Trong tiếng Việt, dấu hai chấm trực tiếp dẫn lời sau “phán với Môi-se” chuyển tải chức năng này mà tránh câu “phán… và nói với ông” nặng nề, lặp ý.
- source_word: אֲנִי
  choice: Ta là
  rationale: Mệnh đề danh từ Hebrew không có hệ từ ở thì hiện tại; tiếng Việt cần “là” để diễn đạt sự tự xác định. “Ta” phù hợp với lời Đức Chúa Trời tự xưng trong văn phong trang trọng.
- source_word: יְהוָה
  choice: YHWH
  rationale: Giữ bốn phụ âm của danh riêng trong văn bản nguồn, không thay bằng một tước hiệu và không khẳng định chắc chắn một cách phát âm vốn không được ghi đầy đủ trong truyền thống chữ viết Hebrew.
theological_decisions:
- issue: Cách dịch danh thánh יְהוָה
  choice: YHWH trong chính văn
  alternative: Yahweh (Gia-vê)
  rationale: Văn bản dùng trực tiếp danh riêng gồm bốn phụ âm. Giữ “YHWH” bảo tồn danh riêng đồng thời không giải quyết quá mức sự bất định về cách phát âm; chú thích cung cấp cách đọc thường được phục dựng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời Đức Chúa Trời; rút gọn hai động từ dẫn lời của Hebrew thành một cấu trúc dẫn lời tự nhiên, nhưng vẫn giữ đầy đủ nội dung. Dấu chú thích [a] xuất hiện ngay sau danh thánh.
