base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/016.yaml
  text: 'These are the names of Levi’s sons according to their generations: Gershon, Kohath, and Merari. And the years of Levi’s life were one hundred thirty-seven years.'
translation:
  language: vi
  text: 'Đây là tên các con trai của Lê-vi, theo dòng dõi của họ: Ghẹt-sôn, Kê-hát và Mê-ra-ri. Lê-vi sống được một trăm ba mươi bảy năm.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתֹלְדֹתָם
  choice: theo dòng dõi của họ
  rationale: Danh từ תּוֹלְדוֹת chỉ các thế hệ hoặc dòng dõi; trong văn cảnh gia phả, “theo dòng dõi của họ” vừa tự nhiên vừa giữ được ý nghĩa phân loại theo các nhánh hậu duệ.
- source_word: וּשְׁנֵי חַיֵּי לֵוִי
  choice: Lê-vi sống được ... năm
  rationale: Cụm Hê-bơ-rơ theo sát chữ là “những năm của cuộc đời Lê-vi”; cách diễn đạt này chuyển tự nhiên sang tiếng Việt mà vẫn bảo toàn nội dung về tuổi thọ.
- source_word: גֵּרְשׁוֹן וּקְהָת וּמְרָרִי
  choice: Ghẹt-sôn, Kê-hát và Mê-ra-ri
  rationale: Phiên âm nhất quán theo âm dạng Hê-bơ-rơ, đồng thời dùng hình thức dễ đọc đối với độc giả Việt hiện đại.
