source:
  edition: WLC
  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: vi
  text: Ta sẽ đưa các ngươi vào miền đất mà Ta đã giơ tay[a] thề ban cho Áp-ra-ham, Y-sác và Gia-cốp. Ta sẽ ban miền đất ấy cho các ngươi làm cơ nghiệp. Ta là Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “mà Ta đã giơ tay để ban [đất ấy]”; “giơ tay” là cử chỉ dùng khi tuyên thệ.'
    reason: Giải thích thành ngữ tuyên thệ trong tiếng Hê-bơ-rơ và bảo tồn cách diễn đạt sát chữ.
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Ta sẽ đưa các ngươi vào
  rationale: Dạng Hiphil của בוא mang nghĩa khiến đi vào, nên “đưa ... vào” diễn đạt tự nhiên và giữ sắc thái nguyên nhân.
- source_word: הָאָרֶץ
  choice: miền đất
  rationale: Trong ngữ cảnh lời hứa giao ước, từ này chỉ miền đất cụ thể được hứa ban, không phải toàn thể trái đất.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: mà Ta đã giơ tay thề
  rationale: Giữ hình ảnh cụ thể “giơ tay” của thành ngữ tuyên thệ, đồng thời thêm “thề” để độc giả Việt hiện đại hiểu ngay chức năng của cử chỉ.
- source_word: לָתֵת אֹתָהּ
  choice: ban cho
  rationale: נתן có nghĩa trực tiếp là “cho”; “ban” phù hợp với lời Thiên Chúa hứa trao đất mà không làm thay đổi nội dung.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: cho Áp-ra-ham, Y-sác và Gia-cốp
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; giới từ chỉ người nhận được diễn đạt tự nhiên một lần cho cả chuỗi tên.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: Ta sẽ ban miền đất ấy cho các ngươi
  rationale: Lặp lại danh từ thay cho đại từ giúp câu tiếng Việt rõ nghĩa, còn thì tương lai giữ tính chất lời hứa.
- source_word: מוֹרָשָׁה
  choice: làm cơ nghiệp
  rationale: “Cơ nghiệp” diễn đạt tài sản được trao để sở hữu lâu dài, kể cả sắc thái quyền thừa hưởng của מוֹרָשָׁה.
- source_word: אֲנִי יְהוָה
  choice: Ta là Đức Giê-hô-va
  rationale: Giữ danh riêng giao ước יְהוָה theo dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, thay vì thay bằng một tước hiệu.
theological_decisions:
- issue: Cách dịch thành ngữ tuyên thệ נָשָׂאתִי אֶת יָדִי
  choice: mà Ta đã giơ tay thề
  alternative: mà Ta đã thề; mà Ta đã giơ tay để ban
  rationale: Bản dịch vừa giữ hình ảnh nguyên ngữ vừa làm rõ đây là hành động tuyên thệ, tránh khiến người đọc hiểu “giơ tay” chỉ như một động tác thông thường.
- issue: Cách dịch danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng danh riêng của Đức Chúa Trời. Dịch bằng dạng phiên âm quen thuộc giữ chức năng tự xưng của danh này mà không thay nó bằng tước hiệu.
- issue: Sắc thái của מוֹרָשָׁה
  choice: làm cơ nghiệp
  alternative: làm sản nghiệp; làm phần sở hữu
  rationale: “Cơ nghiệp” bảo tồn cả ý sở hữu được ban và chiều kích bền vững qua các thế hệ, nhưng không xác định thêm một cơ chế kế thừa ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta/các ngươi” giữ sắc thái lời phán trực tiếp, uy nghiêm; tên riêng dùng các dạng quen thuộc trong Kinh Thánh tiếng Việt. Dấu [a] được đặt ngay sau đối tượng đầu tiên của lời hứa, nơi thành ngữ có thể được hiểu rõ qua chú thích.
