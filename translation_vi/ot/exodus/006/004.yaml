  verdict: revise
  source_fidelity: Câu chính truyền đạt đúng lực bổ sung của וְגַם, thành ngữ “lập giao ước,” mục đích ban đất, và ý các tổ phụ cư trú tạm với tư cách người không thuộc bản địa. Tuy nhiên, chú thích hiện dùng “những lần họ tạm trú,” dễ chuyển trọng tâm từ tình trạng/kinh nghiệm kiều ngụ sang các lần hoặc dịp tạm trú riêng lẻ; cách này không phản ánh tốt danh từ מְגֻרֵיהֶם trong cụm lặp của tiếng Hê-bơ-rơ.
  naturalness: Câu chính tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại. “Ngoại kiều” có sắc thái hành chính hiện đại nhưng vẫn hiểu được trong ngữ cảnh; không cần đổi câu chính vì nó làm rõ địa vị không phải dân bản xứ. Chú thích nên dùng cách diễn đạt tự nhiên và chính xác hơn.
  terminology: “Ta,” “lập giao ước,” “ban,” và “xứ Ca-na-an” phù hợp văn phong Kinh Thánh tiếng Việt. Cụm “tạm trú như những ngoại kiều” giữ được cả ý tạm thời và thân phận người lạ của גור/מָגוּר mà không áp đặt diễn giải thần học.
  issues:
