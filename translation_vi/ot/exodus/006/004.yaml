  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/גַ֨ם הֲקִמֹ֤תִי אֶת בְּרִיתִ/י֙ אִתָּ֔/ם לָ/תֵ֥ת לָ/הֶ֖ם אֶת אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵי/הֶ֖ם אֲשֶׁר גָּ֥רוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: vi
  text: Ta cũng đã lập giao ước của Ta với họ để ban cho họ xứ Ca-na-an, là xứ họ từng tạm trú như những ngoại kiều.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát hơn: “xứ của sự tạm trú của họ, nơi họ đã tạm trú.”'
    reason: Bảo lưu cấu trúc gồm danh từ và động từ cùng gốc trong tiếng Hê-bơ-rơ; câu chính diễn đạt tự nhiên hơn ý họ cư trú tạm với thân phận người không thuộc bản địa.
lexical_decisions:
- source_word: וְגַם
  choice: Ta cũng
  rationale: Diễn đạt tự nhiên lực bổ sung của וְגַם và nối lời này với phần tự bày tỏ ngay trước đó.
- source_word: הֲקִמֹתִי אֶת־בְּרִיתִי
  choice: đã lập giao ước của Ta
  rationale: Động từ קום đi với בְּרִית là thành ngữ giao ước; “lập giao ước” vừa trang trọng, tự nhiên trong tiếng Việt, vừa không áp đặt một phân biệt thần học nằm ngoài câu.
- source_word: אִתָּם
  choice: với họ
  rationale: Giữ rõ quan hệ của giao ước và đại từ số nhiều, chỉ các tổ phụ trong văn cảnh.
- source_word: לָתֵת לָהֶם
  choice: để ban cho họ
  rationale: Thể hiện động từ nguyên mẫu chỉ mục đích; “ban” phù hợp khi chủ thể là Đức Chúa Trời và vẫn giữ nghĩa căn bản là trao cho.
- source_word: אֶרֶץ כְּנָעַן
  choice: xứ Ca-na-an
  rationale: Giữ cả danh từ אֶרֶץ và địa danh trong cách diễn đạt quen thuộc, trang trọng của tiếng Việt.
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: là xứ họ từng tạm trú như những ngoại kiều
  rationale: Truyền đạt cả ý cư trú tạm thời lẫn địa vị người từ nơi khác đến của מָגוּר và גור, đồng thời tránh lối lặp gượng trong câu chính; chú thích bảo lưu cấu trúc lặp của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: Thành ngữ giao ước קום + ברית
  choice: đã lập giao ước của Ta
  alternative: đã xác lập giao ước của Ta
  rationale: “Lập giao ước” bảo toàn tính long trọng và cam kết ràng buộc của lời Đức Chúa Trời với các tổ phụ mà không đưa thêm hệ thống thần học vào bản văn.
- issue: Địa vị của các tổ phụ tại Ca-na-an
  choice: tạm trú như những ngoại kiều
  alternative: kiều ngụ
  rationale: Bản dịch nêu rõ họ sống tại xứ ấy nhưng chưa sở hữu nó như quê hương; cách nói này giữ được sự căng thẳng giữa lời hứa ban đất và thân phận cư trú hiện thời.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta” theo lời phán trực tiếp của Đức Chúa Trời; “xứ” phù hợp văn cảnh lãnh thổ cổ đại. “Ngoại kiều” diễn tả địa vị cư trú của người không thuộc bản địa, không hàm ý cách hiểu giáo phái.
