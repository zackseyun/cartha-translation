base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: vi
  text: 'Chính A-rôn và Môi-se là hai người mà Đức Giê-hô-va đã phán: “Hãy đưa con dân Y-sơ-ra-ên ra khỏi xứ Ai Cập theo các đoàn ngũ của họ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo các đạo quân của họ” hoặc “theo các đơn vị của họ.” Từ Hê-bơ-rơ có thể chỉ những nhóm được tổ chức, kể cả các đội hình mang tính quân sự.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: Chính A-rôn và Môi-se là những người
  rationale: Đại từ độc lập số ít הוּא có chức năng chỉ định và nhấn mạnh, nhận diện hai người vừa được kể tên. Cấu trúc tiếng Việt dùng “Chính ... là những người” truyền đạt tự nhiên sắc thái nhấn mạnh ấy mà không vướng sự lệch số giữa đại từ và chủ ngữ kép.
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: mà Đức Giê-hô-va đã phán
  rationale: Mệnh đề quan hệ xác định A-rôn và Môi-se là những người được Đức Giê-hô-va truyền lệnh. “Phán” là cách diễn đạt trang trọng, tự nhiên khi Đức Chúa Trời nói; đại từ gián tiếp “với họ” được lược bỏ vì quan hệ này đã rõ trong cấu trúc tiếng Việt.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt cho Tứ Danh, thay vì thay thế bằng một tước hiệu; tiền tố “Đức” phù hợp với văn phong tiếng Việt trang trọng.
- source_word: הוֹצִיאוּ
  choice: Hãy đưa ... ra
  rationale: Thể Hifil mệnh lệnh số nhiều của יצא mang nghĩa khiến cho đi ra; “hãy đưa ... ra” giữ được cả sắc thái mệnh lệnh lẫn ý nghĩa tác khiến.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Trong ngữ cảnh chỉ toàn thể dân tộc, thành ngữ tiếng Việt “con dân Y-sơ-ra-ên” vừa giữ ý niệm thuộc dòng dõi/cộng đồng Israel vừa bao gồm tự nhiên cả cộng đồng, không khiến người đọc hiểu câu chỉ nói đến nam giới.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ra khỏi xứ Ai Cập
  rationale: “Ra khỏi” thể hiện rõ chuyển động rời nơi xuất phát, còn “xứ Ai Cập” chuyển tải đầy đủ אֶרֶץ מִצְרַיִם bằng lối nói tự nhiên, trang trọng.
- source_word: עַל צִבְאֹתָם
  choice: theo từng đạo quân của họ
  rationale: צְבָאוֹת có thể chỉ quân đội hoặc những đoàn ngũ có tổ chức. “Theo từng đạo quân” bảo lưu hình ảnh gần như quân sự và ý nghĩa phân nhóm có trật tự, thay vì làm nhẹ thành “từng nhóm”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; ĐỨC CHÚA
  rationale: Nguyên văn dùng trực tiếp Tứ Danh. Bản dịch giữ đây là danh riêng thay vì thay bằng tước hiệu; “Giê-hô-va” là dạng tên quen thuộc trong truyền thống tiếng Việt.
- issue: Phạm vi của בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Cụm từ chỉ cộng đồng giao ước nói chung trong lệnh đưa dân ra khỏi Ai Cập. “Con dân” bảo tồn quan hệ nguồn gốc và tư cách cộng đồng mà không thu hẹp không có căn cứ vào nam giới.
- issue: Sắc thái của עַל צִבְאֹתָם
  choice: theo từng đạo quân của họ
  alternative: theo từng đoàn ngũ của họ; theo các đơn vị của họ
  rationale: Giữ nguyên độ căng giữa nghĩa quân sự và nghĩa các nhóm được tổ chức. Bản văn không buộc phải hiểu họ đang chiến đấu, nhưng hình ảnh “đạo quân” không nên bị xóa bỏ.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Dùng cách viết tên riêng Kinh Thánh quen thuộc trong tiếng Việt: A-rôn, Môi-se, Y-sơ-ra-ên, Ai Cập. Trật tự câu làm nổi bật chức năng nhận diện và nhấn mạnh của הוּא; lời truyền được đặt trong ngoặc kép. Dấu chú thích [a] đặt ngay sau phần diễn đạt có liên quan.'
