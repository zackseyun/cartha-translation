base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: vi
  text: 'Nhưng Môi-se thưa trước mặt Đức Giê-hô-va: “Này, con có môi miệng không cắt bì; vậy làm sao Pha-ra-ôn sẽ nghe con?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Đức Giê-hô-va
  rationale: Giữ sắc thái trực diện của לִפְנֵי và dùng cách gọi quen thuộc, trang trọng trong tiếng Việt cho danh riêng YHWH.
- source_word: הֵן
  choice: Kìa
  rationale: Thể hiện từ nhấn mạnh thu hút sự chú ý trong lời Môi-se, tự nhiên hơn lối cổ “này” khi đứng độc lập.
- source_word: עֲרַל שְׂפָתַיִם
  choice: môi con chưa được cắt bì
  rationale: Giữ nguyên ẩn dụ Hebrew khác thường thay vì diễn giải thành “ăn nói vụng về”, nhờ đó bảo tồn hình ảnh và độ mở nghĩa của nguyên văn.
- source_word: יִשְׁמַע אֵלַי
  choice: chịu nghe con
  rationale: Trong ngữ cảnh, שׁמע אל mang ý nghe theo hoặc lưu tâm; “chịu nghe” diễn đạt tự nhiên câu hỏi hoài nghi mà không thu hẹp hẳn thành “vâng lời”.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: CHÚA hoặc Đức Chúa Trời
  rationale: Nguyên văn dùng danh riêng יהוה; bản dịch thể hiện đây là danh xưng riêng thay vì đồng nhất với danh hiệu chung, đồng thời theo lối gọi đã quen thuộc với nhiều độc giả Kinh Thánh tiếng Việt.
- issue: Ẩn dụ “môi chưa được cắt bì”
  choice: Bảo tồn nguyên dạng ẩn dụ
  alternative: con ăn nói vụng về / con không có tài ăn nói
  rationale: Ẩn dụ có thể chỉ sự bất xứng, trở ngại hoặc bất lực trong lời nói; diễn giải cụ thể sẽ giải quyết một độ căng mà nguyên văn vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ lối tự xưng “con” của Môi-se trước Đức Giê-hô-va. Cấu trúc câu hỏi được làm tự nhiên trong tiếng Việt nhưng vẫn bảo tồn ẩn dụ trung tâm của tiếng Hebrew.
