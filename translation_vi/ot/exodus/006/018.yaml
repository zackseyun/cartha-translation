base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: vi
  text: Các con trai của Kê-hát là Am-ram, Dít-ha, Hếp-rôn và U-xi-ên. Kê-hát sống được 133 năm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: בְנֵי là dạng số nhiều liên kết của từ “con trai”. Trong gia phả này, từ ấy chỉ những người con trai trực tiếp được nêu tên; liên từ mở đầu được lược đi để câu tiếng Việt tự nhiên hơn.
- source_word: קְהָת
  choice: Kê-hát
  rationale: Tên riêng được phiên âm theo lối quen thuộc, dễ đọc trong tiếng Việt.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: Am-ram, Dít-ha, Hếp-rôn và U-xi-ên
  rationale: Bốn tên riêng được phiên âm và các liên từ Hê-bơ-rơ được thể hiện tự nhiên bằng dấu phẩy cùng từ “và” trước tên cuối.
- source_word: וּשְׁנֵי חַיֵּי
  choice: sống được
  rationale: Thành ngữ theo sát mặt chữ là “những năm của cuộc đời”; “sống được” diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt mà vẫn giữ nguyên thông tin về tuổi thọ.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 133 năm
  rationale: Trật tự số từ Hê-bơ-rơ được chuyển sang cách ghi số thông dụng trong tiếng Việt; danh từ số ít theo ngữ pháp Hê-bơ-rơ được dịch tự nhiên là “năm”.
theological_decisions: []
