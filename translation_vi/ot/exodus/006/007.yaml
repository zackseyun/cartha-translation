base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: vi
  text: Ta sẽ nhận các ngươi làm dân của Ta, và Ta sẽ là Đức Chúa Trời của các ngươi. Các ngươi sẽ biết rằng Ta là Yahweh, Đức Chúa Trời của các ngươi, Đấng đưa các ngươi ra khỏi những gánh nặng của Ai Cập.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng đã đưa các ngươi ra khỏi những gánh nặng của Ai Cập.” Từ Hê-bơ-rơ được dịch là “đưa ... ra” là một phân từ, có thể nhấn mạnh hành động đang diễn ra, hành động đặc trưng, hoặc việc giải cứu được nhìn như điều xác định Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: Ta sẽ nhận các ngươi làm dân của Ta
  rationale: “Nhận ... làm” diễn đạt tự nhiên hành động Yahweh chọn lấy Israel cho chính mình trong quan hệ giao ước; “dân của Ta” giữ rõ ý thuộc về Ngài trong cấu trúc לִי לְעָם.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: Ta sẽ làm Đức Chúa Trời của các ngươi
  rationale: Giữ công thức giao ước mang tính quan hệ, đồng thời dùng lối diễn đạt trang trọng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: וִידַעְתֶּם
  choice: Các ngươi sẽ biết
  rationale: Thì tương lai phù hợp chuỗi lời hứa và vẫn cho phép nghĩa nhận biết qua kinh nghiệm.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu.
- source_word: הַמּוֹצִיא
  choice: Đấng đưa các ngươi ra
  rationale: Phân từ có thể mô tả Yahweh theo hành động đặc trưng là giải cứu dân; cách dịch không buộc hành động vào riêng thì quá khứ hay hiện tại.
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: khỏi ách lao dịch của Ai Cập
  rationale: Trong ngữ cảnh Xuất Hành, סִבְלֹת chỉ những gánh nặng và công việc cưỡng bức; “ách lao dịch” truyền đạt cả sự phục dịch bị áp đặt lẫn hình ảnh bị đè nặng.
theological_decisions:
- issue: Công thức giao ước
  choice: “nhận các ngươi làm dân của Ta” và “làm Đức Chúa Trời của các ngươi”
  alternative: “lấy các ngươi làm dân riêng của Ta” và “là Đức Chúa Trời cho các ngươi”
  rationale: Bản dịch giữ quan hệ sở thuộc và cam kết giao ước mà không đưa vào một hệ thống thần học về sau.
- issue: Danh Đức Chúa Trời
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng danh riêng יהוה; chuyển tự bảo tồn sự phân biệt giữa danh riêng và tước hiệu.
- issue: Giá trị thời gian của הַמּוֹצִיא
  choice: Dùng “Đấng đưa ... ra,” không đánh dấu rõ quá khứ hay hiện tại
  alternative: “Đấng đã đưa ... ra” hoặc “Đấng đang đưa ... ra”
  rationale: Phân từ Hê-bơ-rơ có thể trình bày hành động đang diễn tiến, mang tính đặc trưng, hoặc hành động giải cứu được nhìn như căn tính của Yahweh. Lối dịch này giữ sự mở đó.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Ta/các ngươi” để giữ lời phán trực tiếp của Đức Chúa Trời với toàn dân Israel; dùng “Yahweh” cho יהוה. Dấu chú thích [a] được đặt sau mệnh đề liên quan.
