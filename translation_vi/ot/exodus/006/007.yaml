  - severity: medium
    issue: “Ách lao dịch” thay thế hình ảnh số nhiều ‘những gánh nặng’.
    rationale: סִבְלֹת là ‘gánh nặng, lao khổ’; ‘lao dịch’ có thể là nghĩa ngữ cảnh nhưng hẹp hơn, còn ‘ách’ không hiện diện trực tiếp trong cụm này. Cách dịch trực tiếp bảo toàn hình ảnh và độ mở của nguyên văn.
