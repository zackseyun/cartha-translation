revisions:
- from: Ta sẽ nhận các ngươi làm dân của Ta, và Ta sẽ làm Đức Chúa Trời của các ngươi. Các ngươi sẽ biết rằng Ta là Yahweh, Đức Chúa Trời của các ngươi, Đấng đưa các ngươi ra khỏi ách lao dịch của Ai Cập.[a]
  to: Ta sẽ nhận các ngươi làm dân của Ta, và Ta sẽ là Đức Chúa Trời của các ngươi. Các ngươi sẽ biết rằng Ta là Yahweh, Đức Chúa Trời của các ngươi, Đấng đưa các ngươi ra khỏi những gánh nặng của Ai Cập.[a]
  rationale: Bản sửa phục hồi động từ liên kết trong công thức giao ước (“Ta sẽ là”) và dịch sát hơn סִבְלֹת là “những gánh nặng.” Cách dịch phân từ và chú thích vẫn giữ khả năng hành động giải cứu được hiểu là đặc trưng, đang diễn tiến, hoặc được nhìn từ kết quả tương lai, không quyết định vượt quá nguyên văn.
