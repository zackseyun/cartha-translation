  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: vi
  text: Các con trai của Cô-ra là Át-si, Ên-ca-na và A-bi-a-sáp. Đó là các thị tộc[a] thuộc dòng Cô-ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các gia tộc”. Từ Hê-bơ-rơ ở đây chỉ những nhóm thân tộc trong cơ cấu bộ tộc, thường rộng hơn một gia đình riêng lẻ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Các con trai của
  rationale: בְּנֵי là dạng số nhiều liên kết của “con trai”. Trong danh sách gia phả này, ba người được nêu trực tiếp nên dịch là “các con trai của” thay vì nghĩa rộng hơn là “hậu duệ”. Liên từ וּ được thể hiện tự nhiên qua mạch nối của danh sách gia phả, không nhất thiết phải dịch riêng là “và” ở đầu câu.
- source_word: קֹרַח
  choice: Cô-ra
  rationale: Tên riêng được phiên âm theo âm dạng Hê-bơ-rơ, bằng lối viết dễ đọc đối với độc giả Việt ngữ.
- source_word: אַסִּיר
  choice: Át-si
  rationale: Trong ngữ cảnh gia phả, đây là tên riêng, dù cùng hình thức này có thể liên hệ với danh từ mang nghĩa “người bị trói/tù nhân” ở ngữ cảnh khác.
- source_word: וְאֶלְקָנָה
  choice: Ên-ca-na
  rationale: Tên riêng được phiên âm; liên từ đi kèm được thể hiện bằng cách nối các tên trong danh sách tiếng Việt.
- source_word: וַאֲבִיאָסָף
  choice: A-bi-a-sáp
  rationale: Tên riêng được phiên âm gần với dạng Hê-bơ-rơ và chia âm tiết để người Việt dễ đọc.
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ định mở đầu một mệnh đề xác định. “Đó là” tự nhiên trong tiếng Việt khi quy chiếu về những người vừa được kể tên.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong bối cảnh bộ tộc và gia phả, מִשְׁפָּחָה chỉ những nhóm thân tộc lớn hơn gia đình hạt nhân; “thị tộc” diễn đạt cấu trúc ấy chính xác hơn “gia đình”.
- source_word: הַקָּרְחִי
  choice: của dòng Cô-ra
  rationale: Dạng chỉ thành viên/nhóm thuộc về Cô-ra. “Dòng Cô-ra” là cách diễn đạt tự nhiên trong tiếng Việt, chỉ những người thuộc dòng dõi Cô-ra mà không biến tên riêng thành một danh xưng khó đọc.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng nhưng tự nhiên. Các tên riêng được phiên âm nhất quán, có dấu và phân âm tiết để độc giả Việt ngữ dễ đọc. Dấu chú thích [a] được đặt ngay sau thuật ngữ “thị tộc” mà chú thích giải nghĩa.
