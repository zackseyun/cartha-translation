  text: אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבֹתָ֑/ם בְּנֵ֨י רְאוּבֵ֜ן בְּכֹ֣ר יִשְׂרָאֵ֗ל חֲנ֤וֹךְ וּ/פַלּוּא֙ חֶצְר֣וֹן וְ/כַרְמִ֔י אֵ֖לֶּה מִשְׁפְּחֹ֥ת רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: vi
  text: 'Đây là những người đứng đầu các nhà tổ phụ của họ: các con trai của Ru-bên, con đầu lòng của Y-sơ-ra-ên, là Hê-nóc, Pha-lu, Hết-rôn và Cạt-mi. Đó là các thị tộc của Ru-bên[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các gia tộc của Ru-bên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Đây là
  rationale: Đại từ chỉ định số nhiều mở đầu một danh sách; tiếng Việt dùng “Đây là” tự nhiên trong tiêu đề gia phả.
- source_word: רָאשֵׁי
  choice: những người đứng đầu
  rationale: Chỉ những người lãnh đạo hoặc đại diện chính của các đơn vị thân tộc; cách dịch này rõ nghĩa và vẫn giữ được ý niệm đứng đầu.
- source_word: בֵית אֲבֹתָם
  choice: các nhà tổ phụ của họ
  rationale: Giữ thuật ngữ thân tộc chỉ những đại gia đình được xác định theo tổ phụ, đồng thời phân biệt với מִשְׁפְּחֹת ở cuối câu.
- source_word: בְּנֵי רְאוּבֵן
  choice: các con trai của Ru-bên
  rationale: Danh sách ngay sau đó nêu các con trai trực tiếp của Ru-bên; cách dịch này sát nghĩa hơn “hậu duệ”.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: con trưởng nam của Y-sơ-ra-ên
  rationale: Cụm đồng vị xác định Ru-bên; “con trưởng nam” diễn đạt rõ địa vị con đầu lòng là nam trong văn cảnh gia phả.
- source_word: חֲנוֹךְ
  choice: Hê-nóc
  rationale: Dạng phiên âm tiếng Việt quen dùng cho tên riêng Hê-bơ-rơ này.
- source_word: וּפַלּוּא
  choice: Pha-lu
  rationale: Dạng phiên âm tiếng Việt rõ đọc và quen thuộc.
- source_word: חֶצְרוֹן
  choice: Hết-rôn
  rationale: Dạng phiên âm tiếng Việt rõ đọc và quen thuộc.
- source_word: וְכַרְמִי
  choice: Cạt-mi
  rationale: Dạng phiên âm tiếng Việt rõ đọc và quen thuộc.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong văn cảnh bộ tộc và gia phả, từ này chỉ các nhóm thân tộc nhỏ hơn chi tộc; “thị tộc” chính xác hơn từ rộng “gia đình” và giúp phân biệt với “nhà tổ phụ”.
- source_word: רְאוּבֵן
  choice: Ru-bên
  rationale: Dạng phiên âm tiếng Việt quen dùng cho tên người và tên chi tộc.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả trang trọng nhưng hiện đại; giữ cấu trúc giới thiệu danh sách của nguyên văn, đồng thời dùng các tên riêng theo dạng phiên âm tiếng Việt quen thuộc. Thuật ngữ “nhà tổ phụ” và “thị tộc” được phân biệt để phản ánh hai từ thân tộc khác nhau trong tiếng Hê-bơ-rơ.
