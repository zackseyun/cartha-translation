- from: 'Đây là những người đứng đầu các nhà tổ phụ của họ: các con trai của Ru-bên[a], con trưởng nam của Y-sơ-ra-ên, là Hê-nóc, Pha-lu, Hết-rôn và Cạt-mi. Đó là các thị tộc của Ru-bên.'
  to: 'Đây là những người đứng đầu các nhà tổ phụ của họ: các con trai của Ru-bên, con đầu lòng của Y-sơ-ra-ên, là Hê-nóc, Pha-lu, Hết-rôn và Cạt-mi. Đó là các thị tộc của Ru-bên[a].'
  rationale: Di chuyển mốc chú thích đến cụm mà chú thích thực sự giải thích, tức “các thị tộc của Ru-bên” (מִשְׁפְּחֹת רְאוּבֵן), và thay “con trưởng nam” bằng “con đầu lòng” để phù hợp tiếng Việt hiện đại mà không thay đổi nghĩa.
