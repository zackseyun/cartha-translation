  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: vi
  text: Rồi Đức Giê-hô-va phán với Môi-se và A-rôn, truyền lệnh cho họ về dân Y-sơ-ra-ên và về Pha-ra-ôn, vua Ai Cập[a], để đưa dân Y-sơ-ra-ên ra khỏi xứ Ai Cập.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc có thể hiểu “về dân Y-sơ-ra-ên và về Pha-ra-ôn, vua Ai Cập” là “cho dân Y-sơ-ra-ên và cho Pha-ra-ôn, vua Ai Cập.” Giới từ Hê-bơ-rơ có thể chỉ người nhận mệnh lệnh; nhưng trong ngữ cảnh, cách hiểu chính là mệnh lệnh giao cho Môi-se và A-rôn liên quan đến dân Y-sơ-ra-ên và Pha-ra-ôn.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng wayyiqtol tiếp nối diễn tiến câu chuyện; “Rồi” diễn đạt tự nhiên tính kế tiếp, còn “phán” phù hợp với lời nói có thẩm quyền của Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi quen thuộc, trang trọng trong tiếng Việt để thể hiện danh riêng YHWH, không thay bằng tước hiệu “Chúa”.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: với Môi-se và A-rôn
  rationale: Sau động từ דבר, אֶל đánh dấu người được nói với; cấu trúc “phán với” là tự nhiên trong tiếng Việt.
- source_word: וַיְצַוֵּם
  choice: truyền lệnh cho họ
  rationale: Giữ sắc thái thẩm quyền của צוה và làm rõ hậu tố số nhiều chỉ Môi-se cùng A-rôn.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה
  choice: về dân Y-sơ-ra-ên và về Pha-ra-ôn
  rationale: Trong ngữ cảnh, hai cụm אֶל có thể chỉ những đối tượng mà mệnh lệnh dành liên quan đến; “về” giữ cú pháp mạch lạc mà không loại bỏ cách hiểu “cho/đến” được ghi trong chú thích.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  rationale: Đây là tên gọi tập thể mang tính dân tộc; “dân Y-sơ-ra-ên” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại hơn cách dịch máy móc “các con trai của Y-sơ-ra-ên”.
- source_word: לְהוֹצִיא
  choice: để đưa ... ra
  rationale: Động từ nguyên mẫu Hiphil của יצא có nghĩa khiến đi ra; “đưa ... ra” vừa giữ nghĩa gây khiến vừa tự nhiên.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ra khỏi xứ Ai Cập
  rationale: Giữ danh từ אֶרֶץ và hướng ly cách của מִן; “xứ Ai Cập” là cách diễn đạt trang trọng, dễ hiểu.
theological_decisions:
- issue: Cách thể hiện danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Bản dịch giữ danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc và trang trọng.
- issue: Quan hệ cú pháp của אֶל sau וַיְצַוֵּם
  choice: mệnh lệnh cho Môi-se và A-rôn liên quan đến dân Y-sơ-ra-ên và Pha-ra-ôn
  alternative: Môi-se và A-rôn được truyền lệnh phải nói trực tiếp cho dân Y-sơ-ra-ên và Pha-ra-ôn
  rationale: Hậu tố “họ” chỉ rõ Môi-se và A-rôn là người nhận lệnh. Tuy vậy, אֶל có thể được hiểu là đánh dấu người nhận nội dung lệnh, nên cách hiểu ấy được bảo lưu trong chú thích.
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: dân Y-sơ-ra-ên
  alternative: con cháu Y-sơ-ra-ên; các con trai Y-sơ-ra-ên
  rationale: Trong ngữ cảnh này, cụm từ là danh xưng tập thể chỉ toàn dân, không chỉ nam giới; cách dịch tự nhiên không làm thay đổi phạm vi quy chiếu.
translation_notes:
  register: 'Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: Đức Giê-hô-va, Môi-se, A-rôn, Y-sơ-ra-ên, Pha-ra-ôn; tránh cấu trúc quá sát chữ gây khó hiểu.'
