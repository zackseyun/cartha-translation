  source_fidelity: Bản dịch chính truyền đạt đúng trình tự tự sự, người nói, người được phán bảo, đối tượng của mệnh lệnh và mục đích đưa dân Y-sơ-ra-ên ra khỏi Ai Cập. Cách hiểu chính của các cụm אֶל sau “truyền lệnh cho họ” là “về/liên quan đến” phù hợp ngữ cảnh và tránh chuyển sai người trực tiếp nhận mệnh lệnh.
  naturalness: Câu văn trang trọng, hiện đại và tự nhiên. Tuy nhiên, chú thích hiện có cụm “những người mà mệnh lệnh dành liên quan đến” không tự nhiên và diễn đạt chưa rõ quan hệ cú pháp đang được nêu.
  terminology: “Đức Giê-hô-va,” “Môi-se,” “A-rôn,” “Y-sơ-ra-ên,” “Pha-ra-ôn,” “dân Y-sơ-ra-ên,” và “xứ Ai Cập” nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. “Dân Y-sơ-ra-ên” là cách chuyển ngữ tự nhiên và chính xác cho danh xưng tập thể בְּנֵי יִשְׂרָאֵל trong câu này.
