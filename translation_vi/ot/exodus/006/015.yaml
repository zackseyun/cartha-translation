base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: vi
  text: Các con trai của Si-mê-ôn là Giê-mu-ên, Gia-min, Ô-hát, Gia-kin, Xô-ha và Sau-lơ, con trai của người phụ nữ Ca-na-an. Đây là các thị tộc của Si-mê-ôn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Các con trai của Si-mê-ôn
  rationale: בְּנֵי là dạng số nhiều liên kết của “con trai”; trong gia phả, dịch là “các con trai của” vừa chính xác vừa tự nhiên. Liên từ וּ nối tiếp danh sách trước, nhưng tiếng Việt không cần mở câu bằng “Và” để giữ quan hệ diễn ngôn.
- source_word: יְמוּאֵל
  choice: Giê-mu-ên
  rationale: Phiên âm tên riêng Hê-bơ-rơ sang dạng quen thuộc, dễ đọc trong tiếng Việt.
- source_word: יָמִין
  choice: Gia-min
  rationale: Phiên âm tên riêng theo âm Hê-bơ-rơ, phù hợp quy ước tên Kinh Thánh tiếng Việt.
- source_word: אֹהַד
  choice: Ô-hát
  rationale: Phiên âm gần với dạng Hê-bơ-rơ và điều chỉnh phụ âm cuối cho cách đọc tiếng Việt.
- source_word: יָכִין
  choice: Gia-kin
  rationale: Phiên âm tên riêng theo dạng quen dùng trong tiếng Việt.
- source_word: צֹחַר
  choice: Xô-ha
  rationale: Phiên âm tên riêng Hê-bơ-rơ thành dạng tự nhiên, dễ đọc trong tiếng Việt.
- source_word: שָׁאוּל
  choice: Sau-lơ
  rationale: Dùng dạng tên đã quen thuộc trong Kinh Thánh tiếng Việt; đây là cách phiên âm của chính tên Hê-bơ-rơ שָׁאוּל, nên không cần chú thích một biến thể tiếng Anh.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: con trai của người phụ nữ Ca-na-an
  rationale: Dạng giống cái הַכְּנַעֲנִית chỉ rõ một phụ nữ Ca-na-an; diễn đạt minh nhiên để bảo toàn thông tin giới tính của nguyên văn.
- source_word: מִשְׁפְּחֹת
  choice: các thị tộc
  rationale: Trong ngữ cảnh bộ tộc và gia phả, מִשְׁפָּחָה chỉ nhóm thân tộc thuộc một chi tộc; “thị tộc” chính xác hơn “gia đình” theo nghĩa hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và rõ ràng. Danh sách dùng dấu phẩy cùng “và” trước tên cuối để tự nhiên trong tiếng Việt; tên riêng được phiên âm theo lối Kinh Thánh tiếng Việt, còn thuật ngữ xã hội-gia phả được dịch là “thị tộc”.
