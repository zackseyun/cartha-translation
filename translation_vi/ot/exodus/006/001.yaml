source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: vi
  text: 'Bấy giờ Yahweh phán với Môi-se: “Bây giờ ông sẽ thấy những gì Ta sẽ làm với Pha-ra-ôn. Vì do một bàn tay mạnh mẽ[a], Pha-ra-ôn sẽ cho họ ra đi; và do một bàn tay mạnh mẽ, sẽ đuổi họ ra khỏi xứ mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vì bị cưỡng bức, Pha-ra-ôn sẽ cho họ ra đi, và vì bị cưỡng bức, sẽ đuổi họ ra đi.” Cụm từ lặp lại “do một bàn tay mạnh mẽ” có thể hàm ý Pha-ra-ôn hành động dưới một sức mạnh áp đảo, rốt cuộc là quyền năng của Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ ... phán
  rationale: Dạng tự sự có waw liên tiếp thúc đẩy trình tự câu chuyện; “Bấy giờ” diễn đạt tự nhiên sự nối tiếp, còn “phán” phù hợp với lời Thiên Chúa trong văn phong trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời dưới dạng phiên âm, thay vì thay bằng một tước hiệu.
- source_word: עַתָּה תִרְאֶה
  choice: Bây giờ, ngươi sẽ thấy
  rationale: Giữ sắc thái thời gian được nhấn mạnh của עַתָּה và nghĩa tương lai trực tiếp của תִרְאֶה.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: điều Ta sẽ làm đối với Pha-ra-ôn
  rationale: “Điều ... sẽ làm” diễn đạt tự nhiên mệnh đề quan hệ; “đối với” giữ phạm vi nghĩa của לְ mà không giải thích quá mức thành “chống lại”.
- source_word: בְיָד חֲזָקָה
  choice: bởi bàn tay mạnh mẽ
  rationale: Giữ nguyên hình ảnh “bàn tay” và sự lặp lại của nguyên văn, đồng thời không xác định rõ bàn tay thuộc về ai hay cơ chế cưỡng bức cụ thể.
- source_word: יְשַׁלְּחֵם
  choice: ông ta sẽ để họ ra đi
  rationale: Trong bối cảnh Xuất Ai Cập, động từ chỉ việc Pha-ra-ôn cho phép dân Israel rời đi.
- source_word: יְגָרְשֵׁם
  choice: ông ta sẽ đuổi họ
  rationale: “Đuổi” mạnh hơn “cho đi”, thể hiện bước tiến từ phóng thích đến trục xuất khẩn cấp.
- source_word: מֵאַרְצוֹ
  choice: khỏi xứ mình
  rationale: “Xứ” phù hợp với אֶרֶץ trong bối cảnh lãnh thổ của Pha-ra-ôn; “mình” quy chiếu tự nhiên về chủ ngữ Pha-ra-ôn.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Dùng danh riêng để bảo toàn sự quy chiếu giao ước trong nguyên văn, không thay bằng tước hiệu hay áp đặt một truyền thống hệ phái.
- issue: Chủ thể và ý nghĩa của cụm “bàn tay mạnh mẽ”
  choice: Giữ thành ngữ “bởi bàn tay mạnh mẽ” trong chính văn
  alternative: Vì bị cưỡng bức, ông ta sẽ để họ ra đi; do bàn tay quyền năng của Đức Chúa Trời, ông ta sẽ để họ ra đi
  rationale: Cụm Hê-bơ-rơ có thể hàm ý Pha-ra-ôn hành động dưới sức ép áp đảo, cuối cùng là quyền năng của Đức Chúa Trời, nhưng chính văn không nêu rõ chủ thể của “bàn tay”. Giữ thành ngữ giúp bảo toàn sự mơ hồ và căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” trong lời trực tiếp của Yahweh để giữ sắc thái trang nghiêm mà không thêm quan hệ thân tộc vốn không được biểu thị trong tiếng Hê-bơ-rơ. Giữ phép lặp “bởi bàn tay mạnh mẽ” nhằm tái hiện cấu trúc nhấn mạnh của nguyên văn.
