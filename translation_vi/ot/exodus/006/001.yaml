- from: 'Bấy giờ, Yahweh phán với Môi-se: “Bây giờ, ngươi sẽ thấy điều Ta sẽ làm đối với Pha-ra-ôn. Vì bởi bàn tay mạnh mẽ[a], ông ta sẽ để họ ra đi; và bởi bàn tay mạnh mẽ, ông ta sẽ đuổi họ khỏi xứ mình.”'
  to: 'Bấy giờ Yahweh phán với Môi-se: “Bây giờ ông sẽ thấy những gì Ta sẽ làm với Pha-ra-ôn. Vì do một bàn tay mạnh mẽ[a], Pha-ra-ôn sẽ cho họ ra đi; và do một bàn tay mạnh mẽ, sẽ đuổi họ ra khỏi xứ mình.”'
  rationale: Bản sửa thay các cách diễn đạt mang tính dịch sát hoặc cổ bằng tiếng Việt hiện đại, đồng thời giữ danh Yahweh, quan hệ cú pháp, phép lặp, và tính mơ hồ có chủ ý của cụm בְּיָד חֲזָקָה. Chú thích vẫn nêu cách hiểu “bị cưỡng bức” như một khả năng, không biến nó thành cách giải thích bắt buộc trong chính văn.
