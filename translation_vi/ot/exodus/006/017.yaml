  text: 'The sons of Gershon: Libni and Shimei[a], by their clans.'
translation:
  language: vi
  text: Các con trai của Ghẹt-sôn là Líp-ni và Si-mê-i, theo từng gia tộc của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Các con trai của
  rationale: Dạng số nhiều liên kết của בֵּן mở đầu danh sách gia phả; cách dịch này giữ đúng nghĩa quan hệ cha–con trực tiếp.
- source_word: גֵרְשׁוֹן
  choice: Ghẹt-sôn
  rationale: Tên riêng được phiên âm sang tiếng Việt theo cách đọc gần với tên Hê-bơ-rơ.
- source_word: לִבְנִי
  choice: Líp-ni
  rationale: Tên riêng được phiên âm, không dịch nghĩa.
- source_word: וְשִׁמְעִי
  choice: và Si-mê-i
  rationale: Giữ liên từ וְ và phiên âm tên riêng sang tiếng Việt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng gia tộc của họ
  rationale: Trong văn cảnh gia phả và tổ chức bộ tộc, מִשְׁפָּחָה thường chỉ nhóm thân tộc rộng hơn gia đình hạt nhân; “gia tộc” diễn đạt tự nhiên và chính xác hơn “gia đình” trong tiếng Việt.
