base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/019.yaml
  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: vi
  text: Các con trai của Mê-ra-ri là Mác-li và Mu-si. Đó là các gia tộc thuộc dòng Lê-vi, theo các thế hệ của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: Các con trai của Mê-ra-ri
  rationale: Trong văn cảnh gia phả, בְּנֵי chỉ các con trai; liên từ ו nối tiếp danh sách nhưng không nhất thiết phải dịch thành “và” ở đầu câu tiếng Việt.
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: Mác-li và Mu-si
  rationale: Tên riêng được phiên âm theo âm tiết, phù hợp lối viết tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: מִשְׁפְּחֹת
  choice: các gia tộc
  rationale: Trong cơ cấu bộ tộc và gia phả, từ này chỉ những nhóm thân tộc rộng hơn gia đình hạt nhân; “gia tộc” chính xác và tự nhiên.
- source_word: הַ/לֵּוִי
  choice: thuộc dòng Lê-vi
  rationale: Danh từ số ít có mạo từ có thể mang nghĩa tập hợp, chỉ dòng dõi Lê-vi. Cách dịch này giữ ý nghĩa dòng tộc mà không gây ấn tượng rằng câu nói về một cá nhân Lê-vi.
- source_word: לְ/תֹלְדֹתָם
  choice: theo các thế hệ của họ
  rationale: Giữ sắc thái công thức gia phả của תּוֹלְדוֹת và mối liên hệ với các thế hệ hay dòng nối dõi.
theological_decisions:
- issue: Cách hiểu dạng số ít הַלֵּוִי
  choice: thuộc dòng Lê-vi
  alternative: của người Lê-vi; của các người Lê-vi
  rationale: Dạng số ít có mạo từ nhiều khả năng được dùng theo nghĩa tập hợp cho dòng Lê-vi. “Thuộc dòng Lê-vi” bảo tồn ý này mà không áp đặt một cách hiểu giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc liệt kê gia phả, dùng “gia tộc” thay vì “gia đình” để phản ánh đúng cấp độ thân tộc.
