revisions:
- from: A-rôn lấy Ê-li-sê-ba, con gái A-mi-na-đáp và là em gái của Na-ha-sôn, làm vợ. Ê-li-sê-ba sinh cho ông Na-đáp, A-bi-hu, Ê-lê-a-xa và I-tha-ma.
  to: A-rôn lấy Ê-li-sê-ba, con gái A-mi-na-đáp và là chị/em gái của Na-ha-sôn, làm vợ; bà sinh cho A-rôn Na-đáp, A-bi-hu, Ê-lê-a-xa và I-tha-ma.
  rationale: Sửa “em gái” thành “chị/em gái” để không thêm thông tin về tuổi tương đối mà tiếng Hê-bơ-rơ không nêu. Thay “ông” bằng “A-rôn” để diễn đạt trung tính và minh bạch hơn. Các yếu tố còn lại được giữ nguyên vì trung thành với văn bản nguồn và tự nhiên trong tiếng Việt hiện đại.
