  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן אֶת אֱלִישֶׁ֧בַע בַּת עַמִּינָדָ֛ב אֲח֥וֹת נַחְשׁ֖וֹן ל֣/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֣לֶד ל֗/וֹ אֶת נָדָב֙ וְ/אֶת אֲבִיה֔וּא אֶת אֶלְעָזָ֖ר וְ/אֶת אִֽיתָמָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: vi
  text: A-rôn lấy Ê-li-sê-ba, con gái A-mi-na-đáp và là chị/em gái của Na-ha-sôn, làm vợ; bà sinh cho A-rôn Na-đáp, A-bi-hu, Ê-lê-a-xa và I-tha-ma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Trong ngữ cảnh hôn nhân, לקח cùng với cụm “làm vợ” được diễn đạt tự nhiên trong tiếng Việt là “lấy ... làm vợ”, vừa giữ sắc thái của động từ gốc vừa nói rõ quan hệ hôn nhân.
- source_word: אֱלִישֶׁבַע
  choice: Ê-li-sê-ba
  rationale: Phiên âm trực tiếp tên riêng Hê-bơ-rơ theo cách đọc rõ ràng, quen thuộc với độc giả Việt.
- source_word: בַּת
  choice: con gái
  rationale: Diễn đạt trực tiếp quan hệ huyết thống trong cụm sở thuộc “con gái A-mi-na-đáp”.
- source_word: אֲחוֹת
  choice: em gái
  rationale: Gia phả tại Ru-tơ 4:20 và 1 Sử ký 2:10 đặt Na-ha-sôn trong thế hệ kế tiếp A-mi-na-đáp; trong tiếng Việt, “em gái” là cách tự nhiên để chỉ người chị/em gái của một người nam khi ngữ cảnh truyền thống nhận diện bà như vậy. Tuy nhiên, bản thân אֲחוֹת chỉ xác định quan hệ chị/em gái.
- source_word: לוֹ לְאִשָּׁה
  choice: làm vợ
  rationale: Cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt cho công thức hôn nhân Hê-bơ-rơ.
- source_word: וַתֵּלֶד לוֹ
  choice: sinh cho ông
  rationale: Giữ cả hành động sinh con và bổ ngữ chỉ người cha; lặp tên Ê-li-sê-ba giúp câu tiếng Việt rõ chủ thể.
- source_word: נָדָב
  choice: Na-đáp
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo âm tiết dễ đọc trong tiếng Việt.
- source_word: אֲבִיהוּא
  choice: A-bi-hu
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo âm tiết dễ đọc trong tiếng Việt.
- source_word: אֶלְעָזָר
  choice: Ê-lê-a-xa
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo âm tiết dễ đọc trong tiếng Việt.
- source_word: אִיתָמָר
  choice: I-tha-ma
  rationale: Phiên âm tên riêng Hê-bơ-rơ theo âm tiết dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Quan hệ tuổi tác trong từ אֲחוֹת
  choice: em gái của Na-ha-sôn
  alternative: chị/em gái của Na-ha-sôn
  rationale: Tiếng Việt thường buộc phải chọn đại từ thân tộc cụ thể hơn tiếng Hê-bơ-rơ. “Em gái” phù hợp với cách gọi đã định hình trong truyền thống Kinh Thánh tiếng Việt và với trình tự gia phả, nhưng văn bản câu này tự nó không mã hóa tuổi tương đối.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm vừa phải. Dùng cấu trúc thuần Việt “lấy ... làm vợ” và lặp tên Ê-li-sê-ba để tránh đại từ mơ hồ. Tên riêng được phiên âm theo âm tiết, có dấu nối để độc giả phổ thông dễ đọc.
