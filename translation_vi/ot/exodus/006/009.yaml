base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: vi
  text: Môi-se nói những điều ấy với con cái Y-sơ-ra-ên, nhưng họ không lắng nghe Môi-se vì tinh thần suy sụp[a] và vì lao dịch khắc nghiệt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “vì sự ngắn của tinh thần.” Cũng có thể dịch là “vì nản lòng” hoặc “vì tinh thần bị dồn ép”.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lao động khắc nghiệt” hoặc, theo bối cảnh, “ách nô lệ khắc nghiệt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nói lại
  rationale: Động từ דבר ở thể piel có nghĩa là “nói”. Trong mạch văn, “nói lại” tự nhiên cho thấy Môi-se truyền đạt sứ điệp vừa nhận từ Đức Chúa Trời, mà không thêm ý giải thích.
- source_word: כֵּן
  choice: những lời ấy
  rationale: כֵּן hồi chỉ nội dung sứ điệp ở trước. “Những lời ấy” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại hơn cách dịch sát hình thức “như vậy”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Cách gọi quen thuộc, trang trọng và bao quát cộng đồng hậu duệ của Y-sơ-ra-ên; giữ được hình ảnh thân tộc của nguyên ngữ mà không khiến độc giả hiểu là chỉ nam giới.
- source_word: שָׁמְעוּ אֶל
  choice: không nghe
  rationale: Thành ngữ שמע אל tại đây là lắng nghe hoặc tiếp nhận lời của một người. “Không nghe” tự nhiên, đồng thời giữ được độ mở giữa việc không thể tiếp nhận và không làm theo.
- source_word: מִקֹּצֶר רוּחַ
  choice: vì tinh thần suy sụp
  rationale: Cụm từ có nghĩa đen là “do sự ngắn/hụt của khí thần”, diễn tả nội tâm bị dồn ép, mất nhuệ khí. “Tinh thần suy sụp” truyền đạt sức nặng cảm xúc mà không thu hẹp thành thiếu kiên nhẫn.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: và vì công việc khổ sai
  rationale: עֲבֹדָה là công việc, lao dịch hoặc sự phục dịch; trong bối cảnh Ai Cập, đây là lao động cưỡng bức. “Công việc khổ sai” vừa nêu rõ tính áp bức vừa gần với phạm vi từ vựng của nguyên ngữ.
theological_decisions:
- issue: Nguyên nhân dân Y-sơ-ra-ên không nghe lời Môi-se
  choice: vì tinh thần suy sụp và vì công việc khổ sai
  alternative: vì thiếu kiên nhẫn và ách nô lệ khắc nghiệt
  rationale: Bản dịch không quy hành vi của dân chúng đơn giản cho sự cứng lòng hay bất tuân, vì câu Hebrew nhấn mạnh tình trạng nội tâm bị dồn ép cùng lao dịch khắc nghiệt. Cách dịch giữ cả hai nguyên nhân song song.
- issue: Sắc thái của עֲבֹדָה קָשָׁה
  choice: công việc khổ sai
  alternative: ách nô lệ khắc nghiệt
  rationale: Bối cảnh rõ ràng là chế độ nô dịch, nhưng danh từ trực tiếp chỉ lao động/phục dịch. “Công việc khổ sai” bảo toàn nét nghĩa lao động cưỡng bức mà không chuyển hoàn toàn danh từ thành một khái niệm thể chế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” và “Y-sơ-ra-ên” theo dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt. Hai dấu chú thích được đặt ngay sau các cụm từ tương ứng trong câu chính.
