  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính: Môi-se nói với dân Y-sơ-ra-ên; họ không lắng nghe vì tình trạng tinh thần bị dồn ép và lao dịch khắc nghiệt. Tuy nhiên, “nói lại” thêm sắc thái lặp lại không được biểu thị bởi וַיְדַבֵּר. Cụm כֵּן nên được chuyển bằng một hồi chỉ trung tính như “những điều ấy” hoặc “như vậy”.'
  naturalness: “Tinh thần suy sụp” là tiếng Việt hiện đại, rõ nghĩa trong văn cảnh. “Công việc khổ sai” có thể hiểu được nhưng ít tự nhiên hơn “lao dịch khắc nghiệt”, vốn cũng diễn đạt rõ hoàn cảnh lao động bị cưỡng bức. “Không nghe Môi-se” nên đổi thành “không lắng nghe Môi-se” để phản ánh thành ngữ שׁמע אל mà không gán ý bất tuân mạnh hơn cần thiết.
  terminology: Giữ “Môi-se”, “Y-sơ-ra-ên” và “con cái Y-sơ-ra-ên” phù hợp đăng ký Kinh Thánh tiếng Việt. Chú thích a cần tránh cách giải thích “hơi thở bị dồn nén”, vì đó không phải một lựa chọn dịch thuật trực tiếp, tự nhiên cho קצר רוח. Chú thích b nên nêu “lao dịch khắc nghiệt” và lựa chọn theo bối cảnh là “ách nô lệ khắc nghiệt”.
