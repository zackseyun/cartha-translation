  text: Các con trai của Dít-ha là Cô-ra, Nê-phết và Xích-ri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Các con trai của
  rationale: בְּנֵי là dạng số nhiều liên kết của “con trai”; trong gia phả này, ba người nam được nêu trực tiếp nên dịch cụ thể là “các con trai của”. Liên từ וּ nối câu này với danh sách trước; trong tiếng Việt, quan hệ nối tiếp đã rõ nên không cần dịch máy móc thành “và” ở đầu câu.
- source_word: יִצְהָר
  choice: Dít-sa-ha
  rationale: Tên riêng được phiên âm theo cách đọc Hê-bơ-rơ và quy ước tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: קֹרַח
  choice: Cô-ra
  rationale: Tên riêng được phiên âm sang tiếng Việt, không dịch nghĩa.
- source_word: וָ/נֶפֶג
  choice: Nê-phéc
  rationale: Tên riêng נֶפֶג được phiên âm sang tiếng Việt; liên từ đi kèm được thể hiện tự nhiên trong chuỗi liệt kê.
- source_word: וְ/זִכְרִי
  choice: và Xiếc-ri
  rationale: Tên riêng זִכְרִי được phiên âm sang tiếng Việt; וְ được dịch là “và” trước thành viên cuối của danh sách.
