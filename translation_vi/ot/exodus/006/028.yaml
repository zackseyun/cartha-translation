  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: vi
  text: 'Đã xảy ra vào ngày Yahweh phán với Môi-se trong đất Ai Cập: [a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Và đã xảy ra” hoặc “Và có việc xảy ra”. Cụm Hê-bơ-rơ mở đầu đánh dấu sự chuyển tiếp trong mạch kể.'
    reason: lexical_alternative
  - marker: b
    text: 'Hê-bơ-rơ: YHWH; cũng được phiên âm là “Giê-hô-va” và theo truyền thống thường được dịch là “CHÚA”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: sự việc diễn ra như sau
  rationale: Dạng tự sự của היה chuyển tiếp và mở lại mạch kể. Trong tiếng Việt, cụm này tự nhiên hơn cách dịch sát cứng “và đã xảy ra,” đồng thời dấu hai chấm cho thấy câu dẫn sang lời kể tiếp theo.
- source_word: בְּיוֹם
  choice: vào ngày
  rationale: Giữ rõ danh từ chỉ thời gian của tiếng Hê-bơ-rơ, thay vì giản lược thành “khi.”
- source_word: דִּבֶּר ... אֶל
  choice: phán với
  rationale: דבר với אֶל có nghĩa là nói với ai; “phán” là cách diễn đạt tiếng Việt trang trọng, tự nhiên khi chủ thể là Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách phiên âm danh riêng YHWH đã quen thuộc và trang trọng trong tiếng Việt; chú thích nêu cách đọc thay thế và lối dịch truyền thống.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: tại đất Ai Cập
  rationale: Giữ thành tố אֶרֶץ “đất/xứ” trong nguyên văn, với cách nói gọn và tự nhiên bằng tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Bản dịch giữ đây là danh riêng, không âm thầm thay bằng một tước hiệu; chú thích bảo tồn các cách thể hiện phổ biến khác.
- issue: Quan hệ của câu 28 với phần tiếp theo
  choice: dùng “sự việc diễn ra như sau:”
  alternative: “thì xảy ra rằng” hoặc kết câu bằng dấu gạch ngang
  rationale: Câu Hê-bơ-rơ là một chuyển tiếp tự sự chưa tự đủ về mặt diễn ngôn và dẫn vào câu tiếp theo. Dấu hai chấm cùng cụm dẫn giữ chức năng ấy mà không bổ sung nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán” phù hợp với lời Đức Chúa Trời; “sự việc diễn ra như sau” làm rõ chức năng chuyển tiếp của một câu dẫn sang 6:29 mà không biến câu thành một mệnh đề độc lập hoàn toàn.
