language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: vi
  text: Hãy đi, nói với Pha-ra-ôn, vua Ai Cập, để Pha-ra-ôn thả con cái Y-sơ-ra-ên[a] ra khỏi đất nước mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dân Y-sơ-ra-ên.” Tiếng Hê-bơ-rơ theo nghĩa đen là “các con trai của Y-sơ-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: Hãy đi
  rationale: Động từ mệnh lệnh בוא có thể mang nghĩa “đến” hoặc “đi”; trong ngữ cảnh Đức Chúa Trời sai Môi-se đến gặp Pha-ra-ôn, “hãy đi” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: דַבֵּר אֶל
  choice: nói với
  rationale: Cụm này chỉ hành động nói trực tiếp với người nhận; “nói với” vừa sát nghĩa vừa tự nhiên.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: Pha-ra-ôn, vua Ai Cập
  rationale: Giữ quan hệ đồng vị của nguyên văn, đồng thời dùng dấu phẩy theo cú pháp tiếng Việt hiện đại.
- source_word: וִישַׁלַּח
  choice: để ông ấy thả ... ra
  rationale: Dạng động từ tiếp sau mệnh lệnh diễn tả nội dung hoặc kết quả được nhắm đến. “Thả ... ra” phù hợp với ngữ cảnh giải phóng dân Y-sơ-ra-ên mà không biến câu thành một lời dự báo chắc chắn.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: בני ישראל theo nghĩa đen là “các con trai/con cái của Y-sơ-ra-ên”, nhưng trong ngữ cảnh chỉ toàn thể cộng đồng. “Con cái Y-sơ-ra-ên” giữ hình ảnh gia tộc và bao quát cộng đồng tự nhiên hơn “các con trai Y-sơ-ra-ên” trong tiếng Việt.
- source_word: מֵאַרְצוֹ
  choice: khỏi đất nước mình
  rationale: אֶרֶץ ở đây là lãnh thổ do Pha-ra-ôn cai trị. “Khỏi đất nước mình” diễn đạt tự nhiên điểm xuất phát và dùng “mình” để quy chiếu rõ về chủ ngữ Pha-ra-ôn.
theological_decisions:
- issue: Phạm vi chỉ định của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; các con trai Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có hình thức giống đực nhưng trong văn cảnh chỉ cộng đồng giao ước nói chung. Bản dịch giữ hình ảnh huyết tộc bằng “con cái” mà không thu hẹp đối tượng chỉ còn nam giới; chú thích nêu phương án dân tộc học tự nhiên hơn.
- issue: Sắc thái của וִישַׁלַּח sau mệnh lệnh
  choice: để ông ấy thả ... ra
  alternative: và ông ấy sẽ cho ... đi
  rationale: Cú pháp có thể được hiểu theo hướng kết quả hoặc nội dung của lời truyền đạt. “Để” bảo toàn mục đích/kết quả được nhắm đến mà không khẳng định đây là dự báo rằng Pha-ra-ôn sẽ lập tức vâng lời.
translation_notes:
  register: Văn phong mệnh lệnh trang trọng nhưng hiện đại. “Pha-ra-ôn” và “Y-sơ-ra-ên” dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt; “ông ấy” giúp câu rõ chủ thể và tránh sắc thái thiếu tôn trọng.
