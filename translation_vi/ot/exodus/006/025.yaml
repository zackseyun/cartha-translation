revisions:
- from: Ê-lê-a-sa, con trai A-rôn, lấy một người trong số các con gái của Phu-ti-ên[a] làm vợ; nàng sinh cho ông Phi-nê-a. Đó là những người đứng đầu các gia tộc phụ hệ[b] của người Lê-vi, theo từng thị tộc của họ.
  to: Ê-lê-a-sa, con trai A-rôn, lấy một con gái trong số các con gái của Phu-ti-ên[a] làm vợ; người vợ ấy sinh cho ông Phi-nê-a. Đó là các trưởng tộc[b] của người Lê-vi, theo các thị tộc của họ.
  rationale: Bản sửa làm rõ thành tố “con gái” trong cụm chỉ gia đình Phu-ti-ên, giữ nguyên sự không xác định danh tính cá nhân qua chú thích, và thay thuật ngữ nặng tính học thuật trong câu chính bằng cách nói hiện đại, tự nhiên hơn. Chú thích bảo lưu nghĩa kỹ thuật của רָאשֵׁי אָבוֹת. Không thay đổi thông tin gia phả, quan hệ hôn nhân, hoặc phân cấp thị tộc của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:13:00Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng quan hệ gia phả và các thành tố chính của tiếng Hê-bơ-rơ. Tuy nhiên, “một người trong số các con gái” không tự nhiên và chưa nêu rõ người được lấy làm vợ là con gái; “gia tộc phụ hệ” là cách gọi nặng tính thuật ngữ và không phải cách diễn đạt Việt ngữ rõ nhất cho רָאשֵׁי אָבוֹת.
  naturalness: Cần thay “một người trong số các con gái” bằng “một con gái trong số các con gái” (hoặc tương đương), và dùng “các trưởng tộc” trong câu chính, với chú thích giải thích thuật ngữ “nhà cha ông”. “Người vợ ấy sinh cho ông” tự nhiên hơn “nàng sinh cho ông” trong văn phong hiện đại mà vẫn giữ chủ thể nữ và לוֹ.
  terminology: Giữ các tên phiên âm đã dùng. “Trưởng tộc” diễn đạt tự nhiên chức năng đứng đầu đơn vị thân tộc; chú thích giữ nghĩa sát “những người đứng đầu các nhà cha ông” và giải thích đây là các đơn vị gia tộc theo dòng cha. “Thị tộc” vẫn thích hợp cho מִשְׁפָּחֹת.
  issues:
  - severity: medium
    issue: Cụm “một người trong số các con gái của Phu-ti-ên” thiếu danh từ chỉ rõ người ấy là con gái và nghe không tự nhiên.
    rationale: מִבְּנוֹת פּוּטִיאֵל có nghĩa là từ/trong số các con gái của Phu-ti-ên. Trong tiếng Việt, cần nói rõ “một con gái” để câu chính xác và trôi chảy.
  - severity: low
    issue: “Những người đứng đầu các gia tộc phụ hệ” nặng thuật ngữ và hơi gượng trong câu chính.
    rationale: רָאשֵׁי אָבוֹת là thuật ngữ gia phả về các trưởng của “nhà cha ông”; “các trưởng tộc” tự nhiên hơn, còn nghĩa kỹ thuật nên được bảo lưu trong chú thích.
  revised_text: Ê-lê-a-sa, con trai A-rôn, lấy một con gái trong số các con gái của Phu-ti-ên[a] làm vợ; người vợ ấy sinh cho ông Phi-nê-a. Đó là các trưởng tộc[b] của người Lê-vi, theo các thị tộc của họ.
