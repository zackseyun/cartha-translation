  text: וְ/אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן לָקַֽח ל֨/וֹ מִ/בְּנ֤וֹת פּֽוּטִיאֵל֙ ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת פִּֽינְחָ֑ס אֵ֗לֶּה רָאשֵׁ֛י אֲב֥וֹת הַ/לְוִיִּ֖ם לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: vi
  text: Ê-lê-a-sa, con trai A-rôn, lấy một con gái trong số các con gái của Phu-ti-ên[a] làm vợ; người vợ ấy sinh cho ông Phi-nê-a. Đó là các trưởng tộc[b] của người Lê-vi, theo các thị tộc của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một trong các con gái của Phu-ti-ên.” Cụm từ Hê-bơ-rơ theo nghĩa sát là “từ trong các con gái của Phu-ti-ên,” có thể chỉ việc kết hôn vào gia đình Phu-ti-ên mà không xác định người con gái nào.'
    reason: lexical_alternative
  - marker: b
    text: Theo nghĩa sát là “những người đứng đầu các nhà cha ông,” một thuật ngữ thân tộc chỉ những người lãnh đạo các đơn vị gia tộc theo dòng cha trong các thị tộc Lê-vi.
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: lấy ... làm vợ
  rationale: Diễn đạt tự nhiên thành ngữ hôn nhân Hê-bơ-rơ “lấy cho mình ... làm vợ,” đồng thời không thêm sắc thái ngoài văn bản.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: một người trong số các con gái của Phu-ti-ên
  rationale: Giới từ מִן chỉ việc chọn từ một nhóm hoặc thuộc về một gia đình; cách dịch này rõ nghĩa trong tiếng Việt, còn chú thích giữ lại độ mở của cấu trúc Hê-bơ-rơ.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: nàng sinh cho ông Phi-nê-a
  rationale: Giữ chủ thể giống cái của động từ và đại từ chỉ người hưởng nhận לוֹ; “nàng” phù hợp với văn phong gia phả trang trọng.
- source_word: אֵלֶּה
  choice: Đó là
  rationale: Đại từ chỉ định mở đầu lời tổng kết danh sách gia phả; “Đó là” tự nhiên trong mạch văn tiếng Việt.
- source_word: רָאשֵׁי אֲבוֹת
  choice: những người đứng đầu các gia tộc phụ hệ
  rationale: Đây là thuật ngữ xã hội-gia phả chỉ người lãnh đạo các đơn vị dòng họ theo tổ tiên bên cha, không chỉ đơn thuần là những người cha.
- source_word: הַלְוִיִּם
  choice: người Lê-vi
  rationale: Chỉ tập thể hậu duệ thuộc chi tộc Lê-vi; đây là cách gọi quen thuộc và chính xác trong tiếng Việt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: theo từng thị tộc của họ
  rationale: Trong ngữ cảnh gia phả, מִשְׁפָּחָה thường chỉ nhóm họ hàng rộng hơn gia đình hạt nhân; “thị tộc” giúp phân biệt với “gia tộc phụ hệ” ở vế trước.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: Ê-lê-a-sa / A-rôn / Phu-ti-ên / Phi-nê-a
  rationale: Phiên âm các tên riêng theo hình thức tiếng Việt quen dùng, không dịch nghĩa tên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cấu trúc gia phả của nguyên văn nhưng dùng các thuật ngữ “gia tộc phụ hệ” và “thị tộc” để thể hiện hai cấp độ thân tộc khác nhau. Dấu chú thích [b] được đặt tại cụm từ mà chú thích giải nghĩa.
