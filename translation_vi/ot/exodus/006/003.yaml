- from: Ta đã hiện ra với Áp-ra-ham, với Y-sác và với Gia-cốp trong tư cách Đức Chúa Trời Toàn Năng[a]; nhưng bởi danh ta là Yahweh, ta đã không được họ biết đến.[b]
