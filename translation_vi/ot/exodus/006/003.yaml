language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: vi
  text: Ta đã hiện ra với Áp-ra-ham, với Y-sác và với Gia-cốp với tư cách là Đức Chúa Trời Toàn Năng[a]; nhưng Ta không được họ biết đến qua danh Ta là Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: El Shaddai; theo truyền thống được dịch là “Đức Chúa Trời Toàn Năng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ta đã không bày tỏ chính mình cho họ bởi danh Yahweh.” Câu Hê-bơ-rơ có thể không hàm ý rằng các tổ phụ hoàn toàn không biết danh này, nhưng rằng họ chưa biết trọn ý nghĩa và hiệu lực giao ước của danh ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: Ta đã hiện ra
  rationale: Dạng Niphal ngôi thứ nhất số ít của ראה có nghĩa trực tiếp là “ta đã hiện ra”; cách dịch này giữ ngôn ngữ về sự hiện ra của Đức Chúa Trời mà không diễn giải thêm thành “bày tỏ chính mình”.
- source_word: אֶל ... אֶל ... וְאֶל
  choice: với Áp-ra-ham, với Y-sác và với Gia-cốp
  rationale: Lặp lại “với” phản ánh ba lần dùng אֶל, đồng thời tạo nhịp trang trọng và tự nhiên trong tiếng Việt.
- source_word: בְּאֵל שַׁדָּי
  choice: trong tư cách Đức Chúa Trời Toàn Năng
  rationale: בְּ ở đây giới thiệu danh xưng hay tư cách mà Đức Chúa Trời hiện ra. “Trong tư cách” diễn đạt rõ quan hệ này; “Đức Chúa Trời Toàn Năng” là cách dịch truyền thống, dễ hiểu của אֵל שַׁדָּי.
- source_word: וּשְׁמִי יְהוָה
  choice: nhưng bởi danh ta là Yahweh
  rationale: Giữ cấu trúc “bởi danh ta” của tiếng Hê-bơ-rơ và dùng Yahweh cho danh riêng יהוה, thay vì thay thế bằng một tước hiệu.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: ta đã không được họ biết đến
  rationale: 'Cách dịch bị động/trạng thái này bám sát dạng Niphal và cố ý giữ nguyên sự căng nghĩa: câu có thể nói đến việc chưa biết danh ấy, hoặc chưa biết đầy đủ ý nghĩa và hiệu lực giao ước của danh ấy.'
theological_decisions:
- issue: Ý nghĩa của mệnh đề nói các tổ phụ không biết Đức Chúa Trời bởi danh Yahweh
  choice: 'Giữ cách diễn đạt sát hình thức: “bởi danh ta là Yahweh, ta đã không được họ biết đến”'
  alternative: “Ta đã không bày tỏ chính mình cho họ bởi danh Yahweh” hoặc hiểu rằng họ chưa biết đầy đủ ý nghĩa giao ước của danh ấy
  rationale: Tiếng Hê-bơ-rơ cho phép cách hiểu bị động hoặc phản thân. Vì Sáng Thế Ký có nhắc đến danh Yahweh trong bối cảnh các tổ phụ, bản văn chính không nên tự ý quyết định rằng họ hoàn toàn chưa nghe danh này hay chỉ chưa kinh nghiệm trọn ý nghĩa của danh; chú thích nêu rõ khả năng thứ hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp lời phán trực tiếp của Đức Chúa Trời. Các tên riêng dùng dạng Việt hóa quen thuộc; “Yahweh” được giữ như danh riêng. Cấu trúc hơi trang trọng ở mệnh đề cuối nhằm bảo tồn tính mơ hồ có thật của nguyên văn.
