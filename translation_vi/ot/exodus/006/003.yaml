  rationale: Bản sửa làm rõ cú pháp tiếng Việt của mệnh đề về Yahweh, đồng thời giữ cách diễn đạt bị động “Ta không được họ biết đến” để không quyết định giữa việc các tổ phụ không biết danh ấy và việc Đức Chúa Trời chưa tự bày tỏ trọn ý nghĩa của danh. Chú thích tiếp tục nêu cách đọc thay thế mà không đưa diễn giải đó vào bản văn chính.
  reviewer_model: gpt-5.6-terra
