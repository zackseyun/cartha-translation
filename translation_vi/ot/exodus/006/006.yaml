source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: vi
  text: 'Vì vậy, hãy nói với con cháu Israel[a]: “Ta là Yahweh[b]. Ta sẽ đưa các ngươi ra khỏi ách nặng của Ai Cập, giải thoát các ngươi khỏi ách nô lệ của chúng[c], và chuộc các ngươi bằng cánh tay giơ ra cùng những phán xét lớn lao[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “các con trai của Israel”; cụm này cũng có thể dịch là “dân Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hê-bơ-rơ: YHWH, tên riêng của Đức Chúa Trời; một số bản dịch dùng “CHÚA.”'
    reason: alternative_reading
  - marker: c
    text: Cũng có thể dịch là “khỏi sự phục dịch của chúng”; từ Hê-bơ-rơ có thể chỉ sự phục vụ hoặc lao động, nhưng ở đây nói về cảnh phục dịch cưỡng bức dưới quyền người Ai Cập.
    reason: lexical_alternative
  - marker: d
    text: Cũng có thể dịch là “những hành động phán xét lớn lao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Vì vậy
  rationale: Giữ rõ quan hệ suy luận với lời Đức Chúa Trời ở câu trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: với con cháu Israel
  rationale: Giữ sắc thái thân tộc của thành ngữ Hê-bơ-rơ nhưng tránh cách dịch quá sát “các con trai của Israel,” vốn dễ bị hiểu là chỉ nam giới hoặc các con trai trực tiếp của tổ phụ Israel.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Chuyển tự danh riêng giao ước יהוה và dùng đại từ “Ta” phù hợp với lời phán trực tiếp, trang trọng của Đức Chúa Trời.
- source_word: וְהוֹצֵאתִי
  choice: Ta sẽ đưa các ngươi ra
  rationale: Thể hiện ý khiến cho ra khỏi của thể Hiphil và giữ mô-típ xuất hành.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: ra khỏi những gánh nặng do Ai Cập áp đặt
  rationale: Giữ hình ảnh cụ thể “gánh nặng” của סִבְלֹת, đồng thời diễn đạt rõ Ai Cập là bên áp đặt thay vì để cụm sở hữu tiếng Việt gây mơ hồ không cần thiết.
- source_word: וְהִצַּלְתִּי
  choice: giải thoát các ngươi
  rationale: Diễn đạt hành động cứu khỏi sự thống trị và phù hợp với văn cảnh dân Israel bị áp bức.
- source_word: מֵעֲבֹדָתָם
  choice: khỏi cảnh nô lệ cho họ
  rationale: Trong văn cảnh này עֲבֹדָה không phải công việc trung tính mà là sự phục dịch cưỡng bức; hậu tố số nhiều được thể hiện bằng “họ,” chỉ người Ai Cập.
- source_word: וְגָאַלְתִּי
  choice: chuộc các ngươi
  rationale: “Chuộc” giữ được sắc thái giải cứu bằng tư cách người có quyền chuộc của גאל mà không giải thích quá mức ý nghĩa thần học.
- source_word: בִּזְרוֹעַ נְטוּיָה
  choice: bằng cánh tay dang ra
  rationale: Giữ nguyên hình ảnh nhân hình học chỉ sự can thiệp đầy quyền năng của Yahweh.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: cùng những cuộc phán xét lớn lao
  rationale: Giữ nghĩa tư pháp của שְׁפָטִים và tính chất lớn lao của các hành động phán xét chống lại Ai Cập.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה. Chuyển tự “Yahweh” phân biệt danh riêng này với tước hiệu “Chúa” và không thay nó bằng một truyền thống phát âm khác.
- issue: Phạm vi của לִבְנֵי יִשְׂרָאֵל
  choice: con cháu Israel
  alternative: các con trai của Israel; dân Israel
  rationale: Cụm từ có hình thức giống đực số nhiều nhưng ở đây gọi toàn thể cộng đồng giao ước. “Con cháu Israel” bảo tồn hình ảnh gia tộc mà không thu hẹp đối tượng thành nam giới.
- issue: Sắc thái của עֲבֹדָה
  choice: cảnh nô lệ
  alternative: sự phục dịch; việc lao động
  rationale: Bối cảnh là lao dịch cưỡng bức dưới quyền Ai Cập. “Cảnh nô lệ” nói rõ thực trạng xã hội nhưng không thêm một cách giải thích giáo phái.
- issue: Ý nghĩa của גאל
  choice: chuộc
  alternative: cứu; đòi lại
  rationale: “Chuộc” giữ sự căng thẳng giữa hành động giải cứu cụ thể và chiều kích pháp lý-thân tộc của động từ, thay vì giản lược nó thành “cứu.”
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—các ngươi” đánh dấu lời phán có thẩm quyền trong bối cảnh cổ đại. Bản dịch giữ nhịp ba hành động “đưa ra—giải thoát—chuộc” và bảo tồn các hình ảnh “gánh nặng” तथा “cánh tay dang ra,” đồng thời dùng chú thích để nêu các khả năng dịch đáng kể.
