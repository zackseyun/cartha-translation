revisions:
- from: 'Vì vậy, hãy nói với con cháu Israel[a]: “Ta là Yahweh[b]. Ta sẽ đưa các ngươi ra khỏi những gánh nặng do Ai Cập áp đặt, giải thoát các ngươi khỏi cảnh nô lệ cho họ[c], và chuộc các ngươi bằng cánh tay dang ra cùng những cuộc phán xét lớn lao[d].”'
  to: 'Vì vậy, hãy nói với con cháu Israel[a]: “Ta là Yahweh[b]. Ta sẽ đưa các ngươi ra khỏi ách nặng của Ai Cập, giải thoát các ngươi khỏi ách nô lệ của chúng[c], và chuộc các ngươi bằng cánh tay giơ ra cùng những phán xét lớn lao[d].”'
