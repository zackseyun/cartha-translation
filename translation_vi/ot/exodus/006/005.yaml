language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: vi
  text: Ta cũng đã nghe tiếng rên xiết của con dân Y-sơ-ra-ên[a], mà người Ai Cập đang bắt làm nô lệ, và Ta đã nhớ đến giao ước của Ta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “các con trai của Y-sơ-ra-ên”, tức là dân Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: b
    text: Trong ngôn ngữ giao ước, Đức Chúa Trời “nhớ đến” không hàm ý Ngài đã quên, nhưng cho thấy Ngài hướng đến giao ước để hành động.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Ta cũng
  rationale: Giữ sắc thái bổ sung và nhấn mạnh chủ thể thần linh; “Ta” phù hợp với lời Đức Chúa Trời tự xưng trong văn phong Kinh Thánh tiếng Việt trang trọng, tự nhiên.
- source_word: שָׁמַעְתִּי
  choice: đã nghe
  rationale: Dạng hoàn thành Hê-bơ-rơ diễn tả việc nghe đã xảy ra và hiện có ý nghĩa trong lời phán; tiếng Việt dùng “đã nghe” tự nhiên hơn mà vẫn giữ kết quả hiện tại theo ngữ cảnh.
- source_word: נַאֲקַת
  choice: tiếng rên xiết
  rationale: Diễn đạt tiếng kêu đau đớn do áp bức, rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ nghĩa đen là “các con trai của Y-sơ-ra-ên” nhưng ở đây chỉ toàn thể cộng đồng giao ước; “con dân Y-sơ-ra-ên” vừa giữ liên hệ với tên Y-sơ-ra-ên vừa diễn đạt lực tập thể tự nhiên.
- source_word: מִצְרַיִם
  choice: những người Ai Cập
  rationale: Danh từ hình thức là “Ai Cập”, nhưng phân từ số nhiều cho thấy tác nhân là người Ai Cập; cách dịch này làm rõ tác nhân mà không thay đổi nghĩa.
- source_word: מַעֲבִדִים
  choice: đang bắt làm nô lệ
  rationale: Dạng Hiphil của עבד diễn tả việc cưỡng ép phục dịch; cụm này truyền đạt rõ sự áp bức và tình trạng nô lệ.
- source_word: וָאֶזְכֹּר
  choice: Ta đã nhớ đến
  rationale: Giữ nguyên thành ngữ giao ước của nguyên văn thay vì diễn giải thành hành động cụ thể; “nhớ đến” tự nhiên hơn “nhớ” khi nói đến việc hướng sự chú ý vào giao ước.
- source_word: בְּרִיתִי
  choice: giao ước của Ta
  rationale: “Giao ước” là cách dịch chuẩn và chính xác của בְּרִית trong bối cảnh quan hệ cam kết giữa Đức Chúa Trời và dân Ngài.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên; người Y-sơ-ra-ên
  rationale: Nguyên ngữ dùng hình thức giống đực nhưng có nghĩa tập thể, không chỉ nói đến nam giới. Bản chính ưu tiên cách nói tiếng Việt tự nhiên, còn nghĩa đen được ghi ở chú thích.
- issue: Ý nghĩa của việc Đức Chúa Trời “nhớ” giao ước
  choice: Ta đã nhớ đến giao ước của Ta
  alternative: Ta đã lưu tâm để thực hiện giao ước của Ta
  rationale: Giữ cách nói giàu ý nghĩa thần học của nguyên văn và không giải quyết thay độc giả sự căng thẳng trong ngôn ngữ nhân hình; chú thích làm rõ rằng đây không nhất thiết hàm ý Đức Chúa Trời từng quên.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Đức Chúa Trời tự xưng; giữ danh xưng Y-sơ-ra-ên và thuật ngữ “giao ước”. Cả hai dấu chú thích [a], [b] đều xuất hiện trong câu chính đúng với nội dung chú thích.
