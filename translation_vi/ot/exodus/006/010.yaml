  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: vi
  text: 'Rồi Yahweh[a] phán với Môi-se rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ: YHWH; cũng được phiên âm là “Giê-hô-va”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Rồi ... phán
  rationale: Dạng waw liên tiếp đưa trình thuật tiến sang hành động kế tiếp; “rồi” diễn đạt tự nhiên trình tự ấy. “Phán” là từ trang trọng, thông dụng trong tiếng Việt khi nói về lời Đức Chúa Trời, đồng thời phản ánh động từ דבר “nói/phán”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời bằng cách phiên âm Danh Bốn Chữ, thay vì thay thế bằng một tước hiệu.
- source_word: אֶל
  choice: với
  rationale: Trong kết cấu “phán với”, từ này diễn đạt tự nhiên hướng của lời nói đến Môi-se.
- source_word: מֹשֶׁה
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này dẫn vào lời trực tiếp. “Rằng” giữ chức năng dẫn lời một cách tự nhiên và tránh lặp vụng “phán… nói” trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va
  rationale: Bản Hê-bơ-rơ trực tiếp dùng Danh Bốn Chữ. “Yahweh” là cách phiên âm được giới nghiên cứu hiện đại chấp nhận rộng rãi; chú thích giữ lại cách phiên âm truyền thống “Giê-hô-va” mà không thay danh riêng bằng tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” theo lối nói tiếng Việt quen thuộc dành cho lời Đức Chúa Trời; dùng “rằng” để dẫn vào nội dung phát ngôn ở câu kế tiếp.
