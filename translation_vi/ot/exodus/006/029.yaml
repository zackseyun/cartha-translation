id: EXO.6.29
reference: Exodus 6:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se rằng: “Ta là Yahweh. Hãy nói với Pha-ra-ôn, vua Ai Cập, mọi điều Ta phán với con[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi điều Ta đang phán với con.”'
    reason: Phân từ דֹּבֵר có thể được hiểu với sắc thái tiếp diễn, “đang phán”.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ, ... phán
  rationale: Dạng động từ nối tiếp bằng waw đưa câu chuyện tiến sang hành động kế tiếp. “Bấy giờ” diễn đạt tự nhiên mạch kể, còn “phán” phù hợp với lời nói của Đức Chúa Trời trong văn phong Kinh Thánh tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước dưới dạng chuyển tự, thay vì thay thế bằng một tước hiệu.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Động từ nguyên mẫu này giới thiệu lời nói trực tiếp; “rằng” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: אֲנִי יְהוָה
  choice: Ta là Yahweh
  rationale: Mệnh đề không có động từ trong tiếng Hê-bơ-rơ cần thêm “là” trong tiếng Việt. Đại từ “Ta” giữ sắc thái trang trọng của lời Đức Chúa Trời tự xưng.
- source_word: דַּבֵּר
  choice: Hãy nói
  rationale: Thể mệnh lệnh được thể hiện rõ bằng “hãy”. “Nói” đồng thời giữ được sự lặp lại của gốc דבר trong câu.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Pha-ra-ôn, vua Ai Cập
  rationale: Cụm đồng vị Hê-bơ-rơ được diễn đạt tự nhiên bằng dấu phẩy trong tiếng Việt.
- source_word: אֵת כָּל אֲשֶׁר
  choice: mọi điều
  rationale: Cách nói này chuyển tải toàn bộ nội dung phải truyền đạt, vừa chính xác vừa tự nhiên.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: Ta phán với con
  rationale: Phân từ דֹּבֵר có thể chỉ hành động đang diễn ra hoặc mang tính tiếp diễn. Cách dịch hiện tại không đánh dấu “đang” giữ được độ mở ấy và bảo tồn sự lặp lại với động từ דבר trước đó.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng bốn phụ âm. Giữ dạng chuyển tự “Yahweh” bảo tồn tư cách danh riêng và lời tự nhận diện của Đức Chúa Trời trong sách Xuất Hành, không thay bằng tước hiệu.
- issue: Sắc thái thời-thể của אֲנִי דֹּבֵר אֵלֶיךָ
  choice: Ta phán với con
  alternative: Ta đang phán với con
  rationale: Phân từ Hê-bơ-rơ cho phép cách hiểu đang diễn ra, nhưng ngữ cảnh mệnh lệnh cũng có thể nói khái quát về mọi điều Yahweh truyền cho Môi-se. Bản chính không ép câu theo riêng một cách hiểu; phương án có “đang” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời của Yahweh, “con” để thể hiện cách Đức Chúa Trời nói với Môi-se, và các dạng tên quen thuộc trong tiếng Việt như “Môi-se”, “Pha-ra-ôn”, “Ai Cập”. Dấu chú thích [a] được đặt ngay sau cụm từ có phương án dịch khác.
