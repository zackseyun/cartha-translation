  terminology: “Yahweh” phản ánh trực tiếp יהוה và được dùng nhất quán ở cả hai lần. “Pha-ra-ôn, vua Ai Cập” thể hiện đúng cấu trúc đồng vị; “mọi điều” truyền đạt כָּל אֲשֶׁר cách tự nhiên. Chú thích được neo đúng tại mệnh đề có phân từ.
