base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: vi
  text: Am-ram lấy Giô-kê-bết, cô/dì của ông[a], làm vợ. Bà sinh cho ông A-rôn và Môi-se. Am-ram sống được 137 năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có thể chỉ một người cô/dì; cũng có thể được hiểu hẹp là chị hoặc em gái của cha ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: lấy
  rationale: Trong ngữ cảnh hôn nhân, “lấy ... làm vợ” vừa giữ được thành ngữ Hê-bơ-rơ vừa tự nhiên trong tiếng Việt.
- source_word: דֹּדָתוֹ
  choice: cô của mình
  rationale: Danh từ giống cái chỉ người họ hàng nữ tương ứng với דּוֹד; trong ngữ cảnh này, “cô” diễn đạt ngắn gọn quan hệ người nữ thuộc thế hệ cha mẹ, nhưng câu này tự nó không hoàn toàn minh định mức độ cụ thể.
- source_word: לְאִשָּׁה
  choice: làm vợ
  rationale: Cụm giới từ xác định quan hệ hôn nhân; “lấy ... làm vợ” là cách nói tự nhiên, trang trọng vừa phải trong tiếng Việt.
- source_word: וַתֵּלֶד לוֹ
  choice: Bà sinh cho ông
  rationale: Giữ đại từ gián tiếp לוֹ và diễn đạt rõ, tự nhiên trong văn gia phả.
- source_word: שְׁנֵי חַיֵּי
  choice: sống được
  rationale: Chuyển cấu trúc “những năm của đời...” sang cách nêu tuổi thọ tự nhiên trong tiếng Việt mà không thay đổi nội dung.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 năm
  rationale: Diễn đạt rõ ràng theo quy ước số hiện đại và giữ nguyên chính xác giá trị số.
- source_word: עַמְרָם / יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה
  choice: Am-ram / Giô-kê-bết / A-rôn / Môi-se
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc, dễ đọc trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch quan hệ họ hàng gần trong cuộc hôn nhân mà luật Torah về sau cấm
  choice: cô của mình
  alternative: người cô bên nội của mình / người bà con nữ của mình
  rationale: Bản dịch thuật lại dữ kiện gia phả mà không thêm lời phán xét đạo đức. “Cô” giữ quan hệ gần gũi; chú thích bảo tồn khả năng hiểu cụ thể hơn là chị hoặc em gái của cha mà không buộc câu chính phải giải quyết hoàn toàn độ rộng của thuật ngữ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, rõ ràng và trang nghiêm vừa phải. Cấu trúc câu được làm tự nhiên cho độc giả phổ thông; quan hệ họ hàng được giữ trong câu chính và giải thích độ cụ thể ở chú thích.
