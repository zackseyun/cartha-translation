    rationale: Trong tiếng Việt chuẩn, “cô” chỉ chị hoặc em gái của cha; vì vậy câu chính và chú thích hiện không nhất quán, đồng thời câu chính không bảo tồn được sự mơ hồ của thuật ngữ nguồn.
