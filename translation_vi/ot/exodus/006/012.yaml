  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: vi
  text: 'Nhưng Môi-se thưa trước mặt Yahweh rằng: “Này, con cái Y-sơ-ra-ên không nghe con; vậy thì làm sao Pha-ra-ôn sẽ lắng nghe con, khi con có đôi môi không cắt bì[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hê-bơ-rơ: “không cắt bì về môi,” một thành ngữ diễn tả lời nói bị ngăn trở hoặc không đủ khả năng; xem Xuất Ai Cập 4:10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nhưng Môi-se thưa
  rationale: Waw nối tiếp diễn tiến câu chuyện nhưng ở đây cũng nêu sự tương phản với mệnh lệnh ngay trước đó. “Thưa” tự nhiên trong tiếng Việt khi Môi-se nói với Đức Chúa Trời, mà vẫn giữ nghĩa cơ bản của דבר.
- source_word: לִפְנֵי יְהוָה
  choice: trước mặt Yahweh
  rationale: Giữ thành ngữ không gian-quan hệ לִפְנֵי, nghĩa là “trước mặt/trong sự hiện diện của”, và phiên âm danh riêng יהוה là Yahweh.
- source_word: הֵן
  choice: Này
  rationale: Tiểu từ thu hút sự chú ý; “Này” trang trọng, tự nhiên và không cổ kính quá mức.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc của בני và cách gọi cộng đồng giao ước, đồng thời tự nhiên hơn “các con trai của Y-sơ-ra-ên” trong tiếng Việt.
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: còn không nghe con
  rationale: שמע với אֶל có nghĩa nghe và lưu tâm. “Còn không” làm rõ lập luận từ điều nhỏ hơn đến điều lớn hơn, nhưng không nâng nghĩa thành “vâng lời”.
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: thì làm sao Pha-ra-ôn chịu nghe con
  rationale: “Thì làm sao” diễn đạt tự nhiên suy luận tu từ. “Chịu nghe” chuyển tải việc lắng nghe/đón nhận lời nói trong ngữ cảnh mà không nhất thiết mang nghĩa tuân lệnh.
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: khi môi miệng con chưa được cắt bì
  rationale: Giữ nguyên ẩn dụ nổi bật về sự chưa cắt bì thay vì quy thành một chẩn đoán như nói lắp hay kém ăn nói. “Môi miệng” là cách diễn đạt tiếng Việt tự nhiên cho שפתים trong ngữ cảnh khả năng nói.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Văn bản Hê-bơ-rơ dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo tồn tư cách danh riêng thay vì thay bằng một tước hiệu.
- issue: Cách xử lý thành ngữ עֲרַל שְׂפָתָיִם
  choice: môi miệng con chưa được cắt bì
  alternative: con ăn nói vụng về / con nói năng khó khăn
  rationale: 'Giữ ẩn dụ Hê-bơ-rơ và sự căng thẳng văn chương-thần học: Môi-se tự mô tả lời nói của mình là bị ngăn trở hoặc không thích hợp, nhưng câu không xác định chính xác một khuyết tật nói năng.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng đại từ “con” vì Môi-se đang thưa với Yahweh. Giữ danh riêng Yahweh và ẩn dụ “chưa được cắt bì,” đồng thời chú thích để người đọc hiểu chức năng của thành ngữ.
