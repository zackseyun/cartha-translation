base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/022.yaml
  text: 'And the sons of Uzziel: Mishael[a], Elzaphan[b], and Sithri.'
translation:
  language: vi
  text: Các con trai của U-xi-ên là Mi-sa-ên, Ên-xa-phan và Sít-ri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Các con trai của
  rationale: בְנֵי là dạng số nhiều liên kết, chỉ các con trai trong gia phả. Liên từ וּ nối câu này với danh sách trước; trong tiếng Việt, sự tiếp nối đã rõ từ cấu trúc liệt kê nên không cần dịch máy móc là “Và”.
- source_word: עֻזִּיאֵל
  choice: U-xi-ên
  rationale: Tên riêng được phiên âm theo cách đọc gần với tiếng Hê-bơ-rơ và theo lối viết tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: מִישָׁאֵל
  choice: Mi-sa-ên
  rationale: Phiên âm tên riêng theo tiếng Hê-bơ-rơ; âm cuối אֵל được thể hiện là “ên” theo quy ước phiên âm tiếng Việt được dùng nhất quán trong câu.
- source_word: וְ/אֶלְצָפָן
  choice: Ên-xa-phan
  rationale: Phiên âm trực tiếp tên אֶלְצָפָן; liên từ וְ được thể hiện tự nhiên trong chuỗi liệt kê tiếng Việt bằng “và” trước tên cuối cùng.
- source_word: וְ/סִתְרִי
  choice: và Sít-ri
  rationale: Phiên âm סִתְרִי với phụ âm đầu s, phù hợp với samekh; giữ liên từ “và” để đánh dấu phần tử cuối của danh sách.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và tự nhiên trong tiếng Việt hiện đại. Không đưa các chú thích biến thể phiên âm tiếng Anh vào bản Việt vì chúng không phản ánh một dị bản Hê-bơ-rơ và không cần thiết cho độc giả tiếng Việt.
