base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: vi
  text: Chính họ là những người đã nói với Pha-ra-ôn, vua Ai Cập, để đưa những con trai của Y-sơ-ra-ên ra khỏi Ai Cập—đó là Môi-se và A-rôn.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Chính họ là những người đang nói với Pha-ra-ôn, vua Ai Cập.” Tiếng Hê-bơ-rơ dùng phân từ, có thể diễn tả hành động đang diễn ra hoặc đặc điểm gắn với họ.'
    reason: lexical_alternative
  - marker: b
    text: “Những con trai của Y-sơ-ra-ên” dịch sát cụm từ Hê-bơ-rơ; cách dịch quen thuộc khác là “con cái Y-sơ-ra-ên” hoặc “dân Y-sơ-ra-ên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: Chính họ là những người
  rationale: Đại từ độc lập mang sắc thái nhấn mạnh và quy chiếu lại những người vừa được nêu; cách dịch này tự nhiên trong tiếng Việt và làm rõ sự đồng nhất hóa.
- source_word: הַמְדַבְּרִים
  choice: đã nói
  rationale: Phân từ có chức năng danh từ, mô tả Môi-se và A-rôn qua hành động của họ đối với Pha-ra-ôn. Dạng quá khứ tự nhiên theo mạch kể, còn sắc thái đặc trưng hay tiếp diễn được giữ trong chú thích.
- source_word: אֶל
  choice: với
  rationale: Với động từ 'nói', tiếng Việt tự nhiên dùng 'nói với' để diễn đạt hướng đến người nghe.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Pha-ra-ôn, vua Ai Cập
  rationale: Giữ quan hệ đồng vị của tước hiệu và dùng dấu phẩy phù hợp cú pháp tiếng Việt.
- source_word: לְהוֹצִיא
  choice: để đưa ... ra
  rationale: Thể Hiphil của יצא mang nghĩa khiến cho đi ra; 'đưa ... ra khỏi' vừa tự nhiên vừa giữ nghĩa nguyên nhân.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con trai Y-sơ-ra-ên
  rationale: Giữ nghĩa cụ thể của danh từ giống đực số nhiều בְּנֵי và cách nói gia hệ của nguyên văn, thay vì khái quát thành 'dân Y-sơ-ra-ên'.
- source_word: מִמִּצְרָיִם
  choice: ra khỏi Ai Cập
  rationale: Kết hợp tự nhiên với 'đưa ... ra' và giữ mô-típ xuất hành.
- source_word: הוּא
  choice: đó là
  rationale: Đại từ số ít mở đầu lời xác định lại danh tính dù theo sau là hai tên; 'đó là' giữ nét bất thường ấy mà vẫn chấp nhận được trong tiếng Việt.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Môi-se và A-rôn
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
