source:
  edition: WLC
  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: vi
  text: Các ngươi sẽ là một vương quốc tư tế[a] và một dân thánh cho ta. Đây là những lời ngươi phải nói với con cái Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một vương quốc gồm các thầy tế lễ”; cụm từ Hê-bơ-rơ có thể chỉ một vương quốc gồm các thầy tế lễ hoặc một vương quốc mang đặc tính tư tế. So sánh 1 Phi-e-rơ 2:9, nơi dùng một cách diễn đạt liên hệ.
    reason: lexical_alternative
  - marker: b
    text: “Con cái Israel” là cách nói Hê-bơ-rơ chỉ toàn thể dân Israel, không chỉ những người nam.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתֶּם תִּהְיוּ לִי
  choice: Còn các ngươi sẽ thuộc về ta
  rationale: Đại từ số nhiều được giữ rõ; לִי diễn tả quan hệ thuộc về Đức Chúa Trời. “Sẽ thuộc về ta” tự nhiên trong tiếng Việt và giữ sắc thái tuyên bố về kết quả trong giao ước.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: một vương quốc gồm các thầy tế lễ
  rationale: Cách dịch này giữ danh từ “vương quốc” và cách hiểu trực tiếp rằng vương quốc ấy gồm các thầy tế lễ, đồng thời chú thích bảo lưu khả năng hiểu theo đặc tính tư tế.
- source_word: וְגוֹי קָדוֹשׁ
  choice: và một dân thánh
  rationale: גּוֹי trong ngữ cảnh chỉ một cộng đồng dân tộc; “dân thánh” trang trọng, tự nhiên và giữ ý được biệt riêng cho Đức Chúa Trời.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Đây là những lời
  rationale: Trong ngữ cảnh truyền đạt lời phán, דְּבָרִים phù hợp nhất với “những lời”.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: ngươi phải nói
  rationale: Động từ số ít hướng đến Môi-se. “Phải nói” thể hiện chỉ thị có thẩm quyền bằng tiếng Việt hiện đại, tự nhiên hơn lối dịch “sẽ nói” trong mệnh lệnh này.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  rationale: Giữ hình ảnh quan hệ dòng dõi của thành ngữ Hê-bơ-rơ, nhưng trong tiếng Việt có thể chỉ toàn thể hậu duệ, không chỉ nam giới.
theological_decisions:
- issue: Căn tính và sứ mạng tập thể của Israel trong giao ước
  choice: một vương quốc gồm các thầy tế lễ
  alternative: một vương quốc tư tế
  rationale: Bản văn Hê-bơ-rơ cho phép hiểu đây là vương quốc gồm những người làm chức năng tế lễ hoặc là vương quốc mang đặc tính tư tế. Bản chính dùng cách hiểu trực tiếp hơn, còn chú thích giữ sự mơ hồ chính đáng.
- issue: Quan hệ của Israel với Đức Chúa Trời
  choice: thuộc về ta
  alternative: cho ta
  rationale: לִי có thể diễn tả sự quy hướng hoặc thuộc về. “Thuộc về ta” làm rõ quan hệ giao ước mà không biến câu thành lời khẳng định sở hữu tuyệt đối theo một hệ thần học riêng.
- issue: Phạm vi của danh xưng בְּנֵי יִשְׂרָאֵל
  choice: con cái Israel
  alternative: dân Israel
  rationale: Cụm từ nguyên ngữ có hình thức giống đực nhưng được dùng như danh xưng tập thể cho toàn dân. Bản dịch giữ lối gọi theo dòng dõi và chú thích làm rõ phạm vi bao gồm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” cho cộng đồng Israel và “ngươi” cho Môi-se để bảo toàn sự chuyển đổi số nhiều/số ít trong nguyên ngữ; viết “ta” theo lời Đức Chúa Trời mà không tự động viết hoa đại từ.
