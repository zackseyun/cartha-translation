source:
  edition: WLC
  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: vi
  text: Họ phải sẵn sàng cho ngày thứ ba, vì vào ngày thứ ba, Yahweh sẽ ngự xuống trên núi Sinai trước mắt toàn dân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ נְכֹנִים
  choice: Họ phải sẵn sàng
  rationale: Dạng hoàn thành của היה trong mạch chỉ thị mang sắc thái mệnh lệnh; “phải sẵn sàng” diễn đạt tự nhiên yêu cầu chuẩn bị, còn נְכֹנִים chỉ trạng thái đã sẵn sàng.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: cho ngày thứ ba
  rationale: Giới từ לְ hướng sự chuẩn bị đến thời điểm được ấn định; “cho ngày thứ ba” giữ sắc thái này mà không biến nó đơn thuần thành hạn chót.
- source_word: כִּי
  choice: vì
  rationale: Từ này dẫn vào lý do của chỉ thị trước đó.
- source_word: יֵרֵד
  choice: sẽ ngự xuống
  rationale: ירד mô tả chuyển động đi xuống; “ngự xuống” là cách diễn đạt trang trọng, tự nhiên khi chủ thể là Đức Chúa Trời và vẫn giữ hình ảnh thần hiện.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng danh YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: לְעֵינֵי כָל הָעָם
  choice: trước mắt toàn dân
  rationale: Giữ hình ảnh cụ thể “trước mắt” của tiếng Hê-bơ-rơ và nói rõ sự kiện sẽ diễn ra công khai để toàn dân chứng kiến.
- source_word: עַל הַר סִינָי
  choice: trên núi Sinai
  rationale: עַל chỉ ngọn núi là nơi Yahweh ngự xuống; đây là cách nói tự nhiên và chính xác trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Bản văn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo tồn tư cách tên riêng và không thay danh ấy bằng một tước hiệu.
- issue: Sự hiện xuống của Yahweh
  choice: ngự xuống trên núi Sinai
  alternative: xuống núi Sinai; giáng xuống núi Sinai
  rationale: “Ngự xuống trên” giữ hướng chuyển động của ירד và địa điểm do עַל biểu thị, đồng thời tránh cách hiểu rằng Ngài đi từ trên núi xuống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “toàn dân” để diễn đạt gọn כָל הָעָם; giữ địa danh “Sinai” và danh riêng “Yahweh”. Không thêm chú thích vì câu Hê-bơ-rơ không có dị bản hay độ mơ hồ đáng kể cần trình bày ở đây; chú thích [a] trong lớp tham khảo tiếng Anh không tương ứng rõ với vị trí đánh dấu.
