  source_fidelity: 'Bản dịch phản ánh đúng mệnh lệnh có sắc thái chỉ thị trong וְהָיוּ נְכֹנִים: “Họ phải sẵn sàng.” “Cho ngày thứ ba” giữ được hướng chuẩn bị của לַיּוֹם; “vì vào ngày thứ ba” phản ánh đúng quan hệ nguyên nhân và thời điểm. “Yahweh sẽ ngự xuống trên núi Sinai trước mắt toàn dân” chuyển đạt đầy đủ יֵרֵד ... לְעֵינֵי כָל־הָעָם עַל־הַר סִינָי, không thêm bớt nội dung.'
