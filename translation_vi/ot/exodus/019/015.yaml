base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: vi
  text: 'Ông nói với dân chúng: “Hãy sẵn sàng trong ba ngày; đừng đến gần phụ nữ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đừng đến gần một người phụ nữ”; trong ngữ cảnh, đây là cách nói uyển chuyển, dặn họ kiêng quan hệ tình dục trong thời gian chuẩn bị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־הָעָם
  choice: Ông nói với dân chúng
  rationale: Động từ wayyiqtol tiếp nối mạch kể chuyện và đưa vào lời Môi-se. Tiếng Việt không cần lặp từ nối “và” để giữ trình thuật tự nhiên; đại từ “ông” dựa vào chủ thể đã rõ trong ngữ cảnh.
- source_word: הֱיוּ נְכֹנִים
  choice: Hãy sẵn sàng
  rationale: Kết cấu mệnh lệnh với נכון kêu gọi ở trong trạng thái sẵn sàng, phù hợp với việc chuẩn bị trước khi Đức Chúa Trời hiện đến.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: trong ba ngày
  rationale: Giữ cách diễn đạt thời gian có thể hiểu là khoảng thời gian chuẩn bị kéo dài ba ngày, thay vì đổi thành “cho ngày thứ ba,” vốn diễn giải cụ thể hơn cấu trúc Hê-bơ-rơ tại đây.
- source_word: אַל תִּגְּשׁוּ
  choice: đừng đến gần
  rationale: אַל với động từ biểu thị lệnh cấm; “đừng đến gần” là cách nói tự nhiên và giữ được động từ chỉ sự tiếp cận.
- source_word: אֶל־אִשָּׁה
  choice: phụ nữ
  rationale: Danh từ אִשָּׁה có thể nghĩa là “người phụ nữ” hoặc “người vợ.” Bản chính giữ cách nói uyển chuyển và không thêm động từ tình dục; chú thích nêu rõ hàm ý trong ngữ cảnh.
theological_decisions:
- issue: Có nên nói thẳng rằng lệnh cấm liên quan đến quan hệ tình dục trong thời gian chuẩn bị thánh hóa hay không
  choice: 'Giữ lối nói uyển chuyển của tiếng Hê-bơ-rơ trong bản chính: “đừng đến gần phụ nữ”'
  alternative: “đừng quan hệ tình dục với phụ nữ” hoặc “đừng đến gần vợ mình”
  rationale: Nguyên văn dùng một cách nói uyển chuyển chứ không dùng động từ tình dục trực tiếp. Giữ cách nói này bảo toàn sắc thái và độ căng của bản nguồn, còn chú thích giúp độc giả hiểu ý nghĩa theo ngữ cảnh mà không biến sự giải thích thành chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Dân chúng” diễn đạt tập thể Y-sơ-ra-ên tự nhiên trong tiếng Việt; “phụ nữ” giữ cách nói khái quát của nguyên văn. Dấu chú thích [a] được đặt ngay sau câu có cách nói cần giải thích.
