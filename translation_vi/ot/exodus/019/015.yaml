  source_fidelity: 'Bản dịch phản ánh đúng mệnh lệnh của Môi-se cho dân: hãy ở trong tình trạng sẵn sàng trong khoảng ba ngày và không được “đến gần” phụ nữ. Cách giữ lối nói uyển chuyển không diễn dịch quá mức động từ נגשׁ và danh từ số ít không xác định אִשָּׁה là phù hợp.'
