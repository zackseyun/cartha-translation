base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: vi
  text: Tiếng kèn vang lên càng lúc càng lớn[a]. Môi-se nói, còn Đức Chúa Trời đáp lời ông bằng tiếng nói[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “càng lúc càng vang lớn.” Tiếng Hê-bơ-rơ diễn tả tiếng kèn “cứ tiếp tục và trở nên rất mạnh.” “Kèn” cũng có thể được hiểu cụ thể là tù và, tức kèn làm bằng sừng.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nghĩa: “bằng/với tiếng nói.” Cũng có thể được hiểu là “bằng tiếng sấm” hoặc “thành tiếng.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: '[được diễn đạt qua sự tiếp diễn của cả mệnh đề]'
  rationale: Dạng tự sự của היה đưa diễn biến sang giai đoạn tiếp theo; tiếng Việt tự nhiên không cần dịch riêng là “và xảy ra,” mà thể hiện qua “càng lúc càng”.
- source_word: קוֹל הַשּׁוֹפָר
  choice: Tiếng tù và
  rationale: קוֹל trong kết cấu với שׁוֹפָר chỉ âm thanh; “tù và” là cách gọi tự nhiên, trang trọng cho loại kèn làm từ sừng.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: càng lúc càng vang mạnh hơn
  rationale: Diễn đạt sự tăng tiến liên tục. “Vang mạnh” giữ ý cường độ của חָזֵק mà không thu hẹp hoàn toàn thành độ lớn âm thanh.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: Môi-se cất lời
  rationale: Dạng chưa hoàn thành mô tả hành động đang diễn ra hoặc có tính tương ứng trong cảnh này; “cất lời” tự nhiên và trang trọng hơn “nói” trong ngữ cảnh thần hiện.
- source_word: וְהָאֱלֹהִים
  choice: và Đức Chúa Trời
  rationale: הָאֱלֹהִים là danh xưng xác định chỉ Đức Chúa Trời; cách gọi này rõ ràng, quen thuộc và trang trọng trong tiếng Việt.
- source_word: יַעֲנֶנּוּ
  choice: đáp lại ông
  rationale: ענה cùng hậu tố đại từ có nghĩa là đáp lời ông; “đáp lại” thể hiện sự tương ứng với lời Môi-se.
- source_word: בְּקוֹל
  choice: bằng tiếng phán
  rationale: Cụm từ theo nghĩa sát là “bằng/với một tiếng”; trong quan hệ với việc Đức Chúa Trời đáp, “tiếng phán” là tiếng Việt tự nhiên, đồng thời chân chú giữ các khả năng rộng hơn của קוֹל.
theological_decisions:
- issue: Bản chất lời đáp của Đức Chúa Trời tại Si-nai
  choice: Đức Chúa Trời đáp bằng tiếng phán
  alternative: Đức Chúa Trời đáp bằng tiếng sấm hoặc đáp thành tiếng
  rationale: בְּקוֹל không xác định rõ đó là sấm; bản chính giữ ý một tiếng có thể nghe được trong hành động đáp lời, còn chân chú bảo lưu độ rộng ngữ nghĩa và cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tù và” phù hợp bối cảnh Si-nai; “cất lời” và “tiếng phán” tạo sắc thái trang nghiêm mà không thêm nội dung ngoài văn bản. Tất cả dấu chân chú đều xuất hiện trong bản chính.
