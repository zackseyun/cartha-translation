language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: vi
  text: 'Môi-se thưa với Yahweh: “Dân chúng không thể lên núi Sinai, vì chính Ngài đã cảnh cáo chúng con[a] rằng: ‘Hãy lập ranh giới quanh núi và thánh hóa núi ấy.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã nghiêm trọng truyền bảo chúng con” hoặc “đã làm chứng với chúng con.” Động từ Hê-bơ-rơ có thể chỉ việc đưa ra lời cảnh báo hay lời chứng chính thức.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Hãy định giới hạn cho núi và dành riêng núi ấy làm thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: לֹא יוּכַל
  choice: không thể
  rationale: Diễn đạt sự không có khả năng trong ngữ cảnh, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ toàn thể dân Israel đang tụ họp; cách gọi này rõ ràng và tự nhiên.
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: lên núi Sinai
  rationale: Giữ nghĩa chuyển động đi lên của עלה và dùng địa danh quen thuộc trong tiếng Việt.
- source_word: כִּי
  choice: vì
  rationale: Giới thiệu lý do Môi-se đưa ra cho lời khẳng định trước đó.
- source_word: אַתָּה
  choice: chính Ngài
  rationale: Đại từ được nêu rõ trong tiếng Hê-bơ-rơ mang sắc thái nhấn mạnh; “chính Ngài” bảo toàn điểm nhấn ấy.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: đã cảnh cáo chúng con
  rationale: Dạng Hiphil của עוד tại đây chỉ việc chính thức cảnh báo hoặc nghiêm cấm; “cảnh cáo” phù hợp với lệnh cấm vượt ranh giới.
- source_word: לֵאמֹר
  choice: rằng
  rationale: Dẫn vào lời nói trực tiếp một cách tự nhiên trong tiếng Việt.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: Hãy lập ranh giới quanh núi
  rationale: Diễn đạt mệnh lệnh thiết lập giới hạn để ngăn dân đến gần hoặc vượt qua.
- source_word: וְקִדַּשְׁתּוֹ
  choice: và thánh hóa núi ấy
  rationale: Giữ ý nghĩa biệt riêng ngọn núi làm thánh; lặp “núi ấy” giúp đại từ chỉ vật rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: Giê-hô-va
  rationale: Nguyên văn dùng trực tiếp danh giao ước יהוה; phiên âm “Yahweh” bảo toàn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Sắc thái của הַעֵדֹתָה בָּנוּ
  choice: đã cảnh cáo chúng con
  alternative: đã nghiêm trọng truyền bảo chúng con / đã làm chứng với chúng con
  rationale: Trong bối cảnh ranh giới tại Sinai, động từ mang lực của lời cảnh báo chính thức; bản dịch chính không loại bỏ các sắc thái pháp lý hoặc chứng nhận nên ghi chúng ở chú thích.
- issue: Ý nghĩa của וְקִדַּשְׁתּוֹ
  choice: thánh hóa núi ấy
  alternative: biệt riêng núi ấy ra thánh
  rationale: Cả hai đều phản ánh hành động dành riêng cho sự thánh; “thánh hóa” gọn và trang trọng, còn cách diễn đạt đầy đủ hơn được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” cho lời Môi-se nói với Đức Chúa Trời, cùng cặp xưng hô “Ngài—chúng con” để thể hiện sự kính trọng. Các thuật ngữ liên quan đến ranh giới và sự thánh được dịch rõ nghĩa, không gắn với cách giải thích riêng của một hệ phái.
