base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: vi
  text: Môi-se từ trên núi xuống đến với dân chúng. Ông thánh hiến dân chúng[a], rồi họ giặt y phục của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thánh hóa dân chúng” hoặc “biệt riêng dân chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: xuống
  rationale: Động từ ירד chỉ sự di chuyển từ nơi cao xuống; “xuống” tự nhiên trong tiếng Việt và hướng di chuyển đã rõ nhờ cụm “từ trên núi”.
- source_word: מִן הָהָר
  choice: từ trên núi
  rationale: הַר trong ngữ cảnh là núi Si-nai; cách nói “từ trên núi xuống” tự nhiên và thể hiện rõ chuyển động đi xuống.
- source_word: אֶל הָעָם
  choice: với dân chúng
  rationale: עָם là dân chúng. Sau động từ chỉ chuyển động, “xuống với dân chúng” truyền đạt tự nhiên việc Môi-se trở lại nơi dân đang ở mà không xác định họ là một hội chúng theo nghĩa chuyên biệt.
- source_word: וַיְקַדֵּשׁ
  choice: biệt riêng họ ra thánh
  rationale: Dạng piel của קדשׁ ở đây nói đến việc chuẩn bị và biệt riêng dân chúng cho cuộc gặp gỡ với Đức Chúa Trời. Cách dịch này giữ cả ý biệt riêng lẫn chiều kích thánh, thay vì ngụ ý một sự biến đổi đạo đức trừu tượng.
- source_word: הָעָם
  choice: họ
  rationale: Đại từ “họ” quy chiếu rõ về “dân chúng” vừa nêu và tránh lặp nặng nề trong tiếng Việt, dù tiếng Hê-bơ-rơ lặp lại danh từ.
- source_word: וַיְכַבְּסוּ
  choice: họ giặt
  rationale: כבס chỉ việc giặt vật bằng vải, đặc biệt là quần áo; “giặt” chính xác và tự nhiên hơn “rửa” trong tiếng Việt.
- source_word: שִׂמְלֹתָם
  choice: y phục mình
  rationale: שִׂמְלָה chỉ quần áo hoặc y phục. “Y phục” giữ sắc thái trang trọng vừa phải của bối cảnh chuẩn bị nghi lễ; “mình” diễn đạt sở hữu phản thân tự nhiên.
theological_decisions:
- issue: Ngôn ngữ về sự thánh hóa trong việc chuẩn bị cho Đức Chúa Trời hiện ra tại Si-nai
  choice: biệt riêng họ ra thánh
  alternative: thánh hóa dân chúng; làm cho dân chúng nên thánh
  rationale: Câu này mô tả việc chuẩn bị mang tính nghi lễ và biệt riêng dân chúng để gặp Đức Chúa Trời. Cách dịch được chọn bảo toàn ý thánh và ý biệt riêng, nhưng không mặc nhiên biến hành động này thành sự biến đổi đạo đức hay một phạm trù giáo lý về sau.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Môi-se” theo lối phiên âm Kinh Thánh quen thuộc; giữ nhịp kể tuần tự của nguyên văn. Dấu [a] được đặt ngay sau cụm từ cần chú thích.
