source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיֹ֣ת הַ/בֹּ֗קֶר וַ/יְהִי֩ קֹלֹ֨ת וּ/בְרָקִ֜ים וְ/עָנָ֤ן כָּבֵד֙ עַל הָ/הָ֔ר וְ/קֹ֥ל שֹׁפָ֖ר חָזָ֣ק מְאֹ֑ד וַ/יֶּחֱרַ֥ד כָּל הָ/עָ֖ם אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: vi
  text: Vào ngày thứ ba, khi trời sáng, có tiếng sấm[a], chớp, và một đám mây dày đặc trên núi; lại có tiếng tù và[b] vang rất lớn[c]. Toàn dân trong trại đều run rẩy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những tiếng” hoặc “những giọng nói”; từ Hê-bơ-rơ có thể mang các nghĩa ấy, nhưng ở đây, khi đi cùng với chớp, rất có thể nó chỉ tiếng sấm.
    reason: lexical_alternative
  - marker: b
    text: Tù và ở đây là shofar, một loại kèn thường được làm từ sừng động vật.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn là “rất mạnh”; trong văn cảnh, cụm từ này diễn tả cường độ của tiếng tù và.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: Đến ngày thứ ba
  rationale: Diễn đạt tự nhiên bằng tiếng Việt sự chuyển tiếp trần thuật và mốc thời gian; không cần dịch וַיְהִי một cách máy móc là “và xảy ra”.
- source_word: בִּהְיֹת הַבֹּקֶר
  choice: khi trời vừa sáng
  rationale: Cụm nguyên mẫu có chức năng chỉ thời gian; cách dịch này tự nhiên và giữ ý buổi sáng bắt đầu.
- source_word: קֹלֹת
  choice: tiếng sấm
  rationale: קוֹל có thể chỉ tiếng, âm thanh hoặc giọng nói; khi đi đôi với chớp trong cảnh hiển hiện tại Si-nai, nghĩa phù hợp nhất là tiếng sấm.
- source_word: וּבְרָקִים
  choice: chớp
  rationale: Danh từ số nhiều chỉ những tia hoặc ánh chớp; tiếng Việt thường dùng danh từ khối “chớp” tự nhiên hơn là đánh dấu số nhiều.
- source_word: עָנָן כָּבֵד
  choice: một đám mây dày đặc
  rationale: כָּבֵד nghĩa đen là “nặng”; khi bổ nghĩa cho mây, nó diễn tả độ dày và đặc. “Dày đặc” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: עַל הָהָר
  choice: trên núi
  rationale: Giữ quan hệ không gian của עַל mà không xác định quá mức là mây ở ngay trên bề mặt hay bao phủ phía trên núi.
- source_word: קֹל שֹׁפָר
  choice: tiếng tù và
  rationale: שׁוֹפָר là loại kèn làm từ sừng động vật. “Tù và” vừa dễ hiểu, vừa cụ thể hơn “kèn” và không nhất thiết giới hạn vật liệu là sừng cừu đực.
- source_word: חָזָק מְאֹד
  choice: vang rất lớn
  rationale: Nghĩa đen là “rất mạnh”; dùng cho âm thanh, tiếng Việt tự nhiên diễn đạt cường độ bằng “vang rất lớn”.
- source_word: וַיֶּחֱרַד
  choice: run rẩy
  rationale: Động từ diễn tả sự rung, run vì sợ hãi hoặc chấn động; “run rẩy” giữ cả biểu hiện thể chất lẫn sắc thái kinh hãi mà không giải thích quá mức.
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: Toàn dân trong trại
  rationale: Chuyển mệnh đề quan hệ tiếng Hê-bơ-rơ thành cụm từ tự nhiên, gọn rõ trong tiếng Việt mà không mất nội dung.
theological_decisions:
- issue: Các hiện tượng trong cuộc thần hiện tại Si-nai
  choice: Mô tả trực tiếp các hiện tượng cảm nhận được, dịch קֹלֹת là “tiếng sấm” nhưng ghi chú phạm vi nghĩa rộng hơn.
  alternative: Dịch קֹלֹת là “những tiếng” hoặc “những giọng nói”, có thể gợi đến tiếng nói từ trời.
  rationale: Văn cảnh ghép từ này với chớp nên “tiếng sấm” là nghĩa có khả năng cao nhất. Bản dịch không thêm cách giải thích thần học về nguồn gốc hay ý nghĩa của các hiện tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “tù và” để giữ màu sắc cổ truyền của nhạc cụ mà người đọc phổ thông vẫn hiểu được; nhịp câu tái hiện chuỗi hiện tượng dồn dập trong nguyên văn.
