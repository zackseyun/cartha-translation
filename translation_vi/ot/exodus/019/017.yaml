base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: vi
  text: Môi-se đưa dân chúng ra khỏi trại để gặp Đức Chúa Trời; họ đứng tại chân núi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở phần thấp của núi.” Cụm từ Hê-bơ-rơ chỉ phần dưới, tức phần chân núi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: đưa … ra
  rationale: Thể Hiphil của יצא mang nghĩa khiến cho đi ra. “Đưa … ra” vừa giữ sắc thái gây khiến vừa tự nhiên trong tiếng Việt, không thêm ý dẫn đường quá mức.
- source_word: לִקְרַאת
  choice: để gặp
  rationale: Cấu trúc này diễn tả chuyển động hướng đến một cuộc gặp. “Để gặp” tự nhiên và giữ đúng mục đích của việc ra khỏi trại.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh cuộc thần hiện tại Si-nai, từ này chỉ Đức Chúa Trời; cách gọi này trang trọng, rõ nghĩa và thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: מִן הַמַּחֲנֶה
  choice: ra khỏi trại
  rationale: Cụm từ nêu nơi dân chúng rời đi. “Ra khỏi trại” diễn đạt tự nhiên cả hướng chuyển động lẫn điểm xuất phát.
- source_word: וַיִּתְיַצְּבוּ
  choice: họ đứng vào vị trí
  rationale: Thể Hitpael của יצב gợi hành động chủ động đứng vào chỗ hoặc giữ vị trí, trang trọng hơn nghĩa đơn thuần “đứng”.
- source_word: בְּתַחְתִּית
  choice: dưới chân
  rationale: Khi nói về núi, từ này thường chỉ phần thấp hoặc chân núi. “Dưới chân núi” là cách diễn đạt tự nhiên, đồng thời không khẳng định rằng dân chúng ở ngay bên dưới một vật nhô ra.
- source_word: הָהָר
  choice: núi
  rationale: Trong ngữ cảnh Si-nai, הַר là ngọn núi đã được xác định trong mạch văn; tiếng Việt không cần thêm từ chỉ định ở đây.
theological_decisions:
- issue: Cách dịch הָאֱלֹהִים trong cuộc thần hiện tại Si-nai
  choice: Đức Chúa Trời
  alternative: Thiên Chúa
  rationale: Bản văn nói đến Đấng mà dân chúng ra gặp tại Si-nai. “Đức Chúa Trời” truyền đạt trực tiếp đối tượng quy chiếu mà không bổ sung cách giải thích giáo phái hoặc giải quyết thêm bất kỳ vấn đề thần học nào.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “dân chúng” để chỉ tập thể, dấu chấm phẩy để liên kết hai hành động liên tiếp. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
