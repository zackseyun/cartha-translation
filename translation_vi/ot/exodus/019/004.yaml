revisions:
- from: Chính các ngươi đã thấy điều Ta làm với Ai Cập, và cách Ta mang các ngươi trên cánh chim đại bàng[a][b], rồi đưa các ngươi đến với Ta[c].
  to: Chính các ngươi đã thấy điều Ta đã làm cho Ai Cập, cách Ta chở các ngươi trên cánh đại bàng[a][b] và đưa các ngươi đến với Ta[c].
  rationale: Sửa “làm với Ai Cập” thành “đã làm cho Ai Cập” để diễn đạt tự nhiên và rõ hơn hướng tác động của nguyên ngữ. Đổi “mang” thành “chở” và “cánh chim đại bàng” thành “cánh đại bàng” để hình ảnh ẩn dụ trong tiếng Việt gọn, tự nhiên hơn. Các chú thích được giữ đúng vị trí và điều chỉnh tối thiểu cho phù hợp với bản văn sửa.
  reviewer_model: gpt-5.6-terra
