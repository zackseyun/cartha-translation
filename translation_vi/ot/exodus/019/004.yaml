base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: vi
  text: Chính các ngươi đã thấy điều Ta đã làm cho Ai Cập, cách Ta chở các ngươi trên cánh đại bàng[a][b] và đưa các ngươi đến với Ta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên những cánh của đại bàng.” Cách nói Hê-bơ-rơ là một ẩn dụ sống động về sự giải cứu đầy quyền năng và che chở.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ được dịch là “đại bàng” cũng có thể chỉ rộng hơn các loài chim săn mồi lớn.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch sát hơn: “đưa các ngươi đến Ta.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם
  choice: Chính các ngươi
  rationale: Đại từ độc lập tạo sắc thái nhấn mạnh bên cạnh hình thái ngôi thứ hai số nhiều trong động từ; “Chính các ngươi” diễn đạt tự nhiên ý nhấn mạnh ấy.
- source_word: רְאִיתֶם
  choice: đã thấy
  rationale: Thể qatal chỉ kinh nghiệm đã hoàn tất của Israel; tiếng Việt dùng “đã thấy” vừa tự nhiên vừa giữ được tính xác thực trực tiếp của kinh nghiệm đó.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: điều Ta làm với Ai Cập
  rationale: Giới từ לְ ở đây chỉ đối tượng chịu tác động. “Với Ai Cập” giữ Ai Cập theo nghĩa tập thể/quốc gia và tránh cách hiểu ban ơn “cho Ai Cập”.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: Ta mang các ngươi
  rationale: נשא có nghĩa cơ bản là mang, chở hoặc nâng đỡ. “Mang” phù hợp với hình ảnh che chở và giải cứu trong câu.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: trên cánh chim đại bàng
  rationale: Cụm từ là một ẩn dụ sống động về sự giải cứu mạnh mẽ, mau chóng và có tính che chở. “Chim đại bàng” là cách hiểu truyền thống và phù hợp ngữ cảnh, dù נֶשֶׁר có thể chỉ rộng hơn một loài chim săn mồi lớn.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: rồi đưa các ngươi đến với Ta
  rationale: אֵלָי có nghĩa trực tiếp là “đến Ta”. “Đến với Ta” tự nhiên trong tiếng Việt, đồng thời gợi đúng chiều kích quan hệ mà không thêm nội dung ngoài nguyên văn.
theological_decisions:
- issue: Chiều kích quan hệ của sự giải cứu do Đức Chúa Trời thực hiện
  choice: đưa các ngươi đến với Ta
  alternative: đem các ngươi đến Ta
  rationale: Câu này trình bày cuộc xuất hành không chỉ là thoát khỏi Ai Cập mà còn là được đưa đến gần Đức Chúa Trời để bước vào quan hệ giao ước. “Đến với Ta” giữ sắc thái quan hệ nhưng không diễn giải quá mức.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Ta/các ngươi” để thể hiện lời Đức Chúa Trời trực tiếp phán với toàn thể Israel; tránh từ cổ khó hiểu. Trật tự chú thích được đặt ngay sau các cụm từ liên quan.
