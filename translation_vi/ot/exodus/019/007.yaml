- from: Vậy, Môi-se trở về, triệu tập các trưởng lão của dân chúng và trình bày trước họ mọi lời ấy mà Yahweh đã truyền cho ông.
  to: Môi-se đến, gọi các trưởng lão của dân, rồi đặt trước mặt họ mọi lời này mà Yahweh đã truyền cho ông.
  rationale: Bản sửa giảm các diễn giải không cần thiết về hướng đi và mức độ quyền lực của hành động gọi, đồng thời bảo toàn chỉ định từ trong “mọi lời này.” “Đặt trước mặt họ” phản ánh trực tiếp idiom שׂים לִפְנֵיהֶם mà vẫn rõ nghĩa trong tiếng Việt hiện đại.
