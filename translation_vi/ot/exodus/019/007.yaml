base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: vi
  text: Môi-se đến, gọi các trưởng lão của dân, rồi đặt trước mặt họ mọi lời này mà Yahweh đã truyền cho ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: trở về
  rationale: בוא có thể là “đến” hoặc “đi” tùy điểm nhìn. Trong mạch kể, Môi-se từ nơi gặp Yahweh trở lại với dân, nên “trở về” diễn đạt tự nhiên hướng chuyển động mà không thêm địa điểm.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: triệu tập các trưởng lão của dân chúng
  rationale: קרא với ל có thể chỉ việc gọi đến hoặc triệu tập. Ngữ cảnh cho thấy Môi-se tập hợp các đại diện để truyền đạt sứ điệp; “triệu tập” rõ nghĩa và phù hợp văn phong tiếng Việt.
- source_word: זִקְנֵי הָעָם
  choice: các trưởng lão của dân chúng
  rationale: זְקֵנִים chỉ những bậc cao niên được nhìn nhận là đại diện có thẩm quyền. “Trưởng lão” giữ được sắc thái xã hội-chính trị của từ nguồn.
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: trình bày trước họ
  rationale: Thành ngữ שׂים לפני theo nghĩa đen là “đặt trước mặt”; khi đối tượng là lời truyền, “trình bày trước họ” tự nhiên trong tiếng Việt mà vẫn giữ ý đưa toàn bộ nội dung ra trước các trưởng lão.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: mọi lời ấy
  rationale: דְּבָרִים có thể là lời nói, sự việc hoặc điều. Ở đây Môi-se đang chuyển đạt thông điệp đã nhận từ Yahweh, nên “mọi lời ấy” phù hợp nhất với ngữ cảnh.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: mà Yahweh đã truyền cho ông
  rationale: צוה biểu thị mệnh lệnh có thẩm quyền; “đã truyền” vừa trang trọng vừa tự nhiên. “Đã” thể hiện mệnh lệnh xảy ra trước hành động Môi-se trình bày.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị trực tiếp bằng Tứ Tự YHWH, thay vì thay thế bằng một tước hiệu.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ Tự; “Yahweh” bảo tồn chức năng tên riêng và không thay tên bằng tước hiệu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Môi-se” theo dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt; cấu trúc câu giữ trình tự hành động của nguyên văn. Không cần chú thích vì các phương án đã chọn không làm mất một sự nhập nhằng thiết yếu đối với việc hiểu câu.
