source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Hãy xuống cảnh báo dân chúng, kẻo họ vượt qua ranh giới để đến gần Yahweh để nhìn[a], rồi nhiều người trong số họ ngã xuống[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thấy.” Động từ Hê-bơ-rơ có thể mang nghĩa “nhìn” hoặc “thấy”; tại đây nói đến việc cố nhìn sự hiện diện của Yahweh.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “rồi nhiều người từ trong họ ngã xuống.” Trong văn cảnh này, “ngã xuống” có thể hàm ý chết, nhưng tiếng Hê-bơ-rơ không nói rõ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Chuyển tự danh riêng của Đức Chúa Trời, giữ nguyên chức năng của danh giao ước thay vì thay bằng một tước hiệu.
- source_word: רֵד
  choice: Hãy xuống
  rationale: Mệnh lệnh của ירד, diễn đạt tự nhiên và giữ rõ hướng di chuyển từ trên núi xuống.
- source_word: הָעֵד בָּעָם
  choice: cảnh báo dân chúng
  rationale: Dạng Hifil của עוד trong văn cảnh này mang nghĩa cảnh cáo hoặc nghiêm truyền; “cảnh báo” rõ ràng và tự nhiên.
- source_word: יֶהֶרְסוּ
  choice: vượt qua ranh giới
  rationale: Động từ diễn tả việc phá qua giới hạn đã được đặt quanh núi; bản dịch nêu rõ ý theo văn cảnh mà không hàm ý họ phá hủy một vật thể.
- source_word: אֶל יְהוָה
  choice: để đến gần Yahweh
  rationale: Giới từ אֶל chỉ hướng tiến về phía sự hiện diện của Yahweh; “đến gần” diễn đạt tự nhiên hành vi bị cấm trong văn cảnh.
- source_word: לִרְאוֹת
  choice: mà nhìn
  rationale: Động từ ראה có thể là “nhìn” hoặc “thấy”; “nhìn” phù hợp với ý định cố nhìn sự hiện hiện của Yahweh và vẫn giữ sắc thái hành động.
- source_word: וְנָפַל מִמֶּנּוּ רָב
  choice: rồi nhiều người trong số họ ngã xuống
  rationale: Giữ động từ khái quát “ngã xuống” của nguyên văn, không diễn giải thẳng thành “chết,” dù trong văn cảnh hậu quả ấy có thể được hàm ý.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; chuyển tự “Yahweh” bảo tồn danh ấy thay vì thay thế bằng một tước hiệu.
- issue: Hậu quả được diễn tả bằng נפל
  choice: ngã xuống
  alternative: chết / bị giết
  rationale: Trong văn cảnh phán xét, động từ có thể hàm ý tử vong, nhưng nguyên văn không nói rõ hơn; giữ “ngã xuống” bảo toàn sự dè dặt và căng thẳng của câu Hê-bơ-rơ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Dùng “phán” cho lời của Yahweh; “dân chúng” chỉ cộng đồng Israel. Cụm “vượt qua ranh giới” làm rõ giới hạn quanh núi từ văn cảnh gần, đồng thời không diễn giải hậu quả vượt quá nguyên văn.
