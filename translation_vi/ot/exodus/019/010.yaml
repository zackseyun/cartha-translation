base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: vi
  text: 'Bấy giờ Yahweh phán với Môi-se: “Hãy đi đến với dân, thánh hóa họ hôm nay và ngày mai; họ phải giặt y phục của họ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Bấy giờ, ... phán
  rationale: Dạng waw liên tiếp đưa trình thuật tiến tới; “Bấy giờ” diễn đạt tự nhiên tính kế tiếp, còn “phán” phù hợp với lời Đức Chúa Trời trong văn phong trang trọng.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: לֵךְ אֶל־הָעָם
  choice: Hãy đến với dân chúng
  rationale: Diễn đạt mệnh lệnh đi đến chỗ cộng đồng Israel bằng tiếng Việt tự nhiên, không thêm ý ngoài nguyên văn.
- source_word: וְקִדַּשְׁתָּם
  choice: biệt riêng họ ra thánh
  rationale: Thể Piel của קדשׁ ở đây chỉ việc chuẩn bị và dành riêng dân chúng trong tình trạng thánh để gặp Đức Chúa Trời. Cách dịch này giữ sắc thái nghi lễ mà không giới hạn vào sự biến đổi đạo đức nội tâm.
- source_word: הַיּוֹם וּמָחָר
  choice: hôm nay và ngày mai
  rationale: Diễn đạt trực tiếp và tự nhiên khoảng chuẩn bị gồm hai ngày.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: họ phải giặt y phục mình
  rationale: Động từ số nhiều chuyển chủ thể sang dân chúng và mang lực mệnh lệnh trong ngữ cảnh. “Y phục” giữ sắc thái trang trọng của שִׂמְלָה mà vẫn dễ hiểu.
theological_decisions:
- issue: Ý nghĩa nghi lễ của קדשׁ
  choice: biệt riêng họ ra thánh
  alternative: thánh hóa họ; hiến thánh họ
  rationale: Ngữ cảnh là sự chuẩn bị của dân Israel để gặp Yahweh tại Sinai. Cách dịch đã chọn giữ cả ý dành riêng và tính thánh, nhưng không mặc nhiên hiểu đây chỉ là sự đổi mới đạo đức bên trong.
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; phiên âm “Yahweh” bảo tồn danh ấy thay vì thay bằng tước hiệu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo hình thức tên quen thuộc; giữ “Yahweh” là danh riêng. Dấu chấm phẩy giúp làm rõ sự chuyển từ mệnh lệnh dành cho Môi-se sang việc dân chúng phải thực hiện.
