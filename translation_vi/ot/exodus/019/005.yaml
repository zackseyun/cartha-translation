source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: vi
  text: Vậy bây giờ, nếu các ngươi thật sự lắng nghe tiếng Ta và giữ giao ước của Ta, thì giữa mọi dân, các ngươi sẽ là tài sản quý báu riêng của Ta[a], vì cả trái đất đều thuộc về Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sở hữu đặc biệt của Ta” hoặc “sở hữu riêng của Ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Vậy bây giờ
  rationale: Giữ cả ý nối kết với lời trước và sắc thái chuyển sang hệ quả giao ước.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: thật sự lắng nghe tiếng ta
  rationale: Cấu trúc nguyên thể tuyệt đối đi với động từ hữu hạn có tác dụng nhấn mạnh. “Lắng nghe” giữ hình ảnh cụ thể của tiếng Hê-bơ-rơ, đồng thời trong ngữ cảnh giao ước hàm ý nghe theo.
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: và giữ giao ước của ta
  rationale: “Giữ” diễn đạt tự nhiên nghĩa trung thành tuân giữ trong ngữ cảnh giao ước.
- source_word: סְגֻלָּה
  choice: báu vật riêng
  rationale: Từ này chỉ tài sản đặc biệt, quý giá thuộc riêng về một chủ; cách dịch truyền đạt cả giá trị lẫn sự thuộc về.
- source_word: מִכָּל־הָעַמִּים
  choice: giữa muôn dân
  rationale: Diễn đạt sự tuyển chọn từ giữa mọi dân mà không hàm ý Đức Chúa Trời không sở hữu các dân khác.
- source_word: כִּי־לִי כָּל־הָאָרֶץ
  choice: vì cả trái đất đều thuộc về ta
  rationale: כִּי nêu lý do, còn הָאָרֶץ mang nghĩa phổ quát ở đây vì mệnh đề liên hệ đến mọi dân.
theological_decisions:
- issue: Nên dịch שׁמע là “lắng nghe” hay “vâng lời” trong bối cảnh giao ước
  choice: thật sự lắng nghe tiếng ta
  alternative: thật sự vâng lời ta
  rationale: Ngữ thức Hê-bơ-rơ bao hàm sự nghe theo, nhưng bản văn trực tiếp dùng hình ảnh nghe tiếng. Giữ “lắng nghe” bảo tồn hình ảnh ấy, còn “giữ giao ước” làm rõ chiều kích vâng phục.
- issue: Cách diễn đạt địa vị סְגֻלָּה của Israel mà không phóng đại tính loại trừ
  choice: giữa muôn dân, các ngươi sẽ là báu vật riêng của ta
  alternative: các ngươi sẽ là báu vật riêng của ta hơn mọi dân
  rationale: “Giữa muôn dân” khẳng định địa vị giao ước đặc biệt, trong khi mệnh đề kế tiếp vẫn bảo toàn quyền sở hữu phổ quát của Đức Chúa Trời đối với cả trái đất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta/các ngươi” phù hợp lời phán trực tiếp có thẩm quyền trong ngữ cảnh Xuất Ai Cập, nhưng không dùng từ cổ khó hiểu. Trật tự “giữa muôn dân” được đưa lên trước để câu tiếng Việt tự nhiên và làm rõ phạm vi tuyển chọn.
