base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: vi
  text: Yahweh ngự xuống trên núi Si-nai, tại đỉnh núi.[a] Rồi Yahweh gọi Môi-se lên đỉnh núi,[b] và Môi-se đi lên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Yahweh ngự xuống trên núi Si-nai, đến đỉnh núi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen tiếng Hê-bơ-rơ: “đầu núi,” tức “đỉnh núi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ngự xuống
  rationale: Động từ ירד có nghĩa là đi xuống/ngự xuống. Trong ngữ cảnh Đức Chúa Trời hiện đến trên núi, “ngự xuống” vừa tự nhiên, trang trọng, vừa giữ rõ chuyển động hướng xuống.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng giao ước được biểu thị bằng Tứ tự YHWH, thay vì thay bằng một tước hiệu.
- source_word: הַר סִינַי
  choice: núi Si-nai
  rationale: Cách gọi địa danh quen thuộc, tự nhiên trong tiếng Việt hiện đại.
- source_word: אֶל רֹאשׁ הָהָר
  choice: nơi đỉnh núi / lên đỉnh núi
  rationale: רֹאשׁ nghĩa đen là “đầu”, nhưng trong địa hình chỉ đỉnh núi. Giới từ được diễn đạt theo quan hệ và chuyển động của từng mệnh đề để câu tiếng Việt tự nhiên.
- source_word: וַיִּקְרָא
  choice: gọi
  rationale: קרא ở đây là gọi một người đến; “gọi” trực tiếp hơn “triệu” và không thêm sắc thái diễn giải không cần thiết.
- source_word: לְמֹשֶׁה
  choice: Môi-se
  rationale: Phiên âm tên riêng theo dạng quen dùng trong tiếng Việt.
- source_word: וַיַּעַל
  choice: đi lên
  rationale: עלה chỉ chuyển động đi lên, tương phản trực tiếp với “ngự xuống” ở đầu câu.
theological_decisions:
- issue: Cách chuyển dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA / Giê-hô-va
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Tứ tự là tên riêng của Đức Chúa Trời; phiên âm “Yahweh” bảo tồn chức năng tên riêng và tránh thay nó bằng một tước hiệu.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. “Ngự xuống” phù hợp với chủ thể thần linh; “đi lên” giữ lối diễn đạt giản dị của câu Hê-bơ-rơ. Không thêm chú thích vì các cách diễn đạt đều truyền đạt đầy đủ ý nghĩa nguồn và không có dị bản hay độ mơ hồ đáng kể cần ghi nhận.
