  rationale: Chỉnh nhẹ cụm chỉ nơi chốn trong mệnh đề đầu để tiếng Việt tự nhiên hơn và giữ quan hệ không gian của nguyên văn. Bổ sung chú thích tương ứng với audit trail để ghi nhận nghĩa đen của רֹאשׁ và cách diễn đạt thay thế của mệnh đề đầu. Không thay đổi nội dung, tên riêng, hay sắc thái tự sự của câu.
