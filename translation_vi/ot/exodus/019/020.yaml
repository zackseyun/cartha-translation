    rationale: Tiếng Hê-bơ-rơ nêu Yahweh ngự xuống trên núi Si-nai, đến/tại đỉnh núi. Đổi thành “tại đỉnh núi” làm câu trôi chảy hơn mà không giải quyết quá mức sắc thái giới từ.
  - severity: low
    issue: Bản dịch chưa giữ các neo chú thích từ audit trail tiếng Anh cho cụm “đỉnh núi.”
