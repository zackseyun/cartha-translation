  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו יְהוָה֙ לֶךְ רֵ֔ד וְ/עָלִ֥יתָ אַתָּ֖ה וְ/אַהֲרֹ֣ן עִמָּ֑/ךְ וְ/הַ/כֹּהֲנִ֣ים וְ/הָ/עָ֗ם אַל יֶֽהֶרְס֛וּ לַ/עֲלֹ֥ת אֶל יְהוָ֖ה פֶּן יִפְרָץ בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: vi
  text: 'Yahweh phán với ông: “Hãy xuống; rồi ông và A-rôn cùng lên. Nhưng các tư tế và dân chúng không được xông vào để lên gặp Yahweh, kẻo Ngài phá ra đánh phạt họ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “không được xông vào … kẻo Ngài phá ra chống lại họ.” Tiếng Hê-bơ-rơ dùng hai động từ có hình ảnh tương ứng: dân chúng xông vào để xâm phạm, còn Yahweh phá ra để xét phạt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu; cách này giữ nguyên chức năng của Danh trong bản Hê-bơ-rơ.
- source_word: לֶךְ רֵד
  choice: Hãy xuống
  rationale: Hai mệnh lệnh kết hợp thành lời truyền bảo khẩn thiết; tiếng Việt tự nhiên không cần dịch riêng động từ לֶךְ.
- source_word: וְעָלִיתָ
  choice: rồi hãy lên lại
  rationale: Dạng hoàn thành mang giá trị mệnh lệnh trong chuỗi này; “lên lại” làm rõ Môi-se sẽ trở lên núi sau khi xuống.
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: ngươi và A-rôn cùng đi
  rationale: Giữ sự nhấn mạnh vào Môi-se và ý A-rôn đi cùng ông, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: các tư tế và dân chúng
  rationale: Phân biệt nhóm tư tế với toàn dân bằng các từ thông dụng, trang trọng và rõ nghĩa.
- source_word: אַל יֶהֶרְסוּ
  choice: không được xông qua
  rationale: Giữ hình ảnh vượt qua một giới hạn bằng sức mạnh mà không thêm danh từ “ranh giới,” vốn không có trực tiếp trong câu Hê-bơ-rơ.
- source_word: לַעֲלֹת אֶל יְהוָה
  choice: để đi lên đến Yahweh
  rationale: Bảo toàn cả hướng chuyển động lên cao và đích đến là sự hiện diện của Yahweh.
- source_word: פֶּן יִפְרָץ בָּם
  choice: kẻo Ngài xông ra chống lại họ
  rationale: Diễn tả sự bùng phát đột ngột của phán xét và duy trì sự cộng hưởng hình ảnh với hành động “xông qua” của dân chúng.
theological_decisions:
- issue: Cách dịch Danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Giữ đây là danh riêng trong nguyên văn, không biến nó thành một tước hiệu và không áp đặt cách giải thích hệ phái.
- issue: Chủ ngữ ngầm của יִפְרָץ
  choice: Ngài, tức Yahweh
  alternative: không nêu chủ ngữ rõ trong tiếng Việt
  rationale: Hình thái động từ số ít giống đực và ngữ cảnh gần nhất chỉ về Yahweh; viết “Ngài” giúp câu tiếng Việt rõ mà không bổ sung một tác nhân khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” được giữ trong lời phán trực tiếp để thể hiện ngôi thứ hai số ít có nhấn mạnh, còn “ông” dùng trong lời dẫn để chỉ Môi-se. Dấu chú thích đặt sau toàn câu vì giải thích sự tương ứng giữa hai cụm từ trong cùng lời cảnh báo.
