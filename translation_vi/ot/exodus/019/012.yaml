- from: 'Con hãy lập ranh giới chung quanh dân chúng và bảo họ: “Hãy cẩn thận, đừng lên núi hoặc chạm đến chân núi. Bất cứ ai chạm vào núi chắc chắn sẽ bị xử tử.”[a]'
  to: 'Hãy lập ranh giới bao quanh dân chúng và bảo họ: “Hãy cẩn thận, đừng lên núi hoặc chạm đến rìa núi. Bất cứ ai chạm vào núi chắc chắn sẽ bị xử tử.”[a]'
  rationale: Sửa “chân núi” thành “rìa núi” để phản ánh chính xác hơn từ קָצֵהוּ mà không áp đặt một vị trí địa hình cụ thể. Bỏ “Con” để giữ lối xưng hô trung tính, hiện đại và không thêm sắc thái ngoài nguyên văn. Các phần còn lại được giữ vì phù hợp với cú pháp, sắc thái nhấn mạnh và ngữ cảnh của tiếng Hê-bơ-rơ.
