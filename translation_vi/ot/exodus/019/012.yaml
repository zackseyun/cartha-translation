base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: vi
  text: 'Hãy lập ranh giới bao quanh dân chúng và bảo họ: “Hãy cẩn thận, đừng lên núi hoặc chạm đến rìa núi. Bất cứ ai chạm vào núi chắc chắn sẽ bị xử tử.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chắc chắn sẽ chết.” Cụm từ Hê-bơ-rơ là một công thức nhấn mạnh về cái chết; ở đây dịch là “chắc chắn sẽ bị xử tử” để phản ánh thể bị động và việc thi hành án được nói đến ngay trong câu tiếp theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: Con hãy lập ranh giới
  rationale: Dạng Hiphil của גבל diễn tả việc ấn định giới hạn; “lập ranh giới” tự nhiên và giữ được hình ảnh một đường giới hạn quanh khu vực cấm.
- source_word: אֶת־הָעָם סָבִיב
  choice: chung quanh dân chúng
  rationale: סָבִיב bổ nghĩa cho hành động lập ranh giới, cho thấy dân chúng phải được bao quanh bởi một giới hạn.
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Hãy cẩn thận
  rationale: Thành ngữ gồm dạng Niphal mệnh lệnh của שׁמר với לָכֶם mang nghĩa tự giữ mình, đề phòng; “hãy cẩn thận” truyền đạt tự nhiên sức cảnh báo.
- source_word: עֲלוֹת בָּהָר
  choice: đừng lên núi
  rationale: Cấu trúc được hiểu trong phạm vi lời cảnh báo, nên tiếng Việt cần diễn đạt lệnh cấm rõ ràng; “lên núi” giữ nghĩa thông thường của עלה với ב.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: hoặc chạm đến chân núi
  rationale: קָצֶה là phần ngoài cùng hay rìa; trong địa hình núi và bối cảnh dân đứng phía dưới, “chân núi” diễn đạt tự nhiên phần rìa ngoài mà họ không được chạm đến.
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: Bất cứ ai chạm vào núi
  rationale: Cấu trúc כָּל với phân từ mang ý nghĩa khái quát và phân phối; “bất cứ ai” thể hiện phạm vi không ngoại lệ.
- source_word: מוֹת יוּמָת
  choice: chắc chắn sẽ bị xử tử
  rationale: Nguyên mẫu tuyệt đối מוֹת nhấn mạnh tính chắc chắn, còn יוּמָת là dạng Hophal bị động, chỉ việc người ấy bị giết; cách dịch này giữ cả sắc thái nhấn mạnh lẫn thể bị động.
theological_decisions:
- issue: מוֹת יוּמָת có thể được diễn đạt là chết hay bị xử tử
  choice: chắc chắn sẽ bị xử tử
  alternative: chắc chắn sẽ chết
  rationale: Dạng động từ יוּמָת là bị động gây khiến, và câu kế tiếp quy định cách cộng đồng thi hành án; vì vậy “bị xử tử” phản ánh sát hơn hình thái và ngữ cảnh, trong khi chú thích bảo lưu cách hiểu rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Con” vì đây là lời Đức Chúa Trời phán trực tiếp với Môi-se trong ngữ cảnh gần. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
