id: EXO.19.18
reference: Exodus 19:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: vi
  text: Núi Si-nai hoàn toàn chìm trong khói, vì Yahweh đã ngự xuống trên núi ấy trong lửa. Khói từ núi bốc lên như khói của một lò nung[a], và cả ngọn núi rung chuyển dữ dội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lò luyện.”'
    reason: Danh từ כִּבְשָׁן có phạm vi nghĩa gồm lò nung và lò luyện.
lexical_decisions:
- source_word: וְהַר סִינַי עָשַׁן כֻּלּוֹ
  choice: Núi Si-nai hoàn toàn chìm trong khói
  rationale: Diễn đạt trạng thái toàn bộ ngọn núi bị khói bao phủ; “hoàn toàn” thể hiện כֻּלּוֹ mà vẫn tự nhiên trong tiếng Việt.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: vì
  rationale: Cụm từ nêu nguyên nhân trực tiếp của cảnh núi đầy khói.
- source_word: יָרַד עָלָיו יְהוָה
  choice: Yahweh đã ngự xuống trên núi ấy
  rationale: “Ngự xuống” diễn đạt יָרַד một cách trang trọng, tự nhiên khi chủ thể là Đức Chúa Trời; “trên núi ấy” làm rõ đại từ giống đực số ít chỉ núi Si-nai.
- source_word: בָּאֵשׁ
  choice: trong lửa
  rationale: Giữ hình ảnh và phương thức biểu hiện trong nguyên văn, không chuyển thành một cách giải thích thần học.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: Khói từ núi bốc lên
  rationale: Đại từ sở hữu quy chiếu về ngọn núi; “từ núi” rõ nghĩa và tự nhiên hơn “khói của nó” trong tiếng Việt.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: như khói của một lò nung
  rationale: כִּבְשָׁן có thể chỉ lò nung hoặc lò luyện; “lò nung” tạo hình ảnh rõ ràng, quen thuộc và không thu hẹp quá mức công dụng của lò.
- source_word: וַיֶּחֱרַד כָּל־הָהָר מְאֹד
  choice: cả ngọn núi rung chuyển dữ dội
  rationale: “Rung chuyển” thể hiện sự lay động vật lý của חרד; “dữ dội” chuyển tải sức nhấn mạnh của מְאֹד bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách dịch danh thánh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh riêng YHWH; giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Cách mô tả sự hiện diện của Yahweh trong lửa
  choice: đã ngự xuống trên núi ấy trong lửa
  alternative: đã xuống trên núi ấy bằng lửa
  rationale: “Trong lửa” giữ cách diễn đạt của giới từ ב và sự căng mở của hình ảnh, không quyết định rằng lửa chỉ là phương tiện hay đồng nhất chính Yahweh với lửa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngự xuống” để phù hợp với chủ thể thần linh nhưng không thêm nội dung ngoài động từ “xuống”; chia câu để tiếng Việt sáng rõ trong khi vẫn giữ chuỗi hình ảnh của nguyên văn.
