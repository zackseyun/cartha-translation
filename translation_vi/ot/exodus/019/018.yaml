  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố của nguyên văn: toàn núi Si-nai đầy khói; nguyên nhân là Yahweh đã xuống trên núi trong lửa; khói bốc lên như khói từ lò; và cả núi rung chuyển mạnh. “Chìm trong khói” diễn đạt tự nhiên trạng thái עָשַׁן כֻּלּוֹ trong ngữ cảnh này, không làm thay đổi ý nghĩa. “Ngự xuống” phù hợp văn phong Kinh Thánh tiếng Việt và vẫn giữ nghĩa cơ bản của יָרַד.'
