source:
  edition: WLC
  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: vi
  text: Không ai được chạm tay vào nó[a], vì nó chắc chắn phải bị ném đá hoặc bị bắn[b]. Dù là súc vật hay người, nó cũng không được sống. Khi tù và ngân dài[c], họ được phép lên núi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Không ai được chạm tay vào người ấy.” Đại từ Hê-bơ-rơ giống đực số ít có thể chỉ kẻ vi phạm, hoặc được hiểu rộng hơn là người hay vật đã phạm lệnh; ý chính là không được trực tiếp chạm vào đối tượng ấy, nhưng phải hành hình từ xa.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “bị đâm xuyên.” Động từ Hê-bơ-rơ có thể nói đến việc bắn, có lẽ bằng tên trong ngữ cảnh này.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hê-bơ-rơ: “khi tù và được kéo dài”; cụm này có lẽ chỉ một hồi tù và bằng sừng cừu được thổi ngân dài.'
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: Không một bàn tay nào được chạm vào kẻ ấy
  rationale: Giữ lối diễn đạt pháp lý vô nhân xưng của tiếng Hê-bơ-rơ; đại từ giống đực số ít tự nhiên nhất chỉ kẻ đã vượt ranh giới, đồng thời hàm ý không được trực tiếp chạm vào người hay vật phạm lệnh.
- source_word: סָקוֹל יִסָּקֵל
  choice: chắc chắn phải bị ném đá
  rationale: Kết cấu nguyên mẫu tuyệt đối đi với động từ hữu hạn nhấn mạnh tính chắc chắn và bắt buộc của hình phạt.
- source_word: יָרֹה יִיָּרֶה
  choice: bị bắn
  rationale: Trong ngữ cảnh hành hình từ xa, động từ ירה rất có thể nói đến việc bắn, có lẽ bằng tên; ghi chú giữ lại khả năng dịch rộng hơn là ‘đâm xuyên’.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: Dù là súc vật hay người
  rationale: Diễn đạt tự nhiên kết cấu phân lựa của nguyên văn và cho thấy cả hai loại đều chịu cùng một hình phạt.
- source_word: לֹא יִחְיֶה
  choice: kẻ ấy cũng không được sống
  rationale: Giữ sắc thái phán quyết bắt buộc, đồng thời dùng ‘kẻ ấy’ để quy chiếu tự nhiên cho cả súc vật lẫn người trong tiếng Việt.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: Khi tù và sừng cừu ngân dài
  rationale: יוֹבֵל có thể chỉ sừng cừu hay tù và làm từ sừng cừu; với משׁך, cụm từ chỉ một hồi tù và được kéo dài.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: họ được phép lên núi
  rationale: Trong mạch văn, hồi tù và dài báo hiệu lệnh cấm trước đó đã được dỡ bỏ; ‘được phép’ truyền đạt ý cho phép tự nhiên hơn một câu tương lai đơn thuần.
theological_decisions:
- issue: Đối tượng của hậu tố giống đực số ít trong בּוֹ (‘vào người ấy/nó’)
  choice: Hiểu là kẻ đã chạm núi hoặc vượt ranh giới
  alternative: Hiểu rộng hơn là bất cứ người hay vật nào trở nên cấm kỵ do tiếp xúc
  rationale: Ngữ cảnh trực tiếp nói đến người hoặc súc vật vượt ranh giới và phải bị xử tử mà không ai trực tiếp chạm vào; cách hiểu chỉ kẻ vi phạm phù hợp nhất với logic pháp lý, nhưng ghi chú vẫn bảo lưu độ mở của đại từ.
- issue: Sắc thái của יַעֲלוּ sau hồi tù và dài
  choice: Hiểu là sự cho phép lên núi sau khi lệnh cấm được dỡ bỏ
  alternative: 'Dịch như lời tiên báo hay mệnh lệnh đơn giản: ‘họ sẽ lên núi’'
  rationale: Mạch văn về ranh giới và thời điểm cho thấy sự tương phản giữa lúc bị cấm và lúc được lên; bản dịch không xác định thêm ‘họ’ là nhóm nào vì nguyên văn cũng không nói rõ tại câu này.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng ‘tù và sừng cừu’ để tránh lẫn với kèn kim loại; giữ ‘kẻ ấy’ trong quy định hình phạt nhằm bao quát tiền ngữ gồm cả súc vật lẫn người. Các dấu chú thích [a], [b], [c] đều được đặt ngay tại nội dung liên quan.
