revisions:
- from: Không một bàn tay nào được chạm vào kẻ ấy[a]; kẻ ấy chắc chắn phải bị ném đá hoặc bị bắn[b]. Dù là súc vật hay người, kẻ ấy cũng không được sống. Khi tù và sừng cừu ngân dài[c], họ được phép lên núi.
  to: Không ai được chạm tay vào nó[a], vì nó chắc chắn phải bị ném đá hoặc bị bắn[b]. Dù là súc vật hay người, nó cũng không được sống. Khi tù và ngân dài[c], họ được phép lên núi.
  rationale: Sửa cách diễn đạt để tiếng Việt tự nhiên hơn, bỏ sự lặp nghĩa ở cụm chỉ nhạc khí, và thay chú thích phiên âm không chính xác bằng lời giải thích trực tiếp. Bản sửa không thay đổi nghĩa, không xác định thêm đối tượng «họ», và vẫn bảo lưu tính không hoàn toàn xác định của đại từ trong nguyên văn.
