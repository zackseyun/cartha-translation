  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: vi
  text: 'Yahweh phán với Môi-se: “Này, Ta đang đến với con trong một đám mây dày đặc, để dân chúng nghe khi Ta phán với con, và cũng mãi mãi tin cậy con[a].” Rồi Môi-se thuật lại với Yahweh những lời của dân chúng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tin con” hoặc “tin nơi con.” Tiếng Hê-bơ-rơ có thể diễn tả lòng tín nhiệm Môi-se là người phát ngôn được Đức Chúa Trời xác nhận.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng giao ước của Đức Chúa Trời bằng dạng chuyển tự quen dùng, thay vì thay bằng một tước hiệu.
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của lời phán trực tiếp.
- source_word: בָּא
  choice: đang đến
  rationale: Phân từ diễn tả hành động sắp xảy ra một cách sống động; “đang đến” phù hợp với cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: בְּעַב הֶעָנָן
  choice: trong một đám mây dày đặc
  rationale: Diễn đạt rõ hình ảnh đám mây có mật độ dày, đồng thời giữ giới từ chỉ phạm vi Đức Chúa Trời ngự đến.
- source_word: בַּעֲבוּר
  choice: để
  rationale: Trong ngữ cảnh này, từ nối giới thiệu mục đích của việc Yahweh đến trong mây.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: khi Ta phán với con
  rationale: Chuyển cấu trúc nguyên mẫu sang mệnh đề thời gian tự nhiên, đồng thời giữ ý Yahweh trực tiếp nói với Môi-se.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: và cũng ... tin cậy con
  rationale: Động từ אמן dạng Hiphil đi với ב có thể chỉ việc tin hoặc đặt lòng tin nơi một người. “Tin cậy con” diễn tả sự tín nhiệm Môi-se là người phát ngôn được Yahweh xác nhận mà không hàm ý thờ phượng ông.
- source_word: לְעוֹלָם
  choice: mãi mãi
  rationale: Giữ ý về thời gian bền lâu bằng lối nói hiện đại và dễ hiểu.
- source_word: וַיַּגֵּד
  choice: Rồi ... thuật lại
  rationale: Thể wayyiqtol đẩy câu chuyện tiến tới; “thuật lại” phù hợp với hành động báo lại nội dung đã được dân chúng nói.
- source_word: דִּבְרֵי הָעָם
  choice: những lời của dân chúng
  rationale: Giữ danh từ “lời” của nguyên văn, không giản lược thành một cách diễn ý.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh YHWH. Dạng “Yahweh” bảo tồn đây là danh riêng được mặc khải, thay vì thay thế bằng tước hiệu.
- issue: Ý nghĩa của בְּךָ יַאֲמִינוּ đối với Môi-se
  choice: tin cậy con
  alternative: tin con; tin nơi con
  rationale: Cụm từ nói đến lòng tín nhiệm dành cho Môi-se với tư cách người phát ngôn được Đức Chúa Trời xác nhận. “Tin cậy” giữ được chiều kích tín nhiệm mà không biến câu này thành lời khẳng định rằng Môi-se là đối tượng thờ phượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đại từ “Ta—con” thích hợp với lời Yahweh phán cùng Môi-se; “dân chúng” tự nhiên hơn “dân” trong câu này. Dấu [a] được đặt ngay sau cụm từ có phương án dịch khác.
