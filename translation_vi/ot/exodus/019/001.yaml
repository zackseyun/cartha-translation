base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: vi
  text: Vào tháng thứ ba, kể từ khi con dân Y-sơ-ra-ên ra khỏi đất Ai Cập, vào chính ngày này[a], họ đến hoang mạc Si-nai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngày này”. Cụm từ Hê-bơ-rơ có thể nhấn mạnh chính xác ngày họ đến: “chính ngày này”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: Vào tháng thứ ba
  rationale: חֹדֶשׁ trong công thức xác định thời gian thường có nghĩa là “tháng”; cách dịch này tự nhiên và sát nghĩa.
- source_word: לְצֵאת
  choice: kể từ khi ... ra khỏi
  rationale: Động từ nguyên mẫu với לְ xác lập mốc thời gian tính từ cuộc ra đi; “kể từ khi” diễn đạt rõ quan hệ ấy mà không ấn định quá mức sắc thái “sau khi” hay “lúc”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  rationale: Nghĩa đen là “các con trai/con cái của Y-sơ-ra-ên”, nhưng ở đây là danh xưng tập thể của dân tộc. “Con dân Y-sơ-ra-ên” vừa giữ liên hệ với hình ảnh huyết thống, vừa tự nhiên và bao hàm toàn dân trong tiếng Việt.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ra khỏi đất Ai Cập
  rationale: Giữ lại אֶרֶץ là “đất/xứ” và diễn đạt tự nhiên với động từ “ra khỏi”.
- source_word: בַּיּוֹם הַזֶּה
  choice: chính ngày này
  rationale: Giữ đại từ chỉ thị “này” và sắc thái nhấn mạnh có thể có trong cụm từ; chú thích ghi nhận cách hiểu ít nhấn mạnh hơn.
- source_word: בָּאוּ
  choice: họ đến
  rationale: בוא là động từ thông dụng chỉ việc đến hoặc đi vào; “đến” là cách dịch trực tiếp, không thêm sắc thái của “tới nơi”.
- source_word: מִדְבַּר סִינָי
  choice: hoang mạc Si-nai
  rationale: מִדְבָּר chỉ vùng hoang vu, thưa người; “hoang mạc” tự nhiên và không nhất thiết hàm ý một biển cát khô cằn như “sa mạc” có thể gợi ra.
theological_decisions:
- issue: Cách dịch danh xưng giao ước בְּנֵי יִשְׂרָאֵל
  choice: con dân Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Cụm Hê-bơ-rơ có hình thức giống đực số nhiều nhưng hoạt động như danh xưng dân tộc, chỉ toàn thể cộng đồng. “Con dân” giữ phần nào hình ảnh nguồn gốc chung mà không khiến độc giả hiểu rằng chỉ nam giới được nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Y-sơ-ra-ên”, “Ai Cập” và “Si-nai” theo lối gọi quen thuộc; chọn “hoang mạc” để diễn đạt địa hình מִדְבָּר mà không mô tả quá mức.
