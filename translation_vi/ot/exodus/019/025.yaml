  language: vi
  text: Môi-se đi xuống chỗ dân chúng và nói với họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Vậy, ... xuống
  rationale: Động từ ירד ở dạng kể chuyện liên tiếp diễn tả hành động Môi-se đi xuống; “Vậy” nối câu này với mệnh lệnh ngay trước đó một cách tự nhiên.
- source_word: אֶל־הָעָם
  choice: với dân chúng
  rationale: Giới từ אֶל chỉ hướng đến nơi dân chúng đang ở; trong tiếng Việt, “xuống với dân chúng” tự nhiên và giữ được ý ông từ núi đi xuống chỗ họ.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: và nói với họ
  rationale: Dịch trực tiếp động từ אמר và giới từ אֶל; câu Hê-bơ-rơ không ghi nội dung lời nói, nên không bổ sung.
theological_decisions:
- issue: Nội dung lời Môi-se nói không được nêu trong câu
  choice: 'Giữ câu kết mở: “nói với họ”'
  alternative: Bổ sung rằng ông cảnh báo hoặc truyền lại lời Đức Chúa Trời
  rationale: Nguyên văn chỉ nói Môi-se nói với dân chúng; việc xác định nội dung từ văn cảnh sẽ diễn giải vượt quá câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc; không cần chú thích vì câu không có dị bản hay điểm mơ hồ đáng kể.
