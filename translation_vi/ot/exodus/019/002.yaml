  text: וַ/יִּסְע֣וּ מֵ/רְפִידִ֗ים וַ/יָּבֹ֨אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽ/יַּחֲנ֖וּ בַּ/מִּדְבָּ֑ר וַ/יִּֽחַן שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: vi
  text: Họ rời Rê-phi-đim, đến hoang mạc Sinai và đóng trại trong hoang mạc. Tại đó, Israel đóng trại đối diện ngọn núi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước ngọn núi.” Giới từ Hê-bơ-rơ có thể chỉ vị trí đối diện, ở phía trước hoặc trước mặt một vật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵרְפִידִים
  choice: Họ rời Rê-phi-đim
  rationale: Động từ נסע trong trình thuật hành trình thường chỉ việc nhổ trại để lên đường; “rời” diễn đạt tự nhiên sự khởi hành từ một địa điểm. Tên địa danh được phiên âm.
- source_word: וַיָּבֹאוּ
  choice: đến
  rationale: בוא có nghĩa rộng là đến, vào hoặc tới nơi; “đến” phù hợp với đích đến được nêu ngay sau đó.
- source_word: מִדְבַּר סִינַי
  choice: hoang mạc Sinai
  rationale: מִדְבָּר chỉ vùng đất hoang vu, khô cằn; “hoang mạc” vừa tự nhiên vừa phù hợp bối cảnh. Cấu trúc sở thuộc Hê-bơ-rơ được diễn đạt gọn bằng tên riêng đặt sau danh từ.
- source_word: וַיַּחֲנוּ בַּמִּדְבָּר
  choice: và đóng trại trong hoang mạc
  rationale: חנה là đóng trại. Việc lặp lại “hoang mạc” được giữ theo nguyên văn thay vì lược bỏ.
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: Tại đó, Israel đóng trại
  rationale: Đưa “Tại đó” lên đầu câu phản ánh vị trí nhấn của שָׁם. Israel được hiểu là cộng đồng dân tộc; tiếng Việt không cần biểu thị hình thái số ít của động từ Hê-bơ-rơ.
- source_word: נֶגֶד הָהָר
  choice: đối diện ngọn núi
  rationale: נֶגֶד diễn tả vị trí ở phía trước hoặc đối diện một vật. “Đối diện ngọn núi” rõ nghĩa về không gian nhưng vẫn cần chú thích phương án dịch gần nghĩa khác.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể tuần tự cùng sự lặp lại có chủ ý của nguyên văn. Dùng dạng tên “Israel” và “Sinai” quen thuộc trong tiếng Việt hiện đại; phiên âm địa danh ít quen thuộc là “Rê-phi-đim”.
