  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: vi
  text: Ngay cả các thầy tế lễ, là những người đến gần Yahweh[a], cũng phải thánh hóa mình, kẻo Yahweh đột ngột xông ra chống lại họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đến với Yahweh” hoặc “những người tiến đến gần Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “bùng ra trên họ.” Tiếng Hê-bơ-rơ diễn tả sự phán xét của Yahweh bùng phát đột ngột.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Ngay cả ... cũng
  rationale: 'Diễn đạt tự nhiên sắc thái bổ sung và nhấn mạnh: các thầy tế lễ cũng không được miễn khỏi lời cảnh báo.'
- source_word: הַכֹּהֲנִים
  choice: các thầy tế lễ
  rationale: Cách gọi thông dụng, rõ nghĩa trong bối cảnh phụng tự; tính xác định được thể hiện qua nhóm người đã được nhận diện trong ngữ cảnh.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: là những người đến gần Yahweh
  rationale: Giữ ý của phân từ נגשׁ về việc tiến đến gần để được tiếp cận hoặc phục vụ trước sự hiện diện của Đức Chúa Trời, mà không giới hạn thành một hành động cụ thể hơn.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh giao ước được nêu trực tiếp trong bản Hê-bơ-rơ; giữ nguyên cả hai lần xuất hiện thay vì thay lần thứ hai bằng đại từ.
- source_word: יִתְקַדָּשׁוּ
  choice: phải thánh hóa mình
  rationale: 'Thể Hitpael mang nghĩa phản thân: các thầy tế lễ phải chuẩn bị và biệt mình ra thánh. Cách dịch này giữ sắc thái phụng tự mà không quy giản thành sự thanh sạch đạo đức.'
- source_word: פֶּן
  choice: kẻo
  rationale: Diễn đạt gọn và trang trọng lời cảnh báo về hậu quả có thể xảy ra.
- source_word: יִפְרֹץ בָּהֶם
  choice: bất ngờ ập đến chống lại họ
  rationale: Truyền đạt hình ảnh một sự bùng phát đột ngột nhằm chống lại họ; từ “bất ngờ” làm rõ lực hình tượng của פרץ mà không xác định thêm cách thức trừng phạt.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng danh riêng יְהוָה hai lần. Giữ “Yahweh” bảo toàn tính chất danh giao ước và tránh thay nó bằng một tước hiệu.
- issue: Ý nghĩa lời cảnh báo יִפְרֹץ בָּהֶם יְהוָה
  choice: Yahweh bất ngờ ập đến chống lại họ
  alternative: Yahweh bùng ra trên họ; Yahweh trừng phạt họ
  rationale: Ngữ cảnh cho thấy một hành động phán xét nguy hiểm, đột ngột. Bản dịch giữ hình ảnh của động từ và hướng đối nghịch của hành động nhưng không thêm một hình thức hình phạt cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Cấu trúc “Ngay cả ... cũng” bảo toàn trọng âm của câu; “thánh hóa mình” giữ sắc thái phụng tự, còn cách diễn đạt lời cảnh báo tránh lối nói quá cổ nhưng vẫn duy trì hình ảnh mạnh của nguyên văn.
