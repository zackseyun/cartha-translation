  source_fidelity: 'Cần sửa “lên với Đức Chúa Trời”: giới từ אֶל chỉ hướng đến, và cách nói hiện tại không tự nhiên trong tiếng Việt. “Lên đến với” diễn đạt rõ Môi-se đi lên tới chỗ Đức Chúa Trời mà không thêm chi tiết. “Truyền lại” dễ gợi ý một nội dung đã được truyền qua trung gian; וְתַגֵּיד nghĩa là làm cho biết, thuật lại/công bố. “Báo cho” giữ sát chức năng này và phân biệt nhẹ với “nói” ở vế trước.'
