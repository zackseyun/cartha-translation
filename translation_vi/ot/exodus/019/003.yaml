source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: vi
  text: 'Môi-se lên đến với Đức Chúa Trời. Từ trên núi, Yahweh gọi ông và phán: “Hãy nói thế này với nhà Gia-cốp và báo cho các con trai Israel[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con cái Israel” hoặc “dân Israel”. Nguyên văn Hê-bơ-rơ là “các con trai Israel”, một cách nói tập thể ở giống đực.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: lên
  rationale: Diễn đạt chuyển động hướng lên núi một cách tự nhiên, đồng thời giữ nguyên ý không gian của động từ Hê-bơ-rơ.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, danh từ có mạo từ chỉ Đức Chúa Trời của Israel; cách gọi này tự nhiên và trang trọng trong tiếng Việt.
- source_word: וַיִּקְרָא אֵלָיו
  choice: gọi ông
  rationale: Động từ קרא đi với אֶל diễn tả việc gọi hướng đến Môi-se; tiếng Việt không cần thêm giới từ nhưng vẫn giữ rõ người được gọi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời thay vì thay thế bằng một tước hiệu.
- source_word: מִן הָהָר
  choice: từ trên núi
  rationale: הַר ở đây là ngọn núi trong ngữ cảnh Sinai; “từ trên núi” diễn đạt tự nhiên vị trí phát ra tiếng gọi.
- source_word: לֵאמֹר
  choice: và phán
  rationale: Phân từ dẫn lời trực tiếp được chuyển thành động từ dẫn ngôn tự nhiên trong tiếng Việt; “phán” phù hợp khi chủ thể là Đức Chúa Trời.
- source_word: כֹּה תֹאמַר
  choice: Hãy nói thế này
  rationale: Giữ tính mệnh lệnh và công thức dẫn vào sứ điệp thần thượng, nhưng dùng cấu trúc tiếng Việt hiện đại.
- source_word: לְבֵית יַעֲקֹב
  choice: với nhà Gia-cốp
  rationale: Giữ hình ảnh tập thể và giao ước của “nhà Gia-cốp” thay vì diễn giải thành một nhóm dân tộc.
- source_word: וְתַגֵּיד
  choice: và truyền lại
  rationale: Thể Hiphil của נגד mang nghĩa làm cho biết hoặc công bố; “truyền lại” phân biệt nhẹ với “nói” ở vế song song.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: cho các con trai Israel
  rationale: Giữ hình thức tập thể giống đực “các con trai” của nguyên văn và thế song song với “nhà Gia-cốp”; chú thích nêu các cách dịch tập thể tự nhiên hơn.
theological_decisions:
- issue: Cách chuyển dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: Đức Giê-hô-va; CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước YHWH. Giữ “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Sắc thái giống đực của לִבְנֵי יִשְׂרָאֵל
  choice: các con trai Israel
  alternative: con cái Israel; dân Israel
  rationale: Bản chính giữ hình thức giống đực và sự song song của nguyên văn, còn chú thích cho biết thành ngữ này cũng có thể được hiểu theo nghĩa tập thể rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Tên Môi-se và Gia-cốp dùng dạng quen thuộc trong tiếng Việt; “Israel” giữ dạng quốc tế hiện đại. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
