revisions:
- from: 'Toàn dân đồng thanh đáp: “Mọi điều Yahweh đã phán, chúng tôi sẽ làm.” Rồi Môi-se trình lại[a] lời của dân chúng với Yahweh.'
  to: 'Toàn dân đồng thanh đáp: “Mọi điều Yahweh đã phán, chúng tôi sẽ làm.” Rồi Môi-se trình lại[a] với Yahweh lời của dân chúng.'
  rationale: Chỉ điều chỉnh trật tự thành phần ở câu cuối để diễn đạt tự nhiên hơn và phản ánh rõ hướng “đến Yahweh” của nguyên văn, không thay đổi ý nghĩa. Chú thích được mở rộng để bảo tồn sắc thái hình ảnh “mang trở lại” bên cạnh nghĩa chức năng “báo lại.”
