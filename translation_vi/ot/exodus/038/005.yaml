  text: He cast four rings on the four corners of the bronze grating as holders for the poles[a][b].
translation:
  language: vi
  text: Ông đúc bốn khoen ở bốn góc[a] của tấm lưới bằng đồng để làm chỗ tra các đòn khiêng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “ở bốn đầu” của tấm lưới bằng đồng.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những chỗ chứa cho các đòn” (nghĩa đen: “những nhà cho các đòn”), tức là các chỗ hoặc bộ phận để tra đòn khiêng vào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Ông đúc
  rationale: Động từ יצק trong ngữ cảnh chế tác kim loại chỉ việc rót kim loại nóng chảy để đúc; “đúc” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: אַרְבַּע טַבָּעֹת
  choice: bốn khoen
  rationale: טַבָּעֹת là các vòng kim loại dùng để luồn hoặc giữ đòn khiêng. “Khoen” tự nhiên hơn “nhẫn” và phù hợp với phụ kiện kim loại.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: ở bốn góc
  rationale: קָצֶה có thể chỉ đầu, mép hoặc cực điểm; với tấm lưới có bốn vị trí gắn khoen, “bốn góc” truyền đạt rõ chức năng, còn nghĩa “bốn đầu” được giữ trong chú thích.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: của tấm lưới bằng đồng
  rationale: מִכְבָּר là kết cấu dạng lưới; נְחֹשֶׁת chỉ đồng hoặc đồng thiếc trong ngữ cảnh cổ đại. “Tấm lưới bằng đồng” rõ ràng, tự nhiên và không dùng thuật ngữ quá kỹ thuật.
- source_word: בָּתִּים
  choice: chỗ tra
  rationale: Nghĩa đen là “những căn nhà”, nhưng ở đây chỉ các bộ phận tiếp nhận đòn. “Chỗ tra” diễn đạt đúng công dụng mà không áp đặt một cấu tạo kỹ thuật cụ thể.
- source_word: לַבַּדִּים
  choice: các đòn khiêng
  rationale: בַּדִּים là các thanh dùng để khiêng vật dụng thánh. “Đòn khiêng” rõ nghĩa hơn chỉ nói “đòn” hoặc “thanh”.
