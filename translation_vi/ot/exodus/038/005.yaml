translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” tiếp nối chủ thể số ít trong mạch thuật sự; “khoen”, “tấm lưới” và “đòn khiêng” là các từ thông dụng, phù hợp với ngữ cảnh chế tác Đền Tạm.
