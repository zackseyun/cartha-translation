revisions:
- from: Đây là bản kê khai[a] về Đền Tạm, tức Đền Tạm của Chứng Ước[b], được lập theo lệnh Môi-se qua công việc phục vụ của người Lê-vi, dưới sự điều hành của Y-tha-ma[c], con trai thầy tế lễ A-rôn.
  to: Đây là bản kê khai[a] về Đền Tạm, tức Đền Tạm của Chứng Ước[b], được lập theo lệnh Môi-se. Đó là công việc của người Lê-vi, dưới sự giám sát của Y-tha-ma[c], con trai A-rôn, thầy tế lễ.
  rationale: 'Bản sửa giữ nguyên ý nghĩa và tính dè dặt của nguyên văn, nhưng sắp xếp lại cú pháp để tiếng Việt tự nhiên hơn: công việc của người Lê-vi được nêu như phần giải thích cho bản kê khai, và chức danh “thầy tế lễ” được gắn rõ với A-rôn. Các mốc chú thích vẫn gắn đúng với từ ngữ được giải thích.'
