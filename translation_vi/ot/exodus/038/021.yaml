source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: vi
  text: Đây là bản kê khai[a] về Đền Tạm, tức Đền Tạm của Chứng Ước[b], được lập theo lệnh Môi-se. Đó là công việc của người Lê-vi, dưới sự giám sát của Y-tha-ma[c], con trai A-rôn, thầy tế lễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bản kiểm kê” hoặc “sổ quyết toán”; từ Hê-bơ-rơ chỉ một sự kiểm đếm chính thức.
    reason: lexical_alternative
  - marker: b
    text: “Chứng Ước” có lẽ chỉ chứng tích của giao ước, đặc biệt là hai bảng đá được đặt trong Hòm Giao Ước.
    reason: cultural_note
  - marker: c
    text: Theo nghĩa đen là “bởi tay Y-tha-ma”, một thành ngữ chỉ việc thực hiện hoặc giám sát.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: bản kê khai
  rationale: Danh từ này chỉ sự kiểm kê hoặc quyết toán chính thức. “Bản kê khai” tự nhiên trong tiếng Việt và phù hợp với phần tổng kết vật liệu của Đền Tạm.
- source_word: הַמִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt đối với nơi thánh di động được mô tả trong sách Xuất Hành.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Đền Tạm của Chứng Ước
  rationale: Giữ cấu trúc đồng vị và mối liên hệ với הָעֵדֻת, đồng thời không diễn giải quá mức ngay trong chính văn. Chú thích làm rõ rằng từ này nhiều khả năng chỉ chứng tích giao ước, đặc biệt là hai bảng đá.
- source_word: פֻּקַּד
  choice: được lập
  rationale: Trong ngữ cảnh hành chính này, động từ tiếp nối ý kiểm kê của פְקוּדֵי. “Được lập” kết hợp tự nhiên với “bản kê khai” mà vẫn diễn đạt hành động ghi nhận chính thức.
- source_word: עַל פִּי מֹשֶׁה
  choice: theo lệnh Môi-se
  rationale: Thành ngữ theo nghĩa đen là “theo miệng Môi-se”, nhưng ở đây chỉ mệnh lệnh hay chỉ thị của ông.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: qua công việc phục vụ của người Lê-vi
  rationale: Diễn đạt cả sắc thái công việc được giao lẫn vai trò phương tiện của người Lê-vi, không dùng thuật ngữ giáo hội về sau.
- source_word: בְּיַד אִיתָמָר
  choice: dưới sự điều hành của Y-tha-ma
  rationale: Thành ngữ “bởi tay” ở đây biểu thị sự phụ trách hoặc giám sát; “dưới sự điều hành” truyền đạt rõ vai trò ấy.
- source_word: הַכֹּהֵן
  choice: thầy tế lễ
  rationale: Cách dịch trực tiếp chức danh của A-rôn trong bối cảnh thờ phượng của Cựu Ước.
theological_decisions:
- issue: Ý nghĩa của הָעֵדֻת
  choice: Chứng Ước
  alternative: chứng ngôn; văn kiện giao ước
  rationale: “Chứng Ước” giữ được ý về vật làm chứng và mối liên hệ với giao ước, nhưng chú thích thừa nhận đối tượng được nhắc đến nhiều khả năng là hai bảng đá thay vì đưa cách giải thích đó thẳng vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đền Tạm”, “người Lê-vi” và “thầy tế lễ” là các cách gọi quen thuộc trong tiếng Việt; câu được sắp xếp tự nhiên nhưng vẫn giữ quan hệ hành chính, phục vụ và giám sát của nguyên văn.
