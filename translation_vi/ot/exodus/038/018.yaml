  text: וּ/מָסַ֞ךְ שַׁ֤עַר הֶ/חָצֵר֙ מַעֲשֵׂ֣ה רֹקֵ֔ם תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר וְ/עֶשְׂרִ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/קוֹמָ֤ה בְ/רֹ֨חַב֙ חָמֵ֣שׁ אַמּ֔וֹת לְ/עֻמַּ֖ת קַלְעֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: vi
  text: Bức màn che lối vào sân[a] là sản phẩm của thợ thêu, làm bằng chỉ xanh lam, tím và đỏ tươi[b], cùng vải lanh mịn xe sợi. Màn dài hai mươi cu-bít và cao năm cu-bít[c], tương ứng với các tấm trướng quanh sân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bức rèm ở cổng sân.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hê-bơ-rơ chỉ ghi “xanh lam, tím và đỏ tươi”; từ “chỉ” được thêm vào để làm rõ rằng đây là các vật liệu dệt đã nhuộm màu.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn có thể dịch sát hơn: “chiều cao theo bề rộng là năm cu-bít”; đây có lẽ là cách diễn đạt kích thước, cho biết màn cổng có cùng chiều cao với các tấm trướng quanh sân.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: bức màn che lối vào sân
  rationale: מָסַךְ chỉ một tấm vải dùng làm vật che chắn tại lối vào; שַׁעַר ở đây là cổng hay lối vào sân Đền Tạm. Cách diễn đạt này tự nhiên trong tiếng Việt và thể hiện rõ chức năng của tấm màn.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: sản phẩm của thợ thêu
  rationale: Giữ kết cấu chỉ tay nghề của người thợ, đồng thời truyền đạt loại công việc dệt thêu có hoa văn.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: chỉ xanh lam, tím và đỏ tươi
  rationale: Ba từ ngữ chỉ các màu hay vật liệu nhuộm màu dùng trong hàng dệt. Thêm từ “chỉ” để câu tiếng Việt rõ và tự nhiên, nhưng ghi chú rằng từ này không được nêu trực tiếp trong tiếng Hê-bơ-rơ.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: sợi gai mịn xe
  rationale: שֵׁשׁ là loại vải hay sợi gai mịn, còn מָשְׁזָר mô tả sợi được xe lại. Cách dịch giữ cả chất liệu lẫn phương pháp xử lý sợi.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: dài hai mươi cu-bít
  rationale: Giữ nguyên đơn vị đo cổ đại và chuyển cấu trúc kích thước sang cách nói tự nhiên trong tiếng Việt.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת
  choice: cao năm cu-bít
  rationale: קוֹמָה chỉ chiều cao. Cụm בְרֹחַב tạo một cách diễn đạt kích thước khó chuyển sát mà vẫn tự nhiên, nên ý chính được đưa vào câu và sắc thái nguyên văn được bảo lưu trong chú thích.
- source_word: לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: tương ứng với các tấm trướng quanh sân
  rationale: לְעֻמַּת diễn tả sự tương ứng hay ngang bằng; ở đây chiều cao của màn cổng phù hợp với các tấm trướng bao quanh sân.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sân” theo ngữ cảnh Đền Tạm, “tấm trướng” để phân biệt các màn bao quanh sân với màn che lối vào, và giữ đơn vị cổ “cu-bít” thay vì quy đổi phỏng chừng.
