base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: vi
  text: Ông đặt các đòn khiêng vào những khoen ở các bên bàn thờ[a] để khiêng bàn thờ bằng các đòn ấy. Ông làm bàn thờ bằng các tấm ván, với phần bên trong rỗng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông đưa các đòn khiêng vào những khoen.” Động từ Hê-bơ-rơ theo sát chữ là “đưa vào” hoặc “mang vào”; trong ngữ cảnh này, nó chỉ việc đặt các đòn khiêng vào đúng vị trí.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát chữ: “rỗng, các tấm ván.” Cụm từ cô đọng này có lẽ có nghĩa là bàn thờ được làm bằng các tấm ván, tạo thành một kết cấu rỗng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Ông luồn ... vào
  rationale: Dạng hiphil của בוא trong ngữ cảnh này chỉ việc đưa các đòn khiêng vào đúng vị trí trong các khoen; “luồn ... vào” tự nhiên và diễn tả rõ thao tác.
- source_word: הַבַּדִּים
  choice: các đòn khiêng
  rationale: Trong ngữ cảnh Đền Tạm, בדים là những đòn dùng để khiêng vật dụng thánh; cách dịch này rõ nghĩa hơn chỉ nói “các đòn”.
- source_word: בַּטַּבָּעֹת
  choice: vào những khoen
  rationale: Giới từ ב sau động từ chỉ sự đưa vào bên trong; “khoen” là từ hiện đại, thích hợp với các vòng dùng để xỏ đòn khiêng.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: ở hai bên bàn thờ
  rationale: צלעות chỉ các bên hay mặt bên. “Hai bên” diễn đạt vị trí của những khoen một cách tự nhiên mà không thêm chi tiết ngoài ngữ cảnh.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: để dùng chúng mà khiêng bàn thờ
  rationale: Mệnh đề nguyên mẫu nêu mục đích; “chúng” quy về các đòn khiêng, còn lặp lại “bàn thờ” giúp tránh đại từ mơ hồ trong tiếng Việt.
- source_word: נְבוּב
  choice: rỗng
  rationale: נבוב mô tả bàn thờ có phần bên trong rỗng; “rỗng” ngắn gọn và sát nghĩa.
- source_word: לֻחֹת
  choice: bằng các tấm ván
  rationale: Cụm נבוב לחת có kết cấu cô đọng, theo sát chữ là “rỗng, các tấm ván”; cách dịch này biểu đạt cấu tạo rỗng làm bằng ván mà vẫn ghi nhận tính cô đọng trong chú thích.
- source_word: עָשָׂה אֹתוֹ
  choice: Ông làm bàn thờ
  rationale: עשה có nghĩa thông dụng là “làm”; thay đại từ bằng “bàn thờ” tạo câu tiếng Việt rõ ràng.
