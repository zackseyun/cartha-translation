base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: vi
  text: Người làm sân. Ở phía nam, về hướng nam, có các tấm màn của sân[a] bằng vải lanh mịn, xe sợi, dài một trăm cu-bít.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các rèm của sân”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Dạng wayyiqtol của עשה tiếp nối mạch tường thuật; cách dịch này tự nhiên trong tiếng Việt và không thêm sắc thái thời gian ngoài nguyên văn.
- source_word: הֶחָצֵר
  choice: sân
  rationale: חָצֵר ở đây chỉ khu sân bên ngoài Đền Tạm; “sân” rõ nghĩa và tự nhiên trong ngữ cảnh kiến trúc.
- source_word: לִפְאַת
  choice: Ở phía
  rationale: Từ này chỉ một phía hoặc khu vực; “ở phía” diễn đạt tự nhiên khi đi với phương hướng.
- source_word: נֶגֶב תֵּימָנָה
  choice: phía nam, hướng về phương nam
  rationale: Giữ lại cả hai yếu tố chỉ phương nam trong tiếng Hê-bơ-rơ thay vì gộp thành một cụm duy nhất.
- source_word: קַלְעֵי הֶחָצֵר
  choice: các tấm màn của sân
  rationale: קְלָעִים trong ngữ cảnh Đền Tạm là những tấm vải treo tạo thành ranh giới sân; “các tấm màn” dễ hiểu và phù hợp chức năng ấy.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: vải gai mịn xe
  rationale: שֵׁשׁ chỉ vải gai mịn, còn מָשְׁזָר mô tả sợi đã được xe; cách dịch giữ cả chất liệu lẫn cách chế tác.
- source_word: מֵאָה בָּאַמָּה
  choice: dài một trăm cu-bít
  rationale: Cụm từ nêu kích thước; thêm “dài” làm rõ chiều đo vốn được hàm ý trong ngữ cảnh.
