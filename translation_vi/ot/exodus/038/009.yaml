  to: Người làm sân. Ở phía nam, về hướng nam, có các tấm màn của sân[a] bằng vải lanh mịn, xe sợi, dài một trăm cu-bít.
  rationale: 'Chỉnh thuật ngữ chất liệu và cách diễn đạt để tiếng Việt tự nhiên hơn, đồng thời giữ nguyên các yếu tố ngữ nghĩa: sân, sự lặp chỉ hướng nam, các màn làm ranh giới, vải lanh xe sợi và chiều dài một trăm cu-bít. Chú thích thay thế từ vựng được giữ nguyên và đặt đúng chỗ.'
