  language: vi
  text: Tất cả các tấm màn quanh sân đều bằng vải lanh mịn xe sợi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Tất cả các tấm rèm quanh sân đều bằng vải lanh mịn được xe sợi.”
