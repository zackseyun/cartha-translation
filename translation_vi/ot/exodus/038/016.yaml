lexical_decisions:
- source_word: כָּל
  choice: Tất cả
  rationale: Diễn đạt toàn bộ các tấm màn theo nghĩa tập hợp, tự nhiên trong tiếng Việt hiện đại.
- source_word: קַלְעֵי
  choice: các tấm màn
  rationale: Chỉ những tấm vải tạo thành phần bao quanh sân; “tấm màn” rõ nghĩa và phù hợp với kiến trúc Đền Tạm.
- source_word: הֶחָצֵר
  choice: sân
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ khu sân có rào bao quanh; “sân” ngắn gọn và tự nhiên.
- source_word: סָבִיב
  choice: bao quanh
  rationale: Diễn đạt việc các tấm màn chạy quanh chu vi của sân.
- source_word: שֵׁשׁ
  choice: vải gai mịn
  rationale: Chỉ loại vải lanh chất lượng cao dùng trong Đền Tạm; “vải gai mịn” là cách gọi quen thuộc, dễ hiểu trong tiếng Việt Kinh Thánh.
- source_word: מָשְׁזָר
  choice: xe sợi
  rationale: Mô tả kỹ thuật làm sợi bằng cách xoắn hoặc xe; đặt sau tên vật liệu tạo thành cụm tự nhiên trong tiếng Việt.
