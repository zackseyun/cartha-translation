  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc khái quát của tiếng Hê-bơ-rơ, đồng thời dùng “tấm màn” thay cho từ chuyên môn khó hiểu; dấu chú thích [a] được đặt ngay sau câu.
