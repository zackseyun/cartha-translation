- from: Tất cả các tấm màn bao quanh sân đều bằng vải gai mịn xe sợi.[a]
  to: Tất cả các tấm màn quanh sân đều bằng vải lanh mịn xe sợi.[a]
  rationale: Bản sửa thay “vải gai” bằng “vải lanh” để phản ánh chính xác chất liệu שֵׁשׁ, đồng thời điều chỉnh cụm mô tả cách gia công cho tự nhiên hơn. Câu vẫn giữ nghĩa tập hợp của כָּל, chức năng bao quanh của קַלְעֵי ... סָבִיב, và không thêm diễn giải ngoài bản gốc.
