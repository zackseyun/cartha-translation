  rationale: Sửa vị trí diễn đạt của “xung quanh” để phản ánh rõ trạng ngữ סָבִיב (“ở chung quanh/chu vi”), không biến nó thành tính chất của “sân”. Điều chỉnh chú thích từ vựng để phương án thay thế sát hơn với chức năng kiến trúc của אַדְנֵי; không thay đổi nội dung danh sách hay thuật ngữ Đền Tạm.
