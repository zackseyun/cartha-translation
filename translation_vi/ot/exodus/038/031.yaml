  text: the bases of the surrounding courtyard[a], the bases of the gate of the courtyard, all the pegs of the tabernacle[b], and all the pegs of the surrounding courtyard.
translation:
  language: vi
  text: các đế xung quanh sân[a], các đế của cổng sân, tất cả các cọc của Đền Tạm[b], và tất cả các cọc xung quanh sân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các ổ đỡ” thay cho “các đế.”
    reason: lexical_alternative
  - marker: b
    text: Hay “cọc đóng đất” thay cho “cọc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: các đế
  rationale: Trong ngữ cảnh dựng Đền Tạm, từ này chỉ các bộ phận nền bằng kim loại để giữ cột hay khung; “đế” rõ ràng, cụ thể và tự nhiên trong tiếng Việt.
- source_word: חָצֵר
  choice: sân
  rationale: Chỉ khu vực có rào bao quanh bên ngoài nơi thánh; “sân” là cách gọi tự nhiên và phù hợp với ngữ cảnh kiến trúc.
- source_word: סָבִיב
  choice: bao quanh
  rationale: Giữ ý chu vi ở mọi phía và có thể bổ nghĩa tự nhiên cho “sân” trong danh sách này.
- source_word: שַׁעַר
  choice: cổng
  rationale: Chỉ lối vào có cấu trúc của sân; “cổng” là từ trực tiếp và thông dụng.
- source_word: יִתְדֹת
  choice: cọc
  rationale: Chỉ các cọc dùng để neo giữ Đền Tạm và sân; “cọc” tự nhiên hơn “chốt” trong ngữ cảnh lều trại, đồng thời vẫn bao quát khả năng hiểu là cọc neo.
- source_word: מִּשְׁכָּן
  choice: Đền Tạm
  rationale: Đây là tên gọi quen thuộc và cụ thể trong tiếng Việt cho nơi thánh di động trong Xuất Hành, thay vì dịch chung chung là “nơi ngự”.
- source_word: כָּל
  choice: tất cả
  rationale: Diễn đạt đầy đủ tính bao quát khi bổ nghĩa cho danh từ số nhiều “các cọc”.
- source_word: וְאֵת / וְאֶת
  choice: và
  rationale: Các liên từ kèm dấu hiệu tân ngữ nối tiếp danh sách; dịch là “và” ở mục cuối giữ văn phong liệt kê tự nhiên, còn các mục trước được ngăn bằng dấu phẩy.
