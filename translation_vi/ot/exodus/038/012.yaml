  terminology: “Trụ”, “đế”, “móc”, “bạc” nhất quán và phù hợp ngữ cảnh kiến trúc Đền Tạm. “Cu-bít” bảo tồn đơn vị cổ. Chú thích tại “đai trụ” được neo đúng chỗ và giải thích sự bất định về nghĩa của חֲשֻׁקִים mà không áp đặt một nhận diện kiến trúc cụ thể.
