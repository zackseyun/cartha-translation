  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc và các chi tiết của nguyên văn: phía tây, màn che dài năm mươi cu-bít, mười trụ, mười đế, cùng móc và các bộ phận חֲשֻׁקִים bằng bạc. “Phía tây” diễn đạt đúng cách dùng quy ước của יָם trong ngữ cảnh mô tả Đền Tạm. “Đai trụ” là một cách chuyển ngữ thận trọng cho thuật ngữ kỹ thuật còn chưa xác định chính xác, và chú thích bảo lưu các khả năng thích hợp.'
