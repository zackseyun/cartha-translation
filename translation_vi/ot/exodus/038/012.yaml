base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: vi
  text: Về phía tây, có các tấm màn dài năm mươi cu-bít, với mười trụ và mười đế; các móc của trụ và các đai trụ[a] đều bằng bạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nẹp” hoặc “các thanh nối”. Từ Hê-bơ-rơ chỉ bộ phận của trụ ở đây là một thuật ngữ kỹ thuật, nên hình dạng và chức năng chính xác của nó không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: Về phía tây
  rationale: יָם nghĩa đen là “biển” nhưng trong cách chỉ phương hướng của tiếng Hê-bơ-rơ thường có nghĩa là phía tây; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: קְלָעִים
  choice: các tấm màn
  rationale: Trong ngữ cảnh sân Đền Tạm, từ này chỉ những tấm vải tạo thành phần bao quanh; “các tấm màn” cụ thể, dễ hiểu mà không xác định quá mức cấu tạo dệt.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: dài năm mươi cu-bít
  rationale: Nguyên văn nêu trực tiếp số đo; thêm “dài” làm rõ chiều kích được hàm ý và tạo câu tiếng Việt tự nhiên.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: với mười trụ
  rationale: “Trụ” phù hợp với cấu kiện dựng các tấm màn; “với” chuyển cấu trúc liệt kê của tiếng Hê-bơ-rơ sang tiếng Việt trôi chảy.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: và mười đế
  rationale: אֶדֶן chỉ đế hoặc ổ đỡ của trụ; “đế” là từ phổ thông, chính xác trong ngữ cảnh.
- source_word: וָוֵי הָעַמֻּדִים
  choice: các móc của trụ
  rationale: וָוִים chỉ những móc gắn vào trụ; cách dịch này giữ rõ quan hệ giữa móc và trụ.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: và các đai trụ
  rationale: Đây là thuật ngữ kiến trúc chuyên biệt, có thể chỉ các đai, nẹp hoặc bộ phận nối của trụ. “Đai trụ” giữ được ý về phụ kiện kim loại mà không khẳng định quá mức hình dạng chính xác; chú thích bảo lưu sự bất định.
- source_word: כָּסֶף
  choice: đều bằng bạc
  rationale: Danh từ “bạc” ở cuối câu chỉ vật liệu của cả móc lẫn đai; “đều bằng bạc” diễn đạt rõ chức năng vị ngữ trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “cu-bít” để giữ đơn vị đo cổ; cấu trúc liệt kê được làm mềm bằng “với” nhưng vẫn bảo toàn đầy đủ các chi tiết của nguyên văn. Dấu chú thích được đặt ngay sau thuật ngữ còn bất định, thay vì sau đơn vị đo.
