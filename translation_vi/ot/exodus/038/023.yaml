base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: vi
  text: Cùng với ông là Ô-hô-li-áp, con trai A-hi-sa-mác, thuộc bộ tộc Đan. Ông là một thợ thủ công[a], người thiết kế và thợ thêu, làm việc với chỉ xanh lam, chỉ tím, chỉ đỏ tươi[b] và vải lanh mịn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có nghĩa rộng là “người thợ lành nghề”; cũng có thể dịch là “thợ chạm khắc.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là một thành ngữ Hê-bơ-rơ chỉ vật liệu dệt được nhuộm màu đỏ tươi; cũng có thể dịch đơn giản là “màu đỏ tươi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: Cùng với ông có
  rationale: Diễn đạt tự nhiên cấu trúc tiếng Hê-bơ-rơ không có động từ, đồng thời liên kết Ô-hô-li-áp với Bết-sa-lê-ên ở câu trước.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Ô-hô-li-áp, con trai A-hi-sa-mác
  rationale: Phiên âm các tên riêng Hê-bơ-rơ theo lối dễ đọc đối với độc giả Việt, không dịch nghĩa tên.
- source_word: לְמַטֵּה דָן
  choice: thuộc bộ tộc Đan
  rationale: Thể hiện rõ quan hệ bộ tộc mà giới từ לְ đánh dấu trong ngữ cảnh gia phả.
- source_word: חָרָשׁ
  choice: thợ thủ công
  rationale: Danh từ có nghĩa rộng là người thợ lành nghề; bản văn ở đây không nêu rõ riêng một nghề hay vật liệu nên tránh thu hẹp thành 'thợ chạm khắc' trong chính văn.
- source_word: וְחֹשֵׁב
  choice: người thiết kế
  rationale: Trong ngữ cảnh hàng dệt của Đền Tạm, từ này chỉ người nghĩ ra và thực hiện các hoa văn nghệ thuật.
- source_word: וְרֹקֵם
  choice: thợ thêu
  rationale: Từ này chỉ người làm hoa văn nhiều màu trên vải bằng kỹ thuật thêu.
- source_word: בַּתְּכֵלֶת וּבָאַרְגָּמָן
  choice: bằng chỉ xanh lam, chỉ tím
  rationale: Các danh từ màu sắc chỉ vật liệu dệt đã nhuộm trong ngữ cảnh. Thêm 'chỉ' để tiếng Việt rõ và tự nhiên.
- source_word: וּבְתוֹלַעַת הַשָּׁנִי
  choice: chỉ đỏ tươi
  rationale: Cụm từ chỉ vật liệu dệt nhuộm màu đỏ tươi; 'chỉ' làm rõ ý vật liệu nhưng không khẳng định loại sợi cụ thể.
- source_word: וּבַשֵּׁשׁ
  choice: vải gai mịn
  rationale: שֵׁשׁ trong ngữ cảnh Đền Tạm chỉ loại vải lanh/gai mịn; cách gọi này quen thuộc và dễ hiểu trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu đầu giữ quan hệ với câu trước; câu sau tách danh sách nghề nghiệp để tránh một câu tiếng Việt quá nặng. Các màu được diễn đạt như vật liệu dệt theo ngữ cảnh, nhưng không xác định quá mức bản chất chính xác của từng chất liệu.
