base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: vi
  text: 'Mỗi người một bê-ca[a], tức là nửa siếc-lơ theo siếc-lơ thánh, dành cho mỗi người từ hai mươi tuổi trở lên đi qua để được ghi vào sổ kiểm kê[b]: tổng cộng 603.550 người.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen là “mỗi sọ”; đây là thành ngữ Hê-bơ-rơ chỉ mỗi cá nhân. Một bê-ca bằng nửa siếc-lơ theo tiêu chuẩn của nơi thánh.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đi qua vào số những người được kiểm đếm.” Tiếng Hê-bơ-rơ dùng ngôn ngữ kiểm kê dân số, với hình ảnh từng người đi qua để được ghi đếm.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: bê-ca
  rationale: Giữ lại tên đơn vị trọng lượng chuyên biệt của tiếng Hê-bơ-rơ; vế đồng vị ngay sau giải thích đơn vị này bằng nửa siếc-lơ.
- source_word: לַגֻּלְגֹּלֶת
  choice: mỗi đầu người
  rationale: Thành ngữ đếm người, theo nghĩa đen là “mỗi sọ”; “mỗi đầu người” vừa giữ được hình ảnh đếm từng cá nhân vừa tự nhiên trong tiếng Việt.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: nửa siếc-lơ
  rationale: Chuyển trực tiếp cụm chỉ giá trị của một bê-ca.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ thánh
  rationale: Giới từ בְּ ở đây chỉ tiêu chuẩn trọng lượng; cách dịch này ngắn gọn và giữ nguyên mối liên hệ với chuẩn dùng cho nơi thánh.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: cho mỗi người đã đi qua giữa những người được kiểm đếm
  rationale: Giữ động từ “đi qua” và ngôn ngữ kiểm kê dân số của nguyên văn, thay vì diễn giải đơn thuần là “đăng ký”.
- source_word: הַפְּקֻדִים
  choice: những người được kiểm đếm
  rationale: Thể hiện nghĩa bị động trong bối cảnh kiểm kê dân số.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: từ hai mươi tuổi trở lên
  rationale: Cách nói tự nhiên, chính xác trong tiếng Việt về ngưỡng tuổi.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 603.550 người
  rationale: Dùng chữ số theo quy ước trình bày số hàng nghìn trong tiếng Việt; thêm “người” để làm rõ đơn vị của tổng số được kiểm đếm.
