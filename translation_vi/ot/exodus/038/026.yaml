revisions:
- from: 'mỗi đầu người một bê-ca[a], tức là nửa siếc-lơ theo siếc-lơ thánh, cho mỗi người đã đi qua giữa những người được kiểm đếm[b], từ hai mươi tuổi trở lên: 603.550 người.'
  to: 'Mỗi người một bê-ca[a], tức là nửa siếc-lơ theo siếc-lơ thánh, dành cho mỗi người từ hai mươi tuổi trở lên đi qua để được ghi vào sổ kiểm kê[b]: tổng cộng 603.550 người.'
  rationale: Sửa cách diễn đạt thành ngữ kiểm kê để tránh nghĩa không có trong nguyên văn (“đi qua giữa”), đồng thời vẫn giữ hình ảnh “đi qua” và bổ sung chú thích cho thành ngữ “mỗi người”. Các dữ kiện số lượng, tuổi tác và thuật ngữ trọng lượng được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:42:17Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng đơn vị bê-ca, giá trị bằng nửa siếc-lơ theo chuẩn thánh, ngưỡng tuổi và tổng số 603.550. Tuy nhiên, cụm “đã đi qua giữa những người được kiểm đếm” gán thêm ý không có trong tiếng Hê-bơ-rơ và không diễn đạt tự nhiên thành ngữ đi qua để được ghi vào danh sách kiểm kê.
  naturalness: “Mỗi đầu người một” và nhất là “đi qua giữa những người được kiểm đếm” chưa tự nhiên trong tiếng Việt hiện đại. Đảo nhẹ trật tự và dùng “đi qua để được ghi vào sổ kiểm kê” giữ được hình ảnh của động từ mà sáng nghĩa hơn.
  terminology: Giữ “bê-ca” và “siếc-lơ thánh” là thích hợp cho đơn vị/chuẩn trọng lượng cổ. Bổ sung chú thích cho “mỗi người” để bảo tồn sắc thái thành ngữ nguyên văn, theo hướng của audit trail tiếng Anh.
  issues:
  - severity: medium
    issue: Cụm “đã đi qua giữa những người được kiểm đếm”
    rationale: Giới từ “giữa” khiến câu gợi hành động đi qua ở giữa một nhóm đã được đếm, trong khi cụm Hê-bơ-rơ là thành ngữ kiểm kê, nói về việc đi qua để thuộc vào/được ghi trong số người được kiểm đếm.
  - severity: low
    issue: Chú thích chưa nêu nghĩa đen của לַגֻּלְגֹּלֶת
    rationale: Chính văn “mỗi đầu người” là tự nhiên, nhưng một chú thích ngắn về nghĩa đen “mỗi sọ” giúp bảo lưu cách dùng thành ngữ đếm người của nguyên văn.
