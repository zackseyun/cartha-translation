translation_notes:
  register: Văn phong tường thuật, trang trọng nhưng hiện đại. Dùng “siếc-lơ” để giữ đơn vị đo cổ; lặp “bạc” ở các chi tiết nhằm làm rõ chất liệu được ngữ cảnh câu trước xác định. Dấu chú thích [a] được đặt sau mệnh đề có từ ngữ cần giải thích.
