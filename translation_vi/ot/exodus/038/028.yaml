  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: vi
  text: Với một ngàn bảy trăm bảy mươi lăm siếc-lơ bạc, ông làm các móc cho các trụ, bọc các đầu trụ và làm các đai cho chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nối chúng lại bằng các đai.” Động từ Hê-bơ-rơ ở đây nói đến việc trang bị các trụ bằng những đai hoặc nẹp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: một ngàn bảy trăm bảy mươi lăm siếc-lơ bạc còn lại
  rationale: Cụm từ tiếp nối phép tính bạc ở câu trước. Nguyên văn chỉ nêu con số, nhưng đơn vị siếc-lơ và bạc được cung cấp rõ bởi ngữ cảnh trực tiếp; “còn lại” làm sáng tỏ quan hệ kế toán mà không đổi nội dung.
- source_word: עָשָׂה
  choice: dùng ... để làm
  rationale: Trong ngữ cảnh vật liệu và chế tác, cách diễn đạt này chuyển tự nhiên ý số bạc được dùng để làm các bộ phận.
- source_word: וָוִים
  choice: các móc
  rationale: Trong phần mô tả Đền Tạm, từ này chỉ các móc kim loại gắn vào trụ.
- source_word: לָעַמּוּדִים
  choice: cho những trụ
  rationale: “Trụ” là thuật ngữ kiến trúc rõ ràng và tự nhiên cho עַמּוּדִים trong ngữ cảnh này.
- source_word: וְצִפָּה רָאשֵׁיהֶם
  choice: bọc bạc các đầu trụ
  rationale: Động từ piel צפה có nghĩa bọc hoặc dát kim loại; “đầu trụ” truyền đạt trực tiếp nghĩa đen “đầu của chúng”. Bạc được xác định từ ngữ cảnh vật liệu.
- source_word: וְחִשַּׁק אֹתָם
  choice: làm các đai bạc cho chúng
  rationale: Trong ngữ cảnh chế tác Đền Tạm, חִשַּׁק chỉ việc trang bị các trụ bằng đai hoặc nẹp. “Đai bạc” dễ hiểu hơn thuật ngữ kỹ thuật cổ và phù hợp với vật liệu đang được kiểm kê.
