base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/025.yaml
  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: vi
  text: Số bạc của những người được kiểm đếm trong cộng đồng là một trăm ta-lâng và một ngàn bảy trăm bảy mươi lăm siếc-lơ[a], tính theo siếc-lơ của nơi thánh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ta-lâng và siếc-lơ là các đơn vị trọng lượng thời cổ.
    reason: cultural_note
  - marker: b
    text: Nghĩa là được cân theo chuẩn trọng lượng của nơi thánh.
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  choice: bạc
  rationale: Trong bảng kê này, từ này chỉ kim loại bạc đã thu, chứ không phải tiền bạc theo nghĩa khái quát.
- source_word: פְּקוּדֵי
  choice: những người được kiểm đếm
  rationale: Dạng từ này chỉ những người đã được đăng ký hoặc kiểm đếm trong cuộc kiểm kê; cách dịch này giữ sắc thái hành chính của ngữ cảnh.
- source_word: הָעֵדָה
  choice: cộng đồng
  rationale: Chỉ toàn thể dân được quy tụ; “cộng đồng” tự nhiên trong tiếng Việt hiện đại và không hàm ý một cơ cấu giáo phái về sau.
- source_word: מְאַת כִּכָּר
  choice: một trăm ta-lâng
  rationale: Giữ tên đơn vị trọng lượng lớn thời cổ, phù hợp với phép liệt kê nguyên văn.
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: và một ngàn bảy trăm bảy mươi lăm siếc-lơ
  rationale: Diễn đạt tổng số 1.775 siếc-lơ bằng cách viết số thành chữ rõ ràng, đồng thời giữ đơn vị cổ.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: tính theo siếc-lơ của nơi thánh
  rationale: Cụm giới từ nêu chuẩn trọng lượng được dùng; cách diễn đạt này làm rõ chức năng đo lường mà vẫn giữ liên hệ trực tiếp với nơi thánh.
theological_decisions: []
