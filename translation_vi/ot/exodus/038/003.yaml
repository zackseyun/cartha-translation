  text: וַ/יַּ֜עַשׂ אֶֽת כָּל כְּלֵ֣י הַ/מִּזְבֵּ֗חַ אֶת הַ/סִּירֹ֤ת וְ/אֶת הַ/יָּעִים֙ וְ/אֶת הַ/מִּזְרָקֹ֔ת אֶת הַ/מִּזְלָגֹ֖ת וְ/אֶת הַ/מַּחְתֹּ֑ת כָּל כֵּלָ֖י/ו עָשָׂ֥ה נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: vi
  text: 'Ông làm mọi dụng cụ của bàn thờ: các nồi, xẻng, chậu, nĩa và khay đựng than. Ông làm tất cả các dụng cụ ấy bằng đồng[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có thể chỉ đồng hoặc hợp kim đồng, như đồng thiếc.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: mọi dụng cụ của bàn thờ
  rationale: כְּלִי là từ rộng chỉ đồ dùng, khí cụ hoặc vật dụng; “dụng cụ” tự nhiên trong tiếng Việt và phù hợp với danh sách các đồ dùng phục vụ bàn thờ.
- source_word: הַסִּירֹת
  choice: các nồi
  rationale: סִירוֹת thường chỉ nồi hoặc vật chứa tương tự. Trong ngữ cảnh này chúng có thể dùng để đựng tro, nhưng bản Hê-bơ-rơ không nói rõ công dụng ấy nên không thêm vào chính văn.
- source_word: הַיָּעִים
  choice: xẻng
  rationale: יַע chỉ dụng cụ dùng để xúc; “xẻng” là cách diễn đạt rõ ràng, tự nhiên trong ngữ cảnh phục vụ bàn thờ.
- source_word: הַמִּזְרָקֹת
  choice: chậu
  rationale: מִזְרָקֹת là các vật chứa dùng trong nghi lễ, có thể để hứng hoặc rảy chất lỏng; “chậu” giữ được tính công dụng mà không giải thích quá mức.
- source_word: הַמִּזְלָגֹת
  choice: nĩa
  rationale: מִזְלָגוֹת chỉ những dụng cụ có ngạnh giống nĩa. “Nĩa” rõ nghĩa và không thêm ý “móc thịt” vốn không được nêu trực tiếp tại đây.
- source_word: הַמַּחְתֹּת
  choice: khay đựng than
  rationale: מַחְתָּה chỉ vật dụng để xúc hoặc mang than lửa. “Khay đựng than” truyền đạt công dụng rõ hơn “lư hương”, vốn có thể gợi một chức năng chuyên biệt hơn.
- source_word: כָּל כֵּלָיו
  choice: tất cả các dụng cụ ấy
  rationale: Hậu tố sở hữu quy chiếu về bàn thờ. “Các dụng cụ ấy” nối tự nhiên với danh sách vừa nêu và tránh lặp cấu trúc nặng nề.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng hoặc hợp kim đồng như đồng thiếc. “Đồng” là cách gọi tự nhiên, bao quát trong tiếng Việt; chú thích bảo lưu khả năng hiểu cụ thể là đồng thiếc.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ông làm ... Ông làm
  rationale: Giữ cả hai lần xuất hiện của động từ עשה, phản ánh cấu trúc mở đầu rồi tổng kết của câu Hê-bơ-rơ.
theological_decisions: []
