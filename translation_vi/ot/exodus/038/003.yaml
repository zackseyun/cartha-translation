  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” vì chủ thể là Bết-sa-lê-ên từ ngữ cảnh trước. Giữ cấu trúc lặp của nguyên văn và tránh thêm công dụng không được nói rõ.
