translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ chuỗi mệnh đề bằng liên từ hoặc dấu câu trung tính, không đưa thêm ý tương phản. Các thuật ngữ kiến trúc được chọn theo hướng phổ thông, đồng thời chú thích sự bất định của אֲדָנִים và nhóm từ ח־שׁ־ק.
