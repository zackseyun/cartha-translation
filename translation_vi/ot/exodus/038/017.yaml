  text: וְ/הָ/אֲדָנִ֣ים לָֽ/עַמֻּדִים֮ נְחֹשֶׁת֒ וָוֵ֨י הָֽ/עַמּוּדִ֜ים וַ/חֲשׁוּקֵי/הֶם֙ כֶּ֔סֶף וְ/צִפּ֥וּי רָאשֵׁי/הֶ֖ם כָּ֑סֶף וְ/הֵם֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף כֹּ֖ל עַמֻּדֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: vi
  text: Các đế của các trụ bằng đồng[a]; các móc của các trụ và các đai của chúng bằng bạc; phần bọc trên đầu các trụ bằng bạc[b]. Tất cả các trụ của sân đều có đai bằng bạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ổ đỡ”.
    reason: lexical_alternative
  - marker: b
    text: Các từ Hê-bơ-rơ được dịch là “đai” chỉ những chi tiết bằng bạc gắn với các trụ; hình dạng kiến trúc chính xác của chúng chưa rõ.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: các đế
  rationale: Trong ngữ cảnh dựng Đền Tạm, từ này chỉ bộ phận đỡ hoặc giữ chân trụ. “Đế” tự nhiên và dễ hiểu trong tiếng Việt hiện đại; “ổ đỡ” là một khả năng khác.
- source_word: עַמֻּדִים
  choice: những trụ
  rationale: Từ này chỉ các bộ phận thẳng đứng nâng đỡ kết cấu. “Trụ” phù hợp với ngữ cảnh kiến trúc và tự nhiên hơn “cột trụ” khi lặp lại nhiều lần.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ Hê-bơ-rơ có thể chỉ đồng hoặc hợp kim đồng; “đồng” là cách gọi thông dụng, không xác định quá mức thành phần luyện kim.
- source_word: וָוֵי
  choice: các móc
  rationale: Chỉ các móc gắn với trụ trong kết cấu sân.
- source_word: חֲשׁוּקֵיהֶם
  choice: các đai của chúng
  rationale: Bộ phận kiến trúc chính xác chưa chắc chắn, nhưng từ này chỉ các chi tiết bằng bạc có tính chất bao quanh hoặc liên kết trụ. “Đai” vừa dễ hiểu vừa giữ được liên hệ với động từ cùng gốc ở cuối câu.
- source_word: צִפּוּי
  choice: phần bọc
  rationale: Chỉ một lớp kim loại phủ lên bề mặt. “Phần bọc” diễn đạt rõ ý mà không dùng thuật ngữ quá kỹ thuật.
- source_word: רָאשֵׁיהֶם
  choice: đầu trụ
  rationale: Nghĩa đen là “đầu của chúng”, tức phần trên cùng của các trụ; “đầu trụ” rõ và tự nhiên.
- source_word: מְחֻשָּׁקִים
  choice: được nẹp
  rationale: Dạng bị động cùng gốc với danh từ được dịch là “đai”. “Được nẹp bạc” diễn tả các chi tiết bạc gắn quanh hoặc dọc trụ mà không khẳng định quá cụ thể hình dạng chưa chắc chắn.
- source_word: חָצֵר
  choice: sân
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ khu sân có rào bao quanh. “Sân” là cách nói tiếng Việt gọn, tự nhiên và đủ rõ trong mạch văn.
