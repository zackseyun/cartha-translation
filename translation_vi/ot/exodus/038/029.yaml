  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: vi
  text: Số đồng[a] được dâng làm lễ vật đưa qua đưa lại[b] là bảy mươi ta-lâng và 2.400 siếc-lơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đồng đỏ”; từ Hê-bơ-rơ נְחֹשֶׁת có thể chỉ đồng đỏ hoặc một hợp kim của đồng, tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: “Lễ vật đưa qua đưa lại” là một thuật ngữ nghi lễ, chỉ lễ vật được trình dâng trước mặt Đức Giê-hô-va bằng động tác đưa qua đưa lại; cũng có thể hiểu rộng hơn là “lễ vật dâng trình” hoặc “phần đóng góp”.
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ Hê-bơ-rơ có thể chỉ đồng đỏ hoặc đồng hợp kim; trong tiếng Việt, “đồng” là cách gọi tự nhiên, đủ rộng và phù hợp với kim loại dùng trong Đền Tạm.
- source_word: הַתְּנוּפָה
  choice: lễ vật đưa qua đưa lại
  rationale: Giữ ý nghĩa nghi lễ của danh từ תְּנוּפָה, tức lễ vật được đưa qua đưa lại trước mặt Đức Giê-hô-va, thay vì làm mờ thành một khoản đóng góp nói chung.
- source_word: שִׁבְעִים כִּכָּר
  choice: bảy mươi ta-lâng
  rationale: Giữ đơn vị trọng lượng cổ כִּכָּר bằng thuật ngữ Kinh Thánh quen thuộc “ta-lâng”, không quy đổi thiếu chắc chắn sang đơn vị hiện đại trong chính văn.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: và 2.400 siếc-lơ
  rationale: Giữ đơn vị trọng lượng cổ שֶׁקֶל và dùng chữ số theo lối trình bày tiếng Việt hiện đại để dễ đọc.
- source_word: וְ
  choice: Số
  rationale: Quan hệ tiếp nối với bản kê ở câu trước được thể hiện tự nhiên trong tiếng Việt bằng cấu trúc mở đầu “Số đồng...”, không cần dịch máy móc liên từ וְ thành “và”.
