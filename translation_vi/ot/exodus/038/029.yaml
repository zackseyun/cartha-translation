  to: Số đồng[a] được dâng làm lễ vật đưa qua đưa lại[b] là bảy mươi ta-lâng và 2.400 siếc-lơ.
  rationale: Sửa cấu trúc chính văn để diễn đạt tự nhiên và chính xác hơn quan hệ giữa số đồng với lễ vật nghi thức. Các số lượng, đơn vị cân, và độ mở nghĩa của נְחֹשֶׁת được giữ nguyên; không áp đặt cách hiểu giáo phái.
