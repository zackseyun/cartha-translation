translation:
  language: vi
  text: 'Còn về phía đông, về hướng mặt trời mọc: năm mươi cu-bít.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ sát nghĩa là: “Còn về phía đông, về hướng mặt trời mọc, năm mươi cu-bít.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: Còn phía
  rationale: פֵּאָה chỉ một phía, cạnh hoặc ranh giới. Trong phần mô tả kích thước sân Đền Tạm, “phía” là cách diễn đạt tự nhiên; “còn” giữ được tính liên kết của וְ và lối liệt kê tiếp nối.
- source_word: קֵדְמָה
  choice: đông
  rationale: Từ này có thể chỉ phía trước hoặc phía đông; khi đi cùng מִזְרָחָה, nghĩa phương hướng phía đông là rõ ràng.
- source_word: מִזְרָחָה
  choice: hướng mặt trời mọc
  rationale: מִזְרָח liên hệ với nơi mặt trời mọc và vì thế chỉ hướng đông. Cách dịch này giữ được cặp cách nói phương hướng trong tiếng Hê-bơ-rơ mà không chỉ lặp lại “phía đông”.
- source_word: חֲמִשִּׁים
  choice: năm mươi
  rationale: Số từ chỉ số lượng, được dịch trực tiếp.
- source_word: אַמָּה
  choice: cu-bít
  rationale: Đơn vị đo chiều dài tiêu chuẩn trong Kinh Thánh. Giữ dạng phiên âm quen dùng để không áp đặt một trị số hiện đại tuyệt đối; thêm “dài” cho câu tiếng Việt rõ và tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ lối liệt kê cô đọng của nguyên văn. Dùng “hướng mặt trời mọc” để bảo tồn sắc thái của cụm phương hướng kép trong tiếng Hê-bơ-rơ.
