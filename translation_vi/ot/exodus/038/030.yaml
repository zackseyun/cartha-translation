base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: vi
  text: Ông dùng lượng đồng ấy làm các đế cho lối vào Lều Hội Kiến[a], bàn thờ bằng đồng, tấm lưới đồng dành cho bàn thờ ấy[b], cùng mọi dụng cụ của bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các ổ đỡ tại lối vào Lều Hội Kiến”.
    reason: lexical_alternative
  - marker: b
    text: Hay “tấm vỉ đồng” hoặc “mạng lưới đồng thuộc về bàn thờ ấy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ông ... làm
  rationale: Động từ עשה trong mạch văn tường thuật mang nghĩa thông dụng là “làm”; chủ thể được tiếp nối từ ngữ cảnh trước.
- source_word: בָּהּ
  choice: dùng số đồng ấy
  rationale: Đại từ giống cái số ít quay lại lượng đồng vừa được kể ở câu trước; cách diễn đạt này truyền đạt nghĩa phương tiện tự nhiên trong tiếng Việt.
- source_word: אַדְנֵי
  choice: các đế
  rationale: Trong bối cảnh Đền Tạm, từ này chỉ các bộ phận bằng kim loại làm nền đỡ hoặc ổ giữ; “đế” rõ nghĩa và ít kỹ thuật hơn “ổ đỡ”.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: lối vào Lều Hội Kiến
  rationale: פֶּתַח chỉ chỗ mở hoặc lối vào. “Lều Hội Kiến” là cách gọi trang trọng, dễ hiểu cho nơi hội kiến được chỉ định.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: bàn thờ bằng đồng
  rationale: Diễn đạt trực tiếp chất liệu của bàn thờ; “đồng” là cách gọi quy ước phù hợp cho נְחֹשֶׁת trong văn cảnh này.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: tấm lưới đồng
  rationale: מִכְבָּר chỉ một cấu kiện dạng lưới gắn với bàn thờ; thêm “tấm” giúp tiếng Việt tự nhiên mà không xác định quá mức cấu tạo.
- source_word: אֲשֶׁר לוֹ
  choice: dành cho bàn thờ ấy
  rationale: Cụm quan hệ biểu thị sự liên hệ hoặc thuộc về bàn thờ nhưng không xác định chính xác vị trí; cách dịch này giữ sự khái quát ấy.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: mọi dụng cụ của bàn thờ
  rationale: כְּלִים là thuật ngữ rộng chỉ các đồ dùng hoặc khí cụ; “dụng cụ” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
