translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “ông” vì chủ thể là một người nam đã được xác định trong ngữ cảnh; giữ các phương án kỹ thuật hơn trong chú thích. Mọi dấu chú thích đều xuất hiện trong chính văn.
