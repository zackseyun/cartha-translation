source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: vi
  text: Bết-sa-lê-ên, con trai U-ri, cháu Hu-rơ, thuộc chi phái Giu-đa, đã làm tất cả những gì Yahweh[a] truyền cho Môi-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hê-bơ-rơ: YHWH; theo truyền thống thường được dịch là “CHÚA”.'
    reason: Nêu dạng danh trong nguyên ngữ và cách dịch truyền thống.
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: Bết-sa-lê-ên
  rationale: Liên từ וּ nối câu này với mạch thuật sự trước đó, nhưng không cần dịch thành một từ riêng trong tiếng Việt vì câu văn tự nhiên đã thể hiện sự tiếp nối. Tên riêng được phiên âm theo cách quen thuộc với độc giả Kinh Thánh tiếng Việt.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: con trai U-ri, cháu Hu-rơ
  rationale: Lần thứ nhất, בֶּן chỉ quan hệ cha–con trực tiếp; lần thứ hai trong chuỗi gia phả được diễn đạt tự nhiên là “cháu”, vẫn giữ rõ U-ri là cha và Hu-rơ là ông của Bết-sa-lê-ên.
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: thuộc bộ tộc Giu-đa
  rationale: מַטֶּה trong ngữ cảnh này chỉ một bộ tộc Israel, còn לְ diễn tả sự thuộc về.
- source_word: עָשָׂה
  choice: đã làm
  rationale: עָשָׂה có nghĩa rộng là “làm/thực hiện”; “đã làm” phù hợp với bối cảnh chế tác Đền Tạm mà không thu hẹp động từ quá mức.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tất cả những gì
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ ý nghĩa toàn thể và bao quát của cụm Hê-bơ-rơ.
- source_word: צִוָּה
  choice: truyền cho
  rationale: Trong cấu trúc một người ra lệnh cho người khác, “truyền cho” là cách diễn đạt trang trọng, rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ danh riêng của Đức Chúa Trời dưới dạng chuyển tự thay vì thay bằng một tước hiệu.
- source_word: אֶת מֹשֶׁה
  choice: cho Môi-se
  rationale: אֶת đánh dấu Môi-se là đối tượng nhận mệnh lệnh; tiếng Việt diễn đạt quan hệ này tự nhiên bằng “truyền cho Môi-se”.
theological_decisions:
- issue: Cách dịch danh יהוה
  choice: Yahweh
  alternative: CHÚA
  rationale: Bản Hê-bơ-rơ dùng trực tiếp Danh Bốn Chữ יהוה. Giữ “Yahweh” bảo tồn tính chất danh riêng; chú thích cho biết cách dịch thay thế theo truyền thống mà không áp đặt cách hiểu hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên người và tên bộ tộc được phiên âm theo dạng quen thuộc trong tiếng Việt; danh Yahweh được giữ dưới dạng chuyển tự. Dùng “cháu Hu-rơ” thay cho lối lặp “con trai của… con trai của…” để câu tự nhiên mà vẫn bảo toàn quan hệ gia phả.
