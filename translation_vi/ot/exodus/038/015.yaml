revisions:
- from: Còn ở phía bên kia[a], bên này và bên kia cổng sân, có các tấm màn dài mười lăm cu-bít, với ba trụ và ba đế[b].
  to: Còn ở phần bên còn lại[a], ở bên này và bên kia cổng sân, có các tấm màn dài mười lăm cu-bít, với ba trụ và ba đế[b].
  rationale: Bản sửa thay “phía bên kia” bằng “phần bên còn lại” để tránh hiểu nhầm là phía đối diện, đồng thời giữ mệnh đề “ở bên này và bên kia cổng sân” tương ứng với מִזֶּה וּמִזֶּה. Thuật ngữ kiến trúc và đơn vị đo được giữ nguyên; ghi chú về אַדָנִים được làm tự nhiên và chính xác hơn.
