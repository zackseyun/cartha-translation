  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: vi
  text: Còn ở phần bên còn lại[a], ở bên này và bên kia cổng sân, có các tấm màn dài mười lăm cu-bít, với ba trụ và ba đế[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Còn ở hai bên cổng sân.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “ba ổ” (ổ đặt trụ).
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: ở phía bên kia
  rationale: כָּתֵף theo nghĩa đen là “vai,” nhưng trong mô tả sân Đền Tạm chỉ phần bên cạnh cổng; “phía bên kia” tự nhiên và phù hợp với bố cục không gian.
- source_word: מִזֶּה וּמִזֶּה
  choice: bên này và bên kia
  rationale: Giữ rõ ý phân bố ở hai phía kề cổng, thay vì thu gọn thành “hai bên.”
- source_word: לְשַׁעַר הֶחָצֵר
  choice: cổng sân
  rationale: Cách nói gọn, tự nhiên trong tiếng Việt, chỉ cổng thuộc về sân của Đền Tạm.
- source_word: קְלָעִים
  choice: các tấm màn
  rationale: Trong ngữ cảnh Đền Tạm, từ này chỉ những tấm vải treo tạo thành hàng rào bao quanh sân; “tấm màn” dễ hiểu và không hàm ý rèm bên trong.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: dài mười lăm cu-bít
  rationale: Giữ nguyên đơn vị cổ; thêm “dài” để diễn đạt tự nhiên rằng con số là kích thước của các tấm màn.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: với ba trụ
  rationale: Diễn đạt tự nhiên cấu trúc kê khai không động từ của tiếng Hê-bơ-rơ; “trụ” thích hợp với kết cấu sân Đền Tạm.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: và ba đế
  rationale: אֶדֶן có thể là đế hoặc ổ/chân đế; “đế” rõ ràng hơn với độc giả phổ thông, còn nghĩa thay thế được ghi chú.
