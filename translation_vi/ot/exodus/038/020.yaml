  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: vi
  text: Tất cả các cọc dùng cho Đền Tạm và sân bao quanh đều bằng đồng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ có thể chỉ đồng đỏ hoặc đồng thiếc, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Tất cả
  rationale: Diễn đạt tự nhiên ý nghĩa tập hợp của וְכָל với danh từ số nhiều; liên từ đầu câu không cần dịch riêng trong tiếng Việt ở câu kết danh sách này.
- source_word: הַיְתֵדֹת
  choice: các cọc
  rationale: יָתֵד chỉ cọc dùng để giữ chắc lều hoặc kết cấu; “các cọc” ngắn gọn, rõ nghĩa trong ngữ cảnh.
- source_word: לַמִּשְׁכָּן
  choice: dùng cho Đền Tạm
  rationale: מִשְׁכָּן là thuật ngữ thường dùng cho nơi ngự thánh trong sách Xuất Hành; “Đền Tạm” là cách gọi tiếng Việt quen thuộc và vẫn gợi tính chất nơi ngự có thể di chuyển.
- source_word: וְלֶחָצֵר סָבִיב
  choice: và sân bao quanh
  rationale: Cụm này nói đến các cọc dành cho sân ở xung quanh Đền Tạm; cách diễn đạt giữ quan hệ không gian mà không thêm đại từ không có trong nguyên văn.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ Hê-bơ-rơ có thể chỉ đồng đỏ hoặc đồng thiếc tùy ngữ cảnh. “Đồng” là từ bao quát, tự nhiên trong tiếng Việt; chú thích bảo tồn độ bất định về loại kim loại.
