  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: vi
  text: Ông làm chậu bằng đồng và bệ của chậu bằng đồng từ những chiếc gương[b] của các phụ nữ phục vụ tại lối vào Lều Hội Kiến[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các phụ nữ tụ họp tại lối vào Lều Hội Kiến.” Tiếng Hê-bơ-rơ có thể nhấn mạnh việc tập hợp có tổ chức cũng như việc phục vụ.'
    reason: alternative_reading
  - marker: b
    text: Gương thời xưa thường là những tấm kim loại, thường bằng đồng, được đánh bóng chứ không phải bằng kính.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: chậu
  rationale: Chỉ chậu lớn dùng để rửa trong việc phụng sự tại Đền Tạm; “chậu” là cách nói hiện đại, rõ nghĩa.
- source_word: כַּן
  choice: chân chậu
  rationale: Chỉ phần đỡ hoặc bệ của chậu; “chân chậu” tự nhiên và làm rõ quan hệ với vật chính.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ Hê-bơ-rơ có thể chỉ đồng hoặc hợp kim đồng; trong ngữ cảnh các vật dụng Đền Tạm, “đồng” là cách dịch quen thuộc và không xác định quá mức thành phần hợp kim.
- source_word: בְּמַרְאֹת
  choice: từ những chiếc gương
  rationale: 'Giới từ ב ở đây hợp lý nhất khi chỉ vật liệu hoặc nguồn: chậu và chân chậu được làm từ các gương.'
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: các phụ nữ phục vụ
  rationale: Cấu trúc lặp từ gốc צבא gợi việc tập hợp có tổ chức để làm nhiệm vụ. “Phục vụ” diễn đạt hoạt động có mục đích mà không mặc nhiên gán cho họ chức vụ tư tế.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: tại lối vào Lều Hội Kiến
  rationale: Diễn đạt tự nhiên vị trí ở cửa/lối vào của lều dùng cho cuộc gặp theo ngữ cảnh Đền Tạm.
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ số ít tiếp nối mạch kể chuyện; “ông” giữ chủ thể ngầm theo văn cảnh mà không thêm tên không có trong câu.
theological_decisions:
- issue: Vai trò của הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: các phụ nữ phục vụ tại lối vào Lều Hội Kiến
  alternative: các phụ nữ tụ họp tại lối vào Lều Hội Kiến
  rationale: Gốc צבא có thể nhấn mạnh cả sự tập hợp có tổ chức lẫn việc đảm nhiệm công tác. Bản dịch chính dùng “phục vụ” theo ngữ cảnh thánh sở, còn chú thích giữ lại khả năng “tụ họp”, không xác quyết một chức vụ nghi lễ cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lều Hội Kiến” được dùng như thuật ngữ Kinh Thánh quen thuộc; các chú thích giữ sự mơ hồ thực sự của động từ צבא và giải thích bối cảnh vật chất của gương cổ.
