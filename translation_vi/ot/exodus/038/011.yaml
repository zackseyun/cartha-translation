base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: vi
  text: Về phía bắc, chiều dài là một trăm cu-bít; có hai mươi trụ và hai mươi đế bằng đồng. Các móc của trụ và các đai[a] đều bằng bạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nẹp” hoặc “các thanh nối”. Từ Hê-bơ-rơ chỉ những chi tiết kiến trúc bằng bạc gắn với các trụ; hình dạng chính xác không rõ.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: về phía bắc
  rationale: פֵּאָה chỉ một phía hoặc cạnh; kết hợp với צָפוֹן, cụm từ nói đến phía bắc của sân. “Về phía bắc” tự nhiên trong văn phong liệt kê.
- source_word: מֵאָה בָאַמָּה
  choice: chiều dài là một trăm cu-bít
  rationale: Cụm từ nêu số đo của cạnh phía bắc. Thêm “chiều dài là” làm rõ quan hệ cú pháp vốn được diễn đạt cô đọng trong tiếng Hê-bơ-rơ; “cu-bít” giữ nguyên đơn vị đo cổ.
- source_word: עַמּוּדֵיהֶם
  choice: hai mươi trụ
  rationale: עַמּוּדִים là các trụ chống đỡ. Đại từ sở hữu số nhiều trong tiếng Hê-bơ-rơ được diễn đạt hàm ẩn để câu tiếng Việt tự nhiên mà không làm thay đổi số lượng hay quan hệ với cạnh sân.
- source_word: אַדְנֵיהֶם
  choice: hai mươi đế
  rationale: אֶדֶן trong phần mô tả Đền Tạm là phần đế hoặc bệ giữ trụ. “Đế” rõ nghĩa hơn “ổ trụ” đối với độc giả phổ thông.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng hoặc hợp kim đồng trong bối cảnh cổ đại. “Đồng” là cách gọi tự nhiên, không khẳng định quá mức thành phần hợp kim cụ thể.
- source_word: וָוֵי הָעַמּוּדִים
  choice: các móc của trụ
  rationale: וָוִים ở đây là các móc gắn với trụ, không phải cọc lều. Cách dịch này giữ đúng chức năng và quan hệ sở hữu.
- source_word: חֲשֻׁקֵיהֶם
  choice: các đai
  rationale: Từ này chỉ những chi tiết kiến trúc bằng bạc gắn với các trụ, có thể là đai, nẹp hoặc thanh nối. “Đai” dễ hiểu và phản ánh ý niệm bao hoặc giữ, nhưng sự bất định được ghi ở chú thích.
- source_word: כָּסֶף
  choice: bạc
  rationale: Đây là từ thông dụng chỉ kim loại bạc; trong câu, nó nêu vật liệu của cả móc lẫn các đai.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ nhịp liệt kê của bản Hê-bơ-rơ nhưng chia thành hai câu để tránh cấu trúc nặng nề. Dùng “cu-bít” để bảo toàn đơn vị đo cổ và gắn dấu chú thích với chính từ ngữ còn bất định.
