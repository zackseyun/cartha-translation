translation:
  language: vi
  text: Bốn trụ và bốn đế bằng đồng của chúng[a]; các móc bằng bạc của chúng; lớp bọc các đầu trụ của chúng[b] và các đai bằng bạc của chúng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ổ trụ”; từ Hê-bơ-rơ chỉ các bộ phận kim loại nâng đỡ ở chân trụ.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “lớp bọc các đầu của chúng”; cũng có thể dịch là “lớp mạ trên các đầu trụ”.'
    reason: lexical_alternative
  - marker: c
    text: Hình dạng chính xác của những chi tiết bằng bạc này không chắc chắn; theo truyền thống, thuật ngữ này thường được dịch là “đai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: các trụ của chúng
  rationale: עַמּוּד chỉ trụ hay cột; trong ngữ cảnh cấu trúc sân Đền Tạm, “trụ” là cách gọi tự nhiên và chính xác.
- source_word: אַדְנֵיהֶם
  choice: các đế của chúng
  rationale: אֶדֶן chỉ những bộ phận kim loại nâng đỡ ở chân trụ. “Đế” rõ nghĩa trong tiếng Việt hiện đại; “ổ trụ” là một khả năng kỹ thuật hơn.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ này có thể chỉ đồng hoặc hợp kim đồng; “đồng” là cách gọi tự nhiên trong tiếng Việt và không xác định quá mức thành phần hợp kim.
- source_word: וָוֵיהֶם
  choice: các móc
  rationale: וָו chỉ chi tiết dùng để móc hoặc gắn trong khung Đền Tạm; “móc” phù hợp với chức năng trong mô tả sân.
- source_word: כֶּסֶף
  choice: bạc
  rationale: Danh từ vật liệu này chỉ bạc trong cả hai lần xuất hiện.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: phần bọc trên đầu trụ
  rationale: צִפּוּי là lớp hay phần bọc phủ, còn רָאשֵׁיהֶם theo nghĩa đen là “đầu của chúng”; thêm “trụ” làm rõ sở chỉ mà không thay đổi ý nghĩa.
- source_word: חֲשֻׁקֵיהֶם
  choice: các đai
  rationale: Hình dạng chính xác của חֲשֻׁקִים trong cấu trúc này không chắc chắn. “Đai” là từ hiện đại, dễ hiểu và không diễn giải quá cụ thể.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích, phù hợp với một câu liệt kê vật liệu xây dựng. Giữ các cụm chỉ vật liệu “bằng đồng/bằng bạc” tự nhiên trong tiếng Việt, đồng thời bảo toàn cấu trúc danh từ của nguyên văn.
