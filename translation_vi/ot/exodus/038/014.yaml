  source_fidelity: 'Bản dịch phản ánh đúng các thành phần của tiếng Hê-bơ-rơ: các tấm màn che, số đo mười lăm cu-bít, một bên/cạnh, ba trụ và ba đế. Cách diễn đạt “dài mười lăm cu-bít” làm rõ chức năng của số đo theo văn cảnh mà không thêm ý nghĩa đáng kể.'
  naturalness: 'Câu tiếng Việt hiện đại, gọn và rõ: “Các tấm màn ở một bên dài mười lăm cu-bít; có ba trụ và ba đế trụ.” Cấu trúc “có ba...” tự nhiên và trong văn cảnh vẫn bảo toàn quan hệ của trụ và đế với phần màn vừa nêu.'
  terminology: “Tấm màn” phù hợp với các màn vải bao quanh sân Đền Tạm; “trụ” và “đế trụ” nhất quán với ngữ cảnh kiến trúc. “Cu-bít” giữ được đơn vị đo cổ của nguyên văn. Không cần chú thích vì “đế trụ” đã truyền đạt rõ nghĩa của אַדָנִים; “ổ trụ/ổ cắm” chỉ là phương án từ vựng, không phải khác biệt cần thiết.
