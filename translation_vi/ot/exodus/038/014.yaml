  text: Fifteen cubits of hangings were for one side; their pillars were three[a], and their bases were three.
translation:
  language: vi
  text: Các tấm màn ở một bên dài mười lăm cu-bít; có ba trụ và ba đế trụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְלָעִים
  choice: các tấm màn
  rationale: Trong ngữ cảnh sân Đền Tạm, danh từ này chỉ các màn vải tạo thành hàng rào bao quanh; “các tấm màn” tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: dài mười lăm cu-bít
  rationale: Nguyên văn nêu số đo mà không có tính từ chỉ chiều; thêm “dài” làm rõ chức năng của số đo trong tiếng Việt mà không thay đổi nội dung.
- source_word: אֶל הַכָּתֵף
  choice: ở một bên
  rationale: כָּתֵף theo nghĩa đen là “vai” và tại đây chỉ một phía hay một bên của khu vực cổng sân; “ở một bên” diễn đạt tự nhiên ý nghĩa không gian.
- source_word: עַמּוּדֵיהֶם
  choice: ba trụ
  rationale: Danh từ chỉ các trụ đỡ màn. Cấu trúc “có ba trụ” truyền đạt tự nhiên mệnh đề sở hữu của tiếng Hê-bơ-rơ và tránh đại từ số nhiều gượng ép trong tiếng Việt.
- source_word: אַדְנֵיהֶם
  choice: ba đế trụ
  rationale: Từ này chỉ các bộ phận làm chân hoặc ổ đỡ cho trụ. “Đế trụ” rõ nghĩa hơn “đế” đứng riêng và phù hợp với kiến trúc Đền Tạm.
