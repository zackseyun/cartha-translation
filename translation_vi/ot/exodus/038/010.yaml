base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/010.yaml
  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: vi
  text: Có hai mươi trụ và hai mươi đế bằng đồng; các móc của trụ và các đai của trụ[a] đều bằng bạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ được dịch là “đai” là một thuật ngữ kỹ thuật hiếm; có thể chỉ các đai hoặc các bộ phận liên kết gắn với trụ. Hình dạng chính xác không rõ.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: hai mươi trụ
  rationale: עַמּוּדִים chỉ các trụ đứng trong kết cấu sân; tiếng Việt không cần biểu thị đại từ sở hữu ở đây vì quan hệ với phần sân vừa nói đã rõ trong ngữ cảnh.
- source_word: עֶשְׂרִים
  choice: hai mươi
  rationale: Số từ được dịch trực tiếp trong cả hai lần xuất hiện.
- source_word: אַדְנֵיהֶם
  choice: hai mươi đế
  rationale: אֶדֶן trong ngữ cảnh Đền Tạm là bộ phận kê hoặc giữ chân trụ; “đế” tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng đỏ hoặc đồng hợp kim; “đồng” giữ được độ rộng nghĩa của từ Hê-bơ-rơ và là cách gọi vật liệu tự nhiên trong tiếng Việt.
- source_word: וָוֵי הָעַמֻּדִים
  choice: các móc của trụ
  rationale: וָוִים là các móc hoặc bộ phận móc nối gắn với trụ; cách dịch này sát chức năng và rõ nghĩa.
- source_word: חֲשֻׁקֵיהֶם
  choice: các đai nối trụ
  rationale: Từ hiếm này chỉ những bộ phận dạng đai hoặc thanh liên kết liên quan đến các trụ. “Đai nối trụ” vừa dễ hình dung vừa không khẳng định quá mức hình dạng chính xác.
- source_word: כָּסֶף
  choice: bạc
  rationale: Tên vật liệu được dịch trực tiếp.
theological_decisions: []
