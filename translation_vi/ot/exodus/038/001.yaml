  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: vi
  text: Ông làm bàn thờ dâng lễ thiêu bằng gỗ keo. Bàn thờ dài năm am-ma, rộng năm am-ma, có hình vuông[a] và cao ba am-ma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: vuông bốn cạnh.'
    reason: Giữ lại sắc thái diễn đạt thay thế của רָבוּעַ, từ có thể được dịch là “hình vuông” hoặc theo lối sát chữ hơn là “vuông bốn cạnh”.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ עשה với waw liên tiếp kể một hành động đã xảy ra. “Ông làm” tự nhiên trong tiếng Việt và giữ chủ thể số ít giống đực được xác định từ văn cảnh.
- source_word: מִזְבַּח הָעֹלָה
  choice: bàn thờ dâng lễ thiêu
  rationale: Cụm từ chỉ bàn thờ gắn với עֹלָה, lễ vật được thiêu trọn trên bàn thờ. Cách dịch này rõ nghĩa và không thêm một cách hiểu thần học riêng.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: שִׁטִּים chỉ loại gỗ acacia; “gỗ keo” là tên gọi thông dụng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: חָמֵשׁ אַמּוֹת
  choice: năm am-ma
  rationale: Giữ nguyên đơn vị đo cổ אַמָּה bằng dạng phiên âm quen dùng, thay vì quy đổi sang đơn vị hiện đại vốn đòi hỏi chọn một trị số không hoàn toàn chắc chắn.
- source_word: אָרְכּוֹ / רָחְבּוֹ / קֹמָתוֹ
  choice: dài / rộng / cao
  rationale: Chuyển các danh từ chỉ kích thước sang cấu trúc tính từ tự nhiên của tiếng Việt, đồng thời bảo toàn đầy đủ ba chiều kích của bàn thờ.
- source_word: רָבוּעַ
  choice: có hình vuông
  rationale: Trong mô tả kiến trúc, רָבוּעַ chỉ vật có dạng vuông; “có hình vuông” là cách diễn đạt hiện đại, rõ ràng.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được chia làm hai để phần vật liệu và các kích thước rõ ràng hơn; không bổ sung chi tiết ngoài nguyên văn.
