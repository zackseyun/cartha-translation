  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính: ông làm, các đòn khiêng, gỗ keo, và phủ/bọc bằng kim loại. Tuy nhiên, động từ וַיְצַף có tân ngữ số nhiều rõ ràng («chúng» tức các đòn); việc nêu tân ngữ trong tiếng Việt giúp câu không bị hiểu là «bọc đồng» theo một cấu trúc thiếu đối tượng.'
  naturalness: «Đòn khiêng» là cách gọi rõ nghĩa và phù hợp văn cảnh. Cụm «bọc đồng» ở cuối câu chưa tự nhiên bằng «bọc chúng bằng đồng»; bản sửa giữ lối văn hiện đại, trang trọng và súc tích.
  terminology: «Gỗ keo» là cách dịch hiện đại có thể chấp nhận cho עֲצֵי שִׁטִּים. «Đồng» trong chính văn giữ được sự chưa xác định hoàn toàn của נְחֹשֶׁת; chú thích nên diễn đạt lựa chọn «copper/bronze» bằng thuật ngữ Việt ngữ minh bạch hơn.
  issues:
