  text: He made the poles of acacia wood and overlaid them with bronze[a].
translation:
  language: vi
  text: Ông làm các đòn khiêng bằng gỗ keo và bọc chúng bằng đồng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ này cũng có thể chỉ đồng đỏ hoặc đồng thiếc (hợp kim đồng-thiếc).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ Qal wayyiqtol của עשה tiếp nối mạch kể chuyện. Tiếng Việt có thể không cần dịch riêng liên từ וַ־, còn “ông” quy chiếu tự nhiên về Bết-sa-lê-ên trong ngữ cảnh.
- source_word: הַבַּדִּים
  choice: các đòn khiêng
  rationale: Trong ngữ cảnh vật dụng Đền Tạm, בַּדִּים là những đòn dùng để khiêng. “Đòn khiêng” rõ chức năng hơn “thanh” và tự nhiên trong tiếng Việt.
- source_word: עֲצֵי שִׁטִּים
  choice: bằng gỗ keo
  rationale: Cụm cấu tạo chỉ loại gỗ lấy từ cây שִׁטָּה. “Gỗ keo” là cách gọi quen thuộc, dễ hiểu trong tiếng Việt hiện đại.
- source_word: וַיְצַף
  choice: và bọc
  rationale: Trong ngữ cảnh chế tác, צפה diễn tả việc phủ một lớp kim loại lên vật thể. “Bọc” ngắn gọn, tự nhiên và chính xác.
- source_word: אֹתָם
  choice: '[lược trong cấu trúc tiếng Việt]'
  rationale: Đại từ tân ngữ số nhiều quy chiếu về các đòn khiêng. Trong câu tiếng Việt, đối tượng đã được nêu trực tiếp trước động từ “bọc”, nên không cần lặp “chúng”.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Từ này có thể chỉ đồng đỏ hoặc đồng thiếc. “Đồng” giữ được độ rộng nghĩa của tiếng Hê-bơ-rơ và tự nhiên hơn trong tiếng Việt; chú thích nêu rõ hai khả năng vật liệu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích. Dùng “đòn khiêng” để biểu đạt rõ chức năng; dùng “đồng” trong chính văn nhằm bảo toàn sự mơ hồ từ vựng của נְחֹשֶׁת, thay vì quyết định dứt khoát giữa đồng đỏ và đồng thiếc.
