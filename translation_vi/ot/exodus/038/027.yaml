base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: vi
  text: 'Một trăm ta-lâng bạc được dùng để đúc các đế[a] của Nơi Thánh và các đế của bức màn[b]: một trăm đế ứng với một trăm ta-lâng, mỗi đế một ta-lâng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ổ đỡ”, tức các bộ phận kim loại làm nền cho khung và các trụ của Đền Tạm.
    reason: lexical_alternative
  - marker: b
    text: “Bức màn” là màn phía trong, ngăn cách Nơi Thánh với Nơi Chí Thánh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: được dùng
  rationale: Trong ngữ cảnh kiểm kê, động từ nêu công dụng của số bạc; cách dịch này tự nhiên trong tiếng Việt và phù hợp với động từ mục đích theo sau.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: một trăm ta-lâng bạc
  rationale: Giữ nguyên số lượng và đơn vị đo cổ, đồng thời diễn đạt cụm đo lường tự nhiên trong tiếng Việt.
- source_word: לָצֶקֶת
  choice: để đúc
  rationale: Động từ nguyên mẫu chỉ mục đích; trong ngữ cảnh gia công kim loại, từ này nói đến việc đúc.
- source_word: אַדְנֵי
  choice: các đế
  rationale: Chỉ những bộ phận kim loại làm nền đỡ cho khung và các trụ; “đế” rõ nghĩa hơn với độc giả hiện đại, còn phương án “ổ đỡ” được ghi ở chú thích.
- source_word: הַקֹּדֶשׁ
  choice: Nơi Thánh
  rationale: Chỉ công trình thánh, tức phần lều thánh được đặt trên các đế; viết hoa để biểu thị tên gọi không gian thờ phượng mà không thu hẹp thành Nơi Chí Thánh.
- source_word: הַפָּרֹכֶת
  choice: bức màn
  rationale: Chỉ bức màn bên trong phân cách Nơi Thánh với Nơi Chí Thánh; “bức màn” tự nhiên trong tiếng Việt, và chú thích làm rõ chức năng chuyên biệt.
- source_word: לִמְאַת הַכִּכָּר
  choice: từ một trăm ta-lâng
  rationale: Ở đây giới từ có thể biểu thị sự tương ứng hoặc nguồn vật liệu. “Từ” phù hợp với lời tổng kết việc dùng bạc mà không làm mất tỷ lệ được câu cuối xác nhận.
- source_word: כִּכָּר לָאָדֶן
  choice: mỗi đế một ta-lâng
  rationale: 'Diễn đạt gọn và rõ tỷ lệ phân bổ: một ta-lâng cho từng đế.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ đơn vị cổ “ta-lâng” thay vì quy đổi vì trọng lượng chính xác có thể khác nhau theo hệ đo; cấu trúc cuối câu bảo toàn phép đối ứng một trăm ta-lâng—một trăm đế.
