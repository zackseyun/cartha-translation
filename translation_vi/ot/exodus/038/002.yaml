  text: וַ/יַּ֣עַשׂ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ הָי֣וּ קַרְנֹתָ֑י/ו וַ/יְצַ֥ף אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: vi
  text: Ông làm các sừng ở bốn góc bàn thờ; các sừng ấy liền một khối với bàn thờ[a]. Rồi ông bọc bàn thờ bằng đồng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “các sừng của nó từ nó mà ra”, hàm ý các sừng được làm liền với bàn thờ chứ không phải làm riêng rồi gắn vào.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ neḥoshet có thể chỉ đồng đỏ hoặc đồng thiếc; trong ngữ cảnh các vật dụng Đền Tạm, từ này thường được dịch là “đồng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Động từ עשה trong mạch kể chuyện diễn tả hành động chế tạo; “làm” tự nhiên, rõ ràng và không thêm sắc thái ngoài nguyên văn.
- source_word: קַרְנֹתָיו
  choice: các sừng
  rationale: קֶרֶן nghĩa đen là “sừng”; trong ngữ cảnh bàn thờ, từ này chỉ các phần nhô lên như sừng tại các góc. Giữ hình ảnh cụ thể và thuật ngữ quen thuộc.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: ở bốn góc bàn thờ
  rationale: Cụm từ xác định vị trí của các sừng. Dùng “bàn thờ” thay cho đại từ sở hữu để câu tiếng Việt rõ nghĩa theo ngữ cảnh ngay trước đó.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: các sừng ấy liền một khối với bàn thờ
  rationale: Nguyên văn sát nghĩa là “các sừng của nó từ nó mà ra”; trong ngôn ngữ chế tác, cụm này cho biết các sừng không phải bộ phận làm riêng rồi gắn vào. “Liền một khối” truyền đạt ý đó tự nhiên mà chú thích vẫn bảo lưu cấu trúc nguyên văn.
- source_word: וַיְצַף אֹתוֹ
  choice: ông bọc bàn thờ
  rationale: Trong mô tả chế tác Đền Tạm, צפה chỉ việc phủ hoặc ốp một vật bằng kim loại. “Bọc” là cách nói tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: נְחֹשֶׁת có thể chỉ đồng đỏ hoặc hợp kim đồng, thường được hiểu là đồng thiếc trong ngữ cảnh các vật dụng Đền Tạm. Từ “đồng” tự nhiên trong tiếng Việt và không thu hẹp quá mức sự không xác định của từ Hê-bơ-rơ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại “bàn thờ” thay cho các đại từ “nó” để tránh mơ hồ trong tiếng Việt; giữ thuật ngữ cụ thể “sừng” và bảo lưu sự không xác định về loại kim loại trong chú thích.
