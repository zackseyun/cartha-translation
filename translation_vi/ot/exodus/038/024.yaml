revisions:
- from: Toàn bộ số vàng được dùng cho công việc, tức mọi công việc của Nơi Thánh—là vàng thuộc lễ vật dâng đưa qua đưa lại[a]—nặng hai mươi chín ta-lâng và bảy trăm ba mươi siếc-lơ[b], theo siếc-lơ Nơi Thánh.
  to: Toàn bộ vàng được dùng cho công việc, cho mọi công việc thánh—tức vàng của lễ vật đưa qua[a]—là hai mươi chín ta-lâng và bảy trăm ba mươi siếc-lơ[b], theo siếc-lơ thánh.
  rationale: Bản sửa bảo toàn cấu trúc tổng kết và số liệu của bản Hê-bơ-rơ, nhưng diễn đạt quan hệ “cho công việc, cho mọi công việc thánh” tự nhiên hơn. “Lễ vật đưa qua” giữ thuật ngữ nghi lễ cho תְּנוּפָה, còn chú thích giải thích vừa đủ mà không áp đặt cách hiểu cụ thể về hướng của động tác. “Theo siếc-lơ thánh” phản ánh chuẩn cân thiêng liêng (בְּשֶׁקֶל הַקֹּדֶשׁ) một cách gọn và trang trọng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:42:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng số lượng, các đơn vị cân cổ và ý nghĩa của בְּשֶׁקֶל הַקֹּדֶשׁ là tiêu chuẩn cân. Tuy nhiên, “tức mọi công việc” làm quan hệ cú pháp giữa hai cụm לַמְּלָאכָה / בְּכֹל מְלֶאכֶת hơi gượng, và “đưa qua đưa lại” diễn giải quá cụ thể động tác của תְּנוּפָה.
  naturalness: Câu được chỉnh để tiếng Việt trang trọng, rõ ràng và bớt lặp/gượng cú pháp. “Lễ vật đưa qua” giữ một thuật ngữ nghi lễ ngắn gọn; chú thích giải thích mà không khẳng định một hướng chuyển động cụ thể.
  terminology: Dùng “lễ vật đưa qua” cho תְּנוּפָה, thay vì mô tả “đưa qua đưa lại”. Dùng “công việc thánh” cho מְלֶאכֶת הַקֹּדֶשׁ để tránh đồng nhất הַקֹּדֶשׁ với một phòng riêng (“Nơi Thánh”) trong ngữ cảnh tổng quát về công trình thánh.
  issues:
  - severity: medium
    issue: “tức mọi công việc của Nơi Thánh” không phản ánh tự nhiên quan hệ của cụm giới từ thứ hai.
    rationale: Bản Hê-bơ-rơ nói vàng được dùng cho công việc, trong/toàn bộ công việc thánh; “tức” biến cụm này thành một sự đồng nhất giải thích không cần thiết và làm câu Việt gượng.
  - severity: medium
    issue: “lễ vật dâng đưa qua đưa lại” và chú thích xác định động tác “đưa qua đưa lại” quá mức.
    rationale: תְּנוּפָה là thuật ngữ kỹ thuật về lễ vật được cử hành bằng nghi thức chuyển động/trình dâng; bản văn không quy định rõ chuyển động phải là qua lại. Cần giữ tính khái quát của thuật ngữ.
  - severity: low
    issue: “Nơi Thánh” có thể bị hiểu là khu vực Holy Place chuyên biệt.
    rationale: הַקֹּדֶשׁ ở đây mô tả toàn bộ công việc thánh/sanctuary; “công việc thánh” tự nhiên hơn và tránh thu hẹp quy chiếu.
