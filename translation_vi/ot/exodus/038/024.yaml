base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: vi
  text: Toàn bộ vàng được dùng cho công việc, cho mọi công việc thánh—tức vàng của lễ vật đưa qua[a]—là hai mươi chín ta-lâng và bảy trăm ba mươi siếc-lơ[b], theo siếc-lơ thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lễ vật đưa qua” là lễ vật được trình dâng trước mặt Đức Giê-hô-va bằng một động tác nghi lễ.
    reason: cultural_note
  - marker: b
    text: Ta-lâng và siếc-lơ là các đơn vị trọng lượng cổ. Một ta-lâng bằng 3.000 siếc-lơ; tổng số vàng ở đây là 87.730 siếc-lơ.
    reason: weights_and_measures
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: được dùng cho công việc
  rationale: Phân từ bị động của עשה trong ngữ cảnh kiểm kê nói đến số vàng được sử dụng vào công trình; cách dịch này tránh khiến người đọc hiểu rằng chính vàng được chế tạo.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: tức mọi công việc của Nơi Thánh
  rationale: Cụm từ bao quát toàn bộ công việc thiêng liêng liên quan đến Đền Tạm. “Nơi Thánh” diễn đạt הַקֹּדֶשׁ tự nhiên trong ngữ cảnh và “tức” làm rõ quan hệ bổ nghĩa của cụm từ.
- source_word: זְהַב הַתְּנוּפָה
  choice: vàng thuộc lễ vật dâng đưa qua đưa lại
  rationale: תְּנוּפָה chỉ lễ vật được trình dâng bằng một động tác nghi lễ. Cách dịch mô tả này giữ nét nghĩa của thuật ngữ mà vẫn dễ hiểu với độc giả hiện đại.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר
  choice: hai mươi chín ta-lâng
  rationale: Giữ nguyên đơn vị trọng lượng cổ và chuyển trật tự số từ Hê-bơ-rơ sang cách nói tiếng Việt tự nhiên.
- source_word: וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: và bảy trăm ba mươi siếc-lơ
  rationale: Dịch trực tiếp số lượng, đồng thời giữ đơn vị trọng lượng cổ để không tạo độ chính xác giả qua việc quy đổi.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: theo siếc-lơ Nơi Thánh
  rationale: Giới từ בְּ ở đây nêu tiêu chuẩn cân đo; “theo” diễn đạt tự nhiên rằng trọng lượng được tính theo chuẩn siếc-lơ dùng tại Nơi Thánh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ các đơn vị cổ dưới dạng phiên âm, dùng “Nơi Thánh” nhất quán cho הַקֹּדֶשׁ trong ngữ cảnh Đền Tạm, và đặt dấu gạch ngang để bảo toàn cấu trúc giải thích của câu Hê-bơ-rơ.
