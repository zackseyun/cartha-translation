  yaml_path: translation/ot/exodus/038/004.yaml
  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: vi
  text: Ông làm cho bàn thờ một tấm vỉ bằng đồng, làm theo kiểu lưới, ở phía dưới gờ của bàn thờ, từ phía dưới lên đến giữa bàn thờ[c].[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “một tấm vỉ, làm theo dạng lưới, bằng đồng.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hê-bơ-rơ chỉ bộ phận kết cấu này cũng có thể dịch là “vành,” “đường gờ nổi” hoặc “phần bao quanh.”
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn cũng có thể hiểu là: “từ bên dưới đến phần giữa của nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ông làm
  rationale: Dạng wayyiqtol tiếp nối trình thuật. Tiếng Việt không cần buộc phải thêm “và” hay “rồi” ở đầu câu.
- source_word: לַמִּזְבֵּחַ
  choice: cho bàn thờ
  rationale: Giới từ ל diễn tả vật được làm dành cho bàn thờ, không đơn thuần chỉ vị trí trên bàn thờ.
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: một tấm vỉ bằng lưới
  rationale: מִכְבָּר chỉ một vỉ hoặc tấm chắn dạng lưới; cụm מַעֲשֵׂה רֶשֶׁת mô tả cấu tạo đan thành lưới. Cách dịch này tự nhiên và dễ hình dung trong tiếng Việt.
- source_word: נְחֹשֶׁת
  choice: đồng
  rationale: Trong ngữ cảnh các vật dụng của Đền Tạm, “đồng” là cách gọi truyền thống, tự nhiên và đủ rộng trong tiếng Việt; từ Hê-bơ-rơ có thể chỉ đồng hoặc hợp kim đồng.
- source_word: תַּחַת כַּרְכֻּבּוֹ
  choice: bên dưới gờ của bàn thờ
  rationale: תַּחַת diễn tả vị trí phía dưới. כַּרְכֻּבּוֹ là một bộ phận nhô hoặc bao quanh bàn thờ; “gờ” truyền đạt rõ đặc điểm kết cấu mà không xác định quá mức hình dạng.
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: từ phía dưới lên đến nửa chiều cao của bàn thờ
  rationale: Cách diễn đạt làm rõ hướng và giới hạn theo chiều đứng vốn hàm ý trong ngữ cảnh, đồng thời giữ cách hiểu sát hơn “đến phần giữa của nó” trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” nối tiếp chủ thể nam đã được xác định trong mạch văn. Câu được sắp xếp tự nhiên theo tiếng Việt, đồng thời các chú thích bảo lưu những khả năng từ vựng và cấu trúc không hoàn toàn chắc chắn của nguyên văn.
