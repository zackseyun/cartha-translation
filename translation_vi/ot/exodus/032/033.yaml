    rationale: Dù không sai nghĩa, “chống lại Ta” là cách diễn đạt hiện đại, rõ nghĩa hơn cho hành vi phạm tội hướng đến Đức Giê-hô-va, mà không thay đổi sắc thái thần học hay ngữ pháp của nguyên văn.
