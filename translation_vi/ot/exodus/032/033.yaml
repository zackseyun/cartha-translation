base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: vi
  text: 'Đức Giê-hô-va phán với Môi-se: “Ai đã phạm tội chống lại Ta, Ta sẽ xóa người ấy khỏi sách của Ta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sách của Ta” có thể chỉ sổ ghi những người ở dưới sự chăm sóc của Đức Chúa Trời; một số người hiểu cụ thể hơn là “sách sự sống”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Động từ mở đầu tiếp nối mạch kể chuyện; trong tiếng Việt, “phán” là cách diễn đạt tự nhiên, trang trọng khi Đức Chúa Trời nói.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Giữ danh riêng của Đức Chúa Trời thay vì thay bằng một tước hiệu; dạng “Giê-hô-va” quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: אֶל מֹשֶׁה
  choice: với Môi-se
  rationale: Diễn đạt tự nhiên cấu trúc chỉ người tiếp nhận lời nói; dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: מִי אֲשֶׁר
  choice: Ai
  rationale: Cấu trúc quan hệ bất định được chuyển tự nhiên sang tiếng Việt bằng “Ai”, giữ ý khái quát “bất cứ người nào”.
- source_word: חָטָא לִי
  choice: đã phạm tội nghịch cùng Ta
  rationale: “Đã phạm tội” phản ánh hành động đã xảy ra trong ngữ cảnh; “nghịch cùng Ta” giữ hướng của hành vi phạm tội đối với Đức Chúa Trời.
- source_word: אֶמְחֶנּוּ
  choice: Ta sẽ xóa người ấy
  rationale: “Xóa” giữ hình ảnh loại bỏ một tên hay một người khỏi văn bản hoặc sổ ghi chép; “người ấy” truyền đạt hậu tố giống đực số ít mà vẫn tự nhiên trong tiếng Việt.
- source_word: מִסִּפְרִי
  choice: khỏi sách của Ta
  rationale: “Khỏi” kết hợp tự nhiên với “xóa”; “sách của Ta” giữ nguyên ẩn dụ rộng của nguyên văn mà không xác định đó là loại sách nào.
theological_decisions:
- issue: Bản chất của “sách của Ta”
  choice: Giữ nguyên ẩn dụ “sách của Ta” mà không xác định nội dung hay chức năng của sách.
  alternative: “sách sự sống”, “sổ ghi những người đang sống” hoặc “sổ giao ước”
  rationale: Nguyên văn chỉ nói “sách của Ta”. Việc cụ thể hóa thành “sách sự sống” hay một loại sổ nào khác sẽ giải quyết một điều mà câu Hê-bơ-rơ vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” trong lời Đức Chúa Trời để phù hợp ngữ vực Kinh Thánh tiếng Việt; giữ câu ngắn, trực tiếp và hình ảnh “xóa khỏi sách” của nguyên văn.
