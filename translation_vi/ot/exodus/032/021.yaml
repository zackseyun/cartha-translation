revisions:
- from: 'Môi-se nói với A-rôn: “Dân này đã làm gì anh mà anh lại khiến họ[a] mang một tội lớn?”'
  to: 'Môi-se nói với A-rôn: “Dân này đã làm gì anh mà anh lại khiến họ[a] phạm một tội lớn?”'
  rationale: Thay “khiến họ mang” bằng “khiến họ phạm” để diễn đạt tự nhiên và minh bạch việc A-rôn bị quy trách nhiệm khiến dân mắc một tội lớn. Giữ chú thích về đại từ số ít trong nguyên văn Hê-bơ-rơ, xưng hô giữa hai anh em, và các yếu tố khác của bản nháp.
