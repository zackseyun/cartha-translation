base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: vi
  text: 'Môi-se nói với A-rôn: “Dân này đã làm gì anh mà anh lại khiến họ[a] phạm một tội lớn?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng đại từ số ít, quy chiếu đến “dân” như một tập thể; tiếng Việt tự nhiên dùng “họ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: nói
  rationale: Đây là dạng kể chuyện wayyiqtol thông thường; tiếng Việt không cần dịch liên từ וַ־ thành “và” trong ngữ cảnh này.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: Dân này đã làm gì anh
  rationale: Giữ câu hỏi trực tiếp, lực chỉ định của הַזֶּה (“này”) và sắc thái phần nào xa cách; “làm gì anh” là cách diễn đạt tự nhiên cho עָשָׂה + לְ.
- source_word: כִּי
  choice: mà ... lại
  rationale: Trong câu hỏi này, כִּי nối việc dân đã làm với hậu quả do A-rôn gây nên. Kết cấu “mà ... lại” vừa tự nhiên trong tiếng Việt vừa thể hiện giọng quở trách.
- source_word: הֵבֵאתָ עָלָיו
  choice: khiến họ mang
  rationale: Hiphil của בוא có nghĩa “đem đến/khiến đến”; cách dịch này truyền đạt việc A-rôn làm cho tội đến trên dân mà không giảm nhẹ trách nhiệm của ông. “Mang” cũng tránh quyết định quá mức giữa hành vi phạm tội và tình trạng mắc tội.
- source_word: חֲטָאָה גְדֹלָה
  choice: một tội lớn
  rationale: Dịch trực tiếp חֲטָאָה là “tội” và גְדֹלָה là “lớn”, không thêm mức độ hay thuật ngữ giáo phái.
theological_decisions:
- issue: Mức độ quy trách nhiệm cho A-rôn
  choice: khiến họ mang một tội lớn
  alternative: khiến họ phạm một tội lớn
  rationale: Bản dịch giữ lời quy trách nhiệm trực tiếp cho A-rôn nhưng không diễn giải quá mức rằng ông chỉ “dẫn dụ” họ, cũng không thu hẹp חֲטָאָה thành riêng hành vi phạm tội hay riêng tình trạng mắc tội.
- issue: Số của đại từ עָלָיו
  choice: họ
  alternative: nó
  rationale: Đại từ Hê-bơ-rơ ở số ít vì quy chiếu đến danh từ tập hợp הָעָם (“dân”). Tiếng Việt tự nhiên dùng “họ” khi nói đến những người hợp thành dân chúng; chú thích bảo tồn đặc điểm hình thái của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “anh” phù hợp với lời Môi-se nói với người anh ruột A-rôn, tránh sắc thái cổ hoặc miệt thị không có trong nguyên văn.
