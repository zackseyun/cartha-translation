    issue: “khiến họ mang một tội lớn” không tự nhiên và có thể lệch sắc thái trách nhiệm đạo đức.
    rationale: הֵבֵאתָ עָלָיו חֲטָאָה גְדֹלָה quy cho A-rôn việc đưa/gây một tội lớn đến trên dân. Trong tiếng Việt, “mang một tội” dễ được hiểu là gánh tội hoặc chịu trách nhiệm về tội; “khiến họ phạm một tội lớn” diễn đạt rõ ràng hơn việc A-rôn làm dân rơi vào tội lỗi.
