revisions:
- from: 'Hãy nhớ đến Áp-ra-ham, Y-sác và Y-sơ-ra-ên[a], là các tôi tớ Ngài, những người Ngài đã lấy chính mình mà thề với họ và phán: “Ta sẽ làm cho dòng dõi các ngươi đông như sao trên trời. Ta sẽ ban cho dòng dõi các ngươi toàn bộ miền đất này mà Ta đã phán đến, và họ sẽ thừa hưởng miền đất ấy mãi mãi.”'
  to: 'Hãy nhớ đến Áp-ra-ham, Y-sác và Y-sơ-ra-ên[a], là các tôi tớ của Ngài, những người Ngài đã thề với họ bằng chính mình và phán với họ: “Ta sẽ làm cho dòng dõi các ngươi đông như sao trên trời. Ta sẽ ban cho dòng dõi các ngươi toàn bộ miền đất này mà Ta đã nói đến, và họ sẽ thừa hưởng miền đất ấy mãi mãi.”'
  rationale: 'Bản sửa chỉ làm sáng và tự nhiên hóa hai cách diễn đạt tiếng Việt. Cấu trúc nguyên văn vẫn được giữ: “miền đất này mà Ta đã nói đến” là mệnh đề quan hệ riêng, tiếp theo là lời hứa độc lập “Ta sẽ ban cho dòng dõi các ngươi”; không nhập hai mệnh đề này thành “Ta đã nói sẽ ban.”'
