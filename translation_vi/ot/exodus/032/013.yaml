base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: vi
  text: 'Hãy nhớ đến Áp-ra-ham, Y-sác và Y-sơ-ra-ên[a], là các tôi tớ của Ngài, những người Ngài đã thề với họ bằng chính mình và phán với họ: “Ta sẽ làm cho dòng dõi các ngươi đông như sao trên trời. Ta sẽ ban cho dòng dõi các ngươi toàn bộ miền đất này mà Ta đã nói đến, và họ sẽ thừa hưởng miền đất ấy mãi mãi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Y-sơ-ra-ên ở đây là tổ phụ Gia-cốp, người đã được đặt tên là Y-sơ-ra-ên. Bản Hê-bơ-rơ ghi “Y-sơ-ra-ên.”
    reason: Làm rõ nhân vật được gọi bằng tên giao ước mà không thay thế cách đọc của bản Hê-bơ-rơ.
lexical_decisions:
- source_word: זְכֹר
  choice: Hãy nhớ đến
  rationale: Mệnh lệnh số ít giống đực hướng đến Đức Chúa Trời trong lời cầu thay của Môi-se. “Hãy nhớ đến” tự nhiên trong tiếng Việt và giữ nguyên sắc thái kêu cầu dựa trên giao ước.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: Áp-ra-ham, Y-sác và Y-sơ-ra-ên
  rationale: Giữ đúng ba tên riêng trong bản Hê-bơ-rơ; đặc biệt, bản nguồn ghi “Y-sơ-ra-ên,” là tên giao ước của tổ phụ Gia-cốp.
- source_word: עֲבָדֶיךָ
  choice: các tôi tớ Ngài
  rationale: Trong ngữ cảnh này, עבד nói đến địa vị phụng sự Đức Chúa Trời của các tổ phụ hơn là tình trạng nô lệ xã hội; “tôi tớ” phù hợp và trang trọng.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: những người Ngài đã lấy chính mình mà thề với họ
  rationale: Cách dịch này giữ rõ việc chính Đức Chúa Trời là sự bảo chứng cho lời thề, đồng thời diễn đạt được lực phản thân của בָּךְ.
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: và phán
  rationale: “Phán” là cách diễn đạt tự nhiên, trang trọng khi Đức Chúa Trời nói, và dẫn vào lời trích trực tiếp mà không cần lặp lại đại từ gián tiếp vốn đã rõ.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: Ta sẽ làm cho dòng dõi các ngươi đông
  rationale: Động từ Hiphil của רבה mang nghĩa làm gia tăng; זרע là danh từ tập hợp, được dịch là “dòng dõi” để giữ cả ý tập thể lẫn mối liên hệ huyết thống.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: như sao trên trời
  rationale: Đây là thành ngữ tự nhiên trong tiếng Việt, truyền đạt đầy đủ hình ảnh so sánh của nguyên văn.
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: toàn bộ miền đất này
  rationale: “Miền đất” thể hiện đây là vùng đất được hứa ban; “toàn bộ” giữ lực nhấn mạnh của כָל.
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: mà Ta đã phán đến
  rationale: Giữ mệnh đề này tách biệt với lời hứa “Ta sẽ ban” theo cấu trúc Hê-bơ-rơ, tránh nhập nội dung của mệnh đề kế tiếp vào đây.
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: Ta sẽ ban cho dòng dõi các ngươi
  rationale: Thì tương lai của lời hứa được thể hiện bằng “sẽ ban”; “dòng dõi” nhất quán với lần xuất hiện trước của זרע.
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: và họ sẽ thừa hưởng miền đất ấy mãi mãi
  rationale: “Thừa hưởng” diễn đạt ý nhận làm cơ nghiệp của נחל. Tân ngữ “miền đất ấy” được bổ sung từ ngữ cảnh vì tiếng Việt cần nêu rõ đối tượng; “mãi mãi” giữ lực kéo dài của לְעֹלָם.
theological_decisions:
- issue: Dùng “Y-sơ-ra-ên” hay “Gia-cốp” cho vị tổ phụ
  choice: Giữ “Y-sơ-ra-ên” trong chính văn
  alternative: Gia-cốp
  rationale: Bản Hê-bơ-rơ ghi rõ “Y-sơ-ra-ên.” Thay bằng “Gia-cốp” sẽ làm mờ ý nghĩa gợi nhắc đến tên giao ước trong lời cầu thay của Môi-se.
- issue: Công thức lời thề בָּךְ
  choice: lấy chính mình mà thề
  alternative: nhân danh chính mình mà thề
  rationale: Cách chọn giữ được điểm thần học rằng Đức Chúa Trời lấy chính mình làm sự bảo chứng, nhưng không mở rộng nguyên văn thành một lời giải nghĩa giáo lý.
- issue: Đại từ số nhiều trong lời Đức Chúa Trời nói với các tổ phụ
  choice: các ngươi
  alternative: các con
  rationale: “Các ngươi” giữ trung tính hơn về quan hệ được hàm ý trong đại từ Hê-bơ-rơ số nhiều; “các con” có thể tự ý thêm sắc thái phụ tử không được đánh dấu rõ trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời Môi-se thưa với Đức Chúa Trời, “Ta” trong lời Đức Chúa Trời, và giữ “các ngươi” để tránh áp đặt một sắc thái quan hệ không được đánh dấu trong nguyên văn. Cấu trúc hai lời hứa được giữ rõ, không hợp nhất אֲשֶׁר אָמַרְתִּי với אֶתֵּן.
