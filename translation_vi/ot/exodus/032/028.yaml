base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: vi
  text: Con cháu Lê-vi làm theo lời Môi-se, và vào ngày đó, khoảng ba nghìn người trong dân đã ngã xuống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngã xuống” là một thành ngữ Hê-bơ-rơ thường dùng để chỉ việc chết hoặc bị hạ sát; cũng có thể dịch là “đã bị giết.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: làm theo
  rationale: Động từ עשה kết hợp với כִּדְבַר diễn tả việc thi hành điều Môi-se đã truyền; “làm theo” tự nhiên trong tiếng Việt và không thêm sắc thái ngoài văn bản.
- source_word: בְנֵי לֵוִי
  choice: con cháu Lê-vi
  rationale: Giữ hình ảnh gia tộc của cụm từ sát nghĩa “các con trai của Lê-vi,” đồng thời “con cháu” tự nhiên hơn và chỉ cộng đồng hậu duệ trong tiếng Việt hiện đại.
- source_word: כִּדְבַר מֹשֶׁה
  choice: lời Môi-se
  rationale: דָּבָר ở đây có nghĩa là lời truyền hay mệnh lệnh; giữ “lời” phản ánh cách diễn đạt của nguyên văn mà ngữ cảnh vẫn làm rõ ý.
- source_word: וַיִּפֹּל
  choice: đã ngã xuống
  rationale: Giữ thành ngữ Hê-bơ-rơ chỉ việc chết hoặc bị hạ sát, thay vì đưa thẳng một nguyên nhân cụ thể vào chính văn.
- source_word: מִן הָעָם
  choice: người trong dân
  rationale: 'Diễn đạt ý bộ phận của giới từ מִן: những người ngã xuống thuộc trong cộng đồng dân chúng.'
- source_word: בַּיּוֹם הַהוּא
  choice: trong ngày ấy
  rationale: Cách nói trang trọng, rõ nghĩa, thể hiện đầy đủ cụm thời gian của nguyên văn.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: khoảng ba nghìn người
  rationale: כְּ trước số từ biểu thị con số xấp xỉ; “người” là cách dịch tự nhiên của אִישׁ trong câu thống kê số người tử vong và không làm thay đổi phạm vi tham chiếu theo ngữ cảnh.
theological_decisions:
- issue: Cách diễn đạt số người tử vong trong bối cảnh phán xét
  choice: khoảng ba nghìn người trong dân đã ngã xuống
  alternative: khoảng ba nghìn người trong dân đã bị giết / đã chết
  rationale: Nguyên văn dùng động từ “ngã” như một thành ngữ, chứ không dùng trực tiếp động từ “giết.” Giữ “ngã xuống” bảo tồn sắc thái trang nghiêm và mức độ hàm ý của văn bản; chú thích giải thích nghĩa trong ngữ cảnh.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “con cháu Lê-vi” để vừa giữ cách gọi theo dòng tộc vừa tránh lối nói gượng “các con trai Lê-vi.” Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải nghĩa.
