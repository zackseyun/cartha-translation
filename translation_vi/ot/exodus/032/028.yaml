  terminology: Tên riêng “Lê-vi” và “Môi-se” nhất quán. “Con cháu Lê-vi” là cách diễn đạt Việt ngữ tự nhiên cho cụm chỉ dòng tộc, dù nguyên ngữ theo nghĩa đen là “các con trai của Lê-vi”; trong ngữ cảnh đây là nhóm Lê-vi. “Người” là cách chuyển đạt tự nhiên của אִישׁ trong thống kê này.
  issues:
