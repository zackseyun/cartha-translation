source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: vi
  text: Ông lấy con bê mà họ đã làm, đốt nó trong lửa, nghiền cho đến khi thật mịn, rắc lên mặt nước, rồi bắt con dân Israel[a] uống nước ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người Israel”. Theo nghĩa đen, nguyên văn là “các con trai Israel”, một danh xưng tập thể thông thường chỉ toàn dân.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: con bê
  rationale: עֵגֶל chỉ một con bò non; “con bê” vừa sát nghĩa vừa phù hợp với cách gọi quen thuộc “con bê vàng” trong ngữ cảnh.
- source_word: אֲשֶׁר עָשׂוּ
  choice: mà họ đã làm
  rationale: Mệnh đề quan hệ xác định đây là con bê do dân chúng làm trước đó; “đã làm” thể hiện tự nhiên quan hệ thời gian trong lời kể.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: đốt nó trong lửa
  rationale: Giữ hình ảnh cụ thể của động từ שׂרף và cụm בָּאֵשׁ; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: nghiền cho đến khi thật mịn
  rationale: טחן là “nghiền”, còn דק diễn tả trạng thái nhỏ, mịn; không thêm từ “bột” vì nguyên văn không nói rõ danh từ ấy.
- source_word: וַיִּזֶר עַל פְּנֵי הַמַּיִם
  choice: rắc lên mặt nước
  rationale: זרה diễn tả việc rải hoặc làm phân tán, còn פְּנֵי הַמַּיִם là “mặt nước”; “rắc lên mặt nước” rõ ràng và tự nhiên.
- source_word: וַיַּשְׁקְ
  choice: bắt … uống
  rationale: Dạng Hiphil của שׁקה mang nghĩa khiến hoặc cho uống. Trong ngữ cảnh hành động có tính cưỡng buộc, “bắt … uống” truyền đạt thích hợp sắc thái gây khiến.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  rationale: Cụm này theo mặt chữ là “các con trai/con cái của Israel” nhưng thường là danh xưng tập thể của dân giao ước. “Con dân Israel” giữ sắc thái thuộc về Israel mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch בְּנֵי יִשְׂרָאֵל
  choice: con dân Israel
  alternative: người Israel
  rationale: “Con dân Israel” bảo tồn phần nào hình thức và sắc thái giao ước của nguyên văn, đồng thời được hiểu là toàn thể cộng đồng chứ không chỉ nam giới. Cách dịch tự nhiên hơn “người Israel” được ghi ở chú thích.
- issue: Tân ngữ hàm ẩn của וַיַּשְׁקְ
  choice: uống nước ấy
  alternative: uống nó
  rationale: Tiếng Hê-bơ-rơ nói theo nghĩa đen “khiến con dân Israel uống” mà không nêu lại tân ngữ. Tiếng Việt cần làm rõ đối tượng được uống; “nước ấy” dựa trực tiếp vào danh từ “nước” ngay trước đó và tránh đại từ thiếu tự nhiên.
translation_notes:
  register: Văn phong kể chuyện trang trọng, rõ ràng và hiện đại. Chuỗi động từ liên tiếp giữ nhịp hành động của câu Hê-bơ-rơ; không thêm lời giải thích về mục đích hay ý nghĩa của việc bắt dân uống.
