source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה לֶךְ רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: vi
  text: 'Bấy giờ, Yahweh phán với Môi-se: “Hãy đi xuống, vì dân của con mà con đã đưa lên khỏi xứ Ai Cập đã hành động bại hoại.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã tự làm mình bại hoại.” Động từ Hê-bơ-rơ có thể nhấn mạnh tình trạng họ tự gây ra cho mình hơn là hành vi bại hoại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Bấy giờ ... phán
  rationale: Dạng tự sự có waw nối tiếp đẩy câu chuyện tiến lên; “Bấy giờ” tự nhiên trong văn kể tiếng Việt. “Phán” phù hợp với lời trực tiếp của Đức Chúa Trời mà vẫn trang trọng, dễ hiểu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ nguyên danh riêng của Đức Chúa Trời trong bản nguồn, thay vì thay bằng một tước hiệu.
- source_word: לֶךְ רֵד
  choice: Hãy xuống đi
  rationale: Hai mệnh lệnh theo sát mặt chữ là “hãy đi, hãy xuống”; trong tiếng Việt, “hãy xuống đi” chuyển tải tự nhiên một mệnh lệnh khẩn thiết mà không tạo ra sự lặp lại gượng gạo.
- source_word: כִּי
  choice: vì
  rationale: Từ này giới thiệu lý do Môi-se phải xuống núi.
- source_word: שִׁחֵת
  choice: đã tự làm mình ra bại hoại
  rationale: Cách dịch này giữ sắc thái dân chúng phải chịu trách nhiệm về tình trạng suy đồi của chính mình; chú thích nêu cách hiểu thiên về hành vi.
- source_word: עַמְּךָ
  choice: dân của con
  rationale: Giữ đại từ sở hữu hướng về Môi-se, một nét tu từ đáng chú ý trong lời của Yahweh sau khi dân phạm tội.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: là dân con đã đưa lên
  rationale: Giữ chủ thể ngôi thứ hai số ít là Môi-se và động từ “đưa lên,” phù hợp với cách bản nguồn mô tả cuộc ra khỏi Ai Cập.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: khỏi xứ Ai Cập
  rationale: “Xứ Ai Cập” diễn đạt đầy đủ אֶרֶץ מִצְרָיִם và vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn dùng trực tiếp danh giao ước; giữ “Yahweh” bảo toàn tư cách danh riêng, không thay bằng tước hiệu.
- issue: Sắc thái của שִׁחֵת
  choice: đã tự làm mình ra bại hoại
  alternative: đã hành động bại hoại / đã trở nên bại hoại
  rationale: Cách chọn chính làm rõ trách nhiệm của dân đối với sự suy đồi của họ nhưng không quy định cụ thể bản chất thần học của sự suy đồi; cách thiên về hành vi được giữ trong chú thích.
- issue: Cụm “dân của con”
  choice: Giữ đại từ sở hữu chỉ về Môi-se
  alternative: dân Ta
  rationale: Nguyên văn đặt dân trong quan hệ với Môi-se ở điểm này. Giữ cách gọi ấy bảo toàn sức căng tu từ do tội thờ bò con gây ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “con” trong lời Yahweh nói với Môi-se để tránh đại từ “ngươi” mang sắc thái cổ; dùng “phán” để giữ phẩm cách của lời thần thượng. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
