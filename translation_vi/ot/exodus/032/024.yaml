base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: vi
  text: 'Tôi nói với họ[a]: ‘Ai có vàng thì hãy tháo ra.’ Họ đưa vàng cho tôi; tôi ném nó vào lửa, rồi con bê này xuất hiện.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ai có vàng? Hãy tháo ra.” Nguyên văn Hê-bơ-rơ sát nghĩa là: “Vàng thuộc về ai? Hãy tháo/bẻ ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לָהֶם
  choice: Tôi nói với họ
  rationale: Diễn đạt tự nhiên chuỗi tường thuật của động từ אמר với đối tượng gián tiếp số nhiều, không áp đặt sắc thái diễn ngôn vượt quá nguyên văn.
- source_word: לְמִי זָהָב
  choice: Ai có vàng
  rationale: Cụm Hê-bơ-rơ nghĩa đen là ‘vàng thuộc về ai’; cách diễn đạt sở hữu này tự nhiên và vẫn giữ được tính không xác định của lời nói trực tiếp.
- source_word: הִתְפָּרָקוּ
  choice: hãy tháo ra
  rationale: Dạng hitpael của פרק tại đây chỉ việc tự tháo đồ trang sức bằng vàng; ‘tháo ra’ là cách nói hiện đại, rõ nghĩa, với đối tượng được hiểu từ ‘vàng’.
- source_word: וַיִּתְּנוּ לִי
  choice: Họ đưa vàng cho tôi
  rationale: Nêu lại ‘vàng’ để câu tiếng Việt rõ ràng; động từ נתן được dịch tự nhiên là ‘đưa ... cho’ trong ngữ cảnh này.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: tôi ném vào lửa
  rationale: שלך mang nghĩa ném/quăng; đại từ số ít chỉ vàng xét như một khối được lược bỏ tự nhiên trong tiếng Việt vì đã nêu ở mệnh đề trước.
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: rồi con bê này xuất hiện
  rationale: Giữ lời kể né tránh của A-rôn rằng con bê ‘đi ra/xuất hiện’ mà không thêm lời giải thích; ‘con bê’ là nghĩa phù hợp của עגל trong văn cảnh.
theological_decisions:
- issue: Lời kể né tránh của A-rôn về nguồn gốc tượng con bê
  choice: Dịch thẳng ‘rồi con bê này xuất hiện’, không thêm các từ như ‘một cách kỳ diệu’ hay ‘được cho là’.
  alternative: Diễn giải ngay trong chính văn để vạch rõ sự dối trá hoặc sắc thái châm biếm của A-rôn.
  rationale: Nguyên văn chỉ thuật lại lời A-rôn. Bản dịch giữ nguyên sự căng thẳng và nét mỉa mai do văn cảnh tạo nên, thay vì đưa lời bình giải vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘tháo ra’ cho đồ trang sức được hiểu ngầm; tránh bổ sung ‘đúc’ vì từ ấy không có trong câu này. Dấu chân chú [a] được đặt ngay sau mệnh đề dẫn nhập có phương án dịch khác.
