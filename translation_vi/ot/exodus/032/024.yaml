  terminology: “vàng”, “tháo ra”, và “con bê” phù hợp văn cảnh và cách dùng Kinh Thánh tiếng Việt hiện đại. “Xuất hiện” diễn đạt tự nhiên ý “đi ra” trong lời biện bạch của A-rôn, không thêm ý về việc đúc hay phép lạ.
