  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: vi
  text: Thế là toàn dân tháo những chiếc vòng vàng ở tai họ ra và đem đến cho A-rôn.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tháo giật ra” hoặc “lột ra” những chiếc vòng vàng. Động từ Hê-bơ-rơ có thể nhấn mạnh việc tháo ra một cách mạnh tay.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những chiếc khuyên tai bằng vàng.” Trong ngữ cảnh này, từ Hê-bơ-rơ chỉ “vòng” có thể nói đến đồ trang sức đeo tai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: tháo ... ra
  rationale: Dạng hitpael của פרק ở đây chỉ việc mỗi người tự tháo đồ trang sức khỏi mình. “Tháo ... ra” tự nhiên trong tiếng Việt hiện đại, đồng thời không nhấn quá mức sắc thái dùng lực mà động từ có thể hàm ý.
- source_word: כָּל הָעָם
  choice: toàn dân
  rationale: Cụm từ chỉ toàn thể cộng đồng đang tụ họp. “Toàn dân” ngắn gọn, trang trọng và tự nhiên.
- source_word: נִזְמֵי הַזָּהָב
  choice: những chiếc vòng vàng
  rationale: נֶזֶם là đồ trang sức dạng vòng, có thể đeo ở tai hoặc mũi. “Vòng vàng” giữ được phạm vi nghĩa của từ, còn mệnh đề kế tiếp xác định chúng được đeo ở tai.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: đeo nơi tai mình
  rationale: Cách diễn đạt này thể hiện vị trí của các vòng, rõ nghĩa trong tiếng Việt và nối tự nhiên với động tác tự tháo của toàn dân.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: và đem đến cho A-rôn
  rationale: Động từ có nghĩa là đem hoặc mang đến. Tiếng Việt không cần lặp lại tân ngữ vì các vòng vừa được nhắc đến đã rõ theo ngữ cảnh.
