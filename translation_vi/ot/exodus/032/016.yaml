base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: vi
  text: Các bảng ấy là công trình của Đức Chúa Trời[a], còn chữ viết là chữ viết của Đức Chúa Trời, được khắc trên các bảng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “do Đức Chúa Trời làm ra”; nguyên văn dùng các cụm “công trình của Đức Chúa Trời” và “chữ viết của Đức Chúa Trời” để nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: các bảng
  rationale: Danh từ chỉ các bảng giao ước đã được xác định trong ngữ cảnh; câu này không nói rõ chất liệu đá, nên không thêm vào.
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: công trình của Đức Chúa Trời
  rationale: Giữ kết cấu danh từ và sự quy thuộc trực tiếp cho Đức Chúa Trời; “công trình” tự nhiên và trang trọng hơn “việc làm” trong ngữ cảnh vật được tạo tác.
- source_word: הֵמָּה
  choice: ấy là
  rationale: Đại từ độc lập mang sắc thái nhấn mạnh; “các bảng ấy là” vừa tự nhiên vừa giữ được nét xác định và nhấn mạnh.
- source_word: הַמִּכְתָּב / מִכְתַּב אֱלֹהִים
  choice: chữ viết là chữ viết của Đức Chúa Trời
  rationale: Giữ nguyên phép lặp có chủ ý của tiếng Hê-bơ-rơ thay vì chuyển cả hai vế thành động từ.
- source_word: חָרוּת
  choice: được khắc
  rationale: Diễn tả chữ được rạch hoặc chạm vào bề mặt bảng; “khắc” chính xác và tự nhiên trong tiếng Việt.
- source_word: עַל הַלֻּחֹת
  choice: trên các bảng
  rationale: Thể hiện trực tiếp ý nghĩa vị trí của giới từ עַל.
- source_word: וְ
  choice: còn
  rationale: Liên từ thứ hai nối và phân biệt hai mệnh đề song song về các bảng và chữ viết; liên từ đầu câu không cần dịch riêng trong tiếng Việt.
theological_decisions:
- issue: Tác nhân làm nên các bảng và chữ viết
  choice: Cả các bảng lẫn chữ viết trên đó đều được quy trực tiếp cho Đức Chúa Trời bằng hai cụm danh từ.
  alternative: “Các bảng do Đức Chúa Trời làm, và chữ do Đức Chúa Trời viết.”
  rationale: Bản Hê-bơ-rơ dùng các cụm danh từ “công trình của Đức Chúa Trời” và “chữ viết của Đức Chúa Trời.” Giữ dạng này bảo toàn sự nhấn mạnh và không diễn giải quá mức cách thức tác động.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho אֱלֹהִים. Giữ phép lặp tu từ của nguyên văn và không thêm “đá” vì từ này không xuất hiện trong câu.
