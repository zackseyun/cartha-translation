base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/017.yaml
  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: vi
  text: 'Khi Giô-suê nghe tiếng dân chúng đang hò hét[a], ông nói với Môi-se: “Có tiếng chiến trận trong trại.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữa tiếng náo động” hoặc “khi dân chúng reo hò.” Cụm từ Hê-bơ-rơ chỉ tiếng kêu lớn hay tiếng hô vang của dân chúng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nghe
  rationale: Động từ Qal trong mạch kể chuyện chỉ việc nhận biết bằng thính giác; “nghe” là cách dịch trực tiếp và tự nhiên.
- source_word: יְהוֹשֻׁעַ
  choice: Giô-suê
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: קוֹל
  choice: tiếng
  rationale: Trong cả hai lần xuất hiện, từ này chỉ âm thanh nghe được. “Tiếng” tự nhiên hơn “âm thanh” trong các cụm “tiếng dân chúng” và “tiếng chiến trận”, đồng thời giữ được sự lặp lại của nguyên văn.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ tập thể dân Y-sơ-ra-ên; “dân chúng” rõ nghĩa và tự nhiên trong ngữ cảnh này.
- source_word: בְּרֵעֹה
  choice: reo hò
  rationale: Cụm từ diễn tả việc cất tiếng lớn hoặc tiếng la vang. Hậu tố số ít phù hợp về ngữ pháp với danh từ tập hợp “dân”; tiếng Việt diễn đạt tự nhiên bằng hành động chung “dân chúng reo hò”.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: ông nói với Môi-se
  rationale: Công thức kể chuyện được dịch tự nhiên; đại từ “ông” làm rõ chủ thể là Giô-suê.
- source_word: קוֹל מִלְחָמָה
  choice: tiếng chiến trận
  rationale: Giữ cấu trúc “tiếng của chiến tranh/trận chiến”; “chiến trận” phù hợp với âm thanh giao chiến mà Giô-suê tưởng mình nghe thấy.
- source_word: בַּמַּחֲנֶה
  choice: trong trại
  rationale: Dịch trực tiếp địa điểm là khu trại của dân Y-sơ-ra-ên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ sự lặp lại của קוֹל bằng “tiếng”; dùng “reo hò” nhưng kèm chú thích để bảo tồn phạm vi nghĩa có thể là tiếng la lớn hoặc cảnh náo động, chưa xác định đó là vui mừng hay chiến trận.
