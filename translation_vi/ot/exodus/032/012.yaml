base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: vi
  text: 'Tại sao người Ai Cập lại nói[a]: ‘Ngài đã đưa chúng ra với ác ý, để giết chúng trên núi và xóa sạch chúng khỏi mặt đất’?[b] Xin Ngài nguôi cơn thịnh nộ của Ngài và đổi ý về tai họa định giáng xuống dân Ngài.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tại sao người Ai Cập sẽ nói”. Dạng vị hoàn thành của động từ, trong câu hỏi tu từ này, có thể diễn đạt điều người Ai Cập sẽ nói hoặc lại nói.'
    reason: lexical_alternative
  - marker: b
    text: “Với ác ý” chỉ động cơ mà người Ai Cập sẽ quy cho Đức Chúa Trời. “Xóa sạch” cũng có thể dịch là “tiêu diệt hoàn toàn”.
    reason: lexical_alternative
  - marker: c
    text: “Đổi ý về tai họa” cũng có thể dịch là “nguôi cơn giận và đừng giáng tai họa”. Tiếng Hê-bơ-rơ dùng lối nói mô tả Đức Chúa Trời theo cách con người trong lời Môi-se cầu xin.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: Tại sao người Ai Cập lại có thể nói
  rationale: Diễn đạt tự nhiên câu hỏi tu từ trong lời cầu xin của Môi-se; chủ thể là dân Ai Cập.
- source_word: בְּרָעָה הוֹצִיאָם
  choice: Ngài đã có ác ý khi đưa chúng ra
  rationale: בְּרָעָה chỉ động cơ xấu mà người Ai Cập sẽ quy cho Đức Chúa Trời, không phải lời người kể khẳng định động cơ ấy.
- source_word: לַהֲרֹג אֹתָם בֶּהָרִים
  choice: để giết chúng giữa núi non
  rationale: Giữ rõ ý chỉ mục đích của động từ nguyên mẫu và bối cảnh miền núi hoang vu.
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: và xóa sạch chúng khỏi mặt đất
  rationale: כלה ở thể Piel diễn tả sự hủy diệt hoàn toàn; cụm tiếng Việt kết hợp tự nhiên với thành ngữ theo sau.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: Xin Ngài nguôi cơn thịnh nộ
  rationale: Truyền đạt lời khẩn cầu Đức Chúa Trời quay khỏi cơn giận dữ dội bằng cách nói trang trọng, tự nhiên trong tiếng Việt.
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: và đổi ý về tai họa định giáng xuống dân Ngài
  rationale: Giữ sức nặng của lời cầu xin và xác định הָרָעָה là tai họa dành cho dân, không phải điều ác luân lý nơi Đức Chúa Trời.
theological_decisions:
- issue: Ngôn ngữ nhân hình cảm xúc về Đức Chúa Trời trong וְהִנָּחֵם
  choice: đổi ý
  alternative: nguôi đi; hối tiếc; không giáng
  rationale: “Đổi ý” bảo tồn sự căng thẳng thực sự trong lời Môi-se cầu xin mà không hàm ý Đức Chúa Trời đã phạm lỗi luân lý. Chú thích nêu lựa chọn “nguôi đi” để giữ độ rộng nghĩa.
- issue: Ý nghĩa của הָרָעָה đối với hành động Đức Chúa Trời đe dọa thực hiện
  choice: tai họa
  alternative: điều dữ; sự tổn hại; tai ương
  rationale: “Tai họa” chỉ hậu quả hủy diệt của sự phán xét, tránh gán điều ác luân lý cho Đức Chúa Trời, đồng thời không làm nhẹ mức độ nghiêm trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” dành cho Đức Chúa Trời; “chúng” phản ánh cách Môi-se nói về dân trong lời trích dẫn giả định của người Ai Cập, còn “dân Ngài” giữ quan hệ giao ước ở cuối câu.
