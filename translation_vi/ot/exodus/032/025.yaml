  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: vi
  text: Khi Môi-se thấy dân chúng mất kiểm soát—vì A-rôn đã để họ mất kiểm soát, khiến họ trở thành trò nhạo cười cho những kẻ chống lại họ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không còn bị kiềm chế” hoặc “thả lỏng.” Tiếng Hê-bơ-rơ lặp lại cùng một gốc từ để nói về tình trạng của dân chúng và hành động của A-rôn. Cụm cuối cũng có thể hiểu là “thành nỗi ô nhục giữa/trước mặt những kẻ thù nghịch.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא מֹשֶׁה
  choice: Khi Môi-se thấy
  rationale: Dạng tự sự với waw tiếp diễn thúc đẩy mạch truyện; “Khi” nối tự nhiên sự quan sát của Môi-se với hành động tiếp theo.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ cộng đồng Y-sơ-ra-ên trong trại; “dân chúng” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: כִּי פָרֻעַ הוּא
  choice: dân chúng đã buông mình
  rationale: פָרֻעַ diễn tả tình trạng bị tháo bỏ sự kiềm chế, trở nên phóng túng hoặc hỗn loạn. “Buông mình” giữ sắc thái mất tự chủ mà không thu hẹp nghĩa thành trần truồng.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: vì A-rôn đã để họ buông mình
  rationale: Lặp lại “buông mình” để phản ánh việc nguyên văn lặp cùng gốc פרע, đồng thời nêu trách nhiệm của A-rôn mà không khẳng định quá mức rằng ông chủ ý gây ra tình trạng ấy.
- source_word: לְשִׁמְצָה
  choice: khiến họ thành trò nhạo cười
  rationale: שִׁמְצָה chỉ sự ô nhục, khinh miệt hoặc lời nhạo báng; cách diễn đạt này tự nhiên trong tiếng Việt và giữ quan hệ kết quả/mục đích có thể có của לְ.
- source_word: בְּקָמֵיהֶם
  choice: giữa những kẻ chống lại họ
  rationale: Phân từ từ קום chỉ những người đứng lên chống lại Y-sơ-ra-ên; “những kẻ chống lại họ” giữ được ý động từ và dễ hiểu.
theological_decisions:
- issue: Sắc thái đạo đức và xã hội của פרע
  choice: buông mình
  alternative: mất kiểm soát; không còn bị kiềm chế; trần truồng/phơi bày
  rationale: Trong ngữ cảnh, gốc từ nhấn mạnh sự tháo bỏ kiềm chế và tình trạng hỗn loạn. Dịch là “trần truồng” sẽ thu hẹp một cách không chắc chắn; “buông mình” giữ độ rộng ngữ nghĩa và sự lặp từ của câu Hebrew.
- issue: Quan hệ của לְשִׁמְצָה với mệnh đề trước
  choice: khiến họ thành trò nhạo cười
  alternative: để bị nhạo cười; thành nỗi ô nhục
  rationale: Giới từ לְ có thể biểu đạt kết quả hoặc mục đích. Bản dịch dùng “khiến” để chuyển tải kết quả trong tiếng Việt nhưng không quy một ý định chế nhạo cho A-rôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Buông mình” được lặp có chủ ý để phản ánh phép lặp gốc từ trong nguyên văn. Dấu gạch ngang giữ câu mở dẫn sang hành động ở câu kế tiếp.
