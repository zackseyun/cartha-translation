  source_fidelity: 'Bản nháp truyền đạt đúng chuỗi hành động của tiếng Hê-bơ-rơ: sáng sớm hôm sau, dâng lễ thiêu, trình/dâng lễ bình an, ngồi ăn uống, rồi đứng dậy để צחק. Tuy nhiên, “vui chơi trác táng” khẳng định sắc thái buông thả mạnh hơn mức từ צחק tự nó bắt buộc; ngữ cảnh hỗ trợ cách hiểu này nhưng vẫn có độ mơ hồ từ vựng. “Đem các lễ bình an đến” cũng hơi gượng và thừa hướng đích trong tiếng Việt.'
  naturalness: “Hôm sau, họ dậy sớm” và “Dân chúng ngồi xuống ăn uống” tự nhiên, phù hợp văn phong Kinh Thánh hiện đại. “Dâng các lễ bình an” là cách nói trôi chảy và song hành với “dâng các lễ thiêu.” “Đứng dậy vui chơi” tự nhiên hơn “đứng dậy vui chơi trác táng”; chú thích có thể cung cấp sắc thái bối cảnh.
