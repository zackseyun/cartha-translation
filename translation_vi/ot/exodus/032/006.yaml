base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: vi
  text: Hôm sau, họ dậy sớm, dâng các lễ thiêu và các lễ bình an. Dân chúng ngồi xuống ăn uống, rồi đứng dậy vui chơi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ăn mừng”. Động từ Hê-bơ-rơ có thể có nghĩa là “vui chơi”, “ăn mừng” hoặc chỉ một cuộc vui buông thả; trong bối cảnh này, dường như không phải là sự vui đùa vô hại.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: Hôm sau, họ dậy sớm
  rationale: Diễn đạt rõ ý thời gian của מִמָּחֳרָת và nghĩa Hiphil thông dụng của שׁכם là dậy sớm, bằng tiếng Việt tự nhiên.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: dâng các lễ thiêu
  rationale: עלה đi với עֹלֹת trong ngữ cảnh tế lễ chỉ việc dâng lễ vật được thiêu trọn; “lễ thiêu” giữ đúng phạm trù tế lễ và gọn, tự nhiên.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: đem các lễ bình an đến
  rationale: נגשׁ ở đây mang nghĩa đem hoặc trình lễ vật; “lễ bình an” bảo tồn tên gọi truyền thống của loại tế lễ שְׁלָמִים mà không thu hẹp ý thành sự thông công.
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: Dân chúng ngồi xuống ăn uống
  rationale: Bám sát trình tự hành động của bản Hê-bơ-rơ; “ăn uống” là cách diễn đạt tiếng Việt tự nhiên cho hai động từ nguyên mẫu phối hợp.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: rồi đứng dậy vui chơi trác táng
  rationale: צחק có thể chỉ vui chơi, ăn mừng hoặc cuộc vui phóng túng. Cách dịch này giữ yếu tố “vui chơi” đồng thời truyền đạt sắc thái tiêu cực do bối cảnh thờ tượng bò con gợi ra, nhưng không khẳng định cụ thể hành vi tình dục.
theological_decisions:
- issue: Sắc thái của לְצַחֵק trong biến cố tượng bò con bằng vàng
  choice: vui chơi trác táng
  alternative: vui chơi; ăn mừng
  rationale: Ngữ cảnh tế lễ trước tượng bò con, tiệc tùng và sự phán xét sau đó cho thấy đây khó chỉ là trò vui vô hại. Tuy vậy, câu này không tự nó buộc phải hiểu là hành vi tình dục, nên bản dịch giữ sắc thái hỗn loạn, buông thả mà không diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các thuật ngữ tế lễ “lễ thiêu” và “lễ bình an”; tránh cách nói cổ và tránh quy định giáo phái. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
