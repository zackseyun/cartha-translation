base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/035.yaml
  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: vi
  text: Bấy giờ, Yahweh đánh dân vì họ đã làm con bê mà A-rôn đã làm ra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Yahweh giáng phạt dân.” Động từ Hê-bơ-rơ có nghĩa khái quát là “đánh”; trong một số ngữ cảnh, nó có thể chỉ việc giáng tai họa hoặc dịch bệnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: giáng họa xuống
  rationale: Động từ נָגַף chỉ việc đánh, làm tổn hại hoặc giáng tai họa, thường được dùng về sự trừng phạt như dịch bệnh. “Giáng họa xuống” truyền đạt sự phán xét của Đức Chúa Trời mà không xác định quá mức hình thức hay hậu quả của tai họa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời bằng dạng phiên âm phổ biến, thay vì thay thế bằng một tước hiệu.
- source_word: הָעָם
  choice: dân chúng
  rationale: Chỉ cộng đồng dân Israel theo nghĩa tập thể; “dân chúng” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: עַל אֲשֶׁר
  choice: vì
  rationale: Cụm giới từ và mệnh đề quan hệ mang ý nghĩa nguyên nhân; “vì” diễn đạt trực tiếp quan hệ nhân quả.
- source_word: עָשׂוּ אֶת הָעֵגֶל
  choice: họ đã làm con bê
  rationale: Giữ nghĩa trực tiếp của động từ עָשָׂה và trách nhiệm tập thể được quy cho dân chúng, dù mệnh đề kế tiếp nói A-rôn là người làm ra con bê. Không chuyển thành “việc họ đã làm với con bê,” vì cách đó giảm bớt sự căng thẳng trong nguyên văn.
- source_word: הָעֵגֶל
  choice: con bê
  rationale: Danh từ có nghĩa là “con bê.” Không thêm “bằng vàng,” vì chi tiết ấy không xuất hiện trong câu này.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: mà A-rôn đã làm ra
  rationale: Mệnh đề quan hệ xác định con bê là vật A-rôn đã làm. “Làm ra” giúp câu tiếng Việt tự nhiên hơn nhưng vẫn giữ sự lặp lại có chủ ý của động từ “làm.”
theological_decisions:
- issue: Bản chất của sự phán xét trong וַיִּגֹּף
  choice: “giáng họa xuống” trong chính văn
  alternative: “đánh phạt” hoặc diễn đạt cụ thể là “giáng dịch bệnh”
  rationale: Động từ Hê-bơ-rơ có thể chỉ việc đánh hoặc gây tai họa và thường gắn với dịch bệnh, nhưng câu này không nêu rõ phương tiện. Cách dịch đã chọn giữ sắc thái tai họa do Yahweh giáng xuống mà không khẳng định cụ thể đó là dịch bệnh.
- issue: Trách nhiệm của dân chúng và vai trò của A-rôn trong việc làm con bê
  choice: 'Giữ cả hai mệnh đề: dân chúng “đã làm con bê” và A-rôn “đã làm ra” con bê ấy'
  alternative: “vì việc họ đã làm với con bê mà A-rôn đã làm ra”
  rationale: Nguyên văn quy hành động “làm” cho dân chúng ở số nhiều rồi cũng quy việc làm con bê cho A-rôn ở số ít. Bản dịch giữ nguyên sự căng thẳng và trách nhiệm tập thể này, thay vì giải thích hành động của dân chúng chỉ là những việc họ làm liên quan đến con bê.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Yahweh” cho danh riêng יהוה và “A-rôn” theo dạng tên quen thuộc trong tiếng Việt. Sự lặp lại “làm… làm ra” được giữ để phản ánh cấu trúc và sự căng thẳng có thật trong nguyên văn.
