  source_fidelity: Bản dự thảo giữ được quan hệ nhân quả, chủ ngữ số nhiều của “họ đã làm” và mệnh đề xác định A-rôn là người làm con bê. Tuy nhiên, “giáng họa xuống” diễn giải động từ נָגַף thành một tai họa được danh từ hóa, trong khi nguyên văn chỉ nói Yahweh “đánh/giáng đánh” dân chúng, không nêu phương tiện hay loại tai họa. “Đánh” giữ độ khái quát của nguyên văn tốt hơn.
  naturalness: “Dân” là cách gọi tập thể tự nhiên và thông dụng hơn “dân chúng” trong văn phong Kinh Thánh tiếng Việt hiện đại. Cấu trúc lặp “làm con bê mà A-rôn đã làm ra” có phần gồ ghề nhưng cần được giữ, vì phản ánh sự lặp động từ và quy trách nhiệm kép trong tiếng Hê-bơ-rơ.
