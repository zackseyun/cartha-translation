base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: vi
  text: 'Khi A-rôn thấy vậy, ông dựng một bàn thờ trước nó[a]. Rồi A-rôn công bố: “Ngày mai sẽ có một lễ kính Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước ông”; về ngữ pháp, đại từ Hê-bơ-rơ có thể chỉ A-rôn, nhưng theo ngữ cảnh, nhiều khả năng nó chỉ con bê.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Khi A-rôn thấy vậy
  rationale: Động từ có nghĩa là “thấy”; “vậy” bổ sung đối tượng theo ngữ cảnh, tức con bê vừa được đúc, đồng thời diễn đạt tự nhiên quan hệ thời gian của mạch kể.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: ông dựng một bàn thờ
  rationale: “Dựng một bàn thờ” là cách diễn đạt tự nhiên, trang trọng và giữ đúng ý của בנה kết hợp với מזבח.
- source_word: לְפָנָיו
  choice: trước nó
  rationale: Hậu tố đại từ giống đực số ít có thể chỉ con bê hoặc A-rôn; ngữ cảnh nghiêng rõ về con bê. Đại từ “nó” không nhân cách hóa tượng thần.
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: Rồi A-rôn công bố
  rationale: Hai động từ sát nhau tạo lời thông báo công khai; tiếng Việt tự nhiên không cần dịch lặp thành “công bố và nói”.
- source_word: חַג
  choice: lễ hội
  rationale: חַג chỉ một lễ hội tôn giáo; “lễ hội” chuyển tải sắc thái nghi lễ mà không diễn giải quá mức thành lễ hành hương.
- source_word: לַיהוָה
  choice: kính Đức Giê-hô-va
  rationale: Giới từ לְ ở đây biểu thị sự quy hướng hoặc dâng kính. “Kính” tự nhiên trong tiếng Việt và giữ quan hệ thờ phượng; danh Đức Giê-hô-va biểu thị trực tiếp יהוה.
- source_word: מָחָר
  choice: Ngày mai sẽ có
  rationale: Mệnh đề danh từ Hê-bơ-rơ được diễn đạt bằng kết cấu hiện hữu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh; CHÚA
  rationale: Giữ đây là danh riêng của Đức Chúa Trời thay vì thay bằng tước hiệu; “Đức Giê-hô-va” là dạng tiếng Việt quen thuộc, trang trọng và dễ hiểu.
- issue: Đối tượng của đại từ trong לְפָנָיו
  choice: bàn thờ được dựng trước con bê
  alternative: bàn thờ được dựng trước A-rôn
  rationale: Về ngữ pháp, hậu tố có thể quy chiếu đến A-rôn, nhưng con bê vừa được nhắc đến là đối tượng phù hợp hơn trong diễn tiến câu chuyện. Ghi chú bảo tồn khả năng ngữ pháp còn lại.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “A-rôn”, “bàn thờ” và “lễ hội” theo cách gọi Kinh Thánh phổ biến; lược bớt sự trùng lặp của “công bố và nói” để câu tiếng Việt tự nhiên mà không làm mất tính công khai của lời tuyên bố.
