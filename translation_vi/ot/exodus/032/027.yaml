  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: vi
  text: 'Ông nói với họ: “Yahweh, Đức Chúa Trời của Israel, phán thế này: Mỗi người hãy đeo gươm bên hông, rồi đi qua đi lại từ cổng này đến cổng kia khắp trại; mỗi người hãy giết anh em mình, mỗi người hãy giết bạn hữu mình, và mỗi người hãy giết người thân cận mình[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hê-bơ-rơ là “người gần gũi với mình”; cũng có thể dịch là “bà con mình” hoặc “người họ hàng gần của mình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Ông nói với họ
  rationale: Dùng lối kể chuyện tự nhiên trong tiếng Việt; chủ thể là Môi-se theo văn cảnh, nhưng giữ đại từ như nguyên văn câu này.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh ... phán thế này
  rationale: Giữ công thức sứ giả có thẩm quyền và phiên âm danh riêng יְהוָה là Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Đức Chúa Trời của Israel
  rationale: Chuyển sát cấu trúc sở thuộc, bằng danh xưng trang trọng và quen thuộc trong tiếng Việt.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: Mỗi người hãy đeo gươm bên hông
  rationale: Diễn đạt tự nhiên thành ngữ trang bị vũ khí; 'bên hông' truyền đạt vị trí ở đùi mà không tạo hình ảnh vụng về trong tiếng Việt.
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: đi qua đi lại
  rationale: Cặp mệnh lệnh diễn tả sự di chuyển tới lui; cách nói này vừa gần nghĩa vừa tự nhiên.
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: từ cổng này đến cổng kia khắp trại
  rationale: Giữ phạm vi phân bố 'từ cổng đến cổng' và sắc thái bao quát toàn trại.
- source_word: וְהִרְגוּ
  choice: hãy giết
  rationale: Động từ trực tiếp, rõ nghĩa, không giảm nhẹ tính khắc nghiệt của mệnh lệnh.
- source_word: אִישׁ אֶת אָחִיו
  choice: mỗi người hãy giết anh em mình
  rationale: Giữ cách dùng phân bố của אִישׁ và quan hệ thân thuộc gây sửng sốt trong nguyên văn.
- source_word: רֵעֵהוּ
  choice: bạn hữu mình
  rationale: Bao quát người bạn hoặc người đồng hành, giữ sắc thái quan hệ cá nhân.
- source_word: קְרֹבוֹ
  choice: người thân cận mình
  rationale: Giữ nghĩa cơ bản 'người ở gần/thân cận' và không quyết định dứt khoát rằng đây chỉ là bà con huyết thống.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Nguyên văn dùng trực tiếp danh giao ước; phiên âm Yahweh bảo tồn tính chất danh riêng thay vì thay bằng một tước hiệu.
- issue: Sự lặp lại của אִישׁ theo nghĩa phân bố
  choice: Mỗi người ... mỗi người
  alternative: Mọi người
  rationale: Giữ trách nhiệm cá nhân được nhấn mạnh trong tiếng Hê-bơ-rơ; trong văn cảnh, mệnh lệnh được truyền cho những người nam thuộc chi phái Lê-vi.
- issue: Phạm vi nghĩa của קְרֹבוֹ
  choice: người thân cận mình
  alternative: bà con gần / người họ hàng gần
  rationale: Từ này có thể chỉ người ở gần hoặc thân thuộc. Bản dịch chính giữ độ rộng nghĩa, còn chú thích nêu khả năng chỉ thân nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “phán thế này” cho công thức truyền đạt lời thần linh; giữ “Yahweh” như danh riêng. Câu mệnh lệnh được làm tự nhiên trong tiếng Việt nhưng không giảm nhẹ bạo lực hay sự căng thẳng thần học của nguyên văn.
