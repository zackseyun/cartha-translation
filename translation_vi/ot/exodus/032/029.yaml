  - severity: medium
    issue: Bản nháp nêu rõ “Ngài sẽ” là chủ thể và dùng thì tương lai ở mệnh đề cuối.
    rationale: לָתֵת là infinitive (“để/hầu ban”), còn tác nhân không được nói lại. Dù CHÚA là cách hiểu rất có khả năng, bản dịch chính nên tránh giải quyết dứt khoát độ tỉnh lược này.
