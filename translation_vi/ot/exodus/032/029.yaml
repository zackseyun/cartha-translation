base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: vi
  text: 'Môi-se nói: “Hôm nay, hãy tự thánh hiến cho CHÚA[a], vì mỗi người đã chống lại con trai và anh em mình, để hôm nay phước lành được ban cho anh em.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là danh riêng YHWH của Đức Chúa Trời, thường được trình bày là “CHÚA”.
    reason: Làm rõ rằng từ Hê-bơ-rơ là danh riêng, không chỉ là một tước hiệu.
  - marker: b
    text: 'Câu Hê-bơ-rơ có nghĩa đen gần như: “Hôm nay, hãy làm đầy tay mình cho YHWH, vì mỗi người với con trai mình và với anh em mình, để hôm nay ban phước trên anh em.” “Làm đầy tay” là thành ngữ chỉ sự thánh hiến hay được biệt riêng để phụng sự. Mệnh đề về con trai và anh em tỉnh lược động từ; theo ngữ cảnh trước đó, động từ được hiểu là chống lại. Chủ thể của “ban phước” cũng không được nêu lại trong tiếng Hê-bơ-rơ.'
    reason: Ghi nhận thành ngữ và các chỗ tỉnh lược, đồng thời không xác định quá mức chủ thể của mệnh đề cuối.
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: hãy thánh hiến mình
  rationale: Thành ngữ Hê-bơ-rơ có nghĩa đen là “hãy làm đầy tay mình”, thường chỉ việc được lập hoặc biệt riêng để phụng sự. Trong ngữ cảnh này, “thánh hiến mình” tự nhiên hơn “phong chức cho mình” và không áp đặt rằng mọi người Lê-vi đều được phong làm tư tế.
- source_word: לַיהוָה
  choice: cho CHÚA
  rationale: Giữ quy ước tiếng Việt trang trọng dùng “CHÚA” cho danh riêng YHWH; chú thích nêu rõ nguyên ngữ để người đọc không nhầm với tước hiệu thông thường.
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: vì mỗi người trong anh em đã đứng lên chống lại chính con trai và anh em mình
  rationale: Mệnh đề Hê-bơ-rơ tỉnh lược động từ. Cách dịch bổ sung “đã đứng lên chống lại” theo ngữ cảnh trực tiếp của câu 27–28, đồng thời “chính” diễn đạt sức nặng của quan hệ thân thuộc.
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: như thế, hôm nay Ngài sẽ ban phước cho anh em
  rationale: וְלָתֵת diễn tả kết quả hoặc mục đích. “Như thế” phù hợp mạch văn hơn một mệnh đề mục đích cứng nhắc; “Ngài” được hiểu là CHÚA, dù nguyên văn không nêu lại chủ ngữ.
theological_decisions:
- issue: Thành ngữ “làm đầy tay” có nên dịch là phong chức tư tế không
  choice: thánh hiến mình
  alternative: phong chức cho mình / tự nhận chức
  rationale: Thành ngữ có liên hệ đến việc tấn phong, nhưng ở đây lời kêu gọi hướng đến sự biệt riêng và trung thành với CHÚA sau hành động của người Lê-vi. “Thánh hiến mình” bảo toàn ý nghĩa mà không khẳng định một nghi thức phong chức không được câu này mô tả rõ.
- issue: Chủ thể ban phước không được nêu rõ trong mệnh đề nguyên văn
  choice: Ngài, được hiểu là CHÚA
  alternative: để ban phước cho anh em / để anh em được ban phước
  rationale: CHÚA là tiền thể thần học và ngữ pháp hợp lý nhất. Tuy vậy, chú thích ghi nhận rằng tiếng Hê-bơ-rơ không lặp lại chủ ngữ, nhằm không che mất độ tỉnh lược của nguyên văn.
- issue: Quan hệ giữa hành động chống lại người thân và phước lành
  choice: giữ quan hệ kết quả bằng “như thế”
  alternative: để / hầu cho
  rationale: Cấu trúc có thể được hiểu theo mục đích hoặc kết quả. “Như thế” không biến bạo lực thành một công thức nghi lễ tự động, cũng không xóa liên hệ mà câu văn thiết lập.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” để xưng hô với tập thể nam giới Lê-vi; “con trai và anh em mình” giữ nguyên các quan hệ thân thuộc cụ thể của bản Hê-bơ-rơ. Viết hoa “CHÚA” theo quy ước biểu thị YHWH.
