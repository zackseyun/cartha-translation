id: EXO.32.32
reference: Exodus 32:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אִם תִּשָּׂ֣א חַטָּאתָ֑/ם וְ/אִם אַ֕יִן מְחֵ֣/נִי נָ֔א מִֽ/סִּפְרְ/ךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: vi
  text: Nhưng giờ đây, nếu Ngài tha[a] tội cho họ... Còn nếu không, xin xóa con khỏi quyển sách của Ngài[b], là sách Ngài đã viết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hê-bơ-rơ có nghĩa đen là “nhấc, mang” hoặc “gánh”; khi dùng với “tội”, cụm từ có thể hiểu là “cất bỏ tội” hay “tha tội”.
    reason: lexical_alternative
  - marker: b
    text: “Quyển sách của Ngài” có thể chỉ sổ bộ thiên thượng ghi những người sống, hoặc theo nghĩa mở rộng là sách sự sống; nguyên văn Hê-bơ-rơ không nói rõ hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nhưng giờ đây
  rationale: Cụm từ chuyển sang lời khẩn cầu cấp bách của Môi-se; “nhưng” thể hiện sắc thái tương phản theo văn cảnh, còn “giờ đây” giữ yếu tố thời điểm.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: Ngài tha tội cho họ
  rationale: Động từ נשׂא có nghĩa đen là “nhấc, mang, gánh”; khi đi với “tội” làm tân ngữ, đây là thành ngữ chỉ việc cất bỏ hoặc tha tội. “Tha tội” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: וְאִם אַיִן
  choice: Còn nếu không
  rationale: Đây là mệnh đề điều kiện phủ định tỉnh lược, đối lập với điều kiện trước. “Còn nếu không” tự nhiên trong tiếng Việt và giữ nguyên sự chuyển hướng mạnh của lời cầu xin.
- source_word: מְחֵנִי נָא
  choice: xin xóa con
  rationale: מחה chỉ việc lau hoặc xóa bỏ; נָא biểu thị lời khẩn xin. “Xin xóa con” giữ hình ảnh bị xóa khỏi một văn bản mà không tự ý thêm từ “tên”, vốn không có trong câu Hê-bơ-rơ.
- source_word: מִסִּפְרְךָ
  choice: khỏi quyển sách của Ngài
  rationale: סֵפֶר có thể chỉ sách, cuộn sách hoặc sổ ghi chép. “Quyển sách của Ngài” là cách nói tự nhiên và không xác định quá mức bản chất của sách này.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: là sách Ngài đã viết
  rationale: Mệnh đề quan hệ xác định đây là sách do chính Đức Chúa Trời viết. Cách lặp “là sách” giúp câu tiếng Việt rõ ràng và tránh khả năng hiểu nhầm rằng đại từ quan hệ bổ nghĩa cho “Ngài”.
theological_decisions:
- issue: Mệnh đề điều kiện đầu bị bỏ lửng
  choice: Dùng dấu ba chấm sau “họ”
  alternative: Bổ sung một kết quả như “thì xin Ngài tha cho”
  rationale: Bản Hê-bơ-rơ không nêu vế kết quả sau “nếu Ngài tha tội cho họ”. Dấu ba chấm bảo tồn sự bỏ lửng đầy cảm xúc và không thêm nội dung mà nguyên văn không nói.
- issue: Bản chất của “quyển sách của Ngài”
  choice: quyển sách của Ngài
  alternative: sổ người sống / sách sự sống / sổ ghi chép của Ngài
  rationale: Nguyên văn không nói rõ đây là sổ bộ người sống, sách sự sống hay một sổ ghi chép khác của Đức Chúa Trời. Bản dịch giữ cách gọi khái quát để bảo tồn sự mơ hồ thần học chính đáng.
- issue: Đối tượng bị xóa khỏi sách
  choice: xóa con
  alternative: xóa tên con
  rationale: Nguyên văn nói trực tiếp “xóa con”, không có danh từ “tên”. Dù “xóa tên con” tự nhiên hơn trong tiếng Việt, bản dịch không thêm yếu tố ấy nhằm giữ sức nặng của lời Môi-se xin chính mình bị xóa khỏi sách.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “Ngài—con” phù hợp với lời Môi-se trực tiếp khẩn cầu Đức Chúa Trời. Dấu ba chấm tái hiện mệnh đề điều kiện bỏ lửng trong nguyên văn; “xin” giữ giọng van nài của נָא.
