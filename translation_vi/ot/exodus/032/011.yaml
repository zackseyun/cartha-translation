  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: vi
  text: 'Nhưng Môi-se khẩn cầu Yahweh, Đức Chúa Trời của ông[a], và thưa rằng: “Lạy Yahweh, tại sao cơn giận Ngài bừng lên chống lại dân Ngài mà Ngài đã đưa ra khỏi đất Ai Cập bằng quyền năng lớn lao và bằng bàn tay mạnh mẽ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ nói theo nghĩa đen: “Môi-se tìm kiếm mặt Yahweh”; đây là một thành ngữ có nghĩa là tha thiết tìm kiếm ân huệ hoặc khẩn cầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: khẩn cầu
  rationale: Cụm Piel với “mặt” là một thành ngữ chỉ việc tha thiết tìm kiếm ân huệ hay nài xin. “Khẩn cầu” diễn đạt tự nhiên tính cấp thiết, còn nghĩa đen được ghi ở chú thích.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời theo dạng chuyển tự, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהָיו
  choice: Đức Chúa Trời của ông
  rationale: Hậu tố sở hữu số ít chỉ Môi-se; cách dịch này giữ rõ mối liên hệ được nói đến trong nguyên văn.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: cơn giận Ngài lại bừng lên
  rationale: Giữ hình ảnh sức nóng của cơn giận trong tiếng Hê-bơ-rơ nhưng tránh dịch thô theo nghĩa đen là “mũi Ngài nóng lên”.
- source_word: בְּעַמֶּךָ
  choice: chống lại dân Ngài
  rationale: Trong kết cấu với động từ chỉ sự nổi giận, giới từ mang nghĩa hướng sự giận dữ chống lại đối tượng.
- source_word: אֲשֶׁר הוֹצֵאתָ מֵאֶרֶץ מִצְרַיִם
  choice: là dân mà Ngài đã đưa ra khỏi đất Ai Cập
  rationale: Giữ đầy đủ mệnh đề quan hệ và công thức xuất hành của nguyên văn.
- source_word: בְּכֹחַ גָּדוֹל
  choice: bằng quyền năng lớn lao
  rationale: Diễn đạt giá trị phương tiện của giới từ và nhấn mạnh quyền năng lớn của Đức Chúa Trời.
- source_word: וּבְיָד חֲזָקָה
  choice: bằng cánh tay mạnh mẽ
  rationale: “Cánh tay” là cách nói tự nhiên trong tiếng Việt cho biểu tượng quyền lực hành động, dù יָד có nghĩa trực tiếp là “bàn tay”; chú thích nêu cách dịch sát hơn.
theological_decisions:
- issue: Ngôn ngữ nhân hình về cơn giận của Đức Chúa Trời
  choice: Giữ ẩn dụ nhiệt trong “cơn giận Ngài lại bừng lên”.
  alternative: “Ngài lại nổi giận” hoặc nghĩa đen “mũi Ngài nóng lên”.
  rationale: Cách dịch bảo tồn sức mạnh tu từ và sự căng thẳng thần học của nguyên văn mà không tạo một hình ảnh tiếng Việt vụng về.
- issue: Cách thể hiện danh יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA hoặc CHÚA
  rationale: Dùng dạng chuyển tự để giữ đây là danh riêng được nêu trong nguyên văn, không thay thế bằng tước hiệu.
- issue: Lời chất vấn trong lời cầu thay của Môi-se
  choice: “tại sao ... lại bừng lên”
  alternative: Diễn giải thành lời khẳng định rằng Đức Chúa Trời không nên nổi giận.
  rationale: Giữ nguyên hình thức câu hỏi tu từ và không giải quyết thay bản văn sự căng thẳng giữa cơn giận của Đức Chúa Trời với lời cầu thay của Môi-se.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se”, “Ai Cập” và đại từ kính trọng “Ngài”. Thành ngữ Hê-bơ-rơ được chuyển sang tiếng Việt tự nhiên, đồng thời chú thích bảo tồn hình thức nguyên ngữ.
