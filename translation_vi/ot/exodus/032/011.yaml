- from: 'Nhưng Môi-se khẩn cầu Yahweh, Đức Chúa Trời của ông[a], rằng: “Lạy Yahweh, tại sao cơn giận Ngài lại bừng lên chống lại dân Ngài, là dân mà Ngài đã đưa ra khỏi đất Ai Cập bằng quyền năng lớn lao và bằng cánh tay mạnh mẽ?”'
  to: 'Nhưng Môi-se khẩn cầu Yahweh, Đức Chúa Trời của ông[a], và thưa rằng: “Lạy Yahweh, tại sao cơn giận Ngài bừng lên chống lại dân Ngài mà Ngài đã đưa ra khỏi đất Ai Cập bằng quyền năng lớn lao và bằng bàn tay mạnh mẽ?”'
  rationale: Chỉnh “cánh tay” thành “bàn tay” để phản ánh đúng יָד, bỏ “lại” để không thêm ý lặp lại, và làm gọn mệnh đề quan hệ. Chú thích được điều chỉnh để hình thức nghĩa đen nêu rõ chủ ngữ và giữ đúng thành ngữ nguyên ngữ.
