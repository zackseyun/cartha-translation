  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: vi
  text: 'Họ nói với tôi: “Hãy làm cho chúng tôi các thần[a] sẽ đi trước chúng tôi, vì ông Môi-se này, người đã đưa chúng tôi lên khỏi xứ Ai Cập—chúng tôi không biết chuyện gì đã xảy ra với ông ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy làm cho chúng tôi một vị thần sẽ đi trước chúng tôi.” Dù câu này dùng danh từ và động từ số nhiều (“các thần… sẽ đi”), một số bản dịch hiểu theo số ít dựa vào hình tượng con bê trong văn cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: Họ nói với tôi
  rationale: Động từ wayyiqtol tiếp nối diễn tiến câu chuyện; tiếng Việt không cần thêm liên từ để biểu đạt tự nhiên trong lời thuật lại.
- source_word: עֲשֵׂה לָנוּ
  choice: Hãy làm cho chúng tôi
  rationale: Giữ sắc thái mệnh lệnh của עשה và ý nghĩa thụ hưởng của לָנוּ.
- source_word: אֱלֹהִים
  choice: các thần
  rationale: Danh từ אֱלֹהִים có thể mang nghĩa số ít hoặc số nhiều, nhưng động từ số nhiều יֵלְכוּ trong chính câu này nghiêng mạnh về nghĩa số nhiều.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: đi trước chúng tôi
  rationale: Thành ngữ này chỉ việc đi phía trước để dẫn đường; cách diễn đạt tiếng Việt vừa sát nghĩa vừa tự nhiên.
- source_word: כִּי
  choice: vì
  rationale: Biểu đạt rõ quan hệ nguyên nhân trong lời yêu cầu.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: ông Môi-se này, người
  rationale: “Ông Môi-se này” giữ sắc thái chỉ định và phần nào xa cách của זֶה; “người” mở tự nhiên sang mệnh đề quan hệ mà không tạo câu tiếng Việt gượng ép.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: người đã đưa chúng tôi lên khỏi đất Ai Cập
  rationale: Giữ nghĩa Hiphil của עלה là “đưa lên” và dịch đầy đủ מֵאֶרֶץ מִצְרַיִם là “khỏi đất Ai Cập.”
- source_word: לֹא יָדַעְנוּ
  choice: chúng tôi không biết
  rationale: Dạng hoàn thành diễn tả tình trạng nhận thức hiện tại trong ngữ cảnh lời nói trực tiếp.
- source_word: מֶה הָיָה לוֹ
  choice: chuyện gì đã xảy ra với ông ấy
  rationale: Diễn đạt tự nhiên thành ngữ Hê-bơ-rơ hỏi về điều đã xảy đến hoặc số phận của một người.
theological_decisions:
- issue: Nên dịch אֱלֹהִים trong lời thuật của A-rôn là số ít hay số nhiều
  choice: 'Số nhiều: “các thần”'
  alternative: 'Số ít: “một vị thần”'
  rationale: Động từ số nhiều יֵלְכוּ (“đi”) ủng hộ rõ rệt cách hiểu số nhiều trong câu này. Bản dịch giữ nguyên sự căng thẳng với hình tượng một con bê ở văn cảnh, thay vì tự điều hòa cách diễn đạt.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “chúng tôi” phù hợp lời dân nói với A-rôn; “ông Môi-se này” giữ sắc thái xa cách của nguyên văn mà không quá miệt thị.
