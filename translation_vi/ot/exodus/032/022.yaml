base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: vi
  text: 'A-rôn thưa: “Xin ngài đừng nổi giận. Chính ngài biết dân chúng vốn hướng về điều ác.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vốn nghiêng về điều ác” hoặc “dễ làm điều ác.” Thành ngữ Hê-bơ-rơ mô tả dân chúng như một tập thể có đặc tính hoặc khuynh hướng hướng về điều ác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  choice: A-rôn thưa
  rationale: Động từ nói mở đầu lời đáp trong mạch tường thuật; “thưa” tự nhiên trong tiếng Việt và thể hiện thái độ kính trọng của A-rôn đối với Môi-se mà không cần dịch cứng liên từ וַ.
- source_word: אַל יִחַר אַף
  choice: Xin ... đừng nổi giận
  rationale: Thành ngữ Hê-bơ-rơ hình dung cơn giận bùng cháy. Tiếng Việt “đừng nổi giận” truyền đạt đúng nghĩa và tự nhiên; “xin” phù hợp với lời khẩn khoản và lối xưng hô kính trọng.
- source_word: אֲדֹנִי
  choice: chúa tôi
  rationale: Đây là lời kính cẩn gọi Môi-se, không phải danh xưng dành cho Đức Chúa Trời. Viết thường giúp tránh nhầm lẫn, đồng thời giữ được sắc thái tôn kính và quan hệ trên dưới của từ Hê-bơ-rơ.
- source_word: אַתָּה יָדַעְתָּ
  choice: Chính ông biết
  rationale: Đại từ אַתָּה được nêu rõ trước động từ, tạo sắc thái nhấn mạnh; “chính ông” thể hiện điều đó tự nhiên trong tiếng Việt.
- source_word: הָעָם
  choice: dân này
  rationale: Danh từ xác định chỉ chính cộng đồng đang được hai người nói đến. “Dân này” tự nhiên trong ngữ cảnh và không thêm một nhóm đối tượng mới.
- source_word: כִּי בְרָע הוּא
  choice: vốn hướng về điều ác
  rationale: Cụm từ mang tính thành ngữ, theo nghĩa đen gần với “nó ở trong điều ác,” trong đó đại từ số ít quy chiếu tập thể về dân chúng. “Vốn hướng về điều ác” diễn đạt đặc tính hoặc khuynh hướng xấu mà không khẳng định quá mức rằng họ hoàn toàn cố định trong sự ác.
theological_decisions:
- issue: אֲדֹנִי là cách gọi một người hay danh xưng thần linh
  choice: chúa tôi
  alternative: lạy chúa / Chúa tôi / thưa ông chủ
  rationale: Người được gọi là Môi-se, nên phải hiểu đây là cách xưng hô kính trọng dành cho con người. Viết “chúa” thường bảo toàn sắc thái nguyên ngữ mà không gợi rằng A-rôn đang gọi Môi-se là Đức Chúa Trời.
- issue: Mức độ cố định của khuynh hướng ác trong בְרָע הוּא
  choice: vốn hướng về điều ác
  alternative: chuyên làm điều ác / chìm trong điều ác / dễ làm điều ác
  rationale: Nguyên ngữ mô tả dân chúng gắn với hoặc có đặc tính là điều ác nhưng không xác định chính xác đó là ý chí cố chấp hay tính dễ sa ngã. Bản dịch chính và chú thích giữ lại khoảng nghĩa này, tránh áp đặt một kết luận giáo lý về bản tính con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” cùng “xin” tạo sắc thái kính cẩn; “chúa tôi” được viết thường để chỉ rõ đây là cách gọi Môi-se, không phải danh xưng thần linh. Dấu chú thích [a] xuất hiện ngay sau cụm từ cần giải thích.
