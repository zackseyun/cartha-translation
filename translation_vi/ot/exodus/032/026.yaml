  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: vi
  text: 'Bấy giờ, Môi-se đứng tại cổng trại và nói: “Ai đứng về phía Yahweh thì hãy đến với tôi!”[a] Tất cả các con trai của Lê-vi[b] đều tụ họp bên ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ nói cô đọng: “Ai về phía Yahweh? Đến với tôi!” Bản dịch làm rõ lời hiệu triệu được ngụ ý.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “tất cả các con trai của Lê-vi”; cũng có thể dịch là “tất cả người Lê-vi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: đứng
  rationale: Động từ עמד ở đây đơn giản chỉ việc Môi-se đứng vào một vị trí; “đứng” tự nhiên và không thêm sắc thái nghi thức hay quân sự.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: tại cổng trại
  rationale: שַׁעַר là cổng hoặc lối cổng; “tại cổng trại” giữ hình ảnh cụ thể và phù hợp cách nói tiếng Việt.
- source_word: מִי לַיהוָה
  choice: Ai đứng về phía Yahweh
  rationale: Cụm này sát nghĩa là “Ai [thuộc/về phía] Yahweh?”; trong ngữ cảnh, ל diễn tả sự quy phục hoặc đứng về phía. Cách dịch này giữ hình thức chất vấn và ý nghĩa về lòng trung thành.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Giữ tên riêng của Đức Chúa Trời được biểu thị bằng Tứ tự YHWH, thay vì thay thế bằng một tước hiệu.
- source_word: אֵלָי
  choice: thì hãy đến với tôi
  rationale: Nguyên văn chỉ nói “về phía tôi/đến tôi”, là một lời hiệu triệu tỉnh lược. Bổ sung động từ “đến” để câu tiếng Việt đầy đủ mà không thêm nội dung ngoài ngữ cảnh.
- source_word: וַיֵּאָסְפוּ אֵלָיו
  choice: tụ họp bên ông
  rationale: Niphal của אסף diễn tả việc tập hợp; אֶל chỉ hướng đến Môi-se. “Tụ họp bên ông” tự nhiên trong tiếng Việt và không thêm sắc thái quân sự.
- source_word: כָּל בְּנֵי לֵוִי
  choice: tất cả con cháu Lê-vi
  rationale: בְּנֵי לֵוִי theo thành ngữ gia tộc–bộ tộc có thể chỉ các hậu duệ hoặc thành viên thuộc chi phái Lê-vi, chứ không chỉ các con trai trực tiếp của Lê-vi. “Con cháu Lê-vi” giữ hình ảnh huyết thống và tránh đồng nhất quá hẹp với chức danh “người Lê-vi”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Bản nguồn dùng trực tiếp danh riêng YHWH. Phiên âm “Yahweh” bảo tồn tính chất danh riêng thay vì thay bằng tước hiệu.
- issue: Ý nghĩa của מִי לַיהוָה
  choice: Ai đứng về phía Yahweh
  alternative: Ai thuộc về Yahweh
  rationale: Cả sự thuộc về và lòng trung thành đều có thể nằm trong cách dùng ל. Trong bối cảnh Môi-se kêu gọi dân công khai chọn phía, “đứng về phía” diễn đạt chức năng ngữ cảnh mà không biến câu thành một tuyên bố về địa vị cứu rỗi.
- issue: Phạm vi của כָּל בְּנֵי לֵוִי
  choice: tất cả con cháu Lê-vi
  alternative: tất cả người Lê-vi / tất cả các con trai Lê-vi
  rationale: Cụm Hê-bơ-rơ giữ lối gọi theo tổ phụ và về mặt hình thức là “các con trai của Lê-vi”. “Con cháu Lê-vi” bảo tồn quan hệ bộ tộc nhưng không buộc người đọc hiểu là các con ruột trực tiếp.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Bấy giờ” để nối diễn tiến, “trại” thay cho từ Hán-Việt nặng hơn, và cấu trúc hiệu triệu trực tiếp để giữ sức mạnh của lời Môi-se. Các dấu chú thích [a], [b] đều được đặt ngay sau phần văn bản liên quan.
