revisions:
- from: 'Khi dân chúng thấy Môi-se xuống núi quá lâu, họ tụ tập quanh A-rôn và nói với ông: “Đứng dậy, hãy làm cho chúng tôi các thần[a] đi trước chúng tôi; vì còn Môi-se này, người đã đưa chúng tôi lên khỏi đất Ai Cập, chúng tôi không biết chuyện gì đã xảy ra với ông ấy.”'
  to: 'Khi dân chúng thấy Môi-se lâu mà chưa xuống núi, họ tụ tập quanh A-rôn và nói với ông: “Đứng dậy, hãy làm cho chúng tôi các thần[a] sẽ đi trước chúng tôi; vì Môi-se này, người đã đưa chúng tôi lên khỏi đất Ai Cập, chúng tôi không biết chuyện gì đã xảy ra với ông ấy.”'
  rationale: Sửa cách diễn đạt về sự chậm trễ của Môi-se để tránh hàm ý rằng dân chúng chứng kiến ông đang xuống núi. Điều chỉnh nhẹ mệnh đề cuối để tiếng Việt tự nhiên hơn, không thay đổi nghĩa hay sắc thái. Chú thích số ít/số nhiều được giữ lại và đồng bộ với bản văn sửa đổi.
