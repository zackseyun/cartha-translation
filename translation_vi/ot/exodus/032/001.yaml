source:
  edition: WLC
  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: vi
  text: 'Khi dân chúng thấy Môi-se lâu mà chưa xuống núi, họ tụ tập quanh A-rôn và nói với ông: “Đứng dậy, hãy làm cho chúng tôi các thần[a] sẽ đi trước chúng tôi; vì Môi-se này, người đã đưa chúng tôi lên khỏi đất Ai Cập, chúng tôi không biết chuyện gì đã xảy ra với ông ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một vị thần… sẽ đi trước chúng tôi.” Một số người hiểu אֱלֹהִים ở đây theo nghĩa số ít vì phần kể tiếp theo tập trung vào một tượng bò con; tuy nhiên, từ Hê-bơ-rơ này và động từ theo sau đều ở dạng số nhiều.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: xuống núi quá lâu
  rationale: Diễn đạt tự nhiên nhận định của dân chúng rằng Môi-se chậm xuống, đồng thời giữ ý trì hoãn hoặc mất nhiều thời gian.
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: tụ tập quanh A-rôn
  rationale: Giữ hình ảnh dân chúng cùng kéo đến chỗ A-rôn mà không diễn giải quá mức thành hành động công khai chống lại ông.
- source_word: קוּם
  choice: Đứng dậy
  rationale: Mệnh lệnh ngắn, gấp và mạnh; cách nói hiện đại nhưng vẫn trang trọng.
- source_word: אֱלֹהִים ... יֵלְכוּ
  choice: các thần ... đi
  rationale: Danh từ có hình thức số nhiều và động từ theo sau cũng ở số nhiều; bản dịch chính giữ sự phù hợp ngữ pháp này.
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: đưa chúng tôi lên khỏi đất Ai Cập
  rationale: Giữ động từ chỉ việc đưa lên trong nguyên ngữ và cách gọi đầy đủ “đất Ai Cập”.
- source_word: מֶה הָיָה לוֹ
  choice: chuyện gì đã xảy ra với ông ấy
  rationale: Thành ngữ tiếng Việt hiện đại, tự nhiên, diễn đạt câu hỏi về số phận của Môi-se.
theological_decisions:
- issue: אֱלֹהִים trong câu này nên được hiểu là số ít hay số nhiều
  choice: 'Số nhiều: “các thần”'
  alternative: 'Số ít: “một vị thần”'
  rationale: Ngữ pháp trực tiếp nghiêng về số nhiều vì אֱלֹהִים có hình thức số nhiều và יֵלְכוּ là động từ số nhiều. Tuy nhiên, câu chuyện tiếp theo tập trung vào một tượng bò con, nên cách hiểu số ít được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ sắc thái thúc ép và phần nào coi thường trong “còn Môi-se này”, đồng thời không làm mạnh thêm mức độ thù địch của việc dân chúng tụ tập quanh A-rôn.
