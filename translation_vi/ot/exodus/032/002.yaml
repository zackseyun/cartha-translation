base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: vi
  text: 'A-rôn nói với họ: “Hãy tháo[a] những chiếc khuyên vàng đeo nơi tai vợ, con trai và con gái của các ngươi, rồi đem đến cho ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy bứt những chiếc khuyên vàng…”. Động từ Hê-bơ-rơ có thể gợi ý việc tháo hoặc bứt đồ trang sức ra một cách mạnh tay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם אַהֲרֹן
  choice: A-rôn nói với họ
  rationale: Dịch trực tiếp chủ ngữ, động từ và đại từ. Trong tiếng Việt, không cần thêm từ nối để diễn tiến tự sự được tự nhiên.
- source_word: פָּרְקוּ
  choice: hãy tháo
  rationale: Trong ngữ cảnh đồ trang sức đeo trên người, “tháo” là cách diễn đạt tự nhiên; sắc thái mạnh hơn của động từ Hê-bơ-rơ được bảo lưu trong chú thích.
- source_word: נִזְמֵי הַזָּהָב
  choice: những chiếc khuyên vàng
  rationale: נֶזֶם có thể chỉ khuyên mũi hoặc khuyên tai; cụm tiếp theo xác định chúng ở tai, nên “khuyên” vừa gọn vừa tránh diễn giải thừa.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: đeo nơi tai
  rationale: Diễn đạt vị trí của những chiếc khuyên bằng tiếng Việt tự nhiên, đồng thời giữ hình ảnh cụ thể của nguyên văn.
- source_word: נְשֵׁיכֶם בְּנֵיכֶם וּבְנֹתֵיכֶם
  choice: vợ, con trai và con gái của các ngươi
  rationale: Giữ nguyên các nhóm gia đình được nêu riêng trong tiếng Hê-bơ-rơ; “vợ” phù hợp nhất với ngữ cảnh hộ gia đình.
- source_word: וְהָבִיאוּ אֵלָי
  choice: rồi đem đến cho ta
  rationale: “Rồi” thể hiện tự nhiên bước hành động kế tiếp; tân ngữ được hiểu từ “những chiếc khuyên vàng” và không cần lặp lại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi/ta” để phản ánh lời truyền trực tiếp trong bối cảnh cổ mà không quá cổ kính. Dấu chú thích được đặt ngay sau toàn bộ cụm chỉ những người đang đeo khuyên, vì chú thích giải thích cách tháo các khuyên ấy.
