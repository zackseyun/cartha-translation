base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: vi
  text: 'Ông nói: “Đó không phải tiếng reo chiến thắng, cũng không phải tiếng kêu thất trận; tôi nghe tiếng ca hát.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tiếng hò reo” hoặc “tiếng đáp lại”. Các dạng tiếng Hê-bơ-rơ bắt nguồn từ ענה có thể chỉ tiếng đáp, tiếng hô hay tiếng reo; vì vậy, vế cuối cũng có thể dịch khái quát hơn là: “Tôi nghe tiếng hò reo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ông nói
  rationale: Diễn đạt tự nhiên mạch kể chuyện của động từ wayyiqtol; đại từ “ông” giữ nguyên cách quy chiếu theo ngữ cảnh mà không tự ý thêm tên riêng.
- source_word: קוֹל
  choice: tiếng
  rationale: “Tiếng” là từ tự nhiên trong tiếng Việt cho âm thanh được nghe thấy, dùng nhất quán trong cả ba vế.
- source_word: עֲנוֹת / עַנּוֹת
  choice: reo / kêu / ca hát
  rationale: Các dạng từ ענה ở đây chỉ âm thanh phát ra bằng tiếng người. Khi đi với “chiến thắng” và “thất trận”, “reo” và “kêu” phù hợp với tiếng hô trong chiến trận; ở vế cuối, “ca hát” phù hợp với cảnh vui chơi quanh con bê, trong khi chú thích vẫn bảo lưu khả năng hiểu rộng hơn là tiếng hò reo hoặc tiếng đáp lại.
- source_word: גְּבוּרָה
  choice: chiến thắng
  rationale: Tuy từ này thường có nghĩa là sức mạnh hoặc uy lực, sự đối lập với חֲלוּשָׁה trong ngữ cảnh âm thanh tưởng như từ chiến trận cho thấy tiếng reo của bên thắng.
- source_word: חֲלוּשָׁה
  choice: thất trận
  rationale: Từ này gắn với sự yếu thế; trong cặp đối lập mang sắc thái chiến trận, “thất trận” diễn đạt tự nhiên tiếng kêu của bên bị đánh bại.
- source_word: אֵין
  choice: không phải
  rationale: Cách phủ định này tự nhiên trong cấu trúc tiếng Việt “không phải tiếng…”, đồng thời giữ phép lặp của hai vế đầu.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: tôi nghe
  rationale: Đại từ nhấn mạnh cùng phân từ diễn tả sự nhận biết đang xảy ra; “tôi nghe” là cách nói hiện đại, tự nhiên.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Nhịp đối xứng của hai vế phủ định được giữ lại; dấu chấm phẩy làm nổi bật kết luận ở vế cuối. Sự chuyển từ tiếng hô chiến trận sang tiếng ca hát được thể hiện trong chính văn, còn độ mơ hồ từ vựng của tiếng Hê-bơ-rơ được bảo lưu trong chú thích.
