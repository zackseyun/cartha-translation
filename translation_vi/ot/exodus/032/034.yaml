  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: vi
  text: Nhưng bây giờ, hãy đi, dẫn dân ấy đến nơi Ta đã phán bảo con. Này, thiên sứ của Ta sẽ đi trước con. Nhưng đến ngày Ta truy xét, Ta sẽ truy xét họ về tội lỗi của họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nhưng bây giờ
  rationale: Liên từ וְ trong ngữ cảnh chuyển ý sau lời cầu xin của Môi-se mang sắc thái đối lập nhẹ; cách dịch này tự nhiên và phù hợp mạch văn.
- source_word: נְחֵה
  choice: dẫn
  rationale: Động từ נח"ה ở thể Hifil mang nghĩa hướng dẫn, dẫn dắt; “dẫn” rõ ràng và trang trọng trong tiếng Việt hiện đại.
- source_word: הִנֵּה
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của הִנֵּה mà không làm câu quá cổ kính.
- source_word: מַלְאָכִי
  choice: thiên sứ của Ta
  rationale: מַלְאָךְ có thể chỉ sứ giả hoặc thiên sứ; trong ngữ cảnh vị được Đức Chúa Trời sai đi trước dân, “thiên sứ” là cách gọi quen thuộc, đồng thời không xác định thêm danh tính.
- source_word: פָקַד
  choice: xét đến
  rationale: פָקַד có trường nghĩa thăm viếng, lưu tâm, kiểm tra và trừng phạt. “Xét đến” giữ được tính quy trách nhiệm và sự dè dặt của nguyên ngữ hơn là chỉ dịch thẳng thành “trừng phạt”.
- source_word: חַטָּאתָם
  choice: tội của họ
  rationale: Danh từ số ít với hậu tố số nhiều chỉ tội lỗi tập thể của dân; “tội của họ” bảo toàn hình thức và ý nghĩa.
theological_decisions:
- issue: Danh tính của מַלְאָכִי
  choice: Không xác định thiên sứ này là một nhân vật thần học cụ thể ngoài cách gọi “thiên sứ của Ta”.
  alternative: Diễn giải là chính sự hiện diện của Đức Chúa Trời hoặc một nhân vật thần linh được định danh.
  rationale: Câu văn chỉ nói “thiên sứ của Ta”; việc định danh thêm sẽ vượt quá bằng chứng của câu.
- issue: Sắc thái phán xét của פָקַד
  choice: Dịch lặp “Ta xét đến, Ta sẽ xét tội” để giữ phép lặp của cùng một gốc từ và hàm ý quy trách nhiệm.
  alternative: “Đến ngày Ta trừng phạt, Ta sẽ trừng phạt họ vì tội ấy.”
  rationale: Ngữ cảnh chắc chắn hàm ý phán xét, nhưng bản thân פָקַד rộng hơn “trừng phạt”; “xét đến” duy trì phần nào độ mở từ vựng và sự căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ “Ta/con” thể hiện lời Đức Chúa Trời nói trực tiếp với Môi-se; “dân ấy” phản ánh mạo từ xác định trong הָעָם và mạch văn. Không dùng chú thích vì bản dịch chính có thể bảo toàn ý nghĩa và độ mở cần thiết.
