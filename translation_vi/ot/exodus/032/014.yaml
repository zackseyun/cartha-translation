  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: vi
  text: Bấy giờ Yahweh đổi ý về tai họa mà Ngài đã phán sẽ giáng trên dân Ngài.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nguôi ý” hoặc “hối tiếc” về tai họa mà Ngài đã phán sẽ giáng trên dân Ngài.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn tiếng Hê-bơ-rơ: “điều ác/tai họa”; tại đây từ này chỉ tai họa hoặc tổn hại đã được đe dọa, không phải điều ác về mặt đạo đức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: nguôi ý
  rationale: Dạng Niphal của נחם ở đây diễn tả việc không tiếp tục đường lối hành động đã báo trước. “Nguôi ý” tự nhiên trong tiếng Việt, giữ được sự chuyển biến thực sự trong mạch kể mà không nhất thiết hàm ý Đức Chúa Trời đã sai lầm hay thiếu hiểu biết.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng của Đức Chúa Trời, thay vì thay thế bằng một tước hiệu.
- source_word: עַל הָרָעָה
  choice: về tai họa
  rationale: עַל chỉ điều liên quan đến sự nguôi ý; רָעָה trong ngữ cảnh phán xét là tai họa được báo trước, không phải điều ác về mặt đạo đức.
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת
  choice: mà Ngài đã phán sẽ giáng
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho lời tuyên bố trước đó về hành động sắp thực hiện. “Giáng” làm rõ rằng tai họa sẽ xảy đến trên dân, phù hợp với ngữ cảnh.
- source_word: לְעַמּוֹ
  choice: trên dân Ngài
  rationale: Giới từ đánh dấu đối tượng chịu tai họa; “trên dân Ngài” kết hợp tự nhiên với động từ “giáng”.
theological_decisions:
- issue: Cách nói mang tính nhân hình về Đức Chúa Trời trong động từ נחם
  choice: Dùng “nguôi ý” trong chính văn.
  alternative: “đổi ý” hoặc “hối tiếc”
  rationale: Câu chuyện cho thấy một sự thay đổi thực sự đối với hành động đã được báo trước sau lời cầu thay. “Nguôi ý” giữ nguyên sức căng thần học ấy nhưng không diễn giải quá mức về bản tính hay tri thức của Đức Chúa Trời; các cách dịch khác được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ danh Yahweh theo dạng phiên âm; dùng “Ngài” để quy chiếu kính trọng. Hai dấu chú thích đều xuất hiện trong chính văn.
