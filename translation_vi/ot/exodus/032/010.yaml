source:
  edition: WLC
  text: וְ/עַתָּה֙ הַנִּ֣יחָ/ה לִּ֔/י וְ/יִֽחַר אַפִּ֥/י בָ/הֶ֖ם וַ/אֲכַלֵּ֑/ם וְ/אֶֽעֱשֶׂ֥ה אוֹתְ/ךָ֖ לְ/ג֥וֹי גָּדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: vi
  text: Bây giờ, hãy để Ta yên[a], để cơn giận Ta bừng cháy chống lại chúng và Ta tiêu diệt chúng[b]; rồi Ta sẽ làm cho con thành một dân lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy để Ta một mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “và Ta thiêu nuốt chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Bây giờ
  rationale: Dấu hiệu diễn ngôn này chuyển lời nói sang mệnh lệnh tức thời; “Bây giờ” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: הַנִּיחָה לִּי
  choice: hãy để Ta yên
  rationale: Dạng mệnh lệnh trong thành ngữ này có nghĩa là để một người yên, không tiếp tục ngăn cản họ. Cách dịch giữ nguyên lực của mệnh lệnh mà không diễn giải đây là lời mời Môi-se cầu thay.
- source_word: וְיִחַר אַפִּי
  choice: để cơn giận Ta bừng cháy
  rationale: Thành ngữ Hê-bơ-rơ diễn tả cơn giận nóng lên hoặc bốc cháy. “Bừng cháy” giữ hình ảnh sống động; “để” thể hiện sắc thái mục đích/kết quả của liên từ sau mệnh lệnh.
- source_word: בָהֶם
  choice: nghịch cùng chúng
  rationale: Giới từ chỉ hướng đối nghịch của cơn giận. “Nghịch cùng” trang trọng, dễ hiểu và phù hợp văn cảnh phán xét.
- source_word: וַאֲכַלֵּם
  choice: và Ta tiêu diệt chúng
  rationale: Động từ כלה ở thể Piel có thể mang nghĩa làm cho hết, tiêu hủy hoặc tiêu diệt. “Tiêu diệt” là cách nói tự nhiên trong tiếng Việt; chú thích giữ phương án gần hình ảnh từ vựng hơn là “thiêu nuốt”.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ
  choice: rồi Ta sẽ làm cho con thành
  rationale: Cấu trúc עשה với bổ ngữ ל diễn tả việc làm cho một người trở thành điều được nêu tiếp theo. “Rồi” truyền đạt bước tiếp nối của lời tuyên bố mà không làm thay đổi nội dung.
- source_word: לְגוֹי גָּדוֹל
  choice: một dân lớn
  rationale: גוי chỉ một dân hay dân tộc. “Một dân lớn” vừa trực tiếp vừa giữ được âm vang của lời hứa giao ước mà không thêm lời giải thích.
theological_decisions:
- issue: Ngôn ngữ nhân hình về cơn giận của Đức Chúa Trời
  choice: Giữ hình ảnh cơn giận “bừng cháy”.
  alternative: 'Diễn đạt trừu tượng hơn: “Ta sẽ nổi giận với chúng.”'
  rationale: Nguyên văn dùng hình ảnh mạnh về cơn giận nóng cháy. Giữ hình ảnh này bảo tồn sức nặng trần thuật và sự căng thẳng thần học về sự thánh khiết và phán xét của Đức Chúa Trời.
- issue: Lực của mệnh lệnh הַנִּיחָה לִּי liên quan đến sự cầu thay của Môi-se
  choice: 'Dịch như một mệnh lệnh thực: “hãy để Ta yên”, không giải thích dụng ý trong chính văn.'
  alternative: Diễn giải thành lời ngầm mời Môi-se cầu thay.
  rationale: Câu này trực tiếp nêu mệnh lệnh, sự phán xét và lời hứa. Việc xem mệnh lệnh như lời mời cầu thay là một suy luận giải kinh, không nên đưa vào bản dịch.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con” phù hợp lời Đức Chúa Trời phán trực tiếp với Môi-se. Bản dịch giữ phép ẩn dụ về cơn giận bừng cháy, đồng thời dùng “tiêu diệt” cho cách diễn đạt tự nhiên; mọi dấu chú thích đều có mặt trong chính văn.
