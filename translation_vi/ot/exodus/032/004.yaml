base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: vi
  text: 'Ông nhận lấy vật ấy từ tay họ, dùng một dụng cụ chạm khắc[a] để tạo hình nó, rồi làm thành một tượng bê con bằng kim loại đúc. Bấy giờ họ nói[b]: “Hỡi Israel, đây là các thần của ngươi[c], những vị đã đưa ngươi lên khỏi đất Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hê-bơ-rơ chỉ dụng cụ ở đây chưa rõ nghĩa chính xác; cũng có thể hiểu là bút nhọn, dao trổ hoặc đục.
    reason: lexical_alternative
  - marker: b
    text: 'Một số truyền thống văn bản đọc: “ông nói”. Bản Masoret đọc: “họ nói”.'
    reason: textual_variant
  - marker: c
    text: 'Nguyên văn Hê-bơ-rơ dùng số nhiều: “đây là các thần của ngươi”. Theo truyền thống, câu này thường được dịch ở số ít: “đây là thần của ngươi”, có lẽ vì chỉ có một tượng bê con.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: Ông nhận lấy vật ấy từ tay họ
  rationale: Động từ לָקַח có thể là “lấy” hoặc “nhận”. “Nhận lấy” phù hợp với việc dân chúng trao vàng ở câu trước; “vật ấy” giữ đại từ chỉ đối tượng của bản Hê-bơ-rơ mà không xác định quá mức.
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: dùng một dụng cụ chạm khắc mà tạo hình
  rationale: יָצַר diễn tả việc tạo hình có chủ ý. Nghĩa chính xác của חֶרֶט còn được tranh luận, nên bản dịch dùng cách gọi khái quát và ghi chú các khả năng.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: rồi làm thành một tượng bê con đúc
  rationale: עֵגֶל là bê con; מַסֵּכָה chỉ vật hoặc tượng được đúc. Thêm “tượng” làm rõ đây là hình tượng, còn “đúc” giữ phương thức chế tác. “Rồi” phản ánh chuỗi động từ kể chuyện mà không giải quyết thay cho nguyên văn sự căng thẳng giữa tạo hình và đúc.
- source_word: וַיֹּאמְרוּ
  choice: họ nói
  rationale: Bản Masoret dùng động từ số nhiều. Chủ thể số nhiều được giữ trong chính văn; dị bản số ít được nêu ở chú thích.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: đây là các thần của ngươi
  rationale: אֵלֶּה và hình thái אֱלֹהֶיךָ ở đây đều là số nhiều. Bản dịch giữ nguyên số nhiều dù chỉ có một tượng bê con, không âm thầm làm phẳng sự căng thẳng của câu.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: những vị đã đưa ngươi lên khỏi đất Ai Cập
  rationale: Dạng Hiphil của עָלָה theo nghĩa đen là “đưa lên”. “Những vị” phù hợp với tiền ngữ số nhiều và giúp câu tiếng Việt tự nhiên; “đất Ai Cập” giữ đầy đủ cụm từ Hê-bơ-rơ.
theological_decisions:
- issue: Số nhiều hay số ít trong lời tung hô thần tượng
  choice: “đây là các thần của ngươi”
  alternative: “đây là thần của ngươi” hoặc “đây là Đức Chúa Trời của ngươi”
  rationale: Bản Masoret có đại từ chỉ định và cách diễn đạt ở số nhiều. Giữ số nhiều bảo tồn sự căng thẳng với một tượng bê con duy nhất và tránh áp đặt cách hài hòa truyền thống.
- issue: Vai trò trực tiếp của A-rôn trong việc chế tác
  choice: Giữ A-rôn làm chủ thể của cả hành động tạo hình và làm tượng
  alternative: Diễn đạt như thể ông chỉ nhận vàng hoặc giám sát công việc
  rationale: Các động từ số ít trong nguyên văn trực tiếp quy hành động cho A-rôn; bản dịch không làm nhẹ trách nhiệm của ông.
- issue: Quan hệ giữa thao tác chạm khắc và việc đúc
  choice: Giữ hai hành động theo thứ tự kể chuyện của nguyên văn
  alternative: Chuyển thao tác tạo hình thành một mệnh đề phụ mô tả chung quá trình đúc
  rationale: Cấu trúc Hê-bơ-rơ đặt hai động từ nối tiếp nhau. Vì quan hệ kỹ thuật giữa chúng không chắc chắn và חֶרֶט là một từ khó, bản dịch không tái cấu trúc theo một quy trình chế tác giả định.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “ông” cho A-rôn theo ngữ cảnh, “Hỡi Israel” để thể hiện lời gọi trực tiếp, và “ngươi” trong lời tuyên bố cổ trang trọng. Các thuật ngữ kỹ thuật được diễn đạt dễ hiểu, còn những điểm bất định về dụng cụ, dị bản chủ thể và số của danh từ thần linh được bảo tồn bằng chú thích.
