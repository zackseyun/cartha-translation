  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi sự kiện và các yếu tố chính của tiếng Hê-bơ-rơ: Môi-se đến gần trại, thấy con bê và các điệu nhảy, nổi cơn giận, ném các bảng và làm vỡ chúng dưới chân núi. “Cơn giận ... bừng lên” phản ánh tốt thành ngữ וַיִּחַר אַף. Tuy nhiên, chú thích hiện tại không nêu một phương án khác biệt thực sự so với cách dịch chính.'
