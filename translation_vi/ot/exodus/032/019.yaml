base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: vi
  text: Khi ông đến gần trại, thấy con bê và những điệu nhảy múa[a], cơn giận của Môi-se bừng lên. Ông ném các bảng đá khỏi tay mình và đập vỡ chúng dưới chân núi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và thấy con bê cùng việc nhảy múa.” Danh từ Hê-bơ-rơ ở số nhiều, cũng có thể được diễn đạt theo nghĩa tập hợp trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Khi
  rationale: Công thức trần thuật này chuyển sang sự việc kế tiếp; “Khi” diễn đạt tự nhiên quan hệ thời gian trong tiếng Việt mà không giữ cách nói rườm rà “và xảy ra là khi”.
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: đến gần trại
  rationale: Giữ đúng ý không gian của קָרַב và dùng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: thấy con bê
  rationale: רָאָה là động từ thông thường chỉ việc nhìn thấy; mạo từ xác định chỉ con bê đã được nhắc đến trong văn cảnh.
- source_word: וּמְחֹלֹת
  choice: cùng những điệu nhảy múa
  rationale: Danh từ số nhiều מְחֹלֹת chỉ các điệu nhảy hoặc việc nhảy múa. Cách dịch này giữ sắc thái số nhiều và tránh thêm ý diễn giải như “cuộc truy hoan”.
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: cơn giận của Môi-se bừng lên
  rationale: Bảo tồn hình ảnh mạnh của thành ngữ Hê-bơ-rơ về cơn giận bốc cháy, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: Ông ném ... khỏi tay mình
  rationale: שָׁלַךְ có nghĩa là ném/quăng. Bản Hê-bơ-rơ dùng “tay” số ít, nên bản dịch giữ số ít thay vì điều chỉnh theo hai bảng.
- source_word: הַלֻּחֹת
  choice: các bảng đá
  rationale: לוּחֹת là các bảng; thêm “đá” dựa trên văn cảnh gần (Xuất Ai Cập 31:18; 32:16), giúp danh từ rõ nghĩa tự nhiên trong tiếng Việt.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: đập vỡ chúng
  rationale: שָׁבַר diễn tả việc làm cho vỡ; “đập vỡ” thể hiện hành động có lực mà không quá khẩu ngữ.
- source_word: תַּחַת הָהָר
  choice: dưới chân núi
  rationale: Trong địa hình này, תַּחַת được diễn đạt tự nhiên là “dưới chân núi”, thay vì cách dịch máy móc “ở dưới ngọn núi”.
theological_decisions: []
translation_notes:
  register: Văn phong trần thuật hiện đại, trang trọng và dễ hiểu. Dùng “Môi-se” theo cách phiên âm quen thuộc trong tiếng Việt; giữ hình ảnh cơn giận “bừng lên” và tránh gán cho việc nhảy múa một ý nghĩa thần học vượt quá từ ngữ của câu.
