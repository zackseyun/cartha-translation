    rationale: Bản chính đã dùng số nhiều “những điệu nhảy múa,” còn phương án “các điệu nhảy” không tạo ra lựa chọn dịch thuật có ý nghĩa. Nên ghi phương án tập hợp số ít “việc nhảy múa” để phản ánh khả năng diễn đạt tự nhiên khác của danh từ số nhiều Hê-bơ-rơ.
