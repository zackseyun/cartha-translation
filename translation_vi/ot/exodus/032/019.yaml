  terminology: “Môi-se,” “con bê,” “các bảng đá,” và “dưới chân núi” đều phù hợp cách dùng tiếng Việt Kinh Thánh hiện đại. Không cần áp đặt cách diễn giải về tính chất của các điệu nhảy.
