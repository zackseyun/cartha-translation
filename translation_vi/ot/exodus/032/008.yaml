  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: vi
  text: 'Họ đã nhanh chóng rời bỏ con đường mà Ta đã truyền họ phải theo. Họ đã đúc cho mình một tượng bò con và sấp mình trước nó, dâng sinh tế cho nó, rồi nói: “Hỡi Y-sơ-ra-ên, đây là các thần của ngươi[a], những vị đã đưa ngươi lên khỏi đất Ai Cập.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đây là thần của ngươi, hỡi Y-sơ-ra-ên.” Nguyên văn Hê-bơ-rơ là “đây là các thần của ngươi,” dù trong ngữ cảnh chỉ có một tượng bò con.'
    reason: alternative_reading
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: đã nhanh chóng lìa khỏi
  rationale: Giữ sắc thái chệch khỏi hoặc rời bỏ một con đường đã định, đồng thời diễn đạt rõ sự bội phản xảy ra rất sớm.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: khỏi con đường mà Ta đã truyền cho họ
  rationale: Bảo tồn hình ảnh ẩn dụ về con đường vâng phục; “truyền cho họ” diễn đạt tự nhiên bổ ngữ của động từ צוה.
- source_word: עָשׂוּ לָהֶם
  choice: đã đúc cho mình
  rationale: '“Cho mình” giữ sắc thái phản thân: chính họ tạo ra vật thờ phượng cho bản thân.'
- source_word: עֵגֶל מַסֵּכָה
  choice: một tượng bò con
  rationale: Trong ngữ cảnh với động từ “đúc”, cách nói này vừa tự nhiên trong tiếng Việt vừa cho thấy đây là hình tượng đúc mang hình bò con.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: sấp mình trước nó
  rationale: Giữ hành động cụ thể là phủ phục, thay vì khái quát hóa ngay thành “thờ phượng”.
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: dâng sinh tế cho nó
  rationale: Diễn đạt rõ hành vi tế lễ mang tính nghi thức và đối tượng nhận lễ.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: đây là các thần của ngươi
  rationale: Giữ nguyên hình thức số nhiều rõ ràng của đại từ và danh từ trong tiếng Hê-bơ-rơ, dù ngữ cảnh chỉ có một tượng bò con.
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרַיִם
  choice: đã đưa ngươi lên khỏi đất Ai Cập
  rationale: Giữ nghĩa căn bản “đưa lên” của עלה và công thức Xuất Hành, đồng thời “lên khỏi” tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Số của אֱלֹהֶיךָ trong lời tung hô tượng thần
  choice: 'Giữ số nhiều: “đây là các thần của ngươi”'
  alternative: “đây là thần của ngươi”
  rationale: Ngữ pháp Hê-bơ-rơ biểu thị số nhiều, trong khi vật quy chiếu là một tượng bò con. Bản chính giữ căng thẳng này; cách hiểu số ít được ghi ở chú thích.
- issue: Ý nghĩa của וַיִּשְׁתַּחֲווּ
  choice: “sấp mình trước nó”
  alternative: “thờ lạy nó”
  rationale: 'Cách dịch đã chọn bảo tồn hành động thân thể cụ thể và trình tự: sấp mình, dâng sinh tế, rồi tuyên xưng.'
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ta/ngươi” trong lời Đức Chúa Trời phán và lời trực tiếp mang sắc thái Kinh Thánh; đặt lời gọi “Hỡi Y-sơ-ra-ên” đầu câu để câu tiếng Việt tự nhiên mà vẫn giữ chức năng hô cách.
