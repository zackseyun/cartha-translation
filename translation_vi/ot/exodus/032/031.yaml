  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các yếu tố chính của tiếng Hê-bơ-rơ: Môi-se trở lại với Yahweh, lời thú nhận tội trọng của dân, và cụm số nhiều “các thần bằng vàng”. Tuy nhiên, אָנָּא là tiểu từ khẩn cầu; “Ôi!” với dấu chấm than chủ yếu tạo cảm giác cảm thán than vãn, không chuyển tải rõ nét lời nài xin.'
