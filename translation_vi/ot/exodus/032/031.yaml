  - severity: low
    issue: Vị trí ký hiệu chú thích
    rationale: Ký hiệu chú thích nên đặt ngay sau cụm “các thần bằng vàng”, trước dấu chấm, để neo rõ vào cụm số nhiều được chú giải.
