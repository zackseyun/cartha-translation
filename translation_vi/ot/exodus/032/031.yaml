source:
  edition: WLC
  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אָ֣נָּ֗א חָטָ֞א הָ/עָ֤ם הַ/זֶּה֙ חֲטָאָ֣ה גְדֹלָ֔ה וַ/יַּֽעֲשׂ֥וּ לָ/הֶ֖ם אֱלֹהֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: vi
  text: 'Rồi Môi-se trở lại với Yahweh và thưa: “Ôi, dân này đã phạm một tội lớn: họ đã làm cho mình các thần bằng vàng[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “một thần bằng vàng”. Tiếng Hê-bơ-rơ viết “các thần bằng vàng” ở số nhiều, dù một số người hiểu cụm từ này chỉ con bê vàng ở số ít theo văn cảnh rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: trở lại
  rationale: Động từ שׁוב ở đây diễn tả việc Môi-se quay lại với Yahweh sau khi đối diện với dân chúng; “trở lại” tự nhiên và sát nghĩa.
- source_word: אֶל יְהוָה
  choice: với Yahweh
  rationale: Giới từ אֶל chỉ hướng Môi-se trở về để đến trước và thưa chuyện với Đức Chúa Trời; “với Yahweh” tự nhiên trong tiếng Việt khi đi cùng “trở lại”. Danh riêng Yahweh bảo tồn danh giao ước יהוה.
- source_word: אָנָּא
  choice: Ôi!
  rationale: Tiểu từ này biểu lộ lời khẩn nài đầy xúc động. “Ôi!” giữ được sắc thái van xin mà không tạo thêm một động từ không có trong nguyên văn.
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: Dân này đã phạm một tội lớn
  rationale: Giữ danh từ tập hợp số ít “dân này” và phản ánh cấu trúc đồng căn חָטָא...חֲטָאָה, nhấn mạnh mức độ nghiêm trọng của tội lỗi.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: họ đã làm cho mình
  rationale: “Cho mình” chuyển tải sắc thái hướng về chính họ của לָהֶם, đồng thời phù hợp với cách nói tự nhiên trong tiếng Việt.
- source_word: אֱלֹהֵי זָהָב
  choice: các thần bằng vàng
  rationale: Nguyên văn dùng dạng số nhiều אֱלֹהֵי; bản dịch chính giữ số nhiều thay vì tự điều hòa với con bê vàng số ít trong văn cảnh.
theological_decisions:
- issue: Cách chuyển dịch danh יהוה
  choice: Yahweh
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA
  rationale: Dùng “Yahweh” để thể hiện trực tiếp danh giao ước trong nguyên văn, thay vì thay bằng một tước hiệu.
- issue: Số của אֱלֹהֵי זָהָב
  choice: các thần bằng vàng
  alternative: một thần bằng vàng
  rationale: Giữ dạng số nhiều rõ ràng của tiếng Hê-bơ-rơ trong câu chính, nhưng ghi nhận cách hiểu số ít dựa trên con bê vàng trong văn cảnh qua chú thích, không tự ý giải quyết sự căng thẳng của bản văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Thưa” phù hợp khi Môi-se nói với Yahweh; dấu hai chấm nối lời xác nhận tội với hành vi cụ thể. Chú thích được đặt ngay sau cụm từ mà nó giải thích.
