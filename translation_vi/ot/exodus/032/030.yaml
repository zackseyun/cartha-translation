  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: vi
  text: 'Ngày hôm sau, Môi-se nói với dân chúng: “Chính anh em đã phạm một tội rất nghiêm trọng.[a] Bây giờ tôi sẽ lên gặp Yahweh; may ra tôi có thể chuộc tội cho anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hê-bơ-rơ dùng lối nói đồng căn, sát nghĩa là: “Anh em đã phạm một tội lớn,” nhằm nhấn mạnh tính nghiêm trọng của tội lỗi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Ngày hôm sau
  rationale: Diễn đạt tự nhiên trình tự thời gian của lời kể; không cần dịch máy móc וַיְהִי thành một mệnh đề riêng trong tiếng Việt.
- source_word: אַתֶּם
  choice: Chính anh em
  rationale: Từ “chính” thể hiện sự nhấn mạnh của đại từ số nhiều được nêu tường minh trong tiếng Hê-bơ-rơ.
- source_word: חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: đã phạm một tội rất nghiêm trọng
  rationale: Cách nói tự nhiên trong tiếng Việt, truyền đạt sức nhấn mạnh của kết cấu đồng căn và mức độ nặng nề của hành vi; chú thích ghi lại hình thức sát chữ.
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: tôi sẽ lên gặp Yahweh
  rationale: “Lên” giữ hướng chuyển động về núi và “gặp” diễn đạt tự nhiên quan hệ của אֶל trong ngữ cảnh Môi-se đến trước mặt Đức Chúa Trời.
- source_word: אוּלַי
  choice: may ra
  rationale: Thể hiện vừa hy vọng vừa không chắc chắn, phù hợp sắc thái trang trọng của lời Môi-se.
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: tôi có thể chuộc tội cho anh em
  rationale: “Chuộc tội” chuyển tải nghĩa của động từ כפר trong bối cảnh cầu thay; “cho anh em” thể hiện ý nghĩa đại diện/lợi ích của בְּעַד.
theological_decisions:
- issue: Cách chuyển dịch danh riêng יְהוָה
  choice: Yahweh
  alternative: ĐỨC CHÚA hoặc Đức Giê-hô-va
  rationale: Giữ danh giao ước dưới dạng phiên âm thay vì thay bằng một tước hiệu; không thêm cách hiểu hệ phái.
- issue: Mức độ chắc chắn trong lời Môi-se về việc chuộc tội
  choice: may ra tôi có thể chuộc tội cho anh em
  alternative: tôi sẽ chuộc tội cho anh em
  rationale: Giữ nguyên sự bất định do אוּלַי biểu thị, không biến hy vọng của Môi-se thành một lời bảo đảm về hiệu lực chuộc tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho số nhiều khi Môi-se nói với cộng đồng; “chính” giữ sự nhấn mạnh của đại từ Hê-bơ-rơ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
