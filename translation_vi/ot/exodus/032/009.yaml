revisions:
- from: 'Đức Giê-hô-va phán với Môi-se: “Ta đã thấy dân này, và kìa, họ là một dân cứng cổ[a].”'
  to: 'Gia-vê phán với Môi-se: “Ta đã thấy dân này, và này, đó là một dân cứng cổ[a].”'
  rationale: Bản sửa nhất quán danh riêng יהוה với lựa chọn “Yahweh” của POB bằng dạng tiếng Việt “Gia-vê”; đồng thời giữ thể hoàn thành, danh từ tập thể lặp lại, và hình ảnh ẩn dụ của tiếng Hê-bơ-rơ. Cách quy chiếu “đó là một dân” tránh chuyển không cần thiết sang số nhiều. Chú thích được rút gọn để nêu nghĩa thành ngữ mà vẫn giữ độ mở diễn giải của nguyên văn.
  reviewer_model: gpt-5.6-terra
