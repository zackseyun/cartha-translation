  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: vi
  text: 'Gia-vê phán với Môi-se: “Ta đã thấy dân này, và này, đó là một dân cứng cổ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ngoan cố.” Thành ngữ Hê-bơ-rơ theo nghĩa đen là “cứng cổ,” một ẩn dụ chỉ sự bướng bỉnh hoặc chống nghịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh riêng của Đức Chúa Trời đã quen thuộc và trang trọng trong tiếng Việt, thay vì chuyển thành một tước hiệu chung.
- source_word: וַיֹּאמֶר
  choice: phán
  rationale: Trong lời kể trang trọng, “phán” là động từ tự nhiên khi Đức Chúa Trời nói; quan hệ tiếp nối của וַ־ được thể hiện bằng mạch văn, không cần thêm “và” một cách gượng ép.
- source_word: רָאִיתִי
  choice: Ta đã thấy
  rationale: Thể hoàn thành diễn tả sự quan sát đã có kết quả và làm cơ sở cho nhận định ngay sau đó.
- source_word: הָעָם הַזֶּה
  choice: dân này
  rationale: Giữ danh từ tập hợp số ít và sắc thái chỉ định, có phần tạo khoảng cách, của nguyên văn.
- source_word: וְהִנֵּה
  choice: và kìa
  rationale: Giữ chức năng thu hút sự chú ý và sức nhấn tu từ của הִנֵּה bằng một lối nói trang trọng nhưng dễ hiểu.
- source_word: קְשֵׁה עֹרֶף
  choice: cứng cổ
  rationale: Giữ nguyên hình ảnh ẩn dụ Hê-bơ-rơ về sự ngoan cố, không chịu khuất phục, thay vì chỉ diễn giải bằng “bướng bỉnh”.
- source_word: הוּא
  choice: họ là
  rationale: Dù nguyên văn dùng đại từ số ít theo danh từ tập hợp עַם, tiếng Việt tự nhiên quy chiếu tập thể “dân này” bằng “họ”.
theological_decisions:
- issue: Cách chuyển danh יהוה
  choice: Đức Giê-hô-va
  alternative: Yahweh (Gia-vê)
  rationale: Nguyên văn nêu trực tiếp danh giao ước יהוה. Bản dịch giữ đây là danh riêng, dùng hình thức tiếng Việt truyền thống và dễ nhận biết, không thay bằng tước hiệu “CHÚA”.
- issue: Ẩn dụ קְשֵׁה עֹרֶף
  choice: cứng cổ
  alternative: bướng bỉnh, ngoan cố
  rationale: Giữ hình ảnh cụ thể và sức căng thần học của lời phán xét; chú thích giải nghĩa để người đọc hiện đại không hiểu theo nghĩa thể chất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ “Ta” trong lời Đức Chúa Trời, “Môi-se” theo cách viết quen thuộc, cùng hình ảnh “cứng cổ”; chú thích giải nghĩa thành ngữ. Dấu chú thích được đặt ngay sau cụm từ liên quan.
