  to: Rồi Môi-se quay đi và xuống núi, trong tay ông cầm hai bảng chứng ngôn. Hai bảng ấy đều có chữ viết trên cả hai mặt; mặt này và mặt kia[a] đều được viết.
  rationale: Sửa tối thiểu để tránh sắc thái “trở lại” không cần thiết của “quay lại,” làm rõ quan hệ sở hữu trong “trong tay ông,” và diễn đạt nhất quán hơn việc các bảng được viết ở cả hai mặt. Thuật ngữ “bảng chứng ngôn,” cấu trúc lặp nhấn mạnh, và chú thích về phương án diễn đạt đều được giữ theo hướng không diễn giải quá mức.
