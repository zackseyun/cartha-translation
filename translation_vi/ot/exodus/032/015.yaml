  text: וַ/יִּ֜פֶן וַ/יֵּ֤רֶד מֹשֶׁה֙ מִן הָ/הָ֔ר וּ/שְׁנֵ֛י לֻחֹ֥ת הָ/עֵדֻ֖ת בְּ/יָד֑/וֹ לֻחֹ֗ת כְּתֻבִים֙ מִ/שְּׁנֵ֣י עֶבְרֵי/הֶ֔ם מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה הֵ֥ם כְּתֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: vi
  text: Rồi Môi-se quay đi và xuống núi, trong tay ông cầm hai bảng chứng ngôn. Hai bảng ấy đều có chữ viết trên cả hai mặt; mặt này và mặt kia[a] đều được viết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “một mặt và mặt kia.”'
    reason: Cụm מִזֶּה וּמִזֶּה có thể được diễn đạt là “mặt này và mặt kia” hoặc “một mặt và mặt kia”; cả hai đều nhấn mạnh hai mặt đối ứng.
lexical_decisions:
- source_word: וַיִּפֶן
  choice: quay lại
  rationale: Động từ פנה trong chuỗi tường thuật cho biết Môi-se đổi hướng trước khi xuống núi. “Quay lại” tự nhiên trong tiếng Việt và không thêm nét nghĩa mạnh như “quay hẳn người lại”.
- source_word: וַיֵּרֶד מֹשֶׁה מִן־הָהָר
  choice: Môi-se ... xuống núi
  rationale: ירד có nghĩa là đi xuống. Cách diễn đạt “xuống núi” gọn, tự nhiên và phù hợp với điểm nhìn của lời kể.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: hai bảng chứng ngôn
  rationale: לֻחֹת là các bảng dùng để ghi chữ; câu này không nói rõ chất liệu đá nên không thêm “đá”. עֵדוּת được giữ theo nghĩa “chứng ngôn”, tránh thu hẹp thành “văn kiện giao ước” dù bối cảnh mang tính giao ước.
- source_word: בְּיָדוֹ
  choice: trong tay
  rationale: Nguyên văn dùng số ít, nghĩa đen là “trong tay người”. Tiếng Việt cũng có thể dùng “trong tay” tự nhiên cho vật đang được mang theo mà không cần đổi thành số nhiều.
- source_word: לֻחֹת כְּתֻבִים
  choice: Các bảng ấy có chữ viết
  rationale: Phân từ bị động của כתב có nghĩa là “được viết”. Cách nói “có chữ viết” tự nhiên trong tiếng Việt, đồng thời không thêm ý “khắc” vốn không được chính động từ này nêu rõ.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: trên cả hai mặt
  rationale: Cụm từ chỉ chữ hiện diện ở hai mặt của các bảng. “Trên cả hai mặt” truyền đạt rõ và tự nhiên ý nghĩa không gian của nguyên văn.
- source_word: מִזֶּה וּמִזֶּה
  choice: mặt này và mặt kia
  rationale: Cụm phân phối nhấn mạnh riêng từng mặt. Cách dịch này giữ nhịp cân xứng của tiếng Hê-bơ-rơ; “một phía và phía kia” cũng có thể hiểu được.
- source_word: הֵם כְּתֻבִים
  choice: đều có chữ
  rationale: Mệnh đề cuối lặp lại để nhấn mạnh rằng cả hai mặt đều có chữ. Bản dịch giữ sự lặp ý thay vì lược bỏ hoàn toàn, nhưng diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch עֵדוּת trong cụm “các bảng chứng ngôn”
  choice: chứng ngôn
  alternative: chứng ước; lời chứng; giao ước
  rationale: “Chứng ngôn” giữ được nghĩa căn bản về lời hoặc vật làm chứng và sắc thái thuật ngữ của עֵדוּת. Không dịch thẳng là “giao ước”, vì như vậy sẽ xác định hẹp hơn điều từ Hê-bơ-rơ tự nó diễn đạt.
translation_notes:
  register: Văn phong tường thuật hiện đại, trang trọng vừa phải và dễ hiểu. Giữ tên “Môi-se” theo lối dùng phổ biến trong tiếng Việt. Không thêm chất liệu “đá” vốn không xuất hiện trong câu này; giữ sự nhấn mạnh lặp lại về chữ viết trên hai mặt.
