  - severity: low
    issue: Cách diễn đạt về chữ viết có thể tự nhiên và sát phép lặp hơn
    rationale: Nguyên văn gọi các bảng là “được viết” rồi lặp lại rằng chúng “được viết” từ mặt này đến mặt kia. Bản sửa giữ rõ chữ viết trên cả hai mặt và sự lặp nhấn mạnh ấy.
