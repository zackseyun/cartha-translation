  text: וְ/כָל הָ/עָם֩ רֹאִ֨ים אֶת הַ/קּוֹלֹ֜ת וְ/אֶת הַ/לַּפִּידִ֗ם וְ/אֵת֙ ק֣וֹל הַ/שֹּׁפָ֔ר וְ/אֶת הָ/הָ֖ר עָשֵׁ֑ן וַ/יַּ֤רְא הָ/עָם֙ וַ/יָּנֻ֔עוּ וַ/יַּֽעַמְד֖וּ מֵֽ/רָחֹֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: vi
  text: Toàn dân thấy những tiếng sấm[a], những chớp lửa[b], tiếng tù và và ngọn núi bốc khói. Khi dân chúng thấy cảnh ấy[c], họ run rẩy và đứng ở xa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ theo nghĩa đen là “các âm thanh” hoặc “các tiếng nói”; trong ngữ cảnh này, cụm từ có lẽ chỉ những tiếng sấm.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “những ngọn đuốc”; trong ngữ cảnh này, từ ấy có lẽ chỉ những luồng lửa lóe lên như chớp.
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hê-bơ-rơ nói dân chúng “thấy” cả những hiện tượng bao gồm âm thanh, qua đó giữ lại tính chất áp đảo các giác quan của cảnh tượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: đều đang thấy
  rationale: Phân từ diễn tả cảnh tượng đang tiếp diễn; “đang thấy” giữ sắc thái sống động và không xóa đi cách diễn đạt giao thoa giác quan của tiếng Hê-bơ-rơ.
- source_word: הַקּוֹלֹת
  choice: sấm vang
  rationale: Danh từ số nhiều có nghĩa đen là “các âm thanh/tiếng nói”, nhưng trong bối cảnh thần hiện tại Si-nai, từ này nhiều khả năng chỉ tiếng sấm.
- source_word: הַלַּפִּידִם
  choice: những chớp lửa
  rationale: Nghĩa đen là “những ngọn đuốc”; trong cảnh này, cụm từ chỉ những luồng lửa lóe lên, tương tự chớp, nên “những chớp lửa” vừa tự nhiên vừa giữ hình ảnh cụ thể.
- source_word: קוֹל הַשֹּׁפָר
  choice: tiếng tù và
  rationale: שׁוֹפָר là nhạc cụ bằng sừng; “tù và” là cách gọi tiếng Việt gọn, quen thuộc và thích hợp với bối cảnh cổ đại.
- source_word: הָהָר עָשֵׁן
  choice: ngọn núi bốc khói
  rationale: Cách dịch này giữ hình ảnh trực tiếp của ngọn núi đang tỏa khói.
- source_word: וַיַּרְא הָעָם
  choice: Khi dân chúng thấy cảnh ấy
  rationale: Mệnh đề lặp lại động từ “thấy” rồi dẫn đến phản ứng của dân; “cảnh ấy” quy chiếu toàn bộ các hiện tượng vừa kể mà không giới hạn vào một hiện tượng riêng.
- source_word: וַיָּנֻעוּ
  choice: họ run sợ
  rationale: Động từ có thể chỉ rung chuyển, run rẩy hoặc chao đảo; trong phản ứng sợ hãi của dân chúng, “run sợ” là tự nhiên và rõ nghĩa.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: đứng từ xa
  rationale: Diễn đạt trực tiếp việc dân chúng giữ khoảng cách vì sợ hãi.
- source_word: וְכָל הָעָם
  choice: Toàn dân
  rationale: Cách nói tự nhiên, trang trọng và trực tiếp để chỉ toàn thể dân Y-sơ-ra-ên đang tụ họp.
theological_decisions:
- issue: Ngôn ngữ giác quan nói rằng dân chúng “thấy” cả hiện tượng âm thanh
  choice: Giữ động từ “thấy” với “sấm vang”
  alternative: Chuẩn hóa thành “nghe tiếng sấm” hoặc “cảm nhận các hiện tượng”
  rationale: Bản Hê-bơ-rơ đặt các hiện tượng nghe được trong phạm vi của động từ “thấy”, tạo nên một cảnh thần hiện áp đảo các giác quan. Bản dịch giữ nguyên sức căng này thay vì âm thầm làm cho câu hợp logic giác quan hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “tù và” thay vì thuật ngữ chuyên biệt hơn để gợi đúng nhạc cụ bằng sừng trong bối cảnh cổ đại. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau yếu tố liên quan trong chính văn.
