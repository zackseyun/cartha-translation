  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: vi
  text: Ngươi không được tham muốn nhà[a] của người lân cận ngươi; ngươi không được tham muốn vợ của người lân cận ngươi, nô lệ nam hoặc nô lệ nữ của người ấy, bò đực hoặc lừa của người ấy, hoặc bất cứ điều gì thuộc về người lân cận ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “gia hộ của người lân cận ngươi.” Từ Hê-bơ-rơ dịch là “nhà” cũng có thể chỉ một gia hộ; tuy nhiên, ở đây “nhà” phù hợp với danh sách riêng tiếp theo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: tham muốn
  rationale: Trong điều răn này, động từ חמד chỉ sự ham muốn sai trái đối với điều thuộc về người khác. “Tham muốn” tự nhiên trong tiếng Việt hiện đại và giữ được sức nặng luân lý.
- source_word: בֵּית רֵעֶךָ
  choice: nhà của người lân cận mình
  rationale: בַּיִת có thể chỉ ngôi nhà hoặc gia đình, nhưng danh sách tiếp theo nêu riêng vợ, người lệ thuộc và súc vật; vì vậy nghĩa “nhà” phù hợp hơn với cấu trúc câu.
- source_word: רֵעֶךָ
  choice: người lân cận mình
  rationale: רֵעַ trong luật giao ước thường chỉ người khác trong cộng đồng. Cách nói này giữ được sắc thái quan hệ xã hội và phù hợp văn phong điều răn.
- source_word: עַבְדּוֹ וַאֲמָתוֹ
  choice: tôi trai hay tớ gái của người ấy
  rationale: Hai từ chỉ người nam và người nữ ở địa vị lệ thuộc. “Tôi trai, tớ gái” giữ sự phân biệt giới tính và địa vị xã hội mà không làm câu quá nặng nề; “hay” diễn đạt tự nhiên chuỗi liệt kê phủ định trong tiếng Việt.
- source_word: שׁוֹרוֹ וַחֲמֹרוֹ
  choice: bò hay lừa của người ấy
  rationale: שׁוֹר chỉ gia súc bò, thường là bò dùng làm sức kéo; חֲמוֹר là lừa. Các từ phổ thông này rõ ràng với độc giả hiện đại.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: hoặc bất cứ vật gì thuộc về người lân cận mình
  rationale: Cụm này là mệnh đề bao quát mọi tài sản còn lại; bản dịch giữ rõ ý sở hữu của giới từ לְ.
- source_word: לֹא ... לֹא
  choice: ngươi không được ... ngươi không được
  rationale: Giữ nguyên hai lần cấm đoán để bảo toàn nhịp điệu và sự nhấn mạnh của tiếng Hê-bơ-rơ.
theological_decisions:
- issue: בֵּית ở mệnh đề đầu có nghĩa là “nhà” hay “gia đình/gia hộ”
  choice: nhà
  alternative: gia đình; gia hộ
  rationale: Dù בַּיִת có thể mang nghĩa rộng là gia hộ, câu này ngay sau đó liệt kê riêng vợ, người lệ thuộc và súc vật. Chọn “nhà” giữ được tiến trình từ nơi ở đến những điều khác thuộc về người lân cận và tránh tự ý giải quyết từ này theo nghĩa rộng.
- issue: Cách dịch thuật ngữ chỉ người lệ thuộc trong luật giao ước
  choice: tôi trai / tớ gái
  alternative: nô lệ nam / nô lệ nữ; đầy tớ nam / đầy tớ nữ
  rationale: Ngữ cảnh là danh sách những gì thuộc về người lân cận, nên địa vị lệ thuộc phải được giữ rõ. “Tôi trai, tớ gái” là cách diễn đạt tiếng Việt có sắc thái lịch sử và phân biệt giới tính, đồng thời tránh làm nhẹ thành người phục vụ tự do.
translation_notes:
  register: Văn phong trang trọng, dễ hiểu, dùng đại từ “ngươi” theo lối điều răn truyền thống. Giữ nguyên hai mệnh đề “không được tham muốn” và cấu trúc liệt kê của nguyên bản. Không thêm chú thích vì bản dịch chính chọn “nhà”; khả năng “gia hộ” được ghi nhận trong quyết định dịch thuật thay vì đặt một dấu chú thích dễ gây nhầm vị trí.
