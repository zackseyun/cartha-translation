  language: vi
  text: Ngươi không được giết người[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch theo nghĩa rộng hơn là “Ngươi không được giết”; tuy nhiên, động từ Hê-bơ-rơ ở đây thường chỉ việc giết người trái phép, chứ không phải mọi hành vi giết.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Tiểu từ phủ định kết hợp với dạng động từ trong điều răn tạo thành lệnh cấm trực tiếp; “không được” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: תִּרְצָח
  choice: giết người
  rationale: Động từ רצח thường chỉ việc giết người trái phép, gần với ý “sát nhân”, chứ không bao quát mọi hành vi giết. “Giết người” tự nhiên, trực tiếp và trang nghiêm hơn trong câu điều răn; chú thích giữ lại khả năng dịch rộng hơn.
theological_decisions:
- issue: Phạm vi của lệnh cấm trong Mười Điều Răn
  choice: Dịch רצח là “giết người” theo nghĩa giết người trái phép
  alternative: Không được giết.
  rationale: Cách dịch này phản ánh nghĩa từ vựng thông thường của רצח trong ngữ cảnh pháp luật, không biến câu này thành lời cấm tuyệt đối mọi hành vi tước đoạt sự sống, đồng thời không thu hẹp thêm bằng một cách giải thích giáo phái.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Đại từ “ngươi” giữ sắc thái trực tiếp, trang trọng quen thuộc của điều răn; “không được” diễn đạt lệnh cấm tự nhiên hơn “chớ” trong văn phong hiện đại.
