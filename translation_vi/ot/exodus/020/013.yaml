review_pass:
  verdict: revise
  source_fidelity: Bản dịch chính "Ngươi không được giết người" truyền đạt đúng tính chất mệnh lệnh phủ định của לֹא תִּרְצָח và, trong ngữ cảnh luật pháp, hướng người đọc đến việc tước mạng người. Tuy vậy, "giết người" trong tiếng Việt tự nó vẫn có thể bao gồm các trường hợp không trái phép; chú thích cần diễn đạt chính xác hơn sự phân biệt ngữ nghĩa này. Bản Hê-bơ-rơ không nêu tân ngữ, nên không nên trình bày phương án "giết" như thể một nghĩa hoàn toàn tách biệt, nhưng có thể nêu đó là cách dịch rộng hơn.
  naturalness: Câu chính ngắn gọn, tự nhiên trong văn cảnh điều răn và có sắc thái trang nghiêm. Đại từ "ngươi" mang phong cách Kinh Thánh truyền thống, không phải khẩu ngữ hiện đại, nhưng vẫn phù hợp với lời truyền phán trực tiếp; việc giữ nó không gây trở ngại đáng kể.
  terminology: '"Giết người" là cách diễn đạt dễ hiểu, nhưng không đồng nghĩa chặt chẽ với "murder" trong mọi ngữ cảnh Việt ngữ. Chú thích nên dùng cụm "việc giết người trái phép" thay vì đặt "sát nhân" song song như một danh từ chỉ hành vi, vì "sát nhân" thường chỉ người thực hiện việc giết người.'
  issues:
