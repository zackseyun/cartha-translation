source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה דַּבֵּר אַתָּ֥ה עִמָּ֖/נוּ וְ/נִשְׁמָ֑עָה וְ/אַל יְדַבֵּ֥ר עִמָּ֛/נוּ אֱלֹהִ֖ים פֶּן נָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: vi
  text: 'Họ nói với Môi-se: “Xin chính ông nói với chúng tôi, chúng tôi sẽ nghe[a]; nhưng xin đừng để Đức Chúa Trời nói với chúng tôi, kẻo chúng tôi chết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “chúng tôi sẽ nghe theo.” Động từ Hê-bơ-rơ có thể chỉ việc nghe chăm chú hoặc đáp ứng bằng sự vâng lời.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: Họ nói với Môi-se
  rationale: Dạng wayyiqtol tiếp nối mạch kể chuyện bằng một hành động quá khứ; tiếng Việt không cần thêm “và” khi câu đứng riêng.
- source_word: דַּבֵּר אַתָּה
  choice: Xin chính ông nói
  rationale: Mệnh lệnh đi với đại từ tường minh nhấn mạnh rằng Môi-se, chứ không phải Đức Chúa Trời, phải là người nói. “Xin” diễn đạt lời khẩn cầu trong ngữ cảnh, còn “chính ông” giữ trọng âm đối lập.
- source_word: עִמָּנוּ
  choice: với chúng tôi
  rationale: Giữ nghĩa cơ bản của giới từ עִם là “với”; cách nói này tự nhiên trong tiếng Việt và bảo toàn sắc thái giao tiếp trực tiếp.
- source_word: וְנִשְׁמָעָה
  choice: chúng tôi sẽ nghe
  rationale: Hình thái hệ tại/nguyện vọng sau mệnh lệnh diễn tả sự đáp ứng mà dân chúng cam kết. “Nghe” giữ được độ mở giữa nghe chăm chú và nghe theo; chú thích nêu rõ sắc thái này.
- source_word: וְאַל יְדַבֵּר עִמָּנוּ אֱלֹהִים
  choice: nhưng xin đừng để Đức Chúa Trời nói với chúng tôi
  rationale: אַל với động từ chưa hoàn thành mang lực cấm đoán hoặc cầu xin điều không xảy ra. “Nhưng” làm rõ sự tương phản với việc họ xin Môi-se nói; cấu trúc “đừng để” tự nhiên trong tiếng Việt.
- source_word: פֶּן נָמוּת
  choice: kẻo chúng tôi chết
  rationale: פֶּן giới thiệu hậu quả đáng sợ cần tránh; “kẻo” ngắn gọn, trang trọng và sát nghĩa.
theological_decisions:
- issue: Số và đối tượng quy chiếu của אֱלֹהִים
  choice: Đức Chúa Trời, số ít
  alternative: các thần
  rationale: Ngữ cảnh tại Si-nai và động từ số ít xác định đối tượng là Đức Chúa Trời của Y-sơ-ra-ên; đây là kết luận ngữ pháp-ngữ cảnh, không phải sự áp đặt giáo phái.
- issue: Sắc thái của וְנִשְׁמָעָה
  choice: Giữ “nghe” trong chính văn và giải thích khả năng “nghe theo” ở chú thích
  alternative: dịch thẳng là “vâng theo”
  rationale: Động từ שׁמע có thể chỉ việc nghe, lắng nghe chăm chú hoặc đáp ứng bằng sự vâng lời. “Nghe” bảo toàn sự mơ hồ chân thực thay vì quyết định quá mức theo một sắc thái thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Xin chính ông” giữ sự nhấn mạnh của đại từ Hê-bơ-rơ mà không trở nên cổ kính; “kẻo” bảo toàn sắc thái khẩn cấp, nghiêm trọng của lời dân chúng.
