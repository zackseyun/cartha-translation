source:
  edition: WLC
  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: vi
  text: Ta là Yahweh[a], Đức Chúa Trời của ngươi, Đấng đã đưa ngươi ra khỏi đất Ai Cập, khỏi nhà nô lệ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hê-bơ-rơ là YHWH, theo truyền thống thường được dịch là “CHÚA”; ở đây được phiên âm là “Yahweh”.
    reason: alternative_reading
  - marker: b
    text: Nói tự nhiên hơn có thể dịch là “khỏi chốn nô lệ”. Tiếng Hê-bơ-rơ sát nghĩa là “khỏi nhà của những người nô lệ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Ta là
  rationale: Đại từ ngôi thứ nhất độc lập mang sắc thái nhấn mạnh; tiếng Việt tự nhiên cần thêm “là” trong lời tự xưng trang trọng này.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Phiên âm danh riêng YHWH để giữ nguyên tính chất tên riêng của Đức Chúa Trời, thay vì thay bằng một tước hiệu.
- source_word: אֱלֹהֶיךָ
  choice: Đức Chúa Trời của ngươi
  rationale: Trong ngữ cảnh này אֱלֹהִים chỉ một Đức Chúa Trời duy nhất; hậu tố ngôi thứ hai giống đực số ít được thể hiện bằng “của ngươi”.
- source_word: אֲשֶׁר
  choice: Đấng
  rationale: Dùng đại từ quan hệ tôn kính dành cho chủ thể thần linh, tạo câu tiếng Việt tự nhiên mà không làm thay đổi quan hệ cú pháp.
- source_word: הוֹצֵאתִיךָ
  choice: đã đưa ngươi ra
  rationale: Dạng Hiphil của יצא có nghĩa “đưa ra/làm cho ra”; cách dịch này giữ rõ hành động giải thoát do chính Đức Chúa Trời thực hiện.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ra khỏi đất Ai Cập
  rationale: Diễn đạt tự nhiên nguồn điểm của cuộc ra đi, đồng thời giữ danh ngữ địa lý đầy đủ “đất Ai Cập”.
- source_word: מִבֵּית עֲבָדִים
  choice: khỏi nhà của những người nô lệ
  rationale: Giữ hình ảnh cụ thể của cấu trúc Hê-bơ-rơ, theo sát nghĩa đen “nhà của các nô lệ”; “nô lệ” phù hợp với bối cảnh lao dịch cưỡng bức hơn “đầy tớ”.
theological_decisions:
- issue: Cách dịch danh Đức Chúa Trời יְהוָה
  choice: Yahweh
  alternative: CHÚA; Giê-hô-va
  rationale: Bản văn dùng trực tiếp danh YHWH; phiên âm “Yahweh” bảo tồn danh giao ước thay vì thay thế bằng tước hiệu.
- issue: Ý nghĩa của עֲבָדִים trong cảnh Israel bị áp bức tại Ai Cập
  choice: những người nô lệ
  alternative: những người đầy tớ; cảnh nô lệ
  rationale: Bối cảnh là sự lệ thuộc và lao dịch cưỡng bức, nên “nô lệ” diễn đạt đúng địa vị bị trói buộc; bản dịch chính cũng giữ danh từ số nhiều cụ thể của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ta/ngươi” giữ sắc thái long trọng của lời phán trực tiếp và số ít của đại từ Hê-bơ-rơ. Cấu trúc lặp “ra khỏi… khỏi…” phản ánh hai cụm nguồn song song trong nguyên văn.
