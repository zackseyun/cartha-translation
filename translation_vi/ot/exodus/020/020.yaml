  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: vi
  text: 'Môi-se nói với dân chúng: “Đừng sợ[a], vì Đức Chúa Trời đã đến để thử anh em, và để sự kính sợ Ngài[b] ở trước mặt anh em[c], để anh em không phạm tội.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng hoảng sợ.” Tiếng Hê-bơ-rơ dùng cùng một gốc từ chỉ sự sợ hãi ở phần sau của câu (“sự kính sợ Ngài”), tạo nên sự tương phản có chủ ý giữa nỗi kinh hãi và lòng kính sợ Đức Chúa Trời cách đúng đắn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lòng tôn kính Ngài.” Danh từ Hê-bơ-rơ có thể chỉ nỗi sợ, nhưng cũng có thể chỉ lòng kính sợ đầy tôn kính.'
    reason: lexical_alternative
  - marker: c
    text: 'Nghĩa đen: “ở trên mặt anh em”; đây là thành ngữ chỉ điều được đặt trước một người hoặc thường trực trong nhận thức của người ấy.'
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Đừng sợ
  rationale: Động từ ירא có thể chỉ sự sợ hãi hoặc lòng kính sợ tùy ngữ cảnh. Cách dịch này giữ được sự liên hệ có chủ ý với יִרְאָתוֹ ở phần sau của câu.
- source_word: לְבַעֲבוּר
  choice: để
  rationale: Cụm giới từ này nêu mục đích Đức Chúa Trời đến; “để” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: נַסּוֹת
  choice: thử
  rationale: נסה mang nghĩa thử, kiểm nghiệm hoặc chứng nghiệm. “Thử” diễn đạt gọn ý nghĩa kiểm nghiệm mà không hàm ý dụ dỗ làm điều ác.
- source_word: בָּא
  choice: đã đến
  rationale: Dạng qatal trong bối cảnh này nói đến việc Đức Chúa Trời đã đến tại Si-nai với ý nghĩa còn hiện hữu trong tình huống trước mắt.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Danh từ này chỉ Đức Chúa Trời của Y-sơ-ra-ên; câu không dùng danh YHWH.
- source_word: וּבַעֲבוּר
  choice: và để
  rationale: Lần xuất hiện thứ hai tiếp tục nêu mục đích và dẫn vào một mệnh đề hữu hạn.
- source_word: יִרְאָתוֹ
  choice: sự kính sợ Ngài
  rationale: יִרְאָה có thể chỉ nỗi sợ hoặc lòng kính sợ. “Sự kính sợ Ngài” giữ yếu tố sợ trong cùng trường từ vựng với “Đừng sợ,” đồng thời tự nhiên trong tiếng Việt và phù hợp với sắc thái kính úy trong ngữ cảnh.
- source_word: עַל־פְּנֵיכֶם
  choice: luôn ở trước mặt anh em
  rationale: Nghĩa đen là “trên mặt anh em”; đây là thành ngữ chỉ điều luôn hiện diện trước một người hoặc trong nhận thức của người ấy. Thêm “luôn” làm rõ giá trị thành ngữ.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: hầu cho anh em không phạm tội
  rationale: Cấu trúc này diễn đạt mục đích phủ định; “hầu cho” giữ giọng trang trọng vừa phải và nêu rõ quan hệ mục đích.
theological_decisions:
- issue: Sự căng thẳng bề ngoài giữa “Đừng sợ” và “sự kính sợ Ngài” trong cùng một câu
  choice: Giữ yếu tố “sợ” trong cả hai cụm từ
  alternative: Dịch vế đầu là “Đừng hoảng hốt” và vế sau là “lòng tôn kính Ngài”
  rationale: Tiếng Hê-bơ-rơ cố ý dùng cùng một gốc từ để đặt sự kinh hãi không đúng chỗ bên cạnh lòng kính sợ Đức Chúa Trời. Bản dịch giữ mối liên hệ ấy thay vì giải quyết sự căng thẳng bằng diễn giải.
- issue: Bản chất của việc Đức Chúa Trời “thử” dân chúng
  choice: Dịch נַסּוֹת là “thử” mà không thêm hàm ý đạo đức
  alternative: thử nghiệm; chứng nghiệm
  rationale: Câu nói đến việc kiểm nghiệm dân chúng nhằm giúp họ không phạm tội; “thử” không gán cho hành động này ý nghĩa dụ dỗ làm điều ác.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “anh em” để xưng hô với cộng đồng dân chúng, “Đức Chúa Trời” cho הָאֱלֹהִים, và giữ liên hệ giữa “sợ” với “kính sợ” nhằm phản ánh lối chơi từ cùng sự căng thẳng của nguyên văn.
