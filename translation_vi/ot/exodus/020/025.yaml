  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: vi
  text: Còn nếu con lập cho Ta một bàn thờ bằng đá, thì không được xây bằng đá đẽo[a], vì khi con vung gươm trên đó[b], con sẽ làm ô uế bàn thờ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đá đã được gia công.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hê-bơ-rơ là “gươm của con”; trong ngữ cảnh, từ này có thể chỉ một dụng cụ bằng kim loại dùng trên đá.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Còn nếu
  rationale: Giữ cả lực nối với chỉ dẫn trước và ý điều kiện, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: מִזְבַּח אֲבָנִים
  choice: một bàn thờ bằng đá
  rationale: Diễn đạt tự nhiên cấu trúc sở liệu của tiếng Hê-bơ-rơ, chỉ bàn thờ được làm từ đá.
- source_word: תַּעֲשֶׂה לִּי
  choice: con lập cho Ta
  rationale: “Lập” hợp ngữ cảnh bàn thờ hơn “làm”, còn “cho Ta” giữ quan hệ chỉ đối tượng của לִי.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: không được xây bằng đá đẽo
  rationale: Truyền đạt mệnh lệnh cấm và nghĩa đá đã được gia công; tránh cách diễn đạt gượng theo hình thái số nhiều của đại từ Hê-bơ-rơ.
- source_word: חַרְבְּךָ
  choice: gươm của con
  rationale: Giữ nghĩa trực tiếp “gươm” của nguyên văn thay vì thay bằng “dụng cụ”, dù trong ngữ cảnh nó có thể chỉ một vật bằng kim loại dùng để gia công đá.
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: vung gươm trên đó
  rationale: Giữ hình ảnh nâng hoặc đưa lưỡi gươm lên trên bàn thờ, không thu hẹp hoàn toàn thành một thao tác kỹ thuật.
- source_word: וַתְּחַלְלֶהָ
  choice: con sẽ làm ô uế bàn thờ
  rationale: Diễn đạt sự xúc phạm tính thánh thiêng theo nghĩa nghi lễ của חלל bằng cách nói rõ ràng, dễ hiểu; lặp “bàn thờ” để tránh đại từ mơ hồ.
theological_decisions:
- issue: Bản chất của việc làm ô uế bàn thờ
  choice: Giữ khái niệm làm mất tính thánh thiêng của bàn thờ do dùng lưỡi kim loại trên đá.
  alternative: Hiểu chủ yếu như sự liên hệ với bạo lực hoặc như lệnh giữ bàn thờ giản dị, không phô trương.
  rationale: Động từ חלל thuộc trường nghĩa thánh/phàm, nhưng câu không giải thích thêm lý do biểu tượng; vì vậy bản dịch giữ ý nghi lễ mà không áp đặt một cách giải thích rộng hơn.
- issue: “Gươm” hay dụng cụ gia công đá
  choice: Giữ “gươm” trong chính văn và giải thích khả năng chỉ dụng cụ kim loại ở chú thích.
  alternative: Dịch thẳng là “dụng cụ” hoặc “đục”.
  rationale: חֶרֶב thông thường là “gươm”; thay bằng một tên dụng cụ cụ thể sẽ giải quyết sự mơ hồ mà nguyên văn vẫn để ngỏ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng đại từ “con—Ta” theo lời Đức Chúa Trời phán với dân, giữ sắc thái giao ước mà vẫn dễ hiểu. Hai dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan trong chính văn.
