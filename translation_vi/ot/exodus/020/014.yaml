  text: You shall not commit adultery.
translation:
  language: vi
  text: Ngươi không được ngoại tình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Phủ định לֹא đi với thể chưa hoàn thành ngôi hai số ít tạo thành lệnh cấm có hiệu lực dứt khoát. Trong tiếng Việt hiện đại, “không được” diễn đạt tự nhiên và rõ sức nặng quy phạm ấy.
- source_word: תִּנְאָף
  choice: ngoại tình
  rationale: Động từ נאף ở thể qal có nghĩa là phạm tội ngoại tình. “Ngoại tình” là cách nói thông dụng, chính xác và trang trọng vừa đủ trong ngữ cảnh luật giao ước.
theological_decisions:
- issue: Cách diễn đạt lệnh cấm trong Mười Điều Răn
  choice: Ngươi không được ngoại tình.
  alternative: Đừng ngoại tình.
  rationale: “Không được” giữ sắc thái luật định và lâu dài của cấu trúc לֹא với động từ thể chưa hoàn thành, trong khi “đừng” dễ mang sắc thái lời ngăn bảo theo tình huống.
- issue: Phạm vi của dạng động từ giống đực số ít
  choice: Dùng đại từ số ít “ngươi” theo lối xưng hô trực tiếp của giao ước
  alternative: Diễn đạt rõ là chỉ nhắm đến nam giới
  rationale: Dạng giống đực số ít trực tiếp gọi từng thành viên trong cộng đồng giao ước; không cần thêm giới hạn chỉ áp dụng cho nam giới. “Ngươi” bảo tồn số ít và sắc thái trang nghiêm của lời phán.
translation_notes:
  register: Bản dịch ngắn gọn, trang nghiêm và dễ hiểu. “Ngươi” được dùng nhất quán với lời phán trực tiếp trong Mười Điều Răn; “không được” thể hiện lệnh cấm dứt khoát mà vẫn tự nhiên trong tiếng Việt hiện đại.
