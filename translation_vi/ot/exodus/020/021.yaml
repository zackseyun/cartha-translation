base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: vi
  text: Dân chúng đứng từ xa, còn Môi-se tiến đến vùng tối tăm dày đặc[a], nơi Đức Chúa Trời ở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đám mây đen” hoặc “vùng âm u.” Từ Hê-bơ-rơ này có thể chỉ bóng tối dày đặc gắn với sự hiện diện của Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: đứng
  rationale: Động từ ở đây thuật lại tư thế và vị trí của dân chúng; “đứng” ngắn gọn, tự nhiên và phù hợp ngữ cảnh.
- source_word: הָעָם
  choice: dân chúng
  rationale: Danh từ có mạo từ chỉ cộng đồng dân Israel đang hiện diện tại Sinai; “dân chúng” rõ nghĩa mà không thêm định danh không có trong câu.
- source_word: מֵרָחֹק
  choice: từ xa
  rationale: Cụm giới từ diễn tả khoảng cách không gian; “từ xa” là cách nói tự nhiên trong tiếng Việt và giữ được sự cách biệt.
- source_word: נִגַּשׁ
  choice: tiến đến
  rationale: נגשׁ có nghĩa đến gần hoặc tiếp cận; “tiến đến” diễn đạt rõ chuyển động của Môi-se về phía vùng tối.
- source_word: הָעֲרָפֶל
  choice: vùng tối tăm dày đặc
  rationale: עֲרָפֶל chỉ bóng tối dày đặc hoặc sự âm u, đặc biệt trong bối cảnh Đức Chúa Trời hiện diện. “Vùng tối tăm dày đặc” vừa cụ thể vừa không buộc từ này phải mang nghĩa khí tượng là mây.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: là nơi Đức Chúa Trời ngự
  rationale: Mệnh đề quan hệ xác định nơi có sự hiện diện của Đức Chúa Trời. “Ngự” là cách diễn đạt tiếng Việt trang trọng, tự nhiên trong ngữ cảnh thần hiện, dù nghĩa sát chữ là “nơi Đức Chúa Trời ở/hiện diện”.
- source_word: הָאֱלֹהִים
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh này, אֱלֹהִים chỉ Đức Chúa Trời của Israel ở số ít; cách gọi này rõ ràng và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Sự hiện diện của Đức Chúa Trời trong bóng tối
  choice: Giữ hình ảnh cụ thể “vùng tối tăm dày đặc” và nói rằng đó là nơi Đức Chúa Trời ngự.
  alternative: đám mây đen; vùng âm u nơi Đức Chúa Trời hiện diện
  rationale: Câu văn đặt sự hiện diện thánh khiết của Đức Chúa Trời trong cảnh che khuất và khó tiếp cận. Bản dịch giữ nguyên nghịch lý thần học ấy, không giản lược thành một hiện tượng thời tiết hoặc giải thích nó chỉ như biểu tượng.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “còn” để thể hiện sự tương phản giữa dân chúng đứng xa và Môi-se tiến đến. “Ngự” giữ sắc thái tôn kính nhưng không thêm lời giải thích giáo lý.
