source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: vi
  text: Sáu ngày, ngươi phải lao động và làm mọi công việc của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong sáu ngày, ngươi phải làm việc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sáu ngày
  rationale: Cụm số từ ở trạng thái liên kết với danh từ số nhiều diễn tả thời gian; “Sáu ngày” tự nhiên và không thêm giới từ vốn không có trong tiếng Hê-bơ-rơ.
- source_word: תַּעֲבֹד
  choice: ngươi phải lao động
  rationale: Động từ עבד ở thể Qal có thể mang nghĩa làm việc, phục vụ hoặc lao động. Trong luật về ngày Sa-bát, “phải lao động” giữ được sắc thái chỉ thị của dạng chưa hoàn thành và phân biệt tự nhiên với מְלָאכָה ở vế sau.
- source_word: וְעָשִׂיתָ
  choice: và làm
  rationale: עשה có nghĩa rộng là “làm, tạo ra”; đi với “mọi công việc của mình,” động từ “làm” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: כָּל
  choice: mọi
  rationale: כָּל có nghĩa là “tất cả/mọi”; trước danh từ “công việc,” tiếng Việt tự nhiên dùng “mọi.”
- source_word: מְלַאכְתֶּךָ
  choice: công việc của mình
  rationale: מְלָאכָה chỉ công việc, nghề nghiệp hoặc nhiệm vụ. “Công việc của mình” truyền đạt hậu tố sở hữu ngôi thứ hai số ít và tránh cách nói kém tự nhiên “công việc của ngươi.”
theological_decisions:
- issue: Lực mệnh lệnh trong luật về ngày Sa-bát
  choice: ngươi phải lao động
  alternative: ngươi có thể lao động
  rationale: Trong Mười Điều Răn, dạng chưa hoàn thành mang chức năng chỉ thị thuộc giao ước chứ không chỉ là dự báo. “Phải” giữ sắc thái quy định, trong khi “có thể” sẽ biến câu thành lời cho phép và làm yếu lực của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để giữ lời phán trực tiếp ở ngôi thứ hai số ít trong Mười Điều Răn; “của mình” giúp câu tự nhiên hơn mà vẫn rõ chủ thể sở hữu.
