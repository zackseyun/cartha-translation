  text: זָכ֛וֹר אֶת י֥וֹם הַ/שַּׁבָּ֖ת לְ/קַדְּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/008.yaml
  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: vi
  text: Hãy nhớ ngày Sa-bát để thánh hóa ngày ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để biệt riêng ngày ấy làm ngày thánh” hoặc “để giữ ngày ấy là thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Hãy nhớ
  rationale: Động từ Qal mệnh lệnh số ít của זכר, truyền lệnh chủ động ghi nhớ. “Hãy nhớ” trực tiếp, tự nhiên và giữ được sức nặng giao ước của câu.
- source_word: אֶת
  choice: '[dấu hiệu tân ngữ xác định, không dịch]'
  rationale: Đánh dấu tân ngữ trực tiếp xác định trong tiếng Hê-bơ-rơ; tiếng Việt không cần một từ tương ứng.
- source_word: יוֹם
  choice: ngày
  rationale: Nghĩa thông thường của יוֹם là “ngày”.
- source_word: הַשַּׁבָּת
  choice: ngày Sa-bát
  rationale: Chỉ ngày nghỉ được xác định trong giao ước. “Ngày Sa-bát” là cách gọi quen thuộc trong tiếng Việt và bảo toàn thuật ngữ Kinh Thánh, thay vì diễn giải thành “ngày ngưng nghỉ”.
- source_word: לְקַדְּשׁוֹ
  choice: để giữ ngày ấy nên thánh
  rationale: 'Dạng nguyên mẫu phụ thuộc với hậu tố ngôi ba giống đực số ít từ קדשׁ, diễn tả mục đích: nhớ ngày Sa-bát để đối đãi với ngày ấy như một ngày thánh. “Giữ ... nên thánh” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa giữ được ý nghĩa thánh hóa, biệt riêng.'
theological_decisions:
- issue: Cách chuyển ngữ ngôn ngữ קדשׁ trong mệnh lệnh về ngày Sa-bát
  choice: để giữ ngày ấy nên thánh
  alternative: để thánh hóa ngày ấy; để biệt riêng ngày ấy làm ngày thánh
  rationale: Tiếng Hê-bơ-rơ có thể nói đến việc làm cho hoặc coi ngày ấy là thánh, tức biệt riêng ra. Bản dịch chính giữ sức nặng thần học của sự thánh khiết mà không thu hẹp câu thành việc tuân giữ nghi lễ đơn thuần; chú thích bảo lưu các sắc thái từ vựng khác.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Sa-bát” là thuật ngữ Kinh Thánh quen thuộc; lặp “ngày ấy” để làm rõ đại từ hậu tố Hê-bơ-rơ và tránh cách diễn đạt thiếu tự nhiên.
