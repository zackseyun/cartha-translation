  text: You shall not bear false witness against your neighbor[a].
translation:
  language: vi
  text: Ngươi không được làm chứng gian chống lại người lân cận của ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngươi không được khai gian chống lại người lân cận của ngươi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: không được
  rationale: Diễn đạt tự nhiên một điều cấm trong tiếng Việt hiện đại, phù hợp dạng phủ định của Mười Điều Răn.
- source_word: תַעֲנֶה
  choice: làm chứng
  rationale: Trong ngữ cảnh pháp lý, động từ ענה mang nghĩa trả lời hoặc khai chứng; “làm chứng” thể hiện rõ nghĩa pháp đình mà vẫn tự nhiên.
- source_word: בְרֵעֲךָ
  choice: chống lại người lân cận mình
  rationale: Giới từ ב trong bối cảnh pháp đình chỉ người bị lời chứng gây bất lợi; רֵעַ là người lân cận, người đồng loại hay người khác trong cộng đồng.
- source_word: עֵד שָׁקֶר
  choice: chứng gian
  rationale: Cụm này chỉ lời chứng hoặc tư cách nhân chứng mang tính giả dối. “Làm chứng gian” là cách nói pháp lý quen thuộc, gọn và sát nghĩa trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, rõ ràng và dễ hiểu. Giữ đại từ “ngươi” để phù hợp lối xưng hô trực tiếp, trang nghiêm của Mười Điều Răn; “không được” tự nhiên hơn cấu trúc tương lai mang nghĩa cấm đoán. Dấu chú thích [a] được đặt ngay sau câu.
