base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: vi
  text: Các ngươi không được làm các thần bằng bạc bên cạnh Ta[a], cũng không được làm cho mình các thần bằng vàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “với Ta” hoặc “cùng với Ta.” Tiếng Hê-bơ-rơ theo nghĩa sát là “với Ta”; “bên cạnh Ta” là cách dịch theo ngữ cảnh, nêu bật lời cấm làm các thần khác cùng với Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: làm
  rationale: Động từ עשה ở đây chỉ việc chế tạo các vật thờ phượng. “Làm” tự nhiên, trực tiếp và không thu hẹp nghĩa quá mức vào một kỹ thuật thủ công cụ thể.
- source_word: אִתִּי
  choice: để đặt bên Ta
  rationale: Nghĩa sát là “với Ta”; trong cú pháp tiếng Việt, “để đặt bên Ta” diễn đạt tự nhiên mối liên hệ giữa việc làm các thần bạc và Đức Chúa Trời, nhưng vẫn ghi chú nghĩa sát để bảo tồn độ mở của nguyên văn.
- source_word: אֱלֹהֵי כֶסֶף
  choice: những thần bằng bạc
  rationale: Cụm sở thuộc Hê-bơ-rơ chỉ các thần được làm bằng bạc; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: וֵאלֹהֵי זָהָב
  choice: cũng không được làm cho mình những thần bằng vàng
  rationale: Cách diễn đạt giữ phép song hành và lời cấm được lặp lại trong nguyên văn, đồng thời thể hiện לָכֶם là “cho mình”.
- source_word: לָכֶם
  choice: cho mình
  rationale: Đại từ số nhiều được hiểu theo chủ thể tập thể “các ngươi”; “cho mình” tự nhiên trong tiếng Việt và nêu rõ việc tạo tượng thần để sở hữu hoặc sử dụng.
- source_word: לֹא ... לֹא
  choice: không được ... cũng không được ...
  rationale: Cấu trúc này bảo tồn hai lời cấm song song và có sắc thái quy định trang trọng, rõ ràng.
theological_decisions:
- issue: Cách hiểu אִתִּי trong lời cấm về các thần bằng bạc
  choice: để đặt bên Ta
  alternative: với Ta; cùng với Ta
  rationale: “Bên Ta” phù hợp ngữ cảnh cấm đặt các thần khác cạnh Đức Chúa Trời, nhưng chú thích nêu nghĩa sát “với Ta” để không che khuất sự mơ hồ và sức căng của cách diễn đạt Hê-bơ-rơ.
translation_notes:
  register: Văn phong luật giao ước trang trọng nhưng dễ hiểu. Dùng “các ngươi” và “Ta” để thể hiện lời Đức Chúa Trời phán với toàn dân; giữ hai vế cấm song song và tránh thuật ngữ giáo phái.
