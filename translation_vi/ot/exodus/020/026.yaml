  to: Ngươi không được đi lên bàn thờ của Ta bằng các bậc, để sự trần truồng của ngươi không bị phơi bày trên đó.[a]
  rationale: Bản sửa thay "dùng bậc thang đi lên" bằng "đi lên ... bằng các bậc" để phản ánh số nhiều và tạo câu tiếng Việt tự nhiên. "Sự lõa lồ" được thay bằng "sự trần truồng" theo cách dùng hiện đại; "bị phơi bày" giữ sắc thái bị động của תִּגָּלֶה. Chú thích được neo ở cuối mệnh đề tương ứng và chỉ nêu phương án từ vựng/cú pháp, không thêm diễn giải.
