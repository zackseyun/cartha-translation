  text: וְ/לֹֽא תַעֲלֶ֥ה בְ/מַעֲלֹ֖ת עַֽל מִזְבְּחִ֑/י אֲשֶׁ֛ר לֹֽא תִגָּלֶ֥ה עֶרְוָתְ/ךָ֖ עָלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: vi
  text: Ngươi không được đi lên bàn thờ của Ta bằng các bậc, để sự trần truồng của ngươi không bị phơi bày trên đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “kẻo sự trần truồng của ngươi bị lộ ra trên đó.”'
    reason: Phản ánh cách dịch thay thế cho mệnh đề mục đích/kết quả cần tránh và động từ Niphal của גלה, mà không thay đổi nghĩa.
lexical_decisions:
- source_word: תַעֲלֶה
  choice: đi lên
  rationale: Động từ עלה diễn tả chuyển động đi lên; “đi lên” tự nhiên trong tiếng Việt và kết hợp với לֹא để tạo lệnh cấm.
- source_word: בְמַעֲלֹת
  choice: dùng bậc thang
  rationale: מַעֲלוֹת chỉ các bậc hoặc cầu thang; “dùng bậc thang” truyền đạt tự nhiên phương tiện đi lên do giới từ בְּ biểu thị.
- source_word: מִזְבְּחִי
  choice: bàn thờ của Ta
  rationale: Thể hiện danh từ מִזְבֵּחַ cùng hậu tố ngôi thứ nhất số ít; cách viết hoa “Ta” giữ văn phong tôn kính mà không thêm nghĩa.
- source_word: אֲשֶׁר לֹא
  choice: để ... không
  rationale: Trong ngữ cảnh này, cụm từ dẫn vào mệnh đề chỉ mục đích hoặc kết quả cần tránh; “để ... không” rõ ràng trong tiếng Việt hiện đại.
- source_word: תִּגָּלֶה
  choice: bị phơi ra
  rationale: Dạng Niphal của גלה mang nghĩa bị để lộ hoặc bị phơi ra; lựa chọn này giữ sắc thái bị động và cụ thể của ngữ cảnh.
- source_word: עֶרְוָתְךָ
  choice: sự lõa lồ của ngươi
  rationale: עֶרְוָה chỉ tình trạng lõa thể hoặc phần kín bị lộ; “sự lõa lồ” giữ cách diễn đạt khái quát của tiếng Hê-bơ-rơ, không thu hẹp quá mức thành một bộ phận cơ thể.
- source_word: עָלָיו
  choice: trên đó
  rationale: Đại từ quy chiếu về bàn thờ; “trên đó” giữ quan hệ không gian mà nguyên văn nêu.
theological_decisions:
- issue: Lý do cấm dùng bậc thang để lên bàn thờ
  choice: Giữ nguyên lý do được nêu trực tiếp là tránh để sự lõa lồ bị phơi ra trong quan hệ với bàn thờ.
  alternative: Giải thích lệnh cấm như biểu tượng của sự khiêm nhường, hoặc xác định riêng rằng sự phơi bày là do một kiểu lễ phục tư tế.
  rationale: Nguyên văn chỉ nói rõ mối quan tâm về việc lõa thể bị phơi ra; bản dịch không nên đưa thêm một ý nghĩa biểu tượng hay một hoàn cảnh y phục mà câu này không xác định.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và trực tiếp. Dùng “ngươi” trong lời luật phán với đối tượng số ít và “Ta” cho Đức Chúa Trời. Không thêm chú giải biểu tượng vào chính văn.
