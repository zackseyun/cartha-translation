  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: vi
  text: 'Rồi Đức Giê-hô-va phán với Môi-se: “Con hãy nói thế này với con cái Y-sơ-ra-ên[a]: Chính các con đã thấy rằng Ta đã phán với các con[b] từ trời[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các con trai của Y-sơ-ra-ên”; cụm từ này chỉ chung dân Y-sơ-ra-ên.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “phán cho các con.” Nguyên văn dùng giới từ “với,” nhấn mạnh cuộc gặp gỡ trực tiếp.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn có hình thức số nhiều: “từ các trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Rồi ... phán
  rationale: Dạng waw-consecutive tiếp nối diễn tiến tường thuật; “rồi” tự nhiên trong tiếng Việt, còn “phán” phù hợp với lời Đức Chúa Trời.
- source_word: יְהוָה
  choice: Đức Giê-hô-va
  rationale: Dùng cách gọi danh riêng truyền thống, quen thuộc và trang trọng trong tiếng Việt cho Tứ tự YHWH, thay vì thay bằng một tước hiệu chung.
- source_word: כֹּה תֹאמַר
  choice: Con hãy nói thế này
  rationale: Diễn đạt tự nhiên công thức sai phái truyền lời, đồng thời giữ lực mệnh lệnh của động từ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  rationale: Giữ hình ảnh gia tộc của cụm Hê-bơ-rơ, nhưng trong tiếng Việt có thể chỉ chung toàn thể dân, không chỉ nam giới.
- source_word: אַתֶּם רְאִיתֶם
  choice: Chính các con đã thấy
  rationale: “Chính” thể hiện sự nhấn mạnh của đại từ độc lập אַתֶּם; “đã thấy” diễn tả sự kiện họ trực tiếp chứng kiến.
- source_word: מִן הַשָּׁמַיִם
  choice: từ trời
  rationale: Danh từ Hê-bơ-rơ có hình thức số nhiều, nhưng “từ trời” là thành ngữ tiếng Việt tự nhiên trong ngữ cảnh này.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: Ta đã phán với các con
  rationale: “Với” phản ánh giới từ עִם và giữ sắc thái cuộc gặp gỡ trực tiếp; “phán” phù hợp chủ thể thần linh và văn phong trang trọng.
theological_decisions:
- issue: Cách chuyển dịch danh YHWH
  choice: Đức Giê-hô-va
  alternative: Yahweh; Đức Chúa Trời
  rationale: Bản Hê-bơ-rơ dùng danh riêng יְהוָה. Bản dịch giữ một hình thức danh riêng đã quen thuộc trong tiếng Việt, không thay bằng tước hiệu vốn làm mờ danh giao ước.
- issue: Phạm vi chỉ định của בְּנֵי יִשְׂרָאֵל
  choice: con cái Y-sơ-ra-ên
  alternative: dân Y-sơ-ra-ên; người Y-sơ-ra-ên; các con trai Y-sơ-ra-ên
  rationale: Cụm từ theo nghĩa sát là “các con trai/con cái của Y-sơ-ra-ên” nhưng ở đây chỉ cộng đồng giao ước. “Con cái Y-sơ-ra-ên” vừa giữ hình ảnh nguồn vừa tránh hàm ý sai rằng lời chỉ dành cho nam giới.
- issue: Sắc thái của עִמָּכֶם
  choice: phán với các con
  alternative: phán cho các con; phán cùng các con
  rationale: Giới từ עִם có nghĩa cơ bản là “với,” nhấn mạnh sự giao tiếp trực tiếp. Cách dịch không biến câu thành khẳng định về một cuộc đối thoại hai chiều nhiều hơn điều văn bản nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—con/các con” để thể hiện lời Đức Chúa Trời truyền qua Môi-se; giữ các tên riêng theo dạng Việt hóa quen thuộc. Các dấu chú thích [a], [b], [c] đều đặt ngay sau thành phần liên quan.
